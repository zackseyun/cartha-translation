  lexicon: HALOT
  rationale: חֲלֻצֵי는 전투를 위해 갖추고 선 사람들을 가리키므로, 직역적인 ‘무장한 자들’이 문맥의 군사성을 무리 없이 드러냅니다.
- source_word: יָרִיעוּ
  english_pob_choice: cry out
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 함성을 지릅니다
  - 외칩니다
  - 전투 함성을 지릅니다
  lexicon: HALOT
  rationale: 전투 맥락에서의 큰 외침이지만, 앞절과 같은 동사를 반복해 평행 구조를 살리는 것이 히브리어의 반복 효과를 잘 반영합니다.
- source_word: נַפְשׁוֹ יָרְעָה לּוֹ
  english_pob_choice: his soul trembles within him
  chosen_korean: 그의 혼은 그 안에서 떱니다
  alternatives_korean:
  - 그의 혼은 그 안에서 괴로워합니다
  - 그의 생명은 그 안에서 흔들립니다
  - 그의 혼은 그를 위해 심히 떱니다
  lexicon: HALOT
  rationale: 마지막 절은 난해하므로, נֶפֶשׁ을 ‘혼’으로 살리고 יָרַע 계열의 흔들림/떨림을 ‘떱니다’로 옮겨 내적 붕괴의 이미지를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 의미를 어떻게 처리할지
  chosen_reading: ‘그의 혼은 그 안에서 떱니다’로 본문형 읽기를 유지했습니다.
  alternative_readings:
  - ‘그의 혼은 그를 위해 괴로워합니다’
  - ‘그의 혼은 그 안에서 무너집니다’
  rationale: 히브리어는 해석이 분명하지 않지만, 의미를 단정적으로 풀기보다 본문의 긴장과 불확실성을 그대로 드러내는 것이 POB 원칙에 더 부합합니다.
  doctrine_reference: 시적 본문의 해석 불확실성 보존
- issue: 무장한 자들/전사들 가운데 어떤 표현을 택할지
  chosen_reading: ‘무장한 자들’로 번역했습니다.
  alternative_readings:
  - ‘전사들’
  - ‘군사들’
  rationale: 본문은 전투 준비 상태를 말하지만 특정 계급명보다 장비된 상태를 강조하므로, 과도한 군사화보다 원문 이미지에 가까운 표현을 택했습니다.
  doctrine_reference: 시적-군사적 이미지 보존
