  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּזְעַ֤ק חֶשְׁבּוֹן֙ וְ/אֶלְעָלֵ֔ה עַד יַ֖הַץ נִשְׁמַ֣ע קוֹלָ֑/ם עַל כֵּ֗ן חֲלֻצֵ֤י מוֹאָב֙ יָרִ֔יעוּ נַפְשׁ֖/וֹ יָ֥רְעָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
  footnotes:
  - marker: a
    text: Or 'the warriors of Moab shout.' The Hebrew term for 'armed men' can also be rendered more generally as 'warriors,' and the verb can be translated simply 'shout.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew; alternatively, 'his soul is distressed within him' or 'his soul trembles for him.'
    reason: alternative_reading
translation:
  language: ko
  text: 헤스본과 엘르알레가 부르짖습니다[a]. 그들의 소리가 야하스까지 들립니다. 그러므로 모압의 무장한 자들이 부르짖습니다[b]. 그의 혼은 그 안에서 떱니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 전사들이 외칩니다.’ 히브리어의 ‘무장한 자들’은 더 일반적으로 ‘전사들’로 옮길 수도 있고, 동사는 단순히 ‘외치다’로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 난해한 히브리어입니다. 대안으로 ‘그의 혼은 그 안에서 괴로워합니다’ 또는 ‘그의 혼은 그를 위해 떱니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  english_pob_choice: cry out
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 외칩니다
  - 울부짖습니다
  - 부르짖어 옵니다
  lexicon: HALOT
  rationale: זעק의 강한 비통/경고의 외침을 살리면서도 시가체의 긴박함을 유지하기 위해 ‘부르짖다’를 택했습니다.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  english_pob_choice: Heshbon and Elealeh
  chosen_korean: 헤스본과 엘르알레
  alternatives_korean:
  - 헤스본과 엘르알레아
  - 헤스본과 엘아렐레
  lexicon: 고유명사 표기 관행
  rationale: 지명은 의미 번역보다 음역이 원칙이므로 현대 외래어 표기 관행에 따라 옮겼습니다.
- source_word: חֲלֻצֵי מוֹאָב
  english_pob_choice: the armed men of Moab
  chosen_korean: 모압의 무장한 자들
  alternatives_korean:
  - 모압의 군사들
  - 모압의 전사들
  - 모압의 무장 병사들
  lexicon: HALOT
  rationale: חֲלֻצֵי는 전투를 위해 갖추고 선 사람들을 가리키므로, 직역적인 ‘무장한 자들’이 문맥의 군사성을 무리 없이 드러냅니다.
- source_word: יָרִיעוּ
  english_pob_choice: cry out
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 함성을 지릅니다
  - 외칩니다
  - 전투 함성을 지릅니다
  lexicon: HALOT
  rationale: 전투 맥락에서의 큰 외침이지만, 앞절과 같은 동사를 반복해 평행 구조를 살리는 것이 히브리어의 반복 효과를 잘 반영합니다.
- source_word: נַפְשׁוֹ יָרְעָה לּוֹ
  english_pob_choice: his soul trembles within him
  chosen_korean: 그의 혼은 그 안에서 떱니다
  alternatives_korean:
  - 그의 혼은 그 안에서 괴로워합니다
  - 그의 생명은 그 안에서 흔들립니다
  - 그의 혼은 그를 위해 심히 떱니다
  lexicon: HALOT
  rationale: 마지막 절은 난해하므로, נֶפֶשׁ을 ‘혼’으로 살리고 יָרַע 계열의 흔들림/떨림을 ‘떱니다’로 옮겨 내적 붕괴의 이미지를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 의미를 어떻게 처리할지
  chosen_reading: ‘그의 혼은 그 안에서 떱니다’로 본문형 읽기를 유지했습니다.
  alternative_readings:
  - ‘그의 혼은 그를 위해 괴로워합니다’
  - ‘그의 혼은 그 안에서 무너집니다’
  rationale: 히브리어는 해석이 분명하지 않지만, 의미를 단정적으로 풀기보다 본문의 긴장과 불확실성을 그대로 드러내는 것이 POB 원칙에 더 부합합니다.
  doctrine_reference: 시적 본문의 해석 불확실성 보존
- issue: 무장한 자들/전사들 가운데 어떤 표현을 택할지
  chosen_reading: ‘무장한 자들’로 번역했습니다.
  alternative_readings:
  - ‘전사들’
  - ‘군사들’
  rationale: 본문은 전투 준비 상태를 말하지만 특정 계급명보다 장비된 상태를 강조하므로, 과도한 군사화보다 원문 이미지에 가까운 표현을 택했습니다.
  doctrine_reference: 시적-군사적 이미지 보존
