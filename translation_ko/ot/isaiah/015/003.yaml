reference: Isaiah 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/חוּצֹתָ֖י/ו חָ֣גְרוּ שָׂ֑ק עַ֣ל גַּגּוֹתֶ֧י/הָ וּ/בִ/רְחֹבֹתֶ֛י/הָ כֻּלֹּ֥/ה יְיֵלִ֖יל יֹרֵ֥ד בַּ/בֶּֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/003.yaml
  text: In its streets they put on sackcloth; on its rooftops and in its squares everyone wails[a], going down in weeping.
  footnotes:
  - marker: a
    text: Or 'everyone wails, descending in tears.' The Hebrew literally says 'going down in weeping,' an image that may suggest either physical descent or being overcome with grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 거리에 그들은 굵은 베옷을 두르고, 그 지붕들과 광장들에서는 모두가 통곡하며, 울며 내려갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모두가 통곡하며, 눈물 속에 내려갑니다.’ 히브리어는 문자적으로 ‘울음 속에 내려감’이라고 하며, 물리적 하강 또는 슬픔에 짓눌린 상태를 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחוּצֹתָיו
  english_pob_choice: in its streets
  chosen_korean: 그 성읍의 거리
  alternatives_korean:
  - 그 바깥곳들
  - 그 열린 곳들
  lexicon: HALOT
  rationale: חוּץ는 도시의 바깥/공개 공간을 가리키며, 여기서는 장면상 ‘거리’가 가장 자연스럽고 공개적 애곡의 분위기를 잘 드러냅니다.
- source_word: חָגְרוּ שָׂק
  english_pob_choice: they put on sackcloth
  chosen_korean: 굵은 베옷을 두르고
  alternatives_korean:
  - 베옷을 입고
  - 베옷을 몸에 두르고
  lexicon: HALOT
  rationale: חגר는 본래 ‘띠다/두르다’의 뜻이므로, 단순히 ‘입다’보다 ‘두르다’가 동작을 더 가깝게 살립니다. שַׂק은 애곡의 표지인 거친 베옷이므로 ‘굵은 베옷’으로 옮겼습니다.
- source_word: עַל גַּגּוֹתֶיהָ וּבִרְחֹבֹתֶיהָ
  english_pob_choice: on its rooftops and in its squares
  chosen_korean: 그 지붕들과 광장들
  alternatives_korean:
  - 그 옥상들과 광장들
  - 그 집지붕들과 넓은 곳들
  lexicon: HALOT
  rationale: גַּגּוֹת는 평평한 지붕들을 가리키므로 ‘지붕들’이 무난하며, רְחוֹבוֹת는 넓은 공공장소를 가리켜 ‘광장들’이 의미를 잘 드러냅니다. 두 표현의 대조를 살리기 위해 둘을 구분해 옮겼습니다.
- source_word: יְיֵלִיל יֹרֵד בַּבֶּכִי
  english_pob_choice: everyone wails, going down in weeping
  chosen_korean: 모두가 통곡하며, 울며 내려갑니다
  alternatives_korean:
  - 모두가 울부짖으며, 눈물로 내려갑니다
  - 모두가 애곡하며, 울음 속에 내려갑니다
  lexicon: HALOT
  rationale: יְיֵלִיל은 강한 애통/통곡의 소리이므로 ‘통곡하다’가 적절합니다. יֹרֵד בַּבֶּכִי의 직역적 ‘내려감’ 이미지는 유지하되, 한국어에서는 ‘울며 내려갑니다’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 도시 전체의 애곡을 나타내는 분배적 표현 כֻּלֹּה의 처리
  chosen_reading: ‘모두가’로 옮겨 성읍 주민 전체의 집단적 통곡을 드러냈습니다.
  alternative_readings:
  - ‘온 성읍이’
  - ‘그 전체가’
  rationale: 문법적으로는 단수형이지만 문맥상 거주자 전체를 가리키는 분배적 표현이므로, 독자가 장면의 집단성을 즉시 이해하도록 ‘모두가’로 풀었습니다.
  doctrine_reference: 시적/예언서 본문의 집단적 수사
- issue: ‘내려갑니다’의 이미지 보존
  chosen_reading: 직역적 하강 이미지를 살려 ‘울며 내려갑니다’로 두었습니다.
  alternative_readings:
  - ‘눈물 속에 주저앉습니다’
  - ‘눈물로 무너집니다’
  rationale: 히브리어는 단순한 감정 표현이 아니라 ‘내려감’의 시각적 이미지를 포함하므로, 과도한 의역보다 원문의 상징성을 유지하는 쪽이 더 적절합니다.
  doctrine_reference: 시적 이미지와 서술 충실성
