  - 풀이 시들고, 초목이 사라졌으며, 푸른 것은 남아 있지 않기 때문입니다
  lexicon: HALOT
  rationale: חָצִיר, דֶשֶׁא, יֶרֶק의 세 겹의 쇠잔 이미지를 각각 ‘풀/초목/푸른 것’으로 구분해, 반복적 파괴의 누적을 살렸습니다.
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 무릇 … 때문입니다
  alternatives_korean:
