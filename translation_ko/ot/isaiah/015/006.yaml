translation:
  language: ko
  text: 니므림의 물이 황폐하게 될 것입니다[a]. 풀은 말랐고, 초목은 사라졌으며, 푸른 것은 하나도 남아 있지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐한 곳들이 될 것입니다.’ 히브리어 표현은 압축적이어서, 물 자체가 황폐해진다는 뜻일 수도 있고 물이 있는 지역이 황폐해진다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי נִמְרִים
