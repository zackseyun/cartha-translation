  lexicon: HALOT
  rationale: ‘되다’의 변화 뉘앙스를 살리되, מְשַׁמּוֹת의 복수성을 한국어에서 가장 압축적으로 드러내기 위해 ‘황폐함’으로 번역했습니다.
- source_word: יָבֵשׁ חָצִיר כָּלָה דֶשֶׁא יֶרֶק
  english_pob_choice: the grass is dried up, the vegetation is gone, and no green thing remains
  chosen_korean: 풀이 말랐고, 초목이 사라졌으며, 푸른 것마저 남지 않았기 때문입니다
