  - 왜냐하면 … 때문입니다
  lexicon: HALOT
  rationale: 첫 번째 כִּי의 설명적·인과적 기능을 한국어에서 자연스럽게 풀어, 앞절의 결과를 뒷받침하는 이유절로 연결했습니다.
theological_decisions:
- issue: 심판 예언의 문체와 톤
  chosen_reading: 직설적 예언 진술을 현대 한국어의 단정형과 이유절로 유지했습니다.
  alternative_readings:
  - 더 완곡한 묘사로 바꾸는 방식
  - 시적 표현을 크게 확장하는 방식
  rationale: 본문은 물이 황폐해지는 심판의 결과를 압축적으로 선포하므로, 의미를 완화하지 않고 예언의 단호함을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 이사야 15장 심판 신탁의 문맥
- issue: ‘푸른 것’의 포괄성
  chosen_reading: 특정 식물명으로 좁히지 않고 ‘푸른 것’으로 남겼습니다.
  alternative_readings:
  - 푸른 풀
  - 초록 식물
  rationale: 히브리어 יֶרֶק은 특정 종보다 ‘푸른 생기’를 넓게 가리키므로, 본문의 총체적 황폐를 보존하기 위해 포괄적으로 번역했습니다.
  doctrine_reference: 히브리 시어의 반복·병렬 구조
