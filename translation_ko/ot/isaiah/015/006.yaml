id: ISA.15.6
reference: Isaiah 15:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מֵ֥י נִמְרִ֖ים מְשַׁמּ֣וֹת יִֽהְי֑וּ כִּֽי יָבֵ֤שׁ חָצִיר֙ כָּ֣לָה דֶ֔שֶׁא יֶ֖רֶק לֹ֥א הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
  footnotes:
  - marker: a
    text: Or 'will be desolate' / 'will become a wasteland.' The Hebrew phrase is compact and may describe either the waters themselves as desolated or the area of the waters as becoming desolate.
    reason: lexical_alternative
translation:
  language: ko
  text: 무릇 니므림의 물은 황폐함이 되겠습니다[a]. 이는 풀이 말랐고, 초목이 사라졌으며, 푸른 것마저 남지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐하게 될 것입니다’ / ‘황무지가 될 것입니다.’ 히브리어 표현은 매우 압축적이어서, 물 자체가 황폐해진다는 뜻일 수도 있고 물이 있는 지역이 황폐해진다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי נִמְרִים
  english_pob_choice: the waters of Nimrim
  chosen_korean: 니므림의 물
  alternatives_korean:
  - 니므림의 물들
  - 니므림의 샘물
  lexicon: HALOT
  rationale: מֵי는 ‘물의’라는 소유/소속 구조이므로 한국어에서도 ‘니므림의 물’로 자연스럽게 옮겼고, 고유지명 נִמְרִים은 음역했습니다.
- source_word: מְשַׁמּוֹת יִהְיוּ
  english_pob_choice: will become desolations
  chosen_korean: 황폐함이 되겠습니다
  alternatives_korean:
  - 황폐한 곳이 되겠습니다
  - 황무지가 되겠습니다
  - 황폐해지겠습니다
  lexicon: HALOT
  rationale: ‘되다’의 변화 뉘앙스를 살리되, מְשַׁמּוֹת의 복수성을 한국어에서 가장 압축적으로 드러내기 위해 ‘황폐함’으로 번역했습니다.
- source_word: יָבֵשׁ חָצִיר כָּלָה דֶשֶׁא יֶרֶק
  english_pob_choice: the grass is dried up, the vegetation is gone, and no green thing remains
  chosen_korean: 풀이 말랐고, 초목이 사라졌으며, 푸른 것마저 남지 않았기 때문입니다
  alternatives_korean:
  - 풀이 말랐고, 초목이 다 없어졌으며, 푸른 것조차 남지 않았기 때문입니다
  - 풀이 시들고, 초목이 사라졌으며, 푸른 것은 남아 있지 않기 때문입니다
  lexicon: HALOT
  rationale: חָצִיר, דֶשֶׁא, יֶרֶק의 세 겹의 쇠잔 이미지를 각각 ‘풀/초목/푸른 것’으로 구분해, 반복적 파괴의 누적을 살렸습니다.
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 무릇 … 때문입니다
  alternatives_korean:
  - 이는 … 때문입니다
  - 왜냐하면 … 때문입니다
  lexicon: HALOT
  rationale: 첫 번째 כִּי의 설명적·인과적 기능을 한국어에서 자연스럽게 풀어, 앞절의 결과를 뒷받침하는 이유절로 연결했습니다.
theological_decisions:
- issue: 심판 예언의 문체와 톤
  chosen_reading: 직설적 예언 진술을 현대 한국어의 단정형과 이유절로 유지했습니다.
  alternative_readings:
  - 더 완곡한 묘사로 바꾸는 방식
  - 시적 표현을 크게 확장하는 방식
  rationale: 본문은 물이 황폐해지는 심판의 결과를 압축적으로 선포하므로, 의미를 완화하지 않고 예언의 단호함을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 이사야 15장 심판 신탁의 문맥
- issue: ‘푸른 것’의 포괄성
  chosen_reading: 특정 식물명으로 좁히지 않고 ‘푸른 것’으로 남겼습니다.
  alternative_readings:
  - 푸른 풀
  - 초록 식물
  rationale: 히브리어 יֶרֶק은 특정 종보다 ‘푸른 생기’를 넓게 가리키므로, 본문의 총체적 황폐를 보존하기 위해 포괄적으로 번역했습니다.
  doctrine_reference: 히브리 시어의 반복·병렬 구조
