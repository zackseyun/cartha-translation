  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
  footnotes:
  - marker: a
    text: Or 'will be desolate' / 'will become a wasteland.' The Hebrew phrase is compact and may describe either the waters themselves as desolated or the area of the waters as becoming desolate.
