  source_fidelity: 대체로 히브리어의 장소명, 애곡, 머리와 수염의 애도 표지는 보존했습니다. 그러나 עַל의 대상 용법은 한국어에서 ‘느보와 메드바 위로’보다 ‘느보와 메드바 때문에/두고’로 옮겨야 하며, בָּמוֹת의 제의적 의미는 ‘산당’이 더 정확합니다. קָרְחָה는 단순한 사람 분류인 ‘대머리’보다 머리가 벗겨진 애도 상태로 표현하는 편이 적절합니다.
  naturalness: ‘느보와 메드바 위로’는 현대 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘모든 머리에는 대머리가 있고’도 어색한 명사 중첩입니다. 도시명 ‘디본’을 집단적으로 주어로 삼는 시적 표현은 가능하므로 유지하되, 문장을 조금 다듬었습니다.
  terminology: ‘성전’은 문맥상 가능한 해석이지만 문자적으로는 ‘집’이므로 각주가 필요합니다. בָּמוֹת는 ‘높은 곳들’보다 한국어 성서 용례에 맞는 ‘산당들’이 제의적 의미를 더 잘 보존합니다. ‘통곡합니다’와 ‘수염은 잘렸습니다’는 적절합니다.
