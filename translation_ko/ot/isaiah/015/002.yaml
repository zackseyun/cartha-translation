id: ISA.15.2
reference: Isaiah 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלָ֨ה הַ/בַּ֧יִת וְ/דִיבֹ֛ן הַ/בָּמ֖וֹת לְ/בֶ֑כִי עַל נְב֞וֹ וְ/עַ֤ל מֵֽידְבָא֙ מוֹאָ֣ב יְיֵלִ֔יל בְּ/כָל רֹאשָׁ֣י/ו קָרְחָ֔ה כָּל זָקָ֖ן גְּרוּעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
  footnotes:
  - marker: a
    text: Or 'He has gone up to the house, and Dibon to the high places, for weeping.' The Hebrew 'the house' may be understood more literally, but in this context likely refers to a cultic shrine or temple.
    reason: lexical_alternative
  - marker: b
    text: '''Baldness'' and the cutting off of the beard are signs of mourning.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 성전[a]으로 올라갔고, 디본은 산당들로 올라가 울었습니다. 모압은 느보와 메드바 때문에 통곡합니다. 모든 머리가 벗겨지고[b], 모든 수염은 잘렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집’. 히브리어 ‘그 집’은 문자적으로는 집을 뜻하지만, 여기서는 산당들과 함께 언급되어 제의적 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 머리를 벗기고 수염을 자르는 것은 애도의 표지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 예배당
  lexicon: HALOT
  rationale: 문맥상 ‘집’의 직역보다 제의적 장소인 ‘성전’이 의미를 더 분명하게 전달합니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 높은 곳들
  alternatives_korean:
  - 산당
  - 높은 곳
  lexicon: HALOT
  rationale: 히브리어 במות의 제의적 용법을 살리되, 한국어에서 관용적으로 굳은 ‘산당’보다 본문의 이미지가 드러나는 직역형을 택했습니다.
- source_word: יְיֵלִיל
  english_pob_choice: wails
  chosen_korean: 통곡합니다
  alternatives_korean:
  - 울부짖습니다
  - 울부짖고 있습니다
  lexicon: HALOT
  rationale: 강한 애곡의 동사를 한국어에서 가장 자연스럽고 강하게 드러내는 말로 옮겼습니다.
- source_word: קָרְחָה
  english_pob_choice: baldness
  chosen_korean: 대머리가 있고
  alternatives_korean:
  - 대머리입니다
  - 머리가 벗겨졌고
  lexicon: HALOT
  rationale: 머리를 미는 애도 관습을 유지하면서 명사형의 상태를 한국어로 자연스럽게 표현했습니다.
- source_word: גְּרוּעָה
  english_pob_choice: is cut off
  chosen_korean: 깎였습니다
  alternatives_korean:
  - 잘려 있습니다
  - 깎여 있습니다
  lexicon: HALOT
  rationale: 수염을 잘라내는 애도 표지를 한국어에서 가장 직접적으로 옮겼습니다.
theological_decisions:
- issue: 모압의 애통을 묘사하는 제의적·애도적 이미지
  chosen_reading: 본문의 장소명과 애도 표지를 그대로 살려, 재난 앞에서 모압이 신전과 높은 곳에서 통곡하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 이동 서술로 약화시키는 읽기
  - ‘산당’을 일반 산지로 완화하는 읽기
  rationale: 히브리어 문맥은 제의적 장소와 애도 관습을 함께 드러내므로, 그 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 이사야 15장 심판 예언의 문맥
- issue: ‘대머리’와 수염 절단의 애도 표지
  chosen_reading: 머리의 대머리와 수염의 절단을 문화적 애도 행위로 이해해 본문에 반영했습니다.
  alternative_readings:
  - 단순 외모 묘사로 보는 읽기
  - 과장된 비유로만 처리하는 읽기
  rationale: 본문 자체가 애도 표지를 뜻하는 문화적 관습을 가리키므로, 이를 주석 없이 흐리지 않고 보존했습니다.
  doctrine_reference: 고대 근동 애도 관습
