  - 그녀의 도망자들
  lexicon: HALOT
  rationale: 문맥상 도피하는 무리로 이해하는 POB의 해석을 따르되, 한국어에서는 모압 공동체를 가리키는 집합적 표현으로 ‘그들의 도망자들’을 썼습니다.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  english_pob_choice: Eglath-shelishiyah
  chosen_korean: 에글랏-셀리시야
  alternatives_korean:
