  lexicon: HALOT
  rationale: 지형과 이동 경로를 드러내는 표현이므로 ‘비탈’로 옮겨, ‘올라간다’는 동사와 자연스럽게 맞물리게 했습니다.
- source_word: בִּבְכִי
