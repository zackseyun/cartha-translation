  - 에글랏 세리시야
  lexicon: HALOT
  rationale: 지명일 가능성이 높다는 POB의 판단에 따라 음역을 유지해, 본문에서 불확실한 어원 해석을 확정하지 않았습니다.
- source_word: מַעֲלֵה הַלּוּחִית
  english_pob_choice: the ascent of Luhith
  chosen_korean: 루힛의 비탈
  alternatives_korean:
