reference: Isaiah 15:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִבִּ/י֙ לְ/מוֹאָ֣ב יִזְעָ֔ק בְּרִיחֶ֕/הָ עַד צֹ֖עַר עֶגְלַ֣ת שְׁלִשִׁיָּ֑ה כִּ֣י מַעֲלֵ֣ה הַ/לּוּחִ֗ית בִּ/בְכִי֙ יַֽעֲלֶה בּ֔/וֹ כִּ֚י דֶּ֣רֶךְ חוֹרֹנַ֔יִם זַעֲקַת שֶׁ֖בֶר יְעֹעֵֽרוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
  footnotes:
  - marker: a
    text: Hebrew בְּרִיחֶיהָ is difficult. It may mean 'her fugitives/refugees,' as rendered here, or more literally 'her bars,' which some take metaphorically or emend in light of the context.
    reason: lexical_alternative
  - marker: b
    text: Eglath-shelishiyah is likely a place name. The expression could also be understood literally as 'a three-year-old heifer.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verbs in this verse shift between singular and plural forms; the translation smooths them to reflect the collective movement of Moab's people.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 마음이 모압을 위해 부르짖습니다[a]. 그들의 도망자들은 소알과 에글랏-셀리시야까지 달아납니다[b]. 그들은 울며 루힛의 비탈로 올라가고[c], 호로나임 길에서는 파괴의 외침을 높입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְמוֹאָב의 방향/대상 관계를 따라 ‘모압을 위해’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בְּרִיחֶיהָ는 ‘도망자들/피난민들’로 이해할 수 있으나, 문자적으로는 ‘그의 빗장들’이라는 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 עֶגְלַת שְׁלִשִׁיָּה는 지명으로 볼 수 있으나, 문자적으로는 ‘세 살 된 암소’라는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי / לְמוֹאָב יִזְעָק
  english_pob_choice: My heart cries out for Moab
  chosen_korean: 내 마음이 모압을 위해 부르짖습니다
  alternatives_korean:
  - 내 속이 모압을 위해 부르짖습니다
  - 내 마음이 모압 때문에 부르짖습니다
  lexicon: HALOT
  rationale: לִבִּי의 भाव정적 중심을 ‘내 마음’으로 살리고, לְמוֹאָב의 대상을 ‘~을 위해’로 옮겨 애도와 탄원의 방향을 드러냈습니다.
- source_word: בְּרִיחֶיהָ
  english_pob_choice: her fugitives
  chosen_korean: 그들의 도망자들
  alternatives_korean:
  - 그의 빗장들
  - 그들의 피난민들
  - 그녀의 도망자들
  lexicon: HALOT
  rationale: 문맥상 도피하는 무리로 이해하는 POB의 해석을 따르되, 한국어에서는 모압 공동체를 가리키는 집합적 표현으로 ‘그들의 도망자들’을 썼습니다.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  english_pob_choice: Eglath-shelishiyah
  chosen_korean: 에글랏-셀리시야
  alternatives_korean:
  - 세 살 된 암소
  - 에글랏 세리시야
  lexicon: HALOT
  rationale: 지명일 가능성이 높다는 POB의 판단에 따라 음역을 유지해, 본문에서 불확실한 어원 해석을 확정하지 않았습니다.
- source_word: מַעֲלֵה הַלּוּחִית
  english_pob_choice: the ascent of Luhith
  chosen_korean: 루힛의 비탈
  alternatives_korean:
  - 루힛의 오르막
  - 루힛의 산길
  lexicon: HALOT
  rationale: 지형과 이동 경로를 드러내는 표현이므로 ‘비탈’로 옮겨, ‘올라간다’는 동사와 자연스럽게 맞물리게 했습니다.
- source_word: בִּבְכִי
  english_pob_choice: with weeping
  chosen_korean: 울며
  alternatives_korean:
  - 울음으로
  - 흐느끼며
  lexicon: HALOT
  rationale: 전치사와 명사를 한국어 동작 부사형으로 풀어, 애도의 동시성을 간결하게 드러냈습니다.
- source_word: זַעֲקַת שֶׁבֶר יְעֹעֵרוּ
  english_pob_choice: they raise a cry of destruction
  chosen_korean: 파괴의 외침을 높입니다
  alternatives_korean:
  - 멸망의 외침을 높입니다
  - 붕괴의 외침을 일으킵니다
  lexicon: HALOT
  rationale: שֶׁבֶר를 단순한 ‘금’이 아니라 재난·붕괴의 의미로 보고, יְעֹעֵרוּ를 ‘높이다/일으키다’ 중 자연스러운 시어로 옮겼습니다.
theological_decisions:
- issue: 문장의 시제와 예언 시의 현재성
  chosen_reading: 예언적 시의 현재형으로 번역해, 애도와 비탄이 지금 일어나는 것처럼 들리게 했습니다.
  alternative_readings:
  - 과거형으로 옮기기
  - 미래형으로 옮기기
  rationale: 히브리어 시구의 생동감을 살리기 위해 한국어에서도 현재적 서술을 택했습니다.
  doctrine_reference: 예언시의 수사적 현재
