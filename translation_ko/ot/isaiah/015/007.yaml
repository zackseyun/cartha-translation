id: ISA.15.7
reference: Isaiah 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֖ן יִתְרָ֣ה עָשָׂ֑ה וּ/פְקֻדָּתָ֔/ם עַ֛ל נַ֥חַל הָ/עֲרָבִ֖ים יִשָּׂאֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
  footnotes:
  - marker: a
    text: Or 'over the wadi of the Arabah' / 'over the valley of the desert plains.' The Hebrew expression is uncertain; the traditional rendering is 'Brook of the Willows.'
    reason: alternative_reading
  - marker: b
    text: The phrase rendered 'what they have stored up' is difficult Hebrew and may also mean 'their possessions' or 'what was entrusted to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들이 얻은 풍성한 것과 그들이 저장해 둔 것을 그들은 버드나무 시내를 건너 옮겨 갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아라바의 와디’ / ‘사막 평원의 골짜기’입니다. 히브리어 표현은 확실하지 않으며, 전통적 번역은 ‘버드나무 시내’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘저장해 둔 것’으로 옮긴 표현은 히브리어상 어려우며, ‘그들의 소유물’ 또는 ‘그들에게 맡겨진 것’이라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה
  english_pob_choice: the abundance
  chosen_korean: 풍성한 것
  alternatives_korean:
  - 남은 것
  - 여분
  - 재물
  lexicon: HALOT
  rationale: 문맥상 도망하며 옮겨 가는 누적된 소유를 가리키므로, 단순한 ‘남은 것’보다 소유의 많음을 드러내는 ‘풍성한 것’이 자연스럽습니다.
- source_word: עָשָׂה
  english_pob_choice: they have gained
  chosen_korean: 얻은
  alternatives_korean:
  - 만든
  - 획득한
  - 모은
  lexicon: HALOT
  rationale: 동사가 직역상 ‘만들다’이지만 여기서는 앞 명사와 결합해 축적한 소유를 뜻하므로, 한국어로는 결과를 분명히 하는 ‘얻은’이 적절합니다.
- source_word: וּפְקֻדָּתָם
  english_pob_choice: what they have stored up
  chosen_korean: 저장해 둔 것
  alternatives_korean:
  - 그들의 저장물
  - 맡겨진 것
  - 소유한 것
  lexicon: HALOT
  rationale: 의미가 어려운 표현이므로, 축적해 보관한 물건이라는 문맥적 가능성을 살려 ‘저장해 둔 것’으로 옮겼습니다.
- source_word: נַחַל הָעֲרָבִים
  english_pob_choice: Brook of the Willows
  chosen_korean: 버드나무 시내
  alternatives_korean:
  - 버드나무 개천
  - 아라바 골짜기
  - 사막 평원의 시내
  lexicon: HALOT
  rationale: 주본문은 전통적 지명을 따르는 표현이지만, 영어 주해처럼 히브리어 표현이 불확실하므로 본문에는 가장 익숙한 지형어로 옮기고 대안은 각주로 처리했습니다.
- source_word: יִשָּׂאֻם
  english_pob_choice: they carry away
  chosen_korean: 옮겨 갑니다
  alternatives_korean:
  - 메고 갑니다
  - 지니고 갑니다
  - 실어 갑니다
  lexicon: HALOT
  rationale: 소유물을 들고 떠나는 장면을 자연스럽게 나타내기 위해 ‘carry away’의 이동성을 살린 ‘옮겨 갑니다’를 택했습니다.
theological_decisions:
- issue: 지명/표현의 불확실성 반영
  chosen_reading: 본문에는 ‘버드나무 시내’를 두고, 각주에서 히브리어가 ‘아라바의 와디’ 또는 ‘사막 평원의 골짜기’일 가능성을 밝힙니다.
  alternative_readings:
  - 전통적 ‘버드나무 시내’만 유지
  - ‘아라바 시내’로 직접 번역
  rationale: 히브리어 הָעֲרָבִים은 전통적 지명으로도, 지리적 설명으로도 이해될 수 있어 본문을 단정하지 않고 주해 가능한 여지를 남깁니다.
  doctrine_reference: 본문비평/주해 원칙
