id: ISA.15.8
reference: Isaiah 15:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
  footnotes:
  - marker: a
    text: Or 'has encircled the border of Moab.' The Hebrew verb preserves the image of the cry going all around Moab.
    reason: lexical_alternative
  - marker: b
    text: Beer-elim is a place name, possibly meaning 'Well of Elim' or 'Well of the mighty ones.'
    reason: cultural_note
translation:
  language: ko
  text: 외침이 모압의 경계를 두루 돌아 퍼졌습니다[a]. 그 울부짖음은 에글라임까지 이르렀고, 그 울부짖음은 브엘엘림[b]까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 경계를 에워쌌습니다’로 옮길 수 있습니다. 히브리어 동사는 외침이 모압의 경계 전체를 두루 도는 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 브엘엘림은 지명이며, ‘엘림의 우물’ 또는 ‘강한 자들의 우물’이라는 뜻일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִקִּיפָה
  english_pob_choice: has gone around
  chosen_korean: 두루 돌아간
  alternatives_korean:
  - 둘러싼
  - 에워싼
  - 둘러 돌아간
  lexicon: HALOT
  rationale: 외침이 모압의 경계를 따라 퍼져 나가며 ‘둘러감’의 이미지를 보존해야 하므로, 자연스러운 합쇼체 문맥에서 ‘두루 돌아간’으로 옮겼습니다.
- source_word: הַזְּעָקָה
  english_pob_choice: the outcry
  chosen_korean: 외침
  alternatives_korean:
  - 부르짖음
  - 통곡
  - 절규
  lexicon: HALOT
  rationale: זְעָקָה는 단순한 소리보다 고통의 호소를 가리키므로, 공적인 비탄의 힘을 살리면서도 과도하게 감정화하지 않는 ‘외침’을 택했습니다.
- source_word: יִלְלָתָהּ
  english_pob_choice: its wailing
  chosen_korean: 울부짖음
  alternatives_korean:
  - 통곡
  - 울음
  - 애곡
  lexicon: HALOT
  rationale: ‘wailing’의 반복을 한국어에서 살리기 위해 두 번째 항목은 더 강한 비탄의 어감이 있는 ‘울부짖음’으로 구분했습니다.
- source_word: אֶגְלַיִם / בְּאֵר אֵילִים
  english_pob_choice: Eglaim / Beer-elim
  chosen_korean: 에글라임 / 브엘엘림
  alternatives_korean:
  - 에글라임 / 베엘엘림
  - 에글라임 / 브엘-엘림
  lexicon: 고유명사 표기
  rationale: 지명은 현대 외래어 표기법에 따라 음역하되, 이미 통용되는 성경식 표기를 우선해 각각 ‘에글라임’, ‘브엘엘림’으로 적었습니다.
theological_decisions:
- issue: 시적 평행구조에서 동일 어근 반복을 어떻게 처리할지
  chosen_reading: ‘외침’과 ‘울부짖음’을 구분해 반복을 과도하게 평준화하지 않았습니다.
  alternative_readings:
  - 두 곳 모두 ‘울음’으로 통일
  - 두 곳 모두 ‘애곡’으로 통일
  rationale: 히브리어는 같은 비탄의 흐름을 두 번 말하지만, 한국어는 동일어 반복이 다소 평평하게 들릴 수 있어, 의미를 유지하면서도 청각적 변화를 주는 쪽이 시적 효과를 더 잘 드러냅니다.
  doctrine_reference: 시편·예언서의 시적 병행법 보존
