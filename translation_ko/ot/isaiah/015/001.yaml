  - 오라클
  - 선포
  lexicon: HALOT
  rationale: 이 절은 심판 예언의 표제이므로, 현대 한국어에서 즉각 이해되는 표지로 ‘경고’를 택해 단순한 제목이 아니라 임박한 심판 선언임을 드러냈습니다.
- source_word: בְּלֵיל
  english_pob_choice: in a night
  chosen_korean: 한밤중에
  alternatives_korean:
