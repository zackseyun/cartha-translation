  rationale: 히브리어의 짧고 급작스러운 시간을 살리면서도, 한국어에서 순간적 붕괴를 강하게 전달하는 표현으로 옮겼습니다.
- source_word: שֻׁדַּד
  english_pob_choice: is devastated
  chosen_korean: 황폐되었기
  alternatives_korean:
