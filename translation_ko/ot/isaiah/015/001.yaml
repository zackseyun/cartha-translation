  - 유린되었기
  - 멸망되었기
  lexicon: HALOT
  rationale: 도시가 전쟁으로 철저히 황폐해진 상태를 나타내므로 ‘황폐되다’가 문맥과 가장 잘 맞습니다.
- source_word: נִדְמָה
  english_pob_choice: it is silenced
  chosen_korean: 무너졌기
  alternatives_korean:
  - 침묵했기
  - 끊어졌기
  - 쓰러졌기
  - 멸절되었기
  lexicon: HALOT
  rationale: 본문의 병행구조에서 두 번째 동사는 첫 번째 파괴 진술을 보강하는 역할이므로, 실제 붕괴 결과를 드러내는 ‘무너지다’로 옮겼습니다.
theological_decisions:
- issue: 예언 표제인 מַשָּׂא의 번역
  chosen_reading: ‘모압에 대한 경고’로 옮겨, 단순한 중립적 제목보다 심판의 성격이 분명히 드러나게 했습니다.
  alternative_readings:
  - ‘모압에 대한 오라클’
  - ‘모압에 대한 예언’
  - ‘모압에 대한 선언’
  rationale: 이 구절은 이사야의 심판 신탁 도입부이므로, 독자가 내용을 즉시 오해 없이 읽도록 경고적 뉘앙스를 반영했습니다.
  doctrine_reference: 예언서의 신탁 표제와 심판 선언의 기능
