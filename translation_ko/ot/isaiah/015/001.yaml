source:
  edition: WLC
  text: מַשָּׂ֖א מוֹאָ֑ב כִּ֠י בְּ/לֵ֞יל שֻׁדַּ֨ד עָ֤ר מוֹאָב֙ נִדְמָ֔ה כִּ֗י בְּ/לֵ֛יל שֻׁדַּ֥ד קִיר מוֹאָ֖ב נִדְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
  footnotes:
  - marker: a
    text: Or 'burden' or 'pronouncement' concerning Moab for מַשָּׂא; here rendered 'oracle' as a prophetic heading.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase literally says 'in a night,' emphasizing sudden destruction within a single night; 'overnight' is a possible idiomatic rendering.
    reason: lexical_alternative
  - marker: c
    text: The verb rendered 'it is silenced' can also be understood as 'it is cut off' or 'it is destroyed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압에 관한 신탁입니다. 밤에 모압의 아르가 약탈당하여 멸망하였기 때문입니다.[a][b] 밤에 모압의 기르가 약탈당하여 멸망하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘밤에’라고 말합니다. 하룻밤 사이에 일어난 급작스러운 파괴를 강조하는 표현으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸망하였기’로 옮긴 히브리어 동사는 ‘잠잠해지다’, ‘끊어지다’, ‘파괴되다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
