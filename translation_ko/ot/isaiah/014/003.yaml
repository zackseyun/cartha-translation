id: ISA.14.3
reference: Isaiah 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/י֨וֹם הָנִ֤יחַ יְהוָה֙ לְ/ךָ֔ מֵֽ/עָצְבְּ/ךָ֖ וּ/מֵ/רָגְזֶ֑/ךָ וּ/מִן הָ/עֲבֹדָ֥ה הַ/קָּשָׁ֖ה אֲשֶׁ֥ר עֻבַּד בָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
  footnotes:
  - marker: a
    text: Or 'from your sorrow' for 'from your pain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the harsh labor ... that was imposed on you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 야훼께서 너를 네 고통과 네 혼란에서, 그리고 네가 강제로 부림을 당한 그 কঠ한 노동에서 쉬게 하실 때가 올 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통’은 원어 עצב의 의미를 따라 잡은 번역이며, 문맥상 ‘슬픔’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노동’은 ‘hard service’를 압제적 노동으로 드러낸 번역이며, ‘가혹한 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 때가 올 것입니다
  alternatives_korean:
  - 그 일이 있을 것입니다
  - 그리고 그것이 될 것입니다
  lexicon: HALOT
  rationale: 예언적 전환을 자연스러운 미래 표현으로 옮기되, 히브리어의 서두 표지를 유지했습니다.
- source_word: בְּיוֹם
  english_pob_choice: in the day when
  chosen_korean: 그날에
  alternatives_korean:
  - 그날에 일어날 때
  - 그날에 있을 때
  lexicon: HALOT
  rationale: 직역형의 ‘그날에’로 시간 구문을 간결하게 살리면서 한국어 문장 흐름을 자연스럽게 했습니다.
- source_word: הָנִיחַ
  english_pob_choice: gives you rest
  chosen_korean: 쉬게 하실
  alternatives_korean:
  - 안식하게 하실
  - 휴식을 주실
  lexicon: HALOT
  rationale: נוח의 사역형 의미를 반영해 단순한 위로보다 실제적 ‘쉼’의 부여를 드러냈습니다.
- source_word: מֵעָצְבְּךָ וּמֵרָגְזֶךָ
  english_pob_choice: from your pain and your turmoil
  chosen_korean: 네 고통과 네 혼란
  alternatives_korean:
  - 네 아픔과 네 소란
  - 네 슬픔과 네 동요
  lexicon: HALOT
  rationale: עצב과 רגז의 포괄적 의미를 살려, 감정적 슬픔으로 좁히지 않고 압박 아래의 고통과 내적 혼란을 함께 담았습니다.
- source_word: הָעֲבֹדָה הַקָּשָׁה אֲשֶׁר עֻבַּד בָּךְ
  english_pob_choice: the hard service with which you were made to serve
  chosen_korean: 네가 강제로 부림을 당한 그 কঠ한 노동
  alternatives_korean:
  - 네게 지워진 그 მძიმე한 노동
  - 네게 강요된 그 سخت한 일
  lexicon: HALOT
  rationale: עֲבֹדָה를 단순한 ‘봉사’보다 압제적 ‘노동’으로 옮기고, 수동형 עֻבַּד의 강제성을 ‘강제로 부림을 당한’으로 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 하나님의 이름을 사용하므로, 프로젝트 기준에 따라 관용적 대체어가 아닌 고유명 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
