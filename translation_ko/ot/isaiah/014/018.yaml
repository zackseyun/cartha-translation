translation:
  language: ko
  text: 모든 민족의 왕들이 모두 존귀하게[a] 각기 자기 집[b]에 누워 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광 가운데’ 또는 ‘명예롭게’.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘집’은 왕의 무덤 또는 묘실을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל / כֻּלָּם
  english_pob_choice: All ... all of them
  chosen_korean: 모든 ... 그들 모두가
  alternatives_korean:
  - 각각 모두
  - 온전히 모두
  lexicon: HALOT
  rationale: 첫 번째 כָּל의 총괄성과 뒤따르는 כֻּלָּם의 재강조를 한국어에서도 분리해 드러내어, 단순한 반복이 아니라 강조 효과가 보이도록 했습니다.
- source_word: מַלְכֵי גוֹיִם
  english_pob_choice: the kings of the nations
  chosen_korean: 민족들의 왕들
  alternatives_korean:
  - 나라들의 왕들
  - 열방의 왕들
  lexicon: HALOT
  rationale: גוֹיִם을 문맥상 ‘민족들’로 옮겨 이방 민족 통치자들을 가리키는 대조를 살렸으며, ‘열방’은 교회어조가 강해 본문의 직접성을 조금 낮출 수 있어 피했습니다.
- source_word: שָׁכְבוּ בְכָבוֹד
  english_pob_choice: lie in glory
  chosen_korean: 영광 가운데 누워 있습니다
  alternatives_korean:
  - 영광 속에 누워 있습니다
  - 명예롭게 누워 있습니다
  lexicon: HALOT
  rationale: 장례 맥락의 ‘누워 있다’를 유지하되, בְכָבוֹד의 상태를 ‘영광 가운데’로 옮겨 본문의 장례적 존귀를 직접 드러냈습니다. ‘명예롭게’는 의미는 자연스럽지만 보다 해석적입니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: in his own house
  chosen_korean: 자기 집에서
  alternatives_korean:
  - 그의 집에서
  - 자기 무덤에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 따라 ‘집’으로 옮기되, 문맥상 무덤이나 장지일 가능성은 유지했습니다. 소유격 ‘자기’는 각 왕의 개별성을 분명하게 합니다.
theological_decisions:
- issue: 장례/무덤 이미지의 처리
  chosen_reading: 본문은 ‘집’을 유지하면서도, 그 ‘집’이 존귀한 매장처를 암시하는 시적 표현으로 읽힙니다.
  alternative_readings:
  - 직역하여 실제 거처로 이해
  - ‘무덤’으로 명시하여 해석
  rationale: 히브리어가 실제로 ‘집’이라고 말하므로 본문 이미지를 보존하는 것이 우선입니다. 동시에 문맥은 죽은 왕들의 매장 상태를 말하므로, 한국어 본문에서는 은유를 살리고 주석 없이 해석을 단정하지 않았습니다.
  doctrine_reference: 시적/예언적 비유의 보존
- issue: ‘영광’의 의미 범위
  chosen_reading: ‘영광’은 내적 영적 영광이 아니라 왕들의 존귀한 장례 상태를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - ‘명예’로 완화
  - ‘존귀’로 의역
  rationale: כָּבוֹד의 기본어감을 유지해야 본문이 가진 아이러니—가장 높은 왕들도 결국 장지에 누운다는 사실—이 살아납니다.
  doctrine_reference: 어휘의 문맥적 의미
