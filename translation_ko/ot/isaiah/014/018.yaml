  naturalness: 현 초안의 쉼표로 분리된 ‘모든 민족의 왕들이, 그들 모두가,’는 한국어 문장 흐름상 다소 부자연스럽습니다. ‘왕들이 모두’로 재강조를 자연스럽게 살릴 수 있습니다. ‘장례용 방’도 일반적인 한국어 성경 주석 표현으로는 다소 어색하여 ‘묘실’이 적절합니다.
