  to: 그러나 당신은 스올[a]로 끌어내려질 것입니다, 곧 구덩이의 깊은 곳으로.
  rationale: 수동 미래형 תּוּרָד를 ‘끌어내려질 것입니다’로 옮겨 원문의 수동성과 심판적 하강을 보존했습니다. 뒤의 전치사구는 ‘곧’으로 연결하여 스올과 구덩이의 깊은 곳이 이루는 시적 병행 및 설명 관계를 자연스럽게 나타냈습니다.
