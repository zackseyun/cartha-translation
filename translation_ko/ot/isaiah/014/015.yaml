lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 오직
  lexicon: HALOT
  rationale: 앞선 교만한 상승 선언과의 급격한 반전을 살리기 위해 역접 접속사로 옮겼습니다. '그러나'는 문맥의 대비를 자연스럽게 드러냅니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 나라
  - 저승
  lexicon: HALOT
  rationale: 히브리어 अवध념을 평평하게 '무덤'으로 풀지 않고 음역해, 본문이 말하는 지하세계/죽은 자들의 영역을 유지했습니다.
- source_word: תּוּרָ֖ד
  english_pob_choice: you will be brought down
  chosen_korean: 끌려 내려가며
  alternatives_korean:
  - 내려가게 될 것입니다
  - 끌어내려질 것입니다
  - 낮아질 것입니다
  lexicon: HALOT
  rationale: Hophal형의 수동·사역 뉘앙스를 살려, 단순한 자발적 하강보다 ‘끌려 내려감’의 심판적 역전을 드러냈습니다.
- source_word: יַרְכְּתֵי
  english_pob_choice: the depths of
  chosen_korean: 깊은 곳으로
  alternatives_korean:
  - 깊숙한 곳으로
  - 가장 깊은 자리로
  - 숨은 곳으로
  lexicon: HALOT
  rationale: ‘가장 안쪽/가장 깊은 부분’을 가리키는 표현으로서, 현대 한국어의 자연스러운 공간 이미지인 ‘깊은 곳’으로 옮겼습니다.
- source_word: בּוֹר
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 함정
  - 구렁
  lexicon: HALOT
  rationale: 시적 병행에서 שְׁאוֹל과 구별되는 하강의 공간을 살리기 위해, 감옥·무덤보다 ‘구덩이’가 더 직접적이라고 보았습니다.
theological_decisions:
- issue: שְׁאוֹל의 한국어 표기와 의미 범위
  chosen_reading: 스올로 음역하여 유지했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 나라
  - 저승
  rationale: 본문은 심판의 하강 이미지를 통해 지하세계의 실재를 말하지만, 그 의미를 단순한 매장지나 후대의 체계화된 지옥 개념으로 환원하지 않습니다. 음역은 이런 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
