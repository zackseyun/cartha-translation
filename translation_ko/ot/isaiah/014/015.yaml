    rationale: תּוּרָד는 ‘당신은 끌어내려질 것입니다/내려가게 될 것입니다’라는 단일 수동 미래 서술입니다. ‘끌어내려질 것입니다’는 수동·사역적 심판의 역전과 합쇼체 문장 종결을 모두 명확히 합니다.
