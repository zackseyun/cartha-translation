id: ISA.14.24
reference: Isaiah 14:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
  footnotes:
  - marker: a
    text: Or, 'The LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew oath idiom: literally ''if not,'' functioning here as a strong affirmation (''surely'' or ''indeed'').'
    reason: lexical_alternative
  - marker: c
    text: Or, 'just as I have thought/intended.'
    reason: lexical_alternative
  - marker: d
    text: Or, 'just as I have counseled/resolved, it will be established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서[a] 맹세하시며 말씀하셨습니다. “내가 계획한 바는 반드시 그대로 이루어지고, 내가 결정한 바는 반드시 서게 될 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 주’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 관례적 대체어가 아니라 고유명사로 보아 야훼로 옮기고, צְבָאוֹת은 '군대들/군대의 주재'의 직역보다 한국어에서 자연스럽고 전쟁적 위엄을 드러내는 '만군의'로 처리했습니다.
- source_word: נִשְׁבַּע
  english_pob_choice: has sworn
  chosen_korean: 맹세하시며
  alternatives_korean:
  - 맹세하셨습니다
  - 서약하셨습니다
  lexicon: HALOT
  rationale: 완료형의 맹세 행위를 선포문맥에 맞게 현재적 전달로 살리기 위해 동사형 '맹세하시며'를 택해 뒤의 직접화법을 자연스럽게 이었습니다.
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 반드시
  alternatives_korean:
  - 참으로
  - 정녕
  lexicon: HALOT
  rationale: 맹세 관용구로서의 אִם לֹא는 조건문이 아니라 강한 확언이므로, 한국어에서는 오해 소지가 있는 직역 대신 '반드시'로 그 힘을 드러냈습니다.
- source_word: דִּמִּיתִי
  english_pob_choice: have planned
  chosen_korean: 계획한 바
  alternatives_korean:
  - 생각한 바
  - 의도한 바
  - 헤아린 바
  lexicon: HALOT
  rationale: '''생각하다''의 단순 인지보다 의도적 결정을 드러내기 위해 POB의 ''have planned''에 맞춰 ''계획한 바''로 옮겼습니다.'
- source_word: יָעַצְתִּי
  english_pob_choice: have purposed
  chosen_korean: 결정한 바
  alternatives_korean:
  - 결심한 바
  - 권고한 바
  - 뜻한 바
  lexicon: HALOT
  rationale: 이 동사는 상담/의결/결심의 의미를 가지므로, 앞의 '계획한 바'와 평행을 이루면서도 확정성을 보이는 '결정한 바'로 구분했습니다.
theological_decisions:
- issue: יהוה צְבָאוֹת의 고유명사와 호칭 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 주
  - 여호와 만군
  rationale: 본문은 야훼의 맹세를 강조하므로, 단순 칭호인 '주'보다 고유명사 야훼를 드러내는 것이 원문의 인격성과 언약적 엄중함을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אִם לֹא의 맹세 관용구 처리
  chosen_reading: 반드시
  alternative_readings:
  - 참으로
  - 정녕
  - 만일 아니면
  rationale: 히브리어 맹세 공식의 조건적 외형을 그대로 살리면 뜻이 흐려지므로, 확언의 기능을 한국어에서 가장 직접적으로 전달하는 '반드시'를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; optimal equivalence'
