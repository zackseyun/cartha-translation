source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
  footnotes:
  - marker: a
    text: Or 'the seed of evildoers' or 'the descendants of the wicked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그들과 함께 무덤에 묻히지 못할 것입니다. 이는 당신이 당신의 땅을 멸망시키고, 당신의 백성을 죽였기 때문입니다. 악을 행하는 자의 후손은 영원히 이름이 불리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악을 행하는 자의 후손’은 ‘악인들의 씨’ 또는 ‘사악한 자의 자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  english_pob_choice: you will not be joined with them in burial
  chosen_korean: 그들과 함께 무덤에 묻히지 못할 것입니다
  alternatives_korean:
  - 그들과 함께 장사되지 못할 것입니다
  - 그들과 함께 묻히지 못할 것입니다
  lexicon: HALOT
  rationale: יחד의 ‘함께/연합되다’와 קבורה의 ‘매장’ 의미를 자연스럽게 살리면서, 왕에게 어울리는 장례의 거절을 한국어로 분명하게 전달합니다.
- source_word: אַרְצְךָ
  english_pob_choice: your land
  chosen_korean: 당신의 땅
  alternatives_korean:
  - 당신의 나라
  - 당신의 영토
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 통치자의 영역을 가리키므로, ‘땅’이 가장 직접적이면서도 정치적·제의적 뉘앙스를 과장하지 않습니다.
- source_word: שִׁחַתָּ עַמְּךָ הָרָגְתָּ
  english_pob_choice: you have destroyed your land; you have slain your people
  chosen_korean: 당신이 당신의 땅을 멸망시키고, 당신의 백성을 죽였기 때문입니다
  alternatives_korean:
  - 당신이 당신의 땅을 파괴하고, 당신의 백성을 살해했기 때문입니다
  - 당신이 당신의 땅을 망가뜨리고, 당신의 백성을 죽였기 때문입니다
  lexicon: HALOT
  rationale: שׁחת는 이 심판 문맥에서 강한 파괴·멸망의 뜻이므로 ‘멸망시키다’가 적절하고, הָרַג는 단순한 죽임보다 강한 비난을 유지하기 위해 ‘죽였다’를 택했습니다.
- source_word: זֶרַע מְרֵעִים
  english_pob_choice: The offspring of evildoers will never be named
  chosen_korean: 악을 행하는 자의 후손은 영원히 이름이 불리지 않을 것입니다
  alternatives_korean:
  - 악인들의 씨는 영원히 이름이 불리지 않을 것입니다
  - 악을 행하는 자들의 자손은 영원히 불리지 않을 것입니다
  lexicon: HALOT
  rationale: זֶרַע는 집단적 ‘후손/자손’의 뜻을 살리되 현대 한국어에서 자연스럽게 옮겼고, מְרֵעִים는 도덕적 악을 드러내는 ‘악을 행하는 자’로 풀었습니다.
theological_decisions:
- issue: זֶרַע מְרֵעִים의 범위를 특정 개인의 혈통으로 좁힐지 여부
  chosen_reading: ‘악을 행하는 자의 후손’으로 일반화해 옮기되, 문맥상 이 폭군의 계통을 포함할 수 있도록 열어 둡니다.
  alternative_readings:
  - ‘그 악인의 후손’
  - ‘악한 자들의 자손’
  rationale: 히브리어는 복수적·범주적 표현이므로, 번역에서 특정 인물의 혈통으로 과도하게 한정하지 않고 도덕적 범주를 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 문맥이 허용하는 긴장을 보존합니다.
