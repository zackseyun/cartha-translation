source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
  footnotes:
  - marker: a
    text: Hebrew הֵילֵל is traditionally rendered 'Lucifer' in some older translations; it more literally denotes a shining celestial figure, often understood as 'day star' or 'morning star.'
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 너는 하늘에서 떨어졌느냐, 빛나는 자여[a], 새벽의 아들이여! 민족들을 굴복시키던 자여, 너는 베어져 땅에 쓰러졌구나.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֵילֵל은 일부 오래된 번역에서 전통적으로 ‘루시퍼’로 옮겨졌습니다. 이 말은 문자적으로 빛나는 천체적 존재를 가리키며, 흔히 ‘샛별’ 또는 ‘새벽별’로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 아, 어찌하여
  lexicon: HALOT
  rationale: 탄식과 놀라움을 담은 수사 의문을 자연스럽게 살리되, 감탄을 과도하게 보태지 않기 위해 표준적인 ‘어찌하여’를 택했습니다.
- source_word: הֵילֵל
