  - 새벽별
  - 광채 나는 자
  - 루시퍼
  lexicon: HALOT
  rationale: 후대의 고유명사화보다 히브리어의 시적 이미지와 보통명사적 성격을 드러내기 위해 설명적 표현으로 옮겼습니다.
- source_word: נִגְדַּעְתָּ
  english_pob_choice: you have been cut down
  chosen_korean: 찍혀 떨어졌으니
  alternatives_korean:
  - 잘려 내려갔으니
  - 베어져 떨어졌으니
  - 찍혀 내려갔으니
  lexicon: HALOT
  rationale: 수동적·결과적 파괴를 살리면서, 하늘에서 땅으로의 추락과 연결되는 강한 심상을 한국어로 자연스럽게 구현했습니다.
- source_word: חוֹלֵשׁ עַל גּוֹיִם
  english_pob_choice: you who subdued the nations
  chosen_korean: 민족들을 굴복시키던 자여
  alternatives_korean:
  - 민족들을 제압하던 자여
  - 민족들을 다스리던 자여
  - 민족들을 누르던 자여
  lexicon: HALOT
  rationale: חוֹלֵשׁ의 지배·제압 의미를 살리되, ‘nations’의 공적·정치적 범위를 고려해 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: הֵילֵל을 전통적 고유명사 ‘루시퍼’로 볼 것인지
  chosen_reading: 본문에서는 묘사적 표현인 ‘빛나는 자’를 사용하고, 전통적 명칭은 배제했습니다.
  alternative_readings:
  - 루시퍼
  - 샛별
  - 새벽별
  rationale: 원문은 후대 라틴 전통의 고유명사보다 시적 묘사에 가깝기 때문에, 원어의 의미와 독자의 해석 여지를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 번역 원칙 §1 원어 우선성; §3 해석적 긴장 보존
