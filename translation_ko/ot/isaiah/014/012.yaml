    issue: ‘땅으로 찍혀 떨어졌으니’는 נִגְדַּעְתָּ의 의미와 한국어 표현 모두에서 부정확하거나 어색합니다.
    rationale: נִגְדַּעְתָּ는 ‘잘리다, 베어지다, 찍혀 쓰러지다’의 수동적 파괴를 나타냅니다. ‘찍혀 떨어지다’는 자연스러운 한국어 심상을 이루지 못하고, 하늘에서의 추락을 불필요하게 중복합니다.
