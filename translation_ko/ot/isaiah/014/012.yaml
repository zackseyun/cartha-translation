  - 아, 어찌하여
  lexicon: HALOT
  rationale: 탄식과 놀라움을 담은 수사 의문을 자연스럽게 살리되, 감탄을 과도하게 보태지 않기 위해 표준적인 ‘어찌하여’를 택했습니다.
- source_word: הֵילֵל
  english_pob_choice: shining one
  chosen_korean: 빛나는 자
  alternatives_korean:
