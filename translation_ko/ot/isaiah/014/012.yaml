    issue: 각주 표지가 문장 끝에 있어 הֵילֵל에 대한 주석임이 즉시 드러나지 않습니다.
    rationale: 각주가 ‘빛나는 자’의 대안 번역을 설명하므로 해당 표현 바로 뒤에 표지하는 것이 적절합니다.
