- from: 어찌하여 너는 하늘에서 떨어졌느냐, 빛나는 자여, 새벽의 아들이여! 너는 땅으로 찍혀 떨어졌으니, 민족들을 굴복시키던 자여.[a]
  to: 어찌하여 너는 하늘에서 떨어졌느냐, 빛나는 자여[a], 새벽의 아들이여! 민족들을 굴복시키던 자여, 너는 베어져 땅에 쓰러졌구나.
  rationale: ‘찍혀 떨어졌으니’를 ‘베어져 땅에 쓰러졌구나’로 고쳐, 원문의 수동적 절단·전복 심상과 하늘/땅의 대조를 자연스러운 한국어로 보존했습니다. 호격의 반복과 마지막 탄식적 선언의 연결을 정돈했으며, 각주 표지를 הֵילֵל의 번역어에 직접 붙였습니다. 각주는 ‘루시퍼’를 본문상의 고유명사로 단정하지 않으면서 전통 번역과 가능한 천체적 이해를 제시합니다.
