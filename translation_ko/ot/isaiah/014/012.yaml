source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
  footnotes:
  - marker: a
    text: Hebrew הֵילֵל is traditionally rendered 'Lucifer' in some older translations; it more literally denotes a shining celestial figure, often understood as 'day star' or 'morning star.'
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 너는 하늘에서 떨어졌느냐, 빛나는 자여, 새벽의 아들이여! 너는 땅으로 찍혀 떨어졌으니, 민족들을 굴복시키던 자여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֵילֵל은 오래된 번역들에서 전통적으로 ‘루시퍼’로 옮겨졌지만, 본래는 빛나는 천체를 가리키는 더 직접적인 표현으로 이해될 수 있으며, 흔히 ‘샛별’ 또는 ‘새벽별’로 풀이됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
