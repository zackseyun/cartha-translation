translation:
  language: ko
  text: 내가 그것을 고슴도치[a]의 소유지와 물웅덩이들로 만들고, 파괴의 빗자루로 그것을 쓸어버리겠습니다. 만군의 야훼께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קִפֹּד은 사막이나 폐허에 사는 동물을 가리키는 것으로 보입니다. ‘고슴도치’ 외에 ‘호저’, ‘부엉이’, 전통적으로 ‘해오라기(큰해오라기)’라는 번역도 제안됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי־הָ
  english_pob_choice: I will make her
  chosen_korean: 내가 그것을 ...로 삼고
  alternatives_korean:
  - 내가 그것을 ...로 만들고
  - 내가 그것을 ...로 두고
  lexicon: HALOT
  rationale: שׂוּם의 ‘두다/만들다’ 의미를 한국어에서는 결과 상태를 자연스럽게 드러내는 ‘...로 삼다’로 옮겼습니다. 히브리어의 3인칭 여성형은 바벨론 성읍을 가리키므로 본문 흐름상 ‘그것’으로 받았습니다.
- source_word: לְמוֹרַשׁ קִפֹּד וְאַגְמֵי מָיִם
  english_pob_choice: a possession of the hedgehog and pools of water
  chosen_korean: 고슴도치의 소유와 물웅덩이
  alternatives_korean:
  - 고슴도치의 몫과 물웅덩이
  - 고슴도치와 물웅덩이의 차지
  lexicon: HALOT
  rationale: מוֹרָשׁ은 ‘소유/차지’의 뉘앙스를 가지므로 이를 살렸고, קִפֹּד은 동물 정체가 불확실하지만 현대 한국어에서 가장 직관적인 대응어로 ‘고슴도치’를 택했습니다. אַגְמֵי מָיִם은 습지의 이미지를 지나치게 풀지 않고 ‘물웅덩이’로 간명하게 옮겼습니다.
- source_word: וְטֵאטֵאתִיהָ בְּמַטְאֲטֵא הַשְׁמֵד
  english_pob_choice: and I will sweep her with the broom of destruction
  chosen_korean: 파괴의 빗자루로 그것을 쓸어버리겠습니다
  alternatives_korean:
  - 멸망의 빗자루로 그것을 쓸어버리겠습니다
  - 파멸의 빗자루로 그것을 쓸겠습니다
  lexicon: HALOT
  rationale: טָאָא 계열의 동사는 실제로 ‘쓸다’라는 생생한 동작을 나타내므로 이를 직접 살렸습니다. מַטְאֲטֵא는 도구명사인 ‘빗자루’로, הַשְׁמֵד는 파괴/멸망의 의미를 가진 관형 구조로 처리했습니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 만군의 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼 만군께서 말씀하십니다
  - 만군의 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식이므로 ‘말씀하십니다’로 번역해 현재형 선포성을 살렸습니다. יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로, צְבָאוֹת은 전통어 ‘만군’으로 옮겨 신적 칭호의 장중함을 유지했습니다.
theological_decisions:
- issue: 바벨론을 여성형 대명사로 받는 방식
  chosen_reading: ‘그것’으로 번역하되, 성읍 바벨론을 가리키는 여성형 인칭 어미의 문법적 표지를 별도로 드러내지 않았습니다.
  alternative_readings:
  - ‘그녀’로 번역하여 의인화된 성읍 이미지를 드러냄
  - ‘그것’과 ‘그녀’를 절충해 병기함
  rationale: 히브리어 여성형 접미사는 바벨론 성읍의 의인화를 반영하지만, 한국어에서는 ‘그녀’가 지나치게 인격적이어서 현대 독자에게 불필요한 혼선을 줄 수 있습니다. 본문이 말하는 것은 성읍의 몰락과 황폐화이므로 중립적 지시어를 택했습니다.
  doctrine_reference: Prophetic personification and Korean pronoun register
- issue: 예언자적 선언 공식의 번역
  chosen_reading: ‘말씀하십니다’로 마무리해 야훼의 직접 선포로 읽히게 했습니다.
  alternative_readings:
  - ‘선언하십니다’
  - ‘말합니다’
  rationale: נְאֻם은 단순 서술보다 예언적 권위가 강한 공식이므로, 한국어에서 가장 자연스럽게 장중함을 유지하는 ‘말씀하십니다’를 선택했습니다.
  doctrine_reference: Prophetic oracle formula
