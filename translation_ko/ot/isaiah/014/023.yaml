  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לְמוֹרַשׁ קִפֹּד וְאַגְמֵי מָיִם의 결합은 바벨론이 고슴도치의 점유지이자 물웅덩이들이 되게 된다는 황폐화의 그림입니다. 초안의 ‘고슴도치의 소유와 물웅덩이’는 ‘고슴도치가 소유하는 물웅덩이’처럼도 읽혀 구조와 이미지가 다소 불분명합니다. 또한 각주가 영어 감사 기록에 제시된 어휘 대안과 일치하지 않습니다.
  naturalness: ‘고슴도치의 소유’는 현대 한국어에서 소유물 자체를 뜻하기 쉬워 장소의 황폐화 이미지가 약합니다. ‘고슴도치의 소유지’는 이 문맥에서 자연스럽고, 동물명 각주 표지도 해당 단어 뒤에 두는 편이 독자에게 분명합니다. ‘만군의 야훼께서 선언하십니다’는 נְאֻם에 알맞은 현대 합쇼체 예언 선언 공식입니다.
