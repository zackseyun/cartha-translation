base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: '''Name and remnant, offspring and posterity'' is a comprehensive expression for wiping out Babylon''s memory and surviving line.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 그들 위에 일어서겠습니다[a], 만군의 야훼의 말씀입니다. 내가 바벨론에서 이름과 남은 자와 후손과 대를 끊어 버리겠습니다[b], 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들 위에'는 대적하여 일어서는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''이름과 남은 자와 후손과 대''는 바벨론의 기억과 살아남은 계보를 완전히 지우는 포괄적 표현입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  english_pob_choice: I will rise up against them
  chosen_korean: 내가 그들 위에 일어서겠습니다
  alternatives_korean:
  - 내가 그들에 맞서 일어나겠습니다
  - 내가 그들 위로 일어나겠습니다
  lexicon: HALOT
  rationale: קום의 미래적·심판적 용법을 살리면서, עַל의 대적 의미를 한국어에서 자연스럽게 드러내기 위해 '그들 위에 일어서다'로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 이 역본의 기준에 따라 יְהוָה는 '야훼'로, צְבָאוֹת은 직역된 호칭인 '만군의'로 옮겨 군사적·심판적 뉘앙스를 보존했습니다.
- source_word: וְהִכְרַתִּי לְבָבֶל שֵׁם וּשְׁאָר וְנִין וָנֶכֶד
  english_pob_choice: I will cut off from Babylon name and remnant, offspring and posterity
  chosen_korean: 바벨론에서 이름과 남은 자와 후손과 대를 끊어 버리겠습니다
  alternatives_korean:
  - 바벨론에서 이름과 잔존자와 자손과 후손을 끊어 버리겠습니다
  - 바벨론의 이름과 남은 자와 후손과 대를 없애겠습니다
  lexicon: HALOT
  rationale: הִכְרִית의 심판적 관용을 '끊어 버리다'로 살렸고, 나열된 명사들은 바벨론의 기억과 계보를 완전히 제거하는 포괄적 표현으로 한국어의 자연스러운 병렬 구조를 택했습니다.
theological_decisions:
- issue: יהוה의 번역과 예언 공식의 반복
  chosen_reading: '''야훼''와 ''야훼의 말씀입니다''를 유지해 신적 선언의 직접성과 예언적 종결을 드러냈습니다.'
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יְהוָה를 두 번 직접 사용하고 נְאֻם 공식으로 심판 선언을 봉인하므로, 본문 안에서 동일한 신명과 예언 공식을 일관되게 보존하는 편이 원문의 효과를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
