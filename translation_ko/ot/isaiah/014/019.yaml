  rationale: 원문의 완료 수동형, ‘혐오받는 가지’의 강한 배척, 그리고 피살자들을 옷처럼 두른 채 구덩이로 내려가는 형상을 보존하도록 문장 구조를 재구성했습니다. 논쟁적인 מְטֹעֲנֵי חָרֶב은 본문에서 기존의 신중한 해석을 유지하고 각주로 대안을 남겼습니다. 각주 표지는 본문 말미에 유지되어 구조상 오류는 없습니다.
