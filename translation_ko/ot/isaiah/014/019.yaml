id: ISA.14.19
reference: Isaiah 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
  footnotes:
  - marker: a
    text: Or “an abhorred shoot/offshoot.” The Hebrew word can mean “shoot” or “branch”; here it refers to something rejected and thrown away.
    reason: lexical_alternative
  - marker: b
    text: Or “those thrust through with the sword.” The Hebrew expression is difficult; the sense is of the battle-slain.
    reason: lexical_alternative
  - marker: c
    text: “The pit” is a poetic term for the grave or realm of the dead; “stones of the pit” likely evokes a stone-lined burial place.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 너는 네 무덤에서 내던져졌습니다. 혐오받는 가지처럼, 죽임을 당한 자들, 곧 칼에 찔려 구덩이의 돌들로 내려가는 자들을 옷처럼 걸친 채, 짓밟힌 시체처럼 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “혐오받는 새순/싹”입니다. 히브리어는 “싹”이나 “가지”를 뜻할 수 있으며, 여기서는 거절되어 던져진 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “칼에 꿰뚫린 자들”입니다. 히브리어 표현은 어렵지만, 전쟁에서 죽임을 당한 자들을 가리키는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: “구덩이”는 무덤이나 죽은 자들의 영역을 가리키는 시적 표현이며, “구덩이의 돌들”은 돌로 둘러진 매장지를 떠올리게 할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ
  english_pob_choice: are cast out
  chosen_korean: 쫓겨나며
  alternatives_korean:
  - 내던져지며
  - 버려져
  lexicon: HALOT
  rationale: 홉할 완료형의 수동·결과적 힘을 살리되, 왕을 향한 조롱의 생동감을 한국어에서는 “쫓겨나며”로 자연스럽게 드러냈습니다.
- source_word: מִקִּבְרְךָ
  english_pob_choice: from your grave
  chosen_korean: 무덤에서
  alternatives_korean:
  - 네 무덤에서
  - 무덤으로부터
  lexicon: HALOT
  rationale: קבר를 매장지/무덤으로 보고, 출처를 매끄럽게 살리기 위해 “무덤에서”로 옮겼습니다.
- source_word: כְּנֵצֶר נִתְעָב
  english_pob_choice: like a despised branch
  chosen_korean: 멸시받는 가지처럼
  alternatives_korean:
  - 혐오받는 새순처럼
  - 버림받은 가지처럼
  lexicon: HALOT
  rationale: 이 문맥에서는 메시아적 ‘싹’보다 버려진 식물의 이미지가 핵심이므로, נֵצֶר를 “가지”로, נִתְעָב를 “멸시받는”으로 옮겼습니다.
- source_word: לְבוּשׁ הֲרֻגִים מְטֹעֲנֵי חָרֶב
  english_pob_choice: clothed with the slain, those pierced by the sword
  chosen_korean: 죽임을 당한 자들, 곧 칼에 찔린 자들의 옷을 입고
  alternatives_korean:
  - 살해된 자들, 곧 칼로 찔린 자들의 옷을 입고
  - 죽은 자들, 곧 칼에 꿰뚫린 자들의 옷을 입고
  lexicon: HALOT
  rationale: ‘옷을 입다’라는 관용적 관계를 유지하면서, קשה한 מְטֹעֲנֵי חָרֶב은 POB의 해석을 따라 “칼에 찔린 자들”로 처리했습니다.
- source_word: יוֹרְדֵי אֶל אַבְנֵי בּוֹר
  english_pob_choice: who go down to the stones of the pit
  chosen_korean: 구덩이의 돌들로 내려가는 자들
  alternatives_korean:
  - 구덩이의 돌들로 내려가는 이들
  - 구덩이의 돌들 아래로 내려가는 자들
  lexicon: HALOT
  rationale: ‘구덩이’는 죽음과 무덤을 가리키는 시어로 보존하고, ‘돌들’은 묘지/매장지의 구체적 이미지를 살려 직역에 가깝게 유지했습니다.
- source_word: כְּפֶגֶר מוּבָס
  english_pob_choice: like a trampled corpse
  chosen_korean: 짓밟힌 시체와도 같습니다
  alternatives_korean:
  - 짓밟힌 주검과도 같습니다
  - 발에 밟힌 시체와도 같습니다
  lexicon: HALOT
  rationale: פגר는 인간의 시신을 뜻하므로 “시체”로, מוּבָס는 반복적으로 짓밟힌 상태를 드러내는 “짓밟힌”으로 옮겼습니다.
theological_decisions:
- issue: נֵצֶר의 메시아적 연상 여부
  chosen_reading: 이 구절에서는 ‘가지’로 번역해, 이사야 11:1의 메시아적 울림을 본문 밖으로 끌어오지 않도록 했습니다.
  alternative_readings:
  - 새순
  - 싹
  rationale: 이 절의 장르는 왕에 대한 조롱과 수치의 묘사이므로, 문맥에 없는 신학적 연상을 얹지 않는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
