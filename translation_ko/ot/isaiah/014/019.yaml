  verdict: revise
  source_fidelity: 수정이 필요합니다. הָשְׁלַכְתָּ는 ‘쫓겨나다’보다 ‘내던져지다/버려지다’가 더 가깝고, 완료형의 결과를 한국어에서 ‘내던져졌습니다’로 드러내는 것이 적절합니다. 또한 לְבוּשׁ 이하를 ‘자들의 옷을 입고’로 옮긴 것은 피살자들의 옷을 입는다는 뜻으로 바꾸며, ‘가운데 있으며’는 원문에 없는 관계를 추가합니다. 피살자들을 옷처럼 두른 섬뜩한 비유로 연결해야 합니다.
  naturalness: 현 초안은 ‘죽임을 당한 자들 … 자들의 옷을 입고’ 및 ‘내려가는 자들 가운데 있으며’의 수식 관계가 부자연스럽고 의미가 불명확합니다. ‘… 자들을 옷처럼 걸친 채’로 하면 한국어 문장 구조와 원문의 비유가 모두 분명해집니다. 합쇼체에 맞추어 종결을 ‘되었습니다’로 정리했습니다.
  terminology: נֵצֶר는 이 문맥에서 ‘가지’로 유지할 수 있으나 נִתְעָב는 단순한 사회적 ‘멸시’보다 ‘혐오받는/가증한’의 강한 거부 의미가 더 적절합니다. בּוֹר는 ‘구덩이’로, פֶגֶר는 ‘시체’로 유지합니다. מְטֹעֲנֵי חָרֶב의 불확실한 어휘 문제는 ‘칼에 찔린 자들’과 각주로 충분히 보존됩니다.
