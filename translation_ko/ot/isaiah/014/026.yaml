    text: ‘땅’은 지역적 의미로도 읽을 수 있습니다. 문맥을 더 지역적으로 볼 경우 ‘그 땅’으로 이해할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision strengthens the hostile sense of the repeated preposition and improves the Korean representation of the extended-hand image. It preserves the source’s parallel structure, its broad reading of ‘온 땅,’ and the lexical-alternative footnote without imposing a theological interpretation.
