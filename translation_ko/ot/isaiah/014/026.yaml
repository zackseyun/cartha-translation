id: ISA.14.26
reference: Isaiah 14:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
  footnotes:
  - marker: a
    text: Or 'the whole land,' if the reference is taken more regionally rather than universally.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 온 땅을 거슬러 세워진 계획이며[a], 이것은 모든 민족을 거슬러 뻗어 있는 손입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 지역적 의미로도 읽을 수 있습니다. 문맥을 더 지역적으로 볼 경우 ‘그 땅’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת / הָעֵצָה
  english_pob_choice: This is the plan
  chosen_korean: 이것은 계획입니다
  alternatives_korean:
  - 이것은 뜻입니다
  - 이것은 모의입니다
  - 이것은 목적입니다
  lexicon: HALOT
  rationale: עֵצָה는 문맥상 단순한 ‘조언’이 아니라 확정된 의도·계획을 뜻하므로, 한국어에서는 현대 독자가 즉시 이해할 수 있는 ‘계획’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: הַיְּעוּצָה
  english_pob_choice: that is planned
  chosen_korean: 세워진
  alternatives_korean:
  - 계획된
  - 정해진
  - 의도된
  lexicon: HALOT
  rationale: יָעַץ 계열의 수동 분사는 앞의 עֵצָה와 말놀이를 이루므로, ‘세워진’으로 옮겨 계획이 이미 확정되어 실행 직전의 상태임을 살리면서도 한국어로 무리 없는 반복을 피했습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: against all the earth
  chosen_korean: 온 땅을 향하여
  alternatives_korean:
  - 온 땅에 대하여
  - 모든 땅을 향하여
  - 온 세상을 향하여
  lexicon: HALOT
  rationale: עַל은 심판 문맥에서 ‘~을 향하여/대하여’의 적대적 방향을 나타내므로, 한국어에서도 직접적인 대립 방향을 보여 주는 표현을 택했습니다. ‘땅’은 지역적 의미도 가능하지만, 본절의 병행구 ‘모든 민족’과 함께 넓은 범위를 자연스럽게 유지합니다.
- source_word: הַיָּד הַנְּטוּיָה
  english_pob_choice: the hand that is stretched out
  chosen_korean: 뻗은 손
  alternatives_korean:
  - 펴신 손
  - 내민 손
  - 뻗쳐진 손
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 이미지는 권능과 행위의 표지이므로 직역적 이미지가 핵심입니다. 다만 한국어에서는 ‘뻗은 손’이 가장 간명하게 능동적 개입을 전달하며, 지나친 설명어인 ‘권능’은 의도된 신체적 비유를 약화시킵니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족
  - 모든 백성들
  lexicon: HALOT
  rationale: גוֹיִם은 여기서 이스라엘과 대비되는 정치·민족 집합을 가리키므로, ‘민족’이 가장 중립적이고 문맥에 맞습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: ‘온 땅’으로 넓은 범위를 유지합니다.
  alternative_readings:
  - ‘그 땅’이라는 지역적 범위
  - ‘온 세상’이라는 의역
  rationale: 영어 POB의 주석처럼 이 단어는 지역적 의미도 가능하지만, 본문 병행구가 ‘모든 민족’이므로 세계적·보편적 심판의 수사로 읽는 것이 더 설득력 있습니다. 다만 ‘온 땅’은 과도한 신학화 없이 원문의 폭을 보존합니다.
  doctrine_reference: 문맥적 범위 판단; 이사야 14장 심판 신탁의 수사 구조
