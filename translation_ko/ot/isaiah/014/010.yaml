base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
  footnotes:
  - marker: a
    text: Or, 'You too have been made weak like us.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'you have been likened to us' / 'you have become equal to us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두가 대답하며 당신에게 말할 것입니다. “당신도 우리처럼 약해졌습니다. 당신은 우리와 같이 되었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약해지셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리와 비슷하게 되었습니다’ 또는 ‘우리와 같아졌습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻלָּם
  english_pob_choice: All of them
  chosen_korean: 그들 모두가
  alternatives_korean:
  - 모두가
  - 그들이 모두
  lexicon: HALOT
  rationale: 전체를 가리키는 집합 표현이므로 ‘그들 모두가’로 옮겨, 다수 화자의 총체성을 자연스럽게 살렸습니다.
- source_word: יַעֲנוּ וְיֹאמְרוּ
  english_pob_choice: will answer and say
  chosen_korean: 대답하며 … 말할 것입니다
  alternatives_korean:
  - 응답하며 … 말할 것입니다
  - 대답하고 말할 것입니다
  lexicon: HALOT
  rationale: ענה와 אמר의 병렬을 살리되 한국어에서는 반복을 약간 압축해도 대화적·조롱적 말하기의 흐름이 유지됩니다.
- source_word: חֻלֵּיתָ
  english_pob_choice: have become weak
  chosen_korean: 약해졌습니다
  alternatives_korean:
  - 약하게 되었습니다
  - 쇠약해졌습니다
  - 병들었습니다
  lexicon: HALOT
  rationale: 이 절에서는 단순한 질병보다 힘을 잃고 무력해진 상태가 핵심이므로, ‘약해졌습니다’가 가장 직접적입니다.
- source_word: כָמוֹנוּ / אֵלֵינוּ נִמְשָׁלְתָּ
  english_pob_choice: like us / you have become like us
  chosen_korean: 우리처럼 … 우리와 같이 되었습니다
  alternatives_korean:
  - 우리와 같아졌습니다
  - 우리와 비슷하게 되었습니다
  - 우리와 견줄 만하게 되었습니다
  lexicon: HALOT
  rationale: 두 개의 유사 표현을 반복해 조롱의 운율을 보존했습니다. נמשל의 수동적/비유적 뉘앙스는 ‘같이 되었습니다’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 스올에서의 조롱 발화의 성격
  chosen_reading: 죽은 자들이 왕의 몰락과 무력화를 조롱하는 시적 발화로 옮기고, 이 절만으로 사후 상태 교리를 확정하지 않도록 했습니다.
  alternative_readings:
  - 의인화된 그림자로 읽는 해석
  - 중간상태의 의식성을 강하게 전제하는 해석
  rationale: 본문의 목적은 권세의 전복과 수치를 드러내는 데 있으므로, 신학적 세부를 과도하게 결정하지 않는 번역이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 본문이 허용하는 긴장을 유지하고, 교리적 결론은 유보합니다.
