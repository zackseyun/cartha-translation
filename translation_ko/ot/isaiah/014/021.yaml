base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
  footnotes:
  - marker: a
    text: Or 'for the iniquity of their fathers'; עָוֹן can denote guilt, iniquity, or the punishment resulting from guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'and inherit the land'; the Hebrew verb can mean 'inherit,' 'take possession of,' or 'possess.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'fill the face of the world with cities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들을 위해 학살을 준비하라 — 그들의 조상들의 죄책 때문에. 그들이 일어나 땅을 차지하고, 세상의 얼굴을 도시들로 가득 채우지 못하게 하라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들의 죄책’은 히브리어 עָוֹן이 지닐 수 있는 ‘죄책, 죄악, 그 결과로서의 형벌’의 폭을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅을 차지하다’는 히브리어 יָרַשׁ의 가능한 의미들 가운데 하나입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘세상의 얼굴’은 히브리어 פְּנֵי תֵבֵל의 문자적인 표현을 따른 것입니다.
    reason: lexical_alternative
