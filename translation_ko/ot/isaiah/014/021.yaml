  text: 그들의 아버지들의 죄악 때문에 그의 아들들을 위한 살육을 마련하라. 그들이 일어나 땅을 차지하고 세상의 얼굴을 도시들로 가득 채우지 못하게 하라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
