    text: ‘죄악’으로 옮긴 히브리어 עָוֹן은 ‘죄책’, ‘죄악’, 또는 그 결과로서의 ‘형벌’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅을 차지하다’로 옮긴 히브리어 יָרַשׁ은 ‘상속하다’, ‘차지하다’, 또는 ‘소유하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘세상의 얼굴을 도시들로 가득 채우다’입니다.
    reason: lexical_alternative
