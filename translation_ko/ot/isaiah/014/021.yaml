theological_decisions:
- issue: 부자 간 심판 연결과 원문의 긴장
  chosen_reading: 아들들의 학살을 조상들의 죄책과 연결하는 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 아들들이 아버지의 죄를 계속했기 때문이라고 해석하기
  - ‘죄책’ 대신 ‘형벌’로 옮겨 심판을 추상화하기
  rationale: 본문은 세대 간 심판의 긴장을 명시적으로 제시하므로, 이를 해소하거나 도덕적으로 순화하지 않고 드러내는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
