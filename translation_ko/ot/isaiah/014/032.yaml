id: ISA.14.32
reference: Isaiah 14:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
  footnotes:
  - marker: a
    text: Or 'the envoys/ambassadors of the nation.' The Hebrew term can refer to diplomatic messengers.
    reason: lexical_alternative
  - marker: b
    text: Or 'the poor of his people' or 'the humble of his people.' The Hebrew can denote economic poverty, affliction, or lowliness/humility depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무엇이라고 그 나라의 사자들에게 대답하겠습니까? 「야훼께서 시온을 세우셨고, 그곳에서 그의 백성의 고난받는 이들이 피난처를 얻을 것입니다」라는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 나라의 사절들/외교 사신들’입니다. 히브리어 용어는 외교적 전달자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 백성의 가난한 이들’ 혹은 ‘그의 백성의 겸손한 이들’입니다. 히브리어는 문맥에 따라 경제적 빈곤, 고난, 또는 낮아짐/겸손을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  english_pob_choice: And what
  chosen_korean: 그리고 무엇이라고
  alternatives_korean:
  - 무엇이라고
  - 그런데 무엇이라고
  lexicon: BDB
  rationale: 접속사 ו가 앞 문맥과의 연결을 보이므로 한국어에서도 연결어를 살려 ‘그리고’로 시작했습니다.
- source_word: מַלְאֲכֵי גוֹי
  english_pob_choice: the messengers of the nation
  chosen_korean: 그 나라의 사자들
  alternatives_korean:
  - 그 나라의 전령들
  - 그 나라의 사신들
  - 그 나라의 메신저들
  lexicon: HALOT
  rationale: מלאכים는 문맥상 외교적 사절을 가리킬 수 있으므로, ‘사자들’로 옮겨 공식적 전달자라는 의미를 살리되 과도한 현대화는 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: HALOT
  rationale: 신명기적 고유명사 יְהוָה를 제목어 ‘주’로 대체하지 않고, 프로젝트 기본어인 ‘야훼’로 직접 옮겼습니다.
- source_word: יִסַּד
  english_pob_choice: has founded
  chosen_korean: 세우셨고
  alternatives_korean:
  - 기초를 놓으셨고
  - 설립하셨고
  - 세우셨습니다
  lexicon: HALOT
  rationale: יסד의 ‘기초를 놓다/세우다’ 뜻을 반영하여 시온을 하나님의 확정된 행위의 결과로 제시했습니다.
- source_word: וּבָהּ
  english_pob_choice: and in her
  chosen_korean: 그곳에서
  alternatives_korean:
  - 그 안에서
  - 그녀 안에서
  - 그 안에
  lexicon: HALOT
  rationale: 히브리어 여성형 대명사는 시온의 의인화를 반영하지만, 한국어에서는 문맥상 자연스러운 장소 표현 ‘그곳에서’로 풀어 의미를 유지했습니다.
- source_word: יֶחֱסוּ
  english_pob_choice: will find refuge
  chosen_korean: 피난처를 얻을 것입니다
  alternatives_korean:
  - 피신할 것입니다
  - 피난할 것입니다
  - 도피할 것입니다
  lexicon: HALOT
  rationale: חסה의 핵심은 안전한 곳으로 숨는/피하는 것이므로, 결과를 드러내는 자연한 한국어로 ‘피난처를 얻다’로 옮겼습니다.
- source_word: עֲנִיֵּי עַמּוֹ
  english_pob_choice: the afflicted of his people
  chosen_korean: 그의 백성의 고난받는 이들
  alternatives_korean:
  - 그의 백성의 가난한 이들
  - 그의 백성의 겸손한 이들
  - 그의 백성의 가엾은 이들
  lexicon: HALOT
  rationale: עֲנִיִּים는 이 문맥에서 경제적 빈곤만이 아니라 눌리고 고통받는 상태를 포함하므로 ‘고난받는 이들’이 가장 넓고 정확합니다.
theological_decisions:
- issue: 시온과 여성형 대명사 표현
  chosen_reading: 시온을 세우셨고, 그곳에서
  alternative_readings:
  - 시온을 세우셨고, 그녀 안에서
  - 시온을 세우셨고, 그 안에서
  rationale: 히브리어 여성형 대명사는 시온의 의인화를 나타내지만, 한국어 본문에서는 직설적 의인화보다 문맥상 자연한 장소 지시를 택해 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
