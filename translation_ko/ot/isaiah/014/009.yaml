id: ISA.14.9
reference: Isaiah 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁא֗וֹל מִ/תַּ֛חַת רָגְזָ֥ה לְ/ךָ֖ לִ/קְרַ֣את בּוֹאֶ֑/ךָ עוֹרֵ֨ר לְ/ךָ֤ רְפָאִים֙ כָּל עַתּ֣וּדֵי אָ֔רֶץ הֵקִים֙ מִ/כִּסְאוֹתָ֔/ם כֹּ֖ל מַלְכֵ֥י גוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
  footnotes:
  - marker: a
    text: 'Or ''the dead'' or ''departed spirits'' for ''the shades'' (Hebrew: Rephaim).'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the male goats of the earth,' a metaphor for prominent rulers or leaders.
    reason: lexical_alternative
translation:
  language: ko
  text: 아래의 스올은 당신을 맞으려고 흔들립니다. 그것은 당신을 위해 죽은 자들의 그림자를 깨우며, 땅의 모든 우두머리들을 일으켜 세웁니다. 그들은 자기들의 왕좌에서 일어나 만국의 모든 왕들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽은 자들의 그림자’는 히브리어 רְפָאִים(르파임)을 살린 시적 표현입니다. 문맥에 따라 ‘죽은 자들’ 또는 ‘떠난 영들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 직역은 ‘땅의 숫염소들’이지만, 여기서는 비유적으로 세상의 유력한 통치자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자의 세계
  - 지옥
  lexicon: WLC/POB glossary
  rationale: 히브리어 המקור의 지하 세계 개념을 보존하기 위해 음역을 사용했습니다. ‘무덤’이나 ‘지옥’은 의미를 좁히거나 후대 교리를 불러올 수 있습니다.
- source_word: רְפָאִים
  english_pob_choice: the shades
  chosen_korean: 죽은 자들의 그림자
  alternatives_korean:
  - 죽은 자들
  - 떠난 영들
  - 르파임
  lexicon: HALOT
  rationale: 문맥상 스올의 죽은 자들을 가리키므로, 시적이고 음산한 뉘앙스를 살려 ‘그림자’로 옮겼습니다. POB의 ‘the shades’에 대응하면서도 한국어에서 이해가 자연스럽습니다.
- source_word: עַתּוּדֵי אָרֶץ
  english_pob_choice: the leaders of the earth
  chosen_korean: 땅의 모든 우두머리들
  alternatives_korean:
  - 땅의 숫염소들
  - 땅의 지도자들
  - 땅의 최고자들
  lexicon: HALOT
  rationale: 직역하면 ‘땅의 숫염소들’이지만, 비유가 가리키는 바는 세상의 유력한 통치자들이므로 본문 뜻을 분명하게 드러냈습니다.
- source_word: מִכִּסְאוֹתָם
  english_pob_choice: from their thrones
  chosen_korean: 자기들의 왕좌에서
  alternatives_korean:
  - 그들의 보좌에서
  - 그들의 의자에서
  lexicon: HALOT
  rationale: 왕들을 병렬로 언급하므로 royal seat의 뜻을 살려 ‘왕좌’로 옮겼습니다. 일반 의자보다 권위와 통치의 이미지를 더 정확히 전달합니다.
theological_decisions:
- issue: 스올의 인격화와 죽은 자의 소집
  chosen_reading: 스올이 아래에서 당신의 도착을 맞기 위해 흔들리고, 죽은 자들의 그림자와 세상의 권력자들을 일으켜 세우는 시적 묘사로 읽었습니다.
  alternative_readings:
  - 단순한 무덤의 의인화
  - 지옥의 심판 장면으로의 해석
  rationale: 본문은 바벨론 왕을 조롱하는 시로서, 스올이 왕의 도착을 맞이하며 죽은 자들을 소집하는 장면을 과장되게 그립니다. ‘지옥’으로 좁히면 히브리어의 지하 세계 이미지를 훼손하므로 피했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve poetic and theological tension without collapsing Sheol into later hell-language.'
