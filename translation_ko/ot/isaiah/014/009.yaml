revisions:
- from: 아래의 스올은 당신을 맞으려고 흔들립니다. 그것은 당신을 위해 죽은 자들의 그림자를 깨우며, 땅의 모든 우두머리들을 일으켜 세웁니다. 그들은 자기들의 왕좌에서 일어나 만국의 모든 왕들입니다.[a][b]
  to: 아래 스올이 당신이 오는 것을 맞이하려고 동요합니다. 스올은 당신을 맞이하려고 망령들, 곧 땅의 모든 지도자들을 깨우며, 만국의 모든 왕을 그들의 보좌에서 일으킵니다.[a][b]
  rationale: 스올의 인격화와 시적 지하 세계의 이미지를 보존하면서, 원문의 동사 관계를 바로잡았습니다. ‘망령들, 곧 땅의 모든 지도자들’은 רְפָאִים과 עַתּוּדֵי אָרֶץ가 병렬로 스올이 깨우는 대상임을 드러내며, ‘만국의 모든 왕을 그들의 보좌에서 일으킵니다’는 הֵקִים מִכִּסְאוֹתָם כֹּל מַלְכֵי גוֹיִם을 충실히 반영합니다.
