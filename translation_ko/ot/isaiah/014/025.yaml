id: ISA.14.25
reference: Isaiah 14:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/שְׁבֹּ֤ר אַשּׁוּר֙ בְּ/אַרְצִ֔/י וְ/עַל הָרַ֖/י אֲבוּסֶ֑/נּוּ וְ/סָ֤ר מֵֽ/עֲלֵי/הֶם֙ עֻלּ֔/וֹ וְ/סֻ֨בֳּל֔/וֹ מֵ/עַ֥ל שִׁכְמ֖/וֹ יָסֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
  footnotes:
  - marker: a
    text: Or 'the Assyrian' instead of 'Assyria'; the Hebrew noun can refer either to the nation or to its representative ruler/army.
    reason: alternative_reading
  - marker: b
    text: Hebrew shifts from 'upon them' to singular 'upon his shoulder.' The singular may personify the oppressed people or function distributively.
    reason: textual_variant
translation:
  language: ko
  text: 내 땅에서 앗시리아를 꺾고, 내 산들 위에서 그를 짓밟을 것이니, 그러면 그의 멍에는 그들 위에서 물러가고 그의 짐은 그의 어깨에서 물러날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַשּׁוּר는 나라 이름일 수도 있고, 그 나라를 대표하는 왕이나 침략자를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 여기서 복수형 '그들 위에서'에서 단수형 '그의 어깨에서'로 바뀝니다. 이 단수는 억눌린 백성을 집합적으로 또는 분배적으로 가리킬 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַשּׁוּר
  english_pob_choice: Assyria
  chosen_korean: 앗시리아
  alternatives_korean:
  - 아시리아
  - 앗수르
  lexicon: HALOT
  rationale: 국가/제국을 가리키는 본문 흐름을 따라 고유명사로 옮기되, 한국어 외래어 표기상 표준적인 음역을 사용했습니다.
- source_word: בְּאַרְצִי
  english_pob_choice: in my land
  chosen_korean: 내 땅에서
  alternatives_korean:
  - 내 나라에서
  - 내 영토에서
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미인 '땅'을 살려 야훼의 소유성과 언약적 영토성을 드러냈습니다.
- source_word: הָרַי
  english_pob_choice: my mountains
  chosen_korean: 내 산들 위에서
  alternatives_korean:
  - 내 산에서
  - 내 산악 지대에서
  lexicon: HALOT
  rationale: 복수형과 소유격을 살리면서, 전치사 עַל의 공간적 이미지를 한국어에서 자연스럽게 드러내기 위해 '위에서'를 보탰습니다.
- source_word: אֲבוּסֶנּוּ
  english_pob_choice: I will trample him
  chosen_korean: 그를 짓밟을 것이니
  alternatives_korean:
  - 그를 밟아 누를 것이니
  - 그를 짓부술 것이니
  lexicon: HALOT
  rationale: בוס의 '짓밟다, 짓누르다'라는 강한 폭력적 이미지를 살리되, 한국어에서 가장 직접적인 표현을 택했습니다.
- source_word: וְסָר / יָסוּר
  english_pob_choice: will depart
  chosen_korean: 물러가고
  alternatives_korean:
  - 떠나고
  - 사라지고
  - 벗겨지고
  lexicon: HALOT
  rationale: 멍에와 짐이 압제에서 '벗겨져 떠나는' 그림을 살리기 위해 반복되는 סור를 동일하게 처리했습니다.
theological_decisions:
- issue: אַשּׁוּר의 범위
  chosen_reading: 앗시리아라는 제국 전체를 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 앗시리아 사람
  - 앗수르 왕
  rationale: 본절은 야훼의 땅에서 제국적 압제를 꺾는 장면이므로, 집단/정치적 실체를 우선 드러내는 번역이 문맥에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: '''그들''에서 ''그의 어깨''로의 수 변화'
  chosen_reading: 본문의 복수→단수 전환을 그대로 유지했습니다.
  alternative_readings:
  - '''그들의 어깨''로 평준화'
  rationale: 히브리어의 수 전환은 압제당하는 백성을 집합적으로/분배적으로 가리키는 효과를 낼 수 있으므로, 조화시키지 않고 원문 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
