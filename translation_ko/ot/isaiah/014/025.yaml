  to: 내 땅에서 앗수르를 꺾고 내 산들 위에서 그를 짓밟을 것입니다. 그러면 그의 멍에는 그들 위에서 물러가고, 그의 짐은 그의 어깨에서 물러날 것입니다.[a][b]
