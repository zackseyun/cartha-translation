id: ISA.14.28
reference: Isaiah 14:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַת מ֖וֹת הַ/מֶּ֣לֶךְ אָחָ֑ז הָיָ֖ה הַ/מַּשָּׂ֥א הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
  footnotes:
  - marker: a
    text: Or 'this pronouncement was' or, more formally, 'this burden was.'
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야 왕의 아버지 아하스가 죽은 해에, 이 예언이 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַשָּׂא는 예언 문맥에서 ‘예언’, ‘신탁’, 또는 전통적으로 ‘짐’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  english_pob_choice: In the year of the death of
  chosen_korean: “...가 죽은 해에”
  alternatives_korean:
  - “...의 죽음의 해에”
  - “...가 죽던 해에”
  lexicon: HALOT
  rationale: 히브리어의 연대 표지는 한국어에서 자연스럽게 “...가 죽은 해에”로 옮기는 것이 가장 직접적이며, ‘죽음의 해’보다 의미가 분명합니다.
- source_word: הַמֶּלֶךְ אָחָז
  english_pob_choice: King Ahaz
  chosen_korean: “아하스 왕”
  alternatives_korean:
  - “왕 아하스”
  - “아하스”
  lexicon: HALOT
  rationale: 히브리어의 정관사와 왕호를 반영하되, 한국어에서는 고유명사 뒤에 왕호를 두는 관용이 자연스럽습니다.
- source_word: הָיָה
  english_pob_choice: came
  chosen_korean: “이 예언이 주어졌습니다”
  alternatives_korean:
  - “이 예언이 있었습니다”
  - “이 예언이 일어났습니다”
  lexicon: HALOT
  rationale: הָיָה는 문자적으로 ‘있었다’이지만, כאן에서는 예언 선언의 발생/전달을 가리키므로 한국어로는 수동적 완료형이 더 정확하고 자연스럽습니다.
- source_word: הַמַּשָּׂא
  english_pob_choice: oracle
  chosen_korean: “이 예언”
  alternatives_korean:
  - “이 신탁”
  - “이 경고의 말씀”
  - “이 부담”
  lexicon: HALOT
  rationale: מַשָּׂא의 예언적 용례를 살리면서도 현대 독자에게 투명하게 전달하려면 ‘예언’이 가장 직접적입니다. 전통적 ‘신탁’은 가능하지만 덜 평이합니다.
theological_decisions:
- issue: מַשָּׂא의 번역에서 전통적 ‘burden’/‘짐’과 현대적 예언 용례의 긴장
  chosen_reading: ‘예언’으로 옮겨, 본문 표제가 전달하는 공식적 예언 선언의 성격을 드러냈습니다.
  alternative_readings:
  - ‘신탁’
  - ‘짐’
  rationale: 이 절은 다윗 왕조의 역사적 연대 표제이며, 여기서 מַשָּׂא를 ‘짐’으로 직역하면 현대 한국어에서 의미가 흐려집니다. 문맥상 예언 서문의 기능을 우선했습니다.
  doctrine_reference: 예언서 표제와 문맥상 기능에 대한 일반 번역 원칙
