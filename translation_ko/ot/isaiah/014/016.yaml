id: ISA.14.16
reference: Isaiah 14:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹאֶ֨י/ךָ֙ אֵלֶ֣י/ךָ יַשְׁגִּ֔יחוּ אֵלֶ֖י/ךָ יִתְבּוֹנָ֑נוּ הֲ/זֶ֤ה הָ/אִישׁ֙ מַרְגִּ֣יז הָ/אָ֔רֶץ מַרְעִ֖ישׁ מַמְלָכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
  footnotes:
  - marker: a
    text: Or 'they will examine you' / 'they will consider you.' The Hebrew verb can include the sense of close scrutiny, not only physical looking.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신을 보는 자들이 당신을 응시하며, 당신을 자세히 살필 것입니다. “이 사람이 땅을 떨게 하고, 왕국들을 흔든 자인가?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순한 눈길뿐 아니라, 가까이 살피거나 면밀히 검토하는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  english_pob_choice: those who see you
  chosen_korean: 당신을 보는 자들
  alternatives_korean:
  - 당신을 보는 이들
  - 당신을 지켜보는 자들
  lexicon: HALOT
  rationale: 분사적 표현이 주어 역할을 하므로 자연스럽게 ‘보는 자들’로 옮기되, 2인칭 목적어를 분명히 살렸습니다.
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  english_pob_choice: will stare at you
  chosen_korean: 당신을 응시하며
  alternatives_korean:
  - 당신을 바라보며
  - 당신을 주시하며
  lexicon: HALOT
  rationale: 지시적이고 고정된 시선을 나타내므로, 놀람과 집중을 함께 드러내는 ‘응시하며’가 적절합니다.
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  english_pob_choice: they will look closely at you
  chosen_korean: 당신을 자세히 살필 것입니다
  alternatives_korean:
  - 당신을 유심히 살필 것입니다
  - 당신을 면밀히 살필 것입니다
  lexicon: HALOT
  rationale: ‘살피다’는 관찰과 검토의 뜻을 함께 담을 수 있어, 단순한 시선보다 더 깊은 주의 깊은 관찰을 살립니다.
- source_word: מַרְגִּיז הָאָרֶץ
  english_pob_choice: who made the earth tremble
  chosen_korean: 땅을 떨게 하고
  alternatives_korean:
  - 땅을 흔들고
  - 땅을 진동하게 하고
  lexicon: HALOT
  rationale: 사역적 분사로서 결과를 강조하므로 ‘떨게 하고’가 원인의 힘을 자연스럽게 드러냅니다.
- source_word: מַרְעִישׁ מַמְלָכוֹת
  english_pob_choice: who shook kingdoms
  chosen_korean: 왕국들을 흔든 자인가
  alternatives_korean:
  - 나라들을 흔든 자인가
  - 왕국들을 떨게 한 자인가
  lexicon: HALOT
  rationale: 병렬 구조를 살려 앞절과 같은 방식으로 번역하되, ‘왕국들’은 문맥상 통치 권역 전체를 가리키는 표현으로 유지했습니다.
theological_decisions:
- issue: ‘이 사람’의 지시 대상
  chosen_reading: 본문의 조롱 질문을 인간 통치자에 대한 직접적 표현으로 유지했습니다.
  alternative_readings:
  - 사탄/루시퍼를 본문에 직접 반영
  - 인간 왕과 우주적 반역자를 동시에 본문화
  rationale: 히브리어 본문은 ‘그 사람’이라고 말하며, 즉각적 문맥도 바빌론 왕을 향한 조롱이므로, 후대의 해석을 번역문에 앞세우지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역에서 후대 신학적 동일시를 자동으로 해소하지 않음
