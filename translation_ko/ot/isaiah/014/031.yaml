  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
  footnotes:
  - marker: a
    text: Or 'Howl, O gate!'; the Hebrew verb can also be rendered 'howl' or 'lament.'
    reason: lexical_alternative
  - marker: b
    text: Or 'faint' or 'dissolve in fear' for 'melt away.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and no one lags behind in his appointed places.' The Hebrew final clause may refer to the invader's troops being fully assembled and orderly.
    reason: alternative_reading
translation:
  language: ko
  text: 문들아, 통곡하십시오! 도시야, 부르짖으십시오! 너희 모두, 블레셋아, 녹아버리십시오! 북쪽에서 연기가 오고, 그의 대열에는 뒤처진 자가 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성문아, 울부짖으십시오'로 옮길 수 있습니다. 히브리어 동사는 '울부짖다', '애곡하다'의 뜻도 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '무너져 두려움에 사로잡히십시오'처럼 옮길 수 있습니다. 히브리어는 '녹다', '기운이 빠지다'의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그의 지정된 자리들에는 뒤처진 자가 없습니다.'로도 이해할 수 있습니다. 마지막 절은 침공군이 완전히 집결해 질서정연하다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  english_pob_choice: Wail
  chosen_korean: 통곡하십시오
  alternatives_korean:
  - 울부짖으십시오
  - 애곡하십시오
  lexicon: HALOT
  rationale: ילל의 절망적 탄식 명령을 현대 한국어에서 가장 힘 있게 살리되, 문학적이면서도 과장되지 않게 옮겼습니다.
- source_word: שַׁעַר
  english_pob_choice: O gate
  chosen_korean: 문들아
  alternatives_korean:
  - 성문아
  - 문이여
  lexicon: HALOT
  rationale: 성읍의 공적 경계로서의 문/성문을 의인화한 호격으로 이해하여, 자연스러운 한국어 호격 표현을 택했습니다.
- source_word: נָמֹוג
  english_pob_choice: Melt away
  chosen_korean: 녹아버리십시오
  alternatives_korean:
  - 무너지십시오
  - 두려움에 사로잡히십시오
  lexicon: HALOT
  rationale: 물처럼 녹아 사라지는 이미지와 공포로 인한 붕괴를 함께 살리기 위해 직역에 가까운 표현을 사용했습니다.
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  english_pob_choice: all of you, Philistia
  chosen_korean: 너희 모두, 블레셋아
  alternatives_korean:
  - 블레셋아, 너희 모두
  - 블레셋 온 땅아
  lexicon: HALOT
  rationale: 2인칭 여성 단수의 집단 호소를 반영해 집합명사에 직접 부르는 형식을 살렸습니다.
- source_word: בְּמוֹעָדָיו
  english_pob_choice: in his ranks
  chosen_korean: 그의 대열에는
  alternatives_korean:
  - 그의 정해진 자리에
  - 그의 정렬된 진영에는
  lexicon: HALOT
  rationale: 문맥상 군사적 정렬과 질서를 가리키므로, '대열'로 옮겨 뒤처진 자가 없다는 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 북쪽에서 오는 '연기'와 마지막 절의 군사적 이미지
  chosen_reading: 이 절은 블레셋을 향한 심판 예언으로, 북쪽에서 오는 연기를 침공군의 접근과 연결해 읽었습니다.
  alternative_readings:
  - 연기를 문자적 재난의 표지로만 읽는 해석
  - 마지막 구절을 '정해진 때에 아무도 늦지 않는다'로 읽는 해석
  rationale: 영문 POB의 주해처럼, 마지막 절은 단순 시간표현보다 정돈된 침공군을 가리키는 것으로 읽는 편이 문맥과 더 잘 맞습니다.
  doctrine_reference: 예언서의 심판 경고와 군사적 비유
- issue: 호격과 명령형의 문체
  chosen_reading: 예언적 직접 호소를 살리기 위해 명령형을 유지하고, 현대 한국어 공적 호소에 맞게 '하십시오'체를 사용했습니다.
  alternative_readings:
  - 서술형으로 완화하는 번역
  - 고어적 '-하라'체 사용
  rationale: 원문의 긴박한 대면성을 보존하면서도, 합쇼체의 표준어 문체에 맞추기 위한 선택입니다.
  doctrine_reference: 예언자적 수사와 청중 반응
