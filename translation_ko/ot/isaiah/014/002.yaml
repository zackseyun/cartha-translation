review_pass:
  verdict: revise
  source_fidelity: 핵심 역전 표현인 וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם가 잘못 옮겨졌습니다. 초안의 ‘자신들을 사로잡은 자들의 포로가 되고’는 이스라엘이 이전 포로들의 포로가 된다는 반대 뜻입니다. 히브리어는 이스라엘이 자신들을 사로잡은 자들을 사로잡는다는 역전과 같은 어근의 말놀이를 나타냅니다. 또한 מְקוֹמָם의 지시 대상은 데려가는 ‘민족들’이 아니라 앞 절의 이스라엘/야곱이므로 ‘자기 곳’은 한국어에서 주어인 민족들을 가리키기 쉽습니다.
  naturalness: ‘그들을 데려가 자기 곳으로 인도하고’는 ‘데려가’와 ‘인도하고’가 다소 중복되고, ‘자기’의 선행사가 모호합니다. ‘그들을 데려다가 그들의 고향으로 인도하고’로 다듬으면 자연스럽고 문맥상 지시 대상도 분명해집니다. ‘남종과 여종으로 삼을 것입니다’는 한국어에서 인간을 대상으로 한 소유·예속 관계를 자연스럽게 표현하면서도 원문의 상태/용법을 유지합니다.
  terminology: ‘야훼’는 제공된 번역 방침과 일치합니다. ‘남종과 여종’은 성별 구분을 보존합니다. 각주 d의 ‘신명기 명칭’은 부정확한 표현(또는 오기)이므로 ‘하나님의 이름’으로 바로잡아야 합니다.
  issues:
