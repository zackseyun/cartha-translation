id: ISA.14.2
reference: Isaiah 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male slaves and female slaves. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
  footnotes:
  - marker: a
    text: Or 'will inherit them' for 'will take possession of them'; the Hebrew verb can carry inheritance language.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as male slaves and female slaves'; the text explicitly marks both genders.
    reason: lexical_alternative
  - marker: c
    text: Or 'They will take captive those who took them captive.' The Hebrew uses a wordplay on the same root for 'capture.'
    reason: lexical_alternative
  - marker: d
    text: '''the LORD'' renders the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들이 그들을 데려다가 그들의 고향으로 인도하고, 이스라엘의 집은 야훼의 땅에서 그들을 남종과 여종으로 삼을 것입니다.[a][b] 그들은 자신들을 사로잡은 자들을 사로잡고, 자신들을 억압하던 자들을 다스릴 것입니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 기업으로 받을 것입니다’. 히브리어 동사는 ‘상속’ 또는 ‘기업으로 받음’의 의미를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남종과 여종을 각각 분명히 구분합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 자신들을 사로잡은 자들을 사로잡는 자들이 될 것입니다’. 히브리어는 ‘사로잡다’라는 같은 어근을 반복하여 말놀이를 이룹니다.
    reason: lexical_alternative
  - marker: d
    text: ‘야훼’는 하나님의 이름 YHWH를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  english_pob_choice: Peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 나라들
  lexicon: HALOT
  rationale: עַמִּים은 민족/백성의 복수로 쓰였으므로, 여기서는 집합적 정치체보다 민족들의 복수성을 살리는 ‘민족들’이 자연스럽습니다.
- source_word: וֶהֱבִיאוּם אֶל מְקוֹמָם
  english_pob_choice: and bring them to their place
  chosen_korean: 자기 곳으로 인도하고
  alternatives_korean:
  - 그들의 자리로 데리고 가고
  - 그들의 땅으로 데려가고
  lexicon: HALOT
  rationale: הביא는 ‘데려오다/인도하다’의 뜻이므로, 포로 회복의 이동을 살려 ‘인도하다’를 택했고, מקום은 여기서 구체적 지점보다 ‘자기 곳’으로 옮겼습니다.
- source_word: וְהִתְנַחֲלוּם
  english_pob_choice: will possess them
  chosen_korean: 소유하게 될 것입니다
  alternatives_korean:
  - 그들을 차지하게 될 것입니다
  - 그들을 기업으로 받게 될 것입니다
  lexicon: HALOT
  rationale: 히트파엘 נחל은 문맥상 ‘소유로 삼다/기업으로 받다’의 의미이므로, 직역의 힘을 유지하면서도 한국어 문맥에 맞는 ‘소유하다’로 옮겼습니다.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  english_pob_choice: as male slaves and female slaves
  chosen_korean: 남종과 여종
  alternatives_korean:
  - 노예 남자와 노예 여자
  - 종들과 여종들
  lexicon: HALOT
  rationale: 본문이 남녀 모두의 종속 상태를 분명히 하므로 양성 구분을 유지해야 하며, 한국어 성경에서 익숙한 ‘남종/여종’이 ‘slaves’의 강한 구속 상태를 비교적 정확히 드러냅니다.
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  english_pob_choice: and they will rule over their oppressors
  chosen_korean: 자기들을 억압하던 자들을 다스릴 것입니다
  alternatives_korean:
  - 그들의 압제자들을 다스릴 것입니다
  - 그들의 채찍질하던 자들을 다스릴 것입니다
  lexicon: HALOT
  rationale: נגשׂ는 단순한 통치 대상이 아니라 압제/강제 노동의 뉘앙스를 띠므로, 포괄적으로 ‘억압하던 자들’로 옮겨 역전의 의미를 살렸습니다.
theological_decisions:
- issue: יוָה(YHWH)의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약명 יְהוָה를 직접 사용하므로, 제목형 대체어보다 고유명사 전사인 ‘야훼’를 유지해 신학적·문헌학적 식별성을 보존합니다.
  doctrine_reference: 'Contested terms table: יהוה / YHWH → 야훼'
- issue: 포로 역전의 사회적 표현
  chosen_reading: 남종과 여종으로 소유하게 될 것입니다
  alternative_readings:
  - 종으로 삼게 될 것입니다
  - 종과 여종으로 삼게 될 것입니다
  rationale: 히브리어는 종속된 신분을 직접 말하며, 본문은 포로에서 역전되는 정치·사회적 상황을 서술하므로 그 긴장을 약화시키지 않도록 완곡화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5; contested bonded-status terminology
