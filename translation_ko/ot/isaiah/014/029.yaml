id: ISA.14.29
reference: Isaiah 14:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: ko
  text: 블레셋아, 너희 모두여, 기뻐하지 말라. 너를 치던 막대기가 부러졌기 때문이다. 이는 뱀의 뿌리에서 독사가 나오고, 그 열매는 날아다니는 불뱀일 것이기 때문이다.
  philosophy: formal
lexical_decisions:
- source_word: אַל תִּשְׂמְחִי
  english_pob_choice: Do not rejoice
  chosen_korean: 기뻐하지 말라
  alternatives_korean:
  - 즐거워하지 말라
  - 기뻐하지 마십시오
  lexicon: שׂמח
  rationale: 직설적 금지를 살려 예언적 경고의 어조를 유지했습니다. 청중을 향한 직접 금령이므로 합쇼체 본문에 맞게 '-말라'형을 사용했습니다.
- source_word: פְלֶשֶׁת כֻּלֵּךְ
  english_pob_choice: all of you Philistia
  chosen_korean: 블레셋아, 너희 모두여
  alternatives_korean:
  - 블레셋이여
  - 블레셋 땅의 모든 자들아
  lexicon: פְלֶשֶׁת
  rationale: 지명 פלשת를 단순한 땅 이름이 아니라 집합적 호칭으로 부르는 힘을 살리기 위해 '블레셋아, 너희 모두여'로 옮겼습니다.
- source_word: שֵׁבֶט מַכֵּךְ
  english_pob_choice: the rod that struck you
  chosen_korean: 너를 치던 막대기
  alternatives_korean:
  - 너를 치던 지팡이
  - 너를 때리던 몽둥이
  lexicon: שֵׁבֶט
  rationale: שֵׁבֶט의 기본적 '막대기/지팡이' 의미를 유지하되, 징벌 도구의 뉘앙스를 과도하게 해석하지 않도록 '막대기'로 번역했습니다.
- source_word: מִשֹּׁרֶשׁ נָחָשׁ
  english_pob_choice: from the root of the serpent
  chosen_korean: 뱀의 뿌리에서
  alternatives_korean:
  - 독사의 뿌리에서
  - 뱀의 근원에서
  lexicon: שֹׁרֶשׁ
  rationale: 영어 POB의 선택을 따라 'root'의 계통/근원 이미지를 살렸고, 이어지는 독사와 날아다니는 불뱀의 연쇄를 위해 '뿌리'를 유지했습니다.
- source_word: צֶפַע ... שָׂרָף מְעוֹפֵף
  english_pob_choice: a viper ... a flying fiery serpent
  chosen_korean: 독사 ... 날아다니는 불뱀
  alternatives_korean:
  - 독사 ... 날개 달린 불뱀
  - 살무사 ... 날아다니는 불뱀
  lexicon: צֶפַע / שָׂרָף מְעוֹפֵף
  rationale: צֶפַע는 일반적으로 '독사'로, שָׂרָף의 불뱀 이미지는 전통적 종교어보다 직역적 표현인 '불뱀'으로 살렸습니다. מְעוֹפֵף는 '날아다니는'으로 옮겨 동적 형용사의 이미지를 보존했습니다.
theological_decisions:
- issue: 예언 경고의 2인칭 호격과 금령의 어조
  chosen_reading: 블레셋을 집합적 호격으로 직접 부르며, 단호한 금령 '기뻐하지 말라'를 유지했습니다.
  alternative_readings:
  - 완곡한 권고형으로 옮김
  - 주어를 평서적으로 바꿈
  rationale: 본문은 승리를 기뻐하는 상대에게 직접 경고하는 예언적 선언이므로, 완곡화하지 않고 청자 직접호칭과 금지형을 살리는 것이 소스의 힘을 보존합니다.
  doctrine_reference: 예언서의 심판 경고 어조
