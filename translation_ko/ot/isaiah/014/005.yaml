  source_fidelity: 히브리어 본문은 ‘야훼께서 악한 자들의 지팡이, 통치자들의 홀을 꺾으셨습니다’라는 두 병렬 목적어를 제시합니다. 초안은 שָׁבַר의 완료형, יְהוָה의 고유명, מַטֵּה와 שֵׁבֶט의 구별, 그리고 복수형 רְשָׁעִים 및 מֹשְׁלִים을 충실히 반영합니다.
