  text: שָׁבַ֥ר יְהוָ֖ה מַטֵּ֣ה רְשָׁעִ֑ים שֵׁ֖בֶט מֹשְׁלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/005.yaml
  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
  footnotes:
  - marker: a
    text: 'Or ''rod of the wicked.'' The Hebrew uses two parallel terms for an instrument of authority: ''staff'' and ''scepter.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 악한 자들의 지팡이와 통치자들의 홀을 꺾으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 자들의 막대기.’ 히브리어는 권위의 도구를 나타내는 두 평행어, ‘지팡이’와 ‘홀’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַר
  english_pob_choice: has broken
  chosen_korean: 꺾으셨습니다
  alternatives_korean:
  - 부러뜨리셨습니다
  - 깨뜨리셨습니다
  lexicon: WLC/HALOT
  rationale: 완료된 파괴 행위를 자연스러운 현대 한국어로 옮기면서, 왕권의 상징물을 부러뜨려 권세를 꺾는 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 문서화된 기본 원칙에 따라 신성한 이름 יְהוָה는 칭호로 대체하지 않고 고유명사 ‘야훼’로 옮겼습니다.
- source_word: מַטֵּה
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 홀
  lexicon: HALOT
  rationale: מַטֵּה는 일반적으로 지팡이/막대의 뜻이지만, כאן에서는 통치의 상징성과 שֵׁבֶט와의 평행을 살리되 한국어에서 너무 기술적인 느낌을 피하려고 ‘지팡이’로 옮겼습니다.
- source_word: שֵׁבֶט
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 막대기
  - 지팡이
  lexicon: HALOT
  rationale: 통치자들과 평행을 이루므로 단순한 막대보다 왕권의 표지인 ‘홀’이 מקור의 상징적 의미를 더 직접적으로 드러냅니다.
- source_word: מֹשְׁלִים
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 다스리는 자들
  - 군주들
  lexicon: HALOT
  rationale: 분사 복수형의 직설적 명사화로, 도덕적 평가를 덧붙이지 않고 권력을 행사하는 자들을 그대로 드러내기 위해 ‘통치자들’을 택했습니다.
theological_decisions:
- issue: 여호와의 이름을 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 טetragrammaton을 직접 사용하므로, 전통적 대체어보다 하나님의 언약 이름을 보존하는 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
