source:
  edition: WLC
  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
  footnotes:
  - marker: a
    text: Or 'junipers' or 'fir trees'; the exact species denoted by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 사이프러스들도 당신을 두고 기뻐하며, 레바논의 백향목들도 기뻐합니다. “당신이 누운 뒤로는 나무 베는 자가 우리를 향해 올라오지 않습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשׁ는 정확한 수종이 확정되지 않아, ‘노간주나무’나 ‘전나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹשִׁים
  english_pob_choice: cypresses
  chosen_korean: 소나무들
  alternatives_korean:
  - 사이프러스들
  - 노간주나무들
  - 전나무들
  lexicon: HALOT
  rationale: 히브리어 בְּרוֹשׁ는 정확한 수종이 확정되지 않은 침엽수 계열로, 한국어에서는 문맥상 자연스럽고 익숙한 ‘소나무들’로 옮기되 수종 불확실성은 보존하지 않았습니다.
- source_word: שָׂמְח֥וּ לְךָ
  english_pob_choice: rejoice over you
  chosen_korean: 당신을 두고 기뻐합니다
  alternatives_korean:
  - 당신 때문에 기뻐합니다
  - 당신 위에 기뻐합니다
  - 당신을 보고 기뻐합니다
  lexicon: HALOT
  rationale: לְךָ가 단순 목적어 이상의 방향성을 가지므로, 한국어에서는 ‘당신을 두고’로 타인에 대한 반응을 드러내면서도 조롱 섞인 의인화의 뉘앙스를 살렸습니다.
- source_word: אַרְזֵי לְבָנוֹן
  english_pob_choice: the cedars of Lebanon
  chosen_korean: 레바논의 백향목들
  alternatives_korean:
  - 레바논 백향목들
  - 레바논의 삼나무들
  lexicon: HALOT
  rationale: אַרֶז는 전통적으로 ‘백향목’으로 널리 알려져 있고, 레바논과 결합된 관용적 지명을 살리기 위해 ‘레바논의 백향목들’로 옮겼습니다.
- source_word: הַכֹּרֵת
  english_pob_choice: woodcutter
  chosen_korean: 나무 베는 자
  alternatives_korean:
  - 벌목꾼
  - 나무꾼
  - 벌채하는 자
  lexicon: HALOT
  rationale: 분사 הַכֹּרֵת는 단순히 ‘베는 사람’을 뜻하므로, 직업명처럼 굳어진 표현보다 기능을 그대로 드러내는 ‘나무 베는 자’가 원문의 행위 중심 이미지를 더 잘 보존합니다.
theological_decisions:
- issue: ‘שָׁכַבְתָּ’의 비유적 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘엎드러진 뒤로’로 옮겨 죽음/몰락의 함의를 드러내되, 본문의 은유를 직접적으로 ‘죽었다’로 바꾸지는 않았습니다.
  alternative_readings:
  - 당신이 죽은 뒤로
  - 당신이 잠든 뒤로
  - 당신이 쓰러진 뒤로
  rationale: 이 구절은 조롱시의 시적 표현으로서 ‘누운다’의 은유를 유지하면서도, 문맥상 분명한 몰락의 의미가 한국어에서 즉시 읽히도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
