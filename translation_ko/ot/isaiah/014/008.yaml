  rationale: 수종이 불확실한 히브리어 명사는 영어 POB의 본문 선택에 맞추어 ‘사이프러스’로 옮기고 각주에서 대안을 보존했습니다. ‘누운 뒤로’는 죽음과 몰락을 암시하는 원문의 은유를 해설적으로 확정하지 않고 유지합니다. 마지막 절은 벌목꾼이 나무들을 향해 올라오는 이미지를 자연스러운 한국어로 표현했습니다.
