id: ISA.14.11
reference: Isaiah 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
  footnotes:
  - marker: a
    text: Or 'your majesty' or 'your pomp' for 'your pride.' The Hebrew term can denote exalted splendor as well as arrogant pride.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead; alternatively, 'the grave' or 'the realm of the dead.'
    reason: lexical_alternative
  - marker: c
    text: Or 'lyres' or more generally 'stringed instruments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 교만은 스올로 끌어내려졌고, 네 수금의 소리도 함께하였으며, 네 아래에는 구더기가 깔리고 네 덮개는 벌레입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위엄’, ‘화려함’. 히브리어 גאון은 이 문맥에서 왕적 찬란함과 교만을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스올은 죽은 자들의 영역입니다. 또는 ‘무덤’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘현악기들’, 더 넓게는 ‘현악기 소리’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד / גְּאוֹנֶךָ
  english_pob_choice: has been brought down / your pomp
  chosen_korean: 끌어내려졌고 / 네 교만
  alternatives_korean:
  - 네 위엄
  - 네 화려함
  - 네 자랑
  lexicon: HALOT
  rationale: הוּרַד의 수동적 ‘내려짐’을 ‘끌어내려지다’로 살렸고, גאון은 이 문맥의 왕적 찬란함과 교만의 뉘앙스를 함께 드러내기 위해 ‘교만’으로 옮겼습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 나라
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역을 유지했습니다. ‘무덤’으로 좁히면 개념이 축소되고, 후대적 ‘지옥’ 의미로 오해될 수 있습니다.
- source_word: הֶמְיַת נְבָלֶיךָ
  english_pob_choice: the sound of your harps
  chosen_korean: 네 수금의 소리
  alternatives_korean:
  - 네 현악기의 소리
  - 네 비파 소리
  lexicon: HALOT
  rationale: נבל은 수금/비파 계열의 현악기를 가리키므로, 한국어에서 자연스럽고 이미지가 분명한 ‘수금’으로 옮겼습니다.
- source_word: רִמָּה / תּוֹלֵעָה
  english_pob_choice: maggots / worms
  chosen_korean: 구더기 / 벌레
  alternatives_korean:
  - 유충 / 벌레들
  - 구더기 / 구더기
  lexicon: HALOT
  rationale: 시체 부패의 혐오감을 살리기 위해 רִמָּה는 ‘구더기’로, 병렬되는 תּוֹלֵעָה는 보다 일반적인 ‘벌레’로 구분해 옮겼습니다.
theological_decisions:
- issue: 스올의 표기와 개념 보존
  chosen_reading: 스올
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 본문은 사후 세계로의 추락을 조롱시적으로 묘사하므로, 개념을 단순한 묘지로 축소하지 않고 히브리어 고유 개념을 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
