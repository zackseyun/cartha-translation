revisions:
- from: 너는 바벨의 왕을 거슬러 이 조소를 집어 들고 이렇게 말해야 합니다. “어찌 압제가 그쳤으며, 오만이 그쳤는가!”[a]
  to: 당신은 바빌론 왕을 향하여 이 조롱의 노래를 읊고 이렇게 말할 것입니다. “어찌하여 압제자가 그쳤고, 오만[a]이 그쳤는가!”
  rationale: 원문의 인칭 명사와 조롱의 노래라는 관용적 표현을 바로잡고, 현대 합쇼체로 문체를 통일했습니다. 의미가 논쟁적인 מַדְהֵבָה는 영어 POB의 현행 본문 선택인 ‘오만’을 유지하되, 본문이 확정적 해석처럼 보이지 않도록 해당 단어에 각주를 직접 연결하여 주요 대안을 제시했습니다.
