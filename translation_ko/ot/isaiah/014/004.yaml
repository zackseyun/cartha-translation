reference: Isaiah 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשָׂ֜אתָ הַ/מָּשָׁ֥ל הַ/זֶּ֛ה עַל מֶ֥לֶךְ בָּבֶ֖ל וְ/אָמָ֑רְתָּ אֵ֚יךְ שָׁבַ֣ת נֹגֵ֔שׂ שָׁבְתָ֖ה מַדְהֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
  footnotes:
  - marker: a
    text: Or possibly, “How the oppressor has ceased, how the onslaught/exacting tyranny has ceased!” The Hebrew word translated “golden city” (מַדְהֵבָה) is rare and uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 바빌론 왕을 향하여 이 조롱의 노래를 읊고 이렇게 말할 것입니다. “어찌하여 압제자가 그쳤고, 오만[a]이 그쳤는가!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַדְהֵבָה는 매우 희귀한 말이라 뜻이 확실하지 않습니다. 여기서는 ‘오만’으로 옮겼으나, 전통적으로는 ‘금빛 도성’으로, 다른 해석에서는 ‘폭정’ 또는 ‘가혹한 압제’로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ ... הַמָּשָׁל
  english_pob_choice: you will take up this taunt
  chosen_korean: 이 조소를 집어 들고
  alternatives_korean:
  - 이 비유를 들어
  - 이 풍자시를 들어
  - 이 조롱을 올려
  lexicon: HALOT
  rationale: נשא + משל은 관용적으로 ‘말을 들어 올려 읊다/선포하다’의 뜻이므로, 한국어에서는 자연스러운 관용인 ‘조소를 집어 들고’로 옮겨 조롱의 기능을 드러냈습니다.
- source_word: עַל מֶלֶךְ בָּבֶל
  english_pob_choice: against the king of Babylon
  chosen_korean: 바벨의 왕을 거슬러
  alternatives_korean:
  - 바벨 왕에 대하여
  - 바벨의 왕에게 맞서
  - 바벨의 왕을 향하여
  lexicon: HALOT
  rationale: 전달 대상이 중립적 진술이 아니라 심판적 조롱이므로, 영어 POB의 adversative force를 살려 ‘거슬러’로 옮겼습니다.
- source_word: נֹגֵשׂ
  english_pob_choice: the oppressor
  chosen_korean: 압제
  alternatives_korean:
  - 억압자
  - 독촉하는 자
  - 폭압자
  lexicon: HALOT
  rationale: 명사형 נֹגֵשׂ는 사람 자체보다 그가 행하는 압박의 역할을 강하게 드러내므로, 한국어에서는 행위의 성격을 살린 ‘압제’로 처리했습니다.
- source_word: מַדְהֵבָה
  english_pob_choice: the insolence
  chosen_korean: 오만
  alternatives_korean:
  - 폭정
  - 폭압
  - 금빛 도성
  lexicon: HALOT
  rationale: 희귀어 מַדְהֵבָה는 의미가 불확실하지만, 최근 본문 판단과 영어 감사기록이 가리키는 방향을 따라 ‘오만’으로 옮겨 모욕적 태도의 병행성을 살렸습니다.
theological_decisions:
- issue: 희귀어 מַדְהֵבָה의 처리
  chosen_reading: 본문의 조롱 형식을 유지하면서, 의미가 확실한 범위 안에서 ‘오만’으로 번역했습니다.
  alternative_readings:
  - ‘금빛 도성’처럼 전통적이지만 어휘적으로 불확실한 해석
  - ‘폭정’ 또는 ‘압제’로 보는 해석
  rationale: 이 절은 교리 논쟁보다 어휘-본문 문제에 가깝습니다. 확실한 의미를 우선하고, 불확실한 전통 번역은 본문에 반영하지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
