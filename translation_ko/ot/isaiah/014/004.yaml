  verdict: revise
  source_fidelity: 핵심 구조는 대체로 반영했으나, נֹגֵשׂ는 행위나 상태인 ‘압제’가 아니라 압제하는 자를 가리키는 남성 단수 명사이므로 ‘압제자’로 옮겨야 합니다. 또한 אֵיךְ는 여기서 정보 질문이라기보다 조롱 섞인 감탄적 수사 표현입니다. מַדְהֵבָה는 희귀어로 의미가 확정되지 않았으므로 본문의 ‘오만’을 유지하되, 각주를 해당 단어에 직접 연결하고 대안의 불확실성을 분명히 하는 것이 안전합니다.
  naturalness: ‘조소를 집어 들고’는 한국어에서 자연스러운 성경적 관용이 아닙니다. ‘조롱의 노래를 읊고’가 נשא + משל의 관용적 의미와 문체를 더 자연스럽게 전달합니다. 또한 ‘너는’과 ‘말해야 합니다’는 높임 종결이 불일치하므로, 요청된 현대 합쇼체에 맞추어 ‘당신은 … 말할 것입니다’로 통일했습니다.
  terminology: ‘바빌론 왕’은 현대 한국어 성경 번역에서 널리 쓰이는 지명 표기입니다. מַדְהֵבָה의 본문상 번역어 ‘오만’은 영어 POB 감사기록의 현행 본문을 따르되, 이를 확정적 어의로 제시하지 않도록 각주를 보완했습니다. ‘금빛 도성’은 전통적 해석으로, ‘폭정/가혹한 압제’는 현대의 다른 어휘적 제안으로 구분했습니다.
