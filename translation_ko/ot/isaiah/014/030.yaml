id: ISA.14.30
reference: Isaiah 14:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָעוּ֙ בְּכוֹרֵ֣י דַלִּ֔ים וְ/אֶבְיוֹנִ֖ים לָ/בֶ֣טַח יִרְבָּ֑צוּ וְ/הֵמַתִּ֤י בָֽ/רָעָב֙ שָׁרְשֵׁ֔/ךְ וּ/שְׁאֵרִיתֵ֖/ךְ יַהֲרֹֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
  footnotes:
  - marker: a
    text: Or 'the poorest of the poor.' The Hebrew literally reads 'the firstborn of the poor,' which may function idiomatically as an intensification.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew has 'he will slay your remnant.' The subject may be left indefinite, or understood as famine/personified judgment, rather than being made explicit in translation.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 자들의 맏배는 먹이를 찾아 다니고, 궁핍한 자들은 안전하게 누울 것입니다. 그러나 나는 기근으로 당신의 뿌리를 죽일 것이며, 그것이 당신의 남은 자를 죽일 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난한 자들의 맏배’는 히브리어를 직역한 표현으로, ‘가장 가난한 자들’이라는 관용적 이해도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 히브리어는 ‘그것이 당신의 남은 자를 죽일 것이다’처럼 읽을 수 있어, 기근을 주체로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  english_pob_choice: will graze
  chosen_korean: 먹이를 찾아 다니고
  alternatives_korean:
  - 먹을 것입니다
  - 풀을 뜯을 것입니다
  lexicon: HALOT
  rationale: רעה의 목축 이미지를 살리되 한국어에서 ‘가난한 자들의 맏배’와 함께 자연스럽게 읽히도록 ‘먹이를 찾아 다니다’로 옮겼습니다.
- source_word: בְּכוֹרֵי דַלִּים
  english_pob_choice: the firstborn of the poor
  chosen_korean: 가난한 자들의 맏배
  alternatives_korean:
  - 가난한 자들의 첫째
  - 가난한 자들 가운데 가장 가난한 자
  lexicon: HALOT
  rationale: ‘맏배’는 문자 그대로 ‘firstborn’을 반영하면서도 비유적 병행구에서 한국어로 가장 덜 낯설게 어감을 유지합니다.
- source_word: לָבֶטַח
  english_pob_choice: in safety
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 안심하고
  lexicon: HALOT
  rationale: לבטח의 의미인 안전/보장을 간결한 부사로 살려 ‘누울 것입니다’와 자연스럽게 결합했습니다.
- source_word: וְהֵמַתִּי בָרָעָב
  english_pob_choice: I will kill ... with famine
  chosen_korean: 기근으로 당신의 뿌리를 죽일 것이며
  alternatives_korean:
  - 기근으로 당신의 뿌리를 없애 버릴 것이며
  - 기근으로 당신의 뿌리를 죽게 할 것이며
  lexicon: HALOT
  rationale: הֵמַתִּי는 사역형으로 ‘죽게 하다/죽이다’의 강한 심판 선언을 담으므로 직설적으로 옮겼고, בָרָעָב는 수단을 나타내어 ‘기근으로’가 자연합니다.
- source_word: שָׁרְשֵׁךְ / וּשְׁאֵרִיתֵךְ
  english_pob_choice: your root / your remnant
  chosen_korean: 당신의 뿌리 / 당신의 남은 자
  alternatives_korean:
  - 당신의 뿌리 / 당신의 잔여
  - 당신의 근원 / 당신의 남은 것
  lexicon: HALOT
  rationale: ‘뿌리’는 מקור/기초의 은유를 그대로 살리고, שְׁאֵרִית는 예언서의 ‘남은 자’ 용례를 반영해 ‘남은 자’로 옮겼습니다.
theological_decisions:
- issue: 마지막 동사의 주체가 문법적으로 3인칭 단수로 전환됨
  chosen_reading: ‘그것이 당신의 남은 자를 죽일 것입니다’로 유지하여 주체를 기근 쪽으로 읽되, 원문의 긴장을 그대로 보존합니다.
  alternative_readings:
  - ‘그가 당신의 남은 자를 죽일 것입니다’
  - ‘주께서 당신의 남은 자를 죽이실 것입니다’
  rationale: 히브리어는 1인칭(‘내가 죽일 것이다’)에서 3인칭 단수로 바뀌므로, 한국어도 이를 평탄화하지 않고 기근의 의인화/도구성을 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
