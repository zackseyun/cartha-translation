lexical_decisions:
- source_word: נָחָה / שָׁקְטָה
  english_pob_choice: is at rest / quiet
  chosen_korean: 쉼과 고요함에 있습니다
  alternatives_korean:
  - 쉬고 고요합니다
  - 안식하고 고요합니다
  - 쉼 가운데 있습니다
  lexicon: HALOT
  rationale: 두 동사는 함께 땅의 정착된 평온 상태를 그리므로, 한국어에서도 상태 표현으로 묶어 자연스럽게 전달했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: All the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 땅 전체
  - 온 세상 땅
  lexicon: HALOT
  rationale: 문맥상 세계적 범위를 가리키므로 ‘땅’보다 넓은 의미를 보존하되, 한국어에서 가장 간결한 ‘온 땅’으로 옮겼습니다.
- source_word: פָּצְחוּ רִנָּה
  english_pob_choice: they break out in singing
  chosen_korean: 노래로 터져 나옵니다
  alternatives_korean:
  - 기쁨의 노래로 터져 나옵니다
  - 노래를 터뜨립니다
  - 환호하며 노래합니다
  lexicon: HALOT
  rationale: פָּצַח는 단순한 ‘노래하다’보다 소리가 갑자기 터져 나오는 역동성을 지니므로, 그 발화성을 살려 ‘터져 나옵니다’로 옮겼습니다.
theological_decisions:
- issue: 문장 전체의 시제와 상태 표현
  chosen_reading: 과거형 동사들의 결과 상태를 현재적 상태로 풀어 읽었습니다.
  alternative_readings:
  - ‘온 땅이 쉬고 고요했습니다’처럼 과거 서술로 옮김
  - ‘온 땅이 쉼을 얻었고 고요해졌습니다’처럼 완료를 강조함
  rationale: 히브리어 완료형이 여기서는 사건의 현재적 결과를 강조하므로, 독자가 시적 진술의 상태를 즉시 느끼도록 현재형으로 번역했습니다.
  doctrine_reference: 히브리어 완료형의 결과 상태 용법
