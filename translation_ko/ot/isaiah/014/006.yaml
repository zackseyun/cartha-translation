review_pass:
  verdict: revise
  source_fidelity: 첫 두 병행구는 원문의 분사적·반복적 폭압 묘사를 대체로 잘 반영하지만, ‘치시며/뒤쫓으셨습니다’의 높임과 과거 종결은 원문에 없는 높임을 부가합니다. 또한 מֻרְדָּף는 형태상 수동분사이므로, 이를 단순히 능동적 ‘뒤쫓으셨습니다’로 확정하는 것은 원문의 난해성과 수동성을 충분히 보존하지 못합니다. 본문은 영어 POB의 ‘unrelenting persecution’처럼 박해의 지속을 표현하고, 대안 독법은 각주에서 보존하는 것이 안전합니다.
  naturalness: ‘분노로 치시며 끊임없는 매질로 치고’는 ‘치다’가 겹쳐 다소 부자연스럽습니다. ‘분노하여 민족들을 끊임없이 치며’가 현대 표준어에서 더 간결하고 시적 병행도 잘 살아납니다. 비존대 서술인 ‘치며…다스리고…박해하였습니다’는 왕에 대한 본문 문맥에도 자연스럽고 현대 합쇼체 문장입니다.
  terminology: עמים/גוים의 구별을 위해 ‘민족들’과 ‘나라들’을 유지할 수 있습니다. רדה는 ‘다스리다’가 적절합니다. ‘가차 없이’는 בְּלִי חָשָׂךְ의 ‘아끼지 않고/사리지 않고’라는 뜻을 자연스럽게 전달합니다. 다만 마지막 구절의 수동분사에 관한 대안은 ‘박해받다’ 또는 ‘뒤쫓김을 당하다’로 명시해야 합니다.
  issues:
  - severity: medium
    issue: 불필요한 높임 표현
    rationale: ‘치시며’, ‘뒤쫓으셨습니다’는 원문에 없는 주체 높임을 넣습니다. 본문의 바빌론 왕/압제자에 대한 조롱 노래의 어조에도 비존대 서술이 더 적절합니다.
  - severity: high
    issue: 마지막 수동분사의 능동적 확정
    rationale: מֻרְדָּף는 수동분사이며 구문이 압축되고 난해합니다. ‘뒤쫓으셨습니다’는 주체의 능동 추격으로 확정하여 형태적 긴장을 지웁니다. 본문은 ‘가차 없이 박해하였습니다’로 영어 POB의 명사적 ‘박해’를 따라가되, 수동적 대안은 각주에서 분명히 보존합니다.
  - severity: low
    issue: ‘치다’의 중복
    rationale: ‘분노로 치시며 끊임없는 매질로 치고’는 동일 동사의 반복이 한국어에서 어색합니다. 부사화하여 ‘끊임없이 치며’로 옮기면 의미 손실 없이 자연스럽습니다.
  - severity: low
    issue: 각주 a의 표지 위치
