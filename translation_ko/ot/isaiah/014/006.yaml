id: ISA.14.6
reference: Isaiah 14:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַכֶּ֤ה עַמִּים֙ בְּ/עֶבְרָ֔ה מַכַּ֖ת בִּלְתִּ֣י סָרָ֑ה רֹדֶ֤ה בָ/אַף֙ גּוֹיִ֔ם מֻרְדָּ֖ף בְּלִ֥י חָשָֽׂךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
  footnotes:
  - marker: a
    text: Or 'without sparing' for 'without restraint.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the final clause is compressed and may also be understood as describing nations being relentlessly pursued.
    reason: alternative_reading
translation:
  language: ko
  text: 분노하여 민족들을 끊임없이 치며, 노여움으로 나라들을 다스리고, 가차 없이 박해하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아끼지 않고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 마지막 구절은 압축되어 있습니다. 나라들이 가차 없이 박해받거나 끈질기게 뒤쫓김을 당하는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  english_pob_choice: striking peoples
  chosen_korean: 민족들을 분노로 치시며
  alternatives_korean:
  - 백성들을 치시며
  - 나라들을 치시며
  lexicon: HALOT
  rationale: מַכֶּה는 진행형 분사로 반복적·지속적 행위를 나타내므로 한국어도 동사적 분사구로 살렸고, עַמִּים은 뒤의 גּוֹיִם과 구별되도록 ‘민족들’로 옮겼습니다.
- source_word: בְּעֶבְרָה מַכַּת בִּלְתִּי סָרָה
  english_pob_choice: in fury with an unceasing blow
  chosen_korean: 분노로 치시며 끊임없는 매질로 치고
  alternatives_korean:
  - 격노로 치시며 멈추지 않는 타격으로 치고
  - 진노로 치시며 끝없는 매질로 치고
  lexicon: HALOT
  rationale: עֶבְרָה는 넘치는 분노/격노의 뜻이므로 ‘분노로’로, מַכַּת은 폭력적 타격의 이미지를 살려 ‘매질’로 옮겼으며, בִּלְתִּי סָרָה는 ‘그치지 않는/서지 않는’ 의미를 반영해 ‘끊임없는’으로 처리했습니다.
- source_word: רֹדֶה בָאַף גּוֹיִם
  english_pob_choice: ruling nations in anger
  chosen_korean: 나라들을 노여움으로 다스리며
  alternatives_korean:
  - 나라들을 진노로 지배하며
  - 민족들을 분노로 군림하며
  lexicon: HALOT
  rationale: רדה는 통치/다스림의 핵심을 유지하는 것이 적절해 ‘다스리며’로 옮겼고, אַף의 관용적 의미를 따라 ‘노여움’으로 번역해 폭압적 통치를 드러냈습니다.
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  english_pob_choice: with unrelenting persecution
  chosen_korean: 가차 없이 뒤쫓으셨습니다
  alternatives_korean:
  - 가차 없이 박해하셨습니다
  - 멈추지 않고 추격하셨습니다
  lexicon: HALOT
  rationale: 마지막 구절은 압축된 표현으로 능동/수동의 해석 여지가 있으나, 문맥상 폭압적 पीछा/박해의 지속성을 살리는 것이 핵심이므로 ‘가차 없이’와 ‘뒤쫓으셨습니다’로 긴장감을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 압축된 수동분사 구문
  chosen_reading: 주어의 지속적 폭력과 압제가 마지막 구절까지 이어진다는 흐름을 살려, 문맥상 박해의 무자비함을 강조했습니다.
  alternative_readings:
  - 마지막 구절을 ‘쫓기며’처럼 대상의 상태로 읽는 해석
  - ‘숨기지 않고/아끼지 않고’의 의미를 더 직접적으로 드러내는 해석
  rationale: 히브리어는 매우 압축되어 있어 문맥을 따라 어느 정도 해석이 불가피합니다. 다만 번역은 본문의 폭압적 이미지와 서술 흐름을 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문의 시적 압축과 문맥 우선 원칙
