  rationale: 반복되는 폭압 행위를 나타내는 원문의 병행 구조를 ‘치며, 다스리고, 박해하였습니다’로 간결하게 살렸습니다. 원문에 없는 높임을 제거하고, 중복된 ‘치다’를 자연스럽게 정리했습니다. 마지막 구절은 난해한 수동분사를 두고 있으므로 본문에서는 영어 POB가 채택한 ‘unrelenting persecution’의 의미를 자연스러운 한국어 동사로 표현하되, 수동적·추격적 독법을 각주에 보존했습니다. 각주 a의 표지도 실제로 수식하는 ‘가차 없이’ 뒤에 배치했습니다.
