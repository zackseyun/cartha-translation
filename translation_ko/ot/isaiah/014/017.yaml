id: ISA.14.17
reference: Isaiah 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂ֥ם תֵּבֵ֛ל כַּ/מִּדְבָּ֖ר וְ/עָרָ֣י/ו הָרָ֑ס אֲסִירָ֖י/ו לֹא פָ֥תַח בָּֽיְתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/017.yaml
  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
  footnotes:
  - marker: a
    text: Or 'who did not send his prisoners home' or 'who did not open the way home for his prisoners.' The Hebrew reads literally 'did not open the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 세상을 광야처럼 만들고 그 성읍들을 무너뜨렸으며, 자기 포로들을 위해 집의 문을 열지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 포로들에게 집으로 가는 길을 열지 않았다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘집을 열지 않았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם תֵּבֵל כַּמִּדְבָּר
  english_pob_choice: who made the world like a wilderness
  chosen_korean: 세상을 광야처럼 만들고
  alternatives_korean:
  - 세상을 황무지처럼 만들고
  - 세상을 사막처럼 만들고
  lexicon: HALOT
  rationale: תֵּבֵל은 ‘세상/세계’로 옮기는 것이 자연스럽고, כַּמִּדְבָּר의 비교는 ‘광야처럼’이 가장 직접적으로 드러냅니다.
- source_word: וְעָרָיו הָרָס
  english_pob_choice: and tore down its cities
  chosen_korean: 그 성읍들을 무너뜨렸으며
  alternatives_korean:
  - 그 도시들을 헐어 버렸으며
  - 그 성읍들을 파괴했으며
  lexicon: HALOT
  rationale: ‘무너뜨리다’는 도시를 허물어뜨리는 물리적 파괴를 살리면서도 한국어 성경 문맥에 잘 맞습니다.
- source_word: אֲסִירָיו
  english_pob_choice: his prisoners
  chosen_korean: 자기 포로들을
  alternatives_korean:
  - 그의 포로들을
  - 자신의 갇힌 자들을
  lexicon: HALOT
  rationale: 문맥상 정복자에게 속한 포로들을 가리키므로 ‘자기 포로들’이 관계를 분명히 드러냅니다.
- source_word: לֹא פָתַח בָּיְתָה
  english_pob_choice: did not open the house for his prisoners
  chosen_korean: 집의 문을 열지 않았습니다
  alternatives_korean:
  - 집을 열지 않았습니다
  - 그들을 집으로 보내지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘집을 열지 않았다’이지만, 한국어에서는 ‘집의 문을 열지 않았다’가 그 이미지를 보존하면서도 의미를 더 분명하게 전달합니다.
