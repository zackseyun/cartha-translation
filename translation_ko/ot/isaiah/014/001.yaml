id: ISA.14.1
reference: Isaiah 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
  footnotes:
  - marker: a
    text: Or 'the sojourner' or 'the resident alien.' The Hebrew גֵּר often refers to a non-native living among Israel, not merely a passing outsider.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be joined to the house of Jacob.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 야곱을 긍휼히 여기시고, 다시 이스라엘을 택하실 것이며, 그들을 그들의 땅에 정착하게 하실 것입니다. 거류민[a]이 그들에게 합류하고, 그들은 야곱의 집에 더해질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인’ 또는 ‘나그네’입니다. 히브리어 גֵּר는 단지 지나가는 외부인보다 이스라엘 가운데 사는 비토착 거주민을 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야곱의 집에 붙을 것입니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְרַחֵם
  english_pob_choice: will have compassion
  chosen_korean: 불쌍히 여기시고
  alternatives_korean:
  - 긍휼을 베푸시고
  - 자비를 베푸시고
  lexicon: HALOT
  rationale: רחם의 자비롭고 애틋한 긍휼을 자연스러운 현대 한국어로 옮기되, 단순한 법정적 자비보다 정서적 연민을 살렸습니다.
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  english_pob_choice: will again choose Israel
  chosen_korean: 다시 이스라엘을 택하시며
  alternatives_korean:
  - 이스라엘을 다시 택하시며
  - 한 번 더 이스라엘을 택하시며
  lexicon: HALOT
  rationale: עֽוֹד의 ‘다시/재차’ 의미를 살려 회복의 재선택을 드러냈습니다.
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  english_pob_choice: he will settle them on their own land
  chosen_korean: 그들을 그들의 땅에 자리 잡게 하실 것입니다
  alternatives_korean:
  - 그들을 그들의 땅에 쉬게 하실 것입니다
  - 그들을 그들의 땅에 정착시키실 것입니다
  lexicon: HALOT
  rationale: נוח/ניח 계열의 ‘쉬게 하다/안착시키다’ 의미를 포착하면서, 귀환·회복 문맥에 맞는 ‘자리 잡게 하다’를 택했습니다.
- source_word: הַגֵּר
  english_pob_choice: the foreigner
  chosen_korean: 이방 사람
  alternatives_korean:
  - 거류민
  - 나그네
  lexicon: HALOT
  rationale: גֵּר의 기술적 뉘앙스는 있지만, 본문 흐름에서는 외부인이 이스라엘에 합류하는 장면이므로 읽기 쉬운 ‘이방 사람’을 택하고, 대안은 각주로 남겼습니다.
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  english_pob_choice: they will attach themselves to the house of Jacob
  chosen_korean: 그들은 야곱의 집에 붙을 것입니다
  alternatives_korean:
  - 그들은 야곱의 집에 연합할 것입니다
  - 그들은 야곱의 집에 더해질 것입니다
  lexicon: HALOT
  rationale: ספח의 결합/부착 의미를 직역에 가깝게 살리되, 현대 한국어에서 자연스러운 ‘붙다’를 사용했습니다.
theological_decisions:
- issue: 야훼의 ‘다시 택하심’의 의미
  chosen_reading: 심판 이후의 회복과 언약적 재선택으로 옮겼습니다.
  alternative_readings:
  - 단순한 민족적 선호
  - 정치적 재건만을 뜻하는 표현
  rationale: בחר는 이 문맥에서 회복을 향한 신적 선택을 가리키므로, 그 신학적 긴장을 유지하면서도 과도하게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
