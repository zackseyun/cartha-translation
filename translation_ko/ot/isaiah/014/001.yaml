revisions:
- from: 야훼께서는 야곱을 불쌍히 여기시고 다시 이스라엘을 택하시며[a], 그들을 그들의 땅에 자리 잡게 하실 것입니다. 이방 사람은 그들과 연합하고[b], 그들은 야곱의 집에 붙을 것입니다.
  to: 야훼께서는 야곱을 긍휼히 여기시고, 다시 이스라엘을 택하실 것이며, 그들을 그들의 땅에 정착하게 하실 것입니다. 거류민[a]이 그들에게 합류하고, 그들은 야곱의 집에 더해질 것입니다[b].
  rationale: 원문의 회복 약속, 야곱과 이스라엘의 병행, 거류민의 합류와 야곱의 집에 대한 편입이라는 흐름을 유지했습니다. הַגֵּר의 의미를 더 정확히 반영하고, נִסְפְּחוּ를 자연스러운 한국어로 다듬었으며, 각주 표지를 실제 설명 대상에 맞게 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:26Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 동사들의 의미와 순서는 대체로 충실합니다. 그러나 הַגֵּר는 단순히 ‘이방 사람’이라기보다 공동체 안에 거주하는 비이스라엘인을 가리킬 수 있으므로 ‘거류민’이 더 정확합니다. 또한 וְנִסְפְּחוּ는 ‘붙다’보다 수동·결합의 뉘앙스를 자연스럽게 드러내는 ‘더해지다’로 옮기는 것이 적절합니다.
  naturalness: ‘야곱의 집에 붙을 것입니다’는 직역투로 다소 어색합니다. ‘야곱의 집에 더해질 것입니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 원문의 결합 의미도 잘 전달합니다.
  terminology: ‘야훼’, ‘야곱’, ‘이스라엘’, ‘택하시다’는 일관되고 적절합니다. רחם은 이 문맥에서 ‘긍휼히 여기시다’가 존엄한 성경 문체를 유지하면서도 자연스럽습니다. 각주 a는 הַגֵּר에, 각주 b는 마지막 결합 표현에 붙어야 하므로 기존 표지 위치를 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: 각주 a와 b의 표지 위치가 해당 어휘·표현과 일치하지 않습니다.
    rationale: 각주 a는 הַגֵּר의 어휘적 대안을 설명하지만 현재 ‘이스라엘’ 뒤에 붙어 있습니다. 각주 b는 ‘야곱의 집에 붙다’의 대안을 제시하지만 현재 앞 절의 ‘연합하고’에 붙어 있습니다. 독자가 각주의 적용 대상을 오해하지 않도록 각각 ‘거류민’과 마지막 절에 배치해야 합니다.
  - severity: low
    issue: ‘이방 사람’은 הַגֵּר의 거주민 뉘앙스를 충분히 드러내지 못합니다.
    rationale: הַגֵּר는 일반적 외부인이나 일시적 여행자만이 아니라 이스라엘 가운데 거주하는 비토착인을 가리키는 경우가 많습니다. 본문에는 ‘거류민’을 쓰고 각주에서 대안을 제시하는 편이 안전합니다.
  - severity: low
    issue: ‘야곱의 집에 붙을 것입니다’는 현대 한국어에서 다소 직역적입니다.
    rationale: נִסְפְּחוּ의 결합·편입 의미는 ‘야곱의 집에 더해질 것입니다’로 자연스럽게 옮길 수 있으며, 원문의 집단적 결속 의미를 보존합니다.
