  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
  footnotes:
  - marker: a
    text: Or, 'I will be like the Most High.' The Hebrew verb can be rendered more simply, but 'make myself like' brings out the reflexive nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 구름의 높은 곳들 위로 올라가, 지극히 높으신 분과 같아지겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 지극히 높으신 분과 같겠습니다.’ 히브리어 동사는 더 단순하게도 옮길 수 있지만, ‘같아지겠습니다’는 자신을 그분과 같게 하려는 반사적 뉘앙스를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱלֶה
  english_pob_choice: I will ascend
  chosen_korean: 올라가겠습니다
  alternatives_korean:
  - 상승하겠습니다
  - 올라가 보겠습니다
  lexicon: WLC/HALOT
  rationale: עלה의 상향 이동과 교만한 상승 의도를 살려, 평이한 ‘가다’보다 ‘올라가다’가 더 직접적으로 대응합니다.
- source_word: בָּמֳתֵי עָב
  english_pob_choice: the heights of the clouds
  chosen_korean: 구름의 높이들
  alternatives_korean:
  - 구름의 높은 곳
  - 구름 꼭대기
  lexicon: WLC/HALOT
  rationale: בָּמָה의 ‘높은 곳/높이’와 עָב의 ‘구름’ 이미지를 그대로 살려, 하늘로 치솟으려는 과장의 비유를 유지했습니다.
- source_word: אֶדַּמֶּה
  english_pob_choice: I will make myself like
  chosen_korean: 나 자신을 만들겠습니다
  alternatives_korean:
  - 제가 되겠습니다
  - 저를 닮게 하겠습니다
  lexicon: WLC/HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 반영해 단순한 ‘~같다’보다 ‘나 자신을 만들다’로 옮겨, 자발적 자기-동일시의 뉘앙스를 살렸습니다.
- source_word: לְעֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: WLC/HALOT
  rationale: עֶלְיוֹן을 하나님의 표제로 읽어, 한국어에서 자연스러운 존칭적 신칭으로 옮기되 문맥의 신적 지위를 분명히 했습니다.
theological_decisions:
- issue: ‘지극히 높으신 분’의 신적 표제성
  chosen_reading: 이 표현은 단순한 비교급이 아니라 하나님을 가리키는 표제로 읽었습니다.
  alternative_readings:
  - ‘가장 높으신 분’처럼 형용사적 비교로만 읽는 해석
  rationale: 문맥상 화자는 자신을 신적 영역으로 끌어올리려 하므로, 표제성을 유지해야 교만의 신학적 급진성이 보존됩니다.
  doctrine_reference: Isaiah 14의 교만과 신적 자칭의 비판
