  lexicon: HALOT
  rationale: 문맥상 단순한 생각이 아니라 확정된 의도와 결정을 가리키므로, ‘뜻을 정하다’가 주동적이고 선언적인 힘을 잘 드러냅니다.
- source_word: יָפֵר
  english_pob_choice: can annul it
  chosen_korean: 무너뜨리겠습니까
  alternatives_korean:
