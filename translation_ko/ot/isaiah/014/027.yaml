id: ISA.14.27
reference: Isaiah 14:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יְהוָ֧ה צְבָא֛וֹת יָעָ֖ץ וּ/מִ֣י יָפֵ֑ר וְ/יָד֥/וֹ הַ/נְּטוּיָ֖ה וּֽ/מִ֥י יְשִׁיבֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
  footnotes:
  - marker: a
    text: Or 'who can thwart it?' The Hebrew verb can mean to break, nullify, or frustrate a plan.
    reason: lexical_alternative
  - marker: b
    text: Or 'His hand is outstretched.' The image commonly conveys active power, often in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 뜻을 정하셨으니, 누가 그것을 무너뜨리겠습니까? 그의 손이 뻗어 있으니, 누가 그것을 되돌리겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너뜨리겠습니까’는 히브리어 동사의 뜻인 부수다, 무효화하다, 좌절시키다를 한 표현으로 묶은 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뻗어 있으니’는 ‘그의 손이 뻗어 있습니다’라는 이미지를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: 직접적으로 야훼의 이름을 드러내되, צְבָאוֹת는 여기서 소유격적 수식으로 자연스럽게 ‘야훼께서’로 묶어 한국어 문장 흐름을 살렸습니다.
- source_word: יָעָץ
  english_pob_choice: has purposed
  chosen_korean: 뜻을 정하셨으니
  alternatives_korean:
  - 계획하셨으니
  - 목적하셨으니
  - 작정하셨으니
  lexicon: HALOT
  rationale: 문맥상 단순한 생각이 아니라 확정된 의도와 결정을 가리키므로, ‘뜻을 정하다’가 주동적이고 선언적인 힘을 잘 드러냅니다.
- source_word: יָפֵר
  english_pob_choice: can annul it
  chosen_korean: 무너뜨리겠습니까
  alternatives_korean:
  - 무효로 하겠습니까
  - 깨뜨리겠습니까
  - 좌절시키겠습니까
  lexicon: HALOT
  rationale: 히필형 פרר의 핵심은 계획이나 결정을 깨고 무효화하는 것이어서, 한국어에서는 ‘그것을 무너뜨리다’가 대상인 계획을 힘으로 뒤집는 뉘앙스를 잘 전달합니다.
- source_word: הַנְּטוּיָה
  english_pob_choice: His hand is stretched out
  chosen_korean: 그의 손이 뻗어 있으니
  alternatives_korean:
  - 그의 손이 펴져 있으니
  - 그의 손이 뻗어 있습니다
  - 그의 손이 펼쳐져 있으니
  lexicon: HALOT
  rationale: ‘stretched out’의 이미지와 활동성을 살리면서, 한국어에서 더 자연스러운 현재 진행/상태 표현으로 ‘뻗어 있으니’를 택했습니다.
- source_word: יְשִׁיבֶנָּה
  english_pob_choice: can turn it back
  chosen_korean: 되돌리겠습니까
  alternatives_korean:
  - 돌이키겠습니까
  - 거두어들이겠습니까
  - 되돌릴 수 있겠습니까
  lexicon: HALOT
  rationale: 뒤이어지는 도전문에서 주어가 누구인지 분명하므로, 손을 ‘되돌리다’는 표현이 원문의 역행·철회 의미를 가장 간결하게 전달합니다.
theological_decisions:
- issue: 야훼의 목적을 사람의 능력으로 무력화할 수 없다는 수사적 질문의 강도
  chosen_reading: 두 개의 반문을 그대로 살려, 하나님의 뜻과 행위가 인간에 의해 좌절될 수 없다는 절대성을 드러냈습니다.
  alternative_readings:
  - 부드럽게 서술형으로 옮겨 ‘아무도 그것을 막을 수 없습니다’로 완화하는 방식
  - 첫 반문과 둘째 반문의 병렬을 약화시키는 방식
  rationale: 본문은 선언과 반문을 통해 야훼의 주권적 결정을 강조하므로, 한국어에서도 질문형을 유지해야 수사적 압력이 보존됩니다.
  doctrine_reference: 하나님의 주권과 불가항력성
