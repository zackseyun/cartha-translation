  naturalness: ‘하늘들’과 ‘하나님 별들’은 현대 한국어 문장 안에서 어색합니다. ‘하늘에’, ‘하나님의 별들’로 고치면 원문의 이미지를 보존하면서도 자연스럽습니다. 각 장소구를 쉼표로 나열하기보다 ‘집회의 산, 곧 북쪽의 가장 먼 곳에’로 연결하면 산의 위치를 나타내는 히브리어 구조가 분명해집니다.
