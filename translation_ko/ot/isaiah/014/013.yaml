id: ISA.14.13
reference: Isaiah 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
  footnotes:
  - marker: a
    text: Or possibly, “on the heights of Zaphon,” if צָפוֹן alludes to the cosmic mountain known in ancient Near Eastern tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 당신은 마음속으로 말했습니다. ‘나는 하늘에 올라가고, 나의 왕좌를 하나님의 별들 위로 높이 세우겠으며, 집회의 산, 곧 북쪽의 가장 먼 곳에 앉겠다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 고대 근동 전승의 우주 산을 가리키는 암시일 경우, “자폰의 높은 곳”으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִלְבָבְךָ
  english_pob_choice: in your heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음에
  - 속으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 내면의 자기말이라는 뜻을 분명하게 살렸습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 천상
  lexicon: HALOT
  rationale: 복수형 뉘앙스를 살려 단수화하지 않았고, 지나치게 문어적인 ‘천상’보다 원문의 높임과 다층적 이미지를 더 직접적으로 드러냈습니다.
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  english_pob_choice: above the stars of God
  chosen_korean: 하나님 별들보다 높이
  alternatives_korean:
  - 하나님의 별들보다 높이
  - 하늘 별들보다 높이
  lexicon: HALOT
  rationale: 원문의 ‘~보다 위에’라는 비교 관계를 한국어에서 더 분명하게 드러내기 위해 ‘보다 높이’로 옮겼고, ‘별들 of God’의 직역성을 유지했습니다.
- source_word: בְּהַר מוֹעֵד
  english_pob_choice: on the mount of assembly
  chosen_korean: 회중의 산
  alternatives_korean:
  - 집회의 산
  - 모임의 산
  lexicon: HALOT
  rationale: 무속적·신화적 어감을 과도하게 덧붙이지 않으면서도, מוֹעֵד의 ‘모임/집회’ 의미를 간결하게 살린 표현입니다.
- source_word: בְּיַרְכְּתֵי צָפוֹן
  english_pob_choice: in the far reaches of the north
  chosen_korean: 북쪽의 먼 끝자락
  alternatives_korean:
  - 북쪽의 가장자리
  - 북쪽의 깊은 곳
  lexicon: HALOT
  rationale: יַרְכְּתֵי의 ‘가장자리/끝/변두리’ 느낌을 살려 지리적·시적 이미지가 드러나도록 했습니다.
theological_decisions:
- issue: צָפוֹן의 가능성 있는 지명/신화적 암시
  chosen_reading: 본문에는 ‘북쪽’으로 유지하되, 시적 긴장으로 남겨 둡니다.
  alternative_readings:
  - 고유명사 ‘자폰’으로 옮기기
  - ‘자폰의 높은 곳’으로 해석하기
  rationale: 문자적 의미인 ‘북쪽’이 즉시 이해되며, 고대 근동의 코스믹 산 암시는 본문에서 단정하지 않고 여백으로 남기는 편이 원문 긴장에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘별들 of God’의 실체 규정
  chosen_reading: 천체인지, 하늘 존재인지 본문에서 규정하지 않고 ‘하나님 별들’로 유지합니다.
  alternative_readings:
  - 천사들
  - 하늘의 별들
  rationale: 히브리어의 모호성을 해소하지 않고 그대로 드러내어, 원문의 장엄한 자기고양 발언을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
