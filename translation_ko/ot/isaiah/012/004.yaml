id: ISA.12.4
reference: Isaiah 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
  footnotes:
  - marker: a
    text: Or, 'proclaim, for his name is exalted.' The Hebrew conjunction can be read causally ('for') rather than as introducing the content of the proclamation ('that').
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively, 'Yahweh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 여러분은 이렇게 말할 것입니다. “야훼[b]께 감사하십시오. 그의 이름을 부르십시오. 그가 하신 일들을 민족들 가운데 알리십시오. 그의 이름이 높다고 선포하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 이름이 높으니 선포하십시오.’ 히브리어 접속사 כִּי는 여기서 선포의 내용이 아니라 이유를 나타내는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 신명사 יהוה는 야훼를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: And you will say
  chosen_korean: 이렇게 말해야 합니다
  alternatives_korean:
  - 그렇게 말할 것입니다
  - 그리고 말할 것입니다
  lexicon: HALOT
  rationale: 예언적 문맥의 2인칭 복수 미완료·서술적 흐름을 한국어에서 자연스러운 의무/진술형으로 살리되, 앞절과 이어지는 말하기 명령의 성격을 유지했습니다.
- source_word: לַֽיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사인 יהוה는 이 프로젝트의 기본값에 따라 야훼로 옮겼습니다. 본문 의미를 직접 드러내면서도 관행적 주님으로 완화하지 않았습니다.
- source_word: הוֹדוּ ... הוֹדִיעוּ ... הַזְכִּירוּ
  english_pob_choice: Give thanks ... Make known ... proclaim
  chosen_korean: 감사하십시오 ... 알리십시오 ... 선포하십시오
  alternatives_korean:
  - 찬양하십시오 ... 알리십시오 ... 언급하십시오
  - 감사하십시오 ... 드러내십시오 ... 기억하게 하십시오
  lexicon: HALOT
  rationale: 세 개의 명령형이 병렬을 이루므로 한국어도 세 동사를 기능적으로 대응시켰습니다. הוֹדוּ는 예배적 감사, הוֹדִיעוּ는 공개적 알림, הַזְכִּירוּ는 공적 선언의 힘을 살려 각각 감사하십시오/알리십시오/선포하십시오로 구분했습니다.
- source_word: כִּי נִשְׂגָּב שְׁמוֹ
  english_pob_choice: that his name is exalted
  chosen_korean: 그의 이름이 높으시다고
  alternatives_korean:
  - 그의 이름이 높다고
  - 그의 이름이 높이 들렸다고
  - 그의 이름이 높으니
  lexicon: HALOT
  rationale: נִשְׂגָּב의 ‘높다/숭고하다/존귀하다’라는 뜻을 반영하되, 한국어에서 하나님 이름에 대한 경외를 드러내는 표현으로 높으시다를 택했습니다. כִּי는 앞선 선포의 내용으로 자연스럽게 이어지게 했습니다.
theological_decisions:
- issue: 야훼의 직접 표기와 교회적 완곡어법
  chosen_reading: 본문의 יהוה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 언약명 자체를 드러내는 것이 원문의 신학적 강도를 가장 잘 보존합니다. 전통적 관용어인 주님은 의미를 가릴 수 있어 본문 직접성에 맞지 않습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: כִּי의 처리
  chosen_reading: ‘그의 이름이 높으시다고’로 내용절을 살렸습니다.
  alternative_readings:
  - ‘그의 이름이 높으니’라는 이유절
  - ‘그의 이름이 높으므로’라는 이유절
  rationale: 명령 뒤의 כִּי는 내용절과 이유절이 모두 가능하므로, 본문과의 직결성을 살리는 내용절을 본문에 두고 해석 여지는 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
