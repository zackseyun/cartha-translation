revisions:
- from: 그 날에 이렇게 말해야 합니다. “야훼께 감사하십시오. 그의 이름을 부르십시오. 그의 행적을 민족들 가운데 알리십시오. 그의 이름이 높으시다고 선포하십시오.”[a][b]
  to: 그날에 여러분은 이렇게 말할 것입니다. “야훼[b]께 감사하십시오. 그의 이름을 부르십시오. 그가 하신 일들을 민족들 가운데 알리십시오. 그의 이름이 높다고 선포하십시오.”[a]
  rationale: 예언적 미래 표현을 ‘말할 것입니다’로 바로잡고, 이름을 주어로 하는 마지막 절에서 부적절한 높임법을 제거했습니다. ‘행적’을 ‘그가 하신 일들’로 바꾸어 עֲלִילוֹתָיו의 실제 행위라는 뜻을 자연스럽게 드러냈으며, 각주 표지를 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:10Z'
