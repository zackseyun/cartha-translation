  source_fidelity: 첫 동사 וַאֲמַרְתֶּם은 예언적 순차 흐름에서 ‘말할 것입니다’라는 미래 진술이지 ‘말해야 합니다’라는 의무 명령이 아닙니다. 또한 נִשְׂגָּב שְׁמוֹ는 그의 이름이 높고 exalted하다는 진술이며, 이름에 높임 선어말을 붙인 ‘높으시다’는 한국어 문법과 원문의 표현 모두에 맞지 않습니다.
  naturalness: ‘그날’과 ‘그가 하신 일들’을 사용하면 현대 표준어 합쇼체에서 더 자연스럽습니다. 명령형들의 병렬도 유지됩니다.
