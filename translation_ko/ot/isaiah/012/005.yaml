id: ISA.12.5
reference: Isaiah 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
  footnotes:
  - marker: a
    text: Or, 'for he has acted majestically' or 'for he has done excellent things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 찬양하십시오[a]. 그는 영화로운 일들을 행하셨습니다. 이 일이 온 땅에 알려지게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 יְהוָה를 따라 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: זַמְּרוּ
  english_pob_choice: Sing praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 노래하십시오
  - 찬양의 노래를 부르십시오
  - 노래하며 찬양하십시오
  lexicon: HALOT
  rationale: פּיעל 명령형 복수는 단순한 노래가 아니라 하나님께 드리는 음악적 찬양을 가리키므로, 합쇼체에서 자연스럽고 포괄적인 ‘찬양하십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기 이름 יְהוָה를 POB 기준에 따라 고유명사 ‘야훼’로 옮겨, 호칭이 아닌 언약적 고유성을 보존했습니다.
- source_word: גֵאוּת עָשָׂה
  english_pob_choice: he has done gloriously / he has done glorious things
  chosen_korean: 영화로운 일들을 행하셨습니다
  alternatives_korean:
  - 위대한 일을 행하셨습니다
  - 장엄한 일을 행하셨습니다
  - 영광스럽게 행하셨습니다
  lexicon: HALOT
  rationale: גֵאוּת는 ‘위엄, 영화, 탁월함’의 추상 명사이지만 עשה와 결합할 때 한국어에서는 ‘영화로운 일들’처럼 결과물을 드러내는 표현이 가장 자연스럽고, 영어 POB가 보존한 의미 긴장도 유지합니다.
- source_word: מידעת זֹאת
  english_pob_choice: let this be made known
  chosen_korean: 이 일이 알려지게 하십시오
  alternatives_korean:
  - 이것을 알리게 하십시오
  - 이 일이 알려지게 하소서
  - 이 일이 알려져야 합니다
  lexicon: HALOT
  rationale: 문맥상 선포를 촉구하는 jussive/수동적 뉘앙스를 살려, 직역적 명령 ‘알리십시오’보다 ‘알려지게 하십시오’가 원문의 수동적 확산을 더 잘 반영합니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 세상에
  - 전 세계에
  - 온 땅 가운데
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 지역적 ‘땅’보다 보편적 범위를 가리키므로, 시적이면서도 자연스러운 ‘온 땅에’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역어와 예배적 호칭의 구분
  chosen_reading: 본문에는 고유명사 ‘야훼’를 유지하고, 뒤따르는 찬양 명령은 하나님께 드리는 직접 호명 없이 독립적으로 처리했습니다.
  alternative_readings:
  - 주님을 찬양하십시오
  - 야훼를 찬송하십시오
  rationale: 신명기 이름을 호칭성 직함으로 치환하지 않음으로써, 본문이 드러내는 언약적 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
