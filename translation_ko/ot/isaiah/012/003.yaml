translation:
  language: ko
  text: 너희는 기쁨으로 구원의 샘들에서 물을 길 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘샘들’은 ‘우물들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원’은 이 문맥에서 ‘구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  english_pob_choice: you will draw
  chosen_korean: 너희는 물을 길을 것입니다
  alternatives_korean:
  - 너희는 물을 퍼낼 것입니다
  - 너희는 물을 긷게 될 것입니다
  lexicon: HALOT
  rationale: 2인칭 복수 완료형의 예언적 용법을 자연스러운 미래로 옮겼고, 샘에서 물을 '긷다/길다'는 한국어 관용을 살렸습니다.
- source_word: בְּ/שָׂשׂוֹן
  english_pob_choice: with joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 기쁨과 함께
  - 기쁘게
  lexicon: HALOT
  rationale: 전치사 בְּ + 명사를 부사적으로 처리해, 원문의 명사구성을 유지하면서도 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: מִ/מַּעַיְנֵי
  english_pob_choice: from the springs
  chosen_korean: 샘들에서
  alternatives_korean:
  - 샘에서
  - 우물들에서
  - 샘물에서
  lexicon: HALOT
  rationale: מַעְיָן의 기본 의미는 자연적 물원인 '샘'이므로, 영어 POB의 'springs'에 맞춰 복수성을 살렸습니다.
- source_word: הַ/יְשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 해방
  lexicon: HALOT
  rationale: 이사야 12장의 찬양 맥락에서는 단순한 일시적 구조보다 야훼의 구원 행위를 포괄하는 '구원'이 원문의 신학적 깊이를 더 잘 보존합니다.
theological_decisions:
- issue: יְשׁוּעָה를 '구원'으로 넓게 옮길지, '구출/해방'처럼 상황적 의미로 좁힐지
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 해방
  rationale: 본문은 역사적 건짐을 말하면서도 이사야 전체의 구원 신학을 향하므로, 의미를 좁히지 않고 '구원'으로 유지하는 것이 원문의 긴장과 울림을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
