review_pass:
  verdict: revise
  source_fidelity: 히브리어의 예언적 미래 의미, 기쁨의 양태, 그리고 ‘구원의 샘들’이라는 구성 관계를 전반적으로 충실히 옮겼습니다. 다만 본문의 동사에 명백한 오기가 있어 수정이 필요합니다.
  naturalness: ‘기쁨으로 너희는’도 가능하지만, 현대 한국어 합쇼체에서는 주어를 앞에 두어 ‘너희는 기쁨으로’라고 하는 편이 더 자연스럽습니다. ‘물을 길을 것입니다’는 조사 ‘을’이 중복된 비문입니다.
  terminology: ‘구원’은 יְשׁוּעָה의 폭넓은 의미와 이사야 12장의 문맥을 적절히 보존합니다. ‘샘들’도 מַעְיָנֵי의 복수형과 자연적 물 근원이라는 뜻에 알맞습니다. 각주 a의 ‘샘물’은 물 자체를 가리키므로 물이 나는 근원을 뜻하는 본문 단어의 적절한 대안이 아니며, 각주 b의 ‘해방’은 문맥상 지나치게 구체적입니다.
  issues:
  - severity: high
    issue: 본문의 ‘물을 길을 것입니다’는 문법 오류입니다.
    rationale: 동사 ‘긷다’의 미래 관형/서술 형태가 잘못 표기되었습니다. ‘물을 길 것입니다’로 고쳐야 합니다.
  - severity: low
    issue: 각주 a의 ‘샘물’은 어휘 대안으로 부정확합니다.
    rationale: מַעְיָן은 물 자체가 아니라 샘·물 근원입니다. ‘샘물’은 일반적으로 그곳에서 나오는 물을 뜻합니다.
  - severity: low
    issue: 각주 b의 ‘해방’은 원문의 어휘 범위를 불필요하게 좁힙니다.
    rationale: יְשׁוּעָה의 문맥상 가능한 대안은 포괄적인 ‘구출’이며, ‘해방’은 특정한 사회·정치적 상황을 더 강하게 시사합니다.
  revised_text: 너희는 기쁨으로 구원의 샘들에서 물을 길 것입니다.[a][b]
