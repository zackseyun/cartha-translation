  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
  footnotes:
  - marker: a
    text: Or, “I will thank you, O LORD,” since the Hebrew verb can mean either giving thanks or praising in worship.
    reason: lexical_alternative
  - marker: b
    text: Literally, “your anger turned back.” Hebrew 'nose' or 'anger' is an idiom for wrath.
    reason: lexical_alternative
translation:
  language: ko
  text: “그 날에 너는 이렇게 말할 것입니다. ‘야훼여, 제가 주님을 찬양합니다. 주님께서 제게 진노하셨지만, 주님의 진노는 물러갔고 주님께서 저를 위로하셨기 때문입니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 אוֹדְךָ는 ‘찬양하다’와 ‘감사하다’ 둘 다 가능하므로, 문맥상 예배적 찬양의 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 직역은 “주님의 진노가 돌아섰다”에 가깝지만, 한국어에서는 관용적으로 “진노가 물러가다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: And you will say
  chosen_korean: 너는 이렇게 말할 것입니다
  alternatives_korean:
  - 그리고 너는 말할 것입니다
  - 너는 말하게 될 것입니다
  lexicon: WLC; HALOT
  rationale: 예언적 화법의 미래 지시를 자연스러운 한국어로 옮기되, 인용문 도입을 분명하게 하려고 ‘이렇게 말할 것입니다’로 풀었습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 때에
  lexicon: WLC; HALOT
  rationale: 히브리어의 예언적 시간 표현을 한국어의 관용적 표현인 ‘그 날에’로 간결하게 살렸습니다.
- source_word: אוֹדְךָ
  english_pob_choice: I will praise you
  chosen_korean: 제가 주님을 찬양합니다
  alternatives_korean:
  - 제가 주님께 감사드립니다
  - 제가 주님께 감사하고 찬양합니다
  lexicon: HALOT
  rationale: ידה의 문맥상 예배적 찬양의 뉘앙스가 강하므로 ‘찬양합니다’로 옮겼고, 한국어에서는 대상 표지를 자연스럽게 처리하기 위해 목적격을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 프로젝트의 기본 원칙에 따라 신적 고유명은 대체 호칭이 아니라 학술 전사인 ‘야훼’로 유지했습니다.
- source_word: אָנַפְתָּ בִּי
  english_pob_choice: you were angry with me
  chosen_korean: 주님께서 제게 진노하셨지만
  alternatives_korean:
  - 주님께서 제게 화를 내셨지만
  - 주님께서 제게 노하셨지만
  lexicon: HALOT
  rationale: אָנף의 기본 의미는 분노/진노이므로 ‘진노하셨지만’으로 옮겨 분노의 무게를 살렸습니다.
- source_word: יָשֹׁב אַפְּךָ
  english_pob_choice: your anger has turned away
  chosen_korean: 주님의 진노는 물러갔고
  alternatives_korean:
  - 주님의 분노는 돌아섰고
  - 주님의 노여움은 물러났고
  lexicon: HALOT
  rationale: ‘얼굴/코’로 된 히브리어 관용구를 한국어에서 자연스럽게 풀어 ‘진노가 물러가다’로 표현했습니다.
- source_word: וּתְנַחֲמֵנִי
  english_pob_choice: and you comfort me
  chosen_korean: 주님께서 저를 위로하셨기 때문입니다
  alternatives_korean:
  - 주님께서 저를 위로해 주셨기 때문입니다
  - 주님께서 저를 위안하셨기 때문입니다
  lexicon: HALOT
  rationale: נחם의 기본 의미를 ‘위로하다’로 옮겨 병행 구문을 한국어에서도 분명히 했습니다.
theological_decisions:
- issue: 예언적 감정의 진술을 한국어 인용문에서 어떤 시제로 보일지
  chosen_reading: 과거 진노와 현재적 결과를 함께 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘주님께서 제게 진노하셨고… 위로하셨습니다’
  - ‘주님께서 제게 진노하셨지만… 위로하십니다’
  rationale: 히브리어는 예언적 회상/선언의 흐름 속에서 진노의 해소와 위로의 결과를 함께 말하므로, 한국어도 단순 과거로만 고정하지 않고 결과 완료감을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without paraphrase'
