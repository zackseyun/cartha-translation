id: ISA.12.1
reference: Isaiah 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
  footnotes:
  - marker: a
    text: Or, “I will thank you, O LORD,” since the Hebrew verb can mean either giving thanks or praising in worship.
    reason: lexical_alternative
  - marker: b
    text: Literally, “your anger turned back.” Hebrew 'nose' or 'anger' is an idiom for wrath.
    reason: lexical_alternative
translation:
  language: ko
  text: “그날에 너는 이렇게 말할 것입니다. ‘야훼여, 야훼께서 제게 진노하셨으나 그 진노가 물러가고[a] 저를 위로하실 것이므로, 제가 야훼를 찬양하겠습니다.[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신의 진노가 돌아선다”입니다. 히브리어 אַף는 본래 ‘코’를 뜻하지만, 여기서는 진노를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 אוֹדְךָ는 ‘찬양하다’ 또는 ‘감사하다’를 뜻할 수 있습니다. 여기서는 구원 뒤의 예배적 찬양이라는 문맥에 따라 ‘찬양하겠습니다’로 옮겼습니다.
    reason: lexical_alternative
