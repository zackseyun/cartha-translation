  chosen_reading: 과거 진노와 현재적 결과를 함께 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘주님께서 제게 진노하셨고… 위로하셨습니다’
  - ‘주님께서 제게 진노하셨지만… 위로하십니다’
  rationale: 히브리어는 예언적 회상/선언의 흐름 속에서 진노의 해소와 위로의 결과를 함께 말하므로, 한국어도 단순 과거로만 고정하지 않고 결과 완료감을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without paraphrase'
