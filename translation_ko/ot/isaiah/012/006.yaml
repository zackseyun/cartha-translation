source:
  edition: WLC
  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'Shout and sing for joy.' The second imperative can carry the sense of jubilant singing as well as joyful shouting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'inhabitant of Zion,' feminine singular, personifying Zion as a woman addressed directly.
    reason: cultural_note
translation:
  language: ko
  text: 시온의 주민아, 소리 높여 기뻐 외치십시오. 야훼께서 당신의 한가운데에 크시기 때문입니다. 이스라엘의 거룩하신 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 두 번째 명령형은 기쁨의 노래까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여성 단수로 된 ‘시온의 주민’을 사용하여 시온을 여성으로 의인화해 직접 부릅니다.
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  english_pob_choice: Cry aloud
  chosen_korean: 소리 높여 기뻐 외치십시오
  alternatives_korean:
  - 소리쳐 기뻐하십시오
  - 환성하십시오
  lexicon: HALOT
  rationale: צהל의 핵심은 단순한 소리침보다 기쁨이 섞인 큰 외침이므로, 한국어에서도 음성의 강도와 기쁨을 함께 드러내도록 옮겼습니다.
- source_word: וָרֹנִּי
  english_pob_choice: and shout for joy
  chosen_korean: 기뻐 외치십시오
  alternatives_korean:
  - 노래하십시오
  - 환호하십시오
  lexicon: HALOT
  rationale: רנן은 기쁨의 외침과 노래의 뉘앙스를 함께 가지지만, 여기서는 앞 절과 병렬을 이루는 환희의 외침으로 보는 것이 가장 자연스럽습니다.
- source_word: יוֹשֶׁבֶת צִיּוֹן
  english_pob_choice: inhabitant of Zion
  chosen_korean: 시온의 주민아
  alternatives_korean:
  - 시온에 사는 이여
  - 시온의 거주자여
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 분사로 시온을 의인화한 직접 호칭이므로, 한국어에서도 단수 호격을 유지해 시적 인격화 효과를 살렸습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩하신 이
  - 이스라엘의 거룩한 분
  lexicon: HALOT
  rationale: 이사야서의 고정된 신적 칭호를 한국어에서 너무 낯설지 않게 유지하면서도, ‘거룩하신 분’으로 인격적 호칭을 살렸습니다.
theological_decisions:
- issue: 시온의 여성 단수 의인화 유지
  chosen_reading: ‘시온의 주민아’와 ‘당신의 한가운데에’로 단수 직접 호칭을 유지했습니다.
  alternative_readings:
  - ‘시온의 백성들’처럼 집합적으로 옮김
  - ‘시온의 딸’로 관용구화
  rationale: 본문은 여성 단수 형태로 시온을 한 사람처럼 부르므로, 이를 집합명사로 평면화하지 않고 시적 의인화를 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4 and #6'
