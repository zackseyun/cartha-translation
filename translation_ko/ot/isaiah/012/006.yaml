base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'Shout and sing for joy.' The second imperative can carry the sense of jubilant singing as well as joyful shouting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'inhabitant of Zion,' feminine singular, personifying Zion as a woman addressed directly.
    reason: cultural_note
translation:
  language: ko
  text: 시온의 주민아, 소리 높여 외치고 기뻐 환호하십시오.[a] 이스라엘의 거룩하신 분께서 당신 가운데에 위대하시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 두 번째 명령형은 기쁨으로 외치는 것뿐 아니라 기쁘게 노래하는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘시온의 주민’을 여성 단수로 표현하여, 시온을 여성으로 의인화해 직접 부릅니다. ‘당신’도 이에 맞춘 여성 단수입니다.
    reason: cultural_note
