id: ISA.12.2
reference: Isaiah 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yah, the LORD'' (יָהּ יְהוָה), a poetic double divine name; the main text renders the emphasis without using the transliterated form.'
    reason: alternative_reading
  - marker: b
    text: This line echoes Exodus 15:2 almost verbatim.
    reason: cross_reference
translation:
  language: ko
  text: 보십시오[a], 하나님이 나의 구원이십니다. 나는 신뢰하고 두려워하지 않을 것입니다. 야, 야훼께서 나의 힘이시며 노래이시니[b], 그분이 나의 구원이 되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 감탄사적 도입부로, 직역의 긴장을 살리기 위해 「보십시오」로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 행은 출애굽기 15:2를 거의 그대로 되풀이합니다.
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 시편적·예언적 감탄사로서 주의를 강하게 환기하는 표현이므로, 현대 문체에서 격식을 유지하는 「보십시오」로 옮겼습니다.
- source_word: אֵל יְשׁוּעָתִי
  english_pob_choice: God is my salvation
  chosen_korean: 하나님이 나의 구원이십니다
  alternatives_korean:
  - 하나님은 나의 구원이십니다
  - 하나님이 나의 구원입니다
  lexicon: HALOT
  rationale: אֵל은 여기서 일반적인 신적 칭호이므로 「하나님」으로 옮기고, יְשׁוּעָתִי의 관계를 자연스럽게 살리기 위해 서술격을 붙였습니다.
- source_word: עָזִּי וְזִמְרָת יָהּ יְהוָה
  english_pob_choice: Yah, Yahweh, is my strength and song
  chosen_korean: 야, 야훼께서 나의 힘이시며 노래이시니
  alternatives_korean:
  - 야, 여호와께서 나의 힘이시며 노래이시니
  - 야훼께서 나의 힘이시며 노래이시니
  lexicon: HALOT
  rationale: 히브리어의 짧은 신명 יָהּ와 이어지는 YHWH의 병렬을 살리기 위해 감탄적 호격 「야」를 두고, 본문 표준형은 「야훼」로 번역했습니다.
- source_word: לִישׁוּעָה
  english_pob_choice: my salvation
  chosen_korean: 나의 구원이
  alternatives_korean:
  - 나의 구원이 되셨습니다
  - 나의 구원이십니다
  lexicon: HALOT
  rationale: 문장 끝의 결과상·체험상 진술을 살리기 위해 과거 완료보다는 한국어의 완료상 「되셨습니다」를 택해 앞의 יְשׁוּעָתִי와 어휘 연결을 유지했습니다.
theological_decisions:
- issue: YHWH를 한국어로 어떻게 표기할지
  chosen_reading: 본문에는 「야훼」를 사용하고, יָהּ의 강조는 「야」로 따로 살렸습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 יָהּ + יְהוָה의 시적 이중 신명 구조를 가지므로, 한 번은 축약형을, 한 번은 표준형을 드러내어 본문의 강조를 최대한 보존했습니다.
  doctrine_reference: POB divine-name policy / source-driven transliteration
- issue: ‘strength and song’의 시적 병렬을 어떻게 살릴지
  chosen_reading: 「나의 힘이시며 노래이시니」로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 나의 힘이시며 찬송이시니
  - 나의 힘이시며 노래가 되시니
  rationale: 출애굽기 15:2의 메아리를 고려해 「힘과 노래」의 어휘를 보존하는 것이 본문의 정서와 상호본문성을 가장 잘 드러냅니다.
  doctrine_reference: Cross-reference to Exodus 15:2
