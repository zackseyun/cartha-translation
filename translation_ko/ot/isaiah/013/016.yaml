  text: Their infants will be dashed to pieces before their eyes; their houses will be plundered[a], and their wives raped.
  footnotes:
  - marker: a
    text: Or 'their wives violated.' The Hebrew verb is a blunt term for sexual assault; 'raped' is used in the main text to avoid euphemism.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 어린아이들은 그들의 눈앞에서 내던져져 산산이 부서지고, 집들은 약탈당하며, 아내들은 강간당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 케티브는 거친 성적 표현으로 ‘강간당하다’를 뜻합니다. 전통적 케레는 ‘눕다’라는 더 완곡한 동사입니다.
    reason: textual_variant
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  english_pob_choice: their infants
  chosen_korean: 그들의 어린아이들
  alternatives_korean:
  - 그들의 유아들
  - 그들의 어린아이들
  lexicon: HALOT
  rationale: עֹלֵל은 매우 어린 자녀를 가리키므로, 한국어에서는 ‘유아들’보다 넓고도 자연스러운 ‘어린아이들’이 본문의 취약성과 연령을 잘 드러냅니다.
- source_word: יְרֻטְּשׁוּ
  english_pob_choice: will be dashed to pieces
  chosen_korean: 짓뭉개질 것입니다
  alternatives_korean:
  - 산산이 부서질 것입니다
  - 짓부서질 것입니다
  lexicon: HALOT
  rationale: 이 동사는 폭력적으로 찢기고 으깨지는 파괴를 뜻하므로, ‘짓뭉개지다’가 아이에게 가해지는 잔혹성을 비교적 सीधे하게 전달합니다.
- source_word: יִשַּׁסּוּ
  english_pob_choice: will be plundered
  chosen_korean: 약탈당할 것입니다
  alternatives_korean:
  - 노략질당할 것입니다
  - 빼앗길 것입니다
  lexicon: HALOT
  rationale: 집을 대상으로 한 동사이므로 수동형 ‘약탈당하다’가 전쟁 약탈의 의미를 가장 직접적으로 살립니다.
- source_word: תשגלנה
  english_pob_choice: raped
  chosen_korean: 강간당할 것입니다
  alternatives_korean:
  - 유린당할 것입니다
  - 성폭행당할 것입니다
  lexicon: HALOT
  rationale: שגל은 노골적인 성폭력을 가리키는 말이어서, 완곡어법인 ‘유린당하다’보다 현대 한국어에서 직접적인 ‘강간당하다’가 본문이 가진 잔혹성을 더 정확히 반영합니다.
theological_decisions:
- issue: 예언 심판문맥의 성폭력 표현을 완곡하게 낮출지 여부
  chosen_reading: ‘강간당할 것입니다’로 직역해 본문의 충격을 유지했습니다.
  alternative_readings:
  - ‘유린당할 것입니다’로 완화할 수 있습니다.
  - ‘성폭행당할 것입니다’로 현대적 법률어를 사용할 수 있습니다.
  rationale: 히브리어 동사의 조악하고 폭력적인 성격을 흐리지 않기 위해 완곡화하지 않았습니다. 예언 본문의 심판과 잔혹함을 청중이 그대로 이해하도록 하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
