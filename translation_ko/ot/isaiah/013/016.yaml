  source_fidelity: ‘짓뭉개질’은 רטש의 폭력적 파괴를 어느 정도 전달하지만, ‘내던져져 산산이 부서지다’가 ‘dashed to pieces’라는 뜻과 피동형을 더 정확히 드러냅니다. ‘집들이 약탈당하고’와 ‘아내들이 강간당할 것입니다’는 각각 יִשַּׁסּוּ와 (케티브) תשגלנה의 전쟁 폭력 문맥을 충실히 옮깁니다.
