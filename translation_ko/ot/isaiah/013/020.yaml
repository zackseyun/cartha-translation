id: ISA.13.20
reference: Isaiah 13:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
  footnotes:
  - marker: a
    text: Or 'no desert nomad will camp there.' The Hebrew term can denote an Arab specifically or, more broadly in context, a nomadic desert-dweller.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에는 영원히 사람이 살지 않을 것입니다. 세대와 세대를 거쳐서도 사람이 살지 않을 것이며, 아랍인[a]이 거기에서 천막을 치지 않을 것이고, 목자들도 거기에서 자기 양 떼를 눕게 하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야 유목민이 거기에서 천막을 치지 않을 것입니다.’ 히브리어 표현은 문맥에 따라 아랍인 또는 더 넓게는 유목하는 광야 거주자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב / תִשְׁכֹּן
  english_pob_choice: will be inhabited / will be dwelt in
  chosen_korean: 사람이 살지 않을 것입니다 / 사람이 살지 않을 것입니다
  alternatives_korean:
  - 거주하지 않을 것입니다
  - 정착하지 않을 것입니다
  - 살지 않을 것입니다
  lexicon: HALOT
  rationale: 도시·땅을 주어로 한 יָשַׁב/שָׁכַן은 한국어에서 자연스럽게 ‘사람이 살다’로 옮길 수 있어, 두 동사의 반복을 살리되 합쇼체로 간결하게 처리했습니다.
- source_word: לָנֶצַח / עַד דּוֹר וָדוֹר
  english_pob_choice: never / from generation to generation
  chosen_korean: 영원히 / 세대와 세대를 거쳐
  alternatives_korean:
  - 영원토록 / 대대로
  - 끝없이 / 대대로
  lexicon: HALOT
  rationale: לָנֶצַח의 지속 부정은 ‘영원히’가 가장 직접적이고, עַד דּוֹר וָדוֹר는 관용구의 반복·연속성을 살려 ‘세대와 세대를 거쳐’로 옮겼습니다.
- source_word: עֲרָבִי
  english_pob_choice: Arab
  chosen_korean: 아랍인
  alternatives_korean:
  - 아라비아인
  - 광야 유목민
  lexicon: HALOT
  rationale: 본문의 기본 의미는 ‘아랍인’이므로 본문에는 직역을 두고, POB의 주석이 인정하는 넓은 뉘앙스는 주석 없이 본문을 흐리지 않는 범위에서 반영했습니다.
- source_word: יַהֵל / רֹעִים יַרְבִּצוּ
  english_pob_choice: will pitch his tent / shepherds will not make their flocks lie down
  chosen_korean: 천막을 치지 않을 것이고 / 목자들도 거기에서 그들의 떼가 눕게 하지 않을 것입니다
  alternatives_korean:
  - 장막을 치지 않을 것이고 / 목자들도 거기에서 그들의 떼를 쉬게 하지 않을 것입니다
  - 천막을 세우지 않을 것이고 / 목자들도 거기에서 그들의 떼를 눕히지 않을 것입니다
  lexicon: HALOT
  rationale: יַהֵל은 유목민의 천막 생활을 가리키므로 ‘천막을 치다’가 자연스럽고, 히필 יַרְבִּצוּ는 목자가 자기 떼를 ‘눕게 하다’는 인과적 뜻을 살리기 위해 목적어를 분명히 했습니다.
theological_decisions:
- issue: 폐허의 절대적 지속성과 심판의 강조
  chosen_reading: ‘영원히 사람이 살지 않을 것입니다’와 ‘세대와 세대를 거쳐’라는 이중 표현을 유지해, 단순한 일시적 황폐가 아니라 지속적 심판을 드러냈습니다.
  alternative_readings:
  - ‘오래도록 사람이 살지 않을 것입니다’처럼 완화
  - 두 표현을 하나로 합쳐 중복을 줄임
  rationale: 히브리어의 이중 시간 표현은 강조 효과가 있으므로, 의미를 약화하지 않고 한국어에서도 병렬로 보존하는 편이 원문 의도에 충실합니다.
  doctrine_reference: 예언 심판의 지속성, 이사야 13장의 바벨론 멸망 예언 맥락
