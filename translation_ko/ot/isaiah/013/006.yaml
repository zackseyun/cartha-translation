id: ISA.13.6
reference: Isaiah 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
  footnotes:
  - marker: a
    text: Or 'Howl'; the Hebrew imperative calls for a loud cry of grief or terror.
    reason: lexical_alternative
  - marker: b
    text: Hebrew has a wordplay between 'destruction' (shod) and 'the Almighty' (Shaddai).
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 울부짖어라. 야훼의 날이 가까이 왔습니다. 그것은 전능자에게서 오는 파괴처럼 올 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울부짖어라’는 히브리어 명령형이 요구하는 큰 울음·통곡의 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문에는 ‘파괴’(שֹׁד)와 ‘전능자’(שַׁדַּי) 사이에 소리의 유사성과 의미적 긴장이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖어라
  alternatives_korean:
  - 애곡하라
  - 통곡하라
  - 울어라
  lexicon: HALOT
  rationale: 히브리어 ילל의 복수 명령형은 공개적이고 강한 슬픔/공포의 외침을 요구하므로, 현대 한국어에서는 ‘울부짖어라’가 감정의 강도와 긴박감을 가장 잘 살립니다.
- source_word: יוֹם יְהוָה
  english_pob_choice: the day of Yahweh
  chosen_korean: 야훼의 날
  alternatives_korean:
  - 여호와의 날
  - 주님의 날
  lexicon: HALOT
  rationale: 본문에 יְהוָה가 직접 나오므로 POB 원칙에 따라 신적 고유명사로 옮겨 ‘야훼의 날’로 표기했습니다.
- source_word: כְּשֹׁד
  english_pob_choice: like destruction
  chosen_korean: 파괴처럼
  alternatives_korean:
  - 멸망처럼
  - 황폐처럼
  - 재난처럼
  lexicon: HALOT
  rationale: שֹׁד는 심판 문맥에서 단순한 ‘약탈물’보다 폭력적 파괴/황폐를 가리키므로, 한국어에서는 사건의 성격을 드러내는 ‘파괴처럼’이 적절합니다.
- source_word: מִשַּׁדַּי
  english_pob_choice: from the Almighty
  chosen_korean: 전능자에게서
  alternatives_korean:
  - 전능자에게로부터
  - 샤다이에게서
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살려 ‘-에게서’로 옮겼고, divine title שַׁדַּי는 의미역을 유지하기 위해 ‘전능자’로 번역했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약적 고유명사 יְהוָה를 직접 사용하므로, 전통적 대체 칭호보다 신적 이름을 보존하는 것이 원문 인식에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שַׁדַּי의 번역
  chosen_reading: 전능자
  alternative_readings:
  - 샤다이
  - 전능하신 이
  rationale: 시적 평행과 심판 선언에서 제목으로 기능하므로, 고유명사 음역보다 의미 번역이 독자에게 즉시 전달됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Translate titles; transliterate names'
