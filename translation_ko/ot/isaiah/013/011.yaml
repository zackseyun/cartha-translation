id: ISA.13.11
reference: Isaiah 13:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
  footnotes:
  - marker: a
    text: Or 'the inhabited world' for 'the world.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will bring low the pride of the ruthless.' The Hebrew uses two near-synonymous expressions for arrogant exaltation in parallel lines.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 세상에 그 악을[a], 그리고 악인들에게 그들의 죄악을 징벌하실 것입니다. 그분은 교만한 자들의 오만을 그치게 하시고, 포악한 자들의 거만함을 낮추실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거주하는 세상’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 징벌하실 것입니다
  alternatives_korean:
  - 벌하실 것입니다
  - 책임을 물으실 것입니다
  - 심판하실 것입니다
  lexicon: HALOT
  rationale: פּקד는 넓게는 ‘돌보다/방문하다’이지만, כאן은 עַל과 함께 악과 악인을 대상으로 하므로 징벌적 심판의 뜻이 분명합니다. ‘징벌하다’는 이 사법적 강도를 살리면서도 자연스럽습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 땅
  - 거주하는 세상
  lexicon: HALOT
  rationale: תֵּבֵל은 거주 세계를 가리키는 말이지만, 문맥상 자연스럽고 넓은 범위를 유지하는 한국어로 ‘세상’이 적절합니다.
- source_word: עֲוֺנָם
  english_pob_choice: their iniquity
  chosen_korean: 그들의 죄악
  alternatives_korean:
  - 그들의 죄책
  - 그들의 불의
  - 그들의 악행
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 죄책에 대한 형벌까지 아우를 수 있으나 여기서는 악인들의 도덕적 잘못을 가리킵니다. ‘죄악’이 그 무게를 가장 잘 보존합니다.
- source_word: גְּאוֹן זֵדִים / גַאֲוַת עָרִיצִים
  english_pob_choice: the pride of the arrogant / the haughtiness of the ruthless
  chosen_korean: 교만한 자들의 오만 / 포악한 자들의 거만함
  alternatives_korean:
  - 오만한 자들의 교만 / 잔혹한 자들의 높아짐
  - 교만의 자만 / 포악한 자들의 자고함
  lexicon: HALOT
  rationale: 두 병행구는 서로 겹치면서도 뉘앙스가 조금 다르므로, 첫째는 ‘오만’, 둘째는 ‘거만함’으로 구분해 반복을 살렸습니다. זֵדִים과 עָרִיצִים는 각각 ‘교만한 자들’, ‘포악한 자들’로 옮겨 도덕적 성격을 드러냈습니다.
theological_decisions:
- issue: תֵּבֵל의 범위
  chosen_reading: ‘세상’으로 옮겨, 이 심판이 바벨론만이 아니라 거주 세계 전체를 향한 보편적 심판 선언으로 들리게 했습니다.
  alternative_readings:
  - ‘땅’으로 좁혀 번역하기
  - 바벨론만을 가리키는 것으로 해석하기
  rationale: 본문은 ‘세상’, ‘악인들’, ‘그들의 죄악’ 같은 보편적 표현을 함께 사용하므로, 해석적으로 범위를 좁히기보다 원문의 넓이를 유지하는 편이 적절합니다.
  doctrine_reference: 심판의 보편성과 문맥적 긴장을 보존
