review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어는 1인칭 화자(‘내가’)이며, פקד는 ‘세상’과 ‘악인들’을 심판/벌의 대상으로, רעה와 עון을 그 근거가 되는 악으로 병렬합니다. 초안의 ‘세상에 그 악을 … 징벌하다’는 조사와 목적어 관계가 부자연스럽고 원문의 구문을 흐립니다.
  naturalness: ‘나는 세상을 그 악 때문에, 악인들을 그들의 죄악 때문에 벌할 것입니다’는 한국어에서 병렬 목적어와 심판의 근거를 자연스럽게 드러냅니다. ‘그치게 하다’와 ‘낮추다’는 두 히브리어 사역 동사의 대조를 유지합니다.
  terminology: ‘세상’(תבל), ‘악인들’(רשעים), ‘죄악’(עון), ‘오만’(גאון), ‘포악한 자들’(עריצים)을 유지할 수 있습니다. זדים는 ‘교만한 자들’로, עריצים는 폭력적·억압적 성격을 담은 ‘포악한 자들’로 옮긴 것이 적절합니다.
  issues:
  - severity: high
    issue: 화자 인칭이 ‘그분’(3인칭)으로 바뀌어 있습니다.
    rationale: 원문 동사들은 모두 1인칭 단수이며, 이사야 13:11은 신적 화자의 직접 선언입니다. 한국어 번역도 ‘나는’과 1인칭 서술로 보존해야 합니다.
  - severity: high
    issue: ‘세상에 그 악을 … 징벌하다’는 구문이 부자연스럽고 원문의 관계를 모호하게 합니다.
    rationale: עַל תבל רעה는 세상을 그 악 때문에 벌한다는 심판 구문입니다. ‘세상에 악을 징벌하다’는 세상을 간접 대상처럼 만들고 무엇을 벌하는지 혼동시킵니다.
  - severity: low
    issue: 영어 감사 기록의 병행 표현 관련 주석 b에 대응하는 한국어 주석이 없습니다.
    rationale: 구조상 필수 오류는 아니지만, 두 유의적 병행 표현의 번역 선택을 투명하게 하려면 해당 주석을 보존하는 편이 좋습니다.
  revised_text: 나는 세상을 그 악 때문에, 악인들을 그들의 죄악 때문에 벌할 것입니다. 나는 교만한 자들의 오만을 그치게 하고, 포악한 자들의 거만함을 낮출 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘거주하는 세상’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포악한 자들의 오만을 낮출 것이다’. 히브리어는 교만하게 높아짐을 뜻하는 서로 가까운 두 표현을 병행합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 1인칭 직접 발화를 회복하고, ‘세상’과 ‘악인들’이 각각 그들의 악/죄악 때문에 벌을 받는다는 구문을 명료하게 했습니다. 후반부의 사역 동사(‘그치게 하다’, ‘낮추다’)와 두 병행 명사의 미세한 어감 차이는 유지했습니다. 주석 b는 영어 감사 기록의 어휘·병행 관련 정보를 한국어에서도 확인할 수 있도록 추가했습니다.
