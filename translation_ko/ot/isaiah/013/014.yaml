  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ/צְבִ֣י מֻדָּ֔ח וּ/כְ/צֹ֖אן וְ/אֵ֣ין מְקַבֵּ֑ץ אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ אֶל אַרְצ֖/וֹ יָנֽוּסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
  footnotes:
  - marker: a
    text: Or 'like a gazelle driven away'; the Hebrew participle can mean 'driven away' or 'chased off,' not only 'hunted.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man' in a distributive sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 쫓겨난 가젤처럼, 또 모으는 이 없는 양 떼처럼 될 것입니다. 각 사람은 자기 백성에게로 돌아가고, 각자 자기 땅으로 도망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쫓겨난’은 히브리어 분사 מֻדָּח의 핵심 의미를 살린 번역입니다. 문맥상 ‘사냥당한’보다 ‘몰려난/쫓겨난’이 더 직접적일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 אִישׁ은 여기서 ‘각 사람’이라는 분배적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּצְבִי מֻדָּח
  english_pob_choice: like a hunted gazelle
  chosen_korean: 쫓겨난 가젤처럼
  alternatives_korean:
  - 사냥당한 가젤처럼
  - 몰려난 가젤처럼
  - 쫓기는 가젤처럼
  lexicon: HALOT
  rationale: מֻדָּח은 ‘쫓겨난/몰려난’ 뜻이 핵심이므로, ‘사냥당한’보다 직결되는 동작을 살려 옮겼습니다. 가젤은 현대어로 자연스럽고, 한국어에서도 시각적 대비가 분명합니다.
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  english_pob_choice: and like sheep with no one to gather them
  chosen_korean: 또 모으는 이 없는 양 떼처럼
  alternatives_korean:
  - 또 모아 주는 이 없는 양 떼처럼
  - 또 모을 사람이 없는 양 떼처럼
  - 또 모으는 자가 없는 양 떼처럼
  lexicon: HALOT
  rationale: צֹאן은 집합적 가축이지만, 뒤의 ‘모으는 이’와 잘 맞는 한국어로 ‘양 떼’가 가장 자연스럽습니다. אין + 분사는 ‘~하는 이 없는’ 구조로 옮겨 부재를 살렸습니다.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  english_pob_choice: each man will turn to his own people
  chosen_korean: 각 사람은 자기 백성에게로 돌아가고
  alternatives_korean:
  - 각 사람은 자기 백성에게로 향하고
  - 각 사람은 자기 민족에게로 돌아가고
  - 사람마다 자기 백성에게로 돌아가고
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살리되 한국어에서는 성별을 드러내는 ‘남자’보다 문맥상 자연한 ‘각 사람’이 전달력이 좋습니다. פנה는 ‘돌아가다/향하다’가 가능하지만, 분열과 흩어짐의 맥락에서 ‘돌아가다’가 더 적절합니다.
- source_word: וְאִישׁ אֶל אַרְצ/וֹ יָנֽוּסוּ
  english_pob_choice: and each will flee to his own land
  chosen_korean: 각자 자기 땅으로 도망할 것입니다
  alternatives_korean:
  - 각 사람은 자기 땅으로 도망할 것입니다
  - 그리고 각자 자기 땅으로 달아날 것입니다
  - 각자 자기 땅으로 피할 것입니다
  lexicon: HALOT
  rationale: נוּס는 단순 이동보다 ‘도망하다/달아나다’의 긴박한 도피를 뜻하므로 그 강도를 보존했습니다. ‘땅’은 אֶרֶץ의 기본적 의미를 따랐고, 분배적 의미는 앞선 ‘각 사람’과 ‘각자’로 유지했습니다.
theological_decisions:
- issue: 분배적 표현 אִישׁ의 성별 표지
  chosen_reading: 첫 절반은 ‘각 사람’, 뒤는 ‘각자’로 옮겨 분배성을 살리되 성별을 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 각 남자
  - 각자 각 사람
  rationale: 히브리어는 분배적 남성 단수이지만, 한국어에서는 본문 정보 전달이 우선이므로 성별 표지를 부각하지 않는 번역이 자연스럽습니다. 다만 분배 의미는 문맥상 명확히 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
