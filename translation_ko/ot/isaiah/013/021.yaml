id: ISA.13.21
reference: Isaiah 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָבְצוּ שָׁ֣ם צִיִּ֔ים וּ/מָלְא֥וּ בָתֵּי/הֶ֖ם אֹחִ֑ים וְ/שָׁ֤כְנוּ שָׁם֙ בְּנ֣וֹת יַֽעֲנָ֔ה וּ/שְׂעִירִ֖ים יְרַקְּדוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
  footnotes:
  - marker: a
    text: Or 'howling creatures' or 'jackals' for 'owls'; the Hebrew term אֹחִים is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'goat-demons' or 'satyrs'; the Hebrew שְׂעִירִים can denote hairy goats and may also carry mythic or demonic associations in some contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 광야의 짐승들이 그곳에 누울 것이며, 그들의 집에는 부엉이들이[a] 가득할 것입니다. 타조들이 그곳에 살 것이며, 들염소들이[b] 그곳에서 춤출 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울부짖는 것들’ 또는 ‘자칼들’; 히브리어 אֹחִים의 뜻은 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘염소 귀신들’ 또는 ‘사티로스들’; 히브리어 שְׂעִירִים은 털이 많은 염소를 가리킬 수 있으며, 어떤 문맥에서는 신화적 또는 악령적 연상을 띨 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  english_pob_choice: will lie down
  chosen_korean: 누울 것입니다
  alternatives_korean:
  - 엎드릴 것입니다
  - 머물 것입니다
  lexicon: HALOT
  rationale: רבץ는 동물이 엎드리거나 누워 자리를 잡는 그림을 나타내므로, 자연스러운 현대 한국어로 ‘누울 것입니다’가 원문의 정적 이미지를 잘 살립니다.
- source_word: צִיִּים
  english_pob_choice: desert creatures
  chosen_korean: 광야의 짐승들
  alternatives_korean:
  - 사막의 생물들
  - 황무지의 짐승들
  lexicon: HALOT
  rationale: 이 단어는 특정 종을 가리키기보다 황폐한 광야에 사는 존재들을 폭넓게 가리키므로, 종을 특정하지 않는 표현으로 옮겼습니다.
- source_word: אֹחִים
  english_pob_choice: owls
  chosen_korean: 부엉이들
  alternatives_korean:
  - 올빼미들
  - 울부짖는 것들
  - 자칼들
  lexicon: HALOT
  rationale: 히브리어는 불확실하지만, 전통적 영어 번역처럼 야간 조류를 가리키는 뜻으로 읽을 수 있어 한국어에서는 자연스러운 ‘부엉이들’로 옮기되, 의미의 불확실성은 본문에 남기지 않았습니다.
- source_word: בְּנוֹת יַעֲנָה
  english_pob_choice: ostriches
  chosen_korean: 타조들
  alternatives_korean:
  - 타조 암컷들
  - 타조의 딸들
  lexicon: HALOT
  rationale: 히브리어 관용구는 조류 종명을 가리키는 표현이므로, 문자적 구조를 풀어 한국어 일반 독자가 이해하기 쉬운 종명 ‘타조들’로 옮겼습니다.
- source_word: וּשְׂעִירִים
  english_pob_choice: wild goats
  chosen_korean: 들염소들
  alternatives_korean:
  - 산염소들
  - 염소-귀신들
  - 사티로스들
  lexicon: HALOT
  rationale: 어근상 ‘털 많은 것들/염소들’의 기본 의미를 따르되, 본문이 요구하지 않는 강한 악령적 의미를 피하기 위해 ‘들염소들’로 옮겼습니다.
- source_word: יְרַקְּדוּ
  english_pob_choice: will dance
  chosen_korean: 춤출 것입니다
  alternatives_korean:
  - 뛰어다닐 것입니다
  - 뛸 것입니다
  lexicon: HALOT
  rationale: רקד는 춤추다/뛰놀다의 뜻을 가지며, 폐허를 배경으로 한 시적 장면의 기괴함을 살리기 위해 ‘춤출 것입니다’를 선택했습니다.
theological_decisions:
- issue: וּשְׂעִירִים의 의미를 들염소로 둘지, 염소-귀신으로 둘지
  chosen_reading: 본문은 들염소들로 번역했습니다.
  alternative_readings:
  - 염소-귀신들
  - 사티로스들
  rationale: 이 절의 맥락은 황폐한 폐허에 사는 들짐승들의 묘사이므로, 본문이 명시적으로 요구하지 않는 악마론적 해석을 본문에 직접 넣지 않았습니다. 다만 문맥상 기이하고 초자연적인 뉘앙스 가능성은 어휘 선택의 절제 속에 남겨 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: אֹחִים의 불확실한 동물명 처리
  chosen_reading: 본문에는 단순히 ‘부엉이들’로 두었습니다.
  alternative_readings:
  - 자칼들
  - 울부짖는 것들
  rationale: 히브리어가 불확실하지만, 시적 평행상 폐허에 들어오는 밤의 동물군이라는 기본 이미지는 분명하므로 본문에서는 자연스러운 동물명으로 정리하고, 불확실성은 주석 없이도 과도한 단정은 피하는 방식으로 처리했습니다.
  doctrine_reference: Translation philosophy §1
