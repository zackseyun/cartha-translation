translation:
  language: ko
  text: 야훼와 그분의 진노의 무기들이 온 땅[c]을 멸망시키려고 먼 땅에서, 하늘의 끝에서[a] 옵니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 가장 먼 곳에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 진노의 도구들이 … 옵니다’.
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅’은 ‘온 나라’ 또는 ‘온 세상’으로도 옮길 수 있으나, 이 절의 하늘을 배경으로 한 우주적 표현은 여기서 더 넓은 뜻을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  english_pob_choice: They are coming
  chosen_korean: 옵니다
  alternatives_korean:
  - 오고 있습니다
  - 오는 자들입니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 생생한 진행감을 살리되, 한국어에서는 문맥상 주어를 앞에서 제시한 뒤 간결하게 ‘옵니다’로 옮기는 것이 자연스럽습니다.
- source_word: מֵאֶרֶץ מֶרְחָק
  english_pob_choice: from a distant land
  chosen_korean: 먼 땅에서
  alternatives_korean:
