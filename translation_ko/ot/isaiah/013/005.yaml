id: ISA.13.5
reference: Isaiah 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
  footnotes:
  - marker: a
    text: Or 'from the farthest reaches of the heavens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the instruments of his wrath.'
    reason: lexical_alternative
  - marker: c
    text: '''The whole earth'' may also be rendered ''the whole land,'' but the cosmic language in the verse favors the broader sense here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 먼 땅에서, 하늘의 끝에서 옵니다—야훼와 그의 분노의 무기들이— 온 땅을 멸망시키려고.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 가장 먼 곳에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 진노의 도구들’.
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅’은 ‘온 나라/땅’으로도 옮길 수 있으나, 하늘을 배경으로 한 우주적 표현이므로 여기서는 더 넓은 뜻이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  english_pob_choice: They are coming
  chosen_korean: 옵니다
  alternatives_korean:
  - 오고 있습니다
  - 오는 자들입니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 생생한 진행감을 살리되, 한국어에서는 문맥상 주어를 앞에서 제시한 뒤 간결하게 ‘옵니다’로 옮기는 것이 자연스럽습니다.
- source_word: מֵאֶרֶץ מֶרְחָק
  english_pob_choice: from a distant land
  chosen_korean: 먼 땅에서
  alternatives_korean:
  - 먼 나라에서
  - 멀리 떨어진 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 ‘땅/지역’이 자연스럽고, מֶרְחָק의 거리감을 ‘먼’으로 간결하게 반영했습니다.
- source_word: מִקְצֵה הַשָּׁמַיִם
  english_pob_choice: from the end of the heavens
  chosen_korean: 하늘의 끝에서
  alternatives_korean:
  - 하늘의 가장자리에서
  - 하늘의 끝자락에서
  lexicon: HALOT
  rationale: 시적·우주적 표현을 그대로 살리기 위해 ‘하늘의 끝’으로 옮겼습니다. 현대 한국어에서도 충분히 강한 종말적 이미지를 줍니다.
- source_word: וּכְלֵי זַעְמוֹ
  english_pob_choice: and the weapons of his wrath
  chosen_korean: 그의 분노의 무기들이
  alternatives_korean:
  - 그의 진노의 무기들
  - 그의 분노의 도구들
  lexicon: HALOT
  rationale: כְּלֵי는 문맥상 무기/도구를 가리킬 수 있으나, 심판 문맥에서는 ‘무기’가 가장 직접적입니다. זַעַם은 ‘분노’로 충분히 강하게 전달됩니다.
- source_word: לְחַבֵּל
  english_pob_choice: to destroy
  chosen_korean: 멸망시키려고
  alternatives_korean:
  - 파괴하려고
  - 무너뜨리려고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사이므로 한국어의 ‘-려고’로 옮겼고, 심판 예언의 파괴성을 ‘멸망시키다’로 강하게 반영했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: the whole earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 모든 땅
  lexicon: HALOT
  rationale: 문맥의 우주적 과장을 살리면서도 한국어에서는 ‘온 땅’이 가장 자연스럽고, ‘earth/land’의 긴장을 과도하게 좁히지 않습니다.
theological_decisions:
- issue: יְהוָה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문의 고유명사를 보존하는 방향을 따랐습니다. 이 절은 직접적인 하나님의 이름을 사용하므로 ‘주’로 대체하지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
