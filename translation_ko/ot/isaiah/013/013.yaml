  source_fidelity: 수정이 필요합니다. 초안의 ‘땅은 제자리에서 흔들리게 하리니’는 히브리어의 자동사형 ‘땅이 흔들릴 것이다’보다 사역형으로 읽힐 수 있으며, ‘…날에 그렇게 되리라’는 원문의 두 전치사구(야훼의 격분으로/그의 타오르는 진노의 날에)를 재구성합니다. 또한 ‘야훼 만군’에는 소유·관계 표현이 필요합니다.
  naturalness: ‘만군의 야훼’는 직역적이지만 한국어에서 관계가 분명하며, ‘하늘들을’은 우주적 복수의 효과를 보존합니다. 합쇼체에 맞추어 미래 서술을 ‘하겠습니다/것입니다’로 정리했습니다.
  terminology: יהוה는 ‘야훼’로, צבאות는 군사적 함의를 보존하여 ‘만군’으로 옮겼습니다. עֶבְרָה와 חֲרוֹן אַף의 강도와 불타는 이미지는 각각 ‘격분’과 ‘타오르는 진노’로 구별했습니다.
