revisions:
- from: 그러므로 내가 하늘들을 떨게 하고, 땅은 제자리에서 흔들리게 하리니 — 야훼 만군의 분노와 그의 타오르는 진노의 날에 그렇게 되리라.[a]
  to: 그러므로 내가 하늘들을 떨게 하겠으며, 땅은 그 자리에서 흔들릴 것입니다. 만군의 야훼의 격분으로, 그의 타오르는 진노의 날에 말입니다.[a]
  rationale: 원문의 사역형(하늘들을 떨게 하다)과 자동사형(땅이 흔들리다)을 구별하고, 신명 ‘야훼’와 칭호 ‘만군’을 문법적으로 연결했습니다. 또한 격분과 타오르는 진노의 날이라는 두 원문 표현을 삭제하거나 설명적 문장으로 바꾸지 않고 보존했습니다.
