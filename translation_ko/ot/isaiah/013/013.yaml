id: ISA.13.13
reference: Isaiah 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 하늘들을 떨게 하고, 땅은 제자리에서 흔들리게 하리니 — 야훼 만군의 분노와 그의 타오르는 진노의 날에 그렇게 되리라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘들’은 히브리어 복수형의 우주적 범위를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그리하여
  lexicon: HALOT
  rationale: 원인-결과를 잇는 예언적 결론 표지로, 한국어에서도 가장 자연스럽고 간결한 추론 접속사입니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘나라
  lexicon: HALOT
  rationale: 우주적 심판 문맥에서 복수형의 폭넓은 의미를 살리기 위해 단수보다 ‘하늘들’이 원문의 장엄함과 범위를 더 잘 드러냅니다.
- source_word: אַרְגִּיז / וְתִרְעַשׁ
  english_pob_choice: make ... tremble / will shake
  chosen_korean: 떨게 하고 / 흔들리게 하리니
  alternatives_korean:
  - 떨게 하고 / 진동하게 하리니
  - 뒤흔들고 / 흔들리게 하리니
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스와 병렬 동사를 함께 살리기 위해 첫 동사는 ‘떨게 하다’, 둘째는 ‘흔들리게 하다’로 구분했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군
  alternatives_korean:
  - 야훼 군대들의 주
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 이사야의 군사적 심판 문맥에서 צְבָאוֹת는 ‘만군’이 한국어 성경 전통과 의미를 함께 살리며, 여기에 야훼를 직접 보존했습니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: his burning anger
  chosen_korean: 타오르는 진노
  alternatives_korean:
  - 불타는 분노
  - 맹렬한 진노
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘불붙은/달아오른 분노’ 이미지를 현대 한국어로 자연스럽게 옮겨, 단순한 ‘분노’보다 강도를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼로 직접 옮겨, 전통적 ‘주’로 완전히 평탄화하지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 언약명을 직접 사용하므로, 원문 고유명을 보존하는 쪽이 서술자의 신학적 강조를 더 정확히 드러냅니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: יְהוָה צְבָאוֹת의 제목 표현
  chosen_reading: ‘만군’으로 옮겨 군사적 심판의 함의를 드러냈습니다.
  alternative_readings:
  - 만군의 주
  - 만군의 하나님
  rationale: צְבָאוֹת는 단순한 존칭이 아니라 전쟁·군대의 이미지를 지닌 직함이므로, 그 의미를 독자가 바로 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §2, 'Translate titles; transliterate names'
