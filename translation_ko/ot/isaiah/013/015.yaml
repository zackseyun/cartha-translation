  text: כָּל הַ/נִּמְצָ֖א יִדָּקֵ֑ר וְ/כָל הַ/נִּסְפֶּ֖ה יִפּ֥וֹל בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/015.yaml
  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
  footnotes:
  - marker: a
    text: Or 'everyone who is swept away' for 'everyone who is caught.' The Hebrew participle from ספה can carry a broader sense than simple capture; the main text chooses the reading that best fits the immediate military judgment context.
    reason: lexical_alternative
translation:
  language: ko
  text: 찾을 수 있는 사람은 모두 찔릴 것이며, 사로잡힌 사람은 모두 칼에 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘휩쓸린 사람은 모두’로도 옮길 수 있습니다. 히브리어 ספה의 분사형은 ‘사로잡히다’보다 더 넓게 ‘휩쓸리다, 제거되다’의 뜻을 가질 수 있으나, 여기서는 전투 심판의 문맥을 우선했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנִּמְצָא
  english_pob_choice: Everyone who is found
  chosen_korean: 찾을 수 있는 사람은 모두
  alternatives_korean:
  - 발견되는 사람은 모두
  - 찾아지는 사람은 모두
  lexicon: HALOT
  rationale: נמצא의 수동적 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 분포적 의미가 분명한 표현으로 옮겼습니다.
- source_word: יִדָּקֵר
  english_pob_choice: will be pierced through
  chosen_korean: 찔릴 것이며
  alternatives_korean:
  - 꿰뚫릴 것이며
  - 관통당할 것이며
  lexicon: HALOT
  rationale: 전투적 심판 문맥에서 דקר의 폭력성을 간결하게 살리면서도, 합쇼체 서술에 맞게 자연스럽게 표현했습니다.
- source_word: הַנִּסְפֶּה
  english_pob_choice: who is caught
  chosen_korean: 사로잡힌 사람은 모두
  alternatives_korean:
  - 휩쓸린 사람은 모두
  - 붙잡힌 사람은 모두
  lexicon: HALOT
  rationale: POB의 주석처럼 ספה는 ‘휩쓸리다’까지 포함할 수 있지만, 본문 맥락의 전쟁·멸망 상황에서는 ‘사로잡히다’가 가장 직접적으로 맞습니다.
- source_word: בֶּחָרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼로 쓰러질 것입니다
  - 칼에 죽을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 옮길 때 ‘칼에 쓰러지다’가 죽음의 결과와 전투 상황을 함께 드러내며, 문장 평행성도 유지합니다.
theological_decisions:
- issue: 심판 선언의 직접성과 완곡어 처리
  chosen_reading: 전쟁적 심판을 완화하지 않고, ‘찔리다’와 ‘칼에 쓰러지다’로 본문의 폭력성과 단호함을 유지했습니다.
  alternative_readings:
  - ‘죽임을 당하다’로 완화하는 읽기
  - ‘무너지다’처럼 비유적으로 약화하는 읽기
  rationale: 이 구절은 실제 전쟁 심판을 묘사하므로, 은유적으로 희석하기보다 מקור의 가시적 폭력 이미지를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 예언서의 심판 언어와 역사적 심판 묘사
