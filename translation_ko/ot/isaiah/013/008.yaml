id: ISA.13.8
reference: Isaiah 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/נִבְהָ֓לוּ צִירִ֤ים וַֽ/חֲבָלִים֙ יֹֽאחֵז֔וּ/ן כַּ/יּוֹלֵדָ֖ה יְחִיל֑וּ/ן אִ֤ישׁ אֶל רֵעֵ֨/הוּ֙ יִתְמָ֔הוּ פְּנֵ֥י לְהָבִ֖ים פְּנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/008.yaml
  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
  footnotes:
  - marker: a
    text: Or 'their faces will be aflame.' The Hebrew literally says, 'their faces are faces of flames,' a vivid image that may suggest either fiery pallor/redness or terror made visible on the face.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 몹시 놀랄 것입니다. 고통과 산고가 그들을 사로잡을 것입니다. 그들은 해산하는 여인처럼 몸부림칠 것입니다. 각 사람은 자기 이웃을 멍하니 바라볼 것이며, 그들의 얼굴은 불꽃의 얼굴일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 얼굴이 불꽃처럼 타오를 것입니다.’ 히브리어는 문자적으로 ‘그들의 얼굴은 불꽃들의 얼굴입니다’라고 말합니다. 이는 공포가 얼굴에 드러난 모습을 생생하게 나타내는 표현으로, 얼굴이 불같이 달아오르거나 창백해지는 모습을 암시할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  english_pob_choice: they will be dismayed
  chosen_korean: 두려워하며
  alternatives_korean:
  - 당황하며
  - 공포에 질려
  lexicon: HALOT
  rationale: נבהל의 핵심은 갑작스러운 동요와 두려움이므로, ‘두려워하며’가 과도한 해석 없이 자연스럽게 이를 반영합니다.
- source_word: צִירִים וַחֲבָלִים
  english_pob_choice: pains and labor pangs
  chosen_korean: 진통과 산고
  alternatives_korean:
  - 고통과 진통
  - 산통과 해산의 고통
  lexicon: HALOT
  rationale: 두 명사가 출산 고통의 중첩을 이루므로, 한국어도 ‘진통’과 ‘산고’로 짝을 맞춰 산통의 강도를 살렸습니다.
- source_word: יֹאחֵז֔וּן
  english_pob_choice: will seize them
  chosen_korean: 사로잡을 것입니다
  alternatives_korean:
  - 붙들 것입니다
  - 덮칠 것입니다
  lexicon: HALOT
  rationale: ‘붙잡다’의 물리성을 유지하면서, 고통이 사람을 압도해 장악하는 이미지를 한국어로 가장 자연스럽게 드러냅니다.
- source_word: פְּנֵ֥י לְהָבִ֖ים פְּנֵי/הֶם
  english_pob_choice: their faces will be faces of flame
  chosen_korean: 그들의 얼굴은 불꽃 같은 얼굴일 것입니다
  alternatives_korean:
  - 그들의 얼굴은 불꽃의 얼굴일 것입니다
  - 그들의 얼굴은 불길한 얼굴일 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직유적이고 반복적인 표현을 살려 ‘불꽃 같은 얼굴’로 옮겼으며, 의미를 지나치게 평탄화하지 않았습니다.
theological_decisions:
- issue: 출산 고통 비유와 얼굴-불꽃 이미지의 강도 유지
  chosen_reading: 고통과 산고, 그리고 얼굴의 불꽃 같은 이미지가 실제 출산 고통과 공포의 가시적 표지라는 점을 살려 번역했습니다.
  alternative_readings:
  - ‘고통’만으로 일반화하는 읽기
  - ‘얼굴이 벌겋게 달아오른다’로 완화하는 읽기
  rationale: 예언적 심판 장면의 신체적·시각적 충격을 약화시키지 않기 위해, 히브리어의 중첩된 산고 표현과 얼굴 이미지의 생생함을 보존했습니다.
  doctrine_reference: 예언 문학의 심판 묘사와 상징적 신체 이미지 해석
