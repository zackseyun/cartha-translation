id: ISA.13.22
reference: Isaiah 13:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָנָ֤ה אִיִּים֙ בְּ/אַלְמנוֹתָ֔י/ו וְ/תַנִּ֖ים בְּ/הֵ֣יכְלֵי עֹ֑נֶג וְ/קָר֤וֹב לָ/בוֹא֙ עִתָּ֔/הּ וְ/יָמֶ֖י/הָ לֹ֥א יִמָּשֵֽׁכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
  footnotes:
  - marker: a
    text: Or 'wild animals' or 'jackals' for 'hyenas'; the Hebrew term אִיִּים is uncertain in precise zoological reference.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word in 'her palaces' is difficult; some take it more literally as 'widows,' but the context strongly favors ruined noble dwellings or palaces.
    reason: lexical_alternative
  - marker: c
    text: Babylon is personified as a woman, hence 'her time' and 'her days.'
    reason: cultural_note
translation:
  language: ko
  text: 하이에나들이 그녀의 궁전들에서[a][b] 울부짖고, 자칼들이 그녀의 호화로운 전각들에서 울부짖을 것입니다. 그녀의 때가[c] 가까이 왔고, 그녀의 날들은 더 길어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִיִּים의 정확한 동물명은 불확실합니다. ‘들짐승들’ 또는 ‘자칼들’로 이해하는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 난해합니다. 문자적으로는 ‘그의 과부들’로 볼 수도 있으나, 문맥과 다음 구절의 병행을 따라 궁전이나 귀족의 거처를 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: c
    text: 바벨론이 여성으로 의인화되어 있으므로 ‘그녀의 때’와 ‘그녀의 날들’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  english_pob_choice: will cry out
  chosen_korean: 울부짖을 것입니다
  alternatives_korean:
  - 외칠 것입니다
  - 울 것입니다
  lexicon: HALOT
  rationale: 동물 주어가 폐허를 배경으로 내는 소리를 나타내므로, 단순한 ‘대답하다’보다 ‘울부짖다’가 문맥의 음향 이미지를 더 잘 살립니다.
- source_word: אִיִּים
  english_pob_choice: hyenas
  chosen_korean: 승냥이들
  alternatives_korean:
  - 하이에나들
  - 들짐승들
  lexicon: HALOT
  rationale: 정확한 동물 명칭은 불확실하지만, 한국어 성경 문맥에서는 폐허를 배회하는 사나운 청소동물 이미지를 ‘승냥이’가 자연스럽게 전달합니다.
- source_word: בְּ/אַלְמנוֹתָי/ו
  english_pob_choice: in her palaces
  chosen_korean: 그 폐허가 된 궁전들에서
  alternatives_korean:
  - 그의 궁전들에서
  - 그 과부들에서
  - 황폐한 집들에서
  lexicon: HALOT
  rationale: 자음형은 난해하지만, 이어지는 ‘화려한 전각들’과 병행되므로 문자적 ‘과부들’보다 무너진 왕궁/귀족 거처의 의미로 옮기는 것이 문맥에 합당합니다.
- source_word: בְּהֵיכְלֵי עֹנֶג
  english_pob_choice: in her luxurious halls
  chosen_korean: 그 화려한 전각들에서
  alternatives_korean:
  - 쾌락의 전각들에서
  - 호화로운 궁전들에서
  lexicon: HALOT
  rationale: היכל은 궁전/전각의 넓은 건물을 가리키며, עֹנֶג은 사치와 화려함을 뜻하므로, 이전의 영광이 폐허로 바뀐 대비를 살려 ‘화려한 전각들’로 옮겼습니다.
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  english_pob_choice: Her time is near to come
  chosen_korean: 그녀의 때가 곧 올 것이며
  alternatives_korean:
  - 그녀의 시간이 곧 올 것이며
  - 그녀가 올 때가 가까우며
  lexicon: HALOT
  rationale: 도시 바벨론을 여성으로 의인화한 표현을 따라 ‘그녀의 때’로 유지하고, ‘곧’으로 임박성을 분명히 했습니다.
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  english_pob_choice: her days will not be prolonged
  chosen_korean: 그녀의 날들은 길어지지 않을 것입니다
  alternatives_korean:
  - 그녀의 날들은 연장되지 않을 것입니다
  - 그녀의 날들은 더 이어지지 않을 것입니다
  lexicon: HALOT
  rationale: נמשך의 ‘연장되다/길어지다’ 의미를 살리되, 현대 한국어에서 자연스럽고 판결문 같은 종결감을 주도록 ‘길어지지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 바벨론의 의인화
  chosen_reading: ‘그녀’와 ‘그녀의 때/날들’을 유지해 바벨론을 여성으로 의인화한 원문 표현을 보존했습니다.
  alternative_readings:
  - ‘그것의 때’
  - ‘그 도시의 때’
  rationale: 히브리어의 여성 접미사를 평탄화하면 예언적 풍자와 심판 선언의 인격적 대상성이 약해지므로, 의인화를 그대로 드러내는 번역을 택했습니다.
  doctrine_reference: 예언서의 수사와 도시 의인화
- issue: 동물 명칭의 불확실성
  chosen_reading: ‘승냥이들’과 ‘자칼들’을 병렬로 두어 폐허의 야생 짐승 이미지를 살렸습니다.
  alternative_readings:
  - ‘들짐승들’과 ‘자칼들’
  - ‘하이에나들’과 ‘자칼들’
  rationale: אִיִּים의 정확한 동물 식별은 불확실하므로, 단정적 동물학보다 문맥상 황폐함을 드러내는 번역이 우선됩니다.
  doctrine_reference: 본문 어휘의 불확실성에 대한 주해 원칙
