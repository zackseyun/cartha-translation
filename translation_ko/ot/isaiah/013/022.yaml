  verdict: revise
  source_fidelity: 첫 절의 ‘폐허가 된’은 히브리어 본문에 명시되어 있지 않으므로 삭제해야 합니다. אִיִּים의 동물학적 지칭은 불확실하지만 영어 POB의 선택을 따라 ‘하이에나들’로 옮기고 각주로 불확실성을 밝혔습니다. בְּאַלְמְנוֹתָיו는 난해한 형태이나, 병행구와 문맥에 따라 궁전/귀족 거처를 뜻하는 해석을 본문에 반영하되 각주에서 문자적 대안을 보존했습니다.
  naturalness: ‘그녀의 때가 가까이 왔고’와 ‘그녀의 날들은 더 길어지지 않을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 임박한 심판이라는 선언의 어조를 유지합니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
  terminology: ‘하이에나’와 ‘자칼’은 서로 다른 동물 명칭을 유지합니다. 바벨론의 여성 의인화는 ‘그녀의’로 보존했습니다. ‘호화로운 전각들’은 הֵיכְלֵי עֹנֶג의 건축물·사치의 의미를 자연스럽게 반영합니다.
