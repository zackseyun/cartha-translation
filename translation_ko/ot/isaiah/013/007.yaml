translation:
  language: ko
  text: 그러므로 모든 손에 힘이 빠지고, 모든 사람의 마음이 녹을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱנוֹשׁ는 일반적으로 인간을 가리키며, “필멸자”로도 옮길 수 있습니다. 이 단어에는 흔히 인간의 연약함과 유한성의 뉘앙스가 담겨 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그리하여
  lexicon: HALOT
  rationale: 앞절의 심판 선언에서 나오는 결과를 나타내는 연결어이므로, 한국어에서도 간결하고 문맥에 맞는 인과·귀결 표현인 “그러므로”를 택했습니다.
- source_word: כָּל יָדַיִם
  english_pob_choice: all hands
  chosen_korean: 모든 손
  alternatives_korean:
  - 모든 손들
  - 각 사람의 손
  lexicon: HALOT
  rationale: 히브리어의 복수형 이미지를 살리면서도 한국어에서는 자연스럽게 집합적 표현으로 읽히도록 “모든 손”으로 옮겼습니다.
- source_word: תִּרְפֶּינָה
  english_pob_choice: will grow weak
  chosen_korean: 약해질 것입니다
  alternatives_korean:
  - 무력해질 것입니다
  - 축 늘어질 것입니다
  - 힘이 풀릴 것입니다
  lexicon: HALOT
  rationale: רפה의 핵심은 힘이 풀리고 약해지는 상태이므로, 현대 한국어에서 직관적인 “약해질 것입니다”가 원문의 신체적·비유적 약화를 함께 전달합니다.
- source_word: וְכָל לְבַב אֱנוֹשׁ
  english_pob_choice: and every human heart
  chosen_korean: 모든 인간의 마음
  alternatives_korean:
  - 모든 사람의 마음
  - 모든 사람의 심장
  - 모든 인간의 심장
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 남성만이 아니라 인간 일반을 가리키며 연약함의 뉘앙스를 가지므로, 성중립적이면서도 대표성을 지닌 “인간의 마음”으로 옮겼습니다.
- source_word: יִמָּס
  english_pob_choice: will melt
  chosen_korean: 녹을 것입니다
  alternatives_korean:
  - 녹아내릴 것입니다
  - 무너질 것입니다
  - 녹아 없어질 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘녹다’이므로, פחד/공포로 인한 심리적 붕괴의 이미지를 살리는 “녹을 것입니다”를 유지했습니다.
theological_decisions:
- issue: אֱנוֹשׁ의 일반적 인간 지시와 성중립성
  chosen_reading: 남성 특정이 아닌 인간 일반을 가리키는 표현으로 읽고 “인간의 마음”으로 번역했습니다.
  alternative_readings:
  - 모든 사람의 마음
  - 모든 남자의 마음
  - 모든 필멸자의 마음
  rationale: 본문은 특정 성별이 아니라 연약한 인간성 전체를 가리키므로, 남성 중심 어감을 피하면서도 ‘연약함’의 함의를 보존하는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy; gender-accurate human reference
