  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
  footnotes:
  - marker: a
    text: Or 'every man's heart' or 'every mortal heart.' The Hebrew אֱנוֹשׁ refers generically to a human being, often with an overtone of frailty.
