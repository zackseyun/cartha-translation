id: ISA.13.19
reference: Isaiah 13:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
  footnotes:
  - marker: a
    text: Or 'the glory of the Chaldeans’ majesty.' The Hebrew phrase can be taken more neutrally as Babylon’s magnificence rather than negatively as its pride.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론, 곧 왕국들의 아름다움이며 갈대아 사람들이 자랑하던 영광은 하나님께서 소돔과 고모라를 뒤엎으신 것 같이 되리라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들이 자랑하던 영광’은 ‘갈대아 사람들의 자랑의 영광’으로 직역할 수도 있습니다. 여기서 ‘자랑’에 해당하는 히브리어는 ‘위엄’이나 ‘장엄함’처럼 중립적인 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָבֶל
  english_pob_choice: Babylon
  chosen_korean: 바벨론
  alternatives_korean:
  - 바빌론
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 표기를 따르되, 원문 지명성을 분명히 유지했습니다.
- source_word: צְבִי מַמְלָכֹת
  english_pob_choice: the beauty of kingdoms
  chosen_korean: 왕국들의 아름다움
  alternatives_korean:
  - 나라들의 아름다움
  - 왕국의 아름다움
  lexicon: HALOT
  rationale: צְבִי는 ‘아름다움/아름다운 것’의 뜻이 있어, 직역적으로 ‘아름다움’으로 두고 복수 형태를 살려 ‘왕국들의’로 옮겼습니다.
- source_word: תִּפְאֶרֶת
  english_pob_choice: the splendor of
  chosen_korean: 영광이
  alternatives_korean:
  - 찬란함이
  - 아름다움이
  - 위엄이
  lexicon: HALOT
  rationale: תִּפְאֶרֶת는 ‘영광/찬란함/아름다움’을 뜻하므로, 앞의 ‘아름다움’과 구별되면서도 격조를 살리는 ‘영광’으로 옮겼습니다.
- source_word: גְּאוֹן כַּשְׂדִּים
  english_pob_choice: the Chaldeans’ pride
  chosen_korean: 갈대아 사람들의 자랑
  alternatives_korean:
  - 갈대아 사람들의 교만
  - 갈대아 사람들의 위엄
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 גְּאוֹן은 단순한 위엄보다 인간의 자만/자랑을 드러내므로, POB의 긴장을 살려 ‘자랑’으로 번역했습니다.
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  english_pob_choice: like God’s overthrow
  chosen_korean: 하나님이 … 뒤엎으신 것같이
  alternatives_korean:
  - 하나님이 … 무너뜨리신 것같이
  - 하나님께서 … 전복하신 것같이
  lexicon: HALOT
  rationale: מַהְפֵּכָה는 ‘뒤엎음/전복/파멸’의 뜻이므로, 한국어에서 자연스럽고 원의미를 살리는 ‘뒤엎으신’으로 옮겼습니다.
theological_decisions:
- issue: גְּאוֹן כַּשְׂדִּים의 평가적 뉘앙스
  chosen_reading: ‘자랑’으로 옮겨 심판 선언의 비판적 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 위엄
  - 영광
  - 교만
  rationale: 이 절은 바벨론의 찬란함을 말하면서 곧바로 멸망을 선고하므로, 중립적 ‘위엄’보다 자만이 섞인 ‘자랑’이 예언적 긴장을 더 잘 보존합니다.
  doctrine_reference: 예언서의 심판 수사에서 인간의 높아짐을 드러내는 표현은 완화하지 않고 유지합니다.
