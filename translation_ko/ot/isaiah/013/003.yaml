revisions:
- from: 내가 내 거룩하게 구별한 자들에게 명령하였고, 또한 내 분노를 이루도록 내 용사들을 불렀습니다. 그들은 내 높으심을 기뻐하며 크게 즐거워하는 자들입니다.[a]
  to: 내가 친히 내가 구별해 둔 자들에게 명령하였으며, 내 분노를 위하여 내 용사들을 불렀습니다. 곧 내 위엄을 기뻐하여 환호하는 자들입니다.[a]
  rationale: 명시된 독립 인칭대명사의 강조는 ‘내가 친히’로 살렸습니다. מְקֻדָּשַׁי는 심판을 수행하도록 하나님이 따로 세운 이들이라는 문맥을 반영하여 ‘내가 구별해 둔 자들’로 고쳤습니다. 마지막 난해한 구는 본문에서 ‘내 위엄’을 취하되, ‘자랑’ 및 ‘승리’의 가능한 뉘앙스를 각주에 남겨 중의성을 보존했습니다.
