  verdict: revise
  source_fidelity: 첫 절의 명령·소집 및 심판 목적은 대체로 잘 반영합니다. 그러나 ‘내 거룩하게 구별한 자들’은 히브리어의 1인칭 소유 접미사가 나타내는 관계를 한국어 문법상 정확히 표현하지 못합니다. 또한 마지막 구는 ‘내 용사들’을 수식하는 압축된 표현인데, 초안은 이를 별도 문장으로 처리하면서 연결을 다소 약화합니다.
  naturalness: ‘내 거룩하게 구별한 자들’은 현대 표준 한국어에서 비문에 가깝습니다. ‘내가 구별해 둔 자들’이 자연스럽고 문맥에도 맞습니다. 마지막 표현은 ‘내 위엄을 기뻐하며 즐거워하는’보다 ‘내 위엄을 기뻐하여 환호하는’이 중복을 줄이고 예언서의 격조를 유지합니다.
  terminology: ‘용사들’은 גִּבּוֹרַי에 적절합니다. לְאַפִּי는 심판 수행의 목적을 나타내므로 ‘내 분노를 위하여’가 원문의 압축성과 의미를 함께 보존합니다. מְקֻדָּשַׁי는 도덕적 성결을 단정하지 않도록 ‘구별해 둔 자들’로 옮깁니다. עַלִּיזֵי גַּאֲוָתִי는 해석상 난점이 있으므로 본문은 가능한 자연스러운 한 해석을 제시하고 대안은 각주로 보존합니다.
