id: ISA.13.3
reference: Isaiah 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
  footnotes:
  - marker: a
    text: Or, 'those who rejoice in my majesty' or 'those who exult in my triumph.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 친히 내가 구별해 둔 자들에게 명령하였으며, 내 분노를 위하여 내 용사들을 불렀습니다. 곧 내 위엄을 기뻐하여 환호하는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 자랑을 기뻐하여 환호하는 자들’ 또는 ‘내 승리를 기뻐하여 환호하는 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가
  alternatives_korean:
  - 나 자신이
  - 내가 직접
  lexicon: HALOT
  rationale: 히브리어 독립 인칭대명사의 강조를 한국어에서는 자연스러운 어순과 소유격 반복 없이 동사 앞 위치로 살렸습니다.
- source_word: לִמְקֻדָּשַׁי
  english_pob_choice: my consecrated ones
  chosen_korean: 내 거룩하게 구별한 자들
  alternatives_korean:
  - 내 성별된 자들
  - 내 거룩한 자들
  lexicon: HALOT
  rationale: 문맥상 도덕적 ‘거룩한 사람들’보다, 하나님이 목적을 위해 따로 세우신 대상이라는 기능적 의미가 더 분명하므로 ‘거룩하게 구별한’으로 옮겼습니다.
- source_word: גִּבּוֹרַי
  english_pob_choice: my warriors
  chosen_korean: 내 용사들
  alternatives_korean:
  - 내 강한 자들
  - 내 전사들
  lexicon: HALOT
  rationale: 군사적 맥락에서 גִּבּוֹר는 힘센 자 일반보다 전투를 수행하는 존재를 가리키므로 ‘용사들’이 가장 자연스럽고 정확합니다.
- source_word: לְאַפִּי
  english_pob_choice: for my anger
  chosen_korean: 내 분노를 이루도록
  alternatives_korean:
  - 내 노여움을 위해
  - 내 진노를 위해
  lexicon: HALOT
  rationale: לְ의 목적/방향성을 반영해 단순히 감정을 뜻하는 것이 아니라, 심판을 집행하는 목적을 드러내도록 풀어 옮겼습니다.
- source_word: עַלִּיזֵי גַּאֲוָתִי
  english_pob_choice: my proudly exulting ones
  chosen_korean: 내 높으심을 기뻐하며 크게 즐거워하는 자들
  alternatives_korean:
  - 내 위엄을 기뻐하는 자들
  - 내 승리를 즐거워하는 자들
  lexicon: HALOT
  rationale: 압축된 히브리어 표현의 중의성을 살리기 위해, 본문에는 ‘기뻐하며 크게 즐거워하는 자들’로 두고, 무엇을 기뻐하는지에 해당하는 뉘앙스는 ‘내 높으심’으로 표현했습니다.
theological_decisions:
- issue: ‘거룩하게 구별한 자들’의 성격
  chosen_reading: 도덕적으로 성인이라는 뜻이 아니라, 심판 수행을 위해 하나님이 구별해 세우신 대행자들로 읽습니다.
  alternative_readings:
  - 의로운 성도들
  - 천상적 거룩한 존재들
  rationale: 문맥이 바벨론을 향한 심판의 소집이므로, ‘거룩함’은 윤리적 평가보다 소명과 구별의 의미를 지닙니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עַלִּיזֵי גַּאֲוָתִי의 처리
  chosen_reading: ‘내 높으심을 기뻐하며 크게 즐거워하는 자들’로 본문에 두고, 하나님의 위엄/승리 기뻐함의 뉘앙스를 남깁니다.
  alternative_readings:
  - 내 위엄을 기뻐하는 자들
  - 내 승리를 크게 즐거워하는 자들
  rationale: 히브리어는 ‘기뻐하는 자들’과 ‘나의 גַּאֲוָה’의 관계가 압축되어 있어 단일 표현으로 고정하기보다, 한국어에서 자연스럽게 풀어 의미 폭을 보존했습니다.
  doctrine_reference: Translation philosophy §3
