    issue: 지명 ‘바벨’ 표기
    rationale: בָּבֶל의 한국어 통용 성경 표기는 ‘바빌론’입니다. ‘바벨’은 현대 독자에게 도시명으로 즉시 식별되지 않을 수 있고, 한국어 성경 명명 관습과의 일관성도 떨어집니다.
  - severity: medium
    issue: 인명 ‘암וץ’ 표기
    rationale: אָמוֹץ은 원어상 Amos와 별개의 이름이지만, 한국어 성경 전통에서 이사야의 아버지는 ‘아모스’로 표기됩니다. ‘암וץ’은 음역 원칙의 별도 정립 없이 도입하면 낯설고 기존 성경의 아모스와의 상호참조를 어렵게 합니다.
  - severity: low
    issue: 문장 구조
    rationale: ‘바벨에 관한 예언—…본 것입니다’보다 관계절을 선행시킨 문장이 자연스럽고, אֲשֶׁר가 예언을 수식한다는 원문의 관계도 더 분명히 드러냅니다.
  revised_text: 아모스의 아들 이사야가 본 바빌론에 관한 예언입니다.[a]
