  text: מַשָּׂ֖א בָּבֶ֑ל אֲשֶׁ֣ר חָזָ֔ה יְשַׁעְיָ֖הוּ בֶּן אָמֽוֹץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/001.yaml
  text: The oracle concerning Babylon[a], which Isaiah son of Amoz saw.
  footnotes:
  - marker: a
    text: Or 'The burden of Babylon' or 'The pronouncement against Babylon.' The Hebrew מַשָּׂא is a prophetic heading for a weighty message, often one of judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨에 관한 예언[a]—암וץ의 아들 이사야가 본 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨의 짐’ 혹은 ‘바벨을 향한 선포’입니다. 히브리어 מַשָּׂא는 무거운 예언적 말씀을 가리키는 표제로, 종종 심판의 성격을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 예언
  alternatives_korean:
  - 신탁
  - 경고
  - 무거운 말씀
  lexicon: HALOT
  rationale: 예언서 머리말에서 מַשָּׂא는 무게 있는 예언적 표제를 가리키므로, 한국어에서는 현대 독자가 이해하기 쉬운 ‘예언’으로 옮기되 오라클의 선언성을 유지했습니다.
- source_word: בָּבֶל
  english_pob_choice: Babylon
  chosen_korean: 바벨
  alternatives_korean:
  - 바빌론
  - 바벨론
  lexicon: HALOT
  rationale: 히브리어 지명 בָּבֶל을 원문에 더 가깝게 반영해 ‘바벨’로 옮겼습니다. 본문의 장 전체가 같은 지명을 가리키므로 간결한 표기가 적절합니다.
- source_word: חָזָה
  english_pob_choice: saw
  chosen_korean: 본 것입니다
  alternatives_korean:
  - 보았습니다
  - 환상으로 보았습니다
  lexicon: HALOT
  rationale: 예언적 시각 경험을 암시하되 원문의 일반 동사 ‘보다’를 과도하게 해석하지 않도록 ‘본 것입니다’로 옮겼습니다.
- source_word: בֶּן אָמֽוֹץ
  english_pob_choice: son of Amoz
  chosen_korean: 암וץ의 아들
  alternatives_korean:
  - 아모스의 아들
  - 아모츠의 아들
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 형태보다 원음에 가까운 음역을 우선해 ‘암וץ’로 옮겼습니다.
theological_decisions:
- issue: מַשָּׂא의 표제 기능과 심판 뉘앙스
  chosen_reading: 본문 첫어절을 ‘예언’으로 처리하고 각주로 대안 번역을 남겼습니다.
  alternative_readings:
  - 무거운 말씀
  - 선언
  - 바벨에 대한 경고
  rationale: 이 표제는 단순 제목이 아니라 예언적 무게를 가진 선언이므로, 본문은 읽기 쉬운 현대어로 두되 각주에서 심판 뉘앙스와 전통 번역 가능성을 보존했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; prophetic superscription as genre marker'
