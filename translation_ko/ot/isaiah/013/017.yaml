  source_fidelity: 히브리어의 주어, 메대인, 대적의 방향성, 그리고 은·금에 대한 무관심을 대체로 충실히 반영합니다. 다만 「그들 위에 일으키겠습니다」는 עֲלֵיהֶם의 적대적 용법을 한국어에서 부자연스럽고 다소 공간적으로 들리게 하므로, ‘그들에게 맞서’로 분명히 해야 합니다.
  naturalness: 「메대를 그들 위에 일으키겠습니다」는 현대 표준 한국어에서 어색합니다. 「메대 사람들을 그들에게 맞서 일으키겠습니다」는 공적이고 자연스러운 합쇼체 문장입니다. 「금을 바라지도 않습니다」는 חפץ의 ‘원하다/욕망하다’ 의미를 ‘좋아하다’보다 더 직접적으로 나타냅니다.
  terminology: מָדָי는 영토보다 민족을 가리키므로 「메대 사람들」로 옮겼습니다. 「귀하게 여기다」는 חשב의 ‘가치 있게 여기다’를 적절히 살립니다. חפץ에는 단순 호감보다 욕망·의지가 포함되므로 「바라다」를 사용했습니다.
