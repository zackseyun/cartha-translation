id: ISA.13.17
reference: Isaiah 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֛י מֵעִ֥יר עֲלֵי/הֶ֖ם אֶת מָדָ֑י אֲשֶׁר כֶּ֨סֶף֙ לֹ֣א יַחְשֹׁ֔בוּ וְ/זָהָ֖ב לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/017.yaml
  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
  footnotes:
  - marker: a
    text: Or 'do not regard silver' and 'do not desire gold.' The Hebrew emphasizes that the Medes are not motivated by payment or attracted by wealth.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 메대를 그들 위에 일으키겠습니다. 그들은 은을 귀하게 여기지 않고, 금을 좋아하지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「은을 귀하게 여기지」, 「금을 바라지」로도 옮길 수 있습니다. 히브리어는 메대인이 보상이나 재물에 끌리지 않는다는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 주목하십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 감탄사로서, 현대 합쇼체에서는 「보십시오」가 명령형적 호소와 공적인 선언의 힘을 함께 살립니다.
- source_word: מֵעִיר עֲלֵיהֶם
  english_pob_choice: I am stirring up against them
  chosen_korean: 그들 위에 일으키겠습니다
  alternatives_korean:
  - 그들에 맞서 일으키겠습니다
  - 그들 위로 깨우겠습니다
  lexicon: HALOT
  rationale: עור의 사역형은 단순한 ‘움직이다’보다 어떤 민족을 행동하게 하시는 의미이므로, 군사적 문맥을 살려 「일으키겠습니다」로 옮겼습니다.
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ וְזָהָב לֹא יַחְפְּצוּ בוֹ
  english_pob_choice: do not value silver and do not delight in gold
  chosen_korean: 은을 귀하게 여기지 않고, 금을 좋아하지도 않습니다
  alternatives_korean:
  - 은을 가치 있게 여기지 않고, 금을 탐하지도 않습니다
  - 은을 계산하지 않고, 금을 바라지 않습니다
  lexicon: HALOT
  rationale: חשב는 단순한 ‘생각하다’가 아니라 값어치를 두고 평가하다의 뜻이므로 「귀하게 여기다」로, חפץ는 욕망/호의의 뉘앙스를 살려 「좋아하다」로 옮겼습니다.
theological_decisions:
- issue: 하나님께서 메대인을 도구로 ‘일으키시는’ 표현의 힘
  chosen_reading: 하나님이 역사 속에서 한 민족을 심판의 도구로 동원하시는 적극적 주권을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 하나님이 메대인을 보내십니다
  - 하나님이 메대인을 일으키십니다
  rationale: 본문의 사역형 동사는 단순한 허용보다 능동적 개입을 가리키므로, 주권적 심판 선언의 강도를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 섭리와 심판 주권
