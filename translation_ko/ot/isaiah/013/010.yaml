    rationale: 원문의 히필은 ‘빛나게 하다/비추다’의 의미이나, 달을 주어로 하는 한국어에서는 ‘그 빛을 비추지 않다’가 자연스럽게 그 뜻을 전달합니다.
  - severity: low
