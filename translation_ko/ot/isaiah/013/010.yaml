id: ISA.13.10
reference: Isaiah 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
  footnotes:
  - marker: a
    text: Or, 'and their Orions.' The Hebrew term can refer specifically to Orion, but here may function more broadly for the constellations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하늘의 별들과 그들의 별자리들이 자기들의 빛을 비추지 못할 것이며, 해는 떠오를 때에 어두워지고, 달은 자기 빛을 비추게 하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 별자리들’은 히브리어 כְּסִילִים의 넓은 의미를 따른 번역입니다. 특정 별자리인 ‘오리온’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כוֹכְבֵי הַשָּׁמַיִם
  english_pob_choice: the stars of the heavens
  chosen_korean: 하늘의 별들
  alternatives_korean:
  - 하늘의 별들
  - 하늘에 있는 별들
  lexicon: HALOT
  rationale: 히브리어의 관형격 구조를 자연스러운 한국어로 옮기되, 하늘의 장엄한 시적 분위기를 유지했습니다.
- source_word: וּכְסִילֵיהֶם
  english_pob_choice: and their constellations
  chosen_korean: 그들의 별자리들
  alternatives_korean:
  - 그들의 오리온들
  - 그들의 오리온자리들
  lexicon: HALOT
  rationale: כְּסִיל이 특정 별자리 오리온을 가리킬 수 있지만, 여기서는 복수형과 3인칭 소유격을 살려 더 넓은 의미의 별자리들로 옮겼습니다.
- source_word: לֹא יָהֵלּוּ אוֹרָם
  english_pob_choice: will not give their light
  chosen_korean: 자기들의 빛을 비추지 못할 것입니다
  alternatives_korean:
  - 자기들의 빛을 내지 못할 것입니다
  - 자기들의 빛을 비추지 못합니다
  lexicon: HALOT
  rationale: 히필의 ‘비추게 하다/빛나게 하다’ 의미를 살려, 단순히 ‘빛나지 않는다’보다 원인의 뉘앙스를 드러냈습니다.
- source_word: בְּצֵאתוֹ
  english_pob_choice: at its rising
  chosen_korean: 떠오를 때에
  alternatives_korean:
  - 떠오를 때
  - 솟아오를 때에
  lexicon: HALOT
  rationale: 직역적 ‘나갈 때’보다 일출 관용 표현인 ‘떠오를 때에’가 문맥상 가장 자연스럽습니다.
- source_word: לֹא יַגִּיהַ אוֹרֽוֹ
  english_pob_choice: will not make its light shine
  chosen_korean: 자기 빛을 비추게 하지 못할 것입니다
  alternatives_korean:
  - 자기 빛을 빛나게 하지 못할 것입니다
  - 자기 빛을 비추지 못할 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 ‘비추게 하다’로 옮겼습니다. 영어 POB의 ‘make its light shine’도 같은 방향의 해석입니다.
theological_decisions:
- issue: 우주적 어둠의 성격
  chosen_reading: 본문의 우주적 어둠 이미지를 그대로 살리고, 문자적 천문 붕괴인지 상징적 심판 언어인지 번역문에서 결정하지 않았습니다.
  alternative_readings:
  - 문자적인 우주적 붕괴
  - 정치적·역사적 몰락을 가리키는 예언적 상징
  rationale: 예언서의 심판 수사학이 지닌 긴장을 보존하는 것이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
