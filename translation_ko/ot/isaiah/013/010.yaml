  source_fidelity: 원문의 미래적 심판 묘사와 우주적 어둠의 이미지는 대체로 보존되었습니다. 다만 ‘못할 것입니다’는 본문의 단순한 부정 미래를 능력·불능의 뜻으로 바꿀 수 있고, 각주 표지는 해당 어휘인 ‘별자리들’에 붙는 편이 적절합니다.
  naturalness: ‘자기들의 빛을 비추지 못할 것입니다’와 ‘자기 빛을 비추게 하지 못할 것입니다’는 한국어에서 다소 부자연스럽고 불필요하게 사역성을 겹칩니다. ‘빛을 내지 않을 것입니다’와 ‘그 빛을 비추지 않을 것입니다’가 현대 표준 한국어의 예언적 문체에 더 자연스럽습니다.
