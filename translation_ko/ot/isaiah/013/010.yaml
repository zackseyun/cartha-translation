  to: 이는 하늘의 별들과 그 별자리들이[a] 빛을 내지 않을 것이며, 해는 떠오를 때에 어두워지고, 달은 그 빛을 비추지 않을 것입니다.
  rationale: 단순 부정 미래를 ‘않을 것입니다’로 옮겨 원문의 심판 선언을 보존하고, 한국어에서 부자연스러운 재귀·사역 구성을 다듬었습니다. 해의 ‘어두워지고’는 히브리어 완료형이 예언적 묘사에서 나타내는 생생한 상태를 자연스럽게 유지합니다. כְּסִילֵיהֶם의 오리온/별자리 사이의 어휘적 불확실성은 각주에서만 밝혀 본문에 특정 해석을 강요하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:19Z'
