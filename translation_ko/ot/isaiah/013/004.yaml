- from: 산들에 있는 무리의 소리여[a] — 큰 백성의 소리와 같으며, 나라들의 소란[b], 곧 함께 모여드는 민족들의 소리라! 만군의 야훼께서 전쟁을 위해 군대를 소집하고 계십니다.
  to: 산들에 있는 무리의 소리[a], 큰 백성의 소리 같은 소리입니다! 함께 모여 있는 민족들, 곧 왕국들의 소란 소리[b]입니다! 만군의 야훼께서 전쟁을 위해 군대를 소집하십니다.
  rationale: The revision removes the unsupported vocative, makes the Hebrew’s parallel sound descriptions readable in modern formal Korean, and explicitly preserves the appositional accumulation of nations and kingdoms. It retains the supplied lexical alternatives at their proper anchors and does not resolve beyond the source the syntactically compressed relation between ‘kingdoms’ and ‘nations.’
