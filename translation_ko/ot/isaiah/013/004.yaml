id: ISA.13.4
reference: Isaiah 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
  footnotes:
  - marker: a
    text: Or 'The sound of a multitude on the mountains.'
    reason: lexical_alternative
  - marker: b
    text: Or 'The sound of a tumult of kingdoms, of nations assembling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산들에 있는 무리의 소리[a], 큰 백성의 소리 같은 소리입니다! 함께 모여 있는 민족들, 곧 왕국들의 소란 소리[b]입니다! 만군의 야훼께서 전쟁을 위해 군대를 소집하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들 위의 무리의 소리’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕국들의 소란, 곧 모여드는 민족들의 소리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  english_pob_choice: The sound of
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 소리
  lexicon: HALOT
  rationale: 이 문맥은 발화가 아니라 전쟁 전야의 청각적 장면이므로, ‘소리’가 קוֹל의 기본 의미를 자연스럽게 살립니다.
- source_word: בֶּֽ/הָרִ֖ים
  english_pob_choice: in the mountains
  chosen_korean: 산들에 있는
  alternatives_korean:
  - 산들 위에 있는
  - 산들에서 나는
  - 산들에 있는
  lexicon: HALOT
  rationale: 전치사 ב는 위치를 나타내므로 ‘산들에 있는’이 가장 직접적이며, POB의 주석적 대안 ‘on the mountains’도 과장 없이 반영합니다.
- source_word: מַמְלְכ֤וֹת גּוֹיִם֙
  english_pob_choice: of kingdoms, of nations
  chosen_korean: 나라들의 소란
  alternatives_korean:
  - 왕국들의 소란
  - 나라들의 소란
  - 민족들의 왕국들
  lexicon: HALOT
  rationale: 여기서는 정치적 실체들이 겹겹이 쌓인 군중의 소란을 드러내므로, ‘나라들’과 ‘소란’을 함께 살려 왕국·민족의 중첩된 울림을 표현했습니다.
- source_word: נֶֽאֱסָפִ֔ים
  english_pob_choice: gathered together
  chosen_korean: 함께 모여드는
  alternatives_korean:
  - 모여진
  - 집결한
  - 함께 모여드는
  lexicon: HALOT
  rationale: 니팔 분사는 단순 완료보다 진행 중인 집결의 뉘앙스를 띠므로, ‘함께 모여드는’으로 군사적 집결의 움직임을 살렸습니다.
- source_word: יְהוָ֣ה צְבָא֔וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 야훼
  - 야훼 만군의 주
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: 예배적 관용구를 유지하되, 신적 이름 יְהוָה는 본문 규정대로 ‘야훼’로 옮겼습니다.
- source_word: מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה
  english_pob_choice: is mustering an army for battle
  chosen_korean: 전쟁을 위해 군대를 소집하고 계십니다
  alternatives_korean:
  - 전쟁을 위해 군대를 소집하고 계십니다
  - 전투를 위해 군대를 소집하고 계십니다
  - 전쟁을 위해 군대를 점검하고 계십니다
  lexicon: HALOT
  rationale: פקד는 ‘점검하다’까지 포괄하지만, צבא מלחמה와 결합할 때는 군사적 동원/소집이 핵심이므로 ‘소집하다’가 가장 적절합니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - the LORD
  rationale: 본문의 신명적 이름을 제목어로 바꾸지 않고 고유명사로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
