  lexicon: HALOT
  rationale: 히브리어 관용구의 '목소리를 높이다'라는 이미지를 살리면서도, 한국어에서는 자연스러운 동사구로 풀어 전달했습니다.
- source_word: הָנִיפוּ יָד
  english_pob_choice: wave the hand
  chosen_korean: 손을 흔들어
  alternatives_korean:
