  lexicon: HALOT
  rationale: 호소나 호출의 몸짓이라는 구체적 동작을 유지하되, 한국어에서 가장 간명한 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 목적/결과 관계
  chosen_reading: 손짓과 호칭의 목적을 살려 '그들이 ... 들어오게 하십시오'로 옮겼습니다.
  alternative_readings:
  - 그들이 ... 들어오도록
  - 그들이 ... 들어오게 하라
  rationale: 연속된 명령 뒤의 וְיָבֹאוּ는 단순 서술보다 목적·결과의 뉘앙스가 강하므로, 한국어에서도 소집 동작의 목적이 드러나게 했습니다.
  doctrine_reference: 본문의 시적-군사적 문맥 해석
