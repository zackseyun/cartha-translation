  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
  footnotes:
  - marker: a
    text: Or 'banner' or 'standard' for 'signal.' The Hebrew נֵס often denotes a raised military sign or rallying marker.
    reason: lexical_alternative
  - marker: b
    text: Or 'beckon with the hand.' The gesture likely functions as a summons to the attacking force.
    reason: lexical_alternative
  - marker: c
    text: Or 'the gates of the princes.' The Hebrew נְדִיבִים can denote nobles, princes, or other prominent leaders.
    reason: lexical_alternative
translation:
  language: ko
  text: 맨발의 산 위에 깃발을 세우고[a] 소리를 높여 그들에게 외치며, 손을 흔들어[b] 그들이 귀족들의 성문으로 들어오게 하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '표준'으로도 옮길 수 있습니다. 히브리어 נֵס는 높이 든 군사적 표지나 집결 신호를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '손으로 손짓하여.' 이 몸짓은 공격군을 부르는 소집 동작으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '귀족들의 성문들.' 히브리어 נְדִיבִים는 귀족, 제후, 유력자를 가리킬 수 있습니다.
    reason: lexical_alternative
