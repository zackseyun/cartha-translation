id: ISA.13.18
reference: Isaiah 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/קְשָׁת֖וֹת נְעָרִ֣ים תְּרַטַּ֑שְׁנָה וּ/פְרִי בֶ֨טֶן֙ לֹ֣א יְרַחֵ֔מוּ עַל בָּנִ֖ים לֹֽא תָח֥וּס עֵינָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
  footnotes:
  - marker: a
    text: Or 'their bows will shatter the young men'; some take 'bows' metonymically as 'bowmen/archers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons'; here likely used in the broader sense of 'children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 활은 젊은이들을 산산이 부술 것이며[a], 태(胎)의 열매에 대해서는 불쌍히 여기지 않을 것이고[b], 그들의 눈은 자녀를 아끼지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘젊은이들’을 ‘산산이 부수다’입니다. 일부는 ‘활’이 아니라 ‘궁수들’로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘태의 열매’입니다. 여기서는 더 넓게 ‘자녀/태어난 아이들’을 가리키는 표현으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  english_pob_choice: bows
  chosen_korean: 활
  alternatives_korean:
  - 활들
  - 궁시
  lexicon: HALOT
  rationale: 활이라는 기본 뜻을 그대로 살렸습니다. 본문은 무기 자체를 주어로 삼아 파괴의 도구성을 강조하므로, 보병이나 궁수로 풀어 쓰지 않았습니다.
- source_word: תְּרַטַּשְׁנָה
  english_pob_choice: will dash ... to pieces
  chosen_korean: 산산이 부술 것이며
  alternatives_korean:
  - 산산조각낼 것이며
  - 부숴 버릴 것이며
  lexicon: HALOT
  rationale: רטש의 폭력적 의미를 따라 단순히 '죽이다'로 약화하지 않고, 파괴의 강도를 드러내는 표현을 택했습니다.
- source_word: פְרִי בֶטֶן
  english_pob_choice: the fruit of the womb
  chosen_korean: 태(胎)의 열매
  alternatives_korean:
  - 자궁의 열매
  - 태의 소출
  - 아이들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 옮겨, 무자비함의 대상이 태중의 생명까지 미치는 점을 보존했습니다.
- source_word: בָּנִים
  english_pob_choice: children
  chosen_korean: 자녀
  alternatives_korean:
  - 아들들
  - 아이들
  lexicon: HALOT
  rationale: 형식상 '아들들'이지만, 앞의 '태의 열매'와 평행을 이루는 일반적 후손/아이의 뜻으로 쓰였으므로 더 넓은 '자녀'를 택했습니다.
theological_decisions:
- issue: 「눈」을 단수 이미지로 살릴지 복수로 자연화할지
  chosen_reading: 그들의 눈은 자녀를 아끼지 않을 것입니다
  alternative_readings:
  - 그들의 눈은 자녀를 불쌍히 여기지 않을 것입니다
  - 그들의 눈은 자녀를 사하지 않을 것입니다
  rationale: 히브리어는 '눈'을 집합적으로 써서 무자비한 시선을 인격화합니다. 한국어에서는 자연스러운 복수 주어로 옮기되, '아끼지'로 חוס의 냉혹함을 유지했습니다.
  doctrine_reference: 시적 심판 묘사의 의인법 처리
