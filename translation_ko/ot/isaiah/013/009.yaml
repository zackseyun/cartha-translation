id: ISA.13.9
reference: Isaiah 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
  footnotes:
  - marker: a
    text: Or, 'the day of Yahweh.' The Hebrew reads 'day of YHWH'; this translation follows the project's standard rendering 'the LORD' for the divine name.
    reason: alternative_reading
  - marker: b
    text: Or, 'and fury and burning anger.' The Hebrew piles up multiple terms for divine anger.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the land' instead of 'the earth.' The Hebrew אֶרֶץ can mean either, but the broader context favors 'earth.'
    reason: lexical_alternative
  - marker: d
    text: The subject could also be understood as 'it'—that is, the day of the LORD will destroy its sinners from it.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 야훼의 날이 오고 있습니다. 그것은 잔혹하며, 진노와 타오르는 분노가 가득하여 땅을 황폐하게 하고, 그 땅의 죄인들을 거기에서 멸망시키실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “야훼의 날”입니다. 본문은 예언서의 관용구를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 선포의 지시성과 경고성을 살리면서도 현대 한국어에서 자연스럽고 공손한 호소로 옮겼습니다.
- source_word: יוֹם יְהוָה
  english_pob_choice: the day of Yahweh / the day of the LORD
  chosen_korean: 야훼의 날
  alternatives_korean:
  - 여호와의 날
  - 주님의 날
  lexicon: HALOT
  rationale: 본문의 신명칭을 프로젝트 기본값에 따라 야훼로 옮겨, 예언서의 관용구를 직접적으로 드러냈습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth / the land
  chosen_korean: 땅
  alternatives_korean:
  - 온 땅
  - 땅
  lexicon: HALOT
  rationale: 문맥상 심판의 대상이 되는 עולם/지면의 범위를 자연스럽게 나타내는 말로 '땅'을 택했고, '황폐하게 하다'와도 잘 결합됩니다.
- source_word: וְחַטָּאֶיהָ יַשְׁמִיד מִמֶּנָּה
  english_pob_choice: he will destroy its sinners from it
  chosen_korean: 그 땅의 죄인들을 거기에서 멸망시키실 것입니다
  alternatives_korean:
  - 그 땅의 죄인들을 그 가운데서 멸하실 것입니다
  - 그 죄인들을 땅에서 없애실 것입니다
  lexicon: HALOT
  rationale: 히필 שׁמד의 강한 멸절 의미를 살리되, 한국어에서 어색한 목적어-전치사 결합을 피하고 대상과 근원을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 날의 주체와 심판 행위
  chosen_reading: 날 자체가 독립적으로 행동하는 것이 아니라, 야훼의 심판이 그 날을 통해 임한다는 의미를 드러내기 위해 종결을 수동적·서술적으로 처리했습니다.
  alternative_readings:
  - 그 날이 스스로 죄인들을 멸망시킨다
  - 야훼께서 그 날에 죄인들을 멸하신다
  rationale: 히브리어는 예언적 관용구로 심판의 임박성과 확실성을 강조합니다. 한국어에서는 원문의 긴박함을 유지하면서도 주어-행위 관계를 흐리지 않도록 조정했습니다.
  doctrine_reference: 예언서의 '여호와의 날' 전승과 신적 심판 주권
