  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
  footnotes:
  - marker: a
    text: Or 'I will make man more precious than fine gold.' The Hebrew verb can emphasize preciousness/value; in context this likely implies extreme scarcity.
