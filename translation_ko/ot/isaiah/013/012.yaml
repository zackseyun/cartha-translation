translation:
  language: ko
  text: 내가 사람을 순금보다 더 드물게 만들고, 인류를 오빌의 금보다 더 드물게 만들겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람을 순금보다 더 귀하게, 인류를 오빌의 금보다 더 값지게 만들겠습니다.” 히브리어 동사는 귀중함이나 가치를 강조할 수도 있으나, 이 문맥에서는 극심한 희소성을 뜻하는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹקִיר
  english_pob_choice: I will make rarer
  chosen_korean: 더 드물게 만들겠습니다
  alternatives_korean:
  - 더 귀하게 여기겠습니다
  - 더 귀중하게 만들겠습니다
  lexicon: HALOT
  rationale: 히필형 יקר는 ‘귀하게 여기다’의 뜻도 가능하지만, 여기서는 심판 문맥과 금과의 비교가 함께 있어 결과적으로 ‘드물어지게 하다’는 의미가 가장 자연스럽습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: mortal man
  chosen_korean: 사람
  alternatives_korean:
  - 죽을 사람
  - 유한한 사람
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 인간의 연약함과 유한성을 강조하지만, 한국어에서는 첫 절의 병렬성과 운율을 살리기 위해 간결한 ‘사람’으로 옮기되, 심판으로 인한 소멸성은 문맥이 드러내게 했습니다.
- source_word: וְאָדָם
  english_pob_choice: and mankind
  chosen_korean: 인류
  alternatives_korean:
  - 사람
  - 인간들
  lexicon: HALOT
  rationale: אָדָם은 여기서 개별 남성이 아니라 집합적 인간성을 가리키므로, 성별을 특정하지 않는 집합명사 ‘인류’가 병렬 구조를 가장 잘 살립니다.
- source_word: מִפָּז / מִכֶּתֶם אוֹפִיר
  english_pob_choice: than fine gold / than the gold of Ophir
  chosen_korean: 순금보다, 오빌의 금보다
  alternatives_korean:
  - 정금보다, 오빌의 금보다
  - 정제된 금보다, 오빌의 금보다
  lexicon: HALOT
  rationale: פָּז와 כֶּתֶם은 고급 금속을 가리키므로 한국어에서는 통용되는 ‘순금’과 ‘오빌의 금’으로 옮겨 귀중성과 지리적 암시를 함께 보존했습니다.
theological_decisions:
- issue: 비교의 방향이 가치가 아니라 희소성으로 읽히는지 여부
  chosen_reading: ‘더 드물게’로 옮겨 심판 아래서 사람의 희소성을 드러냈습니다.
  alternative_readings:
  - ‘더 귀하게’
  - ‘더 값지게’
  rationale: 영어 POB도 이 절의 실제 효과를 ‘extreme scarcity’로 설명하며, 문맥상 판단 선언 안에서 사람의 수가 금보다 줄어드는 의미가 핵심이므로 희소성 표현을 채택했습니다.
  doctrine_reference: POB translation note on lexical range; Isaiah 13 judgment context
