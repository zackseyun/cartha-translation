id: ISA.32.16
reference: Isaiah 32:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁכַ֥ן בַּ/מִּדְבָּ֖ר מִשְׁפָּ֑ט וּ/צְדָקָ֖ה בַּ/כַּרְמֶ֥ל תֵּשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/016.yaml
  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
  footnotes:
  - marker: a
    text: Or 'in Carmel.' The Hebrew karmel can refer either to fertile cultivated land or, in some contexts, the region/name Carmel.
    reason: lexical_alternative
  - marker: b
    text: Or 'righteousness will dwell/remain.' The verb literally means 'sit,' but in context it conveys settled residence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 정의가 광야에 거하고, 의가 열매 맺는 밭에[a] 머물 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '갈멜에.' 히브리어 karmel은 비옥한 경작지 일반을 가리킬 수도 있고, 어떤 문맥에서는 갈멜이라는 지명이나 지역을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '앉을 것입니다.' 동사는 문자적으로는 '앉다'를 뜻하지만, 문맥에서는 안정적으로 거처를 잡는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁכַ֥ן
  english_pob_choice: Then ... will dwell
  chosen_korean: 그러면 ... 거할 것입니다
  alternatives_korean:
  - 그리고 ... 거할 것입니다
  - 그리고 ... 머물 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스러운 한국어로 풀어 쓰되, 이어지는 결과를 드러내기 위해 '그러면'을 사용했습니다. '거하다'는 בַּמִּדְבָּר와의 어울림을 살리면서도 지속적 임재를 나타냅니다.
- source_word: בַּ/מִּדְבָּ֖ר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에
  alternatives_korean:
  - 사막에
  - 들판에
  lexicon: HALOT
  rationale: 이사야 문맥에서 מִדְבָּר는 단순한 사막보다 황무지/광야의 대비를 살리는 말이므로 '광야'가 가장 적절합니다.
- source_word: מִשְׁפָּ֑ט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 공의
  lexicon: HALOT
  rationale: 여기서는 판결 행위보다 바로 세워진 질서를 가리키므로 '정의'가 자연스럽습니다. 한국어에서 '공의'보다 현대적이면서도 의미를 좁히지 않습니다.
- source_word: וּ/צְדָקָ֖ה
  english_pob_choice: and righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: מִשְׁפָּט와 구별되는 평행성을 유지하기 위해 두 번째 항은 '의'로 옮겼습니다. 둘을 모두 '정의'로 하면 히브리어의 대구가 약화됩니다.
- source_word: בַּ/כַּרְמֶ֥ל
  english_pob_choice: in the fruitful field
  chosen_korean: 열매 맺는 밭에
  alternatives_korean:
  - 가르멜에
  - 비옥한 땅에
  - 기름진 들에
  lexicon: HALOT
  rationale: כַּרְמֶל은 고유명사 '갈멜'이 아니라 비옥하고 경작된 땅을 가리킬 수 있으므로, 광야와 대조되는 생산성의 이미지를 살려 '열매 맺는 밭'으로 옮겼습니다.
- source_word: תֵּשֵֽׁב
  english_pob_choice: will abide
  chosen_korean: 머물 것입니다
  alternatives_korean:
  - 앉을 것입니다
  - 거할 것입니다
  lexicon: HALOT
  rationale: 직역하면 '앉다'이지만 여기서는 의를 인격화하여 안정적으로 자리 잡는 모습을 나타냅니다. 한국어에서는 '머물다'가 그 뉘앙스를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: מִשְׁפָּט / צְדָקָה의 구분을 한국어에서 어떻게 보존할 것인가
  chosen_reading: '''정의''와 ''의''로 나누어 번역했습니다.'
  alternative_readings:
  - 둘 다 '공의'로 통일
  - 둘 다 '정의'로 통일
  rationale: 예언 시의 병행구조에서 두 낱말은 관련되지만 동일하지 않습니다. 구분을 유지해야 광야와 비옥한 땅에 각각 임하는 질서와 올바름의 대비가 살아납니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
