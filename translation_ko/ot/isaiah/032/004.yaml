revisions:
- from: 서두르는 자의 마음은 지식을 깨닫게 되고, 더듬는 자의 혀는 분명하게 말하기를 서두르게 됩니다.
  to: 성급한 이들의 마음은 깨달아 알게 될 것이며, 말더듬는 이들의 혀는 재빨리 또렷하게 말할 것입니다.
  rationale: 원문의 인식과 발화에 관한 병행 구조 및 미래적 전망을 유지하면서, 한국어에서 부자연스러운 ‘말하기를 서두르게 됩니다’를 자연스러운 서술로 고쳤습니다. ‘성급한’은 נִמְהָרִים의 충동적 뉘앙스를, ‘재빨리 또렷하게’는 תְּמַהֵר와 צָחוֹת의 신속성과 명료성을 함께 반영합니다.
