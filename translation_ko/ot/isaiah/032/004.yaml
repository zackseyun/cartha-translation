id: ISA.32.4
reference: Isaiah 32:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְבַ֥ב נִמְהָרִ֖ים יָבִ֣ין לָ/דָ֑עַת וּ/לְשׁ֣וֹן עִלְּגִ֔ים תְּמַהֵ֖ר לְ/דַבֵּ֥ר צָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/004.yaml
  text: The heart of the hasty will understand knowledge[b][a], and the tongue of stammerers will hasten to speak clearly.
  footnotes:
  - marker: a
    text: Or 'the rash' instead of 'the hasty.' The Hebrew describes those who are impulsive or quick in judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be quick to speak plainly/distinctly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서두르는 자의 마음은 지식을 깨닫게 되고, 더듬는 자의 혀는 분명하게 말하기를 서두르게 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַב נִמְהָרִים
  english_pob_choice: The heart of the hasty
  chosen_korean: 서두르는 자의 마음
  alternatives_korean:
  - 급한 자의 마음
  - 성급한 자의 마음
  - 경솔한 자의 마음
  lexicon: HALOT
  rationale: נִמְהָרִים는 단순한 속도보다 성급함·재촉됨의 뉘앙스를 가지므로, ‘서두르는 자’로 옮겨 원문의 인격화된 표현과 동사를 살렸습니다. לְבַב은 히브리어의 내적 인식 중심을 가리키므로 ‘마음’이 가장 직접적입니다.
- source_word: יָבִין לָדַעַת
  english_pob_choice: will understand knowledge
  chosen_korean: 지식을 깨닫게 되고
  alternatives_korean:
  - 지식을 이해하게 되고
  - 지식을 알게 되고
  - 지식을 분별하게 되고
  lexicon: HALOT
  rationale: יָבִין은 단순 지적 인식보다 ‘깨닫다/이해하다’에 가깝고, לָדַעַת은 여기서 이해의 대상이 되는 인식 내용이므로 ‘지식을 깨닫게’로 자연스럽게 연결했습니다.
- source_word: לְשׁוֹן עִלְּגִים
  english_pob_choice: the tongue of stammerers
  chosen_korean: 더듬는 자의 혀
  alternatives_korean:
  - 말더듬는 자의 혀
  - 더듬는 이들의 혀
  - 말이 어눌한 자의 혀
  lexicon: HALOT
  rationale: עִלְּגִים은 발화 장애가 있는 사람들을 가리키므로, 한국어에서는 ‘더듬는 자’가 이미지와 의미를 함께 살립니다. לְשׁוֹן은 문자적인 ‘혀’로 옮겨 앞 절의 ‘마음’과 평행을 유지했습니다.
- source_word: תְּמַהֵר לְדַבֵּר צָחוֹת
  english_pob_choice: will hasten to speak clearly
  chosen_korean: 분명하게 말하기를 서두르게 됩니다
  alternatives_korean:
  - 분명하게 말하게 됩니다
  - 분명히 말하기를 서두르게 됩니다
  - 또렷하게 말하기를 서두르게 됩니다
  lexicon: HALOT
  rationale: תְּמַהֵר은 ‘빨리/서두르다’의 동작성을 살려 ‘서두르게 됩니다’로 옮겼고, צָחוֹת은 ‘분명하게’로 처리해 더듬는 말과의 대비를 드러냈습니다. 직역식 ‘빨리 말하다’보다 한국어에서 문학적 평행과 의미가 더 분명합니다.
theological_decisions:
- issue: 지혜의 회복이 도덕적·인지적 전환으로 제시되는 방식
  chosen_reading: 이 구절은 성급함과 발화 장애가 단지 언어 능력의 문제가 아니라, 인식과 말의 회복을 가리키는 상징적 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 능숙함의 회복
  - 물리적 말더듬의 치유만을 가리키는 읽기
  rationale: 문맥상 메시아적/종말론적 의의가 암시되더라도, 본문 자체는 마음이 깨닫고 혀가 분명히 말하는 대조를 통해 내적·외적 회복을 함께 말합니다.
  doctrine_reference: 사 32:1-4의 통치와 의의 회복 문맥
- issue: ‘혀’의 문자성과 비유성
  chosen_reading: ‘혀’는 문자적으로 유지하되, 한국어 독자가 의사소통 능력 전체를 함께 읽도록 했습니다.
  alternative_readings:
  - ‘말’로 완화하는 읽기
  - ‘언어’로 추상화하는 읽기
  rationale: 원문은 גוף의 부분을 써서 전체 기능을 지시하는 시적 표현이므로, 문자적 이미지를 보존하는 편이 원문의 힘을 잘 전달합니다.
  doctrine_reference: 히브리 시가의 평행법과 신체 은유
