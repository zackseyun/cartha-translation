id: ISA.32.7
reference: Isaiah 32:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
  footnotes:
  - marker: a
    text: Or 'tools,' 'instruments,' or 'weapons' for 'devices'; the Hebrew term can denote implements literally and methods metaphorically.
    reason: lexical_alternative
  - marker: b
    text: Or 'the afflicted' or 'the meek' for 'the humble.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''and when the poor man speaks justice/judgment''; the sense may be that the rogue opposes the poor even when the poor person’s case is just.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 자의 기물은 악합니다[a]. 그는 가난한 사람을 거짓말하는 말로 무너뜨리려고 계략을 꾸미며[c][b], 가난한 사람이 옳은 말을 해도 그러합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기물’은 כאן כלי의 문자적 의미(도구, 기구, 수단)를 넓게 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ענוים는 여기서 ‘겸손한 사람’보다 약자·곤궁한 사람의 뉘앙스로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 문자적으로는 ‘가난한 사람이 정의/판결을 말할 때’에 해당하며, 문맥상 그의 정당한 주장을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  english_pob_choice: devices
  chosen_korean: 기물
  alternatives_korean:
  - 도구
  - 수단
  - 장치
  - 무기
  lexicon: HALOT
  rationale: 문맥상 물리적 도구보다 악한 의도와 수법을 가리키므로, 기계적 물건을 뜻할 수도 있는 어감을 살리면서도 비유적 의미를 담을 수 있는 ‘기물’을 택했습니다.
- source_word: רָעִים
  english_pob_choice: evil
  chosen_korean: 악합니다
  alternatives_korean:
  - 나쁩니다
  - 사악합니다
  - 해롭습니다
  lexicon: HALOT
  rationale: 예언서의 도덕적 규탄을 반영해 단순한 ‘나쁨’보다 강한 도덕 판단을 드러내는 표현으로 옮겼습니다.
- source_word: לְחַבֵּל ענוים בְּאִמְרֵי שֶׁקֶר
  english_pob_choice: to ruin the humble with lying words
  chosen_korean: 가난한 사람을 거짓말하는 말로 무너뜨리려고
  alternatives_korean:
  - 겸손한 사람을 거짓말하는 말로 망하게 하려고
  - 온유한 사람을 거짓말하는 말로 해치려고
  - 괴로운 이를 거짓말로 무너뜨리려고
  lexicon: HALOT
  rationale: לְחַבֵּל의 파괴적 의도를 ‘무너뜨리다’로 살렸고, בְּאִמְרֵי שֶׁקֶר은 ‘거짓말하는 말로’로 자연스럽게 옮겨 수단의 뉘앙스를 보존했습니다. ענוים는 여기서 사회적 약자를 가리키는 맥락을 따라 ‘가난한 사람’으로 풀었습니다.
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  english_pob_choice: even when the poor man speaks what is just
  chosen_korean: 가난한 사람이 옳은 말을 해도 그러합니다
  alternatives_korean:
  - 가난한 사람이 정의를 말해도 그러합니다
  - 가난한 사람이 옳은 판결을 말해도 그러합니다
  - 가난한 사람이 자기의 정당한 사정을 말해도 그러합니다
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적·윤리적 의미를 한국어의 ‘옳은 말’로 풀어, 문맥상 ‘가난한 사람이 정당한 주장을 해도’라는 뜻을 자연스럽게 전달했습니다.
theological_decisions:
- issue: ענוים와 אֶבְיוֹן의 빈곤·겸손 어감 처리
  chosen_reading: ‘가난한 사람’으로 통일해 사회적 약자를 드러냈습니다.
  alternative_readings:
  - 겸손한 사람
  - 온유한 사람
  - 괴로운 사람
  - 가난한 이
  rationale: 이 절은 악인이 약자를 속여 무너뜨리는 장면이므로, 두 표현의 실제 기능을 한국어 독자가 바로 이해하도록 빈곤과 취약성의 의미를 전면화했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy
