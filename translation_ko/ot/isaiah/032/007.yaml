    rationale: 한국어 ‘기물’은 대체로 물품·장비를 가리키며 악인의 방법이나 술책이라는 뜻으로는 매우 어색합니다. ‘수단’이 원어의 도구/방법 양면성을 더 잘 보존합니다.
  - severity: medium
    issue: ענוים와 אֶבְיוֹן을 모두 ‘가난한 사람’으로 번역했습니다.
    rationale: 두 히브리어 어휘는 의미 영역이 겹치지만 동일하지 않습니다. 첫 어휘는 겸손함·고난·억압받음을, 둘째는 궁핍함을 강조할 수 있으므로 차이를 보존하는 편이 안전합니다.
