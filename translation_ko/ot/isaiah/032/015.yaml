  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
  footnotes:
  - marker: a
    text: Or "the Spirit from on high"; the Hebrew רוּחַ can denote "spirit," and in context may refer specifically to God's Spirit.
    reason: alternative_reading
  - marker: b
    text: '"Fruitful field" renders Hebrew karmel, meaning fertile or cultivated land; it is likely not the place name Carmel here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 위로부터 영[a]이 우리 위에 부어질 때까지, 광야가 비옥한 밭[b]이 되고, 비옥한 밭이 숲으로 여겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위로부터의 영’; 히브리어 רוּחַ는 ‘영’ 외에 ‘바람’이나 ‘숨’도 뜻할 수 있으며, 여기서는 하나님의 영을 가리키는 것으로 읽힐 여지도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘비옥한 밭’은 히브리어 כַּרְמֶל을 옮긴 것으로, 여기서는 지명 갈멜이 아니라 비옥한 경작지를 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ מִמָּרוֹם
  english_pob_choice: a spirit from on high
  chosen_korean: 위로부터 영
