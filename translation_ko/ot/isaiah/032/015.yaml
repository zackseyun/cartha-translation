  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
  footnotes:
  - marker: a
    text: Or "the Spirit from on high"; the Hebrew רוּחַ can denote "spirit," and in context may refer specifically to God's Spirit.
    reason: alternative_reading
  - marker: b
    text: '"Fruitful field" renders Hebrew karmel, meaning fertile or cultivated land; it is likely not the place name Carmel here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 위로부터 영이 우리 위에 부어질 때까지, 광야가 기름진 밭이 되고, 기름진 밭이 숲으로 여겨질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위로부터의 영’; 히브리어 רוּחַ는 ‘영’ 외에 ‘바람/숨’도 뜻할 수 있으며, 여기서는 하나님의 영을 가리키는 것으로 읽힐 여지도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기름진 밭’은 히브리어 כַּרְמֶל을 옮긴 것으로, 여기서는 지명 갈멜이 아니라 비옥한 경작지를 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ מִמָּרוֹם
  english_pob_choice: a spirit from on high
  chosen_korean: 위로부터 영
  alternatives_korean:
  - 위로부터 한 영
  - 위로부터 성령
  lexicon: HALOT
  rationale: 히브리어는 관사 없는 רוּחַ를 쓰므로 본문은 ‘성령’으로 단정하지 않고, 위에서 오는 신적 생명력의 뉘앙스를 살려 ‘위로부터 영’으로 옮겼습니다.
- source_word: עָלֵינוּ
  english_pob_choice: on us
  chosen_korean: 우리 위에
  alternatives_korean:
  - 우리에게
  - 우리에게 임하여
  lexicon: HALOT
  rationale: עַל의 위에/위로의 공간적 이미지를 살리면서, 부어짐의 은유와 자연스럽게 맞도록 ‘우리 위에’로 옮겼습니다.
- source_word: כַּרְמֶל
  english_pob_choice: a fruitful field / the fruitful field
  chosen_korean: 기름진 밭
  alternatives_korean:
  - 비옥한 땅
  - 과실 많은 밭
  - 갈멜
  lexicon: HALOT
  rationale: 여기서는 지명 갈멜이 아니라 경작 가능한 비옥한 땅을 가리키므로, 서로 일관되게 ‘기름진 밭’으로 옮겼습니다.
- source_word: יֵחָשֵׁב
  english_pob_choice: is regarded
  chosen_korean: 여겨질 것입니다
  alternatives_korean:
  - 간주될 것입니다
  - 헤아려질 것입니다
  - 숲으로 셈될 것입니다
  lexicon: HALOT
  rationale: Niphal의 חשב가 ‘간주되다/여겨지다’라는 뜻이므로, 대조적 변형의 결과를 분명히 하는 현대적 표현을 택했습니다.
theological_decisions:
- issue: רוּחַ를 본문에서 ‘성령’으로 명시할지 여부
  chosen_reading: 위로부터 영
  alternative_readings:
  - 위로부터 성령
  - 위로부터 하나님의 영
  rationale: 문맥상 하나님의 영을 연상시키지만, 히브리어 본문 자체는 관사 없는 רוּחַ만 사용하므로 해석을 본문에 앞서지 않게 하여 여운을 남겼습니다.
  doctrine_reference: 원문 우선 원칙; 번역은 문법적 개방성을 보존해야 함
