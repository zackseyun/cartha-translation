base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
  footnotes:
  - marker: a
    text: Or 'Look' or 'See' for the opening interjection.
    reason: lexical_alternative
  - marker: b
    text: Or 'a king will reign justly'; Hebrew 'in righteousness.'
    reason: lexical_alternative
  - marker: c
    text: '''Princes'' may also be rendered ''rulers'' or ''officials.'''
    reason: lexical_alternative
  - marker: d
    text: Many Christian readers understand this king messianically in the broader context, but the Hebrew here simply says 'a king.'
    reason: cross_reference
translation:
  language: ko
  text: 보십시오[a], 한 왕이 의로[b] 통치하고, 통치자들은[c] 정의로 다스릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”, “보아라”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘의’라는 명사를 사용하며, 여기서는 왕의 통치 방식 또는 기준을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘통치자들’은 ‘방백들’, ‘지도자들’, ‘관리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
