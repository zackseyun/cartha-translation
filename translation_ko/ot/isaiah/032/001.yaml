source:
  edition: WLC
  text: הֵ֥ן לְ/צֶ֖דֶק יִמְלָךְ מֶ֑לֶךְ וּ/לְ/שָׂרִ֖ים לְ/מִשְׁפָּ֥ט יָשֹֽׂרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
  footnotes:
  - marker: a
    text: Or 'Look' or 'See' for the opening interjection.
    reason: lexical_alternative
  - marker: b
    text: Or 'a king will reign justly'; Hebrew 'in righteousness.'
    reason: lexical_alternative
  - marker: c
    text: '''Princes'' may also be rendered ''rulers'' or ''officials.'''
    reason: lexical_alternative
  - marker: d
    text: Many Christian readers understand this king messianically in the broader context, but the Hebrew here simply says 'a king.'
    reason: cross_reference
translation:
  language: ko
  text: 보십시오[a]. 한 왕이 의로 통치하고, 통치자들은 정의로 다스릴 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”, “보아라”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “의 안에서”이지만, 한국어에서는 왕의 통치 방식을 나타내는 부사격으로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘통치자들’은 ‘방백들’, ‘귀족들’, ‘관리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 끄는 감탄사로서, 현대 합쇼체에서도 긴장감과 호소력을 살리면서 직접적인 호출을 유지합니다.
- source_word: לְצֶדֶק
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 정의로
  - 의롭게
  lexicon: HALOT
  rationale: ל + צֶדֶק의 표준적 용법을 한국어 부사격으로 옮겨, 왕의 통치 방식이 ‘의’에 의해 규정됨을 간결하게 드러냅니다.
- source_word: יִמְלָךְ מֶלֶךְ
  english_pob_choice: a king will reign
  chosen_korean: 한 왕이 의로 통치하고
  alternatives_korean:
  - 왕이 통치하고
  - 한 임금이 다스리고
  - 한 왕이 다스릴 것입니다
  lexicon: HALOT
  rationale: 히브리어의 부정관사 부재를 반영해 특정 왕으로 못 박지 않고, 동사의 왕권적 통치를 ‘통치하다’로 풀어 왕-통치의 뉘앙스를 살렸습니다.
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 통치자들
  alternatives_korean:
  - 왕자들
  - 귀족들
  - 관리들
  lexicon: HALOT
  rationale: 궁정 신분명 ‘왕자들’보다 병행구의 역할을 살리는 일반적 통치자 표현이 더 자연스럽고, POB의 각주가 허용하는 의미 범위를 한국어에서 넓게 담습니다.
- source_word: לְמִשְׁפָּט
  english_pob_choice: with justice
  chosen_korean: 정의로
  alternatives_korean:
  - 공의로
  - 심판으로
  - 법대로
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정·사회적 공정성 의미를 한국어의 ‘정의’로 옮겨, 단순한 판결이 아니라 다스림의 기준을 나타내게 합니다.
- source_word: יָשֹׂרוּ
  english_pob_choice: will rule
  chosen_korean: 다스릴 것입니다
  alternatives_korean:
  - 통치할 것입니다
  - rule할 것입니다
  - 군림할 것입니다
  lexicon: HALOT
  rationale: שׂרר의 통치 행위를 현대 합쇼체에서 가장 자연스럽게 살리는 기본 동사로, 위계적 강압이 아니라 공적 통치를 나타냅니다.
theological_decisions:
- issue: 왕을 메시아로 명시할지 여부
  chosen_reading: 본문에는 ‘한 왕’으로 두어, 메시아적 해석은 주석적 여지로 남깁니다.
  alternative_readings:
  - ‘그 왕’으로 특정하기
  - 본문 자체에 메시아를 명시하기
  rationale: 히브리어는 무관사 명사로 말하며, 원문이 직접 밝히지 않은 구원사적 결론을 번역문 본문에 삽입하지 않는 것이 source-first 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; preserve theological tension rather than resolve it in the main text.'
