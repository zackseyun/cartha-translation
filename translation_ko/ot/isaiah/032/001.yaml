  rationale: שׂרר의 통치 행위를 현대 합쇼체에서 가장 자연스럽게 살리는 기본 동사로, 위계적 강압이 아니라 공적 통치를 나타냅니다.
theological_decisions:
- issue: 왕을 메시아로 명시할지 여부
  chosen_reading: 본문에는 ‘한 왕’으로 두어, 메시아적 해석은 주석적 여지로 남깁니다.
