  - 성채
  lexicon: HALOT
  rationale: 왕실 거처이자 권력 중심을 가리키는 말로, 이 문맥의 심판적 폐허 이미지를 자연스럽게 드러내는 표준어입니다.
- source_word: הֲמוֹן עִיר
  english_pob_choice: the crowded city
  chosen_korean: 떠들썩한 성읍
  alternatives_korean:
  - 붐비는 성읍
  - 번화한 성읍
  - 인파의 성읍
  lexicon: HALOT
  rationale: 히브리어는 도시의 ‘무리/소리’를 떠올리게 하므로, 단순 인구 밀집보다 소란과 활기를 함께 담는 표현으로 옮겼습니다.
- source_word: עֻזָּב
  english_pob_choice: is forsaken
  chosen_korean: 버림받았기
  alternatives_korean:
  - 버려졌기
  - 유기되었기
  lexicon: HALOT
  rationale: 앞의 נֻטָּשׁ와 평행을 이루는 수동형으로, 심판 아래 남겨진 상태를 자연스러운 한국어로 반영했습니다.
- source_word: עֹפֶל
  english_pob_choice: Ophel
  chosen_korean: 오펠
  alternatives_korean:
  - 오펠 언덕
  - 요새 언덕
  lexicon: HALOT
  rationale: 지명으로 기능하므로 음역을 유지했습니다. 본문 의미를 해치지 않으면서 주석에서 위치성을 설명할 수 있습니다.
- source_word: בַּחַן
  english_pob_choice: the watchtower
  chosen_korean: 망대
  alternatives_korean:
  - 감시탑
  - 초소탑
  lexicon: HALOT
  rationale: 감시 기능이 있는 탑을 가리키므로, 한국어 성경 문맥에서 익숙한 ‘망대’를 택했습니다.
- source_word: מְעָרוֹת
  english_pob_choice: caves
  chosen_korean: 굴
  alternatives_korean:
  - 동굴
  - 굴속
  lexicon: HALOT
  rationale: 폐허가 짐승의 서식처가 되었다는 뉘앙스를 살리기 위해, 자연 지형보다 더 거친 ‘굴’로 옮겼습니다.
theological_decisions:
- issue: 폐허가 된 도시의 장소적·상징적 이미지
  chosen_reading: 심판으로 인해 왕실 중심지와 도시 요새가 완전히 버려져 짐승의 거처가 되었다는 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로만 약화하여 ‘황폐해졌다’ 정도로 옮김
  - 도시명을 일반화하여 장소성을 흐림
  rationale: 이 절은 단순한 쇠퇴가 아니라 도시 질서의 전복과 황폐화를 선포하므로, 구체적 장소와 짐승 서식 이미지를 보존하는 편이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 예언서의 심판 선언과 회복 이전의 철저한 황폐화 이미지
- issue: עַד עוֹלָם의 지속성
  chosen_reading: ‘영원히’로 옮겨 심판의 장기성을 강하게 표현했습니다.
  alternative_readings:
  - ‘오래도록’
  - ‘끝없이’
  rationale: 문맥상 일시적 폐허가 아니라 지속적 폐허를 말하므로, 관용적으로도 분명한 ‘영원히’가 가장 적절합니다.
  doctrine_reference: 예언적 과장의 가능성이 있어도 본문이 의도하는 지속성의 강조
