source:
  edition: WLC
  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
  footnotes:
  - marker: a
    text: Or 'the bustling city' for 'the crowded city'; the Hebrew phrase literally involves the city's 'multitude' or 'noise.'
    reason: lexical_alternative
  - marker: b
    text: '''Ophel'' is a place-name, likely the fortified hill or mound area of Jerusalem.'
    reason: cultural_note
  - marker: c
    text: Or 'have become dens forever'; the Hebrew may emphasize ruined fortifications turned into animal haunts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 궁전이 버려지고, 떠들썩한 성읍이 버림받았기 때문입니다. 오펠과 망대는 영원히 굴이 되었으니, 들나귀들의 기쁨이요, 양 떼의 목초지가 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘떠들썩한 성읍’은 히브리어가 도시의 ‘무리/소리’를 함께 떠올리게 하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오펠’은 예루살렘과 관련된 지명으로, 요새화된 언덕/구역을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘굴’은 여기서 무너진 요새가 짐승의 은신처가 되었다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  english_pob_choice: palace
  chosen_korean: 궁전
  alternatives_korean:
