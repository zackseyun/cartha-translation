id: ISA.32.12
reference: Isaiah 32:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל שָׁדַ֖יִם סֹֽפְדִ֑ים עַל שְׂדֵי חֶ֕מֶד עַל גֶּ֖פֶן פֹּרִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/012.yaml
  text: They beat their breasts in mourning over the delightful fields[b][a], over the fruitful vine.
  footnotes:
  - marker: a
    text: Or 'lamenting over the breasts'; the Hebrew is compressed, and many understand it as an idiom for beating the breasts in grief.
    reason: lexical_alternative
  - marker: b
    text: Or 'Beating their breasts in mourning'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 좋은 밭을 두고, 열매 맺는 포도나무를 두고 슬퍼하며 가슴을 칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘가슴들을 애도하는 이들’처럼 압축되어 있습니다. 문맥상 많은 해석은 슬픔으로 가슴을 치는 몸짓을 뜻한다고 봅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִם
  english_pob_choice: their breasts / beat their breasts in mourning
  chosen_korean: 가슴을 칩니다
  alternatives_korean:
  - 젖가슴을 칩니다
  - 가슴을 두드립니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘젖가슴/가슴’이지만, 문맥상 슬픔의 몸짓인 가슴 치기를 가리키는 압축 표현입니다. 한국어에서는 ‘가슴을 칩니다’가 자연스럽게 관용적 의미를 살리면서도 신체 부위를 암시합니다.
- source_word: סֹפְדִים
  english_pob_choice: They beat their breasts in mourning
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 애도하며
  - 통곡하며
  - 곡하며
  lexicon: HALOT
  rationale: 어근 ספד는 ‘애도하다, 슬퍼하다’의 뜻이므로, 앞의 신체적 몸짓과 함께 문맥상 ‘슬퍼하며’로 풀어 주는 것이 가장 간결하고 자연스럽습니다.
- source_word: שְׂדֵי חֶמֶד
  english_pob_choice: the delightful fields
  chosen_korean: 아름다운 밭
  alternatives_korean:
  - 즐거운 밭
  - 기쁜 밭
  - 사랑스러운 밭
  lexicon: HALOT
  rationale: חֶמֶד는 ‘기쁨/즐거움/바람직함’의 뉘앙스를 가지며, 농경 이미지를 살려 한국어에서는 ‘아름다운 밭’이 과도한 해석 없이 수식 관계를 자연스럽게 전달합니다.
- source_word: גֶּפֶן פֹּרִיָּה
  english_pob_choice: the fruitful vine
  chosen_korean: 열매 맺는 포도나무
  alternatives_korean:
  - 열매 많은 포도나무
  - 풍성한 포도나무
  - 열매 맺는 포도덩굴
  lexicon: HALOT
  rationale: גֶּפֶן은 포도나무/포도덩굴을 가리키며, פֹּרִיָּה는 ‘열매 맺는, 비옥한’입니다. 한국어에서는 ‘포도나무’가 가장 자연스럽고, ‘열매 맺는’이 형용사적 의미를 정확히 반영합니다.
theological_decisions:
- issue: 히브리어의 압축된 애도 표현을 어떻게 드러낼지
  chosen_reading: 직역만 하지 않고 ‘슬퍼하며 가슴을 칩니다’로 풀어, 애도의 몸짓과 감정 반응을 함께 보이게 했습니다.
  alternative_readings:
  - ‘가슴을 치며 애도합니다’
  - ‘가슴을 두드리며 슬퍼합니다’
  rationale: 본문은 단순한 감정 서술이 아니라 상실에 대한 몸짓 있는 통곡을 나타내므로, 의미를 분명히 하되 과도한 해석은 피하는 것이 적절합니다.
  doctrine_reference: 예언문학의 심판-애도 이미지
- issue: 시적 병렬 구조의 보존
  chosen_reading: ‘아름다운 밭과 열매 맺는 포도나무’로 두 대상을 병렬로 유지했습니다.
  alternative_readings:
  - ‘밭과 포도나무를’
  - ‘좋은 밭과 풍성한 포도나무’
  rationale: 히브리어의 반복 전치사 구조가 대상마다 애도의 초점을 두는 병렬을 이루므로, 한국어에서도 두 항목을 분명히 나란히 제시하는 것이 좋습니다.
  doctrine_reference: 히브리 시가의 평행법
