  source_fidelity: 히브리어는 ‘가슴들’과 ‘애도하는 이들’을 압축하여 연결하며, 문맥상 슬픔으로 가슴을 치는 몸짓으로 이해할 수 있습니다. 현 번역의 ‘슬퍼하며 가슴을 칩니다’는 이 이해를 자연스럽게 드러내지만, 반복된 עַל의 애도 대상을 ‘과’로 한데 묶어 원문의 병렬 강조가 약해졌습니다. 또한 חֶמֶד의 ‘바람직하고 기쁨을 주는’ 뉘앙스에는 ‘아름다운’보다 ‘좋은’이 더 무난합니다.
  naturalness: ‘그들은 … 슬퍼하며 가슴을 칩니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘…을 두고’를 반복하면 어색하지 않으면서 히브리어의 반복 구조와 애도의 대상을 분명히 살릴 수 있습니다.
