  text: וְ/יָשַׁ֥ב עַמִּ֖/י בִּ/נְוֵ֣ה שָׁל֑וֹם וּֽ/בְ/מִשְׁכְּנוֹת֙ מִבְטַחִ֔ים וּ/בִ/מְנוּחֹ֖ת שַׁאֲנַנּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
  footnotes:
  - marker: a
    text: Or 'a habitation of peace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'quiet places of rest,' or 'resting places at ease.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성은 평화로운 거처[a]와 안전한 집들[b], 그리고 조용한 안식처들에 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화의 거처’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조용한 쉬는 곳들’, 혹은 ‘편안한 안식처들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  english_pob_choice: And ... will dwell
  chosen_korean: 살 것입니다
  alternatives_korean:
  - 거할 것입니다
  - 머물 것입니다
  lexicon: HALOT
  rationale: ישב는 ‘앉다’보다 ‘거주하다, 살다’의 뜻이 자연스러우므로, 예언적 약속의 지속적 거주를 현대 한국어로 가장 분명하게 드러내기 위해 ‘살 것입니다’를 선택했습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성은
  alternatives_korean:
  - 내 국민은
  - 내 사람들은
  lexicon: HALOT
  rationale: 1인칭 소유격이 붙은 עם은 언약적 관계를 가리키는 ‘내 백성’이 가장 직접적이며, ‘국민’은 현대적이지만 관계적 뉘앙스가 약합니다.
- source_word: בִּנְוֵה שָׁלוֹם
  english_pob_choice: in a peaceful habitation
  chosen_korean: 평화로운 거처
  alternatives_korean:
  - 평화의 거처
  - 평안한 거처
  lexicon: HALOT
  rationale: נוה는 여기서 목초지보다 거주지를 가리키므로 ‘거처’로 옮기고, שָׁלוֹם의 상태적 의미는 ‘평화로운’으로 자연스럽게 살렸습니다.
- source_word: מִבְטַחִים
  english_pob_choice: secure dwellings
  chosen_korean: 안전한 집들
  alternatives_korean:
  - 보장된 집들
  - 안심할 수 있는 집들
  lexicon: HALOT
  rationale: מבטחים는 객관적 안전과 보호를 뜻하므로 ‘안전한’이 적절하고, 한국어에서는 복수 감각을 ‘집들’로 드러내는 것이 병렬 구조를 살립니다.
- source_word: וּבִמְנוּחוֹת שַׁאֲנַנּוֹת
  english_pob_choice: and in quiet resting places
  chosen_korean: 조용한 안식처들
  alternatives_korean:
  - 평온한 쉬는 곳들
  - 조용하고 편안한 곳들
  lexicon: HALOT
  rationale: מנוחות는 ‘안식처, 쉬는 곳’의 구체성을 지니고, שׁאננות의 ‘평온함, 고요함’을 한국어 관용에 맞게 ‘조용한’으로 압축했습니다.
theological_decisions:
- issue: 이 절의 평화·안전 약속의 범위
  chosen_reading: 이 구절은 하나님의 백성이 누릴 실제적인 평화와 안전한 거주 상태를 묘사하며, 그 성취 시점을 이 절 안에서 단정하지 않습니다.
  alternative_readings:
  - 역사적 유다 회복에 대한 약속으로 한정
  - 종말론적 메시아 평화로 한정
  rationale: 히브리어 본문은 거주의 상태를 선포할 뿐, 성취의 시간적 범위를 명시하지 않으므로 본문이 가진 긴장을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문 중심 번역은 성취 범위를 과도하게 한정하지 않습니다.
