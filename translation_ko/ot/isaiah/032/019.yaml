  yaml_path: translation/ot/isaiah/032/019.yaml
  text: And it will hail when the forest falls[a], and the city will be utterly laid low in the lowland.
  footnotes:
  - marker: a
    text: Or, 'And hail will fall when the forest comes down.' The Hebrew allows a more formally literal rendering with 'hail' as the subject and 'the forest' as descending/falling.
    reason: lexical_alternative
translation:
  language: ko
  text: 숲이 쓰러질 때 우박이 내리고, 성읍은 저지대에서 완전히 낮아질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “숲이 내려올 때 우박이 내릴 것입니다.” 히브리어는 ‘우박’을 주어로 하고, ‘숲의 내려감’을 시간 표현으로 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָד
  english_pob_choice: And it will hail
  chosen_korean: 그리고 우박이 내리며
  alternatives_korean:
  - 그리고 우박이 내릴 것입니다
  - 그리고 우박이 쏟아지며
  lexicon: HALOT
  rationale: 브רד는 문맥상 날씨 현상인 ‘우박’을 가리키므로, 한국어에서는 주어를 ‘우박’으로 두어 자연스럽게 옮겼습니다. 동사 ‘내리다’가 가장 직접적으로 대응합니다.
- source_word: בְּרֶדֶת הַיָּעַר
  english_pob_choice: when the forest falls
  chosen_korean: 숲이 무너질 때
  alternatives_korean:
  - 숲이 내려앉을 때
  - 숲이 쓰러질 때
  lexicon: HALOT
  rationale: ירד의 분사적/부정사적 용법을 시간 부사절로 살려 ‘~할 때’로 옮겼고, POB의 해석처럼 ‘forest’가 내려앉는 장면을 ‘무너질 때’로 표현했습니다.
- source_word: וּבַשִּׁפְלָה
  english_pob_choice: and in the lowland
  chosen_korean: 낮은 곳에서
  alternatives_korean:
  - 저지대에서
  - 저평한 곳에서
  lexicon: HALOT
  rationale: שִׁפְלָה는 지형적으로 낮은 지역을 뜻하므로 ‘저지대’ 계열이 가능하지만, 본문 후반의 ‘성읍’과 연결될 때 한국어에서는 ‘낮은 곳에서’가 더 매끄럽습니다.
- source_word: תִּשְׁפַּל הָעִיר
  english_pob_choice: the city will be utterly laid low
  chosen_korean: 성읍은 철저히 낮아질 것입니다
  alternatives_korean:
  - 성읍은 완전히 낮아질 것입니다
  - 성읍은 철저히 낮아집니다
  lexicon: HALOT
  rationale: שׁפל은 여기서 도덕적 ‘겸손’이 아니라 파괴적 ‘낮아짐/몰락’을 뜻하므로, ‘낮아지다’를 쓰되 POB의 강한 뉘앙스를 살리기 위해 ‘철저히’를 보강했습니다.
theological_decisions:
- issue: 도시의 ‘낮아짐’의 성격
  chosen_reading: 이 표현은 성읍의 물리적·사회적 붕괴를 가리키며, 윤리적 겸손으로 완화하지 않습니다.
  alternative_readings:
  - 성읍이 겸손해질 것입니다
  - 성읍이 낮아질 것입니다
  rationale: 문맥상 자연재앙과 심판의 이미지이므로, שׁפל의 의미를 심리적 겸손으로 옮기면 본문의 심판적 힘이 약해집니다.
  doctrine_reference: 예언서의 심판 이미지와 어휘적 문맥
