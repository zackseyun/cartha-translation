    rationale: 각주는 우박을 주어로 하는 표현과 숲의 내려감이 시간절로 기능하는 점을 명료하게 설명해야 합니다. ‘우박이 내릴 때 숲이 무너집니다’는 원문의 시간 관계를 다른 방향으로 읽게 할 수 있습니다.
