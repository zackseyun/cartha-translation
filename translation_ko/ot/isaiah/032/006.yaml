- from: 미련한 자는 미련을 말하며, 그의 마음은 악을 꾀합니다. 경건하지 아니함을 행하며 여호와께 허물을 말하여, 주린 자를 공허하게 하고 목마른 자에게 마시게 하지 아니함이니이다.[a][b][c]
  to: 어리석은 자는 어리석은 말을 하며, 그의 마음은 악을 꾀합니다. 그는 불경건을 행하고 여호와를 거슬러 그릇된 말을 하며, 주린 사람에게 먹을 것을 주지 아니하고 목마른 사람에게 마실 것을 주지 아니합니다.[a][b][c]
  rationale: 원문의 윤리적 어리석음과 그에 따른 행위를 현대 표준 한국어 합쇼체로 명료하게 옮겼습니다. '그릇된 말'은 תּוֹעָה의 의미를 보존하고, 먹을 것과 마실 것을 주지 않는다는 표현은 굶주리고 목마른 이들을 실제로 궁핍하게 만드는 원문의 구체성을 살립니다. 각주들은 어휘적 대안을 유지하되 히브리어 형태와 의미 설명을 바로잡았습니다.
