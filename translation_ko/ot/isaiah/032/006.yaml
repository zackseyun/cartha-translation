    issue: '''여호와께 허물을 말하여'''
    rationale: תּוֹעָה는 잘못, 그릇됨, 거짓된 말의 뜻이지 '허물'을 말한다는 뜻이 아닙니다. 또한 אֶל은 여기서 여호와를 향한/여호와에 관한 발화의 방향을 나타내므로 '여호와를 거슬러 그릇된 말을 하며'가 문맥과 어휘를 더 잘 반영합니다.
  - severity: medium
    issue: '''주린 자를 공허하게 하고'''
    rationale: לְהָרִיק נֶפֶשׁ רָעֵב는 굶주린 사람을 빈손으로, 곧 먹을 것을 받지 못한 채 돌려보내는 뜻입니다. '공허하게'는 정서적·추상적으로 들려 구체적 결핍을 약화합니다.
  - severity: low
    issue: 각주 a의 '무신론적 표현'
    rationale: חֹנֶף는 무신론 자체를 뜻하지 않습니다. 불경건 또는 위선적 악행을 가리킬 수 있다는 설명이 더 정확합니다.
  - severity: low
