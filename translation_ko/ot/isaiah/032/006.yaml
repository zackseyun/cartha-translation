    rationale: 원문은 '주린 자의 생명'이라는 소유구가 아니라 נֶפֶשׁ רָעֵב, 곧 '주린 생명/사람'입니다. 또한 각주는 해당 표현 뒤에 두는 것이 독자에게 더 분명합니다.
