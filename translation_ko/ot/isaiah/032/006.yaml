review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영되었으나, 원문의 미완료형이 묘사하는 반복적·특성적 행위를 자연스러운 현재형으로 일관되게 살리고, חֹנֶף와 תּוֹעָה를 더 정확히 구별할 필요가 있습니다. 특히 '여호와께 허물을 말하여'는 תּוֹעָה(그릇됨, 거짓됨)를 '허물'로 옮겨 의미가 불분명해집니다.
  naturalness: 합쇼체는 대체로 적절하나 '공허하게 하고'는 한국어에서 굶주린 사람을 먹이지 않아 빈손으로 돌려보내는 사회적 의미를 충분히 자연스럽게 전달하지 못합니다. '먹을 것을 주지 아니하고' 및 '마실 것을 주지 아니하는' 표현이 명료하고 자연스럽습니다.
  terminology: נָבָל/נְבָלָה의 말놀이를 '어리석은 자/어리석은 말을'로 반영했습니다. חֹנֶף는 문맥상 '불경건'이 적절하며, תּוֹעָה는 '그릇된 말을 하다'로 옮겼습니다. 신명은 본문과 각주에서 일관되게 '여호와'로 유지했습니다. נפשׁ 각주는 '주린 자의 생명'이 아니라 본문의 히브리어 형태에 맞게 '주린 생명/사람'으로 바로잡았습니다.
  issues:
