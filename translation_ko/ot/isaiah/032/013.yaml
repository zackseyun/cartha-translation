id: ISA.32.13
reference: Isaiah 32:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֚ל אַדְמַ֣ת עַמִּ֔/י ק֥וֹץ שָׁמִ֖יר תַּֽעֲלֶ֑ה כִּ֚י עַל כָּל בָּתֵּ֣י מָשׂ֔וֹשׂ קִרְיָ֖ה עַלִּיזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
  footnotes:
  - marker: a
    text: Or 'will spring up' for 'will come up.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the jubilant city'; the Hebrew describes a city marked by rejoicing or merriment.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성의 땅 위에는 가시덤불과 엉겅퀴가 올라올 것입니다[a]. 참으로[b] 기쁨의 집들 위, 즐거운 성읍 위에도 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자라날 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곧’ 정도의 강조로 이해할 수 있습니다. 히브리어 כִּי는 여기서 범위를 강조하는 말로도 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  english_pob_choice: the land of my people
  chosen_korean: 내 백성의 땅
  alternatives_korean:
  - 내 백성의 토지
  - 내 백성의 밭
  lexicon: HALOT
  rationale: אַדְמָה는 구체적 ‘땅/토지’의 뜻이므로, 예언적 심판 문맥에서 자연스러운 ‘땅’으로 옮기되 소유 관계를 살렸습니다.
- source_word: קוֹץ
  english_pob_choice: thorn
  chosen_korean: 가시덤불
  alternatives_korean:
  - 가시
  - 가시나무
  lexicon: HALOT
  rationale: 저주와 황폐의 이미지를 살리기 위해 단일 가시보다 식생 전체를 떠올리게 하는 ‘가시덤불’을 택했습니다.
- source_word: שָׁמִיר
  english_pob_choice: brier
  chosen_korean: 엉겅퀴
  alternatives_korean:
  - 찔레
  - 가시덤불
  lexicon: HALOT
  rationale: קוֹץ와 병렬되는 가시식물 이미지로서, 한국어에서 황폐의 상징으로도 잘 쓰이는 ‘엉겅퀴’가 가장 자연스럽습니다.
- source_word: תַּעֲלֶה
  english_pob_choice: will come up
  chosen_korean: 올라올 것입니다
  alternatives_korean:
  - 자라날 것입니다
  - 솟아날 것입니다
  lexicon: HALOT
  rationale: עלה의 식물 발생 이미지를 살리면서, 문맥상 땅에서 돋아나는 뜻을 한국어 동사로 자연스럽게 표현했습니다.
- source_word: בָּתֵּי מָשׂוֹשׂ
  english_pob_choice: the joyful houses
  chosen_korean: 기쁨의 집들
  alternatives_korean:
  - 즐거운 집들
  - 환락의 집들
  lexicon: HALOT
  rationale: 문자적으로 ‘기쁨의 집들’이므로 그 구조를 유지했습니다. ‘환락의 집들’은 해석을 과도하게 좁힐 수 있어 피했습니다.
- source_word: קִרְיָה עַלִּיזָה
  english_pob_choice: the exultant city
  chosen_korean: 즐거운 성읍
  alternatives_korean:
  - 기쁨에 들뜬 성읍
  - 환희의 성읍
  lexicon: HALOT
  rationale: עַלִּיזָה의 ‘즐거워하는/흥겨워하는’ 의미를 살리되, 본문이 도시의 성격을 묘사하는 표현이므로 ‘성읍’으로 옮겼습니다.
theological_decisions:
- issue: 심판 이미지의 강도
  chosen_reading: ‘가시덤불과 엉겅퀴가 올라올 것입니다’로 직설적으로 옮겨, 땅의 황폐와 저주의 감각을 약화하지 않았습니다.
  alternative_readings:
  - ‘가시와 엉겅퀴가 돋아날 것입니다’
  - ‘가시나무와 찔레가 자랄 것입니다’
  rationale: 히브리어가 농경지의 폐허화를 강하게 그리므로, 완곡화보다 시각적·신학적 충격을 유지하는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 예언서의 언약적 심판 이미지
