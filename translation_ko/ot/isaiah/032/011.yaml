    rationale: a는 ‘허리’의 문자적 의미, b는 보충된 ‘삼베’, c는 ‘옷을 벗고 몸을 드러내십시오’에 각각 직접 연결되어야 독자가 각주의 적용 범위를 알 수 있습니다.
