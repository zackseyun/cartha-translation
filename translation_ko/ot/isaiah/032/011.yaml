id: ISA.32.11
reference: Isaiah 32:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
  footnotes:
  - marker: a
    text: Literally, 'around the loins.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not explicitly state 'sackcloth' in this verse, but the command to gird something around the waist in this prophetic mourning context is commonly understood as sackcloth.
    reason: cultural_note
  - marker: c
    text: Or 'Strip yourselves bare, and make yourselves naked'.
    reason: previous_rendering
translation:
  language: ko
  text: 떨라, 안일한 여자들아. 흔들라, 자신만만한 여자들아. 벗어라, 몸을 드러내라. 그리고 허리에 삼베를 두르라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘허리/허벅지 둘레에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문에는 ‘삼베’가 직접 적혀 있지 않지만, 애도의 문맥상 허리에 두르는 것은 통상 삼베로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘벗어 알몸이 되라’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: חִרְדוּ
  english_pob_choice: Tremble
  chosen_korean: 떨라
  alternatives_korean:
  - 두려워하라
  - 몸서리쳐라
  lexicon: HALOT
  rationale: 여성 복수 명령형의 급박한 경고를 직접 살리기 위해 ‘떨라’를 택했습니다.
- source_word: שַׁאֲנַנּוֹת
  english_pob_choice: you complacent women
  chosen_korean: 안일한 여자들아
  alternatives_korean:
  - 태평한 여자들아
  - 자만한 여자들아
  lexicon: HALOT
  rationale: 예언자적 책망의 뉘앙스를 살리면서도 여성 복수 호칭을 유지하기 위해 ‘안일한 여자들아’로 옮겼습니다.
- source_word: פְּשֹׁטָה וְעֹרָה
  english_pob_choice: Strip, make yourselves bare
  chosen_korean: 벗어라, 몸을 드러내라
  alternatives_korean:
  - 벗어라, 벌거벗어라
  - 옷을 벗고 알몸이 되라
  lexicon: HALOT
  rationale: 두 개의 짧은 명령을 한국어에서도 병렬적으로 살리되, 과도하게 장황하거나 반복적으로 들리지 않도록 ‘벗어라, 몸을 드러내라’로 옮겼습니다.
- source_word: וַחֲגֹרָה עַל חֲלָצָיִם
  english_pob_choice: and tie sackcloth around your waist
  chosen_korean: 그리고 허리에 삼베를 두르라
  alternatives_korean:
  - 그리고 허리에 베옷을 두르라
  - 그리고 허리 둘레에 삼베를 매라
  lexicon: HALOT
  rationale: 히브리어 본문에는 직역상 ‘허리/허벅지 부분에 두르라’만 있지만, 애도·굴욕의 문맥에서 통상 암시되는 애도의 옷을 한국어 독자가 이해하도록 ‘삼베’를 보충했습니다.
theological_decisions:
- issue: 예언적 비유에서 ‘벗음’의 수위
  chosen_reading: ‘벗어라, 몸을 드러내라’로 직설성을 유지하되, 노골적인 성적 뉘앙스로 과장하지 않았습니다.
  alternative_readings:
  - ‘옷을 벗어라, 알몸이 되라’
  - ‘벗어라, 드러내라’
  rationale: 문맥은 수치와 애도를 드러내는 예언적 상징 행위이므로, 본문의 강한 경고를 살리면서도 한국어 공적 번역으로서의 균형을 고려했습니다.
  doctrine_reference: 예언서의 상징행위와 수치의 신학
