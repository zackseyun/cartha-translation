  verdict: revise
  source_fidelity: 히브리어의 여성 복수 명령과 호칭, 그리고 벗음·드러냄의 병렬 명령은 대체로 반영되었습니다. 그러나 רְגָזָה를 ‘흔들라’로 옮기면 스스로 떨거나 전율하라는 뜻보다 무엇인가를 흔들라는 뜻으로 읽히기 쉽습니다. 또한 ‘삼베’는 본문에 명시되지 않은 보충이므로 각주가 해당 단어에 직접 붙어야 합니다.
  naturalness: 초안의 명령형 ‘떨라/흔들라/벗어라/두르라’는 하라체이며, 지정된 현대 정중체 합쇼체와 일치하지 않습니다. ‘떠십시오’와 ‘두르십시오’로 고치고, ‘여자들이여’라는 공적 문체 호칭을 사용하면 자연스럽고 일관됩니다.
  terminology: שַׁאֲנַנּוֹת의 책망적 ‘안일한’은 적절합니다. בֹּטְחוֹת는 ‘자신만만한’보다 문맥상 안전하다고 여기는 상태를 나타내는 ‘안심하는’이 더 가깝습니다. פְּשֹׁטָה וְעֹרָה는 ‘옷을 벗고 몸을 드러내십시오’로 두 동작을 유지했습니다. ‘삼베’의 보충은 애도 문맥에 근거하나 본문에 없는 말임을 각주로 밝혀야 합니다.
