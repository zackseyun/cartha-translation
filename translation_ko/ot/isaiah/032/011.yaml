  rationale: 합쇼체를 일관되게 적용하고, רְגָזָה를 ‘몸을 떠십시오’로 옮겨 전율의 의미를 분명히 했습니다. 두 벗음의 명령은 병렬성을 보존했습니다. 본문에 명시되지 않은 ‘삼베’는 영어 POB의 보충 방침을 유지하되 해당 단어에 각주를 붙여 투명하게 처리했으며, 모든 각주 표지를 관련 어구로 재배치했습니다.
  reviewer_model: gpt-5.6-terra
