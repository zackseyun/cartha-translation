translation:
  language: ko
  text: 그때에 보는 이들의 눈은 흐려지지 않을 것이며, 듣는 이들의 귀는 주의 깊게 들을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감기지 않을 것이며’ 또는 ‘가려지지 않을 것이며.’ 히브리어 동사는 눈이 더 이상 흐려지거나 감기거나 가려지지 않는 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹ֥א תִשְׁעֶ֖ינָה
  english_pob_choice: will not be dim
  chosen_korean: 흐려지지 않고
  alternatives_korean:
  - 눈멀지 않고
  - 어두워지지 않고
  - 흐릿해지지 않고
  lexicon: HALOT
  rationale: שעה는 이 문맥에서 시각 기능이 약화되거나 가려지는 뜻이므로, 영어 POB의 'will not be dim'을 따라 한국어에서도 눈의 손상이나 차단을 직접 드러내는 '흐려지지 않고'로 옮겼습니다.
- source_word: עֵינֵ֣י רֹאִ֑ים
  english_pob_choice: the eyes of those who see
  chosen_korean: 보는 이들의 눈
  alternatives_korean:
  - 보는 자들의 눈
  - 시인들의 눈
  lexicon: HALOT
  rationale: 연계구문과 실질적인 주어를 살려 직역에 가깝게 옮기되, '보는 이들'로 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: אָזְנֵ֥י שֹׁמְעִ֖ים
  english_pob_choice: the ears of those who hear
  chosen_korean: 듣는 이들의 귀
  alternatives_korean:
  - 듣는 자들의 귀
  - 청종하는 자들의 귀
  lexicon: HALOT
  rationale: שֹׁמְעִים의 실질적 행위성을 살려 '듣는 이들'로 옮기고, 앞 절과의 병행을 유지했습니다.
- source_word: תִּקְשַֽׁבְנָה
  english_pob_choice: will listen attentively
  chosen_korean: 주의 깊게 들을 것입니다
  alternatives_korean:
  - 귀 기울일 것입니다
  - 주의하여 들을 것입니다
  - 열심히 들을 것입니다
  lexicon: HALOT
  rationale: קשׁב는 단순 청취가 아니라 집중해 경청하는 뜻이므로, '주의 깊게 들을 것입니다'로 의미 강도를 살렸습니다.
theological_decisions:
- issue: 감각 이미지의 해석 범위
  chosen_reading: 물리적 시각·청각의 회복을 직접 말하면서도, 그 이미지를 통해 이해와 응답의 회복을 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 전적으로 비유적인 영적 분별의 회복
  - 특정한 예언자 계층에 대한 언급
  rationale: 문맥상 의로운 शासन과 새 질서를 말하지만, 본문 자체는 눈과 귀의 감각 언어를 사용하므로 둘 중 하나로 환원하지 않고 긴장을 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
