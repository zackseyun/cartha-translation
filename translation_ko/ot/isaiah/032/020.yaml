base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
  footnotes:
  - marker: a
    text: Literally, 'who send out the foot of the ox and the donkey,' an idiom for letting them roam or graze freely.
    reason: lexical_alternative
translation:
  language: ko
  text: 물가마다 씨를 뿌리고 소와 나귀를 풀어 자유롭게 다니게 하는 여러분은 복됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘소와 나귀의 발을 내보내는’이라고 합니다. 이는 동물을 풀어 방목하거나 자유롭게 돌아다니게 한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  english_pob_choice: Blessed are you
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복이 있습니다
  - 행복합니다
  lexicon: HALOT
  rationale: 복된 상태를 선언하는 축복 형식을 살리기 위해, 평서형보다 간결한 ‘복됩니다’를 택했습니다.
- source_word: זֹרְעֵי עַל כָּל מָיִם
  english_pob_choice: who sow beside all waters
  chosen_korean: 물가마다 씨를 뿌리는
  alternatives_korean:
  - 모든 물 곁에 씨를 뿌리는
  - 물가에서 씨를 뿌리는
  lexicon: HALOT
  rationale: ‘all waters’는 풍부한 수원이 있는 곳을 가리키는 농경적 이미지이므로, 한국어에서는 자연스러운 ‘물가마다’로 풀어 옮겼습니다.
- source_word: מְשַׁלְּחֵי רֶגֶל הַשּׁוֹר וְהַחֲמוֹר
  english_pob_choice: who let the feet of the ox and the donkey range free
  chosen_korean: 소와 나귀의 발을 놓아 자유롭게 다니게 하는
  alternatives_korean:
  - 소와 나귀를 풀어 놓는
  - 소와 나귀가 돌아다니게 하는
  lexicon: HALOT
  rationale: 직역하면 ‘발을 보내다’라는 관용구이므로, 동물의 발을 언급하는 이미지를 유지하되 한국어에서는 ‘발을 놓아 자유롭게 다니게 하는’으로 관용적으로 살렸습니다.
theological_decisions:
- issue: 축복 선언의 중복 구조
  chosen_reading: 앞부분과 뒷부분을 모두 ‘복됩니다’로 반복해, 두 행으로 이루어진 축복 선언의 병렬성을 드러냈습니다.
  alternative_readings:
  - 첫 절만 ‘복됩니다’로 하고 둘째 절은 서술적으로 처리하는 방식
  - ‘행복합니다’로 완화하는 방식
  rationale: 히브리어의 축복 구문은 단순 감정이 아니라 승인과 번영의 선언이므로, 반복 구조를 그대로 살리는 편이 원문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 시편·지혜문학의 축복 선언 형식
