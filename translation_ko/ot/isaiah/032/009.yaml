  text: 안일한 여자들[a], 일어나 내 목소리를 들으라. 자신 있는 딸들[c][b], 내 말을 경청하라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''안일한''을 ''편안한''으로 번역할 수 있음; 히브리어는 방해받지 않고 생활하거나 무심하게 안전하다고 여겨지는 자들을 나타낼 수 있음.'
    reason: alternative_reading
  - marker: b
    text: 문자적으로 '딸들'. 히브리어 호칭의 형태를 보존하기 위해 이 용어를 유지함.
    reason: alternative_reading
  - marker: c
    text: '''자신 있는''을 ''안전한''으로 번역할 수 있음; 히브리어는 안전함이나 자신감의 느낌을 강조함.'
    reason: alternative_reading
