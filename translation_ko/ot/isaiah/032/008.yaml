reference: Isaiah 32:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָדִ֖יב נְדִיב֣וֹת יָעָ֑ץ וְ/ה֖וּא עַל נְדִיב֥וֹת יָקֽוּם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/008.yaml
  text: But a noble man plans noble things[b][a], and he stands on noble things.
  footnotes:
  - marker: a
    text: Or 'plans generous things' / 'on generous things he stands.' The Hebrew נָדִיב / נְדִיבוֹת can carry the sense of nobility or generosity.
    reason: lexical_alternative
  - marker: b
    text: Or 'and by noble things he stands' or 'and he is established in noble things.' The Hebrew expression with עַל ... יָקוּם is concise and allows more than one closely related nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 고귀한 사람은 고귀한 것들을 계획하고, 그는 고귀한 것들 위에 섭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관대한 것들을 계획합니다’ / ‘그는 관대한 것들 위에 섭니다.’ 히브리어 נָדִיב / נְדִיבוֹת은 고귀함이나 관대함의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 고귀한 것들로 인해 섭니다’ 혹은 ‘그는 고귀한 것들 안에서 굳게 섭니다.’ עַל ... יָקוּם이라는 표현은 간결하여, 이처럼 서로 가까운 여러 뉘앙스를 허용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  english_pob_choice: a noble man
  chosen_korean: 고귀한 사람
  alternatives_korean:
  - 고귀한 남자
  - 귀한 사람
  - 후한 사람
  lexicon: HALOT
  rationale: נָדִיב은 ‘고귀한/통치자다운’ 뜻과 ‘관대한’ 뜻을 함께 가질 수 있어, 문맥상 인격과 품격을 드러내는 ‘고귀한 사람’으로 옮겼습니다. 성별을 굳이 덧붙이지 않고도 대표적 인물을 자연스럽게 살릴 수 있습니다.
- source_word: נְדִיבוֹת
  english_pob_choice: noble things
  chosen_korean: 고귀한 것들
  alternatives_korean:
  - 관대한 것들
  - 고귀한 행위들
  - 고결한 일들
  lexicon: HALOT
  rationale: 복수형 추상명사는 계획과 행위 전반을 포괄할 수 있으므로, 영어 POB의 반복 구조를 살려 ‘고귀한 것들’로 두었습니다. ‘관대한 것들’은 가능하지만 여기서는 단순한 자선보다 품격 있는 의도와 행위를 함께 가리키는 폭이 더 적절합니다.
- source_word: יָעָץ
  english_pob_choice: plans
  chosen_korean: 계획하고
  alternatives_korean:
  - 조언하고
  - 의논하고
  - 궁리하고
  lexicon: HALOT
  rationale: 여기서는 남에게 조언하는 것이 아니라 내면에서 목적을 세우는 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘계획하다’를 선택했습니다.
- source_word: עַל ... יָקוּם
  english_pob_choice: and he stands on noble things
  chosen_korean: 그는 고귀한 것들 위에 섭니다
  alternatives_korean:
  - 그는 고귀한 것들 위에 서 있습니다
  - 그는 고귀한 것들 위에서 굳게 섭니다
  - 그는 고귀한 것들로 인해 굳게 섭니다
  lexicon: HALOT
  rationale: עַל ... יָקוּם의 간결한 이미지를 살려 ‘위에 섭니다’로 직역 성향을 유지했습니다. ‘서 있습니다’보다 ‘섭니다’가 시적 평행구를 더 간결하게 드러냅니다.
theological_decisions:
- issue: נָדִיב / נְדִיבוֹת의 의미 범위
  chosen_reading: ‘고귀함’과 ‘관대함’의 범위를 함께 열어 두되, 본문에서는 품격 있고 바른 성품의 강조를 전면에 두었습니다.
  alternative_readings:
  - ‘관대한 사람은 관대한 것들을 계획합니다’로 좁히는 읽기
  - ‘귀족/통치자’로 사회적 지위를 강하게 반영하는 읽기
  rationale: 본문은 어리석고 비열한 사람과 대비되는 인물을 묘사하므로, 단순한 물질적 후함보다 도덕적·사회적 품격을 드러내는 표현이 더 넓은 문맥에 맞습니다.
  doctrine_reference: 지혜문학의 성품 대비
- issue: עַל ... יָקוּם의 함의
  chosen_reading: ‘위에 섭니다’로 두어, 고귀한 것들이 그 사람의 지지대이자 삶의 기반이라는 이미지를 유지했습니다.
  alternative_readings:
  - ‘고귀한 것들로 인해 굳게 선다’는 원인적 읽기
  - ‘고귀한 것들 위에 확립된다’는 상태적 읽기
  rationale: 히브리어 표현은 짧고 압축적이어서 하나의 해석으로 고정하기보다, 기반 위에 서 있는 시각적 비유를 살리는 것이 원문과 영어 POB의 신중한 개방성을 함께 반영합니다.
  doctrine_reference: 시적 평행법과 지혜의 비유
