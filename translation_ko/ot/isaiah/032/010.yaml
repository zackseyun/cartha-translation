id: ISA.32.10
reference: Isaiah 32:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָמִים֙ עַל שָׁנָ֔ה תִּרְגַּ֖זְנָה בֹּֽטְח֑וֹת כִּ֚י כָּלָ֣ה בָצִ֔יר אֹ֖סֶף בְּלִ֥י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
  footnotes:
  - marker: a
    text: 'Hebrew: ''days upon a year,'' an idiom meaning a little more than a year.'
    reason: lexical_alternative
  - marker: b
    text: Or 'confident women' or 'secure women.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the ingathering will not come.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 해가 조금 더 지나면 여러분은 떨게 될 것입니다. 안일한 여자들아, 포도 수확이 끝나 버릴 것이며, 과일 거두기도 오지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘한 해 위에 날들’로, ‘한 해가 조금 더 지난 때’를 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안심하는 여자들’, ‘확신하는 여자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘거두어 들이는 일’이 오지 않을 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  english_pob_choice: In little more than a year
  chosen_korean: 한 해가 조금 더 지나면
  alternatives_korean:
  - 1년이 조금 넘으면
  - 한 해를 조금 넘긴 뒤에
  - 한 해와 며칠 뒤에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘날들 위에 한 해’는 정확한 연수 계산보다 ‘한 해가 조금 넘는 시점’을 뜻하므로, 한국어에서는 자연스럽게 시간 경과를 드러내는 표현으로 옮겼습니다.
- source_word: תִּרְגַּזְנָה
  english_pob_choice: you will tremble
  chosen_korean: 떨게 될 것입니다
  alternatives_korean:
  - 흔들리게 될 것입니다
  - 전율하게 될 것입니다
  - 동요하게 될 것입니다
  lexicon: HALOT
  rationale: רגז의 핵심 의미는 두려움과 불안으로 인한 떨림/동요이므로, 심판 경고의 문맥에 맞는 ‘떨다’를 선택했습니다.
- source_word: בֹּטְחוֹת
  english_pob_choice: you complacent women
  chosen_korean: 안일한 여자들아
  alternatives_korean:
  - 안심하는 여자들아
  - 확신하는 여자들아
  - 평안하다고 여기는 여자들아
  lexicon: HALOT
  rationale: 단순한 ‘믿고 있는’ 상태보다, 경고를 무시한 채 스스로 안전하다고 여기는 부정적 뉘앙스를 살리기 위해 ‘안일한’으로 옮겼습니다. 여성 복수형 호칭도 직접 반영했습니다.
- source_word: בָצִיר / אֹסֶף
  english_pob_choice: the grape harvest / the fruit harvest
  chosen_korean: 포도 수확 / 과일 거두기
  alternatives_korean:
  - 포도 추수 / 곡식 거두기
  - 포도 수확 / 추수
  - 포도 거둠 / 들임
  lexicon: HALOT
  rationale: בָצִיר는 포도 수확을 가리키는 특수어이고, אֹסֶף는 ‘거둠/들임’의 뜻이지만 문맥상 농산물의 수확 실패를 가리키므로 한국어에서는 두 이미지를 살려 각각 구분했습니다.
theological_decisions:
- issue: 예언적 미래 시제와 확정성
  chosen_reading: 히브리어 완료형/진행형의 예언적 용법을 따라, 미래의 확정된 경고로 한국어 미래 표현을 사용했습니다.
  alternative_readings:
  - 현재형으로 옮겨 ‘떨고 있습니다’
  - 과거 완료처럼 ‘떨었습니다’
  rationale: 문맥이 심판의 임박성을 선언하므로, 사건의 확실성을 담은 미래형이 원문 기능을 가장 잘 전달합니다.
  doctrine_reference: 예언문체의 미래적 확정성
