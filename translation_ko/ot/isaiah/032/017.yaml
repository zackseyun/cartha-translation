    rationale: 각주 앵커는 해당 어휘 바로 뒤에 놓여야 하며, 번역상의 대안을 제시할 경우 원어의 의미 범위를 정확히 밝혀야 합니다.
  - severity: medium
    issue: 각주 [b]는 ‘의의 섬김’을 가리키는 표현이라고만 하여, 해당 표현 자체를 설명하지 못합니다.
    rationale: עֲבֹדַת는 ‘섬김/일’의 의미 범위를 지니지만, 기존 주석은 독자에게 실질적 정보를 제공하지 않습니다.
