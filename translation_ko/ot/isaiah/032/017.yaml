  source_fidelity: 히브리어의 두 병렬 명사구(‘의의 행위/일’과 ‘의의 섬김’) 및 그 결과인 평강, 고요함, 안전을 유지했습니다. עֲבֹדַת는 문맥상 ‘섬김/일’로도 가능한 말이므로 영어 POB의 ‘service’를 따라 ‘섬김’을 보존했습니다.
  naturalness: 기존의 ‘평강이요 ... 안전입니다’는 문체상 연결이 다소 불균형하고, ‘평온’은 הַשְׁקֵט의 직접적인 ‘고요함’을 약화합니다. 병렬 서술을 ‘이며 ... 입니다’로 정돈하고 ‘고요함’을 사용했습니다.
  terminology: ‘의’, ‘평강’, ‘섬김’, ‘안전’은 본문의 어휘와 한국어 성서 문체에 적절합니다. 기존 각주는 대안의 근거·앵커가 불명확하거나 번역문을 단순 반복하므로 삭제하는 것이 안전합니다.
