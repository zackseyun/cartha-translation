id: ISA.32.17
reference: Isaiah 32:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: ko
  text: 의의 행위는 평강이요, 의의 섬김은 영원한 평온과 안전입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의의 열매’.
    reason: alternative_reading
  - marker: b
    text: ‘의의 섬김’을 가리키는 표현입니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘고요함과 안전’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  english_pob_choice: work
  chosen_korean: 행위
  alternatives_korean:
  - 일
  - 일함
  - 작업
  lexicon: עשה
  rationale: 문맥상 의가 만들어 내는 결과를 가리키므로, 단순한 노동보다 ‘행위’가 더 자연스럽고 원문의 ‘work’와도 대응됩니다.
- source_word: הַצְּדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: צדק
  rationale: 여기서는 도덕적 상태이자 하나님 앞에서의 올바름을 가리키므로, POB 기본 용례에 따라 ‘의’로 옮겼습니다.
- source_word: עֲבֹדַת
  english_pob_choice: service
  chosen_korean: 섬김
  alternatives_korean:
  - 봉사
  - 사역
  - 예배
  lexicon: עבד
  rationale: revert된 POB가 ‘service’를 유지하므로, 종교적 예배보다 넓은 ‘섬김’이 원문과 영어 모두에 가장 가깝습니다.
- source_word: הַשְׁקֵט וָבֶטַח
  english_pob_choice: quietness and security
  chosen_korean: 영원한 평온과 안전
  alternatives_korean:
  - 고요함과 안전
  - 잠잠함과 안전
  - 평안과 안전
  lexicon: שקט / בטח
  rationale: 두 명사성 표현을 한국어에서 자연스럽게 살려 ‘평온과 안전’으로 옮기고, 이어지는 עַד־עוֹלָם을 반영해 ‘영원한’을 앞에 두었습니다.
theological_decisions:
- issue: 의의 결과와 의의 섬김을 어떻게 구분할지
  chosen_reading: 첫 절반은 의의 ‘행위’가 평강이 되고, 뒤 절반은 의의 ‘섬김’이 영원한 평온과 안전을 이룹니다.
  alternative_readings:
  - 의의 열매가 평강이 되고
  - 의의 효과가 평온과 안전이 됩니다
  rationale: WLC는 결과를 뜻하는 מַעֲשֵׂה와 직무/섬김을 뜻하는 עֲבֹדַת를 나란히 두어, 같은 뜻의 반복이 아니라 두 측면을 병치합니다.
  doctrine_reference: 문맥상 의의 열매와 의로운 삶의 지속적 실천을 함께 강조합니다.
