base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: ko
  text: 만군의 야훼께서 내 귀에 이렇게 드러내셨습니다. “이 죄악은 너희에게서 속죄되지 않을 것이며, 너희가 죽을 때까지 그러할 것이다.” 만군의 주 하나님께서 말씀하십니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 עָוֹן은 ‘죄’보다 더 넓게 죄책과 왜곡된 상태를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속죄되지 않을’은 כפר의 부정문을 직역한 것으로, ‘용서되지 않을’보다 속죄-덮음의 이미지를 더 직접적으로 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: 야훼
  rationale: 본문의 צְבָאוֹת를 ‘만군의’로 살리고, YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 영어 POB의 LORD를 그대로 따르기보다 원문 신명 호칭을 드러내는 쪽이 더 source-direct입니다.
- source_word: הֶעָוֺן הַזֶּה
  english_pob_choice: this iniquity
  chosen_korean: 이 죄악
  alternatives_korean:
  - 이 죄
  - 이 불의
  lexicon: עָוֹן
  rationale: עָוֹן은 단순한 행위만이 아니라 뒤틀린 죄책/죄악의 무게를 포함하므로, 문맥상 ‘이 죄악’이 가장 자연스럽습니다.
- source_word: יְכֻפַּר
  english_pob_choice: will not be atoned for
  chosen_korean: 속죄되지 않을
  alternatives_korean:
  - 용서되지 않을
  - 덮여지지 않을
  lexicon: כפר
  rationale: כפר의 핵심은 속죄/덮음의 행위이며, 여기서는 부정문으로 그 효력을 거절하는 표현이므로 ‘속죄되지 않을’이 가장 직접적입니다.
- source_word: עַד תְּמֻתוּן
  english_pob_choice: until you die
  chosen_korean: 너희가 죽을 때까지
  alternatives_korean:
  - 너희가 죽기까지
  - 너희가 죽을 때까지는
  lexicon: מות
  rationale: 히브리어 עד는 한계 시점을 나타내므로, 결과적으로 ‘죽을 때까지’가 자연스럽고 예언적 경고의 어조를 유지합니다.
theological_decisions:
- issue: YHWH 호칭을 영어 POB의 LORD 대신 어떻게 반영할지
  chosen_reading: 원문 신명 호칭을 따라 ‘야훼’로 옮기고, צְבָאוֹת은 ‘만군의’로 처리했습니다.
  alternative_readings:
  - 만군의 주님
  - 만군의 여호와
  rationale: 본 절은 야훼의 선포를 직접 드러내는 신탁이므로, 번역상 일반적 예배언어보다 원문 호칭의 투명성이 더 중요합니다.
  doctrine_reference: 출 3:15; 사 6:3
