id: ISA.22.4
reference: Isaiah 22:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֥ן אָמַ֛רְתִּי שְׁע֥וּ מִ/נִּ֖י אֲמָרֵ֣ר בַּ/בֶּ֑כִי אַל תָּאִ֣יצוּ לְ/נַֽחֲמֵ֔/נִי עַל שֹׁ֖ד בַּת עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
  footnotes:
  - marker: a
    text: Or 'Turn away from me; I will weep bitterly.' The Hebrew can be rendered more literally, 'be bitter in weeping.'
    reason: lexical_alternative
  - marker: b
    text: '''The daughter of my people'' is a prophetic poetic expression for my people, personified as a daughter.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 내가 말하였습니다[a], “내게서 눈을 돌리십시오. 내가 쓰라리게 울겠습니다. 내 백성의 딸의 파멸 때문에 나를 위로하려고 애쓰지 마십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내게서 돌아서십시오. 내가 쓰라리게 울겠습니다.” 히브리어는 더 직역하면 “울음에서 쓰라리다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 백성의 딸’은 예언서에서 흔한 시적 표현으로, 백성을 딸로 의인화한 말입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  english_pob_choice: Look away from me
  chosen_korean: 내게서 눈을 돌리십시오
  alternatives_korean:
  - 내게서 돌아서십시오
  - 나를 외면하십시오
  lexicon: HALOT
  rationale: 명령형 복수의 시각적 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 간절한 요청으로 들리는 표현을 택했습니다.
- source_word: אֲמָרֵר בַּבֶּכִי
  english_pob_choice: let me weep bitterly
  chosen_korean: 내가 쓰라리게 울겠습니다
  alternatives_korean:
  - 내가 통곡하겠습니다
  - 울며 쓰라려하겠습니다
  lexicon: HALOT
  rationale: '''쓰라리게''로 מרר의 강한 슬픔의 맛을 살리고, ‘울겠습니다’로 문맥상 허용되는 자발적 결심의 뉘앙스를 자연스럽게 옮겼습니다.'
- source_word: תָּאִיצוּ לְנַחֲמֵנִי
  english_pob_choice: Do not labor to comfort me
  chosen_korean: 나를 위로하려고 애쓰지 마십시오
  alternatives_korean:
  - 나를 위로하려고 서두르지 마십시오
  - 나를 달래려고 밀어붙이지 마십시오
  lexicon: HALOT
  rationale: אוץ의 ‘재촉하다/애쓰다’ 성격을 살려, 원치 않는 위로를 강요하는 뉘앙스를 현대어로 옮겼습니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성의 딸의
  - 내 백성
  lexicon: HALOT
  rationale: 예언서의 인격화 표현을 그대로 유지해 문학적 긴장과 정서를 보존했습니다.
theological_decisions:
- issue: ‘딸’이라는 예언적 인격화 표현을 직역할지 해석해 풀어쓸지
  chosen_reading: 본문의 은유를 유지하여 ‘내 백성의 딸’로 번역했습니다.
  alternative_readings:
  - 내 백성
  - 예루살렘
  - 시온
  rationale: 본문이 의도한 애가의 정서와 수사적 힘을 보존하려면 은유를 유지하는 편이 가장 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
