base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
  footnotes:
  - marker: a
    text: Or 'Turn away from me; I will weep bitterly.' The Hebrew can be rendered more literally, 'be bitter in weeping.'
    reason: lexical_alternative
  - marker: b
    text: '''The daughter of my people'' is a prophetic poetic expression for my people, personified as a daughter.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 내가 말하였습니다[a], “내게서 눈을 돌리십시오. 내가 비통하게 울겠습니다. 내 백성의 딸이 당한 파괴 때문에 나를 위로하려고 애쓰지 마십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내게서 돌아서십시오. 내가 비통하게 울겠습니다.” 히브리어 표현을 더 직역하면 “울음 가운데 비통해하겠다”입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 백성의 딸’은 예언서에서 흔한 시적 표현으로, 백성을 딸로 의인화한 말입니다.
    reason: cultural_note
