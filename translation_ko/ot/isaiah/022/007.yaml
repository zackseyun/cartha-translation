  text: וַ/יְהִ֥י מִבְחַר עֲמָקַ֖יִ/ךְ מָ֣לְאוּ רָ֑כֶב וְ/הַ/פָּ֣רָשִׁ֔ים שֹׁ֖ת שָׁ֥תוּ הַ/שָּֽׁעְרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/007.yaml
  text: And your choicest valleys were filled with chariots[a], and the horsemen took their positions at the gate.
  footnotes:
  - marker: a
    text: Or 'stationed themselves at the gate'; the Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 가장 좋은 골짜기들은 병거로 가득 찼으며, 기병들은 성문에 정렬해 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성문에 배치되었다'로 옮길 수 있습니다. 히브리어는 강조를 위한 부정사 절대형과 유한동사를 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  english_pob_choice: your choicest valleys
  chosen_korean: 네 가장 좋은 골짜기들
  alternatives_korean:
  - 네 최고의 골짜기들
  - 네 좋은 골짜기들
  lexicon: HALOT
  rationale: מִבְחַר의 선택된/가장 좋은 뉘앙스를 살려, 도시를 향한 2인칭 여성 단수 호칭을 한국어에서 자연스럽게 옮겼습니다.
- source_word: מָלְאוּ רָכֶב
  english_pob_choice: were filled with chariots
  chosen_korean: 병거로 가득 찼으며
  alternatives_korean:
  - 병거들로 가득 찼으며
  - 병거로 가득 차
  lexicon: HALOT
  rationale: רָכֶב은 집합적으로 병거 군세를 가리키므로, 한국어에서는 단순하고 직접적인 '병거'를 택해 군사적 장면을 분명히 했습니다.
- source_word: הַפָּרָשִׁים
  english_pob_choice: the horsemen
  chosen_korean: 기병들은
  alternatives_korean:
  - 말탄 자들은
  - 승마병들은
  lexicon: HALOT
  rationale: 군사적 맥락에서 mounted troops의 의미를 가장 자연스럽게 드러내는 현대 한국어 표현으로 옮겼습니다.
- source_word: שֹׁת שָׁתוּ
  english_pob_choice: took their positions
  chosen_korean: 정렬해 섰습니다
  alternatives_korean:
  - 자리를 잡았습니다
  - 배치되었습니다
  - 성문에 섰습니다
  lexicon: HALOT
  rationale: 부정사 절대형+유한동사의 강조를 한국어에서 동작의 확정성과 배치 상태로 살리기 위해 '정렬해 섰습니다'를 선택했습니다.
theological_decisions:
- issue: 예루살렘을 향한 2인칭 여성 단수 호칭
  chosen_reading: '''네''로 일관하여 도시를 인격화한 예언적 خطاب을 유지했습니다.'
  alternative_readings:
  - '''당신의''로 완화'
  - 직접 호칭을 삭제
  rationale: 원문이 העיר/ירושלים을 여성 단수로 직접 부르므로, 한국어에서도 그 수사적 긴장과 책망의 직접성을 보존하는 것이 적절합니다.
  doctrine_reference: 예언서의 인격화된 도시 خطاب
