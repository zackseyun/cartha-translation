  rationale: 원문의 וְהָיָה를 ‘그 날에 이런 일이 있을 것입니다’로 명시하여 예언적 미래 도입을 보존했습니다. ‘부를 것입니다’는 קרא의 기본 의미를 유지하며, 각주는 임명·위임을 위한 소환이라는 가능한 뉘앙스를 보충합니다. 부칭은 ‘곧’으로 동격 관계를 자연스럽게 드러냈습니다.
  reviewer_model: gpt-5.6-terra
