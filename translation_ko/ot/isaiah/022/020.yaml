id: ISA.22.20
reference: Isaiah 22:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/קָרָ֣אתִי לְ/עַבְדִּ֔/י לְ/אֶלְיָקִ֖ים בֶּן חִלְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
  footnotes:
  - marker: a
    text: Or 'I will summon.' The Hebrew verb can carry the sense of calling someone for appointment or commission.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 내가 내 종 엘리아김 — 힐기야의 아들 — 을 부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소집할 것입니다’. 히브리어 동사는 임명이나 위임을 위해 사람을 부르는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall happen
  chosen_korean: 그 날에 … 을 것입니다
  alternatives_korean:
  - 그리고 … 될 것입니다
  - 그 날에 … 일 것입니다
  lexicon: HALOT
  rationale: 예언적 미래 도입 공식인 היה를 한국어의 자연스러운 미래 표현으로 옮기되, 문맥상의 선언성을 살리기 위해 ‘…을 것입니다’를 택했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 때에
  lexicon: HALOT
  rationale: 히브리 예언 문맥의 정형적 시간표현을 간결하고 자연한 한국어로 유지했습니다.
- source_word: לְעַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 내 일꾼
  lexicon: HALOT
  rationale: 이 본문에서는 엘리아김에 대한 임명/위임의 호칭이므로, 사회적 속박을 전면에 내세우는 ‘노예’보다 문맥상 적절한 ‘종’을 택했습니다.
- source_word: וְקָרָאתִי
  english_pob_choice: I will call
  chosen_korean: 부를 것입니다
  alternatives_korean:
  - 호출할 것입니다
  - 소집할 것입니다
  lexicon: HALOT
  rationale: קרא의 ‘부르다/호명하다’ 의미를 살려, 임명 또는 지명을 포함할 수 있는 넓은 뜻을 과도하게 좁히지 않았습니다.
- source_word: בֶּן חִלְקִיָּהוּ
  english_pob_choice: son of Hilkiah
  chosen_korean: 힐기야의 아들
  alternatives_korean:
  - 힐기야의 아들인
  - 힐기야의 아들
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 한국어 관용에 맞게 소유격으로 옮겼습니다.
theological_decisions:
- issue: לְעַבְדִּי의 위임적 호칭 유지
  chosen_reading: ‘내 종’으로 번역해, 하나님이 엘리아김을 부르시는 임명/위임의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘내 노예’로 번역
  - ‘내 일꾼’으로 번역
  rationale: 본문은 엘리아김의 신분을 사회적 노예 상태로 강조하기보다, 하나님의 주권 아래 세워진 직무적 호칭으로 제시합니다. 따라서 전통 교회어보다 स्रोत의 기능을 드러내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
