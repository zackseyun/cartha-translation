id: ISA.22.5
reference: Isaiah 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יוֹם֩ מְהוּמָ֨ה וּ/מְבוּסָ֜ה וּ/מְבוּכָ֗ה לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/גֵ֣יא חִזָּי֑וֹן מְקַרְקַ֥ר קִ֖ר וְ/שׁ֥וֹעַ אֶל הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
  footnotes:
  - marker: a
    text: Or 'for the Lord GOD of Armies' or 'belonging to the Lord GOD of Armies'; the Hebrew preposition can mark relation/possession as well as source.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a battering down of the wall'; the verb form is difficult and may also be understood as 'breaking down' or 'demolishing.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and shouting toward the mountain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 계시의 골짜기에서 만군의 주 야훼께로부터 오는, 소동과 짓밟힘과 혼란의 날, 곧 성벽을 허무는 것과 산을 향한 외침의 날입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 주 야훼를 위한’ 혹은 ‘만군의 주 야훼에 속한’으로도 이해할 수 있습니다. 히브리어 전치사 ל는 관계와 소속뿐 아니라 출처도 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘성벽을 들이받아 허무는 것’에 가깝습니다. 동사형은 난해하며, ‘무너뜨리는 것’ 또는 ‘허무는 것’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘산을 향해 외치는 소리’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי / יוֹם
  english_pob_choice: For it is a day
  chosen_korean: 이는 …의 날이며
  alternatives_korean:
  - 이는 … 날입니다
  - 이는 …의 때입니다
  lexicon: HALOT
  rationale: כִּי는 앞 문맥을 받는 설명의 연결로 보고 ‘이는’으로 자연스럽게 풀었고, יוֹם은 예언문맥의 시간 표지로 ‘날’로 직역했습니다.
- source_word: מְהוּמָה / מְבוּסָה / מְבוּכָה
  english_pob_choice: tumult and trampling and confusion
  chosen_korean: 혼란과 짓밟힘과 당혹
  alternatives_korean:
  - 소동과 짓밟힘과 혼란
  - 혼돈과 밟힘과 어지러움
  lexicon: HALOT
  rationale: 세 낱말의 병렬과 재난의 물리성을 살리기 위해 ‘혼란·짓밟힘·당혹’으로 옮겼으며, 특히 מְבוּסָה의 ‘trampling’은 ‘짓밟힘’으로 구체화했습니다.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: from the Lord GOD of Armies
  chosen_korean: 만군의 주 야훼께로부터 오는
  alternatives_korean:
  - 만군의 주 야훼의
  - 만군의 주 야훼에 속한
  lexicon: HALOT
  rationale: ל은 출처/관계/소속 모두 가능하지만, 문맥상 심판의 근원을 드러내는 ‘께로부터 오는’이 가장 분명합니다. יְהוָה는 프로젝트 기본에 따라 ‘야훼’, צְבָאוֹת는 의미를 살려 ‘만군의’로 옮겼습니다.
- source_word: בְּגֵיא חִזָּיוֹן
  english_pob_choice: in the Valley of Vision
  chosen_korean: 계시의 골짜기에서
  alternatives_korean:
  - 환상의 골짜기에서
  - 환시의 골짜기에서
  lexicon: HALOT
  rationale: חִזָּיוֹן은 단순한 시각적 환상보다 계시/환시의 뜻이 강하므로, 한국어에서 오해를 줄이기 위해 ‘계시’로 풀었습니다. 지명성은 ‘골짜기’로 유지했습니다.
- source_word: מְקַרְקַר קִיר
  english_pob_choice: a battering down of the wall
  chosen_korean: 성벽이 무너져 내리는 것
  alternatives_korean:
  - 성벽을 들이받아 허무는 것
  - 성벽이 허물어지는 것
  lexicon: HALOT
  rationale: 난해한 동사형의 파괴 이미지를 보존하되, 한국어에서 자연스러운 진행형 파괴로 옮겼습니다. ‘벽’보다 도시 방어벽의 맥락을 드러내는 ‘성벽’이 더 적절합니다.
- source_word: וְשׁוֹעַ אֶל הָהָר
  english_pob_choice: and a cry to the mountain
  chosen_korean: 산을 향한 외침
  alternatives_korean:
  - 산을 향한 부르짖음
  - 산을 향한 외침과 소리
  lexicon: HALOT
  rationale: 방향 표지 אֶל을 살려 ‘향한’으로 옮겼고, נoun ‘שׁוֹעַ’는 짧고 긴박한 음성을 담는 ‘외침’으로 번역했습니다.
theological_decisions:
- issue: YHWH와 אֲדֹנָי의 합성 칭호
  chosen_reading: 만군의 주 야훼
  alternative_readings:
  - 만군의 주님
  - 주 야훼 만군의 하나님
  rationale: 본문의 אֲדֹנָי יְהוִה צְבָאוֹת는 심판권과 언약명을 함께 드러내므로, ‘주 야훼’와 ‘만군의’를 함께 살려 신학적 밀도를 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה → 야훼; אֲדֹנָי as 주/주님'
- issue: בְּגֵיא חִזָּיוֹן의 지명 성격
  chosen_reading: 계시의 골짜기
  alternative_readings:
  - 환상의 골짜기
  - 환시의 골짜기
  rationale: 해당 표현은 단순한 심리적 환상보다 예언적 계시의 지명을 가리키므로, 독자가 메시지의 예언성을 이해하도록 ‘계시’로 번역했습니다.
  doctrine_reference: POB source-direct rendering principle
