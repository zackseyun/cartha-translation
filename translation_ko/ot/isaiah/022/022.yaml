revisions:
- from: 나는 다윗의 집의 열쇠를 그의 어깨에 둘 것입니다. 그는 열면 아무도 닫지 못하고, 닫으면 아무도 열지 못합니다.[a]
  to: 내가 다윗 집의 열쇠를 그의 어깨에 둘 것입니다. 그가 열면 아무도 닫지 못할 것이며, 그가 닫으면 아무도 열지 못할 것입니다.[a]
  rationale: 원문의 미래적 약속과 열고 닫는 행위의 대칭을 한국어에서 더 직접적으로 살렸습니다. ‘다윗 집’은 원문의 ‘다윗의 집’을 보존하며, 후대의 메시아적 또는 교리적 해석을 본문에 덧붙이지 않습니다. 각주는 영어 POB 감사 기록의 정경적 상호참조를 유지하되 자연스러운 한국어로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:49Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 ‘내가 … 둘 것이다’와 열고 닫는 병행 구조, 그리고 누구도 그 행동을 뒤집지 못하는 권위를 충실히 반영합니다. 다만 초안의 조건형 ‘열면/닫으면’은 원문의 연속된 미래 진술보다 조건 관계를 다소 강하게 만들 수 있어 미래형 병행으로 고쳤습니다.
  naturalness: ‘다윗의 집의’라는 연속 소유격은 현대 표준 한국어에서 다소 무겁습니다. ‘다윗 집의’로 다듬고, 문장의 병행을 분명히 했습니다. 각주의 ‘메아리처럼 나타납니다’도 자연스러운 문어 표현으로 정리했습니다.
  terminology: ‘다윗 집’, ‘열쇠’, ‘어깨’, ‘열다/닫다’는 원문의 표현과 역사적 문맥을 불필요하게 교리화하지 않고 유지합니다. ‘다윗 왕실’처럼 해설적인 표현으로 확대하지 않았습니다.
  issues:
