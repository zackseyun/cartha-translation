    rationale: 의미상 오류는 없으나 현대 한국어에서 다소 부자연스럽습니다. ‘다윗 집의 열쇠’가 더 간결하고 자연스럽습니다.
  - severity: low
    issue: 각주의 관용적 표현
    rationale: ‘메아리처럼 나타납니다’보다 ‘반영되어 있습니다’가 현대 정중 문체에서 더 자연스럽고, 계시록 3:7과의 문학적 반향이라는 각주 기능을 분명히 합니다.
