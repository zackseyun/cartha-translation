id: ISA.22.22
reference: Isaiah 22:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
  footnotes:
  - marker: a
    text: This imagery of opening and shutting as unchallengeable authority is echoed in Revelation 3:7.
    reason: cross_reference
translation:
  language: ko
  text: 나는 다윗의 집의 열쇠를 그의 어깨에 둘 것입니다. 그는 열면 아무도 닫지 못하고, 닫으면 아무도 열지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이러한 열고 닫는 이미지는 거스를 수 없는 권위를 가리키며, 요한계시록 3:7에 메아리처럼 나타납니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will place
  chosen_korean: 둘 것입니다
  alternatives_korean:
  - 놓을 것입니다
  - 맡길 것입니다
  lexicon: HALOT
  rationale: נתן은 ‘주다’뿐 아니라 ‘두다/놓다’의 뜻을 가질 수 있으며, 열쇠를 어깨에 얹는 구체적 동작에는 ‘두다’가 가장 자연스럽고 간결합니다.
- source_word: מַפְתֵּחַ
  english_pob_choice: the key
  chosen_korean: 열쇠
  alternatives_korean:
  - 그 열쇠
  - 한 열쇠
  lexicon: HALOT
  rationale: 특정 관직 표지로서의 열쇠를 가리키므로 관사에 해당하는 요소를 별도로 살리지 않아도 한국어에서는 자연스럽게 ‘열쇠’로 충분합니다.
- source_word: בֵּית דָּוִד
  english_pob_choice: the house of David
  chosen_korean: 다윗의 집
  alternatives_korean:
  - 다윗 왕실
  - 다윗 왕가
  lexicon: HALOT
  rationale: 문맥이 곧바로 왕조적·행정적 집안을 가리키지만, 본문 자체를 넘어서 설명을 덧붙이지 않기 위해 직역에 가까운 ‘다윗의 집’을 택했습니다.
- source_word: עַל שִׁכְמוֹ
  english_pob_choice: on his shoulder
  chosen_korean: 그의 어깨에
  alternatives_korean:
  - 어깨 위에
  - 그의 어깨 위에
  lexicon: HALOT
  rationale: 어깨에 걸친 표지라는 이미지를 살리면서도 한국어 문장에서는 가장 평이한 표현이어서 ‘그의 어깨에’로 옮겼습니다.
theological_decisions:
- issue: 열고 닫는 권위의 해석을 본문 안에서 얼마나 드러낼 것인가
  chosen_reading: 본절의 즉각적 의미를 유지하고, 열고 닫는 행위의 무제한 권위를 한국어 문장 자체로만 드러냈습니다.
  alternative_readings:
  - 메시아적 권위나 요한계시록 3:7의 성취를 본문에 직접 반영한다
  - ‘아무도’ 대신 ‘어느 누구도’ 같은 더 해설적인 표현을 쓴다
  rationale: 이 구절은 다윗 왕가의 집에 위임된 권세를 말하므로, 후대의 계시록적 연결은 본문에 삽입하지 않고 번역의 범위 밖에 둬야 합니다.
  doctrine_reference: 원문 우선 원칙; 정경적 연관성은 각주로 보존
