lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 또한
  lexicon: HALOT
  rationale: 문두의 접속 흐름을 자연스럽게 살리면서도, 뒤따르는 직접목적어를 무리 없이 이어 주는 가장 간결한 표준어 표현입니다.
- source_word: בָּתֵּי יְרוּשָׁלִַ֖ם
  english_pob_choice: the houses of Jerusalem
  chosen_korean: 예루살렘의 집들
  alternatives_korean:
  - 예루살렘의 가옥들
  - 예루살렘 집들
  lexicon: HALOT
  rationale: 히브리어의 소유/귀속 관계를 그대로 살려, 도시 내부의 주택들을 가리키는 뜻을 자연스럽게 옮겼습니다.
- source_word: סְפַרְתֶּ֑ם
  english_pob_choice: you counted
  chosen_korean: 셌으며
  alternatives_korean:
  - 헤아렸으며
  - 계산했으며
  lexicon: HALOT
  rationale: ספר의 기본 의미인 ‘세다’를 직접 반영했고, 본문 흐름상 다음 행위와 병렬을 이루도록 연결했습니다.
- source_word: וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים
  english_pob_choice: you tore down the houses
  chosen_korean: 그 집들을 허물었습니다
  alternatives_korean:
  - 그 집들을 무너뜨렸습니다
  - 그 집들을 헐었습니다
  lexicon: HALOT
  rationale: נתץ는 건물을 ‘허물다/무너뜨리다’의 파괴적 행위를 나타내므로, 방어 공사를 위한 철거라는 문맥을 살리되 과도한 의역은 피했습니다.
- source_word: לְ/בַצֵּ֖ר הַ/חוֹמָֽה
  english_pob_choice: to fortify the wall
  chosen_korean: 성벽을 보강하려고
  alternatives_korean:
  - 성벽을 견고하게 하려고
  - 성벽을 방비하려고
  lexicon: HALOT
  rationale: בצר의 목적 용법을 살려 ‘보강하다’로 옮기면, 집을 허무는 행위가 성벽 강화라는 목적을 향한다는 점이 분명해집니다.
theological_decisions:
- issue: 도시의 주택 철거 행위와 방어 목적의 긴장
  chosen_reading: 본문은 예루살렘 방어를 위해 민가를 철거한 실질적 도시 공사 행위를 기술합니다.
  alternative_readings:
  - 단순한 파괴 행위로만 읽는 해석
  - 비유적 진술로 완화하는 해석
  rationale: 히브리어 동사와 목적구가 모두 물리적 조치를 가리키므로, 역사적·문자적 긴장을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사-문법적 해석 원리
