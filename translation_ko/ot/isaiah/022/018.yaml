revisions:
- from: 그는 반드시 당신을 단단히 감아 올려, 공처럼 넓은 땅으로 던지실 것입니다. 거기에서 당신은 죽을 것이며, 거기에서 당신의 영광의 병거들이 있을 것입니다. 당신은 당신 주인의 집에 대한 수치입니다.[a][b][c]
  to: 그분께서 반드시 당신을 공처럼 단단히 말아[a] 넓은 땅으로 내던지실 것입니다.[b] 거기에서 당신은 죽을 것이며, 거기에는 당신의 영광이던 병거들도 있을 것입니다.[c] 당신 주인의 집의 수치여!
  rationale: 원문의 공 비유와 강한 추방 이미지를 ‘공처럼 단단히 말아 … 내던지실 것입니다’로 자연스럽게 재현하고, 신적 행위 주어에 맞추어 높임을 일관되게 적용했습니다. 반복된 שָׁמָּה는 ‘거기에서/거기에는’으로 보존했습니다. 마지막 비난은 원문의 직접 호칭 어조를 살렸으며, 병거 표현은 한국어의 자연스러움과 원문의 압축된 소유격 의미 사이의 균형을 위해 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:38Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 심판·추방의 큰 뜻과 반복되는 ‘거기에서’를 대체로 보존합니다. 그러나 ‘감아 올려’는 צנף의 이 문맥상 말아 뭉쳐 내던지는 동작과 잘 맞지 않으며, ‘던지실’만 높임 선어말을 써서 주어와 서술의 높임이 불균형합니다. 마지막 구절은 원문의 직접적인 호칭/동격적 비난을 서술문으로 바꾸어 어조를 약화합니다.
  naturalness: ‘공처럼 넓은 땅으로 던지다’는 수식 관계가 다소 불분명하고, ‘당신의 영광의 병거들’도 현대 한국어에서는 어색합니다. ‘공처럼 단단히 말아 … 내던지실 것입니다’, ‘당신의 영광이던 병거들’로 하면 이미지와 문장이 모두 자연스럽습니다.
  terminology: ‘병거’와 인간 상관을 뜻하는 ‘주인’은 적절합니다. קְלוֹן은 ‘수치’로 유지할 수 있으나, 본문의 예언적 조소를 위해 ‘…의 수치여’라는 호칭형을 보존하는 편이 좋습니다.
  issues:
  - severity: medium
    issue: ‘감아 올려’와 ‘던지실 것입니다’의 결합
    rationale: 원문의 강조된 צנף 및 공 비유는 대상을 단단히 말아 뭉쳐 내던지는 이미지를 이룹니다. ‘감아 올리다’는 위로 감아 올리는 뜻이 강하여 부적합하며, ‘그는’에 ‘-시-’를 결합한 현 초안은 높임도 불균형합니다.
  - severity: medium
    issue: 마지막 비난의 호칭을 단정문으로 변경
    rationale: קְלוֹן בֵּית אֲדֹנֶיךָ는 ‘당신 주인의 집의 수치여’라는 직접 호칭/동격적 질책으로 이해하는 것이 원문의 어조에 더 가깝습니다. ‘당신은 … 수치입니다’는 뜻은 전달하지만 호칭의 날카로움을 평문화합니다.
  - severity: low
    issue: ‘당신의 영광의 병거들’의 비자연성
    rationale: 히브리어 결합구를 그대로 옮긴 표현은 한국어에서 매끄럽지 않습니다. ‘당신의 영광이던 병거들’은 병거가 그가 자랑하던 영광이었다는 가능성을 보존하면서 자연스럽습니다.
