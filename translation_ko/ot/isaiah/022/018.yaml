id: ISA.22.18
reference: Isaiah 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָנ֤וֹף יִצְנָפְ/ךָ֙ צְנֵפָ֔ה כַּדּ֕וּר אֶל אֶ֖רֶץ רַחֲבַ֣ת יָדָ֑יִם שָׁ֣מָּ/ה תָמ֗וּת וְ/שָׁ֨מָּ/ה֙ מַרְכְּב֣וֹת כְּבוֹדֶ֔/ךָ קְל֖וֹן בֵּ֥ית אֲדֹנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
  footnotes:
  - marker: a
    text: Or 'He will surely wind you up tightly' or 'He will surely roll you up tightly.' The Hebrew uses an intensified form of the same root together with a cognate noun for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to a land broad of hands,' an idiom for a wide or spacious land.
    reason: cultural_note
  - marker: c
    text: Or 'your glorious chariots' / 'the chariots that were your glory.' The Hebrew expression may refer to the chariots in which he took pride.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 반드시 당신을 단단히 감아 올려, 공처럼 넓은 땅으로 던지실 것입니다. 거기에서 당신은 죽을 것이며, 거기에서 당신의 영광의 병거들이 있을 것입니다. 당신은 당신 주인의 집에 대한 수치입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 어근의 강조형과 관련 명사가 함께 쓰여, ‘단단히 휘감다/말다’의 강한 반복 효과를 냅니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘손들이 넓은 땅’이지만, 여기서는 ‘넓은 땅’이라는 관용적 의미를 전달합니다.
    reason: cultural_note
  - marker: c
    text: ‘영광의 병거들’은, 그가 자랑하던 화려한 병거들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  english_pob_choice: He will surely wrap you up tightly
  chosen_korean: 반드시 당신을 단단히 감아 올려
  alternatives_korean:
  - 반드시 당신을 단단히 둘러 감아
  - 반드시 당신을 꽁꽁 말아
  lexicon: HALOT
  rationale: 강조형 용법을 살리면서, צנף의 ‘감다/둘러싸다’ 의미를 한국어로 자연스럽게 옮겼습니다. ‘감아 올려’는 묶어 올리듯 단단히 휘감는 이미지를 유지합니다.
- source_word: כַּדּוּר
  english_pob_choice: like a ball
  chosen_korean: 공처럼
  alternatives_korean:
  - 구슬처럼
  - 둥근 공처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 둥글게 뭉쳐진 덩어리 이미지이므로 현대 한국어에서 가장 직관적인 ‘공처럼’을 택했습니다.
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  english_pob_choice: into a broad land
  chosen_korean: 넓은 땅으로
  alternatives_korean:
  - 광활한 땅으로
  - 넓고 탁 트인 땅으로
  lexicon: HALOT
  rationale: 직역하면 ‘손들이 넓은 땅’이라는 관용구지만, 의미는 광활함입니다. 한국어에서는 과도한 설명 없이 ‘넓은 땅’으로 옮겨 관용적 의미를 보존했습니다.
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  english_pob_choice: the chariots of your glory
  chosen_korean: 당신의 영광의 병거들
  alternatives_korean:
  - 당신의 화려한 병거들
  - 당신이 자랑하던 병거들
  lexicon: HALOT
  rationale: 히브리어의 소유격 결합을 비교적 가깝게 살려 ‘영광의 병거들’로 옮겼습니다. 이 표현은 스스로 자랑하던 위세의 상징을 남겨 둡니다.
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  english_pob_choice: O shame of your master's house
  chosen_korean: 당신은 당신 주인의 집에 대한 수치입니다
  alternatives_korean:
  - 오, 당신 주인의 집의 수치여
  - 당신 주인의 집에 치욕을 가져온 자여
  lexicon: HALOT
  rationale: 예언적 조소를 현대 한국어에서 자연스러운 서술형으로 재현했습니다. ‘주인’은 인간 상관을 가리키는 אֲדֹן에 맞추었고, ‘수치’는 קְלוֹן의 직설성을 유지합니다.
theological_decisions:
- issue: 예언적 조롱문의 호칭과 문장 형식
  chosen_reading: 직접 호칭을 감탄형으로 풀기보다, ‘당신은 … 수치입니다’라는 단정형으로 옮겼습니다.
  alternative_readings:
  - ‘오, 당신 주인의 집의 수치여’와 같은 직접 호칭
  - ‘당신은 당신 주인의 집의 치욕입니다’와 같은 더 완곡한 표현
  rationale: 원문은 비난과 조롱을 강하게 실어 주는 예언적 선언입니다. 한국어에서는 감탄호칭보다 단정형이 더 날카롭게 전달되며, 동시에 문맥의 수치를 분명히 드러냅니다.
  doctrine_reference: 예언서의 심판 선언 문체 보존
- issue: ‘병거들’의 의미 보존
  chosen_reading: 화려한 장식물로 약화시키지 않고 ‘병거들’을 유지했습니다.
  alternative_readings:
  - ‘수레들’
  - ‘화려한 전차들’
  rationale: 문맥상 כוח/영광의 과시를 상징하는 전쟁·권력 도구로서의 병거가 중요하므로, 전통적이지만 직관적인 ‘병거’가 본문의 위세와 조롱을 함께 살립니다.
  doctrine_reference: 문맥적 상징성 보존
