  lexicon: HALOT
  rationale: נָשָׂא는 여기서 무기를 전투 태세로 ‘지니다/메다’는 뜻이 자연스럽습니다. 한국어에서는 화살통을 ‘메다’가 군사적 맥락에 가장 잘 맞습니다.
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  english_pob_choice: with chariots and horsemen
  chosen_korean: 전차와 기병과 함께
  alternatives_korean:
  - 전차와 사람과 기병과 함께
  - 전차, 사람, 기병과 함께
  lexicon: HALOT
  rationale: 히브리어 열거가 압축되어 있어 한국어에서는 군사 편제를 자연스럽게 살려 ‘전차와 기병’으로 옮겼습니다. אָדָם은 이 문맥에서 별도 항목으로 두기보다 전투 병력의 총칭으로 이해했습니다.
- source_word: עֵרָה מָגֵן
  english_pob_choice: uncovered the shield
  chosen_korean: 방패를 드러냈습니다
  alternatives_korean:
  - 방패를 드러냈습니다
  - 방패를 벗겼습니다
  - 방패를 드러내어 준비했습니다
  lexicon: HALOT
  rationale: עֵרָה는 문자적으로 ‘드러내다/벗기다’의 뜻이므로 이미지를 보존해 ‘드러냈습니다’로 옮겼습니다. 전투 준비라는 해석은 너무 풀어쓰지 않으려 했습니다.
theological_decisions:
- issue: 군사 목록의 압축된 히브리어 구문 처리
  chosen_reading: ‘전차와 기병과 함께’로 간결하게 옮겨, 목록의 압축성과 전투 장면의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘전차, 사람, 기병과 함께’
  - ‘전차와 사람과 기병과 함께’
  rationale: 본문은 군사 용어를 압축해 병렬시키므로, 한국어도 과도한 문법 풀이는 피하고 이미지 중심으로 보존하는 것이 좋습니다.
  doctrine_reference: source-text fidelity / lexical restraint
