  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 자연스럽고, 표준 한국어 성서 표기에서도 엘람이 널리 쓰입니다.
- source_word: נָשָׂא אַשְׁפָּה
  english_pob_choice: bore the quiver
  chosen_korean: 화살통을 멨고
