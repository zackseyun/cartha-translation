id: ISA.22.23
reference: Isaiah 22:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
  footnotes:
  - marker: a
    text: Or 'fasten him like a peg in a firm place.'
    reason: lexical_alternative
  - marker: b
    text: '''Throne of honor'' may also be rendered ''glorious throne'' or ''seat of honor.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 견고한 곳에 말뚝처럼 박아 두고[a], 그는 그 아버지의 집안을 위한 영광의 보좌가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말뚝처럼 박아 두다’는 히브리어의 구체적인 동작 이미지를 따른 번역입니다. ‘견고한 곳에 말뚝처럼 고정하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광의 보좌’는 ‘영광스러운 보좌’, ‘영예의 보좌’ 또는 ‘명예의 자리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  english_pob_choice: I will drive him in
  chosen_korean: 내가 그를 단단한 곳에 말뚝처럼 박아 두며
  alternatives_korean:
  - 내가 그를 못처럼 박아 두며
  - 내가 그를 고정하여 두며
  lexicon: HALOT
  rationale: תקע의 구체적 동작은 단순한 ‘설치’보다 ‘박다/고정하다’에 가깝기 때문에, 원문의 이미지가 살아 있는 ‘말뚝처럼 박아 두다’로 옮겼습니다.
- source_word: יָתֵד
  english_pob_choice: peg
  chosen_korean: 말뚝
  alternatives_korean:
  - 못
  - 기둥
  lexicon: HALOT
  rationale: יָתֵד는 지지용으로 박는 물건을 가리키므로, 한국어에서는 ‘말뚝’이 가장 자연스럽고 물리적 이미지도 잘 전달합니다.
- source_word: בְּמָקוֹם נֶאֱמָן
  english_pob_choice: into a secure place
  chosen_korean: 단단한 곳에
  alternatives_korean:
  - 견고한 곳에
  - 믿을 만한 곳에
  lexicon: HALOT
  rationale: נֶאֱמָן의 핵심은 ‘믿을 만하고 흔들리지 않는’ 성격이므로, 문맥상 압축된 표현인 ‘단단한 곳’이 자연스럽게 그 의미를 담습니다.
- source_word: לְכִסֵּא כָבוֹד
  english_pob_choice: a throne of honor
  chosen_korean: 영광의 보좌
  alternatives_korean:
  - 존귀의 보좌
  - 명예의 보좌
  - 영광스러운 보좌
  lexicon: HALOT
  rationale: כִּסֵּא כָבוֹד는 단순한 자리보다 권위와 존귀를 지닌 왕좌의 이미지를 지니므로, POB의 ‘throne of honor’에 맞춰 ‘영광의 보좌’로 옮겼습니다.
- source_word: לְבֵית אָבִיו
  english_pob_choice: to his father's house
  chosen_korean: 자기 아버지의 집에
  alternatives_korean:
  - 그의 아버지의 집에
  - 아버지 집에
  lexicon: HALOT
  rationale: 히브리어의 관계 표현을 자연스러운 한국어로 옮기되, 소유와 소속의 관계를 분명히 드러내기 위해 ‘자기 아버지의 집’으로 번역했습니다.
theological_decisions:
- issue: 비유 이미지 보존
  chosen_reading: 말뚝과 보좌라는 구체적 비유를 그대로 살렸습니다.
  alternative_readings:
  - 그를 안정된 지도자로 만들어 그의 집안을 영예롭게 하신다
  rationale: 이 절은 엘리아김의 역할을 정치적 안정성으로만 풀기보다, ‘박아 두는 말뚝’과 ‘영광의 보좌’라는 이중 비유로 묘사합니다. 그 이미지를 보존해야 본문의 힘과 신학적 뉘앙스가 유지됩니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
