id: ISA.22.24
reference: Isaiah 22:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: ko
  text: 그의 아버지 집의 모든 영광이 그에게 달릴 것이니 곧 자손과 후손이며, 작은 그릇마다, 대접에서부터 모든 항아리에 이르기까지입니다.
  philosophy: formal
lexical_decisions:
- source_word: כֹּל כְּבוֹד
  english_pob_choice: all the honor
  chosen_korean: 모든 영광
  alternatives_korean:
  - 모든 명예
  - 모든 존귀
  lexicon: כָּבוֹד / כבוד
  rationale: 본문의 כָּבוֹד은 물질적 무게감과 사회적 존중을 함께 가질 수 있으나, POB의 ‘honor’에 맞추어 ‘영광’으로 옮겨 자연스럽고도 원뜻을 유지했습니다.
- source_word: בֵּית אָבָיו
  english_pob_choice: his father’s house
  chosen_korean: 그의 아버지 집
  alternatives_korean:
  - 그의 부친의 집
  - 아버지의 집안
  lexicon: בַּיִת
  rationale: 히브리어의 ‘집’은 건물보다 가문/가계를 가리키므로, 문맥에 따라 ‘집’으로 직역하되 한국어에서는 소유를 분명히 해 ‘그의 아버지 집’으로 처리했습니다.
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  english_pob_choice: the offspring and the offshoots
  chosen_korean: 자손과 후손
  alternatives_korean:
  - 자손과 가지친 것들
  - 태생과 갈라져 나온 것들
  lexicon: צֶאֱצָאִים / צְפִעוֹת
  rationale: 두 명사 모두 ‘무엇에서 나와 이어지는 것들’이라는 확장 이미지를 가지므로, 한국어에서 자연스러운 병렬로 ‘자손과 후손’이라 옮겨 계보적·파생적 뉘앙스를 살렸습니다.
- source_word: כְּלֵי הַקָּטָן ... וְעַד כָּל כְּלֵי הַנְּבָלִים
  english_pob_choice: every small vessel, from the bowls to all the jars
  chosen_korean: 작은 그릇마다, 대접에서부터 모든 항아리에 이르기까지
  alternatives_korean:
  - 작은 용기마다, 대접에서 모든 병에 이르기까지
  - 작은 기물마다, 그릇에서부터 모든 단지에 이르기까지
  lexicon: כְּלִי / אַגָּן / נֵבֶל
  rationale: 사물의 크기 대비를 드러내는 연쇄를 살리기 위해 일반명사 ‘그릇’을 쓰고, 구체 항목은 ‘대접’과 ‘항아리’로 옮겨 일상적이면서도 본문의 물건 목록을 분명히 했습니다.
theological_decisions:
- issue: ‘달릴 것이니’의 수동적 미래 표현
  chosen_reading: 명시적 대리수동으로 옮겨, 주체가 결국 하나님의 섭리 아래 물건을 지게 되는 상황을 드러냈습니다.
  alternative_readings:
  - ‘걸리게 될 것입니다’
  - ‘매달릴 것입니다’
  rationale: 히브리어 וְתָלוּ는 단순 행위보다 장차의 처지를 말하는 수동적/사역적 뉘앙스를 가질 수 있으므로, 한국어에서 문맥상 가장 자연스러운 ‘달릴 것이니’로 처리했습니다.
  doctrine_reference: 문맥상 심판과 몰락의 상징적 행위 표현
- issue: ‘영광’과 구체 물품 목록의 병치
  chosen_reading: 가문 전체의 ‘영광’이 그와 함께 매달리는 물건들로 구체화된다는 역설을 유지했습니다.
  alternative_readings:
  - ‘명예’로 완화
  - 목록을 상징적 의미로만 처리
  rationale: 본문은 추상명사와 물질 목록을 함께 제시해 풍자적 긴장을 만드므로, 이를 분리하지 않고 그대로 병치하여 원문의 효과를 보존했습니다.
  doctrine_reference: 예언서의 상징적 심판 어법
