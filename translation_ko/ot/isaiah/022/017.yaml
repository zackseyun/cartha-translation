  - 주님
  rationale: 신명사의 고유성을 보존하고, 본문이 하나님의 이름을 직접 호출하는 힘을 유지하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
