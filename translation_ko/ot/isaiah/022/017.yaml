  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 자여’로 옮길 수 있습니다. 히브리어는 매우 압축되어 있고 문법이 어렵습니다. גָּבֶר은 ‘사람’ 또는 ‘강한 자’를 뜻할 수 있으며, 직접 호격이 아니라 앞의 격렬한 내던짐과 관련된 말로 이해하기도 합니다.
    reason: alternative_reading
