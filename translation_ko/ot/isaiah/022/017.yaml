  terminology: ‘야훼’는 제시된 프로젝트 방침과 일치합니다. עטה의 강조형은 ‘단단히 감싸실 것입니다’로 무리 없이 반영됩니다. ‘버리다’는 원문에 없는 완료·파기 뉘앙스를 더하므로 제외하는 것이 좋습니다.
