  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
  footnotes:
  - marker: a
    text: Or 'will surely toss you with a violent tossing, O strong man'; the Hebrew is compact and difficult, and גָּבֶר may be taken as 'man/strong man' rather than direct address.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 야훼께서 강한 소용돌이처럼 당신을 내던지시고, 남자여, 단단히 감싸 버리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 자여, 폭력적인 소용돌이로 반드시 당신을 내던지실 것입니다’로 볼 수도 있습니다. 히브리어는 매우 압축적이고 어렵고, גָּבֶר은 직접 호격의 ‘남자’보다 ‘강한 자’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 감탄사를 현대 표준어 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명사 טetragrammaton을 ‘야훼’로 옮겨, 고유 이름의 직접성을 유지했습니다.
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  english_pob_choice: is about to hurl you away violently
  chosen_korean: 강한 소용돌이처럼 당신을 내던지시고
  alternatives_korean:
  - 거칠게 당신을 내던지시고
  - 세차게 당신을 흔드시고
  - 강하게 당신을 내치시고
  lexicon: HALOT
  rationale: 반복어가 만드는 강한 격렬성과 즉각성을 한국어에서 자연스럽게 드러내기 위해 ‘강한 소용돌이처럼’과 ‘내던지시고’로 압축해 옮겼습니다.
- source_word: גָּבֶר
  english_pob_choice: O man
  chosen_korean: 남자여
  alternatives_korean:
  - 사람아
  - 장부여
  - 강한 자여
  lexicon: HALOT
  rationale: 호격으로 기능하는 가능성을 살려 직접 호칭으로 처리했으며, 문맥상 ‘강한 자’로 확정하기보다 기본 뜻인 ‘남자’에 두었습니다.
- source_word: וְעֹטְךָ עָטֹה
  english_pob_choice: and wrap you up tightly
  chosen_korean: 단단히 감싸 버리실 것입니다
  alternatives_korean:
  - 단단히 둘러싸실 것입니다
  - 꽁꽁 감싸실 것입니다
  - 완전히 감싸실 것입니다
  lexicon: HALOT
  rationale: עטה의 ‘둘러싸다/감싸다’ 의미와 강조형 구문을 반영해, 종결의 단호함이 드러나는 ‘버리실 것입니다’와 결합했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
