  source_fidelity: ‘강한 소용돌이처럼’은 히브리어에 없는 비유를 도입합니다. טלטל 어근의 반복은 격렬한 내던짐/흔듦의 강조이지 ‘소용돌이’를 뜻하지 않습니다. 또한 גָּבֶר의 난해한 호격적 기능은 본문에서 보존하되 각주로 대안을 밝혀야 합니다.
