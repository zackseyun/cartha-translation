id: ISA.22.21
reference: Isaiah 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִלְבַּשְׁתִּ֣י/ו כֻּתָּנְתֶּ֗/ךָ וְ/אַבְנֵֽטְ/ךָ֙ אֲחַזְּקֶ֔/נּוּ וּ/מֶֽמְשֶׁלְתְּ/ךָ֖ אֶתֵּ֣ן בְּ/יָד֑/וֹ וְ/הָיָ֥ה לְ/אָ֛ב לְ/יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וּ/לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
  footnotes:
  - marker: a
    text: Or 'he will be a father'; the Hebrew metaphor denotes protective, responsible leadership, not biological paternity.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그에게 네 웃옷[a]을 입히고 네 띠를 그에게 단단히 매어 주며, 네 권세를 그의 손에 맡기겠습니다. 그는 예루살렘 주민과 유다 집의 아버지가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 아버지가 될 것입니다’. 히브리어 은유는 생물학적 부성이 아니라 보호하고 책임지는 지도력을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּי/ו כֻּתָּנְתֶּךָ
  english_pob_choice: I will clothe him with your tunic
  chosen_korean: 내가 그에게 네 웃옷을 입히고
  alternatives_korean:
  - 네 튜닉을 입히고
  - 네 겉옷을 입히고
  lexicon: HALOT
  rationale: כֻּתֹּנֶת은 몸에 가까이 입는 의복으로, 한국어에서는 자연스럽고 구체적인 ‘웃옷’이 의복 교체와 위임의 장면을 잘 살립니다.
- source_word: וְאַבְנֵטְךָ אֲחַזְּקֶנּוּ
  english_pob_choice: I will fasten your sash on him
  chosen_korean: 네 띠를 그에게 단단히 매어 주며
  alternatives_korean:
  - 네 허리띠를 그에게 매어 주며
  - 네 띠를 그에게 묶어 주며
  lexicon: HALOT
  rationale: אַבְנֵט은 의전적 복장의 띠이므로 ‘띠’가 본문 이미지를 살리고, אֲחַזְּקֶנּוּ는 단순히 ‘강하게 하다’보다 ‘단단히 매다’가 문맥에 맞습니다.
- source_word: וּמֶמְשֶׁלְתְּךָ אֶתֵּן בְּיָדוֹ
  english_pob_choice: I will place your authority into his hand
  chosen_korean: 네 권세를 그의 손에 맡기겠습니다
  alternatives_korean:
  - 네 통치를 그의 손에 주겠습니다
  - 네 शासन권을 그의 손에 두겠습니다
  lexicon: HALOT
  rationale: מֶמְשָׁלָה는 여기서 실제로 이양되는 통치 권한을 가리키므로, ‘권세’가 위임된 통치의 무게를 간결하게 전달합니다.
- source_word: וְהָיָה לְאָב
  english_pob_choice: he will become a father
  chosen_korean: 그는 … 아버지가 될 것입니다
  alternatives_korean:
  - 그는 아버지가 될 것입니다
  - 그는 아버지처럼 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 직접 은유를 쓰므로, POB처럼 설명을 덧붙이지 않고 ‘아버지가 될 것입니다’로 남겨 보호적·책임적 지도력을 드러냅니다.
theological_decisions:
- issue: ‘아버지’ 은유의 정치적 의미
  chosen_reading: 통치자의 생물학적 부성이 아니라 보호하고 책임지는 지도자라는 은유를 그대로 살렸습니다.
  alternative_readings:
  - 아버지 같은 사람이 될 것입니다
  - 후견인이 될 것입니다
  rationale: 본문의 לְאָב는 직설적 은유이므로, 설명적 치환보다 원문이 가진 권위와 돌봄의 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: 은유 보존; 통치 언어의 신학적 긴장 유지
