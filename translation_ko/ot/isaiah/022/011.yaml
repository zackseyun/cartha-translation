    rationale: 원문은 두 절에서 모두 여성 단수 접미사로 대상의 모호성을 유지합니다. ‘그분’은 하나님을 명시적으로 지시할 뿐 아니라 첫 병행구의 대상도 탈락시킵니다.
  - severity: medium
