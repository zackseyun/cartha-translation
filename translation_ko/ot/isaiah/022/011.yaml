source:
  edition: WLC
  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
  footnotes:
  - marker: a
    text: Or 'from afar.' The Hebrew phrase may denote spatial distance, but here likely means 'long ago,' referring to God's prior planning or forming.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 두 성벽 사이에 고대의 저수지 물을 위해 저수지를 만들었지만, 그분을 바라보지 않았고, 오래전부터 그것을 지으신 분도 보지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멀리서’. 히브리어 표현은 공간적 거리를 뜻할 수 있지만, 여기서는 아마도 ‘오래전부터’를 뜻하여 하나님의 이전 계획이나 형성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  english_pob_choice: reservoir
  chosen_korean: 저수지
  alternatives_korean:
  - 물 저장소
  - 저장 연못
  - 연못
  lexicon: HALOT
  rationale: 이 문맥은 물을 모으는 인공 시설이므로 일반적인 ‘소망’이 아니라 공학적 물 저장 구조를 뜻하게 옮기는 것이 적절합니다.
- source_word: בֵּין הַחֹמֹתַיִם
  english_pob_choice: between the two walls
  chosen_korean: 두 성벽 사이에
  alternatives_korean:
  - 성벽들 사이에
  - 두 담장 사이에
  lexicon: HALOT
  rationale: 쌍수형이 분명하므로 ‘두’의 의미를 살려 방어용 성벽의 이중 구조를 드러냈습니다.
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  english_pob_choice: for the waters of the old pool
  chosen_korean: 고대의 저수지 물을 위해
  alternatives_korean:
  - 옛 연못의 물을 위해
  - 오래된 저수지의 물을 위해
  lexicon: HALOT
  rationale: ‘옛/오래된’은 단순 노후가 아니라 이미 오래전부터 있던 수원을 가리키므로 ‘고대의’로 번역해 시간적 뉘앙스를 살렸습니다.
- source_word: עֹשֶׂיהָ / יֹצְרָהּ
  english_pob_choice: the one who made it / the one who formed it
  chosen_korean: 그분 / 그것을 지으신 분
  alternatives_korean:
  - 그것의 만드신 분
  - 그것을 만드신 분
  - 그것을 빚으신 분
  lexicon: HALOT
  rationale: 두 분사 모두 하나님을 가리키는 표현으로, 한국어에서는 반복을 줄이면서도 창조·형성의 대응을 유지하도록 ‘그분’과 ‘지으신 분’으로 나누었습니다.
theological_decisions:
- issue: ‘오래전부터’(מֵרָחוֹק)의 시간적 vs 공간적 의미
  chosen_reading: 시간적 의미를 우선하여 하나님이 오래전부터 이 상황을 지으시고 예정하신 뜻을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 멀리서
  - 먼 곳에서
  rationale: 이 절은 단순한 거리 묘사가 아니라 하나님의 선행적 계획과 형성을 대조하므로, 문맥상 시간적 의미가 더 강합니다.
  doctrine_reference: 하나님의 섭리와 예비하심
