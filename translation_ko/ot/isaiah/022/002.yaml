id: ISA.22.2
reference: Isaiah 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּשֻׁא֣וֹת מְלֵאָ֗ה עִ֚יר הֽוֹמִיָּ֔ה קִרְיָ֖ה עַלִּיזָ֑ה חֲלָלַ֨יִ/ךְ֙ לֹ֣א חַלְלֵי חֶ֔רֶב וְ/לֹ֖א מֵתֵ֥י מִלְחָמָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
  footnotes:
  - marker: a
    text: Or 'full of uproar ... noisy city ... joyous town.' The Hebrew piles up near-synonyms to portray a city marked by loud, festive commotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 소란이 가득한 성읍이여, 떠들썩한 도시여, 즐거워 뛰노는 마을이여 — 네 죽은 자들은 칼에 죽은 자가 아니며 전쟁에 죽은 자도 아니구나.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외침이 가득한 … 소란스러운 도시 … 환호하는 마을.’ 히브리어는 서로 가까운 뜻의 말을 겹쳐 써서, 큰 소리와 축제적 소란이 가득한 도시를 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת מְלֵאָה
  english_pob_choice: full of shouting
  chosen_korean: “소란이 가득한”
  alternatives_korean:
  - “외침이 가득한”
  - “함성이 가득한”
  lexicon: HALOT
  rationale: תְּשֻׁאוֹת의 폭넓은 ‘큰 소리/소란’ 의미를 살리되, 한국어에서는 ‘소란이 가득한’이 시적이면서도 자연스럽습니다.
- source_word: הוֹמִיָּה
  english_pob_choice: tumultuous
  chosen_korean: “떠들썩한”
  alternatives_korean:
  - “요란한”
  - “소란스러운”
  lexicon: HALOT
  rationale: 도시의 소란과 웅성거림을 나타내는 말로, ‘떠들썩한’이 문맥의 군중적·도시적 소음을 가장 자연스럽게 드러냅니다.
- source_word: קִרְיָה
  english_pob_choice: town
  chosen_korean: “마을”
  alternatives_korean:
  - “읍”
  - “성읍”
  lexicon: HALOT
  rationale: 앞의 ‘성읍/도시’와 평행을 이루는 더 작은 도시적 단위를 살리기 위해 ‘마을’을 택했지만, 여기서는 시적 병행 때문에 행정적 크기보다 울림이 우선입니다.
- source_word: עַלִּיזָה
  english_pob_choice: exultant
  chosen_korean: “즐거워 뛰노는”
  alternatives_korean:
  - “환호하는”
  - “기뻐하는”
  lexicon: HALOT
  rationale: 단순한 기쁨보다 들뜬 환희와 활기를 함께 담기 위해 동사구로 옮겨, 축제적 자기만족의 뉘앙스를 살렸습니다.
- source_word: חֲלָלַיִךְ / חַלְלֵי חֶרֶב / מֵתֵי מִלְחָמָה
  english_pob_choice: your slain ... slain by the sword ... dead in battle
  chosen_korean: “네 죽은 자들… 칼에 죽은 자… 전쟁에 죽은 자”
  alternatives_korean:
  - “네 희생자들… 칼에 쓰러진 자… 전쟁 중에 죽은 자”
  - “네 살해된 자들… 칼로 죽임을 당한 자… 전사한 자”
  lexicon: HALOT
  rationale: 세 표현의 중복과 점층을 그대로 드러내기 위해 ‘죽은 자’ 계열을 반복했고, חַלְלֵי חֶרֶב는 전형적 군사적 죽음을 뜻하므로 ‘칼에 죽은 자’로 직결했습니다.
theological_decisions:
- issue: 예언적 탄식의 호격과 반전
  chosen_reading: 도시를 부르는 호격 ‘아’와 마지막의 반어적 진술을 함께 살려, 축제적 소란과 전쟁 희생의 부재가 대비되도록 했습니다.
  alternative_readings:
  - 호격을 생략하고 서술문으로만 처리하기
  - 마지막 절을 완곡하게 옮기기
  rationale: 히브리어는 도시를 직접 호명하면서, 겉으로는 활기찬 도시가 실제로는 전쟁의 죽음을 알지 못한다는 아이러니를 드러냅니다.
  doctrine_reference: 예언 문학의 수사와 심판/아이러니 구조
- issue: ‘전쟁에 죽은 자도 아니다’의 직역성
  chosen_reading: מֵתֵי מִלְחָמָה를 ‘전쟁에 죽은 자’로 옮겨, 일반적 ‘전사자’보다 원문의 직접성을 우선했습니다.
  alternative_readings:
  - ‘전사자도 아니며’
  - ‘전쟁의 희생자도 아니며’
  rationale: 본문은 전쟁의 참상 자체를 언급하는 것이므로, 관용적 표현보다 원문이 지닌 단정적 대조를 드러내는 번역이 더 적합합니다.
  doctrine_reference: 본문 충실성 원칙
