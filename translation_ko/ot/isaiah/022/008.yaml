id: ISA.22.8
reference: Isaiah 22:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְגַ֕ל אֵ֖ת מָסַ֣ךְ יְהוּדָ֑ה וַ/תַּבֵּט֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֶל נֶ֖שֶׁק בֵּ֥ית הַ/יָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
  footnotes:
  - marker: a
    text: Or 'the defense/protection of Judah.' The Hebrew literally says 'the covering of Judah,' using a metaphor for what sheltered or protected Judah.
    reason: lexical_alternative
  - marker: b
    text: '''The House of the Forest'' likely refers to the royal armory or palace elsewhere called ''the House of the Forest of Lebanon.'''
    reason: cross_reference
translation:
  language: ko
  text: 그가 유다의 덮개를 벗겼고, 그날 당신은 “숲의 집”의 무기를 바라보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘덮개’는 문자적으로 가리개나 덮는 것을 뜻하지만, 여기서는 유다를 지키던 보호 또는 방어를 비유적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숲의 집’은 다른 곳에서 ‘레바논의 숲의 집’으로도 불리며, 아마 왕실 무기고 또는 궁전을 가리키는 말입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  english_pob_choice: he removed
  chosen_korean: 거두셨고
  alternatives_korean:
  - 제거하셨고
  - 벗기셨고
  - 드러내셨고
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스를 살리되, 이어지는 ‘덮개’와 자연스럽게 결합되는 동사로 옮겼습니다. ‘거두다’는 보호막을 치워 버리는 의미를 담으면서도 문맥상 무리하지 않습니다.
- source_word: מָסַךְ
  english_pob_choice: covering
  chosen_korean: 덮개
  alternatives_korean:
  - 덮음
  - 가림막
  - 보호
  lexicon: HALOT
  rationale: 히브리어의 구체적 은유를 살리기 위해 추상화된 ‘보호’보다 물질적 이미지가 살아 있는 ‘덮개’를 택했습니다. 영어 POB의 메타포를 한국어에서도 유지합니다.
- source_word: וַתַּבֵּט
  english_pob_choice: you looked
  chosen_korean: 당신은 바라보셨습니다
  alternatives_korean:
  - 당신은 보셨습니다
  - 당신은 주목하셨습니다
  - 당신은 눈을 돌리셨습니다
  lexicon: HALOT
  rationale: 2인칭 단수의 예언적 호소를 살리면서, ‘바라보다’로 אֶל을 향한 시선을 드러냈습니다. ‘당신’은 예루살렘/유다를 인격화한 직접 호칭을 보존합니다.
- source_word: בֵּית הַיָּעַר
  english_pob_choice: the House of the Forest
  chosen_korean: 숲의 집
  alternatives_korean:
  - 삼림의 집
  - 레바논의 숲의 집
  - 숲집
  lexicon: HALOT
  rationale: 본문의 직역적 지명을 유지해 영어 POB의 표면 형식을 반영했습니다. 다만 주석에서 통상적 식별(왕실 무기고/궁전 가능성)을 보완할 수 있게 열어 두었습니다.
theological_decisions:
- issue: 유다의 ‘덮개’ 은유 보존
  chosen_reading: ‘유다의 덮개’로 직역하여 보호/방어의 의미를 단정적으로 풀지 않았습니다.
  alternative_readings:
  - 유다의 방어
  - 유다의 보호
  rationale: 원문의 은유는 구체적 이미지 자체가 의미를 생성하므로, 바로 해설어로 바꾸기보다 본문에서 유지하는 편이 더 충실합니다. 해석적 의미는 문맥과 주석이 담당합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 2인칭 단수의 직접 خطاب 유지
  chosen_reading: ‘당신은’으로 단수형을 유지해 예언적 직접 호칭을 살렸습니다.
  alternative_readings:
  - 그들은
  - 너희는
  - 무인칭으로 처리
  rationale: 히브리어 형태가 2인칭 단수이므로, 예루살렘/유다를 인격화한 수사적 긴장을 보존하는 것이 본문 의미에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
