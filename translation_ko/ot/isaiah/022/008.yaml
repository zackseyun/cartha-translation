  to: 그가 유다의 덮개를 벗겼고, 그날 당신은 “숲의 집”의 무기를 바라보았습니다.[a][b]
  rationale: 본문에 명시되지 않은 ‘여호와’를 ‘그’로 고쳐 히브리어의 3인칭 단수 주어와 그 생략을 보존했습니다. ‘덮개’의 은유와 2인칭 단수 직접 호칭은 유지했으며, 건물 명칭과 그 무기의 소속 관계를 더 자연스럽게 다듬었습니다.
