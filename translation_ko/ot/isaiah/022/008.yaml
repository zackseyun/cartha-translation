  source_fidelity: 개정이 필요합니다. 히브리어 동사는 3인칭 남성 단수이지만 주어 명사는 명시하지 않습니다. 초안의 ‘여호와께서’는 문맥상 가능한 해석일 수 있어도, 이 절의 표면 본문에 없는 주어를 특정하므로 원문의 생략과 영어 POB의 ‘he’를 보존하지 못합니다. 또한 נֶשֶׁק은 ‘숲의 집’ 자체가 아니라 그 집에 속한 무기입니다.
  naturalness: ‘그날에’보다는 ‘그날’이 현대 한국어에서 자연스럽습니다. ‘숲의 집의 무기’도 이해할 수 있으나, 명칭을 인용부호로 처리한 ‘“숲의 집”의 무기’가 고유한 건물 명칭임을 더 분명히 하면서 자연스럽습니다.
  terminology: ‘덮개’는 מָסַךְ의 구체적 은유를 보존하며 적절합니다. ‘숲의 집’도 본문의 직역적 명칭으로 유지할 수 있습니다. 직접 호칭 ‘당신’은 한국어에서 다소 표시적이지만, 유다/예루살렘을 향한 히브리어 2인칭 단수의 수사적 직접성을 보존합니다.
