  text: מַה לְּ/ךָ֥ פֹה֙ וּ/מִ֣י לְ/ךָ֣ פֹ֔ה כִּֽי חָצַ֧בְתָּ לְּ/ךָ֛ פֹּ֖ה קָ֑בֶר חֹצְבִ֤י מָרוֹם֙ קִבְר֔/וֹ חֹקְקִ֥י בַ/סֶּ֖לַע מִשְׁכָּ֥ן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
  footnotes:
  - marker: a
    text: 'Or, more smoothly: ''cutting your tomb on the height, carving a dwelling for yourself in the rock.'' The Hebrew shifts from second person to third person in these clauses.'
    reason: alternative_reading
translation:
  language: ko
  text: 여기 당신에게 무엇이 있으며, 여기 당신에게 누가 있기에, 당신이 여기 자신을 위해 무덤을 파 놓고, 높은 곳에 그의 무덤을 파며 바위에 그를 위한 거처를 파내고 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 매끄럽게는 ‘높은 곳에 당신의 무덤을 파며 바위에 당신을 위한 거처를 파내고’로 옮길 수 있습니다. 히브리어는 이 절들에서 2인칭에서 3인칭으로 전환합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  english_pob_choice: What do you have here
  chosen_korean: 당신은 여기서 무엇을 가지고 있습니까
  alternatives_korean:
  - 당신은 여기서 무엇이 있습니까
  - 당신은 여기서 무슨 권리가 있습니까
  lexicon: HALOT
  rationale: 장소에 대한 도전적 질문을 자연스러운 현대 한국어로 옮기되, 해석을 덧붙인 ‘권리’보다 원문의 간결한 물음을 살렸습니다.
- source_word: וּמִי לְךָ פֹה
  english_pob_choice: and whom do you have here
  chosen_korean: 또 누구를 가지고 있습니까
  alternatives_korean:
  - 또 누구가 있습니까
  - 또 누구에게 속한 사람이 있습니까
  lexicon: HALOT
  rationale: 병행되는 질문의 인칭 목적어 감각을 살려, 단순한 존재 질문보다 관계성과 소속의 뉘앙스를 유지했습니다.
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  english_pob_choice: you have cut out a tomb for yourself here
  chosen_korean: 당신이 여기에서 당신을 위해 무덤을 파고
  alternatives_korean:
  - 당신이 여기에서 당신을 위해 묘를 파고
  - 당신이 여기에서 무덤을 새기고
  lexicon: HALOT
  rationale: חצב의 ‘돌을 쪼아 파다/깎아내다’는 뜻을 무덤 조성의 이미지로 풀어, 현대 독자가 이해하기 쉬운 ‘무덤을 파다’로 옮겼습니다.
- source_word: קִבְרוֹ / מִשְׁכָּן לוֹ
  english_pob_choice: his tomb ... a dwelling for himself
  chosen_korean: 자기 무덤을 파며, 바위 속에 자기 거처를 새기기까지
  alternatives_korean:
  - 그의 무덤을 파며, 바위 속에 자기 거처를 새기기까지
  - 자기 무덤을 파며, 바위 속에 자기 장막을 새기기까지
  lexicon: HALOT
  rationale: 본문의 3인칭 소유격과 뒤이어 나오는 ‘거처’ 이미지를 그대로 살려, 장례용 석굴을 ‘거처’로 옮겨 아이러니를 유지했습니다.
theological_decisions:
- issue: 히브리어의 2인칭→3인칭 전환
  chosen_reading: ‘자기 무덤’, ‘자기 거처’처럼 3인칭 소유를 유지했습니다.
  alternative_readings:
  - ‘당신의 무덤’, ‘당신을 위한 거처’처럼 끝까지 2인칭으로 맞추기
  rationale: 마소라 본문의 시각적·수사적 전환을 지우지 않고, 원문이 의도한 거리감과 묘사의 생동감을 보존하기 위해서입니다.
  doctrine_reference: Translation philosophy §1, §5
