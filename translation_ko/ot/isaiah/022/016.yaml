revisions:
- from: 당신은 여기서 무엇을 가지고 있습니까, 또 누구를 가지고 있습니까? 당신이 여기에서 당신을 위해 무덤을 파고, 높은 곳에 자기 무덤을 파며, 바위 속에 자기 거처를 새기기까지 말입니다.[a]
  to: 여기 당신에게 무엇이 있으며, 여기 당신에게 누가 있기에, 당신이 여기 자신을 위해 무덤을 파 놓고, 높은 곳에 그의 무덤을 파며 바위에 그를 위한 거처를 파내고 있습니까?[a]
  rationale: 장소에 대한 대결적 질문을 현대 표준 한국어로 자연스럽게 다듬고, 히브리어 본문의 2인칭→3인칭 전환을 명시적인 3인칭 표현으로 보존했습니다. 대안적 2인칭 평준화는 각주에만 제시했습니다.
