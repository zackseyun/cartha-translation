reference: Isaiah 22:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל קְצִינַ֥יִ/ךְ נָֽדְדוּ יַ֖חַד מִ/קֶּ֣שֶׁת אֻסָּ֑רוּ כָּל נִמְצָאַ֨יִ/ךְ֙ אֻסְּר֣וּ יַחְדָּ֔ו מֵ/רָח֖וֹק בָּרָֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
  footnotes:
  - marker: a
    text: Hebrew literally, 'were bound from/without the bow.' The sense may be that they were captured without needing archery or without having a bow in hand.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of yours who were found were bound together; they fled from afar.' The Hebrew syntax of the final clause is compressed and allows slightly different construals.
    reason: alternative_reading
translation:
  language: ko
  text: 네 지도자들은 모두 함께 달아났습니다[a]. 그들은 활 없이 사로잡혔습니다. 네게서 발견된 이들은 모두 함께 사로잡혔습니다[b]. 그들은 멀리로 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘활에서/활 없이 포박되었다’라는 뜻입니다. 활을 사용하지 않고 사로잡혔다는 의미일 수 있으나, 전치사의 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네게서 발견된 모든 이들이 함께 포박되었다. 그들은 멀리서 달아났다’로 옮길 수 있습니다. 마지막 절의 히브리어는 압축되어 있어 앞 절과의 결속 관계를 약간 다르게 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  english_pob_choice: your rulers
  chosen_korean: 당신의 지도자들
  alternatives_korean:
  - 당신의 통치자들
  - 당신의 관원들
  - 당신의 지휘관들
  lexicon: HALOT
  rationale: קָצִין은 관원, 지도자, 지휘관의 폭을 가지므로, 예루살렘의 지도층이라는 문맥을 살려 과도하게 군사화하지 않는 '지도자들'을 택했습니다.
- source_word: נָדְדוּ יַחַד
  english_pob_choice: have fled together
  chosen_korean: 모두 함께 도망했습니다
  alternatives_korean:
  - 함께 달아났습니다
  - 모두 함께 달아났습니다
  - 함께 도망쳤습니다
  lexicon: HALOT
  rationale: נָדַד는 이 문맥에서 단순한 배회보다 탈출·도주를 가리키므로, 결과적 상황을 드러내는 '도망했습니다'가 자연스럽습니다.
- source_word: מִקֶּשֶׁת אֻסָּרוּ
  english_pob_choice: were captured without the bow
  chosen_korean: 활 없이 붙잡혔습니다
  alternatives_korean:
  - 활에서 붙잡혔습니다
  - 활을 쓰지 않고 붙잡혔습니다
  - 활 없이 사로잡혔습니다
  lexicon: HALOT
  rationale: מִן을 분리/결핍의 의미로 받아, 전투용 활의 사용 없이 사로잡혔다는 뜻을 한국어로 간결하게 살렸습니다.
- source_word: נִמְצָאַיִךְ
  english_pob_choice: your fugitives who were found
  chosen_korean: 당신의 발견된 자들
  alternatives_korean:
  - 당신의 도망자들 가운데 발견된 자들
  - 당신의 찾아진 자들
  - 발견된 당신의 사람들
  lexicon: HALOT
  rationale: מצא의 수동분사로서 '발견된'이라는 수동 의미를 보존하되, 히브리어의 압축된 구문을 너무 풀지 않기 위해 중립적으로 옮겼습니다.
- source_word: אֻסְּרוּ יַחְדָּו
  english_pob_choice: were captured together
  chosen_korean: 모두 함께 붙잡혔습니다
  alternatives_korean:
  - 함께 사로잡혔습니다
  - 모두 함께 사로잡혔습니다
  - 한꺼번에 붙잡혔습니다
  lexicon: HALOT
  rationale: 같은 אָסַר 동사가 앞절과 반복되므로, 동일하게 '붙잡혔습니다'로 맞추어 구문상의 평행성을 살렸습니다.
- source_word: מֵרָחוֹק בָּרָחוּ
  english_pob_choice: they had fled far away
  chosen_korean: 그들은 멀리 도망해 있었습니다
  alternatives_korean:
  - 그들은 멀리 도망했습니다
  - 그들은 먼 곳으로 달아나 있었습니다
  - 그들은 멀리 달아나 있었습니다
  lexicon: HALOT
  rationale: 마지막 절은 도망의 거리와 선행성을 함께 드러내므로, 한국어에서는 '도망해 있었습니다'로 결과 상태와 과거 선행성을 함께 표현했습니다.
theological_decisions:
- issue: 포위 상황 속 지도층의 도주와 무장 무력화의 묘사
  chosen_reading: 본문의 비난적·모욕적 어조를 약화하지 않고, 지도자들의 도주와 무기 없이 붙잡힘을 직설적으로 살렸습니다.
  alternative_readings:
  - 더 완곡하게 '피신했습니다'로 옮김
  - '''사로잡혔습니다''만 반복해 완화함'
  rationale: 이 구절은 예루살렘 지도층의 수치와 무력함을 강조하므로, 원문의 예언적 질책을 유지하는 번역이 필요합니다.
  doctrine_reference: 예언서의 심판 선언과 언약적 책망의 직설성
