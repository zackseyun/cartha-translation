language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א גֵּ֣יא חִזָּי֑וֹן מַה לָּ֣/ךְ אֵפ֔וֹא כִּֽי עָלִ֥ית כֻּלָּ֖/ךְ לַ/גַּגּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
  footnotes:
  - marker: a
    text: '''The Valley of Vision'' is likely a poetic designation for Jerusalem, though the verse itself does not explicitly identify it.'
    reason: cross_reference
translation:
  language: ko
  text: “계시의 골짜기”에 대한 경고입니다. 지금 너희에게 무슨 일이 생겼기에 모두 지붕들로 올라갔습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계시의 골짜기’는 시적 지명 또는 예루살렘을 가리키는 표현일 가능성이 있지만, 이 절만으로는 그 대상이 분명히 밝혀지지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 경고
  alternatives_korean:
  - 신탁
  - 예언
  lexicon: HALOT
  rationale: 예언 제목으로서의 무게와 선포성을 살리면서, 한국어에서 지나치게 문어적이거나 교회 전통에 굳어지지 않은 표현으로 옮겼습니다.
- source_word: גֵּיא חִזָּיוֹן
  english_pob_choice: the Valley of Vision
  chosen_korean: “계시의 골짜기”
  alternatives_korean:
  - “환상의 골짜기”
  - “환시의 골짜기”
  lexicon: HALOT
  rationale: חִזָּיוֹן은 ‘보임/계시/환상’ 계열의 뜻을 가지므로, 문맥상 단순한 지명 설명을 넘는 시적 명칭으로 살려 ‘계시’로 옮겼습니다. 본문이 그 지시 대상을 명시하지 않으므로 제목 형태를 유지했습니다.
- source_word: מַה לָּךְ אֵפוֹא
  english_pob_choice: What is the matter with you now
  chosen_korean: 지금 너희에게 무슨 일이 생겼기에
  alternatives_korean:
  - 도대체 무슨 일이 있기에
  - 지금 무슨 사정이 있기에
  lexicon: HALOT
  rationale: 관용적 질문을 한국어에서 자연스럽게 풀어, 단순 정보 질문이 아니라 비난/탄식을 띤 수사적 질문으로 전달했습니다.
- source_word: לַגַּגּוֹת
  english_pob_choice: to the rooftops
  chosen_korean: 지붕들로
  alternatives_korean:
  - 옥상들로
  - 지붕 위로
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영하되, 현대 한국어에서는 ‘옥상’보다 본문 분위기에 더 중립적인 ‘지붕’이 적합하여 복수성을 살린 ‘지붕들로’로 옮겼습니다.
theological_decisions:
- issue: ‘계시의 골짜기’의 지시 대상
  chosen_reading: 본문에서는 그 지시 대상을 밝히지 않은 채 시적 명칭으로 유지했습니다.
  alternative_readings:
  - 예루살렘을 가리키는 시적 명칭으로 명시적으로 해석
  - 예루살렘 근처의 특정 골짜기로 구체화
  rationale: 히브리어 본문 자체는 이 표현의 대상을 직접 밝히지 않으므로, 번역문에 해석을 앞세워 고정하지 않고 여운을 남겼습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 열어 둔 해석 가능성을 번역이 임의로 닫지 않음
