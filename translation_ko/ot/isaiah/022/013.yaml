  - severity: medium
    issue: 각주 표지가 ‘보십시오’에 붙어 있으나 각주 내용은 ‘먹고 마시자’를 논함
    rationale: 각주 앵커와 설명 대상이 일치하지 않습니다. 표지는 해당 구호에 붙여야 합니다.
  - severity: low
    issue: 인용문 종결의 높임말 격식 불일치
    rationale: ‘먹고 마시자’와 ‘때문입니다’가 섞여 있습니다. 지정된 현대 합쇼체에 맞추어 통일하는 편이 적절합니다.
