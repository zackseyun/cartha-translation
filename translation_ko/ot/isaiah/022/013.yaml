  lexicon: HALOT
  rationale: בָּקָר의 식용 동물 문맥을 고려해 자연스러운 한국어로 ‘소를 잡다’라고 옮겼습니다.
- source_word: וְשָׁחֹט צֹאן
  english_pob_choice: slaughtering sheep
  chosen_korean: 양을 잡으며
  alternatives_korean:
