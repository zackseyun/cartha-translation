base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
  footnotes:
  - marker: a
    text: Or, more literally, “Eat and drink,” preserving the terse slogan-like force of the Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오—기쁨과 즐거움이 있고, 소를 잡고 양을 잡으며, 고기를 먹고 포도주를 마십니다. “먹고 마십시다[a]. 내일 우리가 죽을 것이기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘먹고 마심’이지만, 여기서는 뒤따르는 ‘우리가 죽을 것’에 비추어 공동의 청유로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오—
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 문맥의 장면 전환과 급박함을 살리기 위해 현대적 공손 명령형으로 옮겼습니다.
- source_word: הָרֹג בָּקָר
  english_pob_choice: killing cattle
  chosen_korean: 소를 잡고
  alternatives_korean:
