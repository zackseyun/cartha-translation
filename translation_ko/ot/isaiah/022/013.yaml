  rationale: שָׁחַט의 도살 뉘앙스를 유지하되, 앞 절과의 병렬성을 살려 간결하게 표현했습니다.
- source_word: אָכֹל בָּשָׂר / וְשָׁתוֹת יָיִן
  english_pob_choice: eating meat and drinking wine
  chosen_korean: 고기를 먹고 포도주를 마시면서
  alternatives_korean:
  - 육고기를 먹고 포도주를 마시면서
  - 고기를 먹으며 포도주를 마시며
  lexicon: HALOT
  rationale: 식탁의 향락 장면을 현대 한국어로 자연스럽게 전달하되, בָּשָׂר와 יָיִן의 구체성을 유지했습니다.
- source_word: אָכוֹל וְשָׁתוֹ
  english_pob_choice: Let us eat and drink
  chosen_korean: 먹고 마시자
  alternatives_korean:
  - 먹자, 마시자
  - 먹고 마시도록 하자
  lexicon: HALOT
  rationale: 히브리어의 짧고 구호 같은 호소를 한국어의 관용적 청유형으로 압축해 재현했습니다.
theological_decisions:
- issue: 내일의 죽음을 앞두고 즐기는 태도를 번역에서 평가적으로 드러낼지 여부
  chosen_reading: 문장 자체는 묘사적으로 옮기고, 도덕적 판단은 본문 밖의 문맥에 맡겼습니다.
  alternative_readings:
  - ‘방탕하게’ 같은 평가어를 덧붙이는 번역
  - ‘절망적으로’ 같은 해석어를 덧붙이는 번역
  rationale: 본문은 사람들의 반응을 있는 그대로 제시하며, 예언자적 비난은 앞뒤 문맥에서 형성됩니다. 번역은 본문이 말하는 것 이상을 덧입히지 않는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하지 않는 평가를 추가하지 않는다.'
