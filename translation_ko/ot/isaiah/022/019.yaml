  text: וַ/הֲדַפְתִּ֖י/ךָ מִ/מַּצָּבֶ֑/ךָ וּ/מִ/מַּעֲמָֽדְ/ךָ֖ יֶהֶרְסֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
  footnotes:
  - marker: a
    text: Hebrew shifts from 'I will thrust you' to 'he will pull you down.' Some translations smooth the second clause to 'I will pull you down.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 너를 네 관직에서 내던질 것이며, 그가 너를 네 자리에서 끌어내릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절반에서 ‘내가 너를 내던질 것’이라고 하다가, 둘째 절반에서 ‘그가 너를 끌어내릴 것이다’로 인칭이 바뀝니다. 일부 번역은 둘째 절반도 ‘내가 너를 끌어내릴 것이다’로 매끈하게 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  english_pob_choice: I will thrust you
  chosen_korean: 내던질 것이며
  alternatives_korean:
  - 몰아낼 것이며
  - 밀쳐낼 것이며
  - 떠밀어 내보낼 것이며
  lexicon: HALOT
  rationale: הדף의 강한 밀쳐냄·내침의 뉘앙스를 살리면서, 한국어에서는 ‘내던지다’가 공식 문체에서 강한 강제 추방을 자연스럽게 드러냅니다.
- source_word: מִמַּצָּבֶךָ
  english_pob_choice: from your office
  chosen_korean: 네 관직에서
  alternatives_korean:
  - 네 직분에서
  - 네 자리에서
  - 네 직위에서
  lexicon: HALOT
  rationale: 문맥이 셉나의 권한 박탈이므로 단순한 물리적 ‘장소’보다 공식적 직책을 가리키는 ‘관직’이 가장 직접적입니다.
- source_word: וּמִמַּעֲמָדְךָ
  english_pob_choice: from your station
  chosen_korean: 네 자리에서
  alternatives_korean:
  - 네 위치에서
  - 네 입장에서
  - 네 서 있는 자리에서
  lexicon: HALOT
  rationale: מַעֲמָד의 ‘서 있는 자리/지위’ 의미를 살리되, 앞 구절의 ‘관직’과 중복되지 않도록 ‘자리’로 옮겨 병렬을 유지했습니다.
- source_word: יֶהֶרְסֶךָ
  english_pob_choice: he will pull you down
  chosen_korean: 그가 너를 ... 끌어내릴 것입니다
  alternatives_korean:
  - 그가 너를 ... 허물어뜨릴 것입니다
  - 그가 너를 ... 무너뜨릴 것입니다
  - 너는 ... 끌려내려갈 것입니다
  lexicon: HALOT
  rationale: הרס의 ‘허물다/무너뜨리다’ 가운데, 사람의 지위에서 끌어내리는 장면에는 ‘끌어내리다’가 하향·굴욕의 이미지를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 1인칭에서 3인칭으로 바뀌는 주어 전환
  chosen_reading: 첫 절반의 ‘내가’와 둘째 절반의 ‘그가’를 그대로 살려, 본문이 보이는 인칭 전환을 보존했습니다.
  alternative_readings:
  - 둘 다 ‘내가’로 평탄화하기
  - 수동형으로 바꾸어 ‘너는 끌어내려질 것입니다’로 옮기기
  rationale: 마소라 본문은 의도적인 인칭 전환을 드러내므로, 이를 평탄화하면 원문의 긴장과 투명성이 약해집니다.
  doctrine_reference: 본문의 인칭 전환과 신학적 긴장을 보존합니다.
