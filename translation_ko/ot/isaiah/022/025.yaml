    issue: ‘뽑혀 떨어지며’가 וְנִגְדְּעָה(잘리다/찍혀 끊어지다)를 반영하지 않습니다.
    rationale: 히브리어는 못/말뚝이 먼저 움직이거나 이탈하고, 이어 잘리고 떨어진다고 말합니다. ‘뽑히다’는 원문에 없는 제거 방식을 도입하며 ‘잘리다’의 심상을 소실합니다.
  - severity: medium
    issue: 각주 a의 표지가 ‘그 날에’에 붙어 있으나, 각주 내용은 못/말뚝의 어휘 대안입니다.
    rationale: 각주는 해당 어휘인 יָתֵד 및 그 수식어에 붙어야 독자가 대안이 적용되는 범위를 알 수 있습니다.
