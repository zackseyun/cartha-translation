revisions:
- from: 그 날에[a] 만군의 야훼께서 선언하십니다. 단단한 곳에 박혀 있던 못이 흔들리고, 뽑혀 떨어지며, 그 위에 매달려 있던 짐이 잘려 나갈 것입니다[b]. 이는 야훼께서 말씀하셨기 때문입니다.
  to: 그 날에, 만군의 야훼의 말씀입니다. 단단한 곳에 고정된 말뚝[a]이 움직여 빠져나가고, 잘려 떨어질 것이며, 그 위에 있던 짐은 잘려 나갈 것입니다[b]. 야훼께서 말씀하셨습니다.
  rationale: 원문의 동사 연쇄(움직이다/이탈하다—잘리다—떨어지다)를 보존하고, ‘짐’이 따로 잘려 나간다는 마지막 판단 절을 명확히 했습니다. 비유의 지시 대상은 여전히 특정하지 않았습니다. 또한 어휘 대안 각주를 해당 말뚝 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:31Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 못/말뚝과 그 위의 짐이라는 비유를 보존하고 지시 대상을 특정하지 않은 점은 적절합니다. 그러나 תָּמוּשׁ, וְנִגְדְּעָה, וְנָפְלָה의 연속을 ‘흔들리고, 뽑혀 떨어지며’로 옮겨 ‘움직여/빠져나감, 잘림, 떨어짐’이라는 세 동작 중 ‘잘림’을 ‘뽑힘’으로 바꾸었습니다. 이를 바로잡아야 합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하면서도 예언적 선언 공식과 못/말뚝의 비유를 자연스럽게 표현합니다. ‘움직여 빠져나가고’는 문맥상 지지대가 제자리에서 이탈하는 뜻을 전달하되, 원문의 구체적 이탈 방식을 과도하게 단정하지 않습니다.
  terminology: יָתֵד는 본문에서 ‘말뚝’으로 옮기고, ‘못’이라는 가능한 어휘는 각주로 남겼습니다. נְאֻם יְהוָה צְבָאוֹת은 ‘만군의 야훼의 말씀입니다’로, כִּי יְהוָה דִּבֵּר는 ‘야훼께서 말씀하셨습니다’로 옮겨 선언 공식과 종결 공식을 구별했습니다. מַשָּׂא는 구체적인 ‘짐’으로 유지했습니다.
  issues:
