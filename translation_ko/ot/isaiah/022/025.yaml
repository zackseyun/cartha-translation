id: ISA.22.25
reference: Isaiah 22:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תָּמוּשׁ֙ הַ/יָּתֵ֔ד הַ/תְּקוּעָ֖ה בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/נִגְדְּעָ֣ה וְ/נָפְלָ֗ה וְ/נִכְרַת֙ הַ/מַּשָּׂ֣א אֲשֶׁר עָלֶ֔י/הָ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'the nail fastened in a firm place.'
    reason: lexical_alternative
  - marker: b
    text: '''Load'' could also be rendered ''burden''; the Hebrew refers to what was hanging on the peg.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에, 만군의 야훼의 말씀입니다. 단단한 곳에 고정된 말뚝[a]이 움직여 빠져나가고, 잘려 떨어질 것이며, 그 위에 있던 짐은 잘려 나갈 것입니다[b]. 야훼께서 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘단단한 곳에 박힌 못’.
    reason: lexical_alternative
  - marker: b
    text: ‘짐’은 ‘부담’으로도 옮길 수 있으며, 히브리어는 말뚝에 걸려 있던 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָא֖וֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼께서 선언하십니다
  alternatives_korean:
  - 만군의 야훼의 말씀이십니다
  - 만군의 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식을 한국어로는 ‘선언하십니다’로 자연스럽게 옮기는 것이 합쇼체에 맞고, יְהוָה צְבָאוֹת은 프로젝트 기본어휘에 따라 ‘만군의 야훼’로 유지합니다.
- source_word: הַיָּתֵד / הַתְּקוּעָה
  english_pob_choice: the peg fastened
  chosen_korean: 단단한 곳에 박혀 있던 못
  alternatives_korean:
  - 박혀 있던 말뚝
  - 단단한 곳에 고정된 못
  lexicon: HALOT
  rationale: יָתֵד는 문맥상 하중을 버티는 박힌 물체를 가리키므로 ‘못’으로 옮기되, 기둥보다 더 광범위한 고정물 이미지를 살리기 위해 ‘박혀 있던’으로 תְּקוּעָה의 상태를 반영합니다.
- source_word: תָּמוּשׁ / וְנִגְדְּעָה וְנָפְלָה
  english_pob_choice: will give way / it will be cut down and fall
  chosen_korean: 흔들리고, 뽑혀 떨어지며
  alternatives_korean:
  - 비켜나고, 잘려 쓰러지며
  - 움직이고, 잘려 넘어지며
  lexicon: HALOT
  rationale: מוּשׁ의 ‘give way’는 지지력이 무너지는 느낌이므로 ‘흔들리다’가 가장 자연스럽고, 뒤이은 절단·추락의 연속 동작을 ‘뽑혀 떨어지다’로 압축해 원문의 심상을 보존합니다.
- source_word: הַמַּשָּׂא
  english_pob_choice: the load
  chosen_korean: 그 위에 매달려 있던 짐
  alternatives_korean:
  - 그 위에 얹혀 있던 짐
  - 부담
  lexicon: HALOT
  rationale: מַשָּׂא의 문자적 의미는 ‘짐/무게’이며, 못에 매달린 대상이라는 비유를 살리기 위해 추상적 ‘부담’보다 구체적인 ‘짐’을 택했습니다.
theological_decisions:
- issue: 못과 짐의 비유가 가리키는 대상의 명시 여부
  chosen_reading: 비유를 그대로 유지하고, 못의 구체적 지시 대상을 한국어 본문에서 특정하지 않았습니다.
  alternative_readings:
  - 못을 엘리아김으로 구체화하는 해석
  - 못을 그가 지탱하던 집안/권력 구조로 넓게 이해하는 해석
  rationale: 본문 자체가 이 절에서 참조 대상을 명시하지 않으므로, 번역이 해석을 앞서지 않도록 메타포를 보존했습니다. 이는 직전 약속의 안정성 이미지와 이 절의 붕괴 이미지를 함께 읽게 합니다.
  doctrine_reference: 본문의 긴장을 해소하지 않고 보존
