source:
  edition: WLC
  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
  footnotes:
  - marker: a
    text: Or 'you gathered the water of the lower reservoir.' The Hebrew term for 'pool' can also denote a reservoir.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 성의 무너진 곳이 많은 것을 보셨으며, 아래 못의 물을 모으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘못’은 ‘저수지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  english_pob_choice: breaches
  chosen_korean: 무너진 곳
  alternatives_korean:
  - 틈
  - 파손된 곳
  - 벌어진 곳
  lexicon: HALOT
  rationale: 성벽과 방어 체계의 맥락에서 열린 구멍이나 붕괴된 부분을 뜻하므로, 현대 한국어에서는 자연스럽고 상황을 잘 드러내는 '무너진 곳'이 적절합니다.
- source_word: עִיר דָּוִד
  english_pob_choice: the city of David
  chosen_korean: 다윗 성
  alternatives_korean:
  - 다윗의 성
  - 다윗 도시
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 굳어진 역사 지명 표현을 살리되, 원문의 고유 명칭을 자연스럽게 옮기기 위해 '다윗 성'으로 처리했습니다.
- source_word: וַתְּקַבְּצוּ אֶת מֵי
  english_pob_choice: you collected the waters
  chosen_korean: 물을 모으셨습니다
  alternatives_korean:
  - 물을 거두셨습니다
  - 물을 모아 두셨습니다
  lexicon: HALOT
  rationale: קבץ는 '모으다/집합하다'의 뜻이므로, 물을 대상으로 할 때는 '모으다'가 가장 직접적이고 자연스럽습니다.
- source_word: הַבְּרֵכָה הַתַּחְתּוֹנָה
  english_pob_choice: the lower pool
  chosen_korean: 낮은 못
  alternatives_korean:
  - 아래 못
  - 하부 저수지
  - 낮은 저수지
  lexicon: HALOT
  rationale: בְּרֵכָה는 '못' 또는 '저수지'가 가능하지만, 본문은 지형적 대비를 보이는 표현이어서 간결한 '낮은 못'이 원문의 위치 표지를 잘 전달합니다.
