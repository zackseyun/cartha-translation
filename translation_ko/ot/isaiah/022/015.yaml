source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת לֶךְ בֹּא֙ אֶל הַ/סֹּכֵ֣ן הַ/זֶּ֔ה עַל שֶׁבְנָ֖א אֲשֶׁ֥ר עַל הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
  footnotes:
  - marker: a
    text: Or 'Go in to this official, Shebna.' The Hebrew has two imperatives, 'Go, come,' which may function together idiomatically.
    reason: lexical_alternative
  - marker: b
    text: '''Who is over the house'' refers to a chief palace administrator or steward.'
    reason: cultural_note
translation:
  language: ko
  text: 만군의 주 야훼께서 이렇게 말씀하십니다. “가라[a], 이 관리 곧 왕궁을 맡은 셉나[b]에게로 들어가라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가라, 들어가라’라는 두 명령형을 쓰며, 하나의 관용적 촉구로 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘왕궁을 맡은 자’는 궁정의 최고 행정 책임자, 곧 관리(steward)를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식을 한국어에서 자연스럽고 격식 있게 살리면서, 선언문의 구어적 힘도 유지합니다.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: the Lord Yahweh of hosts
  chosen_korean: 만군의 주 야훼
  alternatives_korean:
  - 만군의 주 하나님
  - 만군의 주 여호와
  lexicon: HALOT
  rationale: 합성 신칭의 긴장을 유지하면서, YHWH는 본 프로젝트 기본값인 야훼로 옮기고 צְבָאוֹת는 만군의로 간결하게 처리했습니다.
- source_word: לֶךְ בֹּא
  english_pob_choice: Go, come
  chosen_korean: 가서 … 들어가라
  alternatives_korean:
  - 가라, 들어가라
  - 가서 오라
  lexicon: HALOT
  rationale: 두 명령형의 반복 강세를 살리되 한국어에서는 목적어 앞으로의 진입 동작을 분명히 하기 위해 자연스러운 동사쌍으로 옮겼습니다.
- source_word: הַסֹּכֵן
  english_pob_choice: steward
  chosen_korean: 관리
  alternatives_korean:
  - 청지기
  - 행정관
  lexicon: HALOT
  rationale: 문맥상 궁정 행정 책임자를 가리키므로, 비유적 울림이 강한 청지기보다 기능을 직접 드러내는 관리를 택했습니다.
- source_word: עַל הַבָּיִת
  english_pob_choice: who is over the house
  chosen_korean: 왕궁을 맡은 자
  alternatives_korean:
  - 궁정을 맡은 자
  - 왕궁의 책임자
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 한국어에서 이해되는 궁정 최고 관리의 직무를 드러내면서도, 과도한 의역은 피했습니다.
theological_decisions:
- issue: יְהוִה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 방침에 따라 여호와 대신 야훼를 사용해 언약명 자체를 드러냈습니다. 합성 호칭인 ‘주 야훼’는 원문의 אֲדֹנָי + יְהוִה 긴장을 보존합니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
