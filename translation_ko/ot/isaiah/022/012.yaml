  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
  footnotes:
  - marker: a
    text: Or 'for shaving the head' or 'for making oneself bald'—a mourning practice signified by the Hebrew term rendered 'baldness.'
