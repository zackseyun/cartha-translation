  source_fidelity: 히브리어의 신칭 אֲדֹנָי יְהוִה צְבָאוֹת은 ‘주 만군의 야훼’로 옮기는 것이 세 요소를 모두 보존합니다. 초안의 ‘주 야훼 만군의 하나님’은 צְבָאוֹת의 수식 관계가 불분명하고, 본문에 없는 ‘하나님’을 덧붙인 듯한 구조가 됩니다. לִבְכִי 이하의 병렬은 요구된 애도 행위들이므로 ‘…하도록 부르셨습니다’로 명시하는 편이 정확합니다.
  naturalness: ‘울며 애도하며 대머리가 되고 베를 두르는 일을 부르셨습니다’는 한국어에서 목적어 및 병렬 관계가 어색합니다. ‘울며 애도하고, 머리를 밀며 베옷을 두르도록 부르셨습니다’는 현대 표준어 합쇼체에서 자연스럽고, 예언문 특유의 엄숙한 문체도 유지합니다.
  terminology: YHWH는 POB 방침에 따라 ‘야훼’로 유지했습니다. צְבָאוֹת은 확립된 성서 용례인 ‘만군’으로, שָׂק은 한국어 성서 문맥에서 자연스러운 ‘베옷’으로 옮겼습니다. קָרְחָה는 문맥상 애도의 머리 밀기이지만 명사의 결과 상태도 고려하여 각주에서 직역적 의미와 대안을 밝혔습니다.
  issues:
