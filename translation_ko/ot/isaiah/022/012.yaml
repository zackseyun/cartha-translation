translation:
  language: ko
  text: 그날에 주 만군의 야훼께서 울며 애도하고, 머리를 밀며 베옷을 두르도록 부르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리를 밀며’는 히브리어 ‘대머리 됨’을 뜻하는 명사에서 옮긴 말입니다. 애도의 표시로 머리를 밀거나 스스로 대머리가 되는 관습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 소집하셨습니다
  - 호소하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘부르다’보다 특정한 애도 행위를 요구하는 소집의 뉘앙스를 가지므로, 자연스러운 합쇼체로 ‘부르셨습니다’라고 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: the Lord GOD of hosts
  chosen_korean: 주 야훼 만군의 하나님
  alternatives_korean:
  - 주 하나님 만군의 주재
  - 주 하나님 만군의 야훼
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוִה의 겹친 신칭을 살리면서도 한국어에서 어색한 ‘주 주’ 구조를 피하기 위해 ‘주 야훼’로 두 요소를 드러내고, צְבָאוֹת은 관용적으로 ‘만군의 하나님’으로 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때
  lexicon: HALOT
  rationale: 예언서에서 반복되는 시간 표현으로서 장면 전환을 분명하게 하는 ‘그날에’가 가장 자연스럽습니다.
- source_word: לִבְכִי ... וּלְמִסְפֵּד ... וּלְקָרְחָה ... וְלַחֲגֹר שָׂק
  english_pob_choice: for weeping, for mourning, for baldness, and for putting on sackcloth
  chosen_korean: 울며 애도하며 대머리가 되고 베를 두르는 일
  alternatives_korean:
  - 우는 일과 애도하는 일과 머리를 미는 일과 베를 두르는 일
  - 통곡하며 슬퍼하며 머리를 깎고 베를 두르는 일
  lexicon: HALOT
  rationale: 히브리어의 ל 접두 반복은 목적/대상을 나열하므로 한국어에서도 동작의 연속으로 풀어, ‘울며 애도하며’와 ‘대머리가 되고 베를 두르는 일’로 애도 표지를 살렸습니다. ‘대머리’는 결과 상태를 직역해 문맥상 머리 깎음/면도 행위를 포함하는 애도 관습을 열어 둡니다.
theological_decisions:
- issue: 야훼 표기와 겹칭(divine compound title) 처리
  chosen_reading: 아들림 없이 본문에서 יְהוִה를 야훼로 직접 드러내되, אֲדֹנָי와의 결합은 ‘주 야훼’로 유지했습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본 절은 아ֲדֹנָי יְהוִה의 결합형으로, 전통적 ‘주 하나님’은 יְהוִה의 고유명 드러남을 약화시키므로, POB 원칙에 따라 야훼를 본문에 반영했습니다.
  doctrine_reference: 'POB standard: יְהוָה YHWH → 야훼'
