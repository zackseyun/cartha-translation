    rationale: וַיִּקְרָא는 여기서 애도 행위를 요구하거나 촉구했다는 뜻입니다. 한국어에서는 ‘…하도록 부르셨습니다’가 이 목적·요구의 관계를 자연스럽게 표현합니다.
