source:
  edition: WLC
  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: ko
  text: 이 나라들의 모든 신들 가운데서 누가 자기 땅을 내 손에서 건져 냈느냐? 어찌 야훼께서 예루살렘을 내 손에서 건져 내시겠느냐?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 어느 신이
  - 누구가
  lexicon: HALOT
  rationale: 도전적인 수사 의문문이므로 ‘누가’로 압축해 영어 POB의 조롱조를 자연스럽게 살렸습니다.
- source_word: בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  english_pob_choice: among all the gods of these lands
  chosen_korean: 모든 나라의 신들 가운데서
  alternatives_korean:
  - 이 땅들의 모든 신들 가운데서
  - 이 나라들의 모든 신들 가운데서
  lexicon: HALOT
  rationale: 전치사 בְּ와 총칭 표현을 한국어 ‘…가운데서’로 옮겨 범주 안에서의 비교를 드러냈고, אֲרָצוֹת는 여러 정복지의 의미를 살려 ‘나라의’로 자연화했습니다.
- source_word: הִצִּילוּ / יַצִּיל
  english_pob_choice: has delivered / should deliver
  chosen_korean: 건져냈느냐 / 건져내실 수 있겠느냐
  alternatives_korean:
  - 구해냈느냐 / 구해내실 수 있겠느냐
  - 구원했느냐 / 구원하실 수 있겠느냐
  lexicon: HALOT
  rationale: נצל의 핵심인 ‘구출/탈출’ 감각을 살리되, 군사적 조롱 맥락에서는 ‘건져내다’가 더 구체적이고 압박감이 있습니다. 뒤의 יַצִּיל은 단순 미래보다 조롱하는 가능성 의문으로 읽어 ‘수 있겠느냐’로 옮겼습니다.
- source_word: מִיָּדִי
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손에서부터
  - 내 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 통치·권세의 물리적 은유를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명을 가리키므로 POB의 원칙에 따라 ‘야훼’를 유지했습니다. ‘주님’은 칭호로 바뀌어 대조의 날카로움이 약해집니다.
theological_decisions:
- issue: 야훼의 이름을 직접 표기할지 여부
  chosen_reading: 야훼께서 예루살렘을 내 손에서 건져내실 수 있겠느냐
  alternative_readings:
  - 주님께서 예루살렘을 내 손에서 건져내실 수 있겠느냐
  - 여호와께서 예루살렘을 내 손에서 건져내실 수 있겠느냐
  rationale: 본문은 יְהוָה를 직접 사용하므로, 고유명사를 칭호로 대체하지 않고 ‘야훼’로 옮겨 대조와 조롱의 초점을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
