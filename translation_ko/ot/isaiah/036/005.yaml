id: ISA.36.5
reference: Isaiah 36:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ko
  text: “당신은 ‘전쟁을 위한 계획과 힘이 있다’고 말합니다. 그러나 그것은 입술의 말일 뿐입니다. 이제 당신은 누구를 의지하기에 나를 거슬러 반역하였습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문 표기는 אָמַרְתִּי(‘내가 말하였다’)로 읽힐 수 있으나, 문맥과 열왕기하 18:20의 평행 본문에 따라 2인칭 ‘당신은 말합니다’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: You say
  chosen_korean: “당신은 말합니다”
  alternatives_korean:
  - “내가 말합니다”
  - “당신이 말합니다”
  lexicon: אָמַר
  rationale: 문맥상 히스기야에게 하는 산헤립의 직접적 책망이므로 1인칭 ‘내가’보다 2인칭 ‘당신은’이 원문의 대조와 영어 POB의 ‘You say’를 잘 반영합니다.
- source_word: דְּבַר שְׂפָתַיִם
  english_pob_choice: only words of the lips
  chosen_korean: “입술의 말에 불과합니다”
  alternatives_korean:
  - “입술의 말뿐입니다”
  - “입술에서 나온 말일 뿐입니다”
  lexicon: דָּבָר / שָׂפָה
  rationale: ‘입술’과 ‘말’의 결합을 살리면서, 평가절하의 뉘앙스를 한국어 관용으로 자연스럽게 ‘불과합니다’로 옮겼습니다.
- source_word: עֵצָה וּ/גְבוּרָה לַ/מִּלְחָמָה
  english_pob_choice: There is counsel and strength for war
  chosen_korean: “전쟁에 대한 계획과 힘이 있다”
  alternatives_korean:
  - “전쟁을 위한 조언과 힘이 있다”
  - “전쟁을 위한 모략과 능력이 있다”
  lexicon: עֵצָה / גְבוּרָה / מִלְחָמָה
  rationale: עֵצָה는 단순한 조언보다 ‘계획/모략’의 실질성을 띠므로 ‘계획’으로, גְבוּרָה는 군사적 역량을 반영해 ‘힘’으로 옮겼습니다.
- source_word: בִּי
  english_pob_choice: against me
  chosen_korean: “나에게”
  alternatives_korean:
  - “내게”
  - “나를 상대로”
  lexicon: בְּ + 1cs pronominal suffix
  rationale: 반역의 대상이 되는 화자를 분명히 드러내기 위해 직설적으로 ‘나에게 반역하였습니까’로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 화자 구분과 감정적 압박
  chosen_reading: 산헤립의 조롱과 심문을 살리기 위해 2인칭 직접 호칭과 인용부호를 유지했습니다.
  alternative_readings:
  - 서술체로 완화하여 ‘네가 말하되’로 처리
  - 직접 인용을 약화하여 평서문으로 처리
  rationale: 본문은 상대를 몰아붙이는 수사적 질문이 핵심이므로, 한국어에서도 압박감이 분명히 드러나야 합니다.
  doctrine_reference: 본문의 역사-서사적 화행 보존
- issue: ‘입술의 말’의 경멸적 평가
  chosen_reading: 단순 무력화가 아니라 상대의 발언을 공허한 말로 깎아내리는 비꼼을 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘말뿐입니다’로 완화
  - 설명적으로 풀어 비유를 희석
  rationale: 원문은 군사적 자신감을 조롱하는 표현이어서, 평가절하의 강도를 유지하는 것이 의미상 중요합니다.
  doctrine_reference: 본문의 수사적 의도 보존
