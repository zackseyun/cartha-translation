  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִים֩ וְ/שֶׁבְנָ֨א וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר אֵלֵ֨י/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חוֹמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
  footnotes:
  - marker: a
    text: Or “in Hebrew.” The Hebrew term יְהוּדִית refers more specifically to the language of Judah/Judeans.
    reason: lexical_alternative
  - marker: b
    text: Rabshakeh is likely an Assyrian official title rather than a personal name.
    reason: cultural_note
translation:
  language: ko
  text: 그때 엘리야김, 셉나, 요아흐가 랍사게에게 말했습니다. “부디 당신의 종들에게 아람어로 말씀해 주십시오. 우리는 그것을 알아듣습니다. 또 성벽 위의 백성이 듣고 있는 앞에서 우리에게 유다말로 말씀하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “히브리어로.” 히브리어 יְהוּדִית는 더 구체적으로 유다/유다 사람들의 언어를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍사게(관직명)
  - 라브사게
  lexicon: HALOT
  rationale: 영어 POB가 고유명사처럼 유지한 관용을 따라, 한국어에서도 음역해 본문 흐름을 해치지 않도록 했습니다.
- source_word: דַּבֶּר נָא
  english_pob_choice: Please speak
  chosen_korean: 부디 ... 말씀해 주십시오
  alternatives_korean:
  - 말씀해 주십시오
  - 부디 말씀하십시오
  - 제발 말씀해 주십시오
  lexicon: HALOT
  rationale: נָא가 담는 공손한 요청을 현대 한국어의 정중한 청유로 옮겼고, 직설적 명령보다 완곡한 요청을 살렸습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 신하들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 궁정적 자기비하의 예의를 살리되, 영어 POB의 'servants'와 같은 격식을 유지하기 위해 '종들'을 택했습니다.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  english_pob_choice: for we understand it
  chosen_korean: 우리는 그것을 알아듣습니다
  alternatives_korean:
  - 우리는 그것을 듣습니다
  - 우리는 이해합니다
  - 우리는 알아듣고 있습니다
  lexicon: HALOT
  rationale: 언어를 알아듣는다는 문맥에서 שׁמע의 의미를 자연스럽게 드러내기 위해 '알아듣다'를 사용했습니다.
- source_word: יְהוּדִית
  english_pob_choice: in Judean
  chosen_korean: 유다말로
  alternatives_korean:
  - 히브리어로
  - 유대말로
  - 유다의 언어로
  lexicon: HALOT
  rationale: 이 표현은 민족·지역적으로 유다 사람들의 말을 가리키므로, 전통적 '히브리어'보다 원문 구별을 더 잘 살리는 '유다말'을 택했습니다.
theological_decisions:
- issue: 청자 앞에서의 은밀한 언어 전환과 공개 발화의 대비
  chosen_reading: 성벽 위의 백성이 듣고 있는 앞에서
  alternative_readings:
  - 성벽 위의 사람들 귀에 들리도록
  - 성벽 위의 백성이 있는 데서
  rationale: 베니유어(bə-’oznê) 관용구의 의미를 살려, 단순한 청각 정보가 아니라 공개적 노출 상황을 드러냈습니다.
  doctrine_reference: source-sensitive discourse rendering
