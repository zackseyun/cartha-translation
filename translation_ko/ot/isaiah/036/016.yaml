id: ISA.36.16
reference: Isaiah 36:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
  footnotes:
  - marker: a
    text: Literally, 'Make with me a blessing.' The phrase is an idiom for making peace or coming to favorable terms.
    reason: lexical_alternative
  - marker: b
    text: '''Each man'' renders the repeated Hebrew אִישׁ, a masculine singular distributive expression meaning each individual in the group.'
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야의 말을 듣지 마십시오. 앗수르 왕이 이렇게 말합니다. "나와 화친을 맺고 내게로 나오십시오. 그러면 각 사람이 자기 포도나무와 자기 무화과나무의 열매를 먹고, 각 사람이 자기 물웅덩이의 물을 마시게 될 것입니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  english_pob_choice: listen to
  chosen_korean: 듣지 마십시오
  alternatives_korean:
  - 귀를 기울이지 마십시오
  - 말을 듣지 마십시오
  lexicon: HALOT
  rationale: 히브리어 שׁמע אל의 관용적 의미를 살려, 단순한 청각이 아니라 히스기야의 말을 받아들이지 말라는 뜻으로 자연스럽게 옮겼습니다.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  english_pob_choice: Make peace with me
  chosen_korean: 나와 화친을 맺고
  alternatives_korean:
  - 나와 평화를 맺고
  - 나와 협정을 맺고
  - 나와 복을 맺고
  lexicon: HALOT
  rationale: 직역하면 '축복을 하다'에 가깝지만, 여기서는 외교적 제안의 관용구이므로 관계를 정상화하는 뜻을 드러내는 '화친을 맺다'를 택했습니다.
- source_word: אִישׁ
  english_pob_choice: each one / each man
  chosen_korean: 각 사람이
  alternatives_korean:
  - 각자
  - 모든 사람이
  - 각 남자가
  lexicon: HALOT
  rationale: 반복되는 אִישׁ의 분배적 힘을 살리되, 한국어에서는 성별을 과도하게 전면화하지 않고도 개별성을 드러내는 '각 사람이'가 가장 자연스럽습니다.
- source_word: בּוֹר
  english_pob_choice: cistern
  chosen_korean: 물웅덩이
  alternatives_korean:
  - 우물
  - 저수조
  - 구덩이
  lexicon: HALOT
  rationale: 문맥상 샘솟는 우물보다 물을 저장하는 저장소의 의미가 강하므로, 현대 독자가 이해하기 쉬운 '물웅덩이'로 옮기되 저장 기능을 잃지 않게 했습니다.
theological_decisions:
- issue: 앗수르 왕의 선동적 연설을 어떻게 처리할지
  chosen_reading: 원문의 협박 섞인 회유를 그대로 살려, 명령형과 약속형 어조를 함께 유지했습니다.
  alternative_readings:
  - 부드러운 제안처럼 완화하는 번역
  - 노골적인 항복 요구로만 번역하는 방식
  rationale: 본문은 단순한 제안이 아니라 히스기야의 말을 끊고 백성을 자기 편으로 끌어들이려는 정치적 선동입니다. 그래서 화친과 '내게로 나오십시오'를 함께 두어 긴장을 유지했습니다.
  doctrine_reference: 본문 이해상의 수사적·역사적 맥락
- issue: '''각 사람''의 반복과 성별 표지'
  chosen_reading: 한국어 본문은 '각 사람'으로 옮기고, 히브리어의 분배적 반복은 구조로 보존했습니다.
  alternative_readings:
  - 각 남자
  - 각자
  - 모든 사람
  rationale: 히브리어의 אִישׁ 반복은 문법적으로 남성 단수이지만, 한국어에서는 독자가 내용을 쉽게 읽도록 하면서도 분배적 의미를 유지하는 것이 우선입니다.
  doctrine_reference: 번역 원칙상 출발어 구조 보존과 자연성의 균형
