  naturalness: 합쇼체는 유지되어 있으나, ‘각 사람이 … 마시게 될 것입니다’는 앞선 청유성 명령들과 호응하지 않습니다. ‘각자’와 반복된 명령형을 사용하면 현대 표준 한국어로 더 자연스럽고 원문의 분배성을 잘 살립니다.
