  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד בֹּאִ֕/י וְ/לָקַחְתִּ֥י אֶתְ/כֶ֖ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֑ם אֶ֤רֶץ דָּגָן֙ וְ/תִיר֔וֹשׁ אֶ֥רֶץ לֶ֖חֶם וּ/כְרָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/017.yaml
  text: until I come and take you away to a land like your own land—a land of grain and new wine[b][a], a land of bread and vineyards.
  footnotes:
  - marker: a
    text: Or 'and take you to a land like your own land.' The Hebrew verb simply means 'take'; 'take you away' makes the relocation/deportation sense explicit in context.
    reason: lexical_alternative
  - marker: b
    text: '''New wine'' renders Hebrew תירוש, a term often distinguished from the more general word for wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 오기까지 기다렸다가, 내가 너희를 너희 땅과 같은 땅 — 곡식과 새 포도주의 땅, 빵과 포도원의 땅으로 데려가겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려가겠습니다’는 히브리어 לקח의 기본 뜻(‘취하다’)보다 이 문맥의 강제 이주 뉘앙스를 드러낸 옮김입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새 포도주’는 히브리어 תירוש의 일반적인 의미를 반영하며, 단순한 ‘포도주’와 구별됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  english_pob_choice: until I come
  chosen_korean: 내가 오기까지
  alternatives_korean:
  - 내가 올 때까지
  - 내가 도착할 때까지
  lexicon: HALOT
  rationale: עַד + בוא의 시간 한계를 자연스러운 한국어 종결 표현으로 옮겼습니다. "오기까지"는 직역에 가깝고 문맥의 대기 상태를 살립니다.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  english_pob_choice: and take you away
  chosen_korean: 내가 너희를 … 데려가겠습니다
  alternatives_korean:
  - 내가 너희를 데려가겠습니다
  - 내가 너희를 데리고 가겠습니다
  lexicon: HALOT
  rationale: לקח는 기본적으로 "취하다/데려가다"이지만, 포로 이동의 문맥상 단순한 이동이 아니라 강제적 이주를 암시합니다. 그래서 "데려가겠습니다"를 택하되, 영어 본문처럼 과도한 해석어는 피했습니다.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  english_pob_choice: a land of grain and new wine
  chosen_korean: 곡식과 새 포도주의 땅
  alternatives_korean:
  - 곡식과 포도주의 땅
  - 곡식과 신포도주의 땅
  lexicon: HALOT
  rationale: דגן은 곡물/곡식의 일반어로서 현대 한국어에서는 "곡식"이 가장 자연스럽습니다. תירוש는 일반적인 포도주보다 새 포도주를 가리키므로 그 구별을 살렸습니다.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  english_pob_choice: a land of bread and vineyards
  chosen_korean: 빵과 포도원의 땅
  alternatives_korean:
  - 빵과 포도원의 땅
  - 떡과 포도원의 땅
  - 빵과 포도밭의 땅
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로 "빵"이므로, 추상화한 "양식"보다 원문 이미지를 살렸습니다. כְּרָמִים은 포도 재배지가 아니라 포도원들이므로 "포도원"으로 옮겼습니다.
theological_decisions:
- issue: 원문의 반복적 농업 이미지가 아시리아의 회유적 약속을 어떻게 드러내는지
  chosen_reading: 땅의 풍요를 나열하는 문구를 그대로 살려, 강제 이주의 약속이 포장된 선전적 어조가 드러나게 했습니다.
  alternative_readings:
  - 의역하여 단순히 '풍요로운 땅'이라고 정리하기
  - 농업 항목을 일부 생략하기
  rationale: 이 절은 단순한 풍요 묘사가 아니라, 포로 이동을 달콤하게 포장하는 말입니다. 항목을 유지해야 독자가 원문의 설득 전략을 읽을 수 있습니다.
  doctrine_reference: 본문의 역사서술 및 예언적 수사에 대한 충실성
