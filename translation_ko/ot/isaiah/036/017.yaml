  source_fidelity: 히브리어 עַד בֹּאִי는 앞 절의 명령에 이어지는 ‘내가 올 때까지’라는 시간 한정이며, וְלָקַחְתִּי는 이어지는 ‘내가 너희를 데려가겠다’입니다. 초안은 이 의미를 대체로 반영하지만, ‘기다렸다가’는 합쇼체 종결과 연결되지 않아 문장 구조를 바로잡을 필요가 있습니다.
  naturalness: ‘내가 오기까지 기다렸다가’는 현대 표준 한국어 합쇼체로는 미완의 연결 표현입니다. ‘내가 올 때까지 기다리십시오. 그러면 … 데려가겠습니다’로 해야 앞 절에서 이어진 명령의 의미와 공적 발화의 격식을 자연스럽게 전달합니다. 또한 ‘~의 땅’의 반복은 원문의 수사를 유지하되, ‘~가 있는 땅’으로 풀어 쓰는 편이 자연스럽습니다.
  terminology: ‘곡식’, ‘새 포도주’, ‘빵’, ‘포도원’은 각각 דגן, תירוש, לחם, כרמים에 충실합니다. תירוש를 ‘새 포도주’로 옮긴 것은 가능하지만, 각주에서 그것이 무조건적인 ‘일반적 의미’라고 단정하기보다 יין과의 어휘적 구별을 설명하는 것이 적절합니다.
