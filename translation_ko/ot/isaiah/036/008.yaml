  source_fidelity: 히브리어의 도발적인 제안(‘내기를 하십시오’), 앗수르 왕을 화자의 ‘주인’으로 부르는 표현, 말 이천 마리, 그리고 그 말을 탈 사람을 마련할 수 있는지 묻는 조건은 대체로 충실히 옮겼습니다. 다만 ‘그것들’보다 말의 지시어를 명시하는 편이 자연스럽고 의미가 선명합니다.
  naturalness: 초안의 ‘주겠소’는 현대 표준 합쇼체가 아니라 하오체이므로, 지정된 문체와 일치하지 않습니다. ‘주겠습니다’로 고쳐야 합니다. 또한 ‘그 말을 탈 사람들’이 ‘그것들을 탈 사람들’보다 자연스럽습니다.
  terminology: ‘내 주인’은 인간 상관을 뜻하는 אֲדֹנִי를 적절히 반영합니다. 문장 안에서는 ‘내 주인인 앗수르 왕’으로 연결하면 동격 관계가 더 분명합니다. ‘내기’는 본문의 조롱 섞인 wager/challenge의 성격을 무리 없이 살립니다.
  issues:
