id: ISA.36.8
reference: Isaiah 36:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י הַ/מֶּ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
  footnotes:
  - marker: a
    text: Or 'make a pledge with' / 'strike a bargain with.' The Hebrew verb can carry the sense of entering a pledge or wager; here the context favors the taunting sense of a wager or challenge.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디 내 주인인 앗수르 왕과 내기를 하십시오. 그러면 내가 당신에게 말 이천 마리를 주겠습니다. 당신이 그 말을 탈 사람들을 마련할 수 있다면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내기를 하십시오’는 히브리어 동사의 도발적 뉘앙스를 살린 번역입니다. ‘약조를 맺다’, ‘계약하다’와 같은 의미도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  english_pob_choice: make a wager
  chosen_korean: 내기를 하십시오
  alternatives_korean:
  - 판돈을 걸고 겨루십시오
  - 약조를 맺으십시오
  - 도전해 보십시오
  lexicon: HALOT
  rationale: 히트파엘형의 도발적 뉘앙스와 문맥상 조롱 섞인 ‘wager/challenge’를 살리기 위해, 일상적이고 현대적인 ‘내기를 하다’를 택했습니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 지금
  - 제발
  lexicon: HALOT
  rationale: 형식상 정중한 요청을 나타내는 입자이므로, 현대 한국어에서 자연스러운 완곡 표현인 ‘부디’로 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  english_pob_choice: my master, the king of Assyria
  chosen_korean: 내 주인, 앗수르 왕
  alternatives_korean:
  - 내 주, 앗수르 왕
  - 나의 주인인 앗수르 왕
  lexicon: HALOT
  rationale: אֲדֹנִי는 화자의 인간 상관을 가리키므로 전통적 신칭 ‘주’보다 관계를 드러내는 ‘주인’이 더 정확합니다.
- source_word: אַלְפַּיִם סוּסִים
  english_pob_choice: two thousand horses
  chosen_korean: 말 이천 마리
  alternatives_korean:
  - 말 이천 필
  - 이천 마리의 말
  lexicon: HALOT
  rationale: 숫자와 명사를 직접 대응시켜 군마의 수량을 분명히 드러냈습니다. ‘필’도 가능하지만, 현대어의 자연스러움은 ‘마리’가 더 높습니다.
- source_word: רֹכְבִים עֲלֵיהֶם
  english_pob_choice: riders for them
  chosen_korean: 그것들을 탈 사람들
  alternatives_korean:
  - 그 위에 탈 사람들
  - 그 말을 탈 기병들
  - 그것들을 타는 기수들
  lexicon: HALOT
  rationale: 문맥상 단순한 탑승이 아니라 말을 탈 자격을 갖춘 사람을 마련하는 뜻이지만, 군사적 배경을 과도하게 특정하지 않기 위해 비교적 직접적인 표현을 택했습니다.
theological_decisions:
- issue: 조롱 섞인 도전의 말투를 한국어에서 어떻게 보존할지
  chosen_reading: 명령형 ‘내기를 하십시오’와 뒤이은 조건절을 통해, 라브사게의 빈정거리는 도전성을 그대로 드러냈습니다.
  alternative_readings:
  - 부디 왕과 합의해 보십시오
  - 왕과 약속을 맺어 보십시오
  rationale: 본문은 단순한 제안이 아니라, 앗수르의 우위를 과시하는 조롱 섞인 시합 제안이므로 한국어도 그 도발성을 약화시키지 않아야 합니다.
  doctrine_reference: 본문 해석상 화자 의도와 수사적 효과 보존
