    issue: ‘주겠소’의 문체
    rationale: ‘주겠소’는 하오체이며, 과제가 요구하는 현대 표준어 합쇼체와 맞지 않습니다. ‘주겠습니다’가 적절합니다.
  - severity: low
    issue: ‘그것들을 탈 사람들’의 지시 대상
    rationale: 말을 가리키는 대명사를 ‘그 말’로 명시하면 한국어에서 더 자연스럽고, 기병을 마련할 수 없다는 조롱의 초점도 선명해집니다.
