    rationale: 이 표현은 물리적으로 떠남을 연상할 수 있습니다. 여기서는 ‘야훼 없이’가 ‘야훼의 관여 없이/독립하여’라는 수사 의문의 뜻을 직접적으로 나타냅니다.
