  source_fidelity: 첫 절의 לְהַשְׁחִיתָהּ(‘그것을 멸하려고’)가 초안에서는 ‘치러’에 흡수되어 파괴 목적이 빠졌습니다. 또한 מִבַּלְעֲדֵי의 뜻에는 ‘야훼를 떠나’보다 ‘야훼 없이’가 더 직접적이고 자연스럽습니다. 명령문의 두 동사와 ‘그것’의 목적어를 모두 보존하도록 고쳤습니다.
  naturalness: ‘이제 내가 야훼 없이 이 땅을 치러 올라와 그것을 멸하려 한 것입니까?’는 현대 표준어에서 수사 의문문의 도전적 어조를 자연스럽게 유지합니다. 각주 표지는 해당 어구 바로 뒤에 두었습니다.
  terminology: יְהוָה는 프로젝트 방침과 초안의 용례를 따라 ‘야훼’로 유지했습니다. הַשְׁחִית는 두 차례 모두 ‘멸하다’로 옮겨 반복과 강도를 보존했습니다.
