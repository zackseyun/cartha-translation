    rationale: 히브리어 עָלִיתִי עַל ... לְהַשְׁחִיתָהּ는 ‘이 땅을 치러/대적하여 올라와 그것을 멸하려고’라는 두 요소를 포함합니다. 초안의 ‘이 땅을 치러 올라온’은 적대적 접근은 전달하지만 לְהַשְׁחִיתָהּ를 별도로 번역하지 않았습니다.
