source:
  edition: WLC
  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
  footnotes:
  - marker: a
    text: Or 'without the LORD' or 'independently of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 내가 야훼 없이[a] 이 땅을 치러 올라와 그것을 멸하려 한 것입니까? 야훼께서 나에게 “이 땅을 치러 올라가서 그것을 멸하라” 하고 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 떠나’, ‘야훼와 독립적으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  english_pob_choice: was it apart from
  chosen_korean: 야훼를 떠나
  alternatives_korean:
  - 야훼 없이
  - 야훼와 상관없이
  - 야훼와 독립적으로
  lexicon: HALOT
  rationale: 수사 의문문으로서 ‘무엇을 배제한 채/떠나’의 뜻을 살려, 군사적 발화의 도발성을 유지하는 표현으로 옮겼습니다.
- source_word: עָלִיתִי עַל הָאָרֶץ הַזֹּאת
  english_pob_choice: I came up against this land
  chosen_korean: 이 땅을 치러 올라온 것입니까
  alternatives_korean:
  - 이 땅에 올라온 것입니까
  - 이 땅을 향해 올라온 것입니까
  - 이 땅을 치러 온 것입니까
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’와 적대적 전치사 על의 군사 맥락을 함께 살려 ‘치러 올라오다’로 옮겼습니다.
- source_word: לְהַשְׁחִיתָהּ / וְהַשְׁחִיתָהּ
  english_pob_choice: to destroy it / and destroy it
  chosen_korean: 멸하라
  alternatives_korean:
  - 파괴하라
  - 무너뜨리라
  - 파멸시키라
  lexicon: HALOT
  rationale: 두 번 반복되는 파괴 동사를 한국어에서도 강하게 유지하되, 성서적·군사적 맥락에서 ‘멸하다’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 문맥상 아시리아 사신의 주장을 그대로 전달하므로, 본문에서 신적 호칭을 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 아시리아 사신의 발언에 포함된 야훼의 인용권 주장
  chosen_reading: 사신의 주장 자체를 그대로 번역해, 야훼가 실제로 침공을 명하셨다는 주장으로 서술하되 화자의 주장임을 문맥이 드러내게 했습니다.
  alternative_readings:
  - 화자의 주장을 약화시켜 ‘야훼께서 허락하셨다’처럼 완화하는 번역
  - 직접 인용을 생략하는 번역
  rationale: 히브리어 본문은 침공에 대한 신적 명령 주장 자체를 보존합니다. 본문이 주장하는 바를 약화하지 않고, 화자의 책임 있는 발화를 드러내는 것이 source-direct합니다.
  doctrine_reference: 이사야 36:10의 수사적/서술적 문맥
- issue: 직접화법의 명령조 톤
  chosen_reading: 야훼의 직접 명령은 한국어에서 평서형 보고문 안에 따옴표로 처리해, 원문의 인용 구조와 군사적 명령성을 유지했습니다.
  alternative_readings:
  - 간접화법으로 완전히 풀어 쓰는 방식
  - 더 공손한 청유형으로 완화하는 방식
  rationale: 히브리어의 명령문 עֲלֵה / וְהַשְׁחִיתָהּ는 강한 명령이며, 이를 완화하면 화자의 신학적 주장과 폭력적 긴장이 약해집니다.
  doctrine_reference: 히브리어 명령법 및 인용 구조
