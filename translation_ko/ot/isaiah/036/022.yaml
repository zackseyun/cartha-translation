- from: 그때 힐기야의 아들 엘리야김—그는 왕궁을 맡은 사람이었습니다—과 서기관 셉나, 그리고 아삽의 아들 요아, 기록관이 옷을 찢은 채 히스기야에게 와서, 랍사게의 말을 그에게 전했습니다.[a]
  to: 그때 왕궁을 맡은 힐기야의 아들 엘리야김과 서기관 셉나와 기록관 아삽의 아들 요아가 옷이 찢긴 채 히스기야에게 와서 랍사게의 말을 그에게 전했습니다.[a]
  rationale: ‘옷이 찢긴 채’로 상태를 명시하여 히브리어 분사구문의 의미를 보존했습니다. 관직 소개는 관계절과 병렬 구조로 정리하여 자연스러운 현대 한국어 문장으로 다듬었고, 랍사게 각주는 직함의 통상적 이해를 제시하되 확정적으로 단정하지 않도록 조정했습니다.
