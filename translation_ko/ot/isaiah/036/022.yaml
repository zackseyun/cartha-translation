  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣הוּ אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סּוֹפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֖ת דִּבְרֵ֥י רַב שָׁקֵֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
  footnotes:
  - marker: a
    text: Rabshakeh is an Assyrian official title, often understood as something like 'chief cupbearer' or another high-ranking court officer.
    reason: cultural_note
translation:
  language: ko
  text: 그때 힐기야의 아들 엘리야김—그는 왕궁을 맡은 사람이었습니다—과 서기관 셉나, 그리고 아삽의 아들 요아, 기록관이 옷을 찢은 채 히스기야에게 와서, 랍사게의 말을 그에게 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 랍사게는 아시리아 관직명으로, 대체로 ‘대술잔 담당관’ 같은 고위 궁정 관리로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  english_pob_choice: who was over the household
  chosen_korean: 그는 왕궁을 맡은 사람이었습니다
  alternatives_korean:
  - 그는 집안을 맡은 사람이었습니다
  - 그는 궁정을 맡은 사람이었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘집 위에 있는 자’라는 관용구이지만, 본문 맥락상 왕실 행정 책임자를 가리키므로 의미를 살려 ‘왕궁을 맡은 사람’으로 옮겼습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 서기
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘scribe’에 가장 가깝고, 왕실 관직이라는 문맥에서도 자연스러워 ‘서기관’으로 옮겼습니다.
- source_word: הַמַּזְכִּיר
  english_pob_choice: the recorder
  chosen_korean: 기록관
  alternatives_korean:
  - 기록 담당관
  - 기억관
  lexicon: HALOT
  rationale: 왕실의 공적 기록 담당 직함이므로, 한국어 관직 감각을 살리면서도 기능을 보존하는 ‘기록관’이 적절합니다.
- source_word: קְרוּעֵי בְגָדִים
  english_pob_choice: with their clothes torn
  chosen_korean: 옷을 찢은 채
  alternatives_korean:
  - 찢어진 옷을 입은 채
  - 옷이 찢긴 채
  lexicon: HALOT
  rationale: 상태를 나타내는 표현이므로 ‘-한 채’를 써서 그들의 도착 당시 모습을 자연스럽게 전달했습니다.
- source_word: דִּבְרֵי רַב שָׁקֵה
  english_pob_choice: the words of the Rabshakeh
  chosen_korean: 랍사게의 말
  alternatives_korean:
  - 랍사게의 말들
  - 랍사게가 한 말
  lexicon: HALOT
  rationale: דִּבְרֵי는 복수형이지만 한국어에서는 통상 ‘말’로 자연스럽게 옮기며, 고유 직함은 음역 형태를 유지했습니다.
theological_decisions:
- issue: 아시리아 관직 רַב שָׁקֵה의 처리
  chosen_reading: 본문에서는 고유 직함으로 음역한 ‘랍사게’를 유지했습니다.
  alternative_readings:
  - ‘대술잔 담당관’처럼 기능을 풀어쓴 번역
  - ‘술 맡은 장관’ 같은 전통적 관직 해석
  rationale: 이 직함은 본문에서 사실상 고유 명칭처럼 작동하므로, 의미를 추정해 본문에 주입하기보다 음역을 유지하는 것이 독자가 역사적 인물과 직함을 구분하는 데 유익합니다.
  doctrine_reference: 본문 역사 서술의 고유 명칭 보존 원칙
