base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''did not answer him a word,'' an idiom meaning they gave no reply at all.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 잠잠히 있었고 그에게 한마디도 대답하지 않았습니다[a]. 왕이 “그에게 대답하지 말라”고 명령했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그에게 한마디도 대답하지 않았다’는 관용적으로 ‘아예 대답하지 않았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  english_pob_choice: they kept silent
  chosen_korean: 침묵하고
  alternatives_korean:
  - 잠잠하고
  - 말없이
  lexicon: HALOT
  rationale: חרשׁ의 동작성을 살려 단순한 상태보다 의도적 침묵을 드러내는 표현으로 옮겼습니다.
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  english_pob_choice: and did not answer him a word
  chosen_korean: 그에게 한마디도 대답하지 않았습니다
  alternatives_korean:
  - 그에게 아무 대답도 하지 않았습니다
  - 그에게 한마디도 답하지 않았습니다
  lexicon: HALOT
  rationale: ‘한마디도’로 히브리어의 관용적 전면 부정을 자연스럽게 살리면서, 상대를 향한 응답 부재를 분명히 했습니다.
- source_word: מִצְוַת הַמֶּלֶךְ
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 지시
  - 왕의 명령사항
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 권위 있는 명령을 뜻하므로, 한국어의 가장 자연스러운 대응인 ‘명령’을 택했습니다.
- source_word: לֹא תַעֲנֻהוּ
  english_pob_choice: Do not answer him
  chosen_korean: 그에게 대답하지 마라
  alternatives_korean:
  - 그에게 답하지 마라
  - 그에게 응답하지 마라
  lexicon: HALOT
  rationale: 집단에게 주어진 금지 명령을 직접화법으로 옮기되, 히브리어 동사의 기본 뜻을 간결하게 유지했습니다.
