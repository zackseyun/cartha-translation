id: ISA.36.9
reference: Isaiah 36:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
  footnotes:
  - marker: a
    text: Or 'turn back the face of,' an idiom meaning to resist or drive back.
    reason: lexical_alternative
  - marker: b
    text: '''Captain'' may also be rendered ''governor'' or ''official''; the Hebrew term refers to a subordinate ruler or officer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어찌하여 네가 내 주인의 가장 낮은 종들 가운데 한 대장의 얼굴도 물리칠 수 있겠느냐? 그런데도 네가 이집트를 의지하여 병거와 기병을 믿는구나.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴을 되돌리다’라는 직역은 여기서 ‘맞서다, 물리치다’라는 관용적 의미를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: ‘대장’은 여기서 총독이나 관리로도 옮길 수 있는 하위 통치자/장교를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  english_pob_choice: How then
  chosen_korean: 그런데 어찌하여
  alternatives_korean:
  - 그리고 어찌
  - 어찌하여
  lexicon: HALOT
  rationale: 앞 문맥과 이어지는 반문이므로 연결어의 흐름을 살려 ‘그런데’로, 질문은 ‘어찌하여’로 옮겼습니다.
- source_word: תָּשִׁיב אֵת פְּנֵי
  english_pob_choice: can you repulse
  chosen_korean: 얼굴도 물리칠 수 있겠느냐
  alternatives_korean:
  - 얼굴을 되돌릴 수 있겠느냐
  - 맞서 물리칠 수 있겠느냐
  - 되돌려 보낼 수 있겠느냐
  lexicon: HALOT
  rationale: 직역의 관용구를 한국어로 자연스럽게 풀어, ‘얼굴을 돌이키다/되돌리다’의 전투적 의미를 ‘물리치다’로 반영했습니다.
- source_word: פַחַת אַחַד
  english_pob_choice: a single captain
  chosen_korean: 한 대장
  alternatives_korean:
  - 한 총독
  - 한 관리
  - 한 지휘관
  lexicon: HALOT
  rationale: 문맥상 아시리아 군사/행정 하위 책임자를 가리키므로, 가장 직접적인 군사 뉘앙스를 살린 ‘대장’을 택했습니다.
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  english_pob_choice: the least of my master's servants
  chosen_korean: 내 주인의 가장 낮은 종들 가운데
  alternatives_korean:
  - 내 주인의 가장 작은 종들 가운데
  - 내 주인의 가장 천한 종들 가운데
  - 내 주인의 종들 중 가장 낮은 자들
  lexicon: HALOT
  rationale: ‘가장 낮은’으로 지위의 열등함을 살렸고, ‘종들 가운데’는 원문의 소속 관계와 범위를 자연스럽게 드러냅니다.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם לְרֶכֶב וּלְפָרָשִׁים
  english_pob_choice: when you trust in Egypt for chariots and horsemen
  chosen_korean: 그런데도 네가 이집트를 의지하여 병거와 기병을 믿는구나
  alternatives_korean:
  - 이집트를 의지하여 병거와 기병을 바라보는구나
  - 이집트를 믿고 병거와 기병을 구하는구나
  - 이집트를 신뢰하여 병거와 기병을 의지하는구나
  lexicon: HALOT
  rationale: ‘trust in Egypt’는 우회적으로 ‘이집트를 의지하다’로 옮기고, 병거와 기병은 전쟁 장비/병력을 직설적으로 반영했습니다.
theological_decisions:
- issue: 반문과 조롱의 수사 유지
  chosen_reading: 질문형을 살려 라반셈(?)의 조롱 섞인 공격적 어조를 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 단순한 정보 질문처럼 처리
  rationale: 이 절은 협상이나 설명이 아니라 외교적 조롱이므로, 반문과 비웃는 어조를 보존해야 본문의 힘이 살아납니다.
  doctrine_reference: 본문의 수사적 장르 보존
