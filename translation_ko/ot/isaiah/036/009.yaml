  rationale: 수사 질문의 구조를 한 문장으로 회복하고, 히브리어 관용구는 자연스러운 한국어 뜻으로 번역했습니다. ‘총독 한 사람마저’는 אַחַד의 강조와 화자의 조롱을 드러내며, 직함의 의미 범위는 각주에서 보존했습니다. ‘병거와 기병을 위해 이집트를 의지하면서’는 이집트에 군사 지원을 기대한다는 원문의 관계를 과도한 해석 없이 나타냅니다.
