  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
  footnotes:
  - marker: a
    text: Or 'turn back the face of,' an idiom meaning to resist or drive back.
    reason: lexical_alternative
  - marker: b
    text: '''Captain'' may also be rendered ''governor'' or ''official''; the Hebrew term refers to a subordinate ruler or officer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 네가 병거와 기병을 위해 이집트를 의지하면서, 내 주인의 가장 낮은 신하들에 속한 총독 한 사람마저 어찌 물리칠 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘얼굴을 돌이키다’이며, 여기서는 맞서 물리치거나 격퇴한다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘총독’은 ‘관리’ 또는 군사 문맥에서는 ‘지휘관’으로도 옮길 수 있습니다. 히브리어는 하위 통치자나 관리를 가리킵니다.
    reason: lexical_alternative
