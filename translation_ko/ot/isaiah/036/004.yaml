id: ISA.36.4
reference: Isaiah 36:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
  footnotes:
  - marker: a
    text: Rabshakeh is likely an Assyrian official title; possible renderings include 'chief cupbearer' or another high-ranking court or military officer.
    reason: cultural_note
  - marker: b
    text: Or 'What is this trust that you trust in?' The Hebrew uses a noun and verb from the same root for rhetorical emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 랍사게[a]가 그들에게 말했습니다. “히스기야에게 이렇게 전하십시오. ‘큰 왕[b], 앗수르 왕이 이렇게 말합니다. 네가 의지한 이 신뢰는 무엇입니까?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘랍사게’는 앗수르의 고위 관직명일 가능성이 크며, ‘술 맡은 관원’ 또는 다른 고위 궁정·군사 관리로 이해할 수도 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 “네가 신뢰하는 이 신뢰는 무엇입니까?” 히브리어는 ‘신뢰’와 ‘의지하다’에 같은 어근을 사용하여 수사적으로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍삭게
  - 라브사게
  lexicon: 외래어 표기법 및 본문 관용 표기
  rationale: '히브리어 직함을 음역해 역사적 호칭을 유지했습니다. 한국어 성경 전통에서 널리 알려진 형태를 우선하되, 기능을 단정하는 풀이(예: 대장, 술 맡은 관원)는 피했습니다.'
- source_word: אִמְרוּ נָא
  english_pob_choice: Please say
  chosen_korean: 이렇게 전하십시오
  alternatives_korean:
  - 부디 전하십시오
  - 전해 주십시오
  lexicon: HALOT
  rationale: 명령형과 나(נא)의 완화 기능을 살리면서, 현대 한국어에서 자연스럽고 공손한 전달 요구로 옮겼습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이처럼 말한다
  alternatives_korean:
  - 이같이 말씀하신다
  - 이같이 말한다
  lexicon: HALOT
  rationale: 공식적 전령/선포 문구를 살리되, 현대 문체에서 딱딱한 고어 대신 예언적 선언의 현재성을 드러냈습니다.
- source_word: הַמֶּלֶךְ הַגָּדוֹל מֶלֶךְ אַשּׁוּר
  english_pob_choice: the great king, the king of Assyria
  chosen_korean: 큰 왕, 앗수르 왕
  alternatives_korean:
  - 위대한 왕, 앗수르 왕
  - 대왕, 앗수르 왕
  lexicon: HALOT
  rationale: 아시리아 왕의 자칭적 위세를 그대로 반영했습니다. ‘큰 왕’은 권력 과시를 살리면서도 ‘위대한’보다 덜 해석적입니다.
- source_word: הַבִּטָּחוֹן הַזֶּה ... בָּטָחְתָּ
  english_pob_choice: What is this confidence that you have trusted in?
  chosen_korean: 네가 의지한 이 믿음이 무엇이냐
  alternatives_korean:
  - 네가 신뢰한 이 신뢰가 무엇이냐
  - 네가 의탁한 이 확신이 무엇이냐
  lexicon: HALOT
  rationale: 명사형 ‘믿음’과 동사 ‘의지하다’를 함께 써서 히브리어의 어근 반복을 한국어에서 어색하지 않게 반영했습니다. POB의 수사적 조롱을 살리되, 명사와 동사의 긴장도 보존했습니다.
theological_decisions:
- issue: 앗수르 왕의 왕호 번역
  chosen_reading: ‘큰 왕’으로 옮겨 정치적 과시와 조롱의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘위대한 왕’으로 옮겨 더 직역할 수 있음
  - ‘대왕’으로 축약할 수 있음
  rationale: 본문은 신학 교리 진술보다 적대자가 스스로를 과장하는 외교적/군사적 칭호를 전하므로, 과도한 존칭을 피하고 원문의 도발성을 유지했습니다.
  doctrine_reference: 사 36장의 앗수르 조롱 연설 문맥
