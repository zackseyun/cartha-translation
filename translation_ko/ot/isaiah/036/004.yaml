- from: 그러자 랍사게가 그들에게 말했습니다. 「히스기야에게 이렇게 전하십시오. ‘큰 왕, 앗수르 왕이 이처럼 말한다. 네가 의지한 이 믿음이 무엇이냐?’」[a][b]
  to: 그러자 랍사게[a]가 그들에게 말했습니다. “히스기야에게 이렇게 전하십시오. ‘큰 왕[b], 앗수르 왕이 이렇게 말합니다. 네가 의지한 이 신뢰는 무엇입니까?’”
  rationale: 합쇼체를 일관되게 적용하고, בִּטָּחוֹן을 ‘신뢰’로 조정했습니다. ‘의지한’은 히브리어 완료형이 함축하는 이미 형성된 의지를 자연스럽게 반영합니다. 각주 표지는 각각 랍사게와 큰 왕 뒤에 배치하여 원문의 주석 범위를 명확히 했습니다.
