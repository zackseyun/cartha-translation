source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יֹּ֕אמֶר שִׁמְע֗וּ אֶת דִּבְרֵ֛י הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/013.yaml
  text: Then the Rabshakeh stood and called out loudly in Judean, and said, “Hear the words of the great king, the king of Assyria.”
translation:
  language: ko
  text: 그때 랍사게가 서서 유다말로 큰 소리로 외치며 말했습니다. “위대한 왕, 앗수르 왕의 말씀을 들으십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 라브사게
  - 랍사케
  lexicon: 고유명사
  rationale: 히브리어 관직명/호칭으로 굳어진 음역을 따르되, 한국어 성경에서 널리 통용되는 형태인 ‘랍사게’를 사용했습니다.
- source_word: בְקוֹל גָּדוֹל
  english_pob_choice: loudly
  chosen_korean: 큰 소리로 외치며
  alternatives_korean:
  - 큰 소리로
  - 높은 목소리로
  lexicon: קול
  rationale: 직역형 ‘큰 소리로’만으로는 동사의 발화 행위가 약해져, 본문의 외침 동작을 드러내는 ‘외치며’를 보강했습니다.
- source_word: יְהוּדִית
  english_pob_choice: in Judean
  chosen_korean: 유다말로
  alternatives_korean:
  - 유대말로
  - 유다어로
  lexicon: יהודית
  rationale: 문맥상 ‘유다 사람들의 말’이 아니라 언어 자체를 가리키므로, 현대 독자가 이해하기 쉬운 ‘유다말로’로 옮겼습니다.
- source_word: מֶ֥לֶךְ אַשּׁוּר
  english_pob_choice: the king of Assyria
  chosen_korean: 앗수르 왕
  alternatives_korean:
  - 아시리아 왕
  - 앗시리아 왕
  lexicon: Assyria
  rationale: 성경 본문에서 익숙한 고유명사 관용을 살리되, 현대 표기상 ‘앗수르’를 택했습니다.
theological_decisions:
- issue: ‘위대한 왕’이라는 자기 칭호의 전달
  chosen_reading: ‘위대한 왕’으로 그대로 옮겨, 앗수르 왕의 선전적 자칭을 드러냈습니다.
  alternative_readings:
  - ‘큰 왕’
  - ‘대왕’
  rationale: 본문은 앗수르 왕의 권위 주장과 위압을 전달하므로, 이를 완화하지 않고 직설적으로 유지했습니다.
  doctrine_reference: 본문의 수사와 제국 선전의 아이러니 보존
