  terminology: ‘랍사게’, ‘유다말’, ‘앗수르 왕’은 한국어 성경 독자에게 통용되고 문맥상 명료합니다. ‘위대한 왕’은 앗수르 왕의 자기 칭호를 과장하거나 완화하지 않고 전달합니다.
