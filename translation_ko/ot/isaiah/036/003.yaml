  source_fidelity: 히브리어는 엘리야김, 셉나, 요아라는 세 관리가 그에게 나아간 것으로 서술합니다. 현 번역은 첫 절의 ‘엘리야김이 그에게 나가고’와 끝의 ‘기록관도 함께 나갔습니다’가 동작을 불필요하게 두 번 나누어, 셉나의 참여도 통사적으로 다소 불분명합니다. 엘리야김에게만 붙는 ‘왕궁을 맡은’ 직함과 세 인물의 병렬을 분명히 해야 합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 세 인물을 공동 주어로 묶어 한 번의 종결 서술로 표현하는 것이 자연스럽습니다. ‘요아흐’보다 통용 성서식 표기인 ‘요아’가 자연스럽습니다.
