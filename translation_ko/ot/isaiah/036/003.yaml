  text: וַ/יֵּצֵ֥א אֵלָ֛י/ו אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָא֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
  footnotes:
  - marker: a
    text: Or 'went out to him.'
    reason: lexical_alternative
  - marker: b
    text: '''Who was over the household'' refers to a high royal official in charge of the palace administration.'
    reason: cultural_note
  - marker: c
    text: Or 'the secretary' for 'the scribe.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the chronicler' for 'the recorder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕궁을 맡은 힐기야의 아들 엘리야김과 서기관 셉나와 기록관 아삽의 아들 요아가 그에게 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא / אֵלָיו
  english_pob_choice: came out to him
  chosen_korean: “그에게 나가고”
  alternatives_korean:
  - “그에게 나왔고”
  - “그에게 나갔습니다”
  lexicon: HALOT
  rationale: 히브리어 וַיֵּצֵא의 서사 진행과 אֵלָיו의 방향성을 함께 살려, 상대 쪽으로 나가는 동작을 간결하게 표현했습니다.
- source_word: אֲשֶׁר עַל הַבָּיִת
  english_pob_choice: who was over the household
  chosen_korean: “왕궁 행정을 맡은 자”
  alternatives_korean:
  - “왕실 집안을 맡은 자”
  - “궁정을 관장하는 자”
  lexicon: HALOT
  rationale: 직역하면 ‘집 위에 있는 자’이지만, 문맥상 왕실 행정 책임자라는 관용적 직함이므로 의미를 드러내는 한국어로 옮겼습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: “서기관”
  alternatives_korean:
  - “서기”
  - “문서 기록관”
  lexicon: HALOT
  rationale: 행정 관직을 가리키는 סֹפֵר의 표준적 현대 한국어 대응으로 ‘서기관’을 택해, 단순한 필사자가 아니라 공적 문서 담당자라는 뉘앙스를 살렸습니다.
- source_word: הַמַּזְכִּיר
  english_pob_choice: the recorder
  chosen_korean: “기록관”
  alternatives_korean:
  - “기록 담당자”
  - “기록자”
  lexicon: HALOT
  rationale: 공적 기록과 보고를 맡는 관직명을 자연스러운 현대 한국어 관직어인 ‘기록관’으로 옮겼습니다.
