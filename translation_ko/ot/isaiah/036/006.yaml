    rationale: '''그의 손에 들어가 손을 찌릅니다''는 ''손''을 반복하면서도 갈대가 손바닥을 뚫고 들어가는 원문의 구체적 동작을 매끄럽게 전달하지 못합니다. כַּף는 여기서 ''손바닥''으로 옮기는 것이 적절합니다.'
  - severity: low
