id: ISA.36.6
reference: Isaiah 36:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
  footnotes:
  - marker: a
    text: Hebrew 'a man'; the singular masculine is used representatively here.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 애굽을 의지하고 있습니다. 그것은 부러진 갈대 지팡이인데, 사람이 그것에 기대면 그의 손에 들어가 손을 찌릅니다. 바로 그와 같이 애굽 왕 바로는 그를 의지하는 모든 사람에게 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어 합쇼체에 자연스럽게 맞는 직접 호소를 살렸습니다.
- source_word: בָטַחְתָּ / הַבֹּטְחִים
  english_pob_choice: you are trusting / trust in him
  chosen_korean: 의지하고 있습니다 / 의지하는
  alternatives_korean:
  - 믿고 있습니다 / 믿는
  - 신뢰하고 있습니다 / 신뢰하는
  lexicon: HALOT
  rationale: בטח의 핵심은 단순 지적 동의가 아니라 의존이므로, 문맥상 '의지하다'가 가장 직접적입니다.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  english_pob_choice: that broken reed of a staff
  chosen_korean: 부러진 갈대 지팡이
  alternatives_korean:
  - 부서진 갈대 막대기
  - 꺾인 갈대 지팡이
  lexicon: HALOT
  rationale: 갈대와 지팡이의 결합된 비유를 그대로 살리되, '부러진'으로 무력하고 위험한 지지물을 선명하게 표현했습니다.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  english_pob_choice: goes into his hand and pierces it
  chosen_korean: 그의 손에 들어가 손을 찌릅니다
  alternatives_korean:
  - 그의 손바닥에 박혀 손을 뚫습니다
  - 그의 손에 들어가 손바닥을 찔러 뚫습니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 상해 이미지를 직역에 가깝게 옮기되, 한국어에서는 반복되는 '손'을 통해 동작과 결과를 분명히 했습니다.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  english_pob_choice: Pharaoh king of Egypt
  chosen_korean: 애굽 왕 바로
  alternatives_korean:
  - 바로 애굽 왕
  - 애굽의 왕 바로
  lexicon: HALOT
  rationale: 히브리어의 압축된 호칭을 자연스러운 한국어 어순으로 옮겼습니다.
theological_decisions:
- issue: 대표 단수 'אִישׁ'의 번역
  chosen_reading: 사람
  alternative_readings:
  - 한 남자
  - 누군가
  rationale: POB가 영어에서 대표적 단수로 읽은 의도를 유지하되, 한국어에서는 일반 독자에게 더 자연스러운 포괄적 표현으로 전달합니다.
  doctrine_reference: 문법적 대표 단수의 관용적 번역
- issue: 비유의 경고 강도
  chosen_reading: 의지하면 위험해지는 현실적 경고를 직설적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 표현하기
  - 상징적으로만 처리하기
  rationale: 본문은 애굽 동맹의 허망함을 강한 감각적 이미지로 경고하므로, 그 긴장과 충격을 약화시키지 않았습니다.
  doctrine_reference: 본문 수사와 심판 예언의 직설성
