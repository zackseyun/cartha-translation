  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
  footnotes:
  - marker: a
    text: 'Hebrew: ''lest Hezekiah incite/mislead you, saying.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Have the gods of the nations, any one of them, delivered his land from the hand of the king of Assyria?'
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 여러분을 꾀어 “야훼께서 우리를 건져 주실 것이다” 하고 말하게 하지 마십시오. 어느 민족의 신들 중에 누가 자기 땅을 앗시리아 왕의 손에서 건져 냈습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: “히스기야가 여러분을 선동/꾀어, 말하게 하지 말라”'
    reason: lexical_alternative
  - marker: b
    text: 또는 “민족들의 신들이 각각 자기 땅을 앗시리아 왕의 손에서 건져 냈느냐?”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יַסִּית
  english_pob_choice: Do not let ... mislead
  chosen_korean: “... 꾀어 ... 말하게 하지 마십시오”
  alternatives_korean:
  - '... 미혹하지 않게 하십시오'
  - '... 속이지 못하게 하십시오'
  - '... 설득하지 못하게 하십시오'
  lexicon: HALOT
  rationale: פֶּן + 히필 יַסִּית는 경고문맥에서 ‘~하지 못하게 하다’의 예방적 의미가 강하므로, 한국어에서는 자연스러운 금지형으로 풀고 יַסִּית의 ‘선동/유인’ 뉘앙스를 ‘꾀어’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 히스기야가 의지하는 언약명의 직접 표기이므로, POB 기본 원칙에 따라 ‘야훼’로 옮겨 ‘주님’ 같은 호칭으로 바꾸지 않았습니다.
- source_word: יַצִּילֵנוּ
  english_pob_choice: will deliver us
  chosen_korean: 우리를 건져 주실 것이다
  alternatives_korean:
  - 우리를 구원하실 것이다
  - 우리를 구해 주실 것이다
  lexicon: HALOT
  rationale: נצל의 구출/구제 의미를 살리되, 전쟁 위협 문맥에서 한국어로는 ‘건져 주다’가 가장 자연스럽고 강합니다.
- source_word: אֱלֹהֵי הַגּוֹיִם
  english_pob_choice: the gods of the nations
  chosen_korean: 어느 민족의 신들
  alternatives_korean:
  - 민족들의 신들
  - 나라들의 신들
  lexicon: HALOT
  rationale: גוים의 민족적 의미를 살리면서도 한국어에서 군사적·정치적 대비가 분명하게 드러나도록 ‘민족’으로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: each one
  chosen_korean: 누가
  alternatives_korean:
  - 각각
  - 각 한 사람
  - 그 어느 하나
  lexicon: HALOT
  rationale: 여기서 אִישׁ은 분배적으로 ‘각기 한 신씩’의 뜻이므로, 수사적 질문 속에서는 ‘누가’가 가장 자연스럽게 그 분포 의미를 전달합니다.
theological_decisions:
- issue: 여호와 대체 번역
  chosen_reading: 문장 안에서 신적 이름을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 יְהוָה를 직접 사용하므로, 본문 독자가 언약명의 직접성을 보도록 제목성 호칭으로 완화하지 않았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
