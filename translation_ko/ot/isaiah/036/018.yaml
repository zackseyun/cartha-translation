- from: 히스기야가 여러분을 꾀어 “야훼께서 우리를 건져 주실 것이다” 하고 말하게 하지 마십시오. 어느 민족의 신들 중에 누가 자기 땅을 앗시리아 왕의 손에서 건져 냈습니까?[a][b]
  to: 히스기야가 “야훼께서 우리를 건져 주실 것이다”라고 말하며 여러분을 꾀지 못하게 하십시오.[a] 민족들의 신들 가운데 어느 신이 자기 땅을 앗시리아 왕의 손에서 건져 냈습니까?[b]
