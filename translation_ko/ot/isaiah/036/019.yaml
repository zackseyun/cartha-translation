id: ISA.36.19
reference: Isaiah 36:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
  footnotes:
  - marker: a
    text: Or 'rescued' or 'saved' for 'delivered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하맛과 아르밧의 신들은 어디 있습니까? 스발와임의 신들은 어디 있습니까? 그들이 사마리아를 내 손에서 구해 냈습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출했습니까’, ‘구원했습니까’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  english_pob_choice: Where are
  chosen_korean: 어디 있습니까
  alternatives_korean:
  - 어디에 있습니까
  - 어디 있느냐
  lexicon: HALOT
  rationale: 존재 위치를 묻는 반어적 질문이므로, 현대 한국어에서 자연스럽고 합쇼체에 맞는 ‘어디 있습니까’로 옮겼습니다.
- source_word: אֱלֹהֵי
  english_pob_choice: the gods of
  chosen_korean: ~의 신들
  alternatives_korean:
  - ~의 하나님들
  - 신들
  lexicon: HALOT
  rationale: 지명 뒤에 붙는 복수형 구성은 이방 신들을 가리키므로 ‘신들’로 옮겼고, 소유/속격 관계는 한국어 조사로 풀었습니다.
- source_word: חֲמָת וְאַרְפָּד / סְפַרְוָיִם
  english_pob_choice: Hamath and Arpad / Sepharvaim
  chosen_korean: 하맛과 아르밧 / 스발와임
  alternatives_korean:
  - 하마트와 아르파드 / 스페라와임
  - 하맛과 아르파드 / 세파르와임
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행을 따르되, 기존 성경 한국어 관용보다 원어 음가를 우선해 표기했습니다.
- source_word: הִצִּילוּ
  english_pob_choice: delivered
  chosen_korean: 구해 냈습니까
  alternatives_korean:
  - 구원했습니까
  - 건져 냈습니까
  - 도와줬습니까
  lexicon: HALOT
  rationale: 군사적 맥락에서 ‘구해 내다’가 ‘deliver/rescue/save’의 의미를 가장 직접적으로 살리면서도 한국어에서 자연스럽습니다.
- source_word: מִיָּדִי
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손에서부터
  - 내 권세에서
  - 내 힘에서
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 그대로 보존해, 권력과 통제의 조롱조를 드러내는 ‘내 손에서’로 옮겼습니다.
theological_decisions:
- issue: 앗수르 조롱 연설의 수사 유지
  chosen_reading: 원문의 반어적 빈정거림을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 평서문처럼 중립적으로 번역
  - ‘어디 있느냐’식으로 더 공격적인 구어체로 조정
  rationale: 본문은 바벨론식 신관에 대한 도전이 아니라 정복 불능을 자랑하는 조롱이므로, 질문 형식과 첫인칭 ‘내 손’의 자만을 보존해야 합니다.
  doctrine_reference: 원문 수사 보존과 역사서/예언서의 발화 상황 존중
- issue: ‘신들’의 다신교적 표현
  chosen_reading: 이방 도시들의 다신교적 대상은 ‘신들’로 직역했습니다.
  alternative_readings:
  - ‘우상들’로 해석적으로 번역
  - ‘하나님들’로 완곡하게 번역
  rationale: 히브리어 אֱלֹהִים의 문맥상 이방 신들을 가리키며, 본문이 의도한 조롱의 대상성을 유지하려면 ‘신들’이 가장 직접적입니다.
  doctrine_reference: 본문 문맥에 따른 우상-신 개념 구분
