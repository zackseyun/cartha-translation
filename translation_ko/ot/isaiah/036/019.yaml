  source_fidelity: 히브리어의 세 반어적 질문을 충실히 보존했습니다. אֱלֹהֵי의 복수는 ‘신들은’으로, הִצִּילוּ의 복수 주어는 ‘그들이’로 드러냈으며, מִיָּדִי의 직역적 권세 은유도 ‘내 손에서’로 유지했습니다. וְכִי가 이끄는 마지막 수사 의문문도 자연스럽게 재현되었습니다.
  naturalness: ‘어디 있습니까?’의 반복과 ‘그들이 사마리아를 내 손에서 구해 냈습니까?’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 조롱하는 질문조를 적절히 유지합니다.
  terminology: ‘신들’은 문맥상 이방 도시들의 신들을 가리키는 אֱלֹהֵי에 적합하며, ‘사마리아’와 지명 표기도 일관됩니다. ‘구해 내다’는 הִצִּילוּ의 군사적 구출 의미를 잘 전달합니다. 각주도 해당 동사의 가능한 어휘 대안을 적절히 제시합니다.
