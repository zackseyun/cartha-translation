translation:
  language: ko
  text: 히스기야 왕의 열네째 해에 앗수르 왕 산헤립이 올라와 유다의 모든 견고한 성읍들을 쳐서 빼앗았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now ...
  chosen_korean: 히스기야 왕의 열네째 해에
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: חדש된 서사 전환을 한국어에서 시간 부사구로 자연스럽게 풀어, 영어 POB의 discourse-transition 기능을 반영했습니다.
- source_word: עָלָה
  english_pob_choice: came up against
  chosen_korean: 올라와
  alternatives_korean:
  - 쳐들어와
  - 진격하여
  lexicon: HALOT
  rationale: עלה의 기본적인 ‘올라가다’와 군사적 맥락을 살리되, 뒤의 대상을 통해 공격 의도를 드러내는 방식으로 옮겼습니다.
- source_word: הַבְּצֻרוֹת
  english_pob_choice: fortified
  chosen_korean: 견고한 성읍들
  alternatives_korean:
  - 요새화된 성읍들
  - 성벽으로 둘러싸인 성읍들
  lexicon: HALOT
  rationale: ‘fortified cities’의 성격을 전달하면서도, 한국어에서 지나치게 기술적인 군사 용어보다 자연스러운 표현을 택했습니다.
- source_word: וַיִּתְפְּשֵׂם
  english_pob_choice: and captured them
  chosen_korean: 쳐서 빼앗았습니다
  alternatives_korean:
  - 사로잡았습니다
  - 점령했습니다
  lexicon: HALOT
  rationale: 도시를 무력으로 장악한 결과를 한국어에서 가장 분명하게 드러내기 위해 ‘쳐서 빼앗다’를 사용했습니다.
