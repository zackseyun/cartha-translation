base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
  footnotes:
  - marker: a
    text: 'Hebrew uses deliberately coarse siege language: literally, ''to eat their dung and drink their urine.'' The written form for ''urine'' reflects a scribal euphemism for a cruder expression.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 랍사게가 말했습니다. “내 주가 이 말들을 말하라고 나를 당신의 주와 당신에게 보낸 것입니까? 그가 나를 성벽에 앉아 있는 그 사람들에게 보내어, 그들의 오물과 소변을 당신들과 함께 먹고 마시게 하려는 것이 아닙니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 의도적으로 거친 포위전 조롱 표현을 사용합니다. 문자적으로는 ‘그들의 배설물과 소변’을 뜻하며, 두 번째 말은 더 거친 표현을 완곡하게 적은 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍샤케
  - 라브사게
  lexicon: HALOT
  rationale: 히브리어 고유 호칭을 음역해 역사적 아시리아 관직명/호칭을 그대로 살렸습니다. 문맥상 번역어보다 음역이 더 적절합니다.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  english_pob_choice: your master / my master
  chosen_korean: 당신의 주 / 내 주
  alternatives_korean:
  - 당신의 주인 / 내 주인
  - 당신의 임금 / 내 임금
  lexicon: HALOT
  rationale: 정치적 상하관계를 드러내는 표현이므로, 종교적 뉘앙스가 강한 ‘주님’보다 문맥 그대로 ‘주’를 택했습니다.
- source_word: לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: to speak these words
  chosen_korean: 이 말들을 말하라고
  alternatives_korean:
  - 이 말들을 말하기 위해
  - 이 말들을 전하라고
  lexicon: HALOT
  rationale: 히브리어의 목적/내용 구조를 자연스러운 한국어로 옮기되, ‘말들’이라는 복수성을 유지했습니다.
- source_word: חראיהם
  english_pob_choice: their own dung
  chosen_korean: 그들의 오물
  alternatives_korean:
  - 그들의 똥
  - 그들의 분변
  lexicon: HALOT
  rationale: 히브리어가 의도적으로 거친 조롱을 담지만, 합쇼체 본문에서 지나치게 노골적인 직역보다 의미와 수위를 함께 살리는 ‘오물’이 적절합니다.
- source_word: שיניהם
  english_pob_choice: their own urine
  chosen_korean: 소변
  alternatives_korean:
  - 오줌
  - 요소로 보이는 배설물
  lexicon: HALOT
  rationale: 본문의 완곡 표기/거친 표현을 현대 한국어에서 이해 가능한 생리 용어로 옮겼습니다. 영어 POB의 주석이 지적한 노골성을 본문에는 직접 과도하게 노출하지 않았습니다.
theological_decisions:
- issue: 혐오적 전쟁 조롱의 수위
  chosen_reading: 본문의 모욕적 의미는 살리되, 한국어 출판 문체에서는 ‘오물’과 ‘소변’으로 옮겨 노골성은 유지하되 지나친 속어화는 피했습니다.
  alternative_readings:
  - 그들의 똥과 오줌
  - 그들의 분변과 소변
  rationale: 히브리어는 의도적으로 거친 수치를 강조하지만, 표준어 합쇼체에서는 읽기 가능성과 공적 낭독성을 함께 고려해야 합니다.
  doctrine_reference: 해당 없음
