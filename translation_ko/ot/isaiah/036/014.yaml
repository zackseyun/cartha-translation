translation:
  language: ko
  text: 「왕이 이렇게 말합니다. 히스기야가 여러분을 속이게[a] 두지 마십시오. 그는 여러분을 구해 낼[b] 수 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그릇 인도하게 하다.’ 히브리어 동사는 ‘속이다’ 또는 ‘잘못된 길로 이끌다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘건져 내다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 「이같이 말씀하십니다」
  alternatives_korean:
  - 「이렇게 말씀하십니다」
  - 「왕이 말씀하십니다」
  lexicon: WLC/HALOT
  rationale: 공식적인 전령/선포 도입구로서 ‘이같이’가 כֹּה의 격식을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 「왕이」
  alternatives_korean:
  - 「그 왕이」
  - 「임금이」
  lexicon: WLC/HALOT
  rationale: 본문은 특정 이름 없이 단순히 ‘왕’이라 하므로, 주석적 확장을 피하고 원문의 일반칭을 유지했습니다.
- source_word: יַשִּׁא
  english_pob_choice: deceive / mislead
  chosen_korean: 「속이게 두지 마십시오」
  alternatives_korean:
  - 「속이지 못하게 하십시오」
  - 「미혹하게 두지 마십시오」
  lexicon: WLC/HALOT
  rationale: יַשִּׁא의 ‘속이게 하다/그릇 인도하다’ 의미를 살리면서, 한국어에서는 금지 명령 구조로 가장 자연스럽게 옮겼습니다.
- source_word: לְהַצִּיל
  english_pob_choice: deliver
  chosen_korean: 「구해낼 수 없습니다」
  alternatives_korean:
  - 「건져낼 수 없습니다」
  - 「구원할 수 없습니다」
  lexicon: WLC/HALOT
  rationale: 전쟁 상황의 구출/구출 불능을 드러내는 동사로 ‘구해내다’가 가장 직접적이며, ‘deliver’의 공적·구출적 뉘앙스를 잘 반영합니다.
theological_decisions:
- issue: 왕의 발화체를 한국어 경어로 처리할지 여부
  chosen_reading: 직접 인용문 안에서 ‘말씀하십니다’로 높임을 쓰고, 경고 명령은 ‘두지 마십시오’로 유지했습니다.
  alternative_readings:
  - “왕이 이같이 말합니다”
  - “왕이 이같이 말하십니다”
  rationale: 본문은 궁정 선포문 형식이므로, 현대 합쇼체로 공적이고 격식 있는 톤을 유지하되 내용 자체는 원문의 명령·경고 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 공적 발화의 문체와 번역 일관성
