source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''The LORD delivering will deliver us,'' an emphatic construction meaning ''will surely deliver us.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'will not be handed over into the power of the king of Assyria.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 히스기야가 “야훼께서 반드시 우리를 구해 주실 것입니다. 이 도성은 앗수르 왕의 손에 넘겨지지 않을 것입니다”라고 하면서 여러분으로 하여금 야훼를 신뢰하게 하지 마십시오[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 히필형은 ‘신뢰하게 하다/믿게 하다’라는 사역적 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 부정사절대와 미완료형의 결합으로 ‘반드시/확실히’의 강조를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  english_pob_choice: And do not let Hezekiah make you trust
  chosen_korean: 히스기야가 여러분에게 야훼를 신뢰하게 하지 못하게 하십시오
  alternatives_korean:
  - 히스기야가 여러분을 야훼를 믿게 하지 못하게 하십시오
  - 히스기야가 여러분이 야훼를 믿도록 만들지 못하게 하십시오
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘신뢰하게 하다’로 옮겼고, ‘여러분’은 복수 청자에게 자연스럽고 공적인 금지 표현으로 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 옮겨, 본문이 직접 지칭하는 고유한 하나님의 이름을 드러냈습니다.
- source_word: הַצֵּל יַצִּילֵנוּ
  english_pob_choice: will surely deliver us
  chosen_korean: 반드시 우리를 구해 주실 것입니다
  alternatives_korean:
  - 틀림없이 우리를 구원하실 것입니다
  - 반드시 우리를 건져 주실 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사절대+미완료)을 한국어의 ‘반드시’로 살려 확실성을 드러냈고, 전쟁 맥락에 맞게 ‘구해 주다’로 자연스럽게 표현했습니다.
- source_word: תִנָּתֵן ... בְּיַד
  english_pob_choice: will not be given into the hand of
  chosen_korean: 손에 넘겨지지 않을 것입니다
  alternatives_korean:
  - 손에 주어지지 않을 것입니다
  - 권세 아래 넘겨지지 않을 것입니다
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 살린 표현이고, ‘넘겨지다’는 수동형 נתן의 의미를 간명하게 반영합니다.
theological_decisions:
- issue: 히스기야의 발언을 인용하는 방식
  chosen_reading: 직접 인용부 안에서 왕의 말이 아니라 백성에게 들리는 선전성 발화로 처리했습니다.
  alternative_readings:
  - 서술형으로 완화해 옮기기
  - ‘믿게 하지 못하게 하십시오’ 대신 더 중립적으로 옮기기
  rationale: 본문은 랍사게의 경고/조롱 발화로, 청중을 설득하려는 긴박한 수사입니다. 따라서 과도하게 중화하지 않고 명령형의 압박감을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
