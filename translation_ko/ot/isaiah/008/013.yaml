revisions:
- from: 만군의 야훼를 그분으로 거룩하게 여기십시오.[a] 그분을 두려워하고, 그분을 떨림으로 여기십시오.
  to: 만군의 야훼, 곧 그분을 거룩하게 여기십시오.[a] 그분을 여러분이 두려워할 분으로 삼으시고, 그분을 여러분이 떨며 두려워할 분으로 삼으십시오.
  rationale: Direct-object marking has been corrected, and the two closing nominal clauses have been rendered as parallel exhortations in natural modern formal Korean. This preserves the Hebrew's identification of Yahweh as the proper object of fear and intensified dread without importing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
