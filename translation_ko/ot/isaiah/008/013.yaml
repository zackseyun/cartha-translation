id: ISA.8.13
reference: Isaiah 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
  footnotes:
  - marker: a
    text: Or, more formally, 'you shall sanctify him.' The Hebrew means to acknowledge or treat the LORD as holy, not to make him holy.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼, 곧 그분을 거룩하게 여기십시오.[a] 그분을 여러분이 두려워할 분으로 삼으시고, 그분을 여러분이 떨며 두려워할 분으로 삼으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그분을 거룩하게 하십시오’입니다. 여기서는 하나님께 거룩함을 부여하라는 뜻이 아니라, 그분을 거룩하신 분으로 인정하고 대하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  lexicon: HALOT
  rationale: 여호와 대신 야훼를 사용해 신명(神名)을 보존하고, צְבָאוֹת은 관용적으로 '만군'으로 옮겨 주의 광범위한 군대적·천상적 의미를 살렸습니다.
- source_word: אֹתוֹ תַקְדִּישׁוּ
  english_pob_choice: you shall regard him as holy
  chosen_korean: 그분으로 거룩하게 여기십시오
  alternatives_korean:
  - 그분을 거룩하게 하십시오
  - 그분을 성별하십시오
  - 그분을 거룩하다 인정하십시오
  lexicon: HALOT
  rationale: 하나님을 인간이 거룩하게 만든다는 오해를 피하면서, 거룩하심을 인정하고 그에 합당하게 대하라는 명령을 자연스러운 한국어로 옮겼습니다.
- source_word: מוֹרַאֲכֶם
  english_pob_choice: your fear
  chosen_korean: 두려워하고
  alternatives_korean:
  - 여러분의 두려움
  - 여러분이 두려워할 분
  lexicon: HALOT
  rationale: 히브리어의 평행 구조를 살리면서도 한국어에서 '그분이 여러분의 두려움이다'라는 직설형보다 동사형이 더 자연스러워 '두려워하고'로 옮겼습니다.
- source_word: מַעֲרִצְכֶם
  english_pob_choice: your dread
  chosen_korean: 떨림으로 여기십시오
  alternatives_korean:
  - 경외로 여기십시오
  - 공포로 여기십시오
  - 두려움으로 여기십시오
  lexicon: HALOT
  rationale: '''dread''의 강도를 반영하되, 앞의 ''두려워하다''와 단순 반복이 되지 않도록 ''떨림''을 택해 강화된 공포·전율의 뉘앙스를 살렸습니다.'
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 번역 관례보다 신명 자체를 드러내려는 본문 의도를 따라 YHWH를 야훼로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님을 '거룩하게 하다'로 옮길 때의 신학적 오해 방지
  chosen_reading: 거룩하게 여기십시오
  alternative_readings:
  - 거룩하게 하십시오
  - 성별하십시오
  rationale: 인간이 하나님을 거룩하게 만든다는 뜻이 아니라, 하나님을 거룩하신 분으로 인정하고 대하라는 명령임을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #6 (readable modern English, not flattening theological weight)'
