id: ISA.8.2
reference: Isaiah 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָעִ֣ידָה לִּ֔/י עֵדִ֖ים נֶאֱמָנִ֑ים אֵ֚ת אוּרִיָּ֣ה הַ/כֹּהֵ֔ן וְ/אֶת זְכַרְיָ֖הוּ בֶּ֥ן יְבֶרֶכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
  footnotes:
  - marker: a
    text: Or 'trustworthy witnesses.' The Hebrew adjective conveys reliability as well as faithfulness.
    reason: lexical_alternative
  - marker: b
    text: The verb can also be understood as 'call' or 'appoint' witnesses, emphasizing formal legal attestation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 나를 위해 신실한 증인들을 세울 것입니다. 제사장 우리야와 여베레기야의 아들 스가랴입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신뢰할 만한’. 히브리어 형용사는 충실성뿐 아니라 신뢰성을 함께 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 ‘부르다’ 또는 ‘임명하다’로도 이해할 수 있어, 공식적 증인 소집의 뉘앙스를 더 분명히 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָעִידָה
  english_pob_choice: And I will take ... witnesses
  chosen_korean: 그리고 나는 ... 증인들을 세울 것입니다
  alternatives_korean:
  - 그리고 나는 증인들을 부를 것입니다
  - 그리고 나는 증인들을 증언하게 할 것입니다
  - 그리고 나는 증인들을 세울 것입니다
  lexicon: HALOT
  rationale: 히필형 עוד는 단순한 ‘부르다’보다 공식적으로 증인을 확보·세우는 법정적 의미가 있어, 한국어에서는 ‘세우다’로 그 취지를 살렸습니다.
- source_word: נֶאֱמָנִים
  english_pob_choice: faithful
  chosen_korean: 신실한
  alternatives_korean:
  - 신뢰할 만한
  - 믿을 만한
  lexicon: HALOT
  rationale: 증인에게 붙는 형용사로서 ‘faithful’의 충실함과 신뢰성을 함께 담되, 인격적 성실성을 드러내는 ‘신실한’이 가장 자연스럽습니다.
- source_word: עֵדִים
  english_pob_choice: witnesses
  chosen_korean: 증인들
  alternatives_korean:
  - 증언자들
  - 목격자들
  lexicon: HALOT
  rationale: 법적·공식적 증언의 문맥이므로 일반적이면서도 정식 용어인 ‘증인들’이 적절합니다.
- source_word: אוּרִיָּה הַכֹּהֵן / זְכַרְיָהוּ בֶּן יְבֶרֶכְיָהוּ
  english_pob_choice: Uriah the priest and Zechariah son of Jeberekiah
  chosen_korean: 제사장 우리야와 여베레기야의 아들 스가랴
  alternatives_korean:
  - 우리야 제사장과 여베레기야의 아들 스가랴
  - 우리야 사제와 여베레기야의 아들 스가랴
  lexicon: Hebrew proper name
  rationale: 고유명사는 통용되는 성서 표기를 따르고, הַכֹּהֵן은 직함이므로 ‘제사장’으로 옮겼습니다. בֶּן은 한국어에서 자연스러운 친족 표현인 ‘...의 아들’로 처리했습니다.
theological_decisions:
- issue: 법정적 증인 세움의 뉘앙스
  chosen_reading: ‘세울 것입니다’로 옮겨 예언적 표징을 위한 공식적 증인 확보의 성격을 드러냈습니다.
  alternative_readings:
  - ‘부를 것입니다’
  - ‘증언하게 할 것입니다’
  rationale: 본문은 단순 초청이 아니라 공적 증거를 남기는 행위이므로, 한국어에서도 법정적·공적 기능이 살아 있도록 했습니다.
  doctrine_reference: 예언의 표징과 공적 증언의 문맥(사 8:2)
