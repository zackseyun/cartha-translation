  lexicon: HALOT
  rationale: 증인에게 붙는 형용사로서 ‘faithful’의 충실함과 신뢰성을 함께 담되, 인격적 성실성을 드러내는 ‘신실한’이 가장 자연스럽습니다.
- source_word: עֵדִים
  english_pob_choice: witnesses
  chosen_korean: 증인들
  alternatives_korean:
  - 증언자들
  - 목격자들
  lexicon: HALOT
  rationale: 법적·공식적 증언의 문맥이므로 일반적이면서도 정식 용어인 ‘증인들’이 적절합니다.
- source_word: אוּרִיָּה הַכֹּהֵן / זְכַרְיָהוּ בֶּן יְבֶרֶכְיָהוּ
  english_pob_choice: Uriah the priest and Zechariah son of Jeberekiah
  chosen_korean: 제사장 우리야와 여베레기야의 아들 스가랴
  alternatives_korean:
  - 우리야 제사장과 여베레기야의 아들 스가랴
  - 우리야 사제와 여베레기야의 아들 스가랴
  lexicon: Hebrew proper name
  rationale: 고유명사는 통용되는 성서 표기를 따르고, הַכֹּהֵן은 직함이므로 ‘제사장’으로 옮겼습니다. בֶּן은 한국어에서 자연스러운 친족 표현인 ‘...의 아들’로 처리했습니다.
theological_decisions:
- issue: 법정적 증인 세움의 뉘앙스
  chosen_reading: ‘세울 것입니다’로 옮겨 예언적 표징을 위한 공식적 증인 확보의 성격을 드러냈습니다.
  alternative_readings:
  - ‘부를 것입니다’
  - ‘증언하게 할 것입니다’
  rationale: 본문은 단순 초청이 아니라 공적 증거를 남기는 행위이므로, 한국어에서도 법정적·공적 기능이 살아 있도록 했습니다.
  doctrine_reference: 예언의 표징과 공적 증언의 문맥(사 8:2)
