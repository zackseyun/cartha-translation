id: ISA.8.16
reference: Isaiah 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צ֖וֹר תְּעוּדָ֑ה חֲת֥וֹם תּוֹרָ֖ה בְּ/לִמֻּדָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
  footnotes:
  - marker: a
    text: Or 'the law' or 'the teaching.' The Hebrew torah can denote instruction broadly, not only legal code.
    reason: lexical_alternative
  - marker: b
    text: Or 'among my taught ones.' The Hebrew expression refers to those instructed by the speaker.
    reason: lexical_alternative
translation:
  language: ko
  text: 증언을 묶어 두고, 율법을 내 제자들 가운데에 봉인하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가르침'. 히브리어 토라(תּוֹרָה)는 법전만이 아니라 넓은 의미의 교훈을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내가 가르친 자들 가운데에'. 히브리어 표현은 말씀하시는 이에게서 가르침을 받은 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  english_pob_choice: Bind up
  chosen_korean: 묶어 두고
  alternatives_korean:
  - 감싸 두고
  - 단단히 묶어 두고
  - 보관하고
  lexicon: HALOT
  rationale: 문서나 증언을 안전하게 보존하는 명령형의 힘을 살리면서, 현대 한국어에서 자연스럽고 구체적인 동작으로 옮겼습니다.
- source_word: תְּעוּדָ֑ה
  english_pob_choice: the testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언문
  - 증거물
  lexicon: HALOT
  rationale: 예언적 문맥에서 공식적 증언의 의미를 살리되, 한국어에서 가장 सीधे 전달되는 표현으로 옮겼습니다.
- source_word: תּוֹרָ֖ה
  english_pob_choice: the instruction
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 지시
  lexicon: HALOT
  rationale: 이 절의 תורה는 넓게는 'instruction'일 수 있지만, 한국어 성경 독자에게는 예언적 권위가 담긴 '율법'이 핵심 대조를 더 분명히 드러냅니다.
- source_word: בְּ/לִמֻּדָֽ/י
  english_pob_choice: among my disciples
  chosen_korean: 내 제자들 가운데에
  alternatives_korean:
  - 내가 가르친 자들 가운데에
  - 내 제자들 안에
  - 내가 가르친 이들 가운데에
  lexicon: HALOT
  rationale: למד의 수동/명사적 의미인 '가르침을 받은 자들'을 한국어의 자연스러운 종교적·교육적 용례인 '제자들'로 풀어, 소속 범위를 나타내는 ב의 뜻을 '가운데에'로 반영했습니다.
theological_decisions:
- issue: תּוֹרָה의 의미 범위
  chosen_reading: 율법
  alternative_readings:
  - 가르침
  - 교훈
  - 교리
  rationale: 예언서에서 תורה가 넓은 'instruction'일 수 있다는 긴장은 유지하되, 이 절의 문맥에서 '증언'과 병렬되는 권위 있는 계시 내용을 드러내기 위해 '율법'을 택했습니다.
  doctrine_reference: original-language primacy over translation tradition; documented lexical tension must remain visible
