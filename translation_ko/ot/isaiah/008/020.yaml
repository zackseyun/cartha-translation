  - severity: low
    issue: 각주 a의 위치
    rationale: ‘율법’의 어휘 대안에 관한 각주는 해당 단어 바로 뒤에 두는 편이 독자가 각주의 적용 범위를 분명히 알 수 있습니다.
  - severity: low
    issue: 각주 b의 대안 표현
    rationale: ‘그것 안에 새벽이 없습니다’라는 대안은 히브리어의 압축된 관계절과 그 지시 대상의 불확실성을 반영하므로 유지하되, ‘마지막 구절’보다 ‘마지막 절’로 표현하는 것이 정확합니다.
