id: ISA.8.20
reference: Isaiah 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
  footnotes:
  - marker: a
    text: Or 'To the instruction and to the testimony.' The Hebrew torah can mean 'instruction' as well as 'law.'
    reason: lexical_alternative
  - marker: b
    text: Or 'If they do not say according to this message, for whom there is no dawn.' The Hebrew of the final clause is compact and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 율법과 증언으로 가십시오! 그들이 이 말씀에 따라 말하지 않으면, 그들에게는 새벽이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 히브리어 תּוֹרָה의 가능한 의미 가운데 하나이며, 넓게는 ‘가르침’이라는 뜻도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘그들에게는 새벽이 없습니다’ 외에도, ‘그것 안에 새벽이 없습니다’처럼 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  english_pob_choice: to the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 토라
  lexicon: HALOT
  rationale: תּוֹרָה는 넓게는 ‘가르침’이지만, 여기서는 예언적 권위를 지닌 규범을 가리키므로 한국어에서는 문맥상 가장 직접적인 ‘율법’이 적절합니다.
- source_word: וְלִתְעוּדָה
  english_pob_choice: and to the testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언서
  - 증거로
  lexicon: HALOT
  rationale: תְּעוּדָה는 권위 있는 증언·증거를 뜻하므로, 병렬 구조를 살리면서도 자연스러운 한국어인 ‘증언’으로 옮겼습니다.
- source_word: יֹאמְרוּ
  english_pob_choice: they do not speak
  chosen_korean: 그들이 … 말하지 않으면
  alternatives_korean:
  - 그들이 … 말하지 않는다면
  - 그들이 … 말하지 아니하면
  lexicon: HALOT
  rationale: אָמַר는 기본적으로 ‘말하다’이므로, 경고문의 어조를 살려 ‘말하지 않으면’으로 번역했습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: according to this word
  chosen_korean: 이 말씀에 따라
  alternatives_korean:
  - 이 말에 따라
  - 이 말씀대로
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/말씀/사건’의 폭이 있지만, 예언 문맥에서 권위 있는 선포를 가리키므로 ‘이 말씀’이 가장 자연스럽습니다.
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  english_pob_choice: there is no dawn for them
  chosen_korean: 그들에게는 새벽이 없습니다
  alternatives_korean:
  - 그들에게는 새벽이 없으니
  - 그들 앞에는 새벽이 없습니다
  - 그에게는 새벽이 없습니다
  lexicon: HALOT
  rationale: שַׁחַר의 핵심 이미지는 ‘새벽’이므로 그 비유를 보존했고, לוֹ의 집합적 뉘앙스는 한국어에서 자연스럽게 복수 주어 ‘그들에게는’으로 풀었습니다.
theological_decisions:
- issue: 마지막 절의 이미지 해석
  chosen_reading: 거부된 계시 표준을 따르지 않는 자들에게는 빛나는 새 출발이나 소망의 새벽이 없다는 경고로 읽었습니다.
  alternative_readings:
  - 문장 자체가 ‘그것 안에 새벽이 없다’는 뜻일 수 있습니다.
  - 좀 더 강하게 단정하는 서술문으로 볼 수 있습니다.
  rationale: 본문의 예언적 경고와 암흑-새벽 대비를 살리되, 후속 해석을 과도하게 확정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it'
