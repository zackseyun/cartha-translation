base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
  footnotes:
  - marker: a
    text: Or 'many will stumble in/by it,' taking the pronoun as referring back to the stone/trap imagery in the immediate context.
    reason: alternative_reading
translation:
  language: ko
  text: 많은 사람이 그들 가운데서[a] 걸려 넘어질 것이며, 넘어져 부서지고, 올가미에 걸리고 붙잡힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에 걸려 넘어질 것이다’로도 옮길 수 있는데, 대명사를 직전의 돌/함정 이미지로 돌리는 해석입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ בָם רַבִּים
  english_pob_choice: And many among them will stumble
  chosen_korean: 많은 사람이 그들 가운데서 걸려 넘어질 것이며
  alternatives_korean:
  - 그들 안에서 많은 사람이 걸려 넘어질 것이며
  - 많은 사람이 그들 위에서 걸려 넘어질 것이며
  lexicon: HALOT
  rationale: כשל는 ‘걸려 넘어지다/비틀거리다’의 의미가 자연스럽고, בָם은 문맥상 대상 내부 또는 그들 가운데를 가리키는 것으로 보이므로 ‘그들 가운데서’가 가장 무리 없는 한국어 표현입니다.
- source_word: וְנָפְלוּ וְנִשְׁבָּרוּ
  english_pob_choice: they will fall and be broken
  chosen_korean: 넘어져 부서지고
  alternatives_korean:
  - 넘어지고 부서지고
  - 넘어져 깨지고
  lexicon: HALOT
  rationale: נפל과 נשבר의 연속을 간결하게 살리되, נשבר는 단순한 추상적 붕괴보다 ‘부서지다’가 더 직접적으로 형상과 손상을 함께 드러냅니다.
- source_word: וְנוֹקְשׁוּ וְנִלְכָּדוּ
  english_pob_choice: they will be snared and captured
  chosen_korean: 올가미에 걸리고 붙잡힐 것입니다
  alternatives_korean:
  - 덫에 걸리고 붙잡힐 것입니다
  - 올무에 걸리고 사로잡힐 것입니다
  lexicon: HALOT
  rationale: נוקשׁ는 덫/올가미에 ‘걸리다’의 이미지가 자연스럽고, לכד는 단순히 ‘잡다’보다 포획의 뉘앙스를 살린 ‘붙잡다’가 뒤의 단계적 심화를 유지합니다.
theological_decisions:
- issue: 걸림돌 심판의 연속적 이미지 유지
  chosen_reading: 추상화하지 않고 ‘걸려 넘어짐-넘어짐-부서짐-올가미-포획’의 구체적 연쇄를 그대로 보존했습니다.
  alternative_readings:
  - 일반적 패망이나 영적 실패로 풀어 쓰기
  rationale: 이 절은 바로 앞의 걸림돌/함정 이미지와 이어지는 심판 묘사이므로, 해석을 한 범주로 환원하지 않고 원문의 물리적 비유를 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
