- source_word: בְּחֶרֶט אֱנוֹשׁ
  english_pob_choice: with an ordinary stylus
  chosen_korean: 사람의 보통 서체로
  alternatives_korean:
  - 보통의 필기로
  - 사람의 펜으로
  - 일반 서체로
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 ‘사람/보통 인간’이라는 대비를 살려, 특수한 암호나 예술적 글씨가 아니라 누구나 읽을 수 있는 평범한 서체라는 점을 한국어 관용 표현으로 담았습니다.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  english_pob_choice: Maher-shalal-hash-baz
  chosen_korean: 마헬살랄하스바스
  alternatives_korean:
  - 메헬-살랄-하시-바즈
  - 마헤르-살랄-하쉬-바즈
  lexicon: HALOT
  rationale: 본문에서 기능하는 상징적 고유명으로 처리하여 음역을 유지했고, 한국어 표기에서는 어근 경계를 과도하게 드러내지 않는 자연스러운 일체형 음역을 사용했습니다.
theological_decisions:
- issue: 야훼의 직접 화법을 한국어에서 어떻게 표시할지
  chosen_reading: 서술문은 합쇼체로 유지하고, 인용문 안 명령은 단순 명령형으로 옮겼습니다.
  alternative_readings:
  - 전체를 더 높은 경어로 통일
  - 인용문 안에서도 합쇼체를 유지
  rationale: 본문은 예언자에게 주어진 직접 명령이므로, 바깥 서술은 합쇼체를 유지하되 인용문은 자연스러운 명령형으로 처리해 원문의 발화 층위를 드러냈습니다.
  doctrine_reference: '번역 원칙: 본문 화자 관계와 직접화법의 층위 보존'
