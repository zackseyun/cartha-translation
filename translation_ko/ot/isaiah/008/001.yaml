id: ISA.8.1
reference: Isaiah 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קַח לְ/ךָ֖ גִּלָּי֣וֹן גָּד֑וֹל וּ/כְתֹ֤ב עָלָי/ו֙ בְּ/חֶ֣רֶט אֱנ֔וֹשׁ לְ/מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
  footnotes:
  - marker: a
    text: Hebrew Maher-shalal-hash-baz, likely meaning “Quick to the plunder, swift to the spoil.”
    reason: lexical_alternative
  - marker: b
    text: Or “with a man’s pen,” “with a common pen,” or “in ordinary script.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 나에게 말씀하셨습니다. "너는 큰 판을 가져다가, 사람의 보통 서체로 그 위에 ‘마헬살랄하스바스’라고 적어라."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 Maher-shalal-hash-baz는 아마도 “약탈에 재빨리, 노획에 신속한”이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “사람의 펜으로”, “보통의 펜으로”, 혹은 “일반 서체로”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 프로젝트 기본 용례
  rationale: 원문의 언약적 고유명 יְהוָה를 한국어 본문에서도 직역적 음역인 ‘야훼’로 옮겨, POB의 표준 용례와 원문 식별성을 유지했습니다.
- source_word: גִּלָּיוֹן גָּדוֹל
  english_pob_choice: a large tablet
  chosen_korean: 큰 판
  alternatives_korean:
  - 큰 서판
  - 큰 두루마리
  - 큰 종이
  lexicon: HALOT
  rationale: 기록이 이루어지는 넓은 쓰기 표면이라는 핵심을 살리되, 한국어에서 자연스러운 공개용 기록 매체로 ‘판’을 택했습니다.
- source_word: בְּחֶרֶט אֱנוֹשׁ
  english_pob_choice: with an ordinary stylus
  chosen_korean: 사람의 보통 서체로
  alternatives_korean:
  - 보통의 필기로
  - 사람의 펜으로
  - 일반 서체로
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 ‘사람/보통 인간’이라는 대비를 살려, 특수한 암호나 예술적 글씨가 아니라 누구나 읽을 수 있는 평범한 서체라는 점을 한국어 관용 표현으로 담았습니다.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  english_pob_choice: Maher-shalal-hash-baz
  chosen_korean: 마헬살랄하스바스
  alternatives_korean:
  - 메헬-살랄-하시-바즈
  - 마헤르-살랄-하쉬-바즈
  lexicon: HALOT
  rationale: 본문에서 기능하는 상징적 고유명으로 처리하여 음역을 유지했고, 한국어 표기에서는 어근 경계를 과도하게 드러내지 않는 자연스러운 일체형 음역을 사용했습니다.
theological_decisions:
- issue: 야훼의 직접 화법을 한국어에서 어떻게 표시할지
  chosen_reading: 서술문은 합쇼체로 유지하고, 인용문 안 명령은 단순 명령형으로 옮겼습니다.
  alternative_readings:
  - 전체를 더 높은 경어로 통일
  - 인용문 안에서도 합쇼체를 유지
  rationale: 본문은 예언자에게 주어진 직접 명령이므로, 바깥 서술은 합쇼체를 유지하되 인용문은 자연스러운 명령형으로 처리해 원문의 발화 층위를 드러냈습니다.
  doctrine_reference: '번역 원칙: 본문 화자 관계와 직접화법의 층위 보존'
