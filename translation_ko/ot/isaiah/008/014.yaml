  - 그는 … 되십니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 나타내되, 앞 문맥의 야훼를 암시하는 이어짐을 살리기 위해 ‘그러나’로 전환점을 드러냈습니다.
- source_word: לְמִקְדָּשׁ
  english_pob_choice: a sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 거룩한 곳
  lexicon: HALOT
  rationale: 히브리어 מִקְדָּשׁ의 예배·거룩 공간 의미를 가장 직접적으로 살리면서, 보호처라는 함의도 과도하게 풀어 쓰지 않기 위해 ‘성소’로 옮겼습니다.
- source_word: אֶבֶן נֶגֶף / צוּר מִכְשׁוֹל
  english_pob_choice: a stone to strike against and a rock to stumble over
  chosen_korean: 걸려 넘어지는 돌과 비틀거리는 바위
  alternatives_korean:
  - 발이 걸리는 돌과 넘어지는 바위
  - 걸림돌과 넘어짐의 바위
  lexicon: HALOT
  rationale: POB가 구분한 두 비유를 한국어에서도 분리해, 첫 표현은 ‘strike against’의 충돌감을, 둘째는 ‘stumble’의 비틀거림을 살렸습니다.
- source_word: לְפַח וּלְמוֹקֵשׁ
  english_pob_choice: a trap and a snare
  chosen_korean: 덫과 올무
  alternatives_korean:
  - 함정과 그물
  - 덫과 덫
  lexicon: HALOT
  rationale: 서로 다른 두 사냥/포획 도구의 병렬을 유지하기 위해, 한국어에서 구별되는 일반어 ‘덫’과 ‘올무’를 사용했습니다.
theological_decisions:
- issue: 동일한 주체가 성소이면서 동시에 심판의 걸림이 되는 역설
  chosen_reading: ‘그러나’로 역설을 살리고, 성소와 걸림의 이미지를 함께 유지했습니다.
  alternative_readings:
  - ‘그리고’로 단순 병렬 처리
  - ‘피난처’로 완화하여 해석
  rationale: 본문은 같은 주체가 보호와 심판을 동시에 나타내는 긴장을 의도적으로 둡니다. 이를 매끈하게 풀어 한쪽 의미로 좁히지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
