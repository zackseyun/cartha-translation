base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'a stone of stumbling'; the Hebrew phrase אֶבֶן נֶגֶף overlaps with later biblical 'stumbling stone' language, but here 'to strike against' helps distinguish it from the next phrase, which explicitly speaks of stumbling.
    reason: lexical_alternative
  - marker: b
    text: Or 'for those who dwell in Jerusalem.' The Hebrew uses a singular participle with collective force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 성소가 되시겠지만, 이스라엘의 두 집에는 부딪히게 하는 돌과 걸려 넘어지게 하는 바위가 되시며[a], 예루살렘 주민에게는 덫과 올무가 되실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 비유는 서로 관련되지만 구별됩니다. 첫째는 부딪힘이나 타격을 일으키는 돌을, 둘째는 걸려 넘어지게 하는 바위를 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘예루살렘에 사는 사람’이라는 단수 분사를 쓰지만, 집합적으로 예루살렘 주민들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And he will become
  chosen_korean: 그러나 그는 … 되시고
  alternatives_korean:
