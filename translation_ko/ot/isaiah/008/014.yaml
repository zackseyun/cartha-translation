  terminology: ‘성소’, ‘덫’, ‘올무’는 적절합니다. 높임 종결과 ‘되시-’ 표현도 문맥상 주체에 알맞습니다. 두 돌 은유는 ‘부딪히게 하는 돌’과 ‘걸려 넘어지게 하는 바위’로 구별하는 편이 한국어에서 명료합니다.
