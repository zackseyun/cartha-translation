  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
  footnotes:
  - marker: a
    text: Or, more traditionally, “the LORD of Hosts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 나와 야훼께서 내게 주신 자녀들은 이스라엘 가운데서 표적과 기사가 됩니다. 만군의 야훼, 곧 시온 산에 거하시는 분에게서 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, “만군의 주”라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 예언적 주의 환기 기능을 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞는 직접 호소로 옮겼습니다.
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  english_pob_choice: whom Yahweh has given me
  chosen_korean: 야훼께서 내게 주신
  alternatives_korean:
  - 야훼께서 내게 주셨던
  - 주께서 내게 주신
  lexicon: HALOT
  rationale: 아이들을 야훼의 선물로 식별하는 관계절을 유지했고, '내게 주신'은 현재 관련성을 살리면서도 자연스럽습니다.
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  english_pob_choice: for signs and wonders
  chosen_korean: 표적과 기사
  alternatives_korean:
  - 표징과 경이
  - 징조와 기이한 일
  lexicon: HALOT
  rationale: 두 명사쌍의 병렬과 예언서의 전형적 어휘를 살리되, 한국어에서 굳어진 성경적 표현인 '표적과 기사'를 사용했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 군대들의 야훼
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: צְבָאוֹת는 전통적으로 '만군'으로 굳어진 군대/군세의 복수 개념을 전달하므로, 직역보다 의미가 분명한 '만군의 야훼'를 택했습니다.
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  english_pob_choice: who dwells on Mount Zion
  chosen_korean: 시온 산에 거하시는 분
  alternatives_korean:
  - 시온 산에 거하시는 이
  - 시온 산에 사시는 분
  lexicon: HALOT
  rationale: 현재분사적 묘사를 살려 지속적 임재를 나타냈고, '거하시는 분'은 하나님의 거처/임재를 드러내는 예언서 문맥에 적합합니다.
theological_decisions:
- issue: 야훼 צְבָאוֹת의 한국어 관용구 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼의 군대들
  - 군대들의 야훼
  rationale: 본문의 호칭은 하나님을 전쟁의 군세 주권자로 부르는 칭호이므로, 한국어 성경에서 널리 인지되면서도 원의가 분명한 '만군의 야훼'로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh; transliterated divine name + transparent title rendering'
