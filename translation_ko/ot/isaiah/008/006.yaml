  text: יַ֗עַן כִּ֤י מָאַס֙ הָ/עָ֣ם הַ/זֶּ֔ה אֵ֚ת מֵ֣י הַ/שִּׁלֹ֔חַ הַ/הֹלְכִ֖ים לְ/אַ֑ט וּ/מְשׂ֥וֹשׂ אֶת רְצִ֖ין וּ/בֶן רְמַלְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
  footnotes:
  - marker: a
    text: Shiloah is the Hebrew name; Greek tradition gives the form Siloam.
    reason: lexical_alternative
  - marker: b
    text: Or, in a difficult reading, 'and trembles before Rezin and the son of Remaliah.' The Hebrew text reads 'rejoices,' but some understand the sense differently from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 이 백성이 잔잔히 흐르는 실로아의 물을 저버리고, 르신과 르말랴의 아들을 기뻐하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 실로아는 히브리어 이름이며, 그리스 전통에서는 실로암이라는 형태가 전해집니다.
    reason: lexical_alternative
  - marker: b
    text: 난해한 구절입니다. 히브리어 본문은 ‘기뻐하다’라고 읽지만, 문맥상 일부는 ‘르신과 르말랴의 아들 앞에서 두려워 떨다’라는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  english_pob_choice: Because
  chosen_korean: 이유는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이므로
  lexicon: HALOT
  rationale: 예언 문맥의 인과를 현대 한국어로 자연스럽게 드러내면서도, 뒤의 심판 선언을 준비하는 이유절의 힘을 유지합니다.
- source_word: מָאַס
  english_pob_choice: has rejected
  chosen_korean: 버리고
  alternatives_korean:
  - 거절하고
  - 배척하고
  lexicon: HALOT
  rationale: 물의 거부를 나타내는 결정적 거절을 한국어 동사 '버리다'로 간결하게 옮겨, 단순한 취향 차이가 아니라 언약적 거부라는 뉘앙스를 살렸습니다.
- source_word: הַהֹלְכִים לְאַט
  english_pob_choice: that flow gently
  chosen_korean: 느린 물살로 흐르는
  alternatives_korean:
  - 부드럽게 흐르는
  - 천천히 흐르는
  lexicon: HALOT
  rationale: 직역의 '천천히'보다 물의 이미지에 맞는 '느린 물살로'를 택해, 작은 개울의 조용한 흐름과 다음 절의 큰 강 이미지 대비를 살렸습니다.
- source_word: וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ
  english_pob_choice: and rejoices over Rezin and the son of Remaliah
  chosen_korean: 르신과 르말랴의 아들을 기뻐하기
  alternatives_korean:
  - 르신과 르말랴의 아들 안에서 기뻐하기
  - 르신과 르말랴의 아들을 즐거워하기
  lexicon: HALOT
  rationale: 마소라 본문의 '기뻐하다/즐거워하다'를 그대로 살리되, 한국어에서는 목적어를 자연스럽게 받는 형태로 정리했습니다. POB가 보존한 난해 구문을 해석적으로 '두려워하다'로 바꾸지 않았습니다.
theological_decisions:
- issue: וּמְשׂוֹשׂ의 난해한 의미를 어떻게 처리할 것인가
  chosen_reading: 본문 형태를 따라 '기뻐하기'로 옮기고, 반대 의미의 추정은 본문에 넣지 않았습니다.
  alternative_readings:
  - 두려워하기
  - 전율하기
  rationale: 문맥상 해석상 어려움이 있어도, 현존 히브리어 본문이 실제로 말하는 표현을 우선 보존하는 것이 번역 원칙에 맞습니다. 해석적 수정은 본문 의미를 넘어설 수 있습니다.
  doctrine_reference: 번역 철학 §§1, 3, 5
