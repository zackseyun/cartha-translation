id: ISA.8.11
reference: Isaiah 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֧ר יְהוָ֛ה אֵלַ֖/י כְּ/חֶזְקַ֣ת הַ/יָּ֑ד וְ/יִסְּרֵ֕/נִי מִ/לֶּ֛כֶת בְּ/דֶ֥רֶךְ הָֽ/עָם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
  footnotes:
  - marker: a
    text: Or 'while his hand was strong upon me.' The Hebrew idiom conveys forceful divine constraint or compulsion.
    reason: lexical_alternative
  - marker: b
    text: Or 'instructing me' or 'disciplining me.' The verb can carry the sense of correction, discipline, or warning; here it introduces a prohibition.
    reason: lexical_alternative
translation:
  language: ko
  text: '이는 야훼께서 내게 말씀하시기를, 강한 손[a]으로 내게 경고하시며, 이 백성의 길[b]로 행하지 말라고 하시면서, 이르시되:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 손이 내 위에 강하게 있었을 때’라는 뜻입니다. 히브리어 관용구는 하나님의 강압적 제약이나 강한 촉구를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 훈계하시며’ 혹은 ‘나를 징계하시며’라는 뜻입니다. 이 동사는 교정, 훈계, 징계의 의미를 지닐 수 있으며, 여기서는 금지의 말씀을 도입합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: Tetragrammaton은 POB 원칙에 따라 고유명사로 옮겨야 하므로, 한국어에서도 ‘야훼’를 사용해 신적 칭호 ‘주님’과 구별했습니다.
- source_word: כְּחֶזְקַת הַיָּד
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손
  alternatives_korean:
  - 강한 손으로
  - 세찬 손으로
  - 강한 손이 임하여
  lexicon: HALOT
  rationale: 히브리어 관용구의 손 이미지를 살리면서도 한국어에서는 과도한 확대 없이 압박과 강제의 뉘앙스를 보존하도록 ‘강한 손’으로 옮겼습니다.
- source_word: וְיִסְּרֵנִי
  english_pob_choice: warning me
  chosen_korean: 경고하시며
  alternatives_korean:
  - 훈계하시며
  - 징계하시며
  - 가르치시며
  lexicon: HALOT
  rationale: 문맥상 금지 명령을 도입하는 기능이 두드러지므로, ‘훈계’보다 직접적인 ‘경고’가 의미를 더 분명하게 드러냅니다.
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  english_pob_choice: not to walk in the way
  chosen_korean: 행하지 말라고
  alternatives_korean:
  - 걸어가지 말라고
  - 그 길로 가지 말라고
  - 그 길을 따르지 말라고
  lexicon: HALOT
  rationale: ‘걷다’의 비유는 윤리적 삶의 방식이지만, 한국어에서는 ‘행하다/따르다’가 더 자연스럽게 행실의 방향을 나타내므로 그 뜻을 살렸습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  - 이 ժողովուրդ
  lexicon: HALOT
  rationale: 예언서의 집단 지시 표현으로 ‘people’보다 ‘백성’이 공동체적·언약적 뉘앙스를 더 잘 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 고유신명(神名)을 유지하는 것이 본문이 드러내는 인격적 발화와 언약적 호칭을 가장 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
