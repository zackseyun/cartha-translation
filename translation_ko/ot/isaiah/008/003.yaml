    issue: ‘예언자’가 הַנְּבִיאָה의 명시적 여성형을 본문에서 중화합니다.
    rationale: 뒤의 ‘그 여인’이 여성을 암시하지만, 원문은 해당 직함 자체를 여성형으로 사용합니다. ‘여예언자’가 이 표지를 직접 보존합니다.
  - severity: high
    issue: 상징적 이름의 음역 ‘마헤르살랄하시바스’가 원문의 חָשׁ בַּז를 정확히 반영하지 못합니다.
    rationale: חָשׁ는 ‘하쉬’, בַּז는 ‘바즈’에 해당하므로 ‘마헤르살랄하쉬바즈’가 더 충실합니다.
  - severity: medium
    issue: 각주의 ‘약탈을 서두르고, 전리품을 재촉한다’는 설명은 이름의 어휘적 병렬과 의미 관계를 흐립니다.
