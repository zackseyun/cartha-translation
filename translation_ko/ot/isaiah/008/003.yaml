language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
  footnotes:
  - marker: a
    text: Maher-shalal-hash-baz likely means something like “quick to the plunder, swift to the spoil.”
    reason: lexical_alternative
  - marker: b
    text: Or 'Then I went near to the prophetess, and she conceived and bore a son. Then the LORD said to me, “Call his name Maher-shalal-hash-baz.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그래서 나는 예언자에게 가까이 갔습니다. 그 여인이 잉태하여 아들을 낳았습니다. 그러자 야훼께서 제게 말씀하셨습니다. “그의 이름을 마헤르살랄하시바스라 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마헤르살랄하시바스’는 대략 ‘약탈을 서두르고, 전리품을 재촉한다’는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַב
  english_pob_choice: So I went near
  chosen_korean: 나는 가까이 갔습니다
  alternatives_korean:
  - 나는 다가갔습니다
  - 나는 접근했습니다
  lexicon: HALOT
  rationale: 히브리어 קרב는 문자적으로 ‘가까이 가다’이므로, 본문이 함축하는 관계적 접근을 과도하게 풀지 않고 자연스러운 합쇼체로 옮겼습니다.
- source_word: הַנְּבִיאָה
  english_pob_choice: the prophetess
  chosen_korean: 예언자
  alternatives_korean:
  - 여예언자
  - 예언녀
  lexicon: HALOT
  rationale: ‘prophetess’의 여성형 표지를 살리되, 한국어에서는 직역형보다 ‘예언자’가 더 자연스럽고 본문의 기능을 충분히 드러냅니다. 문맥상 여성을 가리키는 점은 관사와 서술 흐름으로 유지됩니다.
- source_word: וַתַּהַר / וַתֵּלֶד בֵּן
  english_pob_choice: she conceived and bore a son
  chosen_korean: 그 여인이 잉태하여 아들을 낳았습니다
  alternatives_korean:
  - 그 여인이 임신하여 아들을 낳았습니다
  - 그 여인이 잉태하고 아들을 출산했습니다
  lexicon: HALOT
  rationale: הרה와 ילד의 기본 의미를 따라 ‘잉태하다 / 낳다’로 옮겨, 성경 서술의 간결함과 출생 공식의 어조를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 여호와 대신 하나님의 고유명 ‘야훼’를 사용하여 원문의 인칭성과 구별성을 보존했습니다.
- source_word: קְרָא שְׁמוֹ
  english_pob_choice: Call his name
  chosen_korean: 그의 이름을 …라 하십시오
  alternatives_korean:
  - 그 이름을 …라고 부르십시오
  - 이름을 …로 정하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 부르다’를 한국어 명령형으로 자연스럽게 풀어, 명명 명령의 기능을 분명하게 드러냈습니다.
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  english_pob_choice: Maher-shalal-hash-baz
  chosen_korean: 마헤르살랄하시바스
  alternatives_korean:
  - 마하르살랄하쉬바즈
  - 마헤르-살랄-하쉬-바즈
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지했고, 한국어 표기에서는 음절 경계를 따라 읽기 쉬운 형태로 옮겼습니다.
theological_decisions:
- issue: 예언자에게 가까이 갔다는 표현의 성적 함의
  chosen_reading: 직설적으로 풀지 않고 ‘가까이 갔다’는 히브리어 완곡어법을 유지했습니다.
  alternative_readings:
  - 그 여인과 관계를 가졌습니다
  - 그 여인과 동침했습니다
  rationale: 문맥상 결혼 관계의 성적 접촉을 가리키지만, 원문은 그 수준의 절제를 유지합니다. 번역도 그 절제를 보존하는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: '번역 원칙: 소스가 허용하는 정도 이상으로 의미를 확장하지 말 것.'
