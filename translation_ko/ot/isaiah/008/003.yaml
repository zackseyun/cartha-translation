revisions:
- from: 그래서 나는 예언자에게 가까이 갔습니다. 그 여인이 잉태하여 아들을 낳았습니다. 그러자 야훼께서 제게 말씀하셨습니다. “그의 이름을 마헤르살랄하시바스라 하십시오.”[a]
  to: 나는 그 여예언자에게 가까이 갔습니다. 그 여예언자가 잉태하여 아들을 낳았습니다. 그러자 야훼께서 나에게 말씀하셨습니다. “그의 이름을 마헤르살랄하쉬바즈라 하십시오.”[a]
  rationale: 원문의 완곡한 ‘가까이 갔다’를 유지하되, ‘여예언자’로 여성형 직함을 보존했습니다. 인명의 음역을 히브리어 자음에 맞게 바로잡고, 각주는 상징적 이름의 의미를 확정하지 않은 채 원문의 압축된 병렬을 더 충실히 반영하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
