  - severity: medium
    issue: הִתְאַזְּרוּ에 ‘전투를 위해’를 본문에 첨가함
    rationale: 동사는 ‘스스로 띠를 두르다/무장 준비를 하다’를 뜻하지만 ‘전투’는 문맥상 함의입니다. 최적 등가 번역에서는 본문에 첨가하지 않고 각주로 설명하는 편이 적절합니다.
