source:
  edition: WLC
  text: רֹ֤עוּ עַמִּים֙ וָ/חֹ֔תּוּ וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל מֶרְחַקֵּי אָ֑רֶץ הִתְאַזְּר֣וּ וָ/חֹ֔תּוּ הִֽתְאַזְּר֖וּ וָ/חֹֽתּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
  footnotes:
  - marker: a
    text: The opening Hebrew imperative is difficult. It may also be rendered 'Raise a war cry, O peoples' or 'Band yourselves together, O peoples.'
    reason: alternative_reading
  - marker: b
    text: Or 'gird yourselves'; the Hebrew refers to preparing oneself, likely for conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 민족들아, 부서져라[a]. 땅의 먼 모든 곳들아, 들으라. 띠를 두르고 부서져라. 띠를 두르고 부서져라[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 동사는 해석이 어렵습니다. ‘전쟁 함성을 질러라’ 또는 ‘서로 결속하라’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘허리에 띠를 두르라’는 뜻입니다. 히브리어는 대개 전투를 위한 준비를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  english_pob_choice: Be shattered
  chosen_korean: 부서져라
  alternatives_korean:
  - 전쟁 함성을 질러라
  - 서로 결합하라
  - 악을 행하라
  lexicon: HALOT
  rationale: 히브리어 동사는 해석이 어려우나, 바로 뒤의 반복되는 וָחֹתּוּ(부서지다/무너지다)와 심판적 조롱의 문맥을 따라 ‘부서져라’로 옮기면 원문의 역설적 선언과 파괴의 뉘앙스를 잘 살릴 수 있습니다.
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 나라들
  lexicon: HALOT
  rationale: 복수 대상을 그대로 살리되, 외국의 여러 집단을 향한 직접 호명을 현대 한국어에서 자연스럽게 드러내기 위해 ‘민족들’로 옮겼습니다.
- source_word: הִתְאַזְּר֣וּ
  english_pob_choice: Strap yourselves on for battle
  chosen_korean: 전투를 위해 몸에 띠를 두르고
  alternatives_korean:
  - 띠를 띠고
  - 무장하고
  - 허리에 띠를 두르고
  lexicon: HALOT
  rationale: 원뜻은 ‘띠를 두르다/차다’이지만, 문맥상 전투 준비를 가리키므로 ‘전투를 위해’와 함께 풀어써서 현대 독자가 군사적 준비를 즉시 이해하도록 했습니다.
- source_word: מֶרְחַקֵּי אָרֶץ
  english_pob_choice: all distant parts of the earth
  chosen_korean: 땅의 먼 곳에 있는 모든 자들
  alternatives_korean:
  - 땅의 먼 곳들
  - 땅끝의 모든 곳
  lexicon: HALOT
  rationale: 지리적 거리의 확장성을 유지하되, 호격 구조를 살려 ‘~에 있는 모든 자들’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 첫 명령 רֹעוּ의 의미 선택
  chosen_reading: 심판의 조롱으로서 ‘부서져라’라고 읽었습니다.
  alternative_readings:
  - ‘전쟁 함성을 질러라’
  - ‘서로 결속하라’
  rationale: 호전적 준비를 명령하는 듯 보이는 동사를 본문 흐름의 반복적 파괴 선언에 맞추어 심판적 반어로 번역해야, 청중이 듣는 예언적 위협의 힘이 유지됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
