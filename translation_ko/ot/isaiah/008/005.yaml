  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 통상적 대체어 ‘주님’이 아니라 고유명사로서 ‘야훼’로 옮겨, 원문이 드러내는 언약적 이름을 보존했습니다.
- source_word: דַּבֵּר ... לֵאמֹר
  english_pob_choice: spoke ... saying
  chosen_korean: 말씀하시며 이르셨습니다
  alternatives_korean:
  - 말씀하여 이르시며
  - 말씀하셨습니다
  - 말하며 이르셨습니다
  lexicon: HALOT
  rationale: דבר 뒤의 לֵאמֹר는 직설 화법을 여는 전형적 표현이므로, ‘말씀하시며 이르셨습니다’로 연결해 다음 절의 직접화법을 자연스럽게 준비했습니다.
theological_decisions:
