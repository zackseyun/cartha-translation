  rationale: 히브리어 יסף+동사 구문은 문자적으로는 ‘더하다’이지만, 여기서는 새로 이어지는 하나님의 발화를 뜻하므로 한국어에서는 자연스럽게 ‘다시 말씀하시며’로 옮기는 것이 원문의 반복·재개 의미를 잘 살립니다.
