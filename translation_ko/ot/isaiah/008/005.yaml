  - 여호와
  rationale: 이 절은 단순 호칭이 아니라 이사야가 듣는 하나님의 직접 발화를 시작하는 구절이므로, 신적 명칭을 가리지 않고 고유명으로 표기하는 것이 원문의 신학적 무게를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
