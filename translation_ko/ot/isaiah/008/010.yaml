id: ISA.8.10
reference: Isaiah 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֻ֥צוּ עֵצָ֖ה וְ/תֻפָ֑ר דַּבְּר֤וּ דָבָר֙ וְ/לֹ֣א יָק֔וּם כִּ֥י עִמָּ֖/נוּ אֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
  footnotes:
  - marker: a
    text: 'Hebrew: ''for with us is God,'' echoing the name Immanuel (''God with us'') in Isaiah 7:14; 8:8.'
    reason: cross_reference
translation:
  language: ko
  text: “계획을 세워 보십시오. 그러면 그 계획은 무산될 것입니다. 말을 해 보십시오. 그러면 그 말은 성립하지 못할 것입니다. 하나님이 우리와 함께 계시기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘우리와 함께 계신 하나님’ 또는 ‘하나님이 우리와 함께 계십니다’라는 뜻이며, 이사야 7:14과 8:8의 ‘임마누엘’(‘하나님이 우리와 함께 계십니다’)이라는 이름을 메아리칩니다.
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ / עֵצָה
  english_pob_choice: Make a plan / a plan
  chosen_korean: 계획을 세워 보아라
  alternatives_korean:
  - 모략을 꾸며 보아라
  - 계획을 꾸며 보아라
  - 상의를 해 보아라
  lexicon: HALOT
  rationale: 명령형 복수의 도전적 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 적대적 음모의 맥락에도 잘 맞는 표현으로 옮겼습니다.
- source_word: וְתֻפָר
  english_pob_choice: and it will be thwarted
  chosen_korean: 그러나 이루어지지 않을 것이다
  alternatives_korean:
  - 그러나 좌절될 것이다
  - 그러나 깨질 것이다
  - 그러나 헛될 것이다
  lexicon: HALOT
  rationale: 파괴·무효화의 뜻을 한국어에서 가장 자연스럽게 전달하는 방향으로, 계획의 실패와 무산을 분명히 드러냈습니다.
- source_word: דַּבְּרוּ דָבָר / וְלֹא יָקוּם
  english_pob_choice: speak a word / and it will not stand
  chosen_korean: 말을 해 보아라. 그러나 서지 않을 것이다
  alternatives_korean:
  - 말해 보아라. 그러나 성립하지 않을 것이다
  - 선언해 보아라. 그러나 굳게 서지 않을 것이다
  lexicon: HALOT
  rationale: parallelism을 살려 짧게 대응시키되, יקום의 ‘서다/성립하다’ 의미를 한국어의 ‘서다’로 직접 반영했습니다.
- source_word: עִמָּנוּ אֵל
  english_pob_choice: God is with us
  chosen_korean: 하나님이 우리와 함께 계시기 때문입니다
  alternatives_korean:
  - 하나님이 우리와 함께 계시므로
  - 우리와 함께 계시는 하나님이 있기 때문입니다
  - 임마누엘이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 יחד된 구문을 한국어 서술문으로 자연스럽게 풀어 옮기되, 이름 자체로 고정하지 않고 ‘우리와 함께 계시다’라는 뜻을 살렸습니다.
theological_decisions:
- issue: עִמָּנוּ אֵל과 임마누엘 표상의 처리
  chosen_reading: 본문에는 이름 ‘임마누엘’을 직접 넣지 않고, ‘하나님이 우리와 함께 계시기 때문입니다’로 번역했습니다.
  alternative_readings:
  - 임마누엘이기 때문입니다
  - 우리와 함께 계시는 하나님이시기 때문입니다
  rationale: 이 구절은 이사야 7:14과 8:8의 임마누엘 이름을 강하게 메아리치지만, כאן의 히브리어는 고유명사형이 아니라 구문 형태이므로 의미를 본문에 두고 상호본문적 연결은 주석으로 남기는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
