source:
  edition: WLC
  text: כִּ֣י לֹ֣א מוּעָף֮ לַ/אֲשֶׁ֣ר מוּצָ֣ק לָ/הּ֒ כָּ/עֵ֣ת הָ/רִאשׁ֗וֹן הֵקַ֞ל אַ֤רְצָ/ה זְבֻלוּן֙ וְ/אַ֣רְצָ/ה נַפְתָּלִ֔י וְ/הָ/אַחֲר֖וֹן הִכְבִּ֑יד דֶּ֤רֶךְ הַ/יָּם֙ עֵ֣בֶר הַ/יַּרְדֵּ֔ן גְּלִ֖יל הַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
  footnotes:
  - marker: a
    text: Or 'Galilee of the Gentiles.' The Hebrew literally says 'Galilee of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew is difficult at the start of the verse; 'gloom' may also be understood as 'darkness' or 'dimness.'
    reason: lexical_alternative
  - marker: c
    text: Matthew 4:15-16 cites this region in connection with the beginning of Jesus' public ministry.
    reason: cross_reference
translation:
  language: ko
  text: 고통받던 그 땅에는 더 이상 어둠이 없을 것입니다.[a] 이전 때에는 스불론 땅과 납달리 땅을 천하게 하셨으나, 훗날에는 바닷길과 요단강 건너편과 민족들의 갈릴리를 영화롭게 하실 것입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 절 시작 부분은 난해합니다. ‘어둠’은 ‘캄캄함’ 또는 ‘침울함’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요단강 건너편’은 방향의 기준을 밝히지 않는 히브리어 지리 표현을 따른 번역입니다.
    reason: source_note
  - marker: c
    text: ‘민족들의 갈릴리’는 ‘이방인의 갈릴리’로도 번역할 수 있습니다. 마태복음 4:15-16은 이 지역을 예수님의 공적 사역 시작과 관련하여 인용합니다.
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: מוּעָף
  english_pob_choice: gloom
  chosen_korean: 어둠
  alternatives_korean:
  - 캄캄함
  - 침울함
  - 그늘
  lexicon: HALOT
  rationale: 희귀하고 난해한 어휘로서 POB가 ‘gloom’으로 잡은 압박적 어둠의 뜻을 한국어의 자연스러운 표현인 ‘어둠’으로 옮겼습니다.
- source_word: מוּצָק לָהּ
  english_pob_choice: her who was in anguish
  chosen_korean: 고통받던 그에게
  alternatives_korean:
  - 고난 가운데 있던 그에게
  - 압박받던 그에게
  - 고통 속에 있던 그 땅에게
  lexicon: HALOT
  rationale: 여성형 대명사는 땅/지역의 의인화를 가리키므로, 인칭을 살려 ‘그’로 옮기되 압박과 고통의 상태를 ‘고통받던’으로 담았습니다.
- source_word: הֵקַל
  english_pob_choice: brought contempt on
  chosen_korean: 멸시하였으나
  alternatives_korean:
  - 천하게 여기셨으나
  - 가볍게 여기셨으나
  - 낮추셨으나
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘가볍게 함’보다 수치를 주고 천대하는 뉘앙스가 강하므로, 한국어에서 그 효과를 분명히 드러내는 ‘멸시하다’를 택했습니다.
- source_word: הִכְבִּיד
  english_pob_choice: will make glorious
  chosen_korean: 영화롭게 하실 것입니다
  alternatives_korean:
  - 존귀하게 하실 것입니다
  - 영광스럽게 하실 것입니다
  - 무겁게 하실 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘무겁게 하다’이지만, 앞절의 수치와 대비되는 회복의 뜻을 살려 한국어 성경 어법에 자연스러운 ‘영화롭게 하다’로 옮겼습니다.
theological_decisions:
- issue: גְּלִיל הַגּוֹיִם의 번역에서 '이방'과 '민족들' 중 선택
  chosen_reading: ‘이방의 갈릴리’로 옮겨, 마태복음의 수용사와 연결되는 전통적 독법을 본문에 반영했습니다.
  alternative_readings:
  - 민족들의 갈릴리
  - 나라들의 갈릴리
  rationale: 히브리어는 문자적으로 ‘민족들의 갈릴리’이지만, 한국어 독자에게는 마태복음 4장의 인용과 연결되는 ‘이방의 갈릴리’가 더 즉각적으로 이해되며, 동시에 원문의 지역명 구조도 보존됩니다.
  doctrine_reference: 성경 간 인용과 수용사를 본문 번역에 과도하게 주입하지 않되, 본문이 실제로 낳은 신약적 독법은 주석적으로 투명하게 반영합니다.
