translation:
  language: ko
  text: 그는 땅을 바라보지만[a], 보십시오, 고통과 어둠, 곤고의 짙은 어둠[b]뿐이며, 짙은 어둠은 쫓겨납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 압축되어 있어 ‘고통과 어둠, 곤고의 짙은 어둠, 그리고 쫓겨난 짙은 어둠’처럼 읽을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 위
  - 나라
  - 땅과 그 모든 것
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥에 따라 ‘땅/나라/세상’이 가능하므로, 여기서는 시적 대비를 살려 가장 넓고 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: יַבִּיט
  english_pob_choice: he will look
  chosen_korean: 바라보지만
  alternatives_korean:
  - 쳐다보지만
  - 찾아보지만
  - 응시하지만
  lexicon: HALOT
  rationale: 동사는 단순한 시선 이동보다 절박하게 찾아보는 뉘앙스를 띠므로, 문맥상 결과를 드러내는 ‘바라보지만’이 적절합니다.
- source_word: צָרָה / חֲשֵׁכָה / מְעוּף צוּקָה / אֲפֵלָה
  english_pob_choice: distress and darkness, the gloom of anguish
  chosen_korean: 고통과 어둠, 곤고의 짙은 어둠
  alternatives_korean:
  - 환난과 어둠, 고뇌의 어둠
  - 고난과 캄캄함, 곤고의 그늘
  lexicon: HALOT
  rationale: 히브리어가 압축된 병렬 구문이므로, ‘고통/어둠/곤고/짙은 어둠’으로 중첩된 어둠의 이미지를 살리되 지나친 풀어쓰기는 피했습니다.
- source_word: מְנֻדָּח
  english_pob_choice: will be driven away
  chosen_korean: 쫓겨납니다
  alternatives_korean:
  - 몰려납니다
  - 추방됩니다
  - 내쫓깁니다
  lexicon: HALOT
  rationale: 마지막 분사는 대상을 어디론가 ‘몰아넣는다’기보다 ‘쫓아내다/몰아내다’의 수동적 결과를 가리키므로, 현대 한국어에서 자연스러운 ‘쫓겨납니다’로 옮겼습니다.
theological_decisions:
- issue: 암시적 절망의 종결 방식
  chosen_reading: 마지막 절은 인물이 어둠 속으로 들어간다기보다 ‘짙은 어둠 자체가 쫓겨나는’ 종결로 읽었습니다.
  alternative_readings:
  - 그가 짙은 어둠 속으로 쫓겨낀다
  - 짙은 어둠 속으로 내몰린다
  rationale: 본문의 종결어는 분사형으로, 대상 자체보다 ‘짙은 어둠’의 상태를 마무리하는 표현으로 보는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 종결 구조 보존
- issue: 화자 시점과 경고의 톤
  chosen_reading: 직설적 경고의 시적 어조를 유지하기 위해 문장을 평탄화하지 않고 병렬과 대조를 살렸습니다.
  alternative_readings:
  - 설명적으로 풀어쓴 번역
  - 현대적 서술로 완화한 번역
  rationale: 이 절은 예언 문맥의 압축된 심판 묘사이므로, 청중이 느끼는 긴장과 암시를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 예언서 문체 보존
