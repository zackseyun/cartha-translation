id: ISA.8.12
reference: Isaiah 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
  footnotes:
  - marker: a
    text: Or 'Do not say, “A conspiracy,” concerning everything that this people says is a conspiracy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this people,' a collective expression; 'what they fear' renders the singular suffix in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: “음모”라고 이 백성이 음모라고 부르는 것을 모두 음모라고 하지 마십시오. 그들이 두려워하는 것을 두려워하지 말며, 떨지도 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음모’로 옮긴 히브리어 קֶשֶׁר은 ‘모의’나 ‘공모’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 백성’은 히브리어의 집합적 표현을 살린 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאמְרוּן קֶשֶׁר
  english_pob_choice: Do not call conspiracy
  chosen_korean: “음모”라고 … 음모라고 하지 마십시오
  alternatives_korean:
  - “공모”라고 … 공모라고 하지 마십시오
  - “계획”이라고 … 계획이라고 하지 마십시오
  lexicon: HALOT
  rationale: תֹאמְרוּן은 단순히 ‘말하다’보다 어떤 사안을 그렇게 ‘부르다/규정하다’는 뜻이므로, 한국어에서는 ‘“음모”라고 부르다’가 가장 자연스럽고 POB의 라벨링 대조를 살립니다.
- source_word: קֶשֶׁר / קָשֶׁר
  english_pob_choice: conspiracy
  chosen_korean: 음모
  alternatives_korean:
  - 공모
  - 모의
  - 반역
  lexicon: HALOT
  rationale: קֶשֶׁר은 정치·사회적 맥락의 불온한 결탁/모의를 가리키므로, 현대 한국어에서 가장 넓고 직관적인 대응은 ‘음모’입니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: HALOT
  rationale: זוֹ/הָעָם הַזֶּה의 지시적·책망적 뉘앙스를 살리기 위해 ‘이 백성’을 택했습니다. ‘이 사람들’보다 공동체적이며, ‘이 민족’보다 원문 표현에 가깝습니다.
- source_word: מוֹרָאוֹ לֹא תִירְאוּ וְלֹא תַעֲרִיצוּ
  english_pob_choice: do not fear what they fear, nor be in dread
  chosen_korean: 그들이 두려워하는 것을 두려워하지 말며, 떨지도 마십시오
  alternatives_korean:
  - 그들이 두려워하는 것을 두려워하지 말며, 무서워하지도 마십시오
  - 그들의 두려움을 두려워하지 말며, 두려워 떨지도 마십시오
  lexicon: HALOT
  rationale: מוֹרָא와 תִירְאוּ의 어근 연결을 유지하면서도 한국어에서는 같은 말을 반복하기보다 ‘두려워하다/떨다’로 병렬을 만들면 원문의 평행법과 강도를 더 잘 전달합니다.
theological_decisions:
- issue: 본문의 금지 대상이 ‘실제 음모’인지 ‘집단적 공포의 규정’인지
  chosen_reading: 하나님의 백성이 주변 여론의 공포 섞인 낙인을 받아들이지 말라는 권면으로 넓게 유지했습니다.
  alternative_readings:
  - 실제 정치적 음모 참여를 금하는 경고
  - 주민들을 두려워하지 말라는 명시적 금지
  rationale: 반복되는 ‘음모’와 두려움 병행은 특정 사건만이 아니라 공동체의 공포 해석 자체를 거부하라는 수사적 효과가 강합니다. 한국어도 그 폭을 좁히지 않았습니다.
  doctrine_reference: 이사야 8:12 문맥
- issue: ‘떨다’의 강도
  chosen_reading: ‘떨지도 마십시오’로 옮겨 공포의 신체적 반응까지 포함했습니다.
  alternative_readings:
  - ‘무서워하지 마십시오’
  - ‘두려워하지 마십시오’
  rationale: תַעֲרִיצוּ의 강한 동사 감각을 평범한 동의어로 평평하게 만들지 않기 위해, 두려움의 심화된 반응인 ‘떨다’를 택했습니다.
  doctrine_reference: 히브리어 시적 평행법
