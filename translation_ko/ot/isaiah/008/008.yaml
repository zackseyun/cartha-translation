    rationale: 문맥상 침략을 가리키지만, 원문의 동사들은 홍수의 이동·범람 이미지를 통해 이를 표현합니다. ‘밀려들어와’는 그 이미지를 유지하면서 진행 방향을 나타냅니다.
  - severity: medium
    issue: ‘그 날개가 펼쳐진 넓이는 … 땅의 넓이를’이라는 표현이 어색하고 의미 관계가 불명확합니다.
