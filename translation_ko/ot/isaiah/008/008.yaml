  source_fidelity: 첫 동작은 홍수 비유 안에서 유다로 계속 밀려드는 움직임을 나타냅니다. 초안의 ‘쳐들어와’는 침략이라는 해석을 직접 덧붙이므로, 물의 비유와 원문의 표현을 더 직접 보존하는 ‘밀려들어와’가 적절합니다. 후반부는 ‘날개의 펼침’이 땅의 온 너비를 채운다는 구문으로 옮겨야 합니다.
  naturalness: 초안의 ‘그 날개가 펼쳐진 넓이는 … 당신의 땅의 넓이를’은 ‘넓이’가 중복되고, 날개 자체의 물리적 넓이가 땅의 넓이를 채운다는 어색한 표현이 됩니다. ‘그 날개를 펼친 것이 당신 땅의 온 너비를 가득 채울 것’이 자연스럽고 원문의 이미지도 보존합니다.
  terminology: ‘임마누엘아’는 고유명사의 호격을 적절히 보존하며, 각주의 뜻풀이도 자연스럽고 신학적으로 과도하게 해석하지 않습니다.
