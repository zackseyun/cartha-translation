  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
  footnotes:
  - marker: a
    text: Immanuel means 'God is with us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 유다로 밀려들어와 넘쳐흐르며 지나가고, 목까지 미칠 것입니다. 그 날개를 펼친 것이 임마누엘아, 당신 땅의 온 너비를 가득 채울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘임마누엘’은 ‘하나님이 우리와 함께 계시다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַף / שָׁטַף / וְעָבַר
  english_pob_choice: it will sweep on / it will overflow / and pass through
  chosen_korean: 쳐들어와 넘쳐흐르며 지나가고
  alternatives_korean:
  - 들어와
  - 휩쓸고 지나가며
  - 범람하며
  lexicon: HALOT
  rationale: 세 동사는 유다를 향한 홍수/침략의 연속 동작을 이루므로, 한국어에서도 단순 이동이 아니라 공격적이고 파괴적인 진행을 살려야 합니다.
- source_word: עַד צַוָּאר יַגִּיעַ
  english_pob_choice: it will reach up to the neck
  chosen_korean: 목까지 미칠 것입니다
  alternatives_korean:
  - 목에 이를 것입니다
  - 목까지 도달할 것입니다
  lexicon: HALOT
  rationale: ‘목까지’는 완전한 잠김 직전의 극단적 위협을 나타내는 관용을 살리며, ‘미치다’는 문맥의 진행성과 위급함을 자연스럽게 드러냅니다.
- source_word: מֻטּוֹת כְּנָפָיו
  english_pob_choice: the spread of its wings
  chosen_korean: 그 날개가 펼쳐진 넓이
  alternatives_korean:
  - 그 날개의 펼침
  - 그 날개들의 뻗음
  lexicon: HALOT
  rationale: ‘날개’ 이미지는 침략 세력의 확장 범위를 가리키므로, 본문이 요구하는 공간적 확장감을 살려 ‘펼쳐진 넓이’로 옮겼습니다.
- source_word: עִמָּנוּ אֵל
  english_pob_choice: O Immanuel
  chosen_korean: 임마누엘아
  alternatives_korean:
  - 오 임마누엘
  - 임마누엘이여
  lexicon: HALOT
  rationale: 본문에서는 고유명사이자 호격으로 기능하므로, 한국어에서도 직접 부름을 나타내는 ‘-아’를 붙여 이름-호칭의 성격을 유지했습니다.
theological_decisions:
- issue: עִמָּנוּ אֵל을 이름으로 읽을지, ‘하나님이 우리와 함께 계시다’는 문장으로 풀지
  chosen_reading: 본문에서는 ‘임마누엘아’로 이름-호칭을 유지하고, 뜻은 각주로 보완합니다.
  alternative_readings:
  - 하나님이 우리와 함께 계시다
  - 오 임마누엘
  rationale: 이 표현은 이미 7:14에서 인물/표지의 이름으로 제시되었으므로, 8:8에서는 새로 해석해 문장으로 풀기보다 본문의 호격과 문학적 연결을 보존하는 편이 적절합니다.
  doctrine_reference: 'Translation philosophy: Translate titles; transliterate names; preserve literary-theological linkage.'
