- from: 그리고 사람들이 여러분에게 “무당들과 점술가들, 곧 지저귀며 중얼거리는 자들에게 물어보라” 하고 말할 때, 백성이 자기 하나님께 묻지 않겠습니까? 살아 있는 자들을 위하여 죽은 자들에게 묻겠습니까?
  to: 그리고 사람들이 여러분에게 “영매들과 강신술사들, 곧 지저귀며 중얼거리는 자들에게 물어보십시오” 하고 말할 때, 백성이 자기 하나님께 묻지 않겠습니까? 살아 있는 자들을 위하여 죽은 자들에게 묻겠습니까?
  rationale: The revision narrows the two practitioner terms to spirit-mediating and spirit-consulting figures, reflecting the lexical and contextual force of אֹבוֹת and יִדְּעֹנִים more accurately than culturally localized or overly broad alternatives. It preserves the source’s ambiguity about the precise nature of the practitioners and retains the rhetorical repetition of ‘묻다.’
