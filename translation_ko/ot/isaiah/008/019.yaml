review_pass:
  verdict: revise
  source_fidelity: The rhetorical structure, repeated inquiry motif, and contrast between God and the dead are preserved well. However, ‘무당들’ and especially the broad ‘점술가들’ can evoke Korean shamanic practice and general divination rather than the specific mediumistic/necromantic practitioners denoted by אֹבוֹת and יִדְּעֹנִים. ‘영매들’ and ‘강신술사들’ more closely retain the source’s spirit-consultation setting without adding doctrinal claims.
  naturalness: The Korean is generally clear and natural. The revised terms remain idiomatic in modern formal Korean, and the quoted imperative is adjusted to fit the requested 합쇼체 register.
  terminology: ‘영매들’ appropriately represents mediums, while ‘강신술사들’ conveys practitioners of spirit consultation more specifically than generic ‘점술가들.’ ‘묻다’ consistently renders the repeated דרש effectively.
  issues:
  - severity: medium
    issue: ‘무당들과 점술가들’ is semantically and culturally broader than the paired Hebrew terms.
    rationale: The Hebrew pair concerns mediums/spirit-consultation practitioners in a necromantic context. ‘무당’ imports a particular Korean religious-cultural institution, and ‘점술가’ can include any diviner; together they weaken the specific contrast with ‘죽은 자들.’
  - severity: low
    issue: The direct quotation uses the plain imperative ‘물어보라’ despite the designated modern formal-polite register.
    rationale: A quoted command may naturally be plain style, but ‘물어보십시오’ consistently realizes the requested 합쇼체 without changing the reported speech’s sense.
  revised_text: 그리고 사람들이 여러분에게 “영매들과 강신술사들, 곧 지저귀며 중얼거리는 자들에게 물어보십시오” 하고 말할 때, 백성이 자기 하나님께 묻지 않겠습니까? 살아 있는 자들을 위하여 죽은 자들에게 묻겠습니까?
  revised_footnotes: []
  revision_rationale: The revision narrows the two practitioner terms to spirit-mediating and spirit-consulting figures, reflecting the lexical and contextual force of אֹבוֹת and יִדְּעֹנִים more accurately than culturally localized or overly broad alternatives. It preserves the source’s ambiguity about the precise nature of the practitioners and retains the rhetorical repetition of ‘묻다.’
