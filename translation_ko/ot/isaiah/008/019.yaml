id: ISA.8.19
reference: Isaiah 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
  footnotes:
  - marker: a
    text: Or “the ghosts” / “those with familiar spirits” for “the mediums.” The Hebrew term אֹבוֹת is traditionally rendered with older occult terminology, but here likely refers to necromantic practitioners rather than the spirits themselves.
    reason: lexical_alternative
  - marker: b
    text: Or “who peep and mutter.” The Hebrew imitates eerie, birdlike and murmuring sounds associated with spirit consultation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들이 여러분에게 “영매들과 강신술사들, 곧 지저귀며 중얼거리는 자들에게 물어보십시오” 하고 말할 때, 백성이 자기 하나님께 묻지 않겠습니까? 살아 있는 자들을 위하여 죽은 자들에게 묻겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי יֹאמְרוּ אֲלֵיכֶם
  english_pob_choice: And when they say to you
  chosen_korean: 그리고 사람들이 여러분에게 … 하고 말할 때
  alternatives_korean:
  - 그리고 그들이 여러분에게 … 하고 말하면
  - 만일 사람들이 여러분에게 … 하고 말할 때
  lexicon: HALOT
  rationale: 예상된 상황을 여는 ההבמשך 문맥을 자연스러운 한국어 조건/시간 표현으로 옮겼습니다. ‘사람들이’는 בלתי특정 복수를 살리고, 대화체의 직접성을 유지합니다.
- source_word: דִּרְשׁוּ אֶל הָאֹבוֹת וְאֶל הַיִּדְּעֹנִים
  english_pob_choice: Consult the mediums and the spiritists
  chosen_korean: 무당들과 점술가들
  alternatives_korean:
  - 영매들과 점쟁이들
  - 강신술사들과 점술가들
  lexicon: HALOT
  rationale: אֹבוֹת/יִדְּעֹנִים은 죽은 자와 교통하는 점복적 인물을 가리키므로, 현대 독자가 즉시 이해할 수 있는 표현을 택했습니다. 다만 한국어 교회 전통의 ‘신접한 자들’보다 본문의 금기적·점술적 성격이 분명한 ‘무당/점술가’가 더 직접적입니다.
- source_word: הַמְצַפְצְפִים וְהַמַּהְגִּים
  english_pob_choice: who chirp and mutter
  chosen_korean: 지저귀며 중얼거리는 자들
  alternatives_korean:
  - 짹짹거리며 중얼거리는 자들
  - 삑삑거리며 속삭이는 자들
  lexicon: HALOT
  rationale: 새소리 같은 얇은 소리와 낮은 웅얼거림을 함께 살리기 위해 ‘지저귀며 중얼거리는’으로 옮겼습니다. 이는 단순한 장식이 아니라, 영적 교섭의 기괴한 음향을 풍자하는 표현입니다.
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  english_pob_choice: should not a people consult its God?
  chosen_korean: 백성이 자기 하나님께 묻지 않겠습니까?
  alternatives_korean:
  - 백성이 자기 하나님을 찾지 않겠습니까?
  - 백성이 자기 하나님께 상담하지 않겠습니까?
  lexicon: HALOT
  rationale: 여기서 드רש은 단순한 ‘찾다’보다 신탁적/지침적 ‘묻다’가 한국어로 더 자연스럽고 문맥에 맞습니다. ‘자기 하나님’은 עַם의 집합명사와 단수 소유격의 결합을 살립니다.
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  english_pob_choice: on behalf of the living ... the dead
  chosen_korean: 살아 있는 자들을 위하여 죽은 자들에게
  alternatives_korean:
  - 살아 있는 자들을 대신하여 죽은 자들에게
  - 살아 있는 자들을 위해 죽은 자들을
  lexicon: HALOT
  rationale: בְּעַד는 ‘위하여/대신하여’의 뜻이 가능하지만, 여기서는 산 자의 유익을 위해 죽은 자에게 묻는다는 대조가 핵심이므로 ‘위하여’로 처리했습니다. 전치사 엘은 반복을 줄이되 ‘죽은 자들에게 묻겠습니까?’로 보완했습니다.
theological_decisions:
- issue: 어휘 선택이 한국 교회 전통어보다 낯설 수 있는가
  chosen_reading: ‘무당들, 점술가들’로 옮겨 본문의 금기적 점술 행위를 직접 드러냈습니다.
  alternative_readings:
  - ‘신접한 자들’
  - ‘강신술자들’
  rationale: 이 구절의 초점은 일반적인 종교 행위가 아니라 야훼 대신 죽은 자와 접촉하려는 불법적 수단입니다. 전통적 완곡어보다 원문의 논박 의도를 분명히 보이게 하는 것이 적절합니다.
  doctrine_reference: 이사야 8:19의 반점술/반강신 맥락
- issue: ‘묻다’와 ‘상담하다’ 중 어떤 한국어가 드רש의 수사를 가장 잘 살리는가
  chosen_reading: 반복되는 דרש를 한국어 ‘묻다’로 통일하되, 앞에서는 점술가들에게 묻는 행위, 뒤에서는 하나님께 묻는 행위의 대비를 살렸습니다.
  alternative_readings:
  - ‘상담하다’로 통일
  - ‘찾다’로 통일
  rationale: 본문은 동일 동사를 반복해 출처의 문제를 부각합니다. 한국어에서도 동일 동사군을 유지해야 질문의 방향이 하나님 vs. 죽은 자로 선명히 대비됩니다.
  doctrine_reference: 수사적 대비 보존 원칙
