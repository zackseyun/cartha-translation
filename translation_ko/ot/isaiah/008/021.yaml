  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
  footnotes:
  - marker: a
    text: Or 'look upward.' The Hebrew literally says 'turn upward,' likely describing the sufferer lifting his face toward heaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳을 곤고하고 굶주린 채 지나갈 것입니다[a]. 그가 굶주리면 격분하여 자기 왕과 자기 하나님을 저주하고 위쪽으로 돌아설 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위를 바라볼 것입니다.’ 히브리어는 문자적으로 ‘위쪽으로 돌아서다’라고 하며, 고통받는 사람이 하늘 쪽으로 얼굴을 들어 올리는 모습을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  english_pob_choice: And he will pass through it
  chosen_korean: 그는 그것을 지나갈 것입니다
  alternatives_korean:
  - 그는 그곳을 통과할 것입니다
  - 그는 그 안을 지나갈 것입니다
  lexicon: HALOT
  rationale: עבר + בָּהּ의 이동 이미지를 살려 ‘지나가다’로 옮겼고, 지시대명사 ‘it’은 문맥상 앞선 재앙/곤고를 가리키므로 자연스럽게 ‘그것’으로 처리했습니다.
- source_word: נִקְשֶׁה
  english_pob_choice: hard-pressed
  chosen_korean: 곤고하고
  alternatives_korean:
  - 압박받고
  - 심하게 눌려
  lexicon: HALOT
  rationale: 단순한 감정 상태보다 궁핍과 압박을 함께 드러내는 말로 ‘곤고하다’를 택해, POB의 ‘hard-pressed’가 가진 곤란한 처지를 압축적으로 살렸습니다.
- source_word: וְהִתְקַצַּף
  english_pob_choice: he will become enraged
  chosen_korean: 격분하여
  alternatives_korean:
  - 분노하여
  - 화가 나서
  lexicon: HALOT
  rationale: 히트파엘의 ‘분노 상태로 들어가다’는 뉘앙스를 반영하여, 단순한 ‘화나다’보다 강한 ‘격분하다’로 옮겼습니다.
- source_word: וּבֵאלֹהָיו
  english_pob_choice: and his God
  chosen_korean: 자기 하나님
  alternatives_korean:
  - 그의 하나님
  - 자기 신
  lexicon: HALOT
  rationale: 히브리어는 소유 대명사와 단수형 문맥이므로 ‘하나님’으로 두되, 원문의 소유 관계를 살리기 위해 ‘자기’를 보탰습니다.
theological_decisions:
- issue: וּפָנָה לְמָעְלָה의 종결 동작
  chosen_reading: ‘위를 향할 것입니다’로 옮겨, 몸의 방향 전환을 간단히 드러냈습니다.
  alternative_readings:
  - ‘위를 바라볼 것입니다’
  - ‘위를 향해 얼굴을 돌릴 것입니다’
  rationale: 히브리어는 단지 ‘위로 향하다’고 말하며, 본문은 절망 가운데 하늘 쪽으로 향하는 행위 자체를 강조합니다. 불필요한 해석적 요소를 덜어 원문 동작을 직접적으로 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
