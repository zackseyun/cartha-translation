revisions:
- from: 그는 그것을 지나갈 것입니다[a]. 그때 그는 곤고하고 배고플 것이며, 배고플 때마다 격분하여 자기 왕과 자기 하나님을 저주하고 위를 향할 것입니다.
  to: 그는 그곳을 곤고하고 굶주린 채 지나갈 것입니다[a]. 그가 굶주리면 격분하여 자기 왕과 자기 하나님을 저주하고 위쪽으로 돌아설 것입니다.
  rationale: 반복 의미를 첨가한 표현을 시간 조건으로 바로잡고, 통과의 장소를 자연스럽게 표현했으며, 마지막 동사의 방향 전환 의미를 보존했습니다. 각주는 본문의 동작 표현을 해석적인 ‘바라보다’와 구별하면서 가능한 함의를 절제하여 설명합니다.
  reviewer_model: gpt-5.6-terra
