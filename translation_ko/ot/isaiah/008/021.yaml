  - severity: low
    issue: ‘그것을 지나갈 것입니다’의 지시 대상 및 이동 표현이 어색함
    rationale: בָּהּ는 통과하는 장소를 나타냅니다. 문맥의 선행사를 과도하게 특정하지 않는 ‘그곳을 지나갈 것입니다’가 한국어로 더 자연스럽습니다.
  - severity: low
    issue: ‘위를 향할 것입니다’가 פָּנָה의 방향 전환 동작을 충분히 드러내지 못함
    rationale: פָּנָה는 ‘돌다, 방향을 돌리다’이며, ‘위쪽으로 돌아설 것입니다’는 얼굴을 명시적으로 보태지 않고도 그 동작을 보존합니다.
