revisions:
- from: 저는 야훼를 기다릴 것입니다. 그는 야곱의 집에서 얼굴을 가리고 계시지만, 저는 그분께 소망을 둘 것입니다.[a][b]
  to: 나는 야곱의 집에게서 자신의 얼굴을 숨기시는 야훼를 기다리겠으며, 그에게 소망을 두겠습니다.[a][b]
  rationale: 역접을 제거하여 원문의 단순 접속을 보존했고, ‘야곱의 집에게서’로 옮겨 하나님의 얼굴 숨김의 대상이 야곱의 집임을 분명히 했습니다. 분사의 지속적·특징적 의미는 수식절과 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:10Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘야곱의 집에서/에게서 얼굴을 숨기시는 야훼’를 수식절로 두고, 화자가 그분을 기다리며 그분에게 소망을 둔다고 말합니다. 초안의 ‘하지만’은 원문에 없는 역접을 더하며, ‘야곱의 집에서 얼굴을 가리고 계시지만’은 ‘야곱의 집 안에서’ 얼굴을 가린다는 장소적 의미로도 읽힐 수 있습니다.
  naturalness: ‘야곱의 집에게서 자신의 얼굴을 숨기시는’은 집단을 인격적으로 지칭하는 성서적 표현을 유지하면서도, ‘~에서’의 장소적 모호성을 피합니다. ‘기다리겠으며, ... 두겠습니다’는 현대 표준어 합쇼체에서 자연스럽고 원문의 접속을 보존합니다.
  terminology: ‘야훼’, ‘야곱의 집’, ‘소망을 두다’는 적절합니다. ‘얼굴을 숨기다’는 סתר의 기본 의미와 히브리어 관용구를 충실히 보존합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 역접 ‘하지만’이 들어가 있습니다.
    rationale: וְ는 여기서 화자의 두 행위를 연결하며, 하나님이 얼굴을 숨기시는 사실과 화자의 소망 사이의 긴장을 역접 접속사로 명시하지 않습니다.
  - severity: medium
    issue: ‘야곱의 집에서 얼굴을 가리고 계시다’가 장소 표현으로 오해될 수 있습니다.
    rationale: מִבֵּית יַעֲקֹב는 ‘야곱의 집으로부터/에게서’ 얼굴을 숨긴다는 뜻입니다. 한국어 ‘~에서’는 ‘그 집 안에서’라는 장소 의미를 강하게 가질 수 있습니다.
  revised_text: 나는 야곱의 집에게서 자신의 얼굴을 숨기시는 야훼를 기다리겠으며, 그에게 소망을 두겠습니다.[a][b]
