id: ISA.8.17
reference: Isaiah 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חִכִּ֨יתִי֙ לַ/יהוָ֔ה הַ/מַּסְתִּ֥יר פָּנָ֖י/ו מִ/בֵּ֣ית יַעֲקֹ֑ב וְ/קִוֵּ֖יתִֽי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
  footnotes:
  - marker: a
    text: Or 'who hides his face' or 'who has hidden his face.' The Hebrew participle may be understood as ongoing or characteristic action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of Jacob,' a corporate designation for Jacob's descendants, that is, Israel.
    reason: cultural_note
translation:
  language: ko
  text: 저는 야훼를 기다릴 것입니다. 그는 야곱의 집에서 얼굴을 가리고 계시지만, 저는 그분께 소망을 둘 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얼굴을 가리고 계시는 분’으로도 옮길 수 있습니다. 히브리어 분사는 계속적이거나 특징적인 동작으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야곱의 집’은 야곱의 자손, 곧 이스라엘을 가리키는 집단적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  english_pob_choice: And I will wait
  chosen_korean: 저는 …를 기다릴 것입니다
  alternatives_korean:
  - 저는 …를 기다리겠습니다
  - 저는 …를 고대할 것입니다
  lexicon: HALOT חכה
  rationale: 미래형의 신뢰 어린 기다림을 현대 한국어에서 가장 자연스럽게 살리되, 과도한 해석이 되는 ‘고대하다’는 피했습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC יהוה / POB doctrine default
  rationale: 본문이 여호와의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: הַמַּסְתִּיר פָּנָיו
  english_pob_choice: who is hiding his face
  chosen_korean: 얼굴을 가리고 계시지만
  alternatives_korean:
  - 얼굴을 숨기시는 분이지만
  - 얼굴을 가리시는 분이지만
  lexicon: HALOT סתר + פנים
  rationale: 히브리어 분사와 ‘얼굴’ 관용구를 직역에 가깝게 살려, 하나님의 언약적 거리두기라는 긴장을 완화하지 않았습니다.
- source_word: מִבֵּית יַעֲקֹב
  english_pob_choice: from the house of Jacob
  chosen_korean: 야곱의 집에서
  alternatives_korean:
  - 야곱 집에서
  - 야곱의 가문에서
  lexicon: Hebrew idiom / corporate designation
  rationale: ‘house of Jacob’의 집단적·언약적 표현을 유지하되, 한국어에서는 ‘야곱의 집’보다 자연스러운 ‘야곱의 집에서’로 옮겼습니다.
- source_word: וְקִוֵּיתִי לוֹ
  english_pob_choice: and I will hope in him
  chosen_korean: 그분께 소망을 둘 것입니다
  alternatives_korean:
  - 그분을 바랄 것입니다
  - 그분께 희망을 둘 것입니다
  lexicon: HALOT קוה
  rationale: ‘기다리다’와의 평행을 고려해, 단순 감정이 아니라 대상에게 기대를 두는 뜻을 한국어의 ‘소망을 두다’로 전달했습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로 전통 교회어인 ‘여호와’ 대신 학술적·출처 충실적 표기인 ‘야훼’를 사용했습니다.
  doctrine_reference: POB default rendering for YHWH
- issue: ‘얼굴을 가리심’의 관용구 보존
  chosen_reading: 하나님이 얼굴을 가리고 계신다는 표현을 그대로 유지
  alternative_readings:
  - 은혜를 거두고 계신다
  - 돌이키셨다
  rationale: 이 표현은 언약적 거리감과 심판의 긴장을 담으므로, 의미를 설명하는 식으로 풀지 않고 관용구를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
