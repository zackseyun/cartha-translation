  - ‘아빠’와 ‘엄마’를 말할 줄
  lexicon: HALOT
  rationale: 직역적 ‘부르다’보다 유아가 처음 내는 호칭의 행위를 자연스럽게 드러내면서도, 소유격 표현을 임의로 바꾸지 않았습니다.
