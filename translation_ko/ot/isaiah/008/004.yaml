  chosen_korean: 다메섹의 재물과 사마리아의 노략물
  alternatives_korean:
  - 다메섹의 부와 사마리아의 노략물
  - 다메섹의 재산과 사마리아의 약탈물
  lexicon: HALOT
  rationale: חֵיל은 여기서 군대보다 재물·자산의 의미가 자연스럽고, שְׁלַל은 전쟁 전리품을 가리키므로 ‘노략물’로 대응했습니다.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  english_pob_choice: before the king of Assyria
  chosen_korean: 앗수르 왕 앞에서
  alternatives_korean:
