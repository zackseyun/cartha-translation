  lexicon: HALOT
  rationale: לִפְנֵי의 위치·대면 의미를 현대 한국어의 ‘앞에서’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘the boy’의 지시 대상
  chosen_reading: 본문 표면에는 단지 ‘그 아이’만 두고, 주변 문맥이 시사하는 특정 인물명은 본문에 넣지 않았습니다.
  alternative_readings:
  - 이사야의 아들 마헬살랄하스바스
  - 더 넓은 표적 아동
  rationale: 히브리어 본문이 실제로는 일반 명사만 사용하므로, 해석을 본문에 앞서 주입하지 않고 문맥에서 읽히도록 남겨 두는 편이 더 투명합니다.
  doctrine_reference: 본문 우선 원칙과 해석/번역의 구분을 유지합니다.
