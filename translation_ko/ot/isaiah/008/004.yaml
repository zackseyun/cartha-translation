translation:
  language: ko
  text: 이는 그 아이가 ‘내 아버지’, ‘내 어머니’라고 부를 줄 알기 전에 다메섹의 재물과 사마리아의 노략물을 앗수르 왕 앞으로 가져갈 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 아버지’, ‘내 어머니’라고 ‘부르다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사마리아의 약탈물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단순히 ‘그 아이’라고 말하며, 문맥상 앞의 표적 아동을 가리키는 것으로 보입니다.
    reason: cross_reference
