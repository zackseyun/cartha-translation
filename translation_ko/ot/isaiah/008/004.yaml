  text: כִּ֗י בְּ/טֶ֨רֶם֙ יֵדַ֣ע הַ/נַּ֔עַר קְרֹ֖א אָבִ֣/י וְ/אִמִּ֑/י יִשָּׂ֣א אֶת חֵ֣יל דַּמֶּ֗שֶׂק וְ/אֵת֙ שְׁלַ֣ל שֹׁמְר֔וֹן לִ/פְנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
  footnotes:
  - marker: a
    text: Or 'to call, “My father” and “My mother.”'
    reason: lexical_alternative
  - marker: b
    text: Or 'the plunder of Samaria.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says simply 'the boy'; in context this likely refers to the child named in the surrounding passage.
    reason: cross_reference
translation:
  language: ko
  text: 이는 그 아이가 아버지와 어머니를 불러 말할 줄 알기도 전에 다메섹의 재물과 사마리아의 노략물이 앗수르 왕 앞에서 옮겨질 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘아버지’와 ‘어머니’를 부르다/부르짖다에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사마리아의 노략물’이라고 단수로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단순히 ‘그 아이’라고 말하며, 문맥상 앞의 표적 아동을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞선 표적 예언을 설명하는 원인·이유의 연결을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּטֶרֶם יֵדַע
  english_pob_choice: before the boy knows how
  chosen_korean: …하기 전에 … 알기도 전에
  alternatives_korean:
  - …을 알기 전에
  - …할 줄 알기 전에
  lexicon: HALOT
  rationale: 시간적 선행을 분명히 하면서 יֵדַע의 능력/숙달 뉘앙스를 한국어 관용으로 살렸습니다.
- source_word: קְרֹא אָבִי וְאִמִּי
  english_pob_choice: to cry, ‘My father’ and ‘My mother,’
  chosen_korean: 아버지와 어머니를 불러 말할 줄
  alternatives_korean:
  - ‘아버지’와 ‘어머니’를 부를 줄
  - ‘아빠’와 ‘엄마’를 말할 줄
  lexicon: HALOT
  rationale: 직역적 ‘부르다’보다 유아가 처음 내는 호칭의 행위를 자연스럽게 드러내면서도, 소유격 표현을 임의로 바꾸지 않았습니다.
- source_word: חֵיל דַּמֶּשֶׂק וְאֵת שְׁלַל שֹׁמְרוֹן
  english_pob_choice: the wealth of Damascus and the spoil of Samaria
  chosen_korean: 다메섹의 재물과 사마리아의 노략물
  alternatives_korean:
  - 다메섹의 부와 사마리아의 노략물
  - 다메섹의 재산과 사마리아의 약탈물
  lexicon: HALOT
  rationale: חֵיל은 여기서 군대보다 재물·자산의 의미가 자연스럽고, שְׁלַל은 전쟁 전리품을 가리키므로 ‘노략물’로 대응했습니다.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  english_pob_choice: before the king of Assyria
  chosen_korean: 앗수르 왕 앞에서
  alternatives_korean:
  - 앗수르 왕 앞에
  - 앗수르 왕의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 위치·대면 의미를 현대 한국어의 ‘앞에서’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘the boy’의 지시 대상
  chosen_reading: 본문 표면에는 단지 ‘그 아이’만 두고, 주변 문맥이 시사하는 특정 인물명은 본문에 넣지 않았습니다.
  alternative_readings:
  - 이사야의 아들 마헬살랄하스바스
  - 더 넓은 표적 아동
  rationale: 히브리어 본문이 실제로는 일반 명사만 사용하므로, 해석을 본문에 앞서 주입하지 않고 문맥에서 읽히도록 남겨 두는 편이 더 투명합니다.
  doctrine_reference: 본문 우선 원칙과 해석/번역의 구분을 유지합니다.
