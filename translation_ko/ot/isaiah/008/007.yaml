id: ISA.8.7
reference: Isaiah 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
  footnotes:
  - marker: a
    text: '''The River'' likely refers to the Euphrates, the great river associated with Assyria.'
    reason: cultural_note
  - marker: b
    text: Or 'strong and abundant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 보십시오, 주님은 강력하고 많은 강물, 곧 아시리아 왕과 그의 모든 영광[b]을 그들 위로 끌어올리고 계십니다. 그것은 그 모든 물길 위로 넘쳐 올라가고 그 모든 언덕을 넘어갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강’은 유브라데강을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘강하고 풍부한’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 나타내는 접속사이므로, 현대 한국어에서 자연스럽고 형식적인 ‘그러므로’로 인과·결론의 힘을 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 주의 환기 표현을 합쇼체로 옮겨, 고어적인 ‘보라’보다 현대적이면서도 강한 지시성을 유지했습니다.
- source_word: מֵי הַנָּהָר הָעֲצוּמִים וְהָרַבִּים
  english_pob_choice: the waters of the River, mighty and many
  chosen_korean: 강력하고 많은 강물
  alternatives_korean:
  - 세차고 많은 강물
  - 힘세고 많은 강물
  - 강하고 넘치는 강물
  lexicon: HALOT
  rationale: 히브리어 형용사 두 개를 분리해 ‘강력하고 많은’으로 옮겨 홍수 이미지의 힘과 양을 함께 드러냈습니다.
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדֹו
  english_pob_choice: the king of Assyria and all his glory
  chosen_korean: 아시리아 왕과 그의 모든 영광
  alternatives_korean:
  - 아시리아 왕과 그의 모든 화려함
  - 아시리아 왕과 그의 모든 위광
  - 아시리아 왕과 그의 모든 권세
  lexicon: HALOT
  rationale: כבוד를 여기서는 단순한 장식보다 왕의 위세·위광·권세를 포괄하는 표현으로 보아, 본문이 설명하는 동격 관계를 살려 ‘모든 영광’으로 옮겼습니다.
- source_word: וְעָלָה עַל כָּל אֲפִיקָיו וְהָלַךְ עַל כָּל גְּדוֹתָיו
  english_pob_choice: It will rise over all its channels and go over all its banks
  chosen_korean: 그것은 그 모든 물길 위로 넘쳐 올라가고 그 모든 언덕을 넘어갈 것입니다
  alternatives_korean:
  - 그것은 그 모든 수로 위로 올라가고 그 모든 둑을 넘을 것입니다
  - 그것은 그 모든 물길을 넘고 그 모든 둑을 넘칠 것입니다
  lexicon: HALOT
  rationale: 홍수의 흐름을 한국어로 자연스럽게 재현하기 위해 ‘물길’과 ‘넘쳐 올라가다’를 사용했고, גְּדוֹתָיו는 강둑의 이미지를 살리되 문맥상 ‘언덕’으로 오독되지 않도록 조정했습니다.
theological_decisions:
- issue: ‘강물’ 이미지가 가리키는 대상
  chosen_reading: 본문의 강물 이미지는 아시리아 왕과 그의 제국적 영광을 가리키는 비유로 유지했습니다.
  alternative_readings:
  - 단순히 실제 강의 범람으로만 읽는 번역
  - 비유를 약화시켜 해석을 최소화하는 번역
  rationale: 히브리어 본문 자체가 ‘강물’과 ‘아시리아 왕과 그의 모든 영광’을 동격으로 설명하므로, 심판의 도구로서의 제국 권세라는 의미를 번역 속에서 드러내는 것이 본문에 충실합니다.
  doctrine_reference: 예언 본문의 상징적 심판 언어
- issue: 주어 표기와 신적 행위
  chosen_reading: ‘주님은 … 끌어올리고 계십니다’로 현재 진행형을 사용해 하나님의 सक्रिय한 심판 행위를 드러냈습니다.
  alternative_readings:
  - ‘주님이 … 끌어올리십니다’의 단순 현재
  - 완료나 미래로만 처리하는 번역
  rationale: 히브리어 분사형이 임박한 현재적 진행을 나타내므로, 하나님의 주권적 작용을 살아 있는 행위로 보존했습니다.
  doctrine_reference: 하나님의 섭리와 심판
