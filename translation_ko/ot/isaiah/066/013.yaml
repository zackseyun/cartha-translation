  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
  footnotes:
  - marker: a
    text: Or, 'As one whom his mother comforts.' The Hebrew reads 'man' (אִישׁ), using masculine representative language.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 자기 어머니에게 위로를 받듯이, 내가 너희를 위로할 것이며, 예루살렘에서 너희는 위로를 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 대표적 남성 명사 ‘אִישׁ(사람/남자)’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאִישׁ
  english_pob_choice: As a man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 한 남자가
  - 사람이
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 남성 단수 대표 용법을 한국어에서는 자연스럽게 풀어 옮기되, 의미상 일반적 비교를 살려 ‘한 사람이’로 처리했습니다.
- source_word: תְּנַחֲמֶנּוּ / אֲנַחֶמְכֶם
  english_pob_choice: comforts / will comfort you
  chosen_korean: 위로를 받듯이 / 위로할 것이며 / 위로를 받을 것입니다
  alternatives_korean:
  - 위로하듯이 / 위로하겠습니다 / 위로를 받을 것입니다
  - 달래듯이 / 달래 주겠습니다 / 달래움을 받을 것입니다
  lexicon: HALOT
  rationale: נחם의 반복을 살려 같은 어근을 일관되게 ‘위로하다/위로를 받다’로 옮겼습니다.
- source_word: וּבִירוּשָׁלַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘 가운데서
  lexicon: HALOT
  rationale: 전치사 ב의 장소 의미를 가장 자연스럽게 드러내는 현대 한국어 표현입니다.
theological_decisions:
- issue: 위로의 약속이 시온/예루살렘과 연결되는 방식
  chosen_reading: 예루살렘에서 너희는 위로를 받을 것입니다
  alternative_readings:
  - 예루살렘에서 너희가 위로를 얻을 것입니다
  - 예루살렘에서 너희는 위로받게 될 것입니다
  rationale: 히브리어 수동형의 수혜성을 살려, 단순한 감정적 위안이 아니라 하나님이 예루살렘을 매개로 베푸시는 실제적 위로로 표현했습니다.
  doctrine_reference: 이사야 66장 문맥의 시온 회복 약속
