id: ISA.66.11
reference: Isaiah 66:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֤עַן תִּֽינְקוּ֙ וּ/שְׂבַעְתֶּ֔ם מִ/שֹּׁ֖ד תַּנְחֻמֶ֑י/הָ לְמַ֧עַן תָּמֹ֛צּוּ וְ/הִתְעַנַּגְתֶּ֖ם מִ/זִּ֥יז כְּבוֹדָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/011.yaml
  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
  footnotes:
  - marker: a
    text: Or 'from the breast of her consolations'; the Hebrew is more literally 'from the breast of her comforts/consolations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'draw out' or 'suck out'; the Hebrew verb is vivid and continues the nursing imagery.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew noun rendered 'abundance' may also be understood as 'fullness' or 'overflow.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 젖을 빨아 배부르고, 그녀의 위로의 젖가슴에서 만족하며, 너희가 깊이 마셔 그녀의 영광의 풍성함으로 인해 즐거워하게 하려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 위로들/위안들의 젖가슴에서’로도 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘그녀의 위로들/위안들의 젖가슴’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘빨아내다’, ‘짤아내다’의 뜻일 수 있습니다. 히브리어 동사는 생생한 수유 이미지를 계속 이어 갑니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 명사는 ‘풍성함’, ‘충만’, ‘넘침’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּינְקוּ
  english_pob_choice: you may nurse
  chosen_korean: 젖을 빨아
  alternatives_korean:
  - 젖먹어
  - 수유하며
  lexicon: HALOT
  rationale: ינק는 문자적으로 ‘빨다/젖먹다’의 뜻이므로, 한국어에서는 직접적인 신체 이미지를 살린 ‘젖을 빨아’가 원문의 육체적·모성적 그림을 가장 분명하게 전달합니다.
- source_word: וּשְׂבַעְתֶּם
  english_pob_choice: and be satisfied
  chosen_korean: 배부르고
  alternatives_korean:
  - 만족하고
  - 충족되어
  lexicon: HALOT
  rationale: שבע는 포만과 충족을 가리키므로, 먹이고 젖먹이는 문맥에서는 ‘배부르고’가 가장 자연스럽고 즉각적인 결과 상태를 나타냅니다.
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  english_pob_choice: from her comforting breast
  chosen_korean: 그녀의 위로의 젖가슴에서
  alternatives_korean:
  - 그녀의 위로의 젖에서
  - 그녀의 위로의 가슴에서
  lexicon: HALOT
  rationale: שׁד는 수유 맥락의 ‘젖가슴/유방’이므로 완곡화하지 않고 ‘젖가슴’으로 살렸고, תַּנְחֻמֶיהָ는 단순한 감정이 아니라 ‘위로의’라는 형용적 관계로 옮겼습니다.
- source_word: מִזִּיז כְּבוֹדָהּ
  english_pob_choice: from the abundance of her glory
  chosen_korean: 그녀의 영광의 풍성함으로 인해
  alternatives_korean:
  - 그녀의 영광의 넘침으로
  - 그녀의 영광의 풍부함으로
  lexicon: HALOT
  rationale: זִיז는 희귀어로 ‘풍성함/넘침/충만’의 의미 범위가 있어, POB의 ‘abundance’에 맞추되 한국어에서는 문맥상 자연한 ‘풍성함’으로 옮겼습니다. כבוד는 이사야 문맥의 신학적 용례를 따라 ‘영광’으로 유지했습니다.
theological_decisions:
- issue: 예루살렘의 모성적 의인화 유지
  chosen_reading: 예루살렘/시온이 자녀를 먹이고 위로하는 어머니로 묘사된 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 추상화하여 단순한 위로의 비유로 처리
  - 완곡하게 표현하여 모유 수유 이미지를 약화
  rationale: 본문은 위로를 추상적으로 말하기보다 실제 수유와 포만의 이미지를 통해 회복과 풍요를 그리므로, 그 긴장을 완화하지 않고 직설적으로 유지하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
