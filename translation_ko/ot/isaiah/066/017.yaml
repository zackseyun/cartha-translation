review_pass:
  verdict: revise
  source_fidelity: 원문의 재귀적 제의 준비, 동산으로의 이동, 난해한 ‘한 사람을 따라/그 가운데에서’ 구절, 부정한 음식 목록, 그리고 집단적 종말 선언을 대체로 잘 반영했습니다. 다만 ‘들어가려 하고’는 원문에 없는 의도·시도 의미를 더하며, ‘그 가운데 있는 한 사람’은 ‘가운데’가 ‘한 사람’을 수식한다고 확정합니다. 또한 쥐에는 원문상 ‘살’을 보태지 않는 편이 더 정확합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 예언 선언의 격식을 유지합니다. ‘끝장날 것입니다’는 다소 구어적이고 원문의 포괄적인 ‘끝나다/사라지다’보다 강하게 특정될 수 있어 ‘멸망할 것입니다’로 정리했습니다.
  terminology: ‘거룩하게 하고’, ‘정결하게 하여’, ‘동산’, ‘야훼’는 적절합니다. שׁקץ는 문맥상 ‘혐오스러운 것들’로 유지할 수 있습니다. עכבר는 ‘쥐’로 옮겨 음식 목록 안에서 동사 ‘먹는’에 직접 연결했습니다.
  issues:
  - severity: medium
    issue: ‘동산들로 들어가려 하고’가 원문에 없는 의도·시도 의미를 첨가합니다.
    rationale: אֶל הַגַּנּוֹת은 동산들을 향한 이동을 나타내며, 영어 감사본도 ‘to go into’를 보충하지만 ‘하려 하고’까지는 요구하지 않습니다.
  - severity: medium
    issue: ‘그 가운데 있는 한 사람’이 난해한 구절의 문법적 관계를 확정합니다.
    rationale: אַחַר אחד בַּתָּוֶךְ에서 ‘그 가운데’가 ‘한 사람’을 수식하는지, 동작·의식의 장소를 나타내는지는 확정하기 어렵습니다. 본문에서는 이를 덜 확정적으로 두고 각주에서 가능성을 제시해야 합니다.
  - severity: low
    issue: ‘쥐의 살’은 원문에 없는 ‘살’을 명시합니다.
    rationale: ‘살’은 돼지에만 명시되어 있고, 쥐는 먹는 대상 목록에 병렬됩니다. 한국어에서는 ‘쥐를 먹는’으로 충분히 자연스럽고 더 가깝습니다.
  - severity: low
    issue: ‘끝장날 것입니다’는 다소 구어적이며 표현 강도가 과도하게 특정될 수 있습니다.
    rationale: יספו는 함께 끝나거나 멸망한다는 심판의 결과를 말합니다. ‘멸망할 것입니다’는 예언문 격식과 심판 문맥을 살리면서도 속어적 어감을 피합니다.
  revised_text: 스스로를 거룩하게 하고 정결하게 하여 동산들로 들어가며, 가운데에서 한 사람을 따라가고 돼지고기와 혐오스러운 것들과 쥐를 먹는 자들은 함께 멸망할 것입니다. 야훼의 선언입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어의 ‘한 사람을 따라, 그 가운데에서’라는 구절은 난해합니다. 제의적 지도자를 따른다는 뜻, 중심으로 들어간다는 뜻, 또는 제의에서 차례로 진행한다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  revision_rationale: 원문의 이동 표현에서 의도·시도라는 추가 의미를 제거하고, 난해한 제의적 구절의 통사적 모호성을 본문과 각주에서 보존했습니다. 음식 목록은 원문의 병렬 구조에 맞추었고, 종말 선언은 현대 합쇼체의 예언문 격식에 맞게 다듬었습니다.
