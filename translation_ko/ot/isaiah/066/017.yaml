id: ISA.66.17
reference: Isaiah 66:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''following one in the midst.'' The phrase is difficult; it may refer to following a ritual leader, following one into the center, or proceeding one after another in a cultic rite.'
    reason: alternative_reading
translation:
  language: ko
  text: 스스로 거룩하게 하며 스스로 정결하게 하여 동산들로 들어가려 하고[a] 그 가운데 있는 한 사람을 따라가며 돼지고기와 혐오스러운 것들과 쥐의 살을 먹는 자들은 모두 함께 끝장날 것입니다. 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 가운데 있는 한 사람을 따라가며’로 직역되지만, 제의적 지도자·중심 대상·차례대로 진행하는 의식 등 여러 이해가 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  english_pob_choice: those who sanctify themselves
  chosen_korean: 스스로 거룩하게 하며
  alternatives_korean:
  - 스스로 성별하며
  - 자기 자신을 거룩하게 하며
  lexicon: HALOT
  rationale: 히트파엘 분사는 반사적 행위를 나타내므로 ‘스스로’로 그 반사성을 살렸고, קדש의 기본 의미는 ‘거룩하게 하다’로 유지했습니다.
- source_word: וְהַמִּטַּהֲרִים
  english_pob_choice: and purify themselves
  chosen_korean: 스스로 정결하게 하여
  alternatives_korean:
  - 스스로 깨끗하게 하여
  - 자기를 정결하게 하며
  lexicon: HALOT
  rationale: 제의적 정결의 맥락이므로 ‘정결하게 하다’를 택했고, 앞 구절과 평행을 이루도록 ‘스스로’와 연결했습니다.
- source_word: אֶל הַגַּנּוֹת
  english_pob_choice: to go into the gardens
  chosen_korean: 동산들로 들어가려 하고
  alternatives_korean:
  - 동산들로 가려고 하고
  - 정원들로 들어가려 하고
  lexicon: HALOT
  rationale: אֶל의 이동 방향을 살리되, POB의 제의적/우상숭배적 맥락을 보존하기 위해 ‘들어가다’를 사용했습니다.
- source_word: אַחַר אחד בַּתָּוֶךְ
  english_pob_choice: following one in the midst
  chosen_korean: 그 가운데 있는 한 사람을 따라가며
  alternatives_korean:
  - 그 가운데 하나를 따라가며
  - 가운데 있는 한 사람 뒤를 따라가며
  lexicon: HALOT
  rationale: 히브리어 구절이 난해하므로 POB의 해석 긴장을 유지하면서도 한국어에서는 최소한의 통사적 명료성을 확보했습니다.
- source_word: בְּשַׂר הַחֲזִיר
  english_pob_choice: the flesh of pigs
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지의 살
  - 돼지의 고기
  lexicon: HALOT
  rationale: ‘살’의 직역도 가능하지만 한국어에서는 ‘돼지고기’가 가장 자연스러워 의미를 분명히 했습니다.
- source_word: הַשֶּׁקֶץ
  english_pob_choice: detestable things
  chosen_korean: 혐오스러운 것들
  alternatives_korean:
  - 가증한 것들
  - 더러운 것들
  lexicon: HALOT
  rationale: שׁקץ의 강한 혐오/혐오감의 뉘앙스를 현대 한국어의 ‘혐오스러운’으로 옮겼습니다.
- source_word: הָעַכְבָּר
  english_pob_choice: mice
  chosen_korean: 쥐의 살
  alternatives_korean:
  - 쥐들
  - 쥐고기
  lexicon: HALOT
  rationale: 절의 식용 목록임이 분명하므로 단순 생물명보다 ‘쥐의 살’로 옮겨 음식으로 먹는 행위를 드러냈습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 모두 함께
  alternatives_korean:
  - 함께
  - 일제히
  lexicon: HALOT
  rationale: 집단적 운명을 강조하는 부사이므로 ‘모두 함께’로 집합성과 전면성을 드러냈습니다.
- source_word: יַסֻפוּ
  english_pob_choice: shall come to an end
  chosen_korean: 끝장날 것입니다
  alternatives_korean:
  - 끝날 것입니다
  - 멸망할 것입니다
  lexicon: HALOT
  rationale: סוף의 ‘끝나다/사라지다’ 의미를 살리되, 심판 맥락의 파국성을 한국어로 강하게 전달했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀이시다
  lexicon: HALOT
  rationale: POB의 신명 표기를 따라 ‘야훼’를 유지했고, 예언문 공식은 직설적이고 무게감 있게 ‘선언입니다’로 처리했습니다.
theological_decisions:
- issue: 예언자적 결말의 강도
  chosen_reading: ‘끝장날 것입니다’로 집단 심판의 확정성과 파국성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘끝날 것입니다’
  - ‘멸망할 것입니다’
  rationale: 본문은 단순 종료가 아니라 야훼의 심판 선언이므로, 의미를 약화시키지 않는 범위에서 강한 파국 어휘를 선택했습니다.
  doctrine_reference: 이사야 66장의 심판-정화 주제
- issue: 이름 표기 יְהוָה
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 테트라그라마톤을 직접 사용하므로, POB 원칙에 따라 고유 신명인 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
