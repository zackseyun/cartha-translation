revisions:
- from: 그래서 나도 그들에게 가혹한 대우를 택하며, 그들이 두려워하는 것을 그들에게 가져다주겠습니다. 이는 내가 불렀으나 아무도 대답하지 않았고, 내가 말했으나 그들이 듣지 않았으며, 그들이 내 눈에 악한 일을 행하고 내가 기뻐하지 않는 것을 택하였기 때문입니다.[a][b]
  to: 그러므로 나도 그들에게 가혹한 대우[a]를 택하고, 그들이 두려워하는 것[b]을 그들에게 닥치게 하겠습니다. 이는 내가 불렀으나 아무도 대답하지 않았고, 내가 말했으나 그들이 듣지 않았으며, 그들이 내 눈에 악한 일을 행하고 내가 기뻐하지 않는 것을 택하였기 때문입니다.
  rationale: 미래적 심판 동사의 병렬을 바로잡고, 각주 표지를 해당 어휘에 연결했습니다. 난해한 תַעֲלֻלֵיהֶם에 관한 각주는 본문의 불확실성을 유지하되, 원문이 명시하지 않는 가학적 동기를 부가하지 않도록 조정했습니다. ‘그러므로 나도’는 앞 문맥과의 대응적·응보적 연결을 자연스럽게 드러내며, 두 차례의 ‘택하다’는 히브리어의 의도적 대조를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:09Z'
