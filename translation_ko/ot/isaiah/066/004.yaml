source:
  edition: WLC
  text: גַּם אֲנִ֞י אֶבְחַ֣ר בְּ/תַעֲלֻלֵי/הֶ֗ם וּ/מְגֽוּרֹתָ/ם֙ אָבִ֣יא לָ/הֶ֔ם יַ֤עַן קָרָ֨אתִי֙ וְ/אֵ֣ין עוֹנֶ֔ה דִּבַּ֖רְתִּי וְ/לֹ֣א שָׁמֵ֑עוּ וַ/יַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בָּחָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
  footnotes:
  - marker: a
    text: Or 'mockeries,' 'delusions,' or 'abusive dealings' for 'harsh treatment' (Heb. תַעֲלֻלֵיהֶם). The Hebrew term is difficult and may denote severe or mocking treatment as judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'what they dread' for 'their fears.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나도 그들에게 가혹한 대우[a]를 택하고, 그들이 두려워하는 것[b]을 그들에게 닥치게 하겠습니다. 이는 내가 불렀으나 아무도 대답하지 않았고, 내가 말했으나 그들이 듣지 않았으며, 그들이 내 눈에 악한 일을 행하고 내가 기뻐하지 않는 것을 택하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가혹한 대우’는 히브리어 תַעֲלֻלֵיהֶם의 난해함을 반영한 번역입니다. 이 말은 조롱, 기만, 혹독한 처우, 또는 심판으로서의 가혹한 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들이 두려워하는 것’은 히브리어 מְגוּרֹתָם이 ‘두려움’ 자체 또는 ‘두려워하는 대상’을 뜻할 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  english_pob_choice: So I also
  chosen_korean: 그래서 나도
  alternatives_korean:
  - 나도
  - 나 역시
  lexicon: HALOT
  rationale: 대응의 응보를 드러내는 גַּם + 독립대명사는 단순한 동시성이 아니라 ‘그들이 택했으므로 나도 택한다’는 맞대응을 보이므로, ‘그래서 나도’가 가장 자연스럽고 힘 있게 그 관계를 살립니다.
- source_word: בְּתַעֲלֻלֵיהֶם
  english_pob_choice: harsh treatment
  chosen_korean: 가혹한 대우
  alternatives_korean:
  - 조롱
  - 기만
  - 혹독한 처우
  - 가학적인 대우
  lexicon: HALOT
  rationale: 이 קשה한 어휘는 문맥상 하나님이 그들의 죄를 택하신다는 뜻이 아니라 심판으로서의 혹독한 처우를 가리키므로, ‘가혹한 대우’가 판단적 의미를 한국어로 무리 없이 전달합니다.
- source_word: וּמְגוּרֹתָם
  english_pob_choice: their fears
  chosen_korean: 그들이 두려워하는 것
  alternatives_korean:
  - 그들의 두려움
  - 그들의 공포
  - 그들이 무서워하는 것
  lexicon: HALOT
  rationale: מְגוּרָה는 두려움 자체이기도 하고 두려워하는 대상이기도 하므로, 뒤의 ‘가져다주겠습니다’와 결합될 때 ‘그들이 두려워하는 것’이 의미를 가장 분명하게 드러냅니다.
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  english_pob_choice: I spoke and they did not listen
  chosen_korean: 내가 말했으나 그들이 듣지 않았으며
  alternatives_korean:
  - 내가 말했으나 그들이 듣지 않았고
  - 내가 말했으나 그들이 귀 기울이지 않았으며
  lexicon: HALOT
  rationale: שׁמע는 단순 청각보다 ‘듣고 따르다’의 반응을 포함하므로, ‘듣지 않았습니다’가 무반응보다 불순종의 뉘앙스를 더 잘 보존합니다.
theological_decisions:
- issue: 하나님의 ‘선택’의 성격
  chosen_reading: 하나님이 그들의 악을 택하신다는 뜻이 아니라, 그들의 거부에 상응하는 심판을 택하신다는 의미로 옮겼습니다.
  alternative_readings:
  - 그들의 왜곡된 행위를 하나님이 그대로 택하신다는 읽기
  - 그들을 넘겨주시는 사법적 방임으로 보는 읽기
  rationale: 문맥은 ‘불렀으나 대답하지 않음’과 ‘말했으나 듣지 않음’에 대한 응보를 말하며, 이어지는 ‘두려워하는 것을 가져다주겠습니다’가 심판의 성격을 분명히 하므로, 신학적 긴장을 지우지 않되 악의 기원을 하나님께 돌리지 않는 번역이 적절합니다.
  doctrine_reference: 번역 원칙 §3 — 해소하지 말고 본문의 긴장을 보존한다
