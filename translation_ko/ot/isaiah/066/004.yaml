  source_fidelity: 히브리어의 대응적 강조(גַּם אֲנִי), 두 번의 ‘선택’의 의도적 대조, 심판의 원인, 그리고 מְגוּרֹתָם의 ‘두려움/두려워하는 대상’의 모호성을 전반적으로 잘 반영합니다. 다만 אֶבְחַר와 אָבִיא는 모두 미래 지향의 미완료형이므로 ‘택하며’는 뒤의 미래형과 시제가 어긋납니다. 이를 ‘택하고 … 닥치게 하겠습니다’로 고쳐야 합니다.
  naturalness: ‘택하며’와 ‘가져다주겠습니다’의 결합은 문법적으로 가능하더라도 시제와 병렬성이 부자연스럽습니다. 또한 각주 표지는 해당 낱말 바로 뒤에 두는 편이 독자가 주석 대상을 명확히 파악하게 합니다. ‘그들에게 닥치게 하겠습니다’는 심판 문맥에서 אָבִיא לָהֶם의 자연스러운 한국어 표현입니다.
  terminology: ‘가혹한 대우’는 난해한 תַעֲלֻלֵיהֶם에 대한 신중한 본문 번역으로 유지할 수 있습니다. 다만 각주의 ‘가학적 대우’는 본문이 확정하지 않는 의도적 가학성을 암시하므로 삭제하는 것이 안전합니다. ‘내 눈에 악한 일’은 히브리어의 관용적 평가 표현을 보존합니다.
