  rationale: 원문에 직접 מופיע한 신명기를 한국어 본문에서도 고유명사로 보존해, 익숙한 대치어보다 원천 텍스트의 식별성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
