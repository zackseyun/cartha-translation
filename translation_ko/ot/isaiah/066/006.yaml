id: ISA.66.6
reference: Isaiah 66:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
  footnotes:
  - marker: a
    text: Or 'voice' or 'noise' for each occurrence of 'sound'; the Hebrew repeats the same word three times for rhetorical effect.
    reason: lexical_alternative
  - marker: b
    text: Or 'tumult' or 'roar' for 'uproar.'
    reason: lexical_alternative
  - marker: c
    text: '''Temple'' renders Hebrew heikhal, which can also mean ''palace'' in some contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성읍에서 울려오는 소리, 성전에서 울려오는 소리, 야훼께서 그의 원수들에게 보응하시는 소리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울려오는 소리’는 히브리어 קוֹל의 반복을 살린 번역입니다. 세 번 반복되는 같은 단어가 수사적 효과를 냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 히브리어 הֵיכָל의 일반적 가능성 가운데 이 문맥에서 가장 알맞은 번역입니다. 일부 문맥에서는 ‘궁전’ 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל שָׁאוֹן
  english_pob_choice: A sound of uproar
  chosen_korean: 울려오는 소리
  alternatives_korean:
  - 요란한 소리
  - 소란의 소리
  - 울부짖는 소리
  lexicon: HALOT
  rationale: קוֹל의 반복과 יחד 함께 쓰인 שָׁאוֹן은 단순한 음성보다 시끄럽게 울리는 소리를 가리키므로, ‘울려오는 소리’로 잡아 반복된 청각적 효과를 살렸습니다.
- source_word: מֵעִיר
  english_pob_choice: from the city
  chosen_korean: 성읍에서
  alternatives_korean:
  - 도시에서
  - 성에서
  lexicon: HALOT
  rationale: 문맥상 예루살렘을 가리키는 것으로 보이며, 한국어에서는 지리적 출처를 자연스럽게 드러내는 ‘성읍에서’가 적절합니다.
- source_word: מֵהֵיכָל
  english_pob_choice: from the temple
  chosen_korean: 성전에서
  alternatives_korean:
  - 궁전에서
  - 궁궐에서
  - 성소에서
  lexicon: HALOT
  rationale: הֵיכָל은 문맥에 따라 궁전이나 성전을 뜻할 수 있지만, 시온과 심판 문맥 및 앞의 ‘성읍’과의 평행을 따라 ‘성전’으로 옮기는 것이 가장 분명합니다.
- source_word: מְשַׁלֵּם גְּמוּל
  english_pob_choice: repaying recompense
  chosen_korean: 보응하시는
  alternatives_korean:
  - 갚으시는
  - 되갚으시는
  - 응징하시는
  lexicon: HALOT
  rationale: מְשַׁלֵּם과 גְּמוּל의 결합은 단순한 지불이 아니라 마땅한 보응을 뜻하므로, ‘보응하시는’이 공식적이고 본문의 재판적 어조를 잘 드러냅니다.
- source_word: לְאֹיְבָיו
  english_pob_choice: to his enemies
  chosen_korean: 그의 원수들에게
  alternatives_korean:
  - 그의 적들에게
  - 원수들 위에
  lexicon: HALOT
  rationale: ל가 보응의 대상/수혜 방향을 표시하므로 ‘~에게’ 구조가 자연스럽고, ‘원수들’은 אויבים의 적대성을 직접적으로 나타냅니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
