- from: 내 손이 이 모든 것을 만들었고, 이 모든 것이 그렇게 생겨났습니다. 야훼께서 말씀하십니다. 그러나 내가 주목할 사람은 이 사람입니다. 곧 심령이 가난하고 통회하며, 내 말을 떨며 받는 사람입니다.[a]
  to: 내 손이 이 모든 것을 만들었으므로 이 모든 것이 생겨났다. 야훼의 말씀이다. 그러나 내가 주목할 사람은 가난하고 영이 상한[a] 사람이며 내 말에 떠는 사람이다.
  rationale: 창조 행위와 그 결과로 존재하게 됨을 각각 보존했습니다. 하나님의 호의 어린 시선을 가리키는 ‘주목하다’는 해석을 과도하게 확장하지 않으면서 한국어로 자연스럽습니다. ‘가난하고 영이 상한’ 및 ‘내 말에 떠는’은 원문의 병렬적 인물 묘사와 의미 범위를 보존합니다.
