id: ISA.66.2
reference: Isaiah 66:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
  footnotes:
  - marker: a
    text: Or 'the afflicted and broken in spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 손이 이 모든 것을 만들었으므로 이 모든 것이 생겨났다. 야훼의 말씀이다. 그러나 내가 주목할 사람은 가난하고 영이 상한[a] 사람이며 내 말에 떠는 사람이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘억압받고 영이 상한 사람’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  english_pob_choice: My hand made
  chosen_korean: 내 손이 만들었습니다
  alternatives_korean:
  - 내 손이 지었습니다
  - 내 손이 빚었습니다
  lexicon: HALOT
  rationale: 히브리어의 신체-의인화 표현을 그대로 살려 창조 행위를 하나님의 손에 돌렸습니다. '만들다'는 현대 한국어에서 가장 자연스럽고 직접적인 대응입니다.
- source_word: וַיִּהְיוּ
  english_pob_choice: came to be
  chosen_korean: 그렇게 생겨났습니다
  alternatives_korean:
  - 그렇게 되었습니다
  - 존재하게 되었습니다
  - 생겨났습니다
  lexicon: HALOT
  rationale: 단순한 '있었다'보다 결과적 존재의 생김을 드러내며, 앞절의 창조 행위로 말미암아 이 모든 것이 존재하게 되었음을 살립니다.
- source_word: עָנִי וּנְכֵה רוּחַ
  english_pob_choice: the poor and contrite in spirit
  chosen_korean: 심령이 가난하고 통회하며
  alternatives_korean:
  - 가난하고 마음이 상한
  - 가난하고 영이 꺾인
  - 가난하고 겸손한
  lexicon: HALOT
  rationale: עָנִי와 נְכֵה רוּחַ를 한국어의 익숙한 성경 어법과 오늘의 문체 사이에서 함께 살렸습니다. '통회하며'는 단순 감정이 아니라 꺾이고 낮아진 내적 상태를 드러냅니다.
- source_word: חָרֵד עַל דְּבָרִי
  english_pob_choice: the one who trembles at my word
  chosen_korean: 내 말을 떨며 받는 사람
  alternatives_korean:
  - 내 말을 떨며 두려워하는 사람
  - 내 말씀 앞에서 떠는 사람
  - 내 말을 경외하는 사람
  lexicon: HALOT
  rationale: '''떨며''는 경외와 두려움이 함께 있는 반응을 보존합니다. ''받는''을 덧붙여 단순한 공포가 아니라 하나님의 말씀 앞에서 순종적 자세를 지닌 사람임을 드러냈습니다.'
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼께서 선언하십니다
  - 야훼의 신탁입니다
  lexicon: HALOT
  rationale: 본문에 직접 나타난 신명사 יְהוָה를 따라 고유명칭 '야훼'를 유지했습니다. 예언 공식은 한국어에서 자연스러운 '말씀하십니다'로 옮겼습니다.
theological_decisions:
- issue: '''가난한''과 ''통회하는'' 심령의 결합이 단순한 경제적 빈곤인지, 영적 겸손까지 포함하는지'
  chosen_reading: 심령이 가난하고 통회하며
  alternative_readings:
  - 가난하고 마음이 상한
  - 가난하고 겸손한
  - 학대받고 상한 영을 가진
  rationale: עָנִי는 빈곤·억압·겸손의 의미 범위를 가지지만, כאן에서는 '심령'과 결합해 하나님 앞에서 낮아지고 부서진 내적 태도를 가리킵니다. 두 요소를 함께 두어 사회적 빈곤만으로 축소하지 않되, 본문의 겸손/상한 영의 긴장도 지켰습니다.
  doctrine_reference: 사 66:2의 겸손한 자를 향한 하나님의 돌보심
- issue: '''떨다''의 의미를 단순 공포가 아니라 경외로 전달할지 여부'
  chosen_reading: 내 말을 떨며 받는 사람
  alternative_readings:
  - 내 말을 두려워하는 사람
  - 내 말을 경외하는 사람
  - 내 말씀 앞에서 떠는 사람
  rationale: חָרֵד는 실제 떨림과 경외의 반응을 모두 담을 수 있으므로, 한국어에서는 '떨며'를 유지해 본문의 강도를 살리고, '받는'을 덧붙여 순종적 응답을 분명히 했습니다.
  doctrine_reference: 말씀에 대한 경외와 순종
