    issue: ‘심령이 가난하고 통회하며’가 두 히브리어 표현의 구별을 흐립니다.
    rationale: עָנִי는 ‘가난한/곤고한’ 사람이고, נְכֵה רוּחַ가 ‘영이 상한 사람’을 수식합니다. ‘심령이 가난한’은 원문에 없는 결합을 만들며, ‘통회하는’은 상함·꺾임을 회개로 좁힐 수 있습니다.
