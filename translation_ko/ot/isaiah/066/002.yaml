  source_fidelity: 개정이 필요합니다. עָנִי는 본문에서 독립적으로 ‘가난한/곤고한 사람’을 뜻하며, 이를 ‘심령이 가난한’으로 옮기면 뒤따르는 נְכֵה רוּחַ(‘영이 상한/꺾인’)와의 구별이 흐려집니다. 또한 חָרֵד עַל דְּבָרִי는 ‘내 말에 떠는’이라는 반응 자체를 말하며, ‘받는’은 원문에 없는 순종의 의미를 더합니다.
  naturalness: ‘그러나 내가 주목할 사람은 이 사람입니다’는 지시어가 중복되어 현대 한국어로 어색합니다. ‘그러나 내가 주목할 사람은 … 사람이다’로 직접 진술하면 예언적 문체를 유지하면서도 자연스럽습니다. 예언자적 선언 공식은 ‘야훼의 말씀이다’가 간결하고 자연스럽습니다.
  terminology: ‘야훼’는 יְהוָה의 고유명 번역으로 유지했습니다. נְכֵה רוּחַ는 회개라는 뜻을 특정하는 ‘통회하는’보다 ‘영이 상한’이 더 직접적입니다. ‘내 말’은 단수 דְּבָרִי를 충실히 반영합니다.
  issues:
