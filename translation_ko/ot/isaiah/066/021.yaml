  naturalness: ‘그들 중에서도 내가 몇 사람을 제사장으로, 또 레위 사람으로 삼겠습니다’는 현대 표준어 합쇼체로 자연스럽고, 두 직분 범주를 각각 염두에 둔 히브리어의 병렬을 ‘또’로 드러냅니다. ‘레위 사람’은 일반 독자에게도 통용되는 자연스러운 표기입니다.
