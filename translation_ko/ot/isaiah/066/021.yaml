id: ISA.66.21
reference: Isaiah 66:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם מֵ/הֶ֥ם אֶקַּ֛ח לַ/כֹּהֲנִ֥ים לַ/לְוִיִּ֖ם אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'from among them'; the Hebrew leaves the antecedent implicit from the previous context.
    reason: lexical_alternative
  - marker: b
    text: That is, 'for priests and for Levites' may also be rendered 'as priests and as Levites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 중에서도 내가 몇 사람을 제사장으로, 또 레위 사람으로 삼겠습니다. 야훼께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들 중에서’라고만 하며, 그들이 누구인지는 앞선 문맥에서 파악해야 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제사장들을 위하여, 레위 사람들을 위하여’입니다. 여기서는 그들 가운데 일부를 제사장과 레위 사람의 직분으로 세우신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And even
  chosen_korean: 그리고 그들 중에서도
  alternatives_korean:
  - 그리고 또
  - 심지어 그들 중에서도
  lexicon: HALOT
  rationale: 문맥의 연속을 잇는 접속과 강조를 함께 살리기 위해 ‘그리고’와 ‘중에서도’를 결합해, 선택의 놀라움이 드러나도록 했습니다.
- source_word: מֵהֶם
  english_pob_choice: from them
  chosen_korean: 그들 중에서도
  alternatives_korean:
  - 그들로부터
  - 그들 가운데서
  lexicon: HALOT
  rationale: 히브리어 מן+대명사는 집합 안에서의 추출을 뜻하므로, 한국어에서는 자연스럽게 ‘중에서/가운데서’로 옮겨 부분적 선택을 드러냈습니다.
- source_word: אֶקַּח
  english_pob_choice: I will take some
  chosen_korean: 내가 … 택하겠습니다
  alternatives_korean:
  - 내가 데려오겠습니다
  - 내가 취하겠습니다
  lexicon: HALOT
  rationale: ‘take’의 기본 이미지를 유지하되, 여기서는 직분을 위한 선택의 의미가 분명하므로 ‘택하다’가 가장 분명하고 자연스럽습니다.
- source_word: לַכֹּהֲנִים לַלְוִיִּם
  english_pob_choice: for priests and for Levites
  chosen_korean: 제사장들과 레위 사람들을
  alternatives_korean:
  - 제사장들과 레위인들을
  - 제사장과 레위인으로
  lexicon: HALOT
  rationale: 지정·임명의 ל를 한국어의 목적어 구조로 풀어, ‘제사장들과 레위 사람들’을 택함으로써 직분 부여의 의미를 드러냈습니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하셨습니다
  - 야훼께서 이르십니다
  lexicon: HALOT
  rationale: 예언문 공식에서 현재형 선언을 살려 ‘말씀하십니다’로 옮기고, 본 프로젝트 기본 용례에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘그들’의 지시 대상과 제사장·레위인의 범위
  chosen_reading: 지시 대상을 본문에 덧붙여 특정하지 않고 ‘그들 중에서도’로 유지해, 앞 문맥에서 드러나는 폭넓은 포함 가능성을 열어 두었습니다.
  alternative_readings:
  - 이스라엘 가운데서만의 선발로 좁힐 수 있음
  - 제사장직과 레위직을 비유적 직분으로만 읽을 수 있음
  rationale: 히브리어는 대상을 다시 명시하지 않으므로, 번역이 해석을 과도하게 고정하지 않도록 했습니다. 본문의 놀라운 포용성과 직분 부여를 함께 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존
