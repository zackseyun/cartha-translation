source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
  footnotes:
  - marker: a
    text: Or, “who exclude you” or “who banish you.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew, “Let the LORD be glorified, that we may see your joy.” The speakers are likely mocking the faithful; alternatively, the line may be rendered, “May the LORD be honored, and let us see your joy.”
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀을 들으십시오, 그분의 말씀 앞에서 떠는 여러분. 여러분을 미워하고 내 이름 때문에 여러분을 내쫓는[a] 여러분의 형제들이 말했습니다. “야훼께서 영광을 받으시기를! 우리가 여러분의 기쁨을 보게 될 것입니다.”[b] 그러나 그들은 수치를 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분을 배척하는 자들” 또는 “여러분을 추방하는 자들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “야훼께서 영광을 받으시기를, 우리가 여러분의 기쁨을 보게 될 것입니다”입니다. 말하는 이들은 문맥상 신실한 이들을 조롱하는 것으로 보입니다. 달리 “야훼께서 높임을 받으시고, 우리가 여러분의 기쁨을 보게 하라”로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들으라
  lexicon: HALOT
  rationale: 예언자적 직접 부름의 명령형을 현대 합쇼체로 옮기되, 청자에게 즉각적 주의를 요구하는 힘을 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀
  lexicon: HALOT
  rationale: 예언서의 관용구인 ‘말씀’을 유지하여 하나님의 계시적 발화라는 무게를 보존했습니다.
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  english_pob_choice: you who tremble at his word
  chosen_korean: 그의 말씀에 떠는 여러분
  alternatives_korean:
  - 그의 말씀을 두려워하는 여러분
  - 그의 말씀 앞에 떠는 여러분
  lexicon: HALOT
  rationale: חרד의 ‘떨다’라는 감각을 살리되, 한국어에서는 관계절보다 호명형 표현이 자연스러워 ‘여러분’으로 다듬었습니다.
- source_word: מְנַדֵּיכֶם
  english_pob_choice: who cast you out
  chosen_korean: 너희를 내쫓은
  alternatives_korean:
  - 너희를 쫓아낸
  - 너희를 배척한
  - 너희를 추방한
  lexicon: HALOT
  rationale: נדה의 사회·종교적 배제를 드러내기 위해 단순한 감정적 거절보다 강한 ‘내쫓다’를 택했습니다.
- source_word: לְמַעַן שְׁמִי
  english_pob_choice: for my name’s sake
  chosen_korean: 내 이름 때문에
  alternatives_korean:
  - 내 이름을 위하여
  - 내 이름을 이유로
  lexicon: HALOT
  rationale: ‘이름’에 대한 이유/명분의 뉘앙스를 현대 한국어에서 자연스럽고 직설적으로 전달했습니다.
- source_word: יִכְבַּד יְהוָה
  english_pob_choice: Let Yahweh be glorified
  chosen_korean: 야훼께서 영광을 받으시기를
  alternatives_korean:
  - 야훼께서 영화롭게 되시기를
  - 야훼께서 영광을 받으소서
  lexicon: HALOT
  rationale: 원문은 화자들의 말로서 희구형을 이루므로, 직역적인 수동형을 한국어 소망형으로 옮겨 조롱 섞인 발화를 드러냈습니다.
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  english_pob_choice: that we may see your joy
  chosen_korean: 그러면 우리가 너희의 기쁨을 보게 되리라
  alternatives_korean:
  - 그리고 우리가 너희의 기쁨을 보게 되리라
  - 우리가 너희의 기쁨을 보기를
  lexicon: HALOT
  rationale: MT의 1인칭 복수형 נִרְאֶה를 살려 ‘우리가 보게 되리라’로 옮겼고, בְּ + 명사는 자연스럽게 목적어적 표현으로 처리했습니다.
theological_decisions:
- issue: 야훼의 이름과 타인의 모독적 발화 표지
  chosen_reading: 본문 서술은 야훼의 이름을 그대로 드러내되, 따옴표 안의 적대자 발언은 조롱적·위선적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 중립적인 경건 발언으로 완화할 수 있습니다.
  - 따옴표 속 말을 단순한 선언으로 처리할 수 있습니다.
  rationale: 문맥상 ‘미워하고 내쫓는 형제들’이 하는 말이므로, 마지막의 수치 선고와 함께 읽히는 조롱성을 희석하지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 이사야 66:5 문맥 주해 — 박해자들의 아이러니한 발화
- issue: 직접화법 안의 희구형 처리
  chosen_reading: '"야훼께서 영광을 받으시기를"로 옮겨, 히브리어 jussive의 발화 기능을 한국어 소망형으로 재현했습니다.'
  alternative_readings:
  - '"야훼께서 영광을 받으십시오"처럼 명령형으로 옮길 수 있습니다.'
  - '"야훼께서 영광을 받으시길"의 구어적 축약도 가능합니다.'
  rationale: 원문의 화법은 서술자가 아니라 인용된 발화 내부의 희구이므로, 현대 합쇼체에서 가장 자연스러운 신학적·문체적 대응은 소망형입니다.
  doctrine_reference: 번역 문체 지침 — 직접 인용 속 발화 양식
