  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'from one new moon to another, and from one Sabbath to another.'
    reason: lexical_alternative
  - marker: b
    text: '''All flesh'' is a Hebrew idiom that can mean all humanity, while retaining the sense of creaturely embodied life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 초하루마다[a], 안식일마다 모든 육체가[b] 내 앞에 와서 엎드릴 것입니다. 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 초하루에서 그 초하루까지’입니다. 정기적으로 되풀이됨을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 육체’는 히브리어 관용구로, 여기서는 모든 인류를 가리키며 피조물로서의 육체적 생명이라는 뉘앙스도 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그러면 …일 것이며
  alternatives_korean:
  - 그리고 …될 것입니다
  - 그리하여 …일 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스러운 합쇼체로 옮기되, 본문의 선언적 흐름을 살리기 위해 ‘그러면 …일 것이며’로 연결했습니다.
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ / מִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  english_pob_choice: from new moon to its new moon and from Sabbath to its Sabbath
  chosen_korean: 달마다 초하루마다, 안식일마다
  alternatives_korean:
  - 초하루마다 초하루마다, 안식일마다 안식일마다
  - 달마다, 안식일마다
  lexicon: HALOT
  rationale: 히브리어의 반복 관용구는 한국어에서 ‘마다’로 자연스럽게 풀면서도 정기적 예배의 의미를 보존했습니다. POB가 지적한 반복성은 살리되, 한국어에서는 소유격을 그대로 반복하지 않고 리듬과 의미를 유지했습니다.
- source_word: כָל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 인류
  lexicon: HALOT
  rationale: ‘all flesh’의 성경적 관용을 살려 문자성을 유지했습니다. 이는 단순한 ‘사람들’보다 피조적·육체적 인간 전체를 포괄하는 뉘앙스를 더 잘 드러냅니다.
- source_word: לְהִשְׁתַּחֲוֺת לְפָנַי
  english_pob_choice: to bow down before me
  chosen_korean: 내 앞에 와서 엎드릴
  alternatives_korean:
  - 내 앞에 나아와 경배할
  - 내 앞에서 엎드릴
  lexicon: HALOT
  rationale: ‘엎드리다’로 몸의 동작을 살리고, ‘와서’로 하나님 앞에 나아오는 방향성을 보완했습니다. ‘경배하다’만 쓰면 행위의 구체성이 약해져 본문의 육체적 예배 이미지를 덜 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다. 예언서 본문의 직접 호칭을 유지하면서도, 전통적 교회어인 ‘여호와’는 피했습니다.
theological_decisions:
- issue: ‘all flesh’의 범위를 사람으로 좁힐지 여부
  chosen_reading: 모든 육체
  alternative_readings:
  - 모든 사람
  - 온 인류
  rationale: 문맥상 보편적 인류 예배를 가리키지만, 본문 표현 자체의 넓은 관용구를 유지해 범위를 과도하게 좁히지 않았습니다.
  doctrine_reference: 원문 표현과 신학적 긴장을 보존하고, 번역이 해석을 과도하게 대신하지 않음.
