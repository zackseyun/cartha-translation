id: ISA.66.1
reference: Isaiah 66:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/שָּׁמַ֣יִם כִּסְאִ֔/י וְ/הָ/אָ֖רֶץ הֲדֹ֣ם רַגְלָ֑/י אֵי זֶ֥ה בַ֨יִת֙ אֲשֶׁ֣ר תִּבְנוּ לִ֔/י וְ/אֵי זֶ֥ה מָק֖וֹם מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
  footnotes:
  - marker: a
    text: Or 'What house could you build for me?' The Hebrew question is rhetorical and may emphasize the inadequacy of any house humans might build for God.
    reason: lexical_alternative
  - marker: b
    text: '''House'' likely alludes to the temple, but the Hebrew word itself is ''house.'''
    reason: cultural_note
  - marker: c
    text: Or 'my place of rest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “하늘은 내 보좌요, 땅은 내 발판입니다. 너희가 나를 위해 어떤 집을 짓겠느냐[b], 또 어떤 곳이 나의 안식처가 되겠느냐[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘집’은 성전을 가리키는 암시일 수 있지만, 히브리어 단어 자체는 ‘집’입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나의 안식의 장소’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하시기를
  - 야훼께서 이같이 말씀하십니다
  lexicon: WLC; prophetic messenger formula
  rationale: 예언자적 전언 공식의 장중함을 살리되, 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: כִּסְאִי
  english_pob_choice: my throne
  chosen_korean: 내 보좌
  alternatives_korean:
  - 내 왕좌
  - 나의 보좌
  lexicon: HALOT
  rationale: 왕권의 비유를 직접 살리기 위해 '보좌'로 옮겼습니다.
- source_word: הֲדֹם רַגְלָי
  english_pob_choice: my footstool
  chosen_korean: 내 발판
  alternatives_korean:
  - 내 발등상
  - 내 발걸상
  lexicon: HALOT
  rationale: 관용구를 한국어에서 이해하기 쉬운 말로 옮기되, 발 아래에 둔 낮은 자리라는 이미지를 유지했습니다.
- source_word: בַּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 집
  - 성전
  lexicon: HALOT
  rationale: 히브리어가 직접 '성전'이 아니라 '집'을 쓰므로, 본문이 말하는 어휘를 유지했습니다.
- source_word: מְנוּחָתִי
  english_pob_choice: my resting place
  chosen_korean: 나의 안식처
  alternatives_korean:
  - 나의 쉼터
  - 내가 쉬는 곳
  lexicon: HALOT
  rationale: 문맥상 '머무는 곳' 이상의 정착·안식의 뉘앙스를 살리기 위해 '안식처'를 택했습니다.
theological_decisions:
- issue: בַּיִת를 '성전'으로 구체화할지 여부
  chosen_reading: 본문의 어휘를 따라 '집'으로 유지했습니다.
  alternative_readings:
  - 성전
  - 집
  rationale: 문맥상 성전이 배경이지만, 히브리어 자체는 일반 명사 '집'이므로 과잉 명시를 피했습니다.
  doctrine_reference: 원어 우선 원칙; 텍스트가 직접 말하지 않는 전통적 해석의 과잉 삽입을 지양함
