  revised_text: 내가 그들 가운데에 표징[a]을 두고, 그들 가운데서 살아남은 이들을 여러 나라, 곧 다르시스와 풀과 활을 당기는 룻과 두발과 야완과, 내 소식[d]을 듣지 못하고 내 영광을 보지 못한 먼 섬들[c]로 보내겠습니다. 그들이 여러 나라 가운데에서 내 영광을 선포할 것입니다.
