  - severity: medium
    issue: ‘내 소문’
    rationale: שִׁמְעִי는 하나님에 관하여 전해진 소식, 전언, 명성의 의미입니다. 한국어 ‘소문’은 비격식적이거나 확인되지 않은 풍문이라는 뉘앙스를 줄 수 있어 본문 문체에 덜 적합합니다.
