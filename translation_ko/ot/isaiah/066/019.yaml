  source_fidelity: 히브리어의 기본 구조와 의미는 대체로 반영되어 있으나, 현재 문장은 ‘활을 당기는’의 수식 범위가 지명 열거 전체로 넓게 읽힐 수 있습니다. 히브리어에서는 이 표현이 가장 자연스럽게 룻(לוד)을 수식하므로 이를 한국어 문장 안에서 분명히 했습니다. 또한 שִׁמְעִי는 단순한 일상적 ‘소문’보다 하나님에 관하여 들리는 ‘소식/전언’ 또는 ‘명성’의 뜻을 지니므로 ‘내 소식’으로 옮기고 대안을 각주로 보존했습니다.
  naturalness: ‘선폰하리라’는 명백한 오자이며, 기존 문장은 목적지 열거와 동사의 연결이 다소 불명확합니다. 현대 표준어 합쇼체에 맞추어 문장을 정돈하고, ‘피난한 자들’은 문맥상 더 직접적인 ‘살아남은 이들’로 다듬었습니다.
  terminology: ‘표징’은 אוֹת의 넓은 의미를 유지합니다. 지명은 한국어 성경에서 널리 쓰이는 형태인 다르시스, 풀, 룻, 두발, 야완을 사용했습니다. 하나님의 כָּבוֹד는 일관되게 ‘영광’으로 유지했습니다.
  issues:
  - severity: high
    issue: ‘선폰하리라’
    rationale: ‘선포하리라’의 오자로, 본문에 문법·정서법 오류가 있습니다.
