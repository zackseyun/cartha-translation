language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/טֶ֥רֶם תָּחִ֖יל יָלָ֑דָה בְּ/טֶ֨רֶם יָב֥וֹא חֵ֛בֶל לָ֖/הּ וְ/הִמְלִ֥יטָה זָכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
  footnotes:
  - marker: a
    text: Or 'before birth pangs came upon her.'
    reason: lexical_alternative
  - marker: b
    text: The 'she' refers to Zion/Jerusalem in the surrounding context.
    reason: cross_reference
translation:
  language: ko
  text: 여인이 진통하기도 전에 아이를 낳았고, 그녀에게 고통이 닥치기도 전에 아들을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해산의 진통이 오기도 전에’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 ‘그녀’는 주변 문맥의 시온/예루살렘을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם תָּחִיל
  english_pob_choice: Before she was in labor
  chosen_korean: 진통하기도 전에
  alternatives_korean:
  - 해산의 진통이 오기도 전에
  - 산기가 들기도 전에
  lexicon: HALOT
  rationale: בְּטֶרֶם의 반복된 시간 표지를 한국어로 자연스럽게 살리면서, תָּחִיל의 출산 문맥을 ‘진통하다’로 옮겨 앞 절의 출산 이미지가 분명히 드러나게 했습니다.
- source_word: יָלָדָה
  english_pob_choice: she gave birth
  chosen_korean: 아이를 낳았고
  alternatives_korean:
  - 출산하였고
  - 낳았고
  lexicon: HALOT
  rationale: 기본적인 출산 동사이므로 현대 한국어에서 가장 자연스럽고 직접적인 ‘낳다’로 옮겼습니다. ‘아이를’은 문맥상 출산 대상을 분명히 합니다.
- source_word: חֵבֶל
  english_pob_choice: pain
  chosen_korean: 고통
  alternatives_korean:
  - 산고
  - 해산의 고통
  - 진통
  lexicon: HALOT
  rationale: 이미 앞 절에 ‘진통’이 나오므로, כאן의 חֵבֶל은 반복을 피하면서도 출산 고통을 포함하는 더 넓은 의미의 ‘고통’으로 옮겼습니다.
- source_word: וְהִמְלִיטָה זָכָר
  english_pob_choice: she delivered a son
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 남자아이를 낳았습니다
  - 사내아이를 낳았습니다
  lexicon: HALOT
  rationale: וְהִמְלִיטָה는 이 문맥에서 ‘아이를 밖으로 내다/낳다’의 출산 관용구이므로 ‘낳다’로 자연스럽게 처리했고, זָכָר는 남성성을 분명히 하는 출생 맥락에서 ‘아들’로 옮겼습니다.
theological_decisions:
- issue: 여성 대명사의 지시 대상
  chosen_reading: 본문에는 지시 대상이 드러나지 않으므로, मुख्य text는 ‘여인/그녀’의 이미지 자체를 유지했습니다.
  alternative_readings:
  - 시온
  - 예루살렘
  - 하나님의 백성
  rationale: 주변 문맥상 시온/예루살렘을 가리키지만, 본절 자체는 여성 단수 형식만 사용하므로 해석을 본문 안에 미리 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 문맥적 지시 대상은 주해에서 다루되 번역문에서는 과잉 명시를 피함.
