    rationale: 이 절에서 חֵבֶל은 해산 때 닥치는 고통 또는 진통을 가리킵니다. 앞 절의 תָּחִיל과 동일어로 평준화하지 않으면서도 ‘해산의 고통’으로 출산 의미를 밝혀야 합니다.
  - severity: low
    issue: 각주 b의 ‘가리킵니다’는 문맥적 지시를 다소 단정적으로 표현합니다.
    rationale: 주변 문맥은 시온/예루살렘을 여성으로 의인화하지만, 본절 자체에는 이름이 없습니다. 의인화라는 문학적 설명으로 표현하면 본문의 암시성을 더 잘 보존합니다.
