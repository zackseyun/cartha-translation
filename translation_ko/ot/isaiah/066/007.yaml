review_pass:
  verdict: revise
  source_fidelity: 첫 절의 여성 단수 주어는 히브리어 본문에 명시 명사가 아니라 동사 형태로만 나타납니다. 초안의 ‘여인’은 이를 불필요하게 명시합니다. 또한 חֵבֶל은 이 출산 문맥에서 일반적 ‘고통’보다 ‘해산의 고통/진통’으로 구체화하는 것이 적절합니다.
  naturalness: ‘그녀는 진통을 겪기도 전에 … 해산의 고통이 그녀에게 닥치기도 전에 …’는 현대 표준 한국어에서 자연스럽고, 반복되는 בְּטֶרֶם의 강조와 두 출산 동사의 연결을 잘 드러냅니다. 합쇼체 종결도 유지됩니다.
  terminology: תָּחִיל은 ‘진통을 겪다’, חֵבֶל은 ‘해산의 고통’으로 구별하여 옮겼습니다. זָכָר의 남성 표지는 관용적인 출산 문맥의 ‘아들’로 보존했습니다. 시온/예루살렘이라는 지시 대상은 본문에 넣지 않고 각주에서 문맥적 의인화로 제한했습니다.
  issues:
  - severity: medium
    issue: ‘여인’이 본문에 없는 명시적 주어를 도입합니다.
    rationale: 히브리어는 여성 단수 동사 형태로만 주어를 암시합니다. ‘여인’은 문맥상 가능한 이해이지만 본문이 명시하지 않은 어휘를 추가하므로 ‘그녀’로 유지하는 편이 더 충실합니다.
  - severity: medium
