id: ISA.66.24
reference: Isaiah 66:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
  footnotes:
  - marker: a
    text: Or 'their maggot'; the Hebrew term can refer to a worm, grub, or maggot.
    reason: lexical_alternative
  - marker: b
    text: Or 'a horror' or 'something loathsome.'
    reason: lexical_alternative
  - marker: c
    text: '''All flesh'' is a Hebrew expression meaning all people or all humanity.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 나가서, 나에게 반역한 사람들의 시체를 볼 것입니다. 그들의 구더기는 죽지 않고 그들의 불은 꺼지지 않으며, 그들은 모든 육체에게 혐오가 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구더기’로도 번역할 수 있습니다. 히브리어 용어는 벌레, 유충, 구더기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혐오’ 또는 ‘역겨운 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 육체’는 모든 사람, 곧 모든 인류를 뜻하는 히브리어 관용입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ
  english_pob_choice: And they will go out
  chosen_korean: 그들이 나가서
  alternatives_korean:
  - 그들이 나갈 것이며
  - 그들이 나가게 되고
  lexicon: HALOT
  rationale: 미래적 연속을 살리면서 한국어 문장 흐름에 맞게 연결형으로 옮겼습니다.
- source_word: בְּפִגְרֵי הָאֲנָשִׁים
  english_pob_choice: the corpses of the men
  chosen_korean: 사람들의 시체
  alternatives_korean:
  - 남자들의 시체
  - 그 사람들의 시체
  lexicon: HALOT
  rationale: פגר는 시체/사체의 의미이므로 ‘시체’로 옮겼고, 문맥상 복수 집단을 자연스럽게 드러내기 위해 ‘사람들’을 택했습니다. 다만 성별 표지는 본문상 명시적이므로 보수적으로 처리했습니다.
- source_word: תוֹלַעְתָּם
  english_pob_choice: their worm
  chosen_korean: 그들의 구더기
  alternatives_korean:
  - 그들의 벌레
  - 그들의 벌레충
  lexicon: HALOT
  rationale: תוֹלַעַת은 벌레/유충/구더기를 가리킬 수 있어, 문맥의 혐오성과 현실감을 살리는 ‘구더기’가 가장 적절합니다.
- source_word: לֹא תָמוּת
  english_pob_choice: will not die
  chosen_korean: 죽지 않고
  alternatives_korean:
  - 죽지 않을 것이며
  - 죽지 않습니다
  lexicon: HALOT
  rationale: 여성 단수 주어인 ‘구더기’에 맞는 미래 부정을 자연스럽게 반영했습니다.
- source_word: וְאִשָּׁם
  english_pob_choice: and their fire
  chosen_korean: 그들의 불은
  alternatives_korean:
  - 그들의 불길은
  - 그 불은
  lexicon: HALOT
  rationale: אשׁ은 문자 그대로 불/불길이므로, 본문 대응을 위해 ‘불’로 직역하되 한국어 문장에 맞게 주어화했습니다.
- source_word: וְהָיוּ דֵרָאוֹן לְכָל בָּשָׂר
  english_pob_choice: and they will be an abhorrence to all flesh
  chosen_korean: 그들은 모든 육체에게 혐오가 될 것입니다
  alternatives_korean:
  - 그들은 모든 사람에게 혐오가 될 것입니다
  - 그들은 모든 육체에게 끔찍한 것이 될 것입니다
  lexicon: HALOT
  rationale: דֵרָאוֹן은 혐오/역겨움의 대상을 가리키므로, 명사성을 살린 ‘혐오’로 옮겼습니다. ‘모든 육체’는 히브리어 관용을 유지해 보편성을 보존했습니다.
theological_decisions:
- issue: Judgment imagery and finality
  chosen_reading: 본문이 말하는 것은 심판 뒤에 남는 가시적·혐오적 광경이며, 그 이미지 자체를 약화하거나 교리적으로 과잉 해석하지 않았습니다.
  alternative_readings:
  - 상징적 수치의 표현으로만 이해하는 읽기
  - 영원한 형벌의 기제까지 직접 규정하는 읽기
  rationale: 시체, 죽지 않는 구더기, 꺼지지 않는 불이라는 구체적 이미지를 그대로 살려 본문이 허용하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
- issue: Rendering of כָל בָּשָׂר
  chosen_reading: ‘모든 육체’로 직역해 히브리 관용과 보편적 범위를 유지했습니다.
  alternative_readings:
  - 모든 사람
  - 모든 인류
  rationale: 전통적 완화 표현보다 원문의 육체/살(flesh) 이미지를 보존하는 것이 이 절의 강한 대조와 보편성을 더 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §4
