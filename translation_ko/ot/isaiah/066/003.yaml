  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
  footnotes:
  - marker: a
    text: Or 'like one who blesses an idol' for 'like one who blesses wickedness'; the Hebrew word can denote evil, iniquity, or idolatrous wickedness.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'their soul delights,' with a singular noun and verb used collectively for the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 소를 잡는 자는 사람을 치는 자와 같으며, 어린 양을 제물로 바치는 자는 개의 목을 꺾는 자와 같고, 곡식 제물을 드리는 자는 돼지의 피를 바치는 자와 같으며, 유향을 기념 제물로 드리는 자는 악[a]을 축복하는 자와 같습니다. 그들 역시 자기들의 길을 택하였으며, 그들의 영혼[b]은 자기들의 가증한 것들을 기뻐합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָוֶן은 여기서 악, 불의, 또는 우상숭배적 악을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 영혼’이라는 단수 명사와 여성 단수 동사를 백성을 가리키는 집합적 표현으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר
  english_pob_choice: the one who slaughters an ox
  chosen_korean: 소를 잡는 자
  alternatives_korean:
  - 황소를 잡는 자
  - 수소를 잡는 자
  - 소를 도살하는 자
  lexicon: HALOT
  rationale: שור는 제의적 맥락의 큰 가축으로서 ‘소’가 자연스럽고, 분사형의 일반적·특성적 힘을 살리기 위해 ‘잡는 자’로 옮겼습니다.
- source_word: מַכֵּה אִישׁ
  english_pob_choice: like one who strikes down a man
  chosen_korean: 사람을 치는 자와 같고
  alternatives_korean:
  - 사람을 죽이는 자와 같고
  - 사람을 때리는 자와 같고
  - 한 사람을 치는 자와 같고
  lexicon: HALOT
  rationale: מכה는 ‘치다/내리치다/쓰러뜨리다’의 폭넓은 뜻이 있어, 결과를 지나치게 특정하지 않으면서 폭력성을 살리는 ‘치다’를 택했습니다.
- source_word: זוֹבֵחַ הַשֶּׂה
  english_pob_choice: the one who sacrifices a lamb
  chosen_korean: 어린 양을 제물로 바치는 자
  alternatives_korean:
  - 어린 양을 희생제물로 드리는 자
  - 양을 제사하는 자
  - 양을 바치는 자
  lexicon: HALOT
  rationale: שֶׂה는 떼 짐승을 가리키며 제의적 문맥에서는 ‘어린 양’이 자연스럽습니다. ‘제물로 바치는’은 희생제의 의미를 드러냅니다.
- source_word: עֹרֵף כֶּלֶב
  english_pob_choice: like one who breaks a dog’s neck
  chosen_korean: 개의 목을 꺾는 자와 같으며
  alternatives_korean:
  - 개의 목을 부러뜨리는 자와 같으며
  - 개를 목 꺾어 죽이는 자와 같으며
  - 개의 목을 꺾는 자와 같이
  lexicon: HALOT
  rationale: ערף는 ‘목을 꺾다’는 뜻이므로, 동작의 잔혹성을 직접적으로 드러내는 표현을 택했습니다.
- source_word: מַעֲלֵה מִנְחָה
  english_pob_choice: the one who offers a grain offering
  chosen_korean: 곡식 제물을 드리는 자
  alternatives_korean:
  - 소제물을 드리는 자
  - 곡식 제사를 드리는 자
  - 곡식 헌물을 올리는 자
  lexicon: HALOT
  rationale: מנחה는 여기서 제의적 ‘곡식 제물’이 적절하며, ‘드리는’은 제의 행위의 격식을 자연스럽게 살립니다.
- source_word: דַּם חֲזִיר
  english_pob_choice: like one who offers pig’s blood
  chosen_korean: 돼지의 피를 바치는 자와 같고
  alternatives_korean:
  - 돼지 피를 바치는 자와 같고
  - 돼지의 피를 드리는 자와 같고
  - 돼지 피를 제물로 바치는 자와 같고
  lexicon: HALOT
  rationale: חזיר는 부정한 동물인 ‘돼지’로 옮기고, 피의 제의적 부적합성을 직설적으로 드러내기 위해 ‘바치다’를 유지했습니다.
- source_word: מַזְכִּ֥יר לְבֹנָ֖ה
  english_pob_choice: the one who makes a memorial offering of frankincense
  chosen_korean: 유향으로 기념제를 삼는 자
  alternatives_korean:
  - 유향으로 기념제를 드리는 자
  - 유향의 기념제를 올리는 자
  - 유향을 기억제물로 드리는 자
  lexicon: HALOT
  rationale: זכר의 제의적 용법을 ‘기념제’로 옮겨, 향을 단순히 태우는 행위가 아니라 기억을 불러오는 예식적 행위를 드러냈습니다.
- source_word: מְבָרֵךְ אָוֶן
  english_pob_choice: like one who blesses wickedness
  chosen_korean: 악을 축복하는 자
  alternatives_korean:
  - 악을 복되다 하는 자
  - 불의를 축복하는 자
  - 우상을 축복하는 자
  lexicon: HALOT
  rationale: אָוֶן은 문맥상 악/불의/우상적 악의 폭을 가질 수 있으나, 본문이 좁혀 주지 않으므로 ‘악’으로 넓게 두었습니다. ‘축복하다’는 반어적 충격을 살립니다.
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  english_pob_choice: They too have chosen their own ways
  chosen_korean: 그들도 자기들의 길을 택하였고
  alternatives_korean:
  - 그들도 자기 길을 선택하였고
  - 그들 또한 자기들의 길을 골랐고
  - 그들 역시 자기들의 길을 택하였고
  lexicon: HALOT
  rationale: גם הֵמה의 강조를 ‘그들도’로 살리고, בחרו를 평이한 ‘택하다’로 옮겨 자기결정적 반역의 뉘앙스를 유지했습니다.
- source_word: וּ/בְ/שִׁקּוּצֵי/הֶם נַפְשָׁ֥/ם חָפֵֽצָה
  english_pob_choice: and their soul delights in their abominations
  chosen_korean: 자기들의 가증한 것들을 그들의 영혼이 기뻐합니다
  alternatives_korean:
  - 자기들의 가증한 것들을 그들의 혼이 좋아합니다
  - 그들의 영혼은 자기들의 가증한 것들을 즐깁니다
  - 자기들의 가증한 것들을 그들의 생명이 기뻐합니다
  lexicon: HALOT
  rationale: שקוצים는 예언서의 제의적·도덕적 혐오 대상을 드러내는 말이어서 ‘가증한 것들’이 적절하며, נפש는 여기서 집합적으로 ‘그들의 영혼’으로 처리했습니다.
theological_decisions:
- issue: 열거된 제의 행위와 폭력 행위의 관계
  chosen_reading: 본문의 충격적 병치를 그대로 살리기 위해 ‘~와 같고’ 구조로 대응시켜, 겉보기 제사가 실제로는 혐오스러운 행위와 같은 것으로 드러난다는 의미를 전달했습니다.
  alternative_readings:
  - 직설적으로 동격처럼 옮겨 더 강하게 표현
  - 하나님이 그런 제사를 받지 않으신다는 설명을 덧붙임
  rationale: 히브리어는 비교사를 생략한 병렬문이지만, 예언서의 의도는 외형적 예배와 악행의 도덕적 동등성을 폭로하는 데 있습니다. 한국어에서는 비교를 드러내는 것이 오해를 줄입니다.
  doctrine_reference: '예언서의 심판 수사; 번역 원칙: source-driven optimal equivalence'
- issue: אָוֶן의 번역 범위
  chosen_reading: 악
  alternative_readings:
  - 불의
  - 허무
  - 우상
  rationale: 문맥상 우상숭배적 뉘앙스까지 열려 있으나, 본문만으로는 특정 대상에 좁히지 않는 편이 원문 충실성이 높습니다.
  doctrine_reference: 원어 우선 원칙; 의미 범위 보존
