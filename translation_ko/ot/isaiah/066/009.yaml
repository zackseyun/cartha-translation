id: ISA.66.9
reference: Isaiah 66:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
  footnotes:
  - marker: a
    text: Or 'bring to the breaking point'; the Hebrew uses childbirth imagery for bringing to the moment of delivery.
    reason: lexical_alternative
  - marker: b
    text: Literally 'restrain' or 'shut up'; 'shut the womb' makes the implied childbirth image explicit in English.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'your God' with a feminine singular 'your,' addressing Zion/Jerusalem as a woman in the surrounding context.
    reason: cultural_note
translation:
  language: ko
  text: 내가 해산 직전까지 몰고 가고도 출산하게 하지 않겠느냐? 야훼께서 말씀하십니다. 내가 출산하게 하는 자인데도 태를 막겠느냐? 너희 하나님께서 말씀하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 출산의 비유로 ‘해산 직전/출산의 위기까지 이르게 하다’는 뜻을 사용합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘억제하다’ 또는 ‘막다’입니다. 한국어에서는 출산 비유를 분명히 하기 위해 ‘태를 막다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여성 단수 소유격으로, 주변 문맥에서 시온/예루살렘을 여성으로 부르고 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁבִּיר
  english_pob_choice: bring to the point of birth
  chosen_korean: 해산 직전까지 몰고 가다
  alternatives_korean:
  - 출산 직전까지 이르게 하다
  - 진통이 시작되게 하다
  - 해산의 순간까지 데려가다
  lexicon: HALOT
  rationale: שבר의 히필이 כאן 출산 비유로 쓰여 ‘깨뜨리다’보다 임신을 해산의 위기/직전까지 이르게 하는 뜻이므로, 한국어에서는 자연스러운 비유인 ‘해산 직전까지 몰고 가다’로 옮겼습니다.
- source_word: אוֹלִיד
  english_pob_choice: cause to give birth
  chosen_korean: 출산하게 하다
  alternatives_korean:
  - 낳게 하다
  - 해산시키다
  - 아이를 낳게 하다
  lexicon: HALOT
  rationale: יַלד의 히필이 사역 의미이므로, 단순히 ‘낳다’보다 사역성을 드러내는 ‘출산하게 하다’로 옮겨 하나님의 능동적 작용을 보존했습니다.
- source_word: וְעָצַרְתִּי
  english_pob_choice: shut the womb
  chosen_korean: 태를 막다
  alternatives_korean:
  - 태를 닫다
  - 출산을 막다
  - 자궁을 막다
  lexicon: HALOT
  rationale: עצר는 ‘막다/억제하다’의 뜻이므로, 영어의 명시화된 ‘shut the womb’에 대응하되 과도하게 해부학적이거나 직역적인 표현을 피하고 출산 비유를 살리는 ‘태를 막다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 문맥상 יהוה의 고유명을 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהָיִךְ
  english_pob_choice: your God
  chosen_korean: 너희 하나님
  alternatives_korean:
  - 네 하나님
  - 당신의 하나님
  - 그대의 하나님
  lexicon: HALOT
  rationale: 히브리어 2인칭 여성 단수 어미가 시온/예루살렘을 여성으로 부르는 표현이지만, 한국어 본문에서는 성별 표지가 불가능하므로 의미를 유지하는 ‘너희 하나님’으로 자연화했습니다.
theological_decisions:
- issue: 출산 비유를 얼마나 직접적으로 드러낼지
  chosen_reading: 하나님이 시작한 일을 완성하지 못하게 하실 리 없다는 수사적 확신을, 출산 비유를 유지한 채 한국어로 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘낳게 하고도 낳지 못하게 하겠느냐’처럼 더 직역하기
  - ‘해산까지 이르게 하고도 마치게 하지 않겠느냐’처럼 더 설명적으로 옮기기
  rationale: 본문은 하나님의 신실하심을 출산 이미지로 강조하므로, 비유를 지우지 않으면서도 현대 한국어 독자가 즉시 이해할 수 있게 옮기는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 문법상 여성 단수 대상을 한국어에서 어떻게 보존할지
  chosen_reading: ‘너희 하나님’으로 옮겨 시온에 대한 직접 호칭을 유지하되, 한국어가 지닌 성별 표지의 한계를 감수했습니다.
  alternative_readings:
  - ‘네 하나님’으로 직역하기
  - 주석으로 여성 단수 대상을 설명하기
  rationale: 히브리어의 여성 단수 어미는 중요한 수사적 표지이지만, 본문 안에서는 한국어로 자연스럽게 재현하기 어렵습니다. 본문 가독성을 해치지 않는 범위에서 직접 호칭을 보존하는 것이 우선입니다.
  doctrine_reference: Translation philosophy §§1, 6
