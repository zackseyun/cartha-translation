id: ISA.66.14
reference: Isaiah 66:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְאִיתֶם֙ וְ/שָׂ֣שׂ לִבְּ/כֶ֔ם וְ/עַצְמוֹתֵי/כֶ֖ם כַּ/דֶּ֣שֶׁא תִפְרַ֑חְנָה וְ/נוֹדְעָ֤ה יַד יְהוָה֙ אֶת עֲבָדָ֔י/ו וְ/זָעַ֖ם אֶת אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
  footnotes:
  - marker: a
    text: Or, 'and he will be indignant against his enemies.' The Hebrew conjunction can be read simply as 'and'; 'but' in the main text brings out the contrast with the previous clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그것을 보고, 마음이 기뻐할 것입니다. 너희 뼈는 풀처럼 무성하게 될 것입니다. 야훼의 손이 그의 종들에게 알려질 것이며, 그는 그의 원수들에게 분노하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 접속사 는 단순히 ‘그리고’로도 읽을 수 있습니다. 본문은 앞절과의 대비를 살리기 위해 영어 POB에서 ‘but’를 제시했지만, 최종 개정에서는 더 직접적인 연결을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  english_pob_choice: You will see
  chosen_korean: 너희는 그것을 보고
  alternatives_korean:
  - 너희는 보게 될 것입니다
  - 너희는 보게 됩니다
  lexicon: WLC/HALOT
  rationale: 예언적 미래를 자연스러운 한국어로 옮기되, 히브리어의 직설적 시각 동사를 유지해 ‘그것을 보고’로 처리했습니다.
- source_word: וְשָׂשׂ לִבְּכֶם
  english_pob_choice: your heart will rejoice
  chosen_korean: 마음이 기뻐할 것입니다
  alternatives_korean:
  - 마음이 즐거워할 것입니다
  - 마음이 크게 기뻐할 것입니다
  lexicon: WLC/HALOT
  rationale: 히브리어의 ‘마음’ 단수와 기쁨의 동사를 한국어 자연문장으로 살려, 과장 없이 내적 기쁨을 표현했습니다.
- source_word: וְעַצְמוֹתֵיכֶם כַּדֶּשֶׁא תִפְרַחְנָה
  english_pob_choice: your bones will flourish like the grass
  chosen_korean: 너희 뼈는 풀처럼 무성하게 될 것입니다
  alternatives_korean:
  - 너희 뼈는 풀처럼 자랄 것입니다
  - 너희 뼈는 새싹처럼 돋아날 것입니다
  lexicon: WLC/HALOT
  rationale: ‘뼈’ 이미지를 그대로 유지해 온전한 회복의 강한 육체적 비유를 살렸고, דֶּשֶׁא와 פרח의 결합은 ‘풀처럼 무성하게’로 자연스럽게 옮겼습니다.
- source_word: וְנוֹדְעָה יַד יְהוָה
  english_pob_choice: The hand of Yahweh will be made known
  chosen_korean: 야훼의 손이 ... 알려질 것이며
  alternatives_korean:
  - 야훼의 손이 ... 드러날 것이며
  - 야훼의 손이 ... 나타날 것이며
  lexicon: WLC/HALOT
  rationale: ‘손’은 하나님의 գործող적 능력/개입을 뜻하는 관용구로 보존했고, נוֹדְעָה는 수동적으로 ‘알려질’로 옮겨 드러남과 인식의 뉘앙스를 살렸습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들에게
  alternatives_korean:
  - 그의 종들에게로
  - 그의 종들 가운데
  lexicon: WLC/HALOT
  rationale: 이 문맥에서는 신분 강조보다 야훼께 속한 사람들을 가리키는 일반적 의미가 우선하므로 ‘종들’로 옮겼습니다.
- source_word: וְזָעַם
  english_pob_choice: he will be indignant
  chosen_korean: 분노하실 것입니다
  alternatives_korean:
  - 노여워하실 것입니다
  - 진노하실 것입니다
  lexicon: WLC/HALOT
  rationale: 히브리어의 감정적 분개/격분을 현대 한국어에서 분명하게 전달하는 표현으로, 문맥상 더 강한 ‘진노’보다는 ‘분노’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 연결사 וְ를 한국어에서 어떻게 처리할지
  chosen_reading: ‘그리고’에 해당하는 단순 연결로 처리해, 앞절의 은혜와 뒤절의 심판을 병렬로 제시했습니다.
  alternative_readings:
  - ‘그러나’로 옮겨 대조를 드러내는 해석
  - 문맥상 ‘하지만’으로 강화하는 번역
  rationale: 히브리어 접속사 자체는 단순한 ‘그리고’이므로, 대조는 독자가 문맥에서 읽도록 두고 한국어에서 추가된 역접을 피했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 본 프로젝트 기본값에 따라 신명 사본의 발음을 반영한 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
