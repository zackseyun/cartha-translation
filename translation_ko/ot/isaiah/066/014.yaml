  naturalness: ‘너희 뼈는 풀처럼 무성하게 될 것입니다’는 한국어에서 뼈와 ‘무성하다’의 결합이 다소 어색합니다. ‘너희의 뼈가 풀처럼 돋아날 것입니다’는 비유적 표현을 유지하면서 현대 표준 한국어로 자연스럽습니다. 또한 ‘너희 마음’과 ‘너희의 뼈’를 사용하여 소유 관계를 분명히 했습니다.
