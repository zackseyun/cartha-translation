id: ISA.66.18
reference: Isaiah 66:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֗י מַעֲשֵׂי/הֶם֙ וּ/מַחְשְׁבֹ֣תֵי/הֶ֔ם בָּאָ֕ה לְ/קַבֵּ֥ץ אֶת כָּל הַ/גּוֹיִ֖ם וְ/הַ/לְּשֹׁנ֑וֹת וּ/בָ֖אוּ וְ/רָא֥וּ אֶת כְּבוֹדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
  footnotes:
  - marker: a
    text: 'Hebrew is abrupt and difficult: literally, ''And I, their works and their thoughts, coming to gather all the nations and the tongues.'' Many understand the sense as ''For I know their works and their thoughts'' or ''The time is coming to gather all nations and tongues.'''
    reason: alternative_reading
  - marker: b
    text: Or 'languages.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 행위와 생각을 알고 있습니다[a]. 모든 민족과 언어를 모을 때가 오고 있으며[b], 그들은 와서 내 영광을 보게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이고 해석하기 어렵습니다. 문자적으로는 ‘그리고 나, 그들의 행위와 그들의 생각, 모든 민족과 언어를 모으러 오고 있다’에 가깝습니다. 이를 ‘나는 그들의 행위와 생각을 안다’ 또는 ‘모든 민족과 언어를 모을 때가 오고 있다’로 이해하는 견해가 많습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘방언들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  english_pob_choice: And I / For I
  chosen_korean: 나는
  alternatives_korean:
  - 그리고 나는
  - 내가
  lexicon: HALOT
  rationale: 강조적 독립 인칭대명사 אָנֹכִי를 살려 주어를 분명히 하되, 한국어에서는 자연스럽게 ‘나는’으로 시작해 단절감을 과도하게 만들지 않았습니다.
- source_word: מַעֲשֵׂיהֶם
  english_pob_choice: their works
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 일들
  - 그들의 행위들
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 여기서 도덕적 행위/행적의 의미가 강하므로 ‘행위’가 가장 간명합니다.
- source_word: וּמַחְשְׁבֹתֵיהֶם
  english_pob_choice: their thoughts
  chosen_korean: 그들의 생각
  alternatives_korean:
  - 그들의 계획
  - 그들의 의도
  lexicon: HALOT
  rationale: מַחְשָׁבוֹת는 ‘생각, 계획, 의도’까지 넓게 갈 수 있으나, 병렬 구조를 살려 가장 직접적인 ‘생각’으로 옮겼습니다.
- source_word: כָּל־הַגּוֹיִם וְהַלְּשֹׁנוֹת
  english_pob_choice: all the nations and tongues
  chosen_korean: 모든 나라들과 언어들
  alternatives_korean:
  - 모든 민족들과 언어들
  - 모든 나라들과 방언들
  lexicon: HALOT
  rationale: גּוֹיִם은 국제적 범주의 ‘나라들’로, לְשׁוֹנוֹת는 문자적으로는 ‘혀들’이지만 문맥상 언어 집단을 가리키므로 ‘언어들’이 자연스럽습니다.
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 나의 영광
  - 내 영채
  lexicon: HALOT
  rationale: כָּבוֹד는 이사야에서 하나님의 현현적 영광을 가리키므로, 신학적 무게를 유지하는 ‘영광’이 적절합니다.
theological_decisions:
- issue: 첫 절반의 불완전한 히브리어 구문을 어떻게 한국어로 처리할지
  chosen_reading: MT의 압축성을 존중하되, 한국어에서는 ‘나는 그들의 행위와 그들의 생각을 아노라’로 풀어 자연스러운 문장으로 만들고, 뒤이어 심판/수집 선언이 이어지게 했습니다.
  alternative_readings:
  - ‘내가 그들의 행위와 그들의 생각과 함께 와서 모든 나라들과 언어들을 모은다’
  - ‘그들의 행위와 그들의 생각 때문에 내가 모든 나라들과 언어들을 모으러 온다’
  rationale: 히브리어 본문은 매우 생략적이어서 직역하면 한국어 문장성이 무너집니다. POB의 주석적 해석을 따라 핵심 의미를 드러내되, 본문에 없는 ‘때’ 같은 요소는 본문에 넣지 않았습니다.
  doctrine_reference: 본문의 생략을 과도하게 매끈하게 만들지 않고, 의미를 보존하는 최적등가 번역
