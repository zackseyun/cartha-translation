    issue: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ의 명사 מָשׂוֹשׂ가 본문 번역에서 빠져 있습니다.
    rationale: ‘그와 함께 환호하십시오’는 동사의 기본 뜻은 전달하지만, 히브리어가 동족어 명사로 더한 강조를 반영하지 못합니다.
  - severity: medium
    issue: ‘그를 위해 슬퍼하는’은 עָלֶיהָ의 의미를 다소 부정확하게 처리합니다.
    rationale: 이 전치사구는 예루살렘을 애도의 대상·계기로 가리킵니다. ‘예루살렘을 두고 슬퍼하는’이 이를 더 직접적으로 보존합니다.
  - severity: low
    issue: 도시를 가리키는 ‘그’를 반복하여 지시 대상과 문체가 다소 어색합니다.
