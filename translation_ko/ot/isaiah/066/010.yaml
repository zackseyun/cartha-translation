id: ISA.66.10
reference: Isaiah 66:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂמְח֧וּ אֶת יְרוּשָׁלִַ֛ם וְ/גִ֥ילוּ בָ֖/הּ כָּל אֹהֲבֶ֑י/הָ שִׂ֤ישׂוּ אִתָּ/הּ֙ מָשׂ֔וֹשׂ כָּל הַ/מִּֽתְאַבְּלִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
  footnotes:
  - marker: a
    text: Or 'Rejoice over Jerusalem.' The Hebrew construction with אֶת after 'rejoice' can be understood as marking Jerusalem as the object of rejoicing, though the parallel phrases 'in her' and 'with her' favor the sense of shared joy.
    reason: lexical_alternative
  - marker: b
    text: Or 'exult with her with joy' / 'rejoice with her greatly.' The Hebrew uses a cognate noun after the verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘과 함께[a] 기뻐하십시오. 예루살렘을 사랑하는 모든 이들아, 그 안에서 즐거워하십시오. 예루살렘과 함께 기쁨으로[b] 기뻐하십시오, 예루살렘을 두고 슬퍼하는 모든 이들아.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘을 두고 기뻐하십시오.’ 히브리어의 אֶת은 여기서 예루살렘을 기쁨의 대상으로도, 함께 기뻐하는 상대로도 이해할 수 있습니다. 뒤의 ‘그 안에서’와 ‘그와 함께’라는 병행 표현은 함께 기뻐한다는 뜻을 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘과 함께 크게 기뻐하십시오’ 또는 ‘예루살렘과 함께 환희로 기뻐하십시오.’ 히브리어는 동사 뒤에 같은 어근의 명사를 써서 기쁨을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת יְרוּשָׁלִַם
  english_pob_choice: Rejoice with Jerusalem
  chosen_korean: 예루살렘과 함께 기뻐하십시오
  alternatives_korean:
  - 예루살렘을 두고 기뻐하십시오
  - 예루살렘으로 말미암아 기뻐하십시오
  lexicon: HALOT
  rationale: אֶת이 여기서는 단순 목적어보다 ‘함께/대상과 더불어’의 뉘앙스로 읽히며, 뒤의 병행구와 맞추어 공동의 기쁨을 살렸습니다.
- source_word: וְגִילוּ בָהּ
  english_pob_choice: be glad in her
  chosen_korean: 그 안에서 기뻐하십시오
  alternatives_korean:
  - 그 안에서 즐거워하십시오
  - 그녀를 기뻐하십시오
  lexicon: HALOT
  rationale: בָּהּ의 ‘그 안에서’는 예루살렘의 인격화된 도시 이미지를 보존하면서도 한국어로 자연스럽게 옮길 수 있어 이를 택했습니다.
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  english_pob_choice: rejoice with her in joy
  chosen_korean: 그와 함께 환호하십시오
  alternatives_korean:
  - 그와 함께 크게 기뻐하십시오
  - 그와 함께 기뻐 또 기뻐하십시오
  lexicon: HALOT
  rationale: 두 번째 기쁨 동사와 명사형이 결합해 반복 강조를 이루므로, 의미를 살리되 한국어에서는 ‘환호하십시오’로 응답의 강도를 드러냈습니다.
- source_word: כָּל הַמִּתְאַבְּלִים עָלֶיהָ
  english_pob_choice: all you who mourn over her
  chosen_korean: 그를 위해 슬퍼하는 모든 이들아
  alternatives_korean:
  - 그를 두고 슬퍼하는 모든 이들아
  - 그를 애통해하는 모든 이들아
  lexicon: HALOT
  rationale: עַל의 슬픔 대상/이유 용법을 따라 ‘~을 위해/두고 슬퍼하다’로 옮겼고, 문맥상 예루살렘을 가리키는 여성형 대명사를 한국어에서는 지칭에 부담 없는 ‘그’로 처리했습니다.
