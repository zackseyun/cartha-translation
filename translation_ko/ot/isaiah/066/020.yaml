source:
  edition: WLC
  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'covered wagons' for the rare term translated 'litters.'
    reason: lexical_alternative
  - marker: b
    text: Or 'swift camels' for the rare term translated 'dromedaries.'
    reason: lexical_alternative
  - marker: c
    text: '''Brothers'' may carry a broader kinship sense here, not only male siblings.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 모든 나라에서 당신의 모든 형제들[c]을 야훼께 드리는 예물로, 말과 병거와 들것[a]과 노새와 낙타[b]를 타고 내 거룩한 산 예루살렘으로 데려올 것입니다. 야훼께서 말씀하십니다. 이스라엘 자손이 정결한 그릇에 예물을 담아 야훼의 집으로 가져오는 것과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀어로, 정확한 운송수단은 확정하기 어렵습니다. 여기서는 사람을 실어 나르는 운반구로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 고대 히브리어의 희귀어는 ‘빠른 낙타’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘형제들’은 문자적 형제에만 국한되지 않고 동족이나 친족을 넓게 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיאוּ
  english_pob_choice: And they will bring
  chosen_korean: 데려올 것입니다
  alternatives_korean:
  - 가져올 것입니다
  - 데려다 줄 것입니다
  lexicon: HALOT
  rationale: 히필의 ‘가져오다/데려오다’ 의미를 살리면서, 예언적 미래를 한국어의 자연스러운 미래형으로 옮겼습니다.
- source_word: כָּל אֲחֵיכֶם
  english_pob_choice: all your brothers
  chosen_korean: 당신의 형제들
  alternatives_korean:
  - 당신의 형제자매들
  - 당신의 친족들
  lexicon: HALOT
  rationale: 히브리어 אָח의 기본 의미를 살려 ‘형제들’로 두되, 영어 POB의 주석처럼 넓은 친족/동족적 의미는 문맥에서 읽히도록 했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 프로젝트 기본어인 ‘야훼’를 따르고, 여격 표지를 한국어 조사와 높임형으로 자연스럽게 반영했습니다.
- source_word: בַּ/צַּבִּים
  english_pob_choice: in litters
  chosen_korean: 들것
  alternatives_korean:
  - 가마
  - 덮개 달린 수레
  lexicon: HALOT
  rationale: 희귀어로서 정확한 운송수단이 불확실하므로, 사람을 실어 나르는 운반구라는 최소 의미를 살려 ‘들것’으로 옮겼습니다.
- source_word: וּ/בַ/כִּרְכָּר֗וֹת
  english_pob_choice: on camels
  chosen_korean: 낙타
  alternatives_korean:
  - 빠른 낙타
  - 낙타들
  lexicon: HALOT
  rationale: 영어 POB의 최신 판정과 어휘 불확실성을 반영하여, 한국어에서는 가장 자연스러운 동물명 ‘낙타’로 옮겼습니다.
- source_word: בִּ/כְלִ֥י טָה֖וֹר
  english_pob_choice: in a clean vessel
  chosen_korean: 정결한 그릇
  alternatives_korean:
  - 깨끗한 그릇
  - 의례적으로 정결한 그릇
  lexicon: HALOT
  rationale: טָהוֹר의 의례적 정결 의미를 살리기 위해 ‘정결한’으로 옮겼고, כְּלִי는 문맥상 일반적인 용기인 ‘그릇’이 가장 읽기 좋습니다.
theological_decisions:
- issue: ‘야훼께 예물로’의 제의적 방향
  chosen_reading: 이동의 목적을 단순한 선물이 아니라 제의적 헌물로 분명히 드러내어, 이방 민족들 가운데서 모여 오는 형제들의 귀환을 예배 행위로 읽히게 했습니다.
  alternative_readings:
  - ‘예물로’ 대신 ‘공물로’
  - 제의적 의미를 약화해 ‘선물로’
  rationale: מִנְחָה는 단순 증여보다 제의적 헌물/예물을 강하게 가리키며, 바로 뒤의 성전 비교가 이를 뒷받침합니다.
  doctrine_reference: 예언서의 성전-예배 이미지 보존
- issue: ‘형제들’의 범위
  chosen_reading: 주된 의미는 이스라엘의 흩어진 동족을 가리키되, 민족들 가운데서 모아 오는 종말론적 회복의 울림도 함께 보존했습니다.
  alternative_readings:
  - 이방인의 회심자들을 가리킨다
  - 모든 예배자를 포괄하는 상징이다
  rationale: 직접적인 호칭은 ‘당신의 형제들’이므로 이스라엘 중심의 회복상을 유지하는 것이 가장 소스에 가깝습니다.
  doctrine_reference: 해석의 긴장을 해소하지 않고 보존
