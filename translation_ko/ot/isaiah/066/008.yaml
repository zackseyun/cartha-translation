  terminology: ‘시온’, ‘땅’, ‘민족’, ‘진통’, ‘자녀들’은 문맥 및 출산 비유에 적절합니다. בָּנֶיהָ의 집합적 의미는 본문에서 ‘자녀들’로 유지하고, 형태상 남성 복수인 대안은 각주에 제시합니다.
