id: ISA.66.8
reference: Isaiah 66:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'her sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일은 누가 들어본 적이 있습니까? 이런 것들을 누가 보았습니까? 한 땅이 하루 만에 낳아질 수 있습니까? 한 민족이 한꺼번에 태어날 수 있습니까? 시온이 진통하자마자 자기 자녀들을 낳았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 아들들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי שָׁמַע כָּזֹאת
  english_pob_choice: Who has heard such a thing?
  chosen_korean: 이런 일은 누가 들어본 적이 있습니까?
  alternatives_korean:
  - 누가 이런 일을 들은 적이 있습니까?
  - 누가 이런 것을 들어본 적이 있습니까?
  lexicon: WLC/HALOT
  rationale: 수사적 질문의 놀라움을 살리면서, כָּזֹאת의 지시성을 자연스럽게 '이런 일'로 옮겼습니다.
- source_word: מִי רָאָה כָּאֵלֶּה
  english_pob_choice: Who has seen things like these?
  chosen_korean: 이런 것들을 누가 보았습니까?
  alternatives_korean:
  - 누가 이와 같은 것들을 보았습니까?
  - 누가 이런 것들을 본 적이 있습니까?
  lexicon: WLC/HALOT
  rationale: 복수 지시를 살리되 한국어에서 더 자연스러운 수사 의문문으로 정리했습니다.
- source_word: הֲיּוּחַל אֶרֶץ
  english_pob_choice: Can a land be brought forth
  chosen_korean: 한 땅이 하루 만에 낳아질 수 있습니까?
  alternatives_korean:
  - 한 땅이 하루 만에 태어날 수 있습니까?
  - 땅이 하루 만에 생겨날 수 있습니까?
  lexicon: WLC/HALOT
  rationale: 출산 비유를 유지해야 하므로 '낳아지다'를 택했으며, '땅'은 지리적 영역을, '하루 만에'는 בְּיוֹם אֶחָד을 직역에 가깝게 옮겼습니다.
- source_word: אִם יִוָּלֵד גּוֹי
  english_pob_choice: Can a nation be born
  chosen_korean: 한 민족이 한꺼번에 태어날 수 있습니까?
  alternatives_korean:
  - 한 민족이 태어날 수 있습니까?
  - 한 나라가 한꺼번에 태어날 수 있습니까?
  lexicon: WLC/HALOT
  rationale: 지시적 병렬을 위해 '민족'을 택했고, פַּעַם אֶחָת의 동시성을 '한꺼번에'로 옮겨 수사적 충격을 살렸습니다.
- source_word: כִּי חָלָה גַּם יָלְדָה
  english_pob_choice: For Zion was in labor and also gave birth
  chosen_korean: 시온이 진통하자마자 자기 자녀들을 낳았습니다
  alternatives_korean:
  - 시온이 진통했고 또 자녀들을 낳았습니다
  - 시온이 해산의 고통을 겪었고 또한 자녀들을 낳았습니다
  lexicon: WLC/HALOT
  rationale: חָלָה의 해산 진통 이미지를 '진통하다'로 살리고, גַּם의 연결을 한국어에서 사건의 즉시성을 드러내는 표현으로 풀었습니다.
- source_word: בָּנֶיהָ
  english_pob_choice: her children
  chosen_korean: 자기 자녀들을
  alternatives_korean:
  - 그의 아들들을
  - 그 자녀들을
  lexicon: WLC/HALOT
  rationale: 형태상 '아들들'이지만 문맥상 집합적 후손을 가리키므로, 본문 의미를 따라 '자녀들'로 옮겼습니다.
theological_decisions:
- issue: 시온의 출산 비유 보존
  chosen_reading: 시온을 추상적 회복 개념이 아니라 자녀를 낳는 어머니로 그대로 유지했습니다.
  alternative_readings:
  - 나라의 회복을 뜻하는 비유로만 풀어 쓰기
  - 출산 이미지를 약화시켜 일반적 출생 은유로 바꾸기
  rationale: 히브리어 본문이 시온의 인격화와 산고/해산 이미지를 명시적으로 사용하므로, 이를 완화하지 않고 그대로 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: כִּי의 연결 방식
  chosen_reading: 뒤의 출산 서술을 앞의 수사 질문에 대한 설명/근거로 읽었습니다.
  alternative_readings:
  - 단순한 시간적 전환으로 읽기
  - 놀라움의 감탄사로만 처리하기
  rationale: כִּי는 여기서 앞선 불가능성 질문을 뒷받침하는 이유를 도입하므로, '왜냐하면/For'의 논리를 한국어에서도 유지했습니다.
  doctrine_reference: WLC syntax
