source:
  edition: WLC
  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
  footnotes:
  - marker: a
    text: Or 'stand' / 'endure' for both occurrences of the verb עמד ('stand, remain').
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 만들고 있는 새 하늘과 새 땅이 내 앞에 남아 있듯이,[a] 너희의 자손과 너희의 이름도 남아 있을 것이기 때문이다. 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 עמד는 문자적으로 ‘서다’이며, 이 구절의 두 용례 모두 문맥상 ‘남아 있다’ 또는 ‘존속하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַאֲשֶׁר
  english_pob_choice: For just as
  chosen_korean: “내가 … 것처럼”
  alternatives_korean:
  - “왜냐하면 …처럼”
  - “그때처럼”
  lexicon: HALOT
  rationale: כִּי의 원인·근거 기능과 כַאֲשֶׁר의 비교 구조를 한국어에서 자연스럽게 묶기 위해 ‘…것처럼’으로 옮겼습니다. 앞뒤의 כֵּן 상관구조가 살아나도록 했습니다.
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  english_pob_choice: the new heavens and the new earth
  chosen_korean: “새 하늘과 새 땅”
  alternatives_korean:
  - “새로운 하늘들과 새로운 땅”
  - “새 하늘들과 새 땅”
  lexicon: HALOT
  rationale: 한국어 관용과 예언서 어법을 고려해 복수형 느낌을 살리되 자연스럽게 ‘새 하늘과 새 땅’으로 옮겼습니다. 수식어 ‘새’는 מקור의 정관사와 형용사 결합을 간결하게 반영합니다.
- source_word: עֹמְדִים / יַעֲמֹד
  english_pob_choice: shall remain
  chosen_korean: “항상 서 있으리라 / 항상 서 있으리라”
  alternatives_korean:
  - “남아 있으리라”
  - “서 있으리라”
  - “견디리라”
  lexicon: HALOT
  rationale: 히브리어 עמד의 핵심 이미지는 ‘서다’이지만, 여기서는 앞뒤 비교에서 존속·지속의 뜻이 분명하므로 ‘서 있으리라’에 ‘항상’을 더해 지속성을 드러냈습니다. 두 번의 동사를 같은 표현으로 맞춰 비교의 힘을 보존했습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: “내 앞에”
  alternatives_korean:
  - “내 앞에서”
  - “내 임재 안에”
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘내 앞에’로 두어 공간적·관계적 긴장을 유지했습니다.
- source_word: זַרְעֲכֶם
  english_pob_choice: your offspring
  chosen_korean: “너희의 자손”
  alternatives_korean:
  - “너희의 후손”
  - “너희의 씨”
  lexicon: HALOT
  rationale: 집합적 후손 개념을 한국어에서 가장 자연스럽고 성경적으로 전달하는 말은 ‘자손’입니다. ‘씨’는 한국어에서 오해 소지가 커서 피했습니다.
theological_decisions:
- issue: ‘새 하늘과 새 땅’의 종말론적 범위
  chosen_reading: 우주적 새 창조를 직접 가리키는 표현으로 유지하고, 문자적 우주 갱신과 언약적 회복 사이의 해석 문제를 본문이 열어 둔 채로 두었습니다.
  alternative_readings:
  - 전적으로 문자적인 새 창조
  - 상징적 언약 회복
  rationale: 히브리어 표현의 폭을 해소하지 않고 그대로 살려, 본문이 지닌 종말론적 긴장을 유지했습니다.
  doctrine_reference: 본문이 명시하지 않는 범위는 해석으로 단정하지 않음
- issue: ‘야훼의 말씀’의 인용 표지와 예언 공식
  chosen_reading: ‘야훼의 말씀’으로 직접 옮기고, 인용문 안에 예언적 선언을 넣어 화자의 전환을 드러냈습니다.
  alternative_readings:
  - ‘여호와의 말씀’
  - ‘주님의 말씀’
  rationale: יהוה를 ‘야훼’로 유지하여 고유명사를 보존했고, נְאֻם의 예언 공식은 한국어에서 ‘말씀이니라’보다 현대적이면서도 엄숙한 ‘말씀’으로 처리했습니다.
  doctrine_reference: Tetragrammaton은 프로젝트 기본값인 ‘야훼’ 채택
