id: ISA.42.24
reference: Isaiah 42:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
  footnotes:
  - marker: a
    text: Hebrew 'to spoil/plunder' and 'to plunderers/looters'; the line pictures Jacob and Israel as handed over to be despoiled.
    reason: lexical_alternative
  - marker: b
    text: Or 'to his instruction' for 'to his law' (Hebrew torah).
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 야곱을 약탈의 대상으로[a] 내주고 이스라엘을 노략꾼들에게 넘겼습니까? 우리가 그분께 죄를 지은 바로 그분, 야훼께서 아니십니까? 그들은 그분의 길로 걷기를 원하지 않았고, 그분의 율법[b]도 듣지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약탈의 대상’과 ‘노략꾼들’은 히브리어의 ‘약탈의 대상’과 ‘약탈하는 자들’을 반영합니다. 이 표현은 야곱과 이스라엘이 약탈당하도록 넘겨졌음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 히브리어 토라의 번역입니다. 여기서는 ‘가르침’ 또는 ‘교훈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  english_pob_choice: to plunder
  chosen_korean: 약탈당하게 하고
  alternatives_korean:
  - 노략당하게 하고
  - 빼앗기게 하고
  lexicon: HALOT
  rationale: 주동의 ‘주다/내주다’와 결합해, 야곱과 이스라엘이 약탈의 대상이 되었음을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לְ/בֹזְזִים
  english_pob_choice: to looters
  chosen_korean: 노략꾼들에게
  alternatives_korean:
  - 약탈자들에게
  - 강탈자들에게
  lexicon: HALOT
  rationale: פע동형 분사ית이 가리키는 ‘빼앗는 자들’의 행위자성을 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: בְּ/תוֹרָתֽ/וֹ
  english_pob_choice: to his law
  chosen_korean: 그의 율법도
  alternatives_korean:
  - 그의 가르침도
  - 그의 교훈도
  lexicon: HALOT
  rationale: 토라의 기본 의미를 유지하되, 예언서 맥락에서 언약적 규범을 가리키는 것으로 읽어 ‘율법’을 택했습니다. 다만 ‘듣지 않았습니다’와 함께 문맥상 불순종을 드러냅니다.
- source_word: זוּ
  english_pob_choice: he against whom
  chosen_korean: 바로 우리가 그분께 죄를 지었습니다
  alternatives_korean:
  - 그분께
  - 그분을 향해
  lexicon: HALOT
  rationale: 히브리어의 지시적 강조를 한국어에서는 ‘바로’로 살리고, חטא ל의 관용적 의미를 ‘~께 죄를 짓다’로 옮겼습니다. 다만 직접적인 대상을 살려 관계적 책임을 분명히 했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 계약 이름을 보존하기 위해 음역형 ‘야훼’를 사용했습니다. 이는 본문의 고유한 신학적 표지를 약화시키지 않으려는 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 1인칭 고백과 3인칭 서술의 전환
  chosen_reading: ‘우리가 그분께 죄를 지었습니다’와 ‘그들은 원하지 않았고… 듣지 않았습니다’를 그대로 유지
  alternative_readings:
  - 모두 1인칭으로 평탄화
  - 모두 3인칭으로 정리
  rationale: 원문은 공동체의 고백과 그들의 행위를 서술하는 시점을 섞어 두고 있으므로, 그 긴장을 풀지 않고 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
