id: ISA.42.1
reference: Isaiah 42:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
  footnotes:
  - marker: a
    text: Or 'with whom I am pleased' for 'in whom my soul delights.'
    reason: lexical_alternative
  - marker: b
    text: '''Justice'' could also be rendered ''judgment''; the Hebrew mishpat can denote judicial decision, justice, or just order.'
    reason: lexical_alternative
  - marker: c
    text: In the New Testament, this verse is applied to Jesus the Messiah (see Matt 12:18).
    reason: cross_reference
translation:
  language: ko
  text: 보십시오, 내 종입니다. 내가 그를 붙들고, 내 선택한 이요, 내 영혼이 기뻐하는 이입니다. 내가 내 영을 그 위에 두었습니다. 그는 민족들에게 정의를 가져올 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하는’은 히브리어가 말하는 ‘내 영혼의 즐거움/기쁨’을 옮긴 것으로, ‘내가 기뻐하는’으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정의’는 여기서 법정 판결만이 아니라 민족들 가운데 세워질 바른 질서와 공의를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 신약에서는 이 구절이 예수 메시아에게 적용됩니다(마 12:18).
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  - 보십시오
  lexicon: HALOT
  rationale: 예언문맥의 주의를 환기하는 감탄적 도입어로서, 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 격식을 살립니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 일꾼
  - 내 노예
  - 나의 종
  lexicon: HALOT
  rationale: 이 구절의 예언적 종-모티프를 살리면서도 문맥에 불필요한 봉건적 뉘앙스를 피하려고 ‘종’을 기본값으로 유지했습니다.
- source_word: רָצְתָה נַפְשִׁי
  english_pob_choice: in whom my soul delights
  chosen_korean: 내 영혼이 기뻐하는 이
  alternatives_korean:
  - 내 영혼이 좋아하는 이
  - 내가 기뻐하는 이
  - 내 영혼이 만족하는 이
  lexicon: HALOT
  rationale: ‘내 영혼’의 강한 정서적 표현을 살리되, 한국어에서는 관용적으로 ‘기뻐하는 이’가 가장 자연스럽고 본문 의미를 충분히 전달합니다.
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 내 숨
  - 내 기운
  lexicon: HALOT
  rationale: 히브리어 원문 자체는 일반적으로 ‘영’이며, 여기서는 하나님의 내적/인격적 영의 능력 부여를 가리키므로 ‘성령’보다 원문에 더 직접적인 ‘내 영’을 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  - 공의
  lexicon: HALOT
  rationale: 문맥상 민족들을 향한 사법적 판결보다 하나님의 바른 질서와 공정한 통치를 드러내므로, POB의 ‘justice’를 한국어 ‘정의’로 옮겼습니다.
- source_word: לַגּוֹיִם
  english_pob_choice: to the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들에게
  - 이방들에게
  - 열방에게
  lexicon: HALOT
  rationale: ‘גוים’은 이스라엘 밖의 여러 민족들을 가리키므로, 후대 신학적 협소화를 피하면서 현대 한국어로는 ‘민족들’이 가장 무난합니다.
theological_decisions:
- issue: 구절의 종 정체성과 메시아적 함의
  chosen_reading: 본문에는 해석을 앞세우지 않고 ‘내 종’으로 두되, 사역의 방향과 후대 성취 가능성은 본문 밖에서 읽게 했습니다.
  alternative_readings:
  - 곧바로 메시아로 명시적으로 번역
  - 집단적 이스라엘로 한정
  rationale: 히브리어 본문 자체는 여기서 단지 ‘여호와의 종’을 말하므로, 번역문은 해석을 과잉 삽입하지 않고 원문 수준의 개방성을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1 and §3
- issue: רוּחִי의 번역과 신학적 뉘앙스
  chosen_reading: ‘내 영’으로 번역해 하나님의 능력 부여를 나타내면서도, 원문에 없는 교회적 고정 용어를 강제로 넣지 않았습니다.
  alternative_readings:
  - 내 성령
  - 내 영을
  rationale: 이 절은 하나님의 영이 종 위에 임하는 장면이지만, 히브리어 표면형은 פשוט히 ‘영’이므로 한국어에서도 원문 밀착을 우선했습니다.
  doctrine_reference: Translation philosophy §6
