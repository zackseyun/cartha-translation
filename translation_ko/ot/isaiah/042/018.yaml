id: ISA.42.18
reference: Isaiah 42:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/חֵרְשִׁ֖ים שְׁמָ֑עוּ וְ/הַ/עִוְרִ֖ים הַבִּ֥יטוּ לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
  footnotes:
  - marker: a
    text: Or 'the deaf ... the blind.' The Hebrew adjectives with the article can be read as direct address ('you deaf ... you blind') or as substantival descriptions ('the deaf ... the blind').
    reason: lexical_alternative
  - marker: b
    text: 'Or ''to see.'' The final phrase expresses purpose: ''look ... so that you may see.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “귀먹은 자들아, 들으십시오. 그리고 눈먼 자들아, 보십시오 — 보게 되도록 말입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '귀먹은 자들... 눈먼 자들.' 정관사 붙은 히브리어 형용사는 직접 호격('귀먹은 자들아... 눈먼 자들아')으로도, 명사화된 표현('귀먹은 자들... 눈먼 자들')으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '보도록.' 마지막 구는 목적을 나타내며, '보라… 보게 되도록'으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  english_pob_choice: you deaf
  chosen_korean: 귀먹은 자들아
  alternatives_korean:
  - 귀머거리들아
  - 청각장애인들아
  - 귀먹은 사람들아
  lexicon: HALOT
  rationale: 정관사 붙은 형용사를 직접 호격으로 읽는 해석을 살려, 문맥의 예언적 직접 호소를 한국어 호격 표현으로 옮겼습니다. '귀먹은 자들아'는 원문의 직설성과 병렬성을 가장 잘 유지합니다.
- source_word: שְׁמָעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  - 들으십시오!
  lexicon: HALOT
  rationale: 복수 명령형을 표준어 합쇼체 명령으로 옮겨, 예언적 촉구의 힘을 유지하면서도 현대 한국어 문체에 맞췄습니다.
- source_word: הַבִּיטוּ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 살피십시오
  - 응시하십시오
  - 보라
  lexicon: HALOT
  rationale: נבט의 히필 명령은 의도적으로 바라보게 하는 촉구이므로, 자연스러운 현대어 '보십시오'를 택해 '들으십시오'와 평행을 이루게 했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: that you may see
  chosen_korean: 보게 되도록 말입니다
  alternatives_korean:
  - 보도록
  - 보게 하려는 것입니다
  - 보게 되게 하십시오
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לִרְאוֹת를 단순한 부정사로 두기보다, 명령의 목적을 드러내는 한국어로 풀어 원문의 의도성을 살렸습니다.
theological_decisions:
- issue: '''deaf''와 ''blind''를 문자적으로 유지할지, 즉시 영적 무감각으로 풀어 쓸지'
  chosen_reading: 본문의 구체적 감각어를 그대로 유지해, 비유적 의미는 문맥이 드러내게 했습니다.
  alternative_readings:
  - 영적으로 귀먹은 자들
  - 영적으로 눈먼 자들
  - 무감각한 자들
  rationale: 이사야 42장의 이미지가 이스라엘의 불응을 가리키더라도, 히브리어는 구체적 감각어를 사용합니다. 본문의 언어적 긴장을 보존하는 것이 원문의 선명한 예언적 이미지를 더 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원어의 이미지와 신학적 긴장을 번역에서 미리 해석해 없애지 않음.'
