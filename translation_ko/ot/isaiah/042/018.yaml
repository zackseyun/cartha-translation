  lexicon: HALOT
  rationale: 복수 명령형을 표준어 합쇼체 명령으로 옮겨, 예언적 촉구의 힘을 유지하면서도 현대 한국어 문체에 맞췄습니다.
- source_word: הַבִּיטוּ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 살피십시오
  - 응시하십시오
  - 보라
  lexicon: HALOT
  rationale: נבט의 히필 명령은 의도적으로 바라보게 하는 촉구이므로, 자연스러운 현대어 '보십시오'를 택해 '들으십시오'와 평행을 이루게 했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: that you may see
  chosen_korean: 보게 되도록 말입니다
  alternatives_korean:
  - 보도록
  - 보게 하려는 것입니다
  - 보게 되게 하십시오
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לִרְאוֹת를 단순한 부정사로 두기보다, 명령의 목적을 드러내는 한국어로 풀어 원문의 의도성을 살렸습니다.
theological_decisions:
- issue: '''deaf''와 ''blind''를 문자적으로 유지할지, 즉시 영적 무감각으로 풀어 쓸지'
  chosen_reading: 본문의 구체적 감각어를 그대로 유지해, 비유적 의미는 문맥이 드러내게 했습니다.
  alternative_readings:
  - 영적으로 귀먹은 자들
  - 영적으로 눈먼 자들
  - 무감각한 자들
  rationale: 이사야 42장의 이미지가 이스라엘의 불응을 가리키더라도, 히브리어는 구체적 감각어를 사용합니다. 본문의 언어적 긴장을 보존하는 것이 원문의 선명한 예언적 이미지를 더 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원어의 이미지와 신학적 긴장을 번역에서 미리 해석해 없애지 않음.'
