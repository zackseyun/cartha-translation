  - 청각장애인들아
  - 귀먹은 사람들아
  lexicon: HALOT
  rationale: 정관사 붙은 형용사를 직접 호격으로 읽는 해석을 살려, 문맥의 예언적 직접 호소를 한국어 호격 표현으로 옮겼습니다. '귀먹은 자들아'는 원문의 직설성과 병렬성을 가장 잘 유지합니다.
- source_word: שְׁמָעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
