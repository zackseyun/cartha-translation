  source_fidelity: 개정이 필요합니다. לְאָחוֹר는 ‘이후의 일’을 목적어로 제시하는 말이 아니라, 뒤따르는 청취 행위의 시간적·목적적 범위를 나타냅니다. 따라서 ‘이후 일을 듣다’는 원문에 없는 목적어를 보충하여 뜻을 바꿉니다. יַאֲזִין과 יַקְשִׁב וְיִשְׁמַע의 청취·주의 동작의 병렬도 유지해야 합니다.
