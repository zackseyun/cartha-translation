id: ISA.42.23
reference: Isaiah 42:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֥י בָ/כֶ֖ם יַאֲזִ֣ין זֹ֑את יַקְשִׁ֥ב וְ/יִשְׁמַ֖ע לְ/אָחֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
  footnotes:
  - marker: a
    text: Or 'for the future,' 'hereafter,' or 'afterward.' The Hebrew literally has 'for behind/back,' used idiomatically for what comes later.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 누가 이 일을 들으려고 하며, 주의를 기울여 이후 일을 들으려 하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְאָחוֹר는 문자적으로는 '뒤로/뒤에'이지만, 여기서는 관용적으로 '이후, 앞으로 올 일'의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  english_pob_choice: Who among you
  chosen_korean: 너희 가운데 누가
  alternatives_korean:
  - 너희 중 누가
  - 너희 가운데서 누가
  lexicon: HALOT
  rationale: 반문형 질문으로서 공동체 내부의 대상을 묻는 표현이므로, '너희 가운데 누가'가 자연스럽고 원문의 집단적 호소를 잘 살립니다.
- source_word: יַאֲזִין זֹאת
  english_pob_choice: will listen to this
  chosen_korean: 이 일을 들으려고 하며
  alternatives_korean:
  - 이것을 들으려 하며
  - 이것에 귀를 기울이며
  lexicon: HALOT
  rationale: אזן의 Hiphil은 단순 청취보다 '귀를 기울이다/들으려고 하다'의 적극성을 띠므로, 선지자적 경고를 받는 태도를 드러내는 표현을 택했습니다.
- source_word: יַקְשִׁב וְיִשְׁמַע
  english_pob_choice: will pay attention and hear
  chosen_korean: 주의를 기울여 이후 일을 들으려 하겠습니까
  alternatives_korean:
  - 주의를 기울여 들으려 하겠습니까
  - 귀를 기울여 듣겠습니까
  lexicon: HALOT
  rationale: קשב와 שמע의 유사하지만 다른 동작을 살리기 위해 '주의를 기울이다'와 '듣다'를 분리했습니다. '들으려 하겠습니까'는 앞의 서두와 함께 문맥상 의지적 수용을 자연스럽게 표현합니다.
- source_word: לְאָחוֹר
  english_pob_choice: hereafter
  chosen_korean: 이후
  alternatives_korean:
  - 훗날
  - 장차
  - 뒤에
  lexicon: HALOT
  rationale: 직역하면 '뒤로/뒤에'이지만 관용적으로 '앞으로 올 일, 이후'를 뜻하므로, 예언적 맥락에 맞게 '이후'로 옮겼습니다.
theological_decisions:
- issue: 반문문의 수사적 기능
  chosen_reading: 본문은 단순 정보 질문이 아니라, 들을 귀 있는 자가 누구인지 도전하는 선지자적 반문으로 읽었습니다.
  alternative_readings:
  - 평범한 정보 질문으로 옮김
  - 완곡한 권유문으로 바꿈
  rationale: 히브리어의 연속된 청취 동사는 청중의 책임 있는 응답을 압박하는 수사 효과를 지니므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 선지자적 경고와 책임 있는 응답(이사야 42장 문맥)
