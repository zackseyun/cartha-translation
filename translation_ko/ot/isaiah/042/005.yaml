    text: 또는 ‘땅을 두드려 펴셨다.’ 히브리어 동사는 두드리거나 펼치는 이미지를 함께 불러일으킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 자손들’ 혹은 ‘그 산물들’. 히브리어는 땅에서 나오는 것을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영’ 대신 ‘숨’. 히브리어 רוּחַ는 ‘영’, ‘숨’, ‘바람’을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision follows the Hebrew participial chain by making the creation and life-giving descriptions modify ‘하나님 야훼께서.’ It improves the contextual Korean expression for walking on the earth, retains the lexical breadth of צֶאֱצָאֶיהָ, and relocates all footnote anchors to their proper words without adding interpretive content.
