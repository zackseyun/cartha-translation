id: ISA.42.5
reference: Isaiah 42:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
  footnotes:
  - marker: a
    text: Or 'hammered out the earth.' The Hebrew verb can evoke the idea of beating or spreading something out.
    reason: lexical_alternative
  - marker: b
    text: Or 'its offspring' or 'its produce' for 'what comes from it.'
    reason: lexical_alternative
  - marker: c
    text: Or 'breath' for 'spirit.' The Hebrew word can mean 'spirit,' 'breath,' or 'wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: '하늘을 창조하시고 펼치시며, 땅과 그곳에서 나오는 것들[b]을 펼치시고[a], 그 위에 있는 백성에게 숨을 주시며 그 위를 걸어 다니는 이들에게 영[c]을 주시는 하나님 야훼께서 이같이 말씀하십니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 두드려 펴셨다.’ 히브리어 동사는 두드리거나 펼치는 이미지를 함께 불러일으킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 자손들’ 혹은 ‘그 산물들’. 히브리어는 땅에서 나오는 것을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영’ 대신 ‘숨’. 히브리어 רוּחַ는 ‘영’, ‘숨’, ‘바람’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  english_pob_choice: God, Yahweh
  chosen_korean: 하나님, 야훼
  alternatives_korean:
  - 하나님, 여호와
  - 하나님 야훼
  lexicon: WLC / HALOT
  rationale: 히브리어의 보통명사 칭호 הָאֵל과 고유명 יְהוָה를 모두 살려, 전통적 관용구보다 본문이 직접 말하는 두 칭호를 병기했습니다.
- source_word: בּוֹרֵא הַשָּׁמַיִם וְנֹטֵיהֶם
  english_pob_choice: who created the heavens and stretched them out
  chosen_korean: 하늘들을 창조하시고 그것들을 펼치셨으며
  alternatives_korean:
  - 하늘을 창조하시고 그것들을 펼치셨으며
  - 하늘들을 지으시고 그것들을 펴셨으며
  lexicon: HALOT
  rationale: 복수형 하늘들을 유지하고, נָטָה의 ‘펼치다/늘이다’ 이미지를 살려 우주 창조의 동작성을 드러냈습니다.
- source_word: רֹקַע הָאָרֶץ וְצֶאֱצָאֶיהָ
  english_pob_choice: who spread out the earth and its offspring
  chosen_korean: 땅과 그 산물들을 펼치시고
  alternatives_korean:
  - 땅과 그 자손들을 펼치시고
  - 땅과 그 소출을 펴시고
  lexicon: HALOT
  rationale: צֶאֱצָאִים 계열의 넓은 의미를 좁히지 않기 위해 ‘산물들’로 옮겨, 땅에서 나오는 것들을 포괄적으로 살렸습니다.
- source_word: נֹתֵן נְשָׁמָה ... וְרוּחַ
  english_pob_choice: who gives breath ... and spirit
  chosen_korean: 숨을 주시며 ... 영을 주십니다
  alternatives_korean:
  - 생기를 주시며 ... 호흡을 주십니다
  - 호흡을 주시며 ... 바람을 주십니다
  lexicon: HALOT
  rationale: נְשָׁמָה와 רוּחַ의 구분을 유지하되, 한국어에서는 ‘숨/영’의 짝이 자연스럽고 본문의 생명 부여와 인격적 생기 부여를 함께 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 기록된 신명 יְהוָה를 직접 반영해 고유명성을 보존했습니다. 본문 자체의 신적 발화를 희석하지 않기 위해 ‘주’로 대체하지 않았습니다.
  doctrine_reference: 'POB default glossary: יהוה / YHWH → 야훼'
- issue: נְשָׁמָה와 רוּחַ의 구별 유지
  chosen_reading: 숨 ... 영
  alternative_readings:
  - 숨 ... 숨
  - 생기 ... 숨
  rationale: 두 어휘를 같은 말로 합치면 히브리어가 의도한 미세한 구분이 사라지므로, 생명 유지의 숨과 인간 존재 안의 영적 차원을 구별해 옮겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
