- from: 맹인의 눈을 뜨게 하며, 갇힌 자를 감금에서 이끌어 내고, 어둠 속에 앉아 있는 자들을 감옥에서 나오게 하려 하심이라.[a][b][c]
  to: 맹인의 눈을[a] 뜨게 하고, 갇힌 이를 감금에서[b] 이끌어 내며, 어둠 속에 앉아 있는 이들을[c] 감옥에서 나오게 하시려는 것이다.
  rationale: 목적 부정사의 기능을 자연스러운 현대 한국어로 드러내도록 종결을 고쳤습니다. ‘맹인’, ‘갇힌 이’, ‘감금’, ‘감옥’, ‘어둠’이라는 원문의 이미지는 유지했고, 영적 의미를 본문에 덧붙이지 않았습니다. 각주 표지는 해당 어구 바로 뒤로 옮겼으며, b 각주는 מַסְגֵּר의 상태·장소 양쪽 가능성을 더 명료하게 설명합니다.
