  text: לִ/פְקֹ֖חַ עֵינַ֣יִם עִוְר֑וֹת לְ/הוֹצִ֤יא מִ/מַּסְגֵּר֙ אַסִּ֔יר מִ/בֵּ֥ית כֶּ֖לֶא יֹ֥שְׁבֵי חֹֽשֶׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/007.yaml
  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
  footnotes:
  - marker: a
    text: Or 'the eyes of the blind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the dungeon' or 'from the prison'; the Hebrew term can denote confinement or a place of restraint.
    reason: lexical_alternative
  - marker: c
    text: Or 'those dwelling in darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 맹인의 눈을 뜨게 하며, 갇힌 자를 감금에서 이끌어 내고, 어둠 속에 앉아 있는 자들을 감옥에서 나오게 하려 하심이라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹인의 눈을’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘감옥에서’나 ‘감금에서’; 히브리어는 구금 상태나 그 장소를 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘어둠 속에 거하는 자들’.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְקֹחַ עֵינַיִם עִוְרוֹת
  english_pob_choice: to open blind eyes
  chosen_korean: 맹인의 눈을 뜨게 하며
  alternatives_korean:
  - 눈먼 눈을 열어
  - 눈먼 자의 눈을 뜨게 하며
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’이 직접 목적어이고 ‘맹인’이 그 상태를 규정하므로, 한국어에서는 자연스러운 관용인 ‘눈을 뜨게 하다’를 쓰되 ‘맹인’을 앞에 두어 원문의 이미지를 살렸습니다.
- source_word: לְהוֹצִיא מִמַּסְגֵּר אַסִּיר
  english_pob_choice: to bring a prisoner out from confinement
  chosen_korean: 갇힌 자를 감금에서 이끌어 내고
  alternatives_korean:
  - 죄수를 감옥에서 데리고 나오고
  - 포로를 구속에서 끌어내고
  lexicon: HALOT
  rationale: מַּסְגֵּר은 특정 건물보다 ‘가둠/구속’의 상태를 넓게 가리킬 수 있어, 한국어도 ‘감금’으로 상태를 살렸습니다. אַסִּיר는 ‘종’이나 ‘포로’보다 문맥상 ‘갇힌 자’가 가장 직접적입니다.
- source_word: מִבֵּית כֶּלֶא
  english_pob_choice: from the prison house
  chosen_korean: 감옥에서
  alternatives_korean:
  - 감옥집에서
  - 감금의 집에서
  lexicon: HALOT
  rationale: ‘집’+‘감옥’의 히브리어 이미지는 살되, 현대 한국어에서는 ‘감옥’이 가장 자연스럽고 읽기 쉬워 본문에서는 간결하게 옮겼습니다.
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  english_pob_choice: those who sit in darkness
  chosen_korean: 어둠 속에 앉아 있는 자들
  alternatives_korean:
  - 어둠 속에 거하는 자들
  - 어둠에 사는 자들
  lexicon: HALOT
  rationale: ישב의 기본 이미지를 ‘앉아 있다’로 보존해, 단순한 거주보다 지속적으로 한 상태에 머무는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 구원의 이미지의 문자적·상징적 긴장
  chosen_reading: 본문의 구체적 이미지(맹인, 갇힘, 감옥, 어둠)를 그대로 유지하고, 영적 해석을 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 눈먼 자를 영적으로 깨우는 것
  - 죄와 사망의 속박에서의 해방
  rationale: 이 절은 종의 사명을 묘사하면서도 표현 자체는 시적·구체적 이미지를 사용하므로, 본문이 말하는 바를 과장 없이 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
