theological_decisions:
- issue: 모든 피조물과 지역에 대한 보편적 찬양 초대의 표현
  chosen_reading: 문장 전체를 직접 초대로 유지해, 땅 끝·바다·섬들에 있는 자들이 모두 야훼를 찬양하도록 부르는 구조를 살렸습니다.
  alternative_readings:
  - 서술형으로 완화해 번역
  - ‘부르십시오’ 대신 ‘노래하게 하십시오’
  rationale: 본문은 단순한 설명이 아니라 예언적 명령과 초대이므로, 명령문을 유지해야 시적 긴장과 포괄성이 보존됩니다.
  doctrine_reference: 예언서의 보편적 찬양 초대(창조 세계 전체의 응답)
