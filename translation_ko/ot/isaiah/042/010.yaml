source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the end of the earth''; many English versions render the idiom as ''from the ends of the earth.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the islands'; the Hebrew term can refer broadly to islands or distant coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 새 노래를 부르십시오[a]. 땅 끝에서 그의 찬양을, 바다로 내려가는 이들과 그 안에 가득한 모든 것[b], 곧 섬들과 그 가운데 사는 자들도 함께하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘땅 끝에서’라는 단수 표현입니다. 영어 번역들에서는 흔히 ‘땅 끝들에서’라는 관용구로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 안에 있는 모든 것’. 히브리어는 바다를 채우는 것 전체를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 부르십시오
  alternatives_korean:
  - 노래하십시오
  - 부르세요
  lexicon: HALOT
  rationale: 히브리어 복수 명령형의 직접적 권면을 살리면서, 한국어에서는 ‘노래를 부르다’가 가장 자연스럽고 공적인 초대 표현입니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 고유명칭을 ‘야훼’로 옮겨, 예배의 대상이 되는 언약 이름을 드러냈습니다.
- source_word: מִקְצֵה הָאָרֶץ
  english_pob_choice: from the end of the earth
  chosen_korean: 땅 끝에서
  alternatives_korean:
  - 땅의 끝에서
  - 땅의 끝들에서
  lexicon: HALOT
  rationale: 히브리어 단수 표현을 유지하되, 한국어에서는 ‘땅 끝’이 가장 간결하고 관용적인 대응입니다.
- source_word: אִיִּים
  english_pob_choice: the coastlands
  chosen_korean: 섬들
  alternatives_korean:
  - 해안 지역들
  - 해안들
  lexicon: HALOT
  rationale: 문맥상 먼 바다의 지역들을 가리키는 말이므로, 한국어 독자에게는 ‘섬들’이 가장 넓고 자연스럽게 대응합니다.
theological_decisions:
- issue: 모든 피조물과 지역에 대한 보편적 찬양 초대의 표현
  chosen_reading: 문장 전체를 직접 초대로 유지해, 땅 끝·바다·섬들에 있는 자들이 모두 야훼를 찬양하도록 부르는 구조를 살렸습니다.
  alternative_readings:
  - 서술형으로 완화해 번역
  - ‘부르십시오’ 대신 ‘노래하게 하십시오’
  rationale: 본문은 단순한 설명이 아니라 예언적 명령과 초대이므로, 명령문을 유지해야 시적 긴장과 포괄성이 보존됩니다.
  doctrine_reference: 예언서의 보편적 찬양 초대(창조 세계 전체의 응답)
