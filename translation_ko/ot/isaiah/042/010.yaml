base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the end of the earth''; many English versions render the idiom as ''from the ends of the earth.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the islands'; the Hebrew term can refer broadly to islands or distant coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 새 노래를 부르십시오. 땅 끝에서부터 그분을 찬양하십시오[a]. 바다로 내려가는 이들이여, 바다에 가득한 모든 것이여, 섬들[b]과 그 주민들이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수로 ‘땅 끝에서’라고 합니다. 많은 영어 번역은 이를 관용적으로 ‘땅 끝들에서’라고 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해안 지역들’. 히브리어는 섬뿐 아니라 먼 해안 지역을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
