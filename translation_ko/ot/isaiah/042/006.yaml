id: ISA.42.6
reference: Isaiah 42:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
  footnotes:
  - marker: a
    text: Or 'in justice.' The Hebrew צֶדֶק can denote righteousness or justice.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will keep you' or 'I will guard you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for a light to the nations'; 'nations' may also be rendered 'Gentiles' in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼[a]입니다. 내가 너를 의로 불렀고, 네 손을 붙잡을 것이며, 너를 지키고[b] 너를 백성을 위한 언약으로, 민족들을 위한 빛으로[c] 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의로’. 히브리어 צֶדֶק은 의와 정의를 아울러 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보호하고’ 혹은 ‘간직하고’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘민족들에게 비치는 빛으로’; גּוֹיִם은 문맥에 따라 ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명(神名) יְהוָה를 직함으로 바꾸지 않고 음역하여, POB의 원문 직결 원칙을 한국어로 반영했습니다.
- source_word: בְצֶדֶק
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 가운데
  - 정의로
  lexicon: HALOT
  rationale: צֶדֶק의 의미 범위를 좁히지 않기 위해, 명사형을 유지하는 직역에 가까운 ‘의로’를 택했습니다.
- source_word: וְאֶצָּרְךָ
  english_pob_choice: I will keep you
  chosen_korean: 너를 지키고
  alternatives_korean:
  - 너를 보호하고
  - 너를 간직하고
  lexicon: HALOT
  rationale: נצר는 지키다/보호하다의 뜻을 가지므로, 현대 한국어에서 가장 자연스럽고 보존력 있는 ‘지키다’를 사용했습니다.
- source_word: לִבְרִית עָם
  english_pob_choice: as a covenant for the people
  chosen_korean: 백성을 위한 언약으로
  alternatives_korean:
  - 백성과 맺는 언약으로
  - 백성의 언약으로
  lexicon: HALOT
  rationale: לִבְרִית의 기능을 결과·목적의 표현으로 살리면서, 인격적 주체를 언약 자체로 제시하는 원문의 긴장을 유지했습니다.
- source_word: לְאוֹר גּוֹיִם
  english_pob_choice: as a light for the nations
  chosen_korean: 민족들을 위한 빛으로
  alternatives_korean:
  - 열방을 위한 빛으로
  - 민족들에게 비추는 빛으로
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 ‘민족들’로 옮겨, 이사야 문맥의 보편성을 살리되 후대 교회적 용어로 과도하게 고정하지 않았습니다.
theological_decisions:
- issue: ‘언약’의 대상과 역할을 어떻게 드러낼 것인가
  chosen_reading: ‘너를 백성을 위한 언약으로’라고 직설적으로 옮겨, 대상에게 주어지는 언약적 정체성을 그대로 남겼습니다.
  alternative_readings:
  - 언약의 중재자로
  - 백성을 위한 언약의 매개자로
  rationale: 원문은 인물을 언약의 성격 자체와 연결하므로, 해석을 앞세워 중재자로 풀지 않고 본문의 신학적 밀도를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 메시아적 해석의 여지를 열어 둠
