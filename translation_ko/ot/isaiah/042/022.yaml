id: ISA.42.22
reference: Isaiah 42:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
  footnotes:
  - marker: a
    text: Or possibly 'all of them are trapped among young men,' if בַּחוּרִים is taken in its more common sense 'young men'; the context, however, favors a sense like 'holes' or 'pits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이것은 약탈당하고 유린당한 백성입니다. 모두 굴속에 갇히고 감옥 집들에 숨겨졌습니다. 그들은 탈취물[ [a] ]이 되었으나 구해 주는 이가 없고, 노략거리일 뿐인데도 「돌려주라!」 하는 이가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모두 굴이나 구덩이들에 갇혔다’일 수 있습니다. בַּחוּרִים을 더 흔한 뜻인 ‘젊은이들’로 보면 ‘젊은이들 가운데에 갇혔다’가 되지만, 문맥은 굴/구덩이의 의미를 더 강하게 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא / עַם
  english_pob_choice: But this is a people
  chosen_korean: 그러나 이것은 … 백성입니다
  alternatives_korean:
  - 그리고 그는/그것은 … 백성입니다
  - 그러나 이것은 … 사람들입니다
  lexicon: HALOT
  rationale: 문맥상 앞 절과 대비되는 집합적 주어를 한국어에서는 ‘이것은 … 백성입니다’로 자연스럽게 드러내는 편이 원문 기능을 더 잘 살립니다.
- source_word: בָּזוּז וְשָׁסוּי
  english_pob_choice: plundered and pillaged
  chosen_korean: 약탈당하고 유린당한
  alternatives_korean:
  - 빼앗기고 노략당한
  - 약탈당하고 노략당한
  lexicon: HALOT
  rationale: 두 동의어의 중첩된 폭력을 살리기 위해 ‘약탈당하고 유린당한’으로 구분했습니다. ‘유린’은 단순한 도난보다 전쟁적 파괴감을 더 잘 반영합니다.
- source_word: הָפֵחַ בַּחוּרִים
  english_pob_choice: trapped in holes
  chosen_korean: 굴속에 갇히고
  alternatives_korean:
  - 구덩이들에 갇히고
  - 구덩이에 빠져
  lexicon: HALOT
  rationale: 문맥상 ‘젊은이들’보다 숨겨진 구덩이/굴의 이미지가 우세하므로, 가두어진 상태를 한국어에서 분명히 하는 ‘굴속에 갇히고’로 옮겼습니다.
- source_word: וּבְבָתֵּי כְלָאִים הָחְבָּאוּ
  english_pob_choice: hidden away in prison houses
  chosen_korean: 감옥 집들에 숨겨졌습니다
  alternatives_korean:
  - 감금의 집들에 숨겨졌습니다
  - 감옥들에 숨겨졌습니다
  lexicon: HALOT
  rationale: 직역하면 ‘감금의 집들’이지만, 현대 한국어에서 이해 가능성을 위해 ‘감옥 집들’로 유지해 히브리어의 구체적 이미지를 보존했습니다.
- source_word: הָיוּ לָבַז / מְשִׁשָּׂה
  english_pob_choice: They have become spoil ... plunder
  chosen_korean: 그들은 탈취물이 되었으나 … 노략거리일 뿐인데도
  alternatives_korean:
  - 그들은 전리품이 되었으나 … 약탈물이 되었으나
  - 그들은 노략물이 되었으나 …
  lexicon: HALOT
  rationale: 두 명사군을 각각 살려 ‘탈취물/노략거리’로 대응시켜, 반복되는 약탈 어휘를 평평하게 만들지 않았습니다.
- source_word: הָשַׁב
  english_pob_choice: Restore!
  chosen_korean: 돌려주라!
  alternatives_korean:
  - 회복하라!
  - 되돌려 주라!
  lexicon: HALOT
  rationale: 이 명령은 포로와 약탈물의 반환을 아우르는 호소이므로, 가장 직접적인 반환 명령인 ‘돌려주라!’가 적절합니다.
theological_decisions:
- issue: 종합적 폭력 이미지의 보존
  chosen_reading: 본문의 약탈·유린·감금·탈취·노략의 연쇄를 완화하지 않고 직설적으로 유지했습니다.
  alternative_readings:
  - 더 완곡한 ‘빼앗기고 억압당한’ 식의 표현
  - 단일한 ‘피해를 입은’으로 압축하는 번역
  rationale: 이 절은 회복 약속 이전에 포로 상태의 참혹함을 누적적으로 제시하므로, 한국어에서도 강도를 낮추지 않는 것이 원문의 수사와 신학적 긴장을 보존합니다.
  doctrine_reference: 예언서의 심판-회복 구조
