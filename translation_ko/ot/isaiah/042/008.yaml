id: ISA.42.8
reference: Isaiah 42:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה ה֣וּא שְׁמִ֑/י וּ/כְבוֹדִ/י֙ לְ/אַחֵ֣ר לֹֽא אֶתֵּ֔ן וּ/תְהִלָּתִ֖/י לַ/פְּסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
  footnotes:
  - marker: a
    text: Or 'nor my praise to carved images.' The Hebrew term refers specifically to images that are carved or fashioned, hence 'idols' by implication.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼입니다. 이것이 내 이름입니다. 나는 내 영광을 다른 이에게, 내 찬양을 우상들에게[a] 주지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 찬양을 조각상들에게 주지 않겠습니다.’ 히브리어 용어는 구체적으로 조각하거나 만들어 낸 형상을 가리키며, 이 문맥에서는 ‘우상들’이라는 뜻으로 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신적 고유명으로서 יְהוָה를 제목이 아니라 이름으로 드러내기 위해, POB의 영어 선택을 따라 한국어도 ‘야훼’로 옮겼습니다.
- source_word: הוּא
  english_pob_choice: that is
  chosen_korean: 그것이
  alternatives_korean:
  - 그는
  - 그것은
  - 바로
  lexicon: HALOT
  rationale: 문맥상 ‘내 이름입니다’에 대한 동일시·강조 기능이므로, 한국어에서는 ‘그것이 내 이름입니다’로 자연스럽게 식별 의미를 살렸습니다.
- source_word: כְבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 존귀
  - 내 영예
  lexicon: HALOT
  rationale: כָּבוֹד의 신학적·예배적 의미를 가장 직접적으로 드러내는 표준 대응으로 ‘영광’을 유지했습니다.
- source_word: פְּסִילִים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 조각한 형상들
  - 새긴 상들
  lexicon: HALOT
  rationale: 히브리어가 본래 조각·제작된 형상을 가리키지만, 본절의 예배적 대조를 분명히 하기 위해 본문에는 ‘우상들’을 두고, 물질적 제작 뉘앙스는 의미상 배경으로 보존했습니다.
theological_decisions:
- issue: 야훼의 이름과 배타적 영광 선언을 어떻게 한국어에서 드러낼지
  chosen_reading: ‘나는 야훼입니다. 그것이 내 이름입니다. 나는 내 영광을 다른 이에게… 주지 않겠습니다.’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘나는 주입니다’로 관용적으로 처리
  - ‘내 영광을 누구에게도 주지 않겠습니다’로 완화
  rationale: 본문은 하나님의 고유명과 배타적 자기-계시를 함께 강조하므로, 관용적 대체나 일반화보다 이름을 직접 드러내는 번역이 원문의 신학적 강도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내 찬양’을 어떻게 이해시킬지
  chosen_reading: 본문에는 ‘내 찬양’으로 유지했습니다.
  alternative_readings:
  - ‘내게 돌려질 찬양’
  - ‘내 이름에 드릴 찬양’
  rationale: 히브리어는 압축적이어서, 영어 POB처럼 주께 돌려져야 할 찬양이라는 뜻을 본문에 풀어쓰지 않고 소유격 구조를 살려 두는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md — Translation philosophy: optimal equivalence; Never paraphrase beyond what the source text warrants.'
