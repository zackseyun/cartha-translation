id: ISA.42.4
reference: Isaiah 42:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
  footnotes:
  - marker: a
    text: Or 'will hope for his instruction.' The Hebrew verb carries the sense of waiting with expectation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 흐려지지 않고 꺾이지도 않으며, 땅에 정의를 세울 때까지 그렇게 하십니다. 그리고 섬들은 그의 가르침을 기다릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 가르침을 바라며 기다릴 것입니다.’ 히브리어 동사는 기대를 품고 기다리는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְהֶה
  english_pob_choice: grow dim
  chosen_korean: 흐려지지 않고
  alternatives_korean:
  - 희미해지지 않고
  - 기운이 꺾이지 않고
  lexicon: HALOT
  rationale: כהה의 기본 감각인 ‘희미해지다/어두워지다’를 살려, 이어지는 ‘꺾이다’와 병렬을 이루도록 자연스럽게 옮겼습니다.
- source_word: יָרוּץ
  english_pob_choice: be crushed
  chosen_korean: 꺾이지도 않으며
  alternatives_korean:
  - 부서지지도 않으며
  - 짓눌리지도 않으며
  lexicon: HALOT
  rationale: רצץ의 ‘부수다, 짓누르다’라는 뜻을 반영하면서, 앞절의 ‘흐려지지’와 짝을 이루는 비유적 지속성을 살리기 위해 ‘꺾이다’를 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 심판
  lexicon: HALOT
  rationale: 이사야 문맥에서 מִשְׁפָּט는 단순한 판결보다 바로잡힌 질서와 정의를 가리키므로, 현대 한국어에서 그 의미를 가장 직접적으로 드러내는 ‘정의’를 사용했습니다.
- source_word: לְתוֹרָתוֹ
  english_pob_choice: his instruction
  chosen_korean: 그의 가르침
  alternatives_korean:
  - 그의 율법
  - 그의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה의 핵심 의미는 ‘가르침/지시’이므로, 법조문으로 좁히는 ‘율법’보다 넓은 의미를 살린 ‘가르침’을 택했습니다. 다만 한국어 자연성을 위해 ‘instruction’의 관념을 풀어 옮겼습니다.
- source_word: אִיִּים
  english_pob_choice: the coastlands
  chosen_korean: 섬들은
  alternatives_korean:
  - 해안 지방은
  - 먼 바닷가들은
  lexicon: HALOT
  rationale: 이 단어는 예언서에서 바다 건너 먼 지역을 가리키므로, POB의 ‘coastlands’를 한국어로 가장 간결하게 전달할 수 있는 전통적 대응어 ‘섬들’을 사용했습니다.
theological_decisions:
- issue: 보편적 범위의 표현
  chosen_reading: ‘땅’과 ‘섬들’을 함께 두어 사역의 범위가 이스라엘을 넘어서는 보편성을 드러냈습니다.
  alternative_readings:
  - ‘땅’을 ‘땅/나라’로 완화하는 읽기
  - ‘섬들’을 단순한 지리적 섬으로 한정하는 읽기
  rationale: 원문은 בָּאָרֶץ와 אִיִּים을 병치하여 지리적으로 넓은 시야를 제시하므로, 번역도 그 확장성을 유지해야 합니다.
  doctrine_reference: '번역 원칙: 원문이 제시하는 범위를 축소하지 않고 보존'
