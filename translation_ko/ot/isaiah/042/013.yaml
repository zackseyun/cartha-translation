id: ISA.42.13
reference: Isaiah 42:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
  footnotes:
  - marker: a
    text: Or 'he arouses jealousy' for 'he stirs up zeal.' The Hebrew קִנְאָה can denote either zeal or jealousy, especially in covenantal contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'against his enemies he prevails.' The final clause may be rendered more dynamically to emphasize victory.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'like a man of wars'; that is, a warrior experienced in battle.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 용사처럼 나오시며, 전쟁의 사람처럼 열심을 일으키십니다. 그분은 외치시고, 곧 전투 함성을 지르십니다. 원수들 위에서 그분은 자신을 강하게 드러내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 히브리어 표현은 ‘질투’를 뜻할 수도 있습니다. 그러나 이 문맥에서는 언약적 ‘열심’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘원수들 위에서’; 여기서는 승리와 우세를 강조하는 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 tetragrammaton을 인격적 고유명으로 살리기 위해, POB의 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: כַּגִּבּוֹר
  english_pob_choice: like a mighty warrior
  chosen_korean: 용사처럼
  alternatives_korean:
  - 강한 사람처럼
  - 영웅처럼
  lexicon: HALOT
  rationale: 전쟁 문맥의 כוח/무력 이미지를 자연스럽게 살리면서도 과도하게 장식하지 않기 위해 ‘용사처럼’을 선택했습니다.
- source_word: כְּאִישׁ מִלְחָמוֹת
  english_pob_choice: like a man of wars
  chosen_korean: 전쟁의 사람처럼
  alternatives_korean:
  - 전쟁의 사람처럼
  - 전사처럼
  - 전쟁에 익숙한 사람처럼
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조와 남성 명사 אִישׁ의 표지를 유지하면서도, 한국어에서 자연스럽게 읽히도록 ‘전쟁의 사람처럼’으로 옮겼습니다.
- source_word: יָעִיר קִנְאָה
  english_pob_choice: he stirs up zeal
  chosen_korean: 열심을 일으키십니다
  alternatives_korean:
  - 질투를 일으키십니다
  - 열정을 불러일으키십니다
  lexicon: HALOT
  rationale: 하나님께 대한 קִנְאָה는 언약적 열심의 뜻이 강하므로, 부정적 뉘앙스의 ‘질투’보다 ‘열심’이 더 적절합니다.
- source_word: יַצְרִיחַ
  english_pob_choice: he raises a battle cry
  chosen_korean: 전투 함성을 지르십니다
  alternatives_korean:
  - 전쟁 함성을 지르십니다
  - 큰 외침을 올리십니다
  lexicon: HALOT
  rationale: 뒤따르는 군사적 이미지와 맞추어, 단순한 ‘외치다’보다 전투적 성격이 분명한 ‘전투 함성’을 선택했습니다.
theological_decisions:
- issue: 야훼의 전쟁 이미지 보존
  chosen_reading: 무력한 선언이 아니라 실제 전투적 승리의 이미지를 살려 번역했습니다.
  alternative_readings:
  - 상징적 강함으로 완화하기
  - 일반적 권능 표현으로 바꾸기
  rationale: 히브리어는 ‘용사’, ‘전쟁의 사람’, ‘함성’, ‘원수들 위에서 강하게 드러남’이라는 연속된 군사 이미지를 제시하므로 이를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: קִנְאָה의 의미 선택
  chosen_reading: ‘열심’으로 번역해 언약적 열정의 뜻을 드러냈습니다.
  alternative_readings:
  - 질투
  - 열정
  rationale: 하나님께 사용될 때 קִנְאָה는 도덕적 결함이 아니라 언약을 향한 뜨거운 열심을 뜻하므로, 한국어에서 오해를 줄이는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
