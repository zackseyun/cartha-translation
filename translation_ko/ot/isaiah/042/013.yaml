revisions:
- from: 야훼께서 용사처럼 나오시며, 전쟁의 사람처럼 열심을 일으키십니다. 그분은 외치시고, 곧 전투 함성을 지르십니다. 원수들 위에서 그분은 자신을 강하게 드러내십니다.[a][b]
  to: 야훼께서 용사처럼 나오시며, 전사처럼 열심을 일으키십니다.[a] 그분은 외치시고, 곧 전투 함성을 지르십니다. 원수들을 상대로 자신의 강함을 드러내십니다.[b]
  rationale: 히브리어의 군사적 이미지, קִנְאָה의 의미 범위, 그리고 마지막 히트파엘 동사의 자기-강화/우세 의미를 유지하되, 직역투인 ‘전쟁의 사람’과 마지막 절의 어색한 표현을 현대 표준 한국어로 바로잡았습니다. ‘전사’는 אִישׁ의 남성 문법형을 별도로 재현하지는 않지만, 이 문맥에서 해당 관용구가 가리키는 전투자를 정확하고 자연스럽게 옮깁니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:59Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 군사 비유와 야훼의 승리 이미지는 대체로 충실합니다. 다만 כְּאִישׁ מִלְחָמוֹת의 ‘전쟁의 사람’은 히브리어의 형태를 지나치게 모사하여 한국어 관용을 해치므로 ‘전사’로 옮기는 것이 해당 관용구의 의미를 더 정확히 전달합니다. 마지막 절은 עַל과 히트파엘 יִתְגַּבָּר의 대적·우세 의미를 자연스럽게 드러내도록 다듬었습니다.
  naturalness: ‘전쟁의 사람처럼’과 ‘원수들 위에서 그분은 자신을 강하게 드러내십니다’는 현대 표준 한국어로 부자연스럽습니다. ‘전사처럼’과 ‘원수들을 상대로 자신의 강함을 드러내십니다’가 합쇼체의 격식을 유지하면서도 자연스럽습니다. 각주 표지도 해당 어휘·절에 직접 붙이는 편이 명확합니다.
  terminology: ‘야훼’, ‘용사’, ‘열심’, ‘전투 함성’, ‘원수’는 문맥과 POB의 신명사 방침에 부합합니다. קִנְאָה의 ‘열심’은 가능한 번역이며, ‘질투’의 대안은 각주로 유지합니다.
  issues:
  - severity: medium
    issue: ‘전쟁의 사람처럼’은 한국어에서 비관용적이고 어색합니다.
    rationale: אִישׁ מִלְחָמוֹת는 문자적으로는 ‘전쟁들의 사람’이나, 문맥상 전투에 능한 사람, 곧 전사를 가리키는 관용적 표현입니다. ‘전사처럼’이 의미를 보존하면서 자연스럽습니다.
  - severity: medium
    issue: 마지막 절의 ‘원수들 위에서 ... 자신을 강하게 드러내십니다’는 한국어 어순과 결합이 부자연스럽습니다.
    rationale: עַל אֹיְבָיו יִתְגַּבָּר는 원수들을 상대로 강함을 나타내거나 그들을 이긴다는 뜻입니다. ‘원수들을 상대로 자신의 강함을 드러내십니다’는 해석을 과도하게 확정하지 않으면서 이를 자연스럽게 전달합니다.
  - severity: low
