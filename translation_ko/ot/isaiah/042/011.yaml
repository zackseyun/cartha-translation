  to: 광야와 그 성읍들이 소리를 높이게 하십시오. 게달이 사는 마을들도 그렇게 하게 하십시오. 셀라[a]의 주민들이 기쁘게 노래하게 하십시오. 산들의 꼭대기에서 그들이 외치게 하십시오.
