id: ISA.42.11
reference: Isaiah 42:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
  footnotes:
  - marker: a
    text: Or 'the inhabitants of the rock,' if סֶלַע is taken as a common noun rather than the place name Sela.
    reason: lexical_alternative
translation:
  language: ko
  text: 광야와 그 성읍들이 소리를 높이게 하십시오. 게달이 사는 마을들도 그렇게 하게 하십시오. 셀라[a]의 주민들이 기쁘게 노래하게 하십시오. 산들의 꼭대기에서 그들이 외치게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바위의 주민들’로 옮길 수 있습니다. 히브리어 סֶלַע을 지명 ‘셀라’가 아니라 보통명사 ‘바위’로 볼 수도 있기 때문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  english_pob_choice: let ... lift up
  chosen_korean: 소리를 높이게 하십시오
  alternatives_korean:
  - 목소리를 올리게 하십시오
  - 목소리를 높이게 하십시오
  - 들어 올리게 하십시오
  lexicon: HALOT
  rationale: 히브리어는 자발적 찬양의 호격적 명령 흐름을 이루므로, 한국어에서는 관용적으로 ‘소리를 높이다’로 옮겨 원문의 은유와 초청의 뉘앙스를 함께 살렸습니다.
- source_word: מִדְבָּר וְעָרָיו חֲצֵרִים
  english_pob_choice: the wilderness and its cities ... the settlements
  chosen_korean: 광야와 그 성읍들…게달이 거주하는 마을들
  alternatives_korean:
  - 사막과 그 성읍들
  - 광야와 그 도시들
  - 촌락들
  lexicon: HALOT
  rationale: מִדְבָּר의 시적·예언적 등록은 ‘광야’가 가장 자연스럽고, עָרָיו의 소유격은 ‘그 성읍들’로, חֲצֵרִים은 울타리 없는 거주지라는 뜻을 살려 ‘마을들’로 옮겼습니다.
- source_word: קֵדָר יֹשְׁבֵי סֶלַע
  english_pob_choice: Kedar ... the inhabitants of Sela
  chosen_korean: 게달…셀라의 주민들
  alternatives_korean:
  - 게달…셀라의 거주자들
  - 게달…바위의 주민들
  lexicon: HALOT
  rationale: קֵדָר와 סֶלַע는 문맥상 고유명사로 처리하는 것이 병렬 구조에 맞습니다. POB가 제시한 ‘바위’의 어휘 가능성은 유지하되, 본문에는 장소명 ‘셀라’를 두었습니다.
- source_word: יָרֹנּוּ … יִצְוָחוּ
  english_pob_choice: let ... sing for joy ... let them shout
  chosen_korean: 기쁘게 노래하게 하십시오…그들이 외치게 하십시오
  alternatives_korean:
  - 즐겁게 부르게 하십시오
  - 환호하게 하십시오
  - 큰 소리로 외치게 하십시오
  lexicon: HALOT
  rationale: רנן은 기쁨이 섞인 노래나 환호를, צוח은 큰 소리의 외침을 가리키므로, 앞부분은 ‘기쁘게 노래하다’, 끝부분은 ‘외치다’로 구분해 살렸습니다.
theological_decisions:
- issue: 창조와 열방의 찬양 초청
  chosen_reading: 광야, 성읍, 거처지, 산봉우리까지도 야훼를 향한 찬양에 참여하도록 부르는 시적 초청으로 읽었습니다.
  alternative_readings:
  - 단순한 지리적 묘사로 읽기
  - 인격화된 자연의 과장된 수사로만 읽기
  rationale: 본문은 장소들을 의인화하여 공적 찬양의 범위를 열방과 주변 지대 전체로 확장합니다. 한국어도 이 초청의 역동성을 보존해야 하므로 명령형을 유지했습니다.
  doctrine_reference: 시적 의인화와 우주적 찬양(이사야 42장 문맥)
