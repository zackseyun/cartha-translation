  naturalness: ‘많은 것을 보았으나 지키지 않으며’는 절 연결과 높임 종결이 일관되지 않고 의미도 불명확합니다. ‘많은 것을 보았으나 주의하지 않습니다’와 같이 독립 절로 처리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
