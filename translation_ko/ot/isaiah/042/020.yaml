id: ISA.42.20
reference: Isaiah 42:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ראית רַבּ֖וֹת וְ/לֹ֣א תִשְׁמֹ֑ר פָּק֥וֹחַ אָזְנַ֖יִם וְ/לֹ֥א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
  footnotes:
  - marker: a
    text: Hebrew shifts from 'you' in the first half of the verse to 'his/he' in the second half. Some translations smooth this to 'your/you.'
    reason: alternative_reading
translation:
  language: ko
  text: 많은 것을 보았으나 지키지 않으며, 그의 귀는 열려 있으나 듣지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞부분에서 2인칭으로 말하다가 뒷부분에서 3인칭으로 전환합니다. 일부 번역은 이를 ‘네/너’로 평탄화합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ראית רַבּוֹת
  english_pob_choice: You have seen many things
  chosen_korean: 많은 것을 보았으나
  alternatives_korean:
  - 많은 것을 보았지만
  - 많은 것들을 보았으나
  lexicon: HALOT
  rationale: ראה의 완료형과 רַבּוֹת의 수량감을 살려 ‘많은 것을 보았으나’로 옮기고, 예언적 책망의 대조를 살리기 위해 뒤에 접속을 붙였습니다.
- source_word: וְ/לֹא תִשְׁמֹר
  english_pob_choice: but you do not observe
  chosen_korean: 지키지 않으며
  alternatives_korean:
  - 살피지 않으며
  - 지켜보지 않으며
  - 주의하지 않으며
  lexicon: HALOT
  rationale: שׁמר의 핵심인 ‘지키다/보호하다/준수하다’의 의미를 따라, 단순한 시각 행위와 대비되는 반응 부재를 간결하게 드러냈습니다.
- source_word: פָּקוֹחַ אָזְנַיִם
  english_pob_choice: his ears are open
  chosen_korean: 그의 귀는 열려 있으나
  alternatives_korean:
  - 귀는 열려 있으나
  - 그 귀는 열려 있으나
  lexicon: HALOT
  rationale: פָּקוֹחַ는 상태를 나타내는 표현이므로 ‘열려 있다’로 옮겼고, 영어 POB의 인칭 전환을 반영해 ‘그의 귀’로 자연스럽게 살렸습니다.
- source_word: וְ/לֹ֥א יִשְׁמָע
  english_pob_choice: but he does not hear
  chosen_korean: 듣지 않습니다
  alternatives_korean:
  - 듣지 않으나
  - 들으려 하지 않습니다
  lexicon: HALOT
  rationale: שׁמע의 청각적 기본 의미를 살려 ‘듣다’로 옮기되, 앞절의 반복을 피하면서도 책망의 현재성을 유지했습니다.
theological_decisions:
- issue: 문장 내 인칭 전환 보존
  chosen_reading: 첫째 절반은 2인칭 책망(‘보았으나 지키지 않으며’), 둘째 절반은 3인칭 묘사(‘그의 귀는… 듣지 않습니다’)를 유지했습니다.
  alternative_readings:
  - 모두 2인칭으로 통일(‘네 귀는 열려 있으나 너는 듣지 않는다’)
  - 모두 3인칭으로 통일
  rationale: 마소라 본문의 인칭 전환은 실제 수사적 긴장을 만들어 내므로, 이를 평탄화하지 않고 그대로 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
