id: ISA.42.17
reference: Isaiah 42:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
  footnotes:
  - marker: a
    text: Or “will retreat backward”; the Hebrew verb can denote turning back or being driven back.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “will be ashamed with shame,” an emphatic expression meaning “will be utterly put to shame.”
    reason: lexical_alternative
  - marker: c
    text: Or “carved image” for “idol,” and “molten image” for “cast image.” The Hebrew uses two distinct terms for manufactured objects of worship.
    reason: lexical_alternative
  - marker: d
    text: Hebrew “You are our gods,” with a plural noun; some translations smooth this to “our god.”
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 뒤로 물러날 것입니다[a]. 그들은 철저히 수치를 당할 것입니다[b]—우상을 신뢰하는 자들, 곧 새긴 형상에게 “당신은 우리의 신들입니다”라고 말하는 자들입니다[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뒤로 물러날 것이다”; 히브리어 동사는 뒤로 돌아서거나 뒤로 몰려 물러나는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “수치와 함께 수치를 당하다”로, 강한 강조를 이루는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “부어 만든 형상”으로도 옮길 수 있습니다. 히브리어는 제작 방식이 다른 두 용어를 구별합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 문자적으로 “당신은 우리의 신들입니다”입니다. 일부 번역은 이를 자연스럽게 “우리의 신입니다”로 완화합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  english_pob_choice: will be turned back
  chosen_korean: 뒤로 물러날 것입니다
  alternatives_korean:
  - 뒤로 돌아설 것입니다
  - 물러날 것입니다
  - 되돌려질 것입니다
  lexicon: HALOT
  rationale: 동사 נסג/סוג의 ‘뒤로 물러나다/되돌려지다’의 결과적·심판적 뉘앙스를 살리기 위해 능동적 ‘물러나다’보다 종결된 미래형으로 옮겼습니다.
- source_word: יֵבֹשׁוּ בֹשֶׁת
  english_pob_choice: will be utterly put to shame
  chosen_korean: 철저히 수치를 당할 것입니다
  alternatives_korean:
  - 크게 수치를 당할 것입니다
  - 수치에 수치를 당할 것입니다
  - 완전히 부끄러움을 당할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 어근 반복이 주는 강한 강조를 한국어로는 자연스럽게 ‘철저히’로 살렸고, ‘수치’와 ‘당할 것입니다’로 심판의 수동적 결과를 표현했습니다.
- source_word: בַּפָּסֶל / לְמַסֵּכָה
  english_pob_choice: idol / cast image
  chosen_korean: 우상 / 새긴 형상
  alternatives_korean:
  - 우상 / 부어 만든 형상
  - 조각한 형상 / 부어 만든 형상
  - 우상 / 주조한 형상
  lexicon: HALOT
  rationale: פֶּסֶל은 예배의 대상을 드러내는 ‘우상’으로, מַסֵּכָה는 제작 방식의 차이를 살리는 ‘새긴 형상’으로 옮겨 두 용어의 구별을 유지했습니다.
- source_word: אַתֶּם אֱלֹהֵינוּ
  english_pob_choice: You are our gods
  chosen_korean: 당신은 우리의 신들입니다
  alternatives_korean:
  - 당신은 우리의 신입니다
  - 너희는 우리의 신들입니다
  - 당신은 우리의 하나님들입니다
  lexicon: HALOT
  rationale: 히브리어의 복수형 אֱלֹהֵינוּ를 지우지 않기 위해 단수로 완화하지 않고 복수 ‘신들’을 유지했습니다. 한국어에서는 우상에게 직접 말하는 문맥상 존칭 없이 ‘당신’이 자연스럽습니다.
theological_decisions:
- issue: 우상 숭배를 향한 예언자적 조롱과 문체
  chosen_reading: 직접 인용 부분은 우상에게 말하는 형식을 그대로 살리되, 한국어 문장 전체는 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용부도 전부 평서형으로 통일하기
  - 전면적으로 낮춤말로 옮기기
  rationale: 본문의 조롱 섞인 직접 발화는 소스의 수사적 기능이므로 보존해야 하지만, 서술 프레임은 현대 한국어 성경 문체에 맞게 공손한 합쇼체로 유지하는 것이 적절합니다.
  doctrine_reference: 예언서 수사와 문체 보존 원칙
