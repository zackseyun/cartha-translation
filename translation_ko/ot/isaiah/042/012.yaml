    text: 히브리어로는 ‘섬들’이며, 이사야서에서는 흔히 먼 바다 건너의 해안 지역들을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 야훼께 영광을 돌리게 하라.’ 히브리어 동사는 문자적으로 ‘두다, 놓다’이지만, 여기서는 관용적으로 영광을 돌리다라는 뜻입니다.
    reason: lexical_alternative
