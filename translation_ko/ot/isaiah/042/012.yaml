  text: יָשִׂ֥ימוּ לַֽ/יהוָ֖ה כָּב֑וֹד וּ/תְהִלָּת֖/וֹ בָּ/אִיִּ֥ים יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the islands''; ''coastlands'' reflects Isaiah''s frequent use of the term for distant maritime lands more broadly, not only literal islands.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Let them ascribe glory to the LORD.' The Hebrew verb is literally 'put/set,' used idiomatically here for giving or ascribing glory.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 야훼께 영광을 돌리게 하며, 섬들에서 그의 찬양을 선포하게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִיִּים은 여기서 문자 그대로 ‘섬들’을 뜻하지만, 이사야에서 자주 먼 해상 지역 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 야훼께 영광을 돌리게 하라.’ 히브리어 동사는 문자적으로는 ‘두다/놓다’이지만, כאן에서는 관용적으로 영광을 돌리다의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יהוה, 전통적으로는 ‘주’ 또는 ‘여호와’로 옮겨졌습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשִׂימוּ
  english_pob_choice: let them give
  chosen_korean: 돌리게 하십시오
