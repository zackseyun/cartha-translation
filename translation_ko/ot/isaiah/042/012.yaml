  - 말하게 하십시오
  - 알리게 하십시오
  lexicon: HALOT
  rationale: נגד의 사역형은 ‘알리다/선언하다’의 공개적 선포를 뜻하므로, 예언시의 격조를 살리는 ‘선포하다’가 적절합니다.
