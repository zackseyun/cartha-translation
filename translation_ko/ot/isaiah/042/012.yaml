  - 드리게 하십시오
  lexicon: HALOT
  rationale: 직역의 ‘두다/놓다’보다 ‘영광을 돌리다’가 원문의 관용적 의미를 한국어로 자연스럽게 살리며, 권면형 뉘앙스도 보존합니다.
