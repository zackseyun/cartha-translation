  source_fidelity: 히브리어의 두 3인칭 복수 미완료형은 권유/명령의 뉘앙스를 띱니다. ‘야훼께 영광을 돌리다’와 ‘그의 찬양을 선포하다’는 의미를 충실히 반영합니다. אִיִּים은 문자적으로 섬들이나 이사야서에서는 먼 바다 건너의 해안 지역들을 포함하는 표현이므로, 본문에서는 그 넓은 의미를 반영하는 편이 더 적절합니다.
