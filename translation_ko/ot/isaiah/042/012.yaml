  rationale: 시가에서의 אִיִּים은 단순한 문자적 섬보다 먼 바다 건너 지역을 가리키지만, 본절의 간결한 병행 구조를 위해 기본 의미를 살린 ‘섬들에서’를 채택했습니다.
- source_word: יַגִּידוּ
  english_pob_choice: let them declare
  chosen_korean: 선포하게 하십시오
  alternatives_korean:
