  lexicon: HALOT
  rationale: 원문이 여호와 신명(יהוה)을 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בָּאִיִּים
  english_pob_choice: in the coastlands
  chosen_korean: 섬들에서
  alternatives_korean:
