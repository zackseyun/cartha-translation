  terminology: ‘이전의 일들/새 일들’은 הָרִאשֹׁנוֹת와 חֲדָשׁוֹת의 대조를 적절히 보존합니다. ‘싹트기’는 צמח의 식물 생장 비유를 잘 살립니다. אַשְׁמִיעַ의 사역적 전달 의미는 ‘들려드립니다’로 자연스럽게 표현할 수 있습니다.
