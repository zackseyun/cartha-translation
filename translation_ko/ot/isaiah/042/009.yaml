id: ISA.42.9
reference: Isaiah 42:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/רִֽאשֹׁנ֖וֹת הִנֵּה בָ֑אוּ וַֽ/חֲדָשׁוֹת֙ אֲנִ֣י מַגִּ֔יד בְּ/טֶ֥רֶם תִּצְמַ֖חְנָה אַשְׁמִ֥יע אֶתְ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
  footnotes:
  - marker: a
    text: Or 'the first things.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'have come'; idiomatically, 'have come to pass' or 'have happened.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb literally means 'sprout' or 'spring up,' using plant-growth imagery for events not yet visible.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이전의 일들[a]은 이미 이루어졌습니다[b]. 나는 새 일들을 알립니다. 그것들이 싹트기[c] 전에, 내가 그것들을 여러분에게 들려드립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이전의 일들’은 ‘처음의 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘왔다’라는 뜻이지만, 여기서는 일이 이미 일어났거나 이루어졌다는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 식물이 ‘싹트다’라는 이미지를 사용하여, 아직 눈에 보이지 않는 사건을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנֹות
  english_pob_choice: the former things
  chosen_korean: 이전의 일들
  alternatives_korean:
  - 먼저의 일들
  - 처음 일들
  lexicon: HALOT
  rationale: 복수의 명사화된 형용사로서 과거에 속한 사건들을 가리키므로, ‘이전의 일들’이 문맥상 자연스럽고 ‘새로운 일들’과의 대조도 잘 살립니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 주목을 요구하는 감탄사이므로, 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽게 청중의 주의를 환기합니다.
- source_word: בָאוּ
  english_pob_choice: have come to pass
  chosen_korean: 이미 이루어졌습니다
  alternatives_korean:
  - 실현되었습니다
  - 이미 와 있습니다
  lexicon: HALOT
  rationale: 직역의 ‘왔습니다’보다 예언 성취의 관용적 뜻을 드러내는 표현이 필요해, ‘이루어졌습니다’로 옮겼습니다.
- source_word: תִּצְמַחְנָה
  english_pob_choice: they spring up
  chosen_korean: 싹트기 전에
  alternatives_korean:
  - 돋아나기 전에
  - 자라기 전에
  lexicon: HALOT
  rationale: 식물 생장 이미지를 유지해야 하므로 ‘싹트기 전에’가 가장 압축적이면서도 원문의 비유를 보존합니다.
- source_word: אַשְׁמִיעַ אֶתְכֶם
  english_pob_choice: I announce them to you
  chosen_korean: 내가 그것들을 여러분에게 들려줍니다
  alternatives_korean:
  - 내가 그것들을 여러분에게 알립니다
  - 내가 그것들을 여러분에게 선포합니다
  lexicon: HALOT
  rationale: 히필 של שמע는 ‘듣게 하다/들려주다’의 강제적·사역적 뉘앙스가 있으므로, 단순한 ‘알리다’보다 ‘들려줍니다’가 원문의 청각적 구조를 더 잘 살립니다.
theological_decisions:
- issue: 예언 성취와 새 일의 대비
  chosen_reading: 이전의 일들은 이미 성취되었고, 하나님은 아직 드러나지 않은 새로운 일들을 미리 알리시는 분으로 제시됩니다.
  alternative_readings:
  - 단순히 과거와 미래의 대비로 읽을 수 있습니다.
  - 예언 성취의 강조를 약화시켜 일반적인 역사 진술로 읽을 수 있습니다.
  rationale: ‘이전의 일들’이 ‘이미 이루어졌습니다’와 연결되고, 이어서 ‘새로운 일들’을 미리 알리신다는 흐름이 예언의 성취와 선포를 함께 드러냅니다. 본문의 분명한 대조를 약화시키지 않으면서도 추가 교리를 덧붙이지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text’s plain sense without importing extra doctrinal claims.'
