  source_fidelity: 핵심 어휘와 반복 구조는 대체로 충실합니다. 그러나 מְשֻׁלָּם을 ‘화목한 자’로 옮기면 한국어에서는 대개 화목의 상대를 요구하여 원문의 불확정적 상태·완전성 어감을 충분히 보존하지 못합니다. ‘온전한 자’를 본문으로 하고 주요 대안을 각주에 남기는 편이 더 안전합니다.
  naturalness: ‘내가 보내는 내 사자’와 반복된 ‘눈먼 자’는 자연스럽고 수사적 힘을 유지합니다. 다만 ‘화목한 자’는 이 문맥에서 다소 어색하고 의미가 좁게 들립니다. 각주 표지는 해당 난해어 바로 뒤에 두는 것이 독자에게 분명합니다.
  terminology: ‘내 종’, ‘내 사자’, ‘야훼’, ‘눈먼 자’는 일관되고 적절합니다. ‘듣지 못하는 자’는 현대 표준어에서 ‘귀먹은 자’보다 중립적이지만, 본문의 직접적 대구는 유지됩니다. מְשֻׁלָּם은 특정 교리적 관계로 확정하지 않고 ‘온전한 자’와 각주 대안으로 처리합니다.
