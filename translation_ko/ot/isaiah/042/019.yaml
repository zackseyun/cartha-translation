  text: מִ֤י עִוֵּר֙ כִּ֣י אִם עַבְדִּ֔/י וְ/חֵרֵ֖שׁ כְּ/מַלְאָכִ֣/י אֶשְׁלָ֑ח מִ֤י עִוֵּר֙ כִּ/מְשֻׁלָּ֔ם וְ/עִוֵּ֖ר כְּ/עֶ֥בֶד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
  footnotes:
  - marker: a
    text: Or 'like the one who is perfect/blameless'; Hebrew מְשֻׁלָּם is difficult and may carry the sense of being complete, whole, or in right relationship.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 내 종처럼 눈먼 자이며, 내가 보내는 내 사자처럼 듣지 못하는 자입니까? 누가 온전한 자[a]처럼 눈먼 자이며, 야훼의 종처럼 눈먼 자입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안한 자’, ‘완전한 자’, ‘보응을 받은 자’로 옮길 수 있습니다. 히브리어 מְשֻׁלָּם은 뜻이 어려워 ‘온전함’, ‘평안’, ‘보응’ 등의 의미로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  english_pob_choice: blind
  chosen_korean: 눈먼 자
  alternatives_korean:
  - 맹인
  - 보지 못하는 자
  lexicon: HALOT
  rationale: 반복되는 수사적 질책을 살리기 위해 직접적이고 동일한 표현으로 옮겼습니다.
- source_word: חֵרֵשׁ
  english_pob_choice: deaf
  chosen_korean: 귀먹은 자
  alternatives_korean:
  - 귀가 먼 자
  - 청각이 없는 자
  lexicon: HALOT
  rationale: ‘눈먼 자’와의 평행을 유지하면서 한국어에서 자연스럽고 직설적인 표현을 택했습니다.
- source_word: מַלְאָכִי
  english_pob_choice: my messenger
  chosen_korean: 내 사자
  alternatives_korean:
  - 내 메신저
  - 내 천사
  lexicon: HALOT
  rationale: 문맥상 인간적 파견자를 가리키므로 ‘사자’로 옮겼고, ‘천사’는 배제했습니다.
- source_word: מְשֻׁלָּם
  english_pob_choice: the one who is at peace
  chosen_korean: 화목한 자
  alternatives_korean:
  - 온전한 자
  - 완전한 자
  - 평안한 자
  lexicon: HALOT
  rationale: 의미가 어려운 어형이지만, 본문이 요구하는 관계적·상태적 뉘앙스를 한국어의 ‘화목한’으로 간결하게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘내 종’과 ‘내 사자’의 정체를 특정하지 않음
  chosen_reading: 본문이 드러내는 파견·언약 언어를 유지하고, 이 인물들을 Israel/예언자/이상적 종으로 단정하지 않았습니다.
  alternative_readings:
  - 이스라엘 집단
  - 예언자
  - 이상적 종
  rationale: 히브리어 본문 자체가 명시적 식별을 주지 않으므로, 해석을 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
