  rationale: 원문의 길 이미지와 두 평행구를 보존하면서 ‘샛길’의 과도한 의미를 제거했습니다. 문장을 일관된 현대 합쇼체로 다듬었고, 마지막 두 완료형은 본문에서 완료형으로 유지하되 가능한 미래적 이해를 각주에 제시했습니다.
