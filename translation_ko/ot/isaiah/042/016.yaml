id: ISA.42.16
reference: Isaiah 42:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
  footnotes:
  - marker: a
    text: Or, 'These are the things I will do, and I will not forsake them.' The Hebrew uses perfect verbs here, which may express completed action or prophetic certainty about what God promises to do.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 보지 못하는 이들을 그들이 알지 못하는 길로 이끌고, 그들이 알지 못하는 길들에서 그들을 인도하겠습니다. 내가 그들 앞의 어둠을 빛으로, 굽은 곳들을 평탄한 곳으로 만들겠습니다. 이것들이 내가 행한 일들이고, 나는 그들을 버리지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들이 내가 행할 일들이고, 나는 그들을 버리지 않겠습니다.’ 히브리어는 여기서 완료형 동사를 사용하며, 이미 이루어진 일을 가리킬 수도 있고 하나님께서 약속하신 일을 예언적 확실성으로 말할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  english_pob_choice: I will lead
  chosen_korean: 이끌겠고
  alternatives_korean:
  - 인도하겠습니다
  - 데리고 가겠습니다
  lexicon: HALOT
  rationale: הוֹלִיךְ의 사역형은 ‘가게 하다/이끌다’의 의미를 가지므로, 자연스럽고 지도하는 뉘앙스가 살아 있는 ‘이끌다’를 택했습니다.
- source_word: עִוְרִים
  english_pob_choice: the blind
  chosen_korean: 맹인들을
  alternatives_korean:
  - 눈먼 사람들을
  - 보지 못하는 이들을
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰였으므로 대상을 분명히 드러내는 복수형 ‘맹인들’을 사용했습니다.
- source_word: בְּדֶרֶךְ / בִּנְתִיבוֹת
  english_pob_choice: by a way / on paths
  chosen_korean: 길로 / 샛길들로
  alternatives_korean:
  - 길로 / 길들로
  - 길로 / 작은 길들로
  lexicon: HALOT
  rationale: 두 겹의 길-이미지를 살리되, 문맥상 단순한 ‘길’보다 덜 표준적이고 ‘알지 못하던’ 미지의 길감을 주는 ‘샛길들’로 두 번째 평행구를 구분했습니다.
- source_word: מַחְשָׁךְ
  english_pob_choice: the darkness
  chosen_korean: 어둠을
  alternatives_korean:
  - 흑암을
  - 어두움을
  lexicon: HALOT
  rationale: 여기서는 시각적 장애이자 위험을 가리키는 일반 명사이므로, 현대 한국어에서 가장 자연스러운 ‘어둠’을 택했습니다.
- source_word: לָאוֹר
  english_pob_choice: into light
  chosen_korean: 빛으로
  alternatives_korean:
  - 빛이 되게
  - 빛 안으로
  lexicon: HALOT
  rationale: 결과를 나타내는 용법을 한국어의 변환 표현 ‘-으로’로 옮겨, 어둠이 빛으로 바뀌는 변형을 살렸습니다.
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  english_pob_choice: the crooked places into level ground
  chosen_korean: 굽은 곳들을 평지로
  alternatives_korean:
  - 굽은 길들을 평탄한 곳으로
  - 구불구불한 곳들을 평지로
  lexicon: HALOT
  rationale: יַשָׁר/מִישׁוֹר의 대조를 지형 이미지로 살리기 위해 ‘굽은 곳들’과 ‘평지’의 대비를 유지했습니다.
theological_decisions:
- issue: 마지막 절의 완료형을 한국어에서 어떻게 살릴지
  chosen_reading: ‘내가 행한 일들이며, 내가 그들을 버리지 않았습니다’로 완료 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘내가 할 일들이며, 내가 그들을 버리지 않겠습니다’
  - ‘내가 해 왔던 일들이며, 내가 그들을 버리지 않았습니다’
  rationale: 히브리어 완료형이 예언적 확실성을 나타낼 수 있으므로, 미래형으로 평탄화하지 않고 이미 이루어진 사실처럼 말하는 어조를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
