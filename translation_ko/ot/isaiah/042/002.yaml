  text: לֹ֥א יִצְעַ֖ק וְ/לֹ֣א יִשָּׂ֑א וְ/לֹֽא יַשְׁמִ֥יעַ בַּ/ח֖וּץ קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
  footnotes:
  - marker: a
    text: Or 'He does not cry out or lift up, and does not let his voice be heard outside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 외치지 않으시고, 목소리를 높이지도 않으시며, 거리에서 그의 소리가 들리게 하지도 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 외치지 않고, 목소리를 높이지 않으며, 바깥에서 그의 소리가 들리게 하지 않습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִצְעַק
  english_pob_choice: cry out
  chosen_korean: 외치지 않으시고
  alternatives_korean:
  - 소리치지 않으시고
  - 부르짖지 않으시고
  - 큰소리치지 않으시고
  lexicon: HALOT
  rationale: צעק의 공개적이고 큰 소리의 외침을 살리되, 합쇼체 서술에 자연스러운 동사로 ‘외치다’를 택했습니다.
- source_word: יִשָּׂא
  english_pob_choice: raise his voice
  chosen_korean: 목소리를 높이지도 않으시며
  alternatives_korean:
  - 목소리를 들지 않으시며
  - 소리를 높이지도 않으시며
  - 목소리를 치켜세우지도 않으시며
  lexicon: HALOT
  rationale: נשא가 여기서는 ‘목소리를 높이다’라는 관용적 의미로 쓰였으므로, 직역보다 한국어 관용에 맞게 풀었습니다.
- source_word: יַשְׁמִיעַ בַּחוּץ קוֹלוֹ
  english_pob_choice: make his voice heard in the street
  chosen_korean: 거리에서 그의 소리가 들리게 하지도 않으십니다
  alternatives_korean:
  - 거리에서 그의 목소리가 들리게 하지도 않으십니다
  - 밖에서 그의 소리가 들리게 하지도 않으십니다
  - 거리에서 외치게 하지도 않으십니다
  lexicon: HALOT
  rationale: Hiphil의 ‘들리게 하다’라는 사역 의미를 살리면서, בַּחוּץ를 ‘거리에서’로 옮겨 공개적 장소라는 이미지를 유지했습니다.
theological_decisions:
- issue: 예언적 현재/미래형의 한국어 처리
  chosen_reading: 미래를 가리키는 서술로 합쇼체 현재형을 사용해 특징적 성격을 표현했습니다.
  alternative_readings:
  - 그는 외치지 않을 것입니다
  - 그는 외치지 않습니다
  rationale: 히브리어 미완료형은 종종 예언적 장면에서 특징적 미래를 나타내므로, 한국어에서는 단정적 서술로 옮기되 미래 표지를 생략해 시적 성격을 유지했습니다.
  doctrine_reference: 예언서의 서술적 미완료형 해석
