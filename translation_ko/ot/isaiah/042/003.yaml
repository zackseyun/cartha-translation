id: ISA.42.3
reference: Isaiah 42:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
  footnotes:
  - marker: a
    text: Or "a faint/smoldering flax wick." The Hebrew literally refers to flax, here likely meaning a lamp wick made from flax.
    reason: lexical_alternative
  - marker: b
    text: Or "in truth he will bring forth justice."
    reason: alternative_reading
translation:
  language: ko
  text: 상한 갈대는 꺾지 않으시고, 희미하게 타는 심지[a]는 끄지 않으시며, 신실하게 공의를 이루실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘희미하게 타는 아마 심지’. 히브리어는 문자적으로 아마를 가리키며, 여기서는 등불 심지에 쓰인 아마를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진리 가운데서 공의를 이루실 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה רָצוּץ
  english_pob_choice: bruised reed
  chosen_korean: 상한 갈대
  alternatives_korean:
  - 부서진 갈대
  - 멍든 갈대
  lexicon: HALOT
  rationale: 갈대의 취약함을 살리면서도 현대 한국어에서 자연스럽고 직관적인 형상을 유지하기 위해 ‘상한 갈대’로 옮겼습니다. ‘브루이즈드(bruised)’의 물리적 손상을 과장하지 않도록 ‘부서진’보다 약하게 잡았습니다.
- source_word: פִשְׁתָּה כֵהָה
  english_pob_choice: a dimly burning wick
  chosen_korean: 희미하게 타는 심지
  alternatives_korean:
  - 꺼져 가는 심지
  - 미약하게 타는 심지
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아마/삼 심지’이지만, 문맥상 등불의 심지를 가리키므로 기능적 의미를 살려 ‘심지’로 옮겼습니다. ‘희미하게 타는’은 ‘dimly burning’의 시각적 효과를 자연스럽게 전달합니다.
- source_word: לֶאֱמֶת יוֹצִיא מִשְׁפָּט
  english_pob_choice: he will faithfully bring forth justice
  chosen_korean: 진실하게 공의를 내실 것입니다
  alternatives_korean:
  - 성실하게 공의를 내실 것입니다
  - 참되게 공의를 내실 것입니다
  lexicon: HALOT
  rationale: לֶאֱמֶת는 ‘진실하게/참되게/충실하게’의 범위를 가지므로, 여기서는 하나님의 종의 행위를 드러내는 부사적 뉘앙스를 살려 ‘진실하게’로 옮겼습니다. מִשְׁפָּט는 이사야에서 단순한 판결보다 ‘공의’의 질서를 가리키는 경우가 많아 ‘공의’로 번역했습니다.
theological_decisions:
- issue: 상한 갈대와 희미한 심지의 은유를 어떻게 다룰지
  chosen_reading: 은유를 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - 연약한 사람을 꺾지 않으시고, 꺼져 가는 사람을 끄지 않으신다
  rationale: 히브리어 원문은 약한 자를 직접 설명하기보다 생생한 시적 이미지를 사용하므로, 본문이 가진 완곡성과 힘을 보존하기 위해 은유를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: לֶאֱמֶת의 의미
  chosen_reading: ‘진실하게’로 옮겨 충실성과 참됨을 함께 비췄습니다.
  alternative_readings:
  - ‘참되게’
  - ‘충실하게’
  - ‘진리 안에서’
  rationale: 이 표현은 진리, 신실함, 신뢰성의 의미 범위를 가지며, 여기서는 공의를 세우는 메시아적 사역의 성격을 드러내는 부사로 읽는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §3, §5
