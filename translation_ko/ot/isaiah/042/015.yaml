id: ISA.42.15
reference: Isaiah 42:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
  footnotes:
  - marker: a
    text: Or 'coastlands' for 'islands'; the Hebrew term can denote islands or maritime lands.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 산들과 언덕을 황폐하게 하고, 그들의 모든 초목을 말려 버리며, 강들을 섬들로 만들고, 못들을 말려 버리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해안 지방들’로 옮길 수 있습니다. 히브리어는 섬뿐 아니라 해안 지역도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיב
  english_pob_choice: I will lay waste
  chosen_korean: 황폐하게 하겠습니다
  alternatives_korean:
  - 폐허로 만들겠습니다
  - 멸망시키겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미인 ‘황폐하게 하다’를 살리면서, 심판 선언의 강한 어조를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְכָל עֶשְׂבָּם
  english_pob_choice: all their vegetation
  chosen_korean: 그들의 모든 초목
  alternatives_korean:
  - 그들의 모든 풀
  - 그들의 모든 식생
  lexicon: HALOT
  rationale: עֵשֶׂב은 단순한 ‘풀’보다 더 넓게 식물성 피복을 가리킬 수 있으므로, 산과 언덕 전체의 식생을 포괄하는 ‘초목’이 가장 무난합니다.
- source_word: לָאִיִּים
  english_pob_choice: into islands
  chosen_korean: 섬들로
  alternatives_korean:
  - 해안 지방으로
  - 마른 땅으로
  lexicon: HALOT
  rationale: 직역상 ‘섬들’이 가장 직접적입니다. 영어 주석이 제시한 ‘coastlands’ 가능성은 유지하되, 본문은 보다 직접적인 어휘를 택했습니다.
- source_word: וַאֲגַמִּים
  english_pob_choice: pools
  chosen_korean: 못들
  alternatives_korean:
  - 늪들
  - 연못들
  lexicon: HALOT
  rationale: אגמים는 고인 물, 연못, 못을 가리킬 수 있어 한국어로는 간결한 ‘못들’이 문맥에 잘 맞습니다.
theological_decisions:
- issue: 반복되는 1인칭 선언의 보존
  chosen_reading: 네 번의 ‘내가/…하겠습니다’를 살려 야훼의 주권적 행위 선언을 그대로 드러냈습니다.
  alternative_readings:
  - 한국어를 자연스럽게 하기 위해 뒤의 두 동사를 생략적으로 처리하는 방식
  rationale: 히브리어 본문과 최신 수정 이력은 네 번의 반복을 의도적으로 유지하도록 요구합니다. 이 반복은 단순한 문장 길이 문제가 아니라 심판 행위의 단호함과 강조를 전달합니다.
  doctrine_reference: translation philosophy §3; preserve rhetorical emphasis rather than smoothing it away.
