id: ISA.42.25
reference: Isaiah 42:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
  footnotes:
  - marker: a
    text: Or 'the fury of his anger.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the violence/fierceness of war.'
    reason: lexical_alternative
  - marker: c
    text: The singular 'him/he' refers to Israel as a people personified as one man.
    reason: cultural_note
  - marker: d
    text: Literally 'did not set it upon the heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 자기 위에 그의 분노의 열기와 전쟁의 위력을 쏟아부었습니다[a]. 그것이 사방으로 그를 불사르지만 그는 알지 못했고, 그 속에서 타올랐지만 그는 그것을 마음에 두지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 분노의 격노’를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ ... עָלָיו
  english_pob_choice: poured out on him
  chosen_korean: 자기 위에 ... 쏟아부었습니다
  alternatives_korean:
  - 그에게 부었습니다
  - 그 위에 쏟았습니다
  lexicon: HALOT
  rationale: שׁפךְ의 ‘쏟다/부어내다’ 이미지를 살리되, עָלָיו의 방향성을 한국어에서 자연스럽게 나타냈습니다.
- source_word: חֵמָה אַפּוֹ
  english_pob_choice: the heat of his anger
  chosen_korean: 그의 분노의 열기
  alternatives_korean:
  - 그의 분노의 불길
  - 그의 맹렬한 분노
  lexicon: HALOT
  rationale: חֵמָה와 אַף의 결합은 단순한 감정이 아니라 뜨거운 분노를 가리키므로, ‘열기’로 불의 이미지를 보존했습니다.
- source_word: וֶעֱזוּז מִלְחָמָה
  english_pob_choice: the might of battle
  chosen_korean: 전쟁의 위력
  alternatives_korean:
  - 전쟁의 강력함
  - 전투의 맹렬함
  lexicon: HALOT
  rationale: עֱזוּז는 힘/위력의 뉘앙스를 가지므로, ‘위력’이 전쟁과 결합된 파괴적 강세를 비교적 직접적으로 드러냅니다.
- source_word: וְלֹא יָשִׂים עַל לֵב
  english_pob_choice: but he did not take it to heart
  chosen_korean: 그것을 마음에 두지 않았습니다
  alternatives_korean:
  - 그것을 마음에 새기지 않았습니다
  - 그것을 깊이 생각하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음에 두다/새기다’는 경고를 내면화하지 않는다는 뜻이므로, 한국어 관용으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어의 단수 인칭이 가리키는 대상
  chosen_reading: 단수 ‘그를/그’는 집합적 인격화로서 이스라엘을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 복수로 풀어 ‘그들을/그들’로 번역하기
  rationale: 시적-예언적 문맥의 인칭 형식을 평탄화하지 않고, 민족 전체를 한 사람처럼 말하는 수사를 보존하기 위함입니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 분노와 전쟁의 속성을 나타내는 여성 단수 동사
  chosen_reading: 동사는 ‘그것’으로 처리하여 쏟아부어진 심판/분노의 작용을 주어처럼 받게 했습니다.
  alternative_readings:
  - ‘그녀’로 형태를 맞추기
  - 하나님을 계속 명시적 주어로 유지하기
  rationale: 히브리어의 문법적 성별을 한국어에 억지로 이식하기보다, 심판이 작동하는 힘으로서 ‘그것’을 쓰는 것이 의미를 더 분명히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
