revisions:
- from: 그래서 그는 자기 위에 그의 분노의 열기와 전쟁의 위력을 쏟아부었습니다[a]. 그것이 사방으로 그를 불사르지만 그는 알지 못했고, 그 속에서 타올랐지만 그는 그것을 마음에 두지 않았습니다.
  to: 그러므로 그분께서 그에게 자신의 분노의 열기와 전쟁의 위력을 쏟아부으셨습니다[a]. 그것이 사방에서 그를 불태웠으나, 그는 알지 못했습니다. 그것이 그의 속에서 타올랐으나, 그는 그것을 마음에 두지 않았습니다.
  rationale: ‘자기 위에’를 ‘그에게’로 바꾸어 원문의 주어와 심판 대상의 관계를 보존했습니다. 이어지는 두 여성 단수 동사의 작용 주어를 ‘그것’으로 명시하고, 과거 서술과 반복 구조를 유지했습니다. 단수 ‘그’는 원문처럼 인격화된 공동체를 가리킬 수 있는 여지를 남깁니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:57Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 עָלָיו(‘그에게/그 위에’)는 심판을 받는 단수의 대상에게 향하지만, 초안의 ‘자기 위에’는 주어 자신에게 쏟아붓는 것으로 읽혀 원문의 주어와 대상을 혼동합니다. 또한 미완료처럼 들리는 ‘불사르지만’은 서술의 과거 흐름에 맞지 않습니다. 수정문은 단수 인칭과 불의 이미지를 유지하면서 이를 바로잡습니다.
  naturalness: ‘그분께서 그에게 자신의 … 쏟아부으셨습니다’는 주어와 대상을 자연스럽게 구별합니다. ‘사방에서 그를 불태웠으나 … 그의 속에서 타올랐으나’는 한국어 합쇼체의 과거 서술로 자연스럽고, 히브리어의 반복된 여성 단수 동사를 ‘그것이’로 명시하여 지시 대상을 분명히 합니다.
  terminology: ‘분노의 열기’, ‘전쟁의 위력’, ‘마음에 두지 않았습니다’는 각각 חֵמָה אַפּוֹ, עֱזוּז מִלְחָמָה, שׂים על לב의 의미와 비유를 적절히 보존합니다. 기존 각주의 ‘분노의 격노’는 한국어에서 중복적이므로 ‘맹렬한 분노’로 고칩니다.
  issues:
  - severity: high
    issue: ‘자기 위에’가 עָלָיו의 대상을 주어 자신으로 바꿔 읽히게 합니다.
    rationale: 본문에서 쏟아붓는 이는 하나님으로 이해되고, ‘그 위에/그에게’는 인격화된 이스라엘을 가리킵니다. 재귀 표현은 이 관계를 훼손합니다.
  - severity: medium
    issue: ‘사방으로 그를 불사르지만’의 시제와 연결이 원문의 완료된 서술과 맞지 않습니다.
    rationale: 와우 연속형으로 이어지는 판단 행위를 한국어 과거 서술 ‘불태웠으나’로 옮기는 것이 자연스럽습니다.
  - severity: low
    issue: 각주 ‘그의 분노의 격노’가 어색하고 의미상 중복됩니다.
    rationale: חֵמָה의 대안적 뉘앙스는 ‘맹렬한 분노’로 자연스럽게 제시할 수 있습니다.
  revised_text: 그러므로 그분께서 그에게 자신의 분노의 열기와 전쟁의 위력을 쏟아부으셨습니다[a]. 그것이 사방에서 그를 불태웠으나, 그는 알지 못했습니다. 그것이 그의 속에서 타올랐으나, 그는 그것을 마음에 두지 않았습니다.
  revised_footnotes:
