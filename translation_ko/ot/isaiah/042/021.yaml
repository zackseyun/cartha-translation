translation:
  language: ko
  text: 야훼께서는 자신의 의를 위하여 기뻐하셨으며, 율법을 크게 하시고 영화롭게 하실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 정의를 위하여’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 토라; 또한 ‘가르침’ 또는 ‘교훈’.
    reason: lexical_alternative
  - marker: c
    text: 더 직역하면 ‘율법을 크게 하시고 그것을 영화롭게 하실 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 표기 대신 신명기적 고유명을 음역하는 POB 원칙을 따라, 하나님의 이름을 고유명사로 드러내는 ‘야훼’를 사용했습니다.
- source_word: חָפֵץ
  english_pob_choice: was pleased
  chosen_korean: 기뻐하셨습니다
  alternatives_korean:
  - 원하셨습니다
  - 원하셨기에 기뻐하셨습니다
  - 즐거워하셨습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 원함/기쁨의 결합을 가질 수 있으나, 예언서 요약문에서 하나님의 호의적 뜻을 자연스럽게 드러내는 한국어로 ‘기뻐하셨습니다’를 택했습니다.
- source_word: צִדְקוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 정의
  - 그의 공의
  lexicon: HALOT
  rationale: 영문 POB가 ‘righteousness’를 기본으로 두고 ‘justice’를 각주로 남긴 점을 따라, 한국어에서도 신학적으로 넓은 ‘의’를 본문에 두어 ‘정의/공의’로 좁히지 않았습니다.
- source_word: תּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 이사야 문맥에서 תּוֹרָה는 단순한 일반적 가르침보다 언약적·규범적 힘이 강하므로, POB의 ‘the law’를 따라 ‘율법’으로 옮겼습니다.
- source_word: יַגְדִּיל ... וְיַאְדִּיר
  english_pob_choice: to make the law great and glorious
  chosen_korean: 크고 영화롭게 하셨습니다
  alternatives_korean:
  - 크게 하시고 영화롭게 하셨습니다
  - 크고 장엄하게 하셨습니다
  - 크게 하고 영광스럽게 하셨습니다
  lexicon: HALOT
  rationale: 두 개의 사역형 동사를 한국어에서 자연스럽게 압축해, ‘크고 영화롭게’로 병렬 효과를 살리면서 의미의 중복을 과도하게 늘리지 않도록 했습니다.
theological_decisions:
- issue: צִדְקוֹ의 의미 범위
  chosen_reading: 그의 의
  alternative_readings:
  - 그의 정의
  - 그의 공의
  rationale: 본문은 야훼의 토라를 높이시는 행위를 그의 인격적·언약적 의와 연결합니다. ‘의’는 이 폭을 유지하며, ‘정의’나 ‘공의’로 너무 사법적으로 좁히는 것을 피합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
