id: ISA.53.5
reference: Isaiah 53:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
  footnotes:
  - marker: a
    text: Or 'wounded' for 'pierced.' The Hebrew term can denote being wounded or pierced; 'pierced' was chosen to preserve the concrete violence of the image.
    reason: lexical_alternative
  - marker: b
    text: '''Our peace'' can also mean ''our well-being'' or ''our wholeness.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'by his stripe' or 'by his bruise.' The Hebrew noun is singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 우리의 죄과 때문에 찔리셨습니다.[a] 우리의 죄악 때문에 짓눌리셨습니다. 우리의 평강[b]을 위한 징계가 그에게 내렸으며, 그의 상처[c]로 우리는 치유되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찔리셨습니다’는 히브리어의 구체적인 폭력 이미지를 반영한 번역입니다. 이 말은 ‘상처 입다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 ‘평안’, ‘온전함’, 또는 ‘복됨’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수형입니다. ‘채찍 자국’ 또는 ‘타박상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: But he
  chosen_korean: 그러나 그는
  alternatives_korean:
  - 그리고 그는
  - 그런데 그는
  lexicon: HALOT
  rationale: 앞선 문맥과 대조를 이루는 역접을 살려 ‘그러나’로 옮겼고, 주어를 분명히 하기 위해 ‘그는’을 붙였습니다.
- source_word: מְחֹלָל
  english_pob_choice: pierced
  chosen_korean: 찔렸고
  alternatives_korean:
  - 상했고
  - 뚫렸고
  - 찌름을 당했고
  lexicon: HALOT
  rationale: 문맥상 육체적 고통의 구체성이 중요하므로, 단순한 ‘상하다’보다 더 직접적인 폭력성을 드러내는 ‘찔렸고’로 옮겼습니다.
- source_word: מִפְּשָׁעֵינוּ
  english_pob_choice: because of our transgressions
  chosen_korean: 우리의 허물 때문에
  alternatives_korean:
  - 우리의 죄과 때문에
  - 우리의 범죄 때문에
  - 우리의 허물로 인해
  lexicon: HALOT
  rationale: מִן의 원인 의미를 ‘~때문에’로 자연스럽게 살렸고, פֶּשַׁע의 반역적 뉘앙스를 한국어의 ‘허물’로 비교적 절제 있게 옮겼습니다.
- source_word: מְדֻכָּא
  english_pob_choice: crushed
  chosen_korean: 상했습니다
  alternatives_korean:
  - 짓눌렸습니다
  - 부서졌습니다
  - 짓이겨졌습니다
  lexicon: HALOT
  rationale: 동의 반복을 피하면서도 두 번째 병행구가 더 강한 파괴적 고통을 나타내므로, 한국어에서 통용되는 고어감 없는 강한 표현인 ‘상했습니다’를 택했습니다.
- source_word: מוּסַר שְׁלוֹמֵנוּ עָלָיו
  english_pob_choice: the chastisement for our peace was upon him
  chosen_korean: 우리 평강을 위한 징계가 그에게 내렸고
  alternatives_korean:
  - 우리 평안을 위한 징벌이 그에게 있었습니다
  - 우리의 평강을 위한 형벌이 그에게 있었습니다
  - 우리 평화를 위한 징계가 그에게 있었습니다
  lexicon: HALOT
  rationale: 무סר의 징계/처벌 의미를 ‘징계’로 살리되, עָלָיו의 부담 이미지는 ‘내렸고’로 옮겨 짧고 강하게 표현했습니다. ‘평강’은 시적·신학적 어감을 보존합니다.
- source_word: וּבַחֲבֻרָתוֹ נִרְפָּא לָנוּ
  english_pob_choice: and by his wound we are healed
  chosen_korean: 그리고 그의 상처로 우리는 나았습니다.
  alternatives_korean:
  - 그리고 그의 채찍 자국으로 우리는 고침을 받았습니다
  - 그리고 그의 상처로 우리가 치유되었습니다
  - 그리고 그의 상처로 우리가 나았습니다
  lexicon: HALOT
  rationale: חֲבֻרָה의 단수 상처/타박의 이미지를 살리면서, רפא를 결과 상태로 자연스럽게 옮기기 위해 ‘나았습니다’로 번역했습니다.
theological_decisions:
- issue: ‘평강’의 범위
  chosen_reading: ‘평강’을 그대로 유지해 단순한 심리적 평안이나 물질적 번영으로 좁히지 않았습니다.
  alternative_readings:
  - 평안
  - 행복
  - 온전함
  rationale: שָׁלוֹם은 화평, 온전함, 복된 상태를 포함하는 넓은 말이므로, 본문이 의도하는 구속적·언약적 회복의 폭을 유지하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3
- issue: 대속적 연결의 보존
  chosen_reading: 죄와 고난의 연결을 ‘~때문에’와 ‘~을 위한’으로 드러내되, 본문에 없는 세부 속죄이론은 덧붙이지 않았습니다.
  alternative_readings:
  - 도덕적 감화 중심 해석
  - 명시적 형벌대속 문구
  rationale: 히브리어 본문은 종의 고난이 백성의 죄와 평강을 위해 있다는 관계를 분명히 말하지만, 번역이 그 이상을 체계화할 필요는 없습니다.
  doctrine_reference: Affirmations; Translation philosophy §3
