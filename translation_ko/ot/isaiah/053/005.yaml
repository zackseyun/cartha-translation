    issue: מְדֻכָּא를 ‘상했습니다’로 번역함
    rationale: ‘상하다’는 מְחֹלָל의 ‘찔리다/상하다’와 대비되는 דכא의 강한 압착·파괴의 뜻을 약화합니다. ‘짓눌리셨습니다’가 더 충실합니다.
