  source_fidelity: 개정이 필요합니다. מְדֻכָּא는 병행되는 첫 고난 표현보다 강한 ‘짓눌림/짓이겨짐’을 뜻하는데, 초안의 ‘상했습니다’는 그 강도와 병행을 충분히 반영하지 못합니다. 또한 חֲבֻרָתוֹ의 단수와 נִרְפָּא לָנוּ의 치유 결과는 유지하되, 한국어 문장에서는 보다 자연스러운 수동 표현으로 옮기는 것이 좋습니다.
  naturalness: 초안은 ‘찔렸고’와 ‘상했습니다’가 한 문장 안에서 높임·종결 형식상 일관되지 않습니다. 표준어 현대 합쇼체에 맞추어 모든 절을 ‘-습니다/-며’ 형식으로 통일하고, 각 각주를 해당 어휘 바로 뒤에 배치했습니다.
  terminology: ‘평강’은 שָׁלוֹם의 폭넓은 의미를 보존하는 유효한 성경적 용어입니다. פְּשָׁעִים과 עֲוֹנוֹת의 구별을 살리고자 각각 ‘죄과’와 ‘죄악’으로 옮겼습니다. מוּסָר는 본문 문맥에서 ‘징계’로 유지하되, ‘우리의 평강을 위한’이라는 목적·결과 관계를 과도한 교리화 없이 보존했습니다.
  issues:
