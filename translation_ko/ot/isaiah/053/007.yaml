id: ISA.53.7
reference: Isaiah 53:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
  footnotes:
  - marker: a
    text: Or 'He was oppressed, yet he humbled himself'; the Hebrew of the opening line is difficult, and some translations construe the second verb with the sense of self-humbling rather than passive affliction.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 억압을 받으셨고 고난을 당하셨으나[a] 입을 열지 않으셨습니다. 도살장으로 끌려가는 어린 양처럼, 그리고 털 깎는 이들 앞에서 잠잠한 암양처럼, 그도 입을 열지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 억압을 받으셨으나 자신을 낮추셨다’로도 옮길 수 있습니다. 이 절의 첫 행은 히브리어상 해석이 어려워, 둘째 동사를 ‘고난을 당하다’가 아니라 ‘자신을 낮추다’로 이해하는 번역도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  english_pob_choice: was oppressed
  chosen_korean: 억압을 받으셨고
  alternatives_korean:
  - 심한 압제를 당하셨고
  - 학대를 받으셨고
  - 짓눌리셨고
  lexicon: HALOT
  rationale: 동사는 강압적·가혹한 처우를 뜻하므로, 영어 POB의 ‘was oppressed’에 맞춰 현대 한국어로 가장 직접적인 ‘억압을 받다’를 택했습니다.
- source_word: נַעֲנֶה
  english_pob_choice: was afflicted
  chosen_korean: 고난을 당하셨으나
  alternatives_korean:
  - 괴로움을 당하셨으나
  - 괴롭힘을 당하셨으나
  - 낮아지셨으나
  lexicon: HALOT
  rationale: 문맥상 단순 응답이 아니라 수난·고통의 상태이므로, POB의 ‘was afflicted’를 따라 ‘고난을 당하다’로 옮겨 첫 절의 압박과 평행을 살렸습니다.
- source_word: כַּשֶּׂה ... וּכְרָחֵל
  english_pob_choice: like a lamb ... and like a ewe
  chosen_korean: 도살장으로 끌려가는 어린 양처럼, 그리고 털 깎는 자들 앞에서 잠잠한 암양처럼
  alternatives_korean:
  - 도살로 끌려가는 양처럼, 그리고 털 깎는 자들 앞에서 잠잠한 어미양처럼
  - 도살장으로 끌려가는 양 새끼처럼, 그리고 털 깎는 자들 앞에서 잠잠한 암컷 양처럼
  lexicon: HALOT
  rationale: כַּשֶּׂה는 일반적 양보다 어린 양의 이미지가 잘 맞고, רָחֵל은 암양이므로 성별 대비를 살리되 한국어에서 자연스러운 ‘어린 양/암양’으로 구체화했습니다.
- source_word: וְלֹא יִפְתַּח פִּי/ו
  english_pob_choice: yet he did not open his mouth / so he did not open his mouth
  chosen_korean: 입을 열지 않으셨습니다
  alternatives_korean:
  - 입을 열지 않으셨습니다
  - 입을 벌리지 않으셨습니다
  - 말하지 않으셨습니다
  lexicon: HALOT
  rationale: 히브리어의 반복된 관용구를 한국어에서도 그대로 유지해, 침묵의 강조를 살리면서도 ‘말하지 않다’처럼 의미를 약화하지 않았습니다.
theological_decisions:
- issue: 종의 고난을 메시아적 해석으로 미리 번역문 안에 넣을지 여부
  chosen_reading: 본문의 히브리어가 보여 주는 직접 의미—억압, 고난, 침묵, 도살장으로 끌려감—를 먼저 드러내고, 메시아적 동일시는 번역문 밖의 해석으로 남겼습니다.
  alternative_readings:
  - 그를 메시아로 명시하는 표현을 번역문에 넣는 방식
  - 신약 인용을 반영해 더 전통적인 기독교 어휘로 풀어 쓰는 방식
  rationale: 영어 POB의 판단처럼, 이 절은 본문 자체의 비유와 반복을 통해 의미를 전달하므로 번역이 신학적 동일시를 앞당겨 삽입하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3
