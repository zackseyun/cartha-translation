  to: 그는 억압을 받으셨고 고난을 당하셨으나[a] 입을 열지 않으셨습니다. 도살장으로 끌려가는 어린 양처럼, 그리고 털 깎는 이들 앞에서 잠잠한 암양처럼, 그도 입을 열지 않으셨습니다.
