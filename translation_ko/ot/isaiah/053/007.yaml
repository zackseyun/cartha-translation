  terminology: ‘억압’, ‘고난’, ‘어린 양’, ‘암양’은 원문의 어휘적 대비와 시적 이미지를 적절히 보존합니다. ‘그도’는 비교의 결론을 나타내는 한국어 표현으로 무방합니다.
  issues:
