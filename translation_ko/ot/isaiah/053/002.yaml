id: ISA.53.2
reference: Isaiah 53:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַל כַּ/יּוֹנֵ֜ק לְ/פָנָ֗י/ו וְ/כַ/שֹּׁ֨רֶשׁ֙ מֵ/אֶ֣רֶץ צִיָּ֔ה לֹא תֹ֥אַר ל֖/וֹ וְ/לֹ֣א הָדָ֑ר וְ/נִרְאֵ֥/הוּ וְ/לֹֽא מַרְאֶ֖ה וְ/נֶחְמְדֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
  footnotes:
  - marker: a
    text: Or 'like a tender shoot.' The Hebrew יוֹנֵק can denote a tender sprout/shoot in this plant image.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'before him'; the referent may be understood as the LORD, but the text does not restate it explicitly.
    reason: alternative_reading
  - marker: c
    text: Or more literally, 'and we saw him, and there was no appearance that we should desire him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 마치 연한 싹[a]처럼, 마치 메마른 땅에서 난 뿌리처럼 그의 앞[b]에서 자라났습니다. 그에게는 우리가 그를 바라볼 만한 형체도 위엄도 없었고[c], 우리가 그를 사모할 만한 모습도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 새순처럼’. 히브리어 יוֹנֵק은 이 식물 비유에서 연한 싹이나 순을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 앞에서’입니다. 그 지시대상은 야훼로 이해될 수 있지만, 본문은 그것을 다시 명시하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 더 문자적으로, ‘우리가 그를 보았으나, 우리가 그를 사모할 만한 모습은 없었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: grew up
  chosen_korean: 자라났습니다
  alternatives_korean:
  - 커 올라갔습니다
  - 솟아났습니다
  lexicon: HALOT
  rationale: 식물 비유에서 עלה는 단순한 ‘올라가다’보다 성장·돋아남의 의미가 자연스럽기 때문에, 현대 한국어에서는 ‘자라나다’가 가장 매끄럽습니다.
- source_word: כַּיּוֹנֵק
  english_pob_choice: like a young plant
  chosen_korean: 마치 어린 새순처럼
  alternatives_korean:
  - 마치 연한 순처럼
  - 마치 어린 식물처럼
  lexicon: HALOT
  rationale: יוֹנֵק은 여기서 식물 이미지 안에서 ‘연한 새싹/순’의 뜻이 중심이므로, 한국어로는 ‘어린 새순’이 자연스럽고 이미지도 살립니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그 앞에서
  - 주의 앞에서
  lexicon: HALOT
  rationale: 히브리어의 직접적인 공간 표현을 살려 ‘그의 앞에서’로 옮기고, 본문이 명시하지 않은 지시대상을 본문 안에서 확정하지 않았습니다.
- source_word: תֹאַר / הָדָר / מַרְאֶה
  english_pob_choice: form / majesty / appearance
  chosen_korean: 형체도 위엄도 … 모습도
  alternatives_korean:
  - 형태도 위엄도 … 용모도
  - 아름다움도 … 외모도
  lexicon: HALOT
  rationale: 이 세 단어는 외적 인상과 눈에 보이는 형상을 가리키므로, 전통적 미화어인 ‘아름다움’보다 ‘형체/위엄/모습’처럼 시각적·외적 의미를 분리해 살렸습니다.
- source_word: וְנֶחְמְדֵהוּ
  english_pob_choice: that we should desire him
  chosen_korean: 우리가 그를 좋아할 만한
  alternatives_korean:
  - 우리가 그를 사모할 만한
  - 우리가 그를 바랄 만한
  lexicon: HALOT
  rationale: חמד는 단순 호감보다 ‘원하고 끌리는’ 의미가 있으나, 문맥상 외적 매력에 반응하는 뉘앙스를 한국어에서 과장 없이 전달하려고 ‘좋아할 만한’으로 옮겼습니다.
theological_decisions:
- issue: ‘before him’의 지시대상
  chosen_reading: 본문의 모호함을 유지하여 ‘그의 앞에서’로 옮겼습니다.
  alternative_readings:
  - 주 앞에서
  - 그 앞에서(지시대상 미확정)
  rationale: 히브리어는 지시대상을 명시적으로 다시 말하지 않으므로, 본문이 허용하는 모호성을 해소하지 않고 그대로 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: 외적 결핍의 범위
  chosen_reading: ‘형체/위엄/모습’처럼 눈에 보이는 특징으로 제한해 번역했습니다.
  alternative_readings:
  - 사회적 보잘것없음
  - 왕적 위엄의 부재
  - 아름다움의 부재
  rationale: 히브리어 어휘는 주로 시각적 인상에 초점이 있으므로, 해석을 넓혀 사회적 지위나 왕권의 결핍까지 본문에 직접 넣지 않았습니다.
  doctrine_reference: Translation philosophy §1 and §3
