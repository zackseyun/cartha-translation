id: ISA.53.12
reference: Isaiah 53:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
  footnotes:
  - marker: a
    text: Or 'I will give him a share with the many'; the Hebrew of the first clause is compact and has been understood in more than one closely related way.
    reason: alternative_reading
  - marker: b
    text: Or 'was counted among transgressors.'
    reason: lexical_alternative
  - marker: c
    text: Or 'makes intercession for transgressors.' The Hebrew verb can be rendered either more formally or more idiomatically here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 많은 이들 가운데서 그에게 몫을 나누어 주겠습니다[a]. 그는 강한 자들과 함께 전리품을 나눌 것입니다. 이는 그가 자기 생명을 죽음에 내어 주었고 범법자들 가운데 하나로 여겨졌기 때문입니다[b]. 그러나 그는 많은 이들의 죄를 지셨으며, 범법자들을 위해 중보합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그에게 많은 이들과 함께 몫을 주겠다’; 히브리어 첫 절은 매우 압축적이어서 서로 가까운 두 가지 방식으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘범법자들과 함께 수에 들었다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘범법자들을 위해 중재합니다’. 히브리어 동사는 여기서 더 형식적으로 또는 더 관용적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 종의 고난과 뒤따르는 보상을 결론으로 잇는 접속사이므로, 자연스러운 결과 표지인 ‘그러므로’가 가장 적절합니다.
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  english_pob_choice: I will allot him a portion among the many
  chosen_korean: 그에게 많은 이들 가운데 한 몫을 나누어 주며
  alternatives_korean:
  - 그에게 많은 이들 가운데 몫을 배분하며
  - 그에게 많은 이들과 함께 몫을 주며
  lexicon: HALOT
  rationale: 히브리어는 ‘몫/분깃을 배분하다’는 이미지를 압축적으로 담고 있어, ‘한 몫을 나누어 주다’로 살리되 ‘많은 이들 가운데’의 관계를 유지했습니다.
- source_word: עֲצוּמִים יְחַלֵּק שָׁלָל
  english_pob_choice: he will divide plunder with the strong
  chosen_korean: 강한 이들과 노략물을 나눌 것입니다
  alternatives_korean:
  - 강한 이들과 전리품을 나눌 것입니다
  - 강한 자들과 노획물을 나눌 것입니다
  lexicon: HALOT
  rationale: עֲצוּמִים은 ‘강한 이들/강한 자들’의 의미가 자연스럽고, שָׁלָל은 전투 승리의 ‘노략물’로 옮기는 것이 본문 이미지에 가깝습니다.
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  english_pob_choice: he poured out his life to death
  chosen_korean: 그가 자기 생명을 죽음에 내어 주고
  alternatives_korean:
  - 그가 자기 생명을 죽음에 쏟아 붓고
  - 그가 자기 영혼을 죽음에 쏟아 붓고
  lexicon: HALOT
  rationale: נפשׁ는 여기서 추상적 ‘영혼’보다 삶 전체를 가리키는 ‘생명’이 더 적절하며, ‘내어 주다’는 ‘죽음에까지 쏟아 내다’는 헌신의 의미를 한국어로 자연스럽게 전달합니다.
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  english_pob_choice: and was numbered with transgressors
  chosen_korean: 범법자들과 함께 شمار됨을 받았기 때문입니다
  alternatives_korean:
  - 범법자들과 함께 شمار되었습니다
  - 범법자들과 함께 계산되었습니다
  lexicon: HALOT
  rationale: פֹּשְׁעִים은 단순한 ‘죄인’보다 반역·위반의 뉘앙스가 있는 ‘범법자들’이 더 가깝고, נִמְנָה는 ‘함께 شمار됨을 받다’라는 수동적 포함을 살려야 하므로 ‘함께 شمار됨을 받았다’로 처리했습니다.
- source_word: חֵטְא רַבִּים נָשָׂא
  english_pob_choice: he bore the sin of many
  chosen_korean: 많은 이들의 죄를 지고
  alternatives_korean:
  - 많은 이들의 죄를 담당하고
  - 많은 이들의 죄를 짊어지고
  lexicon: HALOT
  rationale: נָשָׂא חֵטְא는 대표적·대속적 ‘짐지다’의 뜻을 지니므로, ‘죄를 지다/지고’로 옮기면 동사 자체의 부담 감각을 유지하면서도 자연스럽습니다.
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  english_pob_choice: and intercedes for transgressors
  chosen_korean: 범법자들을 위해 중보합니다
  alternatives_korean:
  - 범법자들을 위해 간구합니다
  - 범법자들을 위하여 중재합니다
  lexicon: HALOT
  rationale: יַפְגִּיעַ는 문맥상 청원·중재의 뜻이 강하므로, 한국어 교회 용어 중 의미를 가장 안정적으로 담는 ‘중보하다’를 채택했습니다.
theological_decisions:
- issue: ‘many’의 범위
  chosen_reading: ‘많은 이들’로 옮겨 범위를 넓히거나 좁히지 않고 본문 표현을 그대로 유지했습니다.
  alternative_readings:
  - 모든 이
  - 무리
  rationale: 히브리어는 ‘많은’이라고만 말하므로, 구속 범위를 번역이 미리 확정하지 않도록 했습니다.
  doctrine_reference: 본문의 표현을 보존하고 신학적 결론을 번역에 앞서 확정하지 않음
- issue: 마지막 동사의 시제·양상
  chosen_reading: ‘중보합니다’로 현재적·상시적 진술처럼 살렸습니다.
  alternative_readings:
  - 중보하였습니다
  - 중보할 것입니다
  rationale: 히브리어 미완료형은 결과적/현재적 진술로 읽을 수 있어, 예언적 요약의 힘을 살리면서도 과거형으로 고정하지 않았습니다.
  doctrine_reference: optimal equivalence; 예언적 현재의 허용
- issue: 범법자들과의 동일시
  chosen_reading: ‘범법자들과 함께 شمار됨을 받았기 때문입니다’로 동일시의 강도를 보존했습니다.
  alternative_readings:
  - 범법자들 가운데 셈이 되었기 때문입니다
  - 범법자들과 함께 계산되었기 때문입니다
  rationale: 서번트가 실제로 반역자들과 함께 ‘간주된’ 충격을 유지해야 하므로, 완화된 표현보다 수동적 포함을 드러내는 표현을 택했습니다.
  doctrine_reference: source-direct rendering; 대속적 수난의 문맥 보존
