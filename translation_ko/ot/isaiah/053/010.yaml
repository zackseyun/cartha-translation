id: ISA.53.10
reference: Isaiah 53:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
  footnotes:
  - marker: a
    text: Or 'And the LORD' or 'But the LORD'; the Hebrew conjunction can be rendered in several ways depending on discourse flow.
    reason: lexical_alternative
  - marker: b
    text: Or 'he afflicted him' or 'he caused grief.'
    reason: lexical_alternative
  - marker: c
    text: Or 'When his life is made a guilt offering,' or 'If you make his life a guilt offering.' The Hebrew of this clause is difficult, especially the subject of 'make.'
    reason: alternative_reading
  - marker: d
    text: '''Guilt offering'' refers to the sacrificial offering for guilt/reparation in the Torah.'
    reason: cultural_note
  - marker: e
    text: Or 'the will/purpose of the LORD will succeed by his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 그를 부수기를 기뻐하셨습니다[a]. 야훼께서는 그를 병들게 하셨습니다[b]. 그의 생명이 자신을 속건제물로 삼으면[c], 그는 자손을 보고 자기 날들을 길게 할 것이며, 야훼의 기쁨은 그의 손을 통해 이루어질 것입니다[e].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 야훼께서’나 ‘그러나 야훼께서’. 히브리어 접속사는 문맥에 따라 여러 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 괴롭게 하셨습니다’나 ‘그에게 고통을 주셨습니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 생명이 속건제물이 되면’, ‘그의 생명이 속건제물로 드려지면’, 또는 ‘당신이 그의 생명을 속건제물로 삼으면’. 이 절은 히브리어 문장 구조, 특히 ‘삼다’의 주어가 특히 어렵습니다.
    reason: alternative_reading
  - marker: d
    text: ‘속건제물’은 토라의 죄책과 배상을 위한 제사를 가리킵니다.
    reason: cultural_note
  - marker: e
    text: 또는 ‘야훼의 뜻/목적은 그의 손에서 성공할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Yet Yahweh / the LORD
  chosen_korean: 그러나 야훼께서는
  alternatives_korean:
  - 그리고 야훼께서는
  - 야훼께서도
  lexicon: HALOT
  rationale: 문맥상 종의 고난과 강한 대조를 이루므로 역접을 살린 ‘그러나’가 자연스럽고, 고유명은 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: חָפֵץ
  english_pob_choice: it pleased
  chosen_korean: 그를 부수기를 기뻐하셨습니다
  alternatives_korean:
  - 그를 부수기를 원하셨습니다
  - 그를 부수기를 원하셨고
  - 그를 부수는 것을 좋아하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘기뻐하다/원하다’의 결을 살리되, 한국어에서 직접적인 감정쾌락처럼 들리지 않도록 목적어구로 자연스럽게 풀었습니다.
- source_word: הֶחֱלִי
  english_pob_choice: he made him sick
  chosen_korean: 그를 병들게 하셨습니다
  alternatives_korean:
  - 그에게 병을 주셨습니다
  - 그를 괴롭게 하셨습니다
  - 그를 아프게 하셨습니다
  lexicon: HALOT
  rationale: 사역형의 직접적 의미를 보존하기 위해 ‘병들게 하다’를 택했고, 영어 POB의 구체성을 따라 완곡하게 바꾸지 않았습니다.
- source_word: אָשָׁם
  english_pob_choice: guilt offering
  chosen_korean: 속건제물
  alternatives_korean:
  - 속죄제물
  - 죄값 제물
  - 배상제물
  lexicon: HALOT
  rationale: 토라의 희생제사 용어를 살려 전통적이면서도 본문 맥락에 맞는 ‘속건제물’을 사용했습니다.
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 씨를
  alternatives_korean:
  - 후손을
  - 자손을
  - 자녀를
  lexicon: HALOT
  rationale: 시적 병행을 유지하면서도 ‘offspring’의 압축성을 살리기 위해 ‘씨’를 택했습니다. 출산/번식 이미지보다 언약적 후손 개념을 남깁니다.
- source_word: וְחֵפֶץ יְהוָה
  english_pob_choice: and the pleasure of Yahweh
  chosen_korean: 야훼의 기쁨
  alternatives_korean:
  - 야훼의 뜻
  - 야훼의 목적
  lexicon: HALOT
  rationale: 앞의 חָפֵץ와 어휘적 연결을 한국어에서도 드러내기 위해 같은 계열의 ‘기쁨’을 유지했습니다.
- source_word: בְּיָדוֹ יִצְלָח
  english_pob_choice: will prosper in his hand
  chosen_korean: 그의 손에서 번성할 것입니다
  alternatives_korean:
  - 그의 손에서 성공할 것입니다
  - 그의 손으로 번성할 것입니다
  - 그의 손 안에서 이루어질 것입니다
  lexicon: HALOT
  rationale: ‘in his hand’의 관용적 행위/수단 의미를 살리면서, ‘prosper’의 성취·번영 뉘앙스를 ‘번성하다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 행위와 허용 의미
  chosen_reading: ‘야훼께서는 그를 부수기를 기뻐하셨습니다. 그를 병들게 하셨습니다’로 직접적 행위를 유지했습니다.
  alternative_readings:
  - 야훼께서는 그가 부서지도록 허락하셨습니다
  - 야훼께서는 그에게 고난이 오도록 두셨습니다
  rationale: 히브리어 동사들은 원인을 야훼께 직접 돌리므로, 허용으로 완화하면 본문의 긴장과 책임 주체가 약해집니다. 다만 ‘기뻐하셨다’는 표현은 잔혹한 쾌락이 아니라 신적 뜻과 목적을 가리키는 것으로 이해했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 속건제물 절의 난해한 주어
  chosen_reading: ‘그의 생명을 속건제물로 삼으시면’로 본문형을 최대한 보존했습니다.
  alternative_readings:
  - 그의 생명이 속건제물이 되면
  - 그의 생명을 속건제물로 드리면
  - 그의 생명이 속건제물로 만들어지면
  rationale: 히브리어는 조건절의 주어와 시제가 난해하므로, 해석을 과도하게 확정하지 않고 조건문 형태를 유지했습니다.
  doctrine_reference: Translation philosophy §3
