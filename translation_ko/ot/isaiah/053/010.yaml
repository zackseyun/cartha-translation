    rationale: ‘그의 생명을 … 삼으시면’은 높임 종결 때문에 미확정 주어가 야훼로 읽히기 쉽습니다. תָּשִׂים을 נַפְשׁוֹ에 연결하는 가능한 독법을 본문에 반영하고, 다른 주어·수동 해석은 각주에 남기는 편이 낫습니다.
