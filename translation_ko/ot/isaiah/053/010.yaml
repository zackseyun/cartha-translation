    issue: ‘그가 그를 병들게 하셨습니다’의 대명사 지시가 모호함
    rationale: 히브리어 הֶחֱלִי는 야훼를 주어로 하고 종을 목적어로 합니다. 한국어에서는 ‘그가’가 누구인지 분명하지 않으므로 주어를 ‘야훼께서’로 반복해야 합니다.
