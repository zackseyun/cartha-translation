  rationale: 원문에 대한 충실성을 위해 얼굴을 가리는 행위의 방향을 바로잡고, 현대 표준어 표기를 교정했습니다. '질병을 아는 이'는 ידוע חלי의 직역적 긴장을 보존하며, 관련 각주는 실제 대안과 원문의 타원성을 명확히 설명하도록 정비했습니다.
