id: ISA.53.3
reference: Isaiah 53:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִבְזֶה֙ וַ/חֲדַ֣ל אִישִׁ֔ים אִ֥ישׁ מַכְאֹב֖וֹת וִ/יד֣וּעַ חֹ֑לִי וּ/כְ/מַסְתֵּ֤ר פָּנִים֙ מִמֶּ֔/נּוּ נִבְזֶ֖ה וְ/לֹ֥א חֲשַׁבְנֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
  footnotes:
  - marker: a
    text: Or 'rejected by men.' The Hebrew phrase is difficult; the traditional rendering emphasizes social repudiation, while 'forsaken by men' more directly reflects the underlying wording.
    reason: alternative_reading
  - marker: b
    text: Or 'a man of sorrows.'
    reason: lexical_alternative
  - marker: c
    text: Or 'acquainted with grief.' More literally, 'acquainted with sickness/illness.'
    reason: lexical_alternative
  - marker: d
    text: 'The Hebrew is elliptical: ''like a hiding of faces from him.'' The sense is that people turned their faces away from him.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 멸시받고 사람들에게 버림받았으며[a], 고통의 사람[b]이요 질병을 아는 이[c]였습니다. 또 사람들이 그에게서 얼굴을 가리는 것 같은 이[d]였고, 멸시받았으며, 우리는 그를 귀하게 여기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들에게 거절당한 이’. 히브리어 구절은 난해하며, 전통 번역은 사회적 배척을 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘슬픔의 사람’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘슬픔을 아는 이’. 더 문자적으로는 ‘병/질병을 아는 이’입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 생략된 표현입니다. 문자적으로는 ‘그에게서 얼굴을 가리는 것처럼’이며, 사람들이 그에게서 얼굴을 돌리거나 가렸다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְזֶה
  english_pob_choice: despised
  chosen_korean: 업신여김을 받고
  alternatives_korean:
  - 멸시를 받고
  - 경멸을 받고
  - 업신여겨졌고
  lexicon: HALOT
  rationale: נבזה는 경멸과 천대를 받는 상태를 가리키므로, 동사구로 풀어 ‘업신여김을 받고’라고 옮겨 결과적 수동성을 살렸습니다.
- source_word: וַחֲדַל אִישִׁים
  english_pob_choice: rejected by men
  chosen_korean: 버림받은 이
  alternatives_korean:
  - 사람들에게 거절당한 이
  - 사람들에게 버림받은 이
  - 사람들에게서 끊어진 이
  lexicon: HALOT
  rationale: חדל은 ‘끊어지다/부족하다/버려지다’의 뉘앙스를 가지므로, 사회적 단절과 버려짐을 담는 ‘버림받은 이’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: אִישׁ מַכְאֹבֹת
  english_pob_choice: a man of pains
  chosen_korean: 고통의 사람
  alternatives_korean:
  - 슬픔의 사람
  - 고난의 사람
  - 아픔의 사람
  lexicon: HALOT
  rationale: מַכְאֹב은 단순한 감정적 슬픔보다 실제적인 아픔과 고통을 가리키므로, ‘고통의 사람’이 POB의 concrete sense를 한국어로 잘 살립니다.
- source_word: וִידוּעַ חֹלִי
  english_pob_choice: acquainted with sickness
  chosen_korean: 질병에 익숙한 이
  alternatives_korean:
  - 질병을 아는 이
  - 병고를 익힌 이
  - 슬픔에 익숙한 이
  lexicon: HALOT
  rationale: ידע + חֹלִי는 질병/병약함과 친숙하다는 뜻이므로, 현대 한국어에서 읽히는 ‘질병에 익숙한 이’로 옮겨 육체적 고통의 상시성을 드러냈습니다.
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  english_pob_choice: like one from whom people hide their faces
  chosen_korean: 사람들에게서 얼굴을 가리우는 것 같은
  alternatives_korean:
  - 얼굴을 숨기는 것 같은
  - 그에게서 얼굴을 돌리는 것 같은
  - 얼굴을 감추는 것 같은
  lexicon: HALOT
  rationale: 히브리어는 문장이 생략된 도치적 표현이므로, 사람들의 외면을 뜻하는 관용을 살리되 한국어로 읽히도록 ‘사람들에게서 얼굴을 가리우는 것 같은’으로 옮겼습니다.
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  english_pob_choice: we did not esteem him
  chosen_korean: 우리는 그를 귀하게 여기지 않았습니다
  alternatives_korean:
  - 우리는 그를 존중하지 않았습니다
  - 우리는 그를 헤아리지 않았습니다
  - 우리는 그를 가치 있게 보지 않았습니다
  lexicon: HALOT
  rationale: חשב는 ‘헤아리다/여기다/평가하다’의 뜻이므로, 평가의 결핍을 분명히 하는 ‘귀하게 여기지 않았습니다’가 문맥상 가장 적절합니다.
theological_decisions:
- issue: 메시아적 해석을 직접 드러낼지 여부
  chosen_reading: 본문 자체의 종의 묘사를 그대로 살리고, 해석적 확장은 넣지 않았습니다.
  alternative_readings:
  - ‘메시아’나 ‘그리스도’를 직접 삽입하는 번역
  rationale: 이 절은 기독교적으로 메시아적 독법이 가능하지만, 히브리어 본문은 그런 식별어를 포함하지 않으므로 번역은 원문의 서술 범위를 지키는 것이 바람직합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: ‘질병’과 ‘고통’의 구체성 유지
  chosen_reading: 정서적 ‘슬픔’보다 육체적·실존적 고통과 질병의 구체성을 유지했습니다.
  alternative_readings:
  - ‘슬픔’과 ‘근심’ 중심의 전통적 표현
  rationale: 히브리어 어휘가 실제 고통과 병약함을 가리키므로, 본문의 긴장—고난이 추상적 감상이 아니라 몸에 새겨진 현실이라는 점—을 흐리지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
