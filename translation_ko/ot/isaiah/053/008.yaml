id: ISA.53.8
reference: Isaiah 53:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
  footnotes:
  - marker: a
    text: Or 'who spoke of,' 'who declared,' or 'who pondered' his generation; the Hebrew verb is rare and difficult.
    reason: lexical_alternative
  - marker: b
    text: '''His generation'' may refer to his contemporaries, his descendants, or more broadly his fate in his lifetime.'
    reason: alternative_reading
  - marker: c
    text: Or 'the stroke was upon him'; Hebrew לָמוֹ is formally plural but may function as a poetic singular here. Some take it as 'upon them.'
    reason: alternative_reading
translation:
  language: ko
  text: 압제와 심판 때문에 그는 끌려갔습니다[a]. 그리고 그의 세대에 관해서는, 누가 그가 살아 있는 땅에서 끊겨 나갔으며[c][b] 내 백성의 범죄로 인해 징계를 받았다는 것을 생각했겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 세대에 관해 누가 말했겠는가’, ‘누가 선언했겠는가’, ‘누가 숙고했겠는가’로도 옮길 수 있습니다. 히브리어 동사는 희귀하고 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 세대’는 그의 동시대 사람들, 그의 후손들, 또는 더 넓게는 그의 생애와 운명을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그에게 가해진 것은 위에 있었다’. 히브리어 לָמוֹ는 형태상 복수이지만 여기서는 시적 단수로 기능할 수 있습니다. 어떤 이들은 ‘그들 위에’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  english_pob_choice: By oppression
  chosen_korean: 압제 때문에
  alternatives_korean:
  - 억류 때문에
  - 억압 때문에
  lexicon: HALOT
  rationale: עֹצֶר는 구금의 의미도 가능하지만, כאן에서는 מִמִּשְׁפָּט과 병렬로 제시되어 강압적·폭력적 처우를 가리키는 것이 자연스러워 ‘압제’로 옮겼습니다.
- source_word: וּמִמִּשְׁפָּט
  english_pob_choice: and judgment
  chosen_korean: 심판
  alternatives_korean:
  - 재판
  - 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט는 법적 판결/재판/심판의 폭을 가지지만, 여기서는 결과보다 절차와 판정의 차원을 살려 ‘심판’으로 번역했습니다.
- source_word: מִי יְשׂוֹחֵחַ
  english_pob_choice: who considered
  chosen_korean: 누가 ... 생각했겠습니까
  alternatives_korean:
  - 누가 ... 말했겠습니까
  - 누가 ... 되새겼겠습니까
  lexicon: HALOT
  rationale: 희귀 동사 יְשׂוֹחֵחַ의 의미가 불확실하므로, 문맥상 ‘그의 세대가 이 일을 알아차리거나 숙고했는가’라는 질문을 살리는 쪽으로 ‘생각하다’로 처리했습니다.
- source_word: נִגְזַר מֵאֶרֶץ חַיִּים
  english_pob_choice: he was cut off from the land of the living
  chosen_korean: 그가 살아 있는 땅에서 끊겨 나갔으며
  alternatives_korean:
  - 그가 산 자의 땅에서 끊겨 나갔으며
  - 그가 생명의 땅에서 끊겨 나갔으며
  lexicon: HALOT
  rationale: ‘land of the living’의 관용을 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘살아 있는 땅’으로 옮겼습니다. נִגְזַר는 사망을 내포한 ‘끊겨 나가다’가 문맥에 맞습니다.
- source_word: מִפֶּשַׁע עַמִּי
  english_pob_choice: for the transgression of my people
  chosen_korean: 내 백성의 범죄로 인해
  alternatives_korean:
  - 내 백성의 허물 때문에
  - 내 백성의 반역 때문에
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 언약적·도덕적 위반을 뜻하므로, ‘범죄’가 가장 सीधे한 대응입니다. מִן의 인과 관계는 ‘~로 인해’로 드러냈습니다.
theological_decisions:
- issue: לָמוֹ의 수와 지시 대상
  chosen_reading: 주된 본문에서는 ‘그’로 단수 처리하여 종의 단수 흐름을 유지했습니다.
  alternative_readings:
  - 그에게
  - 그들에게
  - 그 위에
  rationale: 형태는 복수형이지만 이 단락의 종은 일관되게 단수이므로, 본문은 단수 의미를 택하되 해석의 난점을 각주로 남겨 독단적으로 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: דּוֹרוֹ의 의미 범위
  chosen_reading: ‘그의 세대’로 넓게 유지했습니다.
  alternative_readings:
  - 그의 동시대 사람들
  - 그의 후손들
  - 그의 생애/운명
  rationale: דּוֹר는 동시대, 후손, 생애 범위를 모두 가질 수 있어 본문에서 좁히지 않고 원어의 넓이를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
