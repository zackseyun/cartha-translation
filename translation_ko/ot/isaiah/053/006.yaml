source:
  edition: WLC
  text: כֻּלָּ֨/נוּ֙ כַּ/צֹּ֣אן תָּעִ֔ינוּ אִ֥ישׁ לְ/דַרְכּ֖/וֹ פָּנִ֑ינוּ וַֽ/יהוָה֙ הִפְגִּ֣יעַ בּ֔/וֹ אֵ֖ת עֲוֺ֥ן כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
  footnotes:
  - marker: a
    text: Or 'each one has turned to his own way.' The Hebrew has the masculine singular 'each man' with distributive force, referring to all people in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD has caused the iniquity of us all to fall on him' or 'to meet on him.' The Hebrew verb can carry the sense of causing something to strike or converge upon someone.
    reason: alternative_reading
  - marker: c
    text: '''Iniquity'' may also be understood as ''guilt'' or, by extension, the liability or punishment associated with guilt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 모두는 양처럼 길을 잃었습니다. 각자 자기 길로 돌아섰습니다. 그러나 야훼께서 우리 모두의 죄악을 그에게 지우셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֻּלָּנוּ
  english_pob_choice: All of us
  chosen_korean: 우리 모두
  alternatives_korean:
  - 우리 전부
  - 우리 모두 다
  lexicon: HALOT
  rationale: 문장 첫머리의 총괄성을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현입니다.
- source_word: כַּצֹּאן
  english_pob_choice: like sheep
  chosen_korean: 양처럼
  alternatives_korean:
  - 양들처럼
  - 양과 같이
  lexicon: HALOT
  rationale: 비유를 간결하게 유지해, 뒤의 ‘길을 잃었습니다’와 자연스럽게 결합되도록 했습니다.
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  english_pob_choice: each of us has turned to his own way
  chosen_korean: 각자 자기 길로 돌아섰습니다
  alternatives_korean:
  - 각 사람이 자기 길로 향했습니다
  - 각자 자신의 길로 갔습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 단수 אִישׁ를 한국어에서는 ‘각자’로 살리되, ‘자기 길’로 개별적이고 자기중심적인 방향 전환을 드러냈습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본 원칙에 따라 신명은 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: הִפְגִּיעַ בּוֹ אֵת עֲוֺן כֻּלָּנוּ
  english_pob_choice: has laid on him the iniquity of us all
  chosen_korean: 우리 모두의 죄악을 그에게 지우셨습니다
  alternatives_korean:
  - 우리 모두의 죄악을 그에게 넘기셨습니다
  - 우리 모두의 죄책을 그에게 두셨습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 ‘두다’보다 어떤 것을 누군가에게 닿게 하거나 미치게 하는 뉘앙스가 있어, 문맥상 전가의 의미를 살린 ‘지우셨습니다’가 가장 적절합니다.
theological_decisions:
- issue: 'עֲוֹן의 범위: 죄악/죄책/형벌 가능성'
  chosen_reading: ‘죄악’으로 옮겨 도덕적 잘못과 그에 따른 책임의 무게를 함께 남겼습니다.
  alternative_readings:
  - 죄책
  - 죄에 대한 형벌
  - 죄과
  rationale: 히브리어 עָוֹן은 행위, 죄책, 결과를 함께 가리킬 수 있으므로, 하나로 과도하게 좁히지 않고 의미의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: וַיהוָה의 행위가 지닌 대속적 함의
  chosen_reading: 본문이 말하는 것은 야훼께서 모두의 죄악을 ‘그에게’ 지우셨다는 사실까지로 유지하고, 그 기제를 설명하는 교리적 확장은 하지 않았습니다.
  alternative_readings:
  - 형벌을 그에게 내리셨습니다
  - 대속 제물로 삼으셨습니다
  rationale: 이 절은 대리적 짐 지움을 강하게 시사하지만, 본문이 말하는 범위를 넘어 더 체계적인 속죄 공식으로 풀어쓰지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
