review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 ‘그에게 지우셨습니다’는 한국어에서 죄를 그에게 전가하여 유죄로 만들었다는 뜻으로도 읽힐 수 있어, 히브리어 הִפְגִּיעַ의 ‘그에게 미치게/닥치게 하다’라는 표현을 충분히 전달하지 못합니다. 또한 접속사 וְ를 ‘그러나’로 옮기면 원문에 명시되지 않은 강한 역접을 더합니다.
  naturalness: ‘양처럼 길을 잃었습니다’와 ‘각자 자기 길로 돌아섰습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그에게 우리 모두의 죄악을 지게 하셨습니다’는 문맥상 짐을 지운다는 뜻을 명료하게 전달하면서도 자연스럽습니다.
  terminology: ‘야훼’, ‘죄악’, ‘그’는 초안의 학술적 신명 표기와 본문의 지시 대상을 유지합니다. ‘죄악을 지게 하셨습니다’는 עָוֹן의 행위·죄책·그 결과에 관한 의미 범위를 완전히 교리화하지 않으면서, 그 죄악이 그에게 미치게 되었다는 히브리어의 사역 구문을 반영합니다.
  issues:
  - severity: medium
    issue: ‘우리 모두의 죄악을 그에게 지우셨습니다’
    rationale: ‘죄를 지우다’는 한국어에서 죄를 씌우거나 유죄로 돌린다는 뜻으로 이해될 수 있습니다. הִפְגִּיעַ בּוֹ는 죄악이 그에게 닥치거나 그에게 모이게 하셨다는 뜻이므로, ‘그에게 … 지게 하셨습니다’가 더 충실합니다.
  - severity: low
    issue: ‘그러나’의 추가
    rationale: 히브리어 וַ는 여기서 단순 연결이며, 문맥상 대비는 느껴질 수 있으나 명시적 역접을 반드시 요구하지 않습니다. ‘그리고’로 옮겨 원문의 연결을 보존합니다.
  revised_text: 우리 모두는 양처럼 길을 잃었습니다. 각자 자기 길로 돌아섰습니다. 그리고 야훼께서 우리 모두의 죄악을 그에게 지게 하셨습니다.
