id: ISA.53.11
reference: Isaiah 53:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
  footnotes:
  - marker: a
    text: Or 'by knowledge of him,' taking the phrase to refer to others coming to know the servant rather than to the servant's own knowledge.
    reason: alternative_reading
  - marker: b
    text: Some ancient witnesses read 'he will see light and be satisfied.' The Masoretic Text reads simply 'he will see and be satisfied.'
    reason: textual_variant
translation:
  language: ko
  text: 그의 영혼의 고통에서 그는 보고 만족하실 것입니다[a]; 그의 지식으로 나의 의로운 종이 많은 사람을 의롭게 하며[b], 그들의 죄악을 그가 지니실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 아는 지식으로’로 이해하여, 이 구절을 종 자신의 지식이 아니라 다른 사람들이 그 종을 아는 지식으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 일부 고대 사본들은 ‘그가 빛을 보고 만족하리라’고 읽습니다. 여기서는 마소라 본문처럼 ‘보고 만족하리라’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  english_pob_choice: From the anguish of his soul
  chosen_korean: 그의 영혼의 고통에서
  alternatives_korean:
  - 그의 영혼의 고뇌에서
  - 그의 심령의 고통에서
  - 그의 영혼의 수고에서
  lexicon: HALOT
  rationale: עָמָל은 단순한 노동보다 고통과 괴로움을 가리킬 수 있으므로, 이 문맥에서는 ‘고통’으로 옮겨 고난의 강도를 살렸습니다. נֶפֶשׁ은 ‘영혼’이 가장 직접적이며, 합쇼체 문맥에서도 자연스럽습니다.
- source_word: יִרְאֶה יִשְׂבָּע
  english_pob_choice: he will see and be satisfied
  chosen_korean: 그는 보고 만족하실 것입니다
  alternatives_korean:
  - 그는 보고 흡족하실 것입니다
  - 그는 보시고 만족하실 것입니다
  lexicon: HALOT
  rationale: 본문은 ‘보고 만족하다’의 병렬을 유지하므로 두 동사를 그대로 살렸습니다. 주체가 메시아적 종이므로 종결은 공손한 합쇼체를 유지했습니다.
- source_word: בְּדַעְתּוֹ
  english_pob_choice: by his knowledge
  chosen_korean: 그의 지식으로
  alternatives_korean:
  - 그를 아는 지식으로
  - 그에 대한 지식으로
  - 그의 앎으로
  lexicon: HALOT
  rationale: 접미사 -וֹ를 가장 직접적으로 따르면 ‘그의 지식’이 되므로 본문은 이를 따랐습니다. 동시에 이 구절은 ‘그를 아는 지식’이라는 해석도 가능하므로 그 대안은 각주에 보존했습니다.
- source_word: יַצְדִּיק צַדִּיק עַבְדִּי לָרַבִּים
  english_pob_choice: my righteous servant will justify many
  chosen_korean: 나의 의로운 종이 많은 사람을 의롭게 하며
  alternatives_korean:
  - 나의 의로운 종이 많은 사람을 의롭다 하며
  - 나의 의로운 종이 많은 사람을 의롭다고 선언하며
  lexicon: HALOT
  rationale: הִפְעִיל 형태의 צדק은 ‘의롭다 하다/의롭게 하다’의 법정적 의미가 강하므로 ‘의롭게 하다’로 옮겼습니다. ‘많은 사람’은 לָרַבִּים의 수량 표현을 보존합니다.
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  english_pob_choice: and he will bear their iniquities
  chosen_korean: 그들의 죄악을 그가 지니실 것입니다
  alternatives_korean:
  - 그들의 죄악을 그가 담당하실 것입니다
  - 그들의 죄책을 그가 지니실 것입니다
  - 그들의 죄악을 그가 짊어지실 것입니다
  lexicon: HALOT
  rationale: עָוֺן은 단순한 ‘죄’보다 죄악과 죄책을 함께 띠는 말이므로 ‘죄악’으로 옮겼습니다. יִסְבֹּל은 짐을 ‘지다/담당하다’의 의미를 갖지만, 문맥상 부하를 짊어지는 이미지를 살려 ‘지니실 것입니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: בְּדַעְתּוֹ의 주어 해석
  chosen_reading: 본문은 종의 ‘그의 지식’이라는 직접적 문법 형태를 유지했습니다.
  alternative_readings:
  - ‘그를 아는 지식으로’(다른 사람들이 그를 아는 지식)
  rationale: 히브리어 접미사는 가장 자연스럽게 종 자신의 지식을 가리키지만, 이 표현은 다른 해석도 가능하므로 본문에서는 문법에 가장 가까운 형태를 유지하고 대안은 각주로 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: שָׂבַע/יִשְׂבָּע의 만족 표현
  chosen_reading: ‘만족하실 것입니다’로 종의 결말을 긍정적으로 살렸습니다.
  alternative_readings:
  - ‘흡족하실 것입니다’
  - ‘충만해지실 것입니다’
  rationale: 문맥상 고난 이후의 성취를 말하므로, ‘만족’이 결과를 가장 직접적으로 전달합니다. 과도한 해석 없이 본문이 말하는 충분함을 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
