- from: 그의 영혼의 고통에서 그는 보고 만족하실 것입니다[a]; 그의 지식으로 나의 의로운 종이 많은 사람을 의롭게 하며[b], 그들의 죄악을 그가 지니실 것입니다.
  to: 그의 영혼이 겪은 고통 뒤에, 그는 보고[a] 만족할 것입니다. 그의 지식으로 나의 의로운 종이 많은 사람을 의롭게 할 것이며[b], 그들의 죄악을 그가 짊어질 것입니다.
  rationale: 이문 각주는 ‘보고’에, בְּדַעְתּוֹ의 대안 해석 각주는 ‘지식’에 각각 연결하도록 바로잡았습니다. 한국어 본문은 히브리어의 의미 관계와 미래형을 유지하되, 직역투를 줄이고 סבל의 부담-짐 의미를 더 정확히 반영했습니다.
