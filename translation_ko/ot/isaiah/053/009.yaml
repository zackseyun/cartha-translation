    issue: ‘부자와 함께 그의 죽음들 가운데서였으나’가 문법적으로 불완전하고 앞 절과의 병렬 관계가 불명확합니다.
    rationale: 히브리어는 ‘그의 무덤’과 ‘그의 죽음들에서 부자와 함께’를 한 동사 아래 병렬로 둡니다. 초안은 두 번째 요소를 독립적인 미완결 절처럼 만들어 의미 관계를 흐립니다.
