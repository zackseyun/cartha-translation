  source_fidelity: 개정이 필요합니다. 초안의 ‘부자와 함께 그의 죽음들 가운데서였으나’는 서술어 연결이 불완전하여 히브리어의 병렬 관계를 한국어로 재현하지 못합니다. 또 양보 관계는 ‘~였으나’보다 무죄의 사실을 전면에 두는 ‘~는데도’가 원문의 עַל לֹא에 더 충실합니다. בְּמֹתָיו의 형태상 복수는 본문과 각주에서 유지합니다.
  naturalness: ‘그의 무덤은 … 정해졌고, 그의 죽음들에는 … 정해졌습니다’는 다소 이질적인 ‘죽음들’을 의도적으로 보존하면서도 문장 구조를 완결합니다. 수동 표현은 히브리어 동사의 명사 주어가 제시되지 않은 점을 한국어에서 불필요하게 특정하지 않고 전달합니다.
  terminology: ‘악인들’, ‘무덤’, ‘부자’, ‘폭력’, ‘속임수’는 적절합니다. ‘정해지다’는 이 문맥에서 매장 처소의 배정·지정을 자연스럽게 나타내며, 특정 신학적 행위자를 도입하지 않습니다.
  issues:
