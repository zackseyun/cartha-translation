id: ISA.53.9
reference: Isaiah 53:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in his deaths''; many translations render idiomatically ''in his death'' or ''at his death.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'his grave was assigned with the wicked.' The Hebrew verb literally means 'gave/set' and the subject is not explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 무덤은 악인들과 함께 정해졌고[b], 그의 죽음들[a]에는 부자와 함께 정해졌습니다. 그가 폭력을 행하지 않았고 그의 입에 속임수도 없었는데도 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 죽음들’입니다. 많은 번역은 이를 관용적으로 ‘그의 죽음’ 또는 ‘그가 죽을 때’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘주다/두다/정하다’라는 뜻입니다. 동사는 남성 단수 형태이나 명사 주어가 명시되어 있지 않아, ‘그의 무덤이 정해졌다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: they assigned
  chosen_korean: 배정했고
  alternatives_korean:
  - 주었습니다
  - 지정했고
  - 두었습니다
  - 할당했고
  lexicon: HALOT
  rationale: 히브리어 נתן의 여기서의 용법은 단순한 ‘주다’보다 무덤의 배치/지정을 뜻하므로, 문맥상 ‘배정하다’가 가장 직접적입니다. 영어 POB의 주체 불명 처리도 반영해 한국어에서도 주어를 새로 정하지 않았습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들과
  alternatives_korean:
  - 악인과
  - 악한 자들과
  - 사악한 자들과
  lexicon: HALOT
  rationale: 복수 명사적 용법을 살려 ‘악인들’로 옮겼고, 뒤의 ‘함께’와 자연스럽게 연결되도록 조사만 보정했습니다.
- source_word: בְּמֹתָיו
  english_pob_choice: in his deaths
  chosen_korean: 그의 죽음들 가운데서였으나
  alternatives_korean:
  - 그의 죽음에서였으나
  - 그가 죽을 때였으나
  - 그의 죽음 가운데서였으나
  lexicon: HALOT
  rationale: 히브리어의 복수형을 평탄화하지 않고 ‘죽음들’로 최대한 드러냈습니다. 다만 한국어의 부자연스러움을 줄이기 위해 위치 표현을 덧붙여 원문의 이질감을 보존했습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 포악
  - 폭행
  - 불의
  lexicon: HALOT
  rationale: חמס의 직접적 의미인 폭력/폭행 가운데, 여기서는 행위의 성격을 가장 간결하게 드러내는 ‘폭력’을 택했습니다. 앞의 무덤 배치와 연결되는 비난의 부재를 분명히 합니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 거짓
  - 사기
  lexicon: HALOT
  rationale: ‘속임수’는 입과 연결된 발화의 왜곡을 자연스럽게 보여 주며, ‘입에는’과의 결합도 현대 한국어에서 무리하지 않습니다.
theological_decisions:
- issue: 주체가 명시되지 않은 וַיִּתֵּן의 처리
  chosen_reading: 주어를 특정하지 않고 수동적 결과를 한국어로 전달했습니다.
  alternative_readings:
  - 그가 배정했고
  - 하나님이 배정하셨고
  - 그들이 배정했고
  rationale: 히브리어는 주어를 명시하지 않으며, 영어 POB도 이를 확정하지 않습니다. 따라서 번역은 신학적 주체를 덧붙이지 않고 원문의 개방성을 유지해야 합니다.
  doctrine_reference: translation philosophy item 3
