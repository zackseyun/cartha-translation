id: ISA.53.1
reference: Isaiah 53:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
  footnotes:
  - marker: a
    text: Or 'our report' or 'our message.' The Hebrew can refer to what has been heard, reported, or proclaimed.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 우리의 소식을 믿었으며, 야훼의 팔이 누구에게 나타났습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리의 소식’은 ‘우리의 보고’ 또는 ‘우리가 들은 것’으로도 옮길 수 있습니다. 히브리어는 들려온 것, 보고된 것, 선포된 것을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 어느 사람이
  lexicon: HALOT
  rationale: 히브리어 의문대명사 מִי의 직접적인 대응으로, 수사적 질문의 힘을 살려 자연스럽게 옮겼습니다.
- source_word: לִשְׁמֻעָתֵנוּ
  english_pob_choice: our report / what we have heard
  chosen_korean: 우리의 소식
  alternatives_korean:
  - 우리의 보고
  - 우리가 들은 것
  - 우리의 메시지
  lexicon: HALOT
  rationale: שְׁמוּעָה는 '들려온 것, 소식, 보고'의 범위를 가지므로, 한국어에서는 '소식'이 듣는 행위와 전달된 내용을 함께 살리면서도 너무 기술적인 '보고'보다 덜 협소합니다.
- source_word: וּזְרוֹעַ
  english_pob_choice: the arm
  chosen_korean: 야훼의 팔
  alternatives_korean:
  - 야훼의 능력
  - 주님의 팔
  lexicon: HALOT
  rationale: זְרוֹעַ의 비유적 의미를 풀어 쓰지 않고 '팔'을 유지하여, 구원과 능력의 성경적 이미지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와(יהוה)를 POB 기본 원칙에 따라 고유명사 '야훼'로 옮겨, 호칭으로 바꾸지 않고 신적 이름 자체를 드러냈습니다.
- source_word: נִגְלָתָה
  english_pob_choice: has been revealed
  chosen_korean: 나타났습니까
  alternatives_korean:
  - 드러났습니까
  - 계시되었습니까
  lexicon: HALOT
  rationale: נִגְלָה 계열은 '드러나다, 나타나다, 나타나 보이다'의 의미가 있어, 수동적 'revealed'의 동사를 한국어에서 자연스럽게 수용하는 '나타났습니까'로 표현했습니다.
theological_decisions:
- issue: 야훼의 팔이라는 비유를 직역할지 해석할지
  chosen_reading: 비유를 보존하여 '야훼의 팔'로 직역했습니다.
  alternative_readings:
  - 야훼의 능력
  - 야훼의 힘
  rationale: 이 표현은 하나님의 구원 행위를 가리키는 강한 성경적 이미지이므로, 의미를 풀어 쓰기보다 원문 이미지를 유지하는 편이 본문 간 연관성과 신학적 밀도를 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
