  source_fidelity: ‘우리의 소식’은 לִשְׁמֻעָתֵנוּ의 ‘우리의 소식/전해 들은 것’이라는 폭넓은 의미를 적절히 보존하고, ‘야훼의 팔’도 זְרוֹעַ의 비유를 유지합니다. 그러나 נִגְלָתָה는 단순히 ‘나타나다’보다 ‘드러나다/계시되다’라는 수동적 공개의 뜻이 더 분명하므로 ‘드러났습니까?’가 더 충실합니다.
