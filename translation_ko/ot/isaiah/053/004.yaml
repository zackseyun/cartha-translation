id: ISA.53.4
reference: Isaiah 53:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
  footnotes:
  - marker: a
    text: 'Or: ''our griefs'' and ''our sorrows.'' The Hebrew more literally refers to sicknesses and pains.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''smitten by God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그는 우리의 질병들을 짊어지셨고 우리의 아픔들을 지고 가셨습니다[a]. 그러나 우리는 그가 고통받으며, 하나님에게 맞고[b], 괴로움을 당한 이로 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 슬픔들’과 ‘우리의 비탄들’로 옮길 수 있습니다. 히브리어는 보다 문자적으로 ‘질병들’과 ‘아픔들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 번역: ‘하나님께 맞은.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 분명히
  - 실로
  lexicon: HALOT
  rationale: 강한 확인과 반전을 드러내는 감탄부사로, 문맥의 대조를 살리면서 현대 한국어에서 자연스럽습니다.
- source_word: חֳלָיֵנוּ / וּמַכְאֹבֵינוּ
  english_pob_choice: our sicknesses / our pains
  chosen_korean: 우리의 질병들 / 우리의 아픔들
  alternatives_korean:
  - 우리의 병들 / 우리의 고통들
  - 우리의 질병들 / 우리의 슬픔들
  lexicon: HALOT
  rationale: 히브리어의 보다 구체적인 신체적 의미를 따라 ‘질병들’과 ‘아픔들’로 옮겨, 전통적이지만 덜 정확한 정서어 표현을 피했습니다.
- source_word: נָשָׂא / סְבָלָם
  english_pob_choice: has borne / carried
  chosen_korean: 짊어지셨고 / 지고 가셨습니다
  alternatives_korean:
  - 짊어지셨고 / 감당하셨습니다
  - 메고 가셨고 / 지셨습니다
  lexicon: HALOT
  rationale: 두 동사의 짐-짐어짐 이미지를 살리되, 한국어에서 구별되는 동작감을 주기 위해 ‘짊어지다’와 ‘지고 가다’를 분리했습니다.
- source_word: מֻכֵּה אֱלֹהִים
  english_pob_choice: struck by God
  chosen_korean: 하나님에게 맞고
  alternatives_korean:
  - 하나님께 맞고
  - 하나님에게서 맞고
  lexicon: HALOT
  rationale: 원문이 하나님의 직접적 타격을 말하므로 그 행위자를 약화하지 않으면서, ‘맞다’로 고난의 수동성을 드러냈습니다.
theological_decisions:
- issue: ‘מֻכֵּה אֱלֹהִים’의 신적 행위자와 문체
  chosen_reading: 하나님이 치신 것으로 명시하되, 한국어 본문은 ‘하나님에게 맞고’로 간결하게 유지했습니다.
  alternative_readings:
  - 하나님께 맞고
  - 하나님께서 치신 것으로
  rationale: 본문의 핵심은 단순한 고난 묘사가 아니라, 사람들이 그를 하나님의 징벌을 받은 자로 오해했다는 점입니다. 신적 행위자를 드러내되, 과도한 해설을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
