review_pass:
  verdict: revise
  source_fidelity: ‘고통받으며’는 נָגוּעַ(타격·재앙을 당한, struck/stricken)의 의미를 일반적인 고통으로 약화합니다. 또한 ‘하나님에게 맞고’는 조사 선택이 부자연스럽고 문체가 다소 구어적입니다. 원문의 세 참여적 술어와 하나님을 행위자로 명시하는 구문을 보존하도록 고쳤습니다.
  naturalness: ‘질병들을 짊어지셨고 우리의 아픔들을 감당하셨습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 두 히브리어 동사의 부담-짐 의미도 무리 없이 드러냅니다. 후반절은 반복을 최소화하면서도 열거 구조를 유지했습니다.
  terminology: חֳלָיֵנוּ와 מַכְאֹבֵינוּ는 각각 ‘질병들’과 ‘아픔들’로 유지했습니다. נָגוּעַ는 ‘재앙을 당한’으로, מֻכֵּה אֱלֹהִים는 ‘하나님께서 치신’으로 옮겨 타격과 신적 행위자를 보존했습니다. מְעֻנֶּה는 ‘괴로움을 겪는’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그가 고통받으며’는 נָגוּעַ의 타격·재앙 의미를 일반화합니다.
    rationale: 원문은 단순히 고통받는 상태가 아니라 ‘맞은/재앙을 당한’ 상태를 말하며, 뒤의 ‘하나님께서 치신’과 구별되는 열거를 이룹니다.
  - severity: medium
    issue: ‘하나님에게 맞고’의 조사와 표현이 현대 정중 문체에 덜 자연스럽습니다.
    rationale: 행위자 표지에는 ‘하나님께’가 자연스럽고, 본문에서는 ‘하나님께서 치신’이 히브리어의 신적 행위자를 더 명료하고 격식 있게 나타냅니다.
  revised_text: 참으로 그는 우리의 질병들을 짊어지셨고 우리의 아픔들을 감당하셨습니다[a]. 그러나 우리는 그를 재앙을 당한 이, 하나님께서 치신 이, 괴로움을 겪는 이로 여겼습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리의 슬픔들’과 ‘우리의 비탄들’로 옮길 수 있습니다. 히브리어는 보다 문자적으로 ‘질병들’과 ‘아픔들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 번역: ‘하나님께 맞은.’'
    reason: lexical_alternative
  revision_rationale: 본문의 [b] 표지는 본문 표현을 ‘하나님께서 치신’으로 고치면서도 계속 적절하게 유지됩니다. ‘재앙을 당한 이’는 נָגוּעַ의 타격 또는 재앙의 의미를 보존하되 그 재앙의 성격을 과도하게 특정하지 않습니다. ‘하나님께서 치신 이’는 מֻכֵּה אֱלֹהִים의 직접적인 신적 행위자를 명시하며, ‘괴로움을 겪는 이’는 마지막 참여사의 고난 의미를 자연스럽게 전달합니다.
