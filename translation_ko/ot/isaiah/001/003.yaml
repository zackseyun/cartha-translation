id: ISA.1.3
reference: Isaiah 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדַ֥ע שׁוֹר֙ קֹנֵ֔/הוּ וַ/חֲמ֖וֹר אֵב֣וּס בְּעָלָ֑י/ו יִשְׂרָאֵל֙ לֹ֣א יָדַ֔ע עַמִּ֖/י לֹ֥א הִתְבּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
  footnotes:
  - marker: a
    text: Or "manger" for "feeding trough."
    reason: lexical_alternative
  - marker: b
    text: The implied sense is that Israel does not know the LORD, though the Hebrew leaves the object unstated.
    reason: alternative_reading
translation:
  language: ko
  text: 소는 그 주인을 알고, 나귀는 그 주인의 먹이통을 압니다. 이스라엘은 알지 못하고, 내 백성은 분별하지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적어를 밝히지 않지만, 문맥상 이스라엘이 야훼를 알지 못한다는 뜻이 강하게 암시됩니다.
    reason: alternative_reading
  - marker: b
    text: '''먹이통''은 전통적인 ''구유''에 해당하는 뜻으로, 여기서는 가축의 먹이 그릇을 직접 드러낸 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  english_pob_choice: knows / does not know
  chosen_korean: 압니다 / 알지 못합니다
  alternatives_korean:
  - 압니다 / 모릅니다
  - 알아봅니다 / 알아보지 못합니다
  lexicon: HALOT
  rationale: 반복되는 יָדַע의 대조를 살리기 위해 같은 어근의 인지 의미를 유지했습니다. '알다'는 단순 지식보다 관계적 인지까지 담아, 짐승조차 주인을 아는 대비를 선명하게 드러냅니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 우
  lexicon: HALOT
  rationale: '''소''가 현대 한국어에서 가장 자연스러운 단수 대응이며, 문맥상 일하는 짐승의 이미지를 잘 전달합니다.'
- source_word: קֹנֵהוּ
  english_pob_choice: its owner
  chosen_korean: 그 주인
  alternatives_korean:
  - 그 소유자
  - 그를 산 자
  lexicon: HALOT
  rationale: קנה의 소유·획득 의미를 반영하되, 가축과의 관계를 가장 자연스럽게 드러내는 한국어는 '주인'입니다.
- source_word: אֵבוּס
  english_pob_choice: feeding trough
  chosen_korean: 먹이통
  alternatives_korean:
  - 구유
  - 먹이 여물통
  lexicon: HALOT
  rationale: '''구유''는 전통적이지만 예수 탄생 장면을 쉽게 연상시킬 수 있어, כאן의 가축 사육 도구라는 뜻을 직접 드러내는 ''먹이통''을 택했습니다.'
- source_word: הִתְבּוֹנָן
  english_pob_choice: do not understand
  chosen_korean: 분별하지 못합니다
  alternatives_korean:
  - 이해하지 못합니다
  - 헤아리지 못합니다
  lexicon: HALOT
  rationale: 히트폴엘 형태는 단순 인지보다 숙고와 분별의 실패를 가리키므로, '분별하다'로 도덕적·영적 무감각을 살렸습니다.
theological_decisions:
- issue: 이스라엘이 알지 못하는 대상의 생략
  chosen_reading: 본문의 생략을 그대로 두어 '이스라엘은 알지 못하고'로 옮겼습니다.
  alternative_readings:
  - '''이스라엘은 나를 알지 못하고''로 대상 보충'
  - '''이스라엘은 야훼를 알지 못하고''로 명시'
  rationale: 히브리어는 목적어를 생략하지만 문맥상 하나님을 암시합니다. 본문이 지닌 수사적 날카로움과 긴장을 보존하기 위해 한국어 본문에서도 대상을 덧붙이지 않았습니다.
  doctrine_reference: 본문의 함축을 보존하는 번역 원칙
