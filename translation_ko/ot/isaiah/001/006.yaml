id: ISA.1.6
reference: Isaiah 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
  footnotes:
  - marker: a
    text: Or 'there is no soundness in him.' The Hebrew personifies the nation as a wounded body.
    reason: alternative_reading
  - marker: b
    text: Or 'fresh wounds.' The phrase can denote recent, raw injuries.
    reason: lexical_alternative
  - marker: c
    text: The verb may refer to pressing or squeezing wounds to expel matter before treatment.
    reason: cultural_note
  - marker: d
    text: Or 'bound up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발바닥에서 머리까지[a], 그 몸에는 성한 곳이 없습니다. 오직 상처와 멍자국과 새로 생긴 상처[b]뿐입니다. 그것들은 짜내지도[c], 싸매지도[d], 기름으로 부드럽게 하지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에는 성한 곳이 없습니다.’ 히브리어는 민족을 상처 입은 몸으로 의인화합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘새 상처들’. 이 표현은 최근에 생긴, 아직 아물지 않은 상처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 치료 전에 상처의 분비물을 짜내거나 눌러 빼는 행위를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘붕대로 감싸지도’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל
  english_pob_choice: From the sole of the foot
  chosen_korean: 발바닥에서부터
  alternatives_korean:
  - 발의 바닥에서부터
  - 발바닥으로부터
  lexicon: HALOT
  rationale: כַּף רֶגֶל의 이미지가 발의 아랫면을 가리키므로 ‘발바닥’이 자연스럽고, 출발점을 분명히 하는 ‘에서부터’가 원문의 머리부터 발끝까지의 총체적 범위를 살립니다.
- source_word: וְעַד רֹאשׁ
  english_pob_choice: even to the head
  chosen_korean: 머리까지
  alternatives_korean:
  - 머리까지도
  - 심지어 머리까지
  lexicon: HALOT
  rationale: 머리까지로 범위를 닫아 주면 히브리어의 양끝 병렬(완전성 강조)이 한국어에서도 분명하게 전달됩니다.
- source_word: אֵין בּוֹ מְתֹם
  english_pob_choice: there is no soundness in it
  chosen_korean: 온몸에 아무런 온전함이 없습니다
  alternatives_korean:
  - 그 안에 아무런 건강함이 없습니다
  - 그 안에 아무런 온전함이 없습니다
  lexicon: HALOT
  rationale: מְתֹם은 단순한 ‘건강’보다 상해 없는 ‘온전한 상태’를 가리키므로, 병든 몸의 은유를 살리면서도 현대 한국어에서 자연스러운 ‘온전함’으로 옮겼습니다.
- source_word: פֶּצַע / חַבּוּרָה / מַכָּה טְרִיָּה
  english_pob_choice: wounds and bruises and fresh blows
  chosen_korean: 상처와 멍자국과 새로 난 상처
  alternatives_korean:
  - 상처와 타박상과 새 상처
  - 상처와 멍과 تاز한 상처
  lexicon: HALOT
  rationale: 세 항목의 상해 목록을 한국어로 평행하게 유지했습니다. חַבּוּרָה는 ‘멍자국’, מַכָּה טְרִיָּה는 ‘새로 난 상처’로 옮겨 최근에 생긴 생생한 상해의 뉘앙스를 살렸습니다.
- source_word: לֹא זֹרוּ וְלֹא חֻבָּשׁוּ וְלֹא רֻכְּכָה בַּשָּׁמֶן
  english_pob_choice: they have not been pressed out, or bandaged, or softened with oil
  chosen_korean: 그것들은 짜서 없애지도, 붕대로 감싸지도, 기름으로 부드럽게 하지도 않았습니다
  alternatives_korean:
  - 그것들은 눌러 짜내지도, 붕대로 감싸지도, 기름으로 누그러뜨리지도 않았습니다
  - 그것들은 짜내어 치료하지도, 붕대로 싸매지도, 기름으로 부드럽게 하지도 않았습니다
  lexicon: HALOT
  rationale: זֹרוּ는 상처의 분비물을 짜내는 치료 행위를 가리키므로 ‘짜서 없애다’로 구체화했고, חֻבָּשׁוּ와 רֻכְּכָה는 각각 ‘붕대로 감싸다’, ‘기름으로 부드럽게 하다’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 이스라엘의 신체 은유를 인칭화할지 여부
  chosen_reading: ‘온몸’과 ‘그것들’을 사용해 공동체 전체가 상처 입은 몸으로 그려진 은유를 유지했습니다.
  alternative_readings:
  - ‘그 안에’로 비인칭화하기
  - ‘그에게’로 개인 남성 인칭을 쓰기
  rationale: 원문은 민족 전체를 하나의 몸으로 의인화합니다. 한국어에서는 ‘온몸’과 복수 지시어 ‘그것들’이 이 공동체적 신체 은유를 가장 자연스럽게 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
