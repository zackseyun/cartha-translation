id: ISA.1.13
reference: Isaiah 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
  footnotes:
  - marker: a
    text: Or, 'I cannot endure iniquity with solemn assembly.' The Hebrew is terse and may imply the incompatibility of evil and worship gathering.
    reason: alternative_reading
  - marker: b
    text: '''Worthless grain offerings'' renders a phrase that could also be translated ''vain offering'' or ''empty offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 헛된 곡식제물을 계속 가져오지 마십시오[a]. 향은 내게 가증합니다. 초하루와 안식일, 집회를 소집하는 일도—나는 악과 엄숙한 집회를 견딜 수 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛된 제물’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악을 동반한 엄숙한 집회’를 뜻할 수 있습니다. 히브리어는 ‘악’과 ‘엄숙한 집회’를 전치사 없이 나란히 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  english_pob_choice: continue bringing
  chosen_korean: 다시는 … 가져오지 마십시오
  alternatives_korean:
  - 계속 가져오지 마십시오
  - 계속 바치지 마십시오
  - 다시 가져오지 마십시오
  lexicon: HALOT
  rationale: יסף + 부정 명령의 반복 금지는 한국어에서 ‘다시는’으로 자연스럽게 드러낼 수 있어, 반복 지속의 뉘앙스와 금지의 강도를 함께 살렸습니다.
- source_word: מִנְחַת שָׁוְא
  english_pob_choice: worthless grain offerings
  chosen_korean: 헛된 곡식제물
  alternatives_korean:
  - 가치 없는 곡식제물
  - 헛된 제물
  - 공허한 곡식제물
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 특수성을 살려 ‘곡식제물’로 옮기고, שָׁוְא의 공허함·무가치함을 ‘헛된’으로 간결하게 반영했습니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 분향
  alternatives_korean:
  - 향
  - 향불
  - 향로의 향
  lexicon: HALOT
  rationale: 문맥상 단순한 향의 물질보다 제의 행위가 문제 되므로, 한국어에서 예배적 행위를 자연스럽게 드러내는 ‘분향’을 택했습니다.
- source_word: קְרֹא מִקְרָא
  english_pob_choice: the calling of an assembly
  chosen_korean: 모임을 선포하는 일
  alternatives_korean:
  - 엄숙한 집회를 선포하는 일
  - 소집하는 일
  - 집회를 부르는 일
  lexicon: HALOT
  rationale: 동사-명사 결합의 반복을 ‘선포하는 일’로 옮겨, 단순히 ‘모임’이 아니라 공식적 소집 행위라는 점을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 악과 엄숙한 집회의 병치
  chosen_reading: 악과 엄숙한 집회를 견딜 수 없습니다
  alternative_readings:
  - 악을 동반한 엄숙한 집회를 견딜 수 없습니다
  - 악과 함께하는 엄숙한 집회를 견딜 수 없습니다
  rationale: 히브리어는 אָוֶן과 עֲצָרָה를 전치사 없이 나란히 두어 긴장을 남깁니다. 이를 그대로 ‘악과 엄숙한 집회’로 병치해, 죄와 예배의 공존 불가능성을 해소하지 않고 드러냈습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
