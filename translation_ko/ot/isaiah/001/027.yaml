id: ISA.1.27
reference: Isaiah 1:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צִיּ֖וֹן בְּ/מִשְׁפָּ֣ט תִּפָּדֶ֑ה וְ/שָׁבֶ֖י/הָ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
  footnotes:
  - marker: a
    text: Or, 'and those of her who return,' or 'her returnees.' The Hebrew participle from 'return/turn' can denote either repentance or return.
    reason: alternative_reading
translation:
  language: ko
  text: 시온은 정의로[a] 구속될 것이며, 그 돌아온 자들은 의로 구속될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게로 돌아오는 자들’, ‘그 돌아온 자들’. 히브리어 분사는 ‘돌아오다/돌이키다’에서 왔으므로 회개나 귀환 둘 다 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - Zion
  lexicon: 고유명사 표기
  rationale: 지명 고유명사는 한국어 성경 관례에 따라 음역하여 시온으로 옮겼습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: by justice
  chosen_korean: 정의로
  alternatives_korean:
  - 공의로
  - 심판으로
  - 정의로써
  lexicon: HALOT
  rationale: בְּ는 수단/방식을 나타내며, כאן의 משפט는 단순한 재판 절차보다 회복을 이루는 공적 정의의 힘을 가리키므로 ‘정의로’가 가장 자연스럽습니다.
- source_word: תִּפָּדֶה
  english_pob_choice: will be redeemed
  chosen_korean: 구속될 것입니다
  alternatives_korean:
  - 속량될 것입니다
  - 되찾아질 것입니다
  - 구원받을 것입니다
  lexicon: HALOT
  rationale: פדה의 수동형은 ‘대가를 치르고 되찾다/속량하다’의 의미를 살리므로, 예언 문맥의 구원·회복 성격을 드러내는 ‘구속될 것입니다’를 택했습니다.
- source_word: וְשָׁבֶיהָ
  english_pob_choice: and her returnees
  chosen_korean: 그 돌아온 자들
  alternatives_korean:
  - 그 회개한 자들
  - 그 돌아오는 자들
  - 그 돌아온 이들
  lexicon: HALOT
  rationale: שוב의 분사는 문자적으로 ‘돌아온 자들’이며, POB가 유지한 해석상의 긴장도 한국어에서 그대로 보이도록 ‘회개한 자들’로 좁히지 않고 ‘돌아온 자들’로 옮겼습니다.
- source_word: בִּצְדָקָה
  english_pob_choice: by righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의로써
  - 의 안에서
  - 의 가운데
  lexicon: HALOT
  rationale: צְדָקָה는 משפט와 평행을 이루는 윤리적·법정적 ‘의’이므로, 앞의 ‘정의로’와 대응되게 ‘의로’로 번역했습니다.
theological_decisions:
- issue: וְשָׁבֶיהָ의 의미 범위
  chosen_reading: 문자적 의미를 우선해 ‘그 돌아온 자들’로 두되, 회개의 함의를 강요하지는 않았습니다.
  alternative_readings:
  - 그 회개한 자들
  - 그에게로 돌아오는 자들
  rationale: 이사야 1장의 문맥상 회복과 회개의 의미가 배경에 있지만, 히브리어 עצמו는 ‘돌아오다’의 범위를 넘지 않으므로 본문에서 그 긴장을 유지했습니다.
  doctrine_reference: '번역 원칙: 해석을 과잉 고정하지 말고 본문이 허용하는 범위를 보존함'
