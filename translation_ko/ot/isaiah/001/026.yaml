id: ISA.1.26
reference: Isaiah 1:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
  footnotes:
  - marker: a
    text: Or "the city of justice."
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 재판관들을 처음과 같이, 네 조언자들을 시작할 때와 같이 회복하겠습니다. 그 후에 너는 의의 성읍, 신실한 성읍이라 불릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의의 성읍”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  english_pob_choice: And I will restore
  chosen_korean: 회복하겠습니다
  alternatives_korean:
  - 돌려보내겠습니다
  - 다시 세우겠습니다
  lexicon: HALOT
  rationale: שוב의 히필형은 ‘돌아오게 하다/회복하다’의 사역적 의미를 가지므로, 공동체의 질서와 직분을 다시 세우는 맥락에 맞게 ‘회복하겠습니다’로 옮겼습니다.
- source_word: שֹׁפְטַיִךְ
  english_pob_choice: your judges
  chosen_korean: 네 재판관들
  alternatives_korean:
  - 네 심판관들
  - 네 통치자들
  lexicon: HALOT
  rationale: 기본 어휘는 ‘judge’이지만, 한국어에서 ‘재판관’이 제도적 판단과 공적 직무를 함께 드러내어 문맥상 더 자연스럽습니다.
- source_word: וְיֹעֲצַיִךְ
  english_pob_choice: your counselors
  chosen_korean: 네 조언자들
  alternatives_korean:
  - 네 상담자들
  - 네 자문관들
  lexicon: HALOT
  rationale: יעץ의 명사적 용법을 살려 공식적 자문 역할을 나타내는 ‘조언자들’로 번역했습니다.
- source_word: עִיר הַצֶּדֶק / קִרְיָה נֶאֱמָנָה
  english_pob_choice: the city of righteousness, a faithful city
  chosen_korean: 의의 성읍, 신실한 성읍
  alternatives_korean:
  - 의로운 성읍, 신실한 성읍
  - 정의의 성읍, 믿을 만한 성읍
  lexicon: HALOT
  rationale: צדק은 이 회복 맥락에서 단순한 사법적 ‘정의’보다 넓은 언약적·도덕적 바름을 포함하므로 ‘의’로, נֶאֱמָנָה는 신뢰성과 충실성을 살려 ‘신실한’으로 옮겼습니다.
theological_decisions:
- issue: צדק의 번역을 ‘의’로 할지 ‘정의’로 할지
  chosen_reading: 의
  alternative_readings:
  - 정의
  rationale: 이 절은 도시의 공적 질서 회복을 말하지만, 단지 행정적 공정성보다 하나님의 뜻에 맞는 공동체적 바름을 강조하므로 ‘의’가 더 넓고 적절합니다.
  doctrine_reference: DOCTRINE.md의 righteousness/justice 구분 원칙을 히브리어 צדק에 적용
