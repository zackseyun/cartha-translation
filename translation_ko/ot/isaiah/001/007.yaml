  source_fidelity: 개정이 필요합니다. 히브리어의 복수 2인칭 소유 접미사와 반복되는 זָרִים를 일관되게 반영해야 하며, אַדְמָתְכֶם의 생산적인 땅이라는 뉘앙스도 유지하는 편이 좋습니다. 난해한 כְּמַהְפֵּכַת זָרִים는 본문에서 한 해석을 강요하지 않고 각주로 대안을 보존했습니다.
  naturalness: 초안의 ‘당신의/당신들의’ 혼용은 예언적 대중 خطاب에서 부자연스럽고, ‘낯선 사람들’은 단순히 모르는 사람이라는 뜻으로 들릴 수 있습니다. ‘너희’, ‘타국 사람들’, ‘황폐합니다’를 사용하면 현대 표준어 합쇼체로 더 자연스럽고 분명합니다.
  terminology: ‘황무지’는 본문의 재난으로 인한 황폐 상태보다 본래 불모지를 가리킬 수 있어 ‘황폐합니다’로 고쳤습니다. ‘전복’은 현대 한국어에서 정치적 의미가 강하므로 ‘뒤엎음’으로 옮겼습니다. זָרִים는 두 차례 모두 ‘타국 사람들’로 일관되게 처리했습니다.
  issues:
