revisions:
- from: 당신의 땅은 황무지입니다[a]; 당신들의 성읍들은 불에 타 버렸습니다. 당신들의 밭은—바로 당신들 눈앞에서—낯선 사람들이 그것을 삼키고 있으며, 그것은 황폐함이 되어 있습니다[b], 낯선 사람들의 전복과 같습니다.
  to: 너희 땅은 황폐합니다[a]. 너희 도시들은 불에 타 버렸습니다. 너희 경작지는 너희 눈앞에서 타국 사람들이 먹어 치우고 있으며, 그 땅은 타국 사람들이 뒤엎은 것처럼 황폐합니다[b].
  rationale: 복수 청자를 가리키는 ‘너희’로 소유 표현을 통일하고, זָרִים를 문맥상 외부의 침입자를 나타내는 ‘타국 사람들’로 일관되게 옮겼습니다. אֶרֶץ와 אֲדָמָה의 차이는 ‘땅’과 ‘경작지’로 구별했습니다. 마지막 난구는 정치적 함의가 강한 ‘전복’을 피하면서도, 본문과 각주를 통해 원문의 통사적 중의성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:51Z'
