    rationale: כְּמַהְפֵּכַת זָרִים는 통사적으로 난해합니다. 본문은 ‘타국 사람들이 뒤엎은 것처럼’으로 영어 POB의 선택을 따르되, 다른 가능한 이해는 각주에 보존하는 것이 안전합니다.
