base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
  footnotes:
  - marker: a
    text: Or 'foreigners are consuming it'; the repeated Hebrew term can be rendered 'strangers' or 'foreigners.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like an overthrow by strangers'; the phrase may also be understood as 'like the overthrow of foreigners' or, by some, as an allusion to the overthrow of Sodom.
    reason: alternative_reading
translation:
  language: ko
  text: 너희 땅은 황폐합니다[a]. 너희 도시들은 불에 타 버렸습니다. 너희 경작지는 너희 눈앞에서 타국 사람들이 먹어 치우고 있으며, 그 땅은 타국 사람들이 뒤엎은 것처럼 황폐합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐한 곳입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘타국 사람들의 뒤엎음처럼’입니다. 이 표현은 ‘타국 사람들이 뒤엎은 것처럼’, ‘타국 사람들이 당한 뒤엎음처럼’으로도 이해될 수 있으며, 일부는 소돔의 전복을 암시하는 것으로 봅니다.
    reason: alternative_reading
