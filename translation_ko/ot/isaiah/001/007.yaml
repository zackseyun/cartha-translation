  lexicon: HALOT
  rationale: 명사형 파괴 상태를 나타내므로, 형용사보다 상태를 드러내는 명사 ‘황무지’로 옮겼습니다.
- source_word: אַדְמַתְכֶם
  english_pob_choice: your soil
  chosen_korean: 당신들의 밭
  alternatives_korean:
  - 당신들의 땅
  - 당신들의 토양
  - 당신들의 흙
  lexicon: HALOT
  rationale: 앞의 אֶרֶץ보다 더 생산적인 지면을 가리키는 אַדְמָה의 뉘앙스를 살려, 실제 경작 대상인 ‘밭’으로 구체화했습니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 낯선 사람들
  alternatives_korean:
  - 외국인들
  - 이방인들
  - 타인들
  lexicon: HALOT
  rationale: 반복되는 זָרִים를 같은 어감으로 유지하되, 현대 한국어에서 지나치게 제도적이거나 종교적이지 않은 ‘낯선 사람들’로 옮겼습니다.
theological_decisions:
- issue: כְּמַהְפֵּכַת זָרִים의 중의성
  chosen_reading: 낯선 사람들의 전복과 같습니다
  alternative_readings:
  - 외국인들의 전복과 같습니다
  - 낯선 사람들에 의한 전복과 같습니다
  - 소돔의 전복과 같습니다
  rationale: 히브리어 구절은 압축되어 있어 ‘누구의 전복인지’가 명확하지 않으므로, 본문 구조를 따라 ‘낯선 사람들의 전복’으로 보존하되 소돔 암시는 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
