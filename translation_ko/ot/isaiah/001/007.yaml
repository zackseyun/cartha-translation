  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
  footnotes:
  - marker: a
    text: Or 'foreigners are consuming it'; the repeated Hebrew term can be rendered 'strangers' or 'foreigners.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like an overthrow by strangers'; the phrase may also be understood as 'like the overthrow of foreigners' or, by some, as an allusion to the overthrow of Sodom.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 땅은 황무지입니다[a]; 당신들의 성읍들은 불에 타 버렸습니다. 당신들의 밭은—바로 당신들 눈앞에서—낯선 사람들이 그것을 삼키고 있으며, 그것은 황폐함이 되어 있습니다[b], 낯선 사람들의 전복과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들이 그것을 삼키고 있다.’ 반복되는 히브리어는 ‘낯선 사람들’ 또는 ‘외국인들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘낯선 사람들의 전복처럼’이라는 뜻일 수 있으며, ‘외국인들의 전복처럼’ 또는 일부 해석처럼 소돔의 전복을 가리키는 암시로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
