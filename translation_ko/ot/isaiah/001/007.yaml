    issue: 2인칭 소유 표현이 ‘당신의’와 ‘당신들의’로 혼용됨
    rationale: 히브리어의 접미사는 모두 복수 2인칭입니다. 또한 한국어에서 대중을 향한 예언적 خطاب에 ‘당신’은 부자연스럽거나 대립적으로 들릴 수 있으므로 ‘너희’가 적절합니다.
  - severity: medium
    issue: ‘낯선 사람들’이 זָרִים의 외부인/타국인 의미를 충분히 전달하지 못함
    rationale: 현대 한국어의 ‘낯선 사람’은 개인적으로 모르는 사람을 뜻하기 쉽습니다. 문맥상 침입한 외부 집단을 나타내는 ‘타국 사람들’이 더 정확합니다.
