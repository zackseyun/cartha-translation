source:
  edition: WLC
  text: וְ/אִם תְּמָאֲנ֖וּ וּ/מְרִיתֶ֑ם חֶ֣רֶב תְּאֻכְּל֔וּ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
  footnotes:
  - marker: a
    text: 'Hebrew: ''you will be eaten by the sword.'' The wording forms a deliberate contrast with the previous verse, where the obedient ''eat the good of the land.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희가 거절하고 반항하면, 칼에 삼켜질 것입니다. 이는 야훼의 입이 말씀하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘칼에 먹히게 될 것입니다’입니다. 이는 바로 앞절의 ‘땅의 좋은 것을 먹을 것’과 의도적인 대조를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …하면
  alternatives_korean:
  - 그리고 만약 …하면
  - 만일 …하면
  lexicon: HALOT
  rationale: 이 절이 앞절의 약속과 대조를 이루므로, 단순 조건보다 반대 전환을 드러내는 ‘그러나’가 원문의 대비를 잘 살립니다.
- source_word: תְּמָאֲנוּ
  english_pob_choice: you refuse
  chosen_korean: 거절하고
  alternatives_korean:
  - 거부하고
  - 마지않고
  lexicon: HALOT
  rationale: מאן은 단순 무관심이 아니라 분명한 거절을 뜻하므로, 현대 한국어에서 직설적이고 강한 ‘거절하다’가 적절합니다.
- source_word: וּמְרִיתֶם
  english_pob_choice: and rebel
  chosen_korean: 반항하면
  alternatives_korean:
  - 반역하면
  - 거역하면
  lexicon: HALOT
  rationale: מרה는 권위에 대한 반항·거역의 뉘앙스가 있어, 예언적 경고의 톤을 살리는 ‘반항하다’를 택했습니다.
- source_word: חֶרֶב תְּאֻכְּל֔וּ
  english_pob_choice: you will be devoured by the sword
  chosen_korean: 칼에 삼켜질 것입니다
  alternatives_korean:
  - 칼에 먹힐 것입니다
  - 칼에 의해 멸망할 것입니다
  lexicon: HALOT
  rationale: 직역상 ‘칼에 먹히다’이지만 한국어에서는 부자연스러워, 심판의 피동성과 역전 의미를 살리는 ‘삼켜지다’로 옮겼습니다. POB 주석의 ‘먹히다’라는 문자적 대비도 반영했습니다.
- source_word: פִּי יְהוָה דִּבֵּר
  english_pob_choice: the mouth of Yahweh has spoken
  chosen_korean: 야훼의 입이 말씀하셨기 때문입니다
  alternatives_korean:
  - 야훼의 입이 말하셨기 때문입니다
  - 야훼께서 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: ‘입’이라는 신인동형적 표현을 보존하되, 한국어에서 자연스러운 종결을 위해 ‘말씀하시다’를 사용했습니다. 하나님의 이름은 본문 원어의 יְהוָה에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 히브리어 직유적 표현 ‘칼에 먹히다’의 한국어 처리
  chosen_reading: ‘칼에 삼켜질 것입니다’로 옮겨, 심판에 의해 완전히 파괴되는 이미지를 유지했습니다.
  alternative_readings:
  - ‘칼에 먹힐 것입니다’
  - ‘칼로 죽임을 당할 것입니다’
  rationale: 원문은 단순한 죽음을 넘어 ‘먹히다’의 역전 이미지를 통해 19절의 ‘땅의 좋은 소산을 먹다’와 대조합니다. 한국어에서는 ‘삼켜지다’가 이 문학적·신학적 역전을 가장 자연스럽게 전달합니다.
  doctrine_reference: 이사야 1:19-20의 대구와 심판-순종 대비
- issue: יהוה의 표기
  chosen_reading: 본문에서는 야훼를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 원칙에 따라 신명사 יְהוָה를 직접 반영하여 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
