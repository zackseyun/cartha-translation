  source_fidelity: 히브리어의 병렬 구조, ‘내 영혼’이라는 강조된 주어, ‘짐’과 ‘짐을 지다’의 은유를 대체로 충실히 반영합니다. 다만 2인칭 복수 소유격에 ‘여러분’을 쓰면 예언자적 신탁의 직접성과 고대 공동체를 향한 책망의 어조가 다소 현대 청중 خطاب처럼 바뀝니다. ‘그것들을 지는’은 의미상 가능하지만 ‘짐’을 받는 동사로는 ‘짊어지는’이 더 자연스럽습니다.
  naturalness: 합쇼체 문장 종결은 일관됩니다. ‘너희의’는 현대 한국어에서 친근한 대화체라기보다 성서적 직접 호칭으로 굳어져 있어 이 신탁 문맥에 적절하며, ‘짊어지는 데 지쳤습니다’가 자연스럽고 은유도 선명합니다.
  terminology: ‘초하루’는 חָדְשֵׁיכֶם의 달력·제의적 의미를 간결하게 보존하고, ‘정해진 절기들’은 מוֹעֲדֵיכֶם의 문맥상 의미에 적합합니다. 각주에서 본문과 동일한 ‘절기들’을 대안으로 다시 제시하는 것은 실질적 대안이 아니므로 ‘축제들’로 바로잡습니다.
