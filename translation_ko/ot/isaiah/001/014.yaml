id: ISA.1.14
reference: Isaiah 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
  footnotes:
  - marker: a
    text: Or 'your appointed times' or 'your festivals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 초하루와 여러분의 정해진 절기들을 내 영혼이 미워합니다[a]. 그것들은 내게 짐이 되었고, 내가 그것들을 지는 데 지쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 정해진 때들’ 혹은 ‘여러분의 절기들’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  english_pob_choice: your new moons
  chosen_korean: 여러분의 초하루
  alternatives_korean:
  - 여러분의 새달
  - 여러분의 신월 절기
  lexicon: HALOT
  rationale: חֹדֶשׁ은 문자적으로 ‘새달/초하루’를 가리키며, 제의적 달력 용법을 포함합니다. 한국어에서는 ‘초하루’가 달의 시작과 그 예배 관습을 함께 드러내어 본문의 제의적 뉘앙스를 자연스럽게 살립니다.
- source_word: וּמוֹעֲדֵיכֶם
  english_pob_choice: and your appointed feasts
  chosen_korean: 여러분의 정해진 절기들
  alternatives_korean:
  - 여러분의 appointed times
  - 여러분의 절기들
  - 여러분의 정한 모임들
  lexicon: HALOT
  rationale: מוֹעֵד은 ‘정해진 때/모임’이 기본 뜻이지만, 여기서는 예배 달력의 정기적 절기를 가리킵니다. ‘정해진 절기들’은 시간의 지정성과 종교적 관례를 함께 보존합니다.
- source_word: שָׂנְאָה נַפְשִׁי
  english_pob_choice: my soul hates
  chosen_korean: 내 영혼이 미워합니다
  alternatives_korean:
  - 내가 미워합니다
  - 내 존재가 미워합니다
  lexicon: HALOT
  rationale: 히브리어는 נֶפֶשׁ을 주어로 두어 직역하면 ‘내 영혼이 미워한다’입니다. 이를 유지해, 단순한 ‘내가 싫어합니다’보다 더 강한 개인적 혐오의 강도를 살렸습니다.
- source_word: הָיוּ עָלַי לָטֹרַח ... נִלְאֵיתִי נְשֹׂא
  english_pob_choice: they have become a burden to me; I am weary of bearing them
  chosen_korean: 그것들은 내게 짐이 되었고, 내가 그것들을 지는 데 지쳤습니다
  alternatives_korean:
  - 그것들은 내게 부담이 되었고, 내가 그것들을 감당하는 데 지쳤습니다
  - 그것들은 내게 짐이 되었고, 내가 그것들을 تحمل하는 데 지쳤습니다
  lexicon: HALOT
  rationale: הָיוּ ... לָטֹרַח는 결과 상태를 나타내므로 ‘짐이 되었다’가 자연스럽습니다. נִלְאֵיתִי נְשֹׂא는 ‘지고/메고’의 부담스러운 이미지를 유지해, 관습적 예배가 하나님께 무거운 짐이 되었다는 표현을 분명히 합니다.
theological_decisions:
- issue: 야훼의 거부가 절기 제도 자체를 부정하는가, 아니면 왜곡된 예배를 거부하는가
  chosen_reading: 본문은 하나님이 원래 제정하신 절기 자체를 부정한다기보다, ‘여러분의’ 초하루와 절기—곧 타락하고 위선화된 준수—를 거부하시는 것으로 읽었습니다.
  alternative_readings:
  - 절기 제도 전체에 대한 전면적 거부
  - 강한 수사로서의 단순 혐오 표현
  rationale: 소유격 ‘여러분의’와 문맥상 예배의 위선이 핵심이라는 점을 살려, 본문이 하나님의 자기모순을 말하는 것으로 오해되지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
