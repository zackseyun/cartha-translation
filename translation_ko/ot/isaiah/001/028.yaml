  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֶׁ֧בֶר פֹּשְׁעִ֛ים וְ/חַטָּאִ֖ים יַחְדָּ֑ו וְ/עֹזְבֵ֥י יְהוָ֖ה יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
  footnotes:
  - marker: a
    text: Or 'destruction of rebels and sinners together'; the Hebrew noun 'breaking/destruction' can be rendered more nominally.
    reason: lexical_alternative
  - marker: b
    text: Or 'will perish' or 'will be consumed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 반역자들과 죄인들은 함께 부서질 것이며[a][b], 야훼를 버리는 자들은 끝에 이를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반역자들과 죄인들의 파괴’로도 옮길 수 있습니다. 히브리어 명사 שֶׁבֶר는 보다 명사적으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘멸망할 것이며’ 또는 ‘삼켜질 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  english_pob_choice: will be broken
  chosen_korean: 부서질 것이며
  alternatives_korean:
  - 파멸할 것이며
  - 깨질 것이며
  - 멸망할 것이며
  lexicon: HALOT
  rationale: 명사 שֶׁבֶר의 ‘깨짐/파괴’ 이미지를 살리면서, 한국어에서 자연스러운 미래 수동 표현으로 옮겼습니다.
- source_word: פֹּשְׁעִים
  english_pob_choice: rebels
  chosen_korean: 반역자들
  alternatives_korean:
  - 패역한 자들
  - 반항자들
  - 죄를 범하는 자들
  lexicon: HALOT
  rationale: 언약에 대한 의도적 저항을 드러내는 표현으로, 단순한 도덕적 결함보다 강한 ‘반역’의 뉘앙스를 살렸습니다.
- source_word: עֹזְבֵי יְהוָה
  english_pob_choice: those who forsake Yahweh
  chosen_korean: 야훼를 버리는 자들
  alternatives_korean:
  - 주님을 떠나는 자들
  - 여호와를 버리는 자들
  - 야훼를 떠나는 자들
  lexicon: HALOT
  rationale: עזב의 핵심 의미인 ‘버리다/떠나다’ 중, 언약 파기의 강도를 분명히 하는 ‘버리다’를 택했습니다. יְהוָה는 본문 원문에 따라 ‘야훼’로 옮겼습니다.
- source_word: יִכְלוּ
  english_pob_choice: will come to an end
  chosen_korean: 끝에 이를 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 사라질 것입니다
  - 소멸될 것입니다
  lexicon: HALOT
  rationale: כלה의 ‘끝나다/종결되다’ 의미를 반영해, 단순 소멸보다 결과적 종결을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 일반적인 ‘주의 이름’ 대신 원문의 신명사형을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로, 본문의 고유명칭을 보존하는 ‘야훼’를 채택했습니다. 이는 표제어를 대신하는 титул형 표현보다 स्रोत의 직접성을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
