revisions:
- from: 아모스의 아들 이사야의 환상입니다[a]. 그는 유다와 예루살렘에 관해, 유다 왕들인 웃시야, 요담, 아하스, 히스기야 시대에 이것을 보았습니다.
  to: 아모스의 아들 이사야가 본 환상입니다[a]. 이사야는 유다와 예루살렘에 관하여 유다의 왕 웃시야와 요담과 아하스와 히스기야 시대에 이 환상을 보았습니다.
  rationale: 관계절을 ‘이사야가 본 환상’으로 직접 옮겨 원문의 수식 관계를 분명히 했습니다. 시간 표현은 왕들의 통치 시기를 자연스럽게 나타내되, 원문의 ‘시대에’라는 폭넓은 표현을 유지했습니다. 각주는 전치사 עַל의 적대적 대안 가능성을 실제로 전달하도록 조정했으며, 본문에서는 중립적인 ‘관하여’를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:39Z'
