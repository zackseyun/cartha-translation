id: ISA.1.1
reference: Isaiah 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
  footnotes:
  - marker: a
    text: Or 'against Judah and Jerusalem.' The Hebrew preposition can introduce either the subject matter or, in some contexts, an adversative message.
    reason: alternative_reading
translation:
  language: ko
  text: 아모스의 아들 이사야의 환상입니다[a]. 그는 유다와 예루살렘에 관해, 유다 왕들인 웃시야, 요담, 아하스, 히스기야 시대에 이것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다와 예루살렘을 향한.’ 히브리어 전치사는 때로 주제, 때로는 반대 방향의 메시지를 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 이상
  - 계시
  lexicon: HALOT
  rationale: חזון과 직결되는 예언적 ‘보임’의 성격을 살리면서, 이어지는 חָזָה(보았다)와의 연결을 한국어에서도 유지하기 위해 ‘환상’을 택했습니다.
- source_word: עַל
  english_pob_choice: concerning
  chosen_korean: -에 관해
  alternatives_korean:
  - -을/를 향해
  - -에 대하여
  - -을/를 against
  lexicon: HALOT
  rationale: 이 전치사는 예언의 대상/주제를 나타낼 수 있으므로, 심판 방향을 미리 단정하는 ‘against’보다 중립적인 주제 표지로 옮겼습니다.
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: … 시대에
  alternatives_korean:
  - …의 날들에
  - … 동안에
  lexicon: HALOT
  rationale: 히브리어의 관용적 시기표현을 현대 한국어에서 자연스럽게 풀어, 단순한 날짜가 아니라 해당 왕들의 통치 시기를 가리키는 뜻이 드러나게 했습니다.
- source_word: מַלְכֵי יְהוּדָה
  english_pob_choice: kings of Judah
  chosen_korean: 유다 왕들인
  alternatives_korean:
  - 유다의 왕들인
  - 유다의 왕들
  lexicon: HALOT
  rationale: 열거된 인물들이 누구의 왕들인지 명시하는 구조를 살려, 뒤따르는 왕명 목록과 자연스럽게 연결되도록 했습니다.
theological_decisions:
- issue: עַל의 방향성(주제 vs. 적대)
  chosen_reading: 유다와 예루살렘에 관해
  alternative_readings:
  - 유다와 예루살렘을 향한
  - 유다와 예루살렘에 대한 심판의 말씀
  rationale: 본문 자체는 환상의 대상이 유다와 예루살렘임을 말할 뿐, 그 전치사만으로 적대성을 확정하지 않으므로 책 전체가 담고 있는 심판과 회복의 긴장을 열어 두는 번역이 적절합니다.
  doctrine_reference: 예언서의 범위를 특정 정서로 과잉해석하지 않음
