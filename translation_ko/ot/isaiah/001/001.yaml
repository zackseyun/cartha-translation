    rationale: אֲשֶׁר חָזָה는 ‘이사야가 본’이라는 관계절로 חֲזוֹן(환상)을 직접 수식합니다. ‘그는 … 이것을 보았습니다’도 의미상 가능하지만, 직접 연결하면 원문의 구조와 의미가 더 분명해집니다.
  - severity: medium
    issue: 각주의 대안 번역이 적대적 의미를 충분히 반영하지 못함
    rationale: ‘유다와 예루살렘을 향한’은 단순한 방향이나 수혜 대상을 뜻할 수도 있어 עַל의 ‘against’ 가능성을 명확히 나타내지 못합니다. ‘유다와 예루살렘을 거슬러’가 대안의 기능을 더 정확히 수행합니다.
