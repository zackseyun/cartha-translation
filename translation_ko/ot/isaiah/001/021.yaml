id: ISA.1.21
reference: Isaiah 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
  footnotes:
  - marker: a
    text: Or 'harlot.' The Hebrew term refers to a prostitute; the image is metaphorical for the city's unfaithfulness and corruption.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness.' The Hebrew צֶדֶק overlaps semantically with justice, especially in parallel with 'justice' earlier in the verse.
    reason: lexical_alternative
  - marker: c
    text: Literally 'righteousness lodged in her'; the verb evokes spending the night or residing there.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 신실한 성읍이 창녀가 되었습니까! 그는 정의[a]로 가득했으며, 그 안에는 의[b][c]가 머물렀습니다. 그런데 이제는 살인자들뿐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매춘부’. 히브리어는 창녀를 가리키며, 이 이미지는 성읍의 불신실함과 부패를 비유합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공의’. כאן의 משפט와 병렬되는 צֶדֶק은 문맥상 사회적 정의와 의로움의 두 의미권을 함께 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 안에 의가 머물렀습니다’입니다. 동사는 밤을 지내다/거주하다의 이미지를 불러옵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 아, 어찌
  lexicon: HALOT
  rationale: 예언적 탄식의 충격과 반전을 드러내는 감탄사로서, 단순한 의문보다 탄식성 뉘앙스가 강한 ‘어찌하여’가 자연스럽습니다.
- source_word: לְזוֹנָה
  english_pob_choice: a prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: HALOT
  rationale: 히브리어는 성적 은유를 지닌 ‘매춘하는 여자’를 가리키므로, 한국어에서 은유적·비난적 힘을 유지하는 ‘창녀’가 적절합니다. ‘음녀’는 전통적이지만 종교적 관용구로 굳어져 원문의 직설성을 다소 약화합니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 재판
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּט은 단지 법정 판결이 아니라 성읍의 사회적·공적 질서 전체를 가리키므로, ‘정의’가 영어 POB의 ‘justice’와 가장 잘 대응합니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט와 병렬된 צֶדֶק은 윤리적·언약적 올바름을 가리키므로, 한국어 성서어휘에서 축적된 ‘의’가 적절합니다. 앞의 ‘정의’와 구별도 유지됩니다.
- source_word: יָלִין בָּהּ
  english_pob_choice: lodged in her
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 묵었습니다
  - 잠들었습니다
  lexicon: HALOT
  rationale: 원문은 ‘밤을 지내다/머무르다’의 이미지를 지니지만, 한국어에서는 ‘의가 성읍 안에 계속 거주했다’는 비유를 자연스럽게 살리는 ‘머물렀습니다’가 가장 균형적입니다.
theological_decisions:
- issue: 예루살렘을 여성 인격화한 성적 은유를 얼마나 직설적으로 옮길지
  chosen_reading: ‘신실한 성읍이 창녀가 되었습니까’로 직설을 유지합니다.
  alternative_readings:
  - ‘신실한 성읍이 불신실하게 되었습니까’
  - ‘신실한 성읍이 음녀가 되었습니까’
  rationale: 히브리어는 언약적 배신을 강하게 고발하는 노골적 성적 은유를 사용하므로, 이를 일반적 비유로 순화하면 예언적 충격과 책망의 강도가 약해집니다.
  doctrine_reference: 원문 우선 번역; 예언서의 상징 언어와 비유는 가능한 한 그대로 보존합니다.
