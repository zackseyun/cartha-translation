  naturalness: ‘그 성읍은’으로 명시하면 현대 표준 한국어에서 지시 대상이 자연스럽고, 성읍의 인격화도 유지됩니다. 마지막을 ‘살인자들입니다’로 두면 원문의 의도적인 동사 생략과 짧고 날카로운 대조를 자연스럽게 살릴 수 있습니다.
