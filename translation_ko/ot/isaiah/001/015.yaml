  source_fidelity: 히브리어의 시간절, 기도 때 펴 든 손바닥의 구체성, 하나님의 눈을 가리시는 의인화, 많은 기도에도 듣지 않으시는 지속적 거절, 그리고 피로 물든 손이라는 고발을 대체로 충실히 반영합니다. 다만 ‘너희에게서 내 눈을 가립니다’는 어순이 다소 부자연스러워 의인화 표현을 더 자연스럽게 다듬을 수 있습니다.
  naturalness: 합쇼체는 일관되고 적절합니다. ‘나는 내 눈을 너희에게서 가립니다’가 원문의 이미지를 보존하면서도 더 자연스러운 표준 한국어 어순입니다. 각 주석 표지는 해당 표현에 직접 붙여야 합니다.
  terminology: ‘손바닥’은 כַּף의 구체성을, 뒤의 ‘손’은 יָד의 일반성을 잘 구별합니다. ‘피’는 דָּמִים이 지닌 피 흘림/피 흘린 죄의 폭을 본문에서 제한하지 않으며, 주석으로 가능한 의미를 적절히 제시합니다.
