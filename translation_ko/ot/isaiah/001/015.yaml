- issue: 예언적 심판 선언의 어조
  chosen_reading: 하나님이 제의적 행위를 받지 않으시는 현재적 거절을 단정형으로 옮겼습니다.
  alternative_readings:
  - 나는 듣지 않을 것입니다
  - 나는 들으려 하지 않습니다
  rationale: 히브리어의 현재 분사와 문맥상 지속적 거절을 반영해, 단순한 미래 예고보다 지금의 심판 선언으로 들리게 하는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 이사야 1장 문맥의 언약적 고발
