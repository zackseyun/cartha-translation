id: ISA.1.15
reference: Isaiah 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
  footnotes:
  - marker: a
    text: Or 'your hands.' The Hebrew specifically says 'your palms,' evoking the gesture of uplifted hands in prayer.
    reason: lexical_alternative
  - marker: b
    text: Or 'I do not hear' / 'I will not listen.' The Hebrew expression can be rendered more formally, but here it conveys God's ongoing refusal to receive their prayers.
    reason: lexical_alternative
  - marker: c
    text: '''Blood'' may also be understood as ''bloodshed'' or ''bloodguilt.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 너희 손바닥을 펼 때[a], 나는 내 눈을 너희에게서 가립니다. 너희가 기도를 아무리 많이 드려도, 나는 듣지 않습니다[b]. 너희 손은 피로 가득합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손바닥’은 히브리어 כַּף의 구체성을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣지 않습니다’는 원문의 지속적인 거절을 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘피’는 ‘피 흘림’이나 ‘피 흘린 죄’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  english_pob_choice: And when you spread out
  chosen_korean: 그리고 너희가 … 펼 때
  alternatives_korean:
  - 그리고 너희가 … 벌릴 때
  - 그리고 너희가 … 펼쳐 보일 때
  lexicon: HALOT
  rationale: 분사적 시간표현을 한국어의 조건적·동시적 흐름으로 자연스럽게 옮기되, 예배 중 손을 펴 드는 동작을 살리기 위해 ‘펼 때’로 처리했습니다.
- source_word: כַּפֵּיכֶם
  english_pob_choice: your palms
  chosen_korean: 너희 손바닥
  alternatives_korean:
  - 너희 손
  - 너희 손바닥들
  lexicon: HALOT
  rationale: כַּף는 일반적인 ‘손’보다 구체적인 ‘손바닥’을 뜻하므로, 기도 자세의 이미지를 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: אַעְלִים עֵינַי מִכֶּם
  english_pob_choice: I hide my eyes from you
  chosen_korean: 나는 너희에게서 내 눈을 가립니다
  alternatives_korean:
  - 나는 너희에게서 내 눈을 숨깁니다
  - 나는 너희를 외면합니다
  lexicon: HALOT
  rationale: 하나님의 의도적 거절을 몸의 이미지로 드러내는 표현을 살리기 위해 ‘외면합니다’ 같은 해석어보다 ‘내 눈을 가립니다’에 가깝게 옮겼습니다.
- source_word: תְפִלָּה
  english_pob_choice: prayers
  chosen_korean: 기도를 … 많이 드려도
  alternatives_korean:
  - 기도를 … 많이 해도
  - 기도들을 … 많이 드려도
  lexicon: HALOT
  rationale: 히브리어 복수의 뉘앙스를 반영해 단수화하지 않고, 한국어에서는 자연스러운 ‘기도를 많이 드리다’로 표현했습니다.
- source_word: דָּמִים
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
  - 혈흔
  - 피 흘림
  lexicon: HALOT
  rationale: 복수형 דָּמִים의 폭력성은 유지하되, 본문이 예언적 고발로서 강하게 들리도록 한국어 관용구 ‘피가 가득합니다’를 사용했습니다.
