  lexicon: HALOT
  rationale: 앞의 ‘병들었’과 구별되도록 단순한 질병보다 내적 기력의 소진을 나타내는 ‘쇠약하다’를 선택했습니다.
theological_decisions:
- issue: 첫 절의 두 번째 절구를 의문문으로 볼지 여부
  chosen_reading: 두 번째 절구는 선언문으로 두어, ‘계속 반역하고 계십니다’라고 번역했습니다.
  alternative_readings:
  - ‘왜 계속 반역하십니까?’로 의문문 처리
  - ‘계속 반역하시는군요’처럼 감탄문 처리
  rationale: 히브리어에는 두 번째 질문 표지가 없으므로, 영어 POB의 최신 교정처럼 선언문을 유지하는 것이 문법과 수사 구조에 가장 충실합니다.
  doctrine_reference: Source-syntax fidelity; rhetorical structure in Hebrew poetry
