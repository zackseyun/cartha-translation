base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
  footnotes:
  - marker: a
    text: Or, 'On what part will you be struck again?' The Hebrew can be taken as asking where further blows could fall, given the body's total sickness.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 다시 맞으셔야 합니까? 계속 반역하고 계십니다. 온 머리는 병들었고, 온 마음은 쇠약합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 어디를 맞으셔야 합니까?’ 히브리어는 몸의 온통 병든 상태를 고려할 때 더 이상 어디에 타격이 가해질 수 있는지 묻는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  english_pob_choice: Why should you be struck again?
  chosen_korean: 어찌하여 다시 맞으셔야 합니까?
  alternatives_korean:
  - 무엇 때문에 다시 맞으셔야 합니까?
  - 어떤 까닭으로 다시 맞으셔야 합니까?
  lexicon: HALOT
  rationale: 문두의 수사적 의문을 현대 한국어에서 자연스럽게 살리되, 반복 징계의 무의미함을 드러내도록 옮겼습니다.
- source_word: תֻכּוּ
  english_pob_choice: should you be struck
  chosen_korean: 맞으셔야 합니까
  alternatives_korean:
  - 맞으십니까
  - 맞게 되십니까
  - 맞아야 합니까
  lexicon: HALOT
  rationale: Hophal의 피동·처벌적 뉘앙스를 살려 ‘맞다’로 옮기고, 수사적 질문의 강도를 고려해 공손체로 표현했습니다.
- source_word: סָרָה
  english_pob_choice: in rebellion
  chosen_korean: 반역하고 계십니다
  alternatives_korean:
  - 반역 가운데 있습니다
  - 배반하고 계십니다
  - 불순종하고 계십니다
  lexicon: HALOT
  rationale: תּוֹסִיפוּ와 결합된 지속적 행위를 한국어에서 자연스럽게 풀어 ‘계속 반역하다’의 의미를 살렸습니다.
- source_word: דַּוָּי
  english_pob_choice: is faint
  chosen_korean: 쇠약합니다
  alternatives_korean:
  - 기운이 없습니다
  - 허약합니다
  - 쇠잔합니다
  lexicon: HALOT
  rationale: 앞의 ‘병들었’과 구별되도록 단순한 질병보다 내적 기력의 소진을 나타내는 ‘쇠약하다’를 선택했습니다.
theological_decisions:
- issue: 첫 절의 두 번째 절구를 의문문으로 볼지 여부
  chosen_reading: 두 번째 절구는 선언문으로 두어, ‘계속 반역하고 계십니다’라고 번역했습니다.
  alternative_readings:
  - ‘왜 계속 반역하십니까?’로 의문문 처리
  - ‘계속 반역하시는군요’처럼 감탄문 처리
  rationale: 히브리어에는 두 번째 질문 표지가 없으므로, 영어 POB의 최신 교정처럼 선언문을 유지하는 것이 문법과 수사 구조에 가장 충실합니다.
  doctrine_reference: Source-syntax fidelity; rhetorical structure in Hebrew poetry
