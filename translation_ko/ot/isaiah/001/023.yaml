  to: 너의 지도자들은 반역자들이며 도둑들의 한패입니다[a]. 그들은 모두 뇌물을 좋아하고 보상을 뒤쫓습니다[b]. 그들은 고아를 변호하지 않으며[c], 과부의 소송은 그들에게 이르지 않습니다.
