  naturalness: ‘당신의’는 책망받는 예루살렘을 향한 예언자적 호칭으로 다소 부자연스러울 수 있어 ‘너의’로 고쳤습니다. ‘도둑들의 동무’와 ‘보상금을 좇습니다’도 현대 표준어에 맞춰 각각 ‘도둑들의 한패’, ‘보상을 뒤쫓습니다’로 다듬었습니다. 전체 문장은 합쇼체 종결을 유지합니다.
  terminology: ‘지도자들’, ‘뇌물’, ‘고아’, ‘과부의 소송’은 적절합니다. יִשְׁפֹּטוּ는 여기서 약자에게 न्याय를 시행하지 않는다는 법정적 의미이므로 ‘변호하지 않습니다’도 가능한 해석이나, 대안 각주로 ‘정의를 베풀지 않습니다’를 유지합니다.
