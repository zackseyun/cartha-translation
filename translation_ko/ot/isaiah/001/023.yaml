id: ISA.1.23
reference: Isaiah 1:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
  footnotes:
  - marker: a
    text: Or 'your princes are rebellious.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and pursue rewards/gifts'; the Hebrew term may refer to payments or recompense, likely in a corrupt context.
    reason: lexical_alternative
  - marker: c
    text: Or 'They do not give justice to the orphan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 지도자들은 반역자요 도둑들의 동무입니다[a]. 그들 모두는 뇌물을 사랑하고 보상금을 좇습니다[b]. 그들은 고아를 변호하지 않고[c], 과부의 소송은 그들에게 이르지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 지도자들은 반항적인 자들'로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '보상'이나 '선물'을 좇는다는 뜻일 수 있으며, 히브리어는 부패한 맥락에서 지급 대가를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '고아에게 정의를 베풀지 않습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַיִךְ
  english_pob_choice: your rulers
  chosen_korean: 당신의 지도자들
  alternatives_korean:
  - 당신의 통치자들
  - 당신의 관리들
  lexicon: HALOT
  rationale: שַׂר는 문맥상 지배층의 지도자, 통치자를 가리키므로 '지도자들'이 현대 한국어에서 자연스럽고 권력층의 책임을 드러냅니다.
- source_word: סוֹרְרִים
  english_pob_choice: rebels
  chosen_korean: 반역자들
  alternatives_korean:
  - 반항적인 자들
  - 반역적인 자들
  lexicon: HALOT
  rationale: סרר는 완강한 불복종과 반항을 나타내며, 이 문맥에서는 단순한 성격 묘사보다 공적 배반의 강도가 살아 있는 '반역자들'이 적절합니다.
- source_word: וְחַבְרֵי גַּנָּבִים
  english_pob_choice: companions of thieves
  chosen_korean: 도둑들의 동무
  alternatives_korean:
  - 도둑들의 साथी
  - 도둑들의 동료
  lexicon: HALOT
  rationale: 직역에 가까운 '동무'가 공모와 결탁의 뉘앙스를 살리면서도 한국어로 자연스럽고, 'companions of thieves'의 비난을 유지합니다.
- source_word: שַׁלְמֹנִים
  english_pob_choice: payments
  chosen_korean: 보상금
  alternatives_korean:
  - 지급금
  - 대가
  lexicon: HALOT
  rationale: 이 어형은 보상, 지급, 대가를 뜻할 수 있으나 부패한 맥락에서 불의한 대가를 좇는 뜻이므로, 의미를 과도하게 좁히지 않으면서도 뇌물과 연결되는 '보상금'을 택했습니다.
theological_decisions:
- issue: 재판 의무를 수행하지 않는다는 표현의 번역
  chosen_reading: 그들은 고아를 변호하지 않고, 과부의 소송은 그들에게 이르지 않습니다.
  alternative_readings:
  - 그들은 고아에게 정의를 베풀지 않고
  - 고아를 재판하지 않고
  rationale: 히브리어 יִשְׁפֹּטוּ는 여기서 단순 판결 행위보다 약자를 위해 정의를 집행하는 책임을 가리키므로, '변호하다'를 사용해 보호와 न्याय의 실패를 함께 드러냈습니다.
  doctrine_reference: 사회적 정의와 언약적 책임
