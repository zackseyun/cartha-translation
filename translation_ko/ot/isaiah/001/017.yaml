revisions:
- from: 선을 배우십시오. 정의를 찾으십시오[a]. 학대하는 자를 바로잡으십시오. 고아를 위하여 판결하고, 과부를 위하여 변론하십시오.
  to: 선을 행하는 법을 배우십시오. 정의를 추구하십시오. 억압하는 자를 바로잡으십시오[a]. 고아의 권리를 판결하고, 과부를 위하여 변론하십시오.
  rationale: 히브리어 명령문의 순서와 직접성을 유지하면서, 한국어 관용에 맞게 דִּרְשׁוּ מִשְׁפָּט을 ‘정의를 추구하십시오’로 조정했습니다. 난해한 אַשְּׁרוּ חָמוֹץ는 영어 POB의 본문 독법을 따라 능동적으로 옮기되, 각주를 정확한 위치로 옮기고 수동적 대안 독법을 보존했습니다. 마지막 두 명령은 각각 고아의 법적 권리와 과부의 소송 대변이라는 구별을 드러내도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 명령들의 순서와 법정·사회윤리적 의미는 대체로 잘 반영되었습니다. 다만 난해한 히브리어 구문 אַשְּׁרוּ חָמוֹץ에 관한 각주는 해당 구문이 아니라 ‘정의’에 붙어 있어, 대안 독법의 적용 범위가 불분명합니다. 또한 ‘학대하는 자’는 חָמוֹץ의 가능한 능동적 뜻을 다소 좁히므로 ‘억압하는 자’가 원문 및 영어 POB의 ‘oppressor’에 더 가깝습니다.
  naturalness: ‘정의를 찾으십시오’는 한국어에서 정의를 적극적으로 실현·추구하라는 명령으로는 다소 부자연스럽습니다. ‘정의를 추구하십시오’가 자연스럽고 의미도 정확합니다. ‘고아의 권리를 판결하십시오’는 שִׁפְטוּ יָתוֹם의 법적 보호 의미를 분명히 하면서 현대 한국어로도 자연스럽습니다.
  terminology: מִשְׁפָּט은 ‘정의’, רִיבוּ는 ‘변론하십시오’로 적절합니다. יָתוֹם은 ‘고아’로 번역할 수 있으나, 여기서는 단순한 판결 대상이 아니라 그를 위하여 न्याय를 시행한다는 뜻이므로 ‘고아의 권리를 판결하십시오’로 명시하는 편이 충실합니다. חָמוֹץ의 논쟁적 의미는 본문에서 능동적 독법을 택하되 각주에서 수동적 독법을 보존해야 합니다.
