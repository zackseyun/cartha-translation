id: ISA.1.17
reference: Isaiah 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
  footnotes:
  - marker: a
    text: Or 'help the oppressed' or 'set right the oppressed.' The Hebrew phrase is difficult, and חָמוֹץ may be understood differently.
    reason: alternative_reading
translation:
  language: ko
  text: 선을 행하는 법을 배우십시오. 정의를 추구하십시오. 억압하는 자를 바로잡으십시오[a]. 고아의 권리를 판결하고, 과부를 위하여 변론하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘억압받는 자를 도우십시오’ 또는 ‘억압받는 자를 바로 세우십시오.’ 히브리어 אַשְּׁרוּ חָמוֹץ는 해석이 어려우며, חָמוֹץ를 ‘억압하는 자’가 아니라 ‘억압받는 자’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ הֵיטֵב
  english_pob_choice: Learn to do good
  chosen_korean: 선을 배우십시오
  alternatives_korean:
  - 좋은 일을 배우십시오
  - 선한 일을 하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 복수 לִמְדוּ와 הֵיטֵב의 결합을 한국어에서는 자연스러운 윤리적 권면으로 옮겼습니다. ‘선을 배우십시오’는 동사적 명령을 유지하면서도 ‘to do good’의 도덕적 방향을 압축해 줍니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 재판
  lexicon: HALOT
  rationale: 예언서의 사회·법정 맥락에서 מִשְׁפָּט은 단순한 ‘판결’보다 공동체적 정의를 가리키므로 ‘정의’가 가장 적절합니다. 후속 동사들이 법적 변론 어휘이므로 같은 어근을 반복하지 않고 의미를 살렸습니다.
- source_word: אַשְּׁרוּ חָמוֹץ
  english_pob_choice: correct the oppressor
  chosen_korean: 학대하는 자를 바로잡으십시오
  alternatives_korean:
  - 억압받는 자를 바로잡으십시오
  - 학대받는 자를 바로잡으십시오
  - 억압을 바로잡으십시오
  lexicon: HALOT
  rationale: POB의 영어 주해처럼 חָמוֹץ는 능동적 의미(‘억압자/가해자’)와 수동적 의미(‘억압받는 자’)가 모두 논의되지만, 문맥의 사회윤리 명령 흐름에서는 능동적 해석이 가장 일관됩니다. ‘바로잡으십시오’는 אַשְּׁרוּ의 ‘곧게 하다/바르게 하다’의 뉘앙스를 살립니다.
- source_word: יָתוֹם / אַלְמָנָה
  english_pob_choice: the fatherless / the widow
  chosen_korean: 고아 / 과부
  alternatives_korean:
  - 아버지 없는 자 / 과부
  - 고아들 / 과부들
  lexicon: HALOT
  rationale: 히브리어의 대표적 사회적 약자 범주를 한국어 성경에서 널리 통용되는 ‘고아’와 ‘과부’로 옮겼습니다. ‘고아’를 택하되, 문맥상 보호와 대변의 대상이라는 점은 앞뒤 동사로 충분히 드러납니다.
theological_decisions:
- issue: מִשְׁפָּט의 번역 범위
  chosen_reading: 정의
  alternative_readings:
  - 판결
  - 공의
  rationale: 이 구절은 개인적 도덕훈이 아니라 사회적 약자를 위한 공적 질서를 요구하므로, משפט을 ‘정의’로 옮겨 예언자적 윤리의 폭을 드러냈습니다. 뒤따르는 ‘판결하다/변론하다’와 구별되어 의미 중복도 줄어듭니다.
  doctrine_reference: 예언서의 사회정의 어휘 처리 원칙
- issue: חָמוֹץ의 방향성
  chosen_reading: 학대하는 자를 바로잡으십시오
  alternative_readings:
  - 억압받는 자를 바로잡으십시오
  - 학대받는 자를 바로잡으십시오
  rationale: 히브리어 본문은 난해하지만, POB의 주석처럼 적극적/수동적 읽기가 공존합니다. 본문은 해석을 하나로 단정하지 않고, 본문 흐름상 가해 행위를 시정하라는 명령으로 읽는 쪽을 채택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
