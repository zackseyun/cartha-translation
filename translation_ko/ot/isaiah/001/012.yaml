base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
  footnotes:
  - marker: a
    text: Literally, 'to see my face,' an idiom for appearing in the presence of God.
    reason: lexical_alternative
translation:
  language: ko
  text: “내 앞에 나타나려고 올 때에, 누가 너희 손에서 이것을 요구했습니까? 내 뜰을 짓밟는 것을 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 얼굴을 보려고’이지만, 성전에서 하나님 앞에 나아와 예배하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבֹאוּ לֵרָאוֹת פָּנַי
  english_pob_choice: you come to appear before me
  chosen_korean: 내 앞에 나타나려고 올 때에
  alternatives_korean:
  - 내 얼굴을 보려고 올 때에
  - 내 앞에 나아올 때에
  lexicon: HALOT
  rationale: 예배 자리에서 하나님 앞에 나아오는 관용구를 한국어로 자연스럽게 풀어, 문자적 ‘얼굴을 보다’보다 출현/출석의 의미를 살렸습니다.
- source_word: מִי בִקֵּשׁ זֹאת
  english_pob_choice: who has required this
  chosen_korean: 누가 너희 손에서 이것을 요구했습니까
  alternatives_korean:
  - 누가 이것을 너희에게서 구했습니까
  - 누가 이것을 너희 손에서 요청했습니까
  lexicon: HALOT
  rationale: 문맥상 단순한 요청이 아니라 예배 행위를 요구한 뉘앙스이므로 ‘요구하다’로 옮겼고, 수사적 질문의 직접성을 살리기 위해 ‘너희 손에서’를 유지했습니다.
- source_word: מִיֶּדְכֶם
  english_pob_choice: from your hand
  chosen_korean: 너희 손에서
  alternatives_korean:
  - 너희에게서
  - 너희 손으로부터
  lexicon: HALOT
  rationale: 히브리어의 구체적 ‘손’ 관용구를 보존해 책임과 제의적 헌납의 뉘앙스를 드러냈습니다.
- source_word: רְמֹס חֲצֵרָי
  english_pob_choice: trampling my courts
  chosen_korean: 내 뜰을 짓밟는 것을 말입니다
  alternatives_korean:
  - 내 뜰을 짓밟는 일말입니다
  - 내 뜰을 밟아 짓이기는 것을 말입니다
  lexicon: HALOT
  rationale: 성전 문맥의 sacred precincts는 ‘뜰’이 가장 자연스럽고, רמס의 폭력성을 ‘짓밟다’로 분명히 했습니다.
theological_decisions:
- issue: לֵרָאוֹת פָּנַי의 예배적 관용구 처리
  chosen_reading: ‘내 앞에 나타나려고’로 옮겨 하나님을 물리적으로 보는 뜻이 아니라, 하나님 앞에 예배자로 출석하는 뜻을 살렸습니다.
  alternative_readings:
  - ‘내 얼굴을 보려고’
  - ‘내 앞에 나아와 보려고’
  rationale: 원문은 성전 예배의 관용구이므로, 직역이 오해를 부를 수 있는 ‘얼굴을 보다’ 대신 출현/나아옴의 의미를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 원문의 관용성과 예배 맥락 우선.'
