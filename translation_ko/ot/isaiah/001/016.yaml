  source_fidelity: 첫 두 명령은 히브리어의 복수 명령형과 자기 정화의 뉘앙스를 대체로 잘 반영합니다. 그러나 ‘악한 행위’는 רֹעַ מַעַלְלֵיכֶם(‘여러분의 행위의 악/여러분이 행하는 악’)의 구성 관계를 다소 평면화하여, ‘악한 행위들’ 자체를 치우라는 뜻으로 읽힐 수 있습니다. 이를 더 직접적으로 드러내는 표현이 안전합니다.
