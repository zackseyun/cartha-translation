id: ISA.1.16
reference: Isaiah 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
  footnotes:
  - marker: a
    text: Or 'purify yourselves.' The Hebrew verb can carry the sense of becoming clean or pure.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before my eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스스로 씻으십시오[a]. 스스로를 깨끗하게 하십시오. 여러분이 행하는 악을 내 눈앞에서 치우십시오[b]. 악을 행하기를 그치십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로 정결하게 하십시오.’ 히브리어 동사는 깨끗해지거나 정결해지는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 눈앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  english_pob_choice: Wash yourselves
  chosen_korean: 스스로 씻으십시오
  alternatives_korean:
  - 씻으십시오
  - 몸을 씻으십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 복수의 반사적 뉘앙스를 살려 ‘스스로’로 행위의 자기 지시성을 드러냈습니다.
- source_word: הִזַּכּוּ
  english_pob_choice: make yourselves clean
  chosen_korean: 스스로 깨끗하게 하십시오
  alternatives_korean:
  - 스스로 정결하게 하십시오
  - 깨끗해지십시오
  lexicon: HALOT
  rationale: ‘깨끗하게 하다’는 도덕적 정결의 요구를 자연스러운 현대 한국어로 옮기면서, POB의 ‘make yourselves clean’처럼 행위의 책임을 유지합니다.
- source_word: מִנֶּגֶד עֵינַי
  english_pob_choice: from before my eyes
  chosen_korean: 내 눈앞에서
  alternatives_korean:
  - 내 눈앞에서부터
  - 내 눈앞으로부터
  lexicon: HALOT
  rationale: 직역된 ‘before my eyes’의 시각적·인격적 표현을 살리되, 한국어에서는 ‘내 눈앞에서’가 가장 자연스럽고 충실합니다.
- source_word: הָרֵעַ
  english_pob_choice: doing evil
  chosen_korean: 악을 행하는 일
  alternatives_korean:
  - 악행
  - 악을 행함
  lexicon: HALOT
  rationale: 부정사적 용법을 한국어 명사구로 풀어, ‘그치십시오’의 목적어로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 씻음과 깨끗함의 의미
  chosen_reading: 세정 의례 용어로 굳히지 않고, 죄와 악행에 대한 도덕적 회개 촉구로 유지했습니다.
  alternative_readings:
  - 정결 의례를 연상시키는 번역
  - 종교적 의식 중심의 번역
  rationale: 문맥상 이사야는 예배 행위보다 삶의 악을 버리라는 책망을 하고 있으므로, 비유적 정화 이미지를 그대로 살리는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
