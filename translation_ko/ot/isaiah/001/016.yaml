  terminology: ‘씻다’, ‘깨끗하게 하다’, ‘악’, ‘행하다’는 의례화하거나 특정 교리를 덧붙이지 않으면서 본문의 도덕적 정화 이미지를 적절히 보존합니다. ‘내 눈앞에서’도 מִנֶּגֶד עֵינַי의 인격적이고 생생한 표현을 충실히 반영합니다.
