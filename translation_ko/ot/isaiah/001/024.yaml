id: ISA.1.24
reference: Isaiah 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
  footnotes:
  - marker: a
    text: Or “oracle of the Lord.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the LORD of hosts”; rendered “of Armies” for clarity.
    reason: lexical_alternative
  - marker: c
    text: Or “I will be comforted over my adversaries” or “I will ease myself of my foes.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주, 만군의 야훼, 이스라엘의 능하신 이의 선언입니다. “아, 내가 내 대적들에게서 후련함을 얻고 내 원수들에게 원수를 갚겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선언’은 예언적 공식인 히브리어 נְאֻם의 번역입니다. ‘말씀’ 또는 ‘신탁’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘만군의 야훼’입니다. ‘만군’은 군대들 또는 하늘의 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘후련함을 얻고’는 히브리어 נחם의 의미를 옮긴 것입니다. ‘내 대적들에게서 위로를 받고’ 또는 ‘내 대적들에게서 자신을 풀고’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그래서
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 대한 결과를 나타내는 결론 표지로, 공문체적이면서도 자연스러운 ‘그러므로’가 적절합니다.
- source_word: נְאֻם הָאָדוֹן יְהוָה צְבָאוֹת
  english_pob_choice: the declaration of the Lord, Yahweh of Armies
  chosen_korean: 주님의 선언, 야훼 만군의 하나님
  alternatives_korean:
  - 주님의 말씀, 야훼 만군의 하나님
  - 주님의 신탁, 야훼 만군의 하나님
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식을 가리키므로 ‘선언’으로 옮겼고, יְהוָה는 본문 그대로 ‘야훼’로, צְבָאוֹת은 전통적 ‘만군의’로 옮겨 군대적 뉘앙스를 살렸습니다.
- source_word: אֲבִיר יִשְׂרָאֵל
  english_pob_choice: the Mighty One of Israel
  chosen_korean: 이스라엘의 강한 이
  alternatives_korean:
  - 이스라엘의 용사
  - 이스라엘의 능하신 이
  lexicon: HALOT
  rationale: אֲבִיר은 힘과 강함을 강조하는 신적 칭호이므로, 직설적이면서도 시적 긴장을 유지하는 ‘강한 이’가 적절합니다.
- source_word: אֶנָּחֵם מִצָּרַי
  english_pob_choice: I will get relief from my foes
  chosen_korean: 내 원수들로부터 시원함을 얻고
  alternatives_korean:
  - 내 적들로부터 위로를 얻고
  - 내 대적들로부터 풀림을 얻고
  lexicon: HALOT
  rationale: נחם의 니팔형은 단순한 위로보다 ‘풀림/시원함’을 동반하는 해소의 뉘앙스를 갖기에, 하나님 자신이 적대자들에 대해 얻게 되는 해소감을 드러내는 표현으로 옮겼습니다.
- source_word: וְאִנָּקְמָה מֵאוֹיְבָי
  english_pob_choice: and avenge myself on my enemies
  chosen_korean: 내 적들에게 원수를 갚겠습니다
  alternatives_korean:
  - 내 원수들에게 복수하겠습니다
  - 내 적들에게 보복하겠습니다
  lexicon: HALOT
  rationale: נקם의 보복/원수 갚음 의미를 살리되, 한국어에서 자연스럽고 강한 대응을 나타내는 ‘원수를 갚다’로 옮겨 앞 절의 해소 표현과 병렬을 유지했습니다.
theological_decisions:
- issue: יהוה와 צְבָאוֹת의 결합 칭호
  chosen_reading: ‘야훼 만군의 하나님’으로 옮겨, 고유명사와 군대적 통치 칭호를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼 만군의 주’
  - ‘만군의 야훼’
  rationale: 본문은 하나님의 이름과 통치 칭호를 결합한 엄중한 선포문이므로, 두 요소를 모두 보이되 한국어에서 예배적 호칭으로도 읽히는 형태를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘아’의 감탄과 심판 선언의 정서
  chosen_reading: ‘아’로 옮겨, 애도보다 단호한 결의가 드러나는 감탄을 유지했습니다.
  alternative_readings:
  - ‘오’
  - ‘하’
  rationale: 히브리어 הוֹי는 여기서 탄식보다 결심을 앞세우는 감탄으로 기능하므로, 지나치게 서정화하지 않는 짧은 감탄사로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
