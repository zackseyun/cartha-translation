id: ISA.1.29
reference: Isaiah 1:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יֵבֹ֔שׁוּ מֵ/אֵילִ֖ים אֲשֶׁ֣ר חֲמַדְתֶּ֑ם וְ/תַ֨חְפְּר֔וּ מֵ/הַ/גַּנּ֖וֹת אֲשֶׁ֥ר בְּחַרְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
  footnotes:
  - marker: a
    text: Or 'terebinths'; the Hebrew may refer to large sacred trees associated with illicit worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 여러분은, 여러분이 원했던 상수리나무들 때문에 부끄러워하고, 여러분이 선택한 동산들 때문에 수치를 당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상수리나무들’은 히브리어가 가리킬 수 있는 큰 나무를 옮긴 것이며, ‘떡갈나무들/떨기나무들’도 가능한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: you will be ashamed
  chosen_korean: 부끄러워하고
  alternatives_korean:
  - 수치를 당하고
  - 창피를 당하고
  lexicon: HALOT
  rationale: בוש의 shame/disappointment 의미를 자연스러운 현대 한국어로 옮기되, 수동적 표현보다 당사자의 수치 경험을 직접 드러내는 동사를 택했습니다.
- source_word: מֵ/אֵילִ֖ים
  english_pob_choice: of the oaks
  chosen_korean: 상수리나무들 때문에
  alternatives_korean:
  - 떡갈나무들 때문에
  - 떨어져 있는 떨기나무들 때문에
  lexicon: HALOT
  rationale: אֵילִים은 문맥상 우상숭배와 연결된 큰 나무들을 가리키므로, 한국어에서는 자연스럽고도 비종교적 오해가 적은 ‘상수리나무들’로 옮겼습니다. 원문이 특정 수종을 단정하지 않는 점은 본문 밖에서 유지합니다.
- source_word: מֵ/הַ/גַּנּ֖וֹת
  english_pob_choice: because of the gardens
  chosen_korean: 동산들 때문에
  alternatives_korean:
  - 정원들 때문에
  - 가든들 때문에
  lexicon: HALOT
  rationale: גַּנּוֹת은 단순한 원예용 정원보다 우상숭배와 연관된 성소적 ‘동산/정원’의 뉘앙스를 갖기 쉬워, 한국어에서도 성경적 문맥을 살리는 ‘동산들’이 가장 적절합니다.
- source_word: אֲשֶׁ֥ר בְּחַרְתֶּֽם
  english_pob_choice: that you chose
  chosen_korean: 여러분이 선택한
  alternatives_korean:
  - 여러분이 고른
  - 여러분이 택한
  lexicon: HALOT
  rationale: בחר의 능동적 선택 책임을 분명히 드러내기 위해 ‘선택한’을 사용했습니다. 이는 단순한 취향이 아니라 의도적 선택을 강조합니다.
theological_decisions:
- issue: 상수리나무와 동산의 의미
  chosen_reading: 본문은 단순한 자연 풍경이 아니라, 우상숭배와 연결된 예배 장소를 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 그저 좋아하던 나무와 정원에 대한 일반적 수치로 이해할 수 있습니다.
  rationale: 이사야 1장의 문맥이 전반적으로 배교와 우상숭배를 고발하므로, 용어는 평이하게 옮기되 배경 의미는 과도하게 약화하지 않았습니다.
  doctrine_reference: 원어 우선 원칙과 예언서 문맥 보존
