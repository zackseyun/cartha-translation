  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
  footnotes:
  - marker: a
    text: Or 'and let us argue it out,' 'and let us settle the matter,' or 'and let us dispute together.' The Hebrew verb carries legal and dialogical overtones.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like worm-scarlet' or 'like scarlet dye'; the term refers by association to the crimson color produced from the insect.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하십니다. “자, 오십시오. 함께 따져 봅시다[a]. 비록 너희의 죄가 주홍 같을지라도 눈처럼 희어질 것이며, 비록 그것들이 진홍처럼[b] 붉을지라도 양털처럼 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함께 따져 봅시다’는 이 동사의 법정적·논박적 의미를 살린 번역입니다. 달리 ‘서로 논의합시다’, ‘함께 변론해 봅시다’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘벌레-주홍’ 또는 ‘벌레에서 얻는 진홍색 염료 같은’이라는 뜻입니다. 여기서는 그 염료와 연관된 색을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  english_pob_choice: Come now
