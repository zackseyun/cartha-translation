  lexicon: HALOT
  rationale: 본문의 여호와/주님화 대신, 프로젝트 기본값에 따라 언약명 자체를 음역해 source-direct한 대응을 유지했습니다.
theological_decisions:
- issue: 회개 초청의 법정적 어조
  chosen_reading: ‘함께 변론해 봅시다’로 초청하되, 단순 설득이 아니라 언약 소송의 성격을 드러냈습니다.
  alternative_readings:
  - 함께 이야기합시다
  - 함께 의논합시다
  - 함께 따져 봅시다
  rationale: 이 문맥은 하나님의 온화한 초대이면서도 죄를 두고 판결을 논하는 장면이므로, 법정적 긴장과 자비의 초청을 동시에 보존해야 합니다.
  doctrine_reference: Isaiah 1 covenant lawsuit context
- issue: 불결/죄의 정화 비유
  chosen_reading: ‘희어질 것이다’와 ‘양털처럼 될 것입니다’로 정결의 결과를 분명히 했습니다.
  alternative_readings:
  - 깨끗해질 것입니다
  - 하얗게 될 것입니다
  rationale: 히브리어의 색채 전환 이미지는 죄 사함과 정결을 가리키므로, 추상화보다 시각적 변환을 살리는 편이 본문 의도에 가깝습니다.
  doctrine_reference: Biblical imagery of purification
