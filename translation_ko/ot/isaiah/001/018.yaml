source:
  edition: WLC
  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
  footnotes:
  - marker: a
    text: Or 'and let us argue it out,' 'and let us settle the matter,' or 'and let us dispute together.' The Hebrew verb carries legal and dialogical overtones.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like worm-scarlet' or 'like scarlet dye'; the term refers by association to the crimson color produced from the insect.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 오십시오. 함께 변론해 봅시다. 야훼께서 말씀하십니다. “비록 너희의 죄가 주홍 같을지라도 눈처럼 희어질 것이며, 비록 그것들이 진홍같이 붉을지라도 양털처럼 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함께 변론해 봅시다’는 이 동사의 법정적·논박적 의미를 살린 번역입니다. 다른 가능한 뜻으로는 ‘서로 논의합시다’, ‘함께 따져 봅시다’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진홍’은 벌레에서 얻는 진홍색 염료와 연결되는 표현을 압축해 옮긴 것입니다. 더 직역하면 ‘벌레-주홍’ 또는 ‘진홍 염료 같은’의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  english_pob_choice: Come now
  chosen_korean: 이제 오십시오
  alternatives_korean:
  - 오십시오
  - 오세요
  - 이제 오세요
  lexicon: HALOT
  rationale: 2인칭 복수 초청/촉구 표현으로서 현대 한국어에서는 ‘이제 오십시오’가 공손하면서도 단호한 요청을 가장 자연스럽게 살립니다.
- source_word: וְנִוָּכְחָה
  english_pob_choice: and let us reason together
  chosen_korean: 함께 변론해 봅시다
  alternatives_korean:
  - 함께 따져 봅시다
  - 서로 논의해 봅시다
  - 함께 이유를 따져 봅시다
  lexicon: HALOT
  rationale: 이 동사는 단순 대화가 아니라 법정적·논박적 뉘앙스를 가지므로, ‘변론하다’로 긴장감을 살리되 합쇼체 청유형으로 자연스럽게 옮겼습니다.
- source_word: כַּשָּׁנִים / כַּתּוֹלָע
  english_pob_choice: like scarlet / like crimson
  chosen_korean: 주홍 같을지라도 / 진홍같이 붉을지라도
  alternatives_korean:
  - 붉은 주홍 같을지라도
  - 벌레빛 진홍 같을지라도
  - 홍색 같을지라도
  lexicon: HALOT
  rationale: 색채 평행을 살리기 위해 주홍과 진홍을 구분해 옮겼고, כַּתּוֹלָע의 곤충 연관은 본문 주석 없이도 ‘진홍’으로 충분히 드러납니다.
- source_word: כַּצֶּמֶר יִהְיוּ
  english_pob_choice: they will become like wool
  chosen_korean: 양털처럼 될 것입니다
  alternatives_korean:
  - 양털같이 될 것입니다
  - 양털처럼 희어질 것입니다
  - 털실처럼 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘양털처럼’의 비교만 말하므로, 영어 POB처럼 색을 덧붙이지 않고 비교 이미지를 그대로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와/주님화 대신, 프로젝트 기본값에 따라 언약명 자체를 음역해 source-direct한 대응을 유지했습니다.
theological_decisions:
- issue: 회개 초청의 법정적 어조
  chosen_reading: ‘함께 변론해 봅시다’로 초청하되, 단순 설득이 아니라 언약 소송의 성격을 드러냈습니다.
  alternative_readings:
  - 함께 이야기합시다
  - 함께 의논합시다
  - 함께 따져 봅시다
  rationale: 이 문맥은 하나님의 온화한 초대이면서도 죄를 두고 판결을 논하는 장면이므로, 법정적 긴장과 자비의 초청을 동시에 보존해야 합니다.
  doctrine_reference: Isaiah 1 covenant lawsuit context
- issue: 불결/죄의 정화 비유
  chosen_reading: ‘희어질 것이다’와 ‘양털처럼 될 것입니다’로 정결의 결과를 분명히 했습니다.
  alternative_readings:
  - 깨끗해질 것입니다
  - 하얗게 될 것입니다
  rationale: 히브리어의 색채 전환 이미지는 죄 사함과 정결을 가리키므로, 추상화보다 시각적 변환을 살리는 편이 본문 의도에 가깝습니다.
  doctrine_reference: Biblical imagery of purification
