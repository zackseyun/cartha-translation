  lexicon: HALOT
  rationale: 2인칭 복수 초청/촉구 표현으로서 현대 한국어에서는 ‘이제 오십시오’가 공손하면서도 단호한 요청을 가장 자연스럽게 살립니다.
- source_word: וְנִוָּכְחָה
