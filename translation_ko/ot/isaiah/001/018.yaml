  - 서로 논의해 봅시다
  - 함께 이유를 따져 봅시다
  lexicon: HALOT
  rationale: 이 동사는 단순 대화가 아니라 법정적·논박적 뉘앙스를 가지므로, ‘변론하다’로 긴장감을 살리되 합쇼체 청유형으로 자연스럽게 옮겼습니다.
- source_word: כַּשָּׁנִים / כַּתּוֹלָע
  english_pob_choice: like scarlet / like crimson
  chosen_korean: 주홍 같을지라도 / 진홍같이 붉을지라도
  alternatives_korean:
  - 붉은 주홍 같을지라도
  - 벌레빛 진홍 같을지라도
  - 홍색 같을지라도
  lexicon: HALOT
  rationale: 색채 평행을 살리기 위해 주홍과 진홍을 구분해 옮겼고, כַּתּוֹלָע의 곤충 연관은 본문 주석 없이도 ‘진홍’으로 충분히 드러납니다.
- source_word: כַּצֶּמֶר יִהְיוּ
  english_pob_choice: they will become like wool
  chosen_korean: 양털처럼 될 것입니다
  alternatives_korean:
  - 양털같이 될 것입니다
  - 양털처럼 희어질 것입니다
  - 털실처럼 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘양털처럼’의 비교만 말하므로, 영어 POB처럼 색을 덧붙이지 않고 비교 이미지를 그대로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
