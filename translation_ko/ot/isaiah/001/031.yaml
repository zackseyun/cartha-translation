  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה הֶ/חָסֹן֙ לִ/נְעֹ֔רֶת וּ/פֹעֲל֖/וֹ לְ/נִיצ֑וֹץ וּ/בָעֲר֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וְ/אֵ֥ין מְכַבֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
  footnotes:
  - marker: a
    text: Or 'tow'—that is, loose flax fiber that ignites easily.
    reason: lexical_alternative
translation:
  language: ko
  text: 강한 자는 부스러기가 되고, 그의 일은 불똥이 됩니다. 둘이 함께 타버리되, 끌 사람이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부스러기’는 쉽게 타는 섬유 찌꺼기라는 점에서 영어의 ‘tinder’에 해당하는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  english_pob_choice: the strong man
  chosen_korean: 강한 자
  alternatives_korean:
  - 힘센 사람
  - 강한 사람
  - 용사
  lexicon: HALOT
  rationale: 형용사/명사로서의 ‘강한, 강력한’ 의미를 살리면서도 히브리어의 개인적 지시를 자연스러운 한국어로 옮기기 위해 ‘강한 자’를 택했습니다.
- source_word: לִנְעֹרֶת
  english_pob_choice: tinder
  chosen_korean: 부스러기
  alternatives_korean:
  - 불쏘시개
  - 마른 삼섬유
  - 타기 쉬운 섬유찌꺼기
  lexicon: HALOT
  rationale: 문맥상 쉽게 타는 섬유 찌꺼기를 가리키므로 기능적으로는 ‘불쏘시개’가 가깝지만, 원어의 ‘잘게 흩어진 섬유/부스러기’ 이미지를 살리기 위해 ‘부스러기’로 옮겼습니다.
- source_word: לְנִיצוֹץ
  english_pob_choice: a spark
  chosen_korean: 불똥
  alternatives_korean:
  - 불꽃
  - 불꽃 한 점
  - 불씨
  lexicon: HALOT
  rationale: ‘불똥’은 작은 점화체라는 뜻을 분명히 하면서도, 앞의 ‘부스러기’와 짝을 이루는 짧고 날카로운 심상을 전달합니다.
- source_word: וּבָעֲרוּ שְׁנֵיהֶם יַחְדָּו
  english_pob_choice: both of them will burn together
  chosen_korean: 둘이 함께 타버리되
  alternatives_korean:
  - 둘 다 함께 불타게 되며
  - 두 사람 모두 함께 타버리며
  lexicon: HALOT
  rationale: ‘타다’에 완료적 뉘앙스를 더한 ‘타버리다’로 심판의 소멸성을 강조했고, ‘둘이 함께’로 히브리어의 병렬 강조를 보존했습니다.
- source_word: וְאֵין מְכַבֶּה
  english_pob_choice: with no one to quench them
  chosen_korean: 끌 사람이 없습니다
  alternatives_korean:
  - 끄는 자가 없습니다
  - 끄지 못할 것입니다
  - 식힐 사람이 없습니다
  lexicon: HALOT
  rationale: 동사의 핵심 의미는 ‘불을 끄다/진화하다’이므로, 현대 한국어에서 가장 간결한 ‘끌 사람이 없습니다’로 종결해 심판의 최종성을 드러냈습니다.
theological_decisions:
- issue: ‘강한 자’와 그 ‘일’의 동시 심판
  chosen_reading: 사람 자체와 그가 행한 일/산출물이 함께 심판의 대상이 됩니다.
  alternative_readings:
  - ‘일’은 단순한 행위라기보다 그가 이룬 결과물 전체를 가리킬 수 있습니다.
  rationale: 히브리어 단수 소유격은 앞의 단수 주어를 자연스럽게 가리키므로, 인물과 그 산출물을 병렬로 불타게 하는 예언적 심판 이미지를 그대로 살렸습니다.
  doctrine_reference: 예언서의 심판과 인간 행위의 책임
- issue: ‘불똥’의 이미지 선택
  chosen_reading: 불의 점화성과 전염성을 드러내는 이미지로 이해했습니다.
  alternative_readings:
  - ‘불씨’로 옮기면 더 익숙하지만, 원문의 ‘튀는 점화체’ 느낌은 약해집니다.
  rationale: 원문은 쉽게 옮겨붙는 작은 점화체의 이미지를 통해 심판의 급속한 전이를 그리므로, 한국어에서도 그 긴장감을 유지하는 쪽을 택했습니다.
  doctrine_reference: 하나님의 심판의 불가역성
