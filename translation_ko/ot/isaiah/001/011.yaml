id: ISA.1.11
reference: Isaiah 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
  footnotes:
  - marker: a
    text: Or, 'What use are your many sacrifices to me?' The Hebrew idiom is literally, 'Why to me the multitude of your sacrifices?'
    reason: lexical_alternative
  - marker: b
    text: '''Goats'' translates a term more specifically meaning ''male goats'' or ''he-goats.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 바치는 수많은 제물이 내게 무슨 소용이 있겠느냐? 야훼께서 말씀하십니다. 나는 숫양의 번제와 살진 짐승의 기름기에 진저리가 났고, 수소와 어린양과 숫염소의 피를 기뻐하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내게 무슨 소용이 있겠느냐?’는 히브리어 관용구를 옮긴 것입니다. 문자적으로는 ‘왜 너희의 많은 제물이 내게 [있느냐]?’에 가깝고, 여기서는 제물의 가치나 유익을 묻는 수사적 질문입니다.
    reason: source_note
  - marker: b
    text: ‘숫염소’는 히브리어 עַתּוּדִים의 성별이 드러나는 뜻을 살린 옮김입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה לִּי
  english_pob_choice: Why are ... to me?
  chosen_korean: 어찌하여 ... 내게 있느냐?
  alternatives_korean:
  - 무슨 소용이 있느냐?
  - 왜 ... 내게 있느냐?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문 구조를 살리면서, 단순 원인 질문보다 제물의 유효성을 따지는 뉘앙스를 한국어로 자연스럽게 옮겼습니다.
- source_word: רֹב זִבְחֵיכֶם
  english_pob_choice: your many sacrifices
  chosen_korean: 너희의 많은 제물
  alternatives_korean:
  - 너희의 많은 희생제사
  - 너희의 풍성한 제물
  lexicon: HALOT
  rationale: זִבְחִים은 제의적 희생을 가리키므로 문맥상 ‘제물’이 적절하며, רֹב의 양적 강조를 ‘많은’으로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본값에 따라 신명기적 언약명은 ‘야훼’로 옮겨, 본문이 직접 부르는 하나님의 고유 이름을 보존했습니다.
- source_word: עֹלוֹת אֵילִים וְחֵלֶב מְרִיאִים
  english_pob_choice: burnt offerings of rams and the fat of fattened animals
  chosen_korean: 숫양의 번제와 살진 짐승의 기름
  alternatives_korean:
  - 숫양의 번제와 살진 짐승의 지방
  - 숫양의 번제와 살진 짐승의 기름기
  lexicon: HALOT
  rationale: עֹלוֹת는 ‘번제’, אֵילִים은 ‘숫양’이며, חֵלֶב은 제의적 맥락에서 동물의 기름/지방을 가리키므로 한국어 관용을 고려해 ‘기름’으로 처리했습니다.
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  english_pob_choice: the blood of bulls and lambs and goats
  chosen_korean: 수소와 어린 양과 숫염소의 피
  alternatives_korean:
  - 수소와 양과 숫염소의 피
  - 수소와 어린 양과 염소의 피
  lexicon: HALOT
  rationale: פָּרִים, כְבָשִׂים, עַתּוּדִים의 목록을 구체적으로 살리되, עַתּוּדִים의 성별 표지를 드러내기 위해 ‘숫염소’를 택했습니다.
theological_decisions:
- issue: 야훼의 말씀이 담긴 예언적 질책의 어조
  chosen_reading: ‘어찌하여 … 있느냐?’와 ‘이미 만족하였고 … 기뻐하지 않습니다’로, 제사의 거부와 혐오를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘무슨 소용이 있느냐?’로 완화
  - ‘싫어하지 않는다’로 약화
  rationale: 본문은 단순한 무관심이 아니라 예배 형식에 대한 언약적 책망을 말하므로, 수사적 강도와 부정 진술을 약화하지 않았습니다.
  doctrine_reference: Isaiah 1:11의 예언자적 심판 선언
