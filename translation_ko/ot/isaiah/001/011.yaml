  source_fidelity: 전반적으로 히브리어의 제의 용어와 열거는 충실합니다. 그러나 ‘어찌하여 너희의 많은 제물이 내게 있느냐?’는 한국어에서 부자연스럽고, לָמָּה לִּי의 수사적 의미인 ‘내게 무슨 소용이 있느냐’를 충분히 드러내지 못합니다. 또한 שָׂבַעְתִּי는 문맥상 ‘이미 만족하였다’보다 ‘진저리가 났다/배부르다’라는 포화와 거부의 뜻입니다.
  naturalness: 현행 첫 문장은 현대 표준 한국어의 수사적 질문으로 어색합니다. ‘너희가 바치는 수많은 제물이 내게 무슨 소용이 있겠느냐?’가 자연스럽고 원문의 물음과 평가적 기능을 함께 보존합니다. ‘살진 짐승의 기름’은 가능하나 제의 문맥에서는 ‘기름기’가 더 분명합니다.
  terminology: ‘야훼’, ‘번제’, ‘숫양’, ‘수소’, ‘어린양’, ‘숫염소’는 적절합니다. חֵלֶב는 일반 식용유의 뜻으로 오해될 수 있으므로 ‘기름기’로 옮기는 편이 제물의 지방 부분을 가리키는 문맥에 더 적합합니다. עַתּוּדִים의 수컷 표지는 ‘숫염소’로 보존할 수 있습니다.
