  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
  footnotes:
  - marker: a
    text: Or 'like a terebinth.' The Hebrew אֵלָה can refer to a terebinth or an oak; the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희는 잎이 시드는 떡갈나무[a] 같고, 물이 없는 정원 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테레빈스나무’입니다. 히브리어 אֵלָה는 테레빈스나무나 떡갈나무를 가리킬 수 있으며, 정확한 수종은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / For
  english_pob_choice: For
  chosen_korean: 그러면
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 심판 문맥에서 결과를 이끄는 연결로서, 한국어에서는 자연스럽게 결과·귀결을 나타내는 ‘그러면’이 적절합니다.
- source_word: תִהְיוּ / you will be
  english_pob_choice: you will be
  chosen_korean: 너희는 … 같습니다
  alternatives_korean:
  - 너희는 … 되겠습니다
  - 너희는 … 될 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 한국어 현재 시제 비유문으로 풀어, 원문의 단정적 결과를 자연스럽게 살렸습니다.
- source_word: כְאֵלָה / like an oak
  english_pob_choice: like an oak
  chosen_korean: 떡갈나무
  alternatives_korean:
  - 상수리나무
  - 떨기나무
  lexicon: HALOT
  rationale: אֵלָה는 떡갈나무/테레빈스나무로 갈릴 수 있으나, 한국어에서는 본문의 ‘큰 나무’ 이미지를 살리는 익숙한 수목명으로 옮기고, 식별의 불확실성은 각주로 보완합니다.
- source_word: נֹבֶלֶת / withers
  english_pob_choice: withers
  chosen_korean: 잎이 시드는
  alternatives_korean:
  - 잎이 마르는
  - 잎이 떨어지는
  - 시들어 가는
  lexicon: HALOT
  rationale: ‘시들다’는 הנבל의 쇠잔·시듦 이미지를 자연스럽게 전달하며, 뒤의 ‘잎’과 결합해 상대절의 뜻을 분명하게 합니다.
theological_decisions:
- issue: 수종 식별의 모호성
  chosen_reading: 본문의 비유 효과를 우선하여 ‘떡갈나무’로 본문에 두고, 히브리어 אֵלָה가 떡갈나무 또는 테레빈스나무를 가리킬 수 있다는 점은 각주로 남겼습니다.
  alternative_readings:
  - 테레빈스나무
  - 상수리나무
  rationale: 본문의 메시지는 정확한 식물학 분류보다 심판 아래 놓인 생명력의 쇠잔에 있으므로, 독자가 즉시 이해할 수 있는 대표 수목으로 옮기되 어휘상의 긴장은 보존합니다.
  doctrine_reference: 본문 주해의 어휘적 불확정성
- issue: 비유문의 문장 방식
  chosen_reading: 직역형 종결 대신 한국어 자연스러운 비유문 ‘… 같습니다’를 사용했습니다.
  alternative_readings:
  - … 될 것입니다
  - … 되겠습니다
  rationale: 예언적 선언의 확실성을 유지하면서도 현대 한국어 독자에게 과도하게 낯선 어순을 피하는 방식입니다.
  doctrine_reference: 예언문 번역 관행
