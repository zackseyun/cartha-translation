id: ISA.1.10
reference: Isaiah 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
  footnotes:
  - marker: a
    text: Isaiah addresses Judah's leaders and people with the names 'Sodom' and 'Gomorrah' as a prophetic comparison, not as a literal identification.
    reason: cultural_note
  - marker: b
    text: Or 'law' or 'teaching' for 'instruction' (Hebrew torah).
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀을 들으십시오, 소돔의 지도자들아. 우리 하나님의 교훈에 귀를 기울이십시오, 고모라의 백성아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 유다의 지도자와 백성을 소돔과 고모라에 비겨 책망하는 예언적 호칭이며, 문자적 동일시가 아닙니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 תורה(torah)는 여기서 '율법' 또는 '가르침'으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어라
  lexicon: HALOT
  rationale: 예언자적 공적 호소의 명령문을 현대 표준어의 합쇼체로 옮기되, 단순한 요청이 아니라 청종을 요구하는 힘을 살렸습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: דבר의 기본 뜻을 따라 '말씀'으로 옮기고, יְהוָה는 본 프로젝트 기본값에 따라 '야훼'로 직접 음역하여 신적 고유명을 보존했습니다.
- source_word: תּוֹרַת
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 율법
  - 가르침
  lexicon: HALOT
  rationale: תורה는 여기서 단순 법조문보다 예언적 권면의 성격이 강하므로, 한국어로는 '교훈'이 가장 자연스럽게 그 폭을 담습니다.
- source_word: קְצִינֵי סְדֹם / עַם עֲמֹרָה
  english_pob_choice: rulers of Sodom / people of Gomorrah
  chosen_korean: 소돔의 지도자들아 / 고모라의 백성아
  alternatives_korean:
  - 소돔의 통치자들아 / 고모라의 사람들아
  - 소돔의 관원들아 / 고모라의 백성들아
  lexicon: HALOT
  rationale: 히브리어의 호격을 그대로 살려 수사적 충격을 유지했습니다. קְצִינֵי는 '지도자들'이 한국어에서 가장 자연스럽고, עַם은 집단을 부르는 호격으로 '백성'이 적절합니다.
theological_decisions:
- issue: 소돔과 고모라에 대한 비유적 호칭의 처리
  chosen_reading: 본문은 유다의 지도층과 백성을 '소돔의 지도자들', '고모라의 백성'으로 직접 호칭하는 형태를 유지했습니다.
  alternative_readings:
  - '''소돔 같은 지도자들''과 같이 비교를 풀어 쓰는 방식'
  rationale: 히브리어는 비교를 설명문으로 풀지 않고 도시 이름을 호격으로 사용해 예언적 책망의 충격을 줍니다. 번역에서도 그 직접성을 보존하는 것이 원문 효과를 가장 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve prophetic rhetoric without paraphrase.'
