id: ISA.1.4
reference: Isaiah 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
  footnotes:
  - marker: a
    text: Or 'Woe, sinful nation' or 'Alas, sinful nation.' The Hebrew interjection can express both lament and denunciation.
    reason: lexical_alternative
  - marker: b
    text: Or 'a people laden with iniquity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'children who deal corruptly.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
  - marker: e
    text: Or 'they have turned their backs' or 'they have become estranged and gone backward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 죄 많은 나라여, 불의가 무거운 백성이여, 악을 행하는 자들의 자손이여, 부패하게 행동하는 자녀들이여! 그들은 야훼를 버렸고, 이스라엘의 거룩하신 이를 멸시하였으며, 뒤로 물러섰습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬프다, 죄 많은 나라여’ 혹은 ‘화 있을진저, 죄 많은 나라여’로도 옮길 수 있습니다. 히브리어 감탄사는 탄식과 질책을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불의가 짐진 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부패하게 행동하는 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘야훼’는 신적 이름 YHWH를 가리킵니다.
    reason: alternative_reading
  - marker: e
    text: 또는 ‘뒤로 돌아섰습니다’ 혹은 ‘등을 돌렸습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 슬프다
  - 화 있을진저
  lexicon: HALOT
  rationale: 감탄사 הוֹי의 탄식과 질책을 함께 살리기 위해 한국어의 짧은 감탄형 ‘아’를 택했습니다.
- source_word: גּוֹי חֹטֵא
  english_pob_choice: sinful nation
  chosen_korean: 죄 많은 나라
  alternatives_korean:
  - 죄를 짓는 나라
  - 죄악한 나라
  lexicon: HALOT
  rationale: ‘nation’의 공동체적 비난을 살리면서, participle의 성격을 자연스러운 형용구로 풀었습니다.
- source_word: עַם כֶּבֶד עָוֺן
  english_pob_choice: a people heavy with iniquity
  chosen_korean: 불의가 무거운 백성
  alternatives_korean:
  - 죄악이 짐진 백성
  - 불의에 짓눌린 백성
  lexicon: HALOT
  rationale: ‘무거운’의 비유를 직접 살려 도덕적 부패가 백성 위에 짐처럼 얹혀 있음을 보이게 했습니다.
- source_word: זֶרַע מְרֵעִים / בָּנִים מַשְׁחִיתִים
  english_pob_choice: offspring of evildoers / children who act corruptly
  chosen_korean: 악을 행하는 자들의 자손 / 부패하게 행동하는 자녀들
  alternatives_korean:
  - 악인들의 후손 / 타락한 자녀들
  - 악행하는 자들의 씨 / 패괴한 자녀들
  lexicon: HALOT
  rationale: 두 병렬 구절의 가족·혈통 이미지를 보존하면서, 행동 묘사도 함께 드러나도록 직역과 자연어를 절충했습니다.
- source_word: עָזְבוּ אֶת יְהוָה
  english_pob_choice: They have forsaken Yahweh
  chosen_korean: 그들은 야훼를 버렸고
  alternatives_korean:
  - 그들은 야훼를 떠났고
  - 그들은 야훼를 저버렸고
  lexicon: HALOT
  rationale: 동사 עזב의 핵심 의미인 ‘버리다/떠나다’를 살리되, 언약 파기의 뉘앙스가 강한 ‘버리다’를 선택했습니다.
- source_word: נִאֲצוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵל
  english_pob_choice: they have despised the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이를 멸시하였으며
  alternatives_korean:
  - 이스라엘의 거룩하신 이를 업신여겼으며
  - 이스라엘의 거룩하신 이를 경멸하였으며
  lexicon: HALOT
  rationale: ישע야서의 고유한 칭호를 보존하면서, נָאַץ의 강한 경멸을 ‘멸시하다’로 옮겼습니다.
- source_word: נָזֹרוּ אָחוֹר
  english_pob_choice: they have turned backward
  chosen_korean: 뒤로 물러섰습니다
  alternatives_korean:
  - 뒤로 돌아섰습니다
  - 등을 돌렸습니다
  lexicon: HALOT
  rationale: ‘backward/back’의 방향성을 살리되, 한국어에서 자연스러운 종결 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명사표를 직역 관습보다 이름 자체의 보존에 맞추어 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 공동체적·가족적 비난의 병렬성
  chosen_reading: 나라 / 백성 / 자손 / 자녀를 모두 유지
  alternative_readings:
  - 하나의 집단명으로 평탄화
  - 혈통 이미지만 남기기
  rationale: 본문이 이스라엘의 국가성과 가족성 이미지를 겹쳐 죄책을 강화하므로, 그 중첩을 그대로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
