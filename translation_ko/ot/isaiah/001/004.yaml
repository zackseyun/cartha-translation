  source_fidelity: 핵심 병렬 구조와 야훼, 이스라엘의 거룩하신 이라는 칭호는 대체로 충실합니다. 그러나 עַם כֶּבֶד עָוֺן은 ‘불의가 무거운’보다 백성이 죄악을 무겁게 지닌다는 뜻으로 옮기는 편이 정확합니다. 또한 נָזֹרוּ אָחוֹר는 단순한 후퇴인 ‘뒤로 물러섰습니다’보다 관계적 이반과 뒤돌아감을 드러내야 합니다.
