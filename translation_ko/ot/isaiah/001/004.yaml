- source_word: זֶרַע מְרֵעִים / בָּנִים מַשְׁחִיתִים
  english_pob_choice: offspring of evildoers / children who act corruptly
  chosen_korean: 악을 행하는 자들의 자손 / 부패하게 행동하는 자녀들
  alternatives_korean:
  - 악인들의 후손 / 타락한 자녀들
  - 악행하는 자들의 씨 / 패괴한 자녀들
  lexicon: HALOT
  rationale: 두 병렬 구절의 가족·혈통 이미지를 보존하면서, 행동 묘사도 함께 드러나도록 직역과 자연어를 절충했습니다.
- source_word: עָזְבוּ אֶת יְהוָה
  english_pob_choice: They have forsaken Yahweh
  chosen_korean: 그들은 야훼를 버렸고
  alternatives_korean:
  - 그들은 야훼를 떠났고
  - 그들은 야훼를 저버렸고
  lexicon: HALOT
  rationale: 동사 עזב의 핵심 의미인 ‘버리다/떠나다’를 살리되, 언약 파기의 뉘앙스가 강한 ‘버리다’를 선택했습니다.
- source_word: נִאֲצוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵל
  english_pob_choice: they have despised the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이를 멸시하였으며
  alternatives_korean:
  - 이스라엘의 거룩하신 이를 업신여겼으며
  - 이스라엘의 거룩하신 이를 경멸하였으며
  lexicon: HALOT
  rationale: ישע야서의 고유한 칭호를 보존하면서, נָאַץ의 강한 경멸을 ‘멸시하다’로 옮겼습니다.
