    issue: ‘아주 작은 남은 자’라는 표현
    rationale: כִּמְעָט은 여기서 남은 자의 수가 극히 적음을 가리키므로, 표준 한국어에서는 ‘아주 적은 남은 자’가 더 자연스럽습니다.
