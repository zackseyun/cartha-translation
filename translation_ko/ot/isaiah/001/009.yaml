translation:
  language: ko
  text: 만군의 야훼께서 우리에게 아주 적은 남은 자를 남겨 두지 않으셨더라면[a], 우리는 소돔처럼 되었을 것이며, 고모라와 같았을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 야훼께서 우리를 위하여 몇 사람의 생존자를 보존하지 않으셨더라면.’
    reason: ‘남겨 두다’(הוֹתִיר)와 집합적으로 쓰인 ‘남은 자’(שָׂרִיד)에 대한 어휘적 대안입니다.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주님
  lexicon: HALOT
  rationale: YHWH는 POB의 기준에 따라 고유명사로서 ‘야훼’로 옮기고, צְבָאוֹת는 군대/천상의 군대를 포괄하는 관용적 칭호이므로 전통적인 ‘만군의’로 살렸습니다.
- source_word: הוֹתִיר
  english_pob_choice: had not left
  chosen_korean: 남겨 두지 않으셨다면
  alternatives_korean:
  - 보존하지 않으셨다면
  - 남겨 두지 않으셨더라면
  lexicon: HALOT
  rationale: Hiphil의 ‘남겨 두다/남기다’ 의미를 살리되, 문맥상 남은 자를 남겨 두시는 행위를 자연스러운 한국어로 표현했습니다.
- source_word: שָׂרִיד כִּמְעָט
  english_pob_choice: a very small remnant
  chosen_korean: 아주 작은 남은 자
  alternatives_korean:
  - 매우 적은 남은 자
  - 겨우 조금 남은 자
  lexicon: HALOT
  rationale: 예언서의 남은 자 어휘를 보존하기 위해 ‘남은 자’를 택했고, כִּמְעָט의 소량성을 ‘아주 작은’으로 반영했습니다.
- source_word: דָּמִינוּ
  english_pob_choice: we would have resembled
  chosen_korean: 같아졌을 것이고
  alternatives_korean:
  - 닮았을 것이고
  - 비슷해졌을 것이고
  lexicon: HALOT
  rationale: דָּמָה의 비교/유사 의미를 한국어의 ‘같아지다’로 자연스럽게 옮겨, 앞의 הָיִינוּ와 구별되는 평행 구조를 살렸습니다.
theological_decisions:
- issue: 남은 자(remnant) 표현의 보존
  chosen_reading: ‘남은 자’라는 예언적 표지를 유지했습니다.
  alternative_readings:
  - ‘살아남은 사람들’
  - ‘극소수의 생존자’
  rationale: 이 절은 역사적 사실 진술을 넘어 심판 속 보존이라는 예언서의 핵심 주제를 담으므로, 단순한 생존자보다 ‘남은 자’가 본문이 지닌 신학적·문학적 기능을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #1 and #5'
