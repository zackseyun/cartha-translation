    issue: דָּמִינוּ를 ‘같아졌을 것이고’로 번역함
    rationale: 이 표현은 앞 절의 הָיִינוּ에 대응한 ‘같아졌을’과 사실상 동일하여 동사의 평행 변주를 평준화합니다. ‘고모라와 같았을 것입니다’는 ‘닮다/같다’의 뜻을 자연스럽게 보존합니다.
