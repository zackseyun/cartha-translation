id: ISA.1.22
reference: Isaiah 1:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּסְפֵּ֖/ךְ הָיָ֣ה לְ/סִיגִ֑ים סָבְאֵ֖/ךְ מָה֥וּל בַּ/מָּֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/022.yaml
  text: Your silver has become dross[a]; your wine is diluted with water.
  footnotes:
  - marker: a
    text: Or 'your wine is mixed with water.' The Hebrew term can refer more specifically to wine or strong drink.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 은은 찌꺼기가 되었고, 네 술은 물로 섞였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 포도주”로도 옮길 수 있습니다. 히브리어 סָבְא는 술, 특히 포도주나 독한 술을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפֵּךְ
  english_pob_choice: your silver
  chosen_korean: 네 은
  alternatives_korean:
  - 네 은화
  - 네 돈
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 은을 뜻하며, 예언적 은유에서 금속 자체를 살리는 것이 '찌꺼기'와의 대비를 가장 분명하게 드러냅니다. 2인칭 여성 단수 어미는 '네'로 반영했습니다.
- source_word: לְסִיגִים
  english_pob_choice: dross
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 드로스
  - 불순물
  - 슬래그
  lexicon: HALOT
  rationale: סִיגִים은 제련 뒤 남는 불순한 찌꺼기를 가리키며, 한국어에서는 '찌꺼기'가 짧고 자연스러우면서도 심판의 부패 이미지를 잘 전달합니다.
- source_word: סָבְאֵךְ
  english_pob_choice: your wine
  chosen_korean: 네 술
  alternatives_korean:
  - 네 포도주
  - 네 음료
  - 네 독주
  lexicon: HALOT
  rationale: סָבְאֵךְ는 문맥상 술, 특히 포도주나 독한 술을 가리킬 수 있으나 정확한 종류가 단정되지 않으므로, 원문의 넓은 어휘 범위를 살려 '술'로 옮겼습니다.
- source_word: מָהוּל בַּמָּיִם
  english_pob_choice: diluted with water
  chosen_korean: 물로 섞였습니다
  alternatives_korean:
  - 물에 타졌습니다
  - 물로 희석되었습니다
  - 물과 섞였습니다
  lexicon: HALOT
  rationale: מָהוּל은 섞이거나 희석된 상태를 뜻하며, בַּמָּיִם은 도구/수단을 나타내어 '물로 섞였습니다'가 가장 자연스럽고 직접적입니다.
theological_decisions:
- issue: 예언적 고발의 비유를 현대 한국어로 얼마나 직설적으로 살릴지
  chosen_reading: 금속 정련과 술의 희석이라는 두 이미지를 그대로 유지해, 타락과 가치 훼손의 고발을 약화하지 않았습니다.
  alternative_readings:
  - '''네 은은 불순물이 되었습니다''처럼 완곡하게 처리'
  - '''네 술은 물로 희석되었습니다''처럼 설명적으로 처리'
  rationale: 본문의 메시지는 윤리적 타락을 감각적으로 드러내는 데 있으므로, 은유를 유지하는 편이 원문 의도를 더 분명하게 전달합니다.
  doctrine_reference: 예언서의 상징적 책망 표현
