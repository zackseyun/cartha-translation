  source_fidelity: 첫 행의 סִיגִים은 금속 제련에서 생기는 불순물/쇠찌꺼기를 가리킵니다. 일반적인 ‘찌꺼기’도 비유의 큰 뜻은 전달하지만 금속 제련의 구체적인 이미지를 약화합니다. 둘째 행의 סָבְאֵךְ는 술(포도주 또는 독한 술)을 가리킬 수 있으므로 ‘네 술’은 범위를 보존합니다. מָהוּל בַּמָּיִם은 물을 타서 희석된 상태이므로 ‘물로 희석되었습니다’가 더 정확합니다.
  naturalness: ‘네 은’과 ‘네 술’은 예언서의 직접 호격에 자연스럽고, ‘되었습니다’ 종결은 현대의 격식 있는 합쇼체에 맞습니다. ‘물로 섞였습니다’는 의미상 가능하지만, 술에 물을 타 품질을 떨어뜨린다는 고발의 뉘앙스에는 ‘물로 희석되었습니다’가 더 자연스럽고 분명합니다.
