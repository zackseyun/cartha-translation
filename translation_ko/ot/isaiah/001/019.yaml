id: ISA.1.19
reference: Isaiah 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם תֹּאב֖וּ וּ/שְׁמַעְתֶּ֑ם ט֥וּב הָ/אָ֖רֶץ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
  footnotes:
  - marker: a
    text: Or 'If you are willing and listen,' with 'listen' carrying the sense of obedient response.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 너희가 기꺼이 순종하면, 땅의 좋은 소산을 먹게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기꺼이 듣고”로 옮길 수 있으며, 여기서 '듣다'는 순종의 응답을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - if
  - 만약
  lexicon: HALOT
  rationale: 조건을 여는 히브리어 אם을 한국어 조건 부사절로 자연스럽게 옮겼습니다.
- source_word: תֹּאבוּ
  english_pob_choice: you are willing
  chosen_korean: 기꺼이
  alternatives_korean:
  - 원하면
  - 자원하면
  - 뜻을 두면
  lexicon: HALOT
  rationale: אבה의 자원적·의지적 성격을 살려, 단순한 감정이 아니라 자발적 수용을 나타내는 표현으로 옮겼습니다.
- source_word: וּשְׁמַעְתֶּם
  english_pob_choice: and obedient
  chosen_korean: 순종하면
  alternatives_korean:
  - 듣고
  - 들으면
  - 복종하면
  lexicon: HALOT
  rationale: שמע가 여기서는 단순 청취가 아니라 언약적 응답과 순종을 뜻하므로, 한국어에서 그 의미를 가장 직접적으로 드러내는 '순종하다'를 택했습니다.
- source_word: טוּב הָאָרֶץ
  english_pob_choice: the good of the land
  chosen_korean: 땅의 좋은 소산
  alternatives_korean:
  - 땅의 좋은 것
  - 그 땅의 좋은 것
  - 땅의 풍성한 소출
  lexicon: HALOT
  rationale: 직역하면 '땅의 좋음'이지만, 문맥상 땅이 주는 풍요와 산물을 가리키므로 한국어에서 이해되기 쉬운 '좋은 소산'으로 옮겼습니다.
theological_decisions:
- issue: שמע를 '듣다'가 아니라 순종으로 옮길지 여부
  chosen_reading: 순종하면
  alternative_readings:
  - 듣고
  - 들으면
  - 순종하고 들으면
  rationale: 문맥이 단순한 청취가 아니라 언약적 응답의 성격을 가지므로, '듣다'보다 '순종하다'가 독자가 본문의 요구를 오해하지 않게 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
