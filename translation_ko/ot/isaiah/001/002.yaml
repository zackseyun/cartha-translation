id: ISA.1.2
reference: Isaiah 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
  footnotes:
  - marker: a
    text: Or “sons.” The Hebrew is masculine plural, but here it refers corporately to the people as the LORD’s offspring.
    reason: lexical_alternative
  - marker: b
    text: Or “I reared children and brought them up.” The second verb can also be rendered more generally as “lifted up” or “made great”; here it is translated to preserve the sense of honor or elevation in addition to upbringing.
    reason: lexical_alternative
translation:
  language: ko
  text: '하늘이여, 들으십시오. 땅이여, 귀를 기울이십시오. 야훼께서 말씀하셨습니다: “내가 자녀들[a]을 길러 높였으나[b], 그들이 나를 거역하였습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아들들”. 히브리어는 남성 복수형이지만, 여기서는 야훼의 자녀인 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “크게 하였다” 또는 “들어 높였다”. 둘째 동사는 더 일반적으로 높이거나 존귀하게 하는 뜻도 지니며, 여기서는 양육의 의미와 함께 그 의미를 살려 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ / הַאֲזִינִי
  english_pob_choice: Hear / give ear
  chosen_korean: 들으십시오 / 귀를 기울이십시오
  alternatives_korean:
  - 들으십시오 / 들으십시오
  - 귀를 기울이십시오 / 들으십시오
  - 들어 주십시오 / 경청하십시오
  lexicon: HALOT
  rationale: 두 명령형의 평행 구조를 살리면서, 첫 동사는 포괄적 청취를, երկրորդ 동사는 더 강한 주의집중을 자연스러운 한국어로 구분했습니다.
- source_word: שָׁמַיִם / אֶרֶץ
  english_pob_choice: O heavens / O earth
  chosen_korean: 하늘들이여 / 땅이여
  alternatives_korean:
  - 하늘이여 / 땅이여
  - 하늘들이여 / 땅이여
  - 하늘들아 / 땅아
  lexicon: HALOT
  rationale: 우주적 증언 소환의 병행법을 살리기 위해 호격을 유지했습니다. שָׁמַיִם의 복수성을 반영해 ‘하늘들이여’를 택했습니다.
- source_word: בָּנִים
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 아들들
  - 자식들
  lexicon: HALOT
  rationale: 형태는 남성 복수지만 가리키는 대상은 공동체 전체이므로, 남성성만 드러내는 ‘아들들’보다 관계적·공동체적 의미를 살린 ‘자녀들’이 더 정확합니다.
- source_word: גִּדַּלְתִּי וְ/רוֹמַמְתִּי
  english_pob_choice: I have reared children and brought them up
  chosen_korean: 자녀들을 길렀고 높여 세웠으나
  alternatives_korean:
  - 자녀들을 양육했고 키웠으나
  - 자녀들을 길렀고 성장시켰으나
  - 자녀들을 길렀고 크게 하였으나
  lexicon: HALOT
  rationale: 첫 동사는 양육·성장을, 둘째 동사는 단순 반복이 아니라 ‘높이 들다/높이다’의 추가 의미를 살려 ‘높여 세우다’로 옮겼습니다. POB의 최종 선택인 육아적 표현을 반영하되, רומם의 상승/존귀 의미를 소거하지 않았습니다.
- source_word: פָּשְׁעוּ בִי
  english_pob_choice: have rebelled against me
  chosen_korean: 나에게 반역하였습니다
  alternatives_korean:
  - 나를 거역하였습니다
  - 나에게 반역했습니다
  - 내게 패역하였습니다
  lexicon: HALOT
  rationale: פָּשַׁע는 단순 위반보다 권위에 대한 반역·배반의 뉘앙스가 강해, 예언자적·언약적 충돌을 드러내는 ‘반역하다’가 적절합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사표를 제목어로 대체하지 않고 고유명으로 드러내어, 이사야의 언약적 책망이 누구의 발언인지 분명하게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 자녀들에 대한 집합적 호칭
  chosen_reading: 자녀들
  alternative_readings:
  - 아들들
  - 아이들
  rationale: 문맥상 남성 개별 자녀가 아니라 언약 백성 전체를 가리키므로, 성별을 좁히지 않으면서도 친자 관계의 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
