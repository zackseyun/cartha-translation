  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נוֹתְרָ֥ה בַת צִיּ֖וֹן כְּ/סֻכָּ֣ה בְ/כָ֑רֶם כִּ/מְלוּנָ֥ה בְ/מִקְשָׁ֖ה כְּ/עִ֥יר נְצוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
  footnotes:
  - marker: a
    text: Or 'melon field' or 'field of gourds'; the Hebrew term may refer more broadly to a cultivated patch of cucumbers or similar vine crops.
    reason: lexical_alternative
  - marker: b
    text: Or 'the daughter of Zion.' The Hebrew expression personifies Zion/Jerusalem as a daughter.
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'like a guarded city,' though 'besieged city' best fits the context.
    reason: alternative_reading
translation:
  language: ko
  text: 딸 시온[b]은 포도원의 초막처럼, 오이밭[a]의 오두막처럼, 포위된[c] 성읍처럼 남아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멜론밭’ 또는 ‘박과 채소밭’. 히브리어는 오이와 비슷한 덩굴 작물의 재배지를 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시온의 딸’. 히브리어 표현은 시온/예루살렘을 딸로 의인화합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘지켜진 성읍’으로도 볼 수 있지만, 문맥에는 ‘포위된 성읍’이 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  english_pob_choice: And ... is left
  chosen_korean: 남아 있습니다
  alternatives_korean:
  - 남겨져 있습니다
  - 남았습니다
  lexicon: HALOT
  rationale: נ־ת־ר의 수동/니팔 의미를 살려, 심판 뒤에 ‘겨우 남은 상태’를 자연스럽게 나타내는 현대 한국어로 옮겼습니다.
- source_word: בַת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온
  alternatives_korean:
  - 시온의 딸
  - 딸 시온
  lexicon: HALOT
  rationale: 시온을 인격화한 관용적 표현을 보존하기 위해 직역에 가깝게 옮겼고, 본문 흐름상 ‘딸 시온’이 가장 간결합니다.
- source_word: כְּסֻכָּה בְכָרֶם
  english_pob_choice: like a shelter in a vineyard
  chosen_korean: 포도원 안의 초막처럼
  alternatives_korean:
  - 포도밭의 초막처럼
  - 포도원 속의 작은 초막처럼
  lexicon: HALOT
  rationale: סֻכָּה는 임시 거처인 ‘초막’이 핵심이므로 기능보다 형상을 살렸고, בְכָרֶם은 일반적인 ‘포도원’으로 옮겼습니다.
- source_word: כִּמְלוּנָה בְמִקְשָׁה
  english_pob_choice: like a hut in a cucumber field
  chosen_korean: 오이밭의 오두막처럼
  alternatives_korean:
  - 오이밭의 초막처럼
  - 박과 채소밭의 오두막처럼
  lexicon: HALOT
  rationale: מְלוּנָה의 임시 숙소 느낌을 한국어의 ‘오두막’으로 자연스럽게 살렸고, מִקְשָׁה는 POB의 기준을 따라 구체적으로 ‘오이밭’으로 옮겼습니다.
- source_word: כְּעִיר נְצוּרָה
  english_pob_choice: like a besieged city
  chosen_korean: 포위된 성읍처럼
  alternatives_korean:
  - 에워싸인 성읍처럼
  - 포위당한 성읍처럼
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘지켜진 성읍’보다 공격을 받아 둘러싸인 상태가 더 적절하므로 ‘포위된’으로 옮겼습니다.
theological_decisions:
- issue: 시온의 인격화 표현 유지
  chosen_reading: 본문의 ‘딸 시온’을 주석적 치환 없이 그대로 보존했습니다.
  alternative_readings:
  - 예루살렘
  - 시온 백성
  rationale: 예언서의 시적·신학적 인격화가 본문 의미의 일부이므로, 해석을 본문에 앞세우지 않고 원문 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve prophetic personification without flattening it into a geographical label.'
