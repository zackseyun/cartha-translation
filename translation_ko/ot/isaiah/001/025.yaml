id: ISA.1.25
reference: Isaiah 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה יָדִ/י֙ עָלַ֔יִ/ךְ וְ/אֶצְרֹ֥ף כַּ/בֹּ֖ר סִיגָ֑יִ/ךְ וְ/אָסִ֖ירָה כָּל בְּדִילָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
  footnotes:
  - marker: a
    text: Or 'upon you'; the Hebrew idiom 'turn my hand upon/against' can introduce either punitive action or purifying intervention. Here the refining imagery suggests judgment with a cleansing purpose.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'lye' refers to an alkali used in cleansing or refining; some render 'with alkali' or 'like soap.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your tin' or 'your base metals'; the Hebrew may refer specifically to tin or more generally to inferior metal mixed into an alloy.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 손을 너희에게로 돌리고, 너희의 찌꺼기를 잿물처럼 녹여 내며, 너희의 모든 불순물을 제거하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희에게로’는 히브리어 관용구 ‘손을 너희 위에/너희에게로 돌리다’를 살린 번역입니다. 문맥상 징계와 정화의 의미가 함께 있습니다.
    reason: source_note
  - marker: b
    text: ‘잿물’은 히브리어 בֹּר의 세정·정련 물질을 현대 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘불순물’은 히브리어 בְּדִיל의 뜻을 문맥에 따라 더 넓게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה יָדִי
  english_pob_choice: I will turn my hand
  chosen_korean: 내가 내 손을 돌리고
  alternatives_korean:
  - 내가 내 손을 펴고
  - 내가 내 손을 향하게 하고
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살려 하나님의 행위를 문자적으로 ‘손’을 통해 표현하되, 심판적 행동의 방향 전환을 자연스럽게 드러냈습니다.
- source_word: עָלַיִךְ
  english_pob_choice: against you
  chosen_korean: 너희에게로
  alternatives_korean:
  - 너희를 향해
  - 너희에게
  lexicon: HALOT
  rationale: 문맥상 심판과 정련이 함께 있는 구절이므로, 영어 POB의 ‘against’가 드러내는 긴장을 한국어에서는 ‘~에게로 돌리다’로 옮겨 적대적이면서도 정련적 의미를 함께 살렸습니다.
- source_word: וְאֶצְרֹף כַּבֹּר סִיגָיִךְ
  english_pob_choice: I will smelt away your dross as with lye
  chosen_korean: 너희의 찌꺼기를 잿물처럼 녹여 내며
  alternatives_korean:
  - 너희의 찌꺼기를 가성재처럼 녹여 내며
  - 너희의 찌꺼기를 비누처럼 씻어 내며
  lexicon: HALOT
  rationale: צרף의 제련 이미지를 ‘녹여 내다’로 살리고, בֹּר의 세정·정련 물질을 현대어 ‘잿물’로 옮겨 비교어 ‘처럼’을 유지했습니다.
- source_word: וְאָסִירָה כָּל בְּדִילָיִךְ
  english_pob_choice: and remove all your alloy
  chosen_korean: 너희의 모든 불순물을 제거하겠습니다
  alternatives_korean:
  - 너희의 모든 납땜 금속을 제거하겠습니다
  - 너희의 모든 주석을 제거하겠습니다
  lexicon: HALOT
  rationale: בְּדִיל은 문맥상 귀금속을 더럽히는 혼합 금속 일반을 가리킬 수 있어, 영어 POB의 ‘alloy’를 따라 ‘불순물’로 풀어 정련 문맥을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 손을 ‘돌리심’의 의미
  chosen_reading: 징계적 심판과 정화적 정련이 함께 있는 행동으로 읽습니다.
  alternative_readings:
  - 순전히 파괴적인 심판
  - 순전히 부드러운 회복
  rationale: 본문은 ‘내 손을 너희에게로 돌리다’와 정련 이미지를 함께 사용하므로, 한쪽으로만 완화하거나 극단화하지 않고 두 의미를 모두 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
