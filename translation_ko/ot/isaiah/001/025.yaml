  lexicon: HALOT
  rationale: 히브리어의 관용구를 살려 하나님의 행위를 문자적으로 ‘손’을 통해 표현하되, 심판적 행동의 방향 전환을 자연스럽게 드러냈습니다.
- source_word: עָלַיִךְ
  english_pob_choice: against you
  chosen_korean: 너희에게로
  alternatives_korean:
  - 너희를 향해
  - 너희에게
  lexicon: HALOT
  rationale: 문맥상 심판과 정련이 함께 있는 구절이므로, 영어 POB의 ‘against’가 드러내는 긴장을 한국어에서는 ‘~에게로 돌리다’로 옮겨 적대적이면서도 정련적 의미를 함께 살렸습니다.
- source_word: וְאֶצְרֹף כַּבֹּר סִיגָיִךְ
  english_pob_choice: I will smelt away your dross as with lye
  chosen_korean: 너희의 찌꺼기를 잿물처럼 녹여 내며
