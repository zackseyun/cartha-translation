  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה יָדִ/י֙ עָלַ֔יִ/ךְ וְ/אֶצְרֹ֥ף כַּ/בֹּ֖ר סִיגָ֑יִ/ךְ וְ/אָסִ֖ירָה כָּל בְּדִילָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
  footnotes:
  - marker: a
    text: Or 'upon you'; the Hebrew idiom 'turn my hand upon/against' can introduce either punitive action or purifying intervention. Here the refining imagery suggests judgment with a cleansing purpose.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'lye' refers to an alkali used in cleansing or refining; some render 'with alkali' or 'like soap.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your tin' or 'your base metals'; the Hebrew may refer specifically to tin or more generally to inferior metal mixed into an alloy.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 손을 너를 거슬러 돌려,[a] 잿물로 하듯 네 찌꺼기를 정련하여 없애고,[b] 네 모든 불순한 금속을 제거하겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 손을 네 위에/너를 향하여 돌려’입니다. 이 히브리어 관용구는 징계하거나 대적하는 행동을 나타낼 수 있으며, 여기서는 뒤따르는 정련의 이미지가 정화의 목적도 함께 보여 줍니다.
    reason: source_note
  - marker: b
    text: ‘잿물’(히브리어 בֹּר)은 세정이나 정련에 쓰는 알칼리성 물질을 가리킵니다. ‘알칼리’ 또는 ‘비누’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 בְּדִיל은 ‘주석’을 뜻할 수도 있고, 금속에 섞인 열등한 혼합 금속을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה יָדִי
  english_pob_choice: I will turn my hand
  chosen_korean: 내가 내 손을 돌리고
  alternatives_korean:
