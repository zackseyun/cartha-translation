  lexicon: HALOT
  rationale: צרף의 제련 이미지를 ‘녹여 내다’로 살리고, בֹּר의 세정·정련 물질을 현대어 ‘잿물’로 옮겨 비교어 ‘처럼’을 유지했습니다.
- source_word: וְאָסִירָה כָּל בְּדִילָיִךְ
  english_pob_choice: and remove all your alloy
  chosen_korean: 너희의 모든 불순물을 제거하겠습니다
  alternatives_korean:
  - 너희의 모든 납땜 금속을 제거하겠습니다
  - 너희의 모든 주석을 제거하겠습니다
  lexicon: HALOT
  rationale: בְּדִיל은 문맥상 귀금속을 더럽히는 혼합 금속 일반을 가리킬 수 있어, 영어 POB의 ‘alloy’를 따라 ‘불순물’로 풀어 정련 문맥을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 손을 ‘돌리심’의 의미
  chosen_reading: 징계적 심판과 정화적 정련이 함께 있는 행동으로 읽습니다.
  alternative_readings:
  - 순전히 파괴적인 심판
  - 순전히 부드러운 회복
  rationale: 본문은 ‘내 손을 너희에게로 돌리다’와 정련 이미지를 함께 사용하므로, 한쪽으로만 완화하거나 극단화하지 않고 두 의미를 모두 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
