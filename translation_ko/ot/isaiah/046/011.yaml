id: ISA.46.11
reference: Isaiah 46:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֹרֵ֤א מִ/מִּזְרָח֙ עַ֔יִט מֵ/אֶ֥רֶץ מֶרְחָ֖ק אִ֣ישׁ עצת/ו אַף דִּבַּ֨רְתִּי֙ אַף אֲבִיאֶ֔/נָּה יָצַ֖רְתִּי אַף אֶעֱשֶֽׂ/נָּה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/011.yaml
  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
  footnotes:
  - marker: a
    text: Or 'the man of my counsel.'
    reason: lexical_alternative
  - marker: b
    text: The figure called from the east is often understood to be Cyrus in the larger context, but he is not named in this verse.
    reason: cross_reference
translation:
  language: ko
  text: 동쪽에서 맹금 한 마리를, 먼 땅에서 내 뜻을 이루는 사람을 불러오고 있습니다. 참으로 내가 말하였습니다. 참으로 내가 그것을 이루겠습니다. 내가 그것을 지었으니, 참으로 내가 그것을 행하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 동쪽에서 불러오는 인물은 넓은 문맥에서는 흔히 고레스와 연결되지만, 이 절 자체에서는 이름이 나오지 않습니다.
    reason: cross_reference
  - marker: b
    text: 여기서의 ‘지었다’는 단순한 물리적 제작보다 하나님이 정하신 계획의 형성을 함께 드러냅니다.
    reason: theological_note
lexical_decisions:
- source_word: קֹרֵא / מִמִּזְרָח / עַיִט
  english_pob_choice: calling from the east a bird of prey
  chosen_korean: 동쪽에서 맹금 한 마리를 불러오고 있습니다
  alternatives_korean:
  - 동쪽에서 사나운 새 한 마리를 불러오고 있습니다
  - 동쪽에서 포식하는 새 한 마리를 부르고 있습니다
  lexicon: HALOT
  rationale: קורא의 진행형적 참여형을 한국어 현재 진행으로 살리고, עַיִט은 특정 종명보다 ‘맹금’으로 옮겨 새의 포식 이미지를 간결하게 전달했습니다.
- source_word: אִישׁ עֲצָתוֹ
  english_pob_choice: the man of my purpose
  chosen_korean: 내 뜻을 이루는 사람
  alternatives_korean:
  - 내 계획의 사람
  - 내 모략의 사람
  lexicon: HALOT
  rationale: עֵצָה/עֲצָתוֹ는 단순 조언보다 하나님의 계획·뜻을 가리키므로, 문맥상 더 자연스러운 ‘내 뜻을 이루는 사람’으로 옮겼습니다.
- source_word: אַף אַבִיאֶנָּה / אַף אֶעֱשֶׂנָּה
  english_pob_choice: indeed, I will bring it to pass... indeed, I will do it
  chosen_korean: 참으로 내가 그것을 이루겠습니다 ... 참으로 내가 그것을 행하겠습니다
  alternatives_korean:
  - 반드시 내가 그것을 이루겠습니다 ... 반드시 내가 그것을 하겠습니다
  - 정녕 내가 그것을 성취하겠습니다 ... 정녕 내가 그것을 하겠습니다
  lexicon: HALOT
  rationale: 반복되는 אַף의 강조를 ‘참으로’로 일관되게 살려, 단순 추가가 아니라 확증과 단호함의 어조를 유지했습니다.
- source_word: יָצַרְתִּי
  english_pob_choice: I have formed it
  chosen_korean: 내가 그것을 지었으니
  alternatives_korean:
  - 내가 그것을 형성하였으니
  - 내가 그것을 빚었으니
  lexicon: HALOT
  rationale: יָצַר의 기본 의미는 ‘짓다/빚다/형성하다’이지만, 예언 문맥에서 하나님의 주권적 계획 형성을 자연스럽게 드러내는 ‘지었다’가 한국어로 가장 응축됩니다.
theological_decisions:
- issue: 동쪽에서 불러오는 대상의 식별
  chosen_reading: 본문의 은유를 그대로 유지하고, मुख्य متن에서는 특정 인물을 이름 붙이지 않습니다.
  alternative_readings:
  - 고레스에 대한 암시로 명시하기
  - 하나님이 사용하시는 일반적 도구로만 이해하기
  rationale: 히브리어 본문은 여기서 이름을 제시하지 않고 상징적 표현을 사용하므로, 번역문이 해석을 선취하기보다 이미지 자체를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘그것’의 지시 대상
  chosen_reading: 보이지 않는 목적/계획을 가리키는 중성적 ‘그것’을 사용합니다.
  alternative_readings:
  - 그 사람을 가리키는 ‘그를’
  - 예고된 사건을 가리키는 ‘이 일을’
  rationale: 여성형 접미사는 직접적으로 ‘사람’이 아니라 내포된 계획·뜻·일을 가리키는 것으로 보는 것이 자연스럽고, 한국어에서는 ‘그것’이 가장 무리 없습니다.
  doctrine_reference: Translation philosophy §3
