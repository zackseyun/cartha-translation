id: ISA.46.1
reference: Isaiah 46:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
  footnotes:
  - marker: a
    text: Or 'their images.' The Hebrew term can denote fashioned images, but in this prophetic context it refers polemically to idols.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of 'your loads are borne' is difficult; it likely refers to the idol-images being carried as cargo in procession or transport.
    reason: lexical_alternative
  - marker: c
    text: Or 'a burden for the exhausted beast.' The final phrase may point specifically to the weariness of the animal carrying the idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨은 엎드러지고 느보는 몸을 굽힙니다. 그들의 우상들은 짐승과 가축 위에 실려 있습니다.[a] 너희가 메고 가던 것들은 지친 자에게 무거운 짐으로 실려 있습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 형상들’. 히브리어 낱말은 만들어 낸 형상을 뜻할 수 있으나, 이 예언적 문맥에서는 우상을 가리키는 폄하적 표현으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희가 메고 가던 것들은 … 실려 있습니다’에 해당하는 히브리어는 난해합니다. 이는 우상 형상들이 행렬이나 운송 중에 화물처럼 실려 가는 모습을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘지친 짐승에게 무거운 짐으로’. 마지막 구절은 우상을 나르는 동물의 피로를 특별히 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  english_pob_choice: bows down
  chosen_korean: 엎드러지고
  alternatives_korean:
  - 무릎을 꿇고
  - 굽어지고
  lexicon: HALOT
  rationale: 무너져 내리는 굴욕의 동작을 한국어로 자연스럽게 살리면서, 예언적 현재의 생생함을 유지합니다.
- source_word: קֹרֵס
  english_pob_choice: stoops
  chosen_korean: 주저앉습니다
  alternatives_korean:
  - 허리를 굽힙니다
  - 웅크립니다
  lexicon: HALOT
  rationale: ‘주저앉다’는 함께 쓰인 ‘엎드러지다’와 짝을 이루며, 우상 신의 굴욕적 붕괴 이미지를 강하게 전달합니다.
- source_word: עֲצַבֵּיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상
  alternatives_korean:
  - 그들의 형상
  - 그들의 조각상
  lexicon: HALOT
  rationale: 예언서의 논박적 문맥에서 ניטראל한 ‘형상’보다 ‘우상’이 본문의 신학적 공격성을 더 정확히 드러냅니다.
- source_word: נְשֻׂאֹתֵיכֶם
  english_pob_choice: your loads are borne
  chosen_korean: 당신들의 짐은 … 실립니다
  alternatives_korean:
  - 당신들이 지는 짐은 … 옮겨집니다
  - 당신들의 실려 가는 짐은 …
  lexicon: HALOT
  rationale: 히브리어가 난해하므로 운반·이송의 이미지를 살려 번역했고, 수동적 ‘실리다’로 우상 운송의 장면을 보존했습니다.
- source_word: לַחַיָּה וְלַבְּהֵמָה / לַעֲיֵפָה
  english_pob_choice: for the beasts and the cattle / for the weary
  chosen_korean: 짐승과 가축에게 / 지쳐 있는 짐승의 무거운 짐
  alternatives_korean:
  - 들짐승과 가축에게 / 지친 짐승에게
  - 짐승과 가축을 위해 / 지친 자에게
  lexicon: HALOT
  rationale: 두 동물 범주는 구체성을 유지해 ‘짐승과 가축’으로 옮기고, 마지막 절은 운반에 지친 짐승을 가리키는 가능성을 살려 ‘지쳐 있는 짐승’으로 처리했습니다.
theological_decisions:
- issue: 보편적 의미의 ‘images’보다 예언적 폄하로서의 'idols'를 어떻게 반영할지
  chosen_reading: ‘우상’으로 번역하여 야훼 신앙의 배타성과 바빌론 신들의 무력함을 드러냅니다.
  alternative_readings:
  - ‘형상’으로 옮겨 더 중립적으로 처리
  - ‘조각상’으로 구체화
  rationale: 본문은 단순한 조형물을 말하는 것이 아니라, 실패한 신으로 조롱받는 거짓 신상들을 가리키므로 ‘우상’이 원문의 논박을 가장 잘 보존합니다.
  doctrine_reference: 예언서의 우상 비판, 출 20:3-5의 우상 금지
