  source_fidelity: 첫 두 동사의 대비와 우상들이 짐승에게 운반되는 역전 이미지는 대체로 포착했습니다. 그러나 ‘짐승과 가축에게 넘어가고’는 לַחַיָּה וְלַבְּהֵמָה의 운반·적재 관계를 ‘넘어가다’로 바꾸어 본문에 없는 소유 이전의 뜻을 더합니다. 또한 마지막 구절은 ‘지쳐 있는 짐승의 무거운 짐’으로 단정하기보다, 난해한 히브리어의 운반/적재 및 피로 이미지를 보존해야 합니다.
  naturalness: ‘벨은 엎드러지고, 느보는 주저앉습니다’는 자연스럽지만 קֹרֵס에는 ‘몸을 굽히다’가 ‘주저앉다’보다 안전합니다. ‘너희가 메고 가던 것들’은 ‘당신들의 짐’보다 현대 한국어에서 자연스럽고, 난해한 원문의 운반 대상을 더 분명히 나타냅니다.
  terminology: Bel과 Nebo는 통용 표기인 ‘벨’과 ‘느보’로 유지합니다. עֲצַבֵּיהֶם은 이 문맥에서 ‘우상들’이 적절합니다. ‘너희’는 예언의 직접 복수 호칭으로서 합쇼체 종결과 함께 사용할 수 있으며, ‘당신들’보다 자연스럽습니다.
