revisions:
- from: 벨은 엎드러지고, 느보는 주저앉습니다. 그들의 우상은 짐승과 가축에게 넘어가고, 당신들의 짐은 지쳐 있는 짐승의 무거운 짐이 되어 실립니다.[a][b][c]
  to: 벨은 엎드러지고 느보는 몸을 굽힙니다. 그들의 우상들은 짐승과 가축 위에 실려 있습니다.[a] 너희가 메고 가던 것들은 지친 자에게 무거운 짐으로 실려 있습니다.[b][c]
  rationale: ‘넘어가고’를 ‘위에 실려 있습니다’로 고쳐 우상들이 짐승에게 의존하여 운반되는 핵심 풍자를 보존했습니다. 마지막 난해한 구절은 운반 대상과 피로의 이미지를 유지하되, 피로한 존재를 반드시 짐승으로 확정하지 않도록 ‘지친 자’로 옮기고 각주에서 가능한 구체적 이해를 제시했습니다. 첫 각주는 해당 어휘인 ‘우상들’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:55Z'
