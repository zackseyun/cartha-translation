  terminology: ‘야곱의 집’, ‘이스라엘 집’, ‘남은 자들’은 예언서의 집단 명칭과 שְׁאֵרִית의 핵심 용어를 적절히 보존합니다. ‘태중/모태’는 בֶּטֶן과 רָחַם의 어휘적 병렬을 자연스럽게 드러냅니다.
