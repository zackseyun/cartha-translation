  text: 들으십시오, 야곱의 집이여, 이스라엘의 집의 남은 자들 모두여. 너희는 배에서부터, 태에서부터 내게 업혀 온 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘배에서부터’와 ‘태에서부터’라는 서로 가까운 두 표현을 병렬로 사용하여, 하나님의 돌보심이 생애의 가장 초기부터 있었음을 시적으로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  english_pob_choice: Listen to me
  chosen_korean: 들으십시오
  alternatives_korean:
