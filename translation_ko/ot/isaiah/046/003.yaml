  lexicon: HALOT
  rationale: שְׁאֵרִית의 예언적 용례를 살리기 위해 ‘남은 자들’을 유지했고, ‘remnant’의 신학적 무게를 보존했습니다.
- source_word: הָעֲמֻסִים מִנִּי בֶטֶן הַנְּשֻׂאִים מִנִּי רָחַם
  english_pob_choice: who have been carried by me from birth, borne by me from the womb
  chosen_korean: 배에서부터, 태에서부터 내게 업혀 온 자들입니다
  alternatives_korean:
  - 태에서부터 내게 업혀 온 자들입니다
  - 배에서부터 내게 안겨 온 자들입니다
  lexicon: HALOT
  rationale: 두 수동분사와 두 출처 표현의 평행을 살리되, ‘업히다’로 하나님이 짐을 지는 분이 아니라 백성을 떠받들어 오신 분이라는 이미지를 한국어로 선명하게 전달했습니다.
theological_decisions:
