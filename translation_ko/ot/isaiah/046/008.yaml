id: ISA.46.8
reference: Isaiah 46:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
  footnotes:
  - marker: a
    text: Or 'show yourselves men,' 'be strong,' or 'take courage' for 'stand firm.' The Hebrew verb is rare and conveys strengthening or firmness.
    reason: lexical_alternative
  - marker: b
    text: Literally 'bring back upon the heart'; that is, 'lay it to heart' or 'consider it well.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you rebels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 기억하고, 너희, 허물 범하는 자들아, 마음에 새기십시오[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굳건히 서십시오’, ‘힘을 내십시오’, ‘용기를 내십시오’의 뜻일 수 있습니다. 히브리어 동사는 드물며, 강건함이나 확고함을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음 위로 돌려놓다’는 뜻으로, 곧 ‘마음에 새기다’ 또는 ‘깊이 생각하다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하고
  alternatives_korean:
  - 기억하십시오
  - 상기하십시오
  lexicon: HALOT
  rationale: זכר의 복수 명령형으로, 먼저 떠올리고 잊지 않으라는 직접 명령이므로 ‘기억하고’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: וְהִתְאֹשָׁשׁוּ
  english_pob_choice: be ashamed / stand firm
  chosen_korean: 마음에 새기십시오
  alternatives_korean:
  - 굳건히 서십시오
  - 부끄러워하십시오
  - 힘을 내십시오
  lexicon: HALOT
  rationale: 이 동사는 희귀하여 문맥상 ‘굳건함/강건함’ 또는 ‘부끄러움’ 계열의 해석이 갈리므로, 본문 전체의 ‘기억하고… 마음에 새기라’는 권고 흐름에 맞춰 내면화의 촉구로 옮겼습니다.
- source_word: הָשִׁיבוּ עַל לֵב
  english_pob_choice: take it to heart
  chosen_korean: 마음에 새기십시오
  alternatives_korean:
  - 마음에 돌이키십시오
  - 깊이 생각하십시오
  - 심중에 두십시오
  lexicon: HALOT
  rationale: 직역하면 ‘마음 위로 돌려놓다’는 관용구로, 한국어에서는 ‘마음에 새기다/두다’가 그 내면화의 뜻을 가장 잘 전달합니다.
- source_word: פוֹשְׁעִים
  english_pob_choice: you transgressors
  chosen_korean: 너희, 허물 범하는 자들아
  alternatives_korean:
  - 너희 반역자들아
  - 너희 죄를 범하는 자들아
  - 너희 패역한 자들아
  lexicon: HALOT
  rationale: פשע는 단순한 실수보다 언약적/도덕적 일탈을 가리키므로, POB의 ‘transgressors’를 따라 ‘허물 범하는 자들’로 옮겨 죄책과 반항의 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: 희귀 동사 וְהִתְאֹשָׁשׁוּ의 의미 범위
  chosen_reading: 본문의 핵심 권면을 ‘굳건함’과 ‘내면화’로 읽어, 한국어에서는 직접적인 심리 상태 묘사보다 ‘마음에 새기십시오’로 번역했습니다.
  alternative_readings:
  - 부끄러워하십시오
  - 굳세어지십시오
  - 사내답게 하십시오
  rationale: 원문과 POB 모두 이 동사의 정확한 의미가 난해하므로, 특정 성별 표지나 과도한 해석을 피하고 문맥상 요구되는 태도 전환을 드러내는 방향을 택했습니다.
  doctrine_reference: 언약적 책망과 회개의 촉구(예언서 경고 담화)
