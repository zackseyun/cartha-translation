  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
  footnotes:
  - marker: a
    text: 'Or ''mighty of heart'' or ''strong-hearted''; the Hebrew expression is rendered here according to its likely negative sense in context: obstinate or stubborn in heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'far from justice' or 'far from vindication.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 들어오십시오, 마음이 완고한 자들아[a]. 너희는 의에서[b] 멉니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음이 강한’ 또는 ‘강한 마음의’가 될 수 있으나, 문맥상 ‘완고한’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의에서’, ‘의로운 판결에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְע֥וּ אֵלַ֖י
  english_pob_choice: Listen to me
  chosen_korean: 내게 들어오십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 내게 귀를 기울이십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형은 단순 청각이 아니라 권위 있는 부름에 대한 응답을 요구하므로, 현대 한국어에서는 ‘들으십시오’보다 직접적이고 촉구적인 ‘내게 들어오십시오’가 호소의 힘을 살립니다.
- source_word: אַבִּירֵי לֵב
  english_pob_choice: stubborn of heart
  chosen_korean: 마음이 완고한 자들
  alternatives_korean:
  - 마음이 강한 자들
  - 마음이 굳은 자들
  - 마음이 고집 센 자들
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 강한/힘센’이지만, 문맥상 예언자적 책망이므로 POB의 부정적 해석을 따라 완고함을 드러내는 표현으로 옮겼습니다.
- source_word: הָרְחוֹקִים
  english_pob_choice: you who are far
  chosen_korean: '...자들'
  alternatives_korean:
  - 멀리 있는 자들
  - 멀어진 자들
  lexicon: HALOT
  rationale: 뒤의 ‘from righteousness’와 연결되는 수식이므로, 한국어에서는 관계절을 명시하지 않고 앞 구에 이어지는 호칭 구조로 처리해 문장을 자연스럽게 했습니다.
- source_word: מִצְּדָקָה
  english_pob_choice: from righteousness
  chosen_korean: 의에서
  alternatives_korean:
  - 의로부터
  - 정의에서
  - 의와는
  lexicon: HALOT
  rationale: צְדָקָה는 이 문맥에서 도덕적·언약적 ‘의’를 가리키므로 기본 용례를 유지하되, 한국어 조사 ‘에서’로 거리감과 분리를 살렸습니다.
theological_decisions:
- issue: צְדָקָה의 의미 범위
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로운 판결
  - 변호/구원적 옳음
  rationale: 이 절은 완고한 마음을 가진 자들이 하나님의 ‘의’에서 멀리 떨어져 있다는 책망이 핵심이므로, 사회적 정의로 좁히지 않고 기본적인 언약적·도덕적 의로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: צדקה → righteousness / justice'
