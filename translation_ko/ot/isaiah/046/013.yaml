id: ISA.46.13
reference: Isaiah 46:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
  footnotes:
  - marker: a
    text: Or 'my justice' or 'my vindication' for 'my righteousness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my glory' for 'my splendor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 의를 가까이 가져왔습니다. 그것은 멀리 있지 않습니다. 내 구원도 더디지 않을 것입니다. 내가 시온에 구원을 두고, 이스라엘을 위해 내 영광을 두겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 공의’나 ‘내 변호/정당화’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영광’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  english_pob_choice: I have brought near
  chosen_korean: 가까이 가져왔습니다
  alternatives_korean:
  - 가까이 두었습니다
  - 가까이 오게 했습니다
  lexicon: HALOT
  rationale: 완료된 행위를 나타내는 완료형을 살리면서, 하나님의 주도적 행위를 자연스럽게 표현했습니다.
- source_word: צִדְקָתִי
  english_pob_choice: my righteousness
  chosen_korean: 내 의
  alternatives_korean:
  - 나의 의로움
  - 내 공의
  - 내 의로우심
  lexicon: HALOT
  rationale: 여기서는 하나님의 구원 행동과 연결된 넓은 의미의 צדקה를 살려, ‘의’로 옮기는 것이 가장 직접적입니다.
- source_word: וּתְשׁוּעָתִי
  english_pob_choice: and my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 내 구해 주심
  - 내 구출
  - 내 구원하심
  lexicon: HALOT
  rationale: ישע/תשועה 계열은 이사야에서 반복적으로 하나님의 구원 행위를 가리키므로, ‘구원’이 가장 안정적인 대응입니다.
- source_word: תִּפְאַרְתִּי
  english_pob_choice: my splendor
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 splendor
  - 내 아름다움
  lexicon: HALOT
  rationale: 시적인 병행에서 תפארת는 ‘영광/찬란함’의 의미를 띠며, 한국어에서는 ‘영광’이 가장 자연스럽고 문맥상 적절합니다.
theological_decisions:
- issue: 최종절의 구문 관계—이스라엘과 하나님의 영광
  chosen_reading: ‘이스라엘을 위해 내 영광을 두겠습니다’로 옮겨, 하나님이 시온에 두시는 구원과 이스라엘을 향한 하나님의 영광을 함께 드러냈습니다.
  alternative_readings:
  - 이스라엘은 내 영광입니다
  - 이스라엘에게 내 영광을 둡니다
  - 이스라엘을 위한 내 영광
  rationale: 히브리어는 압축적이어서 관계를 과잉 해석하지 않는 것이 중요합니다. ‘위해’는 수혜 대상을 드러내면서도 문장의 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
