  source_fidelity: 첫 세 절은 히브리어의 완료형, 가까움, 구원의 지체 없음이라는 흐름을 대체로 충실히 반영합니다. 그러나 마지막 절의 ונתתי가 시온의 구원과 이스라엘에 관한 ‘내 영광’에 함께 걸리는데, 초안의 ‘이스라엘을 위해 내 영광을 두겠습니다’는 ‘이스라엘을 위해’가 ‘내 영광’을 수식하게 하여 히브리어의 לישראל을 지나치게 목적·수혜의 관계로 한정하고 문장 구조도 부자연스럽습니다. 한국어에서는 두 병렬 수여 구문으로 옮기는 것이 안전합니다.
  naturalness: ‘가까이 가져왔습니다’는 이해 가능하지만, 추상명사인 ‘의’와 결합할 때 ‘가까이 두었습니다’보다 다소 직역투입니다. ‘가까이 가져왔습니다’ 자체는 원문의 능동적 완료 행위를 살릴 수 있으므로 유지할 수 있습니다. 마지막 절은 수정이 필요하며, ‘시온에 구원을, 이스라엘에게 내 영광을 주겠습니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘의’, ‘구원’, ‘시온’, ‘이스라엘’, ‘영광’은 적절합니다. 다만 각주 a는 ‘내 의’에 직접 붙어야 하며, 각주 b는 이미 본문 채택어인 ‘내 영광’을 대안으로 제시해서는 안 됩니다. תפארתי의 다른 가능한 어휘값인 ‘내 찬란함’ 또는 ‘내 아름다움’을 제시하는 것이 맞습니다.
