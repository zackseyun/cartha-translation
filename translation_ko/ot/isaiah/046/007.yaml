id: ISA.46.7
reference: Isaiah 46:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִ֠שָּׂאֻ/הוּ עַל כָּתֵ֨ף יִסְבְּלֻ֜/הוּ וְ/יַנִּיחֻ֤/הוּ תַחְתָּי/ו֙ וְ/יַֽעֲמֹ֔ד מִ/מְּקוֹמ֖/וֹ לֹ֣א יָמִ֑ישׁ אַף יִצְעַ֤ק אֵלָי/ו֙ וְ/לֹ֣א יַעֲנֶ֔ה מִ/צָּרָת֖/וֹ לֹ֥א יוֹשִׁיעֶֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
  footnotes:
  - marker: a
    text: Hebrew literally, 'they set it under it,' likely meaning they set the idol in its place or on its pedestal/base.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 그것을 어깨에 들어 올려 메고 운반하여 제자리에 놓습니다. 그것은 그 자리에 서서 제자리에서 움직이지 않습니다. 누군가 그것에게 부르짖어도 그것은 대답하지 않으며, 그를 환난에서 구원하지도 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 아래에 그것을 놓다’라고 합니다. 이는 문맥상 우상을 제자리, 곧 받침대 위에 안치하는 것을 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֻהוּ / יִסְבְּלֻהוּ
  english_pob_choice: they lift it / they carry it
  chosen_korean: 그것을 어깨 위에 메고, 운반하여
  alternatives_korean:
  - 그것을 들어 올려, 짊어지고
  - 그것을 메고, 나르고
  lexicon: HALOT
  rationale: 앞의 נשׂא와 뒤의 סבל이 연속 동작을 이루므로, ‘메고’와 ‘운반하여’로 구분해 우상의 무거운 이동 과정을 살렸습니다.
- source_word: עַל כָּתֵף
  english_pob_choice: onto the shoulder
  chosen_korean: 어깨 위에
  alternatives_korean:
  - 어깨에
  - 어깨 위로
  lexicon: HALOT
  rationale: 히브리어의 ‘어깨’ 단수는 운반의 관용적 표현이므로, 움직임을 살리는 ‘어깨 위에’가 가장 자연스럽습니다.
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  english_pob_choice: they set it in its place
  chosen_korean: 제자리에 놓으면
  alternatives_korean:
  - 그것을 그 아래에 놓으면
  - 그것을 받침 위에 놓으면
  lexicon: HALOT
  rationale: 직역하면 ‘그 아래에’이지만 문맥상 우상을 받침이나 자리 위에 안치하는 뜻이므로, 의미를 드러내는 ‘제자리에 놓다’로 옮겼습니다.
- source_word: מִמְּקוֹמוֹ לֹא יָמִישׁ
  english_pob_choice: it does not move from its place
  chosen_korean: 제자리에서 움직이지 않습니다
  alternatives_korean:
  - 그 자리에서 옮겨지지 않습니다
  - 자리에서 떠나지 않습니다
  lexicon: HALOT
  rationale: 움직임/이동의 부정을 간결하게 살려, 우상의 무력함을 풍자하는 대조를 한국어로도 분명히 드러냈습니다.
theological_decisions:
- issue: 우상에 대한 조롱의 어조
  chosen_reading: 문장 전체를 평서문으로 유지하되, 우상이 응답도 구원도 못 하는 무능을 선명하게 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘대답하지 못합니다’로 완화
  - 더 직접적으로 ‘전혀 구원하지 못합니다’로 강화
  rationale: 본문은 우상의 무기력함을 비웃는 예언자적 조롱이므로, 과도하게 완화하지 않고 원문의 냉소적 대비를 보존했습니다.
  doctrine_reference: Isaiah 46:7 문맥의 우상 비판
