  to: 사람들은 그것을 어깨에 들어 올려 메고 운반하여 제자리에 놓습니다. 그것은 그 자리에 서서 제자리에서 움직이지 않습니다. 누군가 그것에게 부르짖어도 그것은 대답하지 않으며, 그를 환난에서 구원하지도 않습니다.[a]
