  source_fidelity: 개정이 필요합니다. 초안의 ‘메고’는 נשׂא의 들어 올리는 동작과 뒤따르는 סבל의 운반을 충분히 구별하지 못하며, ‘놓으면’은 원문의 단순 접속된 서술을 조건문으로 바꿉니다. 마지막의 ‘구원하지도 못합니다’는 원문의 단정적 부정을 능력 부정으로 다소 바꿉니다.
  naturalness: 합쇼체는 대체로 자연스럽지만, ‘어깨 위에 메고’보다 ‘어깨에 들어 올려 메고’가 한국어 관용과 동작의 순서를 더 잘 살립니다. 조건 표현을 제거하고 문장을 정리하면 더 매끄럽습니다.
  terminology: ‘환난’과 ‘구원’은 צָרָה 및 ישׁע의 의미와 성경 한국어의 격식 있는 용례에 적절합니다. 우상 지시어는 ‘그것’으로 유지하여 원문의 비인격적 풍자를 보존합니다.
  issues:
