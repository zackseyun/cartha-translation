translation:
  language: ko
  text: “누구에게 나를 비기고 나를 같게 하며, 나를 견주어 우리가 서로 같게 되겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누구에게 나를 견주고 나를 같게 하며, 나를 비기어 우리가 서로 같게 되겠습니까?” 히브리어는 비교를 뜻하는 여러 유사 동사를 겹쳐 사용하여 이 수사적 도전을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  english_pob_choice: To whom
  chosen_korean: 누구에게
  alternatives_korean:
  - 누구와
  - 어느 누구에게
  lexicon: HALOT
  rationale: 비교의 대상이 되는 상대를 묻는 의문이므로, 한국어에서는 자연스럽게 ‘누구에게’로 옮겨 수사적 질문의 직접성을 살렸습니다.
- source_word: תְדַמְי֖וּ/נִי
  english_pob_choice: will you liken me
  chosen_korean: 나를 비기며
  alternatives_korean:
  - 나를 비유하며
  - 나를 같게 여기며
  lexicon: HALOT
  rationale: דמה의 핵심은 ‘비교하다/비기다’이므로, 문맥의 비교 행위를 살려 ‘비기다’를 택했습니다. 반복되는 유사 동사군의 첫 항을 너무 풀지 않기 위해 간결하게 처리했습니다.
- source_word: וְ/תַשְׁו֑וּ
  english_pob_choice: make me equal
  chosen_korean: 나를 같게 하며
  alternatives_korean:
  - 나를 동등하게 하며
  - 나를 बराब하게 하며
  lexicon: HALOT
  rationale: שוה의 어감은 ‘같게 하다, 동등하게 하다’이므로 직역에 가까운 ‘같게 하다’로 옮겼습니다. 앞뒤 동사들과의 축적 효과를 살리기 위해 중복을 감수했습니다.
- source_word: וְ/נִדְמֶֽה׃
  english_pob_choice: that we may be alike
  chosen_korean: 우리가 서로 같다고 하겠습니까
  alternatives_korean:
  - 우리가 서로 비슷하다고 하겠습니까
  - 우리가 서로 닮게 되겠습니까
  lexicon: HALOT
  rationale: 끝의 1인칭 공범위 표현은 비교의 결과를 함께 묻는 말이므로 ‘우리가’로 분명히 드러냈습니다. 한국어에서는 종결을 질문형으로 마무리해 원문의 수사적 도전을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 하나님과 피조물의 비교를 겨냥한 수사적 축적
  chosen_reading: 네 개의 비교 동사를 한 번에 완화하지 않고, ‘비기며 / 같게 하며 / 비교하여’로 겹치게 옮겼습니다.
  alternative_readings:
  - 한 동사로 묶어 ‘나를 비교하겠습니까’로 단순화하기
  rationale: 히브리어는 유사한 동사들을 연속 배치해 우상 숭배의 비교 행위를 조롱합니다. 이 중첩을 보존해야 본문의 논박 강도가 살아납니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text rhetoric and documented lexical tension.'
