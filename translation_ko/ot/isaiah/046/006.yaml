id: ISA.46.6
reference: Isaiah 46:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/זָּלִ֤ים זָהָב֙ מִ/כִּ֔יס וְ/כֶ֖סֶף בַּ/קָּנֶ֣ה יִשְׁקֹ֑לוּ יִשְׂכְּר֤וּ צוֹרֵף֙ וְ/יַעֲשֵׂ֣/הוּ אֵ֔ל יִסְגְּד֖וּ אַף יִֽשְׁתַּחֲוּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
  footnotes:
  - marker: a
    text: Or 'and weigh out silver with the balance-beam'; the Hebrew term literally refers to a reed/cane and may denote the measuring beam of a scale.
    reason: lexical_alternative
translation:
  language: ko
  text: 금으로 허리주머니를 털어 내고 은을 저울대로 달아 금세공인을 부르게 하며, 그는 그것을 신으로 만듭니다. 그들은 절하며, 참으로 엎드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은을 갈대/막대 저울로 단다’는 뜻입니다. 히브리어 קָנֶה는 문자적으로 갈대이지만, 여기서는 저울의 막대나 눈금대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּלִים זָהָב מִכִּיס
  english_pob_choice: Those who lavish gold from the purse
  chosen_korean: 금으로 허리주머니를 털어 내고
  alternatives_korean:
  - 주머니에서 금을 아낌없이 내고
  - 돈주머니에서 금을 마구 쓰고
  lexicon: HALOT
  rationale: הַזָּלִים는 ‘아낌없이 쏟아 내는’ 동작을, מִכִּיס는 돈을 넣는 주머니를 가리키므로, 한국어에서는 ‘허리주머니를 털어 내다’로 소비의 과감함을 자연스럽게 살렸습니다.
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  english_pob_choice: and weigh out silver on the scale
  chosen_korean: 은을 저울대로 달아
  alternatives_korean:
  - 은을 갈대 막대로 달아
  - 은을 저울의 막대로 달아
  lexicon: HALOT
  rationale: קָנֶה는 문자적으로 ‘갈대’이지만, 문맥상 저울의 막대/눈금대로를 가리킬 수 있으므로, 영어 POB의 취지를 따라 ‘저울대’로 옮겨 실제 계량 행위를 분명하게 했습니다.
- source_word: יִשְׂכְּרוּ צוֹרֵף
  english_pob_choice: hire a goldsmith
  chosen_korean: 금세공인을 부르게 하며
  alternatives_korean:
  - 금세공인을 고용하고
  - 금속공예인을 사서 부르게 하며
  lexicon: HALOT
  rationale: צוֹרֵף는 금과 은을 다루는 금속 장인으로, 여기서는 우상 제작 맥락이므로 ‘금세공인’이 가장 구체적이고 자연스럽습니다.
- source_word: וְיַעֲשֵׂהוּ אֵל
  english_pob_choice: and he makes it into a god
  chosen_korean: 그는 그것을 신으로 만듭니다.
  alternatives_korean:
  - 그는 그것을 한 신으로 만듭니다.
  - 그는 그것을 우상 신으로 만듭니다.
  lexicon: HALOT
  rationale: אֵל을 ‘신’으로 옮겨 원문이 실제로 ‘god’라는 단어를 쓰는 점을 살리되, 문맥이 만든 거짓 신임은 전체 문맥이 드러내도록 했습니다.
- source_word: יִסְגְּדוּ אַף יִשְׁתַּחֲוּוּ
  english_pob_choice: they bow down, indeed they prostrate themselves
  chosen_korean: 그들은 절하며, 참으로 엎드립니다.
  alternatives_korean:
  - 그들은 경배하며, 심지어 엎드립니다.
  - 그들은 절하고, 더욱 엎드립니다.
  lexicon: HALOT
  rationale: יִסְגְּדוּ와 יִשְׁתַּחֲוּוּ의 연속을 한국어 동사 두 개로 살리되, 둘째 동사의 강화 효과를 ‘참으로’와 ‘엎드립니다’로 표현했습니다.
theological_decisions:
- issue: אֵל을 우상 문맥에서 어떻게 옮길지
  chosen_reading: ‘신’으로 직역하되, 문맥상 사람 손으로 만든 거짓 신임을 그대로 드러냅니다.
  alternative_readings:
  - ‘우상’으로 해석해 옮김
  - ‘하나님’으로 완화해 옮김
  rationale: 원문은 פולემিক한 우상 제작 장면에서 אֵל을 사용하므로, 해석어를 덧씌우기보다 ‘신’으로 유지하는 편이 소스의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
