language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
  footnotes:
  - marker: a
    text: Or 'from ancient times' or 'from of old.' The Hebrew expression refers to the distant past here, not necessarily to eternity in the abstract.
    reason: lexical_alternative
translation:
  language: ko
  text: 옛적의 일들을 기억하십시오[a]. 나는 하나님이며 다른 이가 없고, 나는 하나님이며 나와 같은 이가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛적부터’ 혹은 ‘먼 옛날부터’. 여기서는 ‘영원’이라는 추상적 개념이 아니라 먼 과거를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 되새기십시오
  - 기억하라
  lexicon: HALOT
  rationale: 복수 명령형의 직접적 촉구를 현대 표준어 합쇼체로 옮겼습니다. ‘기억하다’가 단순 회상이 아니라 의식적 소환을 잘 드러냅니다.
- source_word: רִאשֹׁנֹת מֵעוֹלָם
  english_pob_choice: the former things of old
  chosen_korean: 옛적의 일들
  alternatives_korean:
  - 오래전의 일들
  - 옛날부터의 일들
  - 먼 옛날의 일들
  lexicon: HALOT
  rationale: 이 결합은 ‘먼 과거의 일들’을 가리키므로, 시간적 거리를 살리면서도 직역의 어색함을 줄인 표현을 택했습니다.
- source_word: אֵל / אֱלֹהִים
  english_pob_choice: I am God / God
  chosen_korean: 나는 하나님이며
  alternatives_korean:
  - 나는 하나님이니
  - 나는 신이며
  - 나는 하나님입니다
  lexicon: HALOT
  rationale: 두 절의 병행에서 동일한 자기선언을 유지하기 위해 둘 다 ‘하나님’으로 옮겼습니다. 한국어에서는 주어-서술어를 자연스럽게 유지하는 ‘나는 하나님이며’가 가장 직접적입니다.
- source_word: וְאֵין עוֹד / וְאֶפֶס כָּמוֹנִי
  english_pob_choice: and there is no other ... and there is none like me
  chosen_korean: 다른 이가 없고, 나와 같은 이가 없습니다
  alternatives_korean:
  - 다른 이가 없고, 나와 같은 분이 없습니다
  - 없으며, 나와 같은 이가 없습니다
  - 나와 같은 이가 전혀 없습니다
  lexicon: HALOT
  rationale: ‘אין עוד’의 배타성과 ‘אפס כמוני’의 비교불가능성을 각각 살렸습니다. ‘나와 같은 이’는 형상적 비교를 유지하면서도 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 하나님의 유일성과 비교불가능성의 중복 강조
  chosen_reading: 두 병행절을 모두 살려 ‘다른 이가 없고’와 ‘나와 같은 이가 없습니다’를 분리해 표현했습니다.
  alternative_readings:
  - 두 표현을 하나로 압축해 ‘나 같은 이가 없습니다’로 옮김
  - ‘유일하신 하나님’으로 의미를 요약
  rationale: 본문은 단순한 동의 반복이 아니라 ‘다른 이가 없음’과 ‘비교불가함’을 함께 선포합니다. 이를 합쳐버리면 강조 구조가 약해집니다.
  doctrine_reference: 단일신 신앙; 이사야의 야훼 유일성 선언
