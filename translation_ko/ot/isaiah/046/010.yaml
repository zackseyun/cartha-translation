id: ISA.46.10
reference: Isaiah 46:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַגִּ֤יד מֵֽ/רֵאשִׁית֙ אַחֲרִ֔ית וּ/מִ/קֶּ֖דֶם אֲשֶׁ֣ר לֹא נַעֲשׂ֑וּ אֹמֵר֙ עֲצָתִ֣/י תָק֔וּם וְ/כָל חֶפְצִ֖/י אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
  footnotes:
  - marker: a
    text: Or 'things not yet accomplished' / 'what has not yet happened.' The Hebrew is literally 'things that have not been done.'
    reason: lexical_alternative
  - marker: b
    text: Or 'My counsel shall stand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will do all my will' / 'all that I desire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 처음부터 끝을 선포하시며, 예로부터 아직 이루어지지 않은 일들을 말씀하시어, “나의 목적은 설 것[a][b]이며, 나는 나의 모든 기쁨[c]을 이루겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아직 이루어지지 않은 일들’ / ‘아직 일어나지 않은 것들’. 히브리어는 문자적으로 ‘행해지지 않은 것들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 계획은 설 것이다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나의 뜻을 모두 행하겠습니다’ / ‘내가 원하는 모든 것을 이루겠습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  english_pob_choice: declaring
  chosen_korean: 선포하시며
  alternatives_korean:
  - 알리시며
  - 말씀하시며
  lexicon: HALOT
  rationale: 히필 분사로서 단순 전달보다 공적이고 권위 있는 ‘선포’가 본문의 예언적 어조를 잘 살립니다.
- source_word: מֵרֵאשִׁית / אַחֲרִית
  english_pob_choice: from the beginning / the end
  chosen_korean: 처음부터 끝을
  alternatives_korean:
  - 시작부터 끝을
  - 처음에서 끝을
  lexicon: HALOT
  rationale: ‘처음/끝’의 대조를 한국어로 자연스럽게 살리되, 시간적 범위를 분명하게 드러냈습니다.
- source_word: עֲצָתִי
  english_pob_choice: My purpose / My counsel
  chosen_korean: 나의 목적
  alternatives_korean:
  - 나의 계획
  - 나의 모의
  lexicon: HALOT
  rationale: 이 문맥에서는 하나님의 주권적 의도와 실행을 가리키므로, ‘목적’이 ‘조언’보다 본문의 의미를 더 자연스럽게 전달합니다.
- source_word: חֶפְצִי
  english_pob_choice: my good pleasure / my pleasure
  chosen_korean: 나의 모든 기쁨
  alternatives_korean:
  - 나의 모든 뜻
  - 나의 모든 뜻하심
  - 나의 모든 즐거움
  lexicon: HALOT
  rationale: חֵפֶץ의 ‘기쁨/즐김/원함’ 의미를 살리면서, 하나님께서 원하시는 바를 행하신다는 뉘앙스를 한국어로 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: עֲצָתִי와 חֶפְצִי의 신적 의지 표현
  chosen_reading: “나의 목적은 설 것이며, 나는 나의 모든 기쁨을 이루겠습니다.”
  alternative_readings:
  - “나의 계획은 설 것이며, 나는 나의 모든 뜻을 행하겠습니다.”
  - “나의 조언은 설 것이며, 나는 내가 원하는 모든 것을 이루겠습니다.”
  rationale: 이 절은 하나님의 예지뿐 아니라 주권적 실행을 강조합니다. ‘목적’과 ‘기쁨’은 그 강도를 유지하면서도 한국어에서 자연스럽고, 전통적 교회어보다 원문의 직접성을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
