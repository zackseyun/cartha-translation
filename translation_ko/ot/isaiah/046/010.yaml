review_pass:
  verdict: revise
  source_fidelity: 원문의 병행 구조(‘처음부터 끝을’, ‘예로부터 아직 이루어지지 않은 일들을’)와 하나님의 선언을 대체로 잘 반영했습니다. 다만 עֲצָתִי의 ‘목적은 설 것[a][b]이며’는 문법적으로 성립하지 않으며, חֶפְצִי를 ‘나의 모든 기쁨’이라고 목적어화한 표현은 원문의 ‘내가 바라는/뜻하는 모든 것’을 행한다는 의미를 한국어에서 부자연스럽게 바꿉니다.
  naturalness: ‘설 것[a][b]이며’는 조사 결합 오류입니다. 또한 ‘나의 모든 기쁨을 이루겠습니다’는 한국어에서 기쁨 자체를 실현한다는 뜻으로 읽혀 자연스럽지 않습니다. ‘내 계획은 굳게 설 것이며, 내가 바라는 모든 것을 이루겠습니다’가 현대 표준어 합쇼체에서 자연스럽고 본문의 실행 의지를 명확히 드러냅니다.
  terminology: מַגִּיד는 ‘선포하시고/알려 주시며’로, עֲצָתִי는 ‘계획’으로, חֶפְצִי는 명사적 소유 표현을 억지로 직역하지 않고 ‘내가 바라는 모든 것’으로 옮기는 것이 적절합니다. 히브리어 חֵפֶץ에는 ‘선함’이라는 단어가 없으므로 ‘선한 기쁨’은 본문에 넣지 않았습니다.
  issues:
  - severity: high
    issue: ‘나의 목적은 설 것[a][b]이며’의 문법 오류
    rationale: ‘것’ 뒤에 서술격 조사 ‘이며’를 직접 결합할 수 없습니다. 또한 תָקוּם의 ‘굳게 서다/확고히 이루어지다’의 뜻을 자연스럽게 표현해야 합니다.
  - severity: medium
    issue: ‘나의 모든 기쁨을 이루겠습니다’의 의미 및 자연스러움
    rationale: חֶפְצִי는 이 문맥에서 화자가 바라는 것, 뜻하는 것을 가리킵니다. 한국어 ‘기쁨을 이루다’는 해당 의미를 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: 각주 a의 대안이 본문 번역과 중복됨
    rationale: 본문이 이미 ‘아직 이루어지지 않은 일들’을 채택했으므로, 동일한 문구를 대안으로 제시할 필요가 없습니다. 문자적 표현과 ‘아직 일어나지 않은 것’을 제시하는 편이 유익합니다.
  revised_text: 처음부터 끝을 선포하시고, 예로부터 아직 이루어지지 않은 일들을 알려 주시며, “내 계획은 굳게 설 것이며, 내가 바라는 모든 것을 이루겠습니다”라고 말씀하십니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘아직 일어나지 않은 것들’. 히브리어는 문자적으로 ‘행해지지 않은 것들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 뜻은 굳게 설 것이다’ 또는 ‘내 계획은 확고히 이루어질 것이다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 모든 뜻을 행하겠습니다’ 또는 ‘내가 원하는 모든 것을 이루겠습니다’.
    reason: lexical_alternative
  revision_rationale: 문법 오류를 바로잡고, ‘기쁨’이 아니라 하나님께서 바라시고 뜻하시는 바를 실행하신다는 חֶפֶץ의 문맥적 의미를 자연스러운 한국어로 옮겼습니다. 원문의 시간적 병행과 선언적 어조를 유지했으며, ‘선한’처럼 원문에 없는 신학적 수식은 추가하지 않았습니다. 각주 표지는 본문에서 각각 ‘계획’, ‘바라는 모든 것’ 뒤에 붙여야 합니다.
