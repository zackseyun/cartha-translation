id: ISA.46.2
reference: Isaiah 46:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְס֤וּ כָֽרְעוּ֙ יַחְדָּ֔ו לֹ֥א יָכְל֖וּ מַלֵּ֣ט מַשָּׂ֑א וְ/נַפְשָׁ֖/ם בַּ/שְּׁבִ֥י הָלָֽכָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
  footnotes:
  - marker: a
    text: Or 'they crouch' for 'They stoop'; the Hebrew verb can suggest sinking down or collapsing.
    reason: lexical_alternative
  - marker: b
    text: Or 'and their life/soul goes into captivity.' The Hebrew reads literally 'and their nephesh went into captivity,' where nephesh can mean 'soul,' 'life,' or 'self.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 함께 주저앉고[a] 무릎을 꿇습니다. 짐을 구해 내지 못하며, 자신들마저[b] 포로로 끌려갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘웅크립니다’. 히브리어 동사는 가라앉거나 무너져 내리는 모습을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 생명/영혼이 포로로 갑니다’. 히브리어는 문자적으로 ‘그들의 네페쉬가 포로로 갔다’입니다. 여기서 네페쉬는 ‘영혼’, ‘생명’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  english_pob_choice: they stoop
  chosen_korean: 주저앉고
  alternatives_korean:
  - 구부러지고
  - 웅크리고
  lexicon: HALOT
  rationale: 무너져 내려 앉는 동작을 자연스럽게 살리되, 뒤의 ‘엎드립니다’와 병렬을 이루도록 과도한 해석 없이 옮겼습니다.
- source_word: כָּרְעוּ
  english_pob_choice: they bow down
  chosen_korean: 엎드립니다
  alternatives_korean:
  - 무릎을 꿇고
  - 절합니다
  lexicon: HALOT
  rationale: 우상들이 스스로 굽혀지는 신체적 이미지를 유지하면서, 현대 한국어에서 가장 직접적인 ‘엎드리다’ 계열로 옮겼습니다.
- source_word: מַלֵּט מַשָּׂא
  english_pob_choice: save the burden / rescue the burden
  chosen_korean: 짐을 구해 낼 수 없고
  alternatives_korean:
  - 짐을 구원할 수 없고
  - 짐을 건져 낼 수 없고
  lexicon: HALOT
  rationale: מַשָּׂא를 이 문맥의 ‘지고 있는 짐’으로 보고, ‘구해 내다’로 능력 부재를 표현해 영어 POB의 ‘save/rescue’ 긴장을 한국어로 유지했습니다.
- source_word: וְנַפְשָׁם בַּשְּׁבִי הָלָכָה
  english_pob_choice: they themselves go into captivity
  chosen_korean: 자신들마저 포로로 끌려갑니다
  alternatives_korean:
  - 그들 자신이 포로로 갑니다
  - 그들의 목숨이 포로로 갑니다
  lexicon: HALOT
  rationale: נֶפֶשׁ를 ‘목숨/영혼’으로 고정하지 않고, 문맥상 우상들이 무력하게 포로가 되는 반어를 살려 ‘자신들마저’로 옮겼습니다.
theological_decisions:
- issue: 우상들을 인격화한 अंतिम절의 처리
  chosen_reading: ‘자신들마저 포로로 끌려갑니다’로 옮겨, 우상/신상 자체가 무력하게 잡혀가는 조롱의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 그들의 목숨이 포로가 됩니다
  - 그들 자신이 포로로 갑니다
  rationale: 히브리어의 נֶפֶשׁ를 한국어 ‘목숨’으로 고정하면 우상에 대한 풍자성이 약해질 수 있어, 문맥상 의도된 조롱을 우선했습니다.
  doctrine_reference: 우상 숭배에 대한 예언자적 조롱을 보존하는 번역
