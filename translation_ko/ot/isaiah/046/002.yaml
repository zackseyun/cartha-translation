  source_fidelity: 히브리어의 두 병렬 동사(‘주저앉다/가라앉다’와 ‘무릎을 꿇다’) 및 ‘짐을 구해 내지 못함’과 포로 됨의 대조는 대체로 잘 반영되었습니다. 다만 ‘엎드립니다’는 כָּרְעוּ의 ‘무릎을 꿇다, 꺾이다’보다 엎드려 절하는 행위를 다소 강하게 특정할 수 있으므로 더 직접적인 표현이 안전합니다. נַפְשָׁם은 문맥상 ‘그들 자신’으로 자연스럽게 옮길 수 있으며, ‘포로로 끌려갑니다’도 본문의 풍자적 묘사에 맞습니다.
  naturalness: ‘그것들은’보다 선행 문맥의 벨과 느보를 가리키는 ‘그들은’이 한국어 문맥에서 더 자연스럽습니다. ‘함께 주저앉고 무릎을 꿇습니다’는 현대 표준어 합쇼체로 자연스럽고 병렬을 명료하게 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 독자의 이해에 적절합니다.
  terminology: ‘짐’, ‘포로’, ‘네페쉬’의 처리는 적절합니다. נֶפֶשׁ의 의미 범위를 각주에서 ‘영혼, 생명, 자기 자신’으로 제시하되, 본문은 문맥적 의미인 ‘자신들마저’로 유지하는 것이 좋습니다.
