review_pass:
  verdict: revise
  source_fidelity: 히브리어의 완료형들이 묘사하는 황폐와 교통 단절, 그리고 이름이 명시되지 않은 단수 주어의 언약 파기·성읍 멸시·인간 경시를 반영해야 합니다. 초안의 현재형과 마지막 완료형의 혼용은 원문의 연속된 묘사에 비해 부자연스럽습니다. 또한 עֹבֵר אֹרַח는 특정 개인이 멈춘 것보다 길을 오가는 사람의 발길 자체가 끊긴 상태를 뜻하는 것으로 옮기는 편이 정확합니다.
  naturalness: ‘길을 오가는 사람이 끊겼습니다’는 현대 표준 한국어에서 통행의 단절을 자연스럽게 표현합니다. ‘사람을 안중에 두지 않았습니다’는 לֹא חָשַׁב אֱנוֹשׁ의 ‘아무 인간도 고려하거나 존중하지 않음’을 자연스러운 합쇼체로 전달합니다.
  terminology: ‘대로’, ‘언약’, ‘성읍들’은 각각 מְסִלּוֹת, בְּרִית, עָרִים에 적절합니다. 본문은 마소라 본문을 따라 ‘성읍들’을 유지하고, 고대 역본의 ‘증인들’ 읽기는 해당 단어에만 각주로 달아야 합니다. אֱנוֹשׁ의 일반적 단수 용법은 ‘사람’으로 옮기고 그 자리에 어휘 각주를 둡니다.
