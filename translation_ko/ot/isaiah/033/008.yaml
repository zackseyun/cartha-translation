  - severity: medium
    issue: 동사 시제가 혼용되고 통행 단절의 표현이 다소 부정확합니다.
    rationale: נָשַׁמּוּ, שָׁבַת 및 후반부의 동사들은 모두 완료형입니다. ‘황폐해집니다/멈춥니다’와 ‘돌아보지 않았습니다’의 혼용보다 완료된 재난 상황으로 통일하는 편이 낫습니다. 또한 ‘길을 가던 자가 멈춥니다’는 한 사람이 멈춘다는 인상을 주므로, 통행자가 끊겼다는 뜻을 드러내야 합니다.
