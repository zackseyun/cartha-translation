id: ISA.33.8
reference: Isaiah 33:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָשַׁ֣מּוּ מְסִלּ֔וֹת שָׁבַ֖ת עֹבֵ֣ר אֹ֑רַח הֵפֵ֤ר בְּרִית֙ מָאַ֣ס עָרִ֔ים לֹ֥א חָשַׁ֖ב אֱנֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
  footnotes:
  - marker: a
    text: Or, following some ancient versions, 'despised witnesses' instead of 'despised the cities.' The Masoretic Text reads 'cities.'
    reason: textual_variant
  - marker: b
    text: Hebrew 'man' (ʾenosh), a singular term for a human being or mortal man; here it has generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 대로들이 황폐해집니다[a]. 길을 가던 자가 멈춥니다. 그는 언약을 깨뜨리고, 도시들을 멸시하며[b], 사람을 돌아보지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고대 역본들을 따르면 ‘도시들’을 대신해 ‘증인들’을 뜻하는 다른 읽기도 가능합니다. 마소라 본문은 ‘도시들’입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 ‘사람’(אֱנוֹשׁ)은 인간 일반을 가리키는 단수 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ מְסִלּוֹת
  english_pob_choice: The highways lie desolate
  chosen_korean: 대로들이 황폐해집니다
  alternatives_korean:
  - 길들이 황폐해집니다
  - 고속도로들이 황폐해집니다
  - 큰길들이 황량해집니다
  lexicon: HALOT
  rationale: מְסִלּוֹת는 단순한 길보다 공적인 큰길·대로를 가리키므로 ‘대로들’이 ‘highways’의 규모감을 살립니다. נָשַׁמּוּ의 결과 상태를 ‘황폐해집니다’로 옮겨 파괴된 상태를 자연스럽게 드러냈습니다.
- source_word: שָׁבַת עֹבֵר אֹרַח
  english_pob_choice: the traveler has ceased from the road
  chosen_korean: 길을 가던 자가 멈춥니다
  alternatives_korean:
  - 길을 지나던 사람이 그칩니다
  - 여행자가 길에서 사라집니다
  - 길손이 길을 멈춥니다
  lexicon: HALOT
  rationale: עֹבֵר אֹרַח는 ‘길/대로를 지나가는 자’라는 뜻이므로 ‘길을 가던 자’로 간결하게 살렸습니다. שָׁבַת는 중단·멈춤의 뉘앙스를 가져 ‘멈춥니다’가 가장 자연스럽습니다.
- source_word: הֵפֵר בְּרִית
  english_pob_choice: He has broken the covenant
  chosen_korean: 그는 언약을 깨뜨리고
  alternatives_korean:
  - 그는 언약을 어기고
  - 그는 계약을 깨뜨리고
  - 그는 언약을 폐하고
  lexicon: HALOT
  rationale: בְּרִית는 성서적 핵심어이므로 ‘언약’을 유지했습니다. הֵפֵר는 ‘깨뜨리다/어기다’가 가능하지만, ‘깨뜨리고’가 파기된 관계의 강도를 잘 드러냅니다.
- source_word: מָאַס עָרִים
  english_pob_choice: despised the cities
  chosen_korean: 도시들을 멸시하며
  alternatives_korean:
  - 성읍들을 업신여기며
  - 도시들을 버리며
  - 성읍들을 경멸하며
  lexicon: HALOT
  rationale: MT의 עָרִים는 ‘도시들/성읍들’이므로 본문을 따라 ‘도시들’로 옮겼습니다. מָאַס는 단순한 거절보다 경멸·멸시의 태도를 가리켜 ‘멸시하다’가 적합합니다.
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  english_pob_choice: regarded no man
  chosen_korean: 사람을 돌아보지 않았습니다
  alternatives_korean:
  - 사람을 헤아리지 않았습니다
  - 사람을 고려하지 않았습니다
  - 아무도 중요하게 여기지 않았습니다
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 일반적 인간을 가리키는 단수 표현이므로 한국어에서는 가장 자연스러운 일반명사 ‘사람’으로 옮겼습니다. חָשַׁב의 ‘헤아리다/חשב하다’ 의미를 반영하되, 문맥상 무시·무관심의 뜻을 ‘돌아보지 않았습니다’로 전달했습니다.
theological_decisions:
- issue: 히브리어 단수 일반명사 אֱנוֹשׁ의 성별-정확성 유지
  chosen_reading: ‘사람’을 사용해 일반적 인간을 가리키되, 문장 전체는 특정 남성 개인에 한정하지 않도록 유지했습니다.
  alternative_readings:
  - ‘아무도’
  - ‘인간’을 사용해 성중립화
  - ‘사람들’
  rationale: 본문의 אֱנוֹשׁ는 단수형이지만 의미는 일반적 인간 전체를 가리킵니다. 한국어에서는 자연성과 원문 감지를 함께 살리기 위해 ‘사람’을 택했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
- issue: 둘째 절의 주어를 명시하지 않은 채 유지
  chosen_reading: ‘그는’으로 싱글 주어를 유지해 원문의 불명시성을 보존했습니다.
  alternative_readings:
  - ‘그 적대자’
  - ‘그 언약 파괴자’
  - 무주어로 일반화
  rationale: 히브리어는 이 절에서 명시적 주어 없이 단수 동사를 사용해 인물 유형을 암시합니다. 문맥의 해석을 지나치게 앞당기지 않도록 ‘그는’으로만 두었습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
