  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
  footnotes:
  - marker: a
    text: Or 'those far off' / 'those near.' The Hebrew uses plural adjectives substantivally for groups addressed from afar and nearby.
    reason: lexical_alternative
  - marker: b
    text: Or 'my strength' or 'my power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 멀리 있는 이들아, 내가 행한 것을 들으십시오. 가까이 있는 이들아, 나의 위력을 아십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 형용사 복수는 실질명사처럼 쓰여 ‘멀리 있는 이들’ 또는 ‘먼 데 있는 이들’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: גְּבוּרָה는 여기서 ‘위력’, ‘능력’, ‘힘’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 복수 명령의 예언적 호소를 살리면서도 합쇼체의 공적·선포적 톤을 유지하는 표현입니다.
- source_word: רְחוֹקִים
  english_pob_choice: you who are far away
  chosen_korean: 멀리 있는 이들아
  alternatives_korean:
  - 먼 데 있는 이들아
  - 멀리 있는 자들아
  - 멀리 있는 분들아
  lexicon: HALOT
  rationale: 형용사 복수의 실질명사 용법을 자연스럽게 살리되, 대구를 유지하는 호격으로 옮겼습니다.
- source_word: גְּבֻרָתִי
  english_pob_choice: my might
  chosen_korean: 나의 위력
  alternatives_korean:
  - 나의 능력
  - 나의 힘
  - 나의 권능
  lexicon: HALOT
  rationale: גְּבוּרָה의 ‘강한 작용/권세 있는 힘’의 뉘앙스를 살리면서, 단순한 육체적 ‘힘’보다 하나님의 드러난 शक्त勢를 더 분명히 드러내는 표현입니다.
theological_decisions:
- issue: 화자의 명시 여부
  chosen_reading: 본문에 없는 야훼의 이름이나 주어를 덧붙이지 않고, 첫인칭 동사와 소유격만으로 화자가 하나님임을 드러내게 했습니다.
  alternative_readings:
  - 야훼께서 멀리 있는 이들아…
  - 주님이 행하신 것을…
  rationale: 히브리어는 첫인칭 형태로 화자를 충분히 나타내므로, 번역은 본문이 드러내는 정도를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
