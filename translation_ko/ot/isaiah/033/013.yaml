    reason: lexical_alternative
translation:
  language: ko
  text: 멀리 있는 이들아,[a] 내가 행한 일을 들으십시오. 가까이 있는 이들아, 나의 위력을 아십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 복수 형용사는 여기서 실질명사처럼 쓰여 ‘멀리 있는 이들’ 또는 ‘먼 데 있는 이들’을 가리킵니다. 뒤의 ‘가까이 있는 이들’도 마찬가지입니다.
    reason: lexical_alternative
  - marker: b
    text: גְּבוּרָה는 여기서 ‘능력’, ‘힘’, 또는 ‘권세’로도 옮길 수 있습니다.
    reason: lexical_alternative
