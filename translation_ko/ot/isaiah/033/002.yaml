id: ISA.33.2
reference: Isaiah 33:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
  footnotes:
  - marker: a
    text: Or 'our arm every morning.' The Hebrew text reads 'their arm,' but some understand it as a collective reference to the praying people and render it with 'our' for smoother English.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 우리에게 은혜를 베푸소서. 우리가 주를 기다립니다. 매일 아침 그들의 팔이 되시고[a], 고난의 때에 또한 우리의 구원이 되소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그들의 팔’이라고 읽습니다. 일부는 이를 기도하는 공동체를 가리키는 집합적 표현으로 이해하여 ‘우리의 팔’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 야훼님이여
  - 주님이여
  lexicon: WLC/HALOT
  rationale: 여호와 대신 야훼를 사용해 원문 신명사ייה를 직접 반영하고, 직접 호칭을 드러내기 위해 호격 조사 -여를 붙였습니다.
- source_word: חָנֵּנוּ
  english_pob_choice: be gracious to us
  chosen_korean: 우리에게 은혜를 베푸소서
  alternatives_korean:
  - 우리를 불쌍히 여기소서
  - 우리를 은혜롭게 하소서
  lexicon: HALOT
  rationale: חנן의 핵심은 은혜/호의의 베풂이므로, 기도체로 자연스러운 「은혜를 베푸소서」를 택했습니다.
- source_word: לְךָ קִוִּינוּ
  english_pob_choice: we wait for you
  chosen_korean: 우리가 주를 기다립니다
  alternatives_korean:
  - 우리가 주께 소망을 둡니다
  - 우리가 주를 기다려 왔습니다
  lexicon: HALOT
  rationale: קוה의 ‘기다리다/기대하다’ 이미지를 살리되, 한국어 기도문맥에서 자연스러운 현재형 「기다립니다」로 옮겼습니다.
- source_word: זְרֹעָם
  english_pob_choice: their arm
  chosen_korean: 그들의 팔
  alternatives_korean:
  - 우리의 팔
  - 그들의 힘
  lexicon: HALOT
  rationale: 문자적으로는 3인칭 복수 접미사가 붙은 「그들의 팔」이 원문에 가장 가깝고, 신체 은유를 유지하는 것이 시적 긴장을 보존합니다.
- source_word: לַבְּקָרִים
  english_pob_choice: every morning
  chosen_korean: 매일 아침
  alternatives_korean:
  - 아침마다
  - 아침마다 늘
  lexicon: HALOT
  rationale: 복수형 ‘아침들’의 반복성을 한국어에서 가장 자연스럽게 드러내는 표현으로 「매일 아침」을 선택했습니다.
- source_word: יְשׁוּעָתֵנוּ
  english_pob_choice: our salvation
  chosen_korean: 우리의 구원
  alternatives_korean:
  - 우리의 구출
  - 우리의 구제
  lexicon: HALOT
  rationale: יְשׁוּעָה는 문맥상 ‘구원/구출’을 아우르지만, 시편적·예언서적 기도문맥에서는 「구원」이 더 넓고 신학적으로도 적절합니다.
theological_decisions:
- issue: זְרֹעָם의 인칭과 공동체적 호칭의 긴장
  chosen_reading: 본문대로 「그들의 팔」을 유지해, 1인칭 공동체 기도(우리)와 3인칭 복수 소유격(그들의) 사이의 긴장을 드러냈습니다.
  alternative_readings:
  - 우리의 팔
  - 우리의 힘
  rationale: 원문 자음형과 형태론상 3인칭 복수 접미사가 가장 직접적이며, 일부 해석의 매끄러운 조정보다 원문이 남긴 긴장을 보존하는 것이 이 구절의 문학적·신학적 질감을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
