  to: 네 눈은 그 왕을 그 아름다운 모습 그대로 바라보게 될 것이며, 먼 곳까지 펼쳐진 땅을 보게 될 것입니다.[a]
  rationale: 직역투인 ‘그의 아름다움 속에서’를 ‘그 아름다운 모습 그대로’로 고쳐 히브리어의 ‘그의 아름다움 안에서/그 아름다움으로’를 자연스러운 한국어로 옮겼습니다. 두 절의 미래 표현을 합쇼체에 맞게 정돈하고, מַרְחַקִּים의 원근·광활함을 ‘먼 곳까지 펼쳐진’으로 보존했습니다. 왕의 정체는 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
