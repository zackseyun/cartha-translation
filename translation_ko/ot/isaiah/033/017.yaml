id: ISA.33.17
reference: Isaiah 33:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
  footnotes:
  - marker: a
    text: Or 'a remote land,' or more literally, 'a land of far distances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 눈은 그 왕을 그의 아름다움 속에서 볼 것이며, 멀리까지 뻗은 땅을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 땅,’ 더 문자적으로는 ‘먼 거리들의 땅’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  english_pob_choice: the king
  chosen_korean: 그 왕
  alternatives_korean:
  - 왕
  - 한 왕
  lexicon: HALOT
  rationale: 히브리어에는 관사가 없지만 문맥상 특정 왕을 가리킬 수 있으므로, 영어 POB의 ‘the king’에 맞춰 한국어에서도 특정성을 드러내는 ‘그 왕’으로 옮겼습니다.
- source_word: בְּיָפְיוֹ
  english_pob_choice: in his beauty
  chosen_korean: 그의 아름다움 속에서
  alternatives_korean:
  - 그의 아름다움 가운데
  - 그의 화려함 속에서
  - 그의 아름다운 모습에서
  lexicon: HALOT
  rationale: ב + יֹפִי/יָפְי 구조를 한국어에서 자연스럽게 풀어, 외형적 아름다움과 왕적 위엄의 뉘앙스를 함께 열어 두는 표현으로 옮겼습니다.
- source_word: תֶּחֱזֶינָה / תִּרְאֶינָה
  english_pob_choice: will behold / they will see
  chosen_korean: 볼 것이며, ... 보게 될 것입니다
  alternatives_korean:
  - 바라볼 것이며 ... 볼 것입니다
  - 뵐 것이며 ... 볼 것입니다
  lexicon: HALOT
  rationale: חזה의 ‘응시하며 보다’는 감각을 살리되 한국어에서는 중복을 피하고 평행 구조를 유지하기 위해 ‘보다/보게 되다’로 자연스럽게 처리했습니다.
- source_word: אֶרֶץ מַרְחַקִּים
  english_pob_choice: a far-reaching land
  chosen_korean: 멀리까지 뻗은 땅
  alternatives_korean:
  - 먼 땅
  - 먼 곳까지 뻗은 땅
  - 먼 거리의 땅
  lexicon: HALOT
  rationale: מַרְחַקִּים의 거리·원근 이미지를 직역에 가깝게 살리면서도, 한국어 시적 문맥에서 매끄럽고 압축적인 표현인 ‘멀리까지 뻗은 땅’을 택했습니다.
theological_decisions:
- issue: ‘그 왕’의 정체를 특정하지 않음
  chosen_reading: 왕의 정체를 명시하지 않고 ‘그 왕’으로 유지했습니다.
  alternative_readings:
  - 히스기야로 특정
  - 메시아 왕으로 특정
  - 야훼로 특정
  rationale: 히브리어 본문은 단지 ‘왕’이라고만 말하므로, 본문이 열어 둔 해석의 긴장을 보존하기 위해 특정 인물로 좁히지 않았습니다.
  doctrine_reference: 본문의 모호성을 보존하여 해석 전통을 선취하지 않음
