id: ISA.33.15
reference: Isaiah 33:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
  footnotes:
  - marker: a
    text: Or 'walks in righteous deeds' or 'walks in justice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'profit from oppression.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'bloods,' an idiom for bloodshed or bloodguilt.
    reason: cultural_note
translation:
  language: ko
  text: 의로 행하고 정직한 것을 말하며, 착취로 얻는 이익을 멸시하고, 뇌물을 잡지 않으려고 손을 털며, 피 흘림에 관한 말을 듣지 않으려고 귀를 막고, 악을 보지 않으려고 눈을 감는 사람—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘피들’은 관용적으로 피 흘림이나 피의 책임을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  english_pob_choice: walks in righteousness
  chosen_korean: 의로 행하고
  alternatives_korean:
  - 의로운 행실로 걷고
  - 의롭게 살아가고
  - 의로운 일을 행하고
  lexicon: HALOT
  rationale: הלך의 윤리적 분사 용법은 단순 이동보다 삶의 방식과 행실을 가리키므로, 한국어에서는 ‘의로 행하다’로 자연스럽게 풀어 원문의 비유를 살렸습니다.
- source_word: וְדֹבֵר מֵישָׁרִים
  english_pob_choice: speaks what is upright
  chosen_korean: 정직한 것을 말하며
  alternatives_korean:
  - 바른 것을 말하며
  - 올곧은 말을 하며
  - 공정한 것을 말하며
  lexicon: HALOT
  rationale: מֵישָׁרִים는 곧음, 바름, 정직함의 뜻을 가지므로 ‘정직한 것’이 가장 자연스럽고, 개인의 도덕적 발화를 잘 드러냅니다.
- source_word: בֶּצַע מַעֲשַׁקּוֹת
  english_pob_choice: gain from extortions
  chosen_korean: 착취로 얻는 이익
  alternatives_korean:
  - 억압으로 얻는 이익
  - 갈취로 얻는 이익
  - 부정한 이익
  lexicon: HALOT
  rationale: בצע는 부당한 이익을, מעשקות는 착취/억압 행위를 가리키므로, 둘의 결합을 간결하게 살려 ‘착취로 얻는 이익’으로 옮겼습니다.
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  english_pob_choice: shakes his hands free from taking a bribe
  chosen_korean: 뇌물을 잡지 않으려고 손을 털며
  alternatives_korean:
  - 뇌물을 받지 않으려고 손을 떨치며
  - 뇌물을 잡는 일을 거부하며
  - 뇌물을 받지 않으려고 손을 씻으며
  lexicon: HALOT
  rationale: 손을 ‘털다’는 부정한 것을 떨쳐 버린다는 제스처를 자연스럽게 전달하고, שחד를 ‘뇌물’로 옮겨 수수 자체를 분명히 했습니다.
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  english_pob_choice: stops his ears from hearing of bloodshed
  chosen_korean: 피 흘림에 관한 말을 듣지 않으려고 귀를 막고
  alternatives_korean:
  - 피 흘림을 듣지 않으려고 귀를 막고
  - 피 흘림의 소식을 듣지 않으려고 귀를 막고
  - 피를 흘리게 하는 말을 듣지 않으려고 귀를 막고
  lexicon: HALOT
  rationale: דמים는 문자적으로 ‘피들’이지만 관용적으로 피 흘림/유혈을 뜻하므로, POB의 취지를 따라 ‘피 흘림에 관한 말’로 풀어 비유와 의미를 함께 살렸습니다.
theological_decisions:
- issue: 히브리어 분사 연쇄의 주어 처리
  chosen_reading: ‘사람—’으로 마무리하고 앞의 동사들을 분사형으로 나열하여, 이 묘사가 한 사람의 성품을 규정하는 방식임을 살렸습니다.
  alternative_readings:
  - ‘그는 …합니다’ 식의 완전한 서술문
  - ‘의롭게 사는 자는 …’
  - ‘누구든지 …하는 사람은’
  rationale: 원문은 자격 있는 사람의 윤리적 특성을 분사 연쇄로 제시하므로, 한국어도 이를 목록형 묘사로 유지하는 편이 의미와 긴장을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: דָמִים의 의미 범위
  chosen_reading: ‘피 흘림’으로 옮겨 유혈과 살해에 대한 거리두기를 드러냈습니다.
  alternative_readings:
  - ‘피들’
  - ‘혈흔’
  - ‘피 흘리는 일’
  rationale: 히브리어 관용구는 단순한 혈액이 아니라 폭력적 유혈 행위를 가리키므로, 한국어에서도 그 도덕적·사회적 함의를 분명히 해야 합니다.
  doctrine_reference: HALOT / 문맥상 관용구
