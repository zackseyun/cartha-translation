id: ISA.33.18
reference: Isaiah 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִבְּ/ךָ֖ יֶהְגֶּ֣ה אֵימָ֑ה אַיֵּ֤ה סֹפֵר֙ אַיֵּ֣ה שֹׁקֵ֔ל אַיֵּ֖ה סֹפֵ֥ר אֶת הַ/מִּגְדָּלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
  footnotes:
  - marker: a
    text: Or 'will ponder terror' or 'will muse on terror.' The Hebrew verb can denote inward musing or low utterance.
    reason: lexical_alternative
  - marker: b
    text: '''The scribe ... the one who weighs ... the one who counts the towers'' likely refers to foreign officials involved in assessment, tribute, or siege calculations.'
    reason: cultural_note
translation:
  language: ko
  text: 당신의 마음은 두려움을 묵상할 것입니다. “그 서기관은 어디 있느냐? 저울질하는 자는 어디 있느냐? 망대들을 세는 자는 어디 있느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘묵상할 것입니다’는 이 동사가 내면의 되새김이나 낮은 중얼거림까지 아울러 가질 수 있다는 점을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서기관 … 저울질하는 자 … 망대들을 세는 자’는 조공, 측량, 포위 계산에 관여한 외국 관리들을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  english_pob_choice: your heart
  chosen_korean: 당신의 마음
  alternatives_korean:
  - 당신의 심장
  - 당신의 속마음
  lexicon: HALOT
  rationale: לֵב/לֵבָב은 생각과 숙고를 포함하는 내면 전체를 가리키므로, 표준적이면서도 원문의 인간학적 표현을 살려 ‘마음’으로 옮겼습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: will meditate on
  chosen_korean: 묵상할 것입니다
  alternatives_korean:
  - 되뇌게 될 것입니다
  - 곰곰이 생각할 것입니다
  - 중얼거리게 될 것입니다
  lexicon: HALOT
  rationale: הגה는 낮게 읊조림과 숙고를 함께 가리킬 수 있지만, 여기서는 공포를 안에서 되새기는 뜻이 자연스러워 ‘묵상하다’로 옮겼습니다.
- source_word: סֹפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 기록하는 사람
  - 계산관
  lexicon: HALOT
  rationale: ספר는 기록자이자 계산자를 뜻할 수 있으나, 문맥상 행정·군사적 직분을 가리키는 가장 익숙한 한국어 대응은 ‘서기관’입니다.
- source_word: שֹׁקֵל
  english_pob_choice: the one who weighs
  chosen_korean: 저울질하는 자
  alternatives_korean:
  - 무게를 재는 자
  - 달아보는 자
  lexicon: HALOT
  rationale: 문자적으로는 ‘무게를 달다’이므로, 특정 직함으로 굳히기보다 기능을 드러내는 ‘저울질하는 자’로 옮겨 보조금·조공의 측량 이미지를 살렸습니다.
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  english_pob_choice: the one who counts the towers
  chosen_korean: 망대들을 세는 자
  alternatives_korean:
  - 탑들을 세는 자
  - 망루들을 세는 자
  lexicon: HALOT
  rationale: ספר는 여기서 ‘세다’의 뜻이 가장 자연스럽고, מגדלים은 구체적인 ‘탑/망대’이므로 해석을 덧붙이지 않고 직역했습니다.
theological_decisions:
- issue: 수사적 질문의 반복과 공포의 회상
  chosen_reading: 이 절은 과거의 침략자들이 사라진 뒤, 예루살렘이 그 위협을 되돌아보는 조롱 섞인 회고로 읽었습니다.
  alternative_readings:
  - 미래의 심판을 예고하는 단순한 예언
  - 일반적인 지혜 격언
  rationale: 연속된 ‘어디 있느냐?’는 적대 세력의 부재를 드러내는 수사적 조롱으로 기능하므로, 역사적·문학적 긴장을 유지하는 해석이 본문에 가장 충실합니다.
  doctrine_reference: 이사야 33장 문맥상 시온의 구원과 원수의 몰락
- issue: ‘서기관/저울질하는 자/망대들을 세는 자’의 정체
  chosen_reading: 외국의 행정·군사 관리들을 가리키는 말로 보되, 본문에는 직분의 정확한 현대적 명칭을 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 유다 내부의 관리들
  - 상징적 인물군
  rationale: POB의 주석처럼 조공·측량·포위 계산에 관여한 외국 관리들을 가리키는 표현으로 이해할 수 있으나, 본문 번역은 그 가능성을 열어 두는 것이 좋습니다.
  doctrine_reference: 역사적-문학적 맥락에 따른 인물 지칭
