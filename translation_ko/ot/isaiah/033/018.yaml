  source_fidelity: 히브리어의 반복된 אַיֵּה와 세 직무 묘사는 대체로 충실히 옮겼습니다. 다만 יֶהְגֶּה는 이 문맥에서 공포를 회상하며 되새기는 뜻으로 옮기는 편이 한국어에서 더 자연스럽고, ‘묵상’이 지닌 통상적인 종교적·긍정적 연상을 피할 수 있습니다.
  naturalness: ‘당신의 마음’과 인용문 안의 ‘어디 있느냐?’는 요청된 현대 표준어 합쇼체와 다소 맞지 않습니다. ‘당신의 마음’은 현대 한국어에서 특정 대인 관계의 뉘앙스를 낼 수 있으며, 질문도 ‘어디 있습니까?’로 통일하는 편이 자연스럽습니다.
  terminology: ‘서기관’, ‘저울질하는 자’, ‘망대들을 세는 자’는 원문의 직무 표현을 과도하게 해석하지 않아 적절합니다. ‘두려움’보다 אֵימָה의 강도를 드러내는 ‘공포’가 더 알맞습니다.
