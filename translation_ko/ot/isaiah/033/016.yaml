id: ISA.33.16
reference: Isaiah 33:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים מִשְׂגַּבּ֑/וֹ לַחְמ֣/וֹ נִתָּ֔ן מֵימָ֖י/ו נֶאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
  footnotes:
  - marker: a
    text: Or 'his stronghold' for 'his refuge'; the Hebrew term denotes a secure, elevated place of protection.
    reason: lexical_alternative
  - marker: b
    text: Or 'his water will not fail.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 높은 곳에 거할 것이며, 바위 요새들이 그의 높은 피난처가 될 것입니다[a]. 그의 빵은 주어질 것이며, 그의 물은 끊기지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 요새’로 옮길 수 있습니다. 히브리어는 높고 안전한 보호처를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 물은 확실할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרוֹמִים
  english_pob_choice: on the heights
  chosen_korean: 높은 곳에
  alternatives_korean:
  - 높은 곳들에
  - 고지대에
  - 높은 데에
  lexicon: HALOT
  rationale: 복수형 명사 ‘높은 곳들/높은 곳’의 공간적 이미지를 살리되, 한국어에서는 관용적으로 ‘높은 곳에’가 가장 자연스럽고 간결합니다.
- source_word: מְצָדוֹת סְלָעִים
  english_pob_choice: rocky fortresses
  chosen_korean: 바위의 요새들
  alternatives_korean:
  - 바위 요새들
  - 바위 절벽의 요새들
  - 돌바위의 견고한 성채들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘바위의 요새들’로, 험하고 방어 가능한 암벽/절벽의 이미지를 유지하면서도 한국어 문장 흐름을 해치지 않게 했습니다.
- source_word: מִשְׂגַּבּוֹ
  english_pob_choice: his refuge
  chosen_korean: 그의 피난처
  alternatives_korean:
  - 그의 높은 피난처
  - 그의 요새
  - 그의 안전한 높은 곳
  lexicon: HALOT
  rationale: 이 단어의 핵심인 보호 기능을 드러내기 위해 ‘피난처’를 택했습니다. 앞의 ‘바위의 요새들’이 높이/견고함을 이미 담고 있어 중복을 줄였습니다.
- source_word: לַחְמוֹ
  english_pob_choice: his bread
  chosen_korean: 그의 빵
  alternatives_korean:
  - 그의 떡
  - 그의 음식
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 유지해 공급의 상징을 살렸습니다. 한국어에서는 ‘빵’이 현대적으로 자연스럽고, ‘음식’보다 원문의 구체성이 잘 보존됩니다.
- source_word: מֵימָיו נֶאֱמָנִים
  english_pob_choice: his water will be sure
  chosen_korean: 그의 물은 끊기지 않을 것입니다
  alternatives_korean:
  - 그의 물은 확실할 것입니다
  - 그의 물은 믿을 만할 것입니다
  - 그의 물은 부족함이 없을 것입니다
  lexicon: HALOT
  rationale: ‘נֶאֱמָנִים’의 신뢰성/확실성을 한국어 관용구 ‘끊기지 않을 것입니다’로 옮겨, 물 공급이 안정적이고 실패하지 않는다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 16절의 ‘그’(הוּא)의 지시 대상
  chosen_reading: 앞 절(33:15)의 의롭게 행하는 사람, 곧 의인에게 주어지는 약속으로 읽었습니다.
  alternative_readings:
  - 더 일반적인 의인의 복으로 읽기
  - 남은 자에 대한 유형적 적용으로 읽기
  rationale: 문맥상 15절의 인물을 이어받는 약속이므로, 여기서 메시아나 하나님으로 돌리지 않고 싱글 남성 대명사의 지시를 그대로 유지했습니다.
  doctrine_reference: 문맥 우선 원칙; 성별-정확 번역 원칙
- issue: ‘빵’과 ‘물’의 공급 약속
  chosen_reading: 물질적 생존에 필요한 기본 공급이 하나님의 신실하심으로 보장된다는 약속으로 읽었습니다.
  alternative_readings:
  - 상징적으로 영적 양식과 생수로 읽기
  - 일반적 풍요의 은유로 읽기
  rationale: 본문은 실제 생계의 기본 요소를 말하므로, 영적으로 과도하게 비유화하지 않고 원문의 약속을 그대로 살렸습니다.
  doctrine_reference: 본문이 말하는 만큼만 말하기
