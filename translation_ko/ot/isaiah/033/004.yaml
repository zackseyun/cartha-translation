source:
  edition: WLC
  text: וְ/אֻסַּ֣ף שְׁלַלְ/כֶ֔ם אֹ֖סֶף הֶֽ/חָסִ֑יל כְּ/מַשַּׁ֥ק גֵּבִ֖ים שׁוֹקֵ֥ק בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/004.yaml
  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
  footnotes:
  - marker: a
    text: Or 'like the gathering of the devouring locust'; the Hebrew term חָסִיל can denote a particular kind or stage of locust.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew in the second comparison is difficult. 'Like the rushing of swarms' could also be rendered 'like an attack of locusts' or 'like locusts rushing about.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신의 전리품은 메뚜기들의 모음처럼 모일 것이며, 떼들의 돌진처럼 그들이 그것에 달려듭니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메뚜기들의 모음’은 히브리어의 반복 강조를 살린 것으로, 문자적으로는 ‘메뚜기의 모음/모임’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘떼들의 돌진’은 어려운 두 번째 비유를 풀이한 번역입니다. 더 직역하면 ‘무리의 급습’ 또는 ‘메뚜기 떼의 이리저리 날뛰는 움직임’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסַּף
  english_pob_choice: And ... will be gathered
  chosen_korean: 그리고 ... 모일 것이며
  alternatives_korean:
  - 그리고 ... 모으일 것이며
  - 그리하여 ... 모일 것이며
  lexicon: HALOT
  rationale: אסף의 수동/미래적 의미를 문맥에 맞게 ‘모이다’로 옮기고, 접속적 ו는 간결한 ‘그리고’로 살렸습니다.
- source_word: שְׁלַלְכֶם
  english_pob_choice: your spoil
  chosen_korean: 당신의 전리품
  alternatives_korean:
  - 당신의 노획물
  - 당신의 노획품
  lexicon: HALOT
  rationale: 전쟁 문맥의 שׁלל은 ‘전리품’이 한국어에서 가장 자연스럽고 문맥을 정확히 드러냅니다.
- source_word: אֹסֶף הֶחָסִיל
  english_pob_choice: the gathering of locusts
  chosen_korean: 메뚜기들의 모음처럼
  alternatives_korean:
  - 메뚜기들의 모임처럼
  - 메뚜기 떼가 모이는 것처럼
  lexicon: HALOT
  rationale: אֹסֶף의 반복 강조를 ‘모음’으로 살리고, הֶחָסִיל은 문맥상 일반적인 ‘메뚜기들’로 옮겨 의미를 분명히 했습니다.
- source_word: כְּמַשַּׁק גֵּבִים שׁוֹקֵק
  english_pob_choice: like the rushing of swarms ... they rush
  chosen_korean: 떼들의 돌진처럼 그들이 ... 달려듭니다
  alternatives_korean:
  - 무리들의 쇄도처럼 그들이 ... 달려듭니다
  - 무리의 돌진처럼 그들이 ... 몰려듭니다
  lexicon: HALOT
  rationale: 희귀한 מַשַּׁק과 지속적 움직임을 나타내는 שׁוֹקֵק을 한국어에서 생생한 ‘돌진/달려듭니다’로 재현했습니다.
