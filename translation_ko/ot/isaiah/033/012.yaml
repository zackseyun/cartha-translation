id: ISA.33.12
reference: Isaiah 33:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֥וּ עַמִּ֖ים מִשְׂרְפ֣וֹת שִׂ֑יד קוֹצִ֥ים כְּסוּחִ֖ים בָּ/אֵ֥שׁ יִצַּֽתּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
  footnotes:
  - marker: a
    text: Or 'they will ignite' / 'they will be kindled.' The Hebrew verb can emphasize catching fire as well as being consumed by it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 민족들은 석회가 타서 된 것과 같이 될 것입니다. 잘려 나간 가시덤불처럼, 그들은 불 속에서 타 버릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 불붙을 것입니다’ / ‘점화될 것입니다.’ 히브리어 동사는 불이 붙는 시작과 그것에 의해 소진되는 결과를 모두 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ / will become
  english_pob_choice: And ... will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되어 있을 것입니다
  lexicon: HALOT
  rationale: היה가 판결의 결과 상태를 가리킬 때는 단순 존재보다 변화된 결과를 나타내는 ‘되다’가 자연스럽습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 민족들은
  alternatives_korean:
  - 백성들은
  - 나라들은
  lexicon: HALOT
  rationale: 복수 עַמִּים의 집단적 범위를 살리면서도, 심판 맥락에서 특정 한 민족이 아닌 여러 집단을 가리키는 표현으로 ‘민족들’이 적절합니다.
- source_word: מִשְׂרְפוֹת שִׂיד
  english_pob_choice: burnings of lime
  chosen_korean: 석회가 타서 된 것
  alternatives_korean:
  - 석회의 불타는 것
  - 석회 불타는 것
  lexicon: HALOT
  rationale: 히브리어의 압축된 비유를 한국어에서 그대로 어색하게 옮기기보다, 석회가 불에 의해 생성된 잿빛 폐허의 이미지를 드러내는 표현으로 전달했습니다.
- source_word: יִצַּתּוּ
  english_pob_choice: they will be burned
  chosen_korean: 타 버릴 것입니다
  alternatives_korean:
  - 점화될 것입니다
  - 불붙을 것입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘불붙다/타다’와 ‘태우다’의 양면이 있으나, 여기서는 심판 이미지에서 소진되는 결과를 드러내는 ‘타 버리다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 심판 비유의 강도 유지
  chosen_reading: 가시덤불과 석회의 이미지를 약화하지 않고, 소멸과 파괴의 감각이 분명하게 드러나도록 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘사라질 것입니다’로 옮김
  - 중립적으로 ‘불에 타게 될 것입니다’로 옮김
  rationale: 본문은 단순한 소멸이 아니라 전면적인 파괴를 말하므로, 시적 심판의 강도를 유지하는 번역이 필요합니다.
  doctrine_reference: 사 33:12의 심판 신탁 문맥
- issue: חֲרָךְ/점화 가능성의 여지
  chosen_reading: 본문 각주로 ‘타 버리다’ 외에 ‘불붙다/점화되다’의 가능성을 열어 두었습니다.
  alternative_readings:
  - 본문만 ‘타 버릴 것입니다’로 확정
  - ‘불붙을 것입니다’로만 번역
  rationale: 히브리어 동사는 붙는 불의 시작과 타 버리는 결과를 모두 환기할 수 있으므로, 각주로 역동성을 보존했습니다.
  doctrine_reference: 히브리어 동사 יִצַּתּוּ의 어휘 범위
