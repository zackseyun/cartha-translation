  source_fidelity: 수정이 필요합니다. מִשְׂרְפוֹת שִׂיד는 석회와 관련된 ‘불탐/석회 굽는 불’의 압축된 심판 비유인데, 초안의 ‘석회가 타서 된 것’은 석회 자체가 타서 생성된다는 뜻으로 읽혀 원문의 이미지를 부정확하게 만듭니다. 또한 כְּסוּחִים은 ‘잘려 나간’보다 ‘베어진’이 자연스럽고 직접적입니다.
  naturalness: ‘석회가 타서 된 것’은 현대 한국어에서 의미가 불명확하고 부자연스럽습니다. ‘석회를 굽는 불더미처럼’은 원문의 압축성을 어느 정도 유지하면서 심판의 열기와 파괴 이미지를 자연스럽게 전달합니다. ‘불 속에서 탈 것입니다’도 합쇼체에 맞고 과도한 완료·소진 의미를 덧붙이지 않습니다.
  terminology: ‘민족들’, ‘가시덤불’, ‘불’은 적절합니다. יִצַּתּוּ는 문맥상 ‘탈 것입니다’로 옮기되, ‘불붙을 것입니다’라는 어휘적 가능성을 각주에 보존하는 것이 타당합니다. ‘점화될 것입니다’는 기계적·기술적 어감이 강하므로 제외합니다.
  issues:
