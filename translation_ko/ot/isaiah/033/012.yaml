    rationale: כְּסוּחִים은 베어지거나 잘린 상태를 뜻합니다. ‘베어진 가시덤불’이 간결하고 자연스럽습니다.
  - severity: low
    issue: 각주의 ‘점화될 것입니다’
    rationale: 히브리어의 ‘불붙다’ 가능성을 나타낼 수는 있으나, 한국어 성서 문체에서는 기술적 표현으로 들립니다. ‘불붙을 것입니다’만으로 어휘적 대안을 충분히 보존할 수 있습니다.
