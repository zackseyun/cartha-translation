revisions:
- from: 그리고 민족들은 석회가 타서 된 것과 같이 될 것입니다. 잘려 나간 가시덤불처럼, 그들은 불 속에서 타 버릴 것입니다.[a]
  to: 그리고 민족들은 석회를 굽는 불더미처럼 될 것이며, 베어진 가시덤불처럼 불 속에서 탈 것입니다.[a]
  rationale: 본문은 민족들이 석회 굽기의 불과 베어진 가시덤불의 불탐에 비유되어 심판을 받는다는 압축된 시적 표현입니다. 수정문은 석회가 ‘타서 된 물질’이라는 부정확한 인상을 피하고, 두 비유의 불타는 이미지를 유지합니다. יִצַּתּוּ의 어휘적 폭은 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:41Z'
