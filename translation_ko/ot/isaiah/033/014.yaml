id: ISA.33.14
reference: Isaiah 33:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּחֲד֤וּ בְ/צִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים מִ֣י יָג֣וּר לָ֗/נוּ אֵ֚שׁ אוֹכֵלָ֔ה מִי יָג֥וּר לָ֖/נוּ מוֹקְדֵ֥י עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
  footnotes:
  - marker: a
    text: Or “the hypocrites.” The Hebrew term can denote those who are impious or irreligious, not only those who are insincere.
    reason: lexical_alternative
  - marker: b
    text: Or “Who among us can sojourn.” The Hebrew verb can mean “sojourn” or “dwell/remain.”
    reason: lexical_alternative
  - marker: c
    text: “A consuming fire” echoes biblical language for God's holy and judging presence; compare Deut 4:24; Heb 12:29.
    reason: cross_reference
  - marker: d
    text: Or “eternal burnings” or “perpetual flames.”
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 죄인들은 두려워하며, 경건하지 않은 자들은 떨림에 사로잡혔습니다. "우리 가운데 누가 삼키는 불과 함께 살 수 있겠습니까? 우리 가운데 누가 영원한 불길과 함께 살 수 있겠습니까?"[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘위선자들’보다 신앙적으로 불경건한 자들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 גור는 ‘거하다’ 또는 ‘잠시 머물다/체류하다’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '‘삼키는 불’은 하나님의 거룩하고 심판하시는 임재를 떠올리게 하는 성경적 표현입니다. 비교: 신 4:24; 히 12:29.'
    reason: cross_reference
  - marker: d
    text: ‘영원한 불길’은 ‘영원한 불타오름’ 또는 ‘끝없는 불길’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאִים
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄인들
  - 죄인들 가운데
  lexicon: HALOT
  rationale: 표준적인 죄의식을 지닌 자들을 가리키는 복수명사로 옮겼습니다.
- source_word: חֲנֵפִים
  english_pob_choice: the godless
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 불경건한 자들
  - 위선자들
  lexicon: HALOT
  rationale: 히브리어는 단순한 '위선자'보다 신앙적으로 불경건하고 하나님을 외면한 자들을 폭넓게 가리킬 수 있으므로, 본문 문맥에 맞게 직역적이면서도 의미를 좁히지 않는 표현을 택했습니다.
- source_word: אָחֲזָה רְעָדָה
  english_pob_choice: trembling has seized
  chosen_korean: 떨림에 사로잡혔습니다
  alternatives_korean:
  - 떨림이 사로잡혔습니다
  - 떨림이 덮쳤습니다
  - 떨림이 붙들었습니다
  lexicon: HALOT
  rationale: ‘사로잡다’로 동사+명사 결합의 강한 포착 이미지를 살렸습니다.
- source_word: מִי יָגוּר לָנוּ
  english_pob_choice: Who among us can dwell
  chosen_korean: 우리 가운데 누가 … 함께 살 수 있겠습니까
  alternatives_korean:
  - 우리 가운데 누가 … 함께 거할 수 있겠습니까
  - 우리 가운데 누가 … 함께 머물 수 있겠습니까
  - 우리 가운데 누가 …와 함께 거주할 수 있겠습니까
  lexicon: HALOT
  rationale: גור의 ‘거하다/살다/머물다’ 의미를 반영하되, 현대 한국어에서 자연스러운 질문 형식으로 옮겼습니다.
- source_word: אֵשׁ אוֹכֵלָה
  english_pob_choice: a consuming fire
  chosen_korean: 삼키는 불
  alternatives_korean:
  - 삼키는 불
  - 소멸하는 불
  - 사르는 불
  lexicon: HALOT
  rationale: 불이 ‘먹어치우다/삼키다’는 동사적 뉘앙스를 살려 심판과 거룩한 임재의 위력을 직접적으로 표현했습니다.
- source_word: מוֹקְדֵי עוֹלָם
  english_pob_choice: everlasting burnings
  chosen_korean: 영원한 불길
  alternatives_korean:
  - 영원한 불길
  - 끝없는 불타오름
  - 영구한 불길
  lexicon: HALOT
  rationale: 복수형 ‘불타는 것들/불길들’의 이미지를 한국어에서 자연스럽게 전달하면서 עולם의 지속성을 반영했습니다.
theological_decisions:
- issue: ‘삼키는 불’과 ‘영원한 불길’의 신학적 지시 대상
  chosen_reading: 하나님의 거룩하고 심판하시는 임재를 불의 비유로 나타낸 것으로 보존했습니다.
  alternative_readings:
  - 보다 좁게는 악인에 대한 심판의 불로만 볼 수 있습니다.
  - 성전 제단 불의 상징으로만 볼 수 있습니다.
  rationale: 이사야의 문맥은 거룩하신 야훼의 임재가 죄인에게는 두렵고 위험하다는 점을 드러내며, 번역은 그 은유를 본문 수준에서 유지해야 합니다.
  doctrine_reference: 문맥이 해소하지 않는 긴장을 보존
- issue: ‘우리 가운데’의 공동체적 화자
  chosen_reading: 질문은 시온 공동체 내부에서 누가 이런 거룩한 임재 앞에 설 수 있는지를 묻는 형식으로 유지했습니다.
  alternative_readings:
  - 단순한 일반론적 질문으로 볼 수 있습니다.
  rationale: 히브리어의 1인칭 복수는 공동체 안에서의 자가 심문을 드러내므로, 이를 살려야 다음 절과의 연결이 분명해집니다.
  doctrine_reference: 문맥적 화자 보존
