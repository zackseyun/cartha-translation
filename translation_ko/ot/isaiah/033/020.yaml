source:
  edition: WLC
  text: חֲזֵ֣ה צִיּ֔וֹן קִרְיַ֖ת מֽוֹעֲדֵ֑/נוּ עֵינֶי/ךָ֩ תִרְאֶ֨ינָה יְרוּשָׁלִַ֜ם נָוֶ֣ה שַׁאֲנָ֗ן אֹ֤הֶל בַּל יִצְעָן֙ בַּל יִסַּ֤ע יְתֵֽדֹתָי/ו֙ לָ/נֶ֔צַח וְ/כָל חֲבָלָ֖י/ו בַּל יִנָּתֵֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
  footnotes:
  - marker: a
    text: Or 'the city of our appointed assemblies' or 'the city of our festivals.' The Hebrew מוֹעֲדֵנוּ can refer to appointed times or gatherings, especially in worship contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'a secure habitation.' The adjective can denote being at ease, undisturbed, or secure.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew uses tent imagery for Jerusalem''s permanence: its stakes will not be pulled up and its ropes will not be broken.'
    reason: cultural_note
translation:
  language: ko
  text: 시온을 바라보십시오. 우리 절기의 도시를. 당신의 눈이 예루살렘을 볼 것입니다. 예루살렘은 고요한 거처, 옮겨지지 않는 천막이며, 그 말뚝들은 영원히 뽑히지 않고, 그 줄 하나도 끊어지지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 절기의 도시’는 מוֹעֵד의 예배·절기 맥락을 반영한 번역입니다. 직역하면 ‘우리의 정해진 때/모임의 도시’가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고요한’은 שַׁאֲנָן의 평온·무동요 의미를 살린 번역입니다. ‘안온한’, ‘평안한’도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: 천막의 말뚝과 줄 이미지는 예루살렘의 견고함을 나타냅니다. 말뚝이 뽑히지 않고 줄이 끊어지지 않는다는 표현이 그 비유를 그대로 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  english_pob_choice: Look upon
  chosen_korean: 바라보십시오
  alternatives_korean:
  - 보십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형의 직접적 촉구를 살리되, 시각적 응시의 뉘앙스를 자연스러운 공손체로 전달합니다.
- source_word: קִרְיַת מוֹעֲדֵנוּ
  english_pob_choice: the city of our appointed feasts
  chosen_korean: 우리 절기의 도시
  alternatives_korean:
  - 우리의 정해진 때의 도시
  - 우리의 모임의 도시
  - 우리의 절기 모임의 도시
  lexicon: HALOT
  rationale: מוֹעֵד는 정해진 때이면서 예배 절기/모임을 가리킬 수 있어, 여기서는 시온-예루살렘 문맥에 맞는 ‘절기’로 압축해 공동체적 예배 감각을 드러냅니다.
- source_word: נָוֶה שַׁאֲנָן
  english_pob_choice: a quiet habitation
  chosen_korean: 고요한 거처
  alternatives_korean:
  - 평온한 거처
  - 안온한 거처
  - 조용한 거주지
  lexicon: HALOT
  rationale: נָוֶה의 거처/주거 의미와 שַׁאֲנָן의 평온·무동요 의미를 함께 살려, 문맥의 안정성과 평안을 간결하게 전달합니다.
- source_word: בַּל יִצְעָן / בַּל יִסַּע
  english_pob_choice: will not be moved / will never be pulled up
  chosen_korean: 옮겨지지 않는 / 영원히 뽑히지 않고
  alternatives_korean:
  - 흔들리지 않는 / 결코 뽑히지 않고
  - 이동되지 않는 / 영원히 걷히지 않고
  lexicon: HALOT
  rationale: 천막 이미지에서 ‘이동/철거’의 물리적 감각을 유지하면서, ‘영원히’로 לָנֶצַח의 지속성을 자연스럽게 옮겼습니다.
- source_word: וְכָל חֲבָלָיו
  english_pob_choice: and none of its ropes
  chosen_korean: 그 줄 하나도
  alternatives_korean:
  - 그 밧줄 하나도
  - 그 줄들 모두
  lexicon: HALOT
  rationale: חֲבָלִים는 천막 줄/밧줄을 가리키므로, 독자에게 즉각 이해되는 ‘줄’로 옮기되 ‘하나도’로 전면 부정을 분명히 했습니다.
theological_decisions:
- issue: 시온/예루살렘 천막 이미지의 해석 범위
  chosen_reading: 예루살렘의 안전하고 흔들리지 않는 거처라는 이미지를 보존하되, 이를 교회론적·종말론적으로 미리 해석해 굳히지 않았습니다.
  alternative_readings:
  - 교회를 직접 가리키는 상징으로 읽기
  - 역사적 예루살렘의 회복만을 가리키는 것으로 제한하기
  rationale: 본문은 시온과 예루살렘을 견고한 천막으로 묘사하므로, 번역은 그 비유를 그대로 살리고 해석의 긴장은 남겨 두는 것이 좋습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
