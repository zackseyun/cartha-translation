  lexicon: HALOT
  rationale: חֲבָלִים는 천막 줄/밧줄을 가리키므로, 독자에게 즉각 이해되는 ‘줄’로 옮기되 ‘하나도’로 전면 부정을 분명히 했습니다.
theological_decisions:
- issue: 시온/예루살렘 천막 이미지의 해석 범위
  chosen_reading: 예루살렘의 안전하고 흔들리지 않는 거처라는 이미지를 보존하되, 이를 교회론적·종말론적으로 미리 해석해 굳히지 않았습니다.
  alternative_readings:
  - 교회를 직접 가리키는 상징으로 읽기
  - 역사적 예루살렘의 회복만을 가리키는 것으로 제한하기
  rationale: 본문은 시온과 예루살렘을 견고한 천막으로 묘사하므로, 번역은 그 비유를 그대로 살리고 해석의 긴장은 남겨 두는 것이 좋습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
