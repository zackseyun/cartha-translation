id: ISA.33.22
reference: Isaiah 33:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
  footnotes:
  - marker: a
    text: Hebrew 'our lawgiver' can also be rendered 'our legislator' or, in some contexts, 'our ruler.'
    reason: lexical_alternative
  - marker: b
    text: The divine name YHWH is rendered 'the LORD' here; alternatively, it could be transliterated 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 우리의 재판관이시며 우리를 위한 법을 세우시는 이이시며 우리의 왕이십니다. 그가 우리를 구원하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법을 세우시는 이’는 히브리어 מְחֹקֵק의 뜻을 풀어 옮긴 것으로, 문자적으로는 ‘입법자’ 또는 문맥에 따라 ‘통치자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 언약명 הטרא그람마톤을 직접 사용하므로, 한국어에서도 титла가 아닌 고유명사로 옮겨 이름성을 보존했습니다.
- source_word: שֹׁפְטֵנוּ
  english_pob_choice: our judge
  chosen_korean: 우리의 재판관
  alternatives_korean:
  - 우리의 심판자
  - 우리의 판관
  lexicon: HALOT
  rationale: 법정적 의미를 살리면서도 현대 한국어에서 자연스러운 직함으로 옮겼습니다. '재판관'이 'judge'의 공적 직무를 가장 분명하게 드러냅니다.
- source_word: מְחֹקְקֵנוּ
  english_pob_choice: our lawgiver
  chosen_korean: 우리를 위한 법을 세우시는 이
  alternatives_korean:
  - 우리의 입법자
  - 우리의 율법제정자
  - 우리의 통치자
  lexicon: HALOT
  rationale: 히브리어는 단순한 '통치자'보다 법을 제정·규정하는 분을 가리키므로, 한국어에서는 '법을 세우시는 이'로 풀어 기능을 직접 드러냈습니다.
- source_word: יוֹשִׁיעֵנוּ
  english_pob_choice: will save us
  chosen_korean: 우리를 구원하실 것입니다
  alternatives_korean:
  - 우리를 건지실 것입니다
  - 우리를 구해 주실 것입니다
  lexicon: HALOT
  rationale: 히필 미완료형의 미래적 구원 행위를 살리기 위해 '구원하실 것입니다'로 옮겼습니다. 시편적·예언적 구원 어휘와도 연결됩니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥상 타이틀이 아니라 하나님의 고유한 언약 이름이 반복되므로, 본문에서 그 이름성을 유지하는 것이 신학적으로도 더 정확합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מְחֹקְקֵנוּ의 삼중 칭호 구조
  chosen_reading: 재판관—법을 세우시는 이—왕
  alternative_readings:
  - 심판자—입법자—왕
  - 재판관—통치자—왕
  rationale: 본문은 하나님을 재판관, 법 제정자, 왕으로 병렬 제시하는 정치-신학적 구조를 갖습니다. 중간 항목을 단순한 '통치자'로 약화시키지 않기 위해 기능적 표현을 채택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
