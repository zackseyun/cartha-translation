  source_fidelity: 첫 구절의 הָמוֹן은 이 문맥에서 ‘무리’ 자체라기보다 요란한 소리·소란을 가리키는 것이 더 적절합니다. 또한 מֵרֹמְמֻתֶךָ는 ‘당신의 일어섬/높아지심’이라는 명사적 표현이지만, 문맥상 ‘당신께서 일어서시자’로 자연스럽게 옮길 수 있으며, 각주에서 ‘높아지심’의 가능성을 보존해야 합니다.
  naturalness: ‘무리의 소리로 인해’는 한국어로 다소 어색하고 의미도 군중 자체 쪽으로 기웁니다. ‘소란의 소리에’와 ‘당신께서 일어서시자’는 현대 표준어 합쇼체 문장으로 자연스럽습니다.
  terminology: עַמִּים과 גּוֹיִם의 어휘적 구별은 ‘민족들’과 ‘나라들’로 유지할 수 있습니다. 2인칭 호칭은 본문에서 보존하되, 존대 선어말을 사용한 ‘당신께서’는 문맥상 가장 유력한 신적 호칭을 반영합니다. 각주는 다른 가능성을 명시합니다.
