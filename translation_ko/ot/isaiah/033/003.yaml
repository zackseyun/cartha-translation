- from: 무리의 소리로 인해 민족들이 도망쳤습니다. 당신이 일어서심으로 인해 나라들이 흩어졌습니다.[a][b]
  to: 소란의 소리에[a] 민족들이 달아났습니다. 당신께서 일어서시자[b] 나라들이 흩어졌습니다.
  rationale: ‘소란의 소리’는 מִקּוֹל הָמוֹן의 소리와 소란이라는 의미를 자연스럽게 반영합니다. נָדְדוּ는 심판과 군사적 위협의 문맥에 맞추어 ‘달아났습니다’로 옮겼습니다. ‘당신께서 일어서시자’는 מֵרֹמְמֻתֶךָ의 문맥상 능동적 함의를 반영하면서, ‘높아지심’이라는 다른 해석 가능성은 각주에 보존합니다. 각주 표지도 해당 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:41Z'
