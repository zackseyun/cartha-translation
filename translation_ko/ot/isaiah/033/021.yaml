source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
  footnotes:
  - marker: a
    text: Or 'the majestic LORD will be there for us, a place of rivers and streams.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'broad of hands,' an idiom for very wide waterways.
    reason: cultural_note
  - marker: c
    text: Or 'oared ship'; the Hebrew refers to a vessel used in active navigation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 거기에서 위엄하신 야훼께서는 우리에게 강들과 넓은 물줄기가 있는 곳이 되실 것입니다. 노를 젓는 배도 그곳으로 가지 못하고, 위력 있는 배도 그곳을 지나갈 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘넓은 물줄기’는 히브리어의 문자적 표현인 ‘손들의 넓이’를 관용적으로 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘노를 젓는 배’는 노로 추진하는 선박을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 문맥상 앞선 위협과 대비되는 전환을 나타내므로, 자연스러운 한국어 접속사로 ‘그러나’가 가장 적절합니다.
- source_word: אַדִּיר יְהוָה
  english_pob_choice: the LORD in majesty
  chosen_korean: 야훼께서는 … 되실 것입니다
  alternatives_korean:
  - 위엄 있는 야훼께서는 … 되실 것입니다
  - 장엄하신 야훼께서는 … 되실 것입니다
  lexicon: HALOT
  rationale: אַדִּיר의 핵심은 ‘위엄/장엄/위력’이므로, 본문 전체의 비유를 살려 형용사를 직접 덧붙이기보다 뒤의 보호적 이미지로 그 위엄을 드러내는 방식으로 옮겼습니다.
- source_word: מְקוֹם נְהָרִים יְאֹרִים רַחֲבֵי יָדָיִם
  english_pob_choice: a place of rivers, of broad streams
  chosen_korean: 강들의 곳, 넓은 시내들의 곳
  alternatives_korean:
  - 강들과 넓은 시내들의 장소
  - 강과 넓은 시내의 자리
  lexicon: HALOT
  rationale: ‘מְקוֹם’의 장소성을 유지하면서, ‘넓은 시내들’로 יְאֹרִים과 ‘넓은 손들’이라는 관용구의 넓이를 한국어 관용으로 옮겼습니다.
- source_word: אֳנִי שַׁיִט
  english_pob_choice: rowing ship
  chosen_korean: 노를 젓는 배
  alternatives_korean:
  - 노젓는 배
  - 뱃노를 젓는 배
  - 노를 저어 가는 배
  lexicon: HALOT
  rationale: 활동적으로 움직이는 선박이라는 의미를 살려, 현대 한국어에서 즉시 이해되는 ‘노를 젓는 배’로 옮겼습니다.
- source_word: וְצִי אַדִּיר
  english_pob_choice: no mighty vessel
  chosen_korean: 위력 있는 배
  alternatives_korean:
  - 강한 배
  - 막강한 배
  - 큰 배
  lexicon: HALOT
  rationale: צִי와 אַדִּיר의 결합은 단순한 크기보다 힘과 위압을 강조하므로, ‘위력 있는 배’가 그 뉘앙스를 잘 드러냅니다.
theological_decisions:
- issue: 예언적 보호 이미지의 보존
  chosen_reading: 야훼께서는 우리를 위하여 강들의 곳, 넓은 시내들의 곳이 되십니다
  alternative_readings:
  - 야훼께서는 우리에게 강과 시내처럼 보호가 되십니다
  - 야훼께서는 우리를 둘러싼 강과 시내가 되십니다
  rationale: 본문은 야훼를 단순 비유의 대상이 아니라, 백성에게 안전한 ‘장소’ 자체로 제시하므로 ‘되십니다’로 직역에 가깝게 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense; do not paraphrase beyond what the source warrants'
