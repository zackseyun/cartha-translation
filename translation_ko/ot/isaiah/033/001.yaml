  rationale: 예언적 경고·탄식의 감탄사로서 직접적인 심판 어조를 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  english_pob_choice: destroyer / been destroyed / you will be destroyed
  chosen_korean: 파괴하는 자 / 파괴되지 않았고 / 파괴될 것이며
  alternatives_korean:
  - 약탈하는 자 / 약탈되지 않았고 / 약탈될 것이며
  - 훼손하는 자 / 훼손되지 않았고 / 훼손될 것이며
  lexicon: HALOT
  rationale: 동일 어근의 반복과 역전 구조를 살리기 위해 같은 ‘파괴-’ 계열을 일관되게 사용했습니다. POB가 강조한 어휘적 대칭을 한국어에서도 보존합니다.
- source_word: בּוֹגֵד / בָגְדוּ / יִבְגְּדוּ
  english_pob_choice: betrayer / they have not betrayed you / they will betray you
  chosen_korean: 배반하는 자 / 그들이 아직 너를 배반하지 않았고 / 그들도 너를 배반할 것입니다
  alternatives_korean:
  - 배신자 / 그들이 아직 너를 배신하지 않았고 / 그들도 너를 배신할 것입니다
  - 속이는 자 / 그들이 아직 너를 속이지 않았고 / 그들도 너를 속일 것입니다
  lexicon: HALOT
  rationale: 본 동사의 언약적·정치적 불성실을 반영하여 ‘배반하다’를 택했습니다. 반복되는 동사 어근을 유지해 보복적 반전을 선명하게 드러냅니다.
- source_word: כַּהֲתִמְךָ / כַּנְּלֹתְךָ לִבְגֹּד
  english_pob_choice: When you finish destroying / when you cease betraying
  chosen_korean: 네가 파괴를 끝낼 때 / 네가 배반을 그칠 때
  alternatives_korean:
  - 네가 파괴를 마칠 때 / 네가 배반을 멈출 때
  - 네가 파괴하는 일을 끝낼 때 / 네가 배반하는 일을 그칠 때
  lexicon: HALOT
  rationale: 완결·중단의 시간 부사를 자연스럽게 살리면서도 행위의 종료점을 분명히 했습니다. ‘그치다’는 예언문맥에서 행위의 중단을 간결하게 표현합니다.
theological_decisions:
- issue: 2인칭 직접 호칭과 3인칭 잔여 형태의 긴장
  chosen_reading: 본문은 파괴자/배반자를 2인칭으로 직접 꾸짖는 흐름을 따르되, 히브리어의 3인칭 흔적은 별도 주석 없이 본문 가독성을 우선해 2인칭으로 통일했습니다.
  alternative_readings:
  - 그들이 아직 그를 배반하지 않았습니다
  - 그들이 아직 그를 배반하지 않았고
  rationale: 영어 POB도 직접 호칭의 평행성을 살리기 위해 2인칭을 채택했습니다. 예언적 선언의 수사적 힘을 보존하는 선택입니다.
  doctrine_reference: 예언적 수사와 본문 평행 구조
