id: ISA.33.11
reference: Isaiah 33:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּהֲר֥וּ חֲשַׁ֖שׁ תֵּ֣לְדוּ קַ֑שׁ רוּחֲ/כֶ֕ם אֵ֖שׁ תֹּאכַלְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
  footnotes:
  - marker: a
    text: Or 'your spirit is a fire that will consume you.' Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 겨를을 심고, 지푸라기를 거둡니다[a]. 너희의 숨은 너희를 삼켜 버릴 불입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 영은 너희를 삼켜 버릴 불입니다.’ 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  english_pob_choice: you conceive
  chosen_korean: 겨를을 심고
  alternatives_korean:
  - 잉태합니다
  - 지푸라기를 잉태합니다
  lexicon: HALOT
  rationale: ‘הרה’의 임신/잉태 이미지를 한국어로 자연스럽게 살리면서, 이어지는 헛된 산출의 비유를 ‘심다’로 전달했습니다.
- source_word: חֲשַׁשׁ
  english_pob_choice: chaff
  chosen_korean: 겨
  alternatives_korean:
  - 왕겨
  - 지푸라기
  lexicon: HALOT
  rationale: 가볍고 잘 타는 부산물을 가리키는 말로, 한국어에서는 ‘겨’가 가장 짧고 시적이며 뒤의 ‘지푸라기’와 평행을 이룹니다.
- source_word: תֵּלְדוּ קַשׁ
  english_pob_choice: you give birth to stubble
  chosen_korean: 지푸라기를 거둡니다
  alternatives_korean:
  - 짚을 낳습니다
  - 짚을 출산합니다
  lexicon: HALOT
  rationale: 직역상 ‘낳다/출산하다’이지만, 한국어에서 너무 생경하지 않도록 산출의 결말을 드러내는 ‘거두다’를 택해 비유의 무익함을 살렸습니다.
- source_word: רוּחֲכֶם
  english_pob_choice: your breath
  chosen_korean: 너희의 숨
  alternatives_korean:
  - 너희의 바람
  - 너희의 영
  lexicon: HALOT
  rationale: 영/바람/숨 가운데, 여기서는 불에 의해 소멸되는 구체적 이미지가 강하므로 ‘숨’이 가장 직접적입니다.
theological_decisions:
- issue: רוּחַ의 의미를 ‘영’으로 신학화할지 여부
  chosen_reading: ‘숨’으로 유지하여 사람들의 내적 발화/호흡이 그들을 삼키는 불이 되게 하는 이미지로 남김
  alternative_readings:
  - 영
  - 바람
  rationale: 본문은 심판 비유로서 사람들의 자기 생성적 파괴를 그리므로, 의미를 ‘영’으로 고정하기보다 다의성을 열어 두는 것이 원문 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
