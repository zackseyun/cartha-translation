base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
  footnotes:
  - marker: a
    text: Or, 'their guilt is borne away' or 'their sin is lifted.' The Hebrew idiom literally speaks of iniquity being carried/removed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그곳에 사는 사람은 아무도 “저는 아픕니다”라고 말하지 않을 것입니다. 그곳에 사는 백성의 죄악은 용서받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 백성의 죄악이 들어 올려졌다’ 또는 ‘옮겨졌다’라고 말합니다. 이는 죄악이나 죄책이 제거되어 용서받았다는 뜻을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
