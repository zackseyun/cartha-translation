id: ISA.33.24
reference: Isaiah 33:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַל יֹאמַ֥ר שָׁכֵ֖ן חָלִ֑יתִי הָ/עָ֛ם הַ/יֹּשֵׁ֥ב בָּ֖/הּ נְשֻׂ֥א עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
  footnotes:
  - marker: a
    text: Or, 'their guilt is borne away' or 'their sin is lifted.' The Hebrew idiom literally speaks of iniquity being carried/removed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기 사는 사람은 “나는 아픕니다”라고 말하지 않을 것입니다. 그곳에 거주하는 백성은 그들의 죄책이 거두어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘죄악이 지어지다/옮겨지다’는 뜻을 띠며, ‘용서받다’ 또는 ‘사라지다’의 의미로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל / יֹאמַר
  english_pob_choice: And no / will say
  chosen_korean: “...라고 말하지 않을 것입니다”
  alternatives_korean:
  - “...라고 말하지 않습니다”
  - “...라고 말할 일이 없습니다”
  lexicon: HALOT
  rationale: 부정 미래 진술을 한국어로 자연스럽게 옮기되, 예언적 선언의 확정성을 살려 미래형으로 처리했습니다.
- source_word: שָׁכֵן
  english_pob_choice: inhabitant
  chosen_korean: 거기 사는 사람
  alternatives_korean:
  - 거주민
  - 주민
  lexicon: HALOT
  rationale: 단수 분사형의 일반적 사람을 뜻하므로, 문맥상 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: חָלִיתִי
  english_pob_choice: I am sick
  chosen_korean: 나는 아픕니다
  alternatives_korean:
  - 나는 병들었습니다
  - 나는 아픕니다
  lexicon: HALOT
  rationale: 병의 상태를 직접화법으로 표현하면서도 현대 한국어에서 가장 자연스러운 상태 진술로 옮겼습니다.
- source_word: נְשֻׂא עָוֺן
  english_pob_choice: are forgiven / their iniquity is borne away
  chosen_korean: 그들의 죄책이 거두어졌습니다
  alternatives_korean:
  - 그들의 죄악이 용서받았습니다
  - 그들의 죄가 옮겨졌습니다
  lexicon: HALOT
  rationale: נשא + עון의 관용구를 문자적 ‘지다/옮기다’의 이미지를 살리면서도, 문맥상 죄책의 제거를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: נשא + עון 관용구의 번역에서 용서와 ‘짐이 거두어짐’ 사이의 긴장
  chosen_reading: ‘죄책이 거두어졌다’로 번역해, 단순한 도덕적 사면과 함께 죄가 제거·제거됨이라는 히브리어 관용구의 힘을 살렸습니다.
  alternative_readings:
  - ‘그들의 죄가 용서받았습니다’
  - ‘그들의 죄가 옮겨졌습니다’
  rationale: 본문은 ‘아픔이 없음’과 ‘죄책의 제거’를 병렬로 말하므로, 한쪽만 평탄화하지 않고 두 요소를 함께 보존하는 번역이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
