id: ISA.33.7
reference: Isaiah 33:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֚ן אֶרְאֶלָּ֔ם צָעֲק֖וּ חֻ֑צָ/ה מַלְאֲכֵ֣י שָׁל֔וֹם מַ֖ר יִבְכָּיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
  footnotes:
  - marker: a
    text: Hebrew אֶרְאֶלָּם is uncertain; it may mean 'their valiant ones/heroes,' or more literally something like 'their Ariel-men' or 'their lions of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'ambassadors of peace' / 'envoys of peace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들의 용사들이 밖에서 부르짖고, 평화의 사신들이 쓰라리게 웁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרְאֶלָּם은 뜻이 불확실하며, ‘그들의 용사들/강한 자들’ 또는 더 문자적으로는 ‘그들의 아리엘 사람들’, ‘하나님의 사자들’ 같은 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사신들’, ‘외교 사절들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사/지시어로서 현대 한국어에서 자연스럽고, 이어지는 예언적 경고의 긴박감을 살립니다.
- source_word: אֶרְאֶלָּם
  english_pob_choice: their heroes
  chosen_korean: 그들의 용사들
  alternatives_korean:
  - 그들의 영웅들
  - 그들의 용맹한 자들
  - 그들의 아리엘 사람들
  lexicon: HALOT
  rationale: 뜻이 불확실한 단어이므로 문맥상 무너진 성읍의 강자들을 가리키는 쪽을 따르되, 한국어에서는 '용사들'이 가장 간결하게 그 뉘앙스를 전달합니다.
- source_word: חֻצָה
  english_pob_choice: outside
  chosen_korean: 밖에서
  alternatives_korean:
  - 거리에서
  - 바깥에서
  - 노상에서
  lexicon: HALOT
  rationale: 히브리어는 성읍의 바깥/거리 쪽을 가리킬 수 있으나, 영어 POB의 audited choice가 'outside'이므로 한국어도 과도한 구체화 없이 외부 공간을 나타내는 표현으로 옮겼습니다.
- source_word: מַלְאֲכֵי שָׁלוֹם
  english_pob_choice: the messengers of peace
  chosen_korean: 평화의 사신들
  alternatives_korean:
  - 평화의 사자들
  - 평화의 외교사절들
  - 평화의 사절들
  lexicon: HALOT
  rationale: מלאך는 문맥상 인간 외교 사절을 가리키므로, 교회적 관용구보다 정치·외교적 의미가 드러나는 '사신들'이 적절합니다.
- source_word: מַר
  english_pob_choice: bitterly
  chosen_korean: 쓰라리게
  alternatives_korean:
  - 비통하게
  - 쓰게
  - 몹시
  lexicon: HALOT
  rationale: 단순한 강도 표현보다 감정의 고통을 드러내는 부사로서 '쓰라리게'가 'bitterly'의 정서를 잘 살립니다.
theological_decisions:
- issue: אֶרְאֶלָּם의 의미를 어떻게 처리할지
  chosen_reading: 문맥에 맞춰 인간 용사/강자들을 가리키는 표현으로 두고, 본문 속 애가의 성격을 살립니다.
  alternative_readings:
  - '''아리엘 사람들''처럼 음역에 가까운 처리'
  - 천상의 존재나 고유 지명으로 보는 처리
  rationale: 즉각적인 문맥은 성읍의 붕괴와 외교 실패에 대한 통탄이므로, 불명확한 어휘를 신비화하기보다 인간의 무력한 용사로 이해하는 편이 본문 효과에 부합합니다.
  doctrine_reference: 본문 해석상의 어휘 모호성; 교리 쟁점 없음
