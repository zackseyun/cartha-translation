source:
  edition: WLC
  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
  footnotes:
  - marker: a
    text: Or 'a fierce people' or 'a defiant people.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'a people deep of lip from hearing,' that is, a people whose speech is too obscure to understand.
    reason: lexical_alternative
  - marker: c
    text: Or 'a mocking tongue' or 'a strange/barbarous tongue.' The Hebrew expression is difficult and likely refers to foreign speech that is unintelligible to the hearer.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 더 이상 그 오만한 백성[a], 곧 듣고도 알아듣기 어려운 말을 하며[b] 뜻을 알 수 없는 더듬는 듯한 말을 하는 백성[c]을 보지 못하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포악한 백성’ 또는 ‘도전적인 백성’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘듣는 것으로는 깊은 입술의 백성’입니다. 곧 그 말이 너무 난해하여 알아듣기 어려운 백성이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘비웃는 혀’ 또는 ‘낯선/야만적인 혀’입니다. 이 히브리어 표현은 어렵고, 듣는 이에게 알아들을 수 없는 외국어를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  english_pob_choice: insolent
  chosen_korean: 오만한
  alternatives_korean:
  - 거친
  - 패기 있는
  - 거만한
  lexicon: HALOT
  rationale: 문맥에서 위압적이면서도 경멸적인 태도를 가리키므로, 영어 POB의 ‘insolent’를 한국어로 자연스럽게 살린 ‘오만한’이 가장 가깝습니다.
- source_word: עִמְקֵי שָׂפָה
  english_pob_choice: of speech too deep to understand
  chosen_korean: 이해하기 어려운 말의
  alternatives_korean:
  - 깊은 입술의
  - 난해한 말의
  - 알아듣기 힘든 말의
  lexicon: HALOT
  rationale: 직역하면 ‘깊은 입술’이지만, 히브리어 관용구의 의미는 알아듣기 어려운 말이므로 의미를 드러내는 표현으로 옮겼습니다.
- source_word: נִלְעַג לָשׁוֹן
  english_pob_choice: of a stammering tongue
  chosen_korean: 더듬는 혀를 가졌고
  alternatives_korean:
  - 비웃는 혀를 가진
  - 낯선 혀를 가진
  - 서툰 혀를 가진
  lexicon: HALOT
  rationale: 이 표현은 화자의 실제 발음장애라기보다 듣는 이에게는 불분명하게 들리는 외국어적 소리를 가리키므로, ‘더듬는 혀’로 그 난해함을 살렸습니다.
- source_word: אֵין בִּינָה
  english_pob_choice: without comprehension
  chosen_korean: 이해함이 없는
  alternatives_korean:
  - 분별이 없는
  - 깨달음이 없는
  - 이해할 수 없는
  lexicon: HALOT
  rationale: ‘bînāh’는 단순 지식보다 이해·분별을 뜻하므로, 앞 구절과 연결되는 무이해 상태를 직접적으로 드러내는 표현을 택했습니다.
