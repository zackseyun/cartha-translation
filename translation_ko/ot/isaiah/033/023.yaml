- from: 당신의 줄은 느슨하게 매달려[a], 기둥의 기초를 단단히 지탱하지 못하며, 돛을 펼치지 못합니다. 그때 많은 약탈물이 나누어지리니[b], 절름발이조차도 약탈물을 가져갈 것입니다.
  to: 당신의 밧줄이 풀려 있습니다. 그것들은 돛대의 받침을 단단히 고정하지 못하고, 돛을 펼치지 못합니다[a]. 그때에는 많은 전리품이 나뉘며[b], 다리 저는 이들까지도 전리품을 빼앗아 갈 것입니다.
  rationale: 밧줄이 풀린 배가 돛대를 고정하거나 돛을 펼 수 없다는 비유를 한국어에서 명료하게 재현했습니다. 난해하거나 논쟁 가능한 נֵס는 본문에서 배 비유에 맞춘 ‘돛’으로 두되, 대안적 뜻을 올바른 위치의 각주에 보존했습니다. 결과절의 전리품과 ‘다리 저는 이들’도 원문의 강조를 유지했습니다.
