review_pass:
  verdict: revise
  source_fidelity: 원문의 배/돛대 비유와 결과절의 전리품 분배를 대체로 반영했으나, נִטְּשׁוּ는 ‘느슨하게 매달려’보다 ‘풀려 있다/느슨해졌다’가 더 직접적입니다. 또한 כֵּן תָּרְנָם은 돛대의 받침 또는 고정 부분을 가리키는 난해한 표현이므로, ‘기둥의 기초를 지탱하다’보다 밧줄이 돛대 받침을 고정하지 못한다는 관계를 분명히 하는 편이 적절합니다.
  naturalness: ‘당신의 줄’, ‘기둥의 기초’, ‘많은 약탈물’은 현대 표준 한국어 성경 문체에서 다소 부자연스럽거나 모호합니다. ‘밧줄’, ‘돛대의 받침’, ‘많은 전리품’이 더 자연스럽고, 합쇼체에도 맞습니다.
  terminology: 배의 비유에는 ‘밧줄’, ‘돛대’, ‘돛’이 적절합니다. נֵס의 일반적 의미인 깃발/신호기는 본문에서 단정하지 않고 각주로 보존해야 합니다. שָׁלָל은 여기서 ‘전리품’이 문맥상 명료합니다.
