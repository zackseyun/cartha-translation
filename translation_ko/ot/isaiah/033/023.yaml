  - severity: medium
    issue: ‘기둥의 기초를 단단히 지탱하지 못하며’는 원문의 배 장비 관계를 충분히 드러내지 못합니다.
    rationale: 히브리어는 밧줄이 돛대의 받침/고정 부분을 단단히 하지 못하는 모습을 말합니다. ‘돛대의 받침을 단단히 고정하지 못하고’가 더 정확하고 자연스럽습니다.
  - severity: low
