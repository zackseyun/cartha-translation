source:
  edition: WLC
  text: אָבַ֤ל אֻמְלְלָה֙ אָ֔רֶץ הֶחְפִּ֥יר לְבָנ֖וֹן קָמַ֑ל הָיָ֤ה הַ/שָּׁרוֹן֙ כָּֽ/עֲרָבָ֔ה וְ/נֹעֵ֥ר בָּשָׁ֖ן וְ/כַרְמֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
  footnotes:
  - marker: a
    text: Or 'like the desert plain' or 'like the wilderness' for 'like the Arabah.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'Bashan and Carmel shake off'; the sense is that they are stripped of their foliage.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅이 슬퍼하며 시들고, 레바논은 부끄러워하며 시들어 갑니다. 사론은 아라바와 같이 되었고,[a] 바산과 갈멜은 잎을 털어 떨어뜨립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아라바’는 요단 계곡의 사막 평원을 가리킬 수 있으며, 일반적으로 광야나 메마른 평원을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바산과 갈멜이 털어 떨어뜨린다’라고 하며, 문맥상 잎이나 수목의 무성함을 잃어 앙상해지는 모습을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  english_pob_choice: mourns
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 애도하며
  - 애통하며
  lexicon: HALOT
  rationale: 땅을 의인화한 표현을 살리기 위해, 단순한 물리적 건조보다 정서적·예언적 뉘앙스가 있는 ‘슬퍼하며’를 택했습니다.
- source_word: אֻמְלְלָה / קָמַל
  english_pob_choice: withers / withers away
  chosen_korean: 시들고 / 시들어 갑니다
  alternatives_korean:
  - 말라가고 / 말라갑니다
  - 위축되고 / 쇠해 갑니다
  lexicon: HALOT
  rationale: 두 동사가 병행으로 이어져 식물이 쇠약해지는 이미지를 강화하므로, 한국어에서도 같은 어근의 ‘시들다’를 반복해 병렬성을 살렸습니다.
- source_word: הֶחְפִּיר
  english_pob_choice: is ashamed
  chosen_korean: 부끄러워하며
  alternatives_korean:
  - 수치스러워하며
  - 망신을 당하며
  lexicon: HALOT
  rationale: 레바논에 대한 의인화와 ‘수치/부끄러움’의 의미를 함께 살리기 위해 자연스러운 현대어인 ‘부끄러워하며’를 사용했습니다.
- source_word: כָּעֲרָבָה
  english_pob_choice: like the Arabah
  chosen_korean: 아라바처럼
  alternatives_korean:
  - 광야처럼
  - 사막 평원처럼
  lexicon: HALOT
  rationale: 지리적 고유명사인 ‘아라바’를 본문에 유지해 원문의 지리적 암시를 보존하고, 해석적 풀이는 각주로 처리할 수 있게 했습니다.
- source_word: נֹעֵר
  english_pob_choice: shake off their leaves
  chosen_korean: 잎을 떨어뜨립니다
  alternatives_korean:
  - 잎을 털어 냅니다
  - 벗겨집니다
  lexicon: HALOT
  rationale: 직역하면 ‘털어 떨어뜨리다’이지만, 문맥상 수목의 잎이 떨어지는 그림이므로 한국어 자연성을 고려해 ‘잎을 떨어뜨립니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 의인화와 심판 이미지 유지
  chosen_reading: 땅, 레바논, 사론, 바산, 갈멜을 실제 풍경 묘사이면서 동시에 슬픔과 수치를 당하는 인물처럼 표현했습니다.
  alternative_readings:
  - 단순한 기후·생태 묘사로 완화하는 번역
  - 의인화를 약화시켜 평이하게 번역하는 방식
  rationale: 본문은 창조 세계가 심판 앞에서 반응하는 시적 의인화를 사용하므로, 이를 약화하지 않고 그대로 드러내는 것이 원문 효과에 충실합니다.
  doctrine_reference: 예언서의 의인화와 심판 시학
