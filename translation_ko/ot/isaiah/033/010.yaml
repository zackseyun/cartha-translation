id: ISA.33.10
reference: Isaiah 33:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּ֥ה אָק֖וּם יֹאמַ֣ר יְהוָ֑ה עַתָּה֙ אֵֽרוֹמָ֔ם עַתָּ֖ה אֶנָּשֵֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/010.yaml
  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
  footnotes:
  - marker: a
    text: Or, 'now I will be exalted; now I will lift myself up.' The two final Hebrew verbs are closely related in meaning, and English renderings may vary in how they distinguish them.
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 내가 일어나겠다”라고 야훼께서 말씀하십니다. “이제 내가 높아지겠다. 이제 내가 나 자신을 높이겠다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 이 시각에
  lexicon: HALOT
  rationale: 즉각적이고 반복적인 전환을 나타내는 הזמן 부사로서, ‘이제’를 반복해 원문의 긴박감과 점층을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와 자리표시가 아니라 신명기적 고유명사 יְהוָה이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵרוֹמָם
  english_pob_choice: I will be exalted / I will lift myself up
  chosen_korean: 내가 높아지겠다
  alternatives_korean:
  - 내가 스스로 높아지겠다
  - 내가 나 자신을 높이겠다
  lexicon: HALOT
  rationale: רום의 자기-고양/높아짐 뉘앙스를 살리되, 한국어에서는 과도한 직역보다 자연스러운 ‘높아지겠다’가 시적·예언적 문맥에 적합합니다.
- source_word: אֶנָּשֵׂא
  english_pob_choice: I will lift myself up / I will be exalted
  chosen_korean: 내가 나 자신을 높이겠다
  alternatives_korean:
  - 내가 높임을 받겠다
  - 내가 스스로 높이겠다
  lexicon: HALOT
  rationale: נשא의 니팔형이 담는 수동/자기-고양 가능성을 유지하면서, 앞 절과 구별되는 두 번째 동사를 분명하게 드러내기 위해 ‘나 자신을 높이겠다’로 옮겼습니다.
theological_decisions:
- issue: 두 개의 마지막 동사를 어떻게 구별할지
  chosen_reading: 첫 번째는 ‘내가 높아지겠다’, 두 번째는 ‘내가 나 자신을 높이겠다’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘내가 높아지겠다’로 통일
  - 둘 다 ‘내가 스스로 높이겠다’로 통일
  rationale: 히브리어는 서로 다른 동사와 형태를 연속 사용하므로, 한국어에서도 의미적 중복을 완전히 평탄화하지 않고 점층 구조를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
