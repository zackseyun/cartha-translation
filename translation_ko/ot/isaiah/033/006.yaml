id: ISA.33.6
reference: Isaiah 33:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
  footnotes:
  - marker: a
    text: Or, 'There will be stability in your times'; the Hebrew verb can be read impersonally rather than with 'he' as the subject.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'salvations,' likely an intensive plural meaning abundant salvation or many deliverances.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the fear of the LORD is your treasure' or 'its treasure'; the referent of the final suffix is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 당신의 시대의 안정이 되시며, 구원의 풍성함과 지혜와 지식이 되십니다. 야훼를 경외함이 그의 보물입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 시대에 안정이 있으리라’로도 읽을 수 있습니다. 히브리어 동사는 주어를 생략한 비인칭으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘구원들’(복수형)로 되어 있어, 풍성한 구원 또는 여러 번의 구원을 가리키는 강조 복수일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 소유 대명사는 ‘그의’뿐 아니라 ‘그것의’ 또는 문맥에 따라 ‘당신의’로도 논의됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And he will be
  chosen_korean: 그분은 … 되시며
  alternatives_korean:
  - 그가 … 되며
  - 그리고 … 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 동사를 인칭 주어로 살려, 문맥상 야훼를 가리키는 인격적 주어를 한국어에서도 자연스럽게 드러냈습니다.
- source_word: אֱמוּנַת עִתֶּיךָ
  english_pob_choice: the stability of your times
  chosen_korean: 당신의 시대의 안정
  alternatives_korean:
  - 당신의 때들의 견고함
  - 당신의 시기의 신실함
  lexicon: HALOT
  rationale: אֱמוּנָה의 문맥상 의미를 ‘신실함’보다 상황적·객관적 ‘안정’으로 옮겨, 시간/시대의 견고한 상태를 살렸습니다.
- source_word: חֹסֶן יְשׁוּעֹת
  english_pob_choice: a wealth of salvation
  chosen_korean: 구원의 풍성함
  alternatives_korean:
  - 구원의 부요함
  - 구원의 재물
  lexicon: HALOT
  rationale: חֹסֶן의 ‘재물/풍요/풍성함’ 뉘앙스를 한국어에서 가장 자연스럽게 반영하면서, 뒤따르는 ‘지혜와 지식’과도 어울리도록 했습니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외함
  alternatives_korean:
  - 야훼에 대한 두려움
  - 여호와 경외
  lexicon: HALOT
  rationale: ייְהוָה를 POB 기본 원칙에 따라 ‘야훼’로 옮기고, 관용적 종교어휘보다 직역에 가까운 ‘경외함’을 사용해 원문의 언약적 경외를 유지했습니다.
- source_word: הִיא אוֹצָרוֹ
  english_pob_choice: is his treasure
  chosen_korean: 그의 보물입니다
  alternatives_korean:
  - 그의 خز간직된 것입니다
  - 그의 재산입니다
  lexicon: HALOT
  rationale: אוֹצָר의 핵심 의미인 ‘보물/저장된 귀한 것’을 간명하게 살렸고, 소유 대명사는 문맥상 자연스러운 ‘그의’로 두었습니다.
theological_decisions:
- issue: 마지막 절의 소유 대명사와 앞부분 주어의 지시 대상
  chosen_reading: 본문 흐름상 마지막의 ‘그의’는 앞의 인격적 주어와 연결되는 것으로 두되, 본문이 허용하는 미묘한 지시 대상을 과도하게 좁히지 않았습니다.
  alternative_readings:
  - ‘그것의 보물입니다’로 이해할 수 있음
  - ‘당신의 보물입니다’로 읽는 해석도 가능함
  rationale: 히브리어는 지시 대상이 다소 열려 있으므로, 번역문은 의미를 명료하게 하되 해석적 확정을 지나치게 강요하지 않도록 했습니다.
  doctrine_reference: 본문이 허용하는 긴장을 보존하고, 애매성은 본문 자체의 범위 안에서 처리합니다.
