    rationale: 현대 한국어에서 ‘정의’와 ‘공의’는 모두 justice의 뜻으로 흔히 사용됩니다. ‘정의와 의’는 משפט의 사회적 정의와 צדקה의 도덕적 올바름을 구별합니다.
