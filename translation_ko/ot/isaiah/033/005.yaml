  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
  footnotes:
  - marker: a
    text: Or 'dwells in the heights.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 높이 들리셨습니다[a]. 그분은 높은 곳에 거하시는 분이시니, 시온을 정의와 공의로 채우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높은 곳에 거하십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂגָּב / יְהוָה
  english_pob_choice: Yahweh is exalted
  chosen_korean: 야훼는 높이 들리셨습니다
  alternatives_korean:
  - 야훼는 높으십니다
  - 야훼는 높임을 받으셨습니다
  lexicon: HALOT
  rationale: נִשְׂגָּב의 수동·상태적 의미를 한국어의 ‘높이 들리셨습니다’로 옮겨, 야훼의 초월적 높음과 영화로운 존귀를 함께 드러냈습니다.
- source_word: שֹׁכֵן מָרוֹם
  english_pob_choice: he dwells on high
  chosen_korean: 그분은 높은 곳에 거하시는 분이시니
  alternatives_korean:
  - 그분은 높은 곳에 사십니다
  - 그분은 높은 데 거하십니다
  lexicon: HALOT
  rationale: 현재적 거주를 나타내는 분사구를 ‘거하시는 분’으로 풀어, 단순한 위치 설명이 아니라 지속적인 거처의 뜻을 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 재판
  lexicon: HALOT
  rationale: צְדָקָה와 짝을 이룬 כאן의 מִשְׁפָּט는 법정 판결보다 사회적·윤리적 질서를 가리키므로 ‘정의’가 가장 자연스럽습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 공의
  alternatives_korean:
  - 의
  - 정의
  lexicon: HALOT
  rationale: 한국어 성경에서 צְדָקָה는 문맥에 따라 ‘의’나 ‘공의’로 옮길 수 있으나, כאן은 מִשְׁפָּט와 구별되는 도덕적 바름의 차원을 살려 ‘공의’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명사 טetragrammaton을 대체 호칭이 아니라 고유명으로 드러내기 위해, POB 기준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md — Contested terms: יְהוָה YHWH'
- issue: מִשְׁפָּט וּצְדָקָה의 쌍어 처리
  chosen_reading: 정의와 공의
  alternative_readings:
  - 심판과 의
  - 정의와 의
  rationale: 이 결합은 야훼의 통치가 공동체의 올바른 질서와 도덕적 바름을 함께 세운다는 뜻이므로, 두 요소를 구별해 번역했습니다.
  doctrine_reference: 'DOCTRINE.md — Translation philosophy #5 (consistency of key terms, or documented exception)'
