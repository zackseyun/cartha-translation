    issue: ‘높이 들리셨습니다’가 נִשְׂגָּב을 사건적 과거/완료로 들리게 할 수 있습니다.
    rationale: 원문의 니팔 완료형은 여기서 야훼의 현재적이고 지속적인 높음을 진술합니다. 한국어 상태 서술인 ‘높으십니다’가 더 적절합니다.
  - severity: low
