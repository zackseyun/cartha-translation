  source_fidelity: 히브리어의 강조된 독립 대명사(וְהוּא), 제비뽑기와 측량줄에 의한 배분의 두 이미지를 모두 반영해야 합니다. 초안은 핵심 의미를 대체로 보존하지만, 강조와 측량 도구의 의미가 약화되었고 ‘그의 손이 … 주셨습니다’는 한국어 문법·의미상 어색합니다.
  naturalness: ‘그의 손이 그것을 … 주셨습니다’는 신체 부위가 직접 높임의 행위 주체가 되는 형태여서 자연스럽지 않습니다. ‘그의 손으로 … 나누어 주셨습니다’로 하면 하나님의 행위를 자연스럽게 높이면서 원문의 표현도 유지합니다.
