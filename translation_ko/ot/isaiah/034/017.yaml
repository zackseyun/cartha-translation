translation:
  language: ko
  text: 그분께서 친히 그들을 위하여 제비를 던지셨고, 그의 손으로 그것을 그들에게 측량줄로 나누어 주셨습니다[a]. 그들은 그것을 영원히 차지할 것이며[b], 대대로 그 안에 거주할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘줄로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그것을 상속할 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: And he himself
  chosen_korean: 그는
  alternatives_korean:
  - 그 자신은
  - 그가 직접
  lexicon: HALOT
  rationale: 히브리어 독립 대명사의 강조는 문맥상 충분히 드러나므로, 한국어에서는 중복을 피하면서 주어를 자연스럽게 살렸습니다.
- source_word: הִפִּיל
  english_pob_choice: has cast
  chosen_korean: 제비를 던지셨고
  alternatives_korean:
  - 제비를 던졌고
  - 제비를 뽑으셨고
  lexicon: HALOT
  rationale: גוֹרָל과 함께 쓰인 관용구를 한국어 성경체로는 ‘제비를 던지다’가 가장 직접적이며, 하나님의 주권적 행위를 드러내기 위해 높임을 사용했습니다.
- source_word: בַּקָּו
  english_pob_choice: by line
  chosen_korean: 줄로 나누어 주셨습니다
  alternatives_korean:
  - 줄로
  - 측량줄로 나누어 주셨습니다
  - 잣대로 나누어 주셨습니다
  lexicon: HALOT
  rationale: קָו는 토지 측량용 줄을 가리키므로, 단순히 ‘줄로’보다 분배 행위를 포함한 한국어로 옮겨 측량과 할당의 이미지를 살렸습니다.
- source_word: יִירָשׁוּהָ
  english_pob_choice: they will possess it
  chosen_korean: 소유할 것이며
  alternatives_korean:
  - 받아 가질 것이며
  - 기업으로 받을 것이며
  - 상속할 것이며
  lexicon: HALOT
  rationale: 이 문맥은 분배받은 땅을 계속 소유하는 뜻이 강하므로, ‘상속하다’보다 덜 교회적이고 더 직접적인 ‘소유하다’를 택했습니다.
theological_decisions:
- issue: 폭력적으로 폐허가 된 땅의 최종 귀속
  chosen_reading: 본문은 황폐한 땅이 하나님에 의해 특정 피조물들에게 배분되어, 그들이 영구히 거주하는 역전의 장면을 말합니다.
  alternative_readings:
  - 단순한 시적 과장으로만 볼 수도 있습니다.
  - 사람들을 상징하는 일반적 거주자로 완화할 수도 있습니다.
  rationale: 앞선 문맥의 들짐승·새 이미지가 이어지므로, 본문이 실제 폐허의 전복과 배분을 말하는 시적 선언이라는 점을 보존했습니다.
  doctrine_reference: 창조주 하나님의 주권적 심판과 재분배
