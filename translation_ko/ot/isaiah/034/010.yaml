id: ISA.34.10
reference: Isaiah 34:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ֤יְלָה וְ/יוֹמָם֙ לֹ֣א תִכְבֶּ֔ה לְ/עוֹלָ֖ם יַעֲלֶ֣ה עֲשָׁנָ֑/הּ מִ/דּ֤וֹר לָ/דוֹר֙ תֶּחֱרָ֔ב לְ/נֵ֣צַח נְצָחִ֔ים אֵ֥ין עֹבֵ֖ר בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
  footnotes:
  - marker: a
    text: Or 'it shall be desolate.' The Hebrew verb can denote being laid waste or becoming desolate.
    reason: lexical_alternative
translation:
  language: ko
  text: 밤낮으로 꺼지지 않을 것이며, 그 연기는 영원히 올라갈 것입니다[a]. 대대로 그것은 황폐하게 될 것이며, 영원히 누구도 그곳을 지나가지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것은 황폐하게 될 것이다.” 히브리어 동사는 ‘황폐해지다’와 ‘황폐하게 되다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  english_pob_choice: Night and day
  chosen_korean: 밤낮으로
  alternatives_korean:
  - 밤과 낮으로
  - 밤낮
  lexicon: HALOT
  rationale: 밤과 낮의 병렬은 지속성을 나타내므로, 현대 한국어에서 자연스러운 관용 표현인 ‘밤낮으로’로 압축해 의미를 보존했습니다.
- source_word: לֹא תִכְבֶּה
  english_pob_choice: it shall not be quenched
  chosen_korean: 꺼지지 않을 것입니다
  alternatives_korean:
  - 진화되지 않을 것입니다
  - 불이 꺼지지 않을 것입니다
  lexicon: HALOT
  rationale: כבה는 불이 ‘꺼지다/꺼지게 되다’의 뜻이므로, 수동적 감각을 살리면서도 현대 한국어에서 자연스러운 ‘꺼지지 않을 것입니다’로 옮겼습니다.
- source_word: עֲשָׁנָהּ
  english_pob_choice: its smoke shall go up
  chosen_korean: 그 연기는 올라갈 것입니다
  alternatives_korean:
  - 그 연기는 솟아오를 것입니다
  - 연기가 올라갈 것입니다
  lexicon: HALOT
  rationale: עשן과 עלה의 결합은 연기가 위로 오르는 표준적 표현이므로 ‘그 연기’로 대상의 연속성을 살리고 ‘올라갈 것입니다’로 직역성을 유지했습니다.
- source_word: תֶּחֱרָב
  english_pob_choice: it shall lie waste
  chosen_korean: 황폐하게 될 것입니다
  alternatives_korean:
  - 폐허가 될 것입니다
  - 황무지가 될 것입니다
  lexicon: HALOT
  rationale: חרב는 이 문맥에서 ‘황폐해지다/폐허가 되다’의 결과 상태를 가리키므로, 예언적 심판의 상태를 직접 드러내는 ‘황폐하게 될 것입니다’를 선택했습니다.
theological_decisions:
- issue: 영속 표현의 강도 유지
  chosen_reading: ‘영원히’와 ‘영원히 누구도 그곳을 지나가지 않을 것입니다’로 반복되는 지속 표현을 그대로 살렸습니다.
  alternative_readings:
  - ‘오랫동안’처럼 완화하여 옮기기
  - ‘세세토록’ 같은 전통적 문구 사용
  rationale: 원문은 עוֹלָם과 נֵצַח נְצָחִים을 겹쳐 사용해 영속성을 강조하므로, 이를 약화하지 않고 그대로 드러내는 것이 심판 신탁의 수사적 힘을 보존합니다.
  doctrine_reference: 예언 본문의 과장적 영속 언어는 해석으로 미리 완화하지 않고 본문 수준에서 보존합니다.
