review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 히브리어의 병렬된 수동 서술(‘피로 가득하다’, ‘기름으로 기름지게 되다’)과 뒤따르는 재료 목록의 관계를 더 명료하게 드러낼 필요가 있습니다. 또한 בְּבָצְרָה의 무동사절은 ‘마련하셨다’보다 ‘있다’로 옮기는 편이 원문의 미결정성을 보존합니다.
  naturalness: ‘기름으로 불려지고’는 칼에 적용될 때 다소 부자연스럽고, 뒤의 ‘…피와 …기름으로 가득합니다’는 앞의 ‘피로 가득’과 의미 관계가 흐려집니다. ‘기름으로 살찌게 되었습니다’와 ‘곧’의 설명적 연결이 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘칼’, ‘어린양’, ‘숫염소’, ‘숫양’, ‘콩팥 기름’, ‘희생 제사’, ‘살육’은 원문의 제의·심판 어휘를 보존합니다. עַתּוּדִים의 성별 한정은 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 재료 목록이 ‘가득하다’에 다시 연결되어 히브리어의 ‘기름지게 되다’에 대한 보충이라는 관계가 불분명합니다.
    rationale: מִדַּם ... מֵחֵלֶב ...은 칼이 피로 가득하고 기름으로 기름지게 된 제의적 재료를 열거합니다. 개정문은 이를 ‘곧’으로 연결해 관계를 명확히 합니다.
  - severity: medium
    issue: ‘야훼께서 … 희생제물을 마련하셨고’는 무동사절에 ‘마련하다’라는 구체적 행위를 추가합니다.
    rationale: כִּי זֶבַח לַיהוָה בְּבָצְרָה는 ‘야훼의/야훼를 위한 희생 제사가 보스라에 있다’로도 읽히는 명사절입니다. 본문은 존재 표현을 택하고, 가능한 다른 구문은 각주에 보존합니다.
  - severity: low
    issue: 숫염소라는 번역의 성별 한정을 설명하는 각주가 없습니다.
    rationale: עַתּוּדִים는 특히 수컷 염소를 가리키므로, 본문을 자연스럽게 유지하면서 각주로 명시할 수 있습니다.
  revised_text: 야훼의 칼은 피로 가득하고 기름으로 살찌게 되었으니, 곧 어린양들과 숫염소들의 피와 숫양들의 콩팥 기름으로 그렇게 되었습니다. 보스라에는 야훼의 희생 제사가 있고[a], 에돔 땅에는 큰 살육이 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘야훼께서 보스라에 희생 제사를 마련해 두셨다.’ 히브리어 절에는 서술동사가 없으므로 두 방식으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘숫염소들’로 옮긴 말은 더 구체적으로 수컷 염소들을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 병렬된 희생 제의 이미지를 유지하면서, 칼이 피로 가득하고 지방으로 ‘살찌게’ 된다는 비유를 한국어로 자연스럽게 옮겼습니다. 보스라 절에서는 원문에 없는 ‘마련하셨다’를 본문에서 제거하여 무동사절의 열린 구조를 보존했습니다. 숫염소의 성별 의미는 각주로 보완했습니다.
