id: ISA.34.6
reference: Isaiah 34:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
  footnotes:
  - marker: a
    text: Or 'for the LORD there is a sacrifice in Bozrah.' The Hebrew clause is verbless and can be construed either way.
    reason: alternative_reading
  - marker: b
    text: '''Goats'' translates a term more specifically meaning ''male goats.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 칼은 피로 가득하며, 기름으로 불려지고, 어린 양들과 숫염소들의 피와 숫양들의 콩팥의 기름으로 가득합니다. 이는 야훼께서 보스라에서 희생제물을 마련하셨고[a], 에돔 땅에서 큰 살육이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께는 보스라에 희생제물이 있습니다.’ 히브리어 절은 서술동사가 없어서 두 방식으로 모두 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: HALOT
  rationale: 예언적 심판 이미지에서 חֶרֶב는 물리적 무기인 '칼'로 직역하는 것이 가장 자연스럽고, 한국어에서도 문학적이면서도 직접적인 표현입니다.
- source_word: מָלְאָה דָם
  english_pob_choice: is filled with blood
  chosen_korean: 피로 가득하며
  alternatives_korean:
  - 피로 가득합니다
  - 피가 가득합니다
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 한국어 현재진행/상태 표현으로 살려서, 이미 가득 찬 상태의 생생한 이미지를 유지했습니다.
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  english_pob_choice: is made fat with fat
  chosen_korean: 기름으로 불려지고
  alternatives_korean:
  - 기름으로 살찌워지고
  - 기름으로 기름져지고
  lexicon: HALOT
  rationale: 희생제물의 지방이 더해져 '기름지다/살찌다'는 감각을 살리되, 한국어에서 반복이 어색하므로 본문에서는 자연스러운 동적 대응으로 처리했습니다.
- source_word: מִדַּם כָּרִים וְעַתּוּדִים ... מֵחֵלֶב כִּלְיוֹת אֵילִים
  english_pob_choice: with the blood of lambs and goats, with the fat of the kidneys of rams
  chosen_korean: 어린 양들과 숫염소들의 피와 숫양들의 콩팥의 기름
  alternatives_korean:
  - 어린 양들과 숫염소들의 피와 숫양들의 신장 기름
  - 양 새끼들과 염소들의 피와 숫양들의 콩팥 지방
  lexicon: HALOT
  rationale: כָּרִים, עַתּוּדִים, אֵילִים의 희생제물 목록을 가능한 한 그대로 살렸고, '콩팥'은 성경적 제의 맥락에서 'kidneys'를 직접 반영하는 한국어 표현입니다.
- source_word: כִּי זֶבַח לַיהוָה ... וְטֶבַח גָּדוֹל
  english_pob_choice: For Yahweh has a sacrifice ... and a great slaughter
  chosen_korean: 이는 야훼께서 보스라에서 희생제물을 마련하셨고[a], 에돔 땅에서 큰 살육이 있기 때문입니다
  alternatives_korean:
  - 야훼께서 보스라에 희생제물이 있으시며
  - 야훼께서 보스라에서 제사를 두셨고
  lexicon: HALOT
  rationale: verbless clause의 뜻을 한국어에서는 '있기 때문입니다'로 풀어, POB가 지적한 '희생제물' 읽기와 자연스러운 인과를 함께 반영했습니다.
- source_word: בְּבָצְרָה
  english_pob_choice: in Bozrah
  chosen_korean: 보스라
  alternatives_korean:
  - 보츠라
  - 보즈라
  lexicon: Project transliteration policy
  rationale: 지명은 표준 외래어 표기 원칙에 따라 음역했고, 한국어 성경 독자에게 익숙한 형태보다 원음에 가까운 '보스라'를 택했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: יהוה를 '야훼'로 옮겨 하나님의 고유명을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본어에 따라 신명사형을 대체 тит일로 바꾸지 않고, 본문의 직접성을 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH -> 야훼'
- issue: 사죄/희생과 심판의 긴장 보존
  chosen_reading: 희생제물·지방·콩팥·살육의 이미지를 완화하지 않고 그대로 남겼습니다.
  alternative_readings:
  - 전투 묘사로 완화
  - 메타포를 일반적 심판으로 평준화
  rationale: 이 구절은 심판을 제의 언어로 형상화하므로, 그 긴장을 해소하지 않고 독자가 본문의 충격을 그대로 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
