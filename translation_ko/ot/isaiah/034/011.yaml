source:
  edition: WLC
  text: וִ/ירֵשׁ֨וּ/הָ֙ קָאַ֣ת וְ/קִפּ֔וֹד וְ/יַנְשׁ֥וֹף וְ/עֹרֵ֖ב יִשְׁכְּנוּ בָ֑/הּ וְ/נָטָ֥ה עָלֶ֛י/הָ קַֽו תֹ֖הוּ וְ/אַבְנֵי בֹֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
  footnotes:
  - marker: a
    text: The identifications of the animals named here are uncertain. 'Desert owl' may also be rendered 'pelican' or 'cormorant,' and 'hedgehog' may also be rendered 'porcupine' or 'bittern.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the measuring line of tohu and the stones of bohu.' The phrase echoes Genesis 1:2 ('formless and empty' / 'waste and void') and portrays the land as reduced to uncreation.
    reason: cross_reference
translation:
  language: ko
  text: 사막 올빼미와 고슴도치는 그 땅을 차지하고[a], 부엉이와 까마귀는 그곳에 깃들 것입니다. 그 위에 황폐의 측량줄과 공허의 수직추를 드리울 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기 나오는 동물명은 식별이 불확실합니다. ‘사막 올빼미’는 ‘펠리컨’이나 ‘가마우지’로도 옮길 수 있고, ‘고슴도치’는 ‘호저’나 ‘덤불해오라기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘황폐의 측량줄과 공허의 돌들’입니다. 이 표현은 창세기 1:2의 ‘혼돈하고 공허한’이라는 표현을 반향하며, 그 땅이 창조 이전의 황폐 상태로 되돌아간 모습을 그립니다.
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  english_pob_choice: will possess her
  chosen_korean: 그 땅을 차지하고
  alternatives_korean:
  - 그 땅을 소유하고
  - 그 땅을 차지할 것입니다
  lexicon: HALOT
  rationale: ירשׁ은 ‘상속하다’보다 여기서는 폐허가 된 땅을 점유·장악한다는 뜻이 강하므로, ‘차지하다’가 판단문맥을 가장 자연스럽게 드러냅니다.
- source_word: קָאַת / קִפּוֹד / יַנְשׁוֹף / עֹרֵב
  english_pob_choice: desert owl / hedgehog / owl / raven
  chosen_korean: 사막올빼미 / 고슴도치 / 부엉이 / 까마귀
  alternatives_korean:
  - 사막부엉이 / 산쥐 / 올빼미 / 까마귀
  - 펠리컨 / 고슴도치 / 부엉이 / 까마귀
  lexicon: HALOT
  rationale: 네 동물명은 모두 식별이 불확실하므로, POB의 처리처럼 현대 독자가 읽기 쉬운 이름을 택하되, 각 항목의 불확실성을 과도하게 해소하지 않도록 했습니다.
- source_word: יִשְׁכְּנוּ בָהּ
  english_pob_choice: will dwell in her
  chosen_korean: 그곳에 깃들 것입니다
  alternatives_korean:
  - 그 안에 살 것입니다
  - 그곳에 거할 것입니다
  lexicon: HALOT
  rationale: שכן의 기본 뜻은 ‘거하다/깃들다’이며, 폐허 속 새들의 정착 이미지를 살리기 위해 ‘깃들다’를 선택했습니다.
- source_word: וְנָטָה עָלֶיהָ
  english_pob_choice: he will stretch over her
  chosen_korean: 그분이 그 위에 드리울 것입니다
  alternatives_korean:
  - 그가 그 위에 펼칠 것입니다
  - 그 위로 펼쳐질 것입니다
  lexicon: HALOT
  rationale: נטה는 ‘펴다, 드리우다, 늘이다’의 뜻을 가지며, 뒤따르는 측량줄·수직추와 함께 심판을 위한 측량 동작을 가리키므로 ‘드리우다’로 옮겼습니다.
- source_word: קַו תֹהוּ / וְאַבְנֵי בֹהוּ
  english_pob_choice: the measuring line of desolation / the plumb stones of emptiness
  chosen_korean: 황폐의 측량줄과 공허의 수직추
  alternatives_korean:
  - 혼돈의 측량줄과 공허의 돌
  - 황무지의 줄과 공허의 추
  lexicon: HALOT
  rationale: קַו는 ‘측량줄’, אֲבָנִים은 측량 도구 맥락에서 ‘수직추’로 이해하는 것이 자연스럽습니다. תֹהוּ와 בֹהוּ는 창세기 1:2의 어휘를 떠올리게 하므로, 심판의 문맥에 맞는 ‘황폐/공허’로 번역하되 그 상호대구를 유지했습니다.
theological_decisions:
- issue: תֹהוּ וָבֹהוּ의 창조-역창조(언크리에이션) 암시
  chosen_reading: 본문에는 심판의 결과를 드러내는 ‘황폐’와 ‘공허’를 두고, 주해 정보로는 창세기 1:2의 울림을 보존합니다.
  alternative_readings:
  - ‘혼돈’과 ‘공허’로 더 직역
  - ‘무형’과 ‘허무’로 옮김
  rationale: 이 구절은 에돔의 멸망을 창조 질서의 반전으로 그리지만, 한국어 본문에서는 즉시 이해되는 심판어휘가 더 적합합니다. 다만 창세기 1:2의 상호텍스트성은 희석하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #3, #6'
