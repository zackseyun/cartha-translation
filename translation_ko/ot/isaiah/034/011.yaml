  verdict: revise
  source_fidelity: 본문의 동물 목록, 땅을 차지하고 거한다는 묘사, 그리고 측량 도구를 통한 황폐화의 이미지는 히브리어 본문에 대체로 충실합니다. 다만 히브리어의 행위 주어가 명시되지 않았는데 ‘그분’을 넣으면 한국어 본문에서 지시 대상을 불필요하게 특정합니다. 주어를 생략한 합쇼체 표현이 원문의 암시성을 더 잘 보존합니다.
  naturalness: ‘그 위에 … 드리울 것입니다’는 측량줄과 수직추의 심판 이미지를 자연스럽고 격식 있는 현대 한국어로 전달합니다. 각주 a는 해당 동물군 바로 뒤에, 각주 b는 측량 표현 바로 뒤에 두는 편이 독자의 참조 범위를 명확히 합니다.
  terminology: ‘측량줄’과 ‘수직추’는 קַו 및 측량 맥락의 אַבְנֵי를 잘 반영합니다. 그러나 קִפּוֹד의 대안인 영어 ‘bittern’을 ‘사다새’로 옮긴 것은 잘못입니다. ‘덤불해오라기’(bittern)로 고쳐야 합니다. ‘사막 올빼미’의 식별 불확실성은 각주로 유지합니다.
