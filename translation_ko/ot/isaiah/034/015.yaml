  to: 거기서 화살뱀이 둥지를 틀고 알을 낳아 부화시키며, 자기 그늘 아래에서 품을 것입니다.[a] 참으로 거기에는 솔개들이 모여, 각기 제 짝과 함께 있을 것입니다.[b]
