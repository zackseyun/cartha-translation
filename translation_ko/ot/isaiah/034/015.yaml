  text: שָׁ֣מָּ/ה קִנְּנָ֤ה קִפּוֹז֙ וַ/תְּמַלֵּ֔ט וּ/בָקְעָ֖ה וְ/דָגְרָ֣ה בְ/צִלָּ֑/הּ אַךְ שָׁ֛ם נִקְבְּצ֥וּ דַיּ֖וֹת אִשָּׁ֥ה רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
  footnotes:
  - marker: a
    text: Hebrew קִפּוֹז is uncertain; it has also been rendered 'owl' or another desert creature.
    reason: alternative_reading
  - marker: b
    text: Or 'and brood over them in her shade.'
    reason: lexical_alternative
  - marker: c
    text: Or 'vultures' or more generally 'birds of prey.'
    reason: alternative_reading
translation:
  language: ko
  text: 거기서 화살뱀이 둥지를 틀고 알을 낳아 부화시키며, 자기 그늘 아래에서 품을 것입니다.[a] 참으로 거기에는 솔개들이 모여, 각기 제 짝과 함께 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קִפּוֹז는 뜻이 불확실하며, ‘올빼미’ 또는 다른 사막 동물로도 옮길 수 있습니다. 또는 ‘자기 그늘 아래에 모으고’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘독수리류’ 또는 더 일반적으로 ‘맹금류들’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  english_pob_choice: arrow snake
  chosen_korean: 화살뱀
  alternatives_korean:
  - 급히 달리는 뱀
  - 다트뱀
  - 올빼미
  lexicon: HALOT, BDB
  rationale: 히브리어 단어가 매우 불확실하므로, POB의 ‘arrow snake’에 맞춰 빠르게 움직이는 뱀의 이미지를 살리는 ‘화살뱀’을 택했습니다. 전통적 조류 해석을 그대로 따르기보다 문맥의 동물군 묘사를 반영했습니다.
- source_word: וַתְּמַלֵּט
  english_pob_choice: and lay eggs
  chosen_korean: 알을 낳으며
  alternatives_korean:
  - 새끼를 낳으며
  - 생산하며
  - 배출하며
  lexicon: HALOT, BDB
  rationale: 뒤의 ‘부화시키고’와 연결되는 생물학적 연쇄를 살려, 직역보다 자연스러운 ‘알을 낳으며’로 옮겼습니다.
- source_word: וּבָקְעָה
  english_pob_choice: and hatch them
  chosen_korean: 그것들을 깨뜨려 부화시키고
  alternatives_korean:
  - 부화시키고
  - 쪼개고
  - 깨뜨리고
  lexicon: HALOT, BDB
  rationale: בקע의 기본 의미인 ‘깨다/쪼개다’를 보존하면서, 알 문맥에서 결과를 분명히 드러내기 위해 ‘깨뜨려 부화시키고’로 옮겼습니다.
- source_word: וְדָגְרָה בְצִלָּהּ
  english_pob_choice: and gather them in her shadow
  chosen_korean: 자기 그늘 아래에 모을 것입니다
  alternatives_korean:
  - 자기 그늘 아래에서 품을 것입니다
  - 자기 그늘 아래에서 알을 품을 것입니다
  - 자기 그늘 아래에 모아 둘 것입니다
  lexicon: HALOT, BDB
  rationale: 동사 דגר는 ‘품다/품어 기르다’의 뜻이지만, POB의 ‘gather them’이 덜 직접적인 보호 행동을 택했으므로 ‘모을 것입니다’로 옮기고 ‘그늘’ 이미지를 유지했습니다. 보다 직역적인 ‘품을 것입니다’는 주석 가능 표현으로 남겨 두었습니다.
- source_word: דַיּוֹת
  english_pob_choice: kites
  chosen_korean: 솔개들
  alternatives_korean:
  - 매들
  - 맹금류
  - 독수리류
  lexicon: HALOT, BDB
  rationale: 일반적인 맹금류보다 한국어에서 비교적 대응이 자연스러운 ‘솔개들’을 택해, POB의 특정 조류 명칭을 살렸습니다.
- source_word: אִשָּׁה רְעוּתָהּ
  english_pob_choice: each with her mate
  chosen_korean: 각기 짝과 함께입니다
  alternatives_korean:
  - 각각 짝과 함께입니다
  - 서로 짝과 함께입니다
  - 각기 동무와 함께입니다
  lexicon: HALOT, BDB
  rationale: 히브리어의 분배적 표현과 암컷 पक्ष류의 짝짓기 이미지를 살려, 자연스러운 한국어로 ‘각기 짝과 함께’라고 옮겼습니다.
theological_decisions:
- issue: 문장 전체의 동물 이미지와 미래형 예언체 처리
  chosen_reading: 멸망한 땅에 실제 야생동물이 거처를 마련하는 장면으로 읽고, 예언적 미래형으로 번역했습니다.
  alternative_readings:
  - 상징적 폐허 묘사로 약화하여 읽는 해석
  - 현재형 묘사로 평이하게 옮기는 해석
  rationale: 본문은 황폐한 땅에 대한 생생한 예언적 묘사를 제시하므로, 상징화하거나 평서적으로 완화하지 않고 미래형으로 재현했습니다.
  doctrine_reference: 예언서의 심판-폐허 묘사 해석
- issue: וְדָגְרָה의 처리
  chosen_reading: ‘품다’의 직접적 번역보다 ‘모으다’로 옮겨, 어미 새가 새끼를 덮어 보호하는 장면을 간접적으로 드러냈습니다.
  alternative_readings:
  - ‘품을 것입니다’
  - ‘알을 품을 것입니다’
  - ‘덮어 줄 것입니다’
  rationale: POB가 이 동사를 ‘gather them’으로 해석한 점을 따라, 한국어에서는 과도한 의인화를 피하면서도 보호적 의미를 보존했습니다.
  doctrine_reference: 번역 선택의 문맥 우선성
