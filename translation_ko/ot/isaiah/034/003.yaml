id: ISA.34.3
reference: Isaiah 34:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַלְלֵי/הֶ֣ם יֻשְׁלָ֔כוּ וּ/פִגְרֵי/הֶ֖ם יַעֲלֶ֣ה בָאְשָׁ֑/ם וְ/נָמַ֥סּוּ הָרִ֖ים מִ/דָּמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
  footnotes:
  - marker: a
    text: Or 'cast out.' The Hebrew verb can be rendered 'thrown out' or 'cast out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their foul smell will go up.'
    reason: lexical_alternative
  - marker: c
    text: 'The image is hyperbolic prophetic judgment language: the bloodshed is portrayed as so great that even the mountains ''melt'' from their blood.'
    reason: cultural_note
translation:
  language: ko
  text: 그들의 살해당한 자들은 내던져지고[a], 그들의 시체의 악취는 올라갈 것이며[b], 산들은 그들의 피 때문에 녹아내릴 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내쫓기고.’ 히브리어 동사는 ‘던져지다’와 ‘내쫓기다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 고약한 냄새가 올라갈 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 이 이미지는 과장된 예언적 심판 언어입니다. 피 흘림이 너무 커서 산들마저 그 피 때문에 ‘녹아내리는’ 것으로 묘사됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  english_pob_choice: their slain
  chosen_korean: 그들의 살해당한 자들
  alternatives_korean:
  - 그들의 죽은 자들
  - 그들의 전사자들
  lexicon: HALOT
  rationale: חלל의 이 명사형은 전투·심판 문맥에서 ‘살해당한 자들’이라는 뜻이 가장 잘 드러나므로, 일반적인 ‘죽은 자들’보다 더 직접적으로 옮겼습니다.
- source_word: יֻשְׁלָכוּ
  english_pob_choice: will be thrown out
  chosen_korean: 내던져지고
  alternatives_korean:
  - 버려지고
  - 던져지고
  lexicon: HALOT
  rationale: שלך의 수동형은 단순 이동보다 무단 방치와 수치를 함께 암시하므로, 노골적인 느낌을 살린 ‘내던져지고’로 옮겼습니다.
- source_word: פִגְרֵיהֶם
  english_pob_choice: their corpses
  chosen_korean: 그들의 시체
  alternatives_korean:
  - 그들의 주검
  - 그들의 사체
  lexicon: HALOT
  rationale: פגר는 죽은 몸, 곧 시신을 가리키므로 현대 한국어에서는 ‘시체’가 가장 자연스럽고 직설적입니다.
- source_word: בָאְשָׁם
  english_pob_choice: the stench of their corpses
  chosen_korean: 그들의 시체의 악취
  alternatives_korean:
  - 그들의 악취
  - 그들의 고약한 냄새
  lexicon: HALOT
  rationale: באש의 악취 의미를 분명히 하되, 바로 앞의 ‘시체’와 연결되도록 소유격 구조를 유지했습니다.
- source_word: וְנָמַסּוּ
  english_pob_choice: will melt
  chosen_korean: 녹아내릴 것입니다
  alternatives_korean:
  - 녹을 것입니다
  - 용해될 것입니다
  lexicon: HALOT
  rationale: מסס의 생생한 붕괴 이미지를 살리기 위해 단순한 ‘녹다’보다 ‘녹아내리다’가 더 적절합니다.
theological_decisions:
- issue: 예언적 심판 이미지의 강도
  chosen_reading: 산이 피 때문에 실제로 녹는다는 설명으로 완화하지 않고, 과장된 심판 묘사 자체를 그대로 살렸습니다.
  alternative_readings:
  - 산들은 그들의 피로 적셔질 것입니다
  - 산들은 그들의 피 때문에 무너질 것입니다
  rationale: 히브리어는 충격적인 심판의 수사학을 사용하므로, 설명적으로 바꾸기보다 이미지의 강도를 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
