  - 심판하기 위해
  lexicon: HALOT
  rationale: 문맥상 משפט은 법정적 판결만이 아니라 실제 심판 행위를 가리키므로, 동사화하여 문장의 흐름을 살렸습니다.
theological_decisions:
- issue: חֵרֶם의 번역 방식
  chosen_reading: '''내 저주의 대상이 된 백성''으로 풀어, 심판 아래 진멸 대상으로 구별된 뜻을 드러냈습니다.'
  alternative_readings:
  - 내 금령의 백성
  - 내 진멸의 백성
  - 내 저주받은 백성
  rationale: '''저주''만으로는 חֵרֶם의 전쟁-심판적 구별과 파멸성을 충분히 전달하지 못하고, ''금령''은 현대 독자에게 너무 불투명합니다. 따라서 의미를 노출하는 번역이 본문 의도에 더 가깝습니다.'
  doctrine_reference: Translation philosophy §§1, 6
