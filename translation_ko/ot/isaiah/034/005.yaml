  rationale: 문맥상 주의를 환기하는 감탄사로서, 현대 합쇼체에서 가장 자연스러운 직접 호소형으로 옮겼습니다.
- source_word: עַם חֶרְמִי
  english_pob_choice: the people of my ban
  chosen_korean: 내 저주의 대상이 된 백성
