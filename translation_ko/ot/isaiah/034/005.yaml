  lexicon: HALOT
  rationale: רוה의 포화 이미지를 한국어로 자연스럽게 살리면서도, 하늘/하늘들(복수형)의 우주적 배경을 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
