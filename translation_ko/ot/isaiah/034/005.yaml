source:
  edition: WLC
  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
  footnotes:
  - marker: a
    text: Or 'is sated in the heavens' / 'has drunk its fill in the heavens.' The Hebrew image is of Yahweh's sword being saturated before descending in judgment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the people of my ḥerem,' that is, the people devoted to destruction under divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 칼이 하늘에서 흠뻑 젖었기 때문입니다[a]. 보십시오, 그것이 에돔 위로, 내 저주의 대상이 된 백성 위로 내려가 심판할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘포화되었다’ 또는 ‘술을 마셔 흠뻑 찼다’는 뜻의 이미지를 담고 있습니다. 하나님의 칼이 심판을 위해 내려오기 전에 그 능력이 충만해진 모습을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 ḥerem의 백성’입니다. 이는 하나님의 심판 아래 진멸에 넘겨진 백성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִוְּתָה בַשָּׁמַיִם
  english_pob_choice: is drenched in the heavens
