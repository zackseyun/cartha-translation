  - 내 진멸의 백성
  - 내 금지된 백성
  lexicon: HALOT
  rationale: חֵרֶם의 성격을 단순한 '금지'가 아니라 하나님의 심판 아래 진멸 대상으로 구별된다는 점까지 드러내기 위해, 의미를 풀어 한국어로 전달했습니다.
