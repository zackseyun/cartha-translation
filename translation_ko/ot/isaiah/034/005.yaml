  lexicon: HALOT
  rationale: 문맥상 주의를 환기하는 감탄사로서, 현대 합쇼체에서 가장 자연스러운 직접 호소형으로 옮겼습니다.
- source_word: עַם חֶרְמִי
  english_pob_choice: the people of my ban
  chosen_korean: 내 저주의 대상이 된 백성
  alternatives_korean:
  - 내 금령의 백성
  - 내 진멸의 백성
  - 내 금지된 백성
  lexicon: HALOT
  rationale: חֵרֶם의 성격을 단순한 '금지'가 아니라 하나님의 심판 아래 진멸 대상으로 구별된다는 점까지 드러내기 위해, 의미를 풀어 한국어로 전달했습니다.
- source_word: לְמִשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판할 것입니다
  alternatives_korean:
  - 판결하기 위해
  - 재판을 위해
  - 심판하기 위해
  lexicon: HALOT
  rationale: 문맥상 משפט은 법정적 판결만이 아니라 실제 심판 행위를 가리키므로, 동사화하여 문장의 흐름을 살렸습니다.
theological_decisions:
- issue: חֵרֶם의 번역 방식
  chosen_reading: '''내 저주의 대상이 된 백성''으로 풀어, 심판 아래 진멸 대상으로 구별된 뜻을 드러냈습니다.'
  alternative_readings:
  - 내 금령의 백성
  - 내 진멸의 백성
  - 내 저주받은 백성
  rationale: '''저주''만으로는 חֵרֶם의 전쟁-심판적 구별과 파멸성을 충분히 전달하지 못하고, ''금령''은 현대 독자에게 너무 불투명합니다. 따라서 의미를 노출하는 번역이 본문 의도에 더 가깝습니다.'
  doctrine_reference: Translation philosophy §§1, 6
