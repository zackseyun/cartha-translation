  alternative_readings:
  - 국가 멸망에 대한 은유로만 제한
  - 문자적 천체 붕괴로만 고정
  rationale: 히브리어의 시적·종말론적 긴장을 보존하는 것이 본문의 힘을 가장 잘 전달하므로, 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 예언시의 종말 심판 이미지에 대한 해석적 긴장 보존
