  text: וְ/נָמַ֨קּוּ֙ כָּל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נָגֹ֥לּוּ כַ/סֵּ֖פֶר הַ/שָּׁמָ֑יִם וְ/כָל צְבָאָ֣/ם יִבּ֔וֹל כִּ/נְבֹ֤ל עָלֶה֙ מִ/גֶּ֔פֶן וּ/כְ/נֹבֶ֖לֶת מִ/תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
  footnotes:
  - marker: a
    text: Or 'will dissolve' for 'will rot away.' The Hebrew verb can denote wasting away, decaying, or dissolving.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the host of heaven,' a phrase that can refer to the heavenly array, especially the stars.
    reason: cultural_note
  - marker: c
    text: Or 'the heavens will be rolled up like a scroll.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'all their host,' likely referring to the heavenly bodies belonging to the skies/heavens.
    reason: lexical_alternative
  - marker: e
    text: Or 'like a leaf falling from the vine, and like a fig falling from the fig tree.' The Hebrew imagery allows either emphasis on withering or on the resulting fall.
    reason: alternative_reading
translation:
  language: ko
  text: 하늘의 모든 군대가 썩어 없어지고, 하늘들은 두루마리처럼 말려 버리며, 그들의 모든 군대도 잎이 포도나무에서 시들듯이, 그리고 무화과나무에서 마른 무화과처럼 시들 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘녹아 없어지고’. 히브리어 동사는 썩어 없어짐, 쇠약해짐, 용해됨을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘하늘의 군대’로, 특히 별들을 가리킬 수 있는 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘하늘들은 두루마리처럼 말려 버리며’.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그들의 모든 군대’로, 하늘/하늘들에 속한 천체들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘포도나무에서 잎이 떨어지듯이, 그리고 무화과나무에서 무화과가 떨어지듯이’. 히브리어 이미지는 시듦뿐 아니라 그에 따른 낙하까지도 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  english_pob_choice: the host of heaven
  chosen_korean: 하늘의 모든 군대
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 무리
  - 별들의 군대
  lexicon: HALOT
  rationale: צָבָא의 기본 의미를 살리면서도, 한국어에서 ‘군대’는 단순한 병력뿐 아니라 조직된 천상 무리의 이미지를 전달할 수 있어 ‘host of heaven’의 폭을 비교적 잘 보존합니다.
- source_word: נָמַקּוּ
  english_pob_choice: will rot away
  chosen_korean: 썩어 없어지고
  alternatives_korean:
  - 녹아 없어지고
  - 시들어 없어지고
  - 붕괴되고
  lexicon: HALOT
  rationale: 이 동사는 썩음·쇠약·용해의 뉘앙스를 가지므로, 심판 맥락의 구체적 붕괴감을 살리기 위해 ‘썩어 없어지고’로 옮겼습니다.
- source_word: נָגֹלּוּ כַסֵּפֶר
  english_pob_choice: will be rolled up like a scroll
  chosen_korean: 두루마리처럼 말려 버리며
  alternatives_korean:
  - 책처럼 말려 버리며
  - 두루마리처럼 말릴 것이며
  - 두루마리처럼 말려져
  lexicon: HALOT
  rationale: סֵפֶר은 고대 문맥에서 두루마리를 가리킬 수 있으므로, ‘두루마리’로 구체화해 말려 올라가는 형상을 직관적으로 살렸습니다.
- source_word: יִבּוֹל כִּנְבֹל עָלֶה מִגֶּפֶן וּכְנֹבֶלֶת מִתְּאֵנָה
  english_pob_choice: will wither like a leaf withers from the vine ... and like a withered fig from the fig tree
  chosen_korean: 잎이 포도나무에서 시들듯이, 그리고 무화과나무에서 마른 무화과처럼 시들 것입니다
  alternatives_korean:
  - 잎이 포도나무에서 떨어지듯이, 그리고 무화과나무에서 떨어지는 무화과처럼 시들 것입니다
  - 잎이 포도나무에서 시들듯이, 그리고 무화과나무에서 마른 무화과처럼 떨어질 것입니다
  lexicon: HALOT
  rationale: 반복되는 נבל 계열의 이미지를 ‘시들다’로 통일해, 잎과 무화과가 말라가는 병행 구조를 유지했습니다. 마지막 구는 영어 POB처럼 ‘withered fig’의 뜻을 반영해 ‘마른 무화과’로 옮겼습니다.
theological_decisions:
- issue: 우주적 심판 이미지의 성격
