  rationale: 하늘이 두루마리처럼 말리는 피동적 우주 붕괴 이미지를 명료하게 하고, 잎과 무화과의 병행을 자연스러운 한국어로 회복했습니다. ‘하늘의 군대’는 원문의 폭을 보존하기 위해 유지했으며, 천체라는 가능한 지시는 각주로 제한했습니다. 모든 각주 표지는 본문에서 해당 어구 뒤에 배치했습니다.
