    issue: 하늘이 스스로 ‘말려 버리며’라는 능동형으로 표현됨
    rationale: נָגֹלּוּ는 하늘이 두루마리처럼 말리는 변화를 나타내므로, 한국어에서는 ‘하늘은 두루마리처럼 말리고’가 피동적 이미지와 더 잘 맞습니다.
