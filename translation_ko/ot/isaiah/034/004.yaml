  verdict: revise
  source_fidelity: 초안은 우주적 심판의 병행 구조와 주요 어휘를 대체로 보존합니다. 그러나 נָגֹלּוּ는 ‘하늘들이 … 말려 버리며’처럼 하늘이 행위자가 되는 표현보다, 하늘이 말리는 피동적 변화로 옮기는 것이 더 정확합니다. 또한 마지막 비유는 ‘무화과나무에서 마른 무화과처럼 시들다’보다 포도나무 잎과 무화과나무의 열매가 시들거나 떨어지는 병행을 더 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘하늘의 모든 군대’는 성서적 문맥에서는 가능하나 현대 한국어에서 다소 거칠게 들릴 수 있습니다. 다만 원문의 군사적 ‘host’ 이미지를 보존할 수 있으므로 유지하되, 문장 전체를 ‘하늘은 … 말리고’와 ‘무화과나무의 무화과가 시들듯이’로 다듬으면 합쇼체 예언시로 자연스럽습니다.
  terminology: ‘두루마리’는 סֵפֶר의 고대 물질문화 및 ‘말리다’라는 비유에 잘 맞습니다. ‘하늘의 군대’는 천체로 확정하지 않고 원문의 폭을 보존하며, 각주에서 특히 별들을 가리킬 수 있음을 밝혀 충분합니다. נָמַקּוּ에는 ‘썩다’보다 이 문맥에서 더 자연스러우면서 의미 범위를 보존하는 ‘쇠하여 사라지다’를 사용합니다.
  issues:
