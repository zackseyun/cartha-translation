source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''For my mouth, it has commanded''; some translations keep the first person here: ''For my mouth has commanded.'''
    reason: alternative_reading
  - marker: b
    text: Or 'and his breath' or 'and his wind has gathered them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 책에서 찾아 읽으십시오. 이들 가운데 하나도 빠지지 않을 것입니다. 그 어느 것도 짝 없이 있지 않을 것입니다. 그의 입이 명령하였고[a], 그의 영이 그들을 모았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 문자적으로 ‘내 입이 명령하였다’에 가깝습니다. 일부 번역은 이 첫인칭을 유지합니다: ‘내 입이 명령하였다.’'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 숨결이 그들을 모았습니다’ 혹은 ‘그의 바람이 그들을 모았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  english_pob_choice: Search
  chosen_korean: 찾아 읽으십시오
  alternatives_korean:
  - 찾으십시오
  - 검색하십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘찾다’보다 책의 내용을 확인하라는 뜻이 강하므로, ‘찾아 읽으십시오’가 조사와 열람의 뉘앙스를 함께 살립니다.
- source_word: מֵעַל סֵפֶר יְהוָה
  english_pob_choice: in the book of Yahweh
  chosen_korean: 야훼의 책에서
  alternatives_korean:
  - 야훼의 책 안에서
  - 야훼의 책을 통해
  - 야훼의 책에서부터
  lexicon: HALOT
  rationale: 히브리어 전치사와 ספר는 문서 안을 열람하라는 관용적 의미로 읽히므로, 자연스러운 한국어로는 ‘책에서’가 가장 직접적입니다.
- source_word: אִשָּׁה רְעוּתָהּ
  english_pob_choice: none will lack her mate
  chosen_korean: 암컷은 자기 짝을 하나도 잃지 않을 것입니다
  alternatives_korean:
  - 어미는 자기 짝을 잃지 않을 것입니다
  - 아무것도 자기 짝을 잃지 않을 것입니다
  - 각 암컷은 자기 짝을 잃지 않을 것입니다
  lexicon: HALOT
  rationale: 동물 목록 문맥에서 רְעוּתָהּ는 ‘짝/배필’이 자연스럽고, 여성형 단수 표현의 분배적 의미를 한국어에서 분명히 드러내기 위해 ‘각’의 의미를 본문에 풀어 넣기보다 문장 전체로 처리했습니다.
- source_word: פִי / וְרוּחוֹ
  english_pob_choice: his mouth ... his Spirit
  chosen_korean: 그의 입이 ... 그의 영이
  alternatives_korean:
  - 내 입이 ... 그의 영이
  - 그의 입이 ... 그의 숨결이
  - 그의 입이 ... 그의 바람이
  lexicon: HALOT
  rationale: חִּי/רוּחוֹ 계열은 원문에서 입과 영의 병렬을 이루며, 전자는 하나님의 발화, 후자는 능동적 사역을 가리키므로 ‘영’이 가장 적절합니다. ‘숨결/바람’의 가능성은 본문 주석으로 보존합니다.
theological_decisions:
- issue: ‘my mouth’와 ‘his Spirit’ 사이의 인칭 전환
  chosen_reading: 본문은 ‘그의 입’과 ‘그의 영’으로 일관되게 옮기되, 첫 구절의 더 문자적인 첫인칭 가능성은 주석으로 남깁니다.
  alternative_readings:
  - 내 입이 명령하였고, 그의 영이 그들을 모았습니다
  - 내 입이 명령하였고, 내 영이 그들을 모았습니다
  rationale: 히브리어는 פי와 후행 인칭이 만드는 긴장을 지니므로, 이를 한국어에서 무리하게 평준화하기보다 가독성 있는 본문을 유지하면서 대안 독법을 주석으로 보존하는 것이 바람직합니다.
  doctrine_reference: 본문의 인칭 긴장을 보존
