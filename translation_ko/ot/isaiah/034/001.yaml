  verdict: revise
  source_fidelity: 첫 두 명령은 대체로 충실하지만, 히브리어 תִּשְׁמַע는 문맥상 청유/소집의 미완료형입니다. 초안의 ‘들을 것입니다’는 미래 서술로 바꾸어 원문의 호소력을 약화합니다. 또한 ‘땅’에 속한 충만함과 ‘세계’ 및 그 산출물을 병렬로 묶는 구조를 더 분명히 해야 합니다.
  naturalness: ‘민족들아’, ‘여러 백성들아’와 합쇼체 명령은 자연스럽습니다. 다만 무생물을 향한 예언적 소집에는 ‘들으십시오’가 ‘들을 것입니다’보다 자연스럽고 문체적으로 적절합니다.
  terminology: ‘민족들/여러 백성들’은 גוֹיִם/לְאֻמִּים의 평행을 잘 살립니다. מְלֹאָהּ는 ‘그 안에 가득한 모든 것’으로, צֶאֱצָאֶיהָ는 생성의 이미지를 유지하는 ‘그 모든 소산’으로 옮길 수 있습니다. ‘소산’의 범위가 생산물로만 좁아지지 않도록 대안 풀이를 각주에 둡니다.
