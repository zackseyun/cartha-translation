id: ISA.34.1
reference: Isaiah 34:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִרְב֤וּ גוֹיִם֙ לִ/שְׁמֹ֔עַ וּ/לְאֻמִּ֖ים הַקְשִׁ֑יבוּ תִּשְׁמַ֤ע הָ/אָ֨רֶץ֙ וּ/מְלֹאָ֔/הּ תֵּבֵ֖ל וְ/כָל צֶאֱצָאֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
  footnotes:
  - marker: a
    text: Or 'Draw near, nations, to hear; and peoples, pay attention.'
    reason: lexical_alternative
  - marker: b
    text: '''All its offspring'' may also be rendered ''all that comes from it'' or ''all its produce.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들아, 가까이 와서 들으십시오. 여러 백성들아, 귀를 기울이십시오. 땅이여, 그 안에 가득한 것들과 세계와 그 모든 소산이 들을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''가까이 오십시오'' 또는 ''다가오십시오''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''그 모든 소산''은 ''그 안에서 나온 모든 것'' 또는 ''그 생산물''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  english_pob_choice: Come near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가오십시오
  - 가까이 오십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 복수의 초청/소집 뉘앙스를 자연스러운 현대 한국어로 옮기되, 이어지는 '들으십시오'와 병렬이 되도록 했습니다.
- source_word: גוֹיִם
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 열국들
  - 나라들
  lexicon: HALOT
  rationale: 예언적 호칭에서 특정 이방인 집단보다 세계의 여러 민족을 가리키므로, '민족들'이 현대 한국어에서 가장 중립적이고 넓은 표현입니다.
- source_word: לְאֻמִּים
  english_pob_choice: peoples
  chosen_korean: 여러 백성들
  alternatives_korean:
  - 백성들
  - 나라들
  lexicon: HALOT
  rationale: גוֹיִם과 의미가 겹치는 평행구를 살리기 위해 같은 단어를 반복하지 않고, 시적 균형을 유지하는 '여러 백성들'로 옮겼습니다.
- source_word: מְלֹאָהּ
  english_pob_choice: all that fills it
  chosen_korean: 그 안에 가득한 것들
  alternatives_korean:
  - 그 충만함
  - 그 안의 모든 것
  lexicon: HALOT
  rationale: '''땅의 충만함''이라는 관용을 한국어로 풀어, 내용물 전체를 뜻하는 의미를 분명하게 드러냈습니다.'
- source_word: כָל צֶאֱצָאֶיהָ
  english_pob_choice: all its offspring
  chosen_korean: 그 모든 소산
  alternatives_korean:
  - 그 모든 자손
  - 그로부터 나온 모든 것
  lexicon: HALOT
  rationale: צאצאים의 문자적 '자손' 이미지를 직역하면 어색하므로, '거기서 비롯된 것들'이라는 생성적 의미를 살려 '소산'으로 옮겼습니다.
theological_decisions:
- issue: 보편적 소집의 대상 범위
  chosen_reading: 이 구절은 이스라엘만이 아니라 민족들, 여러 백성들, 땅과 세계 전체를 향한 우주적 소집으로 읽었습니다.
  alternative_readings:
  - 주변 국가들에 대한 제한적 소집
  - 지리적 '땅' 중심의 지역적 호소
  rationale: 문맥상 '땅', '세계', '그 모든 소산'이 함께 묶여 있어, 심판 선포의 청중이 전 세계적 범위라는 점을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 예언서의 열방 심판/보편 증언
