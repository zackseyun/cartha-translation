id: ISA.34.12
reference: Isaiah 34:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֹרֶ֥י/הָ וְ/אֵֽין שָׁ֖ם מְלוּכָ֣ה יִקְרָ֑אוּ וְ/כָל שָׂרֶ֖י/הָ יִ֥הְיוּ אָֽפֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
  footnotes:
  - marker: a
    text: Or, 'Its nobles will call, but there will be no kingdom there.' The Hebrew of the first line is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그 땅의 귀족들을[a] 부르겠지만, 거기에는 왕국이 없을 것이며, 그 모든 방백은 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 귀족들이 부르겠지만, 거기에는 왕국이 없을 것입니다.’ 히브리어 첫 행은 난해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹרֶיהָ
  english_pob_choice: its nobles
  chosen_korean: 그 귀족들
  alternatives_korean:
  - 그 고귀한 자들
  - 그 귀족 계층
  lexicon: HALOT
  rationale: 문맥상 지위가 높은 정치·사회 계층을 가리키므로, 현대 한국어에서 자연스럽고 격식을 살릴 수 있는 ‘귀족들’로 옮겼습니다.
- source_word: יִקְרָאוּ
  english_pob_choice: to proclaim
  chosen_korean: 부르겠지만
  alternatives_korean:
  - 선포하겠지만
  - 호명하겠지만
  - 외치겠지만
  lexicon: HALOT
  rationale: 히브리어 קרא는 ‘부르다/호명하다/선포하다’의 폭이 있지만, 본절의 1행은 어려운 구문이어서 POB의 오디트처럼 확정적 절차를 덧붙이지 않고 기본 의미를 살린 ‘부르다’ 계열로 처리했습니다.
- source_word: מְלוּכָה
  english_pob_choice: kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 왕권
  - 군주국
  lexicon: HALOT
  rationale: 여기서는 통치 체제와 영역을 함께 가리키는 말이므로, ‘왕국’이 가장 직설적으로 원의를 전달합니다.
- source_word: שָׂרֶיהָ
  english_pob_choice: its princes
  chosen_korean: 방백들
  alternatives_korean:
  - 통치자들
  - 고관들
  - 군주들
  lexicon: HALOT
  rationale: שׂר는 ‘방백/통치자’ 범주를 가리키며, 앞의 ‘귀족들’과 평행을 이루는 격조 높은 정치 용어로 ‘방백들’을 택했습니다.
- source_word: אָפֶס
  english_pob_choice: nothing
  chosen_korean: 아무것도 아닐 것입니다
  alternatives_korean:
  - 무(無)일 것입니다
  - 없을 것입니다
  - 헛될 것입니다
  lexicon: HALOT
  rationale: אָפֶס의 핵심은 완전한 무가 됨이므로, 존재 소멸의 강도를 살리되 현대 한국어에서 자연스러운 서술형인 ‘아무것도 아닐 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 첫 행의 난해한 구문 처리
  chosen_reading: ‘그 귀족들을 부르겠지만’으로 두되, 왕국이 없다는 다음 절을 별도로 두어 에돔의 정치 질서가 무너졌다는 점을 드러냈습니다.
  alternative_readings:
  - ‘그들의 귀족들이 부를 것이나’
  - ‘그 귀족들을 불러도 왕국은 없을 것입니다’
  rationale: 히브리어 첫 행은 압축적이라 주어·목적 관계가 애매하지만, 본절의 전체 요지는 왕국과 지배층의 소멸이므로 과도한 해석을 피하면서 문맥에 맞게 처리했습니다.
  doctrine_reference: 문맥 우선 번역 원칙, ISA 34 문맥의 심판·몰락 모티프
- issue: מְלוּכָה와 שָׂרֶיהָ의 정치적 대칭성
  chosen_reading: ‘왕국’과 ‘방백들’을 병렬로 배치하여 통치 구조 전체의 붕괴를 보이게 했습니다.
  alternative_readings:
  - ‘왕권’과 ‘고관들’
  - ‘나라’와 ‘통치자들’
  rationale: 둘 다 단순한 개인이 아니라 제도적 권위의 붕괴를 가리키므로, 각각 제도성과 계층성을 함께 드러내는 표현을 선택했습니다.
  doctrine_reference: 본문 문맥상 정치적 심판의 공적 성격
