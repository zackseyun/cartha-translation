  naturalness: ‘그들은 그 귀족들을’은 같은 지시어가 연속되어 다소 어색하고 소유 관계도 불명확합니다. 또한 ‘방백들은 아무것도 아닐 것입니다’는 직역투이므로 현대 표준 한국어 합쇼체에서는 ‘사라질 것입니다’가 문맥상 자연스럽습니다.
