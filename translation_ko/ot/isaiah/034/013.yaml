  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
  footnotes:
  - marker: a
    text: Or simply, 'for ostriches.' The Hebrew reads literally, 'for daughters of the ostrich,' an idiomatic expression for ostriches.
    reason: lexical_alternative
  - marker: b
    text: '''Jackals'' is the likely sense here; older English versions often have ''dragons.'''
    reason: alternative_reading
translation:
  language: ko
  text: 가시덤불이 그 궁전들 위에 자라나고, 쐐기풀과 가시덩굴이 그 요새들 안에 퍼질 것입니다. 그리하여 그곳은 자칼들의 거처가 되고[b], 타조들을 위한 풀밭이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘타조의 딸들을 위한’입니다. 이는 타조들을 가리키는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자칼들’이 여기서 가장 유력한 뜻입니다. 옛 번역들에는 ‘용들’로 옮긴 경우도 있습니다.
    reason: alternative_reading
