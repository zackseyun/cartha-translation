  source_fidelity: 히브리어는 궁전과 요새에 가시 식물이 무성해지고, 그곳이 תַּנִּים의 거처 तथा ‘타조의 딸들’(관용적으로 타조들)을 위한 풀밭이 되는 황폐의 이미지를 묘사합니다. 초안의 전체 의미는 대체로 충실하나, לִבְנוֹת יַעֲנָה를 ‘타조의 자식들’로 옮긴 것은 문자적으로도 ‘딸들’과 다르며 한국어로도 부자연스럽습니다. תַּנִּים은 여기서 ‘자칼들’이 가장 유력하므로, 한국 동물명 ‘승냥이’(dhole)보다 ‘자칼’이 더 정확합니다.
  naturalness: ‘그곳은 … 거처가 되고’와 ‘타조들을 위한 풀밭’은 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 각주 표지는 해당 어휘 바로 뒤에 두어 참조 관계를 분명히 했습니다.
  terminology: אַרְמְנוֹתֶיהָ/מִבְצָרֶיהָ는 각각 ‘궁전들/요새들’로 유지했습니다. נְוֵה는 ‘거처’, חָצִיר는 ‘풀밭’으로 구별했습니다. תַּנִּים은 ‘자칼들’로, לִבְנוֹת יַעֲנָה는 본문에서 관용적 뜻인 ‘타조들’로 옮기고 각주에서 문자 표현을 밝혔습니다.
  issues:
