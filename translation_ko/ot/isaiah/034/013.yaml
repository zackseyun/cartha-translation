    issue: ‘승냥이들’은 תַּנִּים의 유력한 동물학적 지시 대상인 자칼과 다릅니다.
    rationale: 현대 한국어에서 승냥이는 일반적으로 dhole을 가리키므로, 영어 POB의 ‘jackals’ 및 본문 문맥의 유력한 이해를 정확히 전달하려면 ‘자칼들’이 적절합니다.
  - severity: medium
