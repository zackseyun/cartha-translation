revisions:
- from: 그의 개울들은 역청으로 바뀌고, 그의 먼지는 유황으로 바뀌며, 그의 땅은 타오르는 역청이 될 것입니다.[a][b]
  to: 그 땅의 물길들은 역청으로 변하고[a], 그 땅의 먼지는 유황으로 변하며[b], 그 땅은 불타는 역청이 될 것입니다.
  rationale: 지시 대상인 땅을 ‘그 땅’으로 명시하여 원문의 소유 관계와 문맥을 정확히 전달하고, 한국어에서 부자연스럽고 남성 인물을 암시하는 ‘그의’를 제거했습니다. נחל의 사막 지형적 폭을 반영해 ‘물길들’로 조정했으며, 각주 표지는 해당 어휘 바로 뒤에 배치했습니다. 나머지 핵심 물질 용어와 불타는 묘사는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:41Z'
