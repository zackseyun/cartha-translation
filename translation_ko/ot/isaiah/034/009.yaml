id: ISA.34.9
reference: Isaiah 34:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶהֶפְכ֤וּ נְחָלֶ֨י/הָ֙ לְ/זֶ֔פֶת וַ/עֲפָרָ֖/הּ לְ/גָפְרִ֑ית וְ/הָיְתָ֣ה אַרְצָ֔/הּ לְ/זֶ֖פֶת בֹּעֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
  footnotes:
  - marker: a
    text: Or 'streams.' Hebrew נְחָלִים can refer to wadis, streambeds, or torrents.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional: ''brimstone.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 개울들은 역청으로 바뀌고, 그의 먼지는 유황으로 바뀌며, 그의 땅은 타오르는 역청이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개울길들’로 옮길 수 있습니다. 히브리어 נְחָלִים는 와디, 개울자국, 급류길을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘브림스톤’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלֶיהָ
  english_pob_choice: her wadis
  chosen_korean: 그의 개울들
  alternatives_korean:
  - 그의 와디들
  - 그의 물길들
  - 그의 시내들
  lexicon: HALOT
  rationale: נחל은 사막 지역 문맥에서 와디·개울자리를 가리킬 수 있어, 한국어에서는 자연스럽고 이해하기 쉬운 ‘개울들’로 옮겼습니다. 지형적 건조함은 문맥과 뒤의 ‘역청’ 이미지가 충분히 보존합니다.
- source_word: זֶפֶת
  english_pob_choice: pitch
  chosen_korean: 역청
  alternatives_korean:
  - 피치
  - 타르
  - 비튜멘
  lexicon: HALOT
  rationale: זפת은 역청/피치 계열 물질이므로, 한국어 성경에서 비교적 정확하고 자연스러운 ‘역청’을 택했습니다. ‘타르’는 현대적이지만 의미가 다소 좁고, ‘피치’는 음역 느낌이 강합니다.
- source_word: גָפְרִית
  english_pob_choice: sulfur
  chosen_korean: 유황
  alternatives_korean:
  - 브림스톤
  - 황
  lexicon: HALOT
  rationale: גפרית는 ‘유황’이 현대 한국어에서 가장 직접적이고 표준적인 대응입니다. 전통적 ‘브림스톤’은 본문 주석으로만 보완하는 편이 적절합니다.
- source_word: בֹּעֵרָה
  english_pob_choice: burning
  chosen_korean: 타오르는
  alternatives_korean:
  - 불타는
  - 활활 타는
  lexicon: HALOT
  rationale: 분사형의 진행적·묘사적 성격을 살리면서, ‘역청’과 결합할 때 불길이 살아 있는 이미지를 드러내기 위해 ‘타오르는’으로 옮겼습니다.
theological_decisions:
- issue: 여성형 소유격으로 반복되는 대상의 인격화
  chosen_reading: ‘그의’로 통일해 땅/지역이 여성형으로 의인화된 효과를 유지했습니다.
  alternative_readings:
  - ‘그것의’로 무인칭화
  - ‘그 땅의’로 재구성
  rationale: 히브리어는 3인칭 여성형 접미사를 반복해 땅을 의인화합니다. 한국어에서도 이를 평평하게 중화하기보다, 예언적 수사로서의 인격화 효과를 보존하는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: Translation philosophy §5 (consistency) and §6 (readable modern Korean)
