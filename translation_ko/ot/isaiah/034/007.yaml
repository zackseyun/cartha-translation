    issue: 심판 문맥의 동사 의미가 약화됨
    rationale: וְיָרְדוּ는 문자적으로 ‘내려가다’이지만, 여기서는 피 흘림과 제의적 도살의 이미지 속에서 몰락·죽임을 당함을 나타냅니다. ‘쓰러지다’가 이 문맥적 의미를 더 잘 전달합니다.
  - severity: low
    issue: 각주 표지가 해당 표현에 직접 붙어 있지 않음
    rationale: a는 רְאֵמִים(들소들), b는 אַבִּירִים(강한 자들)의 번역 선택을 설명하므로, 독자가 해당 어휘와 각주를 즉시 연결할 수 있도록 각 단어 뒤에 배치해야 합니다.
