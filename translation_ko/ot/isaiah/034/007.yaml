theological_decisions:
- issue: 동물 이미지와 인간 심판의 이중성
  chosen_reading: 동물 명칭을 본문에 그대로 두어, 피조물의 죽음과 강자들의 몰락이 겹쳐지는 예언적 심판 이미지를 유지했습니다.
  alternative_readings:
  - 모든 동물 표현을 인간 지배자들의 은유로만 처리하기
  - 실제 제물 동물로만 제한하기
  rationale: 히브리어 시는 제사와 전쟁 이미지를 함께 사용하므로, 어느 한쪽으로 환원하지 않고 문학적 긴장을 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
