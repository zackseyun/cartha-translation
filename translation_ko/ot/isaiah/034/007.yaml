base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
  footnotes:
  - marker: a
    text: Or 'oryxes' for 'wild oxen'; the Hebrew רְאֵמִים refers to a powerful wild bovine, though the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''The mighty ones'' may refer to powerful warriors or, in the poetic imagery, to strong bulls; the Hebrew allows either or both nuances.'
    reason: alternative_reading
translation:
  language: ko
  text: 들소들[a]이 그들과 함께 쓰러지고, 어린 수소들이 그 강한 자들[b]과 함께 쓰러집니다. 그들의 땅은 피로 흠뻑 젖고, 그들의 먼지는 기름으로 기름지게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 רְאֵמִים은 정확한 종이 불확실한, 크고 힘센 야생 소과 동물을 가리키는 말입니다. ‘오릭스들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강한 자들’은 강력한 용사들을 가리킬 수도 있고, 시적 이미지 안에서는 힘센 황소들을 가리킬 수도 있습니다. 본문은 두 가능성을 모두 열어 둡니다.
    reason: alternative_reading
