translation:
  language: ko
  text: 이는 야훼께 복수의 날이요, 시온의 송사를 갚으시는 해입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘야훼께 복수의 날이 있고, 시온의 송사에 대한 갚으심의 해가 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞 절의 심판 선언을 이어 주는 설명적 연결이므로, 현대 한국어에서 자연스럽고 단정한 인과 연결인 ‘이는’으로 옮겼습니다.
- source_word: יוֹם נָקָם
  english_pob_choice: day of vengeance
  chosen_korean: 복수의 날
  alternatives_korean:
  - 보복의 날
  - 징벌의 날
  lexicon: HALOT
  rationale: נָקָם은 단순 감정적 앙갚음보다 न्याय적 응보의 뜻이 강하므로, 본문의 심판 맥락을 살리되 직역의 힘을 유지하는 ‘복수의 날’을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: the LORD has
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼의
  - 야훼를 위하여
  lexicon: HALOT
  rationale: ל는 여기서 소유/귀속 관계를 나타내므로, 한국어에서는 여격 표지 ‘께’로 풀어 주어 그 날이 야훼에게 속한 정한 때라는 점을 드러냈습니다.
- source_word: שִׁלּוּמִים
  english_pob_choice: recompense
  chosen_korean: 갚으시는
  alternatives_korean:
  - 보응의
  - 보상하는
  lexicon: HALOT
  rationale: 명사형의 ‘recompense’를 한국어에서는 동사적 표현으로 자연화하여, 행위의 적극성을 드러내는 ‘갚으시는’으로 옮겼습니다.
- source_word: לְרִיב צִיּוֹן
  english_pob_choice: for Zion’s cause
  chosen_korean: 시온의 송사를
  alternatives_korean:
  - 시온의 소송을
  - 시온의 다툼을
  - 시온의 변론을
  lexicon: HALOT
  rationale: רִיב은 단순한 분쟁이 아니라 법정적 송사/송론을 가리킬 수 있으므로, 시온의 억울함을 변호하는 법정적 뉘앙스를 살려 ‘송사’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명 יהוה를 표준 번역 관행보다 원어 발음에 더 가까운 ‘야훼’로 드러내어, 고유한 언약 이름의 무게를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
