  source_fidelity: 개정이 필요합니다. לַיהוָה는 이 문맥에서 야훼에게 속하거나 야훼를 위한 날이라는 관계를 나타내는데, 초안의 ‘야훼께 복수의 날’은 한국어 문장으로 부자연스럽고 귀속 관계도 불명확합니다. 또한 שְׁנַת שִׁלּוּמִים לְרִיב צִיּוֹן은 ‘시온의 송사를 갚으시는 해’라기보다 ‘시온의 송사를 위한 보응/응보의 해’입니다.
  naturalness: ‘야훼께는 … 있고’와 ‘… 위한 보응의 해’는 현대 표준 한국어의 격식 있는 문체에서 자연스럽고, 원문의 병행 구조도 유지합니다. ‘이는’이 이끄는 인과절에는 ‘있기 때문입니다’가 적절합니다.
