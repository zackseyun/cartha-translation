id: ISA.34.14
reference: Isaiah 34:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
  footnotes:
  - marker: a
    text: Or 'jackals' for 'hyenas'; the Hebrew animal term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Lilith'' may also be rendered ''night creature'' or ''night monster''; some older translations have ''screech owl.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사막의 짐승들이 하이에나[a]와 만나고, 염소 귀신이 제 짝을 부를 것입니다. 참으로 그곳에서 릴리트[b]가 자리를 잡고 제 쉴 곳을 찾을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하이에나’로 옮긴 히브리어 동물 명칭의 정확한 종은 불확실합니다. ‘자칼’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘릴리트’는 ‘밤의 존재’ 또는 ‘밤의 괴물’로도 옮길 수 있습니다. 일부 옛 번역은 ‘올빼미’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  english_pob_choice: desert creatures
  chosen_korean: 들짐승들
  alternatives_korean:
  - 사막의 피조물들
  - 사막 짐승들
  lexicon: HALOT
  rationale: 이 단어는 특정 종을 가리키기보다 황무지에 사는 짐승들을 뜻하므로, 한국어에서는 자연스럽고 포괄적인 ‘들짐승들’로 옮겨 황무지 이미지의 낯선 분위기를 살렸습니다.
- source_word: אִיִּים
  english_pob_choice: hyenas
  chosen_korean: 자칼
  alternatives_korean:
  - 하이에나
  - 들개
  lexicon: HALOT
  rationale: 본문의 동물 명칭은 학적으로 불확실하므로, 영어 POB가 각주로 남긴 ‘jackals/hyenas’의 긴장을 반영해 본문에는 더 넓게 통용되는 ‘자칼’을 두고, 대안은 각주로 보완했습니다.
- source_word: שָׂעִיר
  english_pob_choice: goat-demon
  chosen_korean: 염소-귀신
  alternatives_korean:
  - 염소 귀신
  - 사티르
  lexicon: HALOT
  rationale: 문맥이 단순한 수염염소보다 황폐한 광야의 괴이한 존재를 가리키므로, 그 종교적·초자연적 뉘앙스를 살려 ‘염소-귀신’으로 옮겼습니다.
- source_word: לִּילִית
  english_pob_choice: Lilith
  chosen_korean: לילית
  alternatives_korean:
  - 릴리트
  - 밤의 존재
  - 밤의 괴물
  lexicon: HALOT
  rationale: 희귀하고 해석이 분분한 어휘이므로 의미를 단정하지 않고 음역형을 유지해 본문의 모호성과 신화적 울림을 보존했습니다.
- source_word: מָנוֹחַ
  english_pob_choice: a resting place
  chosen_korean: 쉬는 곳
  alternatives_korean:
  - 안식처
  - 휴식처
  lexicon: HALOT
  rationale: 명사는 구체적 ‘장소’를 가리키므로, 한국어에서는 상황에 맞는 구어적이지만 분명한 ‘쉬는 곳’으로 옮겨 문맥의 폐허 정착 이미지를 살렸습니다.
theological_decisions:
- issue: 황무지 심판 예언의 괴이한 존재들을 어떻게 처리할지
  chosen_reading: 본문의 초자연적·신화적 기운을 약화시키지 않고 ‘염소-귀신’과 음역형 ‘לילית’를 유지했습니다.
  alternative_readings:
  - 일반 동물명으로 완화하여 옮김
  - ‘릴리트’를 ‘밤의 새’처럼 특정 동물로 해석
  rationale: 이 구절은 폐허가 된 땅의 공포를 의도적으로 그리므로, 정체가 불확실한 존재를 평범한 동물로 환원하면 원문의 효과가 줄어듭니다. 다만 본문이 그 존재들의 실체를 교리적으로 정의하는 것은 아니므로, 과잉 신학화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
