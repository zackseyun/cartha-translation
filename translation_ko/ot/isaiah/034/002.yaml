id: ISA.34.2
reference: Isaiah 34:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
  footnotes:
  - marker: a
    text: Hebrew 'their host' can also be rendered 'their armies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he has put them under the ban'; the Hebrew verb carries the sense of devoting something to destruction under divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 모든 나라에게 진노하시며, 그들의 모든 군대[a]에게 분노하십니다. 그들을 진멸에 바치셨고[b], 살육에 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 모든 군대’는 ‘그들의 모든 군사’ 또는 ‘그들의 모든 무리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진멸에 바치셨고’는 히브리어 חרם의 표현으로, 하나님의 심판 아래 파멸에 바치거나 진멸하도록 정한다는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה / לַיהוָה
  english_pob_choice: Yahweh / the LORD has
  chosen_korean: 야훼께서는
  alternatives_korean:
  - 주께서는
  - 여호와께서는
  lexicon: HALOT
  rationale: 원문의 신명사יהוה를 직접 가리키는 인명 표기로 옮겨, 본문이 지닌 언약적·개인적 이름의 힘을 살렸습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 나라들
  alternatives_korean:
  - 모든 민족들
  - 모든 이방 민족들
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 특정 종교집단이 아니라 열방 전체를 가리키므로, ‘나라들’이 가장 자연스럽고 범위도 잘 드러냅니다.
- source_word: צְבָאָם
  english_pob_choice: their host
  chosen_korean: 그들의 모든 군대
  alternatives_korean:
  - 그들의 모든 군사
  - 그들의 모든 군대들
  - 그들의 모든 군중
  lexicon: HALOT
  rationale: צָבָא의 군사적 집합성을 살리기 위해 ‘군대’를 택했고, 인칭접미사가 붙은 전체 범위를 분명히 하려고 ‘모든’을 유지했습니다.
- source_word: הֶחֱרִימָם
  english_pob_choice: he has devoted them to destruction
  chosen_korean: 그들을 멸망에 내어주셨고
  alternatives_korean:
  - 그들을 멸절시키셨고
  - 그들을 진멸하도록 바치셨고
  - 그들을 바치셨고
  lexicon: HALOT
  rationale: חרם의 ‘저주 아래 헌납된 파괴’라는 판단적 의미를 살리되, 한국어에서 더 직접적으로 읽히는 ‘멸망에 내어주다’로 옮겼습니다.
- source_word: לַטָּבַח
  english_pob_choice: to the slaughter
  chosen_korean: 도살을 위해 넘기셨습니다
  alternatives_korean:
  - 도살로 넘기셨습니다
  - 학살을 위해 넘기셨습니다
  - 살육을 위해 넘기셨습니다
  lexicon: HALOT
  rationale: טֶבַח의 피비린내 나는 도살 이미지를 살리면서, ‘넘기다’로 앞절의 법정적·처분적 어감을 이어갔습니다.
theological_decisions:
- issue: לַיהוָה의 신명사 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 하나님의 이름을 일반 호칭이 아니라 고유명으로 사용하므로, 한국어 본문에서도 대체 호칭보다 이름 자체를 드러내는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הֶחֱרִימָם의 חרם 개념
  chosen_reading: 멸망에 내어주셨고
  alternative_readings:
  - 진멸하셨고
  - 저주 아래 두셨고
  - 파멸하도록 바치셨고
  rationale: חרם은 단순 파괴가 아니라 하나님의 심판 아래 구별되어 파멸에 이르는 개념이므로, ‘멸망에 내어주다’로 판단성과 결과를 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #6'
