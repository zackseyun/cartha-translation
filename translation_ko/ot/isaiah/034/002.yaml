  source_fidelity: 원문의 두 명사구는 ‘야훼께 진노가 있다’는 현재의 심판 선언이며, 뒤의 두 완료형은 심판을 확정적으로 선포합니다. 초안의 ‘분노와 … 진노를 품으셨습니다’는 קֶצֶף/חֵמָה의 서술을 내면적 감정 상태로 바꾸고 완료 시제로 고정하여, 원문의 구문과 선포적 힘을 다소 흐립니다. הֶחֱרִימָם은 단순히 멸망에 넘기는 것보다 진멸에 바치거나 파멸에 지정하는 ḥērem의 의미를 포함합니다.
  naturalness: ‘야훼께서는 … 진노하시며 … 분노하십니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 두 히브리어 분노 어휘의 병렬도 유지합니다. 인간 집단에 대한 טֶבַח에는 ‘도살’보다 ‘살육’이 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘야훼’는 제공된 번역 원칙과 일치합니다. צְבָאָם은 문맥상 ‘그들의 모든 군대’로 적절합니다. חרם의 특수한 심판·봉헌 의미는 ‘진멸에 바치셨고’ 및 각주로 보존했습니다.
