revisions:
- from: 야훼께서는 모든 나라들에 대한 분노와 그들의 모든 군대에 대한 진노를 품으셨습니다. 그는 그들을 멸망에 내어주셨고, 도살을 위해 넘기셨습니다.[a][b]
  to: 야훼께서는 모든 나라에게 진노하시며, 그들의 모든 군대[a]에게 분노하십니다. 그들을 진멸에 바치셨고[b], 살육에 넘기셨습니다.
  rationale: 명사구의 현재적 심판 선언은 ‘진노하시며 … 분노하십니다’로, חרם의 고유한 심판·진멸 의미는 ‘진멸에 바치셨고’로 옮겼습니다. נְתָנָם לַטָּבַח의 처분·인도 의미는 ‘살육에 넘기셨습니다’로 유지했습니다. 각주 표지도 각 해당 번역어에 직접 붙였습니다.
