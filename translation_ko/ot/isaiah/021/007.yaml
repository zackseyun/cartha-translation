  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
  footnotes:
  - marker: a
    text: Hebrew literally, 'attention, great attention' or 'he listened, much listening,' an emphatic repetition stressing careful listening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 기마대, 곧 한 쌍의 기병들[a], 나귀를 탄 기마대, 낙타를 탄 기마대를 보았습니다. 그리고 그는 큰 주의로 귀를 기울였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주의, 큰 주의’ 또는 ‘그가 들었고, 많이 들었다’는 뜻으로, 주의 깊게 듣는 행위를 강조하는 반복입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶכֶב
  english_pob_choice: riders
  chosen_korean: 기마대
  alternatives_korean:
