  rationale: 이 문맥에서는 말 그대로의 수레가 아니라 말·나귀·낙타를 탄 이동 집단을 가리키므로, 개별 탑승자를 풀어쓴 ‘기마대’가 가장 자연스럽고 출처 의미도 보존합니다.
