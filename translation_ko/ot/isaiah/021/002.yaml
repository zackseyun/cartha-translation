  - 그 여자의 모든 신음소리
  - 그 여인의 모든 신음
  lexicon: HALOT
  rationale: אנחה는 지속적 고통의 ‘신음/탄식’에 가깝고, 성별 지시 대명사의 불명확성을 유지하기 위해 ‘그 여자’로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 대명사 אַ/הּ의 지시 대상
  chosen_reading: 본문에서는 특정 도시나 민족 이름을 넣지 않고 ‘그 여자’로 남겨 두었습니다.
  alternative_readings:
  - 바빌론의 신음
  - 그 땅의 신음
  - 그 여인의 신음
  rationale: 히브리어는 여성형 단수 대명사만 제시하며 즉시 식별되는 선행사가 없으므로, 해석으로 좁히기보다 원문의 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문이 의도적으로 남겨 둔 지시 대상의 긴장을 유지합니다.
