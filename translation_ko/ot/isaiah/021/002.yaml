source:
  edition: WLC
  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
  footnotes:
  - marker: a
    text: Or 'the treacherous one deals treacherously, and the plunderer plunders.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'all her groaning'; the feminine referent is not explicitly identified in this verse.
    reason: alternative_reading
translation:
  language: ko
  text: 가혹한 환시가 제게 알려졌습니다. 신의를 저버리는 자는 신의를 저버리고, 약탈하는 자는 약탈합니다.[a] 올라가십시오, 엘람이여. 포위하십시오, 메대여. 나는 그 모든 신음을 그치게 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배신하는 자는 배신하고, 파괴하는 자는 파괴합니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그녀의 모든 신음’이라는 여성 단수 소유 접미사를 사용합니다. 그 지시 대상은 이 절에서 명시되지 않았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  english_pob_choice: A harsh vision
