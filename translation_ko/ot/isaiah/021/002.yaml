id: ISA.21.2
reference: Isaiah 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
  footnotes:
  - marker: a
    text: Or 'the treacherous one deals treacherously, and the plunderer plunders.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'all her groaning'; the feminine referent is not explicitly identified in this verse.
    reason: alternative_reading
translation:
  language: ko
  text: '혹독한 환상이 제게 알려졌습니다: 배신자는 배신하고, 파괴자는 파괴합니다. 올라가라, 엘람이여; 포위하라, 메대여. 나는 그 여자의 모든 신음을 끝내 버렸습니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘배신하는 자가 배신하고, 약탈하는 자가 약탈한다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 여자의 모든 신음’이라고 되어 있으나, 여기서 그 여성형 지시 대상은 분명히 밝혀지지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  english_pob_choice: A harsh vision
  chosen_korean: 혹독한 환상
  alternatives_korean:
  - 가혹한 환상
  - 엄중한 환상
  - 거친 환상
  lexicon: HALOT
  rationale: חזות는 예언적 ‘환상’이고, קשה는 강도와 엄중함을 나타내므로 ‘혹독한’이 문맥의 중압감을 자연스럽게 살립니다.
- source_word: הֻגַּד לִי
  english_pob_choice: has been declared to me
  chosen_korean: 제게 알려졌습니다
  alternatives_korean:
  - 제게 선언되었습니다
  - 제게 말해졌습니다
  - 제게 전해졌습니다
  lexicon: HALOT
  rationale: 수동형 נגד과 לִי의 구조를 살려, 예언자에게 계시가 전달되었음을 공손하고도 단정하게 표현했습니다.
- source_word: הַבּוֹגֵד בּוֹגֵד וְהַשּׁוֹדֵד שׁוֹדֵד
  english_pob_choice: the betrayer betrays / the destroyer destroys
  chosen_korean: 배신자는 배신하고, 파괴자는 파괴합니다
  alternatives_korean:
  - 배신하는 자는 배신하고, 약탈자는 약탈합니다
  - 배반자는 배반하고, 멸망시키는 자는 멸망시킵니다
  - 속이는 자는 속이고, 노략하는 자는 노략합니다
  lexicon: HALOT
  rationale: 반복된 어근의 수사적 강세를 한국어에서도 그대로 살려, 명사형보다 동사 반복으로 압축감과 규탄의 리듬을 유지했습니다.
- source_word: עֲלִי ... צוּרִי
  english_pob_choice: Go up ... lay siege
  chosen_korean: 올라가라 ... 포위하라
  alternatives_korean:
  - 올라가라 ... 에워싸라
  - 공격하라 ... 포위하라
  - 올라가라 ... 포위 공격하라
  lexicon: HALOT
  rationale: 전쟁 명령의 관용적 동사쌍을 살려, 군사적 진격과 포위의 긴박함을 직역보다 자연스럽게 전달했습니다.
- source_word: כָּל אַנְחָתָהּ
  english_pob_choice: all her groaning
  chosen_korean: 그 여자의 모든 신음
  alternatives_korean:
  - 그 여자의 모든 탄식
  - 그 여자의 모든 신음소리
  - 그 여인의 모든 신음
  lexicon: HALOT
  rationale: אנחה는 지속적 고통의 ‘신음/탄식’에 가깝고, 성별 지시 대명사의 불명확성을 유지하기 위해 ‘그 여자’로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 대명사 אַ/הּ의 지시 대상
  chosen_reading: 본문에서는 특정 도시나 민족 이름을 넣지 않고 ‘그 여자’로 남겨 두었습니다.
  alternative_readings:
  - 바빌론의 신음
  - 그 땅의 신음
  - 그 여인의 신음
  rationale: 히브리어는 여성형 단수 대명사만 제시하며 즉시 식별되는 선행사가 없으므로, 해석으로 좁히기보다 원문의 모호성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문이 의도적으로 남겨 둔 지시 대상의 긴장을 유지합니다.
