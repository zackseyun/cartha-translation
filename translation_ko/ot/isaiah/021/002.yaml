  - 제게 전해졌습니다
  lexicon: HALOT
  rationale: 수동형 נגד과 לִי의 구조를 살려, 예언자에게 계시가 전달되었음을 공손하고도 단정하게 표현했습니다.
- source_word: הַבּוֹגֵד בּוֹגֵד וְהַשּׁוֹדֵד שׁוֹדֵד
  english_pob_choice: the betrayer betrays / the destroyer destroys
  chosen_korean: 배신자는 배신하고, 파괴자는 파괴합니다
  alternatives_korean:
  - 배신하는 자는 배신하고, 약탈자는 약탈합니다
  - 배반자는 배반하고, 멸망시키는 자는 멸망시킵니다
  - 속이는 자는 속이고, 노략하는 자는 노략합니다
  lexicon: HALOT
  rationale: 반복된 어근의 수사적 강세를 한국어에서도 그대로 살려, 명사형보다 동사 반복으로 압축감과 규탄의 리듬을 유지했습니다.
- source_word: עֲלִי ... צוּרִי
  english_pob_choice: Go up ... lay siege
  chosen_korean: 올라가라 ... 포위하라
  alternatives_korean:
  - 올라가라 ... 에워싸라
  - 공격하라 ... 포위하라
  - 올라가라 ... 포위 공격하라
  lexicon: HALOT
  rationale: 전쟁 명령의 관용적 동사쌍을 살려, 군사적 진격과 포위의 긴박함을 직역보다 자연스럽게 전달했습니다.
- source_word: כָּל אַנְחָתָהּ
  english_pob_choice: all her groaning
  chosen_korean: 그 여자의 모든 신음
  alternatives_korean:
