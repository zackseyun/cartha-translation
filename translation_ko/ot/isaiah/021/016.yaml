base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
  footnotes:
  - marker: a
    text: Or 'all the splendor/wealth of Kedar.' The Hebrew word can denote glory, honor, splendor, or material abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주께서 제게 이렇게 말씀하셨습니다. 「일 년 안에 — 품꾼의 햇수처럼 — 게달의 모든 영광이 끝날 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘게달의 모든 화려함/풍요.’ 히브리어는 영광, 존귀, 화려함, 물질적 풍요를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹּה אָמַר אֲדֹנָי אֵלַי
  english_pob_choice: For thus the Lord said to me
  chosen_korean: 그러므로 주께서 제게 이렇게 말씀하셨습니다
  alternatives_korean:
  - 이는 주께서 제게 이렇게 말씀하셨습니다
  - 주께서 제게 이렇게 말씀하셨습니다
  lexicon: HALOT
  rationale: כִּי의 연결을 앞뒤 문맥의 근거 제시로 보고, 예언 선언형 공식은 한국어에서 자연스러운 보고체로 옮겼습니다.
- source_word: בְּעוֹד שָׁנָה
  english_pob_choice: Within a year
  chosen_korean: 일 년 안에
  alternatives_korean:
  - 한 해 안에
  - 1년 뒤에
  lexicon: HALOT
  rationale: 기한이 남아 있는 기간을 뜻하므로, 현대 한국어에서 가장 자연스러운 시간 표현으로 옮겼습니다.
- source_word: כִּשְׁנֵי שָׂכִיר
  english_pob_choice: like the years of a hired worker
  chosen_korean: 품꾼의 햇수처럼
  alternatives_korean:
  - 고용된 일꾼의 햇수처럼
  - 품삯꾼이 헤아리는 해처럼
  lexicon: HALOT
  rationale: ‘품꾼’은 בר? source의 שָׂכִיר가 가리키는 삯을 받고 일하는 사람을 잘 살리고, ‘햇수’는 정확히 세어지는 기간이라는 비유를 보존합니다.
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 광휘
  - 존귀
  - 풍요
  lexicon: HALOT
  rationale: כָּבוֹד의 기본 의미인 ‘영광’을 살리되, 본문의 심판 예언 문맥에 맞는 넓은 표현으로 유지했습니다.
- source_word: קֵדָר
  english_pob_choice: Kedar
  chosen_korean: 게달
  alternatives_korean:
  - 케다르
  - 게다르
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 표기했고, 성경 지명으로 통용될 수 있는 형태를 택했습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 처리
  chosen_reading: 주께서
  alternative_readings:
  - 주님께서
  - 주 하나님께서
  rationale: 본문의 אֲדֹנָי는 여호와 표기와 구별되는 호칭이므로, 직설적이고 경어적인 ‘주께서’로 번역해 호칭의 기능을 보존했습니다.
