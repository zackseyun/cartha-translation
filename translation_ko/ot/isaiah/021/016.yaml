  text: 이는 주께서 제게 이렇게 말씀하셨기 때문입니다. “일 년 안에, 품꾼의 햇수처럼, 게달의 모든 영광[a]이 끝날 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
