  rationale: מָתְנַיִם은 문자적으로 허리/몸통 부위를 가리키므로, 한국어에서도 구체적 신체 이미지를 살리되 문맥상 자연스럽게 ‘고통으로 가득 찼습니다’로 옮겼습니다.
