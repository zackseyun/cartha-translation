id: ISA.21.3
reference: Isaiah 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֗ן מָלְא֤וּ מָתְנַ/י֙ חַלְחָלָ֔ה צִירִ֣ים אֲחָז֔וּ/נִי כְּ/צִירֵ֖י יֽוֹלֵדָ֑ה נַעֲוֵ֣יתִי מִ/שְּׁמֹ֔עַ נִבְהַ֖לְתִּי מֵ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
  footnotes:
  - marker: a
    text: Or 'trembling' for 'anguish'; the Hebrew term denotes intense bodily shaking or writhing distress.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am twisted' / 'I am bowed down' for 'I am bent over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 허리는 고통으로 가득 찼습니다[a]. 진통이 해산하는 여인의 진통처럼 나를 덮쳤습니다. 듣고 나서 나는 몸을 굽혔고[b], 보고 나서 나는 두려워졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전율’. 이 히브리어는 격심한 떨림이나 몸부림치는 괴로움을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 뒤틀렸고’ / ‘나는 굽어졌고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  english_pob_choice: my loins are filled
  chosen_korean: 내 허리는 고통으로 가득 찼습니다
  alternatives_korean:
  - 내 허리는 anguish로 가득 찼습니다
  - 내 몸은 고통으로 가득 찼습니다
  lexicon: HALOT
  rationale: מָתְנַיִם은 문자적으로 허리/몸통 부위를 가리키므로, 한국어에서도 구체적 신체 이미지를 살리되 문맥상 자연스럽게 ‘고통으로 가득 찼습니다’로 옮겼습니다.
- source_word: חַלְחָלָה
  english_pob_choice: anguish
  chosen_korean: 고통
  alternatives_korean:
  - 전율
  - 몸부림침
  - 공포
  lexicon: HALOT
  rationale: 이 어휘는 강한 신체적 떨림과 괴로움을 나타내므로, 문맥의 산고 비유와 함께 읽힐 때 ‘고통’이 가장 직접적이고 과도하게 해석하지 않는 표현입니다.
- source_word: נַעֲוֵיתִי
  english_pob_choice: I am bent over
  chosen_korean: 나는 몸을 굽혔고
  alternatives_korean:
  - 나는 굽어졌고
  - 나는 뒤틀렸고
  lexicon: HALOT
  rationale: 수동적 상태 변화와 신체적 굴곡을 드러내기 위해 ‘몸을 굽혔고’로 옮겼습니다. POB의 ‘bent over’와 같은 육체적 압박을 반영합니다.
- source_word: נִבְהַלְתִּי
  english_pob_choice: I am dismayed
  chosen_korean: 나는 두려워졌습니다
  alternatives_korean:
  - 나는 당황했습니다
  - 나는 놀랐습니다
  - 나는 낙담했습니다
  lexicon: HALOT
  rationale: 이 동사는 불안·당혹·두려움의 동요를 포괄하므로, 여기서는 시각적 충격에 대한 강한 반응을 살려 ‘두려워졌습니다’로 번역했습니다.
theological_decisions:
- issue: 출산 고통 비유의 보존
  chosen_reading: ‘해산하는 여인의 진통처럼’이라는 직유를 그대로 살려, 예언자의 내적 공포를 육체적 산고의 이미지로 드러냈습니다.
  alternative_readings:
  - ‘산고처럼’으로 일반화
  - ‘진통처럼’만 남김
  rationale: 본문의 비교는 단순한 통증보다 더 강한, 출산의 생생한 육체성을 전달합니다. 이를 약화하지 않기 위해 여성 출산 이미지를 유지했습니다.
  doctrine_reference: 예언시의 수사적 강도 보존
