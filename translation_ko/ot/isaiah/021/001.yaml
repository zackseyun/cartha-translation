  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א מִדְבַּר יָ֑ם כְּ/סוּפ֤וֹת בַּ/נֶּ֨גֶב֙ לַֽ/חֲלֹ֔ף מִ/מִּדְבָּ֣ר בָּ֔א מֵ/אֶ֖רֶץ נוֹרָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
  footnotes:
  - marker: a
    text: Or 'the desert by the sea.' The Hebrew phrase is unusual and may function as a poetic geographical designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'like storms in the south passing through.' 'Negev' can mean the southern region or simply 'south.'
    reason: lexical_alternative
  - marker: c
    text: The subject of 'comes' is implicit in Hebrew and may refer to the storm-like force just described.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀입니다. 「바다의 광야에 관한 오라클—네게브의 회오리바람처럼, 휩쓸고 지나가며—그것은 광야에서 오며, 두려운 땅에서 옵니다。」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현이 매우 이례적이어서, '바다의 광야'는 시적 지리 명칭처럼 기능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''네게브''는 남쪽 지역 또는 단순히 ''남쪽''을 뜻할 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''오다''의 주어는 히브리어에서 생략되어 있으며, 앞의 폭풍 같은 힘을 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 오라클
  alternatives_korean:
  - 예언
  - 선포
  - 부담
  lexicon: HALOT
  rationale: 예언서 표제어로서의 문맥 기능을 살리면서, 물리적 '부담'의 의미를 피하기 위해 '오라클'을 택했습니다.
- source_word: מִדְבַּר יָם
  english_pob_choice: the wilderness of the sea
  chosen_korean: 바다의 광야
  alternatives_korean:
  - 바닷가의 광야
  - 바다 광야
  - 바다 옆 광야
  lexicon: HALOT
  rationale: 히브리어의 기이한 결합을 그대로 드러내기 위해 구조를 보존해 옮겼습니다. 해석으로 지명을 풀어버리기보다 본문의 이질감을 남기는 것이 적절합니다.
- source_word: כְּסוּפוֹת
  english_pob_choice: like whirlwinds
  chosen_korean: 회오리바람처럼
  alternatives_korean:
  - 폭풍처럼
  - 소용돌이바람처럼
  - 회오리처럼
  lexicon: HALOT
  rationale: סער성의 격렬한 바람 이미지를 한국어에서 자연스럽게 전달하면서도, 단순한 비유 약화 없이 유지했습니다.
- source_word: לַחֲלֹף
  english_pob_choice: sweeping through
  chosen_korean: 휩쓸고 지나가며
  alternatives_korean:
  - 지나가며
  - 통과하며
  - 휩쓸며
  lexicon: HALOT
  rationale: 지역을 빠르게 관통하는 움직임을 한국어 동작상으로 살렸고, 폭풍 비유와도 잘 맞도록 했습니다.
- source_word: מִמִּדְבָּר בָּא
  english_pob_choice: it comes from the wilderness
  chosen_korean: 그것은 광야에서 오며
  alternatives_korean:
  - 광야에서 옵니다
  - 그가 광야에서 오며
  - 광야에서 나옵니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 주어를 임의로 특정하지 않고, 앞선 폭풍 같은 힘을 가리키는 중성적 지시로 처리했습니다.
- source_word: מֵאֶרֶץ נוֹרָאָה
  english_pob_choice: from a fearful land
  chosen_korean: 두려운 땅
  alternatives_korean:
  - 무서운 땅
  - 두려워할 만한 땅
  - 끔찍한 땅
  lexicon: HALOT
  rationale: נוֹרָאָה의 두려움/경외를 불러일으키는 성격을 간결하게 살렸습니다. '끔찍한'은 의미를 지나치게 강하게 고정할 수 있어 피했습니다.
theological_decisions:
- issue: 본문의 모호한 지명 표현을 해석으로 풀지 않을지 여부
  chosen_reading: '''바다의 광야''를 본문 그대로 유지해, 독자가 이미지와 지리적 암시의 긴장을 그대로 보게 했습니다.'
  alternative_readings:
  - 특정 지역으로 해석해 '바닷가의 광야'로 풀어 쓰기
  - 의미를 단순화해 지명성을 약화시키기
  rationale: 원문은 의도적으로 기이한 표현을 사용하므로, 번역에서 이를 해소하기보다 남겨 두는 것이 원문 충실성과 해석 여지를 함께 지킵니다.
  doctrine_reference: 원어 우선, 본문 긴장 보존
