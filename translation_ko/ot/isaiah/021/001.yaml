  - 의미를 단순화해 지명성을 약화시키기
  rationale: 원문은 의도적으로 기이한 표현을 사용하므로, 번역에서 이를 해소하기보다 남겨 두는 것이 원문 충실성과 해석 여지를 함께 지킵니다.
