revisions:
- from: 야훼의 말씀입니다. 「바다의 광야에 관한 오라클—네게브의 회오리바람처럼, 휩쓸고 지나가며—그것은 광야에서 오며, 두려운 땅에서 옵니다。」[a][b][c]
  to: 바다의 광야에 관한 선포입니다.[a] 네게브에서 회오리바람이 휩쓸고 지나가듯,[b] 그것이[c] 광야에서, 두려움을 자아내는 땅에서 옵니다.
  rationale: 원문에 없는 신명(야훼)과 계시 공식을 삭제했습니다. מַשָּׂא의 표제 기능은 자연스러운 한국어인 ‘선포’로 옮겼고, 폭풍의 비교 구문을 완결했습니다. ‘바다의 광야’와 ‘그것’을 유지하여 지리적 표현과 주어의 모호성을 해소하지 않았습니다. 각주는 영문 감사 기록의 대안 및 설명을 보존하면서 해당 어구에 직접 연결되도록 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:50:56Z'
