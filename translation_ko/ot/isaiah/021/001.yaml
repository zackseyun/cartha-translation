source:
  edition: WLC
  text: מַשָּׂ֖א מִדְבַּר יָ֑ם כְּ/סוּפ֤וֹת בַּ/נֶּ֨גֶב֙ לַֽ/חֲלֹ֔ף מִ/מִּדְבָּ֣ר בָּ֔א מֵ/אֶ֖רֶץ נוֹרָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
  footnotes:
  - marker: a
    text: Or 'the desert by the sea.' The Hebrew phrase is unusual and may function as a poetic geographical designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'like storms in the south passing through.' 'Negev' can mean the southern region or simply 'south.'
    reason: lexical_alternative
  - marker: c
    text: The subject of 'comes' is implicit in Hebrew and may refer to the storm-like force just described.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다의 광야에 관한 선포입니다.[a] 네게브에서 회오리바람이 휩쓸고 지나가듯,[b] 그것이[c] 광야에서, 두려움을 자아내는 땅에서 옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바닷가의 광야’. 히브리어 표현은 매우 이례적이며, 시적인 지리 명칭처럼 기능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네게브’는 남쪽 지역을 가리킬 수도 있고, 단순히 ‘남쪽’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘옵니다’의 주어는 히브리어에서 명시되지 않았으며, 앞에서 묘사된 폭풍 같은 힘을 가리킬 수 있습니다.
    reason: lexical_alternative
