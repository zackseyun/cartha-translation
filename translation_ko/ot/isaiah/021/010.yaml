id: ISA.21.10
reference: Isaiah 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
  footnotes:
  - marker: a
    text: Or 'my crushed one' or 'my trampled one'; the Hebrew keeps the image of threshing as a metaphor for severe affliction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'son of my threshing floor,' a metaphor linked to the threshing image and likely addressing a people who have been beaten down or processed like grain.
    reason: cultural_note
translation:
  language: ko
  text: 오, 내 타작한 자[a]여, 그리고 내 타작마당의 아들아, 내가 만군의 여호와, 이스라엘의 하나님[b]에게서 들은 것을 너희에게 선포하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 짓이긴 자’, ‘내 짓눌린 자’로도 옮길 수 있습니다. 히브리어는 심한 압박을 뜻하는 타작 비유를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘만군의 여호와, 이스라엘의 하나님’입니다. 여기서 여호와는 하나님의 고유명을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  english_pob_choice: my threshed one
  chosen_korean: 내 타작한 자
  alternatives_korean:
  - 내 짓이긴 자
  - 내 눌린 자
  - 내 짓눌린 자
  lexicon: HALOT
  rationale: דושׁ의 수동형 이미지인 ‘타작하다’를 살려 농업적 비유를 유지했습니다. ‘타작한 자’는 원문의 강한 상징성을 보존하면서도 한국어에서 이해 가능합니다.
- source_word: וּבֶן גָּרְנִי
  english_pob_choice: and son of my threshing floor
  chosen_korean: 그리고 내 타작마당의 아들
  alternatives_korean:
  - 그리고 내 타작마당의 자녀
  - 그리고 내 타작마당의 사람
  lexicon: HALOT
  rationale: ‘아들’(בֵּן)과 ‘타작마당’(גֹּרֶן)의 결합을 직역에 가깝게 옮겨 히브리어의 병렬적 비유를 보존했습니다.
- source_word: הִגַּדְתִּי לָכֶם
  english_pob_choice: I have declared to you
  chosen_korean: 너희에게 선포하였습니다
  alternatives_korean:
  - 너희에게 말하였습니다
  - 너희에게 알려주었습니다
  lexicon: HALOT
  rationale: נגד의 선언·공표 의미를 살려 예언적 발화의 격식을 드러냈습니다. 복수 대상을 반영해 ‘너희에게’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 여호와, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 야훼, 이스라엘의 하나님
  - 만군의 주님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: 이 판본의 고유명사 관례에 따라 יְהוָה는 ‘여호와’로 옮기되, צְבָאוֹת은 ‘만군의’로 살려 칭호의 장엄함을 유지했습니다.
theological_decisions:
- issue: 두 개의 지시 대상과 복수 인칭의 처리
  chosen_reading: 한국어 본문에서는 ‘너희에게’로 복수 청자를 드러내고, 호칭은 단수형 느낌을 살렸습니다.
  alternative_readings:
  - ‘너에게’로 단수화
  - ‘너희들’로 더 강하게 복수화
  rationale: 히브리어 לָכֶם은 복수이므로 이를 본문에 반영해야 합니다. 앞의 두 호칭은 집합적/비유적 호칭으로 읽는 것이 원문 긴장에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: preserve grammatical and rhetorical tension without over-resolving metaphor'
