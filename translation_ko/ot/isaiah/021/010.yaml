  source_fidelity: 핵심 타작 비유, 복수 청자(‘너희에게’), 그리고 ‘만군의 여호와, 이스라엘의 하나님’이라는 신적 칭호는 보존되어 있습니다. 그러나 ‘내 타작한 자’는 한국어에서 능동적으로 ‘내가 타작한 사람’으로 읽힐 수 있어 히브리어의 수동적 의미를 충분히 드러내지 못합니다. 또한 두 번째 각주는 원문의 ‘타작마당의 아들’에 붙어야 하나 현재 신명 칭호에 붙어 있어, 영어 POB 감사 추적 및 각주 범위와 맞지 않습니다.
  naturalness: ‘나의 타작당한 자여’는 다소 의도적으로 낯선 시적 표현이지만, 원문의 강한 은유를 보존하는 데 적절합니다. ‘내 타작한 자’보다 수동 의미가 명료합니다. ‘타작마당의 아들’도 직역적이고 낯설지만 원문의 병렬 은유를 과도하게 해석하지 않는 표현입니다.
  terminology: יְהוָה는 초안의 판본 관례에 따라 ‘여호와’로 유지할 수 있으며, ‘만군의 여호와, 이스라엘의 하나님’은 정확합니다. ‘선포하였습니다’는 הִגַּדְתִּי의 예언적 선언 register를 적절히 반영합니다.
