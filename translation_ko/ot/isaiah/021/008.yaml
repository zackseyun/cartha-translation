  - severity: medium
    issue: 각주 표지 [a][b]가 모두 인용문 끝에 있어 연결 대상이 불명확합니다.
    rationale: '[a]는 ‘사자다!’, [b]는 ‘밤마다’에 각각 붙여야 각주 앵커가 명확해집니다.'
  - severity: low
    issue: ‘내 주님’은 한국어에서 신적 호칭으로 오해되거나 다소 어색할 수 있습니다.
    rationale: אֲדֹנָי는 여기서 보고를 받는 인간 상관을 부르는 말이므로 ‘내 주인님’이 더 알맞습니다.
