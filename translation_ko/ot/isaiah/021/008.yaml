source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
  footnotes:
  - marker: a
    text: Hebrew literally, “A lion!” or “Lion!” The phrase is difficult; the main text renders it as an exclamatory comparison to preserve the Masoretic reading in intelligible English.
    reason: alternative_reading
  - marker: b
    text: Or “every night” / “all night long.” Hebrew has the plural, “all the nights.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 외쳤습니다. 「사자다![a] 내 주인님, 저는 망대 위에서 낮 동안 계속 서 있고, 제 파수 자리에서 밤마다 서 있습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사자!”입니다. 이 구절은 문법과 의미가 난해하므로, 본문은 마소라 본문을 따라 감탄적 외침으로 옮겼습니다. 또는 “사자처럼!”으로 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “모든 밤에” 또는 “밤새도록.” 히브리어는 복수형으로 “모든 밤들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: Then he cried
  chosen_korean: 그가 외쳤습니다
  alternatives_korean:
  - 그가 불렀습니다
  - 그가 소리쳤습니다
  lexicon: HALOT
  rationale: קרא의 긴급한 외침을 살려 ‘외쳤습니다’로 옮겼습니다. 서술 진행은 ‘그가’로 자연스럽게 반영했습니다.
- source_word: אַרְיֵה
  english_pob_choice: A lion!
  chosen_korean: 사자다!
  alternatives_korean:
  - 사자!
  - 사자입니다!
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘사자’를 뜻합니다. 본문이 난해하므로 감탄형을 유지하되, 한국어에서는 짧은 외침으로 처리해 원문의 난점을 드러냈습니다.
- source_word: עַל מִצְפֶּה
  english_pob_choice: On the watchtower
  chosen_korean: 망대 위에서
  alternatives_korean:
  - 망루 위에서
  - 감시초소에서
  lexicon: HALOT
  rationale: מִצְפֶּה는 감시용 높은 지점/망대를 가리키므로, 위치감을 살려 ‘망대 위에서’로 옮겼습니다.
- source_word: וְעַל מִשְׁמַרְתִּי
  english_pob_choice: and at my post
  chosen_korean: 내 파수 자리에서
  alternatives_korean:
  - 내 파수에서
  - 내 경계 근무 자리에서
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת의 감시·경계 직무 뉘앙스를 살려 ‘파수 자리’로 옮겨 군사적 파수 이미지를 유지했습니다.
theological_decisions:
- issue: 난해한 אַרְיֵה 구절의 처리
  chosen_reading: 본문의 마소라 본문을 따라 감탄형 외침으로 유지했습니다.
  alternative_readings:
  - ‘사자다!’를 별도의 탄성으로 읽음
  - ‘사자처럼!’로 비교를 보강함
  rationale: 이 구절은 문법적으로 어려우므로, 의미를 매끈하게 만들기보다 본문의 난점을 드러내는 쪽을 택했습니다. 이는 POB의 원문 밀착 원칙에 부합합니다.
  doctrine_reference: 원문 충실성과 본문 난점 보존
