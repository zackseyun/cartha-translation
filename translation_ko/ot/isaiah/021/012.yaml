  lexicon: HALOT
  rationale: 예언적 응답을 현재형으로 제시해 생동감을 살렸고, 한국어에서도 보고체보다 직접적인 발화를 자연스럽게 드러냅니다.
- source_word: בֹקֶר וְגַם לָיְלָה
  english_pob_choice: Morning comes, and also night
  chosen_korean: 아침이 오고, 또한 밤도 옵니다
  alternatives_korean:
  - 아침이 오고, 또한 밤이 옵니다
  - 아침이 왔고, 또한 밤도 왔습니다
  lexicon: HALOT
  rationale: 영어 POB의 두 가능성 중 도래/도착의 현재성을 살리되, 히브리어가 허용하는 일반적 진술과 즉각적 선언의 여지를 남겼습니다.
- source_word: אִם תִּבְעָיוּן / בְּעָיוּ
  english_pob_choice: If you would inquire, inquire
  chosen_korean: 여러분이 묻고자 하면, 물으십시오
  alternatives_korean:
  - 여러분이 물으려 하면, 물으십시오
  - 여러분이 묻거든, 물으십시오
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서는 '묻다'로 맞추어 유지했고, 조건과 명령의 긴장을 '묻고자 하면'으로 자연스럽게 옮겼습니다.
- source_word: שֻׁבוּ / אֵתָיוּ
  english_pob_choice: return, come
  chosen_korean: 돌아오십시오, 오십시오
  alternatives_korean:
  - 돌아가십시오, 오십시오
  - 돌이키십시오, 오십시오
  lexicon: HALOT
  rationale: 둘 다 짧은 연속 명령으로서의 리듬을 살렸고, 두 번째 동사의 개방성을 남기기 위해 '오십시오'로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 이 절의 마무리 명령이 회개 촉구인지 단순 재방문 요청인지
  chosen_reading: 본문이 허용하는 의미의 범위를 좁히지 않고, '돌아오십시오, 오십시오'로 두 가능성을 열어 둡니다.
  alternative_readings:
  - '''회개하고 오십시오''로 해석하는 번역'
  - '''다시 돌아와 물으십시오''라는 안내로 읽는 번역'
  rationale: 히브리어와 영어 POB 모두 의미를 단정하지 않고 열어 두므로, 한국어도 같은 긴장을 보존하는 것이 स्रोत 충실성에 더 부합합니다.
  doctrine_reference: 해석 유보 / 문맥상 이중 가능성 보존
