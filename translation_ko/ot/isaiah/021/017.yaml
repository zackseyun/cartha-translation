id: ISA.21.17
reference: Isaiah 21:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
  footnotes:
  - marker: a
    text: Or 'the archers'; literally 'the bow,' used metonymically for bowmen.
    reason: lexical_alternative
  - marker: b
    text: Or 'the remnant of the number of the mighty bowmen of the sons of Kedar will diminish.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 케달 자손의 활쏘는 용사들의 수의 남은 자는 적을 것입니다. 이는 야훼, 이스라엘의 하나님께서 말씀하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘활쏘는’은 문자적으로는 ‘활’이지만, 여기서는 활을 다루는 전사들을 가리키는 환유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  english_pob_choice: And the remainder of the number
  chosen_korean: 수의 남은 자
  alternatives_korean:
  - 남은 수
  - 수의 나머지
  lexicon: HALOT
  rationale: 히브리어의 양적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘수의 남은 자’로 옮겼습니다.
- source_word: קֶשֶׁת
  english_pob_choice: the bowmen
  chosen_korean: 활쏘는
  alternatives_korean:
  - 활을 든
  - 궁수의
  lexicon: HALOT
  rationale: 문맥상 무기를 가리키는 환유이므로 ‘활쏘는’으로 풀어 보병이 아닌 활병의 이미지를 드러냈습니다.
- source_word: גִּבּוֹרֵי בְנֵי קֵדָר
  english_pob_choice: the mighty men of the sons of Kedar
  chosen_korean: 케달 자손의 용사들
  alternatives_korean:
  - 케달 자손의 강한 자들
  - 케달 사람들의 용사들
  lexicon: HALOT
  rationale: גִּבּוֹרִים의 전형적 전쟁 문맥을 따라 ‘용사들’로 옮기고, בְנֵי קֵדָר은 혈연-민족 관용구를 살려 ‘케달 자손’으로 유지했습니다.
- source_word: יִמְעָטוּ
  english_pob_choice: will be few
  chosen_korean: 적을 것입니다
  alternatives_korean:
  - 적어질 것입니다
  - 줄어들 것입니다
  lexicon: HALOT
  rationale: ‘few’의 상태 변화를 한국어 예언문답게 간결하게 나타내는 표현으로 ‘적을 것입니다’를 선택했습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 야훼, 이스라엘의 주 하나님
  lexicon: HALOT
  rationale: 공동체 전통어보다 신명 표기를 우선하여 ‘야훼’를 유지했고, אֱלֹהֵי יִשְׂרָאֵל은 자연스럽게 ‘이스라엘의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 예언 종결의 확정성 표현
  chosen_reading: ‘말씀하셨기 때문입니다’로 종결하여 예언의 확정성과 권위를 살렸습니다.
  alternative_readings:
  - ‘말하셨습니다’
  - ‘말씀하셨습니다’
  rationale: 히브리어 완료형 דִּבֵּר은 단순 과거보다 선포의 확정성을 띠므로, 예언 문맥에 맞게 종결적 진술로 처리했습니다.
  doctrine_reference: 예언문 종결의 확정성
