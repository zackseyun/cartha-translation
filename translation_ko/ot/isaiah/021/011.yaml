id: ISA.21.11
reference: Isaiah 21:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א דּוּמָ֑ה אֵלַ/י֙ קֹרֵ֣א מִ/שֵּׂעִ֔יר שֹׁמֵר֙ מַה מִ/לַּ֔יְלָה שֹׁמֵ֖ר מַה מִ/לֵּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
  footnotes:
  - marker: a
    text: Dumah may also echo the Hebrew word for “silence,” and some interpreters connect it with Edom because the next line mentions Seir.
    reason: lexical_alternative
  - marker: b
    text: Or “How far gone is the night?” The Hebrew idiom asks about the state or progress of the night.
    reason: alternative_reading
translation:
  language: ko
  text: 듬아에 대한 경고입니다. 세일에서 나를 부르는 이가 있습니다. “파수꾼아, 밤이 어떻게 되었느냐? 파수꾼아, 밤이 어떻게 되었느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 듬아는 ‘침묵’이라는 히브리어 어감과도 연결될 수 있으며, 다음 행에 세일이 나오므로 에돔과 관련된 것으로 보는 해석도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “밤이 얼마나 진행되었습니까?”라는 뜻일 수 있습니다. 히브리어 관용구는 밤의 상태나 진행을 묻습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 경고
  alternatives_korean:
  - 예언
  - 신탁
  lexicon: HALOT
  rationale: 예언 제목 형식의 מַשָּׂא를 한국어로는 본문의 경고적 성격을 살려 ‘경고입니다’로 옮겼습니다. ‘예언’보다 제목의 압박감이 살아나고, ‘부담’의 오해를 피합니다.
- source_word: דּוּמָה
  english_pob_choice: Dumah
  chosen_korean: 듬아
  alternatives_korean:
  - 두마
  - 침묵
  lexicon: HALOT
  rationale: 본문 머리말의 고유명사로 보아 음역했습니다. POB의 주석처럼 ‘침묵’의 어감 가능성은 본문에 넣지 않고, 이름으로 유지했습니다.
- source_word: מִשֵּׂעִיר
  english_pob_choice: from Seir
  chosen_korean: 세일에서
  alternatives_korean:
  - 세일로부터
  - 세일로
  lexicon: HALOT
  rationale: 전치사 מִן의 출발점을 자연스러운 한국어로 풀어 ‘세일에서’로 옮겼습니다. 지명은 현대 음역 관례를 따랐습니다.
- source_word: שֹׁמֵר
  english_pob_choice: Watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 보초
  - 경계자
  lexicon: HALOT
  rationale: 야간 감시의 직책을 가리키므로 ‘파수꾼’이 가장 정확합니다. 반복되는 호칭의 시적 긴장도 잘 드러냅니다.
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  english_pob_choice: what of the night?
  chosen_korean: 밤이 어떻게 되었느냐?
  alternatives_korean:
  - 밤이 얼마나 진행되었느냐?
  - 밤은 지금 어떠하냐?
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 ‘밤’의 언급이 아니라 밤의 상태나 진행을 묻습니다. 한국어에서는 자연스럽게 상태를 묻는 질문으로 풀어야 해서 ‘어떻게 되었느냐’로 옮겼습니다.
theological_decisions:
- issue: 듬아의 정체를 본문에서 어떻게 처리할지
  chosen_reading: 고유명사 ‘듬아’로 유지하고, ‘침묵’의 어감은 본문 밖으로 유보합니다.
  alternative_readings:
  - 공통명사적 의미 ‘침묵’
  - 에돔에 대한 간접 지시
  rationale: 머리말 형식과 뒤의 ‘세일’ 언급은 지명/민족명으로 읽는 흐름을 지지합니다. 따라서 본문은 해석을 앞서지 않고 이름을 보존해야 합니다.
  doctrine_reference: '번역 원칙: 고유명사는 음역하고, 본문이 허락하지 않는 해석은 주석으로 미룹니다.'
