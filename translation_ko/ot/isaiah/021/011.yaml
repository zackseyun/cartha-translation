revisions:
- from: 듬아에 대한 경고입니다. 세일에서 나를 부르는 이가 있습니다. “파수꾼아, 밤이 어떻게 되었느냐? 파수꾼아, 밤이 어떻게 되었느냐?”[a][b]
  to: 두마[a]에 관한 신탁입니다. 세일에서 어떤 이가 나에게 부르짖습니다. “파수꾼이여, 밤이 어떠합니까? 파수꾼이여, 밤이 어떠합니까?”[b]
  rationale: 예언 표제의 장르적 의미를 위해 ‘경고’를 ‘신탁’으로 고쳤습니다. 지명은 ‘두마’로 바로잡고, 인용문 전체를 현대 정중체로 조정했습니다. ‘밤이 어떠합니까?’는 원문의 밤의 상태·경과를 묻는 열린 질문을 보존하며, 두 차례의 반복도 그대로 유지합니다. 각주 표지는 각주가 설명하는 단어 및 표현에 직접 연결했습니다.
