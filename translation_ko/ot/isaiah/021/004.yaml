id: ISA.21.4
reference: Isaiah 21:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
  footnotes:
  - marker: a
    text: Or 'The evening twilight I desired he has made into trembling/terror for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 마음이 흔들립니다. 전율이 나를 공포에 떨게 합니다. 내가 바라던 황혼을 내게 두려움으로 바꾸었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 바라던 저녁 황혼을 내게 떨림/공포로 바꾸었습니다.’
    reason: נֶשֶׁף는 특히 저녁 황혼을 가리킬 수 있으며, לַחֲרָדָה는 ‘떨림’ 또는 ‘공포’로 옮길 수 있습니다. 원문의 명시되지 않은 주어는 번역문에서도 생략합니다.
lexical_decisions:
- source_word: תָּעָה לְבָבִי
  english_pob_choice: My heart reels
  chosen_korean: 내 마음이 흔들립니다
  alternatives_korean:
  - 내 마음이 방황합니다
  - 내 마음이 비틀거립니다
  lexicon: HALOT
  rationale: לֵבָב을 ‘마음’으로 옮기고, תָּעָה의 내적 불안정함은 현대 한국어에서 ‘흔들립니다’가 가장 자연스럽게 드러냅니다.
- source_word: פַּלָּצוּת
  english_pob_choice: shuddering
  chosen_korean: 떨림
  alternatives_korean:
  - 오싹함
  - 전율
  lexicon: HALOT
  rationale: 이 명사는 강한 몸의 떨림과 공포감을 함께 가리키므로, 문맥상 ‘떨림’이 직역과 자연스러움 사이에서 균형을 잡습니다.
- source_word: בִּעֲתַתְנִי
  english_pob_choice: terrifies me
  chosen_korean: 나를 두렵게 합니다
  alternatives_korean:
  - 나를 무섭게 합니다
  - 나를 공포에 떨게 합니다
  lexicon: HALOT
  rationale: בעת의 동사적 힘을 살리되, 한국어에서 현재적 체험을 나타내는 ‘두렵게 합니다’로 옮겨 즉각적인 공포감을 유지했습니다.
- source_word: נֶשֶׁף חִשְׁקִי
  english_pob_choice: The twilight I longed for
  chosen_korean: 내가 그리워하던 황혼
  alternatives_korean:
  - 내가 바라던 황혼
  - 내가 갈망하던 황혼
  lexicon: HALOT
  rationale: נֶשֶׁף은 ‘황혼’이 가장 적절하고, חִשְׁקִי의 ‘욕망/갈망’은 문맥상 ‘그리워하던’이 시적이면서도 과도하게 해석하지 않습니다.
- source_word: שָׂם לִי לַחֲרָדָה
  english_pob_choice: he has turned into terror for me
  chosen_korean: 그가 나에게 두려움으로 바꾸셨습니다
  alternatives_korean:
  - 그가 나에게 공포로 만드셨습니다
  - 그가 나에게 떨림이 되게 하셨습니다
  lexicon: HALOT
  rationale: שָׂם + לְ는 ‘~로 만들다/바꾸다’의 결과를 나타내므로, ‘두려움으로 바꾸셨습니다’가 원문의 전환 구조를 잘 드러냅니다.
theological_decisions:
- issue: 히브리어 시편식/예언적 현재가 한국어에서 어떤 시제로 드러나는가
  chosen_reading: 현재 체험을 나타내는 직설형으로 옮겼습니다
  alternative_readings:
  - 과거형으로 옮김
  - 완결된 서술형으로 옮김
  rationale: 하나님이 주시는 환상/예언적 충격이 지금 체험되는 상태를 보여 주므로, 한국어에서도 현재형이 원문의 생생함을 보존합니다.
  doctrine_reference: 예언 문맥의 체험적 현재
