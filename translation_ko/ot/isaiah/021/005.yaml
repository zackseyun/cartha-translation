id: ISA.21.5
reference: Isaiah 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָרֹ֧ךְ הַ/שֻּׁלְחָ֛ן צָפֹ֥ה הַ/צָּפִ֖ית אָכ֣וֹל שָׁתֹ֑ה ק֥וּמוּ הַ/שָּׂרִ֖ים מִשְׁח֥וּ מָגֵֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
  footnotes:
  - marker: a
    text: Or 'they watch the watchtower' / 'they set a watch.' The Hebrew in this clause is difficult; the main text follows the banquet-preparation sense that fits the surrounding sequence.
    reason: alternative_reading
  - marker: b
    text: Literally 'anoint the shield,' that is, prepare the shield for battle by oiling it.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 상을 차리고, 깔개를 펴고[a], 먹고 마십니다. 일어나십시오, 고관들이여. 방패에 기름을 바르십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망대를 주시한다’ 또는 ‘보초를 세운다’로 옮길 수 있습니다. 이 히브리어 어구는 뜻이 불확실합니다. 본문은 앞뒤의 동작들과 어울리는 연회 준비의 의미를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 방패에 기름을 바르는 것은 전투를 앞두고 가죽 방패를 손질하고 준비하는 행위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  english_pob_choice: They set the table
  chosen_korean: 상을 차리고
  alternatives_korean:
  - 식탁을 차리고
  - 상을 마련하고
  lexicon: HALOT
  rationale: 문맥상 연회 준비의 첫 동작이므로, 직역보다 자연스러운 ‘상을 차리다’를 택해 장면의 구체성을 살렸습니다.
- source_word: צָפֹה הַצָּפִית
  english_pob_choice: they spread the rugs
  chosen_korean: 양탄자를 펴고
  alternatives_korean:
  - 깔개를 펴고
  - 덮개를 펴고
  - 경계를 살피고
  lexicon: HALOT
  rationale: 이 구절은 본문상 난해하지만, 뒤따르는 연회 동작들과 함께 읽을 때 덮개나 깔개를 펴는 장면이 가장 잘 맞습니다. 한국어에서는 ‘양탄자’를 써서 준비 동작의 시각적 이미지를 살렸습니다.
- source_word: קוּמוּ הַשָּׂרִים
  english_pob_choice: Rise up, princes
  chosen_korean: 일어나십시오, 고관들이여
  alternatives_korean:
  - 일어나십시오, 통치자들이여
  - 일어나십시오, 군주들이여
  - 일어나십시오, 방백들이여
  lexicon: HALOT
  rationale: שׂרים은 문맥에 따라 ‘방백/고관/지도자’가 될 수 있으나, 여기서는 궁정적·군사적 맥락을 반영해 현대 독자가 이해하기 쉬운 ‘고관들’을 택했습니다.
- source_word: מִשְׁחוּ מָגֵן
  english_pob_choice: oil the shield
  chosen_korean: 방패에 기름을 바르십시오
  alternatives_korean:
  - 방패에 기름을 치십시오
  - 방패를 바르십시오
  - 방패에 기름부으십시오
  lexicon: HALOT
  rationale: 히브리어는 방패를 실제로 전투용으로 손질하는 뜻이므로, 종교적 의미가 강한 ‘기름부으시다’보다 도구를 정비하는 행위를 드러내는 ‘기름을 바르다’가 더 적절합니다.
theological_decisions:
- issue: 난해한 첫 절반의 동작 묘사
  chosen_reading: 연회 준비 동작으로 읽었습니다.
  alternative_readings:
  - 감시초소를 세우거나 경계를 보는 뜻으로 읽는 견해
  - 본문의 중의성을 강하게 드러내는 번역
  rationale: 영어 POB와 어휘 주석이 연회 준비의 흐름을 본문 주해상 우선 선택으로 제시하므로, 그 읽음을 본문에 반영했습니다.
  doctrine_reference: 본문 주해/사본 이해
