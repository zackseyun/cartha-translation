- from: 그들은 상을 차리고, 양탄자를 펴고, 먹고 마십니다. 일어나십시오, 고관들이여 — 방패에 기름을 바르십시오.[a][b]
  to: 그들은 상을 차리고, 깔개를 펴고[a], 먹고 마십니다. 일어나십시오, 고관들이여. 방패에 기름을 바르십시오.[b]
