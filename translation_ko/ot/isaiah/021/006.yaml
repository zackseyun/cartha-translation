source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''station the watchman; what he sees, let him report.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주께서 내게 이렇게 말씀하셨기 때문입니다. “가서 파수꾼을 세우고, 그가 보는 것을 보고하게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘파수꾼을 세우고; 그가 보는 것을 보고하게 하라.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / כֹה אָמַר
  english_pob_choice: For thus ... said
  chosen_korean: 이는 ... 이렇게 말씀하셨기 때문입니다
  alternatives_korean:
  - 그리하여 ... 말씀하셨습니다
  - 왜냐하면 ... 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: כִּי는 앞 문맥을 받는 근거 제시로 이해했고, כֹה אָמַר의 예언자적 공식을 한국어에서는 ‘이렇게 말씀하셨기 때문입니다’로 자연스럽게 옮겨 서술문 흐름을 살렸습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 나의 주
  lexicon: HALOT
  rationale: 여기서는 신적 칭호 אֲדֹנָי이므로 관용적으로 ‘주’로 옮기되, 문장 전체의 높임을 맞추어 ‘주께서’로 처리했습니다.
- source_word: הַעֲמֵד הַמְצַפֶּה
  english_pob_choice: station the watchman
  chosen_korean: 파수꾼을 세우고
  alternatives_korean:
  - 파수꾼을 배치하고
  - 파수꾼을 임명하고
  lexicon: HALOT
  rationale: 히필 명령형 הַעֲמֵד는 ‘서게 하다/세우다’의 사역 의미가 있어, 감시 임무를 맡기는 뉘앙스를 살린 ‘세우고’가 가장 직접적입니다.
- source_word: יַגִּיד
  english_pob_choice: let him report
  chosen_korean: 보고하게 하십시오
  alternatives_korean:
  - 알리게 하십시오
  - 말하게 하십시오
  lexicon: HALOT
  rationale: ‘보는 것’을 공식적으로 전달하는 뜻을 살려 ‘보고하다’를 선택했고, 명령 맥락을 한국어 사역 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언 인용문의 높임말 처리
  chosen_reading: 직접 인용문 안에서는 명령형 ‘하십시오’를 사용했습니다.
  alternative_readings:
  - ‘하라’로 낮춘 직설형
  - 간접화법으로 완화
  rationale: 본문은 야훼의 직접 발화이므로, 한국어 합쇼체 본문 안에서도 하나님 말씀에 대한 공손한 명령형을 유지하는 것이 문체와 신학적 경외를 함께 반영합니다.
  doctrine_reference: Translation style for divine speech; reverence in direct divine address
