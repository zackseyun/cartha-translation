id: ISA.21.9
reference: Isaiah 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
  footnotes:
  - marker: a
    text: Or 'a pair of horsemen'; the Hebrew phrase is compressed and may describe the approaching force more idiomatically than the English can fully reproduce.
    reason: lexical_alternative
  - marker: b
    text: Or 'the idols of her gods.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'he has shattered,' with the subject left unstated; the agent may be understood from context.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 한 전차와 한 쌍의 기마병을 탄 사람이 여기 옵니다. 그가 응답하여 말합니다. 「무너졌다, 무너졌다, 바빌론이여, 그리고 그 신들의 새긴 형상들은 모두 그가 땅에 부숴 버렸습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축되어 있어, 전차와 기마병의 도착을 더 관용적으로 묘사한 것일 수 있습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 신들의 우상들’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그가 부쉈다’로 되어 있으나, 행위 주체는 문맥에서 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보십시오
  lexicon: HALOT
  rationale: 예언적 장면 전환의 주의 환기 표현으로, 현대 한국어에서 자연스럽고 공적 낭독에 맞는 명령형을 택했습니다.
- source_word: זֶה בָא
  english_pob_choice: here comes
  chosen_korean: 여기 옵니다
  alternatives_korean:
  - 이것이 옵니다
  - 다가옵니다
  lexicon: HALOT
  rationale: 가리키는 말과 도착의 즉시성을 살려, 시야 안으로 들어오는 장면의 현장감을 전달했습니다.
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  english_pob_choice: a chariot, a man with a pair of horsemen
  chosen_korean: 한 전차와 한 쌍의 기마병을 탄 사람
  alternatives_korean:
  - 한 전차, 한 사람과 한 쌍의 기마병
  - 기마병 두 사람과 함께한 전차
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문을 한국어에서 과도하게 해석하지 않으면서, 전차와 기마병의 군사적 도착 장면을 살렸습니다.
- source_word: פְּסִילֵי אֱלֹהֶי/הָ
  english_pob_choice: the carved images of her gods
  chosen_korean: 그 신들의 새긴 형상들
  alternatives_korean:
  - 그 신들의 우상들
  - 그 신들의 조각한 형상들
  lexicon: HALOT
  rationale: פְּסִילִים의 구체적 의미인 새긴/깎은 형상을 유지해, 단순한 추상적 ‘우상’보다 원문에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 최종 절의 주체가 생략된 단수 동사
  chosen_reading: 주어를 보충하지 않고 「그가… 부숴 버렸습니다」로 두어, 원문의 생략된 행위 주체를 그대로 드러냈습니다.
  alternative_readings:
  - “그들이 부숴 버렸습니다”로 집합적 주체를 보충
  - “그것들은 부서졌습니다”로 수동적 의미를 보충
  rationale: 히브리어는 단수 3인칭 동사를 쓰지만 명시적 주어를 제시하지 않습니다. 해석으로 주체를 단정하기보다, 원문이 남긴 긴장을 보존하는 편이 더 투명합니다.
  doctrine_reference: 원문이 남긴 행위 주체의 모호성을 보존합니다.
- issue: 무너짐 선언의 반복
  chosen_reading: 「무너졌다, 무너졌다」로 반복을 그대로 살렸습니다.
  alternative_readings:
  - 「완전히 무너졌다」로 강화
  - 「이미 무너졌다」로 시제 명시
  rationale: 반복된 완료형의 격한 선포 효과를 유지하기 위해, 설명을 덧붙이지 않고 압축된 반복으로 옮겼습니다.
  doctrine_reference: 예언적 선포의 수사적 강도를 보존합니다.
