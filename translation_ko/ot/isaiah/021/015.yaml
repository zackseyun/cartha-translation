id: ISA.21.15
reference: Isaiah 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מִ/פְּנֵ֥י חֲרָב֖וֹת נָדָ֑דוּ מִ/פְּנֵ֣י חֶ֣רֶב נְטוּשָׁ֗ה וּ/מִ/פְּנֵי֙ קֶ֣שֶׁת דְּרוּכָ֔ה וּ/מִ/פְּנֵ֖י כֹּ֥בֶד מִלְחָמָֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/015.yaml
  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
  footnotes:
  - marker: a
    text: Or 'from the unsheathed sword.' The Hebrew adjective can denote a sword stretched out or made ready for use.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the drawn/strung bow.' The Hebrew describes a bow prepared for shooting.
    reason: lexical_alternative
  - marker: c
    text: Or 'from the severity of war.' The Hebrew literally says 'the weight of battle/warfare.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 칼 앞에서, 뽑아 든 칼 앞에서, 그리고 활 앞에서, 곧 전쟁의 무거움 앞에서 달아났기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי
  english_pob_choice: from
  chosen_korean: 앞에서
  alternatives_korean:
  - 에서
  - 으로부터
  - 앞을 피해
  lexicon: HALOT
  rationale: 반복되는 מִפְּנֵי의 공간적·회피적 방향을 한국어 자연스러운 말로 살려, 위협의 ‘앞에서’ 도망친 느낌을 유지했습니다.
- source_word: חֲרָבוֹת / חֶרֶב
  english_pob_choice: swords / sword
  chosen_korean: 칼 / 뽑아 든 칼
  alternatives_korean:
  - 검
  - 칼들
  - 뽑아낸 칼
  lexicon: HALOT
  rationale: 무기 일반을 현대 한국어에서 곧바로 이해되는 ‘칼’로 옮기되, 단수형의 준비된 무기는 ‘뽑아 든’으로 옮겨 준비 상태를 드러냈습니다.
- source_word: נְטוּשָׁה
  english_pob_choice: drawn
  chosen_korean: 뽑아 든
  alternatives_korean:
  - 칼집에서 뺀
  - 드러낸
  - 빼든
  lexicon: HALOT
  rationale: 영어 POB의 ‘drawn’에 해당하는 준비 완료 상태를 한국어 관용으로 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: קֶשֶׁת דְּרוּכָה
  english_pob_choice: the bent bow
  chosen_korean: 활
  alternatives_korean:
  - 당긴 활
  - 휘어진 활
  - 시위가 당겨진 활
  lexicon: HALOT
  rationale: ‘활’만으로도 준비된 무기라는 핵심 이미지는 전달되며, 본절의 평행 구조를 지나치게 늘리지 않도록 간결하게 옮겼습니다.
- source_word: כֹּבֶד מִלְחָמָה
  english_pob_choice: the weight of battle
  chosen_korean: 전쟁의 무거움
  alternatives_korean:
  - 전쟁의 무게
  - 전쟁의 중압
  - 전쟁의 심각함
  lexicon: HALOT
  rationale: כֹּבֶד의 문자적 ‘무게/무거움’을 살리면서, 전쟁이 주는 압박의 비유를 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 이사야의 전쟁 이미지와 반복 전치사 구조를 얼마나 직역할지
  chosen_reading: 원문의 위협 회피 이미지를 보존하기 위해 ‘앞에서’의 반복과 ‘전쟁의 무거움’이라는 비유를 유지했습니다.
  alternative_readings:
  - 문학적으로 풀어 ‘전쟁의 위협을 피해’
  - 의역하여 ‘전쟁의 참혹함을 피해’
  rationale: 본문은 전쟁의 압도적 무게 앞에서의 도주를 시각적으로 누적하는 구문이므로, 의미를 평탄화하지 않고 반복 구조를 살리는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 사 21:15의 예언적 심판 묘사
- issue: ‘칼’과 ‘활’의 무기 용어를 한국 교회 전통어인 ‘검’으로 바꿀지
  chosen_reading: 현대 독자가 즉시 이해할 수 있는 ‘칼’과 ‘활’을 사용했습니다.
  alternative_readings:
  - 검
  - 도검
  - 무기
  rationale: 원문은 특정 전통적 상징어보다 실제 무기 이미지를 강조하므로, 한국어에서 가장 직접적이고 덜 관용화된 표현을 택했습니다.
  doctrine_reference: 본문의 역사적·시각적 의미 보존
