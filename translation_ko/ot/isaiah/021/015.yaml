theological_decisions:
- issue: 이사야의 전쟁 이미지와 반복 전치사 구조를 얼마나 직역할지
  chosen_reading: 원문의 위협 회피 이미지를 보존하기 위해 ‘앞에서’의 반복과 ‘전쟁의 무거움’이라는 비유를 유지했습니다.
  alternative_readings:
  - 문학적으로 풀어 ‘전쟁의 위협을 피해’
  - 의역하여 ‘전쟁의 참혹함을 피해’
  rationale: 본문은 전쟁의 압도적 무게 앞에서의 도주를 시각적으로 누적하는 구문이므로, 의미를 평탄화하지 않고 반복 구조를 살리는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 사 21:15의 예언적 심판 묘사
- issue: ‘칼’과 ‘활’의 무기 용어를 한국 교회 전통어인 ‘검’으로 바꿀지
  chosen_reading: 현대 독자가 즉시 이해할 수 있는 ‘칼’과 ‘활’을 사용했습니다.
  alternative_readings:
  - 검
  - 도검
  - 무기
  rationale: 원문은 특정 전통적 상징어보다 실제 무기 이미지를 강조하므로, 한국어에서 가장 직접적이고 덜 관용화된 표현을 택했습니다.
  doctrine_reference: 본문의 역사적·시각적 의미 보존
