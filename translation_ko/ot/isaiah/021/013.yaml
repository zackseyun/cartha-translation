id: ISA.21.13
reference: Isaiah 21:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א בַּ/עְרָ֑ב בַּ/יַּ֤עַר בַּ/עְרַב֙ תָּלִ֔ינוּ אֹֽרְח֖וֹת דְּדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
  footnotes:
  - marker: a
    text: Or 'A burden concerning Arabia'; Hebrew מַשָּׂא can also be rendered 'burden' or 'pronouncement' in prophetic headings.
    reason: lexical_alternative
  - marker: b
    text: Or 'In the thicket in Arabia.' The Hebrew יַעַר normally means 'forest/woodland,' but in this setting it may refer to scrub or brush country.
    reason: cultural_note
  - marker: c
    text: Hebrew אֹרְחוֹת literally can mean 'paths/ways,' but here likely refers to traveling companies, that is, caravans.
    reason: lexical_alternative
translation:
  language: ko
  text: 아라비아에 관한 신탁입니다. 드단 사람들의 대상들이여, 여러분은 아라비아의 숲에서 밤을 지내게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַשָּׂא는 문자적으로 ‘짐’ 또는 ‘부담’을 뜻할 수 있으나, 예언서의 표제에서는 ‘신탁’ 또는 ‘선포’라는 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יַעַר는 보통 ‘숲’을 뜻하지만, 이곳에서는 덤불이나 수풀 지대를 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 אֹרְחוֹת는 문자적으로 ‘길들’ 또는 ‘통로들’을 뜻할 수 있지만, 여기서는 여행하는 무리, 곧 대상(카라반)을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: An oracle
  chosen_korean: 경고
  alternatives_korean:
  - 예언
  - 신탁
  - 부담
  lexicon: HALOT
  rationale: 예언서의 표제에서 מַשָּׂא 는 단순 제목보다 예언적 발화의 무게를 띠므로, 한국어에서는 선언적이면서도 무거운 느낌의 ‘경고’로 옮겨 본문 기능을 살렸습니다.
- source_word: בַּעְרָב
  english_pob_choice: concerning Arabia
  chosen_korean: 아라비아에 대한
  alternatives_korean:
  - 아라비아에 관한
  - 아라비아를 향한
  lexicon: HALOT
  rationale: 전치사 구문을 지리적 대상에 대한 표제로 이해하여, ‘~에 대한’으로 옮겨 원문의 주제를 자연스럽게 드러냈습니다.
- source_word: בַּיַּעַר
  english_pob_choice: In the forest
  chosen_korean: 숲에서
  alternatives_korean:
  - 숲속에서
  - 수풀에서
  - 덤불지대에서
  lexicon: HALOT
  rationale: יַעַר의 기본 의미인 ‘숲/수풀’을 살리되, 한국어에서는 ‘숲에서’가 가장 간결하고 본문 이미지도 유지합니다.
- source_word: אֹרְחוֹת דְּדָנִים
  english_pob_choice: O caravans of Dedanites
  chosen_korean: 드단 사람들의 무리여
  alternatives_korean:
  - 드단 사람들의 대상들이여
  - 드단 사람들의 상단이여
  - 드단 사람들의 행렬이여
  lexicon: HALOT
  rationale: אֹרְחוֹת는 문맥상 단순 ‘길’보다 여행하는 무리, 곧 대상/무리를 가리키므로 ‘무리’로 옮겼고, דְּדָנִים은 민족명으로 드단 사람들로 밝혔습니다.
theological_decisions:
- issue: מַשָּׂא의 어조
  chosen_reading: 예언 표제를 살리되, 심판 선언으로만 단정하지 않고 ‘경고’로 처리했습니다.
  alternative_readings:
  - 아라비아에 대한 신탁입니다
  - 아라비아에 대한 부담입니다
  rationale: מַשָּׂא 는 문맥에 따라 심판 뉘앙스를 띨 수 있지만, 여기서는 본문 자체가 곧바로 지시하는 표제이므로 과도한 해석을 피하면서도 경계의 무게를 드러냈습니다.
  doctrine_reference: 예언문 서두의 장르 표지
- issue: אֹרְחוֹת의 화자 호칭
  chosen_reading: ‘드단 사람들의 무리여’로 호격을 드러냈습니다.
  alternative_readings:
  - 드단 사람들의 대상들이 밤을 지내게 될 것입니다
  - 드단 사람들의 길들이 밤을 지내게 될 것입니다
  rationale: 히브리어는 직접 호칭의 가능성이 있어, 한국어에서도 문장 흐름상 호격을 분리해 독자가 대상에게 말을 거는 형식을 이해하도록 했습니다.
  doctrine_reference: 히브리어 시적 호격 및 병행법
