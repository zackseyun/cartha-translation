id: ISA.21.14
reference: Isaiah 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
  footnotes:
  - marker: a
    text: Or 'meet the fugitive with bread for him.' The Hebrew phrase may mean either accompanying the meeting with his bread/provisions or supplying bread to him.
    reason: lexical_alternative
  - marker: b
    text: Tema was an Arabian oasis/region associated with caravan routes.
    reason: cultural_note
translation:
  language: ko
  text: 목마른 자를 맞으려고 물을 가져오십시오[a]; 테마 땅의 주민들아[b], 도망자에게 떡으로 맞으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘도망자에게 떡을 가지고 맞으라’는 뜻으로도 읽을 수 있습니다. 본문은 동반/도구적 의미를 살려 ‘떡으로’라고 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 테마는 아라비아의 오아시스/지역으로, 대상이 되는 주민들의 배경을 보여 줍니다.
    reason: cultural_note
lexical_decisions:
- source_word: לִקְרַאת צָמֵא
  english_pob_choice: to meet the thirsty
  chosen_korean: 목마른 자를 맞으려고
  alternatives_korean:
  - 목마른 이를 맞으려고
  - 목마른 자를 만나려고
  lexicon: HALOT
  rationale: לִקְרַאת는 단순한 ‘향하여’보다 ‘맞으려고/맞이하려고’가 자연스럽고, צָמֵא는 명사적으로 처리해 ‘목마른 자’를 유지하는 것이 원문의 수사와 평행을 잘 살립니다.
- source_word: הֵתָיוּ מָיִם
  english_pob_choice: bring water
  chosen_korean: 물을 가져오십시오
  alternatives_korean:
  - 물을 가져오라
  - 물을 가져오십시오
  - 물을 가져다주십시오
  lexicon: HALOT
  rationale: 명령형 복수로서 ‘가져오십시오’가 표준어 합쇼체에서 가장 सीधे하고, 대상의 실제 전달 행위를 분명하게 드러냅니다.
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  english_pob_choice: O inhabitants of the land of Tema
  chosen_korean: 테마 땅의 주민들아
  alternatives_korean:
  - 테마 땅의 주민들아
  - 테마 땅에 사는 주민들아
  lexicon: HALOT
  rationale: 호격으로 부르는 구조를 살려 ‘-아’로 옮겼고, 지명 테마는 음역해 사막 오아시스/지역이라는 문화정보는 각주로 처리합니다.
- source_word: בְּלַחְמוֹ
  english_pob_choice: with his bread
  chosen_korean: 떡으로
  alternatives_korean:
  - 그의 떡으로
  - 빵과 함께
  - 떡을 가지고
  lexicon: HALOT
  rationale: English POB의 주석처럼 이 구는 동반/도구적 뉘앙스로도 읽히므로, 본문에서는 소유격을 단정하지 않고 ‘떡으로’라고 옮겨 히브리어의 긴장과 간결성을 보존했습니다.
- source_word: נֹדֵד
  english_pob_choice: the fugitive
  chosen_korean: 도망자
  alternatives_korean:
  - 도피자
  - 떠도는 자
  - 도망하는 자
  lexicon: HALOT
  rationale: 유배와 도주 상황을 가리키는 분사로 보아 ‘도망자’가 가장 직접적이며, ‘떠도는 자’보다 긴박한 의미를 잘 전달합니다.
theological_decisions:
- issue: 명령문의 화법과 호격 처리
  chosen_reading: 예언적 명령을 한국어 합쇼체 명령으로 옮기되, ‘주민들아’로 호격을 분명히 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화
  - 평서형으로 전환
  rationale: 원문은 청자에게 직접 행동을 촉구하는 명령이므로, 한국어에서도 그 긴장과 즉시성을 유지하는 것이 좋습니다.
  doctrine_reference: 예언문 화법 보존
