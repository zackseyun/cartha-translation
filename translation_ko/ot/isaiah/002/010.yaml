id: ISA.2.10
reference: Isaiah 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
  footnotes:
  - marker: a
    text: Or 'from the dread of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from before,' expressing flight from the presence of the LORD.
    reason: lexical_alternative
  - marker: c
    text: Or 'and from the majesty of his splendor.' The Hebrew pairs two near-synonyms for overwhelming royal glory.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 공포 앞에서, 또 그분의 위엄의 광채 앞에서 바위 속으로 들어가 먼지 속에 몸을 숨기십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 일으키시는 두려움 앞에서.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘~앞에서’로, 야훼의 임재 앞에서 달아나는 뉘앙스를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분의 광채로운 위엄 앞에서.’ 히브리어는 서로 가까운 뜻의 두 말을 나란히 두어 압도적인 왕적 영광을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַּצּוּר
  english_pob_choice: Enter into the rock
  chosen_korean: 바위로 들어가시고
  alternatives_korean:
  - 바위 속으로 들어가십시오
  - 바위에 들어가십시오
  - 바위로 가십시오
  lexicon: HALOT
  rationale: בוא의 명령형과 구체적 장소 표현을 살려, 피난처 안으로 몸을 옮기라는 긴박한 명령으로 자연스럽게 옮겼습니다.
- source_word: וְהִטָּמֵן בֶּעָפָר
  english_pob_choice: and hide yourself in the dust
  chosen_korean: 먼지 속에 숨으십시오
  alternatives_korean:
  - 먼지 속에 몸을 숨기십시오
  - 흙 속에 숨으십시오
  - 티끌 속에 숨으십시오
  lexicon: HALOT
  rationale: טמן의 재귀적 의미를 한국어에서 직접 목적어를 취하는 ‘숨다/숨기다’로 풀어, 자발적으로 몸을 낮추는 행동을 분명하게 표현했습니다.
- source_word: מִפְּנֵי פַּחַד יְהוָה
  english_pob_choice: from before the terror of Yahweh
  chosen_korean: 야훼의 공포와
  alternatives_korean:
  - 야훼의 공포 앞에서
  - 야훼의 두려움 앞에서
  - 야훼의 두려움 때문에
  lexicon: HALOT
  rationale: מִפְּנֵי의 ‘~앞에서’라는 현전 회피의 뉘앙스를 살리되, פַּחַד는 문맥상 경외가 아니라 심판적 공포이므로 ‘공포’로 옮겼습니다.
- source_word: וּמֵהֲדַר גְּאֹנוֹ
  english_pob_choice: and from the splendor of his majesty
  chosen_korean: 그의 위엄의 광채 앞에서입니다
  alternatives_korean:
  - 그의 위엄의 빛남 앞에서입니다
  - 그의 장엄한 광채 앞에서입니다
  - 그의 광휘와 위엄 앞에서입니다
  lexicon: HALOT
  rationale: הדר와 גאון의 근접한 장엄어를 겹쳐 ‘위엄의 광채’로 옮겨, 두 명사가 만들어내는 압도적 왕적 영광을 한국어에서도 유지했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유명칭을 보존하기 위해 전통적 대체어 ‘주’가 아니라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: פַּחַד의 정서적 강도
  chosen_reading: 공포
  alternative_readings:
  - 두려움
  - 경외
  rationale: 이 구절은 신자에게 요구되는 경외의 태도가 아니라 심판의 임박함 앞에서의 도피를 말하므로, 완화된 종교어 ‘경외’보다 공포가 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
