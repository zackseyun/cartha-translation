  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
  footnotes:
  - marker: a
    text: 'Hebrew singular throughout: ''his land ... his treasures ... his chariots.'' The singular likely refers collectively to the nation or people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'treasuries' or 'storehouses' for 'treasures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 땅은 은과 금으로 가득하며, 그의 보물에는 끝이 없습니다[a]. 그의 땅은 말들로 가득하며, 그의 병거에는 끝이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 땅 … 그의 보물 … 그의 병거’처럼 단수 소유격을 일관되게 사용합니다. 이는 민족 전체를 집합적으로 가리키는 단수일 가능성이 큽니다.
    reason: lexical_alternative
