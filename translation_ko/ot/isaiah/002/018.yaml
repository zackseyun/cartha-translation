lexical_decisions:
- source_word: וְהָאֱלִילִים
  english_pob_choice: And the idols
  chosen_korean: 그리고 우상들은
  alternatives_korean:
  - 그리고 그 우상들은
  - 그러나 우상들은
  lexicon: HALOT
  rationale: 정관사와 접속사를 자연스럽게 반영하면서, אֱלִילִים의 기본 의미를 한국어의 ‘우상들’로 옮겼습니다. 영어 POB의 ‘idols’와 같은 직역이지만, 문맥상 절망적 대비보다 단순 접속이 더 적절합니다.
- source_word: כָּלִיל
  english_pob_choice: completely
  chosen_korean: 완전히
  alternatives_korean:
  - 전적으로
  - 온전히
  - 전부
  lexicon: HALOT
  rationale: 부사적 강조를 한국어의 ‘완전히’로 옮겨, 소멸의 총체성을 분명하게 드러냈습니다.
- source_word: יַחֲלֹף
  english_pob_choice: will vanish
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 사라질 것입니다
  - 완전히 사라질 것입니다
  - 지나갈 것입니다
  lexicon: HALOT
  rationale: חלף의 ‘지나가다/사라지다’ 가운데, 우상들이 대상인 문맥에서는 단순한 통과보다 소멸의 뉘앙스가 더 강하므로 ‘사라질 것입니다’로 옮겼습니다.
