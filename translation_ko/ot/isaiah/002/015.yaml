    anchor_ref: —
translation:
  language: ko
  text: 또 모든 높은 망대와 모든 견고한 성벽을 향하여—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘모든 높은 망대 위에, 모든 견고한 성벽 위에’입니다. 그러나 앞뒤의 심판 문맥에서는 이 전치사가 심판이 향하는 대상을 가리키므로 ‘…을 향하여’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: and against
  chosen_korean: 그리고 …에 대해서는
  alternatives_korean:
  - 그리고 …에 맞서
  - 그리고 …을 향해
  - 그리고 …위에
  lexicon: HALOT
  rationale: עַל의 반복이 문맥상 심판의 대상을 가리키므로, 한국어에서는 단순한 위치 표현보다 ‘…에 대해서’로 적어 심판의 향방을 드러냈습니다.
- source_word: מִגְדָּל
  english_pob_choice: tower
  chosen_korean: 망대
  alternatives_korean:
  - 탑
  - 성루
  - 파수탑
  lexicon: HALOT
  rationale: 문맥의 군사·방어적 분위기를 살리면서도 자연스러운 한국어로는 ‘망대’가 가장 무난하여 선택했습니다.
- source_word: בְצוּרָה
  english_pob_choice: fortified
  chosen_korean: 견고한
  alternatives_korean:
  - 요새화된
  - 튼튼한
  - 성곽으로 둘러싸인
  lexicon: HALOT
  rationale: 히브리어의 ‘튼튼하게 만들어진/방비된’ 뜻을 살리되, 현대 한국어에서 지나치게 기술적인 표현보다 ‘견고한’이 문맥에 더 자연스럽습니다.
theological_decisions:
- issue: 심판의 대상이 되는 구조물들을 어떻게 드러낼지
  chosen_reading: 반복되는 עַל을 중립적인 ‘위에’로 두지 않고 심판의 방향을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 그리고 모든 높은 망대 위에, 그리고 모든 견고한 성벽 위에
  - 그리고 모든 높은 망대를 향해, 그리고 모든 견고한 성벽을 향해
  rationale: 이 절은 여호와의 날 심판 목록 안에 있으므로, 문맥에 내재한 대적성을 한국어에서 분명히 드러내는 것이 더 충실합니다.
  doctrine_reference: 이사야 2:12–16의 심판 문맥; optimal equivalence
