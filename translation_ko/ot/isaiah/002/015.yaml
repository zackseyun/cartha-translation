  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
  footnotes:
  - marker: a
    text: Or 'upon every high tower, and upon every fortified wall.' The Hebrew preposition can be rendered more literally as 'upon,' but here it carries the sense of coming in judgment against these objects.
