translation:
  language: ko
  text: 그는 바위의 동굴들과 바위틈[a]에 들어가려고 하리니, 야훼의 두려움과 그의 위엄의 찬란함[b] 앞에서, 그가 땅을 두렵게 하려고 일어나실 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바위의 구멍들과 바위틈.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그가 일어나 땅을 떨게 하실 때.’
    reason: alternative_reading
lexical_decisions:
- source_word: לָבוֹא
  english_pob_choice: to enter
  chosen_korean: 들어가려고 하리니
  alternatives_korean:
  - 들어가려고 할 것입니다
  - 들어가려 하리니
  - 들어가게 되리니
  lexicon: HALOT
  rationale: 피난처로 몸을 숨기기 위해 안으로 들어가는 동작을 자연스럽게 살렸습니다.
- source_word: נִקְרוֹת הַצֻּרִים וּבִסְעִפֵי הַסְּלָעִים
  english_pob_choice: the caverns of the rocks and the clefts of the crags
  chosen_korean: 바위의 동굴들과 바위틈
  alternatives_korean:
  - 바위의 구멍들과 바위의 갈라진 틈
  - 바위의 동굴들과 바위의 균열들
  - 바위의 구멍들과 바위틈
  lexicon: HALOT
  rationale: 두 개의 지질학적 은유를 한국어로 자연스럽게 압축하되, 숨을 곳이라는 이미지를 유지했습니다.
- source_word: מִפְּנֵי פַּחַד יְהוָה
  english_pob_choice: from before the terror of Yahweh
  chosen_korean: 야훼의 두려움 앞에서
  alternatives_korean:
  - 야훼의 공포 앞에서
  - 야훼의 무서움 앞에서
  - 야훼의 두려움으로부터
  lexicon: HALOT
  rationale: מִפְּנֵי의 ‘~의 앞에서/앞으로부터’라는 회피 감각을 살리면서, פַּחַד의 공포성을 ‘두려움’으로 옮겼습니다.
- source_word: הֲדַר גְּאוֹנֹו
  english_pob_choice: the splendor of his majesty
  chosen_korean: 그의 위엄의 찬란함
  alternatives_korean:
  - 그의 위엄의 영광
  - 그의 위엄의 광채
  - 그의 장엄함
  lexicon: HALOT
  rationale: הֲדַר와 גָּאוֹן의 병치를 유지하기 위해 ‘위엄’과 ‘찬란함’을 함께 써서 두 표현의 중복을 피했습니다.
- source_word: בְּקוּמוֹ לַעֲרֹץ הָאָרֶץ
  english_pob_choice: when he rises to terrify the earth
  chosen_korean: 그가 땅을 두렵게 하려고 일어나실 때입니다
  alternatives_korean:
  - 그가 땅을 떨게 하려고 일어나실 때입니다
  - 그가 땅을 무서워 떨게 하려고 일어나실 때입니다
  - 그가 땅을 두렵게 하시려고 일어나실 때입니다
  lexicon: HALOT
  rationale: 동사의 결과를 ‘두렵게 하다’로 옮겨 심판적 긴장을 살렸고, ‘땅’은 문맥상 더 넓은 우주적 범위를 암시하는 ‘the earth’보다도 한국어에서 자연스럽게 유지했습니다.
theological_decisions:
- issue: 야훼의 이름과 심판적 현현의 표현
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로, ‘앞에서’는 임재 앞에서 도망함을, ‘두렵게 하다’는 하나님의 심판적 나타나심을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 순화하기
  - ‘무서워하게 하다’로 완화하기
  - ‘땅을 떨게 하다’로 옮기기
  rationale: 본문은 단순한 감정이 아니라 야훼의 현현이 낳는 공포를 말하므로, 전통적 주어 대체나 완화된 표현보다 원문의 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘땅’의 범위
  chosen_reading: ‘땅’으로 옮겨 세계적 심판의 범위를 유지했습니다.
  alternative_readings:
  - ‘그 땅’으로 한정하기
  - ‘세상’으로 확장하기
  rationale: 히브리어 הָאָרֶץ는 문맥상 보편적 심판을 가리킬 수 있으나, 과도한 해석 확장을 피하면서도 한국어 자연성을 확보했습니다.
  doctrine_reference: Source-context reading of הָאָרֶץ in Isaiah 2
