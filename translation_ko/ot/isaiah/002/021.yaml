    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 땅을 두렵게 하시려고 일어나실 때, 사람들은 야훼의 공포와 그 위엄의 찬란함을 피해 바위의 동굴들과 바위 절벽의 틈[a]으로 들어갈 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바위의 구멍들과 바위 절벽의 갈라진 틈.’
    reason: נִקְרוֹת 및 סְעִפֵי의 가능한 지질학적 어휘 대안입니다.
  - marker: b
    text: 또는 ‘야훼께서 일어나 땅을 떨게 하실 때.’
    reason: לַעֲרֹץ의 가능한 의미 대안으로, ‘두렵게 하다’ 대신 ‘떨게 하다’로 옮길 수 있습니다.
