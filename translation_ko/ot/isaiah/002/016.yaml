translation:
  language: ko
  text: 그리고 다시스의 모든 배들에 대하여, 또 모든 아름다운 공예품들에 대하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 아름다운 형상들’ 혹은 ‘모든 탐스러운 작품들’일 수 있습니다. ‘공예품들’로 옮긴 히브리어는 드물며 정확한 뜻이 불확실합니다. 해상 문맥은 배나 정교하게 만든 기물과 관련된 뜻을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַ֖ל
  english_pob_choice: and against
  chosen_korean: …에 대하여
  alternatives_korean:
  - …을 향하여
  - …에 맞서
  - …을 대하여
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 ‘against’의 대립·심판 방향을 한국어에서는 자연스럽게 ‘…에 대하여’로 옮겼습니다. 반복되는 עַל 구조를 과도하게 해석하지 않고 살렸습니다.
- source_word: כָּל אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: the ships of Tarshish
  chosen_korean: 다시스로의 모든 배들
  alternatives_korean:
