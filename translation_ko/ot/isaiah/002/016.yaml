  text: and against all the ships of Tarshish[a], and against all the beautiful craft.
  footnotes:
  - marker: a
    text: Or possibly 'all the beautiful images' or 'all the desirable works.' The Hebrew term translated 'craft' is rare, and its precise sense is uncertain; the maritime context favors a rendering related to ships or finely made vessels.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다시스로의 모든 배들, 또 모든 아름다운 공예품들에 대하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 아름다운 형상들’ 혹은 ‘모든 바람직한 제작물들’일 수 있습니다. ‘공예품들’로 옮긴 히브리어는 드물며 정확한 뜻이 불확실하지만, 해상 문맥은 배나 정교하게 만든 기물과 관련된 뜻을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַ֖ל
  english_pob_choice: and against
  chosen_korean: …에 대하여
  alternatives_korean:
  - …을 향하여
  - …에 맞서
  - …을 대하여
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 ‘against’의 대립·심판 방향을 한국어에서는 자연스럽게 ‘…에 대하여’로 옮겼습니다. 반복되는 עַל 구조를 과도하게 해석하지 않고 살렸습니다.
- source_word: כָּל אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: the ships of Tarshish
  chosen_korean: 다시스로의 모든 배들
  alternatives_korean:
  - 다시스의 모든 배들
  - 다시스 항로의 모든 배들
  - 다시스의 배들
  lexicon: HALOT
  rationale: 관용적 표현인 ‘ships of Tarshish’를 한국어 성경 어법에 맞게 ‘다시스로의 배들’로 옮겨, 고유한 지명 결합을 유지했습니다. ‘모든’은 심판의 포괄성을 드러냅니다.
- source_word: שְׂכִיּוֹת הַחֶמְדָּה
  english_pob_choice: all the beautiful craft
  chosen_korean: 모든 아름다운 공예품들
  alternatives_korean:
  - 모든 아름다운 물건들
  - 모든 아름다운 형상들
  - 모든 귀한 제작물들
  lexicon: HALOT
  rationale: 희귀어 שְׂכִיּוֹת는 의미가 불확실하므로, 영어 POB의 ‘craft’에 대응하는 넓은 범주를 유지하되 ‘공예품들’로 옮겨 물건/제작물 의미를 열어 두었습니다. הַחֶמְדָּה는 ‘아름다운’으로 처리해 ‘바람직함/아름다움’의 결을 살렸습니다.
theological_decisions:
- issue: 희귀어 שְׂכִיּוֹת의 의미 불확실성
  chosen_reading: ‘공예품들’로 본문에 두고, 대안 의미 가능성을 각주로 열어 둡니다.
  alternative_readings:
  - ‘아름다운 형상들’
  - ‘바람직한 제작물들’
  - ‘배들’
  rationale: 문맥의 해상 이미지와 병행을 고려하면 단정적 번역보다 넓은 의미를 유지하는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 사전적 불확실성에 대한 본문 충실 번역
- issue: 심판 방향을 드러내는 עַל의 처리
  chosen_reading: ‘…에 대하여’로 옮겨 예언적 심판의 대상을 분명히 했습니다.
  alternative_readings:
  - ‘…위에’
  - ‘…을 향하여’
  rationale: 문맥상 여호와의 낮추심과 심판 선언이므로, 한국어에서 가장 직접적인 대립 방향을 나타내는 표현을 선택했습니다.
  doctrine_reference: 이사야 2장 12–16절의 심판 예언 문맥
