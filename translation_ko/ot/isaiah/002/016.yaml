  lexicon: HALOT
  rationale: 관용적 표현인 ‘ships of Tarshish’를 한국어 성경 어법에 맞게 ‘다시스로의 배들’로 옮겨, 고유한 지명 결합을 유지했습니다. ‘모든’은 심판의 포괄성을 드러냅니다.
- source_word: שְׂכִיּוֹת הַחֶמְדָּה
  english_pob_choice: all the beautiful craft
  chosen_korean: 모든 아름다운 공예품들
  alternatives_korean:
