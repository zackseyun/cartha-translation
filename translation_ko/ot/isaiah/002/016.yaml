  rationale: 문맥의 해상 이미지와 병행을 고려하면 단정적 번역보다 넓은 의미를 유지하는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 사전적 불확실성에 대한 본문 충실 번역
- issue: 심판 방향을 드러내는 עַל의 처리
  chosen_reading: ‘…에 대하여’로 옮겨 예언적 심판의 대상을 분명히 했습니다.
  alternative_readings:
  - ‘…위에’
  - ‘…을 향하여’
  rationale: 문맥상 여호와의 낮추심과 심판 선언이므로, 한국어에서 가장 직접적인 대립 방향을 나타내는 표현을 선택했습니다.
  doctrine_reference: 이사야 2장 12–16절의 심판 예언 문맥
