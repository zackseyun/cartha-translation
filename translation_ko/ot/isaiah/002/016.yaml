  - 모든 아름다운 형상들
  - 모든 귀한 제작물들
  lexicon: HALOT
  rationale: 희귀어 שְׂכִיּוֹת는 의미가 불확실하므로, 영어 POB의 ‘craft’에 대응하는 넓은 범주를 유지하되 ‘공예품들’로 옮겨 물건/제작물 의미를 열어 두었습니다. הַחֶמְדָּה는 ‘아름다운’으로 처리해 ‘바람직함/아름다움’의 결을 살렸습니다.
theological_decisions:
- issue: 희귀어 שְׂכִיּוֹת의 의미 불확실성
  chosen_reading: ‘공예품들’로 본문에 두고, 대안 의미 가능성을 각주로 열어 둡니다.
