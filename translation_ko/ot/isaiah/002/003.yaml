  source_fidelity: 개정이 필요합니다. 초안의 ‘우리가 그분의 길들로 걷게 하실 것입니다’는 히브리어의 1인칭 복수 청유/목적 표현(‘우리가 … 걷게 하시도록/걷기 위해’)을 하나님이 장차 걷게 하신다는 직설적 사역 미래문으로 바꾸어 놓았습니다. 또한 마지막 כִּי 절의 미완료 동사들은 예언적 미래이므로 ‘나오고’보다 ‘나올 것이며’가 적절합니다.
  naturalness: ‘많은 백성’은 집합 명사로 가능하나 עַמִּים רַבִּים의 복수 민족적 범위를 ‘많은 민족들이’로 나타내는 편이 자연스럽고 분명합니다. ‘야곱의 하나님의 집’은 히브리어의 ‘집’을 보존하면서도 한국어에서 이해 가능한 표현입니다. 각주 표지는 해당 단어에 직접 붙였습니다.
  terminology: יְהוָה는 프로젝트 방침 및 영어 감사본에 따라 ‘야훼’로 유지했습니다. תּוֹרָה는 법규에 한정되지 않는 신적 가르침이라는 문맥을 반영하여 현대 한국어에서 더 자연스러운 ‘가르침’으로 옮기고, ‘율법’이라는 대안을 각주로 제시했습니다.
