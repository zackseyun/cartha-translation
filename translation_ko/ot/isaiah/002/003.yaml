    rationale: וְנֵלְכָה는 ‘우리가 걷자/걷게 되도록’이라는 1인칭 복수 형태이며, 앞의 ‘가르치시고’와 함께 올라감의 목적 또는 결과를 이룹니다. 초안은 이를 하나님이 행위자인 미래 사역문으로 변경합니다.
