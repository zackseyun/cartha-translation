base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
  footnotes:
  - marker: a
    text: Or 'will go' or 'will walk'; the Hebrew verb is literally 'go/walk,' but here it describes peoples moving toward Zion.
    reason: lexical_alternative
  - marker: b
    text: '''Instruction'' translates Hebrew torah, which can also be rendered ''law'' or ''teaching.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 민족들이 와서[a] 말할 것입니다. “오십시오, 우리가 야훼의 산으로, 야곱의 하나님의 집으로 올라갑시다. 그분께서 우리에게 그분의 길들을 가르쳐 주시고, 우리가 그분의 길들을 따라 걷기 위해서입니다.” 이는 시온에서 가르침[b]이 나올 것이며, 예루살렘에서 야훼의 말씀이 나올 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘가다/걷다’를 뜻하지만, 여기서는 여러 민족이 시온을 향해 이동하는 모습을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 토라(תּוֹרָה)는 ‘율법’ 또는 ‘가르침’으로도 옮길 수 있습니다. 여기서는 하나님의 가르침 전반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성
  alternatives_korean:
  - 많은 민족들
  - 많은 백성들
  lexicon: HALOT
  rationale: עַמִּים는 민족/백성들의 복수 집합을 가리키므로, 한국어에서는 ‘백성’이 가장 자연스럽게 그 집합성을 살립니다.
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  english_pob_choice: that he may teach us his ways
  chosen_korean: 그분이 자기의 길들을 우리에게 가르치시고
  alternatives_korean:
  - 그분이 그의 길들에서 우리를 가르치시고
  - 그분이 그의 길들을 우리에게 가르쳐 주시고
  lexicon: HALOT
  rationale: יָרָה의 히필은 ‘가르치다/지도하다’의 뜻이므로 ‘가르치시고’가 적절하며, מִן은 한국어에서 자연스럽게 드러내기보다 문맥상 귀속을 살리는 쪽이 원문 의미에 더 가깝습니다.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  english_pob_choice: that we may walk in his paths
  chosen_korean: 우리가 그분의 길들로 걷게 하실 것입니다
  alternatives_korean:
  - 우리가 그분의 길들에서 걷게 하실 것입니다
  - 우리가 그분의 길들 안에서 걷게 하실 것입니다
  lexicon: HALOT
  rationale: ‘걷다’는 히브리어 הלך의 윤리적 은유를 살리며, בְּ는 ‘~로/안에서’보다 여기서는 삶의 방향성을 나타내는 ‘~로’가 자연스럽습니다.
- source_word: תּוֹרָה
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 율법
  - 가르침
  lexicon: HALOT
  rationale: תּוֹרָה는 단순한 법조문보다 하나님의 가르침 전반을 가리키므로, 예언 문맥에서 ‘교훈’이 한국어로 그 넓은 의미를 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명표기는 공용어적 호칭이 아니라 언약 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮깁니다.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  english_pob_choice: the house of the God of Jacob
  chosen_korean: 야곱의 하나님 집
  alternatives_korean:
  - 야곱의 하나님이신 집
  - 야곱의 하나님 댁
  lexicon: HALOT
  rationale: בַּיִת는 문자 그대로 ‘집’이지만 성소를 가리키는 관용구이므로, 직역을 유지하되 한국어 어순에 맞게 ‘야곱의 하나님 집’으로 옮깁니다.
theological_decisions:
- issue: 지명과 예언적 종말 비전의 방향성
  chosen_reading: 시온에서 교훈이 나오고, 예루살렘에서 야훼의 말씀이 나옵니다
  alternative_readings:
  - 시온에서 율법이 나오고, 예루살렘에서 야훼의 말씀이 나옵니다
  - 시온에서 가르침이 나오고, 예루살렘에서 야훼의 말씀이 나옵니다
  rationale: 이 절은 열방이 야훼께 올라오는 이유를 제시하는 예언적 중심문이므로, תּוֹרָה를 ‘교훈’으로 번역해 하나님의 가르침이 시온에서 흘러나온다는 뜻을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
