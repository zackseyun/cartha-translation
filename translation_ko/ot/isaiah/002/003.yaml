revisions:
- from: 많은 백성이 와서 말합니다. 「오십시오, 우리가 야훼의 산, 야곱의 하나님 집으로 올라가자. 그분이 자기의 길들을 우리에게 가르치시고, 우리가 그분의 길들로 걷게 하실 것입니다.」 이는 시온에서 교훈이 나오고, 예루살렘에서 야훼의 말씀이 나오기 때문입니다.[a][b]
  to: 많은 민족들이 와서[a] 말할 것입니다. “오십시오, 우리가 야훼의 산으로, 야곱의 하나님의 집으로 올라갑시다. 그분께서 우리에게 그분의 길들을 가르쳐 주시고, 우리가 그분의 길들을 따라 걷기 위해서입니다.” 이는 시온에서 가르침[b]이 나올 것이며, 예루살렘에서 야훼의 말씀이 나올 것이기 때문입니다.
  rationale: 목적을 나타내는 히브리어 청유 연쇄를 한국어의 ‘…하기 위해서입니다’로 재구성하여, 하나님이 길을 가르치시고 백성들이 그 길을 걷는다는 목적 관계를 보존했습니다. 예언적 미래 동사를 명시하고, 복수 민족 및 각주 앵커를 바로잡았습니다.
