  text: חִדְל֤וּ לָ/כֶם֙ מִן הָ֣/אָדָ֔ם אֲשֶׁ֥ר נְשָׁמָ֖ה בְּ/אַפּ֑/וֹ כִּֽי בַ/מֶּ֥ה נֶחְשָׁ֖ב הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: ko
  text: 사람을 의지하는 일을 그치십시오. 그의 숨은 콧구멍에 있으니, 그가 과연 얼마나 가치가 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִדְלוּ לָכֶם
  english_pob_choice: Stop trusting
  chosen_korean: 의지하는 일을 그치십시오
  alternatives_korean:
  - 사람을 믿는 일을 그치십시오
  - 사람을 의지하지 마십시오
  lexicon: חדל
  rationale: 히브리어 명령형 חדלו는 단순 중단을 뜻하므로, 문맥상 사람에 대한 의존을 끊으라는 의미를 자연스럽게 살려 합쇼체 명령으로 옮겼습니다.
- source_word: מִן הָאָדָם
  english_pob_choice: in man
  chosen_korean: 사람을
  alternatives_korean:
  - 인간을
  - 사람에게서
  lexicon: אָדָם
  rationale: POB의 영어가 사람 일반을 가리키는 취지를 반영해 ‘사람’을 택했고, 한국어에서는 ‘의지하다’의 목적어로 자연스럽게 연결했습니다.
- source_word: נְשָׁמָה בְּאַפּוֹ
  english_pob_choice: whose breath is in his nostrils
  chosen_korean: 그의 숨은 콧구멍에 있으니
  alternatives_korean:
  - 그의 호흡이 코에 있으니
  - 그의 입김이 코에 있으니
  lexicon: נשמה / אף
  rationale: ‘숨/호흡’과 ‘콧구멍’의 직유를 보존하여 인간의 유한성과 취약성을 직접 드러냈습니다. ‘콧구멍’은 다소 거칠지만 원문의 신체적 표현을 약화하지 않습니다.
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  english_pob_choice: for what is he really worth?
  chosen_korean: 그가 과연 얼마나 가치가 있겠습니까?
  alternatives_korean:
  - 그가 도대체 무엇으로 여겨지겠습니까?
  - 그가 무슨 대접을 받겠습니까?
  lexicon: חשב
  rationale: חשב의 ‘간주되다/평가되다’와 문맥의 평가 질문을 함께 살려, 존재 가치에 대한 반문으로 한국어 자연성을 확보했습니다.
theological_decisions:
- issue: 인간 의존을 금하는 예언의 경고를 어떻게 현대 한국어로 전달할지
  chosen_reading: ‘사람을 의지하는 일을 그치십시오’로 옮겨, 우상적 신뢰의 대상이 되는 인간에 대한 경고를 분명히 했습니다.
  alternative_readings:
  - 사람을 믿지 마십시오
  - 사람에 의존하지 마십시오
  rationale: 본문은 인간 일반의 한계를 지적하며 의존의 중단을 요구하므로, 도덕적 조언보다 예언적 경고의 어조가 살아나도록 했습니다.
  doctrine_reference: 인간의 유한성 및 하나님만 의지해야 한다는 성경적 주제
