revisions:
- from: 사람을 의지하는 일을 그치십시오. 그의 숨은 콧구멍에 있으니, 그가 과연 얼마나 가치가 있겠습니까?
  to: 숨이 그의 콧구멍에 있는 사람을 의지하지 마십시오. 그가 무엇이기에 중요하게 여겨지겠습니까?
  rationale: 명령의 직접성과 현대 합쇼체의 자연스러움을 위해 ‘의지하지 마십시오’로 다듬었습니다. ‘숨이 그의 콧구멍에 있는 사람’으로 원문의 관계절을 보존했고, 마지막 질문은 인간의 가치만이 아니라 그가 평가될 만한 무엇인가를 묻는 원문의 열린 표현을 살려 ‘무엇이기에 중요하게 여겨지겠습니까?’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:41Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령(חִדְלוּ), 인간을 대상으로 한 경계(מן האדם), ‘그의 콧구멍에 있는 숨,’ 그리고 인간의 평가에 관한 수사의문문을 대체로 반영합니다. 다만 현 초안의 ‘그의 숨은 콧구멍에 있으니’는 앞 문장과 문법적으로 분리되어 수식 관계가 불분명하며, כִּי בַמֶּה נֶחְשָׁב הוּא는 ‘얼마나 가치가 있겠습니까?’보다 ‘무엇으로 여겨지겠습니까?’에 가까운 평가/중요성의 질문입니다.
  naturalness: ‘사람을 의지하는 일을 그치십시오’도 이해되지만 다소 명사화되어 무겁습니다. ‘사람을 의지하지 마십시오’가 현대 표준 한국어 합쇼체에서 더 직접적이고 자연스럽습니다. ‘숨이 그의 콧구멍에 있는 사람’으로 연결하면 원문의 관계절을 자연스럽게 보존합니다.
  terminology: אָדָם은 ‘사람’, נְשָׁמָה는 ‘숨’, נֶחְשָׁב은 ‘여겨지다’로 옮기는 것이 적절합니다. 특정 교리적 해석을 덧붙이지 않았습니다.
