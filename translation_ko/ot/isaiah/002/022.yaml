    rationale: ‘얼마나 가치가 있겠습니까?’는 현대어로 자연스럽지만, בַמֶּה נֶחְשָׁב의 ‘무엇으로/어떤 존재로 여겨지는가’라는 표현을 ‘가치’에 한정합니다.
  revised_text: 숨이 그의 콧구멍에 있는 사람을 의지하지 마십시오. 그가 무엇이기에 중요하게 여겨지겠습니까?
