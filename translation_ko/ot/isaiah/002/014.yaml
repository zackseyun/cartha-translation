lexical_decisions:
- source_word: וְעַל
  english_pob_choice: and against
  chosen_korean: 향하여
  alternatives_korean:
  - 맞서
  - 대하여
  - 위하여
  lexicon: HALOT
  rationale: 반복되는 심판 목록에서 단순한 위치 관계보다 목표·방향성을 나타내므로, 한국어에서는 자연스럽게 ‘향하여’로 옮겨 공격적 대상을 가리키는 힘을 살렸습니다.
- source_word: הָרָמִים
  english_pob_choice: high
  chosen_korean: 높은
  alternatives_korean:
  - 높이 솟은
  - 고지의
  - 고상한
  lexicon: HALOT
  rationale: 산을 수식하는 높이의 의미를 직접 드러내는 가장 자연스러운 형용사는 ‘높은’이므로, 다음 구의 ‘들어 올려진’과도 구분되게 했습니다.
- source_word: הַנִּשָּׂאוֹת
  english_pob_choice: lifted-up
  chosen_korean: 들어 올려진
  alternatives_korean:
  - 올려진
  - 높이 든
  - 높아진
  lexicon: HALOT
  rationale: נשׂא의 수동 분사로서 ‘들어 올려진’은 원문의 동작 이미지를 보존하며, 단순한 상태 설명인 ‘높은/높이 솟은’과 구별됩니다.
theological_decisions:
- issue: 이 절의 지형어를 인간의 교만 상징으로 풀어쓸지, 문자적 지형 목록으로 유지할지
  chosen_reading: 문자적 지형 목록으로 유지하여, 본문 자체는 높은 산과 들어 올려진 언덕을 나열하게 했습니다.
  alternative_readings:
  - 교만을 강조하여 ‘거만한 산들’ 혹은 ‘오만한 언덕들’로 풀어쓰기
  rationale: 이 절은 앞뒤 문맥의 심판 선언 안에 있으나, 본문 자체는 실제로 높은 지형들을 병렬로 열거합니다. 본문에는 지형 이미지를 유지하고 상징적 함의는 문맥이 담당하게 하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
