id: ISA.2.5
reference: Isaiah 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֖ית יַעֲקֹ֑ב לְכ֥וּ וְ/נֵלְכָ֖ה בְּ/א֥וֹר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
  footnotes:
  - marker: a
    text: Or 'O house of Jacob.' The Hebrew phrase is a direct address to Jacob's descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'go, let us walk.' The Hebrew idiom uses an imperative followed by a cohortative to urge shared action.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 집이여, 오십시오. 우리가 야훼의 빛 가운데 걸어가자.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오 야곱의 집이여’. 히브리어는 야곱의 후손을 직접 부르는 호격입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가서, 우리가 걸어가자’. 히브리어 관용구는 명령형 뒤에 cohortative가 와서 함께 행동하라고 권면합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  english_pob_choice: House of Jacob
  chosen_korean: 야곱의 집이여
  alternatives_korean:
  - 야곱의 집
  - 오 야곱의 집이여
  - 야곱의 자손들아
  lexicon: HALOT
  rationale: 히브리어 직호격 호소를 살리기 위해 ‘야곱의 집’을 유지하고, 한국어에서는 종결 조사 ‘-이여’로 직접 호명하는 뉘앙스를 드러냈습니다.
- source_word: לְכוּ
  english_pob_choice: come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오라
  - 가십시오
  - 오시라
  lexicon: HALOT
  rationale: 명령형이지만 초청·권유의 뉘앙스가 강하므로 현대 한국어 합쇼체에서는 ‘오십시오’가 가장 자연스럽고 공손하게 대응합니다.
- source_word: וְנֵלְכָה
  english_pob_choice: and let us walk
  chosen_korean: 우리가 … 걸어가자
  alternatives_korean:
  - 우리가 … 가자
  - 우리가 … 걷자
  - 우리가 … 살아가자
  lexicon: HALOT
  rationale: cohortative의 공동 권면을 ‘-자’로 옮기되, הלך의 계속적 행위를 살리기 위해 ‘걸어가다’로 번역했습니다.
- source_word: בְּאוֹר
  english_pob_choice: in the light
  chosen_korean: 빛 가운데
  alternatives_korean:
  - 빛 안에서
  - 빛으로
  - 빛 속에서
  lexicon: HALOT
  rationale: ב의 영역적 용법을 살려 하나님의 빛 안에 거하는 비유를 자연스럽게 드러내는 ‘가운데’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명사 יְהוָה는 한국어 음역 ‘야훼’로 옮겨, 단순한 호칭이 아니라 언약적 고유명을 보존했습니다.
theological_decisions:
- issue: 직접 호명과 공동 권면의 문체
  chosen_reading: 전반부는 직접 호명(야곱의 집이여), 후반부는 공동 결의의 청유(우리가 … 걸어가자)로 처리했습니다.
  alternative_readings:
  - ‘야곱의 집아’ 같은 구어적 호명
  - ‘우리가 … 걷자’의 더 평이한 표현
  rationale: 예언자적 초청의 호소력을 살리려면 문체를 평평하게 만들기보다 호명과 청유의 리듬을 유지하는 것이 소스에 더 가깝습니다.
  doctrine_reference: 예언서 수사와 청유형(cohortative) 표현 보존
- issue: 야훼의 이름 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 일반 칭호가 아니라 신명사 עצמו를 사용하므로, 번역에서도 고유명 보존이 우선입니다.
  doctrine_reference: יְהוָה YHWH → 야훼
