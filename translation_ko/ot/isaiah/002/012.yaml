  naturalness: 현행 문장은 ‘그때는’이 문맥 없이 시간 지시를 추가하고, ‘자’와 ‘것들’이 병렬되지 않아 다소 부자연스럽습니다. 개정문은 현대 표준어 합쇼체로 자연스럽게 원문의 논리적 연결(‘이는/때문입니다’)과 집합적 대상을 표현합니다.
