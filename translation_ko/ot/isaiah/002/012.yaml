id: ISA.2.12
reference: Isaiah 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때는 만군의 야훼께서 모든 교만하고 거만한 자와, 모든 높이 들린 자를 치시는 날이며, 그것들은 낮아질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘만군의 주’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: WLC + POB doctrinal naming
  rationale: 히브리어 고유명사 יהוה는 POB 기준에 따라 ‘야훼’로 옮기고, צְבָאוֹת은 군사적 다수와 주권을 드러내는 말이므로 ‘만군’으로 옮겼습니다.
- source_word: גֵּאֶה וָרָם
  english_pob_choice: that is proud and lofty
  chosen_korean: 교만하고 거만한
  alternatives_korean:
  - 교만하고 높이 선
  - 오만하고 높이 든
  lexicon: HALOT
  rationale: 두 형용사의 결합은 단순한 키의 높음보다 하나님 앞에서의 오만함을 가리키므로, 의미를 살려 ‘교만하고 거만한’으로 옮겼습니다.
- source_word: נִשָּׂא
  english_pob_choice: that is lifted up
  chosen_korean: 높이 들린
  alternatives_korean:
  - 들린
  - 높여진
  lexicon: HALOT
  rationale: 수동적 높임의 이미지를 보존하기 위해 ‘높이 들린’으로 옮겨, 앞의 ‘거만한’과 함께 과시적 고양을 드러내도록 했습니다.
- source_word: וְשָׁפֵל
  english_pob_choice: it shall be brought low
  chosen_korean: 낮아질 것입니다
  alternatives_korean:
  - 겸손해질 것입니다
  - 끌어내려질 것입니다
  lexicon: HALOT
  rationale: 문맥상 심판의 결과를 나타내는 종결 절이므로, 상태 묘사보다 결과를 분명히 하는 ‘낮아질 것입니다’가 적절합니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה를 음역해 언약적 고유명을 보존하고, 번역어 ‘주님’으로 일반화하지 않았습니다.
  doctrine_reference: POB default glossary — יהוה / YHWH → 야훼
- issue: 만군의 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼 만군
  - 만군의 주님
  rationale: צְבָאוֹת의 군사적·주권적 뉘앙스를 살려 전통적 ‘만군’으로 옮겼습니다. 이는 심판의 날이라는 문맥과도 맞습니다.
  doctrine_reference: POB default glossary — צְבָאוֹת → of Armies
