  to: 이는 만군의 야훼께서 모든 교만하고 높은 것과 모든 높이 들린 것을 대적하실 날이 있기 때문입니다. 그 모든 것은 낮아질 것입니다.[a]
  rationale: ‘그때는’과 ‘치시는’을 हट하고, 원문의 명사절과 대적의 의미를 ‘대적하실 날이 있기 때문입니다’로 옮겼습니다. 심판 대상의 포괄성을 보존하기 위해 인간으로 한정하는 ‘자’를 ‘것’으로 바꾸었고, 마지막 절은 원문의 낮춤의 결과를 유지했습니다. 각주는 전통적 한국어 번역 관용에 맞게 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:42Z'
