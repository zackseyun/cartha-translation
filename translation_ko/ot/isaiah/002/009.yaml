  source_fidelity: 첫 동사 וַיִּשַּׁח는 단순히 ‘낮아지다’보다 ‘몸을 굽히다/절하다’의 구체적 의미가 있으므로 이를 드러내야 합니다. 또한 접속사 וְ는 ‘그러므로’라는 인과를 명시하지 않습니다. 마지막 청원은 ‘용서하지 마십시오’로 옮길 수 있으나, 대명사의 목적격은 ‘그들을’이 자연스럽습니다.
  naturalness: 현 초안의 ‘그들에게 용서하지 마십시오’는 현대 표준 한국어에서 목적격 표현으로 부자연스럽습니다. ‘사람은 몸을 굽히고, 각 사람은 낮아집니다’는 시적 병행을 유지하면서도 합쇼체 문장으로 자연스럽습니다.
  terminology: אָדָם과 אִישׁ의 병행은 ‘사람’과 ‘각 사람’으로 보존합니다. שׁחה는 ‘몸을 굽히다’, שׁפל은 ‘낮아지다’로 구별합니다. נָשָׂא의 ‘용서하다’ 해석은 유지하되, ‘들어 올리다’라는 가능한 대안을 각주에 남깁니다.
