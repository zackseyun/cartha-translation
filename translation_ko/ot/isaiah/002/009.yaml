id: ISA.2.9
reference: Isaiah 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/אַל תִּשָּׂ֖א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
  footnotes:
  - marker: a
    text: Or, 'do not lift them up.' The Hebrew verb can mean 'lift, carry, bear,' and in some contexts 'forgive.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 사람이 낮아지고 각 사람이 낮아집니다. 그들에게 용서하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '그들을 높이지 마십시오.' 히브리어 동사는 '들다, 지니다, 품다'를 뜻할 수 있으며, 어떤 문맥에서는 '용서하다'를 뜻하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  english_pob_choice: is bowed down
  chosen_korean: 낮아집니다
  alternatives_korean:
  - 엎드러집니다
  - 굽어집니다
  - 눌립니다
  lexicon: HALOT
  rationale: 이 동사는 '몸이 굽다/낮아지다'의 결과 상태를 나타내므로, 한국어에서는 상태 변화를 자연스럽게 드러내는 '낮아집니다'가 가장 간결합니다.
- source_word: וַיִּשְׁפַּל
  english_pob_choice: is brought low
  chosen_korean: 낮아집니다
  alternatives_korean:
  - 겸손해집니다
  - 천해집니다
  - 깊이 낮아집니다
  lexicon: HALOT
  rationale: 앞 절과 평행을 이루는 낮아짐의 동사로, 중복을 허용하더라도 본문의 시적 병행을 살리기 위해 같은 핵심 동사로 옮겼습니다.
- source_word: וְאַל תִּשָּׂא לָהֶם
  english_pob_choice: do not forgive them
  chosen_korean: 그들에게 용서하지 마십시오
  alternatives_korean:
  - 그들을 높이지 마십시오
  - 그들을 들어 올리지 마십시오
  - 그들의 죄를 덮지 마십시오
  lexicon: HALOT
  rationale: '''נשא''는 문맥상 ''죄를 사하다/용서하다''의 뜻으로도 쓰일 수 있으므로, 심판 맥락에 맞게 ''용서하지 마십시오''로 옮겼습니다.'
theological_decisions:
- issue: 마지막 절의 נשא 의미
  chosen_reading: 하나님께서 이 백성을 용서하지 않으시기를 구하는 간청으로 읽었습니다.
  alternative_readings:
  - 그들을 높이지 않으시기를 구하는 간청
  - 비교적 중립적인 '들어 올리지 마십시오'의 뜻
  rationale: 우상숭배와 교만에 대한 심판 문맥에서, '용서하지 마십시오'가 문장의 엄중함을 가장 잘 드러냅니다. 다만 히브리어가 '높이다'도 가능하므로 긴장을 지우지 않도록 대안 의미를 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
