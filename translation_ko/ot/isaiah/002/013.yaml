  - severity: medium
    issue: ‘떡갈나무’는 אַלּוֹן의 불확정적인 수종을 지나치게 특정합니다.
    rationale: 원어는 일반적으로 참나무 또는 테레빈나무로 이해될 수 있습니다. 본문에는 포괄적인 ‘참나무’를 쓰고 대안을 각주로 보존하는 것이 적절합니다.
