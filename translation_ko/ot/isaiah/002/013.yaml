revisions:
- from: 레바논의 모든 백향목들—높고도 솟아오른 것들과—그리고 바산의 모든 떡갈나무들에 대하여.[a]
  to: 레바논의 모든 높고 솟아오른 백향목과 바산의 모든 참나무에 대하여.[a]
  rationale: 대시와 명사화로 인해 흐려진 수식 관계를 바로잡아, ‘높고 솟아오른’이 백향목을 직접 꾸미도록 했습니다. 또한 אַלּוֹן을 특정 종명인 ‘떡갈나무’ 대신 포괄적인 ‘참나무’로 옮기고, 테레빈나무라는 어휘 대안을 각주에 보존했습니다. 원문의 열거형 문장 구조와 심판 문맥의 ‘…에 대하여’도 유지했습니다.
