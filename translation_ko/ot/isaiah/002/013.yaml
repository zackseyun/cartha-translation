translation:
  language: ko
  text: 레바논의 모든 높고 솟아오른 백향목과 바산의 모든 참나무에 대하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 알론은 참나무 또는 테레빈나무를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: and against
  chosen_korean: …에 대하여
  alternatives_korean:
  - …을 향하여
  - …에 맞서
  lexicon: HALOT
  rationale: 문맥상 심판의 대상이 되는 목록이므로 관계를 단순한 위치가 아니라 ‘…에 대하여’라는 대항/적대의 방향으로 드러내는 것이 자연스럽습니다. 한국어에서는 쉼표와 병행 구조로 공격성을 과장하지 않으면서도 대항의 의미를 살릴 수 있습니다.
- source_word: אַרְזֵי הַלְּבָנוֹן
  english_pob_choice: the cedars of Lebanon
  chosen_korean: 레바논의 모든 백향목들
  alternatives_korean:
  - 레바논의 모든 삼나무들
  - 레바논의 모든 향나무들
  lexicon: HALOT
  rationale: אַרְז는 전통적으로 ‘백향목’으로 옮기는 것이 한국어 성경 독자에게도 익숙하고, 레바논의 상징적 나무라는 점을 잘 살립니다.
- source_word: הָרָמִים וְהַנִּשָּׂאִים
  english_pob_choice: lofty and lifted up
  chosen_korean: 높고도 솟아오른 것들
  alternatives_korean:
  - 높고도 들어 올려진 것들
  - 높고도 높임받은 것들
  lexicon: HALOT
  rationale: 두 형용사는 높이를 반복해 강조하므로 한국어에서도 중복된 높이 이미지를 유지했습니다. ‘솟아오른’은 시적이면서도 물리적 높음과 교만의 여운을 함께 담습니다.
- source_word: אַלּוֹנֵי הַבָּשָׁן
  english_pob_choice: the oaks of Bashan
  chosen_korean: 바산의 모든 떡갈나무들
  alternatives_korean:
  - 바산의 모든 상수리나무들
  - 바산의 모든 참나무들
  lexicon: HALOT
  rationale: אַלּוֹן은 참나무류를 가리킬 수 있으나, 한국어에서는 ‘떡갈나무’가 가장 자연스럽고 장엄한 숲의 이미지를 잘 전달합니다. 종 식별의 불확실성은 유지하되 본문 흐름을 해치지 않도록 본문에는 한 가지 이름만 두었습니다.
theological_decisions:
- issue: 나무 이미지의 상징성
  chosen_reading: 본문의 나무 이미지를 문자적으로 유지하되, 심판받는 교만한 높음의 상징성이 드러나도록 했습니다.
  alternative_readings:
  - 나무를 곧바로 지도자나 민족의 상징으로 풀어 번역함
  rationale: 문맥이 스스로 높아진 것들을 낮추시는 야훼의 심판을 말하므로, 본문에 없는 해석어를 덧붙이지 않고 시적 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
