  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
  footnotes:
  - marker: a
    text: Or 'The haughty eyes of man ... the loftiness of men.' The Hebrew imagery speaks of human pride expressed in elevated bearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 높은 눈은 낮아지고, 사람들의 교만은 굽어질 것이며, 그 날에는 야훼만 홀로 높임을 받으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 높은 눈’은 ‘사람의 교만한 눈’이라는 뜻을 포함합니다. 히브리어의 이미지는 높아진 태도로 드러나는 인간의 교만을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  english_pob_choice: The lofty eyes of man
  chosen_korean: 사람의 높은 눈
  alternatives_korean:
  - 사람의 교만한 눈
  - 사람의 거만한 눈
  lexicon: HALOT
  rationale: ‘눈’에 담긴 높아진 태도와 자세의 이미지를 살리기 위해 직역에 가깝게 ‘높은 눈’으로 옮겼습니다.
- source_word: שָׁפֵל
  english_pob_choice: will be brought low
  chosen_korean: 낮아지고
  alternatives_korean:
  - 낮아질 것입니다
  - 겸손해질 것입니다
  lexicon: HALOT
  rationale: 동사가 말하는 ‘낮아짐’의 수직적 이미지를 유지하기 위해 ‘낮아지고’로 표현했습니다.
- source_word: וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים
  english_pob_choice: and the haughtiness of men will be humbled
  chosen_korean: 사람들의 교만은 굽어질 것이며
  alternatives_korean:
  - 사람들의 교만은 낮아질 것이며
  - 사람들의 높음은 굽어질 것이며
  lexicon: HALOT
  rationale: רוּם אֲנָשִׁים의 핵심은 ‘높아짐/교만’이므로 의미를 풀어 ‘교만’으로 옮기되, שַׁח의 ‘굽어짐’ 이미지를 살려 ‘굽어질 것’으로 대응했습니다.
- source_word: וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ
  english_pob_choice: and Yahweh alone will be exalted
  chosen_korean: 그 날에는 야훼만 홀로 높임을 받으실 것입니다
  alternatives_korean:
  - 그 날에는 야훼만 높임을 받으실 것입니다
  - 야훼만 홀로 높아지실 것입니다
  lexicon: HALOT
  rationale: יְהוָה는 본문 원형을 따라 ‘야훼’로 옮기고, 니팔형의 피동/상태적 뉘앙스를 살려 ‘높임을 받으실 것입니다’로 번역했습니다.
theological_decisions:
- issue: בַּיּוֹם הַהוּא의 예언적 시간 표현
  chosen_reading: 그 날에는
  alternative_readings:
  - 그 날에
  - 그때
  rationale: 예언 문맥의 관용구를 살리면서도 한국어 문장 흐름에 자연스럽게 맞추기 위해 ‘그 날에는’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Prophetic discourse and temporal formulas
- issue: YHWH의 고유명 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 호칭이 아니라 신적 고유명이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
