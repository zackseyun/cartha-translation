id: ISA.2.19
reference: Isaiah 2:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
  footnotes:
  - marker: a
    text: Or 'the holes of the ground' or 'the burrows in the dust.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바위의 동굴들과 먼지의 구멍들로 들어갈 것입니다. 야훼의 두려움과 그의 위엄의 광채 때문에, 그가 일어나 땅을 떨게 하실 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 구멍들’ 또는 ‘먼지 속의 굴들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  english_pob_choice: And they will enter
  chosen_korean: 들어갈 것입니다
  alternatives_korean:
  - 들어올 것입니다
  - 가게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 살리면서, 뒤따르는 전치사구가 ‘숨기 위해 안으로 들어감’을 분명히 하므로 ‘들어가다’가 가장 자연스럽습니다.
- source_word: בִּמְעָרוֹת צֻרִים
  english_pob_choice: the caves of the rocks
  chosen_korean: 바위의 동굴들
  alternatives_korean:
  - 바위들 속의 동굴들
  - 바위 동굴들
  lexicon: HALOT
  rationale: ‘동굴들’과 ‘바위들’의 소유·관계성을 유지하면서 한국어로는 ‘바위의 동굴들’이 가장 직역에 가깝고 읽기에도 자연스럽습니다.
- source_word: וּבִמְחִלּוֹת עָפָר
  english_pob_choice: the holes of the dust
  chosen_korean: 먼지의 구멍들
  alternatives_korean:
  - 흙의 구멍들
  - 땅속 구멍들
  - 먼지 속의 굴들
  lexicon: HALOT
  rationale: 문맥상 숨을 곳을 가리키는 구체적 이미지와 ‘עָפָר’를 최대한 살려 ‘먼지’를 유지했습니다. 본문 읽기상의 낯섦은 있으나, 영어 POB가 보존한 긴장을 따라갑니다.
- source_word: פַּחַד יְהוָה
  english_pob_choice: the terror of Yahweh
  chosen_korean: 야훼의 두려움
  alternatives_korean:
  - 야훼의 공포
  - 야훼의 경외
  lexicon: HALOT
  rationale: 여기서는 경건한 ‘경외’가 아니라 심판 앞에서의 공포·두려움을 가리키므로 ‘두려움’이 적절합니다. 하나님의 이름은 소스와 POB의 명시적 선택에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּמֵהֲדַר גְּאֹנוֹ
  english_pob_choice: and from the splendor of his majesty
  chosen_korean: 그의 위엄의 광채
  alternatives_korean:
  - 그의 장엄의 광채
  - 그의 위엄의 영광
  - 그의 장엄함의 빛
  lexicon: HALOT
  rationale: הֲדַר와 גָּאוֹן이 겹쳐 나타내는 장엄·위엄의 중첩을 한국어에서 과도하게 반복하지 않으면서도 ‘광채’로 시각적 장엄성을 살렸습니다.
theological_decisions:
- issue: 예언적 심판 장면에서의 종말론적 시제 처리
  chosen_reading: 미래형 ‘들어갈 것입니다’와 ‘일어나…하실 때입니다’로, 장차 임할 야훼의 심판을 현재 독자에게 생생한 경고로 전달했습니다.
  alternative_readings:
  - 단순 과거형/현재형으로 평서
  - ‘들어갑니다’식 현재적 진술
  rationale: 히브리어 서술은 예언적 미래로 읽히며, 문맥 전체가 야훼의 심판을 앞둔 두려움을 묘사하므로 한국어에서도 장차성을 분명히 했습니다.
  doctrine_reference: 예언문 시제와 심판 본문의 문맥적 해석
