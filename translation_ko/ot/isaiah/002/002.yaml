source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
  footnotes:
  - marker: a
    text: Or, 'in the last days' or 'in days to come.'
    reason: alternative_reading
  - marker: b
    text: Or, 'the mountain of the house of the LORD shall be established on the top of the mountains.'
    reason: alternative_reading
  - marker: c
    text: The Hebrew verb pictures the nations 'flowing' like a river toward it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 후일에[a] 야훼의 집이 있는 산이 산들 가운데 가장 높이 굳게 서고[b], 언덕들보다 높이 들리며, 모든 민족이 그리로 흘러올 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마지막 날들’ 또는 ‘다가올 날들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘산들의 꼭대기에’라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 동사는 민족들이 강물처럼 ‘흘러들어온다’는 그림을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 말년에
  - 종말에
  lexicon: HALOT
  rationale: 예언적 시간표현을 살리면서도 특정 종말론 체계를 과도하게 주입하지 않도록 비교적 직역에 가까운 표준어로 옮겼습니다.
- source_word: נָכוֹן יִהְיֶה
  english_pob_choice: shall be established
  chosen_korean: 세워지고
  alternatives_korean:
  - 굳게 서고
  - 확립되고
  - 견고히 세워지고
  lexicon: HALOT
  rationale: 산의 안정성과 확고한 정립을 나타내므로, 한국어에서는 ‘세워지다’에 굳건함의 뉘앙스를 담아 자연스럽게 표현했습니다.
- source_word: בְּרֹאשׁ הֶהָרִים
  english_pob_choice: as the highest of the mountains
  chosen_korean: 산들 가운데 가장 높이
  alternatives_korean:
  - 산들의 꼭대기에
  - 산들 위의 꼭대기에
  - 산들의 머리로
  lexicon: HALOT
  rationale: 히브리어는 위치와 우월성을 함께 담을 수 있으므로, 단순한 지형 묘사보다 ‘가장 높이’로 우월성의 뜻을 드러냈습니다.
- source_word: וְנָהֲרוּ
  english_pob_choice: shall stream
  chosen_korean: 밀려올 것입니다
  alternatives_korean:
  - 흘러올 것입니다
  - 물결치듯 올 것입니다
  - 줄지어 올 것입니다
  lexicon: HALOT
  rationale: 동사가 문자적으로는 ‘강물처럼 흐르다’를 뜻하지만, 민족들의 집합적 이동이라는 은유를 한국어에서 생동감 있게 살리기 위해 ‘밀려오다’를 선택했습니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족들
  lexicon: HALOT
  rationale: 문맥상 이스라엘과 대비되는 세계 열방을 가리키므로, 한국어에서는 과도한 종교적 색채를 피하고 넓은 범주의 ‘민족’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 관용적 대체어가 아니라 고유명사이므로, 프로젝트 기본어인 ‘야훼’를 사용해 본문 차이를 보존했습니다.
theological_decisions:
- issue: ‘마지막 날들’의 종말론적 강도
  chosen_reading: 마지막 날들에
  alternative_readings:
  - 말년에
  - 종말에
  rationale: 히브리어 관용구의 폭을 유지해, 후대의 정교한 종말 체계를 미리 단정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 시온/성전 산의 높음이 지리적 진술인지 상징적 우월성인지
  chosen_reading: 산들 가운데 가장 높이 세워지고, 언덕들보다 높이 들리며
  alternative_readings:
  - 산들의 꼭대기에 세워지고
  - 언덕들 위에 높이 들리며
  rationale: 병행구가 지형적 이미지와 우월성의 상징을 함께 지니므로, 둘을 모두 살려 문자적·상징적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
