    rationale: 집단적 이동은 표현하지만, 이 동사가 환기하는 물의 흐름 은유를 약화합니다. ‘흘러올 것입니다’가 원문의 비유를 더 충실히 보존합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 배치됨
    rationale: 각주 a, b, c는 각각 시간 표현, 산의 높임 표현, 흐름 동사에 직접 붙여야 해당 범위가 명확합니다.
