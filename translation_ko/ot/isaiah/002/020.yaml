id: ISA.2.20
reference: Isaiah 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
  footnotes:
  - marker: a
    text: Or 'On that day.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to bow down to'; that is, to worship them.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression likely refers to moles or other burrowing creatures; the exact animal is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 사람은 자기의 은색 우상들과 금색 우상들을 버릴 것입니다[a]—그것들은 사람들이 그에게 절하려고[b] 만들어 준 것인데—두더지와 박쥐에게로.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 날에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘절하다’; 곧, 그것들을 경배하려고라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 날에는
  lexicon: HALOT
  rationale: 예언문에서 반복되는 시간 표지이므로, 간결한 ‘그 날에’로 옮겨 장르적 울림을 살렸습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 사람들
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 대표성은 유지하되, 한국어에서는 성별을 불필요하게 좁히지 않는 ‘사람’이 자연스럽습니다.
- source_word: אֱלִילֵי כַסְפּוֹ / אֱלִילֵי זְהָבוֹ
  english_pob_choice: his idols of silver and his idols of gold
  chosen_korean: 자기의 은색 우상들과 금색 우상들
  alternatives_korean:
  - 은으로 된 우상들과 금으로 된 우상들
  - 은 우상들과 금 우상들
  lexicon: HALOT
  rationale: ‘우상들’을 유지하고 재료를 형용사구로 풀어, 소유격과 병렬 구조를 자연스럽게 드러냈습니다.
- source_word: לְהִשְׁתַּחֲוֺת
  english_pob_choice: to bow down to
  chosen_korean: 절하려고
  alternatives_korean:
  - 엎드려 경배하려고
  - 경배하려고
  lexicon: HALOT
  rationale: 직역의 ‘엎드리다’보다 한국어에서 우상 숭배의 뜻을 분명히 드러내는 ‘절하다’가 원문의 몸짓과 예배 행위를 함께 살립니다.
- source_word: לַחְפֹּר פֵּרוֹת
  english_pob_choice: to the moles
  chosen_korean: 두더지에게로
  alternatives_korean:
  - 땅을 파는 짐승들에게로
  - 두더지류에게로
  lexicon: HALOT
  rationale: 표현이 난해하지만 POB의 기본 선택을 따라 관용적으로 ‘두더지’로 옮기되, 방향 조사 ‘-에게로’로 버림의 대상을 드러냈습니다.
- source_word: וְלָעֲטַלֵּפִים
  english_pob_choice: and to the bats
  chosen_korean: 박쥐에게로
  alternatives_korean:
  - 그리고 박쥐에게로
  - 박쥐들에게로
  lexicon: HALOT
  rationale: 히브리어의 병렬 대상을 그대로 살려, 어두움과 버려짐의 대조를 보존했습니다.
theological_decisions:
- issue: 우상 숭배를 위한 절함의 표현
  chosen_reading: ‘절하려고’로 옮겨 단순한 경배 의도와 몸의 동작을 함께 드러냈습니다.
  alternative_readings:
  - 경배하려고
  - 무릎을 꿇으려고
  rationale: לְהִשְׁתַּחֲוֺת는 단순 내적 숭배보다 몸을 낮추는 행위를 포함하므로, 한국어에서도 행위성과 예배성을 함께 보존하는 것이 좋습니다.
  doctrine_reference: 예언서의 우상숭배 비판과 경배 행위의 가시성
