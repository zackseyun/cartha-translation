base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
  footnotes:
  - marker: a
    text: 'Hebrew: ''his land''—a collective singular referring to the people/nation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅은 우상으로 가득 찼습니다. 그들은 자기 손의 작품, 곧 자기 손가락이 만든 것에 절합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그 땅’은 집합적 단수로, 백성/나라 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא / is filled
  english_pob_choice: is filled
  chosen_korean: 가득 찼습니다
  alternatives_korean:
  - 가득합니다
  - 채워졌습니다
  lexicon: HALOT
  rationale: נִפְעַל형의 상태적·수동적 의미를 살려 현재적 서술로 옮겼습니다.
- source_word: אַרְצוֹ / his land
  english_pob_choice: his land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그의 땅
  - 그들의 땅
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수는 유지하되, 한국어에서는 자연스럽게 ‘그 땅’으로 옮겨 집합체를 드러냈습니다.
- source_word: לְמַעֲשֵׂה יָדָיו / to the work of their hands
  english_pob_choice: to the work of their hands
  chosen_korean: 자기 손의 작품
  alternatives_korean:
  - 그들 손의 일
  - 그들이 만든 것
  lexicon: HALOT
  rationale: 우상숭배의 아이러니를 살리기 위해 ‘손의 작품’이라는 구체적 표현을 유지했습니다.
- source_word: יִשְׁתַּחֲוּוּ / they bow down
  english_pob_choice: they bow down
  chosen_korean: 절합니다
  alternatives_korean:
  - 엎드립니다
  - 경배합니다
  lexicon: HALOT
  rationale: 몸을 굽혀 드리는 물리적 동작을 드러내면서도, 문맥상 우상숭배의 의미가 자연스럽게 드러나도록 했습니다.
- source_word: אֶצְבְּעֹתָיו / their fingers
  english_pob_choice: their fingers
  chosen_korean: 자기 손가락
  alternatives_korean:
  - 그들의 손가락
  - 손가락
  lexicon: HALOT
  rationale: 영문 POB의 집합적 해석을 따라, 사람 손으로 만든 우상의 인위성을 강조하는 방향으로 풀었습니다.
theological_decisions:
- issue: 우상 앞의 השתחוה 동사 처리
  chosen_reading: ‘절합니다’로 옮겨, 단순한 몸동작이 아니라 우상숭배의 행위를 드러냈습니다.
  alternative_readings:
  - 엎드립니다
  - 경배합니다
  rationale: 히브리어는 물리적 굴복 동작을 말하지만, 이 본문에서는 곧바로 우상숭배의 고발로 기능하므로 너무 중립적이거나 지나치게 교회적이지 않은 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
