  source_fidelity: 히브리어의 집합적 단수 소유격(‘그의 땅’)과 복수 동사(‘그들은 절한다’)의 긴장을 한국어 ‘그 땅’과 ‘그들은’으로 자연스럽게 반영했습니다. ‘우상으로 가득 찼습니다’, ‘자기 손의 작품’, ‘자기 손가락이 만든 것’은 원문의 반복과 사람이 만든 우상이라는 대조를 충실히 보존합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고 문장 흐름도 좋습니다. ‘절합니다’는 השתחוה의 몸을 굽혀 경배하는 행위를 과도하게 해석하지 않고 잘 전달합니다.
  terminology: ‘우상’, ‘절합니다’는 본문 문맥과 한국어 성경 문체에 적절합니다. ‘자기 손의 작품’ 및 ‘자기 손가락이 만든 것’은 원문의 손/손가락 표현을 보존하며, ‘자기’는 복수 주어와 함께 집합적 의미로 무리 없이 이해됩니다.
