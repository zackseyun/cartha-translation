id: ISA.2.17
reference: Isaiah 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
  footnotes:
  - marker: a
    text: Or 'The haughtiness of man will be bowed down, and the pride of men will be brought low.' The Hebrew uses height imagery for human arrogance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에는 사람의 교만이 낮아지고, 사람들의 높음이 낮아지며, 야훼만 홀로 높임을 받으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘높이/고양됨’의 이미지를 통해 인간의 교만이 꺾이는 모습을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁח / גַּבְהוּת
  english_pob_choice: will be brought low / loftiness
  chosen_korean: 낮아지고 / 교만
  alternatives_korean:
  - 엎드러지고 / 높음
  - 천하게 되고 / 오만
  lexicon: HALOT
  rationale: 히브리어는 ‘높음/높이’ 이미지를 통해 인간의 자만이 꺾이는 모습을 그리므로, 첫 절은 ‘낮아지고’로, 명사 גַּבְהוּת은 문맥상 ‘교만’으로 옮겨 높이의 은유와 도덕적 뉘앙스를 함께 살렸습니다.
- source_word: הָאָדָם / אֲנָשִׁים
  english_pob_choice: man / men
  chosen_korean: 사람 / 사람들의
  alternatives_korean:
  - 인간 / 인간들의
  - 사람 / 사람들
  lexicon: HALOT
  rationale: 원문은 단수 일반명사 뒤에 복수 인간 명사를 병치해 대구를 이루므로, 한국어에서도 ‘사람 / 사람들의’로 반복해 인간 전체의 자만이 낮아지는 대조를 보존했습니다.
- source_word: וְנִשְׂגַּב
  english_pob_choice: will be exalted
  chosen_korean: 높임을 받으실 것입니다
  alternatives_korean:
  - 높아지실 것입니다
  - 높임을 받게 되실 것입니다
  lexicon: HALOT
  rationale: 주어가 야훼이므로 수동적 결과를 자연스럽게 드러내는 ‘높임을 받으실 것입니다’로 옮겨, 마지막 절의 배타적 강조(‘홀로’)를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 신적 고유명사인 ‘야훼’를 사용해 원문이 지닌 언약적 이름을 그대로 반영했습니다.
theological_decisions:
- issue: ‘홀로’의 배타성
  chosen_reading: 야훼만 홀로 높임을 받으실 것입니다
  alternative_readings:
  - 야훼만 높임을 받으실 것입니다
  - 야훼만 오직 높임을 받으실 것입니다
  rationale: לְבַדּוֹ는 단순한 부가어가 아니라 다른 모든 높임을 배제하는 배타성을 강조하므로, 한국어에서도 ‘만 홀로’로 중첩해 최종 대조를 분명히 했습니다.
  doctrine_reference: 시 113:5-6; 사 2:11, 17의 야훼의 유일한 높으심
