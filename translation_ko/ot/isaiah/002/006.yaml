  text: 주님께서 주님의 백성, 곧 야곱의 집을 버리셨습니다. 그들이 동방의 풍속으로[a] 가득하고, 블레셋 사람들처럼 점을 치며[b], 이방인의 자녀들과 손을 맞잡기[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
