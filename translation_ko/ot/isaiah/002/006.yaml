source:
  edition: WLC
  text: כִּ֣י נָטַ֗שְׁתָּה עַמְּ/ךָ֙ בֵּ֣ית יַעֲקֹ֔ב כִּ֤י מָלְאוּ֙ מִ/קֶּ֔דֶם וְ/עֹֽנְנִ֖ים כַּ/פְּלִשְׁתִּ֑ים וּ/בְ/יַלְדֵ֥י נָכְרִ֖ים יַשְׂפִּֽיקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
  footnotes:
  - marker: a
    text: Literally 'from the east'; the phrase likely refers to eastern influences or practices rather than merely geographic origin.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are soothsayers like the Philistines.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb is rare and uncertain; it may mean 'they strike hands with,' 'they make agreements with,' or more generally 'they join with' the children of foreigners.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 주의 백성, 곧 야곱의 집을 버리셨습니다. 그들이 동방의 풍속으로 가득하고, 블레셋 사람들처럼 점을 치며, 이방인의 자녀들과 손을 잡기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동방에서’로도 옮길 수 있으나, 문맥상 동방에서 유래한 관습이나 영향으로 이해하는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 블레셋 사람들처럼 복술을 행합니다’.
    reason: lexical_alternative
  - marker: c
    text: 희귀한 동사로, ‘손을 잡다’, ‘합의하다’, ‘결합하다’ 등으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  english_pob_choice: have forsaken
  chosen_korean: 버리셨습니다
  alternatives_korean:
  - 떠나셨습니다
  - 버리셨습니다
  - 버려 두셨습니다
  lexicon: HALOT
  rationale: 언약적 질책의 뉘앙스를 살리기 위해 단순한 ‘떠나다’보다 ‘버리다’ 계열이 더 직접적이며, 문맥상 주어는 하나님입니다.
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  english_pob_choice: your people, the house of Jacob
  chosen_korean: 주의 백성, 곧 야곱의 집
  alternatives_korean:
  - 주의 백성, 야곱의 집
  - 주의 백성, 곧 이스라엘의 집
  lexicon: HALOT
  rationale: 병렬 구조를 살려 ‘주의 백성’과 ‘야곱의 집’을 구분해 옮기되, 히브리어가 실제로 ‘야곱’을 쓰므로 그 명칭을 유지했습니다.
- source_word: מִקֶּדֶם
  english_pob_choice: eastern ways
  chosen_korean: 동방의 풍속
  alternatives_korean:
  - 동쪽에서 온 것들
  - 동방의 관습
  - 동방의 영향
  lexicon: HALOT
  rationale: 직역하면 ‘동쪽에서’이지만, 문맥상 외래적 생활양식·관습을 가리키는 것으로 보여 한국어에서는 ‘풍속’으로 의미를 드러냈습니다.
- source_word: עֹנְנִים
  english_pob_choice: practice divination
  chosen_korean: 점을 치며
  alternatives_korean:
  - 주술을 행하며
  - 점술을 행하며
  - 예언을 가장하며
  lexicon: HALOT
  rationale: עונן은 점치기/복술에 해당하므로, 독자가 즉시 이해할 수 있는 표준 한국어 표현으로 옮겼습니다.
- source_word: וּבְיַלְדֵי נָכְרִים יַשְׂפִּיקוּ
  english_pob_choice: and they strike hands with the children of foreigners
  chosen_korean: 이방인의 자녀들과 손을 잡기 때문입니다
  alternatives_korean:
  - 이방인의 자녀들과 손을 맞잡기 때문입니다
  - 이방인의 자녀들과 결탁하기 때문입니다
  - 이방인의 자녀들과 협약을 맺기 때문입니다
  lexicon: HALOT
  rationale: 희귀 동사의 구체적 의미가 확정적이지 않으므로, POB의 ‘strike hands with’에 대응해 가장 문자적인 ‘손을 잡다’를 취하되, 한국어에서는 교제/동맹의 가능성을 남겼습니다.
theological_decisions:
- issue: 외래 문화와 이방인에 대한 비난의 범위
  chosen_reading: 본문은 민족 자체를 정죄하기보다, 이스라엘이 동방의 관습과 점치는 행위, 그리고 이방인과의 부적절한 연합에 빠졌다는 고발로 읽었습니다.
  alternative_readings:
  - 이방인을 향한 일반적 민족 비난으로 읽을 수 있습니다.
  - 마지막 절은 더 구체적으로 외국인과의 조약 체결을 가리킬 수 있습니다.
  rationale: 예언자적 책망의 초점은 정체성 혼합과 종교적 타협에 있으므로, 한국어 번역도 그 윤리적·종교적 긴장을 드러내고 민족주의적 오독을 피해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
