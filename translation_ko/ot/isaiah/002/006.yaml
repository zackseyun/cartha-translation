    text: 직역하면 ‘동방에서’입니다. 문맥상 동방에서 유래한 관습이나 영향을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 블레셋 사람들처럼 복술을 행합니다’.
    reason: lexical_alternative
  - marker: c
    text: 희귀한 동사로, ‘손을 맞잡다’, ‘합의하다’, ‘결합하다’ 등으로 이해할 수 있습니다.
    reason: alternative_reading
