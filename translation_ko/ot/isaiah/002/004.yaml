id: ISA.2.4
reference: Isaiah 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
  footnotes:
  - marker: a
    text: Or 'rebuke many peoples' / 'arbitrate for many peoples.' The Hebrew verb can carry judicial or corrective force.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will no longer learn war.' The Hebrew is literally 'they will not learn war anymore.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여러 나라 사이를 심판하시며 많은 백성을 위해 판결하실 것입니다[a]. 그들이 자기들의 칼을 보습으로, 자기들의 창을 전정용 갈고리로 쳐 바꿀 것입니다. 나라가 나라를 향해 다시는 칼을 들지 않을 것이며[b], 그들은 다시는 전쟁을 배우지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 백성을 책망하실 것입니다’ / ‘많은 백성을 위해 판결하실 것입니다.’ 히브리어 동사는 재판적 또는 교정적 힘을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들은 더 이상 전쟁을 배우지 않을 것입니다.’ 히브리어는 문자적으로 ‘그들은 다시는 전쟁을 배우지 않을 것입니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  english_pob_choice: he will judge
  chosen_korean: 심판하시며
  alternatives_korean:
  - 판단하시며
  - 다스리시며
  lexicon: HALOT
  rationale: שׁפט의 재판적 의미를 살리면서, 문맥상 나라들 사이의 분쟁을 공의롭게 처리하는 뜻을 자연스럽게 드러내기 위해 ‘심판하시며’로 옮겼습니다.
- source_word: בֵּין הַגּוֹיִם
  english_pob_choice: between the nations
  chosen_korean: 여러 나라 사이를
  alternatives_korean:
  - 나라들 사이를
  - 나라들 가운데
  lexicon: HALOT
  rationale: בֵּין은 ‘사이/사이에서’의 뜻이므로, 국제적 분쟁의 장면을 살려 ‘여러 나라 사이를’로 옮겼습니다.
- source_word: וְהוֹכִיחַ לְעַמִּים רַבִּים
  english_pob_choice: arbitrate for many peoples
  chosen_korean: 많은 백성을 위해 판결하실 것입니다
  alternatives_korean:
  - 많은 백성에 대해 책망하실 것입니다
  - 많은 백성의 분쟁을 중재하실 것입니다
  lexicon: HALOT
  rationale: יכח의 문맥상 의미를 단순한 ‘책망’보다 판결·중재의 공적 기능으로 보아, 영어 POB의 ‘arbitrate’에 맞게 법정적 뉘앙스를 살렸습니다.
- source_word: לְאִתִּים / לְמַזְמֵרוֹת
  english_pob_choice: into plowshares / into pruning hooks
  chosen_korean: 보습으로 / 전정용 갈고리로
  alternatives_korean:
  - 쟁기로 / 전정칼로
  - 쟁기날로 / 가지치기 갈고리로
  lexicon: HALOT
  rationale: 농기구 이미지의 상징성을 유지하되, 현대 한국어에서도 이해 가능한 구체적 도구명으로 옮겼습니다. ‘보습’은 전통적이지만 정확한 대응어이고, ‘전정용 갈고리’는 원문의 농업적 대비를 분명히 합니다.
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  english_pob_choice: and they will not learn war anymore
  chosen_korean: 그들은 다시는 전쟁을 배우지 않을 것입니다
  alternatives_korean:
  - 그들은 더 이상 전쟁을 배우지 않을 것입니다
  - 그들은 다시는 전쟁을 익히지 않을 것입니다
  lexicon: HALOT
  rationale: למד מלחמה의 직역성을 살리되 한국어로 자연스럽게 들리도록 ‘전쟁을 배우다’로 유지했습니다.
theological_decisions:
- issue: 본문의 주체를 명시할 것인지
  chosen_reading: 3인칭 단수 주어를 ‘그’로 유지하고, 본문 안에서 구체적 주어를 덧붙이지 않았습니다.
  alternative_readings:
  - 여호와께서 심판하시며
  - 주님께서 심판하시며
  rationale: 히브리어는 주어를 생략한 3인칭 단수 동사형을 사용하므로, 문맥상 이해는 가능하더라도 본문 자체의 여지를 보존하기 위해 인칭 대명사 수준에서만 드러냈습니다.
  doctrine_reference: 문맥적 지시를 존중하고, 본문이 직접 말하지 않은 식별을 과도하게 확정하지 않습니다.
