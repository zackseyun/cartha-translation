    rationale: 기존 각주의 두 번째 선택지는 본문과 같은 ‘많은 백성을 위해 판결’이라 대안 기능이 약하며, ‘위해’의 의미 문제도 반복합니다. 책망과 중재라는 실제 어휘 범위를 제시하도록 고쳤습니다.
