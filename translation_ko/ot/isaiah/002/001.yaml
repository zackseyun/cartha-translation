id: ISA.2.1
reference: Isaiah 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
  footnotes:
  - marker: a
    text: Or 'The message' or 'The matter.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'saw'; a standard prophetic expression for receiving revelation in vision.
    reason: cultural_note
translation:
  language: ko
  text: 아모스의 아들 이사야가 유다와 예루살렘에 관해 본 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘보다’는 예언자가 계시를 받는 표준적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언문 서두에서 דָּבָר는 단순한 ‘말’보다 하나님의 전달된 ‘말씀’으로 읽는 것이 자연스럽고, POB의 ‘the word’를 한국어 성경 문체로 가장 직접적으로 옮깁니다.
- source_word: חָזָה
  english_pob_choice: saw
  chosen_korean: 본
  alternatives_korean:
  - 환상으로 본
  - 받아 본
  - 예언한
  lexicon: HALOT
  rationale: 히브리어의 ‘보다’라는 동사 자체를 살려, 예언적 계시의 방식을 해설적으로 풀지 않고 그대로 드러냈습니다.
- source_word: עַל
  english_pob_choice: concerning
  chosen_korean: 관해
  alternatives_korean:
  - 대하여
  - against
  - 에 대한
  lexicon: HALOT
  rationale: 이 표제에서 עַל은 심판만을 뜻하는 ‘against’보다 예언의 주제를 넓게 가리키는 ‘관해’가 더 정확하며, 뒤이어 나올 내용의 긴장을 미리 닫지 않습니다.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  english_pob_choice: Judah and Jerusalem
  chosen_korean: 유다와 예루살렘
  alternatives_korean:
  - 유다와 예루살렘에 대하여
  - 유다와 예루살렘을 향하여
  lexicon: HALOT
  rationale: 지명은 통용되는 표기를 따르고, 표제의 대상 표시를 간결하게 유지했습니다.
theological_decisions:
- issue: 예언적 ‘보다’의 표현 유지
  chosen_reading: ‘본 말씀’으로 옮겨 예언자가 계시를 ‘보았다’는 원문 이미지를 유지했습니다.
  alternative_readings:
  - 예언한 말씀
  - 받은 말씀
  - 환상 가운데 받은 말씀
  rationale: חָזָה를 평범한 발화 행위로 바꾸면 예언적 계시의 형식이 약해지므로, 원문의 시각적·계시적 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עַל의 범위
  chosen_reading: ‘유다와 예루살렘에 관해’로 옮겨 심판과 회복을 모두 포함할 수 있는 표제의 범위를 열어 두었습니다.
  alternative_readings:
  - 유다와 예루살렘을 향해
  - 유다와 예루살렘에 대하여
  rationale: 이 절은 곧 이어질 예언의 전체 주제를 소개하므로, adversative한 ‘against’로 좁히지 않는 것이 본문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3
