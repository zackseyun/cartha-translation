  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א יִשְׁעֶ֔ה אֶל הַֽ/מִּזְבְּח֖וֹת מַעֲשֵׂ֣ה יָדָ֑י/ו וַ/אֲשֶׁ֨ר עָשׂ֤וּ אֶצְבְּעֹתָי/ו֙ לֹ֣א יִרְאֶ֔ה וְ/הָ/אֲשֵׁרִ֖ים וְ/הָ/חַמָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
  footnotes:
  - marker: a
    text: Or 'Asherah poles.' The Hebrew term refers to cult objects associated with Asherah worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'sun-pillars' or 'sun images.' The Hebrew term likely refers to a pagan cult object; its precise form is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 손으로 만든 제단들을 바라보지 않을 것이며, 자기 손가락으로 만든 것들, 곧 아세림[a]과 하만님[b]을 돌아보지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 아세림(אֲשֵׁרִים)은 아세라 숭배와 관련된 제의 물건을 가리킵니다. ‘아세라 기둥들’ 또는 ‘아세라 목상들’로 번역하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하만님(הַחַמָּנִים)은 정확한 형태가 불확실한 제의 물건입니다. ‘태양 기둥들’, ‘태양상들’, 또는 ‘향 제단들’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  english_pob_choice: will look to
  chosen_korean: 바라보지 않을 것입니다
  alternatives_korean:
  - 주목하지 않을 것입니다
  - 돌아보지 않을 것입니다
  - 쳐다보지 않을 것입니다
  lexicon: HALOT
  rationale: 단순한 시각 행위가 아니라 의지와 관심을 두는 ‘look to’의 뉘앙스를 한국어로 자연스럽게 옮기기 위해 ‘바라보다’보다 결합된 의미를 살려 ‘바라보지 않다’로 옮겼습니다.
- source_word: הַמִּזְבְּחוֹת
  english_pob_choice: the altars
  chosen_korean: 제단들
  alternatives_korean:
  - 그 제단들
  - 제단
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 ‘제단들’로 옮겼고, 우상 숭배와 연결되는 대상임을 뒤의 ‘손의 작품’이 드러내므로 불필요한 수식은 덧붙이지 않았습니다.
- source_word: מַעֲשֵׂה יָדָיו / עָשׂוּ אֶצְבְּעֹתָיו
  english_pob_choice: the work of his hands / what his fingers have made
  chosen_korean: 그의 손의 작품 / 그의 손가락들이 만든 것
  alternatives_korean:
  - 그의 손으로 만든 것
  - 손으로 만든 작품
  - 그의 손가락으로 만든 것
  lexicon: HALOT
  rationale: 손과 손가락이라는 반복적 강조를 살려 우상 제작의 인위성과 세밀함을 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세라들
  - 아세라 목상들
  - 아세라 기둥들
  lexicon: HALOT
  rationale: POB가 본문에서는 구체적 물체를 그대로 드러내되 각주로 대안을 제시한 점을 따라, 한국어 본문에는 독자가 우상 숭배 대상임을 즉시 이해할 수 있도록 ‘상들’을 택했습니다.
- source_word: הַחַמָּנִים
  english_pob_choice: the incense altars
  chosen_korean: 향단들
  alternatives_korean:
  - 향 제단들
  - 태양 기둥들
  - 태양상들
  lexicon: HALOT
  rationale: 이 어려운 культ 용어는 영어 POB의 본문 선택을 따라 ‘향단들’로 옮겨, 본문은 간결하게 유지하고 의미 범위의 불확실성은 별도 각주 없이 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 우상 숭배 대상의 번역 방식
  chosen_reading: 본문에서는 추상적 ‘우상들’로 일반화하지 않고, 제단·아세라 상·향단처럼 구체적 물체를 드러내어 선지자의 비판을 직접 보이게 했습니다.
  alternative_readings:
  - 우상들로 번역하기
  - 기둥들/목상들로 세분하기
  rationale: 히브리어가 실제 숭배 기구들을 나열하는 구조이므로, 본문에서 대상의 물질성과 제작성을 유지하는 것이 원문의 공격성을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
