source:
  edition: WLC
  text: וְ/הָיָ֗ה כֶּֽ/אֱסֹף֙ קָצִ֣יר קָמָ֔ה וּ/זְרֹע֖/וֹ שִׁבֳּלִ֣ים יִקְצ֑וֹר וְ/הָיָ֛ה כִּ/מְלַקֵּ֥ט שִׁבֳּלִ֖ים בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
  footnotes:
  - marker: a
    text: Or 'heads of grain' for 'ears.'
    reason: lexical_alternative
  - marker: b
    text: Rephaim is a place name; alternatively, the name has been connected with 'giants.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 사람이 추수 때에 서 있는 곡식을 거두어들이고 그의 팔이 이삭[a]을 베는 때와 같을 것이며, 르바임[b] 골짜기에서 이삭을 줍는 때와 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이삭’은 여기서 곡식 이삭을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 르바임은 지명이며, ‘거인들’과 연결해 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף קָצִיר קָמָה
  english_pob_choice: as when one gathers standing grain at harvest
  chosen_korean: 추수 때에 서 있는 곡식을 거두어들이는 것
  alternatives_korean:
  - 추수할 때 서 있는 곡식을 모으는 것
  - 거둘 때 서 있는 곡식을 거두는 것
  lexicon: HALOT
  rationale: 비교구문으로서의 ‘~할 때/처럼’ 의미와 함께, 아직 베지 않은 곡식을 수확기에 거두는 장면을 한국어로 자연스럽게 살렸습니다.
- source_word: וּזְרֹעוֹ שִׁבֳּלִים יִקְצוֹר
  english_pob_choice: and his arm reaps the ears
  chosen_korean: 그의 팔로 이삭을 거두는 것
  alternatives_korean:
  - 그의 팔이 이삭을 베는 것
  - 그의 팔로 곡식 이삭을 거두는 것
  lexicon: HALOT
  rationale: 히브리어의 ‘팔’ 이미지를 그대로 유지해 수확 동작의 생생함을 살렸고, שִׁבֳּלִים은 농경 문맥에 맞게 ‘이삭’으로 옮겼습니다.
- source_word: כִּמְלַקֵּט שִׁבֳּלִים
  english_pob_choice: as when one gleans ears
  chosen_korean: 마치 … 이삭을 줍는 것
  alternatives_korean:
  - 마치 … 이삭을 거두어 줍는 것
  - 마치 … 떨어진 이삭을 줍는 것
  lexicon: HALOT
  rationale: לקט의 전문적 의미인 ‘이삭 줍기’를 살려, 남겨진 것을 주워 모으는 뉘앙스를 유지했습니다.
- source_word: בְּעֵמֶק רְפָאִים
  english_pob_choice: in the Valley of Rephaim
  chosen_korean: 르바임 골짜기
  alternatives_korean:
  - 레파임 골짜기
  - 거인들의 골짜기
  lexicon: HALOT
  rationale: 지명은 음역을 우선해 ‘르바임 골짜기’로 옮겼고, 해석적 번역인 ‘거인들의 골짜기’는 본문이 요구하는 범위를 넘어선다고 보았습니다.
theological_decisions:
- issue: 'רְפָאִים의 처리: 지명인가, 의미 해석인가'
  chosen_reading: 지명으로 보고 ‘르바임 골짜기’로 음역했습니다.
  alternative_readings:
  - 거인들의 골짜기
  - 레파임 골짜기
  rationale: 문맥상 전투·지리적 비유 안의 지명으로 읽는 것이 자연스럽고, POB의 이름 음역 원칙과도 맞습니다.
  doctrine_reference: 'Translation philosophy: Translate titles; transliterate names.'
