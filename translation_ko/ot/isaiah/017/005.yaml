revisions:
- from: 그것은 마치 사람이 추수 때에 서 있는 곡식을 거두어들이는 것과 같고, 그의 팔로 이삭을 거두는 것과 같으며, 마치 르바임 골짜기에서 이삭을 줍는 것과 같을 것입니다.[a][b]
  to: 그것은 사람이 추수 때에 서 있는 곡식을 거두어들이고 그의 팔이 이삭[a]을 베는 때와 같을 것이며, 르바임[b] 골짜기에서 이삭을 줍는 때와 같을 것입니다.
  rationale: 첫 절의 수확 행위를 원문의 단일 비교 장면으로 연결하고, ‘팔’을 주어로 보존했습니다. 또한 각주 표지를 해당 어휘에 직접 배치했습니다. 지명 음역과 이삭 줍기라는 농경 용어는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:39Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 비교 표현과 추수·이삭 줍기 이미지는 대체로 보존되었습니다. 다만 첫 비교절에서 ‘것과 같고’를 거듭 사용하여 원문의 ‘곡식을 거두고 그의 팔이 이삭을 벤다’라는 하나의 장면을 불필요하게 둘로 나누었고, ‘그의 팔로’는 원문의 주어인 ‘그의 팔’을 도구 표현으로 바꿉니다.
  naturalness: ‘그것은’은 문맥상 가능하지만, 비교절을 한 장면으로 연결해 ‘…거두어들이고 그의 팔이 이삭을 베는 때와 같을 것이며’로 옮기면 현대 표준 한국어로 더 자연스럽고 명료합니다. ‘이삭을 줍다’와 ‘르바임 골짜기’는 자연스럽습니다.
  terminology: קָמָה는 ‘서 있는 곡식’, שִׁבֳּלִים은 ‘이삭’, לקט는 ‘이삭을 줍다’로 적절합니다. רְפָאִים은 지명으로 ‘르바임’이라 음역하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 첫 비교절의 병렬 구조가 원문보다 분절됨
    rationale: וּזְרֹעוֹ שִׁבֳּלִים יִקְצוֹר는 첫 수확 장면 안에서 ‘그의 팔이 이삭을 벤다’고 이어지는데, 초안은 ‘것과 같고 … 것과 같으며’로 두 개의 독립 비교처럼 만들었습니다.
  - severity: low
    issue: ‘그의 팔로’가 원문의 주어 표현을 도구 표현으로 변경함
    rationale: 히브리어는 문자적으로 ‘그의 팔이 이삭들을 벤다’라고 하므로, 한국어에서도 팔을 주어로 유지하면 생생한 신체 이미지와 문장 구조가 보존됩니다.
  - severity: medium
    issue: 각주의 표지가 관련 어휘에 붙어 있지 않음
    rationale: ‘이삭’ 관련 어휘 각주와 ‘르바임’ 지명 각주는 각각 해당 단어 바로 뒤에 붙여 독자가 각주의 대상을 분명히 알 수 있게 해야 합니다.
  revised_text: 그것은 사람이 추수 때에 서 있는 곡식을 거두어들이고 그의 팔이 이삭[a]을 베는 때와 같을 것이며, 르바임[b] 골짜기에서 이삭을 줍는 때와 같을 것입니다.
  revised_footnotes:
