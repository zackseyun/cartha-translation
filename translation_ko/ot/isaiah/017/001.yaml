id: ISA.17.1
reference: Isaiah 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א דַּמָּ֑שֶׂק הִנֵּ֤ה דַמֶּ֨שֶׂק֙ מוּסָ֣ר מֵ/עִ֔יר וְ/הָיְתָ֖ה מְעִ֥י מַפָּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
  footnotes:
  - marker: a
    text: Or 'burden concerning Damascus' or 'pronouncement concerning Damascus.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'removed from a city,' that is, it will cease to be a city.
    reason: lexical_alternative
translation:
  language: ko
  text: 다마스쿠스에 관한 경고입니다. 보십시오[a], 다마스쿠스는 도시[b]에서 물러나게 되고, 무너진 폐허가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다마스쿠스에 대한 무거운 선고’ 또는 ‘다마스쿠스에 대한 선포’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘도시에서’, 곧 도시로서의 지위를 잃는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 경고
  alternatives_korean:
  - 예언
  - 신탁
  - 오라클
  lexicon: HALOT
  rationale: 예언서 머리말의 מַשָּׂא는 주로 심판적 선고를 여는 표지이므로, 현대 한국어에서 자연스럽고 문맥상 무게를 살리는 ‘경고’로 옮겼습니다.
- source_word: דַּמָּשֶׂק
  english_pob_choice: Damascus
  chosen_korean: 다마스쿠스
  alternatives_korean:
  - 다메섹
  lexicon: 표준 외래어 표기
  rationale: 지명 고유명사는 현대 한국어 표기 관행에 따라 ‘다마스쿠스’로 적었습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보소서
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 선포의 주의를 환기하는 감탄사로서, 격식을 유지하면서도 현대 한국어에서 자연스러운 ‘보십시오’를 택했습니다.
- source_word: מוּסָר מֵעִיר
  english_pob_choice: will be removed from being a city
  chosen_korean: 도시에서 물러나게 되고
  alternatives_korean:
  - 도시로서 사라지게 되고
  - 도시의 지위를 잃게 되고
  - 도시가 아닌 것이 되고
  lexicon: HALOT
  rationale: 문자적으로는 ‘도시에서 벗어나다/물러나다’의 뜻이지만, 문맥상 도시로서의 정체성을 상실하는 결과를 가리키므로 ‘도시에서 물러나게’로 옮겨 그 상태 변화를 드러냈습니다.
- source_word: מְעִי מַפָּלָה
  english_pob_choice: a heap of ruins
  chosen_korean: 무너진 폐허
  alternatives_korean:
  - 폐허 더미
  - 붕괴의 무더기
  - 무너진 더미
  lexicon: HALOT
  rationale: ‘무더기/언덕’의 이미지와 ‘붕괴·폐허’의 의미를 함께 살리되, 현대 한국어에서 자연스럽고 강한 파괴상을 주는 ‘무너진 폐허’로 압축했습니다.
theological_decisions:
- issue: 예언 서문의 어조
  chosen_reading: 문두의 מַשָּׂא를 단순한 제목이 아니라 심판을 예고하는 선포로 읽어, ‘경고입니다’로 번역했습니다.
  alternative_readings:
  - ‘다마스쿠스에 관한 신탁입니다’
  - ‘다마스쿠스에 대한 예언입니다’
  rationale: 이 절은 독자에게 다가오는 심판을 알리는 예언적 표제이므로, 한국어에서도 선언성과 경고성을 분명히 드러내는 것이 본문 효과에 더 가깝습니다.
  doctrine_reference: 예언서 표제의 기능과 심판 선언의 수사
- issue: 도시의 소멸 표현
  chosen_reading: ‘도시에서 물러나게’로 옮겨, 다마스쿠스가 단지 훼손되는 정도가 아니라 도시로서의 지위를 상실함을 나타냈습니다.
  alternative_readings:
  - ‘도시가 되지 못하게’
  - ‘도시의 형체를 잃게’
  rationale: 히브리어는 단순한 물리적 파괴보다 도시성의 상실을 말하므로, 결과적 상태 변화를 분명히 표현했습니다.
  doctrine_reference: 심판 예언의 종말론적 도시 해체 이미지
