base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
  footnotes:
  - marker: a
    text: Or 'The cities of Aroer are forsaken' or 'deserted.'
    reason: lexical_alternative
  - marker: b
    text: '''Flocks'' may also be rendered ''herds''; the sense is that abandoned settlements become grazing places for animals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아로엘의 성읍들은 버려질 것이며[a], 가축 떼를 위한 곳이 되어[b], 그 떼가 누워 있어도 아무도 그것들을 두렵게 하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버림받은’ 또는 ‘버려진’.
    reason: lexical_alternative
  - marker: b
    text: ‘가축 떼’는 ‘양떼’ 또는 ‘떼’로도 옮길 수 있습니다. 버려진 정착지가 동물들이 풀을 뜯고 쉬는 곳이 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  english_pob_choice: abandoned
  chosen_korean: 버려졌습니다
  alternatives_korean:
  - 버려졌습니다
  - 황폐해졌습니다
  - 유기되었습니다
  lexicon: HALOT
  rationale: עזב의 수동적 상태를 자연스러운 현대 한국어로 옮기되, 단순한 ‘폐허’보다 ‘버려짐’의 의미를 살렸습니다.
- source_word: עָרֵי עֲרֹעֵר
  english_pob_choice: cities of Aroer
  chosen_korean: 아로엘의 성읍들
  alternatives_korean:
  - 아로엘의 도시들
  - 아로엘의 성읍들
  lexicon: HALOT
  rationale: 고유지명 עֲרֹעֵר는 한국어 성서 관용에 따라 아로엘로 음역하고, עָרֵי는 문맥상 ‘성읍들’로 옮겼습니다.
- source_word: לַעֲדָרִים
  english_pob_choice: for flocks
  chosen_korean: 떼를 위한 곳
  alternatives_korean:
  - 양떼를 위한 곳
  - 가축 떼를 위한 곳
  - 떼를 위한 곳
  lexicon: HALOT
  rationale: עֵדֶר는 목축 무리 전체를 가리킬 수 있어, ‘양떼’로 좁히기보다 ‘떼’로 넓게 옮겨 황폐한 성읍이 방목지로 바뀌는 이미지를 살렸습니다.
- source_word: וְאֵין מַחֲרִיד
  english_pob_choice: with no one to make them afraid
  chosen_korean: 아무도 그것들을 두렵게 하지 않을 것입니다
  alternatives_korean:
  - 아무도 그것들을 두렵게 하지 않을 것입니다
  - 그것들을 놀라게 할 자가 없을 것입니다
  - 그들을 두려워하게 할 사람이 없을 것입니다
  lexicon: HALOT
  rationale: 관용구적 표현을 직역하기보다, ‘두렵게 하다’로 안전과 방해 없음의 뜻을 분명히 드러냈습니다.
