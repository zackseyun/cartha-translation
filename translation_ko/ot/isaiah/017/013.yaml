id: ISA.17.13
reference: Isaiah 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
  footnotes:
  - marker: a
    text: Or 'the nations roar like the roaring of many waters.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew has singular forms ('he rebukes it ... it flees'), likely treating the many peoples as one collective mass or uproar.
    reason: alternative_reading
  - marker: c
    text: Or 'like a whirling thing' or 'like tumbleweed' before the storm.
    reason: lexical_alternative
  - marker: d
    text: '''Storm'' may also be rendered ''whirlwind'' or ''tempest.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 백성들은 많은 물의 요란한 소리처럼 소리치지만, 그분이 그것을 꾸짖으시면 그것은 멀리 달아나고, 산 위의 겨처럼 바람 앞에 쫓기며, 폭풍 앞의 소용돌이치는 먼지처럼 됩니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들이 많은 물의 요란한 소리처럼 소리친다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형(‘그것을 꾸짖으시면… 그것이 달아난다’)을 사용하여, 여러 백성을 하나의 집합적 소용돌이로 보는 듯합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘소용돌이치는 것처럼’ 또는 ‘도리깨풀처럼’.
    reason: lexical_alternative
  - marker: d
    text: ‘폭풍’은 ‘회오리’나 ‘폭풍우’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  english_pob_choice: the peoples
  chosen_korean: 백성들
  alternatives_korean:
  - 나라들
  - 민족들
  lexicon: HALOT
  rationale: 복수 집단을 가리키는 표현으로서, ‘백성들’은 정치적 국가성보다 사람들의 집합이라는 감각을 살리면서도 자연스럽게 읽힙니다.
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  english_pob_choice: like the roaring of many waters
  chosen_korean: 많은 물의 요란한 소리처럼 소리치지만
  alternatives_korean:
  - 많은 물의 포효처럼
  - 많은 물의 우렁찬 소리처럼
  lexicon: HALOT
  rationale: ‘שׁאון’의 강한 소음·요란함을 살리면서, 물 이미지와 결합된 청각적 격동을 한국어로 자연스럽게 옮겼습니다.
- source_word: וְרֻדַּף כְּמֹץ הָרִים לִפְנֵי רוּחַ
  english_pob_choice: chased like chaff on the mountains before the wind
  chosen_korean: 산 위의 겨처럼 바람 앞에 쫓기며
  alternatives_korean:
  - 산 위의 쭉정이처럼 바람 앞에 쫓기며
  - 산들의 겨처럼 바람 앞에 쫓기며
  lexicon: HALOT
  rationale: ‘מֹץ’의 대표적 대응어는 ‘겨’이며, 산 위라는 지리적 이미지를 그대로 살려 바람에 날리는 가벼움과 무력함을 전달합니다.
- source_word: וּכְגַלְגַּל לִפְנֵי סוּפָה
  english_pob_choice: like whirling dust before the storm
  chosen_korean: 폭풍 앞의 소용돌이치는 먼지처럼 됩니다
  alternatives_korean:
  - 폭풍 앞의 굴러가는 것처럼 됩니다
  - 폭풍 앞의 회오리처럼 됩니다
  lexicon: HALOT
  rationale: ‘גַּלְגַּל’은 바퀴처럼 구르며 휘도는 무언가를 가리킬 수 있어, 현대 한국어에서는 구체적 식물명보다 ‘소용돌이치는 먼지’가 시적 이미지와 유동성을 함께 살립니다.
theological_decisions:
- issue: 히브리어의 단수 동사와 대명사(וְגָעַר בּוֹ, וְנָס)의 처리
  chosen_reading: ‘그것’으로 옮겨, 열방의 소란을 하나의 집단적 소용돌이로 보는 단수-집합적 시각을 보존했습니다.
  alternative_readings:
  - 그들을 꾸짖으시면 그들은 멀리 달아나고
  - 그 소리를 꾸짖으시면 그 소리가 멀리 달아나고
  rationale: 본문은 복수 집단을 말하지만 단수로 다루는 시각을 사용하므로, 한국어에서도 이를 평탄화하지 않고 집합적 단수로 유지하는 것이 원문 긴장을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 집합적 단수의 수사적 효과 보존
