  lexicon: HALOT
  rationale: ‘מֹץ’의 대표적 대응어는 ‘겨’이며, 산 위라는 지리적 이미지를 그대로 살려 바람에 날리는 가벼움과 무력함을 전달합니다.
- source_word: וּכְגַלְגַּל לִפְנֵי סוּפָה
