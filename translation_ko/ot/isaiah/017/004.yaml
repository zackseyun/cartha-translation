  source_fidelity: 히브리어의 시간 표현, ‘야곱’, 영광의 감소, 그리고 육체의 기름짐이 여위는 병행 이미지는 유지되어야 합니다. 초안의 ‘가늘어지고’는 יִדַּל의 가능한 신체적 뉘앙스를 반영하려는 장점이 있으나, ‘영광’의 주어와 결합할 때 한국어에서 부자연스럽고 의미가 불명확합니다. ‘줄어들고’는 감소·쇠약의 의미를 자연스럽게 보존합니다. יֵרָזֶה는 단순한 일반적 ‘쇠함’보다 여윔/마름의 신체 이미지를 드러내는 편이 더 가깝습니다.
