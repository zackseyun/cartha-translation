  - 여위게 될 것입니다
  - 야위게 될 것입니다
  lexicon: HALOT
  rationale: 결과 상태를 현대 한국어로 자연스럽게 옮기되, 원문의 ‘마름/쇠함’ 의미를 유지했습니다.
theological_decisions:
- issue: ‘야곱’의 보존 여부
  chosen_reading: 본문의 인명 ‘야곱’을 그대로 유지하여, 이스라엘 민족을 가리키는 언약적 이름의 울림을 보존했습니다.
  alternative_readings:
  - 이스라엘
  - 야곱의 집
  rationale: 히브리어가 실제로 ‘야곱’을 사용하므로, 해석어로 대체하지 않고 예언적·언약적 호칭을 그대로 살리는 것이 더 충실합니다.
  doctrine_reference: 언약 명칭의 보존과 본문 직역 우선 원칙
- issue: 육체적 비유의 직역
  chosen_reading: ‘살의 기름진 것’과 ‘쇠하다’의 물리적 이미지를 유지했습니다.
  alternative_readings:
  - 부요함
  - 번영
  - 힘
  rationale: 본문은 추상적 번영보다 신체적 쇠약을 통해 심판을 묘사하므로, 비유를 완화하지 않고 그대로 드러내는 것이 해석상 중요합니다.
  doctrine_reference: 예언서의 심판 이미지 보존
