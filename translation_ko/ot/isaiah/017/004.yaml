source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִדַּ֖ל כְּב֣וֹד יַעֲקֹ֑ב וּ/מִשְׁמַ֥ן בְּשָׂר֖/וֹ יֵרָזֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
  footnotes:
  - marker: a
    text: Or 'will be diminished.' The Hebrew verb can denote becoming small, weak, or thin; the translation 'grow thin' follows the bodily imagery of the next line.
    reason: lexical_alternative
  - marker: b
    text: Or 'the richness of his body will become lean.' The Hebrew uses physical imagery of fatness and leanness to portray Jacob's loss of strength and prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 야곱의 영광이 가늘어지고, 그의 살의 기름진 것이 쇠하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가늘어지다’는 여기서 ‘작아지다, 약해지다, 줄어들다’의 뜻으로도 이해할 수 있습니다. 다음 행의 ‘쇠하게 될 것입니다’와 나란히 놓인 육체적 이미지를 살려 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 살의 기름진 것’은 문자적으로는 ‘살의 풍성함/비대한 상태’에 가깝습니다. 여기서는 신체적 풍요와 힘의 상실을 함께 드러내기 위해 ‘기름진 것’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그때에
  - 그 날에
  lexicon: HALOT
  rationale: 예언문맥의 관용구를 자연스럽게 살리면서도, 원문의 시간 지시를 간결하게 보존했습니다.
- source_word: יִדַּל
  english_pob_choice: will grow thin
  chosen_korean: 가늘어지고
  alternatives_korean:
  - 쇠약해지고
  - 작아지고
  - 줄어들고
  lexicon: HALOT
  rationale: ‘얇아지다/가늘어지다’는 신체적 이미지를 살려 다음 절의 육체적 비유와 대응시키며, 단순한 추상어보다 원문의 감각을 더 잘 반영합니다.
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 영화
  - 위엄
  lexicon: HALOT
  rationale: 문맥상 야곱의 국력·위세·명성을 아우를 수 있는 표준 번역으로, 예언적 심판의 상실감을 유지합니다.
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  english_pob_choice: the fatness of his flesh
  chosen_korean: 그의 살의 기름진 것이
  alternatives_korean:
  - 그의 몸의 기름진 것이
  - 그의 육신의 풍성함이
  lexicon: HALOT
  rationale: ‘기름진 것’은 원문의 육체적 풍요/비대 이미지를 그대로 살리고, ‘살’은 בָּשָׂר의 구체성을 보존합니다.
- source_word: יֵרָזֶה
  english_pob_choice: will waste away
  chosen_korean: 쇠하게 될 것입니다
  alternatives_korean:
  - 마르게 될 것입니다
  - 여위게 될 것입니다
  - 야위게 될 것입니다
  lexicon: HALOT
  rationale: 결과 상태를 현대 한국어로 자연스럽게 옮기되, 원문의 ‘마름/쇠함’ 의미를 유지했습니다.
theological_decisions:
- issue: ‘야곱’의 보존 여부
  chosen_reading: 본문의 인명 ‘야곱’을 그대로 유지하여, 이스라엘 민족을 가리키는 언약적 이름의 울림을 보존했습니다.
  alternative_readings:
  - 이스라엘
  - 야곱의 집
  rationale: 히브리어가 실제로 ‘야곱’을 사용하므로, 해석어로 대체하지 않고 예언적·언약적 호칭을 그대로 살리는 것이 더 충실합니다.
  doctrine_reference: 언약 명칭의 보존과 본문 직역 우선 원칙
- issue: 육체적 비유의 직역
  chosen_reading: ‘살의 기름진 것’과 ‘쇠하다’의 물리적 이미지를 유지했습니다.
  alternative_readings:
  - 부요함
  - 번영
  - 힘
  rationale: 본문은 추상적 번영보다 신체적 쇠약을 통해 심판을 묘사하므로, 비유를 완화하지 않고 그대로 드러내는 것이 해석상 중요합니다.
  doctrine_reference: 예언서의 심판 이미지 보존
