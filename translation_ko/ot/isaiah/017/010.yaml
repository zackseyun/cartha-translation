id: ISA.17.10
reference: Isaiah 17:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
  footnotes:
  - marker: a
    text: Or 'choice plantings'; possibly an allusion to cultivated plants used in foreign religious practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'a strange cutting' or 'an alien shoot.'
    reason: lexical_alternative
  - marker: c
    text: The agricultural imagery may imply reliance on foreign cults or alliances rather than on the LORD, but the Hebrew does not state this explicitly.
    reason: cultural_note
translation:
  language: ko
  text: 이는 당신이 구원의 하나님을 잊고, 당신의 피난처의 바위도 기억하지 않았기 때문입니다. 그러므로 당신은 아름다운 식물을 심고, 외국 포도나무를 심습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘선택된 식물들’로도 옮길 수 있으며, 외국 종교 관행에 쓰이던 재배 식물을 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘낯선 순’ 또는 ‘이방의 새순’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 이 농업 이미지는 야훼 대신 외국의 제의나 동맹에 의지하는 뜻을 시사할 수 있지만, 히브리어는 이를 분명히 말하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  english_pob_choice: the God of your salvation
  chosen_korean: 당신의 구원의 하나님
  alternatives_korean:
  - 당신을 구원하시는 하나님
  - 당신의 구원하시는 하나님
  lexicon: HALOT
  rationale: 속격 연쇄를 자연스럽게 살리면서 יֵשַׁע의 명사적 의미인 ‘구원’을 보존했습니다.
- source_word: צוּר מָעֻזֵּךְ
  english_pob_choice: the Rock of your refuge
  chosen_korean: 당신의 피난처의 바위
  alternatives_korean:
  - 당신의 피난처이신 반석
  - 당신의 견고한 피난처
  lexicon: HALOT
  rationale: צוּר의 핵심 은유인 ‘바위/반석’을 유지하고, מָעוֹז의 보호 의미는 ‘피난처’로 옮겼습니다.
- source_word: נִטְעֵי נַעֲמָנִים
  english_pob_choice: pleasant plants
  chosen_korean: 아름다운 식물
  alternatives_korean:
  - 즐거운 식물
  - 고운 식물
  lexicon: HALOT
  rationale: 문맥상 식재의 외형적/미학적 선호를 가리키는 표현으로 보고, 과도한 해석을 피하면서 한국어로 자연스럽게 옮겼습니다.
- source_word: זְמֹרַת זָר
  english_pob_choice: a foreign vine
  chosen_korean: 외국 포도나무
  alternatives_korean:
  - 이방의 포도나무
  - 낯선 가지
  lexicon: HALOT
  rationale: זְמֹרָה의 포도나무/덩굴 이미지와 זָר의 ‘외부의, 낯선’ 의미를 함께 살렸습니다.
theological_decisions:
- issue: 농업 이미지에 내포된 우상숭배/외교 의존 가능성의 처리
  chosen_reading: 본문에는 농업적 이미지를 그대로 두고, 우상숭배나 외국 종교 관행을 단정적으로 명시하지 않았습니다.
  alternative_readings:
  - ‘아름다운 식물’과 ‘외국 포도나무’를 이방 제의용 식재에 대한 암시로 명시
  rationale: 히브리어는 그 가능성을 열어 두지만, 본문 자체는 암시적입니다. 원문의 긴장을 유지하기 위해 मुख्य ტექ스트에서는 해석을 확정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
