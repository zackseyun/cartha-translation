id: ISA.17.10
reference: Isaiah 17:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
  footnotes:
  - marker: a
    text: Or 'choice plantings'; possibly an allusion to cultivated plants used in foreign religious practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'a strange cutting' or 'an alien shoot.'
    reason: lexical_alternative
  - marker: c
    text: The agricultural imagery may imply reliance on foreign cults or alliances rather than on the LORD, but the Hebrew does not state this explicitly.
    reason: cultural_note
translation:
  language: ko
  text: 이는 당신이 구원의 하나님을 잊고, 당신의 요새이신 반석을 기억하지 않았기 때문입니다. 그러므로 당신은 아름다운 식물들을 심고[a], 이방 포도나무를 심습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘선택된 식물들’. 외국 종교 관행에 쓰이던 재배 식물을 가리킬 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낯선 순’ 또는 ‘이방의 새순’.
    reason: lexical_alternative
  - marker: c
    text: 이 농업 이미지는 야훼 대신 외국의 제의나 동맹에 의지하는 일을 시사할 수 있지만, 히브리어는 이를 분명히 말하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  english_pob_choice: the God of your salvation
  chosen_korean: 당신의 구원의 하나님
  alternatives_korean:
