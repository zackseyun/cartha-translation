reference: Isaiah 17:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
  footnotes:
  - marker: a
    text: Or 'two or three olives ... four or five among its boughs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 남아 있는 것은 감람나무를 떨었을 때 남는 이삭과 같을 것입니다[ [a] ] — 가장 높은 가지 끝에 두세 개 남고, 열매 많은 가지들에 네다섯 개 남을 것입니다. 야훼, 이스라엘의 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감람 열매 두세 개 … 가지들 가운데 네다섯 개.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַר
  english_pob_choice: Yet ... will be left
  chosen_korean: 그러나 남아 있는 것은
  alternatives_korean:
  - 그리고 남을 것은
  - 남아 있는 것은
  lexicon: HALOT
  rationale: נשׁאר의 ‘남다/남겨지다’ 의미를 살리되, 앞선 심판 맥락의 역접을 한국어 ‘그러나’로 드러냈습니다.
- source_word: עֹלֵלֹת
  english_pob_choice: gleanings
  chosen_korean: 이삭
  alternatives_korean:
  - 남은 열매
  - 거둬들이지 못한 것
  lexicon: HALOT
  rationale: 직역상 ‘이삭/남은 것’ 계열이 가능하지만, 포도/곡식이 아닌 감람나무 비유에서는 농경적 ‘남은 열매’보다 남겨진 조각이라는 이미지를 살려 간결하게 처리했습니다. 다만 본문은 뒤의 ‘두세 개 남는 작은 열매’와 연결되므로 주석적 여지는 남깁니다.
- source_word: כְּנֹקֶף זַיִת
  english_pob_choice: as when an olive tree is beaten
  chosen_korean: 감람나무를 떨었을 때
  alternatives_korean:
  - 감람나무를 쳤을 때
  - 감람나무를 두드렸을 때
  lexicon: HALOT
  rationale: נֹקֶף는 감람 수확 시 나무를 치거나 흔드는 행위를 가리키므로, 한국어에서는 자연스러운 농업 표현 ‘떨다’로 옮겼습니다.
- source_word: גַּרְגְּרִים
  english_pob_choice: berries
  chosen_korean: 두세 개
  alternatives_korean:
  - 열매 두세 개
  - 감람 열매 두세 개
  lexicon: HALOT
  rationale: 개별 작은 열매를 뜻하므로 수량 표현을 앞세워 자연스럽게 옮기고, 감람나무 문맥이므로 뒤의 비유 전체로 의미가 분명해지도록 했습니다.
- source_word: נְאֻם יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: declares Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님께서 말씀하십니다
  alternatives_korean:
  - 야훼, 이스라엘의 하나님이 선언하십니다
  - 야훼, 이스라엘의 하나님께서 선포하십니다
  lexicon: HALOT
  rationale: 예언 공식의 נאם은 한국어 예언체에서 ‘말씀하십니다’가 가장 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 전통 교회어보다 원어 재현성을 우선해 옮겼습니다. 예언 공식에서도 이를 유지해 문맥의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
