translation:
  language: ko
  text: 그날에 사람은 자기의 지으신 이를 바라보고, 그의 눈은 이스라엘의 거룩하신 이를 바라보게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그날에’는 예언서에서 흔한 관용적 시간 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 여기서 대표 단수로, 인류 일반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그날에는
  - 그날에
  lexicon: HALOT
  rationale: 예언서의 관용적 시간 표현을 한국어로 자연스럽게 옮기되, 문두의 종말론적·예언적 울림은 유지했습니다.
- source_word: יִשְׁעֶה ... עַל
  english_pob_choice: will look to
  chosen_korean: 바라보고
  alternatives_korean:
  - 기울이고
  - 돌이켜 보고
  - 바라보게 될 것입니다
  lexicon: HALOT
  rationale: שעה는 단순 시선보다 ‘돌리어 주의를 두다’의 뜻이므로, 한국어에서는 ‘바라보다’가 의미와 문맥을 가장 자연스럽게 살립니다. 반복되는 후행 절과의 평행을 위해 첫 절도 동일 계열 표현으로 맞췄습니다.
- source_word: עֹשֵׂהוּ
  english_pob_choice: his Maker
  chosen_korean: 자기의 지으신 이
  alternatives_korean:
  - 그를 지으신 분
  - 자기 창조주
  - 그의 만드신 분
  lexicon: HALOT
  rationale: עשה의 분사+목적어 접미사는 ‘그를 지으신 분’이 직역에 가깝지만, 한국어에서는 소유 관계를 살린 ‘자기의 지으신 이’가 더 압축적이고 시적입니다. 예언 문맥상 하나님을 가리키므로 존칭적 대명화는 피하되 경어체 서술로 보완했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩한 이
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  lexicon: HALOT
  rationale: 이사야서의 확립된 신적 칭호를 ‘거룩하신 이’로 번역해, 고유한 호칭성과 신성함을 유지했습니다. 전통 교회어인 ‘성자’는 본문이 지닌 직설적 호칭을 약화시킬 수 있어 피했습니다.
theological_decisions:
- issue: הָאָדָם의 대표 단수 처리
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 한 사람
  - 인류
  rationale: 히브리어는 단수형이지만 대표 단수로 기능하므로, 한국어에서도 단수형 ‘사람’을 유지해 보편성을 드러냈습니다. 성별 중립적 추상어보다 본문 형태를 더 가깝게 반영합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם adam
- issue: ‘보다/바라보다’의 반복 여부
  chosen_reading: 두 절 모두 ‘바라보다’ 계열로 통일
  alternative_readings:
  - 첫 절은 ‘의지하다’로 확장
  - 둘째 절만 ‘보다’로 축소
  rationale: 본문은 ‘돌아봄/주시함’의 평행법을 이루며, 신뢰나 회개를 명시하지 않습니다. 한국어에서도 같은 동사를 반복해 원문의 대구를 보존하고, 내포된 신학적 방향 전환은 과도하게 해석하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
