reference: Isaiah 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
  footnotes:
  - marker: a
    text: Or 'the upper branch' / 'the summit bough.' The Hebrew term refers to the topmost part of a tree.
    reason: lexical_alternative
  - marker: b
    text: Or 'which they abandoned because of the sons of Israel.' The Hebrew expression may indicate retreat from before Israel's presence.
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 그의 견고한 성읍들은 숲의 황폐한 곳과 나무 꼭대기[a]처럼 될 것입니다. 곧 그들이 이스라엘의 자손[b] 앞에서 버린 곳들입니다. 그리고 그것은 황폐함이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '윗가지' / '꼭대기 가지'. 히브리어 표현은 나무의 가장 높은 부분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '이스라엘의 자손 때문에'. 히브리어 표현은 이스라엘의 존재 앞에서 물러난 것을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי מָעֻזּוֹ
  english_pob_choice: his fortified cities
  chosen_korean: 그의 견고한 성읍들
  alternatives_korean:
  - 그의 요새화된 도시들
  - 그의 방어 성읍들
  lexicon: HALOT
  rationale: עָרֵי는 복수의 '성읍들'이고 מָעוֹז는 '견고함/요새'의 뜻이어서, 한국어에서는 자연스러운 합성 표현인 '견고한 성읍들'로 옮겼습니다.
- source_word: כַּעֲזוּבַת הַחֹרֶשׁ וְהָאָמִיר
  english_pob_choice: like the deserted places of the forest and the treetop
  chosen_korean: 숲의 황폐한 곳과 나무 꼭대기처럼
  alternatives_korean:
  - 숲의 버려진 곳과 수관처럼
  - 숲의 폐허와 꼭대기 가지처럼
  lexicon: HALOT
  rationale: עֲזוּבַת은 '버려진/황폐한 상태'를 가리키므로 '황폐한 곳'으로 풀었고, הָאָמִיר은 문맥상 나무의 가장 높은 부분을 가리켜 '나무 꼭대기'로 옮겼습니다.
- source_word: אֲשֶׁר עָזְבוּ מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: which they abandoned before the sons of Israel
  chosen_korean: 그들이 이스라엘의 자손 앞에서 버린 곳들
  alternatives_korean:
  - 그들이 이스라엘의 자손 때문에 버린 곳들
  - 그들이 이스라엘 자손 앞을 피해 버린 곳들
  lexicon: HALOT
  rationale: מִפְּנֵי는 '앞에서/앞을 피해'의 방향 감각을 살릴 수 있어 '앞에서'를 택했습니다. 이는 전투적 압박으로 인한 퇴각의 뉘앙스를 보존합니다.
- source_word: וְהָיְתָה שְׁמָמָה
  english_pob_choice: and it will be a desolation
  chosen_korean: 그리고 그것은 황폐함이 될 것입니다
  alternatives_korean:
  - 그리고 그것은 황폐하게 될 것입니다
  - 그리고 그것은 폐허가 될 것입니다
  lexicon: HALOT
  rationale: שְׁמָמָה의 결과 상태를 드러내기 위해 '황폐함'으로 옮겼고, וְהָיְתָה는 상태 전환을 살려 '될 것입니다'로 번역했습니다.
theological_decisions:
- issue: מִפְּנֵי בְּנֵי יִשְׂרָאֵל의 관계 의미
  chosen_reading: 전면적 원인보다, 이스라엘의 존재 앞에서의 퇴각/도피를 드러내는 '앞에서'를 본문에 유지했습니다.
  alternative_readings:
  - 이스라엘의 자손 때문에
  - 이스라엘의 자손 앞을 피해
  rationale: 본문의 히브리어는 단순한 원인뿐 아니라 '그들의 존재 앞에서 물러남'이라는 공간적-서사적 뉘앙스를 함께 가질 수 있으므로, 본문에서는 그 긴장을 살리고 주석적 대안을 각주로 보완했습니다.
  doctrine_reference: Translation philosophy and lexical transparency
- issue: וְהָיְתָה שְׁמָמָה의 결과 표현
  chosen_reading: '''황폐함이 될 것입니다''로 옮겨 심판의 결과가 시간 속에서 도달하는 상태를 드러냈습니다.'
  alternative_readings:
  - '''황폐하게 될 것입니다'''
  - '''황폐한 상태가 될 것입니다'''
  rationale: 히브리어는 단순한 존재 서술보다 결과적 변화를 포함하므로, '될 것입니다'가 문맥의 종결적 심판 진술을 잘 살립니다.
  doctrine_reference: Hebrew aspect/result-state in prophetic discourse
