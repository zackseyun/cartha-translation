id: ISA.17.12
reference: Isaiah 17:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֗וֹי הֲמוֹן֙ עַמִּ֣ים רַבִּ֔ים כַּ/הֲמ֥וֹת יַמִּ֖ים יֶהֱמָי֑וּ/ן וּ/שְׁא֣וֹן לְאֻמִּ֔ים כִּ/שְׁא֛וֹן מַ֥יִם כַּבִּירִ֖ים יִשָּׁאֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
  footnotes:
  - marker: a
    text: Or 'Woe, the multitude of many peoples …' The opening interjection הוֹי can introduce lament, warning, or an exclamation of attention.
    reason: alternative_reading
  - marker: b
    text: Hebrew repeats sound-related terms ('roar/tumult' and 'rushing/noise') to intensify the image of chaotic nations like stormy seas.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 많은 백성들의 함성이여—그들은 바다들의 울부짖음같이 울부짖습니다[a]. 민족들의 소란이여—그들은 거센 물들의 소란같이 소란합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬프도다, 많은 백성의 무리여 …’. 히브리어 הוֹי는 애곡, 경고, 주의 환기 모두로 쓰일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 슬프도다
  - 화로다
  lexicon: HALOT
  rationale: 본문에서는 저주 선언보다 감탄·주의 환기의 성격이 강하므로, 한국어 감탄사 ‘아’로 절제되게 옮겼습니다.
- source_word: הֲמוֹן עַמִּים רַבִּים
  english_pob_choice: the roar of many peoples
  chosen_korean: 많은 백성들의 함성
  alternatives_korean:
  - 많은 백성들의 소란
  - 많은 민족들의 울부짖음
  lexicon: HALOT
  rationale: הֲמוֹן의 소리 나는 집합적 혼잡을 살리되, ‘함성’으로 다수의 군중이 내는 울림을 자연스럽게 표현했습니다.
- source_word: כַּהֲמוֹת יַמִּים
  english_pob_choice: like the roaring of the seas
  chosen_korean: 바다들의 울부짖음같이
  alternatives_korean:
  - 바다의 울부짖음같이
  - 바다들의 소란같이
  lexicon: HALOT
  rationale: 비교 접두 כ를 살려 ‘-같이’로 옮기고, ים의 복수형을 ‘바다들’로 반영하여 시적 병렬을 유지했습니다.
- source_word: וּשְׁאוֹן לְאֻמִּים כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  english_pob_choice: and the rushing of nations … they rush like the rushing of mighty waters
  chosen_korean: 민족들의 소란… 거센 물들의 소란같이 소란합니다
  alternatives_korean:
  - 민족들의 함성… 거센 물들의 울림같이 울립니다
  - 민족들의 소란… 거센 물들의 밀려옴같이 밀려옵니다
  lexicon: HALOT
  rationale: שָׁאוֹן의 ‘소란/소음’ 의미와 동사의 반복을 살리기 위해 같은 어근을 한국어에서도 반복해, 원문의 음향적 강조를 보존했습니다.
theological_decisions:
- issue: הוֹי의 정서 범주
  chosen_reading: 이 절의 הוֹי는 단순한 ‘슬픔’보다 경탄과 경고를 동반한 주의 환기입니다.
  alternative_readings:
  - 애곡의 ‘슬프도다’
  - 심판 선포의 ‘화로다’
  rationale: 문맥이 열방의 소요를 묘사하는 시적 도입이므로, 과도하게 판결문처럼 들리지 않도록 감탄형으로 처리했습니다.
  doctrine_reference: 예언서 수사학
