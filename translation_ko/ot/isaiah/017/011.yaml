id: ISA.17.11
reference: Isaiah 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/י֤וֹם נִטְעֵ/ךְ֙ תְּשַׂגְשֵׂ֔גִי וּ/בַ/בֹּ֖קֶר זַרְעֵ֣/ךְ תַּפְרִ֑יחִי נֵ֥ד קָצִ֛יר בְּ/י֥וֹם נַחֲלָ֖ה וּ/כְאֵ֥ב אָנֽוּשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
  footnotes:
  - marker: a
    text: Or, more literally, 'a heap of harvest' for 'the harvest flees away.' The Hebrew phrase is difficult, and some take נֵד as 'heap' rather than expressing disappearance.
    reason: lexical_alternative
  - marker: b
    text: '''In a day of grief'' may also be rendered ''in a day of sickness'' or ''in a day of affliction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 심을 날에는 네가 그것을 무성하게 자라게 하고, 아침에는 네 씨앗이 싹트게 하겠지만, 추수는 슬픔과 고칠 수 없는 고통의 날에 달아나 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘추수의 더미’로도 옮길 수 있습니다. 히브리어 נֵד는 뜻이 어려워, 여기서는 ‘달아나다’로 이해하는 견해와 ‘더미’로 보는 견해가 나뉩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘슬픔의 날’은 ‘질병의 날’ 또는 ‘고난의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם נִטְעֵךְ
  english_pob_choice: On the day you plant
  chosen_korean: 네가 심을 날에는
  alternatives_korean:
  - 네 심는 날에는
  - 네가 심는 날에는
  - 심는 날에
  lexicon: WLC; HALOT
  rationale: 히브리어는 ‘네가 심는 날’이라는 시간 부사구로 이해되며, 한국어에서는 자연스러운 합쇼체로 ‘네가 심을 날에는’이 가장 매끄럽습니다.
- source_word: תְּשַׂגְשֵׂגִי
  english_pob_choice: you make it grow luxuriantly
  chosen_korean: 그것을 무성하게 자라게 하고
  alternatives_korean:
  - 그것을 번성하게 하고
  - 그것을 풍성하게 자라게 하고
  - 그것을 잘 자라게 하고
  lexicon: HALOT
  rationale: 동사의 뉘앙스는 단순 성장보다 무성하고 왕성한 자람을 가리키므로, ‘무성하게 자라게 하다’로 옮겨 원문의 생생함을 살렸습니다.
- source_word: זַרְעֵךְ תַּפְרִיחִי
  english_pob_choice: you make your seed sprout
  chosen_korean: 네 씨앗이 싹트게 하겠지만
  alternatives_korean:
  - 네 씨앗이 움트게 하겠지만
  - 네 씨앗이 피어나게 하겠지만
  - 네 씨앗을 싹트게 하겠지만
  lexicon: HALOT
  rationale: hiphil의 사역적 의미를 반영해 ‘싹트게 하다’로 옮겼고, 농경적 이미지에는 ‘씨앗’이 한국어 독자에게 가장 직관적입니다.
- source_word: נֵד קָצִיר
  english_pob_choice: the harvest flees away
  chosen_korean: 추수는 … 달아나 버립니다
  alternatives_korean:
  - 추수는 … 사라집니다
  - 추수는 … 물러납니다
  - 추수는 … 흩어져 버립니다
  lexicon: HALOT
  rationale: נֵד의 뜻이 난해하여 POB처럼 결과적으로 ‘사라짐/달아남’의 이미지를 살렸습니다. ‘추수’는 문맥상 기대한 수확물을 가리킵니다.
- source_word: בְּיוֹם נַחֲלָה
  english_pob_choice: in a day of grief
  chosen_korean: 슬픔의 날에
  alternatives_korean:
  - 고통의 날에
  - 병의 날에
  - 재앙의 날에
  lexicon: HALOT
  rationale: נַחֲלָה는 여기서 상속이 아니라 재난·고통의 뉘앙스로 읽히며, 본문의 병행 ‘고칠 수 없는 고통’과 맞물려 ‘슬픔의 날’로 옮겼습니다.
- source_word: וּכְאֵב אָנושׁ
  english_pob_choice: and incurable pain
  chosen_korean: 고칠 수 없는 고통
  alternatives_korean:
  - 치유할 수 없는 아픔
  - 절망적인 고통
  - 극심한 고통
  lexicon: HALOT
  rationale: אַנוּשׁ는 ‘치유 불가능한, 절망적인’의 뜻을 지니므로, 형용사적 의미를 살려 ‘고칠 수 없는’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 심판의 수확 이미지
  chosen_reading: 심고 키운 것에 대한 기대가 결국 무산되고, 수확은 재앙의 때에 사라집니다.
  alternative_readings:
  - 농사 실패에 대한 단순 관찰
  - 전쟁 피해로 인한 비유적 표현
  rationale: 문맥상 농업 은유는 단순한 자연 묘사가 아니라 심판의 결과를 강조하는 예언적 진술이므로, 기대와 상실의 대비가 드러나도록 유지했습니다.
  doctrine_reference: 예언서의 심판-구원 구조
- issue: נַחֲלָה의 의미
  chosen_reading: ‘상속’이 아니라 재난·질병·고통의 의미로 읽었습니다.
  alternative_readings:
  - 상속/소유의 날
  - 유업의 날
  rationale: 문맥과 병행구 ‘고칠 수 없는 고통’이 상속 의미와 맞지 않으므로, 히브리어의 비상적 용례를 따라 고난의 날로 처리했습니다.
  doctrine_reference: 문맥 우선의 본문 해석
