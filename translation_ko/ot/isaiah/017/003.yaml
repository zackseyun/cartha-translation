source:
  edition: WLC
  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
  footnotes:
  - marker: a
    text: Or, 'the remnant of Aram will be like the splendor of the sons of Israel.' The exact nuance of 'glory' may include honor or splendor.
    reason: lexical_alternative
  - marker: b
    text: The comparison may imply that Aram will share the same coming diminution as Israel; the Hebrew does not state the point of comparison explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 에브라임에서는 요새가 없어지고, 다메섹에서는 왕국이 없어지며, 아람의 남은 자들은 이스라엘 자손의 영광과 같게 될 것입니다. 만군의 야훼께서 선언하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘없어지고’는 히브리어 니팔형 동사가 나타내는 ‘그치다, 끝나다, 없어지다’의 뜻을 문맥에 맞게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람의 남은 자들이 이스라엘 자손의 ‘영광’과 어떤 점에서 같게 되는지는 히브리어 본문이 명시하지 않습니다. 뒤 문맥을 고려하면 함께 쇠잔해지는 상태를 가리킬 수 있으나, 본문은 이를 직접 설명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּת
  english_pob_choice: will cease
  chosen_korean: 사라지고
  alternatives_korean:
  - 그치고
  - 멈추고
  - 끝나고
  lexicon: HALOT
  rationale: 니팔형의 ‘그치다/멈추다’ 의미를 살리되, 예언 문맥에서 도시와 권세의 소멸을 자연스럽게 드러내는 동사로 ‘사라지다’를 택했습니다.
- source_word: מִבְצָר
  english_pob_choice: the fortress
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 견고한 성
  - 요새 도시
  lexicon: HALOT
  rationale: 단수의 방어 거점을 가리키므로 ‘요새’가 가장 간결하고 현대 한국어에서도 자연스럽습니다.
- source_word: וּשְׁאָר אֲרָם
  english_pob_choice: and the remnant of Aram
  chosen_korean: 아람의 남은 자
  alternatives_korean:
  - 아람의 남은 자들
  - 아람의 남은 것
  - 아람의 잔존자
  lexicon: HALOT
  rationale: שְׁאָר의 예언적 어감을 살리기 위해 ‘남은 자’로 옮겼고, 고유명사는 본문 관례에 따라 ‘아람’을 유지했습니다.
- source_word: כִּכְבוֹד בְּנֵי יִשְׂרָאֵל
  english_pob_choice: will be like the glory of the sons of Israel
  chosen_korean: 이스라엘의 아들들의 영광과 같을 것입니다
  alternatives_korean:
  - 이스라엘 자손의 영광과 같을 것입니다
  - 이스라엘 백성의 영광과 같을 것입니다
  - 이스라엘의 아들들의 영광처럼 될 것입니다
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 문자적 형식을 유지해 ‘이스라엘의 아들들’로 옮기되, כבוד는 문맥상 ‘영광’이 가장 직접적이므로 그대로 유지했습니다.
- source_word: נְאֻם יְהוָה צְבָאֽוֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼의 말씀입니다
  alternatives_korean:
  - 만군의 야훼께서 말씀하십니다
  - 만군의 야훼의 선언입니다
  - 만군의 주님의 말씀입니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식 נְאֻם을 한국어 예언체에 맞는 ‘말씀입니다’로 처리했고, YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘아람의 남은 자는 … 영광과 같을 것입니다’의 비교가 무엇을 뜻하는지
  chosen_reading: 본문은 비교의 정확한 지점을 설명하지 않으므로, 남은 자의 상태를 명시적으로 해석하지 않고 비교 표현 자체를 유지했습니다.
  alternative_readings:
  - 아람의 남은 자가 이스라엘의 장차 겪을 감소와 같은 처지가 된다는 뜻일 수 있습니다.
  - 아람의 남은 자가 이스라엘의 영광과 같은 성격의 상태를 공유한다는 뜻일 수 있습니다.
  rationale: 히브리어 자체가 비교의 구체적 초점을 말하지 않으므로, 문맥이 주는 긴장을 본문 수준에서 열어 두는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve interpretive tension rather than resolve it.'
