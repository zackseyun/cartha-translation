  source_fidelity: 초안은 주요 어휘와 비교문의 모호성을 대체로 보존합니다. 그러나 מִן의 범위를 소유격(‘에브라임의 요새’)으로 처리하여 ‘에브라임에서 요새가 없어짐’이라는 원문의 표현을 흐리게 했고, 복수 동사 יִהְיוּ에 맞추어 ‘아람의 남은 자들’로 표현하는 편이 더 정확합니다.
