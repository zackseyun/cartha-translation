  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
  footnotes:
  - marker: a
    text: Or 'smith' for 'craftsman'; the Hebrew term can be broader, but the context of coals and weapon-making points to a metalworker.
    reason: lexical_alternative
  - marker: b
    text: Or 'implement' or 'article' for 'weapon'; the Hebrew word is broad, but here likely refers to an instrument of war.
    reason: lexical_alternative
  - marker: c
    text: Or 'for his work.' The Hebrew suffix in 'for its/his work' may refer either to the produced object or to the craftsman.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 내가 바로 쇠를 단련하는 장인과 숯불의 불을 부풀려 그 일을 위한 기구를 만들어 내는 자를 창조하였으며, 또한 내가 파괴자를 파괴하도록 창조하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장인’은 넓은 뜻의 번역이며, 문맥상 금속을 다루는 대장장이를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기구’는 히브리어 כְלִי의 넓은 의미를 반영한 번역이며, 문맥상 전쟁 도구를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 일’을 ‘그의 일’로도 이해할 수 있습니다. 히브리어 접미사는 만들어진 물건이나 장인 중 어느 쪽에 붙는지 애매합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어에서 자연스럽고, 예언적 선포의 강조를 살립니다.
- source_word: בָּרָאתִי
  english_pob_choice: have created
  chosen_korean: 창조하였으며
  alternatives_korean:
  - 만들었으며
  - 지으셨으며
  - 창조했습니다
  lexicon: HALOT
  rationale: ברא의 하나님 주권적 창조 행위를 직접 살리기 위해 ‘창조하다’를 택했습니다.
- source_word: חָרָשׁ
  english_pob_choice: the craftsman
  chosen_korean: 쇠를 단련하는 장인
  alternatives_korean:
  - 장인
  - 대장장이
  - 공예가
  lexicon: HALOT
  rationale: 문맥이 숯불과 도구 제작을 가리키므로 일반적 ‘장인’보다 금속 가공의 뉘앙스를 드러냈습니다.
- source_word: וּמוֹצִיא כְלִי לְמַעֲשֵׂהוּ
  english_pob_choice: and brings out a weapon for his work
  chosen_korean: 그 일을 위한 기구를 만들어 내는 자
  alternatives_korean:
  - 무기를 만들어 내는 자
  - 도구를 만들어 내는 자
  - 그의 일을 위한 기구를 내는 자
  lexicon: HALOT
  rationale: כְלִי는 매우 넓은 말이지만 여기서는 대장장이 문맥상 무기일 가능성이 있으나, 한국어에서는 범주를 너무 좁히지 않기 위해 ‘기구’로 옮기고, לְמַעֲשֵׂהוּ는 주석 없이도 자연스러운 ‘그 일 위한’ 구조로 처리했습니다.
- source_word: מַשְׁחִית לְחַבֵּל
  english_pob_choice: the destroyer to destroy
  chosen_korean: 파괴자를 파괴하도록
  alternatives_korean:
  - 멸망시키는 자를 멸망시키도록
  - 파괴자를 멸하려고
  - 훼손자를 훼손하도록
  lexicon: HALOT
  rationale: 동일 어근의 반복을 살려 하나님이 ‘파괴자’까지도 그 파괴 행위의 목적 안에서 창조하셨다는 긴장을 한국어에서도 드러냈습니다.
theological_decisions:
- issue: 하나님이 장인과 파괴자 둘 다를 창조하셨다는 진술
  chosen_reading: 본문의 반복을 완화하지 않고, 하나님이 둘 다를 창조하셨다는 직접 진술을 그대로 살렸습니다.
  alternative_readings:
  - 파괴자에 대한 직접적 귀속을 피하는 우회적 표현
  - ‘허락하셨다’로 완화하는 번역
  rationale: 히브리어는 두 번 모두 ‘내가 창조하였다’를 반복하므로, 악의 문제를 본문 밖에서 설명해 버리지 않고 문장 자체의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
