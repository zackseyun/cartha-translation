  naturalness: 초안은 전반적으로 자연스럽지만, ‘네 경계를 모두 귀한 돌로 만들겠습니다’는 목적어의 범위가 다소 어색합니다. ‘네 모든 경계를 귀한 돌로’로 배열하면 히브리어의 병렬 구조와 한국어 문장이 더 분명해집니다. 또한 각주 표지는 해당 어휘 바로 뒤에 두는 것이 참조 관계를 명확히 합니다.
