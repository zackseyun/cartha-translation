  text: וְ/שַׂמְתִּ֤י כַּֽדְכֹד֙ שִׁמְשֹׁתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ לְ/אַבְנֵ֣י אֶקְדָּ֑ח וְ/כָל גְּבוּלֵ֖/ךְ לְ/אַבְנֵי חֵֽפֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
  footnotes:
  - marker: a
    text: Hebrew כַּדְכֹד likely names a red or brilliant gemstone; possible renderings include 'garnet' or 'red jasper.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term translated 'pinnacles' is rare and may also be understood as 'battlements' or 'windows.'
    reason: lexical_alternative
  - marker: c
    text: The expression translated 'sparkling stone' refers to a bright or fiery gemstone; older translations often render it 'carbuncle.'
    reason: lexical_alternative
  - marker: d
    text: Or 'all your borders' or 'all your territory,' though the city-building imagery here favors an architectural sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 첨탑을 홍옥으로, 네 문들을 빛나는 돌로, 네 경계를 모두 귀한 돌로 만들겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּדְכֹד는 붉거나 빛나는 보석 이름으로 보이며, ‘루비’는 전통적이지만 확정적 식별은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 שִׁמְשֹׁתַיִךְ는 희귀어로, ‘첨탑’ 외에도 ‘성벽 상부’, ‘창문’ 등으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֶקְדָּח는 밝게 빛나는 보석을 가리키는 말로 보이며, 옛 번역에서는 ‘카브룬클’로 옮기기도 했습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 גְּבוּל은 ‘경계’, ‘경계벽’, ‘영토’로도 옮길 수 있지만, 여기서는 성읍 건축 이미지가 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 만들겠습니다
  alternatives_korean:
  - 두겠습니다
  - 놓겠습니다
  lexicon: HALOT
  rationale: 시편적·예언적 건축 이미지에서 שׂוּם은 단순한 ‘놓다’보다 ‘만들다’가 자연스럽고, 성벽을 보석으로 새롭게 꾸미는 조성의 뉘앙스를 잘 살립니다.
- source_word: שִׁמְשֹׁתַיִךְ
  english_pob_choice: your pinnacles
  chosen_korean: 네 첨탑
  alternatives_korean:
  - 네 망대
  - 네 상부 구조물
  - 네 창문
  lexicon: HALOT
  rationale: 희귀어라 정확한 해석이 어렵지만, 문맥상 성읍의 상단 구조를 가리키므로 ‘첨탑’이 건축적 이미지와 시적 장엄함을 함께 유지합니다.
- source_word: כַּדְכֹד
  english_pob_choice: ruby
  chosen_korean: 홍옥
  alternatives_korean:
  - 루비
  - 석류석
  - 붉은 벽옥
  lexicon: HALOT
  rationale: 원석 식별은 불확실하지만, 붉고 빛나는 보석이라는 점을 드러내기 위해 전통적이며 의미 전달이 가능한 ‘홍옥’을 택했습니다.
- source_word: לְאַבְנֵי אֶקְדָּח
  english_pob_choice: of sparkling stone
  chosen_korean: 빛나는 돌
  alternatives_korean:
  - 반짝이는 돌
  - 불타는 돌
  - 카브룽클 돌
  lexicon: HALOT
  rationale: אֶקְדָּח의 정확한 보석명은 확정하기 어려우므로, 광채와 장식성을 보존하는 ‘빛나는 돌’로 옮겼습니다.
- source_word: וְכָל גְּבוּלֵךְ
  english_pob_choice: and all your boundary walls
  chosen_korean: 네 경계를 모두
  alternatives_korean:
  - 네 경계벽을 모두
  - 네 경계 지역 전체를
  - 네 변두리를 모두
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계, 경계선, 영토’ 모두 가능하지만, 본문은 성읍 건축 비유이므로 ‘경계’를 택해 넓은 테두리의 의미를 살렸습니다.
theological_decisions:
- issue: 예언적 회복의 도시 이미지 번역
  chosen_reading: 보석 장식의 성읍 재건 약속으로 읽고, 과장된 해석 없이 건축 은유를 그대로 살렸습니다.
  alternative_readings:
  - 교회의 영적 영광으로 직접 치환
  - 천상의 성을 상징하는 알레고리로 확대
  rationale: 본문은 실제 성읍을 보석으로 꾸미는 회복의 이미지가 중심이므로, 신학적 적용은 보존하되 본문 의미를 대체하지 않았습니다.
  doctrine_reference: 예언서의 회복 약속과 상징적 시적 표현
