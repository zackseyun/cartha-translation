id: ISA.54.2
reference: Isaiah 54:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַרְחִ֣יבִי מְק֣וֹם אָהֳלֵ֗/ךְ וִ/ירִיע֧וֹת מִשְׁכְּנוֹתַ֛יִ/ךְ יַטּ֖וּ אַל תַּחְשֹׂ֑כִי הַאֲרִ֨יכִי֙ מֵֽיתָרַ֔יִ/ךְ וִ/יתֵדֹתַ֖יִ/ךְ חַזֵּֽקִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
  footnotes:
  - marker: a
    text: Or 'do not spare' or 'do not restrain.'
    reason: lexical_alternative
  - marker: b
    text: '''Curtains'' refers to the fabric hangings of a tent; ''stakes'' are tent pegs.'
    reason: cultural_note
translation:
  language: ko
  text: 네 천막의 자리를 넓히고, 네 거처들의 휘장을 펼치십시오.[b] 아끼지 마십시오.[a] 네 줄을 길게 하고 네 말뚝을 튼튼하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아끼지 마십시오’는 문맥상 ‘억제하지 마십시오’ 또는 ‘주저하지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘휘장’은 천막을 이루는 천 덮개이며, ‘말뚝’은 천막을 고정하는 못입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְחִיבִי
  english_pob_choice: Enlarge
  chosen_korean: 넓히십시오
  alternatives_korean:
  - 확장하십시오
  - 크게 하십시오
  lexicon: HALOT
  rationale: 히필 명령형으로 ‘넓게 만들다/확장하다’의 뜻이어서, 현대 한국어에서 자연스럽고 직접적인 명령인 ‘넓히십시오’로 옮겼습니다.
- source_word: מְקוֹם אָהֳלֵךְ
  english_pob_choice: the place of your tent
  chosen_korean: 네 천막의 자리
  alternatives_korean:
  - 네 장막의 자리
  - 네 천막 공간
  lexicon: HALOT
  rationale: ‘מקום’의 구체적 의미를 살려 ‘자리’로 옮기고, ‘אָהֶל’은 예언적 장막 이미지에 맞게 ‘천막’으로 번역했습니다.
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  english_pob_choice: the curtains of your dwellings
  chosen_korean: 네 거처의 휘장
  alternatives_korean:
  - 네 거처의 천막 휘장
  - 네 장막의 휘장
  lexicon: HALOT
  rationale: ‘יריעות’는 천막의 막/휘장이므로 ‘휘장’이 가장 압축적이고, ‘משכנות’는 복수형이지만 시적 병행을 살려 ‘거처’로 자연스럽게 처리했습니다.
- source_word: מֵיתָרַיִךְ וִיתֵדֹתַיִךְ
  english_pob_choice: your cords / your stakes
  chosen_korean: 네 줄 / 네 말뚝
  alternatives_korean:
  - 네 밧줄 / 네 장막 말뚝
  - 네 줄끈 / 네 말뚝들
  lexicon: HALOT
  rationale: ‘מיתרים’은 장막 줄이므로 ‘줄’이 간결하고, ‘יתדות’는 장막을 고정하는 말뚝/말뚝못이므로 ‘말뚝’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 장막 확장 비유를 어떻게 처리할지
  chosen_reading: 주거 확장이나 인구 증가로 풀어쓰지 않고, 장막·거처·휘장·줄·말뚝의 구체적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 집을 넓히십시오
  - 더 많은 사람들이 들어오게 하십시오
  rationale: 본문은 시온을 향한 구체적 장막 확장 명령으로 구성되어 있으므로, 비유를 유지해야 예언의 힘과 원래 청중이 들었을 이미지를 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
