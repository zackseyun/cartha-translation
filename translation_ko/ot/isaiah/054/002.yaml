- from: 네 천막의 자리를 넓히고, 네 거처의 휘장을 펼치십시오. 아끼지 말고, 네 줄을 길게 하고 네 말뚝들을 굳게 하십시오.[a][b]
  to: 네 천막의 자리를 넓히고, 네 거처들의 휘장을 펼치십시오.[b] 아끼지 마십시오.[a] 네 줄을 길게 하고 네 말뚝을 튼튼하게 하십시오.
  rationale: 원문의 명령형과 장막 확장 비유를 그대로 보존하면서, ‘거처들’로 복수형을 반영하고 말뚝에 관한 표현을 자연스러운 현대 합쇼체로 다듬었습니다. 어휘·문화 각주는 실제로 설명하는 어구에 가깝게 재배치했습니다.
