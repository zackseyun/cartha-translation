revisions:
- from: 두려워하지 마십시오. 당신은 부끄러움을 당하지 않을 것이며, 수치를 당하지도 않을 것입니다. 이는 당신이 젊은 날의 수치를 잊을 것이며, 당신의 과부 됨의 치욕을 다시는 기억하지 않을 것이기 때문입니다.[a][b]
  to: 두려워하지 마십시오.[a] 당신은 부끄러움을 당하지 않을 것이기 때문입니다.[b] 수치를 당하지 마십시오. 당신은 치욕을 당하지 않을 것이기 때문입니다. 당신은 젊은 날의 수치를 잊고, 과부로 지낸 때의 치욕을 다시는 기억하지 않을 것입니다.
  rationale: 히브리어의 네 절 병행, 곧 ‘두려워하지 말라—수치를 당하지 않을 것이다—수치를 당하지 말라—치욕을 당하지 않을 것이다’를 모두 재현했습니다. 이어지는 두 미래 동사도 ‘잊고’와 ‘다시는 기억하지 않을 것입니다’로 보존했으며, 시온을 향한 여성 단수의 혼인·과부 비유는 본문에서 설명으로 과도하게 풀지 않았습니다.
