source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
  footnotes:
  - marker: a
    text: Or 'Do not be afraid.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not be ashamed.' The Hebrew shame-language in this verse overlaps in meaning across several verbs, emphasizing the end of Zion's public disgrace.
    reason: lexical_alternative
translation:
  language: ko
  text: 두려워하지 마십시오.[a] 당신은 부끄러움을 당하지 않을 것이기 때문입니다.[b] 수치를 당하지 마십시오. 당신은 치욕을 당하지 않을 것이기 때문입니다. 당신은 젊은 날의 수치를 잊고, 과부로 지낸 때의 치욕을 다시는 기억하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하지 말라.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 부끄러워하지 않을 것입니다.’ 이 절의 히브리어 수치 어휘는 여러 동사에 걸쳐 의미가 겹치며, 시온의 공개적 수치가 끝난다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: HALOT
  rationale: 여성 단수에게 직접 주는 금지 명령을 자연스러운 현대 한국어 명령형으로 옮기되, 'fear'의 폭넓은 의미를 보존했습니다.
- source_word: תֵבֹשִׁי / תִּכָּלְמִי / תַחְפִּירִי
  english_pob_choice: you will not be put to shame / do not be humiliated / you will not be disgraced
  chosen_korean: 부끄러움을 당하지 않을 것이며, 수치를 당하지도 않을 것입니다
  alternatives_korean:
  - 수치를 당하지 않을 것이며, 굴욕을 겪지도 않을 것입니다
  - 부끄럽지 않을 것이며, 창피를 당하지도 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 연속된 수치 어휘를 한국어에서 서로 다른 뉘앙스를 가진 병렬 표현으로 살리면서, 개인적 감정보다 공개적 모욕·치욕의 의미를 유지했습니다.
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  english_pob_choice: the shame of your youth
  chosen_korean: 젊은 날의 수치
  alternatives_korean:
  - 청춘의 수치
  - 젊었을 때의 부끄러움
  lexicon: HALOT
  rationale: עֲלוּמִים를 직역적인 '청춘'보다 더 자연스러운 '젊은 날'로 풀어, 젊은 시절에 속한 수치라는 점을 분명히 했습니다.
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  english_pob_choice: the reproach of your widowhood
  chosen_korean: 과부 됨의 치욕
  alternatives_korean:
  - 과부 됨의 수치
  - 과부 신세의 멸시
  lexicon: HALOT
  rationale: חֶרְפָּה의 공개적 모욕, 멸시의 뜻을 살리기 위해 '치욕'을 택했고, 알몸 같은 상실이 아니라 비유적 '과부 됨'을 그대로 유지했습니다.
theological_decisions:
- issue: 화자와 수신자의 인격화된 호칭
  chosen_reading: 시온/예루살렘을 여성 단수로 인격화한 위로의 말씀으로 읽고, 본문에서는 그 인격화를 과도하게 풀지 않았습니다.
  alternative_readings:
  - 일반 여성 개인에게 주는 말씀
  - 집단적 공동체에 대한 서술
  rationale: 문맥 전체가 결혼·과부 비유를 통해 회복된 시온을 말하므로, 2인칭 여성 단수 호칭을 그대로 살리는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 이사야 54장의 시온 회복 이미지
