  source_fidelity: 히브리어의 반복된 גּוֹר יָגוּר / גָר는 적대적 결집 또는 대립이라는 문맥적 의미로 옮길 수 있습니다. 다만 עָלַיִךְ יִפּוֹל은 문자적으로 ‘네 위에/네게로 떨어질 것이다’라고도 읽힐 수 있으므로, 본문의 ‘네 앞에 쓰러질 것입니다’는 문맥적 해석임을 각주에서 밝혀야 합니다.
  naturalness: ‘당신’은 현대 한국어에서 청자 호칭으로 어색하거나 관계를 오해하게 할 수 있습니다. 시온을 향한 성경적 단수 호칭에는 ‘너/네’가 더 자연스럽습니다. 또한 ‘누가 …더라도’보다 ‘누가 …한다 해도’가 이 조건적 선언에 매끄럽고, 두 번의 동사를 같은 표현으로 반복하면 원문의 반복도 더 잘 드러납니다.
  terminology: ‘내게서 나온 것이 아닙니다’는 אֶפֶס מֵאוֹתִי의 출처 부정을 적절히 전달합니다. 기존 각주의 ‘승인자’라는 설명은 원문이 명시하는 범위를 다소 넓히므로, 출처 부정에 한정하는 편이 안전합니다.
