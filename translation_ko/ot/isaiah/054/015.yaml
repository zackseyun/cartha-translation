theological_decisions:
- issue: 도성/시온을 향한 적대가 하나님의 기원에서 나온 것으로 오해될 가능성
  chosen_reading: 이 구절은 적대적 결집이 하나님에게서 나온 것이 아님을 분명히 말하며, 공격자는 오히려 패배합니다.
  alternative_readings:
  - 그것은 하나님의 도움 없이만 일어난다는 의미로 읽을 수 있습니다
  - 마지막 절은 단순히 ‘당신 위에 떨어진다’는 중립적 이미지로 읽을 수 있습니다
  rationale: 문맥은 보호와 변호를 강조하므로, 번역에서도 하나님의 주도적 승인처럼 들리지 않도록 출처 부정을 분명히 드러내야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
