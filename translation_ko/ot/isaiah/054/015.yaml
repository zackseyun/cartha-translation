base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
  footnotes:
  - marker: a
    text: Or 'surely gathers'; the Hebrew verb גור can denote gathering/sojourning, but in this context it refers to hostile opposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'not by me' / 'apart from me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will fall before you' or, more literally, 'will fall upon you.' The context favors the sense of the aggressor's downfall rather than successful attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 누가 다툼을 일으킨다 해도[a] 그것은 내게서 나온 것이 아닙니다.[b] 누구든지 너와 다툼을 일으키면 네 앞에 쓰러질 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다툼을 일으키다’는 반복된 히브리어 동사 גור의 문맥상 적대적 결집을 풀어 옮긴 것입니다. 이 동사는 더 문자적으로 ‘모이다’ 또는 ‘거하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내게서’라고 말하며, 이 적대적 행위의 출처가 하나님이 아님을 나타냅니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘네 위에 쓰러질 것이다’ 또는 ‘네게로 쓰러질 것이다’로도 읽을 수 있습니다. 이 문맥에서는 공격자가 패배하여 쓰러진다는 뜻으로 이해됩니다.
    reason: lexical_alternative
