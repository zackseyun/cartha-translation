translation:
  language: ko
  text: 잠시 동안 내가 너를 버렸으나, 큰 긍휼로 너를 모을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버렸으나’는 עזב의 강한 관계적 단절을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  english_pob_choice: For a brief moment
  chosen_korean: 잠시 동안
  alternatives_korean:
  - 잠깐 동안
  - 짧은 순간에
  - 아주 잠시
  lexicon: HALOT
  rationale: רֶגַע와 קָטֹן의 결합은 매우 짧은 지속 시간을 가리키므로, 한국어에서는 자연스러운 시간 부사구인 ‘잠시 동안’으로 옮겨 짧은 기간의 뉘앙스를 살렸습니다.
- source_word: עֲזַבְתִּיךְ
  english_pob_choice: I abandoned you
  chosen_korean: 내가 너를 버렸으나
  alternatives_korean:
  - 내가 너를 떠났으나
  - 내가 너를 버린 바 있으나
  - 내가 너를 외면했으나
  lexicon: HALOT
  rationale: עזב는 단순한 ‘떠남’보다 관계적 단절을 포함할 수 있어 ‘버리다’가 원문의 강도를 더 잘 드러냅니다. 뒤의 대조를 살리기 위해 연결을 ‘-으나’로 처리했습니다.
- source_word: וּבְרַחֲמִים גְּדֹלִים
  english_pob_choice: with great compassion
  chosen_korean: 큰 긍휼로
  alternatives_korean:
  - 큰 자비로
  - 넘치는 긍휼로
  - 큰 사랑으로
  lexicon: HALOT
  rationale: רַחֲמִים은 단순한 감정이 아니라 자비로운 연민을 가리키므로 ‘긍휼’이 적합합니다. ‘큰’은 גְּדֹלִים의 강도를 자연스럽게 반영합니다.
- source_word: אֲקַבְּצֵךְ
  english_pob_choice: I will gather you
  chosen_korean: 너를 모을 것입니다
  alternatives_korean:
  - 너를 모아들일 것입니다
  - 너를 모으겠습니다
  - 너를 모을게요
  lexicon: HALOT
  rationale: קבץ의 기본 의미는 ‘모으다, 집합하다’이며, 예언적 회복의 뜻을 담습니다. 현대 한국어에서는 ‘모으다’가 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: 하나님의 ‘버리심’과 회복의 긴장
  chosen_reading: 하나님이 실제로 버리셨지만 그것은 잠시이며, 곧 큰 긍휼로 다시 모으신다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 버리심을 비유적이거나 겉보기의 상태로 완화하는 해석
  - 하나님을 덜 직접적으로 표현하는 완곡한 번역
  rationale: 히브리어 עזב의 직접성을 약화하지 않으면서, ‘잠시’와 ‘큰 긍휼’이라는 본문의 수식어로 심판과 회복의 균형을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
