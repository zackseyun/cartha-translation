source:
  edition: WLC
  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
  footnotes:
  - marker: a
    text: Or 'will inherit nations' or 'will possess nations.' The Hebrew verb can carry the sense of inheriting, possessing, or dispossessing depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'cause desolate cities to be inhabited.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네가 오른쪽과 왼쪽으로 퍼져 나갈 것이며, 네 자손이 민족들을 차지하고[a] 황폐한 성읍들을 사람들이 살게 할 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들을 상속할 것이다’ 또는 ‘민족들을 몰아낼 것이다’로 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 상속하다, 차지하다, 또는 몰아내다의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘황폐한 성읍들을 사람이 살게 할 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְרֹצִי / יָמִין וּשְׂמֹאול
  english_pob_choice: you will spread out to the right and to the left
  chosen_korean: 오른쪽과 왼쪽으로 퍼져 나갈 것이며
  alternatives_korean:
  - 오른쪽과 왼쪽으로 확장될 것이며
  - 우측과 좌측으로 퍼질 것이며
  lexicon: HALOT
  rationale: תפרץ의 ‘터져 나가다/퍼져 나가다’ 이미지를 살리면서, ימין ושׂמאל의 공간적 대비를 자연스러운 한국어로 옮겼습니다.
- source_word: זַרְעֵךְ
  english_pob_choice: your offspring
  chosen_korean: 네 자손이
  alternatives_korean:
  - 네 후손이
  - 네 씨가
  lexicon: HALOT
  rationale: 집합적 의미의 זרע를 현대 한국어에서 자연스럽고 문맥에 맞게 풀었습니다. ‘씨’는 더 직역적이지만 한국어 독자에게는 다소 생소할 수 있습니다.
- source_word: יִירָשׁ
  english_pob_choice: will possess nations
  chosen_korean: 민족들을 차지하고
  alternatives_korean:
  - 민족들을 상속하고
  - 민족들을 소유하고
  lexicon: HALOT
  rationale: 영문 POB의 ‘possess nations’에 맞추어, ירש의 소유/점유 의미를 살리되 한국어에서 자연스러운 ‘차지하다’로 옮겼습니다. ‘상속하다’는 상속 은유를 강하게 만들고, ‘소유하다’는 소유 상태만 강조합니다.
- source_word: עָרִים נְשַׁמּוֹת יוֹשִׁיבוּ
  english_pob_choice: will settle desolate cities
  chosen_korean: 황폐한 성읍들에 거주하게 할 것이기 때문입니다
  alternatives_korean:
  - 황폐한 성읍들에 살게 할 것이기 때문입니다
  - 황폐한 성읍들에 정착하게 할 것이기 때문입니다
  lexicon: HALOT
  rationale: הִפְעִיל형 ישב의 사역적 의미를 반영해 ‘거주하게 하다’로 옮겼고, ‘성읍들’은 도시보다 예언서의 어휘층을 더 직접적으로 반영합니다.
theological_decisions:
- issue: יִירָשׁ를 '상속'으로 완화할지, '차지하다'로 둘지
  chosen_reading: 언약적 번성과 지배의 감각을 유지하기 위해 '차지하다'를 채택했습니다.
  alternative_readings:
  - 상속하다
  - 소유하다
  rationale: 본문은 단순한 추상적 계승이 아니라 열방을 대상으로 하는 확장과 점유의 이미지를 담습니다. 한국어에서는 '차지하다'가 그 긴장을 가장 자연스럽게 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
