  to: 내가 분노가 폭발할 때[a] 네게서 한순간 내 얼굴을 숨겼으나, 영원히 변함없는 사랑으로[b] 너를 긍휼히 여겼다. 너의 구속자 야훼께서 말씀하십니다.
  rationale: 원문의 어순과 수식 관계를 한국어에서 명료하게 재구성했습니다. 분노의 희귀한 강조 표현은 과도한 이미지화 없이 ‘분노가 폭발할 때’로 살렸고, 잠시 얼굴을 숨긴 행위와 영속적인 חֶסֶד의 대조를 분명히 했습니다. 명사형 ‘구속자’와 야훼라는 고유명사를 유지했으며, 각주 표지를 해당 어구에 배치했습니다.
