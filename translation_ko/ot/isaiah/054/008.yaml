id: ISA.54.8
reference: Isaiah 54:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שֶׁ֣צֶף קֶ֗צֶף הִסְתַּ֨רְתִּי פָנַ֥/י רֶ֨גַע֙ מִמֵּ֔/ךְ וּ/בְ/חֶ֥סֶד עוֹלָ֖ם רִֽחַמְתִּ֑י/ךְ אָמַ֥ר גֹּאֲלֵ֖/ךְ יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
  footnotes:
  - marker: a
    text: Or 'In overflowing anger' or 'In a burst of anger.' The Hebrew expression is rare and intensifies the idea of wrath.
    reason: lexical_alternative
  - marker: b
    text: Or 'with everlasting steadfast love.' The Hebrew חֶסֶד includes covenant loyalty, mercy, and steadfast love.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 한순간 분노의 소용돌이 속에서 너에게서 내 얼굴을 숨겼으나, 영원한 사랑으로 너를 불쌍히 여겼다. 너를 구속하시는 야훼께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분노의 소용돌이 속에서’는 히브리어의 희귀한 병렬 표현이 지닌 격렬함을 살린 번역입니다. 직역하면 ‘넘쳐나는 분노 가운데’ 또는 ‘폭발하는 분노 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원한 사랑’은 히브리어 חֶסֶד의 언약적 선의와 자비를 간명하게 풀어 옮긴 표현입니다. ‘영원한 인애’ 또는 ‘영원한 변함없는 사랑’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  english_pob_choice: in a surge of wrath
  chosen_korean: 분노의 소용돌이 속에서
  alternatives_korean:
  - 격노가 치솟는 가운데
  - 분노가 넘쳐나는 가운데
  lexicon: HALOT
  rationale: 희귀한 결합어가 분노의 급격하고 강한 분출을 강조하므로, 한국어에서는 자연스럽게 강도의 이미지를 살린 표현으로 옮겼습니다.
- source_word: הִסְתַּרְתִּי פָנַי
  english_pob_choice: I hid my face
  chosen_korean: 내 얼굴을 숨겼으나
  alternatives_korean:
  - 내 얼굴을 감추었으나
  - 내 얼굴을 돌렸으나
  lexicon: HALOT
  rationale: 하나님의 호의와 임재가 거두어지는 관용적 표현을 직역에 가깝게 살려, 언약적 거리감의 뉘앙스를 유지했습니다.
- source_word: חֶסֶד עוֹלָם
  english_pob_choice: everlasting lovingkindness
  chosen_korean: 영원한 사랑으로
  alternatives_korean:
  - 영원한 인애로
  - 영원한 언약적 사랑으로
  lexicon: HALOT
  rationale: חֶסֶד는 인애·자비·언약적 신실함을 포함하므로, 현대 한국어에서 의미를 지나치게 무겁게 만들지 않으면서도 관계적 선의를 드러내는 표현을 택했습니다.
- source_word: גֹּאֲלֵךְ
  english_pob_choice: your Redeemer
  chosen_korean: 너를 구속하시는
  alternatives_korean:
  - 너의 구속자
  - 너를 속량하시는
  lexicon: HALOT
  rationale: 명사형 호칭을 한국어에서는 현재분사적 관계절로 풀어, 단순 칭호보다 구속 행위와 언약적 보호를 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 언약적 고유명사 יְהוָה를 전통적 대체 칭호가 아니라 음역으로 보존하는 본 프로젝트 기본 원칙을 따랐습니다.
theological_decisions:
- issue: חֶסֶד의 뉘앙스
  chosen_reading: 영원한 사랑
  alternative_readings:
  - 영원한 인애
  - 영원한 언약적 사랑
  rationale: 이 절은 순간적인 진노와 영원한 긍휼을 대조하므로, חֶסֶד의 핵심을 관계적이고 지속적인 사랑으로 간명하게 드러냈습니다. 본문이 직접 말하지 않는 교리적 확장을 피하면서도 언약적 의미를 해치지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 화자 표지의 처리
  chosen_reading: 너를 구속하시는 야훼께서 말씀하십니다
  alternative_readings:
  - 너의 구속자 야훼의 말씀이니라
  - 야훼, 너의 구속자께서 말씀하십니다
  rationale: 히브리어 종결부는 인용 표지이므로, 한국어에서는 선지자적 선언 형식으로 자연스럽게 옮기되 신적 화자의 직접성을 유지했습니다.
  doctrine_reference: Prophetic speech register
