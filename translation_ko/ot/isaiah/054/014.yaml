id: ISA.54.14
reference: Isaiah 54:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
  footnotes:
  - marker: a
    text: Or 'By righteousness you will be established.' The Hebrew preposition may express means as well as sphere.
    reason: lexical_alternative
  - marker: b
    text: '''Terror'' may also be rendered ''destruction'' or ''ruin.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 의 가운데서 당신은 굳게 세워질 것입니다[a]; 압제에서 멀리 있을 것이며, 당신은 두려워하지 않을 것이기 때문입니다. 또한 공포[b]에서도 멀리 있을 것이니, 그것이 당신에게 가까이 오지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로 말미암아 당신은 굳게 세워질 것입니다.’ 히브리어 전치사 ב는 수단뿐 아니라 영역을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공포’는 ‘파괴’ 또는 ‘멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/צְדָקָה
  english_pob_choice: In righteousness
  chosen_korean: 의 가운데서
  alternatives_korean:
  - 의 안에서
  - 의로 말미암아
  - 의로
  lexicon: HALOT
  rationale: ב plus צְדָקָה는 영역과 수단을 함께 열어 두므로, 한국어는 ‘의 가운데서’로 자연스럽게 두 의미를 보존했습니다.
- source_word: תִּכּוֹנָנִי
  english_pob_choice: you will be established
  chosen_korean: 당신은 굳게 세워질 것입니다
  alternatives_korean:
  - 당신은 세워질 것입니다
  - 당신은 튼튼히 세워질 것입니다
  lexicon: HALOT
  rationale: 동사의 결과적·수동적 의미를 살리면서, 한국어에서 하나님의 확립 행위를 분명하게 드러내기 위해 ‘굳게 세워질 것입니다’로 옮겼습니다.
- source_word: מֵ/עֹשֶׁק
  english_pob_choice: from oppression
  chosen_korean: 압제
  alternatives_korean:
  - 억압
  - 학대
  - 착취
  lexicon: HALOT
  rationale: עֹשֶׁק은 폭력적 억눌림과 착취를 포괄하므로, 문맥상 가장 넓고 자연스러운 ‘압제’를 선택했습니다.
- source_word: וּ/מִ֨/מְּחִתָּ֔ה
  english_pob_choice: and from terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 파괴
  - 멸망
  lexicon: HALOT
  rationale: פּחד 계열의 ‘두려움’과 병렬을 이루는 위협적 정서를 살리기 위해, 사건 그 자체보다 체감되는 위협을 가리키는 ‘공포’로 옮겼습니다.
theological_decisions:
- issue: 지시 대상의 성별과 집단성
  chosen_reading: 2인칭 여성 단수의 ‘당신’으로 유지하여, 본문이 시온/예루살렘을 집단적으로 지칭하는 것을 살렸습니다.
  alternative_readings:
  - ‘시온아’ 또는 ‘예루살렘아’를 본문에 명시함
  rationale: 히브리어는 여성 단수로 시온을 계속 호명하지만, 본 절은 그 명칭을 반복하지 않으므로 한국어 본문은 직접 대상을 덧붙이지 않고 흐름을 보존했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
