source:
  edition: WLC
  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
  footnotes:
  - marker: a
    text: Or 'like a woman forsaken and grieved in spirit.' The Hebrew אִשָּׁה can mean either 'woman' or 'wife'; the marital context favors 'wife.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like a wife of one's youth when she is rejected/despised.' The Hebrew clause is compact and may be taken with slightly different nuances.
    reason: alternative_reading
translation:
  language: ko
  text: 왜냐하면 야훼께서 버림받고 영이 상한 아내[a]처럼, 젊은 시절의 아내가 버림받을 때[b]처럼 너를 부르셨습니다. 너의 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버림받고 영이 상한 여자.’ 히브리어 אִשָּׁה는 ‘여자’와 ‘아내’를 모두 뜻할 수 있으며, 혼인 문맥상 여기서는 ‘아내’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘젊은 시절의 아내가 거절받거나 멸시받을 때.’ 히브리어 구절은 압축되어 있어 약간 다른 뉘앙스로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 정녕
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - For
  lexicon: HALOT
  rationale: 문맥상 앞선 약속을 받쳐 주는 설명·근거의 접속어이므로, 한국어에서는 문어체의 자연스러운 연결어인 ‘정녕’을 택했습니다.
- source_word: כְ/אִשָּׁה עֲזוּבָה
  english_pob_choice: like a wife forsaken
  chosen_korean: 버림받고 … 아내
  alternatives_korean:
  - 버림받은 여자
  - 버림받은 아내
  - 버려진 아내
  lexicon: HALOT
  rationale: אִשָּׁה의 ‘여자/아내’ 가능성 가운데 혼인 비유가 분명하므로 ‘아내’로 좁히고, עֲזוּבָה는 관계적 단절을 드러내는 ‘버림받은’으로 옮겼습니다.
- source_word: וַעֲצוּבַת רוּחַ
  english_pob_choice: and grieved in spirit
  chosen_korean: 영이 상한
  alternatives_korean:
  - 마음이 아픈
  - 영이 근심한
  - 영이 괴로운
  lexicon: HALOT
  rationale: רוּחַ를 단순한 감정이 아닌 내적 생명/영의 자리로 보아 ‘영’으로 옮겼고, עֲצוּבָה의 고통을 ‘상한’으로 압축해 표현했습니다.
- source_word: וְאֵשֶׁת נְעוּרִים
  english_pob_choice: like a wife of youth
  chosen_korean: 젊어서 맞아들인 아내
  alternatives_korean:
  - 젊은 시절의 아내
  - 젊어서 얻은 아내
  - 젊은 아내
  lexicon: HALOT
  rationale: 직역형 ‘젊음의 아내’보다 혼인 시점을 드러내는 한국어 표현이므로, युव기의 결혼 관계를 살리는 ‘젊어서 맞아들인 아내’로 옮겼습니다.
- source_word: כִּי תִמָּאֵס
  english_pob_choice: when she is rejected
  chosen_korean: 멸시받을 때
  alternatives_korean:
  - 거절될 때
  - 버림받을 때
  - 경멸당할 때
  lexicon: HALOT
  rationale: נִפְעַל의 수동적 뉘앙스와 경시/혐오의 뜻을 함께 살리기 위해, 관계적 거절의 강도를 드러내는 ‘멸시받을 때’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대체어가 아니라 고유 이름의 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 혼인 비유의 유지 여부
  chosen_reading: 지저분하게 완화하지 않고, 버림받은 아내와 젊어서 맞아들인 아내라는 혼인 비유를 그대로 유지했습니다.
  alternative_readings:
  - ‘백성’이나 ‘도성’으로 일반화하기
  - 비유를 풀어 설명하기
  rationale: 본문은 시온과 하나님의 관계를 혼인 언어로 직접 묘사하므로, 그 긴장과 정서적 무게를 보존하는 것이 소스 충실도에 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명은 호칭이 아니라 고유명으로 제시되므로, 본문 표면의 직접성을 살려 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
