id: ISA.54.13
reference: Isaiah 54:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל בָּנַ֖יִ/ךְ לִמּוּדֵ֣י יְהוָ֑ה וְ/רַ֖ב שְׁל֥וֹם בָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
  footnotes:
  - marker: a
    text: Or 'your sons' at both occurrences; Hebrew בנים can denote sons specifically or children more generally.
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of wholeness, well-being, or flourishing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 모든 자녀는 야훼께 가르침을 받을 것이며, 네 자녀의 평강[b]이 클 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בנים은 두 번 모두 ‘아들들’ 또는 더 넓게 ‘자녀들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’(shalom)은 ‘온전함’, ‘잘됨’, 또는 ‘번영’의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And all
  chosen_korean: 그리고 … 모든
  alternatives_korean:
  - 그리고 … 온
  - 그리고 … 전부의
  lexicon: HALOT
  rationale: 히브리어 접속사 וְ와 כָל의 결합을 한국어에서도 연결어와 총괄 표현으로 살려, 문맥의 연속성과 포괄성을 자연스럽게 전달했습니다.
- source_word: בָּנַיִ/ךְ
  english_pob_choice: your children
  chosen_korean: 너의 모든 자녀
  alternatives_korean:
  - 네 아들들
  - 너의 자녀들
  lexicon: HALOT
  rationale: בנים은 ‘아들들’도 가능하지만, 시온/예루살렘의 집단적 후손을 가리키는 이 문맥에서는 성별을 좁히지 않는 ‘자녀’가 더 적절합니다.
- source_word: לִמּוּדֵי
  english_pob_choice: taught
  chosen_korean: 가르침을 받을
  alternatives_korean:
  - 가르쳐질
  - 배울
  lexicon: HALOT
  rationale: 수동적/형용사적 의미를 살려 ‘가르침을 받을’로 옮기면, 뒤따르는 야훼의 이름과 함께 신적 교육의 주체가 분명해집니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자 그대로의 신명 표기를 따르며, 관용적 대체어인 ‘주’로 바꾸지 않고 고유명을 보존했습니다.
- source_word: שְׁלֹום
  english_pob_choice: the peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 온전함
  - 복
  lexicon: HALOT
  rationale: שׁלום의 핵심 의미를 한국어 성경어인 ‘평강’으로 살리되, 본문의 넓은 의미는 각주로 보완할 수 있습니다.
theological_decisions:
- issue: ‘children’의 범위와 시온의 의인화
  chosen_reading: 시온/예루살렘에게 주어진 집단적 약속으로 읽되, 성별을 아들로만 한정하지 않고 자녀로 번역했습니다.
  alternative_readings:
  - 아들들
  - 백성
  - 거주자들
  rationale: 히브리어가 여성을 의인화한 수신자에게 후손을 말하는 시적 구조를 유지하면서, 원문의 포괄성을 해치지 않도록 했습니다.
  doctrine_reference: Gender-accurate over gender-neutral; preserve theological tension rather than resolve it.
- issue: שָׁלוֹם의 의미 범위
  chosen_reading: 본문에는 ‘평강’으로 두고, 필요하면 각주로 ‘온전함/번영’의 함의를 열어 둡니다.
  alternative_readings:
  - 평화
  - 온전함
  - 번영
  rationale: 정서적 평온만이 아니라 관계적·삶의 충만함을 포함하는 רחב한 의미를 지나치게 축소하지 않기 위해서입니다.
  doctrine_reference: Lexical range of shalom in prophetic blessing contexts.
