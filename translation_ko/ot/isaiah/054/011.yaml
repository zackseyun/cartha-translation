revisions:
- from: 고난받고 폭풍에 휩쓸렸지만 위로받지 못한 이여, 보십시오[a], 내가 네 돌들을 안티몬에 놓고 네 기초를 사파이어들로 놓겠습니다.
  to: 고난을 당하고 폭풍에 시달리며 위로받지 못한 이여, 보십시오. 내가 안티몬으로[a] 네 돌들을 박고 사파이어로[b] 네 기초를 놓겠습니다.
  rationale: 원문의 여성 단수 호명을 한국어의 성별 비표지 호칭 ‘이여’로 자연스럽게 유지했습니다. 세 개의 상태 묘사는 양보 접속 없이 병렬로 연결했으며, הִנֵּה의 선언적 강조는 합쇼체 ‘보십시오’로 보존했습니다. 건축 은유의 두 동작은 미래적 신적 선언으로 ‘박고 … 놓겠습니다’로 옮겼습니다. 안티몬의 용도와 사파이어의 광물 식별에 관한 불확실성은 본문에서 단정하지 않고 각 어휘에 연결한 주석으로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:23Z'
