id: ISA.54.11
reference: Isaiah 54:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
  footnotes:
  - marker: a
    text: Or 'with lapis lazuli'; the Hebrew term traditionally rendered 'sapphires' may refer to a blue precious stone not identical to the modern sapphire.
    reason: lexical_alternative
  - marker: b
    text: '''In antimony'' likely refers to a decorative setting material for the stones; some understand a dark mortar or inlay.'
    reason: cultural_note
translation:
  language: ko
  text: 고난받고 폭풍에 휩쓸렸지만 위로받지 못한 이여, 보십시오[a], 내가 네 돌들을 안티몬에 놓고 네 기초를 사파이어들로 놓겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안티몬에’는 장식용 재료를 직역한 표현으로, 일부는 검은 몰타르나 상감 재료로 이해합니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנִיָּה
  english_pob_choice: afflicted one
  chosen_korean: 고난받고
  alternatives_korean:
  - 고난받은 이여
  - 괴로움당한 이여
  - 학대받은 이여
  lexicon: HALOT
  rationale: 여성 단수의 직접 호명 기능을 살리면서, 단순한 상태 형용사보다 인격적·예언적 호소를 드러내는 표현으로 옮겼습니다.
- source_word: סֹעֲרָה
  english_pob_choice: storm-tossed
  chosen_korean: 폭풍에 휩쓸렸지만
  alternatives_korean:
  - 폭풍에 휩쓸린
  - 폭풍에 시달린
  - 폭풍에 맞은
  lexicon: HALOT
  rationale: סער의 ‘격렬한 폭풍에 흔들림/몰림’ 이미지를 자연스러운 한국어로 옮기되, 앞뒤 병렬감과 시련의 지속성을 살리기 위해 연결형으로 처리했습니다.
- source_word: בַּפּוּךְ
  english_pob_choice: in antimony
  chosen_korean: 안티몬에
  alternatives_korean:
  - 안티몬으로
  - 안티몬 속에
  - 검은 광물 재료에
  lexicon: HALOT
  rationale: פּוּךְ의 기본 어휘값을 유지해 직역성을 확보했습니다. 본문의 건축 비유에서 장식용/석재 고정 재료를 가리킬 수 있으나, 본문은 그 불확실성을 과잉 해석하지 않는 쪽이 적절합니다.
- source_word: בַּסַּפִּירִים
  english_pob_choice: with sapphires
  chosen_korean: 사파이어들로
  alternatives_korean:
  - 사파이어로
  - 청옥으로
  - 라피스라줄리로
  lexicon: HALOT
  rationale: 표준 성경 번역 관행상 ‘사파이어’ 계열을 유지하되, 복수형을 반영해 장식 재료의 풍성함을 살렸습니다. 실제 광물 동일성의 불확실성은 본문 주석에 맡기는 것이 적절합니다.
theological_decisions:
- issue: 호명 대상과 인칭 유지
  chosen_reading: ‘고난받고 폭풍에 휩쓸렸지만 위로받지 못한 이여’로 여성 단수의 시온/예루살렘을 직접 호명하는 예언 어조를 유지했습니다.
  alternative_readings:
  - ‘고난받은 자여’처럼 성별을 중화하는 읽기
  - 일반적 공동체로만 완화하는 읽기
  rationale: 문법상 여성 단수와 54장 문맥은 인격화된 시온을 가리키므로, 그 수사적 긴장을 평탄화하지 않고 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 원문 우선, 인격화된 시온의 예언적 호명 보존
- issue: ‘보십시오’의 강조와 예언 선언
  chosen_reading: 히브리어 הִנֵּה의 선언적 힘을 살려 ‘보십시오’로 옮겼습니다.
  alternative_readings:
  - ‘보라’
  - ‘여기 보라’
  rationale: 현대 한국어에서 ‘보십시오’는 예언적 선포의 긴장을 유지하면서도 합쇼체에 맞게 자연스럽습니다. 직접 신적 발화의 존칭 어조와도 조응합니다.
  doctrine_reference: 예언문체의 수사적 강조 보존
