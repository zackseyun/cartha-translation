- from: 이는 내게 노아의 물들처럼 그러합니다. 내가 다시는 노아의 물들이 땅 위를 지나지 못하게 하겠다고 맹세한 것처럼, 이제는 내가 당신에게 화내지 않으며 당신을 꾸짖지 않겠다고 맹세합니다.[a]
  to: 이는 내게 노아의 홍수 때의 물[a]과 같습니다. 내가 다시는 노아의 홍수 때의 물이 땅 위로 지나가지 않을 것이라고 맹세한 것처럼, 그와 같이 나는 네게 화내지 않고 너를 꾸짖지 않겠다고 맹세하였습니다.
  rationale: 본문은 마소라 본문의 ‘노아의 물’을 유지하되, 현대 한국어에서 자연스럽게 이해되도록 ‘노아의 홍수 때의 물’로 표현했습니다. ‘날들’이라는 다른 전통은 본문에 채택하지 않고 각주로 처리했습니다. 비교 구조는 ‘…와 같습니다’와 ‘그와 같이’로, 맹세의 부정 내용은 ‘…않을 것이라고/않겠다고’로 명료하게 재현했습니다.
