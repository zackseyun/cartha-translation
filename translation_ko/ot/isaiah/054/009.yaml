id: ISA.54.9
reference: Isaiah 54:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
  footnotes:
  - marker: a
    text: Or, 'For this is to me as the waters of Noah.' Some translations, influenced by ancient versions, read 'days of Noah,' but the Hebrew text says 'waters of Noah.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 내게 노아의 홍수 때의 물[a]과 같습니다. 내가 다시는 노아의 홍수 때의 물이 땅 위로 지나가지 않을 것이라고 맹세한 것처럼, 그와 같이 나는 네게 화내지 않고 너를 꾸짖지 않겠다고 맹세하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 직역하면 ‘노아의 물’이라고 합니다. 일부 고대 번역 전통은 ‘노아의 날들’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי נֹחַ
  english_pob_choice: the waters of Noah
  chosen_korean: 노아의 물들
  alternatives_korean:
  - 노아의 물
  - 노아의 홍수 물들
  lexicon: HALOT
  rationale: 히브리어가 ‘노아의 물들’(waters of Noah)이라고 하므로, 노아 홍수의 물을 직접 드러내되 원문의 소유격 구조를 살렸습니다.
- source_word: זֹאת לִי
  english_pob_choice: this is like ... to me
  chosen_korean: 이는 내게 …처럼 그러합니다
  alternatives_korean:
  - 이는 내게 …입니다
  - 이는 내게 …와 같습니다
  lexicon: HALOT
  rationale: 원문은 비교를 함축하는 엘립시스가 있어 한국어에서는 ‘처럼’으로 보완해야 문장이 자연스럽고 비교 의미도 유지됩니다.
- source_word: מֵעֲבֹר ... עוֹד
  english_pob_choice: would never again pass over
  chosen_korean: 다시는 … 지나지 못하게
  alternatives_korean:
  - 다시는 … 지나가지 않게
  - 더 이상 … 넘어오지 못하게
  lexicon: HALOT
  rationale: 부정된 שׁבע 구조의 뜻을 한국어에서 ‘다시는 … 못하게’로 풀어, 반복 금지를 분명히 하면서 גם ‘지나다/넘어오다’의 물의 이동 이미지를 살렸습니다.
- source_word: מִקְּצֹף עָלַיִךְ וּמִגְּעָר בָּךְ
  english_pob_choice: not to be angry with you and not to rebuke you
  chosen_korean: 당신에게 화내지 않으며 당신을 꾸짖지 않겠다고
  alternatives_korean:
  - 당신에게 노하지 않으며 당신을 책망하지 않겠다고
  - 당신에게 분노하지 않으며 당신을 질책하지 않겠다고
  lexicon: HALOT
  rationale: קצף와 גער의 병렬을 살려 각각 ‘화내다’와 ‘꾸짖다’로 옮겼습니다. ‘책망하다/질책하다’도 가능하지만, 여기서는 하나님께서 하시는 직접적 언어로 ‘꾸짖다’가 더 가까웠습니다.
theological_decisions:
- issue: ‘노아의 물들’의 표현 방식
  chosen_reading: ‘노아의 물들’로 본문에 두고, ‘days of Noah’ 계열 전통은 따로 채택하지 않았습니다.
  alternative_readings:
  - ‘노아의 날들’
  - ‘노아의 홍수’
  rationale: 히브리어 본문 자체가 ‘날들’이 아니라 ‘물들’을 말하므로, 본문 우선 원칙에 따라 이를 유지했습니다. 이는 해석의 확대가 아니라 원문 대응입니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 맹세문의 부정 의미
  chosen_reading: ‘다시는 … 않겠다고 맹세합니다’로 한국어에서 부정의 반복 금지를 명시했습니다.
  alternative_readings:
  - ‘…하지 않으리라 맹세합니다’
  - ‘…하지 않겠다고 맹세합니다’
  rationale: 히브리어의 מִן + infinitive 부정 구문은 한국어에서 자연스럽게 풀어 써야 하므로, 하나님의 맹세 내용을 분명히 드러내는 번역을 택했습니다.
  doctrine_reference: Optimal equivalence / Hebrew grammar
