  source_fidelity: 히브리어 본문의 ‘노아의 물’과 비교·맹세의 구조는 대체로 반영되었습니다. 그러나 ‘물이 땅 위를 지나지 못하게 하겠다’는 표현은 물이 지나가는 것을 하나님께서 막으신다는 뜻으로 기울며, 원문의 ‘물이 더 이상 땅 위를 지나가지 않다’와 다소 다릅니다. ‘이제는’도 כֵּן(‘그와 같이’)보다 시간적 전환을 더합니다.
  naturalness: ‘이는 내게 노아의 물들처럼 그러합니다’와 ‘노아의 물들’은 현대 표준 한국어에서 매우 부자연스럽습니다. 집합적으로 쓰이는 물은 이 문맥에서 ‘물’로 두고, 노아 홍수의 문맥을 드러내는 최소한의 보완을 하는 편이 자연스럽습니다.
  terminology: ‘맹세하다’, ‘화내다’, ‘꾸짖다’는 적절합니다. 하나님의 발화를 가리키는 ‘당신’은 한국어 성경 문체 및 존대 체계에서 부자연스러우므로, 원문의 2인칭 여성 단수를 자연스럽게 반영하는 ‘네게/너를’로 고칩니다.
