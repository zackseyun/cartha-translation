source:
  edition: WLC
  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'you will prove guilty.' The Hebrew verb means to declare someone guilty or condemn them in a legal sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'their vindication is from me.' The Hebrew can carry a forensic sense in this legal context.
    reason: alternative_reading
translation:
  language: ko
  text: 너를 거슬러 만들어진 어떤 무기도 성공하지 못할 것이며, 재판에서 너를 거슬러 일어나는 모든 혀를 네가 정죄할 것이다[a]. 이것은 야훼의 종들의 기업이며, 그들의 의는 내게서 나온다[b]. 야훼의 말씀이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 유죄로 선언할 것이다.’ 히브리어 동사는 법정적 의미에서 누군가를 유죄로 선언하거나 정죄한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 정당하다는 판결은 내게서 나온다.’ 히브리어는 이 법정적 문맥에서 ‘의’와 함께 ‘정당함’ 또는 ‘변호받음’의 뜻을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי יוּצַר
  english_pob_choice: weapon formed
  chosen_korean: 만들어진 어떤 무기
  alternatives_korean:
  - 무기
  - 도구
  - 기구
  lexicon: HALOT
  rationale: 문맥이 공격용으로 만들어진 물건을 가리키므로, 일반적인 ‘도구’보다 ‘무기’가 적절합니다. ‘만들어진’은 יוּצַר의 ‘형성되다/지어지다’의 수동 의미를 자연스럽게 살립니다.
- source_word: תָּקוּם אִתְּךְ לַמִּשְׁפָּט
  english_pob_choice: rises against you in judgment
  chosen_korean: 당신을 거슬러 재판에 일어서는
  alternatives_korean:
  - 당신을 거슬러 심판에 일어서는
  - 당신을 거슬러 법정에서 일어서는
  lexicon: HALOT
  rationale: לַמִּשְׁפָּט는 현대 한국어에서 ‘재판’으로 옮기면 법적 장면이 분명해집니다. ‘일어서는’은 תָּקוּם의 호전적 출현을 살립니다.
- source_word: תַּרְשִׁיעִי
  english_pob_choice: you will condemn
  chosen_korean: 당신이 정죄할 것입니다
  alternatives_korean:
  - 당신이 유죄 판결할 것입니다
  - 당신이 정죄 선언할 것입니다
  lexicon: HALOT
  rationale: 히필 רשע는 법적 맥락에서 ‘유죄로 선언하다/정죄하다’의 뜻입니다. ‘정죄할 것입니다’가 간결하고, 판결 행위를 자연스럽게 드러냅니다.
- source_word: נַחֲלַת עַבְדֵי יְהוָה
  english_pob_choice: the heritage of the servants of Yahweh
  chosen_korean: 야훼의 종들의 기업
  alternatives_korean:
  - 야훼의 종들의 유업
  - 야훼의 종들의 상속
  lexicon: HALOT
  rationale: נַחֲלָה는 언약적 상속 재산의 뉘앙스가 있어 ‘기업’이 성경적이면서도 현대 합쇼체에서 자연스럽습니다. עַבְדֵי יְהוָה는 이 문맥에서 신분적 속박보다 언약적 소속을 강조하므로 ‘종들’로 옮깁니다.
- source_word: צִדְקָתָם מֵאִתִּי
  english_pob_choice: their righteousness is from me
  chosen_korean: 그들의 의는 내게서 나옵니다
  alternatives_korean:
  - 그들의 의는 내게서 비롯됩니다
  - 그들의 의는 나로부터입니다
  lexicon: HALOT
  rationale: צִדְקָה는 기본적으로 ‘의’이며, כאן의 출처 표현 מֵאִתִּי는 ‘내게서’로 간명하게 살립니다. 영어 본문이 보존한 ‘righteousness’도 한국어 성경 용례에 맞춰 ‘의’로 유지합니다.
theological_decisions:
- issue: צִדְקָתָם의 법정적 뉘앙스
  chosen_reading: ‘의’로 본문을 유지하되, 하나님에게서 오는 판정과 보증의 의미를 함께 남깁니다.
  alternative_readings:
  - 그들의 vindication은 내게서 나옵니다
  - 그들의 의로움은 내게서 나옵니다
  rationale: 이 절은 방어와 정당화의 법정적 문맥이 분명하지만, 히브리어 עצמו는 표준 ‘의’ 어휘를 사용합니다. 본문에서는 의미를 지나치게 좁히지 않고, 독자가 법정적 함의를 읽어낼 수 있게 두었습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; contested righteousness/vindication principle.'
