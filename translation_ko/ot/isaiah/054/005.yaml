  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the LORD of Hosts.'
