id: ISA.54.5
reference: Isaiah 54:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will be called the God of all the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네 남편이신 네 조성자이시니, 그의 이름은 야훼 만군이십니다. 네 구속자는 이스라엘의 거룩하신 이시니, 그는 온 땅의 하나님이라 불리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘만군의 여호와’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 온 땅의 하나님이라 불릴 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹעֲלַיִךְ
  english_pob_choice: your husband
  chosen_korean: 네 남편이신
  alternatives_korean:
  - 네 주인이신
  - 네 주님이신
  lexicon: HALOT
  rationale: 이 문맥은 시온을 여성으로 부르며 결혼 관계의 비유를 쓰므로, בעל의 관계적 의미를 살려 ‘남편’으로 옮기는 것이 source-direct합니다.
- source_word: עֹשַׂיִךְ
  english_pob_choice: your Maker
  chosen_korean: 네 조성자이시니
  alternatives_korean:
  - 네 창조자이시니
  - 너를 지으신 분이시니
  lexicon: HALOT
  rationale: עשה의 분사형은 여기서 칭호처럼 쓰이므로, 단순 설명보다 지칭성을 살린 ‘조성자’가 ‘남편’과의 병렬 구조를 보존합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군이십니다
  alternatives_korean:
  - 여호와 만군이십니다
  - 야훼 군대의 주이십니다
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로 두고, צְבָאוֹת은 전통적 ‘만군’이 본문의 칭호성을 가장 잘 보존하므로 그대로 살렸습니다.
- source_word: וְגֹאֲלֵךְ
  english_pob_choice: your Redeemer
  chosen_korean: 네 구속자는
  alternatives_korean:
  - 네 속량자는
  - 네 대속자는
  lexicon: HALOT
  rationale: גאל의 구속·친족 구원 함의를 한국어에서 가장 널리 알아들을 수 있는 칭호로 옮기되, 문맥의 명칭성을 유지했습니다.
- source_word: יִקָּרֵא
  english_pob_choice: he is called
  chosen_korean: 불리십니다
  alternatives_korean:
  - 불리십니다
  - 불릴 것입니다
  lexicon: HALOT
  rationale: 니팔 수동의 칭호 문맥을 현재적·진술적 표현으로 처리하여, 단순 미래 예고보다 이미 확인된 호칭을 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘여호와’ 대신 학술적 전사인 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 용례와 source transparency를 따르기 위해 고유명사성을 보존하는 ‘야훼’가 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for יְהוָה'
- issue: 시온-하나님의 혼인 비유 보존
  chosen_reading: ‘네 남편이신 네 조성자’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 네 주인이신 네 조성자
  - 네 창조주이신 네 주님
  rationale: 본문은 언약적 관계를 혼인 비유로 제시하므로, 이를 약화시키지 않고 그대로 드러내는 것이 해석상 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
