  - 내 화평의 언약
  - 내 평안 언약
  lexicon: HALOT
  rationale: בְּרִית와 שָׁלוֹם의 결합을 직역에 가깝게 살리면서도, 한국어에서 ‘평화의 언약’이 가장 매끄럽고 문맥상 자연스럽습니다.
- source_word: 'מְרַחֲמֵךְ / english_pob: who has compassion on you'
  english_pob_choice: who has compassion on you
  chosen_korean: 너를 불쌍히 여기는
  alternatives_korean:
  - 너를 긍휼히 여기는
  - 너에게 자비를 베푸는
  lexicon: HALOT
  rationale: רחם의 감정적·보호적 의미를 현대 한국어에서 분명히 전달하기 위해 ‘불쌍히 여기다’를 사용했습니다.
