  lexicon: HALOT
  rationale: 여성 단수의 대상인 시온/예루살렘에 대한 분리감을 직접적으로 살리되, 현대 한국어에서 자연스러운 ‘너에게서’로 옮겼습니다.
- source_word: 'וּבְרִית שְׁלוֹמִי / english_pob: my covenant of peace'
  english_pob_choice: my covenant of peace
  chosen_korean: 내 평화의 언약
  alternatives_korean:
