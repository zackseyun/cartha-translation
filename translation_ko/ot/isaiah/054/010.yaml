  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 표준 프로젝트 용례에 따라 신적 고유명사 יְהוָה를 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 산과 언덕의 이미지와 두 동사의 구별(מוּשׁ / מוֹט)
  chosen_reading: ‘옮겨지고’와 ‘흔들릴’로 구별해, 산은 떠나고 언덕은 흔들리는 서로 다른 움직임을 살렸습니다.
  alternative_readings:
  - 둘 다 ‘사라지다’로 통일
  - 둘 다 ‘옮겨지다’로 통일
  rationale: 본문은 두 다른 동사를 사용해 우주적 안정성의 붕괴를 점층적으로 묘사하므로, 한국어에서도 동일어 반복으로 평준화하지 않았습니다.
  doctrine_reference: Translation philosophy §5 (source distinction preservation)
- issue: ‘peace’(שָׁלוֹם)의 범위
  chosen_reading: ‘평화’
  alternative_readings:
  - 평강
  - 평안
  - 복리
  rationale: 시적 예언문맥에서 관계적·전체적 안녕을 포함하는 뜻을 현대 독자에게 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §5 (context-sensitive equivalence)
