  rationale: חֶסֶד의 언약적 충실함과 지속성을 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘한결같은 사랑’을 택했습니다.
- source_word: 'מֵאִתֵּךְ / english_pob: from you'
