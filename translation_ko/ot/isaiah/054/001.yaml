review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 בְּנֵי שׁוֹמֵמָה(‘황폐한/쓸쓸한 여인의 자녀’)를 ‘자식이 없는 여인’으로 바꾸어 원문의 비유적 표현을 좁혔고, אָמַר יְהוָה의 위치와 인용 관계도 바꾸었습니다. 또한 미완료/명사절의 현재적 비교를 ‘더 많을 것이다’라는 미래로 한정했습니다.
  naturalness: ‘노래하며 환호하기를 터뜨리라’는 현대 한국어에서 어색하며, 합쇼체 요청에도 ‘-하라’가 사용되었습니다. 명령의 병행과 호격을 유지하면서 ‘-하십시오’로 다듬는 것이 자연스럽습니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기 방침과 일치합니다. עֲקָרָה는 ‘불임의 여인’으로, שׁוֹמֵמָה는 구별하여 ‘황폐한 여인’으로 옮겨야 합니다. ‘자녀’는 בְּנֵי의 포괄적 의미를 적절히 반영합니다.
  issues:
  - severity: high
    issue: שׁוֹמֵמָה를 ‘자식이 없는’으로 번역함
    rationale: 원어는 ‘황폐한, 쓸쓸한, 버려진’ 상태의 여성상을 가리키며, 단순한 무자녀 상태와 동일시하지 않습니다. 앞 절의 불임/해산하지 못함과도 구별되는 시적 비유를 보존해야 합니다.
  - severity: high
    issue: ‘야훼의 말씀이다’가 비교절 앞에 놓이고 그 뒤의 말을 직접 인용 처리함
    rationale: אָמַר יְהוָה는 비교절 뒤에 오는 발화 공식입니다. 원문의 문장 순서와 발화 범위를 따라 비교절 뒤에 ‘야훼께서 말씀하십니다’로 두어야 합니다.
  - severity: medium
    issue: ‘더 많을 것이다’라는 미래 시제로 한정함
    rationale: 히브리어의 비교 표현은 여기서 ‘더 많다/더 많습니다’로 자연스럽게 옮길 수 있으며, 문법상 미래로 제한할 필요가 없습니다.
