id: ISA.54.1
reference: Isaiah 54:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
  footnotes:
  - marker: a
    text: Or 'the children of the desolate one are many/more numerous than the children of the married woman.' The Hebrew expresses the comparison compactly.
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하라, 불임의 여인이여, 아이를 낳지 못한 여인이여. 노래하며 환호하기를 터뜨리라. 산고를 겪어 보지 못한 여인이여. 야훼의 말씀이다. “자식이 없는 여인의 자녀가 결혼한 여인의 자녀보다 더 많을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “황폐한 여인의 자녀가 결혼한 여인의 자녀보다 더 많다.” 히브리어는 비교를 압축적으로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  english_pob_choice: Sing
  chosen_korean: 노래하라
  alternatives_korean:
  - 노래하라
  - 기뻐 외치라
  - 찬송하라
  lexicon: HALOT
  rationale: 여성 단수 명령형의 기쁨의 외침을 자연스러운 현대 한국어로 옮기되, 시적 초청의 직접성을 살리기 위해 '노래하라'를 택했습니다.
- source_word: עֲקָרָה
  english_pob_choice: barren woman
  chosen_korean: 불임의 여인
  alternatives_korean:
  - 불임의 여자
  - 아이를 낳지 못하는 여인
  - 임신하지 못한 여인
  lexicon: HALOT
  rationale: 출산 불가능 상태를 가리키는 표현으로, '불임의 여인'이 원문의 상태 묘사와 시적 호칭을 함께 살립니다.
- source_word: פִּצְחִי רִנָּה וְצַהֲלִי
  english_pob_choice: break forth into singing and shout for joy
  chosen_korean: 노래하며 환호하기를 터뜨리라
  alternatives_korean:
  - 노래로 터져 나오라
  - 환호하며 노래를 터뜨리라
  - 기쁨의 소리를 터뜨리라
  lexicon: HALOT
  rationale: פצח의 '터져 나오다/터뜨리다'와 צהל의 큰 기쁨의 외침을 하나의 시적 한국어로 압축해, 역동성과 병행을 유지했습니다.
- source_word: לֹא חָלָה
  english_pob_choice: you who have not been in labor
  chosen_korean: 산고를 겪어 보지 못한 여인
  alternatives_korean:
  - 해산의 고통을 겪지 않은 여인
  - 진통을 겪어 보지 못한 여인
  - 해산의 고통이 없던 여인
  lexicon: HALOT
  rationale: 출산 진통을 뜻하는 문맥을 분명히 드러내기 위해 '산고'를 사용했고, 시적 호칭이 되도록 '여인'을 반복했습니다.
- source_word: בְּנֵי שׁוֹמֵמָה
  english_pob_choice: the children of the desolate woman
  chosen_korean: 자식이 없는 여인
  alternatives_korean:
  - 버림받은 여인
  - 황폐한 여인의 자녀
  - 버려진 여인의 자녀
  lexicon: HALOT
  rationale: 문맥상 비교 대상은 임신 불가/무자녀 상태의 여인으로 이해되며, 한국어에서 '자식이 없는 여인'이 비교의 요지를 가장 분명하게 전달합니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼의 말씀이다
  alternatives_korean:
  - 야훼께서 말씀하신다
  - 야훼께서 말씀하셨다
  - 여호와의 말씀이다
  lexicon: HALOT
  rationale: 원문의 직설 인용 공식과 공적 선포 어조를 살려, 본문 밖 서술형 종결로 '야훼의 말씀이다'를 택했습니다.
theological_decisions:
- issue: יהוה(YHWH) 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 원문이 직접 신명을 사용하므로, 프로젝트 기본값에 따라 한국어 본문에서도 고유 이름 '야훼'를 유지해 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 마지막 비교절의 여성상
  chosen_reading: 자식이 없는 여인
  alternative_readings:
  - 황폐한 여인
  - 버려진 여인
  - 불임의 여인
  rationale: הַשּׁוֹמֵמָה의 비유적 '황폐함'을 단순 사회적 상태로만 좁히지 않고, 본문의 핵심 대조인 무자녀/풍성한 자녀를 한국어에서 즉시 이해되도록 옮겼습니다.
  doctrine_reference: 본문의 시적 대조 구조
