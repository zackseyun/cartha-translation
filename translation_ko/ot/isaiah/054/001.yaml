  lexicon: HALOT
  rationale: 문맥상 비교 대상은 임신 불가/무자녀 상태의 여인으로 이해되며, 한국어에서 '자식이 없는 여인'이 비교의 요지를 가장 분명하게 전달합니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼의 말씀이다
  alternatives_korean:
  - 야훼께서 말씀하신다
