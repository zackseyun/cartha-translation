  lexicon: HALOT
  rationale: 출산 진통을 뜻하는 문맥을 분명히 드러내기 위해 '산고'를 사용했고, 시적 호칭이 되도록 '여인'을 반복했습니다.
- source_word: בְּנֵי שׁוֹמֵמָה
  english_pob_choice: the children of the desolate woman
  chosen_korean: 자식이 없는 여인
  alternatives_korean:
