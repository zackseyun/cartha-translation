revisions:
- from: 그리고 그에게 쉬지 못하게 하십시오. 그가 예루살렘을 땅에서 찬양거리로 세우기까지, 또 예루살렘을 땅에서 찬양거리로 만들기까지 하십시오.[a][b]
  to: 그분께 쉼을 드리지 마십시오.[a] 그분께서 예루살렘을 굳게 세우시고 예루살렘을 땅에서[b] 찬양이 되게 하실 때까지 그렇게 하십시오.
