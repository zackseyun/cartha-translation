id: ISA.62.7
reference: Isaiah 62:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
  footnotes:
  - marker: a
    text: Or 'give him no silence'; the Hebrew noun can denote 'silence' or 'quiet,' and the expression pictures unceasing appeal to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the land'; Hebrew אֶרֶץ can mean either 'earth' or 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 쉬지 못하게 하십시오. 그가 예루살렘을 땅에서 찬양거리로 세우기까지, 또 예루살렘을 땅에서 찬양거리로 만들기까지 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 잠잠함을 주지 말라’. 히브리어 명사는 ‘침묵’이나 ‘고요’도 뜻할 수 있으며, 여기서는 쉬지 않는 간구의 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에서’. 히브리어 אֶרֶץ는 ‘땅’과 ‘세상/땅’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ
  english_pob_choice: and give him no rest
  chosen_korean: 그에게 쉬지 못하게 하십시오
  alternatives_korean:
  - 그에게 안식을 주지 마십시오
  - 그에게 잠잠함을 주지 마십시오
  lexicon: HALOT
  rationale: דמי는 문자적으로 ‘침묵/고요’도 가능하지만, 문맥상 끊임없이 간구하라는 관용적 표현이므로 한국어에서는 ‘쉬지 못하게 하다’가 가장 자연스럽고 원문의 압박감을 잘 살립니다.
- source_word: יְכוֹנֵ֞ן
  english_pob_choice: he establishes
  chosen_korean: 세우기까지
  alternatives_korean:
  - 굳게 세우기까지
  - 견고히 하기까지
  - 확립하기까지
  lexicon: HALOT
  rationale: כון의 ‘견고하게 하다, 확립하다’ 의미를 살리되, הבא 이어지는 대구와 자연스럽게 맞물리도록 ‘세우다’ 계열로 옮겼습니다.
- source_word: יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה
  english_pob_choice: he makes Jerusalem a praise
  chosen_korean: 예루살렘을 … 찬양거리로 만들기까지
  alternatives_korean:
  - 예루살렘을 … 찬양이 되게 하기까지
  - 예루살렘을 … 칭송거리로 만들기까지
  lexicon: HALOT
  rationale: שׂים + 목적보어 구조를 한국어의 ‘~이 되게 하다/거리로 만들다’로 옮겨, 예루살렘이 ‘찬양의 대상’이 된다는 결과를 드러냈습니다.
- source_word: בָּ/אָֽרֶץ
  english_pob_choice: in the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 온 땅에서
  - 이 땅에서
  - 땅 위에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/세상’ 가능성을 열어 두되, 여기서는 예언적 보편성을 해치지 않는 가장 सीधे한 표현으로 ‘땅에서’를 택했습니다.
theological_decisions:
- issue: 그에게의 지시 대상
  chosen_reading: ‘그’는 직전 문맥의 야훼를 가리키며, 수비수들이 끊임없이 간구하도록 권면하는 표현으로 읽었습니다.
  alternative_readings:
  - 불특정한 신적 대상
  - 예루살렘을 세우는 행위의 주체에 대한 일반적 지시
  rationale: 이 절은 바로 앞절의 ‘야훼께 기억하게 하는 자들’에 이어지므로, 대명사는 계속해서 야훼를 가리킨다고 보는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: Isaiah 62:6-7의 연속 문맥
