id: ISA.62.2
reference: Isaiah 62:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָא֤וּ גוֹיִם֙ צִדְקֵ֔/ךְ וְ/כָל מְלָכִ֖ים כְּבוֹדֵ֑/ךְ וְ/קֹ֤רָא לָ/ךְ֙ שֵׁ֣ם חָדָ֔שׁ אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
  footnotes:
  - marker: a
    text: Or 'your vindication' or 'your justice' for 'your righteousness.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''that the mouth of the LORD will designate it,'' with ''it'' referring to the new name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들은 당신의 의[a]를 보고, 모든 왕은 당신의 영광을 볼 것입니다. 당신은 야훼의 입이 정할 새 이름[b]으로 불릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 문맥상 ‘정당함이 드러남’ 또는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 입이 그것을 정할’이라고 말하며, ‘그것’은 새 이름을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: גוֹיִם
  english_pob_choice: nations
  chosen_korean: 이방 나라들
  alternatives_korean:
  - 나라들
  - 열방
  lexicon: HALOT
  rationale: Isaiah에서 גוים는 대개 이방 민족들의 집합을 가리키므로, 현대 한국어에서는 ‘이방 나라들’이 국제적 범위를 가장 분명하게 드러냅니다.
- source_word: צִדְקֵךְ
  english_pob_choice: your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 의로움
  - 당신의 변호됨
  - 당신의 구제받음
  lexicon: HALOT
  rationale: source가 지닌 צדיק/צדק 계열의 넓은 의미를 살리기 위해 POB의 ‘righteousness’를 따라 ‘의’로 옮겼습니다. ‘변호됨’은 맥락적 가능성을 담지만 의미를 좁히므로 본문에는 두지 않았습니다.
- source_word: כְּבוֹדֵךְ
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신의 존귀
  - 당신의 광채
  lexicon: HALOT
  rationale: 이사야에서 כבוד는 하나님의 구원 행위와 연결된 ‘영광’의 신학적 어휘이므로, 한국어에서도 전통적이면서도 본문의 공개적 드러남을 살리는 ‘영광’이 적합합니다.
- source_word: וְקֹרָא לָךְ שֵׁם חָדָשׁ
  english_pob_choice: and you will be called by a new name
  chosen_korean: 당신은 ... 새 이름으로 불리게 될 것입니다
  alternatives_korean:
  - 사람들이 당신을 새 이름으로 부를 것입니다
  - 새 이름이 당신에게 주어질 것입니다
  lexicon: HALOT
  rationale: 히브리어는 능동형이지만 한국어에서는 수동 표현이 자연스럽고, 다음 절의 ‘야훼의 입’이 그 이름의 근원이므로 ‘불리게 될 것입니다’가 의미를 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’로 유지해 source와의 직접 대응을 보존했습니다.
theological_decisions:
- issue: צִדְקֵךְ의 공적 회복 의미
  chosen_reading: ‘의’로 옮기되, 공적 회복의 뉘앙스를 본문 맥락에 맡깁니다.
  alternative_readings:
  - 당신의 변호됨
  - 당신의 정의
  rationale: 이 구절은 시온의 회복된 상태가 열방 앞에 드러나는 장면이지만, lexical breadth를 좁히지 않기 위해 ‘의’를 선택했습니다. 이는 POB의 ‘righteousness’ 보존 방침과도 맞습니다.
  doctrine_reference: Translation philosophy §5; contested-term guidance on righteousness/justice tension
- issue: 새 이름의 출처를 드러내는 문장 구조
  chosen_reading: ‘야훼의 입이 정하실 새 이름’으로 처리해 이름의 부여 주체를 분명히 했습니다.
  alternative_readings:
  - 야훼의 입이 그것을 부를 새 이름
  - 야훼께서 정하실 새 이름
  rationale: 히브리어는 ‘야훼의 입’이라는 인격적 의인법으로 신적 선언의 권위를 강조하므로, 이를 평평하게 풀어쓰기보다 그대로 살리는 편이 source에 더 충실합니다.
  doctrine_reference: Translation philosophy §1 and §6
