revisions:
- from: 이방 나라들은 당신의 의를 보게 될 것이며, 모든 왕들은 당신의 영광을 보게 될 것입니다. 당신은 야훼의 입이 정하실 새 이름으로 불리게 될 것입니다.[a][b]
  to: 민족들은 당신의 의[a]를 보고, 모든 왕은 당신의 영광을 볼 것입니다. 당신은 야훼의 입이 정할 새 이름[b]으로 불릴 것입니다.
  rationale: ‘민족들’로 גוֹיִם의 중립적 국제 범위를 보존하고, 원문의 의인적 주어 ‘야훼의 입’에 맞게 ‘정할’로 문법을 바로잡았습니다. ‘의’와 ‘영광’은 원문의 어휘적·신학적 폭을 좁히지 않도록 유지했으며, 각주 표지를 해당 어휘에 직접 연결하고 원문의 목적어 지시를 정확히 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:25Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. גוֹיִם은 이 구절에서 특정 종교적 대립을 반드시 뜻하지 않으므로 ‘이방 나라들’보다 ‘민족들’이 중립적이고 원문에 가깝습니다. 또한 ‘야훼의 입’이 문법적 주어이므로 높임 선어말 어미를 쓴 ‘정하실’은 부적절하며 ‘정할’로 고쳐야 합니다. 원문의 병렬과 이름을 정하는 행위도 유지했습니다.
  naturalness: ‘민족들은 … 보고, 모든 왕은 … 볼 것입니다’는 둘째 절의 생략된 동사를 한국어에서 자연스럽게 보충하면서 병렬을 보존합니다. ‘야훼의 입이 정할 새 이름으로 불릴 것입니다’도 현대의 격식 있는 성경 문체로 자연스럽습니다.
  terminology: צִדְקֵךְ는 폭넓은 의미를 유지하도록 ‘의’로, כְּבוֹדֵךְ는 ‘영광’으로, יְהוָה는 프로젝트 표기에 맞추어 ‘야훼’로 유지합니다. נקב의 명명·지정 의미는 ‘정할’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘이방 나라들’은 גוֹיִם의 범위를 불필요하게 ‘이방’으로 한정합니다.
    rationale: 본문은 시온과 대비되는 국제적 ‘민족들/나라들’을 가리키며, ‘이방’이라는 종교적 대립을 명시하지 않습니다.
  - severity: high
    issue: ‘야훼의 입이 정하실’의 높임 선어말 어미 사용이 문법적으로 부정확합니다.
    rationale: 문법상 주어는 ‘야훼의 입’입니다. 원문의 의인적 표현을 보존하려면 비인격 명사 주어에 맞추어 ‘정할’로 써야 합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 붙어 참조 대상이 불명확합니다.
    rationale: ‘의’와 ‘새 이름’ 바로 뒤에 각각 표지를 두어 어휘 및 원문 표현의 대응을 명확히 해야 합니다.
  - severity: medium
    issue: 기존 b 각주는 ‘야훼께서 직접 정하신다’로 의인적 표현을 해설로 평탄화합니다.
    rationale: 히브리어는 명시적으로 ‘야훼의 입’을 말하므로, 각주는 그 표현과 새 이름을 가리키는 남성 단수 목적어의 관계를 밝혀야 합니다.
