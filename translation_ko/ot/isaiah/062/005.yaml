id: ISA.62.5
reference: Isaiah 62:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
  footnotes:
  - marker: a
    text: Or, following an alternate reading reflected by some ancient versions and many interpreters, 'so your builder(s) will marry you.' The Hebrew Masoretic Text reads 'your sons.'
    reason: alternative_reading
translation:
  language: ko
  text: 젊은 남자가 처녀를 아내로 맞이하듯이, 당신의 아들들이 당신을 아내로 맞이할 것이며, 신랑이 신부를 기뻐하듯이 당신의 하나님도 당신을 기뻐하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 일부 고대 역본과 많은 해석자들이 반영하는 다른 읽기에 따라, ‘당신의 건축자들이 당신을 아내로 맞이할 것이다’로 옮길 수도 있습니다. 히브리어 마소라 본문은 ‘당신의 아들들’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל
  english_pob_choice: marries
  chosen_korean: 맞아들이듯이
  alternatives_korean:
  - 장가들듯이
  - 결혼하듯이
  lexicon: HALOT
  rationale: 이 동사는 원뜻이 지배/소유와 관련되지만, 문맥상 결혼을 가리키므로 한국어에서도 혼인 관계를 자연스럽게 드러내는 표현을 택했습니다. '맞아들이다'는 남성이 아내를 맞는 혼인 관용을 살리면서도 과도한 직설성을 피합니다.
- source_word: בְּתוּלָה
  english_pob_choice: virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 미혼의 여인
  lexicon: HALOT
  rationale: 시적 혼인 비유에서 이 단어의 성적·혼인적 구분을 살리기 위해 '처녀'를 택했습니다. 한국어에서 가장 직접적이고 널리 이해되는 대응입니다.
- source_word: בָּנָיִךְ
  english_pob_choice: your sons
  chosen_korean: 당신의 아들들도
  alternatives_korean:
  - 당신의 자녀들도
  - 당신의 건축자들도
  lexicon: HALOT
  rationale: 마소라 본문의 음가는 '당신의 아들들'이므로 이를 본문에 유지했습니다. 예언적 의인화가 낯설더라도 원문의 어색함을 지우지 않는 것이 중요합니다.
- source_word: חָתָן / כַּלָּה
  english_pob_choice: bridegroom / bride
  chosen_korean: 신랑 / 신부
  alternatives_korean:
  - 혼인하는 남자 / 혼인한 여자
  lexicon: HALOT
  rationale: 결혼 시의 표준 대응어를 사용해 시적 대구를 선명하게 살렸습니다. 한국어 관용에서도 가장 자연스럽습니다.
- source_word: יָשִׂישׂ
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하십니다
  alternatives_korean:
  - 즐거워하십니다
  - 환호하십니다
  lexicon: HALOT
  rationale: 동사의 강한 기쁨을 한국어에서 가장 자연스럽게 표현하는 동사로 옮겼습니다. 앞의 비교 구조와 평행을 이루도록 현재형 서술로 매끈하게 처리했습니다.
theological_decisions:
- issue: 말미의 'your God'를 어떻게 표시할지
  chosen_reading: 당신의 하나님
  alternative_readings:
  - 당신의 신들
  - 하나님
  rationale: 본문의 אֱלֹהָיִךְ는 형태상 복수형이지만 문맥상 이사야의 이스라엘 하나님을 가리키는 단수 의미입니다. 따라서 한국어도 단수로 번역해 언약적 관계를 분명히 했습니다.
  doctrine_reference: 이스라엘의 하나님에 대한 단수 지칭, 사 62:5 문맥
