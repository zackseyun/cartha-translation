  to: 젊은 남자가 처녀를 아내로 맞이하듯이, 당신의 아들들이 당신을 아내로 맞이할 것이며, 신랑이 신부를 기뻐하듯이 당신의 하나님도 당신을 기뻐하실 것입니다.[a]
