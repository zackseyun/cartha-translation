id: ISA.62.6
reference: Isaiah 62:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
  footnotes:
  - marker: a
    text: Or 'you who call on the LORD' or 'you who put the LORD in remembrance.' The Hebrew expression is unusually vivid, portraying persistent appeal to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘아, 내가 네 성벽 위에 파수꾼들을 세웠습니다. 그들은 하루 종일, 밤새도록, 언제나 결코 잠잠하지 않을 것입니다. 야훼께 기억나게 하는 이들이여[a], 너희 자신에게 쉼을 주지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼께 기억나게 하는 이들’은 히브리어의 생생한 표현을 따른 것입니다. ‘야훼를 기억나게 하는 이들’ 또는 ‘야훼를 부르는 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  english_pob_choice: your walls
  chosen_korean: 네 성벽 위에
  alternatives_korean:
  - 네 담장 위에
  - 네 성벽들 위에
  lexicon: HALOT
  rationale: חוֹמָה는 도시를 둘러싼 성벽/방벽을 가리키므로, 예루살렘의 방어 구조를 살리는 ‘성벽’이 가장 자연스럽습니다. 전치사는 위치 관계를 분명히 하는 ‘위에’로 옮겼습니다.
- source_word: הִפְקַדְתִּי
  english_pob_choice: I have appointed
  chosen_korean: 내가 세웠습니다
  alternatives_korean:
  - 내가 임명했습니다
  - 내가 배치했습니다
  lexicon: HALOT
  rationale: 히필형 פקד는 여기서 임명·배치·지정의 뜻이므로, 파수 임무를 맡겨 두었다는 의미를 간결하게 드러내는 ‘세웠습니다’가 적절합니다.
- source_word: שֹׁמְרִים
  english_pob_choice: watchmen
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 지키는 자들
  - 감시자들
  lexicon: HALOT
  rationale: 도시 성벽에 배치된 감시 인원을 가리키는 관용적 표현이므로, 한국어 성경에서도 익숙하고 군사적·도시적 이미지를 유지하는 ‘파수꾼들’을 택했습니다.
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  english_pob_choice: You who remind Yahweh
  chosen_korean: 야훼를 상기시키는 사람들아
  alternatives_korean:
  - 야훼를 기억나게 하는 사람들아
  - 야훼를 부르짖는 사람들아
  - 야훼를 기억하게 하는 사람들아
  lexicon: HALOT
  rationale: זכר의 히필은 ‘기억하게 하다/상기시키다’의 뜻이므로, 영어 POB의 긴장을 살려 직역 쪽에 가까운 ‘상기시키는 사람들’로 옮겼습니다. ‘부르짖다’는 해석을 앞세워 원문 이미지를 약화할 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 하나님의 고유명사 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭인 ‘주님’과 구별했습니다.
- source_word: אַל דֳּמִי לָכֶם
  english_pob_choice: take no rest for yourselves
  chosen_korean: 스스로 쉬지 마십시오
  alternatives_korean:
  - 자신들을 위해 쉬지 마십시오
  - 잠잠하지 마십시오
  - 쉬지 마십시오
  lexicon: HALOT
  rationale: דֳּמִי는 침묵·고요·멈춤의 의미를 담고 있으며, לָכֶם은 자기들을 향한 권고를 더합니다. 한국어로는 자연스러운 명령형인 ‘스스로 쉬지 마십시오’가 지속적 간구의 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: ‘파수꾼들’과 ‘야훼를 상기시키는 사람들’의 정체
  chosen_reading: 특정 집단(천사, 예언자, 제사장, 중보자)을 단정하지 않고, 본문의 비유적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 천사적 파수꾼
  - 예언자적 파수꾼
  - 기도하는 인간 중보자
  rationale: 히브리어는 상징적 표현을 사용하지만 수신자를 명시하지 않으므로, 번역이 해석을 앞서지 않도록 했습니다.
  doctrine_reference: 해석을 고정하지 않고 본문의 긴장을 보존
