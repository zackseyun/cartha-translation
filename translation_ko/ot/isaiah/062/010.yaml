source:
  edition: WLC
  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
  footnotes:
  - marker: a
    text: Or 'prepare the way for the people.'
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'Cast up, cast up the highway.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Raise a standard over the peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 문들을 지나가십시오, 지나가십시오. 백성을 위해 길을 닦으십시오[a]. 큰길을 쌓아 올리십시오, 쌓아 올리십시오[b]. 돌을 치우십시오. 민족들 위에 깃발을 세우십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성을 위해 길을 준비하십시오.’
    reason: lexical_alternative
  - marker: b
    text: 전통적인 영어 번역은 ‘큰길을 돋우십시오, 돋우십시오’로 옮깁니다.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘민족들 위에 기치를 세우십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ בַּשְּׁעָרִים
  english_pob_choice: Pass through, pass through the gates
  chosen_korean: 성문들을 지나가십시오, 지나가십시오
  alternatives_korean:
  - 문들을 지나가십시오, 지나가십시오
  - 성문으로 들어가십시오, 들어가십시오
  lexicon: HALOT
  rationale: עבר의 반복 명령을 살려 ‘지나가십시오’를 반복했고, בַּשְּׁעָרִים는 도시 성문을 가리키는 자연스러운 한국어인 ‘성문들’로 옮겼습니다.
- source_word: פַּנּוּ דֶּרֶךְ הָעָם
  english_pob_choice: clear the way for the people
  chosen_korean: 백성을 위한 길을 닦으십시오
  alternatives_korean:
  - 백성을 위해 길을 준비하십시오
  - 백성을 위한 길을 마련하십시오
  lexicon: HALOT
  rationale: פנה의 ‘길을 비우다/정비하다’라는 뜻을 살려, 현대 독자가 이해하기 쉬운 ‘길을 닦으십시오’로 옮겼습니다. הָעָם는 여기서 특정 집단인 백성을 가리키므로 ‘백성’으로 렌더링했습니다.
- source_word: סֹלּוּ סֹלּוּ הַמְסִלָּה
  english_pob_choice: Build up, build up the highway
  chosen_korean: 쌓아 올리십시오, 쌓아 올리십시오. 큰길을
  alternatives_korean:
  - 길을 높이 쌓으십시오, 높이 쌓으십시오. 큰길을
  - 큰길을 쌓아 올리십시오, 쌓아 올리십시오
  lexicon: HALOT
  rationale: סלל의 도로 비유를 살려 ‘쌓아 올리다’로 옮겼고, הַמְסִלָּה는 단순한 길보다 잘 닦인 도로의 뉘앙스를 담는 ‘큰길’로 옮겼습니다.
- source_word: סַקְּלוּ מֵאֶבֶן
  english_pob_choice: clear it of stones
  chosen_korean: 돌들을 치우십시오
  alternatives_korean:
  - 돌을 치우십시오
  - 돌들로부터 치우십시오
  lexicon: HALOT
  rationale: סקל의 ‘돌을 제거하다’라는 뜻을 직접 살려 간결하게 옮겼습니다. 한국어에서는 대상이 분명하므로 영어의 it에 해당하는 말을 덧붙이지 않아도 의미가 유지됩니다.
- source_word: הָרִימוּ נֵס
  english_pob_choice: Raise up a banner
  chosen_korean: 깃발을 세우십시오
  alternatives_korean:
  - 기치를 세우십시오
  - 표지를 높이십시오
  lexicon: HALOT
  rationale: נֵס는 표지, 기호, 깃발/기치의 범위를 가지며, 공적인 호출 기능을 가장 자연스럽게 드러내는 현대 한국어로 ‘깃발’을 택했습니다.
theological_decisions:
- issue: עָם / עַמִּים의 구별
  chosen_reading: ‘백성’은 예루살렘/시온의 사람들을, ‘민족들’은 그 바깥의 여러 민족들을 가리키는 구별을 유지했습니다.
  alternative_readings:
  - 둘 다 같은 집단으로 볼 수 있습니다
  - 둘 다 포괄적으로 인류 전체를 가리킨다고 볼 수 있습니다
  rationale: 히브리어 본문은 단수 집합명사 הָעָם에서 복수 עַמִּים으로 의도적으로 전환합니다. 한국어에서도 이 대조를 보존해야 예언의 시선이 백성을 위한 길과 민족들을 향한 깃발이라는 두 층위를 함께 드러냅니다.
  doctrine_reference: 예언적 보편성
