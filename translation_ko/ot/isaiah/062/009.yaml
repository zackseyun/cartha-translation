source:
  edition: WLC
  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
  footnotes:
  - marker: a
    text: Or 'For those who gather it will eat it.' The Hebrew כִּי can also be rendered 'for' or 'indeed'; here it is taken adversatively in light of the contrast with the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the courtyards of my holy place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 곡식을 거두는 자들은 그것을 먹고 야훼를 찬양하며, 그것을 모으는 자들은 내 성소의 뜰에서 그것을 마실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 거두는 자들을 위하여, 곧 그들이 먹을 것이다.’ 히브리어 כִּי는 ‘for/indeed’로도 옮길 수 있으나, 여기서는 앞절과의 대비를 따라 역접으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 거룩한 곳의 뜰에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 이는
  - for
  lexicon: HALOT
  rationale: 문맥상 앞절의 경고와 대조를 이루므로, 한국어에서는 역접을 분명히 드러내는 ‘그러나’가 가장 자연스럽습니다.
- source_word: מְאַסְפָי/ו
  english_pob_choice: those who gather it
  chosen_korean: 그 곡식을 거두는 자들
  alternatives_korean:
  - 그것을 거두는 자들
  - 수확하는 자들
  lexicon: HALOT
  rationale: 동사의 주체를 살리되, 3인칭 목적어가 앞맥락의 생산물(곡식)을 가리키므로 ‘그 곡식’을 보충해 의미를 분명하게 했습니다.
- source_word: וְהִלְּלוּ אֶת־יְהוָה
  english_pob_choice: and praise Yahweh
  chosen_korean: 야훼를 찬양하며
  alternatives_korean:
  - 야훼를 찬송하며
  - 주를 찬양하며
  lexicon: HALOT
  rationale: הלל의 기본 뜻은 ‘찬양하다’이므로 이를 직접 살렸고, 여호와가 아닌 본문 기반 표기인 ‘야훼’를 유지했습니다.
- source_word: בְּחַצְרוֹת קָדְשִׁי
  english_pob_choice: in the courts of my sanctuary
  chosen_korean: 내 성소의 뜰에서
  alternatives_korean:
  - 내 거룩한 곳의 뜰에서
  - 내 성전 뜰에서
  lexicon: HALOT
  rationale: חצרות는 ‘뜰’이고, קדשׁ은 추상적 ‘거룩함’보다 예배 공간을 가리키는 ‘성소’로 보는 것이 문맥에 가장 잘 맞습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용하는 신명 יהוה를 보존하기 위해 프로젝트 기본값대로 ‘야훼’를 유지했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: 성소의 공간성
  chosen_reading: 내 성소의 뜰
  alternative_readings:
  - 내 거룩한 곳의 뜰
  - 내 성전의 뜰
  rationale: 문맥은 추상적 ‘거룩함’보다 예배가 실제로 이루어지는 성소의 공간을 말하므로, 예전적 장소성을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §6
