source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
  footnotes:
  - marker: a
    text: Or “your savior comes.” The Hebrew reads “your salvation,” but the following phrases use masculine pronouns (“his reward… his recompense”), which may personify salvation in the coming deliverer.
    reason: alternative_reading
translation:
  language: ko
  text: 보라, 야훼께서 땅 끝까지 선포하셨습니다. 「시온의 딸에게 말하라. 보라, 네 구원이 오고 있다. 보라, 그의 보상이 그와 함께 있고, 그의 보응이 그의 앞에 있다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 구세주가 오고 있다.” 히브리어는 문자적으로 “네 구원”이지만, 뒤의 표현들은 오는 분을 인격적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יהוה를 제목이 아닌 고유 이름으로 드러내기 위해, 영어 POB의 'Yahweh'에 맞춰 한국어도 '야훼'로 옮겼습니다.
- source_word: הִשְׁמִיעַ
  english_pob_choice: has proclaimed
  chosen_korean: 선포하셨습니다
  alternatives_korean:
  - 알리셨습니다
  - 외치셨습니다
  lexicon: HALOT
  rationale: 히필형의 '듣게 하다/공표하다'는 공개적 선언을 가리키므로, 예언적 맥락에 맞는 '선포하셨습니다'가 가장 자연스럽습니다.
- source_word: יִשְׁעֵךְ
  english_pob_choice: your salvation
  chosen_korean: 네 구원
  alternatives_korean:
  - 네 구세주
  - 네 구출
  lexicon: HALOT
  rationale: 본문의 직접적인 형태는 여성 단수 접미사를 가진 명사구이므로, 영어 POB처럼 मुख्य text에서는 인격화 가능성을 해설하지 않고 '구원'을 유지했습니다.
- source_word: שְׂכָרוֹ / וּפְעֻלָּתוֹ
  english_pob_choice: his reward / his recompense
  chosen_korean: 그의 보상 / 그의 보응
  alternatives_korean:
  - 그의 삯 / 그의 갚음
  - 그의 상급 / 그의 대가
  lexicon: HALOT
  rationale: 두 명사는 의미가 겹치지만 동일어 반복을 피하려는 평행법이므로, 각각 '보상'과 '보응'으로 구분해 원문의 대응 구조를 살렸습니다.
theological_decisions:
- issue: '''your salvation''를 인격적 ''your savior''로 풀지 여부'
  chosen_reading: 본문에는 '네 구원'을 유지하고, 인격화는 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 네 구세주
  - 네 구원자
  rationale: 히브리어 형태는 명사 '구원'이 직접적이며, 뒤의 남성형 소유격들이 구원을 가져오는 분을 암시할 수는 있어도 본문이 그 해석을 강제하지는 않습니다. 따라서 원문 우선 원칙에 따라 한국어 본문은 명사형을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
