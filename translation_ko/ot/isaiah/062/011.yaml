review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 פְעֻלָּתוֹ는 이 문맥에서 앞의 שְׂכָרוֹ와 병행하는 ‘보상/갚음’인데, 현대 한국어의 ‘보응’은 주로 부정적인 응징을 뜻하므로 원문의 중립적 의미를 부당하게 좁힙니다. 또한 인용문 안의 명령과 선언을 합쇼체로 통일하는 편이 목표 등록에 맞습니다.
  naturalness: ‘그의 보응’은 현대어에서 자연스럽지 않고 오해를 낳을 수 있습니다. ‘그의 갚음’은 문어적이지만 중립적이며 예언서의 병행 표현을 유지합니다. ‘말하십시오’, ‘옵니다’, ‘있습니다’로 인용문을 현대 formal-polite 합쇼체로 정리했습니다.
  terminology: ‘야훼’, ‘시온의 딸’, ‘네 구원’은 원문 및 POB의 선택을 잘 반영합니다. ‘네 구원’을 유지하여 명사형 원문과, 뒤따르는 남성 단수 소유 접미사가 빚는 인격화 가능성을 모두 열어 둡니다.
  issues:
  - severity: medium
    issue: ‘그의 보응’
    rationale: 보응은 현대 한국어에서 대체로 악행에 대한 응징·징벌을 의미합니다. פְעֻלָּתוֹ는 여기서 שְׂכָרוֹ와 평행하는 보상 또는 갚음이므로, 부정적 의미가 강한 역어는 피하는 것이 안전합니다.
  - severity: low
    issue: 인용문 내부의 종결·명령 표현이 합쇼체와 불일치
    rationale: 번역의 지정 등록이 현대 formal-polite 합쇼체인데 ‘말하라’, ‘오고 있다’, ‘있고’, ‘있다’가 혼재합니다. 의미 변화 없이 합쇼체로 통일할 수 있습니다.
  revised_text: 보라, 야훼께서 땅 끝까지 선포하셨습니다. 「시온의 딸에게 말하십시오. 보라, 네 구원이 옵니다. 보라, 그의 보상이 그와 함께 있으며, 그의 갚음이 그의 앞에 있습니다」[a]
  revised_footnotes:
  - marker: a
    text: 또는 “네 구세주가 옵니다.” 히브리어는 문자적으로 “네 구원”입니다. 그러나 뒤의 “그의 보상”, “그의 갚음”에 쓰인 남성 단수 소유 접미사는 구원이 오는 구원자로 인격화되었을 가능성을 시사할 수 있습니다.
    reason: alternative_reading
