id: ISA.62.4
reference: Isaiah 62:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
  footnotes:
  - marker: a
    text: 'Hebrew: Hephzibah, meaning ''My Delight Is in Her.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: Beulah, meaning ''Married.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 더 이상 너를 버림받은 자라 부르지 않을 것이며, 네 땅을 다시는 황무지라 부르지 않을 것입니다. 오히려 너는 「나의 기쁨이 그에게 있다」라 불릴 것이며, 네 땅은 「결혼한 땅」이라 불릴 것입니다. 이는 야훼께서 너를 기뻐하시고, 네 땅은 결혼하게 될 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 Hephzibah의 뜻은 ‘나의 기쁨이 그에게 있다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 Beulah의 뜻은 ‘결혼한’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  english_pob_choice: Forsaken
  chosen_korean: 버림받은 자
  alternatives_korean:
  - 버림받은
  - 버려진 자
  - 버림받은 여자
  lexicon: HALOT
  rationale: 남겨짐/버려짐의 수동적 의미를 살리면서, 이름처럼 불리는 용례를 한국어에서 자연스럽게 드러내기 위해 ‘버림받은 자’로 옮겼습니다.
- source_word: שְׁמָמָה
  english_pob_choice: Desolate
  chosen_korean: 황무지
  alternatives_korean:
  - 황폐함
  - 폐허
  - 버려진 땅
  lexicon: HALOT
  rationale: 이 단어는 여기서 땅의 상태를 가리키는 명칭이므로, 추상명사보다 장소성을 가진 ‘황무지’가 평행구조를 더 잘 살립니다.
- source_word: חֶפְצִי בָהּ
  english_pob_choice: My Delight Is in Her
  chosen_korean: 나의 기쁨이 그에게 있다
  alternatives_korean:
  - 나의 기쁨은 그에게 있다
  - 헤프지바
  - 나의 즐거움이 그에게 있다
  lexicon: HALOT
  rationale: 의미를 담은 새 이름이므로 음역보다 번역이 적절합니다. 다만 지시대상은 ‘도성/땅’의 의인화 맥락상 한국어에서 ‘그’보다 중성적 ‘그에게’로 처리했습니다.
- source_word: בְּעוּלָה
  english_pob_choice: Married
  chosen_korean: 결혼한 땅
  alternatives_korean:
  - 시집간
  - 배필이 있는
  - 베울라
  lexicon: HALOT
  rationale: 명칭처럼 쓰인 형용사이지만, 한국어에서는 단독의 ‘결혼한’보다 대상이 분명한 ‘결혼한 땅’이 평행법을 드러내기 쉽습니다.
- source_word: חָפֵץ יְהוָה בָּךְ
  english_pob_choice: Yahweh delights in you
  chosen_korean: 야훼께서 너를 기뻐하시고
  alternatives_korean:
  - 야훼께서 너를 기뻐하시며
  - 야훼께서 너를 기뻐하십니다
  - 주님께서 너를 기뻐하시고
  lexicon: HALOT
  rationale: חָפֵץ의 핵심은 ‘기뻐하다/즐기다’이므로, 관계의 호의를 분명히 드러내는 ‘기뻐하시고’로 옮겼습니다. 여호와 대신 기본값인 ‘야훼’를 유지했습니다.
- source_word: תִּבָּעֵל
  english_pob_choice: will be married
  chosen_korean: 결혼하게 될 것이기
  alternatives_korean:
  - 남편을 맞게 될 것이기
  - 결혼될 것이기
  - 배필을 맞이할 것이기
  lexicon: HALOT
  rationale: 니팔의 수동·상태 의미를 살리되, 현대 한국어에서 과도하게 직설적이지 않게 ‘결혼하게 될 것’으로 풀었습니다.
theological_decisions:
- issue: 예언적 새 이름의 번역 방식
  chosen_reading: 의미를 가진 새 이름을 한국어로 번역해 본문에 제시했습니다.
  alternative_readings:
  - 헤프지바와 베울라 같은 음역을 본문에 두기
  - 의미를 풀어 설명문으로만 처리하기
  rationale: 히브리어의 수사적 장치가 이름 자체의 의미에 있으므로, 독자가 즉시 이해하도록 번역을 유지하되 전통 음역은 본문 밖으로 두는 편이 소스의 힘을 보존합니다.
  doctrine_reference: '번역 원칙: 원어 의미 우선, 수사적 이름은 번역 유지'
- issue: 성별/의인화 표현
  chosen_reading: ‘너’와 ‘네 땅’을 구분해 유지하고, 새 이름은 문맥상 의인화된 도성의 언어로 처리했습니다.
  alternative_readings:
  - 모두 ‘이스라엘’로 평탄화하기
  - 땅의 인격화를 약화시키기
  rationale: 본절은 시온/땅을 여성 의인화하여 혼인 은유로 회복을 말하므로, 이를 약화시키면 예언의 상징성과 언약적 회복 이미지가 손상됩니다.
  doctrine_reference: 예언서의 상징 언어 보존
