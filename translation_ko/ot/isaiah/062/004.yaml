  verdict: revise
  source_fidelity: 수정이 필요합니다. חֶפְצִי בָהּ의 בָּהּ는 여성 단수 대명사이므로, 의인화된 시온을 가리키는 이름은 ‘그에게’가 아니라 ‘그녀에게’로 옮겨야 합니다. 또한 בְּעוּלָה는 땅에 붙는 새 이름 자체이므로 ‘결혼한 땅’이라고 이름 안에 ‘땅’을 덧붙이기보다 ‘결혼한’으로 제시하는 편이 원문의 명명 구조를 보존합니다. 마지막 תִּבָּעֵל의 혼인 은유도 직접 유지했습니다.
  naturalness: 합쇼체 문체를 일관되게 적용하고, 각주 표지를 해당 이름 바로 뒤에 배치했습니다. ‘결혼한’은 이름으로 단독 제시될 때 다소 압축적이지만, 원문의 시적 명명과 이어지는 땅의 의인화·혼인 은유를 가장 직접적으로 보존합니다.
  terminology: 야훼는 יהוה의 번역으로 유지했습니다. ‘버림받은 자’, ‘황무지’, ‘내 기쁨은 그녀에게 있다’, ‘결혼한’은 모두 번역된 상징적 새 이름으로 처리했습니다. 전통적 음역은 각주에만 제시했습니다.
