base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''If I give your grain ... and if the sons of a foreign land drink your new wine ...''—an oath formula in which ''if'' expresses a strong negation: ''surely I will not.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'mighty arm.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of a foreign land,' that is, foreigners.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 오른손과 그의 강한 팔로 맹세하셨습니다. "내가 다시는 네 곡식을 네 원수들의 먹을거리로 주지 않겠고, 네가 수고하여 얻은 새 포도주를 이방 사람들이 마시지 못하게 하겠습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내가 네 곡식을 ... 주면, 그리고 이방 땅의 아들들이 네 새 포도주를 마시면 ...”이라는 맹세 공식입니다. 여기서는 강한 부정을 뜻합니다.
    reason: source_note
  - marker: b
    text: 직역하면 “강한 팔”입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 “이방 땅의 아들들”은 곧 외국인들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms table
  rationale: POB의 기본 방침에 따라 하나님의 이름은 '야훼'로 옮겨 언약적 고유성을 보존했습니다.
- source_word: בִּימִינוֹ
  english_pob_choice: by his right hand
  chosen_korean: 그의 오른손으로
  alternatives_korean:
  - 그의 오른편 손으로
  - 그의 오른손가락으로
  lexicon: HALOT
  rationale: 맹세 공식으로 쓰인 신체 표지는 한국어에서도 자연스럽게 '오른손'으로 옮기는 것이 가장 직접적입니다.
- source_word: וּבִזְרֹעַ עֻזּוֹ
  english_pob_choice: and by his strong arm
  chosen_korean: 그의 강한 팔로
  alternatives_korean:
  - 그의 능한 팔로
  - 그의 힘센 팔로
  lexicon: HALOT
  rationale: עֹז의 '힘/강함'을 살려 직역에 가까우면서도 현대 한국어에서 자연스러운 '강한 팔'을 선택했습니다.
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  english_pob_choice: I will never again give ... nor will foreigners drink ...
  chosen_korean: 내가 다시는 ... 주지 않겠고 ... 마시지 못하게 하겠습니다
  alternatives_korean:
  - 내가 ... 준다면 ... 마시게 되면
  - 내가 결코 ... 주지 않겠고 ... 마시지 않게 하겠습니다
  lexicon: HALOT
  rationale: 맹세문에서 אִם이 강한 부정을 뜻하므로, 문법적으로 드러난 'if'를 그대로 두지 않고 실제 의미인 부정을 한국어로 명시했습니다.
- source_word: בְנֵי נֵכָר
  english_pob_choice: foreigners
  chosen_korean: 이방 사람들
  alternatives_korean:
  - 외국인들
  - 타국 사람들
  lexicon: HALOT
  rationale: 문맥상 'foreigners'의 집단적 의미를 살리되, 성경적 표현으로 과도하게 낯설지 않은 '이방 사람들'을 택했습니다.
theological_decisions:
- issue: 맹세문의 עתיד/조건형 표현을 한국어에서 어떻게 처리할지
  chosen_reading: 실제 의미인 확정적 부정으로 옮기고, 예언자적 약속의 단호함을 살렸습니다.
  alternative_readings:
  - 형식대로 '내가 준다면 ... 마신다면 ...'로 옮김
  - 완곡하게 '다시는 ... 않게 할 것입니다'로 약화
  rationale: 히브리어의 oath formula는 조건절 형태를 빌린 강한 부정이므로, 독자가 오해하지 않도록 한국어에서는 약속의 결단을 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
