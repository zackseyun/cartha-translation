id: ISA.62.12
reference: Isaiah 62:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָרְא֥וּ לָ/הֶ֛ם עַם הַ/קֹּ֖דֶשׁ גְּאוּלֵ֣י יְהוָ֑ה וְ/לָ/ךְ֙ יִקָּרֵ֣א דְרוּשָׁ֔ה עִ֖יר לֹ֥א נֶעֱזָֽבָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
  footnotes:
  - marker: a
    text: Or “the LORD’s redeemed” or “those redeemed by the LORD.”
    reason: lexical_alternative
  - marker: b
    text: “Sought Out” may also be rendered “Sought After” or “Inquired For.”
    reason: lexical_alternative
  - marker: c
    text: Or “a city not abandoned.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 그들을 「거룩한 백성, 야훼의 구속받은 자들」이라고 부를 것이며, 너는 「찾아낸 성읍, 버림받지 않은 성읍」이라고 불릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 구속하신 자들”, 혹은 “야훼께서 속량하신 자들”이라고도 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “찾아낸”은 “찾아 구한”, “찾아낸 자” 또는 “찾아낸 성읍”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “버려지지 않은 성읍”이라고도 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הַקֹּדֶשׁ
  english_pob_choice: The holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 거룩한 사람들
  - 거룩한 민족
  lexicon: HALOT
  rationale: עַם은 여기서 집합 명사로서 ‘백성’이 가장 자연스럽고, הַקֹּדֶשׁ은 직역해 ‘거룩한’으로 유지해 명칭적 성격을 살렸습니다.
- source_word: גְּאוּלֵי יְהוָה
  english_pob_choice: the redeemed of Yahweh
  chosen_korean: 야훼의 구속받은 자들
  alternatives_korean:
  - 야훼께 구속받은 자들
  - 야훼의 속량된 자들
  lexicon: HALOT
  rationale: גְּאוּלֵי는 완료된 구속 상태를 드러내는 명사적 표현이므로 ‘구속받은 자들’로 옮겼고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
- source_word: דְרוּשָׁה
  english_pob_choice: Sought Out
  chosen_korean: 찾아낸
  alternatives_korean:
  - 찾으심을 받은
  - 찾아 구한
  lexicon: HALOT
  rationale: דרשׁ의 ‘찾다, അന്വേഷ하다’ 의미를 살리되, 도시의 새 호칭이라는 점을 반영해 간결한 명칭형 표현인 ‘찾아낸’으로 처리했습니다.
- source_word: עִיר לֹא נֶעֱזָבָה
  english_pob_choice: a city not forsaken
  chosen_korean: 버림받지 않은 성읍
  alternatives_korean:
  - 버려지지 않은 성읍
  - 버림받지 않은 도시
  lexicon: HALOT
  rationale: נֶעֱזָבָה는 문맥상 ‘버리다/떠나다’의 수동형이므로 ‘버림받지 않은’이 가장 직접적이고, 성읍은 예언서 문체에 맞게 ‘성읍’으로 유지했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 사역용 대체어가 아니라 여호와/야훼 이름 자체를 담고 있으므로, 프로젝트 기본 방침에 따라 고유명적 언약 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘Sought Out’의 명칭성 여부
  chosen_reading: ‘찾아낸’은 도시의 새 칭호로 읽히는 명칭형 표현으로 처리했습니다.
  alternative_readings:
  - 찾아진
  - 찾으심을 받은
  rationale: 이 표현은 단순 서술이 아니라 시온의 회복을 선포하는 호칭이므로, 제목처럼 읽히도록 대문자화 대신 한국어에서는 따옴표와 간결한 명칭형을 사용했습니다.
  doctrine_reference: Isaiah restoration oracle / titular naming formula
