  rationale: חשׁה의 기본 의미인 ‘침묵하다/잠잠하다’를 직접 반영했고, 장차 계속될 의지를 나타내는 미래형 부정으로 처리했습니다.
- source_word: אֶשְׁקֹט
  english_pob_choice: I will not be quiet
  chosen_korean: 나는 쉬지 않겠습니다
  alternatives_korean:
  - 나는 고요하지 않겠습니다
  - 나는 가만히 있지 않겠습니다
  lexicon: HALOT
  rationale: שׁקט의 ‘고요하다, 가만하다, 쉬다’ 범위를 고려하되, English POB가 ‘rest’보다 ‘be quiet’를 택해 지속적 비중단을 강조한 점에 따라 ‘쉬지 않겠습니다’로 옮겼습니다.
- source_word: כַנֹּגַהּ
  english_pob_choice: like brightness
  chosen_korean: 광명처럼
  alternatives_korean:
  - 밝음처럼
  - 빛남처럼
  - 새벽빛처럼
  lexicon: HALOT
  rationale: נֹגַהּ의 ‘광휘/밝음’ 이미지를 한국어에서 가장 간결하게 살릴 수 있는 표현을 선택했습니다. '새벽빛'은 의미를 좁힐 수 있어 피했습니다.
- source_word: צִדְקָהּ
  english_pob_choice: her righteousness
  chosen_korean: 그 의
  alternatives_korean:
  - 그 의로움
  - 그 옳음
  - 그 의인됨
  lexicon: HALOT
  rationale: צדקה는 본래 의로움과 공적 변호/신원(vindication)의 여지를 함께 가지므로, 번역은 기본값인 ‘의’를 쓰되 소유격으로 ‘그’의 인격화된 회복 이미지를 보존했습니다.
- source_word: וִישׁוּעָתָהּ
  english_pob_choice: and her salvation
  chosen_korean: 그 구원
  alternatives_korean:
  - 그 구출
  - 그 해방
  - 그 구제
  lexicon: HALOT
  rationale: ישועה를 ‘구원’으로 옮겨 신학적 폭과 회복의 의미를 유지했습니다. 문맥상 공적 회복의 뉘앙스도 함께 담을 수 있습니다.
- source_word: כְלַפִּיד
  english_pob_choice: like a torch
  chosen_korean: 횃불처럼
  alternatives_korean:
  - 등불처럼
  - 불꽃처럼
  - 토치처럼
  lexicon: HALOT
  rationale: לַפִּיד는 작은 등불보다 공적으로 타오르는 횃불에 가깝기 때문에, 시각적·상징적 힘을 살리는 ‘횃불처럼’을 택했습니다.
