id: ISA.62.1
reference: Isaiah 62:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
  footnotes:
  - marker: a
    text: Or 'I will not rest' for 'I will not be quiet.' The Hebrew verb can carry the sense of being quiet, still, or at rest.
    reason: lexical_alternative
  - marker: b
    text: Or 'her vindication' for 'her righteousness.' The Hebrew can denote righteousness in a moral/covenantal sense or public vindication.
    reason: lexical_alternative
  - marker: c
    text: The speaker is not explicitly identified in the verse; interpreters differ on whether this is the prophet, the LORD, or another representative voice.
    reason: alternative_reading
translation:
  language: ko
  text: 시온의 연고로 나는 잠잠하지 않겠습니다. 예루살렘의 연고로 나는 쉬지 않겠습니다. 그 의가 광명처럼, 그 구원이 횃불처럼 빛날 때까지는 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠잠하지 않겠습니다’에 대하여 ‘쉬지 않겠습니다’로도 옮길 수 있습니다. 히브리어 동사는 잠잠함, 고요함, 쉼의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 의로움’ 또는 ‘그 신원됨’으로도 옮길 수 있습니다. 히브리어는 도덕적·언약적 의와 공적 변호의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 화자는 본문에서 명시되지 않으며, 예언자, 야훼, 또는 다른 대표적 화자라는 해석이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: for … sake
  chosen_korean: …의 연고로
  alternatives_korean:
  - …을/를 위하여
  - …때문에
  lexicon: HALOT
  rationale: 목적·동기 표지를 살리면서도 시온/예루살렘과의 병렬을 자연스럽게 유지하는 한국어 표현으로 옮겼습니다.
- source_word: אֶחֱשֶׁה
  english_pob_choice: I will not keep silent
  chosen_korean: 나는 잠잠하지 않겠습니다
  alternatives_korean:
  - 나는 침묵하지 않겠습니다
  - 나는 말없이 있지 않겠습니다
  lexicon: HALOT
  rationale: חשׁה의 기본 의미인 ‘침묵하다/잠잠하다’를 직접 반영했고, 장차 계속될 의지를 나타내는 미래형 부정으로 처리했습니다.
- source_word: אֶשְׁקֹט
  english_pob_choice: I will not be quiet
  chosen_korean: 나는 쉬지 않겠습니다
  alternatives_korean:
  - 나는 고요하지 않겠습니다
  - 나는 가만히 있지 않겠습니다
  lexicon: HALOT
  rationale: שׁקט의 ‘고요하다, 가만하다, 쉬다’ 범위를 고려하되, English POB가 ‘rest’보다 ‘be quiet’를 택해 지속적 비중단을 강조한 점에 따라 ‘쉬지 않겠습니다’로 옮겼습니다.
- source_word: כַנֹּגַהּ
  english_pob_choice: like brightness
  chosen_korean: 광명처럼
  alternatives_korean:
  - 밝음처럼
  - 빛남처럼
  - 새벽빛처럼
  lexicon: HALOT
  rationale: נֹגַהּ의 ‘광휘/밝음’ 이미지를 한국어에서 가장 간결하게 살릴 수 있는 표현을 선택했습니다. '새벽빛'은 의미를 좁힐 수 있어 피했습니다.
- source_word: צִדְקָהּ
  english_pob_choice: her righteousness
  chosen_korean: 그 의
  alternatives_korean:
  - 그 의로움
  - 그 옳음
  - 그 의인됨
  lexicon: HALOT
  rationale: צדקה는 본래 의로움과 공적 변호/신원(vindication)의 여지를 함께 가지므로, 번역은 기본값인 ‘의’를 쓰되 소유격으로 ‘그’의 인격화된 회복 이미지를 보존했습니다.
- source_word: וִישׁוּעָתָהּ
  english_pob_choice: and her salvation
  chosen_korean: 그 구원
  alternatives_korean:
  - 그 구출
  - 그 해방
  - 그 구제
  lexicon: HALOT
  rationale: ישועה를 ‘구원’으로 옮겨 신학적 폭과 회복의 의미를 유지했습니다. 문맥상 공적 회복의 뉘앙스도 함께 담을 수 있습니다.
- source_word: כְלַפִּיד
  english_pob_choice: like a torch
  chosen_korean: 횃불처럼
  alternatives_korean:
  - 등불처럼
  - 불꽃처럼
  - 토치처럼
  lexicon: HALOT
  rationale: לַפִּיד는 작은 등불보다 공적으로 타오르는 횃불에 가깝기 때문에, 시각적·상징적 힘을 살리는 ‘횃불처럼’을 택했습니다.
theological_decisions:
- issue: 화자 미확정성
  chosen_reading: 본문의 1인칭 화자를 특정하지 않고 그대로 두었습니다.
  alternative_readings:
  - 예언자의 말로 명시
  - 여호와의 말씀으로 명시
  - 파수꾼/대표자의 말로 명시
  rationale: 히브리어 본문 자체가 화자를 밝히지 않으므로, 해석을 확정해 긴장을 해소하지 않고 POB의 보존 원칙을 따랐습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
