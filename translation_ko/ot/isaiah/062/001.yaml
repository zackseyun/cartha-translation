  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
  footnotes:
  - marker: a
    text: Or 'I will not rest' for 'I will not be quiet.' The Hebrew verb can carry the sense of being quiet, still, or at rest.
    reason: lexical_alternative
  - marker: b
    text: Or 'her vindication' for 'her righteousness.' The Hebrew can denote righteousness in a moral/covenantal sense or public vindication.
    reason: lexical_alternative
  - marker: c
    text: The speaker is not explicitly identified in the verse; interpreters differ on whether this is the prophet, the LORD, or another representative voice.
    reason: alternative_reading
translation:
  language: ko
  text: 시온을 위하여 나는[c] 잠잠하지 않겠습니다. 예루살렘을 위하여 나는 가만히 있지 않겠습니다[a]. 그 의가 빛처럼 드러나고[b] 그 구원이 횃불처럼 타오를 때까지.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉬지 않겠습니다’ 또는 ‘고요히 있지 않겠습니다’로 옮길 수 있습니다. 히브리어 동사는 조용함, 평온함, 쉼의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 신원’으로 옮길 수 있습니다. 히브리어는 도덕적·언약적 의로움뿐 아니라 공적으로 의롭다고 인정받음 또는 신원됨을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 화자는 본문에서 명시되지 않습니다. 예언자, 주님, 또는 다른 대표적 화자로 보는 해석이 있습니다.
    reason: alternative_reading
