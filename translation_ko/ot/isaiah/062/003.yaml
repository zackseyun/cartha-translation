  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
  footnotes:
  - marker: a
    text: Or 'a diadem of royalty' / 'a royal headdress.' The Hebrew noun refers to a wrapped headpiece or turban.
