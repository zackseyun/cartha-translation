  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
  footnotes:
  - marker: a
    text: Or 'a diadem of royalty' / 'a royal headdress.' The Hebrew noun refers to a wrapped headpiece or turban.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 야훼의 손에 있는 아름다운 관이 되고, 당신의 하나님의 손바닥에 있는 왕관이 되실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕권의 관’ / ‘왕의 머리쓰개’입니다. 이 히브리어 명사는 감아 두르는 머리장식이나 터번을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתְ
  english_pob_choice: You will be
  chosen_korean: 당신은 …이 되실 것입니다
  alternatives_korean:
  - 당신은 …이 될 것입니다
  - 그리고 당신은 …이 되실 것입니다
  lexicon: HALOT
  rationale: 여성 단수 2인칭의 예언적 미래를 한국어의 자연스러운 미래형으로 옮기되, 평행구의 예언 선언성을 살리기 위해 ‘되실 것입니다’를 사용했습니다.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a crown of beauty
  chosen_korean: 아름다운 관
  alternatives_korean:
  - 아름다움의 관
  - 영광의 관
  - 찬란한 관
  lexicon: HALOT
  rationale: 히브리어의 관용적 구성은 직역상 ‘아름다움의 관’이지만, 현대 한국어에서는 ‘아름다운 관’이 더 자연스럽고 이미지도 보존합니다.
- source_word: בְּיַד / בְּכַף
  english_pob_choice: in the hand of / in the palm of
  chosen_korean: 손에 / 손바닥에
  alternatives_korean:
  - 손 안에 / 손안에
  - 손에 / 손안에
  lexicon: HALOT
  rationale: 같은 ‘손’ 어휘의 변화를 한국어에서도 구분하여, בְּיַד은 일반적 ‘손에’, בְּכַף은 더 구체적인 ‘손바닥에’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 문맥의 여호와 신명 표기는 전통적 대체호칭이 아니라 고유명사로서 ‘야훼’가 기준이므로 그대로 옮겼습니다.
theological_decisions:
- issue: 신명(יהוה) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 야훼의 이름을 직접 사용하므로, 제목어 ‘주’로 바꾸지 않고 고유한 언약적 이름을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
