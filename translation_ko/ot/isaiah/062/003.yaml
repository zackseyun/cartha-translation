  source_fidelity: 히브리어의 예언적 미래, ‘손’(יַד)과 ‘손바닥’(כַּף)의 구별, 그리고 야훼/하나님의 병행은 대체로 반영되었습니다. 그러나 두 번째 표상인 צָנִיף מְלוּכָה는 ‘왕관’이 아니라 감아 두르는 왕실/왕권의 머리쓰개(터번)이므로, 현 번역은 첫 표상인 עֲטֶרֶת와의 어휘적·형상적 구별을 잃습니다.
  naturalness: ‘당신은 … 되실 것입니다’는 여성 단수인 시온/예루살렘을 높이는 표현처럼 들리고, ‘당신’과 ‘당신의 하나님’은 현대 한국어에서 하나님께 직접 말하는 문맥으로도 오인될 수 있습니다. 시적 직접 호칭으로 ‘그대’를 쓰고 합쇼체 미래 종결을 유지하면 대상과 문체가 더 자연스럽습니다.
  terminology: יַהוה는 ‘야훼’로 적절합니다. עֲטֶרֶת תִּפְאֶרֶת는 구성 관계를 살려 ‘아름다움의 관’으로, צָנִיף מְלוּכָה는 ‘왕권의 터번’으로 옮기는 것이 원문의 두 이미지를 더 충실히 구별합니다.
