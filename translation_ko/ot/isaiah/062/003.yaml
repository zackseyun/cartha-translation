translation:
  language: ko
  text: 그대는 야훼의 손에 있는 아름다움의 관이 되고, 그대의 하나님의 손바닥에 있는 왕권의 터번이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕권의 관’ 또는 ‘왕실의 머리쓰개’입니다. 이 히브리어 명사는 감아 두르는 머리쓰개나 터번을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתְ
  english_pob_choice: You will be
  chosen_korean: 당신은 …이 되실 것입니다
  alternatives_korean:
  - 당신은 …이 될 것입니다
  - 그리고 당신은 …이 되실 것입니다
  lexicon: HALOT
  rationale: 여성 단수 2인칭의 예언적 미래를 한국어의 자연스러운 미래형으로 옮기되, 평행구의 예언 선언성을 살리기 위해 ‘되실 것입니다’를 사용했습니다.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a crown of beauty
  chosen_korean: 아름다운 관
  alternatives_korean:
  - 아름다움의 관
  - 영광의 관
  - 찬란한 관
  lexicon: HALOT
  rationale: 히브리어의 관용적 구성은 직역상 ‘아름다움의 관’이지만, 현대 한국어에서는 ‘아름다운 관’이 더 자연스럽고 이미지도 보존합니다.
- source_word: בְּיַד / בְּכַף
  english_pob_choice: in the hand of / in the palm of
  chosen_korean: 손에 / 손바닥에
  alternatives_korean:
  - 손 안에 / 손안에
  - 손에 / 손안에
  lexicon: HALOT
  rationale: 같은 ‘손’ 어휘의 변화를 한국어에서도 구분하여, בְּיַד은 일반적 ‘손에’, בְּכַף은 더 구체적인 ‘손바닥에’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 문맥의 여호와 신명 표기는 전통적 대체호칭이 아니라 고유명사로서 ‘야훼’가 기준이므로 그대로 옮겼습니다.
theological_decisions:
