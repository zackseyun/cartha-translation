revisions:
- from: 그날에 유다 땅에서 이 노래가 불려집니다. “우리는 견고한 성이 있습니다. 그는 구원을 성벽들과 외곽 성벽으로 세우십니다.”[a][b][c]
  to: 그날에 유다 땅에서 이 노래가 불릴 것입니다. “우리에게 견고한 성이 있습니다[a]. 구원을 성벽과 외곽 방벽으로 삼으십니다[b][c].”
  rationale: 수동 미래형을 현대 표준어로 바로잡고, לָנוּ를 자연스러운 한국어 귀속 표현으로 옮겼습니다. 원문에 없는 대명사 ‘그는’은 삭제하여 주어의 불명시성을 보존했습니다. ‘삼으십니다’는 구원을 성벽과 외곽 방벽으로 정한다는 비유를 자연스럽게 드러내며, 각주 표지는 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:47Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 시간 표현, 수동 미래, 유다 땅, ‘강한 성’, 구원과 방어 시설의 비유를 대체로 반영합니다. 다만 ‘우리는 견고한 성이 있습니다’는 한국어 소유 표현으로 부자연스럽고, ‘그는’은 원문에 없는 명시적 주어를 추가합니다. ‘불려집니다’는 이중 피동으로 피하는 것이 좋습니다.
  naturalness: ‘그날에’와 ‘견고한 성’은 자연스럽습니다. ‘우리에게 … 있습니다’와 ‘불릴 것입니다’가 현대 표준어 합쇼체에 더 알맞습니다. ‘구원을 성벽과 외곽 방벽으로 삼으십니다’는 원문의 ‘두다/정하다’와 비유적 관계를 자연스럽게 전달합니다.
  terminology: יְשׁוּעָה는 ‘구원’으로 유지합니다. חוֹמוֹת는 ‘성벽’, חֵל은 현대 독자에게 명료한 ‘외곽 방벽’으로 옮길 수 있습니다. 원문의 주어 생략을 본문에서는 영(零)주어로 보존하고, 각주에서 문맥적 이해를 설명합니다.
  issues:
