    issue: ‘불려집니다’
    rationale: ‘불리다’에 다시 피동 접미사가 붙은 이중 피동형입니다. 원문의 미래 수동을 자연스럽게 반영하는 ‘불릴 것입니다’가 적절합니다.
  - severity: medium
