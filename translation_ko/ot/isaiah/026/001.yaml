id: ISA.26.1
reference: Isaiah 26:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
  footnotes:
  - marker: a
    text: Or 'We have a fortified city.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he appoints salvation for walls and rampart.' The Hebrew leaves the subject of 'he sets up/appoints' implicit, though in context it is commonly understood to refer to God.
    reason: alternative_reading
  - marker: c
    text: '''Rampart'' translates a Hebrew term for a defensive outer fortification; traditional English versions often render it ''bulwark.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 유다 땅에서 이 노래가 불려집니다. “우리는 견고한 성이 있습니다. 그는 구원을 성벽들과 외곽 성벽으로 세우십니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘견고하게 성벽으로 둘러싸인 성이 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘세우다/두다’의 주어를 밝히지 않지만, 문맥상 보통 하나님으로 이해됩니다.
    reason: theological_note
  - marker: c
    text: ‘외곽 성벽’은 히브리어의 방어용 외곽 축성을 가리키며, 전통 번역의 ‘불곽’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간 표현으로, 한국어에서는 간결한 ‘그날에’가 자연스럽고 종말론적 울림도 유지합니다.
- source_word: יוּשַׁר
  english_pob_choice: will be sung
  chosen_korean: 불려집니다
  alternatives_korean:
  - 노래될 것입니다
  - 불리게 됩니다
  lexicon: HALOT
  rationale: 히브리어 수동형을 자연스러운 한국어 피동으로 옮기되, 예언적 현재감이 살아 있는 합쇼체를 택했습니다.
- source_word: עִיר עָז
  english_pob_choice: a strong city
  chosen_korean: 견고한 성
  alternatives_korean:
  - 강한 성
  - 요새 같은 성
  - 튼튼한 성
  lexicon: HALOT
  rationale: ‘성’은 도시이자 요새의 의미를 함께 담을 수 있고, עָז의 방어적 뉘앙스를 ‘견고한’으로 살리는 것이 가장 자연스럽습니다.
- source_word: יְשׁוּעָה ... חוֹמוֹת וָחֵל
  english_pob_choice: he sets salvation as walls and rampart
  chosen_korean: 구원을 성벽들과 외곽 성벽으로 세우십니다
  alternatives_korean:
  - 구원을 성벽들과 방벽으로 두십니다
  - 구원을 성벽과 외곽 방벽으로 삼으십니다
  lexicon: HALOT
  rationale: יְשׁוּעָה를 ‘구원’으로 직접 옮기고, 비유적 방어 구조를 한국어로 풀어 ‘성벽들’과 ‘외곽 성벽’으로 대응했습니다. חֵל은 전통적 ‘불곽’보다 현대 독자가 이해하기 쉬운 ‘외곽 성벽’이 더 직접적입니다.
theological_decisions:
- issue: יָשִׁית의 주어가 명시되지 않음
  chosen_reading: 주어를 본문에 드러내지 않고 ‘그는’으로 유지해, 문맥상 하나님으로 이해되지만 본문이 직접 이름하지 않는 긴장을 보존했습니다.
  alternative_readings:
  - ‘여호와께서 구원을 성벽으로 세우십니다’처럼 주어를 명시하는 번역
  - ‘성이 구원이 됩니다’처럼 성 자체를 주어로 보는 번역
  rationale: 히브리어는 동사만 두고 주어를 생략합니다. 문맥상 하나님이 암시되지만, 번역에서 이를 과도하게 확정하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 해석적 확정을 최소화하여 문맥적 암시를 보존
