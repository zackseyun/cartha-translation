source:
  edition: WLC
  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
  footnotes:
  - marker: a
    text: Or 'the exalted city' or 'the city set on high.' The Hebrew does not identify the city by name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 높은 곳에 사는 이들[a], 곧 그 높은 성읍을 낮추시며 — 그것을 땅에까지 낮추시고, 그것을 티끌에까지 끌어내리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높여진 성읍’, ‘높이 세워진 성읍’. 히브리어는 이 성읍의 이름을 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי מָרוֹם
  english_pob_choice: those who dwell on high
  chosen_korean: 높은 곳에 사는 이들
  alternatives_korean:
  - 높은 곳에 거주하는 자들
  - 높은 곳의 주민들
  lexicon: HALOT
  rationale: 거처의 높음을 살리되, 시적·상징적 뉘앙스를 유지하기 위해 직역보다 자연스러운 표준어로 옮겼습니다.
- source_word: קִרְיָה נִשְׂגָּבָה
  english_pob_choice: the lofty city
  chosen_korean: 그 높은 성읍
  alternatives_korean:
  - 그 높이 들린 성읍
  - 그 높아진 도시
  lexicon: HALOT
  rationale: קִרְיָה는 ‘성읍’으로 옮기고, נִשְׂגָּבָה의 ‘높여진/우뚝한’ 뜻은 ‘높은’으로 담아 과도한 해석 없이 병치 구조를 살렸습니다.
- source_word: יַשְׁפִּילֶנָּה / יַשְׁפִּילָהּ
  english_pob_choice: he lays it low, he lays it low
  chosen_korean: 낮추시며 — 그것을 땅에까지 낮추시고
  alternatives_korean:
  - 낮추시며 — 그것을 땅까지 낮추시고
  - 그것을 낮추시며, 또 낮추시어
  lexicon: HALOT
  rationale: 히필의 반복을 한국어에서도 반복으로 살리되, 문장 흐름을 위해 ‘낮추시며’와 ‘낮추시고’를 겹쳐 시적 강조를 보존했습니다.
- source_word: עַד אֶרֶץ / עַד עָפָר
  english_pob_choice: to the earth / to the dust
  chosen_korean: 땅에까지 / 티끌에까지
  alternatives_korean:
  - 땅까지 / 먼지에까지
  - 땅바닥에까지 / 흙먼지에까지
  lexicon: HALOT
  rationale: אֶרֶץ와 עָפָר의 병렬을 한국어에서도 ‘땅’과 ‘티끌’로 구분해, 낮아짐의 점층을 분명하게 드러냈습니다.
theological_decisions:
- issue: ‘낮춤’의 반복을 한국어에서 얼마나 노골적으로 드러낼지
  chosen_reading: 반복을 완화하지 않고 두 번의 ‘낮추시-’ 구조로 유지했습니다.
  alternative_readings:
  - 한 번만 ‘낮추시고’로 정리
  - ‘겸손하게 하시고’로 완화
  rationale: 히브리어의 반복은 단순 중복이 아니라 심판의 강도를 강조하므로, 이를 매끄럽게 평준화하지 않는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: Preserve repetition and rhetorical force from the source text.'
