id: ISA.26.20
reference: Isaiah 26:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ֤ךְ עַמִּ/י֙ בֹּ֣א בַ/חֲדָרֶ֔י/ךָ וּֽ/סְגֹ֥ר דלתי/ך בַּעֲדֶ֑/ךָ חֲבִ֥י כִ/מְעַט רֶ֖גַע עַד יעבור זָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
  footnotes:
  - marker: a
    text: Or 'your chambers.' The Hebrew term can refer to inner rooms or private chambers.
    reason: lexical_alternative
  - marker: b
    text: Or 'hide yourself.' The Hebrew addresses 'my people' as a collective, so the English plural 'yourselves' brings out the collective sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'until the indignation has passed by.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 백성아, 가서 네 방으로 들어가십시오.[a] 네 뒤로 문을 닫으십시오. 잠시 동안 숨어 있으십시오.[b] 분노가 지나갈 때까지.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 골방으로’ 또는 ‘네 안쪽 방으로’. 히브리어 חדר는 안쪽 방이나 사적인 방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숨으십시오’. 히브리어는 ‘내 백성’을 집합적으로 부르면서 단수형 명령을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘진노가 지나갈 때까지’.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 들어가라
  alternatives_korean:
  - 가라
  - 떠나라
  lexicon: HALOT
  rationale: 뒤이어 나오는 “네 방들”과 결합되는 피난 명령이므로, 한국어에서는 단순한 이동보다 안으로 들어가는 동작을 드러내는 ‘들어가라’가 가장 자연스럽습니다.
- source_word: בֹּא
  english_pob_choice: enter
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어가라
  - 들어가
  lexicon: HALOT
  rationale: 히브리어의 연속 명령을 살리기 위해 한국어에서는 ‘들어가서’로 이어 주어, 곧바로 뒤따르는 닫기·숨기 명령의 흐름을 유지했습니다.
- source_word: בַחֲדָרֶיךָ
  english_pob_choice: your rooms
  chosen_korean: 네 방들
  alternatives_korean:
  - 네 침실들
  - 네 골방들
  - 네 방
  lexicon: HALOT
  rationale: חדר는 안쪽의 방이나 별실을 가리킬 수 있으나, 현대 한국어에서는 ‘방들’이 가장 직역에 가깝고 이해하기 쉽습니다. 복수형을 살려 공동체적 지시를 보존했습니다.
- source_word: חֲבִי
  english_pob_choice: hide yourselves
  chosen_korean: 숨어 있으라
  alternatives_korean:
  - 숨으라
  - 숨으십시오
  - 자신을 숨기라
  lexicon: HALOT
  rationale: 어미형은 단수처럼 보이지만 문맥상 ‘내 백성’ 전체를 향한 지시이므로 공동체적 반영을 위해 자연스러운 복수적 뉘앙스의 ‘숨어 있으라’를 택했습니다.
- source_word: זָעַם
  english_pob_choice: the wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격노
  - 의분
  lexicon: HALOT
  rationale: 히브리어 זעם의 예언적·심판적 강도를 한국어에서 가장 직접적으로 살리되, 본문이 그 분노의 주체를 명시하지 않으므로 ‘야훼의’ 같은 보충은 넣지 않았습니다.
theological_decisions:
- issue: ‘my people’의 호칭과 명령형의 공동체성
  chosen_reading: ‘내 백성아’로 부른 뒤 복수적 의미가 드러나도록 명령을 자연스럽게 공동체 전체에 적용했습니다.
  alternative_readings:
  - ‘내 ժողովուրդ아’식 집합적 표현
  - 개별적 단수 명령으로 처리
  rationale: 히브리어는 집합적 호칭과 단수/복수 표지가 섞여 있어, 한국어에서는 공동체 전체에게 주어지는 피난 지시라는 점이 분명하게 드러나야 합니다.
  doctrine_reference: '번역 철학 §3: 공동체적 의미를 보존하되 문장성은 한국어 관용에 맞춘다.'
- issue: ‘분노’의 주체를 밝히지 않음
  chosen_reading: 주어를 덧붙이지 않고 ‘분노가 지나가기까지’로 옮겼습니다.
  alternative_readings:
  - ‘야훼의 진노가 지나가기까지’
  - ‘그 분노가 지나가기까지’
  rationale: 히브리어는 소유격이나 주체를 명시하지 않으므로, 본문의 신학적 긴장을 유지하기 위해 주체를 확정하지 않았습니다. 다만 예언 문맥상 심판적 분노라는 성격은 드러나게 했습니다.
  doctrine_reference: '번역 철학 §3: 본문이 열어 둔 신학적 긴장을 보존한다.'
