id: ISA.26.8
reference: Isaiah 26:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
  footnotes:
  - marker: a
    text: Or 'your justice' or 'your ordinances' for 'your judgments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the memory of you' for 'your remembrance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로, 주님의 심판들의 길에서 우리는 주님을 기다려 왔습니다. 주님의 이름과 주님의 기억은 영혼의 갈망입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 정의’나 ‘주님의 규례들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주님을 기억하심’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 과연
  lexicon: HALOT
  rationale: אַף는 여기서 문장 전체를 힘 있게 여는 강조·부가 입자이므로, 현대 한국어에서 자연스럽고 문체상 적절한 ‘참으로’로 옮겼습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 주님의 심판들
  alternatives_korean:
  - 주님의 판단들
  - 주님의 정의
  - 주님의 규례들
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּט은 하나님의 통치적 판결과 역사적 심판을 함께 가리킬 수 있어, 추상적인 ‘정의’나 율법적 ‘규례’보다 ‘심판들’이 긴장을 가장 잘 보존합니다.
- source_word: קִוִּינוּךָ
  english_pob_choice: we have waited for you
  chosen_korean: 우리는 주님을 기다려 왔습니다
  alternatives_korean:
  - 우리는 주님을 기다렸습니다
  - 우리는 주님께 소망을 두었습니다
  - 우리는 주님을 바라보았습니다
  lexicon: HALOT
  rationale: קוה는 기대를 품은 기다림을 뜻하므로, 완료의 결과가 현재에 이어지는 뉘앙스를 살린 ‘기다려 왔습니다’가 가장 자연스럽습니다.
- source_word: זִכְרְךָ
  english_pob_choice: your remembrance
  chosen_korean: 주님의 기억
  alternatives_korean:
  - 주님의 기념
  - 주님의 기억됨
  - 주님을 기억함
  lexicon: HALOT
  rationale: זֵכֶר은 ‘기억’, ‘기념’, ‘기억되는 바’를 포괄할 수 있는데, 병행구의 ‘이름’과 짝지을 때 한국어로는 ‘기억’이 가장 간결하면서도 시적입니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  - 주
  rationale: 본문은 히브리어 מקור에서 יהוה를 사용하지만, 이 절은 한국어 문장 내에서 자연스럽고 출판 가능한 합쇼체 흐름을 위해 ‘주님’으로 옮겼습니다. 다만 원어상 고유신명성은 lexical layer에서 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: ‘your remembrance’의 개념
  chosen_reading: 주님의 기억
  alternative_readings:
  - 주님의 기념
  - 주님의 명성
  - 주님의 기억됨
  rationale: 본문의 זֵכֶר은 단순한 심리적 기억이 아니라 하나님 자신에 대한 회상·기념의 범주를 가질 수 있으나, 여기서는 ‘이름’과 평행을 이루는 압축적 표현을 살려 과도한 신학적 확장을 피했습니다.
  doctrine_reference: Translation philosophy — close rendering of poetic parallelism
