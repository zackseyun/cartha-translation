id: ISA.26.9
reference: Isaiah 26:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
  footnotes:
  - marker: a
    text: Or 'earnestly seeks you' or 'seeks you at dawn'; the Hebrew verb evokes early-morning seeking and, by extension, eager pursuit.
    reason: lexical_alternative
  - marker: b
    text: Literally 'when your judgments are in the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'learn justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼이 밤에 주님을 사모했습니다[a]. 참으로 내 영이 내 속에서 주님을 간절히 찾습니다. 이는 주님의 심판이 땅에 있을 때[c][b] 세상의 주민들이 의를 배웁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간절히 주님을 찾았습니다’, ‘새벽에 주님을 찾았습니다’로도 옮길 수 있습니다. 히브리어 동사는 이른 아침의 찾음을 떠올리며, 더 나아가 간절한 추구를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주님의 심판이 땅에 있을 때’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘의를 배웁니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: My soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나
  - 내 속사람
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 단순한 자아 지시보다 내면의 갈망을 드러내므로, 시적·인간론적 뉘앙스를 살리는 ‘영혼’을 택했습니다.
- source_word: אִוִּיתִיךָ
  english_pob_choice: has desired you
  chosen_korean: 주님을 사모했습니다
  alternatives_korean:
  - 주님을 간절히 원했습니다
  - 주님을 갈망했습니다
  lexicon: HALOT
  rationale: 히브리어 אוה 계열의 강한 갈망을 한국어의 ‘사모하다’로 자연스럽게 옮기되, 완료형의 지속된 상태를 살려 과거시제로 표현했습니다.
- source_word: אֲשַׁחֲרֶךָּ
  english_pob_choice: seeks you early
  chosen_korean: 간절히 찾습니다
  alternatives_korean:
  - 이른 아침에 찾습니다
  - 새벽에 찾습니다
  lexicon: HALOT
  rationale: 이 동사는 본래 새벽/이른 때를 떠올리지만, 문맥상 조급하고 간절한 추구의 뜻이 함께 있어 이를 드러내는 표현을 택했습니다.
- source_word: מִשְׁפָּטֶיךָ לָאָרֶץ
  english_pob_choice: when your judgments are in the earth
  chosen_korean: 주님의 심판이 땅에 있을 때
  alternatives_korean:
  - 주님의 심판이 땅에 있을 때
  - 주님의 판단이 땅에 있을 때
  lexicon: HALOT
  rationale: מִשְׁפָּט은 단순한 판결보다 하나님의 심판 행위와 통치를 가리킬 수 있어 ‘심판’으로 옮겼고, לָאָרֶץ는 직역에 가깝게 ‘땅에 있을 때’로 처리했습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: 여기서 배워지는 것은 하나님의 심판에 의해 드러나는 도덕적·언약적 올바름이므로, 표준적 성서 용례에 맞는 ‘의’를 택했습니다.
theological_decisions:
- issue: צֶדֶק의 의미를 한국어에서 어떻게 살릴 것인가
  chosen_reading: ‘의’는 하나님 앞에서의 올바름과 바른 삶을 함께 담는 표현으로 유지했습니다.
  alternative_readings:
  - ‘정의’로 옮겨 사회적·사법적 측면을 강조할 수 있습니다.
  - ‘의로움’으로 풀어 설명할 수 있습니다.
  rationale: 문맥은 하나님의 심판이 땅에 임할 때 세상 주민들이 배우는 삶의 질서를 말하므로, 신학적으로 넓고도 핵심적인 ‘의’가 가장 균형적입니다. 다만 ‘정의’도 가능한 어휘이므로 주해 여지를 남깁니다.
  doctrine_reference: DOCTRINE.md의 contested terms 원칙에 따라, צֶדֶק 같은 다층어는 문맥상 기본값을 유지하되 대안 독법을 보존합니다.
