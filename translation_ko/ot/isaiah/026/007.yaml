id: ISA.26.7
reference: Isaiah 26:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
  footnotes:
  - marker: a
    text: Or, 'The path of the righteous is straight; straight is the path of the righteous that you make level.' The Hebrew allows יָשָׁר to be read adjectivally rather than as a direct address, though the second-person verb favors the vocative reading.
    reason: alternative_reading
translation:
  language: ko
  text: 의인의 길은 평탄합니다. 곧으신 분이시여, 의인의 길을 평탄하게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인의 길은 곧습니다. 주님께서 평탄하게 하시는 의인의 길도 곧습니다.’ 히브리어 יָשָׁר는 ‘곧으신 분이시여’라는 호격이 아니라 형용사로 읽을 수도 있습니다. 그러나 뒤따르는 2인칭 동사는 호격 해석을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח
  english_pob_choice: path
  chosen_korean: 길
  alternatives_korean:
  - 길목
  - 경로
  - 길
  lexicon: HALOT
  rationale: 시적 병행에서 מַעְגַּל과 짝을 이루는 보편적 이미지로, 현대 한국어에서 가장 자연스럽고 간결하게 ‘path’의 의미를 살립니다.
- source_word: מֵישָׁרִים
  english_pob_choice: level
  chosen_korean: 평탄합니다
  alternatives_korean:
  - 고릅니다
  - 평평합니다
  - 곧습니다
  lexicon: HALOT
  rationale: 추상명사 복수형이지만 문맥상 길의 상태를 묘사하므로, ‘level’의 구체적 이미지에 맞는 ‘평탄합니다’로 옮겼습니다.
- source_word: יָשָׁר
  english_pob_choice: O Upright One
  chosen_korean: 주님
  alternatives_korean:
  - 의로우신 분
  - 곧으신 분
  - 곧은 분
  lexicon: HALOT
  rationale: 영어 POB의 해석을 따라 이 단어를 하나님께 대한 호격으로 이해해, 직접 호칭이 드러나도록 ‘주님’으로 처리했습니다. 본절의 2인칭 동사와도 잘 맞습니다.
- source_word: תְּפַלֵּס
  english_pob_choice: you make ... smooth
  chosen_korean: 곧게 하십니다
  alternatives_korean:
  - 평탄하게 하십니다
  - 매끄럽게 하십니다
  - 평평하게 하십니다
  lexicon: HALOT
  rationale: Piel의 ‘길을 다듬어 평탄하게 하다’라는 뜻을 현대 한국어에서 자연스럽게 옮겼습니다. 앞의 ‘평탄합니다’와 평행을 이루도록 했습니다.
theological_decisions:
- issue: יָשָׁר를 형용사로 볼지, 하나님께 대한 호격으로 볼지
  chosen_reading: 호격으로 읽어 “주님”으로 번역했습니다.
  alternative_readings:
  - ‘의인의 길은 곧습니다’처럼 길을 꾸미는 형용사로 읽는 번역
  rationale: 뒤이어 오는 2인칭 남성 단수 동사 ‘you make ... smooth’가 직접 호칭을 강하게 지지하므로, 시적 호격을 살렸습니다. 다만 본문상 가능한 대안 해석은 각주로 남겼습니다.
  doctrine_reference: 문법적·시적 긴장을 해소하지 않고 보존하는 원칙
