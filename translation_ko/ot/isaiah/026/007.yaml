    issue: יָשָׁר를 ‘주님’으로 번역함
    rationale: 호격으로 읽는 것은 가능하고 2인칭 동사가 이를 뒷받침하지만, ‘주님’은 ‘곧은/올곧은 이’라는 본문의 술어적·성품적 표현을 생략합니다.
  - severity: medium
    issue: תְּפַלֵּס를 ‘곧게 하십니다’로 번역함
    rationale: 이 동사는 문맥상 길을 평탄하게 하고 고르게 하는 뜻입니다. ‘곧게’는 ‘straight’에 치우쳐 첫 행의 מֵישָׁרִים 및 도로 정비의 병행을 충분히 살리지 못합니다.
  - severity: low
    issue: 각주의 대안 읽기가 본문의 어휘적 대비를 충분히 반영하지 못함
    rationale: 대안은 יָשָׁר를 형용사로 읽는 경우를 밝혀야 하며, 본문 번역의 ‘평탄’과 대안의 ‘곧다’를 구별해 제시하는 것이 좋습니다.
  revised_text: 의인의 길은 평탄합니다. 곧으신 분이시여, 의인의 길을 평탄하게 하십니다.[a]
