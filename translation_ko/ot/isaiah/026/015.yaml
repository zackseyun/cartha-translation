source:
  edition: WLC
  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
  footnotes:
  - marker: a
    text: Or 'you are glorified,' 'you have been honored,' or 'you have made yourself glorious.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the ends of the earth.' The Hebrew can mean 'ends/edges,' but in context it likely refers to the borders of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주께서 그 나라를 늘리셨습니다. 주께서 그 나라를 늘리셨고, 영광을 얻으셨으며[a], 땅의 모든 경계[b]를 멀리까지 넓히셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 영광스럽게 되셨습니다’, ‘주께서 존귀하게 되셨습니다’, ‘주께서 스스로를 영광스럽게 하셨습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 모든 끝’. 히브리어는 ‘끝/경계’를 뜻할 수 있지만, 문맥상 여기서는 땅의 경계로 이해하는 것이 더 적절합니다.
    reason: lexical_alternative
