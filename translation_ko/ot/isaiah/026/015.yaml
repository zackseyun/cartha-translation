  rationale: יָסַף는 여기서 ‘더하다/증가시키다’의 뜻으로, 한국어에서는 반복 구조를 살리면서 자연스럽게 ‘더 크게 하셨습니다’로 옮기는 것이 좋습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
