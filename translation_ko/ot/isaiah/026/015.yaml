id: ISA.26.15
reference: Isaiah 26:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
  footnotes:
  - marker: a
    text: Or 'you are glorified,' 'you have been honored,' or 'you have made yourself glorious.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the ends of the earth.' The Hebrew can mean 'ends/edges,' but in context it likely refers to the borders of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주께서 민족을 더 크게 하셨습니다. 주께서 그 민족을 더 크게 하셨고, 주께서 영광을 얻으셨으며, 땅의 모든 경계를 멀리 넓히셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 영광스럽게 되셨습니다’, ‘주께서 존귀하게 되셨습니다’, ‘주께서 스스로 영광스럽게 하셨습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 모든 끝’. 히브리어는 ‘끝/모퉁이’를 뜻할 수 있지만, 문맥상 여기서는 땅의 경계로 이해하는 것이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ לַגּוֹי
  english_pob_choice: you have increased the nation
  chosen_korean: 민족을 더 크게 하셨습니다
  alternatives_korean:
  - 나라를 증가시키셨습니다
  - 백성을 더하셨습니다
  - 민족을 늘리셨습니다
  lexicon: HALOT
  rationale: יָסַף는 여기서 ‘더하다/증가시키다’의 뜻으로, 한국어에서는 반복 구조를 살리면서 자연스럽게 ‘더 크게 하셨습니다’로 옮기는 것이 좋습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼여
  - 여호와여
  lexicon: HALOT
  rationale: 히브리어 본문은 YHWH를 직접 부르지만, 시적 호격에서는 한국어에서 가장 자연스럽고 경건한 직접 호칭인 ‘주님’을 사용하되, 표제어 수준의 원문 정보는 보존합니다.
- source_word: נִכְבָּדְתָּ
  english_pob_choice: you have gained glory
  chosen_korean: 영광을 얻으셨으며
  alternatives_korean:
  - 영광스럽게 되셨으며
  - 존귀하게 되셨으며
  - 영광을 받으셨으며
  lexicon: HALOT
  rationale: 니팔형 כבד는 수동·상태적 의미를 띠므로, 결과를 드러내는 ‘영광을 얻으셨으며’가 가장 무난하며, 능동적 자기영광화로 과도하게 해석하지 않습니다.
- source_word: כָּל קַצְוֵי אָרֶץ
  english_pob_choice: all the borders of the land
  chosen_korean: 땅의 모든 경계를 멀리 넓히셨습니다
  alternatives_korean:
  - 땅의 모든 끝을 멀리 두셨습니다
  - 세상의 모든 끝을 넓히셨습니다
  - 땅의 모든 지경을 넓히셨습니다
  lexicon: HALOT
  rationale: קצה는 ‘끝/모퉁이/경계’가 가능하지만, 문맥상 국가의 확장에 대한 진술이므로 ‘경계’와 ‘넓히셨습니다’로 땅의 확장 이미지를 살렸습니다.
theological_decisions:
- issue: YHWH 호칭의 한국어 처리
  chosen_reading: 직접 호격의 경외를 살리되 본문에는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 시적 호격이므로 한국어 예배·본문 독서에서 자연스러운 직접 호칭을 택했습니다. 다만 본문 어휘 차원에서는 신적 이름의 직접성을 훼손하지 않도록 번역했습니다.
  doctrine_reference: divine_name_rendering
- issue: אָרֶץ의 범위
  chosen_reading: ‘땅’으로 이해했습니다.
  alternative_readings:
  - 세상
  - 땅
  rationale: 앞선 ‘민족’의 증가와 평행을 이루어, 전 지구적 의미보다 영토적 의미가 문맥상 더 강합니다.
  doctrine_reference: contextual_scope
