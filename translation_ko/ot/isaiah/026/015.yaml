  lexicon: HALOT
  rationale: 히브리어 본문은 YHWH를 직접 부르지만, 시적 호격에서는 한국어에서 가장 자연스럽고 경건한 직접 호칭인 ‘주님’을 사용하되, 표제어 수준의 원문 정보는 보존합니다.
- source_word: נִכְבָּדְתָּ
  english_pob_choice: you have gained glory
  chosen_korean: 영광을 얻으셨으며
  alternatives_korean:
