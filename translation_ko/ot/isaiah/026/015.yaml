  - 존귀하게 되셨으며
  - 영광을 받으셨으며
  lexicon: HALOT
  rationale: 니팔형 כבד는 수동·상태적 의미를 띠므로, 결과를 드러내는 ‘영광을 얻으셨으며’가 가장 무난하며, 능동적 자기영광화로 과도하게 해석하지 않습니다.
- source_word: כָּל קַצְוֵי אָרֶץ
  english_pob_choice: all the borders of the land
  chosen_korean: 땅의 모든 경계를 멀리 넓히셨습니다
  alternatives_korean:
  - 땅의 모든 끝을 멀리 두셨습니다
  - 세상의 모든 끝을 넓히셨습니다
  - 땅의 모든 지경을 넓히셨습니다
  lexicon: HALOT
  rationale: קצה는 ‘끝/모퉁이/경계’가 가능하지만, 문맥상 국가의 확장에 대한 진술이므로 ‘경계’와 ‘넓히셨습니다’로 땅의 확장 이미지를 살렸습니다.
theological_decisions:
- issue: YHWH 호칭의 한국어 처리
  chosen_reading: 직접 호격의 경외를 살리되 본문에는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 시적 호격이므로 한국어 예배·본문 독서에서 자연스러운 직접 호칭을 택했습니다. 다만 본문 어휘 차원에서는 신적 이름의 직접성을 훼손하지 않도록 번역했습니다.
  doctrine_reference: divine_name_rendering
- issue: אָרֶץ의 범위
  chosen_reading: ‘땅’으로 이해했습니다.
  alternative_readings:
  - 세상
  - 땅
  rationale: 앞선 ‘민족’의 증가와 평행을 이루어, 전 지구적 의미보다 영토적 의미가 문맥상 더 강합니다.
  doctrine_reference: contextual_scope
