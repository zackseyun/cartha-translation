id: ISA.26.2
reference: Isaiah 26:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּתְח֖וּ שְׁעָרִ֑ים וְ/יָבֹ֥א גוֹי צַדִּ֖יק שֹׁמֵ֥ר אֱמֻנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
  footnotes:
  - marker: a
    text: Or 'that keeps truth' or 'that keeps faith.' The Hebrew אֱמֻנִים can denote faithfulness, trustworthiness, or truth depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 성문들을 여십시오. 의로운 나라, 곧 신실함[a]을 지키는 나라가 들어오게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실’ 또는 ‘믿음’. 히브리어 אֱמֻנִים은 문맥에 따라 신실함, 신뢰성, 진실을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  english_pob_choice: Open
  chosen_korean: 여십시오
  alternatives_korean:
  - 열어라
  - 여십시오
  - 열어 주십시오
  lexicon: HALOT
  rationale: 복수 명령형의 직접 명령을 현대 한국어 합쇼체로 옮겼습니다. 문맥상 성문을 향한 명령이므로 자연스럽고 간결한 ‘여십시오’가 가장 직접적입니다.
- source_word: שְׁעָרִים
  english_pob_choice: the gates
  chosen_korean: 문들
  alternatives_korean:
  - 성문들
  - 성문들
  - 문들
  lexicon: HALOT
  rationale: 히브리어는 복수형 ‘문/성문’을 가리키며, 도시 성문 문맥이 분명하므로 ‘문들’보다 의미가 선명한 ‘문들’로 간결하게 옮기되, 주석 없이도 성문 이미지를 유지할 수 있게 했습니다.
- source_word: גוֹי צַדִּיק
  english_pob_choice: the righteous nation
  chosen_korean: 의로운 나라
  alternatives_korean:
  - 의로운 민족
  - 의로운 나라
  lexicon: HALOT
  rationale: גוֹי는 공동체 전체를 가리키는 ‘나라/민족’의 뉘앙스가 강하므로 ‘의로운 나라’로 옮겼습니다. צַדִּיק의 윤리·언약적 성격은 ‘의로운’이 가장 잘 드러냅니다.
- source_word: שֹׁמֵר אֱמֻנִים
  english_pob_choice: the one that keeps faithfulness
  chosen_korean: 신실함을 지키는 나라
  alternatives_korean:
  - 신실함을 지키는
  - 믿음을 지키는
  - 진실을 지키는
  lexicon: HALOT
  rationale: אֱמֻנִים은 문맥상 ‘믿음’ 자체보다 지속적 충실성/신실함을 뜻하므로 ‘신실함’으로 옮겼습니다. שֹׁמֵר의 진행적·특성적 용법은 ‘지키는’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: אֱמֻנִים의 의미 범위
  chosen_reading: ‘신실함’을 중심 의미로 택해, 언약적 충실성과 도덕적 성실성을 함께 드러냈습니다.
  alternative_readings:
  - 믿음
  - 진실
  - 신뢰성
  rationale: 이 구절은 의로운 공동체의 특징을 신앙 행위보다 지속적인 충성/충실성으로 묘사합니다. 따라서 ‘신실함’이 본문의 윤리적·언약적 힘을 가장 온전히 보존합니다.
  doctrine_reference: 번역 원칙 §3, §5
- issue: 문들 앞의 직접 명령
  chosen_reading: 합쇼체 명령형 ‘여십시오’를 사용했습니다.
  alternative_readings:
  - 열어라
  - 여시오
  rationale: 예언적 선포의 공적인 호소를 현대 표준어의 공손한 명령으로 옮기되, 명령의 강도를 약화시키지 않기 위해 ‘여십시오’를 택했습니다.
  doctrine_reference: 한국어 문체 지침
