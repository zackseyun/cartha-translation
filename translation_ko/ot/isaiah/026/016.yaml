id: ISA.26.16
reference: Isaiah 26:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֖ה בַּ/צַּ֣ר פְּקָד֑וּ/ךָ צָק֣וּ/ן לַ֔חַשׁ מוּסָרְ/ךָ֖ לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
  footnotes:
  - marker: a
    text: Or 'they turned to you' or 'they visited you'; the Hebrew verb can carry the sense of attending to or seeking someone.
    reason: lexical_alternative
  - marker: b
    text: Or 'they poured out a whisper' or 'they uttered a murmur'; the Hebrew is compact and may describe hushed supplication under affliction.
    reason: lexical_alternative
  - marker: c
    text: '''Your discipline'' may also be rendered ''your chastening'' or ''your instruction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 환난 가운데서 그들이 야훼를 찾았고[a], 야훼의 징계가 그들에게 임하자[c] 속삭이는 기도를 쏟아냈습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘찾다’ 외에도 ‘찾아가다’, ‘돌아보다’ 또는 ‘방문하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속삭이는 기도’는 히브리어의 간결한 표현을 풀어 옮긴 것입니다. 직역하면 ‘속삭임’ 또는 ‘낮은 소리’이며, 고난 가운데 드리는 낮은 목소리의 간구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘징계’는 ‘훈계’, ‘교정’ 또는 ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 문맥은 직접 호소문이므로 호격 표지 «여»를 붙여 자연스럽게 옮겼고, POB의 원칙에 따라 여호와 대신 야훼를 사용했습니다.
- source_word: בַּצַּר
  english_pob_choice: in distress
  chosen_korean: 환난 가운데서
  alternatives_korean:
  - 곤경 속에서
  - 고통 가운데서
  - 어려움 속에서
  lexicon: HALOT
  rationale: צַר의 압박·위기 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 표현으로, 외적 압박이 강한 상황을 살릴 수 있는 「환난」을 선택했습니다.
- source_word: פְּקָדוּךָ
  english_pob_choice: they sought you
  chosen_korean: 그들이 주를 찾았고
  alternatives_korean:
  - 그들이 주를 구했고
  - 그들이 주께 나아갔고
  - 그들이 주를 방문했고
  lexicon: HALOT
  rationale: פקד의 범위(찾다/돌보다/방문하다) 중, 여기서는 고난 중 하나님께로 향하는 행위를 뜻하므로 「찾다」가 가장 간결하고 본문 의도를 잘 드러냅니다.
- source_word: צָקוּן לַחַשׁ
  english_pob_choice: they poured out a whispered prayer
  chosen_korean: 속삭이는 기도를 쏟아냈습니다
  alternatives_korean:
  - 속삭임을 쏟아냈습니다
  - 속삭이는 간구를 쏟아냈습니다
  - 속삭이는 기도를 토해 냈습니다
  lexicon: HALOT
  rationale: לַחַשׁ의 ‘속삭임/조용한 읊조림’과 צק의 ‘쏟아내다’ 이미지를 함께 살리기 위해, 한국어에서는 기도 행위가 분명하도록 「기도」를 보충하고 동사 이미지를 유지했습니다.
- source_word: מוּסָרְךָ
  english_pob_choice: your discipline
  chosen_korean: 주의 징계
  alternatives_korean:
  - 주의 훈계
  - 주의 교정
  - 주의 가르침
  lexicon: HALOT
  rationale: 문맥상 고난을 통해 사람을 돌이키게 하는 교정적 의미가 강하므로, 한국어에서는 징계가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: לַחַשׁ의 성격
  chosen_reading: 속삭이는 기도
  alternative_readings:
  - 속삭임
  - 주술적 주문
  rationale: 본문의 맥락은 여호와께 드리는 탄원이지 주술이 아니므로, ‘속삭임’의 낮은 음성은 유지하되 기도라는 방향을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: מוּסָר의 번역 강도
  chosen_reading: 징계
  alternative_readings:
  - 훈계
  - 교훈
  - 처벌
  rationale: 시적 문맥에서 하나님의 գործող이 단순 교육보다 더 강한 교정·징계의 성격을 띠므로, 의미를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3, §6
