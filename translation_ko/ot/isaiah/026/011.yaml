id: ISA.26.11
reference: Isaiah 26:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
  footnotes:
  - marker: a
    text: Or 'the zeal of the people.' The Hebrew phrase is compact and may be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or 'the fire of your enemies.' The Hebrew wording allows a different construal, though 'the fire for your enemies will consume them' best fits the context of divine judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 주의 손이 높이 들렸으나 그들은 보지 못합니다. 그들은 백성을 향한 열심을 보고 수치를 당할 것입니다.[a] 참으로 불이 주의 원수들을 삼킬 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축된 표현으로, ‘백성의 열심’, ‘백성을 향한 열심’, 또는 ‘백성을 향한 질투’ 등으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 표현은 직역하면 ‘주의 원수들의 불’로도 옮길 수 있습니다. 문맥상 원수들을 삼키는 불로 이해할 수 있으나, 낱말들의 관계는 달리 결속될 여지가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: WLC
  rationale: 원문 고유명 YHWH를 프로젝트 기본값에 따라 야훼로 옮기고, 직접 호소하는 호격은 ‘-여’로 살렸습니다.
- source_word: רָמָה יָדְךָ
  english_pob_choice: your hand is lifted up
  chosen_korean: 주의 손이 높이 들렸으나
  alternatives_korean:
  - 주의 손이 들려 있습니다
  - 주의 손이 높습니다
  lexicon: HALOT
  rationale: ‘손’과 ‘높다/들리다’의 이미지를 그대로 살려, 하나님의 행위를 가리키는 상승 이미지를 과도하게 해석하지 않도록 했습니다.
- source_word: קִנְאַת עָם
  english_pob_choice: by the zeal for your people
  chosen_korean: 주의 백성을 향한 열심 때문에
  alternatives_korean:
  - 백성의 열심 때문에
  - 주의 백성의 질투 때문에
  - 주의 백성을 향한 질투 때문에
  lexicon: HALOT
  rationale: 문맥상 심판과 변호의 의미가 강하므로 קִנְאָה를 ‘열심’으로 옮기되, 소유 관계를 드러내어 ‘주의 백성을 향한’으로 처리했습니다.
- source_word: אַף
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 과연
  lexicon: HALOT
  rationale: 앞 절을 강화하며 다음 절로 넘어가는 강조어이므로 한국어에서는 ‘참으로’가 가장 자연스럽습니다.
- source_word: תֹאכְלֵם
  english_pob_choice: will consume them
  chosen_korean: 그들을 삼킬 것입니다
  alternatives_korean:
  - 그들을 먹어 삼킬 것입니다
  - 그들을 소멸할 것입니다
  lexicon: HALOT
  rationale: 불이 주어일 때 ‘삼키다’가 히브리어의 파괴적 ‘먹다/삼키다’를 가장 직접적으로 살립니다.
theological_decisions:
- issue: קִנְאַת עָם의 관계 해석
  chosen_reading: 야훼의 백성을 향한 열심으로 이해하되, 원문의 압축성을 살려 ‘향한 열심’으로 표현했습니다.
  alternative_readings:
  - 백성의 열심
  - 백성을 향한 질투
  - 백성의 질투
  rationale: 문맥은 야훼의 높이 든 손을 보지 못하던 자들이 결국 수치를 당하는 심판 장면이므로, 주체를 백성 자신보다 야훼의 변호적 열심으로 읽는 것이 자연스럽습니다. 다만 히브리어 표현이 압축되어 있으므로 과잉 설명은 피했습니다.
  doctrine_reference: 번역 철학 §3 (신학적 긴장을 해소하지 말고 보존)
