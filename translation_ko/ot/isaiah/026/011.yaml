  timestamp: '2026-07-13T16:49:14Z'
review_pass:
  verdict: revise
  source_fidelity: ‘주의 원수들을 향한 불’은 히브리어 אֵשׁ צָרֶיךָ의 관계를 부정확하게 옮기며, ‘향한’은 불이 원수들을 겨냥한다는 뜻도 자연스럽지 않습니다. 또한 본문의 압축된 관계 표현은 번역문에서 불필요하게 ‘주의 백성’으로 확정하지 않는 편이 안전합니다.
  naturalness: 합쇼체는 대체로 자연스럽지만, ‘주의 원수들을 향한 불’은 현대 한국어에서 의미 관계가 어색합니다. ‘불이 주의 원수들을 삼킬 것입니다’가 자연스럽고 문맥에도 맞습니다.
  terminology: ‘야훼여’, ‘주의 손’, ‘열심’, ‘수치를 당하다’, ‘삼키다’는 적절합니다. קִנְאַת עָם의 모호성은 각주로 보존해야 하며, 불 표현에 관한 각주는 원문의 다른 구문 가능성을 설명해야 합니다.
  issues:
  - severity: medium
    issue: ‘주의 원수들을 향한 불’이라는 표현
    rationale: 히브리어는 문자상 ‘불’과 ‘주의 원수들’을 연계하지만, 한국어 ‘원수들을 향한 불’은 불의 방향만 나타내고 뒤의 ‘그들을 삼킬 것’과도 어색하게 겹칩니다. 불이 원수들을 삼킨다는 관계를 직접 표현해야 합니다.
  - severity: medium
    issue: ‘주의 백성을 향한 열심’으로 관계를 본문에서 확정함
