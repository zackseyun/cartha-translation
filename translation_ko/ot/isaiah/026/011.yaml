revisions:
- from: 야훼여, 주의 손이 높이 들렸으나 그들은 보지 못합니다. 그들은 보게 되고, 주의 백성을 향한 열심 때문에 수치를 당할 것입니다. 참으로 주의 원수들을 향한 불이 그들을 삼킬 것입니다.[a][b]
  to: 야훼여, 주의 손이 높이 들렸으나 그들은 보지 못합니다. 그들은 백성을 향한 열심을 보고 수치를 당할 것입니다.[a] 참으로 불이 주의 원수들을 삼킬 것입니다.[b]
  rationale: 원문의 어순과 심판의 이미지를 보존하면서, קִנְאַת עָם 및 אֵשׁ צָרֶיךָ의 압축되고 논쟁 가능한 관계를 본문에서 과도하게 해석하지 않도록 조정했습니다. 불이 원수들을 삼킨다는 한국어 문장을 직접적으로 다듬고, 두 모호성은 각주로 보존했습니다.
