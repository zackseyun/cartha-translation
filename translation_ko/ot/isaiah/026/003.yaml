source:
  edition: WLC
  text: יֵ֣צֶר סָמ֔וּךְ תִּצֹּ֖ר שָׁל֣וֹם שָׁל֑וֹם כִּ֥י בְ/ךָ֖ בָּטֽוּחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''peace, peace'' — the repetition intensifies the idea of full or complete peace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the inclination' or 'the frame of mind' for 'the mind.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditional English: ''You keep him in perfect peace, whose mind is stayed on you.'' The Hebrew more directly says ''the mind'' as the subject.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 굳게 선 마음을 온전한 평강으로 지키십니다. 그 마음이 주님을 신뢰하기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘평강, 평강’ — 반복은 평강의 충만함 또는 온전함을 강조합니다.'
    reason: lexical_alternative
  - marker: b
    text: ‘마음’은 ‘성향’, ‘내적 성향’, 또는 ‘마음의 상태’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적 번역은 흔히 ‘마음이 주님께 머무는 사람’을 말합니다. 그러나 히브리어는 더 직접적으로 ‘굳게 선 마음’을 주어로 말하며, ‘굳게 선’의 대상은 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  english_pob_choice: the mind
  chosen_korean: 그 마음
  alternatives_korean:
  - 그 성향
  - 그 내면의 기울어짐
  - 그 마음의 상태
  lexicon: HALOT
  rationale: יֵצֶר는 형성, 성향, 내적 기울어짐을 가리킬 수 있으며, 문맥상 신뢰와 ‘지키다’에 연결되는 내적 상태를 뜻하므로 ‘그 마음’으로 옮겨 자연스러운 한국어 의미를 살렸습니다.
- source_word: תִּצֹּר
  english_pob_choice: You keep
  chosen_korean: 야훼께서 ... 지키십니다
  alternatives_korean:
  - 야훼께서 ... 보존하십니다
  - 야훼께서 ... 보호하십니다
  - 야훼께서 ... 간수하십니다
  lexicon: HALOT
  rationale: נצר는 지키다, 보존하다, 보호하다의 뜻이 있으나, 평강과 결합한 문맥에서 ‘지키십니다’가 가장 자연스럽고 경쾌하게 하나님의 보전 행위를 나타냅니다.
- source_word: שָׁלוֹם שָׁלוֹם
  english_pob_choice: perfect peace
  chosen_korean: 완전한 평강
  alternatives_korean:
  - 평강, 평강
  - 충만한 평강
  - 온전한 평강
  lexicon: HALOT
  rationale: 히브리어 반복은 강세를 나타내므로, 한국어에서는 의미를 풀어 ‘완전한 평강’으로 옮겨 반복의 힘을 자연스럽게 전달했습니다.
- source_word: בָּטוּחַ
  english_pob_choice: it trusts
  chosen_korean: 그것이 주님을 신뢰하기
  alternatives_korean:
  - 그것이 주님을 믿기 때문입니다
  - 그것이 주님께 의지하기 때문입니다
  - 그것이 주님 안에서 안전하기 때문입니다
  lexicon: HALOT
  rationale: בטח는 신뢰하다, 의지하다의 뜻이 있으며, 여기서는 יֵצֶר를 받는 중성적 표현으로 ‘그것이 주님을 신뢰하기’가 원문 구조를 가장 가깝게 반영합니다.
theological_decisions:
- issue: 주어를 ‘그 사람’이 아니라 ‘그 마음’으로 직접 번역할지 여부
  chosen_reading: 원문의 직접 주어인 ‘그 마음’을 살려, 사람을 암시적으로만 드러내고 문장 중심을 내적 상태에 두었습니다.
  alternative_readings:
  - 그분이 그 사람을 완전한 평강으로 지키십니다
  - 주님께서 마음이 주님께 머무는 사람을 완전한 평강으로 지키십니다
  rationale: 히브리어는 명시적 인칭대명사보다 יֵצֶר(마음/성향)을 주어로 두므로, 본문이 강조하는 내적 상태를 직접 드러내는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: שָׁלוֹם שָׁלוֹם의 반복을 어떻게 처리할지 여부
  chosen_reading: ‘완전한 평강’으로 강세를 살리되, 반복 자체는 본문 의미에 맞게 압축했습니다.
  alternative_readings:
  - 평강, 평강
  - 충만한 평강
  rationale: 반복은 단순한 중복이 아니라 강세 표현이므로, 한국어에서는 수용 가능한 관용 표현으로 옮기되 의미 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §6
