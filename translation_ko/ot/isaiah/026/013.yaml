id: ISA.26.13
reference: Isaiah 26:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
  footnotes:
  - marker: a
    text: Or 'in you alone we make mention of your name.' The Hebrew preposition in 'through/in you alone' can be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼, 우리 하나님이시여[a], 당신 외에 다른 주들이 우리를 지배하였으나, 오직 당신 안에서만 우리가 당신의 이름을 언급합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오직 당신으로 말미암아서만 우리가 당신의 이름을 언급합니다.’ 히브리어 전치사 ב는 여기서 ‘안에서’ 또는 ‘통하여/말미암아’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: O Yahweh our God
  chosen_korean: 야훼 우리 하나님이시여
  alternatives_korean:
  - 오 야훼 우리 하나님이시여
  - 야훼 우리 하나님아
  lexicon: HALOT
  rationale: 여호와 대신 학문적 음역인 야훼를 사용해 본문의 신적 이름을 직접 드러내고, 직접 호칭이므로 호격과 존칭 어미를 살렸습니다.
- source_word: בְּעָלוּנוּ אֲדֹנִים
  english_pob_choice: other lords ... have ruled over us
  chosen_korean: 다른 주들이 우리를 지배하였으나
  alternatives_korean:
  - 다른 주들이 우리 위에 군림하였으나
  - 다른 주들이 우리를 다스렸으나
  lexicon: HALOT
  rationale: בעל의 지배·통치 의미를 한국어의 '지배하다'로 옮겨 압제적 뉘앙스를 살렸고, 아도님의 복수를 '다른 주들'로 처리해 야훼와의 대비를 분명히 했습니다.
- source_word: בְּךָ לְבַד
  english_pob_choice: through you alone
  chosen_korean: 오직 당신 안에서만
  alternatives_korean:
  - 오직 당신으로 말미암아만
  - 당신 안에서만
  lexicon: HALOT
  rationale: ב의 관계·수단적 유연성을 반영해 본문은 POB의 기본 읽기와 자연스러운 한국어를 따라 '당신 안에서만'으로 두고, 의미의 여지는 주석으로 남겼습니다.
- source_word: נַזְכִּיר שְׁמֶךָ
  english_pob_choice: we make mention of your name
  chosen_korean: 우리가 당신의 이름을 부릅니다
  alternatives_korean:
  - 우리가 당신의 이름을 언급합니다
  - 우리가 당신의 이름을 기억합니다
  lexicon: HALOT
  rationale: הִזְכִּיר는 단순한 기억보다 '언급하다/부르다'의 기능을 띠므로, 예배 문맥에서 자연스럽고 한국어 신앙어휘와도 맞는 '이름을 부르다'를 채택했습니다.
theological_decisions:
- issue: ‘다른 주들’의 범주
  chosen_reading: 본문은 야훼와 대립하는 인간적 또는 외래적 지배자들을 넓게 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 우상들을 의인화한 표현으로 읽을 수 있습니다.
  - 정치적 통치자들만 가리킨다고 좁힐 수 있습니다.
  rationale: 히브리어의 복수형과 '지배하다' 동사가 모두 압제적 통치를 자연스럽게 가리키므로, 의미를 한 범주로 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: בך לבד의 의미
  chosen_reading: 본문은 '오직 당신 안에서만'으로 두고, 수단/영역의 중의성은 각주로 보존했습니다.
  alternative_readings:
  - 오직 당신으로 말미암아만
  - 오직 당신 안에서만
  rationale: 히브리어 전치사 ב는 여기서 관계적·수단적 의미를 모두 가질 수 있어, 본문은 읽기 쉬운 형태를 취하되 주석으로 대안을 남겨 원문의 중의성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
