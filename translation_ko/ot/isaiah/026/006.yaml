  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
  footnotes:
  - marker: a
    text: Or 'will trample it down.' The Hebrew verb may be understood with future force in context.
    reason: lexical_alternative
  - marker: b
    text: '''The weak'' may also be rendered ''the needy'' or ''the lowly.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 발이 그것을 짓밟습니다[a]—곧 가난한 이들의 발, 궁핍한 이들의 걸음입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘짓밟을 것입니다.’ 히브리어 동사는 문맥상 미래적 의미로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘약한 이들’로도 옮길 수 있으며, 문맥에 따라 ‘궁핍한 이들’ 또는 ‘낮은 이들’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  english_pob_choice: tramples it
  chosen_korean: 밟아 다집니다
  alternatives_korean:
  - 짓밟습니다
  - 밟습니다
  lexicon: HALOT
  rationale: רמס는 ‘밟아 짓이기다/짓밟다’의 뜻이므로 단순한 접촉보다 강한 압박을 드러내는 ‘밟아 다집니다’로 옮겼습니다. 시적 현재 시제를 살려 즉각성과 생생함을 유지했습니다.
- source_word: רָגֶל
  english_pob_choice: the foot
  chosen_korean: 발바닥이
  alternatives_korean:
  - 발이
  - 한 발이
  lexicon: HALOT
  rationale: 히브리어 단수형을 살리되, 한국어에서는 행위의 접점을 더 분명히 하는 ‘발바닥이’가 시적 이미지와 ‘밟다’의 동작을 자연스럽게 연결합니다.
- source_word: עָנִי
  english_pob_choice: the poor
  chosen_korean: 가난한 이들
  alternatives_korean:
  - 가난한 자들
  - 고난받는 이들
  - 압제받는 이들
  lexicon: HALOT
  rationale: עָנִי는 가난함과 억눌림을 함께 가리킬 수 있으나, 문맥상 사회적 전도와 겸손한 사람들을 가리키는 뜻이 두드러져 ‘가난한 이들’로 옮겼습니다.
- source_word: דַלִּים
  english_pob_choice: the weak
  chosen_korean: 궁핍한 이들
  alternatives_korean:
  - 가난한 이들
  - 약한 이들
  - 낮은 이들
  lexicon: HALOT
  rationale: עָנִי와 같은 말로 평평해지지 않도록, דַל의 ‘빈곤하고 궁핍한’ 의미를 살려 ‘궁핍한 이들’로 구분했습니다.
theological_decisions:
- issue: 명사구의 화자 초점과 대상 관계
  chosen_reading: ‘발바닥이 그것을 밟아 다집니다’로 번역해 5절의 낮아진 높은 성을 향한 심판 이미지를 이어가게 했습니다.
  alternative_readings:
  - ‘그것을 발이 짓밟습니다’
  - ‘발이 그것을 밟습니다’
  rationale: 이 절은 특정 교리 진술보다 시적 반전의 이미지가 핵심이므로, 앞절의 도시를 가리키는 대상을 한국어에 명시해 문맥 연속성을 보존했습니다.
  doctrine_reference: 문맥상 심판과 교만의 전도
