id: ISA.26.10
reference: Isaiah 26:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'If favor is shown to the wicked.' The Hebrew opening may be read conditionally rather than concessively.
    reason: alternative_reading
  - marker: b
    text: '''Righteousness'' may also be rendered ''justice.'''
    reason: lexical_alternative
  - marker: c
    text: Or, 'in an upright land' or 'in a land of fairness.'
    reason: lexical_alternative
  - marker: d
    text: '''See'' here carries the sense of perceiving or recognizing.'
    reason: lexical_alternative
  - marker: e
    text: Or, 'the loftiness' or 'the exaltation' of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 악인이 은혜를 입을지라도[a] 그는 의를 배우지 않습니다.[b] 올바름이 있는 땅에서조차[c] 그는 불의를 행하며, 야훼의 위엄을 보지 못합니다.[d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만일 악인이 은혜를 입는다면’. 히브리어 첫 구절은 조건적으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘의’는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘올바름이 있는 땅’은 ‘정직한 땅’, ‘공정한 땅’, 또는 ‘의로운 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘보다’는 여기서 단순한 시각이 아니라 인지하거나 인정하는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: e
    text: ‘위엄’은 ‘높으심’, ‘높음’, 또는 ‘존귀함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן
  english_pob_choice: Though favor is shown
  chosen_korean: 비록 … 은혜가 베풀어질지라도
  alternatives_korean:
  - 만일 … 은혜가 베풀어진다면
  - 악인에게 호의가 주어지더라도
  - 악인에게 은혜가 보여지더라도
  lexicon: HALOT
  rationale: חנן의 홉할형은 ‘은혜/호의가 베풀어지다’의 수동적 의미이므로, 조건문보다는 양보문으로 옮겨 문맥의 대조를 살렸습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 옳음
  lexicon: HALOT
  rationale: צדק은 여기서 도덕적·언약적 올바름을 가리키므로, 표준 번역어인 ‘의’를 택하되 ‘정의’로 좁히지는 않았습니다.
- source_word: בְּאֶרֶץ נְכֹחוֹת
  english_pob_choice: in a land of uprightness
  chosen_korean: 바른 땅에서도
  alternatives_korean:
  - 의의 땅에서도
  - 정직한 땅에서도
  - 공정한 땅에서도
  lexicon: HALOT
  rationale: נכחות의 직선성/정직성 이미지를 살리면서, 장소의 비유를 자연스러운 한국어로 압축해 표현했습니다.
- source_word: יְעַוֵּל
  english_pob_choice: he acts unjustly
  chosen_korean: 불의를 행하며
  alternatives_korean:
  - 그는 불공정을 저지르며
  - 그는 비뚤게 행하며
  - 그는 잘못을 행하며
  lexicon: HALOT
  rationale: עול의 피엘은 ‘부정하게 행동하다, 불의를 행하다’의 윤리·법정적 뉘앙스를 가지므로, ‘불의를 행하다’가 가장 직접적입니다.
- source_word: גֵּאוּת
  english_pob_choice: the majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 높으심
  - 숭엄함
  - 존귀함
  lexicon: HALOT
  rationale: גאות는 높아짐, 장엄함, 위엄을 뜻하며, 여기서는 야훼의 압도적 존귀를 자연스럽게 드러내는 ‘위엄’이 적합합니다.
theological_decisions:
- issue: 양보적 의미와 조건적 의미의 선택
  chosen_reading: ‘비록 … 은혜가 베풀어질지라도’로 양보를 분명히 했습니다.
  alternative_readings:
  - ‘만일 … 은혜가 베풀어진다면’
  - ‘… 은혜가 베풀어질 때’
  rationale: 문맥은 악인이 은혜를 받아도 변하지 않는다는 반전을 강조하므로, 양보문이 시적 대비를 가장 잘 전달합니다.
  doctrine_reference: 성화와 회개에 대한 성경의 반복된 증언과 정합적입니다.
