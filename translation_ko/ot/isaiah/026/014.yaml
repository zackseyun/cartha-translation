id: ISA.26.14
reference: Isaiah 26:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
  footnotes:
  - marker: a
    text: Or 'the departed spirits'; Hebrew רְפָאִים refers here to the dead in the underworld, not the ancient people called Rephaim.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have called them to account'; the Hebrew verb can mean 'visit' in either mercy or judgment, but here the context favors punishment.
    reason: lexical_alternative
  - marker: c
    text: Literally 'you have destroyed all memory of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 자들은 살지 못하고, 그 그림자들은 일어나지 못합니다. 그러므로 주께서 그들을 벌하시고 멸하시며, 그들에 대한 모든 기억을 사라지게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떠난 영들’. 히브리어 רְפָאִים은 여기서 고대의 르바임 족속이 아니라 저승의 죽은 자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주목하셨습니다’. 히브리어 동사는 자비나 심판의 의미로도 쓰이지만, 여기서는 문맥상 징벌의 뜻이 더 분명합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들에 대한 모든 기억을 멸하셨습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵתִים
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 이들
  - 죽은 사람들
  lexicon: HALOT
  rationale: 서술적 명사구로서 집합적 의미를 살리면서도 한국어에서 자연스럽고 성경체에 어울리게 옮겼습니다.
- source_word: רְפָאִים
  english_pob_choice: the shades
  chosen_korean: 그 그림자들
  alternatives_korean:
  - 그늘 같은 존재들
  - 죽은 자들의 영들
  lexicon: HALOT
  rationale: 이 구절에서는 스올의 죽은 자들을 가리키므로, 사람 집단명처럼 오해되지 않도록 문맥상 비물질적이고 음산한 이미지를 주는 표현을 택했습니다.
- source_word: פָּקַדְתָּ
  english_pob_choice: have punished
  chosen_korean: 벌하시고
  alternatives_korean:
  - 돌보시고
  - 소명하시고
  - 문책하시고
  lexicon: HALOT
  rationale: 문맥이 심판과 파괴에 이어지므로, ‘돌보다’보다 징벌 의미를 드러내는 ‘벌하시다’가 본문의 흐름을 가장 잘 반영합니다.
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  english_pob_choice: you have made all memory of them perish
  chosen_korean: 그들에 대한 모든 기억을 사라지게 하셨습니다
  alternatives_korean:
  - 그들에 대한 모든 기억을 없애셨습니다
  - 그들에 대한 모든 추억을 끊어 버리셨습니다
  lexicon: HALOT
  rationale: 직역의 ‘기억’과 동사의 소멸감을 함께 살리기 위해 ‘사라지게 하셨습니다’로 옮겼습니다. ‘추억’은 정서적 뉘앙스를 더해 원문보다 좁아질 수 있습니다.
theological_decisions:
- issue: רְפָאִים의 의미
  chosen_reading: 스올의 죽은 자들을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 고대 부족명 르바임으로 읽는 해석
  rationale: ‘죽은 자들’과의 평행 및 ‘살다/일어나다’와의 대응이 강하므로, 여기서는 역사적 민족명보다 저승의 죽은 자들을 뜻하는 시적 용례를 따르는 것이 타당합니다.
  doctrine_reference: 문맥 우선 원칙
