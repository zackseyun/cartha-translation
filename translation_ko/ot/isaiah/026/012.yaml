id: ISA.26.12
reference: Isaiah 26:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
  footnotes:
  - marker: a
    text: Or 'you have worked all our works in us'; the Hebrew may be understood as emphasizing God's action within his people, though 'for us' more directly reflects the preposition here.
    reason: alternative_reading
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being or wholeness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주께서는 우리에게 평강을 이루어 주실 것입니다.[a] 참으로 주께서는 우리의 모든 일을 우리를 위하여 이루셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평강’은 안녕이나 온전함의 뜻도 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주께서는 우리 안에서 우리의 모든 일을 이루셨습니다.’ 히브리어의 마지막 전치사구는 하나님의 백성 안에서 이루어지는 하나님의 활동을 강조하는 것으로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호칭이므로 호격을 살려 ‘야훼여’로 옮겼습니다. POB의 ‘Yahweh’를 따라 여호와 대신 학술적 음역을 유지합니다.
- source_word: תִּשְׁפֹּת
  english_pob_choice: you will establish
  chosen_korean: 평강을 세워 주십니다
  alternatives_korean:
  - 평강을 정하십니다
  - 평강을 마련하십니다
  - 평강을 두십니다
  lexicon: HALOT
  rationale: 이 동사는 평강을 주께서 확립·배치하시는 의미이므로, 자연스러운 한국어로 ‘세워 주십니다’를 택했습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 복지
  lexicon: HALOT
  rationale: 히브리어 שָׁלוֹם의 기본 의미를 살리면서, 단순 감정적 ‘평화’보다 성경적·관계적 충만함을 담는 ‘평강’이 적절합니다.
- source_word: פָּעַלְתָּ לָּנוּ
  english_pob_choice: you have accomplished all our works for us
  chosen_korean: 우리를 위하여 우리의 모든 일을 이루셨습니다
  alternatives_korean:
  - 우리 안에서 우리의 모든 일을 이루셨습니다
  - 우리의 모든 일을 하셨습니다
  - 우리의 모든 일을 이루어 주셨습니다
  lexicon: HALOT
  rationale: POB의 ‘for us’를 따라 목적·유익의 방향을 분명히 하되, ‘이루셨습니다’로 하나님이 그 일들을 성취하신 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘우리의 모든 일’과 하나님의 행위 사이의 관계
  chosen_reading: 본문은 백성의 모든 일이 궁극적으로 하나님의 이루심에 의해 성취되었다는 긴장을 유지합니다.
  alternative_readings:
  - 하나님이 우리 안에서 모든 일을 하셨다
  - 하나님이 우리의 모든 계획을 번성하게 하셨다
  rationale: 히브리어는 인간의 ‘일’과 하나님의 ‘이루심’을 함께 말하므로, 이를 지나치게 내적 성화나 번영의 언어로 좁히지 않고 그대로 보존했습니다.
  doctrine_reference: 하나님의 주권과 인간 행위의 긴장 유지
- issue: ‘평강’의 의미 범위
  chosen_reading: ‘평강’은 단순한 정서가 아니라 안녕과 온전함을 포함하는 언약적 복리를 가리킵니다.
  alternative_readings:
  - 평화
  - 안녕
  - 온전함
  rationale: 본문의 שָׁלוֹם은 넓은 의미를 가지므로, 한국어 본문에서는 간결한 ‘평강’을 두고 그 폭넓은 뜻은 각주로 보완합니다.
  doctrine_reference: shalom의 어휘적 폭 보존
