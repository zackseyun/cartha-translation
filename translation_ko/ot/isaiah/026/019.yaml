id: ISA.26.19
reference: Isaiah 26:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
  footnotes:
  - marker: a
    text: Or 'my dead body will rise'; the Hebrew reads 'my corpse' with a first-person suffix, but the plural verb suggests a collective sense, hence 'my corpses.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your dew is a dew of light' or 'radiant dew.' The Hebrew expression is difficult and may evoke life-giving, light-filled dew.
    reason: lexical_alternative
  - marker: c
    text: Or 'the earth will cast out the shades.' The Hebrew רְפָאִים can denote the departed dead, often pictured as shadowy inhabitants of the underworld.
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 죽은 자들은 살아날 것입니다[a]; 내 시체들은 일어날 것입니다. 깨어서 기뻐 외치십시오, 티끌 가운데 거하는 자들아! 주님의 이슬은 빛의 이슬이며[c][b], 땅이 죽은 자들을 내쫓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 죽은 몸은 살아날 것입니다’. 히브리어는 2인칭 소유형을 가지며, 복수 동사가 집합적 의미를 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘빛의 이슬’ 혹은 ‘빛나는 이슬’. 히브리어 표현은 난해하며, 생명을 주고 빛으로 충만한 이슬을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘땅이 그림자 같은 죽은 자들을 내쫓을 것입니다’. רְפָאִים은 종종 스올의 죽은 자들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  english_pob_choice: your dead
  chosen_korean: 주님의 죽은 자들
  alternatives_korean:
  - 당신의 죽은 자들
  - 주님의 죽은 이들
  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유 접미사는 하나님의 직접 호칭으로 이해해 ‘주님의’로 옮겼고, ‘죽은 자들’은 현대 한국어에서 자연스럽게 집단적 죽은 이들을 가리킵니다.
- source_word: נְבֵלָתִי
  english_pob_choice: my dead bodies
  chosen_korean: 내 시체들
  alternatives_korean:
  - 내 죽은 몸들
  - 내 시체
  lexicon: HALOT
  rationale: נְבֵלָה는 시체/사체를 가리키는 말이므로 ‘시체들’이 가장 직접적입니다. 복수 동사와의 긴장을 살리기 위해 단수형으로 완화하지 않았습니다.
- source_word: טַל אוֹרֹת
  english_pob_choice: a dew of lights
  chosen_korean: 빛의 이슬
  alternatives_korean:
  - 빛들의 이슬
  - 광명의 이슬
  - 밝은 이슬
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘빛들’은 의미가 분명하지 않지만, 이미지의 난해함을 유지하면서도 한국어에서는 자연스럽게 ‘빛의 이슬’로 옮기는 것이 가장 적절합니다.
- source_word: רְפָאִים
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 그림자들
  - 스올의 죽은 자들
  - 망자들
  lexicon: HALOT
  rationale: 문맥상 민족명 리파임이 아니라 스올의 죽은 자들을 가리키므로, 본문 전반의 ‘죽은 자들’ 어휘와 맞추어 번역했습니다.
- source_word: תַּפִּיל
  english_pob_choice: will cast out
  chosen_korean: 내쫓을 것입니다
  alternatives_korean:
  - 내어줄 것입니다
  - 떨어뜨릴 것입니다
  - 산출할 것입니다
  lexicon: HALOT
  rationale: 히필형의 강한 사역적 뉘앙스를 살려, 땅이 죽은 자들을 수동적으로 ‘내놓는’ 것이 아니라 힘 있게 ‘내쫓는’ 그림을 유지했습니다.
theological_decisions:
- issue: 부활 이미지의 범위
  chosen_reading: 개인적·몸의 부활 이미지를 직접적으로 보존했습니다.
  alternative_readings:
  - 민족적 회복의 은유로만 처리
  - 단순한 시적 과장으로 완화
  rationale: ‘살아날 것입니다’, ‘일어날 것입니다’, ‘티끌 가운데 거하는 자들’, ‘땅이… 내쫓을 것입니다’의 연쇄는 실제 부활의 이미지를 강하게 지시하므로, 이를 은유로만 축소하지 않았습니다.
  doctrine_reference: 본문의 종말론적 긴장을 번역에서 보존합니다.
