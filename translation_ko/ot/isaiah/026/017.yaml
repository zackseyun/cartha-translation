id: ISA.26.17
reference: Isaiah 26:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
  footnotes:
  - marker: a
    text: Or 'in your presence'; the Hebrew phrase literally refers to being before the face/presence of the LORD. Some take it as 'because of you.'
    reason: alternative_reading
translation:
  language: ko
  text: 마치 해산이 가까운 임신한 여인이 진통하며 산고로 부르짖는 것처럼, 우리도 주님 앞에서 그랬습니다, 야훼여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 면전에서’입니다. 히브리어 표현은 문자적으로는 ‘얼굴/임재 앞에’ 있는 것을 가리킵니다. 어떤 번역은 이를 ‘주님 때문에’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  english_pob_choice: Like
  chosen_korean: 마치 …처럼
  alternatives_korean:
  - …같이
  - …처럼
  lexicon: HALOT
  rationale: 비교의 시동을 자연스러운 현대 한국어로 옮기되, 히브리어의 비유 구조를 그대로 살렸습니다.
- source_word: הָרָה / תַּקְרִיב לָלֶדֶת
  english_pob_choice: a pregnant woman who is about to give birth
  chosen_korean: 해산이 가까운 임신한 여인
  alternatives_korean:
  - 곧 출산할 임신한 여자
  - 출산이 임박한 임신부
  lexicon: HALOT
  rationale: ‘임신한 여인’으로 הָרָה를, ‘해산이 가까운’으로 출산 임박의 뜻을 압축해 한국어의 흐름을 살렸습니다.
- source_word: תָּחִיל תִּזְעַק בַּחֲבָלֶיהָ
  english_pob_choice: writhes and cries out in her labor pains
  chosen_korean: 진통하며 산고로 부르짖는
  alternatives_korean:
  - 몸부림치며 해산의 고통 속에서 외치는
  - 산통으로 몸을 비틀며 소리치는
  lexicon: HALOT
  rationale: ‘진통하다’와 ‘산고’는 출산 고통의 신체성과 강도를 살리며, ‘부르짖다’로 תִּזְעַק의 큰 외침을 반영했습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주의 면전에서
  - 주님 때문에
  lexicon: HALOT
  rationale: 직역적 ‘앞에서’의 관계성을 살리되, 한국어 관용과 경외의 뉘앙스를 반영했습니다. 본문의 가능한 ‘because of you’ 의미는 과도하게 확정하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약 이름 יְהוָה를 관습적 대체어가 아닌 고유명 ‘야훼’로 옮겨, 본문의 신명 사용을 드러냈습니다.
theological_decisions:
- issue: מִפָּנֶיךָ의 관계 의미
  chosen_reading: 주님 앞에서
  alternative_readings:
  - 주님 때문에
  - 주님의 면전에서
  rationale: 문맥상 고난의 원인을 단정하기보다, 하나님의 임재 앞에서의 처지를 드러내는 읽기를 유지했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: 야훼를 현대 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문의 신명(이름)을 보존하기 위해 제목어가 아닌 고유명으로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
