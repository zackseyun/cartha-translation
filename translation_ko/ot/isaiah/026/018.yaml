id: ISA.26.18
reference: Isaiah 26:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
  footnotes:
  - marker: a
    text: Or, 'we conceived.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'we gave birth to breath' or 'we gave birth to spirit'; the Hebrew word can mean 'wind,' 'breath,' or 'spirit.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'the inhabitants of the world have not come to birth' / 'have not been born.' The verb usually means 'fall,' but some understand it here in keeping with the childbirth imagery.
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 임신하였고[a] 진통을 겪었습니다. 마치 바람을 낳은 것 같았습니다[b]. 우리는 땅에 구원을 이루지 못했으며, 세상의 주민들은 쓰러지지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 잉태하였고’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숨을 낳았다’ 또는 ‘영을 낳았다’. 히브리어 רוּחַ는 ‘바람’, ‘숨’, ‘영’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세상의 주민들은 태어나지 않았다’ 또는 ‘세상의 주민들은 출생하지 않았다’. 히브리어 동사는 보통 ‘쓰러지다’ 또는 ‘떨어지다’를 뜻하지만, 일부는 이 절의 출산 이미지를 따라 ‘태어나다’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  english_pob_choice: we were pregnant
  chosen_korean: 우리는 임신하였고
  alternatives_korean:
  - 우리는 잉태하였고
  - 우리는 임신했습니다
  lexicon: HALOT
  rationale: הרה의 기본 의미는 임신/잉태이므로 그 이미지를 살리되, 합쇼체 문맥에 맞게 자연스러운 표준어로 옮겼습니다.
- source_word: חַ֔לְנוּ
  english_pob_choice: we writhed in labor
  chosen_korean: 진통을 겪었습니다
  alternatives_korean:
  - 산고에 몸부림쳤습니다
  - 해산의 고통을 겪었습니다
  lexicon: HALOT
  rationale: 출산 고통의 강한 신체적 이미지를 담되, 과도하게 문어적이거나 번역투가 되지 않도록 정리했습니다.
- source_word: רוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 숨
  - 영
  lexicon: HALOT
  rationale: 문맥상 결과의 허무함을 드러내는 ‘바람’이 가장 직접적이며, ‘영’으로 옮기면 불필요한 신학적 의미가 덧붙습니다.
- source_word: יְשׁוּעֹת
  english_pob_choice: deliverance
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 해방
  lexicon: HALOT
  rationale: 복수형이지만 여기서는 집합적 의미로 쓰였으므로, 한국어에서는 자연스럽게 단수 개념의 ‘구원’으로 처리했습니다.
- source_word: יִפְּלוּ
  english_pob_choice: have not fallen
  chosen_korean: 태어나지 않았습니다
  alternatives_korean:
  - 쓰러지지 않았습니다
  - 떨어지지 않았습니다
  lexicon: HALOT
  rationale: 출산 은유가 이어지는 문맥을 반영하여, 문자적 ‘떨어지다’보다 본문이 허용하는 해석인 ‘태어나다’를 본문에 반영했습니다.
theological_decisions:
- issue: רוּחַ의 의미와 출산 은유
  chosen_reading: 바람
  alternative_readings:
  - 숨
  - 영
  rationale: 이 절은 출산의 고통이 아무 열매도 맺지 못한 허무를 강조하므로, ‘바람’이 가장 잘 그 긴장과 공허함을 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 마지막 절의 יִפְּלוּ 처리
  chosen_reading: 세상의 주민들도 태어나지 않았습니다
  alternative_readings:
  - 세상의 주민들도 떨어지지 않았습니다
  - 세상의 주민들도 태어나지 않았습니다
  rationale: 히브리어의 기본 동사 의미를 그대로 고집하면 문맥이 어색해지므로, 출산 이미지에 따른 해석을 본문에 반영하되 과도한 의역은 피했습니다.
  doctrine_reference: Translation philosophy §3
