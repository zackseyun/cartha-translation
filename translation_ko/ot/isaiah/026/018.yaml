    rationale: 현 본문도 ‘태어나지 않았습니다’인데 주석도 같은 뜻을 제시하여 대안 독법의 기능을 하지 못합니다. 기본 독법과 출산 이미지에 따른 해석의 관계를 명확히 해야 합니다.
