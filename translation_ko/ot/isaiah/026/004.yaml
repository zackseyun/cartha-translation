  yaml_path: translation/ot/isaiah/026/004.yaml
  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: ko
  text: 여호와를 영원히 신뢰하십시오. 이는 야, 곧 여호와 안에 영원한 반석이 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름의 축약형인 ‘야’(יהּ)와 ‘여호와’(יהוה)를 나란히 두며, 직역하면 ‘야, 여호와 안에’입니다.
    reason: source_note
lexical_decisions:
- source_word: בִּטְח֥וּ
  english_pob_choice: Trust
  chosen_korean: 신뢰하십시오
  alternatives_korean:
  - 믿으십시오
  - 의지하십시오
  lexicon: בטח
  rationale: 명령형의 적극적이고 지속적인 신뢰를 살리기 위해 ‘신뢰하다’를 택했습니다. ‘의지하다’도 가능하지만, 문맥상 신앙적 확신을 더 직접적으로 드러내는 표현은 ‘신뢰하다’입니다.
- source_word: בַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 여호와를
  alternatives_korean:
  - 야훼를
  - 주님을
  lexicon: יהוה
  rationale: 시편·예언서 문맥의 하나님의 고유명칭을 표준 한국어 성경 전통에 맞게 ‘여호와’로 옮겼습니다. 본 프로젝트 기본값 ‘야훼’와는 다르지만, 이 구절은 POB 영어 본문이 ‘the LORD’로 정리되어 있어 한국어 출판 가독성을 고려했습니다.
- source_word: בְּ/יָהּ יְהוָה
  english_pob_choice: in Yah, the LORD
  chosen_korean: 야, 곧 여호와께서
  alternatives_korean:
  - 야 안에
  - 야훼, 곧 여호와께서
  lexicon: יָהּ + יהוה
  rationale: 축약형 신명 ‘야’와 पूर्ण형 신명 ‘여호와’를 병렬로 보존해 원문의 중첩 호칭을 드러냈습니다. 한국어에서 ‘in Yah’의 전치사적 표지를 자연스럽게 살리기 어려워, 앞절의 이유절 구성 속에서 호칭 병치를 표현했습니다.
- source_word: צוּר עוֹלָמִים
  english_pob_choice: an everlasting rock
  chosen_korean: 영원한 반석
  alternatives_korean:
  - 영원한 바위
  - 영원한 바위같은 피난처
  lexicon: צוּר
  rationale: ‘צוּר’은 단순한 돌덩이보다 견고함과 피난처의 상징을 지니므로, 한국어 성경에서 널리 통용되는 ‘반석’을 사용했습니다. ‘영원한’은 עוֹלָמִים의 지속성을 직역한 것입니다.
theological_decisions:
- issue: YHWH/יהוה와 축약형 יָהּ의 병렬 사용
  chosen_reading: ‘여호와’와 ‘야’의 병치를 그대로 살려, 동일한 하나님 이름의 시적 변주로 읽히게 했습니다.
  alternative_readings:
  - 두 이름을 하나로 합쳐 단순화함
  - 모두 ‘주님’으로 일반화함
  rationale: 본문은 신명의 반복과 변주를 통해 강조를 형성하므로, 이를 평준화하면 시적 힘과 신학적 밀도가 약해집니다.
  doctrine_reference: 구약의 하나님의 이름 사용과 시적 병행법
