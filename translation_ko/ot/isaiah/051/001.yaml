  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
  footnotes:
  - marker: a
    text: Or 'justice' for 'righteousness.'
    reason: lexical_alternative
  - marker: b
    text: Verse 2 identifies this imagery with Abraham and Sarah.
    reason: cross_reference
  - marker: c
    text: Or 'from which you were hewn.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 말을 들으십시오, 의[a]를 추구하는 이들아, 야훼를 찾는 이들아. 너희가 깎여 나온 바위[c]와 너희가 파내어져 나온 채굴 구덩이를 바라보십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 2절은 이 이미지를 아브라함과 사라로 설명합니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘너희가 찍혀 나온’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내 말을 들으시오
  - 내 말을 들어 보십시오
  lexicon: HALOT
  rationale: 복수 명령형의 직접 호소를 현대 한국어 합쇼체로 자연스럽게 옮겼고, 단순 청각이 아니라 주의 깊은 경청을 살리기 위해 ‘들으십시오’를 택했습니다.
- source_word: רֹדְפֵי צֶדֶק
  english_pob_choice: you who pursue righteousness
  chosen_korean: 의를 추구하는 이들
  alternatives_korean:
  - 의를 좇는 이들
  - 의를 따르는 이들
  - 정의를 추구하는 이들
  lexicon: HALOT
  rationale: צֶדֶק의 윤리적·언약적 함의를 살려 ‘의’로 옮겼고, 현재분사적 수식을 한국어 관형구로 풀어 ‘추구하는 이들’로 자연스럽게 표현했습니다.
- source_word: מְבַקְשֵׁי יְהוָה
  english_pob_choice: you who seek Yahweh
  chosen_korean: 야훼를 찾는 이들아
  alternatives_korean:
  - 여호와를 찾는 이들아
  - 주님을 찾는 이들아
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명칭을 POB 기준에 따라 ‘야훼’로 유지했고, ‘seek’는 추상화하지 않고 직접적으로 ‘찾다’로 옮겼습니다.
- source_word: צוּר ... חֻצַּבְתֶּם / מַקֶּבֶת ... נֻקַּרְתֶּם
  english_pob_choice: the rock from which you were cut ... the quarry from which you were dug
  chosen_korean: 너희가 찍혀 나온 바위와, 너희가 파내어진 구덩이
  alternatives_korean:
  - 너희가 다듬어 나온 바위와, 너희가 파낸 구덩이
  - 너희가 깎여 나온 바위와, 너희가 캐내어진 구덩이
  lexicon: HALOT
  rationale: ‘hewn/cut’의 채석 이미지를 살리기 위해 חצב는 ‘찍혀 나오다’로, נקר는 ‘파내어지다’로 옮겨 원문의 물질적 기원을 보존했습니다. מַקֶּבֶת בּוֹר는 English POB의 수정 취지에 맞춰 ‘구덩이’로 간명하게 처리해 과잉 해석을 피했습니다.
theological_decisions:
- issue: 본문의 바위/구덩이 비유를 곧바로 역사적 인물로 풀지 않을지 여부
  chosen_reading: 비유를 본문 안에서는 유지하고, 다음 절의 설명을 기다리도록 두었습니다.
  alternative_readings:
  - 바위와 구덩이를 아브라함과 사라로 바로 명시함
  - 본문에 해설적 표현을 덧붙임
  rationale: 1절 자체는 은유를 제시할 뿐이므로, 2절이 제공하는 해석을 앞당기지 않고 독자가 본문의 이미지 자체를 먼저 듣게 하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy #1, #3'
