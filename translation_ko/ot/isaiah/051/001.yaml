  source_fidelity: 첫 번째 채석 비유는 대체로 충실하지만, מַקֶּבֶת בּוֹר는 ‘구덩이’ 하나로 축소하지 않는 편이 좋습니다. 이는 파내거나 채굴한 자리와 구덩이의 복합 이미지이며, נֻקַּרְתֶּם은 수동으로 ‘너희가 파내어져 나온’을 요구합니다.
  naturalness: 현대 합쇼체는 적절합니다. 다만 ‘너희가 파내어진 구덩이’는 문법상 구덩이 자체가 파내어진 것으로도 읽혀, 사람들이 그곳에서 파내어졌다는 원문의 관계가 다소 흐려집니다. ‘너희가 파내어져 나온 …’으로 관계를 분명히 하는 것이 자연스럽습니다.
  terminology: ‘야훼’, ‘의’, ‘바위’는 일관되고 적절합니다. חֻצַּבְתֶּם의 채석 이미지는 ‘찍혀 나온’보다 ‘깎여 나온’이 현대 한국어에서 더 자연스럽고, 제시된 대안 각주와도 부합합니다.
