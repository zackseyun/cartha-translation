    rationale: 히브리어는 채굴·파냄의 자리(מַקֶּבֶת)와 구덩이(בּוֹר)를 함께 사용합니다. 단순히 ‘구덩이’라고만 하면 첫 비유의 ‘바위’와 짝을 이루는 채석·굴착 이미지가 약해집니다.
