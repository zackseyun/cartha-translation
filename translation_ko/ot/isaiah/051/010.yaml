translation:
  language: ko
  text: 바다를 말리시고 큰 심연의 물[a]을 마르게 하시며, 바다의 깊은 곳들을 구속받은 자들[b]이 건너갈 길로 만드신 분이 바로 당신이 아니십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “넓은 심연의 물”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “속량받은 자들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא אַתְּ הִיא
  english_pob_choice: Was it not you
  chosen_korean: 바로 당신이 아니십니까?
  alternatives_korean:
  - 당신이 아니십니까?
  - 정말 당신이 아니십니까?
  lexicon: HALOT
  rationale: 수사적 질문의 반문을 살리기 위해 의문형을 유지했고, 강조된 2인칭을 현대 한국어의 자연스러운 직설적 확인 표현인 ‘바로 당신’으로 옮겼습니다.
- source_word: הַמַּחֲרֶבֶת יָם
  english_pob_choice: who dried up the sea
  chosen_korean: 바다를 말리시고
  alternatives_korean:
  - 바다를 마르게 하시고
  - 바다를 황폐하게 하시고
  lexicon: HALOT
  rationale: 물에 대한 חרב의 causative/participle 의미를 이 맥락의 출애굽 암시와 맞게 ‘말리시다’로 옮겨, 단순한 파괴보다 물이 사라지는 이미지를 분명히 했습니다.
- source_word: מֵי תְּהוֹם רַבָּה
  english_pob_choice: the waters of the great deep
  chosen_korean: 큰 깊음의 물
  alternatives_korean:
  - 거대한 깊음의 물
  - 깊고 큰 심연의 물
  lexicon: HALOT
  rationale: תְּהוֹם의 우주적·심연적 울림을 살리되 한국어에서 어색하지 않도록 ‘큰 깊음’으로 압축해 표현했습니다.
- source_word: הַשָּׂמָה מַעֲמַקֵּי יָם דֶּרֶךְ
  english_pob_choice: who made the depths of the sea a way
  chosen_korean: 바다의 깊은 곳들을 건너갈 길로 만드셔서
  alternatives_korean:
  - 바다의 깊은 곳들을 길이 되게 하셔서
  - 바다의 깊은 곳들을 한 길로 두셔서
  lexicon: HALOT
  rationale: ‘way’의 기능을 단순한 길보다 ‘건너갈 길’로 풀어, 뒤의 ‘건너가다’와 연결되는 이동 목적을 분명히 했습니다.
- source_word: לַעֲבֹר גְּאוּלִים
  english_pob_choice: for the redeemed to cross over
  chosen_korean: 구속받은 자들이 건너가게 하셨습니다
  alternatives_korean:
  - 속량된 자들이 건너가게 하셨습니다
  - 구원받은 자들이 건너가게 하셨습니다
  lexicon: HALOT
  rationale: גְּאוּלִים는 ‘구속받은 자들’이 가장 직접적이어서 이를 택했고, עבר는 출애굽 바다 통과의 실제 동작을 살려 ‘건너가다’로 옮겼습니다.
theological_decisions:
- issue: 출애굽 바다 통과와 구속 이미지의 보존
  chosen_reading: 본문의 역사적 바다 통과 이미지를 본문 안에 유지하고, 그 의미를 일반적 구원 진술로만 축소하지 않았습니다.
  alternative_readings:
  - 홍해를 명시적으로 적시하는 번역
  - 비유적 구원 진술로만 일반화하는 번역
  rationale: 히브리어는 출애굽 사건을 강하게 암시하면서도 이사야의 구속 신학으로 확장됩니다. 본문은 바다와 건넘을 직접 살리는 것이 원문 의미를 가장 온전히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
