  to: 바다를 말리시고 큰 심연의 물[a]을 마르게 하시며, 바다의 깊은 곳들을 구속받은 자들[b]이 건너갈 길로 만드신 분이 바로 당신이 아니십니까?
  rationale: 히브리어의 두 분사구를 모두 ‘당신’을 수식하도록 한 문장에 유지했습니다. ‘큰 심연의 물’로 표현을 자연스럽게 다듬고, 길을 만든 목적을 ‘구속받은 자들이 건너갈’로 보존했습니다. 각주도 실제 어휘 대안을 해당 본문 어구에 연결하도록 바로잡았습니다.
