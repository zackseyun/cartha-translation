  source_fidelity: 초안은 바다를 말리고 심연의 물을 마르게 하며 바다의 깊은 곳을 건널 길로 만들었다는 핵심 이미지를 대체로 충실히 옮겼습니다. 그러나 히브리어의 두 관계절적 분사는 모두 수사적 질문의 ‘당신’을 수식하는데, ‘그분은’으로 새 문장을 시작하면 문장 구조와 강조가 약화됩니다.
