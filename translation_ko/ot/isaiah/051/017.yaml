  source_fidelity: 개정이 필요합니다. 초안은 반복 명령과 ‘야훼의 손에서’, ‘진노의 잔’, 끝까지 비운 행위를 대체로 충실히 옮겼으나, קֻבַּעַת(사발/큰 잔)를 별도로 번역하지 않아 둘째 잔 표현의 구성 요소 하나가 누락되었습니다. 또한 ‘비틀거림의 잔, 곧 그 잔’은 원문의 ‘사발, 비틀거림의 잔’이라는 병치와 맞지 않습니다.
