id: ISA.51.17
reference: Isaiah 51:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
  footnotes:
  - marker: a
    text: Or 'the cup of reeling'; traditionally 'the cup of trembling.' The Hebrew term refers to the staggering effect of the drink.
    reason: lexical_alternative
  - marker: b
    text: Or 'the goblet' for 'the bowl.' The Hebrew word denotes a bowl-shaped drinking vessel.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from the hand of the LORD,' an idiom indicating that Jerusalem's suffering came from the LORD's judicial action.
    reason: cultural_note
translation:
  language: ko
  text: 깨어나십시오, 깨어나십시오! 일어나십시오, 예루살렘이여! 야훼의 손에서[c] 그분의 진노의 잔을 마신 예루살렘이여, 비틀거리게 하는 잔의 사발을[b] 마시고 그것을 남김없이 비웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남김없이 비웠습니다’는 히브리어 동사가 잔을 끝까지, 완전히 비우는 행위를 나타내는 데 따른 번역입니다.
    reason: lexical_note
  - marker: b
    text: ‘사발’(히브리어 쿠바앗)은 잔 모양의 사발 또는 큰 술잔을 가리킵니다. ‘비틀거리게 하는’은 그 술을 마신 결과인 혼미와 비틀거림을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼의 손에서’는 예루살렘이 겪은 고난이 야훼의 심판 행위에서 비롯되었음을 나타내는 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְעוֹרְרִי הִתְעוֹרְרִי
  english_pob_choice: Awake, awake / Wake yourself, wake yourself
  chosen_korean: 깨어나십시오, 깨어나십시오
  alternatives_korean:
  - 잠에서 깨십시오, 잠에서 깨십시오
  - 일어나십시오, 일어나십시오
  lexicon: HALOT
  rationale: 히트파엘 여성 단수 명령의 반복을 살려 긴급한 자각·각성을 나타내기 위해 같은 동사를 두 번 반복해 옮겼습니다.
- source_word: קוּמִי
  english_pob_choice: rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 떨쳐 일어나십시오
  - 일어서십시오
  lexicon: HALOT
  rationale: 서 있는 동작보다 회복과 결단을 촉구하는 명령의 뉘앙스를 살려 ‘일어나십시오’로 옮겼습니다.
- source_word: יְרוּשָׁלִַם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루사렘
  lexicon: 고유명사
  rationale: 통용되는 성경 고유명사 표기를 유지했습니다.
- source_word: מִיַּד יְהוָה
  english_pob_choice: from the hand of Yahweh
  chosen_korean: 야훼의 손에서
  alternatives_korean:
  - 야훼의 손으로부터
  - 주님의 손에서
  lexicon: HALOT
  rationale: ‘손’의 히브리어 관용구를 그대로 살려, 고난이 야훼의 주권적 행위 아래 있음을 드러냈습니다.
- source_word: כּוֹס חֲמָתוֹ
  english_pob_choice: the cup of his wrath
  chosen_korean: 그분의 진노의 잔
  alternatives_korean:
  - 그분의 분노의 잔
  - 그분의 격노의 잔
  lexicon: HALOT
  rationale: 예언서의 심판 메타포를 보존하면서 חֵמָה의 강한 심판적 정서를 ‘진노’로 옮겼습니다.
- source_word: קֻבַּעַת כּוֹס הַתַּרְעֵלָה
  english_pob_choice: the bowl, the cup of staggering
  chosen_korean: 비틀거림의 잔
  alternatives_korean:
  - 휘청거림의 잔
  - 떨림의 잔
  lexicon: HALOT
  rationale: 트랄엘라가 유발하는 결과를 ‘비틀거림’으로 자연스럽게 풀어, 전통적이지만 다소 낯선 ‘떨림’보다 의미를 분명히 했습니다.
- source_word: מָצִית
  english_pob_choice: have drained it dry
  chosen_korean: 마지막 한 방울까지 비우셨습니다
  alternatives_korean:
  - 끝까지 마셨습니다
  - 말라붙도록 다 비우셨습니다
  lexicon: HALOT
  rationale: 동사의 완료성과 완전 소진의 이미지를 살려, 단순히 ‘마셨다’보다 강한 소진을 표현했습니다.
theological_decisions:
- issue: 야훼의 손에서 마신 잔의 의미
  chosen_reading: 예루살렘이 겪는 고난을 야훼의 심판 행위로 직접 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 고난을 일반적 재난으로 완화하는 번역
  - ‘허락하신 고난’처럼 간접화하는 번역
  rationale: 본문은 ‘야훼의 손’이라는 관용구로 고난의 출처와 주권을 분명히 하므로, 이를 완화하지 않고 직역에 가깝게 유지해야 합니다.
  doctrine_reference: 예언서 심판 언어와 신적 주권의 직접성 유지
- issue: ‘진노의 잔’, ‘비틀거림의 잔’의 이중 이미지
  chosen_reading: 두 잔의 표현을 모두 살려 심판과 그 결과로서의 혼미를 함께 보이게 했습니다.
  alternative_readings:
  - 둘을 하나의 단순한 잔으로 합치는 번역
  - ‘비틀거림’ 의미를 삭제한 번역
  rationale: 히브리어는 심판의 잔과 그 효과를 중첩해 강조하므로, 그 긴장을 보존하는 것이 본문의 강도를 가장 잘 전달합니다.
  doctrine_reference: 예언적 심판 메타포 보존
