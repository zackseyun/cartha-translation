  terminology: ‘야훼’, ‘진노’, ‘예루살렘’은 적절합니다. תַּרְעֵלָה는 떨림 일반보다 술에 취한 듯한 혼미·비틀거림의 효과를 가리키므로 ‘비틀거리게 하는’으로 옮겼습니다. קֻבַּעַת는 ‘사발’로 명시해야 합니다.
