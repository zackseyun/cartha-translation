  rationale: 이 구절에서 צדקה는 하나님의 구원과 병렬을 이루며 언약적 신실함과 바른됨을 함께 드러내므로, POB의 ‘righteousness’를 따라 한국어 기본어 ‘의’로 두는 것이 가장 넓고 정확합니다.
