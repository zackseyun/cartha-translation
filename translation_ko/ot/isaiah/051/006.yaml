- source_word: לַשָּׁמַיִם / אֶל הָאָרֶץ מִתַּחַת
  english_pob_choice: to the heavens / at the earth beneath
  chosen_korean: 하늘을 … 아래의 땅을
  alternatives_korean:
  - 하늘을 … 땅 아래를
