  rationale: ‘하늘-땅’의 우주적 대비를 유지하되, 한국어에서는 ‘아래의 땅’이 מקור의 대구를 가장 분명하게 전달합니다.
- source_word: נִמְלָחוּ כֶּעָשָׁן
  english_pob_choice: will vanish like smoke
  chosen_korean: 연기처럼 사라지고
  alternatives_korean:
  - 연기처럼 흩어지고
  - 연기처럼 없어지고
  lexicon: HALOT
  rationale: 어려운 동사 נִמְלָחוּ의 의미를 POB의 해석에 따라 ‘사라지다’로 옮겨, ‘연기처럼’이라는 비유와 함께 소멸의 뉘앙스를 전달했습니다.
- source_word: תִּבְלֶה כַּבֶּגֶד
  english_pob_choice: will wear out like a garment
  chosen_korean: 옷처럼 닳아 없어지며
  alternatives_korean:
  - 의복처럼 닳아지며
  - 옷처럼 해어지며
  lexicon: HALOT
  rationale: 히브리어의 옷/의복 비유를 그대로 살리면서, 현대 한국어에서 가장 자연스러운 소멸 표현인 ‘닳아 없어지다’를 택했습니다.
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  english_pob_choice: my salvation will be forever
  chosen_korean: 내 구원은 영원히 있을 것이며
  alternatives_korean:
  - 내 구원은 영원할 것이며
  - 내 구원은 영원히 존속할 것이며
  lexicon: HALOT
  rationale: ישועה를 ‘구원’으로 옮기고, לְעוֹלָם의 지속성을 ‘영원히 있을 것이다’로 간결하게 표현했습니다.
- source_word: וְצִדְקָתִי לֹא תֵחָת
  english_pob_choice: my righteousness will not be shattered
  chosen_korean: 내 의는 무너지지 않을 것입니다
  alternatives_korean:
  - 내 의는 깨어지지 않을 것입니다
  - 내 의는 흔들리지 않을 것입니다
  lexicon: HALOT
  rationale: צדקה는 문맥상 ‘의’가 가장 기본적이며, לֹא תֵחָת의 ‘깨지다/무너지다’ 계열 의미를 한국어의 ‘무너지다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: צִדְקָתִי의 의미 범위
  chosen_reading: 내 의
  alternative_readings:
