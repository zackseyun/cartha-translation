base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
  footnotes:
  - marker: a
    text: Or, 'the heavens will dissipate like smoke.' The Hebrew verb is difficult; the sense is that the heavens pass away.
    reason: lexical_alternative
  - marker: b
    text: Or, 'my justice.' The Hebrew word can denote both righteousness and justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘을 향해 너희 눈을 들어 보십시오[a]. 아래의 땅을 보십시오. 하늘은 연기처럼 사라지고, 땅은 옷처럼 닳아 없어지며, 그 위에 사는 자들도 그와 같이 죽을 것입니다. 그러나 내 구원은 영원히 있을 것이며[b], 내 의는 무너지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘이 연기처럼 흩어질 것입니다.’ 히브리어 동사는 뜻이 어려우며, 문맥상 하늘이 사라진다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 정의.’ 히브리어 단어는 ‘의’와 ‘정의’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  english_pob_choice: Lift up your eyes
  chosen_korean: 너희 눈을 들어 보십시오
  alternatives_korean:
  - 눈을 들어 보십시오
  - 눈을 들어 올리십시오
  lexicon: HALOT
  rationale: 히브리어의 직설적 명령형과 관용적 이미지(눈을 들어)가 자연스러운 현대 한국어로 잘 살아나도록 했습니다.
- source_word: לַשָּׁמַיִם / אֶל הָאָרֶץ מִתַּחַת
  english_pob_choice: to the heavens / at the earth beneath
  chosen_korean: 하늘을 … 아래의 땅을
  alternatives_korean:
  - 하늘을 … 땅 아래를
  - 하늘을 … 밑의 땅을
  lexicon: HALOT
  rationale: ‘하늘-땅’의 우주적 대비를 유지하되, 한국어에서는 ‘아래의 땅’이 מקור의 대구를 가장 분명하게 전달합니다.
- source_word: נִמְלָחוּ כֶּעָשָׁן
  english_pob_choice: will vanish like smoke
  chosen_korean: 연기처럼 사라지고
  alternatives_korean:
  - 연기처럼 흩어지고
  - 연기처럼 없어지고
  lexicon: HALOT
  rationale: 어려운 동사 נִמְלָחוּ의 의미를 POB의 해석에 따라 ‘사라지다’로 옮겨, ‘연기처럼’이라는 비유와 함께 소멸의 뉘앙스를 전달했습니다.
- source_word: תִּבְלֶה כַּבֶּגֶד
  english_pob_choice: will wear out like a garment
  chosen_korean: 옷처럼 닳아 없어지며
  alternatives_korean:
  - 의복처럼 닳아지며
  - 옷처럼 해어지며
  lexicon: HALOT
  rationale: 히브리어의 옷/의복 비유를 그대로 살리면서, 현대 한국어에서 가장 자연스러운 소멸 표현인 ‘닳아 없어지다’를 택했습니다.
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  english_pob_choice: my salvation will be forever
  chosen_korean: 내 구원은 영원히 있을 것이며
  alternatives_korean:
  - 내 구원은 영원할 것이며
  - 내 구원은 영원히 존속할 것이며
  lexicon: HALOT
  rationale: ישועה를 ‘구원’으로 옮기고, לְעוֹלָם의 지속성을 ‘영원히 있을 것이다’로 간결하게 표현했습니다.
- source_word: וְצִדְקָתִי לֹא תֵחָת
  english_pob_choice: my righteousness will not be shattered
  chosen_korean: 내 의는 무너지지 않을 것입니다
  alternatives_korean:
  - 내 의는 깨어지지 않을 것입니다
  - 내 의는 흔들리지 않을 것입니다
  lexicon: HALOT
  rationale: צדקה는 문맥상 ‘의’가 가장 기본적이며, לֹא תֵחָת의 ‘깨지다/무너지다’ 계열 의미를 한국어의 ‘무너지다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: צִדְקָתִי의 의미 범위
  chosen_reading: 내 의
  alternative_readings:
  - 내 정의
  - 내 공의
  rationale: 이 구절에서 צדקה는 하나님의 구원과 병렬을 이루며 언약적 신실함과 바른됨을 함께 드러내므로, POB의 ‘righteousness’를 따라 한국어 기본어 ‘의’로 두는 것이 가장 넓고 정확합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη default ''righteousness'' with ''justice'' preserved in footnotes where relevant by analogy of semantic field'
