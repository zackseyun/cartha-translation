  rationale: 히브리어의 단수형을 보존하면서도 문맥상 공동체를 대표하는 한 인물의 형상을 지키는 것이 원문과 POB의 균형에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
