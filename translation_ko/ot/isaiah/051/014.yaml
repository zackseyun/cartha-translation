id: ISA.51.14
reference: Isaiah 51:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִהַ֥ר צֹעֶ֖ה לְ/הִפָּתֵ֑חַ וְ/לֹא יָמ֣וּת לַ/שַּׁ֔חַת וְ/לֹ֥א יֶחְסַ֖ר לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
  footnotes:
  - marker: a
    text: Or 'the captive will soon be released.' The Hebrew expression is difficult; the wording may evoke someone bowed down under oppression and then freed.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not die in the dungeon.' The Hebrew 'pit' can refer literally to a pit, dungeon, or figuratively to destruction/grave.
    reason: alternative_reading
translation:
  language: ko
  text: 낮아진 자는 곧 풀려나며[a], 그는 구덩이[b]에서 죽지 않을 것이며, 그의 빵은 떨어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로가 곧 풀려날 것이다.’ 히브리어 표현은 어렵고, 억압 아래 낮아진 사람이 풀려나는 모습을 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘감옥에서.’ 히브리어 ‘구덩이’는 문자적으로 구덩이, 감옥, 또는 비유적으로 파멸/무덤을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  english_pob_choice: will soon
  chosen_korean: 곧
  alternatives_korean:
  - 빨리
  - 속히
  lexicon: HALOT
  rationale: 히브리어의 속도감과 임박성을 한국어에서 자연스럽게 살리기 위해 ‘곧’을 택했습니다.
- source_word: צֹעֶה
  english_pob_choice: the one bent low
  chosen_korean: 낮아진 자
  alternatives_korean:
  - 굽은 자
  - 포로
  - 몸을 굽힌 자
  lexicon: HALOT
  rationale: 이 분사는 문자적으로는 어렵지만, POB의 의도대로 억압 아래 낮아진 상태를 드러내면서도 지나치게 ‘포로’로 한정하지 않기 위해 ‘낮아진 자’로 옮겼습니다.
- source_word: לְהִפָּתֵחַ
  english_pob_choice: be set free
  chosen_korean: 풀려나며
  alternatives_korean:
  - 열리며
  - 해방되며
  - 풀려날 것이며
  lexicon: HALOT
  rationale: 직역하면 ‘열리다’이지만 문맥상 감옥/구속에서의 석방을 뜻하므로, 한국어에서 가장 자연스럽고 선명한 ‘풀려나다’를 사용했습니다.
- source_word: לַשַּׁחַת
  english_pob_choice: in the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 함정
  - 웅덩이
  - 무덤
  lexicon: HALOT
  rationale: 히브리어 ‘שחת’의 구체적 이미지를 보존하면서도, 감옥·파멸·죽음의 중의적 여운을 남기기 위해 ‘구덩이’를 선택했습니다.
theological_decisions:
- issue: 단수 남성 대명사의 대표성
  chosen_reading: ‘그는 / 그의’로 유지해, 한 사람을 통해 포로 공동체의 구원을 대표하게 했습니다.
  alternative_readings:
  - 복수로 풀어 ‘그들은 / 그들의’로 옮김
  - 비인칭적으로 처리함
  rationale: 히브리어의 단수형을 보존하면서도 문맥상 공동체를 대표하는 한 인물의 형상을 지키는 것이 원문과 POB의 균형에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
