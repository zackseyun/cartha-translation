  terminology: ‘구덩이’는 שַּׁחַת의 구체적 이미지와 감옥·파멸·무덤으로 이어지는 여지를 잘 보존합니다. צֹעֶה는 해석이 어려우므로 ‘몸을 굽힌 자’로 형상을 유지하고, 포로라는 해석은 각주에서만 제시합니다.
