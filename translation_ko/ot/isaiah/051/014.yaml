  lexicon: HALOT
  rationale: 히브리어 ‘שחת’의 구체적 이미지를 보존하면서도, 감옥·파멸·죽음의 중의적 여운을 남기기 위해 ‘구덩이’를 선택했습니다.
theological_decisions:
- issue: 단수 남성 대명사의 대표성
  chosen_reading: ‘그는 / 그의’로 유지해, 한 사람을 통해 포로 공동체의 구원을 대표하게 했습니다.
  alternative_readings:
  - 복수로 풀어 ‘그들은 / 그들의’로 옮김
