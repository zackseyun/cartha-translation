id: ISA.51.9
reference: Isaiah 51:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
  footnotes:
  - marker: a
    text: Rahab is a poetic name used for a proud enemy power, often understood here as Egypt.
    reason: cross_reference
  - marker: b
    text: Or 'the sea monster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 깨어나십시오, 깨어나십시오. 힘을 입으십시오, 야훼의 팔이여. 옛날처럼, 먼 옛 세대처럼 깨어나십시오. 당신이 라합을 산산이 부순 이, 용을 꿰뚫은 이가 아니십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라합은 교만한 대적 권세를 가리키는 시적 이름이며, 흔히 이집트를 떠올리게 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘바다 괴물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי עוּרִי
  english_pob_choice: Awake, awake
  chosen_korean: 깨어나십시오, 깨어나십시오
  alternatives_korean:
  - 일어나십시오, 일어나십시오
  - 깨어 있으십시오, 깨어 있으십시오
  lexicon: HALOT
  rationale: 반복되는 여성 단수 명령의 호소를 살리기 위해, 한국어에서도 같은 동사 반복으로 긴박한 시적 호흡을 유지했습니다.
- source_word: לִבְשִׁי עֹז
  english_pob_choice: put on strength
  chosen_korean: 힘을 입으십시오
  alternatives_korean:
  - 강함을 입으십시오
  - 능력을 입으십시오
  - 힘으로 옷 입으십시오
  lexicon: HALOT
  rationale: ‘입다/옷 입다’의 은유를 살리면서도 한국어로 자연스럽게 읽히도록 ‘힘을 입으십시오’로 옮겼습니다.
- source_word: זְרוֹעַ יְהוָה
  english_pob_choice: arm of Yahweh
  chosen_korean: 야훼의 팔이여
  alternatives_korean:
  - 야훼의 팔아
  - 주님의 팔이여
  lexicon: HALOT
  rationale: 호격의 시적 표현을 살려 ‘팔이여’로 처리했고, יְהוָה는 본문 원문에 따라 ‘야훼’로 옮겼습니다.
- source_word: רַהַב
  english_pob_choice: Rahab
  chosen_korean: 라합
  alternatives_korean:
  - 라하브
  - 교만한 자
  lexicon: HALOT
  rationale: 시적·상징적 고유명사를 보존하기 위해 음역을 유지했습니다. 다만 본문 의미는 우주적 혼돈의 적이자 역사적 대적을 함께 떠올리게 합니다.
- source_word: תַּנִּין
  english_pob_choice: the dragon
  chosen_korean: 용
  alternatives_korean:
  - 큰 뱀
  - 바다 괴물
  lexicon: HALOT
  rationale: 시적 혼돈 괴물의 이미지를 한국어에서 가장 자연스럽고 강하게 전달하는 대응어로 ‘용’을 선택했습니다.
theological_decisions:
- issue: YHWH(יהוה)의 번역
  chosen_reading: 본문의 신명은 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 주어진 원문이 טetragrammaton יְהוָה를 직접 사용하므로, 본문 가시성 및 소스-직역 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 라합과 용 이미지의 처리
  chosen_reading: ‘라합’과 ‘용’을 그대로 살려, 역사적 대적과 혼돈 괴물의 층위를 함께 남겼습니다.
  alternative_readings:
  - 라합을 곧바로 이집트로 풀기
  - 바다 괴물로 평탄화하기
  rationale: 본문은 과거 구원 행위를 회상하며 시적·신학적 긴장을 의도하므로, 해석을 한쪽으로 좁히지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
