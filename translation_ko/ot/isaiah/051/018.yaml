  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
  footnotes:
  - marker: a
    text: Or 'from all the children she has borne ... from all the children she has raised.' The Hebrew specifically says 'sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 낳은 모든 아들 가운데 그를 인도할 자가 없으며, 그가 기른 모든 아들 가운데 그의 손을 붙들어 줄 자도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그가 낳은 모든 아들 가운데서 … 그가 기른 모든 아들 가운데서’입니다. 히브리어는 ‘자녀들’이 아니라 남성 복수형 ‘아들들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַהֵל
  english_pob_choice: to guide
  chosen_korean: 인도하는 이
  alternatives_korean:
  - 이끄는 이
  - 안내하는 이
  lexicon: HALOT
  rationale: נהל 계열의 의미는 단순한 물리적 이동보다 방향을 잡아 주고 돌보며 이끄는 것을 포함하므로, 합쇼체 문맥에서 ‘인도하는 이’가 가장 자연스럽고 원문 이미지를 잘 살립니다.
- source_word: מִכָּל בָּנִים יָלָדָה
  english_pob_choice: among all the sons she has borne
  chosen_korean: 그가 낳은 아들들 가운데서도
  alternatives_korean:
  - 그가 낳은 자녀들 가운데서도
  - 그가 길러 낸 아들들 가운데서도
  lexicon: HALOT
  rationale: 히브리어의 בָּנִים는 분명히 남성 복수 ‘아들들’이므로, POB의 성별 정확성을 따라 ‘자녀들’로 중화하지 않고 ‘아들들’로 옮겼습니다.
- source_word: מַחֲזִיק בְּיָדָהּ
  english_pob_choice: to take her by the hand
  chosen_korean: 그의 손을 붙들어 주는 이
  alternatives_korean:
  - 그의 손을 잡아 주는 이
  - 그의 손을 붙드는 이
  lexicon: HALOT
  rationale: 직역하면 ‘손을 붙들다’이지만, 문맥상 무력한 시온에게 주는 개인적 보살핌과 지지를 살려 ‘붙들어 주는 이’로 자연스럽게 표현했습니다.
- source_word: אֵין ... וְאֵין
  english_pob_choice: There is no one ... and no one
  chosen_korean: 하나도 ... 없습니다
  alternatives_korean:
  - 아무도 ... 없습니다
  - 그 누구도 ... 없습니다
  lexicon: HALOT
  rationale: 반복되는 존재 부정은 완전한 버려짐을 강조하므로, ‘하나도 ... 없습니다’로 두 차례의 부정을 간결하게 살렸습니다.
theological_decisions:
- issue: 예루살렘의 의인화와 대명사 처리
  chosen_reading: 도시/시온을 여성 인격체로 보고 대명사와 동사를 일관되게 ‘그’로 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘그녀’로 옮김
  - 직함을 덧붙여 의인화를 완화함
  rationale: 원문은 예루살렘을 여성형으로 일관되게 의인화하므로, 한국어에서도 그 인격적 비유를 유지해야 문맥의 상실이 없습니다.
  doctrine_reference: Isaiah 51 문맥의 시온 의인화
