id: ISA.51.16
reference: Isaiah 51:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
  footnotes:
  - marker: a
    text: Or 'in the shadow of my hand' or 'under the shadow of my hand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to establish the heavens.' The Hebrew literally says 'to plant the heavens,' an unusual image that may evoke creation or new-creation restoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 말을 네 입에 두고, 내 손 그늘로 너를 덮었습니다. 하늘을 심고 땅의 기초를 놓으며, 시온에게 ‘너는 내 백성이다’ 하고 말하려고 함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 손 그늘로’는 ‘내 손의 그늘 안에서/아래에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘을 심고’는 직역적 표현이며, 문맥상 창조 또는 새 창조적 회복을 연상시킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  english_pob_choice: And I have put
  chosen_korean: 내가 … 두고
  alternatives_korean:
  - 내가 … 두었습니다
  - 내가 … 넣었습니다
  lexicon: HALOT
  rationale: שׂים의 기본 뜻인 ‘두다/놓다’를 살리되, 예언적 위임 맥락에서 자연스럽게 들리도록 ‘두고’로 옮겼습니다.
- source_word: בְּפִיךָ
  english_pob_choice: in your mouth
  chosen_korean: 네 입에
  alternatives_korean:
  - 네 입속에
  - 네 입술에
  lexicon: HALOT
  rationale: 말을 입에 두는 직유를 그대로 살려 ‘입에’로 옮겼습니다. ‘입술’은 한국어에서 더 관용적이지만 원문의 직설성을 약화시킬 수 있습니다.
- source_word: וּבְצֵל יָדִי
  english_pob_choice: with the shadow of my hand
  chosen_korean: 내 손 그늘로
  alternatives_korean:
  - 내 손의 그늘로
  - 내 손 아래의 그늘로
  lexicon: HALOT
  rationale: בְּ + צֵל을 도구적/상태적으로 자연스럽게 풀어 보호의 이미지를 살렸습니다. ‘그늘’은 덮어 보호하는 뉘앙스를 잘 전달합니다.
- source_word: לִנְטֹעַ שָׁמַיִם וְלִיסֹד אָרֶץ
  english_pob_choice: to plant the heavens and to found the earth
  chosen_korean: 하늘을 심고 땅의 기초를 놓으며
  alternatives_korean:
  - 하늘을 심고 땅을 세우며
  - 하늘을 심고 땅을 기초 놓으며
  lexicon: HALOT
  rationale: נטע와 יסד의 강한 창조 이미지를 보존하되, 한국어에서 자연스러운 병렬 동사구로 다듬었습니다. ‘심다’의 낯선 이미지가 원문의 의도된 충격을 드러냅니다.
- source_word: לְצִיּוֹן עַמִּי אָתָּה
  english_pob_choice: to say to Zion, ‘You are my people.’
  chosen_korean: 시온에게 ‘너는 내 백성이다’ 하고 말하려고 함입니다
  alternatives_korean:
  - 시온에게 ‘너는 내 백성이다’라고 말하려고 함입니다
  - 시온에게 ‘너는 내 백성이다’라고 말씀하시려고 함입니다
  lexicon: HALOT
  rationale: Zion을 향한 직접 발화를 살려 인용문을 유지했고, עַמִּי אָתָּה의 언약 공식을 한국어로 자연스럽게 옮겼습니다. ‘말씀하시려고’는 직접 화행의 단순성을 약간 높여 일반 동사 ‘말하다’를 택했습니다.
theological_decisions:
- issue: 하늘과 땅을 ‘심고’ ‘기초를 놓는’ 표현의 의미 범위
  chosen_reading: 주된 본문에서는 창조적 표현을 그대로 살려 두고, 이를 곧바로 단순한 재창조/회복 비유로 축소하지 않았습니다.
  alternative_readings:
  - 이스라엘 회복을 가리키는 비유적 표현
  - 우주적 창조를 가리키는 문자적 표현
  rationale: 원문은 강한 창조 동사를 의도적으로 사용하므로, 본문이 지닌 긴장을 보존하는 쪽이 적절합니다. 독자는 회복의 함의를 읽을 수 있지만, 번역이 그 의미를 미리 제한해서는 안 됩니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘너’를 받는 대상의 불특정성
  chosen_reading: ‘네/너’로 두어, 이 말의 대상이 누구인지 본문 자체가 열어 두는 상태를 유지했습니다.
  alternative_readings:
  - 종의 인물
  - 예언자
  - 인격화된 이스라엘/시온
  rationale: 본문은 수신자를 명시하지 않으므로, 번역이 이를 해석적으로 고정하지 않았습니다. 이는 원문의 애매성과 신학적 긴장을 그대로 보존합니다.
  doctrine_reference: Translation philosophy §3
