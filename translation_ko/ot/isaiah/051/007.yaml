base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
  footnotes:
  - marker: a
    text: Or 'you who know justice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'people with my instruction in their hearts.'
    reason: lexical_alternative
  - marker: c
    text: '''Man'' translates Hebrew אֱנוֹשׁ, a singular term for a human being, often with the nuance of mortal frailty; alternatively, ''human'' or ''mortal.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'do not be dismayed' or 'do not be broken.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 말을 들으십시오. 의를 아는 이들이여[a], 내 율법을 마음에 간직한 백성이여[b], 사람의 비난을 두려워하지 말며[c], 그들의 모욕적인 말에 낙심하지 마십시오.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의를 아는 이들’은 ‘정의를 아는 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 율법’은 ‘내 교훈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֱנוֹשׁ는 단수 명사로, ‘인간’ 또는 인간의 필멸성을 강조하는 ‘필멸자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 אַל תֵּחָתּוּ는 ‘낙담하지 마십시오’ 외에 ‘무너지지 마십시오’ 또는 ‘두려워하지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  english_pob_choice: Listen to me
  chosen_korean: 내게 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 내게 귀를 기울이십시오
  lexicon: HALOT
  rationale: אֵלַי가 목적어 방향을 분명히 하는 직접 호소이므로, 현대 한국어의 자연스러운 명령형으로 압축해 옮겼습니다.
- source_word: יֹדְעֵי צֶדֶק
  english_pob_choice: you who know righteousness
  chosen_korean: 의를 아는 이들
  alternatives_korean:
  - 정의를 아는 이들
  - 의를 아는 자들
  lexicon: HALOT
  rationale: צֶדֶק은 여기서 윤리적·언약적 ‘의’가 핵심이므로 ‘의’로 옮기되, 호격의 자연스러움을 위해 ‘이들’을 사용했습니다.
- source_word: עַם תּוֹרָתִי בְלִבָּם
  english_pob_choice: people with my law in their hearts
  chosen_korean: 내 율법이 마음에 있는 백성들
  alternatives_korean:
  - 내 교훈이 마음에 있는 백성들
  - 내 율법이 그들의 마음에 있는 백성들
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 언약적 규범을 가리키므로 ‘율법’이 적절하며, בְלִבָּם은 내면화된 상태를 한국어의 관용 표현으로 살렸습니다.
- source_word: חֶרְפַּת אֱנוֹשׁ
  english_pob_choice: the reproach of man
  chosen_korean: 사람의 비난
  alternatives_korean:
  - 인의 비난
  - 인간의 조롱
  - 사람의 모욕
  lexicon: HALOT
  rationale: חֶרְפָּה는 공개적 수치·모욕을 포함한 비난의 뉘앙스를 가지므로, 현대 독자에게 자연스러운 ‘비난’으로 옮겼습니다. אֱנוֹשׁ의 단수 일반명사성은 ‘사람’으로 반영했습니다.
- source_word: וּמִגִּדֻּפֹתָם
  english_pob_choice: by their insults
  chosen_korean: 그들의 욕설 때문에
  alternatives_korean:
  - 그들의 욕 때문에
  - 그들의 모욕 때문에
  - 그들의 비방 때문에
  lexicon: HALOT
  rationale: גדף 계열은 험담보다 강한 모욕적 언사를 가리키므로, ‘욕설’이 본문의 공격적 언어를 가장 직접적으로 드러냅니다.
- source_word: אַל תֵּחָתּוּ
  english_pob_choice: do not be dismayed
  chosen_korean: 낙담하지 마십시오
  alternatives_korean:
  - 두려워하지 마십시오
  - 무너지지 마십시오
  - 기죽지 마십시오
  lexicon: HALOT
  rationale: חתת는 두려움으로 인한 내적 붕괴를 뜻하므로, 한국어에서 그 결과 상태를 자연스럽게 나타내는 ‘낙담하다’를 채택했습니다.
theological_decisions:
- issue: צֶדֶק의 번역 선택
  chosen_reading: ‘의’로 유지했습니다.
  alternative_readings:
  - ‘정의’로 옮길 수 있습니다.
  - ‘공의’로 옮길 수 있습니다.
  rationale: 이 문맥은 하나님의 도덕적 질서와 언약적 바름을 함께 가리키므로, POB의 ‘righteousness’에 대응하는 표준 신학어 ‘의’가 가장 안전합니다.
  doctrine_reference: 'POB contested terms: δικαιοσύνη/related terms are usually rendered ‘righteousness’ unless a clear social-justice sense dominates.'
- issue: אַל תֵּחָתּוּ의 강도
  chosen_reading: ‘낙담하지 마십시오’로 옮겼습니다.
  alternative_readings:
  - ‘두려워하지 마십시오’
  - ‘무너지지 마십시오’
  rationale: 병행구 ‘두려워하지 말며…’와 함께 읽을 때, 후반부는 외적 압박으로 인한 내적 꺾임을 가리키므로 한국어에서 결과를 드러내는 표현을 택했습니다.
  doctrine_reference: 'POB translation philosophy: preserve the source force while using natural modern Korean idiom.'
