  source_fidelity: 원문의 첫 술어 קָרוֹב은 ‘가깝다/가까이 있다’라는 상태를 나타내는데, 초안의 ‘가까이 왔고’는 ‘다가왔다’라는 이동·변화의 의미를 더합니다. 또한 אִיִּים은 이 문맥에서 단순한 ‘섬들’보다 먼 해안 지역 또는 해양 너머 지역들을 포괄할 수 있으므로 ‘해안 지역들’이 더 충실합니다. 복수 ‘내 팔들’과 뒤의 단수 ‘내 팔’은 유지하는 것이 적절합니다.
  naturalness: ‘내 팔을 바라며 소망할 것입니다’는 한국어에서 다소 중복적이고 ‘팔’을 소망의 대상으로 삼는 관계가 매끄럽지 않습니다. ‘내 팔에 소망을 둘 것입니다’는 원문의 ‘내 팔을 향하여/내 팔에’라는 표현과 희망의 뜻을 자연스럽게 살립니다. 현대 표준어 합쇼체에 맞게 문장을 정리했습니다.
  terminology: צִדְקִי는 ‘내 의로움’으로 유지하되 ‘정의’는 각주 대안으로 제시합니다. יִשְׁעִי는 ‘내 구원’, זְרֹעַ는 해석적으로 ‘능력’으로 바꾸지 않고 ‘팔(들)’로 유지합니다. אִיִּים의 대안으로 ‘섬들’과 ‘먼 해안 지역들’을 각주에서 제시합니다.
  issues:
  - severity: medium
    issue: ‘가까이 왔고’가 קָרוֹב의 상태적 의미에 이동의 의미를 추가합니다.
    rationale: קָרוֹב는 여기서 ‘가깝다’라는 술어 형용사입니다. ‘내 의로움이 가깝고’가 원문의 의미와 시적 병렬을 더 정확히 보존합니다.
  - severity: medium
