id: ISA.51.5
reference: Isaiah 51:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָר֤וֹב צִדְקִ/י֙ יָצָ֣א יִשְׁעִ֔/י וּ/זְרֹעַ֖/י עַמִּ֣ים יִשְׁפֹּ֑טוּ אֵלַ/י֙ אִיִּ֣ים יְקַוּ֔וּ וְ/אֶל זְרֹעִ֖/י יְיַחֵלֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
  footnotes:
  - marker: a
    text: Or 'My justice is near.' The Hebrew צדק can mean 'righteousness,' 'justice,' or 'vindication' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my arms' here, but 'my arm' later in the verse. The imagery refers to the LORD's active power.
    reason: lexical_alternative
  - marker: c
    text: Or 'the islands' or 'the distant shores.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 의로움이 가까이 왔고, 내 구원이 나갔으며, 내 팔들이 뭇 백성을 심판할 것입니다. 섬들이 나를 기다릴 것이며, 내 팔을 바라며 소망할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 정의가 가까이 왔다.’ 히브리어 צדק은 문맥에 따라 ‘의로움’, ‘정의’, ‘의로운 구원’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘내 팔들’로 복수형을 쓰지만, 뒤에서는 단수 ‘내 팔’을 씁니다. 하나님의 능동적 역사라는 이미지를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘섬들’이 아니라 ‘먼 해안 지역들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקִי
  english_pob_choice: my righteousness
  chosen_korean: 내 의로움
  alternatives_korean:
  - 내 의
  - 내 정의
  - 내 구원받음의 정당함
  lexicon: HALOT
  rationale: צדק은 문맥에 따라 ‘의/정의/의로운 구원’의 의미를 가질 수 있으므로, 기본값인 ‘의로움’을 살리되 공적·재판적 함의도 보존했습니다.
- source_word: יָצָא
  english_pob_choice: has gone out
  chosen_korean: 나갔으며
  alternatives_korean:
  - 나왔으며
  - 나아갔으며
  lexicon: HALOT
  rationale: 완료형의 완료·현재 관련성을 살려 ‘나갔으며’로 옮겼고, 하나님의 구원이 실제로 발현된 움직임을 보존했습니다.
- source_word: וּ/זְרֹעַ/י
  english_pob_choice: my arms
  chosen_korean: 내 팔들
  alternatives_korean:
  - 내 팔
  - 내 능력
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 ‘팔들’로 옮겼습니다. POB의 주석처럼 뒤의 ‘팔’과의 차이도 드러납니다.
- source_word: אִיִּים
  english_pob_choice: the coastlands
  chosen_korean: 섬들이
  alternatives_korean:
  - 해안 지역들이
  - 먼 섬들이
  - 연안들이
  lexicon: HALOT
  rationale: 이사야에서 אַיִּים은 넓게 먼 해상 지역을 가리킬 수 있으나, 한국어에서는 ‘섬들’이 가장 자연스럽고 원문의 원거리·해양 이미지도 유지합니다.
- source_word: יְיַחֵלֽוּן
  english_pob_choice: they will hope
  chosen_korean: 바라며 소망할 것입니다
  alternatives_korean:
  - 소망할 것입니다
  - 기다리며 소망할 것입니다
  - 바랄 것입니다
  lexicon: HALOT
  rationale: יָחַל 계열의 ‘기다림/소망함’과 앞의 ‘기다릴’의 병렬을 살리기 위해 ‘바라며 소망할 것입니다’로 구분해 옮겼습니다.
theological_decisions:
- issue: ‘의/정의/의로움’ 중 צדק의 번역 선택
  chosen_reading: ‘의로움’으로 본문을 두되, 공적 심판의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 내 정의
  - 내 의
  rationale: 본문이 곧바로 열방 심판과 연결되므로 단순한 내면적 ‘의’보다, 하나님의 공의로운 구원 행위를 드러내는 ‘의로움’이 문맥을 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms는 문맥에 따라 ‘righteousness/justice’의 긴장을 보존하라고 권고합니다.'
- issue: 하나님의 ‘팔’ 이미지 유지
  chosen_reading: ‘팔들/팔’을 문자적으로 유지했습니다.
  alternative_readings:
  - 능력
  - 권능
  rationale: 예언적 시문에서 ‘팔’은 하나님의 능동적 개입을 가리키는 신체 은유이므로, 추상화하지 않고 그대로 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선 원칙과 은유 보존 원칙'
