    rationale: 이사야서의 אִיִּים은 섬만이 아니라 먼 해안 지역·해양 너머 땅들을 가리킬 수 있습니다. 본문은 ‘해안 지역들’로 하고, ‘섬들’을 대안으로 제시하는 편이 안전합니다. 기존 각주의 ‘섬들’이 아니라는 문구도 본문 표기와 논리적으로 어색합니다.
  - severity: low
    issue: ‘내 팔을 바라며 소망할 것입니다’는 표현이 중복적이고 목적 관계가 부자연스럽습니다.
    rationale: יָחַל은 희망을 품고 기다리는 뜻을 가지며, 전치사구는 ‘내 팔을 향하여/내 팔에’의 방향·의탁 관계를 나타냅니다. ‘내 팔에 소망을 둘 것입니다’가 자연스럽고 의미도 보존합니다.
  - severity: low
    issue: 각주 a의 ‘의로운 구원’은 צדק의 직접적인 어휘 대안으로 제시하기에 지나치게 해석적입니다.
    rationale: ‘의로움’, ‘정의’, ‘입증/정당함’ 정도로 대안을 제한하는 것이 어휘적 불확실성을 정확히 보존합니다.
