  source_fidelity: 히브리어의 병렬 구조와 회복 약속은 대체로 잘 반영되었습니다. 그러나 마지막 절의 יִמָּצֵא בָהּ는 기쁨·즐거움뿐 아니라 감사와 노래 소리에도 함께 걸리는 ‘그 안에서 발견될 것이다’라는 서술입니다. 초안의 ‘감사와 노래의 소리가 들릴 것입니다’는 별도의 청각 동사를 보태어 원문의 구문을 바꿉니다.
  naturalness: ‘그녀의 광야/사막’은 시온의 의인화를 기계적으로 드러내어 현대 한국어 성경 문체에서는 다소 부자연스럽습니다. ‘시온의 광야/사막’이 더 명료하고 자연스럽습니다. ‘폐허를 위로하십니다’는 무생물 목적어에 다소 낯설지만 원문의 의인화와 반복을 보존하므로 유지할 수 있습니다.
