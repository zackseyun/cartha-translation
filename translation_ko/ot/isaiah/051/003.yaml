reference: Isaiah 51:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
  footnotes:
  - marker: a
    text: Or 'all her waste places' or 'all her desolate places.'
    reason: lexical_alternative
  - marker: b
    text: '''Eden'' echoes the garden imagery of Genesis; compare ''the garden of the LORD'' in the next line.'
    reason: cross_reference
  - marker: c
    text: Or 'her steppe' or 'her desert.' The Hebrew term refers to an arid plain.
    reason: lexical_alternative
  - marker: d
    text: Or 'and the voice of singing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 정녕 야훼께서 시온을 위로하십니다. 그분께서 그 모든 폐허[a]를 위로하십니다. 시온의 광야를 에덴[b]처럼, 시온의 사막[c]을 야훼의 동산처럼 만드십니다. 기쁨과 즐거움, 감사와 노래 소리[d]가 그 안에서 발견될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘폐허’는 ‘황폐한 곳’ 또는 ‘황폐한 장소들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에덴’은 창세기의 동산 이미지를 불러오며, 다음 구절의 ‘야훼의 동산’과 호응합니다.
    reason: cross_reference
  - marker: c
    text: ‘사막’은 사막 지대, 곧 건조한 평야를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘노래 소리’는 ‘노랫소리’ 또는 ‘노래하는 소리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유한 언약 이름을 살리기 위해 POB의 ‘Yahweh’를 그대로 음역하여 야훼로 옮겼습니다.
- source_word: נִחַם
  english_pob_choice: comforts
  chosen_korean: 위로하십니다
  alternatives_korean:
  - 위로합니다
  - 긍휼을 베푸십니다
  - 마음을 돌이키십니다
  lexicon: HALOT
  rationale: 시온과 폐허를 대상으로 하는 회복의 의미가 분명하므로 ‘위로하다’가 가장 직접적입니다.
- source_word: כָּל חָרְבֹתֶיהָ
  english_pob_choice: all her ruins
  chosen_korean: 그 모든 황폐한 곳
  alternatives_korean:
  - 그 모든 폐허
  - 그 모든 황폐함
  - 그 모든 무너진 곳
  lexicon: HALOT
  rationale: 도시의 ‘무너진 지점들’과 ‘폐허들’을 함께 살리기 위해 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מִדְבָּרָהּ / וְעַרְבָתָהּ
  english_pob_choice: her wilderness / her desert
  chosen_korean: 그녀의 광야 / 그녀의 사막
  alternatives_korean:
  - 그녀의 들판 / 그녀의 건조한 평야
  - 그녀의 황야 / 그녀의 사막
  - 그녀의 광야 / 그녀의 황무지
  lexicon: HALOT
  rationale: 두 용어를 구별해 주기 위해 첫째는 ‘광야’, 둘째는 ‘사막’으로 번역해 병렬 대조를 유지했습니다.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  english_pob_choice: Joy and gladness
  chosen_korean: 기쁨과 즐거움
  alternatives_korean:
  - 기쁨과 환희
  - 즐거움과 기쁨
  - 환희와 기쁨
  lexicon: HALOT
  rationale: 쌍을 이루는 축제적 정서를 자연스럽고 표준적인 한국어로 살렸습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 전통적 대체어인 ‘주님’ 대신 고유 이름 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 신적 호칭으로 바꾸지 않고 고유 이름을 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언적 시제의 처리
  chosen_reading: 현재형/미래형을 섞어 ‘위로하십니다… 만드십니다… 발견될 것입니다’로 옮겼습니다.
  alternative_readings:
  - 전부 과거형
  - 전부 미래형
  rationale: 히브리어의 예언적 확실성을 한국어에서 가장 자연스럽게 드러내기 위해, 이미 확정된 구원은 현재형으로, 결과의 도래는 미래형으로 표현했습니다.
  doctrine_reference: Prophetic discourse tense/aspect handling
