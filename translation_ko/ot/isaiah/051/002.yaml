id: ISA.51.2
reference: Isaiah 51:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַבִּ֨יטוּ֙ אֶל אַבְרָהָ֣ם אֲבִי/כֶ֔ם וְ/אֶל שָׂרָ֖ה תְּחוֹלֶלְ/כֶ֑ם כִּי אֶחָ֣ד קְרָאתִ֔י/ו וַ/אֲבָרְכֵ֖/הוּ וְ/אַרְבֵּֽ/הוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
  footnotes:
  - marker: a
    text: Or 'for I called him when he was alone.' The Hebrew literally says 'one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 아버지 아브라함과 너희를 낳은 사라를 바라보십시오. 그가 한 사람뿐이었을 때에 내가 그를 불렀고[a], 그에게 복을 주고 그를 번성하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 홀로 있을 때에’. 히브리어는 문자적으로 ‘하나’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ
  english_pob_choice: Look to
  chosen_korean: 바라보십시오
  alternatives_korean:
  - 살펴보십시오
  - 주목하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형은 단순한 시선이 아니라 본보기로 삼아 주의 깊게 바라보라는 뜻이어서, 합쇼체로 자연스럽게 ‘바라보십시오’로 옮겼습니다.
- source_word: אַבְרָהָם אֲבִיכֶם
  english_pob_choice: Abraham your father
  chosen_korean: 아브라함 너희 아버지
  alternatives_korean:
  - 너희 조상 아브라함
  - 아브라함 너희 조상
  lexicon: HALOT
  rationale: 언약적 계보를 드러내는 친족 표현을 살리기 위해 ‘아버지’를 유지했습니다. ‘조상’은 의미는 통하지만 원문의 직접성을 조금 약화합니다.
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  english_pob_choice: Sarah who bore you
  chosen_korean: 너희를 낳은 사라
  alternatives_korean:
  - 너희를 해산한 사라
  - 너희를 출산한 사라
  lexicon: HALOT
  rationale: 분사구는 사라의 모성적 출산 이미지를 가리키므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘낳은’으로 옮겼습니다. ‘해산한’은 더 문자적이지만 문맥상 다소 거칠 수 있습니다.
- source_word: אֶחָד
  english_pob_choice: when he was one
  chosen_korean: 홀로 있을 때에
  alternatives_korean:
  - 하나였을 때에
  - 한 사람뿐일 때에
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘one’을 본문 핵심인 아브라함의 단독 출발로 전달하기 위해, 본문에는 이해 가능한 표현을 두고 ‘one’의 직역 가능성은 보존했습니다.
- source_word: וְאַרְבֵּהוּ
  english_pob_choice: multiplied him
  chosen_korean: 번성하게 하였습니다
  alternatives_korean:
  - 많게 하였습니다
  - 그를 크게 번성하게 하였습니다
  lexicon: HALOT
  rationale: 히필형 ‘많게 하다/증가시키다’는 언약적 번성의 뜻이므로, 자연스럽게 그 결과를 드러내는 ‘번성하게 하였습니다’로 옮겼습니다.
theological_decisions:
- issue: אֶחָד의 의미를 어떻게 한국어 본문에 반영할지
  chosen_reading: ‘홀로 있을 때에’로 풀어 아브라함의 단독 시작을 드러냅니다.
  alternative_readings:
  - ‘하나였을 때에’로 직역
  - ‘혼자였을 때에’로 번역
  rationale: 문자적 표현인 ‘one’을 그대로 두면 한국어에서 의미가 너무 압축됩니다. 본문이 강조하는 신학적 요점—하나님이 한 사람에서 언약 백성을 시작하셨다는 사실—을 드러내기 위해 이해 가능한 풀어쓰기와 직역 성격을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
