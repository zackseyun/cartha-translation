revisions:
- from: 아브라함 너희 아버지와 너희를 낳은 사라를 바라보십시오. 내가 그를 홀로 있을 때에 불렀고, 그에게 복을 주어 번성하게 하였습니다.[a]
  to: 너희 아버지 아브라함과 너희를 낳은 사라를 바라보십시오. 그가 한 사람뿐이었을 때에 내가 그를 불렀고[a], 그에게 복을 주고 그를 번성하게 하였습니다.
  rationale: 원문의 אֶחָד이 지닌 압축성과 해석의 여지를 보존하기 위해, 주 본문에서는 ‘한 사람뿐이었을 때’로 옮기고 ‘홀로’라는 가능한 해석은 각주로 옮겼습니다. 어순과 병렬 동사 표현을 현대 한국어 합쇼체에 맞게 다듬었으며, 각주 표지를 해당 어구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:13Z'
review_pass:
  verdict: revise
  source_fidelity: ‘홀로 있을 때’는 אֶחָד(‘하나’)의 가능한 해석이지만, 본문의 ‘one’이라는 표현을 주 본문에서 해석으로 고정합니다. ‘한 사람뿐이었을 때’는 아브라함에게서 시작된 단일한 출발을 자연스럽게 드러내면서 원문의 표현을 더 가깝게 보존합니다.
  naturalness: ‘너희 아버지 아브라함’이 한국어 어순상 더 자연스럽습니다. 또한 각 동사의 목적어를 명시한 ‘그에게 복을 주고 그를 번성하게 하였습니다’는 원문의 병렬을 명료하게 전달합니다.
  terminology: ‘아버지’, ‘낳은’, ‘복을 주다’, ‘번성하게 하다’는 본문의 계보·출산·축복·증가의 어휘를 현대 한국어 합쇼체로 적절히 반영합니다.
  issues:
  - severity: medium
    issue: 본문의 ‘홀로 있을 때에’가 אֶחָד의 해석적 대안을 본문으로 채택함
    rationale: 히브리어는 문자적으로 ‘하나/한 사람’을 말합니다. ‘홀로’는 가능한 해석이므로 각주로 두고, 본문은 ‘한 사람뿐이었을 때’로 원문의 단일한 출발을 보존하는 편이 더 적절합니다.
  - severity: low
