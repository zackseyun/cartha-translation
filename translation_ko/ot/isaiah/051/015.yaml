id: ISA.51.15
reference: Isaiah 51:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
  footnotes:
  - marker: a
    text: Or 'who stills the sea, so that its waves roar'; the Hebrew participle can be understood as 'stir up' or 'still/calm' depending on context, though the following clause here favors 'stirs up.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the LORD of hosts is his name.'' Some English translations smooth this to ''is my name,'' but the Hebrew text has third person.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 내가 너의 하나님 야훼이기 때문입니다. 내가 바다를 일으켜 그 물결이 포효하게 하니, 만군의 야훼—그 이름이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다를 잠잠하게 하여’로도 옮길 수 있습니다. 히브리어 분사 רֹגַע는 문맥에 따라 ‘일으키다’ 또는 ‘잠잠하게 하다’로 이해될 수 있으나, 여기서는 뒤 문구가 ‘그 물결이 포효하게’라고 이어지므로 ‘일으키다’가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 이름’이라는 3인칭 표현을 사용합니다. 일부 번역은 이를 ‘내 이름’으로 매끄럽게 옮기지만, 본문 형태를 따라 ‘그 이름’으로 보존했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָֽנֹכִי
  english_pob_choice: For I
  chosen_korean: 이는 내가 …이기 때문입니다
  alternatives_korean:
  - 내가
  - 그리고 나는
  - 그러나 나는
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 원인·근거를 드러내는 ‘이는 …이기 때문입니다’로 자연스럽게 살려, 앞 문맥에 대한 설명적 연결을 유지했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 너의 하나님 야훼
  alternatives_korean:
  - 너희 하나님 야훼
  - 야훼 너의 하나님
  - 너의 하나님 여호와
  lexicon: HALOT
  rationale: ונתון? The divine name is rendered as ‘야훼’ per project default, and the 2인칭 단수 소유격은 ‘너의 하나님’으로 직접 보존했습니다.
- source_word: רֹגַע הַיָּם
  english_pob_choice: who stirs up the sea
  chosen_korean: 바다를 일으켜
  alternatives_korean:
  - 바다를 잠잠하게 하여
  - 바다를 가라앉혀
  - 바다를 소란케 하여
  lexicon: HALOT
  rationale: 문맥의 ‘그 물결이 포효하게 하니’와 맞물려, 참여형 רֹגַע는 여기서 바다의 격동을 일으키는 뜻으로 읽는 것이 더 적절하여 ‘일으켜’로 옮겼습니다.
- source_word: וַיֶּהֱמוּ גַּלָּיו
  english_pob_choice: so that its waves roar
  chosen_korean: 그 물결이 포효하게 하니
  alternatives_korean:
  - 그 물결이 요동하게 하니
  - 그 물결이 울부짖게 하니
  - 그 파도가 요란하게 하니
  lexicon: HALOT
  rationale: 동사의 강한 음성적·시적 효과를 살려 ‘포효하다’로 옮겼고, 소유대명사는 해석상 ‘그 물결’로 자연화했습니다.
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  english_pob_choice: Yahweh of hosts is his name
  chosen_korean: 만군의 야훼—그 이름이십니다
  alternatives_korean:
  - 만군의 야훼—그 이름입니다
  - 만군의 야훼, 그 이름이십니다
  - 만군의 야훼가 그의 이름입니다
  lexicon: HALOT
  rationale: 히브리어의 3인칭 소유형 ‘그의 이름’이라는 형식을 한국어에서도 보존하려고, 직접화법의 첫인칭으로 매끈하게 바꾸지 않고 이름 선언을 유지했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 신적 고유명은 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, 본문의 고유한 계시명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רֹגַע의 의미 선택
  chosen_reading: 바다를 일으켜
  alternative_readings:
  - 바다를 잠잠하게 하여
  - 바다를 가라앉혀
  rationale: 뒤이어지는 ‘그 물결이 포효하게’가 바다의 격동을 전제하므로, 하나님의 주권이 혼돈의 물을 일으키시는 장면으로 읽는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
