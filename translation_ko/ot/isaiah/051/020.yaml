  terminology: יהוה는 프로젝트 방침과 영어 POB에 따라 ‘야훼’로, חמה와 גערה는 각각 ‘분노’와 ‘꾸짖음’으로 유지했습니다. 호칭은 ‘당신의’로 통일했습니다.
