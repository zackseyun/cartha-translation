source:
  edition: WLC
  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
  footnotes:
  - marker: a
    text: Or “like a wild ox in a net.” The Hebrew animal term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “at every street corner.” Literally “at the head of every street.”
    reason: lexical_alternative
translation:
  language: ko
  text: 네 아들들이 기절하여 누웠습니다[a]. 그들은 모든 거리의 머리 부분에, 그물에 걸린 영양처럼 누워 있습니다. 야훼의 분노와 당신의 하나님의 꾸짖음을 가득 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그물에 걸린 들소처럼.” 히브리어 동물 용어는 확실하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנַיִךְ
  english_pob_choice: Your sons
  chosen_korean: 네 아들들
  alternatives_korean:
  - 당신의 자녀들
  lexicon: HALOT
  rationale: 2인칭 여성 단수 접미사가 붙은 בן의 복수형을 직접 반영해, 본문의 직설적 호칭과 남성 자녀 이미지를 살렸습니다.
- source_word: עֻלְּפוּ
  english_pob_choice: have fainted
  chosen_korean: 기절하여
  alternatives_korean:
  - 혼절하여
  - 쓰러져
  lexicon: HALOT
  rationale: 과거 완료의 붕괴 상태를 자연스러운 현대 한국어로 옮기되, 단순한 피곤함보다 강한 ‘기절’의 뉘앙스를 유지했습니다.
- source_word: בְּרֹאשׁ כָּל חוּצ֖וֹת
  english_pob_choice: at the head of every street
  chosen_korean: 모든 거리의 머리 부분에
  alternatives_korean:
  - 모든 거리의 모퉁이에
  - 모든 거리 어귀에
  lexicon: HALOT
  rationale: רֹאשׁ의 직역 가능성을 살려 본문에 반영하고, 관용적 해석을 과도하게 앞서지 않도록 했습니다.
- source_word: כְּתוֹא מִכְמָר
  english_pob_choice: like an antelope in a net
  chosen_korean: 그물에 걸린 영양처럼
  alternatives_korean:
  - 그물에 걸린 사슴처럼
  - 그물에 걸린 들소처럼
  lexicon: HALOT
  rationale: 동물 명칭의 불확실성을 감안해, POB의 ‘antelope’를 한국어의 자연스러운 야생 동물 이미지인 ‘영양’으로 옮겼습니다.
- source_word: חֲמַת יְהוָה
  english_pob_choice: the wrath of Yahweh
  chosen_korean: 야훼의 분노
  alternatives_korean:
  - 야훼의 진노
  - 여호와의 분노
  lexicon: HALOT
  rationale: קה/חמה의 강한 정서적·심판적 힘을 ‘분노’로 자연스럽게 살리고, 본 프로젝트 기본형에 따라 יהוה를 야훼로 옮겼습니다.
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  english_pob_choice: the rebuke of your God
  chosen_korean: 당신의 하나님의 꾸짖음
  alternatives_korean:
  - 당신의 하나님의 책망
  - 당신의 하나님의 질책
  lexicon: HALOT
  rationale: גערה의 엄한 책망/꾸짖음 의미를 현대 한국어에서 바로 이해되는 ‘꾸짖음’으로 옮겨, 분노와 병렬되는 심판적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유명성을 보존하는 ‘야훼’를 본문에 적용했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
- issue: 동물 비유의 불확실성
  chosen_reading: 영양
  alternative_readings:
  - wild ox로 인한 들소/소
  - 사슴
  rationale: 히브리어 동물명은 확정적이지 않으므로, 본문 이미지를 해치지 않는 범위에서 야생 포유류의 포획 이미지를 살리는 번역을 택했습니다.
  doctrine_reference: POB translation philosophy — source uncertainty preserved
