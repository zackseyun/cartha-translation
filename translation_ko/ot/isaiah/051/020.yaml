  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
  footnotes:
  - marker: a
    text: Or “like a wild ox in a net.” The Hebrew animal term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “at every street corner.” Literally “at the head of every street.”
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 아들들은 기절하여 모든 거리 어귀[b]에 누워 있습니다. 그들은 그물에 걸린 영양[a]처럼 야훼의 분노와 당신의 하나님의 꾸짖음으로 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그물에 걸린 들소처럼.” 히브리어 동물명은 정확히 무엇을 가리키는지 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “모든 거리의 머리에.” 또는 “모든 거리 모퉁이에.”
    reason: lexical_alternative
