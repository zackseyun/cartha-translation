id: ISA.51.19
reference: Isaiah 51:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁתַּ֤יִם הֵ֨נָּה֙ קֹֽרְאֹתַ֔יִ/ךְ מִ֖י יָנ֣וּד לָ֑/ךְ הַ/שֹּׁ֧ד וְ/הַ/שֶּׁ֛בֶר וְ/הָ/רָעָ֥ב וְ/הַ/חֶ֖רֶב מִ֥י אֲנַחֲמֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
  footnotes:
  - marker: a
    text: Or 'who will bemoan you?' The Hebrew verb can express lamenting or showing sympathy.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew says ''two things'' and then names four disasters, likely as two paired sets: ''devastation and destruction'' and ''famine and sword.'''
    reason: cultural_note
translation:
  language: ko
  text: 이 두 가지[b] 일이 당신에게 닥쳤습니다—누가 당신을 두고 슬퍼하겠습니까?—황폐[a]와 파괴, 기근과 칼입니다. 누가 당신을 위로하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐와 약탈’로도 옮길 수 있습니다. 히브리어 שֹׁד은 파괴의 결과뿐 아니라 약탈의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘두 가지’라고 한 뒤 네 재난을 말하므로, 보통은 ‘황폐와 파괴’와 ‘기근과 칼’을 두 짝으로 읽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁתַּ֤יִם הֵ֨נָּה֙
  english_pob_choice: These two things
  chosen_korean: 이 두 가지 일
  alternatives_korean:
  - 두 가지 일
  - 이 두 가지
  lexicon: HALOT
  rationale: 히브리어의 수사적 ‘두 가지’를 자연스러운 한국어로 옮기면서, 지시성도 ‘이’로 살렸습니다.
- source_word: קֹֽרְאֹתַ֔יִ/ךְ
  english_pob_choice: have come upon you
  chosen_korean: 당신에게 닥쳤습니다
  alternatives_korean:
  - 당신에게 임했습니다
  - 당신에게 와 닿았습니다
  - 당신에게 들이닥쳤습니다
  lexicon: HALOT
  rationale: 재난이 사람에게 ‘불어닥치다/닥치다’는 뜻을 살려, 단순한 ‘부르다’가 아니라 재앙의 도래를 분명히 했습니다.
- source_word: מִ֖י יָנ֣וּד לָ֑/ךְ
  english_pob_choice: who will mourn/grieve for you?
  chosen_korean: 누가 당신을 슬퍼하겠습니까?
  alternatives_korean:
  - 누가 당신을 애도하겠습니까?
  - 누가 당신을 불쌍히 여기겠습니까?
  - 누가 당신을 탄식하겠습니까?
  lexicon: HALOT
  rationale: נוּד의 ‘애도하다/슬퍼하다/동정하다’ 범위를 반영하되, 현대 한국어에서 가장 자연스럽고 문맥상 적절한 ‘슬퍼하다’를 택했습니다.
- source_word: הַ/שֹּׁ֧ד וְ/הַ/שֶּׁ֛בֶר וְ/הָ/רָעָ֥ב וְ/הַ/חֶ֖רֶב
  english_pob_choice: devastation and destruction; famine and sword
  chosen_korean: 황폐와 파괴[a], 기근과 칼[b]
  alternatives_korean:
  - 황폐와 붕괴, 기근과 칼
  - 황폐와 멸망, 기근과 칼
  - 파괴와 붕괴, 기근과 칼
  lexicon: HALOT
  rationale: שֹׁד와 שֶׁבֶר의 재난적 짝을 살리되, 한국어에서는 ‘황폐’와 ‘파괴’가 가장 압축적으로 대응합니다. ‘칼’은 전쟁을 가리키는 상징적 표현을 그대로 유지했습니다.
- source_word: מִ֥י אֲנַחֲמֵֽ/ךְ
  english_pob_choice: who will comfort you?
  chosen_korean: 누가 당신을 위로하겠습니까?
  alternatives_korean:
  - 누가 당신을 위안하겠습니까?
  - 누가 당신을 위로해 주겠습니까?
  lexicon: HALOT
  rationale: נחם의 표준적 의미를 따라, 이사야서의 반복 모티프와도 맞는 ‘위로하다’를 사용했습니다.
theological_decisions:
- issue: 히브리어의 ‘두 가지’와 이어지는 네 재난 명칭의 수사적 긴장
  chosen_reading: 본문의 ‘이 두 가지 일’을 그대로 두고, 뒤의 네 명사를 두 쌍으로 읽히게 했습니다.
  alternative_readings:
  - ‘두 가지’ 대신 단순 열거로 정리하기
  - 본문을 수정해 네 재난만 제시하기
  rationale: 원문이 의도적으로 수와 열거 사이의 긴장을 만들므로, 이를 해소하지 않고 그대로 보존하는 편이 본문 충실도가 높습니다.
  doctrine_reference: 원문 우선 원칙과 수사적 평행법 보존
