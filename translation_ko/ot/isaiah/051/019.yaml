  naturalness: ‘누가 당신을 두고 슬퍼하겠습니까?’는 재난을 당한 시온을 두고 애도하거나 동정한다는 נוּד의 문맥상 의미를 자연스러운 현대 한국어로 나타냅니다. 대시로 삽입된 첫 물음은 원문의 수사적 중단을 유지합니다.
