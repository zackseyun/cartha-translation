  source_fidelity: 수정이 필요합니다. 히브리어 כִּי는 앞 절의 권면에 대한 근거나 이유를 이끄므로 ‘보라’가 아니라 ‘이는’으로 옮겨야 합니다. 또한 ‘옷처럼 그것들을 먹고’는 비교 대상과 목적어의 관계가 다소 불분명하므로, ‘옷처럼 그들을 먹고’로 어순을 바로잡아 원문의 ‘그들을 옷처럼 먹다’라는 비유를 드러냈습니다.
