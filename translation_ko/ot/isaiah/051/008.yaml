language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כַ/בֶּ֨גֶד֙ יֹאכְלֵ֣/ם עָ֔שׁ וְ/כַ/צֶּ֖מֶר יֹאכְלֵ֣/ם סָ֑ס וְ/צִדְקָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וִ/ישׁוּעָתִ֖/י לְ/ד֥וֹר דּוֹרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
  footnotes:
  - marker: a
    text: Or 'my justice will be forever.' The Hebrew word can carry both moral-right and justice-related senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 나방이 옷처럼 그것들을 먹고, 좀이 양털처럼 그것들을 먹겠으나, 나의 의는 영원히 있을 것이며, 나의 구원은 대대로 이어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 ‘공의’ 또는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 보라
  alternatives_korean:
  - 이는
  - 그러므로
  - 왜냐하면
  lexicon: HALOT
  rationale: 히브리어 כִּי는 문맥에 따라 이유를 나타낼 수 있지만, 이 절에서는 앞말을 뒷받침하며 선언을 여는 기능이 강하므로 감탄적 전환인 ‘보라’로 자연스럽게 옮겼습니다.
- source_word: עָשׁ
  english_pob_choice: the moth
  chosen_korean: 나방
  alternatives_korean:
  - 옷좀
  - 좀벌레
  lexicon: HALOT
  rationale: 옷감을 갉아먹는 해충을 가리키므로, 한국어에서는 일반적이고 즉각 이해되는 ‘나방’이 은유를 가장 자연스럽게 살립니다.
- source_word: סָס
  english_pob_choice: the worm
  chosen_korean: 좀
  alternatives_korean:
  - 벌레
  - 애벌레
  lexicon: HALOT
  rationale: 직전의 ‘나방’과 병렬을 이루는 옷감 파괴 생물을 가리키므로, 옷좀의 이미지가 살아 있는 ‘좀’으로 옮겼습니다.
- source_word: וְצִדְקָתִי
  english_pob_choice: my righteousness
  chosen_korean: 나의 의
  alternatives_korean:
  - 나의 공의
  - 나의 정의
  lexicon: HALOT
  rationale: 하나님의 צְדָקָה는 이사야 문맥에서 언약적·구원적 성격을 포함하는 ‘의’가 기본값이므로, 본문 대비를 살려 ‘나의 의’로 번역했습니다.
- source_word: וִישׁוּעָתִי
  english_pob_choice: my salvation
  chosen_korean: 나의 구원
  alternatives_korean:
  - 나의 구출
  - 나의 спас?
  - 나의 건지심
  lexicon: HALOT
  rationale: יְשׁוּעָה는 이 문맥에서 하나님의 구원 행위를 가리키므로, 현대 한국어에서 가장 직관적인 신학 용어인 ‘구원’을 택했습니다.
theological_decisions:
- issue: צִדְקָה의 번역어 선택
  chosen_reading: ‘의’로 번역하여 하나님의 언약적 신실성과 구원적 정당성을 함께 드러냅니다.
  alternative_readings:
  - ‘공의’
  - ‘정의’
  rationale: 문맥은 인간의 덧없음과 대비되는 하나님의 영속적 성품과 구원 행위를 말하므로, ‘공의/정의’보다 이사야서의 신학적 폭을 담는 ‘의’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms table의 δικαιοσύνη 기본값 ''righteousness''에 상응하는 히브리어 용례 처리'
