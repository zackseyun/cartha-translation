  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנַ֣יִ/ךְ יְהוָ֗ה וֵ/אלֹהַ֨יִ/ךְ֙ יָרִ֣יב עַמּ֔/וֹ הִנֵּ֥ה לָקַ֛חְתִּי מִ/יָּדֵ֖/ךְ אֶת כּ֣וֹס הַ/תַּרְעֵלָ֑ה אֶת קֻבַּ֨עַת֙ כּ֣וֹס חֲמָתִ֔/י לֹא תוֹסִ֥יפִי לִ/שְׁתּוֹתָ֖/הּ עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
  footnotes:
  - marker: a
    text: Or 'the cup of reeling' or 'the cup of trembling.' The Hebrew term refers to the stupefying effect of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'the bowl/goblet of the cup of my wrath.' The Hebrew piles up vessel imagery for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 주님 야훼, 당신의 하나님, 곧 자기 백성의 송사를 맡아 변호하시는 분께서 이렇게 말씀하십니다. “보십시오, 내가 당신의 손에서 비틀거림의 잔[a], 곧 내 진노의 잔의 사발[b]을 가져갔으니, 당신은 다시는 그것을 마시지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘휘청거림의 잔’ 또는 ‘떨림의 잔’. 히브리어는 심판으로 말미암아 정신을 잃고 비틀거리는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 진노의 잔의 큰 잔’. 히브리어는 잔과 사발이라는 용기 이미지를 겹쳐 사용하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  english_pob_choice: your Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  lexicon: HALOT
  rationale: 2인칭 여성 단수 소유형이 붙은 호칭어로서 권위의 직함이므로, 현대 한국어에서는 예배적·공적 호칭인 ‘주님’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약적 고유명사를 제목어로 바꾸지 않고 음역하는 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: יָרִיב עַמּוֹ
  english_pob_choice: who pleads the cause of his people
  chosen_korean: 자기 백성의 송사를 변호하십니다
  alternatives_korean:
  - 자기 백성의 사건을 다투십니다
  - 자기 백성의 편에서 변론하십니다
  lexicon: HALOT
  rationale: ריב의 법정적 의미를 살려 ‘송사’와 ‘변호’로 옮겨, 단순한 감정적 대립이 아니라 언약적 소송/변론의 뉘앙스를 드러냈습니다.
- source_word: כּוֹס הַתַּרְעֵלָה
  english_pob_choice: the cup of staggering
  chosen_korean: 비틀거림의 잔
  alternatives_korean:
  - 비틀거림의 술잔
  - 비틀거림의 컵
  - 떨림의 잔
  lexicon: HALOT
  rationale: judgment로 인한 몽롱함·휘청거림을 나타내는 어휘이므로, 전통적 ‘떨림’보다 결과를 직접 드러내는 ‘비틀거림’을 선택했습니다.
- source_word: קֻבַּעַת
  english_pob_choice: the bowl
  chosen_korean: 잔그릇
  alternatives_korean:
  - 그릇
  - 잔
  - 술잔
  lexicon: HALOT
  rationale: 연속되는 잔 이미지의 강조를 살리기 위해 단순 반복을 피하면서도 용기 중첩을 드러내는 ‘잔그릇’으로 옮겼습니다.
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  english_pob_choice: you shall never again drink it
  chosen_korean: 다시는 그것을 마시지 않을 것입니다
  alternatives_korean:
  - 그것을 다시 마시지 않을 것입니다
  - 더 이상 그것을 마시지 않을 것입니다
  lexicon: HALOT
  rationale: 반복/계속을 끊는 יסף+עוֹד의 관용을 한국어의 ‘다시는’으로 자연스럽게 재현했습니다.
theological_decisions:
- issue: יהוה의 번역을 제목어로 처리할지 고유명사로 처리할지
  chosen_reading: 주님, 야훼, 곧 당신의 하나님
  alternative_readings:
  - 주님, 여호와, 곧 당신의 하나님
  - 주, 야훼, 곧 당신의 하나님
  rationale: 본문은 호칭어와 고유명사를 병렬로 쌓아 올리므로, 둘을 구분해 모두 살려야 합니다. ‘야훼’는 신적 이름을 보존하고, 앞의 ‘주님’은 아דֹנָי의 권위 호칭을 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 잔 비유를 도덕적·추상적으로 풀지 않고 유지할지
  chosen_reading: 비틀거림의 잔과 내 진노의 잔그릇
  alternative_readings:
  - 고난의 잔과 진노의 잔
  - 형벌의 잔
  rationale: 심판의 잔 이미지는 성경신학적으로 중요한 상호본문 연결을 가지므로, 의미를 설명으로 풀기보다 원문 은유를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it'
