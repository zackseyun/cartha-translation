source:
  edition: WLC
  text: הַקְשִׁ֤יבוּ אֵלַ/י֙ עַמִּ֔/י וּ/לְאוּמִּ֖/י אֵלַ֣/י הַאֲזִ֑ינוּ כִּ֤י תוֹרָה֙ מֵ/אִתִּ֣/י תֵצֵ֔א וּ/מִשְׁפָּטִ֔/י לְ/א֥וֹר עַמִּ֖ים אַרְגִּֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
  footnotes:
  - marker: a
    text: Or 'law' or 'teaching' for 'instruction' (Hebrew תורה).
    reason: lexical_alternative
  - marker: b
    text: Or 'my judgment' for 'my justice' (Hebrew מִשְׁפָּטִי).
    reason: lexical_alternative
  - marker: c
    text: 'The final verb may also be understood as ''I will cause [it] to rest'' or ''I will set [it],'' yielding: ''I will set my justice as a light for the peoples.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 귀를 기울이십시오, 내 백성아, 그리고 내게 귀를 기울이십시오, 내 민족아. 이는 율법이 내게서 나오고, 내가 내 정의를 뭇 백성의 빛으로 세울 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 כאן의 תורה가 지닌 ‘instruction/teaching’의 넓은 뜻을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정의’는 ‘심판’으로도 옮길 수 있습니다. 그러나 문맥상 ‘뭇 백성의 빛’과의 병행을 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 ‘세울’ 외에 ‘정착시키다’, ‘가라앉히다’, ‘쉬게 하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  english_pob_choice: Pay attention
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 들으십시오
  - 주의를 기울이십시오
  lexicon: HALOT
  rationale: 듣기보다 더 능동적인 주의의 요청을 살리면서, 현대 한국어에서 자연스럽고 격식 있는 명령형으로 옮겼습니다.
- source_word: וּלְאוּמִּי
  english_pob_choice: my nation
  chosen_korean: 내 민족아
  alternatives_korean:
  - 내 나라아
  - 내 백성아
  lexicon: HALOT
  rationale: 앞의 עַמִּי와 구별되는 평행어를 살리기 위해 ‘민족’을 택했습니다. 영어 POB의 ‘my nation’처럼 집단 정체성을 드러냅니다.
- source_word: תּוֹרָה
  english_pob_choice: instruction
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 지시
  lexicon: HALOT
  rationale: 이 절의 토라가 야훼의 권위 있는 가르침이라는 넓은 뜻을 지니지만, POB 주석 전통과 본문의 성격상 한국어에서는 ‘율법’이 가장 넓고도 문맥에 맞는 대응어입니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 내 정의
  alternatives_korean:
  - 내 심판
  - 내 판단
  lexicon: HALOT
  rationale: ‘뭇 백성의 빛’과 병행되는 긍정적 의미를 살려, 처벌적 ‘심판’보다 하나님의 바른 질서를 드러내는 ‘정의’를 택했습니다.
- source_word: אַרְגִּיעַ
  english_pob_choice: I will set / I will establish
  chosen_korean: 세울
  alternatives_korean:
  - 정착시킬
  - 가라앉힐
  - 놓을
  lexicon: HALOT
  rationale: 난해한 히필 동사의 결과적 의미를 따라, 하나님의 정의를 빛으로 ‘세우다’라는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: תּוֹרָה와 מִשְׁפָּט의 범위
  chosen_reading: 이 절은 이스라엘 내부의 규범만이 아니라, 하나님에게서 나와 뭇 백성에게 비추어질 보편적 가르침과 정의를 말합니다.
  alternative_readings:
  - 모세 율법의 이스라엘 내부 적용만을 말한다
  - 장차 주어질 단일한 법적 판결만을 가리킨다
  rationale: ‘뭇 백성’과 ‘빛’의 병행이 문맥상 확장성을 강하게 요구하므로, 보편적 선포라는 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 이사야 51:4 문맥; 번역 원칙
