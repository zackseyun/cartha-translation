id: ISA.51.12
reference: Isaiah 51:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
  footnotes:
  - marker: a
    text: Or 'a human being.' Hebrew 'son of man' here is an idiom for ordinary humanity, not necessarily a messianic title.
    reason: lexical_alternative
translation:
  language: ko
  text: “나, 바로 내가 너희를 위로하는 이입니다. 너는 누구이기에 죽을 사람을 두려워하고, 풀처럼 되도록 주어진 인자 같은 사람을 두려워하느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 인간.” 여기서 히브리어 “인자”는 메시아 칭호가 아니라 보통 인간을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  english_pob_choice: I, I am he
  chosen_korean: “나, 바로 내가 … 이입니다”
  alternatives_korean:
  - “내가, 내가 바로 …입니다”
  - “나 혼자 …입니다”
  lexicon: HALOT
  rationale: 반복된 1인칭 대명사의 강한 강조를 한국어에서도 유지하되, “바로 내가”로 자연스럽게 압축해 원문의 자기확증적 어조를 살렸습니다.
- source_word: מְנַחֶמְכֶם
  english_pob_choice: who comforts you
  chosen_korean: “너희를 위로하는 이”
  alternatives_korean:
  - “너희를 위로하시는 분”
  - “너희의 위로자”
  lexicon: HALOT
  rationale: 분사형의 지속적·특징적 행동을 한국어 관용으로 옮겨 “위로하는 이”로 표현했습니다.
- source_word: אֱנוֹשׁ יָמוּת
  english_pob_choice: man, who dies
  chosen_korean: “죽을 사람”
  alternatives_korean:
  - “죽는 사람”
  - “필멸의 사람”
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 연약한 인간성을 살리면서 뒤의 확정적 죽음을 한 덩어리로 드러내기 위해 “죽을 사람”으로 옮겼습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: the son of man
  chosen_korean: “인자 같은 사람”
  alternatives_korean:
  - “사람의 아들”
  - “한 인간”
  lexicon: HALOT
  rationale: 본문의 평행 구조를 살리기 위해 직역 요소를 유지하되, 이 구가 여기서는 메시아 칭호가 아니라 보통 인간을 가리키는 관용구임을 한국어에서 드러내기 위해 “같은 사람”을 덧붙였습니다.
- source_word: יִנָּתֵן
  english_pob_choice: is made like
  chosen_korean: “풀처럼 되도록 주어진”
  alternatives_korean:
  - “풀처럼 만들어진”
  - “풀처럼 된”
  lexicon: HALOT
  rationale: 니팔형의 결과적·상태적 의미를 살려 “주어진”으로 옮기고, 비교 대상인 풀의 덧없음을 문맥상 자연스럽게 연결했습니다.
theological_decisions:
- issue: בֶּן אָדָם의 의미를 메시아 칭호로 읽을지, 보통 인간의 관용구로 읽을지
  chosen_reading: 보통 인간을 가리키는 관용구로 유지하되, 번역은 직역 흔적을 보존함
  alternative_readings:
  - 메시아적 칭호로 암시적으로 읽기
  - “한 인간”으로 완전 의역하기
  rationale: 이 구절에서는 אֱנוֹשׁ와 평행을 이루며 인간의 유한성을 강조하므로, 메시아적 독법을 본문에 반영하지 않고 한국어에서는 원형을 살린 채 평행성과 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Gender-accurate over gender-neutral'
