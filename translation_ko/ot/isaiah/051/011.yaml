id: ISA.51.11
reference: Isaiah 51:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
  footnotes:
  - marker: a
    text: Or 'with joyful shouting'; the Hebrew term can denote jubilant cries as well as singing.
    reason: lexical_alternative
  - marker: b
    text: Or 'gladness and joy will obtain/reach them'; the Hebrew verb literally means 'catch up with, overtake,' here portraying joy as pursuing them.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 속량받은 자들은 돌아와서 노래하며 시온으로 들어올 것입니다[a]. 영원한 기쁨이 그들의 머리 위에 있을 것이며, 즐거움과 기쁨이 그들을 뒤쫓아 따라잡을 것입니다[b]. 슬픔과 탄식은 달아날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁜 외침으로’; 히브리어 רִנָּה는 노래뿐 아니라 환호성도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘즐거움과 기쁨이 그들에게 미칠 것입니다’; 히브리어 동사는 문자적으로는 ‘뒤쫓아 따라잡다’의 뜻을 지니며, 여기서는 기쁨이 사람들을 추격하는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  english_pob_choice: the redeemed
  chosen_korean: 속량받은 자들
  alternatives_korean:
  - 구속받은 자들
  - 구원받은 자들
  lexicon: HALOT
  rationale: פדה는 값을 치르고 건져내는 속량/구속의 뜻이므로, 시적 표현을 살리면서도 대상 집단을 자연스럽게 드러내는 ‘속량받은 자들’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 여호와의 이름을 보존하기 위해, 관용적 대체어가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: בְּרִנָּה
  english_pob_choice: with singing
  chosen_korean: 노래하며
  alternatives_korean:
  - 기쁜 외침으로
  - 즐거운 소리로
  lexicon: HALOT
  rationale: רִנָּה는 환호와 노래를 아우를 수 있지만, 한국어 본문에서는 시적 흐름이 자연스러운 ‘노래하며’를 택했습니다. 대안의 의미 범위는 각주로 남깁니다.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  english_pob_choice: gladness and joy
  chosen_korean: 즐거움과 기쁨
  alternatives_korean:
  - 환희와 기쁨
  - 기쁨과 즐거움
  lexicon: HALOT
  rationale: 서로 가까운 동의어 쌍이므로 한국어도 구분을 유지하되 자연스러운 병렬로 옮겼습니다. 앞의 שָׂשׂוֹן은 ‘즐거움’, 뒤의 שִׂמְחָה는 ‘기쁨’으로 대응시켰습니다.
- source_word: יַשִּׂיגוּן
  english_pob_choice: will overtake them
  chosen_korean: 그들을 뒤쫓아 따라잡을 것입니다
  alternatives_korean:
  - 그들에게 미칠 것입니다
  - 그들을 추격할 것입니다
  lexicon: HALOT
  rationale: 동사 נשׂג의 역동적 이미지, 곧 기쁨이 사람들을 ‘따라잡는’ 모습을 살리기 위해 단순히 ‘얻다/이르다’보다 추격적 표현을 택했습니다.
- source_word: נָסוּ
  english_pob_choice: will flee away
  chosen_korean: 달아날 것입니다
  alternatives_korean:
  - 도망칠 것입니다
  - 사라질 것입니다
  lexicon: HALOT
  rationale: 예언적 시문맥에서 결과적으로 사라지는 상태를 자연스러운 미래로 옮기되, 원문의 도주 이미지를 살려 ‘달아날 것입니다’로 번역했습니다.
theological_decisions:
- issue: יְהוָה를 한국어로 어떻게 표시할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 대체 칭호가 아니라 언약적 고유명사를 사용하므로, 이를 숨기지 않고 직접 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רִנָּה의 의미 범위와 한국어 본문 처리
  chosen_reading: 노래하며
  alternative_readings:
  - 기쁜 외침으로
  - 환호하며
  rationale: 히브리어 רִנָּה는 노래와 환호를 모두 포괄할 수 있으므로, 본문은 읽기 자연성을 위해 ‘노래하며’로 두고 의미 폭은 각주로 보완했습니다.
  doctrine_reference: 'POB lexical policy: preserve documented lexical tension rather than flattening it'
