id: ISA.20.1
reference: Isaiah 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת בֹּ֤א תַרְתָּן֙ אַשְׁדּ֔וֹדָ/ה בִּ/שְׁלֹ֣ח אֹת֔/וֹ סַֽרְג֖וֹן מֶ֣לֶךְ אַשּׁ֑וּר וַ/יִּלָּ֥חֶם בְּ/אַשְׁדּ֖וֹד וַֽ/יִּלְכְּדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
  footnotes:
  - marker: a
    text: '''Tartan'' is likely an Assyrian official title, possibly equivalent to ''commander-in-chief,'' rather than a personal name.'
    reason: cultural_note
translation:
  language: ko
  text: 다르단이 아스돗에 왔던 해에, 앗수르 왕 사르곤이 그를 보냈을 때에, 다르단은 아스돗과 싸워 그곳을 점령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다르단’은 개인명이 아니라 앗수르의 관직명이며, 아마도 ‘총사령관’에 해당하는 직책일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַרְתָּן
  english_pob_choice: the Tartan
  chosen_korean: 다르단
  alternatives_korean:
  - 다르탄
  - 총사령관
  lexicon: HALOT
  rationale: 히브리어가 개인명보다 앗수르 관직명을 가리킬 가능성이 크므로 음역을 유지하되, 직책으로 읽히도록 고유명사화하지 않고 옮겼습니다.
- source_word: בִּ/שְׁלֹח אֹת֔/וֹ
  english_pob_choice: when Sargon king of Assyria sent him
  chosen_korean: 그를 보낸 해에
  alternatives_korean:
  - 사르곤 왕이 그를 보냈을 때
  - 앗수르 왕 사르곤이 그를 보낼 때
  lexicon: HALOT
  rationale: ב + 부정사구가 시점 배경을 표시하므로 한국어에서는 자연스럽게 시간 부사구로 풀어, 행위의 주체와 시점을 분명히 했습니다.
- source_word: וַ/יִּלָּחֶם בְּ/אַשְׁדּוֹד
  english_pob_choice: and he fought against Ashdod
  chosen_korean: 아스돗과 싸워
  alternatives_korean:
  - 아스돗을 향해 싸워
  - 아스돗을 공격하여
  lexicon: HALOT
  rationale: לחם with ב는 대개 ‘~와 싸우다/~을 상대로 싸우다’의 의미이므로, 군사적 대립을 간결하게 드러냈습니다.
- source_word: וַֽ/יִּלְכְּדָֽ/הּ
  english_pob_choice: and captured it
  chosen_korean: 그것을 점령했습니다
  alternatives_korean:
  - 그것을 포로로 잡았습니다
  - 그것을 빼앗았습니다
  lexicon: HALOT
  rationale: 성과로서 도시를 ‘잡다/점령하다’는 뜻을 살리되, 현대 한국어에서 전쟁 맥락에 자연스러운 ‘점령했습니다’를 선택했습니다.
theological_decisions:
- issue: 앗수르 관직명 תַרְתָּן의 처리
  chosen_reading: 인명으로 고정하지 않고 관직으로 읽히도록 음역을 유지했습니다.
  alternative_readings:
  - ‘총사령관’으로 풀어 번역하기
  - 고유명사처럼 ‘다르탄’으로만 처리하기
  rationale: 본문과 EN POB 주석이 관직명 가능성을 분명히 하므로, 의미를 단정적으로 풀어버리지 않고 독자가 역사적·행정적 뉘앙스를 보게 했습니다.
  doctrine_reference: 성경 본문 해석의 역사-문법적 충실성
- issue: 시간구조의 재현
  chosen_reading: ‘그를 보낸 해에’로 배경 시점을 앞세워 사건의 순서를 한국어 문장에 맞게 재구성했습니다.
  alternative_readings:
  - 직역하여 ‘보내는 중에’라고 하기
  - ‘그를 보낸 때’라고만 하기
  rationale: 히브리어의 ב + 부정사구는 동시적 배경을 형성하므로, 사건 서술의 흐름을 해치지 않으면서도 원문의 시간 표지를 유지했습니다.
  doctrine_reference: 성경 번역의 문법-의미 대응
