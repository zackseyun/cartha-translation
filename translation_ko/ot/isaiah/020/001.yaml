  source_fidelity: 개역안은 핵심 사건과 행위자, 곧 사르곤이 다르단을 보냈고 다르단이 아스돗과 싸워 점령했다는 내용을 충실히 전달합니다. 그러나 히브리어는 ‘다르단이 아스돗에 왔던 해’를 주된 연대 표지로 삼고, 사르곤이 그를 보낸 일을 그에 수반된 시간 상황으로 제시합니다. 현행 ‘사르곤이 그를 보낸 해에’는 이 초점을 바꾸므로 바로잡는 편이 안전합니다.
  naturalness: ‘아스돗으로 와서’와 ‘아스돗과 싸워’는 자연스럽습니다. 다만 시간 부사구를 원문의 구조에 맞추어 조정하고, 마지막 대명사는 도시를 가리키는 ‘그곳’으로 하여 한국어에서 더 분명하게 했습니다.
