id: ISA.20.5
reference: Isaiah 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַתּ֖וּ וָ/בֹ֑שׁוּ מִ/כּוּשׁ֙ מַבָּטָ֔/ם וּ/מִן מִצְרַ֖יִם תִּפְאַרְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
  footnotes:
  - marker: a
    text: Cush is the ancient region south of Egypt, often associated with Nubia; older English versions sometimes render it 'Ethiopia.'
    reason: cultural_note
  - marker: b
    text: Or 'their expectation' for 'their hope.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their glory' for 'their boast.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들이 기대하던 구스[a] 때문에, 그리고 자기들의 자랑이던 이집트 때문에 놀라고 부끄러워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 구스는 고대 이집트 남쪽 지역으로, 오늘날의 누비아와 연관되는 지명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְחַתּוּ
  english_pob_choice: they will be dismayed
  chosen_korean: 놀라고
  alternatives_korean:
  - 낙담하고
  - 두려워하고
  - 당황하고
  lexicon: HALOT
  rationale: חתת의 결과적 의미를 미래 서술로 풀어, 감정적 붕괴와 동요를 자연스러운 한국어로 나타냈습니다.
- source_word: וָבֹשׁוּ
  english_pob_choice: and ashamed
  chosen_korean: 부끄러워할 것입니다
  alternatives_korean:
  - 수치를 당할 것입니다
  - 창피를 당할 것입니다
  - 망신할 것입니다
  lexicon: HALOT
  rationale: בוש의 핵심인 수치와 굴욕을 살리되, 현대 한국어에서 가장 자연스러운 형식으로 옮겼습니다.
- source_word: מִכּוּשׁ מַבָּטָם
  english_pob_choice: because of Cush, their hope
  chosen_korean: 자기들의 바람이던 구스 때문에
  alternatives_korean:
  - 자기들의 희망이던 구스 때문에
  - 자기들이 기대하던 구스 때문에
  - 기대의 대상이던 구스 때문에
  lexicon: HALOT
  rationale: מַבָּטָם을 단순한 추상명사 '희망'보다 문맥상 의지와 기대를 담은 표현으로 풀어, '바람'으로 옮겼습니다. 구스는 고유지명으로 음역합니다.
- source_word: וּמִן מִצְרַיִם תִּפְאַרְתָּם
  english_pob_choice: and because of Egypt, their boast
  chosen_korean: 그리고 이집트 때문에
  alternatives_korean:
  - 그리고 이집트로 인해
  - 그리고 이집트를 자랑하던 때문에
  - 그리고 이집트를 자랑거리로 삼았기 때문에
  lexicon: HALOT
  rationale: parallel한 מן-구문을 원인 표지로 처리했습니다. תִּפְאַרְתָּם의 'boast'를 본문 흐름상 한국어에서는 앞의 '바람'과 병렬되는 기대 대상의 좌절로 자연스럽게 드러내도록 했습니다.
theological_decisions:
- issue: 구스와 이집트를 둘 다 기대의 대상이자 자랑의 근거로 제시하는 병렬 구조
  chosen_reading: 두 나라에 대한 의지의 붕괴를 각각 '바람'과 원인 구문으로 드러내어, 예언적 수치의 강도를 유지했습니다.
  alternative_readings:
  - 두 나라를 모두 '희망'과 '자랑'으로 직역할 수 있습니다.
  - '''이집트, 그들의 영광''처럼 더 직역적인 표현도 가능합니다.'
  rationale: 예언 본문의 수치 선언은 단순 정보 전달보다 기대의 붕괴를 드러내는 데 초점이 있으므로, 한국어에서 의미 전달이 가장 분명한 표현을 택했습니다.
  doctrine_reference: 예언서의 수치/심판 진술의 수사적 기능
