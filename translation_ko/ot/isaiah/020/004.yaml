source:
  edition: WLC
  text: כֵּ֣ן יִנְהַ֣ג מֶֽלֶךְ אַ֠שּׁוּר אֶת שְׁבִ֨י מִצְרַ֜יִם וְ/אֶת גָּל֥וּת כּ֛וּשׁ נְעָרִ֥ים וּ/זְקֵנִ֖ים עָר֣וֹם וְ/יָחֵ֑ף וַ/חֲשׂוּפַ֥י שֵׁ֖ת עֶרְוַ֥ת מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
  footnotes:
  - marker: a
    text: Or 'with buttocks bared.' The Hebrew expression is deliberately graphic, portraying the humiliation of Egypt and Cush in exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'Egypt's shame.' The Hebrew literally says 'the nakedness of Egypt,' preserving the imagery of public exposure and disgrace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 앗수르 왕이 이집트의 포로들과 구스의 유배민을 — 젊은이와 노인, 벌거벗고 맨발이며, 엉덩이가 드러난 채로 — 끌고 갈 것입니다. 그것이 이집트의 벌거벗음입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘엉덩이가 드러난 채로’라는 매우 노골적인 표현을 사용하여, 포로가 된 이집트와 구스의 치욕을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이집트의 벌거벗음’이라고 하며, 공개적 노출과 수치를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן / so
  english_pob_choice: so
  chosen_korean: 그리하여
  alternatives_korean:
  - 그래서
  - 이처럼
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 예언적 표징과 그 성취를 잇는 인과·결과 연결을 자연스럽게 드러내면서도, 문어체 예언문에 맞는 공적 어감을 유지합니다.
- source_word: יִנְהַג
  english_pob_choice: will lead away
  chosen_korean: 끌고 갈 것입니다
  alternatives_korean:
  - 데려갈 것입니다
  - 몰고 갈 것입니다
  - 인도할 것입니다
  lexicon: HALOT
  rationale: 포로 이송의 강제성과 굴욕을 살리기 위해 단순한 ‘인도’보다 ‘끌고 가다’를 택했습니다. 영어 POB의 'lead away'가 담는 강제 이동의 뉘앙스를 반영합니다.
- source_word: שְׁבִי / גָּלוּת
  english_pob_choice: captives / exiles
  chosen_korean: 포로들 / 유배민
  alternatives_korean:
  - 사로잡힌 자들 / 유배자들
  - 포로 된 자들 / 포로민
  lexicon: HALOT
  rationale: שְׁבִי는 사람을 가리키는 포로 집단이므로 ‘포로들’로, גָּלוּת는 유배된 사람들을 가리키므로 ‘유배민’으로 옮겨 상태보다 집단성을 살렸습니다.
- source_word: עָרוֹם וְיָחֵף / חֲשׂוּפַי שֵׁת
  english_pob_choice: naked and barefoot / with buttocks uncovered
  chosen_korean: 벌거벗고 맨발이며, 엉덩이가 드러난 채로
  alternatives_korean:
  - 나체로 맨발이며, 엉덩이가 드러난 채로
  - 벌거벗고 맨발이며, 엉덩이를 드러낸 채로
  lexicon: HALOT
  rationale: 노골적인 수치의 이미지를 완화하지 않도록 ‘벌거벗고 맨발이며’와 ‘엉덩이가 드러난 채로’를 택했습니다. 본문의 노출·치욕 이미지를 한국어로 직접적으로 전달합니다.
- source_word: עֶרְוַת מִצְרָיִם
  english_pob_choice: the nakedness of Egypt
  chosen_korean: 이집트의 벌거벗음
  alternatives_korean:
  - 이집트의 수치
  - 이집트의 맨몸
  lexicon: HALOT
  rationale: 직역의 ‘벌거벗음’을 유지하여 앞의 노출 이미지와 어휘 연결을 살렸습니다. 영어 POB도 ‘nakedness’를 보존해 수치의 뜻을 배경에 남깁니다.
theological_decisions:
- issue: 예언적 수치 표상의 강도
  chosen_reading: 본문의 노골적 신체 노출 표현을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘수치’를 중심으로 완곡하게 옮기는 방식
  - ‘벗겨짐’처럼 추상화하는 방식
  rationale: 이 구절은 이집트와 구스의 패배를 공개적 수치로 드러내는 표징이므로, 의도된 충격과 굴욕의 강도를 보존하는 것이 본문의 기능에 부합합니다.
  doctrine_reference: 예언서의 표징 행위와 심판의 공개성
