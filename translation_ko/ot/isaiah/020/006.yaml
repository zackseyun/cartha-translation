  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אָמַר יֹשֵׁ֨ב הָ/אִ֣י הַ/זֶּה֮ בַּ/יּ֣וֹם הַ/הוּא֒ הִנֵּה כֹ֣ה מַבָּטֵ֗/נוּ אֲשֶׁר נַ֤סְנוּ שָׁם֙ לְ/עֶזְרָ֔ה לְ/הִ֨נָּצֵ֔ל מִ/פְּנֵ֖י מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֵ֖יךְ נִמָּלֵ֥ט אֲנָֽחְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
  footnotes:
  - marker: a
    text: Or, 'this is our expectation' or 'this is what we looked to.' The Hebrew expression refers to the object in which they placed their hope.
    reason: lexical_alternative
  - marker: b
    text: '''Coastland'' may also be rendered ''island.'' In Isaiah, the term often refers more broadly to maritime lands or coastal regions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 이 해안의 주민이 말할 것입니다. 「보십시오, 이것이 우리가 바라고 의지하던 것이로구나. 우리가 앗시리아 왕에게서 건져짐을 위해 도움을 구해 도망쳤던 곳이 아니냐. 그런데 우리가 어떻게 피하겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해안’은 이사야에서 종종 ‘섬’보다 넓은 해양 연안 지역을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  english_pob_choice: the inhabitant of this coastland
  chosen_korean: 이 해안의 주민
  alternatives_korean:
  - 이 섬의 주민
  - 이 해안지대에 사는 사람
  lexicon: HALOT
  rationale: יֹשֵׁב은 단수 분사지만 집합적으로 지역 주민을 가리키므로 ‘주민’이 자연스럽고, אִי는 이사야에서 ‘섬’보다 더 넓게 해안지대/바닷가 지역을 가리킬 수 있어 ‘해안’으로 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: HALOT
  rationale: 예언서의 관용적 시간 표현을 살리되 현대 한국어에서 가장 자연스러운 형태로 처리했습니다.
- source_word: כֹּה מַבָּטֵנוּ
  english_pob_choice: this is our hope
  chosen_korean: 우리가 바라고 의지하던 것
  alternatives_korean:
  - 우리가 기대하던 것
  - 우리가 바라보던 것
  - 우리의 기대
  lexicon: HALOT
  rationale: מַבָּט은 단순한 ‘기대’보다 사람이 바라보고 의지하는 대상이라는 뉘앙스를 가지므로, POB의 ‘hope’ 취지를 살리면서도 관계의 무게를 드러내는 표현을 택했습니다.
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  english_pob_choice: And how shall we escape?
  chosen_korean: 그런데 우리가 어떻게 피하겠느냐?
  alternatives_korean:
  - 그리고 우리가 어떻게 도망하겠느냐?
  - 그런데 우리가 어떻게 벗어나겠느냐?
  lexicon: HALOT
  rationale: 수사적 절망감을 띤 질문이므로 단순 정보 전달보다 예언적 탄식을 살리는 ‘어떻게 피하겠느냐?’를 택했습니다.
