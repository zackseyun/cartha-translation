id: ISA.20.3
reference: Isaiah 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
  footnotes:
  - marker: a
    text: Or possibly 'stripped'—that is, wearing only a loincloth or undergarment rather than being completely nude.
    reason: lexical_alternative
  - marker: b
    text: Cush refers to the region south of Egypt, often associated with Nubia; some English versions render it 'Ethiopia.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 야훼께서 말씀하셨습니다. “내 종 이사야가 삼 년 동안 벌거벗고[a] 맨발로 걸어 다니며 애굽과 구스[b]에 대한 표징과 징조가 된 것처럼…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌거벗고’는 완전한 나체가 아니라 겉옷을 벗은 상태, 곧 속옷만 입은 상태를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 구스는 애굽 남쪽 지역을 가리키며, 흔히 누비아와 연결됩니다. 어떤 번역은 이를 ‘에티오피아’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 원문 고유명사를 프로젝트 기본값에 따라 학술적으로 음역하여, 주(主)라는 대체 표현보다 언약적 신명성을 분명히 드러냅니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 내 종된 자
  lexicon: HALOT
  rationale: 예언서 맥락에서 소속과 위임을 나타내는 말이므로 ‘종’으로 옮기되, ‘노예’로는 원문의 신분 강조가 과도해질 수 있어 채택하지 않았습니다.
- source_word: עָרוֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗고
  alternatives_korean:
  - 나체로
  - 알몸으로
  lexicon: HALOT
  rationale: 원문의 기본 의미를 살리면서 현대 한국어에서 가장 직접적이고 중립적인 표현으로 옮겼습니다.
- source_word: וְיָחֵף
  english_pob_choice: and barefoot
  chosen_korean: 맨발로
  alternatives_korean:
  - 발벗고
  - 발로만
  lexicon: HALOT
  rationale: ‘신을 벗은 상태’가 아니라 발이 드러난 상태를 자연스럽게 나타내는 표준어 표현으로 처리했습니다.
- source_word: אוֹת וּמוֹפֵת
  english_pob_choice: sign and a portent
  chosen_korean: 표징과 예고
  alternatives_korean:
  - 표적과 경고
  - 징조와 예고
  lexicon: HALOT
  rationale: ‘אוֹת’의 표지성은 ‘표징’으로, ‘מוֹפֵת’의 장차 닥칠 일을 예시하는 기능은 ‘예고’로 살려 두 용어의 병렬을 한국어에서 구분했습니다.
- source_word: עַל מִצְרַיִם וְעַל כּוּשׁ
  english_pob_choice: against Egypt and Cush
  chosen_korean: 애굽과 구스에 대한
  alternatives_korean:
  - 애굽과 구스를 향한
  - 애굽과 구스 ضد
  lexicon: HALOT
  rationale: 문맥상 심판의 대상임을 분명히 하면서도, 한국어에서 자연스러운 ‘대한’ 구문으로 전치사의 방향성을 보존했습니다.
theological_decisions:
- issue: 이사야의 신체 노출의 정도
  chosen_reading: 본문에는 ‘벌거벗고’라고 직역에 가깝게 두되, ‘맨발로’와 병렬하여 신호 행동의 충격을 그대로 남겼습니다.
  alternative_readings:
  - 속옷만 입고
  - 겉옷만 벗고
  rationale: 원문의 עָרוֹם은 기본적으로 ‘벌거벗다’이므로, 그 긴장을 약화시키는 완곡 표현으로 대체하지 않았습니다. 다만 고대 의복 관습상 완전한 나체가 아닐 가능성은 본문 주석 없이 단정하지 않고 열어 둡니다.
  doctrine_reference: 원어 우선 번역 원칙; 해석적 긴장 보존
