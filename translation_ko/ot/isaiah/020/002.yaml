  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
  footnotes:
  - marker: a
    text: Or 'stripped' or 'bare'; the Hebrew can denote being inadequately clothed rather than completely nude in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 야훼께서 아모스의 아들 이사야를 통해 말씀하셨습니다. "가서 네 허리에서 자루옷을 풀고 네 발에서 신발을 벗어라." 그래서 그는 그렇게 하였고, 벌거벗은 채 맨발로 다녔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרוֹם은 어떤 문맥에서는 완전한 나체가 아니라 충분히 입지 않은 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 하나님의 이름을 제목이 아닌 음역으로 드러내기 위해, POB의 영어 결정에 따라 야훼로 옮겼습니다.
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그 시간에
  lexicon: HALOT
  rationale: 문맥의 시간 부사를 자연스러운 현대 한국어로 간결하게 살렸습니다.
- source_word: דִּבֶּר ... בְּיַד
  english_pob_choice: spoke by the hand of
  chosen_korean: ~를 통해 말씀하셨습니다
  alternatives_korean:
  - ~의 손으로 말씀하셨습니다
  - ~을 통해 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개적 의미를 살리되, 한국어에서 어색한 직역인 '손으로'는 피하고 선지자 매개를 분명히 했습니다.
- source_word: עָרוֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은 채
  alternatives_korean:
  - 나체로
  - 알몸으로
  - 벗은 채
  lexicon: HALOT
  rationale: 본문의 직접적 의미를 약화시키지 않기 위해 '벌거벗은'을 유지하되, 한국어 문장에서는 상태부사구로 자연스럽게 표현했습니다.
theological_decisions:
- issue: עָרוֹם이 완전한 나체인지, 부분적 탈의인지의 긴장
  chosen_reading: 본문에는 '벌거벗은 채'로 두고, 의미를 완화해 해석하지 않았습니다.
  alternative_readings:
  - 헐벗은 채
  - 옷을 거의 벗은 채
  rationale: 예언적 표징의 충격을 보존하기 위해 직접적인 표현을 택하되, 히브리어가 경우에 따라 '충분히 입지 않은 상태'까지 포함할 수 있는 긴장은 본문 자체에서 해소하지 않았습니다.
  doctrine_reference: '번역 원칙 §3: 본문의 긴장을 평탄화하지 않는다.'
