id: ISA.59.5
reference: Isaiah 59:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּיצֵ֤י צִפְעוֹנִי֙ בִּקֵּ֔עוּ וְ/קוּרֵ֥י עַכָּבִ֖ישׁ יֶאֱרֹ֑גוּ הָ/אֹכֵ֤ל מִ/בֵּֽיצֵי/הֶם֙ יָמ֔וּת וְ/הַ/זּוּרֶ֖ה תִּבָּקַ֥ע אֶפְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
  footnotes:
  - marker: a
    text: Or 'adder's eggs' for 'viper's eggs'; both terms refer to a poisonous snake.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'is split open'; the sense is that when one of their eggs is crushed, a venomous snake emerges.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 독사의 알을 까고 거미줄을 엮습니다[a]. 그 알들을 먹는 사람은 죽고[b], 무엇이든 깨뜨려지면 그것은 독사로 터져 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘독사에 속한 알’과 ‘거미의 줄’을 뜻하는 소유 구문입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그들의 알에서 먹는 자는 죽을 것이다’입니다. 영어 POB처럼 일반적 경고로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  english_pob_choice: viper's eggs
  chosen_korean: 독사의 알
  alternatives_korean:
  - 살모사의 알
  - 맹독성 뱀의 알
  lexicon: HALOT
  rationale: 히브리어의 구문은 ‘독사에 속한 알’이라는 소유 관계를 나타내므로, 한국어도 자연스러운 소유형인 ‘독사의 알’로 옮겼습니다. ‘독사’는 ‘viper’에 해당하는 현대적이고 분명한 표현입니다.
- source_word: בִּקֵּעוּ
  english_pob_choice: they hatch
  chosen_korean: 까고
  alternatives_korean:
  - 터뜨리고
  - 갈라놓고
  lexicon: HALOT
  rationale: 알과 연결될 때 동사는 문자적 ‘쪼개다/터뜨리다’보다 ‘까다’가 한국어에서 가장 자연스럽고 생생합니다. 영어 POB의 ‘hatch’도 이 맥락의 자연스러운 결과를 반영합니다.
- source_word: קוּרֵי עַכָּבִישׁ
  english_pob_choice: spider's webs
  chosen_korean: 거미줄
  alternatives_korean:
  - 거미의 줄
  - 거미줄들
  lexicon: HALOT
  rationale: 히브리어는 거미가 만든 웹/실의 이미지를 가리키므로, 표준 한국어의 관용 표현인 ‘거미줄’이 가장 직접적입니다. 영어 POB의 이미지와도 잘 맞습니다.
- source_word: וְהַזּוּרֶה תִּבָּקַע אֶפְעֶה
  english_pob_choice: what is crushed breaks open into a viper
  chosen_korean: 무엇이든 깨뜨려지면 그것은 독사로 터져 나옵니다
  alternatives_korean:
  - 무엇이든 눌리면 그것은 독사로 갈라집니다
  - 무엇이든 부서지면 그것은 독사로 열립니다
  lexicon: HALOT
  rationale: 난해한 הזורה를 영어 POB의 ‘what is crushed’에 따라 조건절로 살려, 깨짐/눌림 뒤에 독사가 나오는 위험성을 보존했습니다. תִּבָּקַע는 ‘터져 나옵니다’로 옮겨 알의 파열과 독사의 출현을 동시에 드러냈습니다.
theological_decisions:
- issue: 악인의 행위가 단지 도덕적 부패가 아니라 치명적 해악을 낳는다는 이미지
  chosen_reading: 독사의 알과 거미줄, 그리고 깨뜨려질 때 독사가 나오는 그림을 그대로 살려, 악이 결국 치명적 결과를 낳는다는 시적 경고로 읽었습니다.
  alternative_readings:
  - 일반적인 비유로 완화하여 ‘나쁜 계획’ 정도로 읽는 방식
  - 더 설교적으로 풀어 쓰는 방식
  rationale: 본문은 시적 과장과 공포 이미지를 통해 악의 본질과 결과를 드러내므로, 이를 완화하지 않고 유지하는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 잠언적 예언 시가의 심판 이미지
- issue: 과도한 현대화 대신 동물·알·파열 이미지를 직접 유지
  chosen_reading: 한국어도 완곡하게 바꾸지 않고 ‘독사의 알’, ‘거미줄’, ‘터져 나옵니다’를 유지했습니다.
  alternative_readings:
  - ‘위험한 계획’처럼 추상화하는 번역
  - ‘살모사’나 다른 종명으로 특정화하는 번역
  rationale: 원문의 어휘적 긴장과 시각적 충격을 보존해야 독자에게 같은 경고 효과가 전달됩니다.
  doctrine_reference: 시편/이사야의 예언적 수사
