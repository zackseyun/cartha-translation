base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
  footnotes:
  - marker: a
    text: Or 'judgment is far from us.'
    reason: lexical_alternative
  - marker: b
    text: Or 'righteousness does not reach us.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for radiance, but we walk in thick darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 공의[a]가 우리에게서 멀리 있고, 의가 우리를 따라잡지 못합니다[b]. 우리는 빛을 바라지만, 보십시오, 어둠입니다. 밝은 빛을 바라지만, 우리는 짙은 어둠 속을 걷습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판이 우리에게서 멀리 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의가 우리에게 이르지 못합니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘밝은 광채를 바라지만, 우리는 짙은 어둠 속을 걷습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 심판
  lexicon: HALOT
  rationale: 이 절에서는 공동체 안에 부재한 올바른 질서와 판결을 가리키므로, 현대 한국어에서 법적·윤리적 함의를 함께 살릴 수 있는 ‘공의’로 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: מִשְׁפָּט와 구별되는 צדקה의 평행을 살리기 위해, 프로젝트 기본어인 ‘의’를 사용했습니다.
- source_word: תַשִּׂיגֵנוּ
  english_pob_choice: does not overtake us
  chosen_korean: 우리를 따라잡지 못합니다
  alternatives_korean:
  - 우리에 이르지 못합니다
  - 우리를 따라오지 못합니다
  lexicon: HALOT
  rationale: 힐힐형의 역동적 이미지를 살려, 단순한 ‘도달’보다 ‘뒤쫓아 와 붙잡는’ 뉘앙스가 드러나는 ‘따라잡다’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: but look
  chosen_korean: 보십시오—
  alternatives_korean:
  - 보라—
  - 하지만 보십시오—
  lexicon: HALOT
  rationale: 예상과 현실의 급격한 반전을 드러내는 감탄적 표현을 살리기 위해, 현대적이면서도 직설적인 ‘보십시오—’를 택했습니다.
theological_decisions:
- issue: 공의/의의 평행과 의미 구분
  chosen_reading: ‘공의’와 ‘의’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘정의’로 통일
  - 둘 다 ‘의’로 통일
  rationale: 히브리어의 병렬 대구에서 두 용어를 같은 한국어로 합쳐 버리면 시적 대비가 약해지므로, 서로 겹치되 동일하지 않은 의미를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5'
