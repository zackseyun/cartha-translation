id: ISA.59.4
reference: Isaiah 59:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵין קֹרֵ֣א בְ/צֶ֔דֶק וְ/אֵ֥ין נִשְׁפָּ֖ט בֶּ/אֱמוּנָ֑ה בָּט֤וֹחַ עַל תֹּ֨הוּ֙ וְ/דַבֶּר שָׁ֔וְא הָר֥וֹ עָמָ֖ל וְ/הוֹלֵ֥יד אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
  footnotes:
  - marker: a
    text: Or 'calls for justice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'enters judgment in truth' or 'pleads honestly.'
    reason: lexical_alternative
  - marker: c
    text: '''Emptiness'' may also be rendered ''futility'' or ''vanity.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'give birth to iniquity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 의를 부르짖지 않고, 아무도 신실함으로 변론하지 않습니다; 허무를 신뢰하고 거짓을 말하며, 그들은 고통을 잉태하고 악을 낳습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공의를 부르짖지’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진실함으로 재판하지’ 혹은 ‘정직하게 변론하지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘허무’는 ‘공허’나 ‘헛됨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘악을 낳습니다’ 대신 ‘불의를 낳습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  english_pob_choice: calls for righteousness
  chosen_korean: 의를 부르짖지
  alternatives_korean:
  - 공의를 부르짖지
  - 의를 요구하지
  lexicon: HALOT
  rationale: קרא with ב here는 어떤 기준/편에 서서 외치다의 뜻이므로, 법정·윤리적 문맥을 살려 ‘의를 부르짖다’로 옮겼습니다. ‘공의’도 가능하지만, POB의 ‘righteousness’를 따라 보다 넓은 도덕적 의미를 유지했습니다.
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  english_pob_choice: pleads with faithfulness
  chosen_korean: 신실함으로 변론하지 않습니다
  alternatives_korean:
  - 진실함으로 변론하지 않습니다
  - 성실하게 변론하지 않습니다
  lexicon: HALOT
  rationale: נשׁפט는 여기서 법정에서 변론하다/송사하다의 뜻으로 이해하는 것이 자연스럽고, אֱמוּנָה는 단순한 ‘진리’보다 신실함·신뢰성을 더 잘 드러냅니다.
- source_word: בָּטוֹחַ עַל תֹּהוּ
  english_pob_choice: trusting in emptiness
  chosen_korean: 허무를 신뢰하고
  alternatives_korean:
  - 공허를 신뢰하고
  - 헛됨을 의지하고
  lexicon: HALOT
  rationale: תֹהוּ는 형체 없는 공허함, 실재 없는 헛됨을 가리키므로 ‘허무’가 간결하면서도 폭넓게 대응합니다. 동사 בטח는 ‘신뢰하다’로 옮겨 문맥의 어조를 살렸습니다.
- source_word: וְדַבֶּר שָׁוְא
  english_pob_choice: speaking falsehood
  chosen_korean: 거짓을 말하며
  alternatives_korean:
  - 허망한 말을 하며
  - 거짓말하며
  lexicon: HALOT
  rationale: שָׁוְא는 거짓, 허망함, 헛됨을 아우르므로 POB의 ‘falsehood’를 따라 ‘거짓’을 택했습니다. 앞뒤 병렬을 위해 현재분사적 연결을 살렸습니다.
- source_word: הָרוֹ עָמָל וְהוֹלֵיד אָוֶן
  english_pob_choice: they conceive trouble and give birth to wickedness
  chosen_korean: 그들은 고통을 잉태하고 악을 낳습니다
  alternatives_korean:
  - 그들은 괴로움을 잉태하고 죄악을 낳습니다
  - 그들은 재앙을 잉태하고 불의를 낳습니다
  lexicon: HALOT
  rationale: 임신·출산 비유를 그대로 살려, הרה/ילד의 이미지를 한국어로 자연스럽게 재현했습니다. עָמָל은 여기서 해로운 결과를 가리키는 맥락이므로 ‘고통’이 적절하고, אָוֶן은 도덕적 악을 드러내는 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: 중간절의 분사적 구조 보존
  chosen_reading: ‘허무를 신뢰하고 거짓을 말하며’로 분사형 연결을 유지해, 이어지는 ‘잉태하고 낳습니다’와 같은 행위의 연속성을 드러냈습니다.
  alternative_readings:
  - ‘그들은 허무를 신뢰하고 거짓을 말합니다’처럼 평서문으로 처리
  rationale: 최종 개정이 분사형을 유지하도록 정리한 점을 따라, 히브리어의 흐름과 병렬을 보존하는 쪽이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
