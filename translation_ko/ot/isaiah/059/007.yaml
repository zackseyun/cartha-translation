id: ISA.59.7
reference: Isaiah 59:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַגְלֵי/הֶם֙ לָ/רַ֣ע יָרֻ֔צוּ וִֽ/ימַהֲר֔וּ לִ/שְׁפֹּ֖ךְ דָּ֣ם נָקִ֑י מַחְשְׁבֽוֹתֵי/הֶם֙ מַחְשְׁב֣וֹת אָ֔וֶן שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/מְסִלּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
  footnotes:
  - marker: a
    text: Or "their plans are plans of iniquity"; the Hebrew word can denote thoughts, plans, or schemes.
    reason: lexical_alternative
  - marker: b
    text: Or "in their paths"; the Hebrew term refers literally to roads or highways and here also suggests the course of their conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 발은 악을 향해 달리고, 죄 없는 피를 흘리려고 서두릅니다. 그들의 생각은 죄악의 생각입니다[a]. 그들의 대로에는 황폐와 파멸이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 계획은 죄악의 계획입니다.” 히브리어는 생각, 계획, 또는 꾀를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 길에는.” 히브리어는 문자적으로 길이나 대로를 가리키며, 여기서는 그들의 삶의 행로도 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם / יָרֻצוּ
  english_pob_choice: Their feet run
  chosen_korean: 그들의 발은 달리고
  alternatives_korean:
  - 그들의 발이 달립니다
  - 그들의 발은 달려갑니다
  lexicon: HALOT
  rationale: 히브리어의 구체적인 신체 이미지와 빠른 동작을 살리되, 한국어에서는 자연스럽게 ‘발은 달리고’로 옮겼습니다.
- source_word: לָרַע / לִשְׁפֹּךְ דָּם נָקִי
  english_pob_choice: to evil / to shed innocent blood
  chosen_korean: 악을 향해 / 무죄한 피를 흘리려고
  alternatives_korean:
  - 악을 행하려고 / 무죄한 피를 쏟으려고
  - 악으로 / 무죄한 피를 쏟으려고
  lexicon: HALOT
  rationale: לָרַע의 방향성을 ‘향해’로, 혈흘림 관용구를 ‘무죄한 피를 흘리다’로 옮겨 폭력성과 의도성을 함께 드러냈습니다.
- source_word: מַחְשְׁבֹתֵיהֶם / מַחְשְׁבוֹת אָוֶן
  english_pob_choice: their thoughts are thoughts of iniquity
  chosen_korean: 그들의 생각은 불의의 생각이며
  alternatives_korean:
  - 그들의 계획은 불의의 계획이며
  - 그들의 생각은 죄악의 생각이며
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת이 ‘생각/계획/꾀’ 모두를 가질 수 있지만, 여기서는 반복 구조를 살려 ‘생각’으로 유지하고 אָוֶן은 문맥상 도덕적 불의로 옮겼습니다.
- source_word: בִּמְסִלּוֹתָם
  english_pob_choice: in their highways
  chosen_korean: 그들의 길에는
  alternatives_korean:
  - 그들의 대로에는
  - 그들의 고속도로에는
  - 그들의 도로들에는
  lexicon: HALOT
  rationale: מְסִלָּה의 문자적 ‘큰 길/대로’ 이미지를 살리되 현대 한국어에서 과도하게 낯설지 않도록 ‘길’로 옮기고, 위치 관계는 ‘-에는’으로 처리했습니다.
theological_decisions:
- issue: אָוֶן의 도덕적 뉘앙스
  chosen_reading: 불의
  alternative_readings:
  - 죄악
  - 악의
  - 불법
  rationale: 이 절 전체가 폭력과 악행을 고발하는 맥락이므로, אָוֶן은 단순한 상황적 ‘재난’보다 도덕적 불의를 나타내는 말로 읽는 것이 적절합니다.
  doctrine_reference: 예언서의 죄 고발 문맥
- issue: ‘무죄한 피’ 표현의 직역성
  chosen_reading: 무죄한 피
  alternative_readings:
  - 죄 없는 피
  - 죄 없는 사람의 피
  rationale: 히브리어 관용구를 그대로 살려 폭력의 부당성을 강하게 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 구약의 혈죄 고발 관용구
