    rationale: וָאַיִן은 앞의 ‘정의/공의’를 받으므로, 한국어에서도 ‘정의는 없습니다’ 또는 이에 준하는 표현으로 대상을 밝혀야 합니다.
  - severity: medium
    issue: 각주 표지가 절 끝에 함께 놓여 있어 각주가 가리키는 표현이 불명확합니다.
    rationale: a는 ‘바랍니다’(קוה)의 대안이고 b는 ‘구원’의 대안이므로 각각 해당 말 뒤에 배치해야 합니다.
  - severity: low
    issue: 각주 b의 ‘(salvation)’ 영어 병기
    rationale: 한국어 번역의 어휘 대안 각주로서는 불필요하며, ‘구출’만 제시하면 충분합니다.
