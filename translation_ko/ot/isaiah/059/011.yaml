base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
  footnotes:
  - marker: a
    text: Or 'we wait for justice' / 'we look for justice'; the Hebrew verb can express both waiting and hoping.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance' for 'salvation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 모두 곰처럼 으르렁거리고 비둘기처럼 끊임없이 신음합니다. 우리는 정의를[a] 바라지만 정의는 없고, 구원을[b] 바라지만 구원은 우리에게서 멉니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 정의를 기다립니다’ 또는 ‘우리는 정의를 찾습니다’. 히브리어 동사는 기다림과 희망의 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구출’.
    reason: lexical_alternative
