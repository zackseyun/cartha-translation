  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
  footnotes:
  - marker: a
    text: Or 'we wait for justice' / 'we look for justice'; the Hebrew verb can express both waiting and hoping.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance' for 'salvation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 모두 곰처럼 으르렁거리고, 비둘기처럼 끊임없이 신음합니다. 우리는 정의를 바라지만, 아무것도 없습니다. 구원을 바라지만, 그것은 우리에게서 멉니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 정의를 기다립니다’/‘우리는 정의를 찾습니다’. 히브리어 동사는 기다림과 희망을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구출’(salvation).
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  english_pob_choice: we growl
  chosen_korean: 으르렁거립니다
  alternatives_korean:
  - 울부짖습니다
  - 신음합니다
  lexicon: HALOT
  rationale: 곰과의 비유를 살려 짐승이 내는 거친 소리를 자연스럽게 나타내는 말로 옮겼습니다.
- source_word: הָגֹה נֶהְגֶּה
  english_pob_choice: we moan continually
  chosen_korean: 끊임없이 신음합니다
  alternatives_korean:
  - 계속 신음합니다
  - 신음하고 또 신음합니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 반복을 한국어에서는 ‘끊임없이’로 간결하게 살렸습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: 문맥상 단순한 재판 결과보다 하나님께서 세우실 공의로운 질서를 가리키므로 ‘정의’가 더 직접적입니다.
- source_word: לִישׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 건짐
  lexicon: HALOT
  rationale: 예언서의 רחב한 의미를 해치지 않으면서도, 한국어에서 자연스럽고 신학적으로도 넓은 뜻을 지닌 표현을 택했습니다.
theological_decisions:
- issue: ישועה의 번역 범위
  chosen_reading: ‘구원’으로 번역하여 단순한 물리적 구조보다 하나님의 구원 행위를 넓게 드러냈습니다.
  alternative_readings:
  - ‘구출’로 한정
  - ‘건짐’으로 구어화
  rationale: 본문은 절망적 상황에서의 기대를 말하지만, 이사야의 어휘는 반복적으로 구원의 신학을 품고 있으므로 범위를 좁히지 않는 것이 더 적절합니다.
  doctrine_reference: Isaiah 59:11의 יְשׁוּעָה 용례
