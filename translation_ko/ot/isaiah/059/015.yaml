id: ISA.59.15
reference: Isaiah 59:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֤י הָֽ/אֱמֶת֙ נֶעְדֶּ֔רֶת וְ/סָ֥ר מֵ/רָ֖ע מִשְׁתּוֹלֵ֑ל וַ/יַּ֧רְא יְהוָ֛ה וַ/יֵּ֥רַע בְּ/עֵינָ֖י/ו כִּֽי אֵ֥ין מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
  footnotes:
  - marker: a
    text: Or 'made himself a prey' / 'was treated as prey.' The Hebrew term is rare and conveys that the one who turns from evil becomes a victim.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'it was evil in his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 진실은 사라졌고, 악에서 떠나는 사람은 노략당했습니다. 야훼께서 보셨고, 정의가 없다는 것이 그의 눈에 악이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘망하다/사라지다’와 ‘부재하다’의 뉘앙스를 함께 가질 수 있습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그의 눈에 악이었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  english_pob_choice: truth
  chosen_korean: 진실
  alternatives_korean:
  - 진리
  - 성실
  lexicon: HALOT
  rationale: 이 문맥은 사회적·사법적 붕괴를 탄식하는 자리이므로, 추상적 교리어인 ‘진리’보다 현실적이고 윤리적인 의미를 살리는 ‘진실’이 더 자연스럽습니다.
- source_word: נֶעְדֶּרֶת
  english_pob_choice: was missing
  chosen_korean: 사라졌고
  alternatives_korean:
  - 없어졌고
  - 결핍되었고
  lexicon: HALOT
  rationale: 히브리어는 부재·결핍을 나타내며, 한국어에서는 ‘사라졌고’가 결여의 상태를 간결하게 전달하면서도 문맥의 비탄조를 살립니다.
- source_word: מִשְׁתּוֹלֵל
  english_pob_choice: was plundered
  chosen_korean: 노략당했습니다
  alternatives_korean:
  - 탈취당했습니다
  - 약탈당했습니다
  lexicon: HALOT
  rationale: POB가 지적한 희귀한 의미—악을 떠난 사람이 피해자·노획물이 되는 상황—를 한국어의 ‘노략당하다’가 비교적 정확하고 고어스럽지 않게 반영합니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 재판
  lexicon: HALOT
  rationale: 이 구절에서 מִשְׁפָּט는 단순한 법정 판결보다 사회적·도덕적 질서의 붕괴를 가리키므로, 현대 한국어에서 가장 넓고 분명한 ‘정의’가 적절합니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 관습적 대체어보다 고유한 하나님의 이름을 드러내는 ‘야훼’를 본문에 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘악에서 떠나는’ 사람의 일반적 표지
  chosen_reading: 악에서 떠나는 사람
  alternative_readings:
  - 악에서 돌이키는 자
  - 악에서 떠난 자
  rationale: 히브리어 분사 וְסָר는 특정 남성 개인보다 일반적·대표적 인물을 가리키므로, 한국어에서도 성별을 드러내지 않는 일반 서술로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
