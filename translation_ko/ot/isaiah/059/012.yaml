review_pass:
  verdict: revise
  source_fidelity: 초안은 죄의 세 어휘를 구별하고 עָנְתָה בָּנוּ의 법정적 의미를 ‘증언하다’로 옮긴 점에서 대체로 원문에 충실합니다. 다만 פשע를 ‘범죄’로 옮기면 권위에 대한 ‘반역/배반’의 의미가 약해질 수 있으며, 두 번째 כִּי의 설명적 연결도 문장 구성에서 더 분명히 드러낼 수 있습니다.
  naturalness: ‘우리들의’, ‘우리에게 대하여’, 그리고 절마다 반복되는 ‘이는’은 현대 표준어 합쇼체로 다소 부자연스럽습니다. ‘우리의’, ‘우리를 거슬러’, ‘~때문입니다’가 더 자연스럽고 명료합니다.
  terminology: פשע–חטא–עון의 구별은 ‘반역–죄–죄악’으로 유지하는 것이 안전합니다. 하나님을 향한 호칭으로 ‘당신’은 현대 한국어에서 어색하거나 무례하게 들릴 수 있으므로, 문맥상 지시 대상이 하나님임을 반영한 ‘주님’을 사용했습니다.
  issues:
  - severity: medium
    issue: פשע를 ‘범죄’로 번역함
    rationale: ‘범죄’는 현대 한국어에서 법률상 범죄의 뜻으로 좁게 들릴 수 있습니다. פשע의 권위자를 거스르는 반역·배반의 뉘앙스를 ‘반역’이 더 직접적으로 보존합니다.
  - severity: medium
    issue: ‘우리에게 대하여 증언하며’라는 표현
    rationale: עָנְתָה בָּנוּ의 법정적 적대 관계는 ‘우리를 거슬러 증언합니다’가 현대 한국어에서 더 자연스럽고 명확합니다.
  - severity: low
    issue: ‘이는’의 반복 및 ‘우리들의’ 사용
    rationale: 두 כִּי는 설명적 기능을 하지만, 한국어에서 ‘이는’을 반복하면 부자연스럽습니다. 첫 절은 ‘~때문입니다’로 연결하고, 소유 표현은 ‘우리의’로 정리하는 것이 자연스럽습니다.
  revised_text: 우리의 반역이 주님 앞에 많고, 우리의 죄가 우리를 거슬러 증언하기 때문입니다. 우리의 반역이 우리와 함께 있고, 우리는 우리의 죄악을 알고 있습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리를 거슬러 답합니다’; 더 직역하면 ‘우리 안에서/우리에게 대답합니다’.
    reason: lexical_alternative
  revision_rationale: 원문의 세 죄 어휘를 ‘반역’, ‘죄’, ‘죄악’으로 구별하여 유지했습니다. עָנְתָה בָּנוּ는 문맥상 죄가 고발 증인이 되는 법정적 비유이므로 ‘우리를 거슬러 증언하다’로 옮기고, 가능한 직역 및 다른 어휘적 이해는 각주에 남겼습니다. 두 כִּי의 설명 기능은 한국어 문장 구조에 맞게 첫 문장의 ‘~때문입니다’와 이어지는 진술로 자연스럽게 반영했습니다.
