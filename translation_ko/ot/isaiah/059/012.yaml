source:
  edition: WLC
  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
  footnotes:
  - marker: a
    text: Or 'bear witness against us' or more literally 'answer against us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 우리들의 범죄가 당신 앞에 많고, 우리의 죄가 우리에게 대하여 증언하며, 이는 우리들의 범죄가 우리와 함께 있고 우리의 죄악을 우리가 압니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - for
  lexicon: HALOT
  rationale: 문맥상 앞 절의 고백을 설명하는 이유를 제시하므로, 현대 한국어에서는 원인과 설명을 자연스럽게 잇는 ‘이는’이 적절합니다.
- source_word: רַבּוּ פְשָׁעֵינוּ
  english_pob_choice: our transgressions are many
  chosen_korean: 우리들의 범죄가 … 많고
  alternatives_korean:
  - 우리들의 범죄가 … 많으며
  - 우리의 허물들이 … 많고
  lexicon: HALOT
  rationale: רַבּוּ는 ‘많다/늘다’의 결과 상태를 가리키므로 ‘많고’로 간결하게 살렸고, פשע는 회개 고백의 중한 뉘앙스를 살려 ‘범죄’로 옮겼습니다.
- source_word: עָנְתָה בָּנוּ
  english_pob_choice: testify against us
  chosen_korean: 우리의 죄가 우리에게 대하여 증언하며
  alternatives_korean:
  - 우리의 죄가 우리를 거슬러 증언하며
  - 우리의 죄가 우리에게 대하여 증언하고
  lexicon: HALOT
  rationale: 이 구문은 법정적 ‘응답/증언’의 뜻을 가지므로, POB의 해석을 따라 ‘증언하다’로 옮기되 ‘대하여’로 맞서 있음의 뉘앙스를 보존했습니다.
- source_word: עֲוֺנֹתֵינוּ
  english_pob_choice: our iniquities
  chosen_korean: 죄악을
  alternatives_korean:
  - 불의를
  - 악을
  lexicon: HALOT
  rationale: עון은 단순한 실수보다 더 무거운 왜곡·죄책의 뜻을 담으므로, 문어체에서 그 중함을 드러내는 ‘죄악’이 적절합니다.
theological_decisions:
- issue: 세 가지 죄 어휘(פשע, חטא, עון)의 구별 보존
  chosen_reading: ‘범죄’, ‘죄’, ‘죄악’을 나누어 써서 반복되는 고백의 수사와 죄의 층위를 유지했습니다.
  alternative_readings:
  - 모두 ‘죄’로 통일
  - 모두 ‘허물’로 통일
  rationale: 본문은 서로 겹치지만 동일하지 않은 죄의 표현을 연속적으로 쌓아 올리므로, 한국어에서도 그 반복과 긴장을 평평하게 만들지 않는 편이 원문 효과에 더 충실합니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
