- from: 그들의 행위에 따라 그가 갚으실 것입니다. 그의 대적들에게는 진노를, 그의 원수들에게는 보응을, 해안들에는 마땅한 보응을 갚으실 것입니다.[a]
  to: 그들의 행위에 따라, 그가 갚으실 것입니다. 그의 대적들에게는 진노로 갚으시고, 그의 원수들에게는 보응을 갚으시며, 먼 해안 지역들[a]에도 마땅한 보응을 갚으실 것입니다.
