id: ISA.59.18
reference: Isaiah 59:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
  footnotes:
  - marker: a
    text: Or 'to the islands.' The Hebrew term can denote islands or distant maritime coastlands; in Isaiah it often refers broadly to far-off coastal nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 행위에 따라 그가 갚으실 것입니다. 그의 대적들에게는 진노를, 그의 원수들에게는 보응을, 해안들에는 마땅한 보응을 갚으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해안들’은 히브리어 אִיִּים의 가능 번역인 ‘섬들’을 포함하는 넓은 표현입니다. 이사야에서는 먼 해안 지역이나 해안 국가들을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַל
  english_pob_choice: According to
  chosen_korean: …에 따라
  alternatives_korean:
  - …대로
  - …에 맞게
  lexicon: HALOT
  rationale: 반복되는 비교·기준 표현을 한국어의 ‘…에 따라’로 옮기면, 보응이 행위의 분량에 상응한다는 의미를 자연스럽게 살릴 수 있습니다.
- source_word: גְּמֻלוֹת
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 보응들
  - 그들의 소행
  lexicon: HALOT
  rationale: 문맥상 보응의 기준이 되는 사람들의 행위로 이해하는 것이 자연스럽습니다. ‘행위’는 행위-보응 대응을 분명히 드러냅니다.
- source_word: חֵמָה
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 격노
  lexicon: HALOT
  rationale: 하나님의 न्याय적 심판 맥락에서 ‘진노’가 가장 정확하게 엄중한 분노의 어조를 전달합니다.
- source_word: לָאִיִּים
  english_pob_choice: to the coastlands
  chosen_korean: 해안들에는
  alternatives_korean:
  - 섬들에는
  - 먼 해안 지역들에는
  lexicon: HALOT
  rationale: 이사야에서 אִיִּים는 단순한 ‘섬들’보다 먼 해안 지역/해안 국가들을 가리키는 경우가 많으므로, POB의 ‘coastlands’를 따라 ‘해안들’로 옮겼습니다.
theological_decisions:
- issue: 3인칭 단수 동사의 주어를 본문에 명시할지 여부
  chosen_reading: 본문에는 ‘그가’로만 유지하고, ‘야훼’를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘야훼께서’로 명시
  - ‘주님이’로 명시
  rationale: 직전 문맥이 주어를 식별하지만, 본절 자체는 3인칭 단수로만 진행됩니다. 본문 흐름을 보존하고 없는 호칭을 덧붙이지 않기 위해 대명사만 유지했습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: גְּמוּל 반복의 처리
  chosen_reading: ‘보응’과 ‘마땅한 보응’으로 반복을 살리되, ‘갚으실 것입니다’로 자연스럽게 정리했습니다.
  alternative_readings:
  - ‘보응을 보응하실 것입니다’로 직역
  - ‘갚으실 것입니다’만 사용
  rationale: 히브리어는 명사+동사로 보응의 강조를 만듭니다. 한국어에서는 직역이 부자연스러우므로, 핵심 의미를 유지하면서 반복의 강조는 어휘 선택으로 반영했습니다.
  doctrine_reference: 번역 철학 §6
