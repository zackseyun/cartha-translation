  to: 그가 사람이 없음을 보셨습니다[a][c]. 중재할 사람이 없음을 보고 경악하셨습니다. 그래서 그의 팔이 그에게 구원을 베풀었고[b], 그의 의가 그를 붙들었습니다.
  rationale: 수정문은 하나님의 존대 서술(보셨습니다, 경악하셨습니다)은 유지하면서, ‘팔’과 ‘의’가 원문에서 의인화된 문법적 주어라는 점에 따라 비존대 종결을 사용했습니다. 또한 구원 동사를 ‘구원을 베풀었다’로 다듬어 לּוֹ의 여격과 וַתּוֹשַׁע의 구원 행위를 자연스럽게 재현했습니다. 주석 c는 설명 대상인 ‘사람’으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
