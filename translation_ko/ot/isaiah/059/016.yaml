id: ISA.59.16
reference: Isaiah 59:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
  footnotes:
  - marker: a
    text: Or 'no one to intervene' or 'no one to plead.' The Hebrew participle can denote one who steps in on behalf of another.
    reason: lexical_alternative
  - marker: b
    text: Or 'his justice upheld him.' The Hebrew term can denote both righteousness and justice.
    reason: lexical_alternative
  - marker: c
    text: '''Man'' translates a singular masculine Hebrew term. Here it refers to the absence of any human agent.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 사람이 없음을 보셨습니다[a][c]. 중재할 사람이 없음을 보고 경악하셨습니다. 그래서 그의 팔이 그에게 구원을 베풀었고[b], 그의 의가 그를 붙들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개입할 사람’ 또는 ‘간구할 사람’. 히브리어 분사형은 다른 사람을 위해 나서서 행동하는 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 정의가 그를 붙들었습니다’. 히브리어 용어는 ‘의’와 ‘정의’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사람’은 단수 남성형 히브리어를 옮긴 것입니다. 여기서는 어떤 인간 행위자도 없다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 단수 남성형의 형식을 살리되, 이 문맥에서는 특정 성별보다 인간 행위자의 부재를 가리키므로 한국어 본문에서는 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: וַיִּשְׁתּוֹמֵם
  english_pob_choice: he was appalled
  chosen_korean: 크게 놀라셨습니다
  alternatives_korean:
  - 경악하셨습니다
  - 아연해하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 놀람보다 충격과 경악의 뉘앙스를 가지므로, 문맥의 무게를 살리면서도 한국어에서 지나치게 구어적이지 않게 처리했습니다.
- source_word: מַפְגִּיעַ
  english_pob_choice: to intercede
  chosen_korean: 중재할 사람
  alternatives_korean:
  - 간구할 사람
  - 개입할 사람
  lexicon: HALOT
  rationale: 이 분사형은 누군가를 위해 나서서 중재하는 사람을 뜻하므로, 관계적·대리적 의미를 드러내는 ‘중재하다’를 본문에 반영했습니다.
- source_word: זְרֹעוֹ
  english_pob_choice: his own arm
  chosen_korean: 그의 팔
  alternatives_korean:
  - 그의 친히 행하신 손
  - 그의 힘
  lexicon: HALOT
  rationale: 히브리어에서 ‘팔’은 능력과 결정적 행동의 상징이므로 직역을 유지했습니다. 소유격 문맥상 ‘그의 팔’만으로도 자력적 행동이 드러나며, ‘own’에 해당하는 ‘친히’는 본문 과잉이 될 수 있어 본문에는 넣지 않았습니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 의로움
  - 그의 정의
  lexicon: HALOT
  rationale: 한국어 성경에서 צדקה의 기본 대응은 ‘의’이며, 하나님의 올바르심과 언약적 신실함을 함께 담을 수 있습니다. ‘정의’는 가능하지만 본문에서는 평행법상 더 포괄적인 ‘의’를 택했습니다.
- source_word: סְמָכָתְהוּ
  english_pob_choice: upheld him
  chosen_korean: 그를 붙드셨습니다
  alternatives_korean:
  - 그를 지탱하셨습니다
  - 그를 받치셨습니다
  lexicon: HALOT
  rationale: 이 동사는 버팀·지탱의 뜻이므로, 하나님의 의가 그를 안정되게 지탱한다는 이미지를 자연스럽고 격식 있게 살리는 ‘붙드셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 주어와 대명사 일치
  chosen_reading: 본문의 모든 동사는 여호와의 자기 주도적 구원 행동을 묘사하는 것으로 읽고, 대명사와 동사의 주어를 일관되게 하나님께 돌렸습니다.
  alternative_readings:
  - 마지막 절들을 보다 추상적으로, 하나님의 능력과 의가 작용하는 표현으로 읽을 수 있습니다.
  rationale: 문맥상 인간 중재자가 없을 때 하나님 자신이 개입한다는 점이 강조되므로, 수식 구조를 흐리지 않도록 주어를 일관되게 처리했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: צִדְקָה의 신학적 범위
  chosen_reading: 본문에서는 ‘의’를 본문어로 두어 하나님의 올바르심과 구원의 정당성을 함께 드러냈습니다.
  alternative_readings:
  - ‘정의’로 옮겨 사회적·재판적 뉘앙스를 더 분명히 할 수 있습니다.
  rationale: 이 구절의 평행법은 구원 행위와 하나님의 צדקה를 연결하므로, 기본 번역어인 ‘의’를 유지하는 것이 신학적 폭을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη / righteousness ~ justice'
