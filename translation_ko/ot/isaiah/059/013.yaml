  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
  footnotes:
  - marker: a
    text: Or 'speaking oppression and rebellion'; the Hebrew noun rendered 'revolt' can also be translated 'apostasy' or 'rebellion.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the heart,' expressing that the false words arise from inward intention, not merely outward speech.
    reason: cultural_note
translation:
  language: ko
  text: 반역하며 야훼를 부인하고, 우리 하나님 뒤에서 돌아서며, 억압과 반역을 말하고, 마음에서 거짓말을 꾸며 내고 내뱉습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뒤에서’는 히브리어 מֵאַחַר의 직역에 가까우며, ‘따르다’의 관계를 공간적 이미지로 보존합니다.
    reason: source_note
  - marker: b
    text: ‘거짓말’은 히브리어 ‘거짓의 말들’(דִּבְרֵי שָׁקֶר)을 현대 한국어로 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשֹׁעַ
  english_pob_choice: transgressing
  chosen_korean: 반역하며
  alternatives_korean:
  - 범죄하며
  - 죄를 범하며
  - 거스르며
  lexicon: HALOT
  rationale: 문맥상 단순한 일반 범죄보다 언약적 배반의 뉘앙스가 강해 ‘반역하며’로 옮기면 동사의 강한 위반성을 살릴 수 있습니다.
- source_word: וְכַחֵשׁ בַּיהוָה
  english_pob_choice: and denying Yahweh
  chosen_korean: 야훼를 부인하고
  alternatives_korean:
  - 야훼를 거짓되게 대하고
  - 야훼를 속이고
  - 야훼를 부정하고
  lexicon: HALOT
  rationale: כחש는 부인·거짓됨의 뜻을 가지므로, 관계를 끊는 언약적 거부를 분명히 드러내는 ‘부인하고’가 가장 자연스럽습니다.
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  english_pob_choice: and turning back from following our God
  chosen_korean: 우리 하나님 뒤에서 돌아서며
  alternatives_korean:
  - 우리 하나님을 따르다가 물러서며
  - 우리 하나님을 뒤로하고 돌아서며
  - 우리 하나님을 따르던 길에서 물러서며
  lexicon: HALOT
  rationale: ‘뒤에서’는 히브리어의 ‘after/behind’ 이미지를 보존하고, ‘돌아서며’는 따르던 관계를 끊고 물러나는 동작을 자연스럽게 전달합니다.
- source_word: דִּבְרֵי שָׁקֶר
  english_pob_choice: words of falsehood
  chosen_korean: 거짓말을
  alternatives_korean:
  - 거짓의 말
  - 허위의 말
  - 거짓된 말
  lexicon: HALOT
  rationale: 히브리어의 ‘거짓의 말들’은 발화의 내용이 거짓임을 뜻하므로, 현대 한국어에서 가장 직접적인 ‘거짓말’을 사용하되 앞의 ‘말하고’와 중복을 피하기 위해 뒤에서 자연스럽게 연결했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה를 프로젝트 기본 원칙에 따라 고유 신명인 ‘야훼’로 음역하여, 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: Glossary — YHWH → 야훼
- issue: וְסָרָה의 의미 범위
  chosen_reading: 반역
  alternative_readings:
  - 배교
  - 반란
  - 불순종
  rationale: 문맥은 하나님께 대한 언약적 불충성을 가리키지만, 단어 자체는 더 넓은 반항·이탈의 뜻을 가지므로, 교리적으로 좁혀진 ‘배교’보다 ‘반역’이 원문의 긴장을 더 잘 살립니다.
  doctrine_reference: 'POB translation philosophy: source-direct, tension-preserving'
