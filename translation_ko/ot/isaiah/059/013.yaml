    rationale: מֵאַחַר는 하나님 ‘뒤를 따르는 것에서’ 물러남을 나타내는 관용적 공간 이미지입니다. 한국어에서는 ‘우리 하나님을 따르던 길에서 돌아서고’가 그 의미를 자연스럽고 충실하게 전달합니다.
