  source_fidelity: 핵심 의미는 대체로 보존했으나, ‘우리 하나님 뒤에서 돌아서며’는 מֵאַחַר(‘~을 따르던 데서/뒤를 따르던 데서’)를 한국어로 부자연스럽게 직역하여 관계와 이동의 방향이 불명확합니다. 또한 הֹרוֹ וְהֹגוֹ의 내적 형성과 외적 발화의 순서를 더 명료하게 드러낼 필요가 있습니다.
  naturalness: ‘우리 하나님 뒤에서 돌아서며’는 현대 표준 한국어에서 어색하고 뜻이 쉽게 파악되지 않습니다. ‘우리 하나님을 따르던 길에서 돌아서고’는 원문의 추종 이미지를 자연스럽게 전달합니다. ‘마음속에서 거짓된 말을 품고 내뱉습니다’도 문맥과 합쇼체 문장에 자연스럽습니다.
  terminology: ‘야훼’, ‘우리 하나님’, ‘억압’, ‘반역’은 원문의 신명 및 핵심 어휘 범위를 적절히 반영합니다. דִּבְרֵי שָׁקֶר는 단순히 ‘거짓말’로 압축하기보다 ‘거짓된 말’로 옮겨 복수적·발화적 성격을 보존하는 편이 좋습니다.
  issues:
