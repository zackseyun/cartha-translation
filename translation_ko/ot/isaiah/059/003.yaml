  lexicon: HALOT
  rationale: 히브리어 כַּף는 손 전체보다 손바닥/손의 오목한 부분을 더 구체적으로 가리키므로, POB의 주석 취지를 살려 신체 이미지의 구체성을 유지했습니다.
- source_word: נְגֹאֲלוּ
