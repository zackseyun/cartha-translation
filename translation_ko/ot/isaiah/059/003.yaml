  - 읊조립니다
  - 되뇌입니다
  lexicon: HALOT
  rationale: הגה는 낮게 중얼거리거나 읊조리는 소리를 뜻할 수 있으므로, ‘중얼거립니다’가 소리의 뉘앙스와 부정적 분위기를 가장 잘 전달합니다.
theological_decisions:
- issue: 죄의 병렬적 묘사 유지
  chosen_reading: 피, 죄악, 거짓, 불의를 서로 구별되는 표현으로 유지했습니다.
  alternative_readings:
