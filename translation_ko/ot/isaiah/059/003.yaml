  - 전통적 교회어휘로 모두 ‘죄악/불의/거짓됨’으로 고정하는 번역
  rationale: 본문은 신체 부위별로 서로 다른 죄의 양상을 층층이 쌓아 올리므로, 번역에서도 각각의 윤리적·수사적 차이를 보존해야 합니다.
  doctrine_reference: 예언서의 죄 고발 수사와 본문 평행법
