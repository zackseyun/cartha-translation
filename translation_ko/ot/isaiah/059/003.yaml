  lexicon: HALOT
  rationale: 이 동사는 단순한 물리적 얼룩보다 의례적·도덕적 오염을 포함하므로, 한국어에서는 ‘더럽혀져 있다’가 그 부정적 상태를 가장 직접적으로 드러냅니다.
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 거짓말
  - 기만
  lexicon: HALOT
  rationale: 문맥상 입술이 내뱉은 허위 진술 전체를 가리키므로, 보다 넓고 형식적인 ‘거짓’이 적합합니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 악행
  - 불법
  lexicon: HALOT
  rationale: 이 단어는 도덕적·사회적 왜곡을 나타내며, 예언자적 비난의 무게를 살리기 위해 한국어의 성경적 어휘인 ‘불의’를 채택했습니다.
- source_word: תֶהְגֶּה
  english_pob_choice: mutters
  chosen_korean: 중얼거립니다
  alternatives_korean:
