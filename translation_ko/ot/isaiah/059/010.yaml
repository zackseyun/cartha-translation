id: ISA.59.10
reference: Isaiah 59:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְגַֽשְׁשָׁ֤ה כַֽ/עִוְרִים֙ קִ֔יר וּ/כְ/אֵ֥ין עֵינַ֖יִם נְגַשֵּׁ֑שָׁה כָּשַׁ֤לְנוּ בַֽ/צָּהֳרַ֨יִם֙ כַּ/נֶּ֔שֶׁף בָּ/אַשְׁמַנִּ֖ים כַּ/מֵּתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
  footnotes:
  - marker: a
    text: Or possibly, 'in fertile places' or 'among the robust'; the Hebrew term is rare and uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 맹인처럼 담을 더듬고, 눈이 없는 사람들처럼 더듬습니다. 한낮에 넘어지기를 황혼에 하듯 하고, 건장한 사람들 가운데서는 죽은 사람들 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비옥한 곳에서’ 혹은 ‘건장한 사람들 가운데서’일 수 있습니다. 히브리어 어휘는 드물고 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  english_pob_choice: we grope
  chosen_korean: 더듬습니다
  alternatives_korean:
  - 손으로 더듬습니다
  - 헤매며 찾습니다
  lexicon: HALOT
  rationale: גשש의 ‘손으로 더듬으며 찾다’는 감각적 이미지를 한국어 동사 ‘더듬다’가 가장 간결하게 살립니다.
- source_word: כַעִוְרִים
  english_pob_choice: like the blind
  chosen_korean: 맹인처럼
  alternatives_korean:
  - 눈먼 사람들처럼
  - 장님처럼
  lexicon: HALOT
  rationale: 비유의 집단성을 유지하면서도 현대 한국어에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: בָאַשְׁמַנִּים
  english_pob_choice: among the vigorous
  chosen_korean: 건장한 사람들 가운데서는
  alternatives_korean:
  - 강건한 사람들 가운데서는
  - 튼튼한 사람들 가운데서는
  lexicon: HALOT
  rationale: 희귀하고 불확실한 어휘의 문맥상 유력한 뜻을 따라, ‘vigorous/strong/robust’의 느낌을 살린 ‘건장한 사람들’로 옮겼습니다.
- source_word: כַּמֵּתִים
  english_pob_choice: like the dead
  chosen_korean: 죽은 사람들 같습니다
  alternatives_korean:
  - 죽은 자들 같습니다
  - 죽은 듯합니다
  lexicon: HALOT
  rationale: 비교문의 강도를 유지하면서도 한국어 문장 흐름에 맞게 ‘죽은 사람들 같습니다’로 직역성을 보존했습니다.
theological_decisions:
- issue: 시적 자기비하의 강도
  chosen_reading: 화자는 실제로 맹인과 죽은 자가 아니라, 공동체의 무기력과 무능을 극단적 이미지로 진술합니다.
  alternative_readings:
  - 단순한 과장으로 약화해 읽는 방식
  - 영적 무지의 은유로만 제한하는 방식
  rationale: 히브리어 병행구조가 감각적·실존적 절망을 강하게 드러내므로, 은유를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 시가와 예언서의 수사적 과장과 비유
- issue: בָאַשְׁמַנִּים의 번역
  chosen_reading: 문맥상 ‘건장한 사람들 가운데서는’로 읽고, 희귀어의 불확실성은 본문에 각주로 반영하지 않았습니다.
  alternative_readings:
  - 비옥한 곳에서
  - 기름진 곳에서
  - 강한 자들 가운데서
  rationale: 본문 병행구조는 장소보다 사람들 가운데의 대비를 요구하므로, 사람 집단을 가리키는 읽음을 우선했습니다.
  doctrine_reference: 히브리어 희귀어의 문맥 우선 해석
