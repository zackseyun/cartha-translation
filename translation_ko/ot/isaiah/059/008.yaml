id: ISA.59.8
reference: Isaiah 59:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
  footnotes:
  - marker: a
    text: Or 'there is no judgment in their tracks.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in it'; the singular likely refers collectively to their course or path.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 평강의 길을 알지 못하며, 그들의 길들에는 정의가 없습니다. 그들은 스스로 자기 길들을 굽게 만들었으며, 그 길들로 걷는 자마다 평강을 알지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자취에는 판단이 없습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그것 안에’입니다. 여기서는 앞선 길 전체를 집합적으로 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שָׁלוֹם
  english_pob_choice: the way of peace
  chosen_korean: 평강의 길
  alternatives_korean:
  - 평화의 길
  - 평안의 길
  lexicon: HALOT
  rationale: שָׁלוֹם은 여기서 예언서적 관용구로서 단순한 내적 안정보다 관계적·공동체적 온전함을 포함하므로, POB의 'peace'에 맞추어 표준적인 '평강'을 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  - 공의
  lexicon: HALOT
  rationale: 이 문맥은 재판 행위보다 사회적·윤리적 질서를 고발하므로, POB의 'justice'를 한국어 '정의'로 옮기는 것이 가장 직접적입니다.
- source_word: מַעְגְּלוֹתָם / נְתִיבוֹתֵיהֶם
  english_pob_choice: their tracks / their roads
  chosen_korean: 그들의 길들
  alternatives_korean:
  - 그들의 발자국들
  - 그들의 궤도들
  - 그들의 도로들
  lexicon: HALOT
  rationale: 두 시어를 한국어에서 과도하게 구분하기보다, 병행구의 이미지를 살려 '길들'로 묶되 복수형을 유지해 원문의 집합적 복수 이미지를 반영했습니다.
- source_word: עִקְּשׁוּ
  english_pob_choice: have made ... crooked
  chosen_korean: 굽게 만들었으며
  alternatives_korean:
  - 비뚤게 만들었으며
  - 뒤틀어 놓았으며
  - 구부려 버렸으며
  lexicon: HALOT
  rationale: 동사의 도덕적·형상적 의미를 함께 살리기 위해 '굽게'를 택해, 인간이 자기 삶의 길을 스스로 왜곡했다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: ‘peace/shalom’의 한국어 표지
  chosen_reading: 평강
  alternative_readings:
  - 평화
  - 평안
  - 온전함
  rationale: 본문의 예언자적 어조와 반복 구조를 고려하면 '평강'이 교회 전통에서 익숙하면서도 원문의 언약적·관계적 뉘앙스를 비교적 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 희랍어/히브리어 병행시의 복수 지시 처리
  chosen_reading: 그 길들로 걷는 자마다
  alternative_readings:
  - 그 길로 걷는 자마다
  - 그것으로 걷는 자마다
  rationale: 히브리어는 복수 명사 뒤에 단수 대명사가 올 수 있지만, 한국어에서는 복수 지시를 드러내는 편이 의미를 더 분명하게 전달하므로 집합적 복수로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
