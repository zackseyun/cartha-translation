  source_fidelity: 원문의 반복되는 ‘평화’와 ‘알다’, משפט의 사회·윤리적 의미인 ‘정의’, 그리고 길의 이미지가 대체로 반영되어 있습니다. 다만 מַעְגְּלוֹתָם와 נְתִיבוֹתֵיהֶם를 모두 ‘길들’로 처리하여 시적 어휘의 구별이 약해졌고, 마지막 단수 대명사 בָּהּ에 관한 각주 위치가 적절하지 않습니다.
  naturalness: ‘그들의 길들’, ‘그 길들로 걷는 자마다’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘그들의 길’, ‘그 길을 걷는 사람은 누구나’가 집합적 길의 비유를 자연스럽게 전달합니다. 비종파적 현대 문체에는 ‘평화’가 ‘평강’보다 더 중립적이고 일반적으로 이해됩니다.
  terminology: מִשְׁפָּט은 ‘정의’로 적절합니다. שָׁלוֹם은 본절에서 ‘평화’로 일관되게 옮기는 것이 자연스럽고 중립적입니다. 첫 번째 길 어휘는 ‘자취’, 두 번째는 ‘길’로 달리하여 원문의 병행과 어휘 변화를 어느 정도 보존했습니다.
