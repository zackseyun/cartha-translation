revisions:
- from: 그들은 평강의 길을 알지 못하며, 그들의 길들에는 정의가 없습니다. 그들은 스스로 자기 길들을 굽게 만들었으며, 그 길들로 걷는 자마다 평강을 알지 못합니다.[a][b]
  to: 그들은 평화의 길을 알지 못하고, 그들의 자취에는 정의가 없습니다.[a] 그들은 자기 길을 스스로 비뚤게 만들었으니, 그 길을[b] 걷는 사람은 누구나 평화를 알지 못합니다.
  rationale: 각주를 해당 어구에 직접 연결하고, 현대 표준어에 맞게 복수 ‘길들’ 표현을 자연스러운 집합 단수로 조정했습니다. ‘평화’를 반복하여 שָׁלוֹם의 어휘적 반복을 보존했으며, ‘자취’와 ‘길’을 구별해 두 히브리어 길 어휘의 병행을 어느 정도 살렸습니다. ‘스스로’는 לָהֶם의 재귀적/수혜적 뉘앙스를 간결하게 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:26Z'
