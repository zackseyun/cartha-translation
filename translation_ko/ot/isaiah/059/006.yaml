id: ISA.59.6
reference: Isaiah 59:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
  footnotes:
  - marker: a
    text: Or 'their spiderwebs.' The Hebrew term refers to what is woven/spun; 'webs' preserves the metaphor without over-specifying.
    reason: lexical_alternative
  - marker: b
    text: Or 'their deeds are deeds of iniquity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 짠 것은 옷이 되지 못하며,[a] 그들의 행위로 자신을 가리지도 못합니다. 그들의 행위는 악한 행위이며,[b] 폭력의 행위가 그들의 손에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 거미줄’. 히브리어는 짜거나 뽑아 낸 것을 가리키며, 앞 절의 거미 비유와 관련될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불의의 행위’ 또는 ‘죄악의 행위’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֽוּרֵי/הֶם
  english_pob_choice: their webs
  chosen_korean: 그들의 거미줄
  alternatives_korean:
  - 그들의 웹
  - 그들의 거미줄들
  - 그들이 짠 줄
  lexicon: HALOT
  rationale: 문맥상 5절의 ‘거미의 그물’을 이어받는 비유이므로 ‘거미줄’이 가장 자연스럽고, 영어 POB의 ‘webs’가 유지한 은유를 한국어에서도 살렸습니다.
- source_word: לְ/בֶגֶד
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 복장
  - 한 벌의 옷
  lexicon: HALOT
  rationale: 히브리어 בגד는 일반적인 ‘옷/의복’의 뜻이므로, 현대 한국어에서 가장 간명한 ‘옷’으로 옮겨 결과 상태를 분명하게 했습니다.
- source_word: מַֽעֲשֵׂי/הֶם
  english_pob_choice: their deeds
  chosen_korean: 자기들의 행위
  alternatives_korean:
  - 그들의 행위
  - 그들의 일
  - 그들의 행위들
  lexicon: HALOT
  rationale: 반복되는 מַעֲשֵׂיהֶם을 한국어에서도 반복시켜 수사적 강조를 살렸고, ‘자기들의’로 뒤의 ‘자신을’과 연결되는 자기기만/자기보호의 뉘앙스를 자연스럽게 했습니다.
- source_word: מַֽעֲשֵׂי אָ֔וֶן
  english_pob_choice: deeds of wickedness
  chosen_korean: 악한 행위
  alternatives_korean:
  - 불의의 행위
  - 죄악의 행위
  - 사악한 행위
  lexicon: HALOT
  rationale: אָוֶן은 불의·악·허망함의 폭이 있으나, 이 문맥의 도덕적 비난을 현대 독자가 바로 이해하도록 ‘악한 행위’로 옮겼습니다. 영어 POB의 의미 범위를 과도하게 좁히지 않으면서도 자연스럽습니다.
- source_word: וּ/פֹ֥עַל חָמָ֖ס
  english_pob_choice: the work of violence
  chosen_korean: 폭력의 행위
  alternatives_korean:
  - 폭력의 일
  - 폭력의 일꾼의 행위
  - 강포의 행위
  lexicon: HALOT
  rationale: פֹעַל은 ‘일/행위/산물’의 뜻이므로 ‘행위’가 מתאים하고, חָמָס는 폭력·강포를 가리켜 ‘폭력의 행위’로 옮기면 구성관계와 의미를 모두 보존합니다.
- source_word: בְּ/כַפֵּי/הֶם
  english_pob_choice: is in their hands
  chosen_korean: 그들의 손에 있습니다
  alternatives_korean:
  - 그들의 손바닥에 있습니다
  - 그들의 손안에 있습니다
  - 그들의 손에 놓여 있습니다
  lexicon: HALOT
  rationale: כף는 문자적으로 ‘손바닥’이지만, 관용적으로 책임과 소유를 나타내므로 한국어에서도 가장 자연스러운 ‘손에 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ‘손에 있습니다’라는 소유/책임 이미지
  chosen_reading: ‘폭력의 행위는 그들의 손에 있습니다’로 직역에 가깝게 유지해, 폭력이 그들의 실질적 소유이자 책임이라는 고발을 드러냈습니다.
  alternative_readings:
  - ‘그들은 폭력을 행합니다’
  - ‘폭력이 그들의 손에 묻어 있습니다’
  rationale: 히브리어는 단순 행위 진술보다 손에 담긴 소유·책임의 이미지를 사용하므로, 이를 평이하게 풀기보다 이미지 자체를 보존하는 것이 원문 효과에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
