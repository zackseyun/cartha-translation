id: ISA.59.2
reference: Isaiah 59:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'your iniquities have separated you from your God, and your sins have hidden his face from you so that he does not hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분의 죄악이 여러분과 여러분의 하나님 사이를 가르는 것이 되었고[a], 여러분의 죄가 그분의 얼굴을 여러분에게서 가려 그분께서 듣지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘여러분의 죄악이 여러분을 여러분의 하나님과 갈라놓았고, 여러분의 죄가 그분의 얼굴을 여러분에게서 가려 그분께서 듣지 않으십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם
  english_pob_choice: your iniquities
  chosen_korean: 여러분의 죄악
  alternatives_korean:
  - 여러분의 불의
  - 여러분의 악행
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 비틀림·뒤틀림에서 오는 죄책/죄악을 담으므로, 뒤의 חַטָּאות과 구별되도록 ‘죄악’으로 옮겼습니다.
- source_word: הָיוּ מַבְדִּלִים
  english_pob_choice: have become those dividing
  chosen_korean: 갈라놓았고
  alternatives_korean:
  - 분리하고 있고
  - 사이에서 나누는 자가 되었고
  lexicon: HALOT
  rationale: 히브리어의 היה+분사 구조를 완전히 직역하면 어색하므로, 본문의 지속적·결과적 분리 상태를 살리면서도 한국어 문장성에 맞게 ‘갈라놓았고’로 옮겼습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 여러분의 하나님
  alternatives_korean:
  - 여러분의 신
  - 여러분의 하나님이신 분
  lexicon: HALOT
  rationale: 언약적 관계를 가리키는 소유 표현이므로, 한국어 성경의 일반 독법에 맞춰 ‘여러분의 하나님’으로 옮겼습니다.
- source_word: הִסְתִּירוּ פָנִים
  english_pob_choice: have hidden his face
  chosen_korean: 그의 얼굴을 여러분에게서 가려
  alternatives_korean:
  - 그의 얼굴을 여러분에게서 숨겨
  - 그의 얼굴을 돌려
  lexicon: HALOT
  rationale: ‘얼굴’은 하나님의 임재/관계의 인격적 표지이므로 추상화하지 않고, 히브리어 관용구를 살려 ‘가려’로 옮겼습니다.
- source_word: מִשְּׁמוֹעַ
  english_pob_choice: from hearing
  chosen_korean: 듣지 않으십니다
  alternatives_korean:
  - 들으시지 않도록
  - 듣지 못하게
  lexicon: HALOT
  rationale: 전치사+부정사구의 결과를 한국어에서는 자연스러운 종결 절로 풀어, 하나님의 응답 부재를 분명하게 드러냈습니다.
theological_decisions:
- issue: 하나님의 ‘얼굴’ 이미지 보존
  chosen_reading: ‘그의 얼굴’을 그대로 유지해 관계적 단절의 이미지를 보존했습니다.
  alternative_readings:
  - 그의 은총을
  - 그분의 임재를
  rationale: 본문은 추상적 개념보다 인격적·언약적 거리감을 가리키는 ‘얼굴’ 이미지를 사용하므로, 이를 유지하는 편이 본문의 신학적 긴장을 더 직접적으로 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 죄의 원인성
  chosen_reading: 죄악과 죄가 하나님과의 분리를 일으킨다는 인과를 그대로 드러냈습니다.
  alternative_readings:
  - 여러분은 하나님께 멀어졌습니다
  - 하나님이 여러분에게서 떠나셨습니다
  rationale: 본문은 하나님의 무능이 아니라 인간의 죄가 관계적 단절의 원인임을 설명하므로, 그 인과를 흐리지 않도록 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
