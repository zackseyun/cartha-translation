source:
  edition: WLC
  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
  footnotes:
  - marker: a
    text: Or 'your seed' and 'your seed’s seed.' The Hebrew uses the collective noun 'seed' for offspring/posterity.
    reason: lexical_alternative
  - marker: b
    text: Or 'from now on and forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나로 말하건대, 이것은 그들에게 주는 내 언약입니다. 야훼께서 말씀하십니다. “내 영이 네 위에 있고, 내가 네 입에 둔 내 말들이 네 입에서, 네 자손의 입에서, 그리고 네 자손의 자손의 입에서 떠나지 않을 것입니다. 이제부터 영원까지입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 자손’은 히브리어의 집합명사 זֶרַע를 옮긴 것입니다. 본문은 단순한 개인이 아니라 이어지는 후손 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이제부터 그리고 영원까지’입니다. 시간의 시작과 끝없음을 함께 강조하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And as for me
  chosen_korean: 그리고 나로 말하건대
  alternatives_korean:
  - 그리고 나
  - 나로 말하면
  lexicon: HALOT
  rationale: 전면화된 인칭 대명사의 대비를 한국어에서도 살리기 위해 단순한 ‘그리고 내가’보다 대비·강조가 있는 표현으로 옮겼습니다.
- source_word: זֹאת בְּרִיתִי אוֹתָם
  english_pob_choice: this is my covenant with them
  chosen_korean: 이것은 그들에게 주는 내 언약입니다
  alternatives_korean:
  - 이것은 그들과 맺는 내 언약입니다
  - 이것은 그들을 향한 내 언약입니다
  lexicon: HALOT
  rationale: בְּרִית + 목적격 대명사의 관계를 한국어에서는 관계적 표현으로 자연스럽게 풀되, ‘with them’의 상호적 뉘앙스를 유지했습니다.
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 나의 영
  lexicon: HALOT
  rationale: 히브리어 רוּחַ는 여기서 하나님의 내주적 임재/능력을 가리키므로, 본문의 함의를 해치지 않도록 ‘영’으로 두었습니다.
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  english_pob_choice: and my words that I have put in your mouth
  chosen_korean: 내가 네 입에 둔 내 말들
  alternatives_korean:
  - 내가 네 입에 넣은 내 말들
  - 내가 네 입에 두었던 내 말들
  lexicon: HALOT
  rationale: 복수형 דְבָרַי를 ‘말들’로 살리고, שַׂמְתִּי는 지속적 효력을 드러내는 자연스러운 과거완료 감각으로 옮겼습니다.
- source_word: זַרְעֲךָ / זֶרַע זַרְעֲךָ
  english_pob_choice: your offspring / your offspring’s offspring
  chosen_korean: 네 자손 / 네 자손의 자손
  alternatives_korean:
  - 네 씨 / 네 씨의 씨
  - 네 후손 / 네 후손의 후손
  lexicon: HALOT
  rationale: 지속되는 집단적 후손 개념을 현대 한국어에서 가장 분명하게 드러내는 표현으로 옮겼습니다. ‘씨’는 원어의 집합명사성을 더 직접적으로 드러내지만, 본문 본문성·가독성의 균형상 ‘자손’을 채택했습니다.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  english_pob_choice: from now and forever
  chosen_korean: 이제부터 영원까지
  alternatives_korean:
  - 지금부터 영원까지
  - 이제부터 그리고 영원히
  lexicon: HALOT
  rationale: 시간적 시작점과 무한한 지속을 현대 한국어에서 가장 간명하게 전달하는 표현으로 정리했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 표준에 따라 신명사 철자 전통보다 원문 음역을 우선하여 ‘야훼’로 표기했습니다.
  doctrine_reference: Divine name policy (YHWH = 야훼)
- issue: 누가 말하는가의 화행 표시
  chosen_reading: ‘야훼께서 말씀하십니다’로 현재형 선언을 유지
  alternative_readings:
  - ‘야훼께서 말씀하셨습니다’
  - ‘주께서 이르십니다’
  rationale: 예언 공식의 현재적 선포성을 살려, 히브리어 אָמַר의 선언적 기능을 한국어에서 현재형으로 반영했습니다.
  doctrine_reference: Prophetic speech formula preservation
