id: ISA.59.17
reference: Isaiah 59:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּלְבַּ֤שׁ צְדָקָה֙ כַּ/שִּׁרְיָ֔ן וְ/כ֥וֹבַע יְשׁוּעָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּלְבַּ֞שׁ בִּגְדֵ֤י נָקָם֙ תִּלְבֹּ֔שֶׁת וַ/יַּ֥עַט כַּ/מְעִ֖יל קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
  footnotes:
  - marker: a
    text: Or 'breastplate' for 'body armor.' The Hebrew term refers to torso armor.
    reason: lexical_alternative
  - marker: b
    text: Or 'victory' or 'deliverance' for 'salvation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'jealousy' for 'zeal,' in the sense of intense covenantal ardor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 의를 갑옷처럼 입으시고, 구원의 투구를 머리에 쓰셨습니다. 그분은 보복의 옷을 입으시고, 열심을 외투처럼 두르셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갑옷’은 히브리어가 가리키는 몸통 보호구를 포괄적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원’은 문맥에 따라 ‘승리’ 또는 ‘건짐’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘열심’은 여기서 질투라기보다 언약적 열정과 강렬한 헌신을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: 전쟁 이미지 안에서도 하나님의 도덕적·언약적 올바름을 가리키므로, ‘의’가 가장 압축적이면서도 본문 의미를 잘 보존합니다.
- source_word: שִׁרְיָן
  english_pob_choice: body armor / breastplate
  chosen_korean: 갑옷
  alternatives_korean:
  - 흉갑
  - 흉배
  lexicon: HALOT
  rationale: 이 어휘는 몸통을 보호하는 갑옷류를 가리키므로, 현대 한국어에서 자연스럽고 범위도 넓은 ‘갑옷’으로 옮겼습니다.
- source_word: יְשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 승리
  - 건짐
  lexicon: HALOT
  rationale: 이사야 문맥에서 구속적 개입을 가리키는 표준 의미를 살려 ‘구원’으로 번역했습니다.
- source_word: קִנְאָה
  english_pob_choice: zeal
  chosen_korean: 열심
  alternatives_korean:
  - 질투
  - 열정
  lexicon: HALOT
  rationale: 하나님의 언약적 열기를 뜻하는 긍정적 의미를 살리기 위해, 한국어에서 그 강렬함을 가장 자연스럽게 드러내는 ‘열심’을 택했습니다.
theological_decisions:
- issue: 여호와의 전사 이미지 보존
  chosen_reading: 하나님이 의, 구원, 보복, 열심으로 무장하시는 구체적 전쟁 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 추상적 성품 진술로 완화하는 번역
  rationale: 히브리어 본문은 하나님의 적극적 개입을 전사적 비유로 표현하므로, 이미지를 약화하지 않고 유지하는 것이 원문의 신학적 긴장을 가장 잘 전달합니다.
  doctrine_reference: 원어 우선 원칙; 비유의 구체성을 보존하는 번역
