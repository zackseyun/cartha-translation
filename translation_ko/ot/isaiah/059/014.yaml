  source_fidelity: 개정이 필요합니다. 초안은 משפט/צדקה의 구별과 본문의 인격화된 추상명사 구성을 대체로 보존하지만, כָשְׁלָה의 ‘비틀거리다/넘어지다’라는 비유를 ‘넘어졌습니다’로 고정하고, נְכֹחָה를 다소 부자연스러운 ‘바른 것’으로 처리했습니다. 또한 각주 표지가 본문 관련 어구에 붙어 있지 않아 대안이 무엇을 가리키는지 불분명합니다.
  naturalness: ‘참됨’, ‘바른 것은’은 현대 표준 한국어에서 이 문맥의 인격화된 공적·도덕적 추상명사를 표현하기에 다소 어색합니다. ‘진실’, ‘올바름’이 자연스럽고 본문의 병행도 잘 드러냅니다. ‘이는 … 때문입니다’ 구조는 히브리어 כי가 제시하는 이유를 합쇼체 문장으로 명료하게 나타냅니다.
  terminology: ‘정의’와 ‘의’는 משפט과 צדקה를 구별하는 적절한 대응어이므로 유지합니다. אמת는 이 문맥에서 ‘진실’로, נְכֹחָה는 ‘올바름’으로 옮기는 것이 자연스럽습니다. רחוב는 ‘거리’로 번역하고, 공적 장소라는 뉘앙스는 각주에서 보완할 수 있습니다.
