source:
  edition: WLC
  text: וְ/הֻסַּ֤ג אָחוֹר֙ מִשְׁפָּ֔ט וּ/צְדָקָ֖ה מֵ/רָח֣וֹק תַּעֲמֹ֑ד כִּֽי כָשְׁלָ֤ה בָֽ/רְחוֹב֙ אֱמֶ֔ת וּ/נְכֹחָ֖ה לֹא תוּכַ֥ל לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
  footnotes:
  - marker: a
    text: Or 'truth has fallen in the public square.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what is right cannot enter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 정의는 뒤로 밀려나며[a], 의는 멀리 서 있습니다. 이는 진실이 거리에서 비틀거리고[b], 올바름은 들어올 수 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뒤로 물러납니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “공적 광장에서 넘어졌습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  english_pob_choice: Justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 판단
  lexicon: HALOT
  rationale: 이 문맥은 개인 판결보다 공적·사회적 질서를 가리키므로, POB의 "Justice"에 맞춰 한국어로는 "정의"가 가장 자연스럽습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: מִשְׁפָּט과 구별되는 대응어를 살리기 위해, POB의 "righteousness"에 맞춰 표준 성서어인 "의"를 선택했습니다.
- source_word: כָשְׁלָה בָרְחוֹב אֱמֶת
  english_pob_choice: truth has stumbled in the street
  chosen_korean: 참됨이 광장에서 넘어졌습니다
  alternatives_korean:
  - 진리가 길에서 넘어졌습니다
  - 진실이 거리에서 비틀거렸습니다
  lexicon: HALOT
  rationale: אֱמֶת는 여기서 단순 사실성보다 공적 신실함과 진실성을 포함하므로 "참됨"으로 옮기고, בָּרְחוֹב은 공적 장소성을 살려 "광장"으로 옮겼습니다.
- source_word: נְכֹחָה
  english_pob_choice: uprightness
  chosen_korean: 바른 것
  alternatives_korean:
  - 정직
  - 올바름
  - 곧음
  lexicon: HALOT
  rationale: 문맥상 인격화된 추상명사이지만 한국어에서는 자연스럽게 이해되도록 "바른 것"으로 풀어, POB의 의미인 straight/upright의 공적 도덕성을 전달했습니다.
theological_decisions:
- issue: מִשְׁפָּט / צְדָקָה의 구별 유지
  chosen_reading: '"정의"와 "의"를 서로 다르게 번역해 둘의 평행을 보존했습니다.'
  alternative_readings:
  - 둘 다 "정의"로 통일
  - '"판단"과 "의"로 번역'
  rationale: 이 절은 서로 겹치지만 동일하지 않은 두 개념을 병렬로 놓고 있으므로, 한국어에서도 같은 말로 합치지 않고 의미 차이를 드러내는 편이 본문 구조와 신학적 뉘앙스를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5'
