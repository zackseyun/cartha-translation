revisions:
- from: 정의는 뒤로 밀려나고, 의는 멀리 서 있습니다. 참됨이 광장에서 넘어졌기 때문이며, 바른 것은 들어올 수 없습니다.[a][b]
  to: 정의는 뒤로 밀려나며[a], 의는 멀리 서 있습니다. 이는 진실이 거리에서 비틀거리고[b], 올바름은 들어올 수 없기 때문입니다.
  rationale: 히브리어의 수동 표현 הֻסַּג אָחוֹר는 ‘뒤로 밀려나다’로, משפט/צדקה의 구별은 ‘정의/의’로 보존했습니다. כָשְׁלָה는 ‘비틀거리다’로 본문에 옮기되 ‘넘어지다’와 רחוב의 ‘공적 광장’ 가능성은 각주로 남겼습니다. נְכֹחָה는 인격화된 추상명사인 ‘올바름’으로 처리했습니다. 각주 표지를 해당 어구에 직접 연결하고, 중복되던 각주를 실제 대안으로 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:25Z'
