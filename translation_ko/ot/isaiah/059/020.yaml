source:
  edition: WLC
  text: וּ/בָ֤א לְ/צִיּוֹן֙ גּוֹאֵ֔ל וּ/לְ/שָׁבֵ֥י פֶ֖שַׁע בְּ/יַֽעֲקֹ֑ב נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'for Zion'; the Hebrew preposition can sometimes be rendered this way, though 'to Zion' fits the verb 'come' most naturally here.
    reason: lexical_alternative
  - marker: b
    text: '''Redeemer'' translates Hebrew go''el, a term used for one who acts to redeem or reclaim, often with covenantal or kinship overtones.'
    reason: cultural_note
  - marker: c
    text: Or 'to the repentant in Jacob' or 'to those in Jacob who turn back from rebellion.'
    reason: alternative_reading
  - marker: d
    text: Paul cites this verse in Romans 11:26, where the wording differs in part under the influence of the Greek tradition.
    reason: cross_reference
translation:
  language: ko
  text: 시온에 한 구원자가 오며, 야곱 가운데서 허물을 버리고 돌아서는 이들에게 오시리니 — 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시온에’는 בוא와 결합한 ל를 가장 자연스럽게 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹאֵל
  english_pob_choice: a Redeemer
  chosen_korean: 한 구원자
  alternatives_korean:
  - 구속자
  - 속량하시는 이
  - 친족구속자
  lexicon: HALOT
  rationale: go'el의 구속·회복 의미를 살리되, 본문이 친족법 전문용어를 직접 요구하지 않으므로 주석 없이도 읽히는 ‘구원자’로 옮겼습니다.
- source_word: לְצִיּוֹן
  english_pob_choice: to Zion
  chosen_korean: 시온에
  alternatives_korean:
  - 시온을 위해
  - 시온으로
  lexicon: HALOT
  rationale: בוא와 결합한 ל는 도착지를 가리키므로, 한국어에서는 자연스러운 방향격 ‘시온에’로 처리했습니다.
- source_word: וּלְשָׁבֵי פֶשַׁע
  english_pob_choice: and to those in Jacob who turn from transgression
  chosen_korean: 야곱 가운데서 허물을 버리고 돌아서는 이들에게
  alternatives_korean:
  - 야곱 가운데서 반역에서 돌이키는 이들에게
  - 야곱의 회개한 이들에게
  lexicon: HALOT
  rationale: שוב의 분사적 동작성을 살려 ‘돌아서는’으로 옮기고, פשע는 도덕적·언약적 위반의 무게를 반영해 ‘허물’로 번역했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 종결을 현대 한국어 예언체로 자연스럽게 옮기되, 본문상의 יהוה는 프로젝트 기본어인 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 구원자의 정체를 본문에서 어느 정도 특정할 것인가
  chosen_reading: 본문의 개방성을 유지해 ‘한 구원자’로 두고, 메시아적 해석을 본문 안에 직접 주입하지 않았습니다.
  alternative_readings:
  - 메시아가 오며
  - 야훼께서 구원자로 오시며
  rationale: 히브리어 본문 자체는 단지 ‘구원자’를 말하므로, 후대의 적용 가능성은 남기되 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 본문 우선, 해석은 주석으로 분리
