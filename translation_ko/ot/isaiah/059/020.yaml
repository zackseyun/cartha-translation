    rationale: פשע는 흔히 정당한 권위에 대한 반역 또는 범과를 뜻합니다. ‘허물’은 실수나 가벼운 잘못으로도 들릴 수 있어 원문의 무게를 충분히 전달하지 못합니다.
  - severity: low
