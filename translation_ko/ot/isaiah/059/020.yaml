  verdict: revise
  source_fidelity: 히브리어는 단 하나의 동사 וּבָא(‘올 것이다’)가 לְצִיּוֹן과 וּלְשָׁבֵי פֶשַׁע בְּיַעֲקֹב라는 두 여격 성분을 함께 지배합니다. 초안은 ‘오며’와 ‘이들에게 오시리니’로 동사를 두 번 보충하여 구조와 의미를 불필요하게 바꾸었습니다. 또한 פשע는 단순한 ‘허물’보다 권위에 대한 ‘반역/범과’의 뜻이 강합니다.
  naturalness: ‘구원자가 시온에 … 이들에게 올 것입니다’으로 한 동사 아래 두 대상·방향 성분을 배열하면 현대 표준어 합쇼체에서 자연스럽고 원문의 병렬도 보존됩니다. ‘야훼의 말씀입니다’는 예언 선언 공식의 자연스러운 종결입니다.
  terminology: גּוֹאֵל은 정체를 특정하지 않는 ‘구원자’로, פשע는 언약적·도덕적 위반의 강도를 반영하는 ‘반역’으로 옮겼습니다. ‘야훼’는 제시된 프로젝트 표기를 유지했습니다.
  issues:
  - severity: high
    issue: 한 동사로 연결된 두 전치사구를 ‘오며’와 ‘이들에게 오시리니’로 이중 서술함
    rationale: וּבָא는 ‘시온에’와 ‘야곱 가운데 반역에서 돌이키는 이들에게’를 함께 받습니다. 초안의 반복된 ‘오다’는 구원자가 먼저 시온에 오고 이어 특정 사람들에게 다시 온다는 별도의 사건처럼 읽힐 수 있습니다.
