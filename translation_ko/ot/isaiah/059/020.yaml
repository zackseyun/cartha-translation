  rationale: 본문의 단일 동사 구조를 보존하도록 두 여격 성분을 ‘구원자’의 ‘올 것입니다’에 함께 연결했습니다. פשע는 ‘반역’으로 조정하여 원문의 위반·반항의 의미를 살렸으며, 구원자의 정체는 특정하지 않았습니다. 영어 POB의 감사 주석 네 항목도 한국어 앵커와 함께 충실히 반영했습니다.
