id: ISA.59.19
reference: Isaiah 59:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִֽירְא֤וּ מִֽ/מַּעֲרָב֙ אֶת שֵׁ֣ם יְהוָ֔ה וּ/מִ/מִּזְרַח שֶׁ֖מֶשׁ אֶת כְּבוֹד֑/וֹ כִּֽי יָב֤וֹא כַ/נָּהָר֙ צָ֔ר ר֥וּחַ יְהוָ֖ה נֹ֥סְסָה בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'from the east.' Literally, 'from the rising of the sun.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew of the final clause is difficult. Or, 'for it will come like a rushing river, driven by the Spirit of the LORD.'
    reason: alternative_reading
  - marker: c
    text: 'Traditional rendering: ''when the enemy comes in like a flood, the Spirit of the LORD will raise a standard against him.'' This reflects a different construal of the Hebrew.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 그들은 서쪽에서부터 야훼의 이름을, 해가 떠오르는 곳에서부터 그의 영광을 두려워할 것입니다. 이는 그가 좁은 강처럼 오실 것이며, 야훼의 숨결이 그를 몰아가실 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽에서’. 문자적으로는 ‘해가 떠오르는 곳에서’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 마지막 구절은 난해합니다. 또는 ‘그가 좁은 강처럼 오실 것이며, 야훼의 영이 그를 몰아가실 것입니다.’
    reason: alternative_reading
  - marker: c
    text: '전통적 번역: ‘원수가 홍수처럼 밀려올 때 야훼의 영이 그를 대적해 깃발을 세우실 것이다.’ 이는 히브리어의 다른 구성을 반영합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  english_pob_choice: So they will fear
  chosen_korean: 그러면 그들은 … 두려워할 것입니다
  alternatives_korean:
  - 그들은 … 경외할 것입니다
  - 그들은 … 두려워하게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 연결을 살리면서, ירא의 강한 경외·두려움의 뜻을 표준적인 ‘두려워하다’로 옮겼습니다.
- source_word: מִמַּעֲרָב / וּמִמִּזְרַח שֶׁמֶשׁ
  english_pob_choice: from the west / from the rising of the sun
  chosen_korean: 서쪽에서부터 / 해가 떠오르는 곳에서부터
  alternatives_korean:
  - 서쪽에서
  - 동쪽에서
  - 해 뜨는 곳에서부터
  lexicon: HALOT
  rationale: 병렬 구조를 살리기 위해 첫 항은 단순한 방위어로, 둘째 항은 직역에 가까운 ‘해가 떠오르는 곳’을 사용해 시적 대구를 보존했습니다.
- source_word: כְּבוֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 존귀
  - 그의 광채
  lexicon: HALOT
  rationale: כבוד의 기본적·신학적 의미를 따라 ‘영광’으로 옮겨 신현적 맥락을 유지했습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the breath of Yahweh
  chosen_korean: 야훼의 숨결
  alternatives_korean:
  - 야훼의 영
  - 야훼의 바람
  lexicon: HALOT
  rationale: 이 절의 अंतिम 구절은 바람/숨결/영의 중의성이 있으나, 앞선 강물 이미지와 결합될 때 구체적이고 역동적인 상을 주는 ‘숨결’이 본문에 가장 가깝습니다.
- source_word: נֹסְסָה בוֹ
  english_pob_choice: driven by
  chosen_korean: 그를 몰아가실 것이기
  alternatives_korean:
  - 그 안에서 깃발을 세우실 것이기
  - 그를 몰아내실 것이기
  lexicon: HALOT
  rationale: 어근과 문형이 난해하므로 POB의 ‘driven by’에 맞춰 원인의 동력을 드러내는 동사구로 옮겼습니다. 주어가 야훼의 숨결로 이해되므로 종결을 능동적 주어 구조로 정리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 공동체 전통어 대신 고유 신명 표기를 유지해 본문의 직접성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 마지막 절의 주체와 동력 관계
  chosen_reading: 야훼의 숨결이 그를 몰아가실 것입니다
  alternative_readings:
  - 그가 좁은 강처럼 오실 것입니다, 야훼의 영이 그 위에 계실 것입니다
  - 그가 범람하는 강처럼 오실 것입니다
  rationale: 히브리어는 난해하지만, 본문의 핵심은 야훼의 임재/숨결이 강물 같은 도래를 추동한다는 점이므로 그 관계를 한국어에서 명시적으로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
