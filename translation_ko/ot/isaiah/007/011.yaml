- from: 당신을 위해 야훼 당신의 하나님께서 주시는 표징을 구하십시오. 그것을 스올만큼 깊게 하거나 하늘만큼 높게 하십시오.[a]
  to: 야훼, 당신의 하나님께 표징 하나를 구하십시오. 깊은 곳에서든 위 높은 곳에서든 구하십시오.[a]
  rationale: 본문은 야훼께 표징을 요청하라는 명령 뒤에 깊이와 높이의 양 극단을 제시합니다. ‘스올’과 ‘하늘’은 해석적으로 가능한 극단 대비이나 히브리어에 명시되지 않으며, 특히 שְׁאָלָה의 분석에는 논의가 있으므로 본문 번역에 이를 확정적으로 넣지 않았습니다. 수정문은 명령의 반복과 극단 대비를 보존하면서 한국어 문장 구조를 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:12Z'
