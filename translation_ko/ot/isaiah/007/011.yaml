  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁאַל לְ/ךָ֣ א֔וֹת מֵ/עִ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ הַעְמֵ֣ק שְׁאָ֔לָה א֖וֹ הַגְבֵּ֥הַּ לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
  footnotes:
  - marker: a
    text: Hebrew literally, 'make it deep ... or make it high upward'; 'heaven' makes explicit the implied upper extreme in the contrast with Sheol.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신을 위해 야훼 당신의 하나님께서 주시는 표징을 구하십시오. 그것을 스올만큼 깊게 하거나 하늘만큼 높게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘위로/위쪽으로’에 가깝지만, 앞의 ‘스올’과 짝을 이루는 대조를 분명히 하려면 ‘하늘’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל
  english_pob_choice: Ask
  chosen_korean: 구하십시오
  alternatives_korean:
  - 청하십시오
  - 요청하십시오
  lexicon: HALOT
  rationale: 아하스에게 주는 직접 명령이므로, 현대 표준어에서 자연스럽고 정중한 명령형인 ‘구하십시오’로 옮겼습니다.
- source_word: אוֹת
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징조
  - 증거
  lexicon: HALOT
  rationale: 예언 문맥에서 하나님께서 주시는 확증의 뜻을 살리기 위해, 단순한 ‘표’보다 의미가 분명한 ‘표징’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기본명은 POB 원칙에 따라 титул이 아닌 고유명 ‘야훼’로 옮겼습니다.
- source_word: לְמָעְלָה
  english_pob_choice: heaven
  chosen_korean: 하늘만큼 높게
  alternatives_korean:
  - 위로
  - 위쪽으로
  - 높이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘위로/위쪽으로’이지만, 스올과 대응하는 최대치의 대조를 한국어로 또렷하게 드러내기 위해 ‘하늘만큼 높게’로 옮겼습니다.
theological_decisions:
- issue: 스올-하늘의 극단 대비(merism) 처리
  chosen_reading: 그것을 스올만큼 깊게 하거나 하늘만큼 높게 하십시오.
  alternative_readings:
  - 그것을 스올만큼 깊게 하거나 위로 높게 하십시오.
  - 그것을 깊은 곳이나 높은 곳까지 이르게 하십시오.
  rationale: 본문은 요청받은 표징의 범위를 아무 제한 없이 열어 두는 극단 대비를 사용하므로, ‘스올’과 ‘하늘’의 대응을 살려 의미의 힘을 그대로 드러냈습니다.
  doctrine_reference: 이사야 7:11의 수사적 대구법/극단 대비
