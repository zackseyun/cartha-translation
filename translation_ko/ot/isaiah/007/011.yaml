  source_fidelity: 현 초안은 שְׁאָלָה를 ‘스올’로 해석하여 본문에 없는 고유명사를 도입합니다. 이 형태는 여기서 ‘구하십시오’라는 동사의 반복/강조와 관련된 것으로 이해하는 것이 일반적이며, 본문은 깊이와 높이의 양 극단을 제시합니다. 또한 לְמַעְלָה는 문자적으로 ‘위로/높이’이지 ‘하늘’은 아닙니다.
  naturalness: ‘당신을 위해 야훼 당신의 하나님께서 주시는’은 수식 관계가 불명료하여 야훼께서 표징을 주시는 주어처럼 읽힙니다. ‘야훼, 당신의 하나님께 표징 하나를 구하십시오’가 자연스럽고 원문의 요청 대상을 명확히 합니다. ‘깊은 곳에서든 위 높은 곳에서든’은 현대 표준어로 자연스럽게 양 극단을 표현합니다.
  terminology: יְהוָה는 원칙대로 ‘야훼’로 유지합니다. אוֹת는 예언 문맥에 적합한 ‘표징’으로 유지합니다. 본문에 명시되지 않은 ‘스올’ 및 ‘하늘’은 번문에서 제거하고, 필요시 각주에서 히브리어의 표현과 해석적 성격을 설명합니다.
