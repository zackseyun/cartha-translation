    issue: 본문의 ‘그가 그의 이름을’
    rationale: וְקָרָאת은 주어진 마소라 본문에서 여성 단수로 읽히므로, 남성 대명사 ‘그가’는 근거 없이 주어의 성을 변경합니다. 또한 ‘그의 이름’은 남성 주어와 결합되어 여인이 아이의 이름을 부르는 본문의 구문을 흐립니다.
  - severity: medium
    issue: 각주 c의 대안 번역이 불완전함
    rationale: ‘또는 네가 그의 이름을’은 동사와 이름을 빠뜨려 독자가 실제 대안 독법을 확인할 수 없습니다. ‘네가 그의 이름을 임마누엘이라 부를 것이다’로 완결해야 합니다.
