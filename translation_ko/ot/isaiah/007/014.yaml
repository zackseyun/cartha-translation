id: ISA.7.14
reference: Isaiah 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
  footnotes:
  - marker: a
    text: Or 'the virgin.' The Hebrew word here is עַלְמָה ('young woman'); the Greek Septuagint renders it with a word often understood as 'virgin,' and Matthew 1:23 cites the verse in that form.
    reason: alternative_reading
  - marker: b
    text: 'Traditional rendering: ''shall conceive and bear a son.'' The Hebrew more literally describes the woman as already pregnant and bearing.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you shall call his name,' reflected in some ancient versional traditions; Matthew 1:23 has 'they shall call his name.'
    reason: textual_variant
  - marker: d
    text: Immanuel means 'God with us.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 주님 자신이 너희에게 한 표징을 주실 것입니다. 보십시오, 그 젊은 여인이 임신하여 아들을 낳고 있으며, 그가 그의 이름을 임마누엘이라 부를 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처녀’. 여기의 히브리어 עַלְמָה는 ‘젊은 여인’을 뜻하며, 70인역은 흔히 ‘처녀’로 이해되는 말로 옮겼고 마태복음 1:23도 그 형태로 이 구절을 인용합니다.
    reason: alternative_reading
  - marker: b
    text: 전통적 번역은 ‘아들을 잉태하여 낳을 것이며’입니다. 그러나 히브리어는 더 문자적으로 여인이 이미 임신하여 아들을 낳고 있는 상태를 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네가 그의 이름을’, 일부 고대 역본 전승을 반영합니다. 마태복음 1:23에는 ‘그들이 그의 이름을’로 나옵니다.
    reason: textual_variant
  - marker: d
    text: 임마누엘은 ‘하나님이 우리와 함께 계시다’라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 문맥상 아하스의 거절에 대한 결과를 여는 담화 표지이므로, 현대 한국어에서 자연스럽고 격식을 유지하는 ‘그러므로’가 적절합니다.
- source_word: הָעַלְמָה
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여인
  alternatives_korean:
  - 그 처녀
  - 그 소녀
  lexicon: HALOT
  rationale: עַלְמָה는 본래 결혼 가능한 젊은 여인을 가리키며, 본문 자체만으로 ‘처녀’를 요구하지는 않으므로 주 본문은 ‘젊은 여인’으로 옮겼습니다.
- source_word: הָרָה וְיֹלֶדֶת
  english_pob_choice: is pregnant and is bearing
  chosen_korean: 임신하여 아들을 낳고 있으며
  alternatives_korean:
  - 잉태하여 아들을 낳을 것이며
  - 아들을 잉태하여 낳고 있으며
  lexicon: HALOT
  rationale: 히브리어는 현재 상태를 나타내는 서술과 분사 연속으로, 단순 미래보다 ‘임신하여 … 낳고 있으며’가 형태와 의미를 더 잘 반영합니다.
- source_word: וְקָרָאת שְׁמוֹ
  english_pob_choice: she will call his name
  chosen_korean: 그가 그의 이름을 …이라 부를 것입니다
  alternatives_korean:
  - 그녀가 그의 이름을 …이라 부를 것입니다
  - 그의 이름이 …이라 불릴 것입니다
  lexicon: HALOT
  rationale: 마소라 본문은 여성 단수로 읽히지만, 이 절의 주어·호칭 방식은 전승상 변이가 알려져 있으므로 주 본문은 자연스러운 한국어로 옮기되, 대안은 각주에서 보완하는 편이 안전합니다.
- source_word: עִמָּנוּ אֵל
  english_pob_choice: Immanuel
  chosen_korean: 임마누엘
  alternatives_korean:
  - 하나님이 우리와 함께 계시다
  - 임마누엘(하나님이 우리와 함께 계시다)
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지하고, 의미는 본문 밖에서 설명하는 것이 원문 인명을 보존하는 데 적절합니다.
theological_decisions:
- issue: הָעַלְמָה의 번역과 마태복음 인용 전통
  chosen_reading: 주 본문은 ‘젊은 여인’으로 두고, 전통적 기독교 읽기인 ‘처녀’는 각주로 보완합니다.
  alternative_readings:
  - 그 처녀
  - 그 젊은 처녀
  rationale: 히브리어 자체의 직접 의미를 우선하되, 70인역과 마태복음 1:23의 수용사를 지우지 않기 위해 번역과 전통을 분리해 제시합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: וְקָרָאת의 인칭/주어 변이
  chosen_reading: 본문은 ‘그가 그의 이름을 …이라 부를 것입니다’로 자연화했습니다.
  alternative_readings:
  - 그녀가 그의 이름을 …이라 부를 것입니다
  - 그의 이름이 …이라 불릴 것입니다
  - 너희가 그의 이름을 …이라 부를 것입니다
  rationale: 히브리어와 고대 역본 전승 사이의 주어 차이를 과도하게 한 가지로 고정하지 않고, 한국어 본문은 읽기 자연성을 우선하되 각주로 변이를 드러내는 것이 합당합니다.
  doctrine_reference: Translation philosophy §3
