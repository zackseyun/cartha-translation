  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: ko
  text: 다윗의 집에 전하여져 이르기를, “아람이 에브라임 위에 내려앉았습니다.” 하니, 그의 마음과 그의 백성의 마음이 바람 앞에 흔들리는 숲의 나무들처럼 흔들렸습니다.
  philosophy: formal
lexical_decisions:
- source_word: וַיֻּגַּד לְבֵית דָּוִד
  english_pob_choice: it was reported to the house of David
  chosen_korean: 다윗의 집에 전하여져
  alternatives_korean:
  - 다윗의 집에 알려져
  - 다윗 왕실에 보고되어
  lexicon: הגיד / report, tell
  rationale: 수동적 보고 동사를 살려, 단순한 ‘알려짐’보다 공식적으로 전달된 소식을 나타내되 본문이 요구하는 범위 안에서 간결하게 옮겼습니다.
- source_word: נָחָה אֲרָם עַל אֶפְרָיִם
  english_pob_choice: Aram has settled on Ephraim
  chosen_korean: “아람이 에브라임 위에 내려앉았습니다.”
  alternatives_korean:
  - 아람이 에브라임에 동맹을 맺었습니다.
  - 아람이 에브라임에 진을 쳤습니다.
  lexicon: נחה על / settle on, rest on
  rationale: EN POB의 수정된 ‘has settled on’을 따라, אַל/עַל의 공간적 압박감을 살리는 ‘위에 내려앉다’를 택했습니다. 전쟁 동맹의 의미를 과도하게 덧붙이지 않았습니다.
- source_word: וַיָּנַע לֵבָבוֹ ... כְּנוֹעַ עֲצֵי יַעַר
  english_pob_choice: his heart and the heart of his people shook, as the trees of the forest shake
  chosen_korean: 그의 마음과 그의 백성의 마음이 바람 앞에 흔들리는 숲의 나무들처럼 흔들렸습니다.
  alternatives_korean:
  - 그의 마음과 그의 백성의 마음이 숲의 나무들처럼 떨렸습니다.
  - 그와 그의 백성의 마음이 숲의 나무가 바람에 흔들리듯 흔들렸습니다.
  lexicon: נוע / shake, tremble; עֲצֵי יַעַר / trees of the forest
  rationale: 원문의 반복과 비유를 유지해 심리적 동요를 드러냈고, ‘바람 앞에’는 뒤의 ‘바람’(רוּחַ)과 연결되는 자연스러운 한국어 관용으로 넣었습니다.
theological_decisions:
- issue: ‘아람이 에브라임 위에 내려앉았다’의 의미 범위
  chosen_reading: 정치적·군사적 위압을 암시하지만, 본문 자체의 표현을 넘어 동맹 성립이나 침공 확정으로 단정하지 않았습니다.
  alternative_readings:
  - 아람이 에브라임과 동맹을 맺었다
  - 아람이 에브라임을 공격했다
  rationale: 히브리어 נָחָה עַל은 문자적으로 ‘위에 머물다/내려앉다’의 이미지를 주며, EN POB도 최신 본문 판단에 따라 ‘has settled on’을 채택했습니다. 그래서 해석을 과잉 구체화하지 않았습니다.
  doctrine_reference: 본문-우선 원칙; 문맥적 절제
