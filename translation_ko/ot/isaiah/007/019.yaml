  text: וּ/בָ֨אוּ וְ/נָח֤וּ כֻלָּ/ם֙ בְּ/נַחֲלֵ֣י הַ/בַּתּ֔וֹת וּ/בִ/נְקִיקֵ֖י הַ/סְּלָעִ֑ים וּ/בְ/כֹל֙ הַ/נַּ֣עֲצוּצִ֔ים וּ/בְ/כֹ֖ל הַ/נַּהֲלֹלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
  footnotes:
  - marker: a
    text: Or 'rest' for 'settle'; the verb can denote coming to rest or alighting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the steep ravines' reflects a difficult expression, traditionally rendered in various ways such as 'desolate valleys' or 'ravines of precipices.'
    reason: lexical_alternative
  - marker: c
    text: The final term is rare and uncertain; it may also mean 'watering places' or 'meadows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 와서 거친 골짜기들과 바위의 틈새들과 모든 가시덤불 속과 모든 물웅덩이들에 자리 잡을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자리 잡을 것입니다’는 כאן נוח의 문맥상 단순히 ‘쉴’ 뿐 아니라 ‘정착하다, 멈추어 앉다’의 뜻을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거친 골짜기들’은 히브리어의 난해한 표현을 뜻을 따라 옮긴 것으로, ‘절벽의 골짜기들’ 또는 ‘가파른 협곡들’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 히브리어는 드문 말로, ‘물웅덩이들’ 외에 ‘물 있는 곳들’이나 ‘샘터들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  english_pob_choice: they will come
  chosen_korean: 와서
  alternatives_korean:
  - 오고
  - 들어와
  lexicon: HALOT
  rationale: 예언적 미래 서술로서 단순한 이동 동작을 살려 ‘와서’로 옮겼습니다.
- source_word: וְנָחוּ
  english_pob_choice: settle
  chosen_korean: 자리 잡을 것입니다
  alternatives_korean:
  - 쉬게 될 것입니다
  - 머무를 것입니다
  - 안착할 것입니다
  lexicon: HALOT
  rationale: נוח의 ‘멈추어 안착하다’는 뜻을 살려, 단순한 휴식보다 점거·정착의 이미지를 드러냈습니다.
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  english_pob_choice: in the steep ravines
  chosen_korean: 거친 골짜기들
  alternatives_korean:
  - 가파른 협곡들
  - 급한 골짜기들
  - 절벽의 골짜기들
  lexicon: HALOT
  rationale: 난해한 표현이지만 문맥상 험준하고 깎인 지형을 가리키므로, 직역보다 한국어에서 자연스럽고 지형감을 주는 표현을 택했습니다.
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  english_pob_choice: in all the watering places
  chosen_korean: 모든 물웅덩이들
  alternatives_korean:
  - 모든 물 있는 곳들
  - 모든 샘터들
  - 모든 물가들
  lexicon: HALOT
  rationale: 희귀하고 불확실한 어휘라서, POB의 ‘watering places’ 취지를 따라 물이 고이거나 모이는 장소로 옮겼습니다.
theological_decisions:
- issue: 재난적 침투 이미지의 보존
  chosen_reading: 이 구절은 사람이나 군대가 험한 지형과 물가 곳곳에 ‘자리 잡는’ 장면을 그대로 살려, 심판의 확산 이미지를 약화시키지 않았습니다.
  alternative_readings:
  - 지리 묘사 중심으로 중립화
  - 상징성을 낮춘 완화 번역
  rationale: 문맥상 예언적 심판의 전개가 지리적 열거를 통해 강조되므로, 이미지의 밀도를 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 예언서의 심판 선언과 묘사 방식
