  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
  footnotes:
  - marker: a
    text: Or 'rest' for 'settle'; the verb can denote coming to rest or alighting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the steep ravines' reflects a difficult expression, traditionally rendered in various ways such as 'desolate valleys' or 'ravines of precipices.'
    reason: lexical_alternative
  - marker: c
    text: The final term is rare and uncertain; it may also mean 'watering places' or 'meadows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 와서 가파른 협곡들[b]과 바위 틈새들, 모든 가시덤불과 모든 물 있는 곳[c]에 자리 잡을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자리 잡을 것입니다’는 히브리어 נוח가 이 문맥에서 단순히 ‘쉬다’뿐 아니라 ‘머물다’ 또는 ‘내려앉다’라는 뜻도 가질 수 있음을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가파른 협곡들’은 히브리어의 난해한 표현을 뜻에 따라 옮긴 것입니다. ‘황량한 골짜기들’ 또는 ‘절벽의 골짜기들’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 히브리어 단어는 드문 말이며 뜻이 확실하지 않습니다. ‘물 있는 곳들’ 또는 ‘목초지들’로도 옮길 수 있습니다.
    reason: lexical_alternative
