base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
  footnotes:
  - marker: a
    text: Or, 'days such as have not come since the day Ephraim departed from Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''Your father''s house'' can refer more specifically to your ancestral or royal house.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 당신과 당신의 백성과 당신 아버지의 집[b]에 에브라임이 유다에게서 떠난 날 이후로 한 번도 없었던 날들[a]을 가져오실 것입니다. 곧 앗수르 왕을 가져오실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘에브라임이 유다에게서 떠난 날 이후로 오지 않았던 날들’입니다. 이는 그때 이후로 전례가 없었던 날들이라는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘당신 아버지의 집’은 문맥상 당신의 가문 또는 왕실을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 하나님의 고유명을 가리키는 יהוה는 전통적 대체어보다 음역인 ‘야훼’로 옮겨, 본문의 고유명성과 예언적 직접성을 보존했습니다.
- source_word: יָבִיא
  english_pob_choice: will bring
  chosen_korean: 가져오실 것입니다
  alternatives_korean:
  - 데려오실 것입니다
  - 불러오실 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 한국어에서 자연스럽게 살리기 위해 ‘가져오다’로 옮겼고, 심판이 임하게 하는 주어적 힘을 유지했습니다.
- source_word: בֵּית אָבִיךָ
  english_pob_choice: your father's house
  chosen_korean: 당신 아버지의 집
  alternatives_korean:
  - 당신의 조상 집
  - 당신의 왕실
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 본문이 말하는 가문/왕실의 범위를 열어 두면서도, 원문 표현의 질감을 유지했습니다.
- source_word: אֲשֶׁר לֹא בָאוּ
  english_pob_choice: days unlike any that have not come
  chosen_korean: 아직 오지 않은 날들
  alternatives_korean:
  - 오지 않은 날들
  - 그와 같은 날들
  lexicon: HALOT
  rationale: לֹא בָאוּ의 부정 과거를 한국어에서 간결하게 살려 ‘아직 오지 않은’으로 옮겼으며, ‘전에 없던 날들’이라는 의미를 유지했습니다.
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  english_pob_choice: namely, the king of Assyria
  chosen_korean: 곧 앗수르 왕입니다
  alternatives_korean:
  - 즉 앗수르 왕입니다
  - 바로 앗수르 왕입니다
  lexicon: HALOT
  rationale: 문말의 אֵת은 여기서 다음 명사를 설명하는 apposition으로 기능하므로, 한국어에서는 ‘곧’으로 풀어 심판의 실체가 앗수르 왕임을 직접 드러냈습니다.
theological_decisions:
- issue: 부정문과 심판의 도구를 함께 보존하는 방식
  chosen_reading: ‘아직 오지 않은 날들—곧 앗수르 왕’으로 옮겨, 전례 없는 재앙이 야훼께로부터 오며 그 구체적 형식이 앗수르 왕이라는 점을 함께 드러냈습니다.
  alternative_readings:
  - ‘오지 않은 날들’만 두고 앗수르 왕은 독립 절로 처리
  - ‘전에 없던 날들’로 완전히 의역
  rationale: 히브리어의 부정과 마지막 apposition을 분리하지 않고 연결해, 심판 선언의 예언적 긴장과 문법적 종속관계를 보존했습니다.
  doctrine_reference: 예언 본문의 심판 선언과 섭리적 도구성
- issue: ‘당신의 아버지의 집’의 범위
  chosen_reading: 본문의 가문/왕실 표현을 ‘당신 아버지의 집’으로 유지했습니다.
  alternative_readings:
  - ‘당신의 왕실’
  - ‘당신의 조상 집’
  rationale: 원문의 관용구를 과도하게 특정하지 않아, 개인 아하스와 그 왕가/가문에 대한 예언의 범위를 독자가 본문에서 직접 읽도록 했습니다.
  doctrine_reference: 역사서·예언서의 가문 표지 표현
