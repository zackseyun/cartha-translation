id: ISA.7.16
reference: Isaiah 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
  footnotes:
  - marker: a
    text: Or 'will be abandoned' or 'will be deserted.' The Hebrew passive can denote the land being left empty or forsaken.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose two kings you loathe because of fear' / 'before whose two kings you are filled with dread.' The Hebrew verb carries a sense of revulsion that in this context likely reflects dread of the two kings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아이가 악을 버리고 선을 택할 줄 알기 전에, 네가 두려워하는 그 두 왕 앞의 그 땅은 버려질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버려질 것입니다’는 ‘버림을 받게 될 것입니다’ 또는 ‘황폐해질 것입니다’로도 옮길 수 있습니다. 히브리어 수동형은 땅이 비게 되거나 버려지는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워하는’은 히브리어 동사가 지닌 혐오와 공포의 겹친 의미를 간명하게 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  english_pob_choice: before
  chosen_korean: ~하기 전에
  alternatives_korean:
  - ~하기 앞서
  - ~하기도 전에
  lexicon: HALOT
  rationale: 시간 선행을 나타내는 ברור한 전치어로, 현대 한국어에서는 동사 앞 연결형인 ‘~하기 전에’가 가장 자연스럽습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 소년
  - 그 아이
  lexicon: HALOT
  rationale: 문맥상 아직 도덕적 분별을 배우지 못한 미성숙한 존재를 가리키므로 ‘소년’보다 더 넓고 자연스러운 ‘아이’가 적절합니다.
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  english_pob_choice: knows to refuse ... and choose
  chosen_korean: 악을 버리고 선을 택할 줄 알기
  alternatives_korean:
  - 악을 거절하고 선을 택할 줄 알기
  - 악을 싫어하고 선을 고를 줄 알기
  lexicon: HALOT
  rationale: 히브리어는 도덕적 분별 능력의 획득을 말하므로 ‘알다’의 결과적 용법을 살려 ‘~할 줄 알기’로 옮겼습니다.
- source_word: תֵּעָזֵב הָאֲדָמָה
  english_pob_choice: the land ... will be forsaken
  chosen_korean: 그 땅은 버려질 것입니다
  alternatives_korean:
  - 그 땅은 떠나 버려질 것입니다
  - 그 땅은 황폐해질 것입니다
  lexicon: HALOT
  rationale: נפעל형 עזב는 버려짐/방치됨의 수동을 나타내며, 예언적 문맥에서 ‘버려지다’가 원문을 가장 직접적으로 반영합니다.
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי שְׁנֵי מְלָכֶיהָ
  english_pob_choice: before whose two kings you dread
  chosen_korean: 네가 두려워하는 그 두 왕 앞의
  alternatives_korean:
  - 네가 혐오와 두려움으로 꺼리는 그 두 왕 앞의
  - 네가 두려워서 싫어하는 그 두 왕 앞의
  lexicon: HALOT
  rationale: קוץ는 혐오와 공포가 겹친 뉘앙스가 있으나 여기서는 정치적 위협 앞의 두려움이 핵심이므로 ‘두려워하는’으로 옮기되, מִפְּנֵי의 ‘앞/때문에’ 관계를 살려 재배열했습니다.
theological_decisions:
- issue: ‘그 아이’의 정체를 특정할지 여부
  chosen_reading: 본문의 일반 명사성을 유지해 특정 인물로 단정하지 않았습니다.
  alternative_readings:
  - 마헬살랄하스바스에 대한 근접 표지
  - 이사야 7:14의 임마누엘과의 직접 연결
  rationale: 문장 자체는 הַנַּעַר라고만 말하므로, 논쟁적인 동일시를 번역문에 주입하지 않고 해석의 긴장을 보존하는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 번역은 해석 논쟁을 결정하지 않고 본문이 허용하는 범위 안에 머뭅니다.
