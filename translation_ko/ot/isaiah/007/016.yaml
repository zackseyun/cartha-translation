  source_fidelity: 수정 전 문안의 ‘네가 두려워하는 그 두 왕 앞의 그 땅’은 מִפְּנֵי שְׁנֵי מְלָכֶיהָ가 ‘땅’의 두 왕과 관련된 이유/위협의 관계를 나타내는 점을 어색하게 뒤바꾸어, ‘두 왕 앞의 땅’이라는 다른 의미처럼 들립니다. ‘그 두 왕 때문에’로 옮기면 원문의 관계와 문맥상 두려움을 자연스럽게 보존합니다. מָאֹס는 여기서 ‘거절하다’가 ‘버리다’보다 직접적입니다.
