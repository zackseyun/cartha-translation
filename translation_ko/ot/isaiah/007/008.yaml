  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י רֹ֤אשׁ אֲרָם֙ דַּמֶּ֔שֶׂק וְ/רֹ֥אשׁ דַּמֶּ֖שֶׂק רְצִ֑ין וּ/בְ/ע֗וֹד שִׁשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה יֵחַ֥ת אֶפְרַ֖יִם מֵ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
  footnotes:
  - marker: a
    text: Or, 'Ephraim will be shattered so as not to be a people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 아람의 머리가 다마스쿠스이고, 다마스쿠스의 머리가 르신이기 때문입니다. 그리고 육십오 년 안에 에브라임은 더 이상 백성이 되지 못할 만큼 부서질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브라임은 더 이상 백성이 되지 못하도록 부서질 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: head
  chosen_korean: 머리
  alternatives_korean:
  - 수도
  - 우두머리
  lexicon: HALOT
  rationale: 본문의 반복 구조를 살리기 위해 직역에 가까운 ‘머리’를 택했습니다. ‘수도’는 첫 절의 도시 의미는 살리지만 둘째 절의 인물을 가리키는 대응 구조를 약화합니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 후대의 정치지리 용어인 ‘시리아’보다 히브리어 고유명사 ‘아람’을 그대로 옮겨 원문 감각을 보존했습니다.
- source_word: יֵחַת
  english_pob_choice: will be shattered
  chosen_korean: 부서질 것입니다
  alternatives_korean:
  - 산산이 부서질 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: 국가적 붕괴를 가리키는 강한 의미를 살리되, 한국어 문맥에서 과도하게 해석적인 표현은 피했습니다.
- source_word: מֵעָם
  english_pob_choice: from being a people
  chosen_korean: 더 이상 백성이 되지 못할 만큼
  alternatives_korean:
  - 백성이 아닌 존재가 되도록
  - 백성에서 끊어질
  lexicon: HALOT
  rationale: ‘~로부터’의 분리를 한국어의 결과 구문으로 자연스럽게 풀어, 민족적 지위 상실을 드러냈습니다.
theological_decisions:
- issue: 에브라임의 종말 진술의 강도
  chosen_reading: ‘백성이 되지 못할 만큼’으로 옮겨, 단순한 패배가 아니라 민족적 실체의 소멸을 나타내게 했습니다.
  alternative_readings:
  - ‘백성이 아니게 될’
  - ‘백성에서 끊어질’
  rationale: 원문의 מֵעָם은 공동체 정체성의 상실을 나타내므로, 정치적 패배보다 더 강한 예언적 심판 의미를 유지했습니다.
  doctrine_reference: 예언문 맥락에서의 언약적 심판과 민족적 해체
