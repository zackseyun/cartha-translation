  to: 이는 아람의 머리가 다마스쿠스이고, 다마스쿠스의 머리가 르신이기 때문입니다. 또 육십오 년 안에 에브라임은 한 백성으로 더는 존재하지 못할 정도로 부서질 것입니다.[a]
