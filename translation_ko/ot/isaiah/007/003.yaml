base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
  footnotes:
  - marker: a
    text: Shear-jashub means “A remnant shall return.”
    reason: lexical_alternative
  - marker: b
    text: Or “the fuller’s field.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 이사야에게 말씀하셨습니다. “너와 네 아들 스알야숩[a]은 함께 지금 나가, 윗못 수로 끝, 세탁공[b]의 밭으로 가는 길에서 아하스를 만나십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스알야숩은 “남은 자가 돌아오리라”는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “풀러의 밭”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문은 하나님의 고유명사 יְהוָה를 사용하므로, POB의 원칙에 따라 한국어에서도 관용적 호칭이 아닌 고유명사 ‘야훼’를 유지했습니다.
- source_word: צֵא נָא
  english_pob_choice: Go out now
  chosen_korean: 지금 나가서
  alternatives_korean:
  - 나가십시오
  - 부디 나가서
  lexicon: WLC
  rationale: 명령형 צֵא에 나아가라는 긴박감과 נָא의 완곡·촉구 기능을 함께 살려, 현대 한국어에서 자연스러운 ‘지금 나가서’로 옮겼습니다.
- source_word: שְׁאָר יָשׁוּב
  english_pob_choice: Shear-jashub
  chosen_korean: 스알야숩
  alternatives_korean:
  - 스알-야숩
  - 남은 자가 돌아오리라
  lexicon: WLC
  rationale: 인명은 음역을 유지해야 하므로 본문에서는 고유명사로 옮기고, 그 의미는 본절 주해상 중요하지만 여기서는 본문을 과잉해석하지 않았습니다.
- source_word: תְּעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  english_pob_choice: the conduit of the upper pool
  chosen_korean: 윗못의 수로 끝
  alternatives_korean:
  - 윗못의 도랑 끝
  - 상류 못의 수로 끝
  lexicon: WLC
  rationale: תְּעָלָה는 인공 수로를 가리키므로 ‘수로’로 옮기고, קְצֵה는 장소 표지로서 ‘끝’으로 처리해 지형 설명을 살렸습니다.
- source_word: שְׂדֵה כוֹבֵס
  english_pob_choice: the launderer’s field
  chosen_korean: 세탁공의 밭
  alternatives_korean:
  - 세탁자의 밭
  - 풀러의 밭
  lexicon: WLC
  rationale: כּוֹבֵס는 옷을 씻는 일을 하는 사람을 뜻하므로, 현대 독자가 직업성을 바로 이해할 수 있게 ‘세탁공’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 원문 고유명사를 살려 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 단순 호칭이 아니라 언약적 하나님의 이름을 직접 제시하므로, 대체 칭호로 바꾸지 않고 이름 자체를 드러내는 번역이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
