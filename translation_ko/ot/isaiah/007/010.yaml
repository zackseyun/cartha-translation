    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  english_pob_choice: continued
  chosen_korean: 다시 말씀하여 이르셨습니다
  alternatives_korean:
  - 계속 말씀하셨습니다
  - 말씀을 이어가셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 '더하여 말하다'는 여기서 말씀이 반복·계속됨을 뜻하므로, 한국어에서는 '다시'로 재진술의 의미를 살리고 동작 전체를 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה를 신학적 호칭으로 대체하지 않고, POB 기준에 따라 음역형 '야훼'로 옮겼습니다.
- source_word: אֶל אָחָז
  english_pob_choice: to Ahaz
  chosen_korean: 아하스에게
  alternatives_korean:
  - 아하스에게로
  - 아하스를 향하여
  lexicon: HALOT
  rationale: אֶל은 대화의 수신자를 표시하므로 한국어에서는 여격 조사 '-에게'가 가장 자연스럽고 직접적입니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 말씀하시며
  lexicon: HALOT
  rationale: 히브리어 روایت 도입 표지를 한국어 성서문체에 맞게 목적절 도입형으로 처리해, 뒤따를 인용을 예고하는 기능을 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
