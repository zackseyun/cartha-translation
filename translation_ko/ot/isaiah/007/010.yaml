  rationale: 이 절은 Tetragrammaton을 직접 사용하므로, 본문 고유성을 보존하기 위해 대체 칭호가 아닌 고유명 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
