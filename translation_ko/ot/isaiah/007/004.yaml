base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
  footnotes:
  - marker: a
    text: Literally, 'two tails of these smoking firebrands.' The expression pictures Rezin and the son of Remaliah as the burnt ends of sticks that still smoke but are close to going out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 이렇게 말씀하십시오. “조심하고 침착하십시오. 두려워하지 말며, 이 두 연기 나는 불붙은 막대기의 타다 남은 끝부분, 곧 르신과 아람과 르말랴의 아들의 타오르는 분노 때문에 마음이 약해지게 하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 연기 나는 불붙은 막대기들의 두 꼬리’라는 뜻입니다. 여기서는 르신과 르말랴의 아들을 거의 다 타서 꺼져 가는 막대기의 끝에 비유합니다.
    reason: lexical_alternative
