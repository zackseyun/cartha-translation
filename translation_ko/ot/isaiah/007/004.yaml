  source_fidelity: 수정이 필요합니다. בָּחֳרִי אַף는 뒤따르는 ‘르신과 아람과 르말랴의 아들’ 전체와 연결되어야 하는데, 초안의 ‘르신의 타오르는 분노와 아람과 르말랴의 아들’은 분노의 주체를 르신에게만 문법적으로 귀속시키고 나머지 병렬 성분을 어색하게 남깁니다. 또한 אוּד는 일반적인 ‘장작토막’보다 불에 타는 막대기/불쏘시개를 가리키며, זַנְבוֹת의 ‘끝부분’ 이미지를 본문에 드러내는 편이 더 충실합니다.
  naturalness: ‘잠잠히 있으십시오’는 가능하지만 현대 한국어에서는 침묵하라는 뜻이 두드러집니다. 위협 앞에서 동요하지 말라는 문맥에는 ‘침착하십시오’가 자연스럽습니다. ‘마음이 약해지지 않도록 하십시오’도 이해되나 ‘마음이 약해지게 하지 마십시오’가 원문의 금지 권면을 더 직접적이고 자연스럽게 전달합니다.
