  lexicon: HALOT
  rationale: 단순한 침묵이 아니라 전쟁 공포 앞에서 흔들리지 않는 태도를 가리키므로, ‘잠잠히’로 안정과 진정의 뉘앙스를 살렸습니다.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים
  english_pob_choice: these two smoldering stubs of firebrands
  chosen_korean: 이 두 타다 남은 연기 나는 장작토막
  alternatives_korean:
  - 이 두 연기 나는 불붙은 막대기 끝
  - 이 두 타고 남은 연기 나는 불쏘시개
