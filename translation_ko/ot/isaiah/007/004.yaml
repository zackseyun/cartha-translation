base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
  footnotes:
  - marker: a
    text: Literally, 'two tails of these smoking firebrands.' The expression pictures Rezin and the son of Remaliah as the burnt ends of sticks that still smoke but are close to going out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 이렇게 말씀하십시오. 「조심하고 잠잠히 있으십시오. 두려워하지 말고, 이 두 타다 남은 연기 나는 장작토막—곧 르신의 타오르는 분노와 아람과 르말랴의 아들 때문에 당신의 마음이 약해지지 않도록 하십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘연기 나는 불붙은 막대기의 두 꼬리’라는 뜻입니다. 여기서는 르신과 르말랴의 아들을 거의 다 타서 꺼져 가는 막대기 끝에 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֵר
  english_pob_choice: Be careful
  chosen_korean: 조심하고
  alternatives_korean:
  - 주의하고
  - 삼가고
  - 경계하고
  lexicon: HALOT
  rationale: 예언적 권면의 경고성을 살리면서 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: וְהַשְׁקֵט
  english_pob_choice: stay calm
  chosen_korean: 잠잠히 있으십시오
  alternatives_korean:
  - 침착하십시오
  - 가만히 있으십시오
  - 고요히 있으십시오
  lexicon: HALOT
  rationale: 단순한 침묵이 아니라 전쟁 공포 앞에서 흔들리지 않는 태도를 가리키므로, ‘잠잠히’로 안정과 진정의 뉘앙스를 살렸습니다.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים
  english_pob_choice: these two smoldering stubs of firebrands
  chosen_korean: 이 두 타다 남은 연기 나는 장작토막
  alternatives_korean:
  - 이 두 연기 나는 불붙은 막대기 끝
  - 이 두 타고 남은 연기 나는 불쏘시개
  - 이 두 훈연하는 장작의 꼬리
  lexicon: HALOT
  rationale: ‘지푸라기 같은 위협’으로 완화하지 않고, 거의 꺼져 가는 불붙은 막대의 조롱 섞인 이미지를 한국어로 유지했습니다.
- source_word: בָּחֳרִי אַף
  english_pob_choice: because of the burning anger
  chosen_korean: 르신의 타오르는 분노와 아람과
  alternatives_korean:
  - 르신과 아람의 격렬한 분노 때문에
  - 르신과 아람의 불타는 분노 때문에
  lexicon: HALOT
  rationale: 히브리어의 ‘불붙은 분노’ 이미지를 살리되, 문맥상 그 분노의 주체가 르신과 아람임을 한국어 문장 속에서 분명히 했습니다.
- source_word: וּבֶן רְמַלְיָהוּ
  english_pob_choice: the son of Remaliah
  chosen_korean: 르말랴의 아들
  alternatives_korean:
  - 르말랴의 아들 곧 베가
  - 베가
  lexicon: HALOT
  rationale: 본문의 경멸적 호칭을 보존하기 위해 고유명 ‘베가’를 풀지 않고 ‘르말랴의 아들’을 유지했습니다.
theological_decisions:
- issue: 예언적 조롱의 비유를 직설적 설명으로 바꿀지 여부
  chosen_reading: ‘타다 남은 연기 나는 장작토막’이라는 비유를 본문에 유지했습니다.
  alternative_readings:
  - ‘거의 꺼진 위협’처럼 풀어 옮길 수 있음
  rationale: 본문의 신학적·수사적 힘은 유다를 위협하는 세력이 실제로는 이미 쇠한 불씨라는 하나님의 평가에 있으므로, 그 이미지를 풀어 없애지 않았습니다.
  doctrine_reference: 예언 문학의 상징성과 원문 우선 원칙
