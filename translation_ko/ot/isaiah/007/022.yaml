  to: 그리고 그때에는 젖이 많이 나므로 그가 응유[a]를 먹게 될 것입니다. 그 땅 가운데에 남아 있는 모든 사람이 응유와 꿀을 먹게 될 것입니다.
  rationale: 히브리어의 미래 도입 표현 וְהָיָה를 ‘그리고 그때에는’으로 보완하고, 젖이 풍성하게 생산되는 데서 비롯되는 결과를 ‘젖이 많이 나므로’로 명료하게 옮겼습니다. חֶמְאָה의 의미 범위는 ‘응유’와 각주로 유지했으며, 두 번째 절의 집합적 주어는 자연스러운 한국어 문장으로 다듬었습니다.
