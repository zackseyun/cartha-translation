id: ISA.7.22
reference: Isaiah 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה מֵ/רֹ֛ב עֲשׂ֥וֹת חָלָ֖ב יֹאכַ֣ל חֶמְאָ֑ה כִּֽי חֶמְאָ֤ה וּ/דְבַשׁ֙ יֹאכֵ֔ל כָּל הַ/נּוֹתָ֖ר בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
  footnotes:
  - marker: a
    text: Or 'butter and honey.' The Hebrew חֶמְאָה may refer more broadly to curdled or thickened milk products rather than specifically modern butter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 젖이 넉넉하기 때문에 그는 응유를 먹을 것입니다. 땅 한가운데에 남아 있는 사람은 모두 응유와 꿀을 먹을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶמְאָה는 현대 한국어의 ‘버터’보다 응유나 걸쭉하게 굳은 젖 제품을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: 그리고 …일 것입니다
  alternatives_korean:
  - 그리고 …하게 될 것입니다
  - 그리고 …일이 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어 भविष्य/서술 공식의 전개를 자연스러운 예언적 미래로 옮기되, 한국어에서는 장황한 관용구를 줄여 문맥의 흐름을 살렸습니다.
- source_word: מֵרֹב עֲשׂוֹת חָלָב
  english_pob_choice: because of the abundance of milk he gives
  chosen_korean: 젖이 넉넉하기 때문에
  alternatives_korean:
  - 젖이 많이 나기 때문에
  - 젖이 풍족하기 때문에
  lexicon: HALOT
  rationale: 원문은 ‘젖의 풍성함’이 원인이 되는 구문이므로, 영어 POB의 해석을 따라 원인 관계를 분명히 하면서도 한국어에서 자연스럽게 옮겼습니다.
- source_word: חֶמְאָה
  english_pob_choice: curds
  chosen_korean: 응유
  alternatives_korean:
  - 버터
  - 크림
  - 버터 같은 유제품
  lexicon: HALOT
  rationale: 현대의 ‘버터’보다 목축·유목 맥락에 맞는 굳어진 젖 제품의 의미를 살리기 위해 ‘응유’를 택했습니다.
- source_word: חֶמְאָה וּדְבַשׁ
  english_pob_choice: curds and honey
  chosen_korean: 응유와 꿀
  alternatives_korean:
  - 버터와 꿀
  - 응유와 꿀
  lexicon: HALOT
  rationale: 반복되는 병렬 표현을 그대로 유지해, 식량의 풍요와 의존의 이미지를 보존했습니다.
- source_word: כָּל הַנּוֹתָר בְּקֶרֶב הָאָרֶץ
  english_pob_choice: everyone left in the midst of the land
  chosen_korean: 땅 한가운데에 남아 있는 사람은 모두
  alternatives_korean:
  - 그 땅 가운데 남은 자는 모두
  - 땅에 남아 있는 모든 사람은
  lexicon: HALOT
  rationale: 사람을 가리키는 실질적 의미를 분명히 하되, בקרב의 공간적 강조를 ‘한가운데’로 살렸습니다.
theological_decisions:
- issue: 전쟁과 황폐 이후의 생존 식량 이미지
  chosen_reading: ‘응유와 꿀’은 번영의 일반론이 아니라, 남은 자가 척박한 땅에서 최소한의 생존 식량을 먹게 된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 풍요로운 젖과 꿀의 땅을 가리키는 상징으로 읽기
  - 단순한 식생활의 묘사로만 약화시키기
  rationale: 문맥상 심판 뒤의 황폐와 남은 자를 말하므로, 풍요의 상징을 보존하되 실제 생존 식량의 역설적 뉘앙스를 유지해야 합니다.
  doctrine_reference: 이사야 7장 문맥의 심판-남은 자 주제
