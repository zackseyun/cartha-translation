  text: 에브라임의 머리는 사마리아이고, 사마리아의 머리는 레말랴의 아들입니다. 여러분이 믿지 않으시면[a][b], 정녕 굳게 서지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
