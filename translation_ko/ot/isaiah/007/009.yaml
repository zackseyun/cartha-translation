theological_decisions:
- issue: אמן 말장난의 한국어 재현
  chosen_reading: 믿지 않으시면 … 확립되지 못할 것입니다
  alternative_readings:
  - 믿지 않으시면 … 굳게 서지 못할 것입니다
  - 믿지 않으시면 … 신뢰할 수 없게 될 것입니다
  rationale: 예언적 경고의 핵심은 믿음의 결여가 공동체의 안정 상실로 이어진다는 점입니다. ‘확립되다’는 문어적이지만 원문의 어근 연결을 드러내며, 지나친 교리화 없이 경고의 의미를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
