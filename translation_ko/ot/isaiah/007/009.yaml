  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
  footnotes:
  - marker: a
    text: 'Hebrew wordplay: the two verbs come from the same root (אמן), linking ''believe/trust'' with ''be established/stand firm.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'If you do not trust, you will not stand firm.'
    reason: alternative_reading
translation:
  language: ko
  text: 에브라임의 머리는 사마리아[a]이고, 사마리아의 머리는 레말랴의 아들입니다. 여러분이 믿지 않으시면[b], 정녕 확립되지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 말장난: 두 동사는 같은 어근(אמן)에서 나와 ‘믿다/신뢰하다’와 ‘확립되다/굳게 서다’를 연결합니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분이 신뢰하지 않으시면, 여러분은 굳게 서지 못할 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: head
  chosen_korean: 머리
  alternatives_korean:
  - 지도자
  - 수도
  lexicon: HALOT
  rationale: 히브리어의 비유적·정치적 대응어를 살려 ‘머리’로 옮겼습니다. 두 절의 평행 구조를 유지하면서, 뒤 절에서 인물에게도 같은 표현을 적용할 수 있습니다.
- source_word: שֹׁמְרוֹן
  english_pob_choice: Samaria
  chosen_korean: 사마리아
  alternatives_korean:
  - 사마리아 성
  - 사마리아 도성
  lexicon: HALOT
  rationale: 지명 고유명사로 처리하되, 본문이 에브라임의 중심지라는 의미를 지나치게 해설하지 않고 그대로 보존했습니다.
- source_word: בֶּן רְמַלְיָהוּ
  english_pob_choice: the son of Remaliah
  chosen_korean: 레말랴의 아들
  alternatives_korean:
  - 레말랴의 아들인 사람
  - 베가
  lexicon: HALOT
  rationale: 히브리어의 족보적 호칭을 직역해, 개인 이름 대신 계보 호칭을 쓰는 수사적 효과를 살렸습니다.
- source_word: תַאֲמִינוּ / תֵאָמֵנוּ
  english_pob_choice: believe / be established
  chosen_korean: 믿지 않으시면 / 확립되지 못할 것입니다
  alternatives_korean:
  - 신뢰하지 않으시면 / 굳게 서지 못할 것입니다
  - 믿지 않으시면 / 서지 못할 것입니다
  lexicon: HALOT
  rationale: 같은 어근 אמן의 말장난을 한국어에서 ‘믿다’와 ‘확립되다’로 대응시켜, 신뢰와 견고함 사이의 연결을 유지했습니다.
theological_decisions:
- issue: אמן 말장난의 한국어 재현
  chosen_reading: 믿지 않으시면 … 확립되지 못할 것입니다
  alternative_readings:
  - 믿지 않으시면 … 굳게 서지 못할 것입니다
  - 믿지 않으시면 … 신뢰할 수 없게 될 것입니다
  rationale: 예언적 경고의 핵심은 믿음의 결여가 공동체의 안정 상실로 이어진다는 점입니다. ‘확립되다’는 문어적이지만 원문의 어근 연결을 드러내며, 지나친 교리화 없이 경고의 의미를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
