review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘부르십니다’는 יִשְׁרֹק의 날카로운 소리, 곧 휘파람으로 신호하여 소집하는 이미지를 소실합니다. 또한 예언적 미래형은 ‘부르실 것입니다’ 등으로 드러내는 것이 적절합니다. 수정문은 휘파람의 이미지를 보존하면서 파리와 벌의 비유적 정체를 해설적으로 확정하지 않습니다.
  naturalness: ‘…을 향해 휘파람을 부실 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 두 대상을 병렬로 연결해 히브리어의 구조를 간결하게 전달합니다. ‘이집트 물줄기들의 먼 끝’은 복수 יְאֹרֵי와 קְצֵה의 원격성을 자연스럽게 반영합니다.
  terminology: ‘야훼’는 프로젝트의 YHWH 표기 원칙에 맞습니다. ‘앗수르’와 ‘이집트’는 통용되는 성서 지명 표기이며, ‘파리’와 ‘벌’은 원문의 단수 표상과 은유를 유지합니다.
  issues:
  - severity: medium
    issue: יִשְׁרֹק를 ‘부르십니다’로 번역함
    rationale: 이 표현은 소집의 결과만 전달하고, 원문의 특징적인 휘파람/날카로운 소리의 행위를 삭제합니다. 본문에 ‘휘파람을 부실 것입니다’를 사용하고, 필요하면 각주에서 ‘날카로운 소리로 부르다’라는 기능적 뜻을 제시하는 것이 원문 충실성과 자연성을 함께 충족합니다.
  - severity: low
    issue: 미래 예언 장면의 시제가 현재형 ‘부르십니다’로 되어 있음
    rationale: יִשְׁרֹק는 이 문맥에서 미래의 예언적 행위를 가리킵니다. 한국어에서는 ‘부실 것입니다’가 이를 분명하고 격식 있게 나타냅니다.
  revised_text: 그날에 야훼께서는 이집트 물줄기들의 먼 끝에 있는 파리와 앗수르 땅에 있는 벌을 향해 휘파람을 부실 것입니다[a].
  revised_footnotes:
  - marker: a
    text: 또는 “날카로운 소리로 부르실 것입니다.” 히브리어 동사는 소집하거나 신호하기 위해 날카로운 소리를 내는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이집트 물줄기들’은 나일강의 여러 지류나 수로를 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 원문의 휘파람으로 소집하는 이미지를 본문에서 보존하고, 예언적 미래 시제를 반영했습니다. 파리와 벌을 각각 이집트나 앗수르의 세력이라고 본문에서 단정하지 않아 비유의 긴장을 유지했습니다. 문화적 보충은 각주로 제공하되 본문 의미를 바꾸지 않았습니다.
