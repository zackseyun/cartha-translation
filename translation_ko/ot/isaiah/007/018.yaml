id: ISA.7.18
reference: Isaiah 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
  footnotes:
  - marker: a
    text: Or 'will hiss for.' The Hebrew verb refers to making a sharp sound to summon or signal.
    reason: lexical_alternative
  - marker: b
    text: '''Streams of Egypt'' may refer specifically to the Nile branches or canals of Egypt.'
    reason: cultural_note
translation:
  language: ko
  text: 그날에 야훼께서 이집트의 강들 끝에 있는 파리에게, 그리고 앗수르 땅에 있는 벌에게 부르십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언문맥의 관용적 시간표현을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: יִשְׁרֹק
  english_pob_choice: will whistle for
  chosen_korean: 부르십니다
  alternatives_korean:
  - 휘파람을 부십니다
  - 신호하십니다
  - 불러 모으십니다
  lexicon: HALOT
  rationale: 직역된 ‘휘파람을 불다’는 한국어에서 어색하므로, 본문의 ‘소리로 소집하다/신호하다’는 기능을 살려 짧고 자연한 동사로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 대체 칭호로 희석하지 않았습니다.
- source_word: יְאֹרֵי מִצְרָיִם
  english_pob_choice: the streams of Egypt
  chosen_korean: 이집트의 강들
  alternatives_korean:
  - 이집트의 개울들
  - 이집트의 나일 물줄기들
  - 이집트의 운하들
  lexicon: HALOT
  rationale: יְאֹרִים은 이집트 문맥에서 나일의 수로/강줄기를 가리키므로, 과도하게 구체화하지 않으면서도 복수의 물줄기라는 이미지를 살렸습니다.
- source_word: אֶרֶץ אַשּׁוּר
  english_pob_choice: the land of Assyria
  chosen_korean: 앗수르 땅
  alternatives_korean:
  - 앗수르의 땅
  - 앗수르 지역
  lexicon: HALOT
  rationale: ‘땅’의 지리적 표현을 보존하되 한국어 어순에 맞게 간결하게 정리했습니다.
theological_decisions:
- issue: יִשְׁרֹק의 은유적 소집 표현
  chosen_reading: ‘부르십니다’로 옮겨, 본문의 소집/신호 의미를 살리되 대상을 본문 안에서 해설적으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘휘파람을 부십니다’로 더 문자적으로 옮김
  - ‘신호하십니다’로 더 기능적으로 옮김
  rationale: 히브리어 동사는 날카로운 소리로 불러 모으는 행위를 가리키며, 본문은 그 소집 행위 자체를 이미지로 제시합니다. 한국어에서는 문자성보다 의미 기능을 우선해 자연스럽게 전달하되, 은유는 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 파리와 벌의 표상
  chosen_reading: 파리와 벌을 그대로 유지해 정치·군사적 비유로서의 긴장을 보존했습니다.
  alternative_readings:
  - 이집트와 앗수르를 본문에 직접 밝혀 풀어 씀
  - 비유를 주석적으로 설명해 참조 대상을 명시함
  rationale: 원문은 해석을 즉시 풀어 주기보다 이미지로 심판의 소집을 제시하므로, 본문에서 그 상징성을 유지하는 편이 원문의 힘을 살립니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
