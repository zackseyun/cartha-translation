lexical_decisions:
- source_word: יַ֗עַן כִּֽי
  english_pob_choice: Because
  chosen_korean: 아람이 당신에게 악을 꾀하였고
  alternatives_korean:
  - 이는 … 때문입니다
  - 왜냐하면 …
  lexicon: יַלַן / כִּי (causal clause)
  rationale: 히브리어의 원인절을 자연스러운 한국어 인과 표현으로 옮기되, 뒤의 내용이 이유 설명의 핵심이므로 앞부분을 바로 진술형으로 처리했습니다.
- source_word: יָעַ֥ץ עָלֶ֛י/ךָ רָעָ֑ה
  english_pob_choice: has planned evil against you
  chosen_korean: 당신에게 악을 꾀하였고
  alternatives_korean:
  - 당신을 해치려 꾀하였고
  - 당신에게 해악을 도모하였고
  lexicon: יָעַץ + רָעָה
  rationale: יָעַץ는 단순한 ‘생각하다’보다 ‘꾀하다/모의하다’가 맞고, רָעָה는 도덕적 악이므로 ‘악’으로 직역성을 유지했습니다.
- source_word: אֶפְרַ֥יִם וּ/בֶן רְמַלְיָ֖הוּ
  english_pob_choice: along with Ephraim and the son of Remaliah
  chosen_korean: 에브라임과 르말야의 아들도 함께
  alternatives_korean:
  - 에브라임과 르말야의 아들과 함께
  - 에브라임, 그리고 르말야의 아들과 함께
  lexicon: ו + apposition
  rationale: 영문 POB가 ‘along with’로 풀어낸 결합 관계를 살려, 주체 목록을 병렬로 늘어놓기보다 ‘함께’로 묶어 문장의 자연스러움을 살렸습니다.
- source_word: בֶן רְמַלְיָהוּ
  english_pob_choice: the son of Remaliah
  chosen_korean: 르말야의 아들
  alternatives_korean:
  - 르말랴의 아들
  - 레말야의 아들
  lexicon: proper name transliteration
  rationale: 인명은 현대 음역을 따르되, 본문 전체의 통일성을 위해 기존 POB 흐름에 맞는 ‘르말야’를 택했습니다.
theological_decisions:
- issue: direct address pronoun in prophetic speech
  chosen_reading: 본문의 ‘당신에게’는 아하스에 대한 직접 خطاب을 한국어로 유지한 표현입니다.
