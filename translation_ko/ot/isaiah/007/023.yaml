id: ISA.7.23
reference: Isaiah 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֣ה כָל מָק֗וֹם אֲשֶׁ֧ר יִֽהְיֶה שָּׁ֛ם אֶ֥לֶף גֶּ֖פֶן בְּ/אֶ֣לֶף כָּ֑סֶף לַ/שָּׁמִ֥יר וְ/לַ/שַּׁ֖יִת יִֽהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
  footnotes:
  - marker: a
    text: Or, 'where there will be a thousand vines worth a thousand pieces of silver.' The Hebrew imperfect can be rendered more literally this way, but the context favors a contrast between formerly valuable vineyard land and its future desolation.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'a thousand vines for a thousand silver.' The exact monetary unit is not stated explicitly in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 은 천 개어치의 천 그루 포도나무가 있던 모든 곳이 가시덤불과 가시나무가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘은 천에 천 포도나무’입니다. 은의 정확한 화폐 단위는 본문에 명시되어 있지 않습니다. ‘있던’ 대신 히브리어 미완료형을 따라 ‘있을’로 옮길 수도 있으나, 문맥은 값비싼 포도밭과 장차 닥칠 황폐함을 대비합니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그날에
  - 그때에
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간 표지를 살려, 한국어에서도 종말·심판의 분위기가 드러나도록 옮겼습니다.
- source_word: אֲשֶׁר יִהְיֶה שָׁם
  english_pob_choice: where there were
  chosen_korean: 있던
  alternatives_korean:
  - 있을
  - 있던 곳에
  lexicon: HALOT
  rationale: 문맥상 과거의 가치 있던 포도밭 상태와 이후의 황폐함을 대비하므로, ‘있던’으로 상태 변화를 자연스럽게 드러냈습니다.
- source_word: אֶלֶף גֶּפֶן בְּאֶלֶף כָּסֶף
  english_pob_choice: a thousand vines worth a thousand pieces of silver
  chosen_korean: 천 은의 값어치가 되는 천 포도나무
  alternatives_korean:
  - 은 천 냥어치의 천 포도나무
  - 천 세겔의 값어치가 되는 천 포도나무
  lexicon: HALOT
  rationale: כָּסֶף는 단위가 명시되지 않아 ‘은’으로 두고, 가치 평가를 나타내는 표현으로 옮겨 과도한 구체화를 피했습니다.
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  english_pob_choice: briars and thorns
  chosen_korean: 가시덤불과 엉겅퀴
  alternatives_korean:
  - 찔레와 가시
  - 가시나무와 엉겅퀴
  lexicon: HALOT
  rationale: 황폐한 땅을 가리키는 관용적 짝을 현대 한국어의 자연스러운 심상으로 살렸습니다.
theological_decisions:
- issue: 예언적 미래와 상태 전환의 표현
  chosen_reading: ‘될 것입니다’로 마무리해, 기존의 가치 있는 포도밭이 황폐한 상태로 바뀌는 심판의 변화를 분명히 했습니다.
  alternative_readings:
  - ‘있을 것입니다’
  - ‘되리라’
  rationale: 히브리어의 단순 미래형이지만 문맥상 변화의 결과를 강조하는 것이 더 정확합니다.
  doctrine_reference: 예언서의 심판 선언과 상태 전환 표현
- issue: 번역 단위의 구체성
  chosen_reading: ‘은’으로 옮겨 כסף의 금전 가치를 보이되, ‘세겔’은 넣지 않았습니다.
  alternative_readings:
  - ‘은 세겔’
  - ‘은화’
  rationale: 본문에 단위가 명시되지 않았으므로, POB의 주석 취지에 맞춰 과잉 특정화를 피했습니다.
  doctrine_reference: 본문 충실성과 주석 기반의 보수적 처리
