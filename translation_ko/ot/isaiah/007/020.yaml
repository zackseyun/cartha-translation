  source_fidelity: 원문의 도구적·동격적 구조(‘강 건너편의 고용된 면도칼’, 곧/즉 앗수르 왕)를 살려야 합니다. 초안의 ‘면도칼로 앗수르 왕을 통해’는 면도칼과 앗수르 왕을 별개의 도구처럼 처리하여 원문의 은유적 동일시를 흐립니다. 또한 앞의 ‘밀다’와 뒤의 ‘수염을 쓸어 없애다’라는 두 동작을 구분하는 것이 더 충실합니다.
