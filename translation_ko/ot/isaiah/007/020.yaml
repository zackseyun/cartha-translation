base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
  footnotes:
  - marker: a
    text: Or possibly 'the hair of the legs'; 'the feet' may also function as a euphemism for the genitals, emphasizing complete humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 주께서 강 건너편의 삯을 주고 빌린 면도칼, 곧 앗수르 왕으로 머리와 발의 털[a]을 미실 것이며, 수염도 없애실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다리의 털’로 볼 수 있습니다. ‘발’은 완전한 수치를 강조하는 완곡 표현으로 성기 부위를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  english_pob_choice: will shave
  chosen_korean: 밀어 버리실 것입니다
  alternatives_korean:
  - 면도하실 것입니다
  - 깎으실 것입니다
  lexicon: HALOT
  rationale: רָה/גלח의 기본 뜻은 털을 밀거나 깎는 것이므로, 문맥의 수치와 완전한 제거를 드러내는 한국어로 ‘밀어 버리다’를 택했습니다.
- source_word: בְּתַעַר הַשְּׂכִירָה
  english_pob_choice: with a hired razor
  chosen_korean: 품삯 받은 면도칼로
  alternatives_korean:
  - 고용된 면도칼로
  - 품을 받은 면도칼로
  lexicon: HALOT
  rationale: ‘hired’의 수동적 뉘앙스를 살리면서 도구의 은유를 자연스럽게 전달하기 위해 ‘품삯 받은’으로 옮겼습니다.
- source_word: בְּעֶבְרֵי נָהָר
  english_pob_choice: from beyond the River
  chosen_korean: 강 건너편에서 온
  alternatives_korean:
  - 강 저편에서 온
  - 강 너머에서 온
  lexicon: HALOT
  rationale: 이스라엘 문맥에서의 관용적 지리표현을 한국어로 매끈하게 살리되, ‘강’을 통해 유브라데스 강을 암시하는 원뜻을 보존했습니다.
- source_word: שַׂעַר הָרַגְלָיִם
  english_pob_choice: the hair of the feet
  chosen_korean: 발의 털
  alternatives_korean:
  - 다리의 털
  - 발가락의 털
  lexicon: HALOT
  rationale: 히브리어를 직역한 표현을 본문에 유지해 투명성을 확보했습니다. 본문은 문자적 표현을 따르고, 해석 가능성은 각주로 남깁니다.
theological_decisions:
- issue: 앗수르 왕을 통한 심판 도구성
  chosen_reading: 주께서 앗수르 왕을 ‘품삯 받은 면도칼’로 사용하여 유다를 수치스럽게 낮추시는 심판으로 읽습니다.
  alternative_readings:
  - 단순한 군사적 패배 묘사로만 읽는 해석
  rationale: ‘주께서’가 행위 주체이고, 앗수르 왕이 도구적 표현으로 제시되므로, 본문은 침략의 결과뿐 아니라 하나님의 주권적 심판과 모욕의 이미지를 함께 드러냅니다.
  doctrine_reference: 섭리와 심판
