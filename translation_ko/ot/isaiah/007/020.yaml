  to: 그날에 주께서 강 건너편의 삯을 주고 빌린 면도칼, 곧 앗수르 왕으로 머리와 발의 털[a]을 미실 것이며, 수염도 없애실 것입니다.
  rationale: 앗수르 왕이 주께서 쓰시는 ‘고용된 면도칼’이라는 원문의 동격적 은유를 ‘곧 앗수르 왕’으로 명시했습니다. 문자적 ‘발의 털’은 본문에 보존하고, 다리 및 완곡 용법의 가능성은 각주에서 제시했습니다. 수염을 ‘없애다’로 따로 옮겨 마지막 동사의 총체적 제거의 뉘앙스를 살렸습니다.
