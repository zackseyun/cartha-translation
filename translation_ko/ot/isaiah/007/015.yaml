    rationale: 이는 원문의 두 동사와 ‘악/선’의 명시적 대조를 삭제합니다. ‘분별하다’는 결과적 능력을 나타낼 수는 있어도, 거절과 선택이라는 원문의 표현을 온전히 대체하지 못합니다.
