id: ISA.7.15
reference: Isaiah 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶמְאָ֥ה וּ/דְבַ֖שׁ יֹאכֵ֑ל לְ/דַעְתּ֛/וֹ מָא֥וֹס בָּ/רָ֖ע וּ/בָח֥וֹר בַּ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
  footnotes:
  - marker: a
    text: Or 'by the time he knows to refuse evil and choose good.' The Hebrew expression may mark the time up to which this applies.
    reason: alternative_reading
  - marker: b
    text: '''Curds'' may also be rendered ''butter'' or ''cream,'' referring broadly to a milk product.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 선한 것을 분별할 줄 알 때까지 엉긴 젖과 꿀을 먹을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 악을 거절하고 선을 선택하는 것을 알게 될 때까지’라는 뜻일 수 있습니다. 히브리어 표현은 이것이 적용되는 시점을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘엉긴 젖’은 넓게는 버터나 크림으로도 옮길 수 있으며, 우유 가공품을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  english_pob_choice: curds
  chosen_korean: 엉긴 젖
  alternatives_korean:
  - 버터
  - 크림
  lexicon: HALOT
  rationale: 현대 한국어에서 חֶמְאָה는 우유가 엉겨 굳은 유제품을 가리키는 뜻이 자연스러워 ‘엉긴 젖’으로 옮겼습니다. ‘버터’는 시대착오적일 수 있어 피했습니다.
- source_word: וּדְבַשׁ
  english_pob_choice: and honey
  chosen_korean: 꿀
  alternatives_korean:
  - 꿀과 함께
  - 꿀
  lexicon: HALOT
  rationale: 표준적인 ‘꿀’로 옮기되, 히브리어의 병렬 구조를 한국어에서도 간결하게 유지했습니다.
- source_word: לְדַעְתּוֹ
  english_pob_choice: by the time he knows
  chosen_korean: 분별할 줄 알 때까지
  alternatives_korean:
  - 알게 될 때까지
  - 분별할 때까지
  - 알기까지
  lexicon: HALOT
  rationale: 이 표현은 단순 지식이 아니라 선악을 가리는 인지적·도덕적 분별을 가리키므로, 자연스러운 한국어로 ‘분별할 줄 알’로 풀어 시간적 종결점을 살렸습니다.
- source_word: מָאוֹס ... וּבָחוֹר
  english_pob_choice: to refuse the evil and choose the good
  chosen_korean: 선한 것을 분별할 줄 알 때까지
  alternatives_korean:
  - 악을 거절하고 선을 택할 때까지
  - 악을 거부하고 선을 선택할 때까지
  lexicon: HALOT
  rationale: 히브리어의 대조는 ‘악을 거절/선을 선택’이지만, 한국어에서는 도덕적 판단의 초점을 살려 하나의 자연스러운 관용 표현으로 압축했습니다.
theological_decisions:
- issue: לְדַעְתּוֹ의 시간적-목적적 뉘앙스
  chosen_reading: ‘분별할 줄 알 때까지’로 옮겨, 아이의 식단과 도덕적 분별 사이의 인과를 만들지 않고 시간의 기준점을 드러냈습니다.
  alternative_readings:
  - ‘알도록’(목적)
  - ‘알게 될 때’(단순 시점)
  rationale: 문맥상 이 표현은 아이가 특정 분별 능력에 이르기 전까지의 시점을 표시하므로, 목적론적 오해를 피하면서도 예언적 표지를 유지하는 번역이 적절합니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하지 않고 보존한다'
- issue: ‘선한 것/악한 것’의 도덕적 대조
  chosen_reading: ‘선한 것’으로 마무리해 히브리어의 선악 대조를 한국어에서 과도하게 설명하지 않고 보존했습니다.
  alternative_readings:
  - ‘좋은 것’
  - ‘옳은 것’
  rationale: 원문은 단순한 선호가 아니라 도덕적 판별의 대조를 나타내므로, 표준적 윤리 어휘인 ‘선한 것’을 유지하는 것이 가장 가깝습니다.
  doctrine_reference: 문맥상 도덕적 분별의 예언 표지
