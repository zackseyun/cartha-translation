  source_fidelity: 히브리어의 주어, 두 개의 부정 미래형, 그리고 יהוה를 목적어로 하는 נסה를 대체로 충실히 옮겼습니다. 다만 שׁאל은 직전 절에서 제시된 ‘표징을 구하라’는 요청에 대한 응답이므로 한국어 본문에서는 ‘묻다’보다 ‘구하다’가 문맥과 어휘 의미를 더 정확히 반영합니다. 서두의 와우 연속형은 앞 절의 요청에 대한 반응이라는 문맥상 ‘그러나’로 자연스럽게 드러낼 수 있습니다.
  naturalness: 합쇼체는 일관되며 문장은 자연스럽습니다. ‘나는 구하지 않겠고, 야훼를 시험하지도 않겠습니다’는 병렬 부정과 대조를 명료하게 전달합니다.
  terminology: ‘아하스’와 ‘야훼’는 적절합니다. ‘시험하다’는 נסה의 중립적인 ‘시험하다/시험에 들게 하다’ 의미를 무리 없이 반영합니다. 영어 감사 기록의 각주 연결은 초안에서 뒤바뀌어 있습니다. 영어 [a]는 ‘시험하다’의 대안 표현, [b]는 신명(יהוה)에 관한 주석인데, 초안은 [a]에 신명 주석, [b]에 שׁאל 어휘 주석을 달았습니다. 또한 שׁאל 어휘 주석은 영어 감사 기록의 [b] 내용과도 일치하지 않습니다.
