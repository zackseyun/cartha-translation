source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָחָ֑ז לֹא אֶשְׁאַ֥ל וְ/לֹֽא אֲנַסֶּ֖ה אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
  footnotes:
  - marker: a
    text: Or, “I will not put the LORD to the test.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew has the divine name YHWH, traditionally rendered “the LORD”; alternatively, “Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 아하스가 말했습니다. 「나는 묻지 않겠고, 야훼를 시험하지도 않겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 하나님의 이름 יְהוָה를 사용합니다. 전통적으로는 ‘주님’으로 옮기기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 שׁאל은 여기서 ‘묻다’ 또는 ‘요청하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּ֖אמֶר
  english_pob_choice: But ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그때 말했습니다
  - 그러나 말했습니다
  lexicon: HALOT
  rationale: 히브리어 와우 연속형은 서술 진행을 잇지만, 한국어에서는 앞선 초청에 대한 거절의 뉘앙스를 문맥으로 전달하는 것이 자연스러워 단순한 서술 동사로 처리했습니다.
- source_word: אָחָז
  english_pob_choice: Ahaz
  chosen_korean: 아하스
  alternatives_korean:
  - 아하즈
  lexicon: 고유명사 관용 표기
  rationale: 한국어 성서에서 널리 쓰이는 관용 표기인 아하스를 따랐습니다.
- source_word: לֹא אֶשְׁאַ֥ל
  english_pob_choice: I will not ask
  chosen_korean: 나는 묻지 않겠고
  alternatives_korean:
  - 나는 요청하지 않겠습니다
  - 나는 구하지 않겠습니다
  lexicon: HALOT
  rationale: שׁאל은 여기서 징표를 ‘요구하다’보다 ‘묻다/청하다’의 뜻이 자연스럽고, 바로 앞 문맥의 초청에 대한 응답으로는 ‘묻지 않겠다’가 가장 직역에 가깝습니다.
- source_word: וְ/לֹֽא אֲנַסֶּ֖ה
  english_pob_choice: and I will not test
  chosen_korean: 시험하지도 않겠습니다
  alternatives_korean:
  - 또 시험하지 않겠습니다
  - 시험해 보지도 않겠습니다
  lexicon: HALOT
  rationale: נסה의 핵심 의미는 ‘시험하다, 검증하다’이므로, 하나님을 상대로 한 행위를 드러내는 ‘시험하지도 않겠습니다’로 옮겼습니다.
- source_word: יְהוָֽה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH 표기 관례
  rationale: 히브리어 고유명사 יְהוָה는 본문에서 직접 지칭된 언약 이름이므로, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 칭호가 아니라 언약 이름을 직접 사용하므로, 가리킴을 약화시키는 대체 호칭보다 이름 자체를 드러내는 번역이 소스 충실도에 맞습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
