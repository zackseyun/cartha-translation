  rationale: 히브리어 와우 연속형은 서술 진행을 잇지만, 한국어에서는 앞선 초청에 대한 거절의 뉘앙스를 문맥으로 전달하는 것이 자연스러워 단순한 서술 동사로 처리했습니다.
