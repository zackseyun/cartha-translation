revisions:
- from: 아하스 — 유다 왕 여담의 아들, 웃시야의 손자 —의 시대에 아람 왕 르신과 이스라엘 왕 레말리야의 아들 페카가 예루살렘을 쳐 올라가 그것을 상대로 전쟁하려 했으나, 그것을 공격할 수 없었습니다.[a][b]
  to: 유다 왕 웃시야의 손자이며 여담의 아들인 아하스 시대에, 아람[a] 왕 르신과 이스라엘 왕 레말리야의 아들 페카가 예루살렘을 상대로 전쟁을 벌이려고 올라갔으나, 그곳을 상대로 싸울 수 없었습니다.[b]
  rationale: 목적을 나타내는 לַמִּלְחָמָה를 ‘전쟁을 벌이려고’로, לְהִלָּחֵם을 ‘싸울 수 없었습니다’로 옮겨 원문의 군사적 의미를 보존했습니다. 한국어 서술어는 수를 표시하지 않으므로 히브리어 단수 형태를 복수 주어에 맞추어 명시적으로 변경하지 않았으며, 그 문법적 긴장은 각주로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:50:32Z'
review_pass:
  verdict: revise
  source_fidelity: ‘전쟁하려 했으나’는 לַמִּלְחָמָה(전쟁을 위하여/전쟁을 벌이기 위하여)의 목적을 단순한 시도·의도로 바꾸므로 수정이 필요합니다. 또한 לְהִלָּחֵם은 여기서 ‘공격하다’보다 ‘싸우다/전쟁을 벌이다’가 더 직접적입니다. 한국어의 무표지 서술어 ‘싸울 수 없었습니다’는 히브리어 단수 동사를 복수로 명시하여 조화시키지 않습니다.
  naturalness: ‘예루살렘을 상대로 전쟁을 벌이려고 올라갔으나, 그곳을 상대로 싸울 수 없었습니다’는 군사적 목적과 뒤의 실패를 자연스럽고 현대적인 합쇼체로 연결합니다. 계보는 ‘유다 왕 웃시야의 손자이며 여담의 아들인 아하스’로 정리하여 왕 칭호가 아하스를 수식함을 분명히 했습니다.
  terminology: 아람, 르신, 페카, 레말리야, 여담, 웃시야 및 유다·이스라엘은 적절합니다. ‘아람’에 대한 대안 번역 각주는 유지하되, 해당 명칭 바로 뒤에 표지합니다. 단수 동사 각주는 최종 서술 바로 뒤에 둡니다.
  issues:
  - severity: medium
    issue: ‘전쟁하려 했으나’
    rationale: 원문의 목적구 ‘전쟁을 위하여’는 실제로 전쟁을 벌이기 위해 올라간 행위를 말하며, ‘하려 했다’는 단순한 의도 또는 미수의 뉘앙스를 더합니다.
  - severity: medium
    issue: ‘공격할 수 없었습니다’
    rationale: 원문의 נלחם은 상호적 군사 행위인 ‘싸우다/전쟁을 벌이다’이며, ‘공격하다’는 의미를 좁힙니다.
  - severity: low
    issue: 각주 a의 위치
    rationale: 아람 대 시리아의 대안은 ‘아람’에 직접 붙여야 각주 대상이 명확합니다.
