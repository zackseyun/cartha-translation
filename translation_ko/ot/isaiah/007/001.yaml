id: ISA.7.1
reference: Isaiah 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
  footnotes:
  - marker: a
    text: Hebrew 'Aram'; traditionally 'Syria.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb is singular ('he was not able'), though the preceding subjects are Rezin and Pekah together; some translations smooth this to 'they were not able.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 웃시야의 손자이며 여담의 아들인 아하스 시대에, 아람[a] 왕 르신과 이스라엘 왕 레말리야의 아들 페카가 예루살렘을 상대로 전쟁을 벌이려고 올라갔으나, 그곳을 상대로 싸울 수 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרָם은 전통적으로 ‘시리아’로 옮기기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 단수입니다. 앞선 주어가 르신과 페카의 복수이므로 일부 번역은 이를 복수로 완화합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: ~의 시대에
  alternatives_korean:
  - ~의 날들에
  - ~때에
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간 표현을 한국어에서 자연스럽게 살리되, 왕조·정치적 배경이 드러나도록 ‘시대에’로 옮겼습니다.
- source_word: עָלָה
  english_pob_choice: went up against
  chosen_korean: 쳐 올라가
  alternatives_korean:
  - 올라가
  - 상대로 올라가
  - 공격하러 올라가
  lexicon: HALOT
  rationale: 군사적 맥락의 עלה는 단순 이동보다 ‘공격을 위해 올라감’의 뉘앙스가 있어, 방향성과 적대성을 함께 드러내는 표현을 택했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for war
  chosen_korean: 전쟁하려 했으나
  alternatives_korean:
  - 전쟁을 위해
  - 전투하려고
  - 싸우려고
  lexicon: HALOT
  rationale: 목적을 나타내는 לַמִּלְחָמָה를 문맥상 더 자연스러운 의도 표현으로 옮기되, 군사적 목적성이 약해지지 않도록 했습니다.
- source_word: וְלֹא יָכֹל
  english_pob_choice: but he was not able
  chosen_korean: 공격할 수 없었습니다
  alternatives_korean:
  - 그는 공격할 수 없었습니다
  - 그들은 공격할 수 없었습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단수이지만 한국어에서는 주어가 복수로 이어진 상황에서 무리한 인칭 표지를 피하고, 결과를 중심으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 아람(Aram) vs. 시리아(Syria)
  chosen_reading: 아람
  alternative_readings:
  - 시리아
  rationale: 히브리어 지명 אֲרָם을 원어 지칭대로 보존해 역사적·지리적 구분을 흐리지 않도록 했습니다.
  doctrine_reference: 번역 철학 §1
- issue: 히브리어 단수 동사의 긴장 유지
  chosen_reading: 공격할 수 없었습니다
  alternative_readings:
  - 그들은 공격할 수 없었습니다
  rationale: 본문의 단수·복수 긴장을 한국어에서 과도하게 조화시키지 않고, 서술 결과를 중심으로 보존했습니다.
  doctrine_reference: 번역 철학 §3
