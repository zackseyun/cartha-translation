source:
  edition: WLC
  text: נַעֲלֶ֤ה בִֽ/יהוּדָה֙ וּ/נְקִיצֶ֔/נָּה וְ/נַבְקִעֶ֖/נָּה אֵלֵ֑י/נוּ וְ/נַמְלִ֥יךְ מֶ֨לֶךְ֙ בְּ/תוֹכָ֔/הּ אֵ֖ת בֶּן טָֽבְאַֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
  footnotes:
  - marker: a
    text: Or 'and make her dread,' 'and vex her,' or 'and harass her.' The Hebrew verb is difficult; the main text takes it in the sense of causing fear or panic.
    reason: lexical_alternative
  - marker: b
    text: Or 'and breach her for ourselves' or 'and split her apart for us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「유다로 올라가 그를 공포에 떨게 하고, 우리를 위해 그 틈을 내고, 그 가운데 다브엘의 아들을 왕으로 세우자」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 난해하여 ‘공포에 떨게 하다’ 외에 ‘두렵게 하다’, ‘괴롭히다’, ‘압박하다’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리를 위해 그 틈을 내다’입니다. 이 표현은 성을 무너뜨리거나 돌파하여 점령하겠다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶ֤ה בִֽ/יהוּדָה֙
  english_pob_choice: Let us go up against Judah
  chosen_korean: 유다로 올라가
  alternatives_korean:
  - 유다를 치러 올라가
  - 유다를 공격하러 올라가
  lexicon: HALOT
  rationale: עלה의 군사적 용법을 살리되, 한국어에서는 이미 앞뒤 문맥이 적대적이므로 ‘치러/공격하러’를 덧붙이지 않아도 자연스럽습니다.
- source_word: וּ/נְקִיצֶ֔/נָּה
  english_pob_choice: and terrify her
  chosen_korean: 그를 공포에 떨게 하고
  alternatives_korean:
  - 그를 두렵게 하고
  - 그를 괴롭히고
  - 그를 떨게 하고
  lexicon: HALOT
  rationale: 해당 어근은 난해하지만 문맥상 침공으로 인한 공포 조성이므로 ‘공포에 떨게 하다’가 가장 직접적으로 대응합니다.
- source_word: וְ/נַבְקִעֶ֖/נָּה אֵלֵ֑י/נוּ
  english_pob_choice: and break her open for ourselves
  chosen_korean: 우리를 위해 그 틈을 내고
  alternatives_korean:
  - 우리를 위해 그를 돌파하고
  - 우리를 위해 그를 찢어 열고
  - 우리를 위해 그를 무너뜨리고
  lexicon: HALOT
  rationale: בקע는 ‘가르다/쪼개다/틈을 내다’의 뜻이므로, 파괴적 이미지를 유지하면서도 한국어로는 ‘틈을 내다’가 가장 자연스럽습니다. ‘우리를 위해’는 אֵלֵינוּ의 점유·이익 뉘앙스를 반영합니다.
- source_word: וְ/נַמְלִ֥יךְ מֶ֨לֶךְ֙ ... אֵ֖ת בֶּן טָֽבְאַֽל
  english_pob_choice: and make the son of Tabeel king
  chosen_korean: 다브엘의 아들을 왕으로 세우고
  alternatives_korean:
  - 다브엘의 아들을 왕으로 만들고
  - 다브엘의 아들을 왕으로 임명하고
  - 다브엘의 아들을 왕으로 옹립하고
  lexicon: HALOT
  rationale: מלך의 사역형은 ‘왕으로 세우다/임명하다’의 뜻이므로, 즉위 조작의 의미를 살리면서도 한국어로 간결하게 옮겼습니다. טָבְאַל은 음역형 ‘다브엘’로 옮겼습니다.
theological_decisions:
- issue: 유다를 가리키는 지시 대명사와 성별 표지
  chosen_reading: 히브리어의 여성형 지시를 반영해 ‘그를’로 옮기되, 한국어에서는 ‘유다’가 이미 전면에 있어 과도한 성별 표시는 피했습니다.
  alternative_readings:
  - ‘그녀를’로 옮김
  - ‘그것을’로 옮김
  rationale: 원문은 유다를 여성형으로 인칭화하지만, 한국어에서는 ‘유다’ 자체가 여성형 어미를 요구하지 않으므로 의미 전달과 자연성을 함께 고려했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
- issue: 문장 내 인용부의 적대적 군사 발화
  chosen_reading: 직접화법을 따옴표로 처리하고, 군사적 결의를 그대로 드러냈습니다.
  alternative_readings:
  - 서술문으로 완화하여 옮김
  - 간접화법으로 재구성
  rationale: 원문의 집단적 음모 발언을 약화하지 않고 독자가 즉시 인지하도록 하는 것이 본문의 효과를 더 충실히 반영합니다.
  doctrine_reference: North-star principle
