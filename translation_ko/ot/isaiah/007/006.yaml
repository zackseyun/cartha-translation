  naturalness: ‘유다를 치러 올라가’는 군사적 문맥을 자연스럽게 드러냅니다. 유다를 반복하는 것은 한국어에서 대명사 ‘그를’의 남성적 인상을 피하고, ‘틈을 내다’의 대상을 명료하게 합니다. 직접화법의 종결은 ‘세우자’로 유지하는 것이 자연스럽습니다.
