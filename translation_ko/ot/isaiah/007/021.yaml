id: ISA.7.21
reference: Isaiah 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא יְחַיֶּה אִ֛ישׁ עֶגְלַ֥ת בָּקָ֖ר וּ/שְׁתֵּי צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/021.yaml
  text: And in that day a man will keep alive a young cow and two sheep[a][b].
  footnotes:
  - marker: a
    text: Or 'a heifer.' The Hebrew phrase refers to a young female from the cattle herd.
    reason: lexical_alternative
  - marker: b
    text: Hebrew צֹאן is a collective term for small livestock, often including sheep and goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 한 사람이 한 젖소와 두 마리의 작은 가축을 기를 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will
  chosen_korean: …할 것입니다
  alternatives_korean:
  - 그리고 …할 것입니다
  - 그 일이 있을 것입니다
  lexicon: HALOT
  rationale: 예언 문맥의 서두 공식을 한국어에서 자연스럽게 풀어, 미래 예고의 힘은 살리되 불필요한 반복은 줄였습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언적 시간 표현을 직역하되, 한국어에서는 ‘그날에’가 가장 자연스럽고 간결합니다.
- source_word: עֶגְלַת בָּקָר
  english_pob_choice: a young cow
  chosen_korean: 한 젖소
  alternatives_korean:
  - 한 어린 암소
  - 한 송아지
  lexicon: HALOT
  rationale: 문맥상 어린 암소/송아지보다 ‘젖소’는 성숙한 성체 암컷 소를 떠올리게 할 수 있어, 원문의 ‘어린 암소’ 의미를 더 직접적으로 드러내는 표현이 필요합니다.
- source_word: וּשְׁתֵּי צֹאן
  english_pob_choice: and two sheep
  chosen_korean: 두 마리의 작은 가축
  alternatives_korean:
  - 두 마리의 양
  - 두 마리의 양과 염소
  lexicon: HALOT
  rationale: צֹאן은 양에만 고정되지 않는 작은 가축의 집합명사이므로, 본문 주석 취지를 살려 더 넓은 의미를 유지했습니다.
theological_decisions:
- issue: 예언적 시제와 상징적 소량의 가축 표상
  chosen_reading: 미래 예고로 읽어 ‘기를 것입니다’라고 옮기고, 가축의 수는 매우 적은 생계 수준을 드러내는 묘사로 유지했습니다.
  alternative_readings:
  - 현재 서술형으로 완화
  - 상징적 의미를 설명하는 의역
  rationale: 히브리어는 예언적 미래를 직접 말하며, 문맥상 포도원과 황무지의 회복/감소를 암시하는 소수 가축 이미지를 보존하는 것이 중요합니다.
  doctrine_reference: 예언서의 문학적-역사적 문맥 보존
