translation:
  language: ko
  text: 그날에 한 사람이 어린 암소 한 마리[a]와 작은 가축 두 마리[b]를 살려 둘 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암송아지’. 히브리어는 소 떼에 속한 어린 암컷 소를 가리킵니다.
