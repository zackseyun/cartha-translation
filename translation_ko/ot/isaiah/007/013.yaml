revisions:
- from: 그가 말씀하셨습니다. 「들으십시오, 이제 다윗의 집이여! 사람들이 지치게 하기에 너희에게는 그것이 너무 작은 일이어서, 너희가 또 내 하나님까지 지치게 합니까?」[a]
  to: 그가 말했습니다. 「다윗의 집이여, 부디 들으십시오. 사람들을 지치게 하는 것만으로는 너희에게 부족합니까? 그래서 내 하나님까지 지치게 하려 합니까?」
  rationale: 나(נָא)의 호소력을 ‘부디’로 반영하고, 수사 의문을 현대 한국어의 자연스러운 ‘~것만으로는 … 부족합니까?’로 옮겼습니다. 두 차례의 לאה를 모두 ‘지치게 하다’로 번역하여 원문의 반복과 비난의 증폭을 보존했습니다. 불필요하고 오해 소지가 있는 성별 관련 각주는 삭제했습니다.
