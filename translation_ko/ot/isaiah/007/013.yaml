id: ISA.7.13
reference: Isaiah 7:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
  footnotes:
  - marker: a
    text: Or, “Is it a small thing for you to weary men, that you also weary my God?”
    reason: lexical_alternative
  - marker: b
    text: “Men” renders the masculine plural Hebrew and contrasts human beings with God; alternatively, “people.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 「들으십시오, 이제 다윗의 집이여! 사람들이 지치게 하기에 너희에게는 그것이 너무 작은 일이어서, 너희가 또 내 하나님까지 지치게 합니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들’은 히브리어 남성 복수를 일반화해 옮긴 표현으로, 원문의 남성형과 그 대조를 더 분명히 살리려면 ‘남자들’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그가 이르셨습니다
  lexicon: HALOT
  rationale: 서사적 전개를 살리되, 예언자 발화의 공적이고 격식 있는 어조를 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Listen, please
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 주십시오
  - 제발 들으십시오
  lexicon: HALOT
  rationale: 복수 명령의 호소력을 살리면서 한국어에서는 ‘이제’를 별도로 덧붙이지 않아도 요청의 긴박함이 전달되므로, 자연스러운 공손 명령형으로 옮겼습니다.
- source_word: בֵּית דָּוִד
  english_pob_choice: house of David
  chosen_korean: 다윗의 집
  alternatives_korean:
  - 다윗 가문
  - 다윗 집안
  lexicon: HALOT
  rationale: 왕조 전체를 가리키는 집합적 호칭이므로, ‘가문’보다 원어의 ‘집’ 이미지를 보존하는 ‘다윗의 집’을 택했습니다.
- source_word: הַמְעַט מִכֶּם ... תַלְאוּ
  english_pob_choice: Is it too little for you ... that you also weary
  chosen_korean: 너희에게는 그것이 너무 작은 일이어서 ... 너희가 또 ... 지치게 합니까
  alternatives_korean:
  - 너희가 ... 지치게 하는 것이 너무 작은 일이어서
  - 너희에게는 ... 하기에 너무 작은 일이어서
  lexicon: HALOT
  rationale: 히브리어의 수사 의문 구조를 직역적으로 ‘너희에게는 그것이 너무 작은 일이어서’로 살려, 앞뒤의 ‘지치게 하다/지치게 하다’ 반복을 유지했습니다.
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 인간들
  lexicon: HALOT
  rationale: 원어는 남성 복수이지만 한국어에서는 이 대조를 자연스럽게 드러내기 위해 일반 명사 ‘사람들’을 사용했습니다. 다만 하나님과의 대조는 문맥상 유지됩니다.
- source_word: אֱלֹהָי
  english_pob_choice: my God
  chosen_korean: 내 하나님
  alternatives_korean:
  - 나의 하나님
  - 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격을 분명히 드러내기 위해 ‘내 하나님’으로 옮겨, 예언자 화자의 개인적·대조적 표현을 보존했습니다.
theological_decisions:
- issue: ‘아하즈’가 아니라 ‘다윗의 집’으로 부르는 직함의 보존
  chosen_reading: 집합적 왕조 호칭으로서 ‘다윗의 집’을 그대로 유지했습니다.
  alternative_readings:
  - 다윗 가문
  - 유다 왕실
  rationale: 본문의 직접 호칭은 왕조 전체에 대한 책망이므로, 후대적 해석을 덧씌우지 않고 원문 표현을 그대로 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy 1, 4
- issue: ‘지치게 하다’의 반복 유지
  chosen_reading: 인간을 지치게 하는 것과 하나님을 지치게 하는 것을 동일 동사로 반복했습니다.
  alternative_readings:
  - 괴롭히다
  - 진저리나게 하다
  rationale: 같은 어근의 반복이 수사적 증폭을 이루므로, 한국어에서도 반복을 보존해야 본문의 날카로운 비난이 살아납니다.
  doctrine_reference: Translation philosophy 1, 5
