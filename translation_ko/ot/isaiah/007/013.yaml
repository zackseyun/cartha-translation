review_pass:
  verdict: revise
  source_fidelity: 원문의 수사 의문과 ‘지치게 하다’의 반복, ‘내 하나님’의 1인칭 소유 표현은 초안에 대체로 반영되어 있습니다. 그러나 נָא는 ‘이제’가 아니라 청유·간청의 뉘앙스를 지니며, 초안의 문장 구조는 ‘사람들을 지치게 하는 일’과 ‘너희에게 너무 작은 일’의 관계를 부자연스럽게 만들었습니다. 또한 וַיֹּאמֶר의 화자가 이사야임을 고려해 높임의 ‘말씀하셨습니다’보다 중립적인 서술이 적절합니다.
  naturalness: ‘사람들을 지치게 하는 것만으로는 너희에게 부족합니까?’는 히브리어의 ‘작은 일이냐’라는 관용적 수사 의문을 현대 한국어로 자연스럽게 재현합니다. 이어지는 ‘그래서’는 인간을 지치게 함에서 하나님을 지치게 함으로 나아가는 비난의 증폭을 분명히 합니다.
  terminology: ‘다윗의 집’, ‘사람들’, ‘내 하나님’, ‘지치게 하다’를 유지했습니다. אֲנָשִׁים은 이 문맥에서 하나님과 대비되는 인간을 가리키며, 한국어 ‘사람들’은 자연스럽고 충분합니다. 이를 ‘남자들’로 한정할 근거는 없습니다.
  issues:
  - severity: medium
    issue: ‘이제’가 본문에 추가되어 있고 נָא의 호소·간청의 뉘앙스가 적절히 처리되지 않았습니다.
    rationale: נָא는 시간 부사 ‘이제’가 아니라 ‘부디/청컨대’와 같은 요청·강조의 불변사입니다.
  - severity: high
    issue: ‘사람들이 지치게 하기에 너희에게는 그것이 너무 작은 일이어서’의 문장 구조가 부자연스럽고 의미 관계가 불명확합니다.
    rationale: הַמְעַט מִכֶּם הַלְאוֹת אֲנָשִׁים은 ‘사람들을 지치게 하는 것만으로는 너희에게 부족하냐’라는 수사 의문입니다.
  - severity: medium
    issue: ‘말씀하셨습니다’는 서술 화자 이사야에게 불필요한 존대를 부여합니다.
    rationale: 원문의 단순 서사 동사 ‘그가 말하였다’에는 화자에 대한 높임이 없습니다. 합쇼체 서술에서도 ‘말했습니다’가 중립적입니다.
