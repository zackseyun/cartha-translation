  lexicon: HALOT
  rationale: '''יִרְאַת''의 명사구 구조를 살려 원인 표현으로 옮겼고, 예언적 황폐 이미지인 שני 단어를 구체적 식물명으로 유지했습니다.'
- source_word: לְמִשְׁלַח שׁוֹר וּלְמִרְמַס שֶׂה
  english_pob_choice: a place for the sending out of oxen and for the trampling of sheep
  chosen_korean: 소를 몰아내는 곳이 되고, 양들이 밟는 곳이 될 것입니다
  alternatives_korean:
  - 소를 풀어놓는 곳이 되고, 양이 짓밟는 곳이 될 것입니다
  - 소 방목지가 되고, 양이 밟는 곳이 될 것입니다
  lexicon: HALOT
  rationale: '''보내다/풀어놓다''의 구체성을 살리되 한국어에서 자연스럽게 읽히도록 ''몰아내다''로 풀었습니다. שֶׂה는 넓게는 작은 가축이지만, POB의 기본 선택을 따라 ''양''으로 두었습니다.'
