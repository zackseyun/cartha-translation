revisions:
- from: 그리고 가시덤불과 엉겅퀴에 대한 두려움 때문에, 쟁기로 갈던 모든 산에도 그리로 들어가지 못할 것입니다. 그것들은 소를 몰아내는 곳이 되고, 양들이 밟는 곳이 될 것입니다.[a][b][c][d]
  to: 그리고 괭이로 일구던[a] 모든 산에는 가시덤불과 찔레가 두려워서 그곳에 가지 않을 것입니다.[b] 그 산들은 소를 풀어 놓는 곳[c]과 양이 밟는 곳[d]이 될 것입니다.
  rationale: 경작 도구를 쟁기에서 괭이로 바로잡고, 소를 ‘몰아내는’ 부정적 의미를 ‘풀어 놓는’으로 수정했습니다. 가시 식물의 명칭도 원문보다 지나치게 특정하지 않도록 조정했으며, 원문의 일반적 2인칭 가능성, 소를 풀어 놓는다는 표현의 해석 범위, שֶׂה의 의미 범위는 각주로 보존했습니다.
