reference: Isaiah 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
  footnotes:
  - marker: a
    text: Or 'that are dug/cultivated with the hoe.' The Hebrew uses a cognate noun and verb for hoeing.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''you will not go there'' may function generically: ''one will not go there.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'a place where oxen are let loose' or more interpretively 'pasture for oxen.'
    reason: lexical_alternative
  - marker: d
    text: '''Sheep'' translates Hebrew שֶׂה, which can also refer more broadly to small livestock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가시덤불과 엉겅퀴에 대한 두려움 때문에, 쟁기로 갈던 모든 산에도 그리로 들어가지 못할 것입니다. 그것들은 소를 몰아내는 곳이 되고, 양들이 밟는 곳이 될 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '쟁기질하다'의 어근이 겹친 표현으로, '쟁기로 갈던'은 그 경작 이미지의 중복을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 '그리로 들어가지 못합니다'는 일반적 표현으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''소를 몰아내는 곳''은 직역에 가깝고, 해석적으로는 ''소 방목지''처럼 옮길 수도 있습니다.'
    reason: lexical_alternative
  - marker: d
    text: '''양''은 히브리어 שֶׂה가 가리킬 수 있는 작은 가축 전체를 대표적으로 옮긴 것입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  english_pob_choice: And as for all the hills
  chosen_korean: 모든 산에도
  alternatives_korean:
  - 모든 언덕에도
  - 그리고 모든 산에
  lexicon: HALOT
  rationale: הַר는 여기서 지형 전체를 가리키므로 문맥상 '산'이 가능하며, 한국어에서는 자연스러운 집합 표현으로 처리했습니다.
- source_word: בַּמַּעְדֵּר יֵעָדֵרוּן
  english_pob_choice: that used to be hoed with a hoe
  chosen_korean: 쟁기로 갈던
  alternatives_korean:
  - 괭이로 고르던
  - 호미로 파던
  lexicon: HALOT
  rationale: 마감된 논밭의 이미지보다 경작 도구로 거친 땅을 다듬던 과거 상태를 살리기 위해, 한국어에서는 가장 가까운 농경 동사인 '갈다'를 택했습니다.
- source_word: יִרְאַת שָׁמִיר וָשָׁיִת
  english_pob_choice: for fear of briers and thorns
  chosen_korean: 가시덤불과 엉겅퀴에 대한 두려움 때문에
  alternatives_korean:
  - 가시덤불과 엉겅퀴를 두려워하여
  - 가시와 찔레에 대한 두려움 때문에
  lexicon: HALOT
  rationale: '''יִרְאַת''의 명사구 구조를 살려 원인 표현으로 옮겼고, 예언적 황폐 이미지인 שני 단어를 구체적 식물명으로 유지했습니다.'
- source_word: לְמִשְׁלַח שׁוֹר וּלְמִרְמַס שֶׂה
  english_pob_choice: a place for the sending out of oxen and for the trampling of sheep
  chosen_korean: 소를 몰아내는 곳이 되고, 양들이 밟는 곳이 될 것입니다
  alternatives_korean:
  - 소를 풀어놓는 곳이 되고, 양이 짓밟는 곳이 될 것입니다
  - 소 방목지가 되고, 양이 밟는 곳이 될 것입니다
  lexicon: HALOT
  rationale: '''보내다/풀어놓다''의 구체성을 살리되 한국어에서 자연스럽게 읽히도록 ''몰아내다''로 풀었습니다. שֶׂה는 넓게는 작은 가축이지만, POB의 기본 선택을 따라 ''양''으로 두었습니다.'
theological_decisions:
- issue: 예언적 황폐 묘사의 시제와 전망
  chosen_reading: 미래적 결과를 분명히 드러내는 '~할 것입니다'로 옮겼습니다.
  alternative_readings:
  - 현재형 서술로 '…됩니다'
  - 완결된 예언으로 '…될 것이다'
  rationale: 히브리어 עתיד형과 문맥상 선언적 예언을 반영하면서도, 한국어 합쇼체의 자연스러운 예언 표현을 유지했습니다.
  doctrine_reference: 예언 본문의 미래 선언과 심판-회복 문맥
