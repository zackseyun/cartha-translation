  rationale: 본문의 결합 호칭을 한국어 예배·독서 문맥에서 과도하게 낯설지 않게 하면서도, 앞의 아도나이와 뒤의 신명 호칭을 모두 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוִה YHWH'
- issue: 예언 선언문의 시제와 공신력
