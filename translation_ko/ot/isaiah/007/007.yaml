base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''It will not stand, and it will not be.'' The second clause means the plan will not come to pass or happen.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이것이 주 하나님께서 말씀하십니다: 그것은 서지 못하며[a], 이루어지지 않을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그것은 서지 못하며, 있지 않을 것입니다”입니다. 두 번째 절은 그 계획이 이루어지지 않거나 실현되지 못함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이것이 … 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 이렇게 말씀하십니다
  - 이와 같이 주 하나님께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 선포 공식의 지시적 뉘앙스를 살리면서도 현대 한국어의 자연스러운 선언문형으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 여호와의 결합 호칭은 한국어에서 ‘주 하나님’이 가장 자연스럽게 두 요소를 함께 드러내며, 중복된 ‘주 주’형을 피합니다.
- source_word: תָקוּם
  english_pob_choice: will stand
  chosen_korean: 서지
  alternatives_korean:
  - 성립되지
  - 견고해지
  lexicon: HALOT
  rationale: 여기서는 계획이나 책략이 ‘굳게 서다/성립하다’는 관용적 의미이므로, 맥락을 살려 ‘서다’로 옮겼습니다.
- source_word: תִהְיֶה
  english_pob_choice: will come to pass
  chosen_korean: 이루어지지 않을 것입니다
  alternatives_korean:
  - 일어나지 않을 것입니다
  - 성취되지 않을 것입니다
  lexicon: HALOT
  rationale: 두 번째 절은 계획이 현실이 되지 못함을 뜻하므로, 단순한 존재 부정이 아니라 결과의 미성취를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 야훼
  - 주 야훼
  rationale: 본문의 결합 호칭을 한국어 예배·독서 문맥에서 과도하게 낯설지 않게 하면서도, 앞의 아도나이와 뒤의 신명 호칭을 모두 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוִה YHWH'
- issue: 예언 선언문의 시제와 공신력
  chosen_reading: 현재형 선언(말씀하십니다)
  alternative_readings:
  - 과거형(말씀하셨습니다)
  rationale: 히브리어 예언 수식구의 현재적 효력을 살려, 선지자적 선언으로 현재형을 사용했습니다.
  doctrine_reference: Prophetic discourse convention
