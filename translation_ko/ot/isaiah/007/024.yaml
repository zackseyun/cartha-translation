id: ISA.7.24
reference: Isaiah 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/חִצִּ֥ים וּ/בַ/קֶּ֖שֶׁת יָ֣בוֹא שָׁ֑מָּ/ה כִּי שָׁמִ֥יר וָ/שַׁ֖יִת תִּֽהְיֶ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
  footnotes:
  - marker: a
    text: Or 'he will come there with arrows and with a bow'; the Hebrew verb is singular and may be understood generically.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the land will be briers and thorns.'
    reason: lexical_alternative
translation:
  language: ko
  text: 활과 화살을 가지고 그리로 올 사람이 있으니, 온 땅이 가시덤불과 엉겅퀴가 될 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단수형이며, 문맥상 일반적 주어로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 땅이 가시덤불과 엉겅퀴가 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/חִצִּים
  english_pob_choice: with arrows
  chosen_korean: 화살을 가지고
  alternatives_korean:
  - 화살과 함께
  - 화살로
  lexicon: HALOT
  rationale: 히브리어 ב + 복수명사는 도구·수단을 나타내므로, 한국어에서는 ‘가지고’로 자연스럽게 도구성을 살렸습니다.
- source_word: וּ/בַ/קֶּשֶׁת
  english_pob_choice: and with a bow
  chosen_korean: 활과
  alternatives_korean:
  - 그리고 활을 가지고
  - 활을
  lexicon: HALOT
  rationale: 앞의 ‘화살을 가지고’와 병렬되는 무기 표현을 자연스럽게 묶어, 예배체 문체보다 현대 한국어의 간결한 병렬 구조를 택했습니다.
- source_word: יָבוֹא שָׁמָּה
  english_pob_choice: One will come there
  chosen_korean: 그리로 올 사람이 있으니
  alternatives_korean:
  - 그리로 올 것이니
  - 그리로 올 사람은
  lexicon: HALOT
  rationale: 히브리어 동사 단수형을 무시하지 않으면서도, 특정 남성 주어로 한정하지 않는 영어 POB의 취지를 따라 한국어에서는 일반화된 주어로 옮겼습니다.
- source_word: שָׁמִיר וָשַׁיִת
  english_pob_choice: briers and thorns
  chosen_korean: 가시덤불과 엉겅퀴
  alternatives_korean:
  - 가시와 엉겅퀴
  - 찔레와 가시덤불
  lexicon: HALOT
  rationale: 이 고정어구는 황폐함과 개간 불가능한 상태를 가리키므로, 한국어에서도 두 식물의 거친 이미지를 살려 ‘가시덤불과 엉겅퀴’로 옮겼습니다.
- source_word: תִּהְיֶה כָל הָאָרֶץ
  english_pob_choice: all the land will become
  chosen_korean: 온 땅이 … 될 것이기 때문입니다
  alternatives_korean:
  - 온 땅이 … 입니다
  - 모든 땅이 … 될 것입니다
  lexicon: HALOT
  rationale: תִּהְיֶה의 단순 ‘있다’보다 결과적 변화를 드러내는 ‘될 것’이 문맥상 더 정확하여, 황폐화의 상태 변화를 분명히 했습니다.
theological_decisions:
- issue: 예언적 황폐 묘사의 범위
  chosen_reading: ‘온 땅’은 세계 전체가 아니라 문맥상 심판 아래 놓인 해당 지역의 전면적 황폐를 뜻합니다.
  alternative_readings:
  - 지구 전체의 보편적 파괴
  - 과장된 시적 표현으로만 축소
  rationale: 이사야 7장의 역사적·예언적 문맥에서 הארץ는 특정 땅/지역을 가리키므로, 심판의 총체성을 살리되 범위를 과장하지 않았습니다.
  doctrine_reference: 문맥 우선의 예언 해석
- issue: 히브리어 단수 동사의 일반화
  chosen_reading: ‘올 사람이 있으니’로 옮겨 단수 형태를 보존하되, 특정 인물 지정은 피했습니다.
  alternative_readings:
  - 그가 올 것이니
  - 사람들이 올 것이니
  rationale: 영어 POB의 주해처럼 히브리어 단수형의 일반적 용법을 반영하여, 문법적 단수와 의미상의 일반성을 함께 유지했습니다.
  doctrine_reference: 히브리어 서술의 일반적 단수 용법
