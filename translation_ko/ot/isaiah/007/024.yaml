translation:
  language: ko
  text: 누군가 화살과 활을 가지고 그리로 올 것입니다.[a] 온 땅이 가시덤불과 엉겅퀴가 될 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 남성 단수형이며, 문맥상 일반적이고 불특정한 주어로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 땅에 가시덤불과 엉겅퀴가 있을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/חִצִּים
  english_pob_choice: with arrows
  chosen_korean: 화살을 가지고
  alternatives_korean:
