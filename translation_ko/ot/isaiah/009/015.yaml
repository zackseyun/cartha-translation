source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
  footnotes:
  - marker: a
    text: Or, 'those who bless this people are leading them astray, and those blessed by them are swallowed up.' The Hebrew forms from אשר can be understood in relation to pronouncing someone blessed, though the context also supports 'guides' / 'those guided.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이 백성의 인도자들은 그들을 그릇된 길로 이끄는 자들이 되었으며, 그들에게 인도된 자들은 삼켜졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이 백성을 복 주는 자들이 그들을 그릇된 길로 이끌고, 그들에게 복 주어진 자들은 삼켜졌습니다.’ 히브리어 אשר 어근은 사람을 복되다/복 주다로 선언하는 의미로도 이해될 수 있지만, 문맥은 또한 ‘인도자들’ / ‘그들에게 인도된 자들’을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְאַשְּׁרֵי
  english_pob_choice: the guides of
  chosen_korean: 인도자들
  alternatives_korean:
  - 지도자들
  - 길잡이들
  - 복 주는 자들
  lexicon: HALOT
  rationale: 문맥상 이 단어는 ‘복을 빌어 주는 자들’보다 백성을 이끄는 지도 기능을 가리키며, 뒤의 ‘그릇된 길로 이끄는’과 평행을 이루므로 ‘인도자들’이 가장 자연스럽습니다.
- source_word: מַתְעִים
  english_pob_choice: those who lead them astray
  chosen_korean: 그들을 그릇된 길로 이끄는 자들
  alternatives_korean:
  - 그들을 미혹하는 자들
  - 그들을 방황하게 하는 자들
  - 그들을 속이는 자들
  lexicon: HALOT
  rationale: 히필 분사로서 타인을 오도하게 만드는 적극적 의미를 살려, 직역보다 한국어에서 의미가 분명한 ‘그릇된 길로 이끄는’으로 옮겼습니다.
- source_word: וּמְאֻשָּׁרָיו
  english_pob_choice: those guided by them
  chosen_korean: 그들에게 인도된 자들
  alternatives_korean:
  - 그들에게 이끌린 자들
  - 그들이 복 주었다고 여겨진 자들
  lexicon: HALOT
  rationale: 수동 분사형과 앞절의 평행성을 살려, 이들은 지도자들에게 따라간 사람들로 이해하는 것이 가장 직접적이므로 ‘인도된 자들’로 번역했습니다.
- source_word: מְבֻלָּעִים
  english_pob_choice: are swallowed up
  chosen_korean: 삼켜졌습니다
  alternatives_korean:
  - 삼켜집니다
  - 집어삼켜집니다
  - 멸망합니다
  lexicon: HALOT
  rationale: בלע의 핵심 이미지를 살려 ‘삼키다’의 수동형으로 옮겼고, 심판의 결과를 과도하게 해설어로 바꾸지 않았습니다.
theological_decisions:
- issue: אשר 어근의 두 가지 가능한 이해
  chosen_reading: 지도자/인도자와 그들에게 인도된 자들로 읽었습니다.
  alternative_readings:
  - 이 백성을 복 주는 자들과 그들에게 복 주었다고 여겨진 자들로 읽을 수 있습니다.
  rationale: 바로 뒤의 ‘그들을 그릇된 길로 이끄는’과의 대응 관계가 분명하므로, 본문은 잘못된 지도와 그 결과를 드러내는 것으로 읽는 것이 가장 타당합니다. 다만 אשר 어근이 ‘복되다/복 주다’와도 연결될 수 있어 그 가능성은 각주로 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
