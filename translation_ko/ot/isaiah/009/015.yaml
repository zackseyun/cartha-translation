revisions:
- from: 그리고 이 백성의 인도자들은 그들을 그릇된 길로 이끄는 자들이 되었으며, 그들에게 인도된 자들은 삼켜졌습니다.[a]
  to: 이 백성의 인도자들은 그들을 잘못된 길로 이끄는 자들이 되었고, 그들에게 인도받는 자들은 삼켜집니다.[a]
  rationale: 주된 번역의 문맥적 해석은 유지하되, 수동 분사의 상을 더 충실히 반영하고 한국어 문장을 자연스럽게 다듬었습니다. 또한 각주에서 논쟁되는 אשר 어근의 대안을 원문의 선언적 의미에 맞게 수정하여, 본문의 모호성을 보존하면서도 ‘복을 실제로 부여하다’라는 과잉 해석을 피했습니다.
