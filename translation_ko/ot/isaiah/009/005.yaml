source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
  footnotes:
  - marker: a
    text: 'Or, more traditionally in prophetic context: ''For to us a child is born, to us a son is given, and the government shall be upon his shoulder; and his name shall be called ...'''
    reason: alternative_reading
  - marker: b
    text: '''Father of Eternity'' renders the Hebrew literally; traditional English often has ''Everlasting Father.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 우리에게 한 아이가 태어났고, 우리에게 한 아들이 주어졌으며, 다스림이 그의 어깨 위에 있습니다. 그의 이름은 「기묘한 조언자, 전능하신 하나님, 영원한 아버지, 평화의 통치자」라고 불립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 예언체에 맞춰 ‘우리에게 한 아기가 났고, 우리에게 한 아들이 주어졌으며…’처럼 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  - 그러므로
  lexicon: HALOT
  rationale: 앞절의 구원을 뒷받침하는 설명·근거를 자연스러운 한국어 문장으로 연결하기에 가장 간결합니다.
- source_word: יֶלֶד יֻלַּד לָנוּ / בֵּן נִתַּן לָנוּ
  english_pob_choice: a child has been born to us / a son has been given to us
  chosen_korean: 우리에게 한 아이가 태어났고, 우리에게 한 아들이 주어졌으며
  alternatives_korean:
  - 우리에게 한 아이가 났고, 우리에게 한 아들이 주어졌으며
  - 우리에게 한 아이가 태어났습니다, 우리에게 한 아들이 주어졌습니다
  lexicon: HALOT
  rationale: 두 수동 완료형을 한국어에서 자연스러운 완료 서술로 살리되, 선물처럼 ‘주어졌’다는 점을 보존했습니다.
- source_word: הַמִּשְׂרָה עַל שִׁכְמוֹ
  english_pob_choice: the rule is on his shoulder
  chosen_korean: 다스림이 그의 어깨 위에 있습니다
  alternatives_korean:
  - 통치권이 그의 어깨 위에 있습니다
  - 정권이 그의 어깨 위에 있습니다
  - 다스림이 그의 어깨에 놓여 있습니다
  lexicon: HALOT
  rationale: מִשְׂרָה는 제도명보다 통치의 권위 자체를 가리키므로 ‘다스림’으로 옮기고, 어깨 이미지는 그대로 보존했습니다.
- source_word: פֶּלֶא יוֹעֵץ / אֵל גִּבּוֹר / אֲבִי עַד / שַׂר שָׁלוֹם
  english_pob_choice: Wonderful Counselor, Mighty God, Father of Eternity, Prince of Peace
  chosen_korean: 기묘한 조언자, 전능하신 하나님, 영원한 아버지, 평화의 통치자
  alternatives_korean:
  - 놀라운 조언자, 용사이신 하나님, 영원하신 아버지, 평화의 왕자
  - 기묘한 모사, 전능하신 하나님, 영원한 아버지, 평화의 군주
  lexicon: HALOT
  rationale: 왕호 연속을 살리면서 פֶּלֶא יוֹעֵץ의 놀라운 조언 능력, אֵל גִּבּוֹר의 강한 신적 의미, שַׂר שָׁלוֹם의 통치자 의미를 반영했습니다.
theological_decisions:
- issue: 메시아의 호칭들을 하나의 연속된 이름/칭호 묶음으로 처리할지 여부
  chosen_reading: 네 개의 호칭을 아동에게 주어진 왕적 칭호의 연속으로 읽고, 본문처럼 쉼표로 병렬 처리했습니다.
  alternative_readings:
  - 호칭 일부를 하나님 자신에 대한 설명으로 분리하는 읽기
  - ‘평화의 왕자’를 비유적 칭호로 완화하는 읽기
  rationale: 히브리어 구문은 명명 공식 안에서 연속된 칭호로 읽는 것이 가장 자연스럽고, 신적 강도를 약화시키지 않는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 이사야 9장 메시아적 예언의 문맥
- issue: אֵל גִּבּוֹר의 신적 강도
  chosen_reading: ‘전능하신 하나님’으로 옮겨 신적 의미를 약화하지 않았습니다.
  alternative_readings:
  - ‘용사이신 하나님’
  - ‘능하신 하나님’
  - ‘신적 영웅’
  rationale: 본문의 표현은 강한 신적 뉘앙스를 가지므로, 교리적 부담을 피하려고 약화하지 않고 직접적으로 옮기는 것이 원문 책임에 맞습니다.
  doctrine_reference: 히브리어 본문 의미 보존 원칙
