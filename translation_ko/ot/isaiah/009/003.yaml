id: ISA.9.3
reference: Isaiah 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
  footnotes:
  - marker: a
    text: Or 'the yoke of his load' or 'the yoke of his oppression.'
    reason: lexical_alternative
  - marker: b
    text: '''The day of Midian'' likely recalls the LORD''s defeat of Midian in the days of Gideon (Judg 7).'
    reason: cross_reference
  - marker: c
    text: Hebrew has a perfect verb, 'you have shattered,' a prophetic way of speaking of God's victory as certain; some translations render it 'you will shatter.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그의 멍에의 무거운 짐과 그의 어깨의 막대기, 그의 압제자의 몽둥이를, 미디안의 날처럼 부러뜨리셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멍에의 무거운 짐’은 ‘멍에’와 ‘짐/압제’를 함께 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘미디안의 날’은 사사기 7장에서 미디안을 무찌르신 일을 가리키는 말로 이해할 수 있습니다.
    reason: cross_reference
  - marker: c
    text: 히브리어는 완료형을 사용하지만, 예언적으로는 하나님의 승리를 이미 이루어진 일처럼 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹל סֻבֳּלוֹ
  english_pob_choice: the yoke of his burden
  chosen_korean: 그의 멍에의 무거운 짐
  alternatives_korean:
  - 그의 짐의 멍에
  - 그의 압박의 멍에
  lexicon: HALOT
  rationale: עֹל의 ‘멍에’와 סֻבֳּל의 ‘짐/부담’을 둘 다 살려, 압제의 이미지를 유지하면서도 한국어로 자연스럽게 들리도록 옮겼습니다.
- source_word: מַטֵּה שִׁכְמוֹ
  english_pob_choice: the staff on his shoulder
  chosen_korean: 그의 어깨의 막대기
  alternatives_korean:
  - 그의 어깨 위의 지팡이
  - 그의 어깨에 얹힌 채찍
  lexicon: HALOT
  rationale: 문맥상 어깨 위에 얹혀 짐을 지우는 도구를 가리키므로, ‘막대기’로 옮겨 ‘staff/rod’의 물리적 이미지를 유지했습니다.
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  english_pob_choice: the rod of his oppressor
  chosen_korean: 그의 압제자의 몽둥이
  alternatives_korean:
  - 그를 몰아붙이는 자의 막대
  - 그를 부리는 자의 채찍
  lexicon: HALOT
  rationale: נֹגֵשׂ의 강압적 성격을 ‘압제자’로, שֵׁבֶט의 징벌 도구 성격을 ‘몽둥이’로 옮겨, 단순한 ‘지팡이’보다 억압의 뉘앙스를 분명히 했습니다.
- source_word: הַחִתֹּתָ
  english_pob_choice: you have shattered them
  chosen_korean: 부러뜨리셨기 때문입니다
  alternatives_korean:
  - 산산이 부수셨기 때문입니다
  - 깨뜨리셨기 때문입니다
  lexicon: HALOT
  rationale: חִתֵּת의 ‘부수다/꺾다/부러뜨리다’ 의미를 따라, 이미 이루어진 구원 행위를 한국어 완료형으로 표현했습니다.
- source_word: כְּיוֹם מִדְיָן
  english_pob_choice: as on the day of Midian
  chosen_korean: 미디안의 날처럼
  alternatives_korean:
  - 미디안의 날과 같이
  - 미디안 때처럼
  lexicon: HALOT
  rationale: 사사기 7장을 떠올리게 하는 역사적 비교를 간결하게 유지하기 위해 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 예언적 완료시제의 처리
  chosen_reading: ‘부러뜨리셨기 때문입니다’로 옮겨, 이미 성취된 일처럼 말하는 예언적 완료의 힘을 살렸습니다.
  alternative_readings:
  - ‘부러뜨리실 것이기 때문입니다’로 미래화하기
  rationale: 히브리어 완료형이 하나님의 확실한 구원을 현재 완료처럼 선포하는 효과를 가지므로, 이를 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 미디안의 날의 암시
  chosen_reading: ‘미디안의 날’로 남겨, 사사기 7장의 야훼의 निर्ण적 승리를 독자가 떠올리게 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘기드온 때의 미디안 패배처럼’으로 옮기기
  rationale: 본문의 역사적 암시를 보존하는 편이 원문의 수사적 효과에 더 충실합니다.
  doctrine_reference: Cross-reference handling
