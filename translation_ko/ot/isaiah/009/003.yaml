  source_fidelity: 히브리어의 세 병렬 목적어(짐의 멍에, 어깨의 막대기, 압제자의 막대)와 2인칭 남성 단수 완료형을 대체로 반영했으나, 초안의 ‘그의 멍에의 무거운 짐’은 히브리어의 결속 관계를 어색하게 뒤집어 보이게 합니다. ‘그를 짓누르던 멍에’는 멍에와 짐의 억압 이미지를 자연스럽게 보존합니다. 완료형은 존대 과거완료 표현으로 유지합니다.
  naturalness: ‘그의 멍에의 무거운 짐’, ‘그의 어깨의 막대기’는 현대 표준 한국어에서 부자연스럽고 소유 관계도 불명확합니다. ‘그를 짓누르던 멍에’, ‘그의 어깨 위의 막대기’, ‘그를 압제하는 자의 몽둥이’로 고치면 문장이 자연스럽고 각 형상이 분명해집니다. 각주 표지도 해당 어구와 동사에 붙여 참조 범위를 분명히 했습니다.
  terminology: ‘멍에’, ‘막대기’, ‘몽둥이’, ‘압제하다’, ‘미디안’은 문맥과 합쇼체 문체에 적절합니다. שֵׁבֶט의 징벌적·강압적 뉘앙스를 ‘몽둥이’로 유지하되, 본문에 해석적 내용을 추가하지 않았습니다.
