    rationale: עֲלֵיהֶם의 ‘그들 위에/위로’라는 방향성을 유지하면서 빛이 비치는 동사와 더 자연스럽게 결합합니다.
  revised_text: 어둠 속을 걷는 백성은 큰 빛을 보았습니다. 깊은 어둠의 땅에 사는 이들 위로 빛이 비쳤습니다.[a]
