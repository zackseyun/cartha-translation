id: ISA.9.1
reference: Isaiah 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
  footnotes:
  - marker: a
    text: Or, 'a land of the shadow of death.' The Hebrew term צַלְמָוֶת is traditionally rendered this way, though it can also denote deep darkness or gloom more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠 속을 걷던 백성은 큰 빛을 보았습니다. 깊은 어둠의 땅에 사는 이들 위에 빛이 비쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 그늘’. 히브리어 צַלְמָוֶת은 전통적으로 이렇게 번역되지만, 더 일반적으로는 깊은 어둠이나 짙은 어둠을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: The people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 히브리어 עָם의 집단성을 살리면서도 한국어에서 자연스럽고 구약적 문맥에 잘 맞는 표현으로 ‘백성’을 선택했습니다.
- source_word: הַהֹלְכִים בַּ/חֹשֶׁךְ
  english_pob_choice: walking in darkness
  chosen_korean: 어둠 속을 걷던
  alternatives_korean:
  - 어둠 속을 걷는
  - 어둠 가운데 걷는
  lexicon: HALOT
  rationale: 분사적 진행성을 살리되, 예언적 선포의 회상적 뉘앙스를 반영해 ‘걷던’으로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness
  chosen_korean: 깊은 어둠
  alternatives_korean:
  - 죽음의 그늘
  - 사망의 그늘
  - 짙은 어둠
  lexicon: HALOT
  rationale: 이 단어는 관용적으로 ‘깊은 어둠/짙은 어둠’의 뜻을 가질 수 있어 본문에는 직역보다 원뜻을 드러내는 표현을 택했습니다.
- source_word: נָגַהּ עֲלֵיהֶם
  english_pob_choice: light has shone on those
  chosen_korean: 빛이 비쳤습니다
  alternatives_korean:
  - 빛이 그들 위에 비쳤습니다
  - 빛이 그 위에 비추었습니다
  lexicon: HALOT
  rationale: נָגַהּ의 ‘비치다/빛나다’ 의미를 자연스러운 한국어로 옮기되, עליהם의 ‘위에’라는 방향성을 문장 전체에서 유지했습니다.
theological_decisions:
- issue: צַלְמָוֶת의 전통적 표현을 본문에 둘지 여부
  chosen_reading: 본문에는 ‘깊은 어둠’을 두고, 전통적 ‘죽음의 그늘’은 각주로 처리합니다.
  alternative_readings:
  - 죽음의 그늘
  - 사망의 그늘
  rationale: 문맥상 죽음 자체보다 극심한 어둠의 상태를 가리키는 관용적 표현으로 읽는 것이 더 직접적이지만, 전통 번역의 신학적·문학적 울림도 보존해야 하므로 주석으로 남깁니다.
  doctrine_reference: '번역 원칙: 원어 의미 우선, 전통 용례 보존은 각주로 처리'
