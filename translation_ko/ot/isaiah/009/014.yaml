  - marker: b
    text: Or 'the prophet teaching lies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 연장자와 높은 지위에 있는 사람이 머리[a]이며, 거짓을 가르치는 예언자는 꼬리입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나이 든 사람과 높은 지위에 있는 사람’입니다. 히브리어 표현은 문자적으로 ‘얼굴이 들어 올려진 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  english_pob_choice: elder
  chosen_korean: 늙은 자
  alternatives_korean:
  - 장로
  - 나이 많은 사람
  lexicon: HALOT
  rationale: 문맥상 지혜로운 연장자라는 직분보다 나이 든 사람의 집단을 가리키며, 뒤의 대구와 함께 사회적 지위를 말하므로 직분어인 장로보다 중립적인 ‘늙은 자’가 원문에 더 가깝습니다.
- source_word: וּנְשׂוּא פָנִים
  english_pob_choice: and the honored man
  chosen_korean: 존귀한 사람
  alternatives_korean:
  - 높임을 받은 사람
  - 얼굴이 높임을 받은 사람
  - 높은 지위의 사람
  lexicon: HALOT
  rationale: 직역인 ‘얼굴이 들어 올려진’은 한국어에서 매우 낯설어, 원문의 존중·지위 의미를 살리되 지나친 해석을 피하는 ‘존귀한 사람’으로 옮겼습니다.
- source_word: הוּא הָרֹאשׁ
  english_pob_choice: is the head
  chosen_korean: 머리
  alternatives_korean:
  - 머리입니다
  - 우두머리
  lexicon: HALOT
  rationale: 원문의 비유를 그대로 살리기 위해 신체 은유를 유지했습니다. 문장 내에서는 앞의 주어들과 함께 병렬로 읽히므로 ‘머리입니다’보다 간결한 서술형으로 처리했습니다.
- source_word: וְנָבִיא מוֹרֶה שֶּׁקֶר
  english_pob_choice: and the prophet who teaches falsehood
  chosen_korean: 거짓을 가르치는 예언자
  alternatives_korean:
  - 거짓말을 가르치는 예언자
  - 거짓을 가르치는 선지자
  lexicon: HALOT
  rationale: מוֹרֶה는 지속적 행위의 분사로 이해되어 ‘가르치는’이 적절하며, שֶׁקֶר는 단순한 거짓말보다 더 넓은 ‘거짓’을 뜻하므로 그 의미를 유지했습니다.
- source_word: הוּא הַזָּנָב
  english_pob_choice: is the tail
  chosen_korean: 꼬리
  alternatives_korean:
  - 꼬리입니다
  - 꼬리 역할을 합니다
  lexicon: HALOT
  rationale: 머리/꼬리의 대조라는 예언적 은유를 보존하기 위해 해설을 덧붙이지 않고 직접 옮겼습니다.
theological_decisions:
- issue: 신체 은유 ‘머리’와 ‘꼬리’의 처리
  chosen_reading: 지도층과 비천함을 설명으로 풀지 않고, 원문의 강한 대조 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 지도자와 하층민
  - 우두머리와 뒤따르는 자
  rationale: 이 구절은 다음 절의 전개와 맞물려 상징적 판단을 드러내므로, 은유를 평탄화하면 예언적 수사와 비판의 강도가 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §6
