base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
  footnotes:
  - marker: a
    text: Or 'the old man and the man of high rank.' The Hebrew expression literally reads 'the elder and one lifted up of face.'
