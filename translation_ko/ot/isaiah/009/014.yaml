revisions:
- from: 늙은 자와 존귀한 사람이 머리[a]이며, 거짓을 가르치는 예언자는 꼬리입니다.
  to: 연장자와 높은 지위에 있는 사람이 머리[a]이며, 거짓을 가르치는 예언자는 꼬리입니다.
  rationale: 현대 합쇼체의 자연스러움을 위해 ‘늙은 자’를 ‘연장자’로 고치고, 원문의 관용 표현이 가리키는 사회적 위상을 더 분명히 하기 위해 ‘존귀한 사람’을 ‘높은 지위에 있는 사람’으로 고쳤습니다. 머리와 꼬리의 은유, 거짓을 가르치는 예언자라는 비판적 표현, 그리고 집합적 단수 구조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
