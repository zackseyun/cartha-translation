  source_fidelity: 히브리어의 대조 구조와 ‘머리/꼬리’ 은유를 정확히 보존합니다. זָקֵן은 직분으로 한정하지 않은 ‘연장자’로, נְשׂוּא פָנִים는 사회적으로 높임을 받는 사람이라는 뜻을 드러내는 ‘높은 지위에 있는 사람’으로 옮기는 것이 적절합니다.
  naturalness: ‘늙은 자’는 현대 표준 한국어에서 다소 낡고 경멸적으로 들릴 수 있어, 현대 합쇼체 성경 문체에는 ‘연장자’가 더 자연스럽고 중립적입니다. 수정문은 원문의 단수 집합적 용법과 병렬을 자연스럽게 유지합니다.
  terminology: ‘예언자’, ‘거짓’, ‘머리’, ‘꼬리’는 현대적이면서도 원문의 핵심 용어와 은유를 충실히 반영합니다. ‘존귀한 사람’보다 ‘높은 지위에 있는 사람’이 נְשׂוּא פָנִים의 사회적 신분·명예의 뉘앙스를 더 분명히 전달합니다.
