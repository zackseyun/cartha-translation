lexical_decisions:
- source_word: וְהָעָם
  english_pob_choice: But the people
  chosen_korean: 그러나 그 백성은
  alternatives_korean:
  - 그리고 그 백성은
  - 그런데 그 백성은
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 선언과 대비되므로 접속 וְ는 단순 나열보다 역접으로 옮기는 것이 자연스럽습니다. הָעָם은 구체적으로 ‘그 백성’으로 옮겨, 문맥의 지시성을 살렸습니다.
- source_word: לֹא שָׁב
  english_pob_choice: did not return
  chosen_korean: 돌아오지 않았고
  alternatives_korean:
  - 돌이키지 않았고
  - 회개하지 않았고
  lexicon: HALOT
  rationale: שׁוּב는 기본적으로 ‘돌아오다/돌이키다’이므로, 여기서는 하나님께로의 회귀를 드러내는 ‘돌아오다’가 가장 직접적입니다. ‘회개하다’는 해석을 더 강하게 넣으므로 피했습니다.
- source_word: עַד הַמַּכֵּהוּ
  english_pob_choice: to him who struck them
  chosen_korean: 자기들을 치신 분께
  alternatives_korean:
  - 자기들을 치신 이에게
  - 자기들을 치신 자에게
  lexicon: HALOT
  rationale: 히브리어의 단수 목적어 표지를 살리면서도, 집합명사 הָעָם에 맞게 한국어에서는 복수 대상 ‘자기들을’로 자연스럽게 옮겼습니다. ‘분’은 하나님을 가리키는 인격적 표현을 유지합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주님
  - 야훼 군대의 하나님
  lexicon: HALOT
  rationale: 본문의 신명 יְהוָה는 관례대로 ‘야훼’로 직접 옮기고, צְבָאוֹת는 ‘만군’으로 번역해 전통적이고도 원문에 가까운 직설성을 살렸습니다. 한국어 성경에서 자연스러운 호칭인 ‘하나님’을 붙여 전체를 매끄럽게 했습니다.
- source_word: לֹא דָרָשׁוּ
  english_pob_choice: did they seek
  chosen_korean: 찾지 않았습니다
  alternatives_korean:
  - 구하지 않았습니다
  - 찾아 구하지 않았습니다
  lexicon: HALOT
  rationale: דָרַשׁ는 하나님을 향한 ‘구하다/찾다’의 뜻을 가지므로, 단순 정보 탐색이 아닌 신앙적 의지의 결핍을 드러내는 ‘찾다’가 적절합니다. 앞 절과의 병렬도 고려해 문체를 통일했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명 יהוה가 직접 나오므로, POB 기준에 따라 고유 신명인 ‘야훼’를 유지했습니다. 이는 전통적 대치어보다 원천 텍스트의 식별성을 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
