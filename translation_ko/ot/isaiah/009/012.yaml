translation:
  language: ko
  text: 그러나 그 백성은 자기들을 치신 분께 돌아오지 않았고, 만군의 야훼[a]를 찾지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로는 ‘만군의 여호와’입니다.
