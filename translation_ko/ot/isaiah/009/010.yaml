id: ISA.9.10
reference: Isaiah 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׂגֵּ֧ב יְהוָ֛ה אֶת צָרֵ֥י רְצִ֖ין עָלָ֑י/ו וְ/אֶת אֹיְבָ֖י/ו יְסַכְסֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
  footnotes:
  - marker: a
    text: Or 'made strong' or 'exalted' the adversaries of Rezin against him.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew keeps the singular pronoun ('against him ... his enemies'); the broader context identifies the target as the northern kingdom/Ephraim.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 르신의 대적들을 그에게 맞서게 하시고, 그의 원수들을 부추기셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘강하게 하다’, ‘높이 세우다’, ‘일으키다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그에게 / 그의’라는 단수 대명사를 유지합니다. 넓은 문맥은 북왕국/에브라임을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  english_pob_choice: raised up
  chosen_korean: 맞서게 하시고
  alternatives_korean:
  - 일으키시고
  - 강하게 하시고
  - 높이시고
  lexicon: HALOT
  rationale: 이 동사는 원수를 '세우다/강하게 하다'는 뉘앙스를 가질 수 있지만, 전쟁·심판 문맥에서는 야훼께서 그 적대 세력을 르신에게 대항하도록 작동시키셨다는 뜻이 분명해집니다. 그래서 결과를 자연스럽게 드러내는 ‘맞서게 하시고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 표준 표기 관행
  rationale: יהוה는 직함이 아니라 고유한 신명으로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: צָרֵי רְצִין
  english_pob_choice: the adversaries of Rezin
  chosen_korean: 르신의 대적들
  alternatives_korean:
  - 르신의 원수들
  - 르신의 적대자들
  lexicon: HALOT
  rationale: construct 관계를 살리면서도 바로 뒤의 ‘원수들’과 중복을 피하기 위해 ‘대적들’로 번역했습니다.
- source_word: יְסַכְסֵךְ
  english_pob_choice: stirred up
  chosen_korean: 부추기셨습니다
  alternatives_korean:
  - 선동하셨습니다
  - 분쟁하게 하셨습니다
  - 자극하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 적대와 충돌을 일으키도록 자극·선동하는 뜻을 가지므로, 현대 한국어에서 그 동적 의미를 가장 분명히 드러내는 ‘부추기셨습니다’를 택했습니다.
theological_decisions:
- issue: 야훼의 주권적 심판 행위 표현
  chosen_reading: 야훼께서 르신의 대적들을 그에게 맞서게 하시고 그의 원수들을 부추기셨습니다.
  alternative_readings:
  - 야훼께서 ... 강하게 하셨습니다
  - 야훼께서 ... 일으키셨습니다
  rationale: 본문은 야훼가 단지 허용하신 것이 아니라 적대 세력을 적극적으로 움직여 심판을 실행하시는 모습을 보여 줍니다. 따라서 주권적 원인성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 섭리와 심판에 대한 성경적 표현
- issue: 히브리어의 단수 대명사 보존
  chosen_reading: 그에게 / 그의
  alternative_readings:
  - 이스라엘에게 / 이스라엘의
  - 에브라임에게 / 에브라임의
  rationale: 히브리어는 단수 대명사를 유지하지만, 문맥상 대상은 북왕국 전체로 넓게 이해됩니다. 본문이 드러내는 문법적 긴장을 보존하기 위해 한국어에서도 대명사를 유지했습니다.
  doctrine_reference: 원문이 가진 모호성 보존 원칙
