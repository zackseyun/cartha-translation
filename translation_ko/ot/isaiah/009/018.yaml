  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
  footnotes:
  - marker: a
    text: Or 'the land is burned up' or 'the land is darkened.' The Hebrew verb is rare and its precise nuance is debated; the immediate fire imagery supports the rendering 'is scorched.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 진노로 땅이 그슬리고, 백성은 불의 연료처럼 되었으며, 사람마다 자기 형제를 아끼지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 불타 버렸다’ 또는 ‘땅이 어두워졌다’. 히브리어 동사는 드물며 정확한 뉘앙스는 논의 중입니다. 바로 뒤의 불 이미지가 ‘그슬리고’라는 번역을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת יְהוָה צְבָאוֹת
  english_pob_choice: By the wrath of Yahweh of hosts
  chosen_korean: 야훼의 진노로
  alternatives_korean:
  - 야훼의 분노로
  - 만군의 야훼의 진노로
  lexicon: HALOT
  rationale: בְּ는 원인·수단의 뜻을 가지므로 한국어는 '-로'로 자연스럽게 옮겼고, עֶבְרָה는 ‘진노/분노’ 중 예언서의 심판 맥락에 맞는 ‘진노’로 좁혔습니다.
- source_word: נֶעְתַּם
  english_pob_choice: is scorched
  chosen_korean: 그슬리고
  alternatives_korean:
  - 불타 버리고
  - 어둑해지고
  lexicon: HALOT
  rationale: 희귀 동사로 정확한 뉘앙스가 논쟁적이지만, 바로 뒤의 불 이미지와 맞물리므로 완전 소멸보다 ‘그슬리다’가 원문의 화재 이미지를 잘 살립니다.
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  english_pob_choice: like fuel for the fire
  chosen_korean: 불의 연료처럼
  alternatives_korean:
  - 불에 먹힐 양식처럼
  - 불쏘시개처럼
  lexicon: HALOT
  rationale: 직역하면 ‘불이 먹는 것’이지만 현대 한국어에서는 ‘불의 연료’가 원문의 소비·소진 비유를 가장 자연스럽게 전달합니다.
- source_word: לֹא יַחְמֹלוּ
  english_pob_choice: no man spares his brother
  chosen_korean: 자기 형제를 아끼지 않습니다
  alternatives_korean:
  - 자기 형제를 불쌍히 여기지 않습니다
  - 자기 형제를 용서하지 않습니다
  lexicon: HALOT
  rationale: חמל은 ‘불쌍히 여기어 아끼다/너그럽게 봐주다’의 뜻이므로, 단순한 물리적 ‘아끼다’보다는 관계적 자비의 부재를 드러내는 표현으로 옮겼습니다.
theological_decisions:
