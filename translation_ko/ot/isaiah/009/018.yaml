  rationale: 본문은 신명기적 계약명 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 전통 교회어 ‘여호와’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
