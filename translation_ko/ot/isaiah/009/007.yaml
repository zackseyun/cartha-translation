  text: 주님께서 야곱에게 한 말씀을 보내셨고, 그것이 이스라엘 위에 떨어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께서 야곱에게 한 메시지를 보내셨고, 그것이 이스라엘 위에 떨어졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר
  english_pob_choice: a word
  chosen_korean: 한 말씀
  alternatives_korean:
  - 한 메시지
  - 한 말
  lexicon: HALOT
  rationale: דָּבָר는 여기서 예언적 선언을 가리키므로, 짧고 단호한 “한 말씀”이 POB의 ‘a word’를 자연스럽게 살리면서도 선언의 무게를 유지합니다.
- source_word: שָׁלַח
  english_pob_choice: sent
  chosen_korean: 보내셨고
  alternatives_korean:
  - 보내셨습니다
  - 파견하셨고
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘보내다’이므로, 주어의 행위를 간결하게 드러내는 “보내셨고”를 택했습니다.
- source_word: בְּיַעֲקֹב
  english_pob_choice: into Jacob
  chosen_korean: 야곱에게
  alternatives_korean:
  - 야곱 안에
  - 야곱에게로
  - 야곱을 향해
  lexicon: HALOT
  rationale: בְּ는 כאן에서 대상/방향을 나타낼 수 있으므로, 한국어에서는 자연스러운 여격 “야곱에게”로 옮겨 방향성을 살렸습니다.
- source_word: וְנָפַל
  english_pob_choice: and it fell
  chosen_korean: 그것이 … 떨어졌습니다
  alternatives_korean:
  - 그것이 … 내렸습니다
  - 그것이 … 임했습니다
  lexicon: HALOT
  rationale: נפל의 비유적 ‘떨어지다’는 반복되는 심판적 효과를 살리므로, ‘임하다’로 완화하지 않고 “떨어졌습니다”를 유지했습니다.
theological_decisions:
- issue: בְּיַעֲקֹב의 관계를 장소적 ‘안에’로 풀지, 대상을 향한 방향으로 읽을지
  chosen_reading: 대상/방향성을 살린 ‘야곱에게’
  alternative_readings:
  - 야곱 안에
  - 야곱에
  - 야곱을 향하여
  rationale: 문맥상 이어지는 ‘이스라엘 위에 떨어졌다’가 심판의 효력을 보여 주므로, 단순한 장소성보다 예언의 대상성을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence.'
