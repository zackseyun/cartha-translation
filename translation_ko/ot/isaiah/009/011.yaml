id: ISA.9.11
reference: Isaiah 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
  footnotes:
  - marker: a
    text: Or 'with full mouth,' that is, voraciously or completely.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from behind'; in this context, paired with 'from the east,' it likely means 'from the west.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아람은 동쪽에서, 블레셋은 서쪽에서 이스라엘을 탐욕스럽게 삼켰습니다[a]. 이 모든 일에도 그의 분노는 가시지 않았고, 그의 손은 여전히 뻗어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘온 입으로’입니다. 여기서는 적대적이고 탐욕스럽게 삼키는 모습을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 히브리어 고유명사를 직접 음역하여 원문 지시 대상을 드러내는 것이 적절합니다.
- source_word: מִקֶּדֶם
  english_pob_choice: from the east
  chosen_korean: 동쪽에서
  alternatives_korean:
  - 동쪽으로부터
  - 동방에서
  lexicon: HALOT
  rationale: 문맥상 אָחוֹר와 대구를 이루는 방향 표현이므로 ‘동쪽에서’로 자연스럽게 옮겼습니다.
- source_word: וַיֹּאכְלוּ אֶת יִשְׂרָאֵל בְּכָל פֶּה
  english_pob_choice: devoured Israel with full mouth
  chosen_korean: 이스라엘을 온전히 삼켰습니다
  alternatives_korean:
  - 이스라엘을 입을 가득 벌리고 삼켰습니다
  - 이스라엘을 전부 집어삼켰습니다
  lexicon: HALOT
  rationale: 직역하면 ‘온 입으로 먹다’이지만, 적대적 침식을 뜻하는 은유이므로 한국어에서는 ‘온전히 삼키다’로 압축해 의미와 힘을 살렸습니다.
- source_word: מֵאָחוֹר
  english_pob_choice: from the west
  chosen_korean: 서쪽에서
  alternatives_korean:
  - 뒤에서
  - 뒤쪽에서
  lexicon: HALOT
  rationale: ‘뒤에서’라는 직역보다 ‘동쪽에서’와 짝을 이루는 지리적 방향인 ‘서쪽에서’가 문맥을 더 정확히 드러냅니다.
- source_word: לֹא שָׁב אַפּוֹ וְעוֹד יָדוֹ נְטוּיָה
  english_pob_choice: his anger has not turned away, and his hand is still stretched out
  chosen_korean: 그의 분노는 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다
  alternatives_korean:
  - 그의 진노는 돌아서지 않았고, 그의 손은 아직 펴져 있습니다
  - 그의 노는 아직 거두어지지 않았고, 그의 손은 계속 뻗어 있습니다
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 ‘분노’로 옮기되, 예언적 심판 이미지는 ‘손은 여전히 뻗어 있습니다’로 간결하게 보존했습니다.
theological_decisions:
- issue: 반복되는 심판 선언의 화자와 대명사 참조
  chosen_reading: ‘그의’는 야훼의 계속되는 진노와 심판의 손을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 대명사를 더 모호하게 두어 특정 화자를 드러내지 않는 읽기
  rationale: 이 절은 이사야 9장의 반복적 후렴 속에 있으므로, 문맥상 주어는 야훼의 지속적인 심판 행위입니다.
  doctrine_reference: 이사야 9:12, 9:17, 9:21, 10:4의 반복 후렴
