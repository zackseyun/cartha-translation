  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי בָעֲרָ֤ה כָ/אֵשׁ֙ רִשְׁעָ֔ה שָׁמִ֥יר וָ/שַׁ֖יִת תֹּאכֵ֑ל וַ/תִּצַּת֙ בְּ/סִֽבְכֵ֣י הַ/יַּ֔עַר וַ/יִּֽתְאַבְּכ֖וּ גֵּא֥וּת עָשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
  footnotes:
  - marker: a
    text: Or 'they swirl upward in rising smoke.' The Hebrew of the final clause is difficult; the translation reflects the likely sense of smoke billowing upward.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 악이 불처럼 타올라 가시와 찔레를 삼키고, 숲의 덤불에 불을 붙이고, 연기가 부풀어 오르며 피어오르기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 어구의 히브리어는 해석하기 어렵습니다. 본문은 연기가 부풀어 오르며 위로 피어오르는 장면으로 이해하여 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה / רִשְׁעָה
  english_pob_choice: wickedness burns
  chosen_korean: 악이 불처럼 타올라
  alternatives_korean:
  - 악이 불처럼 탑니다
  - 사악함이 불처럼 타올라
  lexicon: HALOT
  rationale: רִשְׁעָה는 추상명사로서 도덕적 악을 가리키므로 '악'을 택했고, בָעֲרָה의 불타는 이미지는 한국어의 자연스러운 동사구 '불처럼 타올라'로 살렸습니다.
- source_word: שָׁמִיר וָשַׁיִת
  english_pob_choice: brier and thorn
  chosen_korean: 가시와 찔레
  alternatives_korean:
  - 가시덤불과 엉겅퀴
  - 가시와 엉겅퀴
  lexicon: HALOT
  rationale: 정확한 식물명은 불확실하므로, 전형적인 거친 잡초의 대립쌍을 살리는 일반적 표현으로 옮겼습니다.
- source_word: תֹּאכֵל
  english_pob_choice: it devours
  chosen_korean: 삼키고
  alternatives_korean:
  - 먹어치우고
  - 집어삼키고
  lexicon: HALOT
  rationale: 불이 태워 없애는 강한 소멸 이미지를 한국어에서 가장 자연스럽게 전달하는 동사는 '삼키다'입니다.
- source_word: סִבְכֵי הַיַּעַר
  english_pob_choice: the thickets of the forest
  chosen_korean: 숲의 덤불
  alternatives_korean:
  - 숲의 빽빽한 덤불
  - 숲의 숲속 덤불
  lexicon: HALOT
  rationale: סבך는 얽히고 빽빽한 덤불을 뜻하므로, 비교적 직관적인 '숲의 덤불'로 옮겨 원문의 이미지와 문체를 함께 유지했습니다.
- source_word: וַיִּתְאַבְּכוּ גֵּאוּת עָשָׁן
  english_pob_choice: and they roll upward in a column of smoke
  chosen_korean: 연기가 솟구쳐 오르기 때문입니다
  alternatives_korean:
  - 연기가 치솟기 때문입니다
  - 연기가 소용돌이치며 솟기 때문입니다
  lexicon: HALOT
  rationale: 마지막 절은 난해한 어구이므로, POB의 해석을 따라 연기의 상승·부풀어 오름을 한국어의 자연스러운 관용으로 반영했습니다.
theological_decisions:
- issue: 난해한 마지막 동사구 וַיִּתְאַבְּכוּ גֵּאוּת עָשָׁן의 처리
  chosen_reading: 연기가 솟구쳐 오르는 장면으로 이해하여, 불이 숲을 태운 결과가 연기처럼 치솟는다는 시각적 효과를 드러냈습니다.
  alternative_readings:
  - 연기가 소용돌이치며 올라간다
  - 연기 기둥이 되어 오른다
  rationale: 히브리어가 어렵고 POB도 해석적 번역을 택하므로, 과도한 단정 없이 핵심 영상인 상승하는 연기를 전달하는 쪽이 본문 의도를 더 잘 살립니다.
  doctrine_reference: 예언서의 시적 비유와 심판 이미지 해석
