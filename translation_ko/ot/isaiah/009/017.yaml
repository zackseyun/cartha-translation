  source_fidelity: 핵심 비유인 ‘악이 불처럼 타오름’, 가시나무류를 삼킴, 숲의 빽빽한 덤불에 불이 붙음, 그리고 연기가 위로 피어오르는 난해한 결말을 전반적으로 잘 반영합니다. 다만 וַתִּצַּת의 ‘불을 붙이다/타오르게 하다’라는 진행을 ‘태워’보다 분명히 드러내는 편이 낫고, 마지막 난해한 구절의 해석은 각주로 계속 한정할 필요가 있습니다.
