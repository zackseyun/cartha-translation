  source_fidelity: 전반적인 문장 구조와 심판의 지속이라는 의미는 원문에 충실합니다. 다만 חָנֵף는 단순히 ‘경건하지 않다’보다 ‘불경건하다/사악하다’라는 도덕·종교적 규탄을 나타내므로 더 직접적으로 옮기는 편이 좋습니다. נְבָלָה도 단순 지적 어리석음만이 아니라 수치스럽고 망령된 말의 뜻을 포함하므로 본문 표현을 보완했습니다.
