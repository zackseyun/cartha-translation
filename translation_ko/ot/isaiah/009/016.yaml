id: ISA.9.16
reference: Isaiah 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
  footnotes:
  - marker: a
    text: Hebrew literally, 'his young men ... his fatherless ... his widows'; the English uses 'their' to reflect the collective referent, the people as a whole.
    reason: lexical_alternative
  - marker: b
    text: Or 'every mouth speaks vile folly' or 'disgraceful things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주님은 그들의 청년들을 기뻐하지 않으시며 그들의 아버지 없는 자들과 과부들을 긍휼히 여기지 않으십니다. 이는 그들 모두가 경건하지 않고 악을 행하는 자이며, 모든 입이 어리석은 말을 하기 때문입니다. 이 모든 일에도 그의 분노는 아직 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 청년들 … 그의 아버지 없는 자들 … 그의 과부들’이지만, 문맥상 공동체 전체를 가리키므로 한국어에서는 ‘그들의’로 풀어도 됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어리석은 말’은 ‘망령된 말’, ‘수치스러운 말’ 또는 ‘추한 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이런 까닭에
  - 그래서
  lexicon: HALOT
  rationale: 앞의 책망을 받아 이어지는 결론을 나타내는 연결어로, 한국어에서는 ‘그러므로’가 가장 자연스럽고 인과의 힘도 잘 살립니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: HALOT
  rationale: 이사야에서 하나님을 가리키는 표준 호칭이므로, 직접적인 신적 호칭으로서 ‘주님’이 적절합니다.
- source_word: בַּחוּרָיו
  english_pob_choice: their young men
  chosen_korean: 그들의 청년들
  alternatives_korean:
  - 그의 청년들
  - 젊은 남자들
  lexicon: HALOT
  rationale: בָּחוּר는 이 문맥에서 ‘선택된 자’보다 청년/젊은 남자를 뜻하므로, POB의 집단적 소유 개념을 반영해 ‘그들의 청년들’로 옮겼습니다.
- source_word: יְתֹמָיו / אַלְמְנֹתָיו
  english_pob_choice: their fatherless ... their widows
  chosen_korean: 그들의 아버지 없는 자들 ... 과부들
  alternatives_korean:
  - 그들의 고아들 ... 과부들
  - 그들의 아비 없는 자들 ... 과부들
  lexicon: HALOT
  rationale: יָתוֹם의 사회·법적 뉘앙스를 살리기 위해 관용적 ‘고아’보다 직역에 가까운 ‘아버지 없는 자들’을 택했고, 과부들도 같은 집단 귀속으로 처리했습니다.
- source_word: חָנֵף וּמֵרַע
  english_pob_choice: godless and an evildoer
  chosen_korean: 경건하지 않고 악을 행하는 자
  alternatives_korean:
  - 불경건하고 악을 행하는 자
  - 하나님을 두려워하지 않고 악을 행하는 자
  lexicon: HALOT
  rationale: חָנֵף는 단순한 위선보다 신앙적 불경건/패역을 가리키므로 ‘경건하지 않고’로, מֵרַע는 행위적 성격을 드러내어 ‘악을 행하는 자’로 옮겼습니다.
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  english_pob_choice: every mouth speaks folly
  chosen_korean: 모든 입이 어리석은 말을 하기 때문입니다
  alternatives_korean:
  - 모든 입이 망령된 말을 하기 때문입니다
  - 모든 입이 추한 말을 하기 때문입니다
  lexicon: HALOT
  rationale: נְבָלָה는 어리석음과 수치스러운 언행을 함께 띠므로, 본문이 요구하는 도덕적·언어적 비난을 ‘어리석은 말’로 압축했습니다.
- source_word: לֹא שָׁב אַפּוֹ וְעוֹד יָדוֹ נְטוּיָה
  english_pob_choice: his anger has not turned away ... his hand is still stretched out
  chosen_korean: 그의 분노는 아직 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다
  alternatives_korean:
  - 그의 진노는 아직 물러서지 않았고, 그의 손은 여전히 뻗어 있습니다
  - 그의 노는 아직 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다
  lexicon: HALOT
  rationale: אַף는 관용적으로 분노를 뜻하므로 ‘분노’로 옮겼고, נטויה는 계속된 심판의 자세를 나타내어 ‘여전히 뻗어 있습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님의 지속적인 심판을 나타내는 반복 문구의 톤
  chosen_reading: ‘그의 손은 여전히 뻗어 있습니다’로, 심판이 아직 거두어지지 않았음을 현재적 상태로 유지했습니다.
  alternative_readings:
  - ‘그의 손은 아직도 펴져 있습니다’
  - ‘그의 손은 계속 뻗어 있습니다’
  rationale: 히브리어 종결부는 단순한 정적 묘사가 아니라 계속된 징계의 지속성을 강조하므로, 한국어에서도 현재 지속 상태를 분명히 드러내는 것이 본문의 경고 효과를 보존합니다.
  doctrine_reference: 예언서의 반복 후렴과 지속적 심판 표현
