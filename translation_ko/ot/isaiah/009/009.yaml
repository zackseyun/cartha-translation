  source_fidelity: ‘뽕나무’는 히브리어 שִׁקְמִים(시코모어무화과나무, Ficus sycomorus)를 한국의 일반적인 뽕나무로 동일시하여 식물명을 부정확하게 합니다. 또한 각주 표지가 문장 끝에 함께 놓여 있어 각각의 대상어에 직접 연결되지 않습니다. 나머지 건축 재료의 대비와 능동·수동 표현은 대체로 원문에 충실합니다.
  naturalness: 합쇼체 문장 자체는 자연스럽지만, ‘돌무화과나무’가 원문의 식물을 더 정확하고 현대적으로 전달합니다. ‘베어졌으나’는 나무가 잘려 쓰러진 수동 사건을 간결하게 나타냅니다.
  terminology: לְבֵנִים은 ‘벽돌’, גָזִית는 ‘다듬은 돌’, אֲרָזִים은 ‘백향목’으로 적절합니다. שִׁקְמִים은 ‘돌무화과나무’로 바로잡아야 하며, 각주에는 ‘시코모어무화과나무’라는 설명을 병기합니다.
