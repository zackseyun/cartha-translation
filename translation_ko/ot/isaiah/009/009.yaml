  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
  footnotes:
  - marker: a
    text: Or "hewn stone" for "cut stone."
    reason: lexical_alternative
  - marker: b
    text: '"Sycamores" refers to sycamore-fig trees.'
    reason: cultural_note
translation:
  language: ko
  text: 벽돌이 무너졌으나 우리는 다듬은 돌[a]로 다시 세울 것입니다. 돌무화과나무들[b]이 베어졌으나 우리는 그것들을 백향목으로 바꿀 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다듬은 돌’은 가공하거나 깎아 만든 석재를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌무화과나무’는 근동의 시코모어무화과나무를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  english_pob_choice: Bricks
  chosen_korean: 벽돌
  alternatives_korean:
  - 진흙벽돌
  - 벽돌
  lexicon: HALOT
  rationale: 일반적인 건축용 벽돌을 가리키며, 뒤의 ‘다듬은 돌’과 대비를 살리기 위해 표준적인 ‘벽돌’로 옮겼습니다.
- source_word: גָזִית
  english_pob_choice: cut stone
  chosen_korean: 다듬은 돌
  alternatives_korean:
  - 다듬은 석재
  - 깎은 돌
  - 사각돌
  lexicon: HALOT
  rationale: 가공한 석재라는 뜻을 자연스럽게 살리면서, 벽돌과의 질감 대비를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: שִׁקְמִים
  english_pob_choice: sycamores
  chosen_korean: 뽕나무
  alternatives_korean:
  - 시컴어 나무
  - 뽕나무
  - 무화과뽕나무
  lexicon: HALOT
  rationale: 여기서의 שִׁקְמִים은 근동의 시컴어-무화과나무를 가리키므로, 한국어로는 통용되는 식물명인 ‘뽕나무’로 옮기되 본문의 대비를 유지했습니다.
- source_word: נַחֲלִיף
  english_pob_choice: we will replace them with
  chosen_korean: 바꿀 것입니다
  alternatives_korean:
  - 대신할 것입니다
  - 교체할 것입니다
  - 바꿔 놓을 것입니다
  lexicon: HALOT
  rationale: 무언가를 더 좋은 것으로 대체하겠다는 뜻을 자연스럽게 살리되, 앞의 ‘뽕나무’와 뒤의 ‘백향목’ 사이의 교체 관계가 드러나도록 했습니다.
theological_decisions:
- issue: 이 발화의 태도
  chosen_reading: 심판 이후에도 더 좋은 재료로 다시 세우겠다는 교만하고 도전적인 결의를 드러내는 말투로 옮겼습니다.
  alternative_readings:
  - 중립적인 재건 선언
  rationale: 문맥상 자만에 찬 회복 의지를 표현하므로, 단순한 재건 설명으로 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
