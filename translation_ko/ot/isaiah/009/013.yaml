id: ISA.9.13
reference: Isaiah 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכְרֵ֨ת יְהוָ֜ה מִ/יִּשְׂרָאֵ֗ל רֹ֧אשׁ וְ/זָנָ֛ב כִּפָּ֥ה וְ/אַגְמ֖וֹן י֥וֹם אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
  footnotes:
  - marker: a
    text: That is, the whole range of the nation, from the exalted to the lowly; the imagery is explained in the following verse.
    reason: cross_reference
  - marker: b
    text: Or 'rush' for 'reed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘에서 머리와 꼬리, 야자나무 가지와 갈대를, 하루에 끊어 버리실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 높은 자에서 낮은 자에 이르는 나라 전체를 가리키는 이미지입니다. 이 은유는 다음 절에서 풀이됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘골풀’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  english_pob_choice: cut off
  chosen_korean: 끊어 버리실 것입니다
  alternatives_korean:
  - 잘라 버리실 것입니다
  - 끊으실 것입니다
  - 없애실 것입니다
  lexicon: HALOT
  rationale: כרת의 강한 제거·절단 의미를 한국어의 ‘끊어 버리다’로 옮겨, 단순한 이동이 아니라 심판적 제거를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יהוה를 신명 번역 전통의 대체 호칭이 아니라 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: רֹאשׁ וְזָנָב
  english_pob_choice: head and tail
  chosen_korean: 머리와 꼬리
  alternatives_korean:
  - 지도자와 추종자
  - 머리와 끝
  lexicon: HALOT
  rationale: 다음 절의 해설을 따라가되 본절은 본래의 몸짓 이미지 자체를 보존해야 하므로, 해석어보다 직유인 ‘머리와 꼬리’를 유지했습니다.
- source_word: כִּפָּה
  english_pob_choice: palm branch
  chosen_korean: 야자나무 가지
  alternatives_korean:
  - 야자수 가지
  - 종려나무 가지
  - 가지
  lexicon: HALOT
  rationale: כִּפָּה는 야자나무의 꼭대기/가지로 이해되므로, ‘palm branch’의 이미지를 자연스러운 한국어로 옮겨 ‘야자나무 가지’로 번역했습니다.
- source_word: וְאַגְמוֹן
  english_pob_choice: reed
  chosen_korean: 갈대
  alternatives_korean:
  - 부들
  - 습지풀
  - 풀
  lexicon: HALOT
  rationale: אגמון의 습지 식물 이미지를 한국어의 대표적 대응어 ‘갈대’로 옮겨, 앞의 ‘야자나무 가지’와의 대비를 살렸습니다.
theological_decisions:
- issue: 은유 보존과 해석 확장
  chosen_reading: ‘머리와 꼬리, 야자나무 가지와 갈대’를 본문에 그대로 유지했습니다.
  alternative_readings:
  - ‘지도자와 추종자, 높은 자와 낮은 자’로 해석하여 옮김
  rationale: 이 절은 다음 절에서 설명되는 대비 은유를 먼저 제시하므로, 본문에서 미리 풀어 쓰기보다 상징 이미지를 유지하는 편이 원문 구조와 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 제공하는 해석은 본문이 아니라 후속 절에서 확인
