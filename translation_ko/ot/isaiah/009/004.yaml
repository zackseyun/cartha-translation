id: ISA.9.4
reference: Isaiah 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָל סְאוֹן֙ סֹאֵ֣ן בְּ/רַ֔עַשׁ וְ/שִׂמְלָ֖ה מְגוֹלָלָ֣ה בְ/דָמִ֑ים וְ/הָיְתָ֥ה לִ/שְׂרֵפָ֖ה מַאֲכֹ֥לֶת אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/004.yaml
  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
  footnotes:
  - marker: a
    text: Or 'every boot that tramps in tumult'; the Hebrew expression is rare and difficult, and some render the first phrase more abstractly in terms of battle noise rather than footwear.
    reason: lexical_alternative
translation:
  language: ko
  text: 전투의 소용돌이 속에서 짓밟는 자의 신발마다와 피에 젖은 모든 옷이 불사르기 위한 것, 곧 불의 연료가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소용돌이 속에서 짓밟는 신발마다’; 히브리어 표현은 희귀하고 난해하여, 첫 구절을 전투 소리나 추상적 소란으로 더 넓게 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -것입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 말씀을 받는 설명·결과를 한국어 종결로 자연스럽게 이어 주되, 원문의 인과적 연결을 약화시키지 않기 위해 평서형 종결로 처리했습니다.
- source_word: סְאוֹן סֹאֵן
  english_pob_choice: boot of the tramping warrior
  chosen_korean: 전투의 소용돌이 속에서 짓밟는 자의 신발
  alternatives_korean:
  - 전투의 요란함 속에서 짓밟는 자의 신발
  - 짓밟는 군인의 부츠
  - 소용돌이치는 소리
  lexicon: HALOT
  rationale: 희귀하고 난해한 어구이므로 POB의 'boot' 해석을 따르되, בְּרַעַשׁ를 함께 반영해 무기보다 발에 신는 신발 이미지로 살렸습니다.
- source_word: בְּרַעַשׁ
  english_pob_choice: in the battle’s tumult
  chosen_korean: 전투의 소용돌이 속에서
  alternatives_korean:
  - 소용돌이 속에서
  - 요란함 속에서
  - 전쟁의 소란 속에서
  lexicon: HALOT
  rationale: '''battle''은 본문에 직접 없지만 전쟁 맥락이 분명하여, POB의 문맥화된 해석을 따라 רעש의 ‘요동·소란’ 의미를 전투 이미지로 구체화했습니다.'
- source_word: מְגוֹלָלָה בְדָמִים
  english_pob_choice: garment rolled in blood
  chosen_korean: 피에 젖은 모든 옷
  alternatives_korean:
  - 피로 둘둘 만 옷
  - 피 묻은 모든 옷
  - 혈에 굴려진 옷
  lexicon: HALOT
  rationale: ‘rolled in blood’의 직역보다 한국어에서 자연스럽고, 전투로 인해 피가 스며든 상태를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: מַאֲכֹלֶת אֵשׁ
  english_pob_choice: fuel for the fire
  chosen_korean: 불의 연료
  alternatives_korean:
  - 불쏘시개
  - 불의 먹이
  - 불을 위한 연료
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘불의 먹이’를 한국어에서 바로 살리기보다, POB의 ‘fuel for the fire’에 맞춰 현대적이면서도 은유를 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 전투 이미지의 구체화 여부
  chosen_reading: ‘전투의 소용돌이 속에서’로 옮겨, רעש의 소란을 단순한 소리보다 전쟁의 격랑으로 드러냈습니다.
  alternative_readings:
  - ‘소란 속에서’
  - ‘요란함 속에서’
  rationale: 문맥상 무력과 피 묻은 옷이 병렬되므로, 독자가 원문의 전쟁-종식 선언을 즉시 이해하도록 이미지화를 허용했습니다.
  doctrine_reference: 문맥 주해 및 시적 평행법
