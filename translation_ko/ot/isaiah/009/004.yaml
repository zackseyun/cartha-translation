    rationale: כָל이 이끄는 첫 명사구와 뒤의 옷 명사구를 한국어에서 자연스럽게 병렬해야 합니다.
  - severity: medium
    issue: 초안은 כִּי의 설명·근거 기능을 표시하지 않습니다.
    rationale: ‘… 때문입니다’로 처리하면 앞 문맥에 대한 원문의 인과·설명 연결을 한국어 문장 안에서 보존할 수 있습니다.
  - severity: medium
    issue: ‘전투의 소용돌이’는 רַעַשׁ의 기본 의미인 요동·소란보다 과도하게 시적이고, ‘전투’는 원문에 명시되지 않습니다.
