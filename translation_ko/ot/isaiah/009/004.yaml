revisions:
- from: 전투의 소용돌이 속에서 짓밟는 자의 신발마다와 피에 젖은 모든 옷이 불사르기 위한 것, 곧 불의 연료가 될 것입니다.[a]
  to: 이는 소란 속에서 짓밟는 자의 모든 신발과 피에 젖은 모든 옷은 불에 태울 것이며, 불의 연료가 될 것이기 때문입니다.[a]
  rationale: 문법 오류를 바로잡고 두 명사구의 병렬 관계를 명확히 했습니다. כִּי의 설명 기능을 ‘때문입니다’로 반영했으며, לִשְׂרֵפָה와 מַאֲכֹלֶת אֵשׁ의 목적·귀결 이미지는 ‘불에 태울 것이며, 불의 연료가 될’로 유지했습니다. 원문에 없는 ‘전투’의 명시적 보충은 본문에서 제거하고, 난해한 첫 어구의 대안은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:11Z'
