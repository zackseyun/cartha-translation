id: ISA.9.2
reference: Isaiah 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
  footnotes:
  - marker: a
    text: Some ancient versions and many translations read, 'you have increased its joy,' reflecting a Hebrew reading like לוֹ ('to it') instead of לֹא ('not').
    reason: textual_variant
  - marker: b
    text: Or 'they rejoice before you like the joy of harvest, like people rejoicing when they divide plunder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 그 민족을 번성하게 하셨으나, 기쁨은 크게 하지 않으셨습니다.[a] 그들은 추수 때 기뻐하듯 주 앞에서 기뻐하고, 사람들이 전리품을 나눌 때 환호하듯 기뻐합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 기쁨을 크게 하셨습니다.’ 여러 고대 역본과 많은 번역본은 לֹא(‘아니’) 대신 לוֹ(‘그에게/그것에’)에 해당하는 읽기를 반영합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들은 추수 때의 기쁨처럼, 사람들이 전리품을 나눌 때 환호하듯 주 앞에서 기뻐합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ
  english_pob_choice: have multiplied
  chosen_korean: 번성하게 하셨으나
  alternatives_korean:
  - 많게 하셨으나
  - 증가시키셨으나
  lexicon: HALOT
  rationale: 히필의 ‘많게 하다/불리다’라는 원인을 살려, 자연스러운 현대 한국어로는 ‘번성하게 하다’가 가장 힘을 잘 전달합니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 이 민족
  alternatives_korean:
  - 그 나라
  - 이 나라
  lexicon: HALOT
  rationale: 문맥상 단순한 개인 집단이 아니라 공동체 전체를 가리키므로 ‘민족’이 적절하며, 화자-청자 관점의 현장성을 살려 ‘이’로 옮겼습니다.
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  english_pob_choice: you have not increased the joy
  chosen_korean: 그 기쁨은 크게 하지 않으셨습니다
  alternatives_korean:
  - 그 기쁨을 크게 늘리지 않으셨습니다
  - 기쁨을 더하지 않으셨습니다
  lexicon: HALOT
  rationale: 히브리어 본문이 לֹא를 읽는 어려운 구문을 그대로 살려, ‘증가시키다’의 관용적 한국어인 ‘크게 하다’로 옮겼습니다. ‘그 기쁨은’은 대조를 분명히 하면서도 본문의 긴장을 유지합니다.
- source_word: שָׂמְחוּ לְפָנֶיךָ
  english_pob_choice: They rejoice before you
  chosen_korean: 그들은 … 주 앞에서 기뻐하며
  alternatives_korean:
  - 그들은 … 주님 앞에서 즐거워하며
  - 그들은 … 주의 면전에서 기뻐하며
  lexicon: HALOT
  rationale: לְפָנֶיךָ는 직역하면 ‘당신의 앞에서’이지만, 한국어에서는 하나님 앞의 예배적 방향성을 자연스럽게 드러내는 ‘주 앞에서’가 적절합니다.
- source_word: בְּחַלְּקָם שָׁלָל
  english_pob_choice: when they divide spoil
  chosen_korean: 사람이 전리품을 나눌 때처럼
  alternatives_korean:
  - 전리품을 나눌 때처럼
  - 약탈물을 분배할 때처럼
  lexicon: HALOT
  rationale: 전쟁 후 노획물을 나누는 장면을 가리키므로 ‘전리품’이 가장 자연스럽고, ‘사람이’는 히브리어 남성 복수의 일반적 용법을 한국어에서 무리 없이 풀어줍니다.
theological_decisions:
- issue: MT의 לֹא('not')를 따라 본문을 유지할 것인지, 많은 증거가 지지하는 לוֹ('to it') 의미로 매끈하게 읽을 것인지
  chosen_reading: 본문은 MT를 따라 ‘그 기쁨은 크게 하지 않으셨습니다’로 옮기고, 매끈한 독법은 본문 밖 주석으로만 남깁니다.
  alternative_readings:
  - ‘그 기쁨을 크게 하셨습니다’
  - ‘그 기쁨을 더하셨습니다’
  rationale: 원문이 가진 문장상의 긴장과 이사야 9:2의 사본 문제를 숨기지 않기 위해, 본문은 전승된 히브리어를 우선하고 더 자연스러운 읽기는 각주로 처리하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 사본 변이를 본문에서 은폐하지 않는 POB 번역 철학
