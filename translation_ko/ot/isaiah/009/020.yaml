source:
  edition: WLC
  text: מְנַשֶּׁ֣ה אֶת אֶפְרַ֗יִם וְ/אֶפְרַ֨יִם֙ אֶת מְנַשֶּׁ֔ה יַחְדָּ֥ו הֵ֖מָּה עַל יְהוּדָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
  footnotes:
  - marker: a
    text: Literally, 'Manasseh [against/devouring] Ephraim, and Ephraim [against/devouring] Manasseh.' The Hebrew omits the verb; 'devours' is supplied from the imagery of the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세는 에브라임을 삼키고, 에브라임은 므낫세를 삼킵니다.[a] 그들은 함께 유다를 대적합니다. 이 모든 일에도 그의 분노는 돌아서지 않았고, 그의 손은 아직도 뻗어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘므낫세가 에브라임을, 에브라임이 므낫세를’입니다. 히브리어에는 동사가 명시되어 있지 않으며, 여기의 ‘삼키다’는 앞절의 이미지를 따라 보충한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַשֶּׁה / אֶפְרַיִם / יְהוּדָה
  english_pob_choice: Manasseh / Ephraim / Judah
  chosen_korean: 므낫세 / 에브라임 / 유다
  alternatives_korean:
