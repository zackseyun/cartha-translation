  - 므낫세 / 에브라임 / 유대
  lexicon: HALOT
  rationale: 지파·왕국 이름은 현대 한국어 음역으로 옮기되, 한국 교회 전통의 관용형과 지나치게 충돌하지 않도록 표준적인 음역을 사용했습니다.
- source_word: מְנַשֶּׁה אֶת אֶפְרַיִם ... וְאֶפְרַיִם אֶת מְנַשֶּׁה
  english_pob_choice: Manasseh devours Ephraim, and Ephraim Manasseh
  chosen_korean: 므낫세가 에브라임을, 에브라임이 므낫세를 삼키며
  alternatives_korean:
  - 므낫세가 에브라임을 집어삼키고, 에브라임이 므낫세를 집어삼키며
  - 므낫세가 에브라임을 대적하고, 에브라임이 므낫세를 대적하며
  lexicon: HALOT
  rationale: 히브리어는 동사가 생략된 절로, 앞절의 식인적 이미지가 이어집니다. 단순한 '대적'으로 약화하지 않고 '삼키다'를 살려 원문과 POB의 해석을 반영했습니다.
- source_word: בְּכָל זֹאת לֹא שָׁב אַפּוֹ וְעוֹד יָדוֹ נְטוּיָה
  english_pob_choice: For all this his anger has not turned away, and his hand is still stretched out
  chosen_korean: 이 모든 일이 있어도 그의 분노는 돌아서지 않았고, 그의 손은 아직도 뻗어 있습니다
  alternatives_korean:
  - 이 모든 일에도 그의 진노는 물러서지 않았고, 그의 손은 여전히 뻗어 있습니다
  - 그런데도 그의 분노는 거두어지지 않았고, 그의 손은 아직도 펼쳐져 있습니다
  lexicon: HALOT
  rationale: '''אַפּ''의 관용적 뜻을 ''분노''로 옮기고, ''שׁוּב''은 분노가 ''돌아서지 않았다''는 한국어 표현으로 살렸습니다. ''손''의 이미지는 그대로 유지하되, 현재진행적 상태를 자연스럽게 표현했습니다.'
theological_decisions:
- issue: '''his anger''와 ''his hand''의 지시 대상'
  chosen_reading: 주어를 본문에 풀어 쓰지 않고 '그의'로 유지해, 문맥상 야훼의 심판이라는 점은 드러나지만 히브리어의 수사적 반복을 보존했습니다.
  alternative_readings:
  - '''야훼의 분노''와 ''야훼의 손''으로 명시'
  - '''주님의 진노''로 신학적으로 명료화'
  rationale: 이 절은 앞뒤 문맥에서 반복되는 심판 공식이므로 지시 대상은 분명합니다. 다만 원문 형식과 리듬을 살리기 위해 대명사를 유지했습니다.
  doctrine_reference: 원문 우선과 수사적 반복 보존
- issue: '''삼키다''의 강한 이미지'
  chosen_reading: 형제 지파 간의 적대가 아니라, 이전 절의 식인적 파괴 이미지를 이어받아 '삼키다'를 유지했습니다.
  alternative_readings:
  - '''서로 대적한다''로 완화'
  - '''서로 공격한다''로 일반화'
  rationale: 히브리어의 생생한 폭력 이미지를 약화시키면 문맥의 심판 강도가 줄어듭니다. POB의 해석을 따라 강한 동사를 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 예언 문학의 의도적 과장과 심판 이미지 보존
