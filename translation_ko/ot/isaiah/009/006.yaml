  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
  footnotes:
  - marker: a
    text: Or, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 왕권의 번성과 평강에는 끝이 없을 것입니다. 그는 다윗의 왕좌 위에서 그의 왕국을 다스리며, 그 왕국을 굳게 세우고 공의와 의로 붙드실 것입니다. 이제부터 영원까지 그러할 것입니다. 만군의 야훼의 열심이 이것을 이루실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: למרבה המשרה
  english_pob_choice: Of the increase of the dominion
  chosen_korean: 그 왕권의 번성
  alternatives_korean:
  - 그 통치의 증가
  - 그 다스림의 확장
  lexicon: HALOT
  rationale: ל־ + רבה는 단순한 증가가 아니라 이어지는 통치의 확대를 가리키므로, 왕권의 지속적 번성을 자연스럽게 살렸습니다.
- source_word: ולשלום אין קץ
  english_pob_choice: and of peace there will be no end
  chosen_korean: 평강에 끝이 없을 것이며
  alternatives_korean:
  - 평화에 끝이 없을 것이며
  - 평안이 끝나지 않을 것이며
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 정서적 평화보다 온전함과 번영을 포함하므로, POB의 선택을 따라 ‘평강’으로 옮겼습니다.
- source_word: מֵעתה וְעַד עוֹלָם
  english_pob_choice: from now on and forever
  chosen_korean: 이제부터 영원까지
  alternatives_korean:
  - 지금부터 영원히
  - 이때부터 영원까지
  lexicon: HALOT
  rationale: 현재 시점에서 시작해 무한히 지속되는 기간을 한국어로 간결하게 표현했습니다.
- source_word: קנאת יְהוָה צְבָאוֹת
  english_pob_choice: The zeal of Yahweh of Armies
  chosen_korean: 만군의 야훼의 열심
  alternatives_korean:
  - 만군의 야훼의 질투
  - 만군의 주의 열심
  lexicon: HALOT
  rationale: קִנְאָה는 여기서 배타적 질투보다 언약적 추진력과 성취 의지를 뜻하므로 ‘열심’이 문맥에 더 적합합니다. יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה צבאות의 한국어 처리와 전승어 대응
  chosen_reading: 주요 본문은 ‘만군의 야훼’로 두고, 전통적 교회 표현인 ‘만군의 주’나 ‘만군의 여호와’는 본문이 아니라 주석적 대안으로만 남깁니다.
  alternative_readings:
  - 만군의 주
  - 만군의 여호와
  rationale: 원문이 신명기적 고유명 יהוה를 직접 사용하므로, 프로젝트 기준에 따라 야훼를 본문에 반영해 명시성을 유지했습니다.
  doctrine_reference: YHWH rendering policy / source transparency
