    rationale: לֵאמֹר는 이어지는 9절의 발화를 도입합니다. 초안은 이를 서술 종결형 명사절로 바꾸어 문장을 끝내므로, 다음 절의 인용과의 문법적·담화적 연결이 끊깁니다.
