  lexicon: HALOT
  rationale: 다음 절의 인용을 여는 분사적 용법을 한국어 수식어로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 문맥상 ‘마음의 위대함’의 처리
  chosen_reading: 직역적 의미를 유지하되, 본문이 비판하는 자기고양의 뉘앙스를 드러내기 위해 ‘마음의 거만함’으로 옮겼습니다.
  alternative_readings:
  - 마음의 위대함
  - 마음의 크기
  rationale: 히브리어 관용구의 표면 의미를 그대로 두면 한국어 독자에게 긍정적으로 들릴 수 있어, 본문이 겨냥하는 교만의 의미를 분명히 했습니다.
  doctrine_reference: 예언서의 심판 선언에서의 윤리적 평가(교만에 대한 책망)
