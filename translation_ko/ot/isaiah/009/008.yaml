- source_word: וּ/בְ/גֹ֥דֶל לֵבָ֖ב
  english_pob_choice: and in arrogance of heart
  chosen_korean: 마음의 거만함으로
  alternatives_korean:
  - 마음의 위대함으로
  - 마음의 크기로
  - 마음의 교만함으로
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 크기’이지만, 문맥상 자기과시적 교만을 뜻하므로 그 함의를 살려 옮겼습니다.
- source_word: לֵ/אמֹֽר
