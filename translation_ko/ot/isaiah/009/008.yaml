id: ISA.9.8
reference: Isaiah 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדְעוּ֙ הָ/עָ֣ם כֻּלּ֔/וֹ אֶפְרַ֖יִם וְ/יוֹשֵׁ֣ב שֹׁמְר֑וֹן בְּ/גַאֲוָ֛ה וּ/בְ/גֹ֥דֶל לֵבָ֖ב לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
  footnotes:
  - marker: a
    text: Hebrew literally, 'in greatness of heart.' Here the idiom carries the sense of proud self-exaltation, hence 'arrogance of heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성은 알게 될 것입니다 — 에브라임과 사마리아 주민들, 곧 교만과 마음의 거만함으로 말하는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음의 위대함’입니다. 여기서는 관용구가 자기고양의 교만을 뜻하므로 이렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יָדְעוּ
  english_pob_choice: And ... will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알게 됩니다
  - 알 것입니다
  lexicon: HALOT
  rationale: 예언적 문맥에서 완료형의 결과적·미래적 뜻을 살려 자연스러운 미래형으로 옮겼습니다.
- source_word: הָ/עָ֣ם כֻּלּ֔/וֹ
  english_pob_choice: all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 백성
  - 백성 전체
  lexicon: HALOT
  rationale: 총체성을 간결하게 드러내는 한국어 표현으로 옮겼습니다.
- source_word: וּ/בְ/גֹ֥דֶל לֵבָ֖ב
  english_pob_choice: and in arrogance of heart
  chosen_korean: 마음의 거만함으로
  alternatives_korean:
  - 마음의 위대함으로
  - 마음의 크기로
  - 마음의 교만함으로
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 크기’이지만, 문맥상 자기과시적 교만을 뜻하므로 그 함의를 살려 옮겼습니다.
- source_word: לֵ/אמֹֽר
  english_pob_choice: who say
  chosen_korean: 말하는 자들입니다
  alternatives_korean:
  - 말하며
  - 말하는 사람들입니다
  lexicon: HALOT
  rationale: 다음 절의 인용을 여는 분사적 용법을 한국어 수식어로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 문맥상 ‘마음의 위대함’의 처리
  chosen_reading: 직역적 의미를 유지하되, 본문이 비판하는 자기고양의 뉘앙스를 드러내기 위해 ‘마음의 거만함’으로 옮겼습니다.
  alternative_readings:
  - 마음의 위대함
  - 마음의 크기
  rationale: 히브리어 관용구의 표면 의미를 그대로 두면 한국어 독자에게 긍정적으로 들릴 수 있어, 본문이 겨냥하는 교만의 의미를 분명히 했습니다.
  doctrine_reference: 예언서의 심판 선언에서의 윤리적 평가(교만에 대한 책망)
