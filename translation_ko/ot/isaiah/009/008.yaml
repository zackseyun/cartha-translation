translation:
  language: ko
  text: '온 백성, 곧 에브라임과 사마리아 주민들은 알게 될 것입니다. 그들은 교만과 마음의 거만함으로[a] 이렇게 말합니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘마음의 위대함’입니다. 여기서는 자기고양의 교만을 나타내므로 ‘마음의 거만함’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יָדְעוּ
  english_pob_choice: And ... will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알게 됩니다
  - 알 것입니다
  lexicon: HALOT
  rationale: 예언적 문맥에서 완료형의 결과적·미래적 뜻을 살려 자연스러운 미래형으로 옮겼습니다.
- source_word: הָ/עָ֣ם כֻּלּ֔/וֹ
