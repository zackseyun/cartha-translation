id: ISA.9.19
reference: Isaiah 9:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְזֹ֤ר עַל יָמִין֙ וְ/רָעֵ֔ב וַ/יֹּ֥אכַל עַל שְׂמֹ֖אול וְ/לֹ֣א שָׂבֵ֑עוּ אִ֥ישׁ בְּשַׂר זְרֹע֖/וֹ יֹאכֵֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
  footnotes:
  - marker: a
    text: Or 'He snatches on the right ... he devours on the left.' The Hebrew imagery may suggest violent grabbing for food rather than ordinary eating.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Each one eats the flesh of his arm.' This likely depicts extreme internal strife or self-destruction in cannibalistic imagery.
    reason: cultural_note
translation:
  language: ko
  text: 그는 오른쪽에서 베지만 배가 고프고, 왼쪽에서 먹지만 만족하지 못합니다[a][b]. 각 사람은 자기 팔의 살을 먹습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오른쪽에서 낚아채지만 … 왼쪽에서 삼키지만’으로 옮길 수 있습니다. 히브리어 이미지는 평범한 식사보다 폭력적으로 움켜쥐는 행위를 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘각 사람이 자기 팔의 살을 먹습니다’입니다. 이는 극심한 내부 분쟁 또는 자기파괴를 가리키는, 경우에 따라 식인적 이미지를 띤 묘사일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  english_pob_choice: He cuts
  chosen_korean: 베지만
  alternatives_korean:
  - 자르지만
  - 훔쳐 오지만
  - 낚아채지만
  lexicon: HALOT
  rationale: גזר의 기본 의미인 ‘자르다’와 문맥의 폭력적·결핍적 이미지를 함께 살리기 위해, 단순한 ‘자르다’보다 행동의 결과를 드러내는 ‘베다’ 계열을 택했습니다.
- source_word: עַל יָמִין / עַל שְׂמֹאול
  english_pob_choice: on the right / on the left
  chosen_korean: 오른쪽에서 / 왼쪽에서
  alternatives_korean:
  - 오른편에서 / 왼편에서
  - 오른쪽에 / 왼쪽에
  lexicon: HALOT
  rationale: 히브리어의 평행 구조를 한국어에서도 그대로 보이게 하려면 위치감이 분명한 ‘~에서’가 적절합니다.
- source_word: וְלֹא שָׂבֵעוּ
  english_pob_choice: but is not satisfied
  chosen_korean: 만족하지 못합니다
  alternatives_korean:
  - 배부르지 않습니다
  - 충족되지 않습니다
  - 배가 차지 않습니다
  lexicon: HALOT
  rationale: שׂבע의 핵심은 ‘배부름/충족됨’이지만, 이 절의 절박한 결핍과 평행법을 살리기 위해 자연스러운 현대어인 ‘만족하지 못하다’로 옮겼습니다.
- source_word: בְּשַׂר זְרֹעוֹ
  english_pob_choice: the flesh of his own arm
  chosen_korean: 자기 팔의 살
  alternatives_korean:
  - 자기 팔의 육체
  - 자기 팔의 고기
  - 자기 팔살
  lexicon: HALOT
  rationale: בָּשָׂר는 문자 그대로 ‘살/육체’이므로 끔찍한 신체 이미지를 보존하는 ‘살’을 택했고, זְרוֹעַ는 ‘팔’로 직역해 자기파괴적 은유를 드러냈습니다.
theological_decisions:
- issue: 폭력적 굶주림과 자기파괴의 이미지
  chosen_reading: ‘베지만… 만족하지 못합니다’와 ‘자기 팔의 살을 먹습니다’로, 단순한 빈곤이 아니라 공동체 내부의 파괴적 결말을 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 ‘거두지만… 배부르지 않습니다’로 옮김
  - 은유를 약화시켜 ‘자기 힘을 소모합니다’로 해석
  rationale: 본문의 강한 심판 이미지와 POB의 주석(폭력적 낚아채기/인육적 자기파괴 가능성)을 희석하지 않기 위해 직설적 표현을 유지했습니다.
  doctrine_reference: 사 9:19의 심판적 문맥과 공동체 붕괴의 묘사
- issue: 복수 동사와 단수 주어의 긴장
  chosen_reading: 한국어에서는 ‘각 사람은… 먹습니다’로 분배적 의미를 살리고, 뒤 절의 ‘먹습니다’를 자연스럽게 정리했습니다.
  alternative_readings:
  - ‘각자… 먹습니다’로 더 축약
  - ‘각 사람은… 먹으나’로 대조를 약화
  rationale: 히브리어의 분배적 단수/복수 긴장을 문법적으로 매끈하게 처리하되, 집단적 붕괴가 개인에게도 미치는 효과를 보존했습니다.
  doctrine_reference: 히브리어 분배법과 한국어 자연문장 균형
