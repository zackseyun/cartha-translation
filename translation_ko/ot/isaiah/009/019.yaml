- from: 그는 오른쪽에서 베지만 배가 고프고, 왼쪽에서 먹지만 만족하지 못합니다[a][b]. 각 사람은 자기 팔의 살을 먹습니다.
  to: 오른쪽에서 베어도 배고프고, 왼쪽에서 먹어도 배부르지 않습니다[a]. 각 사람은 자기 팔의 살을 먹습니다[b].
  rationale: 음식과 굶주림의 평행 안에서 שׂבע를 ‘배부르다’로 바로 옮겨 원문의 구체적 이미지를 회복했습니다. 문맥상 일반 인물을 가리키는 히브리어의 단수·복수 전환은 한국어에서 무표 주어와 ‘각 사람’의 분배 표현으로 자연스럽게 처리했습니다. 각주 b는 설명 대상인 마지막 문장에 붙였습니다.
