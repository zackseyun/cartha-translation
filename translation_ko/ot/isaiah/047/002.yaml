translation:
  language: ko
  text: 맷돌을 가져다가 가루를 빻으십시오. 머리 덮개를 벗고[a], 치마를 벗어 버리고[b], 다리를 드러내고[c], 강들을 건너십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리 덮개’는 ‘머리카락’ 또는 ‘머리칼’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘치마’는 ‘옷자락’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘다리’는 ‘허벅지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי / רֵחַיִם
  english_pob_choice: Take the millstones
  chosen_korean: 맷돌을 가져다가
  alternatives_korean:
  - 맷돌을 잡고
  - 맷돌을 들고
  lexicon: HALOT
  rationale: imperative לקח은 한국어에서 자연스러운 명령형인 “가져다가”로 옮기고, רֵחַיִם은 구체적 도구인 “맷돌”로 처리해 굴욕적인 강제 노동의 이미지를 살렸습니다.
- source_word: וְטַחֲנִי קָמַח
  english_pob_choice: and grind flour
  chosen_korean: 가루를 빻으십시오
  alternatives_korean:
  - 밀가루를 빻으십시오
  - 가루를 갈아 만드십시오
  lexicon: HALOT
  rationale: טחן은 ‘빻다/갈다’의 물리적 행위를 가리키므로, 현대 한국어에서 가장 직접적인 ‘빻다’를 택했습니다. קמח는 문맥상 곡물을 빻아 얻는 가루이므로 ‘가루’로 옮겼습니다.
- source_word: צַמָּתֵךְ / שֹׁבֶל / שׁוֹק
  english_pob_choice: your veil / your train / the leg
  chosen_korean: 면사포 / 치마자락 / 다리
  alternatives_korean:
  - 머리카락 / 옷자락 / 허벅지
  lexicon: HALOT
  rationale: 첫 항은 가려진 머리의 덮개를 뜻하는 것으로 보고 ‘면사포’를, אחר כך 연속되는 노출의 정도를 살리기 위해 ‘치마자락’과 ‘다리’를 택했습니다. 다만 צַמָּה 계열의 머리카락 가능성과 שׁוֹק의 ‘허벅지’ 가능성은 주석에 남겼습니다.
theological_decisions:
- issue: 노출 이미지의 수위
  chosen_reading: 문맥이 요구하는 수치와 굴욕의 연속 명령으로 번역하고, 본문이 허용하는 범위를 넘어 성적 의미를 강화하지 않았습니다.
  alternative_readings:
  - 더 노골적인 성적 노출로 읽는 번역
  rationale: 히브리어 동사들의 연쇄는 바벨론의 치욕적 강등을 보여 주지만, 번역이 그 수위를 임의로 높이면 원문을 넘어섭니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 것 이상으로 확대하지 말고, 해석상 긴장은 주해에 남긴다.'
