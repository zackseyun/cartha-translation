source:
  edition: WLC
  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
  footnotes:
  - marker: a
    text: Or 'with your enchantments' for 'with your spells.'
    reason: lexical_alternative
  - marker: b
    text: Or 'perhaps you may prevail'; the Hebrew verb can carry the sense of causing terror or overawing an opponent.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 네 주문들[가]과 네 많은 주술을 가지고 버텨 보십시오. 네가 젊은 시절부터 그것들을 위해 수고해 왔으니, 어쩌면 도움을 얻을 수 있을지 모릅니다. 어쩌면 두려움을 일으킬[나] 수 있을지 모릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 또는 ‘네 마술들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: 나
    text: 또는 ‘위압할 수 있을지 모릅니다’ 또는 ‘이겨 낼 수 있을지 모릅니다’. 히브리어 동사는 두려움을 일으키거나 상대를 위압하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  english_pob_choice: Stand now
  chosen_korean: 이제 서 보아라
  alternatives_korean:
  - 이제 서십시오
  - 이제 버티어 보아라
  lexicon: HALOT
  rationale: 여성 단수 명령형의 도전적 뉘앙스를 살리되, 문맥의 조롱조를 반영해 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בַחֲבָרַיִךְ
  english_pob_choice: with your enchantments / with your spells
  chosen_korean: 네 마술들
  alternatives_korean:
  - 네 주문들
  - 네 주술들
  lexicon: HALOT
  rationale: 문맥상 점술·주술적 행위를 가리키므로, 한국어에서는 지나치게 낯선 직역보다 ‘마술들’로 옮겨 의미를 분명히 했습니다.
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  english_pob_choice: with your many sorceries
  chosen_korean: 네 많은 주술들
  alternatives_korean:
  - 네 풍부한 주술들
  - 네 많은 마법들
  lexicon: HALOT
  rationale: רֹב의 ‘많음’과 כְּשָׁפִים의 주술 행위를 함께 살려, 반복적이고 다량의 주술 행위를 나타내도록 했습니다.
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  english_pob_choice: perhaps you may be able to profit
  chosen_korean: 어쩌면 유익을 얻을 수 있을지 모릅니다
  alternatives_korean:
  - 어쩌면 성공할 수 있을지 모릅니다
  - 어쩌면 도움이 될 수 있을지 모릅니다
  lexicon: HALOT
  rationale: הועיל은 ‘유익하다/도움이 되다’의 뜻이 있어, 조롱 섞인 가능성 제시를 ‘유익을 얻다’로 자연스럽게 반영했습니다.
- source_word: אוּלַי תַּעֲרֹוצִי
  english_pob_choice: perhaps you may inspire terror
  chosen_korean: 어쩌면 두려움을 일으킬 수 있을지 모릅니다
  alternatives_korean:
  - 어쩌면 위세를 보일 수 있을지 모릅니다
  - 어쩌면 사람들을 떨게 할 수 있을지 모릅니다
  lexicon: HALOT
  rationale: ערץ는 ‘두렵게 하다/떨게 하다’의 뜻이므로, 대상을 위압하는 효과를 한국어 동사구로 옮겼습니다.
theological_decisions:
- issue: 바벨론에 대한 조롱 섞인 명령의 어조
  chosen_reading: 본문의 명령과 ‘어쩌면’ 절을 진지한 권고가 아니라 심판 신탁의 비꼬는 어조로 유지했습니다.
  alternative_readings:
  - 중립적인 권고조로 완화하여 번역함
  rationale: 문맥 전체가 바벨론이 의지해 온 주술의 무력함을 조롱하는 심판 맥락이므로, 해설을 본문에 덧붙이지 않고 어조로만 드러냈습니다.
  doctrine_reference: '번역 원칙: 문맥이 드러내는 의미를 보존하되 과잉 해석은 본문에 삽입하지 않음.'
