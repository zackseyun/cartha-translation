  naturalness: ‘상실과 과부 됨’ 및 ‘당신의 마술의 큰 힘’은 현대 표준 한국어에서 다소 부자연스럽습니다. ‘자녀를 잃음과 과부가 됨’, ‘당신의 주문들이 지닌 막강한 힘’이 더 자연스럽고 원문의 병행도 보존합니다.
  terminology: ‘주술’과 ‘주문’은 각각 כְּשָׁפִים와 חֲבָרִים의 의미 영역을 구별하여 잘 전달합니다. 양보적 해석은 본문 문맥에 적절하되, 각주에서 원인·동반 해석 가능성을 보존해야 합니다.
