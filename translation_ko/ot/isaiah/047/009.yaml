  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
  footnotes:
  - marker: a
    text: Or 'completely' / 'in full.'
    reason: lexical_alternative
  - marker: b
    text: The final clauses may also be understood as 'because of your many sorceries and your very powerful spells' or 'with your many sorceries and your very powerful spells.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이 두 가지가 당신에게 순식간에, 하루 만에 닥칠 것입니다. 곧 자녀를 잃음과 과부가 됨입니다. 당신의 수많은 주술과 당신의 주문들이 지닌 막강한 힘에도 불구하고, 그것들이 온전히[a] 당신에게 닥칠 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히’, ‘충만하게’.
    reason: lexical_alternative
  - marker: b
    text: 마지막 두 전치사구는 ‘당신의 수많은 주술과 당신의 주문들이 지닌 막강한 힘 때문에’ 또는 ‘당신의 수많은 주술과 당신의 주문들이 지닌 막강한 힘과 함께’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה
  english_pob_choice: will come
  chosen_korean: 닥칠 것입니다
  alternatives_korean:
  - 올 것입니다
  - 임할 것입니다
  lexicon: HALOT
  rationale: 예언적 미래의 도래를 현대 한국어로 자연스럽게 살리면서, 재앙이 ‘오다’보다 더 강하게 ‘닥치다’는 뉘앙스를 반영했습니다.
- source_word: שְׁתֵּי אֵלֶּה
  english_pob_choice: these two things
  chosen_korean: 이 두 가지 일
  alternatives_korean:
  - 이 두 가지
  - 이 두 재앙
  lexicon: HALOT
  rationale: 히브리어의 여성형 복수 지시구를 한국어로는 구체화해, 앞의 두 심판을 자연스럽게 가리키도록 했습니다.
- source_word: שְׁכוֹל וְאַלְמֹן
  english_pob_choice: bereavement and widowhood
  chosen_korean: 상실과 과부 됨
  alternatives_korean:
  - 자녀 상실과 과부 됨
  - 상복과 과부 됨
  lexicon: HALOT
  rationale: 두 명사 모두 여성 의인화된 바벨론에게 닥칠 가족적 파괴를 가리키므로, ‘상실’과 ‘과부 됨’으로 직역에 가까우면서도 자연스럽게 옮겼습니다.
- source_word: כְּתֻמָּם
  english_pob_choice: in full measure
  chosen_korean: 온전히
  alternatives_korean:
  - 가득히
  - 완전히
  lexicon: HALOT
  rationale: ‘완전함/충만함’의 의미를 살려 재앙이 부분적으로가 아니라 전부 임함을 짧고 분명하게 표현했습니다.
- source_word: בְּרֹב כְּשָׁפַיִךְ בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  english_pob_choice: in spite of your many sorceries and the great power of your spells
  chosen_korean: 당신의 많은 주술과 당신의 마술의 큰 힘에도 불구하고
  alternatives_korean:
  - 당신의 많은 주술과 당신의 마술의 엄청난 힘에도 불구하고
  - 당신의 많은 주문과 당신의 마법의 큰 힘에도 불구하고
  lexicon: HALOT
  rationale: 문맥상 바벨론의 점술·주술적 의존을 가리키므로, 교회적 완곡어보다 원문의 occult 의미를 드러내는 ‘주술/마술’을 택했습니다.
theological_decisions:
- issue: בְּרֹב / בְּעָצְמַת의 관계사격
  chosen_reading: 양보적 의미(‘...에도 불구하고’)
  alternative_readings:
  - 원인적 의미(‘... 때문에’)
  - 수단/동반 의미(‘...와 함께’)
  rationale: 문맥에서 심판은 바벨론의 주술이 아니라 그 주술에도 불구하고 임하는 것으로 제시되므로, 경고의 수사를 보존하는 양보적 번역이 가장 적절합니다.
  doctrine_reference: 예언서의 심판 선언과 우상적/주술적 의존에 대한 하나님의 주권적 판결
