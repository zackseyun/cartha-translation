id: ISA.47.8
reference: Isaiah 47:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Now then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
  footnotes:
  - marker: a
    text: Or, “delicate one,” “pampered one,” or “voluptuous one.” The Hebrew describes luxurious self-indulgence.
    reason: lexical_alternative
  - marker: b
    text: Or, “I am, and there is nothing else.” The phrase is an arrogant claim of unrivaled status.
    reason: alternative_reading
  - marker: c
    text: Hebrew “know bereavement”; that is, experience the loss of children.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이 말을 들으십시오. 사치에 빠진 자여, 안전하게 앉아 있으며 마음속으로 ‘나는 나다. 나 외에는 아무도 없다’고 말하는 자여. 나는 과부처럼 앉지 않을 것이며, 자녀를 잃는 일도 알지 못할 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사치에 빠진 자’는 히브리어의 ‘부드러운/연약한’ 뜻을 문맥에 따라 해석한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 ‘나 외에는 아무것도 없다’로도 옮길 수 있으며, 독점적 지위를 자처하는 오만한 주장입니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 직역하면 ‘상실을 알다’이며, 곧 자녀를 잃는 일을 겪는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי זֹאת
  english_pob_choice: hear this
  chosen_korean: 이제 이 말을 들으십시오
  alternatives_korean:
  - 들으십시오, 이 말을
  - 이것을 들으십시오
  lexicon: HALOT
  rationale: 예언적 직접 호소를 자연스러운 현대 한국어 명령으로 옮기되, 시작 표지인 ‘이제’를 살려 전환의 긴장을 드러냈습니다.
- source_word: עֲדִינָה
  english_pob_choice: lover of luxury
  chosen_korean: 사치에 빠진 자여
  alternatives_korean:
  - 연약한 자여
  - 유약한 자여
  - 사치스러운 자여
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘연약함’보다 자기방종적 사치와 안락을 비판하는 뉘앙스가 강하므로, 윤리적 함의를 드러내는 표현을 택했습니다.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  english_pob_choice: who sit securely
  chosen_korean: 안전하게 앉아 있으며
  alternatives_korean:
  - 평안히 거주하며
  - 안심하고 앉아 있으며
  - 안전 속에 거하며
  lexicon: HALOT
  rationale: ‘앉다’의 이미지와 ‘lָבֶטַח’의 안정감을 함께 보존하면서, 현대 한국어에서 자연스럽게 읽히도록 다듬었습니다.
- source_word: אֲנִי וְאַפְסִי עוֹד
  english_pob_choice: I am, and there is no one besides me
  chosen_korean: ‘나는 나다. 나 외에는 아무도 없다’
  alternatives_korean:
  - ‘나는 나다. 내 밖에는 아무것도 없다’
  - ‘나는 나다. 나뿐이다’
  lexicon: HALOT
  rationale: 오만한 절대자 주장이라는 점을 살리면서, POB의 주석처럼 배타적 자기선언의 뜻이 분명하게 드러나도록 했습니다.
- source_word: שְׁכוֹל
  english_pob_choice: the loss of children
  chosen_korean: 자녀를 잃는 일
  alternatives_korean:
  - 자녀 상실
  - 자식 잃는 슬픔
  lexicon: HALOT
  rationale: 단순 불임이 아니라 실제 상실과 애통을 가리키므로, 현대 독자가 즉시 이해할 수 있는 구체적 표현을 택했습니다.
theological_decisions:
- issue: 바벨론의 자기선언을 하나님의 독점적 표현과 구분 없이 옮길지 여부
  chosen_reading: ‘나는 나다. 나 외에는 아무도 없다’로 옮겨, 문맥상 바벨론의 교만한 패러디임을 본문에서 지우지 않았습니다.
  alternative_readings:
  - ‘나는 존재한다. 다른 것은 없다’
  - ‘나 외에는 아무것도 없다’
  rationale: 이 표현은 본래 하나님께 돌려지는 절대성 언어를 바벨론의 입에 올려놓은 아이러니이므로, 본문이 지닌 신학적 긴장을 그대로 유지하는 번역이 필요합니다.
  doctrine_reference: 본문의 아이러니와 우상적 자기신격화를 구분해 읽는 예언서 해석
