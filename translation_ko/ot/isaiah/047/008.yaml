source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Now then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
  footnotes:
  - marker: a
    text: Or, “delicate one,” “pampered one,” or “voluptuous one.” The Hebrew describes luxurious self-indulgence.
    reason: lexical_alternative
  - marker: b
    text: Or, “I am, and there is nothing else.” The phrase is an arrogant claim of unrivaled status.
    reason: alternative_reading
  - marker: c
    text: Hebrew “know bereavement”; that is, experience the loss of children.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이 말을 들으십시오. 사치스러운 자[a]여, 안심하고 앉아 있으며 마음속으로 ‘나는 유일하며, 나 외에는 아무도 없다[b]. 나는 과부처럼 앉지 않을 것이며, 자녀를 잃는 일도 겪지 않을 것이다[c]’ 하고 말하는 자여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부드러운 자’, ‘연약한 자’, 또는 ‘사치에 빠진 자’로도 옮길 수 있습니다. 여기서는 사치와 안락에 빠진 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나 외에는 아무것도 없다’로도 옮길 수 있습니다. 이는 비할 데 없는 지위를 자처하는 오만한 주장입니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 직역하면 ‘사별을 알다’이며, 곧 자녀를 잃는 일을 겪는다는 뜻입니다.
    reason: lexical_alternative
