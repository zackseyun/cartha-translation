id: ISA.47.14
reference: Isaiah 47:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
  footnotes:
  - marker: a
    text: Or, 'There is no ember to warm by.' The Hebrew in this clause is difficult; the sense is that this fire is not a small, useful hearth-coal but a consuming blaze.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 그들은 지푸라기처럼 되어 버렸고, 불이 그들을 삼켜 버립니다. 그들은 불길의 손에서 자신을 구해 낼 수 없습니다. 이것은 몸을 녹일 숯도, 그 앞에 앉을 불도 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “손”의 관용을 살려 “불길의 손에서”로 옮길 수 있습니다. 여기서는 히브리어의 포획·지배 이미지를 자연스럽게 전달하는 쪽을 택했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 강한 지시·주의 환기를 오늘날 한국어에서 자연스럽게 살리기 위해 합쇼체 명령형을 사용했습니다.
- source_word: כְקַשׁ
  english_pob_choice: like stubble
  chosen_korean: 지푸라기처럼
  alternatives_korean:
  - 짚처럼
  - 그루터기처럼
  lexicon: HALOT
  rationale: קַשׁ의 건조하고 쉽게 타는 잔재 이미지를 한국어에서 가장 직관적으로 전달하는 표현으로 잡았습니다.
- source_word: מִיַּד לֶהָבָה
  english_pob_choice: from the hand of the flame
  chosen_korean: 불길의 손에서
  alternatives_korean:
  - 불꽃의 손에서
  - 불의 권세에서
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구의 실제 이미지를 보존하되, 한국어에서는 ‘~의 손에서’로 번역해 포획·지배의 감각을 살렸습니다.
- source_word: אֵין גַּחֶלֶת לַחְמָם
  english_pob_choice: There is no coal to warm oneself
  chosen_korean: 몸을 녹일 숯도
  alternatives_korean:
  - 몸을 덥힐 숯도
  - 따뜻해지게 할 숯도
  lexicon: HALOT
  rationale: 문맥상 가정용 불씨의 부재를 가리키므로, ‘몸을 녹일’로 기능적 의미를 살리고 ‘숯’은 현대 한국어에서 자연스러운 불씨 표지로 선택했습니다.
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  english_pob_choice: no fire to sit before
  chosen_korean: 그 앞에 앉을 불도 아닙니다
  alternatives_korean:
  - 그 앞에 앉아 있을 불도 아닙니다
  - 그 앞에 앉을 화롯불도 아닙니다
  lexicon: HALOT
  rationale: אוּר의 일반적 ‘불’과 앉아 머무는 장면을 살려, 기능적 대비가 드러나도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 재난의 성격과 범위
  chosen_reading: 이 구절은 바빌론의 조언자들과 점술적 지혜의 무력함을 겨냥한 파괴적 심판의 비유로 읽고, 종말론적 최종 형벌로 확대하지 않았습니다.
  alternative_readings:
  - 일반적 신적 심판의 보편 원리로 확장하는 읽기
  rationale: 문맥의 풍자는 현재의 역사적 심판을 강조하므로, 한국어 번역도 그 제한된 범위를 유지했습니다.
  doctrine_reference: 문맥 우선, 신학적 범위 과잉 확장 자제
