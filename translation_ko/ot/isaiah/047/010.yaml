  text: 당신은 자신의 악행을 의지하며 ‘아무도 나를 보지 못한다’라고 말하였습니다. 당신의 지혜와 지식이 당신을 그릇된 길로 이끌었으며, 당신은 마음속으로 ‘나는 존재하며, 나 외에는 아무도 없다’라고 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 존재하며, 나 외에는 다른 것은 없다.’ 히브리어 표현은 더 추상적으로 번역될 수 있으나, 여기서는 바벨론이 자신과 견줄 이가 없는 지위를 주장하는 것으로 보입니다.
    reason: alternative_reading
