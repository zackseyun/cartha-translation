id: ISA.47.1
reference: Isaiah 47:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
  footnotes:
  - marker: a
    text: Or 'Go down and sit in the dust.'
    reason: lexical_alternative
  - marker: b
    text: '''Virgin daughter Babylon'' is a poetic personification of the city/empire as a young royal woman.'
    reason: cultural_note
  - marker: c
    text: Or 'there is no throne' or 'with no throne.'
    reason: lexical_alternative
  - marker: d
    text: Or 'soft and pampered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내려오십시오. 처녀 딸 바벨론아, 티끌에 앉으십시오[a][b]. 보좌 없이 땅에 앉으십시오[c], 갈대아의 딸아. 이제는 사람들이 너를 더 이상 부드럽고 사치스러운 자라고 부르지 않을 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘티끌로 내려가 앉으십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘처녀 딸 바벨론’은 도시/제국을 젊은 왕실 여성으로 의인화한 시적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘보좌가 없다’ 혹은 ‘보좌 없이’의 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘부드럽고 사치스럽게 길들여진’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְדִי
  english_pob_choice: Come down
  chosen_korean: 내려오라
  alternatives_korean:
  - 내려가라
  - 내려오너라
  lexicon: HALOT
  rationale: 수치와 낮아짐을 드러내는 하향 명령형이므로, 예언적 책망의 어조를 살려 ‘내려오라’로 옮겼습니다.
- source_word: וּשְׁבִי / שְׁבִי
  english_pob_choice: sit / sit
  chosen_korean: 앉으라 … 앉으라
  alternatives_korean:
  - 앉아 있으라
  - 거하라
  lexicon: HALOT
  rationale: ‘머무르다’보다 낮은 자세를 취하라는 뜻이 강하므로 ‘앉으라’를 반복해 히브리어의 병렬을 살렸습니다.
- source_word: עַל עָפָר
  english_pob_choice: in the dust
  chosen_korean: 먼지에
  alternatives_korean:
  - 티끌 위에
  - 먼지 속에
  lexicon: HALOT
  rationale: 수치의 이미지를 한국어에서 가장 자연스럽게 살리는 표현은 ‘먼지에’이므로, 직역의 어색함을 피하면서도 굴욕의 비유를 유지했습니다.
- source_word: אֵין כִּסֵּא
  english_pob_choice: without a throne
  chosen_korean: 보좌가 없는
  alternatives_korean:
  - 보좌 없는
  - 왕좌가 없는
  lexicon: HALOT
  rationale: 왕권 상실의 상태를 분명히 드러내기 위해 ‘보좌’로 옮겼고, 히브리어의 명사구를 한국어 관형형으로 처리했습니다.
theological_decisions:
- issue: 바벨론의 여성화된 의인화와 조롱어조
  chosen_reading: ‘바벨론의 처녀 딸’, ‘갈대아의 딸’이라는 의인화를 그대로 살려, 도시/제국에 대한 예언적 조롱과 수치의 이미지를 보존했습니다.
  alternative_readings:
  - 단순히 ‘바벨론아’로 평탄화
  - ‘젊은 바벨론’처럼 일반화
  rationale: 본문의 힘은 바벨론을 왕실의 젊은 여인처럼 낮추는 비유에 있으므로, 이를 평탄화하면 심판 예언의 문학적·신학적 효과가 약해집니다.
  doctrine_reference: 예언서의 상징적 심판 언어와 도시 의인화
