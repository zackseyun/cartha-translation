id: ISA.47.3
reference: Isaiah 47:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
  footnotes:
  - marker: a
    text: Or, 'I will meet no man,' 'I will let no one intervene,' or similarly, 'I will not spare anyone.' The Hebrew of the final clause is difficult and admits several close renderings.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew ''man'' (אָדָם), here likely with generic human force: no human being will avert the judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 벌거벗은 몸이 드러나고, 참으로 당신의 수치가 보일 것입니다. 나는 원수를 갚겠으며, 아무도 봐주지 않겠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 구문은 어렵습니다. 또는 ‘나는 아무도 만나지 않겠습니다’, ‘나는 아무도 개입하게 하지 않겠습니다’로 옮길 수 있습니다. 여기서 ‘아무도’는 히브리어 ‘사람’(אָדָם)으로, 일반적인 인간을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּגָּל / עֶרְוָתֵךְ
  english_pob_choice: will be uncovered / your nakedness
  chosen_korean: 벌거벗음이 드러날 것입니다
  alternatives_korean:
  - 나체가 드러날 것입니다
  - 벌거벗은 모습이 드러날 것입니다
  lexicon: HALOT
  rationale: עֶרְוָה의 구체적 이미지인 ‘벌거벗음/나체’와 수치의 노출을 함께 살리면서, 한국어에서는 ‘드러나다’가 수동적 노출을 자연스럽게 전합니다.
- source_word: חֶרְפָּתֵךְ
  english_pob_choice: your disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 불명예
  lexicon: HALOT
  rationale: חֶרְפָּה는 사회적 수치와 모욕을 함께 뜻하므로, ‘수치’가 본문의 노골적인 shame-모티프를 가장 간결하게 유지합니다.
- source_word: נָקָם אֶקָּח
  english_pob_choice: I will take vengeance
  chosen_korean: 내가 복수를 행하겠고
  alternatives_korean:
  - 내가 원수를 갚겠고
  - 내가 보복하겠고
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로는 ‘복수를 행하다’보다 ‘원수를 갚다’가 더 흔하지만, 본문은 공적 심판의 어조가 강하므로 보복의 법정적 뉘앙스를 보존하기 위해 ‘복수를 행하다’를 택했습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 아무 사람도
  alternatives_korean:
  - 어떤 사람도
  - 인간도
  lexicon: HALOT
  rationale: 여기서 אָדָם은 보편적 인간을 가리키는 용법이므로, 성별을 부각하기보다 심판을 막을 수 있는 ‘아무 사람도’로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 마지막 절의 וְלֹא אֶפְגַּע אָדָם 해석
  chosen_reading: 아무 사람도 용서하지 않겠습니다
  alternative_readings:
  - 아무 사람도 만나지 않겠습니다
  - 아무도 개입하지 못하게 하겠습니다
  - 사람을 봐주지 않겠습니다
  rationale: 이 절은 문법적으로 압축되어 있고 의미가 여러 갈래로 읽히지만, 문맥상 바벨론에 대한 야훼의 징계가 인간의 호소나 중재로 누그러지지 않는다는 점이 핵심이므로, ‘용서하지 않겠습니다’로 심판의 비타협성을 드러냈습니다.
  doctrine_reference: Translation philosophy §3; contested Hebrew syntax; divine judgment context
