    rationale: וְלֹא אֶפְגַּע אָדָם의 פגע는 여기서 해석이 논쟁적입니다. 문맥상 ‘아무도 봐주지 않겠다’는 가능하지만, ‘용서하다’는 의미를 지나치게 특정할 수 있으므로 대안 독법을 해당 절의 각주에 보존해야 합니다.
  - severity: medium
    issue: 각주 b의 표지 위치가 각주 내용과 불일치함
    rationale: 각주는 אָדָם 및 마지막 절의 의미를 설명하지만 초안에서는 ‘복수를 행하겠고’ 뒤에 붙어 있습니다. ‘아무도 봐주지 않겠습니다’ 뒤에 붙여야 합니다.
  - severity: low
