review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 점성술 관련 병렬 표현은 대체로 잘 옮겼습니다. 그러나 עֲצָתַיִךְ는 이 문맥에서 ‘모략’으로 한정하기보다 ‘계책/책략’이 더 중립적이고 충실합니다. 또한 יַעַמְדוּ נָא וְיוֹשִׁיעֻךְ의 조롱 섞인 청유는 ‘나서서 … 구원하게 하십시오’보다 ‘일어나 … 구원해 보게 하십시오’가 더 정확히 드러냅니다.
  naturalness: 현대 격식체로 자연스럽게 다듬었습니다. ‘당신’은 바빌론을 여성 단수로 의인화하여 직접 부르는 히브리어의 수사적 호격을 한국어에서 보존하는 선택입니다.
  terminology: ‘하늘을 나누는 자들’은 난해한 הברו שמים의 가능한 이해를 보존하며, ‘별들을 살피는 자들’은 단순한 감상이 아니라 점성술적 관찰의 문맥을 자연스럽게 전달합니다. ‘달마다’는 לחדשים의 월별 예측이라는 주된 이해를 유지하되, 각주로 초하루/신월 관련 가능성을 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘많은 모략 때문에’
    rationale: עֵצָה는 조언, 계획, 계책을 폭넓게 가리킵니다. ‘모략’은 악의적 책동이라는 뜻을 더해 원문의 범위를 불필요하게 좁힙니다.
  - severity: medium
    issue: ‘그들이 나서서 당신을 구원하게 하십시오’
    rationale: 이 표현은 청자가 그들을 구원하도록 허락하거나 지시하는 듯 들릴 수 있습니다. 원문의 반어적 도전, 즉 ‘그들이 일어나 너를 구원해 보게 하라’를 더 분명히 해야 합니다.
  revised_text: 당신은 수많은 계책으로 지쳤습니다. 이제 그들이 일어나 당신을 구원해 보게 하십시오—하늘을 나누는 자들, 별들을 살피는 자들, 달마다 당신에게 닥칠 일을 알려 주는 자들 말입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “하늘을 구획하는 자들.” 히브리어 표현은 난해하며, 하늘을 점성술적 해석을 위해 여러 구역으로 나누는 점성가들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “신월마다 알려 주는 자들.” 히브리어는 월별 또는 신월 주기에 맞춘 예측을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘계책’으로 어휘 범위를 보존하고, 반어적 청유를 ‘구원해 보게 하십시오’로 명확히 했습니다. 난해한 점성술 용어와 월별/신월 관련 가능한 해석은 본문에 과도한 해석을 넣지 않고 각주로 처리했습니다.
