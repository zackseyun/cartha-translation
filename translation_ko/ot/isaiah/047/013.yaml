id: ISA.47.13
reference: Isaiah 47:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
  footnotes:
  - marker: a
    text: Or 'those who parcel out the heavens.' The Hebrew expression is difficult and likely refers to astrologers who divide the sky into sectors for interpretation.
    reason: lexical_alternative
  - marker: b
    text: Or 'who announce at the new moons.' The Hebrew may refer specifically to predictions tied to the monthly/new-moon cycle.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 많은 모략 때문에 지쳐 있습니다. 이제 그들이 나서서 당신을 구원하게 하십시오 — 하늘을 나누는 자들, 별들을 바라보는 자들, 달마다 앞으로 닥칠 일을 알려 주는 자들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִלְאֵית
  english_pob_choice: you are wearied
  chosen_korean: 지쳐 있습니다
  alternatives_korean:
  - 피곤해졌습니다
  - 지쳐 버렸습니다
  lexicon: HALOT
  rationale: 2인칭 여성 단수 완료형의 결과 상태를 현대 한국어로 자연스럽게 살리면서, ‘wearied’의 지속된 소진감을 담았습니다.
- source_word: בְּרֹב עֲצָתַיִךְ
  english_pob_choice: by your many counsels
  chosen_korean: 많은 모략 때문에
  alternatives_korean:
  - 많은 조언 때문에
  - 수많은 계획 때문에
  lexicon: HALOT
  rationale: 여기서 עֵצָה는 단순한 조언보다 바벨의 점술·정책적 ‘모략/책략’의 뉘앙스를 띱니다. ‘때문에’는 ב의 원인적 용법을 자연스럽게 드러냅니다.
- source_word: הברו שמים
  english_pob_choice: those who divide the heavens
  chosen_korean: 하늘을 나누는 자들
  alternatives_korean:
  - 하늘을 구획하는 자들
  - 하늘을 분할하는 자들
  lexicon: HALOT
  rationale: 난해한 히브리어를 점성술적 하늘 분할로 이해한 영어 POB의 해석을 따라, 직역에 가까운 표현으로 불러 주었습니다.
- source_word: החזים בכוכבים
  english_pob_choice: who gaze at the stars
  chosen_korean: 별들을 바라보는 자들
  alternatives_korean:
  - 별을 살피는 자들
  - 별들을 응시하는 자들
  lexicon: HALOT
  rationale: חזים은 ‘보는 자들/환시자들’의 뜻이지만, בכוכבים과 결합해 점성가들을 가리키므로 ‘별들을 바라보는 자들’로 옮겼습니다.
- source_word: מודיעים לחדשים
  english_pob_choice: who make known month by month
  chosen_korean: 달마다 앞으로 닥칠 일을 알려 주는 자들
  alternatives_korean:
  - 초하루마다 알려 주는 자들
  - 매달 예언하는 자들
  lexicon: HALOT
  rationale: לחדשים를 달/월 단위의 점술적 예고로 보고, 영어 POB의 완곡한 시간 감각을 살려 ‘달마다’로 표현했습니다.
theological_decisions:
- issue: 바벨의 점술가들을 향한 조롱의 어조
  chosen_reading: 본문을 ‘구원할 수 없는 점성술사들’에 대한 조롱으로 유지했습니다.
  alternative_readings:
  - 그저 일반적인 지혜자나 참모들에 대한 언급으로 완화하는 읽기
  rationale: 문맥상 이사야 47장은 바벨의 주술과 점술을 겨냥하므로, ‘하늘을 나누는 자들’과 ‘별들을 바라보는 자들’을 점성술적 인물로 드러내는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 이사야 47장 문맥 및 번역 원칙
