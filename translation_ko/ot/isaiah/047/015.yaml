  text: כֵּ֥ן הָיוּ לָ֖/ךְ אֲשֶׁ֣ר יָגָ֑עַתְּ סֹחֲרַ֣יִ/ךְ מִ/נְּעוּרַ֗יִ/ךְ אִ֤ישׁ לְ/עֶבְר/וֹ֙ תָּע֔וּ אֵ֖ין מוֹשִׁיעֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
  footnotes:
  - marker: a
    text: Or 'each to his own side,' 'each in his own direction,' or 'each across his own way.' The Hebrew expression is concise and may emphasize dispersal rather than a specific destination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇게 네가 수고를 들였던 자들은 네게 그렇게 되었습니다—네 젊은 시절부터의 네 상인들입니다. 각자는 자기 갈 곳으로 헤매니, 너를 구원할 자가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각자 자기 편으로’, ‘각자 자기 방향으로’, 혹은 ‘각자 자기 길을 가며’. 히브리어 표현이 매우 압축적이어서, 특정한 목적지보다 흩어짐 자체를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  english_pob_choice: have ... become to you
  chosen_korean: 네게 그렇게 되었습니다
  alternatives_korean:
  - 네게 그렇게 되었습니다
  - 네게 그렇게 된 것입니다
  - 네게 그러한 존재가 되었습니다
  lexicon: HALOT
  rationale: 결과 상태를 나타내는 היה + ל의 구문을 한국어로 자연스럽게 옮기되, 앞선 심판의 결과라는 인과적 뉘앙스를 유지했습니다.
- source_word: אֲשֶׁר יָגָעַתְּ
  english_pob_choice: those with whom you labored
  chosen_korean: 네가 수고를 들였던 자들
  alternatives_korean:
  - 네가 애써 일했던 자들
  - 네가 수고하던 상대들
  - 네가 애쓴 이들
  lexicon: HALOT
  rationale: יגע의 ‘수고하다/애쓰다’ 의미를 살리면서, 상업적 관계와 노력의 허무함이 드러나도록 ‘수고를 들이다’로 옮겼습니다.
- source_word: סֹחֲרַיִךְ
  english_pob_choice: your merchants
  chosen_korean: 네 상인들
  alternatives_korean:
  - 네 무역상들
  - 네 장사꾼들
  - 네 거래상들
  lexicon: HALOT
  rationale: סחר의 기본 경제 의미를 따라 ‘상인들’로 옮겨 바벨론의 상업적 기반을 분명히 했습니다.
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  english_pob_choice: Each one wanders to his own quarter
  chosen_korean: 각자는 자기 갈 곳으로 헤매니
  alternatives_korean:
  - 각자는 자기 편으로 헤매니
  - 각자는 자기 방향으로 흩어지니
  - 각자는 제각기 자기 편으로 흩어지니
  lexicon: HALOT
  rationale: לעברו의 ‘자기 쪽/방향’이라는 압축된 표현을 그대로 풀어, 분산과 이탈의 이미지를 살리는 ‘자기 갈 곳으로’를 택했습니다.
- source_word: אֵין מוֹשִׁיעֵךְ
  english_pob_choice: there is no one to save you
  chosen_korean: 너를 구원할 자가 없습니다
  alternatives_korean:
  - 너를 구해 줄 자가 없습니다
  - 너를 건질 자가 없습니다
  - 너를 구원하는 이가 없습니다
  lexicon: HALOT
  rationale: מוֹשִׁיעַ의 구출/구원 의미를 한국어의 ‘구원하다’로 직역에 가깝게 유지해, 문맥의 절망적 선언을 보존했습니다.
theological_decisions:
- issue: 구원어휘(מוֹשִׁיעַ)의 번역 범위
  chosen_reading: ‘구원할 자가 없습니다’로 번역해 단순한 물리적 탈출이 아니라 전면적 무력함의 선언을 살렸습니다.
  alternative_readings:
  - 너를 구해 줄 자가 없습니다
  - 너를 건질 자가 없습니다
  rationale: 이 절은 바벨론의 외교·상업적 의지처가 무너졌음을 말하므로, ‘구원’은 신학적 과잉이 아니라 히브리어의 넓은 구출 의미를 보존하는 적절한 대응입니다.
  doctrine_reference: 구약의 구원/구출 어휘는 문맥에 따라 일반적 구조적 구출과 종말론적 구원을 모두 포괄함.
