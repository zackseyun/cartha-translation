id: ISA.47.11
reference: Isaiah 47:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֧א עָלַ֣יִ/ךְ רָעָ֗ה לֹ֤א תֵדְעִי֙ שַׁחְרָ֔/הּ וְ/תִפֹּ֤ל עָלַ֨יִ/ךְ֙ הֹוָ֔ה לֹ֥א תוּכְלִ֖י כַּפְּרָ֑/הּ וְ/תָבֹ֨א עָלַ֧יִ/ךְ פִּתְאֹ֛ם שׁוֹאָ֖ה לֹ֥א תֵדָֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
  footnotes:
  - marker: a
    text: Or 'you will not know its dawning' or 'you will not know how to avert it.' The Hebrew of this clause is difficult; the main text follows the sense that Babylon will be unable to use her occult arts to dispel the coming evil.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''you will not be able to ward it off'' / ''appease it.'' Hebrew: ''make atonement for it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 재앙이 너희에게 닥치지만, 그것을 물리칠 방법을 알지 못할 것입니다. 재난이 너희에게 떨어질 것이나, 그것을 막아낼 수 없을 것입니다. 그리고 너희가 알지 못하는 사이에 갑작스런 파멸이 너희에게 닥칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 어려운 표현입니다. 본문은 바빌론이 주술로 닥쳐오는 재앙을 쫓아내지 못한다는 뜻을 따릅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네가 알지 못하는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 재앙
  alternatives_korean:
  - 악
  - 재난
  - 해악
  lexicon: HALOT
  rationale: 문맥이 바빌론에 대한 심판 예언이므로 도덕적 ‘악’보다 해로운 심판 사건을 가리키는 ‘재앙’이 자연스럽고, 이어지는 병행어들과도 잘 맞습니다.
- source_word: שַׁחְרָהּ
  english_pob_choice: how to charm it away
  chosen_korean: 그것을 물리칠 방법을 알지 못할 것입니다
  alternatives_korean:
  - 그것을 매혹으로 쫓아낼 방법을 알지 못할 것입니다
  - 그것의 여명을 알지 못할 것입니다
  - 그것을 막을 방법을 알지 못할 것입니다
  lexicon: HALOT
  rationale: 본문은 바빌론의 주술적 대응 실패를 암시하므로, 문자적으로 굳이 풀기보다 ‘물리칠 방법을 알지 못하다’로 옮겨 본문의 조롱 의도를 살렸습니다.
- source_word: הֹוָה
  english_pob_choice: disaster
  chosen_korean: 재난
  alternatives_korean:
  - 재앙
  - 파괴
  - 불행
  lexicon: HALOT
  rationale: 첫 번째 명사와 구별되는 병행어로서 파괴적 사건을 뜻하므로, 현대 한국어에서 자연스러운 ‘재난’을 택했습니다.
- source_word: כַּפְּרָהּ
  english_pob_choice: to atone for it
  chosen_korean: 그것을 막아낼 수 없을 것입니다
  alternatives_korean:
  - 그것을 속죄할 수 없을 것입니다
  - 그것을 속량할 수 없을 것입니다
  - 그것을 진정시킬 수 없을 것입니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 제의적 속죄보다 닥친 재난을 되돌리거나 무효화하지 못한다는 뜻이므로, 한국어에서는 의미를 드러내는 ‘막아내다’가 가장 정확합니다.
- source_word: פִּתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑작스런
  alternatives_korean:
  - 갑자기 찾아오는
  - 순식간의
  - 뜻밖의
  lexicon: HALOT
  rationale: 표준적인 시간 부사로서 ‘갑작스런’이 가장 간결하고 자연스럽습니다.
- source_word: שׁוֹאָה
  english_pob_choice: ruin
  chosen_korean: 파멸
  alternatives_korean:
  - 폐허
  - 황폐
  - 멸망
  lexicon: HALOT
  rationale: 최종 병행어는 임박한 붕괴와 멸망을 가리키므로, 강도가 분명한 ‘파멸’이 적절합니다.
theological_decisions:
- issue: כפר를 심판 문맥에서 어떻게 옮길지
  chosen_reading: 제의적 ‘속죄’ 용어를 그대로 밀지 않고, 재난을 ‘막아내다’로 풀어 심판을 되돌릴 수 없다는 뜻을 살렸습니다.
  alternative_readings:
  - 그것을 속죄할 수 없을 것입니다
  - 그것을 달랠 수 없을 것입니다
  - 그것을 가릴 수 없을 것입니다
  rationale: 이 절은 바빌론이 닥쳐오는 심판을 주술이나 어떤 수단으로도 제거하지 못한다는 조롱이 핵심이므로, 한국어 독자가 오해 없이 즉시 이해하도록 의미 중심으로 처리했습니다.
  doctrine_reference: Translation philosophy §5 (문맥상 핵심 의미 보존)
