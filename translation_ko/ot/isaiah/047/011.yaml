  - 파괴
  - 불행
  lexicon: HALOT
  rationale: 첫 번째 명사와 구별되는 병행어로서 파괴적 사건을 뜻하므로, 현대 한국어에서 자연스러운 ‘재난’을 택했습니다.
- source_word: כַּפְּרָהּ
  english_pob_choice: to atone for it
  chosen_korean: 그것을 막아낼 수 없을 것입니다
  alternatives_korean:
