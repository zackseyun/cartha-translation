theological_decisions:
- issue: כפר를 심판 문맥에서 어떻게 옮길지
  chosen_reading: 제의적 ‘속죄’ 용어를 그대로 밀지 않고, 재난을 ‘막아내다’로 풀어 심판을 되돌릴 수 없다는 뜻을 살렸습니다.
  alternative_readings:
  - 그것을 속죄할 수 없을 것입니다
  - 그것을 달랠 수 없을 것입니다
  - 그것을 가릴 수 없을 것입니다
  rationale: 이 절은 바빌론이 닥쳐오는 심판을 주술이나 어떤 수단으로도 제거하지 못한다는 조롱이 핵심이므로, 한국어 독자가 오해 없이 즉시 이해하도록 의미 중심으로 처리했습니다.
  doctrine_reference: Translation philosophy §5 (문맥상 핵심 의미 보존)
