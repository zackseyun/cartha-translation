  to: 재앙이 네게 닥칠 것이며, 너는 그것을 물리칠 방도를 알지 못할 것입니다.[a] 재난이 네게 닥칠 것이며, 너는 그것을 막아낼 수 없을 것입니다.[b] 네가 알지 못하는 파멸이 갑자기 네게 닥칠 것입니다.[c]
  rationale: 단수 호칭과 병렬 접속을 원문에 맞추고, 마지막 절의 시간화된 표현을 제거했습니다. 또한 논쟁적이거나 암시된 표현은 본문에서 과도하게 단정하지 않고 해당 위치의 각주로 대안을 제시했습니다.
