  verdict: revise
  source_fidelity: 히브리어의 두 여성 단수 명령(‘앉으라’, ‘들어가라’), ‘갈대아의 딸’이라는 의인화된 호격, 그리고 ‘더 이상 사람들이 너를 … 부르지 않을 것’이라는 비인칭 복수 구문을 보존해야 합니다. 현 초안은 핵심 의미를 대체로 전달하지만, ‘이제는’과 ‘다시는’의 중복은 לֹא תוֹסִיפִי의 ‘더 이상’보다 강합니다.
  naturalness: ‘갈대아의 딸아.’를 독립 문장으로 두기보다 호격을 명령절 앞에 연결하는 편이 자연스럽습니다. 또한 합쇼체 명령인 ‘-십시오’와 비격식 대명사 ‘너’를 한 문장 안에서 혼용하지 않고 ‘당신’을 써서 문체를 일관되게 했습니다.
  terminology: ‘갈대아의 딸’은 예언서의 여성 의인화를 보존하며, ‘나라들의 여주인’은 גְּבֶרֶת מַמְלָכוֹת의 지배적 여성 칭호를 충실히 옮깁니다. 각주 대안은 본문 표현을 그대로 반복하지 않고 ‘귀부인’을 제시합니다.
  issues:
