  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
  footnotes:
  - marker: a
    text: Or 'lady of kingdoms.'
    reason: lexical_alternative
translation:
  language: ko
  text: 잠잠히 앉아 있으십시오[a]. 그리고 어둠 속으로 들어가십시오. 갈대아의 딸아. 이제는 사람들이 다시는 너를 나라들의 여주인이라 부르지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들의 여주인’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי
  english_pob_choice: Sit
  chosen_korean: 잠잠히 앉아 있으십시오
  alternatives_korean:
  - 앉아 있으십시오
  - 거기 머무르십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형을 한국어의 공손한 명령으로 옮기되, 이어지는 ‘잠잠히’와 함께 수치와 굴욕의 정지를 살렸습니다.
- source_word: דוּמָם
  english_pob_choice: in silence
  chosen_korean: 잠잠히
  alternatives_korean:
  - 침묵 속에서
  - 말없이
  lexicon: HALOT
  rationale: 동작의 방식이 아니라 강요된 침묵의 상태를 나타내므로, 간결한 부사형 ‘잠잠히’가 가장 자연스럽습니다.
- source_word: גְּבֶרֶת מַמְלָכֹת
  english_pob_choice: mistress of kingdoms
  chosen_korean: 나라들의 여주인
  alternatives_korean:
  - 제국들의 주인
  - 왕국들의 여주인
  - 나라들의 주인
  lexicon: HALOT
  rationale: גְּבֶרֶת의 지배적 여성 호칭을 살리기 위해 ‘여주인’을 택했고, מַמְלָכֹת은 복수성을 유지해 ‘나라들’로 옮겼습니다.
- source_word: בַּת כַּשְׂדִּים
  english_pob_choice: daughter of the Chaldeans
  chosen_korean: 갈대아의 딸
  alternatives_korean:
  - 갈대아 사람들의 딸
  - 갈대아의 처녀
  lexicon: HALOT
  rationale: 예언서의 도시/민족 의인화 관용구를 보존해, 본문의 조롱과 심판의 수사를 그대로 드러냈습니다.
theological_decisions:
- issue: 의인화된 바벨론/갈대아를 여성으로 호칭하는 방식
  chosen_reading: ‘갈대아의 딸’과 ‘여주인’을 그대로 살려, 여성적 의인화를 유지했습니다.
  alternative_readings:
  - 바벨론아로 풀어 평이하게 옮김
  - 중립적으로 ‘지배자’로 바꿈
  rationale: 본문은 도시를 여성 인물로 직접 부르며 멸시하는 예언적 수사를 사용합니다. 이를 평탄화하면 심판의 뉘앙스가 약해집니다.
  doctrine_reference: Translation philosophy §1, §6
