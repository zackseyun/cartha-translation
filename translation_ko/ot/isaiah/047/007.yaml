  naturalness: ‘여주인’은 현대 한국어에서 다소 제한적인 용례가 있으나, 여성으로 의인화된 지배적 주체라는 원문의 표현을 ‘여왕’으로 과도하게 특정하지 않고 보존할 수 있습니다. ‘그 결과’와 ‘자신의 끝’은 현대 표준어 문맥에서 자연스럽습니다.
