  - 여왕
  lexicon: HALOT
  rationale: 지배적 지위의 여성을 가리키는 뜻을 살리되, 원문에 없는 왕권 의미로 좁히지 않기 위해 ‘여주인’을 택했습니다.
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  english_pob_choice: you did not take these things to heart
  chosen_korean: 이런 일들을 마음에 두지 않았고
  alternatives_korean:
  - 이런 일들을 마음에 새기지 않았고
  - 이런 일들을 마음에 담지 않았고
  lexicon: HALOT
  rationale: ‘마음에 두다’는 히브리어의 ‘마음 위에 두다’라는 관용구를 한국어로 비교적 직접적으로 살린 표현입니다.
- source_word: אַחֲרִיתָהּ
  english_pob_choice: her end
  chosen_korean: 자기의 끝
  alternatives_korean:
  - 그녀의 끝
  - 마지막 결말
  lexicon: HALOT
  rationale: 본문의 여성형 어미가 가리키는 인격화된 바벨론을 반영하되, 한국어에서는 자연스러운 소유 표현으로 처리했습니다.
theological_decisions:
- issue: 바벨론의 여성형 인격화 유지
  chosen_reading: ‘여주인’과 ‘자기의 끝’으로 바벨론을 여성으로 인격화한 표현을 유지했습니다.
  alternative_readings:
  - ‘여왕’으로 격상하는 해석
  - 비인칭 ‘그것의 끝’으로 완화하는 해석
  rationale: 예언문맥에서 바벨론을 여성으로 의인화하는 흐름을 보존해야 본문의 조롱과 심판의 뉘앙스가 살아납니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
