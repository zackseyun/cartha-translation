  - 당신이 말했습니다
  lexicon: HALOT
  rationale: 단순 과거의 발화 보고를 자연스러운 현대 한국어로 옮기되, 접속적 뉘앙스는 불필요하게 살리지 않았습니다.
- source_word: גְבָרֶת
  english_pob_choice: a mistress
  chosen_korean: 여주인
  alternatives_korean:
