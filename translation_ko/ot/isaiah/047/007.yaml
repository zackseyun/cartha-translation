  text: וַ/תֹּ֣אמְרִ֔י לְ/עוֹלָ֖ם אֶהְיֶ֣ה גְבָ֑רֶת עַ֣ד לֹא שַׂ֥מְתְּ אֵ֨לֶּה֙ עַל לִבֵּ֔/ךְ לֹ֥א זָכַ֖רְתְּ אַחֲרִיתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
  footnotes:
  - marker: a
    text: Or 'lady forever.' The Hebrew גְבָרֶת denotes a woman in a position of dominance or rank; 'mistress' is chosen to preserve that sense without over-translating it as 'queen.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not set these things on your heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'its end.' The Hebrew has a feminine singular suffix, likely reflecting Babylon personified as a woman.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 말했습니다. “나는 영원히 여주인이 될 것입니다[a].” 그 결과 당신은 이런 일들을 마음에 두지 않았고[b], 자신의 끝을 기억하지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 영원히 부인이 될 것입니다.’ 히브리어 גְבָרֶת는 지배적 지위나 높은 신분의 여성을 가리킵니다. ‘여주인’은 그 의미를 살리면서 ‘여왕’처럼 왕호로 과도하게 구체화하지 않기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘당신은 이런 일들을 당신의 마음에 두지 않았습니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀의 끝’입니다. 히브리어는 여성 단수 접미사를 가지며, 문맥상 여성으로 의인화된 바벨론을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  english_pob_choice: You said
  chosen_korean: 당신은 말했습니다
