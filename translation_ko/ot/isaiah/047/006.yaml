  terminology: ‘진노’, ‘유업’, ‘자비’, ‘멍에’는 예언서의 격식과 핵심 개념을 적절히 살립니다. ‘속되게 하다’는 ‘더럽히다’보다 חלל의 ‘거룩한 것을 속된 것으로 취급하다’라는 의미에 더 적합합니다.
