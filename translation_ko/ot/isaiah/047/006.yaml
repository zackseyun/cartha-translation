theological_decisions:
- issue: 하나님이 ‘내 유업을 더럽혔다’고 직접 말하는 강한 1인칭 표현
  chosen_reading: 주어를 완화하지 않고 하나님 자신의 심판적 행위를 그대로 드러냈습니다.
  alternative_readings:
  - ‘내 유업이 더럽혀지도록 내버려 두었다’로 완화
  - ‘내 유업을 버렸다’로 완화
  rationale: 히브리어는 분명한 1인칭 פעיל 구문이며, 본문은 하나님의 주권적 심판과 바벨론의 무자비함을 함께 유지합니다. 이를 완화하면 본문이 가진 신학적 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 3
