  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
  footnotes:
  - marker: a
    text: Or 'I defiled my heritage.' The Hebrew verb can also carry the sense 'treated as common' or 'profaned.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you did not set mercies for them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on the elderly you made your yoke exceedingly heavy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성에게 진노하여 내 유업을 속되게 하였고,[a] 그들을 네 손에 넘겨주었습니다. 그러나 너는 그들에게 자비를 베풀지 않았고,[b] 노인에게까지 네 멍에를 매우 무겁게 지웠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 유업을 더럽혔다.’ 히브리어 동사는 ‘속된 것으로 취급하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너는 그들을 위하여 자비들을 두지 않았다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘노인에게 네 멍에를 지극히 무겁게 하였다.’
    reason: lexical_alternative
