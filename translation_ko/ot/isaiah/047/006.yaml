  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
  footnotes:
  - marker: a
    text: Or 'I defiled my heritage.' The Hebrew verb can also carry the sense 'treated as common' or 'profaned.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you did not set mercies for them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on the elderly you made your yoke exceedingly heavy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성에게 진노하여 내 유업을 더럽혔고 그들을 네 손에 넘겨주었습니다. 너는 그들에게 자비를 베풀지 않았고, 노인에게는 네 멍에를 매우 무겁게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 상속을 더럽혔다.’ 히브리어 동사는 ‘공통된 것으로 취급하다’ 또는 ‘속되게 하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너는 그들을 위해 자비들을 두지 않았다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘노인들에게 네 멍에를 더욱더 무겁게 하였다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַפְתִּי
  english_pob_choice: I was angry
  chosen_korean: 진노하여
  alternatives_korean:
  - 화가 나서
  - 분노하여
  - 노여워하여
  lexicon: HALOT
  rationale: 하나님의 강한 감정과 심판적 반응을 드러내기 위해 단순한 ‘화가 나서’보다 더 무게감 있는 ‘진노하여’를 택했습니다.
- source_word: חִלַּלְתִּי
  english_pob_choice: I profaned
  chosen_korean: 내 유업을 더럽혔고
  alternatives_korean:
  - 내 유업을 profaned 직역식으로 처리하지 않음
  - 내 유업을 속되게 하였고
  - 내 유업을 더럽혔고
  lexicon: HALOT
  rationale: 이 동사는 ‘거룩하지 않게 만들다/속되게 하다’의 강한 의미를 가지므로, 종교적·언약적 긴장을 살리되 현대 한국어에서 자연스러운 ‘더럽혔다’로 옮겼습니다.
- source_word: נַחֲלָתִי
  english_pob_choice: my inheritance
  chosen_korean: 내 유업
  alternatives_korean:
  - 내 유산
  - 내 상속
  - 내 소유
  lexicon: HALOT
  rationale: 성경적 언약 소유 개념을 가장 잘 살리는 표준어로 ‘유업’을 선택했습니다.
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  english_pob_choice: You showed them no mercy
  chosen_korean: 너는 그들에게 자비를 베풀지 않았고
  alternatives_korean:
  - 너는 그들에게 긍휼을 두지 않았고
  - 너는 그들에게 자비를 두지 않았고
  - 너는 그들에게 자비를 보이지 않았고
  lexicon: HALOT
  rationale: 히브리어의 직역적 ‘자비들을 두지 않았다’는 한국어로는 어색하므로, 의미를 살린 관용 표현인 ‘자비를 베풀지 않았다’로 옮겼습니다.
- source_word: זָקֵן
  english_pob_choice: the aged
  chosen_korean: 노인
  alternatives_korean:
  - 연로한 사람
  - 늙은이
  - 노년층
  lexicon: HALOT
  rationale: 문맥상 집단적 지칭이므로 ‘노인’이 가장 간명하고 자연스럽습니다.
- source_word: עֻלֵּךְ
  english_pob_choice: your yoke
  chosen_korean: 네 멍에
  alternatives_korean:
  - 네 짐
  - 네 굴레
  - 네 멍에
  lexicon: HALOT
  rationale: 예언서의 압제 이미지를 유지하기 위해 문자적 이미지인 ‘멍에’를 살렸습니다.
theological_decisions:
- issue: 하나님이 ‘내 유업을 더럽혔다’고 직접 말하는 강한 1인칭 표현
  chosen_reading: 주어를 완화하지 않고 하나님 자신의 심판적 행위를 그대로 드러냈습니다.
  alternative_readings:
  - ‘내 유업이 더럽혀지도록 내버려 두었다’로 완화
  - ‘내 유업을 버렸다’로 완화
  rationale: 히브리어는 분명한 1인칭 פעיל 구문이며, 본문은 하나님의 주권적 심판과 바벨론의 무자비함을 함께 유지합니다. 이를 완화하면 본문이 가진 신학적 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 3
