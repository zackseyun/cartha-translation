translation:
  language: ko
  text: 우리의 구속자—만군의 야훼, 그의 이름은—곧 이스라엘의 거룩한 이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  english_pob_choice: Our Redeemer
  chosen_korean: 우리의 구속자
  alternatives_korean:
  - 우리의 구원자
  - 우리의 친족 구속자
  lexicon: HALOT
  rationale: גאל의 언약적·법적 뉘앙스를 살리면서도 한국어에서 가장 자연스럽고 존칭이 가능한 표현으로 옮겼습니다. '구원자'는 의미가 넓어지고, '친족 구속자'는 여기서 명시되지 않은 친족성을 지나치게 좁혀 드러냅니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: 고유명사 יהוה는 관례적 성구어인 '야훼'로, צבאות는 직역에 가까운 '만군'으로 옮겨 영어 POB의 직접성을 유지했습니다.
- source_word: שְׁמוֹ
  english_pob_choice: is his name
  chosen_korean: 그의 이름은
  alternatives_korean:
  - 그 이름은
  - 이름은
  lexicon: HALOT
  rationale: 히브리어의 명사구를 한국어에서는 자연스러운 서술 구조로 풀어, 앞뒤의 호칭문을 매개하는 삽입구로 살렸습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩한 이
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  lexicon: HALOT
  rationale: 이사야서의 고정된 칭호를 유지하되, 현대 한국어에서 '거룩한 이'가 신적 칭호로 자연스럽고 직역성도 높습니다. '성자'는 기독교 전통 용어로 오해될 수 있습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 본 프로젝트 기준에 따라 인격적 이름을 보존하는 '야훼'를 채택했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: 호칭문과 신적 칭호의 연결
  chosen_reading: 우리의 구속자—만군의 야훼, 그의 이름은—곧 이스라엘의 거룩한 이십니다.
  alternative_readings:
  - 우리의 구속자이신 만군의 야훼는 그의 이름이며, 이스라엘의 거룩한 이십니다.
  rationale: 쉼표와 대시로 된 히브리어의 병렬적 호칭 구조를 보존해, '구속자'와 '이스라엘의 거룩한 이'가 야훼를 가리키는 동일 주어임을 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 5
