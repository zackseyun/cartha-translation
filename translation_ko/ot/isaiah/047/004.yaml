  source_fidelity: 히브리어는 ‘우리의 구속자 / 만군의 야훼가 그의 이름 / 이스라엘의 거룩한 이’라는 연속된 호칭 구조입니다. 초안은 핵심 어휘를 대체로 충실히 옮겼으나, 삽입된 ‘그의 이름은’에 서술 성분이 없어 한국어 문장 구조가 불완전합니다.
