id: ISA.44.24
reference: Isaiah 44:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ גֹּאֲלֶ֔/ךָ וְ/יֹצֶרְ/ךָ֖ מִ/בָּ֑טֶן אָנֹכִ֤י יְהוָה֙ עֹ֣שֶׂה כֹּ֔ל נֹטֶ֤ה שָׁמַ֨יִם֙ לְ/בַדִּ֔/י רֹקַ֥ע הָ/אָ֖רֶץ מי את/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
  footnotes:
  - marker: a
    text: Or, following another construal of the difficult final Hebrew words, 'who was with me?' The sense in either case is that the LORD created alone, without any helper.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “너를 속량하시는 이, 모태에서 너를 빚으신 이가 말합니다. 나는 야훼입니다. 나는 모든 것을 만들며, 홀로 하늘을 펼치고, 나 홀로 땅을 펼쳤습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 난해한 히브리어 말미를 다른 방식으로 풀이하여, ‘누가 나와 함께하였느냐?’로 번역할 수 있습니다. 어느 경우든 야훼께서 아무 도움 없이 홀로 창조하셨다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본절의 신명 사성은 POB 영어처럼 고유명사로 보존하는 것이 원문 직접성에 가장 부합하므로, 한국어도 관용적 대체 호칭인 주님 대신 야훼를 사용했습니다.
- source_word: גֹּאֲלֶךָ
  english_pob_choice: your Redeemer
  chosen_korean: 너를 속량하시는 분
  alternatives_korean:
  - 너의 구속자
  - 너의 대속자
  lexicon: HALOT
  rationale: גאל의 핵심은 단순한 도움보다 친족·언약적 속량 행위이므로, 한국어에서는 신학적 무게를 살리되 현대 문체에 자연스러운 속량하시는 분으로 옮겼습니다.
- source_word: וְיֹצֶרְךָ
  english_pob_choice: and the one who formed you
  chosen_korean: 너를 모태에서 지으신 분
  alternatives_korean:
  - 너를 빚으신 분
  - 너를 지으신 분
  lexicon: HALOT
  rationale: יָצַר는 형성·도공적 이미지가 있으나, 바로 뒤의 מִבָּטֶן과 결합된 출생 전 형성 이미지를 살리기 위해 '모태에서 지으신 분'으로 번역했습니다.
- source_word: נֹטֶה שָׁמַיִם / רֹקַע הָאָרֶץ
  english_pob_choice: who alone stretched out the heavens / who spread out the earth
  chosen_korean: 홀로 하늘을 펼치고, 땅을 내 힘으로 펼쳤다
  alternatives_korean:
  - 하늘을 펼치고 땅을 펴셨다
  - 하늘을 늘이시고 땅을 펼치셨다
  lexicon: HALOT
  rationale: נטה와 רקע는 창조적 '펴다/늘이다'의 պատկեր을 가지므로, 한국어에서도 동일한 시각적 이미지를 유지하는 펼치다를 사용했습니다. 마지막 절의 독점성을 위해 '홀로'와 '내 힘으로'를 분리해 반영했습니다.
- source_word: מֵאִתִּי
  english_pob_choice: by myself
  chosen_korean: 내 힘으로
  alternatives_korean:
  - 나 홀로
  - 나와 함께한 이 없이
  lexicon: HALOT
  rationale: 난해한 종결구의 핵심은 창조 사역의 단독성입니다. POB가 주석으로 대안독법을 보존한 점을 따르되, 본문은 '내 힘으로'로 옮겨 원문의 단독 행위 강조를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 난해한 종결구의 처리와 창조의 단독성
  chosen_reading: 본문은 창조의 단독성을 분명히 드러내는 한국어로 옮기고, 문장 내부에서 '홀로'와 '내 힘으로'로 강조를 중복해 원문의 수사적 힘을 보존했습니다.
  alternative_readings:
  - 나와 함께한 이가 있느냐?
  - 내가 있었느냐?
  rationale: 히브리어 말미는 문법적으로 난해하지만, 문맥상 핵심 신학은 야훼께서 어떤 도움도 없이 홀로 창조하셨다는 선언입니다. 따라서 난해성을 삭제하지 않되, 본문 의미를 오해 없이 전달하는 방향을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
