  source_fidelity: 초안은 야훼, 속량, 모태에서의 형성, 하늘과 땅을 펴는 창조 이미지를 대체로 충실히 반영합니다. 그러나 직접 인용문 안의 ‘...분이 말한다’는 앞선 ‘야훼께서 이렇게 말씀하십니다’와 화자 구성을 중복시키며, ‘내 힘으로’는 מֵאִתִּי의 단독 행위 강조를 능력·수단의 의미로 다소 바꿉니다.
  naturalness: ‘너를 속량하시는 분, 너를 모태에서 지으신 분이 말한다’는 현대 한국어에서 인용 도입과 결합될 때 부자연스럽습니다. 야훼가 직접 자신을 가리키는 인용문으로 재구성하고, 문장 종결을 합쇼체로 통일하는 편이 자연스럽습니다.
  terminology: ‘야훼’와 ‘속량’은 POB의 명칭 및 גאל의 의미 범위에 적절합니다. יצר의 형성 이미지는 ‘빚으신’이 더 잘 드러냅니다. 난해한 말미는 본문에서 ‘나 홀로’로 단독성을 나타내고 각주에서 의문문 대안을 보존하는 것이 안전합니다.
