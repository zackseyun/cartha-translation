id: ISA.44.25
reference: Isaiah 44:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: ko
  text: 그는 거짓의 징조들을 무효하게 하시고 점쟁이들을 어리석게 만드시며, 지혜로운 자들을 뒤로 물러서게 하시고 그들의 지식을 어리석게 하십니다.
  philosophy: formal
lexical_decisions:
- source_word: מֵפֵר אֹתֹת בַּדִּים
  english_pob_choice: who frustrates the signs of liars
  chosen_korean: 거짓의 징조들을 무효하게 하시고
  alternatives_korean:
  - 거짓말쟁이들의 표징들을 깨뜨리시고
  - 거짓말하는 자들의 징조를 좌절시키시고
  lexicon: מֵפֵר / אֹתֹת / בַּדִּים
  rationale: 동사 מֵפֵר는 단순히 ‘방해하다’보다 어떤 표징의 효력을 무효화하는 뜻이 강해 ‘무효하게 하시고’로 옮겼습니다. בַּדִּים은 영어 POB의 최종 판단을 따라 ‘liars’로 이해하여 ‘거짓의’로 압축해 표징의 성격을 드러냈습니다.
- source_word: וְקֹסְמִים יְהוֹלֵל
  english_pob_choice: and makes diviners act like fools
  chosen_korean: 점쟁이들을 어리석게 만드시며
  alternatives_korean:
  - 복술자들을 미치게 하시며
  - 점치는 자들을 어리석게 하시며
  lexicon: קֹסְמִים / יְהוֹלֵל
  rationale: קֹסְמִים은 점술 행위를 하는 자들이므로 ‘점쟁이들’이 가장 직접적입니다. יְהוֹלֵל은 그들을 ‘어리석게 하다/미혹되게 하다’는 효과를 나타내므로, 자연스러운 현대어로 ‘어리석게 만드시며’로 옮겼습니다.
- source_word: מֵשִׁיב חֲכָמִים אָחוֹר
  english_pob_choice: who turns wise men back
  chosen_korean: 지혜로운 자들을 뒤로 물러서게 하시고
  alternatives_korean:
  - 지혜로운 자들을 뒤로 돌이키시고
  - 지혜로운 자들을 물러가게 하시고
  lexicon: מֵשִׁיב / חֲכָמִים / אָחוֹר
  rationale: אָחוֹר는 문자적으로 ‘뒤로’이므로 동작의 방향을 살려 ‘뒤로 물러서게 하시고’로 표현했습니다. 이는 단순한 후퇴가 아니라 하나님의 주권 앞에서 지혜자들의 퇴각을 나타냅니다.
- source_word: וְדַעְתָּם יְשַׂכֵּל
  english_pob_choice: and makes their knowledge foolish
  chosen_korean: 그들의 지식을 어리석게 하십니다
  alternatives_korean:
  - 그들의 지식을 미련하게 하십니다
  - 그들의 지식을 무가치하게 하십니다
  lexicon: דַעַת / יְשַׂכֵּל
  rationale: דַעַת은 ‘지식’이 기본값이며, יְשַׂכֵּל은 그 지식이 실질적으로 무지처럼 드러나게 하시는 뜻이므로 ‘어리석게 하십니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 행위 동사들의 연속성
  chosen_reading: 본문의 네 개 동사는 모두 하나님이 인간의 거짓 지혜와 예측을 무력화하시는 주권적 행위를 강조하는 연속 구조로 읽었습니다.
  alternative_readings:
  - 각 동사를 단순한 심판의 결과 묘사로 약화시켜 읽는 방식
  - ‘어리석게 하다’를 단순한 인지적 결함으로만 이해하는 방식
  rationale: 히브리어 시구는 평행적으로 하나님의 주권적 개입을 누적해 보여 주므로, 한국어에서도 능동적 주어와 강한 동사를 유지해야 합니다.
  doctrine_reference: 하나님의 주권과 우상적 지혜에 대한 심판
