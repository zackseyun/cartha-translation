  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
  footnotes:
  - marker: a
    text: Or 'with a marking tool' or possibly 'with red chalk'; the Hebrew term refers to a tool used to mark out the figure.
    reason: lexical_alternative
translation:
  language: ko
  text: 목수는 줄을 늘이고, 먹줄로 그 형체를 표시하며, 대패로 다듬고, 컴퍼스로 그립니다. 그는 그것을 한 사람의 형상처럼, 사람의 아름다움처럼 만들어 집에 두게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹줄’은 여기서 표시용 도구를 풀어 옮긴 표현입니다. 히브리어는 정확한 재질보다 선을 긋고 형체를 표시하는 도구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  english_pob_choice: the woodworker
  chosen_korean: 목수
  alternatives_korean:
  - 나무를 다루는 장인
  - 목공
  lexicon: HALOT
  rationale: 나무를 다루는 제작자를 가리키는 점을 살려 자연스러운 현대어인 ‘목수’를 택했습니다. ‘목공’보다 문장상 주어로 더 매끄럽습니다.
- source_word: בַשֶּׂרֶד
  english_pob_choice: with a stylus
  chosen_korean: 먹줄로
  alternatives_korean:
  - 먹선으로
  - 표시 도구로
  - 스타일러스처럼
  lexicon: HALOT
  rationale: 이 낱말은 표시용 도구를 가리키며, 정확한 물질은 불확실합니다. 한국어 목공 맥락에서 ‘먹줄’이 선을 표시하는 도구라는 기능을 가장 분명히 드러냅니다.
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  english_pob_choice: he shapes it with planes
  chosen_korean: 대패로 다듬고
  alternatives_korean:
  - 대패질하여
  - 날붙이로 다듬고
  - 도구로 깎고
  lexicon: HALOT
  rationale: 문맥상 나무를 다듬는 공정이므로 ‘대패’로 옮겼습니다. ‘다듬고’는 제작 과정을 자연스럽게 이어 줍니다.
- source_word: וּבַמְּחוּגָה
  english_pob_choice: with a compass
  chosen_korean: 컴퍼스로
  alternatives_korean:
  - 원형자로
  - 원 그리는 기구로
  - 나침반으로
  lexicon: HALOT
  rationale: 원과 호를 그리는 기구라는 점에서 현대 한국어의 ‘컴퍼스’가 가장 직접적입니다.
- source_word: כְּתִפְאֶרֶת אָדָם
  english_pob_choice: like the beauty of a human
  chosen_korean: 사람의 아름다움처럼
  alternatives_korean:
  - 인간의 아름다움처럼
  - 사람의 화려함처럼
  - 인간의 영광처럼
  lexicon: HALOT
  rationale: תפארת의 미적 뉘앙스를 살려 ‘아름다움’으로 옮겼습니다. אָדָם은 집합적 인류가 아니라 일반적 인간을 가리키므로 ‘사람’이 자연스럽습니다.
theological_decisions:
- issue: 우상 제작을 묘사하는 연속 동작의 어조
  chosen_reading: 기술적 제작 과정을 그대로 살려, 인간이 만든 신상임을 드러내는 건조한 서술로 옮겼습니다.
  alternative_readings:
  - 보다 비판적인 어조로 풀어쓰기
  - ‘우상’을 미리 덧붙여 해석적으로 강조하기
  rationale: 원문은 목공의 작업 절차를 연속적으로 제시해 우상의 인위성을 드러냅니다. 한국어에서도 그 절차감을 유지하는 것이 수사와 신학적 대비를 가장 잘 전달합니다.
  doctrine_reference: Isaiah 44 우상 풍자 문맥
- issue: אִישׁ / אָדָם의 이중 표현
  chosen_reading: ‘한 사람의 형상’과 ‘사람의 아름다움’을 구분해 반복했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘인간’으로 통일하기
  - 두 표현을 모두 ‘사람’으로 통일하기
  rationale: 원문은 אִישׁ와 אָדָם을 나란히 써서 형상과 인간성의 대비를 강조합니다. 한국어에서도 약간의 변화를 두어 반복 효과를 살렸습니다.
  doctrine_reference: 사본 기반 어휘 구분
