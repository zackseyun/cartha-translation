source:
  edition: WLC
  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
  footnotes:
  - marker: a
    text: Or “his angels”; the Hebrew word can mean either human messengers or heavenly messengers, but here likely refers to prophetic agents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 종의 말씀을 확증하시고 그의 사자들의 계획을 이루시며, 예루살렘에 대하여는 「그곳이 사람이 살 곳이 될 것이다」라고 하시고, 유다의 성읍들에 대하여는 「그것들이 다시 건축될 것이다」라고 하시며, 그 폐허들에 대하여는 「내가 그것들을 다시 일으키겠다」라고 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사자들’은 히브리어 מלאך가 ‘천사들’ 또는 ‘전령들’을 뜻할 수 있음을 반영한 것입니다. 이 문맥에서는 예언적 전달자들이라는 뜻으로 보았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  english_pob_choice: confirms
  chosen_korean: 확증하시고
  alternatives_korean:
  - 세우시고
  - 이루게 하시고
  lexicon: HALOT
  rationale: 히필형 קום은 ‘서게 하다/굳게 하다’의 뜻이므로, 말씀을 실제로 성취되게 하시는 뉘앙스를 살려 ‘확증하다’로 옮겼습니다.
- source_word: דְּבַר עַבְדּוֹ
  english_pob_choice: the word of his servant
  chosen_korean: 그의 종의 말씀
  alternatives_korean:
  - 그의 종의 말
  - 그의 종의 메시지
  lexicon: HALOT
  rationale: דבר는 이 문맥에서 예언적 ‘말씀’을 가리키므로, 단순한 말보다 격식 있고 성경적인 ‘말씀’이 원문과 더 잘 맞습니다.
- source_word: מַלְאָכָיו
  english_pob_choice: his messengers
  chosen_korean: 그의 사자들
  alternatives_korean:
  - 그의 천사들
  - 그의 전령들
  lexicon: HALOT
  rationale: מלאך는 천사와 사자를 모두 뜻하지만, 여기서는 앞의 ‘종’과 평행을 이루는 예언적 전달자들이라는 점을 살려 ‘사자들’로 옮겼습니다.
- source_word: תּוּשָׁב
  english_pob_choice: She will be inhabited
  chosen_korean: 그곳이 사람이 살 곳이 될 것이다
  alternatives_korean:
  - 그곳이 거주될 것이다
  - 그곳이 다시 사람이 살 것이다
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 의인화를 한국어에서 자연스럽게 살리되, 예루살렘을 직접 ‘그녀’로 반복하지 않고 도시의 회복 의미를 분명히 했습니다.
theological_decisions:
- issue: 예루살렘과 유다 성읍들에 대한 회복 선언의 어조
  chosen_reading: 원문의 미래형 회복 선언을 그대로 살려, 폐허가 실제로 재건되고 거주되게 될 것이라는 예언적 확신을 강하게 드러냈습니다.
  alternative_readings:
  - 완화된 가능성 표현으로 옮길 수 있음
  - 단순한 상징적 회복으로 제한할 수 있음
  rationale: 본문은 하나님의 주권적 실행과 성취를 선포하는 예언문이므로, 약화된 추측형보다 단정적 미래형이 원문 의도에 충실합니다.
  doctrine_reference: 예언 성취와 하나님의 주권
