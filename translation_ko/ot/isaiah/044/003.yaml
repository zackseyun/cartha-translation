id: ISA.44.3
reference: Isaiah 44:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
  footnotes:
  - marker: a
    text: Or 'the thirsty'; the Hebrew adjective can stand substantivally, but the parallel with 'dry ground' favors understanding the image as thirsty land.
    reason: alternative_reading
  - marker: b
    text: Or 'flowing waters' for 'streams'; the Hebrew term is literally 'things flowing.'
    reason: lexical_alternative
  - marker: c
    text: '''My Spirit'' could also be rendered ''my breath'' or ''my wind,'' but here the context of divine blessing on future generations favors ''Spirit.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 목마른 땅[a]에 물을 붓고, 마른 땅에 흐르는 물[b]을 부을 것입니다. 내가 네 자손 위에 내 영[c]을 붓고, 네 후손 위에 내 복을 내릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목마른 이’. 히브리어 형용사는 명사처럼 쓰일 수 있습니다. 그러나 ‘마른 땅’과의 평행을 고려하면 여기서는 ‘목마른 땅’으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘흐르는 것들’ 또는 ‘시내들’. 히브리어는 문자적으로 ‘흐르는 것들’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 영’은 ‘내 숨’ 또는 ‘내 바람’으로도 옮길 수 있습니다. 그러나 미래 세대에게 베푸시는 하나님의 복과 나란히 놓인 문맥에서는 ‘내 영’이 가장 알맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצָּק / אֶצֹּק (יצק)
  english_pob_choice: I will pour / I will pour out
  chosen_korean: 붓고 / 부어 주고
  alternatives_korean:
  - 쏟고 / 쏟아 주고
  - 부으리라 / 부어 내리리라
  lexicon: HALOT
  rationale: יצק의 핵심 이미지는 액체를 ‘붓다/쏟다’입니다. 첫 절은 물의 실제 동작을 살려 ‘붓고’로, 뒤 절은 하나님의 영과 복에 대한 은유적 확장을 살려 ‘부어 주고’로 자연스럽게 옮겼습니다.
- source_word: צָמֵא
  english_pob_choice: the thirsty land
  chosen_korean: 목마른 땅
  alternatives_korean:
  - 목마른 자
  - 목마른 것
  - 갈한 땅
  lexicon: HALOT
  rationale: 문맥이 사람보다 ‘마른 땅/흐르는 물’의 자연 이미지에 맞으므로, 영어 POB의 해석을 따라 대상을 ‘땅’으로 풀어 ‘목마른 땅’이라 번역했습니다.
- source_word: וְנֹזְלִים
  english_pob_choice: and streams
  chosen_korean: 흐르는 물
  alternatives_korean:
  - 시내
  - 개울들
  - 흘러내리는 물
  lexicon: HALOT
  rationale: 어근상 ‘흐르는 것들’이므로, 한국어에서는 복수 명사보다 ‘흐르는 물’이 이미지와 병행구조를 가장 자연스럽게 살립니다.
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 내 바람
  - 내 숨
  lexicon: HALOT
  rationale: 이사야의 약속 문맥에서는 하나님이 주시는 প্রাণ력/임재를 가리키므로, 여기서는 ‘영’이 가장 원문에 가깝습니다. ‘성령’은 신약적·후대적 뉘앙스를 더 강하게 띨 수 있어 피했습니다.
- source_word: זַרְעֶךָ / צֶאֱצָאֶיךָ
  english_pob_choice: your offspring / your descendants
  chosen_korean: 네 자손 / 네 후손
  alternatives_korean:
  - 네 씨 / 네 자손들
  - 네 자손 / 네 자손의 자손
  lexicon: HALOT
  rationale: 두 표현은 서로 평행하는 가족-세대 어휘이므로, 앞은 직설적인 ‘자손’, 뒤는 변화를 주어 ‘후손’으로 옮겨 반복을 살리고 한국어 어감을 매끄럽게 했습니다.
theological_decisions:
- issue: 하나님의 ‘영’과 ‘복’이 누구에게 주어지는가
  chosen_reading: 이스라엘의 미래 세대에 대한 언약적 선물로 읽고, ‘내 영’을 인격적 하나님의 임재와 능력으로 번역했습니다.
  alternative_readings:
  - 단순한 생기/바람의 이미지
  - 비인격적 축복의 표현
  rationale: 본문은 물-영-복의 연속된 약속으로 구성되어 있어, 단순 자연현상보다 하나님 자신의 주시는 ներկայ와 능력을 강조합니다. 따라서 ‘내 영’으로 번역해 신학적 긴장을 지키는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
