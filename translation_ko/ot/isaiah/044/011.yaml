id: ISA.44.11
reference: Isaiah 44:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
  footnotes:
  - marker: a
    text: 'Or ''are merely human beings.'' Hebrew: ''are from man'' / ''are of mankind,'' emphasizing that the idol-makers are only human, not divine.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Let all of them gather themselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 그의 동료들 모두가 부끄러움을 당할 것이며, 장인들은 다만 사람일 뿐입니다[a]. 그들 모두 모여 서십시오[b]. 그들은 두려워하고 함께 부끄러움을 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 다만 사람들입니다.’ 히브리어는 문자적으로 ‘사람에게서’ 또는 ‘인류에게서’라는 뜻으로, 우상 제작자들이 신이 아니라 오직 인간임을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 모두 스스로 모이십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
