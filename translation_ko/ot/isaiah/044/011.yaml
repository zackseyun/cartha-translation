  - 보십시오, 보라
  lexicon: HALOT
  rationale: 주의를 끄는 감탄/지시 표현으로서 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고, 예언적 경고의 직접성을 살립니다.
- source_word: חֲבֵרָיו
  english_pob_choice: his companions
  chosen_korean: 그의 동료들
  alternatives_korean:
  - 그의 동무들
  - 그의 동반자들
  lexicon: HALOT
  rationale: 우상 제작자/우상과 연관된 자들을 가리키는 문맥이므로, 관계성을 유지하면서도 현대어로 무리 없는 ‘동료들’을 택했습니다.
- source_word: הֵמָּה מֵאָדָם
  english_pob_choice: are only men
  chosen_korean: 다만 사람일 뿐입니다
  alternatives_korean:
  - 오직 사람일 뿐입니다
  - 인간에 불과합니다
  lexicon: HALOT
  rationale: ‘מֵאָדָם’의 핵심은 신적 존재가 아니라 ‘사람’이라는 제한입니다. 직설적으로 ‘사람일 뿐’으로 옮겨 그 대비를 살렸습니다.
- source_word: יִתְקַבְּצוּ כֻלָּם יַעֲמֹדוּ
  english_pob_choice: Let them all gather and stand up
  chosen_korean: 그들 모두가 모여 서게 하십시오
  alternatives_korean:
  - 그들 모두가 모여 서십시오
  - 그들 모두가 모여서 맞서게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 도전적 소환문을 한국어 명령형으로 살리되, 과도한 해석을 피하고 ‘모여 서다’로 집결·대면의 뉘앙스를 유지했습니다.
- source_word: יִפְחֲדוּ
  english_pob_choice: they will be terrified
  chosen_korean: 두려워하고
  alternatives_korean:
  - 두려워할 것이며
  - 무서워할 것이며
  lexicon: HALOT
  rationale: 문맥상 결과적 공포를 나타내므로 자연스러운 동사 ‘두려워하고’로 처리해 뒤의 ‘부끄러움을 당할 것입니다’와 병렬을 맞췄습니다.
theological_decisions:
- issue: 우상 제작자들의 인간성 강조
  chosen_reading: ‘다만 사람일 뿐입니다’로 번역해, 장인들이 신적 권위를 지닌 존재가 아니라는 점을 직접 드러냈습니다.
  alternative_readings:
  - ‘사람에 불과합니다’
  - ‘인간일 뿐입니다’
  rationale: 본문의 대조점은 창조자/피조물, 신적/인간적 구분입니다. 한국어에서도 완곡하게 흐리지 않고 제한적 인간성을 분명히 하는 것이 문맥에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם의 문맥적 번역 원칙; 우상 비판 본문'
