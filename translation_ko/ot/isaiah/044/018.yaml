  timestamp: '2026-07-13T17:08:59Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어 טַח(3인칭 남성 단수)는 눈과 마음 모두에 걸리는 하나의 동작인데, 초안의 ‘그들의 마음이 깨닫지 못하게 했기’는 별도의 사역 동작을 보태어 원문의 단일 술어 구조와 구체적 ‘덮음/바름’ 은유를 약화합니다. 또한 לִבּוֹתָם은 동작의 대상이므로 ‘마음이’보다 ‘마음을’으로 옮기는 것이 적절합니다.
  naturalness: ‘알지도 못하고 깨닫지도 못합니다’와 ‘눈을 보지 못하도록, 마음을 깨닫지 못하도록 덮었기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 반복되는 ‘-도록’은 원문의 두 부정적 결과를 명료하게 보존합니다.
  terminology: ‘마음’은 히브리어 לֵב/לֵבָב의 인지적 용법을 보존하며, ‘깨닫다’는 בין 및 השׂכיל의 문맥상 인지·통찰 의미를 무리 없이 반영합니다. ‘덮다’는 טַח의 물질적 은유를 유지하되, 주체를 ‘하나님’으로 특정하지 않습니다.
  issues:
