revisions:
- from: 그들은 알지 못하고, 깨닫지도 못합니다. 이는 그가 그들의 눈을 보지 못하게 덮었고, 그들의 마음이 깨닫지 못하게 했기 때문입니다.[a][b][c]
  to: 그들은 알지도 못하고 깨닫지도 못합니다. 그가 그들의 눈을 보지 못하도록, 그들의 마음[b]을 깨닫지 못하도록 덮었기[a][c] 때문입니다.
  rationale: 원문의 암시된 단수 주체와 단일 동사 טַח이 눈과 마음 양쪽에 미치는 구조를 한국어에서도 유지했습니다. ‘그가’는 원문이 밝히지 않는 행위자를 특정하지 않으며, ‘덮다’는 해석적인 ‘눈멀게 하다’보다 원문의 구체적 은유를 더 직접적으로 반영합니다. 각주 표지도 해당 어구에 붙여 참조 범위를 명확히 했습니다.
