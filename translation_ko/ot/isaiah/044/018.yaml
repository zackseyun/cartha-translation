    rationale: 원문은 암시된 단수 주체가 ‘그들의 눈’과 ‘그들의 마음’을 모두 טַח(바르다/덮다)한 것으로 표현합니다. 초안은 마음에 대해서는 ‘깨닫지 못하게 하다’라는 별도 사역 표현을 사용하여 덮음의 은유와 통사적 연결을 소실합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한꺼번에 놓여 해당 어구와의 연결이 불분명합니다.
    rationale: ‘마음’ 및 ‘덮었’에 각각 표지를 붙이면 문화적 설명, 어휘 대안, 암시된 주체에 대한 주석의 범위가 분명해집니다.
