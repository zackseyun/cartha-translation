id: ISA.44.18
reference: Isaiah 44:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
  footnotes:
  - marker: a
    text: Or 'has plastered over their eyes so they cannot see.' The Hebrew verb is a concrete image of smearing or coating over, often rendered more interpretively as 'blinded.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'their hearts,' using 'heart' as the seat of thought and understanding, not merely emotion.
    reason: cultural_note
  - marker: c
    text: The subject of 'has smeared' is implicit in Hebrew; the text does not explicitly name the agent here.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 알지도 못하고 깨닫지도 못합니다. 그가 그들의 눈을 보지 못하도록, 그들의 마음[b]을 깨닫지 못하도록 덮었기[a][c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טַח은 문자적으로는 ‘바르다, 덮다’라는 구체적 이미지를 가리키며, 여기서는 관습적으로 ‘눈멀게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘마음’은 단지 감정만이 아니라 생각과 이해의 자리도 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 이 동작의 주체를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  english_pob_choice: They do not know
  chosen_korean: 알지 못하고
  alternatives_korean:
