  - 분별하지도 못합니다
  lexicon: HALOT
  rationale: בין의 인지적 의미를 살려 ‘깨닫다’로 옮겼고, 앞 절과의 대응을 위해 ‘-지도 못합니다’ 구조를 사용했습니다.
- source_word: טַח מֵרְאוֹת עֵינֵיהֶם
  english_pob_choice: has smeared their eyes from seeing
  chosen_korean: 그들의 눈을 보지 못하게 덮었고
  alternatives_korean:
  - 그들의 눈을 보지 못하게 발랐고
  - 그들의 눈을 막았고
  - 그들의 눈에 덮개를 씌웠고
  lexicon: HALOT
  rationale: טח의 구체적 이미지인 ‘바르다/덮다’를 유지하되, 한국어에서 더 자연스럽게 들리는 ‘보지 못하게 덮다’로 옮겨 원문의 물리적 은유를 보존했습니다.
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  english_pob_choice: and their hearts from understanding
  chosen_korean: 그들의 마음이 깨닫지 못하게
  alternatives_korean:
  - 그들의 마음이 분별하지 못하게
  - 그들의 심장이 이해하지 못하게
  - 그들의 마음이 통찰하지 못하게
  lexicon: HALOT
  rationale: לֵב/לֵבָב의 인지 중심 기능을 한국어의 ‘마음’으로 옮겼고, ‘깨닫다’로 השׂכיל의 지적 인식을 반영했습니다.
theological_decisions:
- issue: 눈과 마음을 막는 주체가 암시적으로 제시됨
  chosen_reading: ‘그가’로 두어 히브리어 3인칭 단수의 암시적 주체를 살렸습니다.
  alternative_readings:
  - 주체를 생략해 ‘눈을 보지 못하게 덮었고’로만 옮기는 방식
  - ‘하나님이’로 명시하는 방식
  rationale: 원문은 주체를 직접 밝히지 않으므로, 한국어에서는 문법상 필요한 최소한의 대명사 ‘그가’를 사용하되 특정 주체를 명시하지 않아 해석의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
