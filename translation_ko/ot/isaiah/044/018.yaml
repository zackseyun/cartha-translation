id: ISA.44.18
reference: Isaiah 44:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
  footnotes:
  - marker: a
    text: Or 'has plastered over their eyes so they cannot see.' The Hebrew verb is a concrete image of smearing or coating over, often rendered more interpretively as 'blinded.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'their hearts,' using 'heart' as the seat of thought and understanding, not merely emotion.
    reason: cultural_note
  - marker: c
    text: The subject of 'has smeared' is implicit in Hebrew; the text does not explicitly name the agent here.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 알지 못하고, 깨닫지도 못합니다. 이는 그가 그들의 눈을 보지 못하게 덮었고, 그들의 마음이 깨닫지 못하게 했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טַח은 문자적으로는 ‘바르다, 덮다’의 구체적 이미지를 가리키며, 여기서는 관습적으로 ‘눈멀게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘마음’은 단지 감정만이 아니라 생각과 이해의 자리도 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 이 동작의 주체를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  english_pob_choice: They do not know
  chosen_korean: 알지 못하고
  alternatives_korean:
  - 모르고
  - 알지 못하며
  lexicon: HALOT
  rationale: ידע의 기본 의미를 평이한 현대 한국어로 옮겼고, 부정 병렬 구조를 살리기 위해 앞 절과 자연스럽게 이어지도록 했습니다.
- source_word: וְלֹא יָבִינוּ
  english_pob_choice: nor do they understand
  chosen_korean: 깨닫지도 못합니다
  alternatives_korean:
  - 이해하지도 못합니다
  - 분별하지도 못합니다
  lexicon: HALOT
  rationale: בין의 인지적 의미를 살려 ‘깨닫다’로 옮겼고, 앞 절과의 대응을 위해 ‘-지도 못합니다’ 구조를 사용했습니다.
- source_word: טַח מֵרְאוֹת עֵינֵיהֶם
  english_pob_choice: has smeared their eyes from seeing
  chosen_korean: 그들의 눈을 보지 못하게 덮었고
  alternatives_korean:
  - 그들의 눈을 보지 못하게 발랐고
  - 그들의 눈을 막았고
  - 그들의 눈에 덮개를 씌웠고
  lexicon: HALOT
  rationale: טח의 구체적 이미지인 ‘바르다/덮다’를 유지하되, 한국어에서 더 자연스럽게 들리는 ‘보지 못하게 덮다’로 옮겨 원문의 물리적 은유를 보존했습니다.
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  english_pob_choice: and their hearts from understanding
  chosen_korean: 그들의 마음이 깨닫지 못하게
  alternatives_korean:
  - 그들의 마음이 분별하지 못하게
  - 그들의 심장이 이해하지 못하게
  - 그들의 마음이 통찰하지 못하게
  lexicon: HALOT
  rationale: לֵב/לֵבָב의 인지 중심 기능을 한국어의 ‘마음’으로 옮겼고, ‘깨닫다’로 השׂכיל의 지적 인식을 반영했습니다.
theological_decisions:
- issue: 눈과 마음을 막는 주체가 암시적으로 제시됨
  chosen_reading: ‘그가’로 두어 히브리어 3인칭 단수의 암시적 주체를 살렸습니다.
  alternative_readings:
  - 주체를 생략해 ‘눈을 보지 못하게 덮었고’로만 옮기는 방식
  - ‘하나님이’로 명시하는 방식
  rationale: 원문은 주체를 직접 밝히지 않으므로, 한국어에서는 문법상 필요한 최소한의 대명사 ‘그가’를 사용하되 특정 주체를 명시하지 않아 해석의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
