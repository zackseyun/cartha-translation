  text: הָ/אֹמֵ֥ר לַ/צּוּלָ֖ה חֳרָ֑בִי וְ/נַהֲרֹתַ֖יִ/ךְ אוֹבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
  footnotes:
  - marker: a
    text: Or 'to the depths.' The Hebrew term refers to the watery deep.
    reason: lexical_alternative
translation:
  language: ko
  text: “깊은 물에게 ‘마르라. 내가 네 강들을 말리겠다’라고 말씀하시는 분”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깊은 물’은 히브리어 צּוּלָה의 물 깊이, 곧 심연을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  english_pob_choice: who says
  chosen_korean: “...라고 말씀하시는 분”
  alternatives_korean:
  - “...라고 말하는 분”
  - “...라고 하시는 분”
  lexicon: HALOT
  rationale: 히브리어 분사구문이 앞 문맥의 하나님을 가리키는 설명절로 기능하므로, 한국어에서도 현재형 관계절 느낌을 살려 ‘말씀하시는 분’으로 옮겼습니다.
- source_word: לַצּוּלָה
  english_pob_choice: to the deep
  chosen_korean: “깊은 물에게”
  alternatives_korean:
  - “깊은 데에게”
  - “깊은 곳에게”
  - “깊은 데(들)에게”
  lexicon: HALOT
  rationale: צּוּלָה는 단순한 깊이가 아니라 물의 깊은 심연을 가리키므로, ‘깊은 물’로 옮겨 수역 이미지를 분명히 했습니다.
- source_word: חֳרָבִי
  english_pob_choice: Be dry
  chosen_korean: “마르라”
  alternatives_korean:
  - “메마르라”
  - “건조해지라”
  lexicon: HALOT
  rationale: 여성 단수 명령형으로 깊은 물을 향한 직접 명령이므로, 짧고 강한 명령형 ‘마르라’가 원문의 힘을 가장 잘 살립니다.
- source_word: אוֹבִישׁ
  english_pob_choice: I will dry up
  chosen_korean: “내가 네 강들을 말리겠다”
  alternatives_korean:
  - “내가 네 강들을 마르게 하겠다”
  - “내가 네 강들을 말라 버리게 하겠다”
  lexicon: HALOT
  rationale: 히필 미완료 1인칭 단수의 사역적 미래를 반영해 ‘말리겠다’로 옮겼고, ‘네 강들’의 2인칭 여성 단수 접미사도 유지했습니다.
theological_decisions:
- issue: 문장 내 주어 생략과 문맥 의존성
  chosen_reading: 이 절 안에서는 주어인 ‘야훼’를 덧붙이지 않고, 앞 문맥에 의존하는 관계절 구조를 유지했습니다.
  alternative_readings:
  - “야훼께서 깊은 물에게...”처럼 주어를 보충함
  rationale: 히브리어 본문이 앞선 하나님 묘사를 이어받는 구문이므로, 본문에 없는 주어를 보태지 않고 문학적 흐름을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
