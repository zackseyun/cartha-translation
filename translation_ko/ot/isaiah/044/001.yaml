review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘야곱, 나의 종’과 ‘이스라엘, 내가 택한 자’를 병렬로 놓아 동일한 백성을 두 이름으로 부릅니다. 초안은 핵심 어휘와 완료형의 의미를 대체로 충실히 반영하지만, ‘야곱, 내 종이여, 그리고 … 이스라엘아’는 ‘내 종’을 야곱과 별개의 호격처럼 들리게 할 여지가 있습니다.
  naturalness: ‘나의 종 야곱아, 내가 택한 이스라엘아’로 명사구와 호격의 관계를 분명히 하면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다. ‘그러나 이제 들으십시오’도 문맥 전환과 공적·예언적 호소의 격식을 적절히 살립니다.
  terminology: ‘종’은 עַבְדִּי의 언약적·소명적 호칭에 적절하며, ‘택한’은 בָּחַרְתִּי בוֹ를 자연스럽게 반영합니다. ‘나의’는 이 직접 호칭 구성에서 ‘내’보다 다소 더 안정적이고 격식 있는 표현입니다.
  issues:
  - severity: medium
    issue: ‘내 종이여’의 호격 배치
    rationale: 원문에서 ‘나의 종’은 야곱을 수식합니다. 초안의 쉼표와 호격 어미는 이를 독립된 피호칭으로 오해하게 할 수 있으므로 ‘나의 종 야곱아’로 결속을 명시하는 것이 좋습니다.
  - severity: low
    issue: 각주가 어휘 대안을 제시하지 않음
    rationale: 현 각주는 ‘들으십시오’의 번역 방침을 설명할 뿐 실제 대안이나 본문 이해에 필요한 정보를 제공하지 않습니다. 원문의 간결성을 보존하기 위해 삭제하는 편이 적절합니다.
  revised_text: 그러나 이제 들으십시오, 나의 종 야곱아, 내가 택한 이스라엘아.
