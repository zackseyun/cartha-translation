  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
  footnotes:
  - marker: a
    text: Or “And now hear, Jacob my servant, and Israel, whom I chose.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 들으십시오, 야곱, 내 종이여, 그리고 내가 택한 이스라엘아.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들으십시오’는 예언적 호소를 살린 번역입니다. 원문의 단순 명령은 ‘듣다/귀 기울이다’의 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 문맥상 우상숭배와 심판의 흐름에서 위로와 재호출로 전환되는 대비가 있으므로, 단순한 시간표지보다 역접 뉘앙스를 살린 ‘그러나 이제’가 더 적절합니다.
- source_word: שְׁמַע
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  lexicon: HALOT
  rationale: 예언적 직접 호소의 명령형을 현대 표준어 합쇼체로 옮기되, 단순 정보 청취가 아니라 말씀에 귀 기울이라는 촉구를 자연스럽게 전달합니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종이여
  alternatives_korean:
  - 내 종
  - 나의 종이여
  - 내 종아
  lexicon: HALOT
  rationale: 이사야의 언약적 호칭에서 עבד를 표준적으로 ‘종’으로 옮기되, 호격을 드러내어 ‘내 종이여’로 처리해 부름의 직접성을 살렸습니다.
- source_word: בָּחַרְתִּי בוֹ
  english_pob_choice: whom I have chosen
  chosen_korean: 내가 택한
  alternatives_korean:
  - 내가 선택한
  - 내가 택하였던
  lexicon: HALOT
  rationale: 히브리어의 완료형과 POB의 현재적 언약 의미를 반영하여 ‘내가 택한’으로 옮겼고, 목적격 관계를 한국어 관용상 앞의 명사구에 붙여 자연스럽게 처리했습니다.
theological_decisions:
- issue: 이스라엘에 대한 호칭 ‘내 종’의 번역
  chosen_reading: ‘종’으로 번역해 언약적 소명과 소속을 드러냈습니다.
  alternative_readings:
  - ‘노예’로 번역
  - ‘섬기는 자’로 완화
  rationale: 이 절에서는 억압적 신분보다 야훼께 속한 언약 백성이라는 관계와 소명이 전면에 있으므로, POB의 판단대로 ‘종’이 원문의 신학적 중심을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
