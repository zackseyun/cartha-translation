revisions:
- from: 이것들을 기억하십시오[a], 야곱아, 이스라엘아. 너는 내 종이기 때문입니다. 내가 너를 지었고, 너는 나를 위한 종입니다. 이스라엘아, 너는 나에게 잊히지 않을 것입니다.
  to: 야곱아, 이스라엘아, 이것들을 기억하십시오[a]. 너는 내 종입니다. 내가 너를 빚었습니다. 너는 내게 속한 종입니다. 이스라엘아, 너는 내게 잊히지 않을 것입니다.
  rationale: 히브리어 절들의 독립된 병렬을 유지하면서 יצר의 ‘빚어 형성함’과 עבד לי의 소속 관계를 더 정확히 반영했습니다. 마지막 절은 선택된 ‘내게 잊히지 않을 것입니다’ 읽기를 유지하고, 문법적으로 가능한 반대 방향의 읽기는 각주에서 보존했습니다. 본문과 각주를 모두 합쇼체로 정리했습니다.
