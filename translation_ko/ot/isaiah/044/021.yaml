id: ISA.44.21
reference: Isaiah 44:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְכָר אֵ֣לֶּה יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל כִּ֣י עַבְדִּ/י אָ֑תָּה יְצַרְתִּ֤י/ךָ עֶֽבֶד לִ/י֙ אַ֔תָּה יִשְׂרָאֵ֖ל לֹ֥א תִנָּשֵֽׁ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
  footnotes:
  - marker: a
    text: Or, 'Israel, you shall not forget me.' The Hebrew form can be understood this way, and some interpreters take it as an exhortation rather than a reassurance.
    reason: alternative_reading
translation:
  language: ko
  text: 이것들을 기억하십시오[a], 야곱아, 이스라엘아. 너는 내 종이기 때문입니다. 내가 너를 지었고, 너는 나를 위한 종입니다. 이스라엘아, 너는 나에게 잊히지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘아, 너는 나를 잊지 말아라.’ 히브리어 형태는 이렇게도 이해될 수 있으며, 일부 해석자들은 이를 위로가 아니라 권고로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר אֵלֶּה
  english_pob_choice: Remember these things
  chosen_korean: 이것들을 기억하십시오
  alternatives_korean:
  - 이것들을 마음에 두십시오
  - 이것들을 기억하라
  lexicon: HALOT
  rationale: 히브리어 명령형 זְכָר와 복수 지시어 אֵלֶּה를 자연스러운 현대 한국어 명령으로 옮겼습니다. ‘이것들’이 앞 문맥의 내용을 가리키므로 명시했습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 나의 종
  lexicon: HALOT
  rationale: 이곳은 언약적 소속과 봉사 관계가 강조되므로 기본값인 ‘종’을 유지했습니다. POB의 영어도 ‘servant’로 처리해 bonded-status를 드러내지 않았습니다.
- source_word: יְצַרְתִּיךָ
  english_pob_choice: I formed you
  chosen_korean: 내가 너를 지었고
  alternatives_korean:
  - 내가 너를 빚었고
  - 내가 너를 빚어 만들었고
  lexicon: HALOT
  rationale: יצר의 빚어 만듦/형성 이미지를 한국어에서 가장 간결하게 살릴 수 있는 ‘지었고’를 택했습니다. 앞절과의 병렬을 위해 절을 나누었습니다.
- source_word: עֶבֶד לִי
  english_pob_choice: you are a servant to me
  chosen_korean: 너는 나를 위한 종입니다
  alternatives_korean:
  - 너는 나에게 종입니다
  - 너는 내게 속한 종입니다
  lexicon: HALOT
  rationale: לִי의 소속·목적 관계를 함께 살리기 위해 ‘나를 위한 종’으로 옮겼습니다. POB의 ‘a servant for myself’가 보존하려는 목적성을 반영합니다.
- source_word: לֹא תִנָּשֵׁנִי
  english_pob_choice: you will not be forgotten by me
  chosen_korean: 너는 나에게 잊히지 않을 것입니다
  alternatives_korean:
  - 너는 나를 잊지 않을 것입니다
  - 너는 나에게서 잊히지 않을 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 따라 ‘잊히지 않을 것입니다’로 옮겼습니다. 주체가 하나님이라는 위로의 흐름을 자연스럽게 드러냅니다.
theological_decisions:
- issue: לֹא תִנָּשֵׁנִי의 문법적·의미적 긴장
  chosen_reading: 위로의 진술로 읽어, 하나님께서 이스라엘을 잊지 않으신다고 번역했습니다.
  alternative_readings:
  - 이스라엘에게 주는 명령/예고로 읽어 ‘너는 나를 잊지 않을 것이다’로 볼 수 있습니다.
  rationale: 문맥상 본절은 창조하신 주체가 자기 백성을 기억하신다는 언약적 확언으로 자연스럽게 수렴됩니다. 다만 히브리어 자음이 다른 읽기를 허용하므로 본문 주석으로 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
