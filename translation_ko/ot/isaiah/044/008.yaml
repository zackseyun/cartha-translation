source:
  edition: WLC
  text: אַֽל תִּפְחֲדוּ֙ וְ/אַל תִּרְה֔וּ הֲ/לֹ֥א מֵ/אָ֛ז הִשְׁמַעְתִּ֥י/ךָ וְ/הִגַּ֖דְתִּי וְ/אַתֶּ֣ם עֵדָ֑/י הֲ/יֵ֤שׁ אֱל֨וֹהַּ֙ מִ/בַּלְעָדַ֔/י וְ/אֵ֥ין צ֖וּר בַּל יָדָֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
  footnotes:
  - marker: a
    text: Or 'Do not fear, and do not be terrified.' The second verb is rare and may intensify the first prohibition.
    reason: lexical_alternative
  - marker: b
    text: Or 'Have I not from of old made you hear and declared it?'
    reason: lexical_alternative
  - marker: c
    text: '''Rock'' is a title for God, emphasizing his stability and reliability; alternatively, ''rock.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 두려워하지 말며, 떨지 마십시오.[a] 내가 오래전부터 너에게 들려주고 알려 주지 않았습니까?[b] 너희는 내 증인입니다. 나 외에 하나님이 있습니까? 다른 반석은 없습니다.[c] 내가 아는 것은 하나도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하지 말고, 두려움에 떨지 마십시오.’ 둘째 동사는 드물며 첫째 금지를 강화하는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 예로부터 너에게 들려주고 알려 주지 않았습니까?’
    reason: lexical_alternative
  - marker: c
    text: ‘반석’은 하나님을 가리키는 호칭으로, 그의 견고함과 신실함을 강조합니다. 또는 ‘바위’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ / תִּרְהוּ
  english_pob_choice: Do not fear ... and do not tremble
  chosen_korean: 두려워하지 말고, 떨지 마십시오
  alternatives_korean:
  - 두려워하지 마십시오, 그리고 두렵지 마십시오
  - 무서워하지 말고, 떨지 마십시오
  lexicon: HALOT
  rationale: 두 동사는 병렬 금지문으로, 첫째는 פחד의 일반적 두려움, 둘째는 희귀 동사의 강한 반응을 살려 ‘떨다’로 옮겨 긴장감을 유지했습니다.
- source_word: מֵאָז הִשְׁמַעְתִּי/ךָ וְהִגַּדְתִּי
  english_pob_choice: Have I not long ago made you hear and declared it?
  chosen_korean: 내가 오래전에 당신에게 듣게 하고 선언하지 않았습니까?
  alternatives_korean:
  - 내가 예로부터 당신에게 들려주고 알려주지 않았습니까?
  - 내가 오래전에 당신에게 듣게 하고 말씀하지 않았습니까?
  lexicon: HALOT
  rationale: causative ‘made you hear’와 ‘declared’의 이중 동작을 드러내기 위해 ‘듣게 하다’와 ‘선언하다’를 분리해 옮겼습니다.
- source_word: עֵדַי
  english_pob_choice: you are my witnesses
  chosen_korean: 당신들은 내 증인입니다
  alternatives_korean:
  - 너희는 내 증인입니다
  - 당신은 내 증인입니다
  lexicon: HALOT
  rationale: 복수 접미사에 맞춰 복수로 옮겼고, 법정적 증언의 뉘앙스를 살리기 위해 ‘증인’을 유지했습니다.
- source_word: אֱלוֹהַּ / צוּר
  english_pob_choice: Is there a God besides me? There is no Rock; I know of none
  chosen_korean: 나 외에 하나님이 있습니까? 바위는 없습니다. 내가 아는 바도 없습니다.
  alternatives_korean:
  - 나 외에 신이 있습니까? 반석은 없습니다. 내가 아는 바도 없습니다.
  - 나 외에 하나님이 있습니까? 반석은 없습니다. 내가 아는 바도 없습니다.
  lexicon: HALOT
  rationale: אֱלוֹהַּ는 유일신 논쟁 문맥이므로 ‘하나님’으로 옮기고, צוּר은 시편/이사야의 흔한 비유적 호칭이지만 한국어 독자의 직관을 고려해 기본 의미인 ‘바위’로 두되, 영문 주석의 제목성 긴장은 본문 본연의 은유로 남겼습니다.
theological_decisions:
- issue: 하나님과 바위/반석의 유일성 진술
  chosen_reading: 본문을 야훼 외에 다른 신적 존재가 없다는 절대적 부정으로 읽고, 두 번째 절은 그 유일성을 반복 강화하는 진술로 보았습니다.
  alternative_readings:
  - ‘바위’를 하나님 호칭으로 상향해 ‘반석’으로 옮기는 읽기
  - 첫 절의 ‘하나님’을 소문자적 ‘신’ 범주로 낮추는 읽기
  rationale: 문맥은 우상 반박과 야훼의 독자성을 강조하므로, 한국어에서도 배타적 진술이 분명히 드러나도록 했습니다. 다만 צוּר의 제목성은 본문 의미 안에 존재하지만, 이번 절에서는 직역적 ‘바위’가 원문의 감각을 더 직접적으로 드러낸다고 판단했습니다.
  doctrine_reference: Translation philosophy §1, §6; DOCTRINE.md Affirmations
