id: ISA.44.22
reference: Isaiah 44:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָחִ֤יתִי כָ/עָב֙ פְּשָׁעֶ֔י/ךָ וְ/כֶ/עָנָ֖ן חַטֹּאותֶ֑י/ךָ שׁוּבָ֥/ה אֵלַ֖/י כִּ֥י גְאַלְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
  footnotes:
  - marker: a
    text: Or 'I have blotted out your transgressions like a cloud, and your sins like a cloud/mist.' The Hebrew uses two related cloud terms in poetic parallelism.
    reason: lexical_alternative
  - marker: b
    text: '''Return to me'' can also be rendered ''Turn back to me,'' carrying covenantal and repentant overtones.'
    reason: lexical_alternative
  - marker: c
    text: Or possibly, in prophetic idiom, 'I will wipe away ... I will redeem you.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 네 허물을 구름처럼, 네 죄를 구름처럼 지웠습니다.[a] 내게로 돌아오십시오.[b] 내가 너를 속량하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 관련된 두 구름 표현을 시적으로 병행합니다. 둘째 표현은 문맥에 따라 ‘안개’ 또는 ‘비구름’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아오십시오’는 ‘돌이키십시오’ 또는 ‘되돌아오십시오’로도 옮길 수 있으며, 회개와 관계 회복의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 예언자적 용법에서는 ‘내가 네 허물을 구름처럼 지우고 네 죄를 구름처럼 지우겠다. 내가 너를 속량하겠다’라는 미래의 선언으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  english_pob_choice: I have wiped away
  chosen_korean: 지워 버렸습니다
  alternatives_korean:
  - 닦아 버렸습니다
  - 말끔히 없앴습니다
  - 지워 없앴습니다
  lexicon: HALOT
  rationale: מחה는 없애다, 지우다, 지워 버리다의 뜻을 가지며, 뒤의 구름 이미지와도 잘 어울리므로 현대어로는 '지워 버렸습니다'가 가장 자연스럽고 제거의 뉘앙스를 살립니다.
- source_word: פְּשָׁעֶיךָ
  english_pob_choice: your transgressions
  chosen_korean: 네 허물
  alternatives_korean:
  - 네 죄과
  - 네 범죄
  - 네 반역
  lexicon: HALOT
  rationale: פשע는 단순한 실수보다 언약을 어긴 불의와 위반의 성격이 강하므로, 다소 포괄적이면서도 도덕적 책임을 드러내는 '허물'로 옮겼습니다.
- source_word: כָעָב / כֶעָנָן
  english_pob_choice: like a cloud / like a mist
  chosen_korean: 구름처럼 / 안개처럼
  alternatives_korean:
  - 구름처럼 / 구름처럼
  - 먹구름처럼 / 연무처럼
  - 구름같이 / 옅은 구름처럼
  lexicon: HALOT
  rationale: 두 개의 유사하지만 다른 구름 관련 명사를 병렬로 두는 히브리어 시어를 살려, 첫째는 '구름처럼', 둘째는 더 희미하고 사라지는 이미지를 주는 '안개처럼'으로 구분했습니다.
- source_word: שׁוּבָה אֵלַי
  english_pob_choice: Return to me
  chosen_korean: 내게로 돌아오십시오
  alternatives_korean:
  - 내게로 돌아오라
  - 내게로 돌아오세요
  - 돌아오십시오
  lexicon: HALOT
  rationale: שוב은 단순 이동이 아니라 관계 회복과 회개를 포함하는 '돌아오다'이므로, 합쇼체 명령형으로 '내게로 돌아오십시오'가 본문의 권면을 가장 잘 전달합니다.
- source_word: גְאַלְתִּיךָ
  english_pob_choice: I have redeemed you
  chosen_korean: 내가 너를 속량하였습니다
  alternatives_korean:
  - 내가 너를 구속하였습니다
  - 내가 너를 구원하였습니다
  - 내가 너를 무르셨습니다
  lexicon: HALOT
  rationale: גאל은 구속자/기업 무를 자의 법정-친족적 구원 개념을 담으므로, 교회적 관용어이면서도 법적 대가의 뉘앙스를 살리는 '속량하다'를 택했습니다.
theological_decisions:
- issue: ‘돌아오라’ 명령의 회개·언약 회복 뉘앙스
  chosen_reading: 문자적 이동이 아니라 하나님께로의 언약적 귀환과 회개를 포함하는 권면으로 읽었습니다.
  alternative_readings:
  - 단순히 관계 회복을 위한 초대
  - 정서적 위로 중심의 초대
  rationale: 히브리어 שוב의 예언자적 용례는 하나님께로 돌아오는 회개와 회복의 의미를 함께 지니므로, 한국어에서도 그 신학적 긴장을 유지해야 합니다.
  doctrine_reference: 회개와 언약 회복에 관한 예언자적 용례
- issue: 완료 동사의 시제 처리
  chosen_reading: 완료된 선언으로 현재적 효력을 가진 과거-현재완료 뉘앙스를 살렸습니다.
  alternative_readings:
  - '과거형으로 단순화: 지웠습니다 / 속량하였습니다'
  - '예언적 미래형으로 단순화: 지울 것입니다 / 속량할 것입니다'
  rationale: 본문은 이미 이루어진 구속 행위를 근거로 돌아오라고 권면하므로, 한국어에서도 완료성 있는 서술로 그 논리를 보존하는 것이 적절합니다.
  doctrine_reference: 예언적 완료와 현재적 효력의 보존
