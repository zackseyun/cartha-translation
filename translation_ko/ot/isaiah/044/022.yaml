    rationale: ‘내가 너를 지워 버리겠다’는 히브리어의 목적어를 바꿉니다. 지워지는 것은 ‘네 허물’과 ‘네 죄’이며, ‘너’는 속량의 대상입니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 세 각주를 마지막 문장 뒤에 함께 두면 각각의 연결 대상이 불명확합니다. 관련 구절 뒤에 분산하는 것이 독자에게 명료합니다.
