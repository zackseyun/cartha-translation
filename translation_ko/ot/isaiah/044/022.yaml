  to: 내가 네 허물을 구름처럼, 네 죄를 구름처럼 지웠습니다.[a] 내게로 돌아오십시오.[b] 내가 너를 속량하였습니다.[c]
  rationale: 두 히브리어 구름 명사의 차이를 한국어 본문에서 ‘구름/안개’로 고정하지 않고 ‘구름/구름’의 병행으로 보존하였습니다. 그 차이와 가능한 번역은 각주에서 제시했습니다. 또한 미래 해석 각주의 목적어 오류를 바로잡고, 각주 표지를 해당 표현에 각각 붙였습니다. 완료형 번역과 ‘속량’은 원문의 선언적·구속적 의미를 유지합니다.
