  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
  footnotes:
  - marker: a
    text: Or, 'for the LORD has acted' or 'for the LORD has done this.' The Hebrew leaves the object of 'has done' unstated.
    reason: lexical_alternative
  - marker: b
    text: Or, 'lowest parts of the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'and in Israel he glorifies himself' or 'shows himself glorious.'
    reason: alternative_reading
translation:
  language: ko
  text: 하늘아, 기뻐 노래하여라. 야훼께서 행하셨으니, 땅의 깊은 곳들아, 소리 높여 외쳐라. 산들아, 숲아, 그 안의 모든 나무야, 기쁨의 노래를 터뜨려라. 야훼께서 야곱을 구원하셨으며, 이스라엘 가운데서 자신의 영광을 드러내신다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 행하셨다’ 또는 ‘야훼께서 이 일을 행하셨다’. 히브리어는 ‘행하셨다’의 목적어를 명시하지 않는다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 가장 낮은 곳들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 가운데서 자신을 영화롭게 하신다’ 또는 ‘자신을 영광스럽게 나타내신다’.
    reason: alternative_reading
