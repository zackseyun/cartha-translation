source:
  edition: WLC
  text: זֶ֤ה יֹאמַר֙ לַֽ/יהוָ֣ה אָ֔נִי וְ/זֶ֖ה יִקְרָ֣א בְ/שֵֽׁם יַעֲקֹ֑ב וְ/זֶ֗ה יִכְתֹּ֤ב יָד/וֹ֙ לַֽ/יהוָ֔ה וּ/בְ/שֵׁ֥ם יִשְׂרָאֵ֖ל יְכַנֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, “This one will say, ‘To the LORD, I’; another will call by the name of Jacob.” The Hebrew is elliptical and idiomatic.
    reason: lexical_alternative
  - marker: b
    text: “Will write on his hand” likely refers to inscribing or marking the hand as a sign of belonging to the LORD.
    reason: cultural_note
  - marker: c
    text: Or “will surname himself by the name of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람은 「나는 야훼께 속합니다」라고 말할 것이며[a], 다른 사람은 야곱의 이름으로 자신을 부를 것입니다. 또 다른 사람은 자기 손에 「야훼께 속함」이라고 쓸 것이고[b], 이스라엘의 이름으로 자신을 칭할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서술어가 생략된 표현으로, 직역하면 ‘야훼께, 나는’입니다. 문맥상 ‘나는 야훼께 속합니다’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 손에 쓴다는 표현은 야훼께 속함을 나타내는 표식이나 새김을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이스라엘의 이름으로 자신을 성처럼 칭할 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  english_pob_choice: This one ... another ... and another
  chosen_korean: 이 사람은 ... 또 다른 사람은 ... 또 다른 사람은
  alternatives_korean:
  - 한 사람은 ... 또 다른 사람은 ... 또 다른 사람은
  - 이 사람은 ... 이 사람은 ... 이 사람은
  lexicon: HALOT
  rationale: 반복되는 지시 대명사 구조를 한국어에서는 분배를 분명히 드러내면서도 자연스럽게 풀어 옮겼습니다.
- source_word: לַיהוָה אָ֔נִי
  english_pob_choice: I am Yahweh’s
  chosen_korean: 나는 야훼의 사람입니다
  alternatives_korean:
  - 나는 야훼의 것입니다
  - 나는 야훼께 속한 사람입니다
  - 나는 야훼의 소유입니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 소속 고백을 한국어에서는 소유격으로만 두기보다 인격적 소속을 드러내는 표현으로 옮겼습니다. 본문 의미를 살리되 지나치게 교회적 문구로 굳히지 않았습니다.
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  english_pob_choice: will call himself by the name of Jacob
  chosen_korean: 야곱의 이름으로 자신을 부를 것이며
  alternatives_korean:
  - 야곱의 이름으로 자신을 칭할 것이며
  - 야곱이라는 이름으로 자신을 부를 것이며
  - 야곱의 이름을 따라 자신을 부를 것이며
  lexicon: HALOT
  rationale: קרא בשם의 자기 동일시/명명 용법을 따라, 단순한 ‘부르다’보다 자기 정체성을 드러내는 표현으로 옮겼습니다.
- source_word: יִכְתֹּב יָד/וֹ לַיהוָה
  english_pob_choice: will write on his hand ... 'Belonging to Yahweh'
  chosen_korean: 자기 손에 「야훼께 속함」이라고 쓸 것이고
  alternatives_korean:
  - 자기 손에 「야훼의 사람」이라고 쓸 것이고
  - 자기 손에 「야훼께 속한 자」라고 쓸 것이고
  - 자기 손에 야훼의 이름을 새길 것이고
  lexicon: HALOT
  rationale: 영어 주해처럼 손에 적는 행위는 소속 표시의 관용구이므로, 한국어도 이를 명시해 문맥을 분명히 했습니다. ‘손에’는 문자적 이미지를 유지합니다.
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  english_pob_choice: and will name himself by the name of Israel
  chosen_korean: 이스라엘의 이름으로 자신을 이름할 것입니다
  alternatives_korean:
  - 이스라엘의 이름으로 자신을 칭할 것입니다
  - 이스라엘의 이름으로 자신을 부를 것입니다
  - 이스라엘이라는 이름으로 자신을 부를 것입니다
  lexicon: HALOT
  rationale: כנה의 자기 호칭 의미를 살려 ‘이름하다’로 번역하고, ‘자신을’로 반사적 의미를 분명히 했습니다.
theological_decisions:
- issue: 야훼에 대한 소속 고백의 표현
  chosen_reading: ‘나는 야훼의 사람입니다’로 옮겨, 단순한 소속 표지보다 인격적·언약적 귀속의 고백을 드러냈습니다.
  alternative_readings:
  - ‘나는 야훼의 것입니다’처럼 더 축약할 수 있습니다.
  - ‘나는 야훼께 속했습니다’로 더 직설화할 수 있습니다.
  rationale: 본문의 첫 절은 명시적 자기 고백이며, 다음 절들의 명명과 표식이 이어지므로 언약적 소속을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3; 언약적 귀속 고백
- issue: 문자적 표식과 상징적 소속의 병행
  chosen_reading: ‘자기 손에’와 ‘이라고 쓸 것이고’를 유지하여, 육체적 표식이 소속의 상징임을 드러냈습니다.
  alternative_readings:
  - 표식을 완전히 상징화하여 풀어 쓸 수 있습니다.
  - 반대로 ‘새길 것이다’로 더 강하게 문자화할 수 있습니다.
  rationale: 히브리어는 손에 쓰는 구체적 행위를 말하지만, 문맥상 이는 소속을 나타내는 표지이므로 문자성과 상징성을 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1; cultural_note on bodily inscription
