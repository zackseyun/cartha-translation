revisions:
- from: 이 사람은 「나는 야훼의 사람입니다」라고 말할 것입니다. 또 다른 사람은 야곱의 이름으로 자신을 부를 것이며, 또 다른 사람은 자기 손에 「야훼께 속함」이라고 쓸 것이고, 이스라엘의 이름으로 자신을 이름할 것입니다.[a][b][c]
  to: 한 사람은 「나는 야훼께 속합니다」라고 말할 것이며[a], 다른 사람은 야곱의 이름으로 자신을 부를 것입니다. 또 다른 사람은 자기 손에 「야훼께 속함」이라고 쓸 것이고[b], 이스라엘의 이름으로 자신을 칭할 것입니다.[c]
  rationale: 원문의 세 겹 병행, 야훼께 대한 소속 고백, 손에 쓰는 구체적 표식, 야곱과 이스라엘의 이름으로 자기 정체성을 드러내는 뜻을 유지했습니다. 불필요하게 보충된 ‘사람’을 제거하고, 어색한 ‘자신을 이름하다’를 자연스러운 현대 합쇼체 표현인 ‘자신을 칭하다’로 고쳤습니다. 각주는 원문의 생략성과 손 표식의 문화적 배경, 마지막 동사의 대안적 뉘앙스를 각각 해당 위치에서 설명합니다.
  reviewer_model: gpt-5.6-terra
