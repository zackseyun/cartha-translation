  language: ko
  text: 그는 재를 먹습니다[a]. 미혹된 마음이 그를 빗나가게 하여, 그는 자신을 구해 내지도 못하고[b], “내 오른손에 거짓이 있지 않은가?” 하고 말하지도 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 재를 뜯어먹습니다.’ 히브리어 동사는 본래 가축이 풀을 뜯는 모습을 가리키며, 여기서 그 비유를 생생하게 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘자기의 네페스를 구해 내다’입니다. 문맥에 따라 ‘자신’, ‘자기 생명’, 또는 ‘자기 영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
