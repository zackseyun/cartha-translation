id: ISA.44.7
reference: Isaiah 44:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽי כָמ֣וֹ/נִי יִקְרָ֗א וְ/יַגִּידֶ֤/הָ וְ/יַעְרְכֶ֨/הָ֙ לִ֔/י מִ/שּׂוּמִ֖/י עַם עוֹלָ֑ם וְ/אֹתִיּ֛וֹת וַ/אֲשֶׁ֥ר תָּבֹ֖אנָה יַגִּ֥ידוּ לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
  footnotes:
  - marker: a
    text: Or 'from the time I established the people of old.' The Hebrew phrase may be read temporally, and 'ancient people' could also be rendered 'the people of old.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the signs and the things that will come.' The Hebrew word can also be understood as 'signs' or 'tokens,' though here the context favors future events.
    reason: alternative_reading
translation:
  language: ko
  text: 나와 같은 이가 누가 있습니까? 내가 옛 백성을 세운 때부터[a], 그가 외치고 그것을 알리며 내 앞에 차례대로 제시하게 하십시오. 그들이 장차 올 일들[b]과 다가올 일들을 그들에게 알려 주게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구는 ‘내가 오래전의 백성을 세운 이래로’로도 이해할 수 있습니다. ‘옛 백성’은 문맥에 따라 ‘영원한 백성’으로도 번역될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 히브리어는 ‘표징들’ 또는 ‘징조들’로도 이해될 수 있습니다. 그러나 뒤의 ‘다가올 일들’과의 병렬 때문에, 문맥상 미래의 일들을 가리키는 것으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  english_pob_choice: And who is like me?
  chosen_korean: 나와 같은 이가 누가 있습니까?
  alternatives_korean:
  - 그리고 누가 나와 같습니까?
  - 나와 같은 이가 누구입니까?
  lexicon: HALOT
  rationale: 수사적 도전문의 힘을 살려 자연스러운 합쇼체 의문문으로 옮겼습니다. בראש의 ו는 문맥 연결을 보여 주는 정도로만 반영했습니다.
- source_word: יִקְרָא וְיַגִּידֶהָ
  english_pob_choice: let him call and declare it
  chosen_korean: 그가 부르며 그것을 선언하고
  alternatives_korean:
  - 그가 부르며 그것을 알리고
  - 그가 외쳐 그것을 선언하고
  lexicon: HALOT
  rationale: יִקְרָא는 도전적 요청의 뉘앙스를 살려 ‘부르며’로, נגד 계열은 단순한 ‘말하다’보다 공적 선포에 가까운 ‘선언하다’로 옮겼습니다.
- source_word: וְיַעְרְכֶהָ לִי
  english_pob_choice: and set it in order for me
  chosen_korean: 내게 순서대로 제시해 보십시오
  alternatives_korean:
  - 내게 질서 있게 배열해 보십시오
  - 내 앞에 차례로 제시해 보십시오
  lexicon: HALOT
  rationale: ערך의 핵심인 ‘배열하다/정리하다’를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘순서대로 제시하다’를 택했습니다. לִי는 상대적 방향을 살려 ‘내게’로 옮겼습니다.
- source_word: מִשּׂוּמִי עַם עוֹלָם
  english_pob_choice: since I appointed an ancient people
  chosen_korean: 내가 옛 백성을 세운 때부터 그러합니다
  alternatives_korean:
  - 내가 오래된 백성을 정하신 때부터 그러합니다
  - 내가 옛 백성을 지정한 이래로 그러합니다
  lexicon: HALOT
  rationale: שׂוּם은 ‘두다/세우다/지정하다’의 넓은 뜻이 있어, 문맥상 역사 속에서 어떤 백성을 세우신 행위를 드러내는 ‘세우다’로 옮겼습니다. עַם עוֹלָם은 여기서 형이상학적 ‘영원한 백성’보다 시간적 ‘옛 백성’이 더 적절합니다.
- source_word: וְאֹתִיּוֹת וַאֲשֶׁר תָּבֹאנָה
  english_pob_choice: the things to come ... and the things that will come
  chosen_korean: 장차 올 일들을, 그리고 일어날 일들을
  alternatives_korean:
  - 다가올 일들을, 그리고 올 일들을
  - 미래의 일들을, 그리고 앞으로 일어날 일들을
  lexicon: HALOT
  rationale: 영어 POB가 본문의 병렬성을 살린 해석을 따르고 있으므로, 두 표현을 모두 미래 사건을 가리키는 반복적 병렬로 유지했습니다. וְאֹתִיּוֹת는 문맥상 ‘표징’보다는 ‘다가올 일들’로 보는 해석을 반영했습니다.
theological_decisions:
- issue: עַם עוֹלָם의 의미
  chosen_reading: 역사적 의미의 ‘옛 백성’
  alternative_readings:
  - 영원한 백성
  - 태고의 백성
  rationale: 문맥은 우상들에게 도전하며 야훼만이 역사를 세우고 미래를 선포하실 수 있음을 강조합니다. 따라서 이 구절에서는 ‘영원성’보다 ‘옛/오래된’이라는 시간적 의미가 더 직접적입니다.
  doctrine_reference: '번역 원칙: 본문이 요구하지 않는 교리적 확장을 피하고, 본문의 역사적 논지를 보존한다.'
- issue: וְאֹתִיּוֹת의 범위
  chosen_reading: ‘표징’보다 미래 사건/일들
  alternative_readings:
  - 표징
  - 징조
  rationale: 뒤의 ‘장차 올 일들’과 나란한 구조이므로, 여기서는 초자연적 표징보다 미래에 일어날 사건들을 가리키는 것으로 읽는 것이 더 문맥적입니다.
  doctrine_reference: '원문 우선 원칙: 병렬 구조와 문맥을 따라 의미 범위를 결정한다.'
