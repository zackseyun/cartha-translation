revisions:
- from: 나와 같은 이가 누가 있습니까? 그가 부르며 그것을 선언하고, 내게 순서대로 제시해 보십시오. 내가 옛 백성을 세운 때부터 그러합니다. 그리고 그들에게 장차 올 일들을, 그리고 일어날 일들을 선언하게 하십시오.[a][b]
  to: 나와 같은 이가 누가 있습니까? 내가 옛 백성을 세운 때부터[a], 그가 외치고 그것을 알리며 내 앞에 차례대로 제시하게 하십시오. 그들이 장차 올 일들[b]과 다가올 일들을 그들에게 알려 주게 하십시오.
  rationale: 원문의 도전적 수사법을 살리면서 모든 3인칭 동사를 한국어의 ‘~하게 하십시오’ 구문으로 일관되게 처리했습니다. 원문에 없는 ‘그러합니다’를 삭제하고, מִשּׂוּמִי를 시간 구문으로 보존했습니다. 마지막 절의 ‘그들이/그들에게’는 해석으로 특정하지 않아 원문의 대명사상 난점을 보존했으며, 두 미래 지시 표현도 반복 병렬로 유지했습니다.
