source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'besides me there is no god.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하십니다. 이스라엘의 왕이시며 그의 구속자이신 야훼 만군의 하나님, “나는 처음이며 나는 마지막입니다. 나 외에는 하나님이 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주님’으로 읽기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나 외에는 하나님이 없습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원문 직접성을 따라 יהוה는 통상적 대치어 ‘주님’이 아니라 고유명사 음역 ‘야훼’로 옮겼습니다.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the King of Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘의 임금
  - 이스라엘 왕
  lexicon: HALOT
  rationale: 히브리어의 관형적 소유 구조를 자연스러운 한국어로 풀어 ‘이스라엘의 왕’으로 옮겼습니다.
- source_word: גֹאֲלוֹ
  english_pob_choice: his Redeemer
  chosen_korean: 그의 구속자
  alternatives_korean:
  - 그의 속량자
  - 그를 구원하시는 분
  lexicon: HALOT
  rationale: גאל의 구속/해방 의미를 살려 ‘구속자’로 옮겼고, ‘구속’이 한국어 성서 문맥에서 비교적 넓고 안정적인 대응어입니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 군대의 하나님
  - 야훼 만군의 여호와
  lexicon: HALOT
  rationale: צְבָאוֹת의 기본 의미는 ‘군대들/군대의 무리’이므로 ‘만군’으로 옮기되, 한국어에서 통용되는 ‘만군의 하나님’ 구문을 사용해 호칭성을 살렸습니다.
- source_word: אֵין אֱלֹהִים
  english_pob_choice: there is no God
  chosen_korean: 하나님이 없습니다
  alternatives_korean:
  - 신이 없습니다
  - 다른 신은 없습니다
  lexicon: HALOT
  rationale: 문맥상 유일신 선언이므로 אֱלֹהִים을 일반명사 ‘신’보다 절대적 호칭 ‘하나님’으로 옮겨 대조적 의미를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 고유명사와 칭호의 병렬
  chosen_reading: ‘야훼’와 ‘이스라엘의 왕’ 및 ‘그의 구속자’와 ‘야훼 만군의 하나님’을 병렬로 유지했습니다.
  alternative_readings:
  - 한 번의 ‘주님’으로 통합
  - 칭호를 하나로 압축
  rationale: 히브리어는 하나님의 이름과 칭호를 겹쳐 선언하여 권위와 구속 관계를 함께 드러내므로, 이를 한국어에서도 풀어 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; retain source-level repetitions and apposition'
- issue: “나 외에는 하나님이 없습니다”의 유일신 선언
  chosen_reading: ‘하나님이 없습니다’로 강한 배타성을 살렸습니다.
  alternative_readings:
  - ‘다른 신이 없습니다’
  - ‘신이 없습니다’
  rationale: 본문은 단순한 우상 대비를 넘어서 야훼의 유일성을 선언하므로, ‘다른’의 보충 없이 배타적 진술을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Monotheistic claims should remain forceful without dilution'
