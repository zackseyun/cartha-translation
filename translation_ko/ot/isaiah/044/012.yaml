  text: חָרַ֤שׁ בַּרְזֶל֙ מַֽעֲצָ֔ד וּ/פָעַל֙ בַּ/פֶּחָ֔ם וּ/בַ/מַּקָּב֖וֹת יִצְּרֵ֑/הוּ וַ/יִּפְעָלֵ֨/הוּ֙ בִּ/זְר֣וֹעַ כֹּח֔/וֹ גַּם רָעֵב֙ וְ/אֵ֣ין כֹּ֔חַ לֹא שָׁ֥תָה מַ֖יִם וַ/יִּיעָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
  footnotes:
  - marker: a
    text: Or 'an adze,' 'a graving tool,' or 'a chisel' for the specific implement named here.
    reason: lexical_alternative
translation:
  language: ko
  text: 철공이 절단 도구를 가지고, 숯불 위에서 일하며, 망치로 그것을 만들고 자기의 강한 팔로 그것을 다듬습니다. 그도 또한 배고프고[a], 힘이 없으며, 물도 마시지 않아 기진맥진합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡괭이 같은 끌’, ‘조각하는 칼’, 혹은 ‘정(chisel)’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  english_pob_choice: The ironsmith
  chosen_korean: 철공
  alternatives_korean:
  - 대장장이
  - 쇠를 다루는 사람
  - 철기공
  lexicon: HALOT
  rationale: 철을 다루는 장인을 가리키는 말로, 문맥상 우상 제작의 금속공을 자연스럽게 드러내는 ‘철공’이 가장 간결하고 정확합니다.
- source_word: מַעֲצָד
  english_pob_choice: a cutting tool
  chosen_korean: 절단 도구
  alternatives_korean:
  - 도끼
  - 끌
  - 조각칼
  lexicon: HALOT
  rationale: 구체적 기구는 확정하기 어려우므로, POB의 선택을 따라 기능을 드러내는 중립적 표현으로 옮겼습니다.
- source_word: בַּפֶּחָם
  english_pob_choice: over the coals
  chosen_korean: 숯불 위에서
  alternatives_korean:
  - 숯 위에서
  - 불 위에서
  - 화덕에서
  lexicon: HALOT
  rationale: 금속을 달구는 작업 환경을 한국어로 자연스럽게 살리면서, 석탄/숯의 의미를 보존했습니다.
- source_word: גַּם רָעֵב ... וַיִּיעָף
  english_pob_choice: He also becomes hungry ... and he grows faint
  chosen_korean: 그도 또한 배고프고[a]... 기진맥진합니다
  alternatives_korean:
  - 그도 또한 배고프고... 지쳐 갑니다
  - 그도 또한 배고프고... 기운이 빠집니다
  - 그도 또한 배고프고... 탈진합니다
  lexicon: HALOT
  rationale: 히브리어의 연속된 피로 누적을 살리기 위해 ‘배고프고’와 ‘기진맥진합니다’를 대응시켰고, POB의 각주를 한국어 본문에 연결했습니다.
theological_decisions:
- issue: 예언자적 풍자 속 우상 제작의 묘사
  chosen_reading: 본문은 해설을 덧붙이지 않고, 장인의 육체적 소모와 결핍을 구체적으로 묘사하는 방식으로 유지했습니다.
  alternative_readings:
  - 우상 숭배의 헛됨을 본문에 직접 강조하는 더 해석적인 번역
  - 풍자적 뉘앙스를 본문에 추가하는 번역
  rationale: 이 절 자체는 제작 과정과 장인의 쇠약을 묘사하므로, 신학적 비판은 문맥에 맡기고 본문은 원문이 말하는 바에 충실하게 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
