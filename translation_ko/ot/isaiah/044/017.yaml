id: ISA.44.17
reference: Isaiah 44:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאֵ֣רִית֔/וֹ לְ/אֵ֥ל עָשָׂ֖ה לְ/פִסְל֑/וֹ יסגוד ל֤/וֹ וְ/יִשְׁתַּ֨חוּ֙ וְ/יִתְפַּלֵּ֣ל אֵלָ֔י/ו וְ/יֹאמַר֙ הַצִּילֵ֔/נִי כִּ֥י אֵלִ֖/י אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
  footnotes:
  - marker: a
    text: Or, “his idol” for “his carved image.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew uses masculine pronouns for the idol; English renders the referent as “it” because the object is an image.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 남은 것으로 신상[a], 곧 그의 새긴 형상을 만들어, 그것에 엎드려 절하며 그것에게 기도하면서 ‘나를 건져 주십시오[b]. 당신은 나의 하나님이십니다’라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 우상”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 우상/형상을 가리키는 남성형 어법을 쓰지만, 한국어에서는 무생물에 대해 자연스럽게 ‘그것’으로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  english_pob_choice: And with the rest of it
  chosen_korean: 그 남은 것으로
  alternatives_korean:
  - 남은 그것으로
  - 그 나머지로
  lexicon: HALOT
  rationale: שְׁאֵרִית는 ‘남은 것/나머지’이며, 여기서는 앞선 재료의 잔여분을 가리키므로 도구격 표현으로 자연스럽게 옮겼습니다.
- source_word: לְאֵל
  english_pob_choice: a god
  chosen_korean: 신상
  alternatives_korean:
  - 하나님
  - 신
  lexicon: HALOT
  rationale: 문맥상 참 하나님이 아니라 사람이 만든 신적 대상으로, 한국어에서는 ‘하나님’보다 ‘신상’이 우상 제작의 결과를 더 직접적으로 드러냅니다.
- source_word: לְפִסְלוֹ
  english_pob_choice: his carved image
  chosen_korean: 그의 새긴 형상
  alternatives_korean:
  - 그의 조각한 형상
  - 그의 우상
  lexicon: HALOT
  rationale: פֶסֶל은 새겨 만든 형상이라는 구체성이 있으므로, 전통적 교회어 ‘우상’보다 ‘새긴 형상’이 원문의 물질적 이미지를 더 잘 보존합니다.
- source_word: וְיִשְׁתַּחוּ
  english_pob_choice: and worships
  chosen_korean: 엎드려 절하며
  alternatives_korean:
  - 경배하며
  - 절하며
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 절하는 동작이 기본이므로, 앞의 ‘엎드려 절하며’가 이어지는 ‘기도’와 구별되는 동작성을 살립니다.
theological_decisions:
- issue: 우상에 대한 지시 대상 표기
  chosen_reading: 우상을 가리키는 대명사는 한국어 자연스러움에 따라 ‘그것’을 사용했습니다.
  alternative_readings:
  - 히브리어의 남성형 توافق를 따라 ‘그를’로 옮김
  rationale: 히브리어는 문법상 남성형을 쓰지만, 한국어에서는 무생물 우상을 ‘그것’으로 부르는 것이 독자에게 우상의 비인격성을 분명히 전달합니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean) and source-language primacy
