  rationale: 원문의 원인-결과 구조를 간결하게 살리면서, 나무가 자연적으로 성장한다는 문맥을 분명히 했습니다.
theological_decisions:
- issue: 우상 제작을 풍자하는 문맥에서 나무 선택과 성장의 묘사
  chosen_reading: 목재를 베고, 골라 세우고, 심고, 비가 자라게 하는 평범한 과정으로 옮겨 우상 재료의 일상성과 허무함을 드러냈습니다.
  alternative_readings:
  - ‘가장 강한 나무를 고른다’로 더 직접적으로 해석하기
  - 히브리어 어순을 더 기계적으로 따라가기를 택하기
  rationale: 이 절은 교리 논쟁 본문이 아니라 풍자적 묘사입니다. 따라서 난해한 동사는 문맥의 핵심인 ‘보통 나무가 우상 재료가 된다’는 점이 드러나도록 처리했습니다.
  doctrine_reference: 이사야 44장 문맥의 우상 비판
