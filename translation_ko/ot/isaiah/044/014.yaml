- source_word: וַיְאַמֶּץ לּוֹ בַּעֲצֵי יָעַר
  english_pob_choice: and chooses it from among the trees of the forest
  chosen_korean: 숲의 나무들 가운데서 그것을 골라 세웁니다
  alternatives_korean:
  - 숲의 나무들 가운데서 그것을 강하게 합니다
  - 숲의 나무들 가운데서 그것을 굳게 합니다
  - 숲의 나무들 가운데서 그것을 자기 위해 단단하게 합니다
  lexicon: HALOT
  rationale: 히브리어는 압축적이고 난해하여 ‘강하게 하다/굳게 하다’와 ‘고르다’의 뉘앙스가 겹칩니다. 문맥상 우상 제작자가 숲의 나무들 가운데서 재목을 선별하는 뜻을 살려 ‘골라 세웁니다’로 옮겼습니다.
