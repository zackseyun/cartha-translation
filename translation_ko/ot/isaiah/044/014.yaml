base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
  footnotes:
  - marker: a
    text: Hebrew תִּרְזָה refers to a tree species with uncertain identification; possible renderings include cypress, holm oak, terebinth, or elm.
    reason: lexical_alternative
  - marker: b
    text: Or 'and strengthens it for himself among the trees of the forest'; the Hebrew clause is difficult and may describe either cultivating the tree or selecting a strong tree from the forest.
    reason: alternative_reading
  - marker: c
    text: Hebrew אֹרֶ refers to a tree species with uncertain identification; possible renderings include pine, fir, ash, or laurel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기를 위하여 백향목들을 베어 내거나, 편백나무[a]나 참나무를 가져다가 숲의 나무들 가운데서 그것이 튼튼하게 자라게 합니다[b]. 그는 소나무[c]를 심고, 비가 그것을 자라게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תִּרְזָה는 정확한 수종 식별이 불확실하며, 편백나무, 상록참나무, 피스타치오류, 느릅나무 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 절은 난해합니다. 직역하면 ‘숲의 나무들 가운데서 그것을 자기를 위하여 강하게 한다’이며, ‘숲의 나무들 가운데서 그것을 고른다’ 또는 ‘강한 나무를 선택한다’는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 אֹרֶ는 정확한 수종 식별이 불확실하며, 소나무, 전나무, 물푸레나무, 월계수나무 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
