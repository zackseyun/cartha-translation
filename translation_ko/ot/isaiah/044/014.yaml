  source_fidelity: ‘골라 세웁니다’는 원문의 난해한 동사에 없는 ‘세우다’의 의미를 첨가하며, 선택한다는 해석도 불필요하게 확정합니다. 또한 ‘자기 위해’는 현대 표준어 문장으로 부자연스럽습니다. 수종의 정확한 식별이 불확실하다는 점은 본문 각주로 유지해야 합니다.
  naturalness: ‘자기를 위하여’가 자연스럽고 격식 있는 합쇼체에 맞습니다. ‘숲의 나무들 가운데서 그것을 강하게 합니다’는 원문의 직역적 난점을 보존하지만, 한국어에서는 ‘튼튼하게 자라게 합니다’가 문맥상 자연스럽습니다. 단, 이것이 유일한 해석은 아니므로 각주를 둡니다.
  terminology: אֶרֶז는 ‘백향목’, אַלּוֹן은 특정 ‘상수리나무’보다 포괄적인 ‘참나무’가 적절합니다. תִּרְזָה와 אֹרֶ는 식별 불확실성을 각각 각주로 명시합니다. אֹרֶ의 영어 선택어 pine에는 한국어 일반명 ‘소나무’를 사용합니다.
