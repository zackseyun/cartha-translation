id: ISA.44.15
reference: Isaiah 44:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אָדָם֙ לְ/בָעֵ֔ר וַ/יִּקַּ֤ח מֵ/הֶם֙ וַ/יָּ֔חָם אַף יַשִּׂ֖יק וְ/אָ֣פָה לָ֑חֶם אַף יִפְעַל אֵל֙ וַ/יִּשְׁתָּ֔חוּ עָשָׂ֥/הוּ פֶ֖סֶל וַ/יִּסְגָּד לָֽ/מוֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
  footnotes:
  - marker: a
    text: Or 'and bows down to it.' The Hebrew has a plural pronominal form ('to them/before them') where English might expect a singular, likely reflecting poetic usage or reference to the material/pieces collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 사람이 태울 땔감이 되고, 그는 그 가운데 일부를 가져다가 몸을 덥힙니다. 또 불을 피워 빵을 굽습니다. 또 신을 만들어 그것에 절하고, 그것을 새긴 형상으로 만들어 그것들 앞에 엎드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לָמוֹ는 “그들/그것들에게, 그들/그것들 앞에”라는 복수 대명사 접미형입니다. 바로 앞의 “새긴 형상”은 단수이므로, 이 복수형은 시적 용법이거나 재료 또는 여러 부분을 함께 가리킬 수 있습니다. 또는 “그 앞에 엎드립니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  english_pob_choice: for a man
  chosen_korean: 사람에게
  alternatives_korean:
  - 한 남자에게
  - 인간에게
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 대표적 단수 일반용법을 살리면서도 한국어에서는 '사람에게'가 가장 자연스럽고 성별 오해를 줄입니다.
- source_word: לְבָעֵר
  english_pob_choice: fuel
  chosen_korean: 땔감이 되고
  alternatives_korean:
  - 불태우는 데 쓰이고
  - 연료가 되고
  lexicon: HALOT
  rationale: 문맥상 나무가 태워지는 용도이므로 기능을 드러내는 '땔감'이 가장 직접적입니다.
- source_word: אַף יִפְעַל אֵל
  english_pob_choice: He also makes a god
  chosen_korean: 또 신을 만들고
  alternatives_korean:
  - 또 하나님을 만들고
  - 또 우상을 만들고
  lexicon: HALOT
  rationale: 본문의 아이러니를 따라 אֵל을 곧바로 '우상'으로 평준화하지 않고, '신'으로 옮겨 뒤의 '새긴 우상'과 긴장을 유지합니다.
- source_word: וַיִּסְגָּד לָמוֹ
  english_pob_choice: and prostrates himself before them
  chosen_korean: 그 앞에 엎드립니다
  alternatives_korean:
  - 그들 앞에 엎드립니다
  - 그것들 앞에 엎드립니다
  lexicon: HALOT
  rationale: 히브리어의 복수 목적형 לָמוֹ는 본문상 단수 우상과 긴장을 이루지만, 한국어에서는 자연스러운 단수 지시로 번역하고 그 앞에 드러나는 절의 행위를 살립니다.
- source_word: פֶסֶל
  english_pob_choice: a carved image
  chosen_korean: 새긴 우상
  alternatives_korean:
  - 새긴 형상
  - 조각한 우상
  lexicon: HALOT
  rationale: פֶסֶל의 제작성을 살리면서도 한국어 성경에서 익숙한 '우상'을 붙여 조롱적 문맥을 분명히 합니다.
theological_decisions:
- issue: אֵל을 '신'으로 유지할지 '우상'으로 평준화할지
  chosen_reading: '''신을 만들고'' 다음에 ''새긴 우상''을 병기하여, 사람이 만든 대상을 신으로 여기면서도 실제로는 조각된 물체라는 예언자적 풍자를 살렸습니다.'
  alternative_readings:
  - '''우상을 만들고''로 통일'
  - '''하나님''으로 옮김'
  rationale: 본문은 같은 대상에 대해 신격화와 물질성을 병치합니다. 두 표현을 모두 살려야 이사야의 조롱이 약화되지 않습니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
- issue: 복수형 목적어 לָמוֹ의 처리
  chosen_reading: 본문의 복수 형태는 한국어에서 '그 앞에'로 자연화하되, 대상을 단수 우상으로 읽는 유려한 문장을 택했습니다.
  alternative_readings:
  - '''그들 앞에''로 직역'
  - '''그것들 앞에''로 직역'
  rationale: 히브리어 형태를 과도하게 노출하면 한국어 문장이 부자연스러워집니다. 본문의 조롱적 효과는 단수 우상과 절하는 행위만으로 충분히 드러납니다.
  doctrine_reference: 번역 원칙 §2, §4
