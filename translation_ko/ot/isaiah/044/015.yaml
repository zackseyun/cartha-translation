  source_fidelity: 히브리어 לָמוֹ는 전치사 לְ에 결합한 복수 대명사 접미형입니다. 초안은 이를 단수 '그 앞에'로 평준화하여 본문의 형태상 긴장을 본문에서 지웠습니다. 또한 각주의 '복수 목적형'이라는 문법 설명은 정확하지 않습니다. 복수형을 본문과 각주에서 보존하는 편이 원문 충실성에 더 부합합니다.
  naturalness: '''그것들 가운데서 얼마를''보다 ''그 가운데 일부를''이 현대 표준어에서 더 자연스럽습니다. ''불을 피워''는 여기서 불을 일으키는 행위를 분명히 하며, 문맥에도 잘 맞습니다. 복수형을 반영한 ''그것들 앞에''는 다소 낯설지만, 각주로 설명할 수 있는 원문의 의도적·시적 긴장을 보존합니다.'
  terminology: '''땔감'', ''신'', ''새긴 형상''은 각각 לְבָעֵר, אֵל, פֶסֶל의 의미와 본문의 풍자를 적절히 드러냅니다. 특히 אֵל은 ''신''으로, פֶסֶל은 ''새긴 형상''으로 구별하여 제조된 대상을 신으로 섬기는 역설을 유지합니다.'
  issues:
  - severity: medium
    issue: לָמוֹ의 복수형을 본문에서 단수로 평준화함
