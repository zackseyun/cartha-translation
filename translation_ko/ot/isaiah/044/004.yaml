  - 풀들 사이에서
  lexicon: HALOT
  rationale: ‘between’의 공간감을 한국어 관용에 맞게 ‘사이에서’로 옮겨, 낮은 초목 한가운데서 솟는 장면을 유지했습니다.
- source_word: כַּ/עֲרָבִ֖ים
  english_pob_choice: like willows
  chosen_korean: 버드나무처럼
