  lexicon: HALOT
  rationale: צמח의 식물 이미지와 미래형을 살리되, 한국어에서 자연스러운 새싹·새순의 발생감을 주는 표현으로 옮겼습니다.
- source_word: בְּ/בֵ֣ין חָצִ֑יר
