  text: And they will spring up among the grass like willows by streams of water[a].
  footnotes:
  - marker: a
    text: Or 'like poplars by watercourses.' The Hebrew עֲרָבִים is commonly rendered 'willows,' though some take it more broadly as a poplar-like waterside tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 풀 사이에서, 물 흐르는 곳가의 버드나무처럼 돋아날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포플러처럼.’ 히브리어 עֲרָבִים은 보통 ‘버드나무’로 옮기지만, 물가에 자라는 포플러류 나무를 가리킨다고 보는 해석도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  english_pob_choice: And they will spring up
  chosen_korean: 돋아날 것입니다
  alternatives_korean:
