  lexicon: HALOT
  rationale: POB의 기본 선택인 ‘willows’를 따르되, 한국어에서 가장 자연스럽고 익숙한 식물명인 ‘버드나무’로 구체화했습니다.
- source_word: יִבְלֵי מָיִם
  english_pob_choice: streams of water
  chosen_korean: 물 흐르는 곳
  alternatives_korean:
  - 물길
  - 물줄기
  - 물 흐르는 개울
  lexicon: HALOT
  rationale: 물이 흐르는 통로·수로의 이미지를 살리면서도, 한국어에서 지나치게 기술적인 ‘수로’보다 시적이고 자연스러운 표현으로 옮겼습니다.
