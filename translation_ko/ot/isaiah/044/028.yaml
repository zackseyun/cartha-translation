id: ISA.44.28
reference: Isaiah 44:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֹמֵ֤ר לְ/כ֨וֹרֶשׁ֙ רֹעִ֔/י וְ/כָל חֶפְצִ֖/י יַשְׁלִ֑ם וְ/לֵ/אמֹ֤ר לִ/ירוּשָׁלִַ֨ם֙ תִּבָּנֶ֔ה וְ/הֵיכָ֖ל תִּוָּסֵֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: ko
  text: 고레스에 대해 「그는 내 목자이며, 내 모든 뜻을 이루게 할 것이다」라고 말씀하시는 분이시며, 예루살렘에 대해 「그녀는 다시 세워질 것이다」, 성전에 대해 「그 기초가 놓일 것이다」라고 말씀하십니다.
  philosophy: formal
lexical_decisions:
- source_word: רֹעִי
  english_pob_choice: my shepherd
  chosen_korean: 내 목자
  alternatives_korean:
  - 내 목자이신 분
  - 나의 목자
  lexicon: רֹעֶה
  rationale: 직역에 가깝게 ‘목자’를 유지해 고레스가 하나님의 도구로서 맡겨진 역할을 드러냈습니다.
- source_word: וְכָל חֶפְצִי יַשְׁלִם
  english_pob_choice: he will fulfill all my purpose
  chosen_korean: 내 모든 뜻을 이루게 할 것이다
  alternatives_korean:
  - 내 모든 목적을 성취할 것이다
  - 내 모든 계획을 완성할 것이다
  lexicon: חֵפֶץ
  rationale: חֶפֶץ는 단순한 바람보다 ‘뜻/목적’의 뉘앙스가 있어, 하나님의 주권적 의도를 살리는 표현을 택했습니다.
- source_word: תִּבָּנֶה
  english_pob_choice: She will be rebuilt
  chosen_korean: 그녀는 다시 세워질 것이다
  alternatives_korean:
  - 그녀는 재건될 것이다
  - 그것은 다시 지어질 것이다
  lexicon: בנה
  rationale: 예루살렘을 여성형으로 의인화한 원문을 반영해 ‘그녀’를 살렸고, 건축 행위는 자연스러운 한국어로 풀어 옮겼습니다.
- source_word: תִּוָּסֵד
  english_pob_choice: Its foundation will be laid
  chosen_korean: 그 기초가 놓일 것이다
  alternatives_korean:
  - 그 터가 놓일 것이다
  - 그 기초가 세워질 것이다
  lexicon: יסד
  rationale: 성전의 재건에서 ‘기초’라는 구체적 이미지가 핵심이므로, ‘놓일 것이다’로 수동형 의미를 유지했습니다.
theological_decisions:
- issue: 고레스에 대한 신적 칭호를 어떻게 옮길지
  chosen_reading: ‘내 목자’로 직접 옮겨, 고레스가 하나님의 뜻을 수행하는 대리자임을 드러냈습니다.
  alternative_readings:
  - ‘내 종’
  - ‘내 도구’
  rationale: 원문은 고레스를 하나님의 주권 아래 놓인 실질적 수행자로 묘사하므로, 본문이 주는 긴장과 위임의 의미를 약화하지 않기 위해 ‘목자’를 유지했습니다.
  doctrine_reference: 섭리와 하나님의 주권
- issue: 예루살렘과 성전을 여성형/중성적으로 처리할지
  chosen_reading: 예루살렘은 ‘그녀’, 성전은 ‘그 기초’로 구분해 원문의 인칭화와 사물화를 각각 살렸습니다.
  alternative_readings:
  - 둘 다 ‘그것’으로 처리
  - 둘 다 명시적 인칭 없이 처리
  rationale: 히브리어 동사의 형태와 대상의 성격이 다르므로, 문법적·수사적 차이를 한국어에서도 반영했습니다.
  doctrine_reference: 본문의 수사와 문법 존중
