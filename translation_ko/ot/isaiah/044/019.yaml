  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
  footnotes:
  - marker: a
    text: Or 'a piece of wood' or 'a log'; the Hebrew phrase is contemptuous, stressing that the idol is nothing more than wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이것을 마음에 새기지 않으며, 말할 지식도 깨달음도 없습니다. “내가 그것의 반을 불에 태우고, 그 숯불 위에서 빵을 굽고 고기를 구워 먹었는데, 그 나머지로 가증한 것을 만들겠습니까? 나무토막에 절하겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
