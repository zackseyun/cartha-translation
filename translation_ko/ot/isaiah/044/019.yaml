  language: ko
  text: 그가 그것을 마음에 두지 아니하며, 지식도 통찰도 없어 말하기를, '내가 그 반을 불에 태우고 그 숯불 위에 떡을 구워 고기를 구워 먹었거늘, 그 나머지를 어찌하여 가증한 것이 되게 하겠느냐? 내가 그 나무 조각을 경배하겠느냐?'[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나무 조각' 또는 '통'; 히브리어 구절은 조롱의 어조로, 우상은 나무에 지나지 않음을 강조합니다.
