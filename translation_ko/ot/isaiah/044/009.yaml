  to: 우상을 만드는 자들은 모두 헛것입니다[a]. 그들이 좋아하는 것들은[b] 아무 유익도 주지 못합니다. 그들의 증인들은 보지도 못하고 알지도 못하니[c], 그들이 수치를 당할 것입니다[d].
