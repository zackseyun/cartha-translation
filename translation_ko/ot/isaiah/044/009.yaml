id: ISA.44.9
reference: Isaiah 44:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
  footnotes:
  - marker: a
    text: Or 'All idol-makers are emptiness' or 'All who form a carved image are vanity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their precious things' or 'their desirable things.'
    reason: lexical_alternative
  - marker: c
    text: '''Their witnesses'' may refer to the worshipers who testify for the idols, or ironically to the idols themselves.'
    reason: alternative_reading
  - marker: d
    text: Or 'that they may be ashamed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우상을 만드는 자들은 모두 헛것입니다[a]. 그들이 좋아하는 것들은[b] 아무 유익도 주지 못합니다. 그들의 증인들은 보지도 못하고 알지도 못하니[c], 그들이 수치를 당할 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상을 만드는 자들은 모두 헛됨이다’ 또는 ‘새긴 형상을 만드는 자들은 모두 허무이다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 귀한 것들’ 또는 ‘그들이 바라는 것들’.
    reason: lexical_alternative
  - marker: c
    text: ‘그들의 증인들’은 우상을 위해 증언하는 숭배자들을 가리킬 수도 있고, 반어적으로 우상 자체를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘그들이 부끄러워하게 될 것입니다’ 또는 ‘그들이 수치를 당하도록’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  english_pob_choice: who fashion an idol
  chosen_korean: 우상을 만드는 자들
  alternatives_korean:
  - 우상을 빚는 자들
  - 새긴 형상을 만드는 자들
  lexicon: HALOT
  rationale: יֹצְרֵי는 ‘만들다/빚다’의 분사형이고 פֶסֶל은 우상/새긴 형상을 가리키므로, 한국어에서는 자연스럽게 ‘우상을 만드는 자들’로 옮기되 공세적 뉘앙스를 유지했습니다.
- source_word: תֹּהוּ
  english_pob_choice: nothing
  chosen_korean: 헛것
  alternatives_korean:
  - 무(無)
  - 허무
  - 빈 것
  lexicon: HALOT
  rationale: 여기서 תֹּהוּ는 형이상학적 ‘무’보다 우상 제작의 무가치함을 말하므로, 문맥상 힘이 살아 있는 ‘헛것’이 적절합니다.
- source_word: וַחֲמוּדֵיהֶם
  english_pob_choice: the things they delight in
  chosen_korean: 그들이 좋아하는 것들
  alternatives_korean:
  - 그들이 소중히 여기는 것들
  - 그들의 귀한 것들
  - 그들이 탐하는 것들
  lexicon: HALOT
  rationale: חמד 계열은 ‘바라다/좋아하다/탐내다’의 정서를 담으므로, 우상 자체를 너무 구체화하지 않으면서도 애착의 의미를 드러내는 표현을 택했습니다.
- source_word: וְעֵדֵיהֶם הֵמָּה בַּל יִרְאוּ וּבַל יֵדְעוּ
  english_pob_choice: Their witnesses neither see nor know
  chosen_korean: 그들의 증인들은 보지도 못하고 알지도 못하니
  alternatives_korean:
  - 그들의 증인들은 보지 못하고 알지 못하니
  - 그들을 증언하는 자들은 보지도 못하고 알지도 못하니
  lexicon: HALOT
  rationale: עֵדֵיהֶם은 ‘그들의 증인들’로 직역하면 원문의 수사적 모호성을 살릴 수 있으며, 이어지는 이중 부정은 한국어의 ‘보지도 못하고 알지도 못하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: עֵדֵיהֶם(‘their witnesses’)의 지시 대상
  chosen_reading: 우상 편에 서서 그것을 증언하는 사람들로 읽되, 원문의 아이러니를 보존하기 위해 명시적으로 한정하지 않았습니다.
  alternative_readings:
  - 우상 자체를 비꼬아 ‘증인’이라 부르는 읽기
  - 우상을 변호하는 우상숭배자들을 가리키는 읽기
  rationale: 문맥상 둘 다 가능하므로, 한국어 본문에서는 ‘그들의 증인들’로 남겨 독자가 수사적 긴장을 그대로 느끼게 했습니다.
  doctrine_reference: 사 44:9 문맥의 우상 비판
- issue: לְמַעַן יֵבֹשׁוּ의 뉘앙스
  chosen_reading: 결과를 나타내는 ‘수치를 당하게 하려는 것’으로 옮겼습니다.
  alternative_readings:
  - ‘그들이 부끄러움을 당하도록’
  - ‘그들이 수치를 느끼게 하려는 것’
  rationale: 예언적 조롱의 결론을 드러내면서도, 히브리어의 결과/목적 겸용 가능성을 과도하게 좁히지 않기 위해 결과 중심 표현을 선택했습니다.
  doctrine_reference: 히브리어 לְמַעַן의 목적/결과 용법
