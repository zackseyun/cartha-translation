  source_fidelity: 본문의 우상 제작자, 그들이 귀하게 여기는 것들, ‘그들의 증인들’의 모호성, 그리고 보지 못하고 알지 못한다는 진술은 대체로 원문에 충실합니다. 그러나 마지막 ‘그들이 수치를 당하게 하려는 것입니다’는 לְמַעַן יֵבֹשׁוּ를 앞 절 전체의 의도에 관한 명사절처럼 만들어, 원문의 목적/결과적 결말을 부자연스럽고 다소 다르게 표현합니다.
  naturalness: ‘그들이 수치를 당할 것입니다’가 현대 표준 한국어 합쇼체에서 자연스럽고, 히브리어 미완료형의 장래적 결과와 בוש의 수치/부끄러움 의미를 잘 전달합니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 것이 독해에 적절합니다.
  terminology: ‘우상’, ‘증인들’, ‘수치’는 적절합니다. ‘그들이 좋아하는 것들’은 חֲמוּדֵיהֶם의 애착/귀중함을 보존하며, 우상으로 단정하지 않아 좋습니다. 대안 각주는 실제로 서로 다른 번역 가능성을 제시하도록 바로잡았습니다.
