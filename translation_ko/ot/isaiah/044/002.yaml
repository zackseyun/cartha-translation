  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
  footnotes:
  - marker: a
    text: Jeshurun is a poetic name for Israel, likely carrying the sense 'upright one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 너를 만드신 분, 모태에서 너를 빚으시고 너를 도우시는 분이시니, 두려워하지 마라, 내 종 야곱아, 내가 택한 여슈룬아.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여슈룬은 이스라엘을 가리키는 시적 이름으로, 대체로 ‘곧바른 이’라는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신명은 학술 음역인 ‘야훼’로 옮겨, 언약적 호칭을 유지했습니다.
- source_word: עֹשֶׂךָ וְיֹצֶרְךָ
  english_pob_choice: your Maker and the one who formed you
  chosen_korean: 너를 만드신 분, 모태에서 너를 빚으시고
  alternatives_korean:
  - 너의 창조자, 너를 형성하신 분
  - 너를 지으신 분, 너를 만드신 분
  lexicon: HALOT
  rationale: עֹשֶׂךָ의 ‘만드신’과 יֹצֶרְךָ의 ‘빚으시고’를 구분해, 단순 창조보다 의도적으로 빚으시는 뉘앙스를 살렸습니다.
- source_word: מִבֶּטֶן
  english_pob_choice: from the womb
  chosen_korean: 모태에서
  alternatives_korean:
  - 태에서
  - 복중에서
  lexicon: HALOT
  rationale: ‘모태’는 한국어 성경에서 태중 기원을 자연스럽게 드러내며, 출생 이전부터의 선택과 돌보심을 보존합니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종된 자
  - 내 하인
  lexicon: HALOT
  rationale: 언약적 호칭이지만 עבד의 기본 의미를 흐리지 않도록 ‘종’을 유지했습니다. 여기서는 POB의 ‘servant’에 맞춰 봉사 직분보다 소속성을 드러냅니다.
- source_word: וִישֻׁרוּן
  english_pob_choice: Jeshurun
  chosen_korean: 여슈룬
  alternatives_korean:
  - 예슈룬
  - 의로운 자
  lexicon: HALOT
  rationale: 고유명사는 음역하고, 본문이 요구하는 별칭의 시적 성격은 본문 자체에서 보존했습니다.
theological_decisions:
- issue: 히브리어 단수형 호칭이 집단 이스라엘을 대표하는 방식
  chosen_reading: ‘너를’의 단수형을 그대로 살리되, ‘내 종 야곱아, 내가 택한 여슈룬아’라는 병치를 유지했습니다.
  alternative_readings:
  - ‘너희를’로 복수화
  - ‘이스라엘아’로 일반화
  rationale: 히브리어는 집단을 대표하는 단수 주소를 사용하므로, 이를 복수화하면 예언적 수사와 언약적 인격화가 약해집니다.
  doctrine_reference: Translation philosophy §5
- issue: 여슈룬의 처리
  chosen_reading: 본문에는 음역 ‘여슈룬’을 두고, 선택받은 이스라엘의 시적 별칭이라는 의미는 주석 없이 본문에서 과도하게 풀지 않았습니다.
  alternative_readings:
  - ‘곧바른 이’로 번역
  - ‘의로운 이’로 번역
  rationale: 이 명칭은 이름/별칭으로 기능하므로, 번역보다 음역이 문맥상 더 적절합니다.
  doctrine_reference: Translation philosophy §2
