id: ISA.60.11
reference: Isaiah 60:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
  footnotes:
  - marker: a
    text: Or 'the riches of the nations'; Hebrew חֵיל can also mean 'strength' or 'army,' but here likely refers to material wealth brought as tribute.
    reason: lexical_alternative
  - marker: b
    text: Or 'with their kings being led' or 'their kings led along.' The Hebrew participle can suggest escort, procession, or subjugated leading.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 성문들은 늘 열려 있을 것이며, 낮에도 밤에도 닫히지 않을 것입니다. 이는 나라들의 재물[a]과 이끌려 오는 그들의 왕들[b]을 네게로 들여오기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵיל은 ‘재물’ 외에 ‘힘’이나 ‘군세’를 뜻할 수도 있습니다. 여기서는 열방이 시온으로 가져오는 부와 공물의 문맥에 따라 ‘재물’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이끌리는/인도되는’이라는 수동 표현입니다. 의례적으로 호송되는 것인지, 복속을 나타내는 것인지는 단정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  english_pob_choice: Your gates will be open continually
  chosen_korean: 네 성문들은 항상 열려 있을 것입니다
  alternatives_korean:
  - 네 성문들은 계속 열려 있을 것입니다
  - 네 성문들은 영원히 열려 있을 것입니다
  lexicon: WLC/HALOT
  rationale: פּתחוּ의 상태적 용법을 한국어에서는 ‘열려 있다’로 자연스럽게 살리고, תָּמִיד은 ‘항상’으로 옮겨 끊임없는 지속성을 분명히 했습니다.
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  english_pob_choice: day and night they will not be shut
  chosen_korean: 낮에도 밤에도 닫히지 않아서
  alternatives_korean:
  - 낮과 밤에 닫히지 않아서
  - 낮과 밤으로 닫히지 않아서
  lexicon: WLC/HALOT
  rationale: יוֹמָם וָלַיְלָה는 끊임없는 시간을 나타내는 관용구이므로 ‘낮에도 밤에도’로 옮겼고, נִסְגַּרוּ는 문맥상 문이 ‘닫히다’로 가장 직접적입니다.
- source_word: חֵיל גּוֹיִם
  english_pob_choice: the wealth of the nations
  chosen_korean: 나라들의 재물
  alternatives_korean:
  - 민족들의 재물
  - 나라들의 부
  - 나라들의 군세
  lexicon: HALOT
  rationale: 이 문맥은 예루살렘으로 들어오는 공물과 부의 이미지를 보여 주므로 חֵיל을 ‘재물’로 옮겨 경제적 의미를 살렸습니다. '군세'는 어휘상 가능하지만 여기서는 문맥상 덜 적합합니다.
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  english_pob_choice: with their kings led in procession
  chosen_korean: 그들의 왕들도 행렬을 이루어 이끌려 올 것입니다
  alternatives_korean:
  - 그들의 왕들도 이끌려 올 것입니다
  - 그들의 왕들도 행렬 속에 인도될 것입니다
  - 그들의 왕들도 끌려올 것입니다
  lexicon: HALOT
  rationale: נְהוּגִים의 수동적 ‘이끌림’을 살리면서, 왕들이 단순히 동반되는 수준을 넘어 공식적·의례적 이동의 뉘앙스를 반영하기 위해 ‘행렬을 이루어 이끌려 올 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 열린 성문과 왕의 ‘이끌림’이 지니는 복속/예우의 긴장
  chosen_reading: 예루살렘에 대한 열방의 공물이 들어오고, 왕들도 그 질서 아래 예우 또는 굴복의 형태로 따라오는 그림으로 유지합니다
  alternative_readings:
  - 완전한 자발적 예우만 강조하는 읽기
  - 포로처럼 강제적으로 끌려오는 읽기
  rationale: 본문은 물질적 공물과 왕들의 수동적 이동을 함께 말하므로, 지나치게 부드럽게도, 지나치게 군사적으로도 만들지 않고 원문의 긴장을 그대로 살리는 쪽이 적절합니다.
  doctrine_reference: Isaiah 60 전체의 시온-열방-왕들 모티프
- issue: 기존 교회 용어 대신 직접적인 문학적 이미지 사용
  chosen_reading: 성문, 재물, 행렬, 이끌려 오다를 그대로 살려 왕적·도시적 이미지를 보존합니다
  alternative_readings:
  - 성문을 상징화하여 완화하는 표현
  - 왕들을 단순한 방문객으로 만드는 표현
  rationale: 이 절은 회복된 시온의 영광을 구체적 이미지로 그리므로, 한국어에서도 상징을 지나치게 추상화하지 않고 원문의 시각적 힘을 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문의 시온 회복과 열방 순례 이미지
