  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
  footnotes:
  - marker: a
    text: Or 'will no longer set.' The Hebrew literally says 'will no longer come,' an idiom here for the sun's going down.
    reason: lexical_alternative
  - marker: b
    text: Or 'your moon will not be gathered in,' that is, withdrawn or removed from shining.
    reason: lexical_alternative
