    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 달은 다시는 거두어지지 않을 것이다.’ 즉, 달빛이 거두어져 더 이상 비추지 않게 되는 것을 뜻합니다.
    reason: lexical_alternative
