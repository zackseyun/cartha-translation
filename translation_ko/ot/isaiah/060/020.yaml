  text: 네 해는 다시는 지지 않을 것이며[a], 네 달은 다시는 거두어지지 않을 것입니다.[b] 여호와께서 네게 영원한 빛이 되실 것이고, 네 슬픔의 날들은 끝날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
