  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
  footnotes:
  - marker: a
    text: Or 'at the side'; the Hebrew phrase may denote being carried at one's side, commonly understood as on the hip.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be nursed' or 'will be supported'; the verb can carry a nuance of being cared for, though 'will be carried' best fits the immediate image.
    reason: lexical_alternative
translation:
  language: ko
  text: 사방으로 눈을 들어 보십시오. 모두가 모여 옵니다. 먼 곳에서 당신의 아들들이 오고, 당신의 딸들은 옆에 업혀 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַל צַד는 ‘옆에/곁에’라는 뜻도 가능하지만, 문맥상 아이를 업고 옮기는 구체적 장면을 가리키는 것으로 보는 해석이 일반적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי ... עֵינַיִךְ
  english_pob_choice: Lift up your eyes
  chosen_korean: 사방으로 눈을 들어 보십시오
  alternatives_korean:
  - 눈을 드십시오
  - 눈을 들어 보십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형으로 시온에게 직접 말하는 표현이므로, 한국어에서는 자연스러운 명령형 ‘눈을 들어 보십시오’로 옮기고, 뒤의 סָבִיב을 자연스럽게 살려 ‘사방으로’를 앞에 두었습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레로
  - 주변으로
  lexicon: HALOT
  rationale: 단순한 위치 표시가 아니라 둘러보라는 분포적 의미이므로, 현대 한국어에서 가장 자연스러운 ‘사방으로’를 선택했습니다.
- source_word: נִקְבְּצוּ בָאוּ לָךְ
  english_pob_choice: all of them gather together; they come to you
  chosen_korean: 모두가 모여 옵니다
  alternatives_korean:
  - 모두가 모입니다
  - 모두가 모여 옵니다
  lexicon: HALOT
  rationale: 예언적 현재감이 있는 완료형들을 한국어에서는 현재 진행·도착의 생생한 표현으로 묶어 번역했습니다.
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  english_pob_choice: Your sons will come from far away
  chosen_korean: 먼 곳에서 당신의 아들들이 오고
  alternatives_korean:
  - 먼 곳에서 당신의 아들들이 올 것이고
  - 먼 곳에서 당신의 아들들이 오고
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘아들들’이라고 말하므로 성별을 중화하지 않았고, 예언적 약속의 흐름에 맞게 자연스러운 연결형으로 처리했습니다.
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  english_pob_choice: and your daughters will be carried on the hip
  chosen_korean: 당신의 딸들은 옆에 업혀 옵니다
  alternatives_korean:
  - 당신의 딸들은 엉덩이에 업혀 옵니다
  - 당신의 딸들은 옆구리에 업혀 옵니다
  lexicon: HALOT
  rationale: עַל צַד의 물리적 이미지를 한국어 관용에 맞춰 ‘옆에 업혀’로 옮겼습니다. 동사는 단순 보조가 아니라 돌봄과 운반의 장면을 살리기 위해 ‘업혀 옵니다’로 풀었습니다.
theological_decisions:
- issue: 성별이 분명한 회복 예언의 보존
  chosen_reading: ‘아들들’과 ‘딸들’을 그대로 유지했습니다.
  alternative_readings:
  - 자녀들
  rationale: 히브리어가 남녀 병렬을 통해 시온의 자손 전체가 돌아오는 장면을 강조하므로, 이를 중화하지 않고 원문의 대조를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 예언적 시제의 처리
  chosen_reading: 앞부분은 현재감 있는 표현으로, 뒷부분은 약속의 진행형처럼 옮겼습니다.
  alternative_readings:
  - 모두 미래형으로 통일
  - 모두 과거형으로 통일
  rationale: 히브리어 완료형과 미완료형의 효과를 한국어에서 기계적으로 하나의 시제로 평탄화하지 않고, 장면의 즉시성과 약속의 지향성을 함께 드러내기 위한 선택입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
