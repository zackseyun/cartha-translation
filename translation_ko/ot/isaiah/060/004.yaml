    rationale: 원문의 구는 아이를 몸의 옆, 곧 엉덩이/옆구리 쪽에 안고 운반하는 모습을 뜻할 수 있습니다. ‘업다’는 보통 등에 지는 것을 뜻하므로 ‘안겨’가 더 적절합니다.
  - severity: low
    issue: 첫 절에서 ‘보다’의 명령이 ‘눈을 들다’와 명시적으로 구별되지 않습니다.
    rationale: ‘눈을 들어 사방을 보십시오’는 שְׂאִי와 וּרְאִי를 모두 간결하고 자연스럽게 반영합니다.
