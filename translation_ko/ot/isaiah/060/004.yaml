revisions:
- from: 사방으로 눈을 들어 보십시오. 모두가 모여 옵니다. 먼 곳에서 당신의 아들들이 오고, 당신의 딸들은 옆에 업혀 옵니다.[a]
  to: 눈을 들어 사방을 보십시오. 그들이 모두 모여 당신에게 옵니다. 당신의 아들들은 먼 곳에서 올 것이며, 당신의 딸들은 옆구리에 안겨 올 것입니다.[a]
  rationale: 두 개의 앞선 동사(‘모이다’와 ‘당신에게 오다’)를 분리하여 보존하고, 아들들과 딸들의 귀환을 히브리어 미완료형의 약속적 미래로 일관되게 옮겼습니다. 마지막 구는 한국어에서 ‘업다’가 불러오는 등에 지는 이미지를 피하면서도 עַל צַד의 구체적인 옆/엉덩이 쪽 운반 이미지를 유지하도록 수정했습니다.
