  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 전체적인 귀환의 장면과 아들·딸의 병렬을 보존하지만, וּרְאִי의 별도 명령과 נִקְבְּצוּ / בָאוּ לָךְ의 두 동작이 충분히 드러나지 않습니다. 또한 עַל צַד의 ‘옆/엉덩이 쪽에 안고 가는’ 이미지를 ‘옆에 업혀’로 옮긴 것은 한국어의 일반적 ‘등에 업힘’ 이미지와 충돌합니다.
  naturalness: ‘옆에 업혀 옵니다’는 현대 표준어에서 다소 어색하며, ‘업다’는 대체로 등에 지는 행위를 가리킵니다. ‘옆구리에 안겨 올 것입니다’가 원문의 옆/엉덩이 쪽에 품어 운반하는 모습을 더 자연스럽게 전달합니다.
  terminology: ‘아들들’과 ‘딸들’의 성별 병렬은 유지하는 것이 적절합니다. 시온을 향한 여성 단수 명령은 한국어 합쇼체 명령 ‘보십시오’로 자연스럽게 처리할 수 있습니다. 본문은 ‘당신’을 유지하여 원문의 2인칭 소유를 분명히 했습니다.
  issues:
  - severity: medium
    issue: ‘모두가 모여 옵니다’가 ‘모이다’와 ‘당신에게 오다’라는 두 서술을 한 표현으로 융합합니다.
    rationale: נִקְבְּצוּ와 בָאוּ לָךְ는 연속된 두 동사이며, לָךְ의 목적지인 ‘당신에게’를 명시하는 편이 원문에 더 충실합니다.
