language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֣חַת הַ/נְּחֹ֜שֶׁת אָבִ֣יא זָהָ֗ב וְ/תַ֤חַת הַ/בַּרְזֶל֙ אָ֣בִיא כֶ֔סֶף וְ/תַ֤חַת הָֽ/עֵצִים֙ נְחֹ֔שֶׁת וְ/תַ֥חַת הָ/אֲבָנִ֖ים בַּרְזֶ֑ל וְ/שַׂמְתִּ֤י פְקֻדָּתֵ/ךְ֙ שָׁל֔וֹם וְ/נֹגְשַׂ֖יִ/ךְ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
  footnotes:
  - marker: a
    text: Or 'your administration' / 'your officers' for 'your overseers.' The Hebrew term can refer to oversight, office, or officials.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness.' The Hebrew צְדָקָה can denote either moral righteousness or justice in public order.
    reason: lexical_alternative
  - marker: c
    text: Or 'your rulers' / 'your oppressors' for 'your taskmasters.' The Hebrew term often refers to those who exact labor or tribute.
    reason: lexical_alternative
translation:
  language: ko
  text: 청동 대신 내가 금을 가져오고, 철 대신 내가 은을 가져오며, 나무 대신 청동을, 돌 대신 철을 가져올 것입니다. 또 내가 평강을 너의 감독들로, 의를 너의 감독관들로 삼을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감독들’은 ‘행정’이나 ‘관원들’로도 옮길 수 있습니다. 히브리어는 감독, 직무, 감독하는 사람을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 여기서 도덕적 의로움뿐 아니라 공적 질서와 정의의 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘감독관들’은 ‘다스리는 자들’ 또는 ‘압제자들’로도 옮길 수 있습니다. 이 말은 노역이나 공물을 강요하는 자를 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: instead of
  chosen_korean: 대신
  alternatives_korean:
  - ~을/를 대신하여
  - ~을/를 대체하여
  lexicon: HALOT
  rationale: 교체·대체의 의미가 분명하므로 공간적 의미인 ‘아래에’가 아니라 한국어의 자연스러운 대치 표현 ‘대신’을 택했습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 구리
  - 브론즈
  lexicon: HALOT
  rationale: 건축 자재의 교체 목록에서 금속 재질을 가리키는 말로는 ‘청동’이 가장 자연스럽고, ‘구리’보다 문맥상 덜 모호합니다.
- source_word: פְקֻדָּתֵךְ
  english_pob_choice: your overseers
  chosen_korean: 너의 감독들
  alternatives_korean:
  - 너의 행정
  - 너의 관원들
  - 너의 관리들
  lexicon: HALOT
  rationale: 어근 פקד가 감독·직무·감독하는 사람을 가리킬 수 있으므로, 공적 통치의 인적 역할을 살리는 ‘감독들’로 옮겼습니다.
- source_word: נֹגְשַׂיִךְ
  english_pob_choice: your taskmasters
  chosen_korean: 너의 감독관들
  alternatives_korean:
  - 너의 압제자들
  - 너의 다스리는 자들
  - 너의 노역 감독들
  lexicon: HALOT
  rationale: 강제 징발·노역을 요구하는 자를 뜻하는 말이므로, 억압의 뉘앙스를 유지하면서도 한국어에서 역할성을 드러내는 ‘감독관들’로 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 정의
  lexicon: HALOT
  rationale: 문맥상 통치의 성격을 설명하는 덕목이므로, 개인적 도덕성보다 공적·법적 뉘앙스를 살릴 수 있는 ‘의’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 통치 이미지와 성격
  chosen_reading: 평강과 의가 예루살렘의 통치 질서를 이루는 미래 회복의 그림으로 읽었습니다.
  alternative_readings:
  - 평강과 의를 각각 통치자 자체로 의인화하는 읽기
  - 행정 체계의 성격을 추상적으로 묘사하는 읽기
  rationale: 히브리어는 추상명사와 사람 역할을 함께 암시할 수 있으므로, 본문이 가진 시적 의인화와 공적 질서의 변화를 함께 보이도록 했습니다.
  doctrine_reference: 'Translation philosophy #3, 본문의 긴장과 이미지를 평탄화하지 않기'
- issue: ‘감독들 / 감독관들’의 복수성
  chosen_reading: 히브리어의 복수형을 살려 복수로 번역했습니다.
  alternative_readings:
  - 단수 집합명사로 처리하는 읽기
  rationale: 앞선 대체 구문들과의 평행과 대조를 보존하려면 복수형이 더 적절합니다. 단수화하면 본문의 반복적 리듬과 대조가 약해집니다.
  doctrine_reference: 출발어 형태 보존 원칙
