  verdict: revise
  source_fidelity: ‘자리’는 히브리어 본문에 없는 장소 명사를 보태며, ‘대신에’가 가리키는 선행 내용도 다소 불분명하게 만듭니다. 본문은 시온이 버림받고 미움받으며 아무도 지나가지 않던 이전 상태와, 하나님께서 시온을 영속적인 존귀와 세대를 잇는 기쁨으로 만드실 미래 상태를 대비합니다. ‘영원한 영광’은 לִגְאוֹן עוֹלָם의 높여진 존귀·영화라는 의미를 자연스럽게 보존합니다.
  naturalness: ‘네가 버림받고 미움받으며 아무도 지나가지 않던 대신에’는 원문의 상태절을 자연스럽게 유지합니다. ‘너를 영원한 영광으로, 대대로 기쁨으로 삼겠습니다’는 두 보어의 병렬과 합쇼체의 격식을 살립니다.
  terminology: ‘영광’은 여기서 부정적 의미로 오해될 수 있는 ‘자랑’보다 적절하며, ‘위엄’보다 도시에게 부여되는 높여진 지위와 영화의 의미를 더 직접적으로 나타냅니다. 각주에는 실제 대안인 ‘위엄’과 ‘존귀’를 제시합니다.
