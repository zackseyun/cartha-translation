  text: תַּ֧חַת הֱיוֹתֵ֛/ךְ עֲזוּבָ֥ה וּ/שְׂנוּאָ֖ה וְ/אֵ֣ין עוֹבֵ֑ר וְ/שַׂמְתִּי/ךְ֙ לִ/גְא֣וֹן עוֹלָ֔ם מְשׂ֖וֹשׂ דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
  footnotes:
  - marker: a
    text: Or 'an everlasting majesty' or 'an everlasting glory.' The Hebrew term can denote exaltation, majesty, or pride in the sense of honored status.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 버림받고 미움받으며 아무도 지나가지 않던 대신에, 내가 너를 영원한 영광[a]으로, 대대로 기쁨으로 삼겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 위엄’ 또는 ‘영원한 존귀’. 히브리어 단어는 높여진 지위, 위엄, 또는 존귀한 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: Instead of
  chosen_korean: ~ 대신에
  alternatives_korean:
  - ~에 비해
  - ~ 대신
  lexicon: HALOT
  rationale: 이 접속은 이전 상태와 새 상태의 교체를 나타내므로, 한국어에서는 자연스럽고 대비를 살리는 ‘~ 대신에’가 가장 적절합니다.
- source_word: הֱיוֹתֵךְ עֲזוּבָה וּשְׂנוּאָה
  english_pob_choice: your being forsaken and hated
  chosen_korean: 네가 버림받고 미움받으며
  alternatives_korean:
  - 네가 버림받아 버려지고 미움받으며
  - 너의 버려짐과 미움받음
  lexicon: HALOT
  rationale: 분사구조를 한국어의 상태 서술로 옮겨, ‘버림받고 미움받으며’로 수치와 소외의 복합 상태를 간명하게 드러냈습니다.
- source_word: וְאֵין עוֹבֵר
  english_pob_choice: with no one passing through
  chosen_korean: 아무도 지나가지 않던 자리
  alternatives_korean:
  - 지나가는 사람 하나 없는
  - 아무도 지나가지 않는
  lexicon: HALOT
  rationale: 도시의 황폐와 버려짐을 그리는 표현이므로, 단순한 부정보다 ‘자리’까지 포함해 황폐한 통로/거주지의 이미지를 살렸습니다.
- source_word: לִגְאוֹן עוֹלָם
  english_pob_choice: an everlasting majesty / an everlasting pride
  chosen_korean: 영원한 위엄
  alternatives_korean:
  - 영원한 존귀
  - 영원한 영화
  - 영원한 자랑
  lexicon: HALOT
  rationale: גאון은 여기서 교만이 아니라 높여진 존귀와 영화의 상태를 가리키므로, ‘위엄’이 가장 오해가 적고 격식에 맞습니다.
- source_word: מְשׂוֹשׂ דּוֹר וָדוֹר
  english_pob_choice: a joy from generation to generation
  chosen_korean: 대대로 이어질 기쁨
  alternatives_korean:
  - 세대에서 세대로의 기쁨
  - 세대마다의 기쁨
  lexicon: HALOT
  rationale: 관용구를 한국어로 자연스럽게 옮기되, 반복성과 지속성을 유지하기 위해 ‘대대로 이어질’로 처리했습니다.
theological_decisions:
- issue: גאון의 의미를 교만으로 오해하지 않도록 할 필요
  chosen_reading: ‘영원한 위엄’으로 번역해, 높아진 명예와 영광의 상태를 강조했습니다.
  alternative_readings:
  - 영원한 자랑
  - 영원한 영화
  - 영원한 존귀
  rationale: 예언적 회복 선언의 문맥상 부정적 도덕 개념이 아니라 하나님이 부여하시는 존귀한 지위를 뜻하므로, ‘위엄’이 신학적으로도 안전하고 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
