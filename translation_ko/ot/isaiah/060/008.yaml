    reason: lexical_alternative
translation:
  language: ko
  text: 누가 구름처럼 날아오르는 이들이며, 비둘기들처럼 제 창문으로 오는 이들이겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 비둘기장’—곧 비둘기집의 출입구나 창문을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵלֶּה
  english_pob_choice: Who are these
  chosen_korean: 누가 … 이들이겠습니까?
  alternatives_korean:
  - 이들은 누구입니까?
  - 누가 … 이들입니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 자연스러운 한국어 의문문으로 옮기되, 예언적 감탄을 살려 문말을 높였습니다.
- source_word: כָּעָב תְּעוּפֶינָה
  english_pob_choice: fly like a cloud
  chosen_korean: 구름처럼 날아오르는
  alternatives_korean:
  - 구름같이 날아가는
  - 구름처럼 날며
  lexicon: HALOT
  rationale: כ + עָב의 비교를 ‘구름처럼’으로 유지하고, תְּעוּפֶינָה의 생생한 비행 이미지를 ‘날아오르는’으로 풀어 동작감을 살렸습니다.
- source_word: וְכַיּוֹנִים
  english_pob_choice: like doves
  chosen_korean: 비둘기들처럼
  alternatives_korean:
  - 비둘기처럼
  - 비둘기들 같이
  lexicon: HALOT
  rationale: 복수 명사에 맞춰 ‘비둘기들처럼’으로 옮겨 병렬 심유를 분명히 했습니다.
- source_word: אֶל אֲרֻבֹּתֵיהֶם
  english_pob_choice: to their windows
  chosen_korean: 제 창문으로
  alternatives_korean:
  - 그들의 창문으로
  - 그들의 비둘기장 구멍으로
  - 그들의 둥지 창으로
  lexicon: HALOT
  rationale: 아루보트의 기본 의미인 ‘창/열린 구멍’을 따라 직역하면서, POB가 본문에서 취한 ‘windows’ 선택을 반영해 ‘창문’으로 번역했습니다.
theological_decisions:
- issue: 오전/비둘기 이미지의 해석 폭
  chosen_reading: 본문의 1차 이미지를 ‘구름’과 ‘비둘기’의 신속한 귀환/집결 장면으로 두고, 해석을 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - 이방 민족의 순례를 명시적으로 해석하는 방식
  - 성전/비둘기장 상징을 본문에 주석적으로 넣는 방식
  rationale: 히브리어는 시각적 비교를 제시할 뿐 해석을 강제하지 않으므로, 독자가 본문의 이미지 자체를 먼저 받도록 했습니다.
  doctrine_reference: 문맥 우선의 서술시 번역 원칙
