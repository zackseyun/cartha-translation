  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
  footnotes:
  - marker: a
    text: Or 'plunder and ruin' for 'devastation or destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 폭력이 당신의 땅에서 다시는 들리지 않고, 황폐함이나 파괴가 당신의 경계 안에서 들리지 않을 것입니다. 그리고 당신은 당신의 성벽을 ‘구원’이라, 당신의 문들을 ‘찬양’이라 부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약탈과 파괴’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׁמַע עוֹד
  english_pob_choice: will no longer be heard
  chosen_korean: 다시는 들리지 않고
  alternatives_korean:
  - 더 이상 들리지 않고
  - 다시는 들려오지 않고
  lexicon: HALOT
  rationale: 수동적 ‘들리다’의 의미를 자연스럽게 살리면서, ‘더 이상/다시는’으로 עת의 종결을 분명히 했습니다.
- source_word: חָמָס
  english_pob_choice: Violence
  chosen_korean: 폭력
  alternatives_korean:
  - 폭행
  - 학대
  - 불의
  lexicon: HALOT
  rationale: חָמָס의 폭력적·가해적 성격을 가장 직접적으로 전달하는 현대어입니다.
- source_word: שֹׁד וָשֶׁבֶר
  english_pob_choice: devastation or destruction
  chosen_korean: 황폐함이나 파괴
  alternatives_korean:
  - 황폐와 파괴
  - 노략질과 파괴
  - 약탈과 무너짐
  lexicon: HALOT
  rationale: POB의 선택을 따라 단순한 전쟁 행위보다 그 결과로 나타나는 황폐와 파괴를 함께 드러냈습니다.
- source_word: יְשׁוּעָה
  english_pob_choice: Salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구원하심
  - 구원입니다
  lexicon: HALOT
  rationale: 성벽의 이름처럼 붙는 명사적 용법을 살려, 신학적 무게를 유지하는 ‘구원’으로 옮겼습니다.
- source_word: תְּהִלָּה
  english_pob_choice: Praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬송
  - 칭송
  - 찬미
  lexicon: HALOT
  rationale: 문들의 이름으로 주어지는 명사적 표현을 자연스럽게 살리면서, 예배적 울림이 분명한 ‘찬양’을 선택했습니다.
theological_decisions:
- issue: 예언적 이름 붙이기 표현을 한국어에서 어떻게 유지할지
  chosen_reading: ‘성벽을 “구원”이라, 문들을 “찬양”이라 부를 것입니다’로 옮겨 이름 지정의 문법을 드러냈습니다.
  alternative_readings:
  - ‘성벽은 구원, 문들은 찬양이 될 것입니다’
  - ‘성벽의 이름은 구원, 문들의 이름은 찬양이 될 것입니다’
  rationale: 히브리어의 ‘~라 부르다’ 구문이 단순 설명보다 명명 행위를 강조하므로, 한국어에서도 따옴표를 사용해 제목/호칭 기능을 보존했습니다.
  doctrine_reference: 예언적 명명과 상징적 도시 회복
