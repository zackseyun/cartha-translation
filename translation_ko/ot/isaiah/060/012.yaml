base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the nation and the kingdom ... and the nations''; the verse moves from singular to plural for rhetorical effect.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will surely be ruined.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그 나라와 왕국이 당신을 섬기지 않으면 멸망할 것이며, 그 민족들은 완전히 황폐해질 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 나라와 왕국 … 그리고 민족들’로 단수에서 복수로 옮겨 가며 수사적 효과를 냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘반드시 멸망할 것이다.’ 히브리어는 강조를 위해 부정사 절대형과 동사형을 함께 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  english_pob_choice: the nation and the kingdom
  chosen_korean: 그 나라와 왕국
