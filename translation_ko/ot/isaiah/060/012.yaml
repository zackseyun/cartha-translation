  lexicon: HALOT
  rationale: 예언적 경고의 조건을 한국어에서 자연스럽게 풀어, ‘serve’를 ‘섬기다’로 옮겨 직접적 종속·봉사 관계를 유지했습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: will perish
  chosen_korean: 멸망할 것이며
  alternatives_korean:
  - 망할 것이며
  - 사라질 것이며
  lexicon: HALOT
  rationale: אבד의 기본 의미를 반영하면서, 문맥상 심판으로 인한 파멸이라는 점을 드러내는 ‘멸망하다’를 택했습니다.
- source_word: חָרֹב יֶחֱרָבוּ
  english_pob_choice: will be utterly laid waste
  chosen_korean: 완전히 황폐해질 것이기 때문입니다
  alternatives_korean:
  - 완전히 황폐될 것이기 때문입니다
  - 철저히 황무지가 될 것이기 때문입니다
  lexicon: HALOT
  rationale: 동일 어근의 강조구문을 한국어에서 ‘완전히’로 살려, 단순 파괴가 아니라 철저한 황폐를 나타냈습니다.
theological_decisions:
- issue: 단수에서 복수로의 전환
  chosen_reading: 단수 ‘그 나라와 왕국’ 뒤에 복수 ‘그 민족들’로 옮겨, 본문의 수사적 전환을 유지했습니다.
  alternative_readings:
  - 전체를 처음부터 복수로 평탄화
  - 단수만 유지
  rationale: 히브리어가 대표적 단수에서 일반적 복수로 전환하는 수사 효과를 보존해야 하므로, 이를 한국어에서도 구분해 드러냈습니다.
  doctrine_reference: 본문의 수사 구조 보존
- issue: ‘serve you’의 대상
  chosen_reading: ‘당신을’로 직역해, 시온/예루살렘을 가리키는 여성 단수 주소를 해석적으로 풀지 않았습니다.
  alternative_readings:
  - 시온을
  - 예루살렘을
  - 하나님 백성을
  rationale: 문맥의 직접 대상을 확정해 버리기보다, 본문이 유지하는 직접 호칭의 긴장을 보존하는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: 해석적 확정 유보
