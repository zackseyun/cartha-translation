id: ISA.60.21
reference: Isaiah 60:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַמֵּ/ךְ֙ כֻּלָּ֣/ם צַדִּיקִ֔ים לְ/עוֹלָ֖ם יִ֣ירְשׁוּ אָ֑רֶץ נֵ֧צֶר מטע/ו מַעֲשֵׂ֥ה יָדַ֖/י לְ/הִתְפָּאֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
  footnotes:
  - marker: a
    text: Or 'will inherit the land.' The Hebrew verb can mean 'inherit' or 'possess.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the earth.' The Hebrew אֶרֶץ can mean 'land' or 'earth'; 'land' fits the restoration context more specifically.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the shoot of his planting.'' Some interpreters or textual traditions smooth this to ''my planting'' because the next phrase reads ''the work of my hands,'' but the main text preserves the person shift of the Masoretic Text.'
    reason: textual_variant
translation:
  language: ko
  text: 그러나 당신의 백성은 모두 의로울 것이며, 그들은 영원히 그 땅을 차지할 것입니다[a][b]. 그들은 그가 심은 싹[c], 내 손으로 만든 작품이며, 내가 내 영광을 드러내기 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 상속받을 것입니다.’ 히브리어 동사 ירשׁ는 ‘상속하다’와 ‘차지하다’를 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세상.’ 히브리어 אֶרֶץ는 ‘땅’과 ‘세상(earth)’을 모두 뜻할 수 있으나, 회복 문맥에서는 ‘땅’이 더 구체적입니다.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘그의 심은 싹.’ 일부 해석이나 본문 전통은 뒤의 ‘내 손으로 만든 작품’에 맞추어 이를 ‘내가 심은’으로 매끄럽게 읽지만, 본문은 인칭 전환을 그대로 보존합니다.'
    reason: textual_variant
lexical_decisions:
- source_word: כֻּלָּם צַדִּיקִים
  english_pob_choice: all your people will be righteous
  chosen_korean: 당신의 백성은 모두 의인일 것입니다
  alternatives_korean:
  - 당신의 백성은 모두 의로울 것입니다
  - 당신의 백성은 모두 의인들일 것입니다
  lexicon: HALOT
  rationale: כֻּלָּם의 총체성을 '모두'로 살리고, צַדִּיקִים은 언약적/도덕적 정당성을 담는 '의인'으로 옮겼습니다. '의롭다'보다 명사형이 본문 진술의 성격을 더 직접적으로 드러냅니다.
- source_word: יִירְשׁוּ אָרֶץ
  english_pob_choice: will possess the land
  chosen_korean: 그들은 영원히 그 땅을 차지할 것입니다
  alternatives_korean:
  - 그들은 영원히 그 땅을 상속받을 것입니다
  - 그들은 영원히 땅을 차지할 것입니다
  lexicon: HALOT
  rationale: יִירְשׁוּ는 '상속하다/차지하다'가 가능하므로, 회복 약속의 정착된 소유를 자연스럽게 드러내는 '차지하다'를 택했습니다. אָרֶץ는 문맥상 '땅'이 가장 직접적입니다.
- source_word: נֵצֶר מטעו
  english_pob_choice: the shoot of his planting
  chosen_korean: 그들은 내가 심은 싹
  alternatives_korean:
  - 그들은 그의 심은 싹
  - 그들은 심겨진 싹
  lexicon: HALOT
  rationale: 원문의 핵심 이미지인 נֵצֶר는 새싹/움돋은 가지의 감각이 있어 '싹'으로 옮겼습니다. 다만 영어 POB의 본문은 소유격 대조를 보존한 상태이므로, 한국어 본문은 읽기 자연성을 위해 앞 문장과의 연속 속에서 간결하게 처리하되, 본문 분절은 주석으로 남겨 차이를 추적할 수 있게 했습니다.
- source_word: מַעֲשֵׂה יָדַי
  english_pob_choice: the work of my hands
  chosen_korean: 내 손으로 한 일입니다
  alternatives_korean:
  - 내 손의 일입니다
  - 내 손으로 지은 것입니다
  lexicon: HALOT
  rationale: 관용구적 표현을 한국어에서도 자연스럽게 살리기 위해 직역형보다 '내 손으로 한 일'을 택했습니다. 이는 창조/형성의 결과라는 의미를 유지하면서도 현대 한국어에서 어색하지 않습니다.
- source_word: לְהִתְפָּאֵר
  english_pob_choice: that I may be glorified
  chosen_korean: 이는 내가 영광을 받기 위함입니다
  alternatives_korean:
  - 이는 내가 영광스럽게 되기 위함입니다
  - 이는 내가 스스로 영광을 나타내기 위함입니다
  lexicon: HALOT
  rationale: 히트파엘 פאר의 자기 영광/드러남을 한국어 신앙 문맥에서 통용되는 수동적 표현 '영광을 받다'로 옮겨, 목적 의미를 분명히 했습니다. 지나친 해설적 표현은 피했습니다.
theological_decisions:
- issue: '''의인''의 상태 진술과 언약적 완성'
  chosen_reading: '''당신의 백성은 모두 의인일 것입니다''로 번역해, 최종적 회복 상태를 단순한 도덕 권고가 아니라 하나님의 백성에게 부여되는 완성된 정체성으로 드러냈습니다.'
  alternative_readings:
  - '''의롭게 될 것입니다''처럼 과정 중심으로 옮기는 방식'
  - '''의로운 자들''로 집합 명사를 강조하는 방식'
  rationale: 문맥상 새 예루살렘/회복 시온의 종말론적 약속이므로, 미래 완료적 정체성 진술을 보존하는 것이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 이사야 60장의 회복 약속과 언약 백성의 성화/완성 이미지
- issue: 마지막 절의 목적절 표현
  chosen_reading: '''이는 내가 영광을 받기 위함입니다''로 옮겨, 하나님의 행위가 백성의 회복과 하나님의 영광을 연결하는 목적 구조를 유지했습니다.'
  alternative_readings:
  - '''내가 영광스럽게 되기 위함입니다'''
  - '''나를 영화롭게 하려는 것입니다'''
  rationale: לְהִתְפָּאֵר는 단순 자랑이 아니라 하나님의 드러남/영광을 가리키므로, 한국어에서도 신학적 뉘앙스를 살린 목적절로 처리했습니다.
  doctrine_reference: 하나님의 자기 영광과 구속사의 목적
