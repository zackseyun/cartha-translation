  source_fidelity: 원문의 두 수유 동사와 ‘열국의 젖’, ‘왕들의 유방’이라는 구체적 비유는 유지되었으나, 초안은 두 동사의 미래적 예언 표현을 충분히 드러내지 못했고 ‘알리라’는 문맥상 ‘네가 알게 된다’가 아니라 ‘내가 알린다’로 읽힐 수 있어 주체와 의미가 달라집니다.
  naturalness: 초안의 ‘너는 … 알리라’는 현대 표준어 합쇼체와 맞지 않으며 문법적으로도 어색합니다. 수신자를 지칭하는 표현과 종결을 현대적인 정중 문체로 통일했습니다.
  terminology: ‘구원자’, ‘구속자’, ‘야곱의 전능자’는 각각 מוֹשִׁיעֵךְ, גֹאֲלֵךְ, אֲבִיר יַעֲקֹב을 충실히 반영합니다. 하나님의 이름 יהוה는 프로젝트 방침에 따라 ‘야훼’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘알리라’
    rationale: 히브리어 וְיָדַעַתְּ는 2인칭 여성 단수로, 시온이 ‘알게 될 것’을 뜻합니다. 한국어 ‘알리라’는 보통 1인칭 화자가 ‘알릴 것’이라는 뜻이어서 원문의 인칭과 의미를 바꿉니다.
  - severity: medium
    issue: 수유 동사의 미래적 예언 표현 누락
    rationale: 문맥상 두 ינק 동사는 시온에게 약속되는 미래의 일을 가리킵니다. ‘빨고 … 빨아’만으로는 해당 예언적 의미가 불분명합니다.
  - severity: medium
    issue: 문체 불일치
    rationale: ‘너는’과 ‘알리라’는 현대 정중 합쇼체가 아니며, 요청된 표준어 현대 정중 문체에 맞추어야 합니다.
  - severity: low
    issue: 각주가 본문과 동일한 문구를 ‘더 정확한 번역’으로 제시함
    rationale: 초안 본문 자체가 이미 해당 수유 이미지를 직역적으로 보존하므로, 동일 문구를 대안 번역으로 제시하는 각주는 정보 가치가 없고 혼동을 줍니다.
