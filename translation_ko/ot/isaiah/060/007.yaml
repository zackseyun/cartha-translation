source:
  edition: WLC
  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
  footnotes:
  - marker: a
    text: Or 'They will ascend acceptably on my altar.' The Hebrew phrase combines 'go up' with the idea of favorable acceptance.
    reason: lexical_alternative
  - marker: b
    text: '''My glorious house'' refers to the temple, literally ''the house of my beauty/glory.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 게달의 모든 양 떼가 당신에게로 모여들고, 네바욧의 숫양들이 당신을 섬길 것입니다. 그것들은 제단 위에 기꺼이 올라갈 것이며, 나는 나의 영화로운 집을 아름답게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기꺼이’는 히브리어 ‘עַל רָצוֹן’의 수납·호의 뉘앙스를 한국어로 간결하게 풀어낸 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나의 영화로운 집’은 문자적으로는 ‘나의 아름다움/영광의 집’이며, 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאן
  english_pob_choice: flocks
  chosen_korean: 양 떼
  alternatives_korean:
  - 떼
  - 가축 떼
  - 작은 가축
  lexicon: HALOT
  rationale: 집합명사인 צֹאן의 군집성을 살리되, 제단 문맥에서 자연스러운 한국어로는 '양 떼'가 가장 직접적이고 읽기 쉽습니다.
- source_word: יִקָּבְצוּ לָךְ
  english_pob_choice: will be gathered to you
  chosen_korean: 당신에게로 모여들고
  alternatives_korean:
  - 당신에게로 모일 것이며
  - 당신에게로 모아질 것이며
  lexicon: HALOT
  rationale: 니팔의 수동·집합 뉘앙스를 살려 '모여들다'로 옮기고, 방향성 있는 לָךְ는 '당신에게로'로 드러냈습니다.
- source_word: יְשָׁרְתוּנֶךְ
  english_pob_choice: will minister to you
  chosen_korean: 당신을 섬길 것입니다
  alternatives_korean:
  - 당신에게 봉사할 것입니다
  - 당신을 시중들 것입니다
  lexicon: HALOT
  rationale: שרות의 일반적 '섬기다' 의미를 유지하면서도, 제의적 맥락을 흐리지 않기 위해 '섬길 것입니다'를 택했습니다.
- source_word: עַל רָצוֹן
  english_pob_choice: with acceptance
  chosen_korean: 기꺼이
  alternatives_korean:
  - 받아들여져
  - 호의롭게
  - 받아들여질 만하게
  lexicon: HALOT
  rationale: 직역만으로는 한국어가 부자연스러워질 수 있어, 제물의 수납이 호의적이라는 뜻을 간결하게 드러내는 '기꺼이'로 옮겼습니다.
- source_word: בֵית תִּפְאַרְתִּי
  english_pob_choice: my glorious house
  chosen_korean: 나의 영화로운 집
  alternatives_korean:
  - 나의 아름다운 집
  - 나의 찬란한 집
  - 나의 영광의 집
  lexicon: HALOT
  rationale: תִּפְאַרְתִּי의 '아름다움/영화/영광' 범위를 한국어에서 모두 담기 어려워, 예배 처소의 위엄을 살리는 '영화로운 집'을 선택했습니다.
- source_word: אֲפָאֵר
  english_pob_choice: I will beautify
  chosen_korean: 아름답게 하겠습니다
  alternatives_korean:
  - 장식하겠습니다
  - 영화롭게 하겠습니다
  - 꾸미겠습니다
  lexicon: HALOT
  rationale: פּאר의 미화·장식 의미를 직접 반영하되, 대상이 성전/집이라는 점을 고려해 '아름답게 하겠습니다'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제물과 제단의 제의적 이미지
  chosen_reading: 이 구절은 이방 민족의 가축이 성전 제물로 받아들여지는 장면을 분명히 보여줍니다.
  alternative_readings:
  - 단순한 조공 또는 일반적 봉사의 이미지로 완화하는 읽기
  rationale: 양 떼, 숫양, 제단, 기꺼이 올라감이라는 연결이 제의적 의미를 강하게 지시하므로, 그 긴장을 약화시키지 않고 본문 이미지를 그대로 살렸습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 2인칭 여성형 주소의 대상
  chosen_reading: 본문의 '당신'은 시온/예루살렘을 인격화한 직접 호칭으로 유지했습니다.
  alternative_readings:
  - 하나님의 백성 전체에 대한 포괄적 호칭
  rationale: 이사야 60장의 시온 인격화 흐름을 반영하여, 본문의 직접성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
