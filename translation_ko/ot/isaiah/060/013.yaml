  source_fidelity: 히브리어의 어순과 병렬을 따라 레바논의 영광(숲의 영화)이 시온에게 오며 세 나무가 성소를 아름답게 한다는 뜻을 보존했습니다. מְקוֹם מִקְדָּשִׁי와 מְקוֹם רַגְלַי는 각각 ‘내 성소의 자리’와 ‘내 발이 있는 곳’으로 자연스럽게 옮기되, 후자의 신인동형적 이미지는 유지했습니다.
  naturalness: 초안의 ‘내 성소의 곳’과 ‘내 발의 곳’은 현대 표준 한국어에서 부자연스럽습니다. 또한 하나님이 시온을 가리키는 문맥에서 ‘당신’보다 ‘네게’가 자연스럽고, 문맥상 성경적 직접 화법에도 알맞습니다. 문장 종결은 합쇼체로 유지했습니다.
