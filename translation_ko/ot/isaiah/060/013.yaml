  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
  footnotes:
  - marker: a
    text: 'The Hebrew names three kinds of trees: cypress, plane tree, and pine. The exact species for the second and third terms are uncertain; alternatives include ''elm'' and ''box tree.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my footstool.' The Hebrew reads more literally, 'the place of my feet.'
    reason: alternative_reading
translation:
  language: ko
  text: 레바논의 영광이 네게로 올 것입니다. 곧 노송나무와 플라타너스와 잣나무가 함께 와서[a] 내 성소의 자리를 아름답게 하고, 나는 내 발이 있는 곳을[b] 영화롭게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 세 종류의 나무를 말합니다. 두 번째와 세 번째 나무의 정확한 수종은 확실하지 않으며, ‘느릅나무’와 ‘상자나무’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 발등상’. 히브리어는 더 문자적으로 ‘내 발이 있는 곳’이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 영화
  - 존귀
  lexicon: HALOT
  rationale: 레바논의 숲과 목재의 풍성함을 가리키는 표현으로, ‘영광’이 그 위엄과 가치의 의미를 가장 자연스럽게 살립니다.
- source_word: בְּרוֹשׁ
  english_pob_choice: cypress
  chosen_korean: 노송나무
  alternatives_korean:
  - 편백나무
  - 잣향나무
  lexicon: HALOT
  rationale: 정확한 수종은 불확실하지만, 성전·숲 문맥에서 귀한 목재를 지닌 침엽수 이미지를 살리는 한국어로 ‘노송나무’를 택했습니다.
- source_word: תִּדְהָר
  english_pob_choice: plane tree
  chosen_korean: 플라타너스
  alternatives_korean:
  - 느릅나무
  - 엘름
  lexicon: HALOT
  rationale: 종 식별이 확실하지 않으므로, 현대 독자에게 익숙하면서도 넓은 잎의 아름다운 가로수/조경수 이미지를 주는 외래어 표기를 사용했습니다.
- source_word: תְאַשּׁוּר
  english_pob_choice: pine
  chosen_korean: 잣나무
  alternatives_korean:
  - 소나무
  - 전나무
  lexicon: HALOT
  rationale: 목재용 수종 목록의 흐름을 살려, 한국어 성경 독자에게 친숙한 침엽수로 ‘잣나무’를 선택했습니다.
- source_word: מְקוֹם מִקְדָּשִׁי
  english_pob_choice: the place of my sanctuary
  chosen_korean: 내 성소의 곳
  alternatives_korean:
  - 내 성소의 자리
  - 내 성소의 장소
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 보존하면서도 자연스러운 한국어가 되도록 ‘성소의 곳’으로 옮겼습니다.
- source_word: וּמְקוֹם רַגְלַי
  english_pob_choice: the place of my feet
  chosen_korean: 내 발의 곳
  alternatives_korean:
  - 내 발이 놓인 곳
  - 내 발자리가 있는 곳
  lexicon: HALOT
  rationale: 문자적으로 ‘내 발의 곳’이지만, 본문이 의도하는 하나님의 임재를 암시하는 시적 이미지를 유지하기 위해 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: ‘the place of my feet’의 비유적 표현
  chosen_reading: ‘내 발의 곳’을 본문에 그대로 두었습니다.
  alternative_readings:
  - ‘내 발판’
  - ‘내 발등상’
  rationale: 본문은 발등상으로 풀어 쓰기보다, 하나님의 임재를 시적으로 표현하는 원문 이미지를 유지하는 편이 더 직접적입니다.
