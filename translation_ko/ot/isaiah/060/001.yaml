id: ISA.60.1
reference: Isaiah 60:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
  footnotes:
  - marker: a
    text: Or 'Rise, be radiant'; the Hebrew imperative can carry the sense of becoming bright or giving light.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; rendered 'the LORD' following the project's standard for the divine name.
    reason: alternative_reading
translation:
  language: ko
  text: 일어나십시오, 빛을 발하십시오. 당신의 빛이 왔고, 야훼의 영광이 당신 위에 떠올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령형은 ‘일어나라’뿐 아니라 ‘빛나라’, ‘빛을 발하라’의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּמִי
  english_pob_choice: Arise
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어서십시오
  - 일어나세요
  lexicon: HALOT
  rationale: 2인칭 여성 단수 명령형의 강한 소명으로, 예언적 호소의 격식을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: א֖וֹרִי
  english_pob_choice: shine
  chosen_korean: 빛을 발하십시오
  alternatives_korean:
  - 비치십시오
  - 찬란히 빛나십시오
  lexicon: HALOT
  rationale: 동사의 상태 변화와 가시적 광채를 함께 살리기 위해 직역적이면서도 자연한 표현을 택했습니다. POB가 허용한 'be radiant'의 여지를 한국어로는 '빛을 발하다'가 가장 가깝습니다.
- source_word: יְהוָ֖ה
  english_pob_choice: the LORD / Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약명 יְהוָה를 가리키는 직접 표기는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다. 문맥이 하나님의 영광을 직접 연결하므로 일반 호칭인 '주님'보다 고유명 표지가 필요합니다.
- source_word: כְב֥וֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 존귀
  lexicon: HALOT
  rationale: 하나님의 현현과 중량감 있는 존귀를 함께 담는 성서적 표준어로 '영광'이 가장 적합합니다.
theological_decisions:
- issue: 여호와의 이름을 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로, 표준 격식의 대화체가 아니라 고유한 언약명을 드러내는 번역이 필요합니다. POB 기준에 따라 '야훼'를 유지하면 원문의 신학적 특정성이 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 히브리어 완료형 בָא, זָרָח의 예언적 시제
  chosen_reading: 과거 완료의 현재완료적 표현('왔고', '떠올랐습니다')
  alternative_readings:
  - 왔습니다/떠올랐습니다
  - 오고/떠오릅니다
  - 올 것이고/떠오를 것입니다
  rationale: 예언적 확실성과 이미 실현된 듯한 수사성을 살리기 위해 단순 과거나 미래보다 현재완료적 한국어가 더 적절합니다. 마지막 절은 한국어에서 '떠오르다'가 सूर्योदय/광휘 이미지와 잘 맞습니다.
  doctrine_reference: 예언 시제의 수사적 완료를 보존하는 번역 원칙
