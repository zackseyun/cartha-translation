id: ISA.60.22
reference: Isaiah 60:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/קָּטֹן֙ יִֽהְיֶ֣ה לָ/אֶ֔לֶף וְ/הַ/צָּעִ֖יר לְ/ג֣וֹי עָצ֑וּם אֲנִ֥י יְהוָ֖ה בְּ/עִתָּ֥/הּ אֲחִישֶֽׁ/נָּה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
  footnotes:
  - marker: a
    text: Or 'the little one' / 'the least' for 'the smallest.'
    reason: lexical_alternative
  - marker: b
    text: '''A thousand'' may also be understood by some as ''a clan,'' but the numerical sense fits the growth parallelism best here.'
    reason: lexical_alternative
  - marker: c
    text: Or 'at its appointed time I will hasten it.' The Hebrew preserves a tension between fixed timing and swift fulfillment.
    reason: alternative_reading
translation:
  language: ko
  text: 가장 작은 자는 천 명[b]이 되고, 가장 보잘것없는 자는 강한 나라가 될 것입니다. 나는 야훼입니다. 그 때가 되면[c] 나는 그것을 속히 이루겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘천’은 어떤 문맥에서는 ‘씨족’으로도 이해될 수 있으나, 여기서는 증가의 평행구조가 수사적 의미를 가장 잘 뒷받침합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정해진 때에 나는 그것을 속히 이루겠습니다.’ 히브리어는 예정된 시기와 신속한 성취 사이의 긴장을 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  english_pob_choice: the smallest
  chosen_korean: 가장 작은 자
  alternatives_korean:
  - 가장 보잘것없는 자
  - 작은 자
  lexicon: HALOT
  rationale: קָטֹן은 크기와 함께 비중의 작음을 가리킬 수 있으므로, 여기서는 인격화된 비교 표현으로 ‘가장 작은 자’가 자연스럽고 원문의 대비를 살립니다.
- source_word: לָאֶלֶף
  english_pob_choice: a thousand
  chosen_korean: 천 명
  alternatives_korean:
  - 천
  - 한 천
  lexicon: HALOT
  rationale: 기본 의미는 수사 ‘천’이며, 한국어에서는 사람을 가리키는 문맥이므로 ‘천 명’이 문맥상 가장 분명합니다.
- source_word: הַצָּעִיר
  english_pob_choice: the least
  chosen_korean: 가장 보잘것없는 자
  alternatives_korean:
  - 가장 작은 자
  - 어린 자
  lexicon: HALOT
  rationale: צָעִיר는 단순한 연령보다 지위나 비중의 낮음을 나타낼 수 있어, 앞줄과 평행을 이루는 ‘가장 보잘것없는 자’로 옮겼습니다.
- source_word: לְגוֹי עָצוּם
  english_pob_choice: a mighty nation
  chosen_korean: 강한 나라
  alternatives_korean:
  - 강대한 나라
  - 힘센 민족
  lexicon: HALOT
  rationale: גּוֹי는 ‘나라’가 기본이고, עָצוּם은 강함/막강함을 뜻하므로, 과장되지 않으면서도 위력을 살리는 ‘강한 나라’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본어에 따라 번역어 ‘야훼’를 유지해 고유한 신명칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘그 때에’와 ‘속히 이루겠습니다’의 긴장 보존
  chosen_reading: 그 때에 나는 그것을 속히 이루겠습니다
  alternative_readings:
  - 적절한 때에 나는 그것을 속히 이루겠습니다
  - 때가 되면 나는 그것을 빠르게 이루겠습니다
  rationale: 히브리어는 정해진 때와 서두름의 긴장을 함께 유지하므로, 문장을 매끈하게 풀어 없애지 않고 두 요소를 함께 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
