translation:
  language: ko
  text: 나라들이 당신의 빛으로 나아오고, 왕들이 당신이 일어나는 빛의 밝음으로 나아올 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나아오고’는 문자적으로는 ‘걷고’ 또는 ‘가고’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라들’은 문맥에 따라 ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘빛의 밝음’은 ‘당신의 새벽의 광채’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  english_pob_choice: will come
  chosen_korean: 나아오고
  alternatives_korean:
  - 올 것입니다
  - 걸어올 것입니다
  - 가게 될 것입니다
  lexicon: HALOT
  rationale: הלך의 기본뜻은 ‘걷다/가다’이지만, 목적지를 향해 이동하는 문맥에서는 한국어로 ‘나아오다’가 자연스럽고, 예언적 미래 뉘앙스도 살릴 수 있습니다.
- source_word: גוֹיִם
  english_pob_choice: nations
  chosen_korean: 나라들이
  alternatives_korean:
  - 민족들이
  - 이방인들이
  - 백성들이
  lexicon: HALOT
  rationale: 문맥상 גוים은 개별 민족 집단을 가리키는 ‘나라들’이 가장 직접적이며, ‘이방인들’은 여기서는 더 해석적입니다.
- source_word: לְאוֹרֵךְ
  english_pob_choice: to your light
  chosen_korean: 당신의 빛으로
  alternatives_korean:
  - 당신의 빛을 향해
  - 당신의 빛에 이르러
  lexicon: HALOT
  rationale: לְ는 방향성을 가지므로 한국어에서는 ‘~으로’가 자연스럽고, 2인칭 여성 단수 접미사를 반영해 ‘당신의 빛’으로 옮겼습니다.
- source_word: לְנֹגַהּ זַרְחֵךְ
  english_pob_choice: to the brightness of your rising
  chosen_korean: 당신이 일어나는 빛의 밝음으로
  alternatives_korean:
  - 당신의 떠오름의 밝음으로
  - 당신의 새벽의 광채로
  - 당신이 떠오르는 광채로
  lexicon: HALOT
  rationale: נֹגַהּ는 ‘밝음/광채’이고 זרח는 ‘떠오르다/일어나다’이므로, 단순히 ‘새벽’으로 좁히지 않고 상승 이미지와 빛의 중첩을 함께 살렸습니다.
theological_decisions:
- issue: 2인칭 여성 단수의 대상
  chosen_reading: 시온/예루살렘을 여성으로 의인화하여 직접 부르는 표현으로 유지했습니다.
  alternative_readings:
  - 하나님 백성 전체를 일반적으로 가리키는 표현으로 완화할 수 있음
  rationale: 이 절은 이사야 60장의 직접 호칭을 이어가므로, 인칭과 성별 표지를 지우지 않고 번역하는 편이 원문의 수사와 신학적 긴장을 더 정확히 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
