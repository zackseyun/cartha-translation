  terminology: גוֹיִם은 ‘나라들’이 적절하며, מְלָכִים은 ‘왕들’로 유지합니다. 여성 단수 접미사는 한국어에서 문법 성을 재현할 수 없으므로, 문맥상 시온을 향한 직접 호칭인 ‘네’로 자연스럽게 보존합니다. נֹגַהּ는 ‘광채’, זרח는 ‘떠오름’으로 옮겨 ‘새벽’으로 의미를 불필요하게 한정하지 않았습니다.
