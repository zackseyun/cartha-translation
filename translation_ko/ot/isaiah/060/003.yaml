  source_fidelity: 첫 행의 ‘당신의 빛으로 나아오고’는 대체로 원문의 방향성과 미래적 병행을 반영합니다. 그러나 ‘당신이 일어나는 빛의 밝음’은 זַרְחֵךְ(‘당신의 떠오름/빛남’)을 ‘당신이 일어나는 빛’으로 잘못 결속하여 의미와 수식 관계를 흐립니다. ‘네 떠오름의 광채’로 옮기면 נֹגַהּ זַרְחֵךְ의 구성 관계와 시적 빛의 이미지를 보존합니다.
