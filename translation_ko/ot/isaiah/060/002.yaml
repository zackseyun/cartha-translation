  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: ko
  text: 보십시오, 흑암이 땅을 덮고 짙은 어둠이 만민을 덮을 것입니다. 그러나 야훼께서 당신 위에 비치실 것이며, 그의 영광이 당신 위에 나타날 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה는 주의를 끄는 감탄사로, 여기서는 "보십시오"로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / English "look"
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: הִנֵּה
  rationale: 예언문맥의 청자 주의를 끄는 감탄사로서, 현대 합쇼체의 직접적 권고형인 「보십시오」가 POB의 "look"을 가장 자연스럽게 살립니다.
- source_word: הַחֹשֶׁךְ / עֲרָפֶל
  english_pob_choice: darkness / thick darkness
  chosen_korean: 흑암 / 짙은 어둠
  alternatives_korean:
  - 어둠 / 캄캄함
  - 암흑 / 짙은 암흑
  lexicon: חֹשֶׁךְ; עֲרָפֶל
  rationale: 두 개의 어둠 이미지를 구분해 살리기 위해, 일반적 "어둠"보다 더 강한 "흑암"과 "짙은 어둠"을 대응시켰습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: יהוה
  rationale: 본문의 하나님의 이름이므로, 프로젝트 기본값에 따라 학술적 전사인 「야훼」를 사용했습니다.
- source_word: כְבוֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그분의 영광
  - 그 영광
  lexicon: כָּבוֹד
  rationale: 소유격 대명사를 유지해 앞선 야훼와의 연결을 분명히 하고, 한국어에서는 자연스러운 「그의 영광」으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 현현을 나타내는 동사 선택
  chosen_reading: '"야훼께서 당신 위에 비치실 것이며"'
  alternative_readings:
  - '"야훼께서 당신 위에 일어나실 것이며"'
  - '"야훼께서 당신 위에 떠오르실 것이며"'
  rationale: יִזְרַח은 빛이 떠오르다/비치다의 이미지를 담으므로, 예언적 계시와 영광의 출현을 함께 드러내는 "비치실"을 채택했습니다.
  doctrine_reference: 시적 예언에서 하나님의 임재를 빛의 출현으로 묘사하는 구약적 현현 모티프
