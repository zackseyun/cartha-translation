source:
  edition: WLC
  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
  footnotes:
  - marker: a
    text: Or 'the islands' or 'the distant shores'; the Hebrew term often refers broadly to maritime lands or coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'because he has beautified you' or 'because he has honored you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 해안 지역들은 나를 기다리고, 다시스의 배들은 앞장서서 네 아들들을 먼 곳에서 데려오며 그들의 은과 금도 그들과 함께 가져올 것입니다. 이는 야훼, 네 하나님의 이름과 이스라엘의 거룩하신 분을 위한 것이니, 그분께서 너를 영화롭게 하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해안 지역들’은 히브리어 אִיִּים의 넓은 지리적 범주를 반영한 번역입니다. ‘섬들’ 또는 ‘먼 해안들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영화롭게 하셨기 때문입니다’는 ‘아름답게 하셨기 때문입니다’ 또는 ‘영예롭게 하셨기 때문입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיִּים
  english_pob_choice: the coastlands
  chosen_korean: 해안 지역들
  alternatives_korean:
  - 섬들
  - 먼 해안들
  lexicon: HALOT
  rationale: 이사야에서 אִיִּים은 문자적 섬만이 아니라 바다 건너 먼 연안 지역들을 가리키므로, 지리적 의미를 살린 ‘해안 지역들’이 가장 무난합니다.
- source_word: יְהוָה אֱלֹהַיִךְ
  english_pob_choice: the name of Yahweh your God
  chosen_korean: 야훼 너의 하나님
  alternatives_korean:
  - 여호와 너의 하나님
  - 주 너의 하나님
  lexicon: 도서 프로젝트 기본 용례
  rationale: 이 본문은 야훼의 언약명 자체를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘이름을 위하여’는 한국어에서는 뒤의 목적구조와 함께 자연스럽게 ‘야훼 너의 하나님의 이름을 위해’로 처리했습니다.
- source_word: בָנַיִךְ
  english_pob_choice: your sons
  chosen_korean: 네 아들들
  alternatives_korean:
  - 네 자녀들
  lexicon: HALOT
  rationale: 히브리어는 2인칭 여성 단수 소유격이 붙은 남성 복수형으로, 성별을 지우지 않는 번역 원칙에 따라 ‘아들들’을 유지했습니다.
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  english_pob_choice: with their silver and their gold with them
  chosen_korean: 그들의 은과 금을 함께 싣고
  alternatives_korean:
  - 그들의 은과 금을 가지고
  - 그들의 은과 금과 함께
  lexicon: HALOT
  rationale: אִתָּם의 동반 관계를 자연스러운 한국어로 풀어 ‘함께 싣고’로 옮겼습니다. 이는 배의 운송 장면과도 잘 맞고, 반복된 소유격의 강조도 지나치게 매끄럽게 지우지 않습니다.
- source_word: בָּרִאשֹׁנָה
  english_pob_choice: first
  chosen_korean: 먼저
  alternatives_korean:
  - 첫째로
  - 맨 앞서
  lexicon: HALOT
  rationale: 우선순위를 나타내는 부사로서 한국어에서는 ‘먼저’가 가장 자연스럽습니다.
- source_word: פֵאֲרָךְ
  english_pob_choice: because he has glorified you
  chosen_korean: 영화롭게 하셨기 때문입니다
  alternatives_korean:
  - 아름답게 하셨기 때문입니다
  - 영예롭게 하셨기 때문입니다
  lexicon: HALOT
  rationale: פא״ר 어근은 꾸미다/아름답게 하다/영화롭게 하다의 범위를 가지지만, 여기서는 시온의 높임과 회복을 말하므로 ‘영화롭게 하다’가 의미를 가장 잘 포착합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 역본은 텍스트가 직접 가리키는 신명사형을 보존하는 방향을 따르므로, 관습적 교회어인 ‘여호와’나 대체어 ‘주’보다 ‘야훼’를 사용합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 이스라엘의 거룩하신 이 병행구
  chosen_reading: 이스라엘의 거룩하신 이
  alternative_readings:
