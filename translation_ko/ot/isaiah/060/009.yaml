revisions:
- from: 확실히 해안 지역들이 나를 기다리고, 다시스의 배들이 먼저 와서, 멀리서 네 아들들을 그들의 은과 금을 함께 싣고 와서, 야훼 너의 하나님의 이름을 위해, 그리고 이스라엘의 거룩하신 이를 위해 오리니, 이는 그분이 너를 영화롭게 하셨기 때문입니다.[a][b]
  to: 참으로 해안 지역들은 나를 기다리고, 다시스의 배들은 앞장서서 네 아들들을 먼 곳에서 데려오며 그들의 은과 금도 그들과 함께 가져올 것입니다. 이는 야훼, 네 하나님의 이름과 이스라엘의 거룩하신 분을 위한 것이니, 그분께서 너를 영화롭게 하셨기 때문입니다.[a][b]
  rationale: 원문의 통사 구조를 따라 다시스의 배들이 앞장서서 아들들을 먼 곳에서 데려오는 목적을 명확히 했습니다. 은과 금이 아들들과 동반된다는 표현을 보존하고, 야훼의 이름 및 이스라엘의 거룩하신 분을 위한 목적도 병렬적으로 유지했습니다. 각주 표지는 각각 해당 어휘 선택과 문장 끝의 פֵאֲרָךְ에 연결되도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
