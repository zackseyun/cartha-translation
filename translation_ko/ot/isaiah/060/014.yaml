id: ISA.60.14
reference: Isaiah 60:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'The children of your oppressors will come to you bowed down.' The Hebrew is literally 'the sons of those who afflicted you.'
    reason: lexical_alternative
  - marker: b
    text: '''Bow down'' here expresses submission or homage to Zion, not divine worship of the city.'
    reason: cultural_note
  - marker: c
    text: 'Hebrew: ''Zion of the Holy One of Israel,'' a title identifying Zion as belonging to the Holy One of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너를 학대하던 자들의 아들들이 너에게 와서 몸을 굽히고, 너를 멸시하던 모든 이가 네 발바닥 아래에서 절하며, 너를 「야훼의 성읍, 이스라엘의 거룩하신 이의 시온」이라 부를 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘절하며’는 여기서 종교적 예배가 아니라 굴복과 경의를 나타냅니다.
    reason: theological_note
  - marker: b
    text: 히브리어는 직역하면 ‘너를 학대하던 자들의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이스라엘의 거룩하신 이의 시온’은 시온이 ‘이스라엘의 거룩하신 이’에게 속한 도시임을 나타내는 압축된 칭호입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְעַנַּיִךְ
  english_pob_choice: The sons of those who afflicted you
  chosen_korean: 너를 학대하던 자들의 아들들
  alternatives_korean:
  - 너를 압제하던 자들의 자녀들
  - 너를 괴롭히던 자들의 아들들
  lexicon: HALOT
  rationale: בְּנֵי는 문자적으로 ‘아들들’이지만, 한국어에서는 소유격 구문으로 풀어 자연스럽게 옮겼습니다. מְעַנַּיִךְ는 단순한 고통이 아니라 가해·억압의 뉘앙스가 있어 ‘학대하던’이 적절합니다.
- source_word: וְהִשְׁתַּחֲוּוּ
  english_pob_choice: will bow down
  chosen_korean: 몸을 굽히고 … 절하며
  alternatives_korean:
  - 엎드려 절하며
  - 경배하며
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 예배도 뜻하지만, 여기서는 시온 앞에 드리는 굴복과 경의의 행위이므로 ‘절하다/몸을 굽히다’로 옮겨 우상숭배적 오해를 피했습니다.
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  english_pob_choice: at the soles of your feet
  chosen_korean: 네 발바닥 아래
  alternatives_korean:
  - 네 발바닥 밑에
  - 네 발 아래
  lexicon: HALOT
  rationale: כַּפּוֹת רַגְלַיִךְ는 발의 바닥을 가리키는 생생한 표현이므로 ‘발바닥 아래’로 옮겨 굴복의 이미지를 살렸습니다.
- source_word: עִיר יְהוָה
  english_pob_choice: The City of Yahweh
  chosen_korean: 야훼의 성읍
  alternatives_korean:
  - 야훼의 도시
  - 주님의 성읍
  lexicon: HALOT
  rationale: יְהוָה는 본문에 직접 나온 신명으로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. עִיר는 성경적 관용을 살려 ‘성읍’으로 번역했습니다.
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: Zion of the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이의 시온
  alternatives_korean:
  - 이스라엘의 거룩하신 이에게 속한 시온
  - 이스라엘의 거룩하신 이, 시온
  lexicon: HALOT
  rationale: 압축된 히브리어 소유·식별 구문을 한국어에서는 관형격으로 풀어, 시온이 ‘이스라엘의 거룩하신 이’에 속한 것으로 읽히게 했습니다.
- source_word: וְקָרְאוּ לָךְ
  english_pob_choice: they will call you
  chosen_korean: 너를 …이라 부를 것입니다
  alternatives_korean:
  - 너를 …라 이름할 것입니다
  - 너를 …라고 부를 것입니다
  lexicon: HALOT
  rationale: 관용적으로 명칭을 붙이는 표현이므로 ‘부르다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 시온 앞에서의 절함을 예배로 오해할 가능성
  chosen_reading: 이 동작은 시온에 대한 굴복과 존경의 표시이지, 도성 자체에 대한 신적 예배가 아닙니다.
  alternative_readings:
  - ‘경배하다’로 번역하면 예배 의미가 지나치게 강해질 수 있습니다.
  rationale: 본문의 대상은 하나님이 아니라 회복된 시온/예루살렘이므로, 동사의 종교적 의미를 완화하지 않되 문맥상 정치·사회적 굴복을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: יְהוָה의 번역
  chosen_reading: 본문의 신명은 ‘야훼’로 옮깁니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 מופיע한 Tetragrammaton을 프로젝트 기본값에 따라 음역하여, 언약적 신명성을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
