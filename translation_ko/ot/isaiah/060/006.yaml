id: ISA.60.6
reference: Isaiah 60:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the dromedaries of Midian and Ephah.' The Hebrew term refers to young camels.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will announce good news of the praises of the LORD.' The verb can carry the sense of heralding good news.
    reason: lexical_alternative
translation:
  language: ko
  text: 낙타의 풍성한 떼가 당신을 덮을 것입니다[a] — 미디안과 에바의 어린 낙타들이며, 그들 모두가 스바에서 올 것입니다. 그들은 금과 유향을 가져오고, 야훼의 찬양을 선포할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미디안과 에바의 낙타들’로도 옮길 수 있습니다. 히브리어 용어는 어린 낙타를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 야훼의 찬양에 관한 좋은 소식을 전할 것입니다’로도 옮길 수 있습니다. 동사는 복된 소식을 알리는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְעַת גְּמַלִּים
  english_pob_choice: A multitude of camels
  chosen_korean: 낙타의 풍성한 떼
  alternatives_korean:
  - 낙타의 무리가
  - 낙타의 많은 떼
  lexicon: HALOT
  rationale: שִׁפְעַת는 단순 수량보다 ‘풍성함/풍부함’을 나타내므로, 시각적 과잉을 살리면서도 자연스러운 한국어인 ‘풍성한 떼’로 옮겼습니다.
- source_word: תְּכַסֵּךְ
  english_pob_choice: will cover you
  chosen_korean: 당신을 덮을 것입니다
  alternatives_korean:
  - 당신을 뒤덮을 것입니다
  - 당신을 가릴 것입니다
  lexicon: HALOT
  rationale: 2인칭 여성 단수 어미를 살려 시온/예루살렘을 직접 향한 표현을 유지했고, כסה의 기본 의미인 ‘덮다’를 그대로 반영했습니다.
- source_word: בִּכְרֵי
  english_pob_choice: the young camels of
  chosen_korean: 어린 낙타들이며
  alternatives_korean:
  - 새끼 낙타들이며
  - 어린 낙타 무리이며
  lexicon: HALOT
  rationale: 이 항목은 ‘dromedaries’보다 ‘young camels’가 더 정확하다는 POB 주석을 따르되, 현대 한국어에서 통하는 ‘어린 낙타’로 풀었습니다.
- source_word: זָהָב וּלְבוֹנָה
  english_pob_choice: gold and frankincense
  chosen_korean: 금과 유향
  alternatives_korean:
  - 금과 프랑킨센스
  - 금과 향
  lexicon: HALOT
  rationale: לְבוֹנָה는 일반적인 ‘향’이 아니라 ‘유향/몰약 수지 계열의 향료’인 frankincense이므로, 전통적으로 통용되는 ‘유향’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 대체 표기를 따르지 않고, 신명기적 언약명인 יְהוָה를 음역한 ‘야훼’를 본문에 반영했습니다.
- source_word: יְבַשֵּׂרוּ
  english_pob_choice: they will proclaim
  chosen_korean: 선포할 것입니다
  alternatives_korean:
  - 기쁜 소식을 전할 것입니다
  - 복음을 전할 것입니다
  lexicon: HALOT
  rationale: בשר의 기본 뜻은 ‘좋은 소식을 알리다/선포하다’이지만, 이 절에서는 ‘야훼의 찬양’을 대상으로 하므로 과도하게 복음화하지 않고 ‘선포하다’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 본문의 하나님의 이름은 ‘야훼’로 옮기고, ‘주’로 대체하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 야훼의 이름을 직접 사용하므로, 독자가 언약적 고유명칭을 인지하도록 제목이 아니라 이름 자체를 보존하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ의 관계
  chosen_reading: ‘야훼의 찬양을 선포할 것입니다’로 옮겨, 찬양의 대상과 공적 선포의 행위를 모두 드러냈습니다.
  alternative_readings:
  - 야훼께 찬양을 선포할 것입니다
  - 야훼의 찬양에 대해 좋은 소식을 전할 것입니다
  rationale: 히브리어는 ‘찬양’의 대상/내용이 압축되어 있어 양쪽 가능성을 남깁니다. 한국어에서는 문맥상 자연스럽게 읽히도록 하되, 선포 동작의 힘을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: POB source-note on יְבַשֵּׂרוּ
