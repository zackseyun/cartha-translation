base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
  footnotes:
  - marker: a
    text: Or 'be radiant.' The Hebrew verb can carry the sense of shining or brightening in response to what is seen.
    reason: lexical_alternative
  - marker: b
    text: Or 'the wealth of the sea.' The phrase may refer specifically to maritime riches brought to Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너는 보고 빛날 것이며, 네 마음은 떨고 커질 것입니다. 이는 바다의 풍성함이 네게로 돌아오고, 여러 민족의 재물이 네게로 올 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּרְאִי
  english_pob_choice: you will see
  chosen_korean: 너는 보고
  alternatives_korean:
  - 너는 볼 것이며
  - 너는 바라볼 것이며
  lexicon: HALOT
  rationale: 여성 단수로 시온에게 직접 말하는 미래형 동작을 살려, 단순한 시각 행위로 옮겼습니다.
- source_word: וְנָהַרְתְּ
  english_pob_choice: be radiant
  chosen_korean: 빛날 것이며
  alternatives_korean:
  - 환하게 될 것이며
  - 광채를 낼 것이며
  lexicon: HALOT
  rationale: 문맥상 눈에 보이는 빛남과 내적 고양을 함께 담는 표현으로, ‘be radiant’의 기본 뜻을 간결하게 살렸습니다.
- source_word: וְרָחַב לְבָבֵךְ
  english_pob_choice: your heart will grow wide
  chosen_korean: 네 마음은 떨고 커질 것입니다
  alternatives_korean:
  - 네 마음은 넓어질 것입니다
  - 네 마음은 부풀어 오를 것입니다
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘넓어지다’를 한국어에서 자연스럽게 전달하기 위해 ‘커지다’를 택했고, 앞의 ‘떨다’와 함께 놀라움과 충격의 반응을 살렸습니다.
- source_word: הֲמוֹן יָם
  english_pob_choice: the abundance of the sea
  chosen_korean: 바다의 풍성함
  alternatives_korean:
  - 바다의 풍요
  - 바다의 많은 재물
  lexicon: HALOT
  rationale: ‘무리/풍성함/많음’의 폭을 유지하면서, 문맥의 부와 자원의 유입이라는 뉘앙스를 살렸습니다.
- source_word: חֵיל גּוֹיִם
  english_pob_choice: the wealth of the nations
  chosen_korean: 여러 민족의 재물
  alternatives_korean:
  - 나라들의 부
  - 민족들의 부요
  lexicon: HALOT
  rationale: חֵיל의 경제적 의미를 따라 ‘재물’로 옮기고, גּוֹיִם은 문맥에 맞게 ‘여러 민족’으로 풀었습니다.
theological_decisions:
- issue: 시온의 반응이 두려움인지 기쁨인지의 긴장
  chosen_reading: 놀라움으로 인한 떨림과 환희가 함께하는 반응으로 유지했습니다.
  alternative_readings:
  - 순수한 두려움
  - 순수한 기쁨
  rationale: ‘보다—빛나다—떨다—마음이 커지다’의 연쇄는 단순 공포나 단순 감동으로 환원되지 않으므로, 그 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
