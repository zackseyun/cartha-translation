review_pass:
  verdict: revise
  source_fidelity: ‘마음은 떨고 커질 것입니다’는 히브리어의 두 동사와 주어 관계를 다소 불분명하게 만들며, ‘커지다’는 לְבָבֵךְ가 ‘넓어지다’라는 은유를 충분히 보존하지 못합니다. 또한 יֵהָפֵךְ עָלַיִךְ의 수동적 방향 전환을 ‘네게로 돌아오고’로 옮기면 원래 시온에 속했던 것이 վերադարձ한다는 뉘앙스가 생길 수 있습니다.
  naturalness: 개정문은 현대 표준어 합쇼체를 유지하면서도 ‘마음이 떨리고 넓어지다’라는 병렬을 명료하게 합니다. ‘바다의 풍성함이 네게로 향하고’는 한국어에서 자연스럽고, 원문의 ‘너를 향하여 돌이켜지다’라는 방향성을 과도한 해석 없이 전달합니다.
  terminology: ‘빛나다’, ‘바다의 풍성함’, ‘여러 민족의 재물’은 각각 נהר, הֲמוֹן יָם, חֵיל גּוֹיִם의 문맥상 의미를 적절히 보존합니다. ‘바다의 풍성함’에는 해상 교역의 재물이라는 가능한 함의가 있으나 본문에는 더 넓은 표현을 유지하고 각주로만 제시합니다.
  issues:
  - severity: medium
    issue: ‘네 마음은 떨고 커질 것입니다’
    rationale: 원문은 ‘네 마음’이 ‘떨고’ 또한 ‘넓어질’ 것이라는 병렬입니다. ‘커지다’는 직역적 은유와 정서적 확장의 뉘앙스를 약화시키므로 ‘떨리고 넓어질 것입니다’가 더 충실합니다.
  - severity: medium
    issue: ‘바다의 풍성함이 네게로 돌아오고’
    rationale: ‘돌아오다’는 이전에 네게 속했던 것이 되돌아온다는 함의를 낼 수 있습니다. 히브리어는 바다의 풍성함이 시온을 향해 전환되는 모습을 말하므로 ‘네게로 향하고’가 더 안전합니다.
  revised_text: 그때에 너는 보고 빛날 것이며, 네 마음은 떨리고 넓어질 것입니다. 이는 바다의 풍성함이 네게로 향하고, 여러 민족의 재물이 네게로 올 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘바다의 재물’. 이 표현은 바다를 통해 들어오는 풍요나 해상 교역의 부를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 동사 병렬과 ‘마음이 넓어지다’라는 이미지를 보존하도록 문장을 바로잡았습니다. 또한 ‘돌아오다’가 낳을 수 있는 반환의 함의를 피하고, 수동적 방향 전환의 핵심인 ‘시온을 향함’을 자연스러운 한국어로 옮겼습니다. 바다의 풍성함이 구체적으로 해상 재물을 뜻할 가능성은 본문에 단정하지 않고 각주로 보존했습니다.
