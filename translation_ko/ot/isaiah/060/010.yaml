  source_fidelity: 히브리어의 핵심 구조와 의미는 대체로 충실합니다. בְנֵי־נֵכָר를 ‘이방인의 아들들’로 유지하고, 성벽을 ‘다시 세울 것’, 왕들이 섬길 것, 진노 가운데 내리친 일과 호의 가운데 보인 긍휼의 대조를 모두 보존했습니다. 다만 יְשָׁרְתוּנֶךְ의 번역어는 현대 표준어 합쇼체에 맞게 다듬는 편이 안전합니다.
  naturalness: ‘수종들 것입니다’는 현대 한국어에서 매우 드물고 다소 고풍스럽게 들립니다. ‘섬길 것입니다’가 현대적이면서도 왕들의 공식적 봉사·시중의 의미를 충분히 전달합니다. 각주 표지도 해당 어구 바로 뒤에 배치하여 독자가 대안을 명확히 알 수 있게 했습니다.
  terminology: ‘이방인의 아들들’, ‘진노’, ‘긍휼히 여기다’는 본문의 격식과 성서적 어휘에 잘 맞습니다. רָצוֹן의 문맥상 의미인 favor는 ‘호의’로 유지할 수 있습니다. ‘섬기다’는 שׁרת의 기본 의미를 자연스럽게 전달하며, 각주에서 ‘수종들다’를 대안으로 제시할 수 있습니다.
