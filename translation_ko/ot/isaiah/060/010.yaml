id: ISA.60.10
reference: Isaiah 60:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
  footnotes:
  - marker: a
    text: Or 'sons of foreigners'; the Hebrew expression can function idiomatically for foreigners more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'will serve you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in my goodwill' / 'in my pleasure.'
    reason: lexical_alternative
  - marker: d
    text: Or 'I have shown you mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이방인의 아들들이 네 성벽을 다시 세울 것이며, 그들의 왕들이 네게 섬길 것입니다.[a][b] 이는 내가 내 진노로 너를 쳤으나, 내 호의로[c] 너를 긍휼히 여겼기[d] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방 사람들’. ‘이방인의 아들들’은 히브리어의 관용적 표현으로, 더 넓게는 이방 민족들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네게 수종들 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 기뻐하심 가운데’ / ‘내 선의 가운데’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 너에게 자비를 베풀었기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵֽי נֵכָר
  english_pob_choice: The sons of foreigners
  chosen_korean: 이방인의 아들들
  alternatives_korean:
  - 외국인의 아들들
  - 이방 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리면서도, 한국어에서 자연스럽고 성경적 어감을 유지하는 표현으로 옮겼습니다. 단순히 '이방 사람들'로 풀면 원문의 관용적 형식이 약해집니다.
- source_word: בָנ֤וּ
  english_pob_choice: will rebuild
  chosen_korean: 다시 세울 것입니다
  alternatives_korean:
  - 세울 것입니다
  - 재건할 것입니다
  lexicon: HALOT
  rationale: 문맥상 무너진 성벽의 회복을 가리키므로 '다시 세울'이 원문의 'build'를 과도하게 확장하지 않으면서도 복원 의미를 잘 드러냅니다.
- source_word: יְשָׁרְת֑וּנֶךְ
  english_pob_choice: will minister to you
  chosen_korean: 네게 수종들 것입니다
  alternatives_korean:
  - 네게 섬길 것입니다
  - 네게 봉사할 것입니다
  lexicon: HALOT
  rationale: שׁרת의 공식적·궁정적 뉘앙스를 반영해 '수종들다'를 택했습니다. 단순한 '섬기다'보다 왕들이 너에게 예속되어 봉사하는 느낌을 더 잘 살립니다.
- source_word: בְקִצְפִּי
  english_pob_choice: in my wrath
  chosen_korean: 내 진노로
  alternatives_korean:
  - 내 분노로
  - 내 노여움으로
  lexicon: HALOT
  rationale: קצף는 단순한 감정보다 심판적 진노를 가리키므로, 합쇼체 문맥에서 '진노'가 가장 적절합니다.
- source_word: וּבִרְצוֹנִי
  english_pob_choice: in my favor
  chosen_korean: 내 호의로
  alternatives_korean:
  - 내 은총으로
  - 내 기쁘신 뜻으로
  lexicon: HALOT
  rationale: רָצוֹן의 기본 의미를 살리되, '진노'와의 대조를 자연스럽게 만드는 한국어로 '호의'를 선택했습니다. 문맥상 단순 욕망이 아니라 긍정적 호감을 뜻합니다.
- source_word: רִחַמְתִּיךְ
  english_pob_choice: I have had compassion on you
  chosen_korean: 너를 긍휼히 여겼기 때문입니다
  alternatives_korean:
  - 너에게 자비를 베풀었기 때문입니다
  - 너를 불쌍히 여겼기 때문입니다
  lexicon: HALOT
  rationale: רחם의 핵심은 애정 어린 연민이므로, 한국어 성경 어휘에서 널리 통용되는 '긍휼히 여기다'를 사용해 감정과 행위를 함께 담았습니다.
theological_decisions:
- issue: 예루살렘/시온을 본문에 명시할지 여부
  chosen_reading: 2인칭 여성형 대명사와 소유격을 그대로 유지하고, 본문에 지명을 보충하지 않았습니다.
  alternative_readings:
  - 예루살렘아, 이방인의 아들들이...
  - 시온아, ...
  rationale: 히브리어 본문에는 지명이 없고, 도시를 여성으로 의인화한 2인칭이 핵심이므로, 해석적 보충은 자제했습니다.
  doctrine_reference: '원문 우선 번역 원칙: 본문이 말하지 않은 것을 덧붙이지 않습니다.'
- issue: 심판과 긍휼의 대비를 어떻게 보존할지
  chosen_reading: '''내 진노로 너를 쳤으나, 내 호의로 너를 긍휼히 여겼다''로 병치했습니다.'
  alternative_readings:
  - 내 노여움으로 너를 벌했으나, 내 선의로 너에게 자비를 베풀었다
  rationale: 하나님의 징계와 회복의 긴장을 완화하지 않고 그대로 드러내기 위해, 두 절을 평행적으로 배치했습니다.
  doctrine_reference: '번역 신학: 본문의 신학적 긴장을 해소하지 말고 보존합니다.'
