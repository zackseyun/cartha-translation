base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
  footnotes:
  - marker: a
    text: Or 'a memorial and a name'; Hebrew literally, 'a hand and a name.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from 'them' to 'him,' likely individualizing the promise within the group.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그들에게 내 집 안과 내 성벽 안에 아들들과 딸들보다 더 나은 기념물[a]과 이름을 주고, 끊어지지 않을 영원한 이름을 그에게[b] 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손과 이름’이지만, 여기서는 오래 남는 기념과 명예를 뜻하는 관용구입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 여기서 복수에서 단수로 옮겨 갑니다. 한국어 본문은 그 변화를 그대로 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: יָד וָשֵׁם
  english_pob_choice: a monument and a name
  chosen_korean: 기념물과 이름
  alternatives_korean:
  - 기념과 이름
  - 기념비와 이름
  - 기억거리와 이름
  lexicon: HALOT
  rationale: 이 관용구는 문자 그대로 ‘손과 이름’이 아니라 지속적인 기념과 명예를 뜻하므로, 한국어로는 문맥에 맞는 ‘기념물’을 택해 가시적·공적 기념의 뜻을 살렸습니다.
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  english_pob_choice: better than sons and daughters
  chosen_korean: 아들들과 딸들보다 더 나은
  alternatives_korean:
  - 자녀들보다 더 나은
  - 아들 혹은 딸보다 더 나은
  lexicon: HALOT
  rationale: 히브리어의 비교 표현과 남녀 자녀를 함께 적는 형식을 살리기 위해 ‘아들들과 딸들’을 유지했습니다.
- source_word: שֵׁם עוֹלָם
  english_pob_choice: an everlasting name
  chosen_korean: 영원한 이름
  alternatives_korean:
  - 영속하는 이름
  - 오래가는 이름
  lexicon: HALOT
  rationale: עוֹלָם의 지속·영구성을 한국어의 자연스러운 종결형 형용사로 옮겨 ‘영원한’이 가장 직접적입니다.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  english_pob_choice: that will not be cut off
  chosen_korean: 끊어지지 않을
  alternatives_korean:
  - 잘려 없어지지 않을
  - 끊기지 않을
  lexicon: HALOT
  rationale: כרת의 ‘잘리다/끊어지다’ 이미지를 살리되, 한국어에서 이름이 사라지는 의미로 자연스럽게 읽히는 ‘끊어지지 않을’을 택했습니다.
theological_decisions:
- issue: 마지막 절의 인칭 변화(복수 → 단수)
  chosen_reading: ‘그들에게’ 다음에 ‘그에게’를 그대로 유지했습니다.
  alternative_readings:
  - 끝까지 복수로 통일하기
  - ‘그들 각자에게’로 풀어 옮기기
  rationale: 본문은 복수 مخاط에서 단수 לוֹ로 이동하므로, 이를 평탄화하지 않고 보존해 집단 약속이 개인적 보상으로 좁혀지는 효과를 드러냈습니다.
  doctrine_reference: Source-text primacy; do not harmonize away a real Hebrew shift.
