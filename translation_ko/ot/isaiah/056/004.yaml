id: ISA.56.4
reference: Isaiah 56:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: ko
  text: 야훼께서 말씀하십니다. “안식일들을 지키며, 내가 기뻐하는 것을 선택하고, 내 언약을 굳게 지키는 내시들에게는…”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 שַׁבְּתוֹתַי는 문자적으로 ‘내 안식일들’입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문의 מקור어가 יהוה이므로, POB 기본 원칙에 따라 신학적 일반호칭보다 고유 신명 표현인 야훼를 사용했습니다.
- source_word: לַסָּרִיסִים
  english_pob_choice: to the eunuchs
  chosen_korean: 내시들에게
  alternatives_korean:
  - 환관들에게
  - 고자들에게
  lexicon: סָרִיס
  rationale: 히브리어 사리스는 궁정 내시를 가리키므로, 현대 한국어에서 가장 직설적이면서도 문맥상 적절한 내시를 택했습니다.
- source_word: יִשְׁמְרוּ אֶת שַׁבְּתוֹתַי
  english_pob_choice: who keep my Sabbaths
  chosen_korean: 안식일들을 지키며
  alternatives_korean:
  - 내 안식일들을 지키며
  - 나의 안식일들을 지키며
  lexicon: שַׁבָּת
  rationale: 복수형 ‘안식일들’을 살려 정기적 안식일 준수를 드러냈고, 소유격 ‘my’는 뒷절의 ‘내 언약’과 함께 자연스럽게 이어지도록 했습니다.
- source_word: בַּאֲשֶׁר חָפָצְתִּי
  english_pob_choice: what I delight in
  chosen_korean: 내가 기뻐하는 것을
  alternatives_korean:
  - 내가 즐거워하는 것을
  - 내가 원하시는 것을
  lexicon: חָפֵץ
  rationale: חפץ의 핵심 의미는 ‘기뻐하다/원하다’이므로, 하나님의 선호를 분명히 드러내는 ‘기뻐하는 것’을 사용했습니다.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  english_pob_choice: who hold fast to my covenant
  chosen_korean: 내 언약을 굳게 지키는
  alternatives_korean:
  - 내 언약을 붙들고 있는
  - 내 언약을 굳게 붙드는
  lexicon: חזק + ברית
  rationale: ‘붙들다’보다 언약 준수의 지속성과 충실성을 더 분명히 드러내기 위해 ‘굳게 지키다’를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 개방형 결말과 인용 부호 처리
  chosen_reading: 본문은 다음 절로 이어지는 선언의 도입부이므로, 한국어도 끝맺음표 대신 열린 말줄임으로 처리했습니다.
  alternative_readings:
  - 문장부호를 마침표로 닫는 번역
  - 다음 절까지 포함해 한 문장으로 이어 번역
  rationale: 히브리어 원문이 열려 있는 구조를 유지해, 뒤따르는 약속/판결의 흐름을 독자가 자연스럽게 느끼도록 했습니다.
  doctrine_reference: 문맥 보존과 절 구조 존중
- issue: ‘안식일들’의 복수성
  chosen_reading: 복수형을 그대로 드러내어 반복적이고 규범적인 언약 순종을 나타냈습니다.
  alternative_readings:
  - ‘안식일’을 단수로 일반화
  - ‘안식일 규례들’로 의역
  rationale: 원문 복수형을 단수로 평탄화하면 히브리어의 반복성과 강조가 약해지므로, 수형을 살렸습니다.
  doctrine_reference: 본문 충실성
