    text: Or 'to eat' or 'to consume.' The Hebrew verb is the common verb for eating; 'devour' brings out the predatory force in context.
    reason: lexical_alternative
  - marker: b
    text: The summons to the beasts likely functions as an image of coming judgment; some interpreters understand the beasts metaphorically for invading enemies.
    reason: alternative_reading
translation:
  language: ko
  text: 들의 모든 들짐승들아, 와서 먹으십시오[a]—숲 속의 모든 들짐승들아.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 기본적으로 ‘먹다’라는 뜻입니다. 문맥상 포식의 강한 뉘앙스를 살려 ‘삼키다’ 또는 ‘잡아먹다’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 부름은 다가올 심판을 나타내는 예언적 이미지일 수 있습니다. 일부 해석자는 들짐승들을 침략 세력의 상징으로 이해합니다.
    reason: alternative_reading
