  text: כֹּ֖ל חַיְת֣וֹ שָׂדָ֑י אֵתָ֕יוּ לֶ/אֱכֹ֥ל כָּל חַיְת֖וֹ בַּ/יָּֽעַר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/009.yaml
  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
  footnotes:
  - marker: a
    text: Or 'to eat' or 'to consume.' The Hebrew verb is the common verb for eating; 'devour' brings out the predatory force in context.
    reason: lexical_alternative
  - marker: b
    text: The summons to the beasts likely functions as an image of coming judgment; some interpreters understand the beasts metaphorically for invading enemies.
    reason: alternative_reading
translation:
  language: ko
  text: 들판의 모든 들짐승들아, 와서 먹어라— 숲의 모든 들짐승들아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹다’는 기본 의미이지만, 여기서는 포식의 뉘앙스를 살리기 위해 ‘devour’로 옮긴 영어 POB의 판단을 따른 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 소환은 다가올 심판을 가리키는 예언적 이미지로 기능할 가능성이 큽니다. 일부 해석자는 들짐승을 침략 세력의 상징으로 봅니다.
    reason: theological_note
lexical_decisions:
- source_word: כֹּל / כל
  english_pob_choice: all
  chosen_korean: 모든
  alternatives_korean:
  - 온
  - 전부의
  lexicon: HALOT
  rationale: 대상을 총괄하는 수량 표현이므로 한국어에서는 자연스럽고 간결한 ‘모든’이 적절합니다.
- source_word: חַיְתוֹ שָׂדַי
  english_pob_choice: beasts of the field
  chosen_korean: 들판의 들짐승들
  alternatives_korean:
  - 들판의 짐승들
  - 들짐승들
  - 들판의 야생 짐승들
  lexicon: HALOT
  rationale: 문맥상 길들지 않은 야생 동물을 가리키므로 ‘들짐승들’이 가장 직접적이며, ‘들판의’로 מקום 구성을 살렸습니다.
- source_word: אֵתָיוּ לֶאֱכֹל
  english_pob_choice: come to devour
  chosen_korean: 와서 먹어라
  alternatives_korean:
  - 와서 삼켜라
  - 와서 잡아먹어라
  - 와서 먹으라
  lexicon: HALOT
  rationale: 히브리어 동사는 기본적으로 ‘먹다’이지만, 영어 POB가 지적하듯 문맥상 포식적 힘이 있습니다. 한국어에서는 명령형의 직접성을 살리면서도 과도한 해석을 피하기 위해 ‘와서 먹어라’로 두었습니다.
- source_word: בַּיָּעַר
  english_pob_choice: of the forest
  chosen_korean: 숲의
  alternatives_korean:
  - 숲 속의
  - 숲의 야생 짐승들
  - 산림의
  lexicon: HALOT
  rationale: שָׂדַי와의 평행을 살려 같은 구조로 대응하되, 현대 한국어에서 자연스러운 ‘숲의’를 택했습니다.
theological_decisions:
- issue: 징계 예언의 동물 소환 이미지
  chosen_reading: 실제 들짐승을 부르는 형식의 예언적 심판 이미지로 보존했습니다.
  alternative_readings:
  - 침략자나 원수들을 가리키는 은유로만 옮기는 읽기
  rationale: 본문은 직접 동물들을 호출하므로, मुख्य 텍스트에서 은유로 풀어버리기보다 동물 이미지 자체를 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, source transparency and tension preservation
