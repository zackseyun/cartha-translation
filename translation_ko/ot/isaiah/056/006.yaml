revisions:
- from: 그리고 이방인의 아들들로서 야훼께 붙어, 그를 섬기며 야훼의 이름을 사랑하고 그의 종들이 되기 위해—안식일을 더럽히지 않고 지키며 나의 언약을 굳게 붙드는 모든 사람은—
  to: 또 야훼께 붙어서 그를 섬기고 야훼의 이름을 사랑하며 그의 종들이 되려는 이방인의 아들들, 곧 안식일을 더럽히지 않고 지키며 나의 언약을 굳게 붙드는 모든 이들은—
  rationale: 원문의 어순상 ‘이방인의 아들들’을 주축으로 유지하고, 세 개의 목적 표현(섬기다, 이름을 사랑하다, 종들이 되다)을 한국어의 병렬 관계절로 자연스럽게 옮겼습니다. כָּל의 포괄성을 ‘모든 이들’로 드러내되, 절 말미의 대시와 미완결 구문은 원문이 다음 절로 이어지는 구조를 반영하여 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:24Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 ‘이방인의 아들들로서’는 원문의 관계절을 한국어의 자격·신분을 나타내는 ‘-로서’로 바꾸어 문장 관계를 흐리며, ‘안식일을 더럽히지 않고 지키며’의 수식 범위도 보다 분명히 할 필요가 있습니다.
  naturalness: 현 초안은 긴 부정사열과 ‘이방인의 아들들로서’ 때문에 현대 표준 한국어에서 다소 부자연스럽습니다. 관계절을 ‘…하려는’으로 정리하고, כָּל의 포괄적·분배적 기능을 ‘모든 이들’로 명시하면 자연스럽고 문법적으로 안정됩니다.
  terminology: ‘야훼’, ‘안식일’, ‘언약’, ‘종들’은 적절합니다. ‘야훼께 붙어’도 원뜻을 보존하지만, 문맥상 ‘야훼께 붙어서’가 관계절 연결에 더 자연스럽습니다. ‘이방인의 아들들’은 히브리어 관용구를 보존하되, 직역임을 감수한 표현입니다.
  issues:
  - severity: medium
    issue: ‘이방인의 아들들로서’의 ‘-로서’
    rationale: 히브리어는 ‘이방인의 아들들’에 이어 이를 수식하는 ‘야훼께 붙는’ 관계절을 둡니다. ‘-로서’는 자격 또는 신분의 부사어가 되어 원문의 수식 관계와 한국어 문장 흐름을 모두 약화합니다.
  - severity: low
    issue: 후반부의 포괄 범위와 연결
    rationale: כָּל שֹׁמֵר … וּמַחֲזִיקִים은 앞의 이방인들에 대한 포괄적 서술입니다. ‘모든 이들’을 앞세우고 두 분사구를 병렬로 두면 안식일 준수와 언약을 굳게 붙듦이 같은 집단의 특성임이 분명해집니다.
  revised_text: 또 야훼께 붙어서 그를 섬기고 야훼의 이름을 사랑하며 그의 종들이 되려는 이방인의 아들들, 곧 안식일을 더럽히지 않고 지키며 나의 언약을 굳게 붙드는 모든 이들은—
