  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
  footnotes:
  - marker: a
    text: Or 'foreigners.' Hebrew literally, 'sons of the foreigner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to serve him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to be his slaves.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and hold fast to my covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이방인의 아들들로서 야훼께 붙어, 그를 섬기며 야훼의 이름을 사랑하고 그의 종들이 되기 위해—안식일을 더럽히지 않고 지키며 나의 언약을 굳게 붙드는 모든 사람은—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  english_pob_choice: the sons of the foreigner
  chosen_korean: 이방인의 아들들
  alternatives_korean:
  - 외국인들
  - 이방인들의 자녀들
  - 이방인 출신 사람들
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 살려 ‘아들들’을 유지하되, 한국어에서는 혈연보다 집단적 소속을 드러내는 표현으로 읽히도록 했습니다.
- source_word: הַנִּלְוִים עַל יְהוָה
  english_pob_choice: who join themselves to Yahweh
  chosen_korean: 야훼께 붙어
  alternatives_korean:
  - 야훼께 자신을 붙이며
  - 야훼께 합류하여
  - 야훼께 연합하여
  lexicon: HALOT
  rationale: נלוה의 결속·부착 의미를 살려 ‘붙어’로 옮겼고, 단순한 참여보다 언약적 귀속의 뉘앙스를 유지했습니다.
- source_word: לְשָׁרְתוֹ
  english_pob_choice: to minister to him
  chosen_korean: 그를 섬기며
  alternatives_korean:
  - 그에게 봉사하며
  - 그를 시중들며
  - 그에게 사역하며
  lexicon: HALOT
  rationale: 하나님께 드리는 예배적 섬김의 문맥에서 ‘섬기며’가 가장 자연스럽고도 격식을 유지합니다.
- source_word: לִהְיוֹת ל֖וֹ לַעֲבָדִים
  english_pob_choice: to be his servants
  chosen_korean: 그의 종들이 되기 위해
  alternatives_korean:
  - 그의 노예가 되기 위해
  - 그의 종으로 있기 위해
  - 그를 섬기는 자들이 되기 위해
  lexicon: HALOT
  rationale: 여기서는 예배와 언약에 속한 소속 관계가 강조되므로, 본문이 요구하는 종속성은 살리되 한국어의 상례적 ‘종’으로 번역했습니다.
- source_word: כָּל שֹׁמֵר שַׁבָּת
  english_pob_choice: everyone who keeps the Sabbath
  chosen_korean: 안식일을 … 지키며
  alternatives_korean:
  - 안식일을 지키는 모든 사람은
  - 안식일을 지키는 자는
  - 안식일을 지키는 모든 이는
  lexicon: HALOT
  rationale: כָּל + 분사 구조의 분배적 의미를 살려 문장 끝에서 ‘모든 사람은’으로 귀결되게 했습니다.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  english_pob_choice: and holds fast my covenant
  chosen_korean: 나의 언약을 굳게 붙드는
  alternatives_korean:
  - 나의 언약을 굳게 지키는
  - 나의 언약을 붙잡는
  - 나의 언약을 견고히 붙드는
  lexicon: HALOT
  rationale: מַחֲזִיקִים의 강한 ‘붙들다/붙잡다’ 의미를 살려 ‘굳게 붙드는’으로 옮겼고, 언약 언어의 결속감을 유지했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문과 연계된 고유명으로 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 신성명사 יְהוָה를 제목적 대체어가 아닌 고유명사로 드러내기 위해 ‘야훼’를 택했습니다.
  doctrine_reference: POB terminology policy; יְהוָה rendering default
- issue: עֲבָדִים의 사회적 강도
  chosen_reading: ‘종들’로 옮겨 언약적 소속과 섬김의 의미를 드러냈습니다.
  alternative_readings:
  - 노예들
  - 하인들
  rationale: 이 문맥은 법적 매매 노예 신분보다 야훼께 속한 봉사와 충성을 강조하므로 ‘종’이 원문의 힘을 지나치게 약화하지 않으면서도 한국어 성경체에 적합합니다.
  doctrine_reference: Contested terms table; covenantal service context
