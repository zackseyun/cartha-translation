id: ISA.56.11
reference: Isaiah 56:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
  footnotes:
  - marker: a
    text: Or 'insatiable'; literally 'strong/fierce of appetite.'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not understand' / 'know nothing of discernment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from every quarter' for 'every one without exception'; the Hebrew phrase is difficult and may emphasize the total extent of their corruption.
    reason: alternative_reading
translation:
  language: ko
  text: 또 개들은 탐욕스러워 만족함을 알지 못하며, 그들은 목자들인데도 깨달음을 알지 못합니다. 그들 모두가 자기 길로 돌아섰고, 각자 자기 이익만을 좇으며, 누구 하나 예외 없이 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘탐욕스러워’는 직역하면 ‘강한/사나운 혼(또는 욕구)’이라는 뜻을 간결하게 풀어쓴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깨달음’은 직역하면 ‘이해함/분별함’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘누구 하나 예외 없이’는 히브리어의 난해한 표현을 전체적·집단적 타락으로 읽은 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  english_pob_choice: the dogs
  chosen_korean: 개들
  alternatives_korean:
  - 개들
  - 개 같은 자들
  lexicon: HALOT
  rationale: 원문의 구체적 은유를 살려 ‘개들’로 옮기고, 해석적 호칭으로 풀어쓰지 않았습니다.
- source_word: עַזֵּי נֶפֶשׁ
  english_pob_choice: greedy in appetite
  chosen_korean: 탐욕스러워
  alternatives_korean:
  - 식욕이 강하여
  - 강한 욕망을 지닌
  - 만족할 줄 모르는
  lexicon: HALOT
  rationale: ‘강한/사나운’과 ‘혼/생명’이 결합한 관용구의 탐욕적 의미를 자연스러운 한국어 형용사로 압축했습니다.
- source_word: לֹא יָדְעוּ שָׂבְעָה
  english_pob_choice: they do not know satisfaction
  chosen_korean: 만족함을 알지 못하며
  alternatives_korean:
  - 배부름을 알지 못하며
  - 만족을 알지 못하며
  - 족함을 알지 못하며
  lexicon: HALOT
  rationale: ‘알다’의 반복을 살려 ‘만족함을 알지 못하다’로 옮겨 원문의 관용적 표현을 유지했습니다.
- source_word: לְבִצְעוֹ
  english_pob_choice: to his own gain
  chosen_korean: 자기 이익만을
  alternatives_korean:
  - 자기 이익을
  - 부당한 이익을
  - 사리사욕을
  lexicon: HALOT
  rationale: בצע의 핵심은 ‘이익/사익’이므로, 원문과 POB 보류를 따라 ‘자기 이익’으로 옮기되 탐욕의 방향을 드러냈습니다.
theological_decisions:
- issue: ‘개들’과 ‘목자들’의 중첩 은유를 어떻게 처리할지
  chosen_reading: 주석화하지 않고 본문 안에 둘 다 유지했습니다.
  alternative_readings:
  - 지도자들
  - 감시자들
  - 목회자들
  rationale: 히브리어는 지도층을 개와 목자로 겹쳐 비판하므로, 교회적 직분어로 바꾸지 않고 원문의 은유를 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 은유 보존'
- issue: ‘지혜/분별’ 대신 ‘깨달음’ 선택
  chosen_reading: ‘깨달음’을 사용했습니다.
  alternative_readings:
  - 분별
  - 이해
  - 통찰
  rationale: לֹא יָדְעוּ הָבִין의 ‘이해하다/분별하다’ 의미를 현대 한국어에서 가장 자연스럽게 전달하면서도, 단순 지적 무지보다 도덕적·영적 무능을 드러냅니다.
  doctrine_reference: '번역 원칙: 의미 등가와 문맥 우선'
