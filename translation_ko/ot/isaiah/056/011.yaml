  source_fidelity: 초안은 ‘개들’과 ‘목자들’의 은유, 만족을 모름, 각자의 이익 추구라는 기본 의미를 대체로 보존합니다. 그러나 ‘목자들인데도’는 원문에 없는 양보 관계를 더하고, ‘자기 이익만’의 ‘만’은 원문보다 배타성을 강화합니다. 또한 난해한 מִקָּצֵהוּ를 본문의 ‘누구 하나 예외 없이’로 옮길 수는 있으나, 각주에서 그 불확실성과 대안적 이해를 더 정확히 밝혀야 합니다.
  naturalness: ‘깨달음을 알지 못합니다’는 현대 표준 한국어에서 다소 부자연스럽고 원문의 הָבִין(이해하다, 분별하다)의 동사적 성격도 약화합니다. ‘분별할 줄을 알지 못합니다’가 자연스럽고 원문의 ‘알지 못하다’ 반복도 살립니다. 마지막의 ‘누구 하나 예외 없이 그렇습니다’도 지시 내용이 흐리므로 ‘모두가 예외 없이 그러했습니다’로 다듬는 것이 낫습니다.
  terminology: ‘개들’과 ‘목자들’은 해석적 직함으로 바꾸지 않고 유지하는 것이 적절합니다. עַזֵּי נֶפֶשׁ은 문맥상 욕망의 탐욕성과 만족할 줄 모름을 가리키므로 ‘탐욕이 강하여’가 자연스럽습니다. בֶּצַע는 여기서 ‘이익’으로 두되, ‘부당한’이나 ‘사리사욕’처럼 원문보다 구체화하지 않았습니다.
