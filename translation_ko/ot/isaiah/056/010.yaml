reference: Isaiah 56:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
  footnotes:
  - marker: a
    text: Or 'muttering' for 'dreaming' (הֹזִים); the Hebrew term is rare and contextually difficult. The main text follows the sense suggested by the surrounding sleep imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 파수꾼들은 모두 눈이 멀어 아무것도 알지 못합니다. 그들은 모두 소리를 내지 못하는 개들이어서 짖을 수 없습니다. 그들은 꿈을 꾸며 누워 있고, 잠자기를 좋아합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֹזִים은 희귀어로 문맥에 따라 ‘꿈꾸는 자들’ 또는 ‘중얼거리는 자들’로도 이해될 수 있습니다. 본문은 뒤따르는 ‘누워 있음’과 ‘잠자기를 좋아함’의 이미지에 따라 ‘꿈을 꾸며’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  english_pob_choice: His watchmen
  chosen_korean: 그의 파수꾼들은
  alternatives_korean:
  - 파수꾼들은
  - 감시자들은
  - 보초들은
  lexicon: HALOT
  rationale: 문맥상 경계와 경고의 책임을 맡은 자들을 가리키므로 ‘파수꾼들’이 가장 자연스럽고, 소유격은 주어가 아닌 대상의 소속을 반영해 ‘그의’로 옮겼습니다.
- source_word: עִוְרִים
  english_pob_choice: blind
  chosen_korean: 눈이 멀었습니다
  alternatives_korean:
  - 맹인입니다
  - 눈먼 자들입니다
  - 눈이 멀어 있습니다
  lexicon: HALOT
  rationale: 직역적 형용사보다 한국어에서 상태를 자연스럽게 드러내는 표현을 택해, 예언적 비판의 구체성을 유지했습니다.
- source_word: כְּלָבִים אִלְּמִים
  english_pob_choice: mute dogs
  chosen_korean: 벙어리 개들로서
  alternatives_korean:
  - 말 못하는 개들로서
  - 잠잠한 개들로서
  - 입이 막힌 개들로서
  lexicon: HALOT
  rationale: ‘개’의 모욕적 이미지를 살리되, 현대 한국어에서 ‘벙어리’가 사람에게는 피해야 할 수 있어도 관용적 형용사로서의 강한 무력함을 드러내는 쪽을 택했습니다.
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  english_pob_choice: unable to bark
  chosen_korean: 짖을 수 없으며
  alternatives_korean:
  - 짖지 못하며
  - 짖을 능력이 없으며
  lexicon: HALOT
  rationale: 개 비유의 핵심 동작을 명료하게 유지하면서, 앞 절과 병렬되는 문장 흐름에 맞게 옮겼습니다.
- source_word: הֹזִים שֹׁכְבִים אֹהֲבֵי לָנוּם
  english_pob_choice: dreamers, lying down, loving to slumber
  chosen_korean: 꿈꾸고 누워 있으며, 졸음을 사랑합니다
  alternatives_korean:
  - 꿈꾸는 자들, 누워 있으며, 졸기를 사랑합니다
  - 꿈꾸며 누워 있고, 졸기를 좋아합니다
  - 몽상하고 누워 있으며, 졸음을 사랑합니다
  lexicon: HALOT
  rationale: 희귀한 הֹזִים은 문맥상 졸음과 무기력의 연속을 이루므로 ‘꿈꾸고’로 살렸고, ‘오히려 자기를 지키지 못하는 나태함’의 열거를 그대로 드러내도록 했습니다.
theological_decisions:
- issue: 예언자적 조롱의 강도와 비유적 폭력성
  chosen_reading: ‘벙어리 개들’, ‘짖을 수 없으며’라는 직설적 이미지를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘말 못하는 개들’로 순화
  - ‘잠잠한 개들’로 완화
  rationale: 본문은 지도자들의 무능을 날카롭게 고발하는 조롱이므로, 한국어에서도 그 공격성과 상징적 불신임을 약화시키지 않는 것이 स्रोत 충실성에 부합합니다.
  doctrine_reference: 예언서의 심판/책망 언어에 대한 직역 보존 원칙
