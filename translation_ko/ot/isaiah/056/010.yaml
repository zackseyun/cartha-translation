  source_fidelity: 전반적으로 히브리어의 병렬 구조와 파수꾼/개 비유, 그리고 הֹזִים의 불확실성을 잘 반영합니다. 다만 אִלְּמִים은 개들이 짖지 못하는 무능을 가리키므로, 현대 한국어에서 장애 비하 표현으로 널리 인식되는 ‘벙어리’를 피하면서도 그 무능의 이미지를 보존하는 편이 더 적절합니다.
