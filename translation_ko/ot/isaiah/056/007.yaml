  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
  footnotes:
  - marker: a
    text: Or 'for all nations.' The Hebrew עַמִּים can denote peoples or nations; 'peoples' was chosen to preserve the inclusive ethnic scope in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 내 거룩한 산으로 데려가고, 내 기도하는 집에서 그들을 기쁘게 하겠습니다. 그들의 번제와 그들의 제물은 내 제단에서 기쁘게 받아들여질 것이니, 이는 내 집이 모든 백성을 위한 기도의 집이라 불릴 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 עַמִּים은 ‘백성들’ 또는 ‘민족들’로도 옮길 수 있습니다. 여기서는 문맥의 포괄성을 살려 ‘백성’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  english_pob_choice: I will bring them
  chosen_korean: 나는 그들을 데려가고
  alternatives_korean:
  - 나는 그들을 데려오고
  - 나는 그들을 이끌고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서도 한국어에서는 목적지로 이동시키는 동작을 자연스럽게 풀어 옮겼습니다. “데려가고”는 하나님의 주도적 행위를 간결하게 드러냅니다.
- source_word: הַר קָדְשִׁי
  english_pob_choice: my holy mountain
  chosen_korean: 내 거룩한 산
  alternatives_korean:
  - 내 성스러운 산
  - 내 거룩한 산으로
  lexicon: HALOT
  rationale: “거룩한 산”은 시온/성전 산의 성소적 이미지를 직접 보존합니다. 영어 POB의 “holy mountain”을 따라 과도한 해석을 피했습니다.
- source_word: בְּבֵית תְּפִלָּתִי
  english_pob_choice: in my house of prayer
  chosen_korean: 내 기도하는 집에서
  alternatives_korean:
  - 내 기도의 집에서
  - 내 기도 집에서
  lexicon: HALOT
  rationale: 히브리어는 직역하면 “내 기도의 집”이지만, 한국어에서는 “기도하는 집”이 더 자연스럽고 그 장소의 기능을 분명히 드러냅니다. 예배 일반보다 기도의 장소라는 초점을 유지했습니다.
- source_word: לְכָל הָעַמִּים
  english_pob_choice: for all peoples
  chosen_korean: 모든 백성을 위한
  alternatives_korean:
  - 모든 민족을 위한
  - 모든 백성들에게
  lexicon: HALOT
  rationale: עַמִּים의 넓은 집단적 의미를 살려 “백성”으로 옮겼습니다. “민족”보다 공동체적·인적 범위를 넓게 보존하며, 영문 POB의 inclusive scope를 따릅니다.
theological_decisions:
- issue: ‘기쁘게 하겠습니다’의 주체와 의미
  chosen_reading: 하나님이 그들을 기쁘게 하시는 것과, 그들이 그분의 집에서 기쁨을 누리는 것을 함께 반영했습니다.
  alternative_readings:
  - 내가 그들로 기뻐하게 하겠습니다
  - 내가 그들을 즐겁게 하겠습니다
  rationale: שׂמח의 사역적 의미는 하나님이 기쁨을 주시는 행위입니다. 한국어로는 “기쁘게 하겠습니다”가 단순 정서보다 하나님이 예배 공동체를 환대하고 즐거움을 주시는 뜻을 가장 자연스럽게 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 제사와 제단이 ‘기쁘게 받아들여질’ 상태
  chosen_reading: 제물의 수용 가능성을 하나님 앞에서의 호의적 গ্রহণ으로 옮겼습니다.
  alternative_readings:
  - 받아들여질 것입니다
  - 기쁘게 여겨질 것입니다
  rationale: לְרָצוֹן은 제의적 문맥에서 ‘받아들여짐/기쁨을 얻음’의 의미를 가집니다. “기쁘게 받아들여질”은 수용성과 호의를 함께 보여 주며, 제사 규례의 언어를 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §§1, 6
