  to: 내가 그들을 나의 거룩한 산으로 데려가고, 나의 기도의 집에서 그들을 기쁘게 하겠습니다. 그들의 번제와 희생 제물은 나의 제단 위에서 받아들여질 것입니다. 나의 집은 모든 백성을 위한 기도의 집이라 불릴 것이기 때문입니다.[a]
  rationale: 안전한 문법·용어 수정만 했습니다. ‘나의 기도의 집’으로 히브리어 소유격과 명사구를 보존하고, ‘제단 위’로 עַל의 의미를 반영했으며, זְבָחִים을 ‘희생 제물’로 명료화했습니다. עַמִּים의 ‘백성/민족’ 범위는 각주로 유지하여 논쟁 가능한 어휘적 폭을 보존했습니다.
