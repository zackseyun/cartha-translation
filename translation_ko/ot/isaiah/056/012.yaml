  edition: WLC
  text: אֵתָ֥יוּ אֶקְחָה יַ֖יִן וְ/נִסְבְּאָ֣ה שֵׁכָ֑ר וְ/הָיָ֤ה כָ/זֶה֙ י֣וֹם מָחָ֔ר גָּד֖וֹל יֶ֥תֶר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
  footnotes:
  - marker: a
    text: Or 'and let us drink our fill of strong drink'; the Hebrew verb can emphasize being filled or satiated, with drunken excess implied by context.
    reason: lexical_alternative
  - marker: b
    text: Or 'and tomorrow will be like today, even greater—much more so.' The final Hebrew phrase intensifies the boast about tomorrow's abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: “오라, 내가 포도주를 가져오고 우리가 독주로 배부르자. 내일은 이 날과 같을 것이고, 훨씬 더 크고 풍성할 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 포도주를 가져오고 우리가 독주를 실컷 마시자”로도 옮길 수 있습니다. 히브리어 동사는 ‘배부르다/만족하다’의 뉘앙스를 가질 수 있으나, 문맥상 과음의 뜻이 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내일은 이 날과 같을 것이고, 더욱 더 크고 훨씬 풍성할 것이다”로도 옮길 수 있습니다. 마지막 히브리어 구는 내일의 풍성함을 강조하는 중첩 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  english_pob_choice: Come
  chosen_korean: “오라”
  alternatives_korean:
  - “이리 오라”
  - “오너라”
  lexicon: HALOT
  rationale: 무리에게 던지는 초청·선동의 감탄사를 한국어에서도 짧고 직접적으로 살리기 위해 “오라”를 택했습니다.
- source_word: אֶקְחָה
  english_pob_choice: let me get
  chosen_korean: “내가 ... 가져오고”
