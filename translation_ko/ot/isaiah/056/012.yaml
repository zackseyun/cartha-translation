  - “내가 ... 취하고”
  - “내가 ... 가져가고”
  lexicon: HALOT
  rationale: לקח의 행위성을 살리되, 술자리에 맞는 자연스러운 한국어로는 “가져오다”가 가장 직접적입니다.
- source_word: וְנִסְבְּאָה
  english_pob_choice: and let us fill ourselves
  chosen_korean: “우리가 ... 배부르자”
  alternatives_korean:
  - “우리가 ... 실컷 마시자”
  - “우리가 ... 흠뻑 마시자”
  lexicon: HALOT
  rationale: סבא의 ‘배부름/만족함’ 이미지를 유지하면서도, 문맥상 음주 과잉이 드러나도록 “배부르자”로 옮겼습니다.
- source_word: שֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: “독주”
  alternatives_korean:
  - “독한 술”
  - “술”
  lexicon: HALOT
  rationale: יין과 구별되는 강한 발효주를 가리키므로, 한국어에서도 구분이 선명한 “독주”가 적절합니다.
- source_word: יָהְיָה כָזֶה יוֹם מָחָר גָּדוֹל יֶתֶר מְאֹד
  english_pob_choice: tomorrow will be like this day, great beyond measure
  chosen_korean: “내일은 이 날과 같을 것이고, 훨씬 더 크고 풍성할 것이다”
  alternatives_korean:
  - “내일도 이 날 같고, 훨씬 더 클 것이다”
  - “내일은 오늘과 같고, 더욱더 عظ대할 것이다”
  lexicon: HALOT
  rationale: 비교구문과 과장된 자찬의 뉘앙스를 살리기 위해 “같을 것이고”와 “훨씬 더 크고 풍성할 것이다”로 대응했습니다.
theological_decisions:
- issue: 음주 초청의 공격적·방탕한 어조
  chosen_reading: 직설적 초청 문장으로 유지하되, 과장과 향락의 분위기가 드러나도록 번역했습니다.
  alternative_readings:
  - 완곡하게 완화된 표현
  - 도덕적 판단을 덧붙인 해설형 번역
  rationale: 본문은 단순한 술 권유가 아니라 종말을 무시하는 방탕한 자기확신을 드러내므로, 그 어조를 약화시키지 않는 것이 본문의 의미를 보존합니다.
  doctrine_reference: 본문 문맥의 예언적 책망(사 56장 전체의 경고 문맥)
