theological_decisions:
- issue: 음주 초청의 공격적·방탕한 어조
  chosen_reading: 직설적 초청 문장으로 유지하되, 과장과 향락의 분위기가 드러나도록 번역했습니다.
  alternative_readings:
  - 완곡하게 완화된 표현
  - 도덕적 판단을 덧붙인 해설형 번역
  rationale: 본문은 단순한 술 권유가 아니라 종말을 무시하는 방탕한 자기확신을 드러내므로, 그 어조를 약화시키지 않는 것이 본문의 의미를 보존합니다.
  doctrine_reference: 본문 문맥의 예언적 책망(사 56장 전체의 경고 문맥)
