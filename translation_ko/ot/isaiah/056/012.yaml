revisions:
- from: “오라, 내가 포도주를 가져오고 우리가 독주로 배부르자. 내일은 이 날과 같을 것이고, 훨씬 더 크고 풍성할 것이다.”[a][b]
  to: “자, 내가 포도주를 가져오겠다. 우리가 독주를 실컷 마시자.[a] 내일도 오늘과 같고, 훨씬 더 대단할 것이다.”[b]
  rationale: 직접화법의 선동적이고 향락적인 어조는 유지하되, 한국어에서 어색한 직역을 자연스러운 음주 권유로 다듬었습니다. 마지막 절은 원문의 비교적·과장적 표현을 보존하기 위해 ‘풍성하다’라는 구체적 의미를 덧붙이지 않고 ‘훨씬 더 대단하다’로 옮겼습니다. 각주 표지는 해당 어구 뒤에 배치했습니다.
