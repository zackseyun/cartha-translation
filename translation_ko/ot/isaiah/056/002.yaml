id: ISA.56.2
reference: Isaiah 56:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: ko
  text: 복 있는 사람은 이런 일을 하는 사람이며, 인자도 그것을 굳게 지키는 사람입니다. 그는 안식일을 더럽히지 않고 지키며, 자기 손을 모든 악을 행하지 못하게 지킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘복되다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵ֤י אֱנוֹשׁ֙
  english_pob_choice: Blessed is the man
  chosen_korean: 복 있는 사람은
  alternatives_korean:
  - 복되다 사람은
  - 행복한 사람은
  lexicon: אַשְׁרֵי
  rationale: אַשְׁרֵי의 축복 선언을 한국어 관용과 현대 문체에 맞게 ‘복 있는’으로 옮겨, 상태 진술과 축복의 뉘앙스를 함께 살렸습니다.
- source_word: בֶן אָדָ֖ם
  english_pob_choice: the son of man
  chosen_korean: 인자도
  alternatives_korean:
  - 사람의 아들도
  - 인간의 아들도
  lexicon: בן־אדם
  rationale: 여기서는 일반적인 ‘사람’과 평행을 이루는 표현이지만, 히브리어 관용을 살려 ‘인자’로 옮겼습니다.
- source_word: יַחֲזִ֣יק בָּ֑/הּ
  english_pob_choice: who holds fast to it
  chosen_korean: 그것을 굳게 지키는 사람입니다
  alternatives_korean:
  - 그것을 붙드는 사람입니다
  - 그것을 굳게 붙드는 사람입니다
  lexicon: חזק
  rationale: ‘붙들다’의 물리적 이미지를 유지할 수 있지만, 문맥상 준수·충실함의 의미가 핵심이므로 ‘굳게 지키다’로 자연스럽게 표현했습니다.
- source_word: שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ
  english_pob_choice: keeping the Sabbath from profaning it
  chosen_korean: 안식일을 더럽히지 않고 지키며
  alternatives_korean:
  - 안식일을 속되게 하지 않고 지키며
  - 안식일을 더럽히는 일을 막으며
  lexicon: שמר + שבת + חלל
  rationale: ‘더럽히다’는 חלל의 성격을 직접 반영하면서도, 안식일을 ‘지키다’는 שמר의 기본 의미를 함께 살렸습니다.
- source_word: וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע
  english_pob_choice: and keeping his hand from doing any evil
  chosen_korean: 자기 손을 모든 악을 행하지 못하게 지킵니다
  alternatives_korean:
  - 자기 손이 어떤 악도 행하지 못하게 지킵니다
  - 자기 손을 악한 일에서 지킵니다
  lexicon: שמר + יד + רע
  rationale: 히브리어의 ‘손’과 ‘행하다’ 이미지를 보존하되, 한국어로는 행위의 금지를 분명히 드러내기 위해 ‘못하게 지킨다’로 옮겼습니다.
theological_decisions:
- issue: ‘인자’의 일반적 인간 표현과 전통적 메시아 칭호의 구분
  chosen_reading: 여기서는 메시아 칭호가 아니라 히브리어 평행법 안의 인간 일반 지시로 ‘인자’만 유지했습니다.
  alternative_readings:
  - 사람의 아들
  - 인간
  rationale: 본문의 평행 구조가 ‘사람’과 ‘인자’를 나란히 놓고 있어, 칭호화하지 않고 관용 표현으로 읽는 것이 원문 기능에 더 충실합니다.
  doctrine_reference: 시적 평행법/어휘 기능
