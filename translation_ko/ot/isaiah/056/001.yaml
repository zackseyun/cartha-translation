id: ISA.56.1
reference: Isaiah 56:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
  footnotes:
  - marker: a
    text: Or 'my deliverance is near to come.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my justice' or 'my vindication' to be revealed.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "정의를 지키고, 의를 행하십시오. 이는 나의 구원이 곧 오기 때문이며, 나의 의가 나타날 것이기 때문입니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB의 원칙에 따라 언약 이름을 음역형으로 드러내어 본문 화자의 직접 발화를 보존했습니다.
- source_word: שִׁמְרוּ
  english_pob_choice: Keep
  chosen_korean: 지키고
  alternatives_korean:
  - keep
  - 준수하고
  - 지켜
  lexicon: HALOT
  rationale: מִשְׁפָּט과 자연스럽게 결합되는 한국어로, 추상적 대상을 지속적으로 보존하고 실행하는 뉘앙스를 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 판결
  - 공의
  - 심판
  lexicon: HALOT
  rationale: 여기서는 법정 판결보다 윤리적 질서와 올바름을 가리키므로, 한국어로는 ‘정의’가 가장 자연스럽습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 공의
  - 올바름
  lexicon: HALOT
  rationale: 앞의 מִשְׁפָּט과 구별되는 두 번째 윤리 용어를 살리면서, 이사야서의 신학적 무게를 반영해 ‘의’로 옮겼습니다.
- source_word: יְשׁוּעָתִי
  english_pob_choice: my salvation
  chosen_korean: 나의 구원
  alternatives_korean:
  - 나의 구출
  - 나의 건짐
  lexicon: HALOT
  rationale: 예언 문맥에서 하나님의 구원 행위를 넓게 가리키므로, ‘구원’이 의미 범위를 가장 잘 보존합니다.
- source_word: וְצִדְקָתִי
  english_pob_choice: and my righteousness
  chosen_korean: 나의 의
  alternatives_korean:
  - 나의 정의
  - 나의 공의
  - 나의 의로움
  lexicon: HALOT
  rationale: 앞의 צְדָקָה와 어휘 대응을 유지하면서, 하나님의 성품과 구원적 행위를 함께 열어 두는 표현으로 ‘나의 의’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 여호와 신명(יהוה)을 직접 사용하므로, 본문 감춰짐을 줄이고 언약 이름을 드러내는 POB 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: משפט / צדקה의 구분
  chosen_reading: 정의를 지키고, 의를 행하십시오
  alternative_readings:
  - 판결을 지키고, 의를 행하십시오
  - 공의를 지키고, 정의를 행하십시오
  rationale: 두 히브리어 용어의 구별을 유지하되, 한국어에서는 ‘정의’와 ‘의’가 가장 자연스럽게 대칭을 이루어 본문의 윤리적 촉구를 선명하게 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
- issue: 하나님의 צדקה의 의미 범위
  chosen_reading: 나의 의가 나타날 것입니다
  alternative_readings:
  - 나의 정의가 나타날 것입니다
  - 나의 공의가 드러날 것입니다
  - 나의 의로움이 드러날 것입니다
  rationale: 이사야에서 하나님의 צדקה는 성품, 구원 행위, 변호/입증을 함께 포함할 수 있으므로, 단일 의미로 좁히지 않는 ‘의’와 ‘나타날 것이다’를 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
