  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
  footnotes:
  - marker: a
    text: Or 'I will gather yet others to them, besides those already gathered.' The Hebrew suffixes are singular, but some understand the sense collectively and render the reference in plural English.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the Lord GOD' represents אֲדֹנָי יְהוָה, literally 'Lord YHWH.' English convention uses 'GOD' here to signal the divine name without saying 'Lord LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼의 선언입니다[a]. 그는 이스라엘의 흩어진 자들을 모으시는 분이십니다. 나는 아직도 그에게 더 모을 것이며, 이미 모인 자들에 더하여 모을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 אֲדֹנָי יְהוָה로, 직역하면 ‘주 야훼’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 접미사는 단수이지만, 어떤 이들은 집합적 의미로 이해하여 ‘그들에게’처럼 복수로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  english_pob_choice: The declaration of
  chosen_korean: 선언입니다
  alternatives_korean:
  - 말씀입니다
  - 선언하십니다
  - 선포입니다
  lexicon: HALOT
  rationale: 명사형의 엄숙한 신적 선포를 살리되, 한국어로는 문두 절을 자연스럽게 끝맺는 형태가 적절합니다.
- source_word: אֲדֹנָי יְהוָה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  - 주 야훼 하나님
  lexicon: HALOT
  rationale: 아도나이+יהוה의 결합을 반영해 ‘주’와 고유명 ‘야훼’를 함께 두어, 영어 POB가 신명 표지를 보존하려는 의도를 한국어에서도 드러냅니다.
- source_word: נִדְחֵי יִשְׂרָאֵל
  english_pob_choice: the outcasts of Israel
  chosen_korean: 이스라엘의 흩어진 자들
  alternatives_korean:
  - 이스라엘의 쫓겨난 자들
  - 이스라엘의 버림받은 자들
  - 이스라엘의 추방된 자들
  lexicon: HALOT
  rationale: נדח의 ‘밀려 흩어짐/쫓김’ 의미를 살리면서, 예언서 문맥에서 자연스럽고 과도하게 해석적이지 않은 표현으로 옮겼습니다.
- source_word: עָלָיו / לְנִקְבָּצָיו
  english_pob_choice: to him ... besides those already gathered to him
  chosen_korean: 그에게 더 모을 것이며, 이미 모인 자들에 더하여 모을 것입니다
  alternatives_korean:
  - 그들에게 더 모을 것이며, 이미 모인 자들에 더하여 모을 것입니다
  - 그에게 더 모아, 이미 모인 자들 위에 더할 것입니다
  - 그에게 더 모을 것이며, 이미 모여 있는 자들 외에 더 모을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 접미를 살려 ‘그에게’로 두고, 추가적 수집의 의미를 ‘더하여’로 풀어 주어 집합적 단수와 덧붙임의 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  - 주님
  rationale: 프로젝트 기본값에 따라 언약 이름은 학술적 음역인 ‘야훼’로 옮겨, 본문의 신명 표지를 가립니다 않고 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 단수 접미사의 집합적 의미
  chosen_reading: 이스라엘을 가리키는 집합적 단수로 유지
  alternative_readings:
  - 복수 의미로 평탄화
  - 시온/땅을 지시하는 것으로 해석
  rationale: ‘그에게/이미 모인 자들에’로 옮겨 히브리어의 단수 접미를 유지했고, 문법적 난점을 미리 해소하지 않고 본문이 허용하는 집합적 인격화를 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
