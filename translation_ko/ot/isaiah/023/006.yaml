source:
  edition: WLC
  text: עִבְר֖וּ תַּרְשִׁ֑ישָׁ/ה הֵילִ֖ילוּ יֹ֥שְׁבֵי אִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/006.yaml
  text: Cross over to Tarshish; wail[a], inhabitants of the coastland.
  footnotes:
  - marker: a
    text: Or 'island' for 'coastland'; the Hebrew term can refer to an island or a maritime coastland/region.
    reason: lexical_alternative
translation:
  language: ko
  text: '「타르시스로 건너가라.」

    해안 지방에 사는 자들아, 울부짖어라.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬’. 히브리어 אִי는 ‘섬’과 ‘해안 지방/해상 지역’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ
  english_pob_choice: Cross over
  chosen_korean: 건너가라
  alternatives_korean:
  - 건너라
  - 건너편으로 가라
  lexicon: HALOT
  rationale: עבר의 명령형 복수로서 ‘건너가다/가로지르다’의 이동 감각을 살리되, 현대 한국어에서 자연스럽고 강한 명령형으로 옮겼습니다.
- source_word: תַּרְשִׁישָׁה
  english_pob_choice: to Tarshish
  chosen_korean: 타르시스로
  alternatives_korean:
  - 타르시스 쪽으로
  - 타르시스에게
  lexicon: HALOT
  rationale: 방향을 나타내는 ה-he가 붙은 지명이라 목적지 방향을 드러내는 조사 ‘-로’로 처리했습니다.
- source_word: הֵילִילוּ
  english_pob_choice: wail
  chosen_korean: 울부짖어라
  alternatives_korean:
  - 통곡하라
  - 애곡하라
  lexicon: HALOT
  rationale: ילל의 강한 애통의 외침을 담되, 예언 문맥의 긴박함을 현대어로 자연스럽게 살렸습니다.
- source_word: יֹשְׁבֵי אִי
  english_pob_choice: inhabitants of the coastland
  chosen_korean: 해안 지방에 사는 자들
  alternatives_korean:
  - 해안 지방의 주민들
  - 섬에 사는 자들
  lexicon: HALOT
  rationale: אִי의 의미 범위가 ‘섬’과 ‘해안 지방’ 사이에 있어, 문맥상 해상권 전체를 가리키는 포괄적 표현을 택했습니다.
theological_decisions:
- issue: אִי의 번역 범위
  chosen_reading: ‘해안 지방’으로 옮겨, 단일한 섬이 아니라 해상 지역 전체를 가리키는 예언적 호칭으로 읽었습니다.
  alternative_readings:
  - ‘섬’으로 직역
  - ‘해안’으로 축약
  rationale: 이사야의 해양 열방 맥락에서 אִי는 단순 지리명보다 해안/해상 지역을 포괄하는 집합적 표현으로 기능하는 경우가 많습니다.
  doctrine_reference: 예언서 지리 은유의 문맥적 판독
