  source_fidelity: 개정이 필요합니다. 히브리어 מִלְאוּךְ는 3인칭 남성 복수 완료형에 여성 단수 목적어 접미사가 결합한 형태로, ‘그들이 너를 채웠다’라는 뜻입니다. 따라서 סֹחֵר צִידוֹן은 집합적 단수이지만 한국어에서는 복수 동사와의 일치를 드러내어 ‘시돈의 상인들이’로 옮기는 것이 원문에 더 충실합니다. 목적어는 여성 단수이므로 ‘너희’를 유지하기보다 ‘너’를 사용해 원문의 수 일치를 보존했습니다.
  naturalness: ‘「침묵하십시오」, 해안 지역의 주민들아’는 인용부호와 쉼표가 부자연스럽고, 합쇼체 명령과 ‘-들아’ 호격의 결합도 다소 불균형합니다. ‘해안 지역 주민들이여, 침묵하십시오.’가 현대적인 정중 문체와 예언적 호격에 자연스럽습니다. ‘바다를 건너 다니는 자가’보다 ‘바다를 건너는 시돈의 상인들이’가 수식 관계도 분명합니다.
