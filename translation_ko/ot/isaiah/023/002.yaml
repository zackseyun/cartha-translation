  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
  footnotes:
  - marker: a
    text: Or 'island'; Hebrew אִי can refer to an island or a coastal region.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew may also be understood more economically: ''the merchant of Sidon, crossing the sea, supplied you'' or ''was your revenue.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 「침묵하십시오」, 해안 지역의 주민들아. 시돈의 상인, 바다를 건너 다니는 자가 너희를 채웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִי는 섬이나 해안 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 더 경제적으로는 ‘시돈의 상인, 바다를 건너 다니는 자가 너희의 공급원이 되었다’ 또는 ‘너희의 소득이 되었다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּ֖מּוּ
  english_pob_choice: Be silent
  chosen_korean: 「침묵하십시오」
  alternatives_korean:
  - 잠잠하십시오
  - 조용히 하십시오
  - 침묵하라
  lexicon: HALOT
  rationale: 복수 명령형의 강한 정적 요구를 현대 합쇼체로 살리기 위해 ‘침묵하십시오’로 옮겼습니다. 이는 단순한 ‘조용히’보다 심판 앞의 경외·충격을 더 분명히 드러냅니다.
- source_word: יֹ֣שְׁבֵי אִ֑י
  english_pob_choice: inhabitants of the coastland
  chosen_korean: 해안 지역의 주민들아
  alternatives_korean:
  - 섬의 주민들아
  - 해안의 거주자들아
  - 섬 주민들아
  lexicon: HALOT
  rationale: אִי는 문자적 ‘섬’일 수도 있지만 예언문맥에서 해안/해상 지역을 포함할 수 있어, 페니키아 해상권에 맞는 ‘해안 지역’으로 넓게 처리했습니다. संबोधित 대상은 호격으로 자연스럽게 ‘주민들아’로 옮겼습니다.
- source_word: סֹחֵ֥ר צִיד֛וֹן עֹבֵ֥ר יָ֖ם
  english_pob_choice: the merchant of Sidon, crossing the sea
  chosen_korean: 시돈의 상인, 바다를 건너 다니는 자
  alternatives_korean:
  - 시돈의 상인, 바다를 건너는 자
  - 바다를 오가는 시돈의 상인
  - 시돈의 상인, 바다를 건너는 사람
  lexicon: HALOT
  rationale: 영어 POB와 같이 단수 표현을 유지해 ‘시돈의 상인’으로 옮겼고, עֹבֵר יָם의 진행·상태적 뉘앙스를 ‘바다를 건너 다니는 자’로 풀어 해상 무역의 지속성을 살렸습니다.
- source_word: מִלְאֽוּ/ךְ
  english_pob_choice: has filled you
  chosen_korean: 너희를 채웠습니다
  alternatives_korean:
  - 너희를 가득 채웠습니다
  - 너희의 소득이었습니다
  - 너희를 채워 주었습니다
  lexicon: HALOT
  rationale: 2인칭 여성 단수 목적어를 현대 한국어의 복수 호칭 ‘너희’를 통해 자연스럽게 처리했습니다. 본문 동사형의 직접적 의미를 살려 경제적 재해석보다 ‘채우다’의 서술을 우선했습니다.
