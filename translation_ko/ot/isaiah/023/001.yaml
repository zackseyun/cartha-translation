id: ISA.23.1
reference: Isaiah 23:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א צֹ֑ר הֵילִ֣ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ כִּֽי שֻׁדַּ֤ד מִ/בַּ֨יִת֙ מִ/בּ֔וֹא מֵ/אֶ֥רֶץ כִּתִּ֖ים נִגְלָה לָֽ/מוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
  footnotes:
  - marker: a
    text: Or 'without house or entry'; the Hebrew likely means that Tyre is so devastated that there is no house and no harbor/access left.
    reason: lexical_alternative
  - marker: b
    text: Kittim likely refers to Cyprus or nearby western coastlands.
    reason: cultural_note
translation:
  language: ko
  text: 두로에 관한 경고입니다. 「울부짖어라, 다시스의 배들아. 그것이 무너져, 집도 없고 들어갈 곳도 없기 때문이다. 깃딤 땅에서 그 소식이 그들에게 전해졌습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: כִּתִּים 은 보통 키프로스 또는 그 주변의 서방 해안 지역을 가리키는 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 경고
  alternatives_korean:
  - 예언
  - 신탁
  lexicon: HALOT
  rationale: 예언서 제목에서 מַשָּׂא 는 심판적 선포를 여는 표지이므로, 문맥상 무게를 살리면서도 현대 한국어에서 자연스러운 「경고」로 옮겼습니다.
- source_word: צֹר
  english_pob_choice: Tyre
  chosen_korean: 두로
  alternatives_korean:
  - 티레
  - 두르
  lexicon: HALOT
  rationale: 성경에서 널리 정착된 한국어 지명인 「두로」를 사용해 독자성을 유지했습니다.
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖어라
  alternatives_korean:
  - 통곡하라
  - 애곡하라
  lexicon: HALOT
  rationale: 복수 명령형의 강한 애도·절규를 현대 한국어에서 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: מִבַּיִת מִבּוֹא
  english_pob_choice: without house or harbor
  chosen_korean: 집도 없고 들어갈 곳도 없기
  alternatives_korean:
  - 집도 없고 항구도 없기
  - 집도 없고 출입구도 없기
  lexicon: HALOT
  rationale: 여기서 מִן 은 결핍을 나타내므로 「없고」로 풀어, 도시가 완전히 폐허가 되어 주거와 접근 지점이 사라졌다는 뜻을 살렸습니다.
- source_word: מֵאֶרֶץ כִּתִּים
  english_pob_choice: From the land of Kittim
  chosen_korean: 깃딤 땅에서
  alternatives_korean:
  - 깃딤에서
  - 키팀 땅에서
  lexicon: HALOT
  rationale: כִּתִּים 은 역사·지리적 고유명사이므로 음역을 유지했고, POB의 문화주석을 반영해 본문은 넓은 지칭을 남겼습니다.
- source_word: נִגְלָה לָמוֹ
  english_pob_choice: it is revealed to them
  chosen_korean: 그 소식이 그들에게 전해졌습니다
  alternatives_korean:
  - 그것이 그들에게 드러났습니다
  - 그것이 그들에게 알려졌습니다
  lexicon: HALOT
  rationale: 문맥상 선박/상인들에게 전달된 소식을 가리키므로, 한국어에서 자연스러운 전달 동사로 구체화하되 원문의 수동적 ‘알려짐’ 의미를 유지했습니다.
theological_decisions:
- issue: 두로에 대한 경고의 장르 표지
  chosen_reading: 예언적 심판 선포로 읽고, 제목의 מַשָּׂא 를 그에 맞게 번역했습니다.
  alternative_readings:
  - 짐
  - 선고
  rationale: 본문은 단순한 무게감이 아니라 심판 예언의 서두이므로, 독자가 기능을 즉시 이해하도록 표지 성격을 반영했습니다.
  doctrine_reference: 예언서 서두의 장르 인식
- issue: 호출 대상의 직접 인용
  chosen_reading: 『울부짖어라』로 직접 호명하는 명령형을 살렸습니다.
  alternative_readings:
  - 울부짖습니다
  - 울부짖으십시오
  rationale: 히브리어 복수 명령형이 청중에게 즉각적인 반응을 요구하므로, 직설적 명령을 유지하는 것이 본문의 긴장감을 보존합니다.
  doctrine_reference: 예언적 수사와 청중 반응
