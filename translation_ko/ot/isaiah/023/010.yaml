  text: עִבְרִ֥י אַרְצֵ֖/ךְ כַּ/יְאֹ֑ר בַּת תַּרְשִׁ֕ישׁ אֵ֖ין מֵ֥זַח עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/010.yaml
  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
  footnotes:
  - marker: a
    text: Or 'Pass through your land like the Nile' or 'Spread out over your land like the Nile.' The Hebrew verb can denote crossing or passing through, but the Nile simile suggests overflowing expansion.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word translated 'restraint' may also be understood as 'harbor,' 'barrier,' or 'mooring.' The sense is that Tarshish is no longer held in check.
    reason: lexical_alternative
  - marker: c
    text: Or 'Overflow your land like the Nile'.
    reason: previous_rendering
translation:
  language: ko
  text: 타르시스의 딸이여, 그대의 땅을 나일강처럼[a] 가로지르십시오[c]. 더 이상 제지가 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그대의 땅을 나일강처럼 건너가십시오’ 또는 ‘그대의 땅 위로 나일강처럼 퍼져 나가십시오’로 옮길 수 있습니다. 히브리어 동사는 ‘지나가다/건너가다’를 뜻하지만, 나일강 비유는 범람하듯 퍼지는 이미지를 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 히브리어 מֵזַח는 ‘제지’ 외에도 ‘항구’, ‘장벽’, 또는 ‘계류 시설’로 이해될 수 있습니다. 여기서는 타르시스가 더 이상 붙들려 있지 않다는 뜻으로 읽었습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그대의 땅을 나일강처럼 넘쳐 흐르십시오’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: עִבְרִי
  english_pob_choice: Pass through
  chosen_korean: 지나가십시오
  alternatives_korean:
  - 건너가십시오
  - 통과하십시오
  - 넘쳐 흐르십시오
  lexicon: HALOT
  rationale: 히브리어 עבר의 기본 동작인 ‘지나가다/건너가다’를 살리되, 앞뒤의 비유와 어울리도록 자연스러운 명령형으로 옮겼습니다. ‘넘쳐 흐르십시오’는 나일강 비유를 강하게 드러내지만 동사 자체에 해석을 과도하게 더할 수 있어 배제했습니다.
- source_word: כיאור
  english_pob_choice: like the Nile
  chosen_korean: 나일강처럼
  alternatives_korean:
  - 강처럼
  - 나일강 같이
  - 나일처럼
  lexicon: HALOT
  rationale: יאר는 문맥상 나일강을 가리키는 경우가 많으므로, 일반적 ‘강’보다 ‘나일강’이 시적 이미지와 지리적 상징을 더 분명하게 전달합니다.
- source_word: בת תרשיש
  english_pob_choice: daughter of Tarshish
  chosen_korean: 타르시스의 딸이여
  alternatives_korean:
  - 타르시스의 딸
  - 타르시스 사람들아
  - 타르시스여
  lexicon: HALOT
  rationale: 예언시의 의인화된 호칭을 살리기 위해 ‘타르시스의 딸’ 구조를 유지했습니다. 호격을 한국어로 분명히 드러내기 위해 ‘-이여’를 붙였습니다.
- source_word: מזח ... עוד
  english_pob_choice: there is no restraint anymore
  chosen_korean: 더 이상 속박이 없습니다
  alternatives_korean:
  - 더 이상 제어가 없습니다
  - 더 이상 제지가 없습니다
  - 더 이상 억제가 없습니다
  lexicon: HALOT
  rationale: 희귀한 מזח은 ‘제지/구속/매임’ 계열의 의미가 가능하므로, 문맥상 타르시스가 더는 묶여 있지 않다는 뜻을 살려 ‘속박’으로 옮겼습니다. ‘더 이상’은 עוד의 시간적 종결을 자연스럽게 반영합니다.
