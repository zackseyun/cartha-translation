id: ISA.23.3
reference: Isaiah 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/מַ֤יִם רַבִּים֙ זֶ֣רַע שִׁחֹ֔ר קְצִ֥יר יְא֖וֹר תְּבֽוּאָתָ֑/הּ וַ/תְּהִ֖י סְחַ֥ר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
  footnotes:
  - marker: a
    text: Shihor likely refers to the Nile or a branch of it; alternatively, 'the grain of the Nile.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the merchandise/trade of nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 물 위에는 시홀의 곡식, 나일의 수확, 그 수입이 있었습니다. 그리고 그는 나라들의 시장이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시홀은 나일강 또는 그 지류를 가리키는 이름일 가능성이 있습니다. 따라서 ‘시홀의 곡식’은 곧 ‘나일의 곡식’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תְּבוּאָה는 ‘소출, 수확물, 생산물’ 또는 상업적 맥락에서는 ‘수입’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  english_pob_choice: On many waters
  chosen_korean: 많은 물 위에는
  alternatives_korean:
  - 많은 물가에는
  - 많은 물로
  - 많은 물 위에서
  lexicon: HALOT
  rationale: ב + מים רבים는 해상 교역의 광경을 가리키므로, 직역보다 ‘많은 물 위에’가 항해·무역의 이미지를 살리면서도 자연스럽습니다.
- source_word: זֶרַע שִׁחֹר
  english_pob_choice: the grain of Shihor
  chosen_korean: 시홀의 곡식
  alternatives_korean:
  - 시홀의 씨
  - 시홀의 곡물
  - 시홀의 농산물
  lexicon: HALOT
  rationale: זֶרַע는 여기서 파종용 ‘씨’보다 상품성 있는 농산물을 뜻하므로 ‘곡식’이 가장 무난합니다. 고유명사 שִׁחֹר는 음역을 유지했습니다.
- source_word: קְצִיר יְאוֹר תְּבוּאָתָהּ
  english_pob_choice: the harvest of the Nile, her revenue
  chosen_korean: 나일의 수확, 그 수입
  alternatives_korean:
  - 나일의 추수, 그 소출
  - 나일의 수확, 그 생산물
  - 나일의 수확, 그 산출
  lexicon: HALOT
  rationale: יְאֹר는 이집트 문맥에서 나일을 가리키며, תְּבוּאָה는 농산물의 ‘소출/수확물’이지만 상업 문맥에서는 ‘수입’까지 포함하는 경제적 의미가 있어 ‘그 수입’으로 옮겼습니다.
- source_word: סְחַר גּוֹיִם
  english_pob_choice: the merchant of nations
  chosen_korean: 나라들의 시장
  alternatives_korean:
  - 나라들의 무역상
  - 나라들의 상인
  - 나라들의 무역시장
  lexicon: HALOT
  rationale: סחר는 ‘무역, 매매, 상거래’의 뜻이 있어, Tyre의 국제 상업적 기능을 드러내는 ‘시장’이 문맥상 가장 적절합니다. 영어 POB의 ‘merchant’는 기능을 의역한 것으로 보이지만, 히브리어 자체는 장소/기능으로도 읽힐 수 있어 한국어에서는 상업의 중심지를 나타내는 표현을 택했습니다.
theological_decisions:
- issue: 도시를 지시하는 여성형 인칭 처리
  chosen_reading: 문맥상 두로를 가리키는 여성형 서술을 한국어에서도 ‘그’로 받아, 문장 흐름을 자연스럽게 유지했습니다.
  alternative_readings:
  - 그녀
  - 그 도성은
  rationale: 히브리어의 여성형 도시 의인화를 그대로 한국어 인칭대명사로 옮기면 어색할 수 있어, 지시 대상은 유지하되 한국어 자연성을 우선했습니다.
  doctrine_reference: 문체/의인화 처리
