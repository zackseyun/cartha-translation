  source_fidelity: 히브리어 יְעָצָהּ는 완료형이므로 ‘계획하셨습니다’가 적절하며, 두 부정사는 그 계획의 목적을 나타냅니다. 초안의 ‘낮추려 하십니다’는 현재형으로 바뀌어 원문의 완료형과 시제적 결속을 약화합니다. חִלֵּל은 이 문맥에서 ‘욕되게 하다’로 옮기면 심판을 통해 영예를 훼손하는 뜻을 자연스럽게 보존합니다.
  naturalness: ‘온갖 아름다움의 교만’은 한국어에서 ‘모든 아름다움의 교만’보다 자연스럽고, ‘계획하셨습니다 … 하셨습니다’의 목적 구문은 현대 격식체에서 명료합니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
  terminology: ‘만군의 야훼’는 프로젝트의 신명 표기 및 צְבָאוֹת의 번역을 충실히 반영합니다. ‘존귀한 이들’은 נִכְבַּדֵּי의 넓은 의미를 유지하며 특정 계층으로 한정하지 않습니다.
