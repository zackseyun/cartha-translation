id: ISA.23.9
reference: Isaiah 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
  footnotes:
  - marker: a
    text: Or 'has planned this against her,' with the suffix referring specifically to Tyre.
    reason: alternative_reading
  - marker: b
    text: '''All glory'' may also be rendered ''all beauty'' or ''all splendor.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'to abase' or 'to bring low' all the honored ones of the earth.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 그것을 정하셨습니다. 곧 모든 아름다움의 교만을 더럽히고, 땅의 모든 존귀한 이들을 낮추려 하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여성형 접미사는 ‘그녀에게’처럼 두로를 직접 가리키는 말로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: צְבִי는 ‘아름다움’ 외에도 ‘영광’ 또는 ‘화려함/찬란함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: לְהָקֵל은 ‘낮추다’ 외에도 ‘끌어내리다’, ‘천하게 하다’, ‘가볍게 여기다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָא֖וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  lexicon: WLC / HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צבאות는 하나님의 군사적 호칭을 살려 만군으로 옮겼습니다.
- source_word: יְעָצָ֑הּ
  english_pob_choice: has purposed it
  chosen_korean: 그것을 정하셨습니다
  alternatives_korean:
  - 그것을 뜻하셨습니다
  - 그것을 계획하셨습니다
  - 그것을 의도하셨습니다
  lexicon: HALOT
  rationale: יעץ는 여기서 ‘목적하다/정하다’의 뜻이 자연스러우므로, 문맥상 결단의 무게를 살려 ‘정하셨습니다’로 옮겼습니다.
- source_word: כָּל צְבִ֔י
  english_pob_choice: all beauty
  chosen_korean: 모든 아름다움
  alternatives_korean:
  - 모든 영광
  - 모든 splendor
  - 모든 아름다움과 영화
  lexicon: HALOT
  rationale: צבי는 아름다움·화려함·영광의 범위를 가지지만, 문맥의 대조를 살리면서도 POB의 후속 수정 취지에 맞춰 ‘모든 아름다움’으로 옮겼습니다.
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  english_pob_choice: all the honored ones of the earth
  chosen_korean: 땅의 모든 존귀한 이들
  alternatives_korean:
  - 땅의 모든 귀인들
  - 땅의 모든 존귀자들
  - 세상의 모든 존귀한 이들
  lexicon: HALOT
  rationale: נכבדים는 ‘무게 있는/존귀한 이들’이므로, 신분을 과도하게 좁히지 않는 ‘존귀한 이들’로 옮기고 אָרֶץ는 이사야의 범위감에 맞게 ‘땅’으로 살렸습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문의 יְהוָה를 전통적 대치어 ‘주’가 아니라 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 프로젝트의 기본 원칙이 신적 고유명을 보존하는 것이므로, 본문이 하나님의 이름을 가리킬 때는 제목어가 아닌 고유명으로 드러내는 편이 source-direct합니다.
  doctrine_reference: Divine name transparency / Tetragrammaton rendering
- issue: ‘그것’의 지시 대상
  chosen_reading: יְעָצָהּ의 여성형 접미사는 한국어에서 중립적 ‘그것’으로 옮겨, 두로에 대한 선언된 심판/결정을 가리키는 넓은 지시를 유지했습니다.
  alternative_readings:
  - 그녀에게
  - 두로에 대하여 그것을
  rationale: 히브리어의 여성형은 도시 두로를 가리킬 수도 있지만, 한국어에서 인칭화하면 불필요하게 굳어지므로, 오라클 전체를 가리키는 중립적 지시로 보존했습니다.
  doctrine_reference: Preserve documented ambiguity rather than resolve it
