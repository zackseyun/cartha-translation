id: ISA.23.12
reference: Isaiah 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
  footnotes:
  - marker: a
    text: Kittim likely refers to Cyprus, and by extension may evoke western maritime territories.
    reason: cultural_note
  - marker: b
    text: Or “You shall rejoice no more.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “억압받는 시돈의 처녀 딸아, 너는 더 이상 환호하지 않을 것입니다.[a] 일어나 키팀으로[b] 건너가십시오. 거기에서도 너는 쉼을 얻지 못할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 이상 기뻐하지 않을 것입니다.’ 히브리어 표현은 단순한 기쁨보다 격양된 환호나 승리의 기쁨을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 키팀은 일반적으로 키프로스를, 더 넓게는 서쪽의 해상 지역을 가리키는 이름일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  english_pob_choice: You will exult no more
  chosen_korean: 더 이상 기뻐하지 못할 것입니다
  alternatives_korean:
  - 더 이상 즐거워하지 못할 것입니다
  - 더 이상 환호하지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘더 이상 계속해서…하지 않다’는 중단 의미를 한국어의 ‘더 이상 …하지 못할 것입니다’로 자연스럽게 살렸습니다. ‘기뻐하다’는 POB의 exult/rejoice 범위를 무리 없이 반영합니다.
- source_word: הַמְעֻשָּׁקָה
  english_pob_choice: oppressed
  chosen_korean: 억압받는
  alternatives_korean:
  - 압제받는
  - 짓눌린
  lexicon: HALOT
  rationale: 피동 분사형이 가리키는 지속적 억압 상태를 가장 직접적으로 드러내는 말로 ‘억압받는’을 택했습니다.
- source_word: בְּתוּלַת בַּת צִידוֹן
  english_pob_choice: virgin daughter of Sidon
  chosen_korean: 시돈의 딸인 처녀
  alternatives_korean:
  - 시돈의 처녀 딸
  - 시돈의 처녀
  lexicon: HALOT
  rationale: 예언서의 도시 의인화 표현을 유지하되, 한국어 어순상 자연스럽게 ‘시돈의 딸인 처녀’로 옮겼습니다. ‘처녀’는 수사적 이미지와 병행해 보존했습니다.
- source_word: כתיים
  english_pob_choice: Kittim
  chosen_korean: 키팀
  alternatives_korean:
  - 깃팀
  - 기띔
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 본문에서는 지명 해석을 덧붙이지 않았습니다.
- source_word: גַּם שָׁם לֹא יָנוּחַ לָךְ
  english_pob_choice: even there you will find no rest
  chosen_korean: 거기에서도 당신에게는 쉴 곳이 없을 것입니다
  alternatives_korean:
  - 거기에서도 당신은 쉬지 못할 것입니다
  - 거기에서도 당신에게는 안식이 없을 것입니다
  lexicon: HALOT
  rationale: ‘너에게는 쉼이 없다’는 의미를 현대 한국어에서 자연스러운 ‘쉴 곳이 없다’로 전달했습니다. POB의 ‘rest’가 단순 휴식 이상의 피난처 상실을 포함할 수 있어 그 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 의인화된 시돈에 대한 예언적 조롱과 명령의 재현
  chosen_reading: 직접 화법의 명령형과 조롱조를 그대로 살려, 시돈이 실제 인격체처럼 불려 가는 예언적 수사를 유지했습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘시돈은 더 이상 기뻐할 수 없다’로 바꾸는 방식
  - 의인화를 약화해 단순 도시 진술로 바꾸는 방식
  rationale: 본문은 도시를 ‘처녀 딸’로 부르며 명령하는 예언적 풍자를 사용하므로, 이를 약화하지 않고 독자가 원문의 긴장감을 느끼게 하는 것이 본문 충실성에 더 가깝습니다.
  doctrine_reference: 예언서의 수사와 의인화 표현 보존
