    rationale: לֹא יָנוּחַ לָךְ는 그에게 쉼이 없다는 뜻이며, 특정한 ‘곳’의 부재를 직접 말하지 않습니다.
  - severity: medium
    issue: 각주 표지가 해당 본문 어구에 연결되지 않음
    rationale: 어휘 대안 각주는 ‘환호하다’에, 키팀 문화 주석은 ‘키팀’에 붙여야 독자가 각주의 대상을 명확히 알 수 있습니다.
