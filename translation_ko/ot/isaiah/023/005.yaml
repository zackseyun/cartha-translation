source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר שֵׁ֖מַע לְ/מִצְרָ֑יִם יָחִ֖ילוּ כְּ/שֵׁ֥מַע צֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/005.yaml
  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
  footnotes:
  - marker: a
    text: Or 'they will be in anguish,' 'they will tremble,' or 'they will be pained' at the report about Tyre.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 소식이 이집트에 전해질 때, 그들은 두로의 소식 때문에 몸부림칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몸부림칠 것입니다’는 히브리어 חול의 강한 동요, 고통, 떨림의 가능성을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר / שֵׁמַע
  english_pob_choice: When the report comes
  chosen_korean: 이 소식이 … 전해질 때
  alternatives_korean:
  - 그 소문이 들릴 때
  - 그 소식이 올 때
  lexicon: HALOT
  rationale: שֵׁמַע는 ‘소식, 보고’의 뜻이므로 한국어에서는 자연스러운 ‘소식’으로 옮기고, ‘전해지다’로 도착하는 뉘앙스를 살렸습니다.
- source_word: לְמִצְרַיִם
  english_pob_choice: to Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트로
  - 이집트에게
  lexicon: HALOT
  rationale: ל는 여기서 도달 방향을 나타내므로 ‘이집트에’가 가장 자연스럽고 문맥에도 맞습니다.
- source_word: יָחִילוּ
  english_pob_choice: they will writhe
  chosen_korean: 몸부림칠 것입니다
  alternatives_korean:
  - 고통스러워할 것입니다
  - 떨 것입니다
  - 괴로워할 것입니다
  lexicon: HALOT
  rationale: חול의 격한 신체적 동요를 살리기 위해 ‘몸부림치다’를 택했습니다. ‘고통스러워하다’보다 더 생생하게 반응의 강도를 드러냅니다.
- source_word: כְּשֵׁמַע צֹר
  english_pob_choice: at the report of Tyre
  chosen_korean: 두로의 소식 때문에
  alternatives_korean:
  - 두로에 관한 소식에
  - 두로의 보고를 듣고
  lexicon: HALOT
  rationale: כ는 여기서 반응의 계기이므로 ‘때문에’로 풀었고, 반복되는 שֵׁמַע를 살려 ‘소식’을 유지했습니다. צֹר는 현대 한국어 성경에서 통용되는 지명 ‘두로’로 옮겼습니다.
