id: ISA.23.14
reference: Isaiah 23:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֖ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֑ישׁ כִּ֥י שֻׁדַּ֖ד מָעֻזְּ/כֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/014.yaml
  text: Wail[a], ships of Tarshish[b], for your stronghold has been destroyed.
  footnotes:
  - marker: a
    text: Or 'Howl, ships of Tarshish'; the Hebrew verb denotes a loud cry of grief or distress.
    reason: lexical_alternative
  - marker: b
    text: Or 'your fortress' or 'your refuge.' The Hebrew likely refers to Tyre as the ships' place of security.
    reason: lexical_alternative
translation:
  language: ko
  text: 다시스의 배들아, 울부짖으십시오[a]. 너희의 피난처가 무너졌기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울라’. 히브리어 동사는 큰 슬픔이나 고통에서 터져 나오는 외침을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 요새’ 또는 ‘너희의 보루’. 히브리어는 아마도 두로를 그 배들이 의지하는 안전한 근거지로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖으십시오
  alternatives_korean:
  - 통곡하십시오
  - 애곡하십시오
  - 울라
  lexicon: HALOT
  rationale: ילל의 공개적이고 격한 애통을 현대 합쇼체로 살리기 위해 ‘울부짖으십시오’를 택했습니다. ‘통곡하십시오’보다 더 강한 비탄의 외침을 드러냅니다.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: ships of Tarshish
  chosen_korean: 다시스의 배들
  alternatives_korean:
  - 다시스의 선박들
  - 다시스 무역선들
  lexicon: HALOT
  rationale: 고유명사 תַּרְשִׁישׁ은 관용적으로 ‘다시스’로 옮기고, 단순 복수명사 אֳנִיּוֹת는 ‘배들’로 처리해 원문의 직설적 호칭을 살렸습니다.
- source_word: מָעֻזְּכֶן
  english_pob_choice: your stronghold
  chosen_korean: 너희의 피난처
  alternatives_korean:
  - 너희의 요새
  - 너희의 성채
  - 너희의 보루
  lexicon: HALOT
  rationale: מָעוֹז는 ‘요새, 피난처, 보호처’의 범위를 가지므로, 이 절의 문맥상 배들의 안전한 거처를 가리키는 넓은 의미를 살려 ‘피난처’로 옮겼습니다. ‘요새’는 너무 군사적일 수 있습니다.
theological_decisions:
- issue: 파괴된 ‘stronghold’의 지시 대상
  chosen_reading: 문맥상 배들의 안전한 근거지/피난처를 가리키되, 본문에는 특정 지명이나 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 두로를 가리키는 표현으로 주석화하는 읽기
  - 항구를 특정해 ‘항구 요새’로 구체화하는 읽기
  rationale: 히브리어는 단순히 ‘너희의 피난처’라고 말하므로, 해석을 본문에 과도하게 주입하지 않고 원문의 모호성을 보존했습니다.
  doctrine_reference: 본문 해석의 절제와 예언문학의 이미지 보존
