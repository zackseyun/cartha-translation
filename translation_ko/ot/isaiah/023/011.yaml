id: ISA.23.11
reference: Isaiah 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
  footnotes:
  - marker: a
    text: Or "against Canaan." The Hebrew preposition can be understood in more than one way here.
    reason: alternative_reading
  - marker: b
    text: '"Canaan" here likely refers to the Phoenician region associated with Tyre.'
    reason: cultural_note
  - marker: c
    text: Or "its fortresses." The Hebrew uses a feminine singular suffix, consistent with personifying the land or city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바다 위로 손을 펴셨습니다[a]; 나라들을 떨게 하셨습니다. 야훼께서 가나안에[b] 대하여 명령하셔서, 그 요새들을[c] 무너뜨리게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가나안을 향하여.” כאן의 전치사는 여기서 “~에 대하여” 또는 “~을 향하여”로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 “가나안”은 보통 두로와 연결되는 페니키아 지역을 가리키는 것으로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그것의 요새들.” 히브리어는 여성 단수 접미사를 사용하여 땅이나 성읍을 의인화한 표현과 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ נָטָה
  english_pob_choice: He has stretched out his hand
  chosen_korean: 그가 바다 위로 손을 펴셨습니다
  alternatives_korean:
  - 그가 손을 뻗으셨습니다
  - 그가 손을 펼치셨습니다
  lexicon: HALOT
  rationale: פעל의 구체적 이미지를 살리기 위해 ‘손’을 유지하고, ‘펴다’로 의도적 확장을 자연스럽게 표현했습니다.
- source_word: עַל הַיָּם
  english_pob_choice: over the sea
  chosen_korean: 바다 위로
  alternatives_korean:
  - 바다에 대하여
  - 바다를 향해
  lexicon: HALOT
  rationale: עַל의 공간적 감각을 살리면서도 한국어로 자연스럽게 읽히는 ‘위로’를 택했습니다.
- source_word: הִרְגִּיז מַמְלָכוֹת
  english_pob_choice: he has made kingdoms tremble
  chosen_korean: 나라들을 떨게 하셨습니다
  alternatives_korean:
  - 왕국들을 떨게 하셨습니다
  - 나라들을 흔드셨습니다
  lexicon: HALOT
  rationale: הִרְגִּיז의 ‘떨게 하다/동요시키다’ 뉘앙스를 반영해 심판으로 인한 반응을 드러냈습니다.
- source_word: אֶל כְּנַעַן
  english_pob_choice: concerning Canaan
  chosen_korean: 가나안에 대하여
  alternatives_korean:
  - 가나안을 향하여
  - 가나안에 관하여
  lexicon: HALOT
  rationale: אֶל을 단순한 목적어로만 좁히지 않고, 명령의 대상·방향성을 함께 살릴 수 있는 ‘에 대하여’를 사용했습니다.
- source_word: מָעֻזְנֶיהָ
  english_pob_choice: her strongholds
  chosen_korean: 그 요새들
  alternatives_korean:
  - 그 성채들
  - 그 방어 거점들
  lexicon: HALOT
  rationale: 문맥상 성읍/지역을 의인화한 여성 단수 접미사를 반영할 수 있으나, 한국어에서는 자연성을 위해 소유 대명사를 생략하고 ‘요새들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 명명
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 신명기를 가리키는 대체 칭호가 아니라 고유한 언약적 신명 사용이므로, 본문이 드러내는 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: כְּנַעַן의 지시 범위
  chosen_reading: 본문에는 ‘가나안’으로 두고, 주석으로 역사적·지리적 배경을 보완할 수 있게 했습니다.
  alternative_readings:
  - 페니키아
  - 가나안 땅
  rationale: 이사야 23장의 문맥상 페니키아 지역을 가리키는 가능성이 크지만, 원문 표지를 우선하여 본문에서는 히브리어 지명을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy over translation tradition'
