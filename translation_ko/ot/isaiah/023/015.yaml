source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
  footnotes:
  - marker: a
    text: Or, 'for the lifetime of one king.' The Hebrew literally says 'like the days of one king.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'like the song of the prostitute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 두로는 일흔 해 동안[a], 한 왕의 날들과 같이 잊혀질 것입니다. 일흔 해가 끝나면[b] 두로에게는 창녀의 노래와 같은 일이 일어날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 왕의 생애 동안’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘한 왕의 날들과 같이’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창녀의 노래와 같이’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will be
  chosen_korean: …일 것입니다
  alternatives_korean:
  - …됩니다
  - …있을 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 살리면서도, 히브리어 서두의 진행성을 과도하게 늘리지 않도록 간결하게 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때
  lexicon: HALOT
  rationale: 예언서의 관용구를 표준적인 한국어로 전달하되, 문맥의 종말론적·예언적 울림을 유지했습니다.
- source_word: וְנִשְׁכַּחַת צֹר שִׁבְעִים שָׁנָה
  english_pob_choice: Tyre will be forgotten for seventy years
  chosen_korean: 두로는 일흔 해 동안 잊혀질 것입니다
  alternatives_korean:
  - 두로는 일흔 해 동안 잊히게 될 것입니다
  - 두로는 일흔 해 동안 잊힐 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 '잊혀질'로 옮겼고, 도시의 쇠락·비가시화라는 함의를 보존했습니다.
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  english_pob_choice: like the days of one king
  chosen_korean: 한 왕의 날들과 같은 기간입니다
  alternatives_korean:
  - 한 왕의 날들처럼
  - 한 왕의 생애와 같은 기간입니다
  lexicon: HALOT
  rationale: 직역형의 '날들'을 유지하되 한국어에서는 자연스러운 시간 범주인 '기간'을 보충해, 단일 왕의 치세 길이를 암시하는 비교를 전달했습니다.
- source_word: מִקֵּץ
  english_pob_choice: At the end of
  chosen_korean: 일흔 해가 끝나면
  alternatives_korean:
  - 일흔 해 끝에
  - 일흔 해의 끝에서
  lexicon: HALOT
  rationale: 다음 절로 넘어가는 전환점이므로, 한국어에서 가장 자연스러운 종결-개시 구조로 처리했습니다.
- source_word: כְּשִׁירַת הַזּוֹנָה
  english_pob_choice: as in the song of the prostitute
  chosen_korean: 창녀의 노래와 같은 일이 일어날 것입니다
  alternatives_korean:
  - 창녀의 노래처럼
  - 기생의 노래와 같은 일이 일어날 것입니다
  lexicon: HALOT
  rationale: 히브리어의 비교구를 살리면서, 다음 절의 인용으로 이어지는 수사적 표현을 본문 안에서 예고하도록 옮겼습니다.
theological_decisions:
- issue: שִׁירַת הַזּוֹנָה의 성적·수사적 이미지
  chosen_reading: '''창녀'' 이미지를 직접 살려 두로의 상업적·풍자적 비유를 약화시키지 않았습니다.'
  alternative_readings:
  - 기생의 노래
  - 음란한 여인의 노래
  rationale: 문맥은 두로를 노골적인 풍자와 성적 은유로 묘사하며, 이를 완화하면 다음 절의 노래 인용과 예언적 조롱의 힘이 줄어듭니다.
  doctrine_reference: Translation philosophy §1, §6
