source:
  edition: WLC
  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
  footnotes:
  - marker: a
    text: Or 'harp' for 'lyre.' The Hebrew names an ancient stringed instrument (kinnor).
    reason: lexical_alternative
translation:
  language: ko
  text: 비파를 드십시오[a]. 잊힌 창녀여, 도시를 두루 돌아다니십시오. 능숙하게 연주하고 노래를 많이 부르십시오. 그러면 당신이 기억될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘리라’. 히브리어 kinnor는 고대 현악기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִ֥י כִנּוֹר
  english_pob_choice: Take a lyre
  chosen_korean: 비파를 잡으십시오
  alternatives_korean:
  - 비파를 드십시오
  - 거문고를 잡으십시오
  lexicon: WLC / HALOT
  rationale: כִּנּוֹר은 고대 현악기이므로 한국어에서는 전통적으로 통용되는 ‘비파’로 옮기되, imperatival 동사 לקח는 ‘잡으십시오’로 자연스럽게 살렸습니다.
- source_word: סֹבִּי עִיר
  english_pob_choice: go about the city
  chosen_korean: 도시를 두루 돌아다니는
  alternatives_korean:
  - 도시를 돌아다니는
  - 도시를 거니는
  lexicon: WLC / HALOT
  rationale: סבב의 반복적 이동 뉘앙스를 살려 ‘두루 돌아다니다’로 옮겼고, עִיר는 단순히 ‘도시’로 유지해 원문의 지리적 대상을 보존했습니다.
- source_word: זוֹנָה נִשְׁכָּחָה
  english_pob_choice: forgotten prostitute
  chosen_korean: 잊힌 창녀
  alternatives_korean:
  - 잊힌 매춘부
  - 잊힌 기생
  lexicon: WLC / HALOT
  rationale: זוֹנָה의 직설적 의미를 약화하지 않기 위해 ‘창녀’를 택했고, נִשְׁכָּחָה는 수동 분사적 형용사로 ‘잊힌’이 가장 간결합니다.
- source_word: הֵיטִיבִי נַגֵּן הַרְבִּי שִׁיר
  english_pob_choice: play skillfully, sing many songs
  chosen_korean: 기교 있게 연주하고 노래를 많이 부르십시오
  alternatives_korean:
  - 능숙하게 연주하고 많은 노래를 부르십시오
  - 잘 연주하고 노래를 많이 부르십시오
  lexicon: WLC / HALOT
  rationale: הֵיטִיבִי는 ‘좋게’보다 ‘기교 있게/능숙하게’가 악기 연주의 기술성에 더 가깝고, נַגֵּן과 שִׁיר는 한국어 관용에 맞게 각각 ‘연주하다’, ‘노래를 부르다’로 풀었습니다.
theological_decisions:
- issue: 두로에 대한 예언적 조롱 속 성적 은유의 보존
  chosen_reading: ‘잊힌 창녀’라는 직설적 표현을 본문에 유지했습니다.
  alternative_readings:
  - 잊힌 매춘부
  - 잊혀진 여인
  rationale: 본문은 두로를 의인화된 성적 은유로 부르며 다시 주목받기 위해 요란하게 행동하라는 조롱을 담고 있으므로, 그 불편한 충격을 누그러뜨리지 않는 것이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 원문 우선 원칙; 예언서의 상징언어 보존
