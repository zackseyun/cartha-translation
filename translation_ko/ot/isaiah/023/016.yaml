review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the commands, the personified sexual metaphor, and the purpose clause. However, ‘도시를 두루 돌아다니는’ is an attributive form, not the required second-feminine imperative ‘go about the city.’ The instrument note’s alternative ‘거문고’ is not an appropriate lexical alternative for kinnor, an ancient Levantine lyre-type stringed instrument.
  naturalness: The present wording is generally readable, but ‘도시를 두루 돌아다니는 잊힌 창녀여’ syntactically means ‘O forgotten prostitute who goes about the city,’ rather than directly commanding her to go about the city. Separating the vocative and imperative makes the Korean natural and precise.
  terminology: ‘창녀’ preserves the stark metaphor of זוֹנָה in a formal prophetic register. ‘비파’ can be used as a functional rendering of kinnor, but ‘거문고’ should not be offered as its alternative; ‘리라’ is a more suitable alternative designation.
  issues:
  - severity: high
    issue: The imperative סֹבִּי is rendered as an attributive clause.
    rationale: ‘도시를 두루 돌아다니는’ modifies ‘잊힌 창녀’ and loses the direct command ‘go about the city.’ It should be ‘도시를 두루 돌아다니십시오.’
  - severity: medium
    issue: The footnote’s alternative ‘거문고’ is lexically misleading for כִּנּוֹר.
    rationale: A geomungo is a distinct Korean zither and is not a suitable equivalent for the ancient lyre-type kinnor. A note may use ‘리라’ as an alternative designation while identifying kinnor as an ancient stringed instrument.
  revised_text: 비파를 드십시오[a]. 잊힌 창녀여, 도시를 두루 돌아다니십시오. 능숙하게 연주하고 노래를 많이 부르십시오. 그러면 당신이 기억될 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘리라’. 히브리어 kinnor는 고대 현악기를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 'The revision restores the imperative force and sequence of the Hebrew: take the instrument; go about the city, O forgotten prostitute; play skillfully; multiply song; so that you may be remembered. It also replaces an unsuitable instrument alternative without overclaiming the precise identification of kinnor.'
