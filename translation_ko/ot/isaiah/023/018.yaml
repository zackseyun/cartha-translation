- from: 그의 물품과 그의 품삯은 야훼께 거룩한 것이 될 것입니다. 그것은 쌓아 두거나 저장해 두지 못할 것입니다. 그의 물품은 야훼 앞에 사는 이들을 위한 것이 되어, 배불리 먹게 하고 오래 입게 할 것입니다.[a][b]
  to: 그녀의 상품과 품삯[a]은 야훼께 거룩하게 구별될 것입니다. 그것들은 쌓아 두거나 저장해 두지 않을 것입니다. 그녀의 상품은 야훼 앞에서 사는 사람들을 위하여 쓰여, 그들이 배불리 먹을 것과 오래 입을 옷[b]을 마련하는 데 쓰일 것입니다.
  rationale: 두로를 여성으로 의인화한 히브리어 소유 표현을 반영하고, 저장되지 않을 두 항목의 복수성을 바로잡았습니다. 마지막 두 목적구는 원문처럼 양식의 충족과 의복의 제공을 병렬로 유지하도록 고쳤으며, 논쟁적인 עָתִיק의 의미는 본문에서 지나치게 단정하지 않고 각주에 보존했습니다. 두 각주 표지도 해당 어휘에 직접 배치했습니다.
