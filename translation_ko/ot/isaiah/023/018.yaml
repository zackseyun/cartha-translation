  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה סַחְרָ֜/הּ וְ/אֶתְנַנָּ֗/הּ קֹ֚דֶשׁ לַֽ/יהוָ֔ה לֹ֥א יֵֽאָצֵ֖ר וְ/לֹ֣א יֵֽחָסֵ֑ן כִּ֣י לַ/יֹּשְׁבִ֞ים לִ/פְנֵ֤י יְהוָה֙ יִֽהְיֶ֣ה סַחְרָ֔/הּ לֶ/אֱכֹ֥ל לְ/שָׂבְעָ֖ה וְ/לִ/מְכַסֶּ֥ה עָתִֽיק׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
  footnotes:
  - marker: a
    text: Or 'her hire.' The term can denote payment or hire and may echo the chapter's imagery of Tyre as a prostitute.
    reason: lexical_alternative
  - marker: b
    text: Or 'for durable clothing,' 'for stately clothing,' or 'for ample covering.' The final phrase is difficult, especially the adjective 'lasting/choice/ancient.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 물품과 그의 품삯은 야훼께 거룩한 것이 될 것입니다. 그것은 쌓아 두거나 저장해 두지 못할 것입니다. 그의 물품은 야훼 앞에 사는 이들을 위한 것이 되어, 배불리 먹게 하고 오래 입게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 삯’. 이 말은 대가나 품삯을 뜻하며, 이 장의 두로를 매춘의 이미지로 그리는 뉘앙스를 반영할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오래 입을 옷으로’, ‘귀한 옷으로’, ‘넉넉한 덮개로’. 마지막 구절은 특히 ‘오래된/좋은/귀한’의 의미를 지닌 형용사가 난해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַחְרָהּ
  english_pob_choice: her merchandise
  chosen_korean: 그의 물품
  alternatives_korean:
  - 그의 무역
  - 그의 상거래
  - 그의 상품
  lexicon: HALOT
  rationale: 상업적 산물과 거래 수입을 함께 포괄하면서도, 문맥의 두로를 너무 현대적 경제 개념으로 좁히지 않기 위해 ‘물품’을 택했습니다.
- source_word: אֶתְנַנָּהּ
  english_pob_choice: her wages
  chosen_korean: 그의 품삯
  alternatives_korean:
  - 그의 삯
  - 그의 보수
  - 그의 수입
  lexicon: HALOT
  rationale: עֶתְנָן 계열은 보통 대가·품삯을 뜻하므로, 상업적 벌이의 대가라는 뉘앙스를 살리는 ‘품삯’이 가장 직접적입니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: holy to Yahweh
  chosen_korean: 야훼께 거룩한 것
  alternatives_korean:
  - 야훼께 성별된 것
  - 야훼께 바쳐진 것
  lexicon: HALOT
  rationale: קדש의 핵심은 단순 소속이 아니라 신성한 구별이므로, ‘거룩한 것’으로 번역해 헌납/성별의 종교적 강도를 유지했습니다.
- source_word: לֶאֱכֹל לְשָׂבְעָה
  english_pob_choice: for eating to satisfaction
  chosen_korean: 배불리 먹게
  alternatives_korean:
  - 충분히 먹게
  - 만족할 만큼 먹게
  - 배부르게 먹게
  lexicon: HALOT
  rationale: ‘to satisfaction’의 결과적 의미를 한국어 자연스러운 동사구로 옮겨, 먹어 포만에 이른다는 뜻을 간결하게 살렸습니다.
- source_word: וְלִמְכַסֶּה עָתִיק
  english_pob_choice: for durable clothing
  chosen_korean: 오래 입게
  alternatives_korean:
  - 튼튼한 옷으로
  - 오래가는 옷으로
  - 오래 덮게
  lexicon: HALOT
  rationale: 마지막 표현은 난해하지만, POB의 결정처럼 실용적 의복 제공을 살리기 위해 ‘오래 입게’로 옮겨 ‘지속되는 덮개/의복’의 뜻을 반영했습니다.
theological_decisions:
- issue: 야훼(יהוה) 이름의 처리
  chosen_reading: 본문과 인용구에서 모두 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 Tetragrammaton을 직접 사용하므로, 프로젝트 기본 원칙에 따라 언약명 자체를 보존하는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: ‘거룩한 것’의 신학적 강도
  chosen_reading: 상업적 수입이 단순 세금이 아니라 야훼께 구별된 제물성 소유로 제시됩니다.
  alternative_readings:
  - 성별된 것
  - 헌납된 것
  - 바쳐진 것
  rationale: קֹדֶשׁ는 성소적 구별을 뜻하므로, 경제적 재분배보다 예배적 헌납의 의미가 앞선다는 점을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
