  text: 이것이 너희의 환희에 찬 성읍입니까? 그 기원은 아주 옛날부터였고, 그 발이 그 성읍을 멀리 이끌어 가 나그네로 살게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 옛 역사는 아주 옛날부터였으며, 그 발이 그 성읍을 먼 곳으로 이끌어 가 거주하게 했습니다.’
    reason: קַדְמָתָהּ는 ‘기원’ 외에 ‘옛 역사/고대성’으로, לָגוּר는 ‘나그네로 살다’ 외에 ‘거주하다’로도 옮길 수 있습니다.
