id: ISA.23.8
reference: Isaiah 23:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֚י יָעַ֣ץ זֹ֔את עַל צֹ֖ר הַ/מַּֽעֲטִירָ֑ה אֲשֶׁ֤ר סֹחֲרֶ֨י/ה֙ שָׂרִ֔ים כִּנְעָנֶ֖י/הָ נִכְבַּדֵּי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
  footnotes:
  - marker: a
    text: Or, more literally, “the bestower of crowns.” The Hebrew portrays Tyre as one that confers royal status or wealth.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “Canaanites”; in this context the term likely means “merchants” or “traders.”
    reason: alternative_reading
translation:
  language: ko
  text: 누가 왕관을 씌우는 도시[a] 두로를 대적하여 이런 일을 계획했습니까? 그 상인들은 고관들이며, 그 무역상들은[b] 땅의 존귀한 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕관을 씌우는 자”입니다. 히브리어의 여성 단수 분사가 두로를 가리키며, 두로가 왕의 지위나 부를 부여하는 존재라는 비유를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “가나안 사람들”이지만, 이 문맥에서는 “상인들” 또는 “무역상들”을 가리키는 뜻으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יָעַץ זֹאת
  english_pob_choice: Who has planned this
  chosen_korean: 누가 … 이런 일을 계획했습니까?
  alternatives_korean:
  - 누가 … 이것을 꾸몄습니까?
  - 누가 … 이렇게 뜻을 세웠습니까?
  lexicon: HALOT
  rationale: מִי의 수사적 질문과 יָעַץ의 ‘계획하다/의도하다’ 뜻을 살려, 본문의 심판 선언을 현대적이고 직접적으로 표현했습니다.
- source_word: צֹר
  english_pob_choice: Tyre
  chosen_korean: 두로
  alternatives_korean:
  - 티레
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이는 지명을 따라 ‘두로’로 옮겼습니다.
- source_word: הַמַּעֲטִירָה
  english_pob_choice: the bestower of crowns
  chosen_korean: 왕관을 씌우는 도시
  alternatives_korean:
  - 왕관을 씌워 주는 자
  - 왕관을 주는 도시
  lexicon: HALOT
  rationale: עטר의 ‘씌우다/관을 씌우다’ 이미지를 살려, 두로가 다른 이들을 높이고 영화롭게 하는 도시라는 함의를 자연스럽게 전달했습니다.
- source_word: סֹחֲרֶיהָ / כִּנְעָנֶיהָ
  english_pob_choice: merchants / traders
  chosen_korean: 상인들 / 무역상들
  alternatives_korean:
  - 장사꾼들 / 가나안 사람들
  - 거래상들 / 상인들
  lexicon: HALOT
  rationale: 동의 병행을 살려 앞절은 ‘상인들’, 뒷절은 ‘무역상들’로 구분했고, כִּנְעָנֶיהָ의 문자적 ‘가나안 사람들’은 이 문맥에서 상업인을 가리키는 의미로 이해했습니다.
- source_word: נִכְבַּדֵּי אָרֶץ
  english_pob_choice: the honored ones of the earth
  chosen_korean: 땅의 존귀한 자들
  alternatives_korean:
  - 세상의 귀인들
  - 땅에서 존귀한 자들
  lexicon: HALOT
  rationale: ‘무게 있다/존귀하다’의 수동 분사를 살려, 두로의 무역망이 지닌 국제적 위상을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 어조
  chosen_reading: 직설적 수사 의문문으로 유지했습니다.
  alternative_readings:
  - 완곡한 서술문으로 바꿈
  - 감탄문처럼 처리함
  rationale: 예언 본문의 책망과 놀라움을 흐리지 않도록, 원문의 수사적 긴장을 그대로 보존했습니다.
  doctrine_reference: 예언서의 심판 선언과 수사적 질문의 기능
