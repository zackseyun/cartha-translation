id: ISA.23.13
reference: Isaiah 23:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן אֶ֣רֶץ כַּשְׂדִּ֗ים זֶ֤ה הָ/עָם֙ לֹ֣א הָיָ֔ה אַשּׁ֖וּר יְסָדָ֣/הּ לְ/צִיִּ֑ים הֵקִ֣ימוּ בחיני/ו עֹרְרוּ֙ אַרְמְנוֹתֶ֔י/הָ שָׂמָ֖/הּ לְ/מַפֵּלָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
  footnotes:
  - marker: a
    text: Or, 'this people did not exist,' or 'this people was of no account.' The Hebrew clause is terse and difficult.
    reason: alternative_reading
  - marker: b
    text: Or, 'Asshur founded her for desert dwellers.' The phrase may refer either to wild desert creatures or to inhabitants of the desert.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term behind 'siege towers' is uncertain; some render it 'watchtowers' or 'fortresses.'
    reason: textual_variant
  - marker: d
    text: Or, 'laid bare her palaces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 갈대아 사람들의 땅을—이 백성은 존재하지 않았습니다. 앗수르는 그것을 광야의 거주자들을 위해 정하였습니다. 그들은 공성탑을 세우고, 그 성채들을 드러내어 비우고, 그것을 무너진 폐허로 만들었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 백성은 존재하지 않았다’, 혹은 ‘이 백성은 아무것도 아니었다’. 히브리어 절은 매우 간결하고 난해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘앗수르가 그것을 광야의 거주자들을 위해 정하였습니다’. 이 표현은 광야의 야생 생물 또는 광야의 거주자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 해당 표현은 ‘공성탑들’로 옮겼지만, ‘망대들’ 또는 ‘성루들’로도 이해될 수 있습니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘그녀의 궁전들을 드러내어 비웠습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look at
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 주목하십시오
  - 자, 보십시오
  lexicon: HALOT
  rationale: 대상을 주의 깊게 보게 하는 감탄/지시 표현으로, 현대 한국어에서 격식을 유지하며 자연스럽게 옮겼습니다.
- source_word: זֶה הָעָם לֹא הָיָה
  english_pob_choice: this is the people that was not
  chosen_korean: 이 백성은 존재하지 않았습니다
  alternatives_korean:
  - 이 백성은 아니었습니다
  - 이 백성은 없었습니다
  - 이 백성은 아무 것도 아니었습니다
  lexicon: HALOT
  rationale: 히브리어 구절은 매우 간결하고 난해하므로, POB의 긴장과 난점을 살리되 현대 한국어에서 가장 직접적인 의미를 제시했습니다.
- source_word: לְ/צִיִּים
  english_pob_choice: for desert creatures
  chosen_korean: 광야의 거주자들을 위해
  alternatives_korean:
  - 광야의 생물들을 위해
  - 사막의 짐승들을 위해
  - 광야의 유목민들을 위해
  lexicon: HALOT
  rationale: 문맥상 황폐화의 결과를 가리키는 표현이므로, 동물/거주자 양쪽 가능성을 열어 두되 ‘거주자들’로 번역해 POB 각주가 지적한 이중 가능성을 반영했습니다.
- source_word: הֵקִימוּ בחיניו
  english_pob_choice: They set up their siege towers
  chosen_korean: 그들은 공성탑을 세우고
  alternatives_korean:
  - 그들은 망대들을 세우고
  - 그들은 포탑들을 세우고
  - 그들은 성루를 세우고
  lexicon: HALOT
  rationale: 이 표현은 확정이 어려우나, 파괴의 군사적 진행을 따라가면 ‘공성탑’이 가장 문맥에 맞습니다.
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  english_pob_choice: they stripped her palaces bare
  chosen_korean: 그 성채들을 드러내어 비우고
  alternatives_korean:
  - 그녀의 궁전들을 벌거벗겨 놓고
  - 그녀의 궁전들을 드러내고
  - 그녀의 궁전들을 텅 비게 하고
  lexicon: HALOT
  rationale: 어근의 기본값인 ‘깨우다’보다 여기서는 ‘벗겨 드러내다/텅 비게 하다’의 파괴적 의미가 문맥에 적합하므로, 궁전의 내부가 비고 드러나는 이미지를 살렸습니다.
theological_decisions:
- issue: 문장의 주어와 고의적 모호성
  chosen_reading: 히브리어의 급작스럽고 난해한 진술을 평탄화하지 않고, ‘이 백성은 존재하지 않았습니다’로 직역에 가까운 긴장을 유지했습니다.
  alternative_readings:
  - 이 백성은 없었습니다
  - 이 백성은 아무 것도 아니었습니다
  - 이 백성은 보잘것없었습니다
  rationale: 본문은 역사적 평판과 존재론적 부정 사이의 여지를 남기므로, 의미를 과도하게 정리하지 않고 POB의 난점을 보존했습니다.
  doctrine_reference: 예언문학의 수사적 압축성과 다의성 보존
