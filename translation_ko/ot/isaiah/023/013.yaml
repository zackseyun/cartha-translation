  - 그들은 포탑들을 세우고
  - 그들은 성루를 세우고
  lexicon: HALOT
  rationale: 이 표현은 확정이 어려우나, 파괴의 군사적 진행을 따라가면 ‘공성탑’이 가장 문맥에 맞습니다.
