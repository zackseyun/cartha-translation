revisions:
- from: 보십시오, 갈대아 사람들의 땅을—이 백성은 존재하지 않았습니다. 앗수르는 그것을 광야의 거주자들을 위해 정하였습니다. 그들은 공성탑을 세우고, 그 성채들을 드러내어 비우고, 그것을 무너진 폐허로 만들었습니다.[a][b][c][d]
  to: 보십시오, 갈대아 사람들의 땅을—이 백성은 존재하지 않았습니다.[a] 앗수르는 그것을 광야의 짐승들을 위한 곳으로 세웠습니다.[b] 그들은 자기들의 공성탑들을 세우고,[c] 그곳의 궁전들을 드러내어 비웠으며,[d] 그것을 폐허로 만들었습니다.
  rationale: 본문을 WLC에 우선하여 수정했습니다. 앗수르가 ‘세웠다’는 יסד의 의미를 회복하고, צִיִּים는 본문에서 ‘광야의 짐승들’로 옮기되 인간 거주자라는 가능성을 각주에 남겼습니다. 궁전(אַרְמְנוֹתֶיהָ)을 성채로 바꾼 오류를 바로잡고, 각주 표지를 해당 어구에 각각 배치했습니다. 주어와 대명사의 불규칙성 및 ‘이 백성은 존재하지 않았다’의 난해함은 과도하게 해소하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:59Z'
