  source_fidelity: 수정이 필요합니다. יְסָדָהּ는 ‘정하다/지정하다’보다 ‘세우다, 건설하다’가 기본 의미이므로 본문에는 이를 반영해야 합니다. לְצִיִּים는 황폐화 문맥에서 우선 ‘광야의 짐승들/생물들’로 옮기고, 사람을 가리킬 가능성은 각주로 남기는 것이 적절합니다. אַרְמְנוֹתֶיהָ는 ‘성채들’이 아니라 ‘궁전들’입니다.
  naturalness: 합쇼체와 현대 표준어의 문체는 대체로 적절하나, ‘그 성채들을 드러내어 비우고’는 원문의 대상을 잘못 잡았고 한국어로도 다소 부자연스럽습니다. ‘그곳의 궁전들을 드러내어 비웠으며’가 원문의 파괴 이미지를 비교적 자연스럽게 살립니다.
  terminology: ‘갈대아 사람들’, ‘앗수르’, ‘공성탑’, ‘궁전’, ‘폐허’는 적절합니다. 난해한 זֶה הָעָם לֹא הָיָה는 ‘이 백성은 존재하지 않았습니다’로 두어 원문의 압축성과 모호성을 보존할 수 있습니다.
