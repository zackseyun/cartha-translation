  terminology: ‘야훼’, ‘두로’, ‘품삯’, ‘음행’은 본문의 명칭과 창녀 은유를 현대의 격식 있는 성서 한국어로 적절히 전달합니다. ‘왕국들’은 מַמְלְכוֹת의 정치적 의미를 ‘나라들’보다 조금 더 직접적으로 반영합니다.
