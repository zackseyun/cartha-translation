id: ISA.23.17
reference: Isaiah 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
  footnotes:
  - marker: a
    text: Or 'the LORD will visit Tyre'; the Hebrew verb can also imply punitive or restorative intervention depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Her wages'' refers to the hire of a prostitute, continuing the oracle''s metaphor of Tyre as a prostitute among the nations.'
    reason: cultural_note
  - marker: c
    text: 'Or ''on the face of the earth.'' The Hebrew uses two related but distinct terms in this verse: ''earth/land'' and ''ground.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 칠십 년이 끝날 때에 야훼께서 두로를 돌아보실[a] 것이며, 그녀는 자기의 품삯[b]으로 돌아가 땅의 모든 왕국들과 온 지면에서 음행할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아보실’은 히브리어 동사 פקד의 넓은 의미를 반영한 것입니다. 문맥에 따라 ‘방문하시다’, ‘징벌하시다’, ‘돌보시다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘품삯’은 창녀의 보수라는 뜻을 살린 표현입니다. 이 절은 두로를 창녀에 비유하는 은유를 이어 갑니다.
    reason: cultural_note
  - marker: c
    text: ‘땅’(הָאָרֶץ)과 ‘지면’(הָאֲדָמָה)은 히브리어에서 서로 관련되지만 구별되는 낱말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד יְהוָה אֶת צֹר
  english_pob_choice: Yahweh will attend to Tyre
  chosen_korean: 야훼께서 두로를 돌아보시고
  alternatives_korean:
  - 야훼께서 두로를 방문하시고
  - 야훼께서 두로를 돌보시고
  - 야훼께서 두로를 징벌하시고
  lexicon: HALOT
  rationale: פקד의 범위를 한쪽으로 단정하지 않고, 하나님의 निर्ण정적 개입을 드러내는 ‘돌아보시고’로 옮겨 영어 POB의 중립적 처리와 긴장을 살렸습니다.
- source_word: וְשָׁבָה לְאֶתְנַנָּה
  english_pob_choice: and she will return to her wages
  chosen_korean: 그것이 자기의 품삯으로 돌아가
  alternatives_korean:
  - 그것이 자기의 삯으로 돌아가
  - 그것이 자기의 임금으로 돌아가
  lexicon: HALOT
  rationale: אֶתְנַן은 창기의 보수라는 뉘앙스를 가진 말이므로, ‘품삯’으로 직역해 금전적이면서도 성적 은유를 유지했습니다.
- source_word: וְזָנְתָה
  english_pob_choice: and prostitute herself
  chosen_korean: 음행할 것입니다
  alternatives_korean:
  - 창녀짓할 것입니다
  - 창녀로서 행할 것입니다
  - 음행할 것입니다
  lexicon: HALOT
  rationale: 동사의 노골성을 살리되 문장 흐름을 해치지 않도록 ‘음행하다’로 옮겼습니다. 이는 도시 두로의 의인화된 은유를 유지합니다.
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  english_pob_choice: with all the kingdoms of the earth
  chosen_korean: 땅 위의 모든 나라들과
  alternatives_korean:
  - 세상의 모든 나라들과
  - 땅의 모든 나라들과
  - 온 땅의 모든 나라들과
  lexicon: HALOT
  rationale: 여기서는 열방 전체를 가리키는 표현이므로 ‘나라들’로 옮기고, 뒤의 별도 표현과 겹치지 않도록 ‘땅 위의’로 구분했습니다.
- source_word: עַל פְּנֵי הָאֲדָמָה
  english_pob_choice: on the face of the earth/ground
  chosen_korean: 땅 위
  alternatives_korean:
  - 지면 위
  - 땅의 표면 위
  - 온 땅 위
  lexicon: HALOT
  rationale: 앞절의 אָרֶץ와 구별되는 אֲדָמָה의 중복을 자연스럽게 반영하면서, 한국어에서는 반복을 줄여 읽기 쉬운 공간 표지를 택했습니다.
theological_decisions:
- issue: 야훼의 ‘돌아보심’(פקד)의 의미 범위
  chosen_reading: 징벌인지 회복인지로 단정하지 않고, 야훼의 निर्ण정적 개입 자체를 드러냈습니다.
  alternative_readings:
  - 야훼께서 두로를 징벌하실 것입니다
  - 야훼께서 두로를 회복하실 것입니다
  - 야훼께서 두로를 방문하실 것입니다
  rationale: 문맥상 결과는 이어지지만, 동사 자체는 양가적이므로 번역에서 신학적 결론을 미리 확정하지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 두로의 의인화된 성적 은유
  chosen_reading: 도시 두로를 여성화한 예언적 풍자를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘다시 사치와 교역을 하다’로 풀어쓰기
  - 직접적 성적 은유를 약화시키기
  rationale: 본문은 경제와 성적 이미지가 결합된 풍자이므로, 이를 완화하면 예언의 공격성과 수사학이 약해집니다.
  doctrine_reference: Source fidelity / prophetic metaphor retention
