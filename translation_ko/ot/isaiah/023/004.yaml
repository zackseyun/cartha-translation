id: ISA.23.4
reference: Isaiah 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
  footnotes:
  - marker: a
    text: Or “the fortress of the sea” or “the sea’s stronghold.” The phrase may personify the sea in its strength or allude to Tyre as a maritime stronghold.
    reason: lexical_alternative
  - marker: b
    text: Or “I have not travailed.”
    reason: lexical_alternative
  - marker: c
    text: Or “maidens” or “young women”; Hebrew specifically uses a term commonly denoting virgins.
    reason: lexical_alternative
translation:
  language: ko
  text: 부끄러워하라, 시돈아. 바다가 말하였습니다 — “나는 진통을 겪어 본 적이 없고, 아이를 낳은 적도 없으며, 청년들을 키운 적도, 처녀들을 높여 세운 적도 없습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바다의 요새” 혹은 “바다의 견고한 성”으로 옮길 수 있습니다. 이 표현은 바다를 힘 있는 존재로 의인화한 것이거나, 해상 거점인 두로를 가리키는 말일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “진통을 겪어 본 적이 없고”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “처녀들” 또는 “젊은 여자들”로 옮길 수 있습니다. 히브리어는 여기서 흔히 ‘처녀들’을 뜻하는 단어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  english_pob_choice: Be ashamed
  chosen_korean: 부끄러워하라
  alternatives_korean:
  - 수치를 당하라
  - 수치스러워하라
  lexicon: HALOT
  rationale: 여성 단수 명령형으로 도시 시돈에 대한 수치의 호출을 살리면서, 현대 한국어에서 가장 직접적으로 대응되는 명령을 택했습니다.
- source_word: מָעוֹז הַיָּם
  english_pob_choice: the stronghold of the sea
  chosen_korean: 바다가 말하였습니다
  alternatives_korean:
  - 바다의 요새가 말하였습니다
  - 바다의 견고한 성이 말하였습니다
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 이 구는 바다를 인격화한 발화로 읽을 수 있으므로, 핵심 이미지인 '바다'와 '말하다'를 본문에 두고 해석적 덧붙임은 최소화했습니다.
- source_word: לֹא חַ֣לְתִּי / יָלַ֗דְתִּי / גִדַּלְתִּי / רוֹמַ֥מְתִּי
  english_pob_choice: I have not been in labor / given birth / raised young men / exalted virgins
  chosen_korean: 진통을 겪어 본 적이 없고, 아이를 낳은 적도 없으며, 청년들을 키운 적도, 처녀들을 높여 세운 적도 없습니다
  alternatives_korean:
  - 해산한 적이 없고
  - 출산한 적도 없으며
  - 청년들을 길러 낸 적도
  - 처녀들을 들어 올린 적도
  lexicon: HALOT
  rationale: 출산 연쇄를 한국어에서 자연스럽게 연결하되, 마지막 שני 동사는 'raise/exalt'의 구분을 살려 '키우다'와 '높여 세우다'로 나누어 반복을 보존했습니다.
theological_decisions:
- issue: 시돈에 대한 예언적 수치 명령의 어조
  chosen_reading: 직설적인 명령형 '부끄러워하라'를 유지하여 선지자적 고발의 날카로움을 살렸습니다.
  alternative_readings:
  - 수치를 당하라
  - 애곡하라
  rationale: 히브리어 בּוֹשִׁי는 단순한 감정 묘사가 아니라 공개적 수치의 선포이므로, 부드러운 완곡어보다 직접 명령을 유지하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 예언서의 심판 선포와 언약적 수치 개념
