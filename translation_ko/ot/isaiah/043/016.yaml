language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/נּוֹתֵ֥ן בַּ/יָּ֖ם דָּ֑רֶךְ וּ/בְ/מַ֥יִם עַזִּ֖ים נְתִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
  footnotes:
  - marker: a
    text: Or 'through the sea' and 'through mighty waters.' The Hebrew preposition is literally 'in,' but English may express the sense as movement through the waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 이처럼 말씀하십니다. 야훼께서 바다 가운데에 길을 내시고, 거센 물들 가운데에 통로를 내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바다 안에서’와 ‘거센 물들 안에서’이지만, 한국어에서는 이동의 의미를 드러내기 위해 ‘가운데에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이처럼 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 이처럼 이르십니다
  lexicon: HALOT
  rationale: 예언 선포 공식을 현대 한국어 합쇼체로 자연스럽게 옮기면서도, 선언적·격식 있는 어조를 살리기 위해 ‘이처럼 말씀하십니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문의 신명은 관용적 대체어인 ‘주’가 아니라, 이 프로젝트 기본값에 따라 음역형 ‘야훼’로 옮겨 원문의 고유명을 드러냈습니다.
- source_word: בַּיָּם ... וּבְמַיִם עַזִּים
  english_pob_choice: in the sea ... in the mighty waters
  chosen_korean: 바다 가운데에 ... 거센 물들 가운데에
  alternatives_korean:
  - 바다 속에 ... 강한 물들 속에
  - 바다에 ... 힘센 물들에
  lexicon: HALOT
  rationale: 히브리어 전치사 ‘in’을 직역하면 ‘~안에’이지만, 한국어에서는 물속 위치보다 ‘가운데에’가 시적 이미지와 어울리며, English POB의 각주가 인정한 ‘through’의 이동감을 과도하게 해석하지 않으면서도 자연스럽게 전달합니다.
- source_word: דָּרֶךְ / נְתִיבָה
  english_pob_choice: a way / a path
  chosen_korean: 길 / 통로
  alternatives_korean:
  - 길 / 길
  - 도로 / 길
  lexicon: HALOT
  rationale: 두 명사가 평행을 이루므로 같은 단어를 반복하기보다 의미는 유지하되 약간 구분되는 한국어를 사용해 시적 평행법을 살렸습니다. ‘통로’는 바다와 물들 사이에 내신 길이라는 맥락을 잘 드러냅니다.
theological_decisions:
- issue: 신명 예언 공식의 현존형 번역
  chosen_reading: ‘말씀하십니다’로 현재형을 사용했습니다.
  alternative_readings:
  - ‘말씀하셨습니다’로 과거형 처리
  - ‘이처럼 야훼께서 말씀하신다’로 직설형 처리
  rationale: כֹּה אָמַר는 예언문에서 현재의 선포 관용구로 기능하므로, 한국어도 현재 시제로 옮겨 선언의 생동감을 살렸습니다.
  doctrine_reference: 예언자적 선언 형식
