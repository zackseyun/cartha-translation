id: ISA.43.24
reference: Isaiah 43:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
  footnotes:
  - marker: a
    text: Or 'calamus' or 'aromatic cane.' The Hebrew term refers to a costly fragrant cane.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you made me serve with your sins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 은으로 나에게 향기로운 갈대도 사지 않았고, 당신의 제물의 기름으로 나를 흡족하게 하지도 않았습니다. 오히려 당신은 당신의 죄로 나를 괴롭게 했고, 당신의 불의로 나를 지치게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향기로운 갈대’는 값비싼 향료용 갈대를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너는 네 죄로 나를 섬기게 했다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ ... בַכֶּסֶף קָנֶה
  english_pob_choice: did not buy ... with silver / sweet cane
  chosen_korean: 은으로 ... 향기로운 갈대도 사지 않았습니다
  alternatives_korean:
  - 은으로 ... 사향 갈대도 사지 않았습니다
  - 은으로 ... 향료 갈대도 사지 않았습니다
  lexicon: HALOT
  rationale: קָנָה는 여기서 ‘사다’의 상업적 의미가 자연스럽고, קָנֶה는 값비싼 향료용 갈대류를 가리키므로 ‘향기로운 갈대’로 옮겨 의미를 분명히 했습니다.
- source_word: חֵלֶב זְבָחֶיךָ
  english_pob_choice: the fat of your sacrifices
  chosen_korean: 당신의 제물의 기름
  alternatives_korean:
  - 당신의 제물의 기름진 부분
  - 당신의 제물의 기름기
  lexicon: HALOT
  rationale: חֵלֶב는 제의 문맥에서 제물의 ‘기름’ 또는 ‘기름진 부분’이지만, 한국어에서는 ‘기름’이 가장 직접적이고 제의적 이미지를 유지합니다.
- source_word: הֶעֱבַדְתַּנִי בְּחַטֹּאותֶיךָ
  english_pob_choice: you burdened me with your sins / literally, you made me serve with your sins
  chosen_korean: 당신은 당신의 죄로 나를 괴롭게 했고
  alternatives_korean:
  - 당신은 당신의 죄로 나를 수고하게 했고
  - 당신은 당신의 죄로 나를 섬기게 했고
  lexicon: HALOT
  rationale: עבד의 기본 뜻은 ‘섬기게 하다/일하게 하다’이지만, 본문은 하나님께 죄가 짐처럼 얹히는 강한 비유를 담으므로 한국어에서는 그 충격을 살려 ‘괴롭게 하다’로 옮겼습니다.
- source_word: הוֹגַעְתַּנִי בַּעֲוֺנֹתֶיךָ
  english_pob_choice: you wearied me with your iniquities
  chosen_korean: 당신의 불의로 나를 지치게 했습니다
  alternatives_korean:
  - 당신의 죄악으로 나를 지치게 했습니다
  - 당신의 불법으로 나를 피곤하게 했습니다
  lexicon: HALOT
  rationale: יָגַע의 사역형은 ‘지치게 하다’가 정확하고 자연스럽습니다. עָוֹן은 단순한 잘못보다 더 무거운 도덕적 왜곡을 가리켜 ‘불의’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 제물과 죄에 의해 ‘흡족해지지/괴로워지지’ 않는다는 인격적·비유적 표현
  chosen_reading: ‘나를 흡족하게 하지도 않았습니다’, ‘나를 괴롭게 했고’, ‘나를 지치게 했습니다’를 그대로 살려, 하나님께 적용된 인격적 비유를 완화하지 않았습니다.
  alternative_readings:
  - ‘나를 기쁘게 하지도 않았습니다’
  - ‘나에게 불손했습니다’
  rationale: 히브리어는 예배의 결핍과 죄의 무게를 강한 인격적 언어로 고발합니다. 이를 추상화하면 본문의 예언적 충격이 약해지므로, 원문의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
