  to: 너는 은을 주고 나를 위하여 향기로운 갈대를 사지 않았으며[a], 네 제물의 기름진 부분으로 나를 흡족하게 하지도 않았습니다. 그러나 너는 네 죄로 나를 수고하게 하였고[b], 네 죄악으로 나를 지치게 하였습니다.
