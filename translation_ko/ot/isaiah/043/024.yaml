  source_fidelity: 수정이 필요합니다. לִי는 향기로운 갈대를 ‘나를 위하여’ 사지 않았다는 뜻인데, 초안의 ‘나에게 ... 사지’는 이 수혜 관계를 충분히 드러내지 못합니다. 또한 הֶעֱבַדְתַּנִי는 단순히 ‘괴롭게 했다’보다 ‘수고하게 하였다/섬기게 하였다’라는 강제 노동의 비유를 보존할 필요가 있습니다.
  naturalness: ‘당신은 당신의’의 반복은 현대 한국어 성경 문체에서 다소 부자연스럽고, 하나님이 이스라엘을 직접 책망하는 문맥에는 ‘너는/네’가 더 자연스럽습니다. ‘제물의 기름’은 식용 기름으로도 들릴 수 있으므로 제의적 의미를 분명히 하는 ‘기름진 부분’이 적절합니다.
  terminology: קָנֶה는 ‘향기로운 갈대’로 유지할 수 있습니다. חֵלֶב는 ‘제물의 기름진 부분’, חַטָּאוֹת는 ‘죄’, עָוֹנוֹת는 앞말과 구별하여 ‘죄악’으로 옮깁니다. ‘흡족하게 하다’는 희생 제물의 비유적 언어를 보존합니다.
