revisions:
- from: 그분의 눈에 귀하고 존귀하며 내가 너를 사랑하기 때문에, 내가 사람들을 너를 대신하여 주고, 민족들을 네 생명을 대신하여 주겠습니다.[a][b]
  to: 네가 내 눈에 귀하고 존귀하며, 내가 너를 사랑하기 때문에, 내가 사람들을 너 대신 내어 주고 민족들을 네 생명 대신 내어 줍니다.[a][b]
  rationale: 1인칭 화자의 시점을 회복하고, 히브리어의 인과절과 병행구를 유지했습니다. 본문은 영어 POB의 현재적 예언 선언(‘I give’)에 맞춰 ‘내어 줍니다’로, 미래적 읽기는 각주로 처리했습니다. 각주 a에서는 원문 및 영어 감사 기록이 허용하는 과거/현재의 동사 해석만 남기고 근거 없는 시간적 기점을 제거했습니다.
