translation:
  language: ko
  text: 네가 내 눈에 귀하고 존귀하며, 내가 너를 사랑하기 때문에, 내가 사람들을 너 대신 내어 주고 민족들을 네 생명 대신 내어 줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “네가 내 눈에 귀하고 존귀했으며, 내가 너를 사랑해 왔기 때문에.” 히브리어 동사들은 문맥상 과거 또는 현재적 효력으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “내가 너 대신 사람들을 내어 주고, 네 생명 대신 민족들을 내어 줄 것이다.” 예언적 문맥에서는 히브리어 동사가 미래적 의미로 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  english_pob_choice: Because
  chosen_korean: ~하기 때문에
  alternatives_korean:
  - ~이므로
  - ~했기에
  lexicon: HALOT
  rationale: 문맥상 이유를 제시하는 접속으로 기능하므로, 현대 한국어에서 가장 자연스럽고 분명한 인과 표현으로 옮겼습니다.
- source_word: יָקַרְתָּ / נִכְבַּדְתָּ
  english_pob_choice: you are precious ... honored
  chosen_korean: 귀하고 존귀하며
  alternatives_korean:
