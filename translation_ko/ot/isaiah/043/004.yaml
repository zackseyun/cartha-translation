  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
  footnotes:
  - marker: a
    text: Or, 'Since you were precious in my eyes, honored, and I have loved you.' The Hebrew verbs can be understood with past or present force in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will give men in exchange for you, and peoples in place of your life.' The Hebrew verb may be read with future force in this prophetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 눈에 귀하고 존귀하며 내가 너를 사랑하기 때문에, 내가 사람들을 너를 대신하여 주고, 민족들을 네 생명을 대신하여 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, "그때부터 너는 내 눈에 귀하고 존귀했으며, 내가 너를 사랑해 왔다." 히브리어 동사들은 문맥상 과거 또는 현재의 힘으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, "내가 너를 대신하여 사람들을 주고, 네 생명을 대신하여 민족들을 줄 것이다." 예언적 문맥에서는 히브리어 동사가 미래의 힘으로 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  english_pob_choice: Because
  chosen_korean: ~하기 때문에
  alternatives_korean:
  - ~이므로
  - ~했기에
  lexicon: HALOT
  rationale: 문맥상 이유를 제시하는 접속으로 기능하므로, 현대 한국어에서 가장 자연스럽고 분명한 인과 표현으로 옮겼습니다.
- source_word: יָקַרְתָּ / נִכְבַּדְתָּ
  english_pob_choice: you are precious ... honored
  chosen_korean: 귀하고 존귀하며
  alternatives_korean:
  - 소중하고 존귀하며
  - 귀하게 여겨지고 존중되며
  lexicon: HALOT
  rationale: 두 형용법은 하나님 앞에서의 मूल्य/존중을 병렬적으로 강조하므로, '귀하다'와 '존귀하다'를 써서 평가의 뉘앙스를 함께 살렸습니다.
- source_word: תַּחְתֶּיךָ / תַּחַת נַפְשֶׁךָ
  english_pob_choice: in exchange for you / in place of your life
  chosen_korean: 너를 대신하여 / 네 생명을 대신하여
  alternatives_korean:
  - 너와 바꾸어
  - 너를 위하여
  lexicon: HALOT
  rationale: תחת의 대체·교환 의미를 분명하게 드러내기 위해 '대신하여'를 사용했습니다. '생명'은 נֶפֶשׁ의 구체적 의미를 살려 '영혼'보다 원문의 긴장을 잘 보존합니다.
- source_word: אָדָם / וּלְאֻמִּים
  english_pob_choice: men / peoples
  chosen_korean: 사람들을 / 민족들을
  alternatives_korean:
  - 사람들
  - 나라들을
  lexicon: HALOT
  rationale: 이 병행구는 אדם과 לאומים의 대조를 이루므로, 첫 항은 인간 일반을 가리키는 집합적 의미의 '사람들', 둘째 항은 민족 집단을 가리키는 '민족들'로 옮겨 병행을 보존했습니다.
theological_decisions:
- issue: יִקַר/נִכְבַד의 시제와 현재적 진술
  chosen_reading: 하나님이 지금도 이스라엘을 귀하고 존귀하게 여기신다는 현재적 선언으로 읽었습니다.
  alternative_readings:
  - 과거의 평가로 읽기
  - 예언적 미래형으로 풀기
  rationale: 히브리어 완료형은 문맥상 현재적 효력을 가질 수 있으므로, 단순한 과거 사건이 아니라 언약적 평가의 지속성을 드러내는 쪽이 본문의 힘을 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition'
