base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
  footnotes:
  - marker: a
    text: Or 'to the ban' / 'to being devoted to destruction.' The Hebrew חֵרֶם refers to something placed under a ban for destruction in divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 성소의 지도자들을 더럽혔고, 야곱을 파멸에[a] 넘겼으며, 이스라엘을 조롱거리가 되게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진멸에 넘겨’ / ‘진멸에 바쳐’로 옮길 수 있습니다. 히브리어 חֵרֶם은 하나님의 심판 아래 진멸하도록 바쳐진 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחַלֵּל
  english_pob_choice: I profaned
  chosen_korean: 더럽혔고
  alternatives_korean:
  - 속되게 했고
  - 더럽혔습니다
  - 모독했고
  lexicon: HALOT
  rationale: חלל의 사역형은 거룩한 것을 속되게 하거나 더럽히는 뜻이므로, 문맥의 성소적 긴장을 살리기 위해 ‘더럽혔고’로 옮겼습니다.
- source_word: שָׂרֵי קֹדֶשׁ
  english_pob_choice: the princes of the sanctuary
  chosen_korean: 성소의 지도자들
  alternatives_korean:
  - 거룩한 지도자들
  - 성소의 군왕들
  - 성물의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים은 ‘지도자들’로, קֹדֶשׁ은 도덕적 형용사보다 거룩한 영역을 가리키므로, 직역의 어감을 유지하면서도 자연스러운 한국어인 ‘성소의 지도자들’로 옮겼습니다.
- source_word: לַחֵרֶם
  english_pob_choice: over to destruction
  chosen_korean: 파멸에 넘기고
  alternatives_korean:
  - 진멸에 넘기고
  - 저주 아래 두고
  - 멸망에 넘기고
  lexicon: HALOT
  rationale: חֵרֶם은 심판 아래 ‘바쳐진 것/진멸된 것’의 강한 개념이므로, 완곡하게 약화시키지 않으면서도 현대 한국어로 읽히는 ‘파멸에 넘기고’로 표현했습니다.
- source_word: לְגִדּוּפִים
  english_pob_choice: to reviling
  chosen_korean: 조롱거리가 되게 하였습니다
  alternatives_korean:
  - 욕설거리가 되게 하였습니다
  - 모욕거리가 되게 하였습니다
  - 비난거리가 되게 하였습니다
  lexicon: HALOT
  rationale: גדופים는 공개적 비난과 조롱의 언어를 뜻하므로, 단순한 내면적 수치가 아니라 타인의 조소 대상이 된다는 점을 살려 ‘조롱거리가 되게 하였습니다’로 옮겼습니다.
theological_decisions:
- issue: חֵרֶם의 심판 강도
  chosen_reading: ‘파멸에 넘기고’로 옮겨, 하나님의 언약적 심판의 엄중함을 그대로 드러냈습니다.
  alternative_readings:
  - ‘진멸에 넘기고’
  - ‘바친 것으로 두고’
  rationale: 본문은 단순한 패배가 아니라 하나님이 심판으로 넘기시는 강한 표현을 사용하므로, 그 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
