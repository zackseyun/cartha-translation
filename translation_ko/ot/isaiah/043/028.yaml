  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. ‘성소의 지도자들’, ‘파멸에 넘기고’, ‘조롱거리가 되게 하였습니다’는 각각 שָׂרֵי קֹדֶשׁ, לַחֵרֶם, לְגִדּוּפִים의 문맥상 의미를 무리 없이 전달합니다. 다만 חֵרֶם에 관한 각주 표지가 해당 어구가 아니라 문장 끝에 붙어 있어, 각주의 연결 대상을 명확히 해야 합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 병렬 동사를 ‘하였고/넘겼으며/하였습니다’로 정리하여 문장 종결과 연결을 조금 더 매끄럽게 하였습니다.
  terminology: ‘성소의 지도자들’은 성스러운 영역과 관련된 지도자라는 구문상의 의미를 적절히 반영합니다. חֵרֶם의 각주에서 ‘금령’은 한국어로 어색하고 원어의 심판적·진멸적 의미를 충분히 전달하지 못하므로, ‘진멸에 넘겨’ 및 ‘진멸에 바쳐’로 바로잡았습니다.
