revisions:
- from: 모든 민족이 함께 모이고, 모든 백성이 모이게 하십시오. 그들 가운데 누가 이것을 선포하며, 이전의 일들을 우리에게 들려줄 수 있겠습니까? 그들이 자기 증인들을 내세워 자신들이 옳음을 입증하게 하십시오. 그리고 듣고서 「참되다」라고 말하게 하십시오.[a][b]
  to: 모든 나라들이 함께 모이게 하시고, 백성들이 모이게 하십시오. 그들 가운데 누가 이것을 선포하고 이전의 일들[a]을 우리에게 들려줄 수 있겠습니까? 그들이 자기 증인들을 내세워 옳다고 판정받게 하십시오[b]. 그들이 듣고 “그것은 참되다”라고 말하게 하십시오.
  rationale: WLC를 우선하여 ‘우리에게’라는 목적어를 복원했습니다. 법정 은유에서는 증인 제시와 그에 따른 판정을 구별하여, ‘내세워’는 יִתְּנוּ עֵדֵיהֶם에, ‘옳다고 판정받게 하십시오’는 וְיִצְדָּקוּ에 대응시켰습니다. 문체는 현대 표준어 합쇼체로 통일하고, 각주 표지를 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:13:59Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 יַשְׁמִיעֻנוּ의 1인칭 복수 목적어 접미사(‘우리에게/우리로 하여금 듣게’)를 한국어 본문에 유지해야 합니다. 또한 וְיִצְדָּקוּ는 법정 맥락에서 ‘옳다고 판정받다/정당함이 입증되다’라는 수동적 판정의 뜻이므로, 주어가 스스로 ‘옳음을 입증하다’로 바꾸지 않는 편이 충실합니다.
  naturalness: 초안은 합쇼체를 대체로 잘 사용하지만, 첫 두 절의 명령형이 ‘모이고/모이게 하십시오’로 혼재합니다. 둘 다 ‘-게 하십시오’로 맞추고, 인용문은 한국어에서 자연스럽게 ‘그것은 참되다’로 제시했습니다.
  terminology: ‘나라들/백성들’은 גּוֹיִם과 לְאֻמִּים의 병행을 자연스럽게 살립니다. ‘옳다고 판정받게 하십시오’는 צדק의 법정적 의미를 보존하면서 후대의 교리적 전문어를 강요하지 않습니다.
  issues:
  - severity: high
    issue: ‘우리에게’가 본문에서 누락되어 있습니다.
    rationale: יַשְׁמִיעֻנוּ의 접미사 נוּ는 ‘우리에게/우리가 듣도록’을 뜻합니다. 영어 감사 이력의 ‘to us’ 삭제는 WLC 본문과 맞지 않으며, 한국어 번역에는 이를 반영해야 합니다.
  - severity: medium
    issue: ‘자신들이 옳음을 입증하게 하십시오’가 수동적 법정 판정의 방향을 능동적 자기입증으로 바꿉니다.
    rationale: וְיִצְדָּקוּ는 ‘그들이 옳다고 판정받게 하십시오’ 또는 ‘정당함이 입증되게 하십시오’에 가깝습니다. 증인을 내세우는 행위는 앞 절이 표현하며, 이 동사는 그 결과의 판정을 나타냅니다.
