reference: Isaiah 43:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
  footnotes:
  - marker: a
    text: Or “the first things.” In Isaiah, “former things” often refers to earlier acts or prior declarations that demonstrate the Lord’s sovereignty.
    reason: lexical_alternative
  - marker: b
    text: Or “that they may be justified” / “that they may be in the right.” The Hebrew has a forensic sense in this courtroom setting.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 나라들이 함께 모이게 하시고, 백성들이 모이게 하십시오. 그들 가운데 누가 이것을 선포하고 이전의 일들[a]을 우리에게 들려줄 수 있겠습니까? 그들이 자기 증인들을 내세워 옳다고 판정받게 하십시오[b]. 그들이 듣고 “그것은 참되다”라고 말하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “먼저 있었던 일들.” 이사야에서는 이 표현이 야훼의 주권을 드러내는 앞선 행위나 선포를 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들이 정당함을 인정받게 하십시오” 또는 “그들이 의롭다 함을 받게 하십시오.” 히브리어는 이 법정 장면에서 옳고 그름에 관한 판정의 의미를 지닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족
  lexicon: HALOT
  rationale: גּוֹיִם은 이 문맥에서 이방인 구분보다 세계 열방 전체를 가리키는 표현이므로, ‘민족’이 가장 자연스럽고 넓은 대응입니다.
- source_word: נִקְבְּצוּ יַחְדָּו / וְיֵאָסְפוּ
  english_pob_choice: be gathered together / be assembled
  chosen_korean: 함께 모이고 / 모이게 하십시오
  alternatives_korean:
  - 함께 모이게 하십시오
  - 함께 집결하게 하십시오
  lexicon: HALOT
  rationale: 두 수동/중간적 동사를 한국어에서도 반복적으로 살려, 열방과 백성이 소집되는 법정 소환의 분위기를 유지했습니다.
- source_word: וְרִאשֹׁנֹת
  english_pob_choice: the former things
  chosen_korean: 이전의 일들
  alternatives_korean:
  - 옛 일들
  - 먼저 일어난 일들
  lexicon: HALOT
  rationale: 이사야의 관용구인 ‘former things’의 예언적·역사적 앞선 일들을 드러내면서도, 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: וְיִצְדָּקוּ
  english_pob_choice: that they may be justified
  chosen_korean: 자신들이 옳음을 입증하게 하십시오
  alternatives_korean:
  - 자신들이 옳다고 인정받게 하십시오
  - 자신들이 의롭다 함을 받게 하십시오
  lexicon: HALOT
  rationale: 법정 맥락의 צדק을 단순 신학 용어로 좁히지 않고, ‘옳음이 입증되다’라는 판정적 의미로 살렸습니다.
theological_decisions:
- issue: 법정 장면에서의 ‘옳음/의롭다 함’ 표현
  chosen_reading: 이 구절은 열방을 향한 소송 장면이므로, 구원론적 ‘의롭다 함’보다 증거로 판정받는 ‘옳음의 입증’으로 읽었습니다.
  alternative_readings:
  - 그들이 의롭다 함을 받게 하십시오
  - 그들이 정당하다고 판정받게 하십시오
  rationale: 문맥상 야훼의 주권을 입증하는 법정 대결이 핵심이므로, 후대 교리적 용례를 직접 유입하지 않도록 했습니다.
  doctrine_reference: 이사야 43장의 열방 소송 문맥; 번역 원칙 §§1, 3, 6
