id: ISA.43.2
reference: Isaiah 43:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תַעֲבֹ֤ר בַּ/מַּ֨יִם֙ אִתְּ/ךָ אָ֔נִי וּ/בַ/נְּהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/ךָ כִּֽי תֵלֵ֤ךְ בְּמוֹ אֵשׁ֙ לֹ֣א תִכָּוֶ֔ה וְ/לֶהָבָ֖ה לֹ֥א תִבְעַר בָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
  footnotes:
  - marker: a
    text: Or 'they will not overwhelm you.' The Hebrew verb can denote flooding over, washing away, or overwhelming.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not be burned.' The Hebrew distinguishes this clause from the next, which more directly says 'the flame will not burn you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 물을 지날 때에 내가 너와 함께하겠습니다. 네가 강들을 지날 때에도 그것들이 너를 휩쓸지 않을 것입니다.[a] 네가 불 속을 걸어갈 때에도 그슬리지 않을 것이며,[b] 불꽃이 너를 태우지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들이 너를 압도하지 않을 것입니다.’ 히브리어 동사는 물이 넘쳐흐르며 덮치거나 휩쓸어 가는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불에 타지 않을 것입니다.’ 히브리어는 이 절의 ‘그슬리다/화상을 입다’라는 표현을 다음 절의 ‘불꽃이 너를 태우다’라는 더 직접적인 표현과 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תַעֲבֹר
  english_pob_choice: When you pass through
  chosen_korean: 네가 … 건널 때에도
  alternatives_korean:
  - 네가 … 지날 때에도
  - 네가 … 통과할 때에도
  lexicon: HALOT
  rationale: כִּי가 시간적 상황을 여는 용법이므로 ‘-할 때에도’로 옮겨, 조건문처럼 들리는 뉘앙스를 피했습니다. תַעֲבֹר의 이동 이미지는 물을 ‘건너다’가 가장 자연스럽고 구체적입니다.
- source_word: בַּמַּיִם / וּבַנְּהָרוֹת
  english_pob_choice: the waters / the rivers
  chosen_korean: 물가 / 강들
  alternatives_korean:
  - 물들 / 물
  - 물속 / 강물
  lexicon: HALOT
  rationale: 히브리어 복수형의 생생한 시적 이미지는 살리되, 한국어에서는 단순한 물질보다 위험한 수역을 가리키는 ‘물가’와 ‘강들’이 문맥상 더 자연스럽습니다.
- source_word: לֹא יִשְׁטְפוּךָ
  english_pob_choice: they will not sweep over you
  chosen_korean: 너를 휩쓸지 못할 것입니다
  alternatives_korean:
  - 너를 넘쳐흐르지 못할 것입니다
  - 너를 덮쳐 삼키지 못할 것입니다
  lexicon: HALOT
  rationale: שטף의 홍수·범람·휩쓸림의 의미를 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다. 영어 POB의 ‘sweep over’와도 맞닿으면서 자연스럽습니다.
- source_word: לֹא תִכָּוֶה / לֹא תִבְעַר
  english_pob_choice: you will not be scorched / the flame will not burn you
  chosen_korean: 네가 그슬리지 않을 것이며, 불꽃이 너를 태우지 못할 것입니다
  alternatives_korean:
  - 네가 타지 않을 것이며, 불꽃이 너를 태우지 못할 것입니다
  - 네가 불에 데지 않을 것이며, 불꽃이 너를 태우지 못할 것입니다
  lexicon: HALOT
  rationale: 첫 절의 כוה는 두 번째 절의 בער와 구별해 ‘그슬리다’로 옮겨 중복을 피했습니다. 후속 절의 ‘태우다’는 בער의 직접적 의미를 살립니다.
theological_decisions:
- issue: 재난 이미지의 범위와 약속의 성격
  chosen_reading: 이 구절은 하나님이 물과 불 같은 극한의 위험 속에서도 함께하시고 보존하신다는 약속으로 읽되, 고난 자체가 전혀 없어진다는 뜻으로 과장하지는 않습니다.
  alternative_readings:
  - 오직 상징적 영적 시련만을 가리킨다는 읽기
  - 믿는 이가 어떤 물리적 해도 입지 않는다는 절대 보장으로 읽기
  rationale: 본문은 구체적 자연 재난 이미지를 통해 임재와 보호를 말하므로, 이미지를 약화하지 않으면서도 무적의 보장으로 과도하게 일반화하지 않는 해석이 문맥에 가장 충실합니다.
  doctrine_reference: 역설적 보호와 고난의 긴장을 유지
