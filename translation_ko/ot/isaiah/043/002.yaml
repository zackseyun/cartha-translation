  to: 네가 물을 지날 때에 내가 너와 함께하겠습니다. 네가 강들을 지날 때에도 그것들이 너를 휩쓸지 않을 것입니다.[a] 네가 불 속을 걸어갈 때에도 그슬리지 않을 것이며,[b] 불꽃이 너를 태우지 않을 것입니다.
  rationale: ‘물가’를 ‘물’로 바로잡아 원문의 수역·위험 이미지를 보존하고, 미래 부정을 한국어의 직접적인 부정 미래형으로 조정했습니다. 또한 각주 표지를 관련 절에 연결하고 b 각주의 어휘 설명을 원문의 두 동사 차이에 맞게 고쳤습니다.
