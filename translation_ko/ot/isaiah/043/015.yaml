  text: אֲנִ֥י יְהוָ֖ה קְדֽוֹשְׁ/כֶ֑ם בּוֹרֵ֥א יִשְׂרָאֵ֖ל מַלְכְּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
  footnotes:
  - marker: a
    text: 'Or ''Yahweh'': Hebrew has the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 야훼, 너희의 거룩한 이스라엘의 창조자, 너희의 왕입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 고유명 יְהוָה를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I am
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 내가
  lexicon: WLC
  rationale: 독립 인칭대명사의 강조를 살리되, 한국어에서는 서술어 없이도 자연스럽게 자기선언으로 들리는 ‘나는’이 가장 근접합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 본문의 고유한 언약명 טetragrammaton을 보존하기 위해 관용적 대체어 ‘주’가 아니라 음역 ‘야훼’를 사용합니다.
- source_word: קְדוֹשְׁכֶם
  english_pob_choice: your Holy One
  chosen_korean: 너희의 거룩한 이
  alternatives_korean:
  - 너희의 거룩하신 분
  - 너희의 거룩한 분
  lexicon: HALOT
  rationale: 관형사형 직역보다 ‘거룩한 이’가 신적 칭호의 인격성을 살리면서도 한국어 문장으로 자연스럽습니다. 2인칭 복수 소유격도 분명히 유지했습니다.
- source_word: בּוֹרֵא
  english_pob_choice: the Creator of
  chosen_korean: 창조자
  alternatives_korean:
  - 창조하시는 이
  - 만드시는 분
  lexicon: HALOT
  rationale: 분사의 칭호적 기능을 반영해 ‘창조자’로 옮겼습니다. 앞뒤의 병렬 구조에서 별도의 관형 표현 없이도 호칭적 힘이 유지됩니다.
- source_word: מַלְכְּכֶם
  english_pob_choice: your King
  chosen_korean: 너희의 왕
  alternatives_korean:
  - 너희 왕
  - 너희의 임금
  lexicon: HALOT
  rationale: 왕권 칭호를 직접적으로 보존하되, 문맥상 이스라엘의 하나님을 가리키는 왕호이므로 평이한 ‘왕’을 택했습니다.
theological_decisions:
- issue: 야훼의 직접 호명과 연속되는 칭호의 병렬성
  chosen_reading: ‘야훼, 너희의 거룩한 이, 이스라엘의 창조자, 너희의 왕’으로 병렬된 호칭을 유지했습니다.
  alternative_readings:
  - ‘야훼, 너희의 거룩하신 분…’처럼 존칭을 강화
  - 중간에 관계절을 넣어 설명적으로 풀기
  rationale: 히브리어는 네 개의 자기계시적 칭호를 압축적으로 나열합니다. 이를 풀어 쓰면 힘이 약해지므로, 한국어에서도 명사구 병렬을 유지했습니다.
  doctrine_reference: 신학적 해석보다 본문의 자기선언적 구조 보존
