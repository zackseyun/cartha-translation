id: ISA.43.1
reference: Isaiah 43:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
  footnotes:
  - marker: a
    text: Or, 'I have called you by name.'
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 야훼께서 말씀하십니다. 야곱아, 너를 지으신 이요 이스라엘아, 너를 빚으신 이가 말씀하십니다. 두려워하지 마십시오. 내가 너를 구속하였고, 네 이름을 불러 너를 불렀으며, 너는 내 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “네 이름으로 너를 불렀으며.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: P Ob의 원칙에 따라 여호와가 아니라 신명사형 고유명사인 야훼를 살렸습니다.
- source_word: בֹּרַאֲךָ / וְיֹצֶרְךָ
  english_pob_choice: he who created you / he who formed you
  chosen_korean: 너를 지으신 이요 / 너를 빚으신 이
  alternatives_korean:
  - 너를 창조하신 이
  - 너를 만드신 이
  - 너를 만드신 이요 너를 지으신 이
  lexicon: HALOT
  rationale: ברא와 יצר의 병행을 살리기 위해 첫째는 ‘지으신 이’, 둘째는 형상화의 뉘앙스를 드러내는 ‘빚으신 이’로 구분했습니다.
- source_word: גְאַלְתִּיךָ
  english_pob_choice: I have redeemed you
  chosen_korean: 내가 너를 구속하였고
  alternatives_korean:
  - 내가 너를 속량하였고
  - 내가 너를 구원하였고
  lexicon: HALOT
  rationale: גאל의 언약적·해방적 힘을 보존하기 위해 ‘구속하다’를 택했습니다. ‘구원하다’보다 소유권과 해방의 결을 함께 드러냅니다.
- source_word: קָרָאתִי בְשִׁמְךָ
  english_pob_choice: I have called you by name
  chosen_korean: 네 이름을 불러 너를 불렀으며
  alternatives_korean:
  - 네 이름으로 너를 불렀으며
  - 내가 네 이름으로 불렀으며
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 부르다’라는 직설적 표현을 살려, 단순한 호칭이 아니라 인격적 소명을 강조했습니다.
theological_decisions:
- issue: גאל의 번역에서 드러나는 구속-소유의 긴장
  chosen_reading: 구속하였고
  alternative_readings:
  - 속량하였고
  - 구원하였고
  rationale: 이 절은 단순한 도움보다 야훼의 언약적 소유권과 해방 행위를 함께 말하므로, ‘구속’이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 6
- issue: ‘너는 내 것이다’의 언약적 소유 선언
  chosen_reading: 너는 내 것입니다
  alternative_readings:
  - 너는 내 사람입니다
  - 너는 내 소유입니다
  rationale: 직설적인 소유 선언을 완곡하게 약화하지 않으면서도, 한국어에서 자연스럽고 존중의 어조를 유지합니다.
  doctrine_reference: Translation philosophy §§3, 6
