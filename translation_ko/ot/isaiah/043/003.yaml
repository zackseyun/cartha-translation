id: ISA.43.3
reference: Isaiah 43:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
  footnotes:
  - marker: a
    text: Or 'instead of you.' The Hebrew phrase at the end of the verse expresses substitution or exchange.
    reason: lexical_alternative
  - marker: b
    text: Cush is the ancient region south of Egypt, often associated with Nubia/Ethiopia.
    reason: cultural_note
translation:
  language: ko
  text: 내가 곧 야훼, 너의 하나님, 이스라엘의 거룩하신 분, 너의 구원자이기 때문입니다. 내가 이집트를 너의 속전으로, 구스[a]와 스바를 너 대신에[b] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 구스는 고대 이집트 남쪽 지역을 가리키며, 누비아/에티오피아와 관련되는 경우가 많습니다.
    reason: cultural_note
  - marker: b
    text: ‘너 대신에’는 본문 끝의 히브리어 표현이 지닌 대체·교환의 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 여호와가 아니라 학술적 음역인 야훼를 사용하여 언약적 신명(神名)의 직접성을 살렸습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 네 하나님
  alternatives_korean:
  - 당신의 하나님
  - 너의 하나님
  lexicon: HALOT
  rationale: 2인칭 단수 소유격을 자연스러운 한국어로 옮기되, 예언적 직접 호소의 관계성을 유지하기 위해 '네 하나님'으로 렌더링했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩한 이
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  lexicon: HALOT
  rationale: 이스라야서의 고유한 칭호로서 관용구적 형태를 살리되, '거룩한 이'로 인격적 호칭을 유지했습니다.
- source_word: מוֹשִׁיעֶךָ
  english_pob_choice: your Savior
  chosen_korean: 네 구원자
  alternatives_korean:
  - 너를 구원하시는 분
  - 네 спас자
  lexicon: HALOT
  rationale: 분사적 칭호를 한국어 명사형 칭호로 자연스럽게 옮겨, 하나님의 구원 행위를 단순 서술이 아니라 정체성 호칭으로 들리게 했습니다.
- source_word: כָפְרְךָ ... תַּחְתֶּיךָ
  english_pob_choice: your ransom ... in exchange for you
  chosen_korean: 네 속전으로 ... 너를 대신하여
  alternatives_korean:
  - 네 속량값으로 ... 너를 대신하여
  - 네 대속물로 ... 네 자리에
  lexicon: HALOT
  rationale: כָפַר 계열의 교환·대가 의미를 살려 '속전'으로 옮기고, 끝의 תַּחְתֶּיךָ는 직역에 가까운 '너를 대신하여'로 처리해 대체/교환의 긴장을 보존했습니다.
theological_decisions:
- issue: 여호와의 '속전' 언어를 구속론 교리로 과도하게 특정할지 여부
  chosen_reading: 국가적 구원 맥락 안에서 하나님이 열국을 '대가/교환'으로 내주시는 강한 대체 언어로 읽고, 이후 체계신학적 속죄 개념은 본문 밖으로 유보했습니다.
  alternative_readings:
  - 속전 표현을 단순한 정치적 보상으로 약화해 읽을 수 있습니다.
  - 후대의 속죄 교리와 직접 연결해 읽을 수 있습니다.
  rationale: 문맥은 이스라엘 보존과 구원에 관한 선언이며, 본문의 교환 이미지를 그대로 살리는 것이 원문의 힘을 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
