id: ISA.43.27
reference: Isaiah 43:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבִ֥י/ךָ הָ/רִאשׁ֖וֹן חָטָ֑א וּ/מְלִיצֶ֖י/ךָ פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
  footnotes:
  - marker: a
    text: Or 'your earliest ancestor sinned.' The phrase 'your first father' may refer generally to Israel's ancestral head rather than naming a specific individual.
    reason: lexical_alternative
  - marker: b
    text: Or 'your interpreters' or 'your mediators.' The Hebrew term can refer to representative leaders who speak on behalf of the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 첫 조상[a]이 죄를 지었고, 네 대변자들[b]이 나를 거슬러 반역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 가장 이른 조상’입니다. ‘네 첫 조상’은 특정 인물의 이름을 밝히기보다 이스라엘의 조상을 대표하는 인물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 해석자들’ 또는 ‘네 중재자들’입니다. 히브리어는 백성을 대표하여 말하는 지도자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  english_pob_choice: your first father
  chosen_korean: 당신의 첫 조상
  alternatives_korean:
  - 당신의 첫 아버지
  - 당신의 첫 선조
  lexicon: HALOT
  rationale: אָבִיךָ는 문자적으로 ‘당신의 아버지’이지만, 영어 POB처럼 대표적/집단적 조상으로 읽히는 여지를 살리기 위해 한국어에서는 ‘첫 조상’으로 옮겨 본문이 특정 인물을 단정하지 않도록 했습니다.
- source_word: מְלִיצֶיךָ
  english_pob_choice: your spokesmen
  chosen_korean: 당신의 대변자들
  alternatives_korean:
  - 당신의 통역자들
  - 당신의 중재자들
  - 당신의 대사들
  lexicon: HALOT
  rationale: מְלִיץ는 대표로 말하는 사람, 해석자, 중개자까지 가리킬 수 있으나, 문맥상 백성을 대표해 말하는 지도자들이라는 점을 살려 ‘대변자들’로 번역했습니다.
- source_word: פָּשְׁעוּ בִי
  english_pob_choice: rebelled against me
  chosen_korean: 나를 거슬러 반역했습니다
  alternatives_korean:
  - 나를 거슬러 죄를 지었습니다
  - 나에게 반항했습니다
  - 나를 거슬러 범죄했습니다
  lexicon: HALOT
  rationale: פָּשַׁע는 단순한 실수보다 계약적·관계적 ‘반역’의 강도가 있으므로, ‘반역했습니다’로 옮겨 원문의 강한 불순종을 드러냈습니다.
theological_decisions:
- issue: ‘당신의 첫 조상’의 특정 인물 동일시
  chosen_reading: 특정 인물을 지목하지 않고 대표적 조상 표현으로 유지했습니다.
  alternative_readings:
  - 아담
  - 아브라함
  - 야곱
  rationale: 히브리어 본문은 누구를 가리키는지 명시하지 않으므로, 본문이 허용하는 모호성을 그대로 보존해 해석을 좁히지 않았습니다.
  doctrine_reference: 본문의 해석 여지를 유지하는 원칙
- issue: 대변자들/중재자들 중 선택
  chosen_reading: ‘대변자들’로 번역해 대표 발언의 의미를 살렸습니다.
  alternative_readings:
  - 중재자들
  - 통역자들
  rationale: 본문은 제사장적 중재를 직접 말하기보다 백성을 대표해 말하는 자들을 가리킬 수 있으므로, ‘중재자들’보다 덜 특정적인 표현을 택했습니다.
  doctrine_reference: 문맥 우선의 어휘 선택
