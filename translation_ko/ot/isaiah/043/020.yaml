revisions:
- from: 들짐승들이 나를 공경할 것입니다. 승냥이와 타조도 그러할 것입니다. 이는 내가 광야에 물을, 메마른 땅에 강들을 두어 내 백성, 내 선택한 자들에게 마시게 하기 때문입니다.[a][b]
  to: 들짐승들, 곧 자칼[a]과 타조가 나를 공경할 것입니다. 내가 광야에 물을 주고 황무지에 강들을 내어 내 백성, 곧 내가 택한 자[b]에게 마실 것을 주기 때문입니다.
  rationale: 자칼과 승냥이를 구별하여 어휘 정확성을 높였고, 원문의 단수 בְחִירִי를 본문과 각주에서 모두 보존했습니다. 집합적 해석 가능성은 인정하되 복수형으로 확정하지 않아 원문의 문법과 해석상 여지를 유지했습니다. 각주 표지도 해당 어휘 및 표현 바로 뒤에 배치했습니다.
