id: ISA.43.20
reference: Isaiah 43:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
  footnotes:
  - marker: a
    text: Or 'dragons' for תַּנִּים in older English tradition; the Hebrew here is more likely 'jackals.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'daughters of the ostrich,' an idiom for ostriches; older translations sometimes read 'owls.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my chosen'; the Hebrew is singular, likely a corporate reference to Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 들짐승들, 곧 자칼[a]과 타조가 나를 공경할 것입니다. 내가 광야에 물을 주고 황무지에 강들을 내어 내 백성, 곧 내가 택한 자[b]에게 마실 것을 주기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַּנִּים은 이 문맥에서 대체로 ‘자칼’을 가리키는 것으로 이해됩니다. 옛 번역 전통에는 ‘용들’이라는 번역도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 단수 ‘내가 택한 자’입니다. 여기서는 이스라엘 백성을 집합적으로 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  english_pob_choice: will honor me
  chosen_korean: 나를 공경할 것입니다
  alternatives_korean:
  - 나를 영화롭게 할 것입니다
  - 나를 높일 것입니다
  lexicon: HALOT
  rationale: כבד의 사역형은 하나님께 영예를 돌리는 뜻이므로, 현대 한국어에서는 종교적 과장이 덜한 ‘공경하다’가 원뜻을 자연스럽게 살립니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the beasts of the field
  chosen_korean: 들짐승들
  alternatives_korean:
  - 광야의 짐승들
  - 들의 짐승들
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 현대 한국어의 자연스러운 야생동물 표현으로 옮기되, 들판/야지의 의미는 ‘들짐승’이 가장 간결하게 보존합니다.
- source_word: תַּנִּים
  english_pob_choice: jackals
  chosen_korean: 승냥이
  alternatives_korean:
  - 자칼
  - 용들
  lexicon: HALOT
  rationale: 영어 POB가 본문 문맥상 ‘jackals’를 택한 판단을 따라, 한국어에서는 사막·황무지 짐승을 가리키는 토착적 표현인 ‘승냥이’로 옮겨 읽기 쉬운 시적 대구를 살렸습니다.
- source_word: בְנוֹת יַעֲנָה
  english_pob_choice: ostriches
  chosen_korean: 타조
  alternatives_korean:
  - 타조 암컷
  - 부엉이
  lexicon: HALOT
  rationale: 직역하면 ‘타조의 딸들’이지만 관용적으로 타조를 가리키므로, 현대 한국어에서는 의미를 드러내는 ‘타조’가 적절합니다.
- source_word: בַמִּדְבָּר / בִּישִׁימוֹן
  english_pob_choice: in the wilderness / in the wasteland
  chosen_korean: 광야에 / 메마른 땅에
  alternatives_korean:
  - 사막에 / 황무지에
  - 들에 / 황폐한 곳에
  lexicon: HALOT
  rationale: 두 지명어는 서로 다른 황폐함을 병렬로 보여 주므로, ‘광야’와 ‘메마른 땅’으로 구분해 반복을 피하면서도 시적 대조를 유지했습니다.
- source_word: לְהַשְׁקוֹת
  english_pob_choice: to give drink to
  chosen_korean: 마시게 하기
  alternatives_korean:
  - 마시도록 하기
  - 물을 주기
  lexicon: HALOT
  rationale: 목적 부정사의 기능을 한국어의 자연스러운 인과·목적 구조로 풀어, 사람을 대상으로 한 ‘마시게 하다’의 직접성을 보존했습니다.
- source_word: בְחִירִי
  english_pob_choice: my chosen ones
  chosen_korean: 내 선택한 자들
  alternatives_korean:
  - 내 택한 자들
  - 내 선택된 이들
  lexicon: HALOT
  rationale: 영어 POB의 최종 수정처럼 히브리어의 집합적 복수를 드러내기 위해 복수형으로 옮겼고, ‘선택한 자들’은 언약적 선택의 능동성을 비교적 분명하게 전달합니다.
theological_decisions:
- issue: ‘공경하다’의 어조와 야훼에 대한 존칭 처리
  chosen_reading: 들짐승들이 하나님께 돌리는 반응을 ‘공경할 것입니다’로 옮기고, 직접 호칭이 아닌 서술에서는 일반 서술체를 유지했습니다.
  alternative_readings:
  - 나를 영화롭게 할 것입니다
  - 나를 높일 것입니다
  rationale: 이 본문은 피조물이 하나님의 공급을 보고 그분의 가치를 인정하는 장면이므로, ‘공경하다’가 지나치게 교회적이지 않으면서도 כבד의 의미를 살립니다.
  doctrine_reference: 사 43:20의 창조-구속적 찬양 모티프
- issue: ‘내 선택한 자들’의 복수 반영
  chosen_reading: בְחִירִי를 복수적 집합으로 읽어 ‘내 선택한 자들’로 번역했습니다.
  alternative_readings:
  - 내 선택한 자
  - 내 택함 받은 사람
  rationale: 히브리어 최종 수정과 영어 POB의 revised reading이 집합적 복수를 지지하므로, 이스라엘 전체를 가리키는 공동체적 의미를 드러내는 것이 본문에 더 충실합니다.
  doctrine_reference: 번역 철학 §5 (문법 표지의 일관성 및 문맥 반영)
