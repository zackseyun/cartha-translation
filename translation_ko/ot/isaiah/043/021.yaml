translation:
  language: ko
  text: 내가 나를 위하여 빚은 이 백성은 내 찬양을 선포할 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 나를 위하여 지은 이 백성은 내 찬양을 전할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם זוּ
  english_pob_choice: This people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: WLC; HALOT
  rationale: עַם은 특정 집단을 가리키는 ‘백성’이 문맥상 가장 자연스럽고, 하나님과의 언약 관계를 드러내는 데에도 잘 맞습니다. זוּ는 근접 지시로 ‘이’가 적절합니다.
- source_word: יָצַרְתִּי
  english_pob_choice: I formed
  chosen_korean: 지어 세웠습니다
  alternatives_korean:
  - 형성했습니다
  - 만들었습니다
  - 빚었습니다
  lexicon: WLC; HALOT
  rationale: יצר의 핵심은 의도적으로 빚고 형성하는 행위이므로 단순한 ‘만들다’보다 조형·설계의 뉘앙스를 살린 표현을 택했습니다. 다만 한국어에서는 ‘지어 세우다’가 공동체를 의도적으로 세우는 의미를 비교적 자연스럽게 담습니다.
- source_word: לִי
  english_pob_choice: for myself
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 나를 위해
  - 내 것으로
  - 나 자신을 위해
  lexicon: WLC; HALOT
  rationale: לִי는 소유와 목적을 함께 띨 수 있으므로, ‘나를 위하여’로 옮기면 하나님이 친히 의도하여 세우신 대상이라는 점을 분명히 드러낼 수 있습니다.
- source_word: תְּהִלָּתִי
  english_pob_choice: my praise
  chosen_korean: 내 찬양
  alternatives_korean:
  - 내 찬송
  - 나에 대한 찬양
  - 나의 찬양
  lexicon: WLC; HALOT
  rationale: תְּהִלָּה는 ‘찬양/찬송’의 뜻이므로, 현대 한국어에서 더 직접적인 ‘찬양’을 택했습니다. 소유격은 하나님께 돌려지는 찬양이라는 점을 살려 ‘내 찬양’으로 옮겼습니다.
- source_word: יְסַפֵּרוּ
  english_pob_choice: they will declare
  chosen_korean: 선포할 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 전할 것입니다
  - 이야기할 것입니다
  lexicon: WLC; HALOT
  rationale: ספר의 기본 의미인 ‘말하다/알리다/전하다’ 중에서, 예언적이고 공적 선언의 힘을 가장 잘 살리는 표현은 ‘선포하다’입니다. POB의 ‘declare’와도 잘 대응됩니다.
theological_decisions:
- issue: '문장 관계: 형성의 목적/결과와 찬양의 선포'
  chosen_reading: 첫 절반을 하나님의 의도된 형성으로, 후반을 그에 뒤따르는 결과/목적으로 읽어 세미콜론으로 구분했습니다.
  alternative_readings:
  - ‘…내 찬양을 선포하게 하려고’로 목적을 명시하는 읽기
  - 단순한 순차적 미래 진술로 읽기
  rationale: 히브리어는 명시적 목적 접속사를 두지 않지만, 문맥상 하나님이 백성을 지으신 목적이 그의 찬양을 드러내는 데 있습니다. 한국어에서는 과도한 보충 없이 관계를 드러내기 위해 세미콜론과 미래형을 사용했습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense without paraphrastic expansion.'
