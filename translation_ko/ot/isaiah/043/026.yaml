translation:
  language: ko
  text: 나를 기억나게 하십시오. 함께 변론합시다. 당신의 말을 진술하십시오. 그러면 당신이 옳음이 입증될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 심판받읍시다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 의롭다 인정받을 수 있도록’ 혹은 ‘옳다고 판명되도록’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירֵנִי
  english_pob_choice: Remind me
  chosen_korean: 나를 기억나게 하십시오
  alternatives_korean:
  - 나를 상기시키십시오
  - 나를 기억해 주십시오
  lexicon: HALOT
  rationale: 히필 명령형 + 1인칭 단수 목적어는 ‘기억나게 하다/상기시키다’의 사역 의미를 가지므로, 예언적 논쟁문의 도전적인 어조를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: נִשָּׁפְטָה יָחַד
  english_pob_choice: let us argue the case together
  chosen_korean: 함께 변론합시다
  alternatives_korean:
  - 함께 재판받읍시다
  - 함께 시비를 가립시다
  - 함께 심판을 받읍시다
  lexicon: HALOT
  rationale: שפט의 법정적·상호적 용법을 반영해 단순한 ‘심판’보다 쌍방이 법정에 들어가 다투는 느낌을 주는 ‘변론하다’를 택했습니다. ‘함께’는 יָחַד의 공동 참여를 간결하게 살립니다.
- source_word: סַפֵּר אַתָּה
  english_pob_choice: State your case
  chosen_korean: 당신의 말을 진술하십시오
  alternatives_korean:
  - 사정을 설명하십시오
  - 당신의 주장을 밝히십시오
  - 말해 보십시오
  lexicon: HALOT
  rationale: ספר는 여기서 단순한 ‘말하다’보다 법정에서 자신의 주장을 펼치는 진술의 뉘앙스가 강하므로, 포멀한 한국어 법정어감인 ‘진술하다’로 옮겼습니다. 독립 대명사 אַתָּה의 강조는 한국어 어순상 별도 표시보다 문장 전면의 직접 명령으로 충분히 반영됩니다.
- source_word: תִּצְדָּק
  english_pob_choice: you may be proved right
  chosen_korean: 옳음이 입증될 것입니다
  alternatives_korean:
  - 의롭다고 판명될 것입니다
  - 정당함이 드러날 것입니다
  - 의롭다 함을 받게 될 것입니다
  lexicon: HALOT
  rationale: 사법적 문맥의 צדק을 바울적 ‘칭의’ 용어로 고정하기보다, 이사야 본문의 변론 장면에 맞게 ‘옳다/옳음’의 판정 어휘로 옮겼습니다. 주어를 직역해 어색해지는 대신 결과를 명시한 수동 표현으로 현대 한국어의 자연스러움을 확보했습니다.
theological_decisions:
- issue: צדק의 신학적 중량을 어떻게 처리할지
  chosen_reading: ‘의롭다’보다 ‘옳음/입증됨’으로 옮겨 법정적 정당성은 살리되, 바울 서신의 칭의 교리 용어로 미리 수렴하지 않았습니다.
  alternative_readings:
  - ‘당신이 의롭다 인정받을 것입니다’
  - ‘당신이 칭의될 것입니다’
  - ‘당신이 옳다고 판정될 것입니다’
  rationale: 본문은 야훼의 도전적 법정 변론이며, 핵심은 상대의 주장이 실제로 옳은지 드러내는 데 있습니다. 따라서 교리적 해석을 앞당기기보다 원문의 논쟁 구조를 보존하는 것이 바람직합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; do not import doctrinal claims the text does not make.'
