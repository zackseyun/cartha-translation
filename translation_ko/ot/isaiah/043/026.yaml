  source_fidelity: 첫 명령은 히필 명령형으로 ‘나에게 상기시키십시오’가 가장 직접적입니다. נִשָּׁפְטָה는 상호적인 법정 절차의 제안으로 ‘함께 변론합시다’가 적절합니다. 마지막 לְמַעַן은 단순 결과의 ‘그러면’보다 목적을 나타내는 ‘~하도록’으로 옮겨야 하며, תִּצְדָּק의 법정적 ‘옳다고 판명되다’도 보존됩니다.
