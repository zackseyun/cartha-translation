  lexicon: HALOT
  rationale: 문맥상 사람보다 신격을 가리키는 함의가 강하므로, 영어 POB의 해석을 과도하게 고정하지 않으면서도 우상 신의 대비를 드러내는 ‘낯선 신’으로 옮겼습니다.
- source_word: עֵדַי
  english_pob_choice: my witnesses
  chosen_korean: 내 증인입니다
