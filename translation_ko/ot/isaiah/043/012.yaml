  lexicon: HALOT
  rationale: 1인칭 소유 접미사의 직접적 소유 관계를 한국어로 자연스럽게 반영했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식은 한국어 성경 전통에서도 관용적으로 처리되지만, 본 परिय의 기준에 따라 신명은 ‘야훼’로 유지하고 선언 공식은 문맥에 맞게 격식 있게 옮겼습니다.
- source_word: וַאֲנִי אֵל
  english_pob_choice: and I am God
  chosen_korean: 나는 하나님입니다
  alternatives_korean:
