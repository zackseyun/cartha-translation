  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서 자연스럽게 살리기 위해 ‘내가 친히’로 옮겼습니다.
- source_word: הִגַּדְתִּי וְהוֹשַׁעְתִּי וְהִשְׁמַעְתִּי
