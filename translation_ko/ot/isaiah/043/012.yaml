  lexicon: HALOT
  rationale: 세 동사의 연속성을 살리되, 첫째는 공적 선언, 둘째는 구원 행위, 셋째는 알림/전달의 뉘앙스를 각각 구분하여 옮겼습니다.
- source_word: זָר
