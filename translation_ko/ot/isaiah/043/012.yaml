theological_decisions:
- issue: וְאֵין בָכֶם זָר의 의미
  chosen_reading: ‘낯선 신’으로 번역해 우상 신을 가리키는 문맥적 힘을 드러냈습니다.
  alternative_readings:
  - 낯선 사람
  - 외국인
  rationale: 본문의 전후맥락은 여호와의 유일한 구원자·증인 지위를 강조하므로, 사회적 낯선 사람보다 신적 경쟁자를 가리키는 의미가 더 적절합니다.
  doctrine_reference: '문맥 우선 원칙: 본문이 요구하는 신학적 대조를 보존합니다.'
- issue: יְהוָה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
