  edition: WLC
  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
  footnotes:
  - marker: a
    text: Or, 'there was no stranger among you.' The Hebrew word can mean 'strange/foreign one,' but in this context it likely refers to a foreign god.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 친히 선포하였고 구원하였으며 알렸습니다. 너희 가운데에는 이방 신이 없었습니다. 너희는 나의 증인입니다. 야훼께서 말씀하십니다. 나는 하나님입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 가운데에는 낯선 이가 없었다.’ 히브리어 זָר는 ‘낯선 이’ 또는 ‘외국의 존재’를 뜻할 수 있으나, 이 문맥에서는 이방 신을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
