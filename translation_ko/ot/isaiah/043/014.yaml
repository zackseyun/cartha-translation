id: ISA.43.14
reference: Isaiah 43:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
  footnotes:
  - marker: a
    text: Or 'and I will bring down all of them as bars'; the Hebrew word rendered 'fugitives' is difficult and has also been understood to refer to 'bars' or, less likely, 'nobles.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I have sent against Babylon.' The Hebrew literally says 'I have sent to Babylon,' with the object left implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 말씀하십니다. "너희의 구속자, 이스라엘의 거룩한 분이 이처럼 말씀하십니다. 너희를 위하여 내가 바벨론으로 보내어 그들 모두를 도망자로, 곧 갈대아 사람들을 그들의 환호의 배들 가운데로 끌어내렸습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨론에 맞서 보냈다’. 히브리어는 문자적으로 ‘바벨론으로 보냈다’라고 하며, 목적어가 생략되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들 모두를 막대로 끌어내리겠다’; 여기의 히브리어는 난해하며, ‘막대들’ 또는 덜 가능하게는 ‘귀인들’로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와가 아니라 학술적 음역인 야훼를 사용하여 언약적 고유성을 보존합니다.
- source_word: גֹּאַלְכֶם
  english_pob_choice: your Redeemer
  chosen_korean: 너희의 구속자
  alternatives_korean:
  - 너희의 되찾아 주시는 분
  - 너희의 속량자
  lexicon: HALOT
  rationale: 이사야에서 גאל은 단순한 회복보다 언약적 구원 행위를 가리키므로, ‘구속자’가 가장 압축적으로 그 의미를 살립니다.
- source_word: בָרִיחִים
  english_pob_choice: as fugitives
  chosen_korean: 도망자로
  alternatives_korean:
  - 바리힘으로
  - 바들로
  - 도망하는 자들로
  lexicon: HALOT
  rationale: 이 어휘는 난해하므로 본문 맥락상 ‘도망자’로 옮기되, 본뜻의 불확실성은 유보합니다.
- source_word: בָּאֳנִיּוֹת רִנָּתָם
  english_pob_choice: in the ships of their rejoicing
  chosen_korean: 그들의 환호의 배들 가운데로
  alternatives_korean:
  - 그들의 기쁨의 배들 가운데로
  - 그들의 환호하는 배들 안으로
  lexicon: HALOT
  rationale: 직역에 가까운 구조를 유지하되, רִנָּתָם의 기쁨/환호를 ‘환호’로 살려 바벨론의 자축이 심판의 장면과 대비되게 했습니다.
theological_decisions:
- issue: בָרִיחִים의 난해한 의미를 어떻게 드러낼지
  chosen_reading: 본문에는 ‘도망자로’라고 자연스럽게 옮기되, 확정적 해석처럼 보이지 않도록 과도한 해설어를 넣지 않았습니다.
  alternative_readings:
  - 막대들로
  - 귀인들로
  rationale: 히브리어가 불확실하므로 의미상 가장 가능한 방향을 택하되, 본문이 가진 긴장을 평탄화하지 않는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: ambiguity should be preserved where genuine'
