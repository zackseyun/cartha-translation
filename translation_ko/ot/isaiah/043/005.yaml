id: ISA.43.5
reference: Isaiah 43:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
  footnotes:
  - marker: a
    text: Hebrew 'your offspring' is a collective singular; alternatively, 'your descendants.'
    reason: lexical_alternative
  - marker: b
    text: The singular 'you' addresses Israel/Jacob corporately.
    reason: cultural_note
translation:
  language: ko
  text: 두려워하지 마십시오. 내가 당신과 함께합니다. 동쪽에서 내가 당신의 씨[a]를 데려오고, 서쪽에서 내가 당신을 모을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '씨'는 집합적 단수이며, '자손'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 '당신'은 이스라엘/야곱을 공동체로 가리키는 단수입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 마세요
  - 무서워하지 마십시오
  - 두려워하지 말아라
  lexicon: HALOT
  rationale: 금지 표현 אל + תִּירָא의 직접적인 금지 의미를 살리면서, 예언적 권면에 맞는 현대 표준어 합쇼체로 옮겼습니다.
- source_word: אִתְּךָ אָנִי
  english_pob_choice: I am with you
  chosen_korean: 내가 당신과 함께합니다
  alternatives_korean:
  - 내가 너와 함께합니다
  - 내가 당신 곁에 있습니다
  lexicon: HALOT
  rationale: 히브리어의 존재 진술을 자연스러운 한국어로 옮기되, 하나님의 임재 약속을 분명하게 전달하도록 했습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 당신의 씨
  alternatives_korean:
  - 당신의 자손
  - 당신의 후손
  - 당신의 자녀들
  lexicon: HALOT
  rationale: 원어의 집합적 단수인 זרע를 보존하기 위해 직역성 있는 '씨'를 채택했습니다. 전통적 교회 번역보다 낯설 수 있지만, 본문의 언약적·집합적 뉘앙스를 가장 직접적으로 드러냅니다.
- source_word: אֲקַבְּצֶךָּ
  english_pob_choice: I will gather you
  chosen_korean: 내가 당신을 모을 것입니다
  alternatives_korean:
  - 내가 당신을 모으겠습니다
  - 내가 당신을 모아들이겠습니다
  - 내가 당신을 집결시키겠습니다
  lexicon: HALOT
  rationale: קבץ의 기본 의미인 '모으다'를 살려, 귀환/회복을 암시하되 원문에 없는 '돌아오게 하다'는 덧붙이지 않았습니다.
theological_decisions:
- issue: 이스라엘을 향한 2인칭 단수의 유지
  chosen_reading: 한국어에서도 일관되게 2인칭 단수의 존칭 호칭을 유지했습니다.
  alternative_readings:
  - 당신들
  - 너희
  rationale: 히브리어가 공동체 전체를 단수로 부르는 예언체를 보존하기 위해, 본문에는 복수화하지 않았습니다. 한국어에서는 '당신'이 단수이면서도 공동체 지시를 과도하게 해체하지 않아 적합합니다.
  doctrine_reference: 'Translation philosophy #1, #3, #5'
