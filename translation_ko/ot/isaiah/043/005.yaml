    rationale: 영어 본문에서 [a]는 ‘fear’ 뒤에 있으나 각주 a는 ‘your offspring’을 설명하고, [b]는 ‘offspring’ 뒤에 있으나 각주 b는 단수 ‘you’를 설명합니다. 한국어 개정문에서는 각주를 실제 설명 대상인 ‘자손’과 ‘당신’에 각각 붙여 이 불일치를 재현하지 않습니다.
