id: ISA.43.10
reference: Isaiah 43:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
  footnotes:
  - marker: a
    text: Or 'and believe in me' or 'and trust me.' The Hebrew can express trusting or believing with God as the object; 'believe me' preserves the direct force here.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''that I am the one.'' Hebrew: ''that I am he,'' a compact formula of divine self-identification used in Isaiah.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew is elliptical: ''and after me there will not be.'' The implied sense is ''there will be no god'' or ''there will be none.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 내 증인입니다[a], 야훼의 말씀입니다. 그리고 내가 선택한 내 종입니다. 이는 당신들이 알고, 나를 믿으며, 내가 그인 줄 이해하게 하려는 것입니다. 내 앞에서 신은 하나도 만들어진 적이 없었고[c][b], 내 뒤에도 아무도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 믿으며”가 아니라, 히브리어는 ‘나를 믿다/신뢰하다’의 직접 관계를 나타낼 수 있습니다. 여기서는 동사와 목적어의 힘을 살려 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 압축적으로 ‘내 뒤에는 없을 것이다’라고 되어 있습니다. 뜻은 ‘그런 신은 없을 것이다’ 또는 ‘아무도 없을 것이다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “내가 그인 것이다.” 히브리어의 ‘내가 그이다’라는 짧은 자기식별 공식을 풀이한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדַי
  english_pob_choice: my witnesses
  chosen_korean: 내 증인들
  alternatives_korean:
  - 내 증인
  - 나의 증인들
  lexicon: HALOT
  rationale: 복수형 명사에 1인칭 단수 소유격이 붙은 형태이므로 복수를 살려 옮겼습니다. 한국어에서는 호칭으로 자연스럽게 ‘당신들은 내 증인입니다’라고 풀어, 증인됨의 직접성을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식을 현대 한국어에서 자연스럽고 엄숙하게 전달하기 위해 ‘말씀입니다’를 택했습니다. 본문에서 신적 발화의 권위를 분명히 드러냅니다.
- source_word: וְעַבְדִּי
  english_pob_choice: and my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종님
  - 내 일꾼
  lexicon: HALOT
  rationale: 이사야 문맥에서 언약적·대표적 호칭으로 쓰인 עבד를 ‘종’으로 옮겼습니다. 전통적 교회어 ‘종’이 본문 의미를 가장 직접적으로 반영합니다.
- source_word: וְתַאֲמִינוּ לִי
  english_pob_choice: and believe me
  chosen_korean: 나를 믿으며
  alternatives_korean:
  - 나를 믿고
  - 내 말을 믿으며
  - 나를 믿고 의지하며
  lexicon: HALOT
  rationale: לִי가 지시하는 직접적 대상관계를 살려 ‘나를 믿다’로 옮겼습니다. 영어 POB의 ‘believe me’가 아니라, 히브리어의 관계적·신뢰적 뉘앙스를 한국어에서 자연스럽게 풀어 반영했습니다.
- source_word: כִּי אֲנִי הוּא
  english_pob_choice: that I am he
  chosen_korean: 내가 그인 줄
  alternatives_korean:
  - 내가 그인 것을
  - 내가 바로 그인 줄
  - 내가 그입니다
  lexicon: HALOT
  rationale: 이사야에 반복되는 자기계시 관용구를 한국어에서 지나치게 해석하지 않으면서도 의미가 드러나도록 옮겼습니다. 직역의 경직성을 피하고 합쇼체 문맥에 맞게 정리했습니다.
theological_decisions:
- issue: ‘my servant’의 지시 대상
  chosen_reading: 이곳에서는 집단적 이스라엘/야곱을 가리키는 표현으로 유지합니다.
  alternative_readings:
  - 개별 메시아적 종
  - 예언자적 대표자
  rationale: 문맥의 ‘당신들은 내 증인입니다’가 분명한 복수 호칭이므로, singular ‘종’을 그대로 살리되 특정 인물로 환원하지 않았습니다. 본문이 허용하는 신학적 긴장을 보존합니다.
  doctrine_reference: 본문 우선 원칙; 문맥이 허용하는 범위를 넘는 메시아적 확정 해석을 피함
- issue: ‘אֲנִי הוּא’의 번역
  chosen_reading: ‘내가 그인 줄’이라는 관용구를 유지합니다.
  alternative_readings:
  - 내가 그입니다
  - 내가 바로 그입니다
  - 나는 있다
  rationale: 이 표현은 이사야의 핵심 자기계시 공식이므로, 후대적 신학을 앞세워 재구성하지 않고 히브리어 관용을 그대로 살렸습니다. 다만 한국어 문장에서는 독자가 이해할 수 있도록 ‘줄’ 구조로 정리했습니다.
  doctrine_reference: 원문 관용구 보존; 해석 과잉 방지
