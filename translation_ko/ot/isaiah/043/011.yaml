lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  english_pob_choice: I, I am
  chosen_korean: 나, 곧 나
  alternatives_korean:
  - 나, 나
  - 나, 이 몸이
  lexicon: HALOT
  rationale: 중복된 독립 인칭대명사의 강조를 한국어에서도 반복으로 살리되, 합쇼체 서술과 충돌하지 않도록 ‘곧’으로 자연스러운 강조를 보완했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥의 신적 고유명사는 전통적 호칭이 아니라 음역형 ‘야훼’로 옮겨, 본문이 직접 말하는 하나님의 이름을 보존했습니다.
- source_word: מִבַּלְעָדַי
  english_pob_choice: besides me
  chosen_korean: 나 외에는
  alternatives_korean:
  - 나를 떠나서는
  - 나와 함께하지 않고는
  lexicon: HALOT
  rationale: 배타성을 가장 간결하게 드러내는 현대 한국어 표현으로 옮겼으며, ‘~외에는’이 원문의 존재론적 배제를 잘 반영합니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구해 주는 이
  - 구원하는 이
  lexicon: HALOT
  rationale: 히브리어 분사형의 실체적 의미를 한국어에서 가장 자연스럽게 나타내는 명사로 ‘구원자’를 선택했습니다.
theological_decisions:
- issue: 야훼의 유일한 구원자 됨
  chosen_reading: 나 외에는 구원자가 없습니다
  alternative_readings:
  - 나 외에는 구원하는 이가 없습니다
  - 나를 떠나서는 구원자가 없습니다
  rationale: 본문의 핵심 신학은 야훼만이 유일한 구원자라는 배타적 선언이므로, 이를 완화하지 않고 직접적으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
