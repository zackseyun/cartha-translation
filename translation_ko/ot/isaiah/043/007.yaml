  source_fidelity: 히브리어의 집합적 단수와 세 동사(창조하다–빚다–만들다), 그리고 אַף의 강조는 대체로 잘 반영되었습니다. 그러나 본문의 ‘만들 사람입니다’는 앞의 ‘모든 사람’과 결합할 때 미래 관형어처럼 읽혀, 완료된 하나님의 행위를 정확히 전달하지 못합니다.
