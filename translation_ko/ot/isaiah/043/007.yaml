translation:
  language: ko
  text: 내 이름으로 불린 모든 사람, 곧 내가 나의 영광을 위해 창조하고, 빚었으며, 참으로 만들 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 이름으로 불린 모든 사람, 내가 나의 영광을 위해 그를 창조하고, 그를 빚었으며, 참으로 그를 만들었습니다.’라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנִּקְרָא
  english_pob_choice: everyone who is called
  chosen_korean: 내 이름으로 불린 모든 사람
  alternatives_korean:
  - 내 이름으로 불린 모든 이
  - 내 이름으로 불린 자마다
  lexicon: HALOT
  rationale: 집합적 대상을 자연스럽게 살리기 위해 ‘모든 사람’으로 옮기되, 수동형 ‘불린’으로 호출/명명된 상태를 반영했습니다.
- source_word: בִשְׁמִי
  english_pob_choice: by my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름에 의해
  - 내 이름 안에서
  lexicon: HALOT
  rationale: 히브리어 ‘불리다’와 결합한 이름 소속·동일시의 관용을 한국어에서는 ‘~으로 불리다’가 가장 자연스럽게 드러냅니다.
- source_word: וְלִכְבוֹדִי
  english_pob_choice: for my glory
  chosen_korean: 나의 영광을 위해
  alternatives_korean:
  - 나의 영광을 위하여
  - 나의 영광 때문에
  lexicon: HALOT
  rationale: 목적/지향의 יחס을 분명히 하면서, כבוד의 핵심 의미를 ‘영광’으로 유지했습니다.
- source_word: בְּרָאתִיו / יְצַרְתִּיו / עֲשִׂיתִיו
  english_pob_choice: I created / I formed / I made
  chosen_korean: 창조하고, 빚었으며, 참으로 만들
  alternatives_korean:
  - 창조했고, 형성했고, 만들었습니다
  - 지으시고, 만드시고, 지으셨습니다
  lexicon: HALOT
  rationale: 세 동사의 점층을 살리기 위해 ‘창조하다–빚다–만들다’를 구분했고, ‘빚다’는 יצר의 도예적 형상화 이미지를, ‘참으로’는 אַף의 강조를 반영합니다.
theological_decisions:
- issue: 싱귤러 접미사의 한국어 처리와 성별 중립성
  chosen_reading: ‘그’를 반복하지 않고 ‘모든 사람’에 걸리는 관계절로 처리했습니다.
  alternative_readings:
  - ‘모든 사람, 내가 내 영광을 위해 그를 창조하고…’
  - ‘모든 사람, 내가 내 영광을 위해 그를 창조하였고…’
  rationale: 히브리어의 단수 접미사는 집합적 백성을 대표하는 기능이므로, 한국어에서는 남성 지칭처럼 들릴 수 있는 ‘그’를 생략해 대표성은 유지하고 성별 오해는 줄였습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4, §6
