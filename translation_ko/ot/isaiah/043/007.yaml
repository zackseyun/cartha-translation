  rationale: 문장 종결부의 미래 관형형을 완료된 행위를 나타내는 ‘만든’으로 고치고, 세 창조 동사를 하나의 병렬 관형절로 정리했습니다. 이렇게 하면 집합적 단수인 ‘모든 사람’을 자연스럽게 유지하면서도, 하나님께서 그들을 창조·형성·만드셨다는 히브리어의 반복과 강조를 보존합니다. 각주에는 단수 목적접미사의 반복과 히브리어 어순에 가까운 대안을 제시했습니다.
