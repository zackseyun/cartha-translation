source:
  edition: WLC
  text: הַ/מּוֹצִ֥יא רֶֽכֶב וָ/ס֖וּס חַ֣יִל וְ/עִזּ֑וּז יַחְדָּ֤ו יִשְׁכְּבוּ֙ בַּל יָק֔וּמוּ דָּעֲכ֖וּ כַּ/פִּשְׁתָּ֥ה כָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
  footnotes:
  - marker: a
    text: Or 'like a flax wick'; the Hebrew literally says 'like flax,' evoking something quickly snuffed out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 전차와 말을 끌어내고, 군대와 용사를 함께 쓰러뜨리십니다. 그들은 누워 다시 일어나지 못하며, 아마포처럼 꺼지고 사그라집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아마포’로 옮긴 פִּשְׁתָּה는 문자적으로는 ‘아마’입니다. 여기서는 쉽게 꺼지는 섬유질의 비유를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  english_pob_choice: who brings out
  chosen_korean: 끌어내고
  alternatives_korean:
  - 이끌어내고
  - 꺼내고
  lexicon: HALOT
  rationale: 하필형 분사의 서술적·현재적 힘을 살리면서, 전쟁 말들을 전장 밖으로 ‘끌어내다’는 장면성과 심판의 주도권을 함께 드러냅니다.
- source_word: רֶכֶב וָסוּס
  english_pob_choice: chariot and horse
  chosen_korean: 전차와 말
  alternatives_korean:
  - 병거와 말
  - 전차와 군마
  lexicon: HALOT
  rationale: 히브리어의 군사적 짝을 자연스러운 현대 한국어로 옮기되, 전차는 전통 교회어보다 직설적인 ‘전차’가 본문의 전쟁 이미지를 더 분명히 드러냅니다.
- source_word: חַיִל וְעִזּוּז
  english_pob_choice: army and mighty one
  chosen_korean: 군대와 용사
  alternatives_korean:
  - 군대와 힘센 자
  - 군대와 강한 자
  lexicon: HALOT
  rationale: חַיִל의 집합적 군사력과 עִזּוּז의 사람 지시적 뉘앙스를 함께 살려, 추상명사보다 전투 맥락에 맞는 인물 표현인 ‘용사’를 택했습니다.
- source_word: דָּעֲכוּ כַּפִּשְׁתָּה כָבוּ
  english_pob_choice: they are extinguished, quenched like flax
  chosen_korean: 아마포처럼 꺼지고 사그라집니다
  alternatives_korean:
  - 마치 아마처럼 꺼집니다
  - 아마 심지처럼 꺼지고 꺼집니다
  lexicon: HALOT
  rationale: 두 개의 소멸 동사를 한국어의 유사 어감으로 중첩해 불이 꺼지는 이미지를 살렸고, פִשְׁתָּה를 단순 ‘아마’보다 ‘아마포’로 옮겨 쉽게 꺼지는 섬유 이미지를 더 분명히 했습니다.
theological_decisions:
- issue: 히브리어의 군사적 심판 이미지와 역사적 암시
  chosen_reading: 본문의 일반적 군사 묘사를 유지하고, 특정 사건명은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 애굽/바로의 군대로 명시하는 번역
  rationale: 문맥상 출애굽을 강하게 암시하지만, כאן은 ‘전차, 말, 군대, 용사’를 말할 뿐이므로 본문이 직접 말하지 않는 역사적 특정화를 피하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 원칙
- issue: 말씀의 시제와 심판의 생생함
  chosen_reading: 현재형에 가까운 서술로 옮겨 심판의 생생한 진행감을 살렸습니다.
  alternative_readings:
  - 과거형 중심으로 옮겨 역사적 사건성을 강조
  rationale: 히브리어 분사와 동사열의 시각적 효과를 살리면, 하나님이 지금도 אויב를 무너뜨리시는 분이라는 시적·신학적 긴장이 보존됩니다.
  doctrine_reference: 번역 철학 §3
