  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
  footnotes:
  - marker: a
    text: Or 'you have not called me'; the Hebrew verb can be rendered simply 'call,' but in contexts of prayer or worship it often means 'call on.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you have grown weary with me.' The Hebrew preposition allows a close alternative, though 'weary of me' is the more natural sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 나를 부르지 않았습니다, 야곱아. 네가 나를 싫증내었기 때문입니다, 이스라엘아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나를 불렀다'. 히브리어 동사는 단순히 '부르다'로도 옮길 수 있지만, 기도나 예배 문맥에서는 흔히 '부르짖다/부르다(기도하다)'의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나와 함께 지쳤다'. 히브리어 전치사는 가까운 대안을 허용하지만, 문맥에서는 '나를 싫증내다/나에게 지치다'가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  english_pob_choice: Yet ... not
  chosen_korean: 그러나 ... 않았습니다
  alternatives_korean:
  - 그런데 ... 않았습니다
  - 하지만 ... 않았습니다
  lexicon: WLC/HALOT
  rationale: 문맥상 앞선 책망과의 대조가 있으므로 반전 접속을 살려 '그러나'로 옮겼습니다.
- source_word: קָרָאתָ
  english_pob_choice: have not called on
  chosen_korean: 부르지 않았습니다
  alternatives_korean:
  - 호소하지 않았습니다
  - 불러드리지 않았습니다
  lexicon: WLC/HALOT
  rationale: 이 동사는 하나님께 대한 기도·호명의 맥락에서 '부르다/부르짖다'의 의미가 자연스러우므로, 한국어에서도 직접적이고 과도하게 풀지 않게 옮겼습니다.
- source_word: יָגַעְתָּ בִּי
  english_pob_choice: have grown weary of me
  chosen_korean: 나를 싫증내었기 때문입니다
  alternatives_korean:
  - 나를 외면하게 되었기 때문입니다
  - 나에게 지치게 되었기 때문입니다
  lexicon: WLC/HALOT
  rationale: בִּי는 문맥상 '나를/나에게 싫증내다, 지치다'의 관계를 나타내며, 단순한 육체적 피로보다 관계적 소진을 드러내는 표현으로 한국어에 자연스럽게 옮겼습니다.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  english_pob_choice: Jacob / Israel
  chosen_korean: 야곱아 / 이스라엘아
  alternatives_korean:
  - 야곱 / 이스라엘
  lexicon: WLC/HALOT
  rationale: 두 이름을 병렬 호격으로 유지해 언약 백성을 직접 책망하는 어조를 보존했습니다.
theological_decisions:
- issue: ‘call on me’의 기도적 함의
  chosen_reading: 하나님께 부르짖거나 찾는 예배적·기도적 의미를 드러내도록 번역했습니다.
  alternative_readings:
  - 단순히 '나를 부르다'로만 이해할 수 있습니다.
  rationale: 히브리어 קרא는 하나님을 향한 호소와 기도를 포함할 수 있으므로, 문맥상 관계적 책망을 살리기 위해 예배적 함의를 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
