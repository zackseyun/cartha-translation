  lexicon: WLC/HALOT
  rationale: בִּי는 문맥상 '나를/나에게 싫증내다, 지치다'의 관계를 나타내며, 단순한 육체적 피로보다 관계적 소진을 드러내는 표현으로 한국어에 자연스럽게 옮겼습니다.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  english_pob_choice: Jacob / Israel
  chosen_korean: 야곱아 / 이스라엘아
  alternatives_korean:
  - 야곱 / 이스라엘
  lexicon: WLC/HALOT
  rationale: 두 이름을 병렬 호격으로 유지해 언약 백성을 직접 책망하는 어조를 보존했습니다.
theological_decisions:
- issue: ‘call on me’의 기도적 함의
  chosen_reading: 하나님께 부르짖거나 찾는 예배적·기도적 의미를 드러내도록 번역했습니다.
  alternative_readings:
  - 단순히 '나를 부르다'로만 이해할 수 있습니다.
  rationale: 히브리어 קרא는 하나님을 향한 호소와 기도를 포함할 수 있으므로, 문맥상 관계적 책망을 살리기 위해 예배적 함의를 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
