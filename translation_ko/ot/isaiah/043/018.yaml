lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  english_pob_choice: Do not remember
  chosen_korean: 기억하지 말라
  alternatives_korean:
  - 기억하지 마십시오
  - 되새기지 말라
  - 떠올리지 말라
  lexicon: HALOT
  rationale: 기본 동사 זכר의 금지형을 자연스러운 명령형 부정으로 옮겼습니다. '기억하다'는 원문의 직접성을 살리면서도 문맥상 적절합니다.
- source_word: רִאשֹׁנֹת
  english_pob_choice: the former things
  chosen_korean: 옛일들
  alternatives_korean:
  - 이전 일들
  - 먼저 일어난 일들
  - 옛것들
  lexicon: HALOT
  rationale: '''former things''의 시간적 선행을 한국어에서 간결하게 드러내는 표현으로 ''옛일들''을 택했습니다. 뒤의 ''오래된 것들''과도 평행을 이룹니다.'
- source_word: קַדְמֹנִיּוֹת
  english_pob_choice: the things of old
  chosen_korean: 오래된 것들
  alternatives_korean:
  - 옛것들
  - 옛날 것들
  - 먼 옛일들
  lexicon: HALOT
  rationale: קדמניות는 오래전/옛적의 것들을 가리키므로, 의미를 유지하면서도 시적 평행을 살리는 '오래된 것들'로 옮겼습니다.
- source_word: תִּתְבֹּנָנוּ
  english_pob_choice: consider
  chosen_korean: 깊이 생각하다
  alternatives_korean:
  - 고민하다
  - 주의 깊게 살피다
  - 숙고하다
  lexicon: HALOT
  rationale: 히트폴엘형의 '주의 깊게 숙고하다'는 뜻을 한국어로 자연스럽게 풀어, 단순한 시각적 '보다'보다 내적 숙고를 분명히 했습니다.
theological_decisions:
- issue: 예언적 명령의 어조
  chosen_reading: 두 금지형을 직설적인 명령으로 번역하되, 한국어 합쇼체 문맥에서 권고가 아니라 신적 권면의 강도를 유지했습니다.
  alternative_readings:
  - 부드럽게 권유하는 표현
  - 설명형으로 완화된 표현
  rationale: 이 구절은 새 일을 앞두고 과거에 머물지 말라는 강한 예언적 금지이므로, 어조를 약화하지 않는 것이 본문 의도에 부합합니다.
  doctrine_reference: 이사야 43:18의 문맥상 새 구원의 행위를 앞둔 하나님의 권면
