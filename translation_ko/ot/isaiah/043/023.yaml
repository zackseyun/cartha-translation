  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא הֵבֵ֤יאתָ לִּ/י֙ שֵׂ֣ה עֹלֹתֶ֔י/ךָ וּ/זְבָחֶ֖י/ךָ לֹ֣א כִבַּדְתָּ֑/נִי לֹ֤א הֶעֱבַדְתִּ֨י/ךָ֙ בְּ/מִנְחָ֔ה וְ/לֹ֥א הוֹגַעְתִּ֖י/ךָ בִּ/לְבוֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
  footnotes:
  - marker: a
    text: Or, more literally, 'I have not made you serve with grain offerings.' The Hebrew idiom conveys imposing burdensome service.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 번제의 양을 내게 가져오지 않았고, 당신의 제사로 나를 영화롭게 하지도 않았습니다. 내가 당신에게 곡식 제물로 부담을 지우지도 않았고, 유향으로 당신을 지치게 하지도 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׂה
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양떼
  - 작은 가축
  lexicon: HALOT
  rationale: שֵׂה는 번제 문맥에서 작은 가축, 특히 양을 가리키므로 한국어로는 자연스럽고 정확한 ‘양’이 적절합니다.
- source_word: עֹלֹתֶיךָ
  english_pob_choice: your burnt offerings
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 올라가는 제물
  lexicon: HALOT
  rationale: עֹלָה의 표준 제의 용어를 살려 ‘번제’로 옮기되, 소유격은 뒤의 ‘-의’로 자연스럽게 처리했습니다.
- source_word: כִבַּדְתָּנִי
  english_pob_choice: have you honored me
  chosen_korean: 나를 영화롭게 하지도 않았습니다
  alternatives_korean:
  - 나를 존귀하게 여기지도 않았습니다
  - 나를 존중하지도 않았습니다
  lexicon: HALOT
  rationale: כבד의 기본 의미는 ‘무겁게 하다/존귀하게 하다’이지만, 제사적 경외와 영예의 문맥에서는 ‘영화롭게 하다’가 원문 대비를 잘 드러냅니다.
- source_word: הֶעֱבַדְתִּיךָ
  english_pob_choice: I have not burdened you
  chosen_korean: 부담을 지우지도 않았습니다
  alternatives_korean:
  - 섬기게 하지도 않았습니다
  - 노역시키지도 않았습니다
  lexicon: HALOT
  rationale: 히필 עבד의 ‘일하게 하다/부리지 하다’라는 관용적 뉘앙스를 반영해, POB의 의미를 따라 ‘부담을 지우다’로 자연스럽게 풀었습니다.
- source_word: לְבוֹנָה
  english_pob_choice: frankincense
  chosen_korean: 유향
  alternatives_korean:
  - 프랑킨센스
  - 향
  lexicon: HALOT
  rationale: לְבוֹנָה는 일반적인 ‘향’이 아니라 특정 향료인 frankincense이므로, 한국어 성경에서 통용되는 ‘유향’을 사용했습니다.
theological_decisions:
- issue: 4행 병행문의 의미와 제의 부담의 성격
  chosen_reading: 하나님이 이스라엘에게 과도한 제의 부담을 지운 것이 아니므로, 그들의 제사 소홀은 변명될 수 없다는 책망으로 읽었습니다.
  alternative_readings:
  - 하나님이 제사를 전혀 요구하지 않으셨다는 뜻
  - 제사 제도 자체를 부정하는 뜻
  rationale: 뒤의 ‘부담을 지우다 / 지치게 하다’와의 병행이 수사적 책망을 이룹니다. 따라서 제사 제도 자체를 폐기하는 뜻으로 완화하지 않고, 하나님의 비압박적 태도와 이스라엘의 불충을 함께 살렸습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
