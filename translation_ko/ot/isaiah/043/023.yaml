  naturalness: ‘당신은/당신의’는 현대 한국어에서 다소 표지적일 수 있으나, 하나님이 이스라엘을 직접 책망하는 문맥에서 합쇼체의 2인칭을 명시하고 원문의 단수 호격을 보존하는 안전한 선택입니다. ‘번제에 바칠 양’, ‘나를 공경하다’, ‘부담을 지우다’는 현대적이고 자연스럽습니다.
