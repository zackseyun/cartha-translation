id: ISA.43.25
reference: Isaiah 43:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנֹכִ֨י אָנֹכִ֥י ה֛וּא מֹחֶ֥ה פְשָׁעֶ֖י/ךָ לְמַעֲנִ֑/י וְ/חַטֹּאתֶ֖י/ךָ לֹ֥א אֶזְכֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
  footnotes:
  - marker: a
    text: Or, 'I, even I, am he who blots out your transgressions.'
    reason: lexical_alternative
  - marker: b
    text: '''Blots out'' also may be rendered ''wipes away'' or ''erases.'''
    reason: lexical_alternative
  - marker: c
    text: '''I will not remember'' means God will no longer hold these sins in view against his people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 바로 내가 너의 허물을 나 자신을 위하여 지우고, 너의 죄를 기억하지 않겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나, 바로 내가’는 히브리어에서 1인칭 대명사를 거듭하여 강조한 것을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘지우고’는 ‘닦아 내다’ 또는 ‘말소하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기억하지 않겠습니다’는 단순히 잊는다는 뜻이라기보다, 이 죄들을 더 이상 그들에게 불리하게 문제 삼지 않겠다는 뜻입니다.
    reason: theological_note
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  english_pob_choice: I, I am he
  chosen_korean: 나, 바로 내가
  alternatives_korean:
  - 나, 나 자신이
  - 나, 곧 나다
  lexicon: WLC; HALOT
  rationale: 중첩된 1인칭 대명사의 강조와 이어지는 자기 동일시를 한국어에서 자연스럽게 살리기 위해 ‘나, 바로 내가’로 옮겼습니다. 단순히 ‘내가’로 하면 반복 강조가 약해집니다.
- source_word: מֹחֶה
  english_pob_choice: blots out
  chosen_korean: 지워 버리며
  alternatives_korean:
  - 지워 없애며
  - 말소하며
  lexicon: HALOT
  rationale: 죄를 대상으로 한 מחה의 제거·말소 이미지를 살리되, 한국어에서 ‘지워 버리다’가 삭제의 강한 완결성을 잘 드러냅니다.
- source_word: פְשָׁעֶיךָ
  english_pob_choice: your transgressions
  chosen_korean: 너의 허물
  alternatives_korean:
  - 너의 죄과
  - 너의 반역
  lexicon: HALOT
  rationale: פשע의 ‘반역/위반’ 성격을 살릴 수 있으나, 한국어 본문에서는 신앙 공동체가 즉시 이해하기 쉬운 ‘허물’이 문맥상 자연스럽고, 뒤의 ‘죄’와도 구별됩니다.
- source_word: לְמַעֲנִי
  english_pob_choice: for my own sake
  chosen_korean: 내 자신의 이름을 위하여
  alternatives_korean:
  - 나를 위하여
  - 내 자신의 뜻을 위하여
  lexicon: HALOT
  rationale: 직역은 ‘나를 위하여’이지만, 이사야서에서 하나님의 자기명예/자기이름 중심의 동기를 드러내기 위해 ‘내 자신의 이름을 위하여’로 풀었습니다. 이는 본문의 자기근거성을 분명히 합니다.
- source_word: לֹא אֶזְכֹּר
  english_pob_choice: I will not remember
  chosen_korean: 다시는 기억하지 않겠습니다
  alternatives_korean:
  - 기억하지 않겠습니다
  - 더는 기억하지 않겠습니다
  lexicon: HALOT
  rationale: 하나님이 죄를 ‘기억하지 않겠다’는 것은 단순 망각이 아니라 더 이상 그 죄를 상대로 삼지 않겠다는 언약적 의미입니다. ‘다시는’이 그 효과를 자연스럽게 드러냅니다.
theological_decisions:
- issue: ‘for my own sake’의 신학적 초점
  chosen_reading: 용서는 인간의 가치나 공로가 아니라 하나님의 자기이름과 자기목적에 근거합니다.
  alternative_readings:
  - 용서는 회개한 사람의 자격에 근거합니다.
  - 용서는 주로 인간 편의 필요를 충족하기 위한 것입니다.
  rationale: 히브리어 לְמַעֲנִי를 보존해야 하므로, 용서의 근거를 하나님 자신에게 두는 본문의 초점을 약화시키지 않았습니다.
  doctrine_reference: 이사야 43:25; 번역 원칙 §1, §3
