  source_fidelity: 수정이 필요합니다. 초안의 ‘빼앗아 구출할’은 מִיָּדִי מַצִּיל에 ‘빼앗다’라는 별도의 행위를 보태므로, ‘내 손에서 건져 낼’로 옮겨 원문의 ‘내 손에서 구출하다’라는 뜻을 충실히 반영했습니다. מִיּוֹם의 시간 범위와 יְשִׁיבֶנָּה의 암시된 여성 단수 목적어는 각주에서 열어 두었습니다.
  naturalness: ‘나는 그입니다’는 직역의 의도는 이해되지만 현대 표준 한국어에서 다소 부자연스럽습니다. ‘나는 바로 그입니다’는 אֲנִי הוּא의 엄숙한 자기동일성 선언을 보존하면서도 자연스럽습니다. ‘되돌릴 수 있겠습니까?’는 히브리어 수사 의문의 능력·가능성의 뉘앙스를 자연스럽게 드러냅니다.
  terminology: ‘건져 내다’는 נצל의 구출 의미와 ‘손’의 권세·지배 비유를 유지합니다. ‘행하다’는 פעל의 넓은 의미를 과도하게 특정하지 않습니다. 신적 자기선언은 해석적 교리 용어를 덧붙이지 않고 ‘나는 바로 그입니다’로 처리했습니다.
