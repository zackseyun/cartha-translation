id: ISA.43.13
reference: Isaiah 43:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם מִ/יּוֹם֙ אֲנִ֣י ה֔וּא וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּ֑יל אֶפְעַ֖ל וּ/מִ֥י יְשִׁיבֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
  footnotes:
  - marker: a
    text: Or 'from today on,' 'from ancient days,' or more interpretively 'from eternity.' The Hebrew phrase is concise and can be understood in more than one temporal sense.
    reason: alternative_reading
  - marker: b
    text: Or 'who can reverse it?' The Hebrew literally says 'who can turn it back?' referring to God's action.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그 날부터[a] 나는 바로 그입니다. 내 손에서 건져 낼 자가 없으며, 내가 행하면 누가 그것을 되돌릴 수 있겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘부터’, ‘옛날부터’, 더 해석적으로는 ‘영원부터’로 이해할 수 있습니다. 히브리어 표현이 간결하여 시간적 범위를 여러 방식으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘누가 그것을 되돌릴 수 있겠습니까?’ 히브리어는 문자적으로 ‘누가 그것을 되돌리겠느냐?’라고 말합니다. ‘그것’은 앞의 하나님의 행위를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם / מִיּוֹם
  english_pob_choice: Indeed, from that day on
  chosen_korean: 참으로 그 날부터
  alternatives_korean:
  - 그때부터
  - 그 날 이후로
  - 참으로 지금부터
  lexicon: HALOT
  rationale: גַּם의 강조를 '참으로'로 살리고, מִיּוֹם은 문맥상 이어지는 지속을 나타내므로 '그 날부터'로 옮겨 시간적 시작점을 분명히 했습니다.
- source_word: אֲנִי הוּא
  english_pob_choice: I am he
  chosen_korean: 나는 그입니다
  alternatives_korean:
  - 나는 그입니다
  - 나는 그이십니다
  - 나는 바로 나입니다
  lexicon: HALOT
  rationale: 히브리어의 자가 동일성 공식을 그대로 드러내기 위해 '나는 그입니다'를 택했습니다. 한국어에서 어색할 수 있으나, 본문의 장중한 자기선언을 보존합니다.
- source_word: מִיָּדִי מַצִּיל
  english_pob_choice: can deliver from my hand
  chosen_korean: 내 손에서 빼앗아 구출할 자가 없으며
  alternatives_korean:
  - 내 손에서 구해낼 자가 없으며
  - 내 손에서 건져낼 자가 없으며
  - 내 손에서 구출할 자가 없으며
  lexicon: HALOT
  rationale: מִיָּדִי의 손 이미지를 살리면서, מַצִּיל의 구출/구원 의미를 함께 반영하기 위해 '빼앗아 구출하다'로 옮겼습니다. 단순히 '구해내다'보다 하나님의 손에서 벗어나는 대결 구도를 더 선명하게 드러냅니다.
- source_word: יְשִׁיבֶנָּה
  english_pob_choice: turn it back
  chosen_korean: 그것을 되돌리겠습니까
  alternatives_korean:
  - 그것을 뒤집겠습니까
  - 그것을 되돌릴 수 있겠습니까
  - 그것을 역전시키겠습니까
  lexicon: HALOT
  rationale: שׁוּב의 사역형을 자연스러운 한국어로 옮겨, 하나님의 행위를 '되돌리다'라는 반응적 동작으로 표현했습니다. 지시 대상은 암시된 행위/일을 가리키는 것으로 처리했습니다.
theological_decisions:
- issue: אֲנִי הוּא의 자기 계시 표현을 한국어에서 얼마나 직역할 것인가
  chosen_reading: '''나는 그입니다''로 직역해 본문의 자가 동일성 선언을 보존했습니다.'
  alternative_readings:
  - '''나는 나입니다'''
  - '''나는 그이십니다'''
  - '''나는 바로 나입니다'''
  rationale: 이 구절은 이사야에서 하나님의 독특한 정체성을 드러내는 공식이므로, 해석을 덧씌우기보다 원문의 압축성과 장중함을 유지하는 쪽이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 본문의 신학적 긴장을 보존
