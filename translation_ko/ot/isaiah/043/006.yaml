id: ISA.43.6
reference: Isaiah 43:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
  footnotes:
  - marker: a
    text: Or, 'Give' / 'Do not withhold'; the Hebrew leaves the object implicit, referring to God's scattered people.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the end of the earth'; English also commonly says 'from the ends of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 북쪽에게는 ‘내놓으라’ 하고, 남쪽에게는 ‘붙들어 두지 말라’ 하겠습니다. 내 아들들을 먼 곳에서 데려오고, 내 딸들을 땅 끝에서 데려오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적어를 생략하여 ‘내놓으라’ 또는 ‘내어 주라’의 뜻이 됩니다. 문맥상 흩어진 하나님의 백성을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘땅 끝에서’입니다. 영어처럼 ‘땅의 끝들에서’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַצָּפוֹן / תֵּנִי
  english_pob_choice: to the north, ‘Give them up’
  chosen_korean: 북쪽에게는 ‘내놓으라’
  alternatives_korean:
  - 북쪽에게는 ‘내어 주라’
  - 북쪽에게는 ‘놓아주라’
  lexicon: HALOT
  rationale: 북쪽이 의인화되어 명령을 받는다는 점을 살리되, 생략된 목적어를 한국어에서 자연스럽게 보완해 포로 백성을 풀어 주라는 뜻이 드러나게 했습니다.
- source_word: וּלְתֵימָן / אַל תִּכְלָאִי
  english_pob_choice: and to the south, ‘Do not hold them back’
  chosen_korean: 남쪽에게는 ‘붙들어 두지 말라’
  alternatives_korean:
  - 남쪽에게는 ‘막지 말라’
  - 남쪽에게는 ‘억류하지 말라’
  lexicon: HALOT
  rationale: תימן을 지명 ‘데만’이 아니라 방향 ‘남쪽’으로 이해한 영어 POB의 판단을 따르고, אַל תִּכְלָאִי의 억류·저지를 ‘붙들어 두다’로 옮겨 간결하고 구체적으로 표현했습니다.
- source_word: בָנַי / וּבְנוֹתַי
  english_pob_choice: my sons / and my daughters
  chosen_korean: 내 아들들 / 내 딸들
  alternatives_korean:
  - 내 자녀들
  - 내 자식들
  lexicon: HALOT
  rationale: 히브리어의 성별 구분이 분명하므로 ‘자녀들’로 평준화하지 않고, 원문의 남녀 병렬을 그대로 살렸습니다.
- source_word: מֵרָחוֹק / מִקְצֵה הָאָרֶץ
  english_pob_choice: from far away / from the end of the earth
  chosen_korean: 먼 곳에서 / 땅 끝에서
  alternatives_korean:
  - 멀리서 / 세상 끝에서
  - 아득한 곳에서 / 세상 끝머리에서
  lexicon: HALOT
  rationale: מֵרָחוֹק은 거리감을 자연스럽게 살려 ‘먼 곳에서’로, מִקְצֵה הָאָרֶץ는 문자적 이미지인 ‘땅 끝’을 유지해 이사야의 회복·귀환 어조를 보존했습니다.
theological_decisions:
- issue: 북쪽과 남쪽에 대한 의인화와 귀환 명령의 대상
  chosen_reading: 북쪽과 남쪽은 하나님이 흩어진 자기 백성을 놓아주라고 명령하시는 의인화된 방향들입니다.
  alternative_readings:
  - 단순한 지리적 표현으로서의 북쪽과 남쪽
  - 우주적 세력에 대한 상징적 명령
  rationale: 문맥상 이사야 43장은 이스라엘의 회복과 재집결을 말하며, 이어지는 ‘내 아들들’과 ‘내 딸들’이 누구를 가리키는지 분명히 합니다. 따라서 대상을 포로로 흩어진 언약 백성으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 이스라엘의 회복과 포로 귀환, 하나님의 주권적 부르심
