source:
  edition: WLC
  text: הִנְ/נִ֨י עֹשֶׂ֤ה חֲדָשָׁה֙ עַתָּ֣ה תִצְמָ֔ח הֲ/ל֖וֹא תֵֽדָע֑וּ/הָ אַ֣ף אָשִׂ֤ים בַּ/מִּדְבָּר֙ דֶּ֔רֶךְ בִּֽ/ישִׁמ֖וֹן נְהָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
  footnotes:
  - marker: a
    text: Or 'know it' or 'recognize it.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''in the desert.'' The Hebrew uses two related but distinct terms for barren land: ''wilderness'' and ''wasteland/desolation.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 새로운 일을 하고 있습니다. 지금 그것이 싹트고 있습니다—알지 못하십니까? 내가 광야에 길을, 황무지에 강들을 내겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 알다’ 또는 ‘그것을 알아차리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사막에’로도 옮길 수 있습니다. 히브리어는 황폐한 땅을 가리키는 두 관련 용어, 곧 ‘광야’와 ‘황무지/황폐’의 대구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  - 주목하십시오
  lexicon: HALOT
  rationale: 하나님의 선언적 주의를 끄는 표현으로서, 현대 한국어에서 자연스럽고 공적 경고·선언의 힘을 살리는 명령형 화법을 택했습니다.
- source_word: חֲדָשָׁה
  english_pob_choice: a new thing
  chosen_korean: 새로운 일
  alternatives_korean:
  - 새 일
  - 새로운 것
  - 새 일 하나
  lexicon: HALOT
  rationale: 히브리어의 명사화된 형용사를 한국어에서는 자연스럽게 ‘일’로 풀어, 추상적 새로움이 아니라 하나님의 새 행위를 드러냈습니다.
- source_word: תִצְמָח
  english_pob_choice: it springs up
  chosen_korean: 싹트고 있습니다
  alternatives_korean:
  - 솟아나고 있습니다
  - 피어나고 있습니다
  - 자라고 있습니다
  lexicon: HALOT
  rationale: ‘돋아나다/싹트다’의 식물 은유를 살리되, 현재 진행형으로 임박성과 진행성을 함께 담았습니다.
- source_word: תֵדָעוּהָ
  english_pob_choice: perceive it
  chosen_korean: 알지 못하십니까
  alternatives_korean:
  - 깨닫지 못하십니까
  - 보지 못하십니까
  - 인식하지 못하십니까
  lexicon: HALOT
  rationale: ידע의 기본값인 ‘알다’를 유지하면서, 수사적 질문의 압박감을 살리기 위해 ‘아니냐’보다 공손한 반문형을 사용했습니다.
- source_word: בַּמִּדְבָּר / בִּישִׁימוֹן
  english_pob_choice: in the wilderness / in the wasteland
  chosen_korean: 광야 / 황무지
  alternatives_korean:
  - 광야 / 사막
  - 들판 없는 땅 / 폐허
  - 황야 / 황무지
  lexicon: HALOT
  rationale: 두 개의 관련되지만 다른 황폐 지대를 구분하기 위해 POB의 대비를 따라 ‘광야’와 ‘황무지’를 분리해 옮겼습니다.
- source_word: אָשִׂים
  english_pob_choice: I will even make
  chosen_korean: 내겠습니다
  alternatives_korean:
  - 만들겠습니다
  - 두겠습니다
  - 놓겠습니다
  lexicon: HALOT
  rationale: ‘길’과 ‘강들’에 모두 자연스럽게 결합하는 한국어 동사로서, 창조적 설치의 의미를 살리면서도 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 새로운 일의 범위와 성격
  chosen_reading: 번역은 새 출애굽·새 창조의 이미지를 구체화하되, 단일한 성취로 한정하지 않고 열린 상태로 유지했습니다.
  alternative_readings:
  - 포로 귀환의 직접 예언
  - 종말론적 새 창조
  - 메시아적 구원의 예표
  rationale: 히브리어 본문은 하나님의 새 행위를 강하게 예고하지만, 그 성취 층위를 하나로 닫지 않습니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
