source:
  edition: WLC
  text: עַל כֵּ֖ן יְכַבְּד֣וּ/ךָ עַם עָ֑ז קִרְיַ֛ת גּוֹיִ֥ם עָרִיצִ֖ים יִירָאֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
  footnotes:
  - marker: a
    text: Or 'a mighty people.' The Hebrew adjective can denote strength, might, or fierceness.
    reason: lexical_alternative
  - marker: b
    text: Or 'a city of ruthless peoples.' The Hebrew construct phrase is compressed and may describe a city belonging to or characterized by ruthless nations.
    reason: lexical_alternative
  - marker: c
    text: Or 'stand in awe of you.' The verb can express fear, reverence, or awe depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 강한 백성이 주님을 영화롭게 할 것이며, 무자비한 나라들의 성읍이 주님을 두려워할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: עַז는 강함, 힘, 사나움의 범위를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 압축된 소유/소속 구문은 ‘나라들의 성읍’처럼 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ירא는 문맥에 따라 ‘두려워하다’와 ‘경외하다’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם עָז
  english_pob_choice: a strong people
  chosen_korean: 강한 백성
  alternatives_korean:
  - 힘센 백성
  - 용맹한 백성
  - 강력한 백성
  lexicon: HALOT
  rationale: עַז는 강함, 힘, 사나움의 범위를 가지므로, ‘강한’이 과도한 해석 없이 넓은 의미를 살립니다.
- source_word: יְכַבְּדוּךָ
  english_pob_choice: will honor you
  chosen_korean: 주님을 영화롭게 할 것이며
  alternatives_korean:
  - 주님을 존중할 것이며
  - 주님께 영광을 돌릴 것이며
  - 주님을 높일 것이며
  lexicon: HALOT
  rationale: Piel כבד는 ‘존중하다/영화롭게 하다’의 뜻을 가지며, 여기서는 하나님께 돌려지는 공적 인정의 뉘앙스를 살려 ‘영화롭게 하다’로 옮겼습니다.
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  english_pob_choice: a city of ruthless nations
  chosen_korean: 무자비한 나라들의 성읍
  alternatives_korean:
  - 무자비한 민족들의 성읍
  - 무자비한 나라들의 도시
  - 무자비한 민족의 성읍
  lexicon: HALOT
  rationale: 압축된 소유/소속 구문을 한국어에서도 그대로 드러내기 위해 ‘나라들의 성읍’으로 살렸고, עָרִיצִים는 폭력적 억압의 뜻을 반영해 ‘무자비한’으로 옮겼습니다.
- source_word: יִירָאוּךָ
  english_pob_choice: will fear you
  chosen_korean: 주님을 두려워할 것입니다
  alternatives_korean:
  - 주님을 경외할 것입니다
  - 주님을 무서워할 것입니다
  - 주님을 두려워하며 경외할 것입니다
  lexicon: HALOT
  rationale: ירא는 문맥에 따라 두려움과 경외를 모두 가질 수 있으므로, 본문이 그 긴장을 해소하지 않도록 가장 직접적인 ‘두려워하다’를 택했습니다.
theological_decisions:
- issue: 강한 백성과 무자비한 나라들이 하나님께 보이는 반응의 성격
  chosen_reading: 본문은 그들이 하나님을 영화롭게 하고 두려워할 것이라고 말할 뿐, 그것이 자발적 예배인지 심판 뒤의 강제적 굴복인지까지는 규정하지 않습니다.
  alternative_readings:
  - 열방의 진정한 예배와 회심을 가리킨다.
  - 심판 이후의 공포 섞인 복종을 가리킨다.
  rationale: 히브리어 동사들은 존중과 경외를 모두 포함할 수 있지만, 문맥 자체는 내적 동기를 명시하지 않으므로 번역도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 본문의 긴장 보존
- issue: ‘영화롭게 하다’와 ‘두려워하다’의 병렬
  chosen_reading: 병렬 구조를 유지하여, 첫 절은 하나님께 드려지는 인정, 둘째 절은 그 권능 앞에서의 응답으로 읽히게 했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘경외하다’ 계열로 통일한다.
  - 첫 동사를 ‘찬양하다’로 바꾼다.
  rationale: 원문은 כבד와 ירא의 서로 다른 어휘를 병치하므로, 한국어도 의미 차이를 유지하는 것이 해석상 더 충실합니다.
  doctrine_reference: 어휘 병렬 보존
