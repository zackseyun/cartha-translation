  - 주님을 두려워하며 경외할 것입니다
  lexicon: HALOT
  rationale: ירא는 문맥에 따라 두려움과 경외를 모두 가질 수 있으므로, 본문이 그 긴장을 해소하지 않도록 가장 직접적인 ‘두려워하다’를 택했습니다.
theological_decisions:
- issue: 강한 백성과 무자비한 나라들이 하나님께 보이는 반응의 성격
  chosen_reading: 본문은 그들이 하나님을 영화롭게 하고 두려워할 것이라고 말할 뿐, 그것이 자발적 예배인지 심판 뒤의 강제적 굴복인지까지는 규정하지 않습니다.
  alternative_readings:
  - 열방의 진정한 예배와 회심을 가리킨다.
  - 심판 이후의 공포 섞인 복종을 가리킨다.
  rationale: 히브리어 동사들은 존중과 경외를 모두 포함할 수 있지만, 문맥 자체는 내적 동기를 명시하지 않으므로 번역도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 본문의 긴장 보존
- issue: ‘영화롭게 하다’와 ‘두려워하다’의 병렬
  chosen_reading: 병렬 구조를 유지하여, 첫 절은 하나님께 드려지는 인정, 둘째 절은 그 권능 앞에서의 응답으로 읽히게 했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘경외하다’ 계열로 통일한다.
  - 첫 동사를 ‘찬양하다’로 바꾼다.
  rationale: 원문은 כבד와 ירא의 서로 다른 어휘를 병치하므로, 한국어도 의미 차이를 유지하는 것이 해석상 더 충실합니다.
  doctrine_reference: 어휘 병렬 보존
