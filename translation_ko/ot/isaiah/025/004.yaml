source:
  edition: WLC
  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
  footnotes:
  - marker: a
    text: Or 'the blast of the ruthless'; Hebrew רוּחַ can mean 'breath,' 'wind,' or 'blast' in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a downpour against a wall' or 'like a storm beating on a wall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주께서 가난한 자에게는 요새가 되시고, 궁핍한 자에게는 그의 환난 때에 요새가 되셨기 때문입니다. 폭풍을 피하는 피난처, 더위를 가리는 그늘이 되셨습니다. 이는 포악한 자들의 숨결이 담장에 부딪히는 폭풍 같기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '포악한 자들의 폭풍'으로도 옮길 수 있습니다. 히브리어 רוּחַ는 문맥에 따라 '숨결', '바람', '폭풍'을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '담장에 몰아치는 폭풍처럼'으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 피난처
  - 견고한 곳
  lexicon: HALOT
  rationale: 보호와 방어의 의미를 분명하게 살리면서, 앞뒤 반복된 병렬 구조에서 동일어 반복 효과를 유지하기에 적합합니다.
- source_word: דָּל / אֶבְיוֹן
  english_pob_choice: poor / needy
  chosen_korean: 가난한 자 / 궁핍한 자
  alternatives_korean:
  - 빈한한 자 / 불쌍한 자
  - 가난한 사람 / 궁핍한 사람
  lexicon: HALOT
  rationale: 두 단어의 의미가 겹치지만 완전히 같지는 않으므로, 한국어에서도 유사하되 구별되는 표현으로 병렬을 살렸습니다.
- source_word: בַּצַּר לוֹ
  english_pob_choice: in his distress
  chosen_korean: 그의 환난 때에
  alternatives_korean:
  - 그의 곤경 속에
  - 그가 곤란할 때에
  lexicon: HALOT
  rationale: 3인칭 소유 접미사의 관계를 자연스럽게 살리면서, 고난의 상황을 간결하게 드러내는 표현입니다.
- source_word: מַחְסֶה / צֵל / חֹרֶב
  english_pob_choice: refuge / shade / heat
  chosen_korean: 피난처 / 그늘 / 더위
  alternatives_korean:
  - 피신처 / 그림자 / 뜨거움
  - 숨을 곳 / 차양 / 타는 더위
  lexicon: HALOT
  rationale: 보호 이미지와 대조 이미지를 현대 한국어로 직접적이고 자연스럽게 옮겼습니다. '그늘'은 보호의 긍정적 이미지를, '더위'는 그늘과 짝을 이루는 본뜻을 살립니다.
- source_word: רוּחַ עָרִיצִים
  english_pob_choice: the breath of the ruthless
  chosen_korean: 포악한 자들의 숨결
  alternatives_korean:
  - 포악한 자들의 바람
  - 무자비한 자들의 숨결
  lexicon: HALOT
  rationale: רוּחַ의 '숨결/바람/폭풍' 범위를 고려할 때, 여기서는 공격적 기세를 드러내는 '숨결'이 가장 직접적입니다. עָרִיצִים은 정치적 '폭군'으로 좁히지 않고 폭력적 억압자라는 넓은 뜻을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 본문의 주어를 관습적 경건어법으로 약화하지 않고 '주'로 두었습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 히브리어 형태는 직접적인 신명 표지가 아니라 2인칭 خطاب으로 읽히므로, 본문 차원에서는 '주'가 자연스럽습니다. 야훼 표기는 LXX 인용이나 명시적 신명 표지가 있는 경우에 검토할 수 있습니다.
  doctrine_reference: Source-text primacy; divine-name rendering policy
