  lexicon: HALOT
  rationale: ‘성읍’과 ‘무더기’의 대조를 살리되, 한국어에서는 목적격-보어 구조로 간결하게 옮기는 것이 가장 자연스럽습니다.
- source_word: קִרְיָה בְצוּרָה / לְמַפֵּלָה
  english_pob_choice: the fortified town a ruin
  chosen_korean: 견고한 성읍을 폐허로
  alternatives_korean:
  - 요새 성읍을 무너진 곳으로
  - 견고한 도성을 폐허로
  lexicon: HALOT
  rationale: בְצוּרָה의 ‘요새화된/견고한’ 의미와 לְמַפֵּלָה의 ‘폐허/무너짐’을 보존하기 위해 ‘견고한 성읍’과 ‘폐허’로 대응시켰습니다.
- source_word: אַרְמוֹן זָרִים / מֵעִיר
  english_pob_choice: the palace of foreigners is no city
  chosen_korean: 이방인의 궁전은 더 이상 성읍이 아니며
  alternatives_korean:
  - 이방인의 궁전은 성읍이 더 이상 아니며
  - 이방인들의 궁전은 성읍이 아닙니다
  lexicon: HALOT
  rationale: 압축된 히브리어 표현이 ‘성읍의 지위를 잃은 궁전’이라는 뜻을 담으므로, POB의 해석을 따라 ‘더 이상 성읍이 아니며’로 풀어 썼습니다.
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  english_pob_choice: it will never be rebuilt
  chosen_korean: 영원히 다시 세워지지 않을 것입니다
  alternatives_korean:
  - 영원히 건축되지 않을 것입니다
  - 다시는 세워지지 않을 것입니다
  lexicon: HALOT
  rationale: לְעוֹלָם + 부정은 관용적으로 ‘결코/영원히 … 않다’의 의미이므로, 파괴 상태의 반대인 ‘다시 세워지다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 이방인의 궁전이 ‘성읍이 아니다’라는 압축된 진술의 처리
  chosen_reading: 단순한 건물 묘사가 아니라 도시로서의 지위 상실을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 이방인의 궁전은 성읍이 아닙니다
  - 이방인의 궁전은 성읍이 더 이상 아닙니다
