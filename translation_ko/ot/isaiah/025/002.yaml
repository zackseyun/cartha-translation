  source_fidelity: 히브리어의 병렬 구조와 파괴의 결과를 대체로 충실히 옮겼습니다. 다만 גַּל은 문맥상 단순한 ‘무더기’보다 폐허의 잔해를 가리키므로 ‘돌무더기’가 더 분명합니다. 또한 ‘다시’는 문맥상 타당하나, לְעוֹלָם לֹא의 관용적 강조는 ‘다시는’이 더 자연스럽게 반영합니다.
  naturalness: 합쇼체 문체는 일관되고 자연스럽습니다. ‘성읍’은 현대 한국어 성경의 격식 있는 문체에서 허용됩니다. ‘돌무더기’와 ‘다시는’으로 다듬으면 파괴 장면과 문장 흐름이 더 명료해집니다.
  terminology: ‘궁전’은 אַרְמוֹן에 적절하며, ‘이방인의’는 זָרִים을 성경적 문맥에서 무리 없이 옮깁니다. 각주 a의 ‘요새’는 본문의 ‘궁전’과 어휘가 달라지므로 ‘궁전’으로 통일해야 합니다.
