  lexicon: HALOT
  rationale: 결과 상태를 만드는 사역적 의미를 살려, 단순한 ‘두다’보다 ‘만들다’가 본문의 파괴적 전환을 더 자연스럽게 드러냅니다.
- source_word: מֵעִיר / לַגָּל
