id: ISA.25.2
reference: Isaiah 25:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שַׂ֤מְתָּ מֵ/עִיר֙ לַ/גָּ֔ל קִרְיָ֥ה בְצוּרָ֖ה לְ/מַפֵּלָ֑ה אַרְמ֤וֹן זָרִים֙ מֵ/עִ֔יר לְ/עוֹלָ֖ם לֹ֥א יִבָּנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
  footnotes:
  - marker: a
    text: Or 'the palace of foreigners is no longer a city.' The Hebrew phrase is compressed and may mean that the foreigners’ stronghold has ceased to have city-status.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for eternity it will not be built'; the sense in context is 'it will never be rebuilt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 성읍을 무더기로, 견고한 성읍을 폐허로 만드셨으니, 이방인의 궁전은 더 이상 성읍이 아니며[a] 영원히 다시 세워지지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인의 궁전은 더 이상 성읍이 되지 않았다.’ 히브리어 표현은 압축되어 있으며, 이방인의 요새가 성읍의 지위를 잃었다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘영원히 그것은 세워지지 않을 것이다’이지만, 문맥상 뜻은 ‘다시는 세워지지 않을 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  english_pob_choice: have made
  chosen_korean: 만드셨으니
  alternatives_korean:
  - 세우셨으니
  - 바꾸셨으니
  lexicon: HALOT
  rationale: 결과 상태를 만드는 사역적 의미를 살려, 단순한 ‘두다’보다 ‘만들다’가 본문의 파괴적 전환을 더 자연스럽게 드러냅니다.
- source_word: מֵעִיר / לַגָּל
  english_pob_choice: the city a heap
  chosen_korean: 성읍을 무더기로
  alternatives_korean:
  - 도성을 더미로
  - 성읍을 무더기로 만든
  lexicon: HALOT
  rationale: ‘성읍’과 ‘무더기’의 대조를 살리되, 한국어에서는 목적격-보어 구조로 간결하게 옮기는 것이 가장 자연스럽습니다.
- source_word: קִרְיָה בְצוּרָה / לְמַפֵּלָה
  english_pob_choice: the fortified town a ruin
  chosen_korean: 견고한 성읍을 폐허로
  alternatives_korean:
  - 요새 성읍을 무너진 곳으로
  - 견고한 도성을 폐허로
  lexicon: HALOT
  rationale: בְצוּרָה의 ‘요새화된/견고한’ 의미와 לְמַפֵּלָה의 ‘폐허/무너짐’을 보존하기 위해 ‘견고한 성읍’과 ‘폐허’로 대응시켰습니다.
- source_word: אַרְמוֹן זָרִים / מֵעִיר
  english_pob_choice: the palace of foreigners is no city
  chosen_korean: 이방인의 궁전은 더 이상 성읍이 아니며
  alternatives_korean:
  - 이방인의 궁전은 성읍이 더 이상 아니며
  - 이방인들의 궁전은 성읍이 아닙니다
  lexicon: HALOT
  rationale: 압축된 히브리어 표현이 ‘성읍의 지위를 잃은 궁전’이라는 뜻을 담으므로, POB의 해석을 따라 ‘더 이상 성읍이 아니며’로 풀어 썼습니다.
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  english_pob_choice: it will never be rebuilt
  chosen_korean: 영원히 다시 세워지지 않을 것입니다
  alternatives_korean:
  - 영원히 건축되지 않을 것입니다
  - 다시는 세워지지 않을 것입니다
  lexicon: HALOT
  rationale: לְעוֹלָם + 부정은 관용적으로 ‘결코/영원히 … 않다’의 의미이므로, 파괴 상태의 반대인 ‘다시 세워지다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 이방인의 궁전이 ‘성읍이 아니다’라는 압축된 진술의 처리
  chosen_reading: 단순한 건물 묘사가 아니라 도시로서의 지위 상실을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 이방인의 궁전은 성읍이 아닙니다
  - 이방인의 궁전은 성읍이 더 이상 아닙니다
  rationale: 본문은 물리적 붕괴뿐 아니라 공동체/도시성의 소멸을 말하므로, 그 의미를 드러내는 해석적 번역이 필요합니다.
  doctrine_reference: 문맥적 의미 우선의 예언문 해석
