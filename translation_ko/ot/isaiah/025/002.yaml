source:
  edition: WLC
  text: כִּ֣י שַׂ֤מְתָּ מֵ/עִיר֙ לַ/גָּ֔ל קִרְיָ֥ה בְצוּרָ֖ה לְ/מַפֵּלָ֑ה אַרְמ֤וֹן זָרִים֙ מֵ/עִ֔יר לְ/עוֹלָ֖ם לֹ֥א יִבָּנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
  footnotes:
  - marker: a
    text: Or 'the palace of foreigners is no longer a city.' The Hebrew phrase is compressed and may mean that the foreigners’ stronghold has ceased to have city-status.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for eternity it will not be built'; the sense in context is 'it will never be rebuilt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 성읍을 돌무더기로, 견고한 성읍을 폐허로 만드셨으니, 이방인의 궁전은 더 이상 성읍이 아니며[a] 다시는 세워지지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인의 궁전은 더 이상 성읍이 되지 않았다.’ 히브리어 표현은 압축되어 있으며, 이방인의 궁전이 성읍으로서의 지위를 잃었다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘영원히 그것은 세워지지 않을 것이다’이지만, 문맥상 뜻은 ‘다시는 세워지지 않을 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  english_pob_choice: have made
  chosen_korean: 만드셨으니
  alternatives_korean:
