translation:
  language: ko
  text: 그분께서는 네 성벽의 높이 솟은 요새를 끌어내리시고 낮추시며, 땅에, 먼지에 이르기까지 내리치셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 압축된 명사 결합은 ‘네 성벽의 높은 요새를’ 또는 ‘네 성벽의 요새화된 높은 곳을’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְצַר / מִשְׂגַּב
  english_pob_choice: the fortified height
  chosen_korean: 성벽의 견고한 높이
  alternatives_korean:
  - 성채의 높은 곳
  - 요새 같은 높은 곳
  - 견고한 성벽의 높이
  lexicon: HALOT
  rationale: 두 명사구가 압축된 구조이므로 한국어에서는 ‘성벽’과 ‘높이’의 결합으로 방어적·지리적 이미지를 살리되, ‘견고한’으로 מִבְצַר의 요새성을 반영했습니다.
- source_word: חוֹמֹתֶיךָ
  english_pob_choice: your walls
  chosen_korean: 너의 성벽
  alternatives_korean:
  - 네 성벽
  - 네 벽
  - 너의 벽
  lexicon: HALOT
  rationale: 직역하면 ‘너의 벽’이지만 문맥상 도시 방어 시설을 가리키므로 ‘성벽’이 원문의 의미를 가장 자연스럽게 드러냅니다.
- source_word: הֵשַׁח / הִשְׁפִּיל / הִגִּיעַ לָאָרֶץ / עַד עָפָר
  english_pob_choice: has brought down, laid low, and cast to the ground, to the dust
  chosen_korean: 무너뜨리시고, 낮추시며, 땅에, 곧 먼지까지 던져 버리셨습니다
  alternatives_korean:
  - 끌어내리시고, 낮추시며, 땅에 떨어뜨리시고, 먼지까지 이르게 하셨습니다
  - 무너뜨리시고, 낮추시며, 땅으로, 먼지까지 이르게 하셨습니다
  lexicon: HALOT
  rationale: 연속 동사의 누적 강도를 살리기 위해 ‘무너뜨리다/낮추다/던져 버리다’를 택했고, 마지막 ‘먼지’는 파괴의 종결점을 분명히 하기 위해 보강했습니다.
theological_decisions:
- issue: 시의적 반복을 통한 완전한 파괴의 강조
  chosen_reading: 세 개의 하향 동사를 연속해 배치하여, 성벽이 단순히 손상된 수준이 아니라 완전히 굴복되고 붕괴된 상태임을 드러냈습니다.
  alternative_readings:
  - 동사를 하나의 유사어로 평평하게 묶어 ‘낮추셨습니다’ 정도로 완화하는 읽기
  rationale: 히브리어는 파괴의 하강 이미지를 누적적으로 밀어붙이므로, 한국어도 그 긴장을 유지해야 본문의 심판적 효과가 살아납니다.
  doctrine_reference: 사 25:12의 심판 이미지
