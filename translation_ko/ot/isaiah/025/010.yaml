  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
  footnotes:
  - marker: a
    text: Or, more literally, 'Moab will be trampled under him/beneath it'; the Hebrew pronoun's antecedent is uncertain.
    reason: alternative_reading
  - marker: b
    text: '''Dung pit'' may also be rendered ''manure heap'' or ''dunghill''; the Hebrew term likely refers to a foul place associated with manure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼의 손이 이 산 위에 쉬실 것이며, 모압이 자기 자리에서 짓밟힐 것이기 때문입니다 — 마치 거름 구덩이의 물 속에서 짚이 짓밟히듯이 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘모압이 그 아래/그 밑에서 짓밟힐 것이다’로도 옮길 수 있으며, 히브리어 대명사의 선행사는 분명하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘거름 구덩이’는 히브리어의 더러운 분뇨 장소를 가리키는 말로, ‘거름 더미’나 ‘분뇨 더미’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞선 내용에 대한 설명·근거를 자연스러운 합쇼체로 살리기 위해 원인 표지를 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: תָנ֥וּחַ יַד יְהוָ֖ה
  english_pob_choice: the hand of Yahweh will rest
  chosen_korean: 야훼의 손이 … 쉬실 것이며
  alternatives_korean:
  - 야훼의 손이 … 머무를 것이며
  - 야훼의 손이 … 내릴 것이며
  lexicon: HALOT
  rationale: ‘손’의 이미지와 נוח의 ‘쉬다/머물다’ 의미를 함께 보존했습니다. 주어가 야훼의 손이므로 존칭 서술을 피하지 않으면서도 본문 이미지를 유지했습니다.
- source_word: תַּחְתָּ֔יו
  english_pob_choice: in its place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 그 아래에서
  - 그 위에
  lexicon: HALOT
  rationale: 대명사 지시 대상이 불확실하므로 특정 선행사를 단정하지 않고, 심판이 일어나는 위치를 무리 없이 드러내는 표현으로 옮겼습니다.
- source_word: מַתְבֵּן
  english_pob_choice: dung pit
  chosen_korean: 거름 구덩이
  alternatives_korean:
  - 분뇨 구덩이
  - 거름 더미
  - 똥구덩이
  lexicon: HALOT
  rationale: 영어 POB가 제시한 ‘dung pit’의 불쾌하고 저속한 이미지를 살리되, 표준어로 읽히는 표현인 ‘거름 구덩이’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 언약 이름의 고유성을 드러냈습니다.
  doctrine_reference: 'POB terminology guideline: יְהוָה / YHWH → 야훼'
- issue: תַּחְתָּיו의 대명사 지시 불확실성
  chosen_reading: 자기 자리에서 짓밟힐 것이기 때문입니다
  alternative_readings:
  - 그 아래에서 짓밟힐 것이기 때문입니다
  - 그에게/그 아래에 짓밟힐 것이기 때문입니다
  rationale: 히브리어 대명사의 선행사가 문법적으로 확정되지 않으므로, 본문의 심판 결과만 확정하고 지시 대상을 해석으로 과도하게 고정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
