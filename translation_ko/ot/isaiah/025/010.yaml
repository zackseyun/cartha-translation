- from: 이는 야훼의 손이 이 산 위에 쉬실 것이며, 모압이 자기 자리에서 짓밟힐 것이기 때문입니다 — 마치 거름 구덩이의 물 속에서 짚이 짓밟히듯이 말입니다.[a][b]
  to: 야훼의 손이 이 산 위에 머무르고, 모압은 거름 구덩이[b]의 물 속에서 짚이 짓밟히듯 그 자리에서[a] 짓밟힐 것이기 때문입니다.
