- from: 마른 땅의 더위 같이 주께서 이방인의 소란을 굴복시키시며, 구름 그늘의 더위 같이 잔인한 자들의 노래를 낮추십니다.[a][b]
  to: 마른 땅의 더위처럼 주께서 이방인들의 소란을 억누르시며[a], 구름 그늘이 더위를 누그러뜨리듯 포악한 자들의 노래가 낮아집니다.[b]
