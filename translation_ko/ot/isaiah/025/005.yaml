id: ISA.25.5
reference: Isaiah 25:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
  footnotes:
  - marker: a
    text: Or 'foreigners' for 'strangers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the song of the ruthless is silenced/humbled'; the Hebrew verb can also mean 'answers,' but the context favors the sense of being subdued.
    reason: lexical_alternative
translation:
  language: ko
  text: 마른 땅의 더위처럼 주께서 이방인들의 소란을 억누르시며[a], 구름 그늘이 더위를 누그러뜨리듯 포악한 자들의 노래가 낮아집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘응답하다’로도 이해될 수 있으나, 여기서는 문맥상 ‘낮아지다’ 또는 ‘제압되다’의 뜻이 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב
  english_pob_choice: Like heat
  chosen_korean: 마른 땅의 더위 같이
  alternatives_korean:
  - 가뭄 같은 더위로
  - 타는 듯한 더위 같이
  lexicon: HALOT
  rationale: חֹרֶב의 기본적인 건조·더위 이미지를 살리면서, 병행되는 ‘구름 그늘’과의 대비를 자연스럽게 드러내기 위해 ‘마른 땅의 더위’로 옮겼습니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 이방인
  alternatives_korean:
  - 나그네
  - 낯선 자들
  lexicon: HALOT
  rationale: 문맥상 단순한 낯선 사람이 아니라 공동체 밖의 외부 세력을 가리키므로, POB의 각주 취지를 반영해 ‘이방인’으로 옮겼습니다.
- source_word: תַּכְנִיעַ
  english_pob_choice: you subdue
  chosen_korean: 주께서 … 굴복시키시며
  alternatives_korean:
  - 주께서 … 낮추시며
  - 주께서 … 굴복하게 하시며
  lexicon: HALOT
  rationale: 힢힐형의 ‘굴복시키다/복종시키다’ 의미를 살려, 하나님의 능동적 제압을 분명히 드러내는 동사로 옮겼습니다.
- source_word: זְמִיר
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 노래소리
  - 찬가
  lexicon: HALOT
  rationale: 시적 병행에서 oppressors의 자기과시적 노래를 가장 직접적으로 전달하는 기본어로 ‘노래’를 택했습니다.
- source_word: יַעֲנֶה
  english_pob_choice: is brought low
  chosen_korean: 낮추십니다
  alternatives_korean:
  - 낮아집니다
  - 잠잠해집니다
  - 응답하십니다
  lexicon: HALOT
  rationale: 이 동사는 ‘응답하다’도 가능하지만, 여기서는 앞 절과 평행하게 억압적 소리가 제압되는 뜻이 더 강하므로 ‘낮추십니다’로 번역해 의미를 분명히 했습니다.
theological_decisions:
- issue: 직접적인 하나님의 행위와 마지막 절의 의미
  chosen_reading: 두 절 모두 하나님이 억누르시고 낮추시는 주체로 드러나도록 합쇼체의 능동형을 유지했습니다.
  alternative_readings:
  - 마지막 절을 수동으로 ‘낮춰집니다’로 옮기기
  - 마지막 동사를 ‘응답합니다’로 옮기기
  rationale: 히브리어 문맥은 하나님의 보호와 심판의 행위를 병렬적으로 묘사합니다. 마지막 동사의 애매성을 완전히 해소하기보다, 앞뒤 병행을 해치지 않는 범위에서 제압의 뜻을 살리는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
