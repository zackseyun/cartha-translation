  text: וּ/פֵרַ֤שׂ יָדָי/ו֙ בְּ/קִרְבּ֔/וֹ כַּ/אֲשֶׁ֛ר יְפָרֵ֥שׂ הַ/שֹּׂחֶ֖ה לִ/שְׂח֑וֹת וְ/הִשְׁפִּיל֙ גַּֽאֲוָת֔/וֹ עִ֖ם אָרְבּ֥וֹת יָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
  footnotes:
  - marker: a
    text: Or 'the cunning of his hands' or 'the tricks/devices of his hands.' The Hebrew expression is difficult and may refer to crafty devices rather than neutral skill.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 한가운데에서 마치 헤엄치는 사람이 헤엄치려고 손을 펴듯이 자기 손을 펼치고, 자기 교만과 자기 손의 교묘한 수단을 함께 낮추실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 손의 기술’, ‘자기 손의 책략/간계’로도 옮길 수 있습니다. 히브리어 표현은 난해하며, 중립적인 솜씨보다 교묘한 수단을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ יָדָיו
  english_pob_choice: he will spread out his hands
  chosen_korean: 자기 손을 펼치고
  alternatives_korean:
  - 자기 손을 벌리고
  - 자기 팔을 펼치고
  lexicon: HALOT
  rationale: פרשׂ는 물리적으로 ‘펴다/펴 놓다’의 뜻이므로, 수영의 비유와 맞게 ‘펼치다’를 택했습니다. יָדָיו는 직역하면 ‘손들’이지만 한국어에서는 자연스럽게 단수 복수 구분 없이 ‘손’으로 옮겼습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: in its midst
  chosen_korean: 그 한가운데에서
  alternatives_korean:
  - 그 가운데에서
  - 그 속에서
  lexicon: HALOT
  rationale: 지시 대상이 앞문맥의 모압을 가리키는 남성 단수이므로, 과도한 해석 없이 공간적 중심을 살리는 ‘한가운데’로 옮겼습니다.
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  english_pob_choice: as a swimmer spreads them out to swim
  chosen_korean: 마치 헤엄치는 사람이 헤엄치려고 손을 펴듯이
  alternatives_korean:
  - 마치 수영하는 사람이 헤엄치려고 손을 펴듯이
  - 수영선수가 헤엄치듯 손을 펴듯이
  lexicon: HALOT
  rationale: הַשֹּׂחֶה는 ‘헤엄치는 사람/헤엄치는 자’의 의미이므로 단순하고 현대적인 ‘헤엄치는 사람’으로 옮겼습니다. לִשְׂחוֹת는 목적을 나타내어 ‘헤엄치려고’로 자연스럽게 반영했습니다.
- source_word: וְהִשְׁפִּיל גַּאֲוָתוֹ
  english_pob_choice: he will bring down his pride
  chosen_korean: 자기 교만을 … 낮추실 것입니다
  alternatives_korean:
  - 자기 교만을 … 끌어내리실 것입니다
  - 자기 교만을 … 낮추시고
  lexicon: HALOT
  rationale: שׁפל의 사역형은 ‘낮추다/내리다’의 감각을 가지므로, 심판의 구체성을 살려 ‘낮추다’로 옮겼습니다. גַּאֲוָה는 이 문맥에서 단순한 ‘위엄’이 아니라 부정적 ‘교만’이 적절합니다.
- source_word: עִם אָרְבּוֹת יָדָיו
  english_pob_choice: along with the skill of his hands
  chosen_korean: 자기 손의 교묘한 수단을 함께
  alternatives_korean:
  - 자기 손의 기술을 함께
  - 자기 손의 책략을 함께
  - 자기 손의 솜씨를 함께
  lexicon: HALOT
  rationale: אָרְבּוֹת יָדָיו는 의미가 불확실하여 POB의 주석처럼 ‘기술’과 ‘책략/수단’ 사이의 긴장을 보존해야 합니다. 한국어 본문은 문맥상 다소 부정적인 함의를 드러내는 ‘교묘한 수단’을 택했습니다.
theological_decisions:
- issue: 모압을 가리키는 단수 인칭 표현의 유지
  chosen_reading: 문장 전체를 단수 인칭으로 유지해, 모압을 의인화한 예언시의 이미지를 살렸습니다.
  alternative_readings:
  - 모압 사람들을 집단 복수로 풀어쓸 수 있습니다.
  rationale: 히브리어가 단수형을 사용하고 있어, 이를 집단명으로 풀어 쓰면 원문의 시적 의인화가 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: אָרְבּוֹת יָדָיו의 불확실성 처리
  chosen_reading: 본문에는 ‘교묘한 수단’을 두고, 본문만으로 단정하기 어려운 의미의 범위를 보존했습니다.
  alternative_readings:
  - ‘손의 기술’
  - ‘손의 책략/간계’
  rationale: 해당 표현은 어휘상 난해하므로, 확정적인 한 뜻으로 고정하지 않고 문맥에 맞는 넓은 범위를 드러내는 번역을 선택했습니다.
  doctrine_reference: Translation philosophy §3, §5
