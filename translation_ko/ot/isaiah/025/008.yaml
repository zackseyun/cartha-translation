id: ISA.25.8
reference: Isaiah 25:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'He has swallowed up death forever.' The Hebrew perfect can be rendered as a prophetic perfect, expressing a future act as certain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord GOD' represents אֲדֹנָי יְהוִה, literally 'Lord YHWH.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the disgrace of his people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 죽음을 영원히 삼키실 것이며, 주 하나님은 모든 얼굴에서 눈물을 닦아 주실 것이고, 자기 백성의 치욕을 온 땅에서 제거하실 것입니다. 이는 야훼께서 말씀하셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 예언적 완료로도 읽을 수 있어, 확정된 미래를 나타낼 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 ‘주 하나님’은 אֲדֹנָי יְהוִה, 곧 문자적으로는 ‘주 야훼’를 가리킵니다.
    reason: source_note
  - marker: c
    text: 또는 ‘자기 백성의 치욕’.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלַּע הַמָּוֶת לָנֶצַח
  english_pob_choice: He will swallow up death forever
  chosen_korean: 그는 죽음을 영원히 삼키실 것이며
  alternatives_korean:
  - 그는 죽음을 영원히 없애실 것이며
  - 그는 죽음을 영원히 삼켜 버리실 것이며
  lexicon: HALOT
  rationale: בִּלַּע의 구체적 이미지를 살리기 위해 ‘삼키다’를 유지했고, לָנֶצַח은 종말론적 지속성을 드러내는 ‘영원히’로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי + יְהוִה의 결합은 ‘주 하나님’으로 자연스럽게 풀어, 직역의 어색함을 피하면서도 두 칭호가 합쳐진 엄숙함을 살렸습니다.
- source_word: דִּמְעָה מֵעַל כָּל פָּנִים
  english_pob_choice: tears from every face
  chosen_korean: 모든 얼굴에서 눈물을 닦아 주실 것이고
  alternatives_korean:
  - 모든 얼굴의 눈물을 씻어 내실 것이고
  - 각 얼굴에서 눈물을 닦아 주실 것이고
  lexicon: HALOT
  rationale: ‘눈물을 닦아 주시다’는 한국어에서 위로와 제거의 이미지를 자연스럽게 전달하며, distributive 표현인 ‘모든 얼굴’을 살렸습니다.
- source_word: וְחֶרְפַּת עַמּוֹ יָסִיר מֵעַל כָּל הָאָרֶץ
  english_pob_choice: he will remove the reproach of his people from all the earth
  chosen_korean: 자기 백성의 치욕을 온 땅에서 제거하실 것입니다
  alternatives_korean:
  - 자기 백성의 수치를 온 땅에서 없애실 것입니다
  - 자기 백성의 수치를 온 세상에서 제거하실 것입니다
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 내적 ‘수치’보다 공개적 모욕과 불명예를 포함하므로 ‘치욕’으로 옮겼고, מֵעַל כָּל הָאָרֶץ는 ‘온 땅에서’로 보편적 범위를 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 끝절은 ‘יהוה’가 직접 나오므로, 본문과 주석에서 구분 가능하도록 고유한 신명 표기 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
