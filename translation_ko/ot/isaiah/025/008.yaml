revisions:
- from: 그는 죽음을 영원히 삼키실 것이며, 주 하나님은 모든 얼굴에서 눈물을 닦아 주실 것이고, 자기 백성의 치욕을 온 땅에서 제거하실 것입니다. 이는 야훼께서 말씀하셨기 때문입니다.[a][b][c]
  to: 야훼께서는 죽음을 영원히 삼키실 것입니다[a]. 주 야훼께서는 모든 얼굴에서 눈물을 닦아 내시며, 자기 백성의 치욕을 온 땅에서 제거하실 것입니다[c]. 이는 야훼께서 말씀하셨기 때문입니다.[b]
  rationale: 신명 יהוה를 ‘야훼’로 일관되게 표기하고, 복합 칭호 אֲדֹנָי יְהוִה의 두 요소를 ‘주 야훼’로 보존했습니다. 첫 절의 주어를 명시하여 한국어 문맥을 분명히 했으며, 각주를 해당 본문 구절에 배치하고 실제 대안 번역 및 예언적 완료형 정보를 제공하도록 고쳤습니다. 미래 지향적 본문 해석은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:37Z'
