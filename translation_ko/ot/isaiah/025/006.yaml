id: ISA.25.6
reference: Isaiah 25:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
  footnotes:
  - marker: a
    text: Or 'a feast of fat things ... a feast of wine on the lees.' The Hebrew imagery emphasizes abundance and luxury.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이 산에서 모든 민족을 위해 기름진 음식의 잔치[a], 오래 묵힌 포도주의 잔치를 베푸시리니—곧 골수가 가득한 기름진 음식과 잘 거른 오래 묵힌 포도주입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름진 것들의 잔치 … 앙금 위의 포도주의 잔치.’ 히브리어의 이미지는 풍성함과 사치를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주님
  lexicon: HALOT
  rationale: יהוה는 본문 이름을 살려 야훼로 옮기고, צְבָאוֹת은 군대/군세의 뜻을 따라 한국어 성경에서 투명하게 이해되는 만군으로 옮겼습니다.
- source_word: לְכָל הָעַמִּים
  english_pob_choice: for all the peoples
  chosen_korean: 모든 민족을 위해
  alternatives_korean:
  - 모든 백성을 위해
  - 모든 나라들을 위해
  lexicon: HALOT
  rationale: 복수형 עַמִּים의 집합적 뉘앙스를 살리기 위해 단순한 보편 인류보다 여러 민족 집단을 가리키는 표현을 선택했습니다.
- source_word: מִשְׁתֵּה שְׁמָנִים / מִשְׁתֵּה שְׁמָרִים
  english_pob_choice: a feast of rich food / a feast of aged wine
  chosen_korean: 기름진 음식의 잔치 / 오래 묵힌 포도주의 잔치
  alternatives_korean:
  - 기름진 것들의 잔치 / 포도주 찌꺼기의 잔치
  - 진수성찬 / 잘 숙성된 포도주의 잔치
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지는 ‘기름진 것들’과 ‘찌꺼기/앙금 위의 포도주’이지만, POB의 의도를 따라 잔치의 풍성함을 드러내는 자연스러운 현대어로 옮기고, 보다 직역에 가까운 뉘앙스는 각주로 남겼습니다.
- source_word: מְמֻחָיִם / מְזֻקָּקִים
  english_pob_choice: full of marrow / well refined
  chosen_korean: 골수가 가득한 / 잘 거른
  alternatives_korean:
  - 골수가 꽉 찬 / 정련한
  - 속까지 찬 / 정제한
  lexicon: HALOT
  rationale: מְמֻחָיִם은 가장 좋은 살점의 풍성함을, מְזֻקָּקִים은 정제·여과된 품질을 가리키므로, 한국어에서는 음식과 포도주에 각각 자연스럽고도 선명한 묘사를 유지했습니다.
theological_decisions:
- issue: 이방 민족까지 포함하는 종말론적 잔치의 범위
  chosen_reading: 모든 민족을 위해
  alternative_readings:
  - 모든 나라들을 위해
  - 모든 사람을 위해
  rationale: 본문의 עַמִּים 복수는 이스라엘을 넘어 여러 민족을 포괄하는 시야를 보여 주므로, 이를 ‘모든 민족’으로 옮겨 범위를 좁히지 않되 ‘모든 사람’으로 일반화하지도 않았습니다.
  doctrine_reference: 본문의 종말론적 보편성은 유지하되, 번역이 신학적 체계를 과잉 구성하지 않도록 함
