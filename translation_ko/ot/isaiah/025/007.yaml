id: ISA.25.7
reference: Isaiah 25:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִלַּע֙ בָּ/הָ֣ר הַ/זֶּ֔ה פְּנֵֽי הַ/לּ֥וֹט הַ/לּ֖וֹט עַל כָּל הָֽ/עַמִּ֑ים וְ/הַ/מַּסֵּכָ֥ה הַ/נְּסוּכָ֖ה עַל כָּל הַ/גּוֹיִֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
  footnotes:
  - marker: a
    text: Or 'the shroud that shrouds all peoples.' The Hebrew uses repeated cognate terms for a covering wrapped over humanity.
    reason: lexical_alternative
  - marker: b
    text: The 'veil' or 'covering' likely anticipates the swallowing up of death in the next verse, though the image may also suggest a broader removal of what lies over the nations.
    reason: cross_reference
translation:
  language: ko
  text: 이 산에서 그는 모든 백성을 덮고 있는 덮개와 모든 민족 위에 펴진 휘장을 삼키실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 어근의 표현을 거듭 사용하여, 모든 백성을 덮고 있는 ‘덮개’의 이미지를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 8절의 ‘죽음’을 삼키는 진술을 예고할 수 있지만, 7절 자체는 더 넓게 민족들 위에 놓인 것을 가리킬 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  english_pob_choice: he will swallow up
  chosen_korean: 삼켜 버리실 것입니다
  alternatives_korean:
  - 삼키실 것입니다
  - 집어삼키실 것입니다
  - 없애실 것입니다
  lexicon: HALOT
  rationale: בלע의 핵심 이미지를 살리기 위해 ‘삼키다’ 계열을 유지하되, 문맥상 완결성을 드러내는 ‘버리다’를 더해 한국어 흐름을 자연스럽게 했습니다.
- source_word: בָּהָר הַזֶּה
  english_pob_choice: on this mountain
  chosen_korean: 이 산에서
  alternatives_korean:
  - 이 산 위에서
  - 이 산에
  lexicon: HALOT
  rationale: 산에 대한 स्थान 표현은 한국어에서 ‘-에서’가 자연스럽고, 문맥상 시온 산을 가리키는 본문 흐름도 잘 드러냅니다.
- source_word: הַלּוֹט / הַמַּסֵּכָה
  english_pob_choice: the covering / the veil
  chosen_korean: 덮개와 … 휘장
  alternatives_korean:
  - 덮는 것과 … 가리개
  - 수의와 … 베일
  lexicon: HALOT
  rationale: 두 명사가 모두 ‘덮는 것’의 이미지를 가지므로, 반복되는 은유를 한국어에서도 구별되게 살리기 위해 ‘덮개’와 ‘휘장’을 대응시켰습니다. ‘수의’는 8절의 죽음 연상을 미리 확정할 위험이 있어 본문에서는 피했습니다.
- source_word: עַל כָּל הָעַמִּים / עַל כָּל הַגּוֹיִם
  english_pob_choice: all peoples / all nations
  chosen_korean: 모든 백성 … 모든 민족
  alternatives_korean:
  - 모든 사람들 … 모든 나라들
  - 모든 백성들 … 모든 이방 민족
  lexicon: HALOT
  rationale: עַמִּים와 גּוֹיִם의 병렬 차이를 살려 앞부분은 ‘백성’, 뒷부분은 ‘민족’으로 옮겼습니다. 이렇게 하면 동일어 반복을 피하면서도 보편적 범위를 유지할 수 있습니다.
theological_decisions:
- issue: 7절의 ‘덮개/휘장’의 의미 범위
  chosen_reading: 본문의 은유를 그대로 보존하고, 죽음에 대한 직접적 한정은 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 죽음의 수의로 명시적으로 좁히는 읽기
  - 영적 소경함의 상징으로 좁히는 읽기
  rationale: 히브리어는 사람들 위에 놓인 보편적 덮개와 휘장의 이미지를 말하며, 8절이 죽음과의 연결을 강하게 시사하더라도 7절 자체는 그 의미를 하나로 고정하지 않습니다.
  doctrine_reference: 본문의 은유적 긴장 보존
- issue: 8절과의 연관을 미리 확정하지 않음
  chosen_reading: ‘삼켜 버리실 것입니다’로 번역해 동일 동사를 보존하되, 해석은 다음 절로 넘깁니다.
  alternative_readings:
  - ‘멸하실 것입니다’로 해석을 전면화하는 번역
  - ‘집어삼키실 것입니다’로 더 강하게 구어화하는 번역
  rationale: 같은 동사가 다음 절의 ‘죽음을 삼키심’과 연결되므로, 본절에서는 문학적 연속성을 남겨 두는 것이 좋습니다.
  doctrine_reference: 문맥적 예표를 과잉 해석하지 않음
