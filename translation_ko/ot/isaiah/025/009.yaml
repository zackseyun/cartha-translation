  source_fidelity: 히브리어 וְיוֹשִׁיעֵנוּ는 접속사와 미완료형으로, 앞 절의 기다림에 이어지는 “그분께서 우리를 구원하실 것입니다”라는 서술로 옮기는 것이 가장 직접적입니다. 초안의 ‘기다려 왔으니’는 히브리어에 없는 인과 관계를 더합니다. בִּישׁוּעָתוֹ의 בְ는 ‘구원 안에서’로 유지하여 ‘구원으로’가 유발할 수 있는 수단·원인의 한정된 의미를 피했습니다.
  naturalness: ‘이는’보다 사람을 가리키는 지시 표현인 ‘이분이’가 현대 한국어에서 자연스럽고, 하나님 및 야훼에 대한 높임도 일관되게 유지합니다. 청유형은 ‘기뻐하고 즐거워합시다’로 두 동사의 병렬성을 분명히 했습니다.
  terminology: יהוה는 프로젝트 표준 및 제공된 영어 감사 기록의 최신 방침에 따라 ‘야훼’로 유지했습니다. ישׁוּעָה는 ‘구원’으로, cohortative 두 형태는 청유형으로 옮겼습니다.
