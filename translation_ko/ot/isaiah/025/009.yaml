  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text renders the divine name as ''the LORD'' in keeping with the project''s standard practice.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 이렇게 말할 것입니다. “보십시오, 이는 우리의 하나님이십니다. 우리는 그분을 기다려 왔으니, 그분께서 우리를 구원하실 것입니다. 이는 야훼이십니다. 우리는 그분을 기다려 왔습니다. 그분의 구원으로 기뻐하며 즐거워합시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여호와의 이름인 ‘야훼’를 사용합니다. 본문은 프로젝트 표준에 따라 이를 ‘야훼’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְאָמַר / And it will be said
  english_pob_choice: And it will be said
  chosen_korean: 그날에 이렇게 말할 것입니다
  alternatives_korean:
  - 그날에 말할 것입니다
  - 그날에 사람들은 말할 것입니다
  lexicon: HALOT
  rationale: 주어를 명시하지 않는 비인칭·미래형 발화로 이해하여, 한국어에서도 예언적 선언의 일반성을 살리기 위해 ‘이렇게 말할 것입니다’로 옮겼습니다.
- source_word: הִנֵּה / Behold
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이것을 보십시오
  lexicon: HALOT
  rationale: 히브리어의 지시적·강조적 감탄을 현대 한국어에서 자연스럽고 엄중하게 드러내기 위해 ‘보십시오’를 선택했습니다.
- source_word: אֱלֹהֵינוּ זֶה / this is our God
  english_pob_choice: this is our God
  chosen_korean: 이는 우리의 하나님이십니다
  alternatives_korean:
  - 이분이 우리의 하나님이십니다
  - 이것이 우리의 하나님이십니다
  lexicon: HALOT
  rationale: 지시대명사의 식별·인정 기능을 살리면서, 한국어에서는 ‘이는’으로 응축해 고백의 힘을 유지했습니다.
- source_word: קִוִּינוּ לוֹ / we have waited for him
  english_pob_choice: we have waited for him
  chosen_korean: 우리는 그분을 기다려 왔으니
  alternatives_korean:
  - 우리는 그분을 기다렸으니
  - 우리는 그분께 소망을 두었으니
  lexicon: HALOT
  rationale: קוה의 ‘기다림 속 소망’과 완료된 행위의 현재 관련성을 살려 ‘기다려 왔으니’로 옮겼습니다.
- source_word: יְהוָה / Yahweh
  english_pob_choice: This is Yahweh
  chosen_korean: 야훼이십니다
  alternatives_korean:
  - 야훼입니다
  - 주님이십니다
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 여호와나 주님이 아니라 신명기적 언약명 야훼를 보존했습니다.
- source_word: נָגִילָה וְנִשְׂמְחָה / Let us rejoice and be glad
  english_pob_choice: Let us rejoice and be glad
  chosen_korean: 기뻐하며 즐거워합시다
  alternatives_korean:
  - 기뻐하고 즐거워합시다
  - 우리는 기뻐하고 즐거워할 것입니다
  lexicon: HALOT
  rationale: 두 cohortative의 권면·공동 결단의 뉘앙스를 한국어 청유형으로 자연스럽게 재현했습니다.
- source_word: בִּישׁוּעָתוֹ / in his salvation
  english_pob_choice: in his salvation
  chosen_korean: 그분의 구원으로
  alternatives_korean:
  - 그분의 구원 안에서
  - 그분의 구원 가운데
  lexicon: HALOT
  rationale: בְּ의 범위를 단순 위치보다 결과·매개의 의미로 읽어, 한국어에서는 ‘~으로’가 가장 무리 없이 원문의 구원 행위를 드러냅니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
