revisions:
- from: 야훼, 주는 나의 하나님이십니다. 내가 주를 높이겠습니다. 내가 주의 이름을 찬송하겠습니다. 주께서 놀라운 일들을 행하셨기 때문입니다. 오래전부터 세우신 계획은 신실하고 확고합니다.[a]
