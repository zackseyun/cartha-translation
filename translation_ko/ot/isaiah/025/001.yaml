id: ISA.25.1
reference: Isaiah 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹהַ/י֙ אַתָּ֔ה אֲרֽוֹמִמְ/ךָ֙ אוֹדֶ֣ה שִׁמְ/ךָ֔ כִּ֥י עָשִׂ֖יתָ פֶּ֑לֶא עֵצ֥וֹת מֵֽ/רָח֖וֹק אֱמ֥וּנָה אֹֽמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
  footnotes:
  - marker: a
    text: Or 'for you have done a wonder; plans from long ago, faithfulness and surety.' The Hebrew is compact and poetic, and the final phrase may also be understood as emphasizing the firmness of God's ancient plans.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주께서는 나의 하나님이십니다. 내가 주를 높이겠습니다. 내가 주의 이름을 찬양하겠습니다. 주께서 놀라운 일을 행하셨기 때문입니다. 오래전의 계획들은 신실하고 확고합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 한 가지 놀라운 일을 행하셨기 때문입니다. 오래전의 계획들, 신실함과 확고함.’ 마지막 구절은 히브리어가 매우 압축적인 시적 표현이므로, 하나님의 오래전 계획들의 견고함을 강조하는 말로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 해당 없음
  rationale: 원문 고유명 יְהוָה를 한국어 관용어인 ‘주’로 흡수하지 않고, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지했습니다.
- source_word: אֲרוֹמִמְךָ
  english_pob_choice: I will exalt you
  chosen_korean: 내가 주를 높이겠습니다
  alternatives_korean:
  - 내가 주를 들어 올리겠습니다
  - 내가 주를 찬양하여 높이겠습니다
  lexicon: 해당 없음
  rationale: 동사 רום의 기본 의미를 살려 ‘높이다’로 옮기되, 예배 맥락에 맞는 존칭적 어감을 유지했습니다.
- source_word: אוֹדֶה שִׁמְךָ
  english_pob_choice: I will praise your name
  chosen_korean: 내가 주의 이름을 찬송하겠습니다
  alternatives_korean:
  - 내가 주의 이름을 감사하겠습니다
  - 내가 주의 이름을 고백하겠습니다
  lexicon: 해당 없음
  rationale: ידה의 예배적 의미를 ‘찬송하다’로 자연스럽게 살렸고, 히브리어에 있는 ‘이름’을 그대로 보존했습니다.
- source_word: עֵצוֹת מֵרָחוֹק
  english_pob_choice: plans formed long ago
  chosen_korean: 오래전부터 세우신 계획은
  alternatives_korean:
  - 먼 곳에서부터의 계획은
  - 옛적부터의 계획은
  lexicon: 해당 없음
  rationale: ‘from afar’를 시간적 표현으로 이해한 POB의 해석을 따라, 하나님의 오래된 계획이라는 뜻이 분명하도록 한국어로 풀었습니다.
- source_word: אֱמוּנָה אֹמֶן
  english_pob_choice: faithful and sure
  chosen_korean: 신실하고 확고합니다
  alternatives_korean:
  - 신실하고 진실합니다
  - 믿음직하고 확실합니다
  lexicon: 해당 없음
  rationale: 두 개의 밀접한 형용사적 성격을 한국어의 병렬 형용사로 살려, 계획의 신실성과 견고함을 함께 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 원문의 언약적 하나님의 이름을 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 일반 칭호가 아니라 יְהוָה를 직접 사용하므로, 이름 자체를 드러내는 번역이 원문의 초점을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 마지막 절의 의미 구조
  chosen_reading: ‘오래전부터 세우신 계획은 신실하고 확고합니다’로, 계획의 성격을 설명하는 말로 읽었습니다.
  alternative_readings:
  - ‘오래전부터 신실함과 확고함으로’
  - ‘오래전부터 세우신 일은 신실과 진실입니다’
  rationale: POB의 주석처럼 마지막 구는 추상적 속성의 나열이 아니라 하나님의 옛 계획이 신실하고 견고하다는 의미를 전합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
