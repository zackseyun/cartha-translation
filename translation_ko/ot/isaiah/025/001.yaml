  rationale: 단수 פֶּלֶא와 복수 עֵצוֹת를 더 직접적으로 반영하고, 원문에 없는 ‘세우신’을 제거했습니다. 호격 ‘야훼여’와 ‘주께서는’을 사용하여 현대 표준어 합쇼체의 자연스러움과 경건한 문체를 함께 유지했습니다. 마지막 구절의 문법적 압축성과 해석 가능성은 각주에 보존했습니다.
