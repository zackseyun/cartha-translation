  source_fidelity: 히브리어의 두 회복 이미지(다리 저는 이의 도약, 말 못하던 이의 기쁨의 발성)와 광야·아라바의 물 이미지는 대체로 충실히 반영되었습니다. 다만 두 절의 미완료적 미래 전망을 한국어에서도 일관되게 드러내고, 각주 표지는 해당 어구에 직접 붙이는 것이 필요합니다.
  naturalness: ‘저는 자’와 ‘벙어리’는 현대 표준어에서 각각 다소 어색하거나 낙인성이 있어, 현대적인 표현인 ‘다리 저는 이’와 ‘말 못하던 이’가 더 자연스럽고 존중하는 문체입니다. ‘시내들이 흐를 것입니다’는 복수형 נְחָלִים을 자연스럽게 반영합니다.
  terminology: ‘사슴’, ‘광야’, ‘사막 평원’은 본문의 시적 지형어와 의미를 적절히 살립니다. עֲרָבָה의 지명 가능성은 각주로 보존해야 합니다. רנן의 대안은 ‘기뻐 외칠 것입니다’로 제시할 수 있습니다.
