revisions:
- from: 그때에 저는 자가 사슴처럼 뛰어오르고, 벙어리의 혀는 기뻐 노래할 것입니다. 이는 광야에서 물이 터져 나오고, 사막 평원에 시내가 흐를 것이기 때문입니다.[a][b]
  to: 그때에 다리 저는 이는 사슴처럼 뛰어오르고, 말 못하던 이의 혀는 기뻐 노래할 것입니다.[a] 이는 광야에서 물이 터져 나올 것이며, 사막 평원에는 시내들이 흐를 것이기 때문입니다.[b]
  rationale: 현대 표준어 합쇼체에 맞도록 사람을 지칭하는 표현을 정비하고, 히브리어의 예언적 전망과 복수형을 더 분명히 했습니다. 본문의 구체적 회복 이미지는 유지했으며, עֲרָבָה의 일반 명사/고유명사 양 가능성과 רנן의 어휘적 대안은 각각 해당 위치의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:41Z'
