id: ISA.35.6
reference: Isaiah 35:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז יְדַלֵּ֤ג כָּֽ/אַיָּל֙ פִּסֵּ֔חַ וְ/תָרֹ֖ן לְשׁ֣וֹן אִלֵּ֑ם כִּֽי נִבְקְע֤וּ בַ/מִּדְבָּר֙ מַ֔יִם וּ/נְחָלִ֖ים בָּ/עֲרָבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
  footnotes:
  - marker: a
    text: Or 'will shout for joy' for 'will sing for joy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the Arabah,' taking the term as a geographic name rather than the common noun 'desert plain.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 저는 자가 사슴처럼 뛰어오르고, 벙어리의 혀는 기뻐 노래할 것입니다. 이는 광야에서 물이 터져 나오고, 사막 평원에 시내가 흐를 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐 외칠 것입니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아라바에’. 이 경우를 지리적 고유명으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  english_pob_choice: will leap
  chosen_korean: 뛰어오르고
  alternatives_korean:
  - 뛸 것이며
  - 폴짝 뛸 것입니다
  lexicon: HALOT
  rationale: 역동적인 도약을 나타내는 piel의 뉘앙스를 살리기 위해 단순한 ‘뛰다’보다 방향감이 있는 ‘뛰어오르다’를 택했습니다.
- source_word: פִּסֵּחַ
  english_pob_choice: the lame
  chosen_korean: 자가
  alternatives_korean:
  - 절름발이
  - 다리를 저는 사람
  lexicon: HALOT
  rationale: 히브리어는 특정 인물보다 상태를 가리키는 형용사적 용법이므로, 한국어에서는 명사화된 자연스러운 표현으로 옮겼습니다. 다만 문장 흐름상 ‘자가’보다 ‘절름발이’가 직관적일 수 있어 대안으로 남깁니다.
- source_word: לְשׁוֹן אִלֵּם
  english_pob_choice: the tongue of the mute
  chosen_korean: 벙어리의 혀
  alternatives_korean:
  - 말 못하는 사람의 혀
  - 말 못하던 이의 혀
  lexicon: HALOT
  rationale: 직역에 가까운 구조를 유지해 ‘혀’와 ‘말하지 못함’의 대비를 살렸습니다. 전통적 어휘인 ‘벙어리’는 현대어에서 다소 거칠 수 있으나, 본문의 강한 회복 이미지를 보존합니다.
- source_word: בָּעֲרָבָה
  english_pob_choice: in the desert plain
  chosen_korean: 사막 평원
  alternatives_korean:
  - 아라바에
  - 광야 평원
  lexicon: HALOT
  rationale: 여기서는 고유지명 ‘아라바’보다 앞절의 ‘광야’와 평행을 이루는 일반 명사적 지형 묘사가 더 자연스럽습니다. ‘사막 평원’은 건조한 평지라는 지형감을 살립니다.
theological_decisions:
- issue: 기적적 치유와 자연적 회복의 범위
  chosen_reading: 본문이 말하는 신체적 회복과 환경적 풍요를 둘 다 살리되, 이를 순전히 상징적이거나 오직 문자적인 성취로 미리 한정하지 않았습니다.
  alternative_readings:
  - 영적 회복만을 가리키는 비유
  - 종말론적 문자 성취만을 가리키는 예언
  rationale: 히브리어 본문은 장애의 역전과 황무지의 물 공급을 함께 제시하므로, 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 예언 본문의 다층적 성취 가능성을 열어 둠
