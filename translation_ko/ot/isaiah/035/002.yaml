  alternatives_korean:
  - 기뻐하고, 참으로 기쁨으로, 노래하며 외칠 것입니다
  - 기뻐하며 환호하고 크게 즐거워할 것입니다
  lexicon: HALOT
  rationale: גיל 계열의 중첩된 기쁨 표현과 אַף의 강조를 살리기 위해, 동사와 보조적 표현을 겹쳐 ‘더구나’로 강조를 옮겼습니다.
- source_word: כְּבוֹד הַלְּבָנוֹן ... הֲדַר הַכַּרְמֶל וְהַשָּׁרוֹן
  english_pob_choice: The glory of Lebanon ... the majesty of Carmel and Sharon
  chosen_korean: 레바논의 영광... 갈멜과 샤론의 위엄
  alternatives_korean:
  - 레바논의 영광... 갈멜과 샤론의 장엄함
  - 레바논의 아름다움... 갈멜과 샤론의 위엄
  lexicon: HALOT
  rationale: כבוד는 ‘영광’으로, הדר는 반복을 피하면서도 고양된 뉘앙스를 유지하는 ‘위엄’으로 옮겨 두 병행구를 구분했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project_glossary
  rationale: 프로젝트 기본어를 따라 여호와 대신 ‘야훼’를 유지하여 원어 고유명을 직접 드러냈습니다.
- source_word: הֵמָּה יִרְאוּ
  english_pob_choice: They will see
  chosen_korean: 그들은 ... 볼 것입니다
  alternatives_korean:
  - 그것들은 ... 볼 것입니다
  - 사람들은 ... 볼 것입니다
  lexicon: HALOT
  rationale: 히브리어 복수 대명사와 동사를 그대로 살려, 회복된 땅의 수혜자들을 가리키는 복수 주어를 한국어에서도 보존했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에는 고유명사 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 전통 교회식 ‘주님’
  - ‘여호와’
  rationale: 본 절은 야훼라는 언약적 신명 자체를 사용하므로, 의미를 희석하는 대체어보다 원천어의 직접성을 살렸습니다.
  doctrine_reference: 'Project glossary: YHWH → 야훼'
- issue: 황무지의 의인화와 복수 주어
  chosen_reading: 복원된 땅의 아름다움을 누리는 자들을 가리키는 복수 주어를 유지했습니다.
  alternative_readings:
  - ‘그곳에서 야훼의 영광이 보일 것입니다’로 재구성
  - 대상을 단수로 처리해 의인화를 약화
  rationale: 히브리어의 명시적 복수 대명사(הֵמָּה)와 동사를 지우지 않고, 시적 전환을 살려 독자가 본문 구조를 보게 했습니다.
  doctrine_reference: Poetic grammar preservation
