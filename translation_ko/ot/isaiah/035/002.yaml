  to: 그것은 풍성히 꽃피고 기뻐하며, 참으로 기쁨으로 환호할 것입니다.[a] 레바논의 영광과 갈멜과 샤론의 위엄이 그 땅에 주어질 것입니다.[b] 그들은 야훼의 영광, 우리 하나님의 위엄을 볼 것입니다.[c]
  rationale: 수여 동사 하나가 두 병행 명사구를 지배하는 원문의 구조를 회복하고, 기쁨의 강조와 환호의 의미를 더 자연스럽고 투명하게 다듬었습니다. 마지막 ‘그들은’은 원문의 복수 대명사를 보존하며 그 지시 대상을 해석적으로 확정하지 않습니다.
