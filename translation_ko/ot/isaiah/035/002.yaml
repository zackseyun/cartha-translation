source:
  edition: WLC
  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
  footnotes:
  - marker: a
    text: Or 'will surely blossom'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Lebanon, Carmel, and Sharon are regions famed for natural beauty and fertility; the imagery depicts the desert receiving their splendor.
    reason: cultural_note
  - marker: c
    text: Hebrew 'YHWH,' traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 풍성히 꽃피고 기뻐하며, 참으로 기쁨으로 환호할 것입니다.[a] 레바논의 영광과 갈멜과 샤론의 위엄이 그 땅에 주어질 것입니다.[b] 그들은 야훼의 영광, 우리 하나님의 위엄을 볼 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍성히 꽃피고’는 히브리어의 부정사절대와 동사 결합이 나타내는 강조를 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 레바논, 갈멜, 샤론은 아름다움과 비옥함으로 알려진 지역들입니다. 이 이미지는 광야가 그들의 찬란함을 받는 모습을 그립니다.
    reason: cultural_note
  - marker: c
    text: ‘야훼’는 히브리어 신명 YHWH를 옮긴 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  english_pob_choice: will blossom abundantly
  chosen_korean: 풍성히 꽃피며
  alternatives_korean:
