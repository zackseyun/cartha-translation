    rationale: ‘기뻐하고, 더구나 환호하며 즐거워할 것입니다’는 두 동작의 관계가 매끄럽지 않습니다. גיל의 반복적 강조와 רנן의 소리 내는 기쁨을 ‘기뻐하며, 참으로 기쁨으로 환호할 것입니다’로 옮기면 구조가 더 투명합니다.
