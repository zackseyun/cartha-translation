  to: 야훼께 속량받은 이들은[a] 돌아와 시온에 노래를 부르며 들어올 것입니다. 영원한 기쁨이 그들의 머리 위에 있을 것이며, 즐거움과 기쁨이 그들을 따라잡을 것입니다. 슬픔과 탄식은 달아날 것입니다.
  rationale: 의미상 안전한 최소 수정으로, פְדוּיֵי의 피동적 의미를 ‘야훼께 속량받은 이들’로 분명히 하고 해당 어휘 바로 뒤에 각주를 배치했습니다. 각주는 원문의 가능한 한국어 번역 대안만 제시하도록 고쳐 능동으로 읽히는 설명을 제거했습니다. 나머지 번역은 원문에 충실하고 현대 한국어 합쇼체로 자연스러워 유지했습니다.
