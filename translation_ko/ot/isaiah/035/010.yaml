  source_fidelity: 원문의 주요 의미와 시적 병렬은 충실히 반영되었습니다. ‘돌아와 시온에 … 들어올 것입니다’, ‘영원한 기쁨이 그들의 머리 위에’, 그리고 기쁨이 그들을 ‘따라잡고’ 슬픔과 탄식이 달아나는 이미지는 히브리어의 흐름을 잘 살립니다. 다만 פְדוּיֵי의 대안 풀이에 붙은 각주가 문단 끝에 있어 해당 어휘와의 연결이 불분명합니다.
  naturalness: 합쇼체 문장과 전반적인 한국어 표현은 자연스럽습니다. ‘야훼께 속량받은 이들’은 원문의 피동적 구속·속량 의미를 더 직접적이고 자연스럽게 드러냅니다. ‘노래를 부르며’는 רִנָּה의 가능한 표현으로 무난합니다.
  terminology: YHWH를 ‘야훼’로, פְדוּיֵי를 ‘속량받은’으로 옮긴 것은 프로젝트 용례 및 원어 의미에 부합합니다. ‘속량’은 פדה가 지닌 되찾음/구속의 의미를 보존합니다. 기존 각주의 ‘값 주고 되찾아온’은 능동형으로 읽히고, 본문의 피동 분사와 맞지 않으므로 삭제하는 것이 적절합니다.
