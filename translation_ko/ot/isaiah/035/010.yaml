  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשֻׁב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂ֔יגוּ וְ/נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
  footnotes:
  - marker: a
    text: Or, 'the ransomed of the LORD.' The Hebrew term can denote those reclaimed by redemption or ransom.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 구속받은 자들은 돌아와 시온에 노래를 부르며 들어올 것입니다. 영원한 기쁨이 그들의 머리 위에 있을 것이며, 즐거움과 기쁨이 그들을 따라잡을 것입니다. 슬픔과 탄식은 달아날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구속받은’은 ‘속량받은’ 또는 ‘값 주고 되찾아온’의 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  english_pob_choice: the redeemed of Yahweh
  chosen_korean: 야훼의 구속받은 자들
  alternatives_korean:
  - 야훼께서 속량하신 자들
  - 야훼의 속량받은 자들
  lexicon: HALOT
  rationale: פְדוּיֵי는 פדה의 피동 분사로 ‘구속받은/속량받은 자들’의 뜻입니다. 한국어에서는 ‘구속받은 자들’이 원문의 구원-해방 의미를 자연스럽게 살리며, YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּבָאוּ צִיּוֹן
  english_pob_choice: and come to Zion
  chosen_korean: 시온에 … 들어올 것입니다
  alternatives_korean:
  - 시온으로 올 것입니다
  - 시온에 올 것입니다
  lexicon: HALOT
  rationale: בוא는 ‘오다/들어오다’의 뜻이므로, 시온이 목적지인 문맥에서 ‘들어오다’가 도착의 이미지와 시적 움직임을 더 분명히 드러냅니다.
- source_word: בְּרִנָּה
  english_pob_choice: with singing
  chosen_korean: 노래를 부르며
  alternatives_korean:
  - 기쁨의 소리를 지르며
  - 환호하며
  lexicon: HALOT
  rationale: רִנָּה는 단순한 감정이 아니라 기쁨의 외침/노래를 가리키므로, 한국어에서는 자연스럽고 직접적인 표현인 ‘노래를 부르며’로 옮겼습니다.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  english_pob_choice: Gladness and joy
  chosen_korean: 즐거움과 기쁨
  alternatives_korean:
  - 환희와 기쁨
  - 즐거움과 환희
  lexicon: HALOT
  rationale: 두 명사는 의미가 겹치지만 중복을 없애지 않고 병렬을 살리기 위해 ‘즐거움과 기쁨’으로 구분해 옮겼습니다. 앞의 ‘기쁨’ 반복은 허용되는 시적 중첩으로 보았습니다.
- source_word: יַשִּׂיגוּ
  english_pob_choice: will overtake them
  chosen_korean: 그들을 따라잡을 것입니다
  alternatives_korean:
  - 그들에게 미칠 것입니다
  - 그들에게 다가갈 것입니다
  lexicon: HALOT
  rationale: נשג는 ‘따라잡다/미치다’의 뜻이 있어, 즐거움과 기쁨이 사람들을 능동적으로 ‘따라잡는다’는 시적 역동성을 살렸습니다.
- source_word: יָגוֹן וַאֲנָחָה
  english_pob_choice: sorrow and sighing
  chosen_korean: 슬픔과 탄식
  alternatives_korean:
  - 근심과 탄식
  - 슬픔과 신음
  lexicon: HALOT
  rationale: יָגוֹן은 슬픔/근심, אֲנָחָה는 한숨/탄식의 뜻입니다. 한국어에서는 감정과 소리의 뉘앙스를 함께 담는 ‘슬픔과 탄식’이 가장 자연스럽습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문은 신명기적 이름인 יְהוָה를 직접 사용하므로, 본 번역 원칙에 따라 익명화된 ‘주님’이 아니라 고유명사적 표기 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘구속받은 자들’의 구원 이미지
  chosen_reading: 구속받은 자들
  alternative_readings:
  - 속량받은 자들
  - 구원받은 자들
  rationale: 본문은 단순한 일반 구원이 아니라 값 주고 되찾아온 해방의 이미지를 담고 있으므로, 한국어에서도 법정적·해방적 뉘앙스가 살아 있는 ‘구속받은 자들’을 택했습니다.
  doctrine_reference: Isaiah redemption motif in context; POB salvage/return imagery
