id: ISA.35.4
reference: Isaiah 35:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
  footnotes:
  - marker: a
    text: Or “those of a hasty heart,” that is, those inwardly agitated or panic-stricken.
    reason: lexical_alternative
  - marker: b
    text: Or “with the recompense of God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 마음이 불안한 사람들에게 말하십시오[a]. “힘을 내십시오. 두려워하지 마십시오. 보십시오, 여러분의 하나님께서 복수와 하나님의 보응을 가지고 오십니다[b]. 그분이 친히 오셔서 여러분을 구원하실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음이 급한 사람들,” 곧 내면이 동요하거나 공황에 빠진 사람들.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님께서 갚으심을 가지고.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנִמְהֲרֵי לֵב
  english_pob_choice: those with an anxious heart
  chosen_korean: 마음이 조급한 사람들
  alternatives_korean:
  - 마음이 불안한 사람들
  - 마음이 다급한 사람들
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘마음이 급한/서두르는 사람들’이지만, 문맥상 내면이 동요하고 겁먹은 상태를 가리키므로 한국어에서는 ‘마음이 조급한 사람들’로 옮겨 관용적 뜻을 살렸습니다.
- source_word: חִזְקוּ
  english_pob_choice: Be strong
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 강해지십시오
  - 담대하십시오
  lexicon: HALOT
  rationale: 복수 명령의 격려를 현대 한국어에서 자연스럽게 전달하기 위해 ‘힘을 내십시오’를 택했습니다. ‘강해지십시오’는 다소 직역적이고, ‘담대하십시오’는 다음 절의 두려움 금지와 의미가 겹칩니다.
- source_word: נָקָם
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  lexicon: HALOT
  rationale: 하나님의 감정적 ‘복수’보다 원수에 대한 심판 행위를 드러내는 말로 ‘보복’을 사용했습니다. 본문이 의도하는 날카로운 긴장을 약화하지 않으면서도 한국어에서 이해 가능하게 합니다.
- source_word: גְּמוּל אֱלֹהִים
  english_pob_choice: the recompense of God
  chosen_korean: 하나님의 보응
  alternatives_korean:
  - 하나님의 갚음
  - 하나님의 보상
  lexicon: HALOT
  rationale: גְּמוּל은 ‘갚음/보응/보수’의 뜻이므로, 여기서는 심판적 뉘앙스를 살리는 ‘보응’이 가장 가깝습니다. ‘보상’은 의미를 약화시킬 수 있어 피했습니다.
- source_word: וְיֹשַׁעֲכֶם
  english_pob_choice: and save you
  chosen_korean: 여러분을 구원하실 것입니다
  alternatives_korean:
  - 여러분을 구해 주실 것입니다
  - 여러분을 건져 주실 것입니다
  lexicon: HALOT
  rationale: ישׁע의 구원/구출 의미를 살리되, 이사야 본문 전체의 구속적 어조를 반영하여 ‘구원하실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘보복’과 ‘구원’의 병렬
  chosen_reading: 보복과 보응을 그대로 유지하고, 이어서 동일한 하나님이 친히 구원하신다는 흐름을 직설적으로 번역했습니다.
  alternative_readings:
  - ‘보복’을 ‘심판’으로 완화하기
  - 구원을 영적 의미로만 제한하기
  rationale: 본문은 원수에 대한 하나님의 엄정한 대응과 자기 백성에 대한 구원을 나란히 둡니다. 그 긴장을 해소하지 않고 그대로 드러내는 것이 원문 충실성에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 직접 화법의 호칭과 종결
  chosen_reading: 선지자적 권면은 ‘말하십시오’로, 하나님에 대한 서술은 존대형 미래 시제로 유지했습니다.
  alternative_readings:
  - ‘말하라’의 명령형으로 통일하기
  - 비인칭 서술로 완화하기
  rationale: 한국어 합쇼체를 따르면서도 원문의 명령과 약속을 분명하게 전달하기 위해 화법을 분리했습니다.
  doctrine_reference: Korean target style guide
