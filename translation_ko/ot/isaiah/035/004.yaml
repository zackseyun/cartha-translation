revisions:
- from: 마음이 조급한 사람들에게 말하십시오[a] — "힘을 내십시오. 두려워하지 마십시오. 보십시오, 여러분의 하나님이 보복과 함께, 하나님의 보응과 함께 오십니다[b]. 바로 그분이 오셔서 여러분을 구원하실 것입니다."
  to: 마음이 불안한 사람들에게 말하십시오[a]. “힘을 내십시오. 두려워하지 마십시오. 보십시오, 여러분의 하나님께서 복수와 하나님의 보응을 가지고 오십니다[b]. 그분이 친히 오셔서 여러분을 구원하실 것입니다.”
  rationale: The revision uses contemporary Korean that more clearly expresses the contextual sense of the idiom for an agitated heart, while retaining its literal alternative in footnote a. It removes repetitive phrasing, renders נָקָם directly as ‘복수,’ preserves the paired ‘vengeance/recompense’ language without theological softening, retains the emphatic divine subject in ‘그분이 친히,’ and replaces the duplicate footnote b with a real lexical alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse''s central sequence faithfully: an exhortation to the inwardly agitated, a prohibition of fear, God''s coming in vengeance/recompense, and God''s personal saving action. However, ‘마음이 조급한’ commonly suggests impatience or a tendency to rush in contemporary Korean more than alarm or anxiety; ‘마음이 불안한’ better communicates the contextual force while retaining the literal alternative in a note. The emphatic independent pronoun הוּא is appropriately represented by ‘친히.’'
  naturalness: The repeated construction ‘보복과 함께, 하나님의 보응과 함께’ is cumbersome in Korean. Rendering the paired nouns as the manner/purpose of God's coming (‘보복하시고 하나님께서 갚아 주시려고’) is natural but may overresolve syntax; retaining the noun pair without repeating ‘함께’ is preferable. ‘보복’ is understandable, but ‘복수’ is the more direct standard equivalent of נָקָם; it should not be softened into a merely judicial term.
  terminology: ‘하나님의 보응’ is a suitable rendering of גְּמוּל אֱלֹהִים, and ‘구원하실 것입니다’ suitably renders the Hiphil of ישׁע without restricting its sense. Footnote b is invalid as a lexical-alternative note because it exactly repeats the main-text wording; it needs a genuine alternative or explanatory literal rendering.
  issues:
  - severity: medium
    issue: ‘마음이 조급한’ may be read as ‘impatient’ rather than anxious or panic-stricken.
    rationale: נִמְהֲרֵי־לֵב literally has a ‘hasty of heart’ sense, but the immediate exhortation not to fear indicates inward alarm. ‘마음이 불안한’ is clearer in modern Korean, while the literal possibility can remain in the note.
  - severity: low
    issue: The phrase ‘보복과 함께, 하나님의 보응과 함께’ unnecessarily repeats ‘함께.’
    rationale: The Hebrew places נָקָם and גְּמוּל אֱלֹהִים side by side. Korean can preserve this pairing more idiomatically as ‘복수와 하나님의 보응을 가지고.’
  - severity: medium
    issue: Footnote b duplicates the main text and therefore supplies no alternative.
    rationale: A lexical-alternative footnote must provide a distinct viable rendering, such as ‘하나님께서 갚으심,’ while preserving the construct/genitival ambiguity.
  revised_text: 마음이 불안한 사람들에게 말하십시오[a]. “힘을 내십시오. 두려워하지 마십시오. 보십시오, 여러분의 하나님께서 복수와 하나님의 보응을 가지고 오십니다[b]. 그분이 친히 오셔서 여러분을 구원하실 것입니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “마음이 급한 사람들,” 곧 내면이 동요하거나 공황에 빠진 사람들.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님께서 갚으심을 가지고.”
    reason: lexical_alternative
  revision_rationale: The revision uses contemporary Korean that more clearly expresses the contextual sense of the idiom for an agitated heart, while retaining its literal alternative in footnote a. It removes repetitive phrasing, renders נָקָם directly as ‘복수,’ preserves the paired ‘vengeance/recompense’ language without theological softening, retains the emphatic divine subject in ‘그분이 친히,’ and replaces the duplicate footnote b with a real lexical alternative.
