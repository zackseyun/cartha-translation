source:
  edition: WLC
  text: חַזְּק֖וּ יָדַ֣יִם רָפ֑וֹת וּ/בִרְכַּ֥יִם כֹּשְׁל֖וֹת אַמֵּֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/003.yaml
  text: Strengthen weak hands[a], and make firm feeble knees.
  footnotes:
  - marker: a
    text: Or 'feeble knees' or 'knees that give way.' The Hebrew participle pictures knees that are stumbling or tottering.
    reason: lexical_alternative
translation:
  language: ko
  text: 연약한 손을 강하게 하십시오. 떨리는 무릎을 굳게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘흔들리거나 넘어질 듯한 무릎’의 생생한 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַזְּקוּ
  english_pob_choice: Strengthen
  chosen_korean: 강하게 하십시오
  alternatives_korean:
  - 굳세게 하십시오
  - 강건하게 하십시오
  - 힘을 주십시오
  lexicon: HALOT
  rationale: 피엘 명령형 복수로서 뒤따르는 신체 부위를 능동적으로 회복시키라는 뜻이므로, 한국어에서는 직접적이고 자연스러운 명령인 ‘강하게 하십시오’로 옮겼습니다.
- source_word: יָדַיִם רָפוֹת
  english_pob_choice: weak hands
  chosen_korean: 연약한 손
  alternatives_korean:
  - 약한 손
  - 무기력한 손
  - 축 늘어진 손
  lexicon: HALOT
  rationale: ‘손’은 문자적 신체 이미지이므로 유지하고, רָפוֹת의 약화·무력 상태를 ‘연약한’으로 담아 현대 한국어에서도 무난하게 읽히도록 했습니다.
- source_word: בִּרְכַּיִם כֹּשְׁלוֹת
  english_pob_choice: feeble knees / knees that give way
  chosen_korean: 떨리는 무릎
  alternatives_korean:
  - 휘청이는 무릎
  - 주저앉는 무릎
  - 흔들리는 무릎
  lexicon: HALOT
  rationale: כֹּשְׁלוֹת는 단순히 약한 상태보다 ‘흔들리며 넘어질 듯한’ 역동성을 지니므로, 무릎의 불안정함을 자연스럽게 살리는 ‘떨리는 무릎’으로 옮겼습니다.
- source_word: אַמֵּצוּ
  english_pob_choice: make firm
  chosen_korean: 굳게 하십시오
  alternatives_korean:
  - 단단하게 하십시오
  - 견고하게 하십시오
  - 힘을 내게 하십시오
  lexicon: HALOT
  rationale: חזק와 의미가 겹치지만 동일하지 않으므로, 반복을 피하면서도 안정성과 지지를 드러내는 ‘굳게 하십시오’를 선택했습니다.
theological_decisions:
- issue: 병든 신체의 회복 권면을 어떻게 한국어로 전달할지
  chosen_reading: 이 구절은 위로의 선언이 아니라, 낙심한 공동체에게 강건함을 회복하라고 촉구하는 명령으로 읽었습니다.
  alternative_readings:
  - 위로의 일반적 격려로 완화해서 읽기
  - 비유를 약화시켜 단순한 용기부여로 읽기
  rationale: 히브리어 명령형들이 연속되므로, 한국어도 권면의 긴장을 유지해야 본문의 추진력과 시적 대구가 살아납니다.
  doctrine_reference: Isaiah 35의 회복과 격려의 문맥
