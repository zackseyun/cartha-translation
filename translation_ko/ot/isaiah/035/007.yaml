    rationale: 승냥이는 통상 dhole을 뜻하고, 자칼은 현대 표준어로 ‘자칼’입니다. 원문의 동물 지시가 절대적으로 종을 확정하는 것은 아니지만, 영어 감사본의 선택과 일반적 문맥에는 ‘자칼’이 더 적절합니다.
