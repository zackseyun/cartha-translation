  - 사막의 뜨거움
  lexicon: HALOT
  rationale: שָׁרָב은 단순한 추상어보다 땅의 열기와 메마름을 함께 떠올리게 하므로, ‘뜨거운 모래’가 시각적·감각적 이미지를 가장 자연스럽게 옮깁니다.
- source_word: לַאֲגַם
  english_pob_choice: a pool
  chosen_korean: 못
  alternatives_korean:
  - 웅덩이
  - 연못
  - 소택지
  lexicon: HALOT
  rationale: אֲגַם은 물이 고인 장소로, 한국어 ‘못’이 짧고 자연스럽게 변화를 보여 줍니다.
- source_word: בִּנְוֵה תַנִּים
  english_pob_choice: in the haunt of jackals
  chosen_korean: 승냥이의 서식처
  alternatives_korean:
  - 승냥이의 거처
  - 승냥이의 소굴
  - 자칼의 서식처
  lexicon: HALOT
  rationale: תַנִּים은 예언서의 황폐한 들짐승을 가리키는 말로, 한국어에서는 통용되는 성경어휘인 ‘승냥이’를 택해 황량한 분위기를 살렸습니다.
- source_word: לְקָנֶה וָגֹמֶא
  english_pob_choice: reeds and rushes
  chosen_korean: 갈대와 골풀
  alternatives_korean:
  - 갈대와 수초
  - 갈대와 파피루스
  - 갈대와 부들
  lexicon: HALOT
  rationale: קָנֶה는 갈대, גֹמֶא은 갈대류보다 더 습지성인 골풀/골초로 옮길 수 있으나, 시적 병렬을 살리기 위해 ‘갈대와 골풀’로 간결하게 처리했습니다.
theological_decisions:
- issue: 황폐한 땅의 회복을 어떤 문체로 나타낼지
  chosen_reading: 기적적 전환의 이미지를 직접적으로 드러내어, 메마름이 물과 식생으로 바뀌는 대비를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘젖은 땅이 될 것입니다’처럼 낮추는 방식
  - 상징적으로만 재해석하는 방식
  rationale: 본문은 회복의 물리적·상징적 반전을 함께 말하므로, 이를 약화하지 않고 그대로 표현하는 것이 source-direct합니다.
  doctrine_reference: 이사야 35장의 회복 예언
