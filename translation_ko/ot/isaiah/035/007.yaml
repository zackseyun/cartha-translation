  naturalness: ‘못이 되고’, ‘물이 솟는 샘들이 되며’의 병렬은 자연스럽지 않고 문장 종결도 합쇼체로 일관되지 않습니다. ‘연못이 되고’, ‘물이 솟는 샘들이 될 것이며’ 및 ‘풀이 돋고 … 자랄 것입니다’로 고쳐 현대 한국어 문장성과 합쇼체를 갖추었습니다.
  terminology: ‘연못’, ‘물 샘’, ‘갈대’, ‘골풀’은 본문의 습지·회복 어휘를 무리 없이 전달합니다. ‘골풀’에 대한 ‘파피루스’ 대안은 유지했습니다. ‘승냥이’는 한국어 성경 전통에는 있으나 현대 동물명으로는 자칼과 다르므로, 영어 감사본의 ‘jackals’ 및 본문 문맥에 맞추어 ‘자칼’로 수정했습니다.
