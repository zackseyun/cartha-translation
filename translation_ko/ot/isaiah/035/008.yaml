- from: 거기에는 대로와 길이 있을 것이며, 그 길은 거룩한 길이라 불릴 것입니다. 더러운 자는 거기로 지나가지 못하고, 그 길은 그들을 위한 길입니다[a]. 길을 걷는 자라면 누구든지 — 어리석은 사람이라도 — 길을 잃지 않을 것입니다[b].
  to: 거기에는 대로와 길이 있을 것이며, 그 길은 ‘거룩한 길’이라 불릴 것입니다. 부정한 자는 그 길을 지나가지 못하지만, 그 길은 그들을 위한 것입니다[a]. 그 길을 걷는 자는, 어리석은 자들까지도, 길을 잃지 않을 것입니다[b].
  rationale: 원문의 어휘 범위와 난해한 구문의 모호성을 보존하면서, 현대 표준 한국어 합쇼체의 자연스러움을 높였습니다. 특히 טָמֵא의 번역을 ‘부정한 자’로 조정하고, 문체상 중복과 각주 b의 반복을 바로잡았습니다.
