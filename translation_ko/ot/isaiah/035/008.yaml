id: ISA.35.8
reference: Isaiah 35:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
  footnotes:
  - marker: a
    text: 'Hebrew clause difficult: ''but it shall be for them'' may also be understood as ''and he shall be with them'' or ''it shall belong to them.'''
    reason: alternative_reading
  - marker: b
    text: Or 'shall not wander' / 'shall not err.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에는 대로와 길이 있을 것이며, 그 길은 ‘거룩한 길’이라 불릴 것입니다. 부정한 자는 그 길을 지나가지 못하지만, 그 길은 그들을 위한 것입니다[a]. 그 길을 걷는 자는, 어리석은 자들까지도, 길을 잃지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 압축된 구절은 ‘그 길은 그들을 위한 것입니다’ 외에도 ‘그가 그들과 함께 있을 것입니다’ 또는 ‘그 길은 그들에게 속합니다’로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘방황하지 않을 것입니다’ 또는 ‘그릇되지 않을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  english_pob_choice: highway
  chosen_korean: 대로
  alternatives_korean:
  - 큰길
  - 고속도로
  - 높여 만든 길
  lexicon: HALOT
  rationale: 사람이 다닐 수 있도록 준비된 길의 이미지를 살리면서, 현대 한국어에서 자연스럽고 지나치게 현대적 제도어로 치우치지 않는 표현을 택했습니다.
- source_word: דֶּרֶךְ
  english_pob_choice: road / way
  chosen_korean: 길
  alternatives_korean:
  - 도로
  - 길
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서 자연스럽게 옮기기 위해 기본형은 '길'로 두되, '거룩한 길'에서는 이름 붙은 성격을 드러내도록 했습니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: Holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 거룩한
  lexicon: HALOT
  rationale: 도로의 기능적 수식이 아니라 하나님께 구별된 길이라는 뜻을 살리기 위해 '거룩한'을 사용했습니다.
- source_word: וְהוּא לָמוֹ
  english_pob_choice: but it shall be for them
  chosen_korean: 그 길은 그들을 위한 길입니다
  alternatives_korean:
  - 그 길은 그들을 위한 것입니다
  - 그 길은 그들에게 속합니다
  - 그 길은 그들과 함께 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문은 문맥상 '길'을 주어로 받아 '그들을 위한 길'로 풀어 쓰는 것이 가장 자연스럽고, 이어지는 '그 길을 걷는 자'와도 잘 이어집니다.
- source_word: לֹא יִתְעוּ
  english_pob_choice: shall not go astray
  chosen_korean: 길을 잃지 않을 것입니다
  alternatives_korean:
  - 벗어나지 않을 것입니다
  - 방황하지 않을 것입니다
  - 잘못되지 않을 것입니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 '벗어나다/길을 잃다'를 한국어의 관용적 표현으로 살려, 순례길의 문자적·비유적 의미를 함께 유지했습니다.
theological_decisions:
- issue: אַ/טָמֵא의 범위
  chosen_reading: '''더러운 자''로 넓게 두어, 의례적 부정과 اخلاق적 더러움의 긴장을 한쪽으로 좁히지 않았습니다.'
  alternative_readings:
  - '''부정한 자'''
  - '''의식적으로 부정한 자'''
  - '''도덕적으로 더러운 자'''
  rationale: 예언서 문맥에서 טָמֵא는 제의적·윤리적 함의를 함께 가질 수 있으므로, 한국어도 단일 범주로 확정하지 않고 넓게 남겨 두는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
