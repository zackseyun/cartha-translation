    rationale: 히브리어 פתח의 기본 뜻은 ‘열리다’이며, ‘막힘이 풀리다’는 귀와 관련된 문맥적 대안입니다. 각주는 이를 직접 밝혀야 하며, 현행 문구는 본문 ‘열릴 것입니다’와 영어의 ‘will be unstopped’의 관계를 부정확하게 설명합니다.
  - severity: low
