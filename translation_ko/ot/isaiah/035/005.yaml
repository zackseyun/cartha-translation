  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
  footnotes:
  - marker: a
    text: Or 'will be opened' for 'the ears of the deaf will be unstopped.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 맹인들의 눈이 열리고, 귀먹은 이들의 귀가 열릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀먹은 이들의 귀가 열릴 것입니다’는 직역에 가깝고, 영어 POB의 ‘will be unstopped’처럼 ‘막힘이 제거된다’는 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 시간 부사로, 한국어에서는 간결한 ‘그때’가 앞뒤 문맥의 미래적 전개를 자연스럽게 살립니다.
- source_word: תִּפָּקַחְנָה / תִּפָּתַחְנָה
  english_pob_choice: will be opened / will be opened
  chosen_korean: 열리고
  alternatives_korean:
  - 열릴 것이며
  - 열려지고
  - 열리게 되고
  lexicon: HALOT
  rationale: 두 동사는 각각 눈과 귀에 대해 ‘열리다’로 옮기면 원문의 수동적 회복 이미지를 가장 직접적으로 전달합니다.
- source_word: עִוְרִים / חֵרְשִׁים
  english_pob_choice: the blind / the deaf
  chosen_korean: 맹인들 / 귀먹은 이들
  alternatives_korean:
  - 눈먼 사람들 / 듣지 못하는 사람들
  - 장님들 / 귀머거리들
  lexicon: HALOT
  rationale: 본문은 신체적 상태를 지닌 복수 명사를 쓰므로, ‘맹인들’과 ‘귀먹은 이들’이 간결하면서도 원문의 집단적 표현을 유지합니다.
theological_decisions:
- issue: 치유 이미지의 범위
  chosen_reading: 신체적 회복 이미지를 그대로 살리되, 그것을 오직 문자적 치유나 오직 비유적 영적 통찰로만 제한하지 않았습니다.
  alternative_readings:
  - 오직 육체적 치유로만 제한
  - 오직 영적 깨달음으로만 해석
  rationale: 본문 자체가 ‘눈’과 ‘귀’라는 구체적 신체 이미지를 사용하므로, 해석 논쟁을 번역이 선취하지 않도록 긴장을 보존하는 것이 좋습니다.
  doctrine_reference: 예언적 회복의 범위를 번역에서 미리 확정하지 않음
