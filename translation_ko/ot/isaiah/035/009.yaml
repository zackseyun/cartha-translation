id: ISA.35.9
reference: Isaiah 35:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
  footnotes:
  - marker: a
    text: Or 'violent beast,' 'ferocious beast,' or 'predatory beast' for the Hebrew phrase 'ravenous beast.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun in 'go up on it' likely refers to the highway mentioned in the previous verse.
    reason: cross_reference
  - marker: c
    text: Or 'the ransomed'; this verse uses the Hebrew term for 'redeemed,' distinct from the term 'ransomed' used in the next verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에는 사자가 없고, 포악한 짐승도 그리로 올라오지 못하며, 그런 짐승은 거기에서 발견되지 않을 것입니다. 그러나 속량받은 자들은 그 길을 걸을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포악한 짐승’은 히브리어 פְרִיץ חַיּוֹת의 번역으로, ‘사나운 짐승’, ‘흉포한 짐승’, ‘포식성 짐승’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그리로 올라오지 못하며’의 대명사는 앞 절의 길/대로를 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: cross_reference
  - marker: c
    text: ‘속량받은 자들’은 ‘the redeemed’에 해당하며, 다음 절의 다른 속량 어휘와 구별됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 사냥감 짐승
  - 맹수
  lexicon: HALOT
  rationale: 일반적인 동물명으로서 가장 직접적인 대응어는 ‘사자’이며, 시적 문맥에서도 자연스럽습니다.
- source_word: פְרִיץ חַיּוֹת
  english_pob_choice: ravenous beast
  chosen_korean: 포악한 짐승
  alternatives_korean:
  - 사나운 짐승
  - 흉포한 짐승
  - 포식성 짐승
  lexicon: HALOT
  rationale: פְרִיץ는 폭력적이고 난폭한 성격을, חַיּוֹת은 들짐승/짐승류를 가리키므로 ‘포악한 짐승’이 위협성과 동물 이미지를 함께 살립니다.
- source_word: יַעֲלֶנָּה
  english_pob_choice: will go up on it
  chosen_korean: 그리로 올라오지 못하며
  alternatives_korean:
  - 그 위로 올라가지 못하며
  - 그 길로 올라오지 못하며
  lexicon: HALOT
  rationale: עלה의 ‘오르다/올라가다’를 살리되, 바로 앞 절의 길/대로 문맥을 반영해 한국어에서 자연스러운 부정 표현으로 옮겼습니다.
- source_word: גְּאוּלִים
  english_pob_choice: the redeemed
  chosen_korean: 속량받은 자들
  alternatives_korean:
  - 구속받은 자들
  - 구원받은 자들
  - 속량된 자들
  lexicon: HALOT
  rationale: POB가 גאל의 ‘redeem’을 살린 점을 따라, 다음 절의 פדה와 구별되도록 ‘속량받은 자들’로 옮겼습니다.
theological_decisions:
- issue: גְּאוּלִים의 구속/속량 어휘 구별
  chosen_reading: 속량받은 자들
  alternative_readings:
  - 구원받은 자들
  - 구속받은 자들
  rationale: 바로 다음 절에서 다른 구속 어휘가 쓰이므로, 여기서는 ‘속량’ 계열로 구별해 렉시컬 대비를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
