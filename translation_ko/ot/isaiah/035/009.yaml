  lexicon: HALOT
  rationale: עלה의 ‘오르다/올라가다’를 살리되, 바로 앞 절의 길/대로 문맥을 반영해 한국어에서 자연스러운 부정 표현으로 옮겼습니다.
- source_word: גְּאוּלִים
  english_pob_choice: the redeemed
  chosen_korean: 속량받은 자들
  alternatives_korean:
  - 구속받은 자들
  - 구원받은 자들
  - 속량된 자들
  lexicon: HALOT
  rationale: POB가 גאל의 ‘redeem’을 살린 점을 따라, 다음 절의 פדה와 구별되도록 ‘속량받은 자들’로 옮겼습니다.
