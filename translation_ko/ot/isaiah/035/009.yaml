source:
  edition: WLC
  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
  footnotes:
  - marker: a
    text: Or 'violent beast,' 'ferocious beast,' or 'predatory beast' for the Hebrew phrase 'ravenous beast.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun in 'go up on it' likely refers to the highway mentioned in the previous verse.
    reason: cross_reference
  - marker: c
    text: Or 'the ransomed'; this verse uses the Hebrew term for 'redeemed,' distinct from the term 'ransomed' used in the next verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에는 사자가 없고, 포악한 짐승도[a] 그 위로 올라가지 않으며[b], 거기에서 발견되지 않을 것입니다. 그러나 속량받은 이들은[c] 그곳을 걸어갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포악한 짐승’은 히브리어 פְרִיץ חַיּוֹת의 번역으로, ‘사나운 짐승’, ‘흉포한 짐승’, 또는 ‘포식성 짐승’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 위로 올라가지 않으며’의 여성 단수 대명사는 앞 절에서 언급된 길 또는 대로를 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: cross_reference
  - marker: c
    text: ‘속량받은 이들’은 히브리어 גאל(‘속량하다’)에서 온 말입니다. 다음 절에는 이와 다른 어근 פדה(‘값을 치르고 풀어 주다/속량하다’)가 사용됩니다.
    reason: lexical_alternative
