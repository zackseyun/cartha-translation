id: ISA.50.5
reference: Isaiah 50:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
  footnotes:
  - marker: a
    text: Or 'I did not draw back.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 제 귀를 여셨고, 저는 거역하지 않았으며, 뒤로 물러서지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤로 돌아서지 않았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: The Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 히브리어의 이중 호칭을 살려, 아도나이는 ‘주’, 여호와는 본문 표기대로 ‘여호와’로 옮겼습니다. 영어 POB의 ‘The Lord GOD’가 지키는 구분을 한국어에서도 유지했습니다.
- source_word: פָּתַח לִי אֹזֶן
  english_pob_choice: has opened my ear
  chosen_korean: 제 귀를 여셨으므로
  alternatives_korean:
  - 내 귀를 여셨으므로
  - 제 귀를 열어 주셨으므로
  - 내가 듣게 하셨으므로
  lexicon: HALOT
  rationale: 직역적 이미지를 보존하기 위해 ‘귀를 열다’를 살렸고, 종의 응답을 나타내는 문맥상 완료된 행위와 그 결과를 자연스럽게 드러내기 위해 ‘여셨으므로’로 처리했습니다.
- source_word: מָרִיתִי
  english_pob_choice: was not rebellious
  chosen_korean: 반역하지 않았고
  alternatives_korean:
  - 거역하지 않았고
  - 불순종하지 않았고
  - 반항하지 않았고
  lexicon: HALOT
  rationale: מרה의 핵심 의미인 ‘반역/거역’을 살리되, 종의 태도에 대한 강한 부정을 간결하게 표현했습니다. ‘반역하다’는 소명 거부의 뉘앙스를 유지합니다.
- source_word: נְסוּגֹתִי־אָחוֹר
  english_pob_choice: did not turn back
  chosen_korean: 뒤로 물러서지 않았습니다
  alternatives_korean:
  - 돌아서지 않았습니다
  - 물러서지 않았습니다
  - 뒤로 물러나지 않았습니다
  lexicon: HALOT
  rationale: אָחוֹר와 סוג의 결합이 뜻하는 ‘뒤로 물러남/되돌아감’을 한국어 관용으로 자연스럽게 옮겼습니다. 영어 주석의 대안인 ‘draw back’도 이 표현 안에 포괄됩니다.
theological_decisions:
- issue: 여호와의 고유명사 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 본문은 יְהוִה를 직접 포함하므로, 프로젝트 기본어인 ‘야훼’ 대신 영어 POB의 공시적 처리와 한국어 교회 독자 친숙성을 함께 고려해 ‘여호와’를 본문에 사용했습니다. 다만 이는 표기 관행상의 선택이며, 원문의 신적 고유명사 인식을 지우지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: ‘뒤로 물러서지 않았다’의 의미 범위
  chosen_reading: 소명에 대한 거절이나 회피가 없었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 방향을 바꾸지 않았다는 뜻
  - 두려워하지 않았다는 암시
  rationale: 히브리어의 ‘뒤로 돌아감’은 단순 공간 이동이 아니라 부르심을 회피하지 않는 순종을 나타냅니다. 따라서 문맥상 반역과 병렬되는 태도상의 충실함으로 이해했습니다.
  doctrine_reference: ISA.50:5 문맥 — 종의 순종 고백
