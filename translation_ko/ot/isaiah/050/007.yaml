id: ISA.50.7
reference: Isaiah 50:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י עַל כֵּ֖ן לֹ֣א נִכְלָ֑מְתִּי עַל כֵּ֞ן שַׂ֤מְתִּי פָנַ/י֙ כַּֽ/חַלָּמִ֔ישׁ וָ/אֵדַ֖ע כִּי לֹ֥א אֵבֽוֹשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord GOD'' represents אֲדֹנָי יְהוִה, literally ''Lord YHWH''; English custom avoids ''Lord LORD'' by rendering the divine name here as ''GOD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'I have not been humiliated' for 'I have not been disgraced.'
    reason: lexical_alternative
  - marker: c
    text: '''Set my face like flint'' is an idiom of firm resolve in the face of opposition.'
    reason: cultural_note
  - marker: d
    text: Or 'I will not be ashamed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주 야훼께서 나를 도우십니다[a]. 그러므로 나는 수치를 당하지 않았습니다. 그러므로 나는 내 얼굴을 부싯돌처럼 굳게 세웠고[c], 내가 부끄러움을 당하지 않을 것을 압니다[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘주 야훼’는 אֲדֹנָי יְהוִה를 옮긴 것으로, 영어는 ‘the Lord GOD’로 관습적으로 표현합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나는 부끄러움을 당하지 않을 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘내 얼굴을 부싯돌처럼 세웠다’는 맞서려는 결연한 결심을 나타내는 관용구입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘부끄러워하지 않을 것을 압니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 야훼가 결합된 호칭이므로 존칭을 살리되, 프로젝트 기본값에 따라 하나님의 이름은 야훼로 옮겼습니다.
- source_word: יַעֲזָר לִי
  english_pob_choice: helps me
  chosen_korean: 나를 도우십니다
  alternatives_korean:
  - 나를 도울 것입니다
  - 나를 도와주십니다
  lexicon: HALOT
  rationale: 현재형·미래형의 확신을 담은 도움의 의미를 자연스러운 합쇼체로 살렸습니다.
- source_word: נִכְלָמְתִּי
  english_pob_choice: I have not been disgraced
  chosen_korean: 수치를 당하지 않았습니다
  alternatives_korean:
  - 부끄러움을 당하지 않았습니다
  - 굴욕을 당하지 않았습니다
  lexicon: HALOT
  rationale: 칼름 계열의 ‘수치/굴욕’ 의미를 반영해, 단순 감정의 ‘부끄럽다’보다 결과로서의 수치를 전면에 두었습니다.
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  english_pob_choice: I have set my face like flint
  chosen_korean: 내 얼굴을 부싯돌처럼 굳게 세웠고
  alternatives_korean:
  - 내 얼굴을 부싯돌처럼 하였고
  - 내 얼굴을 돌처럼 굳게 하였고
  lexicon: HALOT
  rationale: ‘얼굴을 세우다’는 히브리어 관용구의 결단을 살리면서, חַלָּמִישׁ는 의미상 부싯돌로 옮겼습니다.
- source_word: לֹא אֵבוֹשׁ
  english_pob_choice: I will not be put to shame
  chosen_korean: 부끄러움을 당하지 않을 것을 압니다
  alternatives_korean:
  - 부끄러움을 당하지 않을 것을 알았습니다
  - 부끄러워하지 않을 것을 압니다
  lexicon: HALOT
  rationale: 미래 확신을 담는 אֵבוֹשׁ를 한국어의 예고·확신 표현으로 옮기되, 앞의 ‘수치’와 구별되는 ‘부끄러움’을 유지했습니다.
theological_decisions:
- issue: 야훼와 아도나이가 결합된 호칭 처리
  chosen_reading: ‘주 야훼’로 옮겨 존칭과 언약 անուն을 함께 드러냈습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 긴밀한 결합을 유지하면서도 프로젝트 기본값인 야훼를 반영해, ‘주 LORD’류의 어색함을 피했습니다.
  doctrine_reference: POB default for יהוה / YHWH → 야훼
