id: ISA.50.11
reference: Isaiah 50:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
  footnotes:
  - marker: a
    text: Or 'sparks' (also possibly 'firebrands' or 'flaming darts') for 'burning arrows.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will lie down in sorrow' or 'in anguish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 불을 피우는 사람들, 타오르는 화살로 몸을 두르는 사람들아. 너희 불빛 가운데, 너희가 타오르게 한 화살들 사이를 걸어가 보아라[b]. 이것은 내 손에서 너희에게 온 것이니 — 너희는 고통 속에 누울 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불똥들’(또는 ‘불부지깽이들’일 수도 있습니다)로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘슬픔 속에’ 혹은 ‘고뇌 속에’ 누울 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 예언적 호소문의 주의를 환기하는 감탄사로서, 현대 합쇼체에서 가장 자연스럽고 직접적인 명령형으로 옮겼습니다.
- source_word: קֹדְחֵי אֵשׁ / מְאַזְּרֵי זִיקוֹת
  english_pob_choice: who kindle a fire / who gird yourselves with burning arrows
  chosen_korean: 불을 피우는 사람들 / 타오르는 화살로 몸을 두르는 사람들
  alternatives_korean:
  - 불을 지피는 사람들 / 불화살로 둘러무장한 사람들
  - 불을 켜는 사람들 / 불붙은 화살을 두른 사람들
  lexicon: HALOT
  rationale: קֹדְחֵי אֵשׁ의 ‘불을 피우다’와 אזר의 ‘두르다, 띠다’를 살리면서, זִיקוֹת에 대한 POB의 ‘burning arrows’ 선택을 한국어에서도 무기 이미지로 유지했습니다.
- source_word: בְּאוּר אֶשְׁכֶם / וּבְזִיקוֹת בִּעַרְתֶּם
  english_pob_choice: in the light of your fire / and among the arrows you have set ablaze
  chosen_korean: 너희 불빛 가운데, 너희가 타오르게 한 화살들 사이를
  alternatives_korean:
  - 너희 불빛 속에서, 너희가 불붙인 화살들 가운데를
  - 너희 불의 빛 가운데, 너희가 타게 한 화살들 사이를
  lexicon: HALOT
  rationale: אוּר의 ‘빛/불빛’과 בִּעַרְתֶּם의 ‘타오르게 하다’를 함께 살려, 자신들이 만든 불에 기대어 걷는 역설을 드러냈습니다.
- source_word: לְמַעֲצֵבָה
  english_pob_choice: in torment
  chosen_korean: 고통 속에
  alternatives_korean:
  - 슬픔 속에
  - 고뇌 속에
  - 비참함 속에
  lexicon: HALOT
  rationale: 명사의 폭넓은 의미인 고통·괴로움·슬픔을 모두 포괄할 수 있도록 했으며, 종결 문맥의 형벌 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 반어적 명령문의 기능
  chosen_reading: ‘걸어가 보아라’는 자기 불빛을 의지하는 자들에 대한 조롱 섞인 도전으로 이해했습니다.
  alternative_readings:
  - 중립적인 계속 지시로 볼 수도 있음
  rationale: 바로 뒤의 ‘내 손에서 너희에게 온 것’과 ‘고통 속에 누울 것이다’가 이어져, 이 명령은 칭찬이 아니라 심판 아래의 반어로 읽히는 것이 자연스럽습니다.
  doctrine_reference: 예언서의 심판 선언과 반어적 수사
- issue: ‘내 손에서’의 화자
  chosen_reading: 화자는 야훼이며, 이 심판은 하나님의 직접적 행위로 제시됩니다.
  alternative_readings:
  - 화자를 일반적인 예언자 발화로 약화시킬 수 있음
  rationale: 히브리어 관용구 ‘내 손에서’는 단순한 허용이 아니라 직접적 주권적 행위를 가리키므로, 본문이 암시하는 신적 심판을 보존했습니다.
  doctrine_reference: 하나님의 주권적 심판
