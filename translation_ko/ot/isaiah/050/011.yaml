theological_decisions:
- issue: 반어적 명령문의 기능
  chosen_reading: ‘걸어가 보아라’는 자기 불빛을 의지하는 자들에 대한 조롱 섞인 도전으로 이해했습니다.
  alternative_readings:
  - 중립적인 계속 지시로 볼 수도 있음
  rationale: 바로 뒤의 ‘내 손에서 너희에게 온 것’과 ‘고통 속에 누울 것이다’가 이어져, 이 명령은 칭찬이 아니라 심판 아래의 반어로 읽히는 것이 자연스럽습니다.
  doctrine_reference: 예언서의 심판 선언과 반어적 수사
- issue: ‘내 손에서’의 화자
  chosen_reading: 화자는 야훼이며, 이 심판은 하나님의 직접적 행위로 제시됩니다.
  alternative_readings:
  - 화자를 일반적인 예언자 발화로 약화시킬 수 있음
  rationale: 히브리어 관용구 ‘내 손에서’는 단순한 허용이 아니라 직접적 주권적 행위를 가리키므로, 본문이 암시하는 신적 심판을 보존했습니다.
  doctrine_reference: 하나님의 주권적 심판
