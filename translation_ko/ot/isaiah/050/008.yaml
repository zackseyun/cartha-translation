source:
  edition: WLC
  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
  footnotes:
  - marker: a
    text: Or 'the one who justifies me' or 'the one who declares me righteous.' The Hebrew verb is forensic in this context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the master/owner of my case,' that is, the one pressing a legal claim against me.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 정당함을 밝혀 주시는 분이 가까이 계십니다[a]. 누가 나와 다투겠습니까? 함께 섭시다. 내 소송의 상대방은 누구입니까[b]? 그가 내게 가까이 오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 의롭다 하시는 분’, ‘나를 의롭다고 선언하시는 분’으로 옮길 수 있습니다. 히브리어 동사는 이 문맥에서 법정적 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 소송의 주인’입니다. 곧 나를 상대로 법적 청구를 제기하거나 소송에서 맞서는 자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב / מַצְדִּיקִי
  english_pob_choice: Near is the one who vindicates me
  chosen_korean: 나를 변호하시는 분이 가까이 계십니다
  alternatives_korean:
  - 나를 의롭다 하시는 분이 가까이 계십니다
  - 나를 무죄로 선언하시는 분이 가까이 계십니다
  lexicon: HALOT
  rationale: 문맥이 재판 장면이므로 מַצְדִּיקִי는 도덕적 변화보다 법정적 무죄/변호의 뜻을 살려 옮기는 것이 적절합니다. ‘변호하시는 분’은 한국어에서 자연스러우면서도 문맥의 법정성을 드러냅니다.
- source_word: יָרִיב אִתִּי
  english_pob_choice: who will contend with me?
  chosen_korean: 누가 나와 다투겠습니까?
  alternatives_korean:
  - 누가 나와 논쟁하겠습니까?
  - 누가 나를 상대로 소송을 제기하겠습니까?
  lexicon: HALOT
  rationale: ריב는 일반적 다툼보다 법적 분쟁의 뉘앙스가 있지만, 여기서는 수사적 도전의 어조가 강하므로 ‘다투다’로 옮겨 법정성과 대결성을 함께 살렸습니다.
- source_word: בַעַל מִשְׁפָּטִי
  english_pob_choice: the master of my case
  chosen_korean: 내 사건의 주인은 누구입니까?
  alternatives_korean:
  - 내 소송의 주인은 누구입니까?
  - 내 사건을 주장하는 자는 누구입니까?
  lexicon: HALOT
  rationale: 직역하면 ‘내 משפט의 주인’이지만, 한국어에서는 ‘주인’이 소유·청구권의 비유를 가장 직접적으로 드러냅니다. ‘사건’은 משפט의 법정적 의미를 살리면서도 현대 독자가 이해하기 쉬운 표현입니다.
- source_word: יִגַּשׁ אֵלַי
  english_pob_choice: Let him come near to me
  chosen_korean: 그가 내게 가까이 오십시오
  alternatives_korean:
  - 그가 내게 가까이 오게 하십시오
  - 그가 내게 다가오십시오
  lexicon: HALOT
  rationale: 앞의 ‘가까이’와 호응시키면서 도전적 요청을 살리기 위해 ‘가까이 오십시오’로 옮겼습니다. 대상이 제3자이므로 명령형이 아니라 청유/요청형의 예의를 유지했습니다.
theological_decisions:
- issue: מַצְדִּיקִי의 법정적 의미
  chosen_reading: ‘나를 변호하시는 분’으로 법정적 무죄/변호 의미를 살렸습니다.
  alternative_readings:
  - ‘나를 의롭게 하시는 분’
  - ‘나를 의롭다 하시는 분’
  rationale: 주변 문맥이 ‘다투다’, ‘함께 서다’, ‘사건의 주인’ 등 명백한 재판 어휘로 이루어져 있으므로, 여기서는 내적 의로움의 형성보다 법정적 판결을 가리키는 것으로 읽는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 이사야 50장 8절의 재판 비유 문맥
- issue: 화자의 도전적 수사와 예의 체계
  chosen_reading: 직설적 도전문은 유지하되, 한국어에서는 종결을 합쇼체로 처리했습니다.
  alternative_readings:
  - 더 격한 반말식 도전
  - 전면적인 고어체
  rationale: 히브리어의 짧고 날카로운 법정 도전문을 살리면서도, 번역문 전체의 표준어·현대 문체를 유지하기 위해 합쇼체를 택했습니다. 직접 인용된 발화가 아니라 서술/도전의 문맥이므로 높임 체계가 적절합니다.
  doctrine_reference: 번역 문체 원칙
