  rationale: 목적 부정사 לדעת와 לִשְׁמֹעַ를 각각 ‘알게 하셨습니다’와 ‘듣게 하십니다’로 자연스럽게 반영하고, 아침의 반복 및 ‘깨우시다’의 반복을 보존했습니다. ‘말할 능력’은 문자적 ‘혀’가 한국어에서 지닌 신체적 어색함을 피하면서 발화 능력이라는 은유를 유지합니다. 주석 표지를 해당 단어에 재배치했습니다.
