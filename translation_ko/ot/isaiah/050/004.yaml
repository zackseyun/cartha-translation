  rationale: 한국 교회 전통의 '여호와' 대신, 학술적·본문 비평적 맥락을 반영해 야훼를 사용했습니다. 이는 본문이 아도나이와 여호와의 결합 호칭을 함께 드러내는 효과를 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → 야훼'
