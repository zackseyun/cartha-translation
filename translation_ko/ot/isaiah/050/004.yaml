id: ISA.50.4
reference: Isaiah 50:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
  footnotes:
  - marker: a
    text: Or 'the tongue of disciples' / 'the tongue of the instructed.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb rendered 'sustain' is difficult; it may also be understood as 'help' or, less likely, 'answer' the weary with a word.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Lord GOD' represents the title אֲדֹנָי together with the divine name YHWH.
    reason: cultural_note
translation:
  language: ko
  text: 주 야훼께서 내게 배운 이들의 혀를 주셔서, 나는 지친 사람을 말씀으로 어떻게 붙들어 줄지 알게 하셨습니다. 아침마다, 아침마다 그가 내 귀를 깨우시니, 나는 배운 이들처럼 듣습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘배운 이들’은 ‘제자들’ 또는 ‘가르침받은 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘붙들어 주다’에 해당하는 히브리어 동사는 난해하여 ‘도와주다’ 또는 ‘대답하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주 야훼’는 히브리어의 אֲדֹנָי와 YHWH가 함께 있는 결합 호칭을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: The Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: BDB / HALOT
  rationale: WLC의 결합 호칭을 한국어에서 두 요소가 드러나도록 옮겼습니다. POB의 영어는 관용적으로 'Lord GOD'를 쓰지만, 한국어 본문에서는 본문 전통과 프로젝트 기본에 따라 신명기적 고유명사를 야훼로 밝혀 구별성을 유지했습니다.
- source_word: לִמּוּדִים
  english_pob_choice: those who are taught
  chosen_korean: 배운 이들
  alternatives_korean:
  - 가르침받은 이들
  - 배운 사람들
  - 제자들
  lexicon: HALOT
  rationale: 수동적·형용사적 의미를 살려 '배운 이들'로 옮겼습니다. '제자들'은 해석을 더 강하게 넣을 수 있어, 반복되는 병행구를 유지하는 쪽을 택했습니다.
- source_word: לָעֽוּת
  english_pob_choice: to sustain
  chosen_korean: 붙들어 주다
  alternatives_korean:
  - 도와주다
  - 지탱하다
  - 대답하다
  lexicon: HALOT
  rationale: 동사가 난해하지만 문맥상 지친 사람에게 실제적 도움을 주는 뜻이 가장 자연합니다. '붙들어 주다'는 위로·지지의 의미를 살리면서도 과도한 의역을 피합니다.
- source_word: כַּלִּמּוּדִים
  english_pob_choice: like those who are taught
  chosen_korean: 배운 이들처럼
  alternatives_korean:
  - 가르침받은 이들처럼
  - 제자들처럼
  - 배운 자들처럼
  lexicon: HALOT
  rationale: 앞의 לִמּוּדִים과 같은 어근을 맞춰 반복성을 살렸습니다. 들음의 태도가 '배운 이들'의 태도와 대응된다는 병행성을 드러냅니다.
theological_decisions:
- issue: יְהֹוִה의 표기와 신명 표준 번역
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 한국 교회 전통의 '여호와' 대신, 학술적·본문 비평적 맥락을 반영해 야훼를 사용했습니다. 이는 본문이 아도나이와 여호와의 결합 호칭을 함께 드러내는 효과를 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → 야훼'
