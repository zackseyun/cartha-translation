revisions:
- from: 주 야훼께서 내게 배운 이들의 혀를 주셔서, 나는 지친 사람을 말씀으로 어떻게 붙들어 줄지 알게 하셨습니다. 아침마다, 아침마다 그가 내 귀를 깨우시니, 나는 배운 이들처럼 듣습니다.[a][b][c]
