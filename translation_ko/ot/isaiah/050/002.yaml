id: ISA.50.2
reference: Isaiah 50:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
  footnotes:
  - marker: a
    text: Or 'was there no one?' Hebrew 'no man' (אִישׁ), a masculine singular form used here in a representative sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'Has my hand become too short for redemption?' The Hebrew preserves the metaphor of a 'shortened hand' for inability.
    reason: lexical_alternative
  - marker: c
    text: '''Deliver'' could also be rendered ''save'' or ''rescue.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 내가 왔는데도 사람이 없었습니까?[a] 내가 불렀는데도 대답하는 이가 없었습니까? 내 손이 정말 속량하기에 너무 짧습니까?[b] 아니면 내게 건져낼 능력이 없습니까?[c] 보십시오, 내 꾸짖음으로 바다를 말리고 강들을 광야로 만듭니다. 그 강들의 물고기는 물이 없어 악취를 풍기고 목이 말라 죽습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 히브리어 אִישׁ의 남성 단수 형태를 따른 표현으로, 여기서는 대표적 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속량하다’는 פדות의 구속·값주고 건지는 의미를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘건져내다’는 לְהַצִּיל의 ‘구하다/구출하다’ 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ / בָּאתִי
  english_pob_choice: Why, when I came
  chosen_korean: 왜 내가 왔는데도
  alternatives_korean:
  - 내가 왔을 때 왜
  - 왜 내가 오자마자
  lexicon: HALOT
  rationale: 수사적 질문의 압박감을 살리면서 히브리어의 간결한 과거 표현을 자연스러운 한국어로 옮겼습니다.
- source_word: וְאֵין אִישׁ / וְאֵין עוֹנֶה
  english_pob_choice: was there no man? ... was there no one to answer?
  chosen_korean: 사람이 없었습니까? ... 대답하는 이가 없었습니까?
  alternatives_korean:
  - 아무도 없었습니까?
  - 대답할 사람이 없었습니까?
  lexicon: HALOT
  rationale: אִישׁ의 남성 단수 형태를 살리기 위해 첫 질문은 ‘사람’보다 직접적인 ‘사람/인’ 표현을 쓰되, 뒤의 עוֹנֶה는 ‘대답하는 이’로 옮겨 응답자의 의미를 분명히 했습니다.
- source_word: הֲקָצ֨וֹר קָצְרָ֤ה יָדִי / מִפְּדוּת
  english_pob_choice: Is my hand really too short to redeem
  chosen_korean: 내 손이 정말 속량하기에 짧습니까
  alternatives_korean:
  - 내 손이 정말 속량하지 못할 만큼 짧습니까
  - 내 손이 정말 구원하기에 짧습니까
  lexicon: HALOT
  rationale: ‘짧아진 손’의 은유를 그대로 유지하면서, פדות는 구속·속량의 문맥에 맞게 ‘속량하다’로 옮겼습니다.
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  english_pob_choice: or is there no power in me to deliver
  chosen_korean: 아니면 내게 건져낼 능력이 없습니까
  alternatives_korean:
  - 아니면 내게 구원할 힘이 없습니까
  - 아니면 내게 구출할 능력이 없습니까
  lexicon: HALOT
  rationale: כֹחַ는 ‘능력’이 자연스럽고, הַצִּיל은 단순한 종교어휘로 좁히지 않기 위해 ‘건져내다’로 옮겨 구출·구원의 포괄성을 유지했습니다.
- source_word: בְּגַעֲרָתִי ... אַחֲרִיב יָם ... אֲשִׂים נְהָרוֹת מִדְבָּר
  english_pob_choice: by my rebuke I dry up the sea; I make rivers a wilderness
  chosen_korean: 내가 꾸짖기만 하면 바다가 마르며, 강들을 광야로 만듭니다
  alternatives_korean:
  - 내 꾸짖음으로 바다가 마르며, 강들을 황무지로 만듭니다
  - 내 꾸짖음으로 바다를 말리고 강들을 광야로 만듭니다
  lexicon: HALOT
  rationale: 심판의 도구인 ‘꾸짖음’과 그 결과를 병렬로 살렸고, 바다/강의 수계 이미지가 이어지도록 ‘마르며’와 ‘광야로 만듭니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 능력을 가리키는 ‘손’의 은유
  chosen_reading: 첫 질문에서 ‘손’을 ‘능력’으로 풀어버리지 않고 그대로 보존했습니다.
  alternative_readings:
  - 내 힘이 정말 너무 짧습니까
  - 내 능력이 정말 부족합니까
  rationale: 히브리어는 신체 은유로 하나님의 কার্য능을 표현하므로, 은유를 보존해야 뒤의 ‘건져낼 능력’과 함께 수사적 긴장이 유지됩니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 최종 절의 심판적 생태 이미지
  chosen_reading: 바다를 마르게 하고 강을 광야로 만드는 묘사를 그대로 유지했습니다.
  alternative_readings:
  - 바다를 황폐하게 합니다
  - 강들을 마르게 합니다
  rationale: 본문은 단순한 일반적 파괴가 아니라 물을 제거하는 구체적 심판을 강조하므로, 수위·수생 생명의 붕괴를 드러내는 표현을 보존해야 합니다.
  doctrine_reference: 이사야 50장 문맥의 야훼 주권과 심판 선언
