source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
  footnotes:
  - marker: a
    text: Or, 'who will condemn me?' The Hebrew verb is forensic, meaning to declare someone guilty or condemn in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 주 야훼께서 나를 도우십니다. 누가 나를 유죄로 판결하겠습니까?[a] 보십시오, 그들은 모두 옷처럼 닳을 것이며, 좀이 그들을 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 나를 정죄하겠습니까?’ 히브리어 동사는 법정에서 사람을 유죄로 선언하거나 정죄하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 예언적·수사적 주의를 환기하는 담화 표지로서, 현대 합쇼체에서 가장 자연스럽게 그 긴장감을 살릴 수 있는 표현입니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יהוה의 이중 호칭을 모두 살리되, 본 프로젝트의 기본 원칙에 따라 יְהוָה는 야훼로 옮기고, 합쇼체 한국어에서 중복을 피하면서도 격식을 유지했습니다.
- source_word: יַרְשִׁיעֵנִי
  english_pob_choice: will declare me guilty
  chosen_korean: 나를 유죄로 판결하겠습니까
  alternatives_korean:
  - 나를 정죄하겠습니까
  - 나를 죄인이라 판결하겠습니까
  lexicon: HALOT
  rationale: 법정적 의미의 ‘declare someone guilty/condemn’라는 뉘앙스를 드러내기 위해 ‘유죄로 판결하다’를 택해, 단순한 비난보다 재판적 의미를 분명히 했습니다.
- source_word: עָשׁ יֹאכְלֵם
  english_pob_choice: a moth will eat them
  chosen_korean: 좀이 그들을 먹어 버릴 것입니다
  alternatives_korean:
  - 좀벌레가 그들을 갉아먹을 것입니다
  - 나방이 그들을 먹을 것입니다
  lexicon: HALOT
  rationale: 옷을 좀이 ‘먹는’ 직유를 그대로 살리되, 한국어에서 자연스러운 관용을 위해 ‘먹어 버리다’로 강도를 유지했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 표준 원칙에 따라 언약 이름을 야훼로 옮겨, אֲדֹנָי와의 결합이 가진 명칭상의 긴장을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
