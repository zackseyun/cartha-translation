id: ISA.50.10
reference: Isaiah 50:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
  footnotes:
  - marker: a
    text: Or 'obeying' or 'heeding the voice of his servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분 가운데 야훼를 경외하며 그의 종의 음성을 듣는 이가 누구입니까?[a] 어둠 속을 걷고 빛이 없는 이는 야훼의 이름을 신뢰하고 자신의 하나님을 의지해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “듣다”는 여기서 단순 청각보다 ‘귀 기울여 받아들이다’ 또는 ‘순종하다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרֵא יְהוָה
  english_pob_choice: fears Yahweh
  chosen_korean: 야훼를 경외하며
  alternatives_korean:
  - 야훼를 두려워하며
  - 야훼를 무서워하며
  lexicon: HALOT
  rationale: יָרֵא는 하나님께 대한 경외와 언약적 두려움을 함께 담으므로, 한국어에서는 단순한 공포보다 신앙적 무게를 살리는 ‘경외하다’가 적절합니다.
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  english_pob_choice: listening to the voice of his servant
  chosen_korean: 그의 종의 음성을 듣습니까
  alternatives_korean:
  - 그의 종의 음성을 듣고 있습니까
  - 그의 종의 음성에 순종합니까
  lexicon: HALOT
  rationale: שׁמע의 핵심은 ‘듣다/듣고 받아들이다’이므로, 본문은 먼저 청각적·수용적 의미를 살려 옮기고, ‘순종하다’는 해석적 의미는 과도하게 앞세우지 않았습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 일꾼
  lexicon: HALOT
  rationale: 이사야의 종-본문에서 עבד는 하나님의 위임받은 종을 가리키는 것이므로, POB의 일관된 용례에 맞춰 ‘종’으로 옮겼습니다.
- source_word: חֲשֵׁכִים / וְאֵין נֹגַהּ לוֹ
  english_pob_choice: walks in darkness and has no light
  chosen_korean: 어둠 속을 걷고 빛이 없는 사람
  alternatives_korean:
  - 흑암 속을 걷고 빛이 없는 사람
  - 어둠 가운데 걸으며 광명이 없는 사람
  lexicon: HALOT
  rationale: 복수형 ‘어둠들’의 강조를 한국어에서는 자연스러운 단수 명사구 ‘어둠 속’으로 풀어, 결핍의 상태를 간결하게 전달했습니다.
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  english_pob_choice: trust in the name of Yahweh
  chosen_korean: 야훼의 이름을 신뢰하고
  alternatives_korean:
  - 야훼의 이름을 믿고
  - 야훼의 이름에 의지하고
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭이 아니라 드러난 성품과 권위를 가리키므로, ‘신뢰하다’가 그 의미를 잘 드러냅니다.
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  english_pob_choice: lean on his God
  chosen_korean: 자기의 하나님을 의지하십시오
  alternatives_korean:
  - 자기의 하나님께 기대십시오
  - 자기의 하나님에 의탁하십시오
  lexicon: HALOT
  rationale: שׁען의 비유적 ‘기대다/지탱하다’는 뜻을 한국어의 공적 문체에서는 ‘의지하다’가 가장 자연스럽고, 하나님을 붙드는 신뢰의 이미지를 유지합니다.
theological_decisions:
- issue: 예언적 초청문의 화자 톤
  chosen_reading: 수사적 질문 뒤에 일반 명령형으로 전환해, 고난 중인 청자에게 직접 권면하는 문체를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 청유형으로 완화
  rationale: 히브리어는 하나님을 경외하는 자를 찾는 질문과 그에 대한 실천적 권면을 함께 담고 있어, 한국어도 긴박한 권면의 힘을 살리는 것이 적절합니다.
  doctrine_reference: 본문의 권면적 수사와 시적 대구를 보존
- issue: ‘야훼’와 ‘하나님’의 병치
  chosen_reading: 첫 절반의 언약명은 ‘야훼’, 끝의 소유격은 ‘자기의 하나님’으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 야훼
  - 둘 다 하나님
  rationale: 원문은 יְהוָה와 אֱלֹהָיו를 구별하므로, 한국어도 동일한 칭호를 반복하기보다 명칭의 차이를 살려 관계적·언약적 뉘앙스를 보존합니다.
  doctrine_reference: 명칭 구별을 통한 원문 대응
