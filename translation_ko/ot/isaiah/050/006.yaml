base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
  footnotes:
  - marker: a
    text: Or 'to those who pluck out hair'; the Hebrew does not explicitly state 'the beard,' though that is the most likely implied object in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 등을 때리는 자들에게 내주고, 내 뺨을 수염[a]을 뽑아 내는 자들에게 내주었습니다. 나는 수치와 침 뱉음 앞에서 내 얼굴을 숨기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 뽑아 내는 대상을 직접 밝히지 않습니다. 문맥상 수염이 가장 가능성 큰 대상으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  english_pob_choice: my back
  chosen_korean: 내 등
  alternatives_korean:
  - 내 몸통
  - 내 몸
  lexicon: HALOT
  rationale: גֵּו는 몸통이나 등을 가리킬 수 있지만, 매질의 문맥에서는 ‘내 등’이 가장 자연스럽고 구체적으로 원문의 폭력을 드러냅니다.
- source_word: לְמַכִּים
  english_pob_choice: to those who strike
  chosen_korean: 때리는 자들에게
  alternatives_korean:
  - 치는 자들에게
  - 매질하는 자들에게
  lexicon: HALOT
  rationale: 능동 분사로서 상해를 가하는 사람들을 가리키므로, 동작이 분명한 ‘때리는 자들’이 원문의 직설성을 잘 살립니다.
- source_word: לְמֹרְטִים
  english_pob_choice: to those who pull out the beard
  chosen_korean: 수염을 뜯는 자들에게
  alternatives_korean:
  - 털을 뽑는 자들에게
  - 머리카락을 뜯는 자들에게
  lexicon: HALOT
  rationale: 히브리어는 ‘뜯다/뽑다’라는 행위만 직접 말하고 대상은 생략하지만, 뺨을 향한 모욕의 관용적 장면에서는 수염을 뜻하는 것으로 보는 것이 가장 개연성이 높습니다.
- source_word: כְּלִמּוֹת וָרֹק
  english_pob_choice: disgrace and spitting
  chosen_korean: 수치와 침 뱉음
  alternatives_korean:
  - 수치와 침
  - 모욕과 침 뱉음
  lexicon: HALOT
  rationale: כְּלִמּוֹת는 사회적 수치·치욕을 포괄하므로 ‘수치’로, וָרֹק은 구체적 모욕 행위인 ‘침 뱉음’으로 옮겨 원문의 감각적 수치를 유지했습니다.
theological_decisions:
- issue: 서번트의 자기 진술을 메시아적 해석으로 본문에 직접 반영할지 여부
  chosen_reading: 본문은 1인칭 서번트의 진술로 유지하고, 메시아나 예수에 대한 명시적 확장은 하지 않았습니다.
  alternative_readings:
  - 메시아적 성취를 암시하는 표현을 본문에 덧붙임
  rationale: 이 절은 본문 자체에서는 종의 고난을 말할 뿐이므로, 해석적 적용은 본문 밖에서 다루고 번역문에는 히브리어가 말하는 범위만 반영하는 것이 적절합니다.
  doctrine_reference: 번역 철학 §§1, 3
