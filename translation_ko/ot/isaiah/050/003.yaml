    rationale: ‘그들의 덮개로 삼베를 씌웁니다’는 무엇을 누구에게 씌우는지 어색하게 읽힙니다. 원문은 하나님이 ‘굵은 베’를 하늘의 ‘덮개’로 정하신다는 뜻입니다.
  - severity: low
