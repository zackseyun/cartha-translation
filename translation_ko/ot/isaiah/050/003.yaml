    rationale: ‘삼베’는 가능하지만 שַׂק은 일반적으로 거친 애도용 베를 가리킵니다. ‘굵은 베’가 재질을 특정하지 않으면서 의미를 더 잘 보존합니다.
  - severity: low
    issue: 각주 표지의 지시 대상이 분명하지 않음
    rationale: 어휘 대안 각주와 문화 각주는 각각 ‘어둠’과 ‘굵은 베’에 바로 붙이는 편이 독자의 참조를 명확하게 합니다.
