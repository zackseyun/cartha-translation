id: ISA.50.3
reference: Isaiah 50:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַלְבִּ֥ישׁ שָׁמַ֖יִם קַדְר֑וּת וְ/שַׂ֖ק אָשִׂ֥ים כְּסוּתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
  footnotes:
  - marker: a
    text: Or 'blackness' or 'gloom' for 'darkness.'
    reason: lexical_alternative
  - marker: b
    text: Sackcloth was a coarse fabric associated with mourning and lament.
    reason: cultural_note
translation:
  language: ko
  text: 내가 하늘을 어둠으로 입히고, 그들의 덮개로 삼베를 씌웁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어둠’은 ‘흑암’이나 ‘음침함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 삼베는 애도와 탄식에 쓰이던 거친 천이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  english_pob_choice: I clothe
  chosen_korean: 내가 … 입힙니다
  alternatives_korean:
  - 내가 … 옷입힙니다
  - 내가 … 입힙니다
  lexicon: HALOT
  rationale: 히필형의 ‘입히다/옷입히다’는 원인의 의미를 살리면서 한국어로도 자연스럽게 ‘하늘을 어둠으로 입히다’라는 시적 표현을 만듭니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘들(복수감 유지용)
  lexicon: HALOT
  rationale: 시적 문맥에서 복수형의 장엄함을 살리되, 한국어에서는 ‘하늘’이 가장 자연스럽고 본문의 이미지도 충분히 전달합니다.
- source_word: קַדְרוּת
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 그늘
  lexicon: HALOT
  rationale: 이 명사는 어두워짐, 암흑, 음울함의 범위를 가지므로, 현대 한국어에서 가장 직접적인 대응인 ‘어둠’을 택했습니다.
- source_word: שַׂק
  english_pob_choice: sackcloth
  chosen_korean: 삼베
  alternatives_korean:
  - 굵은 베
  - 상복 삼베
  lexicon: HALOT
  rationale: ‘삼베’는 상례와 애도의 연상을 한국어에서 가장 압축적으로 전달하며, POB의 문화적 주석처럼 애통의 소재라는 점을 살립니다.
theological_decisions:
- issue: 우주적 어둠과 애도의 이미지
  chosen_reading: 하늘을 실제로 어둡게 하는 պատկեր와 애도의 삼베를 입히는 이미지를 둘 다 열어 둔 채, 어느 한쪽으로만 좁히지 않았습니다.
  alternative_readings:
  - 주로 문자적 우주적 암흑
  - 주로 비유적 애도 상징
  rationale: 히브리어 시어는 심판의 어둠과 애도의 상징을 함께 울리므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
