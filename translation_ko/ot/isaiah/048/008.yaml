id: ISA.48.8
reference: Isaiah 48:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
  footnotes:
  - marker: a
    text: Or 'from birth.' The Hebrew literally says 'from the womb,' an idiom for the earliest stage of life.
    reason: lexical_alternative
  - marker: b
    text: Or 'a transgressor.' The Hebrew term denotes one who rebels or breaks faith.
    reason: lexical_alternative
translation:
  language: ko
  text: 정말[a] 당신은 듣지 못하였고, 정말 당신은 알지 못하였으며, 정말로 옛적부터 당신의 귀가 열리지 않았습니다. 이는 내가 당신이 반드시 배신할[b] 것을 알았기 때문이며, 당신이 태중에서부터 배반자로 불릴 것을 알았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘태어날 때부터.’ 히브리어는 문자적으로는 ‘태중에서부터’라고 하며, 가장 이른 생애의 시기를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배반하다.’ 히브리어는 언약을 저버리거나 신의를 깨뜨리는 자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: indeed
  chosen_korean: 정말 / 정말로
  alternatives_korean:
  - 또한
  - 심지어
  - 과연
  lexicon: HALOT
  rationale: 반복된 강조를 한국어의 자연스러운 부사 반복으로 살려, 단순 접속어보다 문장의 수사적 압박감을 드러냈습니다.
- source_word: שָׁמַעְתָּ / יָדַעְתָּ
  english_pob_choice: you had not heard / you had not known
  chosen_korean: 듣지 못하였고 / 알지 못하였으며
  alternatives_korean:
  - 듣지 않았고 / 알지 못했고
  - 들은 적이 없었고 / 알지 못했으며
  lexicon: HALOT
  rationale: 예언적 회고의 과거완료 뉘앙스를 한국어의 ‘-지 못하였’로 옮겨, 단순 부정이 아니라 이전에 이루어지지 않은 상태를 나타냈습니다.
- source_word: פִתְּחָה אָזְנֶךָ
  english_pob_choice: your ear had not been opened
  chosen_korean: 당신의 귀가 열리지 않았습니다
  alternatives_korean:
  - 당신의 귀가 열려 있지 않았습니다
  - 당신의 귀는 열리지 않았습니다
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하되, 한국어에서 자연스러운 수동 표현으로 옮겨 듣고 받아들이는 가능성이 없었음을 드러냈습니다.
- source_word: בָּגוֹד תִּבְגּוֹד
  english_pob_choice: you would surely deal treacherously
  chosen_korean: 반드시 배신할
  alternatives_korean:
  - 확실히 배반할
  - 참으로 궤변적으로 행할
  lexicon: HALOT
  rationale: 강조 구조는 ‘반드시’로, בגד의 핵심 의미는 ‘배신하다’로 옮겨 언약적 불충실을 분명하게 했습니다.
- source_word: וּפֹשֵׁעַ
  english_pob_choice: a transgressor
  chosen_korean: 배반자로
  alternatives_korean:
  - 범법자로
  - 반역자로
  - 죄인으로
  lexicon: HALOT
  rationale: 문맥상 단순 법규 위반보다 관계적·언약적 배반을 앞세우는 말이어서, 성격 규정으로서의 호칭을 한국어의 ‘배반자’로 옮겼습니다.
- source_word: מִבֶּטֶן
  english_pob_choice: from the womb
  chosen_korean: 태중에서부터
  alternatives_korean:
  - 배 속에서부터
  - 모태에서부터
  - 태어날 때부터
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간적 기원을 살리면서도, 한국어 성경 문맥에서 자연스럽고 격식 있는 ‘태중에서부터’를 채택했습니다.
theological_decisions:
- issue: '''from the womb''의 의미를 문자적 죄책으로 좁힐지, 예언적 정체성 진술로 둘지'
  chosen_reading: 예언적으로 이스라엘의 오래된 배신 성향을 규정하는 표현으로 유지했습니다.
  alternative_readings:
  - 개인의 출생 이전부터의 문자적 죄책 진술
  - 단순한 출생 시점 표지
  rationale: 본문은 공동체를 향한 예언적 책망이며, 원문의 관용구를 풀어 도그마를 과잉 확정하지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 범위를 본문이 허용하는 데까지로 제한함
- issue: בָּגוֹד תִּבְגּוֹד의 강한 반복을 한국어에서 어떻게 반영할지
  chosen_reading: 반드시 배신할로 반복 강조를 압축해 살렸습니다.
  alternative_readings:
  - 크게 배신할
  - 진짜로 배반할
  rationale: 히브리어의 부정사 절대형+미완료형 강조를 한국어의 정도부사로 반영해, 의미의 강도를 유지했습니다.
  doctrine_reference: 수사적 강조 보존
