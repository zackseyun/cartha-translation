language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
  footnotes:
  - marker: a
    text: Or, 'from the time it happened' or 'from the time it existed'; the Hebrew says literally, 'from the time of its being.'
    reason: lexical_alternative
  - marker: b
    text: The speaker is not explicitly identified in the Hebrew. Christian readers have often understood this as the Servant/Messiah speaking, but the text itself leaves the identification implicit.
    reason: alternative_reading
  - marker: c
    text: Or, 'and his spirit.' The Hebrew phrase may be read as a distinct accompanying subject ('and his Spirit') or understood less specifically.
    reason: alternative_reading
translation:
  language: ko
  text: 내게 가까이 오십시오[a]; 이 말을 들으십시오. 나는 처음부터 은밀히 말한 적이 없습니다. 일이 생겨나던 때부터 나는 거기 있었습니다. 그리고 이제 주 여호와께서 나를 보내셨고, 그의 영도 함께 하셨습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일이 일어나던 때부터’, ‘그것이 존재하던 때부터’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘그것의 있음의 때부터’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 화자를 명시하지 않습니다. 그리스도인 독자들은 흔히 이것을 종/메시아의 발화로 이해해 왔지만, 본문 자체는 그 정체를 암시적으로만 남깁니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 영과 함께’로도 읽을 수 있습니다. 히브리어 구문은 별개의 동반 주어로도, 보다 느슨하게도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ
  english_pob_choice: Come near
  chosen_korean: 가까이 오십시오
  alternatives_korean:
  - 다가오십시오
  - 가까이 나오십시오
  lexicon: HALOT
  rationale: 둘째 인칭 복수 명령형의 직접적 초청을 자연스러운 현대 한국어로 살리되, 예언적 호소의 긴박함을 유지했습니다.
- source_word: שִׁמְעוּ זֹאת
  english_pob_choice: hear this
  chosen_korean: 이 말을 들으십시오
  alternatives_korean:
  - 이것을 들으십시오
  - 잘 들으십시오
  lexicon: HALOT
  rationale: 지시 대명사 זֹאת을 구체적으로 ‘이 말’로 옮겨 선포되는 내용을 분명하게 했습니다.
- source_word: מֵעֵת הֱיוֹתָהּ
  english_pob_choice: from the time it came to be
  chosen_korean: 일이 생겨나던 때부터
  alternatives_korean:
  - 일이 생긴 때부터
  - 그것이 존재하게 된 때부터
  lexicon: HALOT
  rationale: 히브리어의 ‘그것의 있음/생김’이라는 표현을 그대로 설명적으로 옮겨, 대상이 특정 사건/일임을 암시하는 폭을 보존했습니다.
- source_word: וְרוּחוֹ
  english_pob_choice: and his Spirit
  chosen_korean: 그의 영도
  alternatives_korean:
  - 그의 성령도
  - 그의 영과 함께
  lexicon: HALOT
  rationale: רוּחַ의 기본 의미인 ‘영’을 살리되, 본문이 가진 결합적·동반적 뉘앙스를 한국어 조사 ‘도’로 간결하게 반영했습니다.
theological_decisions:
- issue: 말하는 이의 정체를 본문에서 확정할지 여부
  chosen_reading: 화자가 누구인지 본문 본문 문장 안에서 밝히지 않고 그대로 둡니다.
  alternative_readings:
  - 메시아/종으로 명시적으로 해석
  - 선지자 이사야의 발언으로 해석
  rationale: 히브리어 본문 자체가 화자를 명시하지 않으므로, 해석을 본문에 미리 주입하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3; Isaiah 48:16 audit trail
- issue: אֲדֹנָי יְהוִה의 번역
  chosen_reading: 주 여호와
  alternative_readings:
  - 주 하나님
  - 주 야훼
  rationale: 한국어 성서 전통에서 구별되는 호칭 구조를 유지하면서도, 본문에 있는 이중 호칭(주 + 신명)을 드러냈습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
