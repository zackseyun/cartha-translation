language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
  footnotes:
  - marker: a
    text: Or 'Now they have been created, and not from of old; before this day you had not heard of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지금 그 일들이 창조되었고, 오래전부터 있는 것이 아닙니다. 오늘 이전에는 당신이 그것들을 듣지 못하셨습니다. 이는 당신이 「보십시오, 내가 그것들을 알았습니다」라고 말하지 못하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지금 그것들은 창조되었고, 오래전 것이 아니며, 이 날 이전에는 그것들에 대해 들은 적이 없었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 바로 지금
  lexicon: HALOT
  rationale: 현재의 도래를 드러내는 시간 부사이므로, 문맥상 가장 자연스럽고 단정한 표준어인 ‘지금’으로 옮겼습니다.
- source_word: נִבְרְאוּ
  english_pob_choice: they are created
  chosen_korean: 창조되었고
  alternatives_korean:
  - 창조됩니다
  - 창조되었습니다
  - 지어졌고
  lexicon: HALOT
  rationale: ברא의 강한 창조 동사를 살리기 위해 ‘창조되다’를 택했습니다. 한국어에서는 현재형보다 완료/결과 뉘앙스가 자연스러워 ‘창조되었고’로 처리했습니다.
- source_word: מֵאָז
  english_pob_choice: from long ago
  chosen_korean: 오래전부터 있는 것이 아닙니다
  alternatives_korean:
  - 옛날부터가 아닙니다
  - 먼 옛날부터가 아닙니다
  - 오래전부터가 아닙니다
  lexicon: HALOT
  rationale: 단순한 기원 부정보다 ‘오래된 것 아님’이라는 대비가 핵심이므로, 현대 한국어의 자연스러운 표현으로 풀어 옮겼습니다.
- source_word: שְׁמַעְתָּם
  english_pob_choice: you had not heard them
  chosen_korean: 당신이 그것들을 듣지 못하셨습니다
  alternatives_korean:
  - 당신이 그것들을 듣지 않으셨습니다
  - 당신이 그것들을 들어본 적이 없으셨습니다
  - 당신이 그것들에 대해 듣지 못하셨습니다
  lexicon: HALOT
  rationale: ‘듣다’의 비인지/비전달 의미를 살려, 과거 이전까지의 미청취를 공손한 종결로 표현했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보게
  lexicon: HALOT
  rationale: 자기 과시를 유도하는 감탄사를 한국어에서는 시선 유도의 명령형으로 옮기는 것이 가장 자연스럽습니다. 여기서는 서술문 안의 인용이므로 공손형 ‘보십시오’가 적절합니다.
theological_decisions:
- issue: 하나님의 사전 계시와 인간의 자랑 방지
  chosen_reading: 하나님이 미리 알리시지 않음으로써, 이스라엘이 ‘내가 이미 알고 있었다’고 자랑하지 못하게 하셨다는 논리를 분명히 드러냈습니다.
  alternative_readings:
  - 단지 예언되었다고 완화하기
  - 결과만 알게 되었다고 약화하기
  rationale: פֶּן 이하의 절은 예방 목적을 분명히 말하므로, 계시 제한의 신학적 의도를 약화하지 않고 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
