revisions:
- from: 지금 그 일들이 창조되었고, 오래전부터 있는 것이 아닙니다. 오늘 이전에는 당신이 그것들을 듣지 못하셨습니다. 이는 당신이 「보십시오, 내가 그것들을 알았습니다」라고 말하지 못하게 하려는 것입니다.[a]
  to: 이제 이 일들이 창조되었으며, 옛적부터의 일이 아닙니다. 오늘 이전에는 너희가 이 일들에 관하여 듣지 못했습니다. 너희가 “보십시오, 내가 이 일들을 알고 있었습니다”라고 말하지 못하게 하려는 것입니다.[a]
  rationale: 시간 부사 מֵאָז를 존재 진술로 확장하지 않고 ‘옛적부터의 일’로 옮겼습니다. 2인칭 청자에 대한 부적절한 주체 높임을 제거하고, ידע의 의미가 ‘알게 됨’이 아니라 선행 지식임을 드러내도록 인용문을 다듬었습니다. ברא의 창조 언어와 פֶּן의 예방 목적은 유지했습니다.
