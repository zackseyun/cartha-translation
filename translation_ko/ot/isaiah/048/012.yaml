id: ISA.48.12
reference: Isaiah 48:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁמַ֤ע אֵלַ/י֙ יַֽעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל מְקֹרָאִ֑/י אֲנִי הוּא֙ אֲנִ֣י רִאשׁ֔וֹן אַ֖ף אֲנִ֥י אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
  footnotes:
  - marker: a
    text: Or, more literally, 'Israel, my called one.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I am the one.' The Hebrew expression is a compact formula of divine self-identification used repeatedly in Isaiah.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 말을 들으십시오, 야곱아, 내가 부른 이스라엘아[a]. 내가 바로 그입니다[b]. 내가 처음이며, 내가 마지막입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘나의 부름을 받은 이스라엘아’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그입니다.’ 히브리어의 압축된 자기 동일시 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  english_pob_choice: Listen to me
  chosen_korean: 나에게 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 나를 들으십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형과 אֵלַי의 방향성을 살려, 현대 한국어에서 자연스럽고 직접적인 권면이 되도록 ‘들으십시오’를 택했습니다.
- source_word: מְקֹרָאִי
  english_pob_choice: whom I called
  chosen_korean: 내가 불러낸 이스라엘
  alternatives_korean:
  - 내가 부른 이스라엘
  - 내가 부르신 이스라엘
  - 내가 부른 자
  lexicon: HALOT
  rationale: שורש קרא의 수동/결과적 의미를 단순한 과거형으로 풀어, 언약 백성이 하나님의 부르심으로 존재하게 된 점을 분명히 했습니다.
- source_word: אֲנִי הוּא
  english_pob_choice: I am he
  chosen_korean: 나는 그 사람입니다
  alternatives_korean:
  - 나는 그입니다
  - 나는 그분입니다
  - 나는 그입니다
  lexicon: HALOT
  rationale: 직역적인 ‘나는 그입니다’는 한국어에서 불완전하므로, 본문의 자기 식별 공식을 유지하면서도 현대 독자가 이해할 수 있게 ‘그 사람입니다’로 옮겼습니다. 다만 대상을 특정하지 않는 히브리어의 압축성은 각주로 보완했습니다.
- source_word: רִאשׁוֹן ... אַחֲרוֹן
  english_pob_choice: the first ... the last
  chosen_korean: 첫째이며, 나는 마지막입니다
  alternatives_korean:
  - 첫 번째이며, 나는 마지막입니다
  - 처음이며, 나는 끝입니다
  - 첫째이고, 나는 마지막입니다
  lexicon: HALOT
  rationale: רִאשׁוֹן과 אַחֲרוֹן의 제목적·절대적 대구를 살리면서, 한국어에서는 ‘첫째/마지막’이 가장 간결하고 힘 있게 대응합니다.
theological_decisions:
- issue: אֲנִי הוּא의 자기 계시 표현
  chosen_reading: ‘나는 그 사람입니다’로 번역하되, 히브리어의 압축된 자기 동일시와 신적 울림을 각주로 드러냅니다.
  alternative_readings:
  - 나는 그입니다
  - 나는 존재합니다
  - 나는 그분입니다
  rationale: 이 구절의 핵심은 단순한 대명사 대체가 아니라 하나님의 자기 선언입니다. 한국어에서 자연성을 확보하되, 신학적 무게를 약화시키지 않도록 직역과 해석 사이의 긴장을 남겼습니다.
  doctrine_reference: 하나님의 자기 계시와 유일성
