  naturalness: ‘내 말을 들으십시오’는 한국어에서 자연스러운 명령 표현입니다. ‘내가 바로 그입니다’는 현대 격식체 안에서 원문의 간결한 자기 선언과 의도된 지시 대상의 비특정성을 비교적 자연스럽게 유지합니다.
