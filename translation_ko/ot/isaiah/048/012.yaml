  to: 내 말을 들으십시오, 야곱아, 내가 부른 이스라엘아[a]. 내가 바로 그입니다[b]. 내가 처음이며, 내가 마지막입니다.
  rationale: 명령문의 자연스러운 한국어 표현을 위해 ‘나에게 들으십시오’를 ‘내 말을 들으십시오’로 다듬었습니다. ‘내가 부른’은 מְקֹרָאִי의 수동적·결과적 의미를 과도한 해석 없이 전달합니다. אֲנִי הוּא는 ‘내가 바로 그입니다’로 옮겨 원문의 간결한 자기 선언을 보존하고, 대명사의 해석상 열림은 각주에 남겼습니다. ‘처음/마지막’은 원문의 균형 잡힌 절대적 대구를 한국어로 자연스럽게 재현합니다. 각주 표지는 각각 관련 어구 뒤에 배치했습니다.
