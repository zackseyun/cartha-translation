id: ISA.48.15
reference: Isaiah 48:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י אֲנִ֛י דִּבַּ֖רְתִּי אַף קְרָאתִ֑י/ו הֲבִיאֹתִ֖י/ו וְ/הִצְלִ֥יחַ דַּרְכּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
  footnotes:
  - marker: a
    text: The pronouns "him" and "his" refer to the one God has called and brought; in context, this is commonly understood to be Cyrus (see Isa 48:14).
    reason: cross_reference
  - marker: b
    text: Or "he will prosper in his way" / "his way will prosper." The Hebrew verb is causative, literally "he will make his way prosper."
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 곧 내가 말하였고, 참으로 내가 그를 불렀으며, 그를 데려왔습니다. 또한 내가 그의 길을 형통하게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 남성 단수 대명사만 사용하므로, ‘그를 / 그의’는 문맥상 앞서 언급된 대상(통상 고레스)을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: ‘형통하게 하겠습니다’는 히필의 사역적 의미를 살린 번역입니다. 직역하면 “그의 길이 형통하게 되게 하겠습니다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  english_pob_choice: I, I
  chosen_korean: 나, 곧 내가
  alternatives_korean:
  - 나, 나
  - 내가, 내가
  - 오직 나
  lexicon: HALOT
  rationale: 겹친 1인칭 대명사의 강조를 살리되, 한국어에서는 자연스러운 재진술로 풀어 “나, 곧 내가”라고 옮겨 반복의 수사적 힘을 보존했습니다.
- source_word: דִּבַּרְתִּי / קְרָאתִיו / הֲבִיאֹתִיו
  english_pob_choice: have spoken / have called him / have brought him
  chosen_korean: 말하였고 / 그를 불렀으며 / 그를 데려왔습니다
  alternatives_korean:
  - 말했습니다 / 그를 불렀습니다 / 그를 이끌어왔습니다
  - 말하였고 / 그를 소명하였고 / 그를 인도하였고
  lexicon: HALOT
  rationale: 세 동사의 완료적 선언을 한국어 과거완료형으로 옮기면서, קרא와 בוא의 기본 동작을 과도하게 신학화하지 않고 직접적으로 살렸습니다.
- source_word: וְהִצְלִיחַ דַּרְכּוֹ
  english_pob_choice: I will make his way prosper
  chosen_korean: 내가 그의 길을 형통하게 하겠습니다
  alternatives_korean:
  - 내가 그의 길이 잘되게 하겠습니다
  - 내가 그의 길을 번성하게 하겠습니다
  - 그의 길이 형통할 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 따라 주어를 하나님으로 유지해 “내가 … 하겠습니다”로 번역했고, דֶּרֶךְ는 한국어에서 가장 직관적인 “길”로 옮겼습니다.
theological_decisions:
- issue: 1인칭 주어의 일관성
  chosen_reading: 말하는 분은 하나님이므로, 마지막 동사도 인간 주어가 아니라 하나님 1인칭으로 읽어 “내가 그의 길을 형통하게 하겠습니다”라고 옮겼습니다.
  alternative_readings:
  - “그가 그의 길을 형통하게 하겠습니다”처럼 3인칭으로 읽기
  - 문맥에 없는 명시적 주어를 추가하지 않고 모호하게 두기
  rationale: 히브리어 절 전체는 화자를 하나님으로 유지하며, 최신 수정도 이 점을 반영합니다. 따라서 마지막 절의 동사도 앞선 1인칭 선언과 연결해 번역해야 문법과 신학이 함께 보존됩니다.
  doctrine_reference: 원문 화자 일관성 유지; 문맥상 하나님의 주권적 선언
- issue: 대명사 지시 대상 비명시성
  chosen_reading: ‘그를 / 그의’는 본문에 이름이 반복되지 않은 상태를 그대로 반영해 유지했습니다.
  alternative_readings:
  - 이름을 밝혀 ‘고레스’로 번역하기
  - ‘그분의’처럼 추상화하기
  rationale: 히브리어는 이 절에서 남성 단수 대명사만 사용하므로, 본문에 없는 이름을 본문에 삽입하지 않고 독자가 문맥으로 지시 대상을 파악하도록 두는 편이 원문에 충실합니다.
  doctrine_reference: 원문 우선, 문맥적 지시 대상 보존
