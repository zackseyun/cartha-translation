id: ISA.48.22
reference: Isaiah 48:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ין שָׁל֔וֹם אָמַ֥ר יְהוָ֖ה לָ/רְשָׁעִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/022.yaml
  text: There is no peace," says Yahweh[a], "for the wicked.
  footnotes:
  - marker: a
    text: Or 'There is no well-being' or 'There is no wholeness.' The Hebrew shalom can include peace, welfare, and wholeness.
    reason: lexical_alternative
translation:
  language: ko
  text: “악인에게는 평강이 없습니다.” 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평강’은 여기서 평화뿐 아니라 안녕, 복리, 온전함까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין / שָׁלוֹם
  english_pob_choice: There is no peace
  chosen_korean: “평강이 없습니다”
  alternatives_korean:
  - “평화가 없습니다”
  - “안녕이 없습니다”
  - “평안이 없습니다”
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 감정적 평화보다 평강, 안녕, 온전함까지 포괄할 수 있으나, 짧은 예언 선언문에서는 POB의 ‘peace’를 따라 ‘평강이 없습니다’로 간결하게 옮기는 것이 적절합니다.
- source_word: אָמַר
  english_pob_choice: says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 말씀하셨습니다
  - 선언하십니다
  lexicon: HALOT
  rationale: 예언 공식을 현재형 선언으로 처리한 POB의 ‘says’를, 하나님께 대한 존대와 한국어 문체에 맞게 ‘말씀하십니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 문맥은 하나님의 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 고유성을 보존했습니다.
- source_word: לָרְשָׁעִים
  english_pob_choice: for the wicked
  chosen_korean: 악인에게는
  alternatives_korean:
  - 악한 자들에게는
  - 사악한 자들에게는
  - 악인들을 위하여는
  lexicon: HALOT
  rationale: ל는 여기서 진술의 적용 대상을 가리키므로, 한국어에서는 ‘~에게는’으로 자연스럽게 대응해 ‘악인에게는’으로 처리했습니다.
theological_decisions:
- issue: 예언적 선언문의 현재형 처리
  chosen_reading: 현재형의 직접 선언으로 번역하여 하나님의 지속적 판정을 드러냄
  alternative_readings:
  - 과거형으로 옮겨 ‘평강이 없었습니다’라고 처리
  - 미래형으로 옮겨 ‘평강이 없을 것입니다’라고 처리
  rationale: 히브리어 직설문과 POB의 ‘says’는 단회 과거 보고보다 현재적·공적 선언의 성격이 강하므로, 한국어도 현재형으로 유지하는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 예언적 말씀의 현재적 권위
