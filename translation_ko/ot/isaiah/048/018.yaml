id: ISA.48.18
reference: Isaiah 48:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
  footnotes:
  - marker: a
    text: Or 'you had listened to' or 'you had heeded' my commandments.
    reason: lexical_alternative
  - marker: b
    text: Or 'your justice' like the waves of the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 네가 내 명령들에 귀를 기울였더라면![a] 그러면 네 평강은 강 같았을 것이며, 네 의[b]는 바다의 물결 같았을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀를 기울였더라면’은 ‘들었더라면’ 또는 ‘경청했더라면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 의’는 문맥에 따라 ‘네 정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  english_pob_choice: If only
  chosen_korean: 아, 네가 … 귀를 기울였더라면!
  alternatives_korean:
  - 네가 … 했다면 좋았을 것입니다
  - 아, …했더라면
  lexicon: HALOT
  rationale: לוּא가 나타내는 이루어지지 않은 바람과 탄식을 현대 한국어에서 자연스럽게 살리기 위해 ‘아, …였더라면’ 구조를 썼습니다.
- source_word: הִקְשַׁ֖בְתָּ
  english_pob_choice: you had paid attention
  chosen_korean: 귀를 기울였더라면
  alternatives_korean:
  - 주의를 기울였더라면
  - 들었더라면
  - 경청했더라면
  lexicon: HALOT
  rationale: 단순 청취보다 주의를 두고 반응하는 뜻을 살리기 위해 ‘귀를 기울이다’를 선택했습니다.
- source_word: לְמִצְוֺתָי
  english_pob_choice: to my commandments
  chosen_korean: 내 명령들에
  alternatives_korean:
  - 내 계명들에
  - 내 명령에
  lexicon: HALOT
  rationale: מִצְוָה의 규범적·권위적 성격을 현대 한국어에서 직접적으로 드러내기 위해 ‘명령들’로 옮겼습니다. ‘계명들’은 종교적 어감이 강해 여기서는 덜 직접적입니다.
- source_word: שְׁלוֹמֶךָ
  english_pob_choice: your peace
  chosen_korean: 네 평강
  alternatives_korean:
  - 네 평화
  - 네 안녕
  - 네 복
  lexicon: HALOT
  rationale: שָׁלוֹם의 포괄성을 반영하면서도 한국어 성경에서 익숙한 공적·관계적 평안을 유지하기 위해 ‘평강’을 택했습니다.
- source_word: וְצִדְקָתְךָ
  english_pob_choice: your righteousness
  chosen_korean: 네 의
  alternatives_korean:
  - 네 의로움
  - 네 정의
  - 네 의로움과 정의
  lexicon: HALOT
  rationale: צְדָקָה의 법정적·언약적 의미를 간결하게 담기 위해 ‘의’를 선택했습니다. 이 본문은 순종의 결과로 나타나는 상태를 말하므로 ‘정의’보다 ‘의’가 더 적합합니다.
- source_word: כְּגַלֵּי הַיָּם
  english_pob_choice: like the waves of the sea
  chosen_korean: 바다의 물결 같았을 것입니다
  alternatives_korean:
  - 바다의 파도 같았을 것입니다
  - 바다 물결 같았을 것입니다
  lexicon: HALOT
  rationale: 시각적 이미지의 연속성과 시적 평행을 살리기 위해 ‘바다의 물결’로 옮겼습니다.
theological_decisions:
- issue: צִדְקָה의 한국어 처리에서 ‘의’와 ‘정의’ 사이의 긴장
  chosen_reading: ‘의’로 번역하되, 문맥상 순종의 결과로 주어지는 언약적 상태를 드러냅니다.
  alternative_readings:
  - 정의
  - 의로움
  - 신실함
  rationale: 본절은 명령에 대한 청종과 그 결과로 오는 상태를 평행시하므로, 한국어 성경 용례상 ‘의’가 가장 자연스럽게 그 도덕·언약적 함의를 보존합니다.
  doctrine_reference: Isaiah 48:18 lexical/theological tension on צִדְקָה
