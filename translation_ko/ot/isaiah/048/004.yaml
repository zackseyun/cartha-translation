- source_word: וְגִיד בַּרְזֶל
  english_pob_choice: an iron sinew
  chosen_korean: 쇠 힘줄이며
  alternatives_korean:
  - 철 힘줄이며
  - 쇠줄기이며
  - 쇠건줄이며
  lexicon: HALOT
  rationale: גיד의 신체 이미지를 살리기 위해 해석적으로 풀지 않고 ‘힘줄’로 옮겼으며, ברזל은 현대 한국어에서 자연스러운 ‘쇠’로 처리했습니다.
- source_word: וּמִצְחֲךָ נְחוּשָׁה
  english_pob_choice: your forehead is bronze
  chosen_korean: 네 이마는 놋입니다
  alternatives_korean:
  - 네 이마는 청동입니다
  - 네 이마는 구리입니다
  - 네 이마는 놋쇠입니다
  lexicon: HALOT
  rationale: נחושה는 금속의 단단함을 가리키므로 전통적으로도 널리 쓰이고 의미상 적절한 ‘놋’을 택해, 예언적 비유의 강한 질감을 유지했습니다.
theological_decisions:
- issue: 완고함과 무감각함을 드러내는 금속-신체 비유의 보존
  chosen_reading: ‘쇠 힘줄’과 ‘놋 이마’를 그대로 살려, 추상적 해석으로 평탄화하지 않았습니다.
  alternative_readings:
  - 네가 완고하고 수치심도 없다는 뜻입니다
  - 네 목은 매우 뻣뻣하고 네 이마는 두껍습니다
  rationale: 히브리어는 이스라엘의 반항을 신체와 금속의 구체적 이미지로 묘사하므로, 이를 유지해야 책망의 예언적 충격과 수사적 힘이 보존됩니다.
  doctrine_reference: 예언서의 수사 보존 원칙
