id: ISA.48.4
reference: Isaiah 48:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
  footnotes:
  - marker: a
    text: Or 'hard' or 'obstinate' for 'stubborn.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'your neck is an iron sinew.' The image conveys stubborn resistance.
    reason: cultural_note
  - marker: c
    text: Or 'your forehead is bronze.' The metaphor suggests shameless hardness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 알았기 때문에 네가 완고하며, 네 목은 쇠 힘줄이며, 네 이마는 놋입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굳은’ 또는 ‘고집 센’ 뜻입니다. 문맥상 사람의 완고함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 목은 쇠 힘줄’입니다. 이 이미지는 완고한 저항을 드러냅니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘네 이마는 청동입니다’로도 옮길 수 있습니다. 이 비유는 뻔뻔할 만큼 굳은 마음을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּעְתִּי
  english_pob_choice: Because I knew
  chosen_korean: 내가 너를 알았기 때문에
  alternatives_korean:
  - 내가 알았기 때문에
  - 내가 너를 아는 줄 알았기 때문에
  lexicon: HALOT
  rationale: מן+ידע의 관용적 원인 표현을 한국어에서는 원인절로 자연스럽게 옮기되, 인칭 대상인 ‘너’를 드러내어 예언적 책망의 직접성을 살렸습니다.
- source_word: קָשֶׁה
  english_pob_choice: stubborn
  chosen_korean: 완고하며
  alternatives_korean:
  - 굳으며
  - 고집스럽며
  - 완악하며
  lexicon: HALOT
  rationale: 문자적으로는 ‘굳다’이지만 사람에 대한 책망 문맥에서는 성품의 고집스러움을 뜻하므로, 현대 한국어에서 가장 직접적인 ‘완고하다’를 택했습니다.
- source_word: וְגִיד בַּרְזֶל
  english_pob_choice: an iron sinew
  chosen_korean: 쇠 힘줄이며
  alternatives_korean:
  - 철 힘줄이며
  - 쇠줄기이며
  - 쇠건줄이며
  lexicon: HALOT
  rationale: גיד의 신체 이미지를 살리기 위해 해석적으로 풀지 않고 ‘힘줄’로 옮겼으며, ברזל은 현대 한국어에서 자연스러운 ‘쇠’로 처리했습니다.
- source_word: וּמִצְחֲךָ נְחוּשָׁה
  english_pob_choice: your forehead is bronze
  chosen_korean: 네 이마는 놋입니다
  alternatives_korean:
  - 네 이마는 청동입니다
  - 네 이마는 구리입니다
  - 네 이마는 놋쇠입니다
  lexicon: HALOT
  rationale: נחושה는 금속의 단단함을 가리키므로 전통적으로도 널리 쓰이고 의미상 적절한 ‘놋’을 택해, 예언적 비유의 강한 질감을 유지했습니다.
theological_decisions:
- issue: 완고함과 무감각함을 드러내는 금속-신체 비유의 보존
  chosen_reading: ‘쇠 힘줄’과 ‘놋 이마’를 그대로 살려, 추상적 해석으로 평탄화하지 않았습니다.
  alternative_readings:
  - 네가 완고하고 수치심도 없다는 뜻입니다
  - 네 목은 매우 뻣뻣하고 네 이마는 두껍습니다
  rationale: 히브리어는 이스라엘의 반항을 신체와 금속의 구체적 이미지로 묘사하므로, 이를 유지해야 책망의 예언적 충격과 수사적 힘이 보존됩니다.
  doctrine_reference: 예언서의 수사 보존 원칙
