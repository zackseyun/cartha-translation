    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네가 완고하고,[a] 네 목은 쇠 힘줄이며,[b] 네 이마는 청동인 줄 알았기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굳은’ 또는 ‘고집 센’으로 옮길 수 있습니다. 문맥에서는 사람의 완고함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 목은 쇠 힘줄’입니다. 이 이미지는 완고한 저항을 드러냅니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘네 이마는 놋입니다’로도 옮길 수 있습니다. 이 비유는 뻔뻔할 만큼 굳은 태도를 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּעְתִּי
  english_pob_choice: Because I knew
  chosen_korean: 내가 너를 알았기 때문에
  alternatives_korean:
