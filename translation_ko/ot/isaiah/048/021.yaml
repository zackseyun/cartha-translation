id: ISA.48.21
reference: Isaiah 48:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א צָמְא֗וּ בָּ/חֳרָבוֹת֙ הֽוֹלִיכָ֔/ם מַ֥יִם מִ/צּ֖וּר הִזִּ֣יל לָ֑/מוֹ וַ/יִּ֨בְקַע צ֔וּר וַ/יָּזֻ֖בוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
  footnotes:
  - marker: a
    text: Or “in the deserts” or “through the dry places.”
    reason: lexical_alternative
  - marker: b
    text: The verse echoes the LORD’s provision of water from the rock in the wilderness (for example, Exod 17:6; Num 20:11).
    reason: cross_reference
translation:
  language: ko
  text: 그가 그들을 광야[a]로 이끄실 때에도 그들은 목마르지 않았습니다. 그가 그들을 위하여 반석에서 물이 흘러나오게 하시고, 반석을 쪼개시자 물이 솟아났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “광야에서” 또는 “메마른 곳들을 지나서.”
    reason: lexical_alternative
  - marker: b
    text: '이 절은 광야에서 반석으로부터 물을 내신 야훼의 공급을 떠올리게 합니다(예: 출 17:6; 민 20:11).'
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  english_pob_choice: did not thirst
  chosen_korean: 목마르게 하지 않으셨습니다
  alternatives_korean:
  - 목마르지 않게 하셨습니다
  - 갈증을 느끼지 않게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘갈증을 겪다’는 동사를 쓰므로, 상태형보다 동작성을 살린 표현이 적절합니다. 부정 능동형으로 옮겨 ‘목마르지 않게 하다’의 의미를 자연스럽게 전달했습니다.
- source_word: בָּחֳרָבוֹת
  english_pob_choice: through the deserts
  chosen_korean: 광야들
  alternatives_korean:
  - 사막들
  - 메마른 곳들
  - 광야들을 지나
  lexicon: HALOT
  rationale: 복수형의 황량하고 건조한 지역을 가리키므로, 성서 문맥에서 익숙하면서도 지리적 과잉규정을 피하는 ‘광야들’을 택했습니다. 이동 맥락은 앞뒤 문맥과 동사로 드러나므로 본문에는 중복해 넣지 않았습니다.
- source_word: הִזִּיל
  english_pob_choice: he made water flow
  chosen_korean: 물을 흘러나오게 하셨고
  alternatives_korean:
  - 물이 흐르게 하셨고
  - 물을 쏟아내셨고
  lexicon: HALOT
  rationale: 이 히필형은 ‘흐르게 하다/흘러나오게 하다’의 사역적 의미가 핵심이므로, 물의 지속적 유출을 드러내는 표현을 선택했습니다.
- source_word: צוּר
  english_pob_choice: rock / the rock
  chosen_korean: 반석
  alternatives_korean:
  - 바위
  - 그 반석
  lexicon: HALOT
  rationale: 출애굽 전승의 반석 물 공급을 환기하는 표준 성서어를 사용하되, 본문에는 정의관용어보다 이미지가 살아 있는 ‘반석’을 택했습니다.
theological_decisions:
- issue: 여호와의 이름이 직접 나오지 않고 동사들로만 이어지는 주어 처리
  chosen_reading: 앞 문맥의 야훼를 가리키는 암시적 주어를 ‘그는’으로 유지했습니다
  alternative_readings:
  - ‘야훼께서는’으로 명시하기
  - 주어를 생략하기
  rationale: 히브리어는 여기서 명시적 명사를 반복하지 않고 서술형 동사로 전개하므로, 한국어도 과도한 보충 없이 대명사로 연결해 서술의 흐름과 시적 압축을 살렸습니다.
  doctrine_reference: Translation philosophy §1 and §3
- issue: 출애굽/광야의 물 공급 사건에 대한 암시
  chosen_reading: 본문의 역사적 회상을 본문 안에서만 유지하고, 해석적 확장은 넣지 않았습니다
  alternative_readings:
  - 유형론적 의미를 본문에 덧붙이기
  - 성례전적 해석을 본문에 반영하기
  rationale: 이 절은 광야에서의 물 공급을 분명히 환기하지만, 번역은 그 상호본문성을 드러내되 후대 신학적 해석을 본문에 주입하지 않는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1 and §3
