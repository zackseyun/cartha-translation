revisions:
- from: 그는 그들에게 광야들[a]을 지나가게 하실 때 목마르게 하지 않으셨습니다. 그는 반석에서 그들을 위해 물을 흘러나오게 하셨고, 반석을 쪼개시니 물이 솟아나왔습니다[b].
  to: 그가 그들을 광야[a]로 이끄실 때에도 그들은 목마르지 않았습니다. 그가 그들을 위하여 반석에서 물이 흘러나오게 하시고, 반석을 쪼개시자 물이 솟아났습니다[b].
  rationale: 원문의 주절 ‘그들은 목마르지 않았다’를 직접 옮기고, ‘광야들’의 부자연스러운 한국어 복수형을 집합명사 ‘광야’로 바꾸었습니다. 물을 흐르게 하심, 반석을 쪼개심, 물이 솟아남이라는 원문의 순서와 사역적 뉘앙스는 유지했습니다. 각주 a의 대안 표현은 문법적으로 자연스럽게 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:14Z'
