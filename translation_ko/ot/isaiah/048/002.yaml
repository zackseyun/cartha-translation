  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מֵ/עִ֤יר הַ/קֹּ֨דֶשׁ֙ נִקְרָ֔אוּ וְ/עַל אֱלֹהֵ֥י יִשְׂרָאֵ֖ל נִסְמָ֑כוּ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
  footnotes:
  - marker: a
    text: Or, 'they are called from the holy city.' The Hebrew may emphasize either their designation by the city or their origin from it.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 거룩한 성에서 불렸고[a], 이스라엘의 하나님을 의지합니다. 만군의 야훼는 그의 이름입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘거룩한 성에서 불렸습니다.’ 히브리어는 그들의 출처를 가리키는지, 그 성에 의해 이름 붙은 존재임을 가리키는지 둘 다 가능할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר הַקֹּדֶשׁ / נִקְרָאוּ
  english_pob_choice: are called from/by the holy city
  chosen_korean: 거룩한 성에서 불렸고
  alternatives_korean:
  - 거룩한 성에서 불리었고
  - 거룩한 성에 의해 불렸고
  - 거룩한 성이라는 이름을 얻었고
  lexicon: HALOT
  rationale: 미완료 수동형의 קרא는 ‘불리다/이름을 얻다’의 뜻이므로 ‘불렸고’가 직접적입니다. מִן의 방향성은 ‘에서’로 살리되, 본문의 지정·기원 양쪽 가능성을 유지합니다.
- source_word: נִסְמָכוּ
  english_pob_choice: they lean on
  chosen_korean: 의지합니다
  alternatives_korean:
  - 기대고 있습니다
  - 의지하고 있습니다
  - 붙들고 있습니다
  lexicon: HALOT
  rationale: סמך의 비유적 의미인 의존/기대를 자연스러운 현대 한국어로 옮겼습니다. ‘의지합니다’가 문맥의 비판적 뉘앙스를 가장 잘 유지합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, צבאות는 전통적·포괄적 표현인 ‘만군’으로 처리했습니다. 직역적이면서도 예언서의 호칭으로 자연스럽습니다.
- source_word: שְׁמוֹ
  english_pob_choice: is his name
  chosen_korean: 그의 이름입니다
  alternatives_korean:
  - 그 이름입니다
  - 그분의 이름입니다
  lexicon: HALOT
  rationale: 히브리어 명명 공식의 종결 구문을 한국어 서술문으로 자연스럽게 옮겼습니다. 대명사 ‘그의’는 앞선 야훼를 가리키는 연결을 유지합니다.
theological_decisions:
- issue: 거룩한 성에서 불렸다 / 거룩한 성으로부터 불렸다의 중의성
  chosen_reading: ‘불렸고’로 번역하고 각주로 기원·지정 가능성을 열어 둡니다.
  alternative_readings:
  - 거룩한 성에서 불렸고
  - 거룩한 성으로 불렸고
  - 거룩한 성이라는 이름을 얻었고
  rationale: 본문은 출처(source)와 명명/소속(designation) 두 뉘앙스를 모두 가질 수 있습니다. 본문은 중립적으로 유지하고, 각주에서 대안 해석을 명시하는 것이 소스 충실성과 신학적 긴장을 함께 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve theological tension/ambiguity in footnotes)
