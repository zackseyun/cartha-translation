  source_fidelity: 수동태 נִקְרָאוּ와 하나님을 의지한다는 נִסְמָכוּ의 뜻은 대체로 반영되었지만, ‘거룩한 성에서 불렸고’는 한국어에서 장소 안에서 호명되었다는 뜻으로도 자연스럽게 읽혀 מִן의 기원/명명 관계를 충분히 전달하지 못합니다. 또한 히브리어의 현재적·상태적 진술에 맞추어 문장 시제를 통일하는 편이 좋습니다.
  naturalness: 합쇼체 문장 종결은 가능하나 ‘불렸고’와 ‘의지합니다’의 시제가 섞여 있습니다. ‘만군의 야훼는 그의 이름입니다’도 한국어에서는 지시 대상이 다소 불분명합니다. 명명 공식을 대시로 처리하면 자연스럽고 원문의 어순상 강조도 살릴 수 있습니다.
  terminology: ‘이스라엘의 하나님’, ‘만군’, ‘야훼’는 적절합니다. שְׁמוֹ의 남성 단수 소유 접미사는 한국어 존대 지시어 ‘그분의’로 자연스럽게 나타낼 수 있습니다.
