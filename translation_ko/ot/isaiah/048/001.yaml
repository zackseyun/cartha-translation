theological_decisions:
- issue: בֶאֱמֶת / בִצְדָקָה의 도덕적·신앙적 비난의 강도
  chosen_reading: '''진실함도 의로움도 없습니다''로 옮겨, 단순한 사실상 오류가 아니라 언약적 진정성과 올바름의 결여를 드러냈습니다.'
  alternative_readings:
  - '''진리도 의도 없습니다'''
  - '''참되게도 의롭게도 아닙니다'''
  rationale: 예언자의 비난은 말의 진위 여부를 넘어, 하나님 앞에서의 성실성과 바름의 결핍을 지적합니다. 한국어에서는 두 부정을 병렬로 살려 그 긴장을 보존했습니다.
  doctrine_reference: 예언서의 언약적 책망 표현
- issue: 유다의 물의 문자성과 관용성
  chosen_reading: 본문에는 '유다의 물'을 유지하고, 이해를 돕는 보조 설명은 각주로 돌리는 것이 적절합니다.
  alternative_readings:
  - '''유다의 허리에서 나온'''
  - '''유다의 자손들'''
  rationale: 히브리어의 시적 완곡 표현을 본문에서 풀어버리면 원문 이미지가 사라집니다. 따라서 메인 텍스트는 문자적 형식을 보존하는 편이 source-grounded합니다.
  doctrine_reference: 번역 투명성 원칙
