  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
  footnotes:
  - marker: a
    text: Hebrew 'from the waters of Judah,' likely meaning 'from the offspring' or 'from the loins of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 들으십시오, 야곱의 집이여 — 이스라엘의 이름으로 불리며 유다의 물에서 나온 자들이여. 여러분은 야훼의 이름으로 맹세하고 이스라엘의 하나님을 언급하지만, 진실함도 의로움도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '유다의 물에서'는 '유다의 자손에서' 또는 '유다의 허리에서'라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  english_pob_choice: Hear this
  chosen_korean: 이것을 들으십시오
  alternatives_korean:
  - 이것을 들으라
  - 이것을 들어 보십시오
  lexicon: HALOT
  rationale: 복수 명령형의 직접적 호소를 현대 한국어 합쇼체로 옮겼습니다. '들으십시오'는 본문의 엄중한 선포성을 살리면서도 자연스럽습니다.
- source_word: בֵּית יַעֲקֹב
  english_pob_choice: house of Jacob
  chosen_korean: 야곱의 집
  alternatives_korean:
  - 야곱의 가문
  - 야곱의 집안
  lexicon: HALOT
  rationale: 예언서에서 자주 쓰이는 관용적 호칭을 직역에 가깝게 유지해 언약 공동체를 지칭하는 표현성을 살렸습니다.
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  english_pob_choice: you who are called by the name of Israel
  chosen_korean: 이스라엘의 이름으로 불리며
  alternatives_korean:
  - 이스라엘이라는 이름으로 불리며
  - 이스라엘의 이름으로 불리는
  lexicon: HALOT
  rationale: '''이름으로 불리다''라는 수동적 명명 구조를 보존해, 단순한 별칭이 아니라 소속과 명칭 부여의 뉘앙스를 드러냈습니다.'
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  english_pob_choice: and who came out from the waters of Judah
  chosen_korean: 유다의 물에서 나온 자들이여
  alternatives_korean:
  - 유다의 물에서 나왔고
  - 유다의 샘에서 나온 자들이여
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 본문에 남겨 투명성을 유지했습니다. '물'은 시적·완곡 표현으로, 본문 뒤의 각주로 의미를 보완할 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 신성 4문자를 고유명으로 보존하는 본 프로젝트 기본어를 따랐습니다. 한국어 본문에서도 관습적 대체어보다 음역을 사용해 원문 식별성을 유지했습니다.
theological_decisions:
- issue: בֶאֱמֶת / בִצְדָקָה의 도덕적·신앙적 비난의 강도
  chosen_reading: '''진실함도 의로움도 없습니다''로 옮겨, 단순한 사실상 오류가 아니라 언약적 진정성과 올바름의 결여를 드러냈습니다.'
  alternative_readings:
  - '''진리도 의도 없습니다'''
  - '''참되게도 의롭게도 아닙니다'''
  rationale: 예언자의 비난은 말의 진위 여부를 넘어, 하나님 앞에서의 성실성과 바름의 결핍을 지적합니다. 한국어에서는 두 부정을 병렬로 살려 그 긴장을 보존했습니다.
  doctrine_reference: 예언서의 언약적 책망 표현
- issue: 유다의 물의 문자성과 관용성
  chosen_reading: 본문에는 '유다의 물'을 유지하고, 이해를 돕는 보조 설명은 각주로 돌리는 것이 적절합니다.
  alternative_readings:
  - '''유다의 허리에서 나온'''
  - '''유다의 자손들'''
  rationale: 히브리어의 시적 완곡 표현을 본문에서 풀어버리면 원문 이미지가 사라집니다. 따라서 메인 텍스트는 문자적 형식을 보존하는 편이 source-grounded합니다.
  doctrine_reference: 번역 투명성 원칙
