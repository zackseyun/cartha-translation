  source_fidelity: 히브리어의 시간 순서, 미리 알림의 목적, 그리고 세 우상 명칭의 병렬은 대체로 잘 보존되었습니다. 다만 עָשָׂם은 예고된 일들을 ‘이루다/행하다’라는 뜻이므로 ‘그것들을 했다’보다 ‘그것들을 이루었다’가 문맥상 정확합니다. פֶּן은 거짓된 귀속을 하지 않게 한다는 예방 목적이므로 ‘말하지 못하게’보다 ‘말하지 않도록’이 더 충실합니다.
  naturalness: ‘내가 너로 그것을 듣게 했습니다’와 ‘부어 만든 형상’은 이해할 수 있으나 현대 표준 한국어에서는 다소 직역적이거나 어색합니다. ‘네게 그것을 듣게 했습니다’와 ‘주조한 형상’이 자연스럽고 격식 있는 표현입니다.
  terminology: עָצְבִּי, פִסְלִי, נִסְכִּי의 구별은 유지해야 합니다. ‘우상 / 새긴 형상 / 주조한 형상’은 각각의 의미를 구별하면서 현대 한국어에서도 자연스럽습니다. ‘주조한 형상’의 대안으로 ‘녹여 만든 형상’을 제시하는 각주는 적절합니다.
