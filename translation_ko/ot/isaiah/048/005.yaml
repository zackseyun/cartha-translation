  to: 내가 그것을 오래전에 너에게 알렸습니다. 그 일이 일어나기 전[a]에 내가 네게 그것을 듣게 했습니다. 이는 네가 “내 우상이 그것들을 이루었고, 내 새긴 형상과 내 주조한 형상[b]이 그것들을 명령했다”라고 말하지 않도록 하려는 것입니다.
