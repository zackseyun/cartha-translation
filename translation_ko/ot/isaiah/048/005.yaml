id: ISA.48.5
reference: Isaiah 48:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַגִּ֤יד לְ/ךָ֙ מֵ/אָ֔ז בְּ/טֶ֥רֶם תָּב֖וֹא הִשְׁמַעְתִּ֑י/ךָ פֶּן תֹּאמַר֙ עָצְבִּ֣/י עָשָׂ֔/ם וּ/פִסְלִ֥/י וְ/נִסְכִּ֖/י צִוָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
  footnotes:
  - marker: a
    text: Or 'before it happened.' The Hebrew is literally 'before it came.'
    reason: lexical_alternative
  - marker: b
    text: '''Cast image'' may also be rendered ''molten image.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 오래전에 너에게 알렸습니다. 그 일이 일어나기 전[a]에 내가 네게 그것을 듣게 했습니다. 이는 네가 “내 우상이 그것들을 이루었고, 내 새긴 형상과 내 주조한 형상[b]이 그것들을 명령했다”라고 말하지 않도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 일어나기 전에’. 히브리어는 문자적으로 ‘그것이 오기 전에’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주조한 형상’은 ‘녹여 만든 형상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  english_pob_choice: I declared
  chosen_korean: 내가 … 알렸습니다
  alternatives_korean:
  - 내가 … 선언했습니다
  - 내가 … 말했습니다
  lexicon: HALOT
  rationale: נגד의 히필은 단순 발화보다 ‘알리다/선언하다’의 공시적 의미가 강하므로, 예언적 문맥에 맞게 ‘알렸습니다’로 옮겼습니다.
- source_word: מֵאָז
  english_pob_choice: long ago
  chosen_korean: 오래전에
  alternatives_korean:
  - 그때부터
  - 옛적부터
  - 미리
  lexicon: HALOT
  rationale: 앞선 시점을 가리키는 표현이므로 현대 한국어에서 자연스럽고 시간적 간격을 드러내는 ‘오래전에’로 옮겼습니다.
- source_word: פֶּן תֹּאמַר …
  english_pob_choice: lest you say
  chosen_korean: …라고 말하지 못하게 하려는 것입니다
  alternatives_korean:
  - …라고 말할까 하여
  - …라고 말하지 않도록
  lexicon: HALOT
  rationale: פֶּן이 예언의 예방 목적을 나타내므로, 단순 금지보다 목적성을 살려 ‘말하지 못하게 하려는 것입니다’로 풀었습니다.
- source_word: עָצְבִּי / פִסְלִי / נִסְכִּי
  english_pob_choice: my idol / my carved image / my cast image
  chosen_korean: 내 우상 / 내 새긴 형상 / 내 부어 만든 형상
  alternatives_korean:
  - 내 우상 / 내 새긴 우상 / 내 부은 우상
  - 내 형상 / 내 조각한 형상 / 내 주조한 형상
  lexicon: HALOT
  rationale: 세 용어의 반복적 폄하를 살리되, 각각을 구분해서 번역해야 하므로 ‘우상’, ‘새긴 형상’, ‘부어 만든 형상’으로 대응했습니다. ‘형상’은 대상의 조형성을, ‘부어 만든’은 주조/주입의 제작 방식을 드러냅니다.
- source_word: צִוָּם
  english_pob_choice: commanded them
  chosen_korean: 그것들을 명령했다
  alternatives_korean:
  - 그것들을 명했다
  - 그것들을 지시했다
  lexicon: HALOT
  rationale: צוה의 기본 의미를 따라 ‘명령했다’로 옮겨, 우상에게 권능과 주도권이 있는 듯한 역설적 풍자를 보존했습니다.
theological_decisions:
- issue: 우상 3중 표현의 구분 유지
  chosen_reading: ‘우상’, ‘새긴 형상’, ‘부어 만든 형상’을 서로 구별해 유지했습니다.
  alternative_readings:
  - 세 표현을 모두 ‘우상’으로 통일함
  - 전통어 ‘새긴 우상’/‘부어 만든 우상’으로 평준화함
  rationale: 히브리어는 서로 겹치지만 구별되는 세 용어를 병렬로 배치해 우상숭배를 강하게 풍자하므로, 한국어에서도 그 반복과 차이를 보존했습니다.
  doctrine_reference: 'Translation philosophy #5 (consistency of key terms, or documented exception)'
