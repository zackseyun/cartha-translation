  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: ko
  text: 당신은 이미 들었습니다. 이제 이 모든 것을 보십시오. 그런데도 어찌 그것을 선포하지 않겠습니까? 이제부터 나는 당신에게 새 일들, 곧 당신이 알지 못했던 감추어진 일들을 듣게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선포하다’는 여기서 단순한 말하기보다 공개적으로 알리는 뜻을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַ֤עְתָּֽ
  english_pob_choice: You have heard
  chosen_korean: 당신은 이미 들었습니다
  alternatives_korean:
  - 당신이 들었습니다
  - 들으셨습니다
  lexicon: שמע
  rationale: 완료된 청취 사실을 자연스럽게 드러내기 위해 현재완료 감각의 ‘이미 들었습니다’를 택했습니다.
- source_word: חֲזֵה֙ כֻּלָּ֔/הּ
  english_pob_choice: now see all this
  chosen_korean: 이 모든 것을 보십시오
  alternatives_korean:
  - 이 모든 것을 보라
  - 모든 것을 이제 보십시오
  lexicon: חזה
  rationale: 감탄적/명령적 촉구를 살리되, 현대 한국어에서 가장 직접적인 공적 호소로 ‘보십시오’를 선택했습니다.
- source_word: הֲ/ל֣וֹא תַגִּ֑ידוּ
  english_pob_choice: And will you not declare it?
  chosen_korean: 그런데도 어찌 그것을 선포하지 않겠습니까?
  alternatives_korean:
  - 그러면 그것을 말하지 않겠습니까?
  - 그것을 알리지 않겠습니까?
  lexicon: נגד
  rationale: 단순한 발화가 아니라 공개적 선포를 요구하는 수사적 질문이므로 ‘선포하다’로 옮겼습니다.
- source_word: חֲדָשׁוֹת / נְצֻר֖וֹת
  english_pob_choice: new things, hidden things
  chosen_korean: 새 일들, 곧 당신이 알지 못했던 감추어진 일들
  alternatives_korean:
  - 새로운 일들, 감추어진 일들
  - 새로운 일들, 숨겨진 일들
  lexicon: חדש / נצר
  rationale: ‘new things’와 ‘hidden things’를 평행으로 살리면서, ‘감추어진’으로 מקור(원천)의 숨겨짐을 유지했습니다.
