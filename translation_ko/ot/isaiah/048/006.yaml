  source_fidelity: 히브리어는 첫 문장과 마지막 문장에서 단수 2인칭을 쓰지만, ‘알리지 않겠습니까?’에 해당하는 תַגִּידוּ는 복수 2인칭입니다. 초안은 이를 모두 단수 ‘당신’으로 평준화하여 본문의 인칭 전환을 잃었습니다. 또한 תַגִּידוּ는 문맥상 ‘알리다/말하다’로 충분하며, ‘선포하다’는 가능한 해석이지만 불필요하게 전문적·강한 뉘앙스를 더합니다.
  naturalness: 합쇼체의 직접 호소를 유지하면서 단수와 복수의 전환을 ‘당신/여러분’으로 명시했습니다. ‘그런데도 어찌’는 원문의 단순 접속과 수사 의문에 더해지는 대조·강조이므로 제거했습니다. ‘들려줍니다’는 הִשְׁמַעְתִּיךָ의 ‘듣게 하다’ 의미를 자연스럽게 반영합니다.
  terminology: חֲדָשׁוֹת와 נְצֻרוֹת의 병렬·설명 관계를 ‘새 일들, 곧 … 감추어진 일들’로 유지했습니다. ‘감추어진’은 본문의 숨겨진 것이라는 의미를 보존합니다.
