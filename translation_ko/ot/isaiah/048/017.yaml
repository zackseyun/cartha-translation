source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/ךָ֖ קְד֣וֹשׁ יִשְׂרָאֵ֑ל אֲנִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מְלַמֶּדְ/ךָ֣ לְ/הוֹעִ֔יל מַדְרִֽיכֲ/ךָ֖ בְּ/דֶ֥רֶךְ תֵּלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
  footnotes:
  - marker: a
    text: Or, more formally, “who teaches you to profit.”
    reason: lexical_alternative
  - marker: b
    text: Or “who guides you in the way you go.” The Hebrew may be read more descriptively (“the way you go”) or more instructionally (“the way you should go”); the main text reflects the instructional sense in context.
    reason: alternative_reading
translation:
  language: ko
  text: 네 구속자, 이스라엘의 거룩하신 분이신 야훼께서 이렇게 말씀하십니다. “나는 네 하나님 야훼입니다. 나는 너에게 유익하도록[a] 가르치고, 네가 가야 할 길로[b] 너를 인도합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “유익하게 하도록”입니다. “너에게 유익을 주도록”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “네가 가는 길”로도 이해될 수 있습니다. 문맥에서는 가르침과 인도의 대상이 되는 마땅히 걸어갈 길이라는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC / 프로젝트 기본 용례
  rationale: 언약적 신명 표기를 프로젝트 기본값에 따라 음역했고, 본문 첫 호칭에서도 동일한 신명 인식을 유지했습니다.
- source_word: גֹּאַלְךָ
  english_pob_choice: your Redeemer
  chosen_korean: 네 구속자
  alternatives_korean:
  - 네 속량자
  - 네 친족-구속자
  lexicon: HALOT
  rationale: 문맥상 야훼의 구원 행위를 가리키는 칭호이므로, ‘구속자’로 간결하게 옮겨 속량/해방의 힘을 살렸습니다.
- source_word: מְלַמֶּדְךָ לְהוֹעִיל
  english_pob_choice: who teaches you to profit / for your benefit
  chosen_korean: 너에게 유익하도록 가르치며
  alternatives_korean:
  - 너에게 이롭게 가르치며
  - 너의 이익을 위해 가르치며
  lexicon: HALOT
  rationale: לְהוֹעִיל의 ‘유익/이롭게 하다’ 의미를 살리되, 한국어에서 자연스러운 목적구로 풀어 본문의 교육적·호의적 의미를 전달했습니다.
- source_word: מַדְרִיכֲךָ בְּדֶרֶךְ תֵּלֵךְ
  english_pob_choice: who leads you in the way you should go
  chosen_korean: 네가 가야 할 길로 너를 인도합니다
  alternatives_korean:
  - 네가 가는 길로 너를 인도합니다
  - 네가 걸어가야 할 길로 너를 인도합니다
  lexicon: HALOT
  rationale: 문법상 ‘네가 가는/가야 할’ 두 가능성이 있으나, POB의 본문 채택처럼 권면적·교육적 뉘앙스를 살려 ‘가야 할 길’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 자기소개와 반복되는 ‘네 하나님’ 정체성
  chosen_reading: “나는 네 구속자요 이스라엘의 거룩한 이, 네 하나님입니다.”
  alternative_readings:
  - “나는 야훼, 네 하나님입니다.”
  - “나는 너의 하나님 야훼입니다.”
  rationale: 히브리어의 칭호들을 한 문장 안에서 유지해 야훼의 구속자·거룩하신 분·언약의 하나님이라는 중첩된 자기계시를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘가야 할 길’의 규범성
  chosen_reading: 네가 가야 할 길로 너를 인도합니다
  alternative_readings:
  - 네가 가는 길로 너를 인도합니다
  - 네가 가야 하는 길로 너를 인도합니다
  rationale: 히브리어의 불완전형이 단순 미래라기보다 올바른 길에 대한 지시적 뉘앙스를 띠므로, 명령조를 과도하게 강화하지 않으면서도 안내의 규범성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
