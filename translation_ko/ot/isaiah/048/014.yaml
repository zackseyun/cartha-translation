source:
  edition: WLC
  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
  footnotes:
  - marker: a
    text: Or, 'The LORD loves him; he will carry out his purpose in Babylon, and his arm will be on the Chaldeans,' with the pronouns understood of the LORD rather than of his chosen agent.
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 모두 모여 들으십시오. 그들 가운데 누가 이 일들을 선포했습니까? 야훼께서 그를 사랑하셨습니다. 그는 바빌론에서 자신의 뜻을 이루실 것이며, 그의 팔은 갈대아인들에게 향할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 그를 사랑하셨습니다. 그는 바빌론에서 자신의 뜻을 이루실 것이며, 그의 팔은 갈대아인들에게 향할 것입니다.’ — 여기서 대명사를 야훼 자신이 아니라 그분이 택하신 대리인에게 돌려 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ / כֻלְּכֶם
  english_pob_choice: Gather yourselves, all of you
  chosen_korean: 너희는 모두 모여 들으십시오
  alternatives_korean:
  - 모두 모이십시오
  - 너희 모두 모여 들으십시오
  lexicon: HALOT
  rationale: 복수 명령의 직접적 소집을 살리되, 한국어에서는 ‘모여 들으십시오’가 자연스럽고 공적인 호소로 들립니다.
- source_word: וּשֲׁמָעוּ
  english_pob_choice: and listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 귀 기울이십시오
  - 들어 보십시오
  lexicon: HALOT
  rationale: 단순 청각이 아니라 주의를 기울여 받아들이라는 명령이므로 ‘듣다’보다 ‘들으십시오’가 문맥에 맞습니다.
- source_word: הִגִּיד אֶת־אֵלֶּה
  english_pob_choice: has declared these things
  chosen_korean: 이 일들을 선포했습니까
  alternatives_korean:
  - 이것들을 말했습니까
  - 이 일들을 알렸습니까
  lexicon: HALOT
  rationale: נגד의 히필은 단순 진술보다 공적으로 알리고 선언하는 뉘앙스가 있어 ‘선포하다’가 더 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 문자적 고유명을 보존하는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: “그를 사랑하셨습니다 / 그의 뜻을 이루실 것이며 / 그의 팔은 …”의 대명사 지시 대상
  chosen_reading: 대명사는 야훼께서 사랑하시고 사용하시는 인간 대리인(문맥상 고레스)을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 대명사들을 모두 야훼 자신에게 돌려 읽을 수 있습니다.
  rationale: 이 문맥은 바빌론에 대한 야훼의 역사적 행위를 수행할 특정 인물을 전제하므로, 본문 흐름을 살려 인간 대리인 해석을 본문에 반영했습니다. 다만 히브리어 대명사 배열이 양가적이므로 해석의 긴장을 완전히 제거하지 않았습니다.
  doctrine_reference: 해석 긴장 보존
- issue: בְּבָבֶל의 방향성
  chosen_reading: ‘바빌론에서’로 옮기되, 심판/작용의 문맥을 유지했습니다.
  alternative_readings:
  - 바빌론에 대해
  - 바빌론을 향해
  rationale: 전치사 בְּ의 기본값은 ‘~에서/안에서’이지만, 여기서는 역사적 실행 장소를 가리키는 흐름이 강하므로 ‘바빌론에서’가 가장 본문 친화적입니다. 동시에 다음 절의 대립 구조가 심판적 함의를 분명히 합니다.
  doctrine_reference: 전치사 의미 범위 존중
