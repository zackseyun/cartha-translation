  to: 너희는 모두 모여 들으십시오. 그들 가운데 누가 이 일들을 선포했습니까? 야훼께서 그를 사랑하셨습니다. 그는 바빌론에서 자신의 뜻을 이룰 것이며, 그의 팔은 갈대아인들을 칠 것입니다.[a]
  rationale: 본문은 문맥상 야훼께서 사랑하신 인간 대리인이 바빌론에서 자신의 뜻을 이루고 갈대아인들을 치는 것으로 읽었습니다. 히브리어 대명사들의 지시 대상이 논쟁적이므로, 야훼 자신을 뒤따르는 행위와 ‘그의 팔’의 주체로 읽는 대안을 각주에 정확히 보존했습니다. ‘팔’이라는 히브리어 비유는 유지하되, 적대 문맥을 자연스러운 한국어로 드러냈습니다.
