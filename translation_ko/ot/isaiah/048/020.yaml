id: ISA.48.20
reference: Isaiah 48:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
  footnotes:
  - marker: a
    text: Or “from Chaldea”; the Hebrew names the people, “the Chaldeans.”
    reason: lexical_alternative
  - marker: b
    text: Or “to the ends of the earth.”
    reason: lexical_alternative
translation:
  language: ko
  text: '“바벨에서 나가십시오[a],

    갈대아 사람들[에서] 도망치십시오!

    기쁨의 소리로 이 일을 선포하고,

    널리 알리며,

    땅 끝까지 퍼뜨리십시오.

    말하십시오[b], ‘야훼께서 그의 종 야곱을 구속하셨습니다.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “갈대아에서”; 히브리어는 민족명인 “갈대아 사람들”을 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “땅 끝까지”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל / בִּרְחוּ מִכַּשְׂדִּים
  english_pob_choice: Go out from Babylon[a] / flee from the Chaldeans
  chosen_korean: 바벨에서 나가십시오 / 갈대아 사람들[에서] 도망치십시오
  alternatives_korean:
  - 바빌론에서 나오십시오 / 갈대아인들에게서 달아나십시오
  - 바벨론에서 떠나십시오 / 갈대아인들로부터 피하십시오
  lexicon: HALOT
  rationale: צְאוּ와 בִּרְחוּ의 연속 명령을 각각 ‘나가십시오’와 ‘도망치십시오’로 살려, 단순 이동이 아니라 급박한 탈출 명령임을 드러냈습니다.
- source_word: בְּקוֹל רִנָּה
  english_pob_choice: with a shout of joy
  chosen_korean: 기쁨의 소리로
  alternatives_korean:
  - 기쁨의 외침으로
  - 즐거운 함성으로
  lexicon: HALOT
  rationale: 직역하면 ‘환호의 소리’에 가깝지만, 한국어에서는 ‘기쁨의 소리로’가 본문 뒤의 선포 동사들과 자연스럽게 이어지면서도 공적 환호의 뉘앙스를 유지합니다.
- source_word: הַגִּידוּ / הַשְׁמִיעוּ / הוֹצִיאוּהָ
  english_pob_choice: Declare this / make it heard / send it out
  chosen_korean: 이 일을 선포하고, 널리 알리며, 땅 끝까지 퍼뜨리십시오
  alternatives_korean:
  - 이것을 말하고, 들리게 하며, 땅 끝까지 내보내십시오
  - 이것을 알리고, 듣게 하며, 땅 끝까지 전하십시오
  lexicon: HALOT
  rationale: 세 동사의 점층적 명령을 한국어에서도 각각 구분해, 공개 선포(선포하다)·가시적 전달(알리다)·확산(퍼뜨리다)의 흐름을 살렸습니다.
- source_word: עַד קְצֵה הָאָרֶץ
  english_pob_choice: to the end of the earth
  chosen_korean: 땅 끝까지
  alternatives_korean:
  - 땅의 끝까지
  - 세상 끝까지
  lexicon: HALOT
  rationale: 히브리어 단수 ‘끝/모퉁이’를 한국어 관용에 맞게 ‘땅 끝’으로 옮겨, 종말론적 범위를 과장 없이 전달했습니다.
- source_word: גָּאַל יְהוָה
  english_pob_choice: Yahweh has redeemed
  chosen_korean: 야훼께서 … 구속하셨습니다
  alternatives_korean:
  - 야훼께서 … 속량하셨습니다
  - 야훼께서 … 구원하셨습니다
  lexicon: HALOT
  rationale: גָּאַל의 언약적 구속·되찾음의 의미를 ‘구속하다’로 유지했습니다. ‘구원하다’는 너무 넓고, ‘속량하다’는 한국어에서 다소 기술적입니다.
- source_word: עַבְדּוֹ יַעֲקֹב
  english_pob_choice: his servant Jacob
  chosen_korean: 그의 종 야곱
  alternatives_korean:
  - 야곱 그의 종
  - 그 종 야곱
  lexicon: HALOT
  rationale: 소유격이 붙은 명사구를 한국어에서 자연스럽게 ‘그의 종 야곱’으로 옮겨, 야곱의 언약적 신분을 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה를 제목어 ‘주’로 바꾸지 않고 고유명사로 드러내기 위해 ‘야훼’를 채택했습니다. 이는 본문의 언약적 고유성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘구속하다’의 구원론적 뉘앙스
  chosen_reading: 구속하셨습니다
  alternative_readings:
  - 속량하셨습니다
  - 구원하셨습니다
  rationale: 이 구절은 바벨론 포로 해방을 선언하는 동시에 야훼의 언약적 구속 행위를 말하므로, 한국어에서도 법정적·언약적 색채를 가진 ‘구속하다’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #5'
