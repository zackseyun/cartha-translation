  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
  footnotes:
  - marker: a
    text: Or 'like its particles' or 'like its pebbles'; the Hebrew refers to the small units of the sand.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his name'; the singular may personify the offspring as a collective line. Some translations render 'their name' or 'its name.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 자손이 모래 같고, 네 몸에서 난 자손이 그 모래알 같았을 것입니다. 그들의 이름은 내 앞에서 끊어지거나 사라지지 않았을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 모래의 작은 단위를 가리키는 표현을 사용합니다. ‘모래알’은 이를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형 ‘그의 이름’을 씁니다. 문맥상 집합적 후손을 가리킬 수 있어 한국어 본문에서는 복수 의미를 드러냈습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: would have been
  chosen_korean: ~였을 것입니다
  alternatives_korean:
  - ~입니다
  - ~되었을 것입니다
  lexicon: WLC
  rationale: 앞절의 조건적 탄식에 이어지는 반사실적 결과를 한국어에서도 과거의 미실현 의미로 드러냈습니다.
- source_word: כַחוֹל
  english_pob_choice: like the sand
  chosen_korean: 모래 같고
  alternatives_korean:
  - 모래처럼
  - 모래와 같고
  lexicon: HALOT
  rationale: ‘כַ’의 비유를 자연스러운 현대 한국어로 살리면서, 수량의 압도적 많음을 간결하게 전달했습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 씨
  - 네 후손
  lexicon: HALOT
  rationale: 인간 혈통의 집합적 의미를 살리되, ‘씨’의 직역성이 주는 어색함을 피하고 ‘후손’보다 성경적 호응이 좋은 ‘자손’을 택했습니다.
- source_word: כִּמְעֹתָיו
  english_pob_choice: like its grains
  chosen_korean: 그 모래알 같았을 것입니다
  alternatives_korean:
  - 그 입자 같았을 것입니다
  - 그 알갱이 같았을 것입니다
  lexicon: HALOT
  rationale: 모래의 작은 단위를 가리키는 표현을 한국어 관용에 맞게 ‘모래알’로 옮겨, 모래 비유의 세밀한 확대를 유지했습니다.
- source_word: שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 그들의 이름
  alternatives_korean:
  - 그의 이름
  - 그 이름
  lexicon: HALOT
  rationale: 히브리어는 단수 접미사를 쓰지만, 한국어 독자는 앞의 집합 명사들과 자연스럽게 연결되도록 복수 의미를 드러내는 번역을 본문에 두고, 단수 형식은 주석 없이도 이해 가능하다고 보았습니다.
theological_decisions:
- issue: 반사실적 조건문의 힘
  chosen_reading: 전체를 ‘~였을 것입니다’ 형태의 미실현 결과로 옮겼습니다.
  alternative_readings:
  - 단순 과거형으로 옮김
  - 미래형으로 옮김
  rationale: 이 절은 앞절의 ‘만일 네가 주의했다면’이라는 탄식을 이어받으므로, 실제 성취가 아니라 상실된 축복이라는 점을 분명히 해야 합니다.
  doctrine_reference: 'translation philosophy: source-anchored counterfactual rendering'
- issue: ‘이름’의 수일치
  chosen_reading: 본문에서는 ‘그들의 이름’으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 그의 이름
  - 그 이름
  rationale: 히브리어 형태의 단수성은 문맥상 집합체를 가리키는 인칭화로 이해할 수 있지만, 한국어에서는 앞의 복수 집합 명사들과의 호응이 더 중요하여 독자 이해를 우선했습니다.
  doctrine_reference: 'translation philosophy: collective singular handling'
