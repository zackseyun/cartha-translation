- source_word: שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 그들의 이름
  alternatives_korean:
  - 그의 이름
  - 그 이름
  lexicon: HALOT
  rationale: 히브리어는 단수 접미사를 쓰지만, 한국어 독자는 앞의 집합 명사들과 자연스럽게 연결되도록 복수 의미를 드러내는 번역을 본문에 두고, 단수 형식은 주석 없이도 이해 가능하다고 보았습니다.
theological_decisions:
- issue: 반사실적 조건문의 힘
  chosen_reading: 전체를 ‘~였을 것입니다’ 형태의 미실현 결과로 옮겼습니다.
  alternative_readings:
  - 단순 과거형으로 옮김
  - 미래형으로 옮김
  rationale: 이 절은 앞절의 ‘만일 네가 주의했다면’이라는 탄식을 이어받으므로, 실제 성취가 아니라 상실된 축복이라는 점을 분명히 해야 합니다.
  doctrine_reference: 'translation philosophy: source-anchored counterfactual rendering'
- issue: ‘이름’의 수일치
  chosen_reading: 본문에서는 ‘그들의 이름’으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 그의 이름
  - 그 이름
  rationale: 히브리어 형태의 단수성은 문맥상 집합체를 가리키는 인칭화로 이해할 수 있지만, 한국어에서는 앞의 복수 집합 명사들과의 호응이 더 중요하여 독자 이해를 우선했습니다.
  doctrine_reference: 'translation philosophy: collective singular handling'
