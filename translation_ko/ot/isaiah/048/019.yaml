  rationale: 인간 혈통의 집합적 의미를 살리되, ‘씨’의 직역성이 주는 어색함을 피하고 ‘후손’보다 성경적 호응이 좋은 ‘자손’을 택했습니다.
- source_word: כִּמְעֹתָיו
  english_pob_choice: like its grains
  chosen_korean: 그 모래알 같았을 것입니다
