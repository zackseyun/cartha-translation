id: ISA.48.13
reference: Isaiah 48:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
  footnotes:
  - marker: a
    text: Or 'spanned the heavens' or 'stretched out the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 내 손이 땅의 기초를 놓았고, 내 오른손이 하늘을 펼쳤습니다. 내가 그들을 부르면, 그들은 함께 섭니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 실로
  - 과연
  - 심지어
  lexicon: HALOT
  rationale: 문두의 אַף는 단순한 접속이 아니라 강한 강조를 띠므로, 현대 한국어에서 자연스러운 감탄·강조 부사인 '참으로'로 옮겼습니다.
- source_word: יָסְדָה אֶרֶץ
  english_pob_choice: founded the earth
  chosen_korean: 땅의 기초를 놓았고
  alternatives_korean:
  - 땅을 세웠고
  - 땅을 기초 놓으셨고
  - 땅을 설립하셨고
  lexicon: HALOT
  rationale: יסד는 '기초를 놓다'의 이미지가 핵심이므로, '땅의 기초를 놓다'로 창조의 토대 이미지를 살렸습니다.
- source_word: טִפְּחָה שָׁמַיִם
  english_pob_choice: spread out the heavens
  chosen_korean: 하늘을 펴 놓았습니다
  alternatives_korean:
  - 하늘을 펼치셨습니다
  - 하늘을 넓게 펴셨습니다
  - 하늘을 펼쳐 놓았습니다
  lexicon: HALOT
  rationale: טפח은 하늘을 넓게 펴거나 펼치는 동작을 나타내므로, 창조적 확장 이미지를 직관적으로 드러내는 '펴 놓았습니다'를 선택했습니다.
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם יַעַמְדוּ יַחְדָּו
  english_pob_choice: when I call to them, they stand together
  chosen_korean: 내가 그들을 부르면, 그들은 함께 서 있습니다
  alternatives_korean:
  - 내가 그들을 부를 때, 그들은 함께 섭니다
  - 내가 그들을 부르면, 그들은 한꺼번에 섭니다
  - 내가 그들을 부르면, 그들은 함께 나섭니다
  lexicon: HALOT
  rationale: 분사형 '내가 부르다'와 결과 동작 '그들이 서다'의 관계를 자연스럽게 풀어, 부름에 즉시 응하는 창조 질서의 이미지를 살렸습니다.
theological_decisions:
- issue: 하나님의 신체적 표현을 추상화할지 여부
  chosen_reading: '''내 손''과 ''내 오른손''을 그대로 유지해 하나님의 창조 행위에 대한 구체적 의인법을 보존했습니다.'
  alternative_readings:
  - 내 능력이 땅의 기초를 놓았고, 내 권능이 하늘을 펴 놓았습니다
  rationale: 히브리어 본문은 신체적 이미지를 의도적으로 사용하므로, 이를 추상적 힘 언어로 바꾸지 않고 원문의 긴장과 생동감을 유지했습니다.
  doctrine_reference: '번역 원칙: 원어 우선 및 의인법 보존'
