id: ISA.48.10
reference: Isaiah 48:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
  footnotes:
  - marker: a
    text: Or, 'I have chosen you in the furnace of affliction.' The Hebrew verb can also be understood in its more usual sense, 'choose.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'not with/as silver'; the Hebrew phrase is difficult, likely meaning that this refining was not like the refining of silver.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 당신을 정련하였으나 은처럼 한 것은 아닙니다[b]. 내가 당신을 고난의 풀무에서 택하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내가 당신을 고난의 풀무에서 택하였습니다.” 히브리어 동사는 더 흔한 뜻으로는 “택하다”로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “은으로/과 함께가 아니라”입니다. 히브리어 구절은 난해하며, 대체로 이 정련이 은을 정련하는 방식과 같지 않다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언서의 주의를 환기하는 감탄사로서, 현대 한국어에서는 ‘보십시오’가 합쇼체의 직접적인 주목 요청을 가장 자연스럽게 살립니다.
- source_word: צְרַפְתִּיךָ
  english_pob_choice: I have refined you
  chosen_korean: 내가 당신을 정련하였으나
  alternatives_korean:
  - 내가 당신을 단련하였으나
  - 내가 당신을 제련하였으나
  lexicon: HALOT
  rationale: 금속 제련의 이미지를 살리기 위해 ‘정련하다’를 택했습니다. ‘단련하다’보다 원문 은유에 가깝고, ‘제련하다’보다 한국어 문맥에서 조금 더 자연스럽습니다.
- source_word: בְכָסֶף
  english_pob_choice: but not as silver
  chosen_korean: 은처럼 한 것은 아닙니다
  alternatives_korean:
  - 은으로 한 것은 아닙니다
  - 은과 같은 방식으로 한 것은 아닙니다
  lexicon: HALOT
  rationale: 전치사 ב의 난해함을 반영해, 단순한 재료 표지가 아니라 정련의 방식 비교라는 의미를 살려 ‘은처럼’으로 옮겼습니다.
- source_word: בְּחַרְתִּיךָ
  english_pob_choice: I have chosen you
  chosen_korean: 내가 당신을 택하였습니다
  alternatives_korean:
  - 내가 당신을 선택하였습니다
  - 내가 당신을 시험하였습니다
  lexicon: HALOT
  rationale: 문자형과 최신 POB 회귀판이 보여 주는 기본 의미를 따라 ‘택하다’로 옮겼습니다. 금속 정련 이미지와 병행되지만, 어휘상 ‘선택하다’보다 성경적 어감이 분명합니다.
- source_word: בְּכוּר עֹנִי
  english_pob_choice: in the furnace of affliction
  chosen_korean: 고난의 풀무에서
  alternatives_korean:
  - 고통의 풀무에서
  - 환난의 풀무에서
  - 고난의 용광로에서
  lexicon: HALOT
  rationale: כּוּר는 제련용 풀무/화로를 가리키므로 ‘풀무’가 원문의 금속 제련 배경을 잘 보존합니다. עֹנִי는 넓게 ‘고난’으로 옮겨 문맥의 고통과 환난을 포괄했습니다.
theological_decisions:
- issue: בְּחַרְתִּיךָ의 번역을 '시험하다'로 완화할지 여부
  chosen_reading: 원문과 POB 최신 회귀판에 따라 '택하다'로 유지했습니다.
  alternative_readings:
  - 시험하다
  - 증명하다
  rationale: 문맥이 정련 비유를 사용하지만, 동사의 기본 의미를 지우지 않고 원문이 가진 선택/택함의 긴장을 그대로 남기는 편이 더 소스 충실적입니다.
  doctrine_reference: 'translation philosophy: preserve lexical tension rather than resolve it.'
