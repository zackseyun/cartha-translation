id: ISA.48.9
reference: Isaiah 48:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I lengthen my nose,' an idiom meaning 'I delay my anger' or 'I am slow to anger.'
    reason: cultural_note
  - marker: b
    text: Or 'I hold it back'; the Hebrew verb can evoke the image of muzzling or bridling.
    reason: lexical_alternative
  - marker: c
    text: Or 'destroy you' or 'wipe you out'; Hebrew 'cut you off' preserves the more literal covenantal/judicial wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 이름을 위하여 나는 노하기를 더디 하겠습니다.[a] 내 찬양을 위하여 나는 너를 향한 분노를 억제하여,[b] 너를 끊어 버리지 않겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 코를 길게 한다’는 표현으로, ‘내 분노를 늦춘다’ 또는 ‘노하기를 더디한다’는 뜻의 관용어입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그것을 붙들어 둔다’; 히브리어 동사는 재갈을 물리거나 굴레를 씌우는 이미지를 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너를 멸하다’ 또는 ‘너를 쓸어버리다’; ‘너를 끊어 버리다’는 히브리어의 보다 직역적인 언약적·법적 표현을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: For the sake of
  chosen_korean: ~때문에 / ~를 위해
  alternatives_korean:
  - ~을 위하여
  - ~을 위해서
  - ~ 때문에
  lexicon: HALOT
  rationale: 목적·동기의 힘을 살리되, 한국어에서는 ‘내 이름 때문에’와 ‘내 찬양 때문에’처럼 자연스럽게 풀어야 하므로 직접적인 이유 표지로 옮겼습니다.
- source_word: שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 명성
  - 내 평판
  - 내 명칭
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’이 단순 호칭이 아니라 하나님의 드러난 성품과 명예를 가리키므로, 본문의 직설적 표현을 유지했습니다.
- source_word: אַאֲרִיךְ אַפִּי
  english_pob_choice: I delay my anger
  chosen_korean: 내가 내 분노를 오래 참으며
  alternatives_korean:
  - 내 분노를 늦추며
  - 내 진노를 지연하며
  - 나는 노하기를 더디하며
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘코/콧구멍을 길게 하다’를 한국어로 그대로 옮기기보다, 현재형 서술과 능동적 자제의 뉘앙스를 살려 ‘오래 참다’로 풀었습니다. 다만 ‘delay’의 시간적 지연과 ‘anger’를 명시하는 점은 유지했습니다.
- source_word: אֶחֱטָם
  english_pob_choice: I restrain it
  chosen_korean: 내가 그것을 … 억제하여
  alternatives_korean:
  - 내가 그것을 막아
  - 내가 그것을 억누르며
  - 내가 그것을 재갈 물려
  lexicon: HALOT
  rationale: 동사의 억제·재갈 물림의 감각을 살리되, 한국어 본문에서는 거칠지 않게 ‘억제하다’로 옮겼습니다. 동사 목적어는 앞절의 분노를 받아 ‘그것’으로 처리했습니다.
- source_word: הַכְרִיתֶךָ
  english_pob_choice: cut you off
  chosen_korean: 너를 끊어 버리지 않게 합니다
  alternatives_korean:
  - 너를 멸하지 않게 합니다
  - 너를 없애지 않게 합니다
  - 너를 제거하지 않게 합니다
  lexicon: HALOT
  rationale: ‘끊어 버리다’는 כרת의 언약적·법적 뉘앙스를 비교적 잘 보존하면서도 현대 한국어에서 자연스럽습니다. 단순한 ‘멸하다’보다 본문의 더 구체적인 표상을 살렸습니다.
theological_decisions:
- issue: 하나님이 분노를 참으시는 동기와 목적
  chosen_reading: 하나님은 자신의 이름과 찬양을 위해 분노를 억제하시며, 이스라엘의 보존은 그 결과로 제시됩니다.
  alternative_readings:
  - 하나님이 주로 이스라엘의 유익을 위해 참으신다
  - ‘찬양’을 ‘영광’이나 ‘명성’으로 본문에서 풀어 쓴다
  rationale: 본문은 하나님의 자기 이름과 찬양을 분명한 동기로 제시하므로, 이를 인간 쪽 이익 중심으로 바꾸지 않았습니다. 동시에 ‘찬양’이라는 명사를 유지해 신학적 추상화로 바꾸지 않았습니다.
  doctrine_reference: Isa 48:9의 언약적 자기-변호와 하나님의 이름의 영광
