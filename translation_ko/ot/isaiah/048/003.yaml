  - 갑자기 내가 실행하자
  lexicon: HALOT
  rationale: עָשִׂיתִי의 기본 의미를 지나치게 해석하지 않으면서도, 문맥상 선언된 일이 실제로 이루어지는 전환을 자연스럽게 나타냅니다.
theological_decisions:
- issue: 예언과 성취에서 하나님의 주도적 행위
  chosen_reading: 하나님이 먼저 말씀하신 뒤 실제로 그 일을 이루시는 흐름이 드러나도록, '들리게 하였습니다'와 '행하자'를 통해 선언과 성취의 연결을 보존했습니다.
  alternative_readings:
  - 단순한 예고와 발생의 순서로만 옮길 수 있습니다.
  - '''내가 행했다''로 더 직설적으로 옮길 수도 있습니다.'
  rationale: 본문은 선언과 성취를 함께 제시하며, 번역은 그 관계를 약화시키지 않되 문자 이상의 결정론을 덧붙이지 않아야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
