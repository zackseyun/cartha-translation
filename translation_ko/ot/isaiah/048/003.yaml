source:
  edition: WLC
  text: הָ/רִֽאשֹׁנוֹת֙ מֵ/אָ֣ז הִגַּ֔דְתִּי וּ/מִ/פִּ֥/י יָצְא֖וּ וְ/אַשְׁמִיעֵ֑/ם פִּתְאֹ֥ם עָשִׂ֖יתִי וַ/תָּבֹֽאנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
  footnotes:
  - marker: a
    text: 'Or ''I proclaimed them'' for ''I made them heard.'' The Hebrew verb is causative: ''I caused them to be heard.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'I did it' for 'I acted.' The Hebrew verb is the common verb 'do/make,' here in a context of God bringing declared events about.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이전 일들을 오래전에 알렸고, 그것들은 내 입에서 나왔으며, 내가 그것들을 듣게 하였습니다[a]. 내가 갑자기 행하였고[b], 그것들이 이루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그것들을 선포하였다’. 히브리어 동사는 사역형으로, ‘내가 그것들을 듣게 하였다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그것을 하였다’. 히브리어 동사는 흔한 ‘하다/만들다’이지만, 여기서는 하나님이 선포하신 일이 실제로 이루어지는 문맥입니다.
    reason: lexical_alternative
lexical_decisions:
