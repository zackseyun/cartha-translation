  - severity: medium
    issue: ‘그것이 더럽혀질 수 있겠습니까?’의 무지시적 대명사
    rationale: 한국어 ‘그것’은 통상 선행사를 요구합니다. 히브리어가 더럽혀지는 대상을 명시하지 않는 점은 한국어에서도 주어를 생략하여 더 자연스럽게 보존할 수 있습니다.
  - severity: medium
