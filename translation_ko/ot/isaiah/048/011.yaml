id: ISA.48.11
reference: Isaiah 48:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַעֲנִ֧/י לְמַעֲנִ֛/י אֶעֱשֶׂ֖ה כִּ֣י אֵ֣יךְ יֵחָ֑ל וּ/כְבוֹדִ֖/י לְ/אַחֵ֥ר לֹֽא אֶתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
  footnotes:
  - marker: a
    text: Or, 'for how should my name be profaned?' The Hebrew leaves the object implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 나 자신을 위해, 내가 나 자신을 위해 행하겠습니다. 어떻게 그것이 더럽혀질 수 있겠습니까? 내 영광을 다른 이에게 주지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떻게 내 이름이 더럽혀질 수 있겠습니까?’ 히브리어는 객체를 생략합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  english_pob_choice: for my own sake
  chosen_korean: 내가 나 자신을 위해
  alternatives_korean:
  - 내 자신을 위해
  - 나를 위해
  lexicon: HALOT
  rationale: 반복된 לְמַעֲנִי의 강조를 한국어에서 자연스럽게 살리기 위해 1인칭 재귀를 분명히 드러냈습니다.
- source_word: אֶעֱשֶׂה
  english_pob_choice: I will act
  chosen_korean: 행하겠습니다
  alternatives_korean:
  - 하겠습니다
  - 행동하겠습니다
  lexicon: HALOT
  rationale: 직접 목적어가 없는 עשה를 단순한 ‘하다’보다 결단과 개입을 담는 ‘행하다’로 옮겨, 하나님의 주도적 조치를 드러냈습니다.
- source_word: יֵחָל
  english_pob_choice: it be profaned
  chosen_korean: 더럽혀질 수 있겠습니까
  alternatives_korean:
  - 모독될 수 있겠습니까
  - 속되게 될 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어가 주어를 생략한 수동형을 쓰므로, 주어를 덧붙이지 않고 부정적 수사의문문으로 처리해 모욕/모독의 의미를 유지했습니다.
- source_word: וּכְבוֹדִי
  english_pob_choice: And my glory
  chosen_korean: 내 영광을
  alternatives_korean:
  - 내 영예를
  - 내 존귀를
  lexicon: HALOT
  rationale: כָּבוֹד의 신학적·문맥적 중심 의미인 ‘영광’을 유지해, 야훼의 자기선언과 평행을 이루게 했습니다.
theological_decisions:
- issue: Implicit object in the rhetorical question
  chosen_reading: 본문에서는 객체를 보충하지 않고 ‘그것이 더럽혀질 수 있겠습니까?’로 유지했습니다.
  alternative_readings:
  - 내 이름이 더럽혀질 수 있겠습니까?
  - 내가 더럽혀질 수 있겠습니까?
  rationale: 히브리어는 객체를 생략해 의도적 긴장을 남기므로, 본문에서는 그 모호성을 보존하고, 이름을 명시하는 해석은 주석 없이 본문에 넣지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
