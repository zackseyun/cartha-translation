source:
  edition: WLC
  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
  footnotes:
  - marker: a
    text: 'Or, following another punctuation: “A voice cries in the wilderness, ‘Prepare the way of the LORD; make straight in the desert a highway for our God.’”'
    reason: alternative_reading
translation:
  language: ko
  text: “광야에서 외치는 소리입니다. 야훼의 길을 준비하십시오. 사막에서 우리 하나님을 위해 대로를 곧게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 다른 구두법에 따라: “광야에서 외치는 소리입니다. ‘야훼의 길을 준비하고, 사막에서 우리 하나님을 위해 대로를 곧게 하십시오.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וֹל קוֹרֵ֔א
  english_pob_choice: A voice cries
  chosen_korean: “... 외치는 소리입니다”
  alternatives_korean:
  - “한 음성이 외칩니다”
  - “소리가 외칩니다”
  lexicon: HALOT
  rationale: קול과 קורא의 조합은 예언적 선포의 도입부로 자연스럽게 ‘외치는 소리’로 옮길 수 있으며, 한국어에서는 서술문 종결을 써서 생동감 있는 선언을 살렸습니다.
- source_word: פַּנּ֖וּ דֶּ֣רֶךְ
  english_pob_choice: prepare the way
  chosen_korean: “길을 준비하십시오”
  alternatives_korean:
  - “길을 닦으십시오”
  - “길을 예비하십시오”
  lexicon: HALOT
  rationale: פנה의 명령형은 길을 비우고 마련하라는 뜻이므로, ‘준비하다’가 현대 한국어에서 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: יְהוָ֑ה
  english_pob_choice: Yahweh
  chosen_korean: “야훼”
  alternatives_korean:
  - “여호와”
  - “주님”
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 관습적 대체어가 아니라 본문에 있는 이름 자체를 살려 ‘야훼’로 옮기는 것이 원문 직접성을 가장 잘 보존합니다.
- source_word: יַשְּׁרוּ֙
  english_pob_choice: make straight
  chosen_korean: “곧게 하십시오”
  alternatives_korean:
  - “평평하게 하십시오”
  - “곧추 세우십시오”
  lexicon: HALOT
  rationale: ישר의 기본 의미는 ‘곧게 하다’이므로, 평탄화된 도로의 이미지를 과도하게 해석하지 않고 직선화의 뜻을 유지했습니다.
- source_word: מְסִלָּ֖ה
  english_pob_choice: a highway
  chosen_korean: “대로”
  alternatives_korean:
  - “큰길”
  - “고속도로”
  lexicon: HALOT
  rationale: מְסִלָּה는 단순한 길보다 왕의 행차를 위한 정비된 도로를 가리키므로, 현대 한국어에서는 ‘대로’가 그 위엄과 구축된 도로의 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: בַּמִּדְבָּר의 구문 결합
  chosen_reading: ‘광야에서’는 뒤의 명령인 ‘야훼의 길을 준비하십시오’에 붙였습니다.
  alternative_readings:
  - '‘외치는 소리입니다: 광야에서 준비하십시오’로 화자를 꾸밀 수도 있습니다.'
  rationale: 히브리어 악센트와 원문 구문은 במדבר을 명령문과 연결하는 읽기를 더 잘 지지하므로, 본문에서는 그 읽기를 따르되 역사적 대안은 제거하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
