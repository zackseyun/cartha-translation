id: ISA.40.26
reference: Isaiah 40:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
  footnotes:
  - marker: a
    text: Or 'he calls each of them by name.'
    reason: lexical_alternative
  - marker: b
    text: '''Their host'' refers to the ordered multitude of the heavenly bodies.'
    reason: cultural_note
  - marker: c
    text: Literally, 'not a man is lacking,' a Hebrew distributive expression meaning that none of them is missing.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈을 높이 들어 보십시오. 누가 이들을 창조하였습니까? 그분은 그들의 군대를 수효대로 이끌어 내시고, 그들 모두를 이름으로 부르십니다. 그의 위대하신 힘과 강한 권능 때문에 하나도 빠지는 것이 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수효대로’는 질서 있는 계수의 의미를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘군대’는 여기서 전투 집단이 아니라 질서 있게 배열된 하늘의 무리를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘하나도 빠지지 않는다’는 분배적 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  english_pob_choice: Lift up your eyes on high
  chosen_korean: 눈을 높이 들어 보십시오
  alternatives_korean:
  - 눈을 높이 들어 보세요
  - 눈을 들어 높은 곳을 보십시오
  lexicon: HALOT
  rationale: 히브리어의 명령형 복수와 ‘높이/위로’의 공간 감각을 살리면서, 한국어에서는 자연스러운 공손 명령으로 옮겼습니다.
- source_word: מִי בָרָא אֵלֶּה
  english_pob_choice: who created these?
  chosen_korean: 누가 이들을 창조하였습니까?
  alternatives_korean:
  - 누가 이들을 지으셨습니까?
  - 누가 이것들을 창조하였습니까?
  lexicon: HALOT
  rationale: 창조 행위를 분명히 드러내기 위해 ‘창조하다’를 택했고, 수사 의문문 구조를 그대로 유지했습니다.
- source_word: הַמּוֹצִיא בְמִסְפָּר צְבָאָם לְכֻלָּם בְּשֵׁם יִקְרָא
  english_pob_choice: He who brings out their host by number, calling all of them by name
  chosen_korean: 그분은 그들의 군대를 수효대로 이끌어 내시고, 그들 모두를 이름으로 부르십니다
  alternatives_korean:
  - 그분은 그들의 군대를 수대로 불러내시고, 그들 모두를 이름으로 부르십니다
  - 그분은 그들의 군대를 수효대로 내어 보내시고, 그들 모두를 이름으로 부르십니다
  lexicon: HALOT
  rationale: ‘הַמּוֹצִיא’의 분사적 성격을 ‘이끌어 내시고’로 살려 연결했고, ‘בְּמִסְפָּר’은 단순한 수량보다 질서 있는 계수를 보여 주는 ‘수효대로’로 옮겼습니다.
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  english_pob_choice: Because of the greatness of his might and the strength of his power
  chosen_korean: 그의 위대하신 힘과 강한 권능 때문에
  alternatives_korean:
  - 그의 큰 힘과 강한 능력 때문에
  - 그의 위대한 힘과 강한 권능 때문에
  lexicon: HALOT
  rationale: 두 개의 강도 표현을 한국어에서도 중첩된 강조로 살렸고, ‘권능’은 ‘כֹּחַ’의 힘의 뉘앙스를 공적인 문맥에서 자연스럽게 담습니다.
- source_word: אִישׁ לֹא נֶעְדָּר
  english_pob_choice: not one is missing
  chosen_korean: 하나도 빠지는 것이 없습니다
  alternatives_korean:
  - 한 사람도 빠지지 않습니다
  - 빠지는 자가 하나도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 한국어 관용으로 풀어, 천체 군집에서 하나도 빠짐이 없다는 뜻을 자연스럽게 전달했습니다.
theological_decisions:
- issue: ‘their host’의 대상
  chosen_reading: 천체들, 곧 질서 있게 배열된 하늘의 군대로 이해하고 번역했습니다.
  alternative_readings:
  - 별들의 무리
  - 하늘의 모든 것
  rationale: 문맥상 눈을 들어 하늘을 보라는 초점과 ‘수효대로’ ‘이름으로 부르다’의 표현이 천체 군집을 가리키므로, 본문에는 ‘군대’를 두되 별을 직접 삽입하지는 않았습니다.
  doctrine_reference: DOCTRINE.md §Source primacy and contextual rendering
- issue: ‘בְמִסְפָּר’과 ‘이름으로 부르다’의 결합
  chosen_reading: 하나님이 각 존재를 질서 있게 세고 이름까지 아신다는 주권과 섭리의 의미를 살렸습니다.
  alternative_readings:
  - 단지 수를 세신다는 의미
  - 상징적 표현으로만 처리
  rationale: 본문은 단순 계수보다 창조주로서의 통치와 식별을 강조하므로, 계수와 명명 행위를 함께 드러내는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md §Divine sovereignty and naming
