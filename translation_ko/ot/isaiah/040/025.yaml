translation:
  language: ko
  text: 그러면 너희가 나를 누구에게 비기겠느냐? 내가 누구와 같겠느냐? 거룩하신 분께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러면 너희가 나를 누구와 견주겠느냐? 내가 누구와 같겠느냐?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל מִי
  english_pob_choice: To whom then
  chosen_korean: 내게 비길 자가 누구겠느냐?
  alternatives_korean:
  - 그러면 누구에게
  - 그렇다면 누구와
  lexicon: HALOT
  rationale: אֶַל + מִי의 수사적 질문을 한국어 자연어로 옮기되, 비교 대상의 부재를 분명히 드러내기 위해 ‘비길 자’ 구성을 택했습니다.
- source_word: תְדַמְּיוּנִי
  english_pob_choice: will you compare me
  chosen_korean: 내게 비길 자
  alternatives_korean:
  - 나를 비교할 자
  - 나를 견줄 자
  lexicon: HALOT
  rationale: דמה의 ‘비교하다/견주다’ 의미를 살려 동작보다 비교 행위의 대상을 강조했습니다.
- source_word: וְאֶשְׁוֶה
  english_pob_choice: that I should be equal
  chosen_korean: 내가 누구와 같을 수 있겠느냐
  alternatives_korean:
  - 내가 누구와 동등할 수 있겠느냐
  - 내가 누구와 같아지겠느냐
  lexicon: HALOT
  rationale: שוה의 평행구를 결과 상태로 풀어, 원문의 ‘나와 동등해질 수 있음’이라는 불가능성을 한국어 수사 의문으로 옮겼습니다.
- source_word: קָדוֹשׁ
  english_pob_choice: the Holy One
  chosen_korean: 거룩하신 분
  alternatives_korean:
  - 거룩하신 이
  - 거룩한 분
  lexicon: HALOT
  rationale: 본문이 ‘거룩하신 이스라엘의 거룩한 분’이 아니라 단순히 ‘거룩하신 분’이라고 부르므로, 제목의 짧은 형식을 보존했습니다.
theological_decisions:
- issue: 하나님의 비견 불가능성과 자기계시
  chosen_reading: 이 구절을 하나님의 독특성과 비교 불가능성을 드러내는 수사적 질문으로 유지했습니다.
  alternative_readings:
  - ‘누가 나를 비교하겠느냐’로 단순화
  - ‘이스라엘의 거룩하신 분’으로 확장
  rationale: 원문은 비교의 불가능성을 선언하며, 제목을 확장하지 않고 긴장을 그대로 보존하는 것이 स्रोत 충실성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
