  source_fidelity: 첫 절구는 כָּל הַגּוֹיִם כְּאַיִן נֶגְדּוֹ를 충실히 반영합니다. 그러나 제2절구의 ‘없거나 공허한 것보다도 더 못한 것’은 히브리어의 병렬 표현 מֵאֶפֶס וָתֹהוּ를 ‘없거나 공허한 것보다’라는 비교 대상으로 재구성하여 의미 관계가 불분명해집니다. ‘무보다도 못한 것과 공허한 것’으로 병렬을 드러내는 편이 안전합니다. 또한 לוֹ의 평가 관점을 ‘그에게는’으로 보존하는 것이 좋습니다.
  naturalness: ‘없거나 공허한 것보다도 더 못한 것으로’는 현대 한국어에서 비교의 범위와 수식 관계가 어색합니다. ‘그에게는 무보다도 못한 것과 공허한 것으로 여겨집니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 수사적 누적도 유지합니다.
