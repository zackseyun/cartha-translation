language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הַ/גּוֹיִ֖ם כְּ/אַ֣יִן נֶגְדּ֑/וֹ מֵ/אֶ֥פֶס וָ/תֹ֖הוּ נֶחְשְׁבוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
  footnotes:
  - marker: a
    text: Or 'are counted by him as less than nothing and chaos/emptiness.' The Hebrew תֹהוּ can also carry the sense of 'wasteness' or 'chaos.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 나라들이 그의 앞에서는 아무것도 아니며, 그는 그것들을 없거나 공허한 것보다도 더 못한 것으로 여기십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 그것들을 무보다도 더 못한 것과 혼돈/공허로 셈하십니다.’ 히브리어 תֹהוּ는 ‘황무함’이나 ‘혼돈’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: All the nations
  chosen_korean: 모든 나라들
  alternatives_korean:
  - 모든 민족들
  - 모든 열방
  lexicon: HALOT
  rationale: גּוֹיִם은 이사야 문맥에서 열국 전체를 가리키므로, 현대 한국어에서 자연스러운 복수 표현인 ‘모든 나라들’로 옮겼습니다.
- source_word: כְּאַיִן נֶגְדּוֹ
  english_pob_choice: as nothing before him
  chosen_korean: 그의 앞에서는 아무것도 아니며
  alternatives_korean:
  - 그 앞에서 아무것도 아니며
  - 그와 비교하면 아무것도 아니며
  lexicon: HALOT
  rationale: כְּאַיִן의 비교와 נֶגֶד의 ‘앞에/대하여’라는 힘을 함께 살려, 하나님 앞에서의 절대적 무가치함을 간결하게 표현했습니다.
- source_word: מֵאֶפֶס וָתֹהוּ
  english_pob_choice: less than nothing and emptiness
  chosen_korean: 없거나 공허한 것보다도 더 못한 것으로
  alternatives_korean:
  - 무보다도 더 못한 것으로
  - 무와 공허보다도 더 못한 것으로
  lexicon: HALOT
  rationale: אֶפֶס와 תֹהוּ의 누적된 무(無)·공허의 강조를 한국어에서 ‘없다/공허하다’의 중첩으로 옮겨, 단순한 ‘무’보다 강한 수사적 격하를 드러냈습니다.
- source_word: נֶחְשְׁבוּ לוֹ
  english_pob_choice: are regarded by him
  chosen_korean: 그는 그것들을 ... 여기십니다
  alternatives_korean:
  - 그는 그것들을 ... 셈하십니다
  - 그는 그것들을 ... 간주하십니다
  lexicon: HALOT
  rationale: נחשב의 ‘헤아리다/여기다’를 살려 평가 주체가 하나님이심을 분명히 하되, 현대 문체에 맞게 능동적 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제2절구의 무(無)·공허 표현의 강도
  chosen_reading: ‘없거나 공허한 것보다도 더 못한 것으로’라고 옮겨, ‘less than nothing and emptiness’의 누적적 과장을 유지했습니다.
  alternative_readings:
  - ‘무보다도 더 못한 것과 공허함으로’
  - ‘무와 공허보다도 더 못한 것으로’
  rationale: 본문은 단순한 비유가 아니라 열방의 절대적 미미함을 극대화하는 수사이므로, 과장을 약화하지 않는 방향으로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
