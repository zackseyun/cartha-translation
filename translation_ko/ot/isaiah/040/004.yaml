id: ISA.40.4
reference: Isaiah 40:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
  footnotes:
  - marker: a
    text: Or 'the crooked place' for 'the uneven ground'; the Hebrew term can denote what is crooked or uneven.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rough places' for 'the ridges'; the Hebrew noun is rare and may refer more generally to rugged terrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 골짜기는 높아지고, 모든 산과 언덕은 낮아지며, 굽은 곳은 평지가 되고, 험한 곳은 평원이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굽은 곳’은 히브리어가 ‘구부러진/비뚤어진 곳’ 또는 ‘울퉁불퉁한 지형’을 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘험한 곳’은 희귀한 히브리어 명사가 더 넓게는 거칠고 울퉁불퉁한 지형을 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גֶּיא
  english_pob_choice: Every valley
  chosen_korean: 모든 골짜기
  alternatives_korean:
  - 모든 계곡
  - 모든 골짜기마다
  lexicon: WLC / HALOT
  rationale: גֶּיא는 넓게는 골짜기·계곡을 뜻하므로, 현대 한국어에서 자연스럽고 지형 이미지가 분명한 ‘골짜기’를 택했습니다.
- source_word: יִנָּשֵׂא
  english_pob_choice: will be lifted up
  chosen_korean: 높아지고
  alternatives_korean:
  - 들려올라가고
  - 올려지고
  lexicon: WLC / HALOT
  rationale: נשא의 수동/재귀적 의미를 한국어에서 가장 자연스럽게 살리면서, 지형이 솟아오르는 장면을 간결하게 표현했습니다.
- source_word: הֶעָקֹב / הָרְכָסִים
  english_pob_choice: the uneven ground / the ridges
  chosen_korean: 굽은 곳 / 험한 곳
  alternatives_korean:
  - 울퉁불퉁한 땅 / 거친 곳
  - 굽은 땅 / 산등성이
  lexicon: WLC / HALOT
  rationale: 첫 표현은 עקב의 ‘굽음·비틀림’을 살려 ‘굽은 곳’으로, 둘째는 희귀한 רכסים의 거칠고 울퉁불퉁한 지형감을 살려 ‘험한 곳’으로 옮겼습니다.
- source_word: לְמִישׁוֹר / לְבִקְעָה
  english_pob_choice: level / a plain
  chosen_korean: 평지 / 평원
  alternatives_korean:
  - 평평한 곳 / 넓은 골짜기
  - 평지 / 넓은 들
  lexicon: WLC / HALOT
  rationale: 미쇼르는 ‘평평한 땅’, 비크아는 ‘넓은 골짜기/평원’의 뜻이므로, 평행 구조를 살려 ‘평지’와 ‘평원’으로 구분해 번역했습니다.
theological_decisions:
- issue: 지형 이미지의 해석 범위
  chosen_reading: 본문의 직접 이미지는 실제 지형의 변형으로 유지하고, 상징적 낮춤과 높임의 해석은 본문 밖에서 읽히도록 두었습니다.
  alternative_readings:
  - 교만한 자의 낮아짐과 낮은 자의 높아짐이라는 비유
  - 여호와의 오심을 위한 종말론적 준비
  rationale: 히브리어는 먼저 길을 예비하는 장면으로서 구체적인 지형어를 사용하므로, 번역 본문에는 그 물리적 이미지를 보존하는 것이 소스에 가장 충실합니다.
  doctrine_reference: 번역 원칙 1, 3
- issue: 완료상/미래상 표현
  chosen_reading: ‘될 것입니다’로 미래적 결과를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘됩니다’
  - ‘될지니’
  rationale: 예언적 진술의 전망성을 살리되, 현대 한국어 합쇼체의 출판 문체에 맞추기 위해 미래형을 사용했습니다.
  doctrine_reference: 현대 한국어 성경 문체
