id: ISA.40.6
reference: Isaiah 40:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
  footnotes:
  - marker: a
    text: 'Or, following another traditional reading: “And one said” or “And he said.”'
    reason: alternative_reading
  - marker: b
    text: “All flesh” is a literal expression for all humanity or all people.
    reason: lexical_alternative
  - marker: c
    text: Or “all its glory.” The Hebrew word can denote what is lovely, splendid, or admirable here.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 음성이 말합니다[a], “외쳐라!” 내가 말했습니다. “내가 무엇을 외치리이까?” 모든 육체는 풀이며[b], 그 모든 아름다움은 들의 꽃과 같습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 전통적 읽기: “그리고 한 사람이 말했습니다” 또는 “그리고 그가 말했습니다.”'
    reason: alternative_reading
  - marker: b
    text: ‘모든 육체’는 모든 인간 또는 모든 사람을 가리키는 문자적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그 모든 영광”. 이 히브리어 단어는 여기서 아름답거나 빛나거나 감탄할 만한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  english_pob_choice: A voice says
  chosen_korean: 한 음성이 말합니다
  alternatives_korean:
  - 음성이 말합니다
  - 한 목소리가 말합니다
  lexicon: HALOT
  rationale: קוֹל은 여기서 정체가 특정되지 않은 발화의 주체를 가리키므로, 자연스러운 한국어로는 ‘한 음성’이 적절합니다. 현재형 ‘말합니다’는 히브리어 분사의 생동감을 살립니다.
- source_word: קְרָא
  english_pob_choice: Cry out
  chosen_korean: 외쳐라
  alternatives_korean:
  - 외치십시오
  - 선포하라
  lexicon: HALOT
  rationale: קרא는 ‘부르다/외치다/선포하다’의 범위를 가지지만, 여기서는 예언적 외침의 직접성과 급박함이 중요하므로 ‘외쳐라’로 옮겼습니다.
- source_word: כָּל הַבָּשָׂר
  english_pob_choice: All flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 인간
  lexicon: HALOT
  rationale: ‘육체’는 문자적 표현을 유지하면서도, 히브리어의 인간 전체를 가리키는 총칭적 의미를 한국어에서 비교적 가깝게 보존합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: its loveliness
  chosen_korean: 그 모든 아름다움
  alternatives_korean:
  - 그 모든 영광
  - 그 모든 사랑스러움
  lexicon: HALOT
  rationale: 여기서 חסד는 언약적 ‘인애’보다 인간에게 있는 덧없지만 눈에 띄는 매력·아름다움의 뉘앙스가 강하므로, 본문 병행구와 맞게 ‘아름다움’으로 옮겼습니다.
- source_word: כְּצִיץ הַשָּׂדֶה
  english_pob_choice: like the flower of the field
  chosen_korean: 들의 꽃과 같습니다
  alternatives_korean:
  - 들의 꽃처럼
  - 밭의 꽃과 같습니다
  lexicon: HALOT
  rationale: ציץ는 꽃/피어남을 가리키며, ‘들의 꽃’은 시적 이미지와 덧없음을 간결하게 살립니다. ‘과 같습니다’는 히브리어 비교문을 자연스럽게 반영합니다.
theological_decisions:
- issue: וְאָמַר의 화자 식별
  chosen_reading: MT 점모음에 따라 화자를 1인칭으로 읽어 ‘내가 말했습니다’로 옮겼습니다.
  alternative_readings:
  - ‘그리고 그가 말했습니다’
  - ‘그리고 한 사람이 말했습니다’
  rationale: 본문 전승에는 1인칭과 3인칭의 읽기가 갈라지지만, 여기서는 마소라 점모음이 지지하는 1인칭을 본문에 두고, 대안 독법은 각주로 보존하여 해석상의 긴장을 지웠습니다.
  doctrine_reference: 원문 우선과 전승 변이를 함께 보존해야 한다는 POB 번역 원칙
- issue: חַסְדּוֹ의 의미 범위
  chosen_reading: 인간의 덧없는 ‘아름다움’으로 이해했습니다.
  alternative_readings:
  - ‘그 모든 인애’
  - ‘그 모든 영광’
  rationale: 이 절에서 ‘모든 육체’에 연결된 חסד는 언약적 용례보다 외형적·가치적 아름다움의 의미가 더 자연스럽습니다. 그래서 신학적 용어를 과잉 주입하지 않고 문맥의 대조를 살렸습니다.
  doctrine_reference: 문맥 우선의 의미 결정
