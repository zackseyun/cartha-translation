source:
  edition: WLC
  text: מִֽי מָדַ֨ד בְּ/שָׁעֳל֜/וֹ מַ֗יִם וְ/שָׁמַ֨יִם֙ בַּ/זֶּ֣רֶת תִּכֵּ֔ן וְ/כָ֥ל בַּ/שָּׁלִ֖שׁ עֲפַ֣ר הָ/אָ֑רֶץ וְ/שָׁקַ֤ל בַּ/פֶּ֨לֶס֙ הָרִ֔ים וּ/גְבָע֖וֹת בְּ/מֹאזְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
  footnotes:
  - marker: a
    text: Or 'measured the dust of the earth in a third-part measure.' The Hebrew term refers to an ancient unit or measuring vessel whose exact equivalent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'measured out' for 'marked off' the heavens.
    reason: lexical_alternative
  - marker: c
    text: Or 'with scales' for 'in balances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 자기 손바닥 안에[a] 물을 측량하였으며, 한 뼘으로 하늘을 재어 정하였으며, 한 측량 그릇에[b] 땅의 티끌을 담아 재었으며, 저울로 산들을 달았으며, 천칭으로[c] 언덕들을 달았습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손의 오목한 곳에’입니다. 손으로 물을 재는 신체적 측량 이미지를 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘샬리쉬’는 고대의 측량 단위 또는 측량 그릇을 가리키며, 정확한 등가는 불확실합니다. ‘세 번째 부분의 단위’로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 복수형이며, 저울 또는 천칭을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 과연
  lexicon: HALOT
  rationale: 수사적 질문의 힘을 살리면서도 한국어에서 가장 자연스러운 의문사로 옮겼습니다.
- source_word: בְּשָׁעֳלוֹ
  english_pob_choice: in the hollow of his hand
  chosen_korean: 자기 손바닥 안에
  alternatives_korean:
  - 자기 손의 오목한 곳에
  - 손바닥의 오목한 곳에
  lexicon: HALOT
  rationale: 손의 오목한 부분이라는 신체적 이미지를 유지하되, 한국어에서는 '손바닥 안'이 가장 자연스럽고 측량 도구의 비유도 잘 드러냅니다.
- source_word: בַּזֶּרֶת
  english_pob_choice: with a span
  chosen_korean: 한 뼘으로
  alternatives_korean:
  - 한 뼘으로써
  - 한 뼘짜리로
  lexicon: HALOT
  rationale: זֶרֶת은 손뼘/한 뼘의 고대 치수를 가리키므로, 현대 한국어에서 대응되는 짧은 길이 단위로 옮겼습니다.
- source_word: בַּשָּׁלִישׁ
  english_pob_choice: in a measure
  chosen_korean: 한 되로
  alternatives_korean:
  - 한 말로
  - 한 측량 그릇으로
  lexicon: HALOT
  rationale: 정확한 고대 단위는 불확실하므로, POB의 'in a measure' 취지를 따라 한국어에서도 일반 독자가 이해할 수 있는 측량 단위 표현을 택했습니다.
- source_word: בַּפֶּלֶס ... בְּמֹאזְנָיִם
  english_pob_choice: in scales ... in balances
  chosen_korean: 저울로 ... 저울대들로
  alternatives_korean:
  - 저울에 ... 저울에
  - 저울로 ... 천칭으로
  lexicon: HALOT
  rationale: 두 개의 서로 다른 계량 도구를 병렬로 살리기 위해, 첫째는 일반적인 '저울', 둘째는 양팔형 저울의 막대를 드러내는 '저울대들'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 창조를 인간 신체와 도구의 비유로 묘사하는 표현
  chosen_reading: 신체적·도구적 이미지를 그대로 살려, 하나님이 창조 세계를 완전히 헤아리고 다스리시는 분이라는 점을 드러냈습니다.
  alternative_readings:
  - 비유를 약화시켜 '정하셨다' 정도로 추상화하는 번역
  rationale: 본문은 의도적으로 손, 뼘, 저울, 저울대의 이미지를 겹쳐 하나님의 비범한 위엄을 강조하므로, 이를 완화하지 않는 것이 원문의 시의적 효과를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
