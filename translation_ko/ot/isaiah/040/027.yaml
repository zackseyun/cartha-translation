id: ISA.40.27
reference: Isaiah 40:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
  footnotes:
  - marker: a
    text: Or 'my right' or 'my cause.' The Hebrew mishpati can refer to one's justice, legal right, or case for vindication.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너희는 말합니까, 야곱아, 또 말합니까, 이스라엘아, 「내 길은 야훼께 숨겨졌고 내 의는 내 하나님께서 지나쳐 버리십니다」라고?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 권리’, ‘내 사안’. 히브리어 mishpati는 사람에게 주어진 정의, 법적 권리, 또는 변호할 사건을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 수사적 책망의 질문을 자연스럽게 살리면서, 선지자적 반문에 잘 어울리는 문어체를 택했습니다.
- source_word: תֹאמַר / וּתְדַבֵּר
  english_pob_choice: do you say / and speak
  chosen_korean: 말합니까 … 또 말합니까
  alternatives_korean:
  - 말합니다 … 또 말합니다
  - 말하십니까 … 또 말씀하십니까
  lexicon: HALOT
  rationale: אמר와 דבר의 병행을 한국어에서 두 번의 발화로 살리되, 단순 반복을 피하고 구어적 질문의 압박감을 유지했습니다.
- source_word: נִסְתְּרָה דַרְכִּי
  english_pob_choice: My way is hidden
  chosen_korean: 내 길은 … 숨겨졌고
  alternatives_korean:
  - 내 길은 … 가려졌고
  - 내 길은 … 감추어졌고
  lexicon: HALOT
  rationale: דרך를 ‘길’로 두어 삶의 형편과 행로의 비유를 보존하고, passive 의미를 ‘숨겨졌고’로 직역에 가깝게 옮겼습니다.
- source_word: מִשְׁפָּטִי יַעֲבוֹר
  english_pob_choice: my justice is disregarded
  chosen_korean: 내 의는 … 지나쳐 버리십니다
  alternatives_korean:
  - 내 정의는 … 무시하십니다
  - 내 권리는 … 지나쳐 버리십니다
  lexicon: HALOT
  rationale: משפט의 법정적·구제적 긴장을 살리기 위해 ‘의’를 택했고, יעבור의 ‘지나가다’ 이미지를 유지하면서도 한국어에서 ‘무시하다’로 평탄화하지 않도록 ‘지나쳐 버리십니다’로 옮겼습니다.
- source_word: מֵיְהוָה / מֵאֱלֹהַי
  english_pob_choice: from Yahweh / by my God
  chosen_korean: 야훼께 / 내 하나님께서
  alternatives_korean:
  - 여호와께 / 내 하나님께서
  - 주님께 / 내 하나님께서
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 원칙에 따라 ‘야훼’로 옮겼고, 병행구의 첫 절은 여격 조사로, 둘째 절은 행위 주체를 드러내는 주어형으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 테트라그람마톤을 직접 사용하므로, 프로젝트 기본값에 따라 언약 이름의 직접성을 살리는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: מִשְׁפָּטִי의 의미 긴장 보존
  chosen_reading: 내 의
  alternative_readings:
  - 내 권리
  - 내 사안
  - 내 소송
  rationale: 이 단어는 의, 법적 권리, 호소의 사건을 모두 가리킬 수 있으므로, 신학적 긴장을 줄이지 않기 위해 가장 포괄적인 ‘의’를 본문에 두고 다른 가능성은 주석으로 남겼습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms
