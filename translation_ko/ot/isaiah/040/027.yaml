review_pass:
  verdict: revise
  source_fidelity: 히브리어의 2인칭 단수 호소와 야곱/이스라엘의 병행 호칭은 유지해야 합니다. 초안의 ‘너희는’은 복수로 바꾸어 원문의 수를 벗어납니다. מִשְׁפָּטִי는 화자의 ‘의’ 자체라기보다 그에게 마땅한 권리·정당한 주장·송사를 뜻할 수 있으므로, 한국어 본문에서는 ‘내 권리’가 더 자연스럽고 의미 범위를 잘 보존합니다. יַעֲבוֹר의 ‘지나치다’ 비유도 유지했습니다.
  naturalness: ‘어찌하여 너희는 말합니까, … 또 말합니까’는 수의 불일치가 있고 반복도 한국어에서 부자연스럽습니다. ‘왜 … 말하고, … 말합니까’는 합쇼체의 현대적 문체로 두 병행 동사를 유지합니다. 인용문 속 발화는 이스라엘의 고백이므로 평서형으로 처리했습니다.
  terminology: יהוה는 프로젝트 원칙에 따라 ‘야훼’로 유지했습니다. ‘내 의’는 현대 한국어에서 개인의 도덕적 의로 쉽게 읽힐 수 있으므로 משפט의 법적·구제적 의미에 더 맞는 ‘내 권리’를 사용하고, ‘정의’와 ‘사안’은 각주에 보존했습니다. 각주의 mishpati는 히브리어 표기 מִשְׁפָּטִי로 바로잡았습니다.
  issues:
  - severity: medium
    issue: ‘너희는’이 히브리어 2인칭 단수를 복수로 변경합니다.
    rationale: תֹאמַר 및 תְדַבֵּר는 모두 2인칭 여성 단수이며, 야곱/이스라엘을 한 집단 인격으로 부르는 호칭과 맞습니다.
  - severity: medium
    issue: ‘내 의’는 מִשְׁפָּטִי의 이 문맥상 법적 권리·정당한 주장이라는 뜻을 충분히 전달하지 못할 수 있습니다.
    rationale: 한국어 ‘의’는 주로 의로움 또는 정의의 추상 개념으로 읽힙니다. ‘내 권리’는 본문의 호소와 משפט의 의미 범위를 더 자연스럽게 전달하며, 대안은 각주로 남길 수 있습니다.
  - severity: low
    issue: 각주의 ‘mishpati’와 ‘사람에게 주어진 정의’ 표현이 한국어 주석으로 부정확하거나 어색합니다.
    rationale: 히브리어 표기와 ‘정의, 법적 권리, 또는 정당한 주장/사안’이라는 설명이 더 정확하고 자연스럽습니다.
