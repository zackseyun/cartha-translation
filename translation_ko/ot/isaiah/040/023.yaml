base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/023.yaml
  text: who brings princes to nothing[b][a], and makes the judges of the earth like emptiness.
  footnotes:
  - marker: a
    text: Or 'like chaos,' 'like nothingness,' or 'as emptiness'; the Hebrew תֹהוּ denotes emptiness, wasteness, or unreality.
    reason: lexical_alternative
  - marker: b
    text: Or 'the judges of the land'; Hebrew אֶרֶץ can mean 'earth' or 'land,' but the broader context here favors the universal sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 통치자들을 무로 돌리시며, 땅[b]의 재판관들을 공허처럼[a] 만드십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼돈처럼’, ‘무처럼’, 또는 ‘공허로’; 히브리어 תֹהוּ는 공허, 황폐, 또는 실체 없음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세상의 재판관들’; 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있으나, 여기서는 더 넓은 보편적 의미가 문맥에 어울립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנּוֹתֵן
  english_pob_choice: who brings
  chosen_korean: 무로 돌리시며
  alternatives_korean:
  - 없음으로 만들며
  - 무로 만드시는 분이
  - 공허로 돌리시며
  lexicon: HALOT
  rationale: 분사형이 앞선 문맥의 하나님을 계속 묘사하므로, 단순한 정적 설명보다 ‘~로 돌리시며’가 행위의 결과와 시적 흐름을 잘 살립니다.
- source_word: רוֹזְנִים
  english_pob_choice: princes
  chosen_korean: 지도자들
  alternatives_korean:
  - 통치자들
  - 귀족들
  - 왕자들
  lexicon: HALOT
  rationale: רוֹזְנִים은 높은 지위의 권력자를 가리키므로, 현대 한국어에서 오해 없이 넓게 대응하는 ‘지도자들’을 선택했습니다.
- source_word: לְאָיִן
  english_pob_choice: to nothing
  chosen_korean: 무로
  alternatives_korean:
  - 아무것도 아닌 것으로
  - 없음으로
  - 제로로
  lexicon: HALOT
  rationale: אָיִן의 핵심은 존재의 부재이므로, 결과를 나타내는 ‘무로’가 축약적이면서도 원문의 무(無) 개념을 살립니다.
- source_word: כַּתֹּהוּ
  english_pob_choice: like emptiness
  chosen_korean: 공허처럼
  alternatives_korean:
  - 허무처럼
  - 텅 빈 것처럼
  - 무질서처럼
  lexicon: HALOT
  rationale: תֹהוּ는 ‘비어 있음, 공허, 무가치함’의 범위를 가지므로, 여기서는 우주적 허무감을 살리는 ‘공허처럼’이 적절합니다.
theological_decisions:
