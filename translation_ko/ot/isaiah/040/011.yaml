  - 자기 양 떼를 돌보시며
  lexicon: HALOT
  rationale: רעה의 목양적 의미를 한국어의 ‘먹이다’로 풀어, 양 떼를 보살피는 구체적 이미지를 살렸습니다.
- source_word: בְּחֵיקוֹ
  english_pob_choice: in his bosom
  chosen_korean: 자기 품에
  alternatives_korean:
  - 자기 가슴에
  - 자기 옷자락 속에
  lexicon: HALOT
  rationale: חֵיק의 친밀하고 따뜻한 품속 이미지를 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘품’을 택했습니다.
- source_word: עָלוֹת
  english_pob_choice: the nursing ewes
  chosen_korean: 젖 먹이는 암양들
  alternatives_korean:
