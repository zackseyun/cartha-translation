base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
  footnotes:
  - marker: a
    text: Or "As a shepherd he will tend his flock."
    reason: lexical_alternative
  - marker: b
    text: Literally "in his bosom," an image of close, tender care.
    reason: cultural_note
  - marker: c
    text: Or "ewes with young."
    reason: lexical_alternative
translation:
  language: ko
  text: 목자처럼 자기 양 떼를 먹이시며, 자기 팔로 어린 양들을 모으시고, 자기 품에 안고 나르시며, 젖 먹이는 암양들을 부드럽게 인도하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 양 떼를 먹이다”입니다.
    reason: source_note
  - marker: b
    text: 직역하면 “자기 품에”입니다. 친밀하고 보호적인 보살핌의 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “젖 먹이는 암양들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  english_pob_choice: Like a shepherd
  chosen_korean: 목자처럼
  alternatives_korean:
