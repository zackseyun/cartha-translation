  - 목자와 같이
  lexicon: HALOT
  rationale: 비교를 나타내는 כ의 의미를 살려, 관용적이고 자연스러운 ‘목자처럼’으로 옮겼습니다.
- source_word: יִרְעֶה עֶדְרוֹ
  english_pob_choice: he will pasture his flock
  chosen_korean: 자기 양 떼를 먹이시며
  alternatives_korean:
