  - 어린 새끼를 가진 암양들
  lexicon: HALOT
  rationale: 어미 양의 수유 상태를 직접 드러내는 표현으로, 원문의 목가적 구체성을 유지했습니다.
theological_decisions:
- issue: 야훼의 목자 이미지
  chosen_reading: 본문의 직유를 그대로 살려, 하나님이 양 떼를 돌보시는 친밀하고 능동적인 목자이심을 드러냈습니다.
  alternative_readings:
  - 메시아적 성취를 암시하는 해석을 본문에 직접 반영하는 번역
  rationale: 이 구절은 예언적 위로 속에서 야훼의 돌보심을 묘사하므로, 번역문은 후대 해석을 덧씌우지 않고 원문 이미지 자체를 보존하는 것이 적절합니다.
  doctrine_reference: 이사야 40장 문맥의 위로와 하나님의 목자적 돌보심
