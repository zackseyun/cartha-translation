id: ISA.40.21
reference: Isaiah 40:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
  footnotes:
  - marker: a
    text: Or, 'Have you not understood the foundations of the earth?'
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 알지 못하느냐? 너희는 듣지 못하느냐? 처음부터 너희에게 전해지지 않았느냐? 땅의 기초로부터 너희는 깨닫지 못하였느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '너희는 땅의 기초를 깨닫지 못하였느냐?'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Do you not / Has it not / Have you not
  chosen_korean: ~하지 못하느냐?
  alternatives_korean:
  - 정녕 ~하지 않느냐?
  - ~한 것이 아니냐?
  lexicon: HALOT
  rationale: 반복되는 הֲלוֹא의 수사적 질문 성격을 살리기 위해 단순한 부정 의문으로 옮겼습니다. 한국어에서는 직접적인 반문 어조를 유지하는 '~하지 못하느냐?'가 가장 자연스럽습니다.
- source_word: תֵדְעוּ
  english_pob_choice: know
  chosen_korean: 알지 못하느냐
  alternatives_korean:
  - 인지하지 못하느냐
  - 깨닫지 못하느냐
  lexicon: HALOT
  rationale: ידע의 기본 의미인 '알다'를 살려, 앞의 첫 질문은 인지 여부를 묻는 직접 표현으로 옮겼습니다.
- source_word: תִשְׁמָעוּ
  english_pob_choice: hear
  chosen_korean: 듣지 못하느냐
  alternatives_korean:
  - 귀 기울이지 못하느냐
  - 듣지 않느냐
  lexicon: HALOT
  rationale: שׁמע의 직접 의미를 따라 '듣다'로 옮겼고, '귀 기울이다'는 원문보다 태도를 덧붙일 수 있어 피했습니다.
- source_word: הֻגַּד מֵרֹאשׁ לָכֶם
  english_pob_choice: Has it not been told to you from the beginning?
  chosen_korean: 처음부터 너희에게 전해지지 않았느냐
  alternatives_korean:
  - 처음부터 너희에게 말해지지 않았느냐
  - 시작부터 너희에게 알려지지 않았느냐
  lexicon: HALOT
  rationale: נגד의 수동형을 현대 한국어의 '전해지다'로 옮겨, 단순 통보가 아니라 이미 주어진 전달의 뉘앙스를 살렸습니다.
- source_word: מוֹסְדוֹת הָאָרֶץ
  english_pob_choice: from the foundations of the earth / the foundations of the earth
  chosen_korean: 땅의 기초로부터
  alternatives_korean:
  - 땅의 기초
  - 세상의 기초로부터
  lexicon: HALOT
  rationale: 모וסדות는 '기초들/토대'를 뜻하므로 문자적 이미지를 유지했습니다. 최종 절의 관계는 전치사 유무에 따라 '로부터' 또는 목적어로도 읽힐 수 있어, 본문은 원문의 여지를 살리는 방향으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 관계 해석
  chosen_reading: 땅의 기초로부터 너희는 깨닫지 못하였느냐?
  alternative_readings:
  - 너희는 땅의 기초를 깨닫지 못하였느냐?
  rationale: 히브리어는 마지막 구에 명시적 전치사가 없어, '기초들'을 깨달음의 대상로 볼 수도 있고 '~로부터'라는 출처 표현으로 볼 수도 있습니다. 본문 전체의 수사 흐름은 창조의 기초로부터 이미 주어진 계시를 강조하므로 출처 표현을 본문에 두고, 대안은 각주로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: 해석상의 긴장을 해소하지 않고 보존'
