  source_fidelity: 반복되는 הֲלוֹא의 긍정 답변을 기대하는 반문, '알다/듣다/알려지다/깨닫다'의 순서, 그리고 마지막 구문의 두 가능한 통사 관계를 모두 보존합니다. 본문은 마지막 구문을 창조의 기초가 놓인 때로부터라는 시간·출처적 표현으로 번역하고, 목적어 해석은 각주에 남깁니다.
  naturalness: 초안의 '-느냐?'와 '너희'는 지정된 현대 합쇼체와 일치하지 않습니다. 또한 '땅의 기초로부터 ... 깨닫다'는 한국어에서 다소 부자연스럽습니다. '땅의 기초가 놓일 때부터'로 시간 관계를 자연스럽게 드러내고, 문장 전체를 현대 합쇼체로 통일합니다.
