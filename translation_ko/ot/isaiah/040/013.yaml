  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
  footnotes:
  - marker: a
    text: Or 'the mind of the LORD.' The Hebrew word can denote spirit, breath, or inner disposition; the Greek tradition reflected in Romans 11:34 reads 'mind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has directed the Spirit of the LORD' / 'can instruct him.' These reflect interpretive renderings of the Hebrew verbs and the ancient Greek tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 야훼의 영을 헤아렸으며, 누가 그분의 조언자가 되어 그분에게 가르쳐 주었겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 마음’입니다. 히브리어 רוּחַ는 영, 숨, 또는 내적 성향을 뜻할 수 있으며, 로마서 11:34에 반영된 고대 그리스어 전통은 ‘마음’을 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘누가 야훼의 영을 인도하였겠습니까?’ 또는 ‘누가 그분을 가르칠 수 있겠습니까?’로 옮길 수 있습니다. 이러한 번역은 히브리어 동사의 해석과 고대 그리스어 전통을 반영합니다.
    reason: alternative_reading
lexical_decisions:
