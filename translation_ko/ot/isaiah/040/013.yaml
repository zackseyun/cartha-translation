  - 그를 가르칠 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 사역형의 '알게 하다'를 살리되, 수사적 질문의 힘을 유지하도록 가능형으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ יְהוָה를 '영'으로 둘지 '마음'으로 풀지 여부
  chosen_reading: 본문은 '야훼의 영'으로 두고, 별도 각주 없이 본문 의미를 유지합니다.
  alternative_readings:
  - 야훼의 마음
  - 야훼의 뜻
  rationale: 히브리어 רוּחַ는 문맥에 따라 '영/마음/기운'까지 넓게 갈 수 있지만, 이 절은 야훼의 초월성과 인간의 무지함을 대조하므로 '영'이 가장 원문에 가깝습니다.
