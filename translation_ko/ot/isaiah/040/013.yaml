  text: מִֽי תִכֵּ֥ן אֶת ר֖וּחַ יְהוָ֑ה וְ/אִ֥ישׁ עֲצָת֖/וֹ יוֹדִיעֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
  footnotes:
  - marker: a
    text: Or 'the mind of the LORD.' The Hebrew word can denote spirit, breath, or inner disposition; the Greek tradition reflected in Romans 11:34 reads 'mind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has directed the Spirit of the LORD' / 'can instruct him.' These reflect interpretive renderings of the Hebrew verbs and the ancient Greek tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 야훼의 영을 헤아렸으며, 또는 어떤 사람이 그의 뜻을 그에게 알게 할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼의 마음'입니다. 히브리어 רוּחַ는 영, 숨, 내적 상태를 뜻할 수 있으며, 로마서 11:34에 반영된 헬라어 전통은 '마음'을 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '야훼의 영을 지휘한/인도한' 혹은 '그에게 가르칠 수 있겠습니까'로도 옮길 수 있습니다. 이는 히브리어 동사와 고대 헬라어 전통의 해석을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִכֵּן
  english_pob_choice: has measured
  chosen_korean: 헤아렸으며
  alternatives_korean:
  - 측량했으며
  - 재었으며
  lexicon: HALOT
  rationale: 말 그대로의 '재다/측량하다' 이미지를 살리면서, 히브리어의 비유적 질문에 자연스럽게 어울리는 한국어 동사로 옮겼습니다.
- source_word: ר֖וּחַ יְהוָ֑ה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 성령
  - 야훼의 마음
  lexicon: HALOT
  rationale: רוּחַ는 여기서 하나님의 내적 작정이나 활동까지 포괄할 수 있으나, 직역상 '영'이 가장 직접적이며 POB의 야훼 표기를 반영했습니다.
- source_word: עֲצָת֖וֹ
  english_pob_choice: his counsel
  chosen_korean: 그의 뜻
  alternatives_korean:
  - 그의 계획
  - 그의 조언
  lexicon: HALOT
  rationale: עֵצָה는 '계획/의도/모략'의 폭이 있어, 문맥상 하나님의 내정과 결정을 가리키는 '뜻'이 가장 자연스럽습니다.
- source_word: יוֹדִיעֶנּוּ
  english_pob_choice: can make his counsel known to him
  chosen_korean: 그에게 알게 할 수 있겠습니까
  alternatives_korean:
  - 그에게 알려 줄 수 있겠습니까
  - 그를 가르칠 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 사역형의 '알게 하다'를 살리되, 수사적 질문의 힘을 유지하도록 가능형으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ יְהוָה를 '영'으로 둘지 '마음'으로 풀지 여부
  chosen_reading: 본문은 '야훼의 영'으로 두고, 별도 각주 없이 본문 의미를 유지합니다.
  alternative_readings:
  - 야훼의 마음
  - 야훼의 뜻
  rationale: 히브리어 רוּחַ는 문맥에 따라 '영/마음/기운'까지 넓게 갈 수 있지만, 이 절은 야훼의 초월성과 인간의 무지함을 대조하므로 '영'이 가장 원문에 가깝습니다.
  doctrine_reference: '원문 우선 원칙: 번역 전통보다 히브리어의 직접적 대조를 보존합니다.'
