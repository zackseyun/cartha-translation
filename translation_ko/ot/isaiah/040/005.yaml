source:
  edition: WLC
  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'all humanity'; Hebrew 'all flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영광이 드러날 것이며, 모든 육체가 함께 볼 것입니다. 이는 야훼의 입이 말씀하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인간’; 히브리어는 ‘모든 육체’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְלָה
  english_pob_choice: will be revealed
  chosen_korean: 드러날 것이며
  alternatives_korean:
  - 나타날 것입니다
  - reve어질 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동·드러남 의미를 살려 ‘드러나다’로 옮겼습니다. ‘나타나다’보다 계시적 의미가 분명합니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 광채
  - 야훼의 존귀
  lexicon: HALOT
  rationale: כָּבוֹד의 핵심 의미인 ‘영광’을 유지하고, 하나님의 이름은 본문 원어의 고유명으로 ‘야훼’로 옮겼습니다.
- source_word: כָל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 인간
  - 모든 사람
  lexicon: HALOT
  rationale: POB의 ‘all flesh’를 한국어에서도 직역에 가깝게 살려, 피조물 전체를 가리키는 성경적 표현을 보존했습니다.
- source_word: פִּי יְהוָה דִּבֵּר
  english_pob_choice: the mouth of Yahweh has spoken
  chosen_korean: 야훼의 입이 말씀하셨기 때문입니다
  alternatives_korean:
  - 야훼께서 말씀하셨기 때문입니다
  - 야훼의 입으로 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 구체적이고 강한 관용구를 살려 ‘입이 말씀하셨다’로 옮겼습니다. ‘말씀하셨기 때문입니다’는 원문의 확정성과 근거 제시를 자연스럽게 전달합니다.
theological_decisions:
- issue: הוָה의 번역을 ‘주’로 둘지 ‘야훼’로 둘지
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 직접적으로 YHWH를 쓰므로, 본 프로젝트의 기준에 따라 고유명 ‘야훼’를 유지했습니다. 이렇게 해야 하나님 이름의 언약적·개인적 성격이 지워지지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘모든 육체’를 해석어로 풀지, 관용구를 보존할지
  chosen_reading: 모든 육체
  alternative_readings:
  - 모든 인간
  - 모든 사람
  rationale: 문맥상 보편성을 뜻하지만, 본문은 의도적으로 ‘육체’라는 표현을 사용합니다. 이를 살려 창조된 인간의 보편성과 연약함을 함께 드러내려 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
