lexical_decisions:
- source_word: וְ/אֶל מִי
  english_pob_choice: To whom, then,
  chosen_korean: 그러면 누구에
  alternatives_korean:
  - 그리고 누구에게
  - 그렇다면 누구에게
  lexicon: HALOT
  rationale: וְ의 연결과 수사적 전환을 한국어 담화에서 자연스러운 ‘그러면’으로 옮겨, 문맥의 도전적 질문 흐름을 살렸습니다.
- source_word: תְּדַמְּיוּן
  english_pob_choice: will you liken
  chosen_korean: 비기시겠습니까
  alternatives_korean:
  - 비교하시겠습니까
  - 같게 하시겠습니까
  lexicon: HALOT
  rationale: דמה의 ‘닮게 하다/비기다’라는 비교적이고 평가적인 뉘앙스를 살려, 단순한 정보 비교보다 더 강한 수사적 비난을 드러내는 ‘비기다’를 선택했습니다.
- source_word: דְּמוּת
  english_pob_choice: likeness
  chosen_korean: 형상
  alternatives_korean:
  - 비슷한 모습
  - 모양
  - 유사성
  lexicon: HALOT
  rationale: דְּמוּת은 ‘유사함’의 뜻이지만, 우상 논박 문맥에서 인간이 만들어 낸 가시적 표현을 가리키는 힘이 있어 ‘형상’으로 옮겼습니다.
- source_word: תַּעַרְכוּ לֽוֹ
  english_pob_choice: will you compare to him
  chosen_korean: 그분과 견주시겠습니까
  alternatives_korean:
  - 그분께 견주시겠습니까
  - 그분과 비교하시겠습니까
  lexicon: HALOT
  rationale: ערך의 ‘견주다/대조하다’ 의미를 살려, 히브리어의 ‘옆에 놓고 비교하다’는 감각을 비교적 직접적으로 전달했습니다.
theological_decisions:
- issue: אֵל의 신학적 지시 대상
  chosen_reading: 하나님
  alternative_readings:
  - 하나님 한 분
  - 신
  rationale: 문맥이 우상과 대비되는 유일하신 참 하나님을 가리키므로, 불특정한 ‘신’이 아니라 ‘하나님’으로 옮겨 이사야 40장의 논지를 분명히 했습니다.
  doctrine_reference: '성경 번역 원칙: 문맥이 지시하는 유일신 신앙을 보존하되, 과잉 해석은 피함'
