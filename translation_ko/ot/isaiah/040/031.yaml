id: ISA.40.31
reference: Isaiah 40:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קוֹיֵ֤ יְהוָה֙ יַחֲלִ֣יפוּ כֹ֔חַ יַעֲל֥וּ אֵ֖בֶר כַּ/נְּשָׁרִ֑ים יָר֨וּצוּ֙ וְ/לֹ֣א יִיגָ֔עוּ יֵלְכ֖וּ וְ/לֹ֥א יִיעָֽפוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
  footnotes:
  - marker: a
    text: Or 'those who hope in the LORD.' The Hebrew verb includes the sense of waiting with expectant hope.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like nesherim'; traditionally 'eagles,' though the term can also refer more broadly to large birds of prey, including vultures.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼를 기다리는 사람들은 자기 힘을 새롭게 할 것입니다[a]. 그들은 독수리처럼 날개를 펼치며 올라갈 것입니다. 그들은 달려도 지치지 않고[b], 걸어도 기진하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 소망하는 사람들’입니다. 히브리어 동사는 기대하는 소망을 품고 기다리는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘nesherim’은 전통적으로 ‘독수리들’로 옮기지만, 더 넓게는 독수리류를 포함하는 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ֤ יְהוָה֙
  english_pob_choice: But those who wait for Yahweh
  chosen_korean: 그러나 야훼를 기다리는 사람들은
  alternatives_korean:
  - 야훼를 바라는 사람들은
  - 주를 기다리는 사람들은
  - 야훼를 소망하는 사람들은
  lexicon: HALOT
  rationale: קוה는 단순 대기가 아니라 기대를 동반한 기다림/바람의 의미를 가지므로, 기본은 ‘기다리는’으로 두고 그 뉘앙스는 각주로 보완했습니다. 대비 접속사 ‘그러나’는 앞절의 지친 자들과의 대조를 살립니다.
- source_word: יַחֲלִ֣יפוּ כֹ֔חַ
  english_pob_choice: will renew their strength
  chosen_korean: 자기 힘을 새롭게 할 것입니다
  alternatives_korean:
  - 힘을 새로 얻을 것입니다
  - 힘을 회복할 것입니다
  - 힘을 교환할 것입니다
  lexicon: HALOT
  rationale: חלף의 ‘바꾸다/새롭게 하다’ 뉘앙스를 살리면서도 한국어에서 자연스러운 ‘새롭게 하다’로 옮겼습니다. ‘회복하다’는 가능하지만 원문의 새로움/대체의 감각이 조금 약합니다.
- source_word: כַּ/נְּשָׁרִים
  english_pob_choice: like eagles
  chosen_korean: 독수리처럼
  alternatives_korean:
  - 매처럼
  - 독수리들처럼
  - 맹금처럼
  lexicon: HALOT
  rationale: 시적 이미지에서는 대체로 ‘독수리’가 가장 관용적이고 힘과 비상의 상징을 잘 살립니다. 원문이 큰 새를 넓게 가리킬 수 있는 점은 영어 본문 각주에 이미 반영되어 있습니다.
- source_word: וְ/לֹא יִיגָעוּ
  english_pob_choice: and not grow weary
  chosen_korean: 지치지 않고
  alternatives_korean:
  - 피곤해하지 않고
  - 수고로워하지 않고
  - 쇠하지 않고
  lexicon: HALOT
  rationale: יגע는 수고 끝의 피로/권태를 뜻하므로 ‘지치다’가 현대 한국어에서 가장 자연스럽고 문맥에 맞습니다. 다음 절의 ‘기진하다’와 함께 점층적 평행을 유지합니다.
- source_word: וְ/לֹא יִיעָפוּ
  english_pob_choice: and not faint
  chosen_korean: 기진하지 않을 것입니다
  alternatives_korean:
  - 쓰러지지 않을 것입니다
  - 혼절하지 않을 것입니다
  - 피곤해지지 않을 것입니다
  lexicon: HALOT
  rationale: יעף는 단순 피로보다 더 심한 탈진을 가리키므로 ‘기진하다’가 시적 대비를 살리면서도 의미 범위를 잘 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문은 여호와 대체어가 아니라 신명기적 고유명사 יהוה를 사용하므로, POB 기준에 따라 ‘야훼’로 음역해 신적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קוה의 신학적 긴장
  chosen_reading: 기다리는 사람들
  alternative_readings:
  - 바라는 사람들
  - 소망하는 사람들
  - 기다리며 소망하는 사람들
  rationale: 이 동사는 시간적 기다림과 기대하는 소망을 함께 포함하므로, 본문에는 ‘기다리는’으로 두고 그 내포 의미는 각주로 드러내어 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
