  source_fidelity: 본문의 ‘야훼를 기다리는 사람들’, ‘힘을 새롭게 하다’, 달리고 걸음, 그리고 지치거나 기진하지 않음은 히브리어의 의미와 평행 구조를 충실히 반영합니다. ‘독수리처럼 날개를 펼치며 올라갈 것입니다’도 יַעֲלוּ אֵבֶר כַּנְּשָׁרִים를 자연스럽게 옮긴 표현입니다.
