  terminology: יהוה를 ‘야훼’로 옮긴 것은 제공된 POB 방침과 일치합니다. קוה의 기다림과 기대/소망의 양면성도 각주로 적절히 보존했습니다. 다만 נשרים의 어휘 각주는 해당 낱말 ‘독수리’에 붙어야 하며, 현 각주 문구는 더 정확하게 다듬을 수 있습니다.
