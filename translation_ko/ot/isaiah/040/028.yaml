  rationale: 본문이 여호와 대체어가 아닌 신명기적 고유명사 יְהוָה를 직접 사용하므로, POB 기준에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
