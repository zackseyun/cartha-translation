  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
  footnotes:
  - marker: a
    text: Hebrew YHWH; alternatively rendered 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 「너희는 알지 못하였느냐? 듣지 못하였느냐? 야훼는 영원하신 하나님이시며, 땅의 끝들을 창조하신 분이십니다. 그는 지치지 않으시고 피곤해하지도 않으시며, 그의 명철은 헤아릴 수 없습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה. 본문에서는 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ / אִם לֹא שָׁמַעְתָּ
  english_pob_choice: Have you not known? Have you not heard?
  chosen_korean: 너희는 알지 못하였느냐? 듣지 못하였느냐?
  alternatives_korean:
  - 알지 못하였느냐? 듣지 못하였느냐?
  - 너희는 몰랐느냐? 들어보지 못하였느냐?
  lexicon: HALOT
  rationale: 수사적인 책망/상기 질문으로서, 한국어도 반어적 질문을 살려 두 번의 병렬 질문으로 옮겼습니다.
- source_word: אֱלֹהֵי עוֹלָם
  english_pob_choice: the everlasting God
  chosen_korean: 영원하신 하나님
  alternatives_korean:
  - 영원한 하나님
  - 영원부터 계신 하나님
  lexicon: HALOT
  rationale: עוֹלָם의 지속·영원성을 자연스러운 형용사구로 풀어, 하나님의 영원성을 강조하는 문맥을 살렸습니다.
- source_word: בּוֹרֵא קְצוֹת הָאָרֶץ
  english_pob_choice: the Creator of the ends of the earth
  chosen_korean: 땅의 끝들을 창조하신 분
  alternatives_korean:
  - 땅의 끝들을 창조하신 이
  - 땅의 끝까지 창조하신 창조주
  lexicon: HALOT
  rationale: ‘끝들’을 공간적 최외곽이라는 뜻으로 보아 직역에 가깝게 살리되, 주어 수식구로 자연스럽게 연결했습니다.
- source_word: לֹא יִיעַף וְלֹא יִיגָע
  english_pob_choice: He does not grow faint or become weary
  chosen_korean: 그는 지치지 않으시고 피곤해하지도 않으시며
  alternatives_korean:
  - 그는 지치지도 않으시고 피곤해하지도 않으시며
  - 그는 쇠하지 않으시고 수고에 지치지도 않으시며
  lexicon: HALOT
  rationale: 두 동사의 의미 차이(기력이 쇠함 / 수고로 인한 피곤)를 한국어의 병렬 부정으로 구분해 전달했습니다.
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  english_pob_choice: his understanding is unsearchable
  chosen_korean: 그의 명철은 헤아릴 수 없습니다
  alternatives_korean:
  - 그의 명철은 측량할 수 없습니다
  - 그의 이해는 끝이 없습니다
  lexicon: HALOT
  rationale: תבונה는 단순 지식보다 분별·명철의 뜻이 강하므로 ‘명철’로 옮기고, ‘헤아릴 수 없다’로 בלתי-חקור의 불가탐색성을 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
