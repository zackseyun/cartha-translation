source:
  edition: WLC
  text: הַֽ/מְסֻכָּ֣ן תְּרוּמָ֔ה עֵ֥ץ לֹֽא יִרְקַ֖ב יִבְחָ֑ר חָרָ֤שׁ חָכָם֙ יְבַקֶּשׁ ל֔/וֹ לְ/הָכִ֥ין פֶּ֖סֶל לֹ֥א יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
  footnotes:
  - marker: a
    text: Or 'The impoverished one chooses as an offering wood that does not decay.' The Hebrew opening is compact and may be construed slightly differently.
    reason: alternative_reading
  - marker: b
    text: Or 'a carved image' for 'an idol.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he seeks out a skilled craftsman for himself to prepare'.
    reason: previous_rendering
translation:
  language: ko
  text: 제물을 바치기에는 너무 가난한 사람[a]은 썩지 않을 나무를 고르고, 흔들리지 않을 우상[b]을 마련할 숙련된 장인을 자신을 위해 찾습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 사람은 제물로 삼을 썩지 않을 나무를 고릅니다.’ 히브리어 첫 구절은 압축되어 있어 약간 다르게 해석될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘새긴 형상’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그는 자신을 위해 우상을 마련할 숙련된 장인을 찾습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: הַמְסֻכָּן
  english_pob_choice: He who is too poor
  chosen_korean: 제물로 바치기에는 너무 가난한 사람
  alternatives_korean:
  - 가난하여 제물을 드릴 수 없는 사람
  - 너무 빈곤한 사람
  lexicon: HALOT
  rationale: 문맥상 단순한 가난이 아니라 제물을 마련할 수 없을 정도의 빈곤을 가리키므로, 한국어로 그 제약을 분명히 드러냈습니다.
- source_word: תְּרוּמָה
  english_pob_choice: for an offering
  chosen_korean: 제물로 바치기에는
  alternatives_korean:
  - 제물로
  - 헌물로
  lexicon: HALOT
  rationale: תרומה의 예배적 의미를 살리되, 문맥상 ‘무언가를 바쳐’ 나무를 고르는 상황이므로 자연스러운 한국어로 옮겼습니다.
- source_word: חָרָשׁ חָכָם
  english_pob_choice: a skilled craftsman
  chosen_korean: 능숙한 장인
  alternatives_korean:
  - 숙련된 장인
  - 지혜로운 장인
  lexicon: HALOT
  rationale: חָכָם이 여기서는 도덕적 ‘지혜’보다 기술적 숙련을 가리키므로, 기능을 분명히 하는 ‘능숙한 장인’으로 번역했습니다.
- source_word: פֶּסֶל
  english_pob_choice: an idol
  chosen_korean: 우상
  alternatives_korean:
  - 새긴 형상
  - 조각상
  lexicon: HALOT
  rationale: 이사야 40장의 반우상론적 맥락에서 פֶּסֶל의 신학적 뉘앙스가 ‘우상’으로 가장 직접적으로 드러납니다.
theological_decisions:
- issue: פֶּסֶל을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘우상’으로 번역해 거짓 신을 만드는 행위에 대한 예언자적 조롱을 살렸습니다.
  alternative_readings:
  - ‘새긴 형상’
  - ‘조각상’
  rationale: 단순한 물체 묘사보다, 본문 전체의 우상 비판을 독자가 즉시 이해하도록 하는 것이 더 충실합니다.
  doctrine_reference: 이사야 40장의 우상 비판
