  source_fidelity: 개정이 필요합니다. 초안의 ‘아직도 심지어’ 반복은 히브리어 אַף בַּל의 반복적 강조를 한국어로 옮기지 못하고 문법적으로도 성립하지 않습니다. 문맥과 영어 POB의 시간적 수사 효과에 맞춰 ‘겨우’를 반복하여, 세워진 통치자들이 채 뿌리내리기도 전에 사라짐을 나타냈습니다. נָשַׁף בָּהֶם은 하나님이 그들에게 바람을 부는 행위로, סְעָרָה는 폭풍으로, קַּשׁ은 짚의 이미지로 유지했습니다.
  naturalness: ‘겨우 심어지고, 겨우 뿌려지고, 겨우 그 줄기가 땅에 뿌리를 내리려 할 때’는 병렬과 긴박감을 자연스러운 현대 표준 한국어로 재현합니다. ‘그가 그들에게 바람을 불기만 하면’은 원문의 최소한의 행위와 뒤따르는 결과를 자연스럽게 연결합니다.
  terminology: 농경 은유의 ‘심어지다/뿌려지다/뿌리를 내리다’를 일관되게 유지했습니다. ‘폭풍’과 ‘짚’은 각각 סְעָרָה와 קַּשׁ의 넓은 의미 범위 안에 있으며, 각주에서 ‘회오리바람’ 가능성을 보존했습니다.
