id: ISA.40.24
reference: Isaiah 40:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
  footnotes:
  - marker: a
    text: Or 'Hardly are they planted... hardly has their stem rooted in the earth.' The Hebrew repetition intensifies how quickly their rise is undone.
    reason: lexical_alternative
  - marker: b
    text: Or 'a whirlwind' instead of 'a storm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 겨우 심어지고[a], 겨우 뿌려지고, 겨우 그 줄기가 땅에 뿌리를 내리려 할 때, 그가 그들에게 바람을 불기만 하면 그들은 시들고, 폭풍이 그들을 짚처럼 쓸어갑니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거의 심어지지 않고, 거의 뿌려지지 않고, 그 줄기가 땅에 거의 뿌리를 내리지도 않았는데’로 옮길 수 있습니다. 히브리어의 반복은 그들이 얼마나 빨리 무너지는지를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘회오리바람’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  english_pob_choice: scarcely
  chosen_korean: 아직도 …도 못했는데
  alternatives_korean:
  - 겨우
  - 간신히
  - 거의
  lexicon: HALOT
  rationale: 반복되는 부정 강조를 한국어에서는 시간적·수사적 긴박감이 살아나는 ‘아직도 …도 못했는데’로 옮겨, 일이 막 시작되자마자 무너지는 느낌을 살렸습니다.
- source_word: נִטָּעוּ / זֹרָעוּ / שֹׁרֵשׁ
  english_pob_choice: are planted / are sown / has taken root
  chosen_korean: 심어지지도, 뿌려지지도, 땅에 그 줄기가 뿌리내리지도 못했
  alternatives_korean:
  - 심겼고 / 뿌려졌고 / 뿌리내렸다
  - 심어졌고 / 파종되었고 / 뿌리를 내렸다
  lexicon: HALOT
  rationale: 농경 비유의 병렬을 살리되, 완료처럼 굳어 보이지 않도록 부정형으로 이어 ‘아직 성립되지 않은 상태’를 강조했습니다.
- source_word: נָשַׁף
  english_pob_choice: blows
  chosen_korean: 그가 그저 불기만 하면
  alternatives_korean:
  - 그가 불면
  - 그가 숨을 내쉬면
  lexicon: HALOT
  rationale: 히브리어의 가벼운 숨결 같은 행위를 한국어에서도 최소 행위로 드러내기 위해 ‘그저 …만 하면’을 사용했습니다.
- source_word: סְעָרָה כַּקַּשׁ תִּשָּׂאֵם
  english_pob_choice: a storm carries them away like stubble
  chosen_korean: 폭풍이 그것들을 짚처럼 쓸어갑니다
  alternatives_korean:
  - 폭풍이 그것들을 짚처럼 날려 보냅니다
  - 회오리바람이 그것들을 짚처럼 쓸어갑니다
  lexicon: HALOT
  rationale: POB의 ‘storm’ 선택을 따라 ‘폭풍’으로 옮기고, קַשׁ은 추수 뒤 남는 짚의 이미지를 살려 ‘짚처럼’으로 번역했습니다.
theological_decisions:
- issue: 문장의 주어가 생략된 ‘그가’의 지시 대상
  chosen_reading: 주어는 앞 문맥의 하나님입니다.
  alternative_readings:
  - 인칭 없는 바람이 분다고 볼 수 있습니다.
  - 문맥상 그냥 수동적 자연현상으로 읽을 수 있습니다.
  rationale: 이사야 40:23–24의 흐름에서 통치자들을 무력화하는 분은 하나님이므로, 영어 POB의 ‘he’처럼 인칭적 신적 행위를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 이사야 40:23–24
