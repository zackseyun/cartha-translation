id: ISA.40.2
reference: Isaiah 40:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
  footnotes:
  - marker: a
    text: Or, 'her warfare is ended' or 'her term of service is fulfilled.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'her punishment is accepted/satisfied' or 'her guilt is accepted.'
    reason: lexical_alternative
  - marker: c
    text: '''Double'' may be an idiom for a full measure, not necessarily a precise mathematical doubling.'
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘의 마음에 말하고[a], 그에게 외쳐라. 그의 고된 노역이 끝났고, 그의 죄악이 용서되었으며[c][b], 그가 야훼의 손에서 자기의 모든 죄에 대하여 갑절을 받았기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에게 위로하여 말하라’ 또는 ‘예루살렘의 마음에 부드럽게 말하라’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 죄값이 받아들여졌다/충분하다’ 혹은 ‘그의 죄과가 받아들여졌다’.
    reason: lexical_alternative
  - marker: c
    text: ‘갑절’은 정확히 두 배라는 뜻이 아니라, 충만한 분량을 뜻하는 관용구일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  english_pob_choice: Speak to the heart of Jerusalem
  chosen_korean: 예루살렘의 마음에 말하고
  alternatives_korean:
  - 예루살렘에게 위로하여 말하고
  - 예루살렘의 마음에 다정히 말하고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서는 ‘마음에 말하다’가 회복과 위로의 뜻을 충분히 전달합니다.
- source_word: צְבָאָהּ
  english_pob_choice: her hard service is completed
  chosen_korean: 그의 고된 노역이 끝났고
  alternatives_korean:
  - 그의 전쟁이 끝났고
  - 그의 섬김의 기간이 끝났고
  lexicon: HALOT
  rationale: צָבָא의 범위를 전쟁으로만 좁히지 않고, 포로기 고난의 ‘노역/부역’이라는 넓은 의미를 반영했습니다.
- source_word: נִרְצָה עֲוֺנָהּ
  english_pob_choice: her iniquity is pardoned
  chosen_korean: 그의 죄악이 용서되었으며
  alternatives_korean:
  - 그의 죄과가 받아들여졌으며
  - 그의 죄값이 충분히 치러졌으며
  lexicon: HALOT
  rationale: 문맥상 회복 선언이므로 결과를 분명히 드러내는 ‘용서되다’를 썼고, 히브리어의 ‘받아들여짐/만족됨’ 뉘앙스는 주석으로 남겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 표준 음역 관행
  rationale: 문서의 기본 원칙에 따라 신명은 칭호 대신 고유명 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘갑절’의 의미
  chosen_reading: 정확한 수학적 두 배라기보다, 예루살렘이 자기 죄에 상응하는 충분한 분량을 받았다는 관용적 표현으로 보았습니다.
  alternative_readings:
  - 죄마다 엄밀히 두 배의 형벌을 받았다는 뜻
  - 과도한 심판이 아니라 오히려 넘치는 은혜를 뜻함
  rationale: 문맥은 형벌의 종결과 사면 선포를 함께 담고 있으므로, 관용구를 과잉해석하지 않고 본문이 말하는 정도만 유지했습니다.
  doctrine_reference: 과잉결정 피하기
- issue: ‘죄악이 용서되었으며’의 어조
  chosen_reading: 심판 이후 회복이 선언되는 신탁으로 읽고, 한국어는 결과 상태를 분명히 드러내는 완료형을 택했습니다.
  alternative_readings:
  - ‘죄값이 받아들여졌다’는 보다 문자적인 표현
  - ‘형벌이 충분히 받들어졌다’는 해석적 표현
  rationale: 히브리어 동사의 의미 범위를 보존하되, 현대 독자가 회복 선언을 즉시 이해하도록 했습니다.
  doctrine_reference: 회복 신탁의 문맥 유지
