translation:
  language: ko
  text: 젊은이들도 기력이 쇠하고 지치며, 청년들도[a] 틀림없이 비틀거립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘청년들’: 히브리어 בַּחוּרִים는 대체로 힘이 한창인 젊은 남성을 가리킵니다. 앞의 נְעָרִים(‘젊은이들’)과 구별되는 표현입니다.'
    reason: lexical_alternative
