base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/030.yaml
  text: Even young men grow faint and become weary[a], and young men surely stumble.
  footnotes:
  - marker: a
    text: Or 'vigorous young men' or simply 'young men.' The Hebrew בַּחוּרִים refers to young men in the prime of strength; 'chosen' preserves the lexical distinction from the previous term.
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은이들도 지치며 피곤해지고, 청년들도 반드시 넘어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew נְעָרִים can mean either ‘young men’ or ‘youths’; the parallel term בַחוּרִים points to those in the prime of strength, so the distinction is preserved in the source layer even though Korean uses a broader term.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִעֲפוּ
  english_pob_choice: grow faint
  chosen_korean: 지치며
  alternatives_korean:
  - 기운이 빠지며
  - 기진하며
  - 기력이 쇠하며
  lexicon: HALOT
  rationale: עוּף의 진행적 의미를 살려 ‘지치다’보다 약간 더 동적인 ‘지치며’로 옮겨, 뒤의 ‘피곤해지고’와 함께 점층을 형성하게 했습니다.
- source_word: נְעָרִים
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 소년들
  lexicon: HALOT
  rationale: בַּחוּרִים와 평행을 이루는 일반적 연령층을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְיִגָעוּ
  english_pob_choice: become weary
  chosen_korean: 피곤해지고
  alternatives_korean:
  - 지치고
  - 쇠약해지고
  - 피로해지고
  lexicon: HALOT
  rationale: יגע의 뜻을 현대적이고 구어스럽지 않은 표현으로 살려, ‘grow faint’와 짝을 이루는 체감적 의미를 전달했습니다.
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  english_pob_choice: surely stumble
  chosen_korean: 반드시 넘어집니다
  alternatives_korean:
  - 틀림없이 넘어집니다
  - 정녕 넘어집니다
  - 확실히 비틀거립니다
  lexicon: HALOT
  rationale: 부정사 절대형+동사로 이루어진 강조를 ‘반드시’로 옮겨, 단순한 가능성이 아니라 필연성을 드러냈습니다.
theological_decisions:
- issue: 강조적 반복의 전달
  chosen_reading: ‘반드시’로 כָּשׁוֹל יִכָּשֵׁלוּ의 강세를 드러냈습니다.
  alternative_readings:
  - ‘정녕’으로 옮김
  - ‘확실히’로 옮김
  rationale: 히브리어의 부정사 절대형이 만드는 강한 확정/강조를 한국어에서도 분명히 보이게 하는 것이 본문의 수사적 힘을 보존합니다.
  doctrine_reference: 문학적·수사적 형식 보존
