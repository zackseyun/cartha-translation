base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
  footnotes:
  - marker: a
    text: Or 'The grass withers, the flower fades.' The Hebrew uses two related but distinct verbs for vegetation perishing.
    reason: lexical_alternative
translation:
  language: ko
  text: 풀은 마르고, 꽃은 시들지만, 우리 하나님의 말씀은 영원히 서 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 풀과 꽃에 대해 서로 관련되지만 구별되는 두 동사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  english_pob_choice: dries up
  chosen_korean: 마르고
  alternatives_korean:
  - 시들고
  - 말라 버리고
  lexicon: HALOT
  rationale: 식물이 수분을 잃고 사라지는 이미지를 한국어에서 가장 자연스럽게 살리기 위해 ‘마르고’로 옮겼습니다.
- source_word: חָצִיר
  english_pob_choice: grass
  chosen_korean: 풀
  alternatives_korean:
  - 잔디
  - 풀잎
  lexicon: HALOT
  rationale: 시적 문맥에서 ‘grass’의 일반적인 식물 이미지를 한국어로 과도하게 구체화하지 않고 ‘풀’로 옮겼습니다.
- source_word: נָבֵל
  english_pob_choice: fades
  chosen_korean: 시들지만
  alternatives_korean:
  - 말라가지만
  - 위축되지만
  lexicon: HALOT
  rationale: 꽃의 소멸을 가리키는 동사로 ‘시들다’가 가장 직접적이며, 앞절의 ‘마르다’와도 구별됩니다.
- source_word: וּדְבַר אֱלֹהֵינוּ
  english_pob_choice: the word of our God
  chosen_korean: 우리 하나님의 말씀
  alternatives_korean:
  - 우리 하나님의 말씀
  - 우리의 하나님의 말씀
  lexicon: HALOT
  rationale: ‘דָּבָר’의 기본 의미를 ‘말씀’으로 유지하고, 소유 관계는 자연스러운 한국어 어순에 맞게 표현했습니다.
- source_word: יָקוּם לְעוֹלָם
  english_pob_choice: will stand forever
  chosen_korean: 영원히 서 있습니다
  alternatives_korean:
  - 영원히 설 것입니다
  - 영원히 지속됩니다
  lexicon: HALOT
  rationale: ‘קום’의 직역적 이미지인 ‘서다’를 유지하되, 현재적 확정성을 드러내기 위해 한국어에서는 확정 서술 ‘서 있습니다’를 사용했습니다.
theological_decisions:
- issue: 첫 두 절의 대조를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘마르고… 시들지만…’로 대조를 분명히 살렸습니다.
  alternative_readings:
  - 단순히 ‘그리고’로 연결하기
  - 대조를 약하게 처리하기
  rationale: 히브리어 와우는 형식상 연결이지만, 본문은 덧없음과 영속성의 대비가 핵심이므로 한국어에서도 반전 관계를 분명히 드러내는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
