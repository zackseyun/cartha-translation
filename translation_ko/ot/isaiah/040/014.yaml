id: ISA.40.14
reference: Isaiah 40:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
  footnotes:
  - marker: a
    text: Or "the path of judgment."
    reason: lexical_alternative
  - marker: b
    text: Or "the way of insight" or "the path of discernment."
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 누구와 의논하였으며, 누가 그에게 명철을 주었습니까? 누가 그에게 정의의 길을 가르쳤으며, 지식을 가르치고 이해의 길을 그에게 알려 주었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판결의 길’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘통찰의 길’ 또는 ‘분별의 길’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי / נוֹעָץ
  english_pob_choice: Whom did he consult
  chosen_korean: 그가 누구와 의논하였으며
  alternatives_korean:
  - 그가 누구와 상담하였으며
  - 그가 누구에게서 조언을 구하였으며
  lexicon: HALOT
  rationale: 의논하다가 히필/니팔 계열의 ‘의논하다, 상의하다, 조언을 구하다’의 뜻을 자연스럽게 살리며, 수사적 질문의 독립성과 의미를 유지합니다.
- source_word: וַיְבִינֵהוּ
  english_pob_choice: who gave him understanding
  chosen_korean: 누가 그에게 명철을 주었습니까
  alternatives_korean:
  - 누가 그를 깨닫게 하였습니까
  - 누가 그에게 이해력을 주었습니까
  lexicon: HALOT
  rationale: בין의 사역적 의미를 한국어에서 ‘명철을 주다’로 옮기면 단순한 정보 전달이 아니라 이해하게 만드는 행위를 잘 드러냅니다.
- source_word: בְּאֹרַח מִשְׁפָּט
  english_pob_choice: the path of justice
  chosen_korean: 정의의 길
  alternatives_korean:
  - 심판의 길
  - 판결의 길
  lexicon: HALOT
  rationale: אֹרַח의 ‘길’과 מִשְׁפָּט의 규범적·법적 의미를 함께 살리되, 현대 한국어에서는 ‘정의의 길’이 문맥상 더 분명하고 자연스럽습니다.
- source_word: דַעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 지혜
  lexicon: HALOT
  rationale: 다음 구절의 ‘이해/명철’과 구별되도록 דַעַת는 일반적인 ‘지식’으로 옮겨 어휘 대비를 보존합니다.
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  english_pob_choice: the way of understanding
  chosen_korean: 이해의 길
  alternatives_korean:
  - 통찰의 길
  - 분별의 길
  lexicon: HALOT
  rationale: דֶרֶךְ의 병렬 구조를 ‘길’로 유지하고, תְּבוּנוֹת의 분별·이해의 뜻은 한국어에서 가장 직접적인 ‘이해’로 옮겼습니다.
- source_word: יוֹדִיעֶנּוּ
  english_pob_choice: made known to him
  chosen_korean: 그에게 알려 주었습니까
  alternatives_korean:
  - 그에게 알게 하였습니까
  - 그에게 알렸습니까
  lexicon: HALOT
  rationale: ידע의 사역형을 ‘알려 주다’로 옮기면 causative 의미가 자연스럽고, 반복되는 질문 구조도 매끄럽게 유지됩니다.
theological_decisions:
- issue: 하나님의 고립된 지혜와 독립성에 대한 수사적 질문
  chosen_reading: 본문은 하나님이 누구의 조언도 필요로 하지 않으시는 분이라는 뜻을 연속된 반문으로 드러내며, 한국어도 이를 명시적으로 살립니다.
  alternative_readings:
  - 막연한 인간 지혜의 부족을 묻는 일반 진술
  - 단순한 수사적 장식
  rationale: 문맥상 이사야 40:13–14는 야훼의 비교 불가한 지혜와 자족성을 강조하므로, 반문형을 그대로 살려 신학적 초점을 보존합니다.
  doctrine_reference: 이사야 40:13–14 문맥; 번역 원칙 §1, §3
