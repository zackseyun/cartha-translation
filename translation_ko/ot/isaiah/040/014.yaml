    rationale: אֶת מִי는 ‘누구와’가 아니라 ‘누구를/누구에게’라는 목적어 관계입니다. ‘누구와 의논하다’는 하나님이 상대방과 공동으로 숙의했다는 뉘앙스를 낼 수 있어, ‘누구에게 조언을 구하다’가 원문의 ‘상담하다, 조언을 구하다’를 더 정확히 반영합니다.
