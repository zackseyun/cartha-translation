id: ISA.40.10
reference: Isaiah 40:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord YHWH.'' English ''the Lord GOD'' reflects the combined title אֲדֹנָי יְהוִה and avoids the awkward ''Lord LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'will come with might.' The Hebrew can be rendered with a more explicit future sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'his arm is ruling on his behalf.'
    reason: lexical_alternative
  - marker: d
    text: Or 'his wages ... and his compensation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 주 하나님께서 능력으로 오십니다. 그의 팔이 그를 위하여 다스립니다. 보십시오, 그의 상급이 그와 함께 있고, 그의 보상이 그 앞에 있습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주 야훼’에 해당하는 결합 호칭입니다. 한국어 본문은 중복을 피하면서 그 결합을 ‘주 하나님’으로 반영했습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘능력 있게 오십니다.’ 히브리어는 보다 명시적으로 미래를 나타내어도 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 팔이 그를 대신하여 다스립니다.’
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 삯 … 그의 보수’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 예언적 호소와 강조를 살리면서도 현대 한국어에서 자연스럽고 공손한 경구로 들리게 했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 합쳐진 호칭의 중복을 피하면서 두 요소를 함께 드러내는 표현으로 옮겼습니다. 본문의 결합 호칭 효과를 유지하려고 ‘주’와 ‘하나님’을 함께 사용했습니다.
- source_word: בְּחָזָק
  english_pob_choice: with strength
  chosen_korean: 능력으로
  alternatives_korean:
  - 힘으로
  - 강하게
  lexicon: HALOT
  rationale: 동반/방식의 ב를 한국어 부사격으로 자연스럽게 옮기되, 단순 수단이 아니라 강력한 오심의 뉘앙스를 살렸습니다.
- source_word: מֹשְׁלָה לוֹ
  english_pob_choice: rules for him
  chosen_korean: 그를 위하여 다스립니다
  alternatives_korean:
  - 그를 위해 다스립니다
  - 그를 대신하여 다스립니다
  - 그에게 속하여 다스립니다
  lexicon: HALOT
  rationale: משל의 통치 행위를 ‘다스리다’로 유지하고, לֹו의 귀속/대리 뉘앙스를 ‘그를 위하여’로 풀어 원문 관계를 드러냈습니다.
- source_word: שְׂכָרוֹ / וּפְעֻלָּתוֹ
  english_pob_choice: his reward / his recompense
  chosen_korean: 상급 / 보상
  alternatives_korean:
  - 보상금 / 대가
  - 삯 / 보수
  lexicon: HALOT
  rationale: 예언적·신학적 문맥에서 상업적 ‘삯’보다 ‘상급/보상’이 더 적절하며, 두 명사의 평행을 한국어에서도 구분해 살렸습니다.
theological_decisions:
- issue: 여호와식 전통 표기 대신 원문 호칭의 직접성 유지
  chosen_reading: ‘주 하나님’으로 옮기되, 본문 안에서 중복되는 ‘주 주’식 표현은 피했습니다.
  alternative_readings:
  - ‘주 야훼’
  - ‘주 여호와’
  rationale: 합쳐진 히브리어 칭호의 힘은 유지하면서도 한국어 가독성을 확보하기 위한 선택입니다. 본문은 공적 선포체이므로, 호칭의 위엄과 자연스러움이 함께 필요합니다.
  doctrine_reference: POB source-directness policy; divine name handling in OT prophetic titles
