  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
  footnotes:
  - marker: a
    text: Or 'to the powerless he multiplies strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 지친 이에게 힘을 주시고, 기력이 없는 이에게는 능력을 더해 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기력이 없는 이에게 힘을 곱해 주십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵ֥ן
  english_pob_choice: gives
  chosen_korean: 주십니다
  alternatives_korean:
  - 주십니다(현재적 반복)
  - 주고 계십니다
  lexicon: HALOT
  rationale: 분사형이 나타내는 하나님의 상시적·일반적 행위를 한국어 현재형 존대 동사로 자연스럽게 살렸습니다.
- source_word: לַיָּעֵ֖ף
  english_pob_choice: to the weary
  chosen_korean: 지친 이에게
  alternatives_korean:
  - 피곤한 이에게
  - 기진한 이에게
  lexicon: HALOT
  rationale: 지친 상태의 사람을 가리키는 의미를 현대 한국어에서 자연스럽고 문맥에 맞게 옮겼습니다.
- source_word: וּלְאֵ֥ין אוֹנִ֖ים
  english_pob_choice: to the one without vigor
  chosen_korean: 기력이 없는 이에게는
  alternatives_korean:
  - 무기력한 이에게는
  - 힘이 없는 이에게는
  - 기운이 없는 이에게는
  lexicon: HALOT
  rationale: אין이 나타내는 결핍과 אוֹנִים의 ‘기력/힘’ 뜻을 살려, ‘없는 이’라는 단수적 표현으로 원문의 구조를 반영했습니다.
- source_word: עָצְמָ֥ה יַרְבֶּֽה
  english_pob_choice: he increases might
  chosen_korean: 능력을 더해 주십니다
  alternatives_korean:
  - 힘을 더해 주십니다
  - 강함을 더해 주십니다
  - 능력을 증가시키십니다
  lexicon: HALOT
  rationale: יַרְבֶּה의 ‘늘리다/더하다’와 עָצְמָה의 ‘힘, 능력’ 의미를 살리되, 앞의 ‘힘’과 중복을 피하면서 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 암시된 주어
  chosen_reading: 문맥상 야훼를 가리키는 암시된 주어를 ‘그분은’으로 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 직역형
  - ‘주님은’
  rationale: 본절은 주어를 명시하지 않지만 바로 앞뒤 문맥에서 야훼의 성품과 행위가 이어지므로, 한국어에서는 문맥상 주어를 보충해 독해를 분명하게 했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 주어 보충
