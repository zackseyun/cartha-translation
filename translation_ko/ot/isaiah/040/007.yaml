source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
  footnotes:
  - marker: a
    text: Or 'the wind of the LORD blows on it'; less likely here, 'the Spirit of the LORD blows on it.'
    reason: alternative_reading
translation:
  language: ko
  text: 풀은 마르고 꽃은 시듭니다. 야훼의 숨결[a]이 그 위에 불기 때문입니다. 참으로 백성은 풀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 바람이 그 위에 분다’로 옮길 수 있습니다. 여기서는 ‘야훼의 영’이라는 뜻일 가능성은 더 낮습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֵשׁ / חָצִיר
  english_pob_choice: the grass dries up
  chosen_korean: 풀은 마르고
  alternatives_korean:
  - 풀은 마릅니다
  - 풀이 마르고
  lexicon: HALOT
  rationale: 시적인 병행구에서 grass를 ‘풀’로, dries up를 ‘마르고’로 옮겨 자연스러운 현대 한국어와 건조·쇠잔의 이미지를 함께 살렸습니다.
- source_word: נָבֵל / צִיץ
  english_pob_choice: the flower withers
  chosen_korean: 꽃은 시듭니다
  alternatives_korean:
  - 꽃은 시들어 갑니다
  - 꽃은 위듭니다
  lexicon: HALOT
  rationale: withers/flower의 대응을 한국어에서 가장 직접적으로 드러내는 표현은 ‘꽃은 시듭니다’이므로, 시적 평행을 유지하면서도 과도하게 의역하지 않았습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the breath of Yahweh
  chosen_korean: 야훼의 숨결
  alternatives_korean:
  - 야훼의 바람
  - 야훼의 영
  lexicon: HALOT
  rationale: POB의 ‘breath’를 따르되, 한국어에서 רוּחַ의 생명적·직접적 작용을 살리기 위해 ‘숨결’을 선택했습니다. 문맥상 ‘바람’도 가능하지만, 여기서는 하나님의 능동적 작용을 더 분명히 드러냅니다.
- source_word: נָשְׁבָה בּוֹ
  english_pob_choice: blows on it
  chosen_korean: 그것 위에 불었기 때문입니다
  alternatives_korean:
  - 그 위에 불기 때문입니다
  - 그것에 불었기 때문입니다
  lexicon: HALOT
  rationale: 동사 נָשַׁב의 기본 의미인 ‘불다’를 보존하면서, בּוֹ를 ‘그것 위에’로 자연스럽게 옮겨 대상에 미치는 영향을 나타냈습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 고유명칭을 대체 титulus로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’를 사용해 원문이 가진 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רוּחַ יְהוָה의 의미 범위
  chosen_reading: 야훼의 숨결
  alternative_readings:
  - 야훼의 바람
  - 야훼의 영
  rationale: 이 절은 식물의 쇠잔이라는 이미지 안에서 하나님의 գործող을 묘사하므로, ‘성령’으로 좁히기보다 본문이 허용하는 보다 넓은 의미인 ‘숨결’을 유지하는 것이 source-direct합니다.
  doctrine_reference: Isaiah 40:7 context; רוּחַ semantic range
