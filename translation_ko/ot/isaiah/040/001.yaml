translation:
  language: ko
  text: “내 백성을 위로하십시오, 위로하십시오.[a]”라고 너희의 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 반복 명령은 강한 촉구를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: נַחֲמוּ נַחֲמוּ
  english_pob_choice: Comfort, comfort
  chosen_korean: 위로하십시오, 위로하십시오
  alternatives_korean:
  - 위로하시오, 위로하시오
  - 위로해 주십시오, 위로해 주십시오
  lexicon: HALOT
  rationale: 히브리어 반복 명령의 긴급하고 강한 어조를 한국어에서도 반복으로 살리되, 현대 예언문체에 맞게 합쇼체 명령으로 옮겼습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 사람들
  - 내 민족
  lexicon: HALOT
  rationale: עַם의 공동체적·언약적 의미를 살려 ‘백성’으로 옮겼고, 소유격 ‘내’를 그대로 유지해 하나님의 언약적 친밀감을 드러냈습니다.
- source_word: יֹאמַר
  english_pob_choice: says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 말씀하실 것입니다
  lexicon: HALOT
  rationale: 히브리어 예언문 맥락에서의 인용 도입을 현재형 선언으로 처리하고, 하나님 직접 발화에 맞는 경어적 표현을 선택했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 너희 하나님
  - 너희의 하나님
  lexicon: HALOT
  rationale: 문맥상 청중 전체를 향한 소유 관계를 살리면서, 예언적 선포의 직접성을 유지하는 평이한 한국어로 옮겼습니다.
theological_decisions:
- issue: 명령문과 위로의 대상 범위
  chosen_reading: ‘내 백성’을 직접 대상화하는 반복 명령으로 읽고, 별도의 대상을 보충하지 않았습니다.
  alternative_readings:
  - ‘위로하십시오, 위로하십시오’ 뒤에 ‘그들을’ 같은 대상을 암시하는 읽기
  rationale: 원문은 반복 명령 뒤에 목적어를 간결하게 두며, 언약 백성을 향한 하나님의 위로 명령 자체가 핵심이므로 의미를 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 하나님 직접 인용의 문체
  chosen_reading: 하나님을 지칭하는 부분은 합쇼체 ‘말씀하십니다’를 사용해 공적인 예언 선언의 무게를 살렸습니다.
  alternative_readings:
  - ‘말씀하신다’
  - ‘말한다’
  rationale: 한국어 예언서 문맥에서 하나님 직접 발화는 존칭을 통해 자연스럽게 전달되며, 원문의 장중함과 경외감을 손상하지 않습니다.
  doctrine_reference: Korean style guide; reverence in direct divine speech
