  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר וְ/חַיָּת֔/וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
  footnotes:
  - marker: a
    text: Lebanon likely evokes its famous forests; the sense is that even all its wood would not suffice for the fire.
    reason: cultural_note
  - marker: b
    text: Or 'its beasts'; the Hebrew may specifically suggest the animals of Lebanon as sacrificial victims.
    reason: lexical_alternative
translation:
  language: ko
  text: 레바논도 태울 만큼 충분하지 않으며, 그 짐승들도 번제물로 충분하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 레바논은 유명한 숲, 곧 목재가 풍부한 지역을 가리키는 환유일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그 짐승들’; 히브리어는 레바논의 동물들을 제물로 보는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  english_pob_choice: Lebanon
  chosen_korean: 레바논
  alternatives_korean:
  - 레바논의 숲들
  - 레바논의 산림
  lexicon: HALOT
  rationale: 지명 자체를 그대로 살리되, 문맥상 레바논의 유명한 산림이 환유적으로 떠오르도록 본문에 직접 풀지 않았습니다.
- source_word: אֵין דֵּי
  english_pob_choice: is not enough
  chosen_korean: 충분하지 않습니다
  alternatives_korean:
  - 넉넉하지 않습니다
  - 부족합니다
  lexicon: HALOT
  rationale: ‘있다/없다’의 수량적 부족을 한국어에서 자연스럽게 드러내는 표현으로, 비교·과장의 수사에 맞게 압축했습니다.
- source_word: בָּעֵר
  english_pob_choice: to burn
  chosen_korean: 태울 만큼
  alternatives_korean:
  - 불태우기에
  - 연료로 삼기에
  lexicon: HALOT
  rationale: 여기서는 연료를 태우는 의미이므로 동작의 목적을 살려 ‘태울 만큼’으로 옮겨, 뒤의 번제 이미지와 연결했습니다.
- source_word: וְחַיָּתוֹ
  english_pob_choice: its animals
  chosen_korean: 그 짐승들
  alternatives_korean:
  - 그 동물들
  - 그 야생 짐승들
  lexicon: HALOT
  rationale: 히브리어 חיה의 제의적·야생적 뉘앙스를 고려해 ‘짐승들’로 옮겼으며, POB의 대안인 ‘beasts’의 긴장을 반영했습니다.
- source_word: עוֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전제
  lexicon: HALOT
  rationale: 표준 제의 용어로서 ‘번제물’을 사용해, 단순한 ‘태움’이 아니라 제사의 전부를 하나님께 드리는 의미를 보존했습니다.
theological_decisions:
- issue: 레바논과 동물의 과장된 제의 이미지
  chosen_reading: 이 절은 레바논의 모든 목재와 생물이 하나님의 위엄에 합당한 제사를 드리기에도 충분하지 않다는 과장법으로 이해했습니다.
  alternative_readings:
  - 일반적으로 인간 예배의 자원이 부족하다는 뜻으로 넓게 읽는 해석
  rationale: 문맥(이사야 40:12–17)이 하나님의 유일무이하심과 피조세계의 한계를 강조하므로, 제의 언어를 유지한 채 그 수사적 과장을 본문 수준에서 반영했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 문맥이 허용하는 범위를 넘는 신학적 일반화는 피합니다.
