- from: 그는 땅의 원 위에 앉아 계시며 그 땅의 주민들은 메뚜기와 같습니다. 그분은 하늘들을 휘장처럼 펴시고, 거처할 천막처럼 펼치십니다.[a][b]
  to: 그는 땅의 원[a] 위에 앉아 계시며, 그 주민들은 메뚜기와 같습니다. 그분은 하늘을 휘장[b]처럼 펴시고, 거처로 삼을 천막처럼 펼치십니다.
