source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ עַל ח֣וּג הָ/אָ֔רֶץ וְ/יֹשְׁבֶ֖י/הָ כַּ/חֲגָבִ֑ים הַ/נּוֹטֶ֤ה כַ/דֹּק֙ שָׁמַ֔יִם וַ/יִּמְתָּחֵ֥/ם כָּ/אֹ֖הֶל לָ/שָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
  footnotes:
  - marker: a
    text: Or 'vault' or 'horizon' of the earth.' The Hebrew word can denote a circular expanse or dome-like boundary.
    reason: lexical_alternative
  - marker: b
    text: Or 'like gauze' or 'like a veil.' The Hebrew term refers to something thin or fine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 땅의 원[a] 위에 앉아 계시며, 그 주민들은 메뚜기와 같습니다. 그분은 하늘을 휘장[b]처럼 펴시고, 거처로 삼을 천막처럼 펼치십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 돔’이나 ‘땅의 지평선’. 히브리어는 원형의 넓은 공간이나 돔 같은 경계를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘얇은 천’이나 ‘베일’. 히브리어는 얇고 섬세한 물질을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  english_pob_choice: He is the one who sits
  chosen_korean: 앉아 계시며
  alternatives_korean:
  - 앉아 계신 분은
  - 좌정해 계시며
  lexicon: HALOT
  rationale: 현재분사적 성격을 살리면서 자연스러운 서술로 옮겼습니다. ‘좌정하다’는 왕권 뉘앙스를 더 강하게 주므로, 본문에 없는 함의를 덜어냈습니다.
- source_word: חוּג הָאָרֶץ
  english_pob_choice: the circle of the earth
  chosen_korean: 땅의 원
  alternatives_korean:
  - 땅의 둥근 테두리
  - 땅의 원형
  - 땅의 궁창
  lexicon: HALOT
  rationale: 시적·우주론적 이미지를 과도하게 해석하지 않으면서, 원문의 직접적 이미지인 ‘원’을 살렸습니다.
- source_word: כַּחֲגָבִים
  english_pob_choice: like grasshoppers
  chosen_korean: 메뚜기와 같습니다
  alternatives_korean:
  - 메뚜기들 같습니다
  - 누리와 같습니다
  lexicon: HALOT
  rationale: 비유의 소박하고도 작은 존재감을 살리기 위해 직역에 가까운 ‘메뚜기’를 택했습니다. 한국어에서 더 자연스럽게 비교를 표시하기 위해 ‘-와 같습니다’를 사용했습니다.
- source_word: כַּדֹּק
  english_pob_choice: like a curtain
  chosen_korean: 휘장처럼
  alternatives_korean:
  - 얇은 천처럼
  - 장막처럼
  - 커튼처럼
  lexicon: HALOT
  rationale: דֹק의 ‘얇고 섬세한 천’이라는 뜻을 반영하되, 본문의 시적 이미지에 맞게 한국어 성경에서 익숙한 ‘휘장’으로 옮겼습니다. 다만 전통 교회 용어로 완전히 고정하기보다 비유적 얇음을 드러내는 표현으로 사용했습니다.
theological_decisions:
- issue: 하늘과 거처 이미지의 시적·우주론적 표현
  chosen_reading: ‘하늘들을 휘장처럼 펴시고, 거처할 천막처럼 펼치십니다’로, 창조주 하나님의 초월성과 능력을 시적으로 유지했습니다.
  alternative_readings:
  - 하늘을 휘장처럼 펼치시고
  - 하늘들을 장막처럼 치십니다
  rationale: 본문은 과학적 진술이 아니라 하나님의 초월성과 창조 권능을 강조하는 시입니다. 따라서 현대 우주론으로 환원하지 않고, 원문이 주는 장엄한 비유를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
