base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: ko
  text: 우상은 장인이 주조하고, 금세공인이 그것에 금을 두드려 입히며 은사슬을 만듭니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּסֶל
  english_pob_choice: the idol
  chosen_korean: 우상
  alternatives_korean:
  - 신상
  - 조각상
  lexicon: פֶּסֶל
  rationale: 문맥상 예언적 우상 비판이며, POB의 'idol'에 맞추어 신학적 기능을 드러내는 '우상'이 가장 직접적입니다.
- source_word: נָסַךְ
  english_pob_choice: casts
  chosen_korean: 부어 만들다
  alternatives_korean:
  - 주조하다
  - 붓다
  lexicon: נָסַךְ
  rationale: 금속 형상을 액체 금속을 부어 만드는 주조의 뜻을 살리되, 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: יְרַקְּעֶנּוּ
  english_pob_choice: overlays it with gold
  chosen_korean: 금을 입히며
  alternatives_korean:
  - 금으로 덧입히며
  - 금판을 입히며
  lexicon: רקע
  rationale: 금박/금판을 두드려 입히는 동작을 간명하게 드러내어, 우상 제작의 과시적 외피를 살렸습니다.
- source_word: וּרְתֻק֥וֹת כֶּ֖סֶף
  english_pob_choice: silver chains
  chosen_korean: 은 사슬들
  alternatives_korean:
  - 은 사슬 장식들
  - 은 쇠사슬들
  lexicon: רתק
  rationale: 장식적이면서도 구속의 이미지를 함께 지닌 ‘사슬’의 기본 의미를 살렸고, 복수형은 한국어에서 자연스러운 복수 감각으로 풀었습니다.
theological_decisions:
- issue: 우상 제작의 조롱적 진술을 직설적으로 유지할지 여부
  chosen_reading: 예언자의 비판적 어조를 유지하여, 우상이 인간의 기술로 ‘만들어지는’ 대상임을 분명히 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘상’을 만들다
  - 중립적으로 ‘조형하다’
  rationale: 본문은 우상의 무기력함과 인간 제작성을 대비시키므로, 완화된 표현보다 직설적 표현이 स्रोत의 논지를 더 잘 전달합니다.
  doctrine_reference: 우상 숭배 비판 / 하나님의 초월성
