    issue: 각주 b의 대안 문구가 불완전함
    rationale: ‘시온에 좋은 소식을 전하는 자 … 예루살렘에’는 두 번째 병렬구와 전체 대안 구문을 명확히 제시하지 못합니다. 두 도시 모두를 대상으로 하는 선포자라는 독법을 완결된 문장으로 밝혀야 합니다.
