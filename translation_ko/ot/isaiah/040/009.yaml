id: ISA.40.9
reference: Isaiah 40:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
  footnotes:
  - marker: a
    text: Or, 'O Zion, bearer of good news, go up on a high mountain ... O Jerusalem, bearer of good news, lift up your voice with strength.' The Hebrew can also be read with Zion and Jerusalem as the heralds addressed directly.
    reason: alternative_reading
  - marker: b
    text: Or, 'you who bring good news to Zion ... to Jerusalem.' The feminine participle may describe the messenger rather than the city personified.
    reason: lexical_alternative
translation:
  language: ko
  text: 높은 산에 올라가십시오, 시온의 좋은 소식을 전하는 이여. 힘껏 네 목소리를 높이십시오, 예루살렘의 좋은 소식을 전하는 이여. 높이십시오. 두려워하지 마십시오. 유다의 성읍들에게 말하십시오. “보십시오, 너희의 하나님이십니다!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시온아, 좋은 소식을 전하는 이여, 높은 산에 올라가십시오 … 예루살렘아, 좋은 소식을 전하는 이여, 힘껏 네 목소리를 높이십시오.” 히브리어는 시온과 예루살렘을 좋은 소식을 전하는 이로 직접 부르는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “시온에 좋은 소식을 전하는 이여 … 예루살렘에 좋은 소식을 전하는 이여.” 여성형 분사는 사자 자체를 가리킬 수도 있고, 도시를 의인화하여 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַשֶּׂרֶת
  english_pob_choice: bearer of good news
  chosen_korean: 좋은 소식을 전하는 자
  alternatives_korean:
  - 복음을 전하는 자
  - 기쁜 소식을 전하는 자
  lexicon: HALOT
  rationale: 여성형 분사로서 ‘전하는 자’의 현재적·지속적 성격을 살리면서, ‘좋은 소식’으로 공적 선포의 내용을 자연스럽게 드러냅니다.
- source_word: עֲלִי / הָרִימִי
  english_pob_choice: Go up / lift up
  chosen_korean: 올라가라 / 높이라
  alternatives_korean:
  - 올라가라 / 들어 올리라
  - 오르라 / 높여라
  lexicon: HALOT
  rationale: עלה와 רום의 반복 명령을 한국어에서도 반복으로 살려 선포의 긴박성과 강조를 유지합니다.
- source_word: בַכֹּחַ
  english_pob_choice: with strength
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 힘 있게
  - 힘을 다해
  lexicon: HALOT
  rationale: 문맥상 목소리를 높이는 행위를 수식하므로, 한국어에서는 자연스럽게 ‘큰 소리로’로 옮겨 힘의 개념을 발화의 세기로 표현했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 너희의 하나님
  alternatives_korean:
  - 너희 하나님
  - 너희의 하느님
  lexicon: HALOT
  rationale: 복수 소유격을 분명히 드러내며, 본문이 야훼가 아닌 일반명사 אֱלֹהִים을 사용하므로 ‘하나님’으로 번역했습니다.
theological_decisions:
- issue: ‘시온 / 예루살렘’과 여성형 분사 מְבַשֶּׂרֶת의 관계
  chosen_reading: 본문의 주요 흐름을 따라 ‘시온의 좋은 소식을 전하는 자’, ‘예루살렘의 좋은 소식을 전하는 자’로 옮기되, 도시 자체를 선포자로 단정하지는 않았습니다.
  alternative_readings:
  - “시온아, 좋은 소식을 전하는 자여…”
  - “시온에 좋은 소식을 전하는 자여…”
  rationale: 히브리어는 도시를 직접 부르는 호격으로도, 그 도시에 관한 선포의 대상으로도 읽힐 수 있으므로, 본문이 허용하는 긴장을 과도하게 해소하지 않도록 한국어도 중립적으로 유지했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
