  naturalness: ‘혹은’으로 대안을 명시하고 각 청원절을 독립시켜 문장 구조를 자연스럽게 바로잡았습니다. 현대 표준어 합쇼체에는 ‘평화를 이루게 하십시오’가 ‘화평을 이루게 하십시오’보다 더 자연스럽고, 관계적 화해의 의미도 충분히 전달합니다.
  terminology: ‘요새’는 מָעוֹז의 방어·피난 은유를 적절히 보존합니다. 각주에서는 ‘피난처’ 및 ‘보호처’를 가능한 대안으로 제시하여, 원어의 의미 범위를 과도하게 좁히지 않았습니다. ‘평화’는 שָׁלוֹם의 관계적 화해 의미를 문맥상 자연스럽게 전달합니다.
