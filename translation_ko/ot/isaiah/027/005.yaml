source:
  edition: WLC
  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
  footnotes:
  - marker: a
    text: Or 'my refuge' or 'my protection' for 'my stronghold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내 요새를 붙들거나, 나와 화평을 이루게 하십시오. 그가 나와 화평을 이루게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새’는 מָעוֹז의 주요 뜻인 ‘피난처’나 ‘보호’도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  english_pob_choice: Or
  chosen_korean: 혹은
  alternatives_korean:
  - 또는
  - 아니면
  lexicon: HALOT
  rationale: 앞절의 심판적 문맥에 대비되는 대안을 여는 접속사로, 한국어에서는 간결한 선택 연결어인 ‘혹은’이 가장 자연스럽습니다.
- source_word: יַחֲזֵק בְּמָעוּזִּי
  english_pob_choice: let him take hold of my stronghold
  chosen_korean: 내 요새를 붙들거나
  alternatives_korean:
  - 내 피난처를 붙들거나
  - 내 보호를 붙들거나
  - 내 힘을 붙들거나
  lexicon: HALOT
  rationale: מָעוֹז의 핵심은 보호용 요새/피난처의 이미지이므로, 문맥의 군사적·보호적 은유를 살려 ‘요새’로 옮겼습니다. ב의 전치사값은 한국어 동사 구문에 흡수했습니다.
- source_word: שָׁלוֹם לִי
  english_pob_choice: make peace with me
  chosen_korean: 나와 화평을 이루게 하십시오
  alternatives_korean:
  - 나와 평화를 이루게 하십시오
  - 나와 화목을 이루게 하십시오
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 내적 평안보다 관계 회복의 뜻이 분명하므로, 전통적 교회어의 ‘화평’을 살리되 현대어 문장으로 정리했습니다.
- source_word: שָׁלוֹם יַעֲשֶׂה לִּי
  english_pob_choice: let him make peace with me
  chosen_korean: 그가 나와 화평을 이루게 하십시오
  alternatives_korean:
  - 그가 나와 평화를 이루게 하십시오
  - 그가 나와 화목을 이루게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 반복을 한국어에서도 그대로 되살려, 요청의 긴박함과 강조를 유지했습니다.
theological_decisions:
- issue: 하나님의 직접 발화와 초청의 어조
  chosen_reading: 주어를 명시하지 않고, 본문이 드러내는 하나님 자신의 초청으로 읽히도록 ‘그가’로 유지했습니다.
  alternative_readings:
  - ‘그는’ 대신 일반적 제3인칭으로 흐리게 처리
  - 수동적으로 풀어 초청성을 약화
  rationale: 이 절은 하나님이 자신에게 피난과 화해를 권면하는 문맥이므로, 신학적 직접성을 완화하지 않고 문장만 자연스럽게 다듬었습니다.
  doctrine_reference: 원문 1인칭 신적 화법의 보존
- issue: מרכז 은유의 선택
  chosen_reading: ‘요새’로 옮겨 보호와 피난의 물리적 은유를 유지했습니다.
  alternative_readings:
  - ‘피난처’
  - ‘보호’
  rationale: 문맥의 חזק/מעוז 조합은 추상적 안전보다 견고한 방어 거점을 떠올리게 하므로, 은유의 강도를 살리는 번역을 택했습니다.
  doctrine_reference: 원문 은유의 보존
