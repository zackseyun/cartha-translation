id: ISA.27.3
reference: Isaiah 27:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ נֹֽצְרָ֔/הּ לִ/רְגָעִ֖ים אַשְׁקֶ֑/נָּה פֶּ֚ן יִפְקֹ֣ד עָלֶ֔י/הָ לַ֥יְלָה וָ/י֖וֹם אֶצֳּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
  footnotes:
  - marker: a
    text: Or 'I water it every moment' or 'from moment to moment.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lest anyone attack it' or 'lest anyone visit punishment upon it.' The Hebrew verb can carry the sense of hostile intervention or punitive visitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가, 야훼는 그것의 지키는 이이며[a], 나는 그것에 계속 물을 줍니다. 누가 그것을 징벌하지 못하게 하려고, 나는 밤낮 그것을 지킵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그것에 매 순간 물을 준다’/‘순간마다 물을 준다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 성호 יְהוָה를 고유한 신적 이름으로 드러내기 위해, 관습적 대치어인 ‘주님’ 대신 음역형 ‘야훼’를 사용했습니다.
- source_word: נֹצְרָהּ
  english_pob_choice: am its keeper
  chosen_korean: 그것의 지키는 이
  alternatives_korean:
  - 그것을 지키는 이
  - 그것의 보호자
  - 그것을 지키는 자
  lexicon: HALOT
  rationale: נצר의 ‘지키다/보호하다’ 의미를 살리되, 뒤의 동사 ‘지킨다’와 중복을 줄이기 위해 서술적 명사구로 옮겼습니다.
- source_word: לִרְגָעִים
  english_pob_choice: continually
  chosen_korean: 계속
  alternatives_korean:
  - 끊임없이
  - 항상
  - 순간마다
  lexicon: HALOT
  rationale: 직역하면 ‘순간마다’이지만, 문맥상 중단 없는 지속을 뜻하므로 자연스러운 합쇼체 문맥에서 ‘계속’으로 옮겼습니다.
- source_word: יִפְקֹד עָלֶיהָ
  english_pob_choice: anyone punish it
  chosen_korean: 누가 그것을 징벌하지 못하게
  alternatives_korean:
  - 누가 그것을 공격하지 못하게
  - 누가 그것에게 벌을 내리지 못하게
  - 누가 그것을 해치지 못하게
  lexicon: HALOT
  rationale: פקד עם על은 ‘방문하다’에서 확장되어 해로운 개입이나 징벌을 뜻할 수 있으므로, POB의 해석을 따라 ‘징벌’로 옮기되 주체는 한국어에서 자연스럽게 부정사구로 처리했습니다.
- source_word: לַיְלָה וָיוֹם
  english_pob_choice: night and day
  chosen_korean: 밤낮
  alternatives_korean:
  - 밤과 낮
  - 주야로
  lexicon: HALOT
  rationale: 히브리어의 관용적 총칭 표현을 한국어 관용구 ‘밤낮’으로 옮겨, 끊임없는 감시의 의미를 압축했습니다.
theological_decisions:
- issue: 여호와/주님의 대치 여부
  chosen_reading: 야훼로 직접 옮겨, 신적 이름의 고유성을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 일반 호칭이 아니라 여호와의 성호를 직접 사용하므로, POB의 원칙에 따라 고유 이름을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יִפְקֹד의 주체 처리
  chosen_reading: 불특정 주체를 한국어 ‘누가’로 처리해 위협 가능성을 열어 두었습니다.
  alternative_readings:
  - 그가
  - 적이
  - 누군가
  rationale: 히브리어 원문은 명시 주어가 없고, 문맥상 포도원을 향한 어떤 해로운 개입도 금지하는 경고이므로 불특정 주체를 유지하는 것이 가장 원문에 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
