id: ISA.27.8
reference: Isaiah 27:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/סַּאסְּאָ֖ה בְּ/שַׁלְחָ֣/הּ תְּרִיבֶ֑/נָּה הָגָ֛ה בְּ/רוּח֥/וֹ הַ/קָּשָׁ֖ה בְּ/י֥וֹם קָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
  footnotes:
  - marker: a
    text: Or 'With restraint' or 'In exact measure'; the Hebrew term is rare and likely conveys that the judgment was limited rather than annihilating.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew keeps the feminine pronoun 'her,' likely personifying Zion/Israel/the people as a woman.
    reason: alternative_reading
  - marker: c
    text: The 'east wind' is a stock image for a scorching, destructive wind from the desert.
    reason: cultural_note
translation:
  language: ko
  text: 분량대로[a], 그분이 그녀를 내보내실 때, 그분은 그녀와 다투셨습니다[b][c]; 그분은 동풍이 불던 날에 자기의 거센 바람으로 그녀를 몰아내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절제하여’, ‘정확한 분량으로’. 이 희귀한 표현은 심판이 완전한 파괴가 아니라 제한된 범위 안에서 이루어졌다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여성형 대명사 ‘그녀’를 유지하며, 문맥상 시온/이스라엘/백성을 여성으로 의인화한 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: ‘동풍’은 사막에서 불어오는 뜨겁고 파괴적인 바람을 가리키는 관용적 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  english_pob_choice: By measure
  chosen_korean: 분량대로
  alternatives_korean:
  - 절제하여
  - 정확한 분량으로
  lexicon: HALOT
  rationale: 희귀한 부사는 심판이 전면적 파괴가 아니라 제한된 분량 안에서 행해졌다는 뜻을 담으므로, 간결한 ‘분량대로’로 측정성과 절제의 뉘앙스를 살렸습니다.
- source_word: בְּשַׁלְחָהּ
  english_pob_choice: when you sent her away
  chosen_korean: 그분이 그녀를 내보내실 때
  alternatives_korean:
  - 그분이 그녀를 쫓아내실 때
  - 그녀를 보내실 때
  lexicon: HALOT
  rationale: 3인칭 여성 접미사를 살려 여성화된 대상에 대한 추방/해제를 나타내되, ‘내보내다’로 다소 넓고 자연스럽게 옮겨 원문의 판단적 뉘앙스를 유지했습니다.
- source_word: תְּרִיבֶנָּה
  english_pob_choice: you contended with her
  chosen_korean: 그분은 그녀와 다투셨습니다
  alternatives_korean:
  - 그분은 그녀와 변론하셨습니다
  - 그분은 그녀를 두고 다투셨습니다
  lexicon: HALOT
  rationale: ריב의 법정적·언쟁적 성격을 살리면서도 현대 한국어에서 자연스럽게 읽히는 ‘다투다’로 옮겨, covenant-lawsuit의 긴장을 지나치게 풀지 않았습니다.
- source_word: הָגָה בְּרוּחוֹ הַקָּשָׁה
  english_pob_choice: he drove her out with his fierce wind
  chosen_korean: 그분은 자기의 거센 바람으로 그녀를 몰아내셨습니다
  alternatives_korean:
  - 그분은 자기의 강한 바람으로 그녀를 몰아내셨습니다
  - 그분은 자기의 험한 바람으로 그녀를 몰아내셨습니다
  lexicon: HALOT
  rationale: הָגָה는 निर्णी어진 제거보다 강제적 추방의 이미지를 띠므로 ‘몰아내다’가 적절하며, הַקָּשָׁה는 바람과 결합할 때 파괴적 강도를 드러내어 ‘거센’으로 옮겼습니다.
- source_word: בְּיוֹם קָדִים
  english_pob_choice: on the day of the east wind
  chosen_korean: 동풍이 불던 날에
  alternatives_korean:
  - 동풍의 날에
  - 해뜨는 바람이 불던 날에
  lexicon: HALOT
  rationale: קָדִים의 관용적 의미인 ‘동풍’을 유지하되, 한국어에서 자연스러운 서술을 위해 ‘불던 날에’로 풀어 동풍의 파괴적 배경을 드러냈습니다.
theological_decisions:
- issue: 여성형 목적어의 지시 대상
  chosen_reading: 주요 본문에서는 ‘그녀’를 그대로 유지해 지시 대상을 특정하지 않았습니다.
  alternative_readings:
  - 이스라엘
  - 시온
  - 포도원/백성의 여성화된 의인화
  rationale: 문맥상 여성화된 공동체를 가리키지만, 본절 자체는 대상을 명시하지 않으므로 ‘그녀’를 보존해 원문의 의인화와 해석 여지를 함께 유지했습니다.
  doctrine_reference: 원문 우선과 해석 보류
- issue: 2인칭과 3인칭의 교체
  chosen_reading: ‘그분이 … 하셨습니다’로 통일해 한국어에서 자연스럽게 읽히도록 하되, 두 동작 모두 원문의 심판 행위를 유지했습니다.
  alternative_readings:
  - 직접대명사 ‘당신’과 ‘그가’의 교차를 그대로 반영
  - 둘 다 동일한 주어로 매끄럽게 평탄화
  rationale: 히브리어의 시적 주어 전환은 보존 가치가 있으나, 한국어 문장으로서는 주어를 반복해 의미를 분명하게 하는 편이 가독성과 본문 충실성의 균형이 좋습니다.
  doctrine_reference: 시적 주어 전환의 의미 보존
