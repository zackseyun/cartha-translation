  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
  footnotes:
  - marker: a
    text: Or 'Leviathan the swift serpent' for 'the fleeing serpent.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Leviathan the crooked serpent' for 'the twisting serpent.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the sea monster' for 'the dragon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 야훼께서는 자신의 맹렬하고 크고 강한 칼로 달아나는 뱀 리워야단[a]과 굽이치는 뱀 리워야단[b]을 벌하실 것이며, 바다에 있는 용[c]을 죽이실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달아나는 뱀’은 ‘빠르게 달리는 뱀’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굽이치는 뱀’은 ‘구부러진 뱀’ 또는 ‘뒤틀린 뱀’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘용’은 ‘바다 괴물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그때에
  - 그 날
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간 표현을 한국어로 자연스럽게 옮기되, 종말론적·문학적 울림을 유지했습니다.
- source_word: יִפְקֹד
  english_pob_choice: will punish
  chosen_korean: 벌하시며
  alternatives_korean:
  - 찾아가시며
  - 돌보시며
  - 심판하시며
  lexicon: HALOT
  rationale: 여기서는 עַל과 함께 적대적 대상에 대한 심판적 ‘찾아오심’의 뜻이므로, 현대 한국어에서 그 의미가 분명한 ‘벌하다’ 계열로 옮겼습니다.
- source_word: לִוְיָתָן / נָחָשׁ עֲקַלָּתוֹן
  english_pob_choice: Leviathan the fleeing serpent / Leviathan the twisting serpent
  chosen_korean: 도망하는 뱀 리워야단, 뒤틀린 뱀 리워야단
  alternatives_korean:
  - 달아나는 뱀 리워야단, 구불구불한 뱀 리워야단
  - 빠져나가는 뱀 리워야단, 비틀린 뱀 리워야단
  lexicon: HALOT
  rationale: 리워야단은 고유의 괴수명으로 음역했고, נָחָשׁ는 격조 높은 ‘뱀’으로 유지했습니다. בָּרִחַ는 ‘도망하는/달아나는’으로, עֲקַלָּתוֹן은 ‘뒤틀린’으로 옮겨 평행 구조를 살렸습니다.
- source_word: בְּחַרְבּוֹ הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  english_pob_choice: with his fierce and great and strong sword
  chosen_korean: 그 맹렬하고 크고 강한 칼로
  alternatives_korean:
  - 그 거칠고 크고 강한 칼로
  - 그 사납고 크고 강한 칼로
  lexicon: HALOT
  rationale: 칼의 성격을 나타내는 세 형용사를 한국어로 병렬해 과장된 심판 무기를 살렸고, 원문의 도구격을 ‘-로’로 나타냈습니다.
- source_word: הַתַּנִּין
  english_pob_choice: the dragon
  chosen_korean: 용
  alternatives_korean:
  - 바다 괴물
  - 바다 용
  - 괴물
  lexicon: HALOT
  rationale: 시적·신화적 이미지에서 한국어 성경 전통과 현대 독자의 가독성을 함께 고려해 ‘용’으로 옮겼습니다.
theological_decisions:
- issue: 리워야단과 바다의 용의 해석
  chosen_reading: 본문이 제시하는 혼돈 괴수 이미지를 본문 안에서 그대로 유지하고, 특정 역사 세력이나 사탄으로 단정하지 않았습니다.
  alternative_readings:
  - 리워야단을 악의 상징으로 해석
  - 리워야단을 제국/열강의 상징으로 해석
  - 리워야단을 사탄으로 직접 동일시
  rationale: 히브리어 본문은 리워야단과 바다의 용을 명시하지만, 이 구절 자체에서 그 지시 대상을 한정해 풀어주지 않습니다. 따라서 신학적 긴장을 보존하기 위해 시적 이미지를 그대로 살렸습니다.
  doctrine_reference: 본문의 상징을 본문 수준에서 유지
