  source_fidelity: 히브리어의 시간적 도입(הבאים), 야곱/이스라엘의 병행, 성장 이미지, 그리고 마지막의 복수 동사는 전반적으로 잘 반영되었습니다. 다만 תְּנוּבָה(‘열매/소출’)에 관한 각주가 앞선 ‘꽃필 것입니다’에 붙어 있어 해당 어휘의 위치와 맞지 않습니다.
  naturalness: ‘세상의 얼굴을 열매로 가득 채울 것입니다’는 히브리어 이미지를 지나치게 직역하여 한국어에서는 다소 부자연스럽습니다. ‘온 세상을 열매로 가득 채울 것입니다’가 자연스러우면서도 ‘세상의 표면을 생산물로 채우다’라는 뜻을 충실히 전달합니다. 또한 식물이 주어일 때 ‘싹이 트고 꽃피다’가 ‘싹을 틔우고 꽃피다’보다 매끄럽습니다.
  terminology: ‘야곱’, ‘이스라엘’, ‘뿌리를 내리다’, ‘열매’는 적절합니다. תְּנוּבָה의 대안으로는 ‘소출’이 자연스럽지만, 본문의 ‘열매’도 문맥상 적절합니다.
