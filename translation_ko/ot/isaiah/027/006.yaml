- source_word: יַשְׁרֵשׁ
  english_pob_choice: will take root
  chosen_korean: 뿌리를 내릴 것입니다
  alternatives_korean:
  - 뿌리내리게 할 것입니다
  - 뿌리를 내리게 할 것입니다
  - 뿌리내릴 것입니다
  lexicon: HALOT
  rationale: 히필형의 뉘앙스를 과도하게 원인적으로 풀기보다, 야곱을 주어로 한 성장 은유에 맞게 ‘뿌리를 내리다’로 자연스럽게 옮겼습니다.
- source_word: יָצִיץ וּפָרַח
  english_pob_choice: will blossom and flower
  chosen_korean: 싹을 틔우고 꽃필 것입니다
  alternatives_korean:
  - 피고 꽃필 것입니다
  - 싹트고 피어날 것입니다
  - 꽃피고 피어날 것입니다
  lexicon: HALOT
  rationale: 두 동사의 병렬적 식물 이미지가 분명하므로, ‘싹을 틔우다/꽃피다’로 구체성을 유지하면서도 중복을 피했습니다.
- source_word: פְנֵי תֵבֵל
  english_pob_choice: the face of the world
  chosen_korean: 세상의 얼굴
  alternatives_korean:
  - 세계의 얼굴
  - 세상의 표면
  - 온 세상
  lexicon: HALOT
  rationale: פְנֵי의 직역인 ‘얼굴’을 유지해 히브리어의 이미지성을 살렸고, תֵבֵל은 ‘세상’으로 옮겨 이해 가능성을 확보했습니다.
- source_word: תְּנוּבָה
  english_pob_choice: fruit
  chosen_korean: 열매
  alternatives_korean:
  - 산출물
  - 소출
  - 생산물
  lexicon: HALOT
  rationale: 농경적 생산을 뜻하지만, 앞의 싹·꽃 은유와 연결될 때 한국어 성경 문맥에서는 ‘열매’가 가장 응축된 대응어입니다.
theological_decisions:
- issue: 야곱/이스라엘의 집합적 인격화
  chosen_reading: 두 이름을 그대로 보존하여 언약 백성이 인격화된 시적 표현으로 드러나게 했습니다.
  alternative_readings:
  - ‘야곱의 자손들’로 풀어쓰기
  - ‘이스라엘 백성’으로 명시하기
  rationale: 히브리어 평행법이 이름 자체를 통해 공동체 전체를 가리키므로, 본문을 확장 설명하지 않고 시적·신학적 긴장을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
