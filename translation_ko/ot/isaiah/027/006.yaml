revisions:
- from: 다가올 날들에 야곱은 뿌리를 내릴 것입니다[a]. 이스라엘은 싹을 틔우고 꽃필 것이며[b], 그들은 세상의 얼굴을 열매로 가득 채울 것입니다.
  to: 다가올 날들에 야곱은 뿌리를 내릴 것입니다[a]. 이스라엘은 싹이 트고 꽃필 것이며, 그들은 온 세상을 열매로 가득 채울 것입니다[b].
  rationale: 각주 b를 그것이 설명하는 ‘열매’에 직접 연결했습니다. 또한 ‘세상의 얼굴’을 한국어에서 자연스러운 ‘온 세상’으로, ‘싹을 틔우고’를 식물 성장 묘사에 더 자연스러운 ‘싹이 트고’로 조정했습니다. 야곱과 이스라엘을 그대로 두고 마지막 복수 대명사 ‘그들’을 유지하여 원문의 시적 병행과 수 일치를 보존했습니다.
