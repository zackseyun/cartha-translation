source:
  edition: WLC
  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
  footnotes:
  - marker: a
    text: 'Or, ''Those who come: Jacob will take root.'' The Hebrew opening may be read more literally as ''the coming ones,'' but in context it likely functions idiomatically as a temporal expression: ''in days to come.'''
    reason: alternative_reading
  - marker: b
    text: '''Fruit'' may also be rendered ''produce'' or ''yield.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다가올 날들에 야곱은 뿌리를 내릴 것입니다[a]. 이스라엘은 싹이 트고 꽃필 것이며, 그들은 온 세상을 열매로 가득 채울 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘오는 자들: 야곱은 뿌리를 내릴 것입니다.’ 히브리어의 첫머리는 더 문자적으로는 ‘오는 자들’로 읽을 수 있으나, 문맥상 관용적으로 ‘다가올 날들에’라는 시간 표현으로 기능할 가능성이 큽니다.'
    reason: alternative_reading
  - marker: b
    text: ‘열매’는 ‘소출’ 또는 ‘산출’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  english_pob_choice: In days to come
  chosen_korean: 다가올 날들에
  alternatives_korean:
  - 오는 자들
