id: ISA.27.2
reference: Isaiah 27:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֖וֹם הַ/ה֑וּא כֶּ֥רֶם חֶ֖מֶד עַנּוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/002.yaml
  text: 'In that day: “A pleasant vineyard”—sing of it![a][b]'
  footnotes:
  - marker: a
    text: Or 'A vineyard of delight'; the Hebrew phrase may be rendered more literally, though 'pleasant vineyard' is more natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'sing to it,' 'sing about it,' or 'respond concerning her'; the Hebrew verb can carry the sense of answering in song, and the feminine pronoun refers to the vineyard.
    reason: lexical_alternative
translation:
  language: ko
  text: '그 날에: “기쁜 포도원” — 그것을 노래하십시오![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּרֶם חֶמֶד은 문자적으로는 ‘기쁨/즐거움의 포도원’처럼 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עַנּוּ לָהּ는 ‘노래하십시오’, ‘응답하여 노래하십시오’, ‘그것에 대하여 노래하십시오’의 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 날에는
  lexicon: HALOT
  rationale: 예언문에서 반복되는 시간 표지로, 영어 POB의 ‘In that day’를 한국어로 자연스럽게 옮기되 종말론적·예언적 울림을 유지했습니다.
- source_word: כֶּרֶם חֶמֶד
  english_pob_choice: A pleasant vineyard
  chosen_korean: 기쁜 포도원
  alternatives_korean:
  - 즐거운 포도원
  - 사랑스러운 포도원
  - 기쁨의 포도원
  lexicon: HALOT
  rationale: כֶּרֶם은 ‘포도원’이 자연스럽고, חֶמֶד의 즐거움·기쁨의 뉘앙스를 살려 ‘기쁜’으로 옮겼습니다. ‘기쁨의 포도원’은 더 직역적이지만 한국어로는 다소 무겁습니다.
- source_word: עַנּוּ לָהּ
  english_pob_choice: sing of it
  chosen_korean: 그것을 노래하십시오
  alternatives_korean:
  - 그것에 노래하십시오
  - 그것을 향해 노래하십시오
  - 그것에 대하여 노래하십시오
  lexicon: HALOT
  rationale: עָנָה의 노래하는/응답하는 용법을 반영하되, 한국어에서는 ‘노래하다’가 가장 분명하게 시적 명령을 전달합니다. לָהּ의 여성형 지시를 포도원에 연결해 ‘그것을’로 처리했습니다.
theological_decisions:
- issue: 포도원을 여성형 대명사로 받는 표현
  chosen_reading: לָהּ를 포도원에 대한 여성형 지시로 보되, 한국어에서는 자연스러운 중성 대명사 ‘그것’으로 번역했습니다.
  alternative_readings:
  - ‘그녀’로 인격화하기
  - ‘그 포도원을 위해’로 풀기
  rationale: 히브리어에서는 포도원이 여성형으로 지시되지만, 한국어는 이를 인격화하지 않아도 의미가 충분히 전달됩니다. 원문의 지시 관계는 유지하면서 과도한 의인화를 피했습니다.
  doctrine_reference: 시적 의인화와 문법 성의 처리
