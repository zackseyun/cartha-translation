    reason: lexical_alternative
  - marker: b
    text: 히브리어 עַנּוּ לָהּ는 ‘그 포도원을 향해 노래하십시오’, ‘그 포도원에 관하여 노래하십시오’, 또는 ‘응답하여 노래하십시오’로도 이해될 수 있습니다. לָהּ의 여성 단수 대명사는 ‘포도원’을 가리킵니다.
    reason: lexical_alternative
