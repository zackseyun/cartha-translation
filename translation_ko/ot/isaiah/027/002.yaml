  source_fidelity: 시간 표지와 포도원 및 노래하라는 명령은 대체로 충실합니다. 그러나 חֶמֶד의 ‘바람직함, 사랑스러움, 즐거움’이라는 평가를 ‘기쁜’으로 옮기면 포도원이 기뻐하는 듯한 뜻으로 읽혀 원문의 수식 관계가 흐려집니다. 또한 לָהּ는 ‘그것을’이라는 직접목적어보다 ‘그것을 두고/그것에 관하여’의 관계를 나타내는 것으로 옮기는 편이 안전합니다.
  naturalness: ‘기쁜 포도원’은 현대 한국어에서 포도원의 성질을 나타내는 표현으로 다소 부자연스럽습니다. ‘사랑스러운 포도원’과 ‘그 포도원을 두고 노래하십시오’는 시적이면서도 현대의 격식 있는 문체에 자연스럽습니다.
