  - marker: b
    text: 히브리어는 이 비교에 나오는 대명사들의 지시 관계를 압축적으로, 다소 암시적으로 표현합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  english_pob_choice: Has he struck him as he struck
  chosen_korean: 그가 자신을 친 자를 친 것처럼 그를 치셨습니까?
  alternatives_korean:
  - 그를 친 자를 친 것처럼 그를 치셨습니까?
  - 그를 친 정도로 그를 치셨습니까?
  lexicon: HALOT
  rationale: 반복되는 כְּ 비교와 שאלת 수사구문을 살려, “~처럼”으로 비교를 드러내면서도 현대 한국어의 자연스러운 의문문으로 옮겼습니다.
- source_word: מַכֵּהוּ
  english_pob_choice: the one who struck him
  chosen_korean: 자신을 친 자
  alternatives_korean:
  - 그를 친 자
  - 그의 타격자
  lexicon: HALOT
  rationale: 남성 단수 행위자를 자연스럽게 드러내기 위해 “친 자”를 택했고, 지시 대상은 본문 문맥상 암시된 채로 두었습니다.
- source_word: הִכָּהוּ
  english_pob_choice: has he struck him
  chosen_korean: 그를 치셨습니까
  alternatives_korean:
  - 그를 쳤습니까
  - 그를 치셨습니까
  lexicon: HALOT
  rationale: 완전한 완료형의 수사적 질문을 한국어에서는 과거형보다 공손한 의문형으로 옮겨, 심판 행위의 확정성을 유지했습니다.
- source_word: הֲרֻגָיו / הֹרָג
  english_pob_choice: his slain ... has he been killed
  chosen_korean: 그의 죽임당한 자들이 죽임당한 것처럼 그도 죽임당하였습니까
  alternatives_korean:
  - 그의 죽임당한 자들이 죽임당한 것처럼 그도 죽임당했습니까
  - 그의 죽은 자들이 죽은 것처럼 그도 죽었습니까
  lexicon: HALOT
  rationale: פּסיבי/수동적 뉘앙스를 살리기 위해 “죽임당한”을 반복해 מקור의 대구를 보존했고, ‘살해되다’보다 덜 해석적인 표현을 택했습니다.
theological_decisions:
- issue: 수사적 비교가 가리키는 대상의 직접 명시 여부
  chosen_reading: 본문의 인칭 지시를 그대로 두고, 대상은 문맥이 드러내도록 유지했습니다.
  alternative_readings:
  - ‘이사야/이스라엘/야곱’을 본문에 직접 넣는 방식
  rationale: 히브리어가 이 절에서 대상을 압축적으로 생략하므로, 번역문에서 해석을 앞세우기보다 수사적 긴장을 보존하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선, 해석의 과잉 삽입 회피
