  text: 그를 친 자가 그를 친 것처럼, 그가 그를 치셨습니까? 아니면 그의 죽임당한 이들이 죽임당한 것처럼, 그도 죽임당하였습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
