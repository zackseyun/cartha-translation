  - severity: medium
    issue: 각주 a도 본문의 잘못된 관계를 반복합니다.
    rationale: ‘자신을 친 자의 타격’은 원문의 ‘그를 친 자’라는 압축된 대명사 관계를 ‘자신’으로 고정하며, 주된 비교 구조를 정확히 반영하지 못합니다.
  - severity: medium
