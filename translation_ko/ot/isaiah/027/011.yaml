revisions:
- from: 그것의 수확이 마르면, 부러집니다. 여인들이 와서 그것으로 불을 지릅니다. 이는 이해하는 백성이 아니기 때문입니다. 그러므로 그것을 만드신 분은 그것을 불쌍히 여기지 않으시고, 그것을 지으신 분은 은혜를 베풀지 않으실 것입니다.[a][b]
  to: 그 수확물이 마르면[a], 그것들이 부러지고 여인들이 와서 그것에 불을 붙입니다.[b] 이는 분별력이 없는 백성입니다. 그러므로 그 백성을 만드신 분은 그를 불쌍히 여기지 않으시고, 그를 지으신 분은 그에게 은혜를 베풀지 않으실 것입니다.
  rationale: 각주를 해당 어구에 직접 연결하여 표지 기능을 바로잡았습니다. ‘수확물’과 복수 지시어를 사용하여 수확된 식생이라는 기본 번역과 히브리어 여성 복수 동사를 함께 반영했습니다. 후반부는 집합 명사인 백성을 명시해 한국어의 반복적 ‘그것’을 피하면서도 원문의 단수 집합 지시를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:07Z'
