id: ISA.27.11
reference: Isaiah 27:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its harvest dries up[a], it is broken; women come and make a fire with it. For this is not a people of understanding; therefore its Maker will not have compassion on it[b], and the one who formed it will show it no favor.
  footnotes:
  - marker: a
    text: Or 'its branches' or 'its boughs' for 'its harvest'; the Hebrew term normally means 'harvest,' but here likely refers to the vine's cut growth that dries out and is used as fuel.
    reason: lexical_alternative
  - marker: b
    text: Or 'women come and burn it' / 'set it alight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 수확물이 마르면[a], 그것들이 부러지고 여인들이 와서 그것에 불을 붙입니다.[b] 이는 분별력이 없는 백성입니다. 그러므로 그 백성을 만드신 분은 그를 불쌍히 여기지 않으시고, 그를 지으신 분은 그에게 은혜를 베풀지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수확물’은 여기서 포도나무의 잘려 나온 가지나 마른 덩굴을 가리킬 수 있습니다. 히브리어는 보통 ‘수확’을 뜻하지만, 문맥상 불쏘시개로 쓰이는 식생을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여인들이 와서 그것에 불을 붙인다’는 ‘여인들이 와서 그것을 태운다’ 또는 ‘그것으로 불을 지른다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּיבֹשׁ
  english_pob_choice: when its harvest dries up
  chosen_korean: 그것의 수확이 마르면
  alternatives_korean:
  - 마를 때
  - 그것이 마르면
  - 그것의 가지가 마르면
  lexicon: HALOT
  rationale: 전치 בִּ + 동사형을 시간 조건으로 읽어 ‘마르면’으로 옮겼습니다. 농경 이미지에 맞게 자연스럽고, 다음 절의 ‘부러집니다’와도 잘 이어집니다.
- source_word: קְצִירָהּ
  english_pob_choice: its harvest
  chosen_korean: 그것의 수확
  alternatives_korean:
  - 그것의 가지
  - 그것의 가지치기한 부분
  - 그것의 베어낸 것
  lexicon: HALOT
  rationale: 기본 의미인 ‘수확’을 본문에 유지해 원문을 가깝게 따랐습니다. 다만 문맥상 잘려 나가 마르는 식생을 가리킬 수 있음을 주석으로 남길 수 있습니다.
- source_word: תִּשָּׁבַרְנָה
  english_pob_choice: it is broken
  chosen_korean: 부러집니다
  alternatives_korean:
  - 부러집니다(그것들이)
  - 잘려 부서집니다
  - 꺾입니다
  lexicon: HALOT
  rationale: 히브리어의 여성 복수형 형식을 한국어에서 자연스럽게 집합적 단수로 처리했습니다. 건조한 식생이 꺾이는 이미지를 살리기 위해 ‘부러집니다’를 택했습니다.
- source_word: נָשִׁים בָּאוֹת מְאִירוֹת אוֹתָהּ
  english_pob_choice: women come and make a fire with it
  chosen_korean: 여인들이 와서 그것으로 불을 지릅니다
  alternatives_korean:
  - 여인들이 와서 그것을 불태웁니다
  - 여인들이 와서 그것에 불을 붙입니다
  - 여인들이 와서 그것을 태웁니다
  lexicon: HALOT
  rationale: מְאִירוֹת은 문자적으로 ‘밝히다’에서 확장되어 연료로 사용함을 뜻할 수 있으므로, 현대 한국어로는 ‘불을 지르다’가 가장 자연스럽고 구체적인 대응입니다. POB의 ‘make a fire with it’의 도구적 의미도 유지합니다.
- source_word: לֹא עַם בִּינוֹת הוּא
  english_pob_choice: this is not a people of understanding
  chosen_korean: 이는 이해하는 백성이 아니기 때문입니다
  alternatives_korean:
  - 이는 깨닫는 백성이 아니기 때문입니다
  - 이는 분별 있는 백성이 아니기 때문입니다
  - 이는 지각 있는 백성이 아니기 때문입니다
  lexicon: HALOT
  rationale: בִּינוֹת은 단순 지식보다 분별과 이해를 뜻하므로 ‘이해하는’으로 옮겼습니다. 집단적 고발의 성격을 살리기 위해 ‘백성’으로 번역했습니다.
- source_word: לֹא יְרַחֲמֶנּוּ
  english_pob_choice: will not have compassion on it
  chosen_korean: 그것을 불쌍히 여기지 않으시고
  alternatives_korean:
  - 그것을 긍휼히 여기지 않으시고
  - 그것을 자비히 여기지 않으시고
  - 그것을 불쌍히 여기지 않으실 것입니다
  lexicon: HALOT
  rationale: רחם은 긍휼/자비의 의미가 있지만, 한국어 본문에서는 하나님의 자비를 일상적으로 드러내는 ‘불쌍히 여기다’가 자연스럽고 직접적입니다. 주어는 앞의 ‘그것’을 가리키는 집합적 대상입니다.
- source_word: וְיֹצְרוֹ
  english_pob_choice: the one who formed it
  chosen_korean: 그것을 지으신 분은
  alternatives_korean:
  - 그것을 빚으신 분은
  - 그것을 만드신 분은
  - 그것을 형성하신 분은
  lexicon: HALOT
  rationale: יָצַר는 빚다/형성하다의 뜻이지만, 한국어에서는 창조적 조형을 포괄하는 ‘지으신 분’이 문맥상 가장 자연스럽습니다. 앞의 ‘만드신 분’과 짝을 이루되 의미 중복을 과도하게 만들지 않습니다.
theological_decisions:
- issue: 창조자-피조물의 심판 역설
  chosen_reading: ‘그것을 만드신 분’과 ‘그것을 지으신 분’이라는 두 표현을 모두 살려, 같은 창조주께서 이해 없는 백성에게 긍휼을 거두시는 역설을 드러냈습니다.
  alternative_readings:
  - ‘하나님은 그들을 용서하지 않으실 것입니다’처럼 한 번으로 합침
  - 두 표현을 하나로 묶어 단순화
  rationale: 히브리어는 עשׂה와 יצר를 병치해 창조 행위를 두 겹으로 강조합니다. 이를 보존해야 심판의 무게와 창조-피조물 관계의 긴장이 살아납니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 감정 어휘의 선택
  chosen_reading: רחם을 ‘불쌍히 여기다’로 옮겨, 하나님의 자비가 끊기는 심판의 어조를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘긍휼을 베풀지 않으시고’
  - ‘자비를 베풀지 않으시고’
  rationale: 본문은 단순한 법정 언어보다 정서적·관계적 연민의 부재를 말합니다. ‘불쌍히 여기다’는 이 긴장을 현대 한국어로 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §3, §5
