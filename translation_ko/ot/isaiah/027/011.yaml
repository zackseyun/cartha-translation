  source_fidelity: 수확/잘려 나온 식생의 이미지, 여성들이 그것을 연료로 사용하는 장면, 분별 없는 백성에 대한 창조주의 긍휼과 호의의 거두심은 대체로 충실합니다. 다만 히브리어의 여성 복수 동사(‘부러진다’)를 한국어에서도 복수 지시로 드러내는 편이 더 정확하며, 후반부의 남성 단수 대명사는 백성이라는 집합을 가리키므로 ‘그 백성’으로 명시하는 것이 적절합니다.
  naturalness: ‘그것의 수확’과 반복되는 ‘그것’은 현대 표준 한국어에서 다소 부자연스럽고 지시 대상이 흐립니다. ‘그 수확물’, ‘그 백성’으로 바꾸면 자연스럽고 문맥도 분명해집니다. 또한 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
