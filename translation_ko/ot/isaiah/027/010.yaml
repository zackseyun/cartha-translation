id: ISA.27.10
reference: Isaiah 27:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י עִ֤יר בְּצוּרָה֙ בָּדָ֔ד נָוֶ֕ה מְשֻׁלָּ֥ח וְ/נֶעֱזָ֖ב כַּ/מִּדְבָּ֑ר שָׁ֣ם יִרְעֶ֥ה עֵ֛גֶל וְ/שָׁ֥ם יִרְבָּ֖ץ וְ/כִלָּ֥ה סְעִפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
  footnotes:
  - marker: a
    text: Or 'a pasture' or 'a dwelling place' for 'a habitation.' The Hebrew נָוֶה can carry either residential or pastoral nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'consumes its boughs.' The Hebrew verb conveys complete consumption; 'strips its branches bare' makes the image explicit in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 견고한 성읍이 외따로 서 있고, 거처는 버림받고 내버려져 광야 같아졌기 때문입니다. 거기에서 송아지가 풀을 뜯고, 거기에서 누워 가지들을 다 뜯어 먹습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 그 까닭은
  - 이는
  lexicon: HALOT
  rationale: 앞 절의 이유를 풀어 주는 연결어이므로, 한국어에서는 원인·설명 기능을 가장 자연스럽게 드러내는 ‘왜냐하면’이 적절합니다.
- source_word: עִיר בְּצוּרָה
  english_pob_choice: the fortified city
  chosen_korean: 견고한 성읍
  alternatives_korean:
  - 요새화된 성읍
  - 견고한 도시
  lexicon: HALOT
  rationale: 도시 전체가 방어된 상태를 가리키므로 ‘성읍’이 본문 이미지에 더 가깝고, ‘견고한’이 fortified의 방어적 뉘앙스를 잘 살립니다.
- source_word: בָּדָד / נָוֶה מְשֻׁלָּח וְנֶעֱזָב
  english_pob_choice: solitary; a habitation deserted and abandoned
  chosen_korean: 외따로 서 있고, 거처는 버림받고 내버려져
  alternatives_korean:
  - 홀로 남아 있고, 거처는 버려지고 버림받아
  - 고립되어 있고, 거처는 버려지고 내팽개쳐져
  lexicon: HALOT
  rationale: ‘בָּדָד’의 고립감을 ‘외따로’로, ‘נָוֶה’는 주거/거처의 의미를 살려 ‘거처’로 옮겼습니다. 두 수동형은 상태의 중첩을 드러내기 위해 ‘버림받고 내버려져’로 분리해 번역했습니다.
- source_word: שָׁם יִרְעֶה עֵגֶל וְשָׁם יִרְבָּץ וְכִלָּה סְעִפֶיהָ
  english_pob_choice: there a calf grazes, and there it lies down and strips its branches bare
  chosen_korean: 거기에서 송아지가 풀을 뜯고, 거기에서 누워 가지들을 다 뜯어 먹습니다
  alternatives_korean:
  - 거기에서 송아지가 먹이를 먹고, 거기에서 누워 가지들을 모두 먹어 치웁니다
  - 거기에서 송아지가 풀을 뜯으며, 거기에서 엎드려 가지들을 모조리 먹어 버립니다
  lexicon: HALOT
  rationale: ‘עֵגֶל’은 ‘송아지’가 자연스럽고, ‘רעה’는 목가적 이미지를 살려 ‘풀을 뜯다’로 옮겼습니다. ‘כִלָּה’는 완전 소진을 뜻하므로, 결과를 분명히 보이도록 ‘다 뜯어 먹습니다’로 표현했습니다.
theological_decisions:
- issue: 버려진 성읍의 소멸 이미지
  chosen_reading: 본문의 핵심은 단순한 방치가 아니라, 견고한 성읍이 광야처럼 되어 인간 거주와 보호 기능을 상실한 상태를 묘사하는 것입니다.
  alternative_readings:
  - 단순히 사람이 떠난 황폐한 장소로 읽을 수 있음
  - 농경지가 된 성읍의 풍경으로 완화해 읽을 수 있음
  rationale: ‘버림받고 내버려져 광야 같아졌습니다’는 히브리어의 중첩된 수동 표현과 비교 구문을 따라, 도시의 황폐화와 무력화를 강하게 드러냅니다.
  doctrine_reference: 사 27장의 심판/회복 문맥
