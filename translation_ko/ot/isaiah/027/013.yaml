  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'those who were lost' for 'those perishing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those banished' or 'the outcasts' for 'those driven away.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'bow down' or 'prostrate themselves' before the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 큰 나팔이 불리고, 앗수르 땅에서 멸망해 가는 자들과 애굽 땅에서 쫓겨난 자들이 와서 예루살렘의 거룩한 산에서 야훼께 경배할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망한 자들’, ‘잃어버린 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쫓겨난 자들’, ‘추방된 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘야훼 앞에 엎드려 절하다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  english_pob_choice: a great trumpet will be blown
  chosen_korean: 큰 나팔이 불리고
  alternatives_korean:
  - 큰 뿔나팔이 불리고
  - 큰 쇼파르가 울리고
  lexicon: HALOT
  rationale: נִפעַל의 수동적 의미를 살려 ‘불리고’로 옮기고, שׁוֹפָר는 기능상 ‘나팔’로 자연스럽게 풀어 현대 한국어의 예언문체를 유지했습니다.
- source_word: הָאֹבְדִים
  english_pob_choice: those perishing
  chosen_korean: 멸망해 가는 자들
  alternatives_korean:
  - 잃어버린 자들
  - 멸망하는 자들
  lexicon: HALOT
  rationale: אָבַד의 진행적·파멸적 뉘앙스를 살려 현재 진행형 느낌의 ‘멸망해 가는 자들’로 옮겨, 단순한 ‘잃어버린’으로 약화되지 않게 했습니다.
- source_word: וְהַנִּדָּחִים
  english_pob_choice: those driven away
  chosen_korean: 쫓겨난 자들
  alternatives_korean:
  - 내쫓긴 자들
  - 추방된 자들
  - 유리된 자들
  lexicon: HALOT
  rationale: נדח의 수동적 추방·내몰림을 한국어에서 가장 सीधे하게 드러내는 표현으로 ‘쫓겨난 자들’을 선택했습니다.
- source_word: וְהִשְׁתַּחֲווּ
  english_pob_choice: will come and worship
  chosen_korean: 와서 ... 경배할 것입니다
  alternatives_korean:
  - 와서 ... 엎드려 절할 것입니다
  - 와서 ... 예배할 것입니다
  lexicon: HALOT
  rationale: 문맥상 야훼께 드리는 경배이므로 종교적 행위를 분명히 하되, 문자적 ‘엎드림’은 발주석으로 보완할 수 있게 ‘경배하다’를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 YHWH 기본 대응을 따라 ‘야훼’를 유지해, covenant name을 일반적 ‘주님’으로 평준화하지 않았습니다.
theological_decisions:
- issue: 포로 회복과 종말적 모음의 범위
  chosen_reading: 앗수르와 애굽에서의 귀환 이미지를 역사적 귀환으로만 좁히지 않고, 예언적 ‘그 날’의 회복 약속으로 열어 두었습니다.
  alternative_readings:
  - 바빌론 포로 귀환만 가리키는 역사적 예언
  - 최종 종말의 이스라엘 회집만 가리키는 예언
  rationale: 본문은 ‘그 날’과 지리적 흩어짐의 이미지를 함께 사용해 회복의 폭을 넓게 두므로, 번역에서도 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: וְהִשְׁתַּחֲווּ의 예배성
  chosen_reading: ‘경배할 것입니다’로 옮겨, 단순한 몸짓이 아니라 야훼께 드리는 예배 행위임을 드러냈습니다.
  alternative_readings:
  - 엎드려 절할 것입니다
  - 몸을 굽혀 경배할 것입니다
  rationale: 히브리어 동사는 신체적 굽힘을 포함하지만, 목적어가 야훼이므로 예배적 의미를 함께 담는 번역이 문맥상 더 적절합니다.
  doctrine_reference: 'Contested terms table: וְהִשְׁתַּחֲווּ → worship'
