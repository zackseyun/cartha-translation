revisions:
- from: 그 날에 야훼께서 강의 수로에서부터 이집트의 와디까지를 탈곡하실 것이며, 너희는 이스라엘의 아들들아, 한 사람씩 모여들게 될 것입니다.[a][b][c][d]
  to: 그날에 야훼께서 강의 물줄기에서부터 이집트의 와디까지 탈곡하실 것이며, 이스라엘 자손들아, 너희는 하나하나 거두어 모아질 것입니다.[a][b][c][d]
  rationale: 원문의 농경 비유와 수동적 회복의 의미를 살리기 위해 ‘모여들게 될 것입니다’를 ‘거두어 모아질 것입니다’로 고쳤습니다. ‘강의 수로’는 원문의 자연적 흐름을 더 잘 반영하는 ‘강의 물줄기’로 수정했습니다. 한국어 호칭은 자연스러운 ‘이스라엘 자손들아’를 사용하되, 문자적 남성 복수 표현은 각주에 보존했습니다. 각주 표지는 본문 끝에 모두 유지하여 각주 집합과의 구조적 연결도 보존했습니다.
