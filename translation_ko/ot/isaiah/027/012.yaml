  source_fidelity: 원문의 수동태 תְּלֻקְּטוּ는 야훼께서 이스라엘 자손을 개별적으로 거두어 모으시는 뜻입니다. 초안의 ‘모여들게 될 것입니다’는 자발적으로 모이는 뜻을 더해 수동적·타동적 뉘앙스를 약화합니다. 또한 שִׁבֹּלֶת는 이 문맥에서 인공적인 ‘수로’보다는 강의 ‘물줄기/흐름’을 가리키는 것이 적절합니다.
  naturalness: ‘너희는 이스라엘의 아들들아’는 한국어 호격과 주어의 배열이 부자연스럽습니다. 호칭을 앞에 두고 ‘이스라엘 자손들아, 너희는…’으로 옮기면 현대 한국어의 예언적 호소 문체에 자연스럽습니다. ‘그날’은 붙여 쓰는 표준 표기입니다.
  terminology: ‘야훼’, ‘탈곡하다’, ‘와디’는 유지할 수 있습니다. 다만 한국어에서 민족 집단을 부르는 히브리어 관용 표현 בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 자손들’이 자연스럽고, 각주에서 문자적 표현인 ‘이스라엘의 아들들’을 밝혀 원문의 형태를 보존합니다.
