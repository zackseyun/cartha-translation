id: ISA.27.12
reference: Isaiah 27:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
  footnotes:
  - marker: a
    text: Or, 'the Euphrates'; 'the River' is a common designation for the Euphrates.
    reason: cross_reference
  - marker: b
    text: Or, 'Brook of Egypt.' The Hebrew refers to a wadi or seasonal watercourse, not necessarily the Nile.
    reason: lexical_alternative
  - marker: c
    text: The verb evokes gleaning or collecting individually after threshing.
    reason: cultural_note
  - marker: d
    text: Or, 'children of Israel.' The Hebrew is literally 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 야훼께서 강의 수로에서부터 이집트의 와디까지를 탈곡하실 것이며, 너희는 이스라엘의 아들들아, 한 사람씩 모여들게 될 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강’은 여기서 유프라테스를 가리키는 통칭일 수 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘와디’는 반드시 나일강을 뜻하는 것이 아니라, 계절성 물길을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 동사는 타작 뒤에 개별적으로 주워 모으는 이미지를 불러일으킵니다.
    reason: cultural_note
  - marker: d
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  english_pob_choice: And in that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날에는
  - 그리고 그 날에
  lexicon: HALOT
  rationale: 예언서의 표준적인 시간 표지로서, 한국어에서는 간결하게 ‘그 날에’로 옮겨 종말론적 시점을 자연스럽게 드러냈습니다.
- source_word: יַחְבֹּט
  english_pob_choice: will thresh
  chosen_korean: 탈곡하실 것이며
  alternatives_korean:
  - 타작하실 것이며
  - 두드려 털어내실 것이며
  lexicon: HALOT
  rationale: 농경적 ‘타작/탈곡’의 이미지를 살리되, 한국어에서 문맥상 더 자연스럽고 회수·분리의 뉘앙스를 전달하는 ‘탈곡하다’를 택했습니다.
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  english_pob_choice: from the channel of the River
  chosen_korean: 강의 수로에서부터
  alternatives_korean:
  - 강의 물줄기에서부터
  - 강의 흐름에서부터
  lexicon: HALOT
  rationale: שִׁבֹּלֶת는 여기서 큰 강의 흐름/수로를 가리키므로, ‘수로’로 옮겨 지리적 범위와 흐름의 이미지를 함께 보존했습니다.
- source_word: נַחַל מִצְרָיִם
  english_pob_choice: the Wadi of Egypt
  chosen_korean: 이집트의 와디
  alternatives_korean:
  - 이집트의 시내
  - 이집트의 건천
  lexicon: HALOT
  rationale: נחל은 지속적 강이 아니라 계절성 물길을 뜻하는 경우가 많아, 전통적 ‘시내’보다 원문 지형의 성격을 드러내는 ‘와디’가 더 정확합니다.
- source_word: תְּלֻקְּטוּ לְאַחַד אֶחָד
  english_pob_choice: you will be gathered one by one
  chosen_korean: 너희는 … 한 사람씩 모여들게 될 것입니다
  alternatives_korean:
  - 너희는 … 하나씩 모이게 될 것입니다
  - 너희는 … 한 사람 한 사람 모이게 될 것입니다
  lexicon: HALOT
  rationale: 수동형 ‘거두어 모으다’의 의미와 분배적 강조를 살려 ‘한 사람씩’으로 옮겼고, 결과 상태보다 모임의 진행을 드러내기 위해 ‘모여들다’를 사용했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: O sons of Israel
  chosen_korean: 이스라엘의 아들들아
  alternatives_korean:
  - 이스라엘의 자손들아
  - 이스라엘 백성들아
  lexicon: HALOT
  rationale: 원문이 남성 복수의 직설적 호칭이므로, 이를 완화하지 않고 ‘아들들아’로 보존해 POB의 성별-형태 일치를 따랐습니다.
theological_decisions:
- issue: 야훼의 직접적 호칭 보존
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 옮김
  rationale: 원문이 신성 4문자를 직접 사용하므로, 한국 교회 전통 대체어보다 고유명을 보존하는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
