id: ISA.27.4
reference: Isaiah 27:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֵמָ֖ה אֵ֣ין לִ֑/י מִֽי יִתְּנֵ֜/נִי שָׁמִ֥יר שַׁ֨יִת֙ בַּ/מִּלְחָמָ֔ה אֶפְשְׂעָ֥ה בָ֖/הּ אֲצִיתֶ֥/נָּה יָּֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
  footnotes:
  - marker: a
    text: Literally, 'Who will give me briers and thorns in battle?'—an idiom expressing a challenge or wish for hostile opponents to be set before him.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew suffixes in 'I would march against it' and 'I would burn it' are singular feminine, referring collectively to 'briers and thorns.' English renders the sense with plural 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내게는 분노가 없습니다. 누가 전쟁터에서 가시나무와 엉겅퀴를 내 앞에 세우겠습니까?[a] 내가 그것들 속으로 나아가, 그것들을 함께 불태우겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘누가 전쟁에서 가시나무와 엉겅퀴를 내게 주겠느냐?’입니다. 이는 적대자들을 자기 앞에 내세우기를 요구하거나 도전하는 뜻을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그것 속으로’와 ‘그것을’에 해당하는 접미사는 단수 여성형이며, ‘가시나무와 엉겅퀴’라는 집합적 대상을 가리킵니다. 한국어에서는 자연스럽게 복수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격분
  - 화
  lexicon: HALOT
  rationale: 문맥상 야훼의 격한 분노를 가리키지만, 한국어에서는 ‘분노’가 가장 자연스럽고 직접적으로 그 강도를 전달합니다.
- source_word: אֵין לִי
  english_pob_choice: I have no
  chosen_korean: 내게는 없습니다
  alternatives_korean:
  - 나는 없습니다
  - 내게 없습니다
  - 나는 가지지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 존재부정 구조를 한국어에서 자연스러운 소유/상태 진술로 옮겨, 현재의 상태를 간명하게 드러냈습니다.
- source_word: מִי יִתְּנֵנִי
  english_pob_choice: Who would set ... against me
  chosen_korean: 누가 … 내게 주겠습니까?
  alternatives_korean:
  - 누가 … 주겠습니까?
  - 누가 … 내게 주리요?
  - 누가 … 내 앞에 두겠습니까?
  lexicon: HALOT
  rationale: 직역하면 ‘누가 내게 주겠느냐’이지만, 영어 POB가 지적하듯 도전적 관용구이므로 한국어에서도 문맥에 맞게 수사적 질문으로 살렸습니다.
- source_word: שָׁמִיר שַׁיִת
  english_pob_choice: briers and thorns
  chosen_korean: 가시나무와 엉겅퀴
  alternatives_korean:
  - 찔레와 가시
  - 가시덤불과 엉겅퀴
  - 가시와 찔레
  lexicon: HALOT
  rationale: 두 식물어는 적대적이고 태울 만한 거친 식생을 가리키므로, 한국어에서 대응이 잘 되는 ‘가시나무와 엉겅퀴’를 택했습니다.
- source_word: אֶפְשְׂעָה בָהּ / אֲצִיתֶנָּה
  english_pob_choice: I would march against them / I would burn them up
  chosen_korean: 내가 그것들을 향해 나아가 그들을 함께 불사르겠습니다
  alternatives_korean:
  - 내가 그것들을 밟고 지나가 불태우겠습니다
  - 내가 그것들을 공격하고 함께 태우겠습니다
  - 내가 그것들 위를 걸어가 함께 태우겠습니다
  lexicon: HALOT
  rationale: 전쟁 맥락의 ‘나아가다’와 ‘불사르다’를 살리되, 대상이 집합적으로 거친 식생이라는 점을 한국어에서도 자연스럽게 연결했습니다.
theological_decisions:
- issue: 하나님의 분노의 부재와 심판 행위의 긴장
  chosen_reading: ‘분노가 내게는 없습니다’는 이 구절의 국소적 진술로 유지하여, 야훼가 포도원에 대해 현재는 분노를 품지 않으면서도 적대적 가시덤불은 여전히 제거하시는 긴장을 보존했습니다.
  alternative_readings:
  - ‘나는 노하지 않습니다’처럼 더 완화해 읽는 해석
  - 문맥을 약화시키고 단순한 평온 선언으로 만드는 해석
  rationale: 이사야 27장의 흐름을 따라, 신학적 조화를 미리 해소하지 않고 본문의 대비를 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: 본문의 긴장을 보존하고 다른 성경의 심판 진술과 조화시키지 않음
