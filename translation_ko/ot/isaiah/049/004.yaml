id: ISA.49.4
reference: Isaiah 49:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
  footnotes:
  - marker: a
    text: Or “my cause” or “my vindication” is with the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or “my recompense” or “my wages” is with my God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 이렇게 말했습니다[a]. “헛되이 수고하였고, 공허함과 허무함을 위하여 제 힘을 다 소모하였습니다. 그러나 분명히 저의 의는 야훼에게 있고, 저의 보상은 제 하나님께 있습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저의 사유” 혹은 “저의 변호”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “저의 보수” 혹은 “저의 삯”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק יָגַעְתִּי
  english_pob_choice: I have labored in vain
  chosen_korean: 헛되이 수고하였고
  alternatives_korean:
  - 헛되이 애썼고
  - 허사로 수고하였고
  lexicon: HALOT
  rationale: לְרִיק의 ‘헛되이/공허하게’와 יָגַע의 ‘수고하다, 애쓰다’를 함께 살려, 결과 없는 고된 노동의 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: לְתֹהוּ וְהֶבֶל
  english_pob_choice: for emptiness and vanity
  chosen_korean: 공허함과 허무함을 위하여
  alternatives_korean:
  - 허무와 헛됨을 위하여
  - 공허와 헛됨을 위해
  lexicon: HALOT
  rationale: תֹהוּ와 הֶבֶל의 두 개념을 각각 구분해, 단일한 ‘헛됨’으로 합치지 않고 ‘공허함/허무함’으로 병렬 처리했습니다.
- source_word: כֹּחִי כִלֵּיתִי
  english_pob_choice: I have spent my strength
  chosen_korean: 제 힘을 다 소모하였습니다
  alternatives_korean:
  - 제 힘을 다 써버렸습니다
  - 제 기력을 다 소진하였습니다
  lexicon: HALOT
  rationale: כִלֵּיתִי의 ‘다 써서 없애다/소모하다’ 의미를 살리면서, 시적 표현을 현대 한국어에서 과장되지 않게 전달했습니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my justice
  chosen_korean: 저의 의
  alternatives_korean:
  - 저의 न्याय권
  - 저의 변론
  - 저의 정당한 호소
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적·권리적 폭을 고려해 ‘의’로 옮기되, 단순한 추상덕목이 아니라 하나님 앞에서 인정받을 권리/정당성의 긴장을 유지했습니다.
- source_word: וּפְעֻלָּתִי
  english_pob_choice: my reward
  chosen_korean: 저의 보상
  alternatives_korean:
  - 저의 삯
  - 저의 보수
  - 저의 보답
  lexicon: HALOT
  rationale: פְעֻלָּה의 ‘일의 결과로 받는 보상/삯’ 의미를 반영해, 문맥상 결과가 하나님께 محفوظ되어 있다는 점을 드러내는 ‘보상’을 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 방침에 따라 언약적 신명 יְהוָה를 ‘야훼’로 옮겨, 본문의 고유한 하나님의 이름을 가렸던 전통적 대체어를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: מִשְׁפָּטִי의 신학적 긴장 보존
  chosen_reading: 저의 의
  alternative_readings:
  - 저의 변호
  - 저의 정당한 호소
  - 저의 판결
  rationale: 이 구절은 선지자적 소명의 좌절감 속에서도 하나님께 맡겨진 ‘정당한 권리/의’의 긴장을 유지합니다. ‘의’는 법정적 의미를 완전히 닫지 않으면서도 신학적 무게를 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
