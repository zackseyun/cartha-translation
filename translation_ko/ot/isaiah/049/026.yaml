- from: 내가 너를 압제하는 자들을 그들의 살을 먹게 하고, 그들은 달콤한 포도주를 마시듯 자기 피에 취할 것입니다. 그러면 모든 육체가 내가 야훼, 곧 너를 구원하는 이이며 너를 속량하는 이, 야곱의 용사임을 알게 될 것입니다.[a]
  to: 내가 너를 압제하는 자들에게 그들의 살을 먹게 하고, 그들은 달콤한 포도주에 취하듯이 자기 피에 취할 것입니다.[a] 그러면 모든 육체가 내가 야훼, 곧 네 구원자이며 네 구속자요 야곱의 능하신 이임을 알게 될 것입니다.
