id: ISA.49.26
reference: Isaiah 49:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
  footnotes:
  - marker: a
    text: Or "as with new wine." The Hebrew עָסִיס refers to sweet or freshly pressed wine/juice.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 압제하는 자들에게 그들의 살을 먹게 하고, 그들은 달콤한 포도주에 취하듯이 자기 피에 취할 것입니다.[a] 그러면 모든 육체가 내가 야훼, 곧 네 구원자이며 네 구속자요 야곱의 능하신 이임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “새 포도주에 취하듯이.” 히브리어 עָסִיס는 달콤한 포도주나 갓 짠 포도즙을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  english_pob_choice: I will make ... eat
  chosen_korean: 그들의 살을 먹게 하고
  alternatives_korean:
  - 먹이겠습니다
  - 먹게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 단순한 ‘먹다’가 아니라 ‘먹게 하다’로 옮겼습니다. 문맥상 심판의 강한 이미지를 유지하는 쪽이 자연스럽습니다.
- source_word: מוֹנַיִךְ
  english_pob_choice: those who oppress you
  chosen_korean: 너를 압제하는 자들
  alternatives_korean:
  - 너를 학대하는 자들
  - 너를 괴롭히는 자들
  lexicon: HALOT
  rationale: מוֹנֶה 계열은 억압·착취의 의미가 있어, 문맥에 맞게 ‘압제하는 자들’로 옮겼습니다. ‘너를’은 시온에 대한 직접 خطاب을 분명히 합니다.
- source_word: וְכֶעָסִיס
  english_pob_choice: as with sweet wine
  chosen_korean: 달콤한 포도주를 마시듯
  alternatives_korean:
  - 새 포도주를 마시듯
  - 갓 짠 포도즙을 마시듯
  lexicon: HALOT
  rationale: עָסִיס의 기본 뜻은 새 포도주/갓 짠 즙이지만, 여기서는 취하게 하는 음료의 비유가 핵심이므로 ‘달콤한 포도주’로 자연스럽게 살렸습니다. 의미 범위는 각주로 보완했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 인칭 호칭이 아닌 고유한 신명으로 처리해, 본문이 드러내는 하나님의 이름을 보존했습니다. 전통적 대치어 ‘주’는 이 절의 대조를 약화시킬 수 있습니다.
theological_decisions:
- issue: 피와 육체를 먹고 마시는 심판의 비유를 완화할지 여부
  chosen_reading: 잔혹한 심판 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 비유적으로 ‘완전히 패망한다’로 순화함
  - 혈육의 자멸로 풀어씀
  rationale: 본문은 충격적인 포식·혈음 비유를 의도적으로 사용하므로, 이를 완화하면 예언적 수사와 보응의 강도가 약해집니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 범위를 넘어서 완화하거나 우회하지 않음.'
- issue: כָל בָּשָׂר의 번역
  chosen_reading: ‘모든 육체’로 직역했습니다.
  alternative_readings:
  - 모든 사람
  - 온 인류
  rationale: 히브리어 관용구를 그대로 살려 예언서의 보편적 울림을 유지했습니다. 이 표현은 신학적으로도 넓은 범위를 암시합니다.
  doctrine_reference: '원문 우선 원칙: 신학적·문학적 긴장을 평탄화하지 않음.'
