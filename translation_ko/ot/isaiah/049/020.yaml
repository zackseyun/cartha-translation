id: ISA.49.20
reference: Isaiah 49:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ע֚וֹד יֹאמְר֣וּ בְ/אָזְנַ֔יִ/ךְ בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ צַר לִ֥/י הַ/מָּק֖וֹם גְּשָׁ/ה לִּ֥/י וְ/אֵשֵֽׁבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
  footnotes:
  - marker: a
    text: Or, more literally, 'draw near for me' or 'come close for me'; the Hebrew idiom here likely means 'make room for me' in the context of overcrowding.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of your bereavement'; rendered 'children' for natural English and collective sense.
    reason: lexical_alternative
translation:
  language: ko
  text: “아직도 네 상실의 자녀들이 네 귀에 말할 것이다. ‘이곳은 내게 너무 비좁다. 내게 자리를 내주어 내가 거기에 살게 하라.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֚וֹד יֹאמְרוּ
  english_pob_choice: Yet the children ... will still say
  chosen_korean: 아직도 ... 말할 것이다
  alternatives_korean:
  - 또 말할 것이다
  - 여전히 말할 것이다
  - 아직 말할 것이다
  lexicon: HALOT
  rationale: ע֚וֹד의 계속·추가 뉘앙스를 한국어로 간결하게 살리기 위해 ‘아직도’로 옮겼고, יֹאמְרוּ는 예언적 미래로 ‘말할 것이다’가 가장 자연스럽습니다.
- source_word: בְאָזְנַיִךְ
  english_pob_choice: in your hearing
  chosen_korean: 네 귀에
  alternatives_korean:
  - 네가 듣는 가운데
  - 네가 들을 수 있게
  - 네 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되 한국어로 자연스러운 청각 표현인 ‘네 귀에’로 옮겨, 시온이 직접 듣는 장면을 보존했습니다.
- source_word: בְּנֵי שִׁכֻּלָיִךְ
  english_pob_choice: the children of your bereavement
  chosen_korean: 네 상실의 자녀들
  alternatives_korean:
  - 네 자녀 상실의 자녀들
  - 네 상실의 아들들
  - 네 상실로 생긴 자녀들
  lexicon: HALOT
  rationale: בני는 문자적으로 ‘아들들/자녀들’이지만 한국어에서는 집합적 의미를 살려 ‘자녀들’이 자연스럽습니다. שִׁכֻּלַיִךְ는 ‘자녀를 잃은 상실’의 상태를 가리키므로 이를 ‘상실’로 옮겨, 아이를 잃은 시온의 상태라는 은유를 유지했습니다.
- source_word: צַר לִי הַמָּקוֹם גְּשָׁה לִּי
  english_pob_choice: The place is too cramped for me; make room for me
  chosen_korean: 이곳은 내게 너무 비좁다. 내게 자리를 내주어
  alternatives_korean:
  - 이곳은 내게 너무 좁다. 비켜서게 하라
  - 이곳은 내게 너무 협소하다. 길을 내라
  - 이곳은 내게 너무 붐빈다. 비켜라
  lexicon: HALOT
  rationale: צַר לִי הַמָּקוֹם은 공간적 협소함이므로 ‘너무 비좁다’가 현대 한국어에서 가장 자연스럽습니다. גְּשָׁה לִּי의 문자적 ‘가까이 오라’보다 문맥상 ‘자리를 내주다’가 과밀 상태에서 공간을 내어 주라는 뜻을 더 정확히 드러냅니다.
- source_word: וְאֵשֵׁבָה
  english_pob_choice: so that I may dwell
  chosen_korean: 내가 거기에 살게 하라
  alternatives_korean:
  - 내가 거기에 머물게 하라
  - 내가 거기에 거주하게 하라
  - 내가 거기 앉게 하라
  lexicon: HALOT
  rationale: ישׁב는 단순한 ‘앉다’보다 거주·정착의 의미가 강하므로 ‘살다/거주하다’ 계열이 적합합니다. 한국어에서는 청유형 목적절을 살려 ‘내가 거기에 살게 하라’로 옮겼습니다.
theological_decisions:
- issue: 시온을 향한 회복·확장 이미지의 보존
  chosen_reading: ‘상실의 자녀들’이 돌아와 시온 안에 거처를 요구하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 사람 수가 늘어나는 물리적 비유로만 읽을 수 있음
  - ‘상실’의 은유를 약화시켜 일반적 귀환 선언으로 볼 수 있음
  rationale: 문맥상 포로 귀환과 시온의 회복을 말하지만, 본문은 단순 인구 증가보다 ‘상실’ 이후의 회복이라는 정서를 함께 담고 있으므로 그 은유를 유지했습니다.
  doctrine_reference: 이사야 49장의 시온 회복, 포로 귀환의 약속
