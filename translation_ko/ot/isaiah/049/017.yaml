  text: מִֽהֲר֖וּ בָּנָ֑יִ/ךְ מְהָֽרְסַ֥יִ/ךְ וּ/מַחֲרִבַ֖יִ/ךְ מִמֵּ֥/ךְ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
  footnotes:
  - marker: a
    text: Or, 'Your builders hurry.' Some ancient witnesses reflect 'builders' instead of 'children.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 자녀들은 서둘러 돌아오고[a], 너를 무너뜨리고 황폐하게 한 자들은 네게서 떠나갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 건축자들’. 일부 고대 증거는 ‘자녀들’ 대신 ‘건축자들’을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  english_pob_choice: hurry back
  chosen_korean: 서둘러 돌아오고
  alternatives_korean:
  - 급히 돌아오고
  - 서둘러 오고
  - 빨리 돌아오고
  lexicon: HALOT
  rationale: 동사는 단순한 속도보다 회복과 귀환의 움직임을 가리키므로, 자녀들이 시온으로 돌아오는 뉘앙스를 살려 ‘서둘러 돌아오고’로 옮겼습니다.
- source_word: בָּנָיִךְ
  english_pob_choice: your children
  chosen_korean: 네 자녀들
  alternatives_korean:
  - 네 아들들
  - 네 아들자녀들
  - 네 건축자들
  lexicon: HALOT
  rationale: 문맥상 시온/예루살렘에게 말하는 표현이므로 성별을 특정하지 않는 현대 한국어의 ‘자녀들’이 자연스럽고, 본문이 지시하는 회복의 대상을 잘 드러냅니다.
- source_word: מְהָרְסַיִךְ וּמַחֲרִבַיִךְ
  english_pob_choice: those who tore you down and devastated you
  chosen_korean: 너를 무너뜨리고 황폐하게 한 자들
  alternatives_korean:
  - 너를 헐고 황폐하게 한 자들
  - 너를 파괴하고 황폐하게 한 자들
  - 너를 허물고 멸망시킨 자들
  lexicon: HALOT
  rationale: 두 분사는 파괴와 황폐화를 병렬로 강조하므로, ‘무너뜨리고 황폐하게 한 자들’로 각각의 동작을 분명히 살렸습니다.
- source_word: יֵצֵאוּ
  english_pob_choice: will depart
  chosen_korean: 떠나갈 것입니다
  alternatives_korean:
  - 나갈 것입니다
  - 떠날 것입니다
  - 물러갈 것입니다
  lexicon: HALOT
  rationale: ‘~에서’(מִמֵּךְ)와 결합한 분리는 단순 이동보다 이탈·축출의 의미가 강하므로, ‘떠나갈 것입니다’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: MT의 ‘네 자녀들’과 전승상 ‘네 건축자들’의 처리
  chosen_reading: 본문에는 ‘네 자녀들’을 두고, 대안 독법은 각주로 제한합니다.
  alternative_readings:
  - 네 건축자들
  rationale: 마소라 본문의 ילד/בנים 계열 독법이 회복 서사의 핵심과 직접 맞물리므로 본문은 이를 따르고, 다른 고대 증거가 반영한 ‘건축자들’은 번역 본문을 바꾸지 않고 각주로만 남깁니다.
  doctrine_reference: Translation philosophy §1, §3
