id: ISA.49.25
reference: Isaiah 49:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
  footnotes:
  - marker: a
    text: Or "the prey of the tyrant."
    reason: lexical_alternative
  - marker: b
    text: Literally "your sons."
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “힘센 자의 포로도 빼앗길 것이며, 강포한 자의 노획물[a]도 벗어날 것입니다. 내가 친히 너와 다투는 자와 다툴 것이며, 내가 친히 너의 자녀[b]를 구원하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강포한 자의 먹잇감’. 히브리어는 ‘빼앗아 취한 것’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘너의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본어인 신명사 표기를 따랐습니다. 본문이 직접 하나님의 이름을 사용하므로 일반적인 ‘주님’보다 음역형 ‘야훼’가 원문 구분을 더 잘 드러냅니다.
- source_word: גִּבּוֹר
  english_pob_choice: the mighty
  chosen_korean: 힘센 자
  alternatives_korean:
  - 용사
  - 강한 자
  - 권력자
  lexicon: HALOT
  rationale: 문맥상 포획자의 힘을 가리키므로 ‘힘센 자’가 직역성과 자연성을 함께 살립니다.
- source_word: מַלְקוֹחַ
  english_pob_choice: the prey
  chosen_korean: 노획물
  alternatives_korean:
  - 전리품
  - 잡은 것
  - 포획물
  lexicon: HALOT
  rationale: ‘빼앗긴 것/붙잡힌 것’의 이미지와 잘 맞고, 앞절의 ‘포로’와 평행을 이루도록 ‘노획물’로 옮겼습니다.
- source_word: עָרִיץ
  english_pob_choice: the ruthless
  chosen_korean: 강포한 자
  alternatives_korean:
  - 폭군
  - 무자비한 자
  - 포악한 자
  lexicon: HALOT
  rationale: 단순한 성격 묘사보다 폭력적 억압자의 성격이 더 강하므로, 한국어 성경체에서 이해하기 쉬운 ‘강포한 자’가 적절합니다.
- source_word: יְרִיבֵךְ
  english_pob_choice: the one who contends with you
  chosen_korean: 너와 다투는 자
  alternatives_korean:
  - 너의 대적
  - 너와 논쟁하는 자
  - 너를 상대로 다투는 자
  lexicon: HALOT
  rationale: 법정적/언쟁적 대립을 포괄하는 ריב의 의미를 살리면서도, 반복되는 동사 ‘다투다’와 연결해 원문의 평행성을 보존했습니다.
- source_word: בָּנַיִךְ
  english_pob_choice: your children
  chosen_korean: 너의 자녀
  alternatives_korean:
  - 너의 아들들
  - 너의 아들
  - 너의 후손
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘아들들’이지만, 시온을 향한 예언적 주소에서 후손 전체를 가리키는 집합적 의미가 강하므로 ‘자녀’로 옮기고, 보다 문자적인 선택지는 필요하면 주석으로 검토할 수 있습니다.
theological_decisions:
- issue: 신적 개입의 강조를 드러내는 אָנֹכִי
  chosen_reading: ‘내가 곧’으로 두 차례 반복해 하나님의 직접적 개입을 강조했습니다.
  alternative_readings:
  - ‘내가’
  - ‘나 자신이’
  rationale: אָנֹכִי의 강조를 한국어에서도 보존해야 하므로, 단순한 주어 처리보다 ‘내가 곧’이 원문의 자기 강조를 더 선명하게 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
- issue: 포로/노획물의 역전 구조
  chosen_reading: ‘포로도 빼앗기고, 노획물도 벗어나겠고’로 수동적 해방을 살렸습니다.
  alternative_readings:
  - ‘포로도 끌려가고’
  - ‘전리품도 빠져나가겠고’
  rationale: 본문은 억압의 역전과 해방을 선포하므로, 능동적 ‘구원’만 강조하기보다 ‘빼앗김/벗어남’의 반전을 함께 보존하는 것이 신학적으로 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 3
