id: ISA.49.5
reference: Isaiah 49:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
  footnotes:
  - marker: a
    text: Hebrew consonantal text reads 'and Israel not will be gathered' (or 'though Israel is not gathered'). Many ancient interpreters and versions understand the sense as 'and Israel might be gathered to him,' which fits the parallel line 'to bring Jacob back to him.'
    reason: textual_variant
translation:
  language: ko
  text: 이제 야훼께서 말씀하십니다. 곧 태에서부터 자기 종으로, 야곱을 자기에게 돌아오게 하고 이스라엘을 자기에게 모으게 하려고 나를 지으신 분이십니다[a]. 그러나 나는 야훼의 눈에 존귀하며, 나의 하나님은 나의 힘이 되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음본문은 ‘이스라엘이 모이지 않다’(또는 ‘비록 이스라엘이 모이지 않더라도’)로도 읽힙니다. 그러나 여러 고대 해석과 역본은 앞줄과의 평행성에 따라 ‘이스라엘을 자기에게 모으다’의 뜻으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 원문의 언약적 신명은 프로젝트 기본값인 ‘야훼’로 옮겨, 본문 내부의 고유한 신명 사용을 드러냈습니다.
- source_word: יֹצְרִי מִבֶּטֶן
  english_pob_choice: he who formed me from the womb
  chosen_korean: 태에서부터 나를 지으신 분
  alternatives_korean:
  - 태에서부터 나를 빚으신 분
  - 모태에서부터 나를 지으신 분
  lexicon: HALOT
  rationale: יֹצֵר의 ‘빚다/형성하다’ 의미를 살리되, 현대 한국어에서 자연스럽고 예언자적 소명 표현으로 읽히는 ‘지으신 분’을 선택했습니다.
- source_word: לְעֶבֶד לוֹ
  english_pob_choice: to be his servant
  chosen_korean: 자기 종으로
  alternatives_korean:
  - 그의 종이 되게 하려고
  - 그의 노예로
  lexicon: HALOT
  rationale: 여기서는 봉사 직무의 맥락이 중심이므로, 프로젝트 기본값대로 ‘종’을 쓰고 목적어적 용법을 자연스럽게 풀었습니다.
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  english_pob_choice: to bring Jacob back to him
  chosen_korean: 야곱을 자기에게 돌아오게 하고
  alternatives_korean:
  - 야곱을 자기에게 되돌려 놓고
  - 야곱을 자기에게 회복시키고
  lexicon: HALOT
  rationale: שוב의 사역적 의미를 살려 ‘돌아오게 하다’로 옮겼고, יעד 방향성인 ‘אליו’를 ‘자기에게’로 분명히 했습니다.
- source_word: וְיִשְׂרָאֵל לֹא יֵאָסֵף
  english_pob_choice: and that Israel might be gathered to him
  chosen_korean: 이스라엘을 자기에게 모으게 하려고
  alternatives_korean:
  - 이스라엘이 모이지 못하게
  - 이스라엘을 모으게 하려고
  lexicon: HALOT
  rationale: 본문의 자음은 ‘모이지 않다’ 쪽 긴장을 남기지만, 영어 POB와 고대 역본들이 반영한 ‘모이다/모으다’의 의미를 본문 흐름에 맞게 한국어로 살렸습니다.
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  english_pob_choice: yet I am honored in the eyes of Yahweh
  chosen_korean: 그러나 나는 야훼의 눈에 존귀하며
  alternatives_korean:
  - 그러나 나는 야훼의 눈에 영광스럽게 되며
  - 그러나 나는 야훼께 존귀하게 여겨지며
  lexicon: HALOT
  rationale: כבד의 수동적 의미를 ‘존귀하다’로 옮겨, ‘honored’의 품격과 관계적 평가를 함께 드러냈습니다.
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  english_pob_choice: and my God has become my strength
  chosen_korean: 나의 하나님은 나의 힘이 되셨습니다
  alternatives_korean:
  - 나의 하나님은 나의 강함이 되셨습니다
  - 나의 하나님은 나의 능력이 되셨습니다
  lexicon: HALOT
  rationale: עֹז를 ‘힘’으로 옮겨 직관적 의미를 살렸고, היה의 완료형은 현재적 결과를 담아 한국어에서도 완료감을 유지했습니다.
theological_decisions:
- issue: וְיִשְׂרָאֵל לֹא יֵאָסֵף의 본문 긴장 처리
  chosen_reading: 본문은 의미상 ‘이스라엘을 자기에게 모으게 하려고’로 읽되, 자음본문이 남기는 부정적 긴장은 주석 없이 삭제하지 않았습니다.
  alternative_readings:
  - 이스라엘이 모이지 않게
  - 이스라엘은 모이지 않는다
  - 이스라엘이 모일 것이다
  rationale: 사역적 평행구와 전체 문맥이 ‘돌아오게/모으다’의 의미를 강하게 지지하므로 본문 흐름을 우선하되, 히브리어 자음본문의 난점을 번역에서 은폐하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
