  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
  footnotes:
  - marker: a
    text: Or possibly 'from the west,' since 'the sea' can function as a western geographical reference in Hebrew usage.
    reason: lexical_alternative
  - marker: b
    text: '''Sinim'' is an uncertain place-name. Proposed identifications include Syene/Aswan in southern Egypt; some have suggested a more distant eastern region, but the location is not certain.'
    reason: alternative_reading
