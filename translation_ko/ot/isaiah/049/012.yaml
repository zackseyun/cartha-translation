  text: 보십시오, 저들은 먼 곳에서 오겠고, 보십시오, 저들은 북쪽과 바다에서 오며, 저들은 시님 땅에서 오겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '서쪽'일 수 있습니다. 히브리어 사용에서 '바다'가 서쪽의 지리적 참조로 기능할 수 있기 때문입니다.
    reason: alternative_reading
  - marker: b
    text: '''시님''은 불확실한 지명입니다. 제안된 식별에는 이집트 남부의 시네/아스완이 포함되며, 어떤 이들은 더 먼 동쪽 지역을 제안하기도 했으나, 그 위치는 확실하지 않습니다.'
    reason: alternative_reading
