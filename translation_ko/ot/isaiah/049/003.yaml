  source_fidelity: 본문은 히브리어의 직접 호칭과 ‘이스라엘’의 동격 관계를 대체로 충실히 보존합니다. 다만 각주 대안의 ‘나 안에서’는 בְּךָ(‘너/네 안에서’)를 잘못 옮긴 것이므로 반드시 고쳐야 합니다. אֶתְפָּאָר의 히트파엘은 문맥상 하나님이 자신의 영광을 드러내심을 가리킬 수 있으므로 ‘영광을 드러낼 것이다’는 안전한 한국어 표현입니다.
  naturalness: ‘그가 나에게 말씀하셨습니다’와 직접 인용은 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. ‘영광을 드러낼 것이다’가 ‘영광을 나타낼 것이다’보다 더 자연스럽고 통상적인 표현입니다.
  terminology: ‘내 종’, ‘이스라엘’, ‘영광’은 적절합니다. ‘이스라엘’이 집단인지 대표적 개인인지에 관한 해석은 본문이 결정하지 않으며, 번역도 이를 결정하지 않습니다.
