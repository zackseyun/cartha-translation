base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
  footnotes:
  - marker: a
    text: Or, “in you I will be glorified.” The Hebrew verb can be rendered more literally this way; the main text brings out the sense of God displaying his glory in or through his servant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나에게 말씀하셨습니다[a]. “너는 내 종, 이스라엘이다. 내가 너 안에서 영광을 드러낼 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 안에서 내가 영광을 드러낼 것이다.” 히브리어 동사는 더 문자적으로 이렇게도 옮길 수 있습니다. 본문은 하나님이 그의 종 안에서, 또는 그의 종을 통해 자신의 영광을 드러내신다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 일꾼
  - 내 종자
  lexicon: HALOT
  rationale: 이사야의 종 노래 문맥에서는 עבד를 단순한 봉사자보다 ‘하나님께 속한 종’으로 읽는 것이 자연스러우므로, POB의 의미를 살려 ‘종’으로 옮겼습니다.
- source_word: אֲשֶׁר בְּךָ
  english_pob_choice: in whom / in you
  chosen_korean: 너 안에서
  alternatives_korean:
  - 네 안에서
  - 너를 통해
  lexicon: HALOT
  rationale: 전치사 בְּ는 기본적으로 ‘~안에’의 의미이므로, 인격적 대상에 대해 한국어에서는 ‘너 안에서’가 가장 직접적이고 문맥상 자연스럽습니다.
- source_word: אֶתְפָּאָר
  english_pob_choice: I will be glorified
  chosen_korean: 영광을 나타낼 것이다
  alternatives_korean:
  - 영광을 받겠다
  - 영화롭게 될 것이다
  - 영광을 드러낼 것이다
  lexicon: HALOT
  rationale: 히트파엘형의 반사적 뉘앙스를 살리되, 한국어에서 ‘내가 영광을 받겠다’보다 ‘영광을 나타낼 것이다’가 하나님이 자신의 영광을 드러내신다는 뜻을 더 직접적으로 전합니다.
- source_word: וַיֹּאמֶר לִי
  english_pob_choice: And he said to me
  chosen_korean: 그가 나에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 내게 말씀하셨습니다
  - 그가 나에게 이르셨습니다
  lexicon: HALOT
  rationale: 서사 진행의 וַ-를 ‘그리고’보다 자연스러운 직설형으로 풀고, 하나님 말씀의 존대를 반영하여 ‘말씀하셨습니다’를 선택했습니다.
theological_decisions:
- issue: ‘이스라엘’의 정체를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 ‘너는 내 종, 이스라엘이다’라고 직역하되, 이스라엘이 민족 전체인지, 남은 자인지, 대표적 인물인지 해석을 본문 밖에서 결정하지 않습니다.
  alternative_readings:
  - 이스라엘 민족 전체
  - 신실한 남은 자
  - 이스라엘을 대표하는 개인적 종
  rationale: 이사야 종 노래는 이 정체성에 의도적인 긴장을 남기므로, 번역문에서 그 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
