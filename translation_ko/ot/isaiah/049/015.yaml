- from: 여인이 자기 젖먹이 아이를 잊을 수 있습니까? 자기 태의 아들을 가엾게 여기지 않을 수 있습니까? 비록 그들마저 잊을지라도, 나는 너를 잊지 않겠습니다.[a]
  to: 여인이 자기 젖먹이 아이를 잊을 수 있습니까? 자기 태에서 난 아들을 가엾게 여기지 않을 수 있습니까? 그 여인들도 잊을 수 있으나, 나는 너를 잊지 않겠습니다.[a]
  rationale: 각주의 여성 소유 대명사 오류를 바로잡고, 현대 한국어에서 더 자연스러운 표현으로 수정했습니다. 또한 마지막 절의 지시 대상이 앞의 여인들임을 밝혀, ‘심지어 이들’이라는 히브리어의 강조와 ‘잊을 수 있다’는 가능성의 뉘앙스를 보존했습니다.
