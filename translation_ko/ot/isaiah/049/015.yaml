id: ISA.49.15
reference: Isaiah 49:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
  footnotes:
  - marker: a
    text: 'Or, ''the child of her womb.'' Hebrew: ''the son of her womb.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여인이 자기 젖먹이 아이를 잊을 수 있습니까? 자기 태의 아들을 가엾게 여기지 않을 수 있습니까? 비록 그들마저 잊을지라도, 나는 너를 잊지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 태의 아이’. 히브리어는 직역하면 ‘그의 태의 아들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תִשְׁכַּח
  english_pob_choice: Can ... forget
  chosen_korean: 잊을 수 있습니까?
  alternatives_korean:
  - 잊습니까?
  - 잊을까요?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서는 가능성·상식의 충격을 드러내는 ‘-을 수 있습니까?’로 옮겨 원문의 강한 반문 효과를 살렸습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 여인
  alternatives_korean:
  - 여자
  - 어머니
  lexicon: HALOT
  rationale: 원문은 ‘어머니’가 아니라 ‘여인/아내’를 뜻하는 אִשָּׁה를 사용하므로, 모성적 문맥을 유지하면서도 단어 자체를 살리는 ‘여인’이 적절합니다.
- source_word: עוּלָהּ
  english_pob_choice: her nursing child
  chosen_korean: 자기 젖먹이 아이
  alternatives_korean:
  - 자기 젖먹는 아이
  - 자기 젖먹이 아기
  lexicon: HALOT
  rationale: עוּלָהּ는 젖을 먹는 의존적 어린아이를 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘젖먹이 아이’로 옮겼습니다.
- source_word: בֶּן בִּטְנָהּ
  english_pob_choice: the son of her womb
  chosen_korean: 자기 태의 아들
  alternatives_korean:
  - 태에서 난 아들
  - 자기 배의 아들
  lexicon: HALOT
  rationale: בן이 분명히 ‘아들’이므로 이를 유지했고, בִּטְנָהּ는 직역 성격을 살려 ‘태의’로 표현해 모성적 이미지와 히브리어의 생생함을 보존했습니다.
- source_word: מֵ/רַחֵם
  english_pob_choice: have no compassion
  chosen_korean: 가엾게 여기지 않을 수 있습니까?
  alternatives_korean:
  - 불쌍히 여기지 않을 수 있습니까?
  - 자비를 베풀지 않을 수 있습니까?
  lexicon: HALOT
  rationale: רחם의 핵심 감정은 ‘불쌍히 여기다/가엾게 여기다’이므로, 문맥상 모성적 정서를 살리면서도 한국어에서 자연스러운 ‘가엾게 여기다’를 채택했습니다.
theological_decisions:
- issue: 마지막 대조문의 확신 표현
  chosen_reading: 비록 그들마저 잊을지라도, 나는 너를 잊지 않겠습니다.
  alternative_readings:
  - 그들이 잊을지라도 나는 너를 잊지 않겠습니다.
  - 그들마저 잊을 수 있어도 나는 너를 잊지 않겠습니다.
  rationale: 히브리어의 양보절과 하나님의 단호한 부정을 그대로 살려, 인간의 극단적 실패 가능성 앞에서도 하나님의 기억이 흔들리지 않는다는 대비를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, points 3 and 6
