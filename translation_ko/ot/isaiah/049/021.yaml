source:
  edition: WLC
  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: ko
  text: 그러면 너는 마음속으로 이렇게 말할 것입니다. ‘누가 나를 위해 이 아이들을 낳았습니까? 나는 자식을 잃고 불모였으며, 포로로 끌려가 버림받았는데, 이 아이들을 누가 길렀습니까? 보십시오, 나는 홀로 남겨졌습니다. 그런데 이 아이들은 대체 어디서 왔습니까?’[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: “마음속으로”는 직역적으로 ‘네 마음 안에서’라는 내적 발화를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘버림받았는데’는 WLC의 וְסוּרָה와 영어 POB의 “cast off”를 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: מִי יָלַד לִי אֶת אֵלֶּה
  english_pob_choice: Who has borne these for me
  chosen_korean: 누가 나를 위해 이 아이들을 낳았습니까?
  alternatives_korean:
  - 누가 나를 위해 이들을 낳았습니까?
  - 누가 이 아이들을 내게 낳았습니까?
  lexicon: מִי / יָלַד
  rationale: 출산 동사를 직접 살리되, 한국어에서는 자연스러운 목적어 구성을 위해 ‘나를 위해’로 옮겼습니다. 문맥상 자녀를 가리키는 집합적 뉘앙스를 반영해 ‘이 아이들’로 번역했습니다.
- source_word: שְׁכוּלָה וְגַלְמוּדָה גֹּלָה וְסוּרָה
  english_pob_choice: bereaved and barren, exiled and cast off
  chosen_korean: 자식을 잃고 불모였으며, 포로로 끌려가 버림받았는데
  alternatives_korean:
  - 과부였고 불임이었으며, 유배되고 내쫓겼는데
  - 자식을 잃고 자식이 없었으며, 유배되고 버림받았는데
  lexicon: שְׁכוּלָה / גַּלְמוּדָה / גֹּלָה / סוּרָה
  rationale: 각 형용사의 병렬을 유지하되, ‘쓸쓸한/홀로된’ 계열의 완곡어보다 문맥이 요구하는 상실과 추방의 강도를 드러내는 표현을 택했습니다. ‘cast off’에 맞춰 ‘버림받았는데’로 마무리해 POB의 의미 흐름을 따랐습니다.
- source_word: וְאֵלֶּה מִי גִדֵּל
  english_pob_choice: And these—who has raised them?
  chosen_korean: 이 아이들을 누가 길렀습니까?
  alternatives_korean:
  - 이들은 누가 키웠습니까?
  - 이 아이들을 누가 양육했습니까?
  lexicon: גִּדֵּל
  rationale: 히브리어의 ‘키우다/양육하다’ 의미를 살리되, 문학적·자연스러운 한국어로는 ‘기르다’가 가장 직접적입니다. 직역적이면서도 구어적으로 읽히도록 하였습니다.
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  english_pob_choice: I was left alone
  chosen_korean: 나는 홀로 남겨졌습니다
  alternatives_korean:
  - 나는 혼자 남았습니다
  - 나는 외롭게 남겨졌습니다
  lexicon: נִשְׁאַרְתִּי
  rationale: 수동적 잔존을 드러내는 동사 형태를 살려 ‘남겨졌습니다’로 번역했습니다. ‘홀로’는 문맥의 고립감을 분명히 하되 과도한 해석은 피합니다.
theological_decisions:
- issue: 포로/추방 이미지의 번역 강도
  chosen_reading: ‘포로로 끌려가 버림받았는데’로 옮겨, 시온의 상실·추방·고아성의 중첩을 약화하지 않았습니다.
  alternative_readings:
  - ‘유배되어 떠나고 버림받았는데’
  - ‘내쫓기고 버려졌는데’
  rationale: 본문은 단순한 거리 이동이 아니라 공동체적 상실과 배제를 함께 말하므로, 수치와 단절의 무게가 드러나도록 했습니다.
  doctrine_reference: 이사야 49장의 시온 회복 약속
- issue: 신적 질문의 수사적 효과
  chosen_reading: “보십시오”를 넣어 전환점을 분명히 하여, 놀라움과 반전의 수사학을 보존했습니다.
  alternative_readings:
  - “보라”
  - 생략
  rationale: 히브리어 הֵן의 감탄/지시 기능을 한국어 독자에게 자연스럽게 전달하기 위한 선택입니다.
  doctrine_reference: 예언 문학의 수사적 강조
