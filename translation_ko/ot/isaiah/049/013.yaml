    reason: alternative_reading
  - marker: b
    text: 또는 '그의 가난한 자' 또는 '그의 겸손한 자'. 히브리어 용어는 고난 받는 자, 가난한 자, 또는 겸손한 자를 나타낼 수 있다.
    reason: alternative_reading
