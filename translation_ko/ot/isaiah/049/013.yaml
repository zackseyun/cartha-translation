  text: 하늘이여, 기뻐 외치며[a], 땅이여, 기뻐 노래하라. 산들이여, 기쁨의 노래를 부르라[c][b]. 주께서 그의 백성을 위로하셨고, 그의 가난한 자를 긍휼히 여기실 것임이니라.
  philosophy: optimal-equivalence
