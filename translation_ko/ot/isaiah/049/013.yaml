base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
  footnotes:
  - marker: a
    text: Or 'Sing for joy, O heavens.' The Hebrew verb can also be rendered 'sing for joy' rather than 'shout for joy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his poor' or 'his humble.' The Hebrew term can denote those who are afflicted, poor, or humble.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 하늘이여, 기뻐 외치십시오[a]. 땅이여, 기뻐하십시오. 산들이여, 기쁨의 노래를 터뜨리십시오. 이는 야훼께서[c] 그분의 백성을 위로하셨고, 그분의 고난받는 이들을[b] 긍휼히 여기실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘이여, 기뻐 노래하십시오.’ 히브리어 동사는 ‘기뻐 노래하다’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 가난한 이들’ 또는 ‘그분의 겸손한 이들’. 히브리어 용어는 고난받는 이들, 가난한 이들, 또는 겸손한 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 YHWH는 신성한 이름이며, 여기서는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
