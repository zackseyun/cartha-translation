  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 히브리어의 병렬 구조와 각 어휘 대안의 연결을 더 분명히 할 필요가 있습니다. 특히 נְצִירֵי יִשְׂרָאֵל의 ‘보존된 이들’은 유지할 수 있으나, 해당 대안 각주가 본문의 해당 표현에 직접 붙어야 합니다.
  naturalness: ‘너를 또한 여러 민족의 빛으로’보다 ‘또한 너를 여러 민족의 빛으로’가 현대 표준 한국어에서 더 자연스럽습니다. ‘보전된 이들’은 사람을 수식할 때 다소 행정적이므로 ‘보존된 이들’이 더 자연스럽습니다.
  terminology: ‘내 종’, ‘야곱의 지파들’, ‘여러 민족’, ‘내 구원’은 원문의 어휘와 신학적 개방성을 적절히 보존합니다. ‘이방인들’은 가능한 대안으로 각주에만 두는 것이 적절합니다.
