id: ISA.49.6
reference: Isaiah 49:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
  footnotes:
  - marker: a
    text: Or “the survivors of Israel” for “the preserved ones of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “a light to the nations”; also, “Gentiles” is a possible rendering of “nations.”
    reason: lexical_alternative
  - marker: c
    text: Or “to the ends of the earth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분이 말씀하셨습니다. 「네가 내 종이 되어 야곱의 지파들을 일으키고 이스라엘의 보전된 이들을 돌아오게 하는 것만으로는 너무 작은 일이다. 나는 너를 또한 여러 민족의 빛으로 삼아, 땅 끝까지 내 구원이 되게 하겠다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 살아남은 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들’로도 옮길 수 있으며, ‘이방인들’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘땅의 끝들까지’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  english_pob_choice: too small a thing
  chosen_korean: 너무 작은 일
  alternatives_korean:
  - 너무 가벼운 일
  - 너무 보잘것없는 일
  lexicon: HALOT
  rationale: 문맥에서 ‘사명에 비해 부족하다’는 뜻을 살려, 자연스러운 한국어 표현인 ‘너무 작은 일’을 택했습니다.
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종된 자
  - 노예
  lexicon: HALOT
  rationale: 이사야의 종 노래에서는 직분적·소명적 호칭이므로, POB의 ‘servant’를 한국어 관용보다 더 직접적으로 옮길 수 있는 ‘종’을 사용했습니다.
- source_word: נְצִירֵי יִשְׂרָאֵל
  english_pob_choice: the preserved ones of Israel
  chosen_korean: 이스라엘의 보전된 이들
  alternatives_korean:
  - 이스라엘의 살아남은 이들
  - 이스라엘의 보호된 이들
  lexicon: HALOT
  rationale: 어근 נצר의 ‘지켜 보존하다’는 뜻을 반영해, POB의 보전(保全) 의미를 살리는 ‘보전된 이들’로 옮겼습니다.
- source_word: גּוֹיִם
  english_pob_choice: nations
  chosen_korean: 여러 민족
  alternatives_korean:
  - 열방
  - 민족들
  - 이방인들
  lexicon: HALOT
  rationale: 여기서는 이스라엘과 대비되는 구체적 민족 집단을 가리키므로, 교회적 관용어보다 중립적인 ‘여러 민족’이 원문 범위를 잘 반영합니다.
theological_decisions:
- issue: 사명의 이중 초점
  chosen_reading: 이스라엘의 회복과 여러 민족을 향한 하나님의 구원 확장을 함께 드러내도록 번역했습니다.
  alternative_readings:
  - 이스라엘만을 향한 사명으로 제한하는 읽기
  - 메시아적 동일시를 번역문에 명시하는 읽기
  rationale: 히브리어 본문은 야곱/이스라엘에 대한 회복과 민족들을 향한 확장을 함께 제시하므로, 그 긴장을 유지하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §3
