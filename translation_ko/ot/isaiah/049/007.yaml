source:
  edition: WLC
  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
  footnotes:
  - marker: a
    text: Or 'to the one despised,' 'to one deeply despised,' or possibly 'despised by people'; the Hebrew expression is compressed and difficult.
    reason: lexical_alternative
  - marker: b
    text: Or 'abhorred by nations' or 'one whom the nation abhors.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a servant of rulers'; Hebrew עֶבֶד can mean either 'servant' or 'slave,' but here the context of humiliation favors 'slave.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew may imply that kings and princes honor the servant, with the LORD as the ultimate reason for that homage; the exact object of 'bow down' is not explicitly stated.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘의 구속자이시며 이스라엘의 거룩하신 이이신 여호와께서, 사람들에게[a] 멸시받는 자, 한 민족에게 미움을 받는 자[b], 통치자들의 종[c]인 너에게 이렇게 말씀하십니다. 왕들은 보고 일어서며, 고관들은 엎드려 절할 것입니다[d]. 이는 신실하신 여호와, 이스라엘의 거룩하신 이, 곧 너를 택하신 분 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들에게 멸시받는 자’에 해당하는 히브리어 표현은 압축되어 있습니다. ‘몹시 멸시받는 자’ 또는 ‘멸시받는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한 민족’은 히브리어 단수형을 집합적 또는 대표적 의미로 옮긴 것입니다. ‘민족들에게 미움을 받는 자’로 이해할 가능성도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘종’(עֶבֶד)은 ‘하인’ 또는 ‘노예’를 뜻할 수도 있습니다. 여기서는 통치자들 아래의 굴욕적 종속 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 고관들이 누구에게 절하는지를 직접 밝히지 않습니다. 문맥은 멸시받던 자의 높아짐을 보이면서, 그 이유를 여호와의 신실하심과 선택에 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 표준 관용
  rationale: 한국 교회 언어권에서 본문 수용성을 고려해 전통적으로 가장 널리 알려진 신명칭을 사용하되, 본문이 지시하는 고유한 신적 이름을 유지합니다.
- source_word: לִבְזֹה נֶפֶשׁ
  english_pob_choice: to one despised in soul
  chosen_korean: 심령으로 멸시를 받는 자
  alternatives_korean:
  - 영혼으로 멸시를 받는 자
  - 심히 멸시를 받는 자
  - 마음으로 업신여김을 받는 자
  lexicon: HALOT
  rationale: 네페쉬를 문자적으로 드러내면서도 한국어에서 자연스럽게 읽히도록 '심령으로'를 택해, 단순히 정도를 강화한 표현으로만 평탄화하지 않았습니다.
- source_word: לִמְתָעֵב גּוֹי
  english_pob_choice: abhorred by the nation
  chosen_korean: 나라에게서 혐오를 받는 자
  alternatives_korean:
  - 민족에게서 혐오를 받는 자
  - 국가에게서 미움을 받는 자
  - 나라가 혐오하는 자
  lexicon: HALOT
  rationale: 단수 גּוֹי의 집합적 의미를 살려 '나라'로 옮기고, 수동형 관계를 분명히 하기 위해 '받는 자'를 사용했습니다.
- source_word: לְעֶבֶד מֹשְׁלִים
  english_pob_choice: a servant/slave of rulers
  chosen_korean: 통치자들의 종
  alternatives_korean:
  - 통치자들의 노예
  - 통치자들의 하인
  - 지배자들의 종
  lexicon: HALOT
  rationale: 여기서는 굴욕적 종속 상태를 드러내되, 한국어에서 지나치게 법적·현대적 뉘앙스의 '노예'보다 문맥상 더 자연스러운 '종'을 택했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  - 이스라엘의 거룩한 분
  lexicon: 이사야서 관용 표현
  rationale: 이사야서의 신적 칭호를 일관되게 살리면서, 한국어에서 인격적 호칭으로 자연스러운 '거룩하신 이'를 사용했습니다.
theological_decisions:
- issue: קְדוֹשׁוֹ('his Holy One')의 지시 대상
  chosen_reading: 구속자/여호와와 병렬된 별도의 호칭으로 처리해, 문맥상 수신자(고난받는 종)를 가리키는 긴장감을 그대로 남겼습니다.
  alternative_readings:
  - 앞의 여호와에 대한 동격 설명으로 묶는 해석
  - 본문을 매끄럽게 하려고 호칭을 재배열하는 해석
  rationale: 히브리어의 압축된 구조가 주는 긴장감을 해소하지 않고, 본문이 의도한 복합적 호칭 관계를 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장 보존
- issue: 왕들과 고관들의 절함의 대상
  chosen_reading: 절의 직접 대상은 명시하지 않고, 여호와 때문이라는 이유만 분명히 했습니다.
  alternative_readings:
  - 종에게 절하는 것으로 명시
  - 여호와께 절하는 것으로 명시
  rationale: 원문은 종의 높임과 여호와를 이유로 제시하지만, 절의 정확한 대상은 분명히 고정하지 않습니다. 그 모호성을 유지했습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
