id: ISA.49.8
reference: Isaiah 49:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
  footnotes:
  - marker: a
    text: Or “at an acceptable time.”
    reason: lexical_alternative
  - marker: b
    text: Or “in a day of deliverance.”
    reason: lexical_alternative
  - marker: c
    text: Or “I will guard you.”
    reason: lexical_alternative
  - marker: d
    text: Or “give you as a covenant to the people.”
    reason: lexical_alternative
  - marker: e
    text: Or “to establish the land” or “to restore the land.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이같이 말씀하십니다. “은혜의 때에[a] 내가 네게 응답하였고, 구원의 날에[b] 내가 너를 도왔다. 내가 너를 지키고[c], 너를 백성을 위한 언약으로 주어[d], 땅을 일으키고[e] 황폐한 상속지들을 나누어 주게 하겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “받아들여질 만한 때에”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “구출의 날에”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “내가 너를 보호하겠다.”
    reason: lexical_alternative
  - marker: d
    text: 또는 “너를 백성에게 언약으로 주어.”
    reason: lexical_alternative
  - marker: e
    text: 또는 “땅을 세우기 위해” 혹은 “땅을 회복하기 위해”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 여호와 대신 프로젝트 기본값인 야훼를 사용하여 언약적 신명과 원문 대응성을 살렸습니다.
- source_word: בְּעֵת רָצוֹן
  english_pob_choice: In a time of favor
  chosen_korean: 은혜의 때
  alternatives_korean:
  - 호의의 때
  - 받아들여지는 때
  lexicon: HALOT
  rationale: רָצוֹן은 호의/은총/받아들임의 뜻을 가지므로, 직역에 가깝고 한국어로도 자연스러운 ‘은혜의 때’로 옮겼습니다.
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  english_pob_choice: give you as a covenant for the people
  chosen_korean: 너를 백성을 위한 언약으로 주어
  alternatives_korean:
  - 너를 백성에게 언약으로 주어
  - 너를 백성의 언약으로 주어
  lexicon: HALOT
  rationale: 히브리어는 단순히 언약을 주는 것이 아니라 ‘너’를 언약으로 주는 구조이므로, 그 밀도를 살려 ‘백성을 위한 언약으로’라고 옮겼습니다.
- source_word: לְהָקִים אֶרֶץ
  english_pob_choice: to raise up the land
  chosen_korean: 땅을 일으키고
  alternatives_korean:
  - 땅을 세우고
  - 땅을 회복하고
  lexicon: HALOT
  rationale: קום의 동적인 이미지와 POB의 ‘raise up’ 선택을 따라, 단순한 추상어보다 ‘일으키다’로 옮겼습니다.
- source_word: לְהַנְחִיל נְחָל֥וֹת שֹׁמֵמֽוֹת
  english_pob_choice: to apportion the desolate inheritances
  chosen_korean: 황폐한 상속지를 나누어 주게 하겠습니다
  alternatives_korean:
  - 황폐한 기업들을 분배하게 하겠습니다
  - 황폐한 유산들을 나누어 주게 하겠습니다
  lexicon: HALOT
  rationale: נחלה는 상속된 몫/기업을 가리키므로 전통교회어법의 ‘기업’보다 의미가 분명한 ‘상속지’를 택했고, 분배 동사는 문맥상 ‘나누어 주다’가 자연스럽습니다.
theological_decisions:
- issue: ‘너를 … 언약으로’라는 표현의 신학적 밀도 유지
  chosen_reading: 중간 설명어를 덧붙여 약화시키지 않고, 인칭 대명사 ‘너’를 언약적 존재로 주시는 원문 구조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘언약의 중개자로’
  - ‘언약을 세우기 위해’
  rationale: 원문은 인물을 언약의 수단이 아니라 언약 그 자체와 연결하므로, 그 긴장을 보존하는 번역이 본문에 더 충실합니다.
  doctrine_reference: 예언자-종의 언약적 역할을 본문 수준에서 유지
