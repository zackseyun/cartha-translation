base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
  footnotes:
  - marker: a
    text: Or 'for a road' or 'as a way.' The Hebrew may emphasize either result ('make into a road') or purpose ('set for a road').
    reason: lexical_alternative
  - marker: b
    text: Or 'my roads will be lifted up.' The Hebrew term can refer to a built-up roadway or highway.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 모든 내 산들을 길로 만들고, 내 큰길들은 높아질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길로’(목적) 또는 ‘길로 만들어’(결과). 히브리어는 목적과 결과 중 어느 쪽을 더 강조하는지 열려 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 큰길들은 높이 올려질 것입니다.’ 히브리어는 조성된 고가 도로의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 만들고
  alternatives_korean:
  - 내가 … 두고
  - 내가 … 세우고
  lexicon: HALOT
  rationale: שׂים의 결과적 변형 의미를 살려, 산들을 단순히 ‘두는’ 것보다 ‘길로 만들다’가 원문의 변화 이미지를 가장 직접적으로 드러냅니다.
- source_word: לַדָּרֶךְ
  english_pob_choice: into a road
  chosen_korean: 길로
  alternatives_korean:
  - 길을 위하여
  - 길로서
  lexicon: HALOT
  rationale: ל + 명사 구문은 여기서 목적보다 결과를 강하게 띠므로, ‘길로’가 산이 실제로 통행 가능한 길이 되는 그림을 자연스럽게 전달합니다.
- source_word: וּמְסִלֹּתַי
  english_pob_choice: my highways
  chosen_korean: 내 큰길들
  alternatives_korean:
  - 내 도로들
  - 내 길들
  lexicon: HALOT
  rationale: מְסִלָּה는 일반적인 ‘길’보다 조성된 ‘큰길/대로’의 뉘앙스가 있어, 산과 평행을 이루는 준비된 통로 이미지를 살리기 위해 ‘큰길들’로 옮겼습니다.
- source_word: יְרֻמוּן
  english_pob_choice: will be raised up
  chosen_korean: 높아질 것입니다
  alternatives_korean:
  - 올라갈 것입니다
  - 들려 올려질 것입니다
  - 높이 세워질 것입니다
  lexicon: HALOT
  rationale: רום의 상태 변화를 한국어로 자연스럽게 반영하면서, 도로가 실제로 높아지는 토목적 이미지를 보존하기 위해 ‘높아질 것입니다’를 택했습니다.
theological_decisions:
- issue: 산과 큰길의 상징적-물리적 긴장
  chosen_reading: 지형을 바꾸어 길을 내시는 하나님의 구원 행위를 구체적 이미지로 유지했습니다.
  alternative_readings:
  - 영적 장애물을 제거하신다는 비유로만 읽기
  - 포로 귀환을 위한 문자적 도로 조성으로만 읽기
  rationale: 본문은 실제 지형 언어를 사용하므로, 상징으로만 약화시키거나 문자적으로만 고정하지 않고 원문의 긴장을 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
