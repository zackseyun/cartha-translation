  - severity: low
    issue: ‘뜨거운 열기와 해도’ 및 ‘물 샘들’의 어법이 다소 부자연스럽습니다.
    rationale: 부정문의 병렬은 ‘작열하는 더위나 해가’가 자연스럽고, ‘물의 샘들’은 한국어 명사 연결로 더 매끄럽습니다.
  - severity: low
    issue: 각주 표지가 절 끝에 함께 놓여 있어 각각의 대안이 가리키는 어구가 불명확합니다.
    rationale: a는 열기·해의 결합 표현 뒤에, b는 ‘물의 샘들로’ 뒤에 배치하여 각주 앵커를 분명히 해야 합니다.
