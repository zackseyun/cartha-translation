id: ISA.49.10
reference: Isaiah 49:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
  footnotes:
  - marker: a
    text: Or 'nor will parching heat or the sun strike them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he will guide them beside springs of water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 배고프지도 목마르지도 않을 것이며, 작열하는 더위나 해가 그들을 치지 않을 것입니다.[a] 이는 그들에게 자비를 베푸시는 분께서 그들을 인도하시고 물의 샘들로 이끄실 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘작열하는 더위와 해가 그들을 치지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘물의 샘들 곁으로 이끄실 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִרְעָבוּ וְלֹא יִצְמָאוּ
  english_pob_choice: They will not hunger or thirst
  chosen_korean: 배고프지도 목마르지도 않을 것입니다
  alternatives_korean:
  - 굶주리지도 않고 목마르지도 않을 것입니다
  - 주리거나 목마르지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사형의 병렬을 살리되, 한국어에서는 상태 동사보다는 자연스러운 관용적 표현인 ‘배고프다/목마르다’로 옮겼습니다.
- source_word: שָׁרָב וָשָׁמֶשׁ
  english_pob_choice: scorching heat or sun
  chosen_korean: 뜨거운 열기와 해
  alternatives_korean:
  - 작열하는 더위와 해
  - 살을 태우는 열기와 해
  lexicon: HALOT
  rationale: שָׁרָב은 단순한 ‘열’보다 사막의 작열하는 더위를 가리키므로, 본문의 강한 체험성을 살려 ‘뜨거운 열기’로 옮겼습니다.
- source_word: יַכֵּם
  english_pob_choice: strike them
  chosen_korean: 그들을 치지 못할 것입니다
  alternatives_korean:
  - 그들을 때리지 못할 것입니다
  - 그들을 공격하지 못할 것입니다
  lexicon: HALOT
  rationale: 히필형 נכה의 물리적 타격 이미지를 유지하면서, 한국어에서는 ‘치다’가 자연스럽고 직설적인 대응이 됩니다.
- source_word: מְרַחֲמָם
  english_pob_choice: the one who has compassion on them
  chosen_korean: 그들을 불쌍히 여기는 이
  alternatives_korean:
  - 그들을 긍휼히 여기는 이
  - 그들에게 자비를 베푸는 이
  lexicon: HALOT
  rationale: 접미사로 연결된 분사구를 ‘그들을 불쌍히 여기는 이’로 옮겨, 추상명사화하지 않고 지속적 행위를 드러냈습니다.
- source_word: יְנַהֲגֵם
  english_pob_choice: will lead them
  chosen_korean: 그들을 인도할 것이며
  alternatives_korean:
  - 그들을 이끌 것이며
  - 그들을 데리고 갈 것이며
  lexicon: HALOT
  rationale: נָהַג의 인도/이끌다 의미를 살리되, 시적 문맥에서 한국어 성서 문체와 잘 맞는 ‘인도하다’를 택했습니다.
- source_word: וְעַל מַבּוּעֵי מַיִם יְנַהֲלֵם
  english_pob_choice: he will guide them to springs of water
  chosen_korean: 그들을 물 샘들로 이끌 것이기 때문입니다
  alternatives_korean:
  - 그들을 물 샘들 곁으로 이끌 것이기 때문입니다
  - 그들을 물 샘들 옆으로 인도할 것이기 때문입니다
  lexicon: HALOT
  rationale: עַל의 방향성을 고려해 단순한 위치보다 도착/이동의 느낌을 주는 ‘로’ 계열 표현을 사용했고, מַבּוּעֵי מַיִם는 구체적 이미지인 ‘물 샘들’로 옮겼습니다.
theological_decisions:
- issue: 하나님을 직접 호명하지 않는 분사구의 처리
  chosen_reading: ‘그들을 불쌍히 여기는 이’로 본문을 유지해, 하나님의 묘사적 호칭을 본문 안에 직접 삽입하지 않았습니다.
  alternative_readings:
  - ‘하나님께서 그들을 불쌍히 여기시며’
  - ‘그들을 긍휼히 여기시는 분’
  rationale: 히브리어 분사 מְרַחֲמָם은 문맥상 하나님을 가리키지만, 본문은 명시적 호칭보다 묘사적 표현을 사용합니다. 한국어도 이를 보존해 원문의 긴장을 유지했습니다.
  doctrine_reference: original-language primacy over translation tradition
