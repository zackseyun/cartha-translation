  to: 그들은 배고프지도 목마르지도 않을 것이며, 작열하는 더위나 해가 그들을 치지 않을 것입니다.[a] 이는 그들에게 자비를 베푸시는 분께서 그들을 인도하시고 물의 샘들로 이끄실 것이기 때문입니다.[b]
