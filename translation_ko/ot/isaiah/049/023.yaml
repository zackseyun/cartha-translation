  source_fidelity: 전반적으로 원문에 충실합니다. 다만 אֹמְנַיִךְ는 남성 복수 명사로, 본문의 ‘양육자들’은 돌봄의 뜻을 잘 살리지만 남성 표지를 중화합니다. 본문에서는 자연스러운 ‘양육자들’을 유지하되 각주에서 ‘너를 기르는 아버지들’이라는 직역적 대안을 제시하는 것이 안전합니다. מֵינִיקֹתַיִךְ는 ‘너에게 젖을 먹이는 어머니들’로 해야 수식 관계가 분명합니다.
  naturalness: ‘너의 젖먹이는 어머니들’은 ‘젖을 먹는 어머니들’로도 순간적으로 읽힐 수 있어 현대 한국어로 다소 부자연스럽습니다. ‘너에게 젖을 먹이는 어머니들’이 명확하고 자연스럽습니다. 또한 각주 표지는 해당 어휘가 나오는 자리 가까이에 두는 편이 독자에게 분명합니다.
  terminology: ‘야훼’, ‘임금들’, ‘공주들’, ‘수치를 당하지 않을 것입니다’은 문맥과 합쇼체 문체에 적절합니다. השתחוה는 여기서 시온을 향한 굴복과 경의이므로 ‘절하고’가 ‘예배하다’보다 적절합니다.
