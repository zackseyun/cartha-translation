source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
  footnotes:
  - marker: a
    text: Or 'your foster fathers.' The Hebrew term can denote those who rear, support, or protect.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who hope in me.' The Hebrew verb includes both waiting and hopeful expectation.
    reason: lexical_alternative
translation:
  language: ko
  text: 임금들은 너의 양육자들[a]이 되고, 그들의 공주들은 너에게 젖을 먹이는 어머니들이 될 것입니다. 얼굴을 땅에 대고 너에게 절하고, 네 발의 먼지를 핥을 것입니다. 그제야 너는 내가 야훼임을 알게 될 것입니다. 나를 기다리는 이들[b]은 수치를 당하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 기르는 아버지들’. 히브리어는 기르고, 지탱하고, 보호하는 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 바라는 이들’. 히브리어 동사는 기다림과 희망의 기대를 함께 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  english_pob_choice: your foster fathers
  chosen_korean: 너의 양육자들
  alternatives_korean:
  - 너의 양부들
  - 너의 후견인들
  - 너를 길러 주는 이들
  lexicon: HALOT
  rationale: 양육자는 ‘기르고 돌보고 보호하는 이들’이라는 뜻을 살리면서도, 영어의 foster fathers보다 한국어에서 더 자연스럽고 성별을 과도하게 한정하지 않습니다.
- source_word: שָׂרוֹתֵיהֶם
  english_pob_choice: their princesses
  chosen_korean: 그들의 공주들
  alternatives_korean:
  - 그들의 왕비들
  - 그들의 귀부인들
  - 그들의 귀족 여성들
  lexicon: HALOT
  rationale: שר의 여성형 복수는 왕족/귀족 여성의 지위를 가리키므로, ‘공주들’이 임금들과의 평행을 가장 자연스럽게 드러냅니다.
- source_word: מֵינִיקֹתַיִךְ
  english_pob_choice: your nursing mothers
  chosen_korean: 너의 젖먹이는 어머니들
  alternatives_korean:
  - 너를 젖먹이는 어머니들
  - 너의 유모들
  - 너의 젖먹이는 여성들
  lexicon: HALOT
  rationale: 모성적 돌봄의 이미지를 살리되, ‘유모’보다 원문의 능동적 동사를 더 분명하게 드러내기 위해 ‘젖먹이는 어머니들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유신명 יְהוָה는 제목이 아니라 하나님의 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 그 고유성을 보존했습니다.
- source_word: לֹא יֵבֹשׁוּ
  english_pob_choice: will not be put to shame
  chosen_korean: 수치를 당하지 않을 것입니다
  alternatives_korean:
  - 부끄러움을 당하지 않을 것입니다
  - 수치스럽게 되지 않을 것입니다
  - 망신을 당하지 않을 것입니다
  lexicon: HALOT
  rationale: 예언문맥의 수동적 수치/굴욕의 의미를 살리면서, 현대 한국어에서 가장 자연스럽고 강한 표현으로 옮겼습니다.
- source_word: קוָֹי
  english_pob_choice: those who wait for me
  chosen_korean: 나를 기다리는 이들
  alternatives_korean:
  - 나를 바라는 이들
  - 나를 소망하며 기다리는 이들
  - 나를 기다리며 바라는 이들
  lexicon: HALOT
  rationale: קוה는 ‘기다리다’와 ‘바라다’의 뉘앙스를 함께 가지므로, 본문에는 기본 의미를 살린 ‘기다리는 이들’을 쓰고 대안 의미는 주해적 여지로 남깁니다.
- source_word: אַפַּיִם אֶרֶץ יִשְׁתַּחֲווּ לָךְ
  english_pob_choice: With faces to the ground they will bow down to you
  chosen_korean: 얼굴을 땅에 대고 그들이 너에게 절하며
  alternatives_korean:
  - 땅에 엎드려 너에게 절하며
  - 얼굴을 땅에 대고 너에게 엎드려 절하며
  - 땅에 얼굴을 대고 너에게 절하며
  lexicon: HALOT
  rationale: ‘얼굴을 땅에 대고’는 히브리어의 굴복 자세를 선명하게 보존하며, ‘절하다’는 השתחוה의 공손한 굴복 행위를 자연스럽게 전달합니다.
theological_decisions:
- issue: 왕들과 공주들의 행위를 ‘예배’로 번역할지 여부
  chosen_reading: 사회적·정치적 경배/복종의 의미로 ‘절하다’로 옮겼습니다.
  alternative_readings:
  - 예배하다
  - 경배하다
  rationale: 문맥의 대상은 하나님이 아니라 시온에게 경의를 표하는 왕족들이므로, ‘예배’보다 ‘절하다’가 원문의 역사적·비유적 장면을 더 정확히 보존합니다.
  doctrine_reference: 원문이 허용하는 긴장을 유지하고, 하나님께만 속한 예배 개념을 본문에 과도하게 이식하지 않습니다.
- issue: ‘야훼’의 표기 사용
  chosen_reading: 고유신명 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 자기계시를 직접적으로 말하므로, 대체 호칭보다 이름 자체를 드러내는 표기가 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 프로젝트 기본 원칙상 YHWH는 ‘야훼’로 옮기되, 본문 기능에 따라 각주 없이 본문에 반영합니다.
