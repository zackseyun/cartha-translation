id: ISA.49.22
reference: Isaiah 49:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
  footnotes:
  - marker: a
    text: Or 'raise my signal' or 'raise my standard' for 'raise my banner.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the bosom' or 'in the fold [of the garment]'; the sense is that the children are carried close against the body.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 여호와께서 이렇게 말씀하십니다. "보라, 내가 내 손을 나라들에게 들고 내 깃발을 백성들에게 세우리니, 그들이 네 아들들을 품에 안아 데려오고 네 딸들은 어깨에 메고 오리라."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 깃발’을 뜻하지만, ‘내 신호’ 또는 ‘내 표준’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘품/가슴 안에’이며, 아이를 몸에 바싹 붙여 운반한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 여호와 하나님
  lexicon: WLC / 전통적 한글 성경 관용
  rationale: אֲדֹנָי와 יְהוִה의 결합은 경외적 호칭 결합이므로, 본문이 가리키는 신적 칭호를 살리면서도 한국어에서 자연스러운 형식인 ‘주 여호와’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄사로서, 현대어에서도 격식을 유지하는 ‘보라’가 원문의 긴박성과 엄숙함을 잘 살립니다.
- source_word: נִסִּי
  english_pob_choice: my banner
  chosen_korean: 내 깃발
  alternatives_korean:
  - 내 표지
  - 내 표준
  - 내 신호
  lexicon: HALOT
  rationale: נֵס는 군중을 모으는 표지/기호를 뜻하므로, 한국어에서는 이미지가 분명한 ‘깃발’이 가장 자연스럽고 본문 의도를 잘 드러냅니다.
- source_word: בְּחֹצֶן
  english_pob_choice: in their bosom
  chosen_korean: 품에 안아
  alternatives_korean:
  - 가슴에
  - 품속에
  - 옷자락 안에
  lexicon: HALOT
  rationale: 직역하면 ‘가슴/품’이지만, 아이를 몸에 바싹 붙여 운반한다는 뜻을 한국어 자연문으로 풀어 ‘품에 안아’로 옮겼습니다.
- source_word: תִּנָּשֶׂאנָה
  english_pob_choice: will be carried
  chosen_korean: 메고 오리라
  alternatives_korean:
  - 어깨에 실려 오리라
  - 어깨에 안겨 오리라
  lexicon: HALOT
  rationale: 수동형 ‘들려 운반되다’의 뜻을 살리되, 한국어에서 ‘어깨에 메고 오다’가 가장 생생하게 대응합니다. 딸들이 직접 걸어오는 것이 아니라 운반되는 장면임을 유지합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주 여호와
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 이 절은 אֲדֹנָי יְהוִה의 결합형이므로, 한국어 합쇼체 본문에서는 전통적으로도 널리 읽히고 의미 구분도 가능한 ‘주 여호와’를 택했습니다. 본문 기능상 ‘주 하나님’보다 고유 이름의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
