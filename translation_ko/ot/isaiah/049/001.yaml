source:
  edition: WLC
  text: שִׁמְע֤וּ אִיִּים֙ אֵלַ֔/י וְ/הַקְשִׁ֥יבוּ לְאֻמִּ֖ים מֵ/רָח֑וֹק יְהוָה֙ מִ/בֶּ֣טֶן קְרָאָ֔/נִי מִ/מְּעֵ֥י אִמִּ֖/י הִזְכִּ֥יר שְׁמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
  footnotes:
  - marker: a
    text: Or 'islands.' The Hebrew term can refer more broadly to distant maritime lands or coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'from my mother’s womb he mentioned my name.' The Hebrew idiom can denote naming, appointing, or calling someone by name.
    reason: lexical_alternative
translation:
  language: ko
  text: 해안 지방들아[a], 내게 들으십시오. 먼 곳에 있는 민족들아, 귀를 기울이십시오. 야훼께서 모태에서부터 나를 부르셨고, 내 어머니 뱃속에서부터 내 이름을 언급하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬들’. 히브리어는 섬들뿐 아니라 먼 바다 너머의 해안 지역들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 이름을 기억하게 하셨습니다’. 이 히브리어 표현은 문맥에 따라 이름을 언급하다, 이름을 부르다, 또는 이름으로 지정하다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיִּים
  english_pob_choice: coastlands
  chosen_korean: 섬들
  alternatives_korean:
  - 해안지방들
  - 연안 지역들
  lexicon: HALOT
  rationale: 이사야에서 이 말은 먼 바다 건너 지역들을 가리키는 시적 호칭이므로, 한국어에서는 자연스럽고 직접적인 호칭인 ‘섬들’로 옮기되 넓은 원거리 지대를 염두에 둔 표현임을 살렸습니다.
- source_word: וְהַקְשִׁיבוּ
  english_pob_choice: pay attention
  chosen_korean: 주의를 기울이십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 잘 들으십시오
  lexicon: HALOT
  rationale: 단순히 듣는 것보다 주의 깊게 들으라는 강세가 있으므로, 현대 한국어에서 명령의 힘을 살리는 ‘주의를 기울이십시오’를 선택했습니다.
- source_word: לְאֻמִּים
  english_pob_choice: peoples
  chosen_korean: 여러 민족들
  alternatives_korean:
  - 민족들
  - 백성들
  lexicon: HALOT
  rationale: ‘peoples’는 정치적 국가보다 집단적 인종/민족 공동체를 가리키는 폭이 있어, 병행문의 원거리 호칭과 맞는 ‘여러 민족들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 사전 약정에 따라 하나님의 고유명사를 ‘야훼’로 옮겨, 본문의 인격적 소명 화자를 분명히 드러냈습니다.
- source_word: הִזְכִּיר שְׁמִי
  english_pob_choice: he mentioned my name
  chosen_korean: 내 이름을 말씀하셨습니다
  alternatives_korean:
  - 내 이름을 언급하셨습니다
  - 내 이름을 불러 주셨습니다
  - 내 이름을 기억하게 하셨습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 언급을 넘어 이름을 정하고 부르며 소명하는 뉘앙스를 포함할 수 있어, 하나님의 주도적 선언을 드러내는 ‘내 이름을 말씀하셨습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 호칭 대상의 직접 인용과 화자의 소명 진술
  chosen_reading: 화자가 열방/원거리 민족들을 향해 직접 호소하면서, 자신이 야훼께서 모태에서부터 부르신 존재라고 증언하는 구조를 유지했습니다.
  alternative_readings:
  - 문장을 더 평서적으로 만들어 호소성을 약화시키는 방식
  - ‘불렀습니다’만 두고 이름 언급의 뉘앙스를 흐리는 방식
  rationale: 히브리어 원문은 호명(섬들, 민족들)과 소명 진술이 강하게 병렬되므로, 한국어에서도 직접 명령형과 소명 선언의 긴장을 보존하는 것이 본문의 수사와 신학을 더 정확히 전달합니다.
  doctrine_reference: Isaiah 49:1의 예언자적/종의 소명 구조
- issue: ‘내 이름을 말씀하셨습니다’의 소명-명명 중첩
  chosen_reading: ‘말씀하셨습니다’로 옮겨 단순한 발화보다 신적 선언과 지명(指名)의 의미를 함께 담았습니다.
  alternative_readings:
  - ‘내 이름을 언급하셨습니다’
  - ‘내 이름을 불러 주셨습니다’
  rationale: 히브리어 הִזְכִּיר는 기억시키다/언급하다의 뜻을 가지지만, 이 문맥에서는 출생 전부터 정해진 신적 지정을 암시하므로, 평이한 언급보다 더 선언적인 한국어가 적합합니다.
  doctrine_reference: 소명과 예정의 언어 표현
