  text: וַ/יָּ֤שֶׂם פִּ/י֙ כְּ/חֶ֣רֶב חַדָּ֔ה בְּ/צֵ֥ל יָד֖/וֹ הֶחְבִּיאָ֑/נִי וַ/יְשִׂימֵ֨/נִי֙ לְ/חֵ֣ץ בָּר֔וּר בְּ/אַשְׁפָּת֖/וֹ הִסְתִּירָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
  footnotes:
  - marker: a
    text: Or 'a select arrow,' 'a sharpened arrow,' or 'a purified arrow' for 'a polished arrow.' The Hebrew adjective carries the sense of something purified/refined, and in context likely describes an arrow carefully prepared for use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 내 입을 날카로운 칼처럼 만드셨고, 자신의 손 그늘 아래에 나를 숨기셨습니다. 그분은 나를 빛나는 화살로 만드셨고, 자신의 화살통에 나를 감추셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛나는 화살’은 여기서 ‘정제된 화살’, ‘선별된 화살’, 또는 ‘갈고닦은 화살’로도 옮길 수 있습니다. 히브리어 형용사는 정제·연마된 대상을 가리킬 수 있으며, 문맥상 사용을 위해 정교하게 준비된 화살을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי כְּחֶרֶב חַדָּה
  english_pob_choice: he made my mouth like a sharp sword
  chosen_korean: 내 입을 날카로운 칼처럼 만드셨고
  alternatives_korean:
  - 내 입을 날카로운 검처럼 만드셨고
  - 내 입을 예리한 칼처럼 두셨고
  lexicon: HALOT
  rationale: 입을 무기처럼 빚어 말씀이 공격성과 효력을 지닌다는 비유를 살리기 위해, 직역에 가까운 ‘날카로운 칼처럼’과 동적 술어 ‘만드셨고’를 결합했습니다.
- source_word: בְּצֵל יָדוֹ הֶחְבִּיאָנִי
  english_pob_choice: in the shadow of his hand he hid me
  chosen_korean: 자신의 손 그늘 아래에 나를 숨기셨습니다
  alternatives_korean:
  - 자신의 손 그림자 아래에 나를 숨기셨습니다
  - 자신의 손의 그늘 아래 나를 감추셨습니다
  lexicon: HALOT
  rationale: ‘손의 그늘’이라는 보호·은폐 이미지를 유지하되, 한국어에서 자연스러운 ‘손 그늘’로 옮겨 원문의 구체적 시각성을 살렸습니다.
- source_word: לְחֵץ בָּרוּר
  english_pob_choice: a polished arrow
  chosen_korean: 빛나는 화살
  alternatives_korean:
  - 갈고닦은 화살
  - 정제된 화살
  - 윤이 난 화살
  lexicon: HALOT
  rationale: בָּרוּר는 맥락상 정제·선별된 준비 상태를 가리키지만, 화살의 비유에서는 ‘빛나는’이 준비된 활시위용 화살의 이미지와 한국어 시각성을 함께 살립니다.
- source_word: וַיְשִׂימֵנִי
  english_pob_choice: he made me a polished arrow
  chosen_korean: 나를 빛나는 화살로 만드셨고
  alternatives_korean:
  - 나를 빛나는 화살로 삼으셨고
  - 나를 빛나는 화살이 되게 하셨고
  lexicon: HALOT
  rationale: 히브리어의 결과·변형 뉘앙스를 한국어에서 가장 자연스럽게 드러내기 위해, 상태 변화를 나타내는 ‘…로 만드셨고’를 택했습니다.
- source_word: בְּאַשְׁפָּתוֹ הִסְתִּירָנִי
  english_pob_choice: in his quiver he concealed me
  chosen_korean: 자신의 화살통에 나를 감추셨습니다
  alternatives_korean:
  - 자신의 화살통에 나를 숨기셨습니다
  - 자신의 화살집에 나를 감추셨습니다
  lexicon: HALOT
  rationale: אַשְׁפָּה를 현대 한국어의 통용 표현인 ‘화살통’으로 옮겨 이미지의 이해 가능성을 높였고, ‘감추셨습니다’로 앞절의 ‘숨기셨습니다’와 의미를 유지하되 반복을 줄였습니다.
theological_decisions:
- issue: 무기 비유의 신학적 확장 여부
  chosen_reading: 본문의 칼과 화살 이미지를 그대로 유지하고, 설교·예언·메시아적 사명으로 본문 안에서 과도하게 풀어 쓰지 않았습니다.
  alternative_readings:
  - 말씀의 능력으로 명시적으로 풀어 쓰기
  - 그리스도론적으로 번역문 자체에 해석을 넣기
  rationale: 이 구절은 강력한 소명 비유를 제시하지만, 그 의미 범위를 번역문이 앞서 확정하지 않도록 하여 원문의 시적 긴장과 개방성을 보존했습니다.
  doctrine_reference: Translation philosophy items 1 and 3
