id: ISA.49.24
reference: Isaiah 49:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
  footnotes:
  - marker: a
    text: Or 'prey' instead of 'plunder.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the captives of a righteous one.' The phrase is difficult in context. Some understand it differently, and some ancient versions reflect a reading closer to 'the captives of a tyrant/terrible one.'
    reason: alternative_reading
translation:
  language: ko
  text: “힘센 자에게서 노략물[b]을 빼앗을 수 있겠습니까? 의로운 자의 포로들[a]을 구출할 수 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘의로운 자의 포로’입니다. 이 표현은 문맥상 어렵습니다. 일부 고대 역본은 ‘폭군’ 또는 ‘무서운 자의 포로’에 더 가까운 읽기를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘전리품’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח
  english_pob_choice: Can ... be taken
  chosen_korean: 빼앗을 수 있겠느냐
  alternatives_korean:
  - 가져갈 수 있겠느냐
  - 취할 수 있겠느냐
  lexicon: HALOT
  rationale: 수동·의문형의 강한 수사 의문을 한국어에서 자연스럽게 살리기 위해 가능성 질문으로 옮겼습니다.
- source_word: מִגִּבּוֹר
  english_pob_choice: from a mighty man
  chosen_korean: 힘센 자
  alternatives_korean:
  - 용사
  - 강한 자
  lexicon: HALOT
  rationale: גִּבּוֹר는 전사 뉘앙스를 가질 수 있지만, 여기서는 일반적인 ‘강한/힘센 사람’이 무난하여 보다 넓은 의미를 살렸습니다.
- source_word: מַלְקוֹחַ
  english_pob_choice: plunder
  chosen_korean: 노략물
  alternatives_korean:
  - 전리품
  - 약탈물
  - 빼앗은 것
  lexicon: HALOT
  rationale: 사람이 아닌 ‘빼앗긴 전리품’의 대상을 한국어에서 간결하게 드러내는 말로 ‘노략물’을 택했습니다.
- source_word: צַדִּיק
  english_pob_choice: a righteous one
  chosen_korean: 의로운 자
  alternatives_korean:
  - 의인
  - 의롭다 한 자
  lexicon: HALOT
  rationale: 히브리어 본문이 가진 해석상의 긴장을 풀지 않고, צַדִּיק의 기본 뜻인 ‘의로운/의인’에 가깝게 옮겼습니다.
theological_decisions:
- issue: צַדִּיק를 본문 그대로 유지할지, 문맥상 ‘폭군/무서운 자’류로 조정할지
  chosen_reading: 주 본문은 MT의 ‘의로운 자’를 그대로 유지하고, 해석상의 어려움은 본문 밖에서만 처리합니다.
  alternative_readings:
  - ‘폭군’ 또는 ‘무서운 자’에 가까운 재해석
  - 고대 역본을 반영한 본문 수정
  rationale: 번역 철학상 본문이 실제로 말하는 긴장을 보존해야 하므로, 문맥이 불편하더라도 צַדִּיק를 본문에서 삭제하거나 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §3 — 본문의 긴장 보존
- issue: שְׁבִי의 의미를 포로 상태로 볼지, 포로된 사람들로 볼지
  chosen_reading: ‘포로’보다 포로가 된 사람들을 가리키는 복수적 집합 의미로 ‘포로’/‘포로들’에 해당하는 ‘포로’를 ‘구출하다’와 함께 이해하도록 번역했습니다.
  alternative_readings:
  - 포로 상태
  - 갇힌 자들
  rationale: 동사 ‘구출하다’와의 병행을 살리려면 추상적 ‘포로 상태’보다 실제 사람들을 가리키는 뜻이 더 자연스럽습니다.
  doctrine_reference: 문맥 병행성 보존
