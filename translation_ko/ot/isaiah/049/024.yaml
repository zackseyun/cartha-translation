  to: “힘센 자에게서 노략물[b]을 빼앗을 수 있겠습니까? 의로운 자의 포로들[a]을 구출할 수 있겠습니까?”
  rationale: 본문의 의미와 MT의 난해성을 유지하면서, 요청된 합쇼체로 문체를 바로잡고 각주 표지를 실제로 설명하는 어구에 붙였습니다. שְׁבִי의 집합적 인칭 의미를 한국어에서 분명히 하기 위해 ‘포로들’을 사용했습니다.
