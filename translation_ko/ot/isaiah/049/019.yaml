  lexicon: HALOT
  rationale: חרבה 계열의 의미를 살리되, 한국어에서 자연스럽고 병렬 구조에 잘 맞는 ‘황폐한 곳들’로 옮겼습니다.
- source_word: שֹׁמְמֹתַיִךְ
  english_pob_choice: your desolate places
  chosen_korean: 네 황폐한 자취들
  alternatives_korean:
  - 네 황무지들
  - 네 버려진 곳들
  lexicon: HALOT
  rationale: ‘desolate places’의 반복을 그대로 기계적으로 옮기기보다, 앞 구와 구별되면서도 황폐함의 상태를 드러내는 표현으로 잡았습니다.
- source_word: תֵּצְרִי מִיּוֹשֵׁב
  english_pob_choice: you will be too cramped for inhabitants
  chosen_korean: 이제는 주민들 때문에 너무 비좁아질 것이며
  alternatives_korean:
  - 이제는 주민들로 인해 너무 좁아질 것이며
  - 이제는 거주자들 때문에 너무 비좁을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘좁아지다/비좁아지다’ 이미지를 유지하면서, ‘for inhabitants’의 관계를 한국어로 자연스럽게 풀어 냈습니다.
- source_word: מְבַלְּעָיִךְ
  english_pob_choice: those who swallowed you up
  chosen_korean: 너를 삼킨 자들은
  alternatives_korean:
  - 너를 집어삼킨 자들은
  - 너를 먹어 삼킨 자들은
  lexicon: HALOT
  rationale: בלע의 강한 비유를 일반적인 ‘destroyers’로 약화시키지 않고, POB의 선택처럼 ‘삼키다’ 이미지를 보존했습니다.
theological_decisions:
- issue: 예언적 결과 진술의 시제 처리
  chosen_reading: 마지막 절을 미래 지향으로 번역해 ‘멀리 떨어질 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘멀리 떨어져 있을 것입니다’
  - ‘멀리 떨어졌습니다’
  rationale: 이 구절은 시온 회복을 말하는 예언적 맥락이므로, 히브리어 완료형의 결과를 한국어 미래로 풀어 독자가 약속의 성격을 바로 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
