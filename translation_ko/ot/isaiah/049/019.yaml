source:
  edition: WLC
  text: כִּ֤י חָרְבֹתַ֨יִ/ךְ֙ וְ/שֹׁ֣מְמֹתַ֔יִ/ךְ וְ/אֶ֖רֶץ הֲרִֽסֻתֵ֑י/ךְ כִּ֤י עַתָּה֙ תֵּצְרִ֣י מִ/יּוֹשֵׁ֔ב וְ/רָחֲק֖וּ מְבַלְּעָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
  footnotes:
  - marker: a
    text: Or 'you will be too narrow because of inhabitants.' The Hebrew expression is compact and may be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who devoured you.' The Hebrew keeps the vivid image of swallowing rather than using a more general term for destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 황폐한 곳들, 네 황폐한 자취들, 네 황폐하게 된 땅으로 말하면 — 이제는 주민들 때문에 너무 비좁아질 것이며, 너를 삼킨 자들은 멀리 떨어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축된 표현이라, 더 문자적으로는 ‘주민들로 인해 너무 좁아질 것이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너를 파괴한 자들’보다 ‘너를 삼킨 자들’이라는 생생한 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  english_pob_choice: your ruins
  chosen_korean: 네 황폐한 곳들
  alternatives_korean:
  - 네 폐허들
  - 네 무너진 곳들
  lexicon: HALOT
  rationale: חרבה 계열의 의미를 살리되, 한국어에서 자연스럽고 병렬 구조에 잘 맞는 ‘황폐한 곳들’로 옮겼습니다.
- source_word: שֹׁמְמֹתַיִךְ
  english_pob_choice: your desolate places
  chosen_korean: 네 황폐한 자취들
  alternatives_korean:
  - 네 황무지들
  - 네 버려진 곳들
  lexicon: HALOT
  rationale: ‘desolate places’의 반복을 그대로 기계적으로 옮기기보다, 앞 구와 구별되면서도 황폐함의 상태를 드러내는 표현으로 잡았습니다.
- source_word: תֵּצְרִי מִיּוֹשֵׁב
  english_pob_choice: you will be too cramped for inhabitants
  chosen_korean: 이제는 주민들 때문에 너무 비좁아질 것이며
  alternatives_korean:
  - 이제는 주민들로 인해 너무 좁아질 것이며
  - 이제는 거주자들 때문에 너무 비좁을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘좁아지다/비좁아지다’ 이미지를 유지하면서, ‘for inhabitants’의 관계를 한국어로 자연스럽게 풀어 냈습니다.
- source_word: מְבַלְּעָיִךְ
  english_pob_choice: those who swallowed you up
  chosen_korean: 너를 삼킨 자들은
  alternatives_korean:
  - 너를 집어삼킨 자들은
  - 너를 먹어 삼킨 자들은
  lexicon: HALOT
  rationale: בלע의 강한 비유를 일반적인 ‘destroyers’로 약화시키지 않고, POB의 선택처럼 ‘삼키다’ 이미지를 보존했습니다.
theological_decisions:
- issue: 예언적 결과 진술의 시제 처리
  chosen_reading: 마지막 절을 미래 지향으로 번역해 ‘멀리 떨어질 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘멀리 떨어져 있을 것입니다’
  - ‘멀리 떨어졌습니다’
  rationale: 이 구절은 시온 회복을 말하는 예언적 맥락이므로, 히브리어 완료형의 결과를 한국어 미래로 풀어 독자가 약속의 성격을 바로 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
