base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
  footnotes:
  - marker: a
    text: Or 'you will be too narrow because of inhabitants.' The Hebrew expression is compact and may be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who devoured you.' The Hebrew keeps the vivid image of swallowing rather than using a more general term for destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 폐허와 네 황량한 곳들, 네 황폐한 땅은 이제 주민들이 살기에는 너무 비좁을 것입니다.[a] 너를 삼킨 자들은[b] 멀리 떨어져 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축된 표현입니다. 더 문자적으로는 ‘주민들 때문에 너무 좁아질 것이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너를 파괴한 자들’보다 ‘너를 삼킨 자들’이라는 생생한 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  english_pob_choice: your ruins
  chosen_korean: 네 황폐한 곳들
  alternatives_korean:
  - 네 폐허들
