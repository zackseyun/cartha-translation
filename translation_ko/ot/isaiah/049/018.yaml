id: ISA.49.18
reference: Isaiah 49:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
  footnotes:
  - marker: a
    text: Or "like an ornament"; the Hebrew term refers to adornment or jewelry.
    reason: lexical_alternative
translation:
  language: ko
  text: 눈을 들어 사방을 보십시오. 그들이 모두 모여 그대에게 옵니다. 내가 살아 있음을 두고 맹세합니다. 야훼의 말씀입니다. 참으로 그들 모두를 장신구처럼 몸에 걸치고, 신부처럼 그들을 몸에 두르게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲדִי는 장식물, 장신구 또는 꾸밈을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי ... עֵינַיִךְ
  english_pob_choice: Lift up your eyes
  chosen_korean: 네 눈을 사방으로 들어 보아라
  alternatives_korean:
  - 네 눈을 들어라
  - 눈을 들어 사방을 보아라
  lexicon: HALOT
  rationale: 여성 단수 명령형으로 시온을 향한 촉구이므로, 자연스러운 현대 한국어 명령형으로 옮기되 시선의 방향성을 살려 ‘사방으로’와 함께 표현했습니다.
- source_word: כָּעֲדִי
  english_pob_choice: like an ornament
  chosen_korean: 장식처럼
  alternatives_korean:
  - 장신구처럼
  - 장식품처럼
  - 보석처럼
  lexicon: HALOT
  rationale: עֲדִי는 장식·장신구의 폭이 있는 말이므로, 시적 비유를 해치지 않으면서도 사물 자체가 아니라 ‘장식처럼’으로 포괄적으로 살렸습니다.
- source_word: תִלְבָּשִׁי
  english_pob_choice: you will put ... on
  chosen_korean: 입고
  alternatives_korean:
  - 둘러입고
  - 걸치고
  - 착용하고
  lexicon: HALOT
  rationale: ‘옷 입다’의 기본 동사지만, 장식 비유와 결합될 때는 한국어에서도 가장 자연스럽게 ‘입고’라고 옮길 수 있습니다.
- source_word: וּתְקַשְּׁרִים
  english_pob_choice: and bind them on
  chosen_korean: 둘러매게 될 것이다
  alternatives_korean:
  - 매어 두게 될 것이다
  - 묶게 될 것이다
  - 채우게 될 것이다
  lexicon: HALOT
  rationale: קשר의 ‘매다/묶다’는 물리적 고정의 이미지를 가지므로, 문맥의 장식 비유를 유지하면서도 한국어에서 자연스러운 ‘둘러매다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 시적 맹세문 안의 신적 고유명은 칭호가 아니라 이름으로 드러내는 것이 본문 효과를 살리므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적인 맹세 공식과 예언 발화 표지의 처리
  chosen_reading: ‘내가 살아 있음을 두고 맹세하노니—야훼의 말씀이다—’로 옮겨, 맹세와 예언자적 선포를 분리해 보이게 했습니다.
  alternative_readings:
  - ‘내가 살아 있노라, 주님께서 말씀하신다’
  - ‘내가 살아 있음을 두고 말하노니, 야훼의 말씀이니라’
  rationale: חַי אָנִי와 נְאֻם יְהוָה는 각각 맹세 공식과 예언 공식이므로, 한국어에서도 둘을 분명히 구분해 신적 발화의 무게를 보존했습니다.
  doctrine_reference: 예언서의 신적 맹세 공식과 신명(神名) 표기 원칙
- issue: 신부 비유와 장식 비유의 동시 보존
  chosen_reading: ‘장식처럼 입고, 신부처럼 그들을 둘러매게 될 것이다’로 두 비유를 모두 살렸습니다.
  alternative_readings:
  - ‘장신구처럼 입고, 신부처럼 그것을 두르게 될 것이다’
  - ‘보석처럼 걸치고, 신부처럼 둘러매게 될 것이다’
  rationale: 본문은 한편으로는 장식/보석의 비유, 다른 한편으로는 신부의 혼인 이미지가 겹치므로 둘 중 하나를 평준화하지 않고 병존시키는 것이 source-direct합니다.
  doctrine_reference: 시온-회복 상징과 비유 보존 원칙
