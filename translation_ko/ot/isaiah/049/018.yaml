revisions:
- from: 네 눈을 사방으로 들어 보아라. 그들이 모두 함께 모여 너에게로 온다. 내가 살아 있음을 두고 맹세하노니—야훼의 말씀이다—너는 그들 모두를 장식처럼 입고, 신부처럼 그들을 둘러매게 될 것이다.[a]
  to: 눈을 들어 사방을 보십시오. 그들이 모두 모여 그대에게 옵니다. 내가 살아 있음을 두고 맹세합니다. 야훼의 말씀입니다. 참으로 그들 모두를 장신구처럼 몸에 걸치고, 신부처럼 그들을 몸에 두르게 될 것입니다.[a]
  rationale: 합쇼체로 전면 통일했습니다. 명령의 대상은 본문 문맥에서 여성으로 인격화된 시온이므로, 불필요하게 ‘시온’을 보충하지 않고 문학적·존칭적 호칭인 ‘그대’를 사용했습니다. ‘참으로’는 כִּי의 맹세 뒤 강조 용법을 반영합니다. ‘장신구처럼 몸에 걸치고’와 ‘신부처럼 그들을 몸에 두르다’는 사람들을 신부가 착용하는 장식물에 비유하는 원문의 혼합된 이미지와 두 동사를 모두 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:18Z'
