source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
  footnotes:
  - marker: a
    text: Or 'for nothing,' 'gratuitously,' or 'without payment.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'oppressed him'; the singular likely refers to Israel as a people viewed corporately.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주 야훼께서 이같이 말씀하십니다. “내 백성이 처음에 이집트로 내려가 그곳에 거류하였고, 앗수르는 아무런 까닭 없이 그를[a] 압제하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 ‘그를’이라고 합니다. 여기서는 ‘내 백성’을 하나의 집합적 인격으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 합성 신칭은 두 호칭을 함께 살리되, 한국어 본문에서는 ‘주’와 ‘하나님’으로 자연스럽게 옮겨 중복을 피했습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트
  lexicon: HALOT
  rationale: 현대 표준어 독자를 위한 지명은 ‘이집트’가 자연스럽고, 고어적 교회 용어인 ‘애굽’은 피했습니다.
- source_word: יָרַד ... לָגוּר שָׁם
  english_pob_choice: went down ... to sojourn there
  chosen_korean: 내려가 거기서 나그네로 살았고
  alternatives_korean:
  - 내려가 거기서 머물렀고
  - 내려가 거기서 거류했고
  - 내려가 거기서 잠시 살았고
  lexicon: HALOT
  rationale: ‘내려가다’는 히브리어 관용을 살리고, ‘나그네로 살다’로 לָגוּר의 이방 체류 뉘앙스를 보존했습니다.
- source_word: בְּאֶפֶס
  english_pob_choice: without cause
  chosen_korean: 아무 까닭 없이
  alternatives_korean:
  - 까닭 없이
  - 헛되이
  - 값 없이
  lexicon: HALOT
  rationale: 부당한 압제를 분명히 드러내면서도 ‘for nothing/without payment’의 여지를 지나치게 좁히지 않는 표현을 택했습니다.
- source_word: עֲשָׁקוֹ
  english_pob_choice: oppressed him
  chosen_korean: 그들을 압제했습니다
  alternatives_korean:
  - 그를 압제했습니다
  - 그들을 학대했습니다
  - 그들을 착취했습니다
  lexicon: HALOT
  rationale: 히브리어는 단수 접미사이지만, 문맥상 ‘내 백성’의 집합적 개념을 가리키므로 한국어에서는 자연스러운 복수로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름과 합성 호칭의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 원문은 אֲדֹנָי와 YHWH가 결합된 예언자적 신칭이므로, 본문에서는 읽기 자연성을 우선해 ‘주 하나님’으로 옮기고, 표제어 수준의 이름 표기는 본문에서 과도하게 노출하지 않았습니다.
  doctrine_reference: 'POB naming convention: source-faithful reverence with readable modern Korean'
