  terminology: YHWH는 POB 명명 원칙에 따라 ‘야훼’로 옮겨 ‘주 야훼’로 표기합니다. ‘이집트’, ‘앗수르’, ‘압제하다’는 현대적이면서 원문 의미에 적합합니다.
  issues:
