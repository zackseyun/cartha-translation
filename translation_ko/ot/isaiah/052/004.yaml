revisions:
- from: 이는 주 하나님께서 이같이 말씀하십니다. “내 백성이 처음에는 이집트로 내려가 거기서 나그네로 살았고, 앗수르가 아무 까닭 없이 그들을 압제했습니다.”
  to: 이는 주 야훼께서 이같이 말씀하십니다. “내 백성이 처음에 이집트로 내려가 그곳에 거류하였고, 앗수르는 아무런 까닭 없이 그를[a] 압제하였습니다.”
