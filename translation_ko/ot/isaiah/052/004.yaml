  source_fidelity: 히브리어 אֲדֹנָי יְהוִה의 YHWH 고유 이름을 ‘하나님’으로 일반화한 것은 원문의 신칭 구별을 충분히 반영하지 못합니다. 또한 עֲשָׁקוֹ는 단수 목적격 접미사이므로, 문맥상 집합적 ‘내 백성’을 가리키더라도 본문에서 단수를 보존하는 편이 원문에 더 충실합니다.
