    rationale: 접미사는 3인칭 남성 단수이며, ‘내 백성’을 집합적 인격으로 가리키는 것으로 보는 것이 자연스럽습니다. 한국어 본문에서도 ‘그를’로 보존하고 각주로 설명하는 것이 안전합니다.
