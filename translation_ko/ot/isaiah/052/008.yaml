id: ISA.52.8
reference: Isaiah 52:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
  footnotes:
  - marker: a
    text: Or 'they will see with their own eyes'; the Hebrew literally reads 'eye to eye.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when the LORD restores Zion.'
    reason: alternative_reading
translation:
  language: ko
  text: 파수꾼들의 목소리가 들립니다 — 그들이 함께 기쁨의 소리를 높입니다[a]. 이는 그들이 눈과 눈으로 볼 것이기 때문입니다[b] — 야훼께서 시온으로 돌아오실 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 자기 눈으로 볼 것입니다’; 히브리어는 문자적으로 ‘눈과 눈으로’라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼께서 시온을 회복하실 때’.
    reason: alternative_reading
lexical_decisions:
- source_word: צֹפַיִךְ
  english_pob_choice: your watchmen
  chosen_korean: 당신의 파수꾼들
  alternatives_korean:
  - 당신의 망보는 이들
  - 당신의 보초들
  lexicon: HALOT
  rationale: צפה의 기본 뜻은 지켜보다이며, 시온을 향한 감시자라는 문맥상 한국어에서는 ‘파수꾼들’이 가장 자연스럽고 공인된 대응입니다.
- source_word: נָשְׂאוּ קוֹל
  english_pob_choice: they lift up their voice
  chosen_korean: 목소리를 높입니다
  alternatives_korean:
  - 소리를 높입니다
  - 목소리를 들어 올립니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘목소리를 높이다’는 뜻이므로, 직역보다 자연스러운 합쇼체 표현으로 옮기되 ‘voice’의 명사성을 살렸습니다.
- source_word: עַיִן בְּעַיִן
  english_pob_choice: eye to eye
  chosen_korean: 눈과 눈으로
  alternatives_korean:
  - 눈과 눈이 마주하여
  - 직접
  lexicon: HALOT
  rationale: 본문의 직유를 살려 ‘눈과 눈으로’라고 유지했습니다. 이는 영어 본문의 ‘eye to eye’와 마찬가지로 문자적 이미지를 보존합니다.
- source_word: בְּשׁוּב יְהוָה צִיּוֹן
  english_pob_choice: when Yahweh returns to Zion
  chosen_korean: 야훼께서 시온으로 돌아오실 때
  alternatives_korean:
  - 야훼께서 시온을 회복하실 때
  - 야훼께서 시온을 다시 데려오실 때
  lexicon: HALOT
  rationale: 구문상 שוב의 주어를 야훼로 읽는 것이 가장 직접적이므로, 본문 의미를 보존해 ‘돌아오실 때’로 옮겼습니다.
theological_decisions:
- issue: ‘eye to eye’의 한국어 처리
  chosen_reading: 눈과 눈으로
  alternative_readings:
  - 직접
  - 자기 눈으로
  rationale: 문맥상 직접적이고 생생한 시각을 가리키지만, 본문의 이미지 자체를 유지하는 것이 더 중요하므로 본문에는 직유를 살리고, 해석적 완화는 주석으로만 남겼습니다.
  doctrine_reference: Translation philosophy §3, source-image preservation
- issue: בְּשׁוּב יְהוָה צִיּוֹן의 주어 이해
  chosen_reading: 야훼께서 시온으로 돌아오실 때
  alternative_readings:
  - 야훼께서 시온을 회복하실 때
  - 야훼께서 시온을 다시 세우실 때
  rationale: 본문의 어순과 히브리어 구문이 야훼의 ‘돌아오심’을 가장 자연스럽게 지시하므로, 회복이라는 해석은 본문 밖의 설명으로 두었습니다.
  doctrine_reference: Translation philosophy §1, original-language primacy
