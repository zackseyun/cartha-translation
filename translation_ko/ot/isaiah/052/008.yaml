    rationale: ‘그들이 함께’는 원문의 ‘함께’를 보존하므로 유지하되, 문장 구조를 정리하여 두 동사(목소리를 높임, 기뻐 외침)가 모두 파수꾼들에게 속함을 분명히 합니다.
