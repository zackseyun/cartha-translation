revisions:
- from: 파수꾼들의 목소리가 들립니다 — 그들이 함께 기쁨의 소리를 높입니다[a]. 이는 그들이 눈과 눈으로 볼 것이기 때문입니다[b] — 야훼께서 시온으로 돌아오실 때입니다.
  to: 당신의 파수꾼들의 소리입니다. 그들이 목소리를 높이며, 함께 기뻐 외칩니다. 야훼께서 시온으로 돌아오실[b] 때에 그들이 눈과 눈으로 볼 것이기 때문입니다[a].
  rationale: 원문의 명사적 도입과 ‘당신의/네’라는 소유 관계를 회복하고, 히브리어의 병렬 동사와 ‘함께’를 명료하게 살렸습니다. ‘눈과 눈으로’ 및 야훼의 시온 귀환이라는 본문 독법은 유지하되, 각각의 해석상 대안은 올바른 위치의 각주로 연결했습니다.
