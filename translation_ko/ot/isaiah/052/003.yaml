  - 되찾아질 것입니다
  lexicon: HALOT
  rationale: גאל의 속량·기업무를하는 구속 의미를 반영해, 단순한 일반 구원보다 법적·가족적 배경을 살리는 ‘속량되다’를 택했습니다.
