  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
  footnotes:
  - marker: a
    text: Or, 'not for silver.' The Hebrew word can refer specifically to silver, but here likely means money/payment more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “너희는 헛되이 팔렸고, 돈 없이 속량될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은으로(은을 주고)’. 히브리어 כסף는 문자적으로 은을 가리킬 수 있지만, 여기서는 더 넓게 돈이나 지불을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי + כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: “...께서 이렇게 말씀하십니다”
  alternatives_korean:
  - “...께서 이와 같이 말씀하십니다”
  - “...께서 말씀하시기를”
  lexicon: HALOT
  rationale: 예언자적 선포 공식을 현대 한국어 합쇼체로 자연스럽게 옮기되, ‘이렇게 말씀하십니다’로 선언의 형식을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 언약적 고유명을 보존했습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: 헛되이
  alternatives_korean:
  - 공짜로
  - 값 없이
  - 대가 없이
  lexicon: HALOT
  rationale: 문맥상 ‘아무 대가 없이, 헛되이’의 뜻을 담으므로 경제적 이미지와 수사적 대비를 살릴 수 있는 ‘헛되이’를 택했습니다.
- source_word: תִּגָּאֵלוּ
  english_pob_choice: you will be redeemed
  chosen_korean: 속량될 것입니다
  alternatives_korean:
  - 구속될 것입니다
  - 구원될 것입니다
  - 되찾아질 것입니다
  lexicon: HALOT
  rationale: גאל의 속량·기업무를하는 구속 의미를 반영해, 단순한 일반 구원보다 법적·가족적 배경을 살리는 ‘속량되다’를 택했습니다.
theological_decisions:
- issue: ‘돈 없이’의 의미 범위
  chosen_reading: 금전 지불이 전혀 수반되지 않는다는 대비적 진술로 유지했습니다.
  alternative_readings:
  - ‘은 없이’로 더 문자적으로 좁히기
  - ‘값 없이’로 일반화하기
  rationale: כֶסֶף가 문자적으로는 은을 가리킬 수 있으나, 본절에서는 POB 주석대로 돈/대가 전반을 가리키는 표현으로 읽어 ‘돈 없이’로 옮겼습니다.
  doctrine_reference: 'POB translation philosophy: source-directed, tension-preserving equivalence'
