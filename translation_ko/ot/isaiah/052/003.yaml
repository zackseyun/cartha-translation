  rationale: 문맥상 ‘아무 대가 없이, 헛되이’의 뜻을 담으므로 경제적 이미지와 수사적 대비를 살릴 수 있는 ‘헛되이’를 택했습니다.
- source_word: תִּגָּאֵלוּ
  english_pob_choice: you will be redeemed
  chosen_korean: 속량될 것입니다
  alternatives_korean:
