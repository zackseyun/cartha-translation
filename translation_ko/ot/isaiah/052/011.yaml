  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
  footnotes:
  - marker: a
    text: Or 'Depart, depart.' The repeated imperative intensifies the call to separate.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from her midst,' likely referring to the city as feminine.
    reason: lexical_alternative
  - marker: c
    text: Or 'be clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 떠나십시오, 떠나십시오. 거기서 나가십시오. 부정한 것에 손대지 마십시오. 그 한가운데에서 나가서 깨끗하게 되십시오[b][c], 야훼의 그릇들을 나르는 여러분.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘그 한가운데에서’입니다. 여기의 3인칭 여성 단수는 문맥상 그 도시를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정결하게 되십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  english_pob_choice: Turn away
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 물러나십시오
  - 돌이키십시오
  - 떠나십시오
  lexicon: HALOT
  rationale: 반복 명령의 긴박함을 살리면서도 뒤의 צְאוּ(나가십시오)와 구별되게, 분리·이탈의 첫 동작을 자연스러운 합쇼체로 옮겼습니다.
- source_word: צְאוּ
  english_pob_choice: go out
  chosen_korean: 나가십시오
  alternatives_korean:
  - 나오십시오
  - 떠나십시오
  - 빠져나가십시오
  lexicon: HALOT
  rationale: 공간적으로 그곳을 벗어나라는 직설적 명령을 가장 간명하게 살렸고, 앞의 סוּרוּ와도 구별됩니다.
- source_word: טָמֵא
  english_pob_choice: unclean thing
  chosen_korean: 부정한 것
  alternatives_korean:
  - 더러운 것
  - 부정한 대상
  - 부정한 것
  lexicon: HALOT
  rationale: חטאת/טמא 계열의 제의적·도덕적 부정을 함께 품는 표현이므로, 한국어에서는 ‘부정한 것’이 가장 무난하게 원문의 긴장을 보존합니다.
- source_word: הִבָּרוּ
  english_pob_choice: purify yourselves
  chosen_korean: 깨끗하게 되십시오
  alternatives_korean:
  - 스스로 정결하게 하십시오
  - 정결하게 되십시오
  - 깨끗해지십시오
  lexicon: HALOT
  rationale: 히트파엘/니팔 계열의 정결 권면을 합쇼체로 자연스럽게 옮기되, 의례적 정결과 도덕적 분리를 지나치게 한쪽으로 좁히지 않도록 ‘깨끗하게 되십시오’로 처리했습니다.
- source_word: כְּלֵי יְהוָה
  english_pob_choice: the vessels of Yahweh
  chosen_korean: 야훼의 그릇들
  alternatives_korean:
  - 야훼의 기물들
  - 야훼의 성전 기구들
  - 야훼의 그릇들
  lexicon: HALOT
  rationale: כְּלִי는 성전의 제의적 기물을 가리키므로 ‘그릇들’이 가장 직역적이며, Tetragrammaton은 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘부정함’과 ‘정결’의 범위
  chosen_reading: 제의적 부정과 도덕적 분리의 긴장을 모두 살리기 위해 ‘부정한 것’과 ‘깨끗하게 되십시오’를 함께 유지했습니다.
  alternative_readings:
  - ‘더러움’/‘정결하게 하십시오’로 완화
  - 오직 바벨론적 죄로만 해석
  rationale: 문맥은 포로 귀환과 성전 기물의 취급이라는 제의적 배경을 가지면서도, 바벨론을 떠나는 분리의 윤리도 포함합니다. 번역이 이 둘 중 하나로만 환원하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
