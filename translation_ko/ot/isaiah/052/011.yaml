  source_fidelity: 전반적으로 명령문의 반복, ‘나가십시오’, 부정한 것에 대한 금지, 야훼의 이름을 잘 반영합니다. 그러나 הִבָּרוּ는 자신을 정결하게 하라는 재귀적 명령이므로 ‘깨끗하게 되십시오’보다 ‘스스로 정결하게 하십시오’가 더 충실합니다.
  naturalness: ‘야훼의 그릇들을 나르는 여러분’은 한국어 호격으로 다소 어색합니다. ‘야훼의 기물들을 운반하는 이들이여’가 문맥상 성전 기물을 가리키면서도 자연스럽습니다.
  terminology: ‘부정한 것’은 제의적·도덕적 함의를 모두 보존합니다. כְּלֵי는 일반적인 생활 그릇보다 성전 관련 물품을 뜻하므로 ‘기물들’로 옮기는 것이 적절합니다. ‘야훼’ 표기는 프로젝트 방침과 일치합니다.
  issues:
