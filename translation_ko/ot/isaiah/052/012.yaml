  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
  footnotes:
  - marker: a
    text: Or 'you will not go in fleeing' / 'you will not go as fugitives.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the God of Israel is gathering you up from behind'; that is, he protects your rear.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 서둘러 나가지 않을 것이며, 도망하여 가지도 않을 것입니다.[a] 이는 야훼께서 여러분 앞에서 가시고, 이스라엘의 하나님께서 여러분의 뒤를 지키실 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도망치며 가지도’ / ‘도망자로서 가지도’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이스라엘의 하나님께서 뒤에서 여러분을 거두어 모으시는 분’이라는 뜻으로, 곧 여러분의 뒤를 보호하신다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  english_pob_choice: in haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 허둥지둥
  lexicon: HALOT
  rationale: חִפָּזוֹן은 급박한 서두름을 가리키므로, 현대 한국어에서 자연스러운 ‘서둘러’로 옮겨 서두름의 뉘앙스를 살렸습니다.
- source_word: וּבִמְנוּסָה
  english_pob_choice: in flight
  chosen_korean: 도망치듯
  alternatives_korean:
  - 도망하며
  - 달아나듯
  lexicon: HALOT
  rationale: מְנוּסָה는 단순 이동이 아니라 달아남의 이미지를 담으므로, ‘도망치듯’으로 대조를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 이름표인 사중문자 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유명 ‘야훼’를 유지했습니다.
- source_word: וּמְאַסִּפְכֶם
  english_pob_choice: is your rear guard
  chosen_korean: 여러분의 뒤를 지키실
  alternatives_korean:
  - 여러분의 후위가 되실
  - 뒤에서 여러분을 거두실
  lexicon: HALOT
  rationale: 직역상 ‘뒤에서 거두다/모으다’의 군사·행렬 이미지를 지니지만, 한국어에서는 보호 기능을 드러내는 ‘뒤를 지키실’이 문맥을 가장 분명하게 전달합니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: יַהְוֶה를 ‘야훼’로 옮겨 하나님의 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 단순 칭호가 아니라 하나님의 이름을 직접 사용하므로, 대체 칭호보다 고유명 표기가 원문의 신학적 강도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
