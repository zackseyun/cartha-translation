source:
  edition: WLC
  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
  footnotes:
  - marker: a
    text: Or more literally, 'sit,' with the context suggesting restored honor or royal dignity.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form behind 'Loosen' is difficult and irregular; it likely means 'untie yourself' or 'be loosed' from the bonds on your neck.
    reason: textual_variant
  - marker: c
    text: Or 'daughter of Zion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 티끌을 털고 일어나 앉으십시오[a], 예루살렘아. 목의 결박을 푸십시오[b], 사로잡힌 시온의 딸아[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘앉으십시오’입니다. 문맥에서는 티끌에서 일어나 회복된 자리를 차지하는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 형태는 난해하고 불규칙합니다. ‘스스로 목의 결박을 풀어라’ 또는 ‘목의 결박에서 풀려라’라는 뜻일 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘딸 시온아’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְנַעֲרִי
  english_pob_choice: Shake yourself
  chosen_korean: 몸을 털어 내십시오
  alternatives_korean:
  - 티끌을 털어 내십시오
  - 몸을 흔드십시오
  lexicon: HALOT
  rationale: 반사형 히트파엘 명령의 ‘스스로 털어 내는’ 동작을 살리되, 한국어에서는 ‘몸을 털어 내다’가 티끌에 묻은 수치의 이미지를 자연스럽게 전달합니다.
- source_word: מֵעָפָר
  english_pob_choice: from the dust
  chosen_korean: 티끌에서
  alternatives_korean:
  - 먼지에서
  - 흙에서
  lexicon: HALOT
  rationale: עָפָר의 구체적 이미지를 ‘티끌’로 옮겨, 낮아짐과 수치를 나타내는 상징성을 보존했습니다.
- source_word: שְּׁבִי
  english_pob_choice: sit down
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 앉으십시오
  - 자리 잡으십시오
  lexicon: HALOT
  rationale: 본문 흐름상 먼저 ‘일어나다’는 명령이 있고, 이어지는 ‘앉다’는 회복된 지위를 암시합니다. 한국어에서는 첫 동사를 직역해 대조를 분명히 했습니다.
- source_word: התפתחו מוֹסְרֵי צַוָּארֵךְ
  english_pob_choice: Loosen the bonds of your neck
  chosen_korean: 당신의 목의 매인 줄을 풀어라
  alternatives_korean:
  - 목의 결박을 풀어라
  - 목의 사슬을 풀어라
  lexicon: HALOT
  rationale: 난해하고 불규칙한 형태를 특정 재구성으로 과도하게 고정하지 않고, ‘매인 줄’로 목에 걸린 속박의 뜻을 살렸습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온아
  alternatives_korean:
  - 시온의 딸아
  - 시온의 딸이여
  lexicon: HALOT
  rationale: 예언서의 의인화 표현을 한국어 호격으로 자연스럽게 옮기되, ‘딸 시온’의 압축된 구조를 유지했습니다.
theological_decisions:
- issue: ‘sit down’의 회복된 지위 함의
  chosen_reading: 본문의 핵심 대비는 티끌의 낮아짐에서 회복으로의 전환이며, 한국어 본문은 ‘일어나십시오’로 그 전환을 선명하게 드러냈습니다.
  alternative_readings:
  - 앉으십시오
  - 좌정하십시오
  rationale: 히브리어 자체는 단순히 ‘앉다’이지만, 문맥상 예루살렘의 회복을 선포하는 예언적 초청입니다. 다만 확정적 왕권 표현은 본문이 직접 말하는 범위를 넘을 수 있어 한국어 본문에서는 과장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 불규칙한 형태 התפתחו 처리
  chosen_reading: 형태의 난해함을 노출하되, 의미는 ‘속박을 풀다’로 번역했습니다.
  alternative_readings:
  - 스스로 풀어라
  - 풀려 있으라
  rationale: 어려운 자음 본문을 평탄화하거나 수정하지 않고, 독자가 본문의 난점을 인지하도록 하면서도 문맥적 의미는 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
