id: ISA.52.7
reference: Isaiah 52:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
  footnotes:
  - marker: a
    text: Or “Your God has become king” or “Your God is king.” The Hebrew can emphasize enthronement or reigning rule.
    reason: alternative_reading
translation:
  language: ko
  text: 아, 산 위에서 소식을 전하는 이의 발이 얼마나 아름답습니까! 그는 평강을 알리고, 좋은 것들의 기쁜 소식을 전하며, 구원을 알리고, 시온에게 말합니다. “네 하나님이 다스리십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 것들’은 히브리어 טוֹב의 폭을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נָּאוּ
  english_pob_choice: How beautiful
  chosen_korean: 얼마나 아름답습니까
  alternatives_korean:
  - 얼마나 좋습니까
  - 얼마나 아름답고 보기 좋습니까
  lexicon: HALOT
  rationale: 히브리어 감탄문을 자연스러운 한국어 감탄형으로 옮기되, 시적 찬탄의 정서를 유지했습니다.
- source_word: מְבַשֵּׂר / מַשְׁמִיעַ
  english_pob_choice: the one who brings good news / who announces
  chosen_korean: 소식을 전하는 이 / 알리고
  alternatives_korean:
  - 복음을 전하는 이 / 선포하고
  - 기쁜 소식을 전하는 이 / 알리고
  lexicon: HALOT
  rationale: 본문은 반복되는 동사형 묘사를 담고 있으므로, '알리다'로 선포적 기능을 살리고 '전하는 이'로 서술을 유지했습니다.
- source_word: מְבַשֵּׂר טוֹב
  english_pob_choice: who brings good news of good things
  chosen_korean: 좋은 것들의 기쁜 소식
  alternatives_korean:
  - 좋은 일들의 기쁜 소식
  - 좋은 소식
  lexicon: HALOT
  rationale: טוֹב의 폭을 좁히지 않기 위해 '좋은 것들'을 살렸고, 반복되는 '기쁜 소식' 표현으로 מְבַשֵּׂר의 의미를 반영했습니다.
- source_word: מָלַךְ אֱלֹהָיִךְ
  english_pob_choice: Your God reigns
  chosen_korean: 네 하나님이 다스리십니다
  alternatives_korean:
  - 네 하나님이 왕이십니다
  - 네 하나님이 통치하십니다
  lexicon: HALOT
  rationale: 완료형 מלך는 즉위 선언과 현재 통치를 함께 암시할 수 있어, 한국어에서는 현재적 왕권 선언인 '다스리십니다'로 옮겨 그 긴장을 보존했습니다.
theological_decisions:
- issue: 시온에게 전하는 왕권 선포의 시제와 뉘앙스
  chosen_reading: ‘다스리십니다’로 현재적 통치를 드러내되, 즉위 선언의 함의도 열어 두었습니다.
  alternative_readings:
  - ‘왕이 되셨습니다’로 즉위성을 강조
  - ‘왕이십니다’로 정체성 선언을 강조
  rationale: 히브리어 완료형은 즉위 사건과 통치 상태를 모두 담을 수 있으므로, 한쪽으로 과도하게 고정하지 않는 번역이 본문 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
