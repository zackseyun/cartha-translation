  lexicon: HALOT
  rationale: אִישׁ의 인간 기준 비교를 자연스럽게 옮기되, '사람'을 유지해 문맥의 일반성을 드러냈습니다.
- source_word: וְ/תֹאֲר֖/וֹ
  english_pob_choice: and his form
