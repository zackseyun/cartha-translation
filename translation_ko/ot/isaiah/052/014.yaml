  text: כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
  footnotes:
  - marker: a
    text: 'Hebrew shifts from ''you'' to ''his'' within the verse: ''many were appalled at you ... his appearance ... his form.'''
    reason: alternative_reading
  - marker: b
    text: Or 'marred' for 'disfigured.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'beyond the sons of man,' an idiom for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람들이 당신을 보고 놀랐던 것처럼 — 그의 모습은 사람의 모습보다 심하게 훼손되었고[a][b], 그의 형상은 사람의 아들들보다 그러했습니다[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절 안에서 2인칭 '당신'에서 3인칭 '그의'로 바뀝니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '마라진'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 '사람의 아들들'이며, 인간들을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
