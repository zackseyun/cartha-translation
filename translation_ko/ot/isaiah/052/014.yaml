- issue: MT의 인칭 전환(2인칭→3인칭)
  chosen_reading: 한국어 본문에서도 '당신을'에서 '그의/그의 형상'으로 전환을 그대로 유지했습니다.
  alternative_readings:
  - 전부 3인칭으로 통일하기
  - 전부 2인칭으로 통일하기
  rationale: 히브리어 본문이 직접 호칭에서 3인칭 서술로 급전환하는 구조를 평탄화하지 않고, 독자가 본문의 긴장을 그대로 보도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: בְּנֵי אָדָם의 인칭적 대표 표현
  chosen_reading: '''사람의 아들들''을 유지해 인간 일반을 가리키는 대표적 표현을 보존했습니다.'
  alternative_readings:
  - 인류
  - 사람들
  - 인간들
  rationale: 성별 중립화로 본문 이미지를 약화시키기보다, 히브리어 관용구의 형태와 문학적 울림을 살렸습니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: אָדָם'
