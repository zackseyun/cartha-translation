  to: 보십시오[a], 내 종은 지혜롭게 행할 것이며, 그는 높이 들리고, 들어 올려지며, 지극히 높아질 것입니다.
  rationale: 본문의 ‘내 종’ 및 메시아적 동일시를 덧붙이지 않는 중립성은 유지했습니다. יַשְׂכִּיל의 핵심 번역은 ‘지혜롭게 행할 것이다’로 보존하고, 각주에는 실제 의미상 대안인 ‘형통할 것이다’를 제시했습니다. 마지막 세 높임 동사는 원문의 점층적 병렬을 유지하면서 현대 표준어 합쇼체로 매끄럽게 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:32Z'
