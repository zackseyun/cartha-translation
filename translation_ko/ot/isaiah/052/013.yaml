id: ISA.52.13
reference: Isaiah 52:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה יַשְׂכִּ֖יל עַבְדִּ֑/י יָר֧וּם וְ/נִשָּׂ֛א וְ/גָבַ֖הּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
  footnotes:
  - marker: a
    text: Or 'will prosper.' The Hebrew verb can denote acting wisely and therefore succeeding.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내 종은 지혜롭게 행할 것이며, 그는 높이 들리고 들어올려지며 몹시 높아질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘현명하게 행동할 것이다’. 히브리어 동사는 지혜롭게 행함으로써 형통함을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄·호소를 현대 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: יַשְׂכִּיל
  english_pob_choice: will act wisely
  chosen_korean: 지혜롭게 행할 것입니다
  alternatives_korean:
  - 지혜롭게 될 것입니다
  - 형통할 것입니다
  - 성공할 것입니다
  lexicon: HALOT
  rationale: 어근 שׂכל의 핵심인 ‘지혜롭게/분별 있게 행함’을 앞세우고, 그 결과로서의 형통 가능성은 여운으로 남기기 위해 ‘지혜롭게 행할 것입니다’로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 내 하인
  lexicon: HALOT
  rationale: 이사야의 ‘종’ 전승을 따라 기본값인 ‘종’을 유지했고, 본절 문맥에서 노예적 강제성을 특별히 부각할 근거는 충분하지 않다고 보았습니다.
- source_word: וְנִשָּׂא / וְגָבַהּ מְאֹד
  english_pob_choice: and lifted up and highly exalted
  chosen_korean: 들어올려지며 몹시 높아질 것입니다
  alternatives_korean:
  - 들려 올려지며 매우 높아질 것입니다
  - 들리며 크게 높아질 것입니다
  lexicon: HALOT
  rationale: 세 겹의 상승 표현을 한국어의 자연스러운 동작·상태 전환으로 재현하면서, 마지막의 מְאֹד가 주는 최상급 강도를 ‘몹시’로 살렸습니다.
theological_decisions:
- issue: 히브리어 본문의 ‘종’과 메시아적 해석의 관계
  chosen_reading: 본문에는 해석을 덧붙이지 않고 ‘내 종’으로 직역했습니다.
  alternative_readings:
  - 메시아로 명시
  - 그리스도로 명시
  rationale: 본문 자체는 ‘내 종’이라고만 말하므로, 기독론적 적용은 주해와 정경적 연결에서 다루되 번역문에는 삽입하지 않는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 우선, 해석은 주석과 교차참조에서 처리
