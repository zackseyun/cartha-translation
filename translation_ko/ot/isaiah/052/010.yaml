id: ISA.52.10
reference: Isaiah 52:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
  footnotes:
  - marker: a
    text: Or 'has uncovered' or 'has laid bare.' The Hebrew verb evokes the image of exposing the arm for decisive action.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the sight of all the nations.'
    reason: lexical_alternative
  - marker: c
    text: Or 'deliverance of our God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 거룩한 팔을 모든 민족의 눈앞에 드러내셨으니, 땅의 모든 끝이 우리 하나님의 구원을 볼 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벗겨내셨다’, ‘드러내셨다’입니다. 이 동사는 결정적 행동을 위해 팔을 드러내는 이미지를 불러일으킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 민족이 보는 앞에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리 하나님의 구출’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: Tetragrammaton
  rationale: 히브리어 고유명 יְהוָה를 제목어로 바꾸지 않고 음역 원칙에 따라 야훼로 옮겼습니다. 영어 POB의 Yahweh 선택을 반영해 신명 자체를 보존합니다.
- source_word: חָשַׂף
  english_pob_choice: has bared
  chosen_korean: 드러내셨으니
  alternatives_korean:
  - 벗기셨으니
  - 드러내셨습니다
  - 노출하셨으니
  lexicon: HALOT
  rationale: 동사는 ‘벗겨서 보이게 하다/드러내다’의 뜻이므로, 현대 한국어에서 자연스럽고 팔을 ‘드러내다’는 신체적 이미지를 살릴 수 있는 표현을 택했습니다.
- source_word: זְרוֹעַ קָדְשׁוֹ
  english_pob_choice: his holy arm
  chosen_korean: 그의 거룩한 팔
  alternatives_korean:
  - 그의 성스러운 팔
  - 그의 거룩한 힘
  lexicon: HALOT
  rationale: 의인화된 신적 능력의 이미지를 살리기 위해 ‘팔’을 유지했습니다. ‘힘’으로 풀면 시적 비유가 약해져 source-direct성이 떨어집니다.
- source_word: לְעֵינֵי כָּל הַגּוֹיִם
  english_pob_choice: before the eyes of all the nations
  chosen_korean: 모든 민족의 눈앞에
  alternatives_korean:
  - 모든 민족의 눈앞에서
  - 모든 민족이 보는 앞에
  - 모든 민족의 시야 앞에
  lexicon: HALOT
  rationale: לְעֵינֵי의 공개적·가시적 의미를 살려 ‘눈앞에’로 옮겼습니다. ‘민족’은 כאן의 גּוֹיִם을 한국어에서 가장 중립적으로 전달합니다.
- source_word: יְשׁוּעַת
  english_pob_choice: the salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 해방
  - 구원하심
  lexicon: HALOT
  rationale: 문맥상 하나님의 구원 행위 전체를 가리키므로, 신학적 무게를 유지하는 기본어 ‘구원’을 사용했습니다. 한국어에서는 ‘우리 하나님의 구원’이 자연스럽습니다.
theological_decisions:
- issue: 예언적 완료형 וְרָאוּ의 시제 처리
  chosen_reading: 미래적 확실성을 살려 ‘볼 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘보게 될 것입니다’
  - ‘보았습니다’
  rationale: 문맥은 선언적 예언으로서 미래의 확정성을 나타내므로, 한국어에서도 예언적 미래로 자연스럽게 읽히게 했습니다.
  doctrine_reference: '히브리 예언문법: 완료형의 예언적 사용'
