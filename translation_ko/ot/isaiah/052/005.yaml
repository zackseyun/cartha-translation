  verdict: revise
  source_fidelity: ‘내가 여기서 무엇을 얻었습니까?’는 מַה־לִּי פֹה의 ‘내가 여기서 무엇을 하고 있습니까?/내게 여기 무슨 일이 있습니까?’라는 수사적 항의보다 ‘무엇을 획득하다’라는 뜻으로 좁혀져 있어 수정이 필요합니다. 또한 חִנָּם은 ‘값없이’, לֻקַּח עַמִּי는 ‘내 백성이 빼앗겼다’로 자연스럽고 의미 범위를 보존할 수 있습니다. יְהֵילִילוּ의 강한 애곡은 ‘울부짖습니다’로 적절히 반영됩니다.
  naturalness: 합쇼체는 유지되어 있으나, 예언자적 선언 공식으로는 ‘야훼의 선언입니다’보다 ‘야훼의 말씀입니다’가 현대 표준 한국어 성서 문체에서 더 자연스럽습니다. ‘그리고 끊임없이, 온종일’은 가능하지만 ‘또 끊임없이, 온종일’이 절의 연결을 더 매끄럽게 합니다.
  terminology: ‘야훼’, ‘내 백성’, ‘내 이름’, ‘멸시를 받고 있습니다’는 적절합니다. ‘신성모독’은 מִנֹּאָץ에 가능한 강한 대안이므로 각주에 두는 것이 적절합니다. 다만 현행 [a]는 ‘이제’에 붙어 있으면서 통치자/울부짖음에 관한 각주를 가리키므로, 해당 어구 뒤로 옮겨야 합니다.
