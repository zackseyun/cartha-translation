  to: 그리고 이제, 내가 여기서 무엇을 하고 있습니까? 야훼의 말씀입니다. 내 백성이 값없이 빼앗겼기 때문입니다. 그들을 다스리는 자들이 울부짖습니다[a]. 야훼의 말씀입니다. 또 끊임없이, 온종일[b] 내 이름이 멸시를 받고 있습니다.
  rationale: 수사 의문문의 의미를 ‘무엇을 하고 있습니까?’로 바로잡아 원문의 항의적 모호성을 보존했습니다. 수동 표현은 ‘값없이 빼앗겼습니다’로 다듬어 לֻקַּח과 חִנָּם을 함께 반영했습니다. [a]를 실제로 관련된 ‘울부짖습니다’ 뒤에 배치하고, 각주 문구도 본문의 중립적 ‘다스리는 자들’과 일관되도록 조정했습니다. [b]는 지속 표현 뒤에 유지했습니다.
