id: ISA.52.5
reference: Isaiah 52:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
  footnotes:
  - marker: a
    text: Or 'their oppressors howl.' The Hebrew term can denote those ruling over the people, and in context the rulers are oppressive.
    reason: lexical_alternative
  - marker: b
    text: Or 'my name is blasphemed continually all day long.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 내가 여기서 무엇을 하고 있습니까? 야훼의 말씀입니다. 내 백성이 값없이 빼앗겼기 때문입니다. 그들을 다스리는 자들이 울부짖습니다[a]. 야훼의 말씀입니다. 또 끊임없이, 온종일[b] 내 이름이 멸시를 받고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 통치자들이 통곡합니다.’ 히브리어 표현은 내 백성을 다스리는 자들을 가리킬 수 있으며, 문맥상 그들은 억압적인 지배자들입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 이름이 계속해서 온종일 모독을 당하고 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 전환의 접속사 ו와 시간 부사 עתה를 함께 살려, 문맥의 급전환을 자연스럽게 드러냅니다.
- source_word: מַה־לִּי פֹה
  english_pob_choice: what do I have here?
  chosen_korean: 내가 여기서 무엇을 얻었습니까?
  alternatives_korean:
  - 내가 여기서 무엇을 가지고 있습니까?
  - 내게 여기서 무슨 일이 있습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 당혹과 항의를 살리되, 한국어에서는 직역형보다 의미가 분명한 질문형이 자연스럽습니다.
- source_word: מֹשְׁלָיו
  english_pob_choice: those who rule over them
  chosen_korean: 그들을 다스리는 자들
  alternatives_korean:
  - 그들의 통치자들
  - 그들의 지배자들
  lexicon: HALOT
  rationale: 문맥상 지배적이고 억압적인 통치를 암시하지만, 본문 자체의 의미 범위를 과도하게 좁히지 않도록 중립적 표현을 택했습니다.
- source_word: יְהֵילִילוּ
  english_pob_choice: wail
  chosen_korean: 통곡합니다
  alternatives_korean:
  - 울부짖습니다
  - 애곡합니다
  lexicon: HALOT
  rationale: 히필형 ילל의 강한 비탄을 반영하기 위해, 한국어에서 가장 직접적으로 고통스러운 소리를 드러내는 ‘통곡합니다’를 사용했습니다.
- source_word: וְתָמִיד כָּל־הַיּוֹם
  english_pob_choice: and continually, all day long
  chosen_korean: 그리고 끊임없이, 온종일
  alternatives_korean:
  - 그리고 계속해서, 하루 종일
  - 그리고 줄곧, 온종일
  lexicon: HALOT
  rationale: 두 표현이 중첩되어 지속성을 강조하므로 둘 다 살려 반복적·강조적 뉘앙스를 보존했습니다.
- source_word: מִנֹּאָץ
  english_pob_choice: is despised
  chosen_korean: 멸시를 받고 있습니다
  alternatives_korean:
  - 경멸을 받고 있습니다
  - 모독을 당하고 있습니다
  lexicon: HALOT
  rationale: נאץ의 폭넓은 의미 가운데, 하나님의 이름이 공적으로 수치를 당하는 상황을 현대 한국어에서 가장 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기를 직접 드러내는 표기를 유지하여, 예언자 발화의 언약적 이름을 흐리지 않기 위해 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 하나님의 이름이 받는 모욕의 강도
  chosen_reading: 멸시를 받고 있습니다
  alternative_readings:
  - 모독을 당하고 있습니다
  - 신성모독을 당하고 있습니다
  rationale: 본문의 핵심은 이름이 공개적으로 낮추어지고 경멸받는 상태이며, ‘멸시’가 그 의미를 넓게 보존합니다. 더 강한 ‘모독’은 주해상 가능하지만 본문에는 과도하게 특정될 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
