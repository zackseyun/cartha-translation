id: ISA.52.15
reference: Isaiah 52:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֤ן יַזֶּה֙ גּוֹיִ֣ם רַבִּ֔ים עָלָ֛י/ו יִקְפְּצ֥וּ מְלָכִ֖ים פִּי/הֶ֑ם כִּ֠י אֲשֶׁ֨ר לֹֽא סֻפַּ֤ר לָ/הֶם֙ רָא֔וּ וַ/אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ הִתְבּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
  footnotes:
  - marker: a
    text: Or, 'he will startle many nations.' The Hebrew verb is commonly understood as 'sprinkle,' but some take it here in the sense of causing astonishment.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 많은 민족에게 뿌리실[a] 것이며, 그 때문에 왕들은 입을 다물 것입니다. 이는 그들에게 전해지지 않았던 것을 그들이 볼 것이고, 그들이 듣지 못했던 것을 깨닫게 될 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 많은 민족을 놀라게 하실 것입니다.’ 히브리어 동사는 보통 ‘뿌리다’로 이해되지만, 일부는 여기서 놀라움을 일으키는 뜻으로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַזֶּה
  english_pob_choice: he will sprinkle
  chosen_korean: 뿌리실 것이며
  alternatives_korean:
  - 뿌리실 것입니다
  - 뿌리치실 것입니다
  - 흩뿌리실 것입니다
  lexicon: HALOT
  rationale: 히필 형태는 기본적으로 ‘뿌리다/뿌리치다’의 제의적·정결 의례 이미지를 가지므로, POB의 ‘sprinkle’에 맞춰 직접적으로 옮겼습니다. 한국어에서는 동작의 대상이 암시되는 ‘뿌리다’보다 ‘뿌리치다’가 아니라 ‘뿌리실’이 가장 무난합니다.
- source_word: גּוֹיִם רַבִּים
  english_pob_choice: many nations
  chosen_korean: 많은 나라에
  alternatives_korean:
  - 많은 민족에게
  - 많은 이방 민족에게
  - 많은 나라들과 백성에게
  lexicon: HALOT
  rationale: גּוֹיִם은 이사야 문맥에서 단순한 ‘이방인’보다 국제적 실체인 ‘나라들/민족들’을 가리키므로, 본문 흐름을 살려 ‘많은 나라에’로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: because of him
  chosen_korean: 그로 말미암아
  alternatives_korean:
  - 그 때문에
  - 그 때문에 그의 앞에서
  - 그를 보고
  lexicon: HALOT
  rationale: 뒤의 관용구 ‘입을 닫다’와 함께 쓰일 때 원인은 놀라움과 압도됨을 뜻하므로, 관계를 자연스럽게 드러내는 ‘그로 말미암아’가 적절합니다.
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  english_pob_choice: kings will shut their mouths
  chosen_korean: 왕들은 자기 입을 닫을 것입니다
  alternatives_korean:
  - 왕들은 입을 다물 것입니다
  - 왕들은 침묵할 것입니다
  - 왕들은 자기 입을 틀어막을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘입을 닫다’로 옮겼습니다. ‘침묵하다’는 이미지를 약화시키므로 덜 적절합니다.
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם
  english_pob_choice: what had not been told to them
  chosen_korean: 그들에게 전해지지 않았던 것을
  alternatives_korean:
  - 그들에게 말해지지 않았던 것을
  - 그들에게 보고되지 않았던 것을
  - 그들에게 알려지지 않았던 것을
  lexicon: HALOT
  rationale: 수동형 ספר는 ‘전하다/알리다/보고하다’의 의미를 가질 수 있으므로, 문맥상 외부로부터 전달되지 않았다는 점을 살려 ‘전해지다’로 번역했습니다.
- source_word: הִתְבּוֹנָנוּ
  english_pob_choice: they will understand
  chosen_korean: 깨닫게 될 것이기 때문입니다
  alternatives_korean:
  - 이해하게 될 것이기 때문입니다
  - 분별하게 될 것이기 때문입니다
  - 생각하게 될 것이기 때문입니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 인지가 아니라 주의 깊은 분별과 이해를 뜻하므로, 한국어에서는 결과를 드러내는 ‘깨닫다’가 가장 자연스럽고 강합니다.
theological_decisions:
- issue: יַזֶּה의 제의적 의미와 ‘놀라게 하다’라는 해석 가능성
  chosen_reading: ‘뿌리실 것입니다’로 두고, 놀라움은 왕들의 침묵으로 드러난다고 본문을 따라 읽습니다.
  alternative_readings:
  - 그가 많은 나라를 놀라게 하실 것입니다
  - 그가 많은 나라에 정결 의례처럼 뿌리실 것입니다
  rationale: POB의 본문은 히필 נזה의 기본 의미인 ‘뿌리다’를 채택하고, राष्ट्र들의 반응은 뒤 절의 ‘왕들이 입을 닫음’으로 설명합니다. 따라서 별도의 해석어를 본문에 끼워 넣지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
