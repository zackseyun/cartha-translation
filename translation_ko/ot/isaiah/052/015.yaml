revisions:
- from: 그가 많은 나라에 뿌리실 것이며, 그로 말미암아 왕들은 자기 입을 닫을 것입니다. 이는 그들에게 전해지지 않았던 것을 그들이 볼 것이며, 그들이 듣지 못했던 것을 그들이 깨닫게 될 것이기 때문입니다.[a]
  to: 그가 많은 민족에게 뿌리실[a] 것이며, 그 때문에 왕들은 입을 다물 것입니다. 이는 그들에게 전해지지 않았던 것을 그들이 볼 것이고, 그들이 듣지 못했던 것을 깨닫게 될 것이기 때문입니다.
  rationale: 본문의 ‘뿌리다’ 독법과 그 해석상 대안을 그대로 유지하되, גּוֹיִם רַבִּים의 한국어 결합을 자연스럽게 하고, 왕들의 침묵 관용구 및 병렬 인과문을 현대 격식체에 맞게 다듬었습니다. 각주 표지는 대안 독법이 적용되는 ‘뿌리실’ 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
