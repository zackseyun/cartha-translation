translation:
  language: ko
  text: 그러므로 내 백성은 내 이름을 알게 될 것입니다. 그러므로 그날에 그들은 내가 바로 말하는 이임을 알게 될 것입니다.[a] “내가 여기 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 말하는 이입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 결과를 나타내는 담화 표지이므로, 예언 문맥의 논리적 연결을 살리는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: יֵדַע
  english_pob_choice: will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 알게 됩니다
  lexicon: HALOT
  rationale: 미래적 예언 성격을 드러내면서도 현대 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 명성
  - 내 이름과 존재
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’이 담는 정체성과 드러난 성격을 과도하게 풀지 않고 그대로 보존했습니다.
- source_word: אֲנִי הוּא הַמְדַבֵּר
  english_pob_choice: I am he who speaks
  chosen_korean: 내가 바로 말하는 이임
  alternatives_korean:
  - 내가 곧 말하는 자임
  - 내가 말씀하시는 이임
  lexicon: HALOT
  rationale: 아니 후(אני הוא)의 압축된 자기 동일시를 살리되, 한국어에서는 ‘내가 바로 … 이임’으로 응축해 ‘말하는 이’의 현재적 행위를 드러냈습니다.
theological_decisions:
- issue: אֲנִי הוּא의 압축된 신적 자기 동일시
  chosen_reading: 내가 바로 말하는 이임
  alternative_readings:
  - 내가 그입니다
  - 내가 곧 그입니다
  - 나는 그 사람입니다
  rationale: 이 표현은 단순한 신원 확인을 넘어 신적 자기 계시의 울림을 지니지만, 본절만으로 과도하게 풀지 않기 위해 ‘내가 바로 … 이임’으로 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
