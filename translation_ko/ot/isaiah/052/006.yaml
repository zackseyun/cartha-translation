    rationale: ‘보십시오, 나입니다’는 주의를 환기하는 ‘보십시오’와 신원 확인 ‘나입니다’를 더하지만, 히브리어 הִנֵּנִי는 여기에서 ‘내가 여기 있다/있습니다’라는 현존의 자기 제시를 직접적으로 표현합니다.
  - severity: low
