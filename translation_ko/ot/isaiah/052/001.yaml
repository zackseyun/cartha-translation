id: ISA.52.1
reference: Isaiah 52:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
  footnotes:
  - marker: a
    text: Or 'put on your garments of splendor.'
    reason: lexical_alternative
  - marker: b
    text: '''The uncircumcised and the unclean'' preserves the Hebrew covenant and purity language; the phrase may refer broadly to those excluded from Jerusalem''s holiness.'
    reason: cultural_note
translation:
  language: ko
  text: 깨어나십시오, 깨어나십시오. 시온이여, 당신의 힘을 입으십시오. 거룩한 성읍 예루살렘이여, 당신의 찬란한 옷을 입으십시오.[a] 이제부터는 할례받지 않은 자와 부정한 자[b]가 다시는 당신 안으로 들어오지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 영광의 옷을 입으십시오.’
    reason: lexical_alternative
  - marker: b
    text: ‘할례받지 않은 자와 부정한 자’는 언약과 정결에 관한 히브리어 표현을 보존합니다. 이는 예루살렘의 거룩함에서 배제되는 이들을 넓게 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  english_pob_choice: Awake, awake
  chosen_korean: 깨어나십시오, 깨어나십시오
  alternatives_korean:
  - 일어나십시오, 일어나십시오
  - 깨어 있으십시오, 깨어 있으십시오
  lexicon: HALOT
  rationale: 반복된 여성 단수 명령의 긴박함을 살리면서, 현대 한국어에서 시적·격식체로 자연스러운 표현을 택했습니다.
- source_word: לִבְשִׁי עֻזֵּךְ
  english_pob_choice: put on your strength
  chosen_korean: 당신의 힘을 입으십시오
  alternatives_korean:
  - 힘을 두르십시오
  - 당신의 힘으로 옷 입으십시오
  lexicon: HALOT
  rationale: ‘힘’을 옷처럼 입는 은유를 직접 살리되, 한국어에서 가장 자연스러운 동사 ‘입다’를 사용해 과도한 의역을 피했습니다.
- source_word: בִּגְדֵי תִפְאַרְתֵּךְ
  english_pob_choice: your beautiful garments
  chosen_korean: 당신의 아름다운 옷
  alternatives_korean:
  - 당신의 화려한 옷
  - 당신의 영광의 옷
  lexicon: HALOT
  rationale: תִפְאַרֶת의 미와 장식의 의미를 반영해 ‘아름다운’으로 옮겼고, 본문이 요구하는 회복·장식의 이미지를 유지했습니다.
- source_word: עִיר הַקֹּדֶשׁ
  english_pob_choice: the holy city
  chosen_korean: 거룩한 성읍
  alternatives_korean:
  - 거룩한 도시
  - 성스러운 성읍
  lexicon: HALOT
  rationale: הַקֹּדֶשׁ의 정체성을 더 직접적으로 살려 ‘거룩한’으로 옮겼고, ירושלים의 고대 도시성을 고려해 ‘성읍’을 택했습니다.
- source_word: עָרֵל וְטָמֵא
  english_pob_choice: the uncircumcised and the unclean
  chosen_korean: 할례받지 않은 자와 부정한 자
  alternatives_korean:
  - 무할례자와 부정한 자
  - 할례받지 않은 사람과 더러운 사람
  lexicon: HALOT
  rationale: 언약 표지로서의 할례와 정결 언어를 한국어에서 분명히 드러내기 위해, 집단적 표현을 ‘자’로 옮겼습니다.
theological_decisions:
- issue: ‘할례받지 않은 자와 부정한 자’의 범위
  chosen_reading: 언약적·정결적 언어를 그대로 유지해, 민족적 배제인지 의례적 부정함인지, 혹은 더 넓은 성결 배제인지 본문이 허용하는 긴장을 남겨 두었습니다.
  alternative_readings:
  - 이방 침입자를 뜻한다고 좁혀 읽기
  - 의식적으로 부정한 사람만 가리킨다고 좁혀 읽기
  - 종말론적 순결의 이상으로만 읽기
  rationale: 본문 자체가 범위를 명시하지 않으므로, 해석을 한쪽으로 단정하지 않고 성경적 언약/정결 어휘의 힘을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
