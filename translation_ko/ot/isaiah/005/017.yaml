    issue: גרים를 ‘소들’로 번역함
    rationale: גרים는 גר의 복수형으로 ‘거류민들, 나그네들, 외인들’을 뜻합니다. ‘소들’은 본문 어형이나 문법에서 지지되지 않으며, 후반절의 주어를 변경합니다.
