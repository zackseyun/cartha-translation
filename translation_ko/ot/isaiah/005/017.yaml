review_pass:
  verdict: revise
  source_fidelity: 후반절의 גרים는 ‘거류민들/나그네들’이지 ‘소들’이 아닙니다. 현 번역은 주어를 바꾸어 본문의 사회적 역전 이미지를 동물 장면으로 대체하므로 원문 충실성에 중대한 문제가 있습니다. 수정문은 גרים와 מחים의 통상적 관계, 곧 거류민들이 살진 자들의 황폐해진 소유지에서 먹는다는 뜻을 반영합니다. כדברם의 난해함은 기존처럼 각주로 보존합니다.
  naturalness: ‘그때에’와 ‘풀을 뜯고’는 현대 표준 한국어의 합쇼체 문맥에서 자연스럽습니다. ‘살진 자들의 폐허에서 거류민들이 먹을 것입니다’는 원문의 간결성과 ‘먹다’의 목적어 생략을 유지하면서도 한국어로 이해 가능합니다.
  terminology: כְּבָשִׂים은 ‘어린양들’로 유지할 수 있으나 ‘양들’이라는 대안은 각주에 제시합니다. גרים는 법적·사회적 뉘앙스를 비교적 잘 담는 ‘거류민들’로 옮깁니다. מֵחִים은 확정하기 어려운 드문 형태이므로 본문에서는 ‘살진 자들’로, 대안은 각주로 남깁니다.
  issues:
