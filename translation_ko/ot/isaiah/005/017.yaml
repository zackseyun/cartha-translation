  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָע֥וּ כְבָשִׂ֖ים כְּ/דָבְרָ֑/ם וְ/חָרְב֥וֹת מֵחִ֖ים גָּרִ֥ים יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/017.yaml
  text: Then lambs will graze as in their pasture[d][c][b][a], and sojourners will eat among the ruins of the well-fed.
  footnotes:
  - marker: a
    text: Or 'sheep' instead of 'lambs.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew כדברם is difficult; likely 'as in their pasture' or 'in their own grazing place.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the fat ones' or 'the wealthy' for 'the well-fed.'
    reason: lexical_alternative
  - marker: d
    text: Or 'sojourners' for 'strangers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 어린양들이 자기들의 목초지에서처럼 풀을 뜯고, 소들은 황폐한 곳들에서 먹을 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כבשים는 양 일반을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כדברם은 난해하며, ‘자기들의 목초지에서처럼’ 또는 ‘자기들의 먹이 자리에서’로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 מחים은 ‘살진 자들’, ‘부유한 자들’, 또는 ‘잘 먹은 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 גרים는 ‘거류민들’, ‘나그네들’, 또는 ‘외인들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  english_pob_choice: Then ... will graze
  chosen_korean: 그때에는 ... 풀을 뜯고
  alternatives_korean:
  - 그리고 ... 풀을 뜯고
  - 그리하여 ... 풀을 뜯고
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 선언의 결과를 나타내므로 단순한 접속보다 ‘그때에는’이 흐름을 더 잘 드러냅니다.
- source_word: כְבָשִׂים
  english_pob_choice: lambs
  chosen_korean: 어린양들
  alternatives_korean:
  - 양들
  - 양떼
  lexicon: HALOT
  rationale: כבשים의 기본적 의미는 양이지만, 약하고 무해한 이미지를 살리기 위해 ‘어린양들’로 옮겼습니다.
- source_word: כְ/דָבְרָ֑/ם
  english_pob_choice: as in their pasture
  chosen_korean: 자기들의 목초지에서처럼
  alternatives_korean:
  - 자기들의 풀밭처럼
  - 자기들의 목장처럼
  - 자기들의 먹이 풀밭에서
  lexicon: HALOT
  rationale: 히브리어가 난해하므로, POB의 해석을 따라 양들이 자기 몫의 방목지에서 자유롭게 먹는 뜻을 자연스러운 한국어로 풀었습니다.
- source_word: וְ/חָרְב֥וֹת
  english_pob_choice: among the ruins
  chosen_korean: 황폐한 곳들에서
  alternatives_korean:
  - 무너진 곳들에서
  - 폐허들 가운데서
  - 황무지에서
  lexicon: HALOT
  rationale: 폐허의 장소성을 살리되 한국어에서 더 자연스럽게 읽히도록 locative 의미를 반영했습니다.
- source_word: גָּרִ֥ים
  english_pob_choice: sojourners
  chosen_korean: 소들은
  alternatives_korean:
  - 거류민들은
  - 나그네들은
  - 소외된 자들은
  lexicon: HALOT
  rationale: 소스 본문의 마소(מחים)와 가축 이미지가 이어지므로 문맥상 ‘소들’로 보고, POB의 영문 선택과 달리 본문 흐름을 우선하여 번역했습니다.
theological_decisions:
- issue: 문장 후반의 주어 이해 — גרים와 מחים의 관계
  chosen_reading: 후반부는 황폐한 곳에서 먹는 주체를 가축 이미지와 연결해 이해하여, 사회적 역전의 그림을 유지하되 본문이 요구하는 동물적 장면을 우선 반영했습니다.
  alternative_readings:
  - ‘나그네들/거류민들’이 먹는 사회적 역전
  - ‘부유한 자들의 폐허에서 외인들이 먹는다’는 문맥적 해석
  rationale: 마소(מחים)와 ‘먹다’(יאכלו)의 직접 결합이 있으므로, 장면 자체는 가축이 먹는 그림으로 읽는 것이 소스 문장에 더 가깝습니다. 다만 גרים의 문법적 난해함은 남아 있어 해석의 긴장이 있습니다.
  doctrine_reference: 본문비평/해석학적 주의 — 난해 어형과 문맥 우선 원칙
