  to: 그때에 어린양들이[a] 자기들의 목초지에서처럼[b] 풀을 뜯고, 거류민들이[d] 살진 자들의[c] 폐허에서 먹을 것입니다.
  rationale: 원문 MT의 문법에 따라 גרים를 יאכלו의 주어로 회복하고, מחים를 그들의 ‘폐허/황폐한 곳’과 연결했습니다. 이 구절은 앞 절의 심판 뒤에 어린양과 거류민이 이전의 풍요롭던 자들의 땅을 누리는 역전상을 그립니다. 다만 כְּדָבְרָם과 מֵחִים은 어휘적으로 난해하므로 특정 해석을 과도하게 확정하지 않고 각주에 대안을 유지했습니다.
