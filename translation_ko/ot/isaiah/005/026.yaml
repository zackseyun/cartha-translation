source:
  edition: WLC
  text: וְ/נָֽשָׂא נֵ֤ס לַ/גּוֹיִם֙ מֵ/רָח֔וֹק וְ/שָׁ֥רַק ל֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ וְ/הִנֵּ֥ה מְהֵרָ֖ה קַ֥ל יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
  footnotes:
  - marker: a
    text: Or 'a banner' or 'a standard' for נֵס.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'whistle' or, in older English renderings, 'hiss'—that is, make a sharp summoning sound.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew singular: ''for him ... he comes.'' The singular likely represents the invading force as a collective.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 먼 곳에 있는 민족들을 향해 신호를 세우시고[a], 땅 끝에서 그를 향해 휘파람을 부십니다.[b] 보십시오, 그가 급히, 재빨리 옵니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신호’는 히브리어 נֵס의 기능을 살린 번역입니다. 문자적으로는 ‘깃발’ 또는 ‘군기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘휘파람을 부십니다’는 히브리어 동사가 가리키는, 날카로운 소리로 부르거나 소집하는 행위를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그를 향해’와 ‘그가 옵니다’에 단수 남성형을 사용합니다. 앞의 ‘민족들’과 관련하여, 소집되어 오는 세력을 하나의 집단으로 표현한 것일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵס
  english_pob_choice: a signal
  chosen_korean: 신호
  alternatives_korean:
  - 깃발
  - 기치
  - 표지
  lexicon: HALOT
  rationale: נֵס는 사람을 불러 모으는 높이 든 표지이므로, 기능을 살린 ‘신호’가 현대 한국어에서 가장 분명합니다. ‘깃발’은 형상은 살지만 군사적 소집 기능이 덜 드러납니다.
- source_word: לַגּוֹיִם
  english_pob_choice: for the nations
  chosen_korean: 열국을 향해
  alternatives_korean:
  - 열국에게
  - 민족들을 향해
  lexicon: HALOT
  rationale: 가나안 내부의 한 집단이 아니라 먼 곳의 여러 민족을 가리키는 예언적 문맥을 살려 ‘열국’을 썼습니다. 동사의 방향성을 드러내기 위해 ‘향해’를 보탰습니다.
- source_word: וְשָׁרַק
  english_pob_choice: and whistle
  chosen_korean: 휘파람을 부십니다
  alternatives_korean:
  - 휘파람하십니다
  - 호각을 부십니다
  - 신호를 보내십니다
  lexicon: HALOT
  rationale: 이 동사는 날카로운 소리로 부르는 행위를 뜻하므로, 한국어에서 가장 직접적인 소리-행위 표현인 ‘휘파람을 부시다’를 택했습니다. ‘호각’은 원문보다 현대 군사용 도구를 덧씌울 수 있습니다.
- source_word: וְהִנֵּה מְהֵרָה קַל יָבֹוא
  english_pob_choice: and behold, quickly, swiftly, it comes
  chosen_korean: 보십시오, 빠르고도 신속하게 그것이 옵니다
  alternatives_korean:
  - 보라, 속히 그것이 옵니다
  - 보십시오, 곧바로 그것이 옵니다
  lexicon: HALOT
  rationale: 예언적 감탄사 ‘וְהִנֵּה’는 한국어에서 ‘보십시오’로 옮겨 장면의 긴박함을 살렸습니다. ‘מְהֵרָה’와 ‘קַל’의 이중 속도 강조는 ‘빠르고도 신속하게’로 보존했습니다.
theological_decisions:
- issue: 마지막 절의 단수 주어와 지시대상
  chosen_reading: ‘그것이 옵니다’로 옮겨, 소집된 집단 전체를 가리키는 집합적 단수의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그가 옵니다’로 단수 인칭을 유지하기
  - ‘그들이 옵니다’로 복수화하기
  rationale: 히브리어는 열국을 부르면서도 도착하는 대상은 단수 동사로 표현해 집합적 이미지를 만듭니다. 한국어에서는 대상의 집합성을 자연스럽게 드러내는 ‘그것’이 이 긴장을 가장 덜 훼손합니다.
  doctrine_reference: 문법-문학적 긴장 보존
