  lexicon: HALOT
  rationale: 영어 POB의 ‘make’는 재분류·전도 행위를 뜻하지만, 한국어에서는 ‘~이라 하다’가 병렬과 압축성을 더 잘 살려 원문의 역전 구조를 간결하게 전달합니다.
- source_word: מַר לְמָתוֹק וּמָתוֹק לְמָר
  english_pob_choice: bitter sweet and sweet bitter
  chosen_korean: 쓴 것을 달다 하고 단 것을 쓰다 하는
  alternatives_korean:
  - 쓴 것을 달게 여기고 단 것을 쓰게 여기며
  - 쓴 것을 달다고 하고 단 것을 쓰다고 하는
  lexicon: HALOT
  rationale: 감각적 대비를 그대로 유지하되 한국어에서 자연스러운 형용사화로 역설을 살렸으며, ‘쓰다/달다’의 대칭을 통해 히브리어의 압축된 반복 효과를 보존합니다.
theological_decisions:
- issue: 악과 선의 전도라는 비난의 범위
  chosen_reading: 이 구절은 특정 분야의 혼란이 아니라 도덕 현실 자체를 거꾸로 뒤집는 행위를 정죄합니다.
  alternative_readings:
  - 정치적·사법적 오류에 대한 제한된 비판
  - 단순한 언어적 실수에 대한 책망
  rationale: 빛/어둠, 쓴/달다의 반복된 대비는 판단 착오가 아니라 가치 질서의 전도를 가리키므로, 번역도 그 보편적 도덕성을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
