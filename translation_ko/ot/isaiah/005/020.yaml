    rationale: 원문은 첫 병렬에서 ‘말하다’를 쓰고, 뒤의 두 병렬에서는 ‘두다/삼다’라는 동사를 반복합니다. 한국어 ‘~으로 삼다’는 이 차이와 역전의 행위를 보존하면서도 자연스럽습니다.
