  verdict: revise
  source_fidelity: 히브리어의 세 병렬—악과 선을 그렇게 말함, 어둠과 빛 및 쓴 것과 단 것을 서로 바꾸어 둠—과 그 도덕적 전도라는 비난을 충실히 반영합니다. 다만 초안은 שָׂמִים의 두 병렬도 모두 ‘~이라 하다’로 처리하여 첫 ‘말하다’ 절과의 어휘적 차이를 지웠습니다. ‘~으로 삼다’는 원문의 능동적 전도·재배치를 자연스럽게 보존합니다.
  naturalness: 초안의 ‘화 있을진저 … 사람들아’는 전통적 성서 문체이지만 현대 합쇼체로는 다소 혼합된 호격 구성이며, 문장 끝의 각주도 해당 구절과 멀리 떨어져 있습니다. ‘…자들에게 화가 있습니다’는 표준어 현대 합쇼체로 자연스럽고 예언적 경고의 뜻도 유지합니다.
  terminology: ‘악/선’, ‘어둠/빛’, ‘쓴 것/단 것’은 도덕적·감각적 대조를 정확히 유지합니다. ‘삼다’는 물리적 변형으로 오해될 수 있는 ‘만들다’보다 여기서의 가치 전도 및 대체의 이미지를 잘 전달합니다. 각주 a의 ‘악에게/선에게’는 한국어 의미역상 부자연스러우므로 ‘악을 두고/선을 두고’로 바로잡아야 합니다.
