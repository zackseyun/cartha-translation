id: ISA.5.20
reference: Isaiah 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וֹי הָ/אֹמְרִ֥ים לָ/רַ֛ע ט֖וֹב וְ/לַ/טּ֣וֹב רָ֑ע שָׂמִ֨ים חֹ֤שֶׁךְ לְ/אוֹר֙ וְ/א֣וֹר לְ/חֹ֔שֶׁךְ שָׂמִ֥ים מַ֛ר לְ/מָת֖וֹק וּ/מָת֥וֹק לְ/מָֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
  footnotes:
  - marker: a
    text: Or 'say to evil, “good,” and to good, “evil.”'
    reason: lexical_alternative
  - marker: b
    text: The repeated imagery of darkness/light and bitter/sweet intensifies the charge of reversing moral reality, not merely making a verbal mistake.
    reason: cultural_note
translation:
  language: ko
  text: 화 있을진저, 악을 선이라 하고 선을 악이라 하며, 어둠을 빛이라 하고 빛을 어둠이라 하며, 쓴 것을 달다 하고 단 것을 쓰다 하는 사람들아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악에게 “선”이라고 말하고, 선에게 “악”이라고 말하는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 빛/어둠, 쓴/달다의 이미지는 단순한 표현 실수보다 도덕적 현실의 전도를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 아아
  - 불행하여라
  lexicon: HALOT
  rationale: 예언자적 책망과 심판의 외침을 가장 강하게 드러내는 한국어 대응으로, 현대 합쇼체에서도 관용적이면서도 경고의 힘을 유지합니다.
- source_word: הָאֹמְרִים לָרַע טוֹב וְלַטּוֹב רָע
  english_pob_choice: those who call evil good and good evil
  chosen_korean: 악을 선이라 하고 선을 악이라 하며
  alternatives_korean:
  - 악을 좋다 하고 선을 나쁘다 하며
  - 악을 좋다 하고 선을 악하다 하며
  lexicon: HALOT
  rationale: 단순히 ‘말하다’보다 가치 판단을 붙여 ‘~라 하다’가 히브리어의 명명·판정 구조를 더 잘 살리며, ‘악/선’은 도덕적 전도라는 초점을 분명히 합니다.
- source_word: שָׂמִים חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  english_pob_choice: make darkness into light and light into darkness
  chosen_korean: 어둠을 빛이라 하고 빛을 어둠이라 하며
  alternatives_korean:
  - 어둠을 빛으로 만들고 빛을 어둠으로 만들며
  - 어둠을 빛으로 여기고 빛을 어둠으로 여기며
  lexicon: HALOT
  rationale: 영어 POB의 ‘make’는 재분류·전도 행위를 뜻하지만, 한국어에서는 ‘~이라 하다’가 병렬과 압축성을 더 잘 살려 원문의 역전 구조를 간결하게 전달합니다.
- source_word: מַר לְמָתוֹק וּמָתוֹק לְמָר
  english_pob_choice: bitter sweet and sweet bitter
  chosen_korean: 쓴 것을 달다 하고 단 것을 쓰다 하는
  alternatives_korean:
  - 쓴 것을 달게 여기고 단 것을 쓰게 여기며
  - 쓴 것을 달다고 하고 단 것을 쓰다고 하는
  lexicon: HALOT
  rationale: 감각적 대비를 그대로 유지하되 한국어에서 자연스러운 형용사화로 역설을 살렸으며, ‘쓰다/달다’의 대칭을 통해 히브리어의 압축된 반복 효과를 보존합니다.
theological_decisions:
- issue: 악과 선의 전도라는 비난의 범위
  chosen_reading: 이 구절은 특정 분야의 혼란이 아니라 도덕 현실 자체를 거꾸로 뒤집는 행위를 정죄합니다.
  alternative_readings:
  - 정치적·사법적 오류에 대한 제한된 비판
  - 단순한 언어적 실수에 대한 책망
  rationale: 빛/어둠, 쓴/달다의 반복된 대비는 판단 착오가 아니라 가치 질서의 전도를 가리키므로, 번역도 그 보편적 도덕성을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
