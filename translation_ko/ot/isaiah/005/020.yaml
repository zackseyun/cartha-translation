  lexicon: HALOT
  rationale: 단순히 ‘말하다’보다 가치 판단을 붙여 ‘~라 하다’가 히브리어의 명명·판정 구조를 더 잘 살리며, ‘악/선’은 도덕적 전도라는 초점을 분명히 합니다.
- source_word: שָׂמִים חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  english_pob_choice: make darkness into light and light into darkness
  chosen_korean: 어둠을 빛이라 하고 빛을 어둠이라 하며
  alternatives_korean:
