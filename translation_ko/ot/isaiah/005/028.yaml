  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
  footnotes:
  - marker: a
    text: Or 'are drawn' for 'are bent'; the Hebrew describes bows made ready for use.
    reason: lexical_alternative
  - marker: b
    text: Or 'like rock' or 'like a flint stone'; the comparison emphasizes the hardness of the horses' hooves.
    reason: lexical_alternative
  - marker: c
    text: Or 'like a storm wind' or 'like the tempest'; the image stresses speed and destructive force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 화살은 날카롭고, 그의 모든 활은 당겨져 있으며[a], 그의 말굽은 부싯돌처럼 여겨지고[b], 그의 바퀴는 회오리바람과 같습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당겨져’는 직역하면 ‘굽혀져’이며, 활을 쏠 준비가 된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부싯돌처럼’은 ‘바위처럼’ 또는 ‘부싯돌 조각처럼’으로도 옮길 수 있으며, 말굽의 단단함을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘회오리바람’은 ‘폭풍’ 또는 ‘돌개바람’으로도 옮길 수 있으며, 격렬하고 빠른 움직임의 이미지를 나타냅니다.
    reason: lexical_alternative
