base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/028.yaml
  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
  footnotes:
  - marker: a
    text: Or 'are drawn' for 'are bent'; the Hebrew describes bows made ready for use.
    reason: lexical_alternative
  - marker: b
    text: Or 'like rock' or 'like a flint stone'; the comparison emphasizes the hardness of the horses' hooves.
    reason: lexical_alternative
  - marker: c
    text: Or 'like a storm wind' or 'like the tempest'; the image stresses speed and destructive force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 화살은 날카롭고, 그의 모든 활은 당겨져 있으며, 그의 말굽은 부싯돌처럼 여겨지고, 그의 바퀴는 회오리바람 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당겨져’는 활을 사격 준비 상태로 만든다는 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부싯돌처럼’은 ‘바위처럼’ 또는 ‘부싯돌 조각처럼’의 뜻으로, 말굽의 단단함을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘회오리바람’은 ‘폭풍’이나 ‘돌개바람’의 뜻을 포함하며, 빠르고 파괴적인 힘을 강조합니다.
    reason: lexical_alternative
