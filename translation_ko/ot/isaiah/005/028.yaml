theological_decisions:
- issue: 전쟁 기계와 자연 폭풍의 비유를 어떻게 살릴지
  chosen_reading: 적의 무력과 속도를 과장된 전투적 비유로 그대로 살렸습니다.
  alternative_readings:
  - 은유를 완화해 단순한 묘사로 읽기
  - 현대어로 평탄화해 이미지 강도를 낮추기
  rationale: 본문은 호라티브한 시적 과장을 통해 침공의 위협을 체감하게 하므로, 이미지를 약화하지 않았습니다.
  doctrine_reference: 예언서의 심판 묘사와 시적 과장에 대한 일반 해석 원리
- issue: 히브리어 소유형의 인칭 일관성
  chosen_reading: '''그의''를 반복해 단수 소유형을 보존했습니다.'
  alternative_readings:
  - 무생물로 받아 '그것의'로 처리하기
  - 한국어에서 소유를 생략하기
  rationale: 히브리어는 침공 세력을 단수 인격처럼 묘사하므로, 그 문법적 효과를 한국어에서도 드러냈습니다.
  doctrine_reference: 문법적 인격화와 시적 수사 보존 원리
