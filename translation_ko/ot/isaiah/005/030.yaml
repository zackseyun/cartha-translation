id: ISA.5.30
reference: Isaiah 5:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִנְהֹ֥ם עָלָ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/נַהֲמַת יָ֑ם וְ/נִבַּ֤ט לָ/אָ֨רֶץ֙ וְ/הִנֵּה חֹ֔שֶׁךְ צַ֣ר וָ/א֔וֹר חָשַׁ֖ךְ בַּ/עֲרִיפֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
  footnotes:
  - marker: a
    text: Or 'against him' / 'over him' for 'over it'; the Hebrew suffix is masculine singular and could refer to a personified people, land, or enemy target depending on how the preceding context is construed.
    reason: alternative_reading
  - marker: b
    text: Or 'and one looks to the earth'; Hebrew אֶרֶץ can mean 'land' or 'earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'darkness and anguish'; the Hebrew term צַר conveys distress, trouble, or constriction.
    reason: lexical_alternative
  - marker: d
    text: Or 'in its clouds' / 'in its thick clouds'; the final phrase is difficult and may refer to the dark cloud-masses by which the light is obscured.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그날에 바다의 울부짖음처럼 그 위에 포효할 것입니다[a]. 사람들이 땅을 바라보면, 보십시오, 어둠과 고통이 있으며[c][b], 빛은 그 구름들 속에서 어두워집니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그를 향해' / '그에게'로도 옮길 수 있습니다. 히브리어 접미사는 남성 단수이며, 앞선 문맥에 따라 의인화된 백성, 땅, 또는 적대하는 대상일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '땅을 바라보면'입니다. 히브리어 אֶרֶץ는 '땅' 또는 '땅/지역'을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '어둠과 환난'입니다. 히브리어 צַר는 고통, 곤경, 압박의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 '그 구름들 속에서' / '그 짙은 구름들 속에서'입니다. 마지막 구절은 어렵고, 빛이 그 어두운 구름 덩어리들에 의해 가려지는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  english_pob_choice: he will roar
  chosen_korean: 포효할 것입니다
  alternatives_korean:
  - 울부짖을 것입니다
  - 으르렁거릴 것입니다
  lexicon: HALOT
  rationale: נהם은 큰 소리로 포효하거나 으르렁거리는 동작을 가리키며, 심판의 위압감을 살리기 위해 '포효하다'를 택했습니다.
- source_word: עָלָיו
  english_pob_choice: over it
  chosen_korean: 그 위에
  alternatives_korean:
  - 그를 향해
  - 그에게
  lexicon: HALOT
  rationale: על + 3인칭 접미사는 '위에/대하여/향하여'의 뜻을 가질 수 있어, 문맥의 공격적·위협적 음성을 살려 '그 위에'로 옮겼습니다.
- source_word: צַר
  english_pob_choice: distress
  chosen_korean: 고통
  alternatives_korean:
  - 환난
  - 곤경
  - 답답함
  lexicon: HALOT
  rationale: צַר는 압박, 조임, 고통의 뉘앙스를 지니므로 '고통'이 어둠과 병렬을 이루는 문맥에서 가장 자연스럽습니다.
- source_word: וְנִבַּט לָאָרֶץ
  english_pob_choice: and if one looks to the land
  chosen_korean: 사람들이 땅을 바라보면
  alternatives_korean:
  - 땅을 바라보면
  - 그리고 땅을 보면
  lexicon: HALOT
  rationale: 동사는 인칭이 드러나지 않는 관찰 표현이므로, 한국어에서는 주어를 보충해 자연스럽게 '사람들이 땅을 바라보면'으로 처리했습니다.
- source_word: בַּעֲרִיפֶיהָ
  english_pob_choice: in its clouds
  chosen_korean: 그 구름들 속에서
  alternatives_korean:
  - 그 구름 속에서
  - 그 짙은 구름들 속에서
  lexicon: HALOT
  rationale: עריף는 구름/구름 덩어리를 가리키며, 접미사 3fs는 앞선 땅/장면을 받습니다. 위치 관계를 살려 '속에서'로 옮겼습니다.
theological_decisions:
- issue: 예언적 종결문의 시각·청각 대비
  chosen_reading: 포효하는 심판의 소리와 어둠 속의 시야 상실을 함께 드러내는 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 심판을 더 설명적으로 풀어 쓰는 방식
  - 문학성을 낮추고 의미를 요약하는 방식
  rationale: 이 절은 청각적 폭력(포효)과 시각적 붕괴(어둠)를 병치하므로, 수사적 긴장을 약화하지 않도록 가능한 한 원문 구조를 보존했습니다.
  doctrine_reference: 이사야 5장의 심판 신탁 문맥
- issue: לָאָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅/나라
  - 땅/땅 위
  rationale: 문맥상 추상적 '지구'보다 심판받는 영역으로서의 '땅'이 적절하여, 대상의 구체성을 살렸습니다.
  doctrine_reference: 예언서의 הארץ 용례
