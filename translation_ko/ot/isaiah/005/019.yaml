revisions:
- from: 그들은 말합니다[a], “그가 빨리 하게 하십시오. 그가 자기 일을 서두르게 하십시오. 그래야 우리가 그것을 보겠습니다. 이스라엘의 거룩하신 분의 계획이 가까이 와서 오게 하십시오. 그래야 우리가 그것을 알겠습니다.”
  to: '이렇게 말하는 자들: “그가 서두르게 하십시오. 그가 그의 일을 속히 이루게 하십시오. 그래야 우리가 그것을 보겠습니다. 이스라엘의 거룩하신 분의 계획[a]이 가까이 다가와 이루어지게 하십시오. 그래야 우리가 그것을 알겠습니다.”'
  rationale: 앞 절에 종속된 분사구의 기능을 ‘이렇게 말하는 자들’로 보존했습니다. 조롱하는 자들이 하나님을 직접 지칭하지 않고 ‘그’라고 부르는 거리를 유지하되, 두 동사의 반복과 계획의 도래·실현이라는 강조를 자연스러운 합쇼체로 옮겼습니다. 각주 표지를 ‘계획’으로 옮기고, 문맥에 맞는 어휘 대안으로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:18Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 분사구는 앞 절의 화 선언에 이어지는 ‘말하는 자들’이라는 지속적 규정이므로, 독립 평서문인 ‘그들은 말합니다’보다 이를 보존하는 편이 정확합니다. 두 개의 연속된 청원/도발 표현과 ‘가까이 오다—오다’의 강조도 한국어에서 유지했습니다.
  naturalness: 초안의 ‘그가 빨리 하게 하십시오’는 목적어 없는 ‘하다’가 부자연스럽고, ‘가까이 와서 오게 하십시오’는 한국어에서 불필요하게 중복됩니다. ‘그가 서두르게 하십시오’ 및 ‘가까이 다가와 이루어지게 하십시오’로 조롱하는 요구의 어조와 자연스러운 문장을 함께 살렸습니다.
  terminology: ‘이스라엘의 거룩하신 분’은 이사야의 신적 칭호를 충실히 옮긴 표현입니다. עֲצָה는 본문에서 ‘계획’으로 번역하고, 대안은 ‘조언’보다 문맥에 맞는 ‘뜻’으로 제시했습니다.
  issues:
  - severity: medium
    issue: 분사구를 독립 평서문 ‘그들은 말합니다’로 처리함
    rationale: הָאֹמְרִים는 앞 절의 ‘화 있을’ 선언을 수식하는 분사이며, 본문 자체에는 ‘그들’이라는 독립 주어도 현재 시제 서술어도 없습니다. ‘이렇게 말하는 자들’이 연결 구조와 지속적 성격 묘사를 보존합니다.
  - severity: medium
    issue: ‘그가 빨리 하게 하십시오’의 한국어 표현이 부자연스러움
    rationale: 한국어에서 목적어 없이 ‘빨리 하다’라고 하면 무엇을 하라는지 불분명합니다. 히브리어의 첫 동사는 일반적인 ‘서두르다’이므로 ‘그가 서두르게 하십시오’가 자연스럽고 의미를 보존합니다.
  - severity: low
    issue: ‘가까이 와서 오게 하십시오’의 중복 표현
    rationale: 히브리어의 두 동사는 의도적인 강조이나, 한국어에서 같은 ‘오다’를 그대로 반복하면 비문에 가깝습니다. ‘가까이 다가와 이루어지게’는 계획이 가까이 이르고 실현되기를 요구하는 문맥적 강조를 자연스럽게 전달합니다.
  - severity: medium
    issue: 각주 표지가 ‘말합니다’에 붙어 있으나 각주 내용은 ‘계획’의 어휘 대안임
    rationale: 각주는 עֲצַת의 번역 대안을 설명하므로 표지는 해당 번역어 ‘계획’에 붙어야 합니다.
  - severity: low
    issue: 각주의 ‘조언’은 문맥상 부정확한 대안
    rationale: עֲצָה는 ‘계획, 뜻, 방침, 조언’의 폭이 있으나, 하나님의 행위가 드러나기를 조롱하는 이 문맥에서는 개인에게 주는 ‘조언’보다 ‘뜻’이 적절한 대안입니다.
