language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
  footnotes:
  - marker: a
    text: Or “the counsel of the Holy One of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 말합니다[a], “그가 빨리 하게 하십시오. 그가 자기 일을 서두르게 하십시오. 그래야 우리가 그것을 보겠습니다. 이스라엘의 거룩하신 분의 계획이 가까이 와서 오게 하십시오. 그래야 우리가 그것을 알겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘의 거룩하신 분의 조언.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  english_pob_choice: who say
  chosen_korean: 그들은 말합니다
  alternatives_korean:
  - 말하는 자들
  - 말하는 이들
  lexicon: HALOT
  rationale: 현재분사적 표현으로 이어지는 꾸짖음의 대상을 자연스러운 현대 문장으로 옮기되, 본문의 지속적 특징지움을 살리기 위해 평서형으로 처리했습니다.
- source_word: יְמַהֵר / יָחִישָׁה
  english_pob_choice: let him hurry; let him hasten
  chosen_korean: 그가 빨리 하게 하십시오. 그가 자기 일을 서두르게 하십시오.
  alternatives_korean:
  - 그가 서두르게 하십시오
  - 그가 속히 하게 하십시오
  lexicon: HALOT
  rationale: 두 동사의 병렬과 반복적 조롱의 뉘앙스를 살리기 위해 한국어에서도 두 번 나누어 표현하고, 명령형 호소를 합쇼체로 반영했습니다.
- source_word: מַעֲשֵׂהוּ
  english_pob_choice: his work
  chosen_korean: 자기 일
  alternatives_korean:
  - 그의 일
  - 그분의 일
  lexicon: HALOT
  rationale: 문맥상 조롱의 대상인 하나님의 행위를 가리키므로, 소유대명사를 자연스럽게 풀어 ‘자기 일’로 옮겨 시제와 대상의 거리감을 유지했습니다.
- source_word: עֲצַת
  english_pob_choice: the plan
  chosen_korean: 계획
  alternatives_korean:
  - 권고
  - 의논
  - 뜻
  lexicon: HALOT
  rationale: 예언적 문맥에서 하나님의 의도/계획을 현대 한국어로 직접 전달하기에 가장 분명한 기본어로 보았습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 거룩한 이
  lexicon: HALOT
  rationale: 이사야서의 표제적 신칭을 관용적으로 번역하되, 호칭의 위엄을 살리고 ‘거룩하신 분’이라는 인격적 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 조롱하는 화자의 어조를 한국어에서 어떻게 살릴지
  chosen_reading: 직접 인용 안에서 하나님께 대하는 조롱조의 명령형을 유지했습니다.
  alternative_readings:
  - 설명투로 풀어 ‘빨리 행하시라고 비웃습니다’라고 옮길 수 있음
  rationale: 본문은 악인의 도발적 요구를 그대로 인용하므로, 해설로 바꾸기보다 명령형을 유지해야 본문의 신학적 긴장과 조롱의 힘이 보존됩니다.
  doctrine_reference: Translation philosophy §1, §3
