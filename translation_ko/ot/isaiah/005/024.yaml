source:
  edition: WLC
  text: לָ/כֵן֩ כֶּ/אֱכֹ֨ל קַ֜שׁ לְשׁ֣וֹן אֵ֗שׁ וַ/חֲשַׁ֤שׁ לֶֽהָבָה֙ יִרְפֶּ֔ה שָׁרְשָׁ/ם֙ כַּ/מָּ֣ק יִֽהְיֶ֔ה וּ/פִרְחָ֖/ם כָּ/אָבָ֣ק יַעֲלֶ֑ה כִּ֣י מָאֲס֗וּ אֵ֚ת תּוֹרַת֙ יְהוָ֣ה צְבָא֔וֹת וְ/אֵ֛ת אִמְרַ֥ת קְדֽוֹשׁ יִשְׂרָאֵ֖ל נִאֵֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'dry stubble' or 'chaff' for 'dry grass'; the Hebrew term denotes dry, combustible plant matter.
    reason: lexical_alternative
  - marker: b
    text: Or 'their root will be like rot'; the Hebrew comparison may be understood either as predicate ('will become rot') or as explicit simile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 불길이 마른 풀을 삼키고 불꽃 앞에서 마른 풀이 사라지듯, 그들의 뿌리는 썩음이 되고 그들의 꽃은 티끌처럼 날아오를 것입니다. 이는 그들이 만군의 야훼의 율법을 버리고 이스라엘의 거룩하신 이의 말씀을 멸시하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 비교 구문은 ‘불의 혀가 삼키는 것’처럼 매우 직유적일 수 있으나, 한국어 본문에서는 의미를 해치지 않는 범위에서 ‘불길’로 자연화했습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그래서
  lexicon: HALOT
  rationale: 앞 문맥의 심판 선언에 대한 귀결을 나타내므로, 한국어에서도 논리적 결론을 분명히 드러내는 ‘그러므로’가 적합합니다.
- source_word: לְשׁוֹן אֵשׁ / קַשׁ / חֲשַׁשׁ / לֶהָבָה
  english_pob_choice: the tongue of fire devours stubble ... dry grass sinks before the flame
  chosen_korean: 불길이 마른 풀을 삼키고 불꽃 앞에서 마른 풀이 사라지듯
  alternatives_korean:
  - 불의 혀가 지푸라기를 먹어치우고 불꽃 앞에서 마른 풀이 꺾이듯
  - 불길이 짚을 삼키고 불꽃 앞에서 마른 풀이 주저앉듯
  lexicon: HALOT
  rationale: 원문의 비유적 이미지를 살리되 한국어에서 자연스럽게 읽히도록 ‘불길/불꽃’으로 옮겼습니다. ‘마른 풀’은 POB의 설명적 선택을 반영하면서도 과도한 전문용어화를 피합니다.
- source_word: שָׁרְשָׁם כַּמָּק יִהְיֶה
  english_pob_choice: their root will become rot
  chosen_korean: 그들의 뿌리는 썩음이 되고
  alternatives_korean:
  - 그들의 뿌리는 썩은 것이 되고
  - 그들의 뿌리는 부패가 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 상태 변화의 진술로 읽을 수 있어, 영어 POB의 해석을 따라 ‘썩음이 되고’로 옮겼습니다. 이렇게 해야 식물 비유의 붕괴와 부패의 결과가 선명해집니다.
- source_word: תּוֹרַת יְהוָה צְבָאוֹת
  english_pob_choice: the law of Yahweh of hosts
  chosen_korean: 만군의 야훼의 율법
  alternatives_korean:
  - 만군의 야훼의 법
  - 만군의 주님의 율법
  lexicon: HALOT
  rationale: 원문의 תחילת משפט적·언약적 뉘앙스를 살려 ‘율법’으로 옮기고, 신명은 본 프로젝트 기본어인 ‘야훼’를 따랐습니다.
- source_word: אִמְרַת קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the word of the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이의 말씀
  alternatives_korean:
  - 이스라엘의 거룩하신 분의 말씀
  - 이스라엘의 거룩하신 이의 말
  lexicon: HALOT
  rationale: 이사야서의 정형화된 신적 칭호를 유지하기 위해 ‘거룩하신 이’로 옮겼고, ‘아מ라트’를 한국어에서 가장 자연스러운 ‘말씀’으로 표현했습니다.
theological_decisions:
- issue: יְהוָה를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명사표를 직접 사용하므로, 이 프로젝트의 기본 원칙에 따라 음역형 ‘야훼’를 사용해 언약적 고유명을 보존했습니다.
  doctrine_reference: 'POB glossary default: יהוה / YHWH → 야훼'
- issue: תּוֹרָה의 번역
  chosen_reading: 율법
  alternative_readings:
  - 교훈
  - 가르침
  rationale: 이 본문은 언약 위반과 심판의 맥락에 있으므로, 추상적 ‘교훈’보다 권위 있는 규범으로서의 ‘율법’이 원문의 무게를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy; glossary default: νόμος (Torah) → 율법'
