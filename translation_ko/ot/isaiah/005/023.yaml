  - severity: high
    issue: ‘뇌물을 받고 악인을 무죄로 선고하는 자들과, 의인들의 의를 그들에게서 빼앗는 자들입니다’는 병렬과 종결 구성이 문법적으로 어색합니다.
    rationale: 두 분사 표현은 동일한 대상을 수식합니다. ‘자들과’ 및 ‘입니다’를 제거하고 하나의 관계절로 연결해야 합니다.
  - severity: low
