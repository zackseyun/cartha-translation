  text: מַצְדִּיקֵ֥י רָשָׁ֖ע עֵ֣קֶב שֹׁ֑חַד וְ/צִדְקַ֥ת צַדִּיקִ֖ים יָסִ֥ירוּ מִמֶּֽ/נּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/023.yaml
  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
  footnotes:
  - marker: a
    text: Or 'who justify the wicked because of a bribe, and remove the justice of the righteous from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뇌물을 받고 악인을 무죄로 선고하는 자들과, 의인들의 의를 그들에게서 빼앗는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뇌물 때문에 악인을 무죄로 선고하고, 의인들에게서 그들의 의를 빼앗는 자들입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְדִּיקֵי רָשָׁע
  english_pob_choice: who acquit the wicked
  chosen_korean: 악인을 무죄로 선고하는 자들
  alternatives_korean:
  - 악인을 의롭다 하는 자들
  - 악인을 정당하다고 판결하는 자들
  lexicon: HALOT
  rationale: 법정적 Hiphil צדק의 의미를 살려 ‘의롭다 하다’보다 판결 행위가 드러나는 ‘무죄로 선고하다’를 택했습니다.
- source_word: עֵקֶב שֹׁחַד
  english_pob_choice: for a bribe
  chosen_korean: 뇌물을 받고
  alternatives_korean:
  - 뇌물 때문에
  - 뇌물로 말미암아
  lexicon: HALOT
  rationale: 원문의 원인·대가 관계를 자연스러운 한국어로 압축해, 부패한 판결이 뇌물과 결부된다는 점을 분명히 했습니다.
- source_word: צִדְקַת צַדִּיקִים
  english_pob_choice: the righteousness of the righteous
  chosen_korean: 의인들의 의
  alternatives_korean:
  - 의로운 사람들의 의로움
  - 의인들의 정의
  lexicon: HALOT
  rationale: צדקה의 핵심 어휘 연관을 살리면서도, 여기서는 법정·윤리적 권리의 침해라는 점이 드러나도록 간결하게 옮겼습니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from him
  chosen_korean: 그들에게서
  alternatives_korean:
  - 그에게서
  - 그로부터
  lexicon: HALOT
  rationale: 마소라 본문의 3인칭 남성 단수 접미사는 분배적으로 이해될 수 있으므로, 한국어에서는 복수 주어에 자연스럽게 맞는 ‘그들에게서’로 옮겼습니다.
theological_decisions:
- issue: צִדְקָה의 법정적 의미를 어떻게 드러낼지
  chosen_reading: 의인들이 마땅히 누려야 할 의가 부패한 판결로 빼앗기는 장면으로 읽었습니다.
  alternative_readings:
  - 의인들의 정의
  - 의인들의 권리
  rationale: 본문은 단순한 도덕 평가가 아니라 부패한 사법 행위를 고발하므로, ‘의’라는 핵심 어휘를 유지하되 ‘빼앗는다’로 침해성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 어휘 일관성 유지, 법정적·윤리적 긴장 보존'
