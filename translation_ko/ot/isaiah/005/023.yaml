  source_fidelity: ‘악인을 무죄로 선고하다’는 מַצְדִּיקֵי רָשָׁע의 법정적 선언 의미를 잘 살립니다. 그러나 עֵקֶב שֹׁחַד은 뇌물을 ‘받는’ 행위 자체보다 뇌물이라는 원인·대가 때문에 판결한다는 뜻이므로 ‘뇌물 때문에’가 더 직접적입니다. מִמֶּנּוּ의 남성 단수 접미사는 복수 ‘의인들’에 대한 분배적 단수로 보존하는 편이 좋습니다.
  naturalness: 현 초안의 ‘자들과, ... 자들입니다’는 병렬된 두 주어 뒤에 근거 없는 서술격 종결을 붙여 문법적으로 부자연스럽습니다. 두 분사구를 하나의 관계절로 묶어야 합니다. 이 절은 앞 절의 ‘화 있을 자들’에 이어지는 히브리어 문맥상 종속적 열거이므로, 한국어에서도 ‘...하는 자들’로 끝내는 것이 적절합니다.
  terminology: ‘무죄로 선고하다’는 משפט 문맥에 적합합니다. צִדְקָה의 어근 연관과 법정적 함의를 보존하기 위해 ‘의’를 유지합니다. 단수 접미사의 분배성을 ‘의인 각 사람에게서 그의 의를’로 나타내며, 이것은 각 의인에게 해당한다는 뜻이지 특정 교리적 해석이 아닙니다.
  issues:
