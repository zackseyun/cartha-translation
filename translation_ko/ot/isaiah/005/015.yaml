  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/עֵינֵ֥י גְבֹהִ֖ים תִּשְׁפַּֽלְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/015.yaml
  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
  footnotes:
  - marker: a
    text: Or 'bows down ... is brought low'; the Hebrew uses two related but distinct verbs for abasement in poetic parallel.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the eyes of the lofty'; that is, the proud or haughty look of exalted people.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 낮아지고, 한 사람은 겸손해지며, 높은 자들의 눈은 낮아질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 두 절에서 비슷하지만 구별되는 낮춤의 동사를 병렬로 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘높은 자들의 눈’이라고 하며, 곧 교만하게 치켜든 시선을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람은
  alternatives_korean:
  - 인간은
  - 인류는
  - 사람이
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 대표적 인간을 가리키는 뜻을 살리되, 시적 병렬에서 자연스러운 표준어로 옮겼습니다.
- source_word: וַיִּשַּׁח
  english_pob_choice: is brought low
  chosen_korean: 낮아지고
  alternatives_korean:
  - 엎드러지고
  - 낮아지며
  - 굴복하고
  lexicon: HALOT
  rationale: ‘낮아지다’는 낮춤/굴욕의 의미를 직접 살리면서도 한국어에서 과도하게 해석적이지 않아 첫 절의 심판적 하강을 잘 드러냅니다.
- source_word: וַיִּשְׁפַּל
  english_pob_choice: is humbled
  chosen_korean: 겸손해지며
  alternatives_korean:
  - 낮아지며
  - 비천해지며
  - 겸비되며
  lexicon: HALOT
  rationale: שׁפל의 ‘낮아짐’과 겸손/비하의 뉘앙스를 반영하여, 앞절의 반복을 단순 동어반복으로 만들지 않으면서도 의미 영역을 유지했습니다.
- source_word: עֵינֵי גְבֹהִים
  english_pob_choice: the eyes of the lofty
  chosen_korean: 높은 자들의 눈은
  alternatives_korean:
  - 교만한 눈은
  - 높은 이들의 눈은
  - 자만한 눈은
  lexicon: HALOT
  rationale: 직역에 가까운 ‘높은 자들의 눈’으로 히브리어의 구체적 이미지와 소유격 구조를 보존했고, POB의 각주가 말하는 ‘교만한 사람들의 높이 든 시선’이라는 함의를 본문에 과잉 해석 없이 반영했습니다.
- source_word: תִּשְׁפַּלְנָה
  english_pob_choice: will be brought low
  chosen_korean: 낮아질 것입니다
  alternatives_korean:
  - 낮아질 것입니다
  - 겸손해질 것입니다
  - 비천해질 것입니다
  lexicon: HALOT
  rationale: 미래형 예언 어조를 살려 종결을 미래로 옮겼고, 앞의 שני 동사와 같은 어근 계열의 ‘낮아지다’로 통일해 시적 평행을 유지했습니다.
theological_decisions:
- issue: אָדָם과 אִישׁ의 병렬을 한국어에서 어떻게 보존할지
  chosen_reading: ‘사람은 … 한 사람은 …’으로 두 단수 표현을 병렬로 살렸습니다.
  alternative_readings:
  - ‘인류는 … 사람은 …’
  - ‘인간은 … 한 사람은 …’
  rationale: 본문은 인간 일반을 말하면서도 두 개의 단수 남성 명사를 병렬로 써서 보편성과 개별성을 함께 드러냅니다. 이를 평준화하지 않고 두 겹의 대표성을 유지하는 것이 원문 효과를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
- issue: 예언 시의 동사 시제와 어조
  chosen_reading: 한국어에서는 현재-진행/미래형으로 옮겨 예언적 확실성을 살렸습니다.
  alternative_readings:
  - 과거형으로 통일
  - 직설적 미래로만 통일
  rationale: 히브리어 wayyiqtol과 미완료형은 서사 과거라기보다 예언적 확실성의 현재적 진술로 기능할 수 있습니다. 한국어에서도 심판 선언의 생생함을 유지하는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1 and §6'
