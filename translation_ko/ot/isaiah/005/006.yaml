theological_decisions:
- issue: 하나님의 직접 심판 행위의 어조
  chosen_reading: 1인칭 직접 화법을 유지해 ‘내가 … 만들겠습니다’와 ‘내가 … 명하여’로 옮겼습니다.
  alternative_readings:
  - 간접적 재난 서술로 완화
  - 수동형으로 바꾸어 주어를 흐리게 함
  rationale: 본문은 포도원에 대한 심판을 하나님이 능동적으로 집행하신다는 점을 전면에 내세우므로, 이를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 예언서의 신적 심판 주권
- issue: 농경 파괴 이미지의 수위
  chosen_reading: ‘황무지’와 비 차단을 그대로 유지해 재앙의 의도적 성격을 보존했습니다.
  alternative_readings:
  - 완화하여 단순한 방치로 표현
  - 비유를 축소하여 일반적 쇠퇴로 표현
  rationale: 문맥상 단순한 방치가 아니라 언약적 심판의 표지이므로, 의도된 황폐와 결핍을 분명히 해야 합니다.
  doctrine_reference: 이사야 5장의 포도원 비유와 심판 선언
