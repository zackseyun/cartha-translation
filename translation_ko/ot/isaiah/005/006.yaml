id: ISA.5.6
reference: Isaiah 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲשִׁיתֵ֣/הוּ בָתָ֗ה לֹ֤א יִזָּמֵר֙ וְ/לֹ֣א יֵעָדֵ֔ר וְ/עָלָ֥ה שָׁמִ֖יר וָ/שָׁ֑יִת וְ/עַ֤ל הֶ/עָבִים֙ אֲצַוֶּ֔ה מֵ/הַמְטִ֥יר עָלָ֖י/ו מָטָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
  footnotes:
  - marker: a
    text: Or 'a desolation' or 'uncultivated land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'dug.' The Hebrew refers to cultivating the soil.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says 'from raining rain on it,' an idiom meaning to withhold rain from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 황무지로 만들겠습니다[a]. 그것은 가지치기되지도, 호미질되지도 않을 것이며, 가시덤불과 엉겅퀴가 자라날 것입니다[b][c]. 그리고 내가 구름에게 명하여 그 위에 비를 내리지 못하게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐한 땅’, ‘경작되지 않은 땅’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파내지지도’입니다. 히브리어는 토양을 경작하는 일을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 위에 비를 비 내리지 못하게 하겠다’라는 뜻으로, 비를 거두는 의미의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  english_pob_choice: And I will make it
  chosen_korean: 내가 그것을 …로 만들겠습니다
  alternatives_korean:
  - 내가 그것을 …로 두겠습니다
  - 내가 그것을 …로 세우겠습니다
  lexicon: HALOT
  rationale: שׂים은 여기서 상태를 부여하는 넓은 동사이므로, 심판 선언의 맥락에서는 ‘만들겠습니다’가 가장 자연스럽고 직접적입니다.
- source_word: בָתָה
  english_pob_choice: a wasteland
  chosen_korean: 황무지
  alternatives_korean:
  - 폐허
  - 황폐한 땅
  - 불모지
  lexicon: HALOT
  rationale: 문맥상 경작이 중단된 황폐한 땅을 가리키므로, 한국어로는 압축적이면서도 의미 범위를 살리는 ‘황무지’가 적절합니다.
- source_word: לֹא יִזָּמֵר וְלֹא יֵעָדֵר
  english_pob_choice: it will not be pruned or hoed
  chosen_korean: 가지치기되지도, 호미질되지도 않을 것이며
  alternatives_korean:
  - 전정되지도, 갈아엎어지지도 않을 것이며
  - 가지치기도, 김매기도 하지 않을 것이며
  lexicon: HALOT
  rationale: 포도원/밭 관리의 중단을 나타내는 농경어휘이므로, ‘가지치기’와 ‘호미질’로 경작 행위의 정지를 구체적으로 드러냈습니다.
- source_word: וְעָלָה שָׁמִיר וָשָׁיִת
  english_pob_choice: and briers and thorns will grow up
  chosen_korean: 가시덤불과 엉겅퀴가 자라날 것입니다
  alternatives_korean:
  - 찔레와 가시가 자라날 것입니다
  - 가시와 엉겅퀴가 올라올 것입니다
  lexicon: HALOT
  rationale: שָׁמִיר וָשָׁיִת은 황폐를 상징하는 관용적 병렬이므로, 과도하게 식물학적으로 세분하지 않고 한국어 성경에서 통용되는 ‘가시덤불과 엉겅퀴’로 옮겼습니다.
- source_word: וְעַל הֶעָבִים אֲצַוֶּה מֵהַמְטִיר עָלָיו מָטָר
  english_pob_choice: and I will command the clouds not to rain on it
  chosen_korean: 구름에게 명하여 그 위에 비를 내리지 못하게 하겠습니다
  alternatives_korean:
  - 구름에게 명하여 그 위에 비가 내리지 않게 하겠습니다
  - 구름에 명하여 그 위로 비를 내리지 못하게 하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘비를 비 내리다’라는 관용적·강조적 표현을 한국어에서는 자연스럽게 풀어, 금지의 뜻이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 하나님의 직접 심판 행위의 어조
  chosen_reading: 1인칭 직접 화법을 유지해 ‘내가 … 만들겠습니다’와 ‘내가 … 명하여’로 옮겼습니다.
  alternative_readings:
  - 간접적 재난 서술로 완화
  - 수동형으로 바꾸어 주어를 흐리게 함
  rationale: 본문은 포도원에 대한 심판을 하나님이 능동적으로 집행하신다는 점을 전면에 내세우므로, 이를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 예언서의 신적 심판 주권
- issue: 농경 파괴 이미지의 수위
  chosen_reading: ‘황무지’와 비 차단을 그대로 유지해 재앙의 의도적 성격을 보존했습니다.
  alternative_readings:
  - 완화하여 단순한 방치로 표현
  - 비유를 축소하여 일반적 쇠퇴로 표현
  rationale: 문맥상 단순한 방치가 아니라 언약적 심판의 표지이므로, 의도된 황폐와 결핍을 분명히 해야 합니다.
  doctrine_reference: 이사야 5장의 포도원 비유와 심판 선언
