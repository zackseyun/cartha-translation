base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
  footnotes:
  - marker: a
    text: Or 'a desolation' or 'uncultivated land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'dug.' The Hebrew refers to cultivating the soil.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says 'from raining rain on it,' an idiom meaning to withhold rain from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 황무지로 만들겠습니다[a]. 그곳은 가지치기를 하지도 않고 땅을 일구지도 않을 것이며[b], 가시덤불과 가시나무가 자라날 것입니다. 그리고 내가 구름에게 명하여 그곳에 비를 내리지 못하게 하겠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐한 땅’ 또는 ‘경작되지 않은 땅’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파지도’입니다. 히브리어는 토양을 경작하는 일을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어에는 ‘비를 내리다’에서 ‘비’와 같은 어근의 말이 거듭 쓰입니다. 이는 그곳에 비가 내리지 않게 한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
