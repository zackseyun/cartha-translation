id: ISA.5.8
reference: Isaiah 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֗וֹי מַגִּיעֵ֥י בַ֨יִת֙ בְּ/בַ֔יִת שָׂדֶ֥ה בְ/שָׂדֶ֖ה יַקְרִ֑יבוּ עַ֚ד אֶ֣פֶס מָק֔וֹם וְ/הֽוּשַׁבְתֶּ֥ם לְ/בַדְּ/כֶ֖ם בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
  footnotes:
  - marker: a
    text: Or 'who add field to field' / 'who join field to field.' The Hebrew verb is literally 'bring near,' used here for consolidating property.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts to second person ('and you are made to dwell'), directly confronting the offenders.
    reason: lexical_alternative
translation:
  language: ko
  text: 화 있을진저 집을 집에 잇대며 밭을 밭에 가까이하여 마침내 땅 한 뙈기도 남지 않게 하고, 너희는 그 땅 한가운데 홀로 거주하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집을 집에 잇대며’는 히브리어의 분사 표현을 자연스럽게 옮긴 것이며, 영어 POB의 ‘join house to house’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 한 뙈기’는 ‘더는 남을 장소가 없다’는 뜻을 한국어로 구체화한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 화가 있으리라
  - 슬프도다
  lexicon: HALOT
  rationale: 예언자적 책망과 심판 선언의 강한 경고를 살리기 위해 ‘화 있을진저’를 택했습니다.
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  english_pob_choice: who join house to house
  chosen_korean: 집을 집에 잇대며
  alternatives_korean:
  - 집을 집에 더하며
  - 집과 집을 연결하며
  lexicon: HALOT
  rationale: 문맥상 재산을 계속 합치는 뜻을 살리면서, ‘잇대다’로 집-집의 결합 이미지를 비교적 자연스럽게 옮겼습니다.
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  english_pob_choice: who bring field near to field
  chosen_korean: 밭을 밭에 가까이하여
  alternatives_korean:
  - 밭을 밭에 더하여
  - 밭과 밭을 잇대며
  lexicon: HALOT
  rationale: hebrew의 קרב('가까이하다, 가까워지게 하다')를 반영해 앞절과 평행을 이루는 표현으로 옮겼습니다.
- source_word: עַד אֶפֶס מָקוֹם
  english_pob_choice: until there is no place left
  chosen_korean: 마침내 땅 한 뙈기도 남지 않게 하고
  alternatives_korean:
  - 더는 남을 자리가 없게 하고
  - 빈터가 없게 하고
  lexicon: HALOT
  rationale: ‘장소가 없다’는 추상 표현을 한국어에서는 토지 독점의 결과가 분명히 드러나도록 구체화했습니다.
- source_word: וְהוּשַׁבְתֶּם לְבַדְּכֶם
  english_pob_choice: and you are made to dwell alone
  chosen_korean: 너희는 … 홀로 거주하게 될 것입니다
  alternatives_korean:
  - 너희는 … 혼자 살게 될 것입니다
  - 너희는 … 홀로 살게 될 것입니다
  lexicon: HALOT
  rationale: 피동/사역 뉘앙스를 살려 ‘거주하게 될 것입니다’로 옮기고, ‘홀로’로 배타성을 드러냈습니다.
theological_decisions:
- issue: 예언적 경고문의 어조
  chosen_reading: 직설적 심판 선언으로 옮겨, 본문의 책망성과 불가피한 결과를 분명히 드러냈습니다.
  alternative_readings:
  - 완곡한 경고문으로 완화할 수 있음
  - 서술형으로 중립화할 수 있음
  rationale: הוֹי는 단순 감탄이 아니라 예언자적 ‘화’ 선언이므로, 한국어에서도 경고의 압박감을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 예언서의 심판 선포 형식
