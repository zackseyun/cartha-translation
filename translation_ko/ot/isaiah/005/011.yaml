base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
  footnotes:
  - marker: a
    text: Or 'until evening'; the Hebrew נֶשֶׁף can denote twilight, especially dusk, though its exact nuance varies by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침 일찍 일어나 취하게 하는 술을 찾아다니고, 저녁 무렵까지[a] 늦도록 머물러 포도주가 그들을 달아오르게 하는 자들에게 화가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶשֶׁף는 ‘황혼’ 또는 ‘저녁 무렵’을 뜻할 수 있습니다. 문맥상 이른 아침과 대조되는 저녁의 어스름을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
