id: ISA.5.11
reference: Isaiah 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
  footnotes:
  - marker: a
    text: Or 'until evening'; the Hebrew נֶשֶׁף can denote twilight, especially dusk, though its exact nuance varies by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침 일찍 일어나 독주를 추구하고, 밤늦게까지 머물러 포도주에 자신을 달구는 자들에게 화가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밤늦게까지’는 히브리어 נֶשֶׁף가 문맥에 따라 ‘황혼/저녁 무렵’을 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 아!
  - 슬프다
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 경고와 심판 선언의 힘을 살리면서, 현대 한국어에서 자연스럽고 공적 문체에 맞는 표현으로 옮겼습니다.
- source_word: שֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 강한 술
  - 취하게 하는 술
  - 알코올
  lexicon: HALOT
  rationale: 포도주와 구별되는 넓은 의미의 취하게 하는 술을 가리키므로, 기존 교회어보다 स्रोत 의미를 분명히 하는 ‘독주’를 택했습니다.
- source_word: מְאַחֲרֵי בַנֶּשֶׁף
  english_pob_choice: who stay up late into the twilight
  chosen_korean: 밤늦게까지 머물러
  alternatives_korean:
  - 황혼까지 머물러
  - 저녁까지 지체하며
  - 밤까지 늦게까지
  lexicon: HALOT
  rationale: נֶשֶׁף의 시간대를 문맥상 저녁 무렵으로 보고, 한국어에서는 ‘밤늦게까지’로 자연스럽게 풀어 원문의 장시간 음주 행위를 드러냈습니다.
- source_word: יַדְלִיקֵם
  english_pob_choice: inflames them
  chosen_korean: 자신을 달구는
  alternatives_korean:
  - 자신을 불태우는
  - 그들을 달아오르게 하는
  - 그들을 달구는
  lexicon: HALOT
  rationale: 히필의 불붙게/달아오르게 하는 은유를 살리되, 한국어에서는 주어의 자기 파괴적 행위를 드러내기 위해 재귀적으로 표현했습니다.
theological_decisions:
- issue: 예언적 ‘화’ 선언의 어조
  chosen_reading: 직설적 심판 경고로서 ‘화가 있습니다’를 유지했습니다.
  alternative_readings:
  - ‘슬프다’로 완화
  - 단순한 감탄문으로 처리
  rationale: 문맥은 애도보다 공개적 책망과 심판 선고에 가깝기 때문에, 경고의 무게를 약화시키지 않도록 했습니다.
  doctrine_reference: 예언서의 저주/심판 선언 문맥(사 5장 문맥)
