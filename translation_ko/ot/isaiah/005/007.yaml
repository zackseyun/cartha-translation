id: ISA.5.7
reference: Isaiah 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
  footnotes:
  - marker: a
    text: 'Hebrew plays on similar sounds: ''justice'' (mishpat) / ''bloodshed'' (mispach), and ''righteousness'' (tsedaqah) / ''outcry'' (tse''aqah). The wordplay sharpens the contrast between what the LORD sought and what he found.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the man of Judah,' with a collective sense; Hebrew singular אִישׁ can represent the group.
    reason: alternative_reading
  - marker: c
    text: '''LORD of Armies'' is traditionally rendered ''LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼의 포도원은 이스라엘의 집이요[a], 유다 사람들은 그의 기뻐하는 심는 것[b]입니다. 그분은 정의를 바라셨지만, 보라, 피 흘림이었고; 의를 바라셨지만, 보라, 부르짖음이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘정의’(mishpat) / ‘피 흘림’(mispach), ‘의’(tsedaqah) / ‘부르짖음’(tse'aqah) 사이의 유사한 소리로 말놀이를 합니다. 이 말놀이가 야훼께서 찾으신 것과 실제로 발견하신 것의 대조를 더욱 날카롭게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 단수 אִישׁ은 집합적으로 쓰여 ‘유다 사람들’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 야훼의 군대들
  lexicon: HALOT
  rationale: POB의 ‘of Armies’를 한국어 관용과 신학적 가독성에 맞게 ‘만군’으로 옮기고, 여호와 대신 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘의 집
  alternatives_korean:
  - 이스라엘 집
  - 이스라엘 가문
  lexicon: HALOT
  rationale: 언약적 집합체를 나타내는 관용구이므로, 직역에 가까운 ‘이스라엘의 집’이 원문의 집단적 의미를 잘 살립니다.
- source_word: וְאִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다의 남자들
  - 유다의 사람들
  lexicon: HALOT
  rationale: 히브리어 단수 אִישׁ이 집합적으로 쓰인 점은 살리되, 한국어에서는 성별을 과도하게 드러내지 않으면서 복수 집합성을 자연스럽게 전달했습니다.
- source_word: נְטַע שַׁעֲשׁוּעָיו
  english_pob_choice: the planting of his delight
  chosen_korean: 그의 기뻐하는 심는 것
  alternatives_korean:
  - 그가 기뻐하는 심기
  - 그의 기쁨의 심긴 것
  lexicon: HALOT
  rationale: יַטע/נטע의 농경 이미지를 유지하면서, 소유격 ‘his delight’를 주어적 표현으로 풀어 하나님의 기쁨을 위한 ‘심은 것’이라는 뜻을 드러냈습니다.
- source_word: מִשְׂפָּח
  english_pob_choice: bloodshed
  chosen_korean: 피 흘림
  alternatives_korean:
  - 유혈
  - 피를 흘림
  lexicon: HALOT
  rationale: משפט와의 말놀이를 한국어로 완전히 재현할 수는 없지만, 폭력적 결과를 가장 직접적으로 드러내는 ‘피 흘림’이 문맥상 적절합니다.
- source_word: צְעָקָה
  english_pob_choice: an outcry
  chosen_korean: 부르짖음
  alternatives_korean:
  - 외침
  - 호소
  lexicon: HALOT
  rationale: 억눌림이나 억울함에서 터져 나오는 외침의 성격을 살리기 위해 ‘부르짖음’을 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 여호와
  - 만군의 주
  rationale: 원문은 신명기적 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 집합명사로서의 ‘אִישׁ יְהוּדָה’
  chosen_reading: 유다 사람들
  alternative_readings:
  - 유다의 남자들
  - 유다의 한 사람
  rationale: 히브리어 단수형이 집합적 의미를 가지므로, 문맥의 복수성을 살리면서도 한국어에서 부자연스럽지 않게 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
