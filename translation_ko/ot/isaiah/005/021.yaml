id: ISA.5.21
reference: Isaiah 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֖וֹי חֲכָמִ֣ים בְּ/עֵֽינֵי/הֶ֑ם וְ/נֶ֥גֶד פְּנֵי/הֶ֖ם נְבֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
  footnotes:
  - marker: a
    text: Or 'understanding' for 'discerning.' The Hebrew term denotes perceptive intelligence or discernment.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 눈에 지혜롭고 자기 보기에 분별력이 있다고 여기는 자들에게 화가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해력이 있다고’로 옮길 수 있습니다. 이 히브리어 낱말은 사리를 분별하고 이해하는 지적 능력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֖וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬픔이 있습니다
  - 아, 슬프도다
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 경고와 심판 선언의 강한 어조를 한국어에서 자연스럽게 살리기 위해 ‘화가 있습니다’를 택했습니다.
- source_word: חֲכָמִים
  english_pob_choice: wise
  chosen_korean: 지혜롭다
  alternatives_korean:
  - 슬기롭다
  - 현명하다
  - 지혜로운 자들이다
  lexicon: HALOT
  rationale: 문맥상 실제 지혜가 아니라 자기평가의 문제이므로, ‘스스로 지혜롭다’로 옮겨 자기기만의 뉘앙스를 드러냈습니다.
- source_word: בְּעֵינֵיהֶם
  english_pob_choice: in their own eyes
  chosen_korean: 자기 눈에
  alternatives_korean:
  - 그들 자신의 눈에
  - 자기 보기에
  - 자기 생각에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되 한국어에서는 자연스럽게 ‘자기 눈에’로 표현했습니다.
- source_word: וְנֶגֶד פְּנֵיהֶם
  english_pob_choice: in their own sight
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 자기 보기에
  - 자기 얼굴 앞에서
  - 자기 시야에서
  lexicon: HALOT
  rationale: 앞 구와 평행을 이루는 표현으로, 문자적 이미지인 ‘얼굴 앞에’의 감각을 유지하면서도 한국어 문장 흐름을 해치지 않도록 했습니다.
- source_word: נְבֹנִים
  english_pob_choice: discerning
  chosen_korean: 분별 있다고 여기는
  alternatives_korean:
  - 이해한다고 여기는
  - 총명하다고 여기는
  - 판단력이 있다고 여기는
  lexicon: HALOT
  rationale: POB의 ‘discerning’은 단순 지식보다 분별력을 뜻하므로, 스스로에 대한 평가임을 드러내는 ‘분별 있다고 여기는’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 책망 어조의 보존
  chosen_reading: ‘화가 있습니다’로 시작해 이사야의 심판 선고를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘아, 슬프도다’처럼 탄식 중심으로 완화하는 번역
  - ‘재앙이 있습니다’처럼 결과 중심으로 바꾸는 번역
  rationale: 본문은 단순 감정 표출이 아니라 책망과 심판 선언이므로, 예언자적 경고의 강도를 약화하지 않았습니다.
  doctrine_reference: 예언서의 심판 선언과 언약적 책망
- issue: ‘자기 눈/자기 앞’의 자기기만 강조
  chosen_reading: 두 평행구를 각각 ‘자기 눈에’, ‘자기 앞에서’로 살려 자기평가와 자기기준의 뉘앙스를 보존했습니다.
  alternative_readings:
  - 두 구를 모두 ‘스스로 보기엔’으로 단순화하는 번역
  - ‘자기 자신에게’로 의미를 평탄화하는 번역
  rationale: 히브리어의 평행법이 보여 주는 반복과 강조를 유지해야, 지혜와 분별이 실제가 아니라 자기 확신에 불과하다는 비판이 선명해집니다.
  doctrine_reference: 지혜의 교만에 대한 성경적 비판
