    rationale: 소유 접미사와 ‘자기 눈에/자기 보기에’가 이미 자기지시를 충분히 나타냅니다. ‘분별력이 있다’가 현대 한국어에서 더 자연스럽습니다.
  revised_text: 자기 눈에 지혜롭고 자기 보기에 분별력이 있다고 여기는 자들에게 화가 있습니다.[a]
