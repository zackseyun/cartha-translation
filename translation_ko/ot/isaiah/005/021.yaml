  source_fidelity: 히브리어의 화 선언(הוֹי)과 ‘자기 눈에’ 및 ‘자기 앞/얼굴 앞에’라는 동의적 평행법, 그리고 자기평가를 비판하는 의미는 대체로 반영되었습니다. 그러나 ‘자기 앞에서’는 וְנֶגֶד פְּנֵיהֶם의 한국어 관용적 의미인 ‘자기 보기에/자기 눈에’로 읽히지 않고, 물리적으로 자기 앞에 있다는 뜻으로 오해될 수 있습니다.
  naturalness: ‘자기 앞에서 스스로 분별 있다고 여기는’은 현대 표준어에서 부자연스럽습니다. ‘자기 보기에 분별력이 있다고 여기는’이 자연스럽고 원문의 평행 관계도 보존합니다. ‘스스로’의 반복은 불필요하므로 제거합니다.
  terminology: ‘화가 있습니다’는 예언적 화 선언의 엄중한 어조를 적절히 전달합니다. נְבֹנִים은 여기서 ‘분별력 있다’가 적절하며, 각주에서는 ‘이해력이 있다’를 가능한 어휘 대안으로 제시할 수 있습니다.
  issues:
