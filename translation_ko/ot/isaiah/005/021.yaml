    issue: ‘자기 앞에서’는 וְנֶגֶד פְּנֵיהֶם의 관용적 평행 의미를 자연스럽게 전달하지 못합니다.
    rationale: 이 구는 앞선 ‘자기 눈에’와 평행하여 자신의 판단·견해에 비추어 자신을 분별 있는 사람으로 여긴다는 뜻입니다. 한국어 ‘자기 앞에서’는 이 의미를 전달하지 못하고 어색합니다.
  - severity: low
