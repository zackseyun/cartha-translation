id: ISA.5.18
reference: Isaiah 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֛וֹי מֹשְׁכֵ֥י הֶֽ/עָוֺ֖ן בְּ/חַבְלֵ֣י הַ/שָּׁ֑וְא וְ/כַ/עֲב֥וֹת הָ/עֲגָלָ֖ה חַטָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
  footnotes:
  - marker: a
    text: Or 'with cords of falsehood' for 'with cords of emptiness'; Hebrew שָׁוְא can denote emptiness, vanity, or falsehood.
    reason: lexical_alternative
  - marker: b
    text: The image may also suggest drawing guilt or punishment upon themselves, not only dragging sin along.
    reason: alternative_reading
translation:
  language: ko
  text: 화 있으라, 허무의 줄로 죄악을 끌어당기고 수레의 줄로 죄를 끄는 자들에게![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허무’는 이 단어가 가질 수 있는 ‘헛됨, 공허, 거짓’의 범위를 아우르려는 번역입니다. POB 영어 본문은 이를 ‘falsehood’로 좁혀 읽는 가능성도 함께 남깁니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 죄를 끌고 다닌다는 뜻일 수도 있고, 죄책이나 형벌을 스스로 끌어오는 모습일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ה֛וֹי
  english_pob_choice: Woe
  chosen_korean: 화 있으라
  alternatives_korean:
  - 슬프다
  - 아아
  - 화가 있다
  lexicon: HALOT
  rationale: 예언자적 경고와 심판 선언의 강한 어조를 살리기 위해, 합쇼체 본문 안에서도 축약된 탄식·경고 표현인 ‘화 있으라’를 택했습니다.
- source_word: הֶעָוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 불의
  - 죄
  - 악행
  lexicon: HALOT
  rationale: 앞의 חטאה와 구별되는 도덕적 중함을 살리기 위해, 단순한 ‘죄’보다 더 무거운 뉘앙스의 ‘죄악’을 선택했습니다.
- source_word: שָׁוְא
  english_pob_choice: with cords of falsehood
  chosen_korean: 허무의 줄로
  alternatives_korean:
  - 거짓의 줄로
  - 헛됨의 줄로
  - 공허의 줄로
  lexicon: HALOT
  rationale: שָׁוְא의 핵심 범위인 ‘공허, 헛됨, 허무, 거짓’ 가운데, 본문 이미지의 밀도를 살리면서도 직설적 속임수로만 좁히지 않는 ‘허무’를 택했습니다.
- source_word: כַעֲבֹתוֹת הָעֲגָלָה
  english_pob_choice: with cart ropes
  chosen_korean: 수레의 줄로
  alternatives_korean:
  - 수레 밧줄로
  - 수레 끈으로
  - 수레 로프로
  lexicon: HALOT
  rationale: עֲגָלָה는 농경적 ‘수레’이며, עֲבֹתוֹת는 굵은 줄·밧줄을 가리키므로, 현대 한국어에서 자연스럽고 이미지가 유지되는 ‘수레의 줄’로 옮겼습니다.
- source_word: מֹשְׁכֵי ... וְכַעֲבֹתוֹת
  english_pob_choice: those who drag ... and sin with cart ropes
  chosen_korean: 죄악을 끌어당기고 ... 죄를 끄는 자들
  alternatives_korean:
  - 죄악을 끌고 ... 죄를 끄는 자들
  - 죄악을 질질 끌고 ... 죄를 끌어오는 자들
  lexicon: HALOT
  rationale: משך의 지속적·강한 동작을 한국어 동사 ‘끌어당기다/끌다’로 살려, 죄를 능동적으로 짊어지고 끌고 가는 장면을 표현했습니다.
theological_decisions:
- issue: אָנּוֹת된 죄와 그것을 끌어오는 주체의 관계
  chosen_reading: 본문은 사람들이 죄악과 죄를 스스로 붙들고 끌고 가는 모습을 그려, 악에 대한 자발적이고 지속적인 집착을 드러냅니다.
  alternative_readings:
  - 죄를 끌어당긴다는 표현을 죄책이나 형벌을 스스로 불러들이는 뜻으로 읽을 수 있습니다.
  rationale: 즉각적인 시각 이미지는 ‘죄악’과 ‘죄’를 끌어당기는 행동 자체를 가장 자연스럽게 요구하므로, 해석을 미리 닫지 않고 원문이 지닌 긴장과 생동감을 유지했습니다.
  doctrine_reference: 번역 원칙 §3 (신학적 긴장을 해소하지 말고 보존)
