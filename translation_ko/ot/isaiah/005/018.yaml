  source_fidelity: 히브리어의 הוֹי, עָוֹן/חַטָּאָה의 구별, שָׁוְא의 넓은 의미 범위는 대체로 잘 반영되었습니다. 그러나 כַעֲבֹתוֹת의 비교 접두사 כ־와 עֲבֹתוֹת의 ‘굵은 밧줄’이라는 이미지는 현행 ‘수레의 줄로’에서 충분히 드러나지 않습니다.
  naturalness: ‘화 있으라’는 현대 표준어 합쇼체 본문으로는 다소 고어적이고 부자연스럽습니다. ‘…에게 화가 있습니다’가 예언적 선언의 어조를 유지하면서도 현대적이고 자연스럽습니다. 또한 ‘끌어당기고’보다 ‘끌고’가 줄과 밧줄의 물리적 비유에 더 직접적으로 맞습니다.
