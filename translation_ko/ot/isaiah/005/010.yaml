id: ISA.5.10
reference: Isaiah 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י עֲשֶׂ֨רֶת֙ צִמְדֵּי כֶ֔רֶם יַעֲשׂ֖וּ בַּ֣ת אֶחָ֑ת וְ/זֶ֥רַע חֹ֖מֶר יַעֲשֶׂ֥ה אֵיפָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/010.yaml
  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
  footnotes:
  - marker: a
    text: Or 'ten yokes of vineyard'; the Hebrew likely refers to the amount of land worked by ten yoke-pairs, not necessarily literal paired animals standing in the vineyard.
    reason: lexical_alternative
  - marker: b
    text: 'A bath was a liquid measure; an ephah was a dry measure. The point is severe agricultural scarcity: a large vineyard yields very little wine, and a large amount of seed yields only a small harvest.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 포도원 열 멍에쌍에서는[a] 한 바트만 나고, 한 호멜의 씨앗에서는 한 에바만 날 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포도원 열 멍에쌍’은 직역하면 포도원의 멍에쌍 열을 가리킵니다. 여기서는 멍에를 멘 소 한 쌍이 경작할 수 있는 포도원 면적 또는 그에 상응하는 분량을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 바트는 액량 단위이고, 에바는 곡물용 건량 단위입니다. 본문은 넓은 포도원과 많은 파종 씨앗에 비해 산출이 극히 적은 심각한 흉작을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 심판 선언에서 이어지는 결과를 자연스럽게 드러내되, 현대 한국어에서 문맥상 가장 매끄러운 연결어로 옮겼습니다.
- source_word: צִמְדֵּי כֶרֶם
  english_pob_choice: yoke-pairs of vineyard
  chosen_korean: 포도원 열 쌍의 소출
  alternatives_korean:
  - 포도원의 열 멍에쌍
  - 포도원 열 쌍의 포도원
  lexicon: HALOT
  rationale: צֶמֶד의 ‘한 쌍/멍에’ 이미지는 유지하되, 한국어에서는 직역형보다 농업적 산출을 뜻하는 ‘소출’로 풀어 의미를 분명히 했습니다.
- source_word: בַּת אֶחָת
  english_pob_choice: one bath
  chosen_korean: 한 바트
  alternatives_korean:
  - 한 밧
  - 한 액량 단위
  lexicon: HALOT
  rationale: 고대 액량 단위를 음역으로 보존하여 원문 특유의 대비를 살렸습니다.
- source_word: חֹמֶר ... אֵיפָה
  english_pob_choice: a homer of seed ... an ephah
  chosen_korean: 한 호멜의 씨 ... 한 에바
  alternatives_korean:
  - 한 고멜의 씨 ... 한 에바
  - 한 호멜 분량의 씨 ... 한 에바
  lexicon: HALOT
  rationale: 호멜과 에바를 음역으로 유지해 고대 부피 단위의 불균형을 드러냈고, ‘씨’는 원문의 זֶרַע를 따라 씨앗/파종 재료의 뜻을 살렸습니다.
theological_decisions:
- issue: 수량 대비의 극단적 흉작 표현
  chosen_reading: 큰 포도원 수확이 겨우 한 바트에 불과하고, 씨 한 호멜이 에바 한 됨으로 줄어드는 심판의 아이러니를 그대로 드러냈습니다.
  alternative_readings:
  - 현대 단위로 환산해 설명하는 방식
  - 의역해 단순히 ‘거의 거두지 못한다’고 하는 방식
  rationale: 본문의 핵심은 풍족해 보여도 실제 소출이 극도로 빈약해지는 심판의 역설이므로, 고대 단위를 보존해 충격과 대비를 유지했습니다.
  doctrine_reference: 예언서의 심판 오라클은 농경 언어를 통해 언약 위반의 결과를 가시적으로 드러냅니다.
