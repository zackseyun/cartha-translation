revisions:
- from: 그러므로 스올은 목구멍을 넓히고 입을 헤벌렸으며, 그곳의 화려함과 무리와 소란과 그 안에서 즐거워하는 자가 함께 내려갑니다.[a][b][c]
  to: 그러므로 스올[c]은 목구멍[a]을 넓히고 한없이[b] 입을 크게 벌렸으며, 그 도시의 화려함과 무리와 소란과 그 안에서 즐거워하는 자가 내려갑니다.
  rationale: 원문에서 누락된 לִבְלִי חֹק를 ‘한없이’로 복원하고, פָּעַר의 강한 동작은 장중한 현대 표준어인 ‘입을 크게 벌리다’로 옮겼습니다. 후반의 접미사가 가리키는 도시를 명시하여 스올과의 지시 혼동을 피했으며, 각주를 실제 해당 어휘에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:12Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 스올의 의인화와 열거되는 대상들이 내려가는 심판의 이미지를 대체로 보존합니다. 그러나 לִבְלִי חֹק(‘한없이/한계 없이’)에 해당하는 표현이 본문에서 빠져 있어 원문 의미가 누락되었습니다. 또한 후반의 여성 단수 접미사는 문맥상 도시를 가리키므로 ‘그곳’보다 ‘그 도시’가 지시 대상을 더 정확히 드러냅니다.
  naturalness: ‘입을 헤벌리다’는 현대 표준어이지만 다소 구어적이고 경멸적인 뉘앙스가 있어 장중한 예언 문체에 어울리지 않습니다. ‘입을 크게 벌리다’가 자연스럽고 원문의 강한 개구 이미지를 충분히 전달합니다. 합쇼체 종결 ‘내려갑니다’는 적절합니다.
  terminology: ‘스올’은 שְׁאוֹל의 고유한 지하세계 이미지를 보존하는 적절한 음역입니다. ‘목구멍’은 נֶפֶשׁ의 문맥적 신체 비유를 자연스럽게 옮깁니다. 각주 a는 본문의 해당 표현에, 각주 b는 ‘한없이’에, 문화 각주 c는 ‘스올’에 연결하도록 앵커를 바로잡았습니다.
  issues:
  - severity: high
    issue: ‘한없이/한계 없이’에 해당하는 לִבְלִי חֹק의 번역이 본문에 누락되었습니다.
    rationale: 초안에는 이 표현을 설명하는 각주 b만 있고 본문에는 대응 번역이 없어, 스올이 입을 제한 없이 벌린다는 원문의 강조가 사라집니다.
  - severity: medium
    issue: ‘입을 헤벌렸으며’의 문체와 뉘앙스가 부적절합니다.
    rationale: ‘헤벌리다’는 구어적이며 때로 흉한 모습을 연상시켜 예언시의 엄정한 문체보다 과도하게 낮은 어감을 냅니다. פָּעַר의 의미는 ‘입을 크게 벌리다’로 자연스럽게 보존됩니다.
  - severity: medium
    issue: 후반부 ‘그곳의’는 여성 단수 접미사의 문맥상 선행사인 도시를 불명확하게 합니다.
    rationale: ‘그곳’은 바로 앞의 스올을 가리키는 것으로도 읽힐 수 있습니다. 문화 각주와 영어 감사 기록이 전제하는 도시의 화려함·군중·소란을 명시하는 편이 안전합니다.
  - severity: low
    issue: 각주 앵커가 해당 본문 어휘와 연결되어 있지 않습니다.
    rationale: 어휘 대안 각주는 ‘목구멍’과 ‘한없이’에, 스올의 문화 설명은 ‘스올’에 붙여 독자가 각주 적용 대상을 알 수 있게 해야 합니다.
