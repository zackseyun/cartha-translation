id: ISA.5.14
reference: Isaiah 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן הִרְחִ֤יבָה שְּׁאוֹל֙ נַפְשָׁ֔/הּ וּ/פָעֲרָ֥ה פִ֖י/הָ לִ/בְלִי חֹ֑ק וְ/יָרַ֨ד הֲדָרָ֧/הּ וַ/הֲמוֹנָ֛/הּ וּ/שְׁאוֹנָ֖/הּ וְ/עָלֵ֥ז בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
  footnotes:
  - marker: a
    text: Or 'has enlarged its appetite' (literally, 'has enlarged its nephesh/soul').
    reason: lexical_alternative
  - marker: b
    text: '''Without measure'' may also be rendered ''without limit.'''
    reason: lexical_alternative
  - marker: c
    text: Sheol is the realm of the dead; here it is personified as opening its mouth to swallow the city's glory and revelers.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 스올은 목구멍을 넓히고 입을 헤벌렸으며, 그곳의 화려함과 무리와 소란과 그 안에서 즐거워하는 자가 함께 내려갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목구멍(식욕)을 넓혔다’로 옮길 수 있습니다. 원문은 문자적으로 ‘네페쉬/혼을 넓혔다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한없이’는 ‘한계 없이’ 또는 ‘절제 없이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 스올은 죽은 자들의 영역이며, 여기서는 도시의 영광과 향락하는 무리를 삼키도록 입을 벌리는 존재로 의인화되어 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְּׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 음부
  lexicon: HALOT
  rationale: 히브리어 지시어를 지워버리지 않기 위해 음역을 따랐습니다. 이 구절에서는 스올이 삼키는 존재로 의인화되므로, 일반어로 평준화하기보다 고유 개념을 유지하는 편이 원문 이미지에 더 가깝습니다.
- source_word: הִרְחִ֤יבָה ... נַפְשָׁ֔הּ
  english_pob_choice: has enlarged its throat
  chosen_korean: 목구멍을 넓히고
  alternatives_korean:
  - 식욕을 넓히고
  - 목을 벌리고
  - 영혼을 넓히고
  lexicon: HALOT
  rationale: 문자적으로는 ‘네페쉬’를 넓힌다는 표현이지만, 뒤의 ‘입을 열다’와 함께 삼키는 신체적 이미지를 이루므로 한국어에서는 ‘목구멍’을 택해 구체성을 살렸습니다.
- source_word: וּ/פָעֲרָ֥ה פִ֖י/הָ
  english_pob_choice: and opened its mouth
  chosen_korean: 입을 헤벌렸으며
  alternatives_korean:
  - 입을 크게 벌렸으며
  - 입을 열었으며
  - 입을 벌렸으며
  lexicon: HALOT
  rationale: פער의 강한 ‘벌어짐’과 포식적 분위기를 살리기 위해 단순한 ‘열다’보다 더 생생한 표현을 택했습니다. 다만 현대 한국어에서 과도하게 속되거나 낯설지 않도록 ‘헤벌리다’를 사용했습니다.
- source_word: לִ/בְלִי חֹ֑ק
  english_pob_choice: without measure
  chosen_korean: 한없이
  alternatives_korean:
  - 한계 없이
  - 절제 없이
  - 측량할 수 없이
  lexicon: HALOT
  rationale: ‘ḥoq’의 기본 뜻은 규정/한계이지만 여기서는 포위된 크기와 개방의 정도를 나타내므로, 영어 POB의 ‘without measure’에 맞춰 한국어 관용어로 압축했습니다.
- source_word: וְ/יָרַ֨ד ... וְ/עָלֵ֥ז בָּֽ/הּ
  english_pob_choice: go down
  chosen_korean: 함께 내려갑니다
  alternatives_korean:
  - 내려갑니다
  - 내려가고 있습니다
  - 떨어집니다
  lexicon: HALOT
  rationale: 결말부의 동사들을 한국어에서 자연스럽게 하나의 종결로 묶어, 심판의 확정성과 열거의 흐름을 살렸습니다. ‘내려갑니다’는 예언적 확정의 현재형 느낌도 유지합니다.
theological_decisions:
- issue: 스올의 의인화와 지시어 처리
  chosen_reading: 스올을 실제로 삼키는 존재처럼 의인화하여 번역하고, 그 고유 개념은 음역으로 보존했습니다.
  alternative_readings:
  - 무덤이
  - 죽음이
  - 저승이
  rationale: 이 절은 도시의 영광과 군중을 삼키는 스올의 포식적 이미지가 핵심이므로, 개념을 순화하면 심판의 공포와 시적 긴장이 약해집니다. 음역은 원문이 의도한 신학적·시적 충격을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
