translation:
  language: ko
  text: 만군의 야훼께서 내 귀에[a] 말씀하셨습니다. 「정녕 크고 좋은 많은 집들이 황폐해져, 거주하는 사람이 없게 될 것입니다.」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 귀에’는 이사야가 직접 들은 말씀이라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만군’은 히브리어 צְבָאוֹת의 전통적 대응으로, 하나님의 통치 아래 있는 하늘과 땅의 군세를 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
