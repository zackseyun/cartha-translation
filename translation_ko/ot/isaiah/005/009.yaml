reference: Isaiah 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם לֹ֞א בָּתִּ֤ים רַבִּים֙ לְ/שַׁמָּ֣ה יִֽהְי֔וּ גְּדֹלִ֥ים וְ/טוֹבִ֖ים מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'In my ears,' an idiom meaning that Isaiah heard this directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 귀에 만군의 야훼께서 말씀하셨습니다. 「정녕 많은 집이 황폐하게 되어, 크고 좋은 집들도 거기 거주하는 사람 없이 있게 될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 귀에’는 이사야가 직접 들은 말씀이라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만군’은 צְבָאוֹת의 전통적 대응으로, 하나님의 통치 아래 있는 하늘과 땅의 군세를 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנַי
  english_pob_choice: In my ears
  chosen_korean: 내 귀에
  alternatives_korean:
  - 내가 들었습니다
  - 내 귀로 들었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 직접 들은 계시의 현장감을 유지했습니다. 한국어에서는 자연스럽게 ‘내 귀에’로 옮기되, 이어지는 ‘말씀하셨습니다’로 의미를 분명히 했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: 신명기적 고유명사 יְהוָה는 본 역본 기본어인 ‘야훼’로, צְבָאוֹת는 전통적 ‘만군’으로 옮겨 군대/우주의 통치권을 함께 드러냈습니다.
- source_word: לְשַׁמָּה יִהְיוּ
  english_pob_choice: will become a desolation
  chosen_korean: 황폐하게 되어
  alternatives_korean:
  - 황무지가 되어
  - 황폐가 될 것이며
  lexicon: HALOT
  rationale: 명사형 ‘황폐/황무’의 결과 상태를 살리면서 한국어 문장 흐름에 맞게 ‘되다’로 풀었습니다.
- source_word: גְּדֹלִים וְטוֹבִים
  english_pob_choice: great and good houses
  chosen_korean: 크고 좋은 집들도
  alternatives_korean:
  - 크고 훌륭한 집들도
  - 크고 아름다운 집들도
  lexicon: HALOT
  rationale: 크기와 질적 평가를 직역하되, ‘좋은’은 본문이 말하는 번영과 가치의 평가를 과장 없이 반영합니다.
- source_word: מֵאֵין יוֹשֵׁב
  english_pob_choice: without inhabitant
  chosen_korean: 거기 거주하는 사람 없이
  alternatives_korean:
  - 거주자 없이
  - 사는 이 없이
  lexicon: HALOT
  rationale: ‘inhabitant’의 무인(無人) 상태를 한국어에서 가장 자연스럽고 분명하게 풀어, 집이 비게 되는 심판의 결과를 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사 ארבע-letter divine name을 대체 호칭으로 흐리지 않고, 본 프로젝트 기본 원칙에 따라 고유명사 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 서술체와 직접 인용문의 문체
  chosen_reading: 서술은 합쇼체, 인용문은 예언 선언의 직접성에 맞춘 평서형
  alternative_readings:
  - 모두 같은 문체로 평준화
  - 인용문을 간접화
  rationale: ‘내 귀에… 말씀하셨습니다’는 예언자가 직접 들은 계시를 드러내므로, 인용문은 예언적 선언의 힘을 살리는 평서형으로 유지했습니다.
  doctrine_reference: 문체·화자 구분 원칙
