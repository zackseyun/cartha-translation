  lexicon: HALOT
  rationale: 신명기적 고유명사 יְהוָה는 본 역본 기본어인 ‘야훼’로, צְבָאוֹת는 전통적 ‘만군’으로 옮겨 군대/우주의 통치권을 함께 드러냈습니다.
- source_word: לְשַׁמָּה יִהְיוּ
