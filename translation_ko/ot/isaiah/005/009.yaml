  - 황폐가 될 것이며
  lexicon: HALOT
  rationale: 명사형 ‘황폐/황무’의 결과 상태를 살리면서 한국어 문장 흐름에 맞게 ‘되다’로 풀었습니다.
- source_word: גְּדֹלִים וְטוֹבִים
  english_pob_choice: great and good houses
  chosen_korean: 크고 좋은 집들도
  alternatives_korean:
