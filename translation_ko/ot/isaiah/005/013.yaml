id: ISA.5.13
reference: Isaiah 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
  footnotes:
  - marker: a
    text: Or 'their nobles'; Hebrew literally 'his glory, men of hunger,' likely referring to the honored or prominent people of the nation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 백성은 지식이 없으므로 포로가 되어 떠납니다. 그들의 존귀한 이들은 굶주림[a]으로 죽어 가고, 그들의 무리는 목마름으로 바짝 마릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 귀인들’. 히브리어는 문자적으로 ‘그의 영광, 기근의 사람들’이며, 문맥상 그 나라의 존귀하거나 두드러진 사람들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞선 책망의 결과를 잇는 결론 표지로 기능하므로, 예언 문맥의 인과를 분명히 하는 '그러므로'가 가장 자연합니다.
- source_word: גָּלָה
  english_pob_choice: go into exile
  chosen_korean: 포로로 끌려갑니다
  alternatives_korean:
  - 포로로 갑니다
  - 유배됩니다
  - 포로가 됩니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 이동이 아니라 포로가 되어 떠나는 함의를 가지므로, 현대 한국어에서 그 결과를 분명히 드러내는 표현을 택했습니다.
- source_word: מִבְּלִי דָעַת
  english_pob_choice: for lack of knowledge
  chosen_korean: 지식이 없어서
  alternatives_korean:
  - 지식이 부족해서
  - 알지 못해서
  - 지식 없이
  lexicon: HALOT
  rationale: 원문의 결핍 원인을 자연스럽게 옮기되, 단순 정보 부족보다 예언적·언약적 '지식'의 부재를 살리기 위해 '지식'을 유지했습니다.
- source_word: כְבוֹדוֹ
  english_pob_choice: their honored men
  chosen_korean: 그들의 존귀한 자들
  alternatives_korean:
  - 그들의 귀인들
  - 그들의 귀한 사람들
  - 그들의 고귀한 자들
  lexicon: HALOT
  rationale: 직역의 '그의 영광'보다는 문맥상 사회적으로 높임을 받는 사람들을 가리키므로, 의미를 드러내는 '존귀한 자들'로 옮겼습니다.
- source_word: מְתֵי רָעָב
  english_pob_choice: are dying of hunger
  chosen_korean: 굶주림으로 죽어 가고
  alternatives_korean:
  - 굶주림으로 죽고
  - 굶주린 자들이 되고
  - 배고픔으로 죽어 가고
  lexicon: HALOT
  rationale: 히브리어의 '배고픔의 사람들'이라는 관용을 한국어에서 자연스럽게 풀어, 극심한 기근의 상태를 유지했습니다.
- source_word: צִחֵה צָמָא
  english_pob_choice: is parched with thirst
  chosen_korean: 목마름으로 바짝 마릅니다
  alternatives_korean:
  - 갈증으로 바짝 마릅니다
  - 목말라 바싹 마릅니다
  - 갈증으로 말라 갑니다
  lexicon: HALOT
  rationale: 원문의 강한 건조 이미지와 갈증의 중첩을 살리기 위해, 상태 동사와 결과를 함께 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: 예언적 '지식'의 범위
  chosen_reading: 지식을 단순 정보가 아니라 하나님을 아는 언약적·도덕적 인식까지 포함하는 표현으로 유지했습니다.
  alternative_readings:
  - 이해
  - 인식
  - 무지
  rationale: 히브리어 דַּעַת의 의미 범위를 좁히지 않고, 심판의 이유가 단순 무지라기보다 하나님과 언약을 아는 지식의 결핍임을 보존합니다.
  doctrine_reference: Translation philosophy §3
