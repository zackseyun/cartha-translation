base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
  footnotes:
  - marker: a
    text: Or 'and it will become fit for burning' / 'and it will be consumed.' The Hebrew expression is literally 'and it will be for burning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and it will become a trampling place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자, 이제 내가 내 포도원에 무엇을 할지 너희에게 알려 주겠습니다. 나는 그 울타리를 없애 버리겠습니다. 그러면 그 포도원은 불타게 될 것입니다.[a] 나는 그 담을 헐어 버리겠습니다. 그러면 그 포도원은 짓밟히게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불타게 될 것입니다’는 히브리어의 문자적 표현으로는 ‘불타기 위한 것이 될 것이다’에 해당합니다. 달리 ‘불에 소비될 것이다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘짓밟히는 곳이 될 것이다’라고 표현합니다.
    reason: lexical_alternative
