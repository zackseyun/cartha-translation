source:
  edition: WLC
  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
  footnotes:
  - marker: a
    text: Or 'and it will become fit for burning' / 'and it will be consumed.' The Hebrew expression is literally 'and it will be for burning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and it will become a trampling place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 내 포도원에 대해 무엇을 할지 너희에게 알려 주겠다. 나는 그 울타리를 없앨 것이며, 그것은 불탈 것이고, 그 담을 헐 것이며, 그것은 짓밟힐 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불탈 것이고’는 히브리어의 문자적 표현 ‘타기 위한 것/불타기 위한 것’에 해당하는 결과를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘담’은 문자적으로는 ‘둘레담/담장’에 가까우며, 또 다른 옮김으로는 ‘허물다’ 또는 ‘무너뜨리다’가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 담화 전환과 시간적 진전을 자연스럽게 드러내는 표준어로 옮겼습니다.
- source_word: אוֹדִיעָה נָּא
  english_pob_choice: please let me tell you
  chosen_korean: 내가 … 알려 주겠다
  alternatives_korean:
  - 내가 … 말씀드리겠다
  - 내가 … 알게 하겠다
  lexicon: HALOT
  rationale: 히필의 ‘알리다/알게 하다’ 의미를 살리되, נָא의 청유·정중함은 한국어의 완곡한 서술로 반영했습니다.
- source_word: לְכַרְמִי
  english_pob_choice: to my vineyard
  chosen_korean: 내 포도원
  alternatives_korean:
  - 내 포도밭
  - 나의 포도원
  lexicon: HALOT
  rationale: 예언적 비유를 유지하면서도 자연스러운 소유 표현으로 옮겼습니다.
- source_word: מְשׂוּכָּתוֹ
  english_pob_choice: its hedge
  chosen_korean: 그 울타리
  alternatives_korean:
  - 그 울타리나 담장
  - 그 덤불 울타리
  lexicon: HALOT
  rationale: 포도원을 둘러싼 보호 장치를 뜻하는 말로, 한국어에서 가장 넓고 자연스러운 ‘울타리’를 택했습니다.
- source_word: לְבָעֵר
  english_pob_choice: it will be burned
  chosen_korean: 불탈 것이고
  alternatives_korean:
  - 불에 탈 것이고
  - 태워질 것이고
  lexicon: HALOT
  rationale: 문자적 ‘burning’의 결과를 간결하게 살리면서, 포도원 이미지에 맞는 재난적 뉘앙스를 보존했습니다.
- source_word: גְּדֵרוֹ
  english_pob_choice: its wall
  chosen_korean: 그 담
  alternatives_korean:
  - 그 벽
  - 그 둘레담
  lexicon: HALOT
  rationale: 앞의 ‘울타리’와 구별되는 더 단단한 외곽 구조를 드러내기 위해 ‘담’을 사용했습니다.
- source_word: לְמִרְמָס
  english_pob_choice: trampled down
  chosen_korean: 짓밟힐 것이다
  alternatives_korean:
  - 밟혀 뭉개질 것이다
  - 밟혀 다져질 것이다
  lexicon: HALOT
  rationale: 명사적 ‘밟음/짓밟음’의 결과를 한국어의 수동적 미래로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 포도원 비유의 해석을 본문에 직접 주입할지 여부
  chosen_reading: 본절에서는 포도원 이미지만 유지하고, 그 상징적 지시대상은 본문 밖에서 읽히도록 두었습니다.
  alternative_readings:
  - 포도원을 유다/이스라엘로 본문에 풀어 쓰기
  rationale: 예언의 심판 선언이 이미지 자체로 힘 있게 전달되도록 하여, 본문의 비유성과 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
