  lexicon: HALOT
  rationale: 명사적 ‘밟음/짓밟음’의 결과를 한국어의 수동적 미래로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 포도원 비유의 해석을 본문에 직접 주입할지 여부
  chosen_reading: 본절에서는 포도원 이미지만 유지하고, 그 상징적 지시대상은 본문 밖에서 읽히도록 두었습니다.
  alternative_readings:
  - 포도원을 유다/이스라엘로 본문에 풀어 쓰기
  rationale: 예언의 심판 선언이 이미지 자체로 힘 있게 전달되도록 하여, 본문의 비유성과 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
