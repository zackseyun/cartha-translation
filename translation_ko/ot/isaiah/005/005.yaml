revisions:
- from: 이제 내가 내 포도원에 대해 무엇을 할지 너희에게 알려 주겠다. 나는 그 울타리를 없앨 것이며, 그것은 불탈 것이고, 그 담을 헐 것이며, 그것은 짓밟힐 것이다.[a][b]
  to: 자, 이제 내가 내 포도원에 무엇을 할지 너희에게 알려 주겠습니다. 나는 그 울타리를 없애 버리겠습니다. 그러면 그 포도원은 불타게 될 것입니다.[a] 나는 그 담을 헐어 버리겠습니다. 그러면 그 포도원은 짓밟히게 될 것입니다.[b]
  rationale: 본문을 현대 합쇼체로 통일하고, 포도원이 파괴와 짓밟힘의 대상임을 분명히 했습니다. 울타리와 담이라는 두 보호 구조의 구별, 그리고 심판의 포도원 비유는 유지했습니다. 각주 표지를 해당 어구에 각각 연결하고, b 각주를 לְמִרְמָס의 실제 대안만 설명하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
