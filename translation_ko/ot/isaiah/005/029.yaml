  rationale: 연속 동작을 한국어 시상으로 자연스럽게 묶되, טֶרֶף의 ‘먹이’와 יַפְלִיט의 ‘빼앗아/데려가’ 뉘앙스를 함께 드러내기 위해 ‘움켜쥐고 낚아채 가며’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절구의 무기력한 결말
  chosen_reading: ‘구해 낼 자가 없습니다’로 마무리하여, 포식 행위의 완결성과 완전한 무력함을 함께 드러냈습니다.
  alternative_readings:
  - ‘구원할 자가 없습니다’
  - ‘건져 낼 자가 없습니다’
  rationale: 히브리어의 ‘אין מציל’은 단순한 부재 선언이므로, 구출의 불가능성을 직접적이고 간결하게 표현하는 쪽이 문맥상 더 강합니다.
  doctrine_reference: 문학적-예언적 심판 묘사
- issue: 동물 비유의 누적 강도
  chosen_reading: ‘으르렁거림… 젊은 사자들처럼 으르렁거리며’로 반복을 살려, 위협이 점점 고조되는 이미지를 유지했습니다.
  alternative_readings:
  - 반복을 줄여 한 번만 ‘으르렁거림’으로 처리
  - ‘포효’와 ‘으르렁거림’을 섞어 완화
  rationale: 본문은 사자 이미지의 음성·행동을 연쇄적으로 반복하므로, 한국어에서도 반복을 보존하는 것이 원문의 수사 효과에 더 충실합니다.
  doctrine_reference: 예언서의 시적 병행법
