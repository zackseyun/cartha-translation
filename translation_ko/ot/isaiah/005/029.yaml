  source_fidelity: 원문의 세 가지 음향 동작(שאגה, ושאג, וינהם)을 구별해야 합니다. 초안은 첫 두 표현을 모두 ‘으르렁거리다’로 옮기고, 이어지는 וינהם의 별도 동작을 누락했습니다. 또한 남성 단수 접미사는 앞 문맥의 침공 세력을 가리키므로 한국어에서는 비인격적 집합체에 맞는 ‘그것의/그것은’이 더 정확합니다.
  naturalness: 초안의 긴 대시와 ‘…가며, 구해 낼 자가 없습니다’의 연결은 문장 구조가 어색합니다. 절들을 병렬로 연결하고 마지막을 합쇼체 종결로 처리하면 현대 표준어의 예언시 문체로 자연스럽습니다.
  terminology: שאגה와 ושאג에는 ‘포효’를, וינהם에는 낮은 소리를 나타내는 ‘으르렁거리다’를 사용했습니다. טרף는 ‘먹이’, אין מציל은 ‘구해 낼 자가 없습니다’로 유지했습니다. לביא의 성별이 문맥상 논쟁될 수 있다는 각주는 보존했습니다.
