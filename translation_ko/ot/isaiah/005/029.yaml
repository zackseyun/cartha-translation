source:
  edition: WLC
  text: שְׁאָגָ֥ה ל֖/וֹ כַּ/לָּבִ֑יא ו/שאג כַּ/כְּפִירִ֤ים וְ/יִנְהֹם֙ וְ/יֹאחֵ֣ז טֶ֔רֶף וְ/יַפְלִ֖יט וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
  footnotes:
  - marker: a
    text: Or 'like a lioness' for 'like a lion'; the Hebrew term can be understood more specifically in some contexts, though 'lion' fits the parallelism here.
    reason: lexical_alternative
  - marker: b
    text: Or 'drags it away' / 'escapes with it' for 'carries it off'; the Hebrew verb suggests taking the prey away beyond recovery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 으르렁거림은 사자 같고, 젊은 사자들처럼 으르렁거리며 — 먹이를 움켜쥐고 낚아채 가며, 구해 낼 자가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사자’는 이 문맥에서 ‘암사자’로도 이해될 수 있으나, 평행구조상 일반적인 ‘사자’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낚아채 가며’는 ‘carry it off’의 의미를 살린 것으로, 본문은 탈취된 먹이가 되돌려지지 않는다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה
  english_pob_choice: roaring
  chosen_korean: 으르렁거림
  alternatives_korean:
  - 포효
  - 울부짖음
  lexicon: HALOT
  rationale: 명사형으로 시작하는 시적 병렬을 살리면서도, 포식자의 낮고 위협적인 소리를 나타내는 한국어로 ‘으르렁거림’이 가장 자연스럽습니다.
- source_word: כַּלָּבִיא
  english_pob_choice: like a lion
  chosen_korean: 사자 같고
  alternatives_korean:
  - 암사자 같고
  - 사자처럼
  lexicon: HALOT
  rationale: 영어 POB처럼 여기서는 일반적인 ‘사자’가 평행법을 가장 분명하게 살리며, ‘암사자’로 좁히는 해석은 본문만으로는 필수적이지 않습니다.
- source_word: כַּכְּפִירִים
  english_pob_choice: like young lions
  chosen_korean: 젊은 사자들처럼
  alternatives_korean:
  - 새끼 사자들처럼
  - 어린 사자들처럼
  lexicon: HALOT
  rationale: כְּפִירִים은 힘이 있는 어린 사자들을 가리키므로, ‘젊은 사자들’이 포식적 힘을 가장 잘 전달합니다.
- source_word: וְיֹאחֵז טֶרֶף וְיַפְלִיט
  english_pob_choice: and seizes prey, and carries it off
  chosen_korean: 먹이를 움켜쥐고 낚아채 가며
  alternatives_korean:
  - 먹이를 붙잡고 빼앗아 가며
  - 먹이를 잡아채서 데려가며
  lexicon: HALOT
  rationale: 연속 동작을 한국어 시상으로 자연스럽게 묶되, טֶרֶף의 ‘먹이’와 יַפְלִיט의 ‘빼앗아/데려가’ 뉘앙스를 함께 드러내기 위해 ‘움켜쥐고 낚아채 가며’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절구의 무기력한 결말
  chosen_reading: ‘구해 낼 자가 없습니다’로 마무리하여, 포식 행위의 완결성과 완전한 무력함을 함께 드러냈습니다.
  alternative_readings:
  - ‘구원할 자가 없습니다’
  - ‘건져 낼 자가 없습니다’
  rationale: 히브리어의 ‘אין מציל’은 단순한 부재 선언이므로, 구출의 불가능성을 직접적이고 간결하게 표현하는 쪽이 문맥상 더 강합니다.
  doctrine_reference: 문학적-예언적 심판 묘사
- issue: 동물 비유의 누적 강도
  chosen_reading: ‘으르렁거림… 젊은 사자들처럼 으르렁거리며’로 반복을 살려, 위협이 점점 고조되는 이미지를 유지했습니다.
  alternative_readings:
  - 반복을 줄여 한 번만 ‘으르렁거림’으로 처리
  - ‘포효’와 ‘으르렁거림’을 섞어 완화
  rationale: 본문은 사자 이미지의 음성·행동을 연쇄적으로 반복하므로, 한국어에서도 반복을 보존하는 것이 원문의 수사 효과에 더 충실합니다.
  doctrine_reference: 예언서의 시적 병행법
