  rationale: 히브리어는 단수 대명사를 쓰지만 문맥상 소집된 군대 전체를 가리키므로, 한국어에서는 독자가 오해하지 않도록 집합적 의미를 우선 반영했습니다.
  doctrine_reference: 본문 맥락 주해
