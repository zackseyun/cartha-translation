source:
  edition: WLC
  text: אֵין עָיֵ֤ף וְ/אֵין כּוֹשֵׁל֙ בּ֔/וֹ לֹ֥א יָנ֖וּם וְ/לֹ֣א יִישָׁ֑ן וְ/לֹ֤א נִפְתַּח֙ אֵז֣וֹר חֲלָצָ֔י/ו וְ/לֹ֥א נִתַּ֖ק שְׂר֥וֹךְ נְעָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
  footnotes:
  - marker: a
    text: Literally, 'in him/it'; the Hebrew uses a singular pronoun with a collective referent, referring to the invading force as a whole.
    reason: lexical_alternative
  - marker: b
    text: Or 'the belt of his loins is not opened.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들[a] 가운데에는 피곤한 사람도 없고 비틀거리는 사람도 없으며, 아무도 졸거나 잠들지 않습니다. 그들의 허리띠는 풀리지 않으며[b], 그들의 샌들 끈도 끊어지지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 단수 대명사를 쓰지만, 문맥상 소집된 침략군 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 허리의 띠가 열리지 않는다.’ 히브리어의 ‘열리다’는 여기서 띠가 풀리거나 느슨해지는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין עָיֵף
  english_pob_choice: None among them is weary
  chosen_korean: 그들 가운데에는 피곤한 이도 없고
  alternatives_korean:
  - 지친 이도 없고
  - 쇠약한 이도 없고
  lexicon: HALOT
  rationale: עָיֵף는 전투·행진 맥락에서의 육체적 피곤함을 가리키므로, 현대 한국어에서는 가장 자연스러운 ‘피곤한’으로 옮겼습니다. POB의 집합적 표현 ‘among them’은 ‘그들 가운데에는’으로 살렸습니다.
- source_word: כּוֹשֵׁל
  english_pob_choice: stumbles
  chosen_korean: 비틀거리는 이도 없으며
  alternatives_korean:
  - 넘어지는 이도 없으며
  - 흔들리는 이도 없으며
  lexicon: HALOT
  rationale: כּוֹשֵׁל은 단순한 실수가 아니라 걸음이 흔들리며 무너지듯 나아가는 모습을 가리키므로, 문맥에 맞게 ‘비틀거리는’으로 옮겼습니다.
- source_word: יָנוּם / יִישָׁן
  english_pob_choice: slumbers or sleeps
  chosen_korean: 졸지도 않고 잠들지도 않습니다
  alternatives_korean:
  - 선잠 들지도 않고 잠들지도 않습니다
  - 졸지도 않고 자지도 않습니다
  lexicon: HALOT
  rationale: 두 동사의 평행을 한국어에서도 구분해 살리기 위해 ‘졸다’와 ‘잠들다’를 대응시켰습니다. ‘졸다’는 잠이 스미는 상태, ‘잠들다’는 본격적인 수면 진입을 나타내어 원문의 중첩을 보존합니다.
- source_word: אֵזוֹר חֲלָצָיו
  english_pob_choice: the belt at his waist is not loosened
  chosen_korean: 그의 허리띠는 풀리지 않고
  alternatives_korean:
  - 그의 허리띠는 느슨해지지 않고
  - 그의 띠는 허리에서 풀리지 않고
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 띠/벨트이고, חֲלָצָיו는 몸의 허리·허벅지 윗부분을 가리키므로, 자연스러운 현대어로 ‘허리띠’와 ‘풀리지’로 압축했습니다.
- source_word: שְׂרוֹךְ נְעָלָיו
  english_pob_choice: the strap of his sandals is not broken
  chosen_korean: 그의 샌들 끈도 끊어지지 않습니다
  alternatives_korean:
  - 그의 신발끈도 끊어지지 않습니다
  - 그의 샌들 끈도 풀리지 않습니다
  lexicon: HALOT
  rationale: שְׂרוֹךְ는 신발의 매는 끈, נְעָלָיו는 고대식 발신으로 ‘샌들’이 가장 구체적입니다. ‘끊어지지 않습니다’는 POB의 ‘is not broken’을 직역하지 않으면서도 끈이 손상되지 않은 상태를 분명히 드러냅니다.
theological_decisions:
- issue: 집합적 단수 대명사 בּוֹ의 처리
  chosen_reading: ‘그들 가운데에는’으로 옮겨, 단수 형태이지만 전체 침략군을 가리키는 집합적 참조를 드러냈습니다.
  alternative_readings:
