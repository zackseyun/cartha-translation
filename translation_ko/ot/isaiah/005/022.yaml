  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
  footnotes:
  - marker: a
    text: Or 'mighty men' for 'heroes'; the Hebrew term often refers to warriors or powerful men, but here it is used ironically of drinking prowess.
    reason: lexical_alternative
  - marker: b
    text: Or 'men of valor.' The phrase commonly denotes capable or valiant men, here applied sarcastically to those skilled in preparing intoxicating drink.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주 마시는 데 영웅인 자들, 독한 술 섞는 데 힘센 사람들에게 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּבּוֹרִים는 보통 '용사들'이나 '힘센 자들'을 뜻하지만, 여기서는 술 마시는 솜씨를 빗대어 아이러니하게 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אַנְשֵׁי חַיִל은 보통 '용사'나 '유능한 사람들'을 뜻하지만, 여기서는 독한 술을 섞는 데 능한 사람들을 가리키는 역설적 표현입니다.
    reason: lexical_alternative
