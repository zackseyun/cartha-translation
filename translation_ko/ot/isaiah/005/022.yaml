source:
  edition: WLC
  text: ה֕וֹי גִּבּוֹרִ֖ים לִ/שְׁתּ֣וֹת יָ֑יִן וְ/אַנְשֵׁי חַ֖יִל לִ/מְסֹ֥ךְ שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
  footnotes:
  - marker: a
    text: Or 'mighty men' for 'heroes'; the Hebrew term often refers to warriors or powerful men, but here it is used ironically of drinking prowess.
    reason: lexical_alternative
  - marker: b
    text: Or 'men of valor.' The phrase commonly denotes capable or valiant men, here applied sarcastically to those skilled in preparing intoxicating drink.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주 마시는 데 영웅인 자들, 독한 술 섞는 데 힘센 사람들에게 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּבּוֹרִים는 보통 '용사들'이나 '힘센 자들'을 뜻하지만, 여기서는 술 마시는 솜씨를 빗대어 아이러니하게 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אַנְשֵׁי חַיִל은 보통 '용사'나 '유능한 사람들'을 뜻하지만, 여기서는 독한 술을 섞는 데 능한 사람들을 가리키는 역설적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֕וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프도다
  - 아, 불행합니다
  - 화 있으라
  lexicon: HALOT
  rationale: 예언적 경고와 심판 선언의 기능을 살리되, 현대 한국어의 자연스러운 합쇼체로 옮겼습니다.
- source_word: גִּבּוֹרִ֖ים
  english_pob_choice: heroes
  chosen_korean: 영웅인 자들
  alternatives_korean:
  - 용사들
  - 힘센 자들
  - 무용한 자들
  lexicon: HALOT
  rationale: 문맥상 실제 무공이 아니라 술에 능한 점을 아이러니하게 칭하는 표현이므로, POB의 'heroes'에 맞춰 역설을 살렸습니다.
- source_word: לִ/שְׁתּ֣וֹת יָ֑יִן
  english_pob_choice: at drinking wine
  chosen_korean: 포도주 마시는 데
  alternatives_korean:
  - 포도주를 마시는 데
  - 포도주를 마시기에
  - 포도주를 마실 때
  lexicon: HALOT
  rationale: ל+부정사는 어떤 영역에서 뛰어난지를 나타내므로, 한국어에서는 '…하는 데'로 자연스럽게 살렸습니다.
- source_word: שֵׁכָֽר
  english_pob_choice: strong drink
  chosen_korean: 독한 술
  alternatives_korean:
  - 강한 술
  - 독주
  - 취하게 하는 술
  lexicon: HALOT
  rationale: 단순한 술이 아니라 취하게 하는 음료라는 점을 드러내면서, 구체적 주종을 과도하게 좁히지 않도록 했습니다.
theological_decisions:
- issue: 예언적 '화'의 어조
  chosen_reading: 심판 선언으로서의 예언적 경고를 유지하되, 현대 한국어에서는 '화가 있습니다'로 풀어 직접적 저주감보다 경고성을 살렸습니다.
  alternative_readings:
  - 슬프도다
  - 저주가 있습니다
  - 화 있으라
  rationale: 히브리어 הוֹי는 애가와 심판 선포를 겸하지만, 이 문맥에서는 도덕적 비난과 심판 선언이 핵심이므로 그 기능을 보존했습니다.
  doctrine_reference: 예언서의 심판 신탁
