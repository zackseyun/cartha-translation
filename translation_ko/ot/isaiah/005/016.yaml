  verdict: revise
  source_fidelity: 첫 절의 ‘만군의 야훼께서는 공의로 높임을 받으시며’는 וַיִּגְבַּה ... בַּמִּשְׁפָּט을 충실히 옮깁니다. 그러나 נִקְדָּשׁ는 니팔형으로 하나님의 거룩하심이 의로움 가운데 공적으로 드러나거나 인정되는 뜻입니다. 초안의 ‘거룩함을 드러내십니다’도 문맥상 가능한 해석적 표현이지만, ‘거룩하심’이라는 존칭 명사와 ‘의로’라는 원문의 추상명사를 사용하면 더 정확하고 자연스럽습니다.
  naturalness: ‘거룩하신 하나님’과 ‘의로우심으로’의 결합은 다소 중복되고 설명적인 인상을 줍니다. ‘거룩하신 하나님은 의로 거룩하심을 드러내십니다’는 현대 표준어 합쇼체로 자연스럽고, 두 절의 시적 병행도 유지합니다.
  terminology: ‘만군의 야훼’, ‘공의’, ‘의’, ‘거룩하심’은 적절합니다. מִשְׁפָּט와 צְדָקָה의 구별은 ‘공의’와 ‘의’로 보존합니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
  issues:
