id: ISA.5.16
reference: Isaiah 5:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
  footnotes:
  - marker: a
    text: Or 'in judgment.' The Hebrew מִשְׁפָּט can denote either justice in principle or judicial judgment in action.
    reason: lexical_alternative
  - marker: b
    text: Or 'is sanctified' or 'is shown holy.' The sense is that God’s holiness is manifested or vindicated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만군의 야훼께서는 공의로 높임을 받으시며, 거룩하신 하나님은 의로우심으로 거룩함을 드러내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공의로’는 여기서 המשפט의 넓은 의미를 반영한 번역입니다. 문맥상 ‘심판으로’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩함을 드러내십니다’는 נִקְדָּשׁ의 수동형이 가리키는 ‘거룩하심이 드러나고 인정됨’을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주님
  lexicon: HALOT
  rationale: 이 절의 신명호칭은 텍스트가 가진 고유명을 살려 ‘야훼’로 옮기고, צְבָאוֹת는 하나님의 위엄과 광범위를 드러내는 관용 표현인 ‘만군의’로 옮겼습니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: in justice
  chosen_korean: 공의로
  alternatives_korean:
  - 판결로
  - 심판으로
  - 의로
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 법정 행위보다 하나님의 공정한 판결과 통치 질서를 함께 가리키므로, 한국어에서는 ‘공의로’가 문맥을 가장 자연스럽게 살립니다.
- source_word: נִקְדָּשׁ
  english_pob_choice: is shown holy
  chosen_korean: 거룩함을 드러내십니다
  alternatives_korean:
  - 거룩하게 되십니다
  - 거룩하심이 입증되십니다
  - 성결하게 되십니다
  lexicon: HALOT
  rationale: נִקְדָּשׁ의 수동형은 하나님이 새로 거룩해지신다는 뜻이 아니라 거룩하심이 공개적으로 드러나고 인정된다는 뜻이므로, 그 의미를 한국어 동사로 풀어 옮겼습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의로우심으로
  alternatives_korean:
  - 의로움으로
  - 의로
  - 공의로
  lexicon: HALOT
  rationale: 두 번째 절구는 첫 절의 מִשְׁפָּט과 어휘적으로 대응하는 צְדָקָה이므로, 결과적 상태보다 하나님의 성품을 나타내는 ‘의로우심’으로 살렸습니다.
theological_decisions:
- issue: 하나님의 거룩함이 ‘성결해짐’처럼 들릴 위험
  chosen_reading: 거룩함을 드러내십니다
  alternative_readings:
  - 거룩하게 되십니다
  - 거룩하게 되심이 입증됩니다
  rationale: 본문의 נִקְדָּשׁ는 하나님의 본질이 변한다는 뜻이 아니라 심판과 의로움 속에서 그 거룩하심이 드러나고 변호된다는 뜻이므로, 오해를 피하면서도 수동적 의미를 보존했습니다.
  doctrine_reference: 성경 본문 번역 원칙 §2, §4
- issue: מִשְׁפָּט와 צְדָקָה의 평행을 한국어에서 어떻게 구분할지
  chosen_reading: 공의 ... 의로우심
  alternative_readings:
  - 심판 ... 의
  - 공의 ... 공의
  rationale: 두 용어를 같은 말로 평면화하면 시적 평행과 의미의 결이 사라지므로, 하나는 하나님의 공정한 판결 질서를, 다른 하나는 그분의 의로운 성품을 드러내는 말로 구분했습니다.
  doctrine_reference: 성경 본문 번역 원칙 §5
