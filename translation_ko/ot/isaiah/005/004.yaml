id: ISA.5.4
reference: Isaiah 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה לַּ/עֲשׂ֥וֹת עוֹד֙ לְ/כַרְמִ֔/י וְ/לֹ֥א עָשִׂ֖יתִי בּ֑/וֹ מַדּ֧וּעַ קִוֵּ֛יתִי לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
  footnotes:
  - marker: a
    text: Or 'worthless grapes' or 'foul fruit'; the Hebrew term refers to bad, unusable fruit.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 포도원에 아직도 더 해야 할 일이 무엇이 있겠습니까? 내가 그것에 아무것도 하지 않았다는 말입니까? 어찌하여 내가 포도를 맺을 것으로 기대하였는데, 그것이 들포도를 맺었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓸모없는 포도’나 ‘썩은 열매’일 수 있습니다. 히브리어는 나쁘고 사용할 수 없는 열매를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  english_pob_choice: What more was there to do
  chosen_korean: 아직도 더 해야 할 일이 무엇이 있겠습니까?
  alternatives_korean:
  - 무엇을 더 해야 했겠습니까?
  - 더 할 수 있는 일이 무엇이 있었겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 압박감을 살리면서, 완료되지 않은 가능성을 한국어 합쇼체로 자연스럽게 표현했습니다.
- source_word: לְכַרְמִי
  english_pob_choice: for my vineyard
  chosen_korean: 내 포도원에
  alternatives_korean:
  - 내 포도원을 위해
  - 내 포도원에 대하여
  lexicon: HALOT
  rationale: לְ의 유익/대상 뉘앙스를 한국어에서 가장 자연스럽게 담아, 포도원 자체를 대상으로 한 돌봄의 의미를 유지했습니다.
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  english_pob_choice: that I have not done in it
  chosen_korean: 내가 그것에 아무것도 하지 않았다는 말입니까?
  alternatives_korean:
  - 내가 그 안에서 하지 않은 것이 있습니까?
  - 내가 그것 안에 하지 않은 일이 있습니까?
  lexicon: HALOT
  rationale: 히브리어의 부정적 수사문을 한국어에서는 반문으로 옮겨, ‘아무것도 남기지 않았다’는 의미를 분명하게 전달했습니다.
- source_word: בְּאֻשִׁים
  english_pob_choice: wild grapes
  chosen_korean: 들포도
  alternatives_korean:
  - 쓸모없는 포도
  - 나쁜 포도
  - 썩은 열매
  lexicon: HALOT
  rationale: 본문의 기대한 포도와 대비되는 문맥상 의미를 살리되, 한국어에서 익숙하고 간결한 전통적 대응어인 ‘들포도’를 사용했습니다.
theological_decisions:
- issue: 포도원 비유의 해석 범위
  chosen_reading: 본문에서는 비유를 풀지 않고 ‘포도원’ 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘내 백성’ 또는 ‘이스라엘’로 풀어 쓰기
  rationale: 이 절 자체는 비유적 이미지를 유지하며, 그 해석은 문맥 전체에서 드러나므로 본문에 해설을 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하는 것보다 더 많이 해석을 삽입하지 않습니다.'
