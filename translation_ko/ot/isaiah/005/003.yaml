  naturalness: ‘나와 나의 포도원 사이에서 판단해 보십시오’도 이해되지만, ‘나와 내 포도원 사이를 판단하십시오’가 현대 표준어에서 더 직접적이고 자연스럽습니다. ‘판단해 보다’는 원문의 정중한 권유 נָא보다 ‘시험 삼아 해 보다’의 뉘앙스를 더할 수 있으므로, ‘부디 … 판단하십시오’가 더 적절합니다.
  terminology: ‘포도원’은 כֶּרֶם에 적절합니다. ‘유다 사람들’은 현대 한국어의 자연스러운 지명 기반 집단 호명이며, אִישׁ의 문법적 단수와 대표성은 각주로 보완할 수 있습니다. ‘판단하십시오’는 שִׁפְטוּ의 평가·판정 요청을 충실히 전달합니다.
