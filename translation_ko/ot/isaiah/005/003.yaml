  text: וְ/עַתָּ֛ה יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וְ/אִ֣ישׁ יְהוּדָ֑ה שִׁפְטוּ נָ֕א בֵּינִ֖/י וּ/בֵ֥ין כַּרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
  footnotes:
  - marker: a
    text: Hebrew has singular expressions, 'inhabitant of Jerusalem' and 'man of Judah,' used as a representative address to the people collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 예루살렘의 주민과 유다의 사람들아, 나와 나의 포도원 사이에서 판단해 보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘예루살렘의 주민’과 ‘유다의 사람’처럼 단수 표현을 사용하지만, 공동체를 대표하는 호칭으로 쓰였습니다.
    reason: source_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환과 직접 호소의 시작을 자연스럽게 표시하면서, 앞선 노래형 문맥에서 이어지는 전환감을 유지합니다.
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  english_pob_choice: inhabitant of Jerusalem
  chosen_korean: 예루살렘의 주민
  alternatives_korean:
  - 예루살렘의 거주자
  - 예루살렘에 사는 이
  lexicon: HALOT
  rationale: 히브리어 단수 표현이 집단을 대표하는 호칭으로 쓰였으므로, 한국어에서도 단수의 대표성은 유지하되 자연스러운 현대어인 ‘주민’으로 옮겼습니다.
- source_word: וְאִישׁ יְהוּדָה
  english_pob_choice: and man of Judah
  chosen_korean: 유다의 사람들아
  alternatives_korean:
  - 유다의 남자들아
  - 유다의 사람아
  lexicon: HALOT
  rationale: אִישׁ의 남성형을 직역한 ‘남자’는 현대 한국어에서 어색한 집단 호명이라, 대표적 집단 호소라는 기능을 살려 ‘사람들아’로 옮겼습니다.
- source_word: שִׁפְטוּ נָא
  english_pob_choice: judge, please
  chosen_korean: 판단해 보십시오
  alternatives_korean:
  - 판단하십시오
  - 판결해 보십시오
  lexicon: HALOT
  rationale: 여기서는 법정 판결보다 관계를 두고 평가하라는 호소가 핵심이므로, ‘판단하다’가 의미를 가장 잘 드러냅니다. ‘보십시오’는 נָא의 공손한 청유를 자연스럽게 담습니다.
theological_decisions:
- issue: 대표적 단수 호칭의 집단적 기능
  chosen_reading: ‘예루살렘의 주민’과 ‘유다의 사람들’로 옮겨, 단수 형식이지만 공동체 전체를 향한 호칭임을 드러냈습니다.
  alternative_readings:
  - 예루살렘의 주민들
  - 유다 사람들
  rationale: 히브리어는 단수 표현으로 공동체를 대표해 부르고 있으므로, 의미는 집단 호소로 살리되 원문이 가진 직접 호명성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #4'
