id: ISA.5.1
reference: Isaiah 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָשִׁ֤ירָה נָּא֙ לִֽ/ידִידִ֔/י שִׁירַ֥ת דּוֹדִ֖/י לְ/כַרְמ֑/וֹ כֶּ֛רֶם הָיָ֥ה לִֽ/ידִידִ֖/י בְּ/קֶ֥רֶן בֶּן שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'on a horn, a son of oil,' an idiom for a fertile hill.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제가 사랑하는 이를 위하여 그의 포도원에 관한 노래를 부르겠습니다. 사랑하는 이에게는 비옥한 언덕[a] 위에 포도원이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘기름의 아들인 뿔’이며, 비옥한 언덕을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  english_pob_choice: Let me sing, please
  chosen_korean: 「노래하겠습니다」
  alternatives_korean:
  - 「노래하게 해 주십시오」
  - 「제가 노래하겠습니다」
  lexicon: HALOT
  rationale: 청유적 코호르타티브와 나아(נָּא)의 간청/완곡함을 한국어에서 자연스럽게 표현하기 위해 문맥상 부드러운 서술형 의지 표현으로 옮겼습니다. 앞의 간청 뉘앙스는 전체 시구의 초대적 어조로 흡수했습니다.
- source_word: לִידִידִי / דּוֹדִי
  english_pob_choice: for my beloved / my beloved
  chosen_korean: 「내 사랑하는 이」 / 「제 사랑하는 이」
  alternatives_korean:
  - 「내 연인」
  - 「내 사랑하는 사람」
  lexicon: HALOT
  rationale: 두 히브리어 어휘의 친밀한 관계적 어감을 살리되, 성적 함의를 과도하게 좁히지 않도록 표준적이고 시적인 「사랑하는 이」를 택했습니다. 첫 번째는 발화 대상, 두 번째는 소유/관계의 반복으로 변화를 주었습니다.
- source_word: שִׁירַת
  english_pob_choice: a song
  chosen_korean: 「노래」
  alternatives_korean:
  - 「한 노래」
  - 「시」
  lexicon: HALOT
  rationale: 시가적 문맥에서 שִׁירַת는 내용 소개의 명사구이므로 한국어에서는 자연스럽게 단순히 「노래」로 처리했습니다.
- source_word: לְכַרְמוֹ / כֶּרֶם
  english_pob_choice: concerning his vineyard / vineyard
  chosen_korean: 「포도밭」 / 「포도원」
  alternatives_korean:
  - 「포도원」
  - 「포도밭에 관하여」
  lexicon: HALOT
  rationale: כֶּרֶם의 기본 의미를 살리되 한국어에서 시적·농경적 이미지를 가장 직접적으로 전달하는 「포도밭」을 주어 형태로, 결과적 대상 명칭으로는 통용되는 「포도원」도 함께 반영했습니다.
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  english_pob_choice: on a fertile hill
  chosen_korean: 「기름진 언덕 위에」
  alternatives_korean:
  - 「기름의 아들인 뿔 위에」
  - 「비옥한 언덕 위에」
  - 「기름진 산비탈에」
  lexicon: HALOT
  rationale: 직역하면 ‘뿔, 기름의 아들’이지만, 지형 비유가 가리키는 비옥한 언덕이라는 의미를 한국어의 자연스러운 지리 표현으로 옮겼습니다. POB의 주석적 의미를 본문에 반영하되, 문자적 이미지는 주석 없이 풀어낸 형태입니다.
theological_decisions:
- issue: ‘사랑하는 이’의 정체를 본문에서 미리 규정할지 여부
  chosen_reading: 메타포의 인물 호칭을 그대로 보존해 본문에서는 ‘내 사랑하는 이’로만 두었습니다.
  alternative_readings:
  - 여호와로 명시하기
  - 화자의 친구나 문학적 인물로 한정하기
  rationale: 이 절은 포도원 노래의 서두로서 아직 인물의 정체를 명시적으로 풀지 않습니다. 뒤의 문맥이 여호와와 이스라엘의 비유를 드러내더라도, 여기서는 해석을 앞당기지 않고 시적 긴장을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 문맥이 드러내는 신학적 식별을 보존하되, 본문 서두의 의도적 모호성을 유지
