  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
  footnotes:
  - marker: a
    text: Or 'like sweepings'; the Hebrew term refers to something swept away or discarded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼의 분노가 그의 백성에게 타올랐고, 그는 그들에게 손을 내밀어 그들을 치셨습니다. 산들이 떨었고, 그들의 시체는 거리 한가운데의 쓰레기 같았습니다. 이 모든 일에도 그의 분노는 아직 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓸어낸 것’으로도 옮길 수 있습니다. 이 히브리어는 쓸려 가거나 버려진 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 야훼로 옮겨, 원문 고유명성과 학술적 일관성을 유지했습니다.
- source_word: חָרָה אַף
  english_pob_choice: the anger of Yahweh burned
  chosen_korean: 야훼의 분노가 타올랐고
  alternatives_korean:
  - 야훼께서 몹시 분노하셨고
  - 야훼의 진노가 일어났고
  lexicon: HALOT
  rationale: ‘분노가 타오르다’는 히브리어의 불타는 분노 이미지를 살리면서 현대 한국어에서도 자연스럽습니다.
- source_word: וַיֵּט יָדוֹ עָלָיו / וַיַּכֵּהוּ
  english_pob_choice: he stretched out his hand against them and struck them
  chosen_korean: 그들에게 손을 내밀어 그들을 치셨습니다
  alternatives_korean:
  - 그들에게 손을 펴서 그들을 치셨습니다
  - 그들에게 손을 들어 그들을 치셨습니다
  lexicon: HALOT
  rationale: ‘손을 내밀다’는 심판을 위한 능동적 행위를 드러내며, 이어지는 ‘치다’와 함께 원문의 행동 연쇄를 보존합니다.
- source_word: נִבְלָתָם כַּסּוּחָה בְּקֶרֶב חוּצוֹת
  english_pob_choice: their corpses were like refuse in the midst of the streets
  chosen_korean: 그들의 시체는 거리 한가운데의 쓰레기 같았습니다
  alternatives_korean:
  - 그들의 시체는 거리 한가운데의 쓸어낸 것 같았습니다
  - 그들의 시체는 거리 한가운데의 오물 같았습니다
  lexicon: HALOT
  rationale: כַּסּוּחָה의 ‘쓸어 버려진 것/쓰레기’ 의미를 살리되, 본문이 주는 수치스럽고 버려진 상태를 현대어로 분명하게 전했습니다.
- source_word: בְּכָל זֹאת לֹא שָׁב אַפּוֹ וְעוֹד יָדוֹ נְטוּיָה
  english_pob_choice: For all this, his anger has not turned away, and his hand is still stretched out
  chosen_korean: 이 모든 일에도 그의 분노는 아직 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다
  alternatives_korean:
  - 이 모든 일에도 그의 분노는 아직 거두어지지 않았고, 그의 손은 여전히 뻗어 있습니다
  - 이 모든 일에도 그의 진노는 아직 물러서지 않았고, 그의 손은 여전히 뻗어 있습니다
  lexicon: HALOT
  rationale: 반복되는 이사야의 경고 공식어를 살려 ‘아직 돌이키지 않았다’로 번역해, 진노의 지속을 그대로 드러냈습니다.
theological_decisions:
- issue: 하나님의 심판을 드러내는 신체적 표현의 처리
  chosen_reading: ‘분노가 타올랐고’, ‘손을 내밀어’, ‘손은 여전히 뻗어 있습니다’의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 감정과 행위를 추상화해 ‘몹시 화내셨다’ 또는 ‘계속 벌하신다’로 완화할 수 있습니다.
  rationale: 히브리어는 의도적으로 구체적이고 육체적인 심판 이미지를 사용하므로, 이를 완화하면 본문의 예언적 긴장이 약해집니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: 주어와 대상을 향한 집합적 지시의 한국어화
  chosen_reading: 단수 어미의 대상 표지를 문맥상 복수로 풀어 ‘그들에게 / 그들을’로 옮겼습니다.
  alternative_readings:
  - 원문의 단수 지시를 문자적으로 유지할 수 있습니다.
  rationale: 히브리어는 집합 명사에 단수 대명사를 쓰지만, 한국어에서는 독자가 심판 대상이 백성 전체임을 분명히 이해하도록 복수로 표기하는 것이 적절합니다.
  doctrine_reference: Source-language discourse clarity
