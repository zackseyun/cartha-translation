source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
  footnotes:
  - marker: a
    text: Or 'their banquets' or 'their drinking feasts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the work of the LORD ... the work of his hands,' a parallel expression emphasizing the LORD's acts that they ignore.
    reason: cross_reference
translation:
  language: ko
  text: 거기에는 수금과 비파, 탬버린과 피리, 잔칫집의 포도주가 있습니다. 그러나 그들은 야훼의 일을 살피지 않고, 그의 손이 하신 일을 보지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 잔칫집’ 혹은 ‘그들의 술잔치’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 일 … 그의 손이 하신 일’이라는 평행 표현으로, 그들이 외면한 야훼의 행사를 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִנּוֹר
  english_pob_choice: lyre
  chosen_korean: 수금
  alternatives_korean:
  - 리라
  - 하프
  lexicon: HALOT
  rationale: כִנּוֹר은 현악기이므로 한국어 성경에서 널리 이해되는 전통 대응어인 ‘수금’을 사용해 자연스러움과 식별성을 함께 살렸습니다.
- source_word: נֶבֶל
  english_pob_choice: harp
  chosen_korean: 비파
  alternatives_korean:
  - 하프
  - 류트
  lexicon: HALOT
  rationale: נֶבֶל은 כִּנּוֹר과 구별되는 또 다른 현악기이므로, 한국어에서 구별이 살아 있는 ‘비파’를 택했습니다.
- source_word: מִשְׁתֵּיהֶם
  english_pob_choice: their feasts
  chosen_korean: 잔칫집의
  alternatives_korean:
  - 그들의 잔치의
  - 그들의 연회의
  lexicon: HALOT
  rationale: 문맥상 포도주가 함께 언급되어 ‘술자리/연회’의 성격이 드러나므로, 단순한 ‘잔치’보다 공동체적 소비와 향락의 분위기를 나타내는 ‘잔칫집의’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 예언적 비판이 하나님의 고유한 이름을 직접 가리키므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: פֹּעַל יְהוָה
  english_pob_choice: the work of Yahweh
  chosen_korean: 야훼의 일
  alternatives_korean:
  - 야훼의 일하심
  - 야훼의 행하신 일
  lexicon: HALOT
  rationale: פֹּעַל은 ‘일/작업/행위’의 의미를 가지며, 여기서는 반복되는 평행구조를 살리기 위해 간결한 ‘일’로 옮겼습니다.
- source_word: מַעֲשֵׂה יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손이 하신 일
  alternatives_korean:
  - 그 손의 일
  - 그의 손으로 하신 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 더 자연스럽게 들리도록 ‘손이 하신 일’로 옮겨, 앞의 ‘야훼의 일’과 평행을 유지했습니다.
theological_decisions:
- issue: YHWH의 표기와 본문 비판적 함의
  chosen_reading: ‘야훼’로 직접 표기하여, 이스라엘이 무시한 대상이 단순한 칭호가 아니라 언약의 고유한 이름을 지닌 하나님임을 드러냈습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문의 비난은 예배의 결핍이 아니라 야훼 자신과 그분의 행사를 외면한 데 있으므로, 이름의 직접 표기는 신학적 초점을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
