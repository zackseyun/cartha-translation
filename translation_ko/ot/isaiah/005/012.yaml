  source_fidelity: 히브리어의 악기 목록, 포도주, 그리고 ‘야훼의 일/그의 손의 일’이라는 평행 구조는 대체로 잘 반영되었습니다. 그러나 מִשְׁתֵּיהֶם은 ‘그들의 잔치/연회’이지 ‘잔칫집’이 아니므로, 현행 ‘잔칫집의 포도주’는 장소·소유 관계를 부가하여 원문의 구문을 바꿉니다.
  naturalness: ‘그들의 잔치에는 … 포도주가 있습니다’가 목록의 배경과 소유 표현을 자연스럽게 나타냅니다. ‘그의 손이 하신 일’은 한국어에서 다소 어색하므로 ‘그의 손으로 하신 일’로 다듬는 것이 자연스럽습니다.
  terminology: ‘야훼’는 주어진 번역 방침 및 원문의 신명 표기에 부합합니다. ‘수금과 비파, 탬버린과 피리’는 정확한 악기 식별이 불확실한 원문에서 안전하게 구별을 보존합니다. ‘일’의 반복도 원문의 평행을 적절히 보존합니다.
