  text: וַֽ/יְעַזְּקֵ֣/הוּ וַֽ/יְסַקְּלֵ֗/הוּ וַ/יִּטָּעֵ֨/הוּ֙ שֹׂרֵ֔ק וַ/יִּ֤בֶן מִגְדָּל֙ בְּ/תוֹכ֔/וֹ וְ/גַם יֶ֖קֶב חָצֵ֣ב בּ֑/וֹ וַ/יְקַ֛ו לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
  footnotes:
  - marker: a
    text: Or 'worthless grapes' or 'bad fruit'; the Hebrew term refers to poor or foul fruit, not the good grapes that were expected.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 파고, 돌을 골라내고, 좋은 포도나무를 심었습니다. 그 가운데에 망대를 세우고, 그 안에 포도주 틀도 쪼아 만들었습니다. 그런 다음 그가 좋은 포도송이를 맺을 것을 기대했지만, 그것은 들포도를 맺었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓸모없는 포도’나 ‘나쁜 열매’입니다. 히브리어는 기대했던 좋은 포도와 달리 질이 낮거나 불량한 열매를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  english_pob_choice: dug it up
  chosen_korean: 그것을 파고
  alternatives_korean:
  - 그것을 일구고
  - 그것을 경작하고
  - 그것을 파헤치고
  lexicon: HALOT
  rationale: 포도원 준비를 가리키는 동사를 한국어로 자연스럽게 옮기되, 단순히 ‘경작하다’로 넓히기보다 실제 흙을 파는 동작을 살렸습니다.
- source_word: וַיְסַקְּלֵהוּ
  english_pob_choice: cleared it of stones
  chosen_korean: 돌을 골라내고
  alternatives_korean:
  - 돌을 치우고
  - 돌을 제거하고
  - 돌을 걷어내고
  lexicon: HALOT
  rationale: 포도밭에서 돌을 제거하는 뜻을 분명하게 드러내기 위해, 자연스럽고 구체적인 ‘골라내다’를 택했습니다.
- source_word: שֹׂרֵק
  english_pob_choice: choice vines
  chosen_korean: 좋은 포도나무
  alternatives_korean:
  - 좋은 덩굴
  - 선택된 포도나무
  - 아주 좋은 포도나무
  lexicon: HALOT
  rationale: ‘선택된/좋은 품종의 포도나무’라는 의미를 살리되, 한국어에서 포도원을 말할 때 더 자연스러운 ‘포도나무’로 옮겼습니다.
- source_word: בְּאֻשִׁים
  english_pob_choice: wild grapes
  chosen_korean: 들포도
  alternatives_korean:
  - 쓸모없는 포도
  - 나쁜 포도
  - 상한 포도
  lexicon: HALOT
  rationale: 히브리어의 부정적 결실을 ‘들포도’로 옮겨, 기대된 재배 포도와의 대비를 살리면서도 지나치게 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 포도원 비유의 참조 대상을 본절에서 미리 특정할지 여부
  chosen_reading: 농업적 이미지를 그대로 유지하고, 본절 안에서는 해석적 대상을 직접 밝히지 않았습니다.
  alternative_readings:
  - 포도원을 이스라엘로 미리 풀어 쓰는 방식
  rationale: 본문은 먼저 구체적 포도원 노래를 제시하므로, 뒤 절의 해석이 긴장을 풀어 주도록 두는 편이 원문과 문맥에 더 충실합니다.
  doctrine_reference: 문맥적 점진 계시와 비유 해석의 보존
