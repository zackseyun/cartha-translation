  source_fidelity: 대체로 원문에 충실합니다. 토양을 일구고 돌을 제거하며 좋은 포도나무를 심고, 망대와 포도주 틀을 마련한 뒤 좋은 포도를 기대했으나 부정적인 열매를 얻었다는 흐름을 잘 보존합니다. 다만 현행 마지막 문장의 문법은 ‘그’가 포도송이를 맺는다는 뜻으로 읽힐 수 있어, 포도원이 열매를 맺는다는 원문의 관계를 명료하게 해야 합니다.
