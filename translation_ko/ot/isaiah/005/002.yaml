  to: 그는 그것을 파고 돌을 치우고 좋은 포도나무를 심었습니다. 그 가운데에 망대를 세우고 그 안에 포도주 틀도 파내었습니다. 그는 좋은 포도가 맺히기를 기대했지만, 그것에서는 들포도가 맺혔습니다.[a]
