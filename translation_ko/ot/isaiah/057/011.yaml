source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
  footnotes:
  - marker: a
    text: Or 'did not take it to heart.' The Hebrew idiom is literally 'did not set [it] upon your heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I was silent for a long time' / 'I kept silent from of old.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「네가 누구를 두려워하고 겁내었기에 거짓을 말하고 나를 기억하지도 않으며, 그것을 네 마음에 새기지도 않았느냐?[a] 내가 오래전부터 잠잠히 있었기 때문에,[b] 네가 나를 두려워하지 않는 것이 아니냐?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 네 마음에 두지 않았다’는 뜻입니다. 히브리어 관용구는 문자적으로 ‘그것을 네 마음 위에 두지 않았다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 오랫동안 잠잠하였다’ 또는 ‘나는 예로부터 잠잠하였다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ
  english_pob_choice: did you dread
  chosen_korean: 두려워하며
  alternatives_korean:
  - 염려하며
  - 걱정하며
  lexicon: HALOT
  rationale: דאג는 염려와 두려움의 뉘앙스를 모두 가질 수 있으나, 뒤의 ירא와 병렬을 이루는 강한 정서적 반응으로는 ‘두려워하다’가 가장 자연스럽고 힘이 있습니다.
- source_word: וַתִּירְאִי
  english_pob_choice: and fear
  chosen_korean: 무서워하였기에
  alternatives_korean:
  - 두려워하였기에
  - 무서워하여
  lexicon: HALOT
  rationale: ירא의 기본 의미를 살리되, 앞 절과의 반복을 한국어에서만 그대로 중복하지 않기 위해 ‘무서워하다’로 변주해도 원문의 공포 중첩을 유지합니다.
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  english_pob_choice: did not lay it to your heart
  chosen_korean: 그것을 네 마음에 두지 않았으며
  alternatives_korean:
  - 그것을 네 마음에 두지 않았으며
  - 그것을 네 마음에 새기지 않았으며
  - 그것을 마음에 두지 않았으며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 현대 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘마음에 두다’는 내적 숙고와 중요시함을 잘 드러냅니다.
- source_word: מַחְשֶׁה / מֵעֹלָם
  english_pob_choice: I have kept silent / even from long ago
  chosen_korean: 내가 오래전부터 잠잠하였기 때문에
  alternatives_korean:
  - 내가 오래전부터 잠잠하였기 때문에
  - 내가 예로부터 침묵하였기 때문에
  - 내가 오래도록 잠잠하였기 때문에
  lexicon: HALOT
  rationale: חשה는 ‘잠잠하다/침묵하다’의 뜻이며, עוֹלָם은 여기서 추상적 영원이 아니라 장기간의 과거를 가리킵니다. ‘오래전부터’가 긴 침묵의 지속을 분명하게 전달합니다.
- source_word: וְאוֹתִי לֹא תִירָאִי
  english_pob_choice: that you do not fear me
  chosen_korean: 네가 나를 두려워하지 않는 것이 아니냐
  alternatives_korean:
  - 네가 나를 두려워하지 않는 것이 아니냐
  - 네가 나를 경외하지 않는 것이 아니냐
  - 네가 나를 두려워하지 않느냐
  lexicon: HALOT
  rationale: 문맥상 단순 감정적 공포가 아니라 하나님을 향한 경외의 결여를 포함하지만, 여기서는 원문의 반복을 살려 ‘두려워하다’로 유지했습니다.
theological_decisions:
- issue: 하나님의 잠잠하심의 의미
  chosen_reading: 하나님의 오래된 잠잠하심이 이스라엘의 무감각과 불경의 계기였다고 진술하지만, 그 침묵을 무관심이나 승인으로 해석하지는 않습니다.
  alternative_readings:
  - 하나님의 침묵은 단순한 비개입입니다.
  - 하나님의 침묵은 절대적 숨김입니다.
  rationale: 본문은 하나님의 침묵과 사람의 하나님 두려움 상실을 인과적으로 연결하지만, 그 이상을 말하지는 않습니다. 번역도 이 긴장을 풀지 않고 그대로 남겨 두어야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
