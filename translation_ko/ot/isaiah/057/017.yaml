  to: 그의 부당한 이득의 죄악 때문에 내가 노하여 그를 쳤고, 내가 숨고 노하였으며, 그는 마음의 길로 계속 돌아서 갔습니다.[a]
  rationale: 본문에서는 ‘얼굴’을 보충하지 않고 הַסְתֵּר를 ‘내가 숨고’로 옮겼습니다. עָוֺן의 죄악 의미를 명시하고, 원문의 연속 접속을 ‘-고, -며, -고’의 병렬로 보존했습니다. 구조상 각주 표지가 하나만 남으므로, 기존의 두 대안 정보를 하나의 각주에 통합했습니다.
