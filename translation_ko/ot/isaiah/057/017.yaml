  source_fidelity: 수정이 필요합니다. 초안의 ‘내 얼굴을 가리고’는 히브리어 הַסְתֵּר에 명시되지 않은 ‘얼굴’을 본문에 보충합니다. 또한 בַּעֲוֺן בִּצְעוֹ의 ‘죄악’ 의미가 ‘불의한’이라는 수식어에만 흡수되어 다소 약해졌습니다.
  naturalness: ‘내가 숨고 노하였으며’는 원문의 병렬을 유지하면서 현대 표준 한국어 합쇼체 문장으로 자연스럽습니다. ‘마음의 길로 계속 돌아서 갔습니다’는 שׁוֹבָב의 이탈·배반의 지속성을 비교적 직접적으로 보존합니다.
  terminology: ‘부당한 이득의 죄악’은 בֶּצַע의 부정한 이득과 עָוֺן의 죄악을 모두 드러냅니다. ‘노하다’와 ‘치다’는 본문의 심판 어조에 맞습니다. ‘얼굴을 가리다’는 본문이 아니라 각주에서 대안으로 유지해야 합니다.
