  - severity: low
    issue: ‘불의한 이득 때문에’가 עָוֺן의 명시적 죄악 의미를 약화함
    rationale: ‘불의한’이 도덕적 함의를 전달하기는 하나, ‘그의 부당한 이득의 죄악’으로 옮기면 원문의 עָוֺן과 בֶּצַע를 더 충실히 보존할 수 있습니다.
