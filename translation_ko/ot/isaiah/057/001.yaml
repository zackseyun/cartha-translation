id: ISA.57.1
reference: Isaiah 57:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
  footnotes:
  - marker: a
    text: Or 'from calamity' or 'from the coming disaster.'
    reason: alternative_reading
translation:
  language: ko
  text: 의인이 사라지는데도 아무도 이를 마음에 두지 않습니다. 인애를 지닌 사람들이 거두어지지만, 아무도 의인이 악을 피하여[a] 거두어지는 것을 깨닫지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙을 피하여’ 또는 ‘다가오는 재난을 피하여’
    reason: alternative_reading
lexical_decisions:
- source_word: הַצַּדִּיק
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 의로운 남자
  lexicon: HALOT
  rationale: 히브리어의 관사 붙은 단수 형용사가 실질적으로 사람을 가리키므로 ‘의인’으로 간명하게 살리되, 한국어에서는 성중립적 표현이 자연스러워 ‘사람/남자’를 덧붙이지 않았습니다.
- source_word: אָבָד / נֶאֱסַף
  english_pob_choice: perishes / is gathered away
  chosen_korean: 사라지고… 거두어지는데도
  alternatives_korean:
  - 죽고… 거두어지는데도
  - 멸망하고… 거두어지는데도
  - 없어지고… 모여 가는데도
  lexicon: HALOT
  rationale: אָבָד과 אסף의 반복을 한국어에서 ‘사라지다/거두어지다’로 구별해, 단순한 죽음보다 제거·소멸의 뉘앙스와 장례적 완곡어법을 함께 드러냈습니다.
- source_word: שָׂם עַל לֵב
  english_pob_choice: takes it to heart
  chosen_korean: 마음에 두지 않으며
  alternatives_korean:
  - 가슴에 새기지 않으며
  - 마음에 새기지 않으며
  - 깊이 생각하지 않으며
  lexicon: HALOT
  rationale: 관용구의 내적 숙고·주의 기울임을 자연스러운 현대 한국어로 옮기되, 단순 인지보다 도덕적 무감각을 드러내도록 했습니다.
- source_word: אַנְשֵׁי חֶסֶד
  english_pob_choice: men of faithful love
  chosen_korean: 인애의 사람들
  alternatives_korean:
  - 신실한 사랑의 사람들
  - 인애로운 사람들
  - 자비로운 사람들
  lexicon: HALOT
  rationale: חסד의 언약적 충성·선한 사랑을 모두 살리기 위해 ‘인애’로 옮겼고, 복수 명사 구조는 한국어에서 자연스럽게 ‘사람들’로 처리했습니다.
- source_word: מִפְּנֵי הָרָעָה
  english_pob_choice: because of evil
  chosen_korean: 악 때문에
  alternatives_korean:
  - 악 때문에
  - 재앙 때문에
  - 다가오는 재앙 때문에
  - 악의 앞에서
  lexicon: HALOT
  rationale: 문맥상 다가오는 심판/재앙의 성격이 강하지만, 히브리어 רָעָה의 넓은 의미를 완전히 좁히지 않기 위해 본문에는 ‘악’을 두되, 원인 관계는 명시적으로 살렸습니다.
theological_decisions:
- issue: הָרָעָה의 의미를 도덕적 악으로 둘지, 재앙/심판으로 볼지
  chosen_reading: 본문에는 ‘악’으로 두어 의미 범위를 열어 두고, 문맥상 다가오는 심판 가능성을 배제하지 않습니다.
  alternative_readings:
  - 재앙
  - 재난
  - 다가오는 심판
  rationale: 히브리어 רָעָה는 도덕적 악과 재앙적 불행을 모두 가리킬 수 있으므로, 번역문에서 한쪽으로 단정해 긴장을 지우지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
