id: ISA.57.13
reference: Isaiah 57:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
  footnotes:
  - marker: a
    text: Or 'your gathered ones,' possibly referring to idols, allies, or other objects of false trust.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wind' and 'breath/vapor' form a poetic pair emphasizing how easily these things vanish.
    reason: cultural_note
  - marker: c
    text: Or 'inherit the earth'; the Hebrew can mean either 'land' or 'earth,' though 'land' fits the Zion context well.
    reason: alternative_reading
translation:
  language: ko
  text: 네가 부르짖을 때, 네가 모아 둔 것들이 너를 구하게 하십시오! 그러나 바람이 그것들을 모두 날려 가고, 한낱 입김이 그것들을 앗아 갈 것입니다[b]. 그러나 내게 피하는 사람은 땅을 유산으로 받고[c], 나의 거룩한 산을 차지할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어의 ‘바람’과 ‘숨결/입김’은 시적으로 짝을 이루어, 그것들이 얼마나 쉽게 사라지는지를 강조합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘세상’. 히브리어는 ‘땅’과 ‘세상’을 모두 뜻할 수 있으나, 시온 문맥에서는 ‘땅’이 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  english_pob_choice: When you cry out
  chosen_korean: 네가 부르짖을 때
  alternatives_korean:
  - 네가 외칠 때
  - 네가 부르짖을 무렵
  lexicon: HALOT
  rationale: ב plus 동사형은 여기서 시간 부사구로 읽는 것이 자연스러워, 예언적 조롱의 상황을 살려 ‘네가 부르짖을 때’로 옮겼습니다.
- source_word: יַצִּילֻךְ קִבּוּצַיִךְ
  english_pob_choice: let your gathered idols rescue you
  chosen_korean: 네가 모아 둔 것들이 너를 구하게 하여라
  alternatives_korean:
  - 네가 모은 우상들이 너를 구하게 하여라
  - 네가 모아 둔 무리들이 너를 구하게 하여라
  lexicon: HALOT
  rationale: קִבּוּצַיִךְ은 문자적으로 ‘모아 놓은 것들’이어서, 문맥이 허용하는 범위 안에서 의지하던 대상을 드러내되 영어의 'gathered idols'를 지나치게 좁히지 않고 한국어에서는 더 직접적인 조롱형으로 풀었습니다.
- source_word: יִשָּׂא רוּחַ / יִקַּח הָבֶל
  english_pob_choice: the wind will carry them off; a breath will take them away
  chosen_korean: 바람이 그들 모두를 날려 버리고, 숨결이 그것들을 가져갈 것입니다
  alternatives_korean:
  - 바람이 그들 모두를 실어 가고, 한숨이 그것들을 가져갈 것입니다
  - 바람이 그들 모두를 없애 버리고, 입김이 그것들을 가져갈 것입니다
  lexicon: HALOT
  rationale: רוּחַ와 הָבֶל의 시적 병행을 살리기 위해 각각 ‘바람’과 ‘숨결’로 옮겼고, נשׂא/לקח의 동작성은 ‘날려 버리고 / 가져갈 것입니다’로 자연스럽게 나타냈습니다.
- source_word: יִנְחַל אֶרֶץ
  english_pob_choice: will inherit the land
  chosen_korean: 땅을 유산으로 받고
  alternatives_korean:
  - 땅을 상속받고
  - 그 땅을 차지하고
  lexicon: HALOT
  rationale: אֶרֶץ는 시온 문맥상 ‘땅’이 적절하므로 ‘유산으로 받다’로 상속/기업의 뉘앙스를 살렸습니다.
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  english_pob_choice: and possess my holy mountain
  chosen_korean: 나의 거룩한 산을 차지할 것입니다
  alternatives_korean:
  - 나의 거룩한 산을 유산으로 받을 것입니다
  - 나의 거룩한 산을 상속받을 것입니다
  lexicon: HALOT
  rationale: 이전 절의 ‘유산으로 받고’와 반복을 피하면서도 ירשׁ의 소유·점유 의미를 살리기 위해 ‘차지하다’를 선택했습니다.
theological_decisions:
- issue: ‘내게 피하는 사람’의 인칭과 관계 표현
  chosen_reading: אַהְתִסה/הַחוֹסֶה בִי의 대표 단수형을 살려 ‘나에게 피하는 사람’으로 옮김
  alternative_readings:
  - 나에게 피하는 자
  - 내 안에 피신하는 사람
  rationale: 문맥상 보편적 약속이므로 대표 단수형을 유지하되, 현대 한국어에서 자연스럽고 다소 관계적인 표현인 ‘피하는 사람’을 택했습니다.
  doctrine_reference: 시편·이사야의 피난처 모티프
