translation:
  language: ko
  text: 그는 평안[a]에 들어갑니다. 그들은 자기들의 침상에서 쉽니다[b]—자기의 올곧음 가운데 걷는 각 사람입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안 안으로 옵니다.’ 히브리어 동사는 문맥상 ‘들어갑니다’ 또는 ‘옵니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수와 복수를 오가며, ‘그는 … 그들은 …’으로 전환됩니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘자기 앞에서 곧게 걷는 각 사람’ 또는 ‘올곧게 걷는 각 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וֹא
  english_pob_choice: enters
  chosen_korean: 들어갑니다
  alternatives_korean:
  - 옵니다
  - 들어옵니다
  - 들어가십니다
  lexicon: HALOT
  rationale: 동사 בוא의 완료되지 않은 시제를 문맥상 미래/일반 진술로 옮기되, 평강 안으로의 진입이라는 비유를 자연스럽게 살리기 위해 ‘들어갑니다’로 렌더링했습니다.
- source_word: שָׁל֔וֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 복
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 전쟁 부재보다 온전함과 안식을 함께 담으므로, 시편적·예언적 문맥에서 더 넓은 울림을 가진 ‘평강’을 택했습니다.
- source_word: מִשְׁכְּבוֹתָ֑ם
  english_pob_choice: beds
  chosen_korean: 침상
  alternatives_korean:
  - 잠자리
  - 눕는 자리
  - 침대
  lexicon: HALOT
  rationale: 문자적으로는 ‘침상들/눕는 자리들’이지만, 시적 죽음의 이미지에서 한국어로는 ‘침상’이 가장 간결하고 고전적이며 메타포를 유지합니다.
- source_word: הֹלֵ֖ךְ נְכֹחֽוֹ
  english_pob_choice: who walked in his uprightness
  chosen_korean: 자기의 바름 안에서 걸어온 사람들
  alternatives_korean:
  - 자기의 올곧음대로 걸어온 사람들
  - 자기 앞에서 곧게 걸어간 사람들
  - 올곧게 행한 사람들
  lexicon: HALOT
  rationale: הֹלֵךְ의 분사성과 נְכֹחוֹ의 ‘곧음/정직함’을 살리기 위해 행위의 성격을 설명적으로 풀되, 영어 POB가 유지한 윤리적 의미를 따라 ‘바름’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 단수-복수 전환
  chosen_reading: 첫 절은 단수 주어처럼 ‘그는… 들어갑니다’로, 뒤 절은 복수로 ‘그들은… 잠듭니다’로 유지하고, 마지막은 ‘각기’로 분배적 의미를 드러냈습니다.
  alternative_readings:
  - 모두 단수로 평준화하기
  - 모두 복수로 평준화하기
  rationale: 본문의 문법적 긴장을 매끈하게 없애지 않고 보존하는 것이 원문의 시적 질감을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, interpretive tension 보존
- issue: 침상 이미지와 죽음의 의미
  chosen_reading: ‘침상 위에서 잠듭니다’로 두어 안식의 이미지는 살리되, 사후 상태를 특정 교리로 단정하지는 않았습니다.
  alternative_readings:
  - 무덤/장지로 명시하기
  - 천국의 안식으로 명시하기
  rationale: 본문은 의인에게 주어지는 평강과 안식을 말하지만, 형이상학적 세부를 직접 규정하지는 않으므로 이미지 자체를 보존하는 것이 적절합니다.
  doctrine_reference: Affirmations and Translation philosophy §1, §3
