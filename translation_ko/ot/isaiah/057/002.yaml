revisions:
- from: 그는 평강[a]으로 들어갑니다. 그들은 자기 침상 위에서 잠듭니다[b][c] — 각기 자기의 바름 안에서 걸어온 사람들입니다.
  to: 그는 평안[a]에 들어갑니다. 그들은 자기들의 침상에서 쉽니다[b]—자기의 올곧음 가운데 걷는 각 사람입니다[c].
  rationale: ‘쉰다’로 נוח의 안식 의미를 보존하고, ‘각 사람’과 현재형 ‘걷는’으로 원문의 단수 분사 및 영어 POB의 분배적 처리를 반영했습니다. 마지막 구절은 히브리어 자체가 압축적이고 해석상 논의되는 표현이므로, 본문에서는 윤리적 ‘올곧음’의 의미를 유지하고 대안적 이해는 각주에 남겼습니다. 각주 c도 실제로 설명하는 구절 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
