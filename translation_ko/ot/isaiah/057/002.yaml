  verdict: revise
  source_fidelity: 초안은 יָבוֹא의 단수와 יָנוּחוּ의 복수를 대체로 보존하고, 평강과 침상의 이미지를 유지합니다. 그러나 יָנוּחוּ는 ‘잠들다’보다 ‘쉬다/안식하다’에 가깝고, 마지막 분사구는 복수 명사 ‘사람들’로 처리되어 원문의 단수형 및 분배적 뉘앙스가 흐려집니다.
  naturalness: ‘자기의 바름 안에서 걸어온 사람들입니다’는 현대 한국어에서 부자연스럽고, 앞 절과의 문법적 연결도 매끄럽지 않습니다. ‘각 사람’이라는 분배 표현과 ‘올곧게 걷는’을 사용하면 자연스럽게 읽히면서 원문의 긴장을 반영할 수 있습니다.
  terminology: ‘평강’은 사용 가능한 성서적 용어이나, 여기서는 현대 표준어에서도 자연스럽고 שָׁלוֹם의 평안·안식의 폭을 유지하는 ‘평안’을 사용했습니다. מִשְׁכְּבוֹת은 ‘침상’으로 유지했습니다. ‘잠듭니다’는 단순 수면을 뜻할 수 있으므로 ‘쉽니다’로 고쳤습니다.
