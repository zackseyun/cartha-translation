  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
  footnotes:
  - marker: a
    text: Or 'children of a diviner/soothsayer woman.' The Hebrew term refers to illicit divinatory practice.
    reason: lexical_alternative
  - marker: b
    text: The line may function as prophetic metaphor for spiritual adultery and idolatry, not necessarily a literal claim about ancestry.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 너희는 이리로 오라 — 점쟁이의 자식들아, 간음하는 자의 씨요 음행하는 여자에게서 난 자들아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘점쟁이의 자식들’은 히브리어 עֹנְנָה를 옮긴 것으로, 불법적 점복/예언 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 실제 출생 비난이라기보다 영적 간음과 우상숭배를 겨냥한 예언적 비유일 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וְ/אַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러나 너희는
  alternatives_korean:
  - 그리고 너희는
  - 너희는
  lexicon: HALOT
  rationale: 앞 절과의 강한 대조를 살려 역접 ‘그러나’를 두었고, 2인칭 복수를 ‘너희는’으로 직접 호명했습니다.
- source_word: קִרְבוּ הֵנָּה
  english_pob_choice: come here
  chosen_korean: 이리로 오라
  alternatives_korean:
  - 가까이 오라
  - 이곳으로 오라
  lexicon: HALOT
  rationale: 명령형과 지시부사 결합을 자연스러운 한국어로 옮기되, 도전적 초청의 뉘앙스를 살렸습니다.
- source_word: בְּנֵי עֹנְנָה
  english_pob_choice: sons of a sorceress
  chosen_korean: 점쟁이의 자식들아
  alternatives_korean:
  - 무당의 자식들아
  - 주술사의 자식들아
  - 점을 치는 여자의 자식들아
  lexicon: HALOT
  rationale: עֹנְנָה는 불법적 점복 행위를 가리키므로, 현대 한국어에서 그 의미가 바로 드러나는 ‘점쟁이’로 옮겼습니다. ‘자식들아’는 히브리어 복수 호격의 공격적 호칭을 보존합니다.
- source_word: זֶרַע מְנָאֵף וַ/תִּזְנֶה
  english_pob_choice: offspring of an adulterer and a prostitute
  chosen_korean: 간음하는 자의 씨요 음행하는 여자에게서 난 자들아
  alternatives_korean:
  - 간음하는 자의 후손이요 음행하는 여자에게서 난 자들아
  - 간음하는 자와 창기의 자식들아
  lexicon: HALOT
  rationale: זֶרַע를 단순한 혈통표현인 ‘씨’로, מְנָאֵף를 행위형 현재분사인 ‘간음하는 자’로, וַתִּזְנֶה를 여성형 동사구를 살린 ‘음행하는 여자에게서 난’으로 옮겨 성별 표지를 유지했습니다.
theological_decisions:
- issue: 예언적 모욕의 성격
  chosen_reading: 이 구절은 실제 혈통 진술이라기보다 우상숭배와 언약 불신실함을 겨냥한 예언적 비난으로 읽히는 긴장을 그대로 두었습니다.
  alternative_readings:
  - 실제 부도덕한 조상을 지칭하는 문자적 비난
  rationale: 영문 POB 주석의 취지를 따라, 본문이 가진 수사적·상징적 공격성을 약화하지 않으면서 과도한 역사화도 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
