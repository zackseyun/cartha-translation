  source_fidelity: 핵심 동사들의 순서와 대상은 대체로 정확하지만, דְּרָכָיו의 복수형을 직역한 ‘그의 길들’은 한국어에서 부자연스럽고 삶의 방식이라는 관용적 의미를 충분히 전달하지 못합니다. 또한 ‘위로를 회복해 주겠습니다’는 한국어 결합이 어색합니다.
  naturalness: ‘그의 행실’, ‘치유하겠습니다’, ‘그의 애도자들’, ‘위로를 다시 베풀겠습니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽습니다. ‘다시 베풀겠습니다’는 שׁלם의 회복·되돌림의 뉘앙스를 자연스럽게 나타냅니다.
  terminology: ‘행실’은 여기서 사람의 삶의 방식이나 처신을 뜻하는 דְּרָכָיו에 적절합니다. רפא는 ‘치유하다’로, נחה는 ‘인도하다’로 옮기는 것이 적절합니다. נִחֻמִים의 복수는 본문에서는 자연스러운 집합적 단수 ‘위로’로 두고 각주에서 밝혀야 합니다.
