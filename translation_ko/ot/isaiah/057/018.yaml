base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
  footnotes:
  - marker: a
    text: Or 'restore comforts to him'; the Hebrew noun is plural, 'comforts' or 'consolations,' but English commonly uses the singular mass noun 'comfort.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그의 행실을 보았고, 그를 치유하겠습니다. 그를 인도하고, 그와 그의 애도자들에게 위로를 다시 베풀겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형으로, ‘위로들’ 또는 ‘위안들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכָיו
  english_pob_choice: his ways
  chosen_korean: 그의 길들
  alternatives_korean:
  - 그의 행실
  - 그의 길
  lexicon: HALOT
  rationale: 복수형 דְּרָכָיו를 살려 여러 ‘길들’로 옮기되, 문맥상 삶의 방식과 행실을 함께 떠올리게 하여 원문의 관용을 유지했습니다.
- source_word: רָאִיתִי
  english_pob_choice: I have seen
  chosen_korean: 내가 ... 보았으며
  alternatives_korean:
  - 내가 ... 보았습니다
  - 내가 ... 보았고
  lexicon: HALOT
  rationale: 하나님의 관찰이 뒤따르는 치유와 인도의 근거가 되므로, 완료의 현재적 의미를 담아 ‘보았으며’로 연결했습니다.
- source_word: וַאֲשַׁלֵּם נִחֻמִים
  english_pob_choice: and restore comforts
  chosen_korean: 위로를 회복해 주겠습니다
  alternatives_korean:
  - 위로들을 돌려주겠습니다
  - 위로를 되돌려주겠습니다
  lexicon: HALOT
  rationale: נִחֻמִים의 복수성을 살리되 한국어에서는 ‘위로들’보다 자연스러운 집합명사 ‘위로’를 쓰고, שׁלם의 ‘갚다/보상하다’보다 문맥에 맞는 ‘회복하다’로 의미를 풀었습니다.
- source_word: וְלַאֲבֵלָיו
  english_pob_choice: and to his mourners
  chosen_korean: 그의 애도하는 이들에게
  alternatives_korean:
  - 그의 슬퍼하는 이들에게
  - 그의 상주들에게
  lexicon: HALOT
  rationale: אֲבֵלִים는 ‘애도하는 사람들’이므로 관계를 살린 표현으로 옮겼고, 전통적 장례 용어인 ‘상주들’은 본문의 일반적 의미를 좁힐 수 있어 피했습니다.
theological_decisions:
- issue: ‘고치다’와 ‘인도하다’의 결합이 회복 선언을 단순 치료로 축소할 위험
  chosen_reading: 죄와 고난 아래 놓인 사람을 하나님이 직접 회복시키고 새 방향으로 이끄시는 포괄적 회복 선언으로 읽었습니다.
  alternative_readings:
  - 의학적 치유만을 가리키는 표현
  - 도덕적 개선만을 가리키는 표현
  rationale: רפא와 נחה는 물리적 치유와 삶의 회복을 함께 열어 두므로, 한국어도 둘을 분리하지 않고 하나님의 주도적 회복으로 제시했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
