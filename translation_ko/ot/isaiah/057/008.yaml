id: ISA.57.8
reference: Isaiah 57:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
  footnotes:
  - marker: a
    text: Or 'you placed your symbol/remembrance.' The Hebrew 'memorial' may refer to an idolatrous token set up in secret.
    reason: lexical_alternative
  - marker: b
    text: Or 'you cut a covenant for yourself with them.' The Hebrew uses covenant-making language, though the noun 'covenant' is not stated explicitly.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'you looked on a hand.' The phrase is obscure; possible senses include 'you looked on a monument/marker' or a sexual euphemism.
    reason: alternative_reading
translation:
  language: ko
  text: 문과 문설주 뒤에 너는 네 기념물을 세워 두었습니다[a]. 이는 네가 나에게서 떠나 몸을 드러내고 올라갔기 때문입니다. 너는 네 잠자리를 넓게 만들고, 너 자신을 위하여 그들과 언약을 맺었습니다[b]. 너는 그들의 잠자리를 사랑하였고, 한 손을 바라보았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 상징/기념 표지를 두었다.’ 히브리어 ‘기념물’은 몰래 세워 둔 우상적 표식을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, 직역하면 ‘너 자신을 위하여 그들과 언약을 끊었다.’ 히브리어는 언약을 맺는 관용구를 쓰지만, 명사 ‘언약’은 직접 나오지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘한 손을 바라보았다’입니다. 이 표현은 난해하며, ‘기념물/표지’를 보았다는 뜻이나 성적 완곡어법일 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  english_pob_choice: Behind the door and the doorpost
  chosen_korean: 문과 문설주 뒤에
  alternatives_korean:
  - 문과 문설주 너머에
  - 문 뒤와 문설주에
  lexicon: HALOT
  rationale: אַחַר의 공간적 의미를 살려 ‘뒤에’로 옮기고, מְזוּזָה는 ‘문설주’가 가장 직접적인 대응어이므로 채택했습니다.
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  english_pob_choice: you set up your memorial
  chosen_korean: 너는 네 기념물을 세워 두었으며
  alternatives_korean:
  - 네 기억표를 두었으며
  - 네 표지를 세워 두었으며
  lexicon: HALOT
  rationale: זִכְרוֹן은 단순한 기억이 아니라 남겨 둔 표지나 기념물의 뉘앙스를 가지므로, 우상적 표식일 수 있는 물질적 대상을 살려 ‘기념물’로 옮겼습니다.
- source_word: כִּי מֵאִתִּי גִּלִּית
  english_pob_choice: for away from me you uncovered yourself
  chosen_korean: 나에게서 떠나 네가 몸을 드러내고
  alternatives_korean:
  - 나에게서 떨어져 네가 몸을 드러내고
  - 나를 떠나 벗은 몸으로 드러나고
  lexicon: HALOT
  rationale: מֵאִתִּי의 분리 의미를 ‘나에게서 떠나’로 살렸고, גִּלִּית는 수치와 성적 은유를 함께 지니므로 ‘몸을 드러내고’로 완화하지 않으면서도 직설적으로 옮겼습니다.
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  english_pob_choice: you made a covenant for yourself with them
  chosen_korean: 너 자신을 위해 그들과 언약을 맺었으며
  alternatives_korean:
  - 너 자신을 위해 그들과 계약을 맺었으며
  - 그들과 너 자신을 위해 언약을 끊었으며
  lexicon: HALOT
  rationale: כרת의 관용적 언약 체결을 한국어 성서어법에 맞는 ‘언약을 맺다’로 옮기되, לָךְ는 ‘너 자신을 위해’로 반영했습니다.
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  english_pob_choice: you loved their bed
  chosen_korean: 그들의 잠자리를 사랑하였고
  alternatives_korean:
  - 그들의 침상을 사랑하였고
  - 그들의 잠자리를 좋아하였고
  lexicon: HALOT
  rationale: מִשְׁכָּב은 단순한 침대보다 성적·관계적 함의를 띤 ‘잠자리’가 더 적합하므로, 은유를 살려 직역했습니다.
- source_word: יָד חָזִית
  english_pob_choice: you looked on a hand
  chosen_korean: 한 손을 바라보았습니다.
  alternatives_korean:
  - 손을 바라보았습니다.
  - 손 하나를 보았습니다.
  lexicon: HALOT
  rationale: 이 구절은 본문상 가장 난해하므로, 문맥에 없는 해석을 덧씌우지 않고 문자적으로 ‘한 손’으로 유지했습니다.
theological_decisions:
- issue: 우상 숭배와 성적 은유의 보존
  chosen_reading: 문맥의 수치·성적 은유를 지우지 않고, 우상적 배신을 드러내는 표현들을 가능한 한 직접적으로 유지했습니다.
  alternative_readings:
  - 전부를 ‘우상 숭배했다’로 평탄화함
  - 전부를 정치적 동맹만으로 환원함
  rationale: 이 본문은 배교를 성적 은유로 강하게 묘사하므로, 번역이 그 긴장을 풀어 설명문처럼 만들지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 원문 긴장 보존'
- issue: יָד חָזִית의 난해성 보존
  chosen_reading: ‘한 손을 바라보았습니다’로 두어, 본문의 난점을 본문 안에서 드러내고 해석은 주석 여지로 남겼습니다.
  alternative_readings:
  - ‘기념물/표지를 보았다’로 해석함
  - 노골적 성적 완곡어로 단정함
  rationale: 히브리어 표현이 모호하므로 확정적 해석을 본문에 주입하기보다, 가능한 한 원문을 드러내는 방향을 택했습니다.
  doctrine_reference: '번역 원칙: 난점 보존'
