  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
  footnotes:
  - marker: a
    text: Or 'the produce of the lips'; the phrase refers to what the lips bring forth, likely speech of praise or confession.
    reason: lexical_alternative
  - marker: b
    text: '''Peace, peace'' preserves the Hebrew repetition for emphasis.'
    reason: lexical_alternative
  - marker: c
    text: The expression 'far off and near' may refer immediately to dispersed and nearby members of God's people; later Scripture echoes it more broadly.
    reason: cross_reference
translation:
  language: ko
  text: '입술의 열매를 지으시는 이: 평강, 평강이 먼 자에게도 가까운 자에게도 있을지어다 — 야훼께서 말씀하셨습니다 — 내가 그를 고치겠습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹרֵא
  english_pob_choice: Creating
  chosen_korean: 지으시는 이
  alternatives_korean:
  - 창조하시는 분
  - 만드시는 이
  lexicon: HALOT
  rationale: 분사형 보어로서 이어지는 신적 선언의 압축성을 살리기 위해 ‘지으시는 이’로 옮겼습니다. ‘창조하시는 분’도 가능하지만 문맥의 간결한 병렬 구조를 덜 살립니다.
- source_word: נוב שְׂפָתָיִם
  english_pob_choice: the fruit of the lips
  chosen_korean: 입술의 열매
  alternatives_korean:
  - 입술이 내는 것
  - 입술의 소산
  lexicon: HALOT
  rationale: 직역 이미지를 유지하되 한국어로 자연스럽게 들리도록 ‘입술의 열매’로 옮겼습니다. 이는 단순한 ‘찬양’으로 좁히지 않고, 입술이 내는 말의 산물을 포괄합니다.
- source_word: שָׁלוֹם שָׁלוֹם
  english_pob_choice: Peace, peace
  chosen_korean: 평강, 평강
  alternatives_korean:
  - 온전한 평강
  - 평화, 평화
  lexicon: HALOT
  rationale: 반복을 그대로 보존해 강조를 살렸습니다. ‘평강’은 שָׁלוֹם의 넓은 의미를 유지하면서도 한국어에서 종교적·성경적 울림이 있습니다.
- source_word: לָרָחוֹק וְלַקָּרוֹב
  english_pob_choice: to the one far off and to the one near
  chosen_korean: 먼 자에게도 가까운 자에게도
  alternatives_korean:
  - 멀리 있는 자와 가까이 있는 자에게
  - 먼 데 있는 자와 가까운 자에게
  lexicon: HALOT
  rationale: 수혜 대상임을 드러내는 ל의 기능을 살리면서, 히브리어의 명사적 형용사 표현을 한국어에서 자연스럽게 처리했습니다. ‘먼 자/가까운 자’는 인칭을 암시해 문맥의 개방성을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다. 이는 호칭 ‘주’로 대체하지 않고 고유명을 드러냅니다.
- source_word: וּרְפָאתִיו
  english_pob_choice: and I will heal him
  chosen_korean: 내가 그를 고치겠습니다
  alternatives_korean:
  - 내가 그를 치료하겠습니다
  - 내가 그를 회복시키겠습니다
  lexicon: HALOT
  rationale: רפא의 기본 의미를 살리되, 히브리어의 결과적 약속을 한국어 미래형으로 자연스럽게 옮겼습니다. ‘고치다’는 치유와 회복의 폭을 함께 담습니다.
theological_decisions:
- issue: ‘평강, 평강’의 반복과 수혜 범위
  chosen_reading: 반복을 그대로 두고, ‘먼 자’와 ‘가까운 자’를 특정 집단으로 좁히지 않았습니다.
  alternative_readings:
  - 포로로 흩어진 이스라엘과 가까운 이스라엘
  - 후대의 더 넓은 유대인-이방인 적용
  rationale: 본문 자체는 반복을 강조할 뿐 수혜 범위를 명시적으로 규정하지 않으므로, 해석을 본문보다 앞서지 않게 했습니다.
  doctrine_reference: 본문이 허용하는 신학적 긴장을 보존합니다.
