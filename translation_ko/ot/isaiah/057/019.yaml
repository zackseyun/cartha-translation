review_pass:
  verdict: revise
  source_fidelity: 원문의 בּוֹרֵא נוּב שְׂפָתַיִם는 야훼를 가리키는 분사적 표현으로, ‘입술의 열매를 지으시는 분’으로 옮길 수 있습니다. 초안의 ‘지으시는 이:’는 한국어 문장 안에서 주어·서술 관계가 성립하지 않아 원문의 선언 구조를 충분히 전달하지 못합니다. 또한 ‘있을지어다’는 히브리어의 동사 없는 ‘평강, 평강’ 선언을 기원문으로 구체화합니다. 이를 표어적 선언으로 유지했습니다. וּרְפָאתִיו의 약속은 미래로 자연스럽게 반영했습니다.
  naturalness: ‘먼 자에게도 가까운 자에게도 있을지어다’와 대시 사이의 연결은 현대 한국어 합쇼체에서 다소 부자연스럽습니다. 야훼를 ‘입술의 열매를 지으시는 분’과 동격으로 밝히고, 직접 인용을 사용하면 문장 구조와 발화의 귀속이 명료해집니다.
  terminology: ‘야훼’, ‘입술의 열매’, ‘평강’은 각각 신명, 비유적 어휘, שָׁלוֹם의 반복을 적절히 보존합니다. ‘평강, 평강’은 ‘온전한 평강’처럼 반복을 해설하지 않고 그대로 유지했습니다. ‘먼 자’와 ‘가까운 자’는 어느 집단으로도 한정하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘지으시는 이:’가 한국어 문장으로 불완전함
    rationale: 분사구 뒤에 콜론만 두어 야훼와의 문법적 연결이 드러나지 않습니다. 원문의 압축성을 보존하되 ‘분, 곧 야훼께서’로 연결할 필요가 있습니다.
  - severity: medium
    issue: ‘있을지어다’가 평강 선언을 기원으로 특정함
    rationale: 히브리어는 ‘평강, 평강’을 반복하여 선포하며 별도의 기원 동사를 사용하지 않습니다. 한국어에서도 표어적 선언으로 두는 편이 더 가깝습니다.
  - severity: low
    issue: 감사 추적용 주석 앵커가 본문에 없음
    rationale: ‘입술의 열매’, 평강의 반복, ‘먼/가까운 자’의 범위에 관한 기존 영어 감사 주석을 한국어 본문에 연결해 독자가 번역 선택을 확인할 수 있게 해야 합니다.
  revised_text: 입술의 열매를 지으시는 분, 곧 야훼께서 말씀하셨습니다. “먼 자에게나 가까운 자에게나[c] 평강, 평강![b] 내가 그를 고쳐 주겠습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘입술이 내는 것’ 또는 ‘입술의 소산’. 이 표현은 입술에서 나오는 것을 가리키며, 찬양이나 고백의 말을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강, 평강’은 히브리어의 반복을 강조를 위해 그대로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘먼 자’와 ‘가까운 자’는 문맥상 흩어진 백성과 가까이 있는 백성을 가리킬 수 있으나, 본문은 그 범위를 더 구체적으로 규정하지 않습니다. 후대 성경에서는 이 표현이 더 넓게 반향됩니다.
    reason: cross_reference
  revision_rationale: 문법적으로 미완성인 분사구를 야훼와 동격으로 연결하고, 평강의 반복을 기원문으로 바꾸지 않고 선언으로 보존했습니다. 원문의 불특정 수혜 범위와 치유의 약속도 유지했습니다. 주석 a는 개정 본문에 해당 어휘 뒤에 배치되어야 하므로, 최종 조판에서는 ‘입술의 열매[a]’로 표기하십시오.
