id: ISA.57.15
reference: Isaiah 57:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר רָ֣ם וְ/נִשָּׂ֗א שֹׁכֵ֥ן עַד֙ וְ/קָד֣וֹשׁ שְׁמ֔/וֹ מָר֥וֹם וְ/קָד֖וֹשׁ אֶשְׁכּ֑וֹן וְ/אֶת דַּכָּא֙ וּ/שְׁפַל ר֔וּחַ לְ/הַחֲיוֹת֙ ר֣וּחַ שְׁפָלִ֔ים וּֽ/לְ/הַחֲי֖וֹת לֵ֥ב נִדְכָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
  footnotes:
  - marker: a
    text: Or 'who dwells forever.' The Hebrew expression can emphasize either eternal duration or dwelling in eternity.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, 'with the contrite and lowly in spirit' ... 'to revive the heart of the contrite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 높으시고 높이 들리신 분, 영원에 거하시는[a] 분, 이름이 거룩하신 분께서 말씀하신 것입니다. “나는 높고 거룩한 곳에 거하며, 또한 짓눌린 이와 영이 낮은 이[b]와 함께 거합니다. 이는 낮은 이들의 영을 소생시키고 짓눌린 이들의 마음을 소생시키기 위해서입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 거하시는 분’으로도 옮길 수 있습니다. 히브리어 표현은 지속적 영원성과 영원 안에 거하심 중 어느 쪽도 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘통회하며 영이 겸비한 자와 함께’ … ‘통회하는 자의 마음을 소생시키고’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  english_pob_choice: high and lifted up
  chosen_korean: 높고 높이 들린
  alternatives_korean:
  - 높임을 받고 높이 든
  - 고귀하고 높이 들린
  lexicon: HALOT
  rationale: 신적 초월성과 높임의 이중 표현을 살리되, 직역에 치우친 어색함을 피하기 위해 한국어에서도 높이와 들림을 병렬로 유지했습니다.
- source_word: שֹׁכֵן עַד
  english_pob_choice: who inhabits eternity
  chosen_korean: 영원에 거하시는 분
  alternatives_korean:
  - 영원을 거처로 삼으시는 분
  - 영원히 거하시는 분
  lexicon: HALOT
  rationale: עַד의 지속성과 영역성을 모두 지나치게 해석하지 않고, ‘영원에 거하시는’으로 간결하게 살렸습니다.
- source_word: קָדוֹשׁ שְׁמוֹ
  english_pob_choice: whose name is Holy
  chosen_korean: 이름이 거룩하신 이
  alternatives_korean:
  - 그 이름이 거룩하신 이
  - 거룩하신 이름의 분
  lexicon: HALOT
  rationale: ‘이름’이 거룩하다는 서술 구조를 한국어에서 자연스럽게 풀어, 하나님의 이름과 성품의 연관을 보존했습니다.
- source_word: דַּכָּא / שְׁפַל רוּחַ / נִדְכָּאִים
  english_pob_choice: the crushed / lowly in spirit / the heart of the crushed
  chosen_korean: 부서진 자 / 낮은 영을 지닌 자 / 부서진 자의 마음
  alternatives_korean:
  - 상한 자 / 겸손한 영을 지닌 자 / 상한 자의 마음
  - 짓눌린 자 / 마음이 낮은 자 / 짓눌린 자의 마음
  lexicon: HALOT
  rationale: POB의 ‘crushed’ 계열을 따라 דַּכָּא와 נִדְכָּאִים의 반복적 이미지를 ‘부서진’으로 통일하고, שְׁפַל רוּחַ는 ‘낮은 영’을 직관적으로 살렸습니다.
theological_decisions:
- issue: 하나님의 초월성과 함께하심의 병치
  chosen_reading: 높은 곳과 거룩한 곳에 거하심과 부서진 자들 가운데 거하심을 둘 다 그대로 유지했습니다.
  alternative_readings:
  - 초월성을 강조해 함께하심을 약화시키는 번역
  - 함께하심을 상징적으로만 처리하는 번역
  rationale: 히브리어는 두 거처 이미지를 긴장 속에 나란히 놓으므로, 그 긴장을 해소하지 않고 그대로 드러내는 것이 본문의 신학을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘부서진’의 렉시컬 선택
  chosen_reading: 전통적 ‘통회하는’ 대신 ‘부서진’으로 옮겼습니다.
  alternative_readings:
  - 통회하는
  - 상한
  rationale: 문맥상 회개의 감정보다 짓눌림과 파손의 상태가 직접적인 어휘 의미이므로, 도덕적 뉘앙스를 앞세우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1
