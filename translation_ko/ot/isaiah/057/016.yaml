id: ISA.57.16
reference: Isaiah 57:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
  footnotes:
  - marker: a
    text: Or 'the breath would faint before me.' Hebrew רוּחַ can mean 'spirit' or 'breath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the souls that I have made.' Hebrew נְשָׁמוֹת literally means 'breaths,' but can be rendered more interpretively as 'souls' or 'lives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 영원히 다투지는 않을 것이며, 끝없이 노하지도 않을 것입니다. 영[a]이 내 앞에서 기운을 잃고, 내가 지은 숨결들[b]이 약해질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨’. 히브리어 רוּחַ는 ‘영’ 또는 ‘숨’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 지은 영혼들’. 히브리어 נְשָׁמוֹת는 문자적으로 ‘숨결들’이며, 더 해석적으로는 ‘영혼들’ 또는 ‘생명들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם / לָנֶצַח
  english_pob_choice: forever / without end
  chosen_korean: 영원히 / 끝없이
  alternatives_korean:
  - 영구히 / 언제까지나
  - 영원히 / 영원히
  lexicon: HALOT
  rationale: 두 부사는 병렬로 이어진 무기한 부정 표현이므로, 한국어에서도 같은 뜻을 반복하되 어색한 중복을 피하도록 약간 달리 옮겼습니다.
- source_word: אָרִיב
  english_pob_choice: contend
  chosen_korean: 다투다
  alternatives_korean:
  - 변론하다
  - 시비하다
  - 송사하다
  lexicon: HALOT
  rationale: 하나님과 백성 사이의 법정적·관계적 대립을 담되, 현대 한국어에서 자연스럽고 직접적인 동사로 옮겼습니다.
- source_word: רוּחַ
  english_pob_choice: the spirit
  chosen_korean: 그 영
  alternatives_korean:
  - 그 숨
  - 그 생기
  - 그 바람
  lexicon: HALOT
  rationale: 문맥상 하나님의 영이 아니라 인간의 생명기운을 가리키므로, 영어 POB의 해석을 따라 ‘영’으로 두되 문맥상 사람의 영임을 분명히 했습니다.
- source_word: נְשָׁמוֹת
  english_pob_choice: the breaths
  chosen_korean: 숨결들
  alternatives_korean:
  - 숨들
  - 생명들
  - 영혼들
  lexicon: HALOT
  rationale: 복수형의 구체적 생명-호흡 이미지를 살려 ‘숨결들’로 옮겼고, ‘영혼들’은 본문이 요구하지 않는 후대적 영혼 개념을 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: רוּחַ / נְשָׁמוֹת의 인간론적 의미
  chosen_reading: 하나님께서 지으신 인간의 생명기운과 숨결을 가리키는 표현으로 읽고, 성령으로 해석하지 않습니다.
  alternative_readings:
  - 성령으로 이해하기
  - 보다 추상적으로 ‘혼’으로 옮기기
  rationale: 문맥은 무한한 진노를 멈추는 이유를 인간의 연약한 생명에 두고 있으므로, 창조된 피조물의 유한성을 드러내는 표현으로 유지하는 것이 본문의 뜻에 가장 가깝습니다.
  doctrine_reference: 본문이 말하는 긴장—하나님의 심판과 피조물의 연약함—을 해소하지 말고 그대로 보존합니다.
