id: ISA.57.12
reference: Isaiah 57:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֥י אַגִּ֖יד צִדְקָתֵ֑/ךְ וְ/אֶֽת מַעֲשַׂ֖יִ/ךְ וְ/לֹ֥א יוֹעִילֽוּ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
  footnotes:
  - marker: a
    text: Or 'your justice' for 'your righteousness'; the Hebrew צדקה can carry either sense depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they will not help you.' The Hebrew verb can mean 'profit, benefit, help.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 의로움과 네 행위들을 선언하겠지만, 그것들은 네게 유익하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: צִדְקָה는 문맥에 따라 ‘의로움’뿐 아니라 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: יועיל은 ‘유익하다’ 외에도 ‘도움이 되다, 이익이 되다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי / אַגִּיד
  english_pob_choice: I myself will declare
  chosen_korean: 내가 … 선언하겠지만
  alternatives_korean:
  - 내가 … 말하겠지만
  - 내가 … 알리겠지만
  - 내가 … 밝히겠지만
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어 어순으로 살리기 위해 주어를 앞세우고, נגד의 기본 의미인 ‘선언하다/밝히다’ 중 문어체에 맞는 ‘선언하다’를 택했습니다.
- source_word: צִדְקָתֵךְ
  english_pob_choice: your righteousness
  chosen_korean: 네 의로움
  alternatives_korean:
  - 네 의
  - 네 정의
  - 네 바른 행실
  lexicon: HALOT
  rationale: צדקה는 기본적으로 ‘의/의로움’을 뜻하므로 이를 직접 반영했습니다. 여기서는 문맥상 자기 정당화에 대한 역설적 진술이지만, 해석을 덧씌우지 않고 어휘 자체를 유지했습니다.
- source_word: מַעֲשַׂיִךְ
  english_pob_choice: your works
  chosen_korean: 네 행위들
  alternatives_korean:
  - 네 일들
  - 네 행동들
  - 네 행실
  lexicon: HALOT
  rationale: מעשים의 일반적 의미인 ‘행위들/일들’을 살리되, 한국어에서 ‘works’의 종교적 뉘앙스를 너무 강하게 만들지 않도록 ‘행위들’로 옮겼습니다.
- source_word: יוֹעִילוּךְ
  english_pob_choice: they will not profit you
  chosen_korean: 유익하지 못할 것입니다
  alternatives_korean:
  - 도움이 되지 않을 것입니다
  - 이익이 되지 않을 것입니다
  - 유익을 주지 못할 것입니다
  lexicon: HALOT
  rationale: יעל(Hiphil)은 ‘유익하다, 이익이 되다, 도움이 되다’의 뜻이므로 의미 범위를 포괄하는 ‘유익하지 못할 것입니다’를 택했습니다. 영어 POB의 ‘profit’과 한국어 자연성을 함께 반영합니다.
theological_decisions:
- issue: 의로움과 행위에 대한 역설적/비판적 어조
  chosen_reading: ‘네 의로움’과 ‘네 행위들’을 그대로 유지해, 문맥이 드러내는 반어와 책망을 본문 밖에서 덧붙이지 않았습니다.
  alternative_readings:
  - 네 이른바 의로움
  - 네 의로운 행위들
  rationale: 원문은 단어 수준에서는 중립적이지만 문맥상 책망의 뉘앙스가 강합니다. 해석어를 추가하면 긴장이 줄어드므로, 본문은 직역에 가깝게 두고 문맥이 의미를 전달하도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 번역은 본문의 수사적 긴장을 보존해야 합니다.
