id: ISA.57.21
reference: Isaiah 57:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ין שָׁל֔וֹם אָמַ֥ר אֱלֹהַ֖/י לָ/רְשָׁעִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/021.yaml
  text: There is no peace," says my God[b][a], "for the wicked.
  footnotes:
  - marker: a
    text: Isaiah 48:22 has the closely parallel wording, "There is no peace," says the LORD, "for the wicked." Here the Hebrew reads "my God."
    reason: cross_reference
  - marker: b
    text: Or "well-being" or "wholeness" for "peace" (Hebrew shalom).
    reason: lexical_alternative
translation:
  language: ko
  text: 「악인에게는 평강이 없습니다」라고 나의 하나님이 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 히브리어는 이사야 48:22의 병행구와 달리 ‘주님’이 아니라 ‘나의 하나님’(אֱלֹהַי)이라고 읽습니다.
    reason: cross_reference
  - marker: b
    text: ‘평강’은 히브리어 שָׁלוֹם의 기본 의미로, ‘평화’뿐 아니라 ‘안녕’이나 ‘온전함’의 뉘앙스도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׁלוֹם
  english_pob_choice: There is no peace
  chosen_korean: 평강이 없습니다
  alternatives_korean:
  - 평화가 없습니다
  - 안녕이 없습니다
  lexicon: HALOT
  rationale: אֵין의 존재 부정과 שָׁלוֹם의 기본 의미를 함께 살려, 예언적 선언에 자연스러운 합쇼체로 옮겼습니다.
- source_word: אָמַר
  english_pob_choice: says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 선언하십니다
  lexicon: HALOT
  rationale: 예언적 신탁의 현재적 발화를 살려 현재형으로 옮기되, 직접 인용문의 화자인 하나님께는 존대 종결을 사용했습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격을 분명히 드러내어 MT의 'my God'을 보존하고, 예언자의 발화 프레임을 유지했습니다.
- source_word: לָרְשָׁעִים
  english_pob_choice: for the wicked
  chosen_korean: 악인에게는
  alternatives_korean:
  - 악인들에게는
  - 악한 자들에게는
  lexicon: HALOT
  rationale: ל의 대상/귀속 뉘앙스를 한국어 주제 표지와 부정 표현으로 자연스럽게 풀어, 평강이 '악인에게는' 속하지 않음을 드러냈습니다.
theological_decisions:
- issue: Isaiah 48:22와의 평행구 대비에서의 신명 호칭
  chosen_reading: 본문의 MT에 따라 '나의 하나님'을 유지했습니다.
  alternative_readings:
  - 평행구에 맞추어 '주님'으로 조정
  - 단순히 '하나님'으로 일반화
  rationale: 이 절은 평행본문과 달리 אֱלֹהַי를 읽으므로, 조화시키지 않고 본문 차이를 그대로 반영하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
