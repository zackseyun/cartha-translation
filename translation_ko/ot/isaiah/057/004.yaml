  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
  footnotes:
  - marker: a
    text: Or, more literally, 'Whom do you delight yourselves over?' The Hebrew likely carries the sense of gloating or mocking in context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'make your tongue long'; that is, 'stick out your tongue' as a gesture of mockery.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'children of transgression, seed of deceit' uses family language metaphorically for people characterized by rebellion and falsehood.
    reason: cultural_note
translation:
  language: ko
  text: 누구를 조롱합니까?[a] 누구를 향해 입을 크게 벌리고 혀를 내밉니까?[b] 너희는 반역의 자녀요 거짓의 자손이 아닙니까?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘누구를 두고 즐거워합니까?’ 히브리어는 이 문맥에서 득의양양하게 조롱하거나 희롱하는 뜻을 지닐 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로, ‘혀를 길게 하다’입니다. 조롱하는 몸짓으로 혀를 내미는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘반역의 자녀, 거짓의 자손’은 반역과 거짓으로 특징지어지는 사람들을 비유적으로 나타내는 가족·혈통 언어입니다.
    reason: cultural_note
