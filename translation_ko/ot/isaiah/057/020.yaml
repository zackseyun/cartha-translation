id: ISA.57.20
reference: Isaiah 57:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
  footnotes:
  - marker: a
    text: Or 'the troubled sea.' The Hebrew verb can be rendered more interpretively as 'troubled' or 'tossed,' but the more literal image is of the sea being driven.
    reason: lexical_alternative
  - marker: b
    text: Or 'cast up mire and mud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악인들은 끊임없이 흔들리는 바다와 같아서[a], 그 바다는 잠잠할 수 없으며, 그 물이 진흙과 오물을[b] 끌어올립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동요하는 바다.’ 히브리어 동사는 더 문자적으로는 ‘몰아쳐지는/몰려드는’ 바다의 이미지를 줄 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진흙과 오물을 끌어올립니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  english_pob_choice: But the wicked
  chosen_korean: 그러나 악인들은
  alternatives_korean:
  - 그리고 악인들은
  lexicon: HALOT
  rationale: רְשָׁעִים은 추상적 악이 아니라 악한 사람들을 가리키며, 문맥상 앞절의 평강과 대비되므로 한국어에서는 ‘그러나’로 역접을 살렸습니다.
- source_word: כַּיָּם נִגְרָשׁ
  english_pob_choice: like the tossing sea
  chosen_korean: 끊임없이 흔들리는 바다와 같아서
  alternatives_korean:
  - 몰아쳐지는 바다와 같아서
  - 요동치는 바다와 같아서
  lexicon: HALOT
  rationale: נִגְרָשׁ은 ‘몰아내다/몰아붙이다’에서 나온 말로 바다가 외부에서 밀려 흔들리는 이미지를 줍니다. 한국어에서는 직역형보다 시적 이미지를 살리되, ‘흔들리는’으로 동적인 상태를 드러냈습니다.
- source_word: הַשְׁקֵט לֹא יוּכָל
  english_pob_choice: for it cannot be quiet
  chosen_korean: 잠잠할 수 없으며
  alternatives_korean:
  - 고요해질 수 없으며
  - 조용할 수 없으며
  lexicon: HALOT
  rationale: שׁקט는 고요함·잠잠함을 뜻하므로, 바다가 내적 평정에 이르지 못하는 상태를 한국어로 자연스럽게 옮겼습니다.
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  english_pob_choice: its waters toss up
  chosen_korean: 그 물이 ... 끌어올립니다
  alternatives_korean:
  - 그 물이 ... 토해냅니다
  - 그 물이 ... 밀어올립니다
  lexicon: HALOT
  rationale: גרשׁ의 핵심은 밖으로 몰아내는 동작이며, 여기서는 물이 아래의 더러운 것을 위로 내보내는 이미지입니다. ‘끌어올립니다’는 이 상향 동작을 살리면서 한국어에서 자연스럽습니다.
- source_word: רֶפֶשׁ וָטִיט
  english_pob_choice: mire and mud
  chosen_korean: 진흙과 오물
  alternatives_korean:
  - 뻘과 진흙
  - 진흙과 진흙탕
  lexicon: HALOT
  rationale: רֶפֶשׁ과 טִיט은 탁하고 더러운 진흙성 물질을 가리키므로, 한국어에서는 중복을 피하면서도 오염된 바닥의 이미지를 드러내는 ‘진흙과 오물’로 옮겼습니다.
theological_decisions:
- issue: 시의 역접 처리
  chosen_reading: 그러나 악인들은
  alternative_readings:
  - 그리고 악인들은
  rationale: 앞 문맥의 의인과 악인의 대조를 분명히 드러내되, 본문의 설명 구조를 바꾸지 않는 범위에서 역접을 반영했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 바다 이미지의 동적 표현
  chosen_reading: 끊임없이 흔들리는 바다
  alternative_readings:
  - 몰아쳐지는 바다
  - 요동치는 바다
  rationale: 히브리어 동사의 ‘몰아냄/내몰림’ 이미지를 너무 평면적인 ‘조용하지 않다’로 약화시키지 않도록, 바다가 외부 힘에 의해 불안정하게 움직이는 장면을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
