revisions:
- from: 그러나 악인들은 끊임없이 흔들리는 바다와 같아서[a], 그 바다는 잠잠할 수 없으며, 그 물이 진흙과 오물을[b] 끌어올립니다.
  to: 그러나 악인들은 요동하는 바다와 같습니다[a]. 그 바다는 잠잠할 수 없고, 그 물결은 진창과 진흙을 밀어 올립니다.
  rationale: 문맥상의 역접 ‘그러나’와 악인들의 복수는 유지했습니다. 바다의 동적 이미지는 불필요한 시간 부사를 더하지 않은 ‘요동하는’으로 옮기고, 각주에서 ‘내몰리는’이라는 더 직역적인 가능성을 제시했습니다. 마지막 병렬은 ‘진창과 진흙’으로 번역하여 원문의 구체적이고 반복적인 진흙 이미지를 보존했으며, 각주 표지와 내용이 맞지 않던 b 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:24Z'
