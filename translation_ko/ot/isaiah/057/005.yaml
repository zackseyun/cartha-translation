- from: 그들이 상수리나무들 사이에서, 곧 푸른 나무마다 아래에서 음욕에 타오르고, 골짜기들에서 아이들을 죽이며, 바위틈 아래에서 그러합니다.[a][b]
  to: 너희는 상수리나무들[a] 사이에서, 모든 푸른 나무 아래에서 음욕에 불타오르며, 와디들[b]에서, 바위들의 갈라진 틈 아래에서 자녀들을 잡아 죽이는 자들입니다.
