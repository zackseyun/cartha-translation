id: ISA.57.5
reference: Isaiah 57:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נֵּֽחָמִים֙ בָּֽ/אֵלִ֔ים תַּ֖חַת כָּל עֵ֣ץ רַעֲנָ֑ן שֹׁחֲטֵ֤י הַ/יְלָדִים֙ בַּ/נְּחָלִ֔ים תַּ֖חַת סְעִפֵ֥י הַ/סְּלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
  footnotes:
  - marker: a
    text: Or 'among the oaks.' The Hebrew may refer to sacred trees generally; 'terebinths' is chosen here as the more specific likely sense in this cultic context.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the valleys.' The Hebrew refers to wadis or ravines, often seasonal streambeds.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 상수리나무들[a] 사이에서, 모든 푸른 나무 아래에서 음욕에 불타오르며, 와디들[b]에서, 바위들의 갈라진 틈 아래에서 자녀들을 잡아 죽이는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떡갈나무들 사이에서’. 히브리어는 이 문맥에서 성스러운 나무들을 가리킬 수 있으며, 여기서는 더 구체적인 가능성으로 ‘상수리나무들’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘골짜기들에서’. 히브리어는 흔히 계절성 물길이 있는 와디 또는 협곡을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֵּחָמִים
  english_pob_choice: you who burn with lust
  chosen_korean: 음욕에 타오르고
  alternatives_korean:
  - 스스로 달아오르고
  - 열기에 달아오르고
  - 스스로 위로하며
  lexicon: HALOT
  rationale: 문맥이 우상 숭배와 결부된 성적·종교적 격정을 가리키므로, 현대 한국어에서 그 힘을 가장 분명히 드러내는 표현으로 옮겼습니다.
- source_word: בָּאֵלִים
  english_pob_choice: among the terebinths
  chosen_korean: 상수리나무들 사이에서
  alternatives_korean:
  - 떡갈나무들 사이에서
  - 신들 가운데
  lexicon: HALOT
  rationale: 문맥상 ‘신들’이 아니라 성소적 나무를 뜻하며, 한국어에서는 예언서의 관용적 자연 이미지가 살아나는 ‘상수리나무들’이 가장 무난합니다.
- source_word: בַּנְּחָלִים
  english_pob_choice: in the wadis
  chosen_korean: 골짜기들에서
  alternatives_korean:
  - 와디들에서
  - 시내골짜기들에서
  lexicon: HALOT
  rationale: 히브리어 נחלים는 계절성 물길이 있는 골짜기·건천을 가리키므로, 이해 가능성을 위해 ‘골짜기들’로 풀되 원문의 지형 이미지를 유지했습니다.
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  english_pob_choice: under the clefts of the rocks
  chosen_korean: 바위틈 아래에서
  alternatives_korean:
  - 바위의 갈라진 틈 아래에서
  - 바위 절벽의 갈라진 곳 아래에서
  lexicon: HALOT
  rationale: סְעִפֵי는 바위의 갈라진 틈이나 돌출부를 가리킬 수 있어, 한국어에서는 자연스러운 관용으로 ‘바위틈’이 가장 직접적입니다.
theological_decisions:
- issue: 우상 숭배 장면의 성적·제의적 긴장을 얼마나 드러낼지
  chosen_reading: ‘음욕에 타오르고’로 번역해, 본문이 고발하는 제의적·성적 격정을 노골적으로 드러냈습니다.
  alternative_readings:
  - 스스로 달아오르고
  - 열기에 달아오르고
  rationale: 예언자적 고발의 수위가 약화되지 않도록, 원문의 정황이 암시하는 욕망의 열기를 한국어로 분명하게 살렸습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 드러내는 죄의 성격을 희석하지 않음.'
