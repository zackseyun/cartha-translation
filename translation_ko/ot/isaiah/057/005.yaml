  verdict: revise
  source_fidelity: 원문의 복수 분사들이 청자를 직접 고발하는 구조인데, 초안의 ‘그들이’는 이를 3인칭 서술로 바꾸었습니다. 또한 끝의 ‘그러합니다’는 원문에 없는 내용을 더하며, ‘골짜기들’은 영어 감사본의 ‘wadis’ 및 해당 각주의 대안 관계와 맞지 않습니다.
  naturalness: ‘상수리나무들 사이에서 … 모든 푸른 나무 아래에서’와 ‘바위들의 갈라진 틈 아래에서’는 현대 한국어에서 자연스럽습니다. ‘자녀들을 잡아 죽이는 자들입니다’는 히브리어의 분사적 고발을 유지하면서도 합쇼체 문장으로 완결됩니다.
  terminology: ‘음욕에 불타오르며’는 문맥상 성적·우상숭배적 열기를 드러내되 특정 의례를 단정하지 않습니다. אֵלִים의 수목 의미는 ‘상수리나무들’로 옮기고 대안으로 ‘떡갈나무들’을 남깁니다. נְחָלִים은 본문에서 ‘와디들’로 번역하고 ‘골짜기들’을 각주 대안으로 제시합니다.
