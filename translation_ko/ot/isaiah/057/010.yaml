id: ISA.57.10
reference: Isaiah 57:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֹ֤ב דַּרְכֵּ/ךְ֙ יָגַ֔עַתְּ לֹ֥א אָמַ֖רְתְּ נוֹאָ֑שׁ חַיַּ֤ת יָדֵ/ךְ֙ מָצָ֔את עַל כֵּ֖ן לֹ֥א חָלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
  footnotes:
  - marker: a
    text: Or, 'There is no hope.' The Hebrew expression conveys despair or the conclusion that further effort is futile.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'the life/vitality of your hand.' The phrase likely means renewed strength or fresh power to continue.
    reason: lexical_alternative
  - marker: c
    text: Or, 'you did not faint' or 'you did not become weak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러 길을 좇느라 지치셨지만, “희망이 없다” 하지는 않으셨습니다. 손의 생기를 찾아내셨으므로, 그래서 쇠하지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  english_pob_choice: In the multitude of your ways
  chosen_korean: 여러 길을 좇느라
  alternatives_korean:
  - 길이 많아
  - 당신의 길의 많음 속에서
  - 여러 길 가운데
  lexicon: HALOT
  rationale: בְּרֹב은 ‘많음/다수/과다’의 뉘앙스를 가지며, כאן에서 단순 수량보다 ‘여러 길을 따라가는 상황’이 드러나므로 한국어에서는 자연스럽게 동기를 드러내는 형태로 옮겼습니다.
- source_word: יָגַעַתְּ
  english_pob_choice: you grew weary
  chosen_korean: 지치셨지만
  alternatives_korean:
  - 수고하셨지만
  - 피곤해하셨지만
  - 쇠약해지셨지만
  lexicon: HALOT
  rationale: יגע는 수고로 인한 피곤함과 지침을 가리키므로, 현대 한국어의 자연스러운 서술로 ‘지치다’를 사용했습니다.
- source_word: נוֹאָשׁ
  english_pob_choice: It is hopeless
  chosen_korean: “희망이 없다”
  alternatives_korean:
  - “절망이다”
  - “가망이 없다”
  - “더는 소용없다”
  lexicon: HALOT
  rationale: נוֹאָשׁ는 절망/포기의 진술이므로, 독백처럼 들리는 영어 POB의 선택을 살려 한국어에서도 짧은 인용절로 표현했습니다.
- source_word: חַיַּת יָדֵךְ
  english_pob_choice: renewed strength in your hand
  chosen_korean: 손의 생기
  alternatives_korean:
  - 손의 생명
  - 손의 새 힘
  - 손의 활력
  lexicon: HALOT
  rationale: 직역하면 ‘손의 생명/생기’이지만, 문맥상 다시 움직일 수 있게 하는 내적 활력과 능력을 가리키므로 지나친 확장 없이 ‘생기’로 옮겼습니다.
- source_word: לֹא חָלִית
  english_pob_choice: you did not grow weak
  chosen_korean: 쇠하지 않으셨습니다
  alternatives_korean:
  - 약해지지 않으셨습니다
  - 쓰러지지 않으셨습니다
  - 병들지 않으셨습니다
  lexicon: HALOT
  rationale: חלה는 여기서 병보다 기력의 약화/무너짐을 뜻하므로, 전체 병행법에 맞게 ‘쇠하다’로 옮겨 최종 결과를 분명히 했습니다.
theological_decisions:
- issue: 절망 진술과 지속의 평가
  chosen_reading: 이 구절은 칭찬이 아니라, 죄된 추구 안에서도 포기하지 않는 완고함을 드러내는 말로 읽어야 합니다.
  alternative_readings:
  - 단순히 힘든 길에서의 인내를 말하는 중립적 진술
  rationale: 이사야 57장 전체가 우상숭배와 불성실을 책망하므로, 본문의 지속성은 미덕이 아니라 책망의 맥락 안에서 보존되어야 합니다.
  doctrine_reference: 원문의 책망적 문맥 보존
