  source_fidelity: 초안은 지침, 절망의 부인, 힘을 얻어 약해지지 않았다는 기본 의미를 대체로 보존합니다. 그러나 ‘좇느라’는 전치사구의 의미를 인과적으로 다소 좁히며, ‘손의 생기를 찾아내셨으므로’의 ‘찾아내다’는 발견·발굴의 뜻을 과도하게 더합니다. ‘그래서 … 으므로’는 인과 표지가 중복됩니다.
  naturalness: ‘손의 생기를 찾아내셨으므로, 그래서’는 현대 표준어 문장으로 부자연스럽습니다. ‘손에 새 힘을 얻었으므로’로 하면 해당 히브리 관용구를 자연스럽게 전달하면서도 ‘손’의 비유를 유지할 수 있습니다. 합쇼체의 공손 종결은 유지하되, 본문 속 مخاطبة 대상에게 불필요한 주체 높임을 부여하지 않도록 ‘-셨습니다’ 대신 ‘-습니다’를 사용했습니다.
  terminology: נוֹאָשׁ는 ‘희망이 없다’로, חָלָה는 이 문맥에서 ‘쇠약해지다’로 옮기는 것이 적절합니다. חַיַּת יָדֵךְ는 난해한 표현이므로 본문에서는 ‘손에 새 힘’을 사용하고, 각주에서 직역 및 대안을 밝혀 해석의 여지를 보존합니다.
