translation:
  language: ko
  text: 높고 우뚝 솟은 산 위에 당신은 당신의 침상을 두었습니다. 거기서도 당신은 올라가 제사를 바쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '거기서도.'
    reason: alternative_reading
  - marker: b
    text: '''당신의 침상''은 이 문맥에서 우상숭배와 연결된 부정한 성적 이미지를 내포할 가능성이 큽니다.'
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַר גָּבֹהַּ וְנִשָּׂא
  english_pob_choice: On a high and lofty mountain
  chosen_korean: 높고 우뚝 솟은 산 위에
  alternatives_korean:
  - 높고 높은 산 위에
  - 높고 높이 든 산 위에
  lexicon: HALOT
  rationale: עַל הַר는 장소를 나타내므로 한국어에서는 '산 위에'가 자연스럽고, גָּבֹהַּ וְנִשָּׂא의 중첩된 높임은 '높고 우뚝 솟은'으로 압축해 시적 강세를 살렸습니다.
- source_word: שַׂמְתְּ מִשְׁכָּבֵךְ
  english_pob_choice: you set your bed
  chosen_korean: 당신은 당신의 침상을 두었습니다
  alternatives_korean:
  - 당신은 당신의 침대를 두었습니다
  - 당신은 당신의 눕는 자리를 두었습니다
  lexicon: HALOT
  rationale: מִשְׁכָּבֵךְ는 문자적으로 '잠자리/침상'이지만, 문맥상 우상숭배와 부정한 성적 이미지를 함께 띱니다. '침상'은 그 구체성을 유지하면서도 현대 한국어에서 다소 문학적·비유적 뉘앙스를 살립니다.
- source_word: גַּם שָׁם עָלִית
  english_pob_choice: there too you went up
  chosen_korean: 거기서도 당신은 올라가
  alternatives_korean:
  - 그곳에서도 당신은 올라가
  - 거기에도 당신은 올라가
  lexicon: HALOT
  rationale: גַּם שָׁם은 동일한 죄가 그 장소에서도 반복되었음을 강조하므로 '거기서도'로 압축해 강조를 살렸습니다.
- source_word: לִזְבֹּחַ זָבַח
  english_pob_choice: to sacrifice a sacrifice
  chosen_korean: 제사를 바쳤습니다
  alternatives_korean:
  - 제사를 드렸습니다
  - 희생 제물을 바쳤습니다
  - 희생제사를 바쳤습니다
  lexicon: HALOT
  rationale: 히브리어의 동족목적어는 의도적으로 희생 제의의 행위를 강조하지만, 한국어에서는 '제사를 바치다'가 그 культ적 의미를 가장 자연스럽게 전달합니다. '바치다'는 본문이 고발하는 예배 행위의 방향성도 드러냅니다.
theological_decisions:
- issue: '''침상''의 성적·우상숭배적 비유를 본문에서 얼마나 설명할 것인가'
  chosen_reading: 본문에서는 '당신의 침상'을 유지하고, 비유 설명은 주석 없이 본문 밖으로 넘겼습니다.
  alternative_readings:
  - 당신의 음란한 침상을 두었습니다
  - 당신의 우상숭배의 자리
  rationale: 히브리어 자체가 구체 이미지를 통해 고발하므로, 본문에서 해석을 과잉삽입하지 않고 독자가 비유를 감지하도록 두는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
