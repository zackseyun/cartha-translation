id: ISA.57.14
reference: Isaiah 57:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “Cast up, cast up; prepare the way.” The Hebrew uses road-building imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말할 것입니다. “쌓아 올려라, 쌓아 올려라. 길을 닦아라. 내 백성의 길에서 걸림돌을 치워라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, “쌓아 올려라, 쌓아 올려라; 길을 준비하라.” 히브리어는 도로를 만드는 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  english_pob_choice: And it will be said
  chosen_korean: 그리고 말할 것입니다
  alternatives_korean:
  - 그리고 말합니다
  - 그리고 말하리라
  - 그리고 말할 것입니다 — 누군가 말할 것입니다
  lexicon: HALOT
  rationale: 히브리어는 주어를 분명히 밝히지 않는 공지형 표현이므로, 한국어에서도 특정 화자를 덧붙이지 않고 비인칭적 예고로 옮겼습니다.
- source_word: סֹלּוּ סֹלּוּ
  english_pob_choice: Build up, build up
  chosen_korean: 쌓아 올려라, 쌓아 올려라
  alternatives_korean:
  - 길을 메워라, 길을 메워라
  - 도로를 닦아라, 도로를 닦아라
  - 길을 준비하라, 길을 준비하라
  lexicon: HALOT
  rationale: סלל의 도로 공사 이미지를 살려 ‘쌓아 올리다’로 옮기고, 반복을 그대로 유지해 강조를 드러냈습니다.
- source_word: פַּנּוּ דָרֶךְ
  english_pob_choice: clear the way
  chosen_korean: 길을 닦아라
  alternatives_korean:
  - 길을 치워라
  - 길을 준비하라
  - 길을 비워라
  lexicon: HALOT
  rationale: פנה의 ‘치우다/비우다’ 의미와 דרך의 도로 이미지를 함께 살리되, 한국어에서는 공사 맥락을 자연스럽게 드러내는 ‘길을 닦다’를 택했습니다.
- source_word: מִכְשׁוֹל
  english_pob_choice: stumbling block
  chosen_korean: 걸림돌
  alternatives_korean:
  - 장애물
  - 넘어지게 하는 것
  - 실족하게 하는 돌
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘stumbling block’을 한국어 관용어 ‘걸림돌’로 옮겨 원문의 비유를 보존했습니다.
theological_decisions:
- issue: 마지막 구절의 공간 방향성
  chosen_reading: 내 백성의 길에서 걸림돌을 치워라
  alternative_readings:
  - 내 백성의 길에서 걸림돌을 제거하라
  - 내 백성의 길에서 걸림돌을 없애라
  rationale: מן + דרך의 이동/제거 이미지를 살리면서, ‘from the way of my people’를 한국어의 자연한 위치 관계로 표현했습니다.
  doctrine_reference: 원문의 도로 정비 은유를 약화하지 않고 유지합니다.
