  source_fidelity: 수정이 필요합니다. גּוֹרָלֵךְ를 ‘운명’으로 옮기면 구체적인 ‘제비/배당 몫’의 의미와 앞선 חֶלְקֵךְ와의 의도적인 병행·반복이 약화됩니다. 또한 אֶנָּחֵם은 이 문맥에서 ‘마음을 돌리다/뜻을 거두다’에 더 가깝고, ‘참다’는 원문의 의미 범위를 충분히 반영하지 못합니다.
  naturalness: ‘골짜기의 매끈한 돌들이 너의 몫입니다’와 같이 서술하면 한국어 문장이 자연스럽고 원문의 대조적 어순도 분명합니다. ‘올려드렸습니다’의 높임 보조동사는 우상들에게 제물을 바치는 행위에 부적절한 존대 뉘앙스를 줄 수 있으므로 ‘올렸습니다’가 적절합니다.
