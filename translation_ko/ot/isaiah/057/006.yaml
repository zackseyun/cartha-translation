source:
  edition: WLC
  text: בְּ/חַלְּקֵי נַ֣חַל חֶלְקֵ֔/ךְ הֵ֥ם הֵ֖ם גּוֹרָלֵ֑/ךְ גַּם לָ/הֶ֞ם שָׁפַ֥כְתְּ נֶ֨סֶךְ֙ הֶעֱלִ֣ית מִנְחָ֔ה הַ֥/עַל אֵ֖לֶּה אֶנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
  footnotes:
  - marker: a
    text: Or 'Among the portions of the valley'; the Hebrew likely refers to the smooth stones of a wadi bed, fitting the idolatrous context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Shall I be comforted over these things?' The Hebrew verb can also carry the sense of being comforted or appeased.
    reason: alternative_reading
translation:
  language: ko
  text: 골짜기의 매끈한 돌들[a]이 너의 몫입니다. 그 돌들이, 바로 그 돌들이 너의 제비입니다. 너는 그들에게까지 전제물을 부었고, 곡식 제물을 올렸습니다. 이런 일들 때문에 내가 마음을 돌리겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘골짜기의 몫들’로 옮길 수 있습니다. 히브리어는 아마도 와디 바닥의 매끈한 돌들을 가리키며, 우상숭배의 문맥과 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이런 일들 때문에 내가 위로를 받겠습니까?’로 옮길 수 있습니다. 히브리어 동사는 ‘위로받다’ 또는 ‘달래지다’의 뜻도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  english_pob_choice: Among the smooth stones of the valley
  chosen_korean: 골짜기의 매끈한 돌들 가운데에
  alternatives_korean:
  - 골짜기의 몫들 가운데에
  - 와디의 미끄러운 곳들 가운데에
  lexicon: HALOT
  rationale: חַלְּקֵי는 문맥상 ‘매끈한/미끄러운 돌들’을 가리키는 것으로 이해하는 편이 우상숭배 정황과 잘 맞습니다. נחל은 여기서 현대어로는 ‘골짜기’가 가장 자연스럽습니다.
- source_word: חֶלְקֵךְ
  english_pob_choice: your portion
  chosen_korean: 네 몫
  alternatives_korean:
  - 네 분깃
  - 네 몫의 몫
  lexicon: HALOT
  rationale: חלק의 기본 의미인 ‘할당된 몫’을 살려 앞의 돌들과 이어지는 소유·배당 어감을 유지했습니다.
- source_word: גּוֹרָלֵךְ
  english_pob_choice: your lot
  chosen_korean: 네 운명
  alternatives_korean:
  - 네 제비뽑힌 몫
  - 네 할당된 몫
  lexicon: HALOT
  rationale: 직역하면 ‘제비/몫’이지만, 앞의 ‘몫’과의 반복을 살리면서도 한국어에서 자연스럽게 들리도록 ‘운명’으로 옮겼습니다. 다만 사전적 구체성은 footnote 없이 본문에서 과도하게 풀지 않았습니다.
- source_word: נֶסֶךְ
  english_pob_choice: a drink offering
  chosen_korean: 전제물
  alternatives_korean:
  - 술전제
  - 붓는 제물
  lexicon: HALOT
  rationale: 제의적 용어의 대응성을 위해 ‘전제물’을 택했습니다. 현대어에서는 다소 생소하지만, 이 구절의 우상숭배 제사 맥락을 분명히 드러냅니다.
- source_word: מִנְחָה
  english_pob_choice: a grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 소곡식 제물
  lexicon: HALOT
  rationale: מנחה는 제의 문맥에서 ‘곡식 제물/소제’를 가리킬 수 있으므로, 전통 용어를 완화하되 의미를 분명히 하는 ‘곡식 제물’로 옮겼습니다.
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  english_pob_choice: Shall I relent because of these things?
  chosen_korean: 내가 이런 것들 때문에 참겠습니까?
  alternatives_korean:
  - 내가 이런 것들 때문에 위로를 받겠습니까?
  - 내가 이런 것들 때문에 마음을 돌리겠습니까?
  lexicon: HALOT
  rationale: נחם의 핵심 문맥을 ‘관용/철회/참음’으로 잡아, 우상 제사에 대한 하나님의 반응이 ‘이런 것들 때문에 참을 수 있느냐’는 수사적 질문으로 들리게 했습니다. 영어 POB의 완곡한 ‘relent’를 한국어에서 너무 약화시키지 않도록 했습니다.
theological_decisions:
- issue: 마지막 수사의문의 뉘앙스
  chosen_reading: 우상 제사로 인해 하나님이 관용하거나 유보하실 수 없다는 부정적 수사 의문으로 읽었습니다.
  alternative_readings:
  - 하나님이 ‘위로를 받으실’ 수 있다는 의미
  - 하나님이 ‘마음을 바꾸실’ 수 있다는 의미
  rationale: 문맥이 우상숭배를 고발하므로, 질문은 실제 가능성을 열기보다 오히려 그런 제물들이 하나님의 판결을 바꾸지 못한다는 뜻으로 읽는 것이 타당합니다. 동시에 נחם의 의미 폭은 footnote로 남겨 해석의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
