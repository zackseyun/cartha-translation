  to: 골짜기의 매끈한 돌들[a]이 너의 몫입니다. 그 돌들이, 바로 그 돌들이 너의 제비입니다. 너는 그들에게까지 전제물을 부었고, 곡식 제물을 올렸습니다. 이런 일들 때문에 내가 마음을 돌리겠습니까?[b]
