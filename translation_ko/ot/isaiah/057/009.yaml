id: ISA.57.9
reference: Isaiah 57:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּשֻׁ֤רִי לַ/מֶּ֨לֶךְ֙ בַּ/שֶּׁ֔מֶן וַ/תַּרְבִּ֖י רִקֻּחָ֑יִ/ךְ וַ/תְּשַׁלְּחִ֤י צִרַ֨יִ/ךְ֙ עַד מֵ֣/רָחֹ֔ק וַ/תַּשְׁפִּ֖ילִי עַד שְׁאֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
  footnotes:
  - marker: a
    text: Or possibly, 'to Molech,' if 'the king' is understood as an allusive title for that deity.
    reason: alternative_reading
  - marker: b
    text: Sheol is the realm of the dead.
    reason: cultural_note
translation:
  language: ko
  text: 당신은 기름을 가지고 왕[a]에게 갔으며, 당신의 향료를 많이 늘렸고, 당신의 사절들을 먼 곳까지 보냈으며, 스올[b]에 이르기까지 자신을 낮추었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘몰렉에게’로 이해할 수도 있습니다. 이 경우 ‘왕’은 그 신을 암시하는 호칭일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 스올은 죽은 자들의 영역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  english_pob_choice: You journeyed
  chosen_korean: 갔으며
  alternatives_korean:
  - 여행하였으며
  - 나아갔으며
  - 찾아갔으며
  lexicon: HALOT
  rationale: 문맥상 ‘왕에게’ 향하는 이동을 가리키므로, 한국어에서는 간결하고 자연스러운 ‘갔으며’로 옮겨 길어지는 설명을 피했습니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 그 왕에게
  - 몰렉에게
  lexicon: HALOT
  rationale: 히브리어 본문은 직역하면 ‘왕에게’이므로 본문에는 이를 따르고, 몰렉 가능성은 주석으로만 다루는 편이 본문 충실도에 맞습니다.
- source_word: בַּשֶּׁמֶן
  english_pob_choice: with oil
  chosen_korean: 기름을 가지고
  alternatives_korean:
  - 기름으로
  - 향유를 가지고
  lexicon: HALOT
  rationale: שמן의 기본 의미를 살려 ‘기름’으로 옮기되, 한국어에서는 동반 수단을 자연스럽게 드러내는 ‘가지고’를 사용했습니다.
- source_word: רִקֻּחָיִךְ
  english_pob_choice: your perfumes
  chosen_korean: 네 향품을
  alternatives_korean:
  - 네 향료들을
  - 네 향유들을
  - 네 향내 나는 것들을
  lexicon: HALOT
  rationale: 복합 향료 혼합물을 가리키므로 ‘향품’이 가장 압축적이고, 고전적 교회어보다 본문 이미지에 가깝습니다.
- source_word: צִרַיִךְ
  english_pob_choice: your envoys
  chosen_korean: 네 사자들을
  alternatives_korean:
  - 네 전령들을
  - 네 특사들을
  - 네 사신들을
  lexicon: HALOT
  rationale: 정치적 외교 사절의 뉘앙스를 살리면서 현대 한국어에서 이해가 쉬운 ‘사자들’을 택했습니다.
- source_word: עַד מֵרָחֹק
  english_pob_choice: far away
  chosen_korean: 멀리까지
  alternatives_korean:
  - 아주 먼 곳까지
  - 먼 데까지
  lexicon: HALOT
  rationale: 거리의 확장을 간결하게 전달하는 관용적 표현입니다.
- source_word: וַתַּשְׁפִּילִי
  english_pob_choice: debased yourself
  chosen_korean: 네 자신을 … 낮추었습니다
  alternatives_korean:
  - 네 자신을 비천하게 하였습니다
  - 네 자신을 낮추었습니다
  - 스스로를 낮추었습니다
  lexicon: HALOT
  rationale: 본문의 자기저하·수치의 뉘앙스를 살리되, 한국어에서 과도하게 해석적인 ‘타락시켰다’보다 원문의 동작을 직접적으로 드러냈습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역 ‘스올’을 사용했고, 단순한 ‘무덤’으로 축소하지 않았습니다.
theological_decisions:
- issue: ‘the king’의 이해 가능성(왕 vs. 몰렉 암시)
  chosen_reading: 본문에는 ‘왕’으로 두고, 몰렉 암시는 본문 밖 의미 가능성으로 남깁니다.
  alternative_readings:
  - 몰렉
  - 왕을 가리키는 우회적 표현
  rationale: 마소라 본문은 ‘왕’이라고 읽히며, 본문 수준에서 확정적으로 신격명을 넣기보다 여지를 주는 편이 원문과 주석의 구분을 지킵니다.
  doctrine_reference: Translation philosophy §1, §3
