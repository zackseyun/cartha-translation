translation:
  language: ko
  text: 참으로 당신은 자신을 숨기시는 하나님이시며, 이스라엘의 하나님, 구원자이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 숨기시는 하나님’이 아니라 ‘숨겨진 하나님’으로도 이해할 수 있습니다. 히브리어 분사는 반사적 의미와 상태적 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
