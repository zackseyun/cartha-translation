theological_decisions:
- issue: 하나님의 '숨으심'의 의미
  chosen_reading: 하나님이 자신을 숨기시는 분이라고 옮겨, 본문이 말하는 숨으심의 사실은 유지하되 그 방식이나 이유는 설명하지 않습니다.
  alternative_readings:
  - 숨겨진 하나님
  - 하나님은 보이지 않으시는 분
  rationale: 히브리어 분사는 능동적/반사적 의미를 허용하지만, 본문 자체는 그 숨으심이 섭리인지, 초월성인지, 일시적 은폐인지 규정하지 않습니다.
  doctrine_reference: 해석적 긴장 보존
