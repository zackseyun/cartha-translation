source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
  footnotes:
  - marker: a
    text: Or 'they will make supplication to you.' The Hebrew verb can denote prayer or earnest entreaty.
    reason: lexical_alternative
  - marker: b
    text: '''Cush'' is the Hebrew place-name, traditionally rendered ''Ethiopia'' in some English versions.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「이집트의 재물과 구스의 무역품, 그리고 스바 사람들—키가 큰 사람들—이 너에게로 지나와 네 것이 될 것이며, 그들은 네 뒤를 따라 걸으며 사슬에 매인 채 지나갈 것입니다. 그들은 너에게 절하고 너에게 기도하며 말할 것입니다. ‘참으로 하나님이 네 안에 계시고 다른 분이 없으며, 다른 하나님도 없습니다.’」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 너에게 간청할 것입니다.’ 히브리어 동사는 기도와 간청을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구스’는 히브리어 지명으로, 일부 번역에서는 전통적으로 ‘에티오피아’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC / project default
  rationale: 기존 POB의 하나님의 이름 기본 원칙을 따라 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: יְגִיעַ מִצְרַיִם
  english_pob_choice: wealth of Egypt
  chosen_korean: 이집트의 재물
  alternatives_korean:
  - 이집트의 소득
  - 이집트의 노동의 결실
  lexicon: HALOT
  rationale: 이 문맥에서 יְגִיעַ는 이집트가 산출한 물질적 부를 가리키므로, 자연스럽고 경제적 의미가 드러나는 ‘재물’로 옮겼습니다.
- source_word: סְחַר כּוּשׁ
  english_pob_choice: merchandise of Cush
  chosen_korean: 구스의 무역품
  alternatives_korean:
  - 구스의 상업 이익
  - 구스의 상품
  lexicon: HALOT
  rationale: סְחַר의 상업적·물품적 의미를 살려 ‘무역품’으로 번역해 경제적 교환의 뉘앙스를 보존했습니다.
- source_word: אַנְשֵׁי מִדָּה
  english_pob_choice: men of great stature / men of stature
  chosen_korean: 키가 큰 사람들
  alternatives_korean:
  - 장대한 사람들
  - 체구가 큰 사람들
  lexicon: HALOT
  rationale: 관용구가 신체적 크기를 가리키므로, 한국어에서 가장 즉각적으로 이해되는 표현으로 옮겼습니다.
theological_decisions:
- issue: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ와 אֵלַיִךְ יִתְפַּלָּלוּ의 대상이 시온 자신인지, 시온 안에 계신 하나님을 향한 경배인지
  chosen_reading: 주어를 그대로 살려 ‘너에게 절하고 너에게 기도하며’로 번역하고, 뒤의 고백이 하나님 존재를 분명히 하도록 두었습니다.
  alternative_readings:
  - 너에게 엎드려 경배하며
  - 너에게 간구하며
  rationale: 히브리어의 직접 목적어가 2인칭 여성 단수이므로, 본문이 가진 긴장을 지우지 않도록 직접성을 유지했습니다. 이어지는 고백이 참된 신앙의 초점을 하나님께 둡니다.
  doctrine_reference: 본문의 모호성을 해소하지 않고 보존하는 원칙
- issue: אֱלֹהִים의 마지막 반복을 ‘하나님’으로 옮길지 ‘신’으로 옮길지
  chosen_reading: ‘다른 하나님도 없습니다’로 번역했습니다.
  alternative_readings:
  - 다른 신도 없습니다
  - 다른 신이 없습니다
  rationale: 문맥의 독점적 신앙 고백을 분명히 하면서도, 히브리어 반복의 강한 배타성을 살리기 위해 동일 어휘를 유지했습니다.
  doctrine_reference: 야훼의 유일성과 배타적 신앙 고백
