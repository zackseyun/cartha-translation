source:
  edition: WLC
  text: הִקָּבְצ֥וּ וָ/בֹ֛אוּ הִֽתְנַגְּשׁ֥וּ יַחְדָּ֖ו פְּלִיטֵ֣י הַ/גּוֹיִ֑ם לֹ֣א יָדְע֗וּ הַ/נֹּֽשְׂאִים֙ אֶת עֵ֣ץ פִּסְלָ֔/ם וּ/מִתְפַּלְלִ֔ים אֶל אֵ֖ל לֹ֥א יוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
  footnotes:
  - marker: a
    text: Or 'Assemble yourselves and come; approach together.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the wood of their carved image'; that is, a wooden idol.
    reason: lexical_alternative
  - marker: c
    text: Or 'pray to a god who does not save.'
    reason: alternative_reading
translation:
  language: ko
  text: 모여서 오십시오[a]. 함께 다가오십시오. 너희 민족들의 생존자들아. 그들은 알지 못합니다[c][b]. 곧 자기 새긴 우상의 나무를 지고, 구원하지 못하는 신에게 기도하는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 자신을 모으고 와서; 함께 다가오라.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 새긴 우상의 나무’로, 곧 나무로 만든 우상입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구원하지 못하는 신에게 기도하는 자들’.
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ
  english_pob_choice: Gather yourselves
  chosen_korean: 모여서 오십시오
  alternatives_korean:
  - 스스로 모이십시오
  - 모이십시오
  lexicon: HALOT
  rationale: 집합을 요청하는 복수 명령의 초점과 호응을 살리기 위해, 단순한 ‘모이십시오’보다 반사적 뉘앙스가 드러나는 표현을 택했습니다.
- source_word: וָבֹאוּ הִתְנַגְּשׁוּ יַחְדָּו
  english_pob_choice: and come; draw near together
  chosen_korean: 함께 다가오십시오
  alternatives_korean:
  - 함께 오십시오
  - 함께 접근하십시오
  - 함께 가까이 오십시오
  lexicon: HALOT
  rationale: 연속된 초청 명령을 한국어에서 자연스럽게 압축하되, ‘다가오다’로 ‘draw near together’의 도전적이고 공적 소집 어조를 살렸습니다.
- source_word: פְּלִיטֵי הַגּוֹיִם
  english_pob_choice: you survivors of the nations
  chosen_korean: 너희 민족들의 생존자들
  alternatives_korean:
  - 너희 나라들의 피난자들
  - 너희 민족들의 도망자들
  - 열방의 생존자들
  lexicon: HALOT
  rationale: פְּלִיטֵי를 ‘생존자들’로 옮겨 단순한 도피보다 심판과 역사 속에서 남은 자라는 의미를 드러냈고, vocative를 분명히 하기 위해 ‘너희’를 보완했습니다.
- source_word: עֵץ פִּסְלָם
  english_pob_choice: the wood of their carved image
  chosen_korean: 자기 새긴 우상의 나무
  alternatives_korean:
  - 그들의 새긴 우상의 나무
  - 자기 조각한 우상의 나무
  - 그들의 나무 우상
  lexicon: HALOT
  rationale: ‘나무’와 ‘새긴 우상’을 함께 유지해, 우상의 재료성과 인공성을 동시에 드러내는 직설적 표현을 살렸습니다.
- source_word: לֹא יוֹשִׁיעַ
  english_pob_choice: that cannot save
  chosen_korean: 구원하지 못하는
  alternatives_korean:
  - 구원할 수 없는
  - 구원하지 않는
  - 구원하지 못할
  lexicon: HALOT
  rationale: 히필형의 구원 능력 부재를 한국어 관용으로 자연스럽게 나타내기 위해 ‘못하는’을 택했습니다.
theological_decisions:
- issue: אֵל의 번역에서 ‘하나님’이 아닌 ‘신’을 쓸지 여부
  chosen_reading: 문맥이 우상 숭배를 조롱하는 자리이므로 ‘신’으로 옮겨, 참 하나님을 가리키는 ‘하나님’과 구별했습니다.
  alternative_readings:
  - 하나님
  - 신적 존재
  rationale: 히브리어 אֵל은 여기서 참 하나님 호칭이 아니라, 구원하지 못하는 거짓 신을 조롱적으로 가리키므로 한국어에서도 그 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘그들은 알지 못합니다’의 주어 지시
  chosen_reading: 우상의 무력함을 설명하는 삽입절로 처리하지 않고, 우상을 지고 기도하는 자들을 가리키는 서술로 유지했습니다.
  alternative_readings:
  - 그들은 아무것도 모릅니다
  - 그들은 지식이 없습니다
  rationale: 본문의 책망은 무지 자체보다 우상 숭배자의 책임 있는 무지를 말하므로, ‘알지 못합니다’로 직설적 경책을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 6
