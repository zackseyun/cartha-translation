  to: 모이십시오, 오십시오[a]. 함께 가까이 오십시오, 열방에서 살아남은 자들아. 그들은 알지 못합니다. 그들은 자기들의 조각 우상의 나무를 지고[b] 구원하지 못하는 신에게 기도하는 자들입니다[c].
  rationale: 원문의 세 명령과 호격을 보존하고, ‘열방의 생존자들’이라는 의미를 자연스러운 한국어로 명료화했습니다. 우상 숭배자들의 무지를 가리키는 서술과 그들을 설명하는 분사를 두 문장으로 처리하여 한국어 문법을 자연스럽게 했습니다. 또한 각주 c를 실제 대안이 적용되는 절에 옮겼습니다.
