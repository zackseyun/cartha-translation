  source_fidelity: 개정이 필요합니다. 히브리어는 ‘모이다/오다/함께 가까이 오다’라는 세 명령을 모두 제시하며, 수신자는 ‘열방의 생존자들’입니다. 초안은 첫 두 명령을 한 표현으로 압축하고 ‘너희 민족들의’이라는 부자연스럽고 소유 관계를 암시하는 표현을 사용했습니다. 또한 대명사 ‘자기’는 선행사가 불명확합니다.
  naturalness: ‘너희 민족들의 생존자들아’와 ‘자기 새긴 우상의 나무’는 현대 표준 한국어로 어색하거나 의미가 불분명합니다. ‘열방에서 살아남은 자들아’, ‘자기들의 조각 우상의 나무’로 고치고, 명령들을 분명히 분리하면 합쇼체의 예언적 소집 어조도 자연스럽습니다.
  terminology: אֵל은 이 문맥에서 우상 숭배의 대상으로 제시되므로 ‘하나님’이 아니라 ‘신’이 적절합니다. פֶּסֶל의 인공성과 עֵץ의 재료성을 보존하기 위해 ‘조각 우상의 나무’를 유지하고, 각주에서 나무로 만든 우상이라는 뜻을 밝혔습니다.
