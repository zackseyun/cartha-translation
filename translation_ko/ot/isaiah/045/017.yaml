id: ISA.45.17
reference: Isaiah 45:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
  footnotes:
  - marker: a
    text: Or 'in the LORD'; the Hebrew preposition can express sphere as well as agency.
    reason: alternative_reading
  - marker: b
    text: Or 'you will not be ashamed or humiliated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 야훼 안에서 영원한 구원을 얻습니다[a]. 여러분은 영원히 부끄러움을 당하거나 수치를 겪지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 ‘안에서’와 ‘말미암아/에 의해’의 뉘앙스를 함께 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘부끄러워하거나 수치를 당하지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל֙ נוֹשַׁ֣ע
  english_pob_choice: Israel is saved
  chosen_korean: 이스라엘은 … 구원을 얻습니다
  alternatives_korean:
  - 이스라엘은 구원받습니다
  - 이스라엘은 구원됩니다
  - 이스라엘은 구원을 얻습니다
  lexicon: WLC; HALOT
  rationale: 수동 완료적 예언 진술을 한국어에서는 현재형 평서로 자연스럽게 옮기되, ‘구원을 얻습니다’로 구원 행위의 결과를 드러냈습니다.
- source_word: בַּ/יהוָ֔ה
  english_pob_choice: by Yahweh / in the LORD
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 야훼로 말미암아
  - 야훼에 의해
  - 주님 안에서
  lexicon: WLC; HALOT
  rationale: 전치사 ב의 대안적 의미인 영역/수단의 긴장을 살리기 위해 ‘안에서’를 택해, 단순한 도구 표현으로만 좁히지 않았습니다.
- source_word: תְּשׁוּעַ֖ת עוֹלָמִ֑ים
  english_pob_choice: with an everlasting salvation
  chosen_korean: 영원한 구원
  alternatives_korean:
  - 영원한 구원
  - 끝없는 구원
  - 세세한 구원
  lexicon: WLC; HALOT
  rationale: ‘세대들의 구원’의 관용적 힘을 한국어에서 가장 자연스럽게 보존하는 표현으로 ‘영원한 구원’을 선택했습니다.
- source_word: לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ
  english_pob_choice: you will not be put to shame or disgraced
  chosen_korean: 부끄러움을 당하거나 수치를 겪지 않을 것입니다
  alternatives_korean:
  - 부끄러움을 당하거나 수치를 겪지 않을 것입니다
  - 수치를 당하거나 모욕을 겪지 않을 것입니다
  - 부끄러워지거나 수치스럽게 되지 않을 것입니다
  lexicon: HALOT
  rationale: בושׁ과 כלם의 중첩을 단순 반복으로 지우지 않기 위해 ‘부끄러움’과 ‘수치’를 나란히 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 단락은 히브리 본문의 고유한 언약명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 본문의 신명적 표지를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ביהוה의 의미 긴장
  chosen_reading: 야훼 안에서
  alternative_readings:
  - 야훼로 말미암아
  - 야훼에 의해
  rationale: 전치사 ב가 수단과 영역을 함께 가리킬 수 있으므로, 한쪽으로 과도하게 고정하지 않고 ‘안에서’로 번역해 의미의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
