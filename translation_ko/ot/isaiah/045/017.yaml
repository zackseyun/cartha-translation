  source_fidelity: ‘야훼 안에서’는 בַיהוָה가 가질 수 있는 영역적 의미를 반영하지만, 이 구절의 수동 분사 נוֹשַׁע와 함께는 야훼를 구원의 효력 있는 행위자로 나타내는 ‘야훼로 말미암아’가 본문의 문법과 문맥을 더 직접적으로 반영합니다. 또한 ‘구원을 얻습니다’보다 ‘구원을 받습니다’가 수동태를 더 잘 보존합니다. עַד עוֹלְמֵי עַד의 강조는 ‘영원토록’으로 자연스럽게 드러낼 수 있습니다.
