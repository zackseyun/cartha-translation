id: ISA.45.12
reference: Isaiah 45:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָֽנֹכִי֙ עָשִׂ֣יתִי אֶ֔רֶץ וְ/אָדָ֖ם עָלֶ֣י/הָ בָרָ֑אתִי אֲנִ֗י יָדַ/י֙ נָט֣וּ שָׁמַ֔יִם וְ/כָל צְבָאָ֖/ם צִוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'humanity.' Hebrew 'adam' here is a collective singular for the human race.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 땅을 만들었고, 그 위에 사람을 지었으며, 내 손이 하늘을 펴고, 그 모든 군대를 내가 명령하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’나 ‘인간’. 여기의 히브리어 ‘아담’은 인류 전체를 가리키는 집합적 단수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 만들어냈습니다
  lexicon: HALOT
  rationale: 창조 선언의 첫 동사로서 ‘עשה’의 일반적 의미를 살리되, 뒤의 ‘창조하다’와 구별되도록 자연스러운 ‘만들다’ 계열을 택했습니다.
- source_word: וְאָדָם עָלֶיהָ
  english_pob_choice: man upon it
  chosen_korean: 그 위에 사람을
  alternatives_korean:
  - 그 위에 인간을
  - 그 위에 인류를
  lexicon: HALOT
  rationale: 히브리어의 단수 집합적 אָדָם을 살리면서도 현대 한국어에서 자연스럽게 읽히는 ‘사람’을 선택해 대표적 인류를 가리키는 뜻을 보존했습니다.
- source_word: נָטוּ שָׁמַיִם
  english_pob_choice: stretched out the heavens
  chosen_korean: 하늘을 펴고
  alternatives_korean:
  - 하늘을 펼치고
  - 하늘을 늘어놓고
  lexicon: HALOT
  rationale: ‘נטה’의 이미지인 펼쳐 넓히는 동작을 한국어의 ‘펴다’로 간결하게 옮겨, 시적 평행법을 유지했습니다.
- source_word: וְכָל צְבָאָם
  english_pob_choice: all their host
  chosen_korean: 그 모든 군대를
  alternatives_korean:
  - 그 모든 군상을
  - 그 모든 무리를
  lexicon: HALOT
  rationale: 천상의 질서 있는 무리를 가리키는 ‘צבא’의 집합적 의미를 ‘군대’로 옮겨, 영어 POB의 ‘host’가 담은 천군천사의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: אָדָם의 집합적 의미와 단수 형식
  chosen_reading: ‘사람’으로 옮기되 단수 형식은 유지했습니다.
  alternative_readings:
  - ‘인류’
  - ‘인간’
  rationale: 본문은 개별 남자보다 인류 전체를 가리키지만, 히브리어의 단수 대표 형식을 지우지 않기 위해 ‘사람’을 택했습니다. 필요 시 주석으로 포괄 의미를 보완할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם 항목 및 gender-accurate over gender-neutral 원칙'
- issue: 천상의 ‘군대’ 표현
  chosen_reading: 천체적 질서와 천상 존재들을 함께 암시하는 표현으로 ‘군대’를 유지했습니다.
  alternative_readings:
  - ‘별무리’
  - ‘천군’
  rationale: 본문의 ‘host’는 단순한 별의 집합보다 하나님의 통치 아래 있는 질서 정연한 천상 군대를 함축하므로, 그 긴장을 줄이지 않는 쪽을 택했습니다.
  doctrine_reference: 시적/우주론적 표현의 직역 원칙
