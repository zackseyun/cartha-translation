id: ISA.45.5
reference: Isaiah 45:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ וְ/אֵ֣ין ע֔וֹד זוּלָתִ֖/י אֵ֣ין אֱלֹהִ֑ים אֲאַזֶּרְ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
  footnotes:
  - marker: a
    text: Or 'I arm you' or 'I gird you.' The Hebrew verb can denote equipping or girding for strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼입니다. 다른 이는 없으며, 나 외에는 하나님이 없습니다. 당신이 나를 알지 못했어도, 내가 당신을 강하게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 당신을 강하게 합니다’로 옮긴 히브리어 동사는 ‘무장시키다’, ‘띠를 두르게 하다’, 또는 ‘강하게 하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 보통의 호칭이 아니라 고유명사이므로, POB의 영어 처리와 맞춰 ‘야훼’로 옮겨 신적 이름을 보존했습니다.
- source_word: וְאֵין עוֹד / אֵין אֱלֹהִים
  english_pob_choice: and there is no other; besides me there is no God
  chosen_korean: 다른 이가 없으며, 나 외에는 하나님이 없습니다
  alternatives_korean:
  - 다른 이가 없습니다
  - 나 외에는 신이 없습니다
  lexicon: HALOT
  rationale: 반복되는 배타 진술을 한국어에서도 두 갈래로 살려, ‘다른 이가 없음’과 ‘나 외에는 하나님이 없음’을 병렬로 유지했습니다. ‘하나님’은 이 문맥의 절대적 단언을 가장 분명히 드러냅니다.
- source_word: אֲאַזֶּרְךָ
  english_pob_choice: I strengthen you
  chosen_korean: 내가 당신에게 힘을 주지만
  alternatives_korean:
  - 내가 당신을 강하게 하지만
  - 내가 당신을 무장시키지만
  - 내가 당신을 띠게 하지만
  lexicon: HALOT
  rationale: 어근 אזר는 ‘띠게 하다/무장시키다/강하게 하다’의 폭이 있으나, 현대 독자가 바로 이해할 수 있도록 ‘힘을 주다’로 옮겼습니다. POB의 해석처럼 ‘당신을 강하게 하다’의 의미를 포함합니다.
- source_word: וְלֹא יְדַעְתָּנִי
  english_pob_choice: though you have not known me
  chosen_korean: 하지만 당신은 나를 알지 못합니다
  alternatives_korean:
  - 그러나 당신은 나를 알지 못했습니다
  - 비록 당신이 나를 알지 못하지만
  lexicon: HALOT
  rationale: 전후 문맥상 양보 의미를 살리되, 한국어에서는 자연스러운 대조 접속으로 처리했습니다. ‘알다’는 כאן의 관계적 인식을 유지하면서 과도한 신학적 해석을 덧붙이지 않습니다.
theological_decisions:
- issue: 야훼의 배타적 유일성 진술
  chosen_reading: ‘다른 이가 없으며, 나 외에는 하나님이 없습니다’로 두 번의 배타 표현을 모두 살려 단일 신앙고백을 선명하게 드러냈습니다.
  alternative_readings:
  - ‘다른 신이 없습니다’로 단순화
  - ‘오직 나뿐입니다’로 의역
  rationale: 히브리어의 이중 배타 구조를 보존해야 본문의 유일신 선언과 수사적 강도가 약화되지 않습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 마지막 절의 양보 뉘앙스
  chosen_reading: ‘하지만 당신은 나를 알지 못합니다’로 직설적으로 옮겨, 야훼의 주권적 능력이 인간의 선지식과 무관함을 유지했습니다.
  alternative_readings:
  - ‘비록 당신이 나를 알지 못하지만’
  - ‘당신은 나를 몰랐지만’
  rationale: 문맥상 양보 의미는 분명하지만, 한국어에서는 종속절보다 주절형 대조가 더 자연스러워 본문의 긴장을 덜 훼손합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
