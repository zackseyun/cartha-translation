id: ISA.45.3
reference: Isaiah 45:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לְ/ךָ֙ אוֹצְר֣וֹת חֹ֔שֶׁךְ וּ/מַטְמֻנֵ֖י מִסְתָּרִ֑ים לְמַ֣עַן תֵּדַ֗ע כִּֽי אֲנִ֧י יְהוָ֛ה הַ/קּוֹרֵ֥א בְ/שִׁמְ/ךָ֖ אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'treasures hidden in darkness' for 'treasures of darkness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'hidden treasures of secret places.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너에게 어둠의 보화와 비밀스러운 곳의 감추어진 부를 주겠다[a], 이는 네가 내가 야훼, 곧 네 이름으로 부르는 이스라엘의 하나님임을 알게 하려는 것이다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어둠 속에 숨겨진 보화’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 하나님의 이름 יְהוָה는 여기서 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 내가 … 주겠다
  alternatives_korean:
  - 내가 … 주겠습니다
  - 내가 … 주노라
  lexicon: HALOT
  rationale: 예언적 약속의 미래 의미를 자연스러운 현대 한국어로 살리기 위해 ‘주겠다’를 택했습니다.
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  english_pob_choice: treasures of darkness
  chosen_korean: 어둠의 보화
  alternatives_korean:
  - 어둠 속의 보화
  - 어둠에 감춰진 보화
  lexicon: HALOT
  rationale: 직역 구조를 유지하되 한국어에서는 ‘어둠의 보화’가 이미지와 간결성을 함께 살립니다.
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  english_pob_choice: hidden riches of secret places
  chosen_korean: 비밀스러운 곳의 감추어진 부
  alternatives_korean:
  - 숨겨진 곳의 보화
  - 감추어진 비밀한 곳의 보화
  lexicon: HALOT
  rationale: 중복되는 ‘숨김’의 뉘앙스를 살려 ‘감추어진 부’로 옮기고, מִסְתָּרִים의 은밀한 장소감을 ‘비밀스러운 곳’으로 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: POB의 원칙에 따라 신명기적 고유명사를 ‘야훼’로 옮겨, 호칭 ‘주’와 구별했습니다.
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  english_pob_choice: the one who calls you by name
  chosen_korean: 네 이름으로 부르는 이
  alternatives_korean:
  - 이름으로 너를 부르는 이
  - 네 이름을 부르는 이
  lexicon: HALOT
  rationale: בְשִׁמְךָ의 인칭적 구체성을 살리기 위해 ‘네 이름으로’라고 옮겼고, participle는 관계절로 풀어 자연스럽게 처리했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문에서 하나님의 고유명사 ‘야훼’를 직접 사용했습니다.
  alternative_readings:
  - ‘주’로 대체 표기
  - ‘여호와’
  rationale: 이 절은 하나님이 자신을 알려 주시는 선언이므로, 제목어가 아니라 이름 자체를 드러내는 번역이 본문의 의도를 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘어둠의 보화’의 의미
  chosen_reading: 물질적이면서도 감춰진 보화를 가리키는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 영적인 보화로 비유적으로 완화
  - 일반적인 부유함으로 추상화
  rationale: 문맥상 고레스에게 주어질 숨겨진 재물의 이미지가 강하므로, 본문의 구체성을 흐리지 않도록 직역 성향을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
