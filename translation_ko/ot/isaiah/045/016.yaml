  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
  footnotes:
  - marker: a
    text: Or 'the makers of images go into disgrace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우상들을[a] 만드는 자들은 모두 수치를 당하고 굴욕을 당합니다. 그들은 함께 수치 속으로 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '형상들을'.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשׁוּ
  english_pob_choice: are put to shame
  chosen_korean: 수치를 당하며
  alternatives_korean:
  - 부끄러움을 당하며
  - 수치를 입으며
  lexicon: HALOT
  rationale: בושׁ는 공적 수치와 굴욕의 결과를 가리키므로, 한국어에서는 자연스러운 합쇼체로 '수치를 당하다'를 택해 공개적 망신의 뉘앙스를 살렸습니다.
- source_word: וְגַם
  english_pob_choice: and also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고도
  - 심지어
  lexicon: HALOT
  rationale: 단순 접속보다 앞절에 덧붙는 강화의 기능이 있어 '또한'으로 간결하게 반영했습니다.
- source_word: נִכְלְמוּ
  english_pob_choice: humiliated
  chosen_korean: 굴욕을 당하며
  alternatives_korean:
  - 창피를 당하며
  - 망신을 당하며
  - 굴욕을 입으며
  lexicon: HALOT
  rationale: כלם의 강한 수치·굴욕의 의미를 살리기 위해 첫 번째 동사와 중복되지 않으면서도 강도를 높이는 '굴욕을 당하다'를 선택했습니다.
- source_word: חָרָשֵׁי צִירִים
  english_pob_choice: makers of idols
  chosen_korean: 우상들을 만드는 자들
  alternatives_korean:
  - 우상 제조자들
  - 형상들을 만드는 자들
  - 우상을 만든 장인들
  lexicon: HALOT
  rationale: חָרָשׁ은 제작자/장인을 뜻하고, 여기서는 우상 제작자를 가리키므로 한국어에서는 의미를 분명히 드러내는 '우상들을 만드는 자들'로 옮겼습니다.
theological_decisions:
- issue: צִירִים의 대상 의미
  chosen_reading: 여기서는 '형상들'보다 '우상들'로 드러내어, 본문이 우상 제조를 정죄하는 맥락을 분명히 했습니다.
  alternative_readings:
  - 형상들
  - 조각상들
  rationale: 이사야 45장의 문맥이 여호와와 우상을 대조하므로, 독자가 본문의 논지를 즉시 파악하도록 '우상들'을 본문에 반영했습니다.
  doctrine_reference: 사 45장 우상 비판 문맥
