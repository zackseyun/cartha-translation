  source_fidelity: ‘의로움 가운데서’는 בְצֶדֶק의 자연스러운 한국어 대응이 아니며, הַעִירֹתִהוּ를 ‘깨웠다’로 옮기면 물리적 잠에서 깨우는 뜻이 지나치게 전면화됩니다. ‘의로 그를 일으켰고’는 히필의 사역적 의미와 전치사구를 더 충실하게 반영합니다. גָלוּתִי는 전쟁 포로라기보다 유배된 공동체를 가리키므로 ‘유배민들’이 더 정확합니다. בנה는 ‘세우다’보다 ‘건축하다/짓다’가 이 문맥에서 명시적인 대응입니다.
  naturalness: 원문안은 ‘깨웠고 … 할 것이니 … 줄 것입니다’처럼 시제와 연결 방식이 매끄럽지 않고, ‘의로움 가운데서’도 현대 표준 한국어에서 부자연스럽습니다. 직접 인용 형식 안에서 합쇼체 종결을 일관되게 사용하고, 각 주석 표지를 해당 어구에 붙이면 자연스럽고 읽기 쉽습니다.
  terminology: ‘만군의 야훼’는 יהוה צבאות에 대한 프로젝트의 명명 원칙 및 전통 번역 주석과 부합합니다. ‘성읍’은 עִיר의 문맥상 적절하며, ‘유배민들’은 גָלוּת의 집단적·개인적 의미를 ‘포로들’보다 정확히 보존합니다.
