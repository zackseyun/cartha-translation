id: ISA.45.13
reference: Isaiah 45:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'I have raised him up in righteousness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'He will build my city.' The Hebrew verb is simply 'build'; 'rebuild' reflects the historical context of Jerusalem's restoration.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 의로움 가운데서 깨웠고, 그의 모든 길을 곧게 할 것이니, 그는 내 도시를 세우고 내 포로들을 값도 없이, 뇌물도 없이 보내 줄 것입니다. 만군의 야훼께서 말씀하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로움 가운데 그를 일으켰고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단순히 ‘짓다’입니다. 여기서 ‘세우고’는 예루살렘의 회복이라는 역사적 문맥을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘만군의 여호와’로 옮겨 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  english_pob_choice: I have stirred him up
  chosen_korean: 그를 의로움 가운데서 깨웠고
  alternatives_korean:
  - 그를 의로움 가운데서 일으켰고
  - 그를 의로움 가운데서 불러일으켰고
  lexicon: HALOT
  rationale: עור의 히필은 ‘깨우다, 흔들어 일으키다, 자극하다’의 뜻이어서, 하나님의 주권적 개입을 살리면서도 과도한 해석을 피하는 ‘깨웠고’가 가장 직접적입니다.
- source_word: בְצֶדֶק
  english_pob_choice: in righteousness
  chosen_korean: 의로움 가운데서
  alternatives_korean:
  - 의 안에서
  - 의롭게
  lexicon: HALOT
  rationale: בְצֶדֶק은 도덕적·언약적 정당성을 가리킬 수 있어, 추상명사 ‘의로움’을 살린 표현이 원문의 결을 가장 잘 보존합니다.
- source_word: יִבְנֶה עִירִי
  english_pob_choice: He will rebuild my city
  chosen_korean: 그는 내 도시를 세우고
  alternatives_korean:
  - 그는 내 도시를 재건하고
  - 그는 내 성읍을 세우고
  lexicon: HALOT
  rationale: בנה의 기본 의미는 ‘짓다, 세우다’이므로 직역에 가깝게 두되, 한국어에서 자연스러운 문장으로 ‘세우고’라고 옮겼습니다. 역사적 맥락의 ‘재건’은 해설로 남기고 본문은 원문의 동사를 좇았습니다.
- source_word: גָלוּתִי יְשַׁלֵּחַ
  english_pob_choice: send my exiles away
  chosen_korean: 내 포로들을 ... 보내 줄 것입니다
  alternatives_korean:
  - 내 포로들을 놓아 줄 것입니다
  - 내 유배민들을 돌려보낼 것입니다
  lexicon: HALOT
  rationale: גָלוּת은 포로 상태의 백성을 가리킬 수 있으므로, 한국어에서는 ‘포로들’이 가장 구체적이며, יְשַׁלֵּחַ의 ‘보내다/떠나게 하다’ 의미를 살려 풀었습니다.
- source_word: לֹא בִמְחִיר ... וְלֹא בְשֹׁחַד
  english_pob_choice: not for a price and not for a bribe
  chosen_korean: 값도 없이, 뇌물도 없이
  alternatives_korean:
  - 값을 치르고서가 아니라, 뇌물을 받고서가 아니라
  - 대가 없이, 뇌물 없이
  lexicon: HALOT
  rationale: מְחִיר와 שֹׁחַד의 상업·법정적 대비를 한국어의 대구로 살려, ‘값’과 ‘뇌물’을 병렬로 두었습니다. ‘없이’는 부정의 반복을 자연스럽게 전달합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 야훼 군대들의 주
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로 옮기고, צבאות는 전통적 교회어보다 직역적인 ‘만군’으로 옮겨 원문의 군사적·권능적 울림을 유지했습니다.
theological_decisions:
- issue: 히브리어 동사 구문의 역사적 맥락을 한국어에서 어떻게 처리할지
  chosen_reading: ‘그는 내 도시를 세우고’로 직역 중심을 유지하되, 역사적 재건 의미는 본문 밖 해설에 남깁니다.
  alternative_readings:
  - ‘그는 내 도시를 재건하고’
  - ‘그는 내 예루살렘을 재건하고’
  rationale: בנה는 본래 ‘짓다’이므로, 역사적 맥락을 본문에 과도하게 앞당기기보다 원문의 단어 뜻을 유지하는 편이 더 투명합니다. 도시가 예루살렘임은 문맥이 밝히므로 본문에서는 일반명사로 둡니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘포로들’과 ‘보내다’의 관계를 어떻게 이해할지
  chosen_reading: 해방과 귀환을 함께 암시하는 표현으로 읽습니다.
  alternative_readings:
  - 단순 추방
  - 물리적 송환
  rationale: גָלוּת/יְשַׁלֵּחַ는 포로 상태에서의 해방과 귀환을 동시에 떠올리게 하므로, 한국어도 ‘보내 줄 것입니다’로 두어 강제적 해방의 뉘앙스를 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
