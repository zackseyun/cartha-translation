  lexicon: HALOT
  rationale: רָעַף의 점적·이슬 같은 이미지를 살리면서, 시적 명령형을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: שָׁמַ֨יִם֙ / שְׁחָקִ֖ים
  english_pob_choice: heavens / clouds
  chosen_korean: 하늘들 / 구름들
  alternatives_korean:
  - 하늘 / 구름
  - 하늘과 구름층
  - 창공과 구름
  lexicon: HALOT
  rationale: 병행구의 우주적·시적 호칭을 살리기 위해 복수감이 있는 '하늘들'을 유지하고, שְׁחָקִים는 비를 내리는 '구름들'로 구체화했습니다.
- source_word: צֶדֶק / צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 공의
  lexicon: HALOT
  rationale: 이 문맥에서는 צדק 계열이 구원과 함께 솟아나는 언약적 올바름을 가리키므로, 프로젝트 기본값을 따라 '의'로 옮겼습니다.
- source_word: וּ/יִפְרוּ יֶשַׁע
  english_pob_choice: that salvation may sprout
  chosen_korean: 구원이 싹트고
  alternatives_korean:
  - 구원이 열매를 맺고
  - 구원이 자라고
  - 구원이 솟아나고
  lexicon: HALOT
  rationale: פרה의 식물적 이미지를 그대로 살려, '싹트다'로 구원이 땅에서 생겨나는 모습을 표현했습니다.
- source_word: אֲנִ֥י יְהוָ֖ה
  english_pob_choice: I, Yahweh / I, the LORD
  chosen_korean: 나, 야훼가
  alternatives_korean:
  - 내가 야훼입니다
  - 나, 주님이
  - 내가 여호와입니다
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기본값에 따라 '야훼'로 옮기고, 히브리어의 강조적 어순을 살려 주어를 앞에 두었습니다.
theological_decisions:
- issue: צֶדֶק / צְדָקָה의 의미 범위
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 본절은 하늘과 땅의 풍요 이미지 속에서 구원과 병렬을 이루므로, משפט 계열의 법정적 '정의'보다 넓은 신학적 범주의 '의'가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: צדק-family / δικαιοσύνη principle'
