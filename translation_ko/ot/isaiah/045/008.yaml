  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
  footnotes:
  - marker: a
    text: Or 'let the clouds pour down justice' and 'let justice spring up together'; the Hebrew צדק / צדקה can denote righteousness or justice depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘아, 위에서부터 방울져 내리십시오. 구름아, 의[a]를 쏟아 내리십시오. 땅아, 열려서 구원이 열매를 맺고 의가 함께 싹트게 하십시오. 나 야훼가 이것을 창조하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘의’(צדק)와 뒤의 ‘의’(צדקה)는 문맥에 따라 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְעִ֤יפוּ
  english_pob_choice: Drip down
  chosen_korean: 이슬처럼 떨어져라
  alternatives_korean:
  - 떨어져라
  - 흘러내려라
