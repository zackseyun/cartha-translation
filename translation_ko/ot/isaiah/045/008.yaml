- from: 위에서 이슬처럼 떨어져라, 하늘들아, 그리고 구름들아, 의를 쏟아내라. 땅은 열려서 구원이 싹트고, 의가 함께 돋아나게 하라. 나, 야훼가 이것을 창조하였습니다.[a]
