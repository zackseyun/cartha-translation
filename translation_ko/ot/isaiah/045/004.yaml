  text: 내 종 야곱과 내가 택한 이스라엘을 위하여, 내가 너를 네 이름으로 부르고 너에게 칭호를 주었다.[a] 그러나 너는 나를 알지 못하였다.
  philosophy: optimal-equivalence
  footnotes:
