  text: לְמַ֨עַן֙ עַבְדִּ֣/י יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל בְּחִירִ֑/י וָ/אֶקְרָ֤א לְ/ךָ֙ בִּ/שְׁמֶ֔/ךָ אֲכַנְּ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
  footnotes:
  - marker: a
    text: Or, 'I surnamed you' or 'I gave you a name/title.' The Hebrew verb can refer to assigning a designation or honorific name.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 종 야곱과 내가 택한 이스라엘을 위하여, 내가 너를 네 이름으로 불렀고 너에게 존칭을 주었으나, 네가 나를 알지 못하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘너에게 존칭을 주었으나’. 히브리어 동사는 명칭이나 호칭을 부여하는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: For the sake of
  chosen_korean: …을 위하여
  alternatives_korean:
  - …때문에
  - …을 위해서
  lexicon: HALOT
  rationale: 목적·동기의 뉘앙스를 자연스러운 현대 한국어로 옮기기 위해 ‘…을 위하여’를 택했습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종복
  - 내 일꾼
  lexicon: HALOT
  rationale: 여기서는 야곱에 대한 언약적 호칭이므로 ‘종’이 가장 직역적이며, 문맥상 ‘노예’로 드러낼 필요는 없습니다.
- source_word: בְּחִירִי
  english_pob_choice: my chosen one
  chosen_korean: 내가 택한 이스라엘
  alternatives_korean:
  - 내 선택한 이스라엘
  - 내 택하신 이스라엘
  lexicon: HALOT
  rationale: 형용사적 실체를 한국어에서 자연스럽게 풀어 ‘내가 택한’으로 옮겨, 선택의 의미를 분명히 했습니다.
- source_word: אֲכַנְּךָ
  english_pob_choice: I surnamed you / I gave you a title of honor
  chosen_korean: 너에게 존칭을 주었으나
  alternatives_korean:
  - 너를 일컫는 이름을 주었으나
  - 너에게 칭호를 주었으나
  - 너를 존칭으로 불렀으나
  lexicon: HALOT
  rationale: כנה의 핵심은 단순한 개인명 부여가 아니라 호칭·칭호를 수여하는 것이므로, ‘존칭’으로 그 고양된 의미를 살렸습니다.
theological_decisions:
- issue: 아합칭 서술이 포함하는 신학적 긴장
  chosen_reading: 하나님이 이방 왕에게도 자신의 목적을 따라 이름으로 부르고 칭호를 주셨으나, 그 왕은 하나님을 알지 못했다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘알지 못하였으나’의 의미를 ‘완전히 인정하지는 않았다’ 정도로 완화하는 해석
  rationale: 본문은 하나님의 주권적 부르심과 수신자의 무지 사이의 긴장을 의도적으로 남기므로, 그것을 신앙적 지식의 약화로 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
