language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
  footnotes:
  - marker: a
    text: Or 'and I will make the uneven places level'; the Hebrew phrase is textually and lexically difficult, and some translations render it more specifically as 'mountains' or 'heights.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너보다 앞서 가고, 험한 곳을 평탄하게 하며, 놋문들을 부수고 쇠 빗장들을 잘라 내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 본문과 어휘 면에서 난해합니다. ‘울퉁불퉁한 곳들을 평탄하게 하겠다’로도 옮길 수 있으며, 일부 번역은 이를 더 구체적으로 ‘산들’ 또는 ‘높은 곳들’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי לְפָנֶיךָ אֵלֵךְ
  english_pob_choice: I myself will go before you
  chosen_korean: 내가 너보다 앞서 가며
  alternatives_korean:
  - 내가 너 앞에 가며
  - 내가 너보다 먼저 가며
  lexicon: HALOT
  rationale: לְפָנֶיךָ의 전방 선행 의미를 살리면서, אֲנִי의 강조는 문맥상 자연한 한국어로 반영해 ‘내가’와 어순으로 드러냈습니다.
- source_word: וַהֲדוּרִים אושר
  english_pob_choice: and I will level the rough places
  chosen_korean: 험한 곳을 평탄하게 하겠습니다
  alternatives_korean:
  - 울퉁불퉁한 곳을 고르게 하겠습니다
  - 거친 곳을 평지로 만들겠습니다
  - 산과 언덕을 평탄하게 하겠습니다
  lexicon: HALOT
  rationale: 본문이 형태상 난해하므로, POB의 ‘rough places’처럼 과도하게 특정하지 않고 험난한 지형을 가리키는 넓은 표현으로 옮기되, ‘평탄하게’로 동사적 조성을 살렸습니다.
- source_word: דַּלְתוֹת נְחוּשָׁה
  english_pob_choice: doors of bronze
  chosen_korean: 놋문들을
  alternatives_korean:
  - 청동문들을
  - 놋으로 된 문들을
  - 놋문
  lexicon: HALOT
  rationale: דַּלְתוֹת는 ‘문들’이므로 문학적 자연성과 병행성을 위해 합성형 ‘놋문들’을 택했습니다. 한국어 성경 전통에서 נְחוּשָׁה는 흔히 ‘놋’으로 옮깁니다.
- source_word: וּבְרִיחֵי בַרְזֶל
  english_pob_choice: bars of iron
  chosen_korean: 쇠 빗장들을
  alternatives_korean:
  - 철 빗장들을
  - 쇠 막대들을
  - 철문 빗장들을
  lexicon: HALOT
  rationale: בְרִיח은 문을 잠그는 ‘빗장’이 문맥에 가장 적합하며, בַרְזֶל은 한국어 성경 관용에 따라 ‘쇠’로 옮겨 병렬을 살렸습니다.
- source_word: אֲשַׁבֵּר / אֲגַדֵּעַ
  english_pob_choice: I will break in pieces / I will cut through
  chosen_korean: 부수고 / 잘라 내겠습니다
  alternatives_korean:
  - 산산이 부수고 / 끊어 내겠습니다
  - 깨뜨리고 / 베어 내겠습니다
  - 부숴 버리고 / 잘라 버리겠습니다
  lexicon: HALOT
  rationale: 두 동사는 단순한 파괴보다 강한 결정적 제거를 나타내므로, 첫째는 ‘부수고’, 둘째는 절단의 결과까지 드러내는 ‘잘라 내겠습니다’로 구분했습니다.
theological_decisions:
- issue: 하나님의 선행 약속의 강조
  chosen_reading: “내가 너보다 앞서 가며”로 אֲנִי의 강조를 살렸습니다.
  alternative_readings:
  - 단순히 ‘내가 앞서 가며’로 번역
  - ‘내가 너보다 먼저 가며’로 번역
  rationale: 히브리어의 명시적 대명사 אֲנִי는 단순 정보 이상으로 하나님의 직접적이고 개인적인 인도를 강조하므로, 한국어에서도 주어를 분명히 드러내는 편이 본문 힘을 더 잘 전달합니다.
  doctrine_reference: 하나님의 섭리와 인도
- issue: 난해한 지형 표현의 범위 유지
  chosen_reading: ‘험한 곳’을 택해 산·언덕으로의 과도한 특정화를 피했습니다.
  alternative_readings:
  - ‘산들을’로 구체화
  - ‘울퉁불퉁한 길’을 택함
  rationale: 문자상 난해한 구절을 한 해석에 고정하기보다, 본문의 확실한 의미 범위인 ‘거친/불균형한 지형’을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문 의미 보존과 해석 절제
