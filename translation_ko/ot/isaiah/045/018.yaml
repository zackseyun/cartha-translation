revisions:
- from: 야훼께서 이렇게 말씀하십니다. 그는 하늘들을 창조하신 분이시며 하나님이십니다. 그는 땅을 지으시고 그것을 만드셨으며, 그것을 견고히 세우셨습니다. 그는 그것을 헛되게 창조하지 않으시고, 사람이 살도록 지으셨습니다. 나는 야훼이며, 다른 이가 없습니다.[a]
  to: 하늘을 창조하신 야훼, 곧 하나님께서 이렇게 말씀하십니다. 그분은 땅을 지으시고 만드셨으며, 그것을 견고히 세우셨습니다. 그분은 그것을 황무지로 창조하지 않으시고[a] 사람이 살도록 지으셨습니다. 나는 야훼이며, 다른 이가 없습니다.
  rationale: תֹהוּ를 ‘황무지’로 바로잡아 거주를 위한 창조 목적이라는 본문의 대조를 보존했습니다. 원문 및 영어 감사본의 어휘적 불확실성은 각주에 남겼고, 각주 표지를 해당 단어에 붙였습니다. ‘하늘’은 현대 한국어의 자연스러운 집합적 표현으로 사용했습니다.
  reviewer_model: gpt-5.6-terra
