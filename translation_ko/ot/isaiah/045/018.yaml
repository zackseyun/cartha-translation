  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
  footnotes:
  - marker: a
    text: Or 'he did not create it empty,' 'he did not create it for chaos,' or 'he did not create it formless.' The Hebrew tohu can denote emptiness, desolation, or wasteness; here the contrast with 'to be inhabited' favors 'wasteland.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 그는 하늘들을 창조하신 분이시며 하나님이십니다. 그는 땅을 지으시고 그것을 만드셨으며, 그것을 견고히 세우셨습니다. 그는 그것을 헛되게 창조하지 않으시고, 사람이 살도록 지으셨습니다. 나는 야훼이며, 다른 이가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 그것을 텅 비게 창조하지 않으셨다’, ‘그는 그것을 혼돈을 위해 창조하지 않으셨다’, ‘그는 그것을 형태 없이 창조하지 않으셨다’로도 옮길 수 있습니다. 히브리어 tohu는 공허, 황폐, 황무지의 뜻을 가질 수 있으며, 여기서는 ‘사람이 살도록’과의 대조가 ‘황무지’ 쪽을 더 잘 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 YHWH 처리 원칙에 따라 전통적 대체어 대신 고유한 신명 표기를 살렸습니다.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  english_pob_choice: who created the heavens
  chosen_korean: 하늘들을 창조하신 분이시며
  alternatives_korean:
  - 하늘을 창조하신 분이시며
  - 하늘들을 지으신 분이시며
  lexicon: HALOT
  rationale: 히브리어 복수형 하늘들을 살리고, ברא의 창조 행위를 한국어에서 자연스러운 관형절로 옮겼습니다.
- source_word: לֹא תֹהוּ בְרָאָהּ
  english_pob_choice: he did not create it as a wasteland
  chosen_korean: 그것을 헛되게 창조하지 않으시고
  alternatives_korean:
  - 그것을 황무지로 창조하지 않으시고
  - 그것을 공허하게 창조하지 않으시고
  lexicon: HALOT
  rationale: 문맥상 ‘거주 가능성’과 대조되는 목적 부정을 살리되, תֹהוּ의 의미 폭을 고려해 ‘헛되게’로 옮겼습니다.
- source_word: לָשֶׁבֶת
  english_pob_choice: to be inhabited
  chosen_korean: 사람이 살도록
  alternatives_korean:
  - 거주되도록
  - 살기 위해
  lexicon: HALOT
  rationale: 동사의 목적을 현대 한국어로 자연스럽게 드러내면서, 땅의 의도된 기능이 ‘거주’임을 분명히 했습니다.
- source_word: וְאֵין עוֹד
  english_pob_choice: and there is no other
  chosen_korean: 다른 이가 없습니다
  alternatives_korean:
  - 다른 이가 없습다
  - 다른 존재가 없습니다
  lexicon: HALOT
  rationale: ישעיה의 배타적 진술을 간결한 현대 한국어로 옮겨, 앞의 자아 선언과 호응시키고자 했습니다.
theological_decisions:
- issue: תֹהוּ의 한국어 처리
  chosen_reading: ‘헛되게’로 옮겨 창조 목적의 부정을 드러냄
  alternative_readings:
  - 황무지
  - 공허
  - 혼돈
  rationale: 이 절은 창조의 ‘무질서 상태’보다 땅이 의도된 목적을 갖고 있음을 강조하므로, 거주 가능성과의 대비가 살아나는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, original-language primacy over translation tradition
- issue: הוּא הָאֱלֹהִים의 처리
  chosen_reading: ‘그는 … 하나님이십니다’
  alternative_readings:
  - 그는 하나님이십니다
  - 그는 참 하나님이십니다
  rationale: 히브리어의 식별적·강조적 진술을 살리면서도, 원문에 없는 ‘참’을 덧붙이지 않고 분명한 동일시로 번역했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
