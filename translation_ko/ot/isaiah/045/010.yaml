  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
  footnotes:
  - marker: a
    text: Or ‘What are you begetting?’ The Hebrew verb refers specifically to a father's begetting.
    reason: lexical_alternative
  - marker: b
    text: Or ‘What are you bringing forth?’ The Hebrew evokes a woman's labor pains and childbirth.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지에게 ‘무엇을 낳고 있습니까?’[a]라고 말하거나, 여자에게 ‘무엇을 해산하고 있습니까?’[b]라고 말하는 자에게 화가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무엇을 낳습니까?’ 히브리어 동사는 아버지의 생성 행위를 특별히 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무엇을 낳고 있습니까?’ 히브리어 동사는 여인의 산고와 출산을 함께 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
