base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
  footnotes:
  - marker: a
    text: Or ‘What are you begetting?’ The Hebrew verb refers specifically to a father's begetting.
    reason: lexical_alternative
  - marker: b
    text: Or ‘What are you bringing forth?’ The Hebrew evokes a woman's labor pains and childbirth.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 아버지에게 ‘무엇을 낳고 있습니까?’라고 말하는 자에게, 또는 여자에게 ‘무엇을 해산하고 있습니까?’라고 말하는 자에게 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무엇을 낳으려고 하십니까?’ 히브리어 동사는 아버지의 낳음을 특히 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무엇을 해산시키고 있습니까?’ 히브리어는 여인의 진통과 출산을 불러일으키는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 화가 있도다
  - 슬프도다
  - 재앙이 있습니다
  lexicon: HALOT
  rationale: 예언적 경고/책망의 감탄사를 한국어 합쇼체로 자연스럽게 옮기되, 본문의 강한 질책성을 유지했습니다.
- source_word: לְאָב
  english_pob_choice: to a father
  chosen_korean: 자기 아버지에게
  alternatives_korean:
  - 아버지에게
  - 어떤 아버지에게
  lexicon: HALOT
  rationale: 문맥상 당사자의 아버지를 가리키는 직접 호칭이므로, 한국어에서는 소유 관계가 암시되도록 ‘자기 아버지’로 자연화했습니다.
- source_word: תּוֹלִיד
  english_pob_choice: What are you fathering?
  chosen_korean: 무엇을 낳고 있습니까?
  alternatives_korean:
  - 무엇을 아버지로서 낳고 있습니까?
  - 무엇을 잉태시키고 있습니까?
  lexicon: HALOT
  rationale: 히필형 ילד의 ‘낳다/낳게 하다’ 의미를 살리면서, POB의 아버지-생성 이미지를 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: תְּחִילִין
  english_pob_choice: What are you giving birth to?
  chosen_korean: 무엇을 해산하고 있습니까?
  alternatives_korean:
  - 무엇을 낳고 있습니까?
  - 무엇을 출산하고 있습니까?
  lexicon: HALOT
  rationale: 여성의 산고와 출산을 함께 떠올리게 하는 동사를 선택해, POB 각주가 지적한 ‘해산/산고’의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 아버지와 여자에 대한 수사적 병행
  chosen_reading: 본절의 구체적 부모-출산 이미지를 그대로 유지하고, 대상이 창조주를 따지는 부당한 질문이라는 설명을 본문 밖으로 옮기지 않았습니다.
  alternative_readings:
  - ‘아버지’와 ‘어머니’로 풀어 쓰기
  - 하나님을 향한 항변임을 본문에 직접 명시하기
  rationale: 히브리어 본문은 수사적 비유로 말하므로, 의미를 설명하되 본문 자체를 해설문처럼 바꾸지 않는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 예언서의 수사적 책망과 비유적 언어 보존
