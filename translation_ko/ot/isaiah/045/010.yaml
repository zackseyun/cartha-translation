  - 무엇을 잉태시키고 있습니까?
  lexicon: HALOT
  rationale: 히필형 ילד의 ‘낳다/낳게 하다’ 의미를 살리면서, POB의 아버지-생성 이미지를 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: תְּחִילִין
  english_pob_choice: What are you giving birth to?
  chosen_korean: 무엇을 해산하고 있습니까?
  alternatives_korean:
  - 무엇을 낳고 있습니까?
  - 무엇을 출산하고 있습니까?
  lexicon: HALOT
  rationale: 여성의 산고와 출산을 함께 떠올리게 하는 동사를 선택해, POB 각주가 지적한 ‘해산/산고’의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 아버지와 여자에 대한 수사적 병행
  chosen_reading: 본절의 구체적 부모-출산 이미지를 그대로 유지하고, 대상이 창조주를 따지는 부당한 질문이라는 설명을 본문 밖으로 옮기지 않았습니다.
  alternative_readings:
  - ‘아버지’와 ‘어머니’로 풀어 쓰기
  - 하나님을 향한 항변임을 본문에 직접 명시하기
  rationale: 히브리어 본문은 수사적 비유로 말하므로, 의미를 설명하되 본문 자체를 해설문처럼 바꾸지 않는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 예언서의 수사적 책망과 비유적 언어 보존
