  naturalness: ‘무엇을 낳고 있습니까?’는 한국어에서 남성 주어와 결합할 때 다소 의도적으로 낯설지만, 바로 그 낯섦이 아버지의 생성 행위와 여자의 해산을 대조하는 원문의 수사적 병행을 드러냅니다. ‘무엇을 해산하고 있습니까?’는 현대 표준어의 격식 있는 문맥에서 자연스럽습니다. 문장 전체는 ‘아버지에게’와 ‘여자에게’에 각각 각주를 붙이고 ‘그리고’로 연결하면 더 명료합니다.
