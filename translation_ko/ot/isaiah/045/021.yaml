id: ISA.45.21
reference: Isaiah 45:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
  footnotes:
  - marker: a
    text: 'Or ''bring it near'' / ''present it''; the Hebrew likely carries a courtroom sense: ''present your case.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a just God and a Savior.'
    reason: lexical_alternative
translation:
  language: ko
  text: 말하십시오. 그리고 당신의 사건을 가져오십시오[a]. 참으로, 함께 의논해 보십시오. 누가 이것을 예로부터 들려주었습니까? 누가 옛적부터 그것을 알려 주었습니까? 나, 야훼가 아니었습니까? 나 외에는 다른 하나님이 없으며, 의로운 하나님이자 구원자입니다[c][b]. 나 말고는 아무도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가까이 가져오십시오' / '제시하십시오'; 히브리어는 법정에서 '사건을 제시하다'는 뜻을 담고 있을 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 'YHWH'; 전통적으로는 '주님'으로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '정의로운 하나님이자 구원자'.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  english_pob_choice: Declare it
  chosen_korean: 말하십시오
  alternatives_korean:
  - 선포하십시오
  - 선언하십시오
  lexicon: HALOT
  rationale: 복수 명령형으로 공개적으로 답변을 요구하는 도전문이지만, 한국어에서는 이어지는 법정적 표현과 자연스럽게 연결되도록 공손한 명령형 "말하십시오"로 옮겼습니다.
- source_word: וְהַגִּישׁוּ
  english_pob_choice: present your case
  chosen_korean: 당신의 사건을 가져오십시오
  alternatives_korean:
  - 당신의 주장을 제시하십시오
  - 당신의 변론을 내놓으십시오
  lexicon: HALOT
  rationale: נגשׁ의 법정적 뉘앙스를 살려 단순한 '가져오다'보다 소송 맥락이 드러나도록 "사건을 가져오십시오"로 옮겼습니다. 문맥상 '주장'보다 '사건/소송'이 더 직접적입니다.
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  english_pob_choice: indeed, let them consult together
  chosen_korean: 참으로, 함께 의논해 보십시오
  alternatives_korean:
  - 심지어 함께 상의해 보십시오
  - 과연 함께 상의해 보십시오
  lexicon: HALOT
  rationale: 강조 부사 אַף과 집합적 협의의 뜻을 살려 "참으로"와 "함께 의논해 보십시오"로 옮겼습니다. 대결적 도전의 어조를 유지합니다.
- source_word: מִבַּלְעָדַי / זוּלָתִי
  english_pob_choice: besides me / except me
  chosen_korean: 나 외에는 ... 나 말고는 아무도 없습니다
  alternatives_korean:
  - 나 외에는 ... 없습니다
  - 나 외에는 ... 오직 나뿐입니다
  lexicon: HALOT
  rationale: 두 개의 배타적 표현을 한국어에서도 서로 다른 말로 살려, 하나님의 유일성을 두 번 강조하는 구조를 보존했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 טetragrammaton을 사용하므로, 프로젝트 기본값에 따라 고유한 언약 이름을 '야훼'로 옮겼습니다. 본문 주석으로 영어 POB의 절충을 보완합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֵל צַדִּיק וּמוֹשִׁיעַ의 질서와 의미
  chosen_reading: 의로운 하나님이자 구원자
  alternative_readings:
  - 의로운 하나님이며 구원자
  - 정의로운 하나님이자 구원자
  rationale: צַדִּיק은 '의로운'이 기본값이며, וּמוֹשִׁיעַ는 구원 행위를 수행하는 분이라는 점을 살려 '구원자'로 옮겼습니다. 병렬 구조를 유지하면서 신학적 함의를 과도하게 약화하지 않았습니다.
  doctrine_reference: 'Translation philosophy #5; divine exclusivity formula'
