source:
  edition: WLC
  text: בִּ֣/י נִשְׁבַּ֔עְתִּי יָצָ֨א מִ/פִּ֧/י צְדָקָ֛ה דָּבָ֖ר וְ/לֹ֣א יָשׁ֑וּב כִּי לִ/י֙ תִּכְרַ֣ע כָּל בֶּ֔רֶךְ תִּשָּׁבַ֖ע כָּל לָשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
  footnotes:
  - marker: a
    text: Or 'a word in righteousness'; the Hebrew phrase may emphasize either the righteousness of the word or that it is spoken in righteousness.
    reason: lexical_alternative
  - marker: b
    text: Or 'every tongue will swear' or 'will take an oath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나 자신을 두고 맹세했습니다. 내 입에서 의로운 말[a]이 나왔고, 그것은 다시 돌아가지 않을 것입니다. 내게 모든 무릎이 꿇을 것이며, 모든 혀가 충성을 맹세할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로움 가운데서 나온 말’. 히브리어 표현은 그 말의 의로움 자체를 강조할 수도 있고, 의로움 가운데서 말해졌다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 혀가 맹세할 것입니다’ 또는 ‘모든 혀가 서약할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  english_pob_choice: By myself I have sworn
  chosen_korean: 내가 나 자신으로 맹세했습니다
  alternatives_korean:
  - 나로 맹세했습니다
  - 스스로 맹세했습니다
  lexicon: HALOT
  rationale: אָ֯ oath formula의 자기 지시를 살리면서, 한국어에서는 ‘나 자신으로’가 자가 맹세의 강조를 가장 자연스럽게 드러냅니다.
- source_word: יָצָא מִפִּי צְדָקָה דָּבָר
  english_pob_choice: from my mouth has gone out a righteous word
  chosen_korean: 내 입에서 의로운 말이 나와
  alternatives_korean:
  - 내 입에서 의의 말이 나와
  - 내 입에서 의로운 말씀이 나와
  lexicon: HALOT
  rationale: צְדָקָה דָּבָר의 압축된 결합을 ‘의로운 말’로 옮겨, ‘의로움/올바름’의 성격을 유지하되 교회적 화법의 과도한 격식을 피했습니다.
- source_word: וְלֹא יָשׁוּב
  english_pob_choice: and it will not return
  chosen_korean: 다시 돌아가지 않을 것입니다
  alternatives_korean:
  - 돌아오지 않을 것입니다
  - 철회되지 않을 것입니다
  lexicon: HALOT
  rationale: 직역 이미지인 ‘돌아가지’로 원문의 ‘말이 다시 돌아오지 않음’을 보존했습니다. ‘철회’는 의미는 분명하지만 비유를 덜 살립니다.
- source_word: תִּכְרַע כָּל בֶּרֶךְ
  english_pob_choice: every knee will bow
  chosen_korean: 모든 무릎이 꿇고
  alternatives_korean:
  - 모든 무릎이 굽히고
  - 모든 무릎이 절하고
  lexicon: HALOT
  rationale: 무릎의 굴복/경배 이미지를 한국어 관용구 ‘무릎이 꿇다’로 자연스럽게 옮겼습니다.
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  english_pob_choice: every tongue will swear allegiance
  chosen_korean: 모든 혀가 충성을 맹세할 것입니다
  alternatives_korean:
  - 모든 혀가 맹세할 것입니다
  - 모든 혀가 충성의 맹세를 할 것입니다
  lexicon: HALOT
  rationale: POB의 해석인 ‘swear allegiance’를 반영해, 단순한 발화가 아니라 공개적 충성과 서약의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 보편적 복종/맹세의 성격
  chosen_reading: 모든 무릎과 모든 혀의 최종적 응답을 보편적 경배와 충성의 표현으로 유지하되, 자발성 여부는 단정하지 않았습니다.
  alternative_readings:
  - 모든 혀가 고백할 것입니다
  - 모든 혀가 맹세할 것입니다
  rationale: 히브리어는 야훼의 주권에 대한 보편적 인정만을 말하며, 내적 동기의 성격은 명시하지 않습니다. 따라서 의미를 확장하지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
