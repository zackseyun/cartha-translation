  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 בִּי נִשְׁבַּעְתִּי의 맹세 공식은 ‘내가 나 자신으로’보다 ‘나 자신을 두고’가 현대 한국어에서 더 정확하고 자연스럽습니다. 또한 צְדָקָה דָּבָר의 대안 설명은 해당 어구에 직접 표지되어야 합니다.
