  terminology: ‘의로운 말’, ‘모든 무릎’, ‘모든 혀’, ‘충성을 맹세하다’는 원문의 비유와 공적 충성 서약의 뜻을 무리 없이 보존합니다. ‘의로운 말’에 관한 각주는 맹세 표현이 아니라 해당 명사구에 연결해야 합니다.
