id: ISA.45.19
reference: Isaiah 45:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֧א בַ/סֵּ֣תֶר דִּבַּ֗רְתִּי בִּ/מְקוֹם֙ אֶ֣רֶץ חֹ֔שֶׁךְ לֹ֥א אָמַ֛רְתִּי לְ/זֶ֥רַע יַעֲקֹ֖ב תֹּ֣הוּ בַקְּשׁ֑וּ/נִי אֲנִ֤י יְהוָה֙ דֹּבֵ֣ר צֶ֔דֶק מַגִּ֖יד מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
  footnotes:
  - marker: a
    text: Or 'I did not say to the offspring of Jacob, “Seek me for nothing.”' The Hebrew תֹהוּ can denote emptiness, futility, or formlessness; here the sense is that seeking the LORD is not pointless.
    reason: lexical_alternative
  - marker: b
    text: Or 'I, the LORD, speak what is right' / 'speak justice.' The Hebrew צֶדֶק can carry the sense of righteousness, rightness, or justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 비밀리에 말하지 않았고, 어둠의 땅에 있지도 않았습니다. 나는 야곱의 자손에게 ‘헛되이 나를 찾으십시오’라고 말하지 않았습니다. 나, 야훼는 의를 말하며, 바른 것을 알립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 자손에게 “헛수고로 나를 찾으라”라고 말하지 않았다.’ תֹהוּ는 공허, 무익함, 형체 없음의 뜻을 가질 수 있으며, 여기서는 야훼를 찾는 일이 헛되지 않다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나, 야훼는 바른 것을 말하며’ / ‘의를 말하며’. 히브리어 צֶדֶק은 의, 올바름, 정의의 뜻을 모두 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר / דִּבַּרְתִּי
  english_pob_choice: I did not speak in secret
  chosen_korean: 비밀리에 말하지 않았고
  alternatives_korean:
  - 숨은 곳에서 말하지 않았고
  - 은밀하게 말하지 않았고
  lexicon: HALOT
  rationale: סֵתֶר의 핵심은 ‘숨김/비밀’이므로, 자연스러운 현대 한국어로 ‘비밀리에’라고 옮겨 공개적 계시의 대비를 살렸습니다.
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  english_pob_choice: in a land of darkness
  chosen_korean: 어둠의 땅
  alternatives_korean:
  - 어두운 땅
  - 어둠의 나라
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어에서 자연스러운 명사구로 다듬어, ‘어둠’의 이미지와 장소성을 함께 살렸습니다.
- source_word: לְזֶרַע יַעֲקֹב / תֹּהוּ
  english_pob_choice: to the offspring of Jacob, ‘Seek me in vain.’
  chosen_korean: 야곱의 자손에게 ‘헛되이 나를 찾으십시오’
  alternatives_korean:
  - 야곱의 씨에게 ‘헛되이 나를 찾으십시오’
  - 야곱의 후손에게 ‘나를 찾는 것이 무익하다’
  lexicon: HALOT
  rationale: זֶרַע는 집합적 의미를 지닌 ‘자손’으로 옮겼고, תֹהוּ는 여기서 공허/무익함의 뜻이므로 ‘헛되이’로 처리해 찾음의 무의미함을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 대체 호칭이 아니라 고유명으로 보존하는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: דֹּבֵר צֶדֶק / מַגִּיד מֵישָׁרִים
  english_pob_choice: speak righteousness, declaring what is upright
  chosen_korean: 의를 말하며, 바른 것을 알립니다
  alternatives_korean:
  - 의를 말하며, 정직한 것을 선포합니다
  - 의로 말하며, 바른 것을 밝힙니다
  lexicon: HALOT
  rationale: צֶדֶק과 מֵישָׁרִים의 윤리적·관계적 울림을 유지하면서, 현대 한국어에서 자연스럽고 대조가 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 자기계시가 ‘비밀’이 아닌 공개성과 신뢰성으로 제시되는 방식
  chosen_reading: 하나님은 숨은 계시나 기만이 아니라, 공개적이고 바른 말씀으로 자신을 드러내십니다.
  alternative_readings:
  - 하나님은 감추어진 방식으로 말씀하지 않으십니다.
  - 하나님은 단지 옳은 말만 하신다는 의미입니다.
  rationale: 문맥은 야훼의 계시가 어둠과 헛됨과 대조된다는 점을 강조하므로, 공개성·신뢰성·도덕적 올바름을 함께 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
