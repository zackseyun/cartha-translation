reference: Isaiah 45:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
  footnotes:
  - marker: a
    text: Or 'Look to me and be saved.' The Hebrew verb can denote turning toward someone, and in context may include the sense of directing one's gaze to God.
    reason: lexical_alternative
translation:
  language: ko
  text: “땅 끝의 모든 이들아, 내게로 돌이켜 구원을 받으십시오[a]. 이는 내가 하나님이며 다른 이가 없기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 바라보고 구원을 받으십시오.’ 히브리어 동사는 누군가를 향해 돌이키다를 뜻할 수 있으며, 문맥상 하나님께 시선을 두라는 의미를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  english_pob_choice: Turn to me
  chosen_korean: “내게로 돌이키십시오.”
  alternatives_korean:
  - “내게로 향하십시오.”
  - “내게로 돌이켜 보십시오.”
  lexicon: HALOT
  rationale: פּנה는 방향을 돌이키다/향하다의 뜻이 있어, 단순한 시선보다 회심적 방향 전환을 드러내는 ‘돌이키다’가 문맥에 더 가깝습니다. אֵלַי의 직접적 호소도 ‘내게로’로 살렸습니다.
- source_word: וְהִוָּשְׁעוּ
  english_pob_choice: and be saved
  chosen_korean: “그러면 구원을 받을 것입니다.”
  alternatives_korean:
  - “그리고 구원받으십시오.”
  - “그리고 구원될 것입니다.”
  lexicon: HALOT
  rationale: 니팔 계열의 수동/피동적 의미를 살려, 사람이 구원을 ‘받는’ 쪽을 드러냈습니다. 명령과 약속이 함께 들리도록 한국어에서는 미래적 권면으로 풀었습니다.
- source_word: אַפְסֵי אָרֶץ
  english_pob_choice: the ends of the earth
  chosen_korean: “땅 끝의 모든 사람들아”
  alternatives_korean:
  - “땅 끝의 모든 이들아”
  - “온 땅의 끝들아”
  lexicon: HALOT
  rationale: 히브리어 관용구의 보편적 대상성을 살리면서, 호소 대상을 자연스러운 한국어 호격으로 옮겼습니다. ‘사람들아’는 대상이 인류 전체임을 드러냅니다.
- source_word: אֲנִי אֵל
  english_pob_choice: I am God
  chosen_korean: “내가 하나님이며”
  alternatives_korean:
  - “나는 하나님이며”
  - “내가 하나님이고”
  lexicon: HALOT
  rationale: אֵל을 고유명사가 아니라 신적 칭호 ‘하나님’으로 번역해 선언의 절대성을 유지했습니다. 앞의 권면과 이어지는 이유절 구조도 자연스럽게 연결했습니다.
- source_word: וְאֵין עוֹד
  english_pob_choice: and there is no other
  chosen_korean: “다른 이가 없기 때문입니다.”
  alternatives_korean:
  - “그 외에는 아무도 없기 때문입니다.”
  - “다른 분이 없기 때문입니다.”
  lexicon: HALOT
  rationale: 히브리어의 배타적 유일성 진술을 현대 한국어로 간결하게 옮겼습니다. ‘다른 이가 없다’는 표현이 문맥상 하나님 외의 다른 신이 없다는 뜻을 선명하게 전달합니다.
theological_decisions:
- issue: 보편적 초청과 하나님의 유일성의 연결
  chosen_reading: 모든 민족을 향한 구원 초청을 직설적으로 살리고, 그 근거를 ‘내가 하나님이며 다른 이가 없기 때문입니다’로 유지했습니다.
  alternative_readings:
  - “오직 내가 하나님이므로”
  - “나 외에 다른 이가 없으므로”
  rationale: 본문은 지상의 끝까지 향한 보편적 초청과 유일신 선언을 한 문장 안에서 결합합니다. 한국어에서도 초청과 근거를 분리하지 않고 그대로 연결해 신학적 긴장을 보존했습니다.
  doctrine_reference: Affirmations; Isaiah 45 monotheistic context
