reference: Isaiah 45:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
  footnotes:
  - marker: a
    text: Or 'future things' or 'the coming things.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'my sons'; this may refer collectively to Israel as God's people.
    reason: lexical_alternative
  - marker: c
    text: The wording 'command me' is likely intentionally provocative in context; some understand it as rhetorical rebuke rather than straightforward permission.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼[a]께서 말씀하십니다. “이스라엘의 거룩하신 분이시며 그를 지으신 이가 말씀하십니다. 내 자손[b]에 관한 앞으로 올 일들을 내게 물으라. 내 손의 일에 관하여 내게 명하라[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다가올 일들’, ‘오는 일들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내 아들들’로 되어 있으며, 여기서는 하나님의 백성 이스라엘을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내게 명하라’는 표현은 문맥에서 의도적으로 도발적일 가능성이 있으며, 어떤 이들은 이를 직설적 허용이 아니라 수사적 책망으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 신명은 학술적 음역인 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩한 분
  - 이스라엘의 거룩하신 이
  lexicon: HALOT
  rationale: 히브리어 관용구의 예언자적 호칭을 자연스러운 한국어로 옮기되, 신적 칭호의 장엄함을 유지했습니다.
- source_word: וְיֹצְרוֹ
  english_pob_choice: his Maker
  chosen_korean: 그를 지으신 이
  alternatives_korean:
  - 그의 지으신 분
  - 그의 조성자
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 목적격을 살려 ‘그를’로 옮기고, ‘Maker’는 창조·조성의 이미지를 드러내는 ‘지으신 이’로 번역했습니다.
- source_word: הָאֹתִיּוֹת
  english_pob_choice: the things to come
  chosen_korean: 앞으로 올 일들
  alternatives_korean:
  - 다가올 일들
  - 미래의 일들
  - 오는 일들
  lexicon: HALOT
  rationale: 문맥상 ‘표지’나 ‘문자’가 아니라 장차 일어날 사건들을 가리키므로, 예언적 뉘앙스를 살린 관용적 표현으로 옮겼습니다.
- source_word: בָּנַי
  english_pob_choice: my sons
  chosen_korean: 내 자손
  alternatives_korean:
  - 내 아들들
  - 내 자녀들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수 ‘sons’이지만, 문맥상 언약 백성 이스라엘 전체를 가리킬 수 있어 한국어에서는 대표적 집합 표현인 ‘자손’으로 옮겼습니다.
- source_word: תְּצַוֻּנִי
  english_pob_choice: command me
  chosen_korean: 내게 명하라
  alternatives_korean:
  - 내게 명령하라
  - 나에게 명하라
  - 나를 지시하라
  lexicon: HALOT
  rationale: 히브리어의 직접적이고 도발적인 어조를 살려, 인간이 하나님께 명하는 듯한 충격을 누그러뜨리지 않고 유지했습니다.
theological_decisions:
- issue: ‘명하라’의 직설적 어조를 어떻게 처리할지
  chosen_reading: 본문의 도발적 표현을 그대로 살려 ‘내게 명하라’로 옮겼습니다.
  alternative_readings:
  - 수사적 책망으로 풀어 ‘정녕 내게 명하겠느냐’처럼 완화
  - ‘내게 맡기라’처럼 의미를 순화
  rationale: 히브리어는 실제로 명령형의 강도를 사용하며, 문맥상 반어적 책망일 가능성이 있어도 그 긴장을 본문에 남겨 두는 것이 POB의 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘내 자손’이 이스라엘 공동체를 가리키는지 여부
  chosen_reading: ‘내 자손’으로 직역하고, 집합적 가능성은 본문 밖의 해설에 맡겼습니다.
  alternative_readings:
  - 내 자녀
  - 내 백성
  rationale: 원문은 문법적으로 남성 복수이며, 이를 중성화하면 소스의 형태적 정보가 약해집니다. 집합적 의미는 독자가 문맥에서 파악할 수 있습니다.
  doctrine_reference: Translation philosophy §4
