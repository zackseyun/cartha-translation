- from: 야훼[a]께서 말씀하십니다. “이스라엘의 거룩하신 분이시며 그를 지으신 이가 말씀하십니다. 내 자손[b]에 관한 앞으로 올 일들을 내게 물으라. 내 손의 일에 관하여 내게 명하라[c].”
