  rationale: 원문의 동격적 신적 칭호를 한 문장으로 정리하고, ‘내 아들들’을 원문에 가깝게 복원했습니다. 또한 ‘내 아들들’과 ‘내 손으로 한 일’이 마지막의 도발적인 명령에 수식되도록 원문의 어순과 통사적 긴장을 보존했습니다. 해석상 수사적 책망일 가능성은 본문을 의문문이나 완화 표현으로 바꾸지 않고 각주에 남겼습니다.
