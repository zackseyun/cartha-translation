revisions:
- from: 오직 야훼 안에서만 의와 힘이 있다고 말할 것입니다[a]. 그에게로 그들이 나아올 것이며[b], 그를 향해 분노하던 모든 사람은 수치를 당할 것입니다.
  to: 사람들은 나에 관하여 이렇게 말할 것입니다[a]. “의[b]와 힘은 오직 야훼 안에 있습니다.” 그에게로 사람들이 나아올 것이며, 그에게 격분하던 모든 사람은 수치를 당할 것입니다.
  rationale: 원문의 난해한 לִי אָמַר 구문에 들어 있는 1인칭 요소를 ‘나에 관하여’로 보존하되, 구문의 다른 가능한 이해는 각주에 남겼습니다. 또한 영어 POB 감사 기록에 맞추어 복수형 צְדָקוֹת 관련 각주를 ‘의’에 연결했습니다. יָבֹא의 집합적 단수는 한국어의 자연스러운 복수 주어 ‘사람들이’로 본문에 반영했으므로 별도 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:13:34Z'
