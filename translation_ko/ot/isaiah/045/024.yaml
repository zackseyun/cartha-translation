id: ISA.45.24
reference: Isaiah 45:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֧ךְ בַּ/יהוָ֛ה לִ֥/י אָמַ֖ר צְדָק֣וֹת וָ/עֹ֑ז עָדָי/ו֙ יָב֣וֹא וְ/יֵבֹ֔שׁוּ כֹּ֖ל הַ/נֶּחֱרִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
  footnotes:
  - marker: a
    text: Or, “Only in the LORD are righteousness and strength,” one shall say.
    reason: alternative_reading
  - marker: b
    text: Hebrew צְדָקוֹת is plural, possibly “righteous acts” or “vindications.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 나에 관하여 이렇게 말할 것입니다[a]. “의[b]와 힘은 오직 야훼 안에 있습니다.” 그에게로 사람들이 나아올 것이며, 그에게 격분하던 모든 사람은 수치를 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오직 야훼 안에 의와 힘이 있다”라고 말할 것입니다. 히브리어의 발화 구문은 압축되어 있어 해석이 불확실합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 צְדָקוֹת은 복수형이며, “의로운 행위들” 또는 “변호와 입증들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 참으로
  lexicon: HALOT
  rationale: 배타성과 강조를 드러내는 אַךְ의 기능을 한국어에서는 ‘오직’이 가장 자연스럽게 살립니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서만
  alternatives_korean:
  - 야훼 안에
  - 주 안에서만
  lexicon: HALOT
  rationale: ב의 영역/근거 의미를 살리면서, 본 절의 exclusivity와 결합해 ‘안에서만’으로 옮기는 것이 문맥상 가장 분명합니다.
- source_word: צְדָקוֹת וָעֹז
  english_pob_choice: righteousness and strength
  chosen_korean: 의와 힘
  alternatives_korean:
  - 의와 능력
  - 공의와 힘
  lexicon: HALOT
  rationale: צְדָקוֹת은 여기서 ‘의’로 넓게 두되, 병렬되는 עֹז는 ‘힘’이 가장 직접적입니다. POB의 ‘righteousness’의 폭을 유지하되 한국어에서는 추상명사 두 개를 짧게 맞추는 것이 자연스럽습니다.
- source_word: הַנֶּחֱרִים בּוֹ
  english_pob_choice: who were enraged against him
  chosen_korean: 그를 향해 분노하던 모든 사람
  alternatives_korean:
  - 그에게 격분하던 모든 사람
  - 그와 대적하던 모든 사람
  lexicon: HALOT
  rationale: חָרָה의 ‘불타오르다/격분하다’는 강한 감정을 살리되, בּוֹ의 적대 방향을 ‘향해’로 드러내어 의미를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 편집 지침에 따라 신명기적 고유명사 יהוה는 음역형 ‘야훼’로 옮겨, 본문이 지닌 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לִי אָמַר의 구문 해석
  chosen_reading: 말할 것입니다
  alternative_readings:
  - '말할 것입니다:'
  - 한 사람이 말할 것입니다
  - 내가 말할 것입니다
  rationale: 히브리어의 압축된 보고구문을 한국어에서는 주어를 과잉 특정하지 않고, 본문 흐름상 독자가 ‘누군가가 이렇게 말한다’는 진술로 읽도록 두었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
