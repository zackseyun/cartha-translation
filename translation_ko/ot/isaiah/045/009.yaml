  rationale: 첫 구절을 ‘자기를 지으신 이와 다투는 자’로 고쳐 원문의 소유 관계를 자연스럽게 드러냈습니다. ‘땅의 토기 조각들 가운데 한 조각’이라는 비유를 독립 문장으로 명료하게 처리했습니다. 마지막 수사적 질문과 ‘손’의 주된 번역은 유지하되, 각주에서 가능한 ‘손잡이’ 해석을 어느 한쪽으로 단정하지 않고 보존했습니다.
