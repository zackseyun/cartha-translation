id: ISA.45.9
reference: Isaiah 45:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
  footnotes:
  - marker: a
    text: Or, possibly, “It has no handles,” taking the final clause as the product criticizing the vessel's form rather than the maker's competence.
    reason: lexical_alternative
translation:
  language: ko
  text: 화 있을진저, 자기의 지으신 이를 다투는 사람아 — 땅의 토기 조각들 가운데 한 조각에 불과한 자야! 진흙이 자기 빚는 이에게 「무엇을 만들고 있느냐?」 하고 말하겠느냐? 또는 네 작품이 「그에게는 손이 없다」 하겠느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘그에게는 손잡이가 없다’로 이해할 수도 있지만, 본문은 창조주의 능력을 비난하는 말로 읽는 편이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 오호라
  lexicon: HALOT
  rationale: 예언적 책망과 경고의 발화로서 한국어 성경 문체에서 가장 직접적으로 그 힘을 살립니다.
- source_word: רָב אֶת יֹצְרוֹ
  english_pob_choice: the one who contends with his Maker
  chosen_korean: 자기의 지으신 이를 다투는 사람
  alternatives_korean:
  - 자기의 만드신 이를 다투는 사람
  - 자기의 빚는 이를 시비하는 사람
  lexicon: HALOT
  rationale: רָב의 대립·다툼의 의미를 살리면서, יֹצֵר는 단순한 ‘창조자’보다 ‘지으신 이’로 옮겨 창조자-피조물 대비를 자연스럽게 드러냅니다.
- source_word: חֶרֶשׂ / חַרְשֵׂי אֲדָמָה
  english_pob_choice: a potsherd among the potsherds of the earth
  chosen_korean: 땅의 토기 조각들 가운데 한 조각
  alternatives_korean:
  - 땅의 질그릇 조각들 가운데 한 조각
  - 땅의 조각들 가운데 한 토기 조각
  lexicon: HALOT
  rationale: חֶרֶשׂ의 깨진 그릇 조각 이미지를 살리되, ‘가운데 한 조각’으로 인류의 미미함을 자연스럽게 표현했습니다. אֲדָמָה는 ‘땅’으로 옮겨 흙/땅의 물질적 대비를 유지했습니다.
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ מַה תַּעֲשֶׂה
  english_pob_choice: Shall the clay say to the one who forms it, “What are you making?”
  chosen_korean: 진흙이 자기 빚는 이에게 「무엇을 만들고 있느냐?」 하고 말하겠느냐?
  alternatives_korean:
  - 진흙이 그것을 빚는 이에게 「무엇을 하고 있느냐?」 하고 말하겠느냐?
  - 진흙이 자기 토기장이에게 「무엇을 만드느냐?」 하고 말하겠느냐?
  lexicon: HALOT
  rationale: חֹמֶר을 여기서는 토기장이-진흙 비유의 핵심 재료인 ‘진흙’으로 옮겼고, מַה תַּעֲשֶׂה는 문맥상 ‘무엇을 만들고 있느냐?’가 가장 구체적입니다.
- source_word: אֵין יָדַיִם לוֹ
  english_pob_choice: He has no hands
  chosen_korean: 그에게는 손이 없다
  alternatives_korean:
  - 그에게는 손잡이가 없다
  - 그에게는 솜씨가 없다
  lexicon: HALOT
  rationale: 문자적으로는 ‘그에게 손들이 없다’이지만, POB의 문맥 판단을 따라 제작자의 능력을 비난하는 직설을 살려 ‘손이 없다’로 옮겼습니다.
theological_decisions:
- issue: 피조물의 대항적 발화 형식
  chosen_reading: 본문의 수사적 질문을 그대로 살려, 인간이 창조주를 향해 따지는 불경한 태도를 드러내게 했습니다.
  alternative_readings:
  - 부드러운 훈계문으로 완화
  - 단순한 비유 설명으로 중화
  rationale: 이 절은 창조주-피조물의 경계를 뒤집는 반항을 책망하는 본문이므로, 완화하지 않고 긴장을 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
