  terminology: ‘화가 있다’, ‘지으신 이’, ‘토기 조각’, ‘진흙’, ‘빚는 이’는 예언적 경고와 토기 비유를 자연스럽고 일관되게 전달합니다. ‘손이 없다’는 제작자의 능력을 비난하는 주된 해석을 유지하되, 각주에서 ‘손잡이’라는 가능한 어휘 해석을 중립적으로 제시합니다.
