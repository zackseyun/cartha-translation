  text: 이는 그들이 해가 뜨는 곳에서부터 해가 지는 곳까지[a] 나 외에는 아무것도 없음을 알게 하시려는 것입니다. 나는 야훼[b]이며, 다른 이는 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘해가 뜨는 곳에서부터 해가 지는 곳까지’이며, 동서 전체를 가리키는 시적 표현입니다.
