  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'from the east to the west'; literally, 'from the rising of the sun and from its setting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 해가 뜨는 곳과 지는 곳에서 알게 하려는 것입니다. 나 외에는 아무도 없습니다. 나는 야훼이며, 다른 이가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘해의 뜨는 곳과 해의 지는 곳’이며, 동서 전체를 가리키는 시적 표현입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 본문은 יְהוָה(야훼)를 사용합니다. 전통적으로는 ‘여호와’ 또는 ‘주’로 옮겨 왔습니다.
    reason: source_note
