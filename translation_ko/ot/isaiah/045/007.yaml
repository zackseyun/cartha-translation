source:
  edition: WLC
  text: יוֹצֵ֥ר אוֹר֙ וּ/בוֹרֵ֣א חֹ֔שֶׁךְ עֹשֶׂ֥ה שָׁל֖וֹם וּ/ב֣וֹרֵא רָ֑ע אֲנִ֥י יְהוָ֖ה עֹשֶׂ֥ה כָל אֵֽלֶּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/007.yaml
  text: forming light and creating darkness[a], making peace and creating calamity; I am Yahweh, who does all these things.
  footnotes:
  - marker: a
    text: Or 'creating disaster' or 'creating evil.' Hebrew רָע can mean evil, harm, disaster, or calamity; here, in contrast with 'peace,' it most likely refers to calamity/adversity rather than moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 빛을 빚어 내고 어둠을 창조하며, 평화를 이루고 재앙을 창조하는 야훼입니다. 나는 이 모든 것을 행합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난을 창조하며’ 또는 ‘악을 창조하며’. 히브리어 רָע는 문맥에 따라 악, 해악, 재난, 재앙을 뜻할 수 있습니다. 여기서는 ‘평화’와 대조되어 도덕적 악보다는 재앙이나 해악을 가리킬 가능성이 가장 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצֵר
  english_pob_choice: forming
  chosen_korean: 빛을 빚어 내시고
  alternatives_korean:
  - 빛을 만드시고
  - 빛을 형성하시고
  lexicon: HALOT
  rationale: יוֹצֵר의 ‘형성하다/빚다’ 뉘앙스를 살리기 위해 ‘빚어 내시다’를 택했고, ‘창조하시다’와 병렬을 이루도록 했습니다.
- source_word: וּבֹרֵא חֹשֶׁךְ
  english_pob_choice: creating darkness
  chosen_korean: 어둠을 창조하시며
  alternatives_korean:
  - 어둠을 만드시며
  - 어둠을 빚어 내시며
  lexicon: HALOT
  rationale: בּרא의 강한 창조 동사를 한국어의 ‘창조하다’로 옮겨, ‘빛을 빚어 내시고’와 구별되는 반복 병렬을 유지했습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 화평
  - 안녕
  lexicon: HALOT
  rationale: 이사야 문맥에서 שָׁלוֹם은 단순한 심리적 평안보다 온전한 평화와 복된 질서를 포함하므로, POB 기본어인 ‘평강’을 사용했습니다.
- source_word: רָע
  english_pob_choice: calamity
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 불행
  - 악
  lexicon: HALOT
  rationale: 문맥상 שָׁלוֹם과 대조되는 רָע는 도덕적 ‘악’보다 재난/해악을 뜻하므로, 하나님이 도덕적 악을 창조하신다는 오해를 피하면서도 강도를 유지하는 ‘재앙’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 여호와 대신 학술적 전사 ‘야훼’를 사용해 언약적 고유명을 드러냈습니다.
theological_decisions:
- issue: רָע의 신학적 함의
  chosen_reading: ‘재앙’으로 번역해 하나님의 주권 아래 있는 심판적 해악을 드러냈습니다.
  alternative_readings:
  - 악
  - 재난
  - 불행
  rationale: 본문은 평강과 대조되는 רע를 말하므로 도덕적 악의 창조를 주장하기보다, 하나님이 재난과 심판까지 주권적으로 주관하신다는 예언서의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 직접 사용하는 언약명 יְהוָה를 한국어 본문에서도 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
