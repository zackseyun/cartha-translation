source:
  edition: WLC
  text: כֹּה אָמַ֣ר יְהוָה֮ לִ/מְשִׁיח/וֹ֮ לְ/כ֣וֹרֶשׁ אֲשֶׁר הֶחֱזַ֣קְתִּי בִֽ/ימִינ֗/וֹ לְ/רַד לְ/פָנָי/ו֙ גּוֹיִ֔ם וּ/מָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִ/פְתֹּ֤חַ לְ/פָנָי/ו֙ דְּלָתַ֔יִם וּ/שְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
  footnotes:
  - marker: a
    text: Hebrew 'his anointed' uses the same word family later associated with 'Messiah'; here it refers to Cyrus as one appointed by the LORD for this task.
    reason: lexical_alternative
  - marker: b
    text: Or 'to ungird the loins of kings,' an idiom for weakening or disarming them.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'doors' is a dual form, possibly 'double doors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 기름부음 받은 자[a], 곧 고레스에게 이렇게 말씀하십니다. “내가 그의 오른손을 붙들어 그 앞에서 민족들을 굴복시키고, 왕들의 허리를 풀며[b], 그의 앞에 문들을 열겠다[c]. 성문들은 닫히지 않을 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 기름부음 받은 자’는 후에 ‘메시아’와 연결되는 같은 어근을 사용합니다. 그러나 여기서는 야훼께서 이 일을 위해 세우신 고레스를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕들의 허리띠를 풀며.’ 왕들의 힘을 꺾거나 무장을 해제하는 것을 가리키는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘문들’은 쌍수형으로, ‘두 짝 문들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 하나님의 이름은 학술적 음역인 ‘야훼’로 옮겨, 언약적 호칭의 힘을 살렸습니다.
- source_word: לִמְשִׁיחוֹ
  english_pob_choice: his anointed
  chosen_korean: 그의 기름부음 받은 자
  alternatives_korean:
  - 그의 메시아
  - 그의 기름부은 자
  lexicon: HALOT
  rationale: 이 단어는 문자적으로 ‘기름부음 받은 자’이며, 여기서는 고레스를 가리키므로 후대의 특수한 메시아 칭호를 앞서 적용하지 않도록 했습니다.
- source_word: הֶחֱזַקְתִּי בִימִינוֹ
  english_pob_choice: whose right hand I have grasped
  chosen_korean: 그의 오른손을 붙잡아
  alternatives_korean:
  - 그의 오른손을 붙들어
  - 그의 오른손을 잡아
  lexicon: HALOT
  rationale: 하나님이 실제로 손을 붙잡아 지지하고 권능을 부여하신다는 구체적 이미지를 살리기 위해 ‘붙잡아’로 옮겼습니다.
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  english_pob_choice: to loosen the belts of kings
  chosen_korean: 왕들의 허리띠를 풀며
  alternatives_korean:
  - 왕들의 허리를 풀며
  - 왕들의 허리끈을 풀며
  lexicon: HALOT
  rationale: English audit의 ‘belts of kings’를 따라, 왕들의 힘과 준비가 풀리는 몸의 이미지를 한국어로 자연스럽게 유지했습니다.
theological_decisions:
- issue: מְשִׁיחוֹ를 고레스에게 적용하는 방식
  chosen_reading: ‘기름부음 받은 자’로 직역해 고레스가 야훼의 도구로 세움받았다는 역사적 의미를 드러냈습니다.
  alternative_readings:
  - ‘메시아’로 번역해 종말론적 함의를 강하게 부각하는 방법
  rationale: 본문은 고레스를 가리키므로, 후대의 구원자 칭호를 그대로 이식하면 본문의 역사적 놀라움을 약화시킬 수 있습니다.
  doctrine_reference: 칭호는 번역하고, 인명은 음역하며, 본문이 의도한 신학적 긴장은 보존합니다.
