id: ISA.45.25
reference: Isaiah 45:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יהוָ֛ה יִצְדְּק֥וּ וְ/יִֽתְהַלְל֖וּ כָּל זֶ֥רַע יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
  footnotes:
  - marker: a
    text: Or 'will be vindicated.' The Hebrew verb can mean being shown to be in the right as well as being justified.
    reason: alternative_reading
  - marker: b
    text: Literally 'the seed of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 안에서 이스라엘의 모든 자손[b]은 의롭다 함을 받고[a] 자랑할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정당함이 입증될 것입니다.’ 히브리어 동사는 ‘옳은 것으로 드러나다’와 ‘의롭다 함을 받다’의 뜻을 모두 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘이스라엘의 씨’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  english_pob_choice: In Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 야훼로 말미암아
  - 야훼로부터
  - 야훼 안에
  lexicon: HALOT
  rationale: ב + יהוה는 이 절에서 관계의 근거와 영역을 함께 나타내므로, 한국어로는 관용적이면서도 본문 구조를 살리는 ‘안에서’가 가장 자연스럽습니다.
- source_word: יִצְדְּקוּ
  english_pob_choice: will be justified
  chosen_korean: 의롭게 되고
  alternatives_korean:
  - 의롭다 함을 받고
  - 의롭다 여김을 받고
  - 정당함이 입증되고
  lexicon: HALOT
  rationale: צדק의 이 절 맥락에서는 ‘의롭다 함을 받다’의 선언적 의미와 ‘정당함을 입증되다’의 결과적 의미가 겹치므로, 합쇼체에서 과도하게 신학 용어를 늘리지 않으면서도 상태 변화를 드러내는 ‘의롭게 되고’로 옮겼습니다.
- source_word: וְיִתְהַלְל֖וּ
  english_pob_choice: and will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 영광을 돌릴 것입니다
  - 자부할 것입니다
  - 기뻐할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 הלל은 자기 자신을 자랑하거나 자랑으로 삼는 뜻이므로, 현대 한국어에서는 ‘자랑하다’가 가장 직접적으로 대응합니다. 다만 대상이 야훼이므로 경건한 ‘영광을 돌리다’로 완화하지 않았습니다.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  english_pob_choice: all the offspring of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 씨앗
  - 이스라엘의 모든 후손
  - 이스라엘의 모든 자녀
  lexicon: HALOT
  rationale: זֶרַע는 직역하면 ‘씨’이지만, 현대 한국어 성경 문맥에서는 집단적 후손을 뜻하는 ‘자손’이 자연스럽고 오해가 적습니다. ‘모든’은 כָּל의 포괄성을 살립니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 사역 본문에서 텍스트적으로 יְהוָה를 직접 포함하므로, 프로젝트 기본 원칙에 따라 한국어 본문에서도 신명음을 음역한 ‘야훼’를 유지했습니다. 이는 용어 일관성과 원문 가시성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: צדק의 의미 범위
  chosen_reading: 의롭게 되고
  alternative_readings:
  - 정당함이 입증되고
  - 의롭다 함을 받고
  rationale: 문맥상 야훼 안에서 이스라엘의 후손에게 일어나는 선언적/관계적 변화가 핵심이므로, 구원론적 무게를 살리되 ‘입증됨’만으로 좁히지 않는 표현을 택했습니다. 동시에 원문의 긴장인 ‘의롭다’와 ‘입증되다’의 두 가능성은 주석으로 보존합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
