  source_fidelity: 원문의 בַּיהוָה는 ‘야훼 안에서’로 적절히 보존되었고, כָּל זֶרַע יִשְׂרָאֵל도 ‘이스라엘의 모든 자손’으로 자연스럽게 옮겼습니다. 다만 יִצְדְּקוּ는 ‘의롭게 되고’보다 법정적·선언적 뉘앙스를 더 직접 보존하는 ‘의롭다 함을 받고’가 안전합니다. 후자는 ‘의롭게 만들어지다’로 읽힐 수 있는 상태 변화의 뉘앙스를 피하면서도, 각주에 보존된 ‘정당함이 입증되다’라는 대안을 방해하지 않습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘의롭다 함을 받고’는 성경 문맥에서 확립된 격식 있는 표현이며, ‘자랑할 것입니다’는 히트파엘의 ‘자랑하다/자랑으로 삼다’ 의미를 과도하게 완화하지 않습니다.
