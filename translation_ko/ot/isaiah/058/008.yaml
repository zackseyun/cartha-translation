id: ISA.58.8
reference: Isaiah 58:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז יִבָּקַ֤ע כַּ/שַּׁ֨חַר֙ אוֹרֶ֔/ךָ וַ/אֲרֻכָתְ/ךָ֖ מְהֵרָ֣ה תִצְמָ֑ח וְ/הָלַ֤ךְ לְ/פָנֶ֨י/ךָ֙ צִדְקֶ֔/ךָ כְּב֥וֹד יְהוָ֖ה יַאַסְפֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
  footnotes:
  - marker: a
    text: Or 'your recovery' or 'your restoration' for 'your healing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your justice' for 'your righteousness.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally, 'the glory of the LORD will be your rear guard.' The Hebrew verb more literally means 'will gather you' or 'gather you up' from behind.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에는 네 빛이 새벽처럼 터져 나오고, 네 치유가 속히 솟아날 것입니다. 네 의가 네 앞에 가고, 야훼의 영광이 네 뒤를 지켜 줄 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 회복’이나 ‘네 복원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘야훼의 영광이 네 뒤를 지킬 것이다’로 옮겨 왔습니다. 히브리어 동사는 더 문자적으로는 ‘뒤에서 너를 모으다/거두다’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע כַּשַּׁחַר
  english_pob_choice: will break forth like the dawn
  chosen_korean: 새벽처럼 터져 나오고
  alternatives_korean:
  - 새벽처럼 일어나고
  - 새벽처럼 밝아지고
  lexicon: HALOT
  rationale: בקע의 ‘터지다/갈라지다’라는 강한 발생 이미지를 살리면서, שׁחר의 ‘새벽’ 비유를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֲרֻכָתְךָ מְהֵרָה תִצְמָח
  english_pob_choice: your healing will spring up quickly
  chosen_korean: 네 치유가 속히 솟아날 것입니다
  alternatives_korean:
  - 네 회복이 속히 솟아날 것입니다
  - 네 치유가 빠르게 자라날 것입니다
  lexicon: HALOT
  rationale: אֲרֻכָה의 치유/회복 의미를 ‘치유’로 기본 반영하되, תִצְמָח의 식물적 이미지인 ‘솟아나다’로 동사를 살렸습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 네 의
  alternatives_korean:
  - 네 공의
  - 네 정의
  lexicon: HALOT
  rationale: 이 절에서는 צדק을 단순한 사회정의보다 언약적·도덕적 ‘의’로 두는 편이 앞뒤 문맥과 병행 구조를 더 잘 반영합니다.
- source_word: יַאַסְפֶךָ
  english_pob_choice: will be your rear guard
  chosen_korean: 네 뒤를 지켜 줄 것입니다
  alternatives_korean:
  - 네 뒤에서 너를 모아 줄 것입니다
  - 네 뒤를 모아 줄 것입니다
  lexicon: HALOT
  rationale: אסף의 기본 뜻인 ‘모으다/거두다’를 배경으로 하되, 앞에 가는 의와 뒤를 잇는 야훼의 영광이라는 대비를 한국어로 자연스럽게 풀어 썼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대신 신명기적 고유명칭의 음역인 ‘야훼’를 유지해, 원문이 가진 언약 이름의 직접성을 살렸습니다.
theological_decisions:
- issue: צִדְקֶךָ를 ‘의’로 둘지 ‘정의’로 둘지
  chosen_reading: 네 의
  alternative_readings:
  - 네 정의
  - 네 공의
  rationale: 이사야 58장은 사회적 정의를 강하게 다루지만, 여기서는 의가 인격화되어 앞서 가는 이미지이므로 ‘의’가 가장 넓고도 본문 친화적입니다.
  doctrine_reference: 'Translation philosophy #3; contested-terms handling for δικαιοσύνη/צדק'
- issue: יַאַסְפֶךָ의 의미를 본문에 어떻게 드러낼지
  chosen_reading: 네 뒤를 지켜 줄 것입니다
  alternative_readings:
  - 네 뒤에서 너를 모아 줄 것입니다
  - 네 뒤를 모아 줄 것입니다
  rationale: 문맥상 보호의 기능이 분명하므로, 직역적 ‘모으다’의 의미를 완전히 지우지 않되 독자가 즉시 이해할 수 있는 보호 표현으로 제시했습니다.
  doctrine_reference: Source-first equivalence with preserved semantic tension
