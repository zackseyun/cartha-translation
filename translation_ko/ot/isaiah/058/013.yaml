  naturalness: ‘당신의 기쁨을 행하다’는 현대 한국어에서 자연스럽지 않고 חפץ의 문맥상 ‘자기 뜻/자기 일’을 추구한다는 뜻도 충분히 전달하지 못합니다. ‘자신이 바라는 일을 하다’와 ‘자기 뜻을 추구하다’는 병렬을 유지하면서 자연스럽습니다. ‘한 마디도 하지 않다’는 지나치게 절대적인 침묵 명령으로 들릴 수 있으므로, 본문은 문자적 표현을 유지하되 주석에서 문맥적 가능성을 밝혀야 합니다.
