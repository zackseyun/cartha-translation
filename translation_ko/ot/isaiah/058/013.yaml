source:
  edition: WLC
  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
  footnotes:
  - marker: a
    text: Or 'and honor him,' taking the pronoun as referring to the LORD rather than to the Sabbath.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'nor speaking a word'; this may mean refraining from ordinary, self-serving, or idle speech.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'your own pleasure' can also mean 'your own desire' or, in context, 'your own business.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 안식일에서 발을 돌이키고[a], 나의 거룩한 날에 자신이 바라는 일을 하지 않으며[c], 안식일을 기쁨이라 부르고 야훼의 거룩한 날을 존귀한 날이라 부르며, 그 날을 존중하여[d] 자신의 길을 따르지 않고, 자기 뜻을 추구하지 않고[c], 말을 하지 않는다면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘안식일에서 당신의 발을 돌리다’입니다. 안식일을 침해하거나 범하지 않도록 삼가는 뜻으로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘말을 말하다’입니다. 문맥상 일상적인 말, 자기 이익을 위한 말, 또는 헛된 말을 삼가는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘자신의 기쁨/뜻’은 ‘자신이 바라는 것’, ‘자신의 일’, 또는 ‘자신의 즐거움’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그 날을’에 해당하는 히브리어 대명사는 문맥상 안식일 또는 야훼의 거룩한 날을 가리키는 것으로 읽는 것이 자연스럽습니다. 야훼를 가리켜 ‘그분을 존중하며’로 읽을 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  english_pob_choice: turn back your foot from the Sabbath
  chosen_korean: 안식일에서 발을 돌리고
  alternatives_korean:
  - 안식일에서 발을 되돌리고
  - 안식일을 밟지 않도록 발을 거두고
  lexicon: HALOT
  rationale: ‘발을 돌리다’로 히브리어의 구체적 이미지를 살리면서, 안식일을 침범하지 않고 물러선다는 뜻을 자연스럽게 드러냅니다.
- source_word: עֲשׂוֹת חֲפָצֶיךָ / מִמְּצוֹא חֶפְצְךָ
  english_pob_choice: doing your own pleasure / seeking your own pleasure
  chosen_korean: 당신의 기쁨을 행하지 않으며 / 자기 기쁨을 구하지 아니하고
  alternatives_korean:
  - 당신의 뜻대로 하지 않으며
  - 당신의 사사로운 일에 마음을 쓰지 않으며
  - 자기 욕구를 추구하지 아니하고
  lexicon: HALOT
  rationale: חפץ의 ‘기쁨/바람/뜻’ 범위를 보존하려고 두 번의 병렬을 각각 ‘기쁨’과 ‘구하다’로 옮겼습니다. 문맥상 자기중심적 추구라는 뉘앙스를 지우지 않으면서도 원문의 어휘 결속을 살립니다.
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  english_pob_choice: the holy thing of Yahweh honorable
  chosen_korean: 야훼의 거룩한 것을 존귀하다 하며
  alternatives_korean:
  - 야훼의 거룩한 일을 존귀하다 하며
  - 야훼의 거룩한 날을 존귀하다 하며
  - 야훼께 속한 거룩한 것을 존귀하다 하며
  lexicon: HALOT
  rationale: 히브리어의 압축된 구조를 따라 ‘거룩한 것’으로 옮겼습니다. POB의 ‘holy thing’ 해석을 반영하되, 안식일 자체를 가리키는 것으로도 읽히는 긴장을 보존합니다.
- source_word: וְכִבַּדְתּוֹ
  english_pob_choice: and honor it
  chosen_korean: 존귀하다 하며
  alternatives_korean:
  - 그것을 존귀하게 여기며
  - 그를 존귀하게 여기며
  - 그것을 공경하며
  lexicon: HALOT
  rationale: 히브리어 3인칭 목적어가 안식일/거룩한 것인지, 야훼 자신인지가 문맥상 긴장 관계에 있어 한국어에서는 주어를 명시적으로 덜 고정하는 표현을 택했습니다.
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  english_pob_choice: by not going your own ways
  chosen_korean: 자기 길을 따르지 아니하고
  alternatives_korean:
  - 자기 길로 가지 아니하고
  - 자기 행실을 따르지 아니하고
  - 자기 방식대로 하지 아니하고
  lexicon: HALOT
  rationale: ‘길’의 비유를 살리면서도 한국어에서 가장 자연스러운 윤리적 표현으로 옮겼습니다.
- source_word: וְדַבֵּר דָּבָר
  english_pob_choice: nor speaking a word
  chosen_korean: 한 마디도 하지 아니하고
  alternatives_korean:
  - 아무 말도 하지 아니하고
  - 말 한마디도 하지 아니하고
  - 말을 내지 아니하고
  lexicon: HALOT
  rationale: 직역의 간결함을 살리되, 실제 독자가 이해할 수 있도록 관용적으로 다듬었습니다. POB의 주석처럼 일상적·자기중심적 말의 절제를 넌지시 보존합니다.
theological_decisions:
- issue: וְכִבַּדְתּוֹ의 지시 대상
  chosen_reading: 안식일/야훼의 거룩한 것을 존귀하게 여기는 쪽으로 열어 두되, 본문에서는 안식일을 직접 가리키는 흐름을 따랐습니다.
  alternative_readings:
  - 야훼를 존귀하게 여기다
  - 안식일을 존귀하게 여기다
  rationale: 문맥은 안식일을 중심으로 전개되지만, 3인칭 목적어가 야훼를 가리킬 가능성도 완전히 배제되지 않습니다. 한국어 본문에서는 과도하게 단정하지 않고, 감사/존귀의 행위를 유지하는 방식으로 긴장을 보존했습니다.
  doctrine_reference: 본문의 문법적 모호성을 해소하지 않고 유지하는 원칙
- issue: ‘한 마디도 하지 아니하고’의 범위
  chosen_reading: 안식일에 자기중심적 말과 일상적 잡담을 삼가는 의미를 암시하되, 본문에는 더 넓은 침묵 명령으로 고정하지 않았습니다.
  alternative_readings:
  - 완전한 침묵
  - 잡담의 절제
  - 자기 이익을 위한 말의 중단
  rationale: 히브리어는 문자적으로 ‘한 말’을 말하지만, 문맥상 일상적·자기중심적 발화를 멈추라는 뜻일 수 있습니다. 한국어는 직역성과 해석 가능성을 함께 살렸습니다.
  doctrine_reference: 어휘적 긴장 보존
