id: ISA.58.10
reference: Isaiah 58:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
  footnotes:
  - marker: a
    text: Or 'draw out your soul to the hungry.' The Hebrew idiom uses 'soul' (נֶפֶשׁ) for the self or life.
    reason: lexical_alternative
  - marker: b
    text: Or 'the afflicted person'; Hebrew 'soul' here often refers to the whole person, not only the immaterial aspect.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 네가 주린 자에게 네 자신을 내어 주고, 고난받는 영을 만족하게 하면, 네 빛이 어둠 속에서 떠오르고 네 캄캄함이 대낮 같을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ는 여기서 단순한 ‘영혼’보다 전인이나 자기 자신을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ는 여기서도 ‘고난받는 사람’이나 전인을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק
  english_pob_choice: pour yourself out
  chosen_korean: 네 자신을 내어 주고
  alternatives_korean:
  - 네 영혼을 쏟고
  - 스스로를 내어 주고
  - 네 자신을 쏟아 주고
  lexicon: HALOT
  rationale: פּוּק/הִפְעִיל의 관용적 용법과 נֶפֶשׁ 결합은 단순 제공보다 자기 소진적 헌신을 뜻하므로, 자연스러운 현대어로 ‘네 자신을 내어 주고’가 가장 잘 드러냅니다.
- source_word: לָרָעֵב
  english_pob_choice: for the hungry
  chosen_korean: 주린 자에게
  alternatives_korean:
  - 배고픈 자에게
  - 주린 사람에게
  lexicon: HALOT
  rationale: ל의 수혜 대상을 살리면서 רָעֵב의 상태를 간결하게 옮기기 위해 ‘주린 자에게’를 택했습니다.
- source_word: וְנֶפֶשׁ נַעֲנָה
  english_pob_choice: the afflicted soul
  chosen_korean: 고난받는 영
  alternatives_korean:
  - 고난받는 사람
  - 겸손한 영
  - 괴로워하는 혼
  lexicon: HALOT
  rationale: נֶפֶשׁ가 여기서는 단순한 비물질적 ‘영혼’보다 고통받는 전인(whole person)을 가리키지만, 한국어에서 ‘영’이 그 내부적 생명/자아를 비교적 자연스럽게 전달하므로 ‘고난받는 영’으로 옮겼습니다.
- source_word: תַּשְׂבִּיעַ
  english_pob_choice: satisfy
  chosen_korean: 만족하게 하면
  alternatives_korean:
  - 배부르게 하면
  - 충분히 채우면
  - 만족시켜 주면
  lexicon: HALOT
  rationale: שׂבע의 사역형을 ‘만족하게 하다’로 옮겨, 단순한 물질적 충족을 넘어 결핍의 해소를 표현했습니다.
- source_word: וְזָרַח
  english_pob_choice: will rise
  chosen_korean: 떠오르고
  alternatives_korean:
  - 비치고
  - 솟아오르고
  - 일어나고
  lexicon: HALOT
  rationale: 빛이 어둠 속에서 ‘떠오르다’는 이미지는 히브리어 זרח의 발광/발현 이미지를 자연스럽게 살립니다.
- source_word: וַאֲפֵלָתְךָ
  english_pob_choice: your gloom
  chosen_korean: 네 캄캄함
  alternatives_korean:
  - 네 어둠
  - 네 깊은 어둠
  - 네 침울함
  lexicon: HALOT
  rationale: אֲפֵלָה의 짙은 어둠과 비참함을 한국어 관용으로 옮기기 위해 ‘캄캄함’을 택했고, 직전의 ‘어둠’과 중복을 피했습니다.
theological_decisions:
- issue: נֶפֶשׁ를 두 번 쓰는 구절의 일관성과 의미
  chosen_reading: 첫 번째는 ‘네 자신’으로, 두 번째는 ‘고난받는 영’으로 옮겨 자기 헌신과 고통받는 전인을 모두 드러냈습니다.
  alternative_readings:
  - 두 곳 모두 ‘영혼’으로 통일
  - 두 곳 모두 ‘사람’으로 통일
  rationale: 히브리어 נֶפֶשׁ는 전인, 생명, 자아를 가리키는 관용어이므로 두 용례를 기계적으로 같게 옮기면 문맥이 흐려집니다. 첫 절은 자기 헌신을, 둘째 절은 고통받는 존재를 가리키는 이미지를 살리는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 번역 원칙 §§1, 5, 6
