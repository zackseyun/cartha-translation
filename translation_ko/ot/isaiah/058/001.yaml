  source_fidelity: ‘멈추지 마십시오’는 ‘그치지 말라’는 뜻으로 들려, ‘아끼지 말라/억제하지 말라’(אַל־תַּחְשֹׂךְ)라는 원문의 금지와 다소 다릅니다. 또한 원문의 반복된 여격 구조(‘내 백성에게 … 야곱 집에게 …’)를 드러내는 편이 충실합니다.
  naturalness: ‘목청껏 외치십시오’와 ‘나팔처럼 목소리를 높여’는 현대 표준어 합쇼체로 자연스럽고 예언적 공적 선언의 어조에 적절합니다. ‘억제하지 마십시오’는 문맥상 목소리를 억누르지 말라는 뜻을 자연스럽게 전달합니다.
  terminology: ‘반역’은 פֶּשַׁע의 강한 위반·반항의 뉘앙스를 잘 살립니다. 각주 b의 ‘언약 위반’은 본문 어휘 자체가 명시하는 범위를 넘어서는 해석적 표현이므로, ‘고의적 반역 또는 위반’으로 절제하는 것이 적절합니다. שׁוֹפָר의 문화적 설명도 유지합니다.
