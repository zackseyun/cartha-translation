source:
  edition: WLC
  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
  footnotes:
  - marker: a
    text: Or 'like a ram's horn'; the Hebrew shofar refers to a horn used for signaling or proclamation.
    reason: cultural_note
  - marker: b
    text: Or 'their transgression'; the Hebrew term can emphasize willful rebellion against God.
    reason: lexical_alternative
translation:
  language: ko
  text: 목청껏 외치십시오. 억제하지 마십시오. 나팔[a]처럼 목소리를 높여, 내 백성에게 그들의 반역[b]을, 야곱 집에게 그들의 죄를 알리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나팔’은 히브리어 שׁוֹפָר를 옮긴 것으로, 알리거나 선포하는 데 쓰는 뿔나팔을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘반역’으로 옮긴 히브리어 פֶּשַׁע는 고의적인 반역 또는 위반을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  english_pob_choice: Cry out with your throat
  chosen_korean: 목청껏 외치십시오
  alternatives_korean:
  - 목구멍으로 외치십시오
  - 목소리를 높여 외치십시오
  lexicon: HALOT
  rationale: ‘with your throat’의 신체적·강한 외침 이미지를 한국어에서 자연스럽게 압축해 살렸습니다.
- source_word: אַל תַּחְשֹׂךְ
  english_pob_choice: do not hold back
  chosen_korean: 멈추지 마십시오
  alternatives_korean:
  - 아끼지 마십시오
  - 주저하지 마십시오
  lexicon: HALOT
  rationale: 예언적 외침을 막지 말라는 뜻을 현대 한국어의 직접 명령으로 분명하게 전달했습니다.
- source_word: כַּשּׁוֹפָר
  english_pob_choice: like a trumpet
  chosen_korean: 나팔처럼
  alternatives_korean:
  - 뿔나팔처럼
  - 숫양의 뿔처럼
  lexicon: HALOT
  rationale: 기능상 소리를 크게 울려 알리는 악기라는 점을 살리되, 본문 흐름에서는 간결한 기본 표현을 택했습니다.
- source_word: פִּשְׁעָם
  english_pob_choice: their rebellion
  chosen_korean: 반역
  alternatives_korean:
  - 범죄
  - 죄악
  - 허물
  lexicon: HALOT
  rationale: פֶּשַׁע의 의도적 언약 위반 뉘앙스를 살리기 위해, 단순한 ‘잘못’보다 강한 ‘반역’을 택했습니다.
theological_decisions:
- issue: ‘내 백성’과 ‘야곱 집’의 이중 표지 유지
  chosen_reading: 두 대상을 구분해 ‘내 백성’과 ‘야곱 집’으로 모두 살렸습니다.
  alternative_readings:
  - 두 표현을 하나로 묶어 단순한 동격으로 처리함
  rationale: 히브리어의 병렬 구조를 유지해 예언적 고발의 강도를 약화하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
