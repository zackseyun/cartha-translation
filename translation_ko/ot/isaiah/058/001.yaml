revisions:
- from: 목청껏 외치십시오. 멈추지 마십시오. 나팔처럼 소리를 높여, 내 백성의 반역과 야곱 집의 죄를 선포하십시오.[a][b]
  to: 목청껏 외치십시오. 억제하지 마십시오. 나팔[a]처럼 목소리를 높여, 내 백성에게 그들의 반역[b]을, 야곱 집에게 그들의 죄를 알리십시오.
