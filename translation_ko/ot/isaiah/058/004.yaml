revisions:
- from: 보십시오, 여러분은 다툼과 분쟁을 위하여, 또 악한 주먹으로 치려고 금식합니다. 여러분은 오늘과 같은 방식으로 금식하지 않으면서, 높은 곳에 여러분의 목소리가 들리게 하려는 것입니다.[a][b]
  to: 보십시오, 여러분은 다툼과 분쟁을 위하여, 또 악한 주먹[a]으로 치려고 금식합니다. 여러분은 오늘처럼 금식하여 높은 곳[b]에 여러분의 목소리가 들리게 해서는 안 됩니다.
  rationale: 원문의 비교 표현 כַּיּוֹם과 부정된 동사 לֹא תָצוּמוּ를 ‘오늘처럼 금식하여 … 해서는 안 됩니다’로 보존하여, 기존 번역의 논리적 모순을 바로잡았습니다. ‘높은 곳’은 원문이 하나님을 직접 명시하지 않는 점을 따라 유지했으며, 각주 표지를 해당 단어에 배치했습니다.
