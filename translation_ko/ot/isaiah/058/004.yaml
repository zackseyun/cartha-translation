reference: Isaiah 58:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן לְ/רִ֤יב וּ/מַצָּה֙ תָּצ֔וּמוּ וּ/לְ/הַכּ֖וֹת בְּ/אֶגְרֹ֣ף רֶ֑שַׁע לֹא תָצ֣וּמוּ כַ/יּ֔וֹם לְ/הַשְׁמִ֥יעַ בַּ/מָּר֖וֹם קוֹלְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
  footnotes:
  - marker: a
    text: Or, more literally, 'with a fist of wickedness.'
    reason: lexical_alternative
  - marker: b
    text: '''On high'' may refer to the heavenly realm, that is, to making their voice heard before God.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 여러분은 다툼과 분쟁을 위하여, 또 악한 주먹[a]으로 치려고 금식합니다. 여러분은 오늘처럼 금식하여 높은 곳[b]에 여러분의 목소리가 들리게 해서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘악의 주먹으로’.
    reason: lexical_alternative
  - marker: b
    text: ‘높은 곳’은 하늘 영역, 곧 하나님께 목소리가 들리게 하려는 뜻을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이것을 보십시오
  lexicon: HALOT
  rationale: 예언자적 책망의 주의를 환기하는 감탄사로, 현대 합쇼체에서 직접적이고 자연스럽게 들리도록 했습니다.
- source_word: לְרִיב וּמַצָּה
  english_pob_choice: for strife and contention
  chosen_korean: 다툼과 분쟁을 위하여
  alternatives_korean:
  - 다툼과 시비를 위하여
  - 분쟁과 논쟁을 위하여
  lexicon: HALOT
  rationale: 두 명사는 서로 겹치지만 반복을 피하면서 갈등 상태를 한국어로 자연스럽게 압축해 옮겼습니다.
- source_word: בְּאֶגְרֹף רֶשַׁע
  english_pob_choice: with a wicked fist
  chosen_korean: 악한 주먹으로
  alternatives_korean:
  - 악의 주먹으로
  - 사악한 주먹으로
  - 불의한 주먹으로
  lexicon: HALOT
  rationale: 직역성을 유지하되 현대 한국어에서 통하는 폭력성 표현으로 옮겼고, '악'이 주먹의 성격을 수식한다는 점을 살렸습니다.
- source_word: כַּיּוֹם
  english_pob_choice: as you do today
  chosen_korean: 오늘과 같은 방식으로
  alternatives_korean:
  - 오늘처럼
  - 오늘처럼만
  lexicon: HALOT
  rationale: 단순한 시점 표지가 아니라 현재 행위의 양상을 비교하는 말이므로, '오늘' 자체보다 '오늘과 같은 방식'으로 대조감을 드러냈습니다.
- source_word: לְהַשְׁמִיעַ בַּמָּרוֹם קוֹלְכֶם
  english_pob_choice: to make your voice heard on high
  chosen_korean: 높은 곳에 여러분의 목소리가 들리게 하려는 것입니다
  alternatives_korean:
  - 높은 곳에서 여러분의 목소리가 들리게 하려는 것입니다
  - 하늘에서 여러분의 목소리가 들리게 하려는 것입니다
  lexicon: HALOT
  rationale: ‘높은 곳’은 본문이 가진 공간적 표현을 보존하며, '들리게 하다'로 히필의 사역적 의미를 살렸습니다.
theological_decisions:
- issue: בַּמָּרוֹם의 신학적 함의
  chosen_reading: ‘높은 곳’으로 유지하여 하나님께 들리게 하려는 함의를 암시하되, 본문에 없는 직접적인 ‘하나님 앞에서’는 덧붙이지 않았습니다.
  alternative_readings:
  - 하늘에서
  - 하나님께
  rationale: 히브리어는 높이/높은 곳을 말하지만 하나님을 명시하지 않으므로, POB의 audit trail대로 공간적 표현을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
