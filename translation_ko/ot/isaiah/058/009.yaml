id: ISA.58.9
reference: Isaiah 58:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
  footnotes:
  - marker: a
    text: Or 'pointing the finger'; the Hebrew idiom is literally 'sending/stretching out a finger,' likely referring to accusatory or contemptuous gesture.
    reason: lexical_alternative
  - marker: b
    text: '''The yoke'' is a metaphor for oppressive treatment or burdens imposed on others.'
    reason: cultural_note
  - marker: c
    text: Or 'speaking evil' or 'malicious speech.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 당신은 부를 것이고, 야훼께서 응답하실 것입니다. 당신은 도움을 청하여 부르짖을 것이고, 그분은 「내가 여기 있다」라고 말씀하실 것입니다. 만일 당신이 당신 가운데서 멍에와 손가락질과 악한 말을 제거하면,[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손가락질’은 히브리어의 문자적 표현인 ‘손가락을 내밀다/펴다’에서 온 관용구로, 비난이나 멸시의 제스처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멍에’는 다른 사람에게 지우는 억압적 부담을 비유합니다.
    reason: cultural_note
  - marker: c
    text: ‘악한 말’ 또는 ‘해로운 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그리하면
  - 그런 다음
  lexicon: HALOT
  rationale: 앞선 조건에 따른 결과를 잇는 시간부사이므로, 현대 한국어에서 자연스럽고 문맥을 분명히 하는 ‘그때에’로 옮겼습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יהוה YHWH'
  rationale: 본문의 여호와 이름은 프로젝트 기본값에 따라 음역어 ‘야훼’를 사용해 원문 고유명을 드러냈습니다.
- source_word: תִּקְרָא / תְּשַׁוַּע
  english_pob_choice: you will call / you will cry for help
  chosen_korean: 부를 것이고 / 도움을 청하여 부르짖을 것이고
  alternatives_korean:
  - 외칠 것이고 / 부르짖을 것이고
  - 간구할 것이고 / 부르짖을 것이고
  lexicon: HALOT
  rationale: 첫 동사는 하나님께 부르는 행위를 넓게 살려 ‘부르다’로, 둘째 동사는 절박한 구원을 요청하는 뉘앙스를 살려 ‘도움을 청하여 부르짖다’로 옮겼습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 내가 여기 있다
  alternatives_korean:
  - 내가 여기 있습니다
  - 내가 여기 있노라
  lexicon: HALOT
  rationale: 하나님의 즉각적 임재와 응답 가능성을 나타내는 관용구이므로, 직설적이고 간결한 ‘내가 여기 있다’로 유지했습니다.
- source_word: שְׁלַח אֶצְבַּע
  english_pob_choice: the pointing of the finger
  chosen_korean: 손가락질
  alternatives_korean:
  - 손가락을 내미는 것
  - 손가락을 겨누는 것
  lexicon: HALOT
  rationale: 히브리어 관용구가 비난·멸시의 제스처를 가리키므로, 한국어에서 그 관용적 의미가 분명한 ‘손가락질’로 옮겼습니다.
- source_word: מוֹטָה
  english_pob_choice: the yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 멍에틀
  - 억압
  lexicon: HALOT
  rationale: 문자적 이미지가 유지되어야 비유적 억압의 의미가 살아나므로, 구체적 표상인 ‘멍에’를 택했습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 테트라그람마톤을 직접 사용하므로, 본 프로젝트 기본 원칙에 따라 고유명 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
