  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/כָ/זֶ֗ה יִֽהְיֶה֙ צ֣וֹם אֶבְחָרֵ֔/הוּ י֛וֹם עַנּ֥וֹת אָדָ֖ם נַפְשׁ֑/וֹ הֲ/לָ/כֹ֨ף כְּ/אַגְמֹ֜ן רֹאשׁ֗/וֹ וְ/שַׂ֤ק וָ/אֵ֨פֶר֙ יַצִּ֔יעַ הֲ/לָ/זֶה֙ תִּקְרָא צ֔וֹם וְ/י֥וֹם רָצ֖וֹן לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: ko
  text: 이것이 내가 선택하는 금식이겠습니까? 사람이 자기 자신을 괴롭게 하는 날이겠습니까? 갈대처럼 머리를 숙이고, 굵은 베와 재를 펴는 것이겠습니까? 이것을 금식이라, 그리고 야훼께서 기뻐하시는 날이라 부르시겠습니까?[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 נפשׁוֹ는 여기서 ‘자기 자신/생명’을 가리키는 표현으로, 단순히 내면의 ‘영혼’만을 뜻한다고 보지 않았습니다.
    reason: source_note
  - marker: b
    text: 마지막 질문은 “이것을 금식이라 부르겠습니까?”라는 수사적 반문입니다.
    reason: source_note
lexical_decisions:
- source_word: צ֣וֹם / י֥וֹם עַנּ֥וֹת אָדָ֖ם נַפְשׁ֑וֹ
  english_pob_choice: a day for a man to humble himself
  chosen_korean: “사람이 자기 자신을 괴롭게 하는 날”
  alternatives_korean:
  - “한 사람이 자신을 낮추는 날”
  - “사람이 스스로 금식하며 괴롭게 하는 날”
  lexicon: צום, ענה, נפש
  rationale: 영어 POB의 ‘a man to humble himself’를 따라, 금식의 본질을 외적 행위가 아니라 자신을 괴롭게 하는 날로 옮겼습니다. נֶפֶשׁ을 단순히 ‘영혼’으로 좁히지 않고 자기 자신 전체를 가리키는 표현으로 처리했습니다.
- source_word: כְּ/אַגְמֹן רֹאשׁוֹ
  english_pob_choice: to bow down his head like a reed
  chosen_korean: “갈대처럼 머리를 숙이고”
  alternatives_korean:
  - “골풀처럼 머리를 숙이고”
  - “갈대같이 고개를 숙이고”
  lexicon: אגמון
  rationale: 아גמון은 갈대/골풀 계열 식물을 가리키므로, 영어 POB의 ‘reed’에 맞추어 자연스럽고 직관적인 ‘갈대’로 옮겼습니다.
- source_word: שַׂק וָאֵפֶר
  english_pob_choice: sackcloth and ashes
  chosen_korean: “굵은 베와 재”
  alternatives_korean:
  - “베옷과 재”
  - “거친 베옷과 재”
  lexicon: שׂק, אפר
  rationale: 금식·애도 표지로 익숙한 한국어 관용을 살리되, 본문의 상징 행위를 분명히 드러내기 위해 ‘굵은 베와 재’로 번역했습니다.
- source_word: לַיהוָה
  english_pob_choice: the LORD
  chosen_korean: “야훼”
  alternatives_korean:
  - “주님”
  - “여호와”
  lexicon: יהוה
  rationale: 이 절의 마지막 שאלות는 야훼께서 기뻐하시는 날인지 묻는 구조이므로, 본 프로젝트 기본값에 따라 신명사형을 ‘야훼’로 반영했습니다.
theological_decisions:
- issue: 금식의 참뜻과 외형적 경건의 대비
  chosen_reading: 본문의 수사적 질문을 살려, 금식을 외적 자기학대의 행위로 축소하지 않고 하나님 앞에서의 실제적 태도 문제로 읽었습니다.
  alternative_readings:
  - 단순히 금식 절차를 비판하는 말
  - 개인 경건의 형식에 대한 중립적 질문
  rationale: 히브리어 질문 연쇄는 하나님이 원하시는 금식의 정의를 따지는 것으로, 외형만 남은 경건을 비판하는 예언자적 논지를 드러냅니다.
  doctrine_reference: 예언서의 언약적 책망과 참된 금식의 교정(사 58장 문맥)
