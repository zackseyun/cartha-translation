  to: “우리가 왜 금식하였는데도 보지 않으셨습니까? 우리가 왜 스스로를 괴롭게 하였는데도 알아주지 않으십니까?” “보십시오, 너희가 금식하는 날에 자기 욕망을 추구하고, 너희의 모든 품꾼을 심하게 부립니다.”[a][b][c]
  rationale: 원문의 완료형과 관용구를 더 충실히 반영하고, 해석이 갈리는 חֵפֶץ 및 עַצְּבֵיכֶם의 의미 범위를 각주로 보존했습니다. 화자 전환을 인용문으로 구분했으며, 특정 교리적 해석은 덧붙이지 않았습니다.
