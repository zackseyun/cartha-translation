review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘보지 않으십니까’는 히브리어 완료형 רָאִיתָ에 비해 시제가 약화되었고, עִנִּינוּ נַפְשֵׁנוּ는 ‘스스로를 낮추다’보다 ‘스스로를 괴롭게 하다/자기를 괴롭게 하다’가 원문의 관용구를 더 직접적으로 보존합니다. 또한 חֵפֶץ에 ‘자기만의’라는 배타적 의미를 더할 근거는 충분하지 않습니다. עַצְּבֵיכֶם는 ‘품꾼들’이라는 해석이 가능하나 노동 또는 부과된 일을 가리킬 가능성도 있어 각주에서 유지해야 합니다.
  naturalness: 개정문은 현대 표준어 합쇼체를 유지합니다. 백성의 항의와 뒤이은 신적 책망을 각각 따로 인용하여 화자 전환을 명료하게 했습니다. ‘심하게 부립니다’는 강제적 노동 부담을 자연스럽게 표현합니다.
  terminology: ‘금식’, ‘품꾼’은 적절합니다. עִנָּה נֶפֶשׁ의 관용적 의미는 본문에서 ‘스스로를 괴롭게 하다’로 옮기고, ‘스스로를 낮추다’는 각주 대안으로 보존합니다. חֵפֶץ는 문맥상 ‘자기 욕망’으로 번역하되, 즐거움·원함·자기 일을 뜻할 가능성을 각주에 제시합니다.
