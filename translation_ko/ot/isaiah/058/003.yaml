id: ISA.58.3
reference: Isaiah 58:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
  footnotes:
  - marker: a
    text: Or 'have we afflicted ourselves' or 'have we denied ourselves?' Literally, 'have we afflicted our soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you find pleasure,' 'you seek your own desire,' or possibly 'you pursue your own business.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you oppress all your workers' or 'you exact all your labors/tasks.' The Hebrew may refer either to laborers or to the labor exacted from them.
    reason: lexical_alternative
translation:
  language: ko
  text: “우리가 어찌하여 금식하였는데도 주님은 보지 않으십니까? 우리가 어찌하여 스스로를 낮추었는데도 주님은 알지 못하십니까? 보십시오, 너희가 금식하는 날에 너희는 자기만의 기쁨을 추구하고, 너희의 모든 품꾼을 심하게 부립니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금식하였는데도’는 히브리어 ‘우리가 금식하였다’의 완료형 반문을 반영합니다.
    reason: source_note
  - marker: b
    text: ‘자기만의 기쁨’은 ‘기쁨/원함’을 뜻하는 חֵפֶץ의 문맥적 의미를 따른 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘품꾼’은 여기의 표현이 노동 자체보다 노동에 종사하는 사람들을 가리킨다는 해석을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַּמְנוּ
  english_pob_choice: have we fasted
  chosen_korean: 금식하였는데도
  alternatives_korean:
  - 금식했는데도
  - 금식하였음에도
  lexicon: HALOT
  rationale: 금식 행위를 완료된 사실로 묻는 구조를 살리면서, 현대 한국어에서는 과거완료보다 ‘금식하였는데도’가 자연스럽습니다.
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  english_pob_choice: have we humbled ourselves
  chosen_korean: 스스로를 낮추었는데도
  alternatives_korean:
  - 스스로를 괴롭게 하였는데도
  - 우리의 영혼을 괴롭게 하였는데도
  lexicon: HALOT
  rationale: 직역적 ‘괴롭게 하다’보다, 금식과 연결된 자기 낮춤의 관용 표현을 현대적으로 드러내면서도 원문의 자기를 쳐서 낮추는 뜻을 유지합니다.
- source_word: תֵדָע
  english_pob_choice: do not notice
  chosen_korean: 알지 못하십니까
  alternatives_korean:
  - 알아주시지 않습니까
  - 주의하지 않으십니까
  lexicon: HALOT
  rationale: POB의 최종 영어가 ‘do not notice’와 ‘do not know it’ 사이의 긴장을 보존하므로, 여기서는 ידע의 관계적·인지적 부정을 직접 살려 ‘알지 못하십니까’로 옮겼습니다.
- source_word: תִּמְצְאוּ חֵפֶץ
  english_pob_choice: you pursue your own pleasure
  chosen_korean: 자기만의 기쁨을 추구하고
  alternatives_korean:
  - 자기 욕망을 추구하고
  - 자기 즐거움을 찾고
  lexicon: HALOT
  rationale: חֵפֶץ를 단순한 ‘즐거움’보다 자기중심적 기쁨/뜻으로 이해해, 문맥상 자기만족을 좇는 태도를 드러냈습니다.
- source_word: תִּנְגֹּשׂוּ
  english_pob_choice: you drive all your laborers hard
  chosen_korean: 너희의 모든 품꾼을 심하게 부립니다
  alternatives_korean:
  - 너희의 모든 일꾼을 압박합니다
  - 너희의 모든 노동자들을 착취합니다
  lexicon: HALOT
  rationale: נגשׂ의 강압적·착취적 뉘앙스를 살리되, ‘품꾼’으로 고용된 노동자를 분명히 하고 ‘심하게 부리다’로 한국어의 강한 억압성을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 금식의 형식성과 사회적 착취의 결합
  chosen_reading: 하나님은 금식 자체가 아니라, 금식일에도 자기 기쁨과 노동자 억압을 지속하는 위선을 책망하십니다.
  alternative_readings:
  - 단순히 개인적 경건 실패를 책망하는 것
  - ‘자기 일’을 돌보는 행위에 대한 비판으로만 이해하는 것
  rationale: 본문의 두 번째 절은 금식과 경제적 억압을 함께 묶어 고발하므로, 예배 행위와 사회적 정의를 분리하지 않는 원문의 수위를 보존해야 합니다.
  doctrine_reference: Isaiah 58:3 social-justice context
- issue: 발화 속 호칭과 문체
  chosen_reading: 본문은 예언자적 반문과 하나님의 응답이 이어지는 구조이므로, 서술문 전체는 합쇼체를 유지하되 인용문 내부의 직접 화법은 그대로 반문형으로 옮겼습니다.
  alternative_readings:
  - 인용부를 더 완곡한 설명문으로 풀어 쓰는 것
  - 전체를 중립 서술로 평탄화하는 것
  rationale: 예언적 책망의 직접성을 살리기 위해 질문형과 명령형 ‘보십시오’를 유지하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1
