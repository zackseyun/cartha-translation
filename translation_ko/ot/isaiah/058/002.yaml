id: ISA.58.2
reference: Isaiah 58:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
  footnotes:
  - marker: a
    text: Or 'they delight in drawing near to God' or 'they delight in approach to God.' The Hebrew phrase can refer either to God's nearness or to the act of approaching him.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 날마다 나를 찾고, 내 길을 알기를 즐거워하며, 마치 의를 행하고 자기들의 하나님에 대한 정의를 버리지 않은 나라처럼 나에게 의로운 판단을 물으며, 하나님과 가까이 있기를 즐거워합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 가까움을 즐거워합니다’로도 옮길 수 있습니다. 히브리어는 하나님께 가까이 나아가는 행위와 하나님의 가까움을 모두 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוֹתִי / יִדְרֹשׁוּן
  english_pob_choice: Yet ... they seek me
  chosen_korean: 그러나 그들은 ... 나를 찾고
  alternatives_korean:
  - 그런데 그들은 ... 나를 찾고
  - 그러나 그들은 ... 나를 구하고
  lexicon: HALOT
  rationale: 문맥상 앞선 책망에 대한 대조가 분명하므로 ‘그러나’로 역접을 살리고, דרש의 예배적·종교적 탐구를 한국어의 자연한 ‘찾다’로 옮겼습니다.
- source_word: יוֹם יוֹם / וְדַעַת דְּרָכַי יֶחְפָּצוּן
  english_pob_choice: day after day / they delight to know my ways
  chosen_korean: 날마다 ... 내 길을 알기를 즐거워하며
  alternatives_korean:
  - 매일 ... 내 길을 알기를 기뻐하며
  - 날마다 ... 내 길을 알고 싶어하며
  lexicon: HALOT
  rationale: יוֹם יוֹם의 반복 강조를 ‘날마다’로 살리고, חפץ의 기쁨·열망을 ‘즐거워하다’로 옮겨 지적 행위인 ‘알다’와 정서적 반응을 함께 유지했습니다.
- source_word: צְדָקָה עָשָׂה / וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  english_pob_choice: practiced righteousness / had not forsaken the justice of its God
  chosen_korean: 의를 행하고 자기들의 하나님에 대한 정의를 버리지 않은
  alternatives_korean:
  - 의를 실천하고 자기들의 하나님의 공의를 저버리지 않은
  - 정의를 행하고 자기들의 하나님의 법도를 버리지 않은
  lexicon: HALOT
  rationale: צדקה는 여기서 행위로 나타나는 의이며, מִשְׁפַּט은 단순한 ‘법도’보다 하나님의 정의·공적 질서를 가리키는 폭이 있어 ‘정의’로 옮겼습니다.
- source_word: מִשְׁפְּטֵי צֶדֶק
  english_pob_choice: righteous judgments
  chosen_korean: 의로운 판단
  alternatives_korean:
  - 의로운 판결
  - 정의로운 판단
  lexicon: HALOT
  rationale: 복수형 ‘심판들/판단들’의 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘판단’을 택했고, צֶדֶק과의 연결은 ‘의로운’으로 보존했습니다.
- source_word: קִרְבַת אֱלֹהִים
  english_pob_choice: the nearness of God
  chosen_korean: 하나님과 가까이 있기를
  alternatives_korean:
  - 하나님의 가까움
  - 하나님께 가까이 가기를
  lexicon: HALOT
  rationale: 이 표현은 하나님의 가까움과 하나님께 다가감의 이중 가능성을 지니므로, 본문에는 동작적 의미를 살린 ‘하나님과 가까이 있기를’로 두고 의미의 여지를 유지했습니다.
theological_decisions:
- issue: 본문의 아이러니를 한국어에서 얼마나 드러낼 것인가
  chosen_reading: ‘마치 ... 나라처럼’으로 직접적 비교를 유지해 위선에 대한 예언자적 반어를 드러냄
  alternative_readings:
  - ‘... 나라같이’로 더 중립적으로 번역
  - 비교를 약화해 평서적으로 처리
  rationale: 본문은 경건을 가장한 자기기만을 폭로하는 맥락이므로, 비교 구조를 분명히 보여 주어 청자가 반어를 놓치지 않게 해야 합니다.
  doctrine_reference: 번역 철학 §1, §3
