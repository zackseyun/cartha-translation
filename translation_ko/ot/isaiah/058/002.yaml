revisions:
- from: 그러나 그들은 날마다 나를 찾고, 내 길을 알기를 즐거워하며, 마치 의를 행하고 자기들의 하나님에 대한 정의를 버리지 않은 나라처럼 나에게 의로운 판단을 물으며, 하나님과 가까이 있기를 즐거워합니다.[a]
  to: 그러나 그들은 날마다 나를 찾고 내 길을 알기를 기뻐합니다. 그들은 마치 의를 행하고 그들의 하나님의 공의를 버리지 않은 민족인 양, 내게 의로운 판결을 요구하고 하나님의 가까움을 기뻐합니다.[a]
  rationale: 소유 관계를 바로잡아 ‘그들의 하나님의 공의’로 고쳤고, 마지막 명사구는 영어 POB의 주 독법과 같이 ‘하나님의 가까움’으로 옮겼습니다. 동시에 원문의 객관적·동작적 해석 가능성은 각주에 보존했습니다. 문장 구조를 정리하여 반어적 비교와 동사 병렬을 더 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
