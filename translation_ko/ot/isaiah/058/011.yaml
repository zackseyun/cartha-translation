reference: Isaiah 58:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
  footnotes:
  - marker: a
    text: Or 'in parched regions' or 'in dry places.' The Hebrew refers to scorched, arid conditions.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'whose waters do not lie'—that is, waters that do not fail or disappoint.
    reason: lexical_alternative
  - marker: c
    text: Or 'refresh your bones.' The Hebrew verb is uncommon here and may convey strengthening or invigorating.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 늘 당신을 인도하시고, 메마른 곳에서 당신의 영혼을 만족하게 하시며, 당신의 뼈를 튼튼하게 하실 것입니다.[c] 당신은 물이 잘 댄 정원 같고, 그 물이 마르지 않는 샘과 같을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 햇볕에 타고 몹시 건조한 곳들을 가리킵니다. ‘메마른 곳’은 ‘바싹 마른 곳’ 또는 ‘건조한 지역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 물이 거짓말하지 않는’입니다. 샘의 물이 마르거나 기대를 저버리지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘뼈를 튼튼하게 하시며’는 드문 히브리어 동사를 문맥에 따라 옮긴 것입니다. ‘뼈에 기운을 북돋우시며’ 또는 ‘뼈를 새롭게 하시며’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 본문의 신명사 표기는 대체 칭호가 아니라 고유명사로 처리해, POB의 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְנָחֲךָ ... תָּמִיד
  english_pob_choice: will guide you continually
  chosen_korean: 당신을 늘 인도하시고
  alternatives_korean:
  - 당신을 계속 이끄시고
  - 당신을 늘 지도하시고
  lexicon: HALOT
  rationale: נחה는 단순한 이동이 아니라 방향을 잡아 주는 인도/안내의 뜻이므로, 자연스러운 현대 한국어 동사인 ‘인도하시다’를 택했습니다.
- source_word: בְּצַחְצָחוֹת
  english_pob_choice: in scorched places
  chosen_korean: 메마른 곳에서도
  alternatives_korean:
  - 타들어 가는 곳에서도
  - 건조한 곳에서도
  - 바싹 마른 곳에서도
  lexicon: HALOT
  rationale: 이 복수명사는 뜨겁고 건조한 환경을 가리키므로, 본문의 이미지와 한국어 자연성을 함께 살려 ‘메마른 곳’으로 옮겼습니다.
- source_word: וְהִשְׂבִּיעַ ... נַפְשֶׁךָ
  english_pob_choice: satisfy your soul
  chosen_korean: 당신의 영혼을 만족시키시며
  alternatives_korean:
  - 당신의 생명을 흡족하게 하시며
  - 당신 자신을 배부르게 하시며
  lexicon: HALOT
  rationale: נפשׁ는 여기서 내면의 생명/자아를 포함하는 표현이므로, 영적·시적 깊이를 살리는 ‘영혼’이 가장 적절합니다.
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  english_pob_choice: strengthen your bones
  chosen_korean: 당신의 뼈를 강하게 하실 것입니다
  alternatives_korean:
  - 당신의 뼈를 새롭게 하실 것입니다
  - 당신의 뼈를 튼튼하게 하실 것입니다
  - 당신의 뼈에 힘을 더하실 것입니다
  lexicon: HALOT
  rationale: חלץ는 문맥상 육체적 회복과 강건함을 나타내므로, 직관적이면서도 구체적인 ‘뼈를 강하게 하다’로 옮겼습니다.
- source_word: כְּגַן רָוֶה
  english_pob_choice: like a well-watered garden
  chosen_korean: 물이 넉넉한 정원 같고
  alternatives_korean:
  - 충분히 물을 댄 정원 같고
  - 물로 흠뻑 적신 정원 같고
  lexicon: HALOT
  rationale: רוה는 충분히 물을 머금은 상태를 가리키므로, 한국어 관용과 이미지의 생동감을 고려해 ‘물이 넉넉한 정원’으로 표현했습니다.
- source_word: וּכְמוֹצָא מַיִם ... לֹא יְכַזְּבוּ
  english_pob_choice: like a spring of water whose waters do not fail
  chosen_korean: 물이 마르지 않는 샘
  alternatives_korean:
  - 실패하지 않는 물의 샘
  - 거짓되지 않는 샘
  lexicon: HALOT
  rationale: כזב는 문자적으로 ‘거짓되다’이지만 물의 비유에서는 ‘마르다/기대에 어긋나다’의 뜻이 자연스러워, 의미를 살린 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 음역 처리
  chosen_reading: ‘야훼’로 고유명사를 유지했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문은 하나님의 이름을 직접 사용하므로, 호칭으로 바꾸지 않고 프로젝트 기본값에 따라 고유명사성을 보존했습니다.
  doctrine_reference: '프로젝트 기본 용례: יְהוָה / YHWH → 야훼'
- issue: נֶפֶשׁ의 한국어 범주 선택
  chosen_reading: ‘영혼’으로 옮겨 내면적 충만을 드러냈습니다.
  alternative_readings:
  - 생명
  - 자기 자신
  rationale: 이 절은 신체 회복과 함께 내적 만족을 병행하므로, 단순한 생물학적 생명보다 시적·신학적 깊이를 지닌 ‘영혼’이 더 적합합니다.
  doctrine_reference: 번역 철학 §1, §3, §6
