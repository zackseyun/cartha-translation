review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 בְּצַחְצָחוֹת의 장소 표현에 불필요한 보조사 ‘도’가 들어가 있고, חלץ의 드문 용례는 ‘뼈를 튼튼하게 하시며’로 옮기되 각주로 불확실성을 밝혀 두는 편이 원문에 더 충실합니다. מֵימָיו는 샘에 속한 물을 가리키므로 ‘그 물이’로 명시하는 것이 자연스럽고 선행사를 분명히 합니다.
  naturalness: ‘당신의 뼈를 강하게 하실 것입니다’는 앞선 연결 어미들과 호응이 다소 매끄럽지 않습니다. ‘당신의 뼈를 튼튼하게 하시며’로 통일하면 현대 표준어 합쇼체 문장으로 자연스럽습니다. 기존 각주 a에 영어 표현이 그대로 들어간 것은 한국어 성경 각주로 부자연스럽습니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기 원칙과 일치합니다. נֶפֶשׁ을 ‘영혼’으로 옮긴 것은 가능한 시적 번역입니다. ‘물이 넉넉한 정원’보다 ‘물이 잘 댄 정원’이 רָוֶה의 물 공급·윤택함의 이미지를 더 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 각주 a에 영어 표현 ‘scorched places’/‘parched regions’가 남아 있습니다.
    rationale: 한국어 번역의 각주는 한국어로 독립적으로 이해되어야 하며, 원어의 의미 범위를 한국어 대안으로 제시해야 합니다.
  - severity: medium
    issue: חלץ에 관한 원어상 난점과 각주 c가 한국어 본문에서 누락되어 있습니다.
    rationale: 이 동사는 이 문맥에서 드문 용례이며, 영어 감사 기록도 ‘strengthen/refresh’의 불확실성을 명시합니다. ‘뼈’ 표현에 각주를 붙여 대안적 이해를 보존하는 것이 안전합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치되어 각주 a와 b의 참조 대상이 불분명합니다.
    rationale: a는 ‘메마른 곳’, b는 ‘물이 마르지 않는 샘’, c는 ‘뼈를 튼튼하게’에 각각 붙여야 합니다.
  - severity: low
    issue: ‘메마른 곳에서도’의 ‘도’는 원문에 없는 양보의 뉘앙스를 더합니다.
    rationale: 장소를 나타내는 בְּ는 단순히 ‘메마른 곳에서’로 옮기는 것이 적절합니다.
  revised_text: 야훼께서는 늘 당신을 인도하시고, 메마른 곳에서 당신의 영혼을 만족하게 하시며, 당신의 뼈를 튼튼하게 하실 것입니다.[c] 당신은 물이 잘 댄 정원 같고, 그 물이 마르지 않는 샘과 같을 것입니다.[a][b]
