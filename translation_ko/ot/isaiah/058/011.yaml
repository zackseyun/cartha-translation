- from: 야훼께서 당신을 늘 인도하시고, 메마른 곳에서도 당신의 영혼을 만족시키시며, 당신의 뼈를 강하게 하실 것입니다. 그러면 당신은 물이 넉넉한 정원 같고, 물이 마르지 않는 샘과 같을 것입니다.[a][b]
  to: 야훼께서는 늘 당신을 인도하시고, 메마른 곳에서 당신의 영혼을 만족하게 하시며, 당신의 뼈를 튼튼하게 하실 것입니다.[c] 당신은 물이 잘 댄 정원 같고, 그 물이 마르지 않는 샘과 같을 것입니다.[a][b]
  rationale: 원문의 시적 병행과 미래 약속을 유지하면서, 장소 표현의 불필요한 양보 뉘앙스를 제거했습니다. 드문 동사 חלץ의 해석상 여지를 각주로 보존했고, 모든 각주 표지를 해당 어구에 직접 연결했습니다. 각주 a의 잔존 영어를 자연스러운 한국어 설명으로 교체했습니다.
