language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנ֤וּ מִמְּ/ךָ֙ חָרְב֣וֹת עוֹלָ֔ם מוֹסְדֵ֥י דוֹר וָ/ד֖וֹר תְּקוֹמֵ֑ם וְ/קֹרָ֤א לְ/ךָ֙ גֹּדֵ֣ר פֶּ֔רֶץ מְשֹׁבֵ֥ב נְתִיב֖וֹת לָ/שָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
  footnotes:
  - marker: a
    text: Or 'the foundations of many generations.' The Hebrew phrase is literally 'the foundations of generation and generation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the restorer of paths to dwell in' or 'the restorer of streets for habitation.' The final phrase likely refers to making the community inhabitable again.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데서 나온 이들이 옛 황폐한 곳들을 재건하고, 대대로 이어진 기초들을 다시 세울 것입니다. 그리고 너는 "무너진 곳을 막아 세우는 자, 사람이 살 길을 다시 내는 자"로 불릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대대로 이어진 기초들’, 직역하면 ‘세대와 세대의 기초들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거주할 길을 다시 내는 자’이며, 이 마지막 표현은 공동체가 다시 사람이 살 수 있는 곳이 되게 하는 뜻을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  english_pob_choice: Those from among you will rebuild
  chosen_korean: 너희 가운데서 나온 이들이 재건하고
  alternatives_korean:
  - 너희 가운데서 사람들이 세우고
  - 너에게서 나온 이들이 다시 짓고
  lexicon: HALOT
  rationale: מִמְּךָ는 물질적 출처가 아니라 ‘너희 가운데서/너희에게서 나온’ 사람들을 뜻하므로 그 의미를 살렸고, בנה는 회복 문맥에서 ‘재건하다’로 옮겼습니다.
- source_word: חָרְבוֹת עוֹלָם
  english_pob_choice: the ancient ruins
  chosen_korean: 옛 황폐한 곳들
  alternatives_korean:
  - 오랜 황폐들
  - 영원한 황폐들
  lexicon: HALOT
  rationale: חָרְבוֹת은 ‘황폐한 곳들/폐허들’이고, עוֹלָם은 이 문맥에서 ‘오래된, 옛’의 뉘앙스이므로 자연스러운 한국어로 옮겼습니다.
- source_word: גֹּדֵר פֶּרֶץ
  english_pob_choice: the repairer of the breach
  chosen_korean: 무너진 곳을 막아 세우는 자
  alternatives_korean:
  - 틈을 메우는 자
  - 파손된 성벽을 수축하는 자
  lexicon: HALOT
  rationale: גֹּדֵר는 ‘울타리/담을 둘러 막다, 막아 세우다’의 뜻이고 פֶּרֶץ는 ‘무너짐, 틈, 파괴된 곳’이므로, 관용구의 복원 의미를 한국어로 풀어 살렸습니다.
- source_word: מְשֹׁבֵב נְתִיבוֹת לָשָׁבֶת
  english_pob_choice: the restorer of paths for dwelling
  chosen_korean: 사람이 살 길을 다시 내는 자
  alternatives_korean:
  - 거주할 길을 회복하는 자
  - 다시 살 수 있는 길을 복구하는 자
  lexicon: HALOT
  rationale: נְתִיבוֹת는 단순한 ‘길’이 아니라 사람이 오가며 살 수 있는 통로/길들이고, לָשָׁבֶת는 ‘거주하게 하다’의 목적을 나타내므로 의미를 분명하게 풀었습니다.
theological_decisions:
- issue: 회복된 공동체의 수리·재건 이미지를 어떻게 한국어로 드러낼 것인가
  chosen_reading: 물리적 폐허 복구와 공동체 재건을 함께 보이도록 ‘재건하다’, ‘다시 세우다’, ‘무너진 곳을 막아 세우다’로 옮겼습니다.
  alternative_readings:
  - 비유적으로만 ‘회복하다’로 완화하는 번역
  - 전통적 교회 용어로만 추상화하는 번역
  rationale: 본문은 실제로 무너진 곳과 길, 기초를 복구하는 이미지를 사용하므로, 그 구체성을 유지하는 것이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: 사 58:12의 회복과 재건의 사회적·공동체적 의미
