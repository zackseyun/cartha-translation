  terminology: ‘폐허’, ‘기초’, ‘재건’, ‘회복’은 문맥에 적절합니다. גֹּדֵר פֶּרֶץ는 특정 교리 용어로 추상화하지 않고 ‘무너진 틈을 막는 자’로 옮겨, 파손된 방어 시설 또는 공동체의 균열을 복구하는 원문의 이미지를 보존합니다.
