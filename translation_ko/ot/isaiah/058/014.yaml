id: ISA.58.14
reference: Isaiah 58:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'the high places of the earth' or 'the heights of the land.'
    reason: lexical_alternative
  - marker: b
    text: '''Jacob your father'' uses covenant-family language; that is, Jacob as the forefather/ancestor of the people.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 너는 야훼 안에서 즐거워할 것이며, 내가 너를 땅의 높은 곳들로 올라가게 할 것이요, 내가 네 조상 야곱의 유산으로 너를 먹일 것입니다. 이는 야훼의 입이 말씀하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 높은 곳들’은 승귀와 복의 비유로, 반드시 지리적 고도를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 조상 야곱’은 언약 공동체의 조상-상속 언어를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  english_pob_choice: will delight yourself in
  chosen_korean: 야훼 안에서 즐거워할 것이며
  alternatives_korean:
  - 야훼 안에서 기뻐할 것이며
  - 야훼 안에서 즐길 것입니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리면서, 한국어에서는 ‘즐거워하다’가 하나님 안에서 누리는 기쁨과 만족을 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성명 יְהוָה를 관례적 대치어가 아니라 고유명으로 옮기기 위해 ‘야훼’를 유지했습니다.
- source_word: בָּמֳותֵי אָרֶץ
  english_pob_choice: the heights of the earth
  chosen_korean: 땅의 높은 곳들
  alternatives_korean:
  - 땅의 높이들
  - 땅의 높은 곳
  lexicon: HALOT
  rationale: 지리적 ‘산당’으로 좁히지 않고, POB의 선택처럼 고양·승귀의 비유를 살리는 표현으로 옮겼습니다.
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  english_pob_choice: the inheritance of Jacob your father
  chosen_korean: 네 조상 야곱의 유산
  alternatives_korean:
  - 네 아버지 야곱의 기업
  - 네 조상 야곱의 기업
  lexicon: HALOT
  rationale: ‘נַחֲלָה’의 언약적 상속 의미를 담되, 현대 한국어에서 더 자연스러운 ‘유산’으로 옮겨 조상-언약 계승의 의미를 드러냈습니다.
- source_word: פִּי יְהוָה דִּבֵּר
  english_pob_choice: the mouth of Yahweh has spoken
  chosen_korean: 야훼의 입이 말씀하셨기 때문입니다
  alternatives_korean:
  - 야훼께서 말씀하셨기 때문입니다
  - 야훼의 입으로 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현 ‘여호와의 입’은 예언적 권위를 강조하므로, 이를 완화하지 않고 그대로 살렸습니다.
theological_decisions:
- issue: 야훼 이름의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 음역해 고유한 언약 이름을 보존합니다.
  alternative_readings:
  - ‘여호와’로 음역
  - ‘주님’으로 대치
  rationale: 이 구절은 단순 호칭이 아니라 하나님의 직접적인 언약 이름을 사용하므로, 대치어보다 음역이 원문 대비에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘땅의 높은 곳들’의 의미 보존
  chosen_reading: 승리·안전·높임의 비유를 한 가지로 고정하지 않고, 원문의 상승 이미지를 그대로 유지합니다.
  alternative_readings:
  - 정복의 승리
  - 땅에서의 번영
  - 산당
  rationale: 문맥은 복의 고양을 말하지만, 단일한 신학적 의미로 환원하면 시적 폭이 줄어듭니다. 따라서 메타포를 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
