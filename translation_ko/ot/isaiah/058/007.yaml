  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
  footnotes:
  - marker: a
    text: Or 'the poor homeless'; the Hebrew likely refers to poor people who have been driven out or left without shelter.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your own flesh,' an idiom that can mean your own kin or family, and by extension those bound to you in shared humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 떡을 주린 자에게 나누어 주고, 쫓겨난 가난한 이들을[a] 네 집으로 들이며, 벌거벗은 사람을 보면 옷을 입히고, 네 혈육에게서[b] 몸을 숨기지 않는 것이 아니겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 가난한 사람들 가운데 특히 쫓겨났거나 거처를 잃은 이들을 가리킬 수 있습니다. 또는 ‘집 없는 가난한 이들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘네 자신의 살’입니다. 이는 특히 친족이나 가족을 뜻하는 관용구일 수 있으며, 더 넓게는 함께 묶인 인간성을 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
