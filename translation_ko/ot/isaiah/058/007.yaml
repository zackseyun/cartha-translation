  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
  footnotes:
  - marker: a
    text: Or 'the poor homeless'; the Hebrew likely refers to poor people who have been driven out or left without shelter.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your own flesh,' an idiom that can mean your own kin or family, and by extension those bound to you in shared humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 주린 자와 함께 네 떡을 나누어 주며, 유랑하는 가난한 자들을 네 집으로 들이며, 벌거벗은 자를 보거든 그에게 입히고, 네 자신의 살을 피하여 숨지 않는 것이 아니겠느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 가난한 자들 가운데서도 특히 쫓겨나거나 거처를 잃은 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 자신의 살’은 친족을 뜻할 수도 있고, 더 넓게는 함께 묶인 인간성을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס
  english_pob_choice: share
  chosen_korean: 나누어 주며
  alternatives_korean:
  - 나누며
  - 떼어 주며
  lexicon: HALOT
  rationale: 빵을 ‘나누다’는 구체성을 살리면서도 자선 행위를 자연스럽게 드러내기 위해 ‘나누어 주며’로 옮겼습니다.
- source_word: עֲנִיִּים מְרוּדִים
  english_pob_choice: the poor who are cast out
  chosen_korean: 유랑하는 가난한 자들
  alternatives_korean:
  - 쫓겨난 가난한 자들
  - 내쫓긴 가난한 자들
  - 집 없는 가난한 자들
  lexicon: HALOT
  rationale: עֲנִיִּים מְרוּדִים은 가난함과 함께 내쫓기거나 떠돌게 된 상태를 함께 가리킬 수 있어, ‘유랑하는’으로 옮겨 궁핍과 유랑의 뉘앙스를 함께 살렸습니다.
- source_word: תָּבִיא בָיִת
  english_pob_choice: bring ... into your house
  chosen_korean: 네 집으로 들이며
  alternatives_korean:
  - 네 집에 들이며
  - 네 집 안으로 데려오며
  lexicon: HALOT
  rationale: 히필 동사의 ‘데려오다/들이다’ 의미를 살리면서 한국어에서 환대의 행위를 자연스럽게 표현하기 위해 ‘네 집으로 들이며’로 옮겼습니다.
- source_word: עָרֹם
  english_pob_choice: the naked
  chosen_korean: 벌거벗은 자
  alternatives_korean:
  - 나체인 자
  - 헐벗은 자
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 반영해 ‘벌거벗은 자’로 간명하게 옮겼습니다.
- source_word: וְכִסִּיתוֹ
  english_pob_choice: to cover him
  chosen_korean: 그에게 입히고
  alternatives_korean:
  - 그를 덮어 주고
  - 그를 가려 주고
  lexicon: HALOT
  rationale: 직역의 ‘덮다/가리다’보다 본문 맥락에서 요구되는 실제 행동인 ‘입히다’를 택하되, 원문의 보호 의미를 유지했습니다.
- source_word: וּמִבְּשָׂרְךָ
  english_pob_choice: from your own flesh
  chosen_korean: 네 자신의 살
  alternatives_korean:
  - 네 친족
  - 네 가족
  - 네 몸
  lexicon: HALOT
  rationale: 히브리어 관용구를 가족으로 좁히지 않고, POB처럼 ‘flesh’의 비유를 살려 ‘네 자신의 살’로 직역하여 공동 인간성과 혈연적 긴장을 함께 남겼습니다.
- source_word: לֹא תִתְעַלָּם
  english_pob_choice: not hide yourself
  chosen_korean: 숨지 않는 것이 아니겠느냐
  alternatives_korean:
  - 외면하지 않는 것이 아니겠느냐
  - 감추지 않는 것이 아니겠느냐
  lexicon: HALOT
  rationale: 히트파엘의 ‘자신을 숨기다/몸을 피하다’ 의미를 따라 ‘숨다’로 옮기고, 문맥상 수사적 질문의 형태를 살리기 위해 종결을 반문으로 처리했습니다.
theological_decisions:
- issue: וּמִבְּשָׂרְךָ의 범위
  chosen_reading: ‘네 자신의 살’을 그대로 유지하여 친족을 가리킬 가능성과 더 넓은 인간 연대의 의미를 함께 열어 둡니다.
  alternative_readings:
  - 네 친족에게서
  - 네 가족에게서
  rationale: 본문은 혈연을 가리킬 수 있지만, 예언적 윤리는 이 표현을 공유된 인간성으로 확장할 여지를 남깁니다. 따라서 한국어도 의미를 좁히지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
