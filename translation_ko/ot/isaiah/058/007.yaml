  lexicon: HALOT
  rationale: 히필 동사의 ‘데려오다/들이다’ 의미를 살리면서 한국어에서 환대의 행위를 자연스럽게 표현하기 위해 ‘네 집으로 들이며’로 옮겼습니다.
- source_word: עָרֹם
  english_pob_choice: the naked
  chosen_korean: 벌거벗은 자
  alternatives_korean:
  - 나체인 자
  - 헐벗은 자
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 반영해 ‘벌거벗은 자’로 간명하게 옮겼습니다.
- source_word: וְכִסִּיתוֹ
  english_pob_choice: to cover him
  chosen_korean: 그에게 입히고
  alternatives_korean:
  - 그를 덮어 주고
  - 그를 가려 주고
  lexicon: HALOT
  rationale: 직역의 ‘덮다/가리다’보다 본문 맥락에서 요구되는 실제 행동인 ‘입히다’를 택하되, 원문의 보호 의미를 유지했습니다.
- source_word: וּמִבְּשָׂרְךָ
  english_pob_choice: from your own flesh
  chosen_korean: 네 자신의 살
  alternatives_korean:
  - 네 친족
  - 네 가족
  - 네 몸
  lexicon: HALOT
  rationale: 히브리어 관용구를 가족으로 좁히지 않고, POB처럼 ‘flesh’의 비유를 살려 ‘네 자신의 살’로 직역하여 공동 인간성과 혈연적 긴장을 함께 남겼습니다.
- source_word: לֹא תִתְעַלָּם
  english_pob_choice: not hide yourself
  chosen_korean: 숨지 않는 것이 아니겠느냐
  alternatives_korean:
