  - 감추지 않는 것이 아니겠느냐
  lexicon: HALOT
  rationale: 히트파엘의 ‘자신을 숨기다/몸을 피하다’ 의미를 따라 ‘숨다’로 옮기고, 문맥상 수사적 질문의 형태를 살리기 위해 종결을 반문으로 처리했습니다.
theological_decisions:
- issue: וּמִבְּשָׂרְךָ의 범위
  chosen_reading: ‘네 자신의 살’을 그대로 유지하여 친족을 가리킬 가능성과 더 넓은 인간 연대의 의미를 함께 열어 둡니다.
  alternative_readings:
  - 네 친족에게서
  - 네 가족에게서
  rationale: 본문은 혈연을 가리킬 수 있지만, 예언적 윤리는 이 표현을 공유된 인간성으로 확장할 여지를 남깁니다. 따라서 한국어도 의미를 좁히지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
