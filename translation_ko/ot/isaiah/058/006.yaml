id: ISA.58.6
reference: Isaiah 58:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
  footnotes:
  - marker: a
    text: Or 'bonds of wickedness' for 'chains of wickedness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the crushed' for 'the oppressed.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew repeats 'yoke' twice for emphasis, portraying oppression as a physical restraint to be removed.
    reason: cultural_note
translation:
  language: ko
  text: 내가 선택하는 금식이 이것이 아니겠습니까? 곧 악의 사슬을 풀고, 멍에의 줄을 풀어 주며, 억눌린 자를 자유롭게 내보내고, 모든 멍에를 끊는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘악의 결박/사슬’처럼 억압을 물리적 속박으로 묘사합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘억눌린 자’를 가리키며, POB는 이를 사회적 억압의 대상으로 읽어 냈습니다.
    reason: cross_reference
  - marker: c
    text: 히브리어는 같은 ‘멍에’를 반복하여 억압의 강도를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  english_pob_choice: fast
  chosen_korean: 금식
  alternatives_korean:
  - 단식
  lexicon: HALOT
  rationale: 예언문맥에서 ‘the fast that I choose’는 종교 행위 자체를 가리키므로, 관용적이고 문맥에 맞는 ‘금식’이 가장 자연스럽습니다.
- source_word: אֶבְחָרֵהוּ
  english_pob_choice: that I choose
  chosen_korean: 내가 선택하는
  alternatives_korean:
  - 내가 기뻐하는
  - 내가 택한
  lexicon: HALOT
  rationale: בחר의 핵심 의미는 ‘선택하다’이므로, 하나님의 현재적 평가와 선호를 직접 드러내는 ‘선택하는’이 가장 स्रोत-가깝습니다.
- source_word: חַרְצֻבּוֹת
  english_pob_choice: chains
  chosen_korean: 사슬
  alternatives_korean:
  - 결박
  - 족쇄
  lexicon: HALOT
  rationale: 구속과 억압의 물리적 이미지를 살리면서도 현대 한국어에서 자연스럽고 강한 표현인 ‘사슬’을 택했습니다.
- source_word: אֲגֻדּוֹת מוֹטָה
  english_pob_choice: cords of the yoke
  chosen_korean: 멍에의 줄
  alternatives_korean:
  - 멍에의 끈
  - 멍에의 띠
  lexicon: HALOT
  rationale: 둘째 절은 멍에에 매인 ‘묶는 끈’의 이미지를 담고 있으므로, ‘줄’이 가장 직관적이고 한국어로도 감각적으로 전달됩니다.
- source_word: וְשַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים
  english_pob_choice: send the oppressed out free
  chosen_korean: 억눌린 자를 자유롭게 내보내고
  alternatives_korean:
  - 압제받는 자를 풀어 주고
  - 짓눌린 자를 풀어 자유롭게 하고
  lexicon: HALOT
  rationale: שלח는 단순한 ‘풀다’보다 ‘내보내다/보내다’의 운동성을 가지므로, POB의 ‘send ... out free’를 반영해 해방의 방향성을 보존했습니다.
- source_word: רְצוּצִים
  english_pob_choice: the oppressed
  chosen_korean: 억눌린 자
  alternatives_korean:
  - 짓눌린 자
  - 부서진 자
  lexicon: HALOT
  rationale: רצץ는 ‘부수다, 짓누르다’의 수동형이지만, 여기서는 사회적 억압의 대상을 가리키므로 한국어의 표준적 사회언어인 ‘억눌린 자’가 적절합니다.
- source_word: תְּנַתֵּקוּ
  english_pob_choice: to tear off
  chosen_korean: 끊는
  alternatives_korean:
  - 뜯어내는
  - 찢어 버리는
  lexicon: HALOT
  rationale: נתק의 힘있는 분리·절단 이미지를 살리기 위해 ‘끊다’를 택했습니다. 마지막 절은 병렬 구조상 명사형보다 동사형으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 금식의 의미를 내적 경건으로 축소할지 여부
  chosen_reading: 하나님이 택하시는 금식을 억압을 해체하고 해방을 실행하는 구체적 행동으로 옮겼습니다.
  alternative_readings:
  - 개인의 경건 훈련 중심으로 완화하는 번역
  - 추상적으로 ‘참된 금식’이라고만 표현하는 번역
  rationale: 히브리어의 연속된 부정사들은 실제로 결박을 풀고, 멍에를 제거하고, 억눌린 자를 자유케 하는 행위를 열거하므로 사회적·윤리적 실천을 선명하게 드러내야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 멍에 이미지의 보존 여부
  chosen_reading: ‘멍에’를 두 번 모두 유지해 억압의 물리적 비유를 보존했습니다.
  alternative_readings:
  - ‘짐’ 또는 ‘압박’으로 일반화하는 번역
  rationale: 본문은 같은 단어를 반복하여 억압을 실제 목구조물 같은 속박으로 형상화하므로, 추상화하지 않고 반복 구조를 살리는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5
