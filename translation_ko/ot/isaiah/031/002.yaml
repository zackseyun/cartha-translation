id: ISA.31.2
reference: Isaiah 31:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
  footnotes:
  - marker: a
    text: Or 'brings calamity'; Hebrew 'brings evil/disaster,' with 'evil' here meaning judgment or calamity rather than moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'does not withdraw his words.'
    reason: lexical_alternative
  - marker: c
    text: Or 'against the assistance of workers of iniquity.' The Hebrew uses an abstract noun, 'help,' not the personal noun 'helpers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분도 지혜로우시며 재앙을 가져오십니다[a]. 그분은 자신의 말씀[c][b]을 거두지 않으시고, 악인들의 집과 악을 행하는 자들의 도움을 향해 일어나십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난을 가져오십니다’. 히브리어는 문자적으로 ‘악/재앙을 가져오다’이며, 여기서 ‘악’은 도덕적 악이 아니라 심판이나 재난을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자신의 말을 거두지 않으시고’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘악을 행하는 자들의 도움에 맞서’. 히브리어는 ‘돕는 자들’이 아니라 추상명사 ‘도움’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הוּא
  english_pob_choice: Yet he too
  chosen_korean: 그분도
  alternatives_korean:
  - 또 그분은
  - 그분도 역시
  lexicon: HALOT
  rationale: 문맥상 유다의 정치적 계산과 대비되는 하나님의 주체성을 살리면서, הוּא의 강조를 자연스럽게 반영했습니다.
- source_word: חָכָם
  english_pob_choice: wise
  chosen_korean: 지혜로우시며
  alternatives_korean:
  - 지혜로우며
  - 현명하시며
  lexicon: HALOT
  rationale: 형용사 ‘지혜롭다’를 하나님께 대한 존칭 서술로 풀어, 단순한 지적 능력보다 판단과 행위의 통치적 지혜를 살렸습니다.
- source_word: וַיָּבֵא רָע
  english_pob_choice: brings disaster
  chosen_korean: 재앙을 가져오십니다
  alternatives_korean:
  - 재난을 가져오십니다
  - 악을 가져오십니다
  - 해를 가져오십니다
  lexicon: HALOT
  rationale: רָע를 도덕적 ‘악’이 아니라 예언적 심판 문맥의 ‘재앙/재난’으로 이해하여, 하나님이 악을 행하신다는 오해를 피하면서 원문의 행위성을 유지했습니다.
- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 자신의 말씀
  alternatives_korean:
  - 그의 말씀
  - 그의 말들
  lexicon: HALOT
  rationale: 히브리어 복수형의 ‘말들’보다 한국어에서 자연스러운 집합적 표현인 ‘말씀’을 택하되, 주어의 자기 언급을 분명히 했습니다.
- source_word: לֹא הֵסִיר
  english_pob_choice: does not take back
  chosen_korean: 거두지 않으시고
  alternatives_korean:
  - 되돌리지 않으시고
  - 취소하지 않으시고
  - 거두어들이지 않으시고
  lexicon: HALOT
  rationale: ‘말씀을 거두다’는 기존에 내린 선언을 철회하지 않는다는 뜻을 비교적 자연스럽게 전달하며, 완곡하게 약화시키지 않습니다.
- source_word: עֶזְרַת
  english_pob_choice: the help
  chosen_korean: 도움
  alternatives_korean:
  - 원조
  - 지원
  - 돕는 자들
  lexicon: HALOT
  rationale: 이 명사는 인격체가 아니라 추상명사이므로, POB의 주석처럼 ‘돕는 자들’로 바꾸지 않고 추상적 의미를 살려 ‘도움’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위와 רָע의 의미
  chosen_reading: ‘재앙을 가져오십니다’로 옮겨 심판의 의미를 드러냄
  alternative_readings:
  - ‘악을 가져오십니다’
  - ‘해를 가져오십니다’
  rationale: 문맥상 רָע는 도덕적 악이 아니라 심판으로서의 재앙을 뜻하므로, 하나님에 대한 신학적 오해를 피하면서도 예언적 긴장을 유지해야 합니다.
  doctrine_reference: 예언서의 심판 언어와 하나님의 거룩성
