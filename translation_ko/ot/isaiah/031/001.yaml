id: ISA.31.1
reference: Isaiah 31:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
  footnotes:
  - marker: a
    text: Or 'lean on horses' for 'rely on horses'; the Hebrew verb pictures support sought from something one leans upon.
    reason: lexical_alternative
  - marker: b
    text: Or 'cavalry' for 'horsemen.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: lexical_alternative
translation:
  language: ko
  text: 도움을 얻으려고 이집트로 내려가 말을 의지하고, 병거가 많다고 병거를 신뢰하며 기병이 매우 강하다고 기병을 신뢰하면서도, 이스라엘의 거룩하신 이를 바라보지 않고 야훼를 찾지 않는 자들에게 화가 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의지하다’로 옮긴 히브리어 동사는 지지를 얻기 위해 기대는 모습을 비유적으로 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기병’은 말을 탄 전투원들을 가리킵니다. ‘기마병’ 또는 ‘기병대’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 직접 사용합니다. 이 번역은 이를 ‘야훼’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프다
  - 아아
  lexicon: HALOT
  rationale: 예언적 경고와 심판 선언의 감탄사로, 한국어에서는 고전적이되 의미가 분명한 「화 있을진저」가 ‘Woe’의 공력을 가장 잘 살립니다.
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  english_pob_choice: who rely on horses
  chosen_korean: 말을 의지하고
  alternatives_korean:
  - 말에 기대고
  - 말을 신뢰하고
  lexicon: HALOT
  rationale: שׁען의 ‘기대다/의지하다’라는 신체적 은유를 살리기 위해 「의지하고」를 택했고, ‘rely on horses’의 의존 뉘앙스를 직역보다 자연스럽게 드러냅니다.
- source_word: עַל רֶכֶב ... וְעַל פָּרָשִׁים
  english_pob_choice: trust in chariots ... and in horsemen
  chosen_korean: 병거를 신뢰하고 ... 기병이 매우 강하기 때문입니다
  alternatives_korean:
  - 병거에 의지하고 ... 기마병에
  - 전차를 신뢰하고 ... 기병을
  lexicon: HALOT
  rationale: רכב과 פָּרָשִׁים는 군사력의 구체적 이미지이므로 「병거」「기병」으로 옮겨 본문의 대비를 분명히 했습니다. 'trust in'은 한국어에서 「신뢰하다」보다 「의지하다」도 가능하지만, 군사적 의탁의 대상이라는 점을 드러내기 위해 여기서는 「신뢰하다」를 사용했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩한 분
  - 이스라엘의 거룩하신 하나님
  lexicon: HALOT
  rationale: 이사야서의 고유한 신칭을 직역하되, 한국어 존칭 표현으로 인격적 호칭을 살려 「거룩하신 이」로 옮겼습니다.
- source_word: וְאֶת יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 여호와 대신 학술적 음역 「야훼」를 사용해 야훼 신명 자체를 보존했습니다.
theological_decisions:
- issue: 장절 전체의 예언적 ‘화’ 선언과 현재형 일반화
  chosen_reading: 현재형 서술과 직접 호소를 섞어, 특정 과거 사건보다 그러한 태도 자체를 꾸짖는 예언적 일반 진술로 표현했습니다.
  alternative_readings:
  - 과거형 연속 서술로 옮기기
  - 보다 중립적인 설명문체로 완화하기
  rationale: 히브리어 분사와 동사열은 특정 사건 보고보다 그런 부류의 사람들을 겨냥한 책망이므로, 한국어에서도 현재형과 호소형을 유지해야 심판 발화의 즉시성이 살아납니다.
  doctrine_reference: '예언서 문체: 경고/심판 선언의 현재적 적용'
- issue: 야훼와 ‘이스라엘의 거룩하신 이’의 병렬
  chosen_reading: 하나님의 칭호를 분리해 ‘이스라엘의 거룩하신 이’와 ‘야훼’를 함께 유지했습니다.
  alternative_readings:
  - 둘 다 일반 명칭으로 완화하기
  - 둘 중 하나만 강조하기
  rationale: 본문의 죄목은 정치적 의탁과 더불어 언약 하나님 자체를 찾지 않는 데 있으므로, 두 호칭을 모두 보존해야 신학적 대비가 선명합니다.
  doctrine_reference: 언약 신뢰 대 외교·군사 의존의 대조
