id: ISA.31.4
reference: Isaiah 31:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְהוָ֣ה אֵלַ֡/י כַּ/אֲשֶׁ֣ר יֶהְגֶּה֩ הָ/אַרְיֵ֨ה וְ/הַ/כְּפִ֜יר עַל טַרְפּ֗/וֹ אֲשֶׁ֨ר יִקָּרֵ֤א עָלָי/ו֙ מְלֹ֣א רֹעִ֔ים מִ/קּוֹלָ/ם֙ לֹ֣א יֵחָ֔ת וּ/מֵֽ/הֲמוֹנָ֖/ם לֹ֣א יַֽעֲנֶ֑ה כֵּ֗ן יֵרֵד֙ יְהוָ֣ה צְבָא֔וֹת לִ/צְבֹּ֥א עַל הַר צִיּ֖וֹן וְ/עַל גִּבְעָתָֽ/הּ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
  footnotes:
  - marker: a
    text: Or 'the lion and the young lion'; the Hebrew pairing may be read as a poetic doublet rather than a strict alternative.
    reason: lexical_alternative
  - marker: b
    text: Or 'nor does it answer to their noise'; the Hebrew verb can be understood more literally as 'answer/respond,' though in context it likely means being subdued or intimidated.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 내게 말씀하신 바입니다. 사자나 어린 사자가 제 먹이를 두고 으르렁거리며[a], 많은 목자들이 그를 향해 불려와도, 그들의 소리에 놀라지 않고 그들의 소란에 움츠러들지 않는 것처럼[b], 만군의 야훼께서 시온 산과 그 언덕을 치려고 내려오실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자와 어린 사자’; 히브리어의 병렬은 엄밀한 대안이라기보다 시적 이중구로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 소리에 응답하지 않고’; 히브리어 동사는 문자적으로 ‘대답하다/응답하다’이지만, 문맥상 여기서는 위압에 굴복하지 않는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / project default
  rationale: 본문의 언약적 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, מקור의 고유한 신명 표지를 보존했습니다.
- source_word: מְלֹא רֹעִים
  english_pob_choice: a band of shepherds
  chosen_korean: 많은 목자들이
  alternatives_korean:
  - 목자들의 무리
  - 목자들의 가득한 무리
  lexicon: HALOT
  rationale: מְלֹא는 문자적으로 ‘가득함/충만함’이지만 여기서는 사자에게 대항해 불려온 집합체를 가리키므로, 자연스러운 한국어로 ‘많은 목자들’이라고 옮겼습니다.
- source_word: לֹא יֵחָת
  english_pob_choice: it is not terrified
  chosen_korean: 놀라지 않고
  alternatives_korean:
  - 두려워하지 않고
  - 겁먹지 않고
  - 동요하지 않고
  lexicon: HALOT
  rationale: 사자 비유의 생동감을 살리면서도 과도하게 해석하지 않도록, 외적 충격에 흔들리지 않는 상태를 ‘놀라지 않고’로 표현했습니다.
- source_word: לֹא יַעֲנֶה
  english_pob_choice: cowed by their noise
  chosen_korean: 그들의 소란에 움츠러들지
  alternatives_korean:
  - 그들의 소리에 응답하지
  - 그들의 소란에 굴복하지
  - 그들의 소리에 눌리지
  lexicon: HALOT
  rationale: 이 동사는 여기서 말로 ‘대답하다’보다 위압에 굴복하거나 눌리는 의미가 더 자연스러워, 병행구와 맞게 ‘움츠러들지’로 옮겼습니다.
- source_word: הֲמוֹנָם
  english_pob_choice: their noise
  chosen_korean: 그들의 소란
  alternatives_korean:
  - 그들의 떠들썩함
  - 그들의 요란함
  lexicon: HALOT
  rationale: 군중이 내는 소리의 공세적 뉘앙스를 살리기 위해 단순한 ‘소리’보다 ‘소란’이 원문 상황에 더 가깝습니다.
- source_word: לִצְבֹּא
  english_pob_choice: to wage war
  chosen_korean: 치려고
  alternatives_korean:
  - 싸우려고
  - 전쟁하러
  - 전투에 나서려고
  lexicon: HALOT
  rationale: 군사적 의미를 살리되 한국어 문장 흐름을 자연스럽게 하기 위해, ‘내려오실 것입니다’와 결합되는 목적 표현으로 처리했습니다.
theological_decisions:
- issue: YHWH를 한국어로 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약명을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לֹא יֵחָת / לֹא יַעֲנֶה의 병행을 어떻게 살릴 것인가
  chosen_reading: 두려움과 위압에 굴복하지 않는 사자의 모습
  alternative_readings:
  - 단순히 응답하지 않는 사자
  - 의지적으로 반응하지 않는 사자
  rationale: 이 비유는 사자가 목자들의 수적 우세에 압도되지 않는다는 점을 강조하므로, 두 동사를 모두 ‘두려움/위압에 흔들리지 않음’으로 읽어 병행의 힘을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: preserve tension rather than resolve it'
