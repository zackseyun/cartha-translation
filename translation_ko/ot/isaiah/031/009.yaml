revisions:
- from: 그의 바위는 두려움 때문에 사라지고, 그의 고관들은 깃발 앞에서 떱니다. 야훼께서 말씀하십니다 — 그의 불은 시온에 있고 그의 화덕은 예루살렘에 있습니다.[a][b][c]
  to: 그의 바위는 공포 때문에 사라질 것이며,[a] 그의 고관들은 깃발 때문에 두려워할 것입니다.[b] 시온에 그의 불이 있고 예루살렘에 그의 화덕이 있는 야훼의 말씀입니다.[c]
  rationale: 미래 시제를 원문 문맥에 맞추고, 깃발/군기에 대한 전치사구를 자연스러운 현대 한국어로 다듬었습니다. 또한 야훼의 선언 공식 및 관계절의 문법적 연결을 명확히 했습니다. 바위와 불·화덕의 은유는 해석으로 고정하지 않고 유지했습니다.
  reviewer_model: gpt-5.6-terra
