source:
  edition: WLC
  text: וְ/סַלְע/וֹ֙ מִ/מָּג֣וֹר יַֽעֲב֔וֹר וְ/חַתּ֥וּ מִ/נֵּ֖ס שָׂרָ֑י/ו נְאֻם יְהוָ֗ה אֲשֶׁר א֥וּר ל/וֹ֙ בְּ/צִיּ֔וֹן וְ/תַנּ֥וּר ל֖/וֹ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'his stronghold will pass away in terror.' The Hebrew 'rock' may be a metaphor for Assyria's refuge or ruler.
    reason: lexical_alternative
  - marker: b
    text: Or 'his princes will be dismayed at the banner/standard.'
    reason: alternative_reading
  - marker: c
    text: The imagery of the LORD's 'fire' and 'furnace' in Zion and Jerusalem likely evokes his consuming presence in judgment, though the text does not specify the image more narrowly.
    reason: cultural_note
translation:
  language: ko
  text: 그의 바위는 공포 때문에 사라질 것이며,[a] 그의 고관들은 깃발 때문에 두려워할 것입니다.[b] 시온에 그의 불이 있고 예루살렘에 그의 화덕이 있는 야훼의 말씀입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 요새는 공포 때문에 사라질 것이다.’ ‘바위’는 아시리아의 피난처나 통치자를 가리키는 은유일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 고관들은 깃발/군기 앞에서 당황할 것이다.’
    reason: alternative_reading
  - marker: c
    text: ‘불’과 ‘화덕’의 이미지는 시온과 예루살렘에 집중된 야훼의 심판을 행하시는 임재를 떠올리게 할 수 있으나, 본문은 그 뜻을 더 좁게 규정하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  english_pob_choice: his rock
  chosen_korean: 그의 바위
  alternatives_korean:
  - 그의 바위산
  - 그의 요새
  lexicon: HALOT
  rationale: סלע는 문자적으로 바위/바위산을 뜻하며, 본문은 그 은유를 유지하는 것이 좋으므로 ‘바위’로 옮겼습니다.
- source_word: מִמָּגוֹר
  english_pob_choice: because of terror
  chosen_korean: 두려움 때문에
  alternatives_korean:
  - 공포 때문에
  - 두려움으로 인해
  lexicon: HALOT
  rationale: מִן + מָגוֹר는 원인 관계를 나타낼 수 있으므로, 자연스러운 한국어로 원인을 드러내는 표현을 택했습니다.
- source_word: מִנֵּס
  english_pob_choice: at the signal
  chosen_korean: 깃발 앞에서
  alternatives_korean:
  - 신호 앞에서
  - 표준 앞에서
  - 깃발 때문에
  lexicon: HALOT
  rationale: נֵס는 신호기/깃발/표준을 가리킬 수 있어, 군사적 맥락을 살리면서도 한국어로 자연스러운 ‘깃발 앞에서’를 선택했습니다.
- source_word: שָׂרָיו
  english_pob_choice: his princes
  chosen_korean: 그의 고관들
  alternatives_korean:
  - 그의 방백들
  - 그의 왕자들
  - 그의 지휘관들
  lexicon: HALOT
  rationale: שַׂר는 통치자·고관·지휘관의 폭넓은 의미가 있어, 문맥상 권력자들을 가리키는 ‘고관들’이 가장 무난합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼의 말씀을 전합니다
  lexicon: HALOT
  rationale: 예언 공식은 한국어에서 ‘말씀하십니다’로 자연스럽게 살리되, 신명기적 고유명사는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֲשֶׁר א֥וּר ל֙וֹ בְצִיּוֹן וְתַנּוּר ל֖וֹ בִירוּשָׁלִָם
  english_pob_choice: whose fire is in Zion and whose furnace is in Jerusalem
  chosen_korean: 그의 불은 시온에 있고 그의 화덕은 예루살렘에 있습니다
  alternatives_korean:
  - 그의 불은 시온에 있고 그의 용광로는 예루살렘에 있습니다
  - 그의 불꽃은 시온에 있고 그의 화덕은 예루살렘에 있습니다
  lexicon: HALOT
  rationale: אוּר는 여기서 ‘빛’보다 ‘불’이 적절하고, תַּנּוּר은 ‘화덕/가마’ 계열이어서 병렬을 살린 ‘불… 화덕’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 불과 화덕 이미지
  chosen_reading: 시온과 예루살렘에 있는 불과 화덕은 야훼의 임재와 심판을 암시하는 이미지로 유지했습니다.
  alternative_readings:
  - 제단 불로 특정하기
  - 종말론적 심판으로 명시하기
  rationale: 히브리어 본문은 강한 심판 이미지를 주지만 하나의 해석으로 제한하지 않으므로, 시적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
