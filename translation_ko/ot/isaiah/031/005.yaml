id: ISA.31.5
reference: Isaiah 31:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
  footnotes:
  - marker: a
    text: Or 'sparing' or 'protecting'; the Hebrew verb also echoes the Passover language of Exodus.
    reason: lexical_alternative
translation:
  language: ko
  text: 새가 날아다니듯, 만군의 야훼께서 예루살렘을 지키십니다—지키시고 건져내시며, 넘어가시고 구해내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지나가시고’·‘사면하시고’로 옮길 수 있으며, 이 동사는 유월절 언어를 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  english_pob_choice: Like birds hovering
  chosen_korean: 새가 날아다니듯
  alternatives_korean:
  - 새처럼
  - 나는 새들처럼
  - 날아오르는 새들처럼
  lexicon: WLC + HALOT
  rationale: כְ는 비교를 나타내므로 한국어는 '-듯'으로 자연스럽게 대응했고, עָפוֹת의 생동감을 살리되 불필요한 설명을 덧붙이지 않았습니다.
- source_word: יָגֵן ... גָּנוֹן
  english_pob_choice: will shield ... shielding
  chosen_korean: 지키십니다—지키시고
  alternatives_korean:
  - 보호하십니다—보호하시고
  - 막아 주십니다—막아 주시고
  - 감싸십니다—감싸시고
  lexicon: HALOT
  rationale: יגן/גנון의 반복적 보호 동사를 한국어로는 '지키다'로 통일해 반복과 강조를 살렸고, '보호하다'보다 더 구체적인 방어·호위의 뉘앙스를 유지했습니다.
- source_word: פָּסֹחַ
  english_pob_choice: passing over
  chosen_korean: 넘어가시고
  alternatives_korean:
  - 지나가시고
  - 건너가시고
  - 넘어가며
  lexicon: HALOT
  rationale: פָּסֹחַ의 핵심은 '지나감/건넘'이며, 출애굽기의 유월절 연상을 남기기 위해 '넘어가시고'를 택했습니다. 동시에 '사면/보호'의 함의를 완전히 지우지 않기 위해 문맥 전체에서 보호 동작으로 읽히게 했습니다.
- source_word: וְ/הִמְלִיט
  english_pob_choice: and rescuing
  chosen_korean: 구해내십니다
  alternatives_korean:
  - 건져내십니다
  - 구원하십니다
  - 빠져나오게 하십니다
  lexicon: HALOT
  rationale: מלט은 '도피하게 하다/구해내다'의 의미가 강하므로, 한국어에서는 능동적인 구출감을 주는 '구해내다'를 택해 앞의 '지키다'와 구별했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와 대체어가 아닌 신명기 이름 עצמו를 직접 사용하므로, 본문에서도 고유한 언약 이름을 드러내는 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: פָּסֹחַ의 유월절 함의 보존
  chosen_reading: 넘어가시고
  alternative_readings:
  - 사면하시고
  - 보호하시고
  - 지나가시고
  rationale: 이 동사는 단순한 이동보다 출애굽 유월절의 ‘지나감/넘어감’과 보호의 긴장을 함께 지니므로, 본문은 더 직접적인 표현을 택하고 해석적 완화는 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
