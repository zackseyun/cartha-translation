  source_fidelity: 개정이 필요합니다. 히브리어 주동사 יָגֵן은 미완료형으로, 이 문맥에서는 미래의 보호 행위를 나타냅니다. 초안의 현재형 ‘지키십니다’ 및 종결형 ‘구해내십니다’는 이를 충분히 반영하지 못합니다. 또한 פָּסֹחַ의 각주 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  naturalness: ‘새가 날아다니듯’도 이해되지만, 복수형 צִפֳּרִים과 분사 עָפוֹת를 자연스럽게 살리는 ‘나는 새들처럼’이 더 간결하고 문어체 성경 번역에 알맞습니다. 미래 종결 표현을 마지막에 두고 앞 동작들을 연결하면 합쇼체로 자연스럽습니다.
  terminology: ‘만군의 야훼’, ‘지키다’, ‘건져 내다’, ‘구해 내다’는 원문의 명칭과 보호·구출 동사의 반복 및 구별을 적절히 반영합니다. פָּסֹחַ는 본문에서 ‘넘어가시고’로 유지하되, 각주에서는 ‘아끼시고’와 ‘보호하시고’라는 문맥적 가능성을 제시하는 편이 ‘사면하시고’보다 정확합니다.
