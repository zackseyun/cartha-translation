- from: 앗수르는 사람의 칼이 아닌 칼에 쓰러지고, 인간의 칼이 아닌 칼이 그를 삼킬 것입니다. 그는 칼 앞에서 도망하고, 그의 젊은이들은 강제 노역을 하게 될 것입니다.[a][b][c][d]
  to: 앗수르는 사람의 것이 아닌 칼에 쓰러지고[a], 인간의 것이 아닌 칼이 그를 삼킬 것입니다.[b] 그는 그 칼을 피해 달아나며, 그의 젊은이들은[c] 강제 노역을 하게 될 것입니다.[d]
