id: ISA.31.8
reference: Isaiah 31:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָפַ֤ל אַשּׁוּר֙ בְּ/חֶ֣רֶב לֹא אִ֔ישׁ וְ/חֶ֥רֶב לֹֽא אָדָ֖ם תֹּֽאכֲלֶ֑/נּוּ וְ/נָ֥ס ל/וֹ֙ מִ/פְּנֵי חֶ֔רֶב וּ/בַחוּרָ֖י/ו לָ/מַ֥ס יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
  footnotes:
  - marker: a
    text: Or 'and a sword not of man.' The Hebrew contrasts אִישׁ ('man') and אָדָם ('humankind/man') in parallel.
    reason: lexical_alternative
  - marker: b
    text: That is, by a sword not wielded by human power; the text leaves the exact means of the LORD's judgment unspecified.
    reason: alternative_reading
  - marker: c
    text: Or 'his chosen men'; the Hebrew term can refer to young men in their prime, often in a military setting.
    reason: lexical_alternative
  - marker: d
    text: Or 'will be put to corvée/tribute labor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 앗수르는 사람의 것이 아닌 칼에 쓰러지고[a], 인간의 것이 아닌 칼이 그를 삼킬 것입니다.[b] 그는 그 칼을 피해 달아나며, 그의 젊은이들은[c] 강제 노역을 하게 될 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람이 아닌 칼’입니다. 히브리어는 אִישׁ과 אָדָם을 병렬로 대비시킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이는 인간의 힘으로 휘두른 칼이 아니라는 뜻이며, 본문은 하나님의 심판이 어떤 방식으로 임하는지는 특정하지 않습니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘그의 선택된 사람들’입니다. 히브리어는 전투 상황에서 한창 나이의 젊은이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘부역 또는 공물 노동을 하게 될 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשּׁוּר
  english_pob_choice: Assyria
  chosen_korean: 앗수르
  alternatives_korean:
  - 앗시리아
  lexicon: WLC/HALOT
  rationale: 문맥상 나라 이름을 가리키므로 현대 표기 ‘앗수르’를 쓰되, 한국어 성경에서 널리 인식되는 고유명사 형태를 따랐습니다.
- source_word: לֹא אִישׁ / לֹא אָדָם
  english_pob_choice: not of man / not of humankind
  chosen_korean: 사람의 칼이 아닌 / 인간의 칼이 아닌
  alternatives_korean:
  - 사람이 아닌
  - 인간이 아닌
  - 사람의 손이 아닌
  lexicon: HALOT
  rationale: אִישׁ과 אָדָם의 병렬 대조를 살리기 위해 같은 단어를 반복하지 않고 ‘사람/인간’으로 구분해 옮겼습니다.
- source_word: תֹּאכֲלֶנּוּ
  english_pob_choice: will devour him
  chosen_korean: 그를 삼킬 것입니다
  alternatives_korean:
  - 그를 먹을 것입니다
  - 그를 집어삼킬 것입니다
  lexicon: HALOT
  rationale: 칼이 사람을 ‘먹다’는 히브리어 은유를 한국어에서 자연스럽고 강하게 살리기 위해 ‘삼키다’를 택했습니다.
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  english_pob_choice: and he will flee from before the sword
  chosen_korean: 그는 칼 앞에서 도망하고
  alternatives_korean:
  - 그는 칼을 피해 도망하고
  - 그는 칼 앞에서 달아나고
  lexicon: HALOT
  rationale: מִפְּנֵי의 관용적 뉘앙스인 ‘앞에서/대면하여’를 보존하면서도 한국어로는 자연스럽게 ‘도망하다’로 옮겼습니다.
- source_word: בַחוּרָיו לָמַס יִהְיוּ
  english_pob_choice: his young men will become forced labor
  chosen_korean: 그의 젊은이들은 강제 노역을 하게 될 것입니다
  alternatives_korean:
  - 그의 젊은 남자들은 노역에 종사하게 될 것입니다
  - 그의 젊은이들은 부역을 하게 될 것입니다
  lexicon: HALOT
  rationale: בַחוּרָיו를 ‘젊은이들’로 풀어 기동 가능한 청년층을 가리키는 뜻을 살리고, לָמַס는 ‘강제 노역’으로 번역해 압제적 의미를 분명히 했습니다.
theological_decisions:
- issue: 칼의 출처와 심판 방식
  chosen_reading: 사람이 휘두르는 무기가 아닌, 인간적 원인으로 환원되지 않는 야훼의 심판 도구
  alternative_readings:
  - 단순한 전쟁 무기
  - 전염병이나 천사적 심판에 대한 직접적 암시
  rationale: 본문은 두 번이나 인간성을 부정하지만 심판의 구체적 수단은 밝히지 않으므로, 그 긴장을 유지하는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3 (theological tension preserved)
