id: ISA.31.3
reference: Isaiah 31:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִצְרַ֤יִם אָדָם֙ וְֽ/לֹא אֵ֔ל וְ/סוּסֵי/הֶ֥ם בָּשָׂ֖ר וְ/לֹא ר֑וּחַ וַֽ/יהוָ֞ה יַטֶּ֣ה יָד֗/וֹ וְ/כָשַׁ֤ל עוֹזֵר֙ וְ/נָפַ֣ל עָזֻ֔ר וְ/יַחְדָּ֖ו כֻּלָּ֥/ם יִכְלָיֽוּ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
  footnotes:
  - marker: a
    text: Or 'Egypt is human and not God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their horses are flesh and not spirit'; 'spirit' may also be understood more broadly as life-force or immaterial power, not necessarily a direct reference to the Holy Spirit.
    reason: lexical_alternative
  - marker: c
    text: Or 'all of them will perish' / 'all of them will be consumed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트는 사람이지 하나님이 아닙니다[a]. 그들의 말들은 살이지 영이 아닙니다[b]. 야훼께서 손을 뻗으시면, 돕는 자는 넘어지고 도움을 받는 자는 쓰러질 것이며, 그들은 모두 함께 멸망할 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트는 인간이지 하나님이 아닙니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 말들은 살이지 숨이 아닙니다’; 여기서 ‘영’은 성령을 특별히 가리킨다고 단정되지 않으며, 생명력이나 비물질적 힘을 더 넓게 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 모두 함께 소멸될 것입니다’ 또는 ‘그들은 모두 함께 끝날 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 국가명으로서 현대 표준어 지명 표기를 사용해, 본문이 지시하는 민족/국가를 직접적으로 드러냈습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 하나님과의 대비에서 피조물로서의 인간성을 강조하므로, 성별을 과도하게 부각하지 않으면서도 직설적인 ‘사람’이 적절합니다.
- source_word: בָּשָׂר
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 살
  - 육
  - 육신
  lexicon: HALOT
  rationale: 말들의 물질적·피조물적 성격을 살리기 위해 ‘육체’로 옮겨, 뒤의 ‘영’과의 대조를 분명히 했습니다.
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 기운
  - 성령
  lexicon: HALOT
  rationale: 이 문맥에서는 성령을 가리킨다기보다 육체와 대비되는 비물질적 능력/생명력을 뜻하므로, 소문자에 해당하는 일반명사 ‘영’이 가장 가깝습니다.
- source_word: יַטֶּה יָדוֹ
  english_pob_choice: stretches out his hand
  chosen_korean: 그의 손을 내미시면
  alternatives_korean:
  - 그의 손을 펴시면
  - 그의 손을 뻗으시면
  lexicon: HALOT
  rationale: 야훼의 निर्ण정적 개입을 나타내는 관용 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עוֹזֵר / עָזֻר
  english_pob_choice: the helper / the one helped
  chosen_korean: 돕는 자 / 도움을 받는 자
  alternatives_korean:
  - 도우는 사람 / 도움받는 사람
  - 돕는 이 / 도움받은 이
  lexicon: HALOT
  rationale: 능동·수동 분사를 역할 대비로 유지해야 하므로, 두 당사자의 관계를 드러내는 표현을 각각 살렸습니다.
- source_word: כָּשַׁל / נָפַל / יִכְלָיוּן
  english_pob_choice: will stumble / will fall / will come to an end
  chosen_korean: 넘어지고 / 쓰러질 것이며 / 끝장날 것입니다
  alternatives_korean:
  - 비틀리고 / 무너질 것이며 / 소멸할 것입니다
  - 흔들리고 / 떨어질 것이며 / 멸망할 것입니다
  lexicon: HALOT
  rationale: 연속된 몰락의 이미지를 한국어에서 점층적으로 살리되, 마지막 동사는 공동의 파국을 강하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ를 성령으로 좁혀 읽을지, 피조물적 ‘영’으로 읽을지
  chosen_reading: 일반명사 ‘영’으로 유지합니다.
  alternative_readings:
  - 성령
  - 숨
  - 기운
  rationale: 본문은 이집트의 말들을 육체와 대비되는 비신적, 비물질적 힘으로 말할 뿐이므로, 성령을 함의한다고 단정하지 않고 본문의 긴장을 보존합니다.
  doctrine_reference: '본문의 의도 보존: explicit하지 않은 성령 해석을 주입하지 않음.'
- issue: יַטֶּה יָדוֹ의 주어를 야훼의 심판 행위로 얼마나 직접적으로 표현할지
  chosen_reading: 야훼께서 손을 내미시면으로 직접 옮깁니다.
  alternative_readings:
  - 야훼께서 손을 펴시면
  - 야훼께서 손을 뻗으시면
  rationale: 문맥상 야훼의 능동적 개입이 원인이고, 그 결과로 도우는 자와 도움받는 자가 함께 무너집니다. 따라서 완곡화하지 않고 인과를 분명히 했습니다.
  doctrine_reference: 심판-구원 문맥에서 하나님의 주권적 개입을 선명하게 드러냄.
