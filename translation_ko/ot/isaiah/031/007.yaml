  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י בַּ/יּ֣וֹם הַ/ה֔וּא יִמְאָס֗וּ/ן אִ֚ישׁ אֱלִילֵ֣י כַסְפּ֔/וֹ וֶ/אֱלִילֵ֖י זְהָב֑/וֹ אֲשֶׁ֨ר עָשׂ֥וּ לָ/כֶ֛ם יְדֵי/כֶ֖ם חֵֽטְא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: ko
  text: 그 날에는 각 사람이 자기 은으로 만든 우상과 자기 금으로 만든 우상을 버릴 것이니, 곧 여러분의 손이 만들어 여러분에게 죄가 되게 한 그것들입니다.
  philosophy: formal
lexical_decisions:
- source_word: יִמְאָסוּן / יִמְאָסוּ
  english_pob_choice: will reject
  chosen_korean: 버릴 것이니
  alternatives_korean:
  - 거절할 것이니
  - 내던질 것이니
  - 외면할 것이니
  lexicon: מאס
  rationale: 히브리어 מאס는 단순한 심리적 거부보다 실제로 내치는 동작을 포함할 수 있어, 우상을 적극적으로 ‘버리다’로 옮겨 우상 포기의 행위를 분명히 했습니다.
- source_word: אֱלִילֵי כַסְפּוֹ / אֱלִילֵי זְהָבוֹ
  english_pob_choice: his idols of silver and his idols of gold
  chosen_korean: 자기 은으로 만든 우상과 자기 금으로 만든 우상
  alternatives_korean:
  - 은 우상과 금 우상
  - 은으로 된 우상과 금으로 된 우상
  lexicon: אֱלִיל
  rationale: אֱלִיל은 실제 힘이 없는 우상을 가리키므로 ‘우상’으로 옮기고, 속격 관계는 한국어 자연성을 위해 ‘~으로 만든’으로 풀어 주었습니다.
- source_word: יְדֵיכֶם חֵטְא
  english_pob_choice: as sin
  chosen_korean: 죄가 되게 한
  alternatives_korean:
  - 죄로 만든
  - 죄인 것
  - 죄가 된
  lexicon: חטא
  rationale: 마지막 חֵטְא는 단순히 ‘죄’라는 명사라기보다 손으로 만든 우상이 죄로 규정되는 진술이므로, 한국어에서는 결과 상태를 드러내는 ‘죄가 되게 한’으로 처리했습니다.
theological_decisions:
- issue: 우상의 실체를 ‘죄’로 규정하는 결말
  chosen_reading: 우상은 단지 잘못된 물건이 아니라, 인간의 손이 만들어 낸 죄의 산물로 제시합니다.
  alternative_readings:
  - 우상을 단순히 금지된 종교물로 완화하는 읽기
  - ‘죄’의 술어를 도덕적 비유로만 약화하는 읽기
  rationale: 본문은 우상의 기원과 성격을 함께 폭로하므로, 한국어도 ‘여러분의 손이 만들어 여러분에게 죄가 되게 한 것들’로 유지해 도덕적·예언적 날카로움을 보존했습니다.
  doctrine_reference: 우상숭배 비판, 제2계명 전통
