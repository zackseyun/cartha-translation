translation:
  language: ko
  text: 이스라엘 자손이 깊이 반역한 그분께로 돌아오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관계 표현은 문법적으로 압축되어 있습니다. ‘그분께로 돌아오십시오’로 옮길 수 있으며, 뒤의 ‘반역하다’와의 관계는 문맥상 ‘그분을 거슬러’ 반역했다는 뜻을 드러냅니다.
    reason: alternative_reading
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현을 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 되돌아가십시오
  - 회개하십시오
  lexicon: HALOT
  rationale: משוב의 명령형은 방향 전환과 관계 회복을 함께 요구하므로, 현대 표준어의 직접적 권고인 '돌아오십시오'가 가장 자연스럽고 예언적 부르심의 뉘앙스를 잘 살립니다.
- source_word: לַאֲשֶׁר
  english_pob_choice: to him from whom
  chosen_korean: 바로 그분께로
  alternatives_korean:
  - 그분을 향해
  - 그분에게서
  lexicon: HALOT
  rationale: 히브리어는 관계절로 대상만 가리키며 하나님의 이름을 직접 말하지 않으므로, 한국어에서는 인칭을 노골적으로 덧붙이기보다 문맥상 지시대상만 살린 표현으로 옮겼습니다.
- source_word: הֶעְמִיקוּ סָרָה
  english_pob_choice: have deeply revolted
  chosen_korean: 깊이 반역한
  alternatives_korean:
  - 깊이 배반한
  - 크게 반역한
  - 깊이 떠난
  lexicon: HALOT
  rationale: העמיקו와 סרה의 결합은 단순한 이탈보다 강한 언약적 반역을 뜻하므로, '깊이 반역한'이 강도와 의미를 함께 전달합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 문자적으로는 'sons of Israel'이지만, 한국어 성경 전통과 현대 가독성을 함께 고려하면 '이스라엘 자손'이 가장 직접적입니다.
theological_decisions:
- issue: 반역의 대상과 귀환의 대상으로서의 하나님을 본문에서 얼마나 명시할 것인가
  chosen_reading: 본문에는 인칭 대명적 지시만 두고, 직접적으로 '하나님'이나 '여호와'를 삽입하지 않았습니다.
  alternative_readings:
  - 여호와께로 돌아오십시오
  - 하나님께로 돌아오십시오
  rationale: 히브리어 본문은 관계절만 사용하고 있어, 문맥상 분명한 지시대상을 해석으로 풀어 쓰되 본문 자체의 절제는 유지하는 편이 원문 충실도에 더 맞습니다.
  doctrine_reference: 원문 우선 원칙과 문맥 보존
