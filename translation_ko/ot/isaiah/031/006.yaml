  naturalness: ‘이스라엘 자손이 깊이 반역한 그분께로 돌아오십시오’는 현대 표준어 합쇼체로 자연스럽고, 한국어의 일반적 어순에도 맞습니다. 기존의 문두 ‘돌아오십시오’와 쉼표는 시적 강조로 가능하지만, 문장 끝에 명령을 두는 편이 더 매끄럽습니다.
