  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
  footnotes:
  - marker: a
    text: Or 'desert' for 'wilderness' in both occurrences of מִדְבָּר.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 거룩한 성읍들이 광야가 되었습니다.[a] 시온은 광야가 되었고, 예루살렘은 폐허가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 מִדְבָּר가 나오는 두 곳을 모두 '사막'으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  english_pob_choice: Your holy cities
  chosen_korean: 주의 거룩한 성읍들
  alternatives_korean:
  - 주의 성스러운 성읍들
  - 주의 거룩한 도시들
  - 주의 거룩한 성들
  lexicon: HALOT
  rationale: 직역의 소유격과 성별을 살리되, 현대 한국어에서 자연스러운 복수 명사구로 옮겼습니다. '성읍'은 도시보다 성경적 지리·공동체 뉘앙스를 더 잘 살립니다.
- source_word: מִדְבָּר
  english_pob_choice: a wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 황무지
  - 사막
  - 들판
  lexicon: HALOT
  rationale: POB의 'wilderness'는 단순한 사막보다 황폐해진 땅의 성격을 함께 드러내므로, 성경적 용례가 넓은 '광야'를 택했습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐함
  alternatives_korean:
  - 폐허
  - 황무지
  - 황폐한 곳
  lexicon: HALOT
  rationale: 명사형 의미를 유지하기 위해 형용사 '황폐한'보다 명사 '황폐함'을 사용해 앞의 평행 구조를 보존했습니다.
theological_decisions:
- issue: 반복되는 היה(‘have become’/‘has become’)의 결과 상태 표현
  chosen_reading: 현재의 폐허 상태를 드러내기 위해 완료·결과 뉘앙스가 있는 '되다/되었습니다'로 옮겼습니다.
  alternative_readings:
  - 되었습니다
  - 이 되었습니다
  - 가 되었습니다
  rationale: 예언적 탄식 문맥에서 단순 과거보다 현재에 남아 있는 결과 상태를 강조하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 예언서 탄식 문맥의 상태 서술
