id: ISA.64.2
reference: Isaiah 64:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
  footnotes:
  - marker: a
    text: Or 'at your presence'; literally 'from before your face/presence.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the mountains quaked' or 'melted'; the Hebrew verb evokes the image of flowing or dissolving before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 놀라운 일들을 행하실 때 우리가 기대하지 못했으며, 주님께서 내려오셨습니다. 산들이 주님 앞에서 흘러내렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 얼굴/임재로부터’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흘러내렸습니다’는 본문의 시적 이미지를 살린 번역으로, ‘떨렸습니다’나 ‘녹아내렸습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ֥ נוֹרָא֖וֹת
  english_pob_choice: When you did awesome things
  chosen_korean: 주님께서 놀라운 일들을 행하실 때
  alternatives_korean:
  - 주님께서 두려운 일들을 행하실 때
  - 주님께서 경외로운 일들을 행하실 때
  lexicon: HALOT
  rationale: ב + infinitive construct는 시간 부사절로 자연스럽게 옮기고, נוֹרָאוֹת는 단순히 ‘무서운’이 아니라 하나님이 경외를 불러일으키는 행위를 가리키므로 ‘놀라운 일들’로 옮겼습니다.
- source_word: לֹא נְקַוֶּה
  english_pob_choice: that we did not expect
  chosen_korean: 우리가 기대하지 못했으며
  alternatives_korean:
  - 우리가 바라지 못했으며
  - 우리가 바라지 않았던
  lexicon: HALOT
  rationale: קוה는 ‘기다리다/바라다’의 뜻이지만 문맥상 예상 밖의 행동을 가리키므로, 영어 POB의 판단을 따라 자연스러운 합쇼체로 ‘기대하지 못했으며’라고 옮겼습니다.
- source_word: יָרַדְתָּ
  english_pob_choice: you came down
  chosen_korean: 주님께서 내려오셨습니다
  alternatives_korean:
  - 주님께서 내려오셨습니다
  - 주님께서 강림하셨습니다
  lexicon: HALOT
  rationale: ירד의 기본 의미를 살리되, 시적·신현 맥락에서 한국어로는 ‘내려오셨습니다’가 가장 सीधे하고 읽기 자연스럽습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님의 임재 앞에서
  - 주님의 얼굴 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘주님의 얼굴/임재로부터’이지만, 산들의 반응을 나타내는 문맥에서는 ‘주님 앞에서’가 가장 간결하면서도 원문의 전면성/대면성을 유지합니다.
- source_word: נָזֹלּוּ
  english_pob_choice: the mountains flowed down
  chosen_korean: 산들이 ... 흘러내렸습니다
  alternatives_korean:
  - 산들이 ... 녹아내렸습니다
  - 산들이 ... 떨렸습니다
  - 산들이 ... 무너져 내렸습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로 ‘흘러내리다/흘러가다’의 시적 이미지를 담으므로, 영어 POB의 핵심 선택을 따라 ‘흘러내렸습니다’로 옮겨 산의 해체 이미지를 보존했습니다.
theological_decisions:
- issue: 산들의 반응을 일반화하지 않고 신현적 시적 이미지를 유지할지 여부
  chosen_reading: ‘산들이 주님 앞에서 흘러내렸습니다’로 유지하여, 하나님의 임재 앞에서 창조세계가 무너지는 신현적 장면을 보존했습니다.
  alternative_readings:
  - 산들이 주님 앞에서 떨렸습니다
  - 산들이 주님 앞에서 녹아내렸습니다
  rationale: 히브리어는 정확한 물리 현상을 설명하기보다 시적 과장으로 하나님의 위엄을 드러냅니다. 너무 일반화하면 본문의 힘이 약해지므로, 원문의 이미지성을 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
