id: ISA.64.4
reference: Isaiah 64:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּגַ֤עְתָּ אֶת שָׂשׂ֙ וְ/עֹ֣שֵׂה צֶ֔דֶק בִּ/דְרָכֶ֖י/ךָ יִזְכְּר֑וּ/ךָ הֵן אַתָּ֤ה קָצַ֨פְתָּ֙ וַֽ/נֶּחֱטָ֔א בָּ/הֶ֥ם עוֹלָ֖ם וְ/נִוָּשֵֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
  footnotes:
  - marker: a
    text: Or 'You meet the one who rejoices and does righteousness.' The Hebrew participles can be taken together as describing the person God receives favorably.
    reason: lexical_alternative
  - marker: b
    text: The clause 'in them for a long time—and shall we be saved?' is textually and syntactically difficult. Alternatives include 'in them is continuance, and we shall be saved' or 'we have been in them a long time, and shall we be saved?'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 기쁘게 의를 행하는 사람을 만나시며, 주님의 길에서 주님을 기억하는 자들을 만나십니다. 보십시오, 주님께서는 진노하셨고 우리는 죄를 지었습니다. 그 길들 안에서 우리는 오랫동안 지내왔으니—우리가 구원을 받겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגַעְתָּ
  english_pob_choice: you meet
  chosen_korean: 만나시며
  alternatives_korean:
  - 찾아가십니다
  - 대면하십니다
  - 맞이하십니다
  lexicon: HALOT
  rationale: פּגע의 기본 의미인 ‘만나다/마주치다’를 살려, 하나님의 관계적 응답을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  english_pob_choice: the one who gladly does righteousness
  chosen_korean: 기쁘게 의를 행하는 사람
  alternatives_korean:
  - 의를 기뻐하며 행하는 사람
  - 기뻐하며 의를 행하는 자
  - 의를 행하며 기뻐하는 사람
  lexicon: HALOT
  rationale: 두 분사구를 한 사람의 성격으로 묶어, POB가 제시한 결합 가능성을 한국어에서 자연스럽게 반영했습니다.
- source_word: בִּדְרָכֶיךָ
  english_pob_choice: in your ways
  chosen_korean: 주님의 길에서
  alternatives_korean:
  - 주님의 길 안에서
  - 주님의 길들에서
  - 주님의 방식대로
  lexicon: HALOT
  rationale: ‘길’은 언약적 삶의 방식과 행로를 모두 담을 수 있어, ‘주님의 길에서’로 옮겨 기억의 장소적·윤리적 뉘앙스를 살렸습니다.
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보십시오
  lexicon: HALOT
  rationale: 서술 전환을 알리는 담화 표지로서 현대적이면서도 호소력을 유지하는 표현을 택했습니다.
- source_word: בָּהֶם עוֹלָם
  english_pob_choice: in them we have been a long time
  chosen_korean: 그 길들 안에서 우리는 오랫동안 지내왔으니
  alternatives_korean:
  - 그것들 안에서 우리는 오랫동안 있었습니다
  - 그 안에 우리는 오래 있었습니다
  - 그 길들 안에서 우리는 오랫동안 있었습니다
  lexicon: HALOT
  rationale: עולם의 장기 지속 의미를 ‘오랫동안’으로 살리고, 히브리어의 불완전한 절을 한국어의 자연스러운 완료형으로 옮겼습니다.
- source_word: וְנִוָּשֵׁעַ
  english_pob_choice: and shall we be saved?
  chosen_korean: 우리가 구원을 받겠습니까?
  alternatives_korean:
  - 우리가 구원을 받겠습니까
  - 우리가 구원받을 수 있겠습니까?
  - 그리고 우리가 구원을 받겠습니까?
  lexicon: HALOT
  rationale: 끝 절의 질문형을 유지해 탄식의 긴장을 살렸고, ‘구원을 받다’로 니팔의 수동적 의미를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 절의 문장 기능
  chosen_reading: 탄식의 수사 의문문으로 처리했습니다.
  alternative_readings:
  - 단정문으로 ‘우리가 구원을 받습니다’
  - ‘우리가 구원을 받겠습니까?’를 약화한 진술적 표현
  rationale: 히브리어의 난해한 구문과 회개 문맥을 고려할 때, 확신을 덧씌우기보다 긴장과 절박함을 그대로 드러내는 편이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
