  source_fidelity: 첫 절에서 히브리어는 하나님께서 의를 행하는 이를 ‘만나신다’고 한 번만 말합니다. 초안의 ‘만나시며 … 만나십니다’는 동사를 반복하여 두 집단을 각각 만나는 뜻으로 바꾸었습니다. 또한 בָהֶם의 선행사는 불분명하므로 ‘그 길들’로 특정하지 않는 편이 낫습니다. 난해한 마지막 절의 의문문 처리는 유지할 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, 첫 절의 중복된 서술을 제거하고 문장 흐름을 자연스럽게 했습니다. ‘그 안에서’는 의도적으로 지시 대상을 확정하지 않습니다.
  terminology: ‘의’, ‘죄를 짓다’, ‘구원을 받다’, ‘진노하다’는 본문의 종교·윤리적 어휘와 현대적 격식체에 적절합니다. ‘주님의 길’은 בִּדְרָכֶיךָ의 비유적·윤리적 표현을 보존합니다.
  issues:
