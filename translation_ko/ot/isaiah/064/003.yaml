id: ISA.64.3
reference: Isaiah 64:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: ko
  text: 옛적부터 아무도 들어 보지 못했고, 어느 귀도 귀 기울여 듣지 못했으며, 어느 눈도 당신 외에 당신을 기다리는 이를 위해 일하시는 하나님을 보지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעוֹלָם
  english_pob_choice: From of old
  chosen_korean: 옛적부터
  alternatives_korean:
  - 옛날부터
  - 오래전부터
  lexicon: עוֹלָם
  rationale: 시간의 아주 이른 기원을 가리키는 관용적 표현이므로, 현대 한국어에서 자연스러운 ‘옛적부터’로 옮겨 원문의 장구한 기간감을 살렸습니다.
- source_word: לֹא שָׁמְעוּ / לֹא הֶאֱזִינוּ
  english_pob_choice: no one has heard, no ear has listened
  chosen_korean: 아무도 듣지 못했고, 아무 귀도 듣지 못했으며
  alternatives_korean:
  - 듣지 못했고, 귀도 기울이지 못했으며
  - 아무도 들어본 적 없고, 아무 귀도 기울인 적이 없으며
  lexicon: שׁמע / אזן
  rationale: 두 동사를 단순 중복으로 처리하지 않고 ‘듣다’와 ‘듣고 받아들이다/경청하다’의 점층을 살리되, 한국어에서는 자연스럽게 ‘아무도’와 ‘아무 귀도’의 병행으로 표현했습니다.
- source_word: אֱלֹהִים זוּלָתְךָ
  english_pob_choice: a God besides you
  chosen_korean: 당신 외에 다른 하나님은 없으니
  alternatives_korean:
  - 당신 외에는 하나님이 없으니
  - 당신 밖에 다른 하나님은 없으니
  lexicon: אֱלֹהִים / זוּלָת
  rationale: ‘하나님’과 ‘외에’의 결합으로 배타성을 분명히 하되, 문맥상 열거의 정점이 되는 신학적 대비를 유지했습니다.
- source_word: לִמְחַכֵּה לוֹ
  english_pob_choice: for the one who waits for him
  chosen_korean: 자신을 기다리는 사람을 위해
  alternatives_korean:
  - 그분을 기다리는 자를 위해
  - 그를 기다리는 사람을 위해
  lexicon: חכה
  rationale: 기다림의 대상이 바로 ‘당신’임을 분명히 하기 위해 대상을 한 번 더 받는 구조로 옮겼고, 현대 한국어에서 어색하지 않도록 ‘사람’을 사용했습니다.
theological_decisions:
- issue: 인칭 대명사인 ‘you/your’의 한국어 호칭 처리
  chosen_reading: 본문의 하나님 호칭은 ‘당신’으로 통일하고, 감탄적 선언부에서도 동일한 존칭을 유지했습니다.
  alternative_readings:
  - 주님
  - 주께서
  rationale: 이 절은 하나님의 유일성과 행위 주체성을 직접 고백하는 문맥이므로, 2인칭을 분명히 드러내는 ‘당신’이 원문 대비 관계성을 가장 잘 보존합니다.
  doctrine_reference: 예언서의 직접 خطاب 처리 원칙
- issue: ‘waits for him’의 행위 주체와 수혜 관계
  chosen_reading: ‘자신을 기다리는 사람을 위해 일하시는 분’으로 옮겨, 기다림과 응답의 인격적 관계를 살렸습니다.
  alternative_readings:
  - 기다리는 자를 위해 역사하시는 분
  - 그를 기다리는 사람에게 행하시는 분
  rationale: 원문은 단순한 일반 진술이 아니라 하나님이 기다림에 응답하여 행하신다는 언약적 관계를 말하므로, 행위의 목적성을 드러내는 표현을 택했습니다.
  doctrine_reference: 언약적 응답성과 섭리
