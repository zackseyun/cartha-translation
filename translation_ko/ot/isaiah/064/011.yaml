  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
  footnotes:
  - marker: a
    text: Or 'Will you hold yourself back because of these things, O LORD?'
    reason: lexical_alternative
  - marker: b
    text: Or 'and humble us exceedingly.' The Hebrew verb can carry the sense of afflicting or humbling.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들 때문에[a] 야훼여, 자신을 억제하시겠습니까? 잠잠히 계시고 우리를 그토록 심하게 괴롭히시겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들 때문에 스스로를 억누르시겠습니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리를 지극히 낮추시겠습니까?’ 히브리어 동사는 ‘괴롭히다’ 또는 ‘낮추다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עַל אֵלֶּה
  english_pob_choice: Will you restrain yourself over these things
  chosen_korean: 이 일들 때문에
  alternatives_korean:
  - 이 일들 위에서
  - 이러한 일들로 인해
  - 이런 것들에 대해
  lexicon: HALOT
  rationale: 히브리어의 הַ/עַל은 원인·대상·상황의 뉘앙스를 함께 띠므로, 한국어에서는 자연스럽게 원인성까지 드러나는 ‘이 일들 때문에’로 옮겨 질문의 맥락을 살렸습니다.
- source_word: תִתְאַפַּק
  english_pob_choice: restrain yourself
  chosen_korean: 자신을 억제하시겠습니까
  alternatives_korean:
  - 스스로를 억누르시겠습니까
  - 참고 계시겠습니까
  - 물러서시겠습니까
  lexicon: HALOT
  rationale: 히트파엘의 반성적 의미를 살려 ‘자신을 억제하다’로 옮겼고, 하나님의 자제/보류를 묻는 문맥을 드러냈습니다.
- source_word: תֶּחֱשֶׁה
  english_pob_choice: keep silent
  chosen_korean: 잠잠하시며
  alternatives_korean:
  - 침묵하시며
  - 말없이 계시며
  - 잠잠히 계시며
  lexicon: HALOT
  rationale: 앞 동사와 병렬을 이루는 단순한 ‘침묵하다’의 의미를 살리되, 현대 한국어에서 자연스러운 서술형 연결을 위해 ‘잠잠하시며’로 처리했습니다.
- source_word: וּ/תְעַנֵּ/נוּ
  english_pob_choice: afflict us
  chosen_korean: 우리를 그토록 심하게 괴롭히시겠습니까
  alternatives_korean:
  - 우리를 괴롭히시겠습니까
  - 우리를 고통스럽게 하시겠습니까
  - 우리를 겸손하게 하시겠습니까
  lexicon: HALOT
  rationale: 이 어근은 ‘괴롭히다/고통스럽게 하다’와 ‘낮추다/겸손하게 하다’의 긴장을 가지므로, 본문 정서에 맞는 직접적 의미를 본문에 두고 강도는 다음 구절로 처리했습니다.
- source_word: עַד מְאֹד
  english_pob_choice: so very severely
  chosen_korean: 그토록 심하게
  alternatives_korean:
  - 지극히
  - 매우
  - 극도로
  lexicon: HALOT
  rationale: 정도부사적 강조를 한국어에서 가장 자연스럽게 전달하기 위해 ‘그토록 심하게’로 옮겨, 이어지는 ‘괴롭히시겠습니까’를 수식하게 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문의 고유명사 יְהוָה를 직역적 대치어가 아니라 음역된 신명으로 보존하기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 화법에서의 존칭
  chosen_reading: 주님께서 ... 하시겠습니까
  alternative_readings:
  - 주께서 ... 하시겠습니까
  - 야훼께서 ... 하시겠습니까
  rationale: 하나님께 드리는 질문형 탄원문이므로 합쇼체를 유지하되, 본문 전체의 직접 호칭은 신명 뒤에 ‘님’을 붙여 한국어 독자에게 자연스럽고 경건한 호칭으로 처리했습니다.
  doctrine_reference: Korean style policy for direct address to God
