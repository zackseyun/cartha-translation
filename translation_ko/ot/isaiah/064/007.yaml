source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: ko
  text: 그러나 이제, 야훼여, 주께서는 우리의 아버지이십니다. 우리는 진흙이요, 주께서는 우리의 토기장이이십니다. 우리는 모두 주의 손이 만드신 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 직접 호명되는 하나님의 이름을 한국어에서도 고유이름으로 살려, 전통적 대체어인 ‘주’보다 이름형 표기를 따랐습니다.
- source_word: אָבִינוּ
  english_pob_choice: our Father
  chosen_korean: 우리의 아버지
  alternatives_korean:
  - 우리의 아버지님
  - 우리의 부모
  lexicon: HALOT
  rationale: 히브리어의 남성 친족 명사 ‘아버지’를 그대로 살려, 하나님과의 언약적·인격적 관계를 분명하게 드러냈습니다.
- source_word: הַחֹמֶר
  english_pob_choice: the clay
  chosen_korean: 진흙
  alternatives_korean:
  - 점토
  - 흙
  lexicon: HALOT
  rationale: 도공 비유에서 한국어로는 ‘진흙’이 가장 자연스럽게 빚는 재료의 이미지를 전달하며, 원문의 비유성을 유지합니다.
- source_word: יֹצְרֵנוּ
  english_pob_choice: our potter
  chosen_korean: 우리의 토기장이
  alternatives_korean:
  - 우리를 지으시는 분
  - 우리의 빚는 이
  lexicon: HALOT
  rationale: אַתָּה와의 평행 구조에서 장인의 이미지를 살리기 위해, 단순히 ‘지으시는 분’보다 비유를 직접 드러내는 ‘토기장이’로 옮겼습니다.
- source_word: וּמַעֲשֵׂה יָדְךָ
  english_pob_choice: the work of your hand
  chosen_korean: 주의 손으로 지으신 작품
  alternatives_korean:
  - 주의 손의 일
  - 주의 손이 만드신 것
  lexicon: HALOT
  rationale: ‘손’의 의인적 표현을 살리되 한국어로는 ‘작품’이 완결된 피조물의 뉘앙스를 자연스럽게 전달합니다. 다만 ‘손으로 지으신’으로 원문성을 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 별도의 칭호가 아니라 고유한 언약 이름이므로, 대체어 ‘주’보다 ‘야훼’로 직접 옮겨 이름의 성격을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님에 대한 부성 호칭
  chosen_reading: 우리의 아버지
  alternative_readings:
  - 우리의 부모
  - 우리의 아버님
  rationale: 원문이 분명히 მამ성 친족 호칭을 사용하므로, 성중립화하지 않고 직접적 부성 언어를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4 (Gender-accurate over gender-neutral)'
