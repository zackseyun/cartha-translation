source:
  edition: WLC
  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
  footnotes:
  - marker: a
    text: Or more specifically, 'like a garment of menstrual impurity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 모두는 부정한 자와 같아졌고[a], 우리의 모든 의로운 행위는 더러운 옷과 같으며, 우리 모두는 잎사귀처럼 시들고, 우리의 죄악은 바람처럼 우리를 날려 보내십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 직역하면 ‘월경 부정의 옷과 같은’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  english_pob_choice: We all became like one who is unclean
  chosen_korean: 우리 모두는 부정한 자와 같아졌고
  alternatives_korean:
  - 우리 모두는 부정한 것과 같아졌고
  - 우리 모두는 불결한 자와 같아졌고
  lexicon: HALOT
  rationale: כַטָּמֵא의 인격적 뉘앙스를 살려 ‘자’로 옮기되, 성경적 정결/부정 개념을 보존하기 위해 ‘부정한’으로 번역했습니다.
- source_word: וּכְבֶגֶד עִדִּים כָּל צִדְקֹתֵינוּ
  english_pob_choice: all our righteous deeds are like a filthy garment
  chosen_korean: 우리의 모든 의로운 행위는 더러운 옷과 같으며
  alternatives_korean:
  - 우리의 모든 의는 더러운 옷과 같으며
  - 우리의 모든 의로운 일은 더러운 옷과 같으며
  lexicon: HALOT
  rationale: צִדְקֹתֵינוּ의 복수형을 ‘의로운 행위’로 풀어 구체적 행위를 드러냈고, עִדִּים은 주석적 구체화를 피하면서도 ‘더러운 옷’으로 부정함의 이미지를 살렸습니다.
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  english_pob_choice: we all wither like a leaf
  chosen_korean: 우리 모두는 잎사귀처럼 시들고
  alternatives_korean:
  - 우리 모두는 잎처럼 시들고
  - 우리 모두는 잎사귀처럼 마르고
  lexicon: HALOT
  rationale: נבל의 시듦/시들어 감을 식물 이미지와 맞추어 ‘시들다’로 옮겼고, כֶעָלֶה는 자연스러운 현대 한국어로 ‘잎사귀처럼’ 처리했습니다.
- source_word: וַעֲוֺנֵינוּ כָרוּחַ יִשָּׂאֻנוּ
  english_pob_choice: our iniquities carry us away like the wind
  chosen_korean: 우리의 죄악은 바람처럼 우리를 날려 보내십니다
  alternatives_korean:
  - 우리의 죄악은 바람처럼 우리를 실어 갑니다
  - 우리의 죄악은 바람처럼 우리를 몰아갑니다
  lexicon: HALOT
  rationale: נשא의 ‘실어 가다/날려 보내다’ 중에서, 바람과 잎사귀의 연속 이미지를 살리는 한국어로 ‘날려 보내다’를 택했습니다. 동사의 인칭은 본문 수사상 능동적 작용을 살리는 방향으로 옮겼습니다.
theological_decisions:
- issue: 부정함과 더러운 옷의 범위
  chosen_reading: 예식적 부정과 도덕적 더러움 중 하나로 좁히지 않고, 회개의 고백이 가진 정결/오염의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 순전히 의식적 부정으로만 읽기
  - 총체적 타락에 대한 교리 문장으로만 읽기
  rationale: 본문은 고백적 시에서 부정과 더러움의 비유를 사용하므로, 후대 교리를 앞세워 의미를 고정하기보다 원문의 긴장을 보존하는 것이 더 정확합니다.
  doctrine_reference: 원문 우선; 정결/부정의 시적 은유 보존
- issue: 신적 주어의 문법적 처리
  chosen_reading: 마지막 동사는 히브리어 수동/피동적 형식의 결과를 한국어에서 자연스럽게 능동처럼 들리게 하지 않도록, ‘날려 보내다’의 이미지로 옮겼습니다.
  alternative_readings:
  - ‘날려 버립니다’로 강하게 처리
  - ‘우리에게 실립니다’로 완화
  rationale: 문맥상 죄악이 사람을 바람처럼 휩쓸어 가는 역동을 살리는 것이 핵심이며, 한국어에서는 이 작용성을 가장 선명하게 드러내는 표현이 필요합니다.
  doctrine_reference: 시적 은유의 힘 보존
