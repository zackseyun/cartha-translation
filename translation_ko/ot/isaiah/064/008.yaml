base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
  footnotes:
  - marker: a
    text: Or 'do not remember guilt forever'; Hebrew עָוֹן can denote both wrongdoing and the guilt that results from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 너무 심하게 진노하지 마시고 죄악을[a] 영원히 기억하지 마십시오. 보십시오, 부디. 우리는 모두 주의 백성입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄악’은 히브리어 עָוֹן을 옮긴 것입니다. 이 말은 문맥에 따라 죄로 말미암은 ‘죄책’ 또는 ‘죄’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  english_pob_choice: Do not be exceedingly angry
  chosen_korean: 너무 심하게 진노하지 마시고
  alternatives_korean:
  - 몹시 노하지 마시고
  - 지나치게 분노하지 마시고
  lexicon: HALOT
  rationale: קצף의 분노/진노 의미를 살리되, עַד מְאֹד의 강도를 한국어의 '너무 심하게'로 자연스럽게 담았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 문맥상 טetragrammaton을 직역 관례에 따라 야훼로 옮겨, 본문의 고유한 언약 이름을 유지했습니다.
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֺן
  english_pob_choice: and do not remember iniquity forever
  chosen_korean: 죄악을 영원히 기억하지 마십시오
  alternatives_korean:
  - 죄책을 영원히 기억하지 마십시오
  - 불의를 영원히 기억하지 마십시오
  lexicon: HALOT
  rationale: זכר + עוון은 심판을 위한 '기억하다'의 법정적 함의를 가지므로 '기억하지 마십시오'를 살렸고, עוון은 여기서 '죄악'으로 옮겨 도덕적 무게를 유지했습니다.
- source_word: הֵן הַבֶּט נָא
  english_pob_choice: Look, please
  chosen_korean: 보십시오, 간구하오니
  alternatives_korean:
  - 보소서, 간청하오니
  - 보십시오, 제발
  lexicon: HALOT
  rationale: הן과 הבט נא의 호소성을 살리되, 예언/기도문 맥락에 맞는 공손한 간청 표현으로 정리했습니다.
- source_word: עַמְּךָ כֻלָּנוּ
  english_pob_choice: we are all your people
  chosen_korean: 우리는 모두 주님의 백성입니다
  alternatives_korean:
  - 우리는 다 주님의 백성입니다
  - 저희는 모두 주님의 백성입니다
  lexicon: HALOT
  rationale: 히브리어의 소유격 관계를 자연스러운 한국어로 풀어, 공동체의 언약적 소속을 분명히 했습니다.
