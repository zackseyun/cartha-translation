source:
  edition: WLC
  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
  footnotes:
  - marker: a
    text: Or, more literally, 'and have melted us in the hand of our iniquity.' The Hebrew verb carries imagery of dissolving or wasting away.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이름을 부르는 이가 없고, 당신께 매달려 붙들려고 스스로를 깨우는 이도 없습니다. 이는 당신이 당신의 얼굴을 우리에게서 숨기셨고, 우리를 우리의 죄악의 손에 내버려 두셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내버려 두셨기 때문입니다’는 히브리어의 더 직역적인 이미지인 ‘우리의 죄악의 손에 우리를 녹이셨다’를 의미상 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹרֵא בְשִׁמְךָ
  english_pob_choice: who calls on your name
  chosen_korean: 당신의 이름을 부르는 이
  alternatives_korean:
  - 당신의 이름을 부르는 사람
  - 당신의 이름을 부르짖는 이
  lexicon: HALOT
  rationale: 히브리어 관용구의 기도·호소 의미를 살리면서, 한국어에서는 ‘부르다’를 써서 자연스럽게 옮겼습니다.
- source_word: מִתְעוֹרֵר לְהַחֲזִיק בָּךְ
  english_pob_choice: who stirs himself up to take hold of you
  chosen_korean: 당신께 매달려 붙들려고 스스로를 깨우는 이
  alternatives_korean:
  - 스스로를 깨워 당신을 붙들려는 이
  - 스스로 분발하여 당신을 붙드는 이
  lexicon: HALOT
  rationale: 반사적 뉘앙스와 ‘붙들다/붙잡다’의 강한 추구 이미지를 함께 살리기 위해 ‘스스로를 깨우다’와 ‘매달려 붙들다’를 결합했습니다.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  english_pob_choice: you have hidden your face
  chosen_korean: 당신이 당신의 얼굴을 우리에게서 숨기셨고
  alternatives_korean:
  - 당신이 얼굴을 우리에게서 감추셨고
  - 당신이 우리에게서 얼굴을 가리셨고
  lexicon: HALOT
  rationale: ‘얼굴’ 이미지를 유지해 신적 외면의 성경적 표현을 보존했고, 직설적 동사를 사용해 원문 감각을 살렸습니다.
- source_word: וַתְּמוּגֵנוּ בְּיַד עֲוֹנֵנוּ
  english_pob_choice: have given us over into the hand of our iniquity
  chosen_korean: 우리를 우리의 죄악의 손에 내버려 두셨기 때문입니다
  alternatives_korean:
  - 우리를 우리의 죄악의 손에 넘기셨기 때문입니다
  - 우리의 죄악의 손에서 우리를 녹이셨기 때문입니다
  lexicon: HALOT
  rationale: POB의 해석을 따라 ‘손에’라는 지배·권세의 이미지를 살리되, 한국어에서는 ‘내버려 두다’로 심판적 방임의 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 하나님의 행위와 인간 죄의 관계
  chosen_reading: 하나님이 얼굴을 숨기신 결과, 백성이 자신의 죄악의 권세 아래 놓인 상태를 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 하나님이 죄 때문에 백성을 소멸시키셨다는 식으로 단정하는 번역
  - 하나님이 단순히 보호를 거두셨다는 식으로 약화한 번역
  rationale: 원문은 심판적 관계를 분명히 하면서도 인과 기제를 철학적으로 설명하지 않습니다. 그래서 하나님의 주권과 인간 책임의 긴장을 유지하는 방향을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
