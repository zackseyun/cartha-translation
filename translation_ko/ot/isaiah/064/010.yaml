id: ISA.64.10
reference: Isaiah 64:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֧ית קָדְשֵׁ֣/נוּ וְ/תִפְאַרְתֵּ֗/נוּ אֲשֶׁ֤ר הִֽלְל֨וּ/ךָ֙ אֲבֹתֵ֔י/נוּ הָיָ֖ה לִ/שְׂרֵ֣פַת אֵ֑שׁ וְ/כָל מַחֲמַדֵּ֖י/נוּ הָיָ֥ה לְ/חָרְבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'has been burned with fire.'
    reason: lexical_alternative
  - marker: b
    text: '''Our fathers'' may also be rendered ''our ancestors,'' but the Hebrew is explicitly ''fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 거룩하고 아름다운 집[a], 곧 우리 조상들이 주를 찬양하던 곳이 불에 타는 곳이 되었고, 우리의 모든 귀한 것들은 황폐하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘불에 타버린 곳이 되었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  english_pob_choice: our holy and beautiful house
  chosen_korean: 우리의 거룩하고 아름다운 집
  alternatives_korean:
  - 우리의 거룩하고 영광스러운 집
  - 우리의 거룩함과 아름다움의 집
  lexicon: HALOT
  rationale: כָּבוֹד/תִפְאָרָה 계열의 의미를 ‘아름다운’으로 살려 성전의 소중함과 장엄함을 자연스럽게 드러냈습니다.
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  english_pob_choice: where our fathers praised you
  chosen_korean: 우리 조상들이 주를 찬양하던 곳
  alternatives_korean:
  - 우리 조상들이 주를 찬양한 곳
  - 우리 아버지들이 주를 찬양하던 곳
  lexicon: HALOT
  rationale: 관계절의 장소성을 한국어로 자연스럽게 풀어 ‘곳’으로 옮겼고, ‘조상들’은 현대 독자가 이해하기 쉬우면서도 역사적 세대 지칭을 유지합니다.
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  english_pob_choice: has become a burning of fire
  chosen_korean: 불에 타는 곳이 되었고
  alternatives_korean:
  - 불타는 곳이 되었고
  - 불에 탄 곳이 되었고
  lexicon: HALOT
  rationale: 히브리어의 강한 명사구를 너무 매끈하게 평이화하지 않되, 한국어에서는 상태 변화가 분명히 드러나는 표현으로 옮겼습니다.
- source_word: מַחֲמַדֵּינוּ
  english_pob_choice: our precious things
  chosen_korean: 우리의 모든 귀한 것들
  alternatives_korean:
  - 우리의 소중한 것들
  - 우리의 보배로운 것들
  lexicon: HALOT
  rationale: 가치 있고 사랑받는 대상을 가리키는 뜻을 살려, 성전 문맥에서 지나치게 물질적으로 좁아지지 않도록 했습니다.
- source_word: לְחָרְבָּה
  english_pob_choice: a ruin
  chosen_korean: 황폐하게
  alternatives_korean:
  - 폐허가 되어
  - 황폐함이 되어
  lexicon: HALOT
  rationale: 명사적 종결을 한국어에서는 서술부사형으로 처리해 파괴의 결과 상태를 분명히 했습니다.
theological_decisions:
- issue: ‘우리 조상들이’의 세대 지칭
  chosen_reading: 본문의 역사적-언약적 지시를 살려 ‘조상들’로 옮겼습니다.
  alternative_readings:
  - ‘우리 아버지들’
  - ‘우리 선조들’
  rationale: 히브리어 אֲבֹתֵינוּ는 문자적으로 ‘우리 아버지들’이지만, 한국어에서는 예배 공동체의 역사적 연속성을 드러내는 ‘조상들’이 더 자연스럽습니다. 다만 본문이 가리키는 세대 기억은 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
