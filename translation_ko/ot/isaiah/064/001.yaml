review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the comparative fire-and-water imagery, the purpose of making God's name known to adversaries, and the nations' trembling before God. However, ‘불이 덤불에 붙고’ shifts the Hebrew image from fire acting upon combustible material to fire itself catching on it. ‘불이 마른 잔가지를 태우고’ more directly conveys the active force while retaining the lexical uncertainty in a note. The prayer-like ‘하소서’ is defensible as a continuation of the preceding petition and should be retained.
  naturalness: The proposed revision is natural in modern formal-polite Korean and retains the compact poetic flow. ‘민족들이 주 앞에서 떨게 하소서’ is an idiomatic Korean expression for the contextual petition/result.
  terminology: ‘주의 이름,’ ‘대적들,’ and ‘주 앞에서’ are appropriate, nonsectarian, and faithful to the Hebrew idiom. ‘마른 잔가지’ is preferable in the main text to ‘덤불,’ which can suggest a living thicket rather than readily combustible material.
  issues:
  - severity: medium
    issue: ‘불이 덤불에 붙고’ reverses the image’s agency.
    rationale: The Hebrew presents fire as kindling/burning the difficult combustible material (המסים), not as fire catching onto a bush. Korean should preserve fire's active effect.
  - severity: low
    issue: The main-text term ‘덤불’ is less precise for the rare Hebrew noun.
    rationale: The word denotes readily ignited material; ‘마른 잔가지’ better fits this image while the footnote preserves alternatives and uncertainty.
  revised_text: 마치 불이 마른 잔가지를 태우고 물을 끓게 하듯이, 주의 이름을 주의 대적들에게 알리시고 민족들이 주 앞에서 떨게 하소서—[a][b][c]
  revised_footnotes:
  - marker: a
    text: 히브리어는 쉽게 불붙는 연료를 가리키는 희귀어로, ‘마른 잔가지’ 외에도 ‘그루터기’나 ‘덤불’로 옮길 수 있습니다.
