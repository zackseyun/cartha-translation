id: ISA.64.1
reference: Isaiah 64:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
  footnotes:
  - marker: a
    text: Or 'stubble' or 'dry twigs' for 'brushwood.' The Hebrew term is rare and denotes easily ignited material.
    reason: lexical_alternative
  - marker: b
    text: Or 'makes water bubble.'
    reason: lexical_alternative
  - marker: c
    text: In some English versifications, this line is numbered as Isaiah 63:19b.
    reason: textual_variant
translation:
  language: ko
  text: 마치 불이 마른 잔가지를 태우고 물을 끓게 하듯이, 주의 이름을 주의 대적들에게 알리시고 민족들이 주 앞에서 떨게 하소서—[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 쉽게 불붙는 연료를 가리키는 희귀어로, ‘마른 잔가지’ 외에도 ‘그루터기’나 ‘덤불’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물을 끓게 하다’는 ‘물이 부글거리게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 영어 성경의 절 구분에서는 이 행이 이사야 63:19b에 해당합니다.
    reason: textual_variant
lexical_decisions:
- source_word: כִּ/קְדֹחַ אֵשׁ הֲמָסִים
  english_pob_choice: As when fire kindles brushwood
  chosen_korean: 마치 불이 덤불에 붙듯이
  alternatives_korean:
  - 마치 불이 마른 나뭇가지에 붙듯이
  - 마치 불이 섶나무에 붙듯이
  - 마치 불이 마른 풀에 붙듯이
  lexicon: HALOT
  rationale: 히브리어는 비교 접속사 כִּ와 ‘붙다/타오르다’의 동작을 통해 불이 쉽게 붙는 연료의 이미지를 그리므로, 현대 한국어에서는 자연스럽게 ‘덤불’로 옮겨 비교 구문을 살렸습니다.
- source_word: תִּבְעֶה אֵשׁ מַיִם
  english_pob_choice: fire causes water to boil
  chosen_korean: 불이 물을 끓게 하듯이
  alternatives_korean:
  - 불이 물을 끓게 하듯이
  - 불이 물을 끓이듯이
  - 불이 물을 부글거리게 하듯이
  lexicon: HALOT
  rationale: בעה는 여기서 물이 끓어오르거나 부글거리는 상태를 가리키므로, 직역보다도 한국어 관용에 맞는 ‘끓게 하다’가 시적 이미지와 의미를 함께 전달합니다.
- source_word: לְהוֹדִיעַ שִׁמְךָ לְצָרֶיךָ
  english_pob_choice: to make your name known to your adversaries
  chosen_korean: 주의 이름을 주의 대적들에게 알리시고
  alternatives_korean:
  - 주의 이름을 주의 원수들에게 알리시고
  - 주의 이름을 주의 적대자들에게 알리시고
  - 주의 이름을 주의 적들에게 드러내시고
  lexicon: HALOT
  rationale: הוֹדִיעַ의 사역적 의미를 살려 ‘알리다’로 옮겼고, צָרֶיךָ는 단순한 적보다 관계적 대립을 드러내는 ‘대적들’이 가장 자연스럽습니다.
- source_word: מִפָּנֶיךָ גּוֹיִם יִרְגָּזוּ
  english_pob_choice: so that nations tremble at your presence
  chosen_korean: 민족들이 주 앞에서 떨게 하소서—
  alternatives_korean:
  - 민족들이 주 앞에서 떨게 하소서—
  - 민족들이 주의 임재 앞에서 떨게 하소서—
  - 민족들이 주의 얼굴 앞에서 떨게 하소서—
  lexicon: HALOT
  rationale: מִפָּנֶיךָ는 문자적으로 ‘주의 얼굴/앞’이지만 한국어에서는 예배적이고 문맥에 맞는 ‘주 앞에서’가 더 자연스럽고, יִרְגָּזוּ는 심판적 현현 앞의 ‘떨다’로 충분히 전달됩니다.
theological_decisions:
- issue: 64:1의 탄원형 종결
  chosen_reading: 본절을 간구의 연장선으로 받아들여 종결을 ‘하소서’로 처리했습니다.
  alternative_readings:
  - 서술형으로 옮겨 사실 진술처럼 처리하기
  - 명령형으로 옮겨 직접 요구를 강하게 드러내기
  rationale: 히브리어 문맥상 앞선 간구가 이어지며, 시적 기원문답게 하나님께 대한 직접 청원을 한국어 합쇼체로 유지하는 것이 가장 적합합니다.
  doctrine_reference: 예언서의 기도체 문맥 보존
- issue: 신적 현현의 이미지
  chosen_reading: 불과 끓는 물의 비유를 하나님의 위력적 자기현현과 대적들에 대한 두려움을 함께 담는 이미지로 유지했습니다.
  alternative_readings:
  - 심판만을 강조하기
  - 정결케 하심만을 강조하기
  rationale: 본문은 열강들이 주 앞에서 떨게 되는 장면을 포함하므로, 심판이나 정결 중 하나로 좁히지 않고 긴장을 유지하는 편이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 본문의 시적 긴장 보존
