source:
  edition: WLC
  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
  footnotes:
  - marker: a
    text: Or “How long, Lord?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “houses without man”; that is, without anyone in them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제가 말했습니다. “언제까지입니까, 주님?” 그러자 주님께서 말씀하셨습니다. “도시들이 주민 없이 황폐해지고, 집들에는 사람이 없고, 땅이 황폐하여 황량하게 될 때까지입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: Until when
  chosen_korean: 언제까지입니까
  alternatives_korean:
  - 얼마나 오래입니까
  - 언제까지입니까, 주님
  lexicon: HALOT
  rationale: 히브리어의 질문형 한계를 자연스러운 한국어로 옮기되, 예언자적 탄원의 긴박함을 살리기 위해 직접적인 ‘언제까지’ 표현을 사용했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT
  rationale: 이 구절의 호칭은 하나님께 드리는 경칭이므로 한국어 성경 문체에 맞게 ‘주님’으로 옮겼습니다.
- source_word: מֵאֵין יוֹשֵׁב / מֵאֵין אָדָם
  english_pob_choice: without inhabitant / without man
  chosen_korean: 주민 없이 / 사람 없이
  alternatives_korean:
  - 거주자 없이 / 사람 없이
  - 사람 없이 / 누구도 없이
  lexicon: HALOT
  rationale: 첫 번째 병렬구는 ‘거주하는 자가 없음’을 뜻하므로 ‘주민 없이’로, 두 번째는 אָדָם의 일반 인간 의미를 살려 ‘사람 없이’로 옮겼습니다.
- source_word: תִּשָּׁאֶה שְׁמָמָה
  english_pob_choice: is laid waste, a desolation
  chosen_korean: 황폐하여 완전히 황무지가 될
  alternatives_korean:
  - 황폐해져, 황무지가 될
  - 황폐해져서 황무지가 될
  lexicon: HALOT
  rationale: 히브리어의 중첩된 황폐 표현을 한국어에서 중복 없이 강하게 드러내기 위해 ‘황폐하다’와 ‘황무지’ 이미지를 함께 살렸습니다.
theological_decisions:
- issue: אָדָם의 일반 인간 의미를 한국어로 어떻게 대표시키는가
  chosen_reading: ‘사람’으로 번역해 성별 특정성을 약화시키지 않으면서도 일반 인간을 가리키는 뜻을 유지했습니다.
  alternative_readings:
  - ‘인간 없이’
  - ‘누구도 없이’
  rationale: 히브리어 אָדָם은 여기서 남성 개인이 아니라 인간 일반을 뜻하므로, 예언 문맥의 강한 평행구조를 해치지 않는 범위에서 대표적 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
