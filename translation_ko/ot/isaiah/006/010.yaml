id: ISA.6.10
reference: Isaiah 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
  footnotes:
  - marker: a
    text: Or 'shut their eyes' or 'smear over their eyes'; the Hebrew verb conveys making the eyes unresponsive.
    reason: lexical_alternative
  - marker: b
    text: Or 'return'; the verb can denote turning back generally, and in context may include repentance.
    reason: lexical_alternative
  - marker: c
    text: Hebrew has a collective singular ('this people') with singular verbs in the latter clause; English renders the sense with plural pronouns.
    reason: cultural_note
translation:
  language: ko
  text: 이 백성의 마음을 둔하게 하십시오. 그들의 귀를 무겁게 하십시오. 그들의 눈을 멀게 하십시오. 그들이 자기 눈으로 보고 자기 귀로 듣고 자기 마음으로 깨닫고 돌이켜 고침을 받지 못하게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈을 멀게 하십시오’로 옮긴 히브리어 동사는 눈을 감기게 하거나 덮어 무감응하게 만든다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌이키다’는 여기서 שׁוב이 지닌 기본 의미를 따른 표현으로, 문맥상 회개의 함의도 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이 백성’이라는 집합적 단수와 뒤따르는 단수 동사들을 사용하지만, 한국어에서는 자연스럽게 복수 대명사로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמֵן
  english_pob_choice: Make ... dull
  chosen_korean: 둔하게 하시고
  alternatives_korean:
  - 무감각하게 하시고
  - 살찌게 하시고
  lexicon: HALOT
  rationale: ‘마음을’ 대상으로 한 히필 명령의 비유적 힘을 살리면서, 한국어에서 자연스럽고 본문의 인지적 무딤을 드러내는 표현으로 옮겼습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고와 의지의 중심을 가리키므로, 한국어 성경에서 널리 쓰이면서도 의미 범위가 넓은 ‘마음’이 적절합니다.
- source_word: הַכְבֵּד
  english_pob_choice: make ... heavy
  chosen_korean: 무겁게 하시며
  alternatives_korean:
  - 둔하게 하시며
  - 완고하게 하시며
  lexicon: HALOT
  rationale: ‘귀’를 ‘무겁게 하다’라는 히브리어 은유를 그대로 살려, 단순한 해석어인 ‘완고하게’로 평탄화하지 않았습니다.
- source_word: הָשַׁע
  english_pob_choice: blind
  chosen_korean: 가리십시오
  alternatives_korean:
  - 눈멀게 하십시오
  - 닫아버리십시오
  - 덮어버리십시오
  lexicon: HALOT
  rationale: 동사가 눈을 무감응하게 만드는 효과를 가리키므로, 한국어에서는 결과보다 행위를 선명하게 보이는 ‘가리다’가 적절합니다.
- source_word: וָשָׁב
  english_pob_choice: turn back
  chosen_korean: 돌아와서
  alternatives_korean:
  - 돌이켜서
  - 회개하여
  lexicon: HALOT
  rationale: שׁוב의 기본 의미인 ‘돌아가다/돌이키다’를 살리되, 문맥상 가능한 회개의 함의를 지나치게 좁히지 않도록 했습니다.
theological_decisions:
- issue: 신적 사법적 완악케 하심의 직접성
  chosen_reading: 명령형을 약화하지 않고, 하나님께서 이사야에게 주시는 직접적인 명령으로 옮겼습니다.
  alternative_readings:
  - ‘마음이 둔해지게 하소서’ 식의 허용적 표현
  - 결과만 나타내는 서술형 표현
  rationale: 히브리어가 2인칭 남성 단수 히필 명령형을 사용하므로, 본문의 긴장과 심판적 위임을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 번역 철학 §3
- issue: 집합적 단수의 한국어 처리
  chosen_reading: ‘이 백성’은 단수 집합명사로 두되, 뒤의 대명사와 동사는 한국어 자연성에 맞게 복수성을 드러냈습니다.
  alternative_readings:
  - 모든 대명사를 단수로 유지하기
  - 전부 복수화하여 ‘이 사람들’로 바꾸기
  rationale: 히브리어의 집합적 단수와 문맥상의 다수성을 함께 드러내기 위한 처리로, 의미는 보존하고 가독성을 확보합니다.
  doctrine_reference: 번역 철학 §6
