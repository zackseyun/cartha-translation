id: ISA.6.2
reference: Isaiah 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
  footnotes:
  - marker: a
    text: Or 'seraphs'; the term may be related to a root meaning 'burning ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스랍들이 그분 위에 서 있었습니다. 각자 여섯 날개를 가졌는데, 두 날개로는 자기 얼굴을 가리고, 두 날개로는 자기 발을 가리고, 두 날개로는 날고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스랍들’. 이 용어는 ‘불타는 존재들’과 관련된 어근과 연결될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָפִים
  english_pob_choice: Seraphim
  chosen_korean: 스랍들
  alternatives_korean:
  - 세라핌
  - 불타는 존재들
  lexicon: HALOT
  rationale: 이사야 6장의 특정 천상 존재를 가리키는 용어이므로 음역을 유지하되, 한국어에서는 교회 전통 용례가 분분한 ‘세라핌’보다 원형에 가까운 ‘스랍들’이 원문 식별성을 더 잘 살립니다.
- source_word: עֹמְדִים
  english_pob_choice: were standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 환상 서술의 진행 상태를 살려, 단순 과거보다 ‘서 있었습니다’로 현재 진행적 장면감을 반영했습니다.
- source_word: מִמַּעַל לוֹ
  english_pob_choice: above him
  chosen_korean: 그분 위에
  alternatives_korean:
  - 그 위에
  - 그분 위에서
  lexicon: HALOT
  rationale: 왕좌에 앉으신 주를 가리키는 인격적 대상을 유지하기 위해 ‘그분’을 썼고, 공간 관계는 ‘위에’로 자연스럽게 옮겼습니다.
- source_word: שֵׁשׁ כְּנָפַיִם ... לְאֶחָד
  english_pob_choice: Each had six wings
  chosen_korean: 각자 여섯 날개를 가졌는데
  alternatives_korean:
  - 각자 여섯 날개가 있었는데
  - 한 사람마다 여섯 날개를 가졌는데
  lexicon: HALOT
  rationale: 히브리어의 분배적 단수 의미를 한국어에서는 ‘각자’로 풀어, 각 스랍이 각각 여섯 날개를 가졌다는 점을 분명히 했습니다.
- source_word: בִּשְׁתַּיִם יְכַסֶּה פָנָיו
  english_pob_choice: with two he covered his face
  chosen_korean: 두 날개로는 자기 얼굴을 가리고
  alternatives_korean:
  - 두 날개로는 얼굴을 가리고
  - 두 날개로는 자기 얼굴을 덮고
  lexicon: HALOT
  rationale: 동작의 수단을 ‘-로는’으로 드러내고, ‘cover’는 문맥상 ‘가리다’가 가장 직접적입니다. 대명사는 분배적 단수에 맞춰 ‘자기’로 처리했습니다.
- source_word: בִּשְׁתַּיִם יְכַסֶּה רַגְלָיו
  english_pob_choice: with two he covered his feet
  chosen_korean: 두 날개로는 자기 발을 가리고
  alternatives_korean:
  - 두 날개로는 자기 발을 덮고
  - 두 날개로는 발을 가리고
  lexicon: HALOT
  rationale: ‘발’은 원문이 가리키는 신체 부위를 가장 직접적으로 옮긴 것이며, 앞 절과 같은 방식으로 대칭을 유지했습니다.
- source_word: וּבִשְׁתַּיִם יְעוֹפֵף
  english_pob_choice: and with two he flew
  chosen_korean: 두 날개로는 날고 있었습니다
  alternatives_korean:
  - 두 날개로는 날았습니다
  - 두 날개로는 날았습니다
  lexicon: HALOT
  rationale: 마지막 동사도 환상 장면의 지속성을 살려 ‘날고 있었습니다’로 옮겼습니다. ‘날았습니다’보다 장면의 생동감이 더 잘 보존됩니다.
theological_decisions:
- issue: 스랍의 정체를 음역으로 둘지 번역할지
  chosen_reading: ‘스랍들’로 음역을 유지했습니다.
  alternative_readings:
  - ‘세라핌’
  - ‘불타는 존재들’
  rationale: 이사야 6장의 천상 존재를 특정 명칭으로 남겨 두는 것이 본문이 가진 독특성을 보존합니다. 어원적 의미인 ‘불타는 존재들’은 가능하지만 확정적이지 않아 본문 의미를 좁힐 수 있습니다.
  doctrine_reference: '번역 철학: 원어 우선과 본문 식별성 보존'
