id: ISA.6.3
reference: Isaiah 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
  footnotes:
  - marker: a
    text: Or “the LORD of armies.” The Hebrew title 'the LORD of hosts' refers to the heavenly and earthly forces under his command.
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered “the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 서로 이렇게 외쳤습니다. 「만군의 야훼[a]께서는 거룩하시고 거룩하시고 거룩하십니다[b]. 온 땅이 그의 영광으로 가득합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH. 전통적으로 ‘여호와’ 또는 ‘주’로 옮기기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘만군’은 히브리어 צְבָאוֹת의 번역입니다. ‘군대들’ 또는 ‘군세들’로도 옮길 수 있으며, 야훼의 통치 아래 있는 하늘과 땅의 군세를 가리키는 칭호입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָא זֶה אֶל זֶה
  english_pob_choice: And one called to another
  chosen_korean: 서로에게 외쳤습니다
  alternatives_korean:
  - 한 사람이 다른 사람에게 외쳤습니다
  - 이 사람이 저 사람에게 외쳤습니다
  - 서로 불렀습니다
  lexicon: HALOT
  rationale: 짝을 이루어 주고받는 호칭의 장면이므로, 한국어에서는 자연스럽고 장면성이 살아나는 ‘서로에게 외쳤습니다’로 옮겼습니다.
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  english_pob_choice: Holy, holy, holy
  chosen_korean: 거룩하다, 거룩하다, 거룩하다
  alternatives_korean:
  - 거룩하다, 거룩하다, 거룩하다!
  - 거룩하시다, 거룩하시다, 거룩하시다
  lexicon: HALOT
  rationale: 세 번 반복된 형용사의 강한 강조와 예배적 울림을 보존하기 위해 직접적인 반복을 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 여호와
  - 만군의 야훼 하나님
  lexicon: HALOT
  rationale: 예배적·신학적으로 굳어진 직함을 살리되, 본 프로젝트의 기본값인 יְהוָה=야훼를 유지했습니다. ‘만군’은 צְבָאוֹת의 포괄적 군세 이미지를 비교적 자연스럽게 담습니다.
- source_word: מְלֹא כָל הָאָרֶץ כְּבוֹדוֹ
  english_pob_choice: the whole earth is full of his glory
  chosen_korean: 온 땅이 그의 영광으로 가득합니다
  alternatives_korean:
  - 온 땅이 그의 영광으로 충만합니다
  - 온 땅이 그의 영광이 가득합니다
  lexicon: HALOT
  rationale: 히브리어의 상태 표현을 한국어의 자연스러운 서술로 풀어 ‘가득합니다’로 옮겼습니다. ‘영광으로’는 מלא의 충만함 관계를 분명하게 드러냅니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 Tetragrammaton을 사용하므로, 본 프로젝트 기본 원칙에 따라 개인 이름인 야훼를 유지했습니다. 이는 전통적 대체칭호보다 स्रोत의 직접성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 거룩함의 주어 표지
  chosen_reading: 만군의 야훼는 거룩하십니다
  alternative_readings:
  - 만군의 야훼는 거룩합니다
  - 야훼는 거룩하십니다
  rationale: 예언적 선포이지만 대상이 하나님이므로 존댓말 종결을 사용해 한국어 경어 체계를 반영했습니다. 반복되는 ‘거룩하다’를 주어 서술로 연결해 히브리어의 찬양 선포를 살렸습니다.
  doctrine_reference: Korean style convention for divine address and narration
