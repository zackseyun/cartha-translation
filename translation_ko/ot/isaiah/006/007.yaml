id: ISA.6.7
reference: Isaiah 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּגַּ֣ע עַל פִּ֔/י וַ/יֹּ֕אמֶר הִנֵּ֛ה נָגַ֥ע זֶ֖ה עַל שְׂפָתֶ֑י/ךָ וְ/סָ֣ר עֲוֺנֶ֔/ךָ וְ/חַטָּאתְ/ךָ֖ תְּכֻפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: ko
  text: 그가 내 입에 손을 대고 말씀하셨습니다. 「보십시오, 이것이 당신의 입술에 닿았습니다. 당신의 죄책은 제거되었고, 당신의 죄는 속죄되었습니다」.
  philosophy: formal
lexical_decisions:
- source_word: וַיַּגַּע עַל פִּי
  english_pob_choice: And he touched my mouth
  chosen_korean: 그가 내 입에 손을 대고
  alternatives_korean:
  - 그가 내 입을 만지고
  - 그가 내 입에 닿게 하시고
  lexicon: גע
  rationale: 히브리어 가ּע는 단순한 접촉보다 의도적 접촉을 나타내며, 문맥상 ‘입에 손을 대다’가 자연스럽고 구체적입니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: הִנֵּה
  rationale: POB의 ‘Look’을 살려 독자에게 주의를 환기하는 느낌을 유지하되, 현대 합쇼체에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: נָגַע זֶה עַל שְׂפָתֶיךָ
  english_pob_choice: this has touched your lips
  chosen_korean: 이것이 당신의 입술에 닿았습니다
  alternatives_korean:
  - 이것이 당신의 입술을 만졌습니다
  - 이것이 당신의 입술에 접촉했습니다
  lexicon: נגע
  rationale: ‘닿다’는 מקור의 직접적 접촉과 POB의 단정적 표현을 함께 살리며, 예언적 선언의 간결함을 유지합니다.
- source_word: וְסָר עֲוֺנֶךָ
  english_pob_choice: your guilt is removed
  chosen_korean: 당신의 죄책은 제거되었고
  alternatives_korean:
  - 당신의 죄악은 떠났고
  - 당신의 죄책은 사라졌고
  lexicon: עון
  rationale: עָוֹן은 단순 행위보다 죄책/허물의 짐을 가리키므로, 전통적 ‘죄악’보다 법적·관계적 뉘앙스를 드러내는 ‘죄책’을 택했습니다.
- source_word: וְחַטָּאתְךָ תְּכֻפָּר
  english_pob_choice: and your sin is atoned for
  chosen_korean: 당신의 죄는 속죄되었습니다
  alternatives_korean:
  - 당신의 죄는 대속되었습니다
  - 당신의 죄는 가려졌습니다
  lexicon: כפר
  rationale: כפר의 핵심 의미는 죄를 덮거나 제거하는 속죄 행위이므로, POB의 ‘atoned for’를 한국어 신학 어휘인 ‘속죄되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 죄책과 죄의 병렬 표현
  chosen_reading: ‘죄책은 제거되었고, 죄는 속죄되었습니다’로 구분하여, 시적 평행을 살리면서도 두 표현의 초점을 다르게 유지했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 단순화
  - 둘 다 ‘허물’로 통일
  rationale: 히브리어는 עָוֹן과 חַטָּאת를 구별해 사용하므로, 둘을 같은 한국어로 평준화하면 문장의 신학적 밀도가 약해집니다.
  doctrine_reference: 사 6:7의 정결/속죄 표상
- issue: 직접 화법의 명령형 강도
  chosen_reading: 「보십시오」를 써서 계시 장면의 즉각성과 주의를 환기하는 어조를 유지했습니다.
  alternative_readings:
  - 보라
  - 보세요
  rationale: 예언적 선언의 권위를 살리면서도 현대 한국어 독자에게 과도하게 고어적이지 않도록 조정했습니다.
  doctrine_reference: 예언서의 계시적 화법
