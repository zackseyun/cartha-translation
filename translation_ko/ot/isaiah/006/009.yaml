id: ISA.6.9
reference: Isaiah 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֵ֥ךְ וְ/אָמַרְתָּ֖ לָ/עָ֣ם הַ/זֶּ֑ה שִׁמְע֤וּ שָׁמ֨וֹעַ֙ וְ/אַל תָּבִ֔ינוּ וּ/רְא֥וּ רָא֖וֹ וְ/אַל תֵּדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
  footnotes:
  - marker: a
    text: 'Or, “Hear indeed, but do not understand; see indeed, but do not know,” preserving the Hebrew intensification more formally. The line can also be understood with a predictive force: “You will indeed hear ... you will indeed see ...”'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀하셨습니다. “가서 이 백성에게 말하여라. ‘계속 듣되 깨닫지 못하고, 계속 보되 알지 못하리라.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “계속 듣되 깨닫지 못하고, 계속 보되 알지 못하라”로도 옮길 수 있습니다. 또한 예언적 뉘앙스를 따라 “너희는 참으로 들으리라 … 보리라 …”로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그가 이르셨습니다
  lexicon: HALOT
  rationale: 서술 도입의 단순한 אמר로서 ‘말씀하셨습니다’가 가장 자연스럽고, 이어지는 하나님의 말씀 맥락에도 어울립니다.
- source_word: לֵךְ וְאָמַרְתָּ
  english_pob_choice: Go, and say
  chosen_korean: 가서 … 말하여라
  alternatives_korean:
  - 가서 … 말하십시오
  - 가서 … 말씀하세요
  lexicon: HALOT
  rationale: 이사야에게 주어진 연속 명령을 한국어로 간결하게 살려 ‘가서’와 ‘말하여라’로 옮겼습니다.
- source_word: שִׁמְעוּ שָׁמֹעַ
  english_pob_choice: Keep hearing
  chosen_korean: 계속 듣되
  alternatives_korean:
  - 귀 기울여 듣되
  - 듣고 또 듣되
  lexicon: HALOT
  rationale: 동사+부정사 절대형의 강조를 ‘계속’으로 자연스럽게 살려 반복적·지속적 뉘앙스를 보존했습니다.
- source_word: וְאַל תָּבִינוּ
  english_pob_choice: but do not understand
  chosen_korean: 깨닫지 못하고
  alternatives_korean:
  - 이해하지 못하고
  - 알아차리지 못하고
  lexicon: HALOT
  rationale: בין의 인지·분별 의미를 한국어 성경 문맥에서 넓게 통용되는 ‘깨닫다’로 옮겼습니다.
- source_word: וּרְאוּ רָאוֹ
  english_pob_choice: keep seeing
  chosen_korean: 계속 보되
  alternatives_korean:
  - 계속 바라보되
  - 보고 또 보되
  lexicon: HALOT
  rationale: 시각 행위의 강조를 ‘계속 보되’로 유지해 앞 절과 평행을 이루게 했습니다.
- source_word: וְאַל תֵּדָעוּ
  english_pob_choice: but do not perceive / do not know
  chosen_korean: 알지 못하리라
  alternatives_korean:
  - 알지 못하고
  - 인식하지 못하리라
  lexicon: HALOT
  rationale: ידע의 인지·인식 의미를 살리되, 예언적·심판적 울림을 고려해 종결형 ‘알지 못하리라’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 명령형의 예언적/사법적 울림을 한국어에서 어떻게 보존할지
  chosen_reading: 직접 명령 형태를 유지하되, 그 결과를 예언적으로 들리게 구성했습니다.
  alternative_readings:
  - 단순 미래형으로 바꾸어 ‘너희는 듣고도 … 알지 못할 것이다’로 옮김
  - 명령형을 약화시켜 설명적으로 번역함
  rationale: 원문은 명령형과 부정형이 결합된 독특한 구조이므로, 이를 평이한 미래 진술로 환원하지 않고 긴장감을 유지하는 것이 문법과 신학 양쪽에 더 충실합니다.
  doctrine_reference: 원문 문법 우선; 예언적 사법 선언의 긴장 보존
