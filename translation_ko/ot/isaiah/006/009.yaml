  source_fidelity: 히브리어는 ‘듣다’와 ‘보다’에 각각 명령형+부정사 절대형을 사용하여 강조하고, 뒤의 두 절은 모두 אַל+미완료형의 금지 명령입니다. 초안은 마지막 절만 ‘알지 못하리라’라는 미래 진술로 바꾸어 앞 절의 명령 구조 및 원문 문법과 일치하지 않습니다. 또한 ידע는 여기서 우선 ‘알다’로 옮기는 것이 적절합니다.
  naturalness: ‘계속 듣되/계속 보되’는 현대 한국어에서 이해 가능하지만, 인용문 안에서 ‘깨닫지 못하고’와 ‘알지 못하리라’를 결합하면 문법적 태도가 불균형합니다. ‘듣고 또 듣되, … 말며 / 보고 또 보되, … 말라’는 강조와 병렬을 자연스럽게 보존합니다.
  terminology: ‘백성’, ‘깨닫다’, ‘알다’는 문맥과 원어 어휘의 구별에 적절합니다. 단순 서술 동사 אמר에 대한 ‘말씀하셨습니다’는 하나님 발화의 문맥에서 허용되며, 별도의 교리적 해석을 덧붙이지 않습니다.
  issues:
