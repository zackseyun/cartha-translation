  source_fidelity: ‘그중에서도’는 히브리어에 없는 한정·강조를 더합니다. 또한 אֵלָה는 떡갈나무가 아니라 테레빈스나무(terebinth)이고, אַלּוֹן은 참나무/상수리나무 계열의 oak이므로 현 번역은 두 나무를 모두 한국의 참나무류로 특정하여 구별을 잃습니다. 난해한 בְּשַׁלֶּכֶת은 본문에서 ‘베일 때’로 절제해 옮기고 대안은 각주로 보존하는 편이 안전합니다.
  naturalness: ‘그곳에 십분의 일이 남아 있다 해도’와 ‘그마저도’는 현대 표준 한국어 합쇼체에서 자연스럽고, 심판의 반복을 분명히 합니다. ‘테레빈스나무’는 다소 낯선 식물명이지만 원어의 식물 구별을 보존하기 위해 필요하며, ‘참나무’와 짝지어 읽기에도 무리가 없습니다.
  terminology: ‘거룩한 씨’와 ‘그루터기’는 각각 זֶרַע קֹדֶשׁ 및 מַצֶּבֶת의 비유를 적절히 보존합니다. ‘불에 태워질 것입니다’는 לְבָעֵר의 소각/불사름의 목적·결과를 과도하게 확대하지 않고 전달합니다. 각주는 난해어 בְּשַׁלֶּכֶת이 있는 ‘베일 때’에 직접 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘그중에서도’는 원문에 없는 강조·한정입니다.
    rationale: עוֹד בָהּ עֲשִׂרִיָּה는 ‘그 안에/그곳에 아직 십분의 일이 남아 있어도’라는 뜻이며, ‘그중에서도’가 요구하는 대조 대상은 본문에 없습니다.
  - severity: high
    issue: ‘떡갈나무나 상수리나무’는 אֵלָה와 אַלּוֹן의 식물 구별을 보존하지 못합니다.
    rationale: 떡갈나무와 상수리나무는 모두 한국어에서 참나무류를 가리키지만, אֵלָה는 테레빈스나무이고 אַלּוֹן은 oak입니다. 첫 나무는 음역 식물명으로 유지해야 합니다.
  - severity: medium
    issue: ‘찍혀 넘어질 때’는 난해한 בְּשַׁלֶּכֶת에 구체적 동작을 덧붙입니다.
    rationale: 문맥상 벌채의 뜻으로 이해할 수 있으나, ‘찍혀 넘어지다’는 원문보다 구체적입니다. ‘베일 때’가 절제된 본문 번역이며 낙엽의 가능성은 각주에 남겨야 합니다.
