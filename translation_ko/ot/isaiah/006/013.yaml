reference: Isaiah 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ע֥וֹד בָּ/הּ֙ עֲשִׂ֣רִיָּ֔ה וְ/שָׁ֖בָה וְ/הָיְתָ֣ה לְ/בָעֵ֑ר כָּ/אֵלָ֣ה וְ/כָ/אַלּ֗וֹן אֲשֶׁ֤ר בְּ/שַׁלֶּ֨כֶת֙ מַצֶּ֣בֶת בָּ֔/ם זֶ֥רַע קֹ֖דֶשׁ מַצַּבְתָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
  footnotes:
  - marker: a
    text: Or 'at leaf-fall' / 'when its leaves fall.' The Hebrew term בְּשַׁלֶּכֶת is difficult; the main text follows the sense that fits the stump imagery of a tree after cutting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그중에서도 십분의 일이 남더라도, 그것도 다시 불에 탈 것입니다. 마치 떡갈나무나 상수리나무가 찍혀 넘어질 때에도 그 그루터기가 남아 있는 것과 같습니다. 거룩한 씨가 그 그루터기입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낙엽 질 때’ / ‘잎이 떨어질 때’. 히브리어 בְּשַׁלֶּכֶת은 난해하며, 본문은 그루터기 이미지에 맞는 ‘찍혀 넘어질 때’의 뜻을 따릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וֹד בָּ/הּ֙ עֲשִׂ֣רִיָּ֔ה
  english_pob_choice: though a tenth remains in it
  chosen_korean: 그중에서도 십분의 일이 남더라도
  alternatives_korean:
  - 아직 그 안에 십분의 일이 남아도
  - 그 안에 십분의 일이 남더라도
  lexicon: HALOT
  rationale: עוֹד의 양보적 뉘앙스를 살려 ‘-더라도’로 옮기고, עֲשִׂירִיָּה는 자연스러운 현대어로 ‘십분의 일’로 번역했습니다.
- source_word: וְ/הָיְתָ֣ה לְ/בָעֵ֑ר
  english_pob_choice: it will again be for burning
  chosen_korean: 그것도 다시 불에 탈 것입니다
  alternatives_korean:
  - 그것도 다시 불사름이 될 것입니다
  - 그것도 다시 태워질 것입니다
  lexicon: HALOT
  rationale: לְבָעֵר의 ‘불타다/소각되다’라는 결과를 살리되, 한국어에서는 ‘불에 탈 것입니다’가 가장 직접적이고 덜 설명적입니다.
- source_word: בְּ/שַׁלֶּ֨כֶת֙
  english_pob_choice: when it is felled
  chosen_korean: 찍혀 넘어질 때에도
  alternatives_korean:
  - 낙엽 질 때에도
  - 베어질 때에도
  lexicon: HALOT
  rationale: 이 어형은 난해하므로 문맥의 그루터기 이미지에 맞춰 ‘찍혀 넘어지다’로 옮겼습니다. 낙엽과의 연관 가능성은 본문 주석에 남깁니다.
- source_word: מַצֶּ֣בֶת בָּ֔/ם
  english_pob_choice: whose stump remains
  chosen_korean: 그 그루터기가 남아 있는 것과 같습니다
  alternatives_korean:
  - 그 안에 그루터기가 남아 있는 것과 같습니다
  - 그루터기가 그 안에 남아 있는 것과 같습니다
  lexicon: HALOT
  rationale: מַצֶּבֶת의 나무 비유는 ‘그루터기’가 가장 자연스럽고, יחס구조를 한국어의 관형절로 풀어 의미 관계를 분명히 했습니다.
- source_word: זֶ֥רַע קֹ֖דֶשׁ
  english_pob_choice: The holy seed
  chosen_korean: 거룩한 씨
  alternatives_korean:
  - 거룩한 씨앗
  - 성스러운 씨
  lexicon: HALOT
  rationale: זֶרַע의 언약적·집단적 함의를 살려 ‘씨’로 유지하고, קֹדֶשׁ은 일반적인 종교어휘보다 본문 어감에 맞는 ‘거룩한’으로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 씨’의 지시 대상
  chosen_reading: ‘거룩한 씨’라는 표현을 그대로 두어, 남은 자인지 미래의 استمرار인지 본문이 스스로 넓혀 두는 긴장을 보존했습니다.
  alternative_readings:
  - 남은 신실한 무리
  - 이스라엘의 계속되는 생명
  - 메시아 계보
  rationale: 히브리어는 심판 뒤 남는 거룩한 핵심을 말하지만, 여기서 그 대상을 더 좁히지 않도록 했습니다. 번역이 해석을 앞서지 않게 하려는 선택입니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
