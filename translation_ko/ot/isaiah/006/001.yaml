revisions:
- from: 웃시야 왕이 죽던 해에 나는 주님께서 보좌에 앉아 계신 것을 보았습니다. 그분의 옷자락이 성전을 가득 채우고 있었습니다.[a][b]
  to: 웃시야 왕이 죽은 해에, 나는 보좌에 앉아 계신, 높이 들리신 주님을 보았습니다. 그분의 옷자락[a]이 성전[b]을 가득 채우고 있었습니다.
  rationale: 누락된 רָם וְנִשָּׂא를 ‘높이 들리신’으로 복원하고, מוֹת를 사건 명사로 반영하여 ‘죽은 해’로 고쳤습니다. ‘보좌에 앉아 계신, 높이 들리신’이라는 병렬 수식은 원문의 수식 범위에 관한 해석적 여지를 과도하게 좁히지 않으면서 영어 POB의 의미도 충실히 반영합니다. 각주 a의 위치와 내용을 שׁוּלָיו에 맞게 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:14Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 רָם וְנִשָּׂא(‘높고 들린/높이 들린’)를 본문 번역에서 빠뜨렸습니다. 또한 מוֹת는 죽음이라는 사건을 가리키므로 ‘죽던 해’보다 ‘죽은 해’가 더 정확합니다. רָם וְנִשָּׂא는 히브리어 문법상 보좌와 주님 중 어느 쪽에 연결되는지 해석의 여지가 있으므로, 번역에서 한쪽으로 단정하지 않도록 문장 구조를 조정했습니다.
  naturalness: ‘웃시야 왕이 죽은 해에’와 ‘주님을 보았습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘보좌에 앉아 계신, 높이 들리신 주님’은 약간 문어적이지만 환상 서술의 엄숙한 문체에 알맞고, 원문의 수식 관계에 대한 여지를 보존합니다.
  terminology: ‘주님’은 אֲדֹנָי의 신적 호칭에 적절하며, ‘보좌’, ‘옷자락’, ‘성전’도 문맥과 한국어 성서 문체에 적합합니다. 각주 a는 원문 שׁוּלָיו의 대안인 ‘긴 옷자락/옷자락의 끝’을 설명하도록 해당 단어에 붙였고, 각주 b는 הֵיכָל에 붙였습니다.
