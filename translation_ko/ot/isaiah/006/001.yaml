  - severity: medium
    issue: 초안의 각주 a는 문장 끝에 붙어 있고 ‘성전을 가득 채웠다’라는 시제 대안을 제시하지만, 제시된 영어 감사 기록의 각주 취지와 원어의 주요 어휘 대안은 שׁוּלָיו입니다.
