id: ISA.6.1
reference: Isaiah 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
  footnotes:
  - marker: a
    text: Or 'his train filled the temple.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew hekal can mean 'palace' or 'temple'; here 'temple' fits the heavenly sanctuary vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야 왕이 죽던 해에 나는 주님께서 보좌에 앉아 계신 것을 보았습니다. 그분의 옷자락이 성전을 가득 채우고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 옷자락이 성전을 가득 채웠다’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 הֵיכָל은 ‘궁전’ 또는 ‘성전’을 뜻할 수 있지만, 여기서는 하늘 성소 환상에 맞는 ‘성전’이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  english_pob_choice: In the year of King Uzziah’s death
  chosen_korean: “웃시야 왕이 죽던 해”
  alternatives_korean:
  - “웃시야 왕이 죽은 해”
  - “웃시야 왕의 죽음의 해”
  lexicon: HALOT
  rationale: 시간 부사구로서 사건의 시점을 자연스럽게 한국어로 옮기되, ‘죽던 해’로 사건 중심의 표현을 살렸습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: “주님께서”
  alternatives_korean:
  - “주께서”
  - “주인께서”
  lexicon: HALOT
  rationale: 여기서는 야훼가 아니라 신적 호칭 אֲדֹנָי이므로, POB의 영어처럼 ‘주님’으로 옮기되 문맥상 인칭대명사를 덧붙여 주어 역할을 분명히 했습니다.
- source_word: יֹשֵׁב עַל כִּסֵּא
  english_pob_choice: seated on a throne
  chosen_korean: “보좌에 앉아 계신”
  alternatives_korean:
  - “왕좌에 앉아 계신”
  - “보좌에 앉으신”
  lexicon: HALOT
  rationale: ‘보좌’가 왕권과 예배적 위엄을 함께 살리고, 현재분사적 상태를 ‘앉아 계신’으로 자연스럽게 반영했습니다.
- source_word: רָם וְנִשָּׂא
  english_pob_choice: high and lifted up
  chosen_korean: “높이 들린”
  alternatives_korean:
  - “높고 들린”
  - “높이 들려 계신”
  lexicon: HALOT
  rationale: 두 겹의 상승 이미지를 한국어에서도 유지하기 위해 직설적으로 ‘높이 들린’으로 옮겼습니다.
- source_word: שׁוּלָיו
  english_pob_choice: the hem of his robe
  chosen_korean: “그분의 옷자락”
  alternatives_korean:
  - “그분의 옷단”
  - “그분의 옷의 자락”
  lexicon: HALOT
  rationale: 하단부를 가리키는 구체적 이미지이므로, 현대 독자에게 자연스러운 ‘옷자락’으로 옮겼습니다.
- source_word: מְלֵאִים אֶת הַהֵיכָל
  english_pob_choice: filled the temple
  chosen_korean: “성전을 가득 채우고 있었습니다”
  alternatives_korean:
  - “성전을 채웠습니다”
  - “성전을 가득 채웠습니다”
  lexicon: HALOT
  rationale: 히브리어 분사가 만들어 내는 지속 상태를 반영해 ‘가득 채우고 있었습니다’로 옮겼고, הֵיכָל은 비전의 성소 맥락에 따라 ‘성전’으로 번역했습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 신적 호칭 처리
  chosen_reading: ‘주님’
  alternative_readings:
  - ‘주’
  - ‘주인’
  rationale: 본문은 언약명 YHWH가 아니라 아도나이이므로, 한국 교회어의 익숙함과 원문 구분을 함께 살려 ‘주님’으로 번역했습니다.
  doctrine_reference: 'Contested terms: κύριος / Lord; Translation philosophy §2'
- issue: הֵיכָל의 의미
  chosen_reading: ‘성전’
  alternative_readings:
  - ‘궁전’
  - ‘궁전/성전’
  rationale: 이사야의 보좌 환상과 뒤이은 거룩한 예배 장면을 고려하면, ‘성전’이 독자에게 비전의 성소적 의미를 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
