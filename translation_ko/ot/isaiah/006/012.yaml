  - severity: medium
    issue: ‘많이 될 것입니다’의 어색함과 의미 확대
    rationale: 한국어에서는 ‘곳들이 많이 되다’가 부자연스럽고, ‘되다’가 수량의 변화 과정을 암시할 수 있습니다. ‘많을 것입니다’가 וְרַבָּה의 예언적 서술에 적합합니다.
