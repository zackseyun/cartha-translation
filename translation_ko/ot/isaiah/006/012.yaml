id: ISA.6.12
reference: Isaiah 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
  footnotes:
  - marker: a
    text: Or 'humankind' for 'man'; the Hebrew אָדָם is a collective singular referring to the human population.
    reason: lexical_alternative
  - marker: b
    text: Or 'the abandonment will be great' or 'desolation will be great in the midst of the land.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 야훼께서 사람들[a]을 멀리 옮기실 것이며, 그 땅 한가운데에는 버려진 곳들[b]이 많을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들’은 히브리어 אָדָם의 집합적 단수로, 여기서는 남성 개인이 아니라 인간 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘버려진 곳들’은 ‘버려짐’ 또는 ‘황폐함’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק יְהוָה
  english_pob_choice: will remove far away / Yahweh
  chosen_korean: 야훼께서 사람들을 멀리 옮기실 것이며
  alternatives_korean:
  - 야훼께서 사람들을 멀리 보내실 것이며
  - 야훼께서 사람들을 멀리 떨어뜨리실 것이며
  lexicon: HALOT
  rationale: רחק의 사역적 의미를 살려 단순한 이동이 아니라 ‘멀리 옮기다’로 표현했고, יְהוָה는 본문 원명칭에 따라 ‘야훼’로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: people
  chosen_korean: 사람들을
  alternatives_korean:
  - 인류를
  - 인간들을
  lexicon: HALOT
  rationale: אָדָם은 여기서 집합적 인간을 가리키므로 복수형 ‘사람들을’로 자연스럽게 풀되, 단순한 남성 지칭으로 좁히지 않았습니다.
- source_word: הָעֲזוּבָה
  english_pob_choice: the forsaken places / the abandonment
  chosen_korean: 버려진 곳들이
  alternatives_korean:
  - 황폐한 곳들이
  - 버려짐이
  lexicon: HALOT
  rationale: 문맥상 추상명사보다 땅의 상태를 가리키는 구체적 표현이 적절하므로, ‘버려진 곳들’로 옮겨 판단적 해석을 과도하게 더하지 않았습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 이 땅 한가운데에
  alternatives_korean:
  - 땅 가운데에
  - 이 나라 한복판에
  lexicon: HALOT
  rationale: 공간적 중심을 나타내는 표현을 직역에 가깝게 살려, 온 땅에 퍼진 황폐의 이미지를 유지했습니다.
theological_decisions:
- issue: אָדָם의 집합적 의미와 한국어 수용성
  chosen_reading: ‘사람들’로 번역해 집합적 인간을 뜻하게 했습니다.
  alternative_readings:
  - ‘인류’
  - ‘인간들’
  rationale: 히브리어 단수 집합을 한국어에서 가장 자연스럽게 드러내면서도, 심판으로 인한 인구의 이동이라는 본문 의미를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; preserve collective reference without narrowing'
- issue: עֲזוּבָה의 구체화
  chosen_reading: ‘버려진 곳들’로 구체화했습니다.
  alternative_readings:
  - ‘버려짐’
  - ‘황폐함’
  rationale: 히브리어는 버려진 상태 자체와 그 결과로 남은 장소를 모두 함축할 수 있으나, ‘이 땅 한가운데’라는 구문과 결합할 때 장소적 의미가 더 분명합니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; preserve source sense without paraphrase'
