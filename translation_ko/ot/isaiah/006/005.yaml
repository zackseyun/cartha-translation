source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh of Armies''; traditionally, ''the LORD of Hosts.'''
    reason: alternative_reading
  - marker: b
    text: Or 'I am undone' / 'I am destroyed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 말했습니다. “화가 나에게 있도다. 나는 무너졌습니다. 나는 입술이 부정한 사람이며, 입술이 부정한 백성 가운데 살고 있기 때문입니다. 내 눈이 왕, 만군의 야훼를 보았기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 전통적으로 ‘만군의 주’ 또는 ‘the LORD of Hosts’로 옮깁니다.
    reason: korean_style_note
  - marker: b
    text: ‘나는 무너졌습니다’는 전통 번역 ‘나는 망했습니다/나는 멸망했습니다’에 해당하는 가능 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹי לִי
  english_pob_choice: Woe is me
  chosen_korean: 화가 나에게 있도다
  alternatives_korean:
  - 슬프도다
  - 아, 나에게 재앙이 있도다
  lexicon: HALOT
  rationale: 예언적 탄식과 심판의 위기감을 살리기 위해, 현대 한국어에서 너무 약한 감탄사보다 ‘화가 … 있도다’로 절박한 경고의 뉘앙스를 옮겼습니다.
- source_word: נִדְמֵיתִי
  english_pob_choice: I am ruined
  chosen_korean: 나는 무너졌습니다
  alternatives_korean:
  - 나는 망했습니다
  - 나는 파괴되었습니다
  - 나는 소멸되었습니다
  lexicon: HALOT
  rationale: 문맥상 하나님의 임재 앞에서의 존재적 붕괴를 가리키므로, 지나치게 구체적인 ‘파괴’보다 현대 독자에게 자연스럽고 강한 ‘무너지다’를 택했습니다.
- source_word: טְמֵא שְׂפָתַיִם
  english_pob_choice: of unclean lips
  chosen_korean: 입술이 부정한
  alternatives_korean:
  - 더러운 입술의
  - 입술이 더러운
  - 입술이 깨끗하지 않은
  lexicon: HALOT
  rationale: 히브리어의 속격 표현을 살려 입술 자체의 부정함을 유지했습니다. ‘더러운’보다 제의적·도덕적 부정의 범주를 드러내는 ‘부정한’이 더 정확합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 야훼 군대의 주
  - 만군의 주
  lexicon: HALOT
  rationale: 본문의 신명은 기본 표기인 ‘야훼’로 옮기고, צְבָאוֹת은 천상/군사적 주권을 드러내는 전통적 의미를 살려 ‘만군의’로 번역했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 언약 이름을 음역해 보존했습니다. 본문 내 경배·언약의 식별성을 유지하는 데 유리합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה / YHWH → 야훼'
- issue: 직접 인용 속 예언자의 자기고백 어조
  chosen_reading: 합쇼체 서술 안에 ‘나는 …습니다’로 유지
  alternative_readings:
  - 문어체 평서
  - 더 고어적인 종결
  rationale: 서술은 현대 표준어 합쇼체를 유지하되, 예언자의 절규와 자기파멸 인식을 약화시키지 않도록 직접 인용 내부도 같은 등록으로 일관되게 처리했습니다.
  doctrine_reference: Korean target style guidance
