  naturalness: 초안의 ‘화가 나에게 있도다’는 현대 표준어 합쇼체와 맞지 않고, ‘화’가 이사야에게 임한다는 표현으로 다소 어색하게 들립니다. ‘아, 나는 망했습니다!’는 탄식과 절박함을 자연스럽게 전달합니다. 직접 인용 안에서도 합쇼체를 일관되게 유지했습니다.
