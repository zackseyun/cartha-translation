id: ISA.6.8
reference: Isaiah 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
  footnotes:
  - marker: a
    text: Hebrew 'for us.' The plural may reflect the heavenly council context; some Christian readers also see a canonical resonance with later Trinitarian revelation. The text itself does not specify the referent.
    reason: alternative_reading
  - marker: b
    text: Or 'Here I am.' The Hebrew idiom expresses readiness and availability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 주님의 음성을 들었습니다. 「내가 누구를 보낼까? 누가 우리를 위해 갈까?」 그때 내가 말했습니다. 「제가 여기 있습니다. 저를 보내십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '우리를 위해'를 본문에 그대로 보존했습니다. 그 지시 대상은 본문이 밝히지 않으며, 하늘 회중의 맥락일 수도 있고 후대 기독교 독자는 삼위일체적 울림을 볼 수도 있습니다.
    reason: theological_note
  - marker: b
    text: 직역하면 '제가 여기 있습니다'입니다. 히브리어 관용구는 준비와 응답 가능성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  english_pob_choice: Then I heard
  chosen_korean: 그때 내가 들었습니다
  alternatives_korean:
  - 그리고 내가 들었습니다
  - 그래서 내가 들었습니다
  lexicon: HALOT
  rationale: 이어지는 환상 장면의 진행을 자연스럽게 살리면서, wayyiqtol의 순차적 전개를 '그때'로 옮겨 서술 흐름을 유지했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: HALOT
  rationale: 여기서 אֲדֹנָי는 하나님을 가리키므로, 한국어에서는 직접 화법의 공손한 호칭인 '주님'이 가장 자연스럽습니다.
- source_word: מִי אֶשְׁלַח
  english_pob_choice: Whom shall I send
  chosen_korean: 내가 누구를 보낼까
  alternatives_korean:
  - 내가 누구를 보내야 할까
  - 누구를 내가 보내겠느냐
  lexicon: HALOT
  rationale: 히브리어의 물음형을 반영해 요청과 주도권이 하나님께 있음을 살렸고, 'whom'의 객체성을 한국어 어순으로 자연스럽게 표현했습니다.
- source_word: וּמִי יֵלֶךְ לָנוּ
  english_pob_choice: and who will go for us
  chosen_korean: 누가 우리를 위해 갈까
  alternatives_korean:
  - 누가 우리를 위해 가겠습니까
  - 누가 우리를 위해 가줄까
  lexicon: HALOT
  rationale: 본문의 복수 목적격/여격 뉘앙스를 '우리를 위해'로 직접 살려, 영어 POB가 보존한 'for us'의 해석적 긴장을 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Here am I
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 여기 있사오니
  lexicon: HALOT
  rationale: 히브리어 관용구의 응답성과 준비성을 드러내되, 한국어 현대 문체에서는 '제가 여기 있습니다'가 가장 자연스럽고 분명합니다.
- source_word: שְׁלָחֵנִי
  english_pob_choice: Send me
  chosen_korean: 저를 보내십시오
  alternatives_korean:
  - 저를 보내주세요
  - 저를 보내소서
  lexicon: HALOT
  rationale: 직접 청원형을 합쇼체 명령으로 옮겨, 선지자의 자원적 응답과 하나님의 직접적 파송 요청을 분명히 했습니다.
theological_decisions:
- issue: אֲדֹנָי의 신적 호칭과 직접 화법의 높임
  chosen_reading: 주님의 음성을 들었습니다.
  alternative_readings:
  - 주 하나님의 음성을 들었습니다
  - 주인의 음성을 들었습니다
  rationale: 이 장면의 אֲדֹנָי는 하나님을 가리키므로, 한국어 본문에서는 '주님'으로 번역해 신적 호칭을 분명히 했습니다.
  doctrine_reference: 신적 호칭 번역의 일관성
- issue: '''우리를 위해''의 복수 표현 보존'
  chosen_reading: 누가 우리를 위해 갈까?
  alternative_readings:
  - 누가 나를 위해 갈까?
  - 누가 우리에게 갈까?
  rationale: 히브리어의 1인칭 복수형을 본문 그대로 유지해, 하늘 회의적 배경 가능성이나 이후의 신학적 연관성을 단정하지 않고 열린 채 두었습니다.
  doctrine_reference: 본문이 직접 밝히지 않는 복수 지시 대상을 해소하지 않음
