  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣עָף אֵלַ֗/י אֶחָד֙ מִן הַ/שְּׂרָפִ֔ים וּ/בְ/יָד֖/וֹ רִצְפָּ֑ה בְּ/מֶ֨לְקַחַ֔יִם לָקַ֖ח מֵ/עַ֥ל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
  footnotes:
  - marker: a
    text: Or 'a live coal.' The Hebrew term can denote a hot stone or burning coal taken from the altar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 스랍들 중 하나가 제게 날아왔는데, 그의 손에는 제단에서 집게로 가져온 타는 숯이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타는 숯불’로 옮길 수 있습니다. 히브리어는 제단에서 가져온 뜨겁게 달아오른 돌이나 숯을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף אֵלַי
  english_pob_choice: flew to me
  chosen_korean: 제게 날아왔는데
  alternatives_korean:
  - 제게 날아와서
  - 저에게 날아왔는데
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘날다’를 살리면서, אֵלַי의 방향성을 ‘제게’로 자연스럽게 옮겼습니다. 연결 어미 ‘-는데’는 다음 장면으로 이어지는 서술 흐름을 부드럽게 만듭니다.
- source_word: אֶחָד מִן הַשְּׂרָפִים
  english_pob_choice: one of the seraphim
  chosen_korean: 스랍들 중 하나가
  alternatives_korean:
  - 세라핌들 중 하나가
  - 스랍 한 존재가
  lexicon: HALOT
  rationale: 이 환상 문맥에서는 천상 존재를 가리키는 고유한 용어로서 ‘스랍’을 유지하는 편이 원문과 영어 POB의 처리에 가깝습니다. 복수 소속을 드러내기 위해 ‘중 하나가’로 옮겼습니다.
- source_word: רִצְפָּה
  english_pob_choice: a glowing coal
  chosen_korean: 타는 숯
  alternatives_korean:
  - 타는 석탄
  - 불붙은 숯
  lexicon: HALOT
  rationale: 히브리어는 제단에서 가져온 뜨거운 숯덩이/숯불 조각을 가리키므로, 현대 한국어에서는 ‘타는 숯’이 가장 직접적이고 이해하기 쉽습니다. 영어의 ‘glowing coal’과 달리 지나치게 시적이거나 후대 신학어를 덧씌우지 않습니다.
- source_word: בְּמֶלְקַחַיִם
  english_pob_choice: with tongs
  chosen_korean: 집게로
  alternatives_korean:
  - 집게를 사용하여
  - 집게로 집어
  lexicon: HALOT
  rationale: 도구 표지를 한국어에서는 자연스럽게 부사어로 옮겨 ‘집게로’라 했습니다. 원문의 도구가 무엇인지 분명히 드러내면서도 군더더기를 줄입니다.
- source_word: מֵעַל הַמִּזְבֵּחַ
  english_pob_choice: from the altar
  chosen_korean: 제단에서
  alternatives_korean:
  - 제단 위에서
  - 제단 위로부터
  lexicon: HALOT
  rationale: מֵעַל의 문자적 뉘앙스는 ‘위에서/위로부터’이지만, 이 문맥에서는 제단에서 가져왔다는 사실이 핵심이므로 ‘제단에서’가 가장 자연스럽습니다.
theological_decisions:
- issue: רִצְפָּה의 한국어 처리와 제단 정결 장면의 의미 보존
  chosen_reading: ‘타는 숯’으로 옮겨, 뜨거운 제단 숯이라는 물질성과 정결 장면의 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘생석탄’
  - ‘불덩이’
  - ‘활활 타는 숯’
  rationale: 이 장면은 속죄적 정결 행위를 위한 실제 뜨거운 물체를 강조하므로, 지나치게 상징화하지 않고 물질적 이미지를 보존하는 것이 중요합니다. 영어 POB의 ‘glowing coal’과 동일한 기능을 한국어에서 수행합니다.
  doctrine_reference: Translation philosophy §6
- issue: 스랍(seraphim) 용어의 음역 유지
  chosen_reading: ‘스랍’으로 음역을 유지했습니다.
  alternative_readings:
  - ‘불붙은 천사들’
  - ‘불타는 존재들’
  rationale: 이사야 6장의 환상 속 존재는 일반적인 ‘천사’로 환원하면 문학적·신학적 특수성이 약해집니다. 원문과 영어 POB처럼 고유한 천상 존재 명칭을 유지하는 편이 독자에게 더 정확합니다.
  doctrine_reference: Translation philosophy §1, §6
