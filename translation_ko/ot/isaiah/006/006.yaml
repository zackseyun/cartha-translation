- from: 그때 스랍들 중 하나가 제게 날아왔는데, 그의 손에는 제단에서 집게로 가져온 타는 숯이 있었습니다.[a]
  to: 그때 스랍들 중 하나가 제게 날아왔습니다. 그의 손에는 집게로 제단에서 집어 온 타는 숯이 있었습니다.[a]
  rationale: 문장 구조를 두 문장으로 나누어 원문의 연속된 동작과 손에 든 물체의 묘사를 한국어로 명료하게 제시했습니다. 또한 ‘집게로 제단에서 집어 온’으로 옮겨 집게가 물체를 취하는 데 쓰인 도구임을 분명히 했습니다. רִצְפָּה의 어휘적 불확실성은 본문 ‘타는 숯’과 각주의 돌/숯 대안으로 보존했습니다.
