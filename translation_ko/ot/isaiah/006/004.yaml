language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּנֻ֨עוּ֙ אַמּ֣וֹת הַ/סִּפִּ֔ים מִ/קּ֖וֹל הַ/קּוֹרֵ֑א וְ/הַ/בַּ֖יִת יִמָּלֵ֥א עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
  footnotes:
  - marker: a
    text: Or 'the temple.' Hebrew 'the house,' a common term for the temple sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'posts of the thresholds' or 'supports of the thresholds.' The Hebrew expression refers to structural parts of the doorway/threshold area.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지방의 받침대들이 그 부르는 이의 소리에 흔들렸고, 집에는 연기가 가득 찼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전.’ 히브리어는 흔히 성전 성소를 가리키는 ‘집’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘문지방의 기둥들’ 또는 ‘문지방의 받침들.’ 히브리어 표현은 문과 문지방 주변의 구조물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמּוֹת הַסִּפִּים
  english_pob_choice: the foundations of the thresholds
  chosen_korean: 문지방의 받침대들
  alternatives_korean:
  - 문지방의 기초들
  - 문지방의 버팀대들
  - 문지방의 받침
  lexicon: HALOT
  rationale: אַמּוֹת과 הַסִּפִּים의 결합은 문틀/문지방 구조물의 지지 부분을 가리키므로, 한국어로는 ‘받침대들’이 구조적 기능을 가장 자연스럽게 드러냅니다.
- source_word: מִקּוֹל הַקּוֹרֵא
  english_pob_choice: at the sound of the one calling
  chosen_korean: 그 부르는 이의 소리에
  alternatives_korean:
  - 그 외치는 이의 소리에
  - 그 부르는 자의 소리에
  - 그의 소리에
  lexicon: HALOT
  rationale: מִקּוֹל은 원인/계기의 ‘소리로 인해’이고, הַקּוֹרֵא는 진행 중인 분사이므로 ‘부르는 이’로 옮겨 지속적 행위를 살렸습니다.
- source_word: וְהַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 집
  - 성전
  - 전
  lexicon: HALOT
  rationale: 직역하면 ‘집’이지만, 본문은 성전 환시를 가리키므로 한국어 본문에서는 간결하게 ‘집’이라 두고, 해석을 본문 밖으로 과도하게 끌어올리지 않았습니다.
- source_word: יִמָּלֵא עָשָׁן
  english_pob_choice: was filled with smoke
  chosen_korean: 연기가 가득 찼습니다
  alternatives_korean:
  - 연기로 가득 찼습니다
  - 연기로 가득해졌습니다
  - 연기가 채워졌습니다
  lexicon: HALOT
  rationale: נִפְעַל의 수동 완료 흐름을 자연스러운 서술문으로 옮기되, ‘가득 찼습니다’로 연기의 충만함을 분명히 했습니다.
theological_decisions:
- issue: ‘집’과 성전 암시의 보존
  chosen_reading: 본문에는 ‘집’을 유지하고, 성전 의미는 독자가 문맥에서 파악하도록 둡니다.
  alternative_readings:
  - 성전
  - 성소
  rationale: 히브리어는 בַּיִת(집)을 사용하므로, 해석어를 본문에 직접 넣기보다 원문 어휘를 유지하는 편이 POB의 source-direct 원칙에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
