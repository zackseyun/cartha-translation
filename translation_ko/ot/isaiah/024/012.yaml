source:
  edition: WLC
  text: נִשְׁאַ֥ר בָּ/עִ֖יר שַׁמָּ֑ה וּ/שְׁאִיָּ֖ה יֻכַּת שָֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
  footnotes:
  - marker: a
    text: Or 'Waste remains in the city, and the gate is struck down to ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 도성에는 황폐함만 남아 있고, 성문은 무너져 내립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도성에는 황무함이 남아 있고, 성문은 무너져 내립니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר
  english_pob_choice: is left
  chosen_korean: 남아 있습니다
  alternatives_korean:
  - 남아 있습니다
  - 남겨집니다
  - 남습니다
  lexicon: HALOT
  rationale: Niphal 형식의 ‘남다/남겨지다’ 의미를 살려, 폐허가 된 뒤에도 무엇이 ‘남아 있다’는 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: בָּעִיר
  english_pob_choice: in the city
  chosen_korean: 도성에는
  alternatives_korean:
  - 성읍에는
  - 도시에는
  - 그 성읍에는
  lexicon: HALOT
  rationale: עִיר는 기본적으로 ‘도성/성읍’이므로 문맥상 파괴된 도시를 가리키는 표현으로 ‘도성’이 적절합니다.
- source_word: שַׁמָּה
  english_pob_choice: Desolation
  chosen_korean: 황폐함만
  alternatives_korean:
  - 황폐함
  - 황무함
  - 폐허
  lexicon: HALOT
  rationale: 명사로서의 파괴 상태를 살리되, 한국어에서는 주어형으로 두기보다 ‘~만 남아 있다’로 풀어 자연스럽게 재현했습니다.
- source_word: יֻכַּת
  english_pob_choice: is battered / is struck down
  chosen_korean: 무너져 내립니다
  alternatives_korean:
  - 두드려져 내립니다
  - 내리쳐져 무너집니다
  - 쳐서 무너집니다
  lexicon: HALOT
  rationale: Hophal의 수동적 파괴력을 한국어 관용에 맞게 ‘무너져 내리다’로 옮겨, 성문이 외부 충격으로 붕괴되는 이미지를 유지했습니다.
theological_decisions:
- issue: 파괴된 도시의 상태를 주어화할지 여부
  chosen_reading: ‘황폐함만 남아 있고’로 상태를 서술하여, עיר와 שַׁמָּה의 결합이 말하는 도시 전체의 폐허 상태를 드러냈습니다.
  alternative_readings:
  - ‘도성에는 황폐함이 남아 있습니다’
  - ‘도성에는 폐허만 남아 있습니다’
  rationale: 히브리어는 도시 안에 남은 것이 ‘황폐함’임을 압축적으로 말하므로, 이를 직역하되 한국어에서는 상태 서술로 풀어 의미를 분명하게 했습니다.
  doctrine_reference: 예언서의 심판 묘사
- issue: 성문 파괴의 강도 표현
  chosen_reading: ‘무너져 내립니다’로 번역해, יֻכַּת의 수동적이고 폭력적인 붕괴를 과장 없이 전달했습니다.
  alternative_readings:
  - ‘부서집니다’
  - ‘쳐서 무너집니다’
  - ‘무너집니다’
  rationale: 성문이 단순히 손상되는 수준이 아니라 완전히 붕괴되는 심판의 이미지를 반영해야 하므로, 결과를 강조하는 표현을 택했습니다.
  doctrine_reference: 예언적 심판의 가시성
