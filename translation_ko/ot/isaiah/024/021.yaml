id: ISA.24.21
reference: Isaiah 24:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִפְקֹ֧ד יְהוָ֛ה עַל צְבָ֥א הַ/מָּר֖וֹם בַּ/מָּר֑וֹם וְ/עַל מַלְכֵ֥י הָ/אֲדָמָ֖ה עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/021.yaml
  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: ko
  text: 그리고 그날에 야훼께서 높은 곳의 군대에게 높은 곳에서 벌을 내리시고, 땅의 왕들에게 땅에서 벌을 내리실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문이 직설적으로 언약명 יהוה를 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 일반적인 ‘주님’은 피했습니다.
- source_word: צְבָא הַמָּרוֹם / בַּמָּרוֹם
  english_pob_choice: the host of the height / in the height
  chosen_korean: 높은 곳의 군대 / 높은 곳에서
  alternatives_korean:
  - 하늘의 군대 / 하늘에서
  - 높은 곳의 무리 / 높은 곳에
  lexicon: צָבָא
  rationale: 영어 POB가 ‘heaven’으로 일반화하지 않고 ‘the height’ 구조를 유지하므로, מקור의 공간적 반복을 살려 ‘높은 곳’으로 직역했습니다.
- source_word: יִפְקֹד
  english_pob_choice: will punish
  chosen_korean: 벌을 내리시고
  alternatives_korean:
  - 처벌하시고
  - 심판하시고
  - 돌아보시고
  lexicon: פקד
  rationale: 문맥상 ‘돌아보다’보다 재앙적 심판의 뜻이 분명하므로, 한국어에서는 결과를 분명히 드러내는 ‘벌을 내리다’로 옮겼습니다.
- source_word: מַלְכֵי הָאֲדָמָה עַל הָאֲדָמָה
  english_pob_choice: the kings of the earth on the earth
  chosen_korean: 땅의 왕들에게 땅에서
  alternatives_korean:
  - 세상의 왕들에게 세상에서
  - 땅의 왕들 위에 땅에서
  lexicon: אֲדָמָה
  rationale: 히브리어의 반복 대구를 살려 ‘땅’으로 통일해, 왕들의 지상적 범위를 강조했습니다.
theological_decisions:
- issue: ‘host of the height’의 우주적 심판 대상 표현
  chosen_reading: 천상 질서의 세력과 지상의 왕권 모두가 하나님의 심판 아래 있음을 그대로 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘하늘의 군대’로 일반화
  - ‘천상 군대’로 의역
  rationale: 영어 POB가 ‘the height’라는 비전통적 표현을 유지하므로, 이를 평준화하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 सार्व권적 심판
- issue: יִפְקֹד의 심판적 의미
  chosen_reading: 문맥상 재앙과 심판을 포함하는 ‘벌을 내리시다’로 이해했습니다.
  alternative_readings:
  - ‘권고하시다’
  - ‘살피시다’
  rationale: 동사가 본문 전체의 դատ적 맥락에서 심판 행위를 가리키므로, 한국어에서도 그 기능이 분명히 드러나야 합니다.
  doctrine_reference: 심판론
