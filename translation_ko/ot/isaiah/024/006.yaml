source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
  footnotes:
  - marker: a
    text: Or 'an oath has consumed the earth'; the Hebrew word can mean 'oath' or 'curse,' but in this context of violated covenant and resulting judgment, 'curse' best fits.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land' / 'the inhabitants of the land' if taken in a more localized sense; here it is rendered 'earth' because the chapter's scope appears universal.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'men' (collective), that is, human beings; the term emphasizes mortal humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 저주가 땅을 삼켰고, 그 안에 사는 이들이 자기 죄책을 짊어지며, 그러므로 땅의 주민들이 타들어 가고 남는 사람은 얼마 되지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָלָה는 ‘맹세’ 또는 ‘저주’를 뜻할 수 있으나, 여기서는 언약 위반에 대한 심판 문맥이므로 ‘저주’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֶרֶץ는 ‘땅/토지’가 될 수도 있으나, 이 장의 범위가 전반적이므로 ‘땅’으로 옮겼습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 אֱנוֹשׁ는 집합적으로 ‘사람/인간’을 가리키며, 여기서는 남은 인원이 매우 적다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞절의 심판 선언에서 이어지는 결과를 자연스럽게 드러내면서도, 예언서의 논리적 연결을 분명히 살립니다.
- source_word: אָלָה
  english_pob_choice: a curse
  chosen_korean: 저주
  alternatives_korean:
  - 맹세
  - 서약한 저주
  lexicon: HALOT
  rationale: 이 문맥은 언약 위반에 대한 심판을 말하므로, 중립적인 ‘맹세’보다 ‘저주’가 מקור의 징계적 의미를 더 정확히 드러냅니다.
- source_word: אָכְלָה
  english_pob_choice: has devoured
  chosen_korean: 삼켰고
  alternatives_korean:
  - 삼켜 버렸고
  - 먹어 치웠고
  lexicon: HALOT
  rationale: אכל의 ‘먹다/삼키다’라는 생생한 이미지를 살리면서, 한국어에서 심판의 파괴력을 자연스럽게 전달합니다.
- source_word: וַיֶּאְשְׁמוּ
  english_pob_choice: bear their guilt
  chosen_korean: 자기 죄책을 짊어지며
  alternatives_korean:
  - 죄책을 지며
  - 유죄가 되어
  lexicon: HALOT
  rationale: 단순한 ‘유죄 판결’보다, 죄의 책임과 그 결과를 함께 떠안는 뜻을 살리기 위해 ‘죄책을 짊어지다’를 택했습니다.
- source_word: חָרוּ
  english_pob_choice: are scorched
  chosen_korean: 타들어 가고
  alternatives_korean:
  - 그슬리고
  - 그을리고
  lexicon: HALOT
  rationale: 심판으로 인한 열기와 소진의 느낌을 살리되, 시적이면서도 현대 한국어로 읽히는 표현을 택했습니다.
- source_word: אֱנוֹשׁ מִזְעָר
  english_pob_choice: few men are left
  chosen_korean: 남는 사람은 얼마 되지 않습니다
  alternatives_korean:
  - 남은 사람이 아주 적습니다
  - 남는 사람이 적습니다
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 여기서 ‘인간/사람’의 집합적 의미이므로 성별 표지를 과도하게 강조하지 않고, 적은 수만 남는 상황을 간결하게 옮겼습니다.
theological_decisions:
- issue: אָלָה의 의미 범위
  chosen_reading: 언약적·사법적 ‘저주’
  alternative_readings:
  - ‘맹세’
  rationale: 앞뒤 문맥이 법 위반과 심판을 다루므로, 단순한 서술적 ‘맹세’보다 심판의 결과인 ‘저주’가 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: Isaiah 24:5–6 문맥
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’으로 번역하여 심판의 전면성을 유지
  alternative_readings:
  - ‘땅/토지’의 지역적 의미
  rationale: 이 장 전체가 창조 질서에 미치는 광범위한 심판을 그리므로, 한국어에서도 전면적 파괴를 드러내는 ‘땅’이 적절합니다.
  doctrine_reference: Isaiah 24 전체 문맥
