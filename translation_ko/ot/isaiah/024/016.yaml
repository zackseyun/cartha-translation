source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
  footnotes:
  - marker: a
    text: Or “From the wing of the earth” or “From the ends of the earth.”
    reason: lexical_alternative
  - marker: b
    text: Or “Beauty/Honor to the righteous,” taking the phrase collectively rather than as singular “the righteous one.”
    reason: alternative_reading
  - marker: c
    text: Hebrew רָזִי לִי is difficult. Traditionally understood as a cry of wasting away or emaciation; alternatively, some render it “My secret is mine” or “A mystery to me.”
    reason: alternative_reading
translation:
  language: ko
  text: 땅의 끝에서 우리는 노래를 듣습니다. “의로운 이에게 영광이 있기를.” 그러나 내가 말합니다. “나는 쇠약해집니다, 나는 쇠약해집니다. 나에게 화가 있습니다!” 배신자들은 배신합니다. 배신의 배신자들이 배신합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כָּנָף는 문자적으로는 “날개”이지만, 지리적 관용구에서는 “끝/가장자리”를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לַצַּדִּיק는 단수형이지만, 어떤 해석은 이를 집합적으로 이해하여 “의인들에게”로 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 רָזִי לִי는 난해하여, 전통적으로는 ‘쇠약해진다’는 탄식으로 이해하지만 “나의 비밀이다” 또는 “나에게는 신비이다”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  english_pob_choice: From the edge of the earth
  chosen_korean: 땅의 끝에서
  alternatives_korean:
  - 땅의 날개에서
  - 땅의 가장자리에서
  - 땅의 끝부분에서
  lexicon: HALOT
  rationale: כָּנָף의 지리적 용법을 자연스러운 한국어로 옮기되, 공간적 극단이라는 비유를 유지했습니다.
- source_word: זְמִרֹת שָׁמַעְנוּ
  english_pob_choice: we hear songs
  chosen_korean: 우리는 노래를 듣습니다
  alternatives_korean:
  - 우리는 찬양의 노래를 듣습니다
  - 우리는 노래들을 듣습니다
  - 우리는 노랫가락을 듣습니다
  lexicon: HALOT
  rationale: זְמִרֹת는 직접적으로 ‘노래들/노래’를 뜻하므로, 해석을 덧붙이지 않고 간결하게 살렸습니다.
- source_word: צְבִי לַצַּדִּיק
  english_pob_choice: Glory to the righteous one
  chosen_korean: 의로운 이에게 영광이 있기를
  alternatives_korean:
  - 의로운 이에게 영광
  - 의인에게 영광이 있기를
  - 의로운 자에게 아름다움이 있기를
  lexicon: HALOT
  rationale: צְבִי의 찬양적 힘을 ‘영광’으로 옮기고, לַצַּדִּיק의 단수를 살리면서도 한국어에서 자연스럽게 들리도록 소망형 표현을 사용했습니다.
- source_word: רָזִי לִי רָזִי לִי
  english_pob_choice: I waste away, I waste away
  chosen_korean: 나는 쇠약해집니다, 나는 쇠약해집니다
  alternatives_korean:
  - 나는 여위어 갑니다, 나는 여위어 갑니다
  - 나는 무너집니다, 나는 무너집니다
  - 나의 비밀은 나의 비밀입니다
  lexicon: HALOT
  rationale: 문맥상 탄식과 소진의 뜻이 강하므로, 전통적 ‘여위다’의 의미를 살리면서 현대 한국어에서 자연스러운 ‘쇠약해집니다’를 택했습니다.
- source_word: בֹּגְדִים בָּגָדוּ / וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  english_pob_choice: The treacherous deal treacherously; with treachery the treacherous deal treacherously
  chosen_korean: 배신자들은 배신합니다. 배신의 배신자들이 배신합니다.
  alternatives_korean:
  - 불성실한 자들은 불성실하게 행합니다
  - 간사한 자들은 간사하게 행합니다
  - 신의 없는 자들은 신의 없이 행합니다
  lexicon: HALOT
  rationale: בגד의 반복과 강조를 한국어에서도 최대한 드러내기 위해 같은 어근을 반복했습니다. ‘배신’은 관계적·언약적 불성실을 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: לַצַּדִּיק의 단수성과 집합적 가능성
  chosen_reading: ‘의로운 이’로 단수 느낌을 유지하되, 한국어 본문은 집합적 해석을 강제하지 않도록 했습니다.
  alternative_readings:
  - 의인들
  - 의로운 자들
  - 의인
  rationale: 히브리어는 단수형이며, 본문은 그 대상을 특정하지 않으므로 단수형을 보존하되 해석을 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: רָזִי לִי의 난해성
  chosen_reading: ‘쇠약해집니다’로 번역하고, 비밀/신비 읽기는 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 나의 비밀입니다
  - 나에게는 신비입니다
  - 나는 무너집니다
  rationale: 문맥의 탄식, 멸망, 허약함이 가장 강하므로 전통적 ‘쇠약/여위어짐’ 계열을 채택했습니다. 다른 독법은 주석 차원에 남겨 두는 것이 원문 긴장을 보존합니다.
  doctrine_reference: Preserve textual ambiguity where the Hebrew is difficult.
