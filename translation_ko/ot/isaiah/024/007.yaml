id: ISA.24.7
reference: Isaiah 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבַ֥ל תִּיר֖וֹשׁ אֻמְלְלָה גָ֑פֶן נֶאֶנְח֖וּ כָּל שִׂמְחֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/007.yaml
  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
  footnotes:
  - marker: a
    text: Or 'all those glad of heart groan.' The Hebrew phrase is literally 'all the joyful of heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 새 포도주가 애도하고, 포도나무가 시들며, 마음에 기쁨이 있는 모든 이가 신음합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음에 기쁜 모든 이들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל / תִּירוֹשׁ
  english_pob_choice: The new wine mourns
  chosen_korean: 새 포도주가 애도합니다
  alternatives_korean:
  - 새 포도주가 슬퍼합니다
  - 새 포도주가 통곡합니다
  - 새 포도주가 마릅니다
  lexicon: HALOT
  rationale: אָבַל은 애도하다/슬퍼하다의 뜻이어서, 단순한 물리적 건조보다 의인화된 비탄을 살리는 ‘애도하다’를 택했습니다. תִּירוֹשׁ는 ‘새 포도주’로 옮겨 어휘 구분을 유지했습니다.
- source_word: אֻמְלְלָה גָּפֶן
  english_pob_choice: the vine withers
  chosen_korean: 포도나무가 시듭니다
  alternatives_korean:
  - 포도나무가 쇠약해집니다
  - 포도나무가 마릅니다
  - 포도나무가 시들어갑니다
  lexicon: HALOT
  rationale: אֻמְלְלָה는 쇠잔해짐, 시듦의 뜻이므로 농경 이미지에 자연스러운 ‘시들다’를 사용했습니다. גָּפֶן은 문맥상 포도나무로 구체화했습니다.
- source_word: נֶאֶנְחוּ
  english_pob_choice: groan
  chosen_korean: 신음합니다
  alternatives_korean:
  - 탄식합니다
  - 한숨 쉽니다
  - 울부짖습니다
  lexicon: HALOT
  rationale: 네안후는 고통과 슬픔의 소리를 나타내므로, ‘신음하다’가 시의 절망적 분위기를 가장 직접적으로 드러냅니다.
- source_word: שִׂמְחֵי לֵב
  english_pob_choice: all the glad of heart
  chosen_korean: 마음에 기쁨이 있는 모든 이
  alternatives_korean:
  - 마음이 기쁜 모든 이
  - 마음이 즐거운 모든 이
  - 마음에 즐거움이 있는 모든 이
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 즐거운 자들’이지만, 한국어에서는 소유격보다 관계절형이 더 자연스럽습니다. POB의 ‘glad of heart’ 취지를 살려 내면의 상태를 분명히 했습니다.
