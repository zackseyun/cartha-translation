id: ISA.24.5
reference: Isaiah 24:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
  footnotes:
  - marker: a
    text: Or 'changed a statute.' The Hebrew verb may carry the sense of altering or overstepping an established ordinance.
    reason: lexical_alternative
  - marker: b
    text: '''The everlasting covenant'' is not identified explicitly here; interpreters variously connect it to the Noahic covenant or to God''s enduring moral order for humanity.'
    reason: alternative_reading
translation:
  language: ko
  text: 땅은 그 주민들 때문에 더럽혀졌습니다. 그들이 법들을 범하고, 한 규례를 어기며[a], 영원한 언약을 깨뜨렸기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘규례를 바꾸었다.’ 히브리어 동사는 확립된 규정을 변경하거나 넘어서는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원한 언약’이 무엇을 가리키는지는 여기서 명시되지 않습니다. 해석자들은 이를 노아 언약이나 인류를 위한 하나님의 지속적인 도덕 질서와 연결하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ
  english_pob_choice: The earth is defiled under its inhabitants
  chosen_korean: 땅은 그 주민들 아래에서 더러워졌습니다
  alternatives_korean:
  - 땅은 그 주민들 때문에 더러워졌습니다
  - 땅은 그 주민들 아래 더럽혀졌습니다
  - 땅은 그 주민들 아래에서 부정해졌습니다
  lexicon: HALOT
  rationale: חָנְפָה의 결과 상태를 한국어로 자연스럽게 살리면서, תַּחַת의 ‘아래/아래에서’ 이미지를 유지했습니다. ‘더러워졌습니다’는 도덕적·종교적 오염을 무리 없이 드러냅니다.
- source_word: עָבְרוּ תוֹרֹת
  english_pob_choice: they have transgressed laws
  chosen_korean: 그들이 율법들을 범하고
  alternatives_korean:
  - 그들이 법들을 어기고
  - 그들이 규범들을 위반하고
  - 그들이 가르침들을 저버리고
  lexicon: HALOT
  rationale: 복수 תוֹרֹת는 일반적 규범보다 ‘율법들’이 더 직접적입니다. ‘범하다’는 법·율례를 어기는 성격을 잘 드러냅니다.
- source_word: חָלְפוּ חֹק
  english_pob_choice: violated a statute
  chosen_korean: 한 규례를 어기고
  alternatives_korean:
  - 한 규례를 위반하고
  - 하나의 규정을 바꾸고
  - 한 법도를 넘어뜨리고
  lexicon: HALOT
  rationale: חָלְפוּ는 ‘바꾸다/넘어가다’의 뉘앙스를 가질 수 있지만, 문맥상 앞의 ‘율법들을 범하다’와 병렬되는 위반을 나타내므로 ‘어기고’로 옮겼습니다. ‘한 규례’는 단수의 일반적 법규를 살립니다.
- source_word: בְּרִ֥ית עוֹלָֽם
  english_pob_choice: the everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 그 영원한 언약
  - 영속하는 언약
  - 영원한 계약
  lexicon: HALOT
  rationale: 본문은 특정 언약을 명시하지 않으므로, 한국어도 해석을 덧씌우지 않고 ‘영원한 언약’으로 보존했습니다. ‘언약’은 성경적 계약 관계를 유지하는 가장 적절한 대응입니다.
theological_decisions:
- issue: ‘영원한 언약’의 특정 언약 동일시 여부
  chosen_reading: 본문에서는 특정 언약을 지정하지 않고 ‘영원한 언약’으로 그대로 둡니다.
  alternative_readings:
  - 노아 언약
  - 창조 질서에 대한 하나님의 지속적 언약적 질서
  - 하나님과 인류 사이의 일반적 영원한 언약
  rationale: 히브리어 표현은 신학적으로 무게가 크지만, 본문 자체가 어느 언약인지 밝히지 않습니다. 번역에서 특정 동일시를 확정하지 않아 본문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 분명히 말하지 않는 신학적 동일시는 번역문에 주입하지 않는다.'
