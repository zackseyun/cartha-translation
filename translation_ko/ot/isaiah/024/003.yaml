translation:
  language: ko
  text: 온 땅이[a] 완전히 텅 비고 완전히 약탈당할 것입니다. 이는 야훼께서 이 말씀을 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘지구’를 뜻할 수 있습니다. 이사야 24장의 넓은 문맥은 전 세계적 의미를 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  english_pob_choice: will be utterly emptied
  chosen_korean: 완전히 텅 비고
  alternatives_korean:
  - 완전히 비워지고
  - 철저히 텅 비고
  lexicon: HALOT
  rationale: 반복 강조 구조를 살려 결과를 분명하게 드러내되, 한국어에서 자연스러운 수동적 상태 표현인 ‘텅 비다’를 사용했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 땅이
  - 그 온 땅
  lexicon: HALOT
  rationale: 이사야 24장의 문맥은 우주적 범위이지만, 한국어에서는 ‘earth’를 과도하게 철학화하지 않고 문맥상 포괄적인 ‘그 땅’으로 옮겨 본문의 광범위를 유지했습니다.
- source_word: וְהִבּוֹז תִּבּוֹז
  english_pob_choice: and utterly plundered
  chosen_korean: 완전히 약탈될
  alternatives_korean:
  - 완전히 노략질당할
  - 철저히 빼앗길
  lexicon: HALOT
  rationale: בזז의 핵심 의미는 약탈이므로 ‘약탈되다’로 옮겨 피동·결과 상태를 살렸고, 앞 구절과 대응되도록 ‘완전히’로 강조를 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유한 신명 יְהוָה를 표제어로 보존하기 위해 전통적 대치어가 아니라 ‘야훼’를 사용했습니다.
theological_decisions:
