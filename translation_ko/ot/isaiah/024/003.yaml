id: ISA.24.3
reference: Isaiah 24:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
  footnotes:
  - marker: a
    text: Or 'The land will be utterly emptied and utterly plundered.' Hebrew אֶרֶץ can mean 'land' or 'earth'; the broader context here favors the global sense 'earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅이 완전히 텅 비고 완전히 약탈될 것입니다[a]. 이는 야훼께서 이 말씀을 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅이 완전히 텅 비고 완전히 약탈될 것입니다.’ 히브리어 אֶרֶץ는 ‘땅’이나 ‘지구/세상’ 모두를 뜻할 수 있으며, 이 문맥은 전 지구적 의미를 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  english_pob_choice: will be utterly emptied
  chosen_korean: 완전히 텅 비고
  alternatives_korean:
  - 완전히 비워지고
  - 철저히 텅 비고
  lexicon: HALOT
  rationale: 반복 강조 구조를 살려 결과를 분명하게 드러내되, 한국어에서 자연스러운 수동적 상태 표현인 ‘텅 비다’를 사용했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 땅이
  - 그 온 땅
  lexicon: HALOT
  rationale: 이사야 24장의 문맥은 우주적 범위이지만, 한국어에서는 ‘earth’를 과도하게 철학화하지 않고 문맥상 포괄적인 ‘그 땅’으로 옮겨 본문의 광범위를 유지했습니다.
- source_word: וְהִבּוֹז תִּבּוֹז
  english_pob_choice: and utterly plundered
  chosen_korean: 완전히 약탈될
  alternatives_korean:
  - 완전히 노략질당할
  - 철저히 빼앗길
  lexicon: HALOT
  rationale: בזז의 핵심 의미는 약탈이므로 ‘약탈되다’로 옮겨 피동·결과 상태를 살렸고, 앞 구절과 대응되도록 ‘완전히’로 강조를 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유한 신명 יְהוָה를 표제어로 보존하기 위해 전통적 대치어가 아니라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명을 사용하므로, 하나님의 이름을 호칭이나 칭호로 바꾸지 않고 음역하여 본문의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
