  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
  footnotes:
  - marker: a
    text: Or 'The land will be utterly emptied and utterly plundered.' Hebrew אֶרֶץ can mean 'land' or 'earth'; the broader context here favors the global sense 'earth.'
