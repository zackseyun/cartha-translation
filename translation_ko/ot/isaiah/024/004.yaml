id: ISA.24.4
reference: Isaiah 24:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
  footnotes:
  - marker: a
    text: Or 'the nobles of the earth waste away.' The Hebrew literally speaks of the 'height' or 'exaltation' of the people of the earth.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅이 애도하며 시들고, 세상이 쇠잔하여 시들며, 땅의 높임을 받은 백성들이 쇠잔합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 귀족들이 쇠잔합니다.’ 히브리어는 문자적으로 ‘땅의 백성의 높음/높임’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבְלָ֤ה
  english_pob_choice: mourns
  chosen_korean: 애도하며
  alternatives_korean:
  - 슬퍼하며
  - 애통하며
  - 가슴 아파하며
  lexicon: HALOT
  rationale: אבל의 ‘슬퍼하다/애도하다’라는 정서적 의미를 살려, 단순한 물리적 건조보다 심판 아래서의 탄식 이미지를 드러내기 위해 ‘애도하며’로 옮겼습니다.
- source_word: נָבְלָה
  english_pob_choice: withers
  chosen_korean: 시들고
  alternatives_korean:
  - 쇠하고
  - 마르고
  - 시들어
  lexicon: HALOT
  rationale: נבל의 ‘시들다/쇠퇴하다’ 이미지를 살려 반복되는 동사를 한국어에서도 자연스럽게 유지하기 위해 ‘시들고’로 렌더링했습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 거주하는 세계
  - 온 세상
  lexicon: HALOT
  rationale: תבל의 ‘거주 세계/세상’ 의미를 반영하되, 시적 병행 속에서 ‘땅’과 짝을 이루는 보다 자연스러운 현대 한국어로 ‘세상’을 선택했습니다.
- source_word: מְרוֹם עַם הָאָרֶץ
  english_pob_choice: the exalted people of the earth
  chosen_korean: 땅의 높임을 받은 백성들
  alternatives_korean:
  - 땅의 고귀한 사람들
  - 땅의 높은 자들
  - 땅의 귀족들
  lexicon: HALOT
  rationale: מְרוֹם의 문자적 뜻인 ‘높음/높임’을 살리면서도, 영어 POB가 주석으로 제시한 ‘nobles’의 해석을 본문으로 확정하지 않기 위해 ‘높임을 받은 백성들’로 옮겼습니다.
theological_decisions:
- issue: אָבְלָה와 נָבְלָה의 중첩된 심판 이미지
  chosen_reading: ‘애도하며’와 ‘시들고’의 병렬로 정서적 탄식과 생명력의 쇠퇴를 함께 보이게 했습니다.
  alternative_readings:
  - 둘 다 단순히 ‘쇠퇴하다’로 평준화
  - 둘 다 감정어로만 처리
  rationale: 히브리어는 감정적 애도와 식물적 쇠잔을 함께 겹쳐 말하므로, 한국어에서도 두 층위를 구분해 드러내는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 시적 심판 언어의 중첩 보존
