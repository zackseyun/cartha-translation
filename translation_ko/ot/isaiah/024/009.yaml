  yaml_path: translation/ot/isaiah/024/009.yaml
  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
  footnotes:
  - marker: a
    text: Or 'They will not drink wine with singing.' The Hebrew imperfect may be understood futurally, and בַּשִּׁיר may also be rendered 'in song' or 'while singing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 노래와 함께[a] 포도주를 마시지 않습니다. 독주는 그것을 마시는 이들에게 쓰게 느껴집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 노래하면서 포도주를 마시지 않을 것입니다.’ 히브리어 미완료형은 미래적으로도 이해할 수 있으며, בַּשִּׁיר은 ‘노래 속에서’ 또는 ‘노래하면서’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּשִּׁיר
  english_pob_choice: with a song
  chosen_korean: 노래[가] 있는 가운데
  alternatives_korean:
  - 노래와 함께
  - 노래 속에서
  - 노래하면서
  lexicon: HALOT
  rationale: ב + שִׁיר은 동반 또는 방식의 의미를 가지므로, 잔치의 소리가 사라진 대비를 살려 ‘노래가 있는 가운데’로 옮겼습니다.
- source_word: לֹא יִשְׁתּוּ
  english_pob_choice: they do not drink
  chosen_korean: 마시지 못합니다
  alternatives_korean:
  - 마시지 않습니다
  - 마시지 않을 것입니다
  lexicon: HALOT
  rationale: 예언적 시에서 현재형이 폐허의 상태를 생생하게 드러내므로, 단순 현재로 두되 한국어에서는 자연스럽게 ‘-지 못합니다’로 처리했습니다.
- source_word: שֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 술
  - 강한 술
  - 포도주 아닌 독주
  lexicon: HALOT
  rationale: יַיִן과 구별되는 취하게 하는 음료라는 대비를 살리기 위해 ‘독주’를 선택했습니다.
- source_word: לְשֹׁתָיו
  english_pob_choice: to those who drink it
  chosen_korean: 그것을 마시는 자들에게
  alternatives_korean:
  - 그것을 마시는 이들에게
  - 그 술을 마시는 자들에게
  lexicon: HALOT
  rationale: ‘drinkers’의 대상을 한국어에서 분명히 드러내기 위해 목적어를 보충했습니다.
theological_decisions:
- issue: 예언적 현재의 처리
  chosen_reading: 현장감 있는 현재 묘사로 옮겨, 잔치가 끊긴 황폐한 상태를 독자가 즉시 느끼게 했습니다.
  alternative_readings:
  - 미래적 경고로 ‘마시지 않을 것입니다’라고 옮길 수 있습니다.
  - 일반 진술로 ‘마시지 않습니다’라고 옮길 수 있습니다.
  rationale: 히브리어 미완료형은 미래/현재 모두 가능하나, 본문은 황폐한 현실을 묘사하는 예언 시의 효과가 강합니다.
  doctrine_reference: 예언 시의 시제-상 처리
