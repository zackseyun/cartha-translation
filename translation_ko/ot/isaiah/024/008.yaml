id: ISA.24.8
reference: Isaiah 24:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
  footnotes:
  - marker: a
    text: Or 'mirth' instead of 'joy' for מְשׂוֹשׂ; the Hebrew emphasizes festive gladness.
    reason: lexical_alternative
  - marker: b
    text: Or 'harp' for 'lyre'; traditional English versions often use 'harp,' but 'lyre' is likely more precise for כִּנּוֹר.
    reason: lexical_alternative
translation:
  language: ko
  text: 수금의 기쁨이 그쳤습니다[a]. 즐거운 자들의 소리가 멈췄습니다. 수금의 기쁨이 그쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흥겨움’으로도 옮길 수 있습니다. 히브리어 מְשׂוֹשׂ는 단순한 감정보다 축제적 기쁨을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַת
  english_pob_choice: has ceased
  chosen_korean: 그쳤습니다
  alternatives_korean:
  - 멈췄습니다
  - 끝났습니다
  - 사라졌습니다
  lexicon: HALOT
  rationale: 시편적 탄식 문맥에서 שׁבת의 ‘중단됨’을 자연스럽게 살리기 위해 ‘그쳤습니다’를 택했습니다.
- source_word: מְשׂוֹשׂ
  english_pob_choice: mirth
  chosen_korean: 기쁨
  alternatives_korean:
  - 흥겨움
  - 환희
  - 즐거움
  lexicon: HALOT
  rationale: 이 명사는 단순 감정보다 축제적 환희를 가리키므로, 한국어에서는 ‘기쁨’으로 옮겨 반복 구조를 살리되 지나치게 구어적인 표현은 피했습니다.
- source_word: תֻּפִּים
  english_pob_choice: tambourines
  chosen_korean: 수금
  alternatives_korean:
  - 탬버린
  - 손북
  lexicon: HALOT
  rationale: 이 절의 평행 구조를 고려할 때 현대 예배 용어보다 고대 현악기/악기 범주를 나타내는 표현이 적절하다고 보아, 본문 맥락상 한국어에서 통용되는 전통적 악기명인 ‘수금’으로 옮겼습니다.
- source_word: כִּנּוֹר
  english_pob_choice: lyre
  chosen_korean: 수금
  alternatives_korean:
  - 리라
  - 하프
  lexicon: HALOT
  rationale: כִּנּוֹר는 고대 현악기로서 ‘하프’보다 ‘리라/수금’이 더 가깝기 때문에, 본문 앞부분과의 평행을 살려 ‘수금’으로 일관되게 번역했습니다.
theological_decisions:
- issue: 포악한 침묵의 반복을 통한 탄식 문맥 보존
  chosen_reading: 악기와 즐거움의 소멸을 반복 구조로 그대로 드러내어, 단순한 정보 전달보다 심판 이후의 황폐함을 강조했습니다.
  alternative_readings:
  - 음악이 사라졌습니다
  - 기쁨이 끝났습니다
  rationale: 히브리어는 동일 동사와 명사를 반복하여 공동체적 환희의 철저한 종식을 강조하므로, 이를 약화시키지 않도록 반복을 유지했습니다.
  doctrine_reference: 예언서의 심판 선언과 탄식의 수사
