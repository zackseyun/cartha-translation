    rationale: 이 전치사구는 시적 문맥에서 위엄을 두고/위엄에 대하여 환호하는 관계로도 읽힙니다. ‘위엄을 두고’는 한국어에서 자연스러우며 그 관계를 지나치게 좁히지 않습니다.
