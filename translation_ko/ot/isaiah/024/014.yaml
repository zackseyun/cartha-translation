id: ISA.24.14
reference: Isaiah 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֛מָּה יִשְׂא֥וּ קוֹלָ֖/ם יָרֹ֑נּוּ בִּ/גְא֣וֹן יְהוָ֔ה צָהֲל֖וּ מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
  footnotes:
  - marker: a
    text: Or 'from the west' or 'from the coastlands'; Hebrew 'from the sea' can carry a geographic sense in prophetic poetry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 소리를 높여 외치며 기뻐 소리칩니다. 야훼의 위엄 때문에, 바다에서 크게 외칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘바다에서’는 예언시에서 ‘서쪽에서’ 또는 ‘해안 지방에서’라는 지리적 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: They
  chosen_korean: 그들은
  alternatives_korean:
  - 그들 자신은
  - 저들은
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 자연스러운 주어 ‘그들은’으로 옮기고, 불필요한 강조어는 덧붙이지 않았습니다.
- source_word: יִשְׂאוּ קוֹלָם
  english_pob_choice: lift up their voice
  chosen_korean: 소리를 높여 외치며
  alternatives_korean:
  - 목소리를 높이며
  - 목소리를 들어 외치며
  lexicon: HALOT
  rationale: ‘목소리/음성’을 직역하기보다 히브리어 관용구의 의미인 ‘크게 외치다’를 살려 자연스러운 합쇼체 문장으로 옮겼습니다.
- source_word: בִּגְאוֹן יְהוָה
  english_pob_choice: At the majesty of Yahweh
  chosen_korean: 야훼의 위엄 때문에
  alternatives_korean:
  - 야훼의 위엄에서
  - 야훼의 위엄 앞에서
  lexicon: HALOT
  rationale: גאון은 ‘위엄, 높으심’을 뜻하므로 ‘위엄’으로 옮겼고, 전치사 ב는 문맥상 찬양의 원인을 드러내는 의미로 이해되는 점을 한국어에서는 ‘때문에’로 자연스럽게 표현했습니다.
- source_word: צָהֲלוּ
  english_pob_choice: cry aloud
  chosen_korean: 크게 외칩니다
  alternatives_korean:
  - 환호합니다
  - 높은 소리로 외칩니다
  lexicon: HALOT
  rationale: 반복되는 기쁨의 외침을 나타내므로 ‘크게 외칩니다’로 옮겨 앞 구절의 ‘외치며’와 구별되는 울림을 살렸습니다.
- source_word: מִיָּם
  english_pob_choice: from the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 서쪽에서
  - 해안 지방에서
  lexicon: HALOT
  rationale: 기본 어휘값인 ‘바다’를 본문에 유지하고, 지리적 확장 가능성은 필요 시 주석으로 처리하는 편이 원문에 더 가깝습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, POB 원칙에 따라 호칭 대체어 ‘주’ 대신 고유 이름 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בִּגְאוֹן의 관계 의미
  chosen_reading: ‘위엄 때문에’로 원인 관계를 드러냄
  alternative_readings:
  - ‘위엄 앞에서’
  - ‘위엄 안에서’
  rationale: 개정 기록의 검토를 반영해 전치사 ב를 단순한 위치 표현으로 과도하게 좁히지 않고, 찬양의 촉발 원인을 드러내는 문맥적 의미를 본문에 반영했습니다.
  doctrine_reference: 히브리어 전치사 ב의 시적 용례
