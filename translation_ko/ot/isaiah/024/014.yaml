  naturalness: 현행 문장은 이해하기 쉽지만 ‘외치며 기뻐 소리칩니다’가 의미와 어휘 면에서 반복됩니다. ‘목소리를 높여 기뻐 외칩니다’ 및 ‘환호합니다’는 현대 표준어 합쇼체로 자연스럽고, 두 동사의 진행을 구별합니다.
  terminology: ‘야훼’와 ‘위엄’은 적절합니다. מִיָּם의 기본 뜻 ‘바다에서’를 본문에 유지하고, 지리적 가능성은 각주로 처리하는 것도 적절합니다.
