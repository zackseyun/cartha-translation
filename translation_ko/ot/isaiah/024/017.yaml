lexical_decisions:
- source_word: פַּחַד
  english_pob_choice: Terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 경외
  lexicon: HALOT
  rationale: 이 절의 삼중 심판 공식에서는 단순한 감정 상태보다 덮쳐 오는 재앙적 두려움을 가리키므로, ‘공포’가 ‘두려움’보다 더 강하게 전달합니다.
- source_word: פַחַת
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 함정 구덩이
  - 구덩이
  lexicon: HALOT
  rationale: 문맥상 짐승을 잡는 함정의 구덩이를 가리키지만, 한국어에서는 짧고 직설적인 ‘구덩이’가 시적 병렬을 살리면서도 충분히 자연스럽습니다.
- source_word: פָח
  english_pob_choice: the snare
  chosen_korean: 올가미
  alternatives_korean:
  - 덫
  - 함정
  lexicon: HALOT
  rationale: ‘올가미’는 앞의 ‘구덩이’와 구별되면서도 포획 장치라는 뜻을 분명히 드러내어, 히브리어의 삼중 표현을 잘 보존합니다.
- source_word: יוֹשֵׁב הָאָרֶץ
  english_pob_choice: inhabitant of the earth
  chosen_korean: 땅에 사는 자
  alternatives_korean:
  - 땅의 주민
  - 땅에 거하는 자
  lexicon: HALOT
  rationale: 히브리어 분사구는 단순한 호칭이므로, ‘땅에 사는 자’가 직설적이고도 현대 한국어에서 호격으로 자연스럽습니다.
theological_decisions:
- issue: ָאָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
