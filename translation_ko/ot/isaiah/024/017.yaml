  - 세상
  rationale: 이 절에서의 אֶרֶץ는 이사야 24장의 우주적 심판 맥락을 고려할 때 특정 지역보다 넓은 범위를 가리키지만, 한국어 ‘땅’은 그 व्यापक성을 유지하면서도 과도하게 추상화하지 않습니다.
  doctrine_reference: Isaiah 24 전체의 세계적 심판 선언
