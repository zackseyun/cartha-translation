id: ISA.24.10
reference: Isaiah 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבְּרָ֖ה קִרְיַת תֹּ֑הוּ סֻגַּ֥ר כָּל בַּ֖יִת מִ/בּֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/010.yaml
  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
  footnotes:
  - marker: a
    text: Or 'The city of emptiness/desolation is broken down.' The Hebrew תֹּהוּ can denote chaos, emptiness, or desolation.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'every house is shut up from entering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 혼돈의 성은 무너졌고[a], 모든 집은 들어가지 못하도록 닫혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תֹּהוּ는 ‘혼돈’ 외에도 ‘공허’, ‘황폐’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 집이 들어감으로부터 닫혔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  english_pob_choice: is broken down
  chosen_korean: 무너졌습니다
  alternatives_korean:
  - 깨졌습니다
  - 산산이 부서졌습니다
  lexicon: HALOT
  rationale: 도시의 붕괴를 자연스럽게 드러내는 동사로, POB의 'broken down'이 가진 폐허화의 느낌을 살립니다.
- source_word: קִרְיַת
  english_pob_choice: city of
  chosen_korean: 성
  alternatives_korean:
  - 도시
  - 읍
  lexicon: HALOT
  rationale: 문맥상 성읍의 붕괴를 시적으로 압축하는 표현으로, 단순한 행정 단위보다 예언서의 이미지에 더 잘 맞습니다.
- source_word: תֹּהוּ
  english_pob_choice: chaos
  chosen_korean: 혼돈
  alternatives_korean:
  - 공허
  - 황무지
  - 황폐
  lexicon: HALOT
  rationale: תֹּהוּ의 공허/혼돈/황폐 범위를 보존하면서도, 여기서는 도시의 질서 붕괴를 강조하는 POB의 'chaos'에 가장 가깝게 옮겼습니다.
- source_word: מִבּוֹא
  english_pob_choice: so that none may enter
  chosen_korean: 들어가지 못하도록
  alternatives_korean:
  - 들어오지 못하게
  - 들어갈 수 없게
  lexicon: HALOT
  rationale: 직역의 '들어감으로부터'보다, 집들이 봉쇄되어 출입이 막힌 상태라는 결과를 한국어에서 분명히 드러냅니다.
theological_decisions:
- issue: 폐허가 된 도시와 봉쇄된 집들의 병렬 이미지
  chosen_reading: 도시의 붕괴와 주거 공간의 완전한 폐쇄를 함께 드러내는 예언적 심판 묘사로 읽었습니다.
  alternative_readings:
  - 단순한 물리적 파괴 묘사로만 읽기
  - 사회적 붕괴의 은유로만 읽기
  rationale: 히브리어 본문은 도시 전체의 파괴와 각 집의 봉쇄를 병렬로 배치해, 공동체 질서의 붕괴를 강하게 보여 줍니다.
  doctrine_reference: 예언서의 심판 선언과 공동체 붕괴 이미지
