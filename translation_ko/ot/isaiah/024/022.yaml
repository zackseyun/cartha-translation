id: ISA.24.22
reference: Isaiah 24:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֻסְּפ֨וּ אֲסֵפָ֤ה אַסִּיר֙ עַל בּ֔וֹר וְ/סֻגְּר֖וּ עַל מַסְגֵּ֑ר וּ/מֵ/רֹ֥ב יָמִ֖ים יִפָּקֵֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
  footnotes:
  - marker: a
    text: Or, 'they will be visited.' The Hebrew verb can denote being attended to or called to account; in this context of judgment, the sense 'punished' is most likely.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 죄수들처럼 구덩이로 함께 모여들고, 감옥에 갇히며, 많은 날이 지난 뒤에는 벌을 받게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방문을 받게 될 것입니다.’ 히브리어 동사는 돌보거나 불러서 책임을 묻는 뜻을 가질 수 있으나, 이 문맥에서는 심판의 의미가 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  english_pob_choice: they will be gathered together
  chosen_korean: 함께 모여들고
  alternatives_korean:
  - 함께 모이고
  - 모여서
  lexicon: HALOT
  rationale: אסף의 수동적 집합 의미와 cognate 강조를 살려, 단순한 ‘모이다’보다 ‘함께 모여들다’로 집합의 힘을 자연스럽게 드러냈습니다.
- source_word: אַסִּיר עַל־בּוֹר
  english_pob_choice: like prisoners into a pit
  chosen_korean: 죄수들처럼 구덩이로
  alternatives_korean:
  - 죄수들로서 구덩이 안에
  - 죄수들처럼 구덩이 안으로
  lexicon: HALOT
  rationale: 비교 표지와 이동/수용의 방향성을 살려 ‘~처럼 …로’ 구조를 택했고, בור는 감금 이미지가 분명한 ‘구덩이’로 옮겼습니다.
- source_word: וְסֻגְּרוּ עַל מַסְגֵּר
  english_pob_choice: they will be shut up in a prison
  chosen_korean: 감옥에 갇히며
  alternatives_korean:
  - 감옥에 가두어지며
  - 감옥 안에 봉쇄되며
  lexicon: HALOT
  rationale: סגר의 피동 의미를 한국어의 관용적 표현인 ‘갇히다’로 옮겨, 감금의 지속 상태를 간결하게 표현했습니다.
- source_word: וּמֵרֹב יָמִים יִפָּקֵדוּ
  english_pob_choice: after many days they will be punished
  chosen_korean: 많은 날이 지난 뒤에는 벌을 받게 될 것입니다
  alternatives_korean:
  - 오랜 뒤에 방문을 받게 될 것입니다
  - 많은 날 후에 징계를 받게 될 것입니다
  lexicon: HALOT
  rationale: פקד의 의미 범위 가운데 이 문맥에서의 징벌적 ‘방문’을 한국어로는 ‘벌을 받다’가 가장 자연스럽게 드러내므로, 해석을 과도하게 중화하지 않고 반영했습니다.
theological_decisions:
- issue: יִפָּקֵדוּ의 의미를 ‘방문’으로 둘지 ‘벌’로 둘지
  chosen_reading: ‘벌을 받게 될 것입니다’로 번역했습니다.
  alternative_readings:
  - ‘방문을 받게 될 것입니다’
  - ‘돌봄을 받게 될 것입니다’
  rationale: 이 절은 심판 신탁의 흐름 속에 있으며, 감금 이미지 뒤에 이어지는 동사는 긍정적 돌봄보다 심판적 처분을 가리키는 것이 문맥상 가장 강합니다. 다만 한국어 본문에서는 의미를 지나치게 기술적으로 좁히지 않고 결과를 드러내는 표현을 택했습니다.
  doctrine_reference: 문맥 우선 원칙; 애매한 동사는 주해를 통해 설명하되 본문에서는 심판의 힘을 보존합니다.
