  source_fidelity: ‘함께 모여들고’는 히브리어 수동형 וְאֻסְּפוּ의 피동성을 충분히 드러내지 못합니다. ‘함께 모아지고’로 고쳐 대상들이 강제로 집결되는 뜻을 보존하는 것이 좋습니다. ‘벌을 받게 될 것입니다’는 이 심판 문맥에서 가능한 주본문 번역이며, פקד의 더 넓은 의미는 각주로 남겨야 합니다.
  naturalness: 본문의 문장 연결과 합쇼체 종결은 자연스럽습니다. 다만 ‘방문을 받게 될 것입니다’는 현대 한국어에서 손님의 방문을 받는 뜻으로 우선 이해되어 히브리어의 폭넓은 의미를 전달하기에 부자연스럽습니다.
  terminology: ‘구덩이’, ‘감옥’, ‘벌을 받다’는 감금과 심판의 문맥에 적절합니다. ‘죄수들처럼’은 집합적으로 쓰인 אַסִּיר를 자연스럽게 반영합니다.
