id: ISA.24.20
reference: Isaiah 24:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
  footnotes:
  - marker: a
    text: Or 'like a watchman's hut' or 'like a temporary shelter'; the Hebrew term refers to a flimsy temporary lodging.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅은 술취한 자처럼 비틀거리고, 오두막처럼 이리저리 흔들리며, 그 위에는 그 허물의 짐이 무겁게 지워져 있어서, 무너지고 다시는 일어나지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파수꾼의 오두막’이나 ‘임시 거처’입니다. 히브리어는 허술한 임시 숙소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 온 땅
  - 세상
  - 대지
  lexicon: HALOT
  rationale: 이사야 24장의 우주적 심판 맥락은 영어 POB의 'the earth'와 같지만, 한국어에서는 '땅'이 가장 자연스럽고 범위도 과도하게 좁히지 않습니다.
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  english_pob_choice: will stagger, staggering
  chosen_korean: 비틀거리고
  alternatives_korean:
  - 비틀비틀하며
  - 휘청이며
  - 흔들리고
  lexicon: HALOT
  rationale: 강조 반복을 한국어에서는 같은 어근의 중복보다 서술형 병렬로 살렸습니다. '비틀거리다'가 술취한 자의 불안정한 움직임을 가장 직접적으로 드러냅니다.
- source_word: כַּשִּׁכּוֹר
  english_pob_choice: like a drunkard
  chosen_korean: 술취한 자처럼
  alternatives_korean:
  - 취객처럼
  - 술주정뱅이처럼
  - 술꾼처럼
  lexicon: HALOT
  rationale: 형용사/명사적 용법을 살리면서도 한국어에서 비속하게 들리지 않도록 '술취한 자'를 택했습니다.
- source_word: כַּמְּלוּנָה
  english_pob_choice: like a hut
  chosen_korean: 오두막처럼
  alternatives_korean:
  - 초막처럼
  - 임시 거처처럼
  - 파수꾼의 오두막처럼
  lexicon: HALOT
  rationale: מְלוּנָה의 임시적이고 허약한 거처 이미지를 한국어에서 간결하게 전하는 말로 '오두막'을 택했습니다. 문맥상 가능한 '파수꾼의 오두막'은 본문에 명시되지 않아 본문에는 두지 않았습니다.
- source_word: וְכָבַד עָלֶיהָ פִּשְׁעָהּ
  english_pob_choice: its transgression lies heavy upon it
  chosen_korean: 그 위에는 그 허물의 짐이 무겁게 지워져 있어서
  alternatives_korean:
  - 그 죄악이 그 위에 무겁게 놓여 있어서
  - 그 반역이 그 위에 무겁게 얹혀 있어서
  - 그 허물이 그 위에 무겁게 걸려 있어서
  lexicon: HALOT
  rationale: כבד의 '무겁다'는 물리적 무게를, פשע는 도덕적·언약적 위반의 무게를 함께 드러내므로 '허물의 짐'으로 압축해 부담감을 살렸습니다.
- source_word: וְלֹא תֹסִיף קוּם
  english_pob_choice: and not rise again
  chosen_korean: 다시는 일어나지 못합니다
  alternatives_korean:
  - 다시는 일어나지 않습니다
  - 다시 일어설 수 없습니다
  - 영원히 다시 일어나지 못합니다
  lexicon: HALOT
  rationale: יסף + 동사의 관용적 뜻을 한국어에서 자연스럽게 풀어 '다시'의 반복 가능성을 차단하는 표현으로 옮겼습니다. 끝의 불능 뉘앙스는 '못합니다'로 살렸습니다.
theological_decisions:
- issue: אֶרֶץ의 범위와 종말론적 심판 이미지
  chosen_reading: 이 구절의 '땅'은 지역 땅이 아니라 전 세계적 심판 아래 놓인 피조 세계를 가리키는 표현으로 읽고 번역했습니다.
  alternative_readings:
  - 가나안 땅
  - 그 땅
  - 세상
  rationale: 이사야 24장의 문맥이 전면적 붕괴를 묘사하므로, 한국어에서도 범위를 좁히지 않고 우주적 심판의 느낌을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
