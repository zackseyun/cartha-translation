id: ISA.24.1
reference: Isaiah 24:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
  footnotes:
  - marker: a
    text: Or 'the land' instead of 'the earth'; the Hebrew אֶרֶץ can mean either, but the broader context here favors a universal sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'its face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼께서 땅[a]을 비우시고 황폐하게 하시며, 그 표면[b]을 뒤틀어 놓으시고 그 주민들을 흩으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅’으로 옮길 수 있습니다. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘토지’를 뜻할 수 있으나, 여기서는 더 넓은 범위의 의미가 문맥상 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 얼굴’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자 보십시오
  lexicon: HALOT
  rationale: 예언적 경고의 주의를 끄는 감탄사로서, 현대 한국어에서 격식 있고 자연스러운 호소형인 '보십시오'가 합쇼체에 가장 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기는 POB 기본 원칙에 따라 고유명사로 처리하여 '야훼'로 옮겼습니다.
- source_word: בּוֹקֵק הָאָרֶץ וּבֹלְקָהּ
  english_pob_choice: is emptying the earth and laying it waste
  chosen_korean: 땅을 비우시고 그것을 황폐하게 하실 것입니다
  alternatives_korean:
  - 땅을 공허하게 하시고 그것을 황폐하게 하실 것입니다
  - 땅을 비워 버리시고 그것을 황폐하게 하실 것입니다
  lexicon: HALOT
  rationale: 두 동사의 중첩된 파괴 이미지를 살리면서도 한국어에서 자연스럽게 이어지도록 '비우시고 … 황폐하게 하실 것입니다'로 옮겼습니다.
- source_word: פָנֶיהָ
  english_pob_choice: its surface
  chosen_korean: 그 표면
  alternatives_korean:
  - 그 얼굴
  - 그 겉면
  lexicon: HALOT
  rationale: 직역하면 '그 얼굴'이지만, 땅/지면을 가리키는 관용으로서 한국어에서는 '그 표면'이 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 지구/땅 범위의 해석
  chosen_reading: 문맥상 보편적 심판을 드러내는 '땅'으로 옮겼습니다.
  alternative_readings:
  - '''그 땅''으로 좁혀 옮김'
  - '''세상''으로 의역'
  rationale: 이사야 24장의 문맥은 단순한 지역 파괴보다 더 넓은 범위를 가리키므로, POB의 영어 판단을 따라 '땅'을 택했습니다.
  doctrine_reference: '문맥 해석: Isaiah 24 전체의 심판 범위'
- issue: עִוָּה의 동작성
  chosen_reading: '''뒤틀고''로 옮겨 형상 훼손의 구체성을 살렸습니다.'
  alternative_readings:
  - '''왜곡하고'''
  - '''엎어버리고'''
  rationale: 히브리어 동사는 '굽히다/뒤틀다/비틀다'의 물리적 이미지를 가지므로, 추상적인 '왜곡하다'보다 '뒤틀다'가 원문 감각을 더 잘 보존합니다.
  doctrine_reference: 어휘-이미지 보존 원칙
