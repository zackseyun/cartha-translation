  text: וְ/חָֽפְרָה֙ הַ/לְּבָנָ֔ה וּ/בוֹשָׁ֖ה הַֽ/חַמָּ֑ה כִּֽי מָלַ֞ךְ יְהוָ֣ה צְבָא֗וֹת בְּ/הַ֤ר צִיּוֹן֙ וּ/בִ/יר֣וּשָׁלִַ֔ם וְ/נֶ֥גֶד זְקֵנָ֖י/ו כָּבֽוֹד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
  footnotes:
  - marker: a
    text: Or 'before its elders, glory,' if the suffix is taken to refer to Zion/Jerusalem rather than to the LORD.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'glory' is a terse final noun; the clause may also be understood as 'and before his elders is his glory' or simply 'and before his elders, glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 달은 부끄러워하고 해는 부끄러움을 당할 것입니다. 만군의 야훼께서 시온 산과 예루살렘에서 다스리시기 때문입니다. 그의 장로들[a] 앞에는 영광이 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 장로들’의 ‘그의’는 야훼를 가리키는 것으로 자연스럽게 읽히지만, 시온이나 예루살렘의 장로들을 가리킨다고 이해할 가능성도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그의 장로들 앞에, 영광’이라고 매우 압축하여 말합니다. ‘그의 장로들 앞에 그의 영광이 있을 것입니다’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָפְרָה / וּבוֹשָׁה
  english_pob_choice: will be ashamed / disgraced
  chosen_korean: 부끄러워하고 / 수치를 당할 것입니다
  alternatives_korean:
  - 수치를 당하고 / 부끄러워할 것입니다
  - 부끄러워하고 / 부끄러움을 당할 것입니다
  lexicon: HALOT
  rationale: 두 동사는 모두 ‘수치/부끄러움’ 영역이지만 서로 다른 히브리어를 반영해야 하므로, 앞절은 ‘부끄러워하다’, 뒷절은 ‘수치를 당하다’로 구분했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 주님
  lexicon: HALOT
  rationale: 문헌 기준에 따라 신명은 ‘야훼’로 옮기고, צְבָאוֹת는 천상·지상 군대를 포괄하는 ‘만군’으로 유지했습니다.
- source_word: מָלַךְ
  english_pob_choice: reigns
  chosen_korean: 다스리시기
  alternatives_korean:
  - 왕이 되시기
  - 통치하시기
  lexicon: HALOT
  rationale: 예언문맥의 완료형은 미래-확정의 현재적 진술로 읽을 수 있어, 한국어에서는 왕권의 행사 자체를 드러내는 ‘다스리시다’로 옮겼습니다.
- source_word: זְקֵנָיו
  english_pob_choice: his elders
  chosen_korean: 그의 장로들
  alternatives_korean:
  - 그의 늙은이들
  - 그 장로들
  lexicon: HALOT
  rationale: 영어 본문의 해석을 따르되, 히브리어의 복수 명사와 3인칭 남성 단수 접미사를 살려 ‘그의 장로들’로 직역했습니다.
- source_word: כָּבוֹד
  english_pob_choice: there is glory
  chosen_korean: 영광이 있을 것입니다
  alternatives_korean:
  - 영광입니다
  - 영광이 있습니다
  lexicon: HALOT
  rationale: 히브리어는 종결부에서 서술어 없이 명사만 두는 압축된 문장이라, 한국어에서는 자연스러운 서술을 위해 ‘영광이 있을 것입니다’로 풀었습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 신명 표기를 존중하여 일반 대체어인 ‘주’ 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: זְקֵנָיו의 지시대상
  chosen_reading: 그의 장로들 — 야훼를 가리키는 것으로 보되, 본문의 압축성을 유지함
  alternative_readings:
  - 시온/예루살렘의 장로들
  - 그의 백성의 장로들
  rationale: 히브리어의 축약된 표현이 지시대상을 완전히 해소하지 않으므로, 영어 POB의 긴장을 따라 ‘그의 장로들’로 남겨 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
