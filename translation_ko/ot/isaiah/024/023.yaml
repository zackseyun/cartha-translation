    rationale: וְנֶגֶד זְקֵנָיו כָּבוֹד은 문자적으로 ‘그의 장로들 앞에, 영광’에 가까운 압축된 명사구입니다. ‘그의 영광’은 가능한 보충이지만 본문에 명시된 소유 접미사는 아닙니다.
