revisions:
- from: 그때 달은 부끄러워하고, 해는 수치를 당할 것입니다. 만군의 야훼께서 시온 산과 예루살렘에서 다스리시기 때문입니다. 그리고 그의 장로들 앞에는 영광이 있을 것입니다.[a][b]
  to: 그때 달은 부끄러워하고 해는 부끄러움을 당할 것입니다. 만군의 야훼께서 시온 산과 예루살렘에서 다스리시기 때문입니다. 그의 장로들[a] 앞에는 영광이 있을 것입니다.[b]
  rationale: 두 수치 동사를 미래의 병렬 표현으로 정돈하여 히브리어의 평행법을 더 충실히 반영했습니다. 또한 각주 a를 ‘그의 장로들’에, 각주 b를 종결의 ‘영광’에 배치하고, 접미사의 지시 대상 및 무동사 종결구의 압축성이라는 실제 본문상의 여지를 보존했습니다.
