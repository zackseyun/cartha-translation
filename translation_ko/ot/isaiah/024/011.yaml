id: ISA.24.11
reference: Isaiah 24:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
  footnotes:
  - marker: a
    text: Or 'all joy has become evening,' preserving the Hebrew image of joy darkening like the onset of night.
    reason: lexical_alternative
  - marker: b
    text: Or 'the gladness of the land has departed.'
    reason: alternative_reading
translation:
  language: ko
  text: 거리에서 포도주 때문에 부르짖음이 있습니[a]다. 모든 기쁨이 어두워졌고[b], 땅의 즐거움이 사라졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거리에서 포도주에 대해 부르짖음이 있습니다’로도 볼 수 있습니다. 여기서는 포도주의 결핍/상실을 둘러싼 탄식을 자연스럽게 드러냈습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘땅의 즐거움이 떠났습니다’로도 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צְוָחָה
  english_pob_choice: There is an outcry
  chosen_korean: 부르짖음이 있습니다
  alternatives_korean:
  - 외침이 있습니다
  - 통곡이 있습니다
  lexicon: HALOT
  rationale: 고통과 탄식의 외침이라는 명사적 힘을 살리면서, 현대 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: בַּחוּצוֹת
  english_pob_choice: in the streets
  chosen_korean: 거리에서
  alternatives_korean:
  - 길거리에서
  - 광장들에서
  lexicon: HALOT
  rationale: 공적이고 열린 장소를 가리키므로, 자연스러운 현대 표현인 ‘거리에서’로 옮겼습니다.
- source_word: עָרְבָה
  english_pob_choice: has grown dark
  chosen_korean: 어두워졌고
  alternatives_korean:
  - 저물었고
  - 해가 진 듯했고
  lexicon: HALOT
  rationale: 기쁨이 밤처럼 어두워지는 이미지를 살리기 위해 ‘사라졌다’보다 ‘어두워졌다’를 택했습니다.
- source_word: מְשׂוֹשׂ הָאָרֶץ
  english_pob_choice: the gladness of the earth has gone away
  chosen_korean: 땅의 즐거움이 사라졌습니다
  alternatives_korean:
  - 땅의 기쁨이 떠났습니다
  - 땅의 즐거움이 떠났습니다
  lexicon: HALOT
  rationale: מְשׂוֹשׂ는 חג로운 ‘즐거움/흥겨움’의 뜻을 가지므로 ‘즐거움’으로 옮겼고, הָאָרֶץ는 본문 전체의 심판 범위를 따라 ‘땅’으로 유지했습니다.
theological_decisions:
- issue: 기쁨의 ‘어두워짐’이라는 은유 보존
  chosen_reading: ‘모든 기쁨이 어두워졌고’로 옮겨, 기쁨이 저녁처럼 저물어 가는 히브리어 이미지를 살렸습니다.
  alternative_readings:
  - ‘모든 기쁨이 사라졌고’
  - ‘모든 기쁨이 저물었고’
  rationale: 본문은 단순 소멸보다 감각적 은유를 사용하므로, 어둠의 이미지를 유지하는 것이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 문학적-예언적 이미지 보존
