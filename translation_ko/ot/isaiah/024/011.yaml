  source_fidelity: 히브리어의 세 절(포도주를 둘러싼 공적 탄식, 모든 기쁨의 어두워짐, 땅의 즐거움의 떠남)은 대체로 잘 반영되었습니다. 다만 עַל은 포도주 자체를 두고/놓고 부르짖는다는 관계를 나타내므로, 단정적인 인과 표현인 ‘포도주 때문에’보다 ‘포도주를 두고’가 모호성을 더 잘 보존합니다.
