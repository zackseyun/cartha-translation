revisions:
- from: 그러므로 땅의 한가운데, 백성들 가운데서 이와 같이 될 것입니다. 올리브나무를 쳐서 남은 것처럼, 포도 수확이 끝난 뒤의 줍는 열매들처럼 될 것입니다.[a][b]
  to: 이는 땅 한가운데와 민족들 가운데서, 올리브나무를 털고 난 뒤처럼[a], 포도 수확이 끝난 뒤에 남은 포도송이들처럼[b] 될 것이기 때문입니다.
  rationale: 접속사 כִּי의 설명·근거 기능을 ‘이는 … 때문입니다’로 반영했습니다. נֹקֶף זַיִת와 עוֹלֵלֹת의 농경 비유는 각각 올리브를 턴 뒤와 포도 수확 뒤에 드물게 남은 포도송이의 모습으로 옮겨, 적은 수만 남는다는 함의를 보존했습니다. 원문의 단일 서술 구조를 유지하면서 각주 표지를 해당 비유에 맞추어 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:36Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. כִּי는 앞 문맥을 근거·설명하는 접속사인데, 초안의 ‘그러므로’는 결과를 이끄는 표현이라 방향이 바뀝니다. 또한 עוֹלֵלֹת는 포도 수확 뒤에 남아 있는 포도(송이)를 가리키므로 ‘줍는 열매들’보다 이를 직접 나타내는 표현이 정확합니다.
  naturalness: ‘줍는 열매들’은 현대 한국어에서 어색하고, 두 비유 뒤에 ‘될 것입니다’가 다시 나와 문장 호응이 다소 무겁습니다. 비유의 대상을 ‘털고 난 뒤’와 ‘남은 포도송이들’로 표현하면 자연스럽고 희소하게 남은 상태도 드러납니다.
  terminology: ‘올리브나무’, ‘땅’, ‘민족들’은 적절합니다. ‘백성들’도 가능하지만, 복수 עַמִּים의 여러 집단이라는 범위를 나타내기 위해 ‘민족들’을 사용했습니다. ‘포도송이들’은 이 문맥의 עוֹלֵלֹת를 구체적이고 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: כִּי를 ‘그러므로’로 번역함
    rationale: כִּי는 여기서 앞선 진술을 뒷받침하는 ‘이는/왜냐하면/참으로’의 기능이며, ‘그러므로’처럼 결론을 도출하는 접속사로 옮기면 논리 관계가 달라집니다.
  - severity: medium
    issue: עוֹלֵלֹת를 ‘줍는 열매들’로 번역함
    rationale: 이 표현은 한국어로 부자연스럽고, 원어의 뜻은 줍는 행위보다 주 수확 뒤에 남아 있는 포도 열매들입니다.
  - severity: low
    issue: 각주 표지가 두 비유 뒤에 함께 배치됨
    rationale: 각주 a와 b는 각각 올리브나무를 치는 비유와 포도 수확 뒤의 남은 포도 비유에 바로 붙이는 편이 해당 어휘의 대안을 명확히 합니다.
