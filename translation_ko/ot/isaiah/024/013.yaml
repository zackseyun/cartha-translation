id: ISA.24.13
reference: Isaiah 24:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
  footnotes:
  - marker: a
    text: Or 'like the shaking of an olive tree.' The Hebrew image is of striking or shaking the tree so that only a few olives remain.
    reason: lexical_alternative
  - marker: b
    text: Or 'like gleanings after the vintage is ended.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 땅의 한가운데, 백성들 가운데서 이와 같이 될 것입니다. 올리브나무를 쳐서 남은 것처럼, 포도 수확이 끝난 뒤의 줍는 열매들처럼 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올리브나무를 흔드는 것처럼’. 히브리어의 이미지는 나무를 쳐서 또는 흔들어 몇 개의 올리브만 남게 하는 동작입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포도 수확이 끝난 뒤의 줍는 것처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the earth
  chosen_korean: 땅의 한가운데
  alternatives_korean:
  - 땅 한복판에
  - 세상의 한가운데
  lexicon: HALOT
  rationale: קֶרֶב의 ‘가운데/한가운데’를 살리고, הָאָרֶץ는 이 문맥에서 국제적 범위를 가진 ‘땅’으로 옮기는 편이 자연스럽습니다.
- source_word: בְּתוֹךְ הָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데서
  alternatives_korean:
  - 민족들 가운데
  - 나라들 가운데
  lexicon: HALOT
  rationale: עַמִּים의 복수 집합적 의미를 보존하면서, ‘among’의 분포감을 한국어로 자연스럽게 드러냈습니다.
- source_word: כְּנֹקֶף זַיִת
  english_pob_choice: like the beating of an olive tree
  chosen_korean: 올리브나무를 쳐서 남은 것처럼
  alternatives_korean:
  - 올리브나무를 흔들어 떨어뜨린 것처럼
  - 올리브나무를 쳐서 남은 올리브처럼
  lexicon: HALOT
  rationale: נֹקֶף의 ‘쳐서/때려서 열매를 떨어뜨리는’ 이미지를 반영해, 단순한 ‘흔들다’보다 더 직접적인 동작을 살렸습니다.
- source_word: כְּעוֹלֵלֹת אִם כָּלָה בָצִיר
  english_pob_choice: like gleanings when the grape harvest is finished
  chosen_korean: 포도 수확이 끝난 뒤의 줍는 열매들처럼
  alternatives_korean:
  - 포도 수확이 끝난 뒤 남은 이삭들처럼
  - 포도 수확이 끝난 뒤의 이삭줍기처럼
  lexicon: HALOT
  rationale: עוֹלֵלֹת는 수확 뒤에 남아 줍는 남은 것들을 가리키므로, 익숙한 농경 이미지를 살려 ‘줍는 열매들’로 옮겼습니다.
theological_decisions:
- issue: 예언적 비유의 강도 보존
  chosen_reading: 이 본문은 심판 뒤에 남는 극소수의 생존자/잔여를 농경 이미지로 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 풍경 묘사로 읽는 번역
  - 비유를 완화하여 일반적 ‘남은 것’으로 처리하는 번역
  rationale: 올리브나무를 쳐 남는 열매와 포도 수확 뒤의 줍는 것이라는 두 이미지는 남겨진 자가 매우 적음을 강하게 암시하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 이사야 24장의 심판과 남은 자 모티프
