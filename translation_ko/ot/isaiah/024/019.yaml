  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
  footnotes:
  - marker: a
    text: Or 'The land is utterly shattered … the land is completely broken apart … the land is violently shaken.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅이 완전히 산산이 부서지고, 땅이 완전히 갈라져 버리고, 땅이 몹시 흔들립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’으로 옮길 수도 있습니다. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘나라/지역’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  english_pob_choice: is utterly shattered
  chosen_korean: 완전히 산산이 부서지고
  alternatives_korean:
  - 완전히 부서지고
  - 산산이 깨어지고
  - 철저히 산산조각나고
  lexicon: HALOT
  rationale: 어근 רעע의 파괴성과 반복형의 강세를 살려, 단순한 ‘부서지다’보다 더 강한 ‘산산이 부서지다’로 옮겼습니다.
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 땅나라
  - 땅(땅)
  lexicon: HALOT
  rationale: 우주적 심판의 맥락을 살리되, 한국어에서는 ‘땅’이 반복 구조와 시적 압박을 가장 자연스럽게 전달합니다.
- source_word: פּוֹר הִתְפּוֹרְרָה
  english_pob_choice: is completely broken apart
  chosen_korean: 완전히 갈라져 버리고
  alternatives_korean:
  - 완전히 흩어지고
  - 완전히 조각나고
  - 완전히 무너져 내리고
  lexicon: HALOT
  rationale: 첫 절의 ‘산산이 부서지다’와 구별되도록, פור/פרר가 지닌 분해·해체의 느낌을 ‘갈라져 버리다’로 구체화했습니다.
- source_word: מוֹט הִתְמוֹטְטָה
  english_pob_choice: is violently shaken
  chosen_korean: 몹시 흔들립니다
  alternatives_korean:
  - 격렬히 흔들립니다
  - 크게 흔들립니다
  - 심하게 요동칩니다
  lexicon: HALOT
  rationale: מוט의 흔들림·비틀거림을 현대 한국어에서 자연스럽고 강하게 전달하는 표현으로 선택했습니다.
theological_decisions:
- issue: 반복되는 ‘땅’과 세 단계 파괴 묘사의 시적 효과
  chosen_reading: 세 개의 절을 모두 병렬로 살려, 붕괴가 누적적으로 심화되는 느낌을 보존했습니다.
  alternative_readings:
  - 두 절로 압축해 자연스럽게 다듬는 방식
  - 첫 절과 둘째 절의 반복을 줄이는 방식
  rationale: 히브리어의 반복과 점층은 단순 정보 전달보다 심판의 총체성을 강조하므로, 한국어에서도 이를 보존하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 시적 평행법과 심판의 총체성
