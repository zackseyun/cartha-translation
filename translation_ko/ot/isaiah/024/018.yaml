  source_fidelity: ‘소리치는 공포에서’는 מִקּוֹל הַפַּחַד(‘공포의 소리로부터/공포의 소리를 피해’)의 관계를 부정확하게 바꿉니다. 공포 자체가 소리친다는 뜻으로 읽히므로, ‘공포의 소리를 피해’로 고쳐야 합니다. 나머지 구덩이/덫의 대비와 ‘높은 곳’ 및 ‘땅’의 선택은 원문에 충실합니다.
  naturalness: ‘공포의 소리를 피해 달아나는 사람’은 현대 표준 한국어에서 자연스럽고, 일반적 단수 참여사를 유지합니다. 각 절을 미래 합쇼체로 맞추어 예언적 진술을 명료하게 했습니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 독자에게 더 분명합니다.
  terminology: פַּחַת와 פַּח은 각각 ‘구덩이’와 ‘덫’으로 구별한 것이 적절합니다. אֲרֻבּוֹת מִמָּרוֹם의 본문 번역 ‘높은 곳의 창들’을 유지하되, 전통적 해석적 대안은 ‘하늘의 수문들’로 각주에 제시합니다. מוֹסְדֵי אָרֶץ는 우주적 문맥을 해석으로 과도하게 확정하지 않으면서 ‘땅의 기초들’로 옮길 수 있습니다.
