revisions:
- from: 그리고 이렇게 될 것입니다. 소리치는 공포에서 도망하는 사람은 구덩이로 떨어지고, 구덩이 한가운데서 올라오는 사람은 덫에 잡힐 것입니다. 이는 높은 곳의 창들이 열리고, 땅의 기초들이 흔들리기 때문입니다.[a]
  to: 그리고 이런 일이 있을 것입니다. 공포의 소리를 피해 달아나는 사람은 구덩이에 빠질 것이며, 구덩이 한가운데에서 올라오는 사람은 덫에 잡힐 것입니다. 이는 높은 곳의 창들이[a] 열리고 땅의 기초들이 흔들릴 것이기 때문입니다.
  rationale: 원문의 핵심 어휘 관계인 ‘공포의 소리’를 회복하고, 구덩이와 덫의 대비 및 일반적 단수 표현을 보존했습니다. ‘높은 곳의 창들’은 본문에 유지하며, 보다 해석적인 전통적 대안만 각주로 제시했습니다. 문체는 현대 표준어 합쇼체로 일관되게 다듬었습니다.
