id: ISA.24.18
reference: Isaiah 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
  footnotes:
  - marker: a
    text: Or 'the floodgates of heaven are opened.' The Hebrew reads more literally, 'the windows from on high are opened.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 될 것입니다. 소리치는 공포에서 도망하는 사람은 구덩이로 떨어지고, 구덩이 한가운데서 올라오는 사람은 덫에 잡힐 것입니다. 이는 높은 곳의 창들이 열리고, 땅의 기초들이 흔들리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은 곳의 창들’은 전통적으로 ‘하늘의 창들’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: 그리고 이렇게 될 것입니다
  alternatives_korean:
  - 그리고 될 것입니다
  - 그리고 그렇게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 전환 공식을 현대 한국어로 자연스럽게 옮기되, 뒤따르는 결과 진술의 긴박함을 살렸습니다.
- source_word: מִקּוֹל הַפַּחַד / הַפַּחַת / בַּפָּח
  english_pob_choice: from the sound of terror / pit / trap
  chosen_korean: 소리치는 공포 / 구덩이 / 덫
  alternatives_korean:
  - 공포의 소리 / 구덩이 / 올무
  - 두려움의 소리 / 웅덩이 / 덫
  lexicon: HALOT
  rationale: קוֹל은 단순한 ‘소리’이지만 כאן의 재난 맥락상 ‘소리치는 공포’로 풀어 audibility와 공포의 압박을 함께 드러냈고, פַּחַת와 פַּח의 어휘 대비는 ‘구덩이’와 ‘덫’으로 살렸습니다.
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  english_pob_choice: the windows from on high
  chosen_korean: 높은 곳의 창들
  alternatives_korean:
  - 하늘의 창들
  - 위로부터의 창들
  - 높은 곳의 문들
  lexicon: HALOT
  rationale: 문자적으로 ‘높은 곳의 창/구멍’이라는 이미지를 유지해, 전통적 ‘하늘의 창’보다 원문 밀착성을 우선했습니다.
- source_word: מוֹסְדֵי אָרֶץ
  english_pob_choice: the foundations of the earth
  chosen_korean: 땅의 기초들
  alternatives_korean:
  - 땅의 토대
  - 세상의 기초들
  - 땅의 뿌리
  lexicon: HALOT
  rationale: 우주적 심판 장면이지만, 문맥상 ‘earth’는 한국어에서 너무 추상적일 수 있어 ‘땅’으로 옮기되, יסודות의 흔들림을 ‘기초들’로 구체화했습니다.
theological_decisions:
- issue: 아주 직역에 가까운 예언 시제 처리
  chosen_reading: ‘될 것입니다’와 현재형 동사를 섞어 예언적 확실성을 한국어에서 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘되리니’식 고전적 예언체
  - 전부 현재형으로 번역
  rationale: 원문의 예언적 연속성을 살리면서도 현대 독자가 읽기 쉬운 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘하늘의 창들’ 대신 ‘높은 곳의 창들’
  chosen_reading: 원문의 מִמָּרוֹם를 따라 ‘높은 곳의 창들’로 두었습니다.
  alternative_readings:
  - 전통적 ‘하늘의 창들’
  - ‘하늘의 폭포문’
  rationale: 전통 표현은 익숙하지만, 본문이 직접 말하는 지리적/시적 이미지를 보존하는 편이 원문 의미를 더 투명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
