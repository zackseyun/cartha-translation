base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the slave, so with his master; as with the female slave, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'as the creditor, so as the one who bears debt to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 백성과 제사장이 같을 것이며, 종과 그의 주인이 같을 것이고, 여종과 그 여주인이 같을 것이며, 사는 사람과 파는 사람이 같을 것이고, 빌려주는 사람과 빌리는 사람이 같을 것이며, 채권자와 그에게 빚진 사람이 같을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그날은 이와 같을 것입니다
  alternatives_korean:
  - 그 일이 일어날 것입니다
  - 그때가 될 것입니다
  lexicon: HALOT
  rationale: 예언문 서두의 상태 선언을 한국어로 자연스럽게 풀면서도, 뒤따르는 대조열을 여는 미래적·공적 어조를 유지했습니다.
- source_word: כָעָם / כַּ/כֹּהֵן
  english_pob_choice: as with the people / so with the priest
  chosen_korean: 백성과 제사장이 서로 같고
  alternatives_korean:
  - 백성과 제사장이 같고
  - 사람들과 제사장이 같고
  lexicon: HALOT
  rationale: כ-의 비교 구조를 한국어의 대응 표현으로 옮겨 반복된 사회적 평준화의 뉘앙스를 살렸습니다.
- source_word: כַּ/עֶבֶד / כַּ/אדֹנָיו
  english_pob_choice: as with the slave / so with his master
  chosen_korean: 종과 그의 주인이 서로 같으며
  alternatives_korean:
  - 노예와 그의 주인이 서로 같으며
  - 종과 그 상전이 서로 같으며
  lexicon: HALOT
  rationale: עֶבֶד은 여기서 종속된 신분을 가리키므로 ‘종’으로 옮기되, 관계의 비대칭은 ‘주인’으로 분명히 했습니다. ‘상전’은 더 고어적이어서 제외했습니다.
- source_word: כַּ/שִּׁפְחָה / כַּ/גְּבִרְתָּהּ
  english_pob_choice: as with the female slave / so with her mistress
  chosen_korean: 여종과 그녀의 여주인이 서로 같고
  alternatives_korean:
  - 여자종과 그녀의 여주인이 서로 같고
  - 여종과 그 여주인이 서로 같고
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 종속 신분을 가리키는 말이므로 ‘여종’이 가장 자연스럽고, גְּבִרְתָּהּ는 가정 내 여성 상급자를 가리켜 ‘여주인’이 적절합니다.
- source_word: כַּ/קּוֹנֶה / כַּ/מּוֹכֵר / כַּ/מַּלְוֶה / כַּ/לֹּוֶה / כַּ/נֹּשֶׁה / כַּ/אֲשֶׁר נֹשֶׁא בֽ/וֹ
  english_pob_choice: as with the buyer / so with the seller / as with the lender / so with the borrower / as with the creditor / so with the one indebted to him
  chosen_korean: 사는 사람과 파는 사람… 빌려 주는 사람과 빌리는 사람… 빚쟁이와 그에게 빚진 사람
  alternatives_korean:
  - 구매자와 판매자… 대부자와 차입자… 채권자와 그의 채무자
  - 사는 자와 파는 자… 대여하는 자와 빌리는 자… 채권자와 그에게 빚진 자
  lexicon: HALOT
  rationale: 상업·채무 관계의 병렬을 살리되, ‘사는 사람/파는 사람’ ‘빌려 주는 사람/빌리는 사람’처럼 한국어에서 즉시 이해되는 대응어를 사용했습니다. 마지막 נֹשֶׁה는 프로젝트 기본어를 따르되, 뒤의 יחס절은 ‘그에게 빚진 사람’으로 풀어 히브리어의 ‘빚을 지고 짐’ 이미지를 보존했습니다.
theological_decisions:
- issue: 사회적 지위의 총체적 평준화
  chosen_reading: 이 구절은 신분과 경제적 역할의 차이가 재난 속에서 무의미해지는 상태를 선언하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 계층 목록으로만 읽는 해석
  - 정치·경제 질서의 완전한 전복 선언으로만 읽는 해석
  rationale: 히브리어의 반복되는 כַּ- 비교가 계층 간 동일화를 강하게 강조하므로, 도덕적 비유로 약화하지 않고 재난의 포괄성을 드러내는 방향으로 옮겼습니다.
  doctrine_reference: 예언서의 심판 선언과 사회적 뒤집힘 모티프(사 24장 문맥)
