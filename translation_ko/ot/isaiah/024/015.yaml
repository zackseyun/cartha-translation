id: ISA.24.15
reference: Isaiah 24:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֥ן בָּ/אֻרִ֖ים כַּבְּד֣וּ יְהוָ֑ה בְּ/אִיֵּ֣י הַ/יָּ֔ם שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
  footnotes:
  - marker: a
    text: Or 'in the regions of light'; the Hebrew word is difficult and has also been understood as 'in the fires.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 동쪽에서 야훼께 영광을 돌리십시오. 바다의 해안들에서, 야훼, 곧 이스라엘의 하나님의 이름에 영광을 돌리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛의 지역에서’; 히브리어 원문은 난해하며 ‘불들 가운데서’로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 이끄는 연결어로 자연스러운 현대 한국어 인과 표지인 ‘그러므로’가 가장 직접적입니다.
- source_word: בָּאֻרִים
  english_pob_choice: in the east
  chosen_korean: 동쪽에서
  alternatives_korean:
  - 빛의 지역에서
  - 불들 가운데서
  lexicon: HALOT
  rationale: 히브리어가 난해하므로 POB의 지리적 이해를 따라 ‘동쪽에서’로 옮겨 대조 구조를 살렸습니다.
- source_word: כַּבְּדוּ
  english_pob_choice: give glory
  chosen_korean: 영광을 돌리십시오
  alternatives_korean:
  - 영광을 드리십시오
  - 영화롭게 하십시오
  lexicon: HALOT
  rationale: 하나님께 영광을 ‘돌리다’는 한국어 성경에서 자연스럽고, 명령형 복수의 요청도 잘 드러냅니다.
- source_word: בְּאִיֵּי הַיָּם
  english_pob_choice: in the coastlands of the sea
  chosen_korean: 바다의 해안들에서
  alternatives_korean:
  - 바다의 섬들에서
  - 해안 지방들에서
  lexicon: HALOT
  rationale: אִיִּים의 지리적 넓이를 살리되, 직역형 ‘해안들’로 해양 변방의 이미지를 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 여호와 이름 יְהוָה를 대체어가 아닌 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 문장 반복과 호칭 배치
  chosen_reading: ‘야훼… 야훼, 곧 이스라엘의 하나님’의 반복을 유지
  alternative_readings:
  - 첫 번째만 이름을 쓰고 뒤는 대명사로 처리
  - 한 번만 언급
  rationale: 히브리어의 반복과 병렬을 유지해 수사적 강조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
