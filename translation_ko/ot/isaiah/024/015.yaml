translation:
  language: ko
  text: 그러므로 동쪽에서는[a] 야훼께 영광을 돌리십시오. 바다의 해안 지방들에서는 이스라엘의 하나님이신 야훼의 이름에 영광을 돌리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛의 지역에서’; 히브리어 낱말은 해석하기 어려우며, ‘불들 가운데서’로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 이끄는 연결어로 자연스러운 현대 한국어 인과 표지인 ‘그러므로’가 가장 직접적입니다.
- source_word: בָּאֻרִים
