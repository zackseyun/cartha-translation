source:
  edition: WLC
  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
  footnotes:
  - marker: a
    text: Or “in their splendor you will exult.” The final verb is rare and its nuance is debated; the main text follows the common sense “boast/glory.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 야훼의 제사장들이라 불릴 것이며, 사람들은 너희를 두고 “우리 하나님을 섬기는 이들”이라고 말할 것입니다. 너희는 민족들의 재물을 먹고, 그들의 영광을 두고 자랑할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 광채 가운데서 너희는 기뻐할 것이다.” 마지막 동사는 희귀하며 뉘앙스가 논쟁적이므로, 본문은 일반적인 뜻의 “자랑하다”를 따릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  english_pob_choice: the priests of Yahweh
  chosen_korean: 야훼의 제사장
  alternatives_korean:
  - 야훼의 사제
  - 야훼께 속한 제사장
  lexicon: HALOT
  rationale: 히브리어의 제사장적 호칭을 직접 살리되, 한국어 성경에서 자연스러운 ‘제사장’을 유지하고 divine name은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  english_pob_choice: Ministers of our God
  chosen_korean: 우리 하나님의 섬기는 이들
  alternatives_korean:
  - 우리 하나님의 일꾼들
  - 우리 하나님을 섬기는 자들
  - 우리 하나님의 봉사자들
  lexicon: HALOT
  rationale: משרתים은 공식적·예전적 봉사자를 가리킬 수 있으나, 한국어 ‘목사/사역자’ 같은 후대 교회직 명칭은 피하고 직역성을 살린 표현을 택했습니다.
- source_word: יֵאָמֵר לָכֶם
  english_pob_choice: they will say of you
  chosen_korean: 사람들은 너희를 …이라 부를 것입니다
  alternatives_korean:
  - 사람들은 너희에게 …라고 말할 것입니다
  - 너희에 대해 …라고 말할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 비인칭적/수동적 표현을 한국어에서 자연스러운 피동적 호칭으로 옮겨, 앞절의 ‘불릴 것이며’와 평행을 이루게 했습니다.
- source_word: חֵיל גּוֹיִם
  english_pob_choice: the wealth of nations
  chosen_korean: 민족들의 재물
  alternatives_korean:
  - 열방의 부
  - 민족들의 부요
  - 열국의 재산
  lexicon: HALOT
  rationale: חֵיל은 재물·부·자원·힘을 모두 가질 수 있으나, ‘먹다’와 결합한 문맥에서 물질적 풍요가 두드러지므로 가장 직접적인 ‘재물’을 사용했습니다.
- source_word: תִּתְיַמָּרוּ
  english_pob_choice: you will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 기뻐할 것입니다
  - 영광을 취할 것입니다
  - 뽐낼 것입니다
  lexicon: HALOT
  rationale: 희귀 동사의 의미가 논쟁적이지만, POB의 본문 선택처럼 일반적 의미의 ‘자랑하다/자부하다’가 가장 무난하며, 한국어에서도 ‘그들의 영광을 두고 자랑하다’로 표현할 수 있습니다.
theological_decisions:
- issue: ‘제사장’과 ‘섬기는 이들’의 관계를 교회 직분으로 좁힐지 여부
  chosen_reading: 제사장적·예전적 호칭을 그대로 유지하되 후대 교회 직함으로 바꾸지 않았습니다.
  alternative_readings:
  - 영적 봉사자들로 일반화
  - 교회 직분 용어로 정리
  rationale: 본문은 야훼의 백성에게 주어지는 제사장적 정체성을 직접 말하므로, 상징을 약화시키는 일반화보다 원문의 종교적 이미지와 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
