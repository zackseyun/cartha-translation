  rationale: עוֹלָם은 여기서 ‘영원한’보다 오래된/먼 옛날의 뉘앙스이므로, 자연스럽고 오해를 줄이는 ‘옛 폐허’로 옮겼습니다.
- source_word: עָרֵי חֹרֶב
  english_pob_choice: the ruined cities
  chosen_korean: 무너진 성읍들
  alternatives_korean:
  - 폐허가 된 도시들
  - 황폐한 성읍들
  lexicon: HALOT
  rationale: 도시를 뜻하는 ‘성읍’은 본문의 고대적 배경을 살리면서도 한국어에서 충분히 이해되므로, ‘무너진’과 결합해 파괴 상태를 드러냈습니다.
- source_word: שֹׁמְמוֹת דּוֹר וָדֹור
