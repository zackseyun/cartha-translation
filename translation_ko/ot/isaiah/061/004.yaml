  source_fidelity: 수정이 필요합니다. 히브리어는 미래적 복원 행위를 나타내는 세 동사(재건하다, 다시 세우다, 새롭게 하다)를 병렬로 사용합니다. 마지막 ‘대대로 황폐했던’은 네 번째 복원 행위의 목적어가 아니라 ‘폐허의 성읍들’을 수식합니다. 초안은 이를 ‘다시 일으킬 것입니다’라는 별도 네 번째 동사로 처리하여 구문 관계를 바꾸었습니다.
