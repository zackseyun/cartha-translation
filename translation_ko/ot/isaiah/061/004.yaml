  chosen_korean: 세대마다 황폐했던 곳들
  alternatives_korean:
  - 대대로 황폐했던 곳들
  - 세대와 세대에 걸쳐 황폐한 곳들
  lexicon: HALOT
  rationale: דּוֹר וָדוֹר의 반복 구조를 한국어의 ‘세대마다’로 풀어, 장기간 이어진 황폐함을 간결하게 전달했습니다.
theological_decisions:
- issue: 세 가지 복원 동사의 뉘앙스
  chosen_reading: ‘재건하다 / 다시 세우다 / 새롭게 하다 / 다시 일으키다’의 연쇄를 유지해 복원의 단계성과 반복성을 살렸습니다.
  alternative_readings:
  - 모두 ‘회복하다’로 통일
  - 모두 ‘복구하다’로 통일
  rationale: 히브리어는 서로 다른 동사로 재건, 세움, 새로움, 일으킴을 겹쳐 강조하므로, 한국어도 의미 차이를 지우지 않는 쪽이 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 예언서의 회복/재건 이미지
