id: ISA.61.4
reference: Isaiah 61:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
  footnotes:
  - marker: a
    text: Or 'the ruins of old' for 'the ancient ruins'; Hebrew עוֹלָם can denote remote antiquity or long duration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the desolations of many generations.' The Hebrew literally speaks of desolations spanning 'generation and generation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 옛 폐허를 재건하며, 이전의 황폐한 곳을 다시 세우고, 무너진 성읍들을 새롭게 하며, 세대마다 황폐했던 곳들을 다시 일으킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛날의 폐허’로 옮길 수 있습니다. 히브리어 עוֹלָם은 여기서 먼 옛날이나 오랜 지속을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세대와 세대에 걸친 황폐함’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘세대와 세대’의 황폐함을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  english_pob_choice: they will rebuild
  chosen_korean: 재건하며
  alternatives_korean:
  - 건축하며
  - 다시 세우며
  lexicon: HALOT
  rationale: בנה는 단순히 ‘짓다’보다 무너진 것을 다시 세운다는 복원 의미가 강해 ‘재건하다’가 문맥에 가장 잘 맞습니다.
- source_word: חָרְבוֹת עוֹלָם
  english_pob_choice: the ancient ruins
  chosen_korean: 옛 폐허
  alternatives_korean:
  - 오래된 폐허
  - 영원한 폐허
  lexicon: HALOT
  rationale: עוֹלָם은 여기서 ‘영원한’보다 오래된/먼 옛날의 뉘앙스이므로, 자연스럽고 오해를 줄이는 ‘옛 폐허’로 옮겼습니다.
- source_word: עָרֵי חֹרֶב
  english_pob_choice: the ruined cities
  chosen_korean: 무너진 성읍들
  alternatives_korean:
  - 폐허가 된 도시들
  - 황폐한 성읍들
  lexicon: HALOT
  rationale: 도시를 뜻하는 ‘성읍’은 본문의 고대적 배경을 살리면서도 한국어에서 충분히 이해되므로, ‘무너진’과 결합해 파괴 상태를 드러냈습니다.
- source_word: שֹׁמְמוֹת דּוֹר וָדֹור
  english_pob_choice: the desolations of generation after generation
  chosen_korean: 세대마다 황폐했던 곳들
  alternatives_korean:
  - 대대로 황폐했던 곳들
  - 세대와 세대에 걸쳐 황폐한 곳들
  lexicon: HALOT
  rationale: דּוֹר וָדוֹר의 반복 구조를 한국어의 ‘세대마다’로 풀어, 장기간 이어진 황폐함을 간결하게 전달했습니다.
theological_decisions:
- issue: 세 가지 복원 동사의 뉘앙스
  chosen_reading: ‘재건하다 / 다시 세우다 / 새롭게 하다 / 다시 일으키다’의 연쇄를 유지해 복원의 단계성과 반복성을 살렸습니다.
  alternative_readings:
  - 모두 ‘회복하다’로 통일
  - 모두 ‘복구하다’로 통일
  rationale: 히브리어는 서로 다른 동사로 재건, 세움, 새로움, 일으킴을 겹쳐 강조하므로, 한국어도 의미 차이를 지우지 않는 쪽이 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 예언서의 회복/재건 이미지
