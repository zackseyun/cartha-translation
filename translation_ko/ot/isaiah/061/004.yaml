  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
  footnotes:
  - marker: a
    text: Or 'the ruins of old' for 'the ancient ruins'; Hebrew עוֹלָם can denote remote antiquity or long duration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the desolations of many generations.' The Hebrew literally speaks of desolations spanning 'generation and generation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 옛 폐허[a]를 재건하고, 이전의 황폐한 곳들을 다시 세우며, 대대로 황폐했던 폐허의 성읍들[b]을 새롭게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛날의 폐허’로 옮길 수 있습니다. 히브리어 עוֹלָם은 여기서 먼 옛날이나 오랜 지속을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러 세대에 걸친 황폐함’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘세대와 세대’의 황폐함을 말하며, 여기서는 폐허의 성읍들을 수식합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  english_pob_choice: they will rebuild
  chosen_korean: 재건하며
  alternatives_korean:
  - 건축하며
  - 다시 세우며
  lexicon: HALOT
  rationale: בנה는 단순히 ‘짓다’보다 무너진 것을 다시 세운다는 복원 의미가 강해 ‘재건하다’가 문맥에 가장 잘 맞습니다.
- source_word: חָרְבוֹת עוֹלָם
