id: ISA.61.11
reference: Isaiah 61:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
  footnotes:
  - marker: a
    text: Or "justice" for "righteousness"; the Hebrew term can include the sense of public rightness or vindication.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 땅이 자기의 싹을 내고 정원이 그 안에 뿌려진 것을 싹트게 하듯이, 주 여호와께서 모든 민족 앞에서 의와 찬양이 솟아나게 하실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 히브리어는 공적 바름이나 정당함이 드러나는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כָאָרֶץ תּוֹצִיא צִמְחָהּ
  english_pob_choice: For as the earth brings forth its growth
  chosen_korean: 땅이 자기의 싹을 내고
  alternatives_korean:
  - 땅이 자기의 생장을 내고
  - 땅이 자기의 싹을 만들어 내고
  lexicon: HALOT
  rationale: 비유의 첫째 절에서 יצא/צמח의 농경적 이미지를 자연스러운 한국어로 살리기 위해 ‘싹을 내다’를 택했습니다.
- source_word: וּכְגַנָּה זֵרוּעֶיהָ תַצְמִיחַ
  english_pob_choice: and as a garden causes what is sown in it to spring up
  chosen_korean: 정원에 뿌려진 것이 거기서 움트게 하듯이
  alternatives_korean:
  - 정원이 그 안에 뿌려진 것을 싹트게 하듯이
  - 정원이 뿌린 것을 자라게 하듯이
  lexicon: HALOT
  rationale: זֵרוּעֶיהָ를 단순히 ‘씨앗’으로 좁히지 않고 ‘뿌려진 것’으로 옮겨, 무엇이든 뿌려진 작물 전체를 포함하는 의미를 보존했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 합성 칭호는 한국어에서 ‘주 여호와’가 가장 널리 읽히는 형태이며, 원문의 두 요소(주권 칭호+언약 이름)를 함께 드러냅니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: 예언서의 회복 문맥에서 צְדָקָה는 단순한 윤리 덕목보다 하나님의 바로잡으심과 언약적 바름을 함께 가리키므로, POB의 ‘righteousness’를 한국어 성경어인 ‘의’로 옮겼습니다.
- source_word: וּתְהִלָּה
  english_pob_choice: and praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬송
  - 영광
  lexicon: HALOT
  rationale: ‘תְהִלָּה’의 기본 의미를 살려 응답의 소리인 ‘찬양’으로 번역했습니다. ‘영광’은 의미가 달라 배제했습니다.
- source_word: נֶגֶד כָּל הַגּוֹיִם
  english_pob_choice: before all the nations
  chosen_korean: 모든 민족 앞에서
  alternatives_korean:
  - 열방 앞에서
  - 모든 나라들 앞에서
  lexicon: HALOT
  rationale: נֶגֶד는 공개적 가시성을 뜻하므로 ‘앞에서’가 적합하며, גּוֹיִם은 문맥상 ‘민족들’로 옮겨 국제적 범위를 유지했습니다.
theological_decisions:
- issue: יהוה의 표기와 주권 칭호의 결합
  chosen_reading: ‘주 여호와’로 옮겨, 주권 칭호와 언약 이름을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 야훼’
  rationale: 본문은 אֲדֹנָי와 יְהוִה를 함께 사용하므로, 두 요소를 모두 보존하는 한국어 관행을 따랐습니다. ‘주 하나님’은 원문의 고유명적 긴장을 약화할 수 있습니다.
  doctrine_reference: 'Contested terms: יהוה / YHWH — Yahweh/여호와 표기, 합성 칭호 보존'
- issue: צְדָקָה의 예언적 회복 의미
  chosen_reading: ‘의’로 옮기되, 공적·언약적 바로섬의 함의를 유지했습니다.
  alternative_readings:
  - ‘공의’
  - ‘의로움’
  rationale: 이 구절은 하나님이 세상 가운데 회복을 드러내시는 장면이므로, 개인 윤리보다 더 넓은 언약적 회복의 의미를 담는 ‘의’가 가장 균형 잡혀 있습니다.
  doctrine_reference: Prophetic restoration usage of צְדָקָה
