  edition: WLC
  text: וְ/נוֹדַ֤ע בַּ/גּוֹיִם֙ זַרְעָ֔/ם וְ/צֶאֱצָאֵי/הֶ֖ם בְּ/ת֣וֹךְ הָ/עַמִּ֑ים כָּל רֹֽאֵי/הֶם֙ יַכִּיר֔וּ/ם כִּ֛י הֵ֥ם זֶ֖רַע בֵּרַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
  footnotes:
  - marker: a
    text: Or 'among the Gentiles' for 'among the nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'seed' in both occurrences; rendered 'offspring' for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자손은 여러 나라 가운데 알려질 것이며, 그들의 후손은 여러 백성 가운데 알려질 것입니다. 그들을 보는 모든 사람은 그들이 야훼께 복받은 자손임을 알아볼 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러 나라’는 ‘민족들’ 또는 ‘열방’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 번 모두 ‘씨/자손’ 계열 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וְנוֹדַע
  english_pob_choice: will be known
  chosen_korean: 알려질 것입니다
  alternatives_korean:
  - 알게 될 것입니다
  - 인지될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 ‘알려지다’로 옮겼습니다. 자연스러운 현대 한국어이면서도 주체가 드러나는 감각을 유지합니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 나라 가운데
  alternatives_korean:
  - 열방 가운데
  - 민족들 가운데
  lexicon: HALOT
  rationale: 이사야 문맥의 גוים를 넓은 국제 집단으로 읽어 ‘여러 나라’로 옮겼습니다. 교회적 관용어인 ‘열방’도 가능하지만, 본문은 보다 직접적인 일반어가 적절합니다.
- source_word: וְצֶאֱצָאֵיהֶם
  english_pob_choice: their descendants
  chosen_korean: 그들의 후손
  alternatives_korean:
  - 그들의 자손
  - 그들의 자손들
  lexicon: HALOT
  rationale: 앞의 ‘자손’과 평행을 이루는 두 번째 표현을 한국어에서 약간 달리 두어 중복을 줄이면서도, 의미상 동일한 계열어를 유지했습니다.
- source_word: כָּל רֹאֵיהֶם יַכִּירוּם
  english_pob_choice: all who see them will recognize them
  chosen_korean: 그들을 보는 모든 사람은 … 알아볼 것입니다
  alternatives_korean:
  - 그들을 보는 모든 사람은 … 알아볼 것입니다
  - 그들을 보는 모든 사람은 … 알아차릴 것입니다
  lexicon: HALOT
  rationale: ראי־ + Hiphil נכר의 관찰 후 식별 의미를 살려 ‘알아보다’로 옮겼습니다. 문맥상 외적 표지를 보고 그 정체를 인식하는 뜻이므로 ‘알아차리다’보다 더 정확합니다.
- source_word: זֶרַע בֵּרַךְ יְהוָה
  english_pob_choice: offspring blessed by Yahweh
  chosen_korean: 야훼께 복받은 자손임
  alternatives_korean:
  - 야훼께 복을 받은 자손임
  - 야훼께 복된 자손임
  lexicon: HALOT
  rationale: זֶרַע를 ‘자손’으로, בֵּרַךְ를 상태를 나타내는 수식으로 살려 ‘복받은 자손’으로 옮겼습니다. 이는 단순한 축복 선언이 아니라 야훼의 복이 표지처럼 드러난 정체성을 강조합니다.
theological_decisions:
- issue: 예언적 인식 문구의 종결 방식
  chosen_reading: ‘그들이 야훼께 복받은 자손임을 알아볼 것입니다’로 마무리하여, 관찰자들이 외적 표지 뒤의 신적 복의 근원을 인식한다는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘야훼께 복을 받은 자손인 것을 알게 될 것입니다’
  - ‘야훼께 복된 자손임을 인정할 것입니다’
  rationale: 본문의 핵심은 혈통의 번창 자체가 아니라, 공동체가 야훼의 복을 받은 존재로 공적으로 식별된다는 점입니다. ‘알아볼 것입니다’가 그 인식의 뉘앙스를 가장 잘 보존합니다.
  doctrine_reference: 이사야 61:9의 회복과 표지 인식
