- from: 그들의 자손은 여러 나라 가운데 알려질 것이며, 그들의 후손은 여러 백성 가운데 알려질 것입니다. 그들을 보는 모든 사람은 그들이 야훼께 복받은 자손임을 알아볼 것입니다.[a][b]
  to: 그들의 자손[b]은 여러 나라[a] 가운데 알려질 것이며, 그들의 후손은 여러 백성 가운데 알려질 것입니다. 그들을 보는 모든 사람은 그들을 알아보아, 그들이 야훼께 복을 받은 자손임을 알게 될 것입니다.
  rationale: ‘그들을 알아보아’로 יַכִּירוּם의 대상을 분명히 하고, 뒤의 ‘그들이 … 자손임을 알게 될 것입니다’로 כִּי절이 그 인식의 내용을 나타내도록 했습니다. ‘복을 받은’은 בֵּרַךְ의 수동적 의미를 보존하면서 현대 합쇼체에 더 자연스럽게 다듬은 표현입니다. 각주 표지는 해당 어휘에 인접시켰습니다.
