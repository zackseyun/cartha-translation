translation:
  language: ko
  text: 야훼께서 은혜를 베푸시는 해[a]와 우리 하나님의 보복의 날을 선포하고, 모든 애도하는 이들[b]을 위로하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 받아 주시는 해’.
