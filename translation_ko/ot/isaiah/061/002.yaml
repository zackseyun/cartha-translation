translation:
  language: ko
  text: 야훼의 은혜의 해와 우리 하나님의 보복의 날을 선포하고, 모든 슬퍼하는 사람들을 위로하게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
