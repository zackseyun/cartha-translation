lexical_decisions:
- source_word: לִקְרֹא
  english_pob_choice: to proclaim
  chosen_korean: 선포하다
  alternatives_korean:
  - 부르다
  - 알리다
  lexicon: HALOT
  rationale: 공적이고 권위 있는 선언의 목적을 나타내므로, 단순한 '부르다'보다 '선포하다'가 소스의 문맥을 더 정확히 살립니다.
- source_word: שְׁנַת רָצוֹן
  english_pob_choice: the year of Yahweh’s favor
  chosen_korean: 야훼의 은혜의 해
  alternatives_korean:
  - 야훼께서 기뻐하시는 해
  - 야훼의 받아 주시는 해
  lexicon: HALOT
  rationale: רָצוֹן의 긍정적 호의를 현대 한국어로 자연스럽게 옮기되, POB의 'favor'에 맞춰 '은혜'를 택했습니다.
- source_word: וְיוֹם נָקָם
  english_pob_choice: and the day of vengeance
  chosen_korean: 보복의 날
  alternatives_korean:
  - 복수의 날
  - 징벌의 날
  lexicon: HALOT
  rationale: נָקָם의 강한 응보 의미를 약화하지 않기 위해 '보복'을 사용했고, '징벌'보다 원문의 감정적·법적 긴장을 더 직접적으로 드러냅니다.
- source_word: כָּל אֲבֵלִים
  english_pob_choice: all who mourn
  chosen_korean: 모든 슬퍼하는 사람들
  alternatives_korean:
  - 모든 애도하는 이들
  - 모든 상중인 사람들
  lexicon: HALOT
  rationale: 형용사적/분사적 표현을 성중립적으로 살려, 특정 성별이 아닌 애도하는 사람 전체를 가리키도록 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 여호와 이름을 사용하므로, 프로젝트 기본값에 따라 '야훼'로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 은혜와 보복의 병렬 긴장 유지
  chosen_reading: 야훼의 은혜의 해와 우리 하나님의 보복의 날을 함께 유지
  alternative_readings:
  - 보복을 '심판'으로 완화
  - 위로를 강조해 보복 구절을 약화
  rationale: 본문은 은혜와 보복을 병렬로 배치하므로, 어느 한쪽을 완화하지 않고 그대로 살려 구원의 위로와 심판의 엄중함을 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
