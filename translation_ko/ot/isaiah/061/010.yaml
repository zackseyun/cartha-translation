  to: 나는 야훼 안에서 크게 기뻐하겠습니다. 내 영혼은 나의 하나님 안에서 환희에 차겠습니다. 이는 그분께서 내게 구원의 옷을 입혀 주시고 의의 겉옷[a]으로 나를 두르셨기 때문입니다. 마치 신랑이 제사장처럼 머리에 관[b]을 쓰고, 신부가 자기 장신구로 자신을 꾸미듯이 말입니다.
  rationale: 원문의 두 ב 전치사의 평행을 ‘~안에서’로 유지하고, גיל의 강한 기쁨을 자연스러운 시적 한국어로 드러냈습니다. 신랑의 장식은 본문의 제사장적 암시를 보존하되, 해석상 여지를 각주에 남겼습니다. 각주 표지도 해당 어휘에 직접 붙였습니다.
