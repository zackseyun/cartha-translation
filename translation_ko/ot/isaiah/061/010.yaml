id: ISA.61.10
reference: Isaiah 61:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
  footnotes:
  - marker: a
    text: Or, 'a mantle of righteousness' or 'a robe of justice.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew likely evokes priestly adornment: ''like a bridegroom who puts on a headdress like a priest.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼로 말미암아 크게 기뻐하겠습니다. 내 영혼이 내 하나님으로 말미암아 즐거워할 것입니다. 이는 그분이 내게 구원의 옷을 입히시고 의의 겉옷으로 나를 두르셨기 때문입니다. 마치 신랑이 제사장처럼 머리 장식을 하고, 신부가 자기 장신구로 몸을 꾸미듯이 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의의 망토’ 혹은 ‘정의의 겉옷’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 제사장적 장식을 암시할 가능성이 큽니다. 곧 ‘제사장처럼 머리 장식을 한 신랑’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  english_pob_choice: I will greatly rejoice
  chosen_korean: 크게 기뻐하겠습니다
  alternatives_korean:
  - 크게 즐거워하겠습니다
  - 참으로 기뻐하겠습니다
  - 기뻐하고 또 기뻐하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 반복을 한국어에서는 자연스러운 부사구로 살려 과도한 직역을 피하면서도 강한 기쁨을 유지했습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼로 말미암아
  alternatives_korean:
  - 야훼 안에서
  - 야훼로 인해
  lexicon: HALOT
  rationale: 전치사 ב의 영역/근거 의미를 살려 기쁨의 근원과 대상으로서 야훼를 드러냈습니다. POB의 본문이 지닌 신명 표기를 그대로 반영했습니다.
- source_word: תָּגֵל נַפְשִׁי
  english_pob_choice: my soul will exult
  chosen_korean: 내 영혼이 … 즐거워할 것입니다
  alternatives_korean:
  - 내 영혼이 … 환호할 것입니다
  - 내 영혼이 … 크게 기뻐할 것입니다
  lexicon: HALOT
  rationale: נפש의 주체성을 살리되 한국어에서 ‘영혼’은 그대로 두고, גיל의 들뜬 기쁨은 ‘즐거워하다’로 옮겨 시적 평행을 유지했습니다.
- source_word: בִּגְדֵי יֶשַׁע
  english_pob_choice: garments of salvation
  chosen_korean: 구원의 옷
  alternatives_korean:
  - 구원의 겉옷
  - 구원의 의복
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 자연스럽게 집합적 표현인 ‘옷’으로 옮겨, 구원이라는 핵심 명사를 분명히 드러냈습니다.
- source_word: מְעִיל צְדָקָה
  english_pob_choice: a robe of righteousness
  chosen_korean: 의의 겉옷
  alternatives_korean:
  - 의의 로브
  - 의의 망토
  - 의의 두루마기
  lexicon: HALOT
  rationale: מְעִיל은 바깥에 걸치는 겉옷이므로 현대 한국어에서 이해하기 쉬운 ‘겉옷’을 택했습니다. צְדָקָה는 이 시적 문맥에서 표준적으로 ‘의’로 옮겼습니다.
- source_word: יְכַהֵן פְּאֵר
  english_pob_choice: who adorns himself with a priestly headdress
  chosen_korean: 제사장처럼 머리 장식을 하고
  alternatives_korean:
  - 제사장 관처럼 장식하고
  - 제사장다운 관을 쓰고
  lexicon: HALOT
  rationale: 동사의 제사장적 뉘앙스와 פְּאֵר의 장식적 머리쓰개 의미를 함께 살리되, 한국어에서는 불필요하게 난해한 직역을 피하고 문맥상 ‘제사장처럼’으로 제사장적 연상을 드러냈습니다.
- source_word: כֵלֶיהָ
  english_pob_choice: her jewelry
  chosen_korean: 자기 장신구
  alternatives_korean:
  - 자기 보석
  - 자기 장식물
  lexicon: HALOT
  rationale: 신부의 치장 문맥에서 כֵלִים은 단순한 기구가 아니라 장신구를 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘장신구’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 고유한 언약 სახელ을 보존하기 위해 표준 번역어인 ‘야훼’를 사용했습니다. 본문이 직접 신명자를 쓰므로 일반 호칭으로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제사장적 장식의 해석
  chosen_reading: 제사장처럼 머리 장식을 하고
  alternative_readings:
  - 제사장 머리쓰개를 하고
  - 제사장 관을 쓰듯이
  rationale: 이 표현은 혼인 비유 안에 제사장적 이미지가 겹쳐지는 본문의 문학적 긴장을 지니므로, 이를 평탄화하지 않고 ‘제사장처럼’으로 남겨 독자가 상징성을 읽도록 했습니다.
  doctrine_reference: English POB lexical note on יְכַהֵן פְּאֵר
- issue: צְדָקָה의 의미
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 의복 은유 속에서 צְדָקָה는 공동체적 정의보다 하나님 앞의 올바름과 언약적 의를 가리키므로, 한국어 기본 대응인 ‘의’를 사용했습니다.
  doctrine_reference: DOCTRINE.md translation philosophy §5
