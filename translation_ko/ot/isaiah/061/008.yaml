source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
  footnotes:
  - marker: a
    text: Or 'robbery in a burnt offering,' 'robbery for a burnt offering,' or possibly 'robbery with wrongdoing.' The Hebrew phrase is difficult and may refer to stolen goods brought as offerings or to injustice mixed with worship.
    reason: alternative_reading
  - marker: b
    text: Or 'their reward' or 'their wage.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: ''cut a covenant,'' that is, make a covenant.'
    reason: cultural_note
translation:
  language: ko
  text: 나 야훼는 정의를 사랑하고, 번제와 함께한 탈취[a]를 미워합니다. 나는 신실하게[c] 그들에게 그들의 보상[b]을 주고, 그들과 영원한 언약을 맺겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구절은 난해합니다. ‘번제 안에서의 탈취’, ‘번제를 위한 탈취’, 또는 ‘번제와 관련된 탈취’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 삯’ 또는 ‘그들의 상급’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘진실로’ 또는 ‘진리 안에서’입니다. 여기서는 하나님께서 보상을 주시는 방식에 초점을 두어 ‘신실하게’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 하나님의 고유명을 학술적 음역인 ‘야훼’로 옮겨, 언약적 발화의 직접성을 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 공의
  lexicon: HALOT
  rationale: 탈취와의 대조 속에서 여기서는 법정 판결보다 윤리적·사회적 의미가 강하므로 ‘정의’가 가장 자연스럽습니다.
- source_word: גָזֵל בְּעוֹלָה
  english_pob_choice: robbery with burnt offering
  chosen_korean: 탈취와 번제
  alternatives_korean:
  - 번제와 함께한 탈취
  - 번제 속의 탈취
  - 불의와 함께한 탈취
  lexicon: HALOT
  rationale: הבְעוֹלָה를 English POB의 복원판에 맞춰 ‘번제’로 유지하여, 예배 행위와 결합된 탈취라는 난점을 본문이 지닌 그대로 드러냈습니다.
- source_word: פְעֻלָּתָם
  english_pob_choice: their recompense
  chosen_korean: 그들의 보상
  alternatives_korean:
  - 그들의 삯
  - 그들의 보답
  - 그들의 상급
  lexicon: HALOT
  rationale: 문맥상 하나님이 주시는 응분의 몫을 가리키므로 ‘보상’이 가장 중립적이며, ‘삯’보다 덜 고용관계적입니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in faithfulness
  chosen_korean: 성실함 가운데
  alternatives_korean:
  - 진리 가운데
  - 신실함으로
  - 진실하게
  lexicon: HALOT
  rationale: 하나님의 주시는 방식에 걸린 말로서, 단순한 ‘진리’보다 언약적 신뢰성과 충실성을 함께 담는 ‘성실함’이 적절합니다.
- source_word: בְרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 영원한 계약
  lexicon: HALOT
  rationale: 성경적 언약 공식어를 자연스럽게 옮기되, ‘언약’으로 관계적·신학적 무게를 보존했습니다.
theological_decisions:
- issue: גָזֵל בְּעוֹלָה의 난해한 결합
  chosen_reading: ‘탈취와 번제’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘번제와 함께한 탈취’
  - ‘번제 속의 탈취’
  - ‘불의와 함께한 탈취’
  rationale: 본문의 압축성과 난해함을 완화해 버리기보다, 예배와 불의의 결합에 대한 예언자적 책망을 독자가 그대로 느끼도록 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: כָּרַת בְּרִית의 관용구
  chosen_reading: ‘언약을 맺겠습니다’라고 자연스럽게 옮기되, 문맥은 ‘자르다/맺다’ 관용구를 전제합니다.
  alternative_readings:
  - ‘언약을 자르겠습니다’
  - ‘언약을 만들겠습니다’
  rationale: 한국어에서는 ‘자르다’가 관용구로 기능하지 않으므로 의미를 살린 자연스러운 표현을 택했습니다. 다만 본문이 지닌 히브리어 관용구의 배경은 훼손하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
