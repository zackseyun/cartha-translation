revisions:
- from: 네 수치를 대신하여 두 배가 주어질 것이며, 수치를 대신하여 그들은 자기 몫으로 말미암아 기뻐 외칠 것입니다. 그러므로 그들의 땅에서 그들은 두 배를 차지할 것이며, 영원한 기쁨이 그들에게 있을 것입니다.[a][b][c]
  to: 너희의 수치[a] 대신에 갑절의 몫을 받을 것이며, 치욕 대신에 그들은 자기 몫을 두고 기뻐 외칠 것입니다[b]. 그러므로 그들의 땅에서 그들은 갑절의 몫을 차지할 것이며[c], 영원한 기쁨이 그들의 것이 될 것입니다.
  rationale: 2인칭 복수와 3인칭 복수의 원문상 전환을 그대로 보존하되, 한국어의 수 일치와 문장 연결을 바로잡았습니다. ‘수치/치욕’으로 병행 어휘를 구별하고, ‘갑절의 몫’으로 회복과 상속의 문맥을 드러냈습니다. 각주 내용은 원문의 인칭 전환 및 어휘 대안을 유지하면서 해당 위치에 각각 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:24Z'
review_pass:
  verdict: revise
  source_fidelity: 마소라 본문의 2인칭 복수(בָּשְׁתְּכֶם)에서 3인칭 복수(חֶלְקָם, בְּאַרְצָם, יִירָשׁוּ)로의 전환은 유지되어야 합니다. 초안의 ‘네’는 히브리어 2인칭 복수와 맞지 않으므로 ‘너희의’로 고쳐야 합니다. מִשְׁנֶה의 반복은 단순한 수량 ‘두 배’보다 상속·분깃 문맥을 드러내는 ‘갑절의 몫’으로 옮기는 것이 안전합니다.
  naturalness: ‘수치를 대신하여’의 반복은 두 히브리어 명사의 차이를 흐립니다. 앞은 ‘수치’, 뒤는 공적 불명예의 뉘앙스를 가진 ‘치욕’으로 구별하고, ‘자기 몫을 두고 기뻐 외치다’로 다듬으면 현대 표준어 합쇼체에서 자연스럽습니다. 각주 표지는 해당 어구에 직접 붙여야 합니다.
  terminology: ‘갑절의 몫’은 מִשְׁנֶה와 חֵלֶק 및 ירשׁ의 상속·분깃 문맥을 자연스럽게 보존합니다. ‘영원한 기쁨이 그들의 것이 될 것입니다’는 שִׂמְחַת עוֹלָם תִּהְיֶה לָהֶם을 충실히 반영합니다.
