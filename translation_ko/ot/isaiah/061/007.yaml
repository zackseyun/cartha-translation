id: ISA.61.7
reference: Isaiah 61:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
  footnotes:
  - marker: a
    text: Hebrew shifts from 'your shame' to 'their share / their land / they will possess.' Many translations smooth this to 'you/your' throughout for readability.
    reason: alternative_reading
  - marker: b
    text: Or 'they will sing for joy over their portion.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they will inherit a double portion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 수치[a] 대신에 갑절의 몫을 받을 것이며, 치욕 대신에 그들은 자기 몫을 두고 기뻐 외칠 것입니다[b]. 그러므로 그들의 땅에서 그들은 갑절의 몫을 차지할 것이며[c], 영원한 기쁨이 그들의 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘너희의 수치’에서 ‘그들의 몫/그들의 땅/그들은 차지할 것이다’로 인칭이 바뀝니다. 읽기 편의상 모두 ‘너희’로 맞추는 번역도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들은 자기 몫을 두고 노래하며 기뻐할 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 갑절의 몫을 상속받을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: Instead of
  chosen_korean: ~을 대신하여
  alternatives_korean:
  - ~ 대신에
  - ~을 대신해
  lexicon: HALOT
  rationale: 교환·대체의 뜻을 살려 ‘대신하여’로 옮겼습니다. 문맥의 수치-회복 역전을 분명하게 드러냅니다.
- source_word: בָּשְׁתְּכֶם
  english_pob_choice: your shame
  chosen_korean: 네 수치
  alternatives_korean:
  - 너희의 수치
  - 너의 수치
  - 수치
  lexicon: HALOT
  rationale: 히브리어 2인칭 복수 접미사를 살려 직역에 가깝게 ‘네 수치’로 두었습니다. 이어지는 3인칭 복수와의 전환은 본문의 실제 형태를 반영합니다.
- source_word: מִשְׁנֶה
  english_pob_choice: a double portion
  chosen_korean: 두 배
  alternatives_korean:
  - 두 몫
  - 두 몫의 분깃
  - 이중 몫
  lexicon: HALOT
  rationale: 본문의 반복과 회복 맥락상 수량적 증대를 간결하게 살리기 위해 ‘두 배’로 옮겼습니다. 이어지는 ‘차지할 것이며’와 함께 상속/분깃의 의미도 유지됩니다.
- source_word: חֶלְקָם
  english_pob_choice: their portion
  chosen_korean: 자기 몫
  alternatives_korean:
  - 그들의 몫
  - 그들의 분깃
  lexicon: HALOT
  rationale: חֵלֶק은 몫/분깃의 뜻이므로 ‘자기 몫’으로 자연스럽게 옮겼습니다. ‘자기’는 3인칭 복수 소유를 한국어에서 덜 어색하게 표현합니다.
- source_word: יָרֹנּוּ
  english_pob_choice: they will shout for joy
  chosen_korean: 기뻐 외칠 것입니다
  alternatives_korean:
  - 환호할 것입니다
  - 기쁨에 외칠 것입니다
  - 노래하며 기뻐할 것입니다
  lexicon: HALOT
  rationale: רנן의 소리 내는 환희를 살리기 위해 ‘기뻐 외치다’를 택했습니다. 단순한 내적 감정보다 외적 환성을 드러냅니다.
- source_word: שִׂמְחַת עוֹלָם
  english_pob_choice: everlasting joy
  chosen_korean: 영원한 기쁨
  alternatives_korean:
  - 영원한 즐거움
  - 영원한 환희
  lexicon: HALOT
  rationale: ‘עוֹלָם’의 지속성을 ‘영원한’으로, שִׂמְחָה의 기본 의미를 ‘기쁨’으로 옮겨 가장 직접적으로 전달했습니다.
theological_decisions:
- issue: 2인칭 복수에서 3인칭 복수로 바뀌는 인칭 전환
  chosen_reading: ‘네 수치’는 2인칭을 유지하고, 뒤의 ‘그들/그들의’는 3인칭 복수를 그대로 살렸습니다.
  alternative_readings:
  - 전체를 ‘너희’로 평탄화하는 읽기
  - 전체를 ‘그들’로 통일하는 읽기
  rationale: 마소라 본문은 실제로 인칭 전환을 보입니다. 이를 평탄화하면 원문이 가진 강조와 구조가 약해지므로, 번역에서도 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
