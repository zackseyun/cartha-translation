  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
  footnotes:
  - marker: a
    text: Or 'beauty' instead of 'ashes'; the Hebrew פְּאֵר can denote adornment or a festive headdress. The concrete image likely refers to headwear replacing the ashes of mourning.
    reason: lexical_alternative
  - marker: b
    text: Or 'terebinths of righteousness.' The Hebrew tree term may refer more specifically to terebinths; 'oaks' is used here as a familiar English equivalent for the poetic image.
    reason: lexical_alternative
  - marker: c
    text: Or 'oaks of justice.' The Hebrew צֶדֶק can denote both righteousness and justice depending on context.
    reason: alternative_reading
  - marker: d
    text: Or 'that he may be glorified.' The final Hebrew verb can be understood as expressing the LORD's glorification through this planting.
    reason: alternative_reading
translation:
  language: ko
  text: 시온의 애도하는 이들을 위하여 마련하고, 그들에게 재 대신 머리장식[a]을, 애통 대신 기쁨의 기름을, 낙심한 영 대신 찬양의 겉옷을 주어, 그들이 의의 참나무[b][c], 곧 야훼께서 자신의 영광을 나타내시려고 심으신 나무라 불릴 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְּאֵר는 ‘아름다움’으로도 옮길 수 있습니다. 그러나 여기서는 재를 머리에 얹는 애도와 대조되어, 축제의 머리장식 또는 머리쓰개를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 수목 명칭은 더 구체적으로 ‘테레빈나무’로 옮길 수도 있습니다. 여기서는 시적 수목 이미지를 살려 ‘참나무’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 צֶדֶק은 여기서 ‘의’로 옮겼지만, 문맥에 따라 ‘정의’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 마지막 동사는 ‘야훼께서 영광을 받으시도록’으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּאֵר
  english_pob_choice: a headdress
  chosen_korean: 관
  alternatives_korean:
  - 머리장식
  - 관모
  - 화려한 머리장식
  lexicon: HALOT
  rationale: פְּאֵר는 단순한 ‘아름다움’보다 장식용 머리 덮개를 가리킬 수 있으므로, 재와 대조되는 머리 위의 장식을 살리는 말로 옮겼습니다.
- source_word: רוּחַ כֵּהָה
  english_pob_choice: a faint spirit
  chosen_korean: 침울한 영
  alternatives_korean:
  - 쇠약한 영
  - 희미한 영
  - 낙심한 영
  lexicon: HALOT
  rationale: כֵּהָה는 ‘희미한/어두운/기운 빠진’ 뉘앙스가 있어, 내적 소진을 드러내는 표현으로 ‘침울한 영’을 선택했습니다.
- source_word: אֵילֵי הַצֶּדֶק
  english_pob_choice: oaks of righteousness
  chosen_korean: 의의 상수리나무들
  alternatives_korean:
  - 의의 떡갈나무들
  - 의의 참나무들
  - 의의 터펜틴나무들
  lexicon: HALOT
  rationale: 시적 이미지와 ‘심다’라는 뒤 문맥에 맞춰 수목 이미지를 유지했습니다. 한국어에서는 ‘상수리나무’가 비교적 자연스럽고, 본문의 강건함을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신성호칭 יְהוָה는 전통 대체어가 아니라 고유명사 음역 ‘야훼’로 옮겼습니다.
- source_word: לְהִתְפָּאֵר
  english_pob_choice: that he may display his glory
  chosen_korean: 그분의 영광을 드러내게 하십니다
  alternatives_korean:
  - 그분께서 영광을 받으시게 하십니다
  - 그분의 영광이 드러나게 하십니다
  lexicon: HALOT
  rationale: 히트파엘 פאר는 단순 수동 ‘영광을 받다’보다 하나님의 영광이 드러나 보이게 되는 능동적 뉘앙스를 가집니다. 한국어에서는 ‘드러내게 하십니다’가 이 목적의미를 자연스럽게 반영합니다.
theological_decisions:
- issue: 예언문 종결부의 주체와 목적 표현
  chosen_reading: 야훼께서 심으신 백성이 그분의 영광을 드러내도록 하시는 목적절로 이해했습니다.
  alternative_readings:
  - 그분이 영광을 받으시도록
  - 그분 자신이 영광스럽게 되도록
  rationale: 본문의 동사는 단순한 추상명사보다 하나님이 심으신 결과를 통해 자신의 영광을 나타내는 목적을 가리킵니다. 따라서 주체성과 목적성을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: בְּרִית적 회복의 묘사에서 옷과 기름의 상징
  chosen_reading: 애통의 상태를 뒤집는 교환 이미지로 이해해, 재·슬픔·침울함에 대응하는 머리장식·기쁨의 기름·찬양의 겉옷을 유지했습니다.
  alternative_readings:
  - 비유를 약화해 추상화함
  - 단순히 기분 전환으로 표현함
  rationale: 본절은 회복을 상징적 교환으로 제시하므로, 상징성을 평이하게 풀기보다 본문의 대조 구조를 살리는 것이 합당합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
