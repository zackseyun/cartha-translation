revisions:
- from: 시온의 애도하는 이들을 위해, 그들에게 재 대신 관을, 슬픔 대신 기쁨의 기름을, 침울한 영 대신 찬양의 겉옷을 주어, 그들이 의의 상수리나무들로—야훼께서 심으신 것이라 불리며—그분의 영광을 드러내게 하십니다.[a][b][c][d]
  to: 시온의 애도하는 이들을 위하여 마련하고, 그들에게 재 대신 머리장식[a]을, 애통 대신 기쁨의 기름을, 낙심한 영 대신 찬양의 겉옷을 주어, 그들이 의의 참나무[b][c], 곧 야훼께서 자신의 영광을 나타내시려고 심으신 나무라 불릴 것입니다.[d]
  rationale: 문맥상 축제와 애도의 교환 이미지를 보존하면서, 한국어의 병렬 구조를 다듬었습니다. 특히 종결 목적절을 ‘야훼께서 자신의 영광을 나타내시려고’로 고쳐 히브리어의 문법적 연결과 영어 POB 감사 기록의 의미를 회복했습니다. 각주 표지는 해당 어휘와 종결 동사에 직접 연결되도록 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:35Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 세 가지 대조(재/머리장식, 애통/기쁨의 기름, 기운이 꺾인 영/찬양의 겉옷)와 야훼라는 신명은 대체로 충실히 반영합니다. 그러나 종결부 לְהִתְפָּאֵר는 야훼께서 자신의 영광을 나타내시는 목적을 가리키는데, 초안은 백성이 ‘그분의 영광을 드러내게’ 된다는 의미로 주체를 바꾸었습니다. 또한 ‘야훼께서 심으신 것이라 불리며’의 삽입 구조는 히브리어의 병렬 명사구를 불명료하게 만듭니다.
  naturalness: ‘관’은 현대 한국어에서 왕관이나 관모를 우선 연상시켜 재와 대조되는 축제의 머리장식이라는 이미지를 충분히 전달하지 못합니다. ‘머리장식’이 더 자연스럽고 구체적입니다. ‘침울한 영’도 가능하나 כֵּהָה의 기력 저하·낙담의 뜻에는 ‘낙심한 영’이 더 자연스럽습니다. 수정문은 합쇼체 문장 흐름과 병렬을 정리했습니다.
  terminology: פְּאֵר는 ‘머리장식’으로, מַעֲטֵה는 ‘겉옷’으로 옮겼습니다. אֵילֵי는 수목 비유를 유지하여 ‘참나무’로 번역하고, 테레빈나무 가능성은 각주로 남겼습니다. צֶדֶק의 ‘정의’ 가능성과 종결 동사의 대안적 이해도 각주로 보존했습니다. יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다.
  issues:
  - severity: high
    issue: 종결부의 주체와 목적이 바뀌었습니다.
    rationale: לְהִתְפָּאֵר는 ‘야훼의 심으심’에 연결되어 야훼께서 영광을 나타내시거나 영광을 받으시는 목적을 표현합니다. ‘그들이 그분의 영광을 드러내게 하십니다’는 백성을 영광 표명의 주체로 만들고, 본문의 문법적 연결을 약화합니다.
  - severity: medium
    issue: ‘야훼께서 심으신 것이라 불리며’가 명사 병렬과 문장 주체를 불명료하게 합니다.
    rationale: ‘의의 참나무’와 ‘야훼의 심으심/심으신 것’은 그들이 불릴 명칭을 이루는 병렬 표현입니다. 이를 ‘곧 … 심으신 나무’로 풀면 관계가 자연스럽습니다.
  - severity: medium
    issue: ‘관’은 פְּאֵר의 문맥상 의미를 지나치게 좁히고 현대적으로도 부자연스럽습니다.
    rationale: 재를 머리에 얹는 애도의 관습과 대조되는 것은 왕관에 한정되지 않는 장식적·축제적 머리쓰개입니다. ‘머리장식’이 안전합니다.
  - severity: low
    issue: 수목 각주의 ‘터펜틴나무’ 표기가 부정확합니다.
    rationale: 한국어에서는 일반적으로 ‘테레빈나무’로 표기합니다. 원어의 정확한 수종은 논쟁적이므로 본문은 익숙한 ‘참나무’를 쓰고 대안을 각주에 보존하는 편이 적절합니다.
