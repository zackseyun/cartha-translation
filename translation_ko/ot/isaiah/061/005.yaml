review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘낯선 사람들이 와서’는 זָרִים를 ‘낯선 사람들’로 좁히고, וְעָמְדוּ(‘서다’)를 ‘와서’로 바꾸어 원문의 핵심 표현을 누락합니다. זָרִים는 이 문맥에서 ‘외국인들’이 적절하며, ‘서서’는 원문의 표현을 유지해야 합니다. 2인칭 남성 복수 접미사는 한국어에서 ‘여러분의’로 자연스럽게 반영했습니다.
  naturalness: ‘당신의’는 예언서에서 공동체를 향한 복수 호칭으로는 부자연스럽거나 단수로 들릴 수 있으므로 ‘여러분의’로 고쳤습니다. ‘양 떼를 치고’, ‘농부들과 포도원지기들이 될 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: זָרִים는 ‘외국인들’, בְנֵי נֵכָר는 히브리어의 관용적 구성과 평행을 살려 ‘외국인의 아들들’로 옮겼습니다. 후자는 문자적인 혈연만을 뜻하지 않을 수 있음을 각주로 밝혔습니다. אִכָּרֵיכֶם과 כֹרְמֵיכֶם은 각각 ‘농부들’과 ‘포도원지기들’로 구별했습니다.
  issues:
  - severity: high
    issue: וְעָמְדוּ의 의미가 ‘와서’로 대체됨
    rationale: 원문은 ‘외국인들이 서서’라고 하며, 봉사를 위해 서 있는 모습을 포함합니다. ‘와서’는 원문에 없는 이동 의미를 더하고 ‘서다’를 누락합니다.
  - severity: medium
    issue: זָרִים를 ‘낯선 사람들’로 번역함
    rationale: 이 문맥의 זָרִים는 단지 모르는 사람이 아니라 외부 민족에 속한 사람들을 뜻하므로 ‘외국인들’이 더 정확합니다.
  - severity: medium
    issue: 2인칭 복수에 ‘당신의’를 사용함
    rationale: 히브리어 소유 접미사는 복수이며, 한국어 ‘당신’은 단수적이고 대화 상황에 따라 거칠게 들릴 수 있습니다. 공동체를 향한 예언의 문맥에는 ‘여러분의’가 적절합니다.
  - severity: low
    issue: 각주 위치와 내용이 본문의 해당 표현에 직접 연결되지 않음
    rationale: 대안 번역 각주는 זָרִים 뒤에, 관용구 설명은 בְנֵי נֵכָר 뒤에 붙여 독자가 무엇을 설명하는지 분명히 알 수 있게 해야 합니다.
  revised_text: 외국인들이 서서 여러분의 양 떼를 치고[a], 외국인의 아들들이 여러분의 농부들과 포도원지기들이 될 것입니다.[b]
