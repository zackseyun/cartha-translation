id: ISA.61.5
reference: Isaiah 61:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָמְד֣וּ זָרִ֔ים וְ/רָע֖וּ צֹאנְ/כֶ֑ם וּ/בְנֵ֣י נֵכָ֔ר אִכָּרֵי/כֶ֖ם וְ/כֹרְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
  footnotes:
  - marker: a
    text: Or 'strangers will stand and pasture your sheep.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of foreigners,' an idiom for people from foreign nations.
    reason: cultural_note
translation:
  language: ko
  text: 낯선 사람들이 와서 당신의 양 떼를 치고, 이방인의 아들들이 당신의 농부가 되며 당신의 포도원지기가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들이 와서 당신의 양 떼를 칠 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘외국인의 아들들’은 외국 민족에 속한 사람들을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  english_pob_choice: Foreigners
  chosen_korean: 낯선 사람들
  alternatives_korean:
  - 외국인들
  - 이방인들
  lexicon: HALOT
  rationale: 히브리어는 언약 공동체 밖의 타자를 가리키므로, 현대 한국어에서는 ‘낯선 사람들’보다 더 자연스럽지만 본문 맥락을 흐리지 않는 ‘외국인들’도 가능하나, 여기서는 사회적 위치를 살리기 위해 ‘낯선 사람들’로 옮겼습니다.
- source_word: וְרָעוּ
  english_pob_choice: shepherd
  chosen_korean: 치고
  alternatives_korean:
  - 목자 노릇하며
  - 먹이고
  - 치며
  lexicon: HALOT
  rationale: 동사 רעה는 목축하다/양을 치다의 뜻이므로, ‘목자 노릇하며’보다 짧고 본래의 목축 이미지를 살리는 ‘치고’를 선택했습니다.
- source_word: בְנֵי נֵכָר
  english_pob_choice: sons of foreigners
  chosen_korean: 이방인의 아들들
  alternatives_korean:
  - 외국인들의 아들들
  - 낯선 자들의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역해, 단순한 생물학적 자녀보다 외국 민족에 속한 사람들을 가리키는 표현임을 드러냈습니다.
- source_word: אִכָּרֵיכֶם
  english_pob_choice: your farmers
  chosen_korean: 당신의 농부
  alternatives_korean:
  - 당신의 밭일꾼
  - 당신의 경작자
  lexicon: HALOT
  rationale: 농경 노동자를 가리키는 말이므로, 현대 독자가 즉시 이해할 수 있는 ‘농부’를 택했습니다.
- source_word: כֹרְמֵיכֶם
  english_pob_choice: your vinedressers
  chosen_korean: 당신의 포도원지기
  alternatives_korean:
  - 당신의 포도 재배자
  - 당신의 포도밭 일꾼
  lexicon: HALOT
  rationale: 포도원을 돌보는 사람을 뜻하므로, 성경 문맥에서 자연스럽고 정확한 ‘포도원지기’를 사용했습니다.
theological_decisions:
- issue: 본문의 사회적 역할 역전 구도
  chosen_reading: 이 구절은 회복된 시온을 위해 외국인이 농업·목축 노동을 맡는 모습을 그대로 드러내며, 그 비대칭을 완화하지 않았습니다.
  alternative_readings:
  - 국제적 협력의 일반적 그림
  - 풍요를 나타내는 비유
  rationale: 히브리어의 평행구는 실제 봉사 관계를 묘사하므로, 본문이 주는 복원/역전의 이미지를 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
