revisions:
- from: 낯선 사람들이 와서 당신의 양 떼를 치고, 이방인의 아들들이 당신의 농부가 되며 당신의 포도원지기가 될 것입니다.[a][b]
  to: 외국인들이 서서 여러분의 양 떼를 치고[a], 외국인의 아들들이 여러분의 농부들과 포도원지기들이 될 것입니다.[b]
