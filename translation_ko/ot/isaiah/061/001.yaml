- from: 주 여호와께서 내게 내 영을 주셨으니, 이는 주께서 나를 기름부어 가난한 자에게 좋은 소식을 전하게 하시고, 마음이 상한 자를 싸매게 하시고, 포로 된 자에게 해방을 선포하게 하시고, 갇힌 자에게 감옥을 열어지게 하심이라.[a][b]
  to: 주 여호와의 영이 내게 임하셨습니다. 이는 여호와께서 나에게 기름을 부으셔서 겸손한 이들에게[a] 좋은 소식을 전하게 하시고, 나를 보내어 마음이 상한 이들을 싸매며, 포로들에게 자유를 선포하고, 갇힌 이들에게 열림을[b] 선포하게 하셨기 때문입니다.
  rationale: 원문의 문법적 구조를 회복했습니다. 즉, ‘주 여호와의 영’이 화자 위에 임한 사실, 여호와의 기름부으심, 그리고 ‘나를 보내셨다’라는 별도의 위임을 모두 반영했습니다. 마지막 표현은 학문적으로 확정하기 어려우므로 특정 해석을 본문에 강제하지 않고 ‘열림’과 각주로 처리했습니다.
