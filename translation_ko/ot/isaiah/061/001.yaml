  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 병렬되는 사명 진술을 자연스럽게 드러냅니다. ‘열림’은 원문의 난해성과 개방성을 보존하기 위해 다소 직역적으로 유지하되 각주로 설명합니다.
