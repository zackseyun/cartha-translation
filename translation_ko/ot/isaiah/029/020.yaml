theological_decisions:
- issue: אָרִיץ를 ‘폭군’으로 좁힐지, 더 넓게 ‘포악한 자’로 둘지
  chosen_reading: 포악한 자로 번역했습니다.
  alternative_readings:
  - 폭군
  - 압제자
  rationale: 본문은 권력 형태보다 폭력적·가학적 인물을 가리키므로, 보다 넓은 윤리적 범주를 유지하는 편이 문맥에 충실합니다.
  doctrine_reference: Judgment on arrogance and violence in prophetic oracle
- issue: וְנִכְרְתוּ의 심판적·언약적 뉘앙스를 어떻게 드러낼지
  chosen_reading: ‘끊어질 것이기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 제거될 것입니다
  - 끊겨 사라질 것입니다
  rationale: ‘끊어지다’는 잘라냄의 이미지와 심판적 단절을 함께 보존하면서도 과도한 해석을 덧붙이지 않습니다.
  doctrine_reference: Divine judgment expressed in cutting-off imagery
