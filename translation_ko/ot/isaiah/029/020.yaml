  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אָפֵ֥ס עָרִ֖יץ וְ/כָ֣לָה לֵ֑ץ וְ/נִכְרְת֖וּ כָּל שֹׁ֥קְדֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
  footnotes:
  - marker: a
    text: Or 'the tyrant' for 'the ruthless one.' The Hebrew עָרִיץ can denote an oppressive or violent person.
    reason: lexical_alternative
  - marker: b
    text: Or 'all who are intent on evil' or 'all who lie in wait for iniquity.' The Hebrew participle suggests vigilant, deliberate attention to wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 포악한 자는 끝나고[a], 조롱하는 자는 사라지며[b], 악행을 지키며 노리는 자들은 모두 끊어질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘폭군’. 히브리어 עָרִיץ는 압제적이거나 폭력적인 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악을 노리는 모든 자’ 혹은 ‘죄악을 엿보는 모든 자’. 히브리어 분사는 악에 대해 깨어 주의하는, 의도적인 태도를 시사합니다.
    reason: lexical_alternative
