id: ISA.29.23
reference: Isaiah 29:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
  footnotes:
  - marker: a
    text: Or 'when Abraham sees his children, the work of my hands, in his midst'; the singular pronouns may echo the patriarchs named in the previous verse, especially Abraham or Jacob.
    reason: alternative_reading
  - marker: b
    text: Or 'they will fear' or 'they will revere.' The Hebrew verb includes the sense of reverential dread or awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기의 자녀들, 곧 내 손이 만든 것들을 자기 가운데서 볼 때에 그들이 내 이름을 거룩하게 하며, 야곱의 거룩하신 분을 거룩하게 하고 이스라엘의 하나님을 두려워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가’는 앞선 문맥의 아브라함이나 야곱, 또는 집합적으로 이스라엘을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘두려워하다’는 여기서 단순한 공포보다 하나님 앞의 경외를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִרְאֹתוֹ
  english_pob_choice: when he sees
  chosen_korean: 자기의 자녀들 … 볼 때에
  alternatives_korean:
  - 그가 볼 때
  - 그가 보게 될 때
  lexicon: HALOT
  rationale: ב + 부정사구의 시간적 용법을 살려 ‘~할 때에’로 옮겼고, 문맥의 모호한 단수 주어는 그대로 두어 인물 지시의 긴장을 보존했습니다.
- source_word: יְלָדָיו
  english_pob_choice: his children
  chosen_korean: 자기의 자녀들
  alternatives_korean:
  - 그의 아들들
  - 그의 후손들
  lexicon: HALOT
  rationale: יָלַד 계열은 성별에 한정되지 않는 자녀/후손을 가리킬 수 있으므로, 복원 맥락에 맞게 ‘자녀들’로 옮겼습니다.
- source_word: מַעֲשֵׂה יָדַי
  english_pob_choice: the work of my hands
  chosen_korean: 내 손이 만든 것들
  alternatives_korean:
  - 내 손의 일
  - 내 손으로 지은 것들
  lexicon: HALOT
  rationale: 하나님의 창조·형성 이미지를 한국어로 자연스럽게 살리면서도, 원문의 구체적 손 이미지가 보이도록 했습니다.
- source_word: קְד֣וֹשׁ יַֽעֲקֹב
  english_pob_choice: the Holy One of Jacob
  chosen_korean: 야곱의 거룩하신 분
  alternatives_korean:
  - 야곱의 거룩하신 이
  - 야곱의 성자
  lexicon: HALOT
  rationale: 이사야서의 고유한 신칭호를 ‘거룩하신 분’으로 직역해 유지했고, 전통적 교회어보다 원문의 호칭성을 살렸습니다.
- source_word: יַעֲרִיצוּ
  english_pob_choice: they will stand in awe of
  chosen_korean: 두려워할 것입니다
  alternatives_korean:
  - 경외할 것입니다
  - 경탄하며 두려워할 것입니다
  lexicon: HALOT
  rationale: 어근의 의미는 두려움과 경외를 함께 포함하므로, 문맥상 가장 직접적인 ‘두려워하다’를 택하되 신적 경외의 뉘앙스는 앞의 ‘거룩하게 하며’와 병행 구조로 보존했습니다.
theological_decisions:
- issue: ‘내 이름’을 거룩하게 함과 ‘야곱의 거룩하신 분’을 거룩하게 함의 중복
  chosen_reading: 두 번의 קדש 동사를 모두 살려, 하나님의 이름과 하나님의 존재를 각각 거룩하게 여기는 반복을 유지했습니다.
  alternative_readings:
  - 한 절로 합쳐 매끄럽게 번역하기
  - 두 번째 ‘거룩하게 하다’를 완화해 ‘공경하다’로 옮기기
  rationale: 히브리어 반복은 수사적으로 중요하므로, 한국어에서도 동일 동사를 유지해 신적 거룩의 강조를 분명히 했습니다.
  doctrine_reference: Consistency of key terms, or documented exception
- issue: 단수 주어 ‘그가’의 지시 대상
  chosen_reading: 지시 대상을 확정하지 않고 ‘그가’로 두어, 앞선 아브라함/야곱 또는 집합적 이스라엘의 가능성을 열어 두었습니다.
  alternative_readings:
  - 아브라함을 특정하기
  - 야곱/이스라엘로 특정하기
  rationale: 문맥상 복수의 가능성이 있으며, 번역이 그 긴장을 해소해 버리면 원문의 여운이 사라집니다. 따라서 모호성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
