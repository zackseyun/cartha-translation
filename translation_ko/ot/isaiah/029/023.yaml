- from: 그가 자기의 자녀들, 곧 내 손이 만든 것들을 자기 가운데서 볼 때에 그들이 내 이름을 거룩하게 하며, 야곱의 거룩하신 분을 거룩하게 하고 이스라엘의 하나님을 두려워할 것입니다.[a][b]
  to: 이는 그가 자기 가운데에 있는 자기 자녀들, 곧 내 손으로 지은 이들을 볼 때에, 그들이 내 이름을 거룩하게 하고 야곱의 거룩하신 분을 거룩하게 하며 이스라엘의 하나님을 경외할 것이기 때문입니다.[a][b]
  rationale: 인과를 나타내는 כִּי를 보충하고, 단수 대명사의 지시 대상에 관한 원문의 모호성은 ‘그가/자기’와 각주로 보존했습니다. 자녀들을 ‘내 손으로 지은 이들’로 표현하여 מַעֲשֵׂה יָדַי의 창조·형성 이미지를 유지했습니다. קדש의 두 번의 반복을 그대로 살렸으며, 마지막 동사는 하나님 앞의 경외를 드러내도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:42Z'
