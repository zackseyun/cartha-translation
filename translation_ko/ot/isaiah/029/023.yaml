  source_fidelity: 원문의 כִּי가 앞 절의 약속에 대한 근거를 제시하는 기능을 하는데, 초안에는 이 인과 연결이 드러나지 않습니다. 또한 בְּקִרְבּוֹ는 ‘그의 가운데에’라는 단수 소유·장소 표현으로 보존하는 편이 적절합니다. 나머지 핵심 어휘와 반복 구조는 대체로 충실합니다.
  naturalness: ‘자기의 자녀들 … 자기 가운데서’는 한국어에서 다소 어색하고, ‘자기 가운데에 있는’으로 처리하면 단수 주어와 그 공동체적 내부라는 관계를 자연스럽게 드러낼 수 있습니다. ‘경외할 것입니다’는 이 문맥에서 ‘두려워할 것입니다’보다 יַעֲרִיצוּ의 경외적 두려움을 더 자연스럽고 정확하게 전달합니다.
