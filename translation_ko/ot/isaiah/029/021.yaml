  rationale: ‘성문’은 공적 재판 장소를 가리키므로 그대로 두고, מוֹכִיחַ는 책망/반박/변론의 중간 의미를 살려 중립적으로 ‘책망하는 자’로 옮겼습니다.
- source_word: יְקֹשׁוּן
  english_pob_choice: lay a snare
  chosen_korean: 올가미로 잡으며
  alternatives_korean:
