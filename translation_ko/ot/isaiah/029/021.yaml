base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
  footnotes:
  - marker: a
    text: Or 'those who condemn a man for a word' or 'those who make a person sin by a word.' The Hebrew can carry either a judicial or causative nuance, though the legal setting favors the judicial sense here.
    reason: lexical_alternative
  - marker: b
    text: '''In the gate'' refers to the city gate as the place of public judgment and legal proceedings.'
    reason: cultural_note
  - marker: c
    text: Or 'turn aside the righteous for nothing' or 'deny justice to the righteous by what is empty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 한마디로 죄인으로 만들고[a], 성문에서 책망하는 자[b]를 올가미로 잡으며, 의인을 허무한 것으로 돌려세우는 자들입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한마디 때문에 사람을 정죄하는 자들’ 혹은 ‘한마디로 사람을 죄짓게 만드는 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 공적 재판과 법적 절차가 이루어지던 도시의 성문을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘허무한 이유로 의인을 돌려세우는 자들입니다’ 혹은 ‘헛된 것으로 의인에게 정의를 빼앗는 자들입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי אָדָם
  english_pob_choice: those who make a man an offender
  chosen_korean: 사람을 한마디로 죄인으로 만들고
