  lexicon: HALOT
  rationale: תֹהוּ의 공허·허무·무실체성을 살려, 판결을 비우고 무효화하는 느낌이 드러나도록 했습니다.
theological_decisions:
- issue: 의인(צַדִּיק)의 법정적 의미
  chosen_reading: ‘의인’을 윤리적 경건과 함께, 공적 판결에서 정당한 사람이라는 법정적 의미까지 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘무죄한 사람’
  - ‘정당한 사람’
  rationale: 문맥이 성문 재판을 배경으로 하므로 순수한 도덕적 의미로만 좁히지 않고, 본문의 법정적·윤리적 중첩을 보존하는 것이 타당합니다.
  doctrine_reference: OT wisdom/justice context; legal-righteousness semantics of צַדִּיק
