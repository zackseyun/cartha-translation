source:
  edition: WLC
  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
  footnotes:
  - marker: a
    text: Or, more literally, “Your turning of things upside down!”; some understand the opening as “Your perversity!”
    reason: lexical_alternative
translation:
  language: ko
  text: “당신들은 모든 것을 뒤집어엎고 있습니다!”[a] 도공이 진흙처럼 여겨지겠습니까? 만들어진 것이 자기를 만든 이에게 “그가 나를 만들지 않았다”라고 말하고, 빚어진 것이 자기를 빚은 이에게 “그에게는 분별력이 없다”라고 말하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “당신들의 뒤집어엎음이여!”이며, 어떤 이들은 이 첫 구절을 “당신들의 패역이여!”로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְכְּכֶם
  english_pob_choice: You turn things upside down
  chosen_korean: 당신들의 뒤집어엎는 행위여
  alternatives_korean:
  - 당신들은 세상을 뒤집어엎고 있습니다
  - 당신들의 전도된 행위여
  - 당신들의 뒤집어엎음이여
  lexicon: HALOT
  rationale: 어근 הפך의 전도·전복 의미를 살리되, 히브리어의 압축된 감탄을 한국어의 질책성 감탄구로 옮겼습니다.
- source_word: הַיֹּצֵר
  english_pob_choice: the potter
  chosen_korean: 도공
  alternatives_korean:
  - 토기장이
  - 빚는 이
  - 형성하는 이
  lexicon: HALOT
  rationale: 진흙과의 직접 결합에서 구체적 이미지가 핵심이므로, 창조자 같은 추상어보다 도공을 택했습니다.
- source_word: מַעֲשֶׂה
  english_pob_choice: what is made
  chosen_korean: 지음받은 것
  alternatives_korean:
  - 만들어진 것
  - 지어진 것
  - 작품
  lexicon: HALOT
  rationale: ‘만들어진 결과물’이라는 수동적 대상성을 살리기 위해, ‘지음받은 것’으로 옮겼습니다.
- source_word: יֵצֶר
  english_pob_choice: what is formed
  chosen_korean: 빚어진 것
  alternatives_korean:
  - 형성된 것
  - 빚은 것
  - 형체
  lexicon: HALOT
  rationale: 앞절의 מַעֲשֶׂה와 평행을 이루는 ‘형성된 것’의 뜻을, 도공의 작업 이미지와 잘 맞는 ‘빚어진 것’으로 대응시켰습니다.
theological_decisions:
- issue: 창조자-피조물 비유의 보존
  chosen_reading: ‘도공’과 ‘진흙’을 그대로 살려 창조자와 피조물의 역전이라는 예언자적 논지를 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘만드는 이’와 ‘만들어진 것’으로 추상화하기
  - 비유를 완화하여 일반적 종교 언어로 바꾸기
  rationale: 본문의 신학적 충격은 피조물이 창조자를 평가절하하는 역설에 있으므로, 이미지를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 수사적 질문의 반항적 어조
  chosen_reading: 첫머리를 감탄형 질책으로 처리하고, 뒤의 두 문장을 수사적 질문으로 연결했습니다.
  alternative_readings:
  - 조건문처럼 ‘만일...’로 옮기기
  - 단순 서술문으로 평탄화하기
  rationale: 히브리어 אִם의 논박적 기능을 반영해야 본문의 경고와 꾸짖음이 자연스럽게 전달됩니다.
  doctrine_reference: Translation philosophy §§1, 6
