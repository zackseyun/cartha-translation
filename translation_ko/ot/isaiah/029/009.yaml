id: ISA.29.9
reference: Isaiah 29:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִתְמַהְמְה֣וּ וּ/תְמָ֔הוּ הִשְׁתַּֽעַשְׁע֖וּ וָ/שֹׁ֑עוּ שָֽׁכְר֣וּ וְ/לֹא יַ֔יִן נָע֖וּ וְ/לֹ֥א שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
  footnotes:
  - marker: a
    text: Or 'Linger and be amazed.' The first pair of imperatives can carry the sense of hesitating in bewilderment as well as being stunned.
    reason: lexical_alternative
  - marker: b
    text: Or 'Be blinded and blind yourselves.' The Hebrew verbs in this pair are rare and difficult; they convey stupefaction or blindness.
    reason: alternative_reading
translation:
  language: ko
  text: 멍해지십시오, 그리고 놀라십시오[a]. 스스로를 눈멀게 하십시오, 그리고 눈이 머십시오[b]. 그들은 술에 취했지만 포도주 때문이 아니며, 비틀거리지만 독주 때문이 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘머뭇거리십시오, 그리고 놀라십시오.’ 첫 번째 명령형 쌍은 당혹 가운데 지체하거나 머뭇거리는 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘눈이 머십시오, 그리고 스스로를 눈멀게 하십시오.’ 이 두 히브리어 동사는 희귀하고 난해하며, 혼미나 눈멂을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  english_pob_choice: Be stunned
  chosen_korean: 놀라워하며 놀라십시오
  alternatives_korean:
  - 지체하며 놀라십시오
  - 멍해지십시오
  lexicon: HALOT
  rationale: 첫 번째 명령형은 단순한 시간 지연보다 놀라움과 당혹 속의 멈칫거림을 함께 담으므로, ‘놀라워하며’로 그 어감을 살렸습니다.
- source_word: וּתְמָהוּ
  english_pob_choice: and be astonished
  chosen_korean: 놀라워하며 놀라십시오
  alternatives_korean:
  - 그리고 놀라십시오
  - 그리고 경악하십시오
  lexicon: HALOT
  rationale: 둘째 명령형은 הראשונה와 평행을 이루는 ‘놀라다/놀라워하다’ 계열이므로, 한국어에서도 강한 감탄과 충격을 유지하는 표현을 택했습니다.
- source_word: הִשְׁתַּעַשְׁעוּ / וָשֹׁעוּ
  english_pob_choice: blind yourselves / and be blind
  chosen_korean: 스스로를 눈멀게 하며 눈먼 자가 되십시오
  alternatives_korean:
  - 스스로를 멀게 하며 멀어진 자가 되십시오
  - 눈멀게 되며 눈먼 자가 되십시오
  lexicon: HALOT
  rationale: 희귀하고 난해한 두 동사는 문맥상 ‘눈멀다/눈멀게 하다’의 의미군을 형성하므로, POB의 해석을 따라 수동적 상태와 반사적 행위를 함께 드러냈습니다.
- source_word: שָׁכְרוּ וְלֹא יַיִן ... נָעוּ וְלֹא שֵׁכָר
  english_pob_choice: They are drunk, but not with wine ... they stagger, but not from strong drink
  chosen_korean: 그들은 술에 취했지만 포도주 때문이 아니며, 비틀거리지만 독주 때문이 아닙니다
  alternatives_korean:
  - 그들은 취했지만 포도주가 아니며, 비틀거리지만 독주가 아닙니다
  - 그들은 술에 취했지만 포도주 때문이 아니고, 흔들리지만 독주 때문이 아닙니다
  lexicon: HALOT
  rationale: ‘술에 취하다/비틀거리다’는 예언적 비유를 자연스럽게 살리되, 뒤의 부정구를 통해 실제 원인이 술이 아님을 분명히 하도록 번역했습니다.
theological_decisions:
- issue: 명령형과 서술형의 전환
  chosen_reading: 앞의 두 쌍은 명령형으로, 뒤의 두 절은 그들이 بالفعل 그런 상태라는 서술로 옮겼습니다.
  alternative_readings:
  - 모든 동사를 명령으로 통일하기
  - 모든 동사를 서술로 평탄화하기
  rationale: 히브리어 본문은 명령과 상태 진술을 의도적으로 대비시키므로, 한국어에서도 그 긴장을 유지해야 예언적 아이러니가 살아납니다.
  doctrine_reference: 예언 문학의 수사와 문맥 보존
- issue: ‘술 취함/비틀거림’의 비유성
  chosen_reading: 이 이미지는 문자적 만취가 아니라 영적 혼미와 눈멂을 가리키는 비유로 유지했습니다.
  alternative_readings:
  - 문자적 취함으로만 읽기
  - 주해를 본문 안에 풀어 써서 ‘심판으로 인해 혼미해짐’으로 확장하기
  rationale: 본문 자체가 ‘포도주 때문이 아니며… 독주 때문이 아닙니다’라고 하여 비유임을 밝히므로, 해석을 본문에 과도하게 주입하지 않고 비유를 그대로 보존했습니다.
  doctrine_reference: 예언 본문 해석 원칙
- issue: a 주석의 의미
  chosen_reading: 첫 번째 쌍이 ‘지체/머뭇거림’도 포함할 수 있음을 각주로 밝혔습니다.
  alternative_readings:
  - 각주 없이 단정적으로 번역하기
  - 각주를 ‘놀라다’ 쪽으로만 한정하기
  rationale: POB의 감수 이력에 따르면 첫 동사는 ‘stunned’뿐 아니라 ‘linger in bewilderment’의 뉘앙스도 가능하므로, 한국어 본문과 각주로 그 긴장을 반영했습니다.
  doctrine_reference: 번역 투명성 원칙
