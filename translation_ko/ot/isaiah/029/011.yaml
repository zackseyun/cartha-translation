revisions:
- from: 온갖 것의 환상이 여러분에게는 봉인된 두루마리의 말들처럼 되었으니, 사람들이 그것을 글을 아는 이에게 주며 「부디 이것을 읽어 보십시오」 하고 말하면 그는 「봉인되어 있으므로 읽을 수 없습니다」 하고 말합니다.[a]
  to: 이 모든 것에 관한 환상은 여러분에게 봉인된 두루마리에 적힌 말과 같이 되었습니다. 사람들이 그것을 글을 읽을 줄 아는 이에게 주며 ‘부디 이것을 읽어 주십시오’ 하고 말하면, 그는 ‘봉인되어 있으므로 할 수 없습니다’ 하고 말합니다.[a]
  rationale: 지시적 의미를 지닌 הַכֹּל을 ‘이 모든 것’으로 바로잡고, 비교 대상인 ‘봉인된 두루마리의 말’을 자연스러운 한국어로 재구성했습니다. 또한 לֹא אוּכַל의 목적어 생략을 보존했으며, 문해자를 가리키는 표현과 그 직역 가능성을 본문과 각주에 각각 적절히 반영했습니다.
  reviewer_model: gpt-5.6-terra
