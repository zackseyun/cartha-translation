id: ISA.29.11
reference: Isaiah 29:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
  footnotes:
  - marker: a
    text: Or 'to one who can read'; literally, 'to one who knows the scroll.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것에 관한 환상은 여러분에게 봉인된 두루마리에 적힌 말과 같이 되었습니다. 사람들이 그것을 글을 읽을 줄 아는 이에게 주며 ‘부디 이것을 읽어 주십시오’ 하고 말하면, 그는 ‘봉인되어 있으므로 할 수 없습니다’ 하고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘글을 아는 이’; 직역하면 ‘두루마리(책)를 아는 이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּת
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 환시
  - 묵시
  - 계시
  lexicon: HALOT
  rationale: 예언적 시현의 의미를 살리면서도 문맥상 ‘보이는 것/보이는 계시’의 성격을 자연스럽게 드러내는 말로 옮겼습니다.
- source_word: הַכֹּל
  english_pob_choice: all this
  chosen_korean: 온갖 것
  alternatives_korean:
  - 이 모든 것
  - 모든 것
  - 이 모든 일
  lexicon: HALOT
  rationale: 앞선 예언 전체를 가리키는 총칭을 한국어로 자연스럽게 드러내기 위해 ‘온갖 것’으로 옮겼습니다.
- source_word: יוֹדֵעַ הַסֵּפֶר
  english_pob_choice: one who knows the scroll
  chosen_korean: 글을 아는 이
  alternatives_korean:
  - 글을 읽을 줄 아는 이
  - 문자를 아는 이
  - 두루마리를 아는 이
  lexicon: HALOT
  rationale: 히브리어가 가리키는 문해 능력을 살리되, 한국어에서는 ‘두루마리를 아는 이’보다 ‘글을 아는 이’가 더 자연스럽고 본문의 의도에 가깝습니다.
- source_word: הַסֵּפֶר הֶחָתוּם
  english_pob_choice: a sealed scroll
  chosen_korean: 봉인된 두루마리
  alternatives_korean:
  - 봉인된 책
  - 닫힌 두루마리
  - 인봉된 두루마리
  lexicon: HALOT
  rationale: סֵפֶר는 고대 문맥에서 ‘두루마리’가 더 정확하고, חָתוּם의 상태를 ‘봉인된’으로 직접 옮겨 접근 불가능함을 분명히 했습니다.
- source_word: לֹא אוּכַל כִּי חָתוּם הוּא
  english_pob_choice: I cannot, because it is sealed
  chosen_korean: 봉인되어 있으므로 읽을 수 없습니다
  alternatives_korean:
  - 봉인되어 있어서 읽을 수 없습니다
  - 읽을 수 없습니다. 봉인되어 있기 때문입니다
  - 봉인되어 있어 못 읽겠습니다
  lexicon: HALOT
  rationale: 직역의 문법을 유지하면서도 한국어에서는 이유절을 자연스럽게 연결해 읽기 어려움을 분명히 했습니다.
theological_decisions:
- issue: 봉인된 두루마리의 비유를 어떻게 처리할 것인가
  chosen_reading: 비유를 풀어 설명하지 않고, 계시가 봉인되어 접근 불가능해진 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 곧바로 ‘하나님의 말씀이 이해되지 않는다’로 의역하기
  - 영적 무지를 해설적으로 덧붙이기
  rationale: 본문의 신학적 힘은 비유 자체에 있으므로, 해석을 과잉 설명하지 않고 독자가 예언적 경고의 날카로움을 직접 보게 했습니다.
  doctrine_reference: Translation philosophy items 1 and 3
