base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the LORD''; that is, they attempt to conceal their plans from him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those who dig deep to conceal a plan from the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 화 있을진저, 야훼에게서 계책을 깊이 숨기려 하고 그들의 행위가 어둠 속에 있으며, “누가 우리를 보며, 누가 우리를 압니까?”라고 말하는 자들이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘야훼에게서’; 곧 그들은 자기들의 계획을 그분에게서 숨기려 합니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼에게서 계획을 숨기려고 깊이 파고드는 자들이여.’
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
