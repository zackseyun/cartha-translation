  lexicon: HALOT
  rationale: עֵצָה를 여기서는 단순한 조언보다 비밀스러운 의도·계책으로 보는 문맥이 강하므로, 숨겨진 도모의 뉘앙스를 살린 ‘계책’을 택했습니다.
- source_word: בְמַחְשָׁךְ מַעֲשֵׂיהֶם
