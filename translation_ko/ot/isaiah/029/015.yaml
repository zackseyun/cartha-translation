  lexicon: HALOT
  rationale: 예언적 경고와 심판 선언의 강한 어조를 표준적인 한국어 예언문 표현으로 살렸습니다.
- source_word: מֵיהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
