  rationale: 본문의 신명 직접 지시를 따라 POB 기본 용례인 ‘야훼’를 유지하고, 출처로부터의 은폐라는 관계를 조사 ‘에게서’로 자연스럽게 나타냈습니다.
- source_word: לַסְתִּר עֵצָה
  english_pob_choice: to hide counsel
  chosen_korean: 계책을 깊이 숨기려
