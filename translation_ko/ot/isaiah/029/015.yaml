  source_fidelity: 개정이 필요합니다. 초안의 ‘계책을 깊이 숨기려’는 ‘깊이’가 히브리어 הַמַּעֲמִיקִים(깊이 파고드는 자들)의 동작이 아니라 ‘숨기다’를 수식하는 듯하여 원문의 이미지와 구문 관계를 흐립니다. ‘깊이 파고들며’로 옮기면 비밀리에 도모한다는 비유를 보존합니다. 또한 מִי ... וּמִי ...는 현재형 질문이므로 ‘보며/아는가’가 적절합니다.
  naturalness: ‘화 있을진저’는 전통 성경체로는 익숙하지만, 요청된 현대 표준어 합쇼체에는 ‘화가 있습니다’가 더 자연스럽습니다. 병렬 구조와 인용문의 연결을 다듬고, 각주 표지를 해당 어구 가까이에 배치했습니다.
  terminology: יהוה는 제공된 POB 방침과 초안의 용례를 따라 ‘야훼’로 유지했습니다. עֵצָה는 문맥상 은밀히 도모하는 내용을 가리키므로 ‘계책’이 가능하며, מַעֲשֵׂיהֶם은 ‘행위’로 유지했습니다.
