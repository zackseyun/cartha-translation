revisions:
- from: 굶주린 사람이 꿈을 꾸며 보니 먹고 있지만, 깨어 보니 그의 속은 비어 있고, 목마른 사람이 꿈을 꾸며 보니 마시고 있지만, 깨어 보니 그는 기진맥진하며 그의 목마름은 여전히 사라지지 않습니다. 이처럼 시온 산을 치러 올라오는 모든 민족의 무리는 그러할 것입니다.[a][b]
  to: 굶주린 사람이 꿈을 꾸는데, 보십시오, 그가 먹고 있습니다. 그러나 깨어나면 그의 배는 비어 있습니다.[a] 또 목마른 사람이 꿈을 꾸는데, 보십시오, 그가 마시고 있습니다. 그러나 깨어나면, 보십시오, 그는 기진맥진해 있고 그의 갈증은 가시지 않습니다.[b] 시온 산을 치러 오는 모든 민족의 무리도 이와 같을 것입니다.
  rationale: 원문의 반복 비교 구조와 세 차례의 הִנֵּה(‘보십시오’)를 살리고, נֶפֶשׁ의 구체적인 욕구 의미를 첫 장면에서는 ‘배’, 둘째 장면에서는 ‘갈증’으로 자연스럽게 드러냈습니다. 원문에 없는 ‘여전히’를 제거했으며, 각주를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:49:04Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 굶주림과 갈증의 꿈이 깨어난 뒤 헛된 것으로 드러나는 핵심 비유와 시온을 공격하는 민족들의 결말을 대체로 전달합니다. 그러나 첫 נַפְשׁוֹ를 ‘그의 속’으로, 둘째를 ‘그의 목마름은 여전히 사라지지 않습니다’로 서로 다르게 처리하여 반복되는 히브리어 נֶפֶשׁ의 대응이 흐려집니다. 또한 ‘여전히’는 원문에 명시되어 있지 않으며, 각주 표지가 해당 어구가 아니라 문장 끝에 함께 놓여 있습니다.
  naturalness: ‘꿈을 꾸며 보니’와 ‘먹고 있지만’은 꿈 장면의 연속성을 표현하려는 의도는 있으나 다소 구어적이고 연결이 매끄럽지 않습니다. ‘꿈을 꾸는데, 보십시오, 그가 먹고 있습니다’와 같은 구조가 반복된 הִנֵּה와 분사 장면을 자연스러운 현대 합쇼체로 재현합니다.
  terminology: נֶפֶשׁ는 이 문맥에서 기술적 의미의 ‘영혼’이라기보다 배고픔·갈증의 욕구를 가리킵니다. 본문에서는 ‘배’와 ‘갈증’으로 문맥화하되, 각주에서 ‘혼’이라는 직역 가능성을 밝혀 모호성을 보존하는 것이 적절합니다. צֹבְאִים עַל은 단순히 올라오는 것이 아니라 시온을 향해 군사 행동을 하는 뜻이므로 ‘시온 산을 치러 오는’이 적합합니다.
