source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
  footnotes:
  - marker: a
    text: Or 'his soul is empty.' Hebrew נֶפֶשׁ often means 'soul,' but here likely refers to the person's appetite or inner craving in the context of hunger and thirst.
    reason: lexical_alternative
  - marker: b
    text: Or 'his soul craves' / 'his throat is parched.' The Hebrew expression emphasizes continuing desire after waking, despite the dream of drinking.
    reason: lexical_alternative
translation:
  language: ko
  text: 굶주린 사람이 꿈을 꾸며 보니 먹고 있지만, 깨어 보니 그의 속은 비어 있고, 목마른 사람이 꿈을 꾸며 보니 마시고 있지만, 깨어 보니 그는 기진맥진하며 그의 목마름은 여전히 사라지지 않습니다. 이처럼 시온 산을 치러 올라오는 모든 민족의 무리는 그러할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 혼은 비어 있다.’ 히브리어 נֶפֶשׁ는 흔히 ‘혼/영혼’을 뜻하지만, 여기서는 허기와 목마름의 문맥에서 욕구와 공허를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 목구멍은 말라 있다.’ 히브리어 표현은 잠에서 깬 뒤에도 계속되는 갈증과 갈망을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / כַּאֲשֶׁר
  english_pob_choice: And it will be as when
  chosen_korean: 굶주린 사람이 꿈을 꾸며 보니
  alternatives_korean:
  - 그럴 것이니, 굶주린 사람이 꿈을 꾸듯
  - 굶주린 사람이 꿈을 꾸는 것처럼
  lexicon: HALOT
  rationale: 예언적 비교문을 자연스러운 현대 한국어로 풀면서도, 결과를 예고하는 העתיד/서술형 구조를 유지했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his appetite
  chosen_korean: 그의 속
  alternatives_korean:
  - 그의 혼
  - 그의 영혼
  - 그의 목마름
  lexicon: HALOT
  rationale: 굶주림·목마름의 문맥에서 נֶפֶשׁ는 형이상학적 ‘영혼’보다 배고픔이 남아 있는 몸의 내적 공허를 가리키므로, 오해를 줄이는 ‘속’으로 옮겼습니다.
- source_word: עָיֵף
  english_pob_choice: he is faint
  chosen_korean: 기진맥진하며
  alternatives_korean:
  - 지쳐 있으며
  - 탈진하며
  lexicon: HALOT
  rationale: 목마름의 결말로서 단순한 피로보다 신체적 탈진을 더 강하게 드러내는 표현을 선택했습니다.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  english_pob_choice: the multitude of all the nations
  chosen_korean: 모든 민족의 무리
  alternatives_korean:
  - 모든 나라들의 무리
  - 모든 민족의 떼
  lexicon: HALOT
  rationale: הֲמוֹן은 단순한 소음보다 집합적 다수를 가리키므로 ‘무리’로 살렸고, גּוֹיִם은 여기서 ‘민족들’로 옮기는 것이 문맥상 가장 자연스럽습니다.
- source_word: הַצֹּבְאִים עַל הַר צִיּוֹן
  english_pob_choice: that wage war against Mount Zion
  chosen_korean: 시온 산을 치러 올라오는
  alternatives_korean:
  - 시온 산을 대적하는
  - 시온 산을 공격하는
  lexicon: HALOT
  rationale: צבא는 군사적으로 ‘대오를 갖추어 치러 오다/진군하다’의 뜻이 있어, 대적의 의도를 분명히 하면서도 군사적 움직임을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 인체·욕구 문맥 번역
  chosen_reading: ‘속’으로 옮겨, 꿈속의 만족이 깨어난 뒤에도 남는 공허를 드러냅니다.
  alternative_readings:
  - 영혼
  - 생명
  - 욕구
  rationale: 이 본문은 인간 존재론을 정의하는 구절이 아니라 갈증과 허기의 비유이므로, ‘영혼’처럼 영적 의미로 고정하지 않고 문맥상 남는 결핍을 보여 주는 번역이 적합합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 시온 산을 향한 적대 행위의 강도
  chosen_reading: ‘시온 산을 치러 올라오는’으로 군사적 적대와 심판의 긴장을 유지합니다.
  alternative_readings:
  - 시온 산을 대적하는
  - 시온 산에 모여드는
  rationale: 단순 집합이 아니라 공격적 진군을 가리키는 문맥이므로, 본문의 경고성을 약화시키지 않도록 군사적 동사를 선택했습니다.
  doctrine_reference: Translation philosophy §2, §5
