    rationale: 첫째는 ‘속’, 둘째는 ‘목마름’으로 처리되어 원문의 반복 및 욕구의 지속이라는 연결이 약해집니다. ‘여전히’는 문맥상 추론될 수 있지만 히브리어에 명시되지 않았으므로 본문에서 제거하는 편이 안전합니다.
