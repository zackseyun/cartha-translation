    rationale: a는 첫 נַפְשׁוֹ(‘그의 배는 비어 있습니다’)에, b는 둘째 נַפְשׁוֹ שׁוֹקֵקָה(‘그의 갈증은 가시지 않습니다’)에 각각 붙어야 합니다.
