  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/אָבָ֥ק דַּ֖ק הֲמ֣וֹן זָרָ֑יִ/ךְ וּ/כְ/מֹ֤ץ עֹבֵר֙ הֲמ֣וֹן עָֽרִיצִ֔ים וְ/הָיָ֖ה לְ/פֶ֥תַע פִּתְאֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
  footnotes:
  - marker: a
    text: Or 'your foreigners.' The Hebrew term can denote strangers or foreign outsiders; in context they are hostile invaders.
    reason: lexical_alternative
  - marker: b
    text: Or 'like chaff that passes away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너의 낯선 자들의 무리는 고운 먼지처럼 되고, 너의 포악한 자들의 무리는 지나가는 겨처럼 될 것이며, 그것은 갑자기, 순식간에 일어날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זָרָיִךְ는 문자적으로 ‘너의 낯선 자들/외국인들’을 뜻할 수 있습니다. 문맥상 여기서는 적대적 침입자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פִּתְאֹם과 לְפֶתַע가 함께 쓰여 급작스러움을 강조합니다. 따라서 ‘갑자기, 순식간에’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמוֹן זָרָיִךְ
  english_pob_choice: your strangers
  chosen_korean: 너의 낯선 자들의 무리
  alternatives_korean:
  - 너의 외국인들의 무리
  - 너의 이방인들의 무리
  - 너의 낯선 자들
  lexicon: HALOT
  rationale: זָרָיִךְ는 문자적으로 ‘너의 낯선/외국인들’이므로, 문맥의 적대적 뉘앙스를 살리되 ‘적들’로 과잉 해석하지 않기 위해 ‘낯선 자들’과 ‘무리’를 함께 살렸습니다.
- source_word: כְּאָבָק דַּק
  english_pob_choice: like fine dust
  chosen_korean: 고운 먼지처럼
  alternatives_korean:
  - 가는 먼지처럼
  - 미세한 먼지처럼
  - 고운 티끌처럼
  lexicon: HALOT
  rationale: אָבָק은 ‘먼지’, דַּק은 ‘가늘고 고운’의 뜻이므로, 한국어로는 자연스러운 비유인 ‘고운 먼지처럼’이 원문의 소멸 이미지와 잘 맞습니다.
- source_word: עָרִיצִים
  english_pob_choice: the ruthless
  chosen_korean: 포악한 자들
  alternatives_korean:
  - 압제자들
  - 잔혹한 자들
  - 잔인한 자들
  lexicon: HALOT
  rationale: עָרִיץ는 폭력적이고 억압적인 자들을 가리키므로, ‘포악한 자들’이 현대 한국어에서 그 성격을 분명히 드러냅니다.
- source_word: כְּמֹץ עֹבֵר
  english_pob_choice: like passing chaff
  chosen_korean: 지나가는 겨처럼
  alternatives_korean:
  - 날아가는 겨처럼
  - 사라지는 겨처럼
  - 지나가는 쭉정이처럼
  lexicon: HALOT
  rationale: מֹץ는 탈곡 후 남는 ‘겨’이고, עֹבֵר는 ‘지나가는’의 현재분사적 움직임을 담으므로, ‘지나가는 겨처럼’이 이미지를 간결하게 전달합니다.
- source_word: לְפֶתַע פִּתְאֹם
  english_pob_choice: suddenly, in an instant
  chosen_korean: 갑자기, 순식간에
  alternatives_korean:
  - 문득, 한순간에
  - 갑자기, 한순간에
  - 순식간에, 갑자기
  lexicon: HALOT
  rationale: 두 부사가 겹쳐 급작스러움을 강조하므로, 한국어에서도 둘 다 살려 ‘갑자기, 순식간에’로 옮겼습니다.
theological_decisions:
- issue: 직접적인 심판 비유의 강도 보존
  chosen_reading: 침략자들을 ‘먼지’와 ‘겨’로 붕괴시키는 예언적 심판 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완화하여 ‘사라질 것입니다’로 옮김
  - 해석을 덧붙여 ‘패배할 것입니다’로 옮김
  rationale: 이 절은 적대 세력의 급속한 소멸을 감각적으로 그리는 본문이므로, 비유의 물질적·즉각적 파괴성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 예언서의 심판 선포와 하나님의 주권적 개입
- issue: ‘낯선 자들’의 의미 범위 유지
  chosen_reading: ‘낯선 자들’로 두어 외국인/이방인/침입자 가능성을 문맥에 맡겼습니다.
  alternative_readings:
  - ‘외국인들’로 한정
  - ‘적들’로 해석
  rationale: 히브리어 זָר는 기본적으로 낯선/외부의 사람을 뜻하므로, 본문이 허용하는 범위를 보존하는 편이 더 원문에 충실합니다.
  doctrine_reference: 원어 어휘의 의미 범위 보존
