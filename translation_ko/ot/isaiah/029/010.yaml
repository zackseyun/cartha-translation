id: ISA.29.10
reference: Isaiah 29:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
  footnotes:
  - marker: a
    text: Or 'a spirit of stupor.' The Hebrew term can denote deep sleep or a stupefying torpor.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew syntax likely identifies ''the prophets'' with ''your eyes'' and ''the seers'' with ''your heads''; alternatively, some take them as separate objects: ''He has shut the prophets and covered your heads, the seers.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼께서 여러분 위에 깊은 잠의 영을 부으시고, 여러분의 눈, 곧 예언자들을 막으시며, 여러분의 머리들, 곧 선견자들을 가리셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼미의 영’. 히브리어 표현은 깊은 잠이나 사람을 멍하게 만드는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 문법상 ‘예언자들’은 ‘여러분의 눈’, ‘선견자들’은 ‘여러분의 머리들’과 동격으로 설명될 가능성이 큽니다. 다른 분석에서는 ‘예언자들’과 ‘여러분의 머리들, 곧 선견자들’을 각각 동사의 별도 목적어로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָסַךְ
  english_pob_choice: has poured out
  chosen_korean: 부어 주시고
  alternatives_korean:
  - 부으시고
  - 쏟아 부으시고
  lexicon: HALOT
  rationale: 제사의 부음/쏟음 이미지와 하나님의 주도적 행위를 함께 살리기 위해 ‘부어 주시고’로 옮겼습니다.
- source_word: רוּחַ תַּרְדֵּמָה
  english_pob_choice: a spirit of deep sleep
  chosen_korean: 깊은 잠의 영
  alternatives_korean:
  - 깊은 잠의 영
  - 무기력의 영
  - 혼미의 영
  lexicon: HALOT
  rationale: ‘רוּחַ’의 영적·내적 주입을 살리되, ‘תַּרְדֵּמָה’의 직접 의미를 가장 가까이 반영하는 표현으로 ‘깊은 잠’을 택했습니다.
- source_word: וַיְעַצֵּם
  english_pob_choice: has shut
  chosen_korean: 막으시며
  alternatives_korean:
  - 닫으시며
  - 감추시며
  - 봉하셨으며
  lexicon: HALOT
  rationale: 눈에 대한 동사로서 ‘닫다’보다 시력을 차단하는 결과를 더 분명히 드러내는 ‘막다’를 선택했습니다.
- source_word: הַנְּבִיאִים / הַחֹזִים
  english_pob_choice: the prophets / the seers
  chosen_korean: 예언자들 / 선견자들
  alternatives_korean:
  - 선지자들 / 보는 자들
  - 예언자들 / 환상가들
  lexicon: HALOT
  rationale: 히브리어의 평행 구조를 유지하면서, ‘נביאים’과 구별되는 ‘חזים’의 시각적 뉘앙스를 한국어에서 ‘선견자들’로 살렸습니다.
- source_word: רָאשֵׁיכֶם
  english_pob_choice: your heads
  chosen_korean: 머리
  alternatives_korean:
  - 우두머리
  - 지도자들
  lexicon: HALOT
  rationale: 본문은 ‘머리’와 ‘선견자들’을 나란히 두는 난해한 구조이므로, 해석으로 풀기보다 원문 이미지를 보존했습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 행위 표현
  chosen_reading: 하나님이 허용하신 상태가 아니라 야훼께서 직접 ‘부어 주시고’ ‘막으시며’ ‘가리셨다’는 서술을 유지했습니다.
  alternative_readings:
  - 허용적 표현으로 완화하기
  - 사역적 결과만 말하기
  rationale: 히브리어 동사들이 하나님의 능동적 행위를 직접 귀속하므로, 심판적 긴장을 완화하지 않고 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: ‘눈/머리’와 ‘예언자들/선견자들’의 관계
  chosen_reading: ‘예언자들’과 ‘선견자들’을 각각 ‘눈’과 ‘머리’의 동격 설명으로 처리했습니다.
  alternative_readings:
  - 독립 목적어로 처리하기
  - 비유를 풀어 ‘지도자들’로 의역하기
  rationale: 이렇게 해야 문법적 연결과 병행법이 가장 자연스럽고, 이스라엘의 영적 시력을 담당해야 할 자들이 실제로는 차단되었다는 풍자가 선명해집니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
