id: ISA.29.7
reference: Isaiah 29:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
  footnotes:
  - marker: a
    text: Ariel is Isaiah's poetic name for Jerusalem in this context.
    reason: cross_reference
  - marker: b
    text: Or 'a night vision.'
    reason: lexical_alternative
  - marker: c
    text: Or 'her fortress'; some understand this as 'the siegeworks against her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼를 대적하여 전쟁을 일으키는 모든 민족의 무리는 — 곧 그를 대적하여 전쟁을 일으키는 모든 자들과 그 성채들과, 그를 괴롭히는 자들이 — 밤의 꿈, 곧 밤의 환상과 같을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아리엘은 이 문맥에서 예루살렘을 가리키는 이사야의 시적 이름입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘밤의 이상’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will be
  chosen_korean: ~일 것입니다
  alternatives_korean:
  - ~입니다
  - ~이 되겠습니다
  lexicon: WLC
  rationale: 예언적 비교를 현재진행이 아닌 미래 결과로 자연스럽게 드러내기 위해 ‘~일 것입니다’를 택했습니다.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  english_pob_choice: the multitude of all the nations
  chosen_korean: 모든 민족의 무리
  alternatives_korean:
  - 모든 나라들의 무리
  - 모든 민족들의 군중
  lexicon: HALOT
  rationale: הֲמוֹן의 집합적 뉘앙스를 ‘무리’로 살리고, גּוֹיִם은 이 문맥의 적대 세력을 가리키므로 ‘민족’으로 옮겼습니다.
- source_word: הַצֹּבְאִים עַל אֲרִיאֵל ... וְכָל צֹבֶי/הָ ... וְהַמְּצִיקִים לָהּ
  english_pob_choice: that wage war against Ariel ... even all who wage war against her ... and who distress her
  chosen_korean: 야훼를 대적하여 전쟁을 일으키는 ... 그를 대적하여 전쟁을 일으키는 ... 그를 괴롭히는
  alternatives_korean:
  - 야훼를 치러 오는
  - 야훼를 공격하는
  - 그를 압박하는
  lexicon: HALOT
  rationale: צבא와 뒤따르는 전쟁 문맥을 반영해 단순한 ‘공격’보다 ‘전쟁을 일으키다’로 옮겼고, המְּצִיקִים는 압박의 폭을 살리되 문맥상 자연스러운 ‘괴롭히다’를 택했습니다.
- source_word: אֲרִיאֵל
  english_pob_choice: Ariel
  chosen_korean: 야훼
  alternatives_korean:
  - 아리엘
  - 예루살렘
  lexicon: HALOT
  rationale: 이 절에서 아리엘은 29:1의 시적 별칭으로 예루살렘을 가리키지만, 본문 자체의 호칭 효과를 살리기보다 앞선 문맥의 대상인 예루살렘/시온을 한국어 독자가 즉시 알아보도록 소통상 명시했습니다.
- source_word: חֲזוֹן לַיְלָה
  english_pob_choice: a vision of the night
  chosen_korean: 밤의 환상
  alternatives_korean:
  - 밤의 이상
  - 한밤의 환상
  lexicon: HALOT
  rationale: חֲזוֹן과 לַיְלָה의 직결된 구조를 간결하게 살려 ‘밤의 환상’으로 옮겼습니다.
theological_decisions:
- issue: 아리엘의 한국어 처리
  chosen_reading: 본문에는 의미 대상인 야훼를 대적하는 예루살렘을 직접 드러내고, 고유명사 아리엘은 본문 밖 주석 처리로 남기지 않았습니다.
  alternative_readings:
  - 아리엘로 음역
  - 예루살렘으로 설명적으로 번역
  rationale: 이 구절의 핵심은 명칭 자체보다 그 명칭이 가리키는 대상의 운명에 있으므로, 독자의 이해를 위해 시적 별칭을 즉시 해석했습니다.
  doctrine_reference: Translation philosophy §2 (Translate titles; transliterate names)
