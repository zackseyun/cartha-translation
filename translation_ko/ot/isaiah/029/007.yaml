revisions:
- from: 그리고 야훼를 대적하여 전쟁을 일으키는 모든 민족의 무리는 — 곧 그를 대적하여 전쟁을 일으키는 모든 자들과 그 성채들과, 그를 괴롭히는 자들이 — 밤의 꿈, 곧 밤의 환상과 같을 것입니다.[a][b]
  to: 아리엘[a]을 상대로 싸우는 모든 민족의 무리는, 곧 아리엘을 상대로 싸우고 그 성채[c]를 공격하며 아리엘을 괴롭히는 모든 자들은, 밤의 꿈, 곧 밤의 환상[b]과 같을 것입니다.
  rationale: 원문의 고유명사 아리엘을 회복하고, 아리엘을 향한 전쟁·성채 공격·괴롭힘이라는 세 참여 분사를 한국어에서 병렬로 드러냈습니다. ‘아리엘을’의 반복은 한국어 대명사의 성별 및 선행사 모호성을 피하면서 원문의 여성 접미사가 가리키는 대상을 명확히 합니다. 원문의 시적 비교인 ‘꿈, 밤의 환상’을 유지했고, 관련 어휘 대안은 각주 앵커와 함께 보완했습니다.
  reviewer_model: gpt-5.6-terra
