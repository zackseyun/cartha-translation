  source_fidelity: 원문의 אֲרִיאֵל(아리엘)을 ‘야훼’로 바꾼 것은 고유명사와 지시 대상을 모두 변경한 중대한 오류입니다. 또한 여성 단수 접미사는 아리엘을 가리키며, מְצֹדָתָהּ는 아리엘의 성채를 뜻합니다. 이를 반영해 군사적 적대와 꿈/밤의 환상이라는 비교를 유지했습니다.
  naturalness: ‘아리엘을 상대로 싸우는’, ‘성채를 공격하며’, ‘밤의 꿈, 곧 밤의 환상’은 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. 주어가 길지만 원문의 삽입적 열거 구조를 쉼표와 ‘곧’으로 명료하게 처리했습니다.
  terminology: אֲרִיאֵל은 번역 철학과 원문에 따라 ‘아리엘’로 음역했습니다. חֲזוֹן לַיְלָה는 ‘밤의 환상’으로, מְצוֹדָה는 ‘성채’로 옮기고, 대안적 해석은 각주에 보존했습니다.
