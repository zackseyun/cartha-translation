id: ISA.29.17
reference: Isaiah 29:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לוֹא עוֹד֙ מְעַ֣ט מִזְעָ֔ר וְ/שָׁ֥ב לְבָנ֖וֹן לַ/כַּרְמֶ֑ל וְ/הַ/כַּרְמֶ֖ל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
  footnotes:
  - marker: a
    text: Or 'fruitful field' for 'orchard' (כַּרְמֶל). The Hebrew denotes fertile, cultivated land; 'orchard' is chosen to preserve the contrast with 'forest' in vivid modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: “아직 매우 조금만 있으면, 레바논이 과수원이 되고, 과수원은 숲으로 여겨질 것입니다?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Is it not
  chosen_korean: “... ... ?”의 반문으로 처리하여 “...이지 않습니까?”의 힘을 살림
  alternatives_korean:
  - “과연”
  - “참으로”
  lexicon: HALOT
  rationale: 히브리어 הֲלוֹא는 단순 진술이 아니라 대답을 기대하는 반문이므로, 한국어에서도 의문형을 유지해 청자의 동의를 촉구하는 힘을 보존했습니다.
- source_word: עוֹד מְעַט מִזְעָר
  english_pob_choice: yet a very little while
  chosen_korean: “아직 매우 조금만 있으면”
  alternatives_korean:
  - “조금만 더 있으면”
  - “얼마 안 있어”
  lexicon: HALOT
  rationale: עוֹד의 ‘아직/더’, מְעַט의 ‘작은 정도’, מִזְעָר의 강조를 함께 살려, 시간의 짧음이 중첩되어 드러나도록 옮겼습니다.
- source_word: וְשָׁב
  english_pob_choice: will turn into
  chosen_korean: “...이 되고”
  alternatives_korean:
  - “...로 변하고”
  - “...가 되어”
  lexicon: HALOT
  rationale: שׁוּב가 여기서는 상태 변화의 관용적 용법으로 쓰이므로, 직역적인 ‘돌아오다’보다 변형 결과를 자연스럽게 드러내는 ‘되다’ 계열로 옮겼습니다.
- source_word: כַּרְמֶל
  english_pob_choice: orchard
  chosen_korean: “과수원”
  alternatives_korean:
  - “기름진 들”
  - “열매 맺는 땅”
  lexicon: HALOT
  rationale: כַּרְמֶל은 고유명사가 아니라 기름지고 재배된 땅을 뜻하므로, ‘forest’와의 대조를 살릴 수 있는 현대적이고 구체적인 ‘과수원’을 채택했습니다.
- source_word: לַיַּעַר
  english_pob_choice: as a forest
  chosen_korean: “숲으로”
  alternatives_korean:
  - “숲으로 여겨져”
  - “숲처럼”
  lexicon: HALOT
  rationale: יַּעַר은 ‘숲/삼림’이며, יֵחָשֵׁב과 결합해 평가적 분류를 이루므로 결과 상태를 드러내는 ‘숲으로 여겨질’의 구조를 취했습니다.
- source_word: יֵחָשֵׁב
  english_pob_choice: will be regarded
  chosen_korean: “여겨질 것입니다”
  alternatives_korean:
  - “간주될 것입니다”
  - “חשב되실 것입니다”
  lexicon: HALOT
  rationale: נִפעל형 חשב는 ‘간주되다, 여겨지다’의 뜻이므로, 현대 한국어에서 자연스럽고 수동적 평가 뉘앙스를 살리는 ‘여겨질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 변화의 수준
  chosen_reading: 이 구절은 땅의 상태가 극적으로 뒤바뀌는 예언적 역전을 선포하지만, 그 변화가 문자적 농업 변화인지 상징적·영적 회복인지 단정하지 않고 이미지 자체를 보존했습니다.
  alternative_readings:
  - 문자적 농업 풍요의 회복
  - 사회적·영적 상태의 비유적 역전
  rationale: 히브리어 본문은 뒤집힘과 새로움을 분명히 말하지만, 참조 수준을 하나로 고정하지 않으므로 번역은 해석을 과잉 확정하지 않아야 합니다.
  doctrine_reference: 예언 이미지의 긴장 보존
