language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמְע֧וּ בַ/יּוֹם הַ/ה֛וּא הַ/חֵרְשִׁ֖ים דִּבְרֵי סֵ֑פֶר וּ/מֵ/אֹ֣פֶל וּ/מֵ/חֹ֔שֶׁךְ עֵינֵ֥י עִוְרִ֖ים תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
  footnotes:
  - marker: a
    text: Or 'the words of the scroll' or 'the words of a document'; Hebrew sefer can refer broadly to a written text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 귀먹은 이들이 책[a]의 말을 들을 것이며, 캄캄함과 어둠 속에서 눈먼 이들의 눈이 볼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리의 말’ 또는 ‘문서의 말’일 수 있습니다. 히브리어 סֵפֶר은 넓게 기록된 글을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  english_pob_choice: will hear
  chosen_korean: 들을 것이며
  alternatives_korean:
  - 들을 것입니다
  - 듣게 될 것입니다
  lexicon: HALOT
  rationale: 예언 문맥의 미래적 약속을 자연스러운 합쇼체로 옮기되, 앞절과의 병렬을 살려 연결형으로 처리했습니다.
- source_word: הַחֵרְשִׁים
  english_pob_choice: the deaf
  chosen_korean: 귀먹은 이들
  alternatives_korean:
  - 농아들
  - 귀가 들리지 않는 이들
  lexicon: HALOT
  rationale: 히브리어의 실체적 형용사를 사람을 가리키는 표현으로 살리면서, 한국어에서 가장 직접적인 감각 상실 표현을 택했습니다.
- source_word: דִּבְרֵי סֵפֶר
  english_pob_choice: the words of a book
  chosen_korean: 책의 말
  alternatives_korean:
  - 두루마리의 말
  - 문서의 말
  lexicon: HALOT
  rationale: סֵפֶר가 책, 두루마리, 문서를 넓게 가리킬 수 있으므로, 본문은 일반적인 ‘책’으로 두되 각주는 대안을 남겨 원문 범위를 보존했습니다.
- source_word: עֵינֵי עִוְרִים תִּרְאֶינָה
  english_pob_choice: the eyes of the blind will see
  chosen_korean: 눈먼 이들의 눈이 볼 것입니다
  alternatives_korean:
  - 맹인의 눈이 볼 것입니다
  - 눈먼 이들의 눈이 보게 될 것입니다
  lexicon: HALOT
  rationale: ‘눈’이 주어가 되어 ‘보다’가 병행되는 히브리어 이미지를 유지했고, 한국어에서는 중복을 허용해 원문의 시적 평행을 살렸습니다.
theological_decisions:
- issue: 이 예언을 육체적 치유로만 또는 영적 통찰로만 제한할지 여부
  chosen_reading: 구체적인 감각 언어(귀먹은 이들, 눈먼 이들, 듣다, 보다)를 그대로 유지해 두 의미 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - 영적 이해와 깨달음으로 더 노골적으로 의역함
  - 육체적 치유만을 가리키는 표현으로 한정함
  rationale: 이사야 문맥에서는 문자적 회복 이미지가 종종 영적 회복을 함께 암시하므로, 번역이 해석을 과도하게 결정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
