id: ISA.29.1
reference: Isaiah 29:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֚וֹי אֲרִיאֵ֣ל אֲרִיאֵ֔ל קִרְיַ֖ת חָנָ֣ה דָוִ֑ד סְפ֥וּ שָׁנָ֛ה עַל שָׁנָ֖ה חַגִּ֥ים יִנְקֹֽפוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
  footnotes:
  - marker: a
    text: Ariel is a name for Jerusalem here; the Hebrew may also echo 'altar hearth' or 'lion of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 아리엘이여, 아리엘이여, 다윗이 진을 쳤던 성읍이여! 해마다 더하고, 절기들이 차례로 돌아가게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아리엘은 여기서 예루살렘을 가리키는 이름입니다. 히브리어는 또한 ‘제단 화로’ 또는 ‘하나님의 사자’의 뉘앙스를 반향할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֚וֹי
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 슬프다
  - 화 있을진저
  lexicon: HALOT
  rationale: 이 감탄사는 단순한 저주보다 주의를 끌거나 탄식을 여는 기능도 있어, POB의 'Ah'에 맞춰 한국어에서도 직접적인 감탄 '아'로 옮겨 과도한 해석을 피했습니다.
- source_word: אֲרִיאֵל
  english_pob_choice: Ariel
  chosen_korean: 아리엘
  alternatives_korean:
  - 제단 화로
  - 하나님의 사자
  - 사자성
  lexicon: HALOT
  rationale: 본문에서는 예루살렘을 가리키는 지명/호칭으로 쓰이며, 동시에 말장난 가능성을 지니므로 의미로 풀지 않고 음역을 유지했습니다.
- source_word: קִרְיַת חָנָה דָוִד
  english_pob_choice: the city where David encamped
  chosen_korean: 다윗이 진을 쳤던 성읍
  alternatives_korean:
  - 다윗이 거하던 성읍
  - 다윗이 머물렀던 성읍
  lexicon: HALOT
  rationale: חָנָה는 단순 거주보다 군사적 '진침'의 뉘앙스가 있어, 다윗이 예루살렘을 점유하고 정착시킨 역사적 배경을 살려 '진을 쳤던'으로 옮겼습니다.
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  english_pob_choice: Add year to year
  chosen_korean: 해마다 더하고
  alternatives_korean:
  - 해를 더하고
  - 한 해 한 해 더하고
  lexicon: HALOT
  rationale: 히브리어의 간결한 명령형과 반복 표현을 살려, 자연스러운 한국어로 '해마다 더하고'라고 옮겼습니다.
- source_word: חַגִּים יִנְקֹפוּ
  english_pob_choice: let the feasts run their round
  chosen_korean: 절기들이 차례로 돌아가게 하십시오
  alternatives_korean:
  - 절기들이 순환하게 하십시오
  - 절기들이 돌고 돌게 하십시오
  lexicon: HALOT
  rationale: יִנְקֹפוּ의 순환/회전을 한국어 관용에 맞춰 '차례로 돌아가다'로 풀어, 연례 절기의 반복성을 드러냈습니다.
theological_decisions:
- issue: אֲרִיאֵל의 의미를 본문에서 풀지 않고 음역으로 둘지 여부
  chosen_reading: 본문에서는 '아리엘'을 지명/호칭으로 유지하고, 잠재적 의미는 본문 밖에 두는 방식이 적절합니다.
  alternative_readings:
  - 제단 화로로 번역
  - 하나님의 사자로 번역
  rationale: 직접 문맥이 예루살렘을 가리키고 있어 의미 번역은 본문의 수사적 중첩과 말장난을 지워버릴 수 있습니다. 음역은 다층적 의미를 보존합니다.
  doctrine_reference: '번역 원칙: 이름은 음역하고, 뜻은 필요할 때 각주로 보존한다.'
