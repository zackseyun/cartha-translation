translation:
  language: ko
  text: 마음이 그릇된 길로 헤매던 이들은 분별력을 얻게 될 것이며, 불평하던 이들은 교훈을 배우게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 잘못된 이들’
    reason: lexical_alternative
