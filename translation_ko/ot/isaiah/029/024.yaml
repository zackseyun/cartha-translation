base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
  footnotes:
  - marker: a
    text: Or 'those who err in spirit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those who grumble will learn teaching.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 영이 잘못된 자들은 깨닫게 될 것이며, 중얼거리는 자들은 교훈을 배우게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 잘못된 자들’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘중얼거리는 자들은 가르침을 배우게 될 것입니다’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ תֹעֵי רוּחַ בִּינָה
  english_pob_choice: will come to understanding
  chosen_korean: 깨닫게 될 것입니다
  alternatives_korean:
  - 알게 될 것입니다
  - 이해하게 될 것입니다
  lexicon: HALOT
  rationale: יָדַע는 문자적으로 ‘알다’이지만, בִּינָה(이해/분별)와 함께 쓰여 결과적으로 이해에 이르는 뜻이므로 한국어도 ‘깨닫게 될 것입니다’로 자연스럽게 옮겼습니다.
- source_word: תֹעֵי רוּחַ
  english_pob_choice: those who go astray in spirit
  chosen_korean: 영이 잘못된 자들
  alternatives_korean:
  - 영이 방황하는 자들
  - 영에서 벗어난 자들
  - 영이 어긋난 자들
  lexicon: HALOT
  rationale: תֹעֵי는 ‘길을 잘못 들다/벗어나다’는 의미를 살렸고, רוּחַ는 여기서 성령이 아니라 사람의 내적 성향을 가리키므로 ‘영’으로 두어 의미의 긴장을 보존했습니다.
- source_word: וְרוֹגְנִים
  english_pob_choice: those who grumble
  chosen_korean: 중얼거리는 자들
  alternatives_korean:
  - 불평하는 자들
  - 투덜거리는 자들
  - 원망하는 자들
  lexicon: HALOT
  rationale: רגן은 불평하며 중얼거리는 태도를 가리키므로, 현대 한국어에서 그 소리를 살리는 ‘중얼거리는 자들’이 원문의 거슬림과 반항적 뉘앙스를 잘 드러냅니다.
- source_word: לֶקַח
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 가르침
  - 훈계
  - instruction
  lexicon: HALOT
  rationale: לֶקַח은 지혜 문맥에서 ‘배워 받아들이는 가르침’에 가깝기 때문에, ‘배우게 될 것입니다’와 함께 자연스럽게 어울리는 ‘교훈’을 선택했습니다.
theological_decisions:
- issue: רוּחַ의 의미 범위
  chosen_reading: 사람의 내적 성향/마음 상태를 가리키는 ‘영’으로 읽었습니다.
  alternative_readings:
  - 바람으로 읽는 해석
  - 성령으로 읽는 해석
  rationale: 문맥상 지적·도덕적 회복을 말하므로, 성령이나 바람을 본문에 과도하게 들여오지 않고 인간의 내적 방향성을 가리키는 표현을 유지했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 교리적 확정은 피하고, 본문이 허용하는 긴장을 보존합니다.
