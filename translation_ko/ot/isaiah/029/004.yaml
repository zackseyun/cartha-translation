  rationale: 원문의 땅/티끌의 평행과 낮고 가느다란 음성의 비유를 유지하되, 비자연스러운 한국어 서술을 현대 합쇼체로 바로잡았습니다. אוֹב의 의미 범위를 본문에서 부당하게 좁히지 않고, 본문은 ‘영매’로, 가능한 대안은 해당 어휘에 연결한 각주로 처리했습니다.
