revisions:
- from: 그러면 네가 낮아져서 땅에서 말하고, 티끌에서 네 말이 낮게 되겠습니다. 네 음성은 땅에서 올라오는 무당의 음성 같고, 티끌에서 네 말은 지저귈 것입니다.[a]
