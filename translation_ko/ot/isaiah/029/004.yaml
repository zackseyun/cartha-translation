id: ISA.29.4
reference: Isaiah 29:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַלְתְּ֙ מֵ/אֶ֣רֶץ תְּדַבֵּ֔רִי וּ/מֵֽ/עָפָ֖ר תִּשַּׁ֣ח אִמְרָתֵ֑/ךְ וְֽ֠/הָיָה כְּ/א֤וֹב מֵ/אֶ֨רֶץ֙ קוֹלֵ֔/ךְ וּ/מֵ/עָפָ֖ר אִמְרָתֵ֥/ךְ תְּצַפְצֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
  footnotes:
  - marker: a
    text: Or 'like a ghostly voice' or 'like a necromancer'; the Hebrew אוֹב is associated with a medium and the faint voice linked to necromancy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 네가 낮아져서 땅에서 말하고, 티끌에서 네 말이 낮게 되겠습니다. 네 음성은 땅에서 올라오는 무당의 음성 같고, 티끌에서 네 말은 지저귈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영매의 소리처럼’ 혹은 ‘강신술사의 소리처럼’. 히브리어 אוֹב는 무당/영매와 연관되며, 여기서는 그와 같은 희미하고 기이한 음성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  english_pob_choice: Then you will be brought low
  chosen_korean: 그러면 네가 낮아져서
  alternatives_korean:
  - 그러면 네가 겸손해져서
  - 그러면 네가 낮추어져서
  - 그러면 네가 낮게 되어서
  lexicon: HALOT
  rationale: שׁפל의 핵심은 낮아짐/비천해짐이며, 심판 맥락에서 자연스럽게 ‘낮아져서’로 옮겼습니다.
- source_word: מֵאֶרֶץ / מֵעָפָר
  english_pob_choice: from the earth / from the dust
  chosen_korean: 땅에서 / 티끌에서
  alternatives_korean:
  - 땅으로부터 / 먼지에서
  - 땅에서 / 흙에서
  lexicon: HALOT
  rationale: 히브리어의 평행 구조를 살리면서, 지면과 미세한 티끌의 대비가 한국어로도 바로 느껴지도록 ‘땅’과 ‘티끌’을 대응시켰습니다.
- source_word: תִּשַּׁח אִמְרָתֵךְ
  english_pob_choice: your speech will be low
  chosen_korean: 네 말이 낮게 되겠습니다
  alternatives_korean:
  - 네 말이 낮아지겠습니다
  - 네 말이 낮은 소리가 되겠습니다
  - 네 말이 속삭이게 되겠습니다
  lexicon: HALOT
  rationale: תשׁח의 난해함을 과도하게 해석하지 않고, POB의 ‘low’에 맞춰 음성의 미약함을 드러내는 ‘낮게 되겠습니다’로 옮겼습니다.
- source_word: כְּאוֹב
  english_pob_choice: like that of a medium
  chosen_korean: 무당의 음성 같고
  alternatives_korean:
  - 접신한 자의 음성 같고
  - 무당 같은 음성 같고
  - 주술사의 음성 같고
  lexicon: HALOT
  rationale: אוֹב는 금지된 강신/무속적 매체를 가리키므로, 한국어 독자에게 즉시 연결되는 ‘무당’으로 옮겨 사전적 의미와 어감의 긴장을 함께 살렸습니다.
- source_word: תְּצַפְצֵף
  english_pob_choice: will chirp
  chosen_korean: 지저귈 것입니다
  alternatives_korean:
  - 짹짹거릴 것입니다
  - 삑삑거릴 것입니다
  - 새소리처럼 낼 것입니다
  lexicon: HALOT
  rationale: 짧고 가는 소리를 나타내는 צפצף의 음성적 효과를 한국어의 ‘지저귐’으로 살렸습니다.
theological_decisions:
- issue: אוֹב를 한국어로 어떻게 옮길지
  chosen_reading: ‘무당’으로 옮기되, 문맥상 심판의 비유로 읽히도록 본문 안에서는 별도 해설을 붙이지 않았습니다.
  alternative_readings:
  - medium(매개자)
  - 영매
  - 강신술사
  rationale: 예언적 조롱의 문맥에서 한국어 독자가 즉시 알아들을 수 있는 표현이 필요했습니다. 다만 과도한 설명으로 본문의 날카로운 비유를 약화시키지 않도록 간결하게 유지했습니다.
  doctrine_reference: Translation philosophy §3 (의도된 긴장 보존)
- issue: 2인칭 단수 여성형과 직설적 심판 어조
  chosen_reading: 한국어에서도 직접적인 2인칭 심판 선언을 유지했습니다.
  alternative_readings:
  - 그녀는
  - 네가
  rationale: 히브리어의 여성 단수 호격을 한국어 문법에 맞게 ‘네가’로 처리하여, 아리엘/시온을 향한 직접 경고의 긴장을 보존했습니다.
  doctrine_reference: '문체 지침: 원문 화자-수신자 관계 보존'
