  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חָנִ֥יתִי כַ/דּ֖וּר עָלָ֑יִ/ךְ וְ/צַרְתִּ֤י עָלַ֨יִ/ךְ֙ מֻצָּ֔ב וַ/הֲקִֽימֹתִ֥י עָלַ֖יִ/ךְ מְצֻרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
  footnotes:
  - marker: a
    text: Or 'like a circle' or 'as a ring' for 'all around.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a garrison' or 'a siege post' for 'siegeworks.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may refer more broadly to siege fortifications; alternatives include 'siege bulwarks' or 'siege ramps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 사방으로 너를 진 치고, 공성전용 토목 구조물로 너를 에워싸며, 너를 향해 포위탑들을 세우겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사방으로’는 ‘원처럼’ 또는 ‘고리처럼’의 뜻을 풀어 옮긴 것입니다.
    reason: alternative_reading
  - marker: b
    text: ‘공성전용 토목 구조물’은 ‘주둔 병력’ 또는 ‘공성 주둔지’로도 볼 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 여기서 히브리어는 더 넓게는 공성 방벽이나 공성 제방을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָנִ֥יתִי כַ/דּ֖וּר
  english_pob_choice: And I will encamp against you all around
  chosen_korean: 내가 사방으로 너를 진 치고
  alternatives_korean:
  - 내가 너를 둘러 진 치고
  - 내가 원형으로 너를 진 치고
  lexicon: HALOT
  rationale: חנה의 군사적 의미를 살려 ‘진 치다’로 옮기고, כַּדּוּר의 둘러싸는 뜻은 ‘사방으로’로 자연스럽게 풀어 한국어 독자가 포위의 이미지를 바로 이해하게 했습니다.
- source_word: וְצַרְתִּ֤י ... מֻצָּ֔ב
  english_pob_choice: and I will besiege you with siegeworks
  chosen_korean: 공성전용 토목 구조물로 너를 에워싸며
  alternatives_korean:
  - 공성 진지로 너를 에워싸며
  - 포위 시설로 너를 에워싸며
  lexicon: HALOT
  rationale: צור의 포위·공성 의미를 ‘에워싸다’로 살리고, מֻצָּב은 단순한 ‘주둔’보다 성읍을 포위하는 군사 공사물이라는 점을 드러내기 위해 기능 설명형으로 옮겼습니다.
- source_word: וַ/הֲקִימֹתִ֥י ... מְצֻרֹֽת
  english_pob_choice: and I will raise up siege towers against you
  chosen_korean: 너를 향해 포위탑들을 세우겠습니다
  alternatives_korean:
  - 너를 향해 공성탑들을 세우겠습니다
  - 너를 향해 포위 시설들을 세우겠습니다
  lexicon: HALOT
  rationale: מְצֻרוֹת의 정확한 공성기구 명칭은 문맥상 넓을 수 있으나, POB의 ‘siege towers’를 반영해 가장 직관적인 ‘포위탑’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 1인칭 공성 선언
  chosen_reading: 본문의 1인칭 동사들을 그대로 살려, 하나님이 직접 진 치고 포위하고 세우시는 분으로 표현했습니다.
  alternative_readings:
  - 하나님이 인간 군대를 통해 간접적으로 하실 것이라는 식으로 완화하는 번역
  rationale: 히브리어는 일관된 1인칭 단수 서술을 사용하므로, 심판의 직접성을 약화시키지 않고 본문의 긴장을 유지하는 것이 필요합니다.
  doctrine_reference: 신적 주권과 심판의 직접성 유지
