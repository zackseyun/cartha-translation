revisions:
- from: 만군의 야훼에게서 당신은 천둥과 지진과 큰 소리로, 회오리바람과 폭풍과 먹어 삼키는 불꽃으로 방문을 받을 것입니다.[a][b][c]
  to: 만군의 야훼께서 천둥과 지진[b]과 큰 소리[c], 회오리바람과 폭풍, 그리고 삼키는 불의 화염으로 너를 찾아오실 것입니다.[a]
  rationale: 원문의 행위자와 2인칭 수신자를 한국어에서 분명하고 자연스럽게 드러내기 위해 수동의 직역을 능동형 ‘야훼께서 … 너를 찾아오실 것입니다’로 바꾸었습니다. 이는 פקד의 ‘방문’ 관용구를 해석적으로 ‘벌하다’로 고정하지 않으며, 그 직역적·심판적 뉘앙스는 각주 a에 보존합니다. 기상·지진·불의 누적 이미지는 유지했고, 불꽃 표현과 각주 표지 위치를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
