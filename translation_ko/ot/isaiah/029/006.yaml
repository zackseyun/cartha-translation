reference: Isaiah 29:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/עִ֨ם יְהוָ֤ה צְבָאוֹת֙ תִּפָּקֵ֔ד בְּ/רַ֥עַם וּ/בְ/רַ֖עַשׁ וְ/ק֣וֹל גָּד֑וֹל סוּפָה֙ וּ/סְעָרָ֔ה וְ/לַ֖הַב אֵ֥שׁ אוֹכֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
  footnotes:
  - marker: a
    text: Or 'you will be punished.' The Hebrew verb literally means 'you will be visited,' a biblical idiom that can refer to divine intervention for either blessing or judgment; here the context indicates judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'with shaking' for 'with earthquake.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a loud sound' for 'a great noise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 천둥과 지진[b]과 큰 소리[c], 회오리바람과 폭풍, 그리고 삼키는 불의 화염으로 너를 찾아오실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너는 심판을 받을 것입니다.’ 히브리어 동사는 직역하면 ‘방문받다’를 뜻하며, 성경의 관용구로서 은혜나 심판을 위한 하나님의 개입을 가리킬 수 있습니다. 여기서는 문맥상 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지진’은 ‘흔들림’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘큰 소리’는 ‘우렁찬 소리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם יְהוָה צְבָאוֹת
  english_pob_choice: From Yahweh of hosts
  chosen_korean: 만군의 야훼에게서
  alternatives_korean:
  - 야훼 만군에게서
  - 만군의 주님에게서
  lexicon: HALOT
  rationale: מֵעִם은 출처/기원을 나타내므로 ‘-에게서’로 옮기고, יְהוָה צְבָאוֹת는 본 프로젝트 기본값에 따라 ‘만군의 야훼’로 렌더링했습니다.
- source_word: תִּפָּקֵד
  english_pob_choice: you will be visited
  chosen_korean: 방문을 받을 것입니다
  alternatives_korean:
  - 심판을 받을 것입니다
  - 돌보심을 받을 것입니다
  lexicon: HALOT
  rationale: פקד의 니팔형은 ‘방문을 받다’라는 관용구를 유지하는 것이 원문의 어휘적 긴장을 보존하며, 문맥상 이 방문이 심판적 성격임은 뒤의 표상들이 드러냅니다.
- source_word: וְקוֹל גָּדוֹל
  english_pob_choice: and a great noise
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 큰 소란으로
  lexicon: HALOT
  rationale: קול은 소리/음성/잡음 모두 가능하지만, 자연적·현현적 표상들의 나열 속에서는 ‘큰 소리’가 가장 무난하게 폭넓은 의미를 살립니다.
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  english_pob_choice: and with the flame of a consuming fire
  chosen_korean: 먹어 삼키는 불꽃으로
  alternatives_korean:
  - 삼키는 불의 불꽃으로
  - 먹어 치우는 불꽃으로
  lexicon: HALOT
  rationale: לַהַב는 ‘불꽃/화염’, אֵשׁ אוֹכֵלָה는 직역하면 ‘삼키는 불’이므로, 한국어에서 자연스럽게 응축된 ‘먹어 삼키는 불꽃’이 파괴적 이미지를 살립니다.
theological_decisions:
- issue: 야훼의 ‘방문’(פקד) 표상 유지
  chosen_reading: ‘심판’으로 풀어 쓰지 않고 ‘방문을 받다’를 유지했습니다.
  alternative_readings:
  - 심판을 받다
  - 벌을 받다
  rationale: 히브리어 관용구의 폭을 유지하면서도, 이 본문이 재난적 현현을 통한 심판임은 문맥으로 충분히 전달됩니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: YHWH의 번역형
  chosen_reading: 여호와 대신 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값이자 원어 이름의 음역을 보존하는 선택으로, 본문의 신적 주체를 이름 차원에서 드러냅니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
