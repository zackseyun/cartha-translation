id: ISA.29.22
reference: Isaiah 29:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
  footnotes:
  - marker: a
    text: Or 'be put to shame' for 'be ashamed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his face will no longer be pale.' The Hebrew verb literally refers to becoming pale or whitened, an image of shame or dismay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 아브라함을 구속하신 야훼께서 야곱의 집에 이렇게 말씀하십니다. 이제 야곱은 더 이상 부끄러워하지 않을 것이며[a], 그의 얼굴도 더 이상 창백해지지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수치를 당하지 않을 것이다’. 히브리어 동사는 ‘부끄러워하다’뿐 아니라 ‘수치를 당하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 얼굴이 더 이상 창백해지지 않을 것이다’. 히브리어 동사는 문자적으로 ‘희어지다’를 가리키며, 수치나 당혹의 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞 문맥에서 이어지는 추론·결과 관계를 한국어로 자연스럽게 살리면서도 형식적 연결을 유지합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 … 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 … 이같이 말씀하십니다
  - 야훼께서 … 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 전언 공식을 현대 한국어 합쇼체로 옮기되, 직접적이고 권위 있는 선언의 어조를 유지합니다.
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  english_pob_choice: he who redeemed Abraham
  chosen_korean: 아브라함을 구속하신 분
  alternatives_korean:
  - 아브라함을 속량하신 분
  - 아브라함을 구원하신 분
  lexicon: HALOT
  rationale: פָּדָה의 언약적·구속적 뉘앙스를 살리기 위해 '구속하다'를 택했습니다. '구원하다'는 더 일반적이어서 원문의 결속감이 약해질 수 있습니다.
- source_word: יֵבוֹשׁ
  english_pob_choice: be ashamed
  chosen_korean: 부끄러워하지 않을 것이며
  alternatives_korean:
  - 수치를 당하지 않을 것이며
  - 창피를 당하지 않을 것이며
  lexicon: HALOT
  rationale: 수치·굴욕의 상태를 현대 한국어에서 자연스럽게 표현하면서도 능동적 감정 상태로만 축소하지 않도록 했습니다.
- source_word: יֶחֱוָרוּ
  english_pob_choice: will ... grow pale
  chosen_korean: 더 이상 창백해지지 않을 것입니다
  alternatives_korean:
  - 더 이상 하얗게 질리지 않을 것입니다
  - 더 이상 얼굴빛이 사라지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 '희게 됨/창백해짐' 이미지를 보존해, 수치와 당혹의 표상을 드러내도록 했습니다.
theological_decisions:
- issue: אֶל בֵּית יַעֲקֹב의 대상 범위와 호칭
  chosen_reading: '''야곱의 집''을 공동체적 언약 호칭으로 유지했습니다.'
  alternative_readings:
  - '''야곱 집안에'''
  - '''이스라엘에게'''
  rationale: 문맥상 개인이 아니라 언약 공동체 전체를 가리키는 표현이므로, '집'의 공동체성을 보존하는 번역이 적절합니다.
  doctrine_reference: covenant people / corporate identity of Israel
- issue: 아브라함을 '구속하신' 분이라는 표현의 신학적 강도
  chosen_reading: 야훼의 과거 구원 행위를 언약적 근거로 제시하는 문장으로 읽었습니다.
  alternative_readings:
  - 단순 과거 보호 행위로 약화해서 읽기
  - 일반적인 도움/구출로 읽기
  rationale: 본문은 야곱에 대한 약속의 근거로 야훼의 아브라함 구속을 제시하므로, 이를 단순한 도움보다 구속적 행위로 드러내는 것이 문맥에 부합합니다.
  doctrine_reference: redemptive history / covenant faithfulness
