  source_fidelity: 개정이 필요합니다. 초안은 פלא 어근의 강조와 미래적 심판의 흐름을 대체로 반영하지만, חָכְמַת חֲכָמָיו와 בִּינַת נְבֹנָיו에 있는 ‘지혜로운 사람들’과 ‘분별 있는 사람들’을 빠뜨렸습니다. 또한 וְ는 단순 병렬로 옮기는 편이 안전하므로 결과를 과도하게 명시하는 ‘그리하여’보다 ‘또’가 적절합니다.
  naturalness: ‘보십시오, 내가’와 ‘놀랍고도 놀라운 일’은 현대 합쇼체에서 자연스럽습니다. 다만 ‘그들의 지혜’와 ‘그들의 분별’만으로는 원문의 반복된 인물 명사를 충분히 드러내지 못합니다.
  terminology: חָכְמָה/חֲכָמִים은 ‘지혜로운 사람들의 지혜’, בִּינָה/נְבֹנִים은 ‘분별 있는 사람들의 명철’로 평행을 살렸습니다. תִּסְתַּתָּר는 주체가 스스로 숨는지 수동적으로 숨겨지는지 논의될 수 있으므로, 한국어에서는 그 모호성을 비교적 보존하는 ‘숨겨질 것입니다’를 사용했습니다.
  issues:
  - severity: high
    issue: ‘지혜로운 사람들’과 ‘분별 있는 사람들’이 본문에서 누락되었습니다.
