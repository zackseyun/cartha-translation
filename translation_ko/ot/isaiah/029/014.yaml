    text: 또는 “내가 다시 이 백성에게 놀랍게 행하되, 놀라움에 놀라움을 더하겠다.”
    reason: הַפְלֵא וָפֶלֶא의 반복·강조 구조를 좀 더 직역적으로 옮긴 어휘적 대안입니다.
