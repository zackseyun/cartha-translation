translation:
  language: ko
  text: 그러므로 보십시오, 내가 다시 이 백성에게 놀랍고도 놀라운 일을[a] 행하겠습니다. 또 이 백성의 지혜로운 사람들의 지혜는 사라지고, 분별 있는 사람들의 명철은 숨겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
