source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
  footnotes:
  - marker: a
    text: Or, “I will again deal wondrously with this people, with wonder upon wonder.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 이 백성에게 다시 놀랍고도 놀라운 일을 행하겠습니다. 그리하여 그들의 지혜는 멸망하고, 그들의 분별은 가려질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 이 백성에게 다시 놀랍게 행하고, 놀라움에 놀라움을 더하겠다”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망에 대한 결과를 여는 접속사로서, 현대 한국어에서 가장 자연스럽고 문맥적 인과를 분명히 드러냅니다.
- source_word: הִנְנִי
  english_pob_choice: behold, I
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 여기 내가 있습니다
  lexicon: HALOT
  rationale: 예언적 주의를 끄는 표현을 살리되, 합쇼체 본문 흐름에 맞게 자연스럽게 옮겼습니다.
- source_word: הַפְלֵא וָפֶלֶא
  english_pob_choice: something astonishing and marvelous
  chosen_korean: 놀랍고도 놀라운 일
  alternatives_korean:
  - 경이로우며 경이로운 일
  - 기이하고도 기이한 일
  lexicon: HALOT
  rationale: פלא 어근의 중첩으로 인한 강조를 한국어의 반복 구조로 반영해, 단순한 '기적'보다 강한 놀라움의 강조를 유지했습니다.
- source_word: וּבִינַת נְבֹנָיו
  english_pob_choice: the understanding of its discerning men
  chosen_korean: 그들의 분별
  alternatives_korean:
  - 그들의 이해력
  - 그들의 명철
  lexicon: HALOT
  rationale: בינה와 נבון의 짝을 '분별'로 묶어 간결하게 살리면서, 앞의 '지혜'와 평행을 이루도록 했습니다.
theological_decisions:
- issue: 지혜와 분별의 소멸을 어떻게 표현할지
  chosen_reading: 그들의 지혜는 멸망하고, 그들의 분별은 가려질 것입니다.
  alternative_readings:
  - 그들의 지혜는 사라지고, 그들의 분별은 숨을 것입니다
  - 그들의 지혜는 없어지고, 그들의 분별은 감춰질 것입니다
  rationale: 히브리어의 강한 종말적 소멸/은폐 이미지를 약화하지 않기 위해, 두 동사를 각각 '멸망하다'와 '가려지다'로 분리해 긴장감을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
