base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/002.yaml
  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
  footnotes:
  - marker: a
    text: 'Hebrew אֲרִיאֵל (''Ariel'') is likely a wordplay: the city called Ariel will become like an ''altar hearth.'' Alternatively, the final phrase could be rendered more formally, ''and she will be to me like Ariel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아리엘을 괴롭게 할 것이며, 거기에는 애통과 탄식이 있을 것이요, 그리고 그것은 내게 제단 화덕처럼 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרִיאֵל(‘아리엘’)은 아마도 ‘제단 화덕’이라는 뜻의 말장난일 수 있습니다. 따라서 마지막 구절은 뜻을 따라 옮겼습니다. 더 형식적으로는 ‘그리고 그것은 내게 아리엘처럼 될 것입니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  english_pob_choice: And I will distress
  chosen_korean: 괴롭게 할 것이며
  alternatives_korean:
  - 압박할 것이며
  - 환난을 내릴 것이며
  - 포위할 것이며
  lexicon: HALOT
  rationale: 히필형의 ‘압박하여 괴롭게 하다’는 넓은 의미를 살리되, 문맥상 너무 군사적으로 좁혀지는 ‘포위하다’는 피했습니다.
- source_word: לַאֲרִיאֵל / כַּאֲרִיאֵל
  english_pob_choice: Ariel / like an altar hearth
  chosen_korean: 아리엘 / 제단 화덕처럼
  alternatives_korean:
  - 아리엘 / 아리엘처럼
  - 제단 화덕 / 제단 화덕처럼
  lexicon: HALOT
  rationale: 첫 번째는 도시 이름으로 음역하고, 마지막은 말장난의 의미를 살려 ‘제단 화덕’으로 옮겨, 히브리어의 반복과 이중 의미를 한국어에서 최대한 드러냈습니다.
- source_word: תַאֲנִיָּה וַאֲנִיָּה
  english_pob_choice: mourning and lamentation
  chosen_korean: 애통과 탄식
  alternatives_korean:
  - 슬픔과 부르짖음
  - 애곡과 통곡
  - 애통과 애곡
  lexicon: HALOT
  rationale: 두 명사의 병렬과 점층을 살리기 위해 유사어를 나열하되, 한국어에서 자연스러운 예언시 어법인 ‘애통과 탄식’으로 옮겼습니다.
- source_word: וְהָיְתָה לִּי
  english_pob_choice: and she will be to me
  chosen_korean: 그리고 그것은 내게
  alternatives_korean:
  - 그리고 그녀는 내게
  - 그리하여 그것은 내게
  lexicon: HALOT
  rationale: 도시를 가리키는 여성형의 의인화를 살릴 수도 있지만, 한국어에서는 비인칭 지시로도 자연스럽게 들리므로 본문 의미를 해치지 않는 범위에서 ‘그것은’으로 처리했습니다.
theological_decisions:
- issue: 아리엘의 반복어를 이름과 뜻으로 나눠 옮길지 여부
  chosen_reading: 첫 번째 아리엘은 고유명사로, 마지막 아리엘은 ‘제단 화덕’으로 번역해 말장난과 심판의 이미지를 함께 드러냈습니다.
  alternative_readings:
  - 아리엘을 두 번 모두 음역
  - 두 번 모두 ‘제단 화덕’으로 번역
  rationale: 문맥은 예루살렘을 가리키는 이름을 유지하면서도, 마지막 구절에서 제의적 심판의 이미지를 불러오는 لفظ적 장난을 사용합니다. 둘 다 살려야 독자가 본문의 수사적 긴장을 이해할 수 있습니다.
  doctrine_reference: 'Translation philosophy: Preserve ambiguity and wordplay where the source text uses it.'
