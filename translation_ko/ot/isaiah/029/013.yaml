review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 בְּפִיו(그 입으로)를 ‘입술로’로 옮겨 이어지는 וּבִשְׂפָתָיו(그 입술로)와 중복시켰습니다. 또한 מִצְוַת אֲנָשִׁים מְלֻמָּדָה는 ‘사람의 계명으로 배운 것’보다 ‘사람들이 가르친 계명’으로 옮겨야 수식 관계와 수동 분사의 뜻이 분명합니다. יַעַן כִּי의 인과 관계도 반영했습니다.
  naturalness: ‘입으로는 … 입술로는 …’의 병행은 현대 표준 한국어에서 자연스럽고 원문의 대조적 시어를 보존합니다. 집합명사 ‘이 백성’에 맞추어 ‘그 마음’으로 받았으며, 합쇼체 서술을 일관되게 유지했습니다.
  terminology: אֲדֹנָי는 ‘주’, כָּבַד는 ‘공경하다’, יִרְאָה는 문맥상 ‘경외하다’, מִצְוָה는 ‘계명’으로 유지했습니다. אֲנָשִׁים은 여기서 일반적인 인간 기원의 규정을 뜻하므로 ‘사람들이’가 자연스럽고 의미상 충분합니다.
  issues:
  - severity: medium
    issue: ‘입술로는’이 두 번 사용됨
    rationale: 히브리어는 ‘그 입으로’(בְּפִיו)와 ‘그 입술로’(וּבִשְׂפָתָיו)를 병행합니다. 초안은 전자를 ‘입술’로 옮겨 원문의 어휘적 병행을 소실했습니다.
  - severity: medium
    issue: ‘사람의 계명으로 배운 것’의 수식 관계가 불명확함
    rationale: מְלֻמָּדָה는 ‘계명’을 수식하는 수동 분사입니다. ‘사람들이 가르친 계명’은 인간에게서 가르쳐진 규정이라는 뜻을 명확히 보존합니다.
  - severity: low
    issue: יַעַן כִּי의 인과 표지가 반영되지 않음
    rationale: ‘이는 … 때문입니다’로 옮겨 하나님의 선언이 제시하는 이유라는 원문의 인과 기능을 보존할 수 있습니다.
  revised_text: 주께서 말씀하셨습니다. “이는 이 백성이 입으로는 나에게 가까이 나아오고 입술로는 나를 공경하지만, 그 마음은 나에게서 멀리 떠나 있으며, 그들이 나를 경외하는 것은 사람들이 가르친 계명이 되었기 때문입니다.”
  revised_footnotes: []
  revision_rationale: 원문의 ‘입/입술’ 병행을 회복하고, 인간의 가르침으로 된 계명이라는 히브리어 구문의 수식 관계를 명료하게 했습니다. ‘경외’는 יִרְאָה의 신앙적 의미 범위를 자연스럽게 전달하되 특정 교리적 해석을 덧붙이지 않습니다.
