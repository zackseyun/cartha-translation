- from: 주께서 말씀하셨습니다. "이 백성이 입술로는 나에게 가까이 나아오고, 입술로는 나를 공경하지만, 그들의 마음은 나에게서 멀리 떠나 있으며, 나를 향한 그들의 경외는 사람의 계명으로 배운 것이 되었습니다."
  to: 주께서 말씀하셨습니다. “이는 이 백성이 입으로는 나에게 가까이 나아오고 입술로는 나를 공경하지만, 그 마음은 나에게서 멀리 떠나 있으며, 그들이 나를 경외하는 것은 사람들이 가르친 계명이 되었기 때문입니다.”
  rationale: 원문의 ‘입/입술’ 병행을 회복하고, 인간의 가르침으로 된 계명이라는 히브리어 구문의 수식 관계를 명료하게 했습니다. ‘경외’는 יִרְאָה의 신앙적 의미 범위를 자연스럽게 전달하되 특정 교리적 해석을 덧붙이지 않습니다.
