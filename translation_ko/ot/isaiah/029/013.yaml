id: ISA.29.13
reference: Isaiah 29:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹנָ֗/י יַ֚עַן כִּ֤י נִגַּשׁ֙ הָ/עָ֣ם הַ/זֶּ֔ה בְּ/פִ֤י/ו וּ/בִ/שְׂפָתָי/ו֙ כִּבְּד֔וּ/נִי וְ/לִבּ֖/וֹ רִחַ֣ק מִמֶּ֑/נִּי וַ/תְּהִ֤י יִרְאָתָ/ם֙ אֹתִ֔/י מִצְוַ֥ת אֲנָשִׁ֖ים מְלֻמָּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
  footnotes:
  - marker: a
    text: Or 'their reverence for me' or 'their worship of me'; Hebrew 'their fear of me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a human commandment that is learned/taught.' The phrase criticizes devotion reduced to merely human instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 말씀하셨습니다. “이는 이 백성이 입으로는 나에게 가까이 나아오고 입술로는 나를 공경하지만, 그 마음은 나에게서 멀리 떠나 있으며, 그들이 나를 경외하는 것은 사람들이 가르친 계명이 되었기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲדֹנָי
  english_pob_choice: And the Lord said
  chosen_korean: 주께서 말씀하셨습니다
  alternatives_korean:
  - 주님이 말씀하셨습니다
  - 주께서 이르셨습니다
  lexicon: HALOT
  rationale: 예언문 서두의 신적 발화를 자연스러운 합쇼체로 옮겼고, אֲדֹנָי는 본문 문맥상 하나님의 주권적 호칭이므로 ‘주께서’로 처리했습니다.
- source_word: נִגַּשׁ
  english_pob_choice: draws near
  chosen_korean: 가까이 나아오고
  alternatives_korean:
  - 다가오고
  - 접근하고
  lexicon: HALOT
  rationale: 예배적·관계적 ‘가까이 나아옴’의 뉘앙스를 살리되 현대 한국어로 자연스럽게 표현했습니다.
- source_word: כִּבְּדוּנִי
  english_pob_choice: honors me
  chosen_korean: 나를 공경하지만
  alternatives_korean:
  - 나를 존중하지만
  - 나를 영화롭게 하지만
  lexicon: HALOT
  rationale: כבד의 ‘무겁게 여기다/존귀하게 여기다’라는 뜻을 한국어 성경어휘로는 ‘공경하다’가 가장 직접적으로 대응합니다.
- source_word: יִרְאָתָם אֹתִי
  english_pob_choice: their fear of me
  chosen_korean: 나를 향한 그들의 경외
  alternatives_korean:
  - 나를 향한 그들의 두려움
  - 나를 향한 그들의 경외심
  lexicon: HALOT
  rationale: יִרְאָה의 의미 범위(두려움·경외·신앙적 경배)를 살리면서, 한국어에서는 하나님께 대한 태도를 표현하는 ‘경외’가 본문 대비를 가장 잘 드러냅니다.
- source_word: מִצְוַת אֲנָשִׁים מְלֻמָּדָה
  english_pob_choice: a commandment of men that is taught
  chosen_korean: 사람의 계명으로 배운 것이 되었습니다
  alternatives_korean:
  - 사람의 계명으로 가르쳐진 것이 되었습니다
  - 사람의 계명으로 익힌 것이 되었습니다
  lexicon: HALOT
  rationale: ‘계명’은 מִצְוָה의 규범적 성격을 유지하고, מְלֻמָּדָה는 ‘배운 것’으로 옮겨 인간 전승으로 습득된 종교행위를 드러냈습니다.
theological_decisions:
- issue: יִרְאָה의 의미를 두려움으로 좁힐지, 경외로 살릴지
  chosen_reading: 경외
  alternative_readings:
  - 두려움
  - 경배
  rationale: 문맥상 야훼를 향한 참된 태도와 외형적 종교행위를 대비하므로, 한국어에서는 ‘경외’가 신앙적 무게와 도덕적 긴장을 함께 가장 잘 전달합니다.
  doctrine_reference: 시 111:10; 잠 1:7; 번역 원칙 §3
- issue: אֲנָשִׁים의 남성형을 중립화할지 여부
  chosen_reading: 사람
  alternative_readings:
  - 남자들
  - 인간
  rationale: 히브리어는 남성 복수형이지만 여기서는 일반 인간을 가리키는 관용적 용법이므로, 한국어 본문은 ‘사람’으로 자연화하되 인간의 계명이라는 비판을 유지했습니다.
  doctrine_reference: 번역 원칙 §4
