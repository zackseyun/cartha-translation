revisions:
- from: 겸손한 자들은 다시 여호와 안에서 기쁨을 더하고, 사람들 가운데 가난한 자들은 이스라엘의 거룩하신 이 안에서 즐거워할 것입니다.[a][b]
  to: 겸손한 이들은 여호와 안에서 기쁨이 더욱 커지고[a], 사람들[b] 중 가난한 이들은 이스라엘의 거룩하신 분 안에서 크게 기뻐할 것입니다.
  rationale: 원문의 증가 동사와 ‘기쁨’이라는 명사를 보존하면서 현대 한국어에서 자연스러운 ‘기쁨이 더욱 커지고’로 다듬었습니다. אָדָם의 일반적 인간 지시는 ‘사람들 중’으로, 이사야서의 신적 칭호는 ‘이스라엘의 거룩하신 분’으로 옮겼습니다. 각주 표지는 각각 해당 어휘 바로 뒤로 옮겼습니다.
