  - severity: low
    issue: ‘이스라엘의 거룩하신 이’는 현대 공적 한국어에서 다소 어색합니다.
    rationale: 고정된 이사야적 신적 칭호는 ‘이스라엘의 거룩하신 분’이 자연스럽고 의미를 보존합니다.
  - severity: low
    issue: 각주 표지가 해당 어휘에 직접 붙어 있지 않습니다.
