  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'The meek will again have joy in the LORD.' The Hebrew verb literally means 'will add/increase,' and the noun may be rendered 'joy' or 'gladness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the poor among humankind' or 'the poor of man.' The Hebrew אָדָם is generic here, referring to human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 겸손한 자들은 다시 여호와 안에서 기쁨을 더하고, 사람들 가운데 가난한 자들은 이스라엘의 거룩하신 이 안에서 즐거워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘더하다/증가시키다’의 뜻이며, 명사는 ‘기쁨’ 또는 ‘즐거움’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람들 가운데’는 히브리어 אָדָם이 여기서 남성만이 아니라 일반 사람들을 가리킨다는 점을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  english_pob_choice: will again increase their joy
  chosen_korean: 다시 ... 기쁨을 더하고
  alternatives_korean:
  - 다시 ... 기쁨이 더해지고
  - 다시 ... 기뻐하고
  - 다시 ... 즐거움을 더하고
  lexicon: HALOT
  rationale: יסף의 ‘더하다/증가시키다’와 שִׂמְחָה의 명사를 함께 살리기 위해, 동사의 반복·증가 뉘앙스를 ‘다시 … 기쁨을 더하고’로 옮겼습니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 자들
  alternatives_korean:
  - 온유한 자들
  - 낮은 자들
  - 온유하고 겸손한 자들
  lexicon: HALOT
  rationale: עֲנָוִים은 하나님 앞에서 낮고 겸손한 태도와 사회적 낮은 처지를 함께 가리킬 수 있어, 둘을 포괄하는 ‘겸손한 자들’로 옮겼습니다.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: in the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이 안에서
  alternatives_korean:
  - 이스라엘의 거룩하신 분 안에서
  - 이스라엘의 거룩하신 자 안에서
  lexicon: HALOT
  rationale: 이사야서의 고정된 신적 칭호를 그대로 살리되, 한국어에서는 인격적 지칭이 자연스럽도록 ‘거룩하신 이’로 번역했습니다.
- source_word: יָגִילוּ
  english_pob_choice: will rejoice
  chosen_korean: 즐거워할 것입니다
  alternatives_korean:
  - 기뻐할 것입니다
  - 환호할 것입니다
  - 크게 기뻐할 것입니다
  lexicon: HALOT
  rationale: גיל은 단순한 기쁨보다 더 생동적인 환희를 뜻하지만, 본문 병행성과 현대 한국어의 자연스러움을 고려해 ‘즐거워하다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  - 주
  rationale: 주어진 영어 POB가 LORD를 따르지만, 한국어 POB의 고정 용례와 공적 가독성을 고려해 YHWH를 전통적 한국어 성경어인 ‘여호와’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בַּיהוָה와 בִּקְדוֹשׁ יִשְׂרָאֵל의 전치사 처리
  chosen_reading: 둘 다 기쁨과 환희의 ‘안에서’라는 영역을 나타내는 것으로 읽었습니다.
  alternative_readings:
  - ~로 말미암아
  - ~을 향하여
  - ~로 인해
  rationale: 병행구조에서 두 전치사는 대상/영역을 가리키는 의미가 가장 자연스럽기 때문에, 원문의 대칭을 살려 ‘안에서’로 통일했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
