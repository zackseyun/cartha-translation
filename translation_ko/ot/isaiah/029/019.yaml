  lexicon: HALOT
  rationale: עֲנָוִים은 하나님 앞에서 낮고 겸손한 태도와 사회적 낮은 처지를 함께 가리킬 수 있어, 둘을 포괄하는 ‘겸손한 자들’로 옮겼습니다.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: in the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이 안에서
  alternatives_korean:
  - 이스라엘의 거룩하신 분 안에서
  - 이스라엘의 거룩하신 자 안에서
  lexicon: HALOT
  rationale: 이사야서의 고정된 신적 칭호를 그대로 살리되, 한국어에서는 인격적 지칭이 자연스럽도록 ‘거룩하신 이’로 번역했습니다.
- source_word: יָגִילוּ
  english_pob_choice: will rejoice
  chosen_korean: 즐거워할 것입니다
  alternatives_korean:
  - 기뻐할 것입니다
  - 환호할 것입니다
  - 크게 기뻐할 것입니다
  lexicon: HALOT
  rationale: גיל은 단순한 기쁨보다 더 생동적인 환희를 뜻하지만, 본문 병행성과 현대 한국어의 자연스러움을 고려해 ‘즐거워하다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  - 주
  rationale: 주어진 영어 POB가 LORD를 따르지만, 한국어 POB의 고정 용례와 공적 가독성을 고려해 YHWH를 전통적 한국어 성경어인 ‘여호와’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בַּיהוָה와 בִּקְדוֹשׁ יִשְׂרָאֵל의 전치사 처리
  chosen_reading: 둘 다 기쁨과 환희의 ‘안에서’라는 영역을 나타내는 것으로 읽었습니다.
  alternative_readings:
  - ~로 말미암아
  - ~을 향하여
  - ~로 인해
  rationale: 병행구조에서 두 전치사는 대상/영역을 가리키는 의미가 가장 자연스럽기 때문에, 원문의 대칭을 살려 ‘안에서’로 통일했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
