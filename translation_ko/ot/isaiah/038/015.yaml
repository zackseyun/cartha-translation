id: ISA.38.15
reference: Isaiah 38:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָֽה אֲדַבֵּ֥ר וְ/אָֽמַר לִ֖/י וְ/ה֣וּא עָשָׂ֑ה אֶדַּדֶּ֥ה כָל שְׁנוֹתַ֖/י עַל מַ֥ר נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
  footnotes:
  - marker: a
    text: Or 'I will go softly all my years in the bitterness of my soul.' The rare verb may denote subdued or slow walking, and the phrase with 'bitterness' may be read as manner rather than cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 무엇이라 말하겠습니까? 그분이 내게 말씀하셨고, 그분이 친히 이루셨습니다. 나는 내 영혼의 쓰라림 때문에 모든 해 동안 천천히 걸을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼의 쓰라림 속에서 평생 조용히 걸을 것입니다.’ 희귀 동사는 눌린 듯한 혹은 느린 걸음을 뜻할 수 있고, ‘쓰라림’과 함께한 구문은 원인보다 방식으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  english_pob_choice: What can I say?
  chosen_korean: 내가 무엇이라 말하겠습니까?
  alternatives_korean:
  - 내가 무엇이라고 말하겠습니까?
  - 내가 무슨 말을 하겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 말문이 막힌 반응을 살려, 현대 한국어에서 자연스러운 반성적 질문형으로 옮겼습니다.
- source_word: וְאָמַר לִי
  english_pob_choice: He has spoken to me
  chosen_korean: 그분이 내게 말씀하셨고
  alternatives_korean:
  - 그가 내게 말씀하셨고
  - 그분이 내게 말하셨고
  lexicon: HALOT
  rationale: 하나님을 가리키는 문맥을 반영해 '그분'으로 옮기고, 단순 '말하다'보다 계시적 발화를 드러내는 '말씀하다'를 택했습니다.
- source_word: וְהוּא עָשָׂה
  english_pob_choice: he himself has done it
  chosen_korean: 그분이 친히 이루셨습니다
  alternatives_korean:
  - 그분이 친히 하셨습니다
  - 그분이 그것을 하셨습니다
  lexicon: HALOT
  rationale: 주어의 강조를 '친히'로 살리고, 히브리어의 결과적 완료를 자연스럽게 표현하기 위해 '이루다'를 택했습니다.
- source_word: אֶדַּדֶּה כָל שְׁנוֹתַי
  english_pob_choice: I will walk slowly all my years
  chosen_korean: 나는 … 모든 해 동안 천천히 걸을 것입니다
  alternatives_korean:
  - 나는 … 모든 해 동안 조심히 걸을 것입니다
  - 나는 … 평생 느리게 걸을 것입니다
  lexicon: HALOT
  rationale: 희귀 동사의 의미를 따라 '천천히 걸을 것입니다'로 옮겨, 절제되고 느린 보행의 뉘앙스를 유지했습니다.
- source_word: עַל מַר נַפְשִׁי
  english_pob_choice: because of the bitterness of my soul
  chosen_korean: 내 영혼의 쓰라림 때문에
  alternatives_korean:
  - 내 영혼의 쓰라림 안에서
  - 내 영혼의 쓰라림으로 인해
  lexicon: HALOT
  rationale: POB의 인과적 해석을 따라 '때문에'로 옮기고, נֶפֶשׁ를 직역해 '영혼'을 유지했습니다.
theological_decisions:
- issue: 발화자의 지시 대상
  chosen_reading: 문맥상 발화자와 행위자는 야훼이므로, 3인칭 대명사는 한국어에서 노출형 대명사 대신 '그분'으로 처리했습니다.
  alternative_readings:
  - 불특정 주어로 남겨 두기
  - '''하나님''을 본문에 직접 삽입하기'
  rationale: 본문은 이름을 직접 말하지 않지만 선행 문맥과 POB audit trail이 하나님의 말씀과 행위를 가리킨다고 보므로, 의미를 유지하면서도 본문 외 정보의 과잉 삽입은 피했습니다.
  doctrine_reference: 문맥에 따른 대명사 해석 유지
- issue: 희귀 동사의 행위 양상
  chosen_reading: '''천천히 걸을 것입니다''로 번역해 절제된 삶의 자세를 드러내되, 본문의 애도적 자기진술을 약화시키지 않았습니다.'
  alternative_readings:
  - '''조용히 갈 것입니다'''
  - '''살금살금 갈 것입니다'''
  rationale: 히브리어 희귀 동사는 단순 이동보다 낮춰진 걸음과 태도를 함께 암시하므로, 과도한 의성적 표현보다 서정적이고 절제된 한국어를 선택했습니다.
  doctrine_reference: 어휘적 긴장 보존
