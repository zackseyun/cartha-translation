translation:
  language: ko
  text: 히스기야가 말했습니다[a], “내가 야훼의 집으로 올라갈 표징이 무엇입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 야훼의 집으로 올라갈 표징이 무엇입니까?”
