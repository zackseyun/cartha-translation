lexical_decisions:
- source_word: וַיֹּאמֶר חִזְקִיָּהוּ
  english_pob_choice: And Hezekiah said
  chosen_korean: 히스기야가 말했습니다
  alternatives_korean:
  - 그리고 히스기야가 말했습니다
  - 히스기야가 말했습니다
  lexicon: HALOT
  rationale: 서술 접속은 한국어에서 과도하게 드러내지 않고 자연스러운 사건 진행으로 처리했습니다. 인명은 표준적으로 히스기야를 썼습니다.
- source_word: מָה אוֹת
  english_pob_choice: What is the sign
  chosen_korean: 표징이 무엇입니까
  alternatives_korean:
  - 징조가 무엇입니까
  - 표적이 무엇입니까
  lexicon: HALOT
  rationale: אוֹת는 문맥상 확인을 위한 ‘sign’이므로 교회적 전통어 ‘징조’보다 더 직접적인 ‘표징’을 택했습니다.
- source_word: כִּי אֶעֱלֶה
  english_pob_choice: that I shall/will go up
  chosen_korean: 내가 ... 올라갈
  alternatives_korean:
  - 내가 ... 오를
  - 내가 ... 올라가겠다는
  lexicon: HALOT
  rationale: עלה의 기본적 이동 의미를 살려 ‘올라가다’로 옮겼고, 성전으로 가는 예루살렘 상승 관용도 유지했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  lexicon: HALOT
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, בית יהוה는 직역형인 ‘야훼의 집’으로 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 신적 고유명을 직접 가리키므로, 본 프로젝트 기본 원칙에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
