id: ISA.38.21
reference: Isaiah 38:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֔הוּ יִשְׂא֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וְ/יִמְרְח֥וּ עַֽל הַ/שְּׁחִ֖ין וְ/יֶֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/021.yaml
  text: Now Isaiah had said[a], “Let them take a cake of figs and spread it on the boil, so that he may recover.”
  footnotes:
  - marker: a
    text: Or, more literally, “and he may live.” The Hebrew uses the verb “live,” here in the sense of recovering from illness.
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야가 말하였는데, “무화과 과자를 가져다가 종기 위에 바르십시오. 그러면 그가 회복될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 살 것입니다”라고 할 수 있으나, 여기서는 병에서 회복된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְשַׁעְיָהוּ
  english_pob_choice: Now Isaiah had said
  chosen_korean: 이사야가 말하였는데
  alternatives_korean:
  - 이사야가 말했습니다
  - 이사야가 이미 말하였는데
  lexicon: HALOT
  rationale: 서술 흐름상 앞선 사건을 배경으로 덧붙이는 용법이므로, 한국어에서도 ‘말하였는데’로 처리해 회상적 배경을 자연스럽게 드러냈습니다.
- source_word: יִשְׂאוּ דְּבֶלֶת תְּאֵנִים
  english_pob_choice: Let them take a cake of figs
  chosen_korean: 무화과 과자를 가져다가
  alternatives_korean:
  - 무화과 떡을 가져다가
  - 무화과 한 덩이를 가져다가
  lexicon: HALOT
  rationale: דְּבֶלֶת은 눌러 만든 덩이/과자 같은 형태를 가리키므로, ‘과자’보다도 덩어리감을 살릴 수 있는 표현을 택했습니다. 문맥상 약재를 ‘가져다가’ 하는 준비 동작이 자연합니다.
- source_word: וְ/יִמְרְח֥וּ עַֽל הַ/שְּׁחִ֖ין
  english_pob_choice: and spread it on the boil
  chosen_korean: 종기 위에 바르십시오
  alternatives_korean:
  - 종기 위에 펴 바르십시오
  - 종기 위에 문지르십시오
  lexicon: HALOT
  rationale: מָרַח는 ‘바르다/펴 바르다’의 뜻이므로 현대 한국어에서 가장 직접적인 ‘바르다’를 사용했고, שְׁחִין은 피부의 부스럼성 병변으로서 ‘종기’가 가장 직설적입니다.
- source_word: וְ/יֶֽחִי
  english_pob_choice: so that he may recover
  chosen_korean: 그러면 그가 회복될 것입니다
  alternatives_korean:
  - 그리하여 그가 살 것입니다
  - 그래서 그가 살아날 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사 ‘살다’의 결과용법이지만, 병 치료의 문맥에서는 ‘회복되다’가 의도를 가장 잘 드러냅니다. English POB의 해석 방향도 이를 뒷받침합니다.
theological_decisions:
- issue: וְיֶחִי의 직역(살다)과 문맥상 의미(회복) 사이의 긴장
  chosen_reading: 본문에는 ‘회복될 것입니다’로 옮기되, 생명-회복의 어휘적 중의성은 주해에서 보존했습니다.
  alternative_readings:
  - 그가 살 것입니다
  - 그가 살아날 것입니다
  rationale: 히브리어는 문자적으로 ‘살다’를 쓰지만, 이 절은 병 낫는 결과를 말하므로 독자가 치료 효과를 이해하도록 하면서도 원문의 생명 어휘를 과도하게 약화시키지 않았습니다.
  doctrine_reference: 문맥 주해상의 의미 선택
