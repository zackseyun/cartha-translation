revisions:
- from: 이사야가 말하였는데, “무화과 과자를 가져다가 종기 위에 바르십시오. 그러면 그가 회복될 것입니다.”[a]
  to: 이사야가 이미 이렇게 말했습니다. “무화과 떡을 가져다가 종기에 바르십시오. 그러면 그가 회복될 것입니다[a].”
  rationale: ‘무화과 떡’ restores the physical sense of the Hebrew pressed fig cake without importing the modern meaning of ‘과자.’ The revised introduction is a complete, natural formal-polite Korean sentence and reflects the verse’s contextual explanatory/background role. The main text retains ‘회복될 것입니다’ as the natural contextual rendering of חיה, while the footnote preserves the literal life terminology and attaches to the relevant expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:47Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the fig preparation, application to the boil, and the healing result. However, ‘무화과 과자’ misleadingly evokes a modern snack rather than a pressed fig cake, and the Korean result clause presents the healing as a simple future prediction more strongly than the Hebrew jussive/result construction.
  naturalness: ‘이사야가 말하였는데’ leaves a somewhat suspended Korean clause before the quotation. ‘이사야가 이미 이렇게 말했습니다’ naturally conveys the explanatory, retrospective discourse function in this context. ‘종기에 바르십시오’ is idiomatic modern formal-polite Korean.
  terminology: ‘무화과 떡’ is the established and more semantically suitable Korean rendering for a pressed cake of figs. ‘종기’ and ‘회복되다’ are appropriate. The footnote should retain the literal ‘살다’ while explaining the contextual recovery sense.
  issues:
  - severity: medium
    issue: ‘무화과 과자’
    rationale: In current Korean, ‘과자’ normally denotes a cookie or confectionery snack. דְּבֶלֶת תְּאֵנִים denotes a pressed cake/lump of figs; ‘무화과 떡’ is clearer and avoids anachronistic associations.
  - severity: low
    issue: ‘이사야가 말하였는데’
    rationale: The connective ending -는데 is syntactically and stylistically dangling before a direct quotation. A complete retrospective narrative introduction is more natural while preserving the contextual background function.
  - severity: low
    issue: Footnote placement and wording
    rationale: The marker should attach directly to ‘회복될 것입니다,’ the term for which it supplies a lexical alternative. ‘말할 수 있으나’ is unnecessarily tentative; the Hebrew explicitly uses ‘live.’
  revised_text: 이사야가 이미 이렇게 말했습니다. “무화과 떡을 가져다가 종기에 바르십시오. 그러면 그가 회복될 것입니다[a].”
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 살 것입니다”라고 합니다. 여기서는 병에서 회복된다는 뜻입니다.
    reason: lexical_alternative
