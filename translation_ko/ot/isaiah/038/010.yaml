id: ISA.38.10
reference: Isaiah 38:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֣י אָמַ֗רְתִּי בִּ/דְמִ֥י יָמַ֛/י אֵלֵ֖כָה בְּ/שַׁעֲרֵ֣י שְׁא֑וֹל פֻּקַּ֖דְתִּי יֶ֥תֶר שְׁנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
  footnotes:
  - marker: a
    text: Or 'the realm of the dead' or 'the grave.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the cutting off / middle of my days'; the phrase likely means in the prime or midpoint of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말하기를[a] “내 생애의 한가운데에서 나는 스올의 문들로 가야 합니다[b]. 내 남은 햇수는 빼앗겼습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 자의 영역’이나 ‘무덤’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 날들의 잘림/한가운데에서’라는 뜻이며, 문맥상 삶의 한창때나 중간 지점을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  english_pob_choice: In the middle of my days
  chosen_korean: 내 생애의 한가운데에서
  alternatives_korean:
  - 내 날들의 중간에
  - 내 날들의 한복판에서
  lexicon: HALOT
  rationale: בִּדְמִי는 문자적으로는 난해하지만 문맥상 죽음이 삶의 한창때에 찾아오는 뜻이므로, ‘내 생애의 한가운데에서’로 자연스럽게 옮겨 시의적 함의를 살렸습니다.
- source_word: אֵלֵכָה
  english_pob_choice: I must go through
  chosen_korean: 가야 합니다
  alternatives_korean:
  - 지나가야 합니다
  - 가야만 합니다
  lexicon: HALOT
  rationale: 미완료형의 불가피성을 한국어 의무 표현으로 살려, 예정된 죽음의 필연성을 드러냈습니다.
- source_word: שַׁעֲרֵי שְׁאוֹל
  english_pob_choice: the gates of Sheol
  chosen_korean: 스올의 문들
  alternatives_korean:
  - 음부의 문들
  - 죽은 자들의 세계의 문들
  lexicon: HALOT
  rationale: שְׁאוֹל을 관습적 해석어로 풀지 않고 ‘스올’로 유지해 히브리어 죽음 언어를 보존했고, 복수형 ‘문들’도 그대로 반영했습니다.
- source_word: פֻּקַּדְתִּי יֶתֶר שְׁנוֹתַי
  english_pob_choice: I am deprived of the rest of my years
  chosen_korean: 내 남은 햇수는 빼앗겼습니다
  alternatives_korean:
  - 내 남은 세월은 박탈되었습니다
  - 내 남은 나날은 사라졌습니다
  lexicon: HALOT
  rationale: פֻּקַּדְתִּי의 수동적 상실감을 ‘빼앗겼습니다’로 옮겨, 아직 남아 있어야 할 삶이 끊겨 나간 탄식을 살렸습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 처리
  chosen_reading: 스올
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 구절은 저자의 죽음 언어 내부에서 말하므로 후대의 지옥 개념으로 좁히지 않고, 히브리어 개념을 그대로 유지하는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: '원어 우선 번역 원칙: 해석을 앞당겨 종말론적 의미를 과잉 규정하지 않는다.'
