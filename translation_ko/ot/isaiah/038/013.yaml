  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
  footnotes:
  - marker: a
    text: Or, 'I composed myself until morning.' The opening verb is difficult, and some understand it as self-composure rather than waiting.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from 'he breaks' to 'you bring me to an end,' a poetic change in address preserved in the translation.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 아침까지 기다렸습니다[a]. 마치 사자처럼, 그래서 주께서 내 모든 뼈를 부수십니다[b]. 낮에서 밤까지 주께서 나를 끝내십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 아침까지 제 마음을 가다듬었습니다.’ 이 동사는 난해하며, 일부는 기다림보다 자기 절제나 마음가짐으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그가 부수십니다’에서 ‘주께서 나를 끝내십니다’로 바뀌는 주소 전환을 보입니다. 번역은 이 시적 전환을 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  english_pob_choice: I waited
  chosen_korean: 나는 아침까지 기다렸습니다
  alternatives_korean:
  - 나는 아침까지 제 마음을 가다듬었습니다
  - 나는 아침까지 버텼습니다
  - 나는 아침까지 제 자신을 가다듬었습니다
  lexicon: HALOT
  rationale: 동사 שוה의 난해한 용법을 영어 POB처럼 문맥상 ‘기다리다’로 풀어, עַד בֹּקֶר(아침까지)과 자연스럽게 이어지도록 했습니다.
- source_word: כָּאֲרִי
  english_pob_choice: like a lion
  chosen_korean: 마치 사자처럼
  alternatives_korean:
  - 사자같이
  - 사자처럼
  lexicon: HALOT
  rationale: 비유 표지를 살려 폭력적 압박의 이미지를 직접 유지했습니다.
- source_word: יְשַׁבֵּר כָּל עַצְמוֹתַי
  english_pob_choice: he breaks all my bones
  chosen_korean: 내 모든 뼈를 부수십니다
  alternatives_korean:
  - 내 모든 뼈를 깨십니다
  - 내 모든 뼈를 산산이 부수십니다
  lexicon: HALOT
  rationale: ‘뼈’를 유지해 신체적 고통의 이미지를 보존하고, 한국어에서 자연스러운 ‘부수다’로 강도를 살렸습니다. 주어는 뒤의 2인칭 전환과 맞물리도록 한국어 동사 높임으로 옮겼습니다.
- source_word: תַּשְׁלִימֵנִי
  english_pob_choice: you bring me to an end
  chosen_korean: 주께서 나를 끝내십니다
  alternatives_korean:
  - 주께서 나를 마감하십니다
  - 주께서 나를 완결하십니다
  - 주께서 나를 끝장내십니다
  lexicon: HALOT
  rationale: שלם의 문맥상 의미를 ‘완성’이 아니라 ‘끝맺음/종결’로 이해해, 지나치게 구어적인 표현을 피하면서도 종결의 강한 의미를 담았습니다.
- source_word: מִיּוֹם עַד לַיְלָה
  english_pob_choice: From day to night
  chosen_korean: 낮에서 밤까지
  alternatives_korean:
  - 하루 종일
  - 낮부터 밤까지
  lexicon: HALOT
  rationale: 히브리어의 시간 범위를 직역에 가깝게 살리되, 한국어에서 가장 자연스러운 대구형 표현으로 옮겼습니다.
theological_decisions:
- issue: 13절 후반의 2인칭 전환(he -> you) 보존
  chosen_reading: ‘내 모든 뼈를 부수십니다… 주께서 나를 끝내십니다’로 옮겨, 후반부를 하나님께 직접 말하는 형식으로 유지했습니다.
  alternative_readings:
  - 전 구절을 3인칭으로 통일하기
  - 사자 비유까지 모두 하나님 직접 묘사로 정리하기
  rationale: 히브리어의 시적 전환을 매끈하게 평준화하지 않고 그대로 드러내어, 탄식의 긴장과 호소성을 보존했습니다.
  doctrine_reference: 시적 화법의 주소 전환을 보존
