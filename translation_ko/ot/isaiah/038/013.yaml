    rationale: 히브리어는 ‘그가’에서 2인칭 ‘당신이’로 전환합니다. 초안 본문은 양 행을 모두 ‘주께서’로 처리했고, 각주의 ‘주소 전환’이라는 표현도 정확하지 않습니다.
