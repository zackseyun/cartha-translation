  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
  footnotes:
  - marker: a
    text: Hebrew 'Yah, Yah,' the short poetic form of the divine name; many translations render this 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'I will no longer look on any man with the inhabitants of Hadel'; the final expression is difficult, with חָדֶל carrying the sense of ceasing, frailty, or the realm cut off from ordinary life.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말하기를, “나는 야, 야를 생명의 땅에서 보지 못하겠습니다. 나는 더 이상 세상에 사는 사람을, 끊어진 자들 가운데서 바라보지 못하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 짧은 신명형 יָהּ를 반복한 것으로, 많은 번역본은 이를 ‘주님’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: ‘끊어진 자들’은 희귀어 חָדֶל의 뜻을 죽음으로 단정하지 않고 보존한 번역입니다. 문맥상 ‘죽은 자들의 세계’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 제가 말했습니다
  - 제가 생각하기를
  lexicon: WLC; HALOT
  rationale: 히브리어 완료형 1인칭 단수는 회상 발화를 여는 말이므로, 직접 인용 앞에서 자연스럽고 문어적인 ‘제가 말하기를’로 옮겼습니다.
- source_word: יָהּ יָהּ
  english_pob_choice: Yah, Yah
  chosen_korean: 야, 야
  alternatives_korean:
  - 야훼, 야훼
  - 주님, 주님
  lexicon: WLC; HALOT
  rationale: 본문이 짧은 신명형 יָהּ를 반복하므로, ‘야’를 유지해 형태적 반복과 시적 강조를 보존했습니다.
- source_word: בְּאֶרֶץ הַחַיִּים
  english_pob_choice: in the land of the living
  chosen_korean: 생명의 땅에서
  alternatives_korean:
  - 살아 있는 자들의 땅에서
  - 살아 있는 땅에서
  lexicon: WLC; HALOT
  rationale: 정형적 히브리 관용구의 의미는 살이 있는 존재의 영역이므로, 한국어로는 가장 자연스러운 ‘생명의 땅’으로 옮겼습니다.
- source_word: חָדֶל
  english_pob_choice: inhabitants of cessation
  chosen_korean: 끊어진 자들
  alternatives_korean:
  - 끊어짐의 주민들
  - 멈춘 자들
  - 죽음의 세계에 사는 자들
  lexicon: HALOT
  rationale: 희귀어 חָדֶל의 의미를 죽음/스올로 단정하지 않고 ‘끊어짐, 중단’의 핵심을 살려, 본문이 남겨 두는 모호성을 한국어에서도 유지했습니다.
theological_decisions:
- issue: YHWH가 아니라 קצר형 יָהּ의 반복을 어떻게 처리할지
  chosen_reading: ‘야, 야’로 음역해 반복을 살렸습니다.
  alternative_readings:
  - ‘주님, 주님’으로 번역
  - ‘야훼, 야훼’로 처리
  rationale: 본문은 여호와의 통칭이 아니라 짧은 시적 신명형을 반복하므로, 전통적 대체어보다 원형을 더 직접적으로 드러내는 쪽이 문맥에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선 원칙; YHWH 항목은 יְהוָה에 대한 기본값이며 כאן 적용되지 않음'
