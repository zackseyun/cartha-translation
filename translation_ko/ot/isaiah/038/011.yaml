base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
  footnotes:
  - marker: a
    text: Hebrew 'Yah, Yah,' the short poetic form of the divine name; many translations render this 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'I will no longer look on any man with the inhabitants of Hadel'; the final expression is difficult, with חָדֶל carrying the sense of ceasing, frailty, or the realm cut off from ordinary life.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말했습니다. “저는 살아 있는 이들의 땅에서 야, 야[a]를 보지 못하겠습니다. 저는 더 이상 그침에 사는 이들과 함께 사람을 바라보지 못하겠습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָהּ, יָהּ는 신명의 짧은 시적 형태를 반복한 것입니다. 많은 번역본은 이를 ‘주님’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: ‘그침’으로 옮긴 히브리어 חָדֶל은 드문 말로, 그침·쇠약·일상적인 삶에서 끊어진 상태를 가리킬 수 있습니다. 따라서 이 표현은 ‘죽은 자들의 세계’로 이해될 수도 있으나, 본문에서는 그 뜻을 확정하지 않았습니다.
    reason: lexical_alternative
