id: ISA.38.3
reference: Isaiah 38:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
  footnotes:
  - marker: a
    text: Or 'in truth.' The Hebrew term can denote truth, reliability, or faithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'with an undivided heart' or 'with a perfect heart.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'wept with great weeping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. “아, 야훼여, 부디 제가 주님 앞에서 신실하게[a], 온전한 마음으로[b] 걸어왔고 주님 보시기에 선한 일을 행하였음을 기억해 주십시오.” 히스기야는 크게 울었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실하게’. 히브리어는 진리, 신뢰성, 신실함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나뉘지 않은 마음으로’ 또는 ‘완전한 마음으로’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘큰 울음으로 울었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 본문의 기도문 맥락에서 직접 호칭이므로 한국어 기도체로는 '주님'이 가장 자연스럽습니다. 영어 POB의 이름형 선택(Yahweh)은 주석상 반영하되, 본문에서는 합쇼체 기도 표현을 우선했습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in faithfulness
  chosen_korean: 진실함으로
  alternatives_korean:
  - 신실함으로
  - 진리로
  lexicon: HALOT
  rationale: אֱמֶת는 문맥상 단순한 사실 진술이 아니라 하나님 앞에서의 신실성과 진실성을 함께 가리킬 수 있어, '진실함으로'로 옮겨 두 의미를 무리 없이 살렸습니다.
- source_word: וּבְלֵב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 완전한 마음으로
  - 흠없는 마음으로
  - 한결같은 마음으로
  lexicon: HALOT
  rationale: שָׁלֵם의 핵심은 분열되지 않은 온전함이므로, 죄없음의 뉘앙스를 과도하게 주지 않는 '온전한 마음'을 선택했습니다.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  english_pob_choice: wept greatly
  chosen_korean: 크게 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 심히 울었습니다
  lexicon: HALOT
  rationale: 히브리어의 강한 반복 표현(직역하면 '큰 울음으로 울다')을 자연스러운 현대 한국어로 옮겼습니다. '크게 울었습니다'는 과장 없이 강도를 보존합니다.
theological_decisions:
- issue: 히스기야의 자기 진술이 자기의로 들리지 않도록 하는 문제
  chosen_reading: '''온전한 마음''과 ''진실함''을 함께 살려, 언약적 성실성을 나타내는 진술로 읽었습니다.'
  alternative_readings:
  - 완전한 마음으로
  - 흠없는 마음으로
  rationale: 본문은 히스기야의 무결점 선언이 아니라 하나님 앞에서의 성실한 행보를 호소하는 문맥입니다. 따라서 도덕적 완전성보다 언약적 충실성을 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
