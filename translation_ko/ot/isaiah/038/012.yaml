theological_decisions:
- issue: '열거된 행위자 변화: 3인칭 ‘그가 끊는다’와 2인칭 ‘주님께서 끝내신다’의 보존'
  chosen_reading: 베틀에서의 ‘끊으십니다’는 시적 3인칭 이미지로 두고, 마지막 절은 주님께 대한 직접 호소로 옮겼습니다.
  alternative_readings:
  - 둘 다 주님께 대한 2인칭으로 통일
  - 둘 다 무인칭으로 완화
  rationale: 히브리어는 직조 은유 내부의 행위와 하나님께 대한 직접 호소를 함께 담고 있어, 이를 평탄화하지 않고 남겨야 탄식의 긴장감이 유지됩니다.
  doctrine_reference: Translation philosophy §1, §3
