  text: דּוֹרִ֗/י נִסַּ֧ע וְ/נִגְלָ֛ה מִ/נִּ֖י כְּ/אֹ֣הֶל רֹעִ֑/י קִפַּ֨דְתִּי כָ/אֹרֵ֤ג חַיַּ/י֙ מִ/דַּלָּ֣ה יְבַצְּעֵ֔/נִי מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
  footnotes:
  - marker: a
    text: Or 'My generation has departed and been removed from me like a shepherd’s tent.' The Hebrew word can mean 'generation' or, in this context, 'dwelling/habitation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I have cut off my life like a weaver.' The Hebrew verb is difficult; the translation follows the weaving imagery by rendering it 'rolled up.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the thrum/warp he cuts me off.' The Hebrew term refers more specifically to the loom’s hanging threads.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 거처는 양치기의 천막처럼 뽑혀서 떠나갔습니다[a]. 저는 직공처럼 제 생명을 말아 올렸고[b], 베틀에서 저를 끊으십니다[c]. 낮에서 밤까지 주님께서 저를 끝내십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 세대가 양치기의 천막처럼 떠나가고 제게서 옮겨졌습니다.’ 여기서는 דּוֹר이 ‘세대’보다 ‘거처/거주지’의 뜻에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저는 직공처럼 제 생명을 끊었습니다.’ 히브리어 동사는 어려우며, POB는 직조 이미지를 따라 ‘말아 올리다’로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘베틀의 날실에서 저를 끊으십니다.’ 히브리어는 베틀의 매다는 실을 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  english_pob_choice: my dwelling
  chosen_korean: 제 거처
  alternatives_korean:
  - 제 세대
  - 제 생애
  - 제 거주지
  lexicon: HALOT
  rationale: 이 시구는 장막 이미지와 함께 나오므로 ‘세대’보다 옮겨진 거주 공간의 감각을 살리는 ‘거처’가 원문의 비유에 더 잘 맞습니다.
- source_word: נִסַּע וְנִגְלָה
  english_pob_choice: is pulled up and carried away
  chosen_korean: 뽑혀서 떠나갔습니다
  alternatives_korean:
  - 걷혀서 옮겨졌습니다
  - 뽑혀서 옮겨졌습니다
  - 걷어 올려져 사라졌습니다
  lexicon: HALOT
  rationale: 장막을 걷어 해체해 이동시키는 동작을 한국어로 자연스럽게 살려, 물리적이고 급작스러운 철거의 이미지를 전달했습니다.
- source_word: קִפַּדְתִּי כָאֹרֵג חַיַּי
  english_pob_choice: I have rolled up my life like a weaver
  chosen_korean: 저는 직공처럼 제 생명을 말아 올렸고
  alternatives_korean:
  - 저는 직공처럼 제 생명을 감아 올렸고
  - 저는 직조공처럼 제 생명을 둘둘 말았고
  - 저는 직공처럼 제 삶을 말아 올렸고
  lexicon: HALOT
  rationale: 동사 קִפַּדְתִּי의 난해함을 POB처럼 ‘말아 올리다’로 옮기되, 직조 이미지를 유지하려고 ‘직공’을 사용했습니다.
- source_word: מִדַּלָּה יְבַצְּעֵנִי
  english_pob_choice: from the loom he cuts me off
  chosen_korean: 베틀에서 저를 끊으십니다
  alternatives_korean:
  - 베틀의 날실에서 저를 끊으십니다
  - 베틀에서 저를 잘라내십니다
  - 직조틀에서 저를 끊으십니다
  lexicon: HALOT
  rationale: ‘베틀’은 현대 한국어에서 이해 가능한 직조 도구로, 원문의 직조 은유를 보존하면서도 문맥상 ‘끊다’의 결과를 분명히 드러냅니다.
- source_word: מִיּוֹם עַד לַיְלָה תַּשְׁלִימֵנִי
  english_pob_choice: From day to night you bring me to an end
  chosen_korean: 낮에서 밤까지 주님께서 저를 끝내십니다
  alternatives_korean:
  - 낮부터 밤까지 주님께서 저를 끝내십니다
  - 하루 사이에 주님께서 저를 끝내십니다
  - 낮에서 밤까지 주님께서 저를 마치십니다
  lexicon: HALOT
  rationale: 시간 범위를 간결하게 살리면서, תַּשְׁלִימֵנִי의 ‘끝내다/마치다’ 의미를 현대적이고 단정한 표현으로 옮겼습니다.
theological_decisions:
- issue: '열거된 행위자 변화: 3인칭 ‘그가 끊는다’와 2인칭 ‘주님께서 끝내신다’의 보존'
  chosen_reading: 베틀에서의 ‘끊으십니다’는 시적 3인칭 이미지로 두고, 마지막 절은 주님께 대한 직접 호소로 옮겼습니다.
  alternative_readings:
  - 둘 다 주님께 대한 2인칭으로 통일
  - 둘 다 무인칭으로 완화
  rationale: 히브리어는 직조 은유 내부의 행위와 하나님께 대한 직접 호소를 함께 담고 있어, 이를 평탄화하지 않고 남겨야 탄식의 긴장감이 유지됩니다.
  doctrine_reference: Translation philosophy §1, §3
