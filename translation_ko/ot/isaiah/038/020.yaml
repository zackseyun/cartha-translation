  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֖ה לְ/הוֹשִׁיעֵ֑/נִי וּ/נְגִנוֹתַ֧י נְנַגֵּ֛ן כָּל יְמֵ֥י חַיֵּ֖י/נוּ עַל בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'The LORD will save me,' or more literally, 'The LORD to save me.' The Hebrew expression is elliptical.
    reason: lexical_alternative
  - marker: b
    text: Or, 'my music' or 'my string-music.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'in the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 나를 구원하실 것입니다[a]. 그러므로 우리는 우리의 노래들을 줄악기로 연주하리니[b], 우리의 모든 생애 동안 야훼의 집에서 그러할 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 나를 구원하시려고 하십니다’, 더 직역하면 ‘야훼께 나를 구원하기 위해.’ 히브리어 표현은 생략적입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 음악’ 혹은 ‘내 줄악기 음악’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼의 집 안에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 관용적 대체어가 아니라 고유한 신명으로 드러나므로, POB 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לְהוֹשִׁיעֵנִי
  english_pob_choice: is ready to save me
  chosen_korean: 나를 구원하실 것입니다
  alternatives_korean:
  - 나를 구원하시려고 하십니다
  - 나를 구원하기 위함입니다
  - 나를 구원하실 참입니다
  lexicon: HALOT
  rationale: 히브리어의 생략적 표현은 다윗의 회복을 확신하는 진술로 자연스럽게 읽히므로, ‘구원하실 것입니다’로 다듬어 원문의 구원 행위를 살렸습니다.
- source_word: וּנְגִנוֹתַי נְנַגֵּן
  english_pob_choice: my songs on stringed instruments / we will play
  chosen_korean: 우리의 노래들을 줄악기로 연주하리니
  alternatives_korean:
  - 내 노래들을 악기로 연주하리니
  - 우리의 음악을 연주하리니
  - 줄현악으로 노래하리니
  lexicon: HALOT
  rationale: נְגִינוֹת과 נגן의 결합은 단순한 ‘노래하다’보다 악기 연주를 포함한 음악 행위를 가리키므로, POB의 음성·기악적 뉘앙스를 살려 ‘줄악기로 연주하다’로 옮겼습니다.
- source_word: כָּל יְמֵי חַיֵּינוּ
  english_pob_choice: all the days of our lives
  chosen_korean: 우리의 모든 생애 동안
  alternatives_korean:
  - 우리의 모든 날 동안
  - 우리 생애의 모든 날에
  - 우리의 삶의 모든 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 평생 지속되는 시간을 분명하게 드러내기 위해 ‘우리의 모든 생애 동안’으로 표현했습니다.
- source_word: עַל בֵּית יְהוָה
  english_pob_choice: at the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 집 안에서
  - 야훼의 집에서
  - 야훼의 집에
  lexicon: HALOT
  rationale: עַל의 장소 용법은 맥락상 예배 장소를 가리키므로, 한국어에서는 가장 자연스럽고 예배적 상황에 맞는 ‘야훼의 집에서’로 옮겼습니다.
theological_decisions:
- issue: 신명 יְהוָה의 표기
  chosen_reading: 본문의 신명을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙에 따라 신명은 호칭으로 대체하지 않고, 언약적 고유명으로 드러내는 것이 본문의 의미를 더 정확히 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
