id: ISA.38.19
reference: Isaiah 38:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַ֥י חַ֛י ה֥וּא יוֹדֶ֖/ךָ כָּמ֣וֹ/נִי הַ/יּ֑וֹם אָ֣ב לְ/בָנִ֔ים יוֹדִ֖יעַ אֶל אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
  footnotes:
  - marker: a
    text: Or 'your truth.' The Hebrew אֱמֶת can denote truth, faithfulness, or reliability.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons'; here rendered 'children' because the context speaks of fathers making God's faithfulness known to the next generation generally.
    reason: lexical_alternative
translation:
  language: ko
  text: “살아 있는 자, 살아 있는 자가 오늘 제가 하듯 주님께 감사드립니다. 아버지는 자녀에게[b] 주님의 신실하심을[a] 알립니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 진리’. 히브리어 אֱמֶת은 진리, 신실함, 신뢰성을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘아들들’이지만, 여기서는 아버지가 하나님의 신실하심을 다음 세대 일반에게 알리는 맥락이므로 ‘자녀’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  english_pob_choice: The living, the living
  chosen_korean: “살아 있는 자, 살아 있는 자”
  alternatives_korean:
  - “사는 자, 사는 자”
  - “생명 있는 자, 생명 있는 자”
  lexicon: HALOT
  rationale: 반복의 강조를 살리기 위해 동일한 구조를 그대로 유지했고, חַי의 명사적 용법을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יוֹדֶךָ
  english_pob_choice: he gives thanks to you
  chosen_korean: “당신을 찬송합니다”
  alternatives_korean:
  - “당신께 감사드립니다”
  - “당신을 감사합니다”
  lexicon: HALOT
  rationale: 히필 ידה는 여기서 하나님께 드리는 감사와 찬양의 행위를 가리키므로, 예배적 맥락을 드러내는 ‘찬송합니다’를 택했습니다.
- source_word: כָּמוֹנִי הַיּוֹם
  english_pob_choice: as I do today
  chosen_korean: “오늘의 나처럼”
  alternatives_korean:
  - “오늘 내가 하듯”
  - “오늘의 내 모습처럼”
  lexicon: HALOT
  rationale: 앞절의 감사 행위를 현재의 화자와 비교하는 표현이므로, 영어 audit의 의미를 따라 한국어에서도 비교 구조를 간결하게 유지했습니다.
- source_word: אֱמֶת / אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: “당신의 신실하심”
  alternatives_korean:
  - “당신의 진리”
  - “당신의 진실함”
  - “당신의 신뢰성”
  lexicon: HALOT
  rationale: 이 문맥은 하나님께서 세대에 걸쳐 알려지시는 언약적 신뢰성을 강조하므로, 추상적 ‘진리’보다 인격적·관계적 뉘앙스의 ‘신실하심’이 더 적절합니다.
theological_decisions:
- issue: בָּנִים의 번역 범위
  chosen_reading: 자녀
  alternative_readings:
  - 아들들
  - 아들
  rationale: 문맥상 다음 세대 전체에 대한 전승을 말하므로, 남성 후손으로 좁히지 않고 대표적 의미를 살린 ‘자녀’를 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
- issue: אֱמֶת의 신학적 뉘앙스
  chosen_reading: 신실하심
  alternative_readings:
  - 진리
  - 진실함
  rationale: 본문은 하나님의 성품이 세대 간에 알려지는 것을 말하므로, 교리적 명제보다 언약적 신뢰성을 드러내는 번역이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
