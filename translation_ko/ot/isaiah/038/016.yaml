id: ISA.38.16
reference: Isaiah 38:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
  footnotes:
  - marker: a
    text: Or 'they live' or 'one lives'; the Hebrew verb has no explicit subject.
    reason: lexical_alternative
  - marker: b
    text: Or 'heal me.' The verb can denote making someone well or restoring health.
    reason: lexical_alternative
  - marker: c
    text: Or 'revive me' or 'preserve my life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 이 모든 것으로 사람들이 살아가며, 이 모든 것 안에 제 영의 생명이 있습니다. 그러니 저를 건강하게 회복시켜 주시고, 살게 해 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 모든 것으로’는 עַל의 용법을 따라 도구적·의존적 의미를 살린 것입니다.
    reason: source_note
  - marker: b
    text: ‘건강하게 회복시켜 주시고’는 ‘고쳐 주시고’보다 회복의 뉘앙스를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영’은 כאן의 רוּחַ를 단순한 호흡보다 내적 생명력으로 이해한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 내 주님
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 기도체에서 자연스러운 ‘주님’으로 옮겼습니다. ‘내 주님’은 원문의 소유격을 더 드러내지만 한국어 호칭으로는 다소 부자연스럽습니다.
- source_word: עֲלֵיהֶם / יִחְיוּ
  english_pob_choice: by these things men live
  chosen_korean: 이 모든 것으로 사람들이 살아가며
  alternatives_korean:
  - 이것들로 사람들이 살아가며
  - 사람들은 이것들로 살아가며
  - 사람이 이 모든 것으로 살아가며
  lexicon: HALOT
  rationale: עַל의 도구적·의존적 용법을 반영해 ‘~으로’로 옮겼고, 3인칭 복수의 일반적 인간 주어는 한국어에서 가장 자연스러운 복수 일반화 표현으로 처리했습니다.
- source_word: חַיֵּי רוּחִי
  english_pob_choice: the life of my spirit
  chosen_korean: 제 영의 생명
  alternatives_korean:
  - 내 영의 생명
  - 제 영의 삶
  - 내 숨의 생명
  lexicon: HALOT
  rationale: רוּחַ는 여기서 단순한 호흡보다 내적 생명력을 가리키므로 ‘영’으로 유지했습니다. ‘제 영의 생명’은 소유 관계와 생명/활력의 중첩을 비교적 직접적으로 살립니다.
- source_word: וְתַחֲלִימֵנִי
  english_pob_choice: so restore me to health
  chosen_korean: 저를 건강하게 회복시켜 주시고
  alternatives_korean:
  - 저를 고쳐 주시고
  - 저를 낫게 해 주시고
  - 저를 건강하게 하시고
  lexicon: HALOT
  rationale: חלה의 사역형은 병을 고치는 것보다 건강 상태로 ‘회복’시키는 뉘앙스가 있어, 치료와 회복을 함께 드러내는 표현을 택했습니다.
- source_word: וְהַחֲיֵנִי
  english_pob_choice: and let me live
  chosen_korean: 살게 해 주십시오
  alternatives_korean:
  - 저를 살게 해 주십시오
  - 저의 생명을 보존해 주십시오
  - 저를 살려 주십시오
  lexicon: HALOT
  rationale: חיה의 사역형을 살려 ‘살게 하다’로 옮겨, 단순 생존 유지인지 소생인지 특정하지 않으면서 간구의 어조를 자연스럽게 담았습니다.
theological_decisions:
- issue: 히브리어 3인칭 복수 동사의 무표지 주어 처리
  chosen_reading: ‘사람들이 살아가며’로 일반 인간 전체를 가리키는 뜻으로 번역했습니다.
  alternative_readings:
  - ‘그들이 살아가며’
  - ‘사람이 살아가며’
  - ‘사람들은 살아가며’
  rationale: 원문은 주어를 명시하지 않으며 복수형을 사용합니다. 한국어에서는 자연성과 원문의 일반성을 함께 살리기 위해 보편적 복수 ‘사람들이’로 처리했습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
