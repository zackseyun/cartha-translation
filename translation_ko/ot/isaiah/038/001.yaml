  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּב֣וֹא אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
  footnotes:
  - marker: a
    text: Or, more literally, 'for you are dying' or 'for you are dead'; the Hebrew expression announces certain impending death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 히스기야가 죽을 만큼 병들었고, 아모스의 아들인 예언자 이사야가 그에게 와서 말했습니다. “야훼께서 이렇게 말씀하십니다. 네 집안을 정리하여라. 네가 죽게 되어 있으므로[a], 살지 못할 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 임박한 확정적 죽음을 알리는 말입니다. 문자적으로는 ‘네가 죽어 가고 있다’ 또는 ‘네가 죽어 있다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 시절에
  lexicon: HALOT
  rationale: 시간을 가리키는 관용구로, 한국어에서는 서술 흐름을 자연스럽게 잇는 ‘그때에’가 가장 간결하고 문맥에 맞습니다.
- source_word: חָלָה לָמוּת
  english_pob_choice: became sick to the point of death
  chosen_korean: 죽을 만큼 병들었고
  alternatives_korean:
  - 죽음에 이를 만큼 병들었고
  - 죽을 지경으로 앓았고
  lexicon: HALOT
  rationale: 원문의 병이 곧 죽음에 이를 정도였다는 결과적 강도를 살리면서도, ‘to the point of death’의 의미를 한국어로 자연스럽게 옮겼습니다.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  english_pob_choice: Isaiah the prophet, the son of Amoz
  chosen_korean: 아모스의 아들 예언자 이사야
  alternatives_korean:
  - 아모스의 아들 이사야 예언자
  - 예언자 아모스의 아들 이사야
  lexicon: HALOT
  rationale: 히브리어의 이름-호칭 구조를 보존하면서도, 한국어에서는 수식어를 앞에 두는 편이 자연스러워 이렇게 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 공적·권위 있는 어조를 살리기 위해 ‘이렇게 말씀하십니다’를 선택했고, יְהוָה는 본 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: צַו לְבֵיתֶךָ
  english_pob_choice: Set your house in order
  chosen_korean: 네 집안을 정리하여라
  alternatives_korean:
  - 네 집에 질서를 세워라
  - 네 집을 정돈하여라
  lexicon: HALOT
  rationale: 직역인 ‘명령하라’보다 죽음을 앞둔 준비라는 관용적 의미를 드러내는 쪽이 원문 기능에 더 가깝습니다. 여기서 ‘집안’은 가정과 재산, 삶의 일들을 함께 포괄합니다.
- source_word: וְלֹא תִחְיֶה
  english_pob_choice: you shall not live
  chosen_korean: 너는 살지 못할 것이다
  alternatives_korean:
  - 너는 살아남지 못할 것이다
  - 너는 살 수 없을 것이다
  lexicon: HALOT
  rationale: 직설적인 부정 예언을 한국어의 자연스러운 미래 부정으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문은 하나님의 고유명을 직접 사용하므로, 프로젝트 기본값에 따라 신명기를 일반 호칭으로 완화하지 않고 야훼로 옮겼습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 죽음 선언의 강도
  chosen_reading: ‘죽을 것이기 때문이다. 너는 살지 못할 것이다’로 확정적 죽음 선고를 유지함
  alternative_readings:
  - ‘네가 죽게 되었기 때문이다. 너는 살지 못할 것이다’
  - ‘너는 곧 죽을 것이다. 너는 살지 못할 것이다’
  rationale: 히브리어의 확정적 예언 선고를 약화시키지 않되, 한국어에서 자연스러운 미래 선고로 표현했습니다. 의학적 회복 여부보다 ‘죽음’ 자체를 선고하는 문맥입니다.
  doctrine_reference: Isaiah 38:1 prophetic announcement of impending death
