review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, Hezekiah's grave illness, Isaiah's identity, the divine name, and the certain death announcement. ‘죽을 만큼 병들었고’ is an acceptable rendering of חָלָה לָמוּת. For כִּי מֵת אַתָּה, ‘죽게 되어 있으므로’ naturally conveys the participial announcement of imminent and certain death without the contextually impossible implication that Hezekiah is already dead.
  naturalness: The repeated ‘그에게 와서 그에게 말했습니다’ follows Hebrew repetition too mechanically and is unnatural in Korean; the second phrase can be omitted without loss. ‘아모스의 아들인 예언자 이사야’ is smoother than the stacked modifier in the draft. The prophetic direct speech appropriately retains an authoritative imperative, while the narrative remains in modern formal-polite style.
  terminology: ‘야훼,’ ‘히스기야,’ ‘이사야,’ and ‘아모스’ are appropriate project-consistent Korean forms. ‘집안을 정리하여라’ suitably communicates the contextual sense of צַו לְבֵיתֶךָ without narrowing it to medical recovery or merely a physical house.
  issues:
  - severity: low
    issue: Redundant Korean object phrase
    rationale: The Hebrew repeats אֵלָיו (‘to him’) with both ‘came’ and ‘said,’ but repeating ‘그에게’ in Korean produces avoidable stiffness.
  - severity: low
    issue: Footnote wording and anchor placement
    rationale: ‘이미 닥칠 확정적 죽음’ is not idiomatic Korean. The note should say ‘임박한 확정적 죽음,’ and its marker should be placed directly after the death-announcement phrase it explains.
  revised_text: 그때에 히스기야가 죽을 만큼 병들었고, 아모스의 아들인 예언자 이사야가 그에게 와서 말했습니다. “야훼께서 이렇게 말씀하십니다. 네 집안을 정리하여라. 네가 죽게 되어 있으므로[a], 살지 못할 것이다.”
  revised_footnotes:
