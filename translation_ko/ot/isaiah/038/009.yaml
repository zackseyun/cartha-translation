translation:
  language: ko
  text: '유다 왕 히스기야가 병들었다가 병에서 회복한 뒤에 쓴 글입니다[a][b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘글’로 옮긴 히브리어 מִכְתָּב은 정확한 장르를 특정하지 않으며, 시·기록·문서 등 폭넓은 범주의 글이나 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 병에서 살았다’입니다. 여기서는 병에서 회복되었다는 관용적 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  english_pob_choice: A writing
  chosen_korean: 글
  alternatives_korean:
  - 글쓴 것
  - 기록
  - 시
  lexicon: HALOT
  rationale: 히브리어 מִכְתָּב은 장르를 특정하지 않는 문서/작품을 넓게 가리키므로, 형식이 단정적이지 않은 ‘글’이 가장 무난하고 원문에 충실합니다.
- source_word: לְחִזְקִיָּהוּ
  english_pob_choice: of Hezekiah
  chosen_korean: 히스기야의
  alternatives_korean:
  - 히스기야에게
  - 히스기야를 위한
  lexicon: HALOT
  rationale: 머리말에서 לְ는 저자/소속을 나타내는 용법으로 읽히므로, 한국어 제목형 표현인 ‘히스기야의’가 자연스럽습니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 임금
  lexicon: HALOT
  rationale: 히브리어 소유/관계 구조를 간결하게 옮기면 ‘유다 왕’이 가장 직접적이며, 왕의 직함을 자연스럽게 드러냅니다.
- source_word: וַיְחִי מֵחָלְיֹו
  english_pob_choice: had recovered from his sickness
  chosen_korean: 병에서 회복되었을 때
  alternatives_korean:
  - 병에서 살아났을 때
  - 병에서 나았을 때
  - 병에서 되살아났을 때
  lexicon: HALOT
  rationale: 직역하면 ‘그리고 그가 병에서 살았다’이지만 문맥상 질병에서 벗어나 회복되었다는 뜻이므로, 한국어에서는 ‘회복되었다’로 자연스럽게 전달했습니다.
theological_decisions:
- issue: וַיְחִי의 관용적 의미를 어떻게 살릴지
  chosen_reading: ‘회복되었다’로 번역해 육체적 소생/부활이 아니라 병에서의 회복임을 분명히 했습니다.
  alternative_readings:
  - ‘살았다’로 직역
  - ‘되살아났다’
  rationale: 본문은 치유 후의 상태를 말하는 문맥이므로, 과도한 신학적 확대를 피하면서도 원문의 관용적 의미를 살리는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 치유 서술
