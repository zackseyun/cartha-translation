  source_fidelity: 개정이 필요합니다. 히브리어는 ‘너를’과 ‘이 성읍을’ 모두 ‘앗수르 왕의 손에서’ 건져 내겠다는 병렬 목적어 구조입니다. 초안의 쉼표는 ‘이 성읍에서’를 별도의 출발점처럼 읽히게 하여 이 구조를 흐립니다.
