base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
  footnotes:
  - marker: a
    text: Or 'from the grasp of the king of Assyria.' The Hebrew idiom is literally 'from the hand of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 앗수르 왕의 손에서, 이 성읍에서 건져 내겠고, 이 성읍을 내가 지키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손에서’는 히브리어 관용구를 따른 표현입니다. 직역하면 ‘왕의 손에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף
  english_pob_choice: from the hand of
  chosen_korean: ~의 손에서
  alternatives_korean:
  - ~의 권세에서
  - ~의 손아귀에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서도 ‘손’이 권세·지배를 가리키는 생생한 이미지를 유지하므로 ‘손에서’로 옮겼습니다.
- source_word: מֶלֶךְ אַשּׁוּר
  english_pob_choice: the king of Assyria
  chosen_korean: 앗수르 왕
  alternatives_korean:
  - 아시리아 왕
  - 앗수르의 왕
  lexicon: HALOT
  rationale: 고유명사와 왕호의 결합을 자연스럽게 살리면서, 성경에서 통용되는 ‘앗수르’ 표기를 유지했습니다.
- source_word: אַצִּילְךָ
  english_pob_choice: I will deliver you
  chosen_korean: 건져 내겠고
  alternatives_korean:
  - 구해 주겠고
  - 구출하겠고
  - 건져 주겠고
  lexicon: HALOT
  rationale: נצל의 ‘위험에서 빼내다’는 뉘앙스를 살리면서, 구원론적 의미를 과도하게 덧입히지 않기 위해 ‘건져 내다’를 택했습니다.
- source_word: וְגַנּוֹתִי
  english_pob_choice: and I will defend
  chosen_korean: 지키겠습니다
  alternatives_korean:
  - 보호하겠습니다
  - 방어하겠습니다
  - 가리겠습니다
  lexicon: HALOT
  rationale: גנן의 보호·방어 의미를 한국어에서 가장 자연스럽게 드러내는 동사로 ‘지키다’를 선택했습니다.
theological_decisions:
- issue: 역사적 구원 약속의 번역 어조
  chosen_reading: 여호와의 역사적 보호 약속으로 읽고, ‘건져 내다/지키다’의 군사적 맥락을 유지했습니다.
  alternative_readings:
  - 구원하다
  - 살리다
  rationale: 이 절은 앗수르의 위협에서 예루살렘을 보존하겠다는 역사적 선언이므로, 일반적 구원 언어로 확대하지 않고 본문 범위 안에서 번역했습니다.
  doctrine_reference: '번역 원리: 본문이 말하는 역사적 구원과 영적 구원을 구분하여 과잉신학화를 피함.'
