  terminology: ‘앗수르 왕’, ‘손에서’, ‘건져 내다’, ‘지키다’는 각각 원문의 명칭, 관용적 이미지, 구출 및 군사적 보호의 의미를 적절히 살립니다. ‘손에서’에 대한 주석은 ‘손바닥’이라는 지나치게 협소한 직역보다 권세·지배를 나타내는 관용적 기능을 밝혀 주는 편이 정확합니다.
