reference: Isaiah 38:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
  footnotes:
  - marker: a
    text: Or 'this matter' or 'this word'; Hebrew davar can refer to a thing, matter, or spoken word.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이것이 야훼께서 당신에게 주시는 표징입니다. 야훼께서 바로 이 일을 행하시리니, 곧 그분이 말씀하신 이 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 다바르(davar)는 여기서 '말'뿐 아니라 '일/사건/일련의 일'을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
  - 표지
  - 징조
  - sign
  lexicon: HALOT
  rationale: 예언적 확인 표지라는 기능을 살리면서, 단순한 일반 표지보다 하나님이 주시는 확증의 뉘앙스를 더 분명히 하기 위해 '표징'을 택했습니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼께서 주시는
  alternatives_korean:
  - 야훼로부터 오는
  - 야훼로부터
  - 주께서 주시는
  lexicon: HALOT
  rationale: 출처를 나타내는 표현을 한국어에서 자연스럽게 풀어 '주시는'으로 옮겨, 표징의 기원이 야훼께 있음을 드러냈습니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이 말
  - 이 말씀
  - 이 사건
  lexicon: HALOT
  rationale: דבר가 여기서는 단순한 '말'보다 이미 선포된 약속의 실현을 가리키므로, 행위와 성취를 함께 담을 수 있는 '이 일'로 옮겼습니다.
- source_word: דִּבֵּר
  english_pob_choice: has spoken
  chosen_korean: 말씀하신
  alternatives_korean:
  - 말하신
  - 이야기하신
  - 선포하신
  lexicon: HALOT
  rationale: 하나님이 하신 발화를 존중하면서도 한국어 예언 문맥에 맞게 '말씀하신'을 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 신명사를 POB 기준에 따라 음역하여, 언약의 고유 이름을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 말씀의 대상과 표징의 관계
  chosen_reading: 야훼께서 ... 주시는 표징 / 야훼께서 바로 이 일을 행하시리니
  alternative_readings:
  - 야훼께서 ... 주시는 징조
  - 이것이 ... 표징입니다
  rationale: 표징은 단지 미래를 암시하는 현상이 아니라, 야훼께서 말씀하신 일을 실제로 행하신다는 확인입니다. 그래서 표징과 성취를 한 문장 안에서 긴밀히 연결했습니다.
  doctrine_reference: 예언 성취와 하나님의 신실하심
