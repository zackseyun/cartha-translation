  source_fidelity: ‘יוֹרְדֵי בוֹר’는 문자적으로 ‘구덩이로 내려가는 이들’이며 죽음의 영역을 가리키는 시적 표현입니다. 초안의 ‘무덤’은 가능한 해석이지만, 본문의 구체적 이미지를 평준화하므로 ‘구덩이’를 유지하는 편이 원문과 영어 POB의 선택에 더 충실합니다. 또한 תודךָ와 יהללךָ의 병행을 ‘감사하다/찬양하다’로 구별했습니다.
  naturalness: 수정문은 현대 표준어의 격식 있는 합쇼체로 자연스럽게 읽히며, 시적 병행 구조도 유지합니다. ‘스올’과 ‘죽음’의 의인화된 주어는 원문의 표현을 그대로 보존합니다.
  terminology: ‘스올’, ‘구덩이’, ‘신실하심’을 유지했습니다. ‘신실하심’은 אֱמֶת의 문맥상 ‘진리’와 함께 가능한 ‘신실함/신뢰성’의 뜻을 적절히 드러냅니다. 각주 b는 ‘바라다’와 ‘기다리다’라는 동사 선택의 대안 및 목적어의 대안을 명료하게 제시하도록 고쳤습니다.
