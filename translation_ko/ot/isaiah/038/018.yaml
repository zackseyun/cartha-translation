id: ISA.38.18
reference: Isaiah 38:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead' for 'Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not wait for your truth.' The Hebrew can also be rendered 'hope for your truth/faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 스올[a]이 주께 감사하지 못하고, 죽음이 주를 찬양하지 못하며, 구덩이로 내려가는 이들이 주의 신실하심[b]을 바라지 못하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 ‘무덤’ 또는 ‘죽은 자들의 영역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 진리’로도 옮길 수 있습니다. 히브리어 동사는 ‘바라다’ 또는 ‘기다리다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽음의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 살리기 위해 일반어로 풀지 않고 음역했습니다. '무덤'은 여기서 제시된 대안이지만, 스올의 의미 범위를 충분히 담지 못합니다.
- source_word: תּוֹדֶךָּ
  english_pob_choice: thank you
  chosen_korean: 주를 찬송하지 못하고
  alternatives_korean:
  - 주께 감사하지 못하고
  - 주를 기뻐하며 감사하지 못하고
  lexicon: HALOT
  rationale: 히브리어 ידה의 '감사하다/찬송하다' 의미를 반영하되, 시적 병행구에서 다음 행의 '찬양하다'와 구별되도록 '찬송하다'로 옮겼습니다.
- source_word: יוֹרְדֵי בוֹר
  english_pob_choice: those who go down to the pit
  chosen_korean: 무덤으로 내려가는 자들이
  alternatives_korean:
  - 구덩이로 내려가는 자들이
  - 구렁으로 내려가는 자들이
  lexicon: HALOT
  rationale: 직역의 이미지인 'pit'을 살리되, 한국어에서 자연스럽고 읽기 쉬운 표현으로 '무덤'을 택했습니다. 본문 비유를 너무 약화시키지 않으면서도 현대 독자가 이해할 수 있습니다.
- source_word: אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주의 신실하심
  alternatives_korean:
  - 주의 진실
  - 주의 진리
  - 주의 신실함
  lexicon: HALOT
  rationale: 문맥상 '바라다/기다리다'의 목적어로서는 추상적 '진리'보다 언약적 신뢰성을 가리키는 '신실하심'이 더 적절합니다. 주님의 성품을 강조하는 한국어 표준 종교어도 유지했습니다.
theological_decisions:
- issue: 스올과 죽음이 무엇을 '못하는가'에 대한 범위
  chosen_reading: 이 절은 땅 위의 예배와 감사의 부재를 시적으로 말하는 것으로 읽었습니다.
  alternative_readings:
  - 죽은 자의 의식적 활동 자체가 전적으로 불가능하다는 더 강한 존재론적 진술
  rationale: 히브리 시의 병행법은 스올/죽음/구덩이에 내려가는 자들이 현재의 공적 찬송과 신뢰의 표현을 하지 못함을 강조합니다. 본문이 중간 상태 전반에 대한 교리 명제로 확장되지 않도록 여지를 남겼습니다.
  doctrine_reference: 교리보다 시적 발화를 우선하며, 본문이 말하는 범위를 넘겨 단정하지 않습니다.
