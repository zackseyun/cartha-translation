- from: 이는 스올이 주를 찬송하지 못하고, 죽음이 주를 찬양하지 못하며, 무덤으로 내려가는 자들이 주의 신실하심을 바라지 못하기 때문입니다.[a][b]
  to: 이는 스올[a]이 주께 감사하지 못하고, 죽음이 주를 찬양하지 못하며, 구덩이로 내려가는 이들이 주의 신실하심[b]을 바라지 못하기 때문입니다.
