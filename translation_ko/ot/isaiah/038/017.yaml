source:
  edition: WLC
  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
  footnotes:
  - marker: a
    text: Or, 'you have loved my soul out of the pit of destruction.' The Hebrew verb can carry the sense of deep attachment or love.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 제 평안을 위하여 저는 큰 쓰라림을 겪었습니다. 그러나 주께서는 제 영혼이 멸망의 구덩이에 이르지 않도록 붙들어 주셨으니[a] 제 모든 죄를 주의 등 뒤로 던지셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 제 영혼을 멸망의 구덩이에서 사랑하셨습니다.’ 히브리어 동사는 깊은 애착이나 사랑의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשָׁלוֹם
  english_pob_choice: for my peace
  chosen_korean: 제 평안을 위하여
  alternatives_korean:
  - 제 평안에 대하여
  - 저의 평안을 위해
  - 평안을 위해
  lexicon: HALOT
  rationale: לְ + שָׁלוֹם의 목적·관계 감각을 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘제 평안을 위하여’를 택했습니다.
- source_word: מַר לִי מָר
  english_pob_choice: I had great bitterness
  chosen_korean: 큰 쓰라림을 겪었습니다
  alternatives_korean:
  - 큰 괴로움이 있었습니다
  - 쓰라리고 쓰라렸습니다
  - 깊은 쓰라림이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 반복적 강조를 그대로 직역하기보다, 한국어에서 중복 없이 강도를 살릴 수 있는 ‘큰 쓰라림’을 사용했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 저 자신
  - 제 혼
  lexicon: HALOT
  rationale: 이 구절에서는 נפש가 단순히 생명보다 인격적·내면적 실재를 가리키므로 ‘제 영혼’이 원문의 이미지를 가장 잘 보존합니다.
- source_word: מִשַּׁחַת בְּלִי
  english_pob_choice: from the pit of destruction
  chosen_korean: 멸망의 구덩이
  alternatives_korean:
  - 파멸의 구덩이
  - 멸절의 구덩이
  - 파괴의 구덩이
  lexicon: HALOT
  rationale: שַׁחַת의 ‘구덩이’ 이미지와 בְּלִי의 파멸적 뉘앙스를 함께 살려 ‘멸망의 구덩이’로 옮겼습니다.
- source_word: אַחֲרֵי גֵוְךָ
  english_pob_choice: behind your back
  chosen_korean: 주의 등 뒤로
  alternatives_korean:
  - 주의 뒤로
  - 주의 눈 밖으로
  - 주의 시야 밖으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘보이지 않게, 더는 돌보지 않게’라는 효과를 한국어 관용에 가까운 ‘등 뒤로’로 옮겼습니다.
theological_decisions:
- issue: חָשַׁקְתָּ נַפְשִׁי의 의미를 애정으로 풀지, 구출 행위로 풀지
  chosen_reading: 본문은 구출의 결과를 분명히 드러내므로 ‘제 영혼을 … 붙들어 두셨으니’로 옮기고, 사랑의 뉘앙스는 본문이 허용하는 범위 안에서만 남겼습니다.
  alternative_readings:
  - 저의 영혼을 사랑하셨습니다
  - 제 영혼에 애착을 두셨습니다
  - 제 영혼을 구덩이에서 사랑으로 건져 주셨습니다
  rationale: 히브리어 동사는 애정/애착을 뜻할 수 있으나, 이 문맥에서는 죽음에서 보전하신 하나님의 행동이 중심입니다. 따라서 신학적 초점을 과도하게 ‘사랑’으로 이동시키지 않았습니다.
  doctrine_reference: 본문의 긴장 보존
- issue: ‘behind your back’의 관용을 신학적으로 어떻게 처리할지
  chosen_reading: 죄를 ‘주의 등 뒤로 던지셨다’고 하여, 하나님이 죄를 더 이상 보지 않으시고 기억하지 않으시는 처리의 이미지를 유지했습니다.
  alternative_readings:
  - 주의 눈 밖으로 던지셨다
  - 주의 시야 밖으로 던지셨다
  - 주의 뒤로 치워 두셨다
  rationale: 히브리어 관용구는 단순한 공간 이동이 아니라 죄에 대한 완전한 제거와 무시의 이미지를 담고 있으므로, 그 효과를 분명히 살렸습니다.
  doctrine_reference: 죄 사함의 관용 표현
