lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그러자 … 임하여
  alternatives_korean:
  - 그리고 … 이르러
  - 그때 … 와서
  lexicon: HALOT
  rationale: 서술 진행을 알리는 waw-consecutive의 기능을 한국어 서술 흐름에 맞게 자연스럽게 살리되, 이어지는 예언 공식의 도착감을 유지하기 위해 ‘임하여’를 택했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 예언 공식의 관용구를 살려 ‘말씀’으로 옮겼고, 신명 표기는 POB 원칙에 따라 ‘야훼’로 유지했습니다.
- source_word: אֶל יְשַׁעְיָהוּ
  english_pob_choice: to Isaiah
  chosen_korean: 이사야에게
  alternatives_korean:
  - 이사야를 향해
  - 이사야 쪽으로
  lexicon: HALOT
  rationale: 수신 대상을 표시하는 전치사 אֶל은 한국어에서 여격 조사 ‘-에게’가 가장 직접적이고 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르시기를
  lexicon: HALOT
  rationale: 히브리어의 인용 도입어는 한국어에서 다음 절의 직접 화법을 예고하는 서술 동사로 처리하는 것이 가장 읽기 자연스럽습니다.
theological_decisions:
- issue: 여호와(개신교 전통명) 대신 야훼 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 언약명을 가리키므로, 전통적 대체칭호보다 원문 고유명 표기를 우선해 독자가 이를 분명히 인지하도록 했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: 히브리어 예언 공식의 서술 리듬
  chosen_reading: ‘임하여’로 도착·개시의 느낌을 유지
  alternative_readings:
  - ‘이르러’
  - ‘왔다’
  rationale: 단순히 ‘왔다’로 평준화하면 예언 계시가 주어지는 장면의 문체적 무게가 약해지므로, 계시 개시를 드러내는 동사를 유지했습니다.
  doctrine_reference: Source-grounded narrative style
