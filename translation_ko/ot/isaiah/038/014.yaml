  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
  footnotes:
  - marker: a
    text: Or, following a traditional identification, 'Like a swallow or a crane.' The first bird name is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 제비나 학처럼[a] 지저귀며, 비둘기처럼 신음합니다. 제 눈은 위를 향해 지쳐 갑니다. 주님, 저는 압박을 받고 있습니다. 저를 위하여 보증하여 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 번째 새 이름의 정확한 식별은 불확실합니다. 전통적으로는 ‘제비’로 이해하기도 합니다.
    reason: lexical_alternative
