  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/ס֤וּס עָגוּר֙ כֵּ֣ן אֲצַפְצֵ֔ף אֶהְגֶּ֖ה כַּ/יּוֹנָ֑ה דַּלּ֤וּ עֵינַ/י֙ לַ/מָּר֔וֹם אֲדֹנָ֖/י עָֽשְׁקָה לִּ֥/י עָרְבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
  footnotes:
  - marker: a
    text: Or, following a traditional identification, 'Like a swallow or a crane.' The first bird name is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 제비나 학처럼 지저귀며, 비둘기처럼 신음합니다. 내 눈이 위를 바라보다가 쇠약해집니다. 주님, 저는 압박을 받고 있으니 저의 보증인이 되어 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 번째 새 이름은 전통적으로 ‘제비’로도 이해되며, 본문은 그 정확한 조류 식별을 확정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  english_pob_choice: Like a swift or a crane
  chosen_korean: 제비나 학처럼
  alternatives_korean:
  - 새매처럼
  - 따오기처럼
  lexicon: HALOT
  rationale: 첫 번째 새 이름은 본문상 불확실하므로 한국어도 특정 종을 단정하지 않고 익숙한 조류 표현으로 ambiguity를 살렸습니다.
- source_word: אֲצַפְצֵף
  english_pob_choice: I chirp
  chosen_korean: 지저귀며
  alternatives_korean:
  - 짹짹거리며
  - 지저귑니다
  lexicon: HALOT
  rationale: 새의 높고 짧은 울음소리를 자연스러운 한국어 동사로 옮겨, 약한 탄식의 음향적 이미지를 살렸습니다.
- source_word: אֶהְגֶּה
  english_pob_choice: I moan
  chosen_korean: 신음합니다
  alternatives_korean:
  - 신음하며
  - 탄식합니다
  lexicon: HALOT
  rationale: 단순한 중얼거림보다 고통스러운 탄식이 문맥에 더 맞아, lament의 뉘앙스를 분명히 드러내는 표현을 택했습니다.
- source_word: דַּלּוּ עֵינַי
  english_pob_choice: My eyes grow weak
  chosen_korean: 내 눈이 … 쇠약해집니다
  alternatives_korean:
  - 내 눈이 약해집니다
  - 내 눈이 지쳐 갑니다
  lexicon: HALOT
  rationale: 눈이 피로해지고 힘이 빠지는 관용을 한국어로 자연스럽게 살리되, 비유적 긴장을 유지했습니다.
- source_word: עָרְבֵנִי
  english_pob_choice: be my pledge
  chosen_korean: 저의 보증인이 되어 주십시오
  alternatives_korean:
  - 저를 위해 보증해 주십시오
  - 저의 담보가 되어 주십시오
  lexicon: HALOT
  rationale: 법적·관계적 의미의 ערב를 현대 한국어에서 이해 가능한 ‘보증인’으로 풀어, 단순한 ‘도와주십시오’보다 원문의 책임적 이미지를 보존했습니다.
theological_decisions:
- issue: 아도나이(אֲדֹנָי)의 한국어 호칭
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 나의 주님
  rationale: 하나님께 직접 부르는 호칭이므로 합쇼체 기도체로 ‘주님’이라 옮겨 존대와 직접성이 함께 드러나게 했습니다.
  doctrine_reference: Title rendering policy for divine address
- issue: אֲצַפְצֵף / אֶהְגֶּה의 정서적 강도
  chosen_reading: 지저귀며 … 신음합니다
  alternative_readings:
  - 짹짹거리며 … 중얼거립니다
  - 지저귀며 … 탄식합니다
  rationale: 새 울음소리 비유와 고통의 탄식이 병렬되는 구조를 살려, 가벼운 소리와 깊은 고통의 대비가 드러나게 했습니다.
  doctrine_reference: Preserve rhetorical force and lament imagery
