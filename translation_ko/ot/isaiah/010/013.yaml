id: ISA.10.13
reference: Isaiah 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
  footnotes:
  - marker: a
    text: Or “their stores,” “their possessions,” or “their wealth laid up.” The Hebrew term is rare and likely refers to accumulated riches.
    reason: lexical_alternative
  - marker: b
    text: Or “the inhabitants.” The Hebrew participle can mean those who dwell, but in context it may refer more specifically to those seated in power.
    reason: lexical_alternative
  - marker: c
    text: Or “like a mighty one.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이렇게 말합니다[a]. “내 손의 힘으로 내가 이 일을 이루었고, 내 지혜로도 이루었습니다. 내가 총명하기 때문입니다. 내가 민족들의 경계를 없애고, 그들이 쌓아 둔 재물을 약탈했으며[c], 강한 자처럼 앉아 있는 자들을 끌어내렸습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 말하였다”라고 옮길 수 있습니다. 히브리어 완료형은 여기서 그가 되풀이하여 드러내는 대표적인 발화를 나타내는 것으로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: 또는 “거주하는 자들”이라고 옮길 수 있습니다. 히브리어 분사는 문자적으로 ‘앉아 있는 자들’ 또는 ‘사는 자들’을 뜻합니다. 문맥상 권세 있는 자들을 가리킨다는 해석도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들의 창고”, “그들의 소유물”, 또는 “그들이 쌓아 둔 재물”이라고 옮길 수 있습니다. 이 히브리어 표현은 드물며, 문맥상 축적해 둔 부를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחַ יָדִי
  english_pob_choice: By the strength of my hand
  chosen_korean: 내 손의 힘으로
  alternatives_korean:
  - 내 손의 능력으로
  - 내 손의 권세로
  lexicon: HALOT
  rationale: ‘כֹחַ’의 핵심은 힘/능력이며, ‘손’의 구체적 이미지가 붙은 자가당착적 자랑을 한국어에서도 자연스럽게 살렸습니다.
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  english_pob_choice: and by my wisdom, for I have understanding
  chosen_korean: 내 지혜로는, 내가 통찰력이 있기 때문이다
  alternatives_korean:
  - 내 지혜로, 내가 분별력이 있기 때문이다
  - 내 지혜로, 내가 이해력이 있기 때문이다
  lexicon: HALOT
  rationale: ‘חָכְמָה’와 ‘נבון’의 병행을 살리되, 뒤의 절을 단순 반복하지 않고 ‘통찰력/분별력’으로 구별해 자만의 논리를 드러냈습니다.
- source_word: וַאֲסִיר גְּבוּלוֹת עַמִּים
  english_pob_choice: I remove the boundaries of peoples
  chosen_korean: 내가 민족들의 경계를 옮기고
  alternatives_korean:
  - 내가 민족들의 경계를 없애고
  - 내가 백성들의 경계를 옮기고
  lexicon: HALOT
  rationale: ‘גְּבוּלוֹת’는 국경/경계의 이동을 뜻하므로 ‘옮기고’가 가장 직접적입니다. ‘민족들’은 עַמִּים을 현대 한국어에서 과도하게 국가 개념으로 좁히지 않으면서도 자연스럽게 옮깁니다.
- source_word: וַעֲתִידֹתֵיהֶם
  english_pob_choice: their treasures
  chosen_korean: 그들의 재물
  alternatives_korean:
  - 그들의 축적한 재물
  - 그들의 저장한 것
  lexicon: HALOT
  rationale: 히브리어가 희귀하여 해석 폭이 있으나, 본문 문맥상 약탈 대상인 축적된 부를 가리키므로 더 포괄적인 ‘재물’로 두고, 영어 POB의 대안을 각주로 반영했습니다.
- source_word: יוֹשְׁבִים
  english_pob_choice: those who sit enthroned
  chosen_korean: 보좌에 앉아 있는 자들
  alternatives_korean:
  - 거주하는 자들
  - 앉아 있는 자들
  lexicon: HALOT
  rationale: 문맥상 단순 거주민보다 권좌에 앉은 통치층을 가리키는 의미가 강하므로, POB의 해석을 따라 ‘보좌에 앉아 있는 자들’로 옮겼습니다.
theological_decisions:
- issue: 13절의 화자 귀속
  chosen_reading: 앗수르 왕의 교만한 자기과시를 직접 인용하는 것으로 옮겼습니다.
  alternative_readings:
  - 앗수르 전체를 의인화한 집단적 발화로 볼 수 있습니다.
  rationale: 앞뒤 문맥(10:12–15)이 앗수르 왕의 교만한 마음을 정면으로 다루므로, 히브리어 단수 화자를 유지하되 집단적 적용 가능성은 닫지 않았습니다.
  doctrine_reference: 문맥 귀속과 대표 발화
- issue: ‘보좌에 앉아 있는 자들’의 해석
  chosen_reading: 권세를 가진 통치자들을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 일반 거주민으로 넓게 볼 수 있습니다.
  rationale: 히브리어 분사가 단순 거주를 뜻할 수 있으나, ‘끌어내립니다’와 결합될 때 왕권을 가진 자들의 전복이라는 의미가 더 선명합니다.
  doctrine_reference: 본문 문맥에 따른 의미 범위
