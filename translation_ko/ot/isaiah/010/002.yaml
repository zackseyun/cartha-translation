id: ISA.10.2
reference: Isaiah 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
  footnotes:
  - marker: a
    text: Or 'the poor of my people.' The Hebrew term can denote poverty, affliction, or oppression.
    reason: lexical_alternative
  - marker: b
    text: Or 'orphans.' Literally 'the fatherless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이들을 정의에서 벗어나게 하고, 내 백성의 곤고한 이들의 권리를 빼앗으며, 과부들을 그들의 노획물로 삼고, 고아들을 약탈하려고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난한 이들’은 여기서 빈곤뿐 아니라 압제와 억눌림을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고아들’은 문자적으로는 ‘아버지 없는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין
  english_pob_choice: to turn aside ... from justice
  chosen_korean: 정의에서 벗어나게 하다
  alternatives_korean:
  - 정의를 비뚤어지게 하다
  - 공의를 돌이키게 하다
  lexicon: HALOT
  rationale: 히필형의 ‘돌리다/치우게 하다’라는 동작을 한국어 관용으로 자연스럽게 살리면서, משפט/דין의 법정적 힘을 ‘정의’로 전달했습니다.
- source_word: דַּלִּים
  english_pob_choice: the poor
  chosen_korean: 가난한 이들
  alternatives_korean:
  - 가난한 자들
  - 약한 자들
  lexicon: HALOT
  rationale: 사회적으로 취약한 집단을 가리키는 기본 의미를 살리되, 현대 한국어에서 덜 낡고 덜 계층적 표현인 ‘이들’을 택했습니다.
- source_word: עֲנִיֵּי עַמִּי
  english_pob_choice: the afflicted of my people
  chosen_korean: 내 백성의 곤고한 이들
  alternatives_korean:
  - 내 백성의 가난한 이들
  - 내 백성의 억눌린 이들
  lexicon: HALOT
  rationale: עָנִי의 ‘가난함’과 ‘억눌림/곤고함’이 함께 걸려 있으므로, 단순 빈곤보다 넓은 고통 상태를 드러내는 ‘곤고한’으로 옮겼습니다. 1인칭 소유격 ‘내 백성’도 유지했습니다.
- source_word: שְׁלָלָם
  english_pob_choice: their spoil
  chosen_korean: 그들의 노획물
  alternatives_korean:
  - 그들의 전리품
  - 그들의 약탈물
  lexicon: HALOT
  rationale: שָׁלָל의 약탈·전리품 이미지를 유지하되, 본문이 과부들을 ‘노획물’처럼 취급하는 폭력을 드러내기 위해 ‘노획물’을 선택했습니다.
- source_word: יְתוֹמִים יָבֹזּוּ
  english_pob_choice: they may plunder the fatherless
  chosen_korean: 고아들을 약탈하려고 합니다
  alternatives_korean:
  - 아버지 없는 자들을 노략하려고 합니다
  - 고아들을 빼앗으려고 합니다
  lexicon: HALOT
  rationale: יָתוֹם의 직역인 ‘아버지 없는 자들’도 가능하지만, 한국어에서 더 즉각적으로 보호받아야 할 사회적 범주를 드러내는 ‘고아들’을 채택했습니다. 동사는 ‘plunder’의 강도를 살려 ‘약탈하다’로 옮겼습니다.
theological_decisions:
- issue: 대표적 보호 대상의 구체성
  chosen_reading: ‘과부’와 ‘고아’라는 구체적 보호 대상을 그대로 유지했습니다.
  alternative_readings:
  - 취약한 자들
  - 연약한 자들
  rationale: 예언자적 고발은 사회적 약자를 추상화하기보다, 언약 공동체가 보호해야 할 실제 집단을 직접 지목할 때 가장 강하게 들립니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 1인칭 소유격 ‘my people’
  chosen_reading: ‘내 백성’으로 옮겼습니다.
  alternative_readings:
  - 그의 백성
  rationale: 히브리어의 1인칭 소유격을 그대로 살려, 하나님의 언약적 관계와 고발의 직접성을 보존했습니다.
  doctrine_reference: Translation philosophy §1
