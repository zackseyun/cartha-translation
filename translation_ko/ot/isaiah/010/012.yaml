    issue: 서두의 ‘그때에’가 וְהָיָה כִּי가 이루는 미래의 시간절을 충분히 드러내지 못합니다.
    rationale: 원문은 ‘그리고/그 일이 있으리니, 주님께서 … 마치실 때에’라는 시간적 전환을 제시합니다. ‘마치실 때에’로 직접 연결하면 원문의 구문과 미래성을 더 정확히 보존합니다.
