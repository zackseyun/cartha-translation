id: ISA.10.12
reference: Isaiah 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
  footnotes:
  - marker: a
    text: Or 'I will call to account' for 'I will punish.' The Hebrew verb can denote divine visitation for judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the fruit of the greatness of the heart of the king of Assyria.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the splendor of the height of his eyes,' that is, the proud look in his eyes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 주님께서 시온 산과 예루살렘에서 자신의 모든 일을 마치시면, 내가 앗시리아 왕의 교만한 마음이 낳은 열매와 그의 거만한 눈의 자랑을 벌하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘벌하다’뿐 아니라 ‘문책하여 불러내다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘교만의 큰 마음의 열매’, 곧 앗시리아 왕 내면의 교만이 낳은 결과를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 눈의 높음의 화려함’으로, 곧 눈에 드러나는 거만한 태도를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And it will happen that when
  chosen_korean: 그때에
  alternatives_korean:
  - 그리고 그것이 일어날 것입니다
  - 그리고 그 일이 일어날 때
  lexicon: HALOT
  rationale: 서두의 전환 표현과 시간 절을 한국어로 자연스럽게 묶어, 예언 문맥의 시간적 전개를 살렸습니다.
- source_word: יְבַצַּע אֲדֹנָי אֶת כָּל מַעֲשֵׂהוּ
  english_pob_choice: the Lord has finished all his work
  chosen_korean: 주님께서 … 자신의 모든 일을 마치시면
  alternatives_korean:
  - 주님께서 … 자신의 모든 일을 완성하시면
  - 주님께서 … 자신의 모든 사역을 끝내시면
  lexicon: HALOT
  rationale: בצע의 완료 의미를 '마치다'로 옮겨 시간절의 완료감을 살렸고, מַעֲשֶׂה를 문맥상 '일'로 자연스럽게 표현했습니다.
- source_word: אֶפְקֹד עַל
  english_pob_choice: I will punish
  chosen_korean: 내가 … 벌하겠습니다
  alternatives_korean:
  - 내가 … 심판하겠습니다
  - 내가 … 물으려고 하겠습니다
  lexicon: HALOT
  rationale: 심판 맥락의 פקד עַל을 한국어에서 가장 직접적으로 드러내는 '벌하다'로 옮겨, 단순한 방문이나 점검의 의미로 약화시키지 않았습니다.
- source_word: פְּרִי גֹדֶל לְבַב
  english_pob_choice: the fruit of the greatness of the heart
  chosen_korean: 교만한 마음이 낳은 열매
  alternatives_korean:
  - 마음의 위대함의 열매
  - 큰 마음의 열매
  lexicon: HALOT
  rationale: 직역형의 '열매' 이미지는 유지하되, 문맥상 부정적 의미가 분명하므로 '교만한'을 넣어 히브리어 관용구의 의미를 드러냈습니다.
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  english_pob_choice: the splendor of his haughty eyes
  chosen_korean: 그의 거만한 눈의 자랑
  alternatives_korean:
  - 그의 높은 눈의 화려함
  - 그의 오만한 눈의 영광
  lexicon: HALOT
  rationale: '''눈의 높음''이라는 관용을 한국어의 ''거만한 눈''으로 자연화하되, תִּפְאֶרֶת의 자랑/화려함 계열을 ''자랑''으로 옮겨 자기과시의 뉘앙스를 살렸습니다.'
theological_decisions:
- issue: 시온 산과 예루살렘에서의 하나님의 일의 방향을 어떻게 드러낼지
  chosen_reading: '''시온 산과 예루살렘에서''로 위치를 살리고, ''대적하여'' 같은 방향성은 넣지 않았습니다.'
  alternative_readings:
  - 시온 산과 예루살렘에 대하여
  - 시온 산과 예루살렘을 향하여
  rationale: 히브리어 전치사는 위치를 가리키므로, 본문이 말하는 하나님의 사역을 과잉 해석하지 않고 장소적 진술을 유지했습니다.
  doctrine_reference: 본문의 문법적 긴장 보존
