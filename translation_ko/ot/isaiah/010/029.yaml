    rationale: 한국어 주석에서는 ‘pass/crossing’ 대신 ‘산길·통과 지점·건넘길’처럼 한국어로 의미 범위를 제시하는 것이 자연스럽습니다. 본문 ‘고갯길’이 가능한 문맥적 선택임도 밝혀야 합니다.
