  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
  footnotes:
  - marker: a
    text: Or 'the crossing' or 'the ford.' The Hebrew מַעְבָּרָה can denote a place of crossing more generally; 'the pass' best fits the military route context here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Gibeah of Saul'; alternatively, 'Saul's Gibeah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고갯길을 지나갔습니다[a]. 게바는 우리가 묵을 곳입니다. 라마는 떱니다. 사울의 기브아는 달아났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마아바라(מַעְבָּרָה)는 일반적으로 ‘통과 지점’ 또는 ‘건넘길’을 뜻할 수 있습니다. 이 군사 행군 문맥에서는 ‘고갯길’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘사울의 기브아’이며, ‘사울의 기브아’라는 지명으로도 옮길 수 있습니다.
    reason: lexical_alternative
