  rationale: b 각주의 표지를 실제 설명 대상인 ‘사울의 기브아’ 뒤로 바로잡았습니다. a 각주는 불필요한 영어를 제거하고 원어 낱말의 의미 범위와 문맥적 번역 선택을 한국어로 제시했습니다. 본문은 행군 경로의 문맥에 맞게 ‘고개’보다 ‘고갯길’로 다듬고, 라마의 공포는 히브리어 완료형의 생생한 시적 용법을 반영하여 간결한 현재형으로 옮겼습니다.
