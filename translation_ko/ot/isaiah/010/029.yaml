  text: עָֽבְרוּ֙ מַעְבָּרָ֔ה גֶּ֖בַע מָל֣וֹן לָ֑/נוּ חָֽרְדָה֙ הָֽ/רָמָ֔ה גִּבְעַ֥ת שָׁא֖וּל נָֽסָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
  footnotes:
  - marker: a
    text: Or 'the crossing' or 'the ford.' The Hebrew מַעְבָּרָה can denote a place of crossing more generally; 'the pass' best fits the military route context here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Gibeah of Saul'; alternatively, 'Saul's Gibeah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고개를 넘어갔습니다[a]. 게바는 우리의 묵을 곳입니다. 라마는 떨고 있습니다[b]. 사울의 기브아는 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고개’는 여기서 전투 행군이 지나가는 지형의 ‘pass/crossing’에 해당하는 일반적 표현으로, 영어 주석의 ‘the pass’에 대응합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사울의 기브아’라는 속격 구조를 뜻하며, 영어 주석의 대안처럼 ‘사울의 기브아’로도 읽을 수 있습니다.
    reason: lexical_alternative
