  source_fidelity: 본문의 지명들과 행군·공포의 연속은 대체로 충실하게 옮겼습니다. 그러나 מַעְבָּרָה는 반드시 산길인 ‘고개’만을 뜻하지 않고 ‘통과 지점/건넘’도 될 수 있으므로, 본문에서는 자연스러운 ‘고갯길’을 유지하되 주석에서 그 범위를 분명히 하는 편이 안전합니다. 완료형들이 시적·생생한 열거로 쓰인 점을 고려한 현재형 ‘떱니다’도 가능합니다.
  naturalness: ‘그들은 고갯길을 지나갔습니다’, ‘게바는 우리가 묵을 곳입니다’, ‘라마는 떱니다’는 현대 표준어 합쇼체에서 자연스럽고, 짧은 시적 행군 열거의 리듬에도 맞습니다. ‘떨고 있습니다’보다 ‘떱니다’가 진행상에 과도하게 한정되지 않으면서 간결합니다.
  terminology: 게바, 라마, 기브아는 음역 지명으로 적절합니다. ‘사울의 기브아’는 히브리어 구성 관계를 무리 없이 반영합니다. 현행 b 주석은 사울의 기브아를 설명하면서 라마 뒤에 붙어 있어, 주석 표지 위치와 설명 대상이 일치하지 않습니다.
