  - 그의 튼튼한 자들
  lexicon: HALOT
  rationale: 직역상 ‘살찐/기름진 자들’이지만, 문맥상 강하고 번성한 엘리트 집단을 가리키는 은유를 살려 너무 해석적으로 좁히지 않도록 했습니다.
- source_word: רָזוֹן
  english_pob_choice: wasting sickness
  chosen_korean: 쇠약하게 하시는 병
  alternatives_korean:
  - 쇠약
  - 수척함
  - 마름
  lexicon: HALOT
  rationale: 명사 자체는 ‘쇠약/마름’이지만, 하나님이 ‘보내시는’ 심판의 성격이 분명하므로 한국어에서는 결과를 드러내는 표현으로 옮겼습니다.
- source_word: כְּבֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 광채
  - 그의 위엄
  - 그의 화려함
  lexicon: HALOT
  rationale: כָּבוֹד의 기본 의미를 따라 ‘영광’으로 유지하되, 왕권과 제국의 외적 영화라는 함의도 함께 보존했습니다.
- source_word: יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ
  english_pob_choice: a burning will be kindled like the burning of fire
  chosen_korean: 불이 타오르는 것같이 타오르게 하십니다
  alternatives_korean:
  - 불타오르는 불처럼 타오르게 하십니다
  - 불의 타오름같이 타오르게 하십니다
  lexicon: HALOT
  rationale: 동일어근 반복의 강조를 한국어에서 자연스럽게 살리기 위해 ‘타오르다’를 반복했고, 비교 구문은 과도한 장식 없이 직관적으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 심판이 향하는 대상의 성격
  chosen_reading: 본문은 앗수르의 물리적 비만을 말한다기보다, 군사적·정치적 القوة와 번영을 상징하는 ‘살진 자들’을 심판하는 것으로 읽었습니다.
  alternative_readings:
  - 실제 육체적 비만을 강조하는 읽기
  - 보다 일반적인 백성 전체에 대한 읽기
  rationale: 문맥상 제국의 교만한 힘이 무너지는 장면이므로, 은유를 그대로 두되 대상의 상징적 성격을 유지하는 것이 가장 충실합니다.
  doctrine_reference: Isaiah 10:16 context; Assyria judgment oracle
