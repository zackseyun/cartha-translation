id: ISA.10.16
reference: Isaiah 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
  footnotes:
  - marker: a
    text: Or 'against his well-fed ones' or 'among his fat ones'; the Hebrew uses an image of fatness for strength, prosperity, or robust elites.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''instead of his glory,'' taking ''under'' in a substitutional sense: what replaces his splendor is burning.'
    reason: alternative_reading
  - marker: c
    text: '''His glory'' may also mean ''his splendor'' or ''his pomp.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주, 만군의 야훼께서 그의 살진 자들[a] 가운데에 쇠약을 보내실 것이며, 그의 영광[c][b] 아래에서는 불의 불길처럼 불타오를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 기름진 자들’ 또는 ‘그의 잘 먹은 자들’. ‘그의 살진 자들 가운데에’는 ‘그의 살진 자들을 향해’로도 옮길 수 있습니다. 히브리어는 힘, 번영, 또는 튼튼한 엘리트를 가리키는 ‘살찜’의 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘대신에’로도 읽을 수 있습니다. 이 경우 ‘아래에’는 대치의 뜻이 되어, 그의 영광을 대신하는 것은 불타오름입니다.
    reason: alternative_reading
  - marker: c
    text: ‘그의 영광’은 ‘그의 광채’, ‘그의 위엄’, 또는 ‘그의 화려함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
