id: ISA.10.23
reference: Isaiah 10:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
  footnotes:
  - marker: a
    text: Or 'the whole land.' Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 만군의 주 야훼께서 온 세상[a] 가운데에서 정해진 완전한 멸망을 집행하고 계시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅’. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’이나 ‘세상’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - for
  lexicon: HALOT
  rationale: 앞 문장의 근거를 제시하는 연결로서 원문의 인과·설명 기능을 한국어에서 자연스럽게 살렸습니다.
- source_word: כָלָה
  english_pob_choice: complete destruction
  chosen_korean: 완전한 멸망
  alternatives_korean:
  - 완전한 파멸
  - 전멸
  - 완결된 멸망
  lexicon: HALOT
  rationale: 심판 맥락의 ‘끝남/멸망’ 의미를 살리되, 지나치게 관용적이거나 구어적인 표현을 피했습니다.
- source_word: וְנֶחֱרָצָה
  english_pob_choice: one that has been decreed
  chosen_korean: 정해진
  alternatives_korean:
  - 이미 결정된
  - 판결된
  - 결정된
  lexicon: HALOT
  rationale: ‘정하다/결정하다’의 완료·확정 뉘앙스를 반영해, 앞의 ‘완전한 멸망’을 수식하는 분사적 의미로 옮겼습니다.
- source_word: עֹשֶׂה
  english_pob_choice: is carrying out
  chosen_korean: 집행하고 계시기
  alternatives_korean:
  - 행하고 계시기
  - 하고 계시기
  - 실행하고 계시기
  lexicon: HALOT
  rationale: 행위가 단순 진행이 아니라 선고된 심판의 시행이라는 점을 드러내기 위해 ‘집행하다’를 택했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 모든 땅
  - 온 세상
  - 온 땅 전체
  lexicon: HALOT
  rationale: אֶרֶץ가 문맥상 ‘땅/땅 위의 전역’ 또는 ‘세상’일 수 있어, 한국어에서는 과도한 해석 없이 범위를 넓게 열어 두는 표현을 선택했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 언약명 יהוה를 학문적 음역인 ‘야훼’로 보존해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה / YHWH → Yahweh'
- issue: כָּל הָאָרֶץ의 범위
  chosen_reading: 온 땅
  alternative_readings:
  - 온 땅의 국토
  - 온 땅 전체
  - 온 세상
  rationale: 예언 맥락의 역사적 심판과 보편적 진술 가능성을 둘 다 남기기 위해, ‘땅/세상’의 긴장을 특정 지역으로 좁히지 않고 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
