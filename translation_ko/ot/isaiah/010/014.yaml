review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 비유는 대체로 충실합니다. 다만 마지막 세 동작은 히브리어에서 날개·입·지저귐의 조류 이미지를 연속적으로 유지하는 표현인데, 초안의 ‘자’는 이를 사람으로 지나치게 구체화하여 ‘날개를 퍼덕이는 자’라는 다소 부자연스러운 표현을 만듭니다. 또한 וְלֹא הָיָה는 단순 병렬/부정 서술이며 ‘그리하여’의 결과·추론 관계는 명시하지 않습니다.
  naturalness: ‘둥지를 찾듯 찾았고’는 같은 어근의 반복으로 다소 어색하므로 어순을 조정해 자연스럽게 할 수 있습니다. 마지막은 ‘…하는 것도 하나도 없었습니다’라는 구조가 현대 표준어와 조류 비유 모두에 잘 맞습니다.
  terminology: ‘내 손’, ‘뭇 백성의 재물’, ‘버려진 알들’, ‘온 땅’은 원문의 이미지와 어휘 범위를 적절히 반영합니다. ‘뭇 백성’은 약간 문어적이지만 예언서의 격식 있는 문체에 적합합니다.
  issues:
  - severity: medium
    issue: 마지막 병렬 표현의 ‘자’ 사용
    rationale: ‘날개를 퍼덕이는 자’는 한국어에서 사람을 가리키는 듯하고 어색합니다. 원문의 날개·입·지저귐으로 이어지는 새 이미지와 비인칭적 부정 표현을 보존하려면 ‘…하는 것도’가 적절합니다.
  - severity: low
    issue: ‘그리하여’가 결과 관계를 첨가함
    rationale: 히브리어 접속사 וְ는 여기서 단순히 이어지는 부정 진술입니다. 결과를 명시하는 접속어는 제거하는 편이 더 충실합니다.
  - severity: low
    issue: ‘둥지를 찾듯 찾았고’의 반복
    rationale: 의미상 오류는 없으나, 어순을 바꾸어 반복감을 줄이면 자연스럽고 원문의 비유도 유지됩니다.
  revised_text: 내 손은 둥지를 찾듯 뭇 백성의 재물을 찾아냈고, 버려진 알들을 모으듯 온 땅을 내가 모았습니다. 날개를 퍼덕이거나 입을 열거나 지저귀는 것도 하나도 없었습니다.
