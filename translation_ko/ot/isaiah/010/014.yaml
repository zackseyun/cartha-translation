revisions:
- from: 내 손이 뭇백성의 재물을 마치 둥지를 찾듯 찾았고, 버려진 알들을 모으듯 온 땅을 내가 모았습니다. 그리하여 날개를 퍼덕이는 자도, 입을 여는 자도, 지저귀는 자도 하나도 없었습니다.
  to: 내 손은 둥지를 찾듯 뭇 백성의 재물을 찾아냈고, 버려진 알들을 모으듯 온 땅을 내가 모았습니다. 날개를 퍼덕이거나 입을 열거나 지저귀는 것도 하나도 없었습니다.
  rationale: 정복자의 과장된 자랑, 손·둥지·알의 비유, ‘온 땅’의 포괄적 표현을 보존했습니다. 마지막 절은 사람을 뜻하는 ‘자’를 피하고 조류 이미지의 병렬을 그대로 살렸으며, 원문에 없는 인과 접속을 제거했습니다.
