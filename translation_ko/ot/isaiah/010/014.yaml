id: ISA.10.14
reference: Isaiah 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּמְצָ֨א כַ/קֵּ֤ן יָדִ/י֙ לְ/חֵ֣יל הָֽ/עַמִּ֔ים וְ/כֶ/אֱסֹף֙ בֵּיצִ֣ים עֲזֻב֔וֹת כָּל הָ/אָ֖רֶץ אֲנִ֣י אָסָ֑פְתִּי וְ/לֹ֤א הָיָה֙ נֹדֵ֣ד כָּנָ֔ף וּ/פֹצֶ֥ה פֶ֖ה וּ/מְצַפְצֵֽף׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
  footnotes:
  - marker: a
    text: Or 'the riches of the nations.' The Hebrew חַיִל can denote wealth, resources, strength, or military force; here the context favors spoil or wealth taken easily.
    reason: lexical_alternative
  - marker: b
    text: Or 'the whole land.' Hebrew אֶרֶץ can mean 'earth' or 'land'; 'earth' is retained here because the speaker's boast is deliberately universal in scope.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 손은 둥지를 찾듯 뭇 백성의 재물을 찾아냈고, 버려진 알들을 모으듯 온 땅을 내가 모았습니다. 날개를 퍼덕이거나 입을 열거나 지저귀는 것도 하나도 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדִי / my hand
  english_pob_choice: my hand
  chosen_korean: 내 손
  alternatives_korean:
  - 내가
  - 내 권세
  lexicon: HALOT
  rationale: 히브리어의 손은 단순 신체부위가 아니라 능력과 지배력을 드러내는 관용구이므로, 직접적인 이미지인 ‘내 손’을 살리되 과도한 의역은 피했습니다.
- source_word: לְחֵיל הָעַמִּים
  english_pob_choice: the wealth of the peoples
  chosen_korean: 뭇백성의 재물
  alternatives_korean:
  - 뭇백성의 부
  - 민족들의 재물
  - 뭇백성의 군대
  lexicon: HALOT
  rationale: חַיִל은 힘, 군대, 재물의 뜻을 가질 수 있으나, 뒤의 둥지·알 비유와 ‘모았다’는 동사가 약탈한 재산의 쉬운 취득을 가리키므로 ‘재물’이 가장 잘 맞습니다.
- source_word: כַּקֵּן
  english_pob_choice: as one finds a nest
  chosen_korean: 마치 둥지를 찾듯
  alternatives_korean:
  - 둥지처럼
  - 마치 둥지를 발견하듯
  lexicon: HALOT
  rationale: 비유의 핵심은 손쉽게 취하는 장면이므로, 한국어로도 자연스러운 ‘둥지를 찾듯’으로 옮겨 원문의 비교 감각을 살렸습니다.
- source_word: בֵּיצִים עֲזֻבוֹת
  english_pob_choice: abandoned eggs
  chosen_korean: 버려진 알들
  alternatives_korean:
  - 남겨진 알들
  - 버림받은 알들
  lexicon: HALOT
  rationale: עֲזֻבוֹת의 기본 뜻은 버려진/떠난 것이므로, 새 둥지 이미지에 맞게 ‘버려진 알들’로 직역했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅과
  lexicon: HALOT
  rationale: אֶרֶץ는 땅/땅 위 세계를 가리킬 수 있는데, 여기서는 제국적 과장의 보편성을 살리되 한국어에서는 자연스러운 ‘온 땅’이 적절합니다.
- source_word: נֹדֵד כָּנָף / פֹצֶה פֶה / מְצַפְצֵף
  english_pob_choice: fluttered a wing / opened a mouth / chirped
  chosen_korean: 날개를 퍼덕이는 자도, 입을 여는 자도, 지저귀는 자도
  alternatives_korean:
  - 날개를 움직이는 자도, 말을 꺼내는 자도, 울어대는 자도
  - 날개를 떨구는 자도, 입을 벌리는 자도, 소리내는 자도
  lexicon: HALOT
  rationale: 세 동사는 모두 새의 무력한 반응을 묘사하므로, ‘자도’ 구조로 병렬을 살리고 각각의 동작을 한국어로 선명하게 대응시켰습니다.
theological_decisions:
- issue: 정복자적 과장 수사에서 ‘온 땅’의 범위
  chosen_reading: 실제 지리적 전 세계가 아니라, 앗시리아의 자만에 가까운 보편적 정복 과장으로 읽었습니다.
  alternative_readings:
  - 과장 없이 실제 전 지구적 주장으로 읽기
  - ‘온 땅’을 ‘온 지역/온 땅덩이’로 축소하기
  rationale: 문맥상 교만한 제국의 말투가 핵심이므로, 보편적 표현을 유지하되 수사적 과장이라는 긴장을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 성경 본문의 수사와 역사적 문맥에 대한 문학적-역사적 읽기
