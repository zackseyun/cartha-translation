  rationale: 가시 여부를 명시하지 않은 סִבְכֵי의 폭넓은 식물 이미지를 ‘빽빽한 덤불’로 보존했습니다. 또한 בְּאַדִּיר를 ‘강한 이에 의해’로 옮겨 레바논을 쓰러뜨리는 행위자를 나타내되, 그가 하나님이라는 해석은 각주에 가능한 대안으로만 남겼습니다.
