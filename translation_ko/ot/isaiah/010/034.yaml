source:
  edition: WLC
  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
  footnotes:
  - marker: a
    text: Or, 'Lebanon will fall by the Mighty One,' taking 'mighty one' as a title referring to God.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 숲의 빽빽한 덤불은 쇠로 잘려 나가고, 레바논은 강한 이에 의해 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레바논은 위대한 분에 의해 쓰러질 것입니다’로 옮길 수 있습니다. ‘위대한 분’은 하나님을 가리키는 칭호로 이해되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  english_pob_choice: will be cut down
  chosen_korean: 잘려 나가며
  alternatives_korean:
  - 베어지며
  - 찍혀 내려가며
  - 잘려 쓰러지며
  lexicon: HALOT
  rationale: 수동적 ‘잘려/베여 없어짐’의 이미지를 살리면서, 숲의 덤불이 무너지듯 제거되는 장면을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: סִבְכֵי הַיַּעַר
  english_pob_choice: the thickets of the forest
  chosen_korean: 숲의 가시덤불
  alternatives_korean:
  - 숲의 덤불
  - 숲의 얽힌 나뭇가지들
  - 숲의 빽빽한 덤불
  lexicon: HALOT
  rationale: סבך는 얽히고 덮인 덤불·가시덤불의 뜻이 있어, ‘숲의 가시덤불’로 이미지와 집합성을 함께 살렸습니다.
- source_word: בַּבַּרְזֶל
  english_pob_choice: with iron
  chosen_korean: 쇠로
  alternatives_korean:
  - 철로
  - 쇠 연장으로
  - 쇠도구로
  lexicon: HALOT
  rationale: 본문은 구체적 도구를 밝히지 않고 단지 ‘철’ 자체를 말하므로, 도구를 덧붙이지 않고 재료/수단을 드러내는 ‘쇠로’를 택했습니다.
- source_word: בְּאַדִּיר
  english_pob_choice: by a mighty one
  chosen_korean: 한 용사 앞에
  alternatives_korean:
  - 한 용사에 의해
  - 한 능력자에 의해
  - 한 위대한 이 앞에
  lexicon: HALOT
  rationale: ‘אדיר’의 ‘강한/위력 있는 자’라는 뜻을 한국어의 ‘용사’로 옮기되, 주체를 단정적으로 신격화하지 않고 원문의 모호성을 남겼습니다.
- source_word: יִפּוֹל
  english_pob_choice: will fall
  chosen_korean: 쓰러질 것입니다
  alternatives_korean:
  - 떨어질 것입니다
  - 무너질 것입니다
  - 넘어질 것입니다
  lexicon: HALOT
  rationale: 문맥상 레바논이 쓰러지는 의인화된 심판 이미지를 나타내므로, 단순 ‘fall’보다 자연스럽고 시적인 ‘쓰러지다’를 사용했습니다.
theological_decisions:
- issue: אַדִּיר를 하나님의 명시적 칭호로 처리할지 여부
  chosen_reading: 한 용사
  alternative_readings:
  - 한 강하신 분
  - 한 용사(=하나님)
  - 그 강하신 분
  rationale: 문맥상 야훼의 심판을 암시하지만, 히브리어 본문 자체는 신적 이름을 직접 밝히지 않으므로 본문은 인물적 표현을 유지하고, 신적 칭호 해석은 주석적 여지로 남깁니다.
  doctrine_reference: 의미의 긴장을 보존하고 본문에 없는 명시화를 피함
