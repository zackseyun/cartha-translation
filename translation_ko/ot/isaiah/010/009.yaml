id: ISA.10.9
reference: Isaiah 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֥א כְּ/כַרְכְּמִ֖ישׁ כַּלְנ֑וֹ אִם לֹ֤א כְ/אַרְפַּד֙ חֲמָ֔ת אִם לֹ֥א כְ/דַמֶּ֖שֶׂק שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/009.yaml
  text: Is not Calno like Carchemish? Is not Hamath like Arpad? Is not Samaria like Damascus?[a]
  footnotes:
  - marker: a
    text: Calno is also rendered 'Calneh' in some English translations, reflecting a traditional variant form of the place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 갈노가 갈그미스와 같지 않습니까? 하맛이 아르밧과 같지 않습니까? 사마리아가 다메섹과 같지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 갈노는 일부 번역본에서 ‘갈네’로도 옮깁니다. 이는 이 지명의 전통적인 이형 표기를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא / אִם לֹא
  english_pob_choice: Is not
  chosen_korean: ~와 같지 않습니까?
  alternatives_korean:
  - ~입니까?
  - 정녕 ~입니까?
  lexicon: HALOT
  rationale: 반복되는 수사적 질문의 힘을 살리기 위해, 부정 의문을 자연스러운 한국어 수사문으로 옮겼습니다. '같지 않습니까?'는 비교 구조와 기대된 동의를 함께 드러냅니다.
- source_word: כְּכַרְכְּמִישׁ ... כַּלְנוֹ
  english_pob_choice: Calno like Carchemish
  chosen_korean: 칼노가 갈그미스와
  alternatives_korean:
  - 칼노는 갈그미스와
  - 칼노가 갈그미스처럼
  lexicon: HALOT
  rationale: 히브리어의 비교 כ 를 한국어의 '와/과 같다'로 자연스럽게 풀어, 한 도시가 다른 도시와 동급으로 취급된다는 조롱의 뉘앙스를 유지했습니다. 갈그미스는 표준 음역형으로 옮겼습니다.
- source_word: כְּ/אַרְפַּד חֲמָת
  english_pob_choice: Hamath like Arpad
  chosen_korean: 하맛이 아르밧과
  alternatives_korean:
  - 하맛은 아르밧처럼
  - 하맛과 아르밧
  lexicon: HALOT
  rationale: 문장상의 자연스러움 때문에 비교 대상을 뒤에 두고, 각 지명은 원문의 음가를 따라 표준적으로 옮겼습니다. 아르파드보다 아르밧이 한글 음역에 더 가깝습니다.
- source_word: כְּדַמֶּשֶׂק שֹׁמְרוֹן
  english_pob_choice: Samaria like Damascus
  chosen_korean: 사마리아가 다메섹과
  alternatives_korean:
  - 사마리아는 다메섹처럼
  - 사마리아와 다메섹
  lexicon: HALOT
  rationale: 마지막 비교도 동일한 방식으로 처리해 세 개의 수사적 물음을 평행적으로 유지했습니다. 다메섹과 사마리아는 관용적인 성서 지명 음역을 따랐습니다.
theological_decisions:
- issue: 앗수르 왕의 조롱하는 수사문을 한국어에서 얼마나 직설적으로 살릴지
  chosen_reading: 공손한 의문형이지만 내용상 조롱과 정복의 논리를 드러내는 수사적 질문으로 유지했습니다.
  alternative_readings:
  - 더 평서문적으로 '칼노는 갈그미스와 다르지 않습니다'로 완화
  - '''정녕''을 넣어 강조'
  rationale: 본문은 도시들의 몰락을 동일선상에 놓는 자만 섞인 조롱이므로, 그 공격적 수사법을 약화시키지 않는 것이 원문 의도에 부합합니다.
  doctrine_reference: 이사야 10장의 앗수르 교만과 심판 선언의 문맥
