id: ISA.10.24
reference: Isaiah 10:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
  footnotes:
  - marker: a
    text: Or 'in the way of Egypt'—likely an allusion to Egypt's former oppression of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 주 야훼께서 이렇게 말씀하십니다. 「시온에 사는 내 백성아, 앗수르 때문에 두려워하지 마십시오. 그가 막대기로 너희를 치고, 이집트의 방식으로 그의 지팡이를 너희 위로 들어 올릴 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 길로’. 과거 이집트가 이스라엘을 억압한 일을 암시할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 이러므로
  lexicon: HALOT
  rationale: 앞 문맥으로부터 이어지는 결론 표지로서, 한국어에서는 ‘그러므로’가 가장 자연스럽고 논리 관계를 분명히 드러냅니다.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: the Lord GOD of hosts
  chosen_korean: 만군의 주 야훼
  alternatives_korean:
  - 만군의 주 하나님
  - 만군의 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוִה의 결합을 살리면서, 본 프로젝트 기본어휘에 따라 YHWH는 ‘야훼’로 옮기고 צְבָאוֹת는 ‘만군의’로 압축해 제목성을 유지했습니다.
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: HALOT
  rationale: 직접 금지 명령의 힘을 살리면서도 현대 한국어에서 자연스럽고 공손한 명령형으로 표현했습니다.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  english_pob_choice: in the manner of Egypt
  chosen_korean: 이집트의 방식으로
  alternatives_korean:
  - 이집트의 길로
  - 이집트처럼
  lexicon: HALOT
  rationale: 문맥상 단순한 지리 경로가 아니라 이집트의 억압 방식에 대한 역사적 암시이므로, 본문 주석적 의미를 과도하게 풀지 않으면서도 그 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 프로젝트의 기준어에 따라 언약적 신명은 ‘야훼’로 유지하여 מקור 텍스트의 고유한 신명 인식을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 시온 백성에게 주어지는 명령의 높임말
  chosen_reading: ‘두려워하지 마십시오’로 공손한 합쇼체를 사용했습니다.
  alternative_readings:
  - 두려워하지 말라
  - 두려워하지 마라
  rationale: 예언자적 선포의 직접 인용 안에서도 현대 한국어 출판본의 문체를 유지하되, 청중을 향한 권면의 공적 성격을 살리기 위해 합쇼체를 선택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve source force in target register'
