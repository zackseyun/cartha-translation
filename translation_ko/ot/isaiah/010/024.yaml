  naturalness: ‘시온에 거주하는 자들아’는 현대 한국어 성서 문체에서는 다소 딱딱하고, 뒤의 단수 대명사와 결합될 때 특히 부자연스럽습니다. ‘시온에 사는 내 백성아’와 복수 대명사 ‘너희’를 사용하면 공적 خطاب의 자연스러움과 집합적 의미를 함께 살릴 수 있습니다. ‘자기 지팡이’는 지시 대상이 순간적으로 모호할 수 있어 ‘그의 지팡이’가 더 분명합니다.
