id: ISA.10.33
reference: Isaiah 10:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
  footnotes:
  - marker: a
    text: Or 'with a crash,' 'with violence,' or 'in terror'; the Hebrew term conveys fearsome, violent force.
    reason: lexical_alternative
  - marker: b
    text: The imagery is of cutting down branches and tall trees, symbolizing the downfall of the exalted.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 주이신 만군의 야훼께서 무서운 힘으로[a] 무성한 가지들을 잘라 내십니다. 큰 키의 자들은 잘려 나가고[b], 높은 자들은 낮아질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요란한 소리와 함께’, ‘폭력으로’, 또는 ‘공포스럽게’로 옮길 수 있습니다. 히브리어는 무섭고 거친 힘의 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 가지와 큰 나무를 베어 넘어뜨리는 모습으로, 높아진 자들의 몰락을 상징합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언문맥의 주의를 환기하는 감탄사로서, 현대 한국어에서는 ‘보십시오’가 격식을 살리면서도 직접적인 호소력을 유지합니다.
- source_word: הָאָדוֹן יְהוָה צְבָאֹות
  english_pob_choice: the Lord, Yahweh of Armies
  chosen_korean: 주, 만군의 야훼
  alternatives_korean:
  - 주, 야훼 만군의 하나님
  - 주 하나님, 만군의 야훼
  lexicon: HALOT
  rationale: ‘אָדוֹן’의 칭호를 ‘주’로, 여호와/야훼는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ‘צְבָאֹות’는 투명하게 ‘만군의’로 반영했습니다.
- source_word: מְסָעֵף פֻּארָה בְּמַעֲרָצָה
  english_pob_choice: is lopping off the boughs with terrifying power
  chosen_korean: 무서운 힘으로 가지들을 잘라 내시니
  alternatives_korean:
  - 두려운 위력으로 가지들을 쳐 내시니
  - 무시무시한 힘으로 큰 가지를 꺾으시니
  lexicon: HALOT
  rationale: 나무를 베어 내는 생생한 이미지를 살리되, ‘恐怖/violent force’의 감각은 ‘무서운 힘’으로 압축해 자연스러운 현대 한국어로 표현했습니다.
- source_word: רָמֵי הַקּוֹמָה ... גְּדוּעִים ... הַגְּבֹהִים יִשְׁפָּלוּ
  english_pob_choice: the tall in stature are cut down, and the lofty are brought low
  chosen_korean: 키가 큰 자들은 찍혀 넘어지고, 높은 자들은 낮아집니다
  alternatives_korean:
  - 장대한 자들은 베어지고, 높은 자들은 낮아집니다
  - 높은 체구의 자들은 잘려 쓰러지고, 높은 자들은 낮아집니다
  lexicon: HALOT
  rationale: 첫 절의 수직적 높이를 문자적으로 살리면서도, 문맥상 교만/고양됨의 뉘앙스를 과도하게 해석하지 않도록 ‘키가 큰 자들’, ‘높은 자들’로 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문에 직접 나타난 신적 이름을 프로젝트 기본값대로 ‘야훼’로 옮겨, 칭호 ‘주’와 구분했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 나무 베기 이미지의 은유 보존
  chosen_reading: 주어진 수목 이미지를 유지하고, 교만한 자에 대한 심판을 본문이 암시하는 정도까지만 반영
  alternative_readings:
  - 주된 의미를 ‘교만한 자를 낮추심’으로 명시
  - 완전히 직설적인 심판 진술로 바꿈
  rationale: 히브리어는 수목 도해를 통해 높아진 것의 سقوط을 그리므로, 본문이 허용하는 범위 안에서 은유를 유지해 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
