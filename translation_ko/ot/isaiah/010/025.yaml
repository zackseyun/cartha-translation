  rationale: The revision explicitly renders the causal connection, uses formal prophetic diction, and changes the final clause so that divine anger is directed toward bringing about the oppressors’ destruction rather than being equated with it. The note remains appropriately cautious about the rare Hebrew noun, and its anchor now identifies the word under discussion.
