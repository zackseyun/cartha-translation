source:
  edition: WLC
  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
  footnotes:
  - marker: a
    text: Or 'their annihilation,' 'their consumption,' or 'their end.' The Hebrew noun is rare, and its precise nuance is debated, though the context clearly points to the downfall of the oppressor(s).
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이제 아주 잠시만 더 지나면 진노가 끝나고, 내 분노가 그들을 멸망시키는 데로 향할 것이기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그들을 멸망시키는’으로 옮긴 말은 또는 ‘그들의 소멸’, ‘그들의 파괴’, ‘그들의 끝’으로 옮길 수 있습니다. 히브리어 명사는 희귀하며 정확한 뉘앙스는 논쟁적이지만, 문맥은 분명히 압제자들의 몰락을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עוֹד מְעַט מִזְעָר
  english_pob_choice: For in just a very little while
  chosen_korean: 정말 조금만 더 지나면
  alternatives_korean:
  - 조금만 더 있으면
  - 아주 짧은 시간만 지나면
  - 정말 얼마 안 있어
  lexicon: HALOT
  rationale: עוֹד + מְעַט + מִזְעָר의 중첩된 시간 강조를 한국어에서 자연스럽게 살려, 임박성을 간결하게 드러냈습니다.
- source_word: וְכָלָה זַעַם
  english_pob_choice: indignation will come to an end
  chosen_korean: 진노가 끝나고
  alternatives_korean:
  - 분노가 소멸하고
  - 격노가 끝나고
  - 진노가 소진되고
  lexicon: HALOT
  rationale: זַעַם은 하나님의 심판적 진노를 가리키므로, 품위를 유지하는 ‘진노’로 옮겼고, וְכָלָה는 자연스러운 종결 표현인 ‘끝나고’로 처리했습니다.
- source_word: וְאַפִּי
  english_pob_choice: my anger
  chosen_korean: 내 분노는
  alternatives_korean:
  - 내 진노는
  - 나의 노여움은
  lexicon: HALOT
  rationale: אַפִּי는 문자적으로 ‘내 코’이지만 관용적으로 ‘내 분노’를 뜻하므로, 앞의 ‘진노’와 구별되면서도 의미를 유지하는 ‘분노’로 옮겼습니다.
- source_word: תַּבְלִיתָם
  english_pob_choice: their destruction
  chosen_korean: 그들의 멸망이
  alternatives_korean:
  - 그들의 파멸이
  - 그들의 소멸이
  - 그들의 끝이
  lexicon: HALOT
  rationale: 희귀 명사라 정확한 뉘앙스에 여지가 있지만, 문맥상 압제자들의 몰락을 가리키므로 ‘멸망’이 가장 무난하고 공적 문체에도 잘 맞습니다.
theological_decisions:
- issue: ‘그들’의 지시 대상
  chosen_reading: ‘그들’은 문맥상 압제자들, 특히 앗수르를 가리킨다고 보았습니다.
  alternative_readings:
  - 보다 추상적으로 ‘그들의 멸망’만 두고 특정 인물을 덜 드러내는 읽기
  - 유다를 향한 징계의 종결로만 보는 읽기
  rationale: 앞뒤 문맥이 야훼의 진노가 그의 백성을 향하던 국면에서 압제자에게로 돌아서는 흐름이므로, 인칭대명사의 대상은 압제자들로 보는 것이 가장 자연합니다.
  doctrine_reference: 이사야 10장 문맥 전체
