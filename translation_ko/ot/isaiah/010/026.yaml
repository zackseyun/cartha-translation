id: ISA.10.26
reference: Isaiah 10:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
  footnotes:
  - marker: a
    text: Or 'like the blow against Midian.' The Hebrew phrase compares the coming judgment to the LORD's striking of Midian.
    reason: lexical_alternative
  - marker: b
    text: '''At the rock of Oreb'' recalls Judges 7:25, where Oreb, a Midianite leader, was killed.'
    reason: cross_reference
  - marker: c
    text: Or 'in the manner of Egypt,' likely an allusion to the LORD's lifting the staff over the sea in the Exodus.
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼께서 그를 향해 채찍을 일으키실 것입니다[a]. 이는 미디안이 오렙 바위에서 치심을 당한 것과 같을 것이며, 그의 지팡이는 바다 위에 있을 것이고[c][b], 그는 그것을 이집트의 경우처럼 들어 올릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미디안에 가한 타격처럼.’ 히브리어 구절은 다가올 심판을 야훼께서 미디안을 치신 일과 비교합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오렙 바위’는 사사기 7:25을 떠올리게 하며, 거기서 미디안의 지도자 오렙이 죽임을 당했습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘이집트에서처럼.’ 이는 야훼께서 홍해 위로 지팡이를 드셨던 출애굽 장면을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: יהוה는 POB 기준에 따라 야훼로 옮기고, צְבָאוֹת은 군대/하늘과 땅의 군세를 포괄하는 관용적 표현인 ‘만군’으로 처리했습니다.
- source_word: שׁוֹט
  english_pob_choice: a whip
  chosen_korean: 채찍
  alternatives_korean:
  - 몽둥이
  - 채벌용 회초리
  lexicon: HALOT
  rationale: 문맥상 심판의 도구를 가리키므로, 구체적이면서도 한국어에서 자연스러운 ‘채찍’이 가장 적절합니다.
- source_word: כְּמַכַּת מִדְיָן
  english_pob_choice: as at the striking down of Midian
  chosen_korean: 미디안이 치심을 당한 것과 같이
  alternatives_korean:
  - 미디안을 치신 것처럼
  - 미디안에 대한 타격처럼
  lexicon: HALOT
  rationale: מַכָּה의 핵심은 ‘타격/침’이므로, 대규모 학살 뉘앙스를 덧씌우지 않도록 ‘치심을 당한 것’으로 비교 구조를 살렸습니다.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  english_pob_choice: as in the way of Egypt
  chosen_korean: 이집트의 경우처럼
  alternatives_korean:
  - 이집트에서처럼
  - 이집트로 가는 길처럼
  lexicon: HALOT
  rationale: בְּדֶרֶךְ는 문자 그대로 ‘길’이지만 여기서는 출애굽 때의 하나님의 행위를 가리키는 관용적·암시적 표현이어서, 한국어에서는 ‘경우처럼’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 대명사 ‘his’의 지시 대상
  chosen_reading: ‘그의 지팡이’는 문맥의 여호와의 행위와 연결되는 지팡이로 읽어, 출애굽의 표징을 떠올리게 했습니다.
  alternative_readings:
  - 앗수르의 지팡이가 다시 그를 향하는 것으로 읽을 수 있습니다.
  rationale: 바다와 이집트에 대한 언급이 출애굽 장면을 강하게 환기하므로, 번역은 해석을 과도하게 고정하지 않되 그 암시를 보존해야 합니다.
  doctrine_reference: 본문의 역사적 암시를 보존하고 긴장을 해소하지 않기
- issue: 오렙 바위와 이집트의 역사적 회상
  chosen_reading: 미디안 격파와 출애굽을 함께 상기시키는 이중 암시를 살렸습니다.
  alternative_readings:
  - 둘 중 하나만 강조하는 번역도 가능하지만, 본문은 두 사건을 함께 부릅니다.
  rationale: POB 영어 본문과 주석이 두 역사적 사건을 함께 지시하므로, 한국어도 두 암시를 모두 드러내야 합니다.
  doctrine_reference: 역사적 구원 행위의 연속성
