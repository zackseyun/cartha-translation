id: ISA.10.28
reference: Isaiah 10:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֥א עַל עַיַּ֖ת עָבַ֣ר בְּ/מִגְר֑וֹן לְ/מִכְמָ֖שׂ יַפְקִ֥יד כֵּלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/028.yaml
  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: ko
  text: 그는 아이앗을 향해 왔고, 미그론을 지나갔습니다. 믹마스에서는 그의 짐을 맡겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל
  english_pob_choice: He has come against
  chosen_korean: 아이앗을 향해 왔고
  alternatives_korean:
  - 아이앗을 치러 왔고
  - 아이앗을 향해 왔으며
  - 아이앗에 대항해 왔고
  lexicon: בוא + על
  rationale: עַל은 단순한 도착보다 대항/공격의 방향을 드러내므로, POB의 ‘against’를 살려 ‘향해’로 적대적 진행을 표현했습니다.
- source_word: עַיַּת
  english_pob_choice: Aiath
  chosen_korean: 아이앗
  alternatives_korean:
  - 아이아트
  - 아얏
  lexicon: 고유명사
  rationale: 히브리어 지명을 현대 한국어 음역으로 옮겨, 널리 통용되는 성경식 표기보다 원음에 가까운 형태를 택했습니다.
- source_word: יַפְקִיד כֵּלָיו
  english_pob_choice: he stores his baggage
  chosen_korean: 그의 짐을 맡겼습니다
  alternatives_korean:
  - 그의 장비를 맡겼습니다
  - 그의 보따리를 두었습니다
  - 그의 짐을 내려놓았습니다
  lexicon: פקד + כֵּלִים
  rationale: פּקד는 ‘맡기다/배치하다’의 의미가 있어 단순히 내려놓는 것보다 보관·위탁의 뉘앙스를 살렸고, כֵּלִים은 문맥상 ‘짐/장비’로 자연스럽게 옮겼습니다.
- source_word: מִגְרוֹן / מִכְמָשׂ
  english_pob_choice: Migron / Michmash
  chosen_korean: 미그론 / 믹마스
  alternatives_korean:
  - 미그론 / 미크마스
  - 미그론 / 막마스
  lexicon: 고유명사
  rationale: 지명은 현대 외래어 표기법식 음역을 따르되, 성경 지명으로 인지 가능한 최소한의 일관성을 유지했습니다.
theological_decisions:
- issue: 전치사 עַל의 방향성
  chosen_reading: ‘아이앗을 향해 왔고’로 옮겨 단순 도착이 아니라 위협적 접근을 드러냈습니다.
  alternative_readings:
  - 아이앗에 왔고
  - 아이앗을 향해 다가왔고
  rationale: 문맥상 앗수르의 진군을 묘사하므로, POB가 유지한 ‘against’의 적대성을 한국어에서도 흐리지 않았습니다.
  doctrine_reference: 문맥-수사적 관찰
