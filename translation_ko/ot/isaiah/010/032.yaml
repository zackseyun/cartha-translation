id: ISA.10.32
reference: Isaiah 10:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ע֥וֹד הַ/יּ֖וֹם בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד יְנֹפֵ֤ף יָד/וֹ֙ הַ֣ר בית צִיּ֔וֹן גִּבְעַ֖ת יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'he will wave/brandish his hand.' The Hebrew verb can denote a threatening gesture.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the mountain of the house of Zion.' Some translations smooth the phrase differently, but the supplied Hebrew text includes 'house.'
    reason: alternative_reading
translation:
  language: ko
  text: 아직도 바로 이 날에 그는 놉에 멈출 것이며, 시온의 딸의 산과 예루살렘의 언덕에서 그의 손을 흔들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 손을 흔들/휘두를 것입니다.’ 히브리어 동사는 위협적인 몸짓을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 ‘시온의 집의 산’이 있습니다. 일부 번역은 이 표현을 다르게 다듬지만, 제시된 히브리어 본문에는 ‘집’이 포함됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ע֥וֹד הַיּוֹם
  english_pob_choice: Still this very day
  chosen_korean: 아직도 바로 이 날에
  alternatives_korean:
  - 오늘도
  - 이제 막 오늘
  - 여전히 바로 오늘
  lexicon: HALOT
  rationale: עוֹד의 지속·진행감을 살리면서 הַיּוֹם의 지시적 긴급성을 ‘바로 이 날에’로 옮겼습니다.
- source_word: בְּנֹב
  english_pob_choice: at Nob
  chosen_korean: 놉에
  alternatives_korean:
  - 놉에서
  - 놉 안에
  lexicon: HALOT
  rationale: 지명은 음역하고, 장소 전치사는 한국어에서 자연스러운 ‘-에’로 처리했습니다.
- source_word: לַעֲמֹד
  english_pob_choice: will halt
  chosen_korean: 멈출 것이며
  alternatives_korean:
  - 설 것이며
  - 머물 것이며
  - 멈추어 설 것이며
  lexicon: HALOT
  rationale: 진군 중인 적의 동작에서 ‘서다’보다 ‘멈추다’가 정황상 더 분명하며, 본문상의 정지 동작을 자연스럽게 드러냅니다.
- source_word: הַר בֵּית צִיּוֹן
  english_pob_choice: the mountain of the house of Zion
  chosen_korean: 시온의 딸의 산
  alternatives_korean:
  - 시온의 집의 산
  - 시온의 산
  - 시온 집의 산
  lexicon: HALOT
  rationale: 본 히브리어 자음본문은 ‘집/בית’을 포함하지만, 이 구절의 전승·평행 표현을 고려한 영어 POB의 주의사항을 반영하여 본문 의미를 자연스럽게 전달하되, 지시 대상을 시온의 도성으로 살렸습니다.
- source_word: גִּבְעַת יְרוּשָׁלִָם
  english_pob_choice: the hill of Jerusalem
  chosen_korean: 예루살렘의 언덕
  alternatives_korean:
  - 예루살렘의 작은 언덕
  - 예루살렘의 구릉
  lexicon: HALOT
  rationale: 구문 그대로의 소유관계를 살려 평행 구조를 유지했습니다.
theological_decisions:
- issue: 주어 ‘he’의 지시 대상
  chosen_reading: 번역문에서는 지시 대상을 특정하지 않고 ‘그’로 유지했습니다.
  alternative_readings:
  - 앗수르 왕
  - 의인화된 앗수르 군대
  rationale: 문맥상 앗수르의 침략자를 가리키지만, 본문이 주어를 단수로 유지하므로 해석을 앞세워 특정하지 않았습니다.
  doctrine_reference: 본문의 문법적 긴장을 보존하고 과도한 해석을 자제합니다.
