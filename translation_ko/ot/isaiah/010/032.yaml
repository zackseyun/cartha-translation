revisions:
- from: 아직도 바로 이 날에 그는 놉에 멈출 것이며, 시온의 딸의 산과 예루살렘의 언덕에서 그의 손을 흔들 것입니다.[a][b]
  to: 바로 오늘 그는 놉에 멈추어 서서, 시온의 집의 산[a], 곧 예루살렘의 언덕을 향해 손을 흔들 것입니다.[b]
  rationale: 제시된 WLC의 בֵּית를 본문에서 보존하여 원문 충실성을 회복했습니다. ‘곧’은 뒤의 ‘예루살렘의 언덕’을 앞선 지시 대상의 병행적 설명으로 자연스럽게 연결하며, ‘향해’는 손짓의 대상을 분명히 합니다. 상충하는 영어 감사 기록의 ‘daughter’ 독법은 본문에 채택하지 않고 각주에서 제한적으로 언급하여 원문상 논점을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:14Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 제시된 WLC 본문은 הַר בֵּית צִיּוֹן, 곧 ‘시온의 집의 산’이라는 표현을 담고 있으므로, 본문의 ‘시온의 딸의 산’은 이를 따르지 않습니다. 또한 손을 흔드는 동작은 산과 언덕 ‘에서’ 행하는 것이 아니라 그곳을 향한 위협적 몸짓으로 표현하는 편이 히브리어의 관계를 더 정확히 반영합니다.
  naturalness: ‘아직도 바로 이 날에’는 현대 한국어로 다소 부자연스럽습니다. ‘바로 오늘’으로 간결하게 옮기고, לַעֲמֹד의 정지·정착 동작은 ‘멈추어 서서’로 표현했습니다. ‘시온의 집의 산’은 직역적이지만, 본문 이문/전승 문제가 걸린 표현이므로 본문을 보존하고 각주로 설명하는 것이 안전합니다.
  terminology: 놉, 시온, 예루살렘은 통용 표기를 유지했습니다. ‘집’(בֵּית)은 제시된 원문에 따라 유지하며, ‘시온의 딸’로 바꾸지 않았습니다. ‘손을 흔들다’는 נופף의 기본 의미를 보존하고, ‘휘두르다’ 및 위협적 몸짓 가능성은 각주에 남겼습니다.
  issues:
  - severity: high
    issue: 본문의 ‘시온의 딸의 산’이 제시된 히브리어 בֵּית(집)와 불일치합니다.
    rationale: 영어 감사 기록과 최근 개정 이력에는 상충된 주장이 있으나, 검토 기준상 제공된 원어 본문을 우선해야 합니다. 따라서 ‘집’을 본문에 반영해야 합니다.
  - severity: medium
    issue: ‘시온의 딸의 산과 예루살렘의 언덕에서 그의 손을 흔들 것입니다’는 장소 부사로 읽힙니다.
    rationale: 히브리어는 손을 들어 산/언덕을 향해 흔드는 장면을 나타내므로, ‘향해’를 사용하여 대상 관계를 드러내는 것이 적절합니다.
  - severity: low
    issue: 각주 표지가 본문 끝에 함께 놓여 각각의 대상이 불분명합니다.
    rationale: a는 손을 흔드는 동사에, b는 ‘시온의 집의 산’에 붙여 해당 주석의 범위를 명확히 해야 합니다.
