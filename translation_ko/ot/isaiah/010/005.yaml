id: ISA.10.5
reference: Isaiah 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וֹי אַשּׁ֖וּר שֵׁ֣בֶט אַפִּ֑/י וּ/מַטֶּה ה֥וּא בְ/יָדָ֖/ם זַעְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in their hand.'' Some translations render the phrase with a singular pronoun (''in his hand'' or ''in its hand'') to smooth the imagery, but the Masoretic Text here reads plural.'
    reason: textual_variant
  - marker: b
    text: Or 'in their hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 아시리아여, 내 분노의 막대기여, 그의 손에 있는 막대는 내 진노입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 아시리아여
  alternatives_korean:
  - 화 있을진저
  - 슬프도다
  - 아
  lexicon: HALOT
  rationale: 히브리어 감탄사 הוֹי는 심판의 선포를 여는 외침이므로, 한국어에서는 직접 호칭형으로 시작해 예언적 책망의 압박감을 살렸습니다.
- source_word: שֵׁבֶט אַפִּי
  english_pob_choice: the rod of my anger
  chosen_korean: 내 분노의 막대기
  alternatives_korean:
  - 내 진노의 지팡이
  - 내 노여움의 몽둥이
  lexicon: HALOT
  rationale: שֵׁבֶט은 치는 도구의 이미지를 유지하는 것이 중요하므로, 왕권을 떠올리기 쉬운 ‘지팡이’보다 ‘막대기’를 택해 심판의 도구라는 은유를 보존했습니다.
- source_word: בְיָדָם
  english_pob_choice: in their hand
  chosen_korean: 그의 손에 있는
  alternatives_korean:
  - 그들의 손에 있는
  - 그 손에 있는
  lexicon: HALOT
  rationale: 마소라 본문은 3인칭 복수 접미사이지만, 한국어 문맥에서는 앞의 아시리아를 가리키는 단수 지시로 자연스럽게 읽히므로, 본문 아래의 수적 긴장은 살리되 문장은 매끄럽게 구성했습니다.
- source_word: זַעְמִי
  english_pob_choice: my wrath
  chosen_korean: 내 진노
  alternatives_korean:
  - 내 분노
  - 내 격노
  lexicon: HALOT
  rationale: זַעַם은 강한 신적 분노를 뜻하므로, 앞의 ‘분노’보다 한 단계 강한 ‘진노’를 사용해 병행구의 강도를 유지했습니다.
theological_decisions:
- issue: 아시리아를 하나님의 심판 도구로 제시하는 비유
  chosen_reading: 아시리아가 하나님의 분노와 진노를 집행하는 도구라는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 아시리아를 단순한 역사적 강대국으로만 완화하는 읽기
  - 하나님과 무관한 우연한 행위자로 처리하는 읽기
  rationale: 본문은 아시리아를 하나님의 심판의 막대기로 직접 규정하므로, 그 신학적 긴장을 해소하지 않고 직역-의역 균형 속에서 드러냈습니다.
  doctrine_reference: Translation philosophy §3 (theological tension is preserved rather than resolved)
