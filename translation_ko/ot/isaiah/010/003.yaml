  source_fidelity: פְּקֻדָּה는 이 심판 예언의 문맥에서 ‘환난’ 자체보다는 ‘징벌/심판의 날’이라는 뜻이 더 직접적입니다. 초안의 ‘환난의 날’은 결과적 재난으로 의미를 약화·이동시킬 수 있습니다. 또한 לְעֶזְרָה는 ‘도움을 구하여’라는 목적을 보존해야 하므로 ‘누구에게 피하여 도움을 구하시겠습니까?’보다 ‘누구에게 도움을 구하려고 피하시겠습니까?’가 원문의 결합을 더 충실히 반영합니다. 나머지 질문 구조와 ‘재물’ 및 각주의 의미 범위는 적절합니다.
