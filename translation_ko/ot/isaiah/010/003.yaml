revisions:
- from: 환난의 날과 — 멀리서 오는 황폐가 닥칠 때 — 여러분은 어떻게 하시겠습니까? 누구에게 피하여 도움을 구하시겠습니까? 또 어디에 여러분의 재물을 두시겠습니까?[a]
  to: 징벌의 날과 멀리서 닥쳐올 황폐의 때에 여러분은 어떻게 하시겠습니까? 누구에게 도움을 구하려고 피하시겠습니까? 또 어디에 여러분의 재물을 두시겠습니까?[a]
  rationale: ‘징벌의 날’은 פְּקֻדָּה의 심판적 의미를 직접 반영합니다. ‘도움을 구하려고 피하시겠습니까?’는 תָּנוּסוּ לְעֶזְרָה의 목적 관계를 보존합니다. כְּבוֹדְכֶם은 문맥상 ‘재물’로 유지하되, 어휘적 대안인 ‘영광/명예’를 각주에 남겨 해석의 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:08Z'
