  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַֽה תַּעֲשׂוּ֙ לְ/י֣וֹם פְּקֻדָּ֔ה וּ/לְ/שׁוֹאָ֖ה מִ/מֶּרְחָ֣ק תָּב֑וֹא עַל מִי֙ תָּנ֣וּסוּ לְ/עֶזְרָ֔ה וְ/אָ֥נָה תַעַזְב֖וּ כְּבוֹדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
  footnotes:
  - marker: a
    text: Or 'your glory' or 'your honor.' The Hebrew can refer either to honor/glory or, in context, to valued possessions or wealth.
    reason: lexical_alternative
translation:
  language: ko
  text: 환난의 날과 — 멀리서 오는 황폐가 닥칠 때 — 여러분은 어떻게 하시겠습니까? 누구에게 피하여 도움을 구하시겠습니까? 또 어디에 여러분의 재물을 두시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 영광’, ‘여러분의 명예’. 히브리어는 문맥에 따라 영광/명예를 뜻할 수도 있고, 여기서는 귀중한 소유물이나 재물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  english_pob_choice: punishment
  chosen_korean: 환난의 날
  alternatives_korean:
  - 징벌의 날
  - 벌받는 날
  - 찾아오심의 날
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 פְּקֻדָּה는 단순한 ‘방문’보다 심판적 처벌의 의미가 강하므로, 한국어에서는 문맥을 자연스럽게 드러내는 ‘환난의 날’로 옮겼습니다.
- source_word: שׁוֹאָה
  english_pob_choice: devastation
  chosen_korean: 황폐
  alternatives_korean:
  - 파괴
  - 멸망
  - 폐허
  lexicon: HALOT
  rationale: 이 명사는 파괴적 재난과 황폐를 가리키므로, 현대 한국어에서 그 충격을 간명하게 전달하는 ‘황폐’를 선택했습니다.
- source_word: תָּנוּסוּ לְעֶזְרָה
  english_pob_choice: will you flee for help
  chosen_korean: 도움을 구하시겠습니까
  alternatives_korean:
  - 도움을 얻으려고 피하시겠습니까
  - 도움을 바라며 달아나시겠습니까
  lexicon: HALOT
  rationale: ‘피하다’와 ‘도움’의 긴밀한 결합을 살리되, 한국어에서는 목적어 구조가 자연스럽게 읽히도록 ‘도움을 구하다’로 풀었습니다.
- source_word: כְּבוֹדְכֶם
  english_pob_choice: your wealth
  chosen_korean: 재물
  alternatives_korean:
  - 영광
  - 명예
  - 부
  lexicon: HALOT
  rationale: כָּבוֹד의 기본값인 ‘영광/명예’보다 문맥상 보존하려는 소유물을 가리킬 가능성이 높으므로, POB의 해석을 따라 구체적인 ‘재물’로 옮겼습니다.
theological_decisions:
- issue: כְּבוֹדְכֶם의 의미를 ‘영광/명예’가 아니라 ‘재물’로 구체화할지 여부
  chosen_reading: 재물
  alternative_readings:
  - 영광
  - 명예
  rationale: 이 절은 다가오는 심판 앞에서 피난처와 보존 대상을 묻는 수사적 질문이므로, 화자가 붙들고 있는 실제 소유를 가리키는 쪽이 문맥 효과를 더 정확히 전달합니다. 전통적 추상어는 각주로 보존하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §5 (일관성 및 문맥상 예외 허용)
