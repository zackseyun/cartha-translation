id: ISA.10.19
reference: Isaiah 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאָ֥ר עֵ֛ץ יַעְר֖/וֹ מִסְפָּ֣ר יִֽהְי֑וּ וְ/נַ֖עַר יִכְתְּבֵֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/019.yaml
  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
  footnotes:
  - marker: a
    text: Or 'the remnant of the trees of his forest will be a number, and a boy will write them.' The Hebrew uses 'number' idiomatically for 'few enough to count.'
    reason: lexical_alternative
  - marker: b
    text: '''Boy'' translates a masculine singular Hebrew term (naʿar), which can also mean ''youth'' or ''young man'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남아 있는 그의 숲의 나무들은 수효가 적어, 소년이 그것들을 적을 수 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘수효’는 여기서 단순한 숫자 개념이 아니라 ‘셀 수 있을 만큼 적음’을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소년’은 남성 단수 히브리어 나아르(naʿar)를 옮긴 것입니다. 문맥에 따라 ‘청년’이나 ‘젊은이’가 될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר
  english_pob_choice: And the remaining
  chosen_korean: 남아 있는
  alternatives_korean:
  - 남은
  - 남은 것들의
  lexicon: HALOT
  rationale: 남아 있는은 남은 상태를 자연스럽게 살리면서, 나무를 가리키는 문맥에서 기술적 의미의 ‘남은 자’ 뉘앙스를 불필요하게 불러오지 않습니다.
- source_word: עֵץ
  english_pob_choice: trees
  chosen_korean: 나무들
  alternatives_korean:
  - 나무
  - 목재
  lexicon: HALOT
  rationale: 문맥상 숲에서 살아남은 개체들을 가리키므로 복수형 ‘나무들’이 한국어에서 가장 자연스럽고 원문의 집합적 이미지를 잘 전달합니다.
- source_word: מִסְפָּר יִהְיוּ
  english_pob_choice: will be few in number
  chosen_korean: 수효가 적어
  alternatives_korean:
  - 수효가 되어
  - 적은 수가 되어
  - 셀 수 있을 만큼 적어
  lexicon: HALOT
  rationale: 히브리어의 ‘number’ 관용구를 한국어의 ‘수효가 적다’로 옮겨, 단순히 적다는 뜻과 셀 수 있을 만큼 적다는 뜻을 함께 살렸습니다.
- source_word: וְנַעַר
  english_pob_choice: and a boy
  chosen_korean: 소년이
  alternatives_korean:
  - 아이가
  - 청년이
  - 젊은이가
  lexicon: HALOT
  rationale: 나아르의 성별이 표시된 단수 표현을 살리기 위해 ‘소년’으로 옮겼습니다. 이는 어린 나이의 소년이라는 직역적 이미지도 잘 전달합니다.
