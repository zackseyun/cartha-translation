  naturalness: ‘그것으로 찍는 자’, ‘그것을 휘두르는 자’, ‘스스로를 높이겠습니까?’가 현대 표준 한국어의 격식 있는 성경 문체에 더 자연스럽습니다. 두 비유를 하나의 수사 의문문으로 결속하여 원문의 논증적 흐름을 드러냈습니다.
  terminology: הַגַּרְזֶן은 ‘도끼’, הַמַּשּׂוֹר는 ‘톱’, שֵׁבֶט은 ‘막대기’, מַטֶּה는 ‘지팡이’로 구별했습니다. 마지막 표현은 본문에서 ‘나무가 아닌 이를’로 옮기되, 히브리어의 타원성과 ‘나무가 아닌 것’이라는 대안적 이해를 각주에 보존했습니다.
