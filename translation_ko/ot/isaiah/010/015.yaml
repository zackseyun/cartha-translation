id: ISA.10.15
reference: Isaiah 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
  footnotes:
  - marker: a
    text: 'Hebrew: ''or as if a staff were to lift up not-wood.'' The final phrase is elliptical and may also be understood as ''what is not wood.'''
    reason: alternative_reading
translation:
  language: ko
  text: 도끼가 그것을 찍는 자를 향해 자랑하겠습니까? 톱이 그것을 움직이는 자를 향해 스스로를 크게 하겠습니까? 마치 막대가 그것을 들어 올리는 이를 휘두르는 것 같고[a], 마치 지팡이가 나무가 아닌 것을 들어 올리는 것 같습니다!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나무가 아닌 것을’ 또는 ‘나무가 아닌 것’으로도 읽을 수 있는 생략적 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְפָּאֵר
  english_pob_choice: boast
  chosen_korean: 자랑하겠습니까
  alternatives_korean:
  - 스스로를 뽐내겠습니까
  - 스스로를 자랑하겠습니까
  lexicon: HALOT
  rationale: 히트파엘의 자기과시·자기승격 의미를 살려, 도구가 사용자보다 우쭐해지는 역설을 자연스러운 현대 한국어 의문문으로 옮겼습니다.
- source_word: הַגַּרְזֶן
  english_pob_choice: the axe
  chosen_korean: 도끼
  alternatives_korean:
  - 도끼날
  - 자귀
  lexicon: HALOT
  rationale: 일반적인 공구 명칭으로 옮겨 본문의 비유적 대비를 분명하게 했습니다.
- source_word: הַחֹצֵב בּוֹ
  english_pob_choice: the one who chops with it
  chosen_korean: 그것을 찍는 자
  alternatives_korean:
  - 그것으로 찍는 사람
  - 그것을 다듬는 자
  lexicon: HALOT
  rationale: בּוֹ의 도구적 의미를 살리면서, 히브리어 분사의 행위자를 간결한 한국어로 표현했습니다.
- source_word: יִתְגַּדֵּל
  english_pob_choice: magnify itself
  chosen_korean: 스스로를 크게 하겠습니까
  alternatives_korean:
  - 스스로를 높이겠습니까
  - 스스로를 거만하게 하겠습니까
  lexicon: HALOT
  rationale: 자기 과대화의 뜻을 살리되, 앞절의 '자랑하다'와 평행을 이루도록 자연스럽게 번역했습니다.
- source_word: מְנִיפוֹ
  english_pob_choice: the one who wields it
  chosen_korean: 그것을 움직이는 자
  alternatives_korean:
  - 그것을 휘두르는 자
  - 그것을 다루는 자
  lexicon: HALOT
  rationale: 톱과의 결합에서 '휘두르다'보다 넓은 조작·사용의 의미가 자연스럽기에 '움직이는 자'로 옮겼습니다.
- source_word: כְּהָנִיף שֵׁבֶט / כְּהָרִים מַטֶּה
  english_pob_choice: As if a rod were to wield ... or as if a staff were to lift up ...
  chosen_korean: 마치 막대가 그것을 들어 올리는 이를 휘두르는 것 같고[a], 마치 지팡이가 나무가 아닌 것을 들어 올리는 것 같습니다
  alternatives_korean:
  - 마치 막대가 그것을 드는 이를 휘두르는 것 같고
  - 마치 지팡이가 나무가 아닌 것을 들어 올리는 듯합니다
  lexicon: HALOT
  rationale: 히브리어의 역전된 행위 주체를 한국어에서도 드러내기 위해, 무생물이 사람을 조종하는 듯한 불합리를 유지했습니다.
- source_word: לֹא עֵץ
  english_pob_choice: one who is not wood / what is not wood
  chosen_korean: 나무가 아닌 것
  alternatives_korean:
  - 나무가 아닌 자
  - 목재가 아닌 것
  lexicon: HALOT
  rationale: 문장 끝의 생략적 표현을 과도하게 풀지 않고, 영어 POB의 각주가 지적한 모호성을 한국어에서도 보존했습니다.
theological_decisions:
- issue: 도구와 사용자 사이의 역전된 주체성
  chosen_reading: 무생물 도구가 인간 사용자 위에 군림하는 우스꽝스러운 역설로 읽고, 그 불합리를 그대로 살렸습니다.
  alternative_readings:
  - 도구가 단순히 '자랑한다'는 일반적 의인법
  - 사람을 완전히 생략한 채 도구들끼리의 비교로 읽는 해석
  rationale: 이 절은 문맥상 앗수르의 교만을 풍자하는 수사이므로, 역전된 행위 관계를 희석하지 않는 것이 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: 이사야 10장의 심판 수사; 피조물이 창조주를 넘보는 교만에 대한 본문 신학
