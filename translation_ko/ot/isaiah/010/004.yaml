revisions:
- from: 아무것도 남지 않고 포로들 사이에 웅크리거나 죽임을 당한 자들 사이에 쓰러질 뿐입니다. 그럼에도 이 모든 일에도 그의 분노는 거두어지지 않았고, 그의 손은 여전히 뻗어 있습니다.[a]
  to: 남은 것은 포로들 사이에 웅크리거나 죽임을 당한 자들 사이에 쓰러지는 것뿐입니다.[a] 이 모든 일에도 그의 분노는 거두어지지 않았고, 그의 손은 여전히 뻗어 있습니다.
  rationale: 첫 절을 한국어의 자연스러운 ‘남은 것은 … 것뿐입니다’ 구조로 다듬고, בְּכָל־זֹאת를 ‘이 모든 일에도’로 한 번만 표현했습니다. 논쟁적인 첫 절의 대안적 구문은 각주에서 보존하고, 각주 표지를 해당 절로 옮겼습니다. 하나님의 분노와 뻗은 손이라는 원문의 비유적 심판 이미지는 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:11Z'
