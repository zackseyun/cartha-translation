  source_fidelity: 핵심 의미인 피할 수 없는 포로·죽음의 결과와, 계속되는 하나님의 분노 및 뻗은 손의 이미지는 잘 반영했습니다. 다만 בְּכָל־זֹאת는 ‘그럼에도 이 모든 일에도’처럼 두 겹의 양보 표현으로 옮길 필요가 없으며, 각주가 다루는 첫 절의 해석상 문제는 해당 절에 직접 연결하는 편이 적절합니다.
  naturalness: ‘아무것도 남지 않고 … 뿐입니다’는 의미는 통하지만 ‘남은 것은 … 것뿐입니다’가 현대 표준 한국어에서 더 자연스럽고 압축된 히브리어의 귀결을 잘 드러냅니다. ‘그럼에도 이 모든 일에도’는 중복되므로 ‘이 모든 일에도’로 고칩니다.
  terminology: ‘포로들’, ‘죽임을 당한 자들’, ‘분노’, ‘손은 여전히 뻗어 있습니다’는 원문의 전쟁·심판 어휘와 신체적 이미지를 자연스럽게 보존합니다. 각주의 ‘아래’는 논쟁적인 문자적 관계를 보여 주되, 본문 번역에 강요하지 않습니다.
