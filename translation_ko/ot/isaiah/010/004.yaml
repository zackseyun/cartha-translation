id: ISA.10.4
reference: Isaiah 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּלְתִּ֤י כָרַע֙ תַּ֣חַת אַסִּ֔יר וְ/תַ֥חַת הֲרוּגִ֖ים יִפֹּ֑לוּ בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
  footnotes:
  - marker: a
    text: Or 'except to bow down under the prisoners, and they will fall under the slain.' The Hebrew is highly compressed, and the exact relation of the verbs and prepositions is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 아무것도 남지 않고 포로들 사이에 웅크리거나 죽임을 당한 자들 사이에 쓰러질 뿐입니다. 그럼에도 이 모든 일에도 그의 분노는 거두어지지 않았고, 그의 손은 여전히 뻗어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로들 아래에 굽혀지고, 그들은 죽임을 당한 자들 아래에 쓰러질 것이다.’ 히브리어는 매우 압축되어 있어 동사와 전치사의 정확한 관계가 논쟁적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְתִּי
  english_pob_choice: Nothing remains but
  chosen_korean: 아무것도 남지 않고 ... 뿐입니다
  alternatives_korean:
  - 오직 ... 할 뿐입니다
  - '... 외에는 없습니다'
  - 아무것도 남지 않으며 ...
  lexicon: HALOT
  rationale: 압축된 פתיחת 절의 남은 결과를 한국어에서 자연스럽게 풀어, 반드시 그렇게 될 수밖에 없는 심판의 뉘앙스를 살렸습니다.
- source_word: כָרַע תַּחַת אַסִּיר
  english_pob_choice: to crouch among the prisoners
  chosen_korean: 포로들 사이에 웅크리거나
  alternatives_korean:
  - 포로들 아래에서 무릎을 꿇거나
  - 포로들 가운데 엎드리거나
  - 포로들 틈에 굽히거나
  lexicon: HALOT
  rationale: כָרַע의 굽어짐/웅크림을 살리되, תַּחַת אַסִּיר을 문자적으로 ‘아래에서’로 옮기면 어색하므로 심판 아래 ‘포로들 사이에’라는 집합적 의미로 처리했습니다.
- source_word: הֲרוּגִים יִפֹּלוּ
  english_pob_choice: to fall among the slain
  chosen_korean: 죽임을 당한 자들 사이에 쓰러질 뿐입니다
  alternatives_korean:
  - 살육된 자들 사이에 떨어질 뿐입니다
  - 죽은 자들 가운데 쓰러질 뿐입니다
  - 죽임당한 자들 사이에 넘어질 뿐입니다
  lexicon: HALOT
  rationale: הֲרוּגִים은 단순한 ‘죽은 자’보다 폭력적으로 죽임을 당한 자들을 가리키므로 ‘죽임을 당한 자들’로 옮기고, יִפֹּלוּ는 결과적 붕괴를 드러내는 ‘쓰러질’로 처리했습니다.
- source_word: לֹא שָׁב אַפּוֹ / יָדוֹ נְטוּיָה
  english_pob_choice: his anger has not turned away ... his hand is still stretched out
  chosen_korean: 그의 분노는 거두어지지 않았고, 그의 손은 여전히 뻗어 있습니다
  alternatives_korean:
  - 그의 진노는 돌이키지 않았고, 그의 손은 여전히 뻗어 있습니다
  - 그의 분노는 물러서지 않았고, 그의 손은 계속 뻗어 있습니다
  - 그의 분노는 가시지 않았고, 그의 손은 여전히 펼쳐져 있습니다
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 ‘분노’로 살리고, שׁוּב의 ‘돌아감/거둬짐’ 이미지를 한국어의 자연스러운 수동형으로 옮겼습니다. ‘뻗어 있습니다’는 이사야의 반복되는 심판 이미지도 유지합니다.
theological_decisions:
- issue: 하나님의 감정과 행동을 인간의 몸짓으로 표현하는 비유
  chosen_reading: ‘분노’와 ‘손은 여전히 뻗어 있습니다’를 그대로 살려 추상화하지 않았습니다.
  alternative_readings:
  - 그의 심판은 계속되고 있습니다
  - 그의 진노가 계속됩니다
  rationale: 본문은 심판의 지속성을 몸의 언어로 제시하므로, 신학적 완곡화를 피하고 원문의 긴박한 이미지를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
