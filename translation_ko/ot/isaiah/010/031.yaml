  rationale: 문맥상 ‘힘을 내다’가 아니라 위협을 피해 안전한 곳으로 급히 옮겨 간다는 뜻이므로, ‘피신하다’가 영어 POB의 의미와 원문 긴장을 가장 잘 살립니다.
