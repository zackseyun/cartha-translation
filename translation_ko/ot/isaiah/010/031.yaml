  text: Madmenah has fled[a]; the inhabitants of Gebim have sought refuge.
  footnotes:
  - marker: a
    text: Or, 'the inhabitants of Gebim have taken shelter' or 'have fled for safety.' The Hebrew verb here is difficult and may convey hurried action for protection.
