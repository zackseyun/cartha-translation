translation:
  language: ko
  text: 마드메나가 도망쳤습니다[a]. 게빔의 주민들은 피신했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘게빔의 주민들은 피난처를 찾았습니다’ 혹은 ‘안전을 위해 달아났습니다’. 이 히브리어 동사는 뜻이 어려워, 보호를 위한 서둘러 움직임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  english_pob_choice: has fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 피했습니다
  lexicon: HALOT
  rationale: 마드메나를 의인화한 동사로, 공격 상황에서의 급작스러운 도주를 자연스러운 현대 한국어로 옮겼습니다.
