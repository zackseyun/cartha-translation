source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
  footnotes:
  - marker: a
    text: Or 'because of oil'; traditionally also rendered 'because of the anointing.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날에는 그의 짐이 당신의 어깨에서 떠나갈 것이며, 그의 멍에가 당신의 목에서 떠나갈 것입니다. 그 멍에는 기름짐[a] 때문에 부서질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름 때문에’; 전통적으로는 ‘기름부음 때문에’로도 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그날에는
  lexicon: HALOT
  rationale: 예언문에서 자주 쓰이는 시간 표지를 자연스러운 현대 한국어로 옮기되, 종말론적/예언적 전환감을 유지했습니다.
- source_word: סֻבֳּלוֹ
  english_pob_choice: his burden
  chosen_korean: 그의 짐
  alternatives_korean:
  - 그의 부담
  - 그의 짐짐
  lexicon: HALOT
  rationale: 압제 아래 놓인 무거운 짐의 이미지를 살리면서 한국어에서 가장 자연스러운 대응어를 택했습니다.
- source_word: מֵעַל שִׁכְמֶךָ / מֵעַל צַוָּארֶךָ
  english_pob_choice: from your shoulder / from your neck
  chosen_korean: 당신의 어깨에서 / 당신의 목에서
  alternatives_korean:
  - 당신의 어깨 위에서
  - 당신의 목 위에서
  - 어깨에서 내려가며
  lexicon: HALOT
  rationale: 히브리어의 מֵעַל가 ‘위에서/~로부터’를 함께 드러내므로 단순한 ‘에서’보다 ‘어깨에서, 목에서’로 옮겨 한국어에서 자연스럽게 제거의 이미지를 전달했습니다.
- source_word: שָׁמֶן
  english_pob_choice: fatness
  chosen_korean: 기름짐
  alternatives_korean:
  - 살찜
  - 비옥함
  - 기름
  lexicon: HALOT
  rationale: 본문의 난해한 סוף 구절을 전통적 해석인 ‘기름부음’으로 미리 해석하지 않고, 물질적/풍요의 감각을 살리는 ‘기름짐’으로 옮겼습니다.
theological_decisions:
- issue: מִפְּנֵי שָׁמֶן의 의미
  chosen_reading: ‘기름짐 때문에’로 두어, 기름부음에 대한 후대적 신학 해석을 본문 자체에 미리 주입하지 않았습니다.
  alternative_readings:
  - 기름 때문에
  - 기름부음 때문에
  - 풍성함 때문에
  rationale: 히브리어 שָׁמֶן은 기본적으로 ‘기름, 기름짐’의 의미를 가지며, 문맥이 명시적으로 기름부음 의식을 말하지 않습니다. 따라서 본문이 허락하는 가장 직접적인 물질적 원인을 보존했습니다.
  doctrine_reference: 본문-우선 원칙; 용어 신학화 절제
