id: ISA.10.1
reference: Isaiah 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וֹי הַ/חֹֽקְקִ֖ים חִקְקֵי אָ֑וֶן וּֽ/מְכַתְּבִ֥ים עָמָ֖ל כִּתֵּֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/001.yaml
  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
  footnotes:
  - marker: a
    text: Or 'who write trouble' or 'who record misery'; the Hebrew term can denote harmful trouble or burdensome injustice. 'Oppression' fits the legal context best.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew uses a wordplay: literally, ''those who decree decrees of wickedness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 화 있을진저, 악의 법령을 공포하는 자들과 계속해서 압제를 기록하는 자들이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '재앙을 공포하는 자들'로도 옮길 수 있습니다. 히브리어 חקק 계열은 법적 판결·규정 공포를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '법령을 공포하는 자들'과 '기록하는 자들' 사이에 말장난을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֥וֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 재앙이 있을진저
  - 슬프도다
  lexicon: HALOT
  rationale: 예언적 심판 선포를 나타내는 감탄사로서, 한국어에서는 '화 있을진저'가 경고와 դատ판의 강도를 가장 잘 살립니다.
- source_word: הַ/חֹֽקְקִ֖ים חִקְקֵי
  english_pob_choice: those who decree decrees
  chosen_korean: 법령을 공포하는 자들
  alternatives_korean:
  - 법령을 제정하는 자들
  - 규정을 선포하는 자들
  lexicon: HALOT
  rationale: חקק의 행정·법정적 용법을 살리되 현대 입법 제도에 과도하게 붙지 않도록 '공포하다'를 택해, 권위 있는 판결·명령의 발표라는 의미를 보존했습니다.
- source_word: אָ֑וֶן
  english_pob_choice: wickedness
  chosen_korean: 악의
  alternatives_korean:
  - 죄악의
  - 불의의
  - 악한
  lexicon: HALOT
  rationale: POB의 'wickedness'는 단순한 피해가 아니라 도덕적으로 뒤틀린 상태를 가리키므로, 한국어에서는 법령의 성격을 수식하는 '악의'로 옮겨 윤리적 비난을 유지했습니다.
- source_word: וּֽ/מְכַתְּבִ֥ים ... כִּתֵּֽבוּ
  english_pob_choice: the writers who keep writing
  chosen_korean: 계속해서 ... 기록하는 자들
  alternatives_korean:
  - 줄곧 ... 써 내려가는 자들
  - 끊임없이 ... 쓰는 자들
  lexicon: HALOT
  rationale: 반복되는 분사·완료형의 누적 효과를 한국어에서 '계속해서'로 살리고, 법적 문서를 쓰는 행위를 '기록하다'로 옮겨 압제의 문서화라는 뉘앙스를 드러냈습니다.
- source_word: עָמָ֖ל
  english_pob_choice: oppression
  chosen_korean: 압제
  alternatives_korean:
  - 학대
  - 고통
  - 수고
  lexicon: HALOT
  rationale: 해당 문맥은 단순한 수고보다 불의한 강요와 사회적 억압을 가리키므로, 한국어에서 가장 직접적으로 제도적 폭력을 드러내는 '압제'를 선택했습니다.
theological_decisions:
- issue: 예언적 경고문의 수사 강도
  chosen_reading: '''화 있을진저''로 시작하는 직설적 심판 선포로 유지했습니다.'
  alternative_readings:
  - '''슬프도다''로 완화'
  - 서술형 경고로 중화
  rationale: 히브리어 הוֹי의 기능은 애도보다 심판 선고에 가깝기 때문에, 한국어에서도 강한 선포력을 유지하는 것이 본문의 예언적 성격에 부합합니다.
  doctrine_reference: 예언서의 심판 선포와 언약적 공의
