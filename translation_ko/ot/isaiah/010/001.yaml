review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. הוֹי는 심판의 선언으로 적절히 옮겨야 하며, חקקים חקקי און은 ‘악/불의의 법령을 정하는 자들’을, ומכתבים עמל כתבו는 ‘고통(해악)을 써 놓는/기록하는 자들’을 가리킵니다. 현행 번역은 큰 뜻은 전달하지만, ‘자들이여’는 원문의 여격적 ‘~에게 화가 있다’ 구조를 불필요하게 호격으로 바꾸며, ‘계속해서’는 완료형 כתבו가 나타내는 기록 완료의 뉘앙스를 단정적으로 지속상으로 바꿉니다.
  naturalness: ‘화 있을진저, … 자들이여’는 현대 표준 한국어 합쇼체의 문장으로 자연스럽지 않습니다. ‘… 자들에게 화가 있습니다’가 현대적이면서도 예언적 심판 선언의 힘을 보존합니다. ‘고통을 써 놓는 자들’은 기록 행위와 완료의 결과를 자연스럽게 나타냅니다.
  terminology: ‘불의한 법령’은 אָוֶן의 도덕적·사회적 악을 법적 문맥에서 자연스럽게 나타냅니다. עָמָל은 문맥상 ‘고통’으로 옮기되, 각주에서 ‘해악, 압제’ 등의 가능성을 밝혀 해석의 폭을 보존합니다. 현행 각주 b의 ‘말장난’ 설명은 히브리어 어근 관계를 정확히 설명하지 못합니다. 본문에는 חקק의 반복과 כתב의 반복이 각각 있으며, 서로 간의 말장난이라고 할 수는 없습니다.
  issues:
  - severity: medium
    issue: ‘자들이여’가 원문의 수신 대상을 호격으로 바꿉니다.
    rationale: הוֹי는 여기서 ‘~하는 자들에게 화가 있다’라는 심판 선언을 이끕니다. 호격은 원문에 없는 직접 호소의 뉘앙스를 더합니다.
  - severity: medium
    issue: ‘계속해서’가 כתבו의 완료형을 지속 행위로 과도하게 해석합니다.
    rationale: 분사 מכתבים와 완료형 כתבו의 결합은 기록하는 자들과 그들이 써 놓은 것을 말합니다. 한국어 ‘써 놓는’은 결과적·누적적 뉘앙스를 보존하면서 지속상을 강제하지 않습니다.
  - severity: high
    issue: 각주 b가 ‘법령을 공포하는 자들’과 ‘기록하는 자들’ 사이의 말장난을 주장합니다.
    rationale: 원문은 חקקים חקקי(חקק의 반복) 및 מכתבים כתבו(כתב의 반복)를 각각 사용합니다. 두 구 사이의 어근 말장난이 아닙니다. 또한 현행 각주 a는 אָוֶן이 아니라 חקק 계열을 설명하여 본문 표지의 대상도 불명확합니다.
