  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
  footnotes:
  - marker: a
    text: Or 'who write trouble' or 'who record misery'; the Hebrew term can denote harmful trouble or burdensome injustice. 'Oppression' fits the legal context best.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew uses a wordplay: literally, ''those who decree decrees of wickedness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 법령을 정하고 고통을 써 놓는 자들에게 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 법령’으로 옮길 수 있습니다. 히브리어 אָוֶן은 도덕적 악뿐 아니라 해악이나 재앙을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해악’이나 ‘압제’로 옮길 수 있습니다. 히브리어 עָמָל은 수고, 고통, 해악을 뜻할 수 있으며, 여기서는 부당한 법령이 낳는 해를 가리킵니다. 원문은 ‘법령을 정하는’과 ‘써 놓는’에서 각각 같은 히브리어 어근을 반복합니다.
    reason: lexical_alternative
