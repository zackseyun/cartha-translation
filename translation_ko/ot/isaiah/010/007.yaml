id: ISA.10.7
reference: Isaiah 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּא֙ לֹא כֵ֣ן יְדַמֶּ֔ה וּ/לְבָב֖/וֹ לֹא כֵ֣ן יַחְשֹׁ֑ב כִּ֚י לְ/הַשְׁמִ֣יד בִּ/לְבָב֔/וֹ וּ/לְ/הַכְרִ֥ית גּוֹיִ֖ם לֹ֥א מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
  footnotes:
  - marker: a
    text: Or 'does not intend so' for 'does not think so'; the Hebrew verb can carry the sense of conceiving or purposing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'not a few,' a litotes meaning a large number.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그렇게 생각하지 않습니다[a]. 그의 마음도 그렇게 헤아리지 않습니다. 이는 그의 마음에 멸망시키고[b] 적지 않은 나라들을 끊어 버리려는 뜻이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그렇게 의도하지 않습니다’일 수 있습니다. 히브리어 동사는 마음속으로 구상하거나 뜻하는 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘적지 않은’은 반어법으로, 많은 수를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַמֶּה
  english_pob_choice: think
  chosen_korean: 생각하지 않습니다
  alternatives_korean:
  - 의도하지 않습니다
  - 헤아리지 않습니다
  lexicon: HALOT
  rationale: 피엘 דמה는 여기서 단순한 지적 판단보다 ‘마음속에 그려 보는/의도하는’ 뜻을 가질 수 있지만, 앞의 יַחְשֹׁב와 병렬을 살리기 위해 첫 절은 자연스러운 ‘생각하다’로 두었습니다.
- source_word: יַחְשֹׁב
  english_pob_choice: reckon
  chosen_korean: 헤아리지 않습니다
  alternatives_korean:
  - 생각하지 않습니다
  - 계산하지 않습니다
  - 의도하지 않습니다
  lexicon: HALOT
  rationale: חשב는 생각하다, 헤아리다, 꾀하다의 범위가 있어, 앞의 יְדַמֶּה와 같은 말로 겹치지 않도록 ‘헤아리다’를 택해 내적 판단과 의도를 함께 드러냈습니다.
- source_word: לְהַשְׁמִיד
  english_pob_choice: to destroy
  chosen_korean: 멸망시키고
  alternatives_korean:
  - 파괴하고
  - 멸하고
  - 멸절시키고
  lexicon: HALOT
  rationale: 힉필의 ‘파멸시키다/멸망시키다’ 의미를 살리되, 문맥의 침략적 파괴를 과장하지 않기 위해 ‘멸망시키다’로 옮겼습니다.
- source_word: לְהַכְרִית
  english_pob_choice: to cut off
  chosen_korean: 끊어 버리려는
  alternatives_korean:
  - 끊어 내버리려는
  - 잘라 없애려는
  - 제거하려는
  lexicon: HALOT
  rationale: כרת의 기본 이미지를 직접 살려 ‘끊어 버리다’로 옮겼고, 목적의 뉘앙스를 살리기 위해 ‘하려는’으로 자연스럽게 풀었습니다.
- source_word: לֹא מְעָט
  english_pob_choice: not a few
  chosen_korean: 적지 않은
  alternatives_korean:
  - 많은
  - 수없이 많은
  - 적은 수가 아닌
  lexicon: HALOT
  rationale: 히브리어의 반어법(litotes)을 한국어에서도 무리 없이 살려 ‘적지 않은’으로 옮겼습니다. 이는 단순히 ‘많은’으로 평탄화하지 않기 위한 선택입니다.
theological_decisions:
- issue: 앗수르 왕의 내적 의도와 하나님의 섭리 사이의 긴장
  chosen_reading: 본문이 말하는 대로, 그는 자신의 파괴적 의도를 품고 있을 뿐 하나님의 목적을 그렇게 이해하지 않는다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 그는 하나님의 뜻을 알지 못합니다처럼 설명을 덧붙이는 번역
  - 하나님의 심판 도구라는 의미를 본문 안에 명시하는 번역
  rationale: 문맥상 하나님의 주권과 인간의 교만이 대비되지만, 이 절 자체는 그의 내면 의도만 진술합니다. 해석을 과도하게 앞당기지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
