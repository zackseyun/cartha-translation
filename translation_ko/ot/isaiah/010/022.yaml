id: ISA.10.22
reference: Isaiah 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
  footnotes:
  - marker: a
    text: Or 'only a remnant in it will return'; the Hebrew pronoun is singular, referring to the people as a collective.
    reason: lexical_alternative
  - marker: b
    text: Or 'A destruction is decreed, overflowing with justice.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 네 백성, 이스라엘이 바다의 모래 같을지라도 그들 가운데서 남은 자만 돌아올 것입니다. 멸망이 정해졌으니, 의가 넘쳐 흐릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에서 남은 자만 돌아올 것입니다’로 옮길 수 있습니다. 히브리어 대명사는 단수이지만, 집합명사인 ‘백성’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘멸망이 정해졌으니, 정의가 넘쳐 흐릅니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For though
  chosen_korean: -일지라도
  alternatives_korean:
  - -여도
  - 비록 ...일지라도
  lexicon: HALOT
  rationale: 여기서는 단순 조건보다 양보/대조의 뉘앙스가 강하므로, ‘...일지라도’로 압축해 바다의 모래 같은 많음에도 불구하고라는 대비를 살렸습니다.
- source_word: שְׁאָר
  english_pob_choice: a remnant / only a remnant
  chosen_korean: 남은 자만
  alternatives_korean:
  - 남은 자
  - 남은 사람들만
  - 남은 자들만
  lexicon: HALOT
  rationale: 히브리어 명사 자체는 ‘남은 것/남은 자’이므로, 문맥상 배타성을 드러내는 ‘만’을 붙여 영어 POB의 ‘only a remnant’ 기능을 한국어에서 반영했습니다.
- source_word: בּוֹ
  english_pob_choice: of them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 중
  - 그 안에서
  - 그 가운데
  lexicon: HALOT
  rationale: 형식상 단수 대명사이지만 집합적 ‘백성/이스라엘’을 가리키므로, 한국어에서는 집합 안에서의 일부를 뜻하는 표현으로 처리해 집합적 참조를 드러냈습니다.
- source_word: כִּלָּיוֹן חָרוּץ
  english_pob_choice: A destruction is decreed
  chosen_korean: 멸망이 정해졌으니
  alternatives_korean:
  - 파멸이 작정되었으니
  - 멸절이 정해졌으니
  - 멸망이 작정되었으니
  lexicon: HALOT
  rationale: ‘כִּלָּיוֹן’의 파괴적 의미를 살리되 과도한 총멸 표현은 피하고, ‘חָרוּץ’는 결정된/판정된 의미를 살려 ‘정해졌다’로 옮겼습니다.
- source_word: שׁוֹטֵף צְדָקָה
  english_pob_choice: overflowing with righteousness
  chosen_korean: 의가 넘쳐 흐릅니다
  alternatives_korean:
  - 의가 넘칩니다
  - 의가 넘쳐흐릅니다
  - 의가 홍수처럼 넘칩니다
  lexicon: HALOT
  rationale: ‘שׁוֹטֵף’의 물결/범람 이미지를 한국어 동사구 ‘넘쳐 흐르다’로 옮겨, 단순한 풍성함보다 밀려오는 흐름을 살렸습니다.
theological_decisions:
- issue: 마지막 구절의 צְדָקָה 의미
  chosen_reading: ‘의’로 본문에 반영하고, 대안인 ‘정의’는 여지를 남김
  alternative_readings:
  - 정의
  - 공의
  rationale: 예언문맥에서 하나님의 선언이 지닌 도덕적·언약적 올바름을 드러내기 위해 ‘의’를 본문에 두되, 심판의 공적 성격을 떠올리게 하는 대안도 배제하지 않았습니다.
  doctrine_reference: 예언서에서 의/정의의 중첩 의미를 보존하는 원칙
