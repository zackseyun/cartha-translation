translation:
  language: ko
  text: 사마리아와 그 우상들에게 내가 한 것처럼, 예루살렘과 그 우상들에게도 하지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 다른 두 단어를 사용합니다. 사마리아에 대해서는 ‘우상들’(אֱלִילִים), 예루살렘에 대해서는 ‘형상들’ 또는 ‘우상들’(עֲצַבִּים)입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: shall I not
  chosen_korean: 하지 않겠습니까?
  alternatives_korean:
  - 하지 않겠습니까
  - 하지 않겠느냐
  lexicon: HALOT
  rationale: 수사적 질문으로서 예상되는 긍정의 답을 강하게 이끄는 표현이므로, 현대 한국어에서는 공손한 수사 의문형으로 그 힘을 살렸습니다.
- source_word: כַּאֲשֶׁר / כֵּן
  english_pob_choice: just as
  chosen_korean: '...한 것같이'
  alternatives_korean:
  - '...한 대로'
  - '...한 것처럼'
  lexicon: HALOT
  rationale: 사마리아에 대한 행위와 예루살렘에 대한 행위를 평행시키는 비교 구조이므로, 한국어에서도 ‘...한 것같이’로 대응시켜 대비를 분명히 했습니다.
- source_word: אֱלִילֶיהָ / עֲצַבֶּיהָ
  english_pob_choice: her idols / her idols
  chosen_korean: 그 우상들 / 그 우상들
  alternatives_korean:
  - 그 신상들
  - 그 형상들
  lexicon: HALOT
  rationale: 두 서로 다른 히브리어 단어를 모두 우상으로 옮겨, 본문의 수사적 평행과 멸시적 어감을 유지했습니다.
theological_decisions:
- issue: 사마리아와 예루살렘의 대상 표현에서 두 다른 히브리어 우상 용어를 어떻게 처리할지
  chosen_reading: 본문에서는 모두 ‘우상들’로 통일하고, 어휘 차이는 각주로 남깁니다.
  alternative_readings:
  - 두 번째를 ‘형상들’ 또는 ‘조각한 우상들’로 구별하여 옮김
  rationale: 문맥의 핵심은 두 도성에 대한 동일한 심판의 강도를 드러내는 것이므로, 본문 가독성을 위해 통일하되 원어 차이는 보존하는 편이 더 적절합니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
