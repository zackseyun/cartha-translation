  text: 내 손이 우상들의 나라들에 미쳤듯이, 그들의 조각상들은 예루살렘과 사마리아의 것들보다 더 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마지막 비교 표현을 생략적으로 사용합니다. 직역하면 ‘내 손이 우상들의 나라들에 미쳤고, 그들의 조각상들은 예루살렘과 사마리아보다’에 가깝습니다. 문맥상 조각상들을 비교하는 뜻입니다.
    reason: alternative_reading
