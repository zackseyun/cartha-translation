  rationale: 본문은 축약된 비교를 사용하지만 문맥상 앗수르 왕의 자만이 다른 나라들의 우상이 예루살렘과 사마리아의 것보다 더 장대하다고 주장하는 흐름입니다. 비교를 풀어 써야 독자가 본문의 논지를 즉시 이해할 수 있습니다.
