  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
  footnotes:
  - marker: a
    text: Or more literally, 'As my hand found the kingdoms of the idols, and their carved images from Jerusalem and from Samaria.' The Hebrew is elliptical; the sense is comparative.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 손이 우상의 나라들을 찾아냈듯이, 그들의 새긴 우상은 예루살렘과 사마리아의 것보다 더 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 축약된 비교를 사용하므로, 문자적으로는 '내 손이 우상의 나라들을 찾아냈고, 그들의 새긴 우상은 예루살렘과 사마리아에서'에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: As
  chosen_korean: ~듯이
  alternatives_korean:
  - ~처럼
  - 마치 ~처럼
  lexicon: HALOT
  rationale: 비교·기준을 여는 כַּאֲשֶׁר의 기능을 자연스러운 현대 한국어 비교 연결어로 살렸습니다.
- source_word: מָצְאָה יָדִי
  english_pob_choice: my hand has reached
  chosen_korean: 내 손이 우상의 나라들을 찾아냈듯이
  alternatives_korean:
  - 내 손이 우상의 나라들에 이르렀듯이
  - 내 손이 우상의 나라들을 찾아냈습니다
  lexicon: HALOT
  rationale: 직역의 '찾다/발견하다'와 정복 맥락을 함께 살리기 위해 '찾아냈다'를 택했습니다. 이는 손이 미친 권세와 도달을 함축하면서도 과도한 해석인 '점령했다'보다 원문에 가깝습니다.
- source_word: וּפְסִילֵיהֶם
  english_pob_choice: whose carved images
  chosen_korean: 그들의 새긴 우상
  alternatives_korean:
  - 그들의 새긴 형상
  - 그들의 조각한 우상
  lexicon: HALOT
  rationale: פְּסִילִים의 물질적·우상적 성격을 드러내기 위해 '새긴 우상'으로 옮겼습니다. 문맥상 소유 관계는 한국어에서 별도 관계절보다 병렬 명사구가 더 간결합니다.
- source_word: מִירוּשָׁלַם וּמִשֹּׁמְרוֹן
  english_pob_choice: than those of Jerusalem and Samaria
  chosen_korean: 예루살렘과 사마리아의 것보다
  alternatives_korean:
  - 예루살렘과 사마리아보다
  - 예루살렘과 사마리아에서 온 것보다
  lexicon: HALOT
  rationale: 히브리어의 생략된 비교를 한국어에서 분명히 드러내기 위해 '…의 것보다'로 처리했습니다. 이는 영어 POB가 명시한 비교 의미를 반영합니다.
theological_decisions:
- issue: 히브리어의 생략된 비교를 한국어에서 얼마나 드러낼 것인가
  chosen_reading: 비교를 명시하여 '그들의 새긴 우상은 예루살렘과 사마리아의 것보다 더 컸습니다'로 옮겼습니다.
  alternative_readings:
  - '''그들의 새긴 우상과 예루살렘과 사마리아에서 온 것''처럼 더 직역적으로 옮길 수 있습니다.'
  rationale: 본문은 축약된 비교를 사용하지만 문맥상 앗수르 왕의 자만이 다른 나라들의 우상이 예루살렘과 사마리아의 것보다 더 장대하다고 주장하는 흐름입니다. 비교를 풀어 써야 독자가 본문의 논지를 즉시 이해할 수 있습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve the source text''s plain sense'
