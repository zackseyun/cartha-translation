  source_fidelity: 초안은 하나님의 파송과 명령, 약탈의 목적, 거리의 진흙처럼 짓밟힘이라는 핵심 의미를 대체로 보존합니다. 그러나 ‘발에 밟히는 자리’는 מִרְמָס를 장소로 과도하게 한정하며, ‘그것을 … 만들게 합니다’는 명령의 통사적 연결도 부자연스럽습니다. 수정문은 명령의 범위와 집합적 대상의 짓밟힘을 더 충실히 드러냅니다.
  naturalness: ‘경건치 않은’은 현대 표준어 합쇼체 성경 번역에 다소 고어적입니다. 또한 ‘한 … 나라’와 ‘발에 밟히는 자리’는 자연스럽지 않습니다. ‘불경한 나라’, ‘거리의 진흙처럼 짓밟히게’로 고쳐 현대적이고 명료한 문장으로 만들었습니다.
