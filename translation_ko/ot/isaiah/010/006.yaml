id: ISA.10.6
reference: Isaiah 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
  footnotes:
  - marker: a
    text: Or 'against an impious nation.' The Hebrew adjective can denote godlessness, profanity, or impiety.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'to spoil spoil and to plunder plunder,' an idiom intensifying the acts of looting.
    reason: lexical_alternative
  - marker: c
    text: Or 'to make him something trampled underfoot.' The Hebrew suffix is masculine singular, referring to the targeted nation/people as a collective.
    reason: alternative_reading
translation:
  language: ko
  text: 한 경건치 않은 나라를 향해 내가 그를 보내며, 내 분노의 백성을 향해 내가 그에게 명령하여 노략질을 하게 하고 노획물을 빼앗게 하며, 그것을 발에 밟히는 자리에, 길거리의 진흙같이 만들게 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건치 않은 나라’보다 더 직역하면 ‘불경한 민족’입니다. 히브리어 형용사는 하나님을 모르는 상태, 경건하지 않음, 불경함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘노략질을 노략질하고, 약탈을 약탈하는’ 식의 반복 표현으로, 약탈 행위를 강하게 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것을 밟아 짓이긴 것’입니다. 히브리어 남성 단수 접미사는 표적이 된 나라/백성 전체를 집합적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  english_pob_choice: godless nation
  chosen_korean: 경건치 않은 나라
  alternatives_korean:
  - 하나님 없는 나라
  - 불경한 나라
  - 경건치 않은 민족
  lexicon: HALOT
  rationale: חָנֵף는 단순한 위선보다 경건함/신앙의 결핍을 가리키는 뉘앙스가 있어, 문맥의 예언자적 정죄를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: אֲשַׁלְּחֶנּוּ / אֲצַוֶּנּוּ
  english_pob_choice: I send him / I command him
  chosen_korean: 내가 그를 보내며 / 내가 그에게 명령하여
  alternatives_korean:
  - 내가 그를 파견하며 / 내가 그에게 지시하여
  - 내가 그를 보내고 / 내가 그에게 명령하고
  lexicon: HALOT
  rationale: 두 동사의 직설적 의미를 살려 하나님의 주권적 파송과 명령을 분명히 드러내도록 평이하게 옮겼습니다.
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  english_pob_choice: to seize spoil and to carry off plunder
  chosen_korean: 노략질을 하게 하고 노획물을 빼앗게 하며
  alternatives_korean:
  - 전리품을 약탈하게 하고 전리품을 탈취하게 하며
  - 노략물을 노략하게 하고 약탈물을 약탈하게 하며
  lexicon: HALOT
  rationale: 히브리어의 동족목적어 반복이 강한 강세를 이루므로, 한국어에서는 중복을 그대로 재현하기보다 ‘노략질’과 ‘노획물’의 병렬로 강도를 살렸습니다.
- source_word: מִרְמָס כְּחֹמֶר חוּצוֹת
  english_pob_choice: to make it a trampling place like the mud of the streets
  chosen_korean: 그것을 발에 밟히는 자리에, 길거리의 진흙같이 만들게 합니다
  alternatives_korean:
  - 그것을 짓밟히는 곳으로, 거리의 진흙같이 만들게 합니다
  - 그것을 짓밟음이 되게 하여, 길거리의 진흙같이 만들게 합니다
  lexicon: HALOT
  rationale: מִרְמָס는 결과 상태를 나타내는 ‘밟힘/짓밟힘’의 개념이므로, 장소성과 결과성을 함께 드러내는 표현을 택했습니다. חוּצוֹת는 ‘거리/길거리’의 공적 공간을 가리켜 ‘길거리의 진흙’으로 옮겼습니다.
theological_decisions:
- issue: 분노의 대상과 하나님의 심판 언어
  chosen_reading: ‘내 분노의 백성’이라는 직접적 표현을 유지해, 하나님이 심판의 주체로서 언약 백성 또는 대상 집단에 대해 진노하신다는 긴장을 그대로 살렸습니다.
  alternative_readings:
  - ‘내가 화를 낸 백성’처럼 완화된 표현
  - ‘내 격노의 민족’처럼 더 해석적인 표현
  rationale: 본문은 עֶבְרָה를 하나님의 직접적 소유격으로 연결하므로, 이를 완화하지 않고 보존하는 것이 원문의 신학적 힘에 부합합니다.
  doctrine_reference: 예언서의 심판 선언과 하나님의 주권적 징계
- issue: 대상 대명사 ‘it’의 집합적 지시
  chosen_reading: ‘그것을’로 옮겨, 나라/백성을 집합적 대상으로 보는 히브리어 수식과 POB의 집합적 이해를 반영했습니다.
  alternative_readings:
  - ‘그들을’로 옮겨 사람들을 직접 복수로 드러내는 읽기
  - ‘그를’로 좁혀 특정 왕만 가리키는 읽기
  rationale: 히브리어 어미는 단수형이지만 집합체를 가리킬 수 있으므로, 한국어에서는 집합적 ‘그것’을 사용해 본문의 공동체적 대상성을 유지했습니다.
  doctrine_reference: 문법적 성별/수와 의미상의 집합체를 구분하여 번역
