id: ISA.10.21
reference: Isaiah 10:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁאָ֥ר יָשׁ֖וּב שְׁאָ֣ר יַעֲקֹ֑ב אֶל אֵ֖ל גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
  footnotes:
  - marker: a
    text: Or 'to God the Mighty One'; less likely, 'to a mighty god' or 'to a mighty hero.' The Hebrew title אֵל גִּבּוֹר is also used in Isaiah 9:6.
    reason: lexical_alternative
  - marker: b
    text: The wording echoes the name Shear-jashub ('a remnant will return') in Isaiah 7:3.
    reason: cross_reference
translation:
  language: ko
  text: 남은 자가 돌아올 것입니다[a], 야곱의 남은 자가 — 능하신 하나님께[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께로 돌아올 것입니다’; 덜 가능하게는 ‘능한 하나님께로’ 또는 ‘능한 영웅에게로’입니다. 히브리어 칭호 אֵל גִּבּוֹר는 이사야 9:6에도 쓰입니다.
    reason: alternative_reading
  - marker: b
    text: 이 표현은 이사야 7:3의 스알야숩(‘남은 자가 돌아올 것이다’)이라는 이름을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁאָר / יָשׁוּב
  english_pob_choice: A remnant will return
  chosen_korean: 남은 자가 돌아올 것입니다
  alternatives_korean:
  - 남은 무리가 돌아올 것입니다
  - 남은 자가 돌아오리라
  lexicon: HALOT
  rationale: שְׁאָר의 핵심 의미를 한국어 성서 문맥에서 가장 자연스럽고 신학적으로도 잘 알려진 ‘남은 자’로 옮기고, יָשׁוּב의 미래적 귀환 의미는 ‘돌아올 것입니다’로 살렸습니다.
- source_word: שְׁאָר יַעֲקֹב
  english_pob_choice: the remnant of Jacob
  chosen_korean: 야곱의 남은 자
  alternatives_korean:
  - 야곱의 남은 무리
  - 남은 야곱
  lexicon: HALOT
  rationale: 히브리어 속격 관계를 자연스러운 한국어 소유격으로 옮겼으며, 고유명사 ‘야곱’을 그대로 살려 본문의 언약적 호칭을 유지했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: — …께
  alternatives_korean:
  - …에게
  - …을 향해
  lexicon: HALOT
  rationale: 도착·지향의 방향을 나타내는 전치사는 한국어에서 동사와 결합한 종결 구조로 처리하는 것이 가장 자연스럽고, 하나님께 향하는 문맥이므로 ‘…께’를 택했습니다.
- source_word: אֵל גִּבּוֹר
  english_pob_choice: the Mighty God
  chosen_korean: 능하신 하나님
  alternatives_korean:
  - 전능하신 하나님
  - 능력의 하나님
  - 능한 신
  lexicon: HALOT
  rationale: POB의 핵심 신학 판단은 이 표현을 단순한 ‘용사’가 아니라 하나님의 칭호로 읽는 데 있으므로, 한국어도 교회적 관용과 직역 가능성을 함께 살려 ‘능하신 하나님’으로 옮겼습니다.
theological_decisions:
- issue: אֵל גִּבּוֹר의 대상이 인간 영웅이 아니라 하나님이라는 읽기
  chosen_reading: ‘능하신 하나님’으로 번역하여 귀환의 목적지를 하나님 자신으로 드러냈습니다.
  alternative_readings:
  - ‘능한 영웅’
  - ‘강한 용사’
  - ‘전능하신 하나님’
  rationale: 문맥상 ‘남은 자’가 누구에게로 돌아오는지가 핵심인데, 본문은 이 대상을 하나님의 칭호로 제시합니다. 그래서 신학적 긴장을 희석하는 인간 영웅 해석을 따르지 않고, 하나님의 위격을 드러내는 번역을 택했습니다.
  doctrine_reference: 이사야 9:6의 동일 표현과의 연관, POB의 예언적-그리스도론적 독법
- issue: 야곱/이스라엘의 교체 여부
  chosen_reading: 히브리어의 ‘야곱’을 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘
  rationale: 본문은 ‘이스라엘’이 아니라 ‘야곱’을 사용하므로, 인물/언약 명칭의 반복을 보존하는 것이 원문과 POB 주석 구조에 더 충실합니다.
  doctrine_reference: 언약 명칭 보존 원칙
