id: ISA.10.18
reference: Isaiah 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְב֤וֹד יַעְר/וֹ֙ וְ/כַרְמִלּ֔/וֹ מִ/נֶּ֥פֶשׁ וְ/עַד בָּשָׂ֖ר יְכַלֶּ֑ה וְ/הָיָ֖ה כִּ/מְסֹ֥ס נֹסֵֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
  footnotes:
  - marker: a
    text: Or 'and it will be like one wasting away'; the final Hebrew phrase is difficult, and some take the last word differently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 숲과 비옥한 땅의 영광을, 영혼에서 육체에 이르기까지 삼키실 것이며, 그것은 쇠약해져 가는 사람의 쇠잔함 같을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쇠약해지는 한 사람 같을 것입니다’; 마지막 히브리어 구절은 난해하며, 마지막 단어를 다르게 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  english_pob_choice: the glory
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 위엄
  - 번영
  lexicon: HALOT
  rationale: כָּבוֹד의 기본 의미를 살리되, 여기서는 숲과 비옥한 땅에 붙은 풍성함과 위세를 함께 드러내는 말로 ‘영광’이 가장 직접적입니다.
- source_word: יַעְרוֹ
  english_pob_choice: his forest
  chosen_korean: 그의 숲
  alternatives_korean:
  - 그의 산림
  - 그의 수풀
  lexicon: HALOT
  rationale: יַעַר는 일반적으로 ‘숲/숲속’이므로 직역에 가깝게 ‘숲’으로 옮겼습니다.
- source_word: וְכַרְמִלּוֹ
  english_pob_choice: and of his fruitful land
  chosen_korean: 비옥한 땅
  alternatives_korean:
  - 열매 맺는 땅
  - 과수원
  - 그의 갈멜
  lexicon: HALOT
  rationale: כַּרְמֶל은 여기서 고유명사 ‘갈멜’이 아니라 생산력이 풍부한 토지를 가리키므로, 의미를 살려 ‘비옥한 땅’으로 옮겼습니다.
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  english_pob_choice: from soul to flesh
  chosen_korean: 영혼에서 육체에 이르기까지
  alternatives_korean:
  - 생명에서 몸에 이르기까지
  - 혼에서 몸에 이르기까지
  - 철저히
  lexicon: HALOT
  rationale: 히브리어의 총체성 표현을 한국어에서도 구체적 대구로 유지했습니다. ‘영혼/육체’는 문자적 대응을 살리면서도 전면적 파괴의 뜻을 전달합니다.
- source_word: יְכַלֶּה
  english_pob_choice: he will consume
  chosen_korean: 삼키실 것이며
  alternatives_korean:
  - 소멸시키실 것이며
  - 끝장내실 것이며
  - 다 태우실 것이며
  lexicon: HALOT
  rationale: כלה의 ‘끝내다/소멸하다’ 의미를 심판 맥락에 맞게 강하게 살려, 소진·파괴의 이미지를 드러내는 ‘삼키다’를 택했습니다.
theological_decisions:
- issue: 마지막 난해한 구절의 처리
  chosen_reading: ‘쇠약해져 가는 사람의 쇠잔함 같을 것입니다’로 옮겨, 본문의 불확실성을 본문 안에서 최대한 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘병든 사람의 쇠약함 같을 것입니다’
  - ‘깃발 드는 자의 소멸 같을 것입니다’
  rationale: 마지막 히브리어는 문헌적으로 난해하므로, 널리 받아들여진 쇠약/쇠잔의 의미를 본문에 반영하되 단정적인 해석을 과도하게 밀어붙이지 않았습니다.
  doctrine_reference: 문자적으로 난해한 예언문 해석의 보수적 처리
- issue: 영혼과 육체의 총체성 표현
  chosen_reading: ‘영혼에서 육체에 이르기까지’로 유지했습니다.
  alternative_readings:
  - ‘생명에서 몸에 이르기까지’
  - ‘완전히’
  rationale: 히브리어의 총체적 심판을 평이하게 환원하지 않고, 본문이 가진 인류학적 긴장을 그대로 보여 주는 표현을 택했습니다.
  doctrine_reference: 예언적 심판의 전면성
