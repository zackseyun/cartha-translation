revisions:
- from: 그의 숲과 비옥한 땅의 영광을, 영혼에서 육체에 이르기까지 삼키실 것이며, 그것은 쇠약해져 가는 사람의 쇠잔함 같을 것입니다.[a]
  to: 그의 숲과 비옥한 땅의 영광을 영혼에서 육체에 이르기까지 소멸시키실 것이며, 그것은 병든 사람이 쇠약해져 가는 것과 같을 것입니다.[a]
  rationale: 수정문은 원문의 병렬 구조와 ‘영혼에서 육체에 이르기까지’라는 포괄 표현을 유지했습니다. 파괴 동사는 한국어에서 더 정확한 ‘소멸시키다’로 조정했고, 난해한 כִּמְסֹס נֹסֵס는 널리 채택되는 쇠약·질병의 의미를 자연스럽게 번역하되, 다른 어휘 분석 가능성은 각주에 남겼습니다.
