id: ISA.10.8
reference: Isaiah 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֖י יֹאמַ֑ר הֲ/לֹ֥א שָׂרַ֛/י יַחְדָּ֖ו מְלָכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/008.yaml
  text: For he says[b][a], “Are not my commanders all kings?”
  footnotes:
  - marker: a
    text: Or “my princes”; the Hebrew שָׂרַי can denote princes, rulers, officials, or commanders.
    reason: lexical_alternative
  - marker: b
    text: Literally “together”; here it carries the sense that they are all alike kings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하기를 “내 지휘관들은 모두 왕들이 아니냐?”라고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שָׂרַי는 ‘내 방백들’, ‘내 통치자들’, ‘내 관원들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘함께’이지만, 여기서는 ‘모두/한결같이’라는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יֹאמַר
  english_pob_choice: For he says
  chosen_korean: 그가 말하기를
  alternatives_korean:
  - 이는 그가 말하기 때문입니다
  - 그가 말합니다
  lexicon: HALOT
  rationale: כִּי는 앞말을 설명하는 연결로 보고, יֹאמַר는 예언적 인용을 여는 현재형 기능에 맞춰 자연스러운 간접 인용으로 옮겼습니다.
- source_word: שָׂרַי
  english_pob_choice: my commanders
  chosen_korean: 내 지휘관들
  alternatives_korean:
  - 내 방백들
  - 내 통치자들
  - 내 관원들
  lexicon: HALOT
  rationale: שַׂר는 문맥상 단순한 왕족보다 군사·행정의 고위 지휘자를 가리키므로, 영어 POB의 해석을 따라 ‘지휘관들’로 옮겨 boast의 뉘앙스를 살렸습니다.
- source_word: יַחְדָּו מְלָכִים
  english_pob_choice: all ... kings
  chosen_korean: 모두 왕들이 아니냐
  alternatives_korean:
  - 함께 왕들이 아니냐
  - 다 왕들이 아니냐
  - 한결같이 왕들이 아니냐
  lexicon: HALOT
  rationale: יַחְדָּו의 문자적 ‘함께’는 여기서 ‘모두/한결같이’라는 집합적 의미로 작동하므로, POB의 주석 취지를 반영해 ‘모두’로 자연화했습니다.
theological_decisions:
- issue: 자기 과시적 수사와 인용문 톤
  chosen_reading: 원문의 자만에 찬 반문을 그대로 살려, 고백적 완화 없이 공격적인 왕의 말투를 유지했습니다.
  alternative_readings:
  - 더 완곡한 서술문으로 바꾸기
  - 단정문으로 평탄화하기
  rationale: 이 절은 앗수르 왕의 오만한 발언을 드러내는 맥락이므로, 수사적 질문과 직설성을 보존하는 것이 원문의 효과를 가장 잘 전달합니다.
  doctrine_reference: 예언서의 심판 수사와 문맥 보존
