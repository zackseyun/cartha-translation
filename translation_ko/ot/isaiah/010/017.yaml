id: ISA.10.17
reference: Isaiah 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר יִשְׂרָאֵל֙ לְ/אֵ֔שׁ וּ/קְדוֹשׁ֖/וֹ לְ/לֶהָבָ֑ה וּ/בָעֲרָ֗ה וְ/אָֽכְלָ֛ה שִׁית֥/וֹ וּ/שְׁמִיר֖/וֹ בְּ/י֥וֹם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
  footnotes:
  - marker: a
    text: Or 'will be a fire ... a flame'; the Hebrew construction can be rendered more formally, but here likely carries the sense of becoming.
    reason: lexical_alternative
  - marker: b
    text: '''His Holy One'' is likely a divine title, referring to the LORD, a frequent theme in Isaiah.'
    reason: cross_reference
  - marker: c
    text: The Hebrew terms rendered 'thorns' and 'briers' refer to thorny growth; the first term is relatively rare and may also be understood more broadly as undergrowth.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 빛은 불이 되고, 그의 거룩하신 이는 불꽃이 될 것입니다. 그것이 한날에 그의 가시와 찔레를 태워 없앨 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불이 될 것입니다 … 불꽃이 될 것입니다’. 히브리어는 더 형식적으로도 옮길 수 있지만, 여기서는 변화의 의미가 드러납니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 거룩하신 이’는 야훼를 가리키는 신적 칭호일 가능성이 높습니다. 이사야서에서 흔한 표현입니다.
    reason: cross_reference
  - marker: c
    text: 히브리어의 두 식물 명사는 가시성 덤불을 가리키며, 앞의 단어는 더 드물고 넓게는 잡목으로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / יִהְיֶה
  english_pob_choice: will become
  chosen_korean: 불이 되고 … 불꽃이 될 것입니다
  alternatives_korean:
  - 불이 될 것입니다
  - 불로 변할 것입니다
  lexicon: HALOT
  rationale: 히브리어 היה와 뒤따르는 לְ 구조는 단순한 존재보다 ‘~이 되다’의 변화 의미를 강하게 띱니다. 한국어에서는 ‘되다’로 그 변화를 살렸습니다.
- source_word: אוֹר יִשְׂרָאֵל
  english_pob_choice: the light of Israel
  chosen_korean: 이스라엘의 빛
  alternatives_korean:
  - 이스라엘의 등불
  - 이스라엘의 빛
  lexicon: HALOT
  rationale: 수식 관계를 자연스럽게 살리면서도 메타포를 보존하기 위해 직역에 가까운 ‘이스라엘의 빛’을 택했습니다.
- source_word: וּקְדוֹשׁוֹ
  english_pob_choice: his Holy One
  chosen_korean: 그의 거룩하신 이
  alternatives_korean:
  - 그의 거룩하신 분
  - 그의 거룩한 이
  lexicon: HALOT
  rationale: 직역적으로는 ‘거룩한 이’이지만, 한국어에서 신적 호칭으로 자연스럽고 위계를 살리기 위해 존칭형 ‘거룩하신 이’를 사용했습니다.
- source_word: שִׁיתוֹ וּשְׁמִירוֹ
  english_pob_choice: his thorns and his briers
  chosen_korean: 그의 가시와 찔레
  alternatives_korean:
  - 그의 가시와 엉겅퀴
  - 그의 가시덤불과 찔레
  lexicon: HALOT
  rationale: 두 희귀/병렬 어휘를 한국어의 대응되는 가시성 식물 표현으로 옮겨, 심판 이미지와 병렬성을 유지했습니다. ‘찔레’는 반복되는 덤불성 식물을 살리는 데 유리합니다.
theological_decisions:
- issue: ‘이스라엘의 빛’과 ‘그의 거룩하신 이’의 지시 대상
  chosen_reading: 본문의 시적 칭호를 그대로 살리고, 본문 안에서 직접적으로 야훼라고 해석해 넣지 않았습니다.
  alternative_readings:
  - 야훼에 대한 분명한 호칭으로 풀어 쓰기
  - ‘이스라엘의 빛’을 하나님의 보호로 일반화하기
  rationale: 이사야 문맥상 신적 칭호임은 강하지만, 시적 표현 자체가 의도된 긴장을 유지하므로 본문 번역은 해석을 과잉 주입하지 않게 두었습니다.
  doctrine_reference: 본문-문맥 구분과 시적 칭호 보존
