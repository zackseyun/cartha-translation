  source_fidelity: 원문은 세 개의 짧은 호명·명령/탄식으로 이루어집니다. 초안은 첫 구절과 아나돗 호명은 대체로 충실하지만, הַקְשִׁיבִי לַיְשָׁה를 ‘라이사의 딸아, 들으십시오’로 옮겨 원문에 없는 ‘딸’을 보태고 문장 성분 관계를 바꾸었습니다. 이는 ‘라이사야, 귀를 기울이십시오’로 고쳐야 합니다.
  naturalness: ‘목소리를 높여 외치십시오’, ‘귀를 기울이십시오’, ‘불쌍한 아나돗이여’는 현대 표준 한국어의 격식 있는 합쇼체에서 자연스럽고, 예언적 경고의 급박한 리듬도 유지합니다.
  terminology: 지명은 통용 음역에 맞추어 갈림, 라이사, 아나돗으로 통일했습니다. ‘갈림의 딸’은 도시 또는 주민의 여성 인격화를 보존하며, 라이사에는 원문상 ‘딸’ 호칭을 추가하지 않았습니다.
