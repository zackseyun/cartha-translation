id: ISA.10.30
reference: Isaiah 10:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַהֲלִ֥י קוֹלֵ֖/ךְ בַּת גַּלִּ֑ים הַקְשִׁ֥יבִי לַ֖יְשָׁה עֲנִיָּ֥ה עֲנָתֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
  footnotes:
  - marker: a
    text: Or 'Raise a shrill cry with your voice, daughter of Gallim.' The Hebrew verb can denote a piercing or ringing cry.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'daughter of Gallim,' a personified way of addressing the town or its inhabitants.
    reason: cultural_note
  - marker: c
    text: Or 'Afflicted Anathoth' or 'Wretched Anathoth.' The adjective may express misery or oppression.
    reason: lexical_alternative
translation:
  language: ko
  text: “갈림의 딸아[b], 네 목소리를 높여 외치십시오[a]! 라이사야[c], 귀를 기울이십시오! 불쌍한 아나돗이여!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 날카롭거나 울려 퍼지는 외침을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘딸’은 도시나 그 주민을 인격화하여 부르는 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘라이사’는 지명으로 보는 것이 자연스럽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי קוֹלֵךְ
  english_pob_choice: Cry aloud / with your voice
  chosen_korean: “큰 소리로 외치십시오”
  alternatives_korean:
  - “외치십시오”
  - “높은 소리로 외치십시오”
  - “날카로운 소리로 외치십시오”
  lexicon: HALOT
  rationale: 히브리어 동사 צהל은 단순한 ‘말하다’가 아니라 높고 날카로운 울부짖음이나 외침을 가리킬 수 있어, 한국어에서는 ‘큰 소리로 외치다’가 긴급성과 청각적 강도를 가장 자연스럽게 살립니다.
- source_word: בַּת גַּלִּים
  english_pob_choice: daughter of Gallim
  chosen_korean: “가틀림의 딸”
  alternatives_korean:
  - “갤림의 딸”
  - “가림의 딸”
  - “갤림의 딸아”
  lexicon: HALOT
  rationale: 예언서의 인격화된 호칭을 살리기 위해 ‘딸’ 이미지를 유지했고, 지명은 음역하되 한국어 표기 관행에 맞춰 외래어 표기법에 가까운 형태로 옮겼습니다.
- source_word: הַקְשִׁיבִי לַיְשָׁה
  english_pob_choice: Listen, Laishah!
  chosen_korean: “라이사의 딸아, 들으십시오!”
  alternatives_korean:
  - “라이사야, 들으십시오!”
  - “라이사에 귀를 기울이십시오!”
  - “라이스야, 들어라!”
  lexicon: HALOT
  rationale: הקשיב는 단순 청취보다 ‘주의를 기울여 듣다’는 뜻이지만, 한국어에서는 직설적인 예언적 촉구를 위해 ‘들으십시오’가 가장 간결하고 자연스럽습니다. 원문이 도시를 부르는 병행구조이므로 호격을 유지했습니다.
- source_word: עֲנִיָּה עֲנָתוֹת
  english_pob_choice: O poor Anathoth
  chosen_korean: “불쌍한 아나돗이여!”
  alternatives_korean:
  - “가련한 아나돗이여!”
  - “가난한 아나돗이여!”
  - “고통받는 아나돗이여!”
  lexicon: HALOT
  rationale: עֲנִיָּה는 ‘가난한/불쌍한/고통받는’의 범위를 가지며, 여기서는 도시의 처참한 처지를 탄식하는 말이므로 ‘불쌍한’이 과도한 해석 없이 정서적 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: 예언적 도시 호칭의 인격화
  chosen_reading: 도시를 여성형 딸로 부르는 예언적 수사로 처리했습니다.
  alternative_readings:
  - 지명 목록으로 건조하게 번역
  - ‘주민들’로 의미를 풀이하여 번역
  rationale: 원문의 ‘딸’ 형식은 단순 지명이 아니라 도시를 인격화해 심판의 긴박함을 드러내는 표현이므로, 이를 보존해야 독자가 본문의 수사 효과를 이해할 수 있습니다.
  doctrine_reference: 예언서의 수사와 심판 선언
- issue: 감탄문과 명령문의 긴박성
  chosen_reading: 세 개의 짧은 호명과 명령을 분절해 긴박한 경고의 리듬을 살렸습니다.
  alternative_readings:
  - 한 문장으로 매끄럽게 합쳐 번역
  - 설명적 문장으로 완화
  rationale: 히브리어 원문은 연쇄적 호명과 명령으로 급박한 전쟁 경보를 형성하므로, 한국어에서도 그 압박감을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 본문의 문학적·예언적 힘 보존
