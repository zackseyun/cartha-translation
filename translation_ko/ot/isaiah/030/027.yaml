id: ISA.30.27
reference: Isaiah 30:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
  footnotes:
  - marker: a
    text: Or 'and dense smoke'; the Hebrew phrase is difficult and may also be understood more literally as 'and heaviness of lifting up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼의 이름이 먼 곳에서 오십니다. 그분의 분노는 타오르며, 짙은 연기가 피어오릅니다.[a] 그분의 입술은 분노로 가득하고, 그분의 혀는 삼키는 불과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 난해합니다. 이를 ‘짙은 연기’로 이해할 수 있으며, 더 문자적으로는 ‘들어 올림의 무게’ 또는 ‘들어 올림의 무거움’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 장면을 환기하는 주의를 끄는 감탄사로, 현대 문어에서 자연스럽고 정중한 호소인 ‘보십시오’가 합쇼체 본문에 잘 맞습니다.
- source_word: שֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 야훼의 이름
  alternatives_korean:
  - 야훼
  - 야훼의 명
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’ 표현을 유지해 단순한 주어화로 풀지 않고, 하나님의 현존과 계시된 권위를 드러내는 표현을 살렸습니다.
- source_word: וְכֹבֶד מַשָּׂאָה
  english_pob_choice: with dense smoke
  chosen_korean: 짐처럼 무거운 연기가 그와 함께합니다
  alternatives_korean:
  - 짙은 연기가 함께합니다
  - 무거운 연기가 함께합니다
  lexicon: HALOT
  rationale: 본문이 난해하므로 영어 POB의 주석처럼 ‘dense smoke’와 ‘heavy rising smoke’ 사이의 긴장을 보존하면서, ‘무거운’과 ‘연기’로 구체적 이미지가 드러나게 옮겼습니다.
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  english_pob_choice: his lips are full of wrath
  chosen_korean: 그의 입술은 분노로 가득하고
  alternatives_korean:
  - 그의 입술에는 진노가 가득하고
  - 그의 입술은 격분으로 가득하고
  lexicon: HALOT
  rationale: 입술이 가득하다는 직접적 표현을 살려, 심판 선언의 강한 수사와 감정의 충만함을 자연스러운 한국어로 전달했습니다.
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  english_pob_choice: and his tongue is like a consuming fire
  chosen_korean: 그의 혀는 삼키는 불과 같습니다
  alternatives_korean:
  - 그의 혀는 소멸시키는 불과 같습니다
  - 그의 혀는 먹어 삼키는 불과 같습니다
  lexicon: HALOT
  rationale: ‘אֹכָלֶת’의 파괴적 작용을 ‘삼키는’으로 옮겨, 시적 비유를 유지하면서도 현대 한국어에서 강하고 명확하게 읽히도록 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 신명은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어를 따라 히브리어 고유 신명을 직접 드러내어, 예언문맥의 언약적·계시적 뉘앙스를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘이름’의 유지 여부
  chosen_reading: ‘야훼의 이름’으로 유지했습니다.
  alternative_readings:
  - 야훼가
  rationale: 히브리어가 실제로 ‘이름’이 온다고 말하므로, 이를 지워버리면 하나님의 현현이 지닌 신학적 긴장이 약화됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
