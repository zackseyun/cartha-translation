id: ISA.30.18
reference: Isaiah 30:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
  footnotes:
  - marker: a
    text: Or, 'therefore he is exalted to show you mercy' or 'therefore he exalts himself to show you mercy.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 야훼께서는 여러분에게 은혜를 베푸시려고 기다리시며, 또 여러분에게 자비를 베푸시려고 일어나십니다.[a] 이는 야훼께서 정의의 하나님이시기 때문입니다. 그분을 기다리는 모든 사람에게는 복이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분에게 자비를 베푸시려고 높임을 받으십니다’ 혹은 ‘여러분에게 자비를 베푸시려고 스스로 높이십니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 제목어로 바꾸지 않고 고유명사로 살려, POB의 야훼 용례를 그대로 따랐습니다.
- source_word: יְחַכֶּה
  english_pob_choice: waits
  chosen_korean: 기다리시며
  alternatives_korean:
  - 기다리십니다
  - 머무르시며
  lexicon: HALOT
  rationale: חכה의 기본 의미인 ‘기다리다’를 직접 살리면서, 뒤의 목적절과 자연스럽게 이어지도록 연결형으로 옮겼습니다.
- source_word: לַחֲנַנְכֶם
  english_pob_choice: to be gracious to you
  chosen_korean: 여러분에게 은혜를 베푸시려고
  alternatives_korean:
  - 여러분에게 은혜를 주시려고
  - 여러분에게 은혜로우시려고
  lexicon: HALOT
  rationale: חנן의 ‘은혜를 베풀다’라는 언약적 뉘앙스를 살렸고, רחם의 ‘자비’와 구별되도록 표현했습니다.
- source_word: יָרוּם
  english_pob_choice: rises up
  chosen_korean: 일어나십니다
  alternatives_korean:
  - 높아지십니다
  - 들리십니다
  - 일어서십니다
  lexicon: HALOT
  rationale: 문맥상 단순한 높아짐보다 구원 행동으로 나아가는 동적 이미지를 살렸습니다. 다만 히브리어의 ‘높아지다/높임을 받다’ 여지도 있어 footnote로 남겼습니다.
- source_word: לְרַחֶמְכֶם
  english_pob_choice: to show you mercy
  chosen_korean: 여러분에게 자비를 베푸시려고
  alternatives_korean:
  - 여러분을 불쌍히 여기시려고
  - 여러분에게 긍휼을 베푸시려고
  lexicon: HALOT
  rationale: רחם의 핵심 의미를 한국어 성서 문맥에서 자연스러운 ‘자비를 베풀다’로 옮겨, 앞의 ‘은혜’와 대응시키면서도 중복을 피했습니다.
- source_word: אֱלֹהֵי מִשְׁפָּט
  english_pob_choice: a God of justice
  chosen_korean: 정의의 하나님
  alternatives_korean:
  - 공의의 하나님
  - 심판의 하나님
  lexicon: HALOT
  rationale: מִשְׁפָּט의 여기서의 초점은 심판 행위보다 하나님의 արդ바른 통치와 공정성에 있으므로, 현대 한국어에서 더 명료한 ‘정의’로 옮겼습니다.
theological_decisions:
- issue: יָרוּם의 의미를 행동적 상승으로 볼지, 상태적 고양으로 볼지
  chosen_reading: ‘일어나십니다’로 번역해 하나님의 구원 행동을 드러냈습니다.
  alternative_readings:
  - 높아지십니다
  - 스스로 높아지십니다
  rationale: 본문은 ‘은혜를 베푸시려고’와 ‘자비를 베푸시려고’라는 목적구와 나란히 서 있어, 추상적 높음보다 구체적 개입을 암시하는 읽기가 흐름에 더 잘 맞습니다. 동시에 원문의 모호성은 해소하지 않고 보존해야 하므로 번역과 별도로 footnote를 붙였습니다.
  doctrine_reference: 'POB 번역 원칙: 신학적 긴장을 지우지 말고 원문의 다의성을 보존할 것'
