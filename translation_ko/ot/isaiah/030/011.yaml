  source_fidelity: 본문의 세 명령은 각각 ‘길에서 돌아서라’, ‘행로에서 벗어나라’, ‘이스라엘의 거룩하신 이를 우리 앞에서 없애라’는 병행을 이룹니다. 초안의 본문은 대체로 뜻을 전달하지만, 각주가 첫 동사 סוּרוּ를 사역형으로 설명하는 것은 원문과 맞지 않습니다. 사역형(히필)은 셋째 동사 הַשְׁבִּיתוּ에 해당합니다.
  naturalness: ‘길에서 돌아서십시오’와 ‘길에서 벗어나십시오’는 자연스럽지만, ‘행로’로 옮기면 원문의 דֶּרֶךְ/אֹרַח 병행을 지나치게 해석하지 않으면서도 반복을 줄일 수 있습니다. ‘없애십시오’는 현대의 격식 있는 문체에서 적대적인 요구를 명료하게 나타냅니다.
  terminology: ‘이스라엘의 거룩하신 이’는 이사야서의 반복되는 신적 칭호를 충실히 보존합니다. 이를 유지하는 것이 적절합니다.
  issues:
  - severity: high
    issue: 각주 a가 첫 명령 ‘돌아서십시오’에 붙어 있으나, 이를 사역적 뉘앙스로 설명합니다.
    rationale: סוּרוּ는 סור의 칼 명령형 복수이며 사역형이 아닙니다. 사역적 의미는 셋째 명령 הַשְׁבִּיתוּ(‘없애라/그치게 하라’)에 있습니다. 현 각주는 원문 형태와 각주 앵커 모두에 관해 오해를 낳습니다.
  - severity: low
    issue: 두 병행 구가 모두 ‘길’로 번역되어 דֶּרֶךְ와 אֹרַח의 시적 변주가 약화됩니다.
    rationale: 두 낱말은 근의어이므로 과도한 구별은 피해야 하지만, ‘길/행로’는 의미를 유지하면서 병행 표현을 드러냅니다.
