translation:
  language: ko
  text: 「길에서 돌아서십시오. 행로에서 벗어나십시오. 이스라엘의 거룩하신 이를 우리 앞에서 없애십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּרוּ / מִנֵּי דֶרֶךְ
  english_pob_choice: Turn aside from the way
  chosen_korean: “길에서 돌아서십시오”
  alternatives_korean:
  - “길에서 벗어나십시오”
  - “길에서 물러나십시오”
  lexicon: HALOT
  rationale: 히브리어의 도상적 표현을 살려 ‘길’에서 방향을 바꾸는 느낌을 유지했습니다. 첫 번째 명령은 원문의 ‘turn aside’와 가장 가깝게 맞추었습니다.
- source_word: הַטּוּ / מִנֵּי אֹרַח
  english_pob_choice: depart from the path
  chosen_korean: “길에서 벗어나십시오”
  alternatives_korean:
  - “샛길에서 떠나십시오”
  - “그 길에서 치우십시오”
  lexicon: HALOT
  rationale: 두 번째 병행명령은 자연스러운 한국어로 풀되, 앞 구와 중복을 줄이면서도 ‘path’의 병행을 살렸습니다. ‘오라흐’의 시적 동의어성을 반영해 같은 ‘길’ 계열로 번역했습니다.
- source_word: הַשְׁבִּיתוּ
  english_pob_choice: remove
  chosen_korean: “치워 버리십시오”
  alternatives_korean:
  - “제거하십시오”
  - “없애십시오”
  - “사라지게 하십시오”
  lexicon: HALOT
  rationale: 히필형의 강한 사역 뉘앙스를 살리면서, 문맥상 인격적 대상인 ‘이스라엘의 거룩하신 이’를 전면에서 물러나게 하라는 적대적 요구를 한국어로 분명히 드러냈습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: “이스라엘의 거룩하신 이”
  alternatives_korean:
  - “이스라엘의 거룩하신 분”
  - “이스라엘의 성자”
  lexicon: HALOT
  rationale: 이사야서의 고정 신칭을 직역하여 ‘거룩하신 이’로 유지했습니다. ‘거룩하신 분’보다 원문의 호칭성과 반복성을 더 잘 보존합니다.
theological_decisions:
- issue: “이스라엘의 거룩하신 이”의 신학적 기능
  chosen_reading: 하나님을 가리키는 이사야서의 표제적 호칭으로 그대로 유지했습니다.
  alternative_readings:
  - 추상적 거룩함의 의인화
  - 예언자 메시지 자체에 대한 지칭
  rationale: 본문은 백성이 야훼의 임재와 책망을 원치 않아 그분을 ‘우리 앞에서’ 치워 달라고 요구하는 장면입니다. 호칭을 그대로 두어 거부의 대상이 하나님 자신이라는 점을 분명히 했습니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 5
