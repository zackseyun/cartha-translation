  text: וּ/מִצְרַ֕יִם הֶ֥בֶל וָ/רִ֖יק יַעְזֹ֑רוּ לָ/כֵן֙ קָרָ֣אתִי לָ/זֹ֔את רַ֥הַב הֵ֖ם שָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
  footnotes:
  - marker: a
    text: Hebrew Rahab, a poetic name or epithet for Egypt; it can also suggest 'arrogance' or 'boastfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Rahab—they sit still,' or 'the boaster who does nothing.' The Hebrew phrase is compressed and likely taunting Egypt as proud yet inactive.
    reason: alternative_reading
translation:
  language: ko
  text: 애굽의 도움은 헛되고 쓸모없습니다[a]. 그러므로 나는 애굽을 “라합, 가만히 앉아 있는 자”라고 불렀습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘헛됨’과 ‘공허함/무가치함’을 나란히 써서 애굽의 도움이 전혀 쓸모없음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘라합’은 애굽을 가리키는 시적 이름 또는 별칭이며, ‘교만’이나 ‘자랑함’의 뉘앙스도 띨 수 있습니다. 또는 ‘라합—그들은 가만히 앉아 있다’, ‘아무 일도 하지 않는 교만한 자’로 옮길 수 있습니다. 히브리어 표현은 압축되어 있으며, 교만하지만 실제로는 행동하지 않는 애굽을 조롱하는 말일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  english_pob_choice: For Egypt’s
  chosen_korean: 애굽의
  alternatives_korean:
  - 그리고 애굽의
  - 이제 애굽의
  lexicon: HALOT
  rationale: 문맥상 이유를 드는 설명 절이므로, 한국어에서는 소유격으로 자연스럽게 이어서 ‘애굽의 도움’으로 옮겼습니다. ‘애굽’은 이사야서에서 널리 쓰이는 지명 표기입니다.
- source_word: הֶבֶל וָרִיק
  english_pob_choice: utterly empty and worthless
  chosen_korean: 헛되고 헛되며
  alternatives_korean:
  - 허무하고 무가치하며
  - 헛되고 쓸모없으며
  - 헛되고 공허하며
  lexicon: HALOT
  rationale: 두 단어의 병렬은 도움의 무가치함을 강조하는 중첩 표현이므로, 한국어에서도 반복으로 강도를 살렸습니다. ‘헛되다’는 두 낱말의 의미 영역을 함께 아우르면서도 성경 문체에 자연스럽습니다.
- source_word: רַהַב הֵם שָׁבֶת
  english_pob_choice: Rahab Who Sits Still
  chosen_korean: 가만히 앉아 있는 라합
  alternatives_korean:
  - 라합, 가만히 앉아 있는 자
  - 가만히 앉아 있는 자 라합
  - 앉아만 있는 라합
  lexicon: HALOT
  rationale: רַהַב는 애굽을 가리키는 시적 별칭으로 음역을 유지하고, הֵם שָׁבֶת의 조롱적 이미지는 ‘가만히 앉아 있는’으로 옮겨 원문의 풍자적 대비를 살렸습니다.
theological_decisions:
- issue: 애굽에 붙는 조롱 별칭 רַהַב הֵם שָׁבֶת의 처리
  chosen_reading: 시적 별칭을 보존하면서, ‘가만히 앉아 있는 라합’이라는 조롱적 이름으로 읽었습니다.
  alternative_readings:
  - ‘라합—그들은 가만히 앉아 있다’
  - ‘교만한 자가 아무 일도 하지 않는다’
  - ‘가만히 앉아 있는 교만’
  rationale: 이 구절은 교리 진술이 아니라 예언적 풍자이므로, 애굽을 향한 조롱과 인격화된 별칭을 그대로 살리는 쪽이 본문 효과를 가장 잘 전달합니다. 히브리어가 압축적이고 다의적이므로, 해석을 과도하게 단정하지 않았습니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 보존한다.'
