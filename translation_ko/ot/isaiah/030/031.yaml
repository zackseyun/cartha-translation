id: ISA.30.31
reference: Isaiah 30:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מִ/קּ֥וֹל יְהוָ֖ה יֵחַ֣ת אַשּׁ֑וּר בַּ/שֵּׁ֖בֶט יַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
  footnotes:
  - marker: a
    text: Or 'will be dismayed' or 'will be broken'; the Hebrew verb can denote terror, collapse, or shattering.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not repeat the subject of 'will strike'; it is most naturally understood as the LORD from the previous phrase.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼의 음성으로 앗수르가 무너질 것이기 때문입니다[a][b]. 그가 막대기로 치실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 두려워함, 붕괴, 산산이 부서짐까지 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '칠 것이다'의 주어를 반복하지 않으며, 가장 자연스럽게는 앞절의 야훼를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל יְהוָה
  english_pob_choice: at the voice of Yahweh
  chosen_korean: 야훼의 음성으로
  alternatives_korean:
  - 야훼의 소리로
  - 야훼의 음성을 듣고
  lexicon: HALOT
  rationale: מִן + קוֹל은 단순 출처보다 원인/계기를 나타내므로, 한국어에서는 '…의 음성으로'가 자연스럽게 그 힘을 살립니다.
- source_word: יֵחַת
  english_pob_choice: will be shattered
  chosen_korean: 무너질 것이기
  alternatives_korean:
  - 두려워할 것이기
  - 깨어질 것이기
  - 떨 것이기
  lexicon: HALOT
  rationale: 문맥이 앗수르에 대한 심판이므로, 내적 공포만이 아니라 군사적·정치적 붕괴까지 포함하는 '무너지다'가 가장 적절합니다.
- source_word: בַּשֵּׁבֶט
  english_pob_choice: with a rod
  chosen_korean: 막대기로
  alternatives_korean:
  - 지팡이로
  - 막대[杖]로
  - 홀로
  lexicon: HALOT
  rationale: 여기서는 치는 도구의 의미가 분명하므로, '막대기'가 문맥상 가장 직접적입니다. '홀'은 왕권 뉘앙스가 강해 오해를 줄 수 있습니다.
- source_word: יַכֶּה
  english_pob_choice: he will strike
  chosen_korean: 치실 것입니다
  alternatives_korean:
  - 때리실 것입니다
  - 치게 될 것입니다
  - 치십니다
  lexicon: HALOT
  rationale: 주어가 앞절의 야훼로 이어진다는 영어 POB의 판단을 반영하되, 현대 한국어에서 심판 행위를 자연스럽게 드러내는 '치다'를 택했습니다.
theological_decisions:
- issue: יַכֶּה의 생략된 주어
  chosen_reading: 마지막 절은 앞절과 연결된 야훼를 주어로 읽어 '그가 막대기로 치실 것입니다'로 옮겼습니다.
  alternative_readings:
  - 주어를 드러내지 않고 '막대기로 칠 것입니다'라고 옮길 수 있습니다.
  - 주어를 앗수르로 돌려 수동적으로 읽는 가능성도 있습니다.
  rationale: 히브리어는 주어를 생략하지만, 가장 가까운 선행사는 야훼이며 문맥상 심판 주체도 야훼입니다. 이 연결을 한국어에 반영하되, 본문 흐름을 해치지 않도록 간결하게 처리했습니다.
  doctrine_reference: 문맥상 선행사와 생략 주어 해석
- issue: יֵחַת의 의미 범위
  chosen_reading: '''무너질''은 공포, 붕괴, 패배를 함께 포괄하는 번역으로 보았습니다.'
  alternative_readings:
  - '''두려워할 것입니다''처럼 심리 상태에 좁힐 수 있습니다.'
  - '''깨어질 것입니다''처럼 파괴 이미지를 더 직접화할 수 있습니다.'
  rationale: 히브리어 חתת의 의미 범위가 넓고, 이 절은 앗수르의 심판을 말하므로 단순 감정이 아닌 총체적 붕괴를 드러내는 표현이 필요합니다.
  doctrine_reference: 어휘의 다의성 보존
