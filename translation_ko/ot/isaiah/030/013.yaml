revisions:
- from: 그러므로 이 죄악은 여러분에게 무너져 내리는 갈라짐 같고, 높은 성벽에서 불룩하게 부풀어 오른 곳 같으며, 그 무너짐은 갑자기, 순식간에 찾아올 것입니다.[a]
  to: 그러므로 이 죄악은 여러분에게 높이 솟은 성벽에 불룩하게 튀어나와 무너져 내리는 틈[a]과 같을 것이며, 그 붕괴는 갑자기, 순식간에 닥쳐올 것입니다.
  rationale: 성벽의 파손된 틈이 불룩하게 돌출되어 붕괴하는 하나의 비유임을 문장 구조로 명확히 했습니다. ‘갑자기, 순식간에’는 פִּתְאֹם לְפֶתַע의 강조를 유지하며, ‘그 붕괴’는 여성 단수 접미사가 가리키는 앞선 비유 대상의 파괴를 자연스럽게 잇습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:41Z'
