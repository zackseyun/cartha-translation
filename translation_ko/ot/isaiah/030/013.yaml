base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: ko
  text: 그러므로 이 죄악은 여러분에게 무너져 내리는 갈라짐 같고, 높은 성벽에서 불룩하게 부풀어 오른 곳 같으며, 그 무너짐은 갑자기, 순식간에 찾아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈라짐’은 성벽의 붕괴 직전의 틈을 가리키는 비유적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: conjunction
  rationale: 결론 전환을 자연스럽게 살리되, 예언 문맥에 맞는 단정적 연결어로 옮겼습니다.
- source_word: הֶעָוֹן הַזֶּה
  english_pob_choice: this iniquity
  chosen_korean: 이 죄악은
  alternatives_korean:
  - 이 죄는
  - 이 불의는
  lexicon: עָוֹן
  rationale: עָוֹן의 도덕적·언약적 무게를 살려 단순한 ‘잘못’보다 강한 ‘죄악’으로 옮겼습니다.
- source_word: כְּפֶרֶץ נֹפֵל נִבְעֶה בְּחוֹמָה נִשְׂגָּבָה
  english_pob_choice: like a falling breach, bulging out in a high wall
  chosen_korean: 무너져 내리는 갈라짐 같고, 높은 성벽에서 불룩하게 부풀어 오른 곳 같으며
  alternatives_korean:
  - 무너져 가는 틈 같고, 높은 성벽이 불룩하게 부풀어 오른 것 같으며
  - 무너질 듯한 붕괴의 틈 같고, 높은 성벽이 부풀어 오른 것 같으며
  lexicon: כְּפֶרֶץ / נֹפֵל / נִבְעֶה / חוֹמָה נִשְׂגָּבָה
  rationale: ‘falling breach’의 진행성과 ‘bulging out’의 시각적 압력을 함께 드러내기 위해 ‘갈라짐’과 ‘불룩하게 부풀어 오른 곳’을 병렬로 살렸습니다.
- source_word: שִׁבְרָהּ
  english_pob_choice: breaking
  chosen_korean: 무너짐
  alternatives_korean:
  - 붕괴
  - 파괴
  lexicon: שׁבר
  rationale: 성벽 문맥에서 ‘breaking’은 물리적 붕괴를 가리키므로, 과도하게 추상화하지 않고 ‘무너짐’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 심판의 비유적 강도 유지
  chosen_reading: 문자적 파괴 묘사로 완화하지 않고, 죄악이 곧 붕괴를 초래하는 이미지로 유지했습니다.
  alternative_readings:
  - ‘잘못’이나 ‘문제’로 약화
  - ‘갈라짐’을 단순한 균열 정도로 축소
  rationale: 본문은 도덕적 실패와 그에 따른 급작스러운 파멸을 강하게 연결하므로, 심판의 위협을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 예언서 심판 경고의 수사(사 30:13)
