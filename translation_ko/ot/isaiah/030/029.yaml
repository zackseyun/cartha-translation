  rationale: 히트파엘의 קדשׁ는 절기가 성스럽게 구별되는 뜻이므로, 단순한 ‘기쁘다’보다 예배적·절기적 분위기가 드러나도록 옮겼습니다.
- source_word: בֶּחָלִיל
