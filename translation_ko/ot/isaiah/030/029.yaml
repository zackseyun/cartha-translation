  rationale: 본문의 고유 신명은 프로젝트 기본 원칙에 따라 칭호가 아니라 고유명사인 ‘야훼’로 옮겼습니다.
- source_word: צוּר יִשְׂרָאֵל
  english_pob_choice: the Rock of Israel
  chosen_korean: 이스라엘의 반석
  alternatives_korean:
  - 이스라엘의 바위
  - 이스라엘의 바위이신 분
  lexicon: HALOT
  rationale: צוּר의 비유적·칭호적 힘을 살려, 단순한 지형물이 아니라 보호와 견고함을 나타내는 신적 호칭으로 유지했습니다.
theological_decisions:
- issue: בֶּחָלִיל의 악기 이미지
  chosen_reading: 나팔을 불며
  alternative_readings:
  - 피리를 불며
  - 관악기를 불며
  rationale: 히브리어 חליל은 축제 행렬의 관악기를 가리키며, 한국어에서는 ‘피리’보다 예배·행렬의 장엄한 분위기를 살리는 ‘나팔을 불며’가 문맥상 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source-force and festive procession imagery without flattening it'
- issue: בְהַר יְהוָה와 צוּר יִשְׂרָאֵל의 병렬
  chosen_reading: 야훼의 산으로, 이스라엘의 반석께 나아가는
  alternative_readings:
  - 야훼의 산으로 가는
  - 이스라엘의 반석에게 이르는
  rationale: ‘산’과 ‘반석’의 병렬을 유지해 예배의 목적지이자 신적 보호처라는 두 이미지를 함께 드러냈습니다.
  doctrine_reference: DOCTRINE.md Preserve theological tension and title-metaphor force
