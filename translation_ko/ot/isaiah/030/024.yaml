base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
  footnotes:
  - marker: a
    text: Or 'salted fodder'; the Hebrew adjective may refer more specifically to fodder improved by salting or seasoning.
    reason: lexical_alternative
  - marker: b
    text: The final phrase names two agricultural tools used for winnowing, traditionally rendered 'shovel and fork' or 'shovel and winnowing fork.'
    reason: cultural_note
translation:
  language: ko
  text: 밭을 가는 소와 나귀는 소금 친 사료를 먹을 것입니다[a]. 그 사료는 삽과 쇠스랑으로 까부른 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양념한 사료’. 히브리어 형용사는 소금을 쳐 사료의 맛을 더한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 까부르는 데 쓰는 두 농기구를 가리킵니다. 전통적으로 ‘삽과 포크’ 또는 ‘삽과 까부르는 포크’로도 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים / הָעֲיָרִים
  english_pob_choice: the oxen / the donkeys
  chosen_korean: 소와 나귀
  alternatives_korean:
