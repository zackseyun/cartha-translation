  lexicon: HALOT
  rationale: 작업용 가축이라는 문맥을 살려 현대 한국어에서 자연스러운 기본 명칭인 ‘소와 나귀’로 옮겼습니다.
- source_word: עֹבְדֵי הָאֲדָמָה
  english_pob_choice: that work the ground
  chosen_korean: 땅을 일하는 자들로서
  alternatives_korean:
