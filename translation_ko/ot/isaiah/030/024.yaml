source:
  edition: WLC
  text: וְ/הָ/אֲלָפִ֣ים וְ/הָ/עֲיָרִ֗ים עֹֽבְדֵי֙ הָֽ/אֲדָמָ֔ה בְּלִ֥יל חָמִ֖יץ יֹאכֵ֑לוּ אֲשֶׁר זֹרֶ֥ה בָ/רַ֖חַת וּ/בַ/מִּזְרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
  footnotes:
  - marker: a
    text: Or 'salted fodder'; the Hebrew adjective may refer more specifically to fodder improved by salting or seasoning.
    reason: lexical_alternative
  - marker: b
    text: The final phrase names two agricultural tools used for winnowing, traditionally rendered 'shovel and fork' or 'shovel and winnowing fork.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 소와 나귀는 땅을 일하는 자들로서 양념한 사료를 먹을 것이며[a], 이는 삽과 포크로 까부른 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소금 친 사료’. 히브리어 형용사는 더 구체적으로 소금을 치거나 양념한 사료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 까부르는 데 쓰는 두 농기구를 가리키며, 전통적으로 ‘삽과 포크’ 또는 ‘삽과 키질 포크’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים / הָעֲיָרִים
  english_pob_choice: the oxen / the donkeys
  chosen_korean: 소와 나귀
  alternatives_korean:
  - 황소와 나귀
  - 소떼와 나귀떼
  lexicon: HALOT
  rationale: 작업용 가축이라는 문맥을 살려 현대 한국어에서 자연스러운 기본 명칭인 ‘소와 나귀’로 옮겼습니다.
- source_word: עֹבְדֵי הָאֲדָמָה
  english_pob_choice: that work the ground
  chosen_korean: 땅을 일하는 자들로서
  alternatives_korean:
  - 땅을 가는 자들로서
  - 땅을 일구는 자들로서
  lexicon: HALOT
  rationale: 동물들의 농경 기능을 분명히 드러내기 위해 직역에 가깝게 ‘땅을 일하는’으로 유지했습니다.
- source_word: בְּלִיל חָמִיץ
  english_pob_choice: seasoned fodder
  chosen_korean: 양념한 사료
  alternatives_korean:
  - 소금 친 사료
  - 간을 맞춘 사료
  - 섞어 만든 사료
  lexicon: HALOT
  rationale: 문맥상 가축 사료의 품질을 높인 뜻이지만 어휘적으로는 ‘seasoned/salted’의 긴장이 있어, POB의 해석을 따르되 과도하게 특정하지 않는 ‘양념한 사료’로 옮겼습니다.
- source_word: בָרַחַת וּבַמִּזְרֶה
  english_pob_choice: with shovel and fork
  chosen_korean: 삽과 포크로
  alternatives_korean:
  - 삽과 키로
  - 삽과 까부르는 포크로
  - 삽과 키질 포크로
  lexicon: HALOT
  rationale: 두 농기구의 기본 이미지를 현대 독자가 이해하기 쉬운 말로 옮기되, 본문의 까부르는 도구라는 기능은 동사 ‘까부른’으로 보완했습니다.
theological_decisions:
- issue: בְּלִיל חָמִיץ의 의미 범위
  chosen_reading: ‘양념한 사료’로 번역해, 소금/간을 포함할 수 있는 ‘seasoned’의 해석 여지를 열어 두었습니다.
  alternative_readings:
  - ‘소금 친 사료’
  - ‘간을 맞춘 사료’
  - ‘발효한 사료’
  rationale: 히브리어 형용사는 정확한 조리법을 단정하기보다 ‘가공되어 맛이 더해진 사료’의 개념을 담을 수 있어, 특정 방법으로 고정하지 않는 번역이 본문 긴장을 보존합니다.
  doctrine_reference: 사전적·주석적 불확정성 보존
