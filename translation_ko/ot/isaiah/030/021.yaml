id: ISA.30.21
reference: Isaiah 30:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָזְנֶ֨י/ךָ֙ תִּשְׁמַ֣עְנָה דָבָ֔ר מֵֽ/אַחֲרֶ֖י/ךָ לֵ/אמֹ֑ר זֶ֤ה הַ/דֶּ֨רֶךְ֙ לְכ֣וּ ב֔/וֹ כִּ֥י תַאֲמִ֖ינוּ וְ/כִ֥י תַשְׂמְאִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
  footnotes:
  - marker: a
    text: Or, 'when you go to the right and when you go to the left.' The Hebrew verbs in this final clause are difficult; the sense is that guidance will come whenever you are about to turn either way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신의 귀는 뒤에서 말하는 한 말씀을 들을 것입니다. 「이것이 길입니다. 그 길로 가십시오.」 너희가 오른쪽으로 치우칠 때나 왼쪽으로 치우칠 때나 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오른쪽으로 갈 때나 왼쪽으로 갈 때나.’ 히브리어 마지막 절의 동사들은 난해하며, 오른쪽이든 왼쪽이든 방향을 바꾸려는 순간마다 인도가 온다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנֶיךָ
  english_pob_choice: your ears
  chosen_korean: 당신의 귀는
  alternatives_korean:
  - 당신의 귀들이
  - 네 귀는
  lexicon: HALOT
  rationale: 히브리어 복수형을 한국어에서도 복수성 있는 ‘귀들’로 옮길 수 있지만, 자연스러운 문장 흐름에서는 집합적 단수보다 ‘귀는’이 더 매끄럽고, 뒤의 ‘들을 것입니다’와 함께 청각 이미지를 살립니다.
- source_word: דָבָר
  english_pob_choice: a word
  chosen_korean: 한 말씀
  alternatives_korean:
  - 한 말
  - 한 말씀
  lexicon: HALOT
  rationale: 직역상 ‘말/말씀’이 가능하며, 예언적 위로와 인도를 담은 짧은 발화를 살리기 위해 ‘한 말씀’으로 옮겼습니다.
- source_word: מֵאַחֲרֶיךָ
  english_pob_choice: behind you
  chosen_korean: 뒤에서
  alternatives_korean:
  - 뒤로부터
  - 등 뒤에서
  lexicon: HALOT
  rationale: ‘behind you’의 위치감을 한국어 자연어로 간결하게 살려, 인도하는 음성이 뒤쪽에서 들려오는 장면을 유지했습니다.
- source_word: זֶה הַדֶּרֶךְ
  english_pob_choice: This is the way
  chosen_korean: 이것이 길입니다
  alternatives_korean:
  - 이 길입니다
  - 이것이 그 길입니다
  lexicon: HALOT
  rationale: 지시어와 정관사의 힘을 살려 단정형으로 옮겼고, ‘길’은 문자적 길과 삶의 방향을 함께 품는 기본 대응어입니다.
- source_word: לְכוּ בוֹ
  english_pob_choice: walk in it
  chosen_korean: 그 길로 가십시오
  alternatives_korean:
  - 그 안으로 걸어가십시오
  - 그 길을 따라가십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘가다’ 동사를 한국어에서도 자연스럽게 살리되, ‘walk in it’의 비유적 의미는 문맥상 ‘그 길로’로 충분히 드러난다고 보았습니다.
- source_word: תַאֲמִינוּ
  english_pob_choice: when you turn to the right
  chosen_korean: 오른쪽으로 치우칠 때
  alternatives_korean:
  - 오른쪽으로 향할 때
  - 오른쪽으로 갈 때
  lexicon: HALOT
  rationale: 이 구절의 난해한 동사는 POB처럼 방향 전환의 맥락으로 이해해, ‘치우칠 때’로 옮겨 좌우 대구를 살렸습니다.
- source_word: תַשְׂמְאִילוּ
  english_pob_choice: when you turn to the left
  chosen_korean: 왼쪽으로 치우칠 때
  alternatives_korean:
  - 왼쪽으로 향할 때
  - 왼쪽으로 갈 때
  lexicon: HALOT
  rationale: 앞 절과 대칭을 이루도록 ‘오른쪽/왼쪽으로 치우칠 때’로 대응시켜, 분기점에서 주어지는 인도의 의미를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 인도 방식과 말하는 주체의 명시 여부
  chosen_reading: 특정한 매개를 덧붙이지 않고, 뒤에서 들리는 인도의 말씀으로 유지했습니다.
  alternative_readings:
  - 선생의 음성
  - 양심의 내적 감동
  - 예언적 지시
  rationale: 본문은 인도는 약속하지만 이 말씀의 화자를 이 절 안에서 특정하지 않으므로, 해석을 좁히지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: 해석 여지를 남겨 본문의 긴장을 보존
