lexical_decisions:
- source_word: עַם מְרִי
  english_pob_choice: a rebellious people
  chosen_korean: 반역하는 백성
  alternatives_korean:
  - 반역한 백성
  - 패역한 백성
  - 반항하는 백성
  lexicon: HALOT
  rationale: 명사구를 한국어에서는 서술적 형용사구로 자연스럽게 옮겨, 공동체 전체의 언약적 반역 성격을 유지했습니다.
- source_word: כֶּחָשִׁים
  english_pob_choice: lying
  chosen_korean: 거짓된
  alternatives_korean:
  - 거짓말하는
  - 속이는
  - 거짓말꾼
  lexicon: HALOT
  rationale: ‘거짓’의 성격을 지닌 자녀라는 뜻을 살리면서도, 직설적인 ‘거짓말하는’보다 문맥상 더 응축된 비난을 담도록 했습니다.
- source_word: לֹא אָבוּ שְׁמֹעַ
  english_pob_choice: unwilling to hear
  chosen_korean: 듣기를 싫어하는
  alternatives_korean:
  - 들으려 하지 않는
  - 듣기를 원하지 않는
  - 들으려 거부하는
  lexicon: HALOT
  rationale: 단순한 청각이 아니라 완고한 거부 의지를 드러내는 표현이므로, ‘unwilling’의 태도와 거절감을 살렸습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 법
  - 야훼의 가르침
  - 야훼의 훈계
  lexicon: HALOT
  rationale: תּוֹרָה의 언약적·규범적 무게를 살려 ‘율법’으로 옮기고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יְהוָה가 직접 나오므로, 하나님의 고유명을 가리는 관례적 대체어보다 음역형 ‘야훼’를 사용해 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: תּוֹרָה의 번역
  chosen_reading: 율법
  alternative_readings:
  - 가르침
  - 교훈
  - instruction
  rationale: 예언자적 책망의 핵심이 야훼의 권위 있는 언약 규범을 거부하는 데 있으므로, 현대어로도 법적·규범적 힘이 살아 있는 ‘율법’을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
