  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: תּוֹרָה의 번역
  chosen_reading: 율법
  alternative_readings:
  - 가르침
  - 교훈
  - instruction
  rationale: 예언자적 책망의 핵심이 야훼의 권위 있는 언약 규범을 거부하는 데 있으므로, 현대어로도 법적·규범적 힘이 살아 있는 ‘율법’을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
