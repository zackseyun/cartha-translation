  rationale: 단순한 청각이 아니라 완고한 거부 의지를 드러내는 표현이므로, ‘unwilling’의 태도와 거절감을 살렸습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 법
  - 야훼의 가르침
  - 야훼의 훈계
  lexicon: HALOT
  rationale: תּוֹרָה의 언약적·규범적 무게를 살려 ‘율법’으로 옮기고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
