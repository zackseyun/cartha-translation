  source_fidelity: 초안은 전반적인 의미와 미래의 약속이라는 문맥을 잘 전달합니다. 그러나 ‘땅을 갈아’는 히브리어 본문에 없는 행위를 보태며, מְטַר는 특별히 ‘단비’를 뜻하지 않으므로 ‘비’가 더 충실합니다. 또한 ‘그것’의 선행사가 불분명하므로 양식/소출을 명시하는 편이 낫습니다.
