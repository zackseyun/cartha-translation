  terminology: ‘양식’, ‘가축’, ‘목초지’는 현대 표준어 성경 문체에 자연스럽고 원문의 농경 어휘를 충분히 반영합니다. דָשֵׁן וְשָׁמֵן은 수확물의 풍요를 가리키므로 ‘기름지고 풍성할 것’으로 옮기고, 각주의 직역 관용 설명을 유지합니다.
