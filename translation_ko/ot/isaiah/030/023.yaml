id: ISA.30.23
reference: Isaiah 30:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַן֩ מְטַ֨ר זַרְעֲ/ךָ֜ אֲשֶׁר תִּזְרַ֣ע אֶת הָ/אֲדָמָ֗ה וְ/לֶ֨חֶם֙ תְּבוּאַ֣ת הָֽ/אֲדָמָ֔ה וְ/הָיָ֥ה דָשֵׁ֖ן וְ/שָׁמֵ֑ן יִרְעֶ֥ה מִקְנֶ֛י/ךָ בַּ/יּ֥וֹם הַ/ה֖וּא כַּ֥ר נִרְחָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
  footnotes:
  - marker: a
    text: Or 'bread, the produce of the ground.' The Hebrew may be read appositionally, though 'bread from the produce of the ground' best conveys the sense in English.
    reason: lexical_alternative
  - marker: b
    text: Literally 'fat and rich,' an idiom for abundance and fertility.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 너희가 땅에 뿌릴 씨를 위하여 비를 주실 것이며, 땅의 소출로 만든 양식도 주실 것입니다. 그 양식은 기름지고 풍성할 것이며[b], 그날에 너희 가축은 넓은 목초지에서 풀을 뜯을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘기름지고 살진’이라는 관용으로, 풍성함과 비옥함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן / And he will give
  english_pob_choice: And he will give
  chosen_korean: 그가 … 내려 주시며
  alternatives_korean:
  - 그가 … 주실 것이며
  - 그리고 그가 … 주십니다
  lexicon: HALOT
  rationale: 문맥상 주체는 야훼이므로 한국어에서는 존칭 서술인 ‘주실 것입니다’를 사용해 미래적 약속을 살렸습니다. ‘단비를 내리다’는 מְטַר의 농경적 이미지를 자연스럽게 전달합니다.
- source_word: מְטַר זַרְעֲךָ אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  english_pob_choice: rain for your seed with which you sow the ground
  chosen_korean: 너희가 땅을 갈아 씨 뿌리는 데 쓰는 종자에 단비를
  alternatives_korean:
  - 너희가 땅에 뿌리는 종자에 내리는 비를
  - 너희가 땅에 씨 뿌릴 때 주시는 비를
  lexicon: HALOT
  rationale: 직역하면 ‘너의 씨의 비’이지만 한국어에서는 의미 관계가 분명하도록 ‘씨 뿌리는 데 쓰는 종자에’로 풀었습니다. ‘땅을 갈아’는 뒤의 ‘땅’과 겹치지 않으면서 농사 행위를 자연스럽게 드러냅니다.
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  english_pob_choice: bread from the produce of the ground
  chosen_korean: 땅에서 나는 양식도
  alternatives_korean:
  - 땅의 소산에서 나는 빵도
  - 땅의 소출로 된 양식도
  lexicon: HALOT
  rationale: לֶחֶם은 여기서 단순한 ‘빵’보다 식량 일반을 가리킬 수 있어 ‘양식’으로 옮겼습니다. ‘from the produce of the ground’는 한국어의 ‘땅에서 나는’으로 간결하게 반영했습니다.
- source_word: וְהָיָה דָשֵׁן וְשָׁמֵן
  english_pob_choice: and it will be rich and plentiful
  chosen_korean: 그것은 기름지고 넉넉할 것이며
  alternatives_korean:
  - 그것은 살지고 풍성할 것이며
  - 그것은 기름지고 풍부할 것이며
  lexicon: HALOT
  rationale: 두 형용사의 문자적 뜻은 ‘살찌다/기름지다’와 ‘풍성하다’이지만, 한국어에서는 곡식·수확의 풍요를 나타내는 관용으로 옮기는 편이 자연스럽습니다. POB의 ‘abundance and fertility’ 해석도 반영했습니다.
- source_word: כַּר נִרְחָב
  english_pob_choice: a broad pasture
  chosen_korean: 넓은 초원에서 풀을 뜯을 것입니다
  alternatives_korean:
  - 넓은 목초지에서 풀을 뜯을 것입니다
  - 넓은 풀밭에서 먹을 것입니다
  lexicon: HALOT
  rationale: כַּר는 가축이 먹는 목초지/초원을 뜻하므로 ‘초원’으로 옮기고, 동사 יִרְעֶה는 가축의 행동에 맞게 ‘풀을 뜯다’로 풀었습니다.
theological_decisions:
- issue: 열린 주어를 한국어에서 어떻게 드러낼지
  chosen_reading: 첫 절의 주어는 문맥상 야훼로 이해하여 ‘그가 … 주실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘주님이 … 주실 것입니다’로 명시
  - 주어를 반복하지 않고 ‘주실 것입니다’로만 번역
  rationale: 히브리어는 주어를 생략하지만 바로 앞 문맥이 야훼의 행위임을 분명히 합니다. 한국어에서는 대명사 ‘그’만 두면 주체가 모호해질 수 있어, 자연스러운 약속문 형식으로 풀어 전달했습니다.
  doctrine_reference: 문맥적 주어 식별; 야훼의 공급과 섭리
