  lexicon: HALOT
  rationale: יִעיל 계열의 반복을 살리기 위해 ‘유익’ 어근을 유지했고, 뒤의 לְהוֹעִיל과의 연결도 한국어에서 최대한 드러냈습니다.
- source_word: לְעֵזֶר
  english_pob_choice: for help
  chosen_korean: 도움이 되지도
  alternatives_korean:
  - 도움이 되지도 않고
  - 구원이 되지도
  lexicon: HALOT
  rationale: 명사구를 한국어 서술 구조로 풀어, 앞의 ‘유익’과 평행을 이루도록 했습니다.
- source_word: לְבֹשֶׁת ... לְחֶרְפָּה
  english_pob_choice: for shame ... for reproach
  chosen_korean: 수치와 모욕이 됩니다
  alternatives_korean:
  - 부끄러움과 수치가 됩니다
  - 수치와 책망이 됩니다
  - 부끄러움과 모욕이 됩니다
  lexicon: HALOT
  rationale: בֹשֶׁת과 חֶרְפָּה의 겹침을 한국어의 ‘수치/모욕’으로 압축해, 결과의 공적 수치를 분명히 했습니다.
theological_decisions:
- issue: ‘부끄러움을 당합니다’의 어조
  chosen_reading: 외적 수치를 받는 의미로 피동형을 사용했습니다.
  alternative_readings:
  - ‘부끄러워합니다’처럼 내면 감정 중심
  - ‘망신을 당합니다’처럼 더 구어적인 표현
  rationale: 본문은 실패한 동맹으로 인해 당하는 공적 수치를 말하므로, 내면 상태보다 외적 굴욕을 드러내는 표현이 더 적절합니다.
  doctrine_reference: 본문 문맥(이사야 30장)의 대외정책 비판과 공적 수치의 주제
- issue: ‘유익’ 반복 보존
  chosen_reading: 앞뒤의 이익/유익 어근 반복을 살렸습니다.
  alternative_readings:
  - 한국어에서 자연스러운 ‘도움/이익’ 혼합
  - 반복을 줄여 매끄럽게 정리
  rationale: 히브리어의 יעל/להועיל 반복은 의도적 대구이므로, 한국어에서도 같은 어근을 유지해 수사적 긴장을 보존했습니다.
  doctrine_reference: 히브리 시의 평행법과 반복 수사
