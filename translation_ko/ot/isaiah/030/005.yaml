  edition: WLC
  text: כֹּ֣ל הבאיש עַל עַ֖ם לֹא יוֹעִ֣ילוּ לָ֑/מוֹ לֹ֤א לְ/עֵ֨זֶר֙ וְ/לֹ֣א לְ/הוֹעִ֔יל כִּ֥י לְ/בֹ֖שֶׁת וְ/גַם לְ/חֶרְפָּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
  footnotes:
  - marker: a
    text: Hebrew הבאיש is difficult. It can carry the idea of becoming odious or stinking, but in this context of failed alliance and the parallel terms 'shame' and 'reproach,' the sense 'is put to shame' is preferred.
    reason: lexical_alternative
translation:
  language: ko
  text: 모두가 그들에게 유익이 되지 못하는 한 백성 때문에 수치를 당합니다. 그 백성은 도움이 되지도 유익이 되지도 않고, 오히려 수치와 모욕이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הבאיש는 어려운 표현입니다. 문자적으로는 ‘악취가 나다’ 또는 ‘혐오스럽게 되다’라는 뜻을 지닐 수 있지만, 실패한 동맹과 ‘수치’ 및 ‘모욕’의 병행이라는 문맥에서는 공적으로 수치를 당한다는 뜻으로 옮기는 것이 더 적절합니다.
    reason: lexical_alternative
