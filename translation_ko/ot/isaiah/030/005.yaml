  lexicon: HALOT
  rationale: עַל의 원인/계기 용법을 반영해 ‘때문에’로 처리했고, 무정관사적 집합성을 살려 ‘한 백성’으로 옮겼습니다.
- source_word: לֹא יוֹעִילוּ ... לְהוֹעִיל
  english_pob_choice: cannot profit them / for profit
  chosen_korean: 유익하게 하지 못하는 / 유익하지도
