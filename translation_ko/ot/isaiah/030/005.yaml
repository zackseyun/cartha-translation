  source_fidelity: 첫 절의 ‘자신들을 유익하게 하지 못하는’은 히브리어 לֹא יוֹעִילוּ לָמוֹ(‘그들에게 유익이 되지 못하는’)를 한국어에서 부자연스럽게 사역적으로 바꾸며, ‘자신들’의 지시 대상도 불명확하게 합니다. 이를 ‘그들에게 유익이 되지 못하는’으로 고치면 원문의 수혜자와 יעל 어근의 반복을 충실히 보존합니다. הבאיש는 문맥상 외적으로 수치를 당한다는 뜻으로 옮긴 현행 방향이 타당합니다.
  naturalness: ‘한 백성’ 뒤에 복수 대명사 ‘그들은’을 쓰는 것은 집합명사로 이해할 수 있으나 다소 매끄럽지 않습니다. ‘그 백성은’으로 받으면 한국어 문장 연결이 자연스럽고, 이어지는 ‘도움/유익’과 ‘수치/모욕’의 대구도 선명해집니다.
