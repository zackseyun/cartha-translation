  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ל הבאיש עַל עַ֖ם לֹא יוֹעִ֣ילוּ לָ֑/מוֹ לֹ֤א לְ/עֵ֨זֶר֙ וְ/לֹ֣א לְ/הוֹעִ֔יל כִּ֥י לְ/בֹ֖שֶׁת וְ/גַם לְ/חֶרְפָּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
  footnotes:
  - marker: a
    text: Hebrew הבאיש is difficult. It can carry the idea of becoming odious or stinking, but in this context of failed alliance and the parallel terms 'shame' and 'reproach,' the sense 'is put to shame' is preferred.
    reason: lexical_alternative
translation:
  language: ko
  text: 모두가 자신들을 유익하게 하지 못하는 한 백성 때문에 부끄러움을 당합니다 — 그들은 도움이 되지도, 유익하지도 않고, 오히려 수치와 모욕이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הבאיש는 본문상 ‘악취가 난다’는 문자적 뜻도 가능하지만, 여기서는 동맹 실패로 인한 공적 수치의 뜻이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  english_pob_choice: Everyone
  chosen_korean: 모두가
  alternatives_korean:
  - 모든 이가
  - 사람마다
  lexicon: HALOT
  rationale: 분포적 총칭을 자연스러운 합쇼체로 옮기기 위해 ‘모두가’를 사용했습니다.
- source_word: הבאיש
  english_pob_choice: is put to shame
  chosen_korean: 부끄러움을 당합니다
  alternatives_korean:
  - 수치를 당합니다
  - 망신을 당합니다
  - 부끄러워합니다
  lexicon: HALOT
  rationale: 문맥상 내면 감정보다 외적 수치와 굴욕이 핵심이므로, ‘put to shame’의 수동적·피동적 뉘앙스를 살려 옮겼습니다.
- source_word: עַל עַם
  english_pob_choice: because of a people
  chosen_korean: 한 백성 때문에
  alternatives_korean:
  - 한 민족 때문에
  - 그 백성 때문에
  - 백성으로 인해
  lexicon: HALOT
  rationale: עַל의 원인/계기 용법을 반영해 ‘때문에’로 처리했고, 무정관사적 집합성을 살려 ‘한 백성’으로 옮겼습니다.
- source_word: לֹא יוֹעִילוּ ... לְהוֹעִיל
  english_pob_choice: cannot profit them / for profit
  chosen_korean: 유익하게 하지 못하는 / 유익하지도
  alternatives_korean:
  - 도움이 되지 못하는 / 유익하지도
  - 이익이 되지 못하는 / 이익이 되지도
  lexicon: HALOT
  rationale: יִעיל 계열의 반복을 살리기 위해 ‘유익’ 어근을 유지했고, 뒤의 לְהוֹעִיל과의 연결도 한국어에서 최대한 드러냈습니다.
- source_word: לְעֵזֶר
  english_pob_choice: for help
  chosen_korean: 도움이 되지도
  alternatives_korean:
  - 도움이 되지도 않고
  - 구원이 되지도
  lexicon: HALOT
  rationale: 명사구를 한국어 서술 구조로 풀어, 앞의 ‘유익’과 평행을 이루도록 했습니다.
- source_word: לְבֹשֶׁת ... לְחֶרְפָּה
  english_pob_choice: for shame ... for reproach
  chosen_korean: 수치와 모욕이 됩니다
  alternatives_korean:
  - 부끄러움과 수치가 됩니다
  - 수치와 책망이 됩니다
  - 부끄러움과 모욕이 됩니다
  lexicon: HALOT
  rationale: בֹשֶׁת과 חֶרְפָּה의 겹침을 한국어의 ‘수치/모욕’으로 압축해, 결과의 공적 수치를 분명히 했습니다.
theological_decisions:
- issue: ‘부끄러움을 당합니다’의 어조
  chosen_reading: 외적 수치를 받는 의미로 피동형을 사용했습니다.
  alternative_readings:
  - ‘부끄러워합니다’처럼 내면 감정 중심
  - ‘망신을 당합니다’처럼 더 구어적인 표현
  rationale: 본문은 실패한 동맹으로 인해 당하는 공적 수치를 말하므로, 내면 상태보다 외적 굴욕을 드러내는 표현이 더 적절합니다.
  doctrine_reference: 본문 문맥(이사야 30장)의 대외정책 비판과 공적 수치의 주제
- issue: ‘유익’ 반복 보존
  chosen_reading: 앞뒤의 이익/유익 어근 반복을 살렸습니다.
  alternative_readings:
  - 한국어에서 자연스러운 ‘도움/이익’ 혼합
  - 반복을 줄여 매끄럽게 정리
  rationale: 히브리어의 יעל/להועיל 반복은 의도적 대구이므로, 한국어에서도 같은 어근을 유지해 수사적 긴장을 보존했습니다.
  doctrine_reference: 히브리 시의 평행법과 반복 수사
