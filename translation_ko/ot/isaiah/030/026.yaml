id: ISA.30.26
reference: Isaiah 30:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר הַ/לְּבָנָה֙ כְּ/א֣וֹר הַֽ/חַמָּ֔ה וְ/א֤וֹר הַֽ/חַמָּה֙ יִהְיֶ֣ה שִׁבְעָתַ֔יִם כְּ/א֖וֹר שִׁבְעַ֣ת הַ/יָּמִ֑ים בְּ/י֗וֹם חֲבֹ֤שׁ יְהוָה֙ אֶת שֶׁ֣בֶר עַמּ֔/וֹ וּ/מַ֥חַץ מַכָּת֖/וֹ יִרְפָּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
  footnotes:
  - marker: a
    text: Or, 'the bruise/crushing caused by his blow.' The Hebrew can be rendered with slightly different injury imagery, but the sense is that the LORD heals the damage associated with his striking.
    reason: lexical_alternative
translation:
  language: ko
  text: 달의 빛은 해의 빛 같고, 해의 빛은 일곱 날의 빛 같을 것입니다. 야훼께서 자기 백성의 부러진 것을 싸매시고, 자기의 치신 상처를 고치실 그 날에 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will be
  chosen_korean: '...일 것입니다'
  alternatives_korean:
  - '...됩니다'
  - '...있을 것입니다'
  lexicon: HALOT
  rationale: 예언적 미래 결과를 한국어의 자연스러운 미래 표현으로 옮기되, 원문의 결과적·전환적 뉘앙스를 유지했습니다.
- source_word: אוֹר הַלְּבָנָה / אוֹר הַחַמָּה
  english_pob_choice: the light of the moon / the light of the sun
  chosen_korean: 달의 빛 / 해의 빛
  alternatives_korean:
  - 달빛 / 햇빛
  - 달의 밝음 / 해의 밝음
  lexicon: HALOT
  rationale: 반복되는 명사구를 살려 원문의 평행 구조를 보존했고, 시적이면서도 직역성이 있는 표현을 택했습니다.
- source_word: שִׁבְעָתַיִם
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배
  alternatives_korean:
  - 일곱 겹으로
  - 일곱 배나
  lexicon: HALOT
  rationale: 배수 강조를 한국어 관용으로 자연스럽게 옮겼습니다.
- source_word: חֲבֹשׁ
  english_pob_choice: binds up
  chosen_korean: 싸매시고
  alternatives_korean:
  - 감싸시고
  - 매어 두르시고
  lexicon: HALOT
  rationale: 치유·회복의 치료 행위를 드러내면서도 히브리어의 ‘묶다/감싸다’ 이미지를 보존했습니다.
- source_word: שֶׁבֶר ... וּמַחַץ מַכָּתוֹ
  english_pob_choice: the fracture ... the wound from his blow
  chosen_korean: 부러진 것 ... 자기의 치신 상처
  alternatives_korean:
  - 부서진 상처 ... 그가 치신 상처
  - 깨어진 것 ... 자기의 때리신 상처
  lexicon: HALOT
  rationale: שֶׁבֶר은 단순한 ‘상처’보다 ‘부러짐/파손’을 포함할 수 있어 결과 상태를 드러내는 ‘부러진 것’으로 옮겼고, מַכָּתוֹ는 야훼의 치심에서 난 상처라는 문맥을 살려 ‘자기의 치신 상처’로 표현했습니다.
theological_decisions:
- issue: 야훼의 심판과 치유가 동일 주어에게 귀속되는 긴장
  chosen_reading: 야훼께서 자기 백성의 부러진 것을 싸매시고, 자기의 치신 상처를 고치실 것입니다
  alternative_readings:
  - 야훼께서 그들의 부러진 것을 싸매시고 그 상처를 고치실 것입니다
  - 야훼께서 자기 백성의 상처를 치유하실 것입니다
  rationale: 원문은 같은 분이 치시고 다시 고치시는 구조를 유지하므로, 그 긴장을 완화하지 않고 ‘자기의 치신 상처’로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
