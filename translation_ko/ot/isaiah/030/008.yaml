  terminology: ‘판’은 לוּחַ를 과도하게 재질화하지 않으며, ‘두루마리’는 סֵפֶר의 고대 문서 매체를 자연스럽게 드러냅니다. ‘새기십시오’는 חקק의 기록·각인 뉘앙스를 보존합니다. ‘영원히 영원토록’은 לָעַד עַד־עוֹלָם의 반복적 지속 강조를 반영합니다.
