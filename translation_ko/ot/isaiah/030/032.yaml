id: ISA.30.32
reference: Isaiah 30:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
  footnotes:
  - marker: a
    text: Or 'every passing of the appointed rod'; the Hebrew phrase is difficult, and 'stroke' interprets the image as each blow or sweep of the rod.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will fight against it/him'; the Hebrew has a feminine singular suffix ('against her/it'), but the referent is uncertain in context.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그에게 내리시는 정해진 막대기의 매 타격은 소고와 수금과 함께할 것이며, 야훼께서는 휘두름의 싸움들로 그것과 싸우실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 막대기가 지나갈 때마다’로 옮길 수 있습니다. 히브리어 구문이 어려우며, ‘매 타격’은 막대기가 한 번씩 내리치는 모습으로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 상대로’ 또는 ‘그와 싸우실 것입니다’로 옮길 수 있습니다. 히브리어는 여성 단수 접미사를 사용하지만, 문맥상 그 대상은 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲבַר מַטֵּה מוּסָדָה
  english_pob_choice: every stroke of the appointed rod
  chosen_korean: 기초가 놓인 채 세워진 채찍의 매질 하나하나
  alternatives_korean:
  - 정해진 막대의 한 번 한 번의 지나감
  - 임명된 지팡이의 매번의 휘두름
  lexicon: HALOT
  rationale: 히브리어가 ‘지나감/통과’와 ‘막대/지팡이’ 이미지를 결합한 난해한 구문이므로, POB의 ‘stroke’처럼 심판의 타격으로 풀어 읽되 ‘하나하나’로 분배 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신적 이름은 ‘야훼’로 옮겼습니다.
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  english_pob_choice: with tambourines and lyres
  chosen_korean: 소고와 수금과 함께하며
  alternatives_korean:
  - 탬버린과 리라와 함께하며
  - 북과 수금과 함께하며
  lexicon: HALOT
  rationale: 예배·환호의 악기쌍을 한국어 성경에서 널리 통용되는 ‘소고와 수금’으로 옮기되, 문맥상 심판 장면의 역설을 살리기 위해 부사구로 처리했습니다.
- source_word: וּבְמִלְחֲמ֥וֹת תְּנוּפָ֖ה
  english_pob_choice: with battles of brandishing
  chosen_korean: 휘두름의 전투들로
  alternatives_korean:
  - 흔듦의 전투들로
  - 번뜩임의 전투들로
  - 휘두르는 싸움들로
  lexicon: HALOT
  rationale: תְּנוּפָה의 핵심은 ‘휘두름/들어 올림’이므로, 전투의 성격을 과장하지 않으면서도 POB가 보존한 낯선 이미지를 살려 ‘휘두름의 전투들’로 직역 쪽에 가깝게 잡았습니다.
theological_decisions:
- issue: 마지막 동사의 목적어가 가리키는 대상
  chosen_reading: ‘그것과 싸우실 것입니다’로 처리해, 히브리어의 여성 단수 대명사 난점을 본문 안에서는 중립적으로 남겼습니다.
  alternative_readings:
  - ‘그들과 싸우실 것입니다’
  - ‘그와 싸우실 것입니다’
  rationale: 히브리어 어미는 문맥상 지시 대상이 불분명하므로, POB가 각주로 남긴 불확실성을 본문에서도 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: Isaiah 30:32 문맥상 심판의 대상은 앗수르이지만, 본문의 대명사 불일치는 해소하지 않고 보존해야 합니다.
