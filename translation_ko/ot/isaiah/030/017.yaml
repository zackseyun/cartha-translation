  source_fidelity: 첫 절반의 인과 관계와 수사는 대체로 잘 옮겼습니다. 그러나 עַד אִם נוֹתַרְתֶּם은 ‘너희가 남게 되면’이라는 조건문보다 ‘너희가 ... 남을 때까지/남을 정도로’라는 결과 한계를 나타냅니다. 이를 바로잡아 패배 뒤 소수만 남는 결과를 보존했습니다.
  naturalness: ‘꾸짖음 앞에서’는 직역투이므로 원인의 뜻을 자연스럽게 나타내는 ‘꾸짖음에’로 다듬었습니다. 또한 ‘마침내 ... 되면’의 어색한 시간·조건 연결을 결과를 나타내는 문장으로 바꾸었습니다.
  terminology: ‘꾸짖음’, ‘깃대’, ‘깃발’은 원문의 의미 범위 안에 있으며 현대 표준어로 적절합니다. תֹרֶן의 ‘돛대’ 가능성과 נֵס의 신호 표지 의미는 각주에서 유지했습니다.
