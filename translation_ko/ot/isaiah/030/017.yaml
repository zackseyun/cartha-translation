- from: 천 명이 한 사람의 꾸짖음 앞에서 도망하고, 다섯 사람의 꾸짖음 앞에서 너희가 도망할 것입니다. 마침내 너희가 남게 되면, 산꼭대기의 깃대처럼, 언덕 위의 깃발처럼 될 것입니다.[a][b]
  to: 한 사람의 꾸짖음에 천 명이 도망할 것이며, 다섯 사람의 꾸짖음에 너희는 도망하여 마침내 산꼭대기의 깃대처럼, 언덕 위의 깃발처럼 남을 것입니다.[a][b]
