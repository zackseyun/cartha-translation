id: ISA.30.17
reference: Isaiah 30:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
  footnotes:
  - marker: a
    text: Or 'like a mast on the top of a mountain.' The Hebrew תֹּרֶן can refer to a mast or tall pole.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a signal standard on a hill.' The Hebrew נֵס denotes a raised banner or standard used as a signal.
    reason: lexical_alternative
translation:
  language: ko
  text: 천 명이 한 사람의 꾸짖음 앞에서 도망하고, 다섯 사람의 꾸짖음 앞에서 너희가 도망할 것입니다. 마침내 너희가 남게 되면, 산꼭대기의 깃대처럼, 언덕 위의 깃발처럼 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산꼭대기의 돛대처럼’. 히브리어 תֹּרֶן은 돛대나 높은 기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언덕 위의 신호 깃발처럼’. 히브리어 נֵס은 신호로 쓰는 들어 올린 깃발이나 표준을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  english_pob_choice: A thousand
  chosen_korean: 천 명이
  alternatives_korean:
  - 한 천이
  - 일천이
  lexicon: HALOT
  rationale: 히브리어의 ‘천, 하나’라는 관용적 수량 표현을 자연스러운 현대 한국어 ‘천 명’으로 옮겼습니다.
- source_word: גַּעֲרַת
  english_pob_choice: rebuke
  chosen_korean: 꾸짖음
  alternatives_korean:
  - 질책
  - 호통
  - 꾸짖는 소리
  lexicon: HALOT
  rationale: 전쟁적 공포 속에서의 위협적 책망이라는 핵심을 살리면서, 현대 한국어에서 ‘rebuke’에 가장 가까운 직접적 표현인 ‘꾸짖음’을 택했습니다.
- source_word: תָּנֻסוּ
  english_pob_choice: you will flee
  chosen_korean: 도망할 것입니다
  alternatives_korean:
  - 달아날 것입니다
  - 도망칠 것입니다
  lexicon: HALOT
  rationale: 2인칭 복수의 도주를 한국어에서 자연스럽고 분명하게 드러내는 미래형 표현입니다.
- source_word: כַּתֹּרֶן
  english_pob_choice: like a signal pole
  chosen_korean: 깃대처럼
  alternatives_korean:
  - 돛대처럼
  - 신호 기둥처럼
  - 장대처럼
  lexicon: HALOT
  rationale: תֹּרֶן이 돛대 또는 높은 기둥을 가리킬 수 있으므로, 본문의 고립된 높이를 전달하는 ‘깃대’가 가장 간결하고 읽기 쉽습니다.
- source_word: וְכַנֵּס
  english_pob_choice: and like a banner
  chosen_korean: 깃발처럼
  alternatives_korean:
  - 표준처럼
  - 신호 깃발처럼
  - 기처럼
  lexicon: HALOT
  rationale: נֵס의 ‘들어 올린 표지/깃발’ 의미를 현대 독자가 즉시 이해할 수 있게 ‘깃발’로 옮겼습니다.
theological_decisions:
- issue: 마지막 비유의 기능
  chosen_reading: 남은 자가 산과 언덕 위에 외롭게 드러나 있는 모습, 곧 패전 후의 극심한 소수성과 노출을 함께 보여주는 비유로 보았습니다.
  alternative_readings:
  - 단지 멀리서 보이는 표지의 기능만 강조하는 읽기
  - 단지 작고 연약한 상태만 강조하는 읽기
  rationale: 두 이미지는 모두 높이 세워져 눈에 띄지만, 문맥상 전쟁 후 ‘남음’의 결과를 묘사하므로 고립·노출의 의미를 함께 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
