  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֥ה לָ/כֶ֛ם מָע֥וֹז פַּרְעֹ֖ה לְ/בֹ֑שֶׁת וְ/הֶ/חָס֥וּת בְּ/צֵל מִצְרַ֖יִם לִ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
  footnotes:
  - marker: a
    text: Or 'Then Pharaoh’s refuge will be your shame.' The Hebrew noun מָעוֹז can also be rendered 'refuge' or 'fortress.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the shadow of Egypt,' a metaphor for seeking protection from Egypt.
    reason: cultural_note
translation:
  language: ko
  text: 그때에는 바로 바리새인들이 밖으로 나가, 헤롯 당원들과 함께 예수를 어떻게 없앨지 의논하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  english_pob_choice: Then the Pharisees went out
  chosen_korean: 바리새인들이 밖으로 나가
  alternatives_korean:
  - 바리새인들이 나가
  - 그때 바리새인들이 나가
  lexicon: BDB
  rationale: 서술 진행을 자연스럽게 살리면서, 동작의 방향성인 '밖으로'를 분명히 드러냈습니다.
- source_word: לִיֹּעֵץ
  english_pob_choice: and plotted
  chosen_korean: 의논하였습니다
  alternatives_korean:
  - 꾀하였습니다
  - 모의하였습니다
  - 의논했습니다
  lexicon: BDB
  rationale: 본문은 단순한 상의보다 적대적 합의를 가리키므로, '의논하였습니다'로 완곡하게 하되 문맥상 의도된 음모성을 유지했습니다.
- source_word: כַּאֲשֶׁר
  english_pob_choice: with
  chosen_korean: 함께
  alternatives_korean:
  - 과
  - 더불어
  lexicon: BDB
  rationale: 두 집단이 연합하여 행동하는 관계를 자연스럽게 나타내는 표현입니다.
- source_word: הוֹרְדִי
  english_pob_choice: the Herodians
  chosen_korean: 헤롯 당원들
  alternatives_korean:
  - 헤롯파 사람들
  - 헤롯당 사람들
  lexicon: BDB
  rationale: 한국어 성경에서 널리 알려진 형태를 따르되, 정치적 당파를 뜻하는 점을 살려 '당원들'로 옮겼습니다.
- source_word: לְהַאֲבִידוֹ
  english_pob_choice: how to destroy him
  chosen_korean: 예수를 어떻게 없앨지
  alternatives_korean:
  - 예수를 어떻게 죽일지
  - 예수를 어떻게 제거할지
  lexicon: BDB
  rationale: 살해 의도를 직접 반영하되, 한국어에서 가장 자연스럽고 본문의 적대성을 잘 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 적대적 합의의 성격을 어떻게 드러낼지
  chosen_reading: '''의논하였습니다''로 번역해 표면적 협의의 형태를 유지하되, 문맥 전체에서 예수를 해하려는 합의임을 분명히 했습니다.'
  alternative_readings:
  - '''모의하였습니다''로 직접적인 음모성을 강조'
  - '''꾀하였습니다''로 더 강한 악의와 계획성을 강조'
  rationale: 본문은 행동의 사실을 간결히 서술하며, 지나치게 해석적 어휘를 넣기보다 문맥이 드러내는 적대성을 보존하는 편이 소스에 가깝습니다.
  doctrine_reference: 본문 문맥 해석 원칙
