revisions:
- from: 그때에는 바로 바리새인들이 밖으로 나가, 헤롯 당원들과 함께 예수를 어떻게 없앨지 의논하였습니다.
  to: 그때에 바로의 힘은 너희에게 수치가 되고, 이집트의 그늘에 피하는 일은 너희에게 치욕이 될 것입니다.
  rationale: 히브리어의 두 병행 절을 보존했습니다. "바로의 힘"은 מָעוֹז가 가리키는 기대된 보호 또는 세력을 구체화하지 않고 유지하며, "이집트의 그늘에 피하는 일"은 חָסוּת בְּצֵל מִצְרַיִם의 보호 은유를 자연스럽게 재현합니다. 두 결과 명사도 "수치"와 "치욕"으로 구별하여 원문의 수사적 병행을 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:39Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역문은 이사야 30:3의 히브리어 본문이 아니라 마태복음 12:14에 해당하는 내용을 담고 있어, 본문 충실성이 없습니다. 이사야 본문의 바로, 이집트의 그늘, 수치와 치욕의 병행을 모두 복원해야 합니다.
  naturalness: 수정문은 표준 한국어 합쇼체로 자연스럽고, 예언적 결과를 나타내는 문맥에 맞게 "될 것입니다"를 사용합니다.
  terminology: מָעוֹז는 문맥상 바로에게서 기대하는 힘/보호를 가리키므로 "바로의 힘"으로, חָסוּת는 "피하는 일"로 옮겼습니다. בֹּשֶׁת와 כְּלִמָּה의 병행적 차이는 각각 "수치"와 "치욕"으로 구별했습니다. Pharaoh는 "바로", Egypt는 "이집트"로 표기했습니다.
  issues:
