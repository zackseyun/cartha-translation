id: ISA.30.12
reference: Isaiah 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
  footnotes:
  - marker: a
    text: Or 'this message' or 'this matter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'extortion' for 'oppression,' and 'deviousness' or 'perversity' for 'crookedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘의 거룩하신 분께서 이렇게 말씀하십니다. "너희가 이 말씀을 거부하고, 학대와 패역을 믿으며, 그것에 의지하였기 때문이다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 선행 문맥의 책망에 이어지는 결론·판정의 연결어로 가장 자연스럽고, 예언자적 논리를 분명하게 드러냅니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩하신 이
  - 이스라엘의 거룩하신 하나님
  lexicon: HALOT
  rationale: 전형적인 이사야의 호칭을 한국어에서 신학적으로 분명하면서도 직역에 가깝게 옮겼습니다. '분'은 인격적 호칭을 살리면서도 과도한 교회식 표현을 피합니다.
- source_word: בַּדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 말
  - 이 일
  - 이 메시지
  lexicon: HALOT
  rationale: 예언적 발화의 대상이므로 '말씀'이 דבר의 언어적·예언적 성격을 가장 잘 드러냅니다. '메시지'보다 원문과의 대응이 직접적입니다.
- source_word: עֹשֶׁק וְנָלוֹז
  english_pob_choice: oppression and perversity
  chosen_korean: 학대와 패역
  alternatives_korean:
  - 압제와 패역
  - 억압과 비뚤어짐
  - 학대와 굽음
  lexicon: HALOT
  rationale: עֹשֶׁק은 억압적·불의한 행위를 가리키므로 '학대'가 이 본문에서 드러나는 폭력성과 착취성을 잘 살립니다. נָלוֹז는 단순한 '왜곡'보다 도덕적 반역의 뉘앙스가 강해 '패역'으로 옮겼습니다.
- source_word: וַתִּשָּׁעֲנוּ עָלָיו
  english_pob_choice: and have relied on it
  chosen_korean: 그것에 의지하였기 때문이다
  alternatives_korean:
  - 그것을 의지하였기 때문이다
  - 그것에 기대었기 때문이다
  - 그것을 믿고 버티었기 때문이다
  lexicon: HALOT
  rationale: 동사의 문자적 '기대다' 이미지를 한국어에서 자연스럽게 풀어 주되, 앞의 '믿다'와 병행되는 의존의 의미를 보존했습니다. 지시대명사 '그것'은 앞의 복합 대상 전체를 받습니다.
theological_decisions:
- issue: 원문의 반복적 책망 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 인용문 내부를 하나의 원인절로 매끄럽게 처리하되, 예언자적 선언의 단호함은 유지했습니다.
  alternative_readings:
  - 직설적으로 '너희가 … 하였기 때문이다'를 유지해도 됨
  - 인용부를 더 분절해 '너희가 이 말씀을 거부하였다. 너희는 … 믿었다'로 나눌 수 있음
  rationale: 히브리어는 이유절 뒤에 세 동작이 병렬로 이어져 책망의 누적 효과를 냅니다. 한국어에서는 한 문장 안에서 원인과 열거를 자연스럽게 연결해, 선언의 압박감과 논리성을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
