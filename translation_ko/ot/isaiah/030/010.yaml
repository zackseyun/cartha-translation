id: ISA.30.10
reference: Isaiah 30:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֨ר אָמְר֤וּ לָֽ/רֹאִים֙ לֹ֣א תִרְא֔וּ וְ/לַ֣/חֹזִ֔ים לֹ֥א תֶחֱזוּ לָ֖/נוּ נְכֹח֑וֹת דַּבְּרוּ לָ֣/נוּ חֲלָק֔וֹת חֲז֖וּ מַהֲתַלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
  footnotes:
  - marker: a
    text: Or 'what is straightforward' or 'truthful things.' The Hebrew term refers to what is straight, upright, or correct.
    reason: lexical_alternative
  - marker: b
    text: Or 'deceptions' or 'delusions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 선견자들에게 “보지 마시오” 하고, 환상가들에게는 “우리에게 바른 것들을[a] 보이지 마시오. 우리에게 부드러운 말을 하고, 기만적인 환상들을[b] 보이시오”라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곧은 것들’이나 ‘진실한 것들’입니다. 여기서 히브리어는 곧고, 바르고, 올바른 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기만들’이나 ‘망상들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / תִרְאוּ
  english_pob_choice: seers / see
  chosen_korean: 선견자들 / 보지 마시오
  alternatives_korean:
  - 보는 이들 / 보지 말라
  - 예언자들 / 보지 마시오
  lexicon: HALOT
  rationale: רֹאִים은 예언적 ‘보는 자’의 뜻을 살려 선견자로 옮기고, 금지형은 합쇼체 명령으로 자연스럽게 처리했습니다.
- source_word: חֹזִים / תֶחֱזוּ
  english_pob_choice: visionaries / envision
  chosen_korean: 환상가들 / 보이지 마시오
  alternatives_korean:
  - 환시자들 / 환상을 보지 마시오
  - 환상가들 / 환상을 가지지 마시오
  lexicon: HALOT
  rationale: חזה 계열의 시각적 예언 용어를 ראה 계열과 구별해 환상가들로 번역해 대구를 보존했습니다.
- source_word: נְכֹחוֹת
  english_pob_choice: what is right
  chosen_korean: 바른 것들
  alternatives_korean:
  - 정직한 것들
  - 곧은 것들
  - 진실한 것들
  lexicon: HALOT
  rationale: 직역의 ‘곧은/바른’ 의미를 살리되, 한국어에서 의미가 자연스럽고 윤리적·사실적 올바름을 함께 담는 표현으로 옮겼습니다.
- source_word: חֲלָקוֹת
  english_pob_choice: smooth things
  chosen_korean: 매끄러운 것들
  alternatives_korean:
  - 부드러운 것들
  - 아첨하는 것들
  - 듣기 좋은 말
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘매끄러운 것들’을 유지해, 달래거나 비위를 맞추는 말의 뉘앙스를 드러냈습니다.
- source_word: מַהֲתַלּוֹת
  english_pob_choice: illusions
  chosen_korean: 거짓된 환상들
  alternatives_korean:
  - 기만들
  - 망상들
  - 속임수들
  lexicon: HALOT
  rationale: 환상 문맥을 반영하면서도 실제로는 속이는 것을 뜻한다는 점을 살려 ‘거짓된 환상들’로 풀었습니다.
theological_decisions:
- issue: ‘바른 것들’의 의미 범위
  chosen_reading: 도덕적으로 옳고 사실에 맞는 예언적 말로 이해해 ‘바른 것들’로 번역했습니다.
  alternative_readings:
  - 진실한 것들
  - 곧은 것들
  rationale: 본문은 단순 정보가 아니라 하나님 앞에서 올바른 계시를 거부하는 태도를 고발하므로, 윤리성과 진실성을 함께 담는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 두 예언자 용어의 구별 유지
  chosen_reading: רֹאִים과 חֹזִים를 각각 선견자들, 환상가들로 달리 옮겼습니다.
  alternative_readings:
  - 둘 다 선견자들
  - 둘 다 예언자들
  rationale: 히브리어가 서로 다른 ‘봄’ 동사를 병렬로 쓰므로, 한국어에서도 구별을 유지해 원문의 수사적 대조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
