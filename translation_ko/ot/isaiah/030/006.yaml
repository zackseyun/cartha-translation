theological_decisions:
- issue: 짐승과 뱀 목록의 기능
  chosen_reading: 이 동물 이미지들을 상징화하지 않고, 위험한 광야 여정을 드러내는 문자적 이미지로 유지했습니다.
  alternative_readings:
  - 정치 권세의 상징으로 읽기
  - 일반적인 ‘야생동물과 뱀’으로 평탄화하기
  rationale: 본문은 유다의 사절단이 지나가는 길의 위험과 그 원정의 허망함을 강조하므로, 저자가 제시한 긴장과 생생한 묘사를 그대로 보존하는 편이 적절합니다.
  doctrine_reference: '번역 원리: 본문이 해소하지 않은 긴장을 번역에서 임의로 해소하지 않는다.'
