  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
  footnotes:
  - marker: a
    text: Or 'A burden concerning the beasts of the South.' The Hebrew heading uses a prophetic term often rendered 'oracle' or 'burden,' and 'Negev' can also be understood more generally as 'the South.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lion and lion.' The two Hebrew lion terms are distinct, but their precise difference in this context is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'to a people that will not help.' The Hebrew verb can mean 'profit' or 'be of help.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「네게브의 짐승들에 관한 오라클입니다.」 고난과 괴로움의 땅을 지나 — 암사자와 사자, 독사와 날아다니는 불뱀의 땅을 지나 — 그들은 나귀의 어깨에 자기 재물을, 낙타의 혹 위에 자기 보물을 싣고 갑니다. 그것은 그들에게 이익이 되지 못하는 백성에게로 가는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오라클’은 예언적 표제로서 전통적인 ‘짐’보다 의미가 분명한 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘불뱀’은 ‘타는/불타는 뱀’의 뜻을 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: An oracle
  chosen_korean: 오라클
  alternatives_korean:
  - 짐
  - 예언
  - 선포
  lexicon: HALOT
  rationale: 예언 헤드라인의 מַשָּׂא를 현대 한국어에서 가장 직접적으로 대응하는 말로 옮기되, 전통적이지만 모호한 ‘짐’보다 선포 성격이 분명한 외래어 표기를 택했습니다.
- source_word: בַּהֲמוֹת נֶגֶב
  english_pob_choice: the beasts of the Negev
  chosen_korean: 네게브의 짐승들
  alternatives_korean:
  - 남쪽의 짐승들
  - 네게브의 동물들
  lexicon: HALOT
  rationale: נֶגֶב의 지리적 뉘앙스를 살려 ‘네게브’로 유지했고, בַּהֲמוֹת은 단순히 동물보다 거친 야생성을 드러내는 ‘짐승들’이 자연스럽습니다.
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  english_pob_choice: through a land of distress and hardship
  chosen_korean: 고난과 괴로움의 땅을 지나
  alternatives_korean:
  - 환난과 고통의 땅을 지나
  - 곤경과 압박의 땅을 지나
  lexicon: HALOT
  rationale: 두 نزدیک한 명사 צָרָה, צוּקָה의 중첩을 한국어의 병렬 표현으로 살리되, 여행 경로를 나타내는 전치사 의미를 반영해 ‘땅을 지나’로 옮겼습니다.
- source_word: שָׂרָף מְעוֹפֵף
  english_pob_choice: flying fiery serpent
  chosen_korean: 날아다니는 불뱀
  alternatives_korean:
  - 날아다니는 타는 뱀
  - 날개 달린 불뱀
  lexicon: HALOT
  rationale: שָׂרָף의 ‘불타는/불같은’ 이미지와 מְעוֹפֵף의 비행 동작을 함께 보존하되, 한국어에서 압축적으로 읽히는 ‘불뱀’을 택했습니다.
- source_word: עַל עַם לֹא יוֹעִילוּ
  english_pob_choice: to a people who cannot profit them
  chosen_korean: 그들에게 이익이 되지 못하는 백성에게로
  alternatives_korean:
  - 그들에게 도움되지 않는 백성에게로
  - 그들에게 유익을 주지 못하는 백성에게로
  lexicon: HALOT
  rationale: יוֹעִילוּ의 ‘유익/이익’ 뜻을 살려 경제적·외교적 무익함을 드러냈고, עַל의 방향성을 한국어 조사 ‘에게로’로 처리했습니다.
theological_decisions:
- issue: 짐승과 뱀 목록의 기능
  chosen_reading: 이 동물 이미지들을 상징화하지 않고, 위험한 광야 여정을 드러내는 문자적 이미지로 유지했습니다.
  alternative_readings:
  - 정치 권세의 상징으로 읽기
  - 일반적인 ‘야생동물과 뱀’으로 평탄화하기
  rationale: 본문은 유다의 사절단이 지나가는 길의 위험과 그 원정의 허망함을 강조하므로, 저자가 제시한 긴장과 생생한 묘사를 그대로 보존하는 편이 적절합니다.
  doctrine_reference: '번역 원리: 본문이 해소하지 않은 긴장을 번역에서 임의로 해소하지 않는다.'
