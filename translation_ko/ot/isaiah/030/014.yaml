source:
  edition: WLC
  text: וּ֠/שְׁבָרָ/הּ כְּ/שֵׁ֨בֶר נֵ֧בֶל יוֹצְרִ֛ים כָּת֖וּת לֹ֣א יַחְמֹ֑ל וְ/לֹֽא יִמָּצֵ֤א בִ/מְכִתָּת/וֹ֙ חֶ֔רֶשׂ לַ/חְתּ֥וֹת אֵשׁ֙ מִ/יָּק֔וּד וְ/לַ/חְשֹׂ֥ף מַ֖יִם מִ/גֶּֽבֶא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
  footnotes:
  - marker: a
    text: Or 'with which to scoop coals/embers from the hearth.' The Hebrew says literally 'to take fire from the burning place.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from a pool.' The Hebrew term can refer more generally to a gathered body of water, but 'cistern' best fits the setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 부서지는 것은 마치 토기장이의 항아리가 부서지는 것과 같아서, 가차 없이 부서져 그 조각들 가운데서는 불을 집어 내기 위한 한 조각도, 물을 긷기 위한 한 조각도 찾을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불타는 곳에서 불을 집어 내기’입니다. 문맥상 ‘불을 집어 내기’는 불씨나 숯을 퍼내는 뜻으로 이해할 수 있습니다.
    reason: source_note
  - marker: b
    text: 이 표현은 물 저장소를 가리킬 수 있으며, 문맥상 ‘물 저장 항아리/저수조’보다 ‘우물집/저수조’보다 넓은 ‘물 저장소’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  english_pob_choice: and its breaking
  chosen_korean: 그것이 부서지는 것은
  alternatives_korean:
  - 그것의 부서짐은
  - 그것이 깨지는 것은
  lexicon: HALOT
  rationale: 문맥의 대상을 가리키는 3인칭 여성 단수 접미사를 살려, 결과적 상태보다 진행되는 붕괴를 자연스럽게 표현했습니다.
- source_word: נֵבֶל יוֹצְרִים
  english_pob_choice: a potter’s jar
  chosen_korean: 토기장이의 항아리
  alternatives_korean:
  - 토기장이의 병
  - 토기장이의 토기
  lexicon: HALOT
  rationale: 가마에서 빚은 그릇이라는 이미지를 현대 한국어에서 가장 자연스럽게 전달하는 기본 명칭으로 옮겼습니다.
- source_word: לֹא יַחְמֹל
  english_pob_choice: without pity
  chosen_korean: 가차 없이
  alternatives_korean:
  - 불쌍히 여기지 않고
  - 자비 없이
  lexicon: HALOT
  rationale: ‘아끼지 않다/불쌍히 여기지 않다’의 무정한 파괴를 한국어 관용으로 압축해, 파괴의 강도를 살렸습니다.
- source_word: חֶרֶשׂ
  english_pob_choice: a shard
  chosen_korean: 조각
  alternatives_korean:
  - 파편
  - 토기 조각
  lexicon: HALOT
  rationale: 도기 파편을 가리키는 구체성을 유지하되, 뒤의 불·물 긷기 동작과 자연스럽게 연결되도록 간결하게 처리했습니다.
theological_decisions:
- issue: 완전한 파괴의 비유를 유지하는 방식
  chosen_reading: ‘그 조각들 가운데서는 ... 찾을 수 없습니다’로 결과절을 살려, 쓸모 있는 파편이 전혀 남지 않는 심판의 이미지를 직설적으로 표현했습니다.
  alternative_readings:
  - ‘... 한 조각도 남지 않습니다’
  - ‘... 아무 쓸모도 없는 상태가 됩니다’
  rationale: 히브리어의 결과적 부정을 흐리지 않고, 토기 조각 하나도 실용적으로 쓸 수 없다는 심판의 총체성을 드러냅니다.
  doctrine_reference: 심판과 멸망의 비유 표현
- issue: ‘불을 집어 내기’와 ‘물을 긷기’의 기능적 대조
  chosen_reading: ‘불을 집어 내기’와 ‘물을 긷기’로 두 동작을 모두 살려, 부서진 토기의 무용성을 균형 있게 재현했습니다.
  alternative_readings:
  - ‘숯을 퍼내기’
  - ‘물을 떠내기’
  rationale: 본문의 두 실용 행위를 모두 보존해야 파편의 비유적 무력함이 분명해집니다.
  doctrine_reference: 본문 수사 구조
