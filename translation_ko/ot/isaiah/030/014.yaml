- from: 그것이 부서지는 것은 마치 토기장이의 항아리가 부서지는 것과 같아서, 가차 없이 부서져 그 조각들 가운데서는 불을 집어 내기 위한 한 조각도, 물을 긷기 위한 한 조각도 찾을 수 없습니다.[a][b]
