  lexicon: HALOT
  rationale: נחל은 시내/개울/흐름의 범위를 가지지만, 시적 병행 속에서 ‘시내’가 가장 압축적이고 이미지가 선명합니다. גפרית는 전통적 ‘유황’으로 옮겼습니다.
