  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
  footnotes:
  - marker: a
    text: Or 'Tophet.' The Hebrew form is a place-name associated with burning and judgment imagery.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from yesterday,' an idiom meaning that it has been prepared beforehand or long ago.
    reason: lexical_alternative
  - marker: c
    text: Traditional English often has 'brimstone' for 'sulfur.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 Topheth는 오래전부터 준비되어 있었고[a], 왕을 위하여도 마련되었기 때문입니다. 그분은 그것을 깊고 넓게 만드셨습니다. 거기에는 불과 나무가 많습니다. 야훼의 숨결이 유황의 시내처럼 그것을 붙입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토펫’. 히브리어 형태는 불과 심판의 이미지와 관련된 지명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה
  english_pob_choice: For Topheth has long been prepared[a]
  chosen_korean: Topheth는 오래전부터 준비되어 있었고
  alternatives_korean:
  - Topheth는 어제부터 준비되어 있었고
  - Topheth는 이미 마련되어 있었고
  - Topheth는 오래 전부터 갖추어져 있었고
  lexicon: HALOT
  rationale: עָרוּךְ의 완료된 준비 상태와 מֵאֶתְמוּל의 관용적 ‘오래전부터/이미’의 뜻을 함께 살려, 자연스러운 한국어로 준비된 상태를 분명히 드러냈습니다.
- source_word: תָּפְתֶּה
  english_pob_choice: Topheth
  chosen_korean: Topheth
  alternatives_korean:
  - 토펫
  - 토페트
  lexicon: HALOT
  rationale: 지명으로서 음역을 유지했습니다. 본문은 불과 심판의 이미지와 결부된 장소명 자체를 보존하는 것이 적절합니다.
- source_word: לַ/מֶּ֥לֶךְ
  english_pob_choice: for the king
  chosen_korean: 왕을 위하여도 마련되었기
  alternatives_korean:
  - 왕을 위하여
  - 그 왕을 위하여도 마련되었기
  - 앗수르 왕을 위하여도 마련되었기
  lexicon: HALOT
  rationale: 본문이 단순히 ‘왕’을 말하므로, 특정 왕을 단정하지 않고 목적어를 자연스럽게 살려 옮겼습니다. ‘도’는 גַּם의 강조를 반영합니다.
- source_word: נִשְׁמַ֤ת יְהוָה֙
  english_pob_choice: The breath of Yahweh
  chosen_korean: 야훼의 숨결
  alternatives_korean:
  - 야훼의 호흡
  - 야훼의 바람
  - 야훼의 숨
  lexicon: HALOT
  rationale: נשמת은 문자적으로 ‘숨/호흡/숨결’의 뜻이므로, 심판적 힘을 담으면서도 현대 한국어에서 자연스러운 ‘숨결’을 선택했습니다.
- source_word: כְּ/נַ֣חַל גָּפְרִ֔ית
  english_pob_choice: like a stream of sulfur
  chosen_korean: 유황의 시내처럼
  alternatives_korean:
  - 유황의 강처럼
  - 유황의 개울처럼
  - 유황의 흐름처럼
  lexicon: HALOT
  rationale: נחל은 시내/개울/흐름의 범위를 가지지만, 시적 병행 속에서 ‘시내’가 가장 압축적이고 이미지가 선명합니다. גפרית는 전통적 ‘유황’으로 옮겼습니다.
- source_word: בֹּעֲרָה בָּהּ
  english_pob_choice: kindles it
  chosen_korean: 그것을 붙입니다
  alternatives_korean:
  - 그것을 불태웁니다
  - 그것 안에서 타오릅니다
  - 그것에 불을 붙입니다
  lexicon: HALOT
  rationale: 불이 ‘붙다’라는 동사로 인과적 점화를 간명하게 표현했습니다. 주어가 ‘야훼의 숨결’이므로 능동적 점화 의미를 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본 절은 히브리어 본문에 직접 יְהוָה가 나타나므로, 프로젝트 기본값에 따라 고유명사성을 보존하는 ‘야훼’를 사용했습니다.
  doctrine_reference: POB terminology default for YHWH / יְהוָה
- issue: ‘왕’의 지시 대상
  chosen_reading: 특정 왕을 밝히지 않고 그대로 ‘왕’으로 둠
  alternative_readings:
  - 앗수르 왕
  - 앗수르의 왕
  - 몰렉
  rationale: 본문 자체는 대상을 특정하지 않으므로, 해석을 본문에 주입하지 않고 애매성을 유지했습니다.
  doctrine_reference: Original-language primacy; do not import contextual identification beyond the verse
