    rationale: ‘이는 … 때문입니다’로 고치면 합쇼체 문체에서 자연스럽습니다.
  revised_text: 이는 도벳이 오래전부터 마련되어 있고, 왕을 위해서도 준비되어 있기 때문입니다. 그곳은 깊고 넓게 마련되었으며, 그 불피움터에는 불과 나무가 많이 쌓여 있습니다. 야훼의 숨결이 유황 시내처럼 그곳에서 타오릅니다.
