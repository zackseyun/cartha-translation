revisions:
- from: 너희는 너희 은으로 입힌 우상 조각과 너희 금으로 입힌 우상 형상을 더럽힐 것이며, 그것들을 월경한 천처럼 흩어 버릴 것이다. 너희는 그것들에게 “나가라!” 하고 말할 것이다.[a]
  to: 너희는 너희가 새긴 우상들에 입힌 은 덧씌움과 너희가 부어 만든 형상에 입힌 금 덧씌움을 더럽힐 것이며, 그것들을 월경 때 쓰는 천[a]처럼 흩어 버릴 것이다. 너희는 그것을 향하여 “나가라!” 하고 말할 것이다.
  rationale: 금속 외피(덧씌움)와 우상 형상을 구별하여 원문의 명사구 구조를 반영했습니다. 월경 비유는 직설성을 유지하되 현대 한국어에서 자연스러운 표현으로 조정했습니다. 마지막 대명사는 히브리어 단수 형태를 따라, 앞의 우상 관련 물건들을 집합적으로 가리키는 단수 표현으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:43Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 명사구는 우상 자체라기보다 각각 새긴 우상과 부어 만든 형상에 입힌 은·금의 덧씌움(외피)을 가리킵니다. 현 번역의 ‘은으로 입힌 우상 조각/금으로 입힌 우상 형상’은 이 구별을 다소 흐립니다. 또한 본문 말미의 לּוֹ는 형태상 단수이므로, 영어 감사 이력의 복수 ‘them’을 그대로 따르기보다 한국어에서는 집합적으로 받는 단수 표현이 원문에 더 가깝습니다.
  naturalness: ‘월경한 천’은 현대 한국어에서 자연스럽지 않아 ‘월경 때 쓰는 천’으로 고쳤습니다. ‘덧씌움’은 다소 문어적이지만, 우상 자체와 그 금속 외피를 구별하는 본문의 의미를 간결하게 보존합니다.
  terminology: פְּסִילִים은 ‘새긴 우상들’, מַסֵּכָה는 ‘부어 만든 형상’으로 구별했습니다. טמא의 의례적 불결 이미지와 דָּוָה의 월경 관련 비유는 완화하지 않았습니다.
  issues:
  - severity: medium
    issue: 금속 외피와 우상 형상이 혼합되어 번역됨
    rationale: צִפּוּי와 אֲפֻדַּת는 각각 우상에 입힌 덮개·외피를 뜻하는데, 초안은 ‘은/금으로 입힌 우상’으로 옮겨 외피 자체를 목적어로 삼는 원문의 구문을 약화합니다.
  - severity: medium
    issue: 종결 대명사의 수가 원문과 다름
    rationale: 히브리어 לּוֹ는 단수입니다. 선행하는 우상 장식물 전체를 집합적으로 가리키는 표현일 수 있으므로, 복수 ‘그것들에게’보다 단수 집합 표현인 ‘그것을 향하여’가 형태와 문맥을 함께 보존합니다.
  - severity: low
    issue: ‘월경한 천’의 현대 한국어 어법
    rationale: 천 자체가 ‘월경한다’는 표현은 부자연스럽습니다. ‘월경 때 쓰는 천’이 영어 POB의 menstrual cloth와 본문의 불결 비유를 자연스럽고 직접적으로 전달합니다.
  revised_text: 너희는 너희가 새긴 우상들에 입힌 은 덧씌움과 너희가 부어 만든 형상에 입힌 금 덧씌움을 더럽힐 것이며, 그것들을 월경 때 쓰는 천[a]처럼 흩어 버릴 것이다. 너희는 그것을 향하여 “나가라!” 하고 말할 것이다.
