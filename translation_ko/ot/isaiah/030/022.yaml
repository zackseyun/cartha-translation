reference: Isaiah 30:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: ko
  text: 너희는 너희가 새긴 우상들에 입힌 은 덧씌움과 너희가 부어 만든 형상에 입힌 금 덧씌움을 더럽힐 것이며, 그것들을 월경 때 쓰는 천[a]처럼 흩어 버릴 것이다. 너희는 그것을 향하여 “나가라!” 하고 말할 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּוָה는 월경과 관련된 부정함을 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: טִמֵּאתֶם אֶת
  english_pob_choice: you will defile
  chosen_korean: 더럽힐 것이며
  alternatives_korean:
  - 부정하게 할 것이며
  - 더럽혀 놓을 것이며
  lexicon: טמא
  rationale: 의식적·종교적 오염의 동사를 한국어로 과도하게 완곡하지 않게 옮기되, 문장 흐름상 미래형으로 자연스럽게 처리했습니다.
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  english_pob_choice: the silver overlay of your carved idols
  chosen_korean: 너희 은으로 입힌 우상 조각
  alternatives_korean:
  - 너희 은덧씌운 새긴 우상
  - 너희 은판을 입힌 우상 조각
  lexicon: צִפּוּי + פֶּסֶל
  rationale: צִפּוּי의 ‘겉을 입힌/덧씌운 것’ 의미를 살려 ‘은으로 입힌’으로 옮겼고, פְּסִילִים은 문맥상 새긴 우상들을 가리키므로 ‘우상 조각’으로 구체화했습니다.
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  english_pob_choice: the gold plating of your cast images
  chosen_korean: 너희 금으로 입힌 우상 형상
  alternatives_korean:
  - 너희 금판을 입힌 부어 만든 형상
  - 너희 금장식의 주조한 형상
  lexicon: אֲפֻדָּה + מַסֵּכָה
  rationale: 금으로 ‘입힌’ 표면 장식을 살리면서, מַסֵּכָה의 ‘부어 만든 형상’ 의미를 ‘우상 형상’으로 자연스럽게 드러냈습니다.
- source_word: תִּזְרֵם כְּמוֹ דָוָה
  english_pob_choice: You will scatter them like a menstrual cloth
  chosen_korean: 그것들을 월경한 천처럼 흩어 버릴 것이다
  alternatives_korean:
  - 부정한 천처럼 흩어 버릴 것이다
  - 월경 때 쓴 천처럼 흩어 버릴 것이다
  lexicon: דָּוָה
  rationale: דָּוָה의 불결성 이미지를 약화하지 않기 위해 직설적으로 ‘월경한 천’으로 옮겼고, 동사의 결과도 분명히 하기 위해 ‘흩어 버릴 것이다’로 했습니다.
- source_word: לֽוֹ־־
  english_pob_choice: to them
  chosen_korean: 그것들에게
  alternatives_korean:
  - 그 우상들에게
  - 그것들에게
  lexicon: ל
  rationale: 이 절의 종결 명령은 우상들을 향한 직접 화법이므로, 영어 개정판의 복수 반영을 따라 ‘그것들’로 받았습니다.
theological_decisions:
- issue: 우상 파괴의 표상과 언어의 직설성
  chosen_reading: 우상의 외피와 형상을 정결 규범을 어기듯 더럽히고, 월경 오염의 비유로 흩어 버리는 직설적 심판 언어를 유지했습니다.
  alternative_readings:
  - ‘부정하게 할 것이다’처럼 의식적 오염을 완곡하게 처리
  - ‘부끄러운 천’ 등으로 문화적 충격을 완화
  rationale: 본문은 우상의 무가치함을 단순 비난이 아니라 불결·모독의 이미지로 극대화하므로, 한국어에서도 그 긴장을 약화하지 않는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: 우상숭배에 대한 예언자적 심판 언어
- issue: 직접 화법의 대상
  chosen_reading: “너희는… 그것들에게 ‘나가라!’ 하고 말할 것이다”로, 명령 대상이 우상들임을 분명히 했습니다.
  alternative_readings:
  - ‘그에게’처럼 단수화
  - 명령문 없이 서술화
  rationale: 히브리어 말미는 명령의 수신자를 우상들로 읽는 것이 문맥상 자연스럽고, 기존 영어 POB의 복수 수정도 이를 지지합니다.
  doctrine_reference: 문맥적 대명사 해석
