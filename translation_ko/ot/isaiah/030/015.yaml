id: ISA.30.15
reference: Isaiah 30:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
  footnotes:
  - marker: a
    text: Or “in repentance”; the Hebrew more literally speaks of returning, which may include repentance and turning back to God.
    reason: lexical_alternative
  - marker: b
    text: Or “you will be delivered.”
    reason: alternative_reading
translation:
  language: ko
  text: 이는 주 야훼, 이스라엘의 거룩하신 이께서 말씀하신 바입니다. 「돌아와 잠잠히 있으면 너희가 구원을 받을 것이며, 고요함과 신뢰가 너희의 힘이 될 것이다.」 그러나 너희는 원하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아와’는 히브리어가 문자적으로 말하는 ‘돌아옴’을 반영합니다. 이 말은 회개를 포함할 수 있지만, 문맥상 하나님께로의 회귀와 태도 전환까지 넓게 열어 둡니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희가 구출될 것이다’.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 겹친 신적 칭호를 살리기 위해 아도나이는 ‘주’, 야훼는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘주 하나님’은 구분이 약해지고, 전통적 ‘여호와’는 본 프로젝트의 기본 표기를 따르지 않습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩한 이
  - 이스라엘의 거룩하신 분
  lexicon: HALOT
  rationale: 이사야에 반복되는 칭호의 고유한 어감을 살리되, ‘거룩하신 이’로 인격적 호칭과 신적 구별을 함께 드러냈습니다.
- source_word: בְּשׁוּבָה וָנַחַת
  english_pob_choice: In returning and rest
  chosen_korean: 돌아와 잠잠히 있으면
  alternatives_korean:
  - 돌아옴과 쉼 속에서
  - 돌이켜 안식하면
  lexicon: HALOT
  rationale: ‘돌아오다’의 구체적 동작과 뒤따르는 ‘rest’의 의미를 함께 살리기 위해 문맥상 조건절로 자연스럽게 옮겼습니다. ‘잠잠히’는 이어지는 ‘quietness’와도 맞물리며 분주한 의존을 멈추는 뉘앙스를 반영합니다.
- source_word: תִּוָּשֵׁעוּן
  english_pob_choice: you will be saved
  chosen_korean: 너희가 구원을 받을 것이며
  alternatives_korean:
  - 너희가 구출될 것이며
  - 너희가 구원받을 것이며
  lexicon: HALOT
  rationale: 예언문맥의 רחב한 ישׁע의 의미를 살려 ‘구원을 받다’로 옮겼습니다. 단순한 정치적 ‘구출’보다 언약적·종말론적 무게를 유지합니다.
- source_word: בְּהַשְׁקֵט וּבְבִטְחָה
  english_pob_choice: in quietness and trust
  chosen_korean: 고요함과 신뢰
  alternatives_korean:
  - 평온함과 신뢰
  - 잠잠함과 믿음
  lexicon: HALOT
  rationale: ‘quietness’는 정적인 고요를 뜻하므로 ‘고요함’으로, ‘trust’는 관계적 의지이므로 ‘신뢰’로 옮겼습니다. 두 명사가 병렬을 이루도록 간결하게 처리했습니다.
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  english_pob_choice: will be your strength
  chosen_korean: 너희의 힘이 될 것이다
  alternatives_korean:
  - 너희의 강함이 될 것이다
  - 너희의 능력이 될 것이다
  lexicon: HALOT
  rationale: גְּבוּרָה의 ‘힘/능력/강함’ 가운데 문맥상 가장 자연스러운 ‘힘’을 택해, 군사적 의지 대신 참된 의존의 힘을 드러냈습니다.
- source_word: וְלֹא אֲבִיתֶם
  english_pob_choice: But you were unwilling
  chosen_korean: 그러나 너희는 원하지 않았습니다
  alternatives_korean:
  - 그러나 너희는 마지않았습니다
  - 그러나 너희는 거부했습니다
  lexicon: HALOT
  rationale: אָבָה의 핵심은 의지의 부재이므로 ‘원하지 않았다’로 옮겨 내적 태도를 드러냈습니다. ‘거부했다’보다 덜 법정적이고, 원문의 불순응을 자연스럽게 전달합니다.
theological_decisions:
- issue: בְּשׁוּבָה의 해석 범위
  chosen_reading: ‘돌아와’로 옮겨 회개와 하나님께로의 회귀를 모두 열어 두었습니다.
  alternative_readings:
  - ‘회개하면’
  - ‘돌이키면’
  rationale: 히브리어 שׁוּב는 단순한 감정적 후회보다 관계적 방향 전환을 포함할 수 있으므로, 특정 교리 용어로 좁히지 않고 본문이 허용하는 폭을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it.'
- issue: תִּוָּשֵׁעוּן의 구원/해방 뉘앙스
  chosen_reading: ‘구원을 받을 것’으로 번역해 언약적 구원의 무게를 살렸습니다.
  alternative_readings:
  - ‘구출될 것이다’
  - ‘건짐을 받을 것이다’
  rationale: 예언문맥에서 ישׁע는 국가적 해방과 더 넓은 구원 모두를 가리킬 수 있으므로, 한쪽으로 축소하지 않는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it.'
