  source_fidelity: ‘그의 영’은 רוּחוֹ의 가능한 뜻이지만, 바로 앞 절의 ‘그의 입에서 나오는 숨’과 이어지는 심판의 급류 비유에서는 ‘그의 숨’이 가장 직접적입니다. 또한 לַהֲנָפָה ... בְּנָפַת שָׁוְא는 나라들을 체로 까부르는 목적/행위를 나타내므로 ‘가려내려 하고’보다 그 이미지를 명확히 해야 합니다.
  naturalness: ‘빈것의 체’는 띄어쓰기와 어감 면에서 자연스럽지 않고, ‘백성들의 턱 위에 있습니다’도 한국어로 다소 경직됩니다. ‘허무의 체’, ‘턱에는’ 및 ‘길을 잃게 하는 굴레’가 현대 표준어 문장으로 자연스럽습니다.
  terminology: רוּחַ의 다의성은 본문에서는 ‘숨’으로 옮기고 각주에서 ‘영’과 ‘바람’을 제시하는 것이 적절합니다. שָׁוְא는 ‘허무’로, רֶסֶן은 비유적 통제 장치라는 점을 살려 ‘굴레’로 옮깁니다.
  issues:
