    issue: ‘그의 영’이 본문 문맥의 우선 의미를 약화합니다.
    rationale: 30:27의 입과 30:28의 רוּחוֹ는 연결되며, 넘쳐흐르는 시내 비유도 ‘숨/호흡’의 파괴적 분출과 잘 맞습니다. ‘영’은 각주 대안으로 보존하는 편이 원문 및 영어 감사 기록의 선택에 더 충실합니다.
