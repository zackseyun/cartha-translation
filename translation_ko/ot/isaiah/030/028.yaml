  text: 그의 숨은 목까지 차오르는 넘쳐흐르는 시내 같으며[a], 나라들을 허무의 체로 까부르시려고 하십니다[b]. 또 백성들의 턱에는 그들을 길을 잃게 하는 굴레가 있습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
