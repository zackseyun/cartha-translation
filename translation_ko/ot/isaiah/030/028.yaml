  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
