source:
  edition: WLC
  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
  footnotes:
  - marker: a
    text: Or 'his spirit' or 'his wind' for 'his breath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with a sieve of vanity,' 'with a sieve of falsehood,' or 'with a worthless sieve.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a bridle that leads astray' on the cheeks/jaws of the peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영은 넘치는 시내 같아서[a] 목까지 이르며, 나라들을 빈것의 체로[b] 가려내려 하고, 미혹하는 굴레[c]가 백성들의 턱 위에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 숨’, ‘그의 바람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘허무의 체’, ‘헛것의 체’, ‘헛된 체’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘길을 잃게 하는 굴레’ 또는 ‘속이는 굴레’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחוֹ
  english_pob_choice: his breath
  chosen_korean: 그의 영
  alternatives_korean:
  - 그의 숨
  - 그의 바람
  lexicon: HALOT
  rationale: רוּחַ는 숨, 바람, 영을 모두 가리킬 수 있으므로, 이 심판 맥락에서는 구체적 ‘숨’보다도 원문의 다의성을 살린 ‘영’이 가장 무리 없이 대응합니다.
- source_word: כְּנַחַל שׁוֹטֵף
  english_pob_choice: like an overflowing stream
  chosen_korean: 넘치는 시내 같아서
  alternatives_korean:
  - 넘쳐흐르는 시내 같아서
  - 홍수처럼 몰아치는 시내 같아서
  lexicon: HALOT
  rationale: נחל은 시내/와디이고 שוטף는 넘쳐흐르는 힘을 더하므로, ‘넘치는 시내’가 이미지와 자연스러운 한국어를 함께 살립니다.
- source_word: בְּנָפַת שָׁוְא
  english_pob_choice: with a sieve of emptiness
  chosen_korean: 빈것의 체
  alternatives_korean:
  - 허무의 체
  - 헛것의 체
  - 헛된 체
  lexicon: HALOT
  rationale: שָׁוְא는 공허, 허무, 헛됨의 뜻을 가지며, ‘빈것’은 심판의 공허함과 무가치함을 직설적으로 드러내는 현대어 표현입니다.
- source_word: רֶסֶן מַתְעֶה
  english_pob_choice: a misleading bridle
  chosen_korean: 미혹하는 굴레
  alternatives_korean:
  - 길을 잃게 하는 굴레
  - 속이는 굴레
  lexicon: HALOT
  rationale: רֶסֶן은 말의 굴레/재갈에 가까운 제어 장치이므로 ‘굴레’가 적절하고, מַתְעֶה의 ‘길에서 벗어나게 함’은 ‘미혹하는’으로 자연스럽게 살렸습니다.
- source_word: עַל לְחָיֵי עַמִּים
  english_pob_choice: on the jaws of the peoples
  chosen_korean: 백성들의 턱 위에
  alternatives_korean:
  - 백성들의 볼 위에
  - 백성들의 턱에
  lexicon: HALOT
  rationale: לְחָיֵי는 볼/턱의 뜻이 있으나 굴레 이미지와 함께 읽을 때 ‘턱’이 가장 직접적이며, עַמִּים은 여기서 개별 ‘민족들’보다 집합적 ‘백성들’이 자연스럽습니다.
theological_decisions:
- issue: ‘רוּחוֹ’의 한국어 처리에서 ‘영/숨/바람’ 가운데 무엇을 전면화할지
  chosen_reading: 본문의 심판적 파괴력과 인격적 주도권을 함께 살리기 위해 ‘영’으로 옮겼습니다.
  alternative_readings:
  - 그의 숨
  - 그의 바람
  rationale: 이 문맥은 단순한 기상 현상보다 야훼의 심판 행위를 묘사하므로, ‘영’이 원문의 폭과 신학적 무게를 가장 잘 보존합니다.
  doctrine_reference: 야훼의 주권적 심판과 언어적 다의성 보존
