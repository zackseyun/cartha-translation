  rationale: 문맥상 ‘숨’을 본문 선택으로 삼되 רוּחַ의 다른 가능한 뜻은 각주에 보존했습니다. ‘허무의 체로 까부르시려고’는 체로 흔들어 거르는 원문의 심판 비유와 목적 표현을 살립니다. 마지막 구절은 굴레가 백성들을 잘못된 길로 이끈다는 능동적 의미를 자연스러운 합쇼체로 드러냈습니다.
