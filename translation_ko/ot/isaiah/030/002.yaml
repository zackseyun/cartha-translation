revisions:
- from: 곧 애굽으로 내려가려 하면서도 내 입은 묻지 않고, 바로의 요새에서 피난처를 찾고 애굽의 그늘에 숨으려 하는 자들입니다.[a][b]
  to: 곧 애굽으로 내려가면서도 내 입에 묻지 않고, 바로의 요새에서 힘을 얻고 애굽의 그늘에 피하려 하는 자들입니다.
