  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/הֹלְכִים֙ לָ/רֶ֣דֶת מִצְרַ֔יִם וּ/פִ֖/י לֹ֣א שָׁאָ֑לוּ לָ/עוֹז֙ בְּ/מָע֣וֹז פַּרְעֹ֔ה וְ/לַ/חְס֖וֹת בְּ/צֵ֥ל מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: ko
  text: 곧 애굽으로 내려가려 하면서도 내 입은 묻지 않고, 바로의 요새에서 피난처를 찾고 애굽의 그늘에 숨으려 하는 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘애굽’은 본문 מִצְרַיִם의 관용적 한국어 표기입니다.
    reason: korean_style_note
  - marker: b
    text: ‘내 입은 묻지 않고’는 문자적으로는 ‘내 입을 묻지 않고’에 가까우나, 한국어에서는 자연스러운 목적격 표현으로 다듬었습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הַ/הֹלְכִים֙ לָ/רֶ֣דֶת מִצְרַ֔יִם
  english_pob_choice: who set out to go down to Egypt
  chosen_korean: 곧 애굽으로 내려가려 하면서도
  alternatives_korean:
  - 애굽으로 내려가려 가는 자들
  - 애굽으로 내려가고자 떠나는 자들
  lexicon: הלך + ירד + מצרים
  rationale: 진행·의도적 움직임을 살려 ‘내려가려 하면서도’로 옮겨, 단순한 이동이 아니라 의도와 방향성을 함께 드러냈습니다.
- source_word: וּ/פִ֖/י לֹ֣א שָׁאָ֑לוּ
  english_pob_choice: have not asked my mouth
  chosen_korean: 내 입은 묻지 않고
  alternatives_korean:
  - 내 입에 묻지 않고
  - 나에게 묻지 않고
  lexicon: פה + שאל
  rationale: 히브리어의 직설적인 ‘내 입’ 표현을 유지해, 하나님께 묻지 않았다는 문장 구조의 긴장을 살렸습니다.
- source_word: לָ/עוֹז֙ בְּ/מָע֣וֹז פַּרְעֹ֔ה
  english_pob_choice: to seek refuge in Pharaoh’s stronghold
  chosen_korean: 바로의 요새에서 피난처를 찾고
  alternatives_korean:
  - 바로의 요새에 피신하고
  - 바로의 성채에 의지하고
  lexicon: מעוז + חסה
  rationale: ‘מעוז’의 방어적 의미를 ‘요새’로, ‘חסה’의 피신 개념을 ‘피난처를 찾다’로 살려 원문의 보호 의존을 드러냈습니다.
- source_word: וְ/לַ/חְס֖וֹת בְּ/צֵ֥ל מִצְרַֽיִם
  english_pob_choice: and to take shelter in the shadow of Egypt
  chosen_korean: 애굽의 그늘에 숨으려 하는 자들입니다
  alternatives_korean:
  - 애굽의 그늘에서 피하려는 자들입니다
  - 애굽의 그늘 아래 숨으려 하는 자들입니다
  lexicon: צל + חסה
  rationale: ‘그늘’ 이미지를 유지하되 한국어에서 자연스러운 종결로 마무리하여, 이 구절 전체가 비난적 묘사임을 분명히 했습니다.
theological_decisions:
- issue: 하나님께 묻지 않은 행위의 강조
  chosen_reading: ‘내 입은 묻지 않고’로 직역에 가깝게 옮겨, 상담·조언의 부재보다 하나님께 직접 묻지 않은 불순종을 강조했습니다.
  alternative_readings:
  - ‘나에게 묻지 않고’
  - ‘내 뜻을 구하지 않고’
  rationale: 본문의 לשאול + פיה는 관용적으로 ‘입’이 매개가 되는 신탁적 문의를 가리키므로, 이를 완화하지 않고 유지하는 편이 경고의 날카로움을 보존합니다.
  doctrine_reference: 예언서의 야훼께 대한 의존/불신의 죄
- issue: 문장 종결의 수사 기능
  chosen_reading: 전체를 ‘...하는 자들입니다’로 끝내어, 본문이 비난과 규탄의 대상 집단을 지목하는 문맥을 한국어에서 분명히 했습니다.
  alternative_readings:
  - ‘...합니다’
  - ‘...하는 사람들입니다’
  rationale: 히브리어 분사구문은 정체성 규정의 효과가 강하므로, 한국어에서도 설명문보다 규정문으로 마무리하는 것이 문맥에 맞습니다.
  doctrine_reference: 예언적 책망의 화법
