id: ISA.30.1
reference: Isaiah 30:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
  footnotes:
  - marker: a
    text: Or 'and who weave a covering'; some understand the phrase more broadly in context as 'and who make an alliance.' The Hebrew text as pointed most naturally reads 'and who pour out a libation.'
    reason: alternative_reading
translation:
  language: ko
  text: “아, 반역하는 자녀들이여! 이것은 야훼의 말씀입니다. 그들은 나에게서 나오지 않은 계획을 실행하고, 내 영에 의하지 않은 전제를 부어, 죄에 죄를 더하려 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덮개를 짜다’로 옮길 수 있습니다. 어떤 이들은 문맥상 이 표현을 더 넓게 ‘동맹을 맺다’로 이해합니다. 그러나 히브리어 모음 표기에 따르면 가장 자연스러운 뜻은 ‘전제를 붓다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: “반역하는 자녀들아”
  alternatives_korean:
  - “화 있을진저, 반역하는 자녀들아”
  - “슬프도다, 반역하는 자녀들아”
  lexicon: HALOT
  rationale: 예언적 경고의 감탄사 기능은 살리되, 현대 한국어에서 가장 자연스럽게 경고를 울리는 표현으로 반역의 직접 호칭을 앞세웠습니다.
- source_word: בָּנִים סוֹרְרִים
  english_pob_choice: rebellious children
  chosen_korean: 반역하는 자녀들
  alternatives_korean:
  - 반항하는 자녀들
  - 완고한 아들들
  lexicon: HALOT
  rationale: 관계적·언약적 호칭을 살리기 위해 '자녀들'을 택했고, סוֹרְרִים은 단순한 방황보다 의도적 불순종을 나타내므로 '반역하는'이 더 직접적입니다.
- source_word: לְנְסֹךְ מַסֵּכָה
  english_pob_choice: and who pour out a libation
  chosen_korean: 전제를 붓지만
  alternatives_korean:
  - 부어 올리는 제물을 드리지만
  - 붓는 제사를 드리지만
  lexicon: HALOT
  rationale: 마소라 점자에 따른 본래 의미를 따라 '붓다'를 살렸고, מַסֵּכָה의 제의적 의미를 한국어 제의어인 '전제'로 옮겨 본문이 보이는 직접 의미를 유지했습니다.
- source_word: וְלֹא רוּחִי
  english_pob_choice: but not by my Spirit
  chosen_korean: 내 영에 의한 것이 아니며
  alternatives_korean:
  - 내 영으로 말미암은 것이 아니며
  - 내 성령에 의한 것이 아니며
  lexicon: HALOT
  rationale: רוּחִי를 문맥상 하나님의 영으로 이해하되, 해당 형식을 기계적으로 '성령'으로 고정하지 않고 원문이 말하는 소유격 구조를 살려 '내 영'으로 번역했습니다.
- source_word: חַטָּאת עַל חַטָּאת
  english_pob_choice: sin to sin
  chosen_korean: 죄에 죄를 더하려고 합니다
  alternatives_korean:
  - 죄 위에 죄를 더하려고 합니다
  - 죄를 거듭 더하려고 합니다
  lexicon: HALOT
  rationale: 히브리어 중첩 표현의 누적성을 현대 한국어의 자연스러운 결과 표현으로 옮겨, 단순 반복이 아니라 죄의 가중을 분명히 했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 언약명은 '야훼'로 옮겨 예언자적 경고의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: רוּחִי의 해석과 한국어 표현
  chosen_reading: 내 영
  alternative_readings:
  - 내 성령
  - 내 신령
  rationale: 본문은 출처/수단을 부정하는 문맥이므로 '내 영에 의한 것이 아니며'로 옮겨, 하나님의 주도와 인간 정치적 책략의 대비를 분명히 했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
