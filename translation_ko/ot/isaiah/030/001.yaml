  source_fidelity: 개정이 필요합니다. 초안은 הוֹי(‘화/슬픔의 선언’)를 본문에서 누락했으며, ‘계획’과 ‘전제’ 각각에 붙는 ‘나에게서 나온 것이 아니며’와 ‘내 영에 의한 것이 아니며’의 병렬 구조도 다소 흐려졌습니다. 마소라 본문의 ‘전제를 붓다’는 유지하는 것이 타당합니다.
  naturalness: ‘반역하는 자녀들아’로 시작한 뒤 ‘그들은 … 합니다’로 이어지는 초안은 호칭과 서술의 연결 및 합쇼체 종결이 매끄럽지 않습니다. ‘아, … 자녀들이여!’와 ‘야훼의 말씀입니다’ 및 병렬 동사구를 사용하면 현대 한국어의 공식적 성경 문체로 더 자연스럽습니다.
  terminology: ‘야훼’, ‘반역하는 자녀들’, ‘전제’, ‘내 영’, ‘죄에 죄를 더하다’는 적절합니다. 다만 ‘전제를 붓지만’은 원문의 연속된 고발을 충분히 반영하지 못하므로 ‘전제를 부으며’로 병렬시키는 편이 낫습니다. ‘성령’으로 특정하지 않고 ‘내 영’을 유지합니다.
