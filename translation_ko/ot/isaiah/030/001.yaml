revisions:
- from: “반역하는 자녀들아, 야훼의 말씀이다. 그들은 계획을 실행하지만 나에게서 나온 것이 아니며, 전제를 붓지만 내 영에 의한 것이 아니어서, 죄에 죄를 더하려고 합니다.”[a]
  to: “아, 반역하는 자녀들이여! 이것은 야훼의 말씀입니다. 그들은 나에게서 나오지 않은 계획을 실행하고, 내 영에 의하지 않은 전제를 부어, 죄에 죄를 더하려 합니다.”[a]
  rationale: הוֹי의 감탄적 고발을 ‘아’로, 그 재앙 선포의 어조를 ‘반역하는 자녀들이여!’라는 호격으로 드러냈습니다. 두 부정 전치사구가 각각 ‘계획’과 ‘전제’를 수식하도록 재구성하여 원문의 병렬을 보존했습니다. 마소라 본문에 따른 ‘전제를 붓다’를 본문에 유지하고, 해석상 대안은 각주에만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:07:40Z'
