id: ISA.30.30
reference: Isaiah 30:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
  footnotes:
  - marker: a
    text: Or 'the descent of his arm'; the Hebrew expression is difficult and may emphasize the downward motion of the LORD's arm in judgment rather than the impact itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'downpour' for 'cloudburst'; the Hebrew term likely refers to a violent bursting storm.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 목소리의 위엄을 들려주시며[a], 그의 팔의 내리치는 작용을 보이시리니, 격렬한 분노와 삼키는 불꽃[b]과 함께, 구름폭발과 폭풍과 우박이 따를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 팔의 내려옴’; 히브리어 표현은 어렵고, 심판에서 야훼의 팔이 아래로 내리치는 동작 자체를 강조할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘구름폭우’로도 옮길 수 있습니다. 히브리어는 폭력적인 파열을 동반한 폭풍성 강수를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 본 프로젝트의 기본값을 따라 신적 이름을 학술적으로 음역해, 원문과의 직접성을 유지했습니다.
- source_word: הִשְׁמִיעַ
  english_pob_choice: will make the majesty of his voice heard
  chosen_korean: 목소리의 위엄을 들려주시며
  alternatives_korean:
  - 목소리를 들리게 하시며
  - 목소리의 위엄을 듣게 하시며
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도 한국어로 자연스럽게 들리는 ‘들려주시다’로 옮겼습니다.
- source_word: הוֹד קוֹלוֹ
  english_pob_choice: the majesty of his voice
  chosen_korean: 그의 목소리의 위엄
  alternatives_korean:
  - 그의 음성의 위엄
  - 그의 목소리의 영광
  lexicon: HALOT
  rationale: הוֹד의 핵심인 위엄/장엄함을 살려, 원문의 수식 관계를 간결하게 반영했습니다.
- source_word: נַחַת זְרוֹע/וֹ
  english_pob_choice: the descending blow of his arm
  chosen_korean: 그의 팔의 내리치는 작용
  alternatives_korean:
  - 그의 팔의 내림
  - 그의 팔의 내려옴
  - 그의 팔의 내려치는 힘
  lexicon: HALOT
  rationale: 문맥상 심판의 하향 운동과 타격성을 함께 담아야 하므로, POB의 해석적 선택을 따라 ‘내리치는 작용’으로 렌더링했습니다.
- source_word: לַהַב אֵשׁ אוֹכֵלָה
  english_pob_choice: a flame of consuming fire
  chosen_korean: 삼키는 불꽃
  alternatives_korean:
  - 삼켜 버리는 불길
  - 사르는 불꽃
  lexicon: HALOT
  rationale: ‘먹다/삼키다’의 능동적 의미를 살리되, 시적 병렬성에 맞게 압축해 표현했습니다.
- source_word: נֶפֶץ וָזֶרֶם וְאֶבֶן בָּרָד
  english_pob_choice: cloudburst and storm and hailstones
  chosen_korean: 구름폭발과 폭풍과 우박
  alternatives_korean:
  - 소나기와 폭풍과 우박
  - 폭우와 폭풍과 우박
  lexicon: HALOT
  rationale: POB가 구별한 폭력적 기상 심판 이미지를 따라, נֶפֶץ를 단순한 비가 아니라 ‘구름폭발’로 옮겨 강한 파열감을 보존했습니다.
theological_decisions:
- issue: 하나님의 심판을 나타내는 의인화/신체 이미지
  chosen_reading: ‘팔’과 ‘내리치는 작용’을 그대로 살려, 하나님의 힘을 추상화하지 않고 예언적 심판 이미지로 유지했습니다.
  alternative_readings:
  - 단순히 ‘권능’이나 ‘능력’으로 완화하기
  rationale: 원문과 POB 모두 구체적 신체 비유를 사용하므로, 이를 약화하면 예언적 긴장과 심판의 생생함이 줄어듭니다.
  doctrine_reference: 번역 원칙 §1, §3
