  to: 야훼께서 그의 음성의 위엄을 들려주시고, 그의 팔이 내리치는 모습을[a] 보이실 것입니다. 그분은 격렬한 분노로, 사르는 불꽃과 폭우[b]와 폭풍과 우박을 동반하여 그렇게 하실 것입니다.
