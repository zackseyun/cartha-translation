  source_fidelity: 수정이 필요합니다. עַל־קַל은 문맥상 말/탈것을 가리키지만 명사가 생략된 표현이므로 ‘빠른 것들’과 각주로 이를 보존할 수 있습니다. 다만 נִרְכָּב은 ‘타다’이지 ‘달리다’가 아니며, יִקַּלּוּ에는 비교급 ‘더욱’이 없습니다. 또한 각주 표지는 해당 생략 표현에 붙어야 합니다.
  naturalness: 기존의 ‘빠른 것들을 타고 달리겠다’는 ‘것들’을 타는 어색함에 더하여 원문에 없는 ‘달리다’를 보탭니다. ‘빠른 것들을 타겠습니다’는 생략의 낯섦을 의도적으로 유지하되 각주가 보완하며, 직접화법도 합쇼체로 통일합니다.
  terminology: ‘말을 타고 도망하다’, ‘너희를 추격하는 자들’, ‘빠를 것입니다’는 본문의 군사적 추격 및 반어적 어휘 반복을 자연스럽게 반영합니다. ‘더욱’은 비교를 명시하지 않은 히브리어를 과도하게 해석하므로 삭제합니다.
