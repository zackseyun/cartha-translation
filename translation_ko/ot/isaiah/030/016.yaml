  to: 그러나 너희는 말했습니다. “아닙니다. 우리는 말을 타고 도망하겠습니다.” 그러므로 너희는 도망할 것이며, “우리는 빠른 것들[a]을 타겠습니다.” 그러므로 너희를 추격하는 자들은 빠를 것입니다.
