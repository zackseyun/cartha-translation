id: ISA.30.16
reference: Isaiah 30:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
  footnotes:
  - marker: a
    text: Or “on swift horses” or “on fast mounts.” The Hebrew reads simply “on swift ones,” with the noun implied from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 말했습니다. “아닙니다. 우리는 말을 타고 도망하겠습니다.” 그러므로 너희는 도망할 것이며, “우리는 빠른 것들[a]을 타겠습니다.” 그러므로 너희를 추격하는 자들은 빠를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빠른 것들’이며, 문맥상 말이나 탈것이 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  english_pob_choice: But you said
  chosen_korean: 그러나 너희는 말하였습니다
  alternatives_korean:
  - 그리고 너희는 말하였습니다
  - 그런데 너희는 말하였습니다
  lexicon: HALOT
  rationale: 문맥상 앞선 하나님의 경고에 대한 대조가 있으므로 ‘그러나’가 전달하는 역접을 살리면서, 직접 발화를 자연스러운 합쇼체로 옮겼습니다.
- source_word: לֹא כִּי
  english_pob_choice: No, for
  chosen_korean: 아니다
  alternatives_korean:
  - 아니요, 왜냐하면
  - 아니다, 우리는
  lexicon: HALOT
  rationale: 히브리어의 강한 부정과 뒤따르는 이유 제시를 한국어에서 짧고 단호한 ‘아니다’로 먼저 살리고, 뒤 문장에서 그 이유를 풀어 주었습니다.
- source_word: עַל סוּס
  english_pob_choice: on horses
  chosen_korean: 말을 타고
  alternatives_korean:
  - 말 위에서
  - 말들 위에
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 집합적 표현이므로, 한국어에서는 ‘말을 타고’로 자연스럽게 풀어 집단적 도주 수단을 드러냈습니다.
- source_word: עַל קַל
  english_pob_choice: on swift ones
  chosen_korean: 빠른 것들을
  alternatives_korean:
  - 빠른 말들을
  - 신속한 것들을
  lexicon: HALOT
  rationale: 본문은 명사가 생략된 ‘빠른 것들’이라는 압축 표현이므로, 영어 POB의 풀이를 따라 한국어에서도 생략을 보존했습니다. 다만 문맥상 말/탈것이 암시되지만 본문이 직접 말하지는 않으므로 과도하게 특정하지 않았습니다.
- source_word: יִקַּלּוּ רֹדְפֵיכֶם
  english_pob_choice: your pursuers will be swift
  chosen_korean: 너희를 뒤쫓는 자들은 더욱 빠를 것입니다
  alternatives_korean:
  - 너희를 뒤쫓는 자들은 신속할 것입니다
  - 너희 추격자들은 더 빨라질 것입니다
  lexicon: HALOT
  rationale: יִקַּלּוּ의 ‘가벼워지다/신속해지다’ 뉘앙스를 한국어의 ‘더욱 빠르다’로 옮겨, 추격자가 도주 수단에 못지않게 혹은 그보다 더 신속해지는 역전의 아이러니를 살렸습니다.
theological_decisions:
- issue: 예언적 반어와 심판의 역전
  chosen_reading: 유다의 자신감 있는 발화가 곧 심판의 결과로 되돌아오는 구조를 유지했습니다.
  alternative_readings:
  - 단순한 미래 예고로 완화하는 읽기
  - 문장만 평서적으로 처리하는 읽기
  rationale: 이 절은 ‘우리는 도망하겠다/달리겠다’는 인간적 자기확신이 ‘그러므로 너희는 도망할 것이며…’라는 판결로 뒤집히는 반어 구조입니다. 이를 약화시키면 본문의 선지자적 날카로움이 사라집니다.
  doctrine_reference: 예언서의 심판-반전 모티프
- issue: 명사 생략의 보존
  chosen_reading: ‘빠른 것들’을 유지해 히브리어의 생략과 모호성을 드러냈습니다.
  alternative_readings:
  - 문맥에 따라 ‘빠른 말들’로 보충하는 읽기
  - ‘빠른 탈것들’로 명시하는 읽기
  rationale: 원문은 ‘빠른’ 뒤에 명사를 반복하지 않아 의도적 압축이 있습니다. 한국어에서 이를 과도하게 특정하면 본문의 긴장과 간결함이 약해집니다.
  doctrine_reference: 원문 형식 보존 원칙
