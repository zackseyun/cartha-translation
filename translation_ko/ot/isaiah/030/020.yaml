  - severity: medium
    issue: 주석 a가 유효한 어휘 대안을 제공하지 않음
    rationale: 현행 주석은 본문과 같은 ‘환난의 빵’을 다시 제시합니다. 영문 감사 기록의 ‘adversity/affliction’ 대안을 반영하여 본문과 구별되는 ‘곤고의 빵’과 ‘고난의 물’을 제시해야 합니다.
  - severity: low
