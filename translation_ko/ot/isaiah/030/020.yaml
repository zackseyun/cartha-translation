source:
  edition: WLC
  text: וְ/נָתַ֨ן לָ/כֶ֧ם אֲדֹנָ֛/י לֶ֥חֶם צָ֖ר וּ/מַ֣יִם לָ֑חַץ וְ/לֹֽא יִכָּנֵ֥ף עוֹד֙ מוֹרֶ֔י/ךָ וְ/הָי֥וּ עֵינֶ֖י/ךָ רֹא֥וֹת אֶת מוֹרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
  footnotes:
  - marker: a
    text: Or 'bread of adversity' and 'water of affliction.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew may also be read 'your teachers will no longer be hidden' or, traditionally, 'your teacher will no longer be removed into a corner.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 너희에게 환난의 빵과 압제의 물을 주실 것이며[a], 너희의 교사는 더 이상 숨겨져 있지 않을 것이고[b], 너희의 눈은 너희의 교사를 볼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곤고의 빵’과 ‘고난의 물’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너희의 교사들이 더 이상 숨겨져 있지 않을 것이다’ 또는 전통적으로 ‘너희의 교사가 더 이상 구석으로 물러나지 않을 것이다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: HALOT
  rationale: 하나님을 가리키는 주권 칭호이므로 한국어 성경의 자연스러운 신칭인 ‘주님’을 사용했습니다.
- source_word: לֶחֶם צָר
  english_pob_choice: bread of distress
  chosen_korean: 환난의 빵
  alternatives_korean:
  - 고통의 빵
  - 곤고의 빵
  - 환난의 떡
  lexicon: HALOT
  rationale: צָר의 압박·곤란 의미를 살려 ‘환난’으로 옮기고, לֶחֶם은 일상어로 ‘빵’으로 번역해 어려운 처지를 드러냈습니다.
- source_word: מַיִם לָחַץ
  english_pob_choice: water of oppression
  chosen_korean: 압제의 물
  alternatives_korean:
  - 억압의 물
  - 고통의 물
  - 환난의 물
  lexicon: HALOT
  rationale: לָחַץ의 압박·억압 의미를 직접 살려, 앞 구절과의 병행을 유지하는 ‘압제의 물’로 옮겼습니다.
- source_word: מוֹרֶיךָ
  english_pob_choice: your teacher
  chosen_korean: 너희의 교사
  alternatives_korean:
  - 너의 교사
  - 너희의 선생
  lexicon: HALOT
  rationale: 히브리어 형태가 단수·복수 해석을 모두 열어 두므로, POB의 긴장을 따라 본문에서는 집합적 복수로 무난하게 옮기고 주석에서 단수 가능성을 밝혔습니다.
theological_decisions:
- issue: מוֹרֶיךָ의 단수/복수 및 대상의 정체를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 ‘너희의 교사’로 두어 인간 교사/복수적 지도자 가능성을 열어 두고, 특정 신적 동일시를 강요하지 않았습니다.
  alternative_readings:
  - ‘너의 교사’로 단수화
  - 하나님을 직접 가리키는 것으로 해석
  rationale: 영문 POB가 신학적 긴장을 보존하듯, 히브리어의 형태적 여지를 한국어 본문에서도 최대한 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
