  lexicon: HALOT
  rationale: 심판의 강한 폭력을 완화하지 않고, 히브리어의 강한 판단 언어를 비교적 직접적으로 옮겼습니다.
theological_decisions:
- issue: 물의 이미지와 심판 이미지의 병치
  chosen_reading: 풍성한 물의 이미지와 ‘큰 살육의 날’, ‘망대들이 무너질 때’라는 심판 이미지를 따로 설명하지 않고 함께 유지했습니다.
  alternative_readings:
  - 심판 이후의 회복을 중심으로 읽기
  - 심판 한복판의 공급으로 읽기
  rationale: 히브리어 본문은 풍요와 파괴를 병치할 뿐, 둘의 관계를 명시적으로 해설하지 않습니다. 번역은 그 긴장을 보존해야 하므로, 신학적 종합을 앞서 넣지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
