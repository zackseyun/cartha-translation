  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
  footnotes:
  - marker: a
    text: Or 'watercourses' for 'channels of water.' The Hebrew term is relatively rare, and the exact nuance may be 'rivulets' or 'brooks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 모든 높은 산과 모든 솟은 언덕 위에는 물줄기[a]와 물의 골짜기들이 있을 것입니다. 큰 살육의 날, 망대들이 무너질 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물도랑들’로 옮길 수 있습니다. 히브리어 용어는 비교적 희귀하여, 정확한 뉘앙스는 ‘물줄기들’이나 ‘시내들’에 가까울 수 있습니다.
    reason: lexical_alternative
