  rationale: 산과 언덕 위에 흐르는 물의 분지를 가리키는 뜻을 살려, 자연스럽고 이미지가 살아 있는 ‘물줄기’를 택했습니다.
- source_word: יִבְלֵי מָיִם
  english_pob_choice: channels of water
  chosen_korean: 물의 골짜기들
