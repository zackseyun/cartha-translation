  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''weeping, you will not weep''—an emphatic construction meaning ''you will surely not weep'' or ''you will weep no more.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''being gracious, he will be gracious to you''—an emphatic construction stressing the certainty of the LORD''s favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 백성아, 예루살렘에 사는 너는 다시는 울지 않을 것입니다.[a] 네 부르짖는 소리에 그분은 반드시 네게 은혜를 베푸실 것입니다.[b] 그분이 그것을 들으시면 네게 응답하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘울며, 너는 울지 않을 것이다’라는 강조 표현으로, ‘반드시 울지 않을 것이다’ 또는 ‘다시는 울지 않을 것이다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘은혜를 베풀며, 그가 네게 은혜를 베풀 것이다’라는 강조 표현으로, 그분의 호의가 확실함을 나타냅니다.
    reason: lexical_alternative
