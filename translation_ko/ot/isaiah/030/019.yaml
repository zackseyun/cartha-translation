  lexicon: HALOT
  rationale: 히브리어의 강조적 부정(부정과 강조형)을 한국어에서는 관용적으로 ‘다시는 ... 않을 것입니다’로 옮겨 확정성과 반복 중단을 함께 드러냈습니다.
- source_word: חָנוֹן יָחְנְךָ
