  - 당신의 울부짖는 소리를
  lexicon: HALOT
  rationale: ‘소리’라는 청각 이미지를 유지하면서 זעק의 강한 호소를 ‘부르짖다’로 옮겼습니다.
theological_decisions:
- issue: 문맥상 주어의 명시
  chosen_reading: 후반부의 ‘그는’은 문맥상 야훼를 가리키는 주어로 분명히 드러내고, 한국어에서는 문장 흐름상 명시했습니다.
  alternative_readings:
  - 주어를 생략해 더 암시적으로 처리
  - ‘주님’으로 명시
  rationale: 히브리어는 주어를 동사 형태로 암시하지만, 한국어는 주어 명시가 자연스러워 이해를 돕기 위해 인칭대명사로 받았습니다. ‘주님’은 본문에 없는 해석어를 더하는 느낌이 있어 피했습니다.
  doctrine_reference: 하나님의 인격적 응답성과 언약적 긍휼
