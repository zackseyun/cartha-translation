base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''weeping, you will not weep''—an emphatic construction meaning ''you will surely not weep'' or ''you will weep no more.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''being gracious, he will be gracious to you''—an emphatic construction stressing the certainty of the LORD''s favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 시온에 한 백성이 예루살렘에 거주할 것이며, 당신은 다시는 울지 않을 것입니다. 그는 당신에게 은혜를 베푸실 것이며, 당신의 부르짖는 소리를 들으시면 당신에게 응답하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘울다, 너는 울지 않을 것이다’라는 강조적 구성으로, ‘반드시 울지 않다’ 또는 ‘더는 울지 않다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘은혜를 베풀다, 그가 너에게 은혜를 베풀 것이다’라는 강조적 구성으로, 야훼의 호의가 확실함을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 백성
  - 한 민족
  lexicon: HALOT
  rationale: 집합 명사로서의 감각을 살리면서도, 특정 공동체를 가리키는 문맥을 반영해 ‘한 백성’으로 옮겼습니다.
- source_word: יֵשֵׁב
  english_pob_choice: will dwell
  chosen_korean: 거주할
  alternatives_korean:
  - 살
  - 거할
  lexicon: HALOT
  rationale: 정착·거주의 의미를 분명히 하되 현대 한국어에서 자연스럽게 읽히도록 ‘거주할’로 처리했습니다.
- source_word: בָּכוֹ לֹא תִבְכֶּה
  english_pob_choice: you will surely weep no more
  chosen_korean: 다시는 울지 않을 것입니다
  alternatives_korean:
  - 반드시 울지 않을 것입니다
  - 울고 또 울지는 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 부정(부정과 강조형)을 한국어에서는 관용적으로 ‘다시는 ... 않을 것입니다’로 옮겨 확정성과 반복 중단을 함께 드러냈습니다.
- source_word: חָנוֹן יָחְנְךָ
  english_pob_choice: He will surely be gracious to you
  chosen_korean: 은혜를 베푸실 것이며
  alternatives_korean:
  - 은혜를 베풀어 주실 것이며
  - 긍휼을 베푸실 것이며
  lexicon: HALOT
  rationale: חנן의 핵심 의미를 ‘은혜를 베풀다’로 살렸고, POB의 신학적 어조를 따라 하나님의 호의를 분명히 했습니다.
- source_word: לְקוֹל זַעֲקֶךָ
  english_pob_choice: at the sound of your cry
  chosen_korean: 당신의 부르짖는 소리를
  alternatives_korean:
  - 당신의 외침 소리를
  - 당신의 울부짖는 소리를
  lexicon: HALOT
  rationale: ‘소리’라는 청각 이미지를 유지하면서 זעק의 강한 호소를 ‘부르짖다’로 옮겼습니다.
theological_decisions:
- issue: 문맥상 주어의 명시
  chosen_reading: 후반부의 ‘그는’은 문맥상 야훼를 가리키는 주어로 분명히 드러내고, 한국어에서는 문장 흐름상 명시했습니다.
  alternative_readings:
  - 주어를 생략해 더 암시적으로 처리
  - ‘주님’으로 명시
  rationale: 히브리어는 주어를 동사 형태로 암시하지만, 한국어는 주어 명시가 자연스러워 이해를 돕기 위해 인칭대명사로 받았습니다. ‘주님’은 본문에 없는 해석어를 더하는 느낌이 있어 피했습니다.
  doctrine_reference: 하나님의 인격적 응답성과 언약적 긍휼
