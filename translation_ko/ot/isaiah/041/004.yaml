revisions:
- from: 누가 이렇게 행하고 이루었습니까? 처음부터 세대를 부르신 분은 누구입니까? 나 야훼가 처음이며, 마지막들과 함께 있는 이가 바로 나입니다.[a]
  to: 누가 이 일을 행하고 이루었으며, 처음부터 세대들을 부르셨습니까? 나 야훼는 처음이며, 마지막 이들과 함께 있는 이도 나입니다.[a]
  rationale: 분사 ‘부르시는/부르셨으며’를 앞선 ‘누가’에 연결하여 원문의 단일 질문 구조를 회복했습니다. ‘세대들을’로 복수와 연속성을 반영했으며, אַחֲרֹנִים는 해석을 과도하게 특정하지 않고 ‘마지막 이들’로 옮겼습니다. 마지막 절은 원문의 생략된 ‘있다’를 한국어상 최소한으로 보충하고 자기 동일시의 강조를 유지했습니다.
