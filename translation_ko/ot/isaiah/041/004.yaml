id: ISA.41.4
reference: Isaiah 41:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
  footnotes:
  - marker: a
    text: Or, 'and with the last, I am he,' traditionally understood as affirming that the LORD is present from the first generation to the last.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 이렇게 행하고 이루었습니까? 처음부터 세대를 부르신 분은 누구입니까? 나 야훼가 처음이며, 마지막들과 함께 있는 이가 바로 나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막들과 함께, 나는 그다’로도 옮길 수 있습니다. 전통적으로는 여호와께서 첫 세대부터 마지막 세대까지 함께 계신다는 뜻으로 이해해 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי פָעַל וְעָשָׂה
  english_pob_choice: Who has acted and done this
  chosen_korean: 누가 이렇게 행하고 이루었습니까?
  alternatives_korean:
  - 누가 이렇게 행하고 이루어 냈습니까?
  - 누가 이렇게 행하고 만들었습니까?
  lexicon: HALOT
  rationale: 수사 의문문으로서 원문의 행위·성취의 중첩을 살리되, ‘이렇게’로 문맥상 지시된 사건을 자연스럽게 보완했습니다.
- source_word: קֹרֵא הַדֹּרוֹת מֵרֹאשׁ
  english_pob_choice: calling the generations from the beginning
  chosen_korean: 처음부터 세대를 부르신 분은 누구입니까?
  alternatives_korean:
  - 처음부터 세대들을 부르시는 분은 누구입니까?
  - 시초부터 세대들을 부르신 분은 누구입니까?
  lexicon: HALOT
  rationale: 현재분사적 성격을 한국어에서 자연스러운 관형절로 옮겼고, ‘세대’를 통해 דּוֹרוֹת의 역사적 연속성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 여호와 대신 학술적 음역인 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: וְאֶת אַחֲרֹנִים
  english_pob_choice: and with the last ones
  chosen_korean: 마지막들과 함께 있는
  alternatives_korean:
  - 마지막들과 함께
  - 마지막 자들과 함께 있는
  lexicon: HALOT
  rationale: 문자적으로 ‘with’를 살려 하나님이 마지막 세대들 가운데/곁에 계신다는 의미를 유지했고, 복수형 ‘마지막들’을 반영했습니다.
- source_word: אֲנִי הוּא
  english_pob_choice: I am he
  chosen_korean: 이 바로 나입니다
  alternatives_korean:
  - 내가 그입니다
  - 나는 그입니다
  lexicon: HALOT
  rationale: 히브리어의 짧고 강한 자기 동일시를 한국어에서 매끄럽게 전달하되, 신학적 무게를 해치지 않도록 직역식보다 자연스러운 종결을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 표기합니다.
  alternative_readings:
  - ‘여호와’로 표기함
  - ‘주님’으로 치환함
  rationale: 본문이 고유명사를 직접 사용하므로, 칭호로 바꾸지 않고 하나님의 언약적 이름을 드러내는 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וְאֶת אַחֲרֹנִים의 관계를 어떻게 보일지
  chosen_reading: ‘마지막들과 함께 있는’으로 옮겨, 하나님이 역사의 마지막 세대들에도 함께 계신다는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘마지막이다’로 이해함
  - ‘마지막 세대와 함께’로 단순화함
  rationale: 히브리어의 축약된 표현을 지나치게 확대하지 않으면서, POB가 지적한 역사적 연속성과 동행의 의미를 보존했습니다.
  doctrine_reference: POB audit trail on וְאֶת אַחֲרֹנִים
