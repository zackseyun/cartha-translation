translation:
  language: ko
  text: 그는 그들을 추격하고 무사히 지나갑니다[a]. 그의 발이 밟지 않은 길로 나아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 그들을 추격하며 평안 가운데 지나가고, 그의 발이 밟지 않은 길로 나아간다.’ 히브리어의 마지막 절은 어렵습니다. 이는 안전한 전진을 강조할 수도 있고, 아직 밟지 않은 길을 따라 나아감을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  english_pob_choice: He pursues them
  chosen_korean: 그가 그들을 추격하여
  alternatives_korean:
  - 그가 그들을 쫓아
  - 그가 그들을 뒤쫓아
  lexicon: HALOT
  rationale: רדף의 기본 뜻은 ‘뒤쫓다, 추격하다’이므로, 전투적·적대적 맥락을 분명히 드러내는 ‘추격하다’를 택했습니다.
- source_word: יַעֲבוֹר שָׁלוֹם
  english_pob_choice: and passes on safely
  chosen_korean: 평안히 지나가며
  alternatives_korean:
  - 평안하게 지나가며
  - 평화롭게 지나가며
  - 무사히 지나가며
  lexicon: HALOT
  rationale: עבר는 여기서 ‘지나가다/전진하다’의 의미이고, שָׁלוֹם은 단순한 ‘평화’보다 방해 없이 안전하게 진행하는 상태를 나타내므로 ‘평안히’로 옮겼습니다.
- source_word: אֹרַח בְּרַגְלָיו
  english_pob_choice: by a path his feet had not traveled
  chosen_korean: 자기 발로는 밟아 보지 않은 길
  alternatives_korean:
  - 자기 발이 아직 가지 않은 길
  - 그의 발이 밟지 않은 길
  lexicon: HALOT
  rationale: אֹרַח은 구체적인 ‘길/샛길’의 이미지가 있고, בְּרַגְלָיו לֹא יָבוֹא의 압축된 표현은 ‘발로 밟아 보지 않은’으로 풀어야 자연스럽고도 본문 이미지를 살릴 수 있습니다.
- source_word: לֹא יָבוֹא
  english_pob_choice: had not traveled
  chosen_korean: 밟아 보지 않은
  alternatives_korean:
  - 가 보지 않은
  - 들어가 보지 않은
  lexicon: HALOT
  rationale: 직역하면 ‘오지 않았다’이지만, 앞의 ‘길’과 연결하면 ‘그 길을 아직 밟아 보지 않았다’는 뜻이 가장 분명하게 드러납니다.
theological_decisions:
- issue: 마지막 절의 압축된 표현 אָרַח בְּרַגְלָיו לֹא יָבוֹא의 의미
  chosen_reading: 정복자가 이전에 자기 발로 밟지 않은 길을 따라 진격하는 장면으로 이해했습니다.
  alternative_readings:
  - 그의 발이 닿지 않는 길로 간다
  - 자기 발로는 가지 않은 길을 지난다
  rationale: 히브리어는 매우 압축적이지만, 문맥상 ‘이전에 가 보지 않은/밟지 않은 길’이라는 미지의 진격·예상 밖의 전진을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥주의 해석
