    rationale: וְנָשִׂימָה와 וְנֵדְעָה는 ‘우리가 마음을 두고 알게 되도록/그러면 우리가 … 알겠다’라는 화자의 반응을 나타냅니다. 번역은 우상들이 직접 지식을 주는 것처럼 만들지 않아야 합니다.
  - severity: medium
    issue: 각주 c의 대안이 부정확하고 실질적인 어휘 대안이 아닙니다.
    rationale: אַחֲרִיתָן의 대안은 ‘그 끝’이어야 하며, 영어 POB 감사 기록의 ‘know their end’와도 일치합니다.
