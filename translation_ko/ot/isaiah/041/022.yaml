revisions:
- from: 그것들을 앞으로 내세우고 우리에게 어떤 일들이 일어날지 말해 보십시오[a]. 이전의 일들—그것들이 무엇인지—우리로 하여금 그것들에 마음을 두게 하고, 그것들의 결과를 알게 하십시오[b][c]; 아니면 앞으로 올 일들을 우리에게 알려 주십시오.
  to: 그것들을 앞으로 내세우고 우리에게 앞으로 일어날 일들을 알려 주십시오[a]. 이전의 일들이 무엇인지 알려 주십시오. 그러면 우리가 그것들을 마음에 두고[b] 그 결말을 알겠습니다[c]. 아니면 앞으로 올 일들을 우리에게 들려주십시오.
  rationale: 명령의 대상인 우상들에게 이전 일과 장래 일을 알리라고 요구하는 법정적 수사와, 그 고지가 이루어질 경우 화자들이 숙고하여 그 귀결을 알게 된다는 히브리어의 논리적 관계를 구분했습니다. 또한 각주 c를 원문의 어휘적 대안으로 바로잡고, 각주 표지를 해당 낱말에 붙였습니다.
