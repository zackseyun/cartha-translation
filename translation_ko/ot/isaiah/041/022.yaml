  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
  footnotes:
  - marker: a
    text: Or 'Let them present them and declare to us what will occur.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'set our heart'; the idiom means to apply careful attention or consideration.
    reason: cultural_note
  - marker: c
    text: Or 'know their end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 앞으로 내세우고 우리에게 앞으로 일어날 일들을 알려 주십시오[a]. 이전의 일들이 무엇인지 알려 주십시오. 그러면 우리가 그것들을 마음에 두고[b] 그 결말을 알겠습니다[c]. 아니면 앞으로 올 일들을 우리에게 들려주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 내세우고 우리에게 일어날 일을 선언하십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘마음을 두다’는 어떤 일을 주의 깊게 살피고 숙고한다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그 끝을 알겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּ֨ישׁוּ֙
  english_pob_choice: Let them bring them forward
  chosen_korean: 그것들을 앞으로 내세우고
  alternatives_korean:
  - 그것들을 내놓고
  - 그것들을 가까이 가져오게 하고
  lexicon: HALOT
  rationale: 심판 법정의 소환 장면이므로 단순한 ‘가져오다’보다 ‘앞으로 내세우다’가 대면 심문의 뉘앙스를 더 잘 살립니다.
- source_word: וְיַגִּ֣ידוּ לָ֔נוּ
  english_pob_choice: and tell us
  chosen_korean: 우리에게 ... 말해 보십시오
  alternatives_korean:
  - 우리에게 ... 알려 주십시오
  - 우리에게 ... 선언하십시오
  lexicon: HALOT
  rationale: נגד의 기본 의미를 살리되 현대 한국어에서 자연스럽고 재판적 도전 어조를 유지하기 위해 ‘말해 보십시오’로 옮겼습니다.
- source_word: הָרִאשֹׁנ֣וֹת
  english_pob_choice: the former things
  chosen_korean: 이전의 일들
  alternatives_korean:
  - 먼저 있었던 일들
  - 옛일들
  lexicon: HALOT
  rationale: 이사야서의 대비 구조에서 ‘the former things’는 앞선 역사적 사건들을 가리키므로, 문맥상 가장 분명한 ‘이전의 일들’을 선택했습니다.
- source_word: וְנָשִׂ֤ימָה לִבֵּ֨/נוּ֙
  english_pob_choice: that we may set our heart on them
  chosen_korean: 우리로 하여금 그것들에 마음을 두게 하고
  alternatives_korean:
  - 우리 마음을 그것들에 두게 하고
  - 우리가 그것들에 주목하게 하고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음을 두다’는 단순한 주의 환기보다 신중한 숙고를 뜻하므로, 직역성을 살리면서도 자연스러운 한국어로 표현했습니다.
- source_word: אַחֲרִיתָ֔/ן
  english_pob_choice: know their outcome
  chosen_korean: 그것들의 결과를 알게 하십시오
  alternatives_korean:
  - 그것들의 끝을 알게 하십시오
  - 그것들의 결말을 알게 하십시오
  lexicon: HALOT
  rationale: אַחֲרִית은 ‘끝’도 가능하지만 여기서는 사건의 귀결을 묻는 맥락이므로 ‘결과’가 가장 분명합니다.
theological_decisions:
