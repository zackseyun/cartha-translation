source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
  footnotes:
  - marker: a
    text: Or 'high places,' 'barren hills' for 'bare heights.'
    reason: lexical_alternative
  - marker: b
    text: Or 'springs of water' for 'sources of water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 헐벗은 산등성이들[a]에 강물이 흐르게 하고, 골짜기들 한가운데에 샘들을 내겠습니다. 내가 광야를 물이 고인 못으로 바꾸고, 마른 땅을 물이 솟아나는 곳들[b]로 바꾸겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헐벗은 산등성이들’은 ‘높은 곳들’, ‘메마른 언덕들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물이 솟아나는 곳들’은 ‘물의 근원들’, ‘샘물이 나는 곳들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  english_pob_choice: I will open
  chosen_korean: 내가 … 열고
  alternatives_korean:
  - 내가 … 열겠습니다
  - 내가 … 열어 놓겠습니다
  lexicon: HALOT
  rationale: פתח의 기본 뜻을 따라 ‘열다’로 옮기되, 히브리어 1인칭 미래 약속을 한국어 평서형으로 자연스럽게 살렸습니다.
- source_word: שְׁפָיִים
  english_pob_choice: bare heights
  chosen_korean: 헐벗은 높은 곳들
  alternatives_korean:
  - 빈 산등성이들
  - 벌거벗은 높은 곳들
  - 메마른 언덕들
  lexicon: HALOT
  rationale: 노출되고 초목이 없는 고지를 가리키는 뉘앙스를 살려, ‘높은 곳’의 지형성과 ‘헐벗은’의 황량함을 함께 반영했습니다.
- source_word: לַאֲגַם מַיִם
  english_pob_choice: into a pool of water
  chosen_korean: 물이 고인 못으로
  alternatives_korean:
  - 물웅덩이로
  - 호수로
  - 물의 못으로
  lexicon: HALOT
  rationale: 아גם은 모여 고인 물을 가리키므로, 한국어로는 자연스럽고 중립적인 ‘못’이 가장 가깝습니다. ‘물이 고인’으로 상태를 보강했습니다.
- source_word: לְמוֹצָאֵי מָיִם
  english_pob_choice: into sources of water
  chosen_korean: 물이 솟는 곳으로
  alternatives_korean:
  - 물의 근원으로
  - 샘물이 나는 곳으로
  - 물 나오는 곳으로
  lexicon: HALOT
  rationale: מוֹצָא는 ‘나오는 곳, 출구’의 뜻이 있어, 단순히 명사화한 ‘근원’보다 물이 실제로 솟아나는 장면을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 지리적 회복의 약속을 비유로 완화할지 여부
  chosen_reading: 본문의 구체적 물 풍성화 이미지를 그대로 살리고, 별도의 영적 알레고리로 번역문 안에서 풀지 않았습니다.
  alternative_readings:
  - 주로 영적 부흥의 비유로 옮기기
  - 종말론적 새 창조 상징으로 풀어 옮기기
  rationale: 히브리어는 야훼의 직접적 약속으로 황무지와 마른 땅에 물을 내시는 장면을 제시하므로, 번역은 그 감각적·물질적 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 번역은 해석을 과도하게 확정하지 않고 긴장을 보존해야 합니다.
