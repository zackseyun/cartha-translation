  source_fidelity: 히브리어의 1인칭 약속, 고지와 골짜기의 대조, 광야와 메마른 땅에 물이 풍성해지는 변환 이미지는 대체로 충실히 반영되었습니다. 다만 ‘강들을 열고’는 한국어에서 다소 직역투이므로 ‘강물이 흐르게 하고’로 자연스럽게 풀되, פתח의 사역적 결과를 유지하는 편이 좋습니다. לְמוֹצָאֵי מָיִם의 복수도 ‘곳들’로 드러내는 것이 적절합니다.
  naturalness: 합쇼체의 약속 어조는 적절합니다. ‘헐벗은 높은 곳들’보다 ‘헐벗은 산등성이들’이 지형을 가리키면서도 현대 한국어에서 더 자연스럽습니다. 또한 각주 표지는 해당 어휘 바로 뒤에 두어야 독자가 각주의 대상을 분명히 알 수 있습니다.
  terminology: ‘광야’, ‘못’, ‘샘’은 문맥과 한국어 성서 문체에 잘 맞습니다. מַעְיָנוֹת(샘)와 מוֹצָאֵי מָיִם(물이 솟아나는 곳들)의 어휘적 차이도 유지했습니다. 본문은 구체적인 물의 이미지를 보존하며 이를 영적으로 알레고리화하지 않습니다.
