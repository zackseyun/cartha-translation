id: ISA.41.10
reference: Isaiah 41:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
  footnotes:
  - marker: a
    text: Or, 'do not be dismayed'; the Hebrew verb likely carries the sense of looking about anxiously or in alarm.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''with the right hand of my righteousness.'''
    reason: alternative_reading
translation:
  language: ko
  text: 두려워하지 마십시오. 내가 당신과 함께 있습니다. 두려워하며 둘러보지 마십시오. 나는 당신의 하나님입니다. 내가 당신을 강하게 하겠습니다. 참으로 내가 당신을 도와주겠습니다. 참으로 내가 나의 의로운 오른손으로 당신을 붙들겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낙심하지 마십시오’; 히브리어 동사는 불안이나 놀람 속에서 둘러보는 뜻을 띨 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘나의 의의 오른손으로’.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: HALOT
  rationale: 히브리어 금지 명령의 직접성과 긴박감을 살리기 위해 가장 표준적인 부정 명령으로 옮겼습니다.
- source_word: אַל תִּשְׁתָּע
  english_pob_choice: do not look around in dread
  chosen_korean: 두려워하며 둘러보지 마십시오
  alternatives_korean:
  - 당황하여 둘러보지 마십시오
  - 불안해하며 주위를 두리번거리지 마십시오
  - 낙심하지 마십시오
  lexicon: HALOT
  rationale: 이 동사는 전통적 ‘낙심하다’보다 불안 속에서 둘러보는 구체적 이미지가 있어, 그 긴장감을 한국어로 드러냈습니다.
- source_word: אִמַּצְתִּיךָ / עֲזַרְתִּיךָ / תְּמַכְתִּיךָ
  english_pob_choice: I will strengthen you; surely I will help you; surely I will uphold you
  chosen_korean: 내가 당신을 강하게 하겠습니다. 참으로 내가 당신을 도와주겠습니다. 참으로 내가 당신을 붙들겠습니다.
  alternatives_korean:
  - 내가 당신을 굳세게 하겠습니다
  - 내가 당신을 돕겠습니다
  - 내가 당신을 떠받치겠습니다
  - 내가 당신을 지탱하겠습니다
  lexicon: HALOT
  rationale: 세 동사를 약화시키지 않고 각각 강하게 하다, 돕다, 붙들다로 구분해 반복되는 확언의 누적 효과를 살렸습니다.
- source_word: בִּימִין צִדְקִי
  english_pob_choice: with my righteous right hand
  chosen_korean: 나의 의로운 오른손으로
  alternatives_korean:
  - 나의 의로운 오른손으로
  - 나의 의의 오른손으로
  - 나의 오른손, 곧 의로우신 손으로
  lexicon: HALOT
  rationale: 히브리어의 결합구문을 한국어로 자연스럽게 풀되, ‘right hand’의 도구적 의미를 살리기 위해 ‘-으로’로 옮겼습니다.
theological_decisions:
- issue: ‘righteous right hand’의 신학적 함의
  chosen_reading: 하나님의 구원 행위가 의와 신실함에 따라 이루어진다는 뜻으로, ‘나의 의로운 오른손’이라고 옮겼습니다.
  alternative_readings:
  - 나의 의의 오른손
  - 나의 의로우신 오른손
  rationale: 원문은 추상명사형으로도 읽을 수 있지만, 시적 병행과 한국어 자연성을 고려해 하나님의 손이 의로운 성격을 지닌다는 뜻을 보존했습니다. 지나친 설명은 덧붙이지 않았습니다.
  doctrine_reference: Isaiah 41:10; Translation philosophy §§1, 3, 6
- issue: 여호와 명칭 처리
  chosen_reading: 본문의 אֱלֹהֶיךָ는 그대로 ‘당신의 하나님’으로 옮기고, 야훼를 본문에 추가하지 않았습니다.
  alternative_readings:
  - 당신의 야훼
  - 당신의 하나님 야훼
  rationale: 이 절은 직접적인 אֱלֹהִים 용례이므로, 주어진 히브리어 표면형에 충실하게 ‘하나님’으로 유지했습니다.
  doctrine_reference: POB glossary; source-text fidelity
