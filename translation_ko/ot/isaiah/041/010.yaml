  - 나의 의의 오른손으로
  - 나의 오른손, 곧 의로우신 손으로
  lexicon: HALOT
  rationale: 히브리어의 결합구문을 한국어로 자연스럽게 풀되, ‘right hand’의 도구적 의미를 살리기 위해 ‘-으로’로 옮겼습니다.
theological_decisions:
- issue: ‘righteous right hand’의 신학적 함의
  chosen_reading: 하나님의 구원 행위가 의와 신실함에 따라 이루어진다는 뜻으로, ‘나의 의로운 오른손’이라고 옮겼습니다.
  alternative_readings:
  - 나의 의의 오른손
  - 나의 의로우신 오른손
  rationale: 원문은 추상명사형으로도 읽을 수 있지만, 시적 병행과 한국어 자연성을 고려해 하나님의 손이 의로운 성격을 지닌다는 뜻을 보존했습니다. 지나친 설명은 덧붙이지 않았습니다.
  doctrine_reference: Isaiah 41:10; Translation philosophy §§1, 3, 6
- issue: 여호와 명칭 처리
  chosen_reading: 본문의 אֱלֹהֶיךָ는 그대로 ‘당신의 하나님’으로 옮기고, 야훼를 본문에 추가하지 않았습니다.
  alternative_readings:
  - 당신의 야훼
  - 당신의 하나님 야훼
  rationale: 이 절은 직접적인 אֱלֹהִים 용례이므로, 주어진 히브리어 표면형에 충실하게 ‘하나님’으로 유지했습니다.
  doctrine_reference: POB glossary; source-text fidelity
