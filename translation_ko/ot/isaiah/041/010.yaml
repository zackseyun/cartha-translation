  lexicon: HALOT
  rationale: 이 동사는 전통적 ‘낙심하다’보다 불안 속에서 둘러보는 구체적 이미지가 있어, 그 긴장감을 한국어로 드러냈습니다.
- source_word: אִמַּצְתִּיךָ / עֲזַרְתִּיךָ / תְּמַכְתִּיךָ
  english_pob_choice: I will strengthen you; surely I will help you; surely I will uphold you
  chosen_korean: 내가 당신을 강하게 하겠습니다. 참으로 내가 당신을 도와주겠습니다. 참으로 내가 당신을 붙들겠습니다.
  alternatives_korean:
  - 내가 당신을 굳세게 하겠습니다
  - 내가 당신을 돕겠습니다
  - 내가 당신을 떠받치겠습니다
  - 내가 당신을 지탱하겠습니다
  lexicon: HALOT
  rationale: 세 동사를 약화시키지 않고 각각 강하게 하다, 돕다, 붙들다로 구분해 반복되는 확언의 누적 효과를 살렸습니다.
- source_word: בִּימִין צִדְקִי
  english_pob_choice: with my righteous right hand
  chosen_korean: 나의 의로운 오른손으로
  alternatives_korean:
