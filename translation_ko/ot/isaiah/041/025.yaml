  source_fidelity: 개정이 필요합니다. 초안은 첫 두 절의 방향과 ‘내 이름을 부르다’라는 기본 뜻을 대체로 보존하지만, ‘내 이름을 부르며’를 뒤의 행동에 종속시켜 원문의 독립된 절을 흐리게 합니다. 또한 ‘통치자들 위로는 진흙 위를 밟듯이 다가오고’는 통치자들을 진흙에 비유하는 원문의 비교를 어색하게 바꾸고, ‘다가오다’와 ‘밟다’의 관계도 불명확하게 만듭니다.
  naturalness: ‘통치자들 위로는 진흙 위를 밟듯이 다가오고’는 현대 표준 한국어에서 수식 관계가 부자연스럽습니다. 각 절을 분리하고, 원문의 두 비유를 평행하게 제시하면 합쇼체 문체에서도 더 명료하고 자연스럽습니다.
  terminology: ‘일으키다’, ‘통치자들’, ‘토기장이’는 적절합니다. ‘내 이름을 부르다’는 원문의 해석상 긴장을 유지하는 표현입니다. 다만 각주 a는 ‘해 뜨는 곳’과 ‘동쪽’의 문자적 관계를 반대로 설명하므로 바로잡아야 하며, ‘호출하다’는 이 문맥의 자연스러운 대안이 아닙니다.
  issues:
