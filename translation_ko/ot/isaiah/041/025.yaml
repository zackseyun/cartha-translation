    issue: ‘내 이름을 부르며’가 뒤 절에 종속되어 있음
    rationale: יִקְרָא בִשְׁמִי는 독립된 동사절입니다. 연결형 ‘부르며’는 그가 이름을 부르는 방식으로 통치자들에게 다가온다는 관계를 암시하므로, 독립 문장으로 옮기는 편이 안전합니다.
