id: ISA.41.25
reference: Isaiah 41:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
  footnotes:
  - marker: a
    text: Or, 'from the east' (literally, 'from the rising of the sun').
    reason: lexical_alternative
  - marker: b
    text: '''Calls on my name'' may also be rendered ''invokes my name'' or ''proclaims my name.'''
    reason: lexical_alternative
  - marker: c
    text: The figure stirred up by God is often understood to be Cyrus; the Hebrew text here does not name him.
    reason: cross_reference
translation:
  language: ko
  text: 나는 북쪽에서 한 사람을 일으켰고, 그가 왔습니다. 해 뜨는 곳에서 그는 내 이름을 부릅니다[a][b]. 그는 통치자들을 진흙처럼 짓밟으며, 토기장이처럼 진흙을 밟을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해 뜨는 곳’은 문자적으로 ‘해가 뜨는 곳’이라는 뜻이며, ‘동쪽’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름을 부릅니다’는 ‘내 이름을 부르짖습니다’, ‘내 이름을 불러 의지합니다’, 또는 ‘내 이름을 선포합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירוֹתִי
  english_pob_choice: I have stirred up
  chosen_korean: 나는 … 일으켰고
  alternatives_korean:
  - 나는 … stirred up
  - 나는 … 흔들어 깨웠고
  lexicon: HALOT
  rationale: 히필형 עור는 여기서 하나님이 어떤 인물을 행동하도록 일으키셨다는 뜻이므로, ‘일으키다’로 옮겨 주도적 행위를 살렸습니다.
- source_word: מִצָּפוֹן / מִמִּזְרַח שֶׁמֶשׁ
  english_pob_choice: from the north / from the rising of the sun
  chosen_korean: 북쪽에서 / 해 뜨는 곳에서
  alternatives_korean:
  - 북에서 / 동쪽에서
  - 해 뜨는 곳으로부터
  lexicon: HALOT
  rationale: 방향 표현을 자연스러운 현대 한국어로 옮기되, ‘해 뜨는 곳’으로 원문의 비유적 이미지를 유지했습니다.
- source_word: יִקְרָא בִשְׁמִי
  english_pob_choice: he calls on my name
  chosen_korean: 그는 내 이름을 부르며
  alternatives_korean:
  - 그는 내 이름을 부르고
  - 그는 내 이름을 부르짖으며
  lexicon: HALOT
  rationale: קרא בשם은 단순 호명보다 ‘이름을 부르다/부르짖다’의 관용적 의미가 있어, 본문이 허용하는 범위 안에서 ‘내 이름을 부르며’로 처리했습니다.
- source_word: סְגָנִים כְּמוֹ חֹמֶר ... יִרְמָס טִיט
  english_pob_choice: He will come upon rulers as upon clay ... like a potter he treads mud
  chosen_korean: 통치자들 위로는 진흙 위를 밟듯이 다가오고, 토기장이처럼 진흙을 짓밟을 것입니다
  alternatives_korean:
  - 통치자들을 진흙처럼 짓밟고, 토기장이처럼 진흙을 밟을 것입니다
  - 통치자들 위로는 점토처럼 다가와 토기장이처럼 진흙을 밟을 것입니다
  lexicon: HALOT
  rationale: ‘սְגָנִים’은 통치 계층의 권력자를 가리키므로 ‘통치자들’로 옮겼고, ‘클레이/머드’의 대비를 살려 앞은 ‘진흙 위를 밟듯이’, 뒤는 ‘진흙을 짓밟을’로 시각적 강도를 유지했습니다.
theological_decisions:
- issue: 해 뜨는 곳의 인물과 그 경건성의 범위
  chosen_reading: 이름을 ‘부른다’는 표현은 남기되, 그 행위가 적극적 예배인지 단순한 호명인지 단정하지 않았습니다.
  alternative_readings:
  - ‘내 이름을 선포한다’로 더 약하게 옮김
  - ‘내 이름을 불러 의지한다’로 더 경건하게 옮김
  rationale: 원문은 인물의 정체를 명시하지도, 그 경건성을 설명하지도 않으므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
