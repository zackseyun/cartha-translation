    rationale: כְּמוֹ חֹמֶר는 통치자들을 상대하는 방식의 비교이며, 초안의 ‘통치자들 위로는 진흙 위를 밟듯이’는 통치자들 위에 진흙이 있다는 뜻처럼 읽힙니다. 통치자들을 진흙처럼 짓밟는 비유로 명료하게 옮깁니다.
