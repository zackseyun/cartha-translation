  to: 당신과 다투는 사람들은 찾아도 찾지 못할 것입니다.[a] 당신과 전쟁을 벌이는 사람들은 무(無)와 같이, 아무것도 아닌 것처럼 될 것입니다.[b]
  rationale: 원문의 두 문장 구조를 회복했습니다. 첫 문장은 다투는 이들을 찾아도 찾지 못한다는 진술로, 둘째 문장은 전쟁을 벌이는 이들이 ‘무와 같이’ 될 것이라는 비교 표현으로 옮겼습니다. ‘다툼’과 ‘전쟁’을 구별하고, אַיִן/אֶפֶס의 병행 및 두 비교 표지를 보존했습니다.
