  source_fidelity: 현 번역은 첫째 절의 ‘찾아도 찾지 못함’을 ‘사라지고’로 바꾸어 원문의 핵심 진술을 누락했고, כְ(‘~와 같이’)의 비교 표현도 ‘무가 되고 공허가 되고’로 약화·변경했습니다. 또한 ‘다툼의 사람들’과 ‘전쟁의 사람들’은 각각 원문의 두 병행 구절에 맞추어 유지하는 것이 좋습니다.
  naturalness: 수정안은 현대 표준어의 합쇼체를 유지하면서, 한국어 어순상 목적어 역할을 하는 ‘당신과 다투는 사람들’을 앞에 두어 자연스럽게 읽히게 합니다. ‘무(無)와 같이’는 시적·격식적 문맥에서 자연스럽고, 이어지는 ‘아무것도 아닌 것처럼’이 뜻을 분명히 합니다.
