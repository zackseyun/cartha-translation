source:
  edition: WLC
  text: תְּבַקְשֵׁ/ם֙ וְ/לֹ֣א תִמְצָאֵ֔/ם אַנְשֵׁ֖י מַצֻּתֶ֑/ךָ יִהְי֥וּ כְ/אַ֛יִן וּ/כְ/אֶ֖פֶס אַנְשֵׁ֥י מִלְחַמְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
  footnotes:
  - marker: a
    text: Or 'the men of your strife'; that is, those who contend or quarrel with you.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like nothing and like אפס'; the second term can also be rendered 'utter nothingness' or 'zero.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신과 다투는 사람들은 찾아도 찾지 못할 것입니다.[a] 당신과 전쟁을 벌이는 사람들은 무(無)와 같이, 아무것도 아닌 것처럼 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 다툼의 사람들’입니다. ‘당신과 다투는 사람들’ 또는 ‘당신과 분쟁하는 사람들’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘무와 같이’와 ‘아무것도 아닌 것과 같이’라는 병행 표현입니다. 둘째 말은 ‘전혀 없음’ 또는 ‘무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  english_pob_choice: You will seek them
  chosen_korean: 그들을 찾겠으나
  alternatives_korean:
  - 그들을 구하겠으나
  - 그들을 찾아보겠으나
  lexicon: WLC; HALOT בקש
  rationale: בקש는 ‘찾다/구하다’의 뜻이 있으나, 뒤의 ‘찾지 못하다’와 짝을 이루는 자연스러운 한국어로 ‘찾다’를 택했습니다.
- source_word: וְלֹא תִמְצָאֵם
  english_pob_choice: and not find them
  chosen_korean: 찾지 못하실 것입니다
  alternatives_korean:
  - 발견하지 못할 것입니다
  - 만나지 못할 것입니다
  lexicon: WLC; HALOT מצא
  rationale: מצא의 기본 의미인 ‘찾아내다/발견하다’를 살리면서, 예언적 단언의 어조에 맞게 미래형으로 옮겼습니다.
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  english_pob_choice: those men who contend with you
  chosen_korean: 당신과 다투는 그 사람들은
  alternatives_korean:
  - 당신과 다투는 그 남자들은
  - 당신의 다툼의 사람들은
  lexicon: WLC; HALOT מַצָּה/מַצּוּת
  rationale: אַנְשֵׁי …는 ‘…의 사람들’이라는 구문이지만, 한국어에서는 ‘당신과 다투는 사람들’로 풀어야 의미가 자연스럽고, 마צּוּת의 ‘다툼/분쟁’ 뜻도 드러납니다.
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  english_pob_choice: The men who wage war against you
  chosen_korean: 당신과 싸우는 사람들은
  alternatives_korean:
  - 당신을 상대로 전쟁하는 사람들은
  - 당신에게 전쟁을 거는 사람들은
  lexicon: WLC; HALOT מלחמה
  rationale: 직역하면 ‘당신의 전쟁의 사람들’이지만, 문맥상 적대 행위를 분명히 하는 ‘싸우는 사람들’이 가장 직접적입니다.
theological_decisions:
- issue: כְאַיִן / וּכְאֶפֶס의 비교 표지와 중복된 무(無) 표현
  chosen_reading: ‘무가 되고 공허가 될 것입니다’로 두 비교를 각각 살리되, 둘 다 실재성의 소멸을 강조하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘아무것도 아닌 것처럼 될 것입니다’로 단일화
  - ‘완전히 사라질 것입니다’로 의역
  rationale: 히브리어는 ‘같은 것처럼’이라는 비교와 ‘אַיִן / אֶפֶס’의 병행을 통해 적의 철저한 소멸을 강조합니다. 한국어에서도 그 중첩을 보존하되, 존재론적 주장으로 과도하게 확장하지 않도록 조심했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
