base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
  footnotes:
  - marker: a
    text: Hebrew formally reads 'I have helped you' or 'I helped you'; the perfect form here is rendered 'I will help you' to convey the promissory force in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 야훼, 당신의 하나님이기 때문입니다. 내가 당신의 오른손을 붙들고, 당신에게 말합니다. 「두려워하지 마십시오. 내가 당신을 도와주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 형식상 ‘내가 당신을 도왔습니다’ 또는 ‘내가 당신을 도와주었습니다’로도 읽을 수 있지만, 문맥에서는 약속의 힘을 드러내는 미래 표현이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 이유 제시의 접속을 한국어에서 가장 자연스럽고 문어적으로 살리기 위해 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 명칭을 관습적 대체어가 아니라 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: מַחֲזִיק יְמִינֶךָ
  english_pob_choice: who takes hold of your right hand
  chosen_korean: 내가 당신의 오른손을 붙들고
  alternatives_korean:
  - 당신의 오른손을 잡고
  - 당신의 오른손을 강하게 하며
  lexicon: HALOT
  rationale: חזק의 사역적 분사 이미지는 추상적 ‘강하게 하다’보다 실제로 손을 붙드는 구체적 장면이어서, 보호와 인도의 감각을 살려 ‘붙들고’로 옮겼습니다.
- source_word: עֲזַרְתִּיךָ
  english_pob_choice: I will help you
  chosen_korean: 내가 당신을 도와주겠습니다
  alternatives_korean:
  - 내가 당신을 돕겠습니다
  - 내가 당신을 도왔습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 여기서는 약속의 확실성을 띠므로, 한국어에서는 미래 약속으로 자연스럽게 전달하되, 단순한 완료처럼 들리지 않게 했습니다.
theological_decisions:
- issue: 야훼의 직접 발화에서 금지 명령의 공손도
  chosen_reading: 「두려워하지 마십시오」
  alternative_readings:
  - 「두려워하지 말라」
  - 「두려워하지 마세요」
  rationale: 예언적 위로의 직접 발화는 합쇼체가 기본이므로, 권면의 강도와 문어성을 함께 살리는 ‘마십시오’로 처리했습니다.
  doctrine_reference: POB Korean style guide — direct divine speech in modern formal-polite register
- issue: 히브리어 완료형 עֲזַרְתִּיךָ의 시제 처리
  chosen_reading: 미래 약속으로서 ‘도와주겠습니다’
  alternative_readings:
  - ‘도와줍니다’
  - ‘도와주었습니다’
  rationale: 문맥상 위로와 보증의 선언이므로, 완료형의 형식보다 약속의 효력을 드러내는 미래 표현이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: Hebrew perfect in promissory contexts
