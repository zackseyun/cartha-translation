id: ISA.41.20
reference: Isaiah 41:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
  footnotes:
  - marker: a
    text: Or 'and lay it to heart and gain insight together.' The Hebrew verbs can carry the nuances of inward consideration and gaining insight.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 야훼의 손이 이것을 행하셨고 이스라엘의 거룩하신 분이 그것을 창조하셨다는 것을 보며 알며, 마음에 두고 함께 깨닫게[a] 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 마음에 두고 통찰하게.’ 히브리어 동사들은 내적 숙고와 통찰의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 하려는 것입니다
  alternatives_korean:
  - 하도록
  - 그리하여
  lexicon: HALOT
  rationale: 목적/결과를 드러내는 표현으로, 현대 한국어에서 자연스럽고 다음 동사열을 이끄는 기능을 잘 살립니다.
- source_word: יִרְאוּ וְיֵדְעוּ
  english_pob_choice: they may see and know
  chosen_korean: 보며 알고
  alternatives_korean:
  - 보고 알게
  - 보고 인지하고
  lexicon: HALOT
  rationale: ראה/ידע의 기본 인식 동사를 간결하게 살리되, 한국어에서는 중복을 줄여도 점층적 인식 흐름이 유지되도록 했습니다.
- source_word: וְיָשִׂימוּ וְיַשְׂכִּילוּ
  english_pob_choice: and may consider and understand
  chosen_korean: 함께 살펴 이해하게
  alternatives_korean:
  - 마음에 두고 깨닫게
  - 살피고 지혜를 얻게
  lexicon: HALOT
  rationale: מָשִׂים의 ‘마음에 두다/헤아리다’와 שׂכל의 ‘이해하다/통찰하다’를 과장 없이 반영하여, ‘살펴 이해하다’로 인식의 심화 단계를 표현했습니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼께서 행하신 손
  - 주님의 손
  lexicon: HALOT
  rationale: ‘손’은 하나님의 행위와 능력을 가리키는 관용구이므로 직역을 유지했습니다. יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: 야훼의 ‘손’과 ‘행하였고/창조하셨습니다’의 병렬 유지
  chosen_reading: ‘야훼의 손이 이것을 행하였고, 이스라엘의 거룩하신 분이 그것을 창조하셨습니다’로 두 동사를 분리해 유지했습니다.
  alternative_readings:
  - ‘야훼께서 이것을 하셨고 창조하셨습니다’로 압축
  - ‘야훼의 손이 이것을 만들고 창조하셨습니다’로 합침
  rationale: 히브리어는 עשה와 ברא를 나란히 두어 행위와 창조를 함께 강조합니다. 이를 하나로 합치면 수사적 중첩이 약해지므로 구분을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy 1 and 5
- issue: 인지 동사열의 밀도 유지
  chosen_reading: 보며 알고, 함께 살펴 이해하게
  alternative_readings:
  - 보고 알고, 마음에 두고 깨닫게
  - 보아 알고, 함께 숙고하며 이해하게
  rationale: 이 절은 네 개의 인식 동사를 쌓아 하나님의 행위를 분명히 알게 하려는 목적을 드러냅니다. 한국어에서는 자연스러움을 위해 약간 압축하되, 인식의 진행과 공동성은 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
