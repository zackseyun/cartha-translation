review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 반복 부정, 그리고 צַדִּיק의 판정적 의미는 대체로 잘 반영되었습니다. 다만 히브리어의 2인칭 복수 접미사는 이 논쟁적 호칭에서 ‘당신들의’보다 ‘너희의’가 더 직접적이고 자연스럽습니다. 또한 צַדִּיק의 가능한 전통적 해석은 해당 어구에 각주로 제시하는 것이 적절합니다.
  naturalness: ‘처음부터 누가 그것을 알려서 우리가 알 수 있게 했으며’는 이해되지만, ‘알려 주어 … 할 수 있도록 하였으며’가 현대 표준 한국어에서 더 매끄럽고, 행위자와 결과의 관계도 더 분명합니다. ‘너희의 말’은 본문의 대결적 خطاب에 자연스럽습니다.
  terminology: ‘그가 옳다’는 이 문맥의 법정적·입증적 판단을 잘 전달합니다. 전통적으로 가능한 ‘그가 의롭다’는 본문에 강제하지 않고 각주로 보존합니다.
  issues:
  - severity: low
    issue: ‘당신들의 말’의 호칭 선택
    rationale: 성경의 논쟁적 خطاب에서 ‘당신들’은 현대 한국어에서 불필요하게 공손하거나 대립적으로 들릴 수 있습니다. 히브리어 2인칭 복수에 맞고 자연스러운 ‘너희의 말’이 적절합니다.
  - severity: low
    issue: צַדִּיק의 대안 의미에 대한 각주 부재
    rationale: 본문의 ‘그가 옳다’는 적절하지만, ‘의롭다’라는 전통적·어휘적 가능성이 있으므로 해당 표현에 각주를 두어 해석 가능성을 투명하게 보존하는 것이 좋습니다.
  revised_text: 처음부터 누가 그것을 알려 주어 우리가 알 수 있도록 하였으며, 미리 알려 주어 우리가 “그가 옳다”라고 말할 수 있도록 하였습니까? 그러나 그것을 알리는 자도 없었고, 들려주는 자도 없었으며, 너희의 말을 듣는 자도 없었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그가 의롭다” 또는 “그가 옳은 편이다.”
    reason: lexical_alternative
  revision_rationale: 문장의 인과 관계를 더 자연스럽게 다듬고, 2인칭 복수 호칭을 원문의 논쟁적 문맥에 맞게 ‘너희’로 조정했습니다. צַדִּיק은 본문에서 예언의 진실성에 대한 판정으로 ‘그가 옳다’라고 유지하되, 전통적·어휘적 대안을 각주로 보존했습니다.
