id: ISA.41.26
reference: Isaiah 41:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי הִגִּ֤יד מֵ/רֹאשׁ֙ וְ/נֵדָ֔עָה וּ/מִ/לְּ/פָנִ֖ים וְ/נֹאמַ֣ר צַדִּ֑יק אַ֣ף אֵין מַגִּ֗יד אַ֚ף אֵ֣ין מַשְׁמִ֔יעַ אַ֥ף אֵין שֹׁמֵ֖עַ אִמְרֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
  footnotes:
  - marker: a
    text: Or “from the first.”
    reason: lexical_alternative
  - marker: b
    text: Or “He is in the right”; traditionally, “He is righteous.”
    reason: lexical_alternative
translation:
  language: ko
  text: 처음부터 누가 그것을 알려서 우리가 알 수 있게 했으며, 미리 알려서 우리가 “그가 옳다”라고 말할 수 있게 했습니까? 그러나 그것을 알리는 자도 없었고, 들려주는 자도 없었으며, 당신들의 말을 듣는 자도 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 있습니까
  lexicon: HALOT
  rationale: 수사적 질문의 직접성을 살리기 위해 간결한 ‘누가’를 사용했습니다.
- source_word: הִגִּיד מֵרֹאשׁ
  english_pob_choice: declared from the beginning
  chosen_korean: 처음부터 … 알려서
  alternatives_korean:
  - 처음부터 … 선언해서
  - 시초부터 … 알려서
  lexicon: HALOT
  rationale: הִגִּיד는 단순 전달이 아니라 공적으로 알리는 뜻이므로 ‘알려서’로 옮기되, מֵרֹאשׁ은 자연스러운 한국어로 ‘처음부터’라고 했습니다.
- source_word: צַדִּיק
  english_pob_choice: He is right
  chosen_korean: 그가 옳다
  alternatives_korean:
  - 그가 의롭다
  - 그가 옳은 편이다
  lexicon: HALOT
  rationale: 이 문맥에서는 도덕적 성품보다 예언의 적중이 입증되었는지를 묻는 판정이므로, 전통적 ‘의롭다’보다 판정적 의미의 ‘옳다’가 더 가깝습니다.
- source_word: מַשְׁמִיעַ
  english_pob_choice: making it heard
  chosen_korean: 들려주는 자
  alternatives_korean:
  - 알려주는 자
  - 선포하는 자
  lexicon: HALOT
  rationale: 히필의 사역적·인과적 뉘앙스를 살려 단순한 ‘말하는’보다 ‘들려주다’로 옮겼습니다.
- source_word: אִמְרֵיכֶם
  english_pob_choice: your words
  chosen_korean: 당신들의 말
  alternatives_korean:
  - 당신들의 말씀
  - 여러분의 말
  lexicon: HALOT
  rationale: 우상과 그 변호자들을 향한 대결적 호칭이므로 공손하지만 거리감이 있는 ‘당신들의’가 본문 긴장을 잘 드러냅니다.
theological_decisions:
- issue: צַדִּיק의 의미
  chosen_reading: ‘그가 옳다’로 옮겨 예언의 정당성과 신빙성에 대한 판정으로 읽었습니다.
  alternative_readings:
  - ‘그가 의롭다’
  - ‘그가 올바르다’
  rationale: 문맥의 초점은 인격적 의로움이 아니라 미래를 미리 알린 말씀이 실제로 입증되는지에 있으므로, 법정적/변증적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 반복되는 부정의 수사적 효과
  chosen_reading: ‘그러나 … 없었습니다’로 반복되는 부정을 유지했습니다.
  alternative_readings:
  - ‘아무도 없었습니다’로 한 번에 압축
  - 문장 전체를 단일 부정으로 정리
  rationale: אַף אֵין의 누적된 부정은 도전문의 강도를 높이므로, 한국어에서도 반복을 살려 예언 경쟁의 부재를 강조했습니다.
  doctrine_reference: Translation philosophy §3
