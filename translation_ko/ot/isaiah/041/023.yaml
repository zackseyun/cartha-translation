reference: Isaiah 41:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
  footnotes:
  - marker: a
    text: Or 'the latter things.' The Hebrew expression refers to what comes later, here functioning as a challenge to foretell the future.
    reason: lexical_alternative
  - marker: b
    text: Or 'do good and do evil.' The sense is a challenge to show any real power, whether for benefit or for harm.
    reason: lexical_alternative
  - marker: c
    text: The verb rendered 'be dismayed' is rare and may also carry the sense 'look in awe' or 'gaze about in alarm.'
    reason: lexical_alternative
translation:
  language: ko
  text: “뒤에 올 일들을 선포하여 우리가 당신들이 신들임을 알게 하십시오. 참으로 선을 행하든지 악을 행하든지 하여 우리가 함께 놀라고 보게 하십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뒤에 올 일들’은 직역하면 ‘이후의 것들’에 가깝고, 문맥에서는 미래 예언을 요구하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선을 행하든지 악을 행하든지’는 히브리어의 대구를 따라, 실제 권능을 보여 보라는 도전입니다.
    reason: lexical_alternative
  - marker: c
    text: 희귀한 동사로, 여기서는 ‘놀라다’ 외에도 ‘경외하여 바라보다’ 또는 ‘당황하여 두리번거리다’의 뉘앙스가 있을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  english_pob_choice: Declare
  chosen_korean: 선포하여
  alternatives_korean:
  - 말하여
  - 알려
  lexicon: HALOT
  rationale: 대적을 향한 공개적 도전을 살려, 단순한 ‘말하다’보다 격식 있고 공적인 ‘선포하다’가 더 적절합니다.
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  english_pob_choice: the things to come afterward
  chosen_korean: 뒤에 올 일들
  alternatives_korean:
  - 나중의 일들
  - 훗날의 일들
  lexicon: HALOT
  rationale: 문맥상 미래 예언에 대한 도전이므로, 직역적이면서도 자연스러운 ‘뒤에 올 일들’로 옮겼습니다.
- source_word: אֱלֹהִים אַתֶּם
  english_pob_choice: you are gods
  chosen_korean: 당신들이 신들임을
  alternatives_korean:
  - 당신들이 신임을
  - 당신들이 하나님이심을
  lexicon: HALOT
  rationale: 우상들을 향한 복수형 진술이므로 ‘신들’이 가장 직접적이며, ‘하나님’은 문맥을 왜곡합니다.
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  english_pob_choice: do good or do harm
  chosen_korean: 선을 행하든지 악을 행하든지
  alternatives_korean:
  - 좋은 일을 하든지 해로운 일을 하든지
  - 선을 행하고 악을 행하든지
  lexicon: HALOT
  rationale: 히브리어의 대구적 도전은 실제 권능의 유무를 겨냥하므로, 관용적으로는 ‘선을 행하든지 악을 행하든지’가 가장 자연스럽습니다.
- source_word: וְנִשְׁתָּעָה
  english_pob_choice: that we may be dismayed
  chosen_korean: 우리가 함께 놀라고
  alternatives_korean:
  - 우리가 놀라게 되고
  - 우리가 두려워하게 되고
  lexicon: HALOT
  rationale: 희귀 동사의 의미 범위 가운데 ‘놀라다/두려워하다’의 긴장감을 살리되, 다음 동사 ‘보다’와 짝을 이루도록 한국어에서는 ‘함께 놀라고’로 처리했습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역을 다신론적 조롱 문맥에서 어떻게 살릴 것인가
  chosen_reading: ‘신들’로 번역해 우상에 대한 조롱과 도전의 복수형을 유지했습니다.
  alternative_readings:
  - 하나님
  - 신적인 존재들
  rationale: 문법적으로도 대상이 복수로 호명되고 있으며, 예언자의 논박은 참 하나님과 우상들을 구별하는 데 있습니다. 단수 ‘하나님’은 문맥을 흐립니다.
  doctrine_reference: 우상 비판과 여호와 유일성 강조(사 41장 전체 문맥)
