  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 명령 뒤에 이어지는 1인칭 복수 코호르타티브(‘우리가 알게 하라/알겠다’, ‘우리가 놀라고 보겠다’)는 우상들이 직접 ‘우리로 하여금’ 그렇게 하게 한다는 뜻이라기보다, 그들이 능력을 보인다면 화자들이 그 결과로 알게 되고 놀라 보게 된다는 도전의 논리입니다. 이를 조건적 귀결로 옮기는 편이 더 정확합니다.
  naturalness: 초안의 ‘선포하여 우리가 … 알게 하십시오’와 ‘하여 우리가 … 보게 하십시오’는 한국어에서 명령의 대상이 화자들의 인식과 반응을 직접 유발하라는 뜻으로 들려 다소 부자연스럽습니다. ‘그러면 우리가 … 알겠습니다/보겠습니다’로 고치면 현대 격식체에서 더 자연스럽고 논리 관계도 분명합니다.
  terminology: ‘신들’은 복수 우상들을 향한 히브리어 אֱלֹהִים 및 본문의 논박적 문맥을 적절히 보존합니다. ‘좋은 일/해로운 일’은 תֵּיטִיבוּ וְתָרֵעוּ의 유익과 해악이라는 능력 과시의 대조를 자연스럽게 드러냅니다. 각주 표지는 해당 어구에 직접 붙이는 것이 적절합니다.
