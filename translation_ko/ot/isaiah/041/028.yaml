id: ISA.41.28
reference: Isaiah 41:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨רֶא֙ וְ/אֵ֣ין אִ֔ישׁ וּ/מֵ/אֵ֖לֶּה וְ/אֵ֣ין יוֹעֵ֑ץ וְ/אֶשְׁאָלֵ֖/ם וְ/יָשִׁ֥יבוּ דָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
  footnotes:
  - marker: a
    text: Or 'there was no one.' Hebrew 'no man' uses a masculine singular form that can function representatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they would answer anything.' Hebrew literally, 'and they would answer a word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 보니 남자는 없었고, 이들 가운데에는 제가 그들에게 물어도 그들이 한마디라도 대답할 수 있는 조언자도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아무도 없었다.” 히브리어의 “남자”는 대표적으로 사람 일반을 가리킬 수 있는 남성 단수형입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들이 아무것도 대답할 수 있는.” 히브리어는 문자적으로 “그들이 한마디를 대답하다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  english_pob_choice: And I looked
  chosen_korean: 그리고 제가 살펴보았으나
  alternatives_korean:
  - 그리고 제가 보았으나
  - 그리고 제가 바라보았으나
  lexicon: WLC / HALOT
  rationale: 예언적 회고의 관찰 동사를 한국어에서는 단순한 '보다'보다 '살펴보다'가 더 자연스럽고, 문맥의 탐색적 뉘앙스를 살립니다.
- source_word: וְאֵין אִישׁ
  english_pob_choice: but there was no man
  chosen_korean: 남자는 없었고
  alternatives_korean:
  - 사람은 없었고
  - 아무도 없었고
  lexicon: WLC / HALOT
  rationale: אִישׁ의 성별 표지와 대표적 용법을 살려 '남자'를 유지했습니다. '아무도'는 의미는 매끄럽지만 원문의 인칭적 대비가 약해집니다.
- source_word: וּמֵאֵלֶּה
  english_pob_choice: among these
  chosen_korean: 이들 가운데는
  alternatives_korean:
  - 이들 중에는
  - 이것들 가운데는
  lexicon: WLC / HALOT
  rationale: מִן + אֵלֶּה의 부분적 의미를 한국어의 '가운데'로 자연스럽게 옮겼습니다.
- source_word: וְאֵין יוֹעֵץ
  english_pob_choice: there was no counselor
  chosen_korean: 조언자가 없었습니다
  alternatives_korean:
  - 상담자가 없었습니다
  - 충고하는 이가 없었습니다
  lexicon: WLC / HALOT
  rationale: יוֹעֵץ의 '조언을 주는 자'라는 실질적 의미를 살리면서, 현대 한국어에서 이해하기 쉬운 '조언자'를 택했습니다.
- source_word: וְאֶשְׁאָלֵם
  english_pob_choice: that I might ask them
  chosen_korean: 내가 그들에게 물으면
  alternatives_korean:
  - 내가 그들에게 묻고자 해도
  - 내가 그들에게 물을 수 있게
  lexicon: WLC / HALOT
  rationale: 히브리어의 의도/가능성을 가진 미완료형을 한국어의 조건적·목적적 표현으로 옮겼습니다. 영어 POB가 지적한 잠재적 의미를 반영합니다.
- source_word: וְיָשִׁיבוּ דָבָר
  english_pob_choice: and they would answer a word
  chosen_korean: 그들이 한마디라도 대답할 수 있게 하려는 것이었습니다
  alternatives_korean:
  - 그들이 말을 돌려줄 수 있게 하려는 것이었습니다
  - 그들이 아무 말이나 대답할 수 있게 하려는 것이었습니다
  lexicon: WLC / HALOT
  rationale: 직역하면 '말 한마디를 돌려주다/대답하다'의 빈약함을 드러내는 표현입니다. POB의 'answer a word'가 보존한 수사적 공허함을 한국어로는 '한마디라도'로 전달했습니다.
theological_decisions:
- issue: 이 구절의 조롱 대상과 무력성의 강조
  chosen_reading: 우상들과 그 대변자들 가운데 어느 누구도 조언하거나 응답할 수 없다는 논박을 그대로 유지했습니다.
  alternative_readings:
  - 대상을 더 넓게 '민족들'이나 '신들'로 특정할 수 있습니다.
  rationale: 문맥상 이사야 41:21-29의 법정식 논박이므로, 본문이 명시하지 않은 대상을 과도하게 규정하지 않고 무능력을 선명하게 드러냈습니다.
  doctrine_reference: 번역 원칙 §3 (신학적 긴장 보존)
- issue: ‘내가 그들에게 물으면’의 시제/가능성
  chosen_reading: 미완료형의 잠재적·의도적 힘을 살려 조건적 의미로 옮겼습니다.
  alternative_readings:
  - 과거 서술형으로 '내가 그들에게 물었더니'라고 옮길 수 있습니다.
  - '''내가 그들에게 물고자 해도''처럼 목적성을 더 강하게 나타낼 수 있습니다.'
  rationale: 영어 POB의 최종 판단도 संभाव성/의도성을 유지하는 쪽이었고, 히브리어 וְאֶשְׁאָלֵם의 문맥상 의미를 한국어에서 가장 자연스럽게 드러내기 위해 조건적 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §2 (원문 의미 우선)
