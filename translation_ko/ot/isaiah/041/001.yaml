id: ISA.41.1
reference: Isaiah 41:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
  footnotes:
  - marker: a
    text: Or 'islands' or 'distant shores'; the Hebrew term often refers broadly to maritime lands or far-off coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'gain new strength'; the Hebrew idiom literally involves changing or renewing strength.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew has 'let us draw near for judgment,' reflecting a legal or courtroom setting.
    reason: cultural_note
translation:
  language: ko
  text: 해안 지방들아, 내 앞에서 잠잠하십시오[a]. 민족들은 힘을 새롭게 하십시오[b]. 그들이 가까이 오게 하십시오. 그때 그들이 말하게 하십시오. 함께 재판을 위하여 가까이 나아갑시다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해안 지방들’은 히브리어 אִיִּים을 옮긴 것으로, ‘섬들’ 또는 먼 바다 건너의 해안 지역들을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘힘을 바꾸다/갱신하다’라는 관용적 표현으로, 힘을 새롭게 얻거나 회복한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘재판을 위하여 가까이 나아가자’라고 하며, 법정 또는 변론의 장면을 시사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  english_pob_choice: Be silent
  chosen_korean: 조용히 하십시오
  alternatives_korean:
  - 잠잠하십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: 명령형의 강한 침묵 요구를 현대 한국어의 자연스러운 공손체로 살리기 위해 ‘조용히 하십시오’를 택했습니다.
- source_word: אֵלַי
  english_pob_choice: before me
  chosen_korean: (직역상) ‘내 앞에서’의 뉘앙스를 반영하되 문맥상 생략
  alternatives_korean:
  - 내게
  - 내 앞에서
  lexicon: HALOT
  rationale: 히브리어 전치사 자체는 ‘내게/내 앞에’의 방향을 가리키지만, 침묵 명령과 결합한 소환 장면에서는 한국어에서 별도 표지 없이 자연스럽게 전달할 수 있어 본문에서는 드러내지 않았습니다.
- source_word: אִיִּים
  english_pob_choice: coastlands
  chosen_korean: 해안들
  alternatives_korean:
  - 섬들
  - 먼 해안들
  lexicon: HALOT
  rationale: POB의 ‘coastlands’는 문자적 ‘섬들’보다 먼 해역의 연안 지역을 넓게 가리키므로, ‘해안들’이 지리적 범위를 비교적 직접적으로 옮깁니다.
- source_word: יַחֲלִיפוּ כֹחַ
  english_pob_choice: renew their strength
  chosen_korean: 힘을 새롭게 하십시오
  alternatives_korean:
  - 힘을 갈아치우십시오
  - 새 힘을 얻으십시오
  lexicon: HALOT
  rationale: חלף + כוח의 관용구는 단순한 ‘얻다’보다 힘의 갱신/교체를 뜻하므로, ‘힘을 새롭게 하다’가 어감을 살리면서도 자연스럽습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판을 위해
  alternatives_korean:
  - 판결을 위해
  - 재판을 위해
  lexicon: HALOT
  rationale: 문맥이 법정적 소환이므로 מִשְׁפָּט을 ‘심판’으로 옮겨 선언적·사법적 긴장을 유지했습니다. ‘재판’보다 하나님의 주권적 판정 뉘앙스가 더 잘 드러납니다.
theological_decisions:
- issue: 예언적 소환의 법정성
  chosen_reading: 본문을 하나님의 공개 소환과 심판 장면으로 읽고, 한국어에서도 그 법정적 긴장을 유지했습니다.
  alternative_readings:
  - 일반적인 경청 요청으로 완화하기
  - 법정 이미지를 본문 밖으로 과도하게 확장하기
  rationale: ‘침묵하라—힘을 새롭게 하라—가까이 오라—말하라—심판을 위해 다가오자’의 연쇄가 분명한 심문/변론 장면을 이루므로, 이를 흐리지 않되 과잉 설명도 피했습니다.
  doctrine_reference: '번역 원칙: 원문이 암시하는 장면과 힘을 보존하되 해석을 덧붙여 범위를 넓히지 않는다.'
