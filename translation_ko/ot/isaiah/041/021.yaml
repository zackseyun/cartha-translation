id: ISA.41.21
reference: Isaiah 41:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְב֥וּ רִֽיבְ/כֶ֖ם יֹאמַ֣ר יְהוָ֑ה הַגִּ֨ישׁוּ֙ עֲצֻמ֣וֹתֵי/כֶ֔ם יֹאמַ֖ר מֶ֥לֶךְ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Come near your dispute/lawsuit.'' The expression is a legal summons; ''Present your case'' conveys the courtroom sense.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bring forward your strong reasons,' 'your proofs,' or 'your defenses.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: “너희의 송사를 내놓으라” 야훼께서 말씀하십니다. “너희의 강한 논거들을 앞으로 가져오라” 야곱의 왕께서 말씀하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִיב는 여기서 단순한 ‘다툼’보다 법정적 ‘송사, 분쟁 사건’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: עֲצֻמוֹתֵיכֶם은 문자적으로는 ‘너희의 강한 것들’이지만, 이 문맥에서는 ‘강한 논거들/이유들’을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה를 반영한 표기입니다. 전통적으로는 ‘주님’으로 번역해 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  english_pob_choice: Present your case
  chosen_korean: “너희의 송사를 내놓으라”
  alternatives_korean:
  - “너희의 다툼을 가까이 가져오라”
  - “너희의 소송을 제시하라”
  - “너희의 사건을 진술하라”
  lexicon: HALOT
  rationale: קרב의 ‘다가오다/내놓다’와 ריב의 법정적 ‘송사, 분쟁’을 함께 살려, 단순 이동이 아니라 법정에 사건을 제시하는 소환으로 옮겼습니다.
- source_word: הַגִּישׁוּ עֲצֻמוֹתֵיכֶם
  english_pob_choice: bring forward your strong arguments
  chosen_korean: “너희의 강한 논거들을 앞으로 가져오라”
  alternatives_korean:
  - “너희의 강한 이유들을 제시하라”
  - “너희의 증거들을 내놓으라”
  - “너희의 방어 논리를 가져오라”
  lexicon: HALOT
  rationale: עֲצֻמוֹתֵיכֶם은 문자적으로 ‘강한 것들’이지만, 이 법정 맥락에서는 설득력 있는 논거·주장으로 이해하는 것이 자연스럽습니다.
- source_word: יֹאמַר יְהוָה / יֹאמַר מֶלֶךְ יַעֲקֹב
  english_pob_choice: says Yahweh / says the King of Jacob
  chosen_korean: 야훼께서 말씀하십니다 / 야곱의 왕께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 이르십니다 / 야곱의 왕께서 이르십니다
  - 여호와께서 말씀하십니다 / 야곱의 왕께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언문 정형구는 한국어 공용문체에 맞게 ‘말씀하십니다’로 옮기고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 제목형 대체어 ‘야훼’ 사용
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 טetragrammaton יְהוָה를 직접 사용하므로, 개인적 이름을 가리는 직함 대신 음역형 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 법정 소환의 표지
  chosen_reading: 송사/논거의 법정 이미지 유지
  alternative_readings:
  - 더 완곡한 ‘문제’나 ‘이유’로 완화
  rationale: 이 구절은 우상들과 그 옹호자들에게 법정에서 답변을 요구하는 장면이므로, 본문의 공방성과 재판 어조를 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source text''s plain sense'
