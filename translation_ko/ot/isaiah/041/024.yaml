id: ISA.41.24
reference: Isaiah 41:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵן אַתֶּ֣ם מֵ/אַ֔יִן וּ/פָעָלְ/כֶ֖ם מֵ/אָ֑פַע תּוֹעֵבָ֖ה יִבְחַ֥ר בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
  footnotes:
  - marker: a
    text: Or possibly 'your work is from nonexistence'; the Hebrew term translated 'less than nothing' is rare and difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 너희는 아무것도 아니며 너희의 일은 무(無)에서 난 것입니다. 너희를 선택하는 자는 가증한 자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무(無)에서 난 것입니다’는 희귀하고 난해한 히브리어 표현을 한국어로 풀어 옮긴 것이며, 본문은 ‘아무것도 아니다’와 평행하게 무가치함을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보세요
  lexicon: HALOT
  rationale: 예언적 선언을 여는 감탄사로서 주의를 환기하는 기능을 살리면서, 현대 한국어 합쇼체에 맞는 직접적이고 선명한 표현을 택했습니다.
- source_word: מֵאַיִן
  english_pob_choice: nothing
  chosen_korean: 아무것도 아니며
  alternatives_korean:
  - 무(無)에서
  - 무(無)에서 난 것이며
  - 없음에서
  lexicon: HALOT
  rationale: 히브리어의 존재 없음/무가치함을 자연스러운 한국어로 옮겼습니다. 앞절의 단언적 평가를 살리기 위해 ‘아무것도 아니다’의 관용적 힘을 택했습니다.
- source_word: מֵאָפַע
  english_pob_choice: less than nothing / from nonexistence
  chosen_korean: 무(無)에서 난 것입니다
  alternatives_korean:
  - 무(無)에서 온 것입니다
  - 비존재에서 난 것입니다
  - 없음에서 난 것입니다
  lexicon: HALOT
  rationale: 희귀하고 난해한 어근의 난점을 반영해, POB의 의미 선택인 비존재/무가치의 뉘앙스를 유지하되 한국어에서는 전치사적 대조를 자연스럽게 풀어냈습니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 자입니다
  alternatives_korean:
  - 가증한 것입니다
  - 혐오스러운 자입니다
  - 역겨운 자입니다
  lexicon: HALOT
  rationale: 언약적 혐오를 나타내는 강한 표현을 약화시키지 않기 위해, 대상 인물/우상에 대한 판정을 드러내는 ‘가증한 자’로 옮겼습니다.
theological_decisions:
- issue: 대상 ‘너희’의 지시 대상
  chosen_reading: ‘너희’는 주변 문맥의 우상들/신들을 가리키는 직접 호명으로 읽고, 인간 제작자를 본문에 끌어들이지 않았습니다.
  alternative_readings:
  - 우상 제작자들을 환유적으로 가리킨다고 볼 수 있음
  rationale: 예언적 조롱의 직접성을 유지하기 위해 본문이 말하는 대상을 그대로 드러냈습니다. 한국어에서도 추가 설명 없이 경고의 날카로움이 전달됩니다.
  doctrine_reference: 우상 논박과 예언 문체의 직접 호명
