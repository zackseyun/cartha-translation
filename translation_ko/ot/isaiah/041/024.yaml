  text: 보십시오, 너희는 아무것도 아니며 너희의 행위는 무에서 나온 것입니다.[a] 너희를 선택하는 자는 가증한 자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무에서 나온 것입니다’로 옮긴 히브리어 표현은 희귀하고 뜻이 확정적이지 않습니다. 문맥상 앞의 ‘아무것도 아니다’와 병행하여 무가치함 또는 비존재를 강조하는 말로 이해할 수 있습니다.
    reason: lexical_alternative
