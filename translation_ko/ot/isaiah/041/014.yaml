id: ISA.41.14
reference: Isaiah 41:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'mortals of Israel' or 'people of Israel'; the Hebrew literally reads 'men of Israel,' likely emphasizing Israel's frailty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'worm Jacob,' a metaphor of weakness and lowliness, not a literal description.
    reason: cultural_note
  - marker: c
    text: Or 'I have helped you' / 'I will help you'; the Hebrew verb form can be understood as a prophetic assurance rather than a simple past tense.
    reason: alternative_reading
translation:
  language: ko
  text: 두려워하지 마십시오, 야곱의 벌레여, 이스라엘의 사람들아. 내가 너를 돕습니다.[b] 야훼께서 선언하십니다. 나는 너의 구속자, 이스라엘의 거룩하신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야곱의 벌레’이며, 이는 비천함과 연약함을 나타내는 은유입니다.
    reason: cultural_note
  - marker: b
    text: ‘내가 너를 돕습니다’에 해당하는 히브리어 동사는 완료형입니다. 문맥상 예언적 보증으로 이해될 수 있어 ‘내가 너를 도왔습니다’ 또는 ‘내가 너를 도울 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 말라
  alternatives_korean:
  - 두려워하지 마십시오
  - 무서워하지 말라
  lexicon: HALOT
  rationale: אַל과 미완료형의 금지 표현을 한국어의 자연스러운 금지문으로 옮겼습니다. 본문의 반복 공식성을 살리기 위해 간결한 표현을 택했습니다.
- source_word: תּוֹלַעַת יַעֲקֹב
  english_pob_choice: worm Jacob
  chosen_korean: 야곱의 벌레여
  alternatives_korean:
  - 야곱의 벌레
  - 벌레 같은 야곱이여
  - 야곱 벌레여
  lexicon: HALOT
  rationale: תּוֹלַעַת의 직설적 은유를 완화하지 않고 보존했습니다. 호격을 드러내기 위해 ‘-여’를 붙여, 낮고 연약한 존재를 부르는 뉘앙스를 살렸습니다.
- source_word: מְתֵי יִשְׂרָאֵל
  english_pob_choice: men of Israel
  chosen_korean: 이스라엘의 사람들아
  alternatives_korean:
  - 이스라엘의 남자들아
  - 이스라엘의 인간들아
  - 이스라엘 사람들아
  lexicon: HALOT
  rationale: 문자적으로는 ‘사람들/남자들’이지만, 본문은 야곱에 대한 은유를 병치하며 약함을 강조합니다. 한국어에서는 직역의 딱딱함보다 호격으로 기능하는 집단 호칭을 살려 읽기 자연성을 확보했습니다.
- source_word: עֲזַרְתִּיךְ
  english_pob_choice: help you
  chosen_korean: 내가 너를 돕습니다
  alternatives_korean:
  - 내가 너를 도왔습니다
  - 내가 너를 도울 것입니다
  - 내가 너를 돕겠습니다
  lexicon: HALOT
  rationale: 완료형이지만 예언적 보증으로 쓰이므로 단순 과거로 고정하지 않았습니다. 현재형 보증으로 옮겨 하나님의 즉각적이고 확정적인 도움을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이다
  alternatives_korean:
  - 야훼의 선언이다
  - 야훼께서 말씀하신다
  - 야훼의 말씀이니라
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명 표기를 주석적 전통어가 아닌 ‘야훼’로 일관되게 옮겼습니다. נְאֻם은 예언 공식으로서 ‘말씀이다’가 자연스럽고 직접적입니다.
- source_word: וְגֹאֲלֵךְ
  english_pob_choice: your Redeemer
  chosen_korean: 너의 구속자
  alternatives_korean:
  - 너의 구원자
  - 너의 속량자
  - 너의 기업 무를 자
  lexicon: HALOT
  rationale: גאל의 언약적·법정적 구원 기능을 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다. 전통적 교회 용어인 ‘구속자’는 유지하되 문맥상 칭호로 읽히도록 했습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩하신 이
  - 이스라엘의 거룩하신 분이신 분
  - 이스라엘의 거룩하신 이
  lexicon: HALOT
  rationale: 이스라엘의 고유한 신적 칭호를 한국어의 자연스러운 존칭으로 옮겼습니다. ‘거룩하신 분’은 명칭의 위엄을 살리면서도 현대 한국어에서 읽기 쉽습니다.
theological_decisions:
- issue: 야훼를 인용문 안에서 어떻게 표기할지
  chosen_reading: 예언 선포의 발화표지로 ‘야훼의 말씀이다’를 사용했습니다.
  alternative_readings:
  - ‘주께서 말씀하신다’
  - ‘여호와의 말씀이다’
  rationale: 본문이 직접 신명과 예언 공식 נְאֻם יְהוָה를 결합하므로, 프로젝트 기본 원칙에 따라 신명은 야훼로 유지해야 합니다. 동시에 합쇼체 본문 흐름을 해치지 않도록 짧은 발화표지로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מְתֵי יִשְׂרָאֵל의 약함 뉘앙스 처리
  chosen_reading: ‘이스라엘의 사람들아’로 옮기되, ‘야곱의 벌레여’와 병치해 비천함을 드러냈습니다.
  alternative_readings:
  - ‘이스라엘의 남자들아’
  - ‘이스라엘의 인간들아’
  - ‘이스라엘의 백성들아’
  rationale: 문법적 남성형을 무시한 중성화는 피하되, 단어 자체의 인간적 연약함은 전체 호격 구조 안에서 전달되도록 했습니다. 이렇게 하면 본문의 낮춤과 위로의 대비가 유지됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
