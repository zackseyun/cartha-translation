  source_fidelity: 핵심 어휘와 비유는 대체로 충실합니다. 그러나 히브리어의 ‘야훼의 선언’ 및 ‘너의 구속자, 이스라엘의 거룩하신 분’은 야훼 자신을 가리키는 선언·동격 구조인데, 초안은 ‘야훼의 말씀이다. 너의 구속자…이시다’로 분절하여 문장 성분과 지시 관계가 불완전해졌습니다.
