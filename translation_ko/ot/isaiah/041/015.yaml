id: ISA.41.15
reference: Isaiah 41:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
  footnotes:
  - marker: a
    text: Or 'with many cutting edges' or 'with serrated teeth'; the Hebrew literally says 'possessing edges/mouths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 당신을 새롭고 날카로운 타작 써레로 만들었습니다. 당신은 산들을 타작하여 그것들을 부수고, 언덕들을 쭉정이처럼 만들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 날이 달린’ 혹은 ‘톱니가 달린’이라는 뜻일 수 있습니다. 히브리어는 문자적으로 ‘날/입들을 가진’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언적 주의 환기 표현을 살려, 단순한 안내보다 강한 촉구를 주는 명령형으로 옮겼습니다.
- source_word: שַׂמְתִּיךְ לְמוֹרַג
  english_pob_choice: I have made you into a ... threshing sledge
  chosen_korean: 내가 당신을 새롭고 날카로운 타작 써레로 만들었습니다
  alternatives_korean:
  - 내가 당신을 ... 타작기구로 삼았습니다
  - 내가 당신을 ... 타작 써레로 세웠습니다
  lexicon: HALOT
  rationale: שׂוּם의 ‘만들다/삼다’ 의미와 מוֹרַג의 농기구 이미지를 살려, 한국어에서 자연스러운 ‘타작 써레’로 구체화했습니다.
- source_word: בַּעַל פִּיפִיּוֹת
  english_pob_choice: with double edges
  chosen_korean: 날카로운
  alternatives_korean:
  - 이중 날이 있는
  - 여러 날이 달린
  - 톱니가 있는
  lexicon: HALOT
  rationale: 직역하면 어색해질 수 있어, 본문이 강조하는 절단성은 유지하되 한국어 문맥에서 자연스러운 형용사로 압축했습니다.
- source_word: תָּדוּשׁ הָרִים וְתָדֹק
  english_pob_choice: you will thresh the mountains and crush them
  chosen_korean: 당신은 산들을 타작하여 그것들을 부수고
  alternatives_korean:
  - 산들을 타작하고 부수며
  - 산들을 타작하여 산을 가루로 만들고
  lexicon: HALOT
  rationale: 동사 שניים의 연속을 분명히 드러내되, 산/언덕의 병행 구조와 공격적 이미지를 보존했습니다.
- source_word: כַּמֹּץ
  english_pob_choice: like chaff
  chosen_korean: 쭉정이처럼
  alternatives_korean:
  - 겨처럼
  - 검불처럼
  lexicon: HALOT
  rationale: מוֹץ의 탈곡 후 남는 가벼운 찌꺼기 이미지를 한국어에서 가장 자연스럽고 널리 이해되는 ‘쭉정이’로 옮겼습니다.
theological_decisions:
- issue: 산과 언덕의 상징성
  chosen_reading: 상징을 설명으로 풀지 않고, 본문의 농경 비유를 그대로 유지했습니다.
  alternative_readings:
  - 큰 나라들로 풀어 쓰기
  - 장애물로 해석해 번역하기
  rationale: 히브리어는 이 이미지를 해설 없이 제시하므로, 수사적 긴장과 예언적 힘을 보존하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: 본문의 비유적 긴장을 해소하지 않고 유지하는 원칙'
