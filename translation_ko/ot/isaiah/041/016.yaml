source:
  edition: WLC
  text: תִּזְרֵ/ם֙ וְ/ר֣וּחַ תִּשָּׂאֵ֔/ם וּ/סְעָרָ֖ה תָּפִ֣יץ אוֹתָ֑/ם וְ/אַתָּה֙ תָּגִ֣יל בַּֽ/יהוָ֔ה בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּתְהַלָּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
  footnotes:
  - marker: a
    text: Or 'you will scatter them.' The Hebrew verb can denote scattering generally, but 'winnow' is used here to preserve the threshing imagery of the context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
  - marker: c
    text: Or 'you will glory in the Holy One of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그들을 까불리어 흩어지게 할 것이며, 바람이 그들을 몰아가고 폭풍이 그들을 흩어 버릴 것입니다. 그러나 너희는 야훼 안에서 기뻐할 것이며, 이스라엘의 거룩하신 분 안에서 자랑할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 그들을 흩어 버릴 것입니다.’ 히브리어 동사는 일반적 흩어짐도 뜻할 수 있지만, 이 문맥의 타작 이미지가 보존되도록 ‘까불리어 흩어지게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼’는 신적 이름 YHWH를 나타냅니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘이스라엘의 거룩하신 분 안에서 영광을 돌릴 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  english_pob_choice: you will winnow them
  chosen_korean: 너희가 그들을 까불리어 흩어지게 할 것이며
  alternatives_korean:
  - 너희가 그들을 흩어 버릴 것이며
  - 너희가 그들을 까불릴 것이며
  lexicon: HALOT
  rationale: זרה는 타작과 연결된 ‘까불다/키질하다’의 농경 이미지를 살리는 것이 문맥상 중요하므로, 단순한 ‘흩다’보다 의도된 이미지가 드러나도록 옮겼습니다.
- source_word: רוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  lexicon: HALOT
  rationale: 뒤의 ‘폭풍’과 병렬을 이루므로 כאן의 רוּחַ는 ‘영’이 아니라 기상 현상인 ‘바람’으로 이해하는 것이 원문 의미에 맞습니다.
- source_word: סְעָרָה
  english_pob_choice: storm
  chosen_korean: 폭풍
  alternatives_korean:
  - סער
  - 회오리바람
  - 폭풍우
  lexicon: HALOT
  rationale: סערה는 단순한 바람보다 강한 폭풍성 기상 현상을 가리키므로, 현대 한국어에서 가장 직접적인 ‘폭풍’이 적절합니다.
- source_word: בַּיהוָה / בִּקְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: in Yahweh; in the Holy One of Israel
  chosen_korean: 야훼 안에서 … 이스라엘의 거룩하신 분 안에서
  alternatives_korean:
  - 야훼로 말미암아 … 이스라엘의 거룩하신 분으로 말미암아
  - 야훼를 두고 … 이스라엘의 거룩하신 분을 두고
  lexicon: HALOT
  rationale: בְּ는 여기서 단순한 장소라기보다 기쁨과 자랑의 대상/영역을 나타내므로 ‘안에서’로 두어 병행 구조를 살렸고, יהוה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: תִּתְהַלָּל
  english_pob_choice: you will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자부할 것입니다
  - 영광을 돌릴 것입니다
  lexicon: HALOT
  rationale: 히트파엘 הלל은 여기서 자기 과시가 아니라 하나님 안에서의 ‘자랑/자부’의 뜻이므로, 현대어로 자연스럽고 신학적 긴장을 살리는 ‘자랑하다’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문에 직접 나타난 신명은 전통적 관용보다 원어 추적성을 우선하여 ‘야훼’로 유지했습니다. 이는 문맥의 언약적 하나님의 이름을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘자랑하다’의 신학적 뉘앙스
  chosen_reading: 이스라엘의 거룩하신 분 안에서 자랑할 것입니다
  alternative_readings:
  - 이스라엘의 거룩하신 분 안에서 영광을 돌릴 것입니다
  - 이스라엘의 거룩하신 분을 두고 자랑할 것입니다
  rationale: 히브리어 תִּתְהַלָּל은 하나님 안에서의 긍정적 ‘glorying/boasting’이므로, 인간적 교만이 아니라 구원하시는 하나님을 의지해 기뻐하는 언약적 자랑을 드러내도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§5–6
