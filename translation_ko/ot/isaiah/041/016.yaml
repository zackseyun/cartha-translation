  naturalness: ‘까불리어 흩어지게 하다’는 현대 표준어에서 다소 부자연스럽고 의미가 중복됩니다. ‘키질하다’와 ‘휩쓸어 가다’를 사용하면 문맥의 비유와 현대적 흐름을 함께 살릴 수 있습니다.
  terminology: 야훼, 이스라엘의 거룩하신 분, 자랑하다의 선택은 적절합니다. 다만 각주 c의 ‘영광을 돌리다’는 תִּתְהַלָּל의 ‘자랑하다/영광을 삼다’와 달리 하나님께 찬양을 드린다는 뜻으로 이동하므로 고쳐야 합니다. 각주 표지도 해당 어구 바로 뒤에 배치해야 합니다.
