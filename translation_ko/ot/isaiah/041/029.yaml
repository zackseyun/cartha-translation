id: ISA.41.29
reference: Isaiah 41:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
  footnotes:
  - marker: a
    text: Or 'vanity' for 'nothingness' (אָוֶן); the Hebrew term can also carry senses such as trouble or wickedness, but here it emphasizes worthlessness.
    reason: lexical_alternative
  - marker: b
    text: Or 'their molten images.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들 모두는 아무것도 아닙니다. 그들의 행위도 아무것도 아닙니다. 그들의 부어 만든 우상은 바람이요 텅 빔입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무것도’는 אָוֶן의 ‘헛됨, 무가치함’까지 포괄하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부어 만든 우상’은 직역하면 ‘그들의 주조한 형상’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끌며 결론을 제시하는 감탄사로 보아, 현대 한국어에서는 명령형보다 공손한 환기 표현인 ‘보십시오’가 자연스럽고 원문의 긴박감을 살립니다.
- source_word: כֻּלָּם
  english_pob_choice: all of them
  chosen_korean: 그들 모두
  alternatives_korean:
  - 모두
  - 그들 전부
  lexicon: HALOT
  rationale: 앞서 언급된 우상들의 총체를 가리키는 대명사성을 살리기 위해 ‘그들 모두’로 옮겼습니다.
- source_word: אָוֶן / אֶפֶס
  english_pob_choice: nothingness / nothing
  chosen_korean: 아무것도 아닙니다
  alternatives_korean:
  - 무가치합니다
  - 헛것입니다
  - 없습니다
  lexicon: HALOT
  rationale: 두 표현의 평행법이 단순한 비존재보다 ‘무가치함/허무함’을 강조하므로, 자연스러운 합쇼체로 ‘아무것도 아닙니다’를 택해 두 어휘의 중첩된 공허함을 함께 살렸습니다.
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their cast images
  chosen_korean: 그들의 부어 만든 우상
  alternatives_korean:
  - 그들의 주조한 우상
  - 그들의 주물 우상
  - 그들의 부어 만든 형상
  lexicon: HALOT
  rationale: נָסַךְ 계열의 ‘부어 만들다/주조하다’ 의미를 반영해 전통적이지만 이해 가능한 ‘부어 만든 우상’으로 옮겼습니다. ‘우상’은 문맥상 대상이 분명하므로 보강했습니다.
theological_decisions:
- issue: אָוֶן과 אֶפֶס의 이중 부정이 주는 신학적 강도
  chosen_reading: 우상들은 단지 쓸모없다는 수준이 아니라, 하나님의 현실 앞에서 실재적 권위가 전혀 없는 ‘아무것도 아닌 것’으로 선포됩니다.
  alternative_readings:
  - 단순히 가치가 없다는 뜻
  - 도덕적 악을 주로 지칭한다는 읽기
  rationale: 문맥은 우상 논박이며, 병렬된 אָוֶן/אֶפֶס는 허무성과 무력함을 압축적으로 강조합니다. 따라서 도덕적 악보다 ‘무가치한 공허함’의 신학적 폭을 보존했습니다.
  doctrine_reference: 우상 무력성에 대한 선지서적 선언(이사야 40–41장 문맥)
- issue: ‘바람과 텅 빔’의 상징적 표현
  chosen_reading: 우상은 생명과 실체를 주지 못하는 덧없음과 공허함의 표상입니다.
  alternative_readings:
  - ‘영’으로 번역해 영적 의미를 부여하는 읽기
  - 단순 물질적 부정으로만 읽는 해석
  rationale: ר֥וּחַ는 여기서 성령이 아니라 ‘바람/허공’의 이미지이므로, 영적 용례로 오해되지 않도록 상징성을 유지했습니다.
  doctrine_reference: 성령 용례와 구별되는 רוּחַ의 비인격적 의미
