  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
  footnotes:
  - marker: a
    text: Or 'who are angry with you' / 'who are incensed against you.' The Hebrew participle is literally 'those burning against you,' an idiom for anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 너를 대적하여 분노하는 모든 자들이 부끄러움을 당하고 수치를 당할 것이며, 그들은 아무것도 아닌 자가 될 것이고, 너와 다투는 그 사람들은 멸망할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 הוא ‘너를 향해 타오르는 자들’의 관용적 표현으로, 영어 POB의 ‘who are enraged against you / who are incensed against you’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 예언적 주목을 부르는 담화 표지이므로, 현대 합쇼체에서 자연스럽고 직접적인 주의 환기 표현인 ‘보십시오’로 옮겼습니다.
- source_word: הַנֶּחֱרִים בָּךְ
  english_pob_choice: who are enraged against you
  chosen_korean: 너를 대적하여 분노하는
  alternatives_korean:
  - 너에게 분노하는
  - 너를 향해 불타는
  - 너에게 격분한
  lexicon: HALOT
  rationale: 히브리어의 ‘타오르다’에서 나온 관용적 분노 표현을 살리되, 단순 감정이 아니라 적대적 태도를 드러내도록 ‘대적하여 분노하는’으로 잡았습니다.
- source_word: יֵבֹשׁוּ וְיִכָּלְמוּ
  english_pob_choice: will be put to shame and humiliated
  chosen_korean: 부끄러움을 당하고 수치를 당할 것이며
  alternatives_korean:
  - 부끄러워하고 수치를 당할 것이며
  - 수치를 당하고 굴욕을 당할 것이며
  - 부끄러움을 당하고 굴욕을 당할 것이며
  lexicon: HALOT
  rationale: 두 동사의 중첩된 수치/굴욕 의미를 한국어에서 구별해 보이기 위해, 내부 감정으로 약화시키지 않고 결과 상태를 나타내는 ‘부끄러움을 당하다/수치를 당하다’로 옮겼습니다.
- source_word: יִהְי֥וּ כְ/אַ֛יִן
  english_pob_choice: they will become as nothing
  chosen_korean: 아무것도 아닌 자가 될 것이고
  alternatives_korean:
  - 없는 것과 같이 될 것이고
  - 아무것도 아니게 될 것이고
  - 무(無)와 같아질 것이고
  lexicon: HALOT
  rationale: כאַיִן의 존재 부정적 표현을 한국어에서 자연스럽게 살리기 위해, 상태 묘사인 ‘아무것도 아닌 자가 되다’로 옮겼습니다.
- source_word: אַנְשֵׁי רִיבֶךָ
  english_pob_choice: the men who contend with you
  chosen_korean: 너와 다투는 그 사람들은
  alternatives_korean:
  - 너와 다투는 남자들은
  - 너와 논쟁하는 자들은
  - 너와 다투는 이들은
  lexicon: HALOT
  rationale: 히브리어의 ‘남성 복수’는 보존하되, 한국어에서는 성별 어색함을 줄이면서도 대립·다툼의 법적/논쟁적 뉘앙스를 전달하도록 ‘그 사람들’로 표현했습니다.
theological_decisions:
- issue: 예언적 선언의 직접 호소 방식
  chosen_reading: ‘보십시오’로 시작해 청자를 정면으로 부르는 예언적 어조를 유지했습니다.
  alternative_readings:
  - ‘보라’로 더 고전적으로 옮김
  - ‘자, 보십시오’로 완화함
  rationale: 본문의 הֵן은 단순 정보 제시가 아니라 청중의 주의를 끌고 확언하는 표지이므로, 현대 한국어에서 너무 완화되지 않는 직접 호소형을 택했습니다.
  doctrine_reference: 'Translation philosophy: source-directed prophetic discourse preservation'
- issue: 대적자들의 소멸을 존재론적 붕괴로 표현
  chosen_reading: ‘아무것도 아닌 자가 될 것이고’로 כְאַיִן의 무효화 이미지를 살렸습니다.
  alternative_readings:
  - ‘사라질 것입니다’
  - ‘없어질 것입니다’
  rationale: 본문은 단순한 소멸이 아니라 ‘없는 것’과 같은 비존재 상태를 말하므로, 결과의 급진성을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: maintain source-level rhetorical force'
