id: ISA.41.7
reference: Isaiah 41:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
  footnotes:
  - marker: a
    text: Or “of the joining,” “of the solder,” or less likely “of the glue.” The Hebrew term refers to the material or process by which the crafted object is joined together.
    reason: lexical_alternative
  - marker: b
    text: Or “so that it will not be moved” or “so that it will not topple.”
    reason: lexical_alternative
translation:
  language: ko
  text: 장인은 금속 세공인의 힘을 북돋우고, 망치로 매끈하게 다듬는 자는 모루를 치는 자의 힘을 북돋우며, 접합에 대하여 “좋다”라고 말합니다.[a] 그리고 그것을 못으로 단단히 고정하여 흔들리지 않게 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “붙임”, “납땜”, 덜 가능하게는 “풀”. 히브리어는 제작된 물체를 이어 붙이는 재료나 과정을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “움직이지 않게” 또는 “넘어지지 않게”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  english_pob_choice: strengthens
  chosen_korean: 강하게 하고
  alternatives_korean:
  - 굳세게 하고
  - 튼튼하게 하고
  - 북돋우고
  lexicon: HALOT
  rationale: חזק의 핵심 의미를 살려 사람을 ‘강하게 하다’로 옮기되, 장면의 연쇄 동작이 자연스럽게 이어지도록 했습니다.
- source_word: חָרָשׁ
  english_pob_choice: craftsman
  chosen_korean: 목수
  alternatives_korean:
  - 장인
  - 기술자
  - 공예가
  lexicon: HALOT
  rationale: 문맥상 제작자를 가리키지만, 한국어에서는 일반적인 ‘장인’보다 구체적이고, 뒤의 금속세공인과 대비되는 작업자 이미지를 살릴 수 있어 ‘목수’를 택했습니다.
- source_word: צֹרֵף
  english_pob_choice: metalworker
  chosen_korean: 금속세공인
  alternatives_korean:
  - 금세공인
  - 대장장이
  - 금속공
  lexicon: HALOT
  rationale: צֹרֵף는 금을 포함한 금속을 다루는 사람을 가리킬 수 있으므로, 영어 POB의 broader reading에 맞춰 과도하게 ‘금세공인’으로 좁히지 않고 ‘금속세공인’으로 옮겼습니다.
- source_word: לַדֶּבֶק
  english_pob_choice: of the soldering
  chosen_korean: 접합
  alternatives_korean:
  - 납땜
  - 붙임
  - 접착
  lexicon: HALOT
  rationale: 이 어휘는 붙이는 재료나 접합 과정을 가리킬 수 있어, 금속 작업 맥락을 유지하면서도 물질을 단정하지 않는 ‘접합’이 가장 안전합니다.
- source_word: לֹא יִמּוֹט
  english_pob_choice: so that it will not totter
  chosen_korean: 흔들리지 않게 합니다
  alternatives_korean:
  - 넘어지지 않게 합니다
  - 비틀거리지 않게 합니다
  - 움직이지 않게 합니다
  lexicon: HALOT
  rationale: מוט의 기본 이미지를 한국어에서 자연스럽게 전달하되, 우상 제작의 아이러니를 과장하지 않도록 ‘흔들리다’로 완곡하고도 분명하게 옮겼습니다.
theological_decisions:
- issue: 우상 제작 장면의 풍자적 효과
  chosen_reading: 본문의 노골적인 조롱을 살리되, 해설어를 덧붙이지 않고 제작 과정 자체를 그대로 제시했습니다.
  alternative_readings:
  - ‘우상’을 본문에 명시적으로 삽입하는 번역
  rationale: 히브리어는 장인들의 상호 보강과 고정 행위를 묘사할 뿐이므로, 본문 밖의 설명을 추가하지 않는 편이 예언자적 풍자를 더 선명하게 드러냅니다.
  doctrine_reference: '원문 우선 원칙: 본문이 말하는 만큼만 번역하고, 해설은 각주나 주해로 분리합니다.'
