id: ISA.41.17
reference: Isaiah 41:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 이들과 궁핍한 이들이 물을 찾지만 물이 없으며, 그들의 혀는 갈증으로 말라 있습니다. 나 야훼[a]가 그들에게 응답하겠으며, 나 이스라엘의 하나님이 그들을 버리지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 고유명 יְהוָה를 ‘야훼’로 옮겼습니다.
    reason: divine-name rendering
lexical_decisions:
- source_word: הָעֲנִיִּים
  english_pob_choice: the poor
  chosen_korean: 가난한 자들
  alternatives_korean:
  - 가난한 사람들
  - 빈곤한 자들
  - 궁핍한 자들
  lexicon: HALOT
  rationale: עֲנִיִּים는 경제적 궁핍과 억눌린 상태를 함께 가리킬 수 있으므로, 평행하는 אֶבְיוֹנִים과 함께 한국어로는 가장 자연스럽고 직설적인 ‘가난한 자들’로 옮겼습니다.
- source_word: וְהָאֶבְיוֹנִים
  english_pob_choice: and needy
  chosen_korean: 궁핍한 자들
  alternatives_korean:
  - 가난한 자들
  - 빈궁한 자들
  - 결핍한 자들
  lexicon: HALOT
  rationale: אֶבְיוֹנִים은 단순 감정적 ‘필요함’보다 실제 결핍과 궁핍을 더 강하게 드러내므로, 앞의 ‘가난한 자들’과 구별되게 ‘궁핍한 자들’로 유지했습니다.
- source_word: נָשָׁתָּה
  english_pob_choice: is parched
  chosen_korean: 말라 있습니다
  alternatives_korean:
  - 바짝 말라 있습니다
  - 바싹 말라 있습니다
  - 메말라 있습니다
  lexicon: HALOT
  rationale: 혀가 물 부족으로 심하게 마른 이미지를 한국어에서 가장 직접적으로 전달하는 표현으로 ‘말라 있습니다’를 택했습니다. ‘메마르다’보다 신체적 상태가 더 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 프로젝트 기본어휘에 따라 יְהוָה는 ‘야훼’로 옮겨, 본문의 언약적 자기선언을 약화시키지 않으면서도 원문 이름을 드러냈습니다.
- source_word: אֶעֱנֵם
  english_pob_choice: will answer them
  chosen_korean: 그들에게 응답하겠고
  alternatives_korean:
  - 그들에게 대답하겠고
  - 그들에게 응답하겠습니다
  - 그들에게 답하겠고
  lexicon: HALOT
  rationale: ענה는 단순 답변보다 부르짖음에 대한 응답의 뉘앙스가 있으므로, 예언문맥에 어울리는 ‘응답하겠고’로 옮겼습니다.
- source_word: לֹא אֶעֶזְבֵם
  english_pob_choice: will not forsake them
  chosen_korean: 그들을 버리지 않겠습니다
  alternatives_korean:
  - 그들을 떠나지 않겠습니다
  - 그들을 저버리지 않겠습니다
  - 그들을 버려두지 않겠습니다
  lexicon: HALOT
  rationale: עזב는 관계를 끊고 내버려두는 뜻을 강하게 가질 수 있어, 한국어에서는 언약적 거절감을 분명히 하는 ‘버리지 않겠습니다’가 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 문장 내 직접 화자 강조
  chosen_reading: “내가 야훼이니 … 내가 이스라엘의 하나님이니 …”로 옮겨, 화자의 자기선언을 반복해서 드러냈습니다.
  alternative_readings:
  - “나는 야훼이다”
  - “주님이니”
  rationale: 히브리어의 독립 인칭대명사 אֲנִי가 주는 강조를 살리기 위해, 한국어에서도 ‘내가’의 반복으로 자기계시의 힘을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
