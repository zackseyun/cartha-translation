translation:
  language: ko
  text: 나는 광야에 백향목과 아카시아와 도금양과 감람나무를 두겠습니다.[a] 사막에는 사이프러스와 플라타너스와 소나무를 함께 두겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감람나무’는 관례적인 번역입니다. 히브리어는 문자적으로 ‘기름의 나무’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 세 나무의 정확한 종은 불확실합니다. ‘사이프러스’는 노간주나무나 전나무, ‘플라타너스’는 느릅나무, ‘소나무’는 회양목으로도 식별될 수 있습니다.
    reason: lexical_alternative
