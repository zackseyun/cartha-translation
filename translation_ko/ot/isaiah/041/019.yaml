  yaml_path: translation/ot/isaiah/041/019.yaml
  text: I will put in the wilderness cedar[a], acacia, myrtle, and olive tree; I will set in the desert cypress, plane tree, and pine together[b],
  footnotes:
  - marker: a
    text: 'Or ''oil tree'' for ''olive tree'' (Hebrew: ''tree of oil'').'
    reason: lexical_alternative
  - marker: b
    text: The exact species of 'cypress,' 'plane tree,' and 'pine' are uncertain; possible alternatives include 'juniper' or 'fir,' 'elm,' and 'box tree' respectively.
