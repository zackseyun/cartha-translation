translation:
  language: ko
  text: 내가 광야에 백향목과 아카시아와 도금양과 감람나무를 두겠습니다. 사막에 잣나무와 플라타너스와 소나무를 함께 세우겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감람나무’는 관례적 번역이며, 히브리어는 문자적으로는 ‘기름의 나무’입니다.
    reason: lexical_alternative
  - marker: b
    text: 세 나무의 정확한 종은 불확실합니다. ‘잣나무’, ‘플라타너스’, ‘소나무’는 통용 번역이며, 다른 가능한 식별이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֵּן
  english_pob_choice: I will put
  chosen_korean: 두겠습니다
  alternatives_korean:
  - 놓겠습니다
  - 두어 주겠습니다
  lexicon: HALOT
  rationale: 대상들을 특정 장소에 ‘두다’는 뜻을 자연스럽게 살리면서, 한국어에서는 식물을 한곳에 배치하는 표현으로 가장 간결합니다.
- source_word: בַּמִּדְבָּר / בָּעֲרָבָה
  english_pob_choice: in the wilderness / in the desert
  chosen_korean: 광야 / 사막
  alternatives_korean:
  - 들판 / 메마른 땅
  - 황무지 / 아라바
  lexicon: HALOT
  rationale: 두 지명성 명사가 병렬로 나오므로 한국어에서도 서로 다른 어감을 살려 ‘광야’와 ‘사막’으로 구분했습니다.
- source_word: עֵץ שָׁמֶן
  english_pob_choice: olive tree
  chosen_korean: 감람나무
  alternatives_korean:
  - 올리브나무
  - 기름나무
  lexicon: HALOT
  rationale: 본문의 관례적 식물명은 감람나무이며, 영어 본문의 각주가 지적하듯 직역 가능성인 ‘기름나무’는 본문보다 주석에 두는 편이 적절합니다.
- source_word: בְּרוֹשׁ / תִּדְהָר / תְאַשּׁוּר
  english_pob_choice: cypress / plane tree / pine
  chosen_korean: 잣나무 / 플라타너스 / 소나무
  alternatives_korean:
  - 노간주나무 / 느릅나무 / 박달나무
  - 사이프러스 / 느릅나무 / 회양목
  lexicon: HALOT
  rationale: 세 나무의 정확한 종이 불확실하므로, 한국어에서 널리 통하는 식물명을 택하되 종 식별의 불확실성은 과도하게 단정하지 않도록 했습니다.
theological_decisions:
- issue: 풍성한 회복의 이미지가 식물 나열로 어떻게 전달되는가
  chosen_reading: 광야와 사막에 실제로 나무들을 ‘두고 세우는’ 묘사로 옮겨, 황폐한 곳이 생명과 아름다움의 장소로 바뀌는 대비를 살렸습니다.
  alternative_readings:
  - 비유적으로만 완화하여 ‘자라게 하겠습니다’로 옮김
  - 문학성을 위해 식물명을 일반화함
  rationale: 히브리어는 단순한 조경보다 하나님의 주권적 조성 행위를 강조하므로, 장소와 식물의 구체성을 유지하는 것이 본문의 힘을 잘 드러냅니다.
  doctrine_reference: 이사야 41장의 회복과 새 창조의 예언적 이미지
- issue: ‘광야’와 ‘사막’의 구분
  chosen_reading: 두 표현을 모두 살려 병렬 구조를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘광야’로 통일
  - 둘 다 ‘사막’으로 통일
  rationale: 원문은 בַּמִּדְבָּר와 בָּעֲרָבָה를 병치해 어휘적 반복보다 범위와 분위기의 차이를 보여 주므로, 한국어에서도 구분이 필요합니다.
  doctrine_reference: 히브리 시가의 평행법과 의미 증폭
