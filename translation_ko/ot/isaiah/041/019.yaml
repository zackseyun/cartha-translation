theological_decisions:
- issue: 풍성한 회복의 이미지가 식물 나열로 어떻게 전달되는가
  chosen_reading: 광야와 사막에 실제로 나무들을 ‘두고 세우는’ 묘사로 옮겨, 황폐한 곳이 생명과 아름다움의 장소로 바뀌는 대비를 살렸습니다.
  alternative_readings:
  - 비유적으로만 완화하여 ‘자라게 하겠습니다’로 옮김
  - 문학성을 위해 식물명을 일반화함
  rationale: 히브리어는 단순한 조경보다 하나님의 주권적 조성 행위를 강조하므로, 장소와 식물의 구체성을 유지하는 것이 본문의 힘을 잘 드러냅니다.
  doctrine_reference: 이사야 41장의 회복과 새 창조의 예언적 이미지
- issue: ‘광야’와 ‘사막’의 구분
  chosen_reading: 두 표현을 모두 살려 병렬 구조를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘광야’로 통일
  - 둘 다 ‘사막’으로 통일
  rationale: 원문은 בַּמִּדְבָּר와 בָּעֲרָבָה를 병치해 어휘적 반복보다 범위와 분위기의 차이를 보여 주므로, 한국어에서도 구분이 필요합니다.
  doctrine_reference: 히브리 시가의 평행법과 의미 증폭
