  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
  footnotes:
  - marker: a
    text: Or, more literally, “the one who loves me.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 너는, 이스라엘, 내 종 야곱아, 내가 택한 너, 아브라함의 씨요 나의 친구인 자야—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “나를 사랑하는 자.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 너희는
  lexicon: BHS/WLC
  rationale: 문맥상 열방과 우상숭배자들과의 강한 대조를 드러내므로, 한국어에서는 접속적 ‘그리고’보다 역전환을 분명히 하는 ‘그러나’가 원문의 विरोध적 힘을 잘 살립니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종이
  - 내 노예
  lexicon: HALOT
  rationale: 여기서는 언약적 호칭으로서의 עבד의 의미가 핵심이므로 ‘종’이 자연스럽고, ‘노예’는 본문이 강조하는 관계적 호칭을 지나치게 물질적으로 만들 수 있습니다.
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  english_pob_choice: whom I have chosen
  chosen_korean: 내가 택한 너
  alternatives_korean:
  - 내가 선택한 너
  - 내가 택한 자
  lexicon: HALOT
  rationale: 히브리어 관계절은 야곱/이스라엘을 수식하며 하나님의 이미 이루어진 선택을 나타내므로, 한국어에서는 ‘내가 택한 너’로 간결하게 옮겨 주어 현재적 효력을 살렸습니다.
- source_word: זֶרַע אַבְרָהָם
  english_pob_choice: offspring of Abraham
  chosen_korean: 아브라함의 씨
  alternatives_korean:
  - 아브라함의 후손
  - 아브라함의 자손
  lexicon: HALOT
  rationale: זֶרַע는 집합적 단수이므로 ‘씨’가 원문의 집합성을 가장 직접적으로 보존합니다. 다만 현대어로는 다소 문어적이지만, 본문 구조를 살리기 위해 유지했습니다.
- source_word: אֹהֲבִי
  english_pob_choice: my friend
  chosen_korean: 나의 친구인 자
  alternatives_korean:
  - 나를 사랑하는 자
  - 나의 사랑하는 자
  lexicon: HALOT
  rationale: 아브라함에 대한 호칭으로서 단순한 행위 묘사보다 관계적 친밀성을 드러내는 의미가 강하므로, ‘나의 친구’로 옮기되, 문장 안에서는 수식 구조를 분명히 하기 위해 ‘인 자’를 덧붙였습니다.
theological_decisions:
- issue: אֹהֲבִי의 관계적 의미를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘나의 친구’로 옮겨, 아브라함과 하나님의 친밀한 언약 관계를 강조했습니다.
  alternative_readings:
  - ‘나를 사랑하는 자’로 직역할 수 있습니다.
  rationale: 히브리어 분사가 문자적으로는 ‘나를 사랑하는 자’이지만, 이 문맥에서는 아브라함의 특별한 관계를 가리키는 관용적 표현으로 읽는 것이 자연스럽습니다. 따라서 의미를 과도하게 축소하지 않으면서도 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
