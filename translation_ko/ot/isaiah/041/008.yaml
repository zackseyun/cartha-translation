revisions:
- from: 그러나 너는, 이스라엘, 내 종 야곱아, 내가 택한 너, 아브라함의 씨요 나의 친구인 자야—[a]
  to: 그러나 너, 이스라엘아, 내 종아, 내가 택한 야곱아, 나의 벗[a] 아브라함의 자손아—
  rationale: 호격과 동격의 연쇄를 한국어 문장 구조에 맞게 정리했습니다. ‘아브라함의 씨’는 현대 표준어에서 생물학적 의미가 두드러질 수 있으므로 집합적 혈통·계보 의미를 자연스럽게 나타내는 ‘아브라함의 자손’으로 바꾸었습니다. ‘나의 벗’의 대안인 문자적 독법은 해당 표현에 직접 연결된 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:54Z'
