  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רִאשׁ֥וֹן לְ/צִיּ֖וֹן הִנֵּ֣ה הִנָּ֑/ם וְ/לִ/ירוּשָׁלִַ֖ם מְבַשֵּׂ֥ר אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
  footnotes:
  - marker: a
    text: Or, 'Behold, here they are!'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not explicitly identify who 'they' are; the phrase may refer to the people or events just announced.
    reason: alternative_reading
  - marker: c
    text: Or, 'I will give Jerusalem a messenger who brings good news.'
    reason: lexical_alternative
  - marker: d
    text: Or 'First to Zion:'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 처음으로 시온에게 말합니다. 「보십시오, 그들이 여기에 있습니다!」 그리고 예루살렘에는 좋은 소식을 전하는 전령을 제가 줍니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִאשׁוֹן은 ‘처음’ 또는 ‘먼저’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들이’가 누구인지 분명히 밝히지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는, ‘보십시오, 여기 있습니다!’
    reason: lexical_alternative
  - marker: d
    text: 또는, ‘시온에게 먼저 말하는 이는:’
    reason: previous_rendering
lexical_decisions:
- source_word: רִאשׁוֹן
  english_pob_choice: The first
  chosen_korean: 제가 처음으로
  alternatives_korean:
  - 처음으로
  - 첫째로
  - 먼저
  lexicon: HALOT
  rationale: 히브리어 רִאשׁוֹן은 ‘처음’과 ‘먼저’의 뜻을 가질 수 있으므로, 한국어에서는 문맥상 자연스럽게 ‘제가 처음으로’로 옮겨 첫 발화·첫 선언의 뉘앙스를 살렸습니다.
- source_word: לְצִיּוֹן
  english_pob_choice: to Zion
  chosen_korean: 시온에게
  alternatives_korean:
  - 시온으로
  - 시온을 향해
  lexicon: HALOT
  rationale: ל 전치사는 여기서 방향·대상 표시로 읽히므로, 선언의 수신자를 분명히 하는 한국어 조사 ‘에게’를 사용했습니다.
- source_word: הִנֵּה הִנָּם
  english_pob_choice: Look, here they are!
  chosen_korean: 보십시오, 그들이 여기에 있습니다!
  alternatives_korean:
  - 보라, 그들이 여기에 있습니다!
  - 보십시오, 여기 있습니다!
  - 보십시오, 그들이 있습니다!
  lexicon: HALOT
  rationale: 이중 지시 표현의 강조를 살리되 현대 한국어에서 자연스러운 공손 명령형 ‘보십시오’로 옮겼고, 복수 대명사는 히브리어의 복수성을 반영해 ‘그들이’로 두었습니다.
- source_word: מְבַשֵּׂר
  english_pob_choice: a herald of good news
  chosen_korean: 좋은 소식을 전하는 전령
  alternatives_korean:
  - 기쁜 소식을 전하는 전령
  - 복음을 전하는 전령
  - 좋은 소식을 전하는 사람
  lexicon: HALOT
  rationale: 분사 מְבַשֵּׂר는 ‘좋은 소식을 알리는 자’를 뜻하므로, 행위와 직분감을 함께 담는 ‘좋은 소식을 전하는 전령’으로 옮겼습니다.
- source_word: אֶתֵּן
  english_pob_choice: I give
  chosen_korean: 제가 줍니다
  alternatives_korean:
  - 제가 주겠습니다
  - 제가 줍니다/주겠습니다
  - 제가 주어 보냅니다
  lexicon: HALOT
  rationale: 예언적 현재를 살려 ‘주겠습니다’보다 현재형 ‘줍니다’를 택해, 즉각적이고 선언적인 어조를 유지했습니다.
theological_decisions:
- issue: ‘그들이’의 지시 대상이 본문에 명시되지 않음
  chosen_reading: 지시 대상을 한국어 본문에서도 밝히지 않고 그대로 두었습니다.
  alternative_readings:
  - 포로 귀환자들
  - 예고된 일들
  - 구원의 사자들
  rationale: 히브리어는 복수 대명사의 지시 대상을 명시하지 않으므로, 본문이 허용하는 모호성을 유지해 해석을 앞서 결정하지 않았습니다.
  doctrine_reference: 해석의 범위를 본문이 제시하는 만큼만 유지
