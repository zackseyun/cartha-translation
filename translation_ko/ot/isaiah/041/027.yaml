base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
  footnotes:
  - marker: a
    text: Or, 'Behold, here they are!'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not explicitly identify who 'they' are; the phrase may refer to the people or events just announced.
    reason: alternative_reading
  - marker: c
    text: Or, 'I will give Jerusalem a messenger who brings good news.'
    reason: lexical_alternative
  - marker: d
    text: Or 'First to Zion:'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 시온에게 먼저[a] 「보십시오[c], 그들이 여기 있습니다![b]」라고 말하고[d], 예루살렘에는 좋은 소식을 알리는 전령을 줍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִאשׁוֹן은 ‘처음’, ‘먼저’ 또는 ‘첫 번째인 이’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들이’가 누구를 가리키는지 분명히 밝히지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는, ‘보십시오, 여기 있습니다!’
    reason: lexical_alternative
  - marker: d
    text: '직역하면, ‘시온에게 먼저: 보십시오, 그들이 여기 있다!’와 같이 매우 압축되어 있습니다. 첫 구절에는 명시된 동사가 없으며, 여기서는 뒤의 ‘내가 줍니다’와 문맥에 따라 ‘내가 … 말하고’를 보충했습니다.'
    reason: previous_rendering
lexical_decisions:
- source_word: רִאשׁוֹן
  english_pob_choice: The first
  chosen_korean: 제가 처음으로
  alternatives_korean:
