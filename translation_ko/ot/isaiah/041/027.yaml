revisions:
- from: 제가 처음으로 시온에게 말합니다. 「보십시오, 그들이 여기에 있습니다!」 그리고 예루살렘에는 좋은 소식을 전하는 전령을 제가 줍니다.[a][b][c][d]
  to: 내가 시온에게 먼저[a] 「보십시오[c], 그들이 여기 있습니다![b]」라고 말하고[d], 예루살렘에는 좋은 소식을 알리는 전령을 줍니다.
  rationale: 첫 구절의 난해하고 압축된 히브리어 구문을 한국어 문장으로 풀되, 명시되지 않은 ‘그들’의 지시 대상은 추가하지 않았습니다. 1인칭 화자의 표현을 ‘제가’에서 ‘내가’로 바로잡고, 전령 표현과 각주 표지를 자연스럽게 정리했습니다.
