  - 첫째로
  - 먼저
  lexicon: HALOT
  rationale: 히브리어 רִאשׁוֹן은 ‘처음’과 ‘먼저’의 뜻을 가질 수 있으므로, 한국어에서는 문맥상 자연스럽게 ‘제가 처음으로’로 옮겨 첫 발화·첫 선언의 뉘앙스를 살렸습니다.
- source_word: לְצִיּוֹן
  english_pob_choice: to Zion
  chosen_korean: 시온에게
  alternatives_korean:
  - 시온으로
  - 시온을 향해
  lexicon: HALOT
  rationale: ל 전치사는 여기서 방향·대상 표시로 읽히므로, 선언의 수신자를 분명히 하는 한국어 조사 ‘에게’를 사용했습니다.
- source_word: הִנֵּה הִנָּם
  english_pob_choice: Look, here they are!
  chosen_korean: 보십시오, 그들이 여기에 있습니다!
  alternatives_korean:
  - 보라, 그들이 여기에 있습니다!
  - 보십시오, 여기 있습니다!
  - 보십시오, 그들이 있습니다!
  lexicon: HALOT
  rationale: 이중 지시 표현의 강조를 살리되 현대 한국어에서 자연스러운 공손 명령형 ‘보십시오’로 옮겼고, 복수 대명사는 히브리어의 복수성을 반영해 ‘그들이’로 두었습니다.
- source_word: מְבַשֵּׂר
  english_pob_choice: a herald of good news
  chosen_korean: 좋은 소식을 전하는 전령
  alternatives_korean:
  - 기쁜 소식을 전하는 전령
  - 복음을 전하는 전령
  - 좋은 소식을 전하는 사람
  lexicon: HALOT
  rationale: 분사 מְבַשֵּׂר는 ‘좋은 소식을 알리는 자’를 뜻하므로, 행위와 직분감을 함께 담는 ‘좋은 소식을 전하는 전령’으로 옮겼습니다.
- source_word: אֶתֵּן
  english_pob_choice: I give
  chosen_korean: 제가 줍니다
  alternatives_korean:
  - 제가 주겠습니다
  - 제가 줍니다/주겠습니다
  - 제가 주어 보냅니다
  lexicon: HALOT
  rationale: 예언적 현재를 살려 ‘주겠습니다’보다 현재형 ‘줍니다’를 택해, 즉각적이고 선언적인 어조를 유지했습니다.
theological_decisions:
- issue: ‘그들이’의 지시 대상이 본문에 명시되지 않음
  chosen_reading: 지시 대상을 한국어 본문에서도 밝히지 않고 그대로 두었습니다.
  alternative_readings:
