reference: Esther 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
  footnotes:
  - marker: a
    text: Or 'courtyard' for 'court.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'she bore/carried favor in his eyes,' an idiom meaning she received his favorable regard.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''touched the tip of the scepter.'' Hebrew: ''the head of the scepter.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 에스더 왕비가 뜰에 서 있는 것을 보았을 때, 그녀는 그의 눈에 은총을 입었습니다. 왕은 손에 들고 있던 금 규를 에스더에게 내밀었고, 에스더는 가까이 나아가 규 끝에 손을 댔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정 뜰’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 눈에 은총을 지니다/가지다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘규의 끝’을 뜻합니다. 히브리어는 문자적으로 ‘규의 머리(머리 부분)’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: Esther the queen
  chosen_korean: 에스더 왕비
  alternatives_korean:
  - 왕비 에스더
  - 에스더 여왕
  lexicon: HALOT
  rationale: 히브리어의 이름-호칭 apposition을 자연스러운 현대 한국어로 옮기되, 궁정 서술의 품위를 유지하기 위해 ‘왕비’를 썼습니다.
- source_word: עֹמֶדֶת בֶּחָצֵר
  english_pob_choice: standing in the court
  chosen_korean: 뜰에 서 있는
  alternatives_korean:
  - 궁정에 서 있는
  - 마당에 서 있는
  lexicon: HALOT
  rationale: חָצֵר는 왕실 문맥에서 ‘뜰/궁정 뜰’의 뜻이 살아 있어, 지나치게 제도적인 ‘궁정’보다 공간감이 드러나는 ‘뜰’이 적절합니다.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  english_pob_choice: she found favor in his sight
  chosen_korean: 그의 눈에 은총을 입었습니다
  alternatives_korean:
  - 그의 눈에 호의를 얻었습니다
  - 그의 눈에 은혜를 얻었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘눈에 호의/은총을 얻다’이므로, 직역성을 살리면서도 한국어로는 자연스러운 ‘은총을 입다’로 표현했습니다.
- source_word: שַׁרְבִיט הַזָּהָב
  english_pob_choice: the golden scepter
  chosen_korean: 금 규
  alternatives_korean:
  - 황금 홀
  - 금지팡이
  lexicon: HALOT
  rationale: 왕권을 나타내는 상징물이라는 점을 살리기 위해 전통적으로 쓰이는 ‘규’를 채택했고, ‘금’으로 재질을 분명히 했습니다.
theological_decisions:
- issue: 왕이 금 규를 내미는 행위의 의미
  chosen_reading: 왕의 수용과 호의가 표지된 제스처로 이해했습니다.
  alternative_readings:
  - 즉시적 용서나 면허 부여의 확정 행위로 읽는 해석
  - 단순한 의례적 동작으로만 축소하는 해석
  rationale: 본문은 에스더가 왕의 은총을 입은 직후 왕이 규를 내미는 서술을 통해 접근 허용과 호의를 분명히 보여 주므로, 그 긴장을 살려 번역했습니다.
  doctrine_reference: 서술 문맥에 따른 의미 보존
- issue: hātsēr/‘court’의 공간감
  chosen_reading: 왕실의 외곽 뜰로 읽어, 에스더가 허락 없이 접근 가능한 경계 공간임을 드러냈습니다.
  alternative_readings:
  - 제도적 ‘궁정’으로만 읽는 해석
  - 단순한 ‘마당’으로 낮추는 해석
  rationale: 이 장면의 긴장은 왕 앞 접근의 위험과 허용에 있으므로, 공간의 위계가 느껴지되 한국어로도 자연스러운 ‘뜰’이 적합합니다.
  doctrine_reference: 서사 맥락 보존
