  naturalness: ‘왕궁 맞은편, 곧 왕의 집 맞은편에 섰습니다’는 같은 공간 관계를 어색하게 중복합니다. ‘왕의 거처를 마주 보고’ 및 ‘출입구를 마주 보고’로 정리하면 현대 표준 한국어 합쇼체에서 자연스럽고 공간 관계도 선명해집니다.
