base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: Now on the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
  footnotes:
  - marker: a
    text: Or 'put on royalty,' that is, royal attire or regalia.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house' can also mean 'palace' in this court setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 사흗날에 에스더는 왕후의 예복을 입고 왕궁의 안쪽 뜰에서 왕의 거처를 마주 보고 섰습니다.[a] 왕은 왕궁 안에서 왕좌에 앉아 그 건물의 출입구를 마주 보고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַלְכוּת는 문자적으로 ‘왕권’ 또는 ‘왕의 위엄’을 뜻하지만, 여기서는 왕실 의복이나 예복을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘집’은 이 궁정 문맥에서 ‘궁궐’ 또는 ‘왕궁’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּלְבַּשׁ ... מַלְכוּת
  english_pob_choice: put on her royal robes
  chosen_korean: 왕후의 옷을 입고
  alternatives_korean:
  - 왕의 위엄을 입고
  - 왕복을 입고
  - 왕의 예복을 입고
  lexicon: HALOT
  rationale: מַלְכוּת는 문자적으로 ‘왕권/왕의 위엄’이지만 이 문맥에서는 실제 의복, 곧 궁정 의복을 가리키므로 한국어에서는 자연스럽게 ‘왕후의 옷’으로 옮겼습니다.
- source_word: בַּחֲצַר בֵּית הַמֶּלֶךְ הַפְּנִימִית
  english_pob_choice: in the inner court of the king’s palace
  chosen_korean: 왕의 궁 안쪽 뜰에
  alternatives_korean:
  - 왕의 궁궐 안뜰에
  - 왕의 집 안쪽 뜰에
  lexicon: HALOT
  rationale: בֵּית הַמֶּלֶךְ는 여기서 단순한 ‘집’보다 궁정 공간을 뜻하므로, 문맥에 맞게 ‘궁’으로 풀어 왕실 건물군의 분위기를 살렸습니다.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ ... נֹכַח פֶּתַח הַבָּיִת
  english_pob_choice: opposite the king’s house ... opposite the entrance of the house
  chosen_korean: 왕궁 맞은편, 곧 왕의 집 맞은편 ... 집 문 맞은편
  alternatives_korean:
  - 왕의 집 앞
  - 왕의 집 정면
  - 출입문 맞은편
  lexicon: HALOT
  rationale: נֹכַח는 단순히 ‘앞’이 아니라 ‘맞은편/마주보는 위치’를 뜻하므로, 공간 관계를 분명하게 드러내는 ‘맞은편’을 유지했습니다.
- source_word: כִּסֵּא מַלְכוּתוֹ
  english_pob_choice: his royal throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 왕의 왕좌
  - 왕권의 보좌
  - 왕의 옥좌
  lexicon: HALOT
  rationale: ‘왕좌’는 왕의 왕위 좌석을 간결하게 드러내며, 영어 POB의 ‘royal throne’과 의미상 대응됩니다.
theological_decisions:
- issue: 에스더가 ‘왕후의 옷’을 입는 표현의 의미
  chosen_reading: 본문은 에스더의 신분을 드러내는 궁정 복장을 강조하며, 단순한 장식보다 왕실 접근을 위한 정당한 준비를 보여줍니다.
  alternative_readings:
  - 왕권 자체를 상징하는 비유로 읽기
  - 예복의 종류를 지나치게 특정하기
  rationale: 히브리어 מַלְכוּת는 여기서 추상적 ‘왕권’과 구체적 ‘왕실 의복’ 사이의 긴장을 가지므로, 의미를 과도하게 한쪽으로만 고정하지 않고 문맥상 필요한 수준에서만 구체화했습니다.
  doctrine_reference: 문맥 우선의 의미 해석
- issue: ‘집/궁/궁궐’의 선택
  chosen_reading: ‘궁’과 ‘왕궁’으로 옮겨 궁정 장면의 공간감을 살렸습니다.
  alternative_readings:
  - 전부 ‘집’으로 옮기기
  - 전부 ‘궁궐’로 통일하기
  rationale: 히브리어 בַּיִת의 반복은 같은 건물을 가리키면서도 왕실 거처와 건물의 출입구를 보여 주는 장치이므로, 한국어에서는 장면 이해를 돕는 범위에서만 차이를 드러냈습니다.
  doctrine_reference: 서사 문맥의 공간적 대비
