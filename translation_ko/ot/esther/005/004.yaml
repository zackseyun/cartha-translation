  text: וַ/תֹּ֣אמֶר אֶסְתֵּ֔ר אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב יָב֨וֹא הַ/מֶּ֤לֶךְ וְ/הָמָן֙ הַ/יּ֔וֹם אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשִׂ֥יתִי לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
  footnotes:
  - marker: a
    text: Or, “If it pleases the king.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “for him,” apparently referring specifically to the king, though Haman is also invited.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더가 말했습니다[a]. 「왕께서 좋게 여기시면[b], 왕과 하만이 오늘 제가 마련한 잔치에 오십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「왕께서 좋게 여기시면」.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로는 “왕에게 좋으면”이라는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: If it pleases the king / If it seems good to the king
  chosen_korean: 왕께서 좋게 여기시면
  alternatives_korean:
  - 왕의 마음에 들면
  - 왕께서 기뻐하시면
  lexicon: HALOT
  rationale: 히브리어 관용구는 왕의 호의적 승인에 대한 공손한 요청이므로, 현대 한국어에서는 ‘좋게 여기시다’가 의미와 궁정적 공손함을 함께 살립니다.
- source_word: יָבֹוא
  english_pob_choice: let ... come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오게 하십시오
  - 오시게 하십시오
  lexicon: HALOT
  rationale: 요청문에서의 의지/청유를 한국어 공손 명령형으로 옮겨, 왕에게 직접 드리는 초청의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: הַמִּשְׁתֶּה
  english_pob_choice: the banquet
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 식사 자리
  lexicon: HALOT
  rationale: 본문은 궁정의 공식 초대를 가리키므로 ‘잔치’가 가장 자연스럽고, 준비된 식사와 즐거움을 아우르는 의미를 유지합니다.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  english_pob_choice: that I have prepared for him
  chosen_korean: 제가 마련한
  alternatives_korean:
  - 제가 준비한
  - 제가 베푼
  lexicon: HALOT
  rationale: עָשָׂה의 일반적 ‘하다/만들다’보다 잔치를 문맥상 ‘마련하다/준비하다’로 옮기는 것이 한국어에서 더 정확하며, לוֹ의 단수 지시 대상을 그대로 살렸습니다.
theological_decisions:
- issue: 왕과 하만을 함께 초대하면서도 לוֹ(‘그를 위하여’)가 단수인 표현
  chosen_reading: ‘제가 마련한’ 뒤의 목적 대상을 일반화하지 않고, 본문처럼 단수 지시를 그대로 두었습니다.
  alternative_readings:
  - ‘그들을 위해’로 복수화
  - ‘왕과 하만을 위해’로 명시화
  rationale: 히브리어는 잔치의 수혜 대상을 단수로 표현해 왕을 우선 가리키는 뉘앙스를 남기므로, 복수화하거나 매끈하게 재구성하면 본문의 긴장과 미묘함이 약해집니다.
  doctrine_reference: 본문의 서사적 수사와 지시 대상 보존
