  source_fidelity: 첫 문장의 ‘세레스와 그의 아내’는 세레스가 하만의 아내라는 원문 관계를 뒤바꿉니다. 또한 עֵץ를 ‘세우다’로 옮기기보다 원문의 일반 동사 ‘만들다’를 유지하는 편이 안전합니다. וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן은 ‘그 일이 하만의 마음에 들었다’가 자연스럽고 충실합니다.
  naturalness: 합쇼체는 대체로 적절하나, ‘하만은 이 말이 좋게 여겨져서’는 문법적으로 부자연스럽고 의미상 주체 관계도 흐립니다. ‘그 일이 하만의 마음에 들자’로 고쳤습니다. ‘왕과 함께 잔치에 가셔서 즐거워하십시오’는 권고의 흐름을 자연스럽게 살립니다.
  terminology: ‘나무 형틀’은 עֵץ의 형태와 처형 방식이 불확실한 점을 보존하는 안전한 선택입니다. ‘모르드개’, ‘규빗’, ‘잔치’도 적절합니다. 각주 c는 본문의 ‘매달게’에 붙여야 하며, 원문의 불확실성을 정확히 설명하도록 다듬었습니다.
