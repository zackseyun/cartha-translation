base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
  footnotes:
  - marker: a
    text: Or 'a stake' or 'a pole.' The Hebrew עֵץ can denote wood, tree, or a wooden execution structure; the exact form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Fifty cubits is roughly 75 feet or 23 meters.
    reason: cultural_note
  - marker: c
    text: Or 'to have Mordecai impaled on it.' The Hebrew wording can refer to suspension on a wooden structure, and the precise execution method is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 세레스와 그의 아내와 그의 모든 친구들이 그에게 말했습니다. 「오십 규빗 높이의 나무 형틀을 세우게 하십시오. 그리고 아침에 왕에게 말하여 모르드개를 그것에 매달게 하십시오. 그다음 왕과 함께 잔치에 가서 즐거워하십시오.」 하만은 이 말이 좋게 여겨져서 그 나무 형틀을 만들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֵץ는 나무, 목재, 또는 처형용 목조 구조물을 가리킬 수 있으며, 정확한 형식은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 오십 규빗은 대략 23미터, 약 75피트입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘모르드개를 그것에 찔러 죽이게 하십시오’로 옮길 수도 있습니다. 히브리어는 나무 구조물에 매다는 뜻을 가리킬 수 있으며, 정확한 처형 방식은 논쟁적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  english_pob_choice: his friends
  chosen_korean: 그의 모든 친구들
  alternatives_korean:
  - 그를 사랑하는 사람들
  - 그의 지지자들
  lexicon: HALOT
  rationale: 문자적으로는 ‘그를 사랑하는 이들’이지만, 이 궁정 장면에서는 애정 표현보다 가까운 동료나 측근의 뜻이 강하므로 ‘친구들’로 옮겼습니다.
- source_word: עֵץ
  english_pob_choice: gallows
  chosen_korean: 나무 형틀
  alternatives_korean:
  - 교수대
  - 막대기
  - 나무 기둥
  lexicon: HALOT
  rationale: 에스더서의 이 맥락에서 עֵץ는 살아 있는 ‘나무’보다 공개 처형용 목재 구조물을 가리킬 수 있으므로, 한국어에서는 형틀로 풀어 의미를 드러냈습니다.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  english_pob_choice: to have Mordecai hanged on it
  chosen_korean: 모르드개를 그것에 매달게 하십시오
  alternatives_korean:
  - 모르드개를 그것에 달아죽이게 하십시오
  - 모르드개를 그것에 매달도록 하십시오
  lexicon: HALOT
  rationale: 히브리어는 단순한 처형 명령보다 ‘매달다/달다’의 동작을 말하므로, 그 폭을 좁히지 않고 ‘매달게 하십시오’로 옮겼습니다.
- source_word: וּבַבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 내일 아침에
  - 이튿날 아침에
  lexicon: HALOT
  rationale: 본문은 시점을 단순히 ‘아침’으로 말하므로, 내일이라는 말을 보태지 않고 그대로 살렸습니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: banquet
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 술잔치
  lexicon: HALOT
  rationale: 왕의 식사 자리에 해당하는 말로, 한국어 본문에서는 자연스러운 ‘잔치’가 가장 무난합니다.
theological_decisions:
- issue: 히브리어 עֵץ의 처형 방식이 구체적으로 확정되지 않는 점
  chosen_reading: ‘나무 형틀’로 번역해, 구조물의 성격은 드러내되 처형 방법을 한 가지로 단정하지 않았습니다.
  alternative_readings:
  - 교수대
  - 나무 기둥
  - 말뚝
  rationale: 본문과 POB 주석 모두 정확한 형식이 불확실하다고 보므로, 한국어도 모호성을 유지하는 편이 원문에 충실합니다.
  doctrine_reference: 문자적 세부보다 본문이 의도한 공개 처형 제안을 보존하는 번역 원칙
- issue: וְיִתְלוּ의 처형 동작을 한국어에서 어떻게 표현할지
  chosen_reading: ‘매달게 하십시오’로 두어, 원문의 동작 중심 표현을 유지했습니다.
  alternative_readings:
  - 달아죽이게 하십시오
  - 교수형에 처하게 하십시오
  rationale: 히브리어의 표현은 결과보다 동작을 전면에 두므로, 한국어도 해석을 과도하게 좁히지 않는 편이 좋습니다.
  doctrine_reference: 원문 어휘의 폭을 보존하는 번역 신중성
