revisions:
- from: 그때 세레스와 그의 아내와 그의 모든 친구들이 그에게 말했습니다. 「오십 규빗 높이의 나무 형틀을 세우게 하십시오. 그리고 아침에 왕에게 말하여 모르드개를 그것에 매달게 하십시오. 그다음 왕과 함께 잔치에 가서 즐거워하십시오.」 하만은 이 말이 좋게 여겨져서 그 나무 형틀을 만들었습니다.[a][b][c]
  to: 그의 아내 세레스와 그의 모든 친구들이 그에게 말했습니다. “오십 규빗[b] 높이의 나무 형틀[a]을 만들게 하시고, 아침에 왕에게 말씀드려 모르드개를 그것에 매달게 하십시오[c]. 그러고 나서 왕과 함께 잔치에 가셔서 즐거워하십시오.” 그 일이 하만의 마음에 들자, 그는 그 나무 형틀을 만들었습니다.
  rationale: 세레스를 하만의 아내로 바로잡고, ‘만들다’와 ‘하만의 마음에 들다’라는 원문 표현을 자연스러운 현대 한국어로 반영했습니다. עֵץ 및 처형 방식의 불확실성은 본문과 각주에서 그대로 유지했으며, 각주 표지를 해당 어휘와 수량에 맞게 배치했습니다.
