translation:
  language: ko
  text: 왕이 포도주 잔치[a]에서 에스더에게 말했습니다. “그대의 청원이 무엇입니까? 그것이 그대에게 허락될 것입니다. 또 그대의 요청이 무엇입니까? 왕국[b]의 절반까지라도 그대로 이루어질 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “포도주의 연회.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 “내 왕국”이라는 소유격이 명시되어 있지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  english_pob_choice: at the wine banquet
  chosen_korean: 와인 잔치에서
  alternatives_korean:
  - 포도주 잔치에서
  - 술잔치에서
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 잔치/연회를 뜻하고 הַיַּיִן이 와인임을 분명히 하므로, 현장감을 살리면서도 과도하게 직역적이지 않은 "와인 잔치"로 옮겼습니다.
- source_word: שְּׁאֵלָתֵךְ
  english_pob_choice: your petition
  chosen_korean: 당신의 청원
  alternatives_korean:
  - 당신의 요청
  - 당신의 간청
  lexicon: HALOT
  rationale: 첫 번째 질문은 궁정 맥락의 공식적 요청을 가리키므로, 단순한 "요청"보다 "청원"이 source의 격식을 더 잘 드러냅니다.
- source_word: בַּקָּשָׁתֵךְ
  english_pob_choice: your request
  chosen_korean: 당신의 요구
  alternatives_korean:
  - 당신의 요청
  - 당신이 구하는 것
  lexicon: HALOT
  rationale: שְׁאֵלָה와 구별되는 두 번째 명사 בַּקָּשָׁה는 더 넓게 바라는 바를 뜻하므로, 첫 항목과의 차이를 살리기 위해 "요구"로 옮겼습니다.
- source_word: עַד חֲצִי הַמַּלְכוּת
  english_pob_choice: Even up to half the kingdom
  chosen_korean: 왕국의 절반에까지라도
  alternatives_korean:
  - 나라의 절반까지라도
  - 내 왕국의 절반까지라도
  lexicon: HALOT
  rationale: 히브리어는 소유격 "내"를 명시하지 않으므로 이를 덧붙이지 않았고, 과장된 왕의 허락을 살리기 위해 "-에까지라도"를 사용했습니다.
theological_decisions:
- issue: 왕의 과장된 허락 공식의 뉘앙스
  chosen_reading: 허락과 실행의 미래형 약속으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 직역에 가까운 "주어질 것입니다"
  - 명령형 뉘앙스의 "주어지게 하십시오"
  rationale: 문맥상 왕의 호의적 보장을 나타내는 관용구이므로, 한국어에서도 미래형의 확약으로 읽히게 하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 서사 문맥과 왕실 어법의 관용 표현
