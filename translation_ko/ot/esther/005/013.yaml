  rationale: 본문 자체는 신학 명제보다 인물의 정체성 표지를 강조하므로, 전통 교회어보다 स्रोत의 사회사적 뉘앙스를 우선했습니다.
  doctrine_reference: 서술 본문에서의 민족 정체성 표지
