  source_fidelity: '''그런데도 이것은''은 וְכָל־זֶה(‘그러나/그런데 이 모든 것’)의 총체적 의미를 충분히 반영하지 못합니다. 또한 ‘왕의 대문’은 왕의 행정·궁정과 관련된 문/문간이라는 שַׁעַר의 의미를 다소 부정확하게 좁힐 수 있습니다.'
  naturalness: 초안의 ‘내가 … 앉아 있는 것을 볼 때마다 나에게는’은 문법적으로 가능하지만, 반복되는 조사와 긴 수식절 때문에 다소 무겁습니다. 수식절을 쉼표로 분리하고 ‘내게는 아무 가치가 없습니다’로 옮기면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: מָרְדֳּכַי הַיְּהוּדִי는 ‘모르드개라는 유다 사람’으로 옮겨 인물의 정체성 표지를 보존했습니다. ‘유다 사람’은 문맥상 민족적 정체성을 가리키지만, ‘유대인’이라는 번역 가능성도 각주로 밝혀 원어의 지리적·민족적 뉘앙스를 단정하지 않았습니다.
