  lexicon: HALOT
  rationale: שׁוה의 '가치가 있다/유익하다'는 뜻을 한국어 관용 표현으로 옮겨, 화자의 주관적 평가와 무가치를 함께 드러냈습니다.
- source_word: הַיְּהוּדִי
  english_pob_choice: the Jew
  chosen_korean: 그 유다 사람
  alternatives_korean:
  - 그 유대인
  - 그 유다인
  lexicon: HALOT
  rationale: 에스더서의 궁정 배경에서 종족적 정체성을 드러내되, 본문이 강조하는 인물 표지를 살리기 위해 '유다 사람'으로 옮겼습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: at the king’s gate
  chosen_korean: 왕의 대문에 앉아 있는
  alternatives_korean:
  - 왕의 문에 앉아 있는
  - 왕의 대문 곁에 앉아 있는
  - 왕궁 문에 앉아 있는
  lexicon: HALOT
  rationale: שׁער를 단순한 '문'보다 성문/출입구의 공적 장소로 느낄 수 있게 '대문'으로 옮기고, יוֹשֵׁב의 계속된 자세를 '앉아 있는'으로 살렸습니다.
theological_decisions:
- issue: הַיְּהוּדִי의 민족·지리적 뉘앙스
  chosen_reading: '''그 유다 사람''으로 옮겨, 에스더서 내에서 드러나는 유다/유대 정체성과 궁정 내 소수자 표지를 함께 유지했습니다.'
  alternative_readings:
