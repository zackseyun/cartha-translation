  text: וְ/כָל זֶ֕ה אֵינֶ֥/נּוּ שֹׁוֶ֖ה לִ֑/י בְּ/כָל עֵ֗ת אֲשֶׁ֨ר אֲנִ֤י רֹאֶה֙ אֶת מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י יוֹשֵׁ֖ב בְּ/שַׁ֥עַר הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
  footnotes:
  - marker: a
    text: Or, 'And all this is of no value to me every time I see Mordecai the Jew sitting at the king’s gate.'
    reason: lexical_alternative
  - marker: b
    text: '''The Jew'' may also be rendered ''the Judean''; here it most likely emphasizes Mordecai’s Jewish ethnic identity within the Persian court setting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 이것은 내가 모르드개 그 유다 사람을 왕의 대문에 앉아 있는 것을 볼 때마다 나에게는 아무 소용이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '이 모든 것은 내가 모르드개 그 유다 사람을 왕의 대문에 앉아 있는 것을 볼 때마다 나에게 아무 가치도 없습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''유다 사람''은 여기서 모르드개의 유다인 정체성을 가리키며, 궁정 배경에서는 민족적 표지가 강조됩니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל זֶה
  english_pob_choice: Yet all this
  chosen_korean: 그런데도 이것은
  alternatives_korean:
  - 그러나 이 모든 것은
  - 하지만 이것은
  lexicon: HALOT
  rationale: 앞절의 자랑과 대조되는 역접을 살리면서, 'all this'의 총체성을 자연스럽게 나타내기 위해 '이것은'을 썼습니다.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  english_pob_choice: is worth nothing to me
  chosen_korean: 나에게는 아무 소용이 없습니다
  alternatives_korean:
  - 나에게는 가치가 없습니다
  - 나에게는 아무 보람이 없습니다
  - 나에게는 아무 가치도 없습니다
  lexicon: HALOT
  rationale: שׁוה의 '가치가 있다/유익하다'는 뜻을 한국어 관용 표현으로 옮겨, 화자의 주관적 평가와 무가치를 함께 드러냈습니다.
- source_word: הַיְּהוּדִי
  english_pob_choice: the Jew
  chosen_korean: 그 유다 사람
  alternatives_korean:
  - 그 유대인
  - 그 유다인
  lexicon: HALOT
  rationale: 에스더서의 궁정 배경에서 종족적 정체성을 드러내되, 본문이 강조하는 인물 표지를 살리기 위해 '유다 사람'으로 옮겼습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: at the king’s gate
  chosen_korean: 왕의 대문에 앉아 있는
  alternatives_korean:
  - 왕의 문에 앉아 있는
  - 왕의 대문 곁에 앉아 있는
  - 왕궁 문에 앉아 있는
  lexicon: HALOT
  rationale: שׁער를 단순한 '문'보다 성문/출입구의 공적 장소로 느낄 수 있게 '대문'으로 옮기고, יוֹשֵׁב의 계속된 자세를 '앉아 있는'으로 살렸습니다.
theological_decisions:
- issue: הַיְּהוּדִי의 민족·지리적 뉘앙스
  chosen_reading: '''그 유다 사람''으로 옮겨, 에스더서 내에서 드러나는 유다/유대 정체성과 궁정 내 소수자 표지를 함께 유지했습니다.'
  alternative_readings:
  - 그 유대인
  - 그 유다인
  rationale: 본문 자체는 신학 명제보다 인물의 정체성 표지를 강조하므로, 전통 교회어보다 स्रोत의 사회사적 뉘앙스를 우선했습니다.
  doctrine_reference: 서술 본문에서의 민족 정체성 표지
