  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
  footnotes:
  - marker: a
    text: Or 'the splendor of his riches.' The Hebrew phrase emphasizes the impressive magnificence associated with Haman's wealth.
    reason: lexical_alternative
  - marker: b
    text: Or 'his many sons.' The Hebrew specifically says 'sons,' not the more general 'children.'
    reason: lexical_alternative
  - marker: c
    text: Or 'all that the king had done to promote him.'
    reason: lexical_alternative
  - marker: d
    text: Or 'had raised him above' or 'had lifted him up over' the officials and servants of the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 하만은 그들에게 자기 재물의 화려함[a]과 많은 아들들[b]과, 왕이 자기를 크게 하신 모든 일[c]과 왕의 대신들과 신하들보다 자기를 높이신 일[d]을 이야기했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 재물의 영화’. 히브리어 표현은 하만의 부에 따른 위엄이나 화려함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 아들들의 많음’. 히브리어는 일반적인 ‘자녀들’이 아니라 ‘아들들’을 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕이 자기를 높이신 모든 일’ 또는 ‘왕이 자기를 출세시키신 모든 일’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘왕의 대신들과 신하들 위로 자기를 들어 올리신 일’. 이는 지위와 서열에서 그들을 능가하게 하셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד עָשְׁרוֹ
  english_pob_choice: the glory of his wealth
  chosen_korean: 자기 재물의 영광
  alternatives_korean:
  - 자기 부의 영광
  - 자기 재물의 화려함
  - 재물의 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 여기서 재물에 수반되는 위엄·화려함을 가리키므로, ‘영광’을 살리되 소유 관계를 분명히 했습니다.
- source_word: רֹב בָּנָיו
  english_pob_choice: the multitude of his sons
  chosen_korean: 아들들의 수효
  alternatives_korean:
  - 많은 아들들
  - 아들들의 많음
  - 아들들의 무리
  lexicon: HALOT
  rationale: רֹב은 ‘많음/다수’의 뜻이고, בָּנִים은 일반적 자녀가 아니라 아들을 뜻하므로 그 남성적 지시를 유지했습니다.
- source_word: גִּדְּלוֹ
  english_pob_choice: had done to make him great
  chosen_korean: 자기에게 베푼 모든 것
  alternatives_korean:
  - 자기를 크게 해 주신 것
  - 자기를 높여 주신 것
  - 자기를 승진시켜 주신 것
  lexicon: HALOT
  rationale: 문맥상 왕이 하만을 ‘크게 하다/높이다’는 뜻이며, 앞의 כָּל אֲשֶׁר를 자연스럽게 받는 한국어 절로 옮겼습니다.
- source_word: נִשְּׂאוֹ עַל
  english_pob_choice: had exalted him above
  chosen_korean: 자기의 지위를 모든 대신들과 왕의 신하들 위에 높이신 것
  alternatives_korean:
  - 자기를 모든 대신들과 왕의 신하들 위에 높이신 것
  - 자기를 그들 위에 들어 높이신 것
  - 자기를 그들보다 높여 주신 것
  lexicon: HALOT
  rationale: נשא עַל은 지위·서열의 우위를 나타내므로, ‘지위를…위에 높이신 것’으로 위계 관계를 분명히 했습니다.
- source_word: הַשָּׂרִים וְעַבְדֵי הַמֶּלֶךְ
  english_pob_choice: the officials and servants of the king
  chosen_korean: 모든 대신들과 왕의 신하들
  alternatives_korean:
  - 관리들과 왕의 신하들
  - 관원들과 왕의 종들
  - 대신들과 왕의 종들
  lexicon: HALOT
  rationale: שָׂרִים은 궁정 맥락에서 ‘대신들/관리들’이 적절하고, עַבְדֵי הַמֶּלֶךְ는 ‘왕의 신하들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 궁정 서열을 드러내는 종결 절의 강조
  chosen_reading: ‘위에 높이신 것’과 ‘모든 대신들과 왕의 신하들’의 병렬을 통해 하만이 자랑하는 승진과 우위가 분명히 드러나도록 했습니다.
  alternative_readings:
  - 보다 평평한 어조로 ‘높여 주신 것’만 번역하기
  - ‘관원들’로만 옮겨 서열감을 약화시키기
  rationale: 본절은 하만의 자랑 목록을 통해 그의 교만을 드러내므로, 위계의 상승을 약화하지 않고 보존하는 것이 서술 의도를 더 잘 반영합니다.
  doctrine_reference: '서술 문맥의 윤리적·신학적 의도: 교만한 자랑의 드러냄'
- issue: ‘아들들의 수효’의 성별 구분 유지
  chosen_reading: בָּנִים을 일반적 자녀가 아니라 ‘아들들’로 유지했습니다.
  alternative_readings:
  - ‘자녀들’로 일반화하기
  - ‘아이들’로 완화하기
  rationale: 히브리어가 남성 자손을 분명히 말하므로, 본문의 구체성을 보존하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 원문 의미 보존 원칙
