base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
  footnotes:
  - marker: a
    text: Or 'to carry out Esther's word.' The Hebrew literally says 'to do the word of Esther,' where 'word' can mean her stated request or instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 말했습니다. 「에스더의 말대로 하도록[a] 하만을 서둘러 데려오십시오.」 그러자 왕과 하만은 에스더가 마련한 잔치에 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘에스더의 말을 행하도록’입니다. 여기서 ‘말’은 그녀가 한 요청이나 지시를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  english_pob_choice: Hurry, bring Haman
  chosen_korean: 하만을 급히 데려오십시오
  alternatives_korean:
  - 하만을 서둘러 데려오십시오
  - 급히 하만을 부르십시오
  lexicon: HALOT
  rationale: 복수 명령형 מהר의 긴급성을 살리되, 왕의 시종들에게 하만을 즉시 오게 하라는 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  english_pob_choice: so that Esther's word may be done
  chosen_korean: 에스더의 말이 이루어질 것입니다
  alternatives_korean:
  - 에스더의 말이 행해질 것입니다
  - 에스더의 요청이 이루어질 것입니다
  lexicon: HALOT
  rationale: דָּבָר의 문자적 ‘말/일’ 가운데 이 궁정 문맥에서는 에스더가 한 진술이자 요청을 가리키므로, POB의 ‘word’를 살리면서도 한국어에서는 ‘말’로 직역해 어색함을 줄였습니다.
- source_word: הַמִּשְׁתֶּה
  english_pob_choice: the banquet
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 잔칫상
  lexicon: HALOT
  rationale: 왕궁의 공식적 식사 자리를 가리키지만, 이 장면의 서사적 자연스러움과 현대 한국어 가독성을 고려해 ‘잔치’로 옮겼습니다.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  english_pob_choice: that Esther had prepared
  chosen_korean: 에스더가 마련한
  alternatives_korean:
  - 에스더가 준비한
  - 에스더가 만든
  lexicon: HALOT
  rationale: 잔치에 대해 עשה는 ‘준비하다/마련하다’의 뜻이므로, 행사 준비의 결과를 잘 드러내는 ‘마련한’을 택했습니다.
theological_decisions:
- issue: 에스더의 ‘דְּבַר’ 번역
  chosen_reading: ‘말’로 옮겨, 왕의 명령이 에스더의 발화/요청을 곧바로 집행 대상으로 삼는 긴박함을 살렸습니다.
  alternative_readings:
  - ‘요청’으로 완화해 옮김
  - ‘명령’으로 강하게 옮김
  rationale: 문맥상 에스더의 공식 청원이지만, 히브리어는 ‘말/일’의 폭을 유지하므로 한국어에서도 그 긴장을 과도하게 평준화하지 않았습니다.
  doctrine_reference: 서사 문맥의 의미 보존과 어휘적 긴장 유지
