  source_fidelity: 히브리어의 서술 진행, 왕의 호칭, 요청, ‘나라의 절반까지’라는 한계 표현, 그리고 수동형 약속은 대체로 반영되었습니다. 그러나 ‘무엇이 있습니까?’는 מַה־לָּךְ의 관용적 질문을 현대 한국어에서 자연스럽게 전달하지 못하며, 수동 약속의 수혜자도 본문에서 드러내는 편이 좋습니다.
  naturalness: ‘왕후 에스더여, 무엇이 있습니까?’는 현대 표준어 합쇼체 대화로 부자연스럽습니다. ‘에스더 왕후, 무슨 일이십니까?’가 궁정 장면의 정중한 문체를 유지하면서도 자연스럽습니다. 각주 표지도 해당 어구 뒤에 붙이는 것이 독해와 주석 연결에 적절합니다.
  terminology: ‘왕후’, ‘요청’, ‘나라의 절반’은 적절합니다. ‘청원’은 각주 대안으로 유지할 수 있습니다. 문화 주석은 실제 분할 제안이 아니라고 단정하기보다, 통상 후한 약속을 나타내는 관용적 왕실 표현이라는 점을 밝혀 원문의 수사적 성격을 보존해야 합니다.
