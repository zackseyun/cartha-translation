id: EST.5.3
reference: Esther 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ הַ/מֶּ֔לֶךְ מַה לָּ֖/ךְ אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/יִנָּ֥תֵֽן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
  footnotes:
  - marker: a
    text: Or, 'What troubles you, Queen Esther?' The Hebrew idiom literally reads, 'What is to you?'
    reason: lexical_alternative
  - marker: b
    text: Or, 'petition' instead of 'request.'
    reason: lexical_alternative
  - marker: c
    text: A conventional royal expression of generous promise, not necessarily a literal offer to divide the kingdom.
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕이 그에게 말했습니다. “왕후 에스더여, 무엇이 있습니까? 또 무엇을 요청하십니까? 나라의 절반까지라도 주어질 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘당신에게 무엇이 있습니까?’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: ‘요청’ 대신 ‘청원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 왕국을 실제로 절반으로 나누겠다는 말이 아니라, 왕실의 관용적인 후한 약속입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: WLC/HALOT
  rationale: 와우 연속형의 서술 진행을 한국어에서는 자연스러운 시간 연결로 옮기되, 문맥의 즉시성을 살려 ‘그때’로 처리했습니다.
- source_word: מַה לָּךְ
  english_pob_choice: What is it
  chosen_korean: 무엇이 있습니까?
  alternatives_korean:
  - 무엇이 문제입니까?
  - 무슨 일입니까?
  lexicon: WLC/HALOT
  rationale: 히브리어 관용구의 직역 의미인 ‘당신에게 무엇이 있습니까?’를 살리면서도, POB의 ‘What is it’처럼 과도한 감정 해석 없이 궁정 대화에 어울리게 옮겼습니다.
- source_word: בַּקָּשָׁתֵךְ
  english_pob_choice: request
  chosen_korean: 요청하십니까
  alternatives_korean:
  - 청원을 하십니까
  - 소원을 말씀하시겠습니까?
  lexicon: WLC/HALOT
  rationale: בַּקָּשָׁה는 요구·요청·청원을 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘요청’으로 옮겼습니다.
- source_word: עַד חֲצִי הַמַּלְכוּת
  english_pob_choice: Up to half the kingdom
  chosen_korean: 나라의 절반까지라도
  alternatives_korean:
  - 왕국의 절반까지라도
  - 나라의 절반까지
  lexicon: WLC/HALOT
  rationale: 관용적인 왕의 후한 약속을 한국어에서도 과장 없이 자연스럽게 드러내기 위해 ‘나라의 절반까지라도’로 옮겼습니다.
- source_word: וְיִנָּתֵן לָךְ
  english_pob_choice: it will be given to you
  chosen_korean: 주어질 것입니다
  alternatives_korean:
  - 그것이 주어질 것입니다
  - 주겠습니다
  lexicon: WLC/HALOT
  rationale: 수동형의 약속을 한국어 미래 수동으로 옮겨, 요청한 것이 허락될 것이라는 선언적 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 왕의 과장된 약속 표현의 성격
  chosen_reading: 문자적 분할 제안이 아니라 궁정의 관용적 호의 표현으로 읽었습니다.
  alternative_readings:
  - 왕국의 실제 반을 나누겠다는 문자적 제안
  - 단순한 수사적 과장으로만 처리
  rationale: 원문과 POB 주석 모두 이 표현을 전형적인 왕실의 후한 약속으로 이해하게 하므로, 한국어 본문은 자연스럽게 두되 과도한 문자화는 피했습니다.
  doctrine_reference: 본문 주해/수사학
