  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְאַפַּ֣ק הָמָ֔ן וַ/יָּב֖וֹא אֶל בֵּית֑/וֹ וַ/יִּשְׁלַ֛ח וַ/יָּבֵ֥א אֶת אֹהֲבָ֖י/ו וְ/אֶת זֶ֥רֶשׁ אִשְׁתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
  footnotes:
  - marker: a
    text: Or 'controlled himself' or 'held himself back.'
    reason: lexical_alternative
  - marker: b
    text: Or 'went home.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 하만은 자기 자신을 억누르고 자기 집으로 갔습니다. 그리고 자기 친구들과 자기 아내 제레스를 불러들였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 자신을 억누르고’는 ‘자제하고’ 또는 ‘참고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 집으로 갔습니다’는 ‘집으로 갔습니다’ 또는 ‘집에 갔습니다’로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  english_pob_choice: restrained himself
  chosen_korean: 자기 자신을 억누르고
  alternatives_korean:
  - 자제하고
  - 참고
  lexicon: HALOT
  rationale: 히트파엘형 אפק은 단순한 감정 억제가 아니라 자신을 붙들어 두는 뉘앙스를 가지므로, ‘자기 자신을 억누르고’가 반영하기에 적절합니다.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  english_pob_choice: went to his house
  chosen_korean: 자기 집으로 갔습니다
  alternatives_korean:
  - 집으로 갔습니다
  - 자기 집에 갔습니다
  lexicon: HALOT
  rationale: ‘אל + 집’의 이동 의미를 자연스러운 한국어로 옮기면서도, 영어 POB의 ‘went to his house’와 같이 직설적으로 유지했습니다.
- source_word: וַיָּבֵא אֶת אֹהֲבָיו
  english_pob_choice: brought in his friends
  chosen_korean: 친구들을 불러들였습니다
  alternatives_korean:
  - 친구들을 데려왔습니다
  - 사랑하던 이들을 불러들였습니다
  lexicon: HALOT
  rationale: אֹהֲבָיו는 문자적으로 ‘그를 사랑하는 자들’이지만 문맥상 사회적 동반자들이므로 ‘친구들’이 가장 자연스럽습니다. 동사 הֵבִיא는 집 안으로 불러들이는 상황을 살려 ‘불러들였습니다’로 옮겼습니다.
- source_word: וְאֶת זֶרֶשׁ אִשְׁתּוֹ
  english_pob_choice: and Zeresh his wife
  chosen_korean: 자기 아내 제레스를
  alternatives_korean:
  - 아내 제레스를
  - 제레스 그의 아내를
  lexicon: HALOT
  rationale: 히브리어의 이름-관계사 구조를 한국어에서 가장 분명하게 풀어 ‘자기 아내 제레스’로 옮겼습니다.
theological_decisions:
- issue: 첫 접속사 וַ 의 처리
  chosen_reading: 문장 첫머리의 וַ 는 단순한 이어짐만이 아니라 직전의 분노 이후에도 겉으로는 진정한 듯한 대비를 드러내므로 ‘그런데’로 시작했습니다.
  alternative_readings:
  - 그리고
  - 그러자
  rationale: 이 절은 직전 문맥의 격앙된 반응 뒤에 하만이 스스로를 억누르는 장면이므로, 완화된 전개보다 대비를 살리는 것이 독자 이해에 더 적절합니다.
  doctrine_reference: 서사 문맥의 담화 기능
- issue: אֹהֲבָיו의 의미
  chosen_reading: 단순한 ‘사랑하는 사람들’보다, 하만의 사회적 내빈/측근이라는 문맥을 드러내는 ‘친구들’로 번역했습니다.
  alternative_readings:
  - 그를 사랑하는 이들
  - 사랑하는 자들
  rationale: 어근 אהב의 직역을 유지하면 한국어에서 관계의 성격이 모호해지므로, 이야기 흐름상 필요한 사회적 관계를 분명히 했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
