  text: וַ/תַּ֥עַן אֶסְתֵּ֖ר וַ/תֹּאמַ֑ר שְׁאֵלָתִ֖/י וּ/בַקָּשָׁתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/007.yaml
  text: Then Esther answered and said[a], “My petition and my request are:”
  footnotes:
  - marker: a
    text: Or 'And Esther answered and said, “My question and my request are:”' The Hebrew uses a formal pair of near-synonyms for Esther's appeal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 에스더가 대답하여 말했습니다. 「저의 청원과 요청은 이렇습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에스더가 대답하여 말했습니다. “저의 질문과 요청은 이렇습니다.”’ 히브리어는 에스더의 호소를 나타내는 뜻이 가까운 두 말을 한 쌍으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  english_pob_choice: Then ... answered
  chosen_korean: 그러자 ... 대답하여
  alternatives_korean:
  - 그리고 ... 대답하여
  - 그때 ... 대답하여
  lexicon: WLC
  rationale: 와우 연속으로 이어지는 서술 진행을 자연스러운 한국어 연결어로 옮기되, 응답 동작의 공식성을 살리기 위해 ‘대답하여’로 표현했습니다.
- source_word: וַתֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르렀습니다
  lexicon: WLC
  rationale: 히브리어의 관용적 이중 동사 ‘대답하여 말하다’를 한국어에서도 과도하게 중복하지 않으면서 자연스럽게 보존했습니다.
- source_word: שְׁאֵלָתִי
  english_pob_choice: my petition
  chosen_korean: 저의 청원
  alternatives_korean:
  - 저의 요청
  - 저의 질문
  lexicon: HALOT
  rationale: 문맥상 왕에게 드리는 공식적 호소이므로 ‘질문’이 아니라 청원성 행위를 드러내는 ‘청원’이 가장 적절합니다.
- source_word: וּבַקָּשָׁתִי
  english_pob_choice: and my request
  chosen_korean: 그리고 요청
  alternatives_korean:
  - 그리고 간청
  - 그리고 부탁
  lexicon: HALOT
  rationale: בַּקָּשָׁה의 기본적 의미를 살려 앞의 ‘청원’과 구별되는 두 번째 호소를 ‘요청’으로 옮겼습니다.
theological_decisions:
- issue: 에스더의 왕 앞 발화의 문체
  chosen_reading: 왕 앞의 정중한 호소로 읽어, 평서형 보다는 공손한 진술형으로 옮겼습니다.
  alternative_readings:
  - 직설적 명령형으로 강하게 옮김
  - 현대 구어체로 완화함
  rationale: 히브리어는 두 명사의 병렬로 에스더의 정중한 탄원을 제시하므로, 한국어에서도 공적·예정된 청원의 뉘앙스를 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 서사문체와 화행 보존
