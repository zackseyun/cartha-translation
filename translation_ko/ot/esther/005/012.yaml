base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
  footnotes:
  - marker: a
    text: Or 'to the feast.' The Hebrew מִשְׁתֶּה can be rendered 'banquet' or 'feast.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'I am called by her.' In context this means 'I am invited by her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하만이 말했습니다. “에스더 왕후가 왕과 함께 자신이 차린 잔치[a]에 나 외에는 아무도 데려오지 않았습니다. 또 내일도 나는 왕과 함께 왕후에게 초대받았습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁתֶּה는 ‘잔치’ 또는 ‘연회’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀에게 불림을 받았습니다’입니다. 문맥에서는 ‘그녀에게 초대받았습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술 진행을 한국어의 자연스러운 사건 전개로 옮기되, 원문의 시간적 다음 순서를 유지했습니다.
- source_word: הֵבִיאָה ... אֶל הַמִּשְׁתֶּה
  english_pob_choice: brought ... to the banquet
  chosen_korean: '... 잔치에 ... 데려오지 않았습니다'
  alternatives_korean:
