  - '... 잔치에 ... 부르지 않았습니다'
  lexicon: HALOT
  rationale: 히브리어의 ‘데려오다/가져오다’는 잔치 문맥에서 초대된 동반을 가리키므로, ‘데려오지 않았다’로 구체성을 살렸습니다.
- source_word: כִּי אִם אוֹתִי
  english_pob_choice: except me
  chosen_korean: 나 외에는
  alternatives_korean:
  - 오직 나만
  - 나만 제외하고
  lexicon: HALOT
  rationale: 배제와 예외를 나타내는 구문을 한국어에서 가장 간결하고 자연스럽게 표현했습니다.
- source_word: קָרוּא לָהּ
  english_pob_choice: I am invited by her
  chosen_korean: 그녀에게 초대받았습니다
  alternatives_korean:
  - 그녀에게 불려졌습니다
  - 그녀에게 불림을 받았습니다
  lexicon: HALOT
  rationale: קָרוּא의 문자적 의미는 ‘불리다’이지만, 잔치 초대 문맥에서는 ‘초대받다’가 의미를 가장 분명하게 전달합니다.
- source_word: עִם הַמֶּלֶךְ
  english_pob_choice: together with the king
  chosen_korean: 왕과 함께
  alternatives_korean:
  - 왕과 더불어
  - 왕과 나란히
  lexicon: HALOT
  rationale: 동반 관계를 단순하고 정확하게 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕후 에스더의 호칭과 하만의 자기 과시적 어조
  chosen_reading: ‘에스더 왕후’와 하만의 직접화법을 그대로 살려, 하만의 오만한 자만을 독자가 분명히 느끼도록 했습니다.
  alternative_readings:
  - ‘왕후 에스더’
  - ‘에스더 여왕’
  rationale: 본문은 궁중 상황에서의 지위와 하만의 자만이 서사의 긴장을 이루므로, 이를 희석하지 않고 유지하는 것이 중요합니다.
  doctrine_reference: 서사 본문 해석 원칙
