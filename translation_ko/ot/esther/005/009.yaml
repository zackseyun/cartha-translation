  rationale: 문맥상 모호할 수 있는 대명사를 인명으로 바꾸어 주체와 대상의 관계를 명확히 했습니다. 기쁨의 병렬 표현은 현대 한국어에 맞게 다듬었고, 하만의 분노가 모르드개를 대상으로 한다는 עַל의 의미를 ‘모르드개를 향한’으로 자연스럽게 반영했습니다. 각주는 זוע의 문맥적 대안만 제시하면서, 원문의 두 부정 동작을 병렬로 보존하도록 바로잡았습니다.
