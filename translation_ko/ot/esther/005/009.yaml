  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
  footnotes:
  - marker: a
    text: Or 'did not rise or show fear before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하만은 그날 즐겁고 마음이 기뻤습니다. 그런데 하만이 왕의 문에 있는 모르드개를 보고, 그가 자기 앞에서 일어나지도 않고 떨지도 않자, 하만은 모르드개를 향해 분노로 가득 찼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 앞에서 일어나지 않거나 두려워하지도 않자’.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  english_pob_choice: joyful and glad of heart
  chosen_korean: 즐겁고 마음이 기뻤습니다
  alternatives_korean:
  - 기쁘고 마음이 좋았습니다
  - 환희에 차고 마음이 좋았습니다
  lexicon: HALOT
  rationale: 두 형용사의 병렬이 나타내는 감정의 충만함을 살리면서, 현대 한국어로 자연스럽고 과장되지 않게 옮겼습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: in the king’s gate
  chosen_korean: 왕의 문에 있는
  alternatives_korean:
  - 왕의 문에서
  - 왕의 문 안에 있는
  lexicon: HALOT
  rationale: 왕궁 관문 공간 안에서의 위치를 드러내되, 한국어에서 어색하지 않도록 소속·위치를 함께 표현했습니다.
- source_word: וְלֹא קָם וְלֹא זָע מִמֶּנּוּ
  english_pob_choice: he did not rise or tremble before him
  chosen_korean: 그가 자기 앞에서 일어나지도 않고 떨지도 않자
  alternatives_korean:
  - 그가 자기 앞에서 일어나지도 않고 두려워하지도 않자
  - 그가 자기 앞에서 일어서지도 않고 몸을 떨지도 않자
  lexicon: HALOT
  rationale: ‘일어나다’는 경의 표시로서의 기립을 살리고, זוע는 단순 이동이 아니라 두려움이나 흔들림이 없는 태도를 가리키므로 ‘떨다’로 옮겼습니다.
- source_word: וַיִּמָּלֵא ... חֵמָה
  english_pob_choice: was filled with rage
  chosen_korean: 분노로 가득 찼습니다
  alternatives_korean:
  - 격분으로 가득 찼습니다
  - 노여움으로 가득 찼습니다
  lexicon: HALOT
  rationale: ‘가득 차다’의 수동적 표지를 살려 감정의 압도됨을 표현했고, חֵמָה는 현대 한국어에서 가장 직접적인 ‘분노’로 옮겼습니다.
theological_decisions:
- issue: 에스더서의 인물 심리와 서술 톤
  chosen_reading: 본문의 감정 대비를 그대로 살려, 하만의 들뜬 기쁨이 즉각적인 분노로 꺾이는 아이러니를 드러냈습니다.
  alternative_readings:
  - 더 부드럽게 ‘마음이 상했습니다’로 완화할 수 있음
  - ‘노여워했습니다’로 약화할 수 있음
  rationale: 서술자는 하만의 내적 반응을 강하게 대비시키므로, 그 긴장과 반전을 약화하지 않는 것이 본문 의미에 충실합니다.
  doctrine_reference: 문학적-서술적 충실성
