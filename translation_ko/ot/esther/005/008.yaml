  rationale: 반복 조건문과 두 번째 조건절의 통사적 범위를 회복했습니다. ‘호의’로 궁정적 의미를 명료하게 했고, 마지막 표현은 해석을 본문에 과도하게 넣지 않은 채 각주에서만 가능한 문맥적 이해를 제시했습니다. 각주 b도 해당 타원 구문으로 옮겼습니다.
