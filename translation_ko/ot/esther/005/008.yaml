source:
  edition: WLC
  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'If I have found favor with the king.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'do according to the king’s word,' likely meaning Esther will respond to the king’s request and make her petition known on the next day.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 왕의 눈에 은혜를 얻었고[a], 왕께서 좋으시다면 내 청을 들어주시고 내 요청을 이루어 주십시오. 왕과 하만은 내가 그들을 위하여 차리는 잔치[b]에 오시고, 내일은 왕의 말씀대로 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘왕의 호의를 얻었다면’이라고 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘내가 그들을 위하여 만드는 잔치’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  english_pob_choice: have found favor in the eyes of
  chosen_korean: 왕의 눈에 은혜를 얻었고
  alternatives_korean:
  - 왕께 호의를 얻었고
  - 왕의 눈에 호의를 얻었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리되, 궁중 맥락에 맞는 공손한 표현으로 옮겼습니다. '은혜'는 단순 호의보다 더 격식 있는 승인·호감을 드러냅니다.
- source_word: עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: it pleases the king
  chosen_korean: 왕께서 좋으시다면
  alternatives_korean:
  - 왕께서 기뻐하신다면
  - 왕이 보시기에 좋으시다면
  lexicon: HALOT
  rationale: 직역형보다 한국어 궁중 발화로 자연스럽게 들리는 완곡한 조건 표현을 택했습니다. 원문의 '왕에게 좋다'는 뉘앙스를 유지합니다.
- source_word: לָתֵת אֶת שְׁאֵלָתִי / וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  english_pob_choice: to grant my petition / and fulfill my request
  chosen_korean: 내 청을 들어주시고 내 요청을 이루어 주십시오
  alternatives_korean:
  - 내 청을 허락해 주시고 내 요청을 이루어 주십시오
  - 내 청을 들어주시고 내 부탁을 시행해 주십시오
  lexicon: HALOT
  rationale: 두 개의 가까운 명사를 각각 살리되, 한국어에서는 '들어주시고 / 이루어 주십시오'로 격식 있는 청원문을 구성했습니다. '청'과 '요청'의 구분이 원문의 병치를 반영합니다.
- source_word: הַמִּשְׁתֶּה אֲשֶׁר אֶעֱשֶׂה לָהֶם
  english_pob_choice: the banquet that I will prepare for them
  chosen_korean: 내가 그들을 위하여 차리는 잔치
  alternatives_korean:
  - 내가 그들을 위하여 준비하는 잔치
  - 내가 그들을 위해 마련하는 잔치
  lexicon: HALOT
  rationale: '''עשה''를 잔치와 함께 쓸 때 한국어에서는 ''차리다/마련하다''가 자연스럽습니다. ''잔치''는 에스더서의 왕실 연회 분위기를 유지합니다.'
- source_word: כִּדְבַר הַמֶּלֶךְ
  english_pob_choice: according to the king’s word
  chosen_korean: 왕의 말씀대로
  alternatives_korean:
  - 왕의 말씀에 따라
  - 왕의 말씀이 하신 대로
  lexicon: HALOT
  rationale: 히브리어의 간결한 관용을 간단하고 존대하는 한국어로 옮겼습니다. '말씀'은 왕의 발화를 공적 명령으로 드러냅니다.
theological_decisions:
- issue: 왕에게 드리는 공손한 청원 어조
  chosen_reading: 직접 명령형처럼 보이는 부분도 한국어에서는 극존칭 청원으로 정리했습니다.
  alternative_readings:
  - 더 평이한 서술형으로 완화
  - 현대 구어체로 낮춤
  rationale: 에스더의 발화는 위계가 강한 궁정 장면이므로, 원문의 예의와 긴장을 살리려면 공손한 청원체가 가장 적절합니다.
  doctrine_reference: 본문의 서사·담화 맥락에 따른 어조 재현
