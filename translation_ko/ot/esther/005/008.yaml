  source_fidelity: 첫 두 조건절의 접속을 바로잡아 히브리어의 반복된 조건문(‘만일 … 하고, 또 만일 … 한다면’)을 보존해야 합니다. 또한 왕이 청원을 들어주는 행위는 에스더의 명령이 아니라 ‘왕께 좋게 여겨지는’ 일의 내용이므로, 직접 청유·명령형이 아닌 조건절 안에 두어야 합니다. 마지막 ‘왕의 말씀대로 하겠습니다’는 원문의 의도적인 타원성을 유지합니다.
  naturalness: ‘왕의 눈에 호의를 얻었다면’과 ‘좋게 여기신다면’은 현대 표준 한국어의 격식 있는 궁정 청원 문맥에 자연스럽습니다. ‘오십시오’는 왕을 향한 정중한 초청으로 합쇼체에 맞습니다.
  terminology: ‘호의’는 궁정 맥락의 חֵן에 ‘은혜’보다 적합하며 신학적 함의를 불필요하게 더하지 않습니다. ‘청’과 ‘요청’, ‘잔치’는 원문의 병렬과 격식을 적절히 반영합니다. 각주 b는 잔치의 문자적 표현이 아니라 마지막 타원적 구문에 붙어야 합니다.
