base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'If I have found favor with the king.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'do according to the king’s word,' likely meaning Esther will respond to the king’s request and make her petition known on the next day.
    reason: lexical_alternative
translation:
  language: ko
  text: “제가 왕의 눈에 호의를 얻었다면[a], 또 왕께서 제 청을 허락하시고 제 요청을 이루어 주시기를 좋게 여기신다면, 왕과 하만께서는 제가 그들을 위하여 차리는 잔치에 오십시오. 그러면 내일 왕의 말씀대로 하겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘왕께 호의를 얻었다면’이라고 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘내일 내가 왕의 말씀대로 하겠다’입니다. 이는 에스더가 다음 날 왕의 요청에 따라 자신의 청을 밝히겠다는 뜻일 가능성이 높습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  english_pob_choice: have found favor in the eyes of
  chosen_korean: 왕의 눈에 은혜를 얻었고
