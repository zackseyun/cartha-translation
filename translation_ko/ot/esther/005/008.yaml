  lexicon: HALOT
  rationale: 직역형보다 한국어 궁중 발화로 자연스럽게 들리는 완곡한 조건 표현을 택했습니다. 원문의 '왕에게 좋다'는 뉘앙스를 유지합니다.
- source_word: לָתֵת אֶת שְׁאֵלָתִי / וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  english_pob_choice: to grant my petition / and fulfill my request
  chosen_korean: 내 청을 들어주시고 내 요청을 이루어 주십시오
  alternatives_korean:
  - 내 청을 허락해 주시고 내 요청을 이루어 주십시오
  - 내 청을 들어주시고 내 부탁을 시행해 주십시오
  lexicon: HALOT
  rationale: 두 개의 가까운 명사를 각각 살리되, 한국어에서는 '들어주시고 / 이루어 주십시오'로 격식 있는 청원문을 구성했습니다. '청'과 '요청'의 구분이 원문의 병치를 반영합니다.
- source_word: הַמִּשְׁתֶּה אֲשֶׁר אֶעֱשֶׂה לָהֶם
  english_pob_choice: the banquet that I will prepare for them
  chosen_korean: 내가 그들을 위하여 차리는 잔치
  alternatives_korean:
  - 내가 그들을 위하여 준비하는 잔치
  - 내가 그들을 위해 마련하는 잔치
  lexicon: HALOT
  rationale: '''עשה''를 잔치와 함께 쓸 때 한국어에서는 ''차리다/마련하다''가 자연스럽습니다. ''잔치''는 에스더서의 왕실 연회 분위기를 유지합니다.'
- source_word: כִּדְבַר הַמֶּלֶךְ
  english_pob_choice: according to the king’s word
  chosen_korean: 왕의 말씀대로
