id: EST.1.20
reference: Esther 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
  footnotes:
  - marker: a
    text: Or 'edict.' The Hebrew term refers to an official royal pronouncement.
    reason: lexical_alternative
  - marker: b
    text: Or 'will show respect to their husbands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 내린 조서[a]가 그의 온 왕국에 들리면—그 왕국이 매우 크므로—높은 자에서 낮은 자에 이르기까지 모든 여자가 자기 남편에게 존경을 나타낼 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칙령.’ 히브리어 용어는 왕의 공식적인 선포를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 남편을 존중할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָם
  english_pob_choice: decree
  chosen_korean: 조서
  alternatives_korean:
  - 칙령
  - 명령
  - 공포문
  lexicon: HALOT
  rationale: 페르시아 궁정 문맥의 공식적인 왕령을 가리키므로, 한국어에서는 관찬 성격이 분명한 ‘조서’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: וְנִשְׁמַע
  english_pob_choice: And when ... is heard
  chosen_korean: 들리게 되면
  alternatives_korean:
  - 들려지면
  - 들리면
  - 전해지면
  lexicon: HALOT
  rationale: 수동·상황적 의미를 살리면서도 한국어에서 시간 조건을 자연스럽게 드러내기 위해 ‘들리게 되면’을 택했습니다.
- source_word: יִתְּנוּ יְקָר
  english_pob_choice: will give honor
  chosen_korean: 높이 존중할 것입니다
  alternatives_korean:
  - 존경할 것입니다
  - 존중할 것입니다
  - 예를 표할 것입니다
  lexicon: HALOT
  rationale: 직역적 ‘존귀를 주다’보다 한국어에서 관용적으로 이해되는 ‘높이 존중하다’가 원문의 명예/가치 부여 의미를 더 분명히 전달합니다.
- source_word: לְבַעְלֵיהֶן
  english_pob_choice: to their husbands
  chosen_korean: 자기 남편을
  alternatives_korean:
  - 그들의 남편을
  - 남편들에게
  - 그들의 주인을
  lexicon: HALOT
  rationale: 여성들과 연결된 문맥이므로 ‘남편’을 사용하고, בעל의 다른 가능성인 ‘주인’은 이 구절에서 문맥상 과도하게 강한 의미이므로 배제했습니다.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  english_pob_choice: from great to small
  chosen_korean: 큰 자에게서 작은 자에게까지
  alternatives_korean:
  - 크고 작은 자 모두에게
  - 가장 큰 자에게서 가장 작은 자에게까지
  - 높은 자에서 낮은 자까지
  lexicon: HALOT
  rationale: 지위의 전 범위를 나타내는 관용구이므로, 사회적 범위를 자연스럽게 드러내는 ‘큰 자에게서 작은 자에게까지’로 옮겼습니다.
theological_decisions:
- issue: 왕의 조서가 전 제국에 미치는 공적 효력
  chosen_reading: 조서는 개인적 의견이 아니라 제국 전체에 공표되어 작동하는 공식 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 통지
  - 사적인 선언
  rationale: 본문은 조서가 ‘온 나라’에 들리는 상황을 전제하므로, 공적·제도적 효력을 강조하는 번역이 서술의 힘을 보존합니다.
  doctrine_reference: 본문 문맥상 역사서술/궁정행정 어휘의 공적 성격
