revisions:
- from: 왕의 조서가, 곧 그가 자기의 온 나라에 반포할 조서가 들리게 되면—그 나라는 크기 때문입니다—모든 여자는 자기 남편을 높이 존중할 것입니다. 큰 자에게서 작은 자에게까지 그렇습니다.[a][b]
  to: 왕이 내린 조서[a]가 그의 온 왕국에 들리면—그 왕국이 매우 크므로—높은 자에서 낮은 자에 이르기까지 모든 여자가 자기 남편에게 존경을 나타낼 것입니다.[b]
  rationale: 수동적·시간적 조건인 וְנִשְׁמַע를 ‘들리면’으로, 왕의 공식 선포인 פִּתְגָם을 ‘조서’로 옮겼습니다. כִּי רַבָּה הִיא는 왕국의 광대함을 설명하는 삽입절로 처리했습니다. 마지막 관용구는 원문의 포괄 범위를 보존하면서 결과절에 자연스럽게 연결되도록 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:02Z'
