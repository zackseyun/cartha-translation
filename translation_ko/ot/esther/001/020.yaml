  naturalness: 초안의 “왕의 조서가, 곧 그가 ... 반포할 조서”는 ‘조서’가 불필요하게 반복되고, “그 나라는 크기 때문입니다”는 삽입절로서 문법적으로 부자연스럽습니다. 또한 “큰 자에게서 작은 자에게까지 그렇습니다”는 무엇을 수식하는지 불분명하고 합쇼체 문장으로도 매끄럽지 않습니다.
