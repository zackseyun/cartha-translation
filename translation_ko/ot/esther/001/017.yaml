  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: ko
  text: 왕후의 일이 모든 여자에게 퍼져 나가서, 그들이 자기 남편을 자기 눈에서 업신여기게 될 것입니다. 그들이 말하기를, “아하수에로 왕이 와스디 왕후를 자기 앞에 데려오라고 하였으나, 그녀는 오지 않았습니다” 할 것이기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  english_pob_choice: the queen’s matter
  chosen_korean: 왕후의 일
  alternatives_korean:
  - 왕후의 사건
  - 왕후의 행위
  lexicon: דָּבָר
  rationale: 이 표현은 단순한 ‘행위’보다 더 넓게 ‘일/사정/문제’를 뜻하므로, POB의 matter를 살려 왕후의 일로 옮겼습니다.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  english_pob_choice: causing them to despise their husbands in their eyes
  chosen_korean: 그들이 자기 남편을 자기 눈에서 업신여기게
  alternatives_korean:
  - 그들이 자기 남편을 자기 눈에 하찮게 여기게
  - 그들이 자기 남편을 보잘것없게 여기게
  lexicon: בָּזָה
  rationale: ‘업신여기다’는 경멸의 동작을 직접 드러내며, ‘in their eyes’의 관점 표현도 ‘자기 눈에서’로 보존했습니다.
- source_word: אָמַר לְהָבִיא
  english_pob_choice: said to bring
  chosen_korean: 데려오라고 하였으나
  alternatives_korean:
  - 데려오라고 명령하였으나
  - 가져오라고 하였으나
  lexicon: אמר + הביא
  rationale: 본문은 ‘명령했다’보다 덜 직접적인 אמר를 쓰므로, POB의 said to bring을 따라 ‘데려오라고 하였으나’로 옮겼습니다.
theological_decisions:
- issue: 왕후의 일이 퍼질 때 생길 사회적 결과를 어떻게 표현할 것인가
  chosen_reading: 본문의 초점은 왕후 개인의 도덕평가가 아니라, 왕후의 사례가 모든 여자에게 알려져 가정의 질서에 미칠 사회적 파급입니다.
  alternative_readings:
  - 왕후의 행실이 나쁜 본보기로 퍼진다
  - 왕후의 사건이 여성들의 반항을 부추긴다
  rationale: 히브리어와 POB 모두 결과의 사회적 확산과 남편에 대한 경멸을 말할 뿐, 추가적 도덕 해석을 요구하지 않습니다.
  doctrine_reference: 본문 관찰; 서술적 역사 본문
