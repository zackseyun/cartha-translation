language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הַרְאֹת֗/וֹ אֶת עֹ֨שֶׁר֙ כְּב֣וֹד מַלְכוּת֔/וֹ וְ/אֶ֨ת יְקָ֔ר תִּפְאֶ֖רֶת גְּדוּלָּת֑/וֹ יָמִ֣ים רַבִּ֔ים שְׁמוֹנִ֥ים וּ/מְאַ֖ת יֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/004.yaml
  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: ko
  text: 그는 자기 나라의 풍성한 재물과 자기 위엄의 영광, 그리고 자기 위대함의 존귀를 여러 날 동안, 곧 백팔십 일 동안 보여 주었습니다.
  philosophy: formal
lexical_decisions:
- source_word: בְּ/הַרְאֹת֗/וֹ
  english_pob_choice: while he displayed
  chosen_korean: 보여 주었습니다
  alternatives_korean:
  - 드러내셨습니다
  - 전시하셨습니다
  lexicon: הראה
  rationale: 히브리어 הפעיל형 동사 הראה는 ‘보이다/드러내다’의 뜻이므로, 문맥상 왕이 자신의 부를 과시하는 행위를 자연스럽게 옮겨 ‘보여 주었습니다’로 번역했습니다.
- source_word: עֹ֨שֶׁר֙
  english_pob_choice: riches
  chosen_korean: 풍성한 재물
  alternatives_korean:
  - 부요
  - 부귀
  lexicon: עֹשֶׁר
  rationale: 단순한 추상적 ‘부유함’보다 실제로 전시되는 소유의 넉넉함을 드러내기 위해 ‘재물’로 구체화했습니다.
- source_word: כְּב֣וֹד מַלְכוּת֔/וֹ ... יְקָר תִּפְאֶ֖רֶת גְּדוּלָּת֑/וֹ
  english_pob_choice: the glory of his kingdom and the splendor of the honor of his greatness
  chosen_korean: 자기 나라의 영광과 자기 위엄의 영광, 그리고 자기 위대함의 존귀
  alternatives_korean:
  - 그의 나라의 영광과 그의 위엄의 화려함, 그리고 그의 위대함의 영화
  - 자기 왕권의 영광과 자기 عظ대함의 존귀
  lexicon: כָּבוֹד / יְקָר / תִּפְאֶרֶת / גָּדוֹל
  rationale: POB의 ‘honor’를 반영해 יְקָר를 ‘존귀’로 살렸고, 중첩된 명사구를 그대로 유지해 왕의 자기 과시를 과장 없이 전달했습니다.
- source_word: יָמִ֣ים רַבִּ֔ים שְׁמוֹנִ֥ים וּ/מְאַ֖ת יֽוֹם
  english_pob_choice: for many days—one hundred and eighty days
  chosen_korean: 여러 날 동안, 곧 백팔십 일 동안
  alternatives_korean:
  - 오랜 날 동안, 곧 백팔십 일 동안
  - 여러 날 동안, 정확히 백팔십 일 동안
  lexicon: יָמִים רַבִּים / שְׁמוֹנִים וּמְאַת יוֹם
  rationale: ‘many days’와 ‘one hundred and eighty days’의 병치를 유지하되, 한국어에서는 ‘곧’으로 설명적 동격을 분명히 했습니다.
theological_decisions:
- issue: 왕의 자기 과시를 어떻게 드러낼지
  chosen_reading: ‘보여 주었습니다’와 누적된 명사구를 유지하여, 단순한 축제 안내가 아니라 제국적 자기 과시라는 본문의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘축제를 열었습니다’처럼 완화된 표현
  - ‘과시했습니다’로 직접적 평가를 더한 표현
  rationale: 본문은 왕의 부와 영광을 길게 전시하는 장면이므로, 행위를 중립적으로 서술하되 의미상 과시성이 드러나도록 했습니다.
  doctrine_reference: 본문 내 서사적 특징 보존
