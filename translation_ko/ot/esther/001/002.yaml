    text: ‘수산 궁성’은 본문의 지명과 성격을 함께 살린 번역입니다. 영어 POB의 각주처럼, ‘수산 성채’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 시절에
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간 표지로서, 서사 흐름을 자연스럽게 여는 현대 한국어 표현으로 옮겼습니다.
- source_word: כְּשֶׁבֶת
  english_pob_choice: when ... sat
  chosen_korean: 앉아 있었습니다
