  source_fidelity: ‘왕위’는 통치자의 지위·권한을 우선 가리켜, 물리적인 자리인 כִּסֵּא(‘왕좌’)를 충분히 반영하지 못합니다. 또한 הַבִּירָה는 왕궁이 있는 요새화된 중심지/성채를 가리키므로 ‘성채’가 본문의 공간적 의미를 더 직접적으로 전달합니다.
