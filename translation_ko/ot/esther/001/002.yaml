  terminology: 인명은 통용 표기인 ‘아하수에로’, 지명은 ‘수산’을 유지했습니다. ‘왕좌’는 왕권을 상징하는 실제 보좌를 가리키는 원어의 의미를 보존합니다. 각주는 ‘성채’와 ‘궁성’의 안전한 어휘 대안을 제시합니다.
  issues:
