  - 앉았을 때
  - 앉아 계셨습니다
  lexicon: HALOT
  rationale: 동작의 진행 배경을 나타내므로, 단순 완료보다 상태 지속을 드러내는 표현을 택했습니다.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  english_pob_choice: on his royal throne
  chosen_korean: 자기 왕위에
  alternatives_korean:
  - 자기의 왕좌에
  - 자기 왕국의 왕위에
  lexicon: HALOT
  rationale: כִּסֵּא מַלְכוּתוֹ의 왕권적 의미를 살리되, 한국어에서 ‘왕위’가 자연스럽게 통치권과 왕좌의 의미를 함께 전달하므로 이를 선택했습니다.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  english_pob_choice: in Susa the citadel
  chosen_korean: 수산 궁성에 있는
  alternatives_korean:
  - 수산 성채에 있는
  - 수산의 궁성에 있는
  lexicon: HALOT
  rationale: הַבִּירָה는 단순한 ‘도성’보다 왕궁이 있는 요새화된 중심지를 가리키므로, ‘궁성’이 문맥에 가장 가깝습니다.
