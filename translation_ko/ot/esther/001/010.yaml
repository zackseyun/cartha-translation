  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י כְּ/ט֥וֹב לֵב הַ/מֶּ֖לֶךְ בַּ/יָּ֑יִן אָמַ֡ר לִ֠/מְהוּמָן בִּזְּתָ֨א חַרְבוֹנָ֜א בִּגְתָ֤א וַ/אֲבַגְתָא֙ זֵתַ֣ר וְ/כַרְכַּ֔ס שִׁבְעַת֙ הַ/סָּ֣רִיסִ֔ים הַ/מְשָׁ֣רְתִ֔ים אֶת פְּנֵ֖י הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
  footnotes:
  - marker: a
    text: Or 'when the king was in good spirits from wine.' The Hebrew idiom speaks of the king’s heart being glad because of wine, without explicitly stating drunkenness.
    reason: lexical_alternative
  - marker: b
    text: '''Eunuchs'' can in some contexts refer more broadly to royal court officials, but the more direct lexical sense is retained here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제칠째 날에, 왕의 마음이 술로 즐거워졌을 때, 그는 메후만, 비즈다, 하르보나, 빅다, 아박다, 제타르, 그리고 가르가스—아하수에로 왕 앞에 시중들던 일곱 내시—를 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘술로 즐거워졌을 때’는 히브리어 관용구를 따라 옮긴 것입니다. 본문은 왕이 술로 기분이 좋아진 상태를 말하지만, 명시적으로 ‘취했다’고 말하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내시’는 기본적인 어휘값을 따른 번역입니다. 일부 문맥에서는 궁정 관리 전반을 가리킬 수도 있지만, 여기서는 더 직접적인 의미를 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: On the seventh day
  chosen_korean: 제칠째 날에
  alternatives_korean:
  - 일곱째 날에
  - 제7일에
  lexicon: HALOT
  rationale: 단순한 시점 표지를 자연스러운 현대 한국어로 옮기되, 본문이 말하는 정확한 날짜성을 유지했습니다.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  english_pob_choice: when the king’s heart was merry with wine
  chosen_korean: 왕의 마음이 술로 즐거워졌을 때
  alternatives_korean:
  - 왕의 마음이 포도주로 즐거웠을 때
  - 왕이 술에 취했을 때
  lexicon: HALOT
  rationale: ‘마음이…즐거워졌다’는 히브리어 관용구를 살리면서도, POB가 지적한 대로 ‘취했다’로 과도하게 단정하지 않도록 했습니다.
- source_word: שִׁבְעַת הַסָּרִיסִים
  english_pob_choice: the seven eunuchs
  chosen_korean: 일곱 내시
  alternatives_korean:
  - 일곱 환관
  - 일곱 궁정 관리
  lexicon: HALOT
  rationale: 기본 어휘값을 따라 ‘내시’를 택해 직접성을 살렸고, 본문이 왕궁 직무를 배경으로 하므로 과도한 완곡어를 피했습니다.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי הַמֶּלֶךְ
  english_pob_choice: who attended King Ahasuerus
  chosen_korean: 아하수에로 왕 앞에 시중들던
  alternatives_korean:
  - 아하수에로 왕을 모시던
  - 아하수에로 왕 앞에서 섬기던
  lexicon: HALOT
  rationale: ‘왕의 얼굴 앞에서 섬기다’는 관용을 한국어 궁정 표현에 맞게 ‘시중들다’로 옮겨, 궁정 시종의 대면 봉사라는 뜻을 드러냈습니다.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: King Ahasuerus
  chosen_korean: 아하수에로 왕
  alternatives_korean:
  - 아하수에르스 왕
  - 아하스에로스 왕
  lexicon: HALOT
  rationale: 성경에서 널리 통용되는 고유명사 형태를 따르되, 현대 한국어 표기 관행에 맞게 음역했습니다.
theological_decisions:
- issue: 술로 ‘마음이 즐거워졌다’는 표현의 해석 범위
  chosen_reading: 본문의 관용구를 유지해 왕이 술로 기분이 좋아진 상태로 옮기되, ‘취했다’고 단정하지 않았습니다.
  alternative_readings:
  - 왕이 술에 취했다
  - 왕이 흥에 겨웠다
  rationale: 히브리어는 명시적으로 ‘만취’를 말하지 않고 감정/상태의 변화를 표현하므로, 본문의 강도를 넘지 않는 번역이 필요합니다.
  doctrine_reference: '번역 원칙: 과잉해석 회피 및 관용구 보존'
- issue: ‘시중들다’의 선택
  chosen_reading: 궁정 내시들의 직무를 친숙하지만 위계적 의미가 살아 있는 표현으로 옮겼습니다.
  alternative_readings:
  - 섬기다
  - 모시다
  rationale: 원문의 ‘왕 앞에서 봉사하다’는 궁정적 대면성을 가지므로, ‘시중들다’가 직무적 뉘앙스를 가장 자연스럽게 전달합니다.
  doctrine_reference: '번역 원칙: 문맥적 등가성과 사회적 위계 표지 보존'
