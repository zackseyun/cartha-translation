reference: Esther 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
  footnotes:
  - marker: a
    text: Or 'the princesses of Persia and Media.' The Hebrew term refers to high-ranking women; 'noblewomen' is chosen to avoid implying they were necessarily royal daughters.
    reason: lexical_alternative
  - marker: b
    text: Or 'what the queen said' / 'the matter of the queen.' The Hebrew 'word' can refer either to her statement or to the reported affair concerning her.
    reason: lexical_alternative
  - marker: c
    text: The final clause is elliptical in Hebrew, literally something like 'and enough contempt and wrath.' The translation supplies 'there will be' for clear English sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 오늘 페르시아와 메대의 귀부인들<a>은 왕비의 말을 들었으므로, 왕의 모든 대신에게 그렇게 말할 것이며, 멸시와 격분이 충분할 것입니다.<b>[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 높은 지위의 여성들을 가리키며, 반드시 왕의 딸들을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 마지막 절에서 서술어를 생략한 채 ‘그리고 충분한 멸시와 격분’에 가깝게 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרוֹת פָּרַס וּמָדַי
  english_pob_choice: noblewomen of Persia and Media
  chosen_korean: 페르시아와 메대의 귀부인들
  alternatives_korean:
  - 페르시아와 메대의 공주들
  - 페르시아와 메대의 여인들
  lexicon: HALOT
  rationale: שָׂרוֹת은 단순한 ‘여인들’보다 높은 지위를 가진 여성들을 가리키므로, 왕족 혈통을 과도하게 암시하는 ‘공주들’보다 ‘귀부인들’이 더 정확합니다.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  english_pob_choice: the queen’s word
  chosen_korean: 왕비의 말
  alternatives_korean:
  - 왕비의 말씀
  - 왕비의 일
  - 왕비가 한 말
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/일/사건’까지 아우르지만, 여기서는 왕비의 발언을 가리키므로 간결하게 ‘말’로 옮기되, 지나치게 경건한 ‘말씀’은 피했습니다.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  english_pob_choice: to all the king’s officials
  chosen_korean: 왕의 모든 대신에게
  alternatives_korean:
  - 왕의 모든 관리들에게
  - 왕의 모든 관원들에게
  - 왕의 모든 귀족들에게
  lexicon: HALOT
  rationale: שָׂרֵי הַמֶּלֶךְ는 궁정의 고위 실무자들을 가리키므로, 한국어로는 자연스럽고 직책감을 살리는 ‘대신’이 적절합니다.
- source_word: וּכְדַי בִּזָּיֹון וָקָצֶף
  english_pob_choice: there will be enough contempt and wrath
  chosen_korean: 멸시와 격분이 충분할 것입니다
  alternatives_korean:
  - 멸시와 진노가 넉넉할 것입니다
  - 멸시와 분노가 충분할 것입니다
  - 멸시와 격노가 가득할 것입니다
  lexicon: HALOT
  rationale: 히브리어는 서술어가 생략된 절로, 충분성의 뉘앙스를 살리기 위해 ‘충분할 것입니다’를 보충했습니다. בִּזָּיוֹן은 사회적 모욕을, קָצֶף는 강한 분노를 나타내므로 ‘멸시’와 ‘격분’이 어울립니다.
- source_word: וְהַיּוֹם הַזֶּה
  english_pob_choice: And today
  chosen_korean: 그리고 오늘
  alternatives_korean:
  - 그리고 이 날
  - 그리고 바로 오늘
  - 오늘에
  lexicon: HALOT
  rationale: 즉시성을 나타내는 הזמן 표현이므로, 현대 한국어에서는 간결한 ‘그리고 오늘’이 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 마지막 절의 생략된 서술어 처리
  chosen_reading: ‘충분할 것입니다’로 보충해 한국어 문장을 완결했습니다.
  alternative_readings:
  - ‘멸시와 격분이 충분합니다’
  - ‘멸시와 격분이 있을 것입니다’
  rationale: 원문은 ‘그리고 충분한 멸시와 격분’이라는 식의 엘립시스이므로, 한국어에서는 의미를 분명히 하기 위해 최소한의 서술어를 보충하는 것이 적절합니다.
  doctrine_reference: 문법적 보완 원칙(ellipsis)
