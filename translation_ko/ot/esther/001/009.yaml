  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֚ם וַשְׁתִּ֣י הַ/מַּלְכָּ֔ה עָשְׂתָ֖ה מִשְׁתֵּ֣ה נָשִׁ֑ים בֵּ֚ית הַ/מַּלְכ֔וּת אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/009.yaml
  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
  footnotes:
  - marker: a
    text: Or 'banquet'; the Hebrew term can denote a feast, often one associated with drinking.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the palace'; literally 'in the house of the kingdom/royalty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕비 와스디도 아하수에로 왕에게 속한 왕궁에서 여자들을 위한 잔치를 베풀었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또
  - 역시
  lexicon: BDB/HALOT
  rationale: 앞절의 왕 잔치에 더해진 추가 사실을 간단히 표시하는 연결어로 가장 자연스럽습니다.
- source_word: הַמַּלְכָּה
  english_pob_choice: Queen
  chosen_korean: 왕비
  alternatives_korean:
  - 여왕
  - 왕후
  lexicon: BDB/HALOT
  rationale: 에스더서의 페르시아 궁정 문맥에서 왕의 배우자를 가리키는 일반적 표현으로 ‘왕비’가 가장 자연스럽습니다.
- source_word: עָשְׂתָה מִשְׁתֵּה
  english_pob_choice: gave a feast
  chosen_korean: 잔치를 베풀었습니다
  alternatives_korean:
  - 잔치를 열었습니다
  - 연회를 베풀었습니다
  lexicon: BDB/HALOT
  rationale: 히브리어 ‘עשה’와 ‘משתה’의 결합을 한국어 관용에 맞게 옮기되, 단순히 ‘했다’보다 잔치의 주최 의미를 살렸습니다.
- source_word: בֵּית הַמַּלְכוּת
  english_pob_choice: the royal house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕실
  - 왕의 집
  lexicon: BDB/HALOT
  rationale: 직역하면 ‘왕권/왕실의 집’이지만, 본문의 궁정 공간을 가리키는 것으로 보아 현대 독자가 이해하기 쉬운 ‘왕궁’으로 옮겼습니다.
- source_word: לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: King Ahasuerus
  chosen_korean: 아하수에로 왕에게 속한
  alternatives_korean:
  - 아하수에로 왕의
  - 아하수에로 왕에게 있는
  lexicon: BDB/HALOT
  rationale: 관계절의 소유 관계를 한국어로 자연스럽게 풀어 ‘속한’으로 표현해, 왕궁의 소속을 분명히 했습니다.
