  - 왕후
  lexicon: HALOT
  rationale: 페르시아 궁정 맥락에서 와스디의 지위를 자연스럽게 드러내는 한국어 관용 표현은 ‘왕비’입니다.
- source_word: בְּכֶתֶר מַלְכוּת
  english_pob_choice: with the royal crown
  chosen_korean: 왕권의 관을 쓴 채로
  alternatives_korean:
  - 왕권의 관과 함께
  - 왕권의 관을 쓴 모습으로
  lexicon: HALOT
  rationale: ב를 도구·동반 상황으로 보고, 왕의 위엄을 나타내는 관을 실제로 착용한 상태를 한국어로 분명히 하되 원문의 의미를 넘지 않게 옮겼습니다.
- source_word: הָעַמִּים וְהַשָּׂרִים
  english_pob_choice: the peoples and the officials
  chosen_korean: 여러 백성과 관리들에게
  alternatives_korean:
  - 여러 민족과 관리들에게
  - 백성과 고관들에게
  lexicon: HALOT
  rationale: 복수형 ‘백성들/민족들’의 뉘앙스를 살리되 한국어에서는 ‘여러 백성’이 가장 자연스럽고, שָׂרִים는 궁정의 고위 인사이므로 ‘관리들’이 무난합니다.
- source_word: טוֹבַת מַרְאֶה
  english_pob_choice: beautiful in appearance
  chosen_korean: 보기에 아름다웠기 때문입니다
  alternatives_korean:
  - 외모가 아름다웠기 때문입니다
  - 용모가 좋았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘좋은 외모’의 뜻을 직접 풀어, 물리적 아름다움이라는 초점이 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 왕실 의복과 신분 표지의 표현
  chosen_reading: ‘왕권의 관’은 왕권을 상징하는 관을 가리키는 것으로 보고, 행위의 목적은 와스디의 외적 아름다움을 공개적으로 과시하는 데 있다고 옮겼습니다.
  alternative_readings:
  - ‘왕관을 쓴 채로’
  - ‘왕의 관을 쓴 상태로’
  rationale: 본문은 관의 상징성과 공개 전시 목적을 함께 전하므로, 과도한 해석 없이 두 요소를 모두 드러내는 번역이 적절합니다.
  doctrine_reference: 서술 본문 해석
