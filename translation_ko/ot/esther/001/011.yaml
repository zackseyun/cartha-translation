base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
  footnotes:
  - marker: a
    text: Or 'with the royal crown.' The Hebrew preposition can be rendered more literally that way; 'wearing the royal crown' makes the sense explicit in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'the people and the officials.' The Hebrew has a plural form, 'the peoples,' which may reflect the empire's many subject peoples.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'for she was good of appearance,' a Hebrew idiom meaning physically beautiful.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕비 와스디를 왕 앞에 왕권의 관을 쓴 채로 데려와, 여러 백성과 관리들에게 그녀의 아름다움을 보이게 하려는 것이었습니다. 이는 그녀가 보기에 아름다웠기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕권의 관과 함께’. 히브리어 전치사는 좀 더 문자적으로 이렇게도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형 ‘여러 백성들’을 사용합니다. 이는 제국 안의 여러 속국 백성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그녀가 외모가 좋았기 때문입니다’이며, 히브리어 관용구로서 육체적으로 아름답다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  english_pob_choice: to bring
  chosen_korean: 데려와
  alternatives_korean:
  - 가져와
  - 모셔 와
  lexicon: HALOT
  rationale: 히필 부정사구로서 누군가를 왕 앞에 오게 하는 사역의 뜻이므로, 상황상 자연한 ‘데려와’가 적절합니다.
- source_word: הַמַּלְכָּה
  english_pob_choice: Queen
  chosen_korean: 왕비
  alternatives_korean:
