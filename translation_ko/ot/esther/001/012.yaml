  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
  footnotes:
  - marker: a
    text: Literally, 'by the hand of the eunuchs,' an idiom meaning the command was conveyed through them.
    reason: lexical_alternative
  - marker: b
    text: Or 'his fury burned in him.' The Hebrew preserves the imagery of anger as fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 와스디 왕비는 내시들을 통해[a] 전해진 왕의 명령에 따라 오기를 거부하였습니다. 그러자 왕은 몹시 분노하였고, 그의 진노는 그의 속에서 불타올랐습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내시들의 손으로’입니다. 히브리어 관용구로서, 그들을 통해 왕의 명령이 전달되었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 격분이 그 안에서 타올랐다’입니다. 히브리어는 분노를 불처럼 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  english_pob_choice: refused
  chosen_korean: 거부하였고
  alternatives_korean:
  - 거절하였고
  - 마지않았고
  lexicon: HALOT
  rationale: מאן은 단순한 무관심이 아니라 의도적인 거부를 뜻하므로, 서술의 힘을 살리는 ‘거부하다’가 가장 직접적입니다.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  english_pob_choice: Queen Vashti
  chosen_korean: 와스디 왕비
  alternatives_korean:
  - 왕비 와스디
  - 와스디 여왕
  lexicon: HALOT
  rationale: 한국어에서는 호칭을 뒤에 두는 것이 자연스러우므로 ‘와스디 왕비’로 옮기되, 그녀의 지위를 분명히 했습니다.
- source_word: בִּדְבַר הַמֶּלֶךְ
  english_pob_choice: at the king’s command
  chosen_korean: 왕의 명령에
  alternatives_korean:
  - 왕의 말씀에
  - 왕의 말에
  - 왕의 지시에
  lexicon: HALOT
  rationale: דבר은 여기서 왕의 공식적 지시를 가리키므로, 일상적 ‘말씀’보다 ‘명령’이 문맥의 강도를 더 잘 드러냅니다.
- source_word: בְּיַד הַסָּרִיסִים
  english_pob_choice: by the hand of the eunuchs
  chosen_korean: 내시들의 손을 통해 전해진
  alternatives_korean:
  - 내시들의 손으로
  - 내시들을 통해
  - 내시들의 손에 의해
  lexicon: HALOT
  rationale: ‘손’은 중개를 뜻하는 관용구이므로, 의미를 풀어 ‘손을 통해 전해진’으로 옮겨 중개적 전달을 드러냈습니다.
- source_word: וַיִּקְצֹף ... מְאֹד
  english_pob_choice: became very angry
  chosen_korean: 매우 분노하였으며
  alternatives_korean:
  - 몹시 노하였으며
  - 극도로 화하였으며
  lexicon: HALOT
  rationale: קצף는 강한 분노를 뜻하므로 ‘분노하다’로 옮기고, מְאֹד는 ‘매우’로 자연스럽게 강도를 살렸습니다.
- source_word: וַחֲמָתוֹ בָּעֲרָה בּוֹ
  english_pob_choice: his wrath burned within him
  chosen_korean: 그의 격분은 그 안에서 타올랐습니다
  alternatives_korean:
  - 그의 진노는 그 안에서 불탔습니다
  - 그의 분노는 그 안에서 타올랐습니다
  lexicon: HALOT
  rationale: חֵמָה와 בערה의 불타는 이미지를 살려 직역성을 유지하되, 한국어로는 ‘타올랐다’가 감정의 격렬함을 자연스럽게 전달합니다.
theological_decisions:
- issue: 왕의 감정 묘사에서 불의 이미지를 유지할지 여부
  chosen_reading: ‘그의 격분은 그 안에서 타올랐습니다’로, 분노를 불로 묘사하는 히브리어의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘그는 더욱 화가 났습니다’처럼 이미지 없이 평탄화하는 방식
  - ‘그의 분노가 그의 안에서 불탔습니다’처럼 더 직역하는 방식
  rationale: 본문은 단순한 감정 상태 보고가 아니라 분노의 상승과 내적 격화를 불의 은유로 보여 주므로, 이미지를 보존하는 것이 원문의 힘에 충실합니다.
  doctrine_reference: 시적/서술적 은유 보존 원칙
