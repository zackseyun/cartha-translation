  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
  footnotes:
  - marker: a
    text: Or 'feast'; the Hebrew term often refers to a drinking banquet.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the citadel of Susa.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the greatest to the least,' an idiom meaning people of every rank.
    reason: lexical_alternative
  - marker: d
    text: The final term may also be rendered 'pavilion' or 'house'; 'palace' best fits the royal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 기간이 끝나자, 왕은 수산 성채에 있는 모든 백성, 곧 높은 사람부터 낮은 사람까지를 위해 왕궁 정원 뜰에서 칠 일 동안 잔치를 베풀었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘연회’. 히브리어 용어는 흔히 음주가 포함된 잔치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수산 성채 안에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가장 큰 사람부터 가장 작은 사람까지’라는 관용구로, 모든 신분을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 어휘는 ‘정자’ 또는 ‘집’으로도 옮길 수 있으나, 왕실 맥락에는 ‘왕궁’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת הַיָּמִים הָאֵלֶּה
  english_pob_choice: And when these days were completed
  chosen_korean: 이 기간이 끝나자
  alternatives_korean:
  - 이 날들이 다 채워지자
  - 이 날들이 끝났을 때
  lexicon: HALOT
  rationale: 완료를 나타내는 זמ/מלא의 시간 부사구를 한국어에서 자연스럽게 풀어, 앞선 기간의 종료라는 시간 관계를 분명히 했습니다.
- source_word: עָשָׂה הַמֶּלֶךְ לְכָל הָעָם
  english_pob_choice: the king gave a banquet for all the people
  chosen_korean: 왕은 ... 잔치를 베풀었습니다
  alternatives_korean:
  - 왕은 ... 연회를 열었습니다
  - 왕은 ... 잔치를 마련했습니다
  lexicon: HALOT
  rationale: מִשְׁתֶּה와 결합한 עָשָׂה는 단순히 ‘하다’가 아니라 잔치를 베풀다/베풀다의 관용 표현이므로, 왕이 행사를 주최했다는 뜻을 살렸습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일주일 동안
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 직설적으로 반영하면서도 현대 한국어 문맥에서 자연스럽게 읽히도록 했습니다.
- source_word: בְּשׁוּשַׁן הַבִּירָה ... בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ
  english_pob_choice: in Susa the citadel ... in the court of the garden of the king’s palace
  chosen_korean: 수산 성채에 있는 ... 왕궁 정원 뜰에서
  alternatives_korean:
  - 수산 성채 안에 있는 ... 왕궁의 정원 뜰에서
  - 수산의 성채에 있는 ... 왕궁 정원의 뜰에서
  lexicon: HALOT
  rationale: בִּירָה는 단순한 도시명이 아니라 성채/요새의 뉘앙스를 가지므로 ‘성채’로, חָצַר־גִּנָּה־בִּיתָן의 공간 연쇄는 ‘왕궁 정원 뜰’로 압축해 장소감을 유지했습니다.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  english_pob_choice: from great to small
  chosen_korean: 높은 사람부터 낮은 사람까지
  alternatives_korean:
  - 큰 사람부터 작은 사람까지
  - 최고에서 최하까지
  lexicon: HALOT
  rationale: 이 관용구는 신분/지위의 포괄성을 나타내므로, 한국어에서도 계층 전체를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 잔치가 단순한 식사인지, 음주가 동반된 연회인지
  chosen_reading: 본문에는 מִשְׁתֶּה의 기본 의미를 따라 ‘잔치’로 두되, 과도한 설명은 넣지 않았습니다.
  alternative_readings:
  - ‘연회’
  - ‘술잔치’
  rationale: 히브리어는 일반적인 잔치이면서도 음주가 수반될 수 있는 용례를 가집니다. 한국어 본문은 원문이 직접 말하는 범위 안에서 간결하게 유지했습니다.
  doctrine_reference: 본문 의미의 과잉 해석 방지
