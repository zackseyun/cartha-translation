  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
  footnotes:
  - marker: a
    text: Or 'If it pleases the king.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that it may not be altered' or 'so that it may not be transgressed.' The Hebrew idiom refers to the decree's fixed legal force.
    reason: lexical_alternative
  - marker: c
    text: Literally 'her royalty' or 'her queenship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕께서 좋게 여기시면, 왕 앞에서 왕령이 나가서 페르시아와 메대의 법들 가운데에 기록되어, 번복되지 않게 하시고, 왕후 와스디가 다시는 아하수에로 왕 앞에 나오지 못하게 하며, 왕께서는 그녀보다 더 나은 다른 여자에게 그녀의 왕후 자리를 주게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋게 여기시면’은 ‘왕께 마음에 드시면/왕이 보시기에 좋으면’이라는 관용구를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘번복되지 않게’는 ‘변경되지 않게’ 또는 ‘폐기되지 않게’라는 뜻을 포함하는 법률적 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕후 자리’는 문자적으로는 ‘그녀의 왕후됨/왕권’에 해당하지만, 문맥상 왕후의 직위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  english_pob_choice: If it seems good to the king
  chosen_korean: 왕께서 좋게 여기시면
  alternatives_korean:
  - 왕께 마음에 드시면
  - 왕이 보시기에 좋으면
  lexicon: HALOT
  rationale: 히브리어 관용구는 왕의 승인에 대한 공손한 제안을 뜻하므로, 현대 한국어에서는 자연스럽게 ‘좋게 여기시면’으로 옮기는 것이 가장 가깝습니다.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  english_pob_choice: let a royal decree go out from before him
  chosen_korean: 왕 앞에서 왕령이 나가서
  alternatives_korean:
  - 왕으로부터 왕령이 나가서
  - 왕의 앞에서 칙령이 나가서
  lexicon: HALOT
  rationale: דְבַר מַלְכוּת는 단순한 ‘말’이 아니라 공식적 왕령이므로 ‘왕령’으로, מִלְּפָנָיו는 ‘왕 앞에서’로 반영해 권위의 발원 지점을 살렸습니다.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי וְלֹא יַעֲבֹר
  english_pob_choice: and be written among the laws of Persia and Media, so that it may not be revoked
  chosen_korean: 페르시아와 메대의 법들 가운데에 기록되어, 번복되지 않게 하시고
  alternatives_korean:
  - 페르시아와 메대의 법들에 기록되어, 폐기되지 않게 하시고
  - 페르시아와 메대의 법전에 기록되어, 변경되지 않게 하시고
  lexicon: HALOT
  rationale: ‘기록되다’는 법전 편입을, ‘번복되지 않다’는 법적 효력의 불가역성을 현대 한국어로 자연스럽게 드러냅니다.
- source_word: וּמַלְכוּתָהּ
  english_pob_choice: her royal position
  chosen_korean: 그녀의 왕후 자리
  alternatives_korean:
  - 그녀의 왕권
  - 그녀의 왕후 직분
  - 그녀의 왕후권
  lexicon: HALOT
  rationale: 문맥상 영토적 왕국이 아니라 와스디의 왕후 직위를 가리키므로, ‘왕후 자리’가 가장 분명하고 한국어 독자에게 자연스럽습니다.
theological_decisions:
- issue: The verse is a court decree, not a doctrinal statement, so the main issue is preserving legal force and honorific register.
  chosen_reading: 공적 칙령/왕령의 형식을 살리되, 한국어는 합쇼체로 옮겨 궁정 제안의 공손함과 법적 엄중함을 함께 드러냈습니다.
  alternative_readings:
  - 더 직설적인 명령형
  - 더 문어적인 개역식 표현
  rationale: 원문은 신학적 논쟁점보다 궁정-법정 문체가 핵심이므로, 현대적이면서도 권위 있는 합쇼체가 가장 적절합니다.
  doctrine_reference: 서사-법정 문체의 충실한 재현
