  source_fidelity: ‘주권을 행사하고’는 국가의 주권을 연상시켜 שֹׂרֵר(자기 집 안에서 다스리다/권위를 행사하다)의 뜻에 맞지 않습니다. 또한 ‘각자의 언어’는 앞의 עַם וָעָם(각 민족/백성)과의 분배적 대응을 더 분명히 드러내는 편이 좋습니다. 수정문은 왕이 각 지방과 각 민족에 그에 맞는 문자와 언어로 문서를 보내고, 모든 남자가 가정에서 다스리며 자기 백성의 언어로 말하게 하려 했다는 히브리어의 문장 구조와 칙령의 목적을 보존합니다.
  naturalness: ‘왕이 … 보내어 … 하도록 하였습니다’는 현대 표준어 합쇼체에서 자연스럽고, ‘자기 집에서 다스리며’는 가정 내 권위라는 불편하지만 본문에 있는 내용을 과장하거나 완화하지 않고 전달합니다.
  terminology: כִּכְתָבָהּ는 ‘그 지방의 문자’로 명시하여 언어와 구별했습니다. עַם은 제국 안의 각 ‘민족’으로, כָּל אִישׁ는 본문에서는 ‘모든 남자’로 유지했습니다. שֹׂרֵר는 ‘주권을 행사하다’ 대신 ‘다스리다’로 옮겼습니다.
