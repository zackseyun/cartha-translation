id: EST.1.22
reference: Esther 1:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח סְפָרִים֙ אֶל כָּל מְדִינ֣וֹת הַ/מֶּ֔לֶךְ אֶל מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/אֶל עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ לִ/הְי֤וֹת כָּל אִישׁ֙ שֹׂרֵ֣ר בְּ/בֵית֔/וֹ וּ/מְדַבֵּ֖ר כִּ/לְשׁ֥וֹן עַמּֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
  footnotes:
  - marker: a
    text: Or 'all the king's provinces.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in its own script ... in its own language,' emphasizing that the decree was distributed in forms appropriate to each province and people.
    reason: cultural_note
  - marker: c
    text: Or 'that every husband should rule in his own house.' The Hebrew says 'every man,' but in context the decree concerns household authority in marriage.
    reason: lexical_alternative
  - marker: d
    text: The final clause may mean either that each man was to speak the language of his own people, or more broadly that household order should reflect the husband's linguistic identity.
    reason: alternative_reading
translation:
  language: ko
  text: 왕의 모든 지방 곧 각 지방에는 그 지방의 글로, 모든 백성에게는 각자의 언어로 문서를 보내어, 모든 남자가 자기 집에서 주권을 행사하고 자기 백성의 언어로 말하게 하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 지방에 맞는 글자 체계와 언어를 모두 강조합니다.
    reason: source_note
  - marker: b
    text: 문맥상 이 칙령은 각 가정에서 남성 권위를 인정하라는 내용입니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘자기 백성의 언어로 말하게 하여’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘백성’은 제국 내부의 언어·민족 집단을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: סְפָרִים
  english_pob_choice: letters
  chosen_korean: 문서
  alternatives_korean:
  - 편지
  - 서신
  lexicon: HALOT
  rationale: 왕의 포고를 각 지방에 배포하는 행정 문맥이므로 개인적 편지보다 공문서에 가까운 ‘문서’가 자연스럽습니다.
- source_word: כִּכְתָבָהּ
  english_pob_choice: in its own script
  chosen_korean: 그 지방의 글로
  alternatives_korean:
  - 그 지방의 문자로
  - 그 지방 고유의 서체로
  lexicon: HALOT
  rationale: 히브리어는 각 지방의 쓰기 체계를 가리키므로, ‘글로’는 문자/필기 체계를 넓게 포괄하면서도 현대 한국어에서 자연스럽습니다.
- source_word: כִּלְשׁוֹנוֹ / כִּלְשׁוֹן עַמּוֹ
  english_pob_choice: in its own language / the language of his own people
  chosen_korean: 각자의 언어로 ... 자기 백성의 언어로
  alternatives_korean:
  - 자기 말로 ... 자기 ժողովրդի 말로
  - 자기 고유의 언어로 ... 그 백성의 말로
  lexicon: HALOT
  rationale: ‘לשון’은 언어/말을 뜻하므로, 앞뒤를 모두 ‘언어’로 맞춰 분배적 의미와 평행 구조를 분명히 했습니다.
- source_word: שֹׂרֵר
  english_pob_choice: master
  chosen_korean: 주권을 행사하고
  alternatives_korean:
  - 주인 노릇하고
  - 지배하고
  - 권세를 부리고
  lexicon: HALOT
  rationale: 가정 질서에 대한 통치/우위의 뜻을 살리되, 영어의 ‘master’가 가진 뉘앙스를 한국어에서 가장 덜 오해되게 옮기기 위해 ‘주권을 행사하다’로 풀었습니다.
theological_decisions:
- issue: ‘every man’의 범위를 가정의 남편/가장으로 볼지 여부
  chosen_reading: 본문의 일반적 표현을 유지하되, 문맥상 가정 안에서의 남성 권위를 가리키는 것으로 이해됩니다.
  alternative_readings:
  - ‘모든 남자’로 넓게 유지
  - ‘모든 남편’으로 좁혀 번역
  rationale: 히브리어는 문자적으로 ‘모든 남자’이지만, 왕의 가정질서 칙령이라는 문맥에서 POB가 주석으로 지적하듯 남편/가장 권위의 문제로 읽히므로 본문은 일반 표현을 유지하면서도 뜻이 전달되게 했습니다.
  doctrine_reference: 창세기 3:16; 에스더 1:22 주석 문맥
- issue: 가정 통치의 강도를 한국어로 어떻게 드러낼지
  chosen_reading: ‘주권을 행사하고’로 옮겨 단순한 역할 수행이 아니라 권위 행사라는 점을 드러냈습니다.
  alternative_readings:
  - ‘주인이 되고’
  - ‘다스리고’
  - ‘권위를 가지며’
  rationale: שֹׂרֵר의 지배/우위 의미를 약화시키지 않으면서도 현대 한국어에서 직역투를 피하기 위한 선택입니다.
  doctrine_reference: HALOT; 본문 어휘 의미
