base_translation:
  language: en
  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: ko
  text: 그때 왕은 때를 아는 지혜자들에게 말하였습니다. 왕이 일을 처리할 때에는 법과 판결을 아는 모든 사람 앞에서 이와 같이 하는 것이 관례였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때를 아는’은 적절한 시기와 궁정의 관례를 분별하는 지혜자들을 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘법과 판결’은 히브리어 דָּת וָדִין을 옮긴 것으로, 법·법령과 판정의 영역을 함께 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  lexicon: 왕
  rationale: 페르시아 궁정 문맥에서 일반적이고 직역에 충실한 기본 호칭을 택했습니다.
- source_word: לַחֲכָמִים יֹדְעֵי הָעִתִּים
  english_pob_choice: to the wise men who knew the times
  chosen_korean: 때를 아는 박사들
  alternatives_korean:
