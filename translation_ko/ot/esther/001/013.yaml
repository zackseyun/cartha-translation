base_translation:
  language: en
  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: ko
  text: 그때 왕이 때를 아는 박사들에게 말하였으니—이는 왕의 처사가 율법과 판결을 아는 모든 사람 앞에서 그러했기 때문입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때’를 아는 사람들은 왕실의 적절한 시기와 관례를 판단하는 궁정 자문관들을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘율법과 판결’은 히브리어 דָּת וָדִין의 관용적 짝을 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  lexicon: 왕
  rationale: 페르시아 궁정 문맥에서 일반적이고 직역에 충실한 기본 호칭을 택했습니다.
- source_word: לַחֲכָמִים יֹדְעֵי הָעִתִּים
  english_pob_choice: to the wise men who knew the times
  chosen_korean: 때를 아는 박사들
  alternatives_korean:
  - 시기를 아는 지혜자들
  - 때를 아는 현인들
  lexicon: 박사
  rationale: חֲכָמִים은 단순한 ‘지혜로운 사람들’보다 궁정 자문 집단의 성격이 강해 한국어로는 ‘박사들’이 보다 기능적으로 대응합니다.
- source_word: דָּת וָדִין
  english_pob_choice: law and judgment
  chosen_korean: 율법과 판결
  alternatives_korean:
  - 법과 재판
  - 법과 판결
  lexicon: 율법 / 판결
  rationale: דָּת는 궁정의 법규·법령을 가리키므로 ‘율법’으로, דִין은 판정·심판의 뜻을 살려 ‘판결’로 옮겼습니다.
- source_word: דְּבַר הַמֶּלֶךְ
  english_pob_choice: the king’s procedure
  chosen_korean: 왕의 처사
  alternatives_korean:
  - 왕의 절차
  - 왕의 방식
  lexicon: 처사
  rationale: POB의 ‘procedure’는 단순한 형식 절차보다 왕이 행하는 일처리 전반을 가리켜, 한국어에서는 ‘처사’가 가장 자연스럽고 원문 범위를 잘 담습니다.
