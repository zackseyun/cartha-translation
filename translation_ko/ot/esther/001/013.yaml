review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘박사들’, ‘율법’, ‘왕의 처사’는 각각 חֲכָמִים, דָּת, דְּבַר הַמֶּלֶךְ의 문맥상 의미를 다소 좁히거나 현대 한국어에서 다른 연상을 일으킵니다. 특히 ‘율법’은 이스라엘의 토라를 연상시키므로 페르시아 궁정의 법·법령을 가리키는 דָּת에 적절하지 않습니다. 원문의 ‘때를 아는’ 표현과, 왕이 법과 판결을 아는 이들 앞에서 이와 같이 일을 처리하던 관례라는 설명을 보존했습니다.
  naturalness: ‘그때 왕이 … 말하였으니—이는 … 때문입니다—’는 현대 한국어에서 인과 관계와 문장 종결이 어색합니다. 두 문장으로 나누어 궁정 서술의 격식을 유지하면서도 자연스럽게 다듬었습니다.
  terminology: חֲכָמִים은 학위·전문직을 뜻하기 쉬운 ‘박사들’보다 ‘지혜자들’이 안전합니다. דָּת וָדִין은 종교적 색채가 강한 ‘율법과 판결’ 대신 ‘법과 판결’로 옮겼습니다. ‘왕의 일’은 דְּבַר הַמֶּלֶךְ의 폭넓은 ‘왕의 사안/업무’ 의미를 보존합니다.
  issues:
