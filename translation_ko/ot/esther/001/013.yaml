  rationale: חֲכָמִים은 단순한 ‘지혜로운 사람들’보다 궁정 자문 집단의 성격이 강해 한국어로는 ‘박사들’이 보다 기능적으로 대응합니다.
- source_word: דָּת וָדִין
  english_pob_choice: law and judgment
  chosen_korean: 율법과 판결
  alternatives_korean:
  - 법과 재판
  - 법과 판결
  lexicon: 율법 / 판결
  rationale: דָּת는 궁정의 법규·법령을 가리키므로 ‘율법’으로, דִין은 판정·심판의 뜻을 살려 ‘판결’로 옮겼습니다.
- source_word: דְּבַר הַמֶּלֶךְ
  english_pob_choice: the king’s procedure
  chosen_korean: 왕의 처사
  alternatives_korean:
  - 왕의 절차
  - 왕의 방식
  lexicon: 처사
  rationale: POB의 ‘procedure’는 단순한 형식 절차보다 왕이 행하는 일처리 전반을 가리켜, 한국어에서는 ‘처사’가 가장 자연스럽고 원문 범위를 잘 담습니다.
