id: EST.1.6
reference: Esther 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
  footnotes:
  - marker: a
    text: The precise materials named in the flooring list are uncertain. 'Alabaster,' 'marble,' 'mother-of-pearl,' and 'precious stones' reflect common scholarly identifications, but some render the terms differently, such as 'porphyry,' 'white marble,' or 'dark stone.'
    reason: lexical_alternative
  - marker: b
    text: Or 'silver rods' for 'silver rings'; the Hebrew term may refer more generally to rounded or rolled silver fixtures.
    reason: lexical_alternative
  - marker: c
    text: '''Couches'' refers to banquet couches for reclining at a feast, not ordinary sleeping beds.'
    reason: cultural_note
translation:
  language: ko
  text: 흰 천과 푸른 장식 천의 휘장이 있었는데, 그것들은 가는 삼베 실과 자주색 끈으로 은 고리와 대리석 기둥에 매어 있었고, 황금과 은 침상들이 석고와 대리석과 진주빛 재료와 귀한 돌로 된 바닥 위에 놓여 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바닥 재료로 보이는 히브리어 표현들은 정확한 물질 식별이 확실하지 않으며, 전통적으로는 석고·대리석·진주층·귀한 돌 등으로 다양하게 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘은 고리’는 휘장을 매는 둥근 은 장식으로 이해한 번역입니다. 히브리어는 더 일반적으로 ‘은 막대’처럼 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘침상들’은 잠자는 침대가 아니라 잔치 자리에서 기대는 연회용 가구를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  english_pob_choice: hangings of white cotton and blue
  chosen_korean: 흰 천과 푸른 장식 천의 휘장
  alternatives_korean:
  - 흰 목화천과 푸른 천의 휘장
  - 흰 천과 청색 휘장
  lexicon: HALOT
  rationale: חוּר은 이 장식 문맥에서 색깔인 ‘흰’으로, כַּרְפַּס와 תְכֵלֶת은 궁전 장식용 직물의 목록으로 보아 ‘푸른 장식 천’으로 옮겼습니다.
- source_word: חַבְלֵי בּוּץ וְאַרְגָּמָן
  english_pob_choice: cords of fine linen and purple
  chosen_korean: 가는 삼베 실과 자주색 끈
  alternatives_korean:
  - 가는 베실과 자주색 끈
  - 고운 아마포 끈과 자주색 끈
  lexicon: HALOT
  rationale: בּוּץ는 고운 리넨류를 가리키므로 기능상 ‘실/끈’으로 자연스럽게 풀고, אַרְגָּמָן은 궁정 장식의 색채어로서 ‘자주색’으로 옮겼습니다.
- source_word: גְּלִילֵי כֶסֶף / עַמּוּדֵי שֵׁשׁ
  english_pob_choice: silver rings and marble pillars
  chosen_korean: 은 고리와 대리석 기둥
  alternatives_korean:
  - 은 막대와 대리석 기둥
  - 은 고리와 흰 돌 기둥
  lexicon: HALOT
  rationale: גְּלִילֵי כֶסֶף은 문맥상 휘장을 매는 둥근 은 장식으로 이해하여 ‘은 고리’로, עַמּוּדֵי שֵׁשׁ은 건축 문맥의 흰 돌 기둥으로 보아 ‘대리석 기둥’으로 옮겼습니다.
- source_word: מִטּוֹת זָהָב וָכֶסֶף עַ֛ל רִצְפַ֥ת בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  english_pob_choice: couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl, and precious stones
  chosen_korean: 황금과 은 침상들이 석고와 대리석과 진주빛 재료와 귀한 돌로 된 바닥
  alternatives_korean:
  - 황금과 은의 침상들이 알라바스터와 대리석과 진주와 귀한 돌의 바닥
  - 금과 은으로 된 누웠다 침상들이 석고와 대리석과 진주빛 재료와 귀한 돌로 된 포장
  lexicon: HALOT
  rationale: מִטּוֹת은 연회에서 눕는 가구이므로 ‘침상들’로, 바닥 재료 목록은 영어 POB의 신중한 식별을 따라 ‘석고·대리석·진주빛 재료·귀한 돌’로 옮겨 불확실성을 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 궁전 장식 목록의 재료명 불확실성 보존
  chosen_reading: 바닥 재료는 확정적 이름으로 단정하지 않고, 독자에게 화려한 장식의 감각을 전달하면서도 재료 식별의 불확실성을 남겼습니다.
  alternative_readings:
  - 알라바스터, 대리석, 마더오브펄, 귀한 돌
  - 백색석, 홍석, 진주층, 보석
  rationale: 히브리어 고유어들이 희귀하고 식별이 논쟁적이므로, 본문이 말하는 호화로움을 유지하되 세부 물질의 확정은 피하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문 해석 원칙
- issue: 연회용 침상 의미 보존
  chosen_reading: מִטּוֹת을 일반적인 ‘침대’가 아니라 연회장에서 비스듬히 기대는 ‘침상들’로 번역했습니다.
  alternative_readings:
  - 침대
  - 소파
  rationale: 장면은 수면용 가구가 아니라 궁정 연회의 식사·연회 문맥이므로, 문화적 기능을 살린 번역이 필요합니다.
  doctrine_reference: 역사·문화적 문맥
