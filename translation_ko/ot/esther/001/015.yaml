  source_fidelity: 현 번역의 ‘유대인들 가운데에서는’은 히브리어 본문에 전혀 없는 내용을 삽입하여 삭제해야 합니다. מַה לַּעֲשׂוֹת은 희망이나 의향을 묻는 표현이 아니라 법적 처분으로 무엇을 해야 하는지를 묻습니다. 수정문은 כְּדָת, 왕비 와스디, 왕의 명령, 내시들을 통한 전달 및 불이행의 사유를 모두 보존합니다.
  naturalness: ‘법에 따라 … 어떻게 처리해야 합니까?’는 현대 표준 한국어의 공식적 합쇼체로 자연스럽고, 궁정의 법적 숙의라는 문맥에도 맞습니다. ‘명령을 이행하지 않은’은 원문의 עָשְׂתָה를 과도하게 ‘복종하다’로 해석하지 않으면서 자연스럽습니다.
  terminology: ‘왕비 와스디’, ‘아하수에로 왕’, ‘명령’, ‘내시들’을 유지했습니다. סָרִיסִים의 더 넓은 ‘궁정 관리’ 가능성은 각주에 남겨 두었으며, 본문에는 직접적인 번역인 ‘내시들’을 사용했습니다.
