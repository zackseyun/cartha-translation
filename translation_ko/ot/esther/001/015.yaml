id: EST.1.15
reference: Esther 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
  footnotes:
  - marker: a
    text: Or 'through the eunuchs'; literally, 'by the hand of the eunuchs.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term can also refer more broadly to court officials, though 'eunuchs' is the more direct rendering.
    reason: cultural_note
  - marker: c
    text: Or 'because she did not obey the command of King Ahasuerus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 법에 따라, 내시들을[a][b] 통하여 전한 아하수에로 왕의 명령을 이행하지 않은[c] 왕비 와스디를 어떻게 처리해야 합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내시들의 손으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 סָרִיסִים는 문맥에 따라 내시뿐 아니라 궁정 관리들을 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘명령을 따르지 않은’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  english_pob_choice: According to the law
  chosen_korean: 법에 따라
  alternatives_korean:
  - 관례에 따라
  - 법대로
  lexicon: HALOT
  rationale: 페르시아 궁정 맥락의 דָּת는 단순한 관습보다 공적 법/규정의 성격이 강하므로, 한국어도 ‘법에 따라’로 형식적 판단 틀을 살렸습니다.
- source_word: מַה לַּעֲשׂוֹת
  english_pob_choice: what is to be done
  chosen_korean: 무엇을 하고 싶은 것입니까
  alternatives_korean:
  - 무엇을 해야 합니까
  - 어떻게 처리해야 합니까
  lexicon: HALOT
  rationale: 질문이 법적 처분을 묻는 형태라서 직역상 ‘무엇을 해야 합니까’가 가능하지만, 본문 문맥의 숙의적 질문성을 살려 ‘무엇을 하고 싶은 것입니까’로 옮겼습니다. 다만 이 표현은 본문의 법적 엄격성을 약화시킬 수 있어, 최종본에서는 더 직접적인 대안을 재검토할 여지가 있습니다.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  english_pob_choice: with Queen Vashti
  chosen_korean: 왕비 와스디에게
  alternatives_korean:
  - 왕비 와스디와 관련하여
  - 왕비 와스디에 대하여
  lexicon: HALOT
  rationale: עשה와 함께 쓰인 전치사는 대상에 대한 처분/조치를 가리키므로, 한국어는 법정적 자연스러움을 위해 ‘에게’를 택했습니다.
- source_word: לֹא עָשְׂתָה אֶת מַאֲמַר
  english_pob_choice: did not carry out the command
  chosen_korean: 명령을 따르지 않은
  alternatives_korean:
  - 명령을 실행하지 않은
  - 명령을 이행하지 않은
  lexicon: HALOT
  rationale: מַאֲמַר는 단순한 말보다 왕의 권위 있는 명령을 뜻하므로 ‘명령’을 사용했고, עשה를 ‘따르다’로 옮겨 POB의 주의점처럼 ‘obey’의 강한 해석을 본문에 직접 넣지 않았습니다.
- source_word: בְּיַד הַסָּרִיסִים
  english_pob_choice: delivered by the eunuchs
  chosen_korean: 내시들을 통해 전한
  alternatives_korean:
  - 내시들의 손을 통해 전한
  - 내시들에 의해 전한
  lexicon: HALOT
  rationale: 직역은 ‘내시들의 손으로’이지만 한국어에서는 의사 전달의 매개를 자연스럽게 드러내는 ‘통해 전한’이 가장 가까우며, סָרִיסִים의 궁정 관직/내시 의미는 POB의 직접 번역을 따라 ‘내시들’로 유지했습니다.
theological_decisions:
- issue: 본문의 법정적 질문 형식과 대상 표기
  chosen_reading: ‘법에 따라’와 ‘와스디에게’로 옮겨, 궁정 재판 회의의 처분 질문이라는 성격을 유지했습니다.
  alternative_readings:
  - ‘관례에 따라’로 완화하는 번역
  - ‘와스디와 관련하여’로 중성화하는 번역
  rationale: 이 절은 윤리적 평가보다 왕실 법정의 처분 논의를 묻는 장면이므로, 본문의 제도적 긴장을 흐리지 않도록 유지했습니다.
  doctrine_reference: 해석상 장르 보존 원칙
