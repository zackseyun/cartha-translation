id: EST.1.1
reference: Esther 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: Now it happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
  footnotes:
  - marker: a
    text: Or 'Xerxes,' if the name is taken as the historically identified Persian king rather than transliterated directly from the Hebrew.
    reason: alternative_reading
  - marker: b
    text: '''Cush'' is the ancient regional name; some translations render it ''Ethiopia.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아하수에로의 시대, 곧 인도에서부터 구스에 이르기까지 백이십칠 지방을 다스리던 그 아하수에로의 때에 이런 일이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구스’는 고대 지역명입니다. 일부 번역은 이를 ‘에티오피아’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아하수에로’는 역사적으로 크세르크세스 1세와 동일시되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 이런 일이 있었습니다
  alternatives_korean:
  - 그리고 일이 있었습니다
  - 그때 일이 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서사 도입어를 한국어의 자연스러운 이야기 전환으로 옮기되, 지나치게 문자적인 ‘그리고’보다 서두의 기능을 살렸습니다.
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: …의 시대, …의 때에
  alternatives_korean:
  - …의 날들에
  - … 동안에
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간표현을 현대 한국어 서술체에 맞게 자연스럽게 옮겼습니다.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: the Ahasuerus
  chosen_korean: 그 아하수에로
  alternatives_korean:
  - 그 아하수에로스
  - 바로 그 아하수에로
  lexicon: HALOT
  rationale: 반복된 고유명사가 앞의 아하수에로를 지시하는 설명적 동격이므로 ‘그’로 식별 기능을 살렸습니다.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  english_pob_choice: from India to Cush
  chosen_korean: 인도에서부터 구스에 이르기까지
  alternatives_korean:
  - 인도에서 구스까지
  - 인도에서 에티오피아까지
  lexicon: HALOT
  rationale: הֹדּוּ는 ‘인도’로, כּוּשׁ은 현대 국가명 ‘에티오피아’보다 고대 지리명 ‘구스’가 본문 범위를 더 정확히 보존합니다.
- source_word: מְדִינָה
  english_pob_choice: provinces
  chosen_korean: 지방
  alternatives_korean:
  - 도
  - 행정 구역
  lexicon: HALOT
  rationale: 페르시아 제국의 행정 단위를 한국어로 널리 이해되면서도 ‘province’의 감각을 살릴 수 있는 ‘지방’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 통치 범위 표기
  chosen_reading: 본문의 지리·정치적 과장은 역사 서술의 도입부로 그대로 유지했습니다.
  alternative_readings:
  - 현대 독자에게 맞게 축소해 풀어쓰기
  - 역사적 식별인 ‘크세르크세스’로 바꾸기
  rationale: 에스더 1:1의 기능은 이야기를 시작하며 제국의 광범위한 통치를 제시하는 데 있으므로, 본문이 주는 규모감을 약화시키지 않았습니다.
  doctrine_reference: 성경 서사문 해석 원리
- issue: 고유명사 처리
  chosen_reading: 아하수에로를 음역 형태로 유지했습니다.
  alternative_readings:
  - 크세르크세스
  rationale: 영어 POB의 주석처럼 역사적 동일시가 가능하더라도, 본문 표면형을 직접 반영하는 음역을 기본으로 삼았습니다.
  doctrine_reference: 번역의 투명성 원칙
