id: EST.1.8
reference: Esther 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/שְּׁתִיָּ֥ה כַ/דָּ֖ת אֵ֣ין אֹנֵ֑ס כִּי כֵ֣ן יִסַּ֣ד הַ/מֶּ֗לֶךְ עַ֚ל כָּל רַ֣ב בֵּית֔/וֹ לַ/עֲשׂ֖וֹת כִּ/רְצ֥וֹן אִישׁ וָ/אִֽישׁ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
  footnotes:
  - marker: a
    text: Or 'according to the regulation'; the Hebrew term can denote a law, decree, or formal rule.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'there was no compulsion,' meaning no one was forced to drink.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'each man and man,' a distributive expression meaning each individual.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 음주는 규정대로 이루어졌습니다[a]. 강요가 없었습니다[b]. 이는 왕이 왕궁의 모든 고위 관리에게 각 사람이 원하는 대로 하도록 지시했기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘법에 따라’. 히브리어는 법, 칙령, 또는 공식 규칙을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘강요가 없었다’로, 아무도 억지로 마시게 하지 않았다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘사람과 사람’이라는 분배적 표현을 써서, 각 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  english_pob_choice: And the drinking
  chosen_korean: 그리고 마시는 일은
  alternatives_korean:
  - 그리고 잔치의 마심은
  - 그리고 마시는 잔치는
  lexicon: HALOT
  rationale: הַשְּׁתִיָּה는 잔치 맥락의 ‘마심/음주’ 행위를 가리키므로, 의미를 과장하지 않으면서 한국어로 자연스럽게 옮겼습니다.
- source_word: כַדָּת
  english_pob_choice: according to the law
  chosen_korean: 법도에 따라
  alternatives_korean:
  - 율례에 따라
  - 규정에 따라
  - 법에 따라
  lexicon: HALOT
  rationale: 페르시아 시대 문맥의 דָּת는 법·칙령·규정의 의미를 가지므로, ‘법도’로 옮겨 행정적 규범성을 살렸습니다.
- source_word: אֵין אֹנֵס
  english_pob_choice: there was no compulsion
  chosen_korean: 강요가 없었으니
  alternatives_korean:
  - 강제로 마시게 하지 않았으니
  - 억지가 없었으니
  - 강제가 없었으니
  lexicon: HALOT
  rationale: 문구는 강제의 부재를 말하므로, 명사적 표현을 살리면서도 문장 흐름이 자연스럽게 되도록 옮겼습니다.
- source_word: כִּי כֵן יִסַּד הַמֶּלֶךְ
  english_pob_choice: for so the king had instructed
  chosen_korean: 왕이 ... 지시하였기 때문입니다
  alternatives_korean:
  - 왕이 ... 명령하였기 때문입니다
  - 왕이 ... 그렇게 정하였기 때문입니다
  lexicon: HALOT
  rationale: יִסַּד는 본래 ‘세우다/정하다’의 뜻이지만, 여기서는 궁정의 절차를 ‘지시하다’로 옮기는 것이 문맥상 가장 정확합니다.
- source_word: עַל כָּל רַב בֵּיתוֹ
  english_pob_choice: every official of his household
  chosen_korean: 궁정의 모든 높은 관리들
  alternatives_korean:
  - 궁정의 모든 집안 책임자들
  - 왕궁의 모든 총관들
  lexicon: HALOT
  rationale: רַב בֵּיתוֹ는 궁정/왕실 조직에서 책임 있는 고위 관리들을 가리키므로, 직역을 지나치게 어색하게 하지 않으면서 계층적 뉘앙스를 반영했습니다.
- source_word: כִּרְצוֹן אִישׁ וָאִישׁ
  english_pob_choice: according to the desire of each man
  chosen_korean: 각 사람의 뜻대로
  alternatives_korean:
  - 각 사람의 소원대로
  - 한 사람 한 사람의 뜻대로
  lexicon: HALOT
  rationale: כִּרְצוֹן은 ‘원하는 바/뜻’이므로 ‘뜻’이 가장 자연스럽고, 분배적 표현은 문맥상 ‘각 사람’으로 전달했습니다.
theological_decisions:
- issue: 강요의 부재와 왕명 사이의 긴장
  chosen_reading: 연회는 ‘법도’에 따라 진행되었고, 동시에 왕의 지시에 의해 누구에게도 강요가 없었습니다.
  alternative_readings:
  - 술자리가 자유분방했다는 뜻으로만 읽기
  - 왕명이 곧 강제가 있었다고 이해하기
  rationale: 본문은 무질서한 자율이 아니라, 왕의 지시로 강요를 제거한 정해진 절차를 말하므로 두 요소를 함께 살려야 합니다.
  doctrine_reference: 본문 주해상 절차와 권력의 작동 방식에 대한 서술
