  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: ko
  text: 잔치는 금그릇으로 술을 내었고, 그릇들은 그릇마다 서로 달랐으며, 왕의 후한 손길에 따라 왕실의 포도주가 풍성하게 마련되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת / Drinks were served
  english_pob_choice: Drinks were served
  chosen_korean: 술을 내었고
  alternatives_korean:
  - 마실 것을 내었고
  - 음료를 내었고
  - 술이 제공되었고
  lexicon: השקה
  rationale: 연회 맥락에서 단순한 음료보다 포도주를 포함한 술자리를 자연스럽게 드러내면서도, 원문의 ‘제공되다’ 의미를 살렸습니다.
- source_word: בִּכְלֵי זָהָב / vessels of gold
  english_pob_choice: vessels of gold
  chosen_korean: 금그릇으로
  alternatives_korean:
  - 금으로 된 그릇으로
  - 금잔으로
  - 금 그릇으로
  lexicon: כלי
  rationale: כֵּלִים을 한국어에서 가장 자연스러운 연회 용기 표현인 ‘그릇’으로 옮기되, 재질은 ‘금그릇’으로 간결하게 살렸습니다.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים / vessels differing from vessel to vessel
  english_pob_choice: with vessels differing from vessel to vessel
  chosen_korean: 그릇들은 그릇마다 서로 달랐으며
  alternatives_korean:
  - 그릇들은 서로 제각각이었으며
  - 그릇은 그릇마다 달랐으며
  - 그릇들이 서로 달랐으며
  lexicon: שׁונה
  rationale: 반복 구조를 살려 ‘그릇마다’와 ‘서로 달랐으며’로 원문의 분배적 뉘앙스를 표현했습니다.
- source_word: יֵין מַלְכֻת רָב כְּיַד הַמֶּלֶךְ / royal wine in abundance, according to the king’s bounty
  english_pob_choice: royal wine in abundance, according to the king’s bounty
  chosen_korean: 왕의 후한 손길에 따라 왕실의 포도주가 풍성하게 마련되었습니다
  alternatives_korean:
  - 왕의 후한 대로 왕실의 포도주가 넉넉히 마련되었습니다
  - 왕의 뜻대로 왕실의 포도주가 풍성했습니다
  - 왕의 후한 베풂에 따라 왕실의 포도주가 풍성하게 있었습니다
  lexicon: כְּיַד
  rationale: כְּיַד הַמֶּלֶךְ의 직역적 ‘왕의 손에 따라’는 한국어에서 어색하므로, EN POB의 ‘bounty’를 반영해 ‘후한 손길’로 옮겨 왕의 관대한 분배를 드러냈습니다.
theological_decisions:
- issue: 왕의 관대함을 나타내는 כְיַד הַמֶּלֶךְ의 처리
  chosen_reading: ‘왕의 후한 손길에 따라’로 번역하여, 단순한 양의 많음뿐 아니라 왕의 재량과 후의를 함께 드러냈습니다.
  alternative_readings:
  - ‘왕의 뜻대로’
  - ‘왕의 관대함에 따라’
  - ‘왕이 허락한 대로’
  rationale: 본문은 포도주의 양과 공급 방식 모두를 암시하므로, 수량과 통치자의 후의가 함께 보이도록 처리하는 것이 가장 원문 충실적입니다.
  doctrine_reference: 왕권과 분배의 관대함에 대한 서술적 표현
