id: EST.1.14
reference: Esther 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
  footnotes:
  - marker: a
    text: Literally, 'who saw the king’s face,' a Persian court expression for those with direct access to the king’s presence.
    reason: cultural_note
  - marker: b
    text: Or 'and occupied the highest positions in the kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 가장 가까이 있는 자들은 카르스나, 세델, 아드맛다, 다르시스, 메레스, 마르스나, 그리고 메무간이었는데, 곧 바사와 메디아의 일곱 관리로서 왕의 얼굴을 뵙고 왕국에서 첫자리에 앉아 있던 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 얼굴을 보는 자들’이라는 뜻으로, 왕에게 직접 접근할 수 있는 궁정 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 곧 ‘왕국에서 가장 높은 지위를 차지한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  english_pob_choice: And those closest to him were
  chosen_korean: 그리고 그에게 가장 가까이 있는 자들은
  alternatives_korean:
  - 그리고 그에게 가까운 자들은
  - 그리고 그에게 가장 가까이 있던 자는
  lexicon: HALOT
  rationale: 히브리어는 단수형처럼 보이지만 뒤이어 일곱 명의 인명을 열거하므로 집합적으로 이해해야 합니다. ‘가장 가까이 있는 자들’로 옮겨 문맥의 집합성을 살렸습니다.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  english_pob_choice: Carshena, Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan
  chosen_korean: 카르스나, 세델, 아드맛다, 다르시스, 메레스, 마르스나, 그리고 메무간
  alternatives_korean:
  - 카르쉬나, 세타르, 아드마타, 다시스, 메레스, 마르세나, 그리고 메무칸
  - 카르스나, 셰타르, 아드마타, 타르시스, 메레스, 마르세나, 그리고 메무칸
  lexicon: 고유명사 음역
  rationale: 고유명사는 번역하지 않고 음역했습니다. 한국어 성서 관용과 현대 외래어 표기 감각을 함께 고려해 일관된 표기를 택했습니다.
- source_word: שִׁבְעַת שָׂרֵי
  english_pob_choice: the seven officials
  chosen_korean: 일곱 관리
  alternatives_korean:
  - 일곱 신하
  - 일곱 대신
  lexicon: HALOT
  rationale: שָׂרִים은 궁정의 고위 직책을 가리키며, 현대 한국어에서 ‘관리’가 신분적 뉘앙스를 과도하게 띠지 않으면서 관직성을 분명하게 드러냅니다.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  english_pob_choice: who saw the king’s face
  chosen_korean: 왕의 얼굴을 뵙고
  alternatives_korean:
  - 왕의 얼굴을 보고
  - 왕 앞에 나아갈 수 있었고
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 얼굴을 보는 자들’이라는 궁정 관용구로, 왕에게 직접 접근할 수 있는 특권을 뜻합니다. 본문에는 이미지를 살려 두고, 그 의미는 주석 없이도 자연스럽게 드러나도록 했습니다.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  english_pob_choice: and sat first in the kingdom
  chosen_korean: 왕국에서 첫자리에 앉아 있던 자들
  alternatives_korean:
  - 왕국에서 가장 높은 자리에 앉아 있던 자들
  - 왕국에서 으뜸 자리에 있던 자들
  lexicon: HALOT
  rationale: ‘앉다’와 ‘첫째’의 결합은 서열/좌석의 은유를 보존합니다. 이를 ‘첫자리’로 옮겨 원문의 형식을 유지했습니다.
theological_decisions:
- issue: 궁정 관용구 רֹאֵי פְּנֵי הַמֶּלֶךְ의 처리
  chosen_reading: ‘왕의 얼굴을 뵙고’로 직역적 이미지를 유지하되, 왕에게 직접 접근하는 특권이라는 뜻이 한국어 문맥에서 자연히 읽히도록 했습니다.
  alternative_readings:
  - ‘왕의 면전에 들어갈 수 있는’
  - ‘왕의 신임을 얻은’
  rationale: 이 표현은 단순 시각이 아니라 왕실 접견 특권을 뜻하는 관용구이므로, 의미만 평탄화하지 않고 원문의 궁정적 긴장을 살렸습니다.
  doctrine_reference: 궁정 관용어의 역사-문법적 의미 보존
- issue: ‘첫자리에 앉아 있던’의 서열 표현
  chosen_reading: 좌석/서열 은유를 유지하는 번역을 택했습니다.
  alternative_readings:
  - ‘가장 높은 지위에 있던’
  - ‘최고의 자리를 차지한’
  rationale: 원문은 직책의 높이를 좌석 이미지로 표현하므로, 이를 행정적 의미로만 풀어 쓰면 문체와 뉘앙스가 약해집니다.
  doctrine_reference: 히브리어 서술체의 은유 보존
