- from: 그리고 그에게 가장 가까이 있는 자들은 카르스나, 세델, 아드맛다, 다르시스, 메레스, 마르스나, 그리고 메무간이었는데, 곧 바사와 메디아의 일곱 관리로서 왕의 얼굴을 뵙고 왕국에서 첫자리에 앉아 있던 자들입니다.[a][b]
  to: 그에게 가장 가까운 이들은 바사와 메대의 일곱 고관, 곧 갈스나, 세달, 아드마사, 다시스, 메레스, 마르스나, 그리고 므무간이었습니다. 이들은 왕의 얼굴을 뵙고 왕국에서 으뜸 자리에 앉아 있던 사람들이었습니다.[a][b]
  rationale: 인명을 통용 한국어 성서 표기에 맞추어 정비하고, 고위 궁정 관료를 뜻하는 שָׂרֵי를 ‘고관’으로 옮겼습니다. 문장은 과거 합쇼체로 통일했습니다. ‘왕의 얼굴을 뵙고’ 및 ‘으뜸 자리에 앉아 있던’은 원문의 궁정 관용구와 좌석·서열 이미지를 보존하며, 그 의미 범위는 각주에서 설명했습니다.
