  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
  footnotes:
  - marker: a
    text: Or, 'The proposal seemed good to the king and the officials.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to the word of Memucan'; that is, in keeping with Memucan's counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일은 왕과 대신들이 좋게 여겼으며, 왕은 므무간의 말대로 행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 일’은 히브리어 הַדָּבָר의 넓은 의미를 반영한 것으로, 문맥상 앞서 나온 건의를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘므무간의 말대로’이며, 곧 므무간의 조언을 따른다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  english_pob_choice: The matter pleased
  chosen_korean: 그 일이 ... 좋게 보였으며
  alternatives_korean:
  - 그 일이 ... 기쁘게 했으며
  - 그 제안이 ... 좋았으며
  lexicon: HALOT
  rationale: ‘좋다’ 계열의 평가 표현과 ‘~의 눈에’라는 관용구를 한국어로 자연스럽게 옮기되, 원문의 판단 의미를 유지했습니다.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  english_pob_choice: the king and the officials
  chosen_korean: 왕과 대신들
  alternatives_korean:
  - 왕과 관리들
  - 왕과 귀족들
  lexicon: HALOT
  rationale: שָׂרִים은 페르시아 궁정 맥락의 고위 인사를 가리키므로, 현대 한국어에서 자연스럽고 위계를 드러내는 ‘대신들’로 옮겼습니다.
- source_word: כִּדְבַר מְמוּכָן
  english_pob_choice: according to the word of Memucan
  chosen_korean: 므무간의 말대로
  alternatives_korean:
  - 므무간의 말에 따라
  - 므무간의 조언대로
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’ 이상의 조언/발언을 뜻하지만, 한국어에서는 ‘말대로’가 가장 간결하게 원문의 종속 관계를 드러냅니다.
theological_decisions:
- issue: 서술의 직접성
  chosen_reading: 왕이 므무간의 말대로 실제로 행동했다는 점을 분명히 드러내는 직서적 서술로 옮겼습니다.
  alternative_readings:
  - 왕이 그렇게 결정했다
  - 왕이 그 제안을 따랐다
  rationale: 본문은 단순한 동의가 아니라 왕의 실행을 말하므로, ‘행하였습니다’로 결과를 분명히 표현했습니다.
  doctrine_reference: 본문 서술 충실성
