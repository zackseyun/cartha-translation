- source_word: הַפַּרְתְּמִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 고관들
  - 귀인들
  lexicon: HALOT
  rationale: 페르시아계 차용어는 높은 신분의 귀족층을 뜻하므로, 한국어에서는 간결하고 이해하기 쉬운 ‘귀족들’이 적절합니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 자기 앞에 있는
  alternatives_korean:
  - 그의 앞에서
  - 그의 면전에 있는
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 앞에’이지만, 왕의 궁정에 출석한 사람들을 뜻하므로 한국어에서는 자연스럽게 ‘자기 앞에 있는’으로 옮겼습니다.
