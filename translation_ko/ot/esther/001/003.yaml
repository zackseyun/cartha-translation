  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
  footnotes:
  - marker: a
    text: Or 'a feast'; the Hebrew term can denote a banquet characterized by drinking and celebration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the army of Persia and Media.'
    reason: lexical_alternative
  - marker: c
    text: That is, in his presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 재위 삼 년째에[a] 그는 모든 대신과 신하들, 곧 페르시아와 메디아의 군대[b], 귀족들, 그리고 그 앞에 있던 지방의 관리들[c]을 위하여 잔치를 베풀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 통치 제삼년에’. 히브리어 표현은 그의 재위 기간 중의 시간 표지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘페르시아와 메디아의 군사력’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 앞에’. 왕의 임석 아래 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  english_pob_choice: In the third year of his reign
  chosen_korean: 그의 통치 제삼년에
  alternatives_korean:
