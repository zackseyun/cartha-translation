id: EST.1.3
reference: Esther 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שָׁלוֹשׁ֙ לְ/מָלְכ֔/וֹ עָשָׂ֣ה מִשְׁתֶּ֔ה לְ/כָל שָׂרָ֖י/ו וַ/עֲבָדָ֑י/ו חֵ֣יל פָּרַ֣ס וּ/מָדַ֗י הַֽ/פַּרְתְּמִ֛ים וְ/שָׂרֵ֥י הַ/מְּדִינ֖וֹת לְ/פָנָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
  footnotes:
  - marker: a
    text: Or 'a feast'; the Hebrew term can denote a banquet characterized by drinking and celebration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the army of Persia and Media.'
    reason: lexical_alternative
  - marker: c
    text: That is, in his presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 통치 제삼년에[a] 그는 자신의 모든 고관과 신하들, 곧 페르시아와 메디아의 군대[b], 귀족들[c], 그리고 자기 앞에 있는 지방의 관리들을 위하여 잔치를 베풀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제삼년에’; 히브리어 표현은 재위 기간의 시간 표지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘페르시아와 메디아의 군대’.
    reason: lexical_alternative
  - marker: c
    text: 곧 왕 앞에 있는 이들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  english_pob_choice: In the third year of his reign
  chosen_korean: 그의 통치 제삼년에
  alternatives_korean:
  - 그의 즉위 제삼년에
  - 그의 치세 제삼년에
  lexicon: WLC; HALOT
  rationale: 연대 표지는 현대 한국어에서 자연스러운 시간 부사구로 옮기되, ‘통치’로 reign의 기간성을 분명히 살렸습니다.
- source_word: עָשָׂה מִשְׁתֶּה
  english_pob_choice: he gave a banquet
  chosen_korean: 잔치를 베풀었습니다
  alternatives_korean:
  - 연회를 열었습니다
  - 잔치를 했습니다
  lexicon: WLC; HALOT
  rationale: מִשְׁתֶּה는 단순한 식사가 아니라 축제성 있는 잔치/연회를 가리키므로, 현대 문체에서는 ‘잔치를 베풀었습니다’가 가장 자연스럽고 원뜻에 가깝습니다.
- source_word: חֵיל פָּרַס וּמָדַי
  english_pob_choice: the army of Persia and Media
  chosen_korean: 페르시아와 메디아의 군대
  alternatives_korean:
  - 페르시아와 메디아의 군사력
  - 페르시아와 메디아의 군사
  lexicon: HALOT
  rationale: חֵיל은 문맥상 군사 집단을 가리키며, 영어 POB의 최종 선택에 맞추어 ‘군대’로 직역 성격을 유지했습니다.
- source_word: הַפַּרְתְּמִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 고관들
  - 귀인들
  lexicon: HALOT
  rationale: 페르시아계 차용어는 높은 신분의 귀족층을 뜻하므로, 한국어에서는 간결하고 이해하기 쉬운 ‘귀족들’이 적절합니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 자기 앞에 있는
  alternatives_korean:
  - 그의 앞에서
  - 그의 면전에 있는
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 앞에’이지만, 왕의 궁정에 출석한 사람들을 뜻하므로 한국어에서는 자연스럽게 ‘자기 앞에 있는’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 권위와 궁정 맥락의 표현
  chosen_reading: ‘통치 제삼년’과 ‘자기 앞에 있는’으로 왕의 재위와 궁정적 위계를 드러냈습니다.
  alternative_readings:
  - ‘즉위 제삼년’
  - ‘그 앞에’
  rationale: 본문은 단순한 연대 기록이 아니라 왕의 재위 아래 벌어진 공식 연회를 보여 주므로, 위계와 참석 맥락이 드러나게 번역했습니다.
  doctrine_reference: 서술문 본문; 역사 내러티브의 왕권 묘사
