  - 그의 치세 제삼년에
  lexicon: WLC; HALOT
  rationale: 연대 표지는 현대 한국어에서 자연스러운 시간 부사구로 옮기되, ‘통치’로 reign의 기간성을 분명히 살렸습니다.
- source_word: עָשָׂה מִשְׁתֶּה
  english_pob_choice: he gave a banquet
  chosen_korean: 잔치를 베풀었습니다
