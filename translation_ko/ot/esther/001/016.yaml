- from: 그러자 메무간이 왕과 대신들 앞에서 말했습니다. "왕후 와스디는 왕만이 아니라, 모든 대신과 아하수에로 왕의 모든 지방에 있는 모든 백성에게도 잘못을 저질렀습니다."[a]
  to: 그러자 메무간이 왕과 대신들 앞에서 말했습니다. “와스디 왕후는 왕에게만 잘못을 저지른 것이 아니라, 모든 대신과 아하수에로 왕의 모든 지방에 있는 모든 백성에게도 잘못을 저질렀습니다.”[a]
  rationale: 본문의 법정·궁정 발화라는 성격을 과도하게 해석하지 않고 עָוְתָה를 ‘잘못을 저지르다’로 유지했습니다. 동시에 ‘왕에게만 … 아니라 …에게도’라는 히브리어의 대조와 반복된 대상 범위를 명료하게 반영했습니다. 각주는 영어 감사 기록에 있는 어순 대안에 맞추어 정리했습니다.
