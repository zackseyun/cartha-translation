base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
  footnotes:
  - marker: a
    text: Or, 'Vashti the queen has not done wrong against the king alone, but also against all the officials and all the peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 메무간이 왕과 대신들 앞에서 말했습니다. “와스디 왕후는 왕에게만 잘못을 저지른 것이 아니라, 모든 대신과 아하수에로 왕의 모든 지방에 있는 모든 백성에게도 잘못을 저질렀습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “와스디 왕후는 왕에게만 잘못을 저지른 것이 아니라, 모든 대신과 아하수에로 왕의 모든 지방에 있는 모든 백성에게도 잘못을 저질렀습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 담화 흐름에 맞게 자연스럽게 드러내면서도, 단순한 시간 접속보다 서사적 전환을 살렸습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: '... 앞에서'
  alternatives_korean:
  - '... 면전에서'
  - '... 앞에'
  lexicon: HALOT
  rationale: 왕과 대신들 ‘앞에서’라는 공개적 발화 상황을 간결하고 현대적인 표현으로 옮겼습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 대신들
  alternatives_korean:
  - 관원들
  - 고관들
  - 관리들
  lexicon: HALOT
  rationale: 페르시아 궁정 문맥의 고위 신하들을 가리키므로, 단순 관리보다 궁정적 위계를 드러내는 ‘대신들’이 적절합니다.
- source_word: עָוְתָה
  english_pob_choice: has done wrong
  chosen_korean: 잘못을 저질렀습니다
  alternatives_korean:
  - 잘못했습니다
  - 그릇된 일을 했습니다
  - 죄를 범했습니다
  lexicon: HALOT
  rationale: 도덕적 위반의 의미를 유지하되, ‘죄’를 덧씌우지 않고 ‘잘못을 저지르다’로 자연스럽게 옮겼습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 백성
  alternatives_korean:
  - 민족들
  - 사람들
  - 백성들
  lexicon: HALOT
  rationale: 히브리어 복수 ‘peoples’를 한국어에서 과도하게 민족주의적으로 읽히지 않게 하면서도, 제국 내 여러 집단을 포괄하는 표현으로 옮겼습니다.
- source_word: מְדִינוֹת
  english_pob_choice: provinces
  chosen_korean: 지방
  alternatives_korean:
  - 지방들
  - 주
  - 관할구역
  lexicon: HALOT
  rationale: 에스더서의 페르시아 행정구역을 가리키는 말로, 현대 한국어 독자가 이해하기 쉬운 ‘지방’을 택했습니다.
theological_decisions:
- issue: 와스디의 행동을 윤리적 평가로 제시하는 방식
  chosen_reading: ‘잘못을 저질렀습니다’로 옮겨, 법적 판결보다 행위의 도덕적 평가가 전면에 나오게 했습니다.
  alternative_readings:
  - ‘모욕했습니다’
  - ‘반역했습니다’
  rationale: 본문의 עָוְתָה는 기본적으로 ‘그릇되게 행하다/잘못하다’의 의미이므로, 문맥상 확장된 정치적 해석을 최소화했습니다.
  doctrine_reference: 본문 주해 원칙
- issue: 제국의 포괄성을 드러내는 번역
  chosen_reading: ‘아하수에로 왕의 모든 지방에 있는 모든 백성’으로 옮겨, 반복 구조가 강조하는 광범위한 영향 범위를 보존했습니다.
  alternative_readings:
  - ‘모든 지방에 사는 모든 민족’
  - ‘온 나라의 모든 사람들’
  rationale: 히브리어의 병렬과 반복을 살려 왕권 아래의 전체 제국을 드러내는 것이 본문의 수사 효과에 부합합니다.
  doctrine_reference: 본문 주해 원칙
