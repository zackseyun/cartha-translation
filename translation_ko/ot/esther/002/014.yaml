id: EST.2.14
reference: Esther 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'the second harem.' The Hebrew reads literally 'the second house of the women.'
    reason: lexical_alternative
  - marker: b
    text: '''Go in to the king'' is a Hebrew idiom for entering the king’s chamber/presence; the context implies sexual access without stating it explicitly.'
    reason: cultural_note
translation:
  language: ko
  text: 저녁이 되면 그녀는 들어갔고, 아침이 되면 다시 여인들의 둘째 집으로 돌아갔습니다. 그곳은 왕의 내시이자 후궁들을 맡은 샤아스가즈의 손 아래였습니다. 그녀는 왕이 그녀를 기뻐하고 이름으로 불리지 않는 한 다시는 왕에게 들어가지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보다 해석적으로, '여인들의 둘째 후궁집'이라고 옮길 수 있습니다. 히브리어는 문자적으로 '여인들의 둘째 집'입니다.
    reason: lexical_alternative
  - marker: b
    text: '''왕에게 들어가다''는 왕의 방/임재로 들어가는 히브리어 관용구입니다. 문맥상 성적 접근을 암시하지만 직접 말하지는 않습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֶרֶב
  english_pob_choice: In the evening
  chosen_korean: 저녁이 되면
  alternatives_korean:
  - 저녁에
  - 해질 무렵에
  lexicon: HALOT
  rationale: 시간 부사구로서 자연스러운 현대 한국어로 옮기되, 반복적 관습 동작을 드러내는 흐름을 살렸습니다.
- source_word: בָאָה / לֹא תָבֹוא עוֹד אֶל הַמֶּלֶךְ
  english_pob_choice: she would go in / She would not go in again to the king
  chosen_korean: 들어갔고 / 다시는 왕에게 들어가지 못했습니다
  alternatives_korean:
  - 왕에게 가고 / 다시는 왕에게 가지 못했습니다
  - 왕 앞에 들어가고 / 다시는 왕 앞에 들어가지 못했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 '들어가다'로 옮겨 왕의 침실/접근을 직접적이되 과장 없이 반영했습니다.
- source_word: בֵית הַנָּשִׁים שֵׁנִי
  english_pob_choice: the second house of the women
  chosen_korean: 여인들의 둘째 집
  alternatives_korean:
  - 여인들의 두 번째 집
  - 여인들의 둘째 궁
  lexicon: HALOT
  rationale: 직역 구조를 유지해 '두 번째 여자들의 집'이라는 본문 형식을 살렸고, POB의 해석적 'harem'은 본문에 넣지 않았습니다.
- source_word: אֶל יַד שַׁעֲשְׁגַז סְרִיס הַמֶּלֶךְ שֹׁמֵר הַפִּילַגְשִׁים
  english_pob_choice: into the care of Shaashgaz, the king’s eunuch, keeper of the concubines
  chosen_korean: 왕의 내시이자 후궁들을 맡은 샤아스가즈의 손 아래
  alternatives_korean:
  - 왕의 내시이며 후궁들을 지키는 샤아스가즈의 관리 아래
  - 왕의 내시 샤아스가즈가 맡은 후궁들의 관리 아래
  lexicon: HALOT
  rationale: '''손 아래''는 אֶל יַד의 관할·맡김의 관용을 살린 표현이고, סְרִיס은 이 궁정 문맥에서 ''내시''가 가장 구체적입니다.'
- source_word: חָפֵץ בָּהּ
  english_pob_choice: the king delighted in her
  chosen_korean: 왕이 그녀를 기뻐하고
  alternatives_korean:
  - 왕이 그녀를 마음에 들어 하고
  - 왕이 그녀를 원하고
  lexicon: HALOT
  rationale: '''기뻐하다''는 חפץ의 호의/기호의 뜻을 살리면서, 단순한 성적 욕망으로만 좁히지 않도록 했습니다.'
- source_word: וְנִקְרְאָה בְשֵׁם
  english_pob_choice: and she was summoned by name
  chosen_korean: 이름으로 불리지 않는 한
  alternatives_korean:
  - 이름으로 불려야만
  - 이름으로 소환되지 않는 한
  lexicon: HALOT
  rationale: 직역상 수동 '불리다'를 유지하되, 궁정 맥락의 공식적 지명을 한국어 관용으로 풀었습니다.
theological_decisions:
- issue: 왕에게 '들어가다'는 표현의 함의
  chosen_reading: 본문의 관용구를 따라 왕의 침실/접근을 직접 말하지 않고 '들어가다'로 번역했습니다.
  alternative_readings:
  - 왕과 잠자리에 들다
  - 왕 앞에 나아가다
  rationale: 히브리어가 명시적으로 말하는 것은 '들어감'이지 성적 행위의 직접 기술은 아니므로, POB의 주석적 절제를 유지했습니다.
  doctrine_reference: 본문 문맥 존중과 과잉 명시 방지
- issue: '''기뻐하다''의 의미 범위'
  chosen_reading: '''왕이 그녀를 기뻐하고''로 옮겨 호의/선호의 의미를 열어 두었습니다.'
  alternative_readings:
  - 왕이 그녀를 욕망하고
  - 왕이 그녀를 사랑하고
  rationale: חָפֵץ는 단순한 성적 욕망보다 넓은 '마음에 들어 하다/기뻐하다'의 의미를 가질 수 있어, 본문이 허용하는 범위를 유지했습니다.
  doctrine_reference: 어휘 의미의 범위 보존
