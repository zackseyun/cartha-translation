revisions:
- from: 저녁이 되면 그녀는 들어갔고, 아침이 되면 다시 여인들의 둘째 집으로 돌아갔습니다. 그곳은 왕의 내시이자 후궁들을 맡은 샤아스가즈의 손 아래였습니다. 그녀는 왕이 그녀를 기뻐하고 이름으로 불리지 않는 한 다시는 왕에게 들어가지 못했습니다.[a][b]
  to: 저녁에는 그녀가 들어가고, 아침에는 여인들의 두 번째 집으로 돌아가 왕의 내시이며 후궁들을 관리하는 샤아스가즈에게 맡겨졌습니다. 왕이 그녀를 기뻐하고 그녀의 이름을 불러 부를 때가 아니면, 그녀는 다시 왕에게 들어가지 않았습니다.[a][b]
  rationale: 예외 조건의 긍정 수동형 ‘이름으로 불리다’를 정확히 복원하고, 여성이 샤아스가즈의 관리 아래로 돌아간다는 אֶל יַד의 행정적 의미를 문장 구조에 반영했습니다. ‘두 번째 집’과 ‘왕에게 들어가다’의 완곡성과 비해석적 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:04Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 마지막 조건절 ‘이름으로 불리지 않는 한’은 히브리어 וְנִקְרְאָה בְשֵׁם(‘그녀가 이름으로 불릴 때’)의 의미를 부정하여, 왕에게 다시 들어갈 수 있는 예외 조건을 반대로 만들었습니다. 또한 אֶל יַד의 관할·위탁 관계는 문장 안에서 샤아스가즈에게 맡겨졌다는 뜻으로 직접 연결하는 편이 정확합니다.
  naturalness: ‘여인들의 두 번째 집’, ‘샤아스가즈에게 맡겨졌습니다’, ‘이름을 불러 부를 때가 아니면’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 반복적 서술 흐름도 유지합니다. ‘그곳은 … 손 아래였습니다’는 장소와 관리 관계의 연결이 다소 어색하여 고쳤습니다.
  terminology: בֵּית הַנָּשִׁים שֵׁנִי는 해석적인 ‘후궁집’ 대신 ‘여인들의 두 번째 집’으로 유지했습니다. סְרִיס는 문맥상 ‘내시’, שֹׁמֵר הַפִּילַגְשִׁים는 ‘후궁들을 관리하는’으로 옮겼습니다. ‘왕에게 들어가다’는 원문의 완곡한 관용을 보존합니다.
  issues:
  - severity: high
    issue: 마지막 예외 조건의 부정이 원문의 의미를 역전시킴
    rationale: ‘왕이 그녀를 기뻐하고 이름으로 불리지 않는 한’은 ‘불리지 않을 경우’를 조건으로 삼습니다. 원문은 왕이 그녀를 원하고 그녀가 이름으로 불릴 경우에만 다시 왕에게 들어간다고 합니다.
  - severity: medium
    issue: 아래절의 위탁 관계가 독립된 장소 서술처럼 처리됨
    rationale: ‘그곳은 … 손 아래였습니다’는 ‘집’이 관리 아래 있다는 듯이 읽힐 수 있습니다. אֶל יַד는 여성이 샤아스가즈의 관할 아래로 돌아갔음을 뜻합니다.
  - severity: low
    issue: 각주 a의 ‘여인들의 둘째 후궁집’은 본문보다 더 해석적이며 한국어 표현도 부자연스러움
    rationale: ‘후궁집’은 히브리어 본문에 없는 해석을 더하고, 대안 표기는 ‘두 번째 하렘’ 또는 ‘두 번째 여인들의 거처’처럼 명료하게 제시하는 편이 낫습니다.
  revised_text: 저녁에는 그녀가 들어가고, 아침에는 여인들의 두 번째 집으로 돌아가 왕의 내시이며 후궁들을 관리하는 샤아스가즈에게 맡겨졌습니다. 왕이 그녀를 기뻐하고 그녀의 이름을 불러 부를 때가 아니면, 그녀는 다시 왕에게 들어가지 않았습니다.[a][b]
  revised_footnotes:
