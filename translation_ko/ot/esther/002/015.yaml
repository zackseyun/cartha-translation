  - 자기 딸로 받아들인
  lexicon: HALOT
  rationale: 히브리어 관용구는 법적 입양 절차보다 친족 보호와 양육을 뜻하므로, ‘자기 딸로 맞이한’이 본문의 관계를 과장하지 않고 드러냅니다.
- source_word: סְרִיס
  english_pob_choice: eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁정 관리
  lexicon: HALOT
  rationale: 후궁 관련 문맥에서의 기본 어휘값을 살려 ‘내시’로 옮겼습니다. 성경 한국어에서 가장 직접적으로 대응하는 표현입니다.
- source_word: נֹשֵׂאת חֵן בְּעֵינֵי
  english_pob_choice: was gaining favor in the eyes of
  chosen_korean: 눈에 호감을 얻고 있었습니다
  alternatives_korean:
  - 은총을 얻고 있었습니다
  - 호의를 얻고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에…’를 살리되, 서사 문맥에서 자연스러운 한국어로 풀어 ‘호감을 얻다’로 옮겼습니다.
theological_decisions:
- issue: 왕 앞에 들어가는 궁정 장면의 완곡한 서술
  chosen_reading: ‘왕에게 들어갈 때’로 옮겨, 본문의 궁정 예절과 은근한 맥락을 그대로 유지했습니다.
  alternative_readings:
  - ‘왕 앞에 나아갈 때’
  - ‘왕에게 들어가기 위해’
  rationale: 히브리어 לָבוֹא אֶל־הַמֶּלֶךְ의 관용성을 보존하면서도, 성적·정치적 맥락을 불필요하게 노골화하지 않도록 했습니다.
  doctrine_reference: 서사 문맥 보존
