  naturalness: 수정문은 현대 표준 한국어 합쇼체의 서사 문장으로 자연스럽습니다. ‘왕에게 들어갈 차례가 되었을 때’는 원문의 완곡한 궁정 관용 표현을 유지하며, ‘그녀를 보는 모든 사람에게 호의를 얻고 있었습니다’는 히브리어 관용구를 자연스럽게 전달합니다.
