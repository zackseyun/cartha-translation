base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: Now when the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
  footnotes:
  - marker: a
    text: Or 'again.' The Hebrew says literally 'a second time.'
    reason: lexical_alternative
  - marker: b
    text: '''The king''s gate'' likely refers to the gate area of the royal palace, a place associated with official service and administration.'
    reason: cultural_note
translation:
  language: ko
  text: 처녀들이 두 번째로 모였을 때[a], 모르드개는 왕의 문에 앉아 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시’. 히브리어는 문자적으로 ‘두 번째로’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕의 문’은 왕궁의 공식 업무와 행정이 이루어지던 출입구 구역을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  english_pob_choice: Now when ... were gathered
  chosen_korean: '...이 모였을 때'
  alternatives_korean:
  - '...이 모일 때'
  - '...이 다시 모였을 때'
  lexicon: HALOT
  rationale: 히필/니팔 계열의 수동적 시간절을 한국어에서는 자연스러운 시간 부사절로 옮겼습니다. 영어의 'Now when'에 해당하는 담화 표지는 문맥상 생략해도 무리 없으므로, 본문 흐름을 살려 간결하게 처리했습니다.
- source_word: בְּתוּלוֹת
  english_pob_choice: the virgins
  chosen_korean: 처녀들
  alternatives_korean:
  - 젊은 여자들
  - 미혼 여성들
  lexicon: HALOT
  rationale: 히브리어 בְּתוּלוֹת의 핵심 의미인 미혼·순결 상태를 반영하기 위해 '처녀들'을 택했습니다. 여기서는 단순한 '젊은 여자들'보다 원문의 표지가 더 직접적입니다.
- source_word: יֹשֵׁב
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 머물고 있었습니다
  lexicon: HALOT
  rationale: 분사형의 지속 상태를 살려 단순 과거 '앉았습니다'보다 진행·상태감을 가진 '앉아 있었습니다'로 옮겼습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: at the king's gate
  chosen_korean: 왕의 대문에
  alternatives_korean:
  - 왕의 문에서
  - 왕궁 대문에
  lexicon: HALOT
  rationale: 히브리어 '문/성문'에 해당하는 שַׁעַר는 왕궁의 공식 업무가 이루어지는 출입구 구역을 가리킬 수 있으므로, 본문은 이를 지나치게 해설하지 않고 '왕의 대문에'로 옮겼습니다.
