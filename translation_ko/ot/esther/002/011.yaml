  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: ko
  text: 그리고 매일같이 모르드개는 여자들의 집 뜰 앞을 거닐며, 에스더가 어떻게 지내는지와 그녀에게 무슨 일이 일어날지를 알아보았습니다.
  philosophy: formal
lexical_decisions:
- source_word: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם
  english_pob_choice: every single day
  chosen_korean: 매일같이
  alternatives_korean:
  - 날마다
  - 매일
  lexicon: בכל יום ויום
  rationale: 중복 강조를 살려 ‘every single day’의 반복적·강조적 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: מִתְהַלֵּ֔ךְ
  english_pob_choice: would walk back and forth
  chosen_korean: 거닐며
  alternatives_korean:
  - 왔다 갔다 하며
  - 서성이며
  lexicon: הלך hitpael
  rationale: 단순한 보행보다 목적 없이 오가며 맴도는 동작을 간결하게 담아, 감시와 염려가 섞인 장면을 살렸습니다.
- source_word: חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים
  english_pob_choice: the courtyard of the women’s house
  chosen_korean: 여자들의 집 뜰
  alternatives_korean:
  - 여인들의 집 뜰
  - 여자들의 궁정 뜰
  lexicon: חצר בית הנשים
  rationale: 직역하되 한국어에서 자연스러운 소유구조로 풀어, 장소 명칭의 이질감을 과도하게 평탄화하지 않았습니다.
- source_word: שְׁל֣וֹם
  english_pob_choice: how Esther was doing
  chosen_korean: 에스더가 어떻게 지내는지
  alternatives_korean:
  - 에스더의 안부
  - 에스더가 평안한지
  lexicon: שלום
  rationale: 평안/안부의 의미를 살리면서도, POB의 ‘how Esther was doing’에 맞춰 상태를 묻는 표현으로 옮겼습니다.
theological_decisions:
- issue: 에스더의 안부를 묻는 동사의 뉘앙스
  chosen_reading: ‘어떻게 지내는지’로 옮겨, 생존 여부를 포함한 실제 상태 확인의 긴박함을 드러냈습니다.
  alternative_readings:
  - ‘안부를 알아보며’
  - ‘평안한지 알아보며’
  rationale: 히브리어 שָׁלוֹם은 단순한 인사말보다 전체적 안녕 상태를 가리킬 수 있어, 서사적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 서사 문맥 보존
- issue: ‘무슨 일이 일어날지를’의 미래 수동 뉘앙스
  chosen_reading: ‘그녀에게 무슨 일이 일어날지를’로 옮겨, 아직 결정되지 않은 처분의 불안감을 유지했습니다.
  alternative_readings:
  - ‘그녀에게 무엇이 행해질지를’
  - ‘그녀에게 무슨 일이 있을지를’
  rationale: 원문의 יֵעָשֶׂה בָּהּ는 ‘그녀에게 행해질 것’을 뜻하므로, 한국어에서도 수동적 처분의 의미가 드러나야 합니다.
  doctrine_reference: 서사 문맥 보존
