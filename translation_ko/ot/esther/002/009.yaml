base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
  footnotes:
  - marker: a
    text: Or 'to the best quarters of the women’s house'; the phrase refers to a superior place within the royal women’s quarters, often understood as the harem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 여자는 그의 눈에 좋게 보였고, 그의 앞에서 은혜를 얻었습니다. 그는 그녀의 미용 처리와 몫을, 그리고 왕궁에서 그녀에게 주어질 만한 일곱 젊은 여자를 급히 마련해 주었으며, 그녀와 그녀의 젊은 여자들을 여자들의 집에서 가장 좋은 곳으로 옮겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여자들의 집’은 왕실 여성 구역을 가리키며, 문맥상 더 좋은 방이나 구역을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여자
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: נַעֲרָה는 나이 어린 여성을 가리키며, 문맥상 ‘소녀’보다 성인/청년기 뉘앙스를 살리는 ‘젊은 여자’가 더 자연스럽고 정확합니다.
- source_word: וַתִּיטַב ... בְעֵינָיו
  english_pob_choice: pleased him
  chosen_korean: 그의 눈에 좋게 보였고
  alternatives_korean:
  - 그의 눈에 좋았고
  - 그의 인정을 받았고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 좋다’를 한국어로 직접 드러내어, 단순한 호감 이상의 평가적 뉘앙스를 보존했습니다.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  english_pob_choice: found favor before him
  chosen_korean: 그의 앞에서 은혜를 얻었습니다
  alternatives_korean:
  - 그의 앞에서 호의를 얻었습니다
  - 그 앞에서 은총을 받았습니다
  lexicon: HALOT
  rationale: חֶסֶד를 여기서는 언약적 ‘인애’보다 궁정적 호의로 이해해야 하므로, 본문 흐름에 맞게 ‘은혜를 얻다’로 옮겼습니다.
- source_word: תַּמְרוּקֶיהָ / מָנוֹתֶיהָ
  english_pob_choice: her beauty treatments / her portions
  chosen_korean: 그녀의 미용 처리와 몫
  alternatives_korean:
  - 그녀의 미용 시술과 배급
  - 그녀의 몸단장과 식량 몫
  lexicon: HALOT
  rationale: 궁정 여성 준비 절차를 가리키는 전반적 표현으로, ‘미용 처리’는 תַּמְרוּקִים의 처리/손질 의미를, ‘몫’은 배정된 분량을 간결하게 살립니다.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  english_pob_choice: to the best place in the women’s house
  chosen_korean: 여자들의 집에서 가장 좋은 곳
  alternatives_korean:
  - 여자들의 집의 가장 좋은 구역
  - 여자들의 집의 가장 좋은 거처
  lexicon: HALOT
  rationale: 직역에 가까운 구문을 유지하되, 현대 한국어에서 이해되도록 ‘가장 좋은 곳’으로 풀었습니다. 여기서 ‘women’s house’는 여성 거처/구역을 가리킵니다.
theological_decisions:
- issue: 궁정 맥락에서 ‘חֶסֶד’의 의미 범위
  chosen_reading: 언약적 사랑이 아니라 왕실 내부에서 주어지는 호의와 호감으로 읽었습니다.
  alternative_readings:
  - 인애
  - 사랑
  rationale: 아하수에로 궁정의 행정적 서술에서 חֶסֶד는 관계적 충성과 언약 용어보다, 실질적 우대와 호의를 뜻하는 것이 본문 문맥에 더 적합합니다.
  doctrine_reference: 문맥 우선 해석; 구약 어휘의 다의성 유지
- issue: 마지막 구문의 장소 표현
  chosen_reading: ‘여자들의 집에서 가장 좋은 곳’으로 옮겨, 본문의 관료적·공간적 의미를 직접 드러냈습니다.
  alternative_readings:
  - 후궁의 가장 좋은 방들
  - 여성들의 집의 가장 좋은 구역
  rationale: POB의 영어 각주가 말하듯 이 표현은 왕실 여성 구역 내부의 상위 공간을 가리키며, 지나치게 후궁으로 확정하지 않고 원문 범위를 보존하는 것이 안전합니다.
  doctrine_reference: 번역학적 보수성; 서술어의 과잉해석 방지
