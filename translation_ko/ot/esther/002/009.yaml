revisions:
- from: 그 젊은 여자는 그의 눈에 좋게 보였고, 그의 앞에서 은혜를 얻었습니다. 그는 그녀의 미용 처리와 몫을, 그리고 왕궁에서 그녀에게 주어질 만한 일곱 젊은 여자를 급히 마련해 주었으며, 그녀와 그녀의 젊은 여자들을 여자들의 집에서 가장 좋은 곳으로 옮겼습니다.[a]
  to: 그 젊은 여인은 그의 눈에 들었고 그에게서 호의를 얻었습니다. 그는 그녀에게 미용 관리와 배정된 몫을 급히 마련해 주고, 왕궁에서 그녀에게 주도록 마련된 젊은 여자 일곱 명도 주었습니다. 또 그녀와 그녀에게 딸린 젊은 여자들을 여인들의 거처에서 가장 좋은 곳으로 옮겼습니다.[a]
  rationale: 원문의 궁정적 호의, 신속한 제공, 배정된 몫, 그리고 왕실 여성 구역 안의 더 좋은 장소로의 이동을 보존했습니다. 직역투이거나 의미가 불명확한 표현을 현대 표준 한국어의 자연스러운 합쇼체로 다듬었고, ‘후궁’이라는 해석적 표현은 본문에 확정하지 않고 각주에 가능한 이해로만 남겼습니다.
