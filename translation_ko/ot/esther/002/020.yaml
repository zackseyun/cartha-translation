id: EST.2.20
reference: Esther 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ין אֶסְתֵּ֗ר מַגֶּ֤דֶת מֽוֹלַדְתָּ/הּ֙ וְ/אֶת עַמָּ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה עָלֶ֖י/הָ מָרְדֳּכָ֑י וְ/אֶת מַאֲמַ֤ר מָרְדֳּכַי֙ אֶסְתֵּ֣ר עֹשָׂ֔ה כַּ/אֲשֶׁ֛ר הָיְתָ֥ה בְ/אָמְנָ֖ה אִתּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
  footnotes:
  - marker: a
    text: Or 'her ancestry' for 'her family line.' The Hebrew term can refer to birth, lineage, or kindred.
    reason: lexical_alternative
  - marker: b
    text: Or 'as when she was being brought up by him.' The Hebrew recalls Esther's earlier life under Mordecai's guardianship.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더는 자신의 출신과 자기 민족을[a] 모르드개가 자기에게 명한 대로 알리지 않았습니다. 그리고 에스더는 모르드개의 말을[b] 계속 따랐는데, 마치 그가 자기에게 양육하던 때와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 친족’. 히브리어는 출생, 혈통, 친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게 양육되던 때와 같았습니다’. 히브리어는 에스더가 모르드개에게서 길러지던 이전 삶을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין / מַגֶּדֶת
  english_pob_choice: had not made known
  chosen_korean: 알리지 않았습니다
  alternatives_korean:
  - 말하지 않았습니다
  - 밝히지 않았습니다
  lexicon: HALOT
  rationale: 부정과 ‘알리다’의 조합이 공개하지 않음을 자연스럽고 정확하게 드러내며, 서사적 완료 의미도 무리 없이 담습니다.
- source_word: מוֹלַדְתָּהּ
  english_pob_choice: her family line
  chosen_korean: 자신의 출신
  alternatives_korean:
  - 자기 혈통
  - 가문
  - 친족
  lexicon: HALOT
  rationale: 이 말은 출생·혈통·친족 범위를 모두 가리킬 수 있으므로, 한국어에서는 너무 좁지 않은 ‘출신’이 본문의 의미를 안정적으로 담습니다.
- source_word: עַמָּהּ
  english_pob_choice: her people
  chosen_korean: 자기 민족
  alternatives_korean:
  - 자기 백성
  - 자기 ժողովուրդ/민족 공동체
  lexicon: HALOT
  rationale: 에스더의 민족적 소속을 가리키므로 ‘민족’이 현대 한국어에서 가장 직접적입니다. 앞의 ‘출신’과도 어색하게 겹치지 않습니다.
- source_word: מַאֲמַר מָרְדֳּכַי
  english_pob_choice: what Mordecai said
  chosen_korean: 모르드개의 말
  alternatives_korean:
  - 모르드개의 명령
  - 모르드개의 말한 바
  lexicon: HALOT
  rationale: 앞절에 이미 ‘명하다’가 있으므로 여기서는 반복을 피하면서도, מַאֲמַר의 ‘말/발언’ 의미를 살리는 표현이 적절합니다.
- source_word: בְאָמְנָה
  english_pob_choice: under his care
  chosen_korean: 그가 자기에게 양육하던 때
  alternatives_korean:
  - 그의 보호 아래 있을 때
  - 그에게 양육되던 때
  - 그가 길러 주던 때
  lexicon: HALOT
  rationale: 문맥상 모르드개가 에스더를 돌보며 키우던 과거 상태를 회상하므로, ‘양육하다’가 관계의 성격을 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 에스더가 자신의 정체성을 숨기는 서술의 강도
  chosen_reading: 본문의 사실 진술을 그대로 살려, 의도 추정 없이 ‘알리지 않았습니다’로 옮겼습니다.
  alternative_readings:
  - 숨겼습니다
  - 감추었습니다
  rationale: 히브리어는 단순히 ‘알리지 않다’고 말할 뿐, 동기의 악의성이나 전략성을 직접 명시하지 않습니다. 그래서 과도한 해석을 피했습니다.
  doctrine_reference: 서사 문맥의 절제된 의미 보존
