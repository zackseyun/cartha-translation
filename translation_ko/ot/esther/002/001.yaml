  lexicon: HALOT
  rationale: 히브리어의 전형적인 시간 도입구를 한국어로 자연스럽게 옮기되, 앞뒤 서술의 연결감을 살렸습니다.
- source_word: כְּשֹׁךְ חֲמַת
  english_pob_choice: when the anger ... had subsided
  chosen_korean: 분노가 가라앉았을 때
  alternatives_korean:
  - 분노가 누그러졌을 때
  - 진노가 가라앉았을 때
  lexicon: HALOT
  rationale: שׁכך는 ‘가라앉다/진정되다’의 뜻이므로, 왕의 감정이 식는 장면을 직접적으로 표현했습니다.
- source_word: נִגְזַר עָלֶיהָ
  english_pob_choice: what had been decreed against her
  chosen_korean: 그녀에게 내려진 판결
  alternatives_korean:
  - 그녀에게 내려진 결정
  - 그녀에 대하여 내려진 명령
  lexicon: HALOT
  rationale: נִגְזר는 단순한 생각보다 공적인 판결·결정의 성격이 강하므로, 한국어에서도 사법적 뉘앙스를 살렸습니다.
- source_word: זָכַר
  english_pob_choice: he remembered
  chosen_korean: 떠올렸습니다
  alternatives_korean:
  - 기억했습니다
  - 상기했습니다
  lexicon: HALOT
  rationale: 단순한 기억 보유보다, 지금 시점에서 와스디와 관련된 일들을 마음에 불러오는 동작을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕의 분노가 가라앉는 시점과 기억 행위의 연결
  chosen_reading: 서술문을 평이하게 유지해, 왕의 감정 변화와 그에 따른 회상이 원문처럼 직선적으로 읽히게 했습니다.
  alternative_readings:
  - ‘분노가 사라졌을 때’로 더 완화된 표현
  - ‘진노가 식었을 때’로 더 고전적인 표현
  rationale: 본문은 신학적 진술보다 궁정 서사의 흐름이 핵심이므로, 감정이 가라앉은 뒤의 기억이라는 인과를 명료하게 드러내는 데 초점을 두었습니다.
  doctrine_reference: 서사 본문 해석 원칙
