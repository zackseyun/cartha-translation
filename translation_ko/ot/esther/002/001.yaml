  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
  footnotes:
  - marker: a
    text: Or 'when the anger of King Ahasuerus had abated.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what was decreed against her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들 뒤에, 왕 아하수에로스의 분노가 가라앉았을 때 그는 와스디와, 그녀가 한 일과 그녀에게 내려진 판결을 떠올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분노가 누그러졌을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀에게 내려진 결정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: After these things
  chosen_korean: 이런 일들 뒤에
  alternatives_korean:
