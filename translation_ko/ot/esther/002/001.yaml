    rationale: 문맥상 왕실의 공식 결정 또는 명령을 가리키지만, 히브리어 표현 자체가 현대적 사법 절차의 판결을 특정하지는 않습니다. ‘조처’ 또는 ‘결정’이 더 포괄적입니다.
