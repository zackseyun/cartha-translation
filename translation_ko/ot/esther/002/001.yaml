    text: ‘분노가 누그러졌을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀에게 내려진 결정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
