translation:
  language: ko
  text: 이 일들이 있은 뒤, 아하수에로스 왕의 분노가 가라앉았을 때, 그는 와스디와 그녀가 한 일과 그녀에게 내려진 조처를 기억했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
