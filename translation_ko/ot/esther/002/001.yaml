  rationale: שׁכך는 ‘가라앉다/진정되다’의 뜻이므로, 왕의 감정이 식는 장면을 직접적으로 표현했습니다.
- source_word: נִגְזַר עָלֶיהָ
  english_pob_choice: what had been decreed against her
  chosen_korean: 그녀에게 내려진 판결
  alternatives_korean:
