source:
  edition: WLC
  text: אִ֣ישׁ יְהוּדִ֔י הָיָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וּ/שְׁמ֣/וֹ מָרְדֳּכַ֗י בֶּ֣ן יָאִ֧יר בֶּן שִׁמְעִ֛י בֶּן קִ֖ישׁ אִ֥ישׁ יְמִינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
  footnotes:
  - marker: a
    text: Or 'a Judean man' for 'a Jewish man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the citadel of Susa.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'son of' may also indicate more distant ancestry in genealogical contexts.
    reason: cultural_note
translation:
  language: ko
  text: 수산 궁성에 유대인[a] 한 사람이 있었는데, 그의 이름은 모르드개였습니다. 그는 야일의 아들이며 시므이의 아들이며 기스의 아들로서 베냐민 사람이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 계보의 ‘아들’은 경우에 따라 더 먼 조상을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  english_pob_choice: a Jewish man
  chosen_korean: 유대 사람 한 명
  alternatives_korean:
  - 유다 사람 한 명
  - 유대인 한 명
  lexicon: HALOT
  rationale: יְהוּדִי는 여기서 민족적·정체성적 의미가 강하므로, 영어 POB의 'Jewish'에 맞춰 '유대 사람'으로 옮기되 현대 문맥에서 자연스럽게 구성했습니다.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  english_pob_choice: in Susa the citadel
  chosen_korean: 수산 궁성에
  alternatives_korean:
  - 수산 성채에
  - 수산의 궁성에
  - 수산 성곽에
  lexicon: HALOT
  rationale: שׁוּשַׁן은 지명 수산이고, הַבִּירָה는 왕궁이 있는 요새화된 중심부를 가리키므로 '궁성'으로 간결하게 살렸습니다.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  english_pob_choice: son of Jair, son of Shimei, son of Kish
  chosen_korean: 야일의 아들이요, 시므이의 아들이요, 기스의 아들
  alternatives_korean:
  - 야일의 자손이요, 시므이의 자손이요, 기스의 자손
  - 야일의 아들이며 시므이의 아들이며 기스의 아들
  lexicon: HALOT
  rationale: 계보 표지는 히브리어의 직역성이 중요하므로 '아들'을 유지했습니다. 다만 성경 계보에서 '아들'이 먼 조상까지 가리킬 수 있음을 고려해 문장 구조만 한국어답게 다듬었습니다.
- source_word: אִישׁ יְמִינִי
  english_pob_choice: a Benjaminite
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민 지파 사람
  - 베냐민인
  - 베냐민 사람 한 명
  lexicon: HALOT
  rationale: 지파 소속을 가리키는 표현이므로 '베냐민 사람'이 가장 직접적이고 현대 한국어에서도 이해가 쉽습니다.
theological_decisions:
- issue: 이름 뒤의 계보와 마지막 지파 표지가 독자에게 무엇을 보이게 하는지
  chosen_reading: 모르드개를 개인적 인물로만 두지 않고, 유다/베냐민 계열의 정체성과 역사적 뿌리를 함께 드러내는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 신상 소개로만 읽기
  - 계보를 장식적 정보로 약화해 읽기
  rationale: 본문은 인물 소개이면서 동시에 공동체적 출신을 강조합니다. 따라서 번역에서도 계보와 지파 소속을 분명히 보여 주어 서술의 기능을 유지했습니다.
  doctrine_reference: 성경의 언약 공동체 정체성, 역사적 계보 전승
