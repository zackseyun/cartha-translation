  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
  footnotes:
  - marker: a
    text: Or, more literally, 'the daughter of his uncle'—that is, his cousin.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Mordecai adopted her as his daughter.' The Hebrew more literally says he 'took her to himself for a daughter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하다사—곧 에스더—를 양육하고 있었는데, 그녀는 그의 숙부의 딸이었습니다. 그녀는 아버지도 어머니도 없었습니다. 그 젊은 여인은 몸매가 아름답고 모습도 매력적이었는데, 아버지와 어머니가 죽자 모르드개가 그녀를 자기 딸로 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 숙부의 딸'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '모르드개가 그녀를 자기 딸로 입양했다'라고 볼 수 있습니다. 히브리어는 더 문자적으로는 그가 그녀를 자기에게 딸로 '취했다'고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  english_pob_choice: was bringing up
  chosen_korean: 양육하고 있었는데
  alternatives_korean:
  - 키우고 있었는데
  - 돌보고 있었는데
  - 후견하고 있었는데
  lexicon: HALOT
  rationale: 아멘 계열의 분사형이 나타내는 지속적 돌봄·양육의 뜻을 살리되, 현대 한국어에서 자연스러운 진행 표현으로 옮겼습니다.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  english_pob_choice: Hadassah—that is, Esther
  chosen_korean: 하다사—곧 에스더
  alternatives_korean:
  - 하다사, 곧 에스더
  - 하다사, 즉 에스더
  - 하다사(에스더)
  lexicon: HALOT
  rationale: 동격 설명을 에지 대시와 '곧'으로 처리해 두 이름이 같은 인물임을 분명히 하면서도 문장 흐름을 자연스럽게 했습니다.
- source_word: בַּת דֹּדוֹ
  english_pob_choice: the daughter of his uncle
  chosen_korean: 그의 숙부의 딸
  alternatives_korean:
  - 그의 삼촌의 딸
  - 그의 사촌
  - 그의 아버지의 형제의 딸
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 직접 반영해, 파생된 의미인 '사촌'으로 뭉개지 않고 친족 관계 자체를 드러냈습니다.
- source_word: יְפַת תֹּאַר / טוֹבַת מַרְאֶה
  english_pob_choice: beautiful in form / attractive in appearance
  chosen_korean: 몸매가 아름답고 모습도 매력적이었는데
  alternatives_korean:
  - 형체가 아름답고 보기에도 좋았는데
  - 용모가 아름답고 외모도 매력적이었는데
  - 체격이 아름답고 외모도 좋았는데
  lexicon: HALOT
  rationale: 두 개의 병렬 표현이 서로 겹치지 않도록 첫 항은 신체적 형상, 둘째 항은 눈에 보이는 인상을 나누어 살렸습니다.
- source_word: לְקָחָהּ ... לְבַת
  english_pob_choice: Mordecai took her as his own daughter
  chosen_korean: 모르드개가 그녀를 자기 딸로 데려갔습니다
  alternatives_korean:
  - 모르드개가 그녀를 자기 딸로 삼았습니다
  - 모르드개가 그녀를 자기 딸로 받아들였습니다
  - 모르드개가 그녀를 입양했습니다
  lexicon: HALOT
  rationale: 히브리어는 법적 입양 용어보다 '자기에게로 데려가 딸로 삼음'에 가깝기 때문에, '입양했습니다'처럼 제도를 앞세우지 않고 원문 동작을 보존했습니다.
theological_decisions:
- issue: 마지막 구절의 관계 설정
  chosen_reading: '''자기 딸로 데려갔습니다''로 옮겨, 문맥상 보호·양육의 의미를 살리되 법적 입양을 단정하지는 않았습니다.'
  alternative_readings:
  - '''입양했습니다''로 명시'
  - '''자기 딸로 삼았습니다''로 일반화'
  rationale: 히브리어는 '자기를 위해 딸로 취하다'는 식의 표현이므로, 본문이 말하는 정도 이상으로 제도적 판단을 덧붙이지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 관찰에 따른 서술적 절제
