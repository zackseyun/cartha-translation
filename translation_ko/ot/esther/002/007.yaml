    rationale: הֲדַסָּה의 자음 중 ד와 쌍사메크를 반영한 ‘하닷사’가 더 정확합니다. a 각주는 친족 표현 뒤에, b 각주는 ‘딸로 삼았습니다’ 뒤에 붙여야 각주의 대상이 분명합니다.
  - severity: low
