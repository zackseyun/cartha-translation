revisions:
- from: 그는 하다사—곧 에스더—를 양육하고 있었는데, 그녀는 그의 숙부의 딸이었습니다. 그녀는 아버지도 어머니도 없었습니다. 그 젊은 여인은 몸매가 아름답고 모습도 매력적이었는데, 아버지와 어머니가 죽자 모르드개가 그녀를 자기 딸로 데려갔습니다.[a][b]
  to: 그는 하닷사, 곧 에스더를 양육하고 있었습니다. 그녀는 그의 삼촌의 딸이었으며[a], 아버지도 어머니도 없었습니다. 그 젊은 여인은 몸매가 아름답고 용모가 빼어났습니다. 그녀의 아버지와 어머니가 죽었을 때, 모르드개가 그녀를 자기 딸로 삼았습니다.[b]
  rationale: 친족 용어를 원문보다 좁히지 않도록 ‘숙부’를 ‘삼촌’으로 고쳤고, 하닷사 음역을 정정했습니다. 외모에 관한 두 병렬 표현은 ‘몸매’와 ‘용모’로 구별했습니다. 마지막 동사는 법적 제도를 명시하지 않는 ‘자기 딸로 삼았습니다’로 옮겼습니다. 각주 표지를 해당 본문 표현 바로 뒤로 옮기고 각주 내용도 본문 선택과 일치하게 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:03Z'
review_pass:
