id: EST.2.13
reference: Esther 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ/זֶ֕ה הַֽ/נַּעֲרָ֖ה בָּאָ֣ה אֶל הַ/מֶּ֑לֶךְ אֵת֩ כָּל אֲשֶׁ֨ר תֹּאמַ֜ר יִנָּ֤תֵֽן לָ/הּ֙ לָ/ב֣וֹא עִמָּ֔/הּ מִ/בֵּ֥ית הַ/נָּשִׁ֖ים עַד בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
  footnotes:
  - marker: a
    text: Or 'all that she asked for' / 'everything she requested.' The Hebrew literally says 'all that she said,' but in context it refers to what she requested to take with her.
    reason: lexical_alternative
  - marker: b
    text: '''House of the women'' is a formal rendering of the Hebrew expression; it refers to the women’s quarters.'
    reason: cultural_note
translation:
  language: ko
  text: 이렇게 해서 그 젊은 여인은 왕에게 나아갔습니다. 그녀가 말하는 것은 무엇이든지 여자들의 집에서 왕의 집으로 가져갈 수 있도록 그녀에게 주어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀가 말하는 모든 것’이지만, 문맥상 그녀가 요청한 물품을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여자들의 집’은 히브리어 표현을 형식적으로 옮긴 말이며, 여성 거처를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  english_pob_choice: And in this way
  chosen_korean: 이렇게 해서
  alternatives_korean:
  - 이런 방식으로
  - 그리하여
  lexicon: HALOT
  rationale: 앞의 절차를 받아 다음 단계로 넘기는 연결어로서, 현대 한국어에서 자연스럽고 간결하게 절차적 의미를 살립니다.
- source_word: הַנַּעֲרָה
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여인
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: נַעֲרָה의 기본 연령·성별 의미를 살리되, ‘소녀’보다 성숙한 뉘앙스를 유지하고 ‘처녀’의 종교적/관습적 색채를 피했습니다.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  english_pob_choice: whatever she said
  chosen_korean: 그녀가 말하는 것은 무엇이든지
  alternatives_korean:
  - 그녀가 요청하는 것은 무엇이든지
  - 그녀가 말한 모든 것
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그녀가 말하는 모든 것’이지만, 문맥상 요청한 물품을 뜻하므로 ‘무엇이든지’로 처리해 요청의 범위를 자연스럽게 드러냈습니다.
- source_word: יִנָּתֵן לָהּ לָבוֹא עִמָּהּ
  english_pob_choice: would be given to her to take with her
  chosen_korean: 가져갈 수 있도록 그녀에게 주어졌습니다
  alternatives_korean:
  - 그녀와 함께 가도록 주어졌습니다
  - 그녀가 함께 데려갈 수 있게 주어졌습니다
  lexicon: HALOT
  rationale: 수동형 ‘주어지다’와 동반 목적의 לָבוֹא עִמָּהּ를 한국어의 자연스러운 ‘가져가다’로 옮겨, 기능적 의미를 보존했습니다.
- source_word: מִבֵּית הַנָּשִׁים
  english_pob_choice: from the house of the women
  chosen_korean: 여자들의 집에서
  alternatives_korean:
  - 여인들의 집에서
  - 여자들의 거처에서
  lexicon: HALOT
  rationale: 히브리어 표현을 직접 살리되, 독자에게 이해 가능한 현대어로 옮겼습니다. 문맥상 여성 거처를 가리키는 공식적 표현입니다.
- source_word: עַד בֵּית הַמֶּלֶךְ
  english_pob_choice: to the king’s house
  chosen_korean: 왕의 집으로
  alternatives_korean:
  - 왕의 집까지
  - 왕궁으로
  lexicon: HALOT
  rationale: 직역 대응을 유지해 ‘왕의 집’이라는 히브리어 표현을 보존했습니다. ‘왕궁’은 해석어라서 본문 어휘와의 대응을 약화시킵니다.
theological_decisions:
- issue: 이 절의 동사군을 ‘나아갔습니다 / 주어졌습니다’로 옮길지, 관습적 서술을 더 풀어 쓸지
  chosen_reading: 사건의 진행을 담담히 서술하는 합쇼체를 유지했습니다.
  alternative_readings:
  - 더 의역해 사건의 절차를 풀어 설명하기
  - 더 문어적인 서술로 압축하기
  rationale: 본문은 궁정 절차의 진행을 보고체로 전달하므로, 과도한 해설이나 정서적 강조 없이 중립적 서술을 유지하는 것이 원문의 기능에 가깝습니다.
  doctrine_reference: 서사 본문 번역 원칙
