  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מָרְדֳּכַ֖י יֹשֵׁ֣ב בְּ/שַֽׁעַר הַ/מֶּ֑לֶךְ קָצַף֩ בִּגְתָ֨ן וָ/תֶ֜רֶשׁ שְׁנֵֽי סָרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ מִ/שֹּׁמְרֵ֣י הַ/סַּ֔ף וַ/יְבַקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵֽרֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
  footnotes:
  - marker: a
    text: Or 'the king’s court officials'; the Hebrew term can refer more broadly to royal officers, though 'eunuchs' is likely in this court setting.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to send out a hand against'; that is, to attack or assassinate the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 모르드개가 왕의 문에 앉아 있을 때, 왕의 내시들인 비그단과 테레스—문을 지키는 자들 가운데 하나였는데—가 화가 나서 아하수에로 왕에게 손을 대려고 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 내시들’로 옮겼지만, 히브리어 סָרִיס는 궁정 관리들을 더 넓게 가리킬 수도 있습니다. 이 본문에서는 궁정 맥락상 ‘내시’가 더 유력합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손을 보내다/뻗다’로, 여기서는 왕을 해치거나 암살하려는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그 무렵에
  - 그날들에
  lexicon: HALOT
  rationale: 서사 도입의 시간표현을 자연스러운 현대 한국어로 옮기되, 특정 날짜보다 넓은 배경 시점을 유지했습니다.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  english_pob_choice: the king’s eunuchs
  chosen_korean: 왕의 내시들
  alternatives_korean:
  - 왕의 관료들
  - 왕의 궁정 관리들
  lexicon: HALOT
  rationale: 페르시아 궁정 문맥에서 סָרִיס는 실제 내시를 가리키는 경우가 유력하므로, 본문이 가진 구체성을 살려 ‘내시들’로 옮겼습니다.
- source_word: מִשֹּׁמְרֵי הַסַּף
  english_pob_choice: from those who guarded the threshold
  chosen_korean: 문을 지키는 자들 가운데 하나였는데
  alternatives_korean:
  - 문지기들 가운데 하나였는데
  - 문턱을 지키는 자들 가운데서
  lexicon: HALOT
  rationale: ‘threshold’를 문자적으로만 옮기기보다, 궁정 출입구를 지키는 역할을 드러내는 한국어로 풀어 의미를 보존했습니다.
- source_word: לִשְׁלֹחַ יָד
  english_pob_choice: to lay hands on
  chosen_korean: 손을 대려고
  alternatives_korean:
  - 해치려고
  - 공격하려고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도, 주석 없이도 폭력 의도를 감지할 수 있도록 한국어 관용을 사용했습니다.
