id: EST.2.3
reference: Esther 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
  footnotes:
  - marker: a
    text: Or 'the harem' for 'the house of the women.' The Hebrew is more literally 'the house of the women.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beauty treatments be provided for them.' The Hebrew term can refer broadly to cosmetic preparations or beautifying treatments.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 왕국의 모든 지방에 관리들을 세우고, 아름다운 외모를 지닌 모든 젊은 처녀를 수산의 도성, 곧 여자들의 집으로 모아들여, 여자들을 맡은 왕의 환관 헤개의 보호 아래 두고, 그들의 미용용품을 주게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후궁’으로도 옮길 수 있습니다. 히브리어는 직역하면 ‘여자들의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘미용 처치가 제공되게 하십시오’라는 뜻일 수 있습니다. 히브리어는 미용 준비물이나 손질용 처치를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד / פְּקִידִים
  english_pob_choice: appoint officers
  chosen_korean: 관리들을 세우고
  alternatives_korean:
  - 관리들을 임명하고
  - 관원들을 세우고
  lexicon: HALOT
  rationale: 히필 동사와 행정 맥락을 살려 ‘세우다/임명하다’ 계열로 옮겼고, פְּקִידִים은 군사적 뉘앙스보다 행정 담당자를 가리키므로 ‘관리들’이 자연합니다.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  english_pob_choice: the provinces of his kingdom
  chosen_korean: 왕국의 모든 지방
  alternatives_korean:
  - 그의 나라의 모든 지방
  - 제국의 모든 행정구역
  lexicon: HALOT
  rationale: 에스더의 페르시아 행정 문맥에서 ‘지방’이 가장 직관적이며, 왕의 소유격은 ‘왕국’으로 풀어 자연스럽게 반영했습니다.
- source_word: כָּל נַעֲרָה בְתוּלָה טוֹבַת מַרְאֶה
  english_pob_choice: every young virgin of beautiful appearance
  chosen_korean: 아름다운 외모를 지닌 모든 젊은 처녀
  alternatives_korean:
  - 아름다운 모습의 모든 젊은 처녀
  - 보기 좋은 모든 젊은 동정녀
  lexicon: HALOT
  rationale: נַעֲרָה의 ‘젊은 여자/처녀’와 בְתוּלָה의 ‘처녀됨’을 함께 보존했고, טוֹבַת מַרְאֶה는 외모의 시각적 평가로 옮겼습니다.
- source_word: שׁוּשַׁן הַבִּירָה / בֵּית הַנָּשִׁים / אֶל יַד הֵגֶא
  english_pob_choice: Susa the citadel / the house of the women / into the custody of Hegai
  chosen_korean: 수산의 도성, 곧 여자들의 집으로 … 여자들을 맡은 왕의 환관 헤개의 보호 아래
  alternatives_korean:
  - 수산의 성채, 곧 여자들의 집으로 … 헤개의 감시 아래
  - 수산의 성읍, 곧 여자들의 집으로 … 헤개의 손 아래
  lexicon: HALOT
  rationale: הַבִּירָה는 단순 성읍보다 왕실 요새·도성의 뜻이 강해 ‘도성’으로 잡았고, ‘어린 여인들의 집’보다 직역성이 높은 ‘여자들의 집’을 유지했으며, ‘into the hand of’ 관용구는 ‘보호 아래’로 자연화했습니다.
- source_word: תַּמְרוּקֵיהֶן
  english_pob_choice: their cosmetics
  chosen_korean: 그들의 미용용품
  alternatives_korean:
  - 그들의 화장품
  - 그들의 미용 처치
  lexicon: HALOT
  rationale: מְּרוּקֵי־는 단순 화장품보다 넓게 미용·손질용 준비물을 가리킬 수 있어, POB의 각주 의미를 반영해 ‘미용용품’으로 옮겼습니다.
theological_decisions:
- issue: 에스더 2:3의 명령형 화법
  chosen_reading: 직설문이 아닌 궁중 명령 제안으로 읽어, 한국어에서는 왕에게 정중한 명령형 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - 서술형으로 ‘왕이 관리들을 세워…’로 처리
  - 간접화법으로 완만하게 표현
  rationale: 히브리어는 일련의 접속형·청유형으로 왕명 절차를 제시하므로, 현대 한국어에서는 명령 제안의 힘을 살리되 합쇼체로 공손하게 재현하는 편이 원문 기능에 가깝습니다.
  doctrine_reference: 서사 문체와 명령 담화의 재현
