  terminology: ‘젊은 처녀’, ‘수산 성채’, ‘여자들의 집’, ‘왕의 환관’, ‘미용용품’은 원문의 어휘 범위와 현대 표준 한국어에 대체로 잘 맞습니다. ‘후궁’은 여자들의 집 자체의 직역은 아니므로 각주에서 문맥적 표현임을 분명히 해야 합니다.
