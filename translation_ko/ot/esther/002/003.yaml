  source_fidelity: 수정이 필요합니다. 히브리어의 וְיִקְבְּצוּ는 왕이 임명할 관리들이 여자들을 모으게 한다는 뜻인데, 초안은 왕이 직접 모으는 것으로 읽힐 수 있습니다. 또한 אֶל־יַד הֵגֶא는 헤개의 권한·관리 아래 둔다는 관용적 의미이므로 ‘보호 아래’보다 ‘관리 아래’가 중립적이고 가깝습니다.
