revisions:
- from: 왕이 왕국의 모든 지방에 관리들을 세우고, 아름다운 외모를 지닌 모든 젊은 처녀를 수산의 도성, 곧 여자들의 집으로 모아들여, 여자들을 맡은 왕의 환관 헤개의 보호 아래 두고, 그들의 미용용품을 주게 하십시오.[a][b]
  to: 왕께서 왕국의 모든 지방에 관리들을 임명하시고, 그 관리들이 아름다운 외모를 지닌 모든 젊은 처녀를 수산 성채에 있는 여자들의 집[a]으로 모아, 여자들을 맡은 왕의 환관 헤개의 관리 아래 두게 하시며, 그들에게 미용용품[b]을 주게 하십시오.
  rationale: 관리들의 복수 행위를 명시하여 히브리어 동사 연쇄의 주어를 보존했습니다. ‘보호’라는 추가 뉘앙스를 피하고 헤개의 행정적 권한을 ‘관리 아래’로 옮겼습니다. 수산의 בִּירָה는 성읍 전체보다 왕실 요새·성채를 가리키므로 ‘수산 성채’로 번역했으며, 각주는 각각의 관련 어구에 연결했습니다.
