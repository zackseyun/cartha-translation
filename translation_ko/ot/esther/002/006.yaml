revisions:
- from: 그는 예루살렘에서 포로로 끌려가서, 유다 왕 여고냐와 함께 끌려간 포로들과 함께 있었는데, 바빌론 왕 느부갓네살이 그를 포로로 끌고 갔습니다.[a]
  to: 그는 예루살렘에서 유다 왕 여고냐와 함께 포로로 끌려간 포로들과 함께 포로로 끌려간 사람이었는데, 바빌론 왕 느부갓네살이 여고냐를 포로로 끌고 갔습니다.[a]
  rationale: 원문의 세 차례 גלה 계열 동사를 ‘포로로 끌려가다/끌고 가다’로 일관되게 반영했습니다. 첫 관계절은 본문 흐름을 따라 모르드개를 가리키는 표면적 읽기를 유지하되, 연대상 제기되는 기스 선행사 가능성은 각주에 보존했습니다. 마지막 관계절의 선행사인 여고냐는 한국어에서 모호하지 않도록 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:01Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 본문의 마지막 관계절(‘느부갓네살이 포로로 끌고 간’)은 문맥상 여고냐를 가리키는데, 초안의 ‘그를’은 모르드개를 가리키는 것으로 읽혀 선행사를 잘못 처리합니다. 또한 ‘포로들과 함께 있었는데’는 עִם의 동반 관계를 ‘함께 있었다’로 바꾸어 원문의 강제 이주 진술을 약화합니다.
  naturalness: ‘포로들과 함께 있었는데’는 현대 한국어에서도 의미 연결이 부자연스럽습니다. ‘…함께 포로로 끌려간 사람이었는데’로 옮기면 관계절의 구조와 반복되는 גלה의 의미가 자연스럽게 드러납니다.
  terminology: ‘여고냐’와 ‘느부갓네살’, ‘포로로 끌려가다’는 적절합니다. 다만 마지막 목적어는 ‘여고냐’로 명시해야 하며, 각주도 ‘포로 사건’보다 ‘포로로 끌려간 일’이라고 하는 편이 자연스럽고 정확합니다.
  issues:
  - severity: high
    issue: 마지막 ‘그를’의 선행사 오류
    rationale: 히브리어 אֲשֶׁר הֶגְלָה 뒤의 목적어 관계대명사는 바로 앞의 ‘유다 왕 여고냐’를 받습니다. 초안처럼 모르드개로 읽히게 하면 느부갓네살이 모르드개를 여고냐와 같은 시기에 포로로 끌고 갔다는 뜻이 되어 원문의 관계절 구조를 훼손합니다.
  - severity: medium
    issue: ‘포로들과 함께 있었는데’가 강제 이주의 동반 관계를 약화함
    rationale: 첫 הָגְלָה는 ‘예루살렘에서 … 포로들과 함께 포로로 끌려간’ 일을 말합니다. 단순 공존을 뜻하는 ‘함께 있었다’는 원문의 동사를 반영하지 못합니다.
  - severity: low
    issue: 각주의 ‘여고냐의 포로 사건’ 표현
    rationale: ‘여고냐가 포로로 끌려간 일’이 역사적 사건과 연대 문제를 더 직접적이고 자연스럽게 표현합니다.
  revised_text: 그는 예루살렘에서 유다 왕 여고냐와 함께 포로로 끌려간 포로들과 함께 포로로 끌려간 사람이었는데, 바빌론 왕 느부갓네살이 여고냐를 포로로 끌고 갔습니다.[a]
