source:
  edition: WLC
  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
  footnotes:
  - marker: a
    text: Or, 'who' may refer to Kish, Mordecai's ancestor, rather than to Mordecai himself, since Jeconiah's exile occurred generations earlier.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 예루살렘에서 포로로 끌려가서, 유다 왕 여고냐와 함께 끌려간 포로들과 함께 있었는데, 바빌론 왕 느부갓네살이 그를 포로로 끌고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그’는 모르드개 자신이 아니라 모르드개의 조상 기스를 가리킬 수 있습니다. 여고냐의 포로 사건은 여러 세대 이전이기 때문입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: who
  chosen_korean: 그는
  alternatives_korean:
  - 그가
  - 그
  lexicon: HALOT
  rationale: 관계절이 가리키는 인물을 자연스러운 한국어 주어로 풀어 주어, 뒤의 연속된 포로 이동 진술이 매끄럽게 읽히도록 했습니다.
- source_word: הָגְלָה / הֶגְלָה
  english_pob_choice: had been taken into exile / had taken into exile
  chosen_korean: 포로로 끌려가서 … 포로로 끌고 갔습니다
  alternatives_korean:
  - 사로잡혀 갔습니다
  - 포로로 잡혀갔습니다
  lexicon: HALOT
  rationale: 히브리어 גלה의 반복을 살리기 위해 같은 뿌리 감각의 표현을 두 번 반영했고, 강제 이주의 의미를 분명히 하기 위해 ‘포로로 끌려가다/끌고 가다’를 택했습니다.
- source_word: עִם הַגֹּלָה
  english_pob_choice: with the exiles
  chosen_korean: 포로들과 함께
  alternatives_korean:
  - 유배자들과 함께
  - 끌려간 무리와 함께
  lexicon: HALOT
  rationale: הַגּוֹלָה를 추상적 ‘포로기’가 아니라 사람들의 집단으로 이해하여, 현대 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: יְכָנְיָה
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여고니야
  - 여호야긴
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 알려진 형식을 택하되, 영어 POB의 Jeconiah에 대응하는 인명으로 읽히도록 했습니다.
- source_word: נְבוּכַדְנֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓네살왕
  - 느부갓네살
  lexicon: HALOT
  rationale: 관용적이고 널리 인식되는 왕명 음역을 사용했습니다.
theological_decisions:
- issue: Esther 2:6의 관계절 선행사
  chosen_reading: '본문은 표면 문법 흐름을 따라 ‘그는’으로 이어지는 인물, 곧 모르드개를 가리키는 것으로 옮겼습니다. '
  alternative_readings:
  - ‘그’가 모르드개의 조상 기스를 가리킨다고 볼 수 있습니다.
  rationale: 히브리어의 가장 가까운 선행사는 5절의 모르드개이지만, 여고냐 시대와의 연대 차이 때문에 기스를 선행사로 보는 해석도 가능하므로, 본문에는 자연스러운 읽기를 두고 해석상 긴장은 주석 표기로 남기는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
