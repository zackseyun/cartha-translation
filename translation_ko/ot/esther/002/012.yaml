  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'Now when the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: ko
  text: 각 젊은 여자의 차례가 와서 아하수에로 왕에게 들어갈 때에는, 여자들을 위한 규정 아래서 열두 달을 지낸 뒤였습니다. 이는 그들의 미용 기간이 이렇게 채워졌기 때문인데, 곧 몰약 기름으로 여섯 달, 향품과 여자들의 화장품으로 여섯 달이었습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘여자들을 위한 규정’은 페르시아 궁정의 공식 절차를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘미용 기간’은 몸단장과 피부 관리 전반을 가리키는 서술입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּר / נַעֲרָה וְנַעֲרָה
  english_pob_choice: the turn of each young woman
  chosen_korean: 각 젊은 여자의 차례
  alternatives_korean:
  - 각 처녀의 차례
  - 각 젊은 여인의 차례
  lexicon: תֹּר
  rationale: תֹּר는 순서·몫·차례를 가리키므로 ‘차례’로 옮겼고, נַעֲרָה는 미성년 뉘앙스보다 젊은 여성 일반을 가리키는 맥락이어서 ‘젊은 여자’로 자연스럽게 풀었습니다.
- source_word: כְּדָת הַנָּשִׁים
  english_pob_choice: under the regulation for the women
  chosen_korean: 여자들을 위한 규정 아래서
  alternatives_korean:
  - 여자들에 대한 규례 아래서
  - 여자들을 위한 법도 아래서
  lexicon: דָּת
  rationale: דָּת는 궁정의 공식 규정·절차를 뜻하므로 종교적 ‘율례’보다 행정적 성격이 드러나는 ‘규정’이 더 정확합니다.
- source_word: יְמֵי מְרוּקֵיהֶן
  english_pob_choice: the days of their beauty treatments
  chosen_korean: 그들의 미용 기간
  alternatives_korean:
  - 그들의 아름다움 손질 기간
  - 그들의 몸단장 기간
  lexicon: מָרוּק
  rationale: 문맥상 단순한 ‘정화’보다 몸을 다듬고 가꾸는 준비 과정을 말하므로 ‘미용 기간’으로 간결하게 반영했습니다.
- source_word: בְּשָׂמִים / תַמְרוּקֵי הַנָּשִׁים
  english_pob_choice: spices and with the cosmetics for women
  chosen_korean: 향품과 여자들의 화장품
  alternatives_korean:
  - 향료와 여자들의 화장 도구
  - 향품과 여자들의 미용품
  lexicon: בְּשָׂמִים
  rationale: בְּשָׂמִים은 향료·향품이고, תַמְרוּקִים은 몸단장용 화장품·미용재를 가리키므로 둘을 구분해 옮겼습니다.
theological_decisions:
- issue: 궁정 규정과 미용 처리를 과장 없이 전달하는 문제
  chosen_reading: 본문의 제도적·신체적 준비 과정을 그대로 기술하는 서술로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘정결 기간’으로 영적 의미를 부여하는 읽기
  - 문화적으로 순화해 세부를 생략하는 읽기
  rationale: 에스더서의 이 구절은 종교적 의식이 아니라 페르시아 궁정의 준비 절차를 묘사하므로, 본문의 세속적·역사적 성격을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 장르 및 서사 맥락
