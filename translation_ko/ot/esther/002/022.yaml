reference: Esther 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּוָּדַ֤ע הַ/דָּבָר֙ לְ/מָרְדֳּכַ֔י וַ/יַּגֵּ֖ד לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה וַ/תֹּ֧אמֶר אֶסְתֵּ֛ר לַ/מֶּ֖לֶךְ בְּ/שֵׁ֥ם מָרְדֳּכָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
  footnotes:
  - marker: a
    text: Or 'was made known to Mordecai.' The Hebrew passive can emphasize either that the matter came to his knowledge or that someone informed him.
    reason: lexical_alternative
  - marker: b
    text: Or 'Esther the queen.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the name of Mordecai' or 'on Mordecai's behalf.' The phrase indicates that Esther presented the report as coming from Mordecai.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 모르드개에게 알려지자[a], 그는 에스더 왕비에게[b] 알렸습니다. 에스더는 모르드개의 이름으로[c] 왕에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모르드개가 그 일을 알게 되자.’ 히브리어 수동형은 그 일이 모르드개의 지식에 들어온 것과 누군가 그에게 알린 것 가운데 어느 하나를 특정하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘왕비 에스더에게.’ 히브리어는 문자적으로 ‘에스더 왕비에게’라고 합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘모르드개를 대신하여.’ 이 표현은 에스더가 그 보고를 모르드개에게서 나온 것으로 밝혀 왕에게 전했음을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּדַע הַדָּבָר לְמָרְדֳּכַי
  english_pob_choice: When the matter became known to Mordecai
  chosen_korean: 그 사건이 모르드개에게 알려지자
  alternatives_korean:
  - 모르드개가 그 사건을 알게 되자
  - 그 일이 모르드개에게 알려졌을 때
  lexicon: HALOT
  rationale: נודע의 수동/인식 도달 의미를 살려, 사건이 모르드개에게 ‘알려지다’로 옮겼습니다. ‘그 사건’은 앞절의 암살 음모를 가리키는 문맥상 자연스러운 구체화입니다.
- source_word: וַיַּגֵּד לְאֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: he told Queen Esther
  chosen_korean: 그는 왕비 에스더에게 알렸습니다
  alternatives_korean:
  - 그는 왕비 에스더에게 말했습니다
  - 그는 에스더 왕비에게 보고했습니다
  lexicon: HALOT
  rationale: נגד의 전달·보고 기능을 살리면서도 현대 한국어에서 자연스럽게 ‘알리다’로 옮겼습니다. ‘왕비 에스더’는 직역형인 ‘에스더 왕비’보다 읽기 자연성이 높습니다.
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  english_pob_choice: Esther told the king
  chosen_korean: 에스더는 ... 왕에게 말했습니다
  alternatives_korean:
  - 에스더는 ... 왕에게 알렸습니다
  - 에스더는 ... 왕에게 전했습니다
  lexicon: HALOT
  rationale: אמר의 기본적인 발화 동사를 따라 ‘말했습니다’로 옮겼습니다. 한국어에서 ‘왕에게 말하다’는 공적인 전달 행위를 무리 없이 담아냅니다.
- source_word: בְּשֵׁם מָרְדֳּכָי
  english_pob_choice: in Mordecai's name
  chosen_korean: 모르드개의 이름으로
  alternatives_korean:
  - 모르드개의 이름 안에서
  - 모르드개의 이름을 가지고
  lexicon: HALOT
  rationale: בשם의 관용적 의미를 따라 ‘~의 이름으로’로 옮겨, 에스더가 그 보고를 모르드개에게 귀속시켜 전달한 점을 드러냈습니다.
theological_decisions:
- issue: 에스더가 왕에게 전달한 보고의 귀속 방식
  chosen_reading: ‘모르드개의 이름으로’는 단순한 대리 발화라기보다, 보고의 출처를 모르드개에게 명시해 제시한 것으로 이해했습니다.
  alternative_readings:
  - ‘모르드개를 대신하여’
  - ‘모르드개의 권한으로’
  rationale: 문맥상 핵심은 행위의 권한 위임보다 발화의 출처 표시에 있습니다. POB의 audit note도 같은 방향을 지지합니다.
  doctrine_reference: 서술 문맥의 발화 귀속 이해
