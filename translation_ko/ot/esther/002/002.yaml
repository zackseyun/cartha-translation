  to: 그러자 왕의 젊은이들, 곧 그를 모시는 이들이 말했습니다. “왕을 위하여 젊고 처녀이며 외모가 아름다운 여자들을 찾도록 하십시오.”[a][b]
  rationale: 주어구의 순서를 원문에 맞추어 ‘왕의 젊은이들’을 중심으로 하고, מְשָׁרְתָיו는 이를 설명하는 ‘그를 모시는 이들’로 유지했습니다. 여성들을 설명하는 세 요소를 자연스러운 한국어 병렬 구조로 다듬었으며, 능동 복수 청유의 제안이 왕에게 전달되는 문맥을 고려하여 ‘찾도록 하십시오’로 옮겼습니다. 각주는 수정된 본문과 원문의 어휘 병렬을 일관되게 반영합니다.
  reviewer_model: gpt-5.6-terra
