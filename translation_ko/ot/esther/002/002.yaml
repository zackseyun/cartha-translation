base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
  footnotes:
  - marker: a
    text: Literally, 'young women, virgins, good in appearance.'
    reason: lexical_alternative
  - marker: b
    text: Or, more formally, 'Let them seek for the king young virgins beautiful in appearance.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 왕의 시종들, 곧 그를 모시는 젊은 남자들이 말했습니다. "왕을 위하여 젊고, 처녀이며, 외모가 아름다운 여자들을 찾게 하십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘젊은 여자들, 처녀들, 외모가 좋은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 더 형식적으로는 ‘왕을 위하여 젊고 외모가 아름다운 처녀들을 찾게 하십시오’라고도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술 진행을 한국어의 자연스러운 사건 전환인 ‘그러자’로 살렸습니다.
- source_word: נַעֲרֵי הַמֶּלֶךְ מְשָׁרְתָיו
  english_pob_choice: the king’s young men who attended him
  chosen_korean: 왕의 시종들, 곧 그를 모시는 젊은 남자들
  alternatives_korean:
  - 왕의 젊은 신하들, 곧 그를 섬기는 자들
  - 왕의 젊은 시종들, 곧 그를 모시는 이들
  lexicon: HALOT
  rationale: נַעַר의 ‘젊은 남자’와 מְשָׁרֵת의 ‘시중들다/모시다’를 함께 살리기 위해, 신분적 뉘앙스를 너무 좁히지 않는 ‘시종들’과 설명적 동격을 썼습니다.
- source_word: נְעָרוֹת בְּתוּלוֹת
  english_pob_choice: young virgins
  chosen_korean: 젊고, 처녀이며
  alternatives_korean:
  - 젊은 처녀들
  - 어린 처녀들
  lexicon: HALOT
  rationale: נְעָרוֹת와 בְּתוּלוֹת의 두 요소를 모두 드러내기 위해 ‘젊고, 처녀이며’로 분리해 옮겼습니다.
- source_word: טוֹבוֹת מַרְאֶה
  english_pob_choice: beautiful in appearance
  chosen_korean: 외모가 아름다운
  alternatives_korean:
  - 보기 좋은
  - 용모가 아름다운
  - 아름다운 외모의
  lexicon: HALOT
  rationale: 히브리어의 관용구인 ‘좋은 보기/외모’를 한국어의 자연스러운 관용인 ‘외모가 아름다운’으로 옮겨, 의미를 직역하되 어색한 어순은 피했습니다.
