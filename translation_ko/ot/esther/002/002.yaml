    text: 직역하면 ‘젊은 여자들, 처녀들, 외모가 아름다운 여자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 더 형식적으로는 ‘왕을 위하여 젊은 처녀들 가운데 외모가 아름다운 여자들을 찾도록 하십시오’라고도 옮길 수 있습니다.
    reason: alternative_reading
