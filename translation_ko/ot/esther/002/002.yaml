  text: 그러자 왕의 젊은이들, 곧 그를 모시는 이들이 말했습니다. “왕을 위하여 젊고 처녀이며 외모가 아름다운 여자들을 찾도록 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
