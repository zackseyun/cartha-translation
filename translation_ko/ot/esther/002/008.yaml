revisions:
- from: 그리고 왕의 명령과 그의 조서가 들리고, 많은 젊은 여인들이 수산 궁성으로 에게이의 관리 아래 모일 때에, 에스더도 왕의 집으로, 곧 여성들을 맡아 지키는 에게이의 관리 아래로 끌려갔습니다.[a][b]
  to: 왕의 명령과 조서가 들리고, 많은 젊은 여인들이 수산 궁성에 모여 헤개에게 맡겨지게 되었을 때에[a], 에스더도 왕의 집으로[b] 데려가 헤개의 관리 아래 맡겨졌습니다. 헤개는 여인들을 관리하는 사람이었습니다.
  rationale: 수산 궁성으로의 집결과 헤개의 관할 아래 맡겨짐을 분명히 구분했습니다. 에스더의 수동적 처지를 보존하되 ‘끌려가다’가 함축할 수 있는 과도한 강제의 세부 사항은 덧붙이지 않았습니다. ‘헤개’와 ‘수산’은 표준 한국어 성경에서 익숙한 인명·지명 표기를 따랐습니다. 마지막의 ‘헤개는…’은 원문의 동격 표현(‘여인들을 지키는 헤개’)을 완전한 현대 한국어 문장으로 드러낸 것입니다.
  reviewer_model: gpt-5.6-terra
