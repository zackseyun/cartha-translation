  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
  footnotes:
  - marker: a
    text: Or 'to the charge of Hegai'; literally, 'to the hand of Hegai.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the king’s palace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 명령과 조서가 들리고, 많은 젊은 여인들이 수산 궁성에 모여 헤개에게 맡겨지게 되었을 때에[a], 에스더도 왕의 집으로[b] 데려가 헤개의 관리 아래 맡겨졌습니다. 헤개는 여인들을 관리하는 사람이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘헤개의 손에’입니다. 곧 헤개의 관리 아래에 맡겨졌다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕궁’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  english_pob_choice: command
  chosen_korean: 명령
  alternatives_korean:
  - 말
  - 지시
  - 조서
  lexicon: HALOT
  rationale: 왕의 공식적 지시라는 뉘앙스를 살려 자연스럽게 ‘명령’으로 옮겼습니다. 뒤의 דָת와 짝을 이루는 점을 고려해, 여기서는 조서보다 더 일반적인 상위 개념이 적합합니다.
- source_word: דָת
  english_pob_choice: decree
  chosen_korean: 조서
  alternatives_korean:
  - 칙령
  - 법
  - 명령
  lexicon: HALOT
  rationale: 페르시아 궁정 문맥의 공식 문서·규정이라는 성격을 살려 ‘조서’로 옮겼습니다. 한국어에서 왕의 공식 문서라는 느낌을 유지하면서도, ‘법’처럼 보편적 규범으로 오해될 가능성을 줄입니다.
- source_word: אֶל יַד
  english_pob_choice: into the custody of
  chosen_korean: 관리 아래로
  alternatives_korean:
  - 손에
  - 보호 아래로
  - 맡겨져
  lexicon: HALOT
  rationale: 직역하면 ‘손에’이지만, 이 관용구는 통제·관리 아래 놓인 상태를 뜻하므로 한국어로는 ‘관리 아래로’가 가장 자연스럽고 문맥도 분명합니다. POB가 주석으로 제시한 ‘to the hand of’의 직역 가능성은 각주로 남겼습니다.
- source_word: וַתִּלָּקַח
  english_pob_choice: was taken
  chosen_korean: 끌려갔습니다
  alternatives_korean:
  - 데려가졌습니다
  - 잡혀갔습니다
  - 취해졌습니다
  lexicon: HALOT
  rationale: 수동형이지만, 이 문맥에서는 에스더가 자신의 의지로 이동한 것이 아니라 타의에 의해 궁중으로 들어갔다는 점이 중요하므로 ‘끌려갔습니다’로 옮겼습니다. ‘잡혀갔습니다’는 지나치게 강하고, ‘데려가졌습니다’는 어색합니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  - 왕의 집안
  lexicon: HALOT
  rationale: 원문을 최대한 투명하게 따라 ‘왕의 집’으로 옮겼습니다. 궁정 전체를 가리키는 문맥이지만, POB의 선택처럼 ‘집’이라는 표현을 유지하면 מקור어 구조를 더 잘 보존할 수 있습니다.
- source_word: שֹׁמֵר הַנָּשִׁים
  english_pob_choice: keeper of the women
  chosen_korean: 여성들을 맡아 지키는
  alternatives_korean:
  - 여성들의 지기
  - 여성들의 수호자
  - 여성들을 돌보는
  lexicon: HALOT
  rationale: ‘keeper’는 단순한 돌봄보다 관리·감시의 성격이 있으므로, 문맥을 반영해 ‘맡아 지키는’으로 풀었습니다. 너무 완화된 ‘돌보는’은 권력 비대칭을 약화시킬 수 있습니다.
theological_decisions:
- issue: 에스더의 이동을 나타내는 수동 표현의 뉘앙스
  chosen_reading: 에스더도 왕의 집으로 … 끌려갔습니다
  alternative_readings:
  - 에스더도 왕의 집으로 … 데려가졌습니다
  - 에스더도 왕의 집으로 … 옮겨졌습니다
  rationale: 수동형은 에스더의 비자발성과 궁정 권력의 작동을 드러냅니다. 한국어에서도 이를 희석하지 않도록 ‘끌려갔습니다’로 번역했습니다.
  doctrine_reference: 본문 서사에서 인간의 의지와 제국 권력이 충돌하는 장면의 사실성을 보존하는 문제
