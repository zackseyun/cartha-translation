base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
  footnotes:
  - marker: a
    text: Or 'she won favor and kindness before him.' The Hebrew idiom is literally 'she bore favor and kindness before him.'
    reason: lexical_alternative
  - marker: b
    text: '''Virgins'' translates a more specific Hebrew term than ''women'' earlier in the verse; the distinction is preserved in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 에스더를 모든 여자들보다 더 사랑했고, 그녀는 모든 처녀들보다 그 앞에서 은총과 호의를 얻었습니다. 그래서 왕은 그녀의 머리 위에 왕관을 씌우고 와스디 대신 그녀를 왕비로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은총과 호의’는 히브리어 חֵן וָחֶסֶד의 두 어휘를 각각 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘처녀들’은 앞의 ‘여자들’보다 더 좁은 히브리어 표현을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  english_pob_choice: loved
  chosen_korean: 더 사랑했고
  alternatives_korean:
  - 사랑했고
  - 애정을 품었고
  lexicon: HALOT
  rationale: אהב의 기본 의미를 직접 살려 감정의 강도를 분명히 하되, 비교 구문과 자연스럽게 맞도록 ‘더 사랑했고’로 옮겼습니다.
- source_word: מִכָּל הַנָּשִׁים
  english_pob_choice: more than all the women
  chosen_korean: 모든 여자들보다
  alternatives_korean:
  - 모든 여성들보다
  - 모든 부인들보다
  lexicon: HALOT
  rationale: 비교 구문을 한국어에서도 명시적으로 드러냈고, 여기서는 궁정 맥락의 일반적 여성을 뜻하므로 ‘여자들’이 가장 직접적입니다.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  english_pob_choice: she found favor and kindness
  chosen_korean: 은총과 호의를 얻었습니다
  alternatives_korean:
  - 은총과 친절을 얻었습니다
  - 호의와 친절을 얻었습니다
  lexicon: HALOT
  rationale: חֵן과 חֶסֶד을 둘 다 살리되, 한국어에서 관용적인 수용 표현인 ‘얻다’를 사용해 행위 결과를 자연스럽게 전달했습니다.
- source_word: מִכָּל הַבְּתוּלֹת
  english_pob_choice: more than all the virgins
  chosen_korean: 모든 처녀들보다
  alternatives_korean:
  - 모든 동정녀들보다
  - 모든 젊은 여자들보다
  lexicon: HALOT
  rationale: בְּתוּלֹת의 더 좁은 의미를 유지하기 위해 ‘처녀들’로 옮겨 앞의 ‘여자들’과의 구별을 보존했습니다.
- source_word: וַיַּמְלִיכֶהָ
  english_pob_choice: made her queen
  chosen_korean: 왕비로 삼았습니다
  alternatives_korean:
  - 왕으로 세웠습니다
  - 여왕으로 삼았습니다
  lexicon: HALOT
  rationale: המליך의 사역적 의미를 살리면서, 문맥상 여성 통치자/왕비에 해당하는 자연스러운 한국어로 ‘왕비로 삼았습니다’라고 옮겼습니다.
theological_decisions:
- issue: 왕관과 왕비 책봉의 서술 방식
  chosen_reading: 서술적 사실 진술로 유지하고, 과장 없이 왕의 행위를 순차적으로 묘사했습니다.
  alternative_readings:
  - 상징적으로 왕권의 이전을 강조하는 해석
  - 궁정 예식의 강조를 더 부각하는 번역
  rationale: 본문은 에스더의 승진 과정을 직접 서술하므로, 본문이 말하는 수준을 넘지 않도록 사실 진술 중심으로 옮겼습니다.
  doctrine_reference: 본문 서술의 절제와 역사 서술의 평이성
