id: EST.2.16
reference: Esther 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
  footnotes:
  - marker: a
    text: Or 'was brought to King Ahasuerus.' The Hebrew verb is passive, emphasizing that Esther was acted upon.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the month Tebeth,' the Babylonian name for the tenth month.
    reason: cultural_note
translation:
  language: ko
  text: 이렇게 에스더는 아하수에로 왕에게, 곧 그의 왕궁으로, 열째 달인 테벳 달에, 그의 통치 제칠년에 데려가졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려가졌습니다’는 히브리어 수동형의 뉘앙스를 살린 번역입니다. 대안으로 ‘데려갔습니다’도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘테벳’은 바빌로니아식 열째 달 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  english_pob_choice: was taken
  chosen_korean: 데려가졌습니다
  alternatives_korean:
  - 끌려갔습니다
  - 데려감을 받았습니다
  lexicon: HALOT
  rationale: 히필/니팔 계열의 수동적 사건성을 살려, 에스더가 스스로 나아간 것이 아니라 타자에 의해 옮겨졌다는 점을 드러냅니다.
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: to King Ahasuerus
  chosen_korean: 아하수에로 왕에게
  alternatives_korean:
  - 왕 아하수에로에게
  - 아하수에로 왕 앞으로
  lexicon: HALOT
  rationale: 히브리어의 목적지 표지 אֶל을 자연스럽게 살려, 왕에게 이르렀다는 방향성을 유지했습니다.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  english_pob_choice: into his royal palace
  chosen_korean: 그의 왕궁으로
  alternatives_korean:
  - 그의 왕실로
  - 그의 왕권의 집으로
  lexicon: HALOT
  rationale: 직역하면 '그의 왕권의 집'이지만, 문맥상 왕의 거처를 가리키므로 현대 한국어에서 이해되는 '왕궁'으로 옮기되 소유 관계는 유지했습니다.
- source_word: חֹדֶשׁ טֵבֵת
  english_pob_choice: the month Tebeth
  chosen_korean: 테벳 달
  alternatives_korean:
  - 테벳 월
  - 테벳
  lexicon: HALOT
  rationale: 달 이름은 음역을 유지하고, 시간 표현으로서 '달'을 붙여 한국어 독자에게 달력 항목임을 분명히 했습니다.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  english_pob_choice: in the seventh year of his reign
  chosen_korean: 그의 통치 제칠년에
  alternatives_korean:
  - 그의 치세 제칠년에
  - 그의 왕위 제칠년에
  lexicon: HALOT
  rationale: מלכות의 연대 표준식은 'reign'에 해당하므로 '통치'를 택해 연대 공식의 성격을 살렸습니다.
theological_decisions:
- issue: 서술의 수동성
  chosen_reading: 에스더가 사건의 주체라기보다 타자에 의해 옮겨지는 대상으로 제시된다고 보았습니다.
  alternative_readings:
  - 중립적으로 '갔습니다'로 옮겨 주체성을 완화하는 읽기
  - 단순한 왕실 입궁 절차로 평준화하는 읽기
  rationale: הִנֵּה형 사건이 아니라 니팔 수동 서술이므로, 본문이 강조하는 비자발성과 권력 비대칭을 보존하는 것이 적절합니다.
  doctrine_reference: '서술 신학: 본문이 드러내는 인간 행위와 권력의 비대칭성'
