  source_fidelity: 히브리어는 에스더가 자신의 ‘백성’(עַמָּהּ)과 ‘모ולדת’(מוֹלַדְתָּהּ)를 알리지 않았으며, 모르드개가 에스더에게 그렇게 하지 말라고 명령했음을 말합니다. 초안의 기본 의미는 보존하지만, ‘가족 계통’은 현대 표준어에서 다소 부자연스럽고, ‘그에게’는 지시 대상이 잠시 모호합니다.
  naturalness: ‘자기 가족 계통’보다 ‘자신의 민족과 가문’이 현대의 격식 있는 한국어에서 더 자연스럽습니다. 또한 마지막 절에서 ‘에스더에게’와 앞서 언급한 내용을 반복하여 지시어 ‘그것’의 범위를 분명히 하는 편이 좋습니다.
