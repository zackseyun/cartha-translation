id: EST.2.10
reference: Esther 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא הִגִּ֣ידָה אֶסְתֵּ֔ר אֶת עַמָּ֖/הּ וְ/אֶת מֽוֹלַדְתָּ֑/הּ כִּ֧י מָרְדֳּכַ֛י צִוָּ֥ה עָלֶ֖י/הָ אֲשֶׁ֥ר לֹא תַגִּֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
  footnotes:
  - marker: a
    text: Or 'her ancestry' for 'her family line.' The Hebrew term can refer to kinship, lineage, or place of origin; here it most likely refers to Esther's family descent.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더는 자기 백성과 자기 가족 계통[a]을 밝히지 않았습니다. 이는 모르드개가 그에게 그것을 밝히지 말라고 명령했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족’으로도 옮길 수 있습니다. 히브리어는 혈통, 친족 관계, 출신 계통을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הִגִּידָה
  english_pob_choice: had not disclosed
  chosen_korean: 밝히지 않았습니다
  alternatives_korean:
  - 알리지 않았습니다
  - 드러내지 않았습니다
  lexicon: HALOT
  rationale: 히필 נגד는 ‘알리다/밝히다’의 뜻이므로, 숨긴 신분을 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: עַמָּהּ
  english_pob_choice: her people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 자기 민족
  - 자기 사람들
  lexicon: HALOT
  rationale: עַם은 단순한 시민권보다 혈통적·공동체적 소속을 가리키므로 ‘백성’이 가장 넓고 무난합니다.
- source_word: מוֹלַדְתָּהּ
  english_pob_choice: her kindred / family line
  chosen_korean: 가족 계통
  alternatives_korean:
  - 가문
  - 출신 계통
  - 친족
  lexicon: HALOT
  rationale: מוֹלֶדֶת는 출생·계통·혈통을 함께 담을 수 있어, ‘백성’과 중복되지 않도록 ‘가족 계통’으로 옮겼습니다.
- source_word: צִוָּה עָלֶיהָ ... לֹא תַגִּיד
  english_pob_choice: had commanded her not to disclose it
  chosen_korean: 그에게 그것을 밝히지 말라고 명령했기 때문입니다
  alternatives_korean:
  - 그에게 그것을 알리지 말라고 명령했기 때문입니다
  - 그에게 그것을 드러내지 말라고 명령했기 때문입니다
  lexicon: HALOT
  rationale: צוה는 강한 명령을 뜻하므로 ‘명령했습니다’로 유지했고, 부정 부정사절은 한국어스럽게 ‘~말라고’로 처리했습니다.
theological_decisions:
- issue: 에스더가 신분을 숨기는 서술의 뉘앙스
  chosen_reading: 본문의 초점은 지혜로운 은폐가 아니라 모르드개의 명령에 따른 미공개에 있습니다.
  alternative_readings:
  - 정체를 전략적으로 숨긴 것
  - 위장한 것
  rationale: 히브리어는 단순히 ‘알리지 않았다’고 말하며, 동기의 평가를 덧붙이지 않습니다.
  doctrine_reference: 서사 문맥 주해
