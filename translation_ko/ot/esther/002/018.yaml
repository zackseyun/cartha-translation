  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֜לֶךְ מִשְׁתֶּ֣ה גָד֗וֹל לְ/כָל שָׂרָי/ו֙ וַ/עֲבָדָ֔י/ו אֵ֖ת מִשְׁתֵּ֣ה אֶסְתֵּ֑ר וַ/הֲנָחָ֤ה לַ/מְּדִינוֹת֙ עָשָׂ֔ה וַ/יִּתֵּ֥ן מַשְׂאֵ֖ת כְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
  footnotes:
  - marker: a
    text: Or 'he made a holiday for the provinces' or 'he granted remission to the provinces.' The Hebrew term can refer broadly to relief, rest, or remission.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to the hand of the king,' an idiom for generosity or measure fitting a king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 그의 모든 고관들과 신하들을 위하여 큰 잔치를 베풀었는데, 곧 에스더의 잔치였습니다. 그는 각 지방에 휴식을 주고, 왕의 너그러움에 따라 선물을 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '지방들에 휴일을 선포했다' 혹은 '지방들에 면제를 베풀었다.' 히브리어 용어는 넓게 휴식, 안식, 면제를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 '왕의 손에 따라'입니다. 이는 왕의 후함이나 분량에 맞는 베풂을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדֹל
  english_pob_choice: a great banquet
  chosen_korean: 큰 잔치
  alternatives_korean:
  - 큰 연회
  - 큰 잔치 자리
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 왕궁 맥락에서 단순한 식사가 아니라 잔치/연회를 가리키므로, 현대 한국어에서는 '큰 잔치'가 가장 자연스럽고 직역에도 가깝습니다.
- source_word: שָׂרָיו וַעֲבָדָיו
  english_pob_choice: all his officials and servants
  chosen_korean: 그의 모든 고관들과 신하들
  alternatives_korean:
  - 그의 모든 관리들과 종들
  - 그의 모든 대신들과 시종들
  lexicon: HALOT
  rationale: שָׂרִים은 페르시아 궁정 문맥에서 고위 관리들을 뜻하므로 '고관들'이 적절하고, עֲבָדִים은 왕의 휘하 사람들을 넓게 가리켜 '신하들'이 무난합니다.
- source_word: וַהֲנָחָה
  english_pob_choice: he granted relief to the provinces
  chosen_korean: 각 지방에 휴식을 주고
  alternatives_korean:
  - 각 지방에 휴식을 허락하고
  - 각 지방에 안식을 주고
  - 각 지방에 면제를 주고
  lexicon: HALOT
  rationale: הֲנָחָה는 휴식, 완화, 면제의 폭넓은 의미를 가지며, 본문에서는 지방들에 대한 공적 경감 조치로 이해되므로 '휴식을 주다'가 영어 POB의 'relief'를 가장 잘 반영합니다.
- source_word: מַשְׂאֵת כְּיַד הַמֶּלֶךְ
  english_pob_choice: gave gifts according to the king’s bounty
  chosen_korean: 왕의 너그러움에 따라 선물을 주었습니다
  alternatives_korean:
  - 왕의 손에 따라 선물을 주었습니다
  - 왕의 손길에 따라 선물을 주었습니다
  - 왕의 역량에 맞게 선물을 주었습니다
  lexicon: HALOT
  rationale: כְּיַד הַמֶּלֶךְ는 문자적으로 '왕의 손에 따라'이지만, 관용적으로 왕의 베풂의 크기와 후함을 뜻하므로 '왕의 너그러움에 따라'가 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: וַהֲנָחָה의 의미 범위
  chosen_reading: '''휴식을 주다''로 옮겨, 단순한 행정적 면제보다 공적 경감과 안식의 폭넓은 의미를 열어 두었습니다.'
  alternative_readings:
  - '''면제를 주다'''
  - '''안식을 주다'''
  - '''휴일을 선포하다'''
  rationale: 이 표현은 문자적으로 단일한 제도명을 확정하기보다, 본문이 허용하는 넓은 의미를 보존하는 것이 더 정확합니다.
  doctrine_reference: 문맥 우선 원칙; 절기/행정 조치의 비특정성 보존
- issue: כְיַד הַמֶּלֶךְ의 관용성
  chosen_reading: '''왕의 너그러움에 따라''로 번역해 왕의 풍성한 베풂을 드러냈습니다.'
  alternative_readings:
  - '''왕의 손에 따라'''
  - '''왕의 능력에 따라'''
  - '''왕의 분량에 따라'''
  rationale: 히브리어 관용구의 직역은 한국어에서 의미가 불투명하므로, 원문의 의도인 왕의 후한 베풂을 드러내는 방향이 더 적합합니다.
  doctrine_reference: 관용구의 의미 등가 번역
