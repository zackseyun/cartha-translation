  naturalness: '''에스더의 잔치''는 히브리어 연계 관계를 보존하며 자연스럽습니다. ''각 지방에 휴식을 주고''는 현대 한국어 용법상 다소 부자연스럽기 때문에 ''각 지방에 경감을 베풀고''로 고치는 것이 좋습니다. 각주 표지도 해당 표현 바로 뒤에 두어 독자가 대상을 명확히 알 수 있게 했습니다.'
