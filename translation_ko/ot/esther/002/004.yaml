source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֗ה אֲשֶׁ֤ר תִּיטַב֙ בְּ/עֵינֵ֣י הַ/מֶּ֔לֶךְ תִּמְלֹ֖ךְ תַּ֣חַת וַשְׁתִּ֑י וַ/יִּיטַ֧ב הַ/דָּבָ֛ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וַ/יַּ֥עַשׂ כֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
  footnotes:
  - marker: a
    text: Or 'finds favor in the king's eyes.' The Hebrew idiom literally says 'is good in the eyes of the king.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'reign instead of Vashti.'
    reason: lexical_alternative
  - marker: c
    text: Or 'The matter seemed good to the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 마음에 드는 젊은 여인이 와스디를 대신하여 왕후가 되게 하십시오[a][b]. 그 제안이 왕의 마음에 들었고[c], 왕은 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 눈에 좋게 보이는’. 히브리어 관용구는 문자적으로 ‘왕의 눈에 좋다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘와스디를 대신하여 다스리게 하십시오’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 일이 왕에게 좋게 여겨졌다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  english_pob_choice: the young woman
  chosen_korean: 젊은 여인
  alternatives_korean:
  - 젊은 여자
  - 소녀
  - 처녀
  lexicon: HALOT
  rationale: נַעֲרָה는 나이가 어린 여성을 가리키지만, 현대 한국어에서는 ‘젊은 여인’이 자연스럽고 ‘소녀’보다 연령 뉘앙스를 덜 낮게 유지합니다.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  english_pob_choice: who pleases the king
  chosen_korean: 왕이 좋게 여기시는
  alternatives_korean:
  - 왕의 눈에 좋게 보이는
  - 왕의 눈에 은혜를 입는
  - 왕을 기쁘게 하는
  lexicon: HALOT
  rationale: ‘좋다/좋게 여기다’라는 이디엄을 살려, ‘왕의 눈에’라는 히브리어 관용구의 판단·호감 의미를 직접적으로 옮겼습니다.
- source_word: תִּמְלֹךְ
  english_pob_choice: become queen
  chosen_korean: 왕후가 되게 하십시오
  alternatives_korean:
  - 통치하게 하십시오
  - 여왕이 되게 하십시오
  - 왕후로 삼으십시오
  lexicon: HALOT
  rationale: 문맥상 왕위 통치 행위보다 와스디를 대신할 왕비 선출을 뜻하므로, 한국어에서는 역할을 분명히 드러내는 ‘왕후가 되게 하십시오’가 가장 자연스럽습니다.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  english_pob_choice: The proposal pleased the king
  chosen_korean: 이 말이 왕의 눈에 좋게 여겨졌고
  alternatives_korean:
  - 그 제안이 왕을 기쁘게 했고
  - 그 일이 왕의 눈에 좋게 보였고
  - 그 제안이 왕에게 좋게 여겨졌고
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘말/제안/일’의 뜻이 가능하지만, 앞선 권고를 가리키므로 ‘이 말’로 처리해 문맥 연결을 살렸습니다.
theological_decisions:
- issue: תִּמְלֹךְ의 의미를 ‘통치하다’로 직역할지, 선출된 왕후의 자리를 드러낼지
  chosen_reading: 왕후가 되게 하십시오
  alternative_readings:
  - 통치하게 하십시오
  - 왕후로 삼으십시오
  rationale: 본문은 왕권 행사 자체보다 와스디를 대신할 여성의 지위를 말하므로, 독자가 오해하지 않도록 왕후라는 자리의 의미를 명시했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
- issue: 히브리어 관용구 ‘왕의 눈에 좋다’를 어떻게 처리할지
  chosen_reading: 왕이 좋게 여기시는
  alternative_readings:
  - 왕의 눈에 좋게 보이는
  - 왕에게 호감이 가는
  rationale: 왕의 주관적 판단과 호의를 함께 보존하기 위해 관용구를 직역에 가깝게 옮겼습니다.
  doctrine_reference: 문맥적·수사적 충실성
