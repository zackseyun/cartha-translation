id: EST.2.23
reference: Esther 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבֻקַּ֤שׁ הַ/דָּבָר֙ וַ/יִּמָּצֵ֔א וַ/יִּתָּל֥וּ שְׁנֵי/הֶ֖ם עַל עֵ֑ץ וַ/יִּכָּתֵ֗ב בְּ/סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
  footnotes:
  - marker: a
    text: Or 'were impaled on a tree/stake.' The Hebrew says literally 'were hanged on a tree,' but the exact Persian method of execution may have involved impalement or public suspension.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 조사되어 사실로 밝혀지자, 두 사람 모두 나무에 매달렸고, 그 일은 왕 앞에서 연대기 책에 기록되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나무나 말뚝에 꿰어 세워졌다.’ 히브리어는 문자적으로 ‘나무에 매달렸다’고 말합니다. 그러나 정확한 페르시아식 처형 방식은 꿰어 세우는 것이었거나 공개적으로 매다는 것이었을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  english_pob_choice: When the matter was investigated
  chosen_korean: 그 일이 조사되어
  alternatives_korean:
  - 그 일이 수소문되어
  - 그 일이 탐문되어
  lexicon: HALOT
  rationale: בקש의 수동형은 보고된 사건을 공식적으로 확인하는 조사 과정을 가리키므로, 현대 한국어의 공문서체에 맞는 ‘조사되다’가 가장 자연스럽습니다.
- source_word: וַיִּמָּצֵא
  english_pob_choice: and found to be so
  chosen_korean: 사실로 밝혀지자
  alternatives_korean:
  - 그렇게 판명되자
  - 그렇다는 것이 드러나자
  lexicon: HALOT
  rationale: מצא의 결과 의미를 살려, 단순히 ‘발견되다’보다 혐의가 사실로 확인되었음을 분명히 했습니다.
- source_word: וַיִּתָּלוּ שְׁנֵיהֶם עַל עֵץ
  english_pob_choice: both of them were hanged on a tree
  chosen_korean: 두 사람은 나무에 달렸고
  alternatives_korean:
  - 두 사람은 나무에 매달렸고
  - 두 사람은 나무에 달려 처형되었고
  lexicon: HALOT
  rationale: תלה는 기본적으로 ‘달다/매달다’의 뜻이므로 이를 직접 반영했습니다. 한국어 ‘달리다’는 고문형 처형의 공적 노출을 비교적 중립적으로 옮기며, 본문이 더 구체적인 집행 방식을 명시하지 않는 점도 보존합니다.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: in the book of the chronicles
  chosen_korean: 연대기 책에
  alternatives_korean:
  - 역대 기록에
  - 사건 기록 책에
  lexicon: HALOT
  rationale: 관영 기록을 가리키는 상투구를 한국어로는 ‘연대기 책’으로 옮겨 공식 기록의 뉘앙스를 유지했습니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: in the presence of the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 면전에서
  - 왕 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·법정적 의미를 살려, 궁정 문맥에서 자연스러운 ‘왕 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 처형 방식의 구체화
  chosen_reading: 본문은 우선 ‘나무에 달림’을 그대로 반영하고, 실행 방식의 더 구체적인 가능성은 본문 안에 넣지 않았습니다.
  alternative_readings:
  - ‘나무에 매달려 처형되다’
  - ‘말뚝에 꿰어지다’
  rationale: 히브리어 동사 תלה와 ‘나무’는 문면상 ‘달다/달리다’가 직접적이므로, 추정되는 페르시아식 집행 방식을 본문으로 단정하지 않고 영어 POB의 주석 수준에만 해당하는 여지를 남겼습니다.
  doctrine_reference: 본문 충실성과 번역 투명성 원칙
