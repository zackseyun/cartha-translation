id: EST.8.14
reference: Esther 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/רָצִ֞ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים יָֽצְא֛וּ מְבֹהָלִ֥ים וּ/דְחוּפִ֖ים בִּ/דְבַ֣ר הַ/מֶּ֑לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
  footnotes:
  - marker: a
    text: Or 'mounted on the steeds, the royal stud horses'; the Hebrew terms for the animals are rare and their precise identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 공문을 전하는 역마들이 왕의 준마들을 타고, 왕의 명령에 따라 급히 재촉되어 나갔으며, 칙령은 수산 궁성에서 공포되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 말 이름은 희귀하여, 정확한 동물 분류는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the couriers
  chosen_korean: 공문을 전하는 역마들
  alternatives_korean:
  - 전령들
  - 달리는 사람들
  - 사자들
  lexicon: HALOT
  rationale: 페르시아 제국의 행정 문맥에서 단순한 ‘달리는 자’보다 공문 전달 기능이 드러나야 하므로, 관용적으로 ‘공문을 전하는 역마들’로 옮겼습니다.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  english_pob_choice: mounted on the royal steeds
  chosen_korean: 왕의 준마들을 타고
  alternatives_korean:
  - 왕의 말들을 타고
  - 왕실 역마를 타고
  - 왕의 빠른 말들을 타고
  lexicon: HALOT
  rationale: 희귀한 동물 명칭들의 정확한 분류가 불확실하므로, 왕실의 빠른 수송 말이라는 기능을 살리되 과도한 특정화를 피해 ‘왕의 준마들’로 처리했습니다.
- source_word: מְבֹהָלִים וּדְחוּפִים
  english_pob_choice: hastened and pressed on
  chosen_korean: 급히 재촉되어
  alternatives_korean:
  - 서둘러
  - 분주히 몰려
  - 재촉을 받아
  lexicon: HALOT
  rationale: 두 분사형이 속도와 외적 압박을 함께 나타내므로, 한국어에서도 ‘급히’와 ‘재촉되어’를 결합해 긴박성과 수동적 압력을 함께 살렸습니다.
- source_word: בִּדְבַר הַמֶּלֶךְ
  english_pob_choice: by the king’s command
  chosen_korean: 왕의 명령에 따라
  alternatives_korean:
  - 왕의 말에 따라
  - 왕의 칙명으로
  - 왕의 명으로
  lexicon: HALOT
  rationale: דבר는 여기서 권위 있는 왕령/명령을 뜻하므로, 자연스럽고 행정적인 한국어인 ‘왕의 명령에 따라’로 옮겼습니다.
- source_word: וְהַדָּת נִתְּנָה
  english_pob_choice: the decree was issued
  chosen_korean: 칙령은 공포되었습니다
  alternatives_korean:
  - 법령은 내려졌습니다
  - 조서는 반포되었습니다
  - 명령은 주어졌습니다
  lexicon: HALOT
  rationale: Esther서의 דת는 제국의 공식 칙령을 가리키므로 ‘칙령’이 적절하며, נִתְּנָה는 법적 문맥에서 ‘공포되다’가 가장 자연스럽습니다.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  english_pob_choice: in Susa the citadel
  chosen_korean: 수산 궁성에서
  alternatives_korean:
  - 수산의 성에서
  - 수산 성채에서
  - 수산 궁궐에서
  lexicon: HALOT
  rationale: הַבִּירָה는 단순한 도시명이 아니라 왕실 중심지/성채를 뜻하므로, 관용적이면서도 문맥에 맞는 ‘궁성’으로 옮겼습니다.
theological_decisions:
- issue: 제국 칙령의 공적 성격을 어떻게 드러낼지
  chosen_reading: ‘칙령은 공포되었습니다’로 번역해, 왕의 사적인 발언이 아니라 제국 행정 문서의 공식 발표임을 분명히 했습니다.
  alternative_readings:
  - ‘법령은 내려졌습니다’
  - ‘조서는 반포되었습니다’
  rationale: 본문은 단순 전달이 아니라 공식 공포의 장면이므로, 행정적·공적 성격을 한국어로 분명히 해야 합니다.
  doctrine_reference: 성경 번역의 역사서/서사문 공적 문체 일관성
