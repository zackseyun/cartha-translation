  lexicon: HALOT
  rationale: 희귀한 동물 명칭들의 정확한 분류가 불확실하므로, 왕실의 빠른 수송 말이라는 기능을 살리되 과도한 특정화를 피해 ‘왕의 준마들’로 처리했습니다.
- source_word: מְבֹהָלִים וּדְחוּפִים
  english_pob_choice: hastened and pressed on
  chosen_korean: 급히 재촉되어
  alternatives_korean:
  - 서둘러
  - 분주히 몰려
