translation:
  language: ko
  text: 전령들은 왕실의 준마들[a]을 타고 왕의 명령에 따라 급히 재촉받아 나갔으며, 그 칙령은 수산 성채에서 공포되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 동물 명칭은 희귀하여 정확한 종류와 관계가 확실하지 않습니다. 달리 ‘왕실의 말들, 곧 아하스다라님’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the couriers
  chosen_korean: 공문을 전하는 역마들
  alternatives_korean:
