base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
  footnotes:
  - marker: a
    text: Or 'came out from before the king.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'blue' may refer to a blue-purple royal dye.
    reason: lexical_alternative
  - marker: c
    text: Or 'a great golden crown.'
    reason: lexical_alternative
  - marker: d
    text: The term rendered 'robe' can also refer to a mantle or wrapping garment.
    reason: lexical_alternative
  - marker: e
    text: Or 'cried out and was glad.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모르드개는 왕 앞에서 나와, 청색[a]과 흰색의 왕복을 입고 큰 금관을 쓰고 세마포와 자주색으로 된 겉옷[b]을 걸쳤습니다. 수산 성읍은 환성을 올리고 기뻐했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청색’으로 옮긴 히브리어 תְּכֵלֶת은 푸른빛 자주색의 왕실 염료를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겉옷’으로 옮긴 히브리어 תַכְרִיךְ는 몸을 감싸는 의복이나 망토를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  english_pob_choice: went out from the presence of the king
  chosen_korean: 왕 앞에서 나와
  alternatives_korean:
  - 왕의 앞에서 나와
  - 왕의 presence에서 나와
  - 왕을 알현하고 물러나
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 이동과 궁정적 퇴장을 함께 나타내므로, 자연스러운 한국어로 '왕 앞에서 나와'라고 옮겨 왕 앞이라는 관계와 '나오다'의 동작을 모두 살렸습니다.
- source_word: לְבוּשׁ מַלְכוּת תְּכֵלֶת וָחוּר
  english_pob_choice: royal clothing of blue and white
  chosen_korean: 자색과 흰색의 왕복
  alternatives_korean:
  - 푸른색과 흰색의 왕복
  - 청자색과 흰색의 왕복
  - 왕의 옷
  lexicon: HALOT
  rationale: תְּכֵלֶת은 단순한 파랑보다 위엄 있는 청자색/자색 계열을 가리킬 수 있어, 본문 주석을 반영해 '자색과 흰색'으로 두 색채를 살렸고, לְבוּשׁ מַלְכוּת는 궁정 의복의 성격을 드러내는 '왕복'으로 옮겼습니다.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  english_pob_choice: a large crown of gold
  chosen_korean: 큰 금관
  alternatives_korean:
  - 크고 화려한 금관
  - 큰 황금관
  - 큰 금으로 된 관
  lexicon: HALOT
  rationale: עֲטֶרֶת은 머리에 쓰는 관을 뜻하므로 '금관'으로 간명하게 옮기되, גְּדוֹלָה의 크기와 위엄은 '큰'으로 살렸습니다.
- source_word: תַכְרִיךְ בּוּץ וְאַרְגָּמָן
  english_pob_choice: a robe of fine linen and purple
  chosen_korean: 세마포와 자색 옷
  alternatives_korean:
  - 고운 베와 자색 옷
  - 세마포와 자주색 옷
  - 고운 리넨과 자색 옷
  lexicon: HALOT
  rationale: תַכְרִיךְ는 두루마기처럼 감싸는 겉옷의 성격을 가지므로 '옷'으로 풀어 자연스럽게 처리했고, בּוּץ는 '세마포'로, אַרְגָּמָן은 궁정적 색채를 살려 '자색'으로 옮겼습니다.
- source_word: וְהָעִיר שׁוּשָׁן צָהֲלָה וְשָׂמֵחָה
  english_pob_choice: and the city of Susa shouted and rejoiced
  chosen_korean: 수산 성읍은 환성을 올리며 기뻐했습니다
  alternatives_korean:
  - 수산 성읍은 외치며 기뻐했습니다
  - 수산 성읍은 환호하며 즐거워했습니다
  - 수산 성읍은 소리 높여 기뻐했습니다
  lexicon: HALOT
  rationale: צָהֲלָה와 שָׂמֵחָה는 각각 소리 내는 기쁨과 내적인 환희를 함께 나타내므로, '환성을 올리며 기뻐했습니다'로 두 동작의 뉘앙스를 구분해 반영했습니다.
theological_decisions:
- issue: 공적 승리의 묘사에서 궁정 의복의 위상과 도시의 반응을 어떻게 드러낼지
  chosen_reading: 모르드개가 왕의 허락 아래 왕복과 관을 갖춘 뒤 수산 성읍 전체가 환호하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 개인적 영예의 묘사로 축소하는 읽기
  - 도시 반응을 과장된 수사로 완화하는 읽기
  rationale: 본문은 개인의 승진이 아니라 왕 앞에서 나온 모르드개의 새 위상과 이에 대한 공동체적 환희를 함께 제시하므로, 궁정적 위엄과 도시의 집단적 기쁨을 모두 보존했습니다.
  doctrine_reference: 서사 본문 해석 원칙
