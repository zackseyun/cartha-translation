id: EST.8.8
reference: Esther 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
  footnotes:
  - marker: a
    text: Or 'as you see fit.' The Hebrew idiom is literally 'as is good in your eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'cannot be reversed.' The Hebrew expression means that such a royal document cannot be recalled or rescinded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 당신들은 유다인들에 관하여 여러분의 눈에 좋게 보이는 대로 왕의 이름으로 쓰고, 왕의 인장 반지로 도장하십시오. 왕의 이름으로 쓰고 왕의 인장 반지로 도장한 문서는 되돌릴 수 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분의 눈에 좋은 대로’입니다.
    reason: source_note
  - marker: b
    text: ‘인장 반지’는 공식 문서를 봉인하는 왕의 반지를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러므로 당신들은
  alternatives_korean:
  - 그러나 당신들은
  - 그리고 당신들은
  lexicon: WLC
  rationale: 앞 절의 취소 불가능한 조서와 대비되는 허용 명령을 자연스럽게 드러내기 위해 연결어를 넣되, 한국어에서는 ‘그러므로’가 행정적 지시의 이어짐을 가장 자연스럽게 받쳐 줍니다.
- source_word: כִּתְבוּ
  english_pob_choice: may write
  chosen_korean: 쓰고
  alternatives_korean:
  - 쓰십시오
  - 기록하십시오
  lexicon: WLC
  rationale: 문맥상 왕의 허가 아래 작성하라는 지시이므로 명령형의 힘을 살리되, 한국어에서는 뒤의 동사들도 같은 구조로 이어지는 행정 문체를 유지했습니다.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  english_pob_choice: as seems good in your eyes
  chosen_korean: 여러분의 눈에 좋게 보이는 대로
  alternatives_korean:
  - 여러분이 좋다고 여기는 대로
  - 여러분이 보기 좋다고 생각하는 대로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘눈’ 이미지를 살려 직역 성격을 유지하면서, 한국어에서도 판단·판정의 기준이라는 뜻이 분명하게 드러나도록 옮겼습니다.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  english_pob_choice: with the king’s signet ring
  chosen_korean: 왕의 인장 반지로 도장하십시오
  alternatives_korean:
  - 왕의 도장 반지로 봉인하십시오
  - 왕의 인장으로 봉인하십시오
  lexicon: HALOT
  rationale: 행정 문서의 봉인 도구를 가리키므로 ‘반지’의 물리적 형태와 ‘인장’의 기능을 함께 살렸고, 동사도 공문서 처리에 맞는 ‘도장하다’로 풀었습니다.
- source_word: אֵין לְהָשִׁיב
  english_pob_choice: cannot be revoked
  chosen_korean: 되돌릴 수 없기 때문입니다
  alternatives_korean:
  - 철회할 수 없기 때문입니다
  - 취소할 수 없기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘다시 돌려보낼 수 없음’이므로, 왕의 조서를 되돌릴 수 없다는 뜻을 가장 직접적으로 살렸습니다.
theological_decisions:
- issue: 왕의 법적 권위와 조서의 불가역성
  chosen_reading: 왕의 이름과 인장 반지가 문서에 부여하는 공식 권위를 그대로 살려, 조서가 인간적으로는 되돌릴 수 없는 왕권의 효력을 가진다는 점을 드러냈습니다.
  alternative_readings:
  - ‘왕의 권위로’처럼 의미를 풀어쓰는 방식
  - ‘봉인된 문서는 취소할 수 없다’로 단순화하는 방식
  rationale: 본문의 초점은 하나님의 직접 행위가 아니라 페르시아 왕권 아래서 작동하는 법적 절차이므로, 행정·법률적 뉘앙스를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
- issue: 문체의 합쇼체 유지
  chosen_reading: 서술과 지시를 현대 표준어 합쇼체로 유지하되, 직접 화법이 아닌 왕실 명령문이라는 점에 맞춰 정중한 행정 문체를 사용했습니다.
  alternative_readings:
  - 더 구어적인 지시문체
  - 전통적 성경체 어미
  rationale: 청중이 현대 독자로서 즉시 이해할 수 있도록 하면서도, 왕궁 조서의 격식을 보존하기 위한 선택입니다.
  doctrine_reference: 표준 한국어 가독성과 स्रोत 직결성
