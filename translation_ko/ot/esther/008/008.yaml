revisions:
- from: 그러므로 당신들은 유다인들에 관하여 여러분의 눈에 좋게 보이는 대로 왕의 이름으로 쓰고, 왕의 인장 반지로 도장하십시오. 왕의 이름으로 쓰고 왕의 인장 반지로 도장한 문서는 되돌릴 수 없기 때문입니다.[a][b]
  to: 그러나 여러분은 유다인들에 관하여 여러분이 좋다고 여기는 대로[a] 왕의 이름으로 쓰고, 왕의 인장 반지로[b] 봉인하십시오. 왕의 이름으로 쓰고 왕의 인장 반지로 봉인한 문서는 철회할 수 없기 때문입니다.
  rationale: 접속사를 대조 관계에 맞게 고치고, 히브리어의 ‘눈에 좋다’ 관용구를 한국어의 재량 표현으로 자연스럽게 옮겼습니다. 또한 호칭을 일관되게 하고, 왕의 반지로 문서를 공식화하는 행위를 ‘봉인하다’로 정확히 표현했습니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:01Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 וְאַתֶּם은 앞 문장의 불가역성과 대조되는 지시이므로 ‘그러므로’보다 ‘그러나’가 적절합니다. כַּטּוֹב בְּעֵינֵיכֶם은 판단·재량의 관용구로서 ‘눈에 좋게 보이는 대로’는 미적 인상을 암시할 수 있어 수정이 필요합니다. ‘봉인하다’와 ‘철회하다’는 각각 왕의 인장과 문서의 법적 불가역성을 정확히 전달합니다.
  naturalness: ‘당신들은’과 ‘여러분의’의 혼용은 지시 대상과 호칭의 일관성을 해칩니다. 현대 표준어 합쇼체에서는 ‘여러분은 … 쓰고 … 봉인하십시오’가 자연스럽고 격식 있는 왕실 지시문의 어조를 유지합니다.
  terminology: ‘유다인들’, ‘왕의 이름’, ‘인장 반지’, ‘봉인하다’는 본문의 행정·법률적 맥락에 적합합니다. אֵין לְהָשִׁיב은 문서의 철회·취소 불가를 뜻하므로 ‘철회할 수 없다’가 ‘되돌릴 수 없다’보다 한국어 법률 문맥에서 더 명료합니다.
  issues:
  - severity: medium
    issue: וְאַתֶּם을 ‘그러므로 당신들은’으로 옮김
    rationale: 문맥상 앞선 조서를 철회할 수 없다는 말에 대한 대안적 조치의 허용·지시이므로, 결과를 나타내는 ‘그러므로’가 아니라 대조를 나타내는 ‘그러나’가 원문의 담화 기능에 더 충실합니다.
  - severity: medium
    issue: ‘여러분의 눈에 좋게 보이는 대로’의 의미가 부정확함
    rationale: 히브리어 관용구는 미적으로 좋아 보인다는 뜻이 아니라 수신자들의 판단·재량에 따라 행동하라는 뜻입니다. ‘여러분이 좋다고 여기는 대로’가 자연스럽고 정확합니다.
  - severity: low
    issue: 호칭 혼용 및 ‘도장하십시오’의 부정확성
    rationale: ‘당신들’과 ‘여러분’의 혼용을 피해야 하며, signet ring으로 공식 문서를 처리하는 행위는 일반적인 ‘도장하다’보다 ‘봉인하다’가 정확합니다.
