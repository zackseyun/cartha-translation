source:
  edition: WLC
  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
  footnotes:
  - marker: a
    text: Or 'the annihilation of my people of birth' / 'my relatives.' The Hebrew מוֹלַדְתִּי can denote those of one's birth or kindred, not only a birthplace.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 어떻게 제 백성에게 닥칠 재앙을 보고 견딜 수 있겠습니까? 또 제가 어떻게 제 겨레의 멸망을 보고 견딜 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 겨레’로 옮긴 히브리어 מוֹלַדְתִּי는 출생을 함께한 사람들 또는 친족을 뜻할 수 있습니다. 문맥상 ‘제 출생지’ 자체보다는 그곳의 사람들, 곧 친족이나 동족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָכָה אוּכַל וְרָאִיתִי
  english_pob_choice: how could I bear to see
  chosen_korean: 제가 어떻게 …을 보고 견딜 수 있겠습니까
  alternatives_korean:
  - 제가 어떻게 …을 볼 수 있겠습니까
  - 제가 어떻게 …을 보고 참을 수 있겠습니까
  lexicon: HALOT
  rationale: 반문형 감탄의 뉘앙스를 살리기 위해 단순한 ‘볼 수 있겠습니까’보다 ‘보고 견딜 수 있겠습니까’로 옮겨, 실제로 목격해야 하는 고통을 드러냈습니다.
- source_word: בָּרָעָה
  english_pob_choice: the disaster
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 재난
  - 그 불행
  - 그 재앙과 화
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 백성에게 닥칠 환난/재난을 뜻하므로, 현대 한국어에서 자연스럽고 강한 ‘재앙’이 적절합니다.
- source_word: אֲשֶׁר יִמְצָא אֶת עַמִּי
  english_pob_choice: that will come upon my people
  chosen_korean: 제 백성에게 닥치는
  alternatives_korean:
  - 제 백성에게 임하는
  - 제 백성에게 미치는
  lexicon: HALOT
  rationale: 히브리어 ‘찾다/만나다’의 관용적 의미를 살려, 사건이 사람에게 ‘닥친다’는 자연스러운 한국어로 옮겼습니다.
- source_word: בְּאָבְדַן מוֹלַדְתִּי
  english_pob_choice: the destruction of my kindred
  chosen_korean: 제 친족의 멸망
  alternatives_korean:
  - 제 혈족의 멸절
  - 제가 난 곳의 멸망
  - 제 가족의 파멸
  lexicon: HALOT
  rationale: מוֹלַדְתִּי는 단순한 출생지보다 출생과 연관된 친족/혈족을 가리킬 수 있으므로, 그 관계성을 살린 ‘친족’으로 옮겼습니다.
theological_decisions:
- issue: 에스더의 수사적 질문과 자기 동일시
  chosen_reading: 에스더가 ‘제 백성’과 ‘제 친족’의 멸망을 자기 일처럼 말하는 긴박한 탄원을 유지했습니다.
  alternative_readings:
  - 더 평이하게 ‘그들의 재앙’을 말하는 번역
  - 감정을 약화시켜 단정문으로 옮기는 번역
  rationale: 본문은 단순 정보 전달이 아니라 왕에게 호소하는 절박한 수사이므로, 반문 구조를 그대로 살려 독자가 긴장감을 느끼도록 했습니다.
  doctrine_reference: 본문 수사와 서사 맥락
