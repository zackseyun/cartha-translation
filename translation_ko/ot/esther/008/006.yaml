    rationale: ‘그 재앙을 제 백성에게 닥치는 것을’은 ‘재앙을’과 ‘…닥치는 것을’이 중복되어 문법적으로 어색합니다. 히브리어 אֲשֶׁר יִמְצָא אֶת־עַמִּי는 ‘내 백성에게 닥칠’이라는 관계절이므로 ‘제 백성에게 닥칠 재앙을’로 옮겨야 합니다.
