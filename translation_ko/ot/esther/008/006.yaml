    rationale: מוֹלַדְתִּי는 개인의 가까운 친족만이 아니라 출생을 함께한 사람들, 곧 겨레/동족의 범위도 나타낼 수 있습니다. ‘제 겨레’와 각주가 그 폭을 더 잘 보존합니다.
