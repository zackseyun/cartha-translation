  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: ko
  text: 그날에 아하수에로 왕은 하만, 곧 유대인들의 적의 집을 왕비 에스더에게 주었습니다. 모르드개는 에스더가 그가 자기에게 어떤 사람이었는지를 알려 주었기 때문에 왕 앞에 나아왔습니다.
  philosophy: formal
lexical_decisions:
- source_word: נָתַן ... אֶת בֵּית הָמָן
  english_pob_choice: gave ... the house of Haman
  chosen_korean: “하만의 집”을 “왕비 에스더에게 주었습니다”
  alternatives_korean:
  - “하만의 집을 넘겨주었습니다”
  - “하만의 재산을 에스더에게 주었습니다”
  lexicon: נתן
  rationale: 히브리어 동사 נָתַן은 단순한 소유권 이전을 가리키므로, 한국어도 구체적 보충 없이 ‘주었습니다’로 옮겨 서술의 직접성을 살렸습니다.
- source_word: צֹרֵר הַיהודיים
  english_pob_choice: the enemy of the Jews
  chosen_korean: “유대인들의 적”
  alternatives_korean:
  - “유대인들의 원수”
  - “유대인들을 대적하는 자”
  lexicon: צֹרֵר
  rationale: צֹרֵר는 적대자/원수의 의미를 가지므로, POB의 영어 선택을 반영하되 현대 한국어에서 자연스러운 “적”을 택했습니다.
- source_word: וּמָרְדֳּכַי בָּא לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: Mordecai came before the king
  chosen_korean: “모르드개는 ... 왕 앞에 나아왔습니다”
  alternatives_korean:
  - “모르드개가 왕 앞에 왔습니다”
  - “모르드개는 왕에게 나아갔습니다”
  lexicon: בוא + לפני
  rationale: לִפְנֵי הַמֶּלֶךְ는 단순히 ‘왔다’보다 공식적 접근을 드러내므로, 왕 앞에 ‘나아왔습니다’로 옮겨 궁정 문맥을 살렸습니다.
- source_word: כִּי הִגִּידָה ... מַה הוּא לָהּ
  english_pob_choice: because Esther had told what he was to her
  chosen_korean: “에스더가 그가 자기에게 어떤 사람이었는지를 알려 주었기 때문에”
  alternatives_korean:
  - “에스더가 그가 자기에게 무엇이었는지를 말해 주었기 때문에”
  - “에스더가 그가 자기에게 어떤 존재였는지를 밝혔기 때문에”
  lexicon: מה + היה
  rationale: מַה הוּא לָהּ는 관계의 성격을 묻는 표현이므로, 직역보다 의미를 분명히 하는 ‘어떤 사람이었는지’로 옮겨 오해를 줄였습니다.
theological_decisions:
- issue: 이 절에서의 왕권과 섭리의 표현
  chosen_reading: 에스더의 말을 근거로 왕이 하만의 집을 에스더에게 주고, 모르드개가 왕 앞으로 나아오는 전개를 그대로 서술형으로 옮겼습니다.
  alternative_readings:
  - 왕의 은혜를 더 강하게 드러내는 표현
  - 에스더의 중재를 강조하는 해석적 표현
  rationale: 본문은 사건의 결과를 간명하게 진술할 뿐이므로, 의미를 확대하지 않고 서술의 흐름을 보존하는 것이 적절합니다.
  doctrine_reference: Providence in Esther narrative; no explicit divine naming in v.1
