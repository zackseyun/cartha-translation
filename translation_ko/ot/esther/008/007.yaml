  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
  footnotes:
  - marker: a
    text: Hebrew 'on the tree.' Here it refers to the execution structure used for Haman; hence 'gallows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아하수에로 왕이 왕후 에스더와 유다인 모르드개에게 말했습니다. “보십시오, 내가 하만의 집을 에스더에게 주었습니다. 또 그가 유다인들에게 대항하여 손을 뻗쳤기 때문에, 그는 나무[a]에 매달렸습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나무’ 또는 ‘나무로 된 것’이라고 말합니다. 여기서는 하만을 매단 처형 구조물을 가리킬 수 있습니다.
    reason: lexical_alternative
