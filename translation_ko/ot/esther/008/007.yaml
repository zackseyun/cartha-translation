  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וּֽ/לְ/מָרְדֳּכַ֖י הַ/יְּהוּדִ֑י הִנֵּ֨ה בֵית הָמָ֜ן נָתַ֣תִּי לְ/אֶסְתֵּ֗ר וְ/אֹת/וֹ֙ תָּל֣וּ עַל הָ/עֵ֔ץ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ ב/יהודיים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
  footnotes:
  - marker: a
    text: Hebrew 'on the tree.' Here it refers to the execution structure used for Haman; hence 'gallows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아하수에로 왕이 왕후 에스더와 유다인 모르드개에게 말했습니다. “보십시오, 내가 하만의 집을 에스더에게 주었고, 그를 유다인들에게 손을 뻗쳤기 때문에 나무에 매달았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  english_pob_choice: King Ahasuerus
  chosen_korean: 아하수에로 왕
  alternatives_korean:
  - 아하수에로 왕이
  - 왕 아하수에로
  lexicon: HALOT
  rationale: 히브리어 어순보다 한국어 자연어 어순을 따르되, 왕호와 고유명을 함께 살렸습니다.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: to Queen Esther
  chosen_korean: 왕후 에스더
  alternatives_korean:
  - 에스더 왕후
  - 왕비 에스더
  lexicon: HALOT
  rationale: 히브리어의 왕후를 현대 한국어에서 자연스럽고 격식 있게 드러내기 위해 ‘왕후’를 선택했습니다.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  english_pob_choice: and to Mordecai the Jew
  chosen_korean: 유다인 모르드개
  alternatives_korean:
  - 유다 사람 모르드개
  - 모르드개 유다인
  lexicon: HALOT
  rationale: 에스더서의 ეთ닉 표지인 הַיְּהוּדִי를 ‘유다인’으로 옮겨 통상적 의미를 살렸습니다.
- source_word: עַל הָעֵץ
  english_pob_choice: on the gallows
  chosen_korean: 나무에 매달았습니다
  alternatives_korean:
  - 장대에 달았습니다
  - 나무에 달아 세웠습니다
  - 교수대에 매달았습니다
  lexicon: HALOT
  rationale: עֵץ의 문자적 ‘나무’와 실행 방식의 교수형을 함께 보존하되, 한국어 본문에서는 직역적이고 과도한 해석을 피했습니다.
- source_word: שָׁלַח יָדוֹ בַּיְּהוּדִים
  english_pob_choice: he stretched out his hand against the Jews
  chosen_korean: 유다인들에게 손을 뻗쳤기 때문에
  alternatives_korean:
  - 유다인들을 해치려 했기 때문에
  - 유다인들에게 손을 대었기 때문에
  - 유다인들에 대항하여 손을 뻗쳤기 때문에
  lexicon: HALOT
  rationale: 히브리어 관용구의 적대적 행위를 그대로 살리면서, 한국어에서는 원인절로 자연스럽게 풀었습니다.
theological_decisions:
- issue: עַל הָעֵץ의 형벌 방식 표현
  chosen_reading: ‘나무에 매달았습니다’로 옮겨, 본문의 문자적 표현을 유지하되 처형 도구의 구체적 형태는 본문 밖에서 과잉 규정하지 않았습니다.
  alternative_readings:
  - ‘장대에 달았습니다’
  - ‘교수대에 매달았습니다’
  - ‘나무에 달았습니다’
  rationale: 에스더서의 עֵץ는 문자적으로는 나무이지만 처형 도구를 가리킬 수 있어, 본문이 말하는 정도만 드러내는 번역이 적절합니다.
  doctrine_reference: 본문 해석상의 신학적 과잉 확정을 피하는 번역 원칙
- issue: 유다인에 대한 적대 행위의 표현
  chosen_reading: ‘손을 뻗쳤기 때문에’라는 관용구를 유지해, 왕의 발언 속 법정적·서사적 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘해치려 했기 때문에’
  - ‘대적했기 때문에’
  - ‘공격했기 때문에’
  rationale: 원문의 idiom을 완전히 평평하게 만들기보다, 독자가 적대 행위의 강도를 느끼도록 했습니다.
  doctrine_reference: 서사 텍스트의 관용구 보존 원칙
