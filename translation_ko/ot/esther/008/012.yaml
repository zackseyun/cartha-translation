  text: בְּ/י֣וֹם אֶחָ֔ד בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: ko
  text: 한 날에, 곧 아하수에로 왕의 모든 지방에서, 열두째 달 곧 아달월의 열셋째 날에였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/י֣וֹם אֶחָ֔ד
  english_pob_choice: on one day
  chosen_korean: 한 날에
  alternatives_korean:
  - 그날에
  - 하루에
  lexicon: HALOT
  rationale: בְּ + יוֹם의 시간표현을 자연스럽게 살리면서, אֶחָד의 수사성을 과하게 풀지 않고 간결하게 옮겼습니다.
- source_word: בְּ/כָל מְדִינ֖וֹת
  english_pob_choice: in all the provinces
  chosen_korean: 모든 지방에서
  alternatives_korean:
  - 모든 도에서
  - 모든 행정 구역에서
  lexicon: HALOT
  rationale: מְדִינוֹת는 제국의 행정 구역을 가리키므로, 한국어로는 '지방'이 가장 자연스럽고 역사적 문맥도 유지합니다.
- source_word: הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ
  english_pob_choice: of King Ahasuerus
  chosen_korean: 아하수에로 왕의
  alternatives_korean:
  - 아하수에로스 왕의
  - 왕 아하수에로의
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 '아하수에로'를 따르고, 속격 관계는 한국어 관용에 맞게 처리했습니다.
- source_word: בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר
  english_pob_choice: on the thirteenth day
  chosen_korean: 열셋째 날에
  alternatives_korean:
  - 열세째 날에
  - 열세 날에
  lexicon: HALOT
  rationale: 문맥상 날짜 표기이므로 순서수로 자연스럽게 옮겼고, 시간 부사격을 살리기 위해 '-에'를 붙였습니다.
- source_word: לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר
  english_pob_choice: of the twelfth month
  chosen_korean: 열두째 달
  alternatives_korean:
  - 열두 번째 달
  - 열두 달
  lexicon: HALOT
  rationale: '''of the twelfth month''의 달력 표기를 한국어 날짜 관용에 맞게 ''열두째 달''로 옮겼습니다.'
- source_word: הוּא חֹ֥דֶשׁ אֲדָֽר
  english_pob_choice: that is, the month Adar
  chosen_korean: 곧 아달월
  alternatives_korean:
  - 즉 아달월
  - 아달월
  lexicon: HALOT
  rationale: הוּא의 설명 기능을 '곧'으로 살려 앞의 달 이름을 풀어 주는 보충 설명으로 처리했고, חודש אדר는 익숙한 음역 '아달월'을 택했습니다.
