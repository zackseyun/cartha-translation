- from: 그리고 그녀가 말했습니다. "만일 왕에게 좋고, 내가 그 앞에서 은혜를 얻었으며, 이 일이 왕 앞에 합당하고, 내가 그의 눈에 좋게 보인다면, 함닷다의 아들 아각 사람 하만이 쓴 글, 곧 유다 사람들을 멸하려고 그가 쓴 글들을 되돌리도록 기록하게 해 주십시오. 그들은 왕의 모든 지방에 있습니다."[a][b]
  to: 그녀가 말했습니다. “만일 왕께서 좋게 여기시고, 제가 왕 앞에서 은총을 입었으며, 이 일이 왕 앞에 합당하고, 제가 왕께서 보시기에 좋다면, 함므다다의 아들 아각 사람 하만이 왕의 모든 지방에 있는 유다 사람들을 멸하려고 꾸며 쓴 편지들을 철회하도록 기록하게 해 주십시오.”[a][b]
