id: EST.8.5
reference: Esther 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
  footnotes:
  - marker: a
    text: Or 'to reverse the letters'; the Hebrew verb can mean 'to turn back' or 'to revoke' in this administrative context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the letters, the scheme of Haman'; the translation 'letters devised by Haman' makes explicit that the letters embodied Haman's plot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀가 말했습니다. "만일 왕에게 좋고, 내가 그 앞에서 은혜를 얻었으며, 이 일이 왕 앞에 합당하고, 내가 그의 눈에 좋게 보인다면, 함닷다의 아들 아각 사람 하만이 쓴 글, 곧 유다 사람들을 멸하려고 그가 쓴 글들을 되돌리도록 기록하게 해 주십시오. 그들은 왕의 모든 지방에 있습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew can mean ‘to turn back’ or ‘to revoke’; in this administrative context, the decree’s legal force is the focus.
    reason: lexical_alternative
  - marker: b
    text: Literally, ‘the letters, the scheme of Haman’; the wording keeps both the document and the plot behind it in view.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: If it seems good to the king
  chosen_korean: 왕에게 좋고
  alternatives_korean:
  - 왕에게 합당하고
  - 왕이 좋게 여기시고
  lexicon: HALOT
  rationale: 궁정 청원 공식어의 완곡한 판단 표현을 자연스러운 현대 한국어로 살려, 단순한 ‘좋습니다’보다 왕의 판단에 달린 조건임을 드러냈습니다.
- source_word: מָצָאתִי חֵן לְפָנָיו
  english_pob_choice: I have found favor before him
  chosen_korean: 내가 그 앞에서 은혜를 얻었으며
  alternatives_korean:
  - 내가 그 앞에서 호의를 얻었으며
  - 내가 그의 눈에 은혜를 얻었으며
  lexicon: HALOT
  rationale: חֵן의 핵심 의미인 ‘호의/은혜’를 보존하되, 청원 문맥에서의 관용구를 살려 ‘은혜를 얻다’로 옮겼습니다.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: and if the matter is proper before the king
  chosen_korean: 이 일이 왕 앞에 합당하고
  alternatives_korean:
  - 이 일이 왕 앞에 적절하고
  - 이 제안이 왕에게 받아들여질 만하고
  lexicon: HALOT
  rationale: כָשֵׁר의 ‘적합하다/합당하다’라는 뜻을 따라, 법정·궁정 맥락에 어울리는 ‘합당하다’를 택했습니다.
- source_word: לְהָשִׁיב אֶת הַסְּפָרִים
  english_pob_choice: to revoke the letters
  chosen_korean: 되돌리도록 기록하게 해 주십시오
  alternatives_korean:
  - 철회하도록 기록하게 해 주십시오
  - 번복하도록 기록하게 해 주십시오
  lexicon: HALOT
  rationale: הֵשִׁיב의 행정적 의미를 따라, 기존 왕명 문서를 무효화하는 뉘앙스를 ‘되돌리다’로 옮기되, 앞의 יִכָּתֵב과 함께 ‘기록하게 해 주십시오’로 한국어 청원체를 자연스럽게 구성했습니다.
- source_word: מַחֲשֶׁבֶת הָמָן
  english_pob_choice: letters devised by Haman
  chosen_korean: 함닷다의 아들 아각 사람 하만이 쓴 글
  alternatives_korean:
  - 하만의 계략이 담긴 글
  - 하만이 꾸민 계획
  lexicon: HALOT
  rationale: ‘글들’이 단순 문서가 아니라 하만의 계략을 담은 왕명문이라는 점을 살리되, 본문이 분명히 가리키는 ‘쓴 글’이라는 문서성을 유지했습니다.
- source_word: לְאַבֵּד אֶת הַיְּהוּדִים
  english_pob_choice: to destroy the Jews
  chosen_korean: 유다 사람들을 멸하려고
  alternatives_korean:
  - 유다 사람들을 죽이려고
  - 유다 사람들을 멸망시키려고
  lexicon: HALOT
  rationale: לְאַבֵּד의 강한 파괴 의미를 살려, 대상 집단의 전멸을 겨냥한 문맥에 맞는 ‘멸하다’를 사용했습니다.
theological_decisions:
- issue: 하만의 문서와 계략의 관계
  chosen_reading: ‘쓴 글’로 번역해 문서 자체를 유지하면서, 문맥상 그것이 하만의 계략을 담은 왕명이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘계략’으로 직접 옮겨 문서성과 계획성을 합칠 수 있음
  - ‘문서들’로만 옮겨 더 직역할 수 있음
  rationale: 히브리어는 ‘문서’와 ‘계략/생각’의 결합을 통해 기록된 조서를 가리키므로, 한국어에서도 문서성과 음모성을 둘 다 보존하는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 본문의 행정·서술적 의미 보존
- issue: 청원문의 공손한 화법
  chosen_reading: 직접 인용 안에서는 합쇼체 청원형을 유지하고, 왕을 향한 조건절은 공손한 현대 궁정체로 정리했습니다.
  alternative_readings:
  - 더 직역적인 반말형 조건절
  - 전부 경어를 강화한 종교문체
  rationale: 에스더의 발화는 왕 앞의 공식 청원문이므로, 현대 한국어에서도 지나친 교회체보다 관청·법정 문체에 가까운 공손성을 유지하는 것이 적절합니다.
  doctrine_reference: 서사체 문체 보존
