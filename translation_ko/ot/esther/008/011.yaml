  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
  footnotes:
  - marker: a
    text: Or 'that were hostile to them.' The Hebrew participle can denote those acting as enemies toward them; 'that might attack them' makes the hostile sense explicit in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'children and women.' The decree's wording explicitly includes them within the enemy group described.
    reason: cultural_note
translation:
  language: ko
  text: 곧 왕이 유다 사람들에게 모든 성읍에서 모여 자기들의 생명을 위해 서서, 그들을 치러 오는 모든 민족이나 지방의 모든 무장한 세력을 진멸하고 죽이고 멸하고, 어린이와 여인까지도, 그리고 그들의 재산을 노략하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן
  english_pob_choice: granted
  chosen_korean: 허락하셨습니다
  alternatives_korean:
  - 주셨습니다
  - 승인하셨습니다
  lexicon: HALOT
  rationale: 왕의 조서 문맥에서는 단순한 ‘주다’보다 공식적인 허가·인가의 뉘앙스를 살리는 것이 적절합니다.
- source_word: בְּכָל עִיר וָעִיר
  english_pob_choice: in every single city
  chosen_korean: 모든 성읍에서
  alternatives_korean:
  - 각 성읍마다
  - 모든 성읍마다
  lexicon: HALOT
  rationale: 히브리어의 분배적 반복은 포괄성을 나타내지만, 한국어에서는 자연스러운 공문체로 ‘모든 성읍에서’가 가장 매끄럽습니다.
- source_word: לְהִקָּהֵל וְלַעֲמֹד עַל נַפְשָׁם
  english_pob_choice: to assemble and to stand for their lives
  chosen_korean: 모여 자기들의 생명을 위해 서서
  alternatives_korean:
  - 모여 자기들의 생명을 지키고
  - 모여 자신들을 위해 맞서
  lexicon: HALOT
  rationale: ‘stand for their lives’의 직역 이미지를 살리되, 한국어에서는 생명을 위해 ‘서다’만으로는 불완전하므로 ‘생명을 위해 서서’로 옮겼습니다.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  english_pob_choice: to destroy, to kill, and to annihilate
  chosen_korean: 진멸하고 죽이고 멸하고
  alternatives_korean:
  - 파멸시키고 죽이고 없애고
  - 멸망시키고 죽이고 없애고
  lexicon: HALOT
  rationale: 세 동사는 누적적 폭력 행위를 나타내므로 한국어에서도 3중 동사를 유지했습니다. ‘진멸’은 문맥상 가장 강한 대응어입니다.
- source_word: הַצָּרִים אֹתָם
  english_pob_choice: that might attack them
  chosen_korean: 그들을 치러 오는
  alternatives_korean:
  - 그들에게 적대하는
  - 그들을 공격하려는
  lexicon: HALOT
  rationale: פּעל participle의 적대·공격 의미를 조선시대식이 아닌 현대어로 유지하면서도, 조서의 전쟁 문맥에 맞게 ‘치러 오는’으로 표현했습니다.
- source_word: טַף וְנָשִׁים
  english_pob_choice: including children and women
  chosen_korean: 어린이와 여인까지도
  alternatives_korean:
  - 어린이와 여자들까지도
  - 아이들과 여인들까지도
  lexicon: HALOT
  rationale: 히브리어가 명시하는 대상 범주를 가리지 않고 드러내되, ‘포함하여’ 같은 해설적 삽입 없이 한국어 어법으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 폭력 허가 조서의 직접성
  chosen_reading: 본문의 잔혹한 허가 내용을 완화하지 않고, 방어적 상황이라는 문맥은 ‘치러 오는’으로만 최소한으로 드러냈습니다.
  alternative_readings:
  - ‘막아내고’처럼 약화된 표현 사용
  - ‘자위할 수 있도록’처럼 의도 설명을 전면화
  rationale: 히브리어는 실제 살육과 약탈까지 포함한 법적 허가를 말하므로, 번역이 그 강도를 누그러뜨리면 원문과 독자가 마주해야 할 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘어린이와 여인’의 범위
  chosen_reading: ‘어린이와 여인’을 문맥상 공격 대상 집단의 일부로 그대로 두어 윤리적 난점을 해소하지 않았습니다.
  alternative_readings:
  - 해당 구절을 완곡하게 재구성
  - 비전투원을 제외하는 식으로 해석
  rationale: 원문은 이 항목을 명시적으로 포함하므로, 번역은 의미를 흐리지 말고 그대로 드러내야 합니다.
  doctrine_reference: Translation philosophy §3
