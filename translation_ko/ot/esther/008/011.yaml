review_pass:
  verdict: revise
  source_fidelity: 원문의 왕실 허가, 각 성읍에 있는 유다 사람들, 집결 및 자기 생명을 위한 항전, 세 겹의 파괴 동사, 적대하는 집단, 어린이와 여인, 약탈을 모두 유지해야 합니다. 초안의 ‘모든 성읍에서 모여’는 ‘각 성읍에 있는 유다 사람들’이라는 수식 관계를 다소 흐리며, ‘치러 오는’은 현재·미래의 실제 공격으로 의미를 좁힙니다.
  naturalness: ‘자기들의 생명을 위해 서서’는 현대 표준 한국어에서 다소 어색합니다. ‘자기 생명을 위하여 일어서서’는 원문의 표상을 보존하면서도 자연스럽습니다. 또한 ‘노략하게 하셨습니다’보다 ‘약탈하도록 허락하셨습니다’가 조서의 법적 허가와 병렬된 부정사 구조를 분명히 합니다.
  terminology: ‘유다 사람들’, ‘성읍’, ‘무장 세력’, ‘진멸하고 죽이고 없애도록’, ‘약탈’은 현대의 격식 있는 성경 문체에 적절합니다. הַצָּרִים의 넓은 ‘적대하는’ 의미를 유지하고, ‘어린이와 여인’이 대상 범주에 포함된다는 원문의 불편한 표현을 명시합니다.
  issues:
  - severity: medium
    issue: ‘모든 성읍에서 모여’가 장소구와 ‘유다 사람들’의 수식 관계를 흐립니다.
    rationale: בְּכָל־עִיר וָעִיר는 ‘유다 사람들’을 수식합니다. ‘각 성읍에 있는 유다 사람들에게’로 옮기면 각 도시의 유다인에게 내려진 허가라는 구조가 분명해집니다.
  - severity: medium
    issue: ‘그들을 치러 오는’은 הַצָּרִים의 뜻을 공격 행위로 좁힙니다.
    rationale: 분사는 기본적으로 ‘그들에게 적대하는/대적하는’ 자들을 뜻합니다. 문맥상 공격 가능성이 있으나, 한국어 본문에서는 ‘그들을 대적하는’이 원문의 범위를 보존합니다.
  - severity: low
    issue: ‘자기들의 생명을 위해 서서’와 ‘그들의 재산을 노략하게 하셨습니다’가 다소 부자연스럽거나 통사적으로 느슨합니다.
    rationale: ‘자기 생명을 위하여 일어서서’와 ‘그들의 재산을 약탈하도록 허락하셨습니다’가 현대 격식체에서 더 자연스럽고, 허가의 범위를 명확히 합니다.
  revised_text: 곧 왕이 각 성읍에 있는 유다 사람들에게 모여 자기 생명을 위하여 일어서서, 그들을 대적하는 어느 민족이나 지방의 모든 무장 세력을 어린이와 여인까지 포함하여 진멸하고 죽이고 없애며, 그들의 재산을 약탈하도록 허락하셨습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그들의 생명을 위하여 일어서서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘어린이와 여인’이라고 합니다. 조서의 문구는 이들을 대적하는 집단에 포함하여 명시합니다.
    reason: cultural_note
  revision_rationale: 수정문은 ‘각 성읍에 있는 유다 사람들’이라는 원문의 수식 구조를 회복하고, 적대함을 뜻하는 분사를 ‘대적하는’으로 번역하여 공격이라는 한정된 해석을 강요하지 않습니다. 세 개의 폭력 동사와 어린이·여인의 명시, 재산 약탈 허가를 그대로 보존했습니다. 각주 표지는 영어 POB 감사 기록의 의미상 중요한 두 지점에 맞추어 추가했습니다.
