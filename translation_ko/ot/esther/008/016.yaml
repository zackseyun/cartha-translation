translation:
  language: ko
  text: 유다인들에게는 빛과 기쁨과 즐거움과 존귀가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘있었습니다’는 히브리어의 존재 구문을 따라 옮긴 것입니다. 이 구문은 ‘유다인들에게는’으로 시작하여 ‘있다’로도, ‘유다인들이 …을 누렸다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַיְּהוּדִים
  english_pob_choice: For the Jews
  chosen_korean: 유다 사람들에게는
  alternatives_korean:
  - 유대인들에게는
  - 유다인들에게는
  lexicon: HALOT
  rationale: לַ는 여기서 소유/귀속을 나타내는 전치사적 용법으로 보이므로, 한국어에서는 주제 표지와 함께 ‘~에게는’으로 처리해 소속과 대조를 자연스럽게 살렸습니다.
- source_word: הָיְתָה
  english_pob_choice: there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었습니다만
  - 생겼습니다
  lexicon: HALOT
  rationale: 히브리어 היה의 존재문적 용법을 한국어의 자연스러운 존재 표현 ‘있었습니다’로 옮겨, 서술적이면서도 과도한 해석을 피했습니다.
- source_word: אוֹרָה
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 조명
  lexicon: HALOT
  rationale: 문자적 의미는 ‘빛’이며, 여기서는 구원과 반전의 은유를 그대로 유지하는 것이 적절하므로 가장 기본적인 대응어를 택했습니다.
- source_word: שִׂמְחָה / שָׂשׂוֹן
  english_pob_choice: gladness and joy
  chosen_korean: 기쁨과 즐거움
  alternatives_korean:
  - 기쁨과 기쁨의 환호
  - 환희와 기쁨
  lexicon: HALOT
  rationale: 두 명사가 거의 동의어적 누적이므로 한국어에서도 의미를 겹치되 완전히 같은 말로 중복되지 않도록 ‘기쁨’과 ‘즐거움’으로 구분했습니다.
- source_word: יְקָר
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 명예
  - 존경
  lexicon: HALOT
  rationale: 이 단어는 단순한 평판보다 부여된 품위와 가치의 뉘앙스를 가지므로, 한국어에서는 사회적 평가보다 높임의 뜻이 살아 있는 ‘존귀’를 택했습니다.
theological_decisions:
- issue: 열거어의 의미 강도와 반복 처리
  chosen_reading: ‘빛과 기쁨과 즐거움과 존귀’로 네 항목을 모두 살려, 역전된 구원의 충만함을 압축적으로 드러냈습니다.
  alternative_readings:
  - ‘빛과 즐거움과 기쁨과 존귀’
  - ‘빛과 환희와 기쁨과 존귀’
  rationale: 히브리어의 누적 열거를 약화하지 않으면서도, 한국어에서 자연스럽고 읽기 쉬운 순서를 유지했습니다.
  doctrine_reference: 문맥상 하나님의 섭리 아래 유다 공동체에 임한 구원과 회복의 표지
