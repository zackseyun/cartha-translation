  text: וַ/יִּכְתֹּ֗ב בְּ/שֵׁם֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵרֹ֔שׁ וַ/יַּחְתֹּ֖ם בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֣ח סְפָרִ֡ים בְּ/יַד֩ הָ/רָצִ֨ים בַּ/סּוּסִ֜ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים בְּנֵ֖י הָֽ/רַמָּכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
  footnotes:
  - marker: a
    text: The Hebrew terms for the horses in this verse are rare and difficult. The phrase rendered “the royal steeds bred from swift stock” may also be understood more literally as “the steeds, the achashteranim, sons of the rammakim,” referring to animals from the royal stud or postal service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아하수에로 왕의 이름으로 글을 쓰고 왕의 인장 반지로 봉인한 뒤, 말을 타고 달리는 전령들을 통하여 편지들을 보냈습니다. 그 전령들은 레케시와 아하스테라님, 곧 라마킴의 자손이라 불리는 말들을 탔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레케시’, ‘아하스테라님’, ‘라마킴’은 히브리어의 희귀한 말 관련 용어들로, 정확한 뜻과 이 말들 사이의 관계는 확실하지 않습니다. 왕실의 준마, 왕실 우편 체계의 말, 또는 특정 품종·혈통을 가리킨다는 해석들이 있습니다. ‘라마킴의 자손’은 원문의 표현을 가깝게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  english_pob_choice: in the name of King Ahasuerus
  chosen_korean: 아하수에로 왕의 이름으로
  alternatives_korean:
  - 아하수에로 왕의 권위로
  - 아하수에로 왕의 이름 아래
  lexicon: HALOT
  rationale: בְּשֵׁם은 단순한 호칭이 아니라 공식 권위를 따라 행한다는 뜻이므로, 한국어로는 관용적이면서도 의미를 살리는 ‘~의 이름으로’를 택했습니다.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  english_pob_choice: sealed it with the king’s signet ring
  chosen_korean: 왕의 인장 반지로 봉인한 뒤
  alternatives_korean:
  - 왕의 도장으로 봉인한 뒤
  - 왕의 인장으로 봉인한 뒤
  lexicon: HALOT
  rationale: טַבַּעַת는 왕실 문맥에서 반지형 인장 도구를 가리키므로, 기능을 분명히 드러내는 ‘인장 반지’로 옮겼습니다.
- source_word: בְּיַד הָרָצִים
  english_pob_choice: by couriers
  chosen_korean: 전령들의 손에
  alternatives_korean:
  - 전령들을 통해
  - 전령들로
  lexicon: HALOT
  rationale: 히브리어 בְּיַד는 수단·매개를 나타내는 관용구이므로, 직역성을 살리면서도 한국어 문맥에 자연스러운 ‘손에’로 반영했습니다.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  english_pob_choice: the royal steeds bred from swift stock
  chosen_korean: 왕의 역마 — 빠른 씨에서 난 말들 —
  alternatives_korean:
  - 왕실의 준마들 — 빠른 씨에서 난 말들 —
  - 왕의 역마 — 마구간에서 난 말들 —
  lexicon: HALOT
  rationale: 세 개의 희귀어가 결합된 난구절이므로, POB의 해석을 따라 ‘왕의 역마’로 큰 틀을 살리고, 뒤의 설명절은 원문의 혈통·품종 감각을 살려 ‘빠른 씨에서 난 말들’로 처리했습니다.
theological_decisions:
- issue: 희귀한 말 관련 어휘의 해석 범위
  chosen_reading: ‘빠른 씨에서 난 말들’로 옮겨, 속도와 혈통을 암시하되 단정적 zoological 세부는 피했습니다.
  alternative_readings:
  - ‘마구간의 말들’로 일반화
  - ‘준마들’로 미화
  rationale: 본문은 실제 우편/기마 체계의 왕실 말들을 가리키지만, 세 희귀어의 정확한 생물학적 값은 불확실합니다. 따라서 과도한 추정 없이 원문이 강하게 암시하는 품질과 계보만 드러냈습니다.
  doctrine_reference: 텍스트 비평/어휘 해석
