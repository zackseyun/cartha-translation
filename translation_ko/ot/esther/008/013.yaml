id: EST.8.13
reference: Esther 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
  footnotes:
  - marker: a
    text: Or 'in each and every province.' The Hebrew repeats 'province and province' as a distributive expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'published' or 'openly displayed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for this day.' Hebrew literally reads 'for this day,' referring to the appointed date.
    reason: lexical_alternative
  - marker: d
    text: Or 'to take vengeance on their enemies.' Some translations render more interpretively, 'to defend themselves,' but the Hebrew verb specifically means 'to avenge themselves' or 'to take vengeance.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 문서의 사본은 각 지방에서 법령으로 반포되어 모든 민족에게 공개되었으며, 유다인들이 그날에 원수들에게 복수할 준비를 갖추도록 되어 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  english_pob_choice: copy of the written decree
  chosen_korean: 문서의 사본
  alternatives_korean:
  - 글의 사본
  - 문건의 사본
  - 서면의 사본
  lexicon: HALOT
  rationale: פַּתְשֶׁגֶן은 공식 문서의 ‘사본/전사본’을 가리키므로 ‘사본’이 핵심 의미를 살립니다. הַכְּתָב은 여기서 행정적 문서이므로 ‘문서’로 옮겼습니다.
- source_word: לְהִנָּתֵן דָּת
  english_pob_choice: was to be issued as law
  chosen_korean: 공적으로 법령으로 반포되어
  alternatives_korean:
  - 법령으로 공포되어
  - 법으로 제정되어
  - 공포되어
  lexicon: HALOT
  rationale: דָּת는 단순한 ‘문서’가 아니라 공식적인 법적 명령을 뜻하므로 ‘법령’이 적절합니다. לְהִנָּתֵן의 수동적 행정 문맥을 살려 ‘반포되어’로 옮겼습니다.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  english_pob_choice: in every province and province
  chosen_korean: 각 지방마다
  alternatives_korean:
  - 모든 지방마다
  - 지방마다 지방마다
  - 각각의 지방마다
  lexicon: HALOT
  rationale: 히브리어의 반복은 분배적 표현이지만 한국어에서는 직역의 어색함보다 의미 전달이 중요하므로, 제국 전역의 분배성을 ‘각 지방마다’로 자연스럽게 반영했습니다.
- source_word: לְכָל הָעַמִּים
  english_pob_choice: to all the peoples
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 모든 민족에게
  - 모든 사람들에게
  - 각 민족에게
  lexicon: HALOT
  rationale: עַמִּים은 페르시아 제국 아래의 여러 민족 집단을 가리키지만, 한국어에서는 ‘백성’이 공적 공표의 수신 대상을 가장 자연스럽게 드러냅니다.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  english_pob_choice: to avenge themselves on their enemies
  chosen_korean: 자기들의 원수들에게 복수할 준비가 되게
  alternatives_korean:
  - 원수들에게 복수하게
  - 원수들에게 원한을 갚게
  - 적들에게 보복하게
  lexicon: HALOT
  rationale: נָקַם 계열은 단순한 방어가 아니라 ‘복수/보복’의 의미를 갖습니다. ‘준비가 되게’는 עֲתוּדִים의 상태를 살리고, 문맥상 목적을 자연스럽게 연결합니다.
theological_decisions:
- issue: 보복/복수 언어를 완화할지 여부
  chosen_reading: ‘복수할’로 직접 옮겨, 본문의 폭력적·사법적 어조를 유지했습니다.
  alternative_readings:
  - ‘자기방어를 하게’
  - ‘대항하게’
  rationale: 히브리어 לְהִנָּקֵם은 본래적 의미가 ‘복수하다’이므로, 문맥상 방어의 요소가 있더라도 의미를 약화해 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
