revisions:
- from: 문서의 사본이 각 지방마다 공적으로 법령으로 반포되어, 모든 백성에게 공개되고, 유다인들도 그날에 자기들의 원수들에게 복수할 준비가 되게 하였습니다.
  to: 그 문서의 사본은 각 지방에서 법령으로 반포되어 모든 민족에게 공개되었으며, 유다인들이 그날에 원수들에게 복수할 준비를 갖추도록 되어 있었습니다.
  rationale: 행정 문서의 사본과 법령 공포라는 원문의 구조를 유지하되, 공개의 의미 중복을 제거했습니다. עַמִּים의 복수·민족 집단 뉘앙스는 ‘모든 민족’으로, 유다인들이 준비하게 되는 목적 구문은 ‘준비를 갖추도록 되어 있었습니다’로 반영했습니다. ‘복수’는 נקם의 의미를 완화하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:03Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 פַּתְשֶׁגֶן을 ‘사본’, דָּת를 ‘법령’, עֲתוּדִים을 ‘준비’로, לְהִנָּקֵם을 ‘복수’로 옮겨 핵심 어휘의 의미를 대체로 충실히 반영합니다. 그러나 ‘공적으로’가 גָּלוּי(공개됨)의 의미를 미리 중복시키며, ‘모든 백성’은 복수형 עַמִּים의 여러 민족 집단이라는 뉘앙스를 약화합니다. 또한 마지막 ‘되게 하였습니다’는 문서 사본 자체가 유다인들을 준비시키는 직접 행위자로 읽혀 목적 용법을 다소 부자연스럽게 처리합니다.
  naturalness: ‘각 지방마다 공적으로 법령으로 반포되어’는 부사와 처격·수단 표현이 겹쳐 다소 무겁습니다. ‘각 지방에서 법령으로 반포되어’가 현대 표준어 공적 문체에 자연스럽습니다. ‘준비를 갖추도록 되어 있었습니다’는 원문의 목적을 자연스럽게 살리면서도 합쇼체 서술에 맞습니다.
  terminology: ‘유다인들’은 הַיְּהוּדִים의 역사적 집단 명칭으로 적절하며, ‘원수들에게 복수하다’도 נקם의 어휘적 힘을 완화하지 않습니다. ‘모든 민족’은 עַמִּים의 복수성과 제국 내 여러 집단이라는 문맥을 더 잘 보존합니다.
  issues:
  - severity: medium
    issue: ‘공적으로’와 ‘공개되고’의 의미 중복
    rationale: גָּלוּי는 ‘모든 민족에게 공개됨’을 수식합니다. ‘반포되어’ 앞에 ‘공적으로’를 더하면 동일한 공개성의 의미가 중복되고 원문의 결속도 흐려집니다.
  - severity: low
    issue: ‘모든 백성’이 복수형 עַמִּים의 민족적 복수성을 약화함
    rationale: 문맥상 עַמִּים은 제국 아래의 여러 ‘민족들/백성 집단들’을 가리킵니다. ‘모든 민족’이 이를 더 분명히 전달합니다.
  - severity: medium
    issue: ‘준비가 되게 하였습니다’가 목적 구문을 직접 사역으로 처리함
    rationale: וְלִהְיוֹת הַיְּהוּדִים עֲתוּדִים은 법령 공포의 목적, 곧 유다인들이 준비하도록 하는 취지입니다. ‘준비를 갖추도록 되어 있었습니다’가 이 목적성을 더 정확하고 자연스럽게 나타냅니다.
  revised_text: 그 문서의 사본은 각 지방에서 법령으로 반포되어 모든 민족에게 공개되었으며, 유다인들이 그날에 원수들에게 복수할 준비를 갖추도록 되어 있었습니다.
  revised_footnotes: []
