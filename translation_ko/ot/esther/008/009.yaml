  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
  footnotes:
  - marker: a
    text: Or 'from India to Ethiopia.' The Hebrew reads 'from Hodu to Cush'; 'Cush' is retained in the main text to preserve the ancient geographical term more precisely.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the twenty-third day of it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 왕의 서기관들이 소집되었는데, 곧 셋째 달, 즉 시완월의 스물셋째 날이었습니다. 그리고 모르드개가 명령한 모든 대로, 유다인들과 하박국?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구스’는 고대 지명을 보존한 번역입니다. 영어 POB의 설명처럼 본문은 ‘인도에서부터 구스까지’의 옛 제국 범위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘각각 자기 글과 자기 언어로’는 히브리어의 병렬 표현(문자/언어)을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  english_pob_choice: the king’s scribes were summoned
  chosen_korean: 왕의 서기관들이 소집되었는데
  alternatives_korean:
  - 왕의 서기관들이 불려왔는데
  - 왕의 서기관들이 소집되었습니다
  lexicon: HALOT
  rationale: 수동적 의미의 니팔 형태를 살려 ‘소집되다’로 옮기면 궁정의 공식 절차를 자연스럽게 드러낼 수 있습니다.
- source_word: בָּעֵת הַהִיא
  english_pob_choice: at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시간에
  - 그 시기에
  lexicon: HALOT
  rationale: 앞의 ‘그때’와 겹치지 않으면서 זמן 구절의 지시성을 간결하게 드러냅니다.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  english_pob_choice: in the third month, that is, the month of Sivan
  chosen_korean: 셋째 달, 곧 시완월
  alternatives_korean:
  - 세 번째 달, 곧 시완월
  - 셋째 달, 즉 시완월
  lexicon: HALOT
  rationale: הוּא의 동격 설명을 ‘곧’으로 옮겨 월명 해설을 분명히 하되, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  english_pob_choice: on its twenty-third day
  chosen_korean: 스물셋째 날
  alternatives_korean:
  - 그 달 스물셋째 날
  - 그 달의 스물셋째 날
  lexicon: HALOT
  rationale: 지시대명사의 회귀를 한국어에서는 문맥상 자연스럽게 생략할 수 있어, 반복을 줄이면서 날짜 정보를 보존했습니다.
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  english_pob_choice: according to all that Mordecai commanded
  chosen_korean: 모르드개가 명령한 모든 대로
  alternatives_korean:
  - 모르드개가 명령한 바와 같이
  - 모르드개가 명령한 그대로
  lexicon: HALOT
  rationale: כְּכָל의 전면적 일치를 살리기 위해 ‘모든 대로’로 옮겼습니다. ‘그대로’도 가능하지만, 원문의 총체성을 더 직접적으로 드러냅니다.
- source_word: אֶל הַיְּהוּדִים
  english_pob_choice: to the Jews
  chosen_korean: 유다인들에게
  alternatives_korean:
  - 유대인들에게
  - 유다 사람들에게
  lexicon: HALOT
  rationale: 에스더서의 집단명으로서 ‘유다인들’이 문맥상 가장 적절하고, 한국어 성경역에서도 익숙한 역사적 호칭입니다.
- source_word: הָאֲחַשְׁדַּרְפְּנִים הַפַּחוֹת וְשָׂרֵי הַמְּדִינוֹת
  english_pob_choice: the satraps, the governors, and the officials of the provinces
  chosen_korean: 사트라프들과 총독들과 지방의 관원들에게
  alternatives_korean:
  - 사트라프들과 통치자들과 지방의 관리들에게
  - 사트라프들과 총독들과 지방의 행정관들에게
  lexicon: HALOT
  rationale: 페르시아 행정 용어는 관례적 음역/번역을 유지하는 것이 역사적 배경을 더 정확히 보존합니다. ‘관원’은 שָׂרִים의 행정적 의미를 무난하게 받습니다.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  english_pob_choice: from India to Cush
  chosen_korean: 인도에서부터 구스까지
  alternatives_korean:
  - 호두에서부터 구스까지
  - 인도에서부터 에티오피아까지
  lexicon: HALOT
  rationale: 영어 POB의 역사적 등가를 따라 인도/구스로 옮기되, ‘구스’는 고대 지명을 보존합니다.
- source_word: כִּכְתָבָהּ / כִּלְשׁוֹנוֹ
  english_pob_choice: in its own script / in its own language
  chosen_korean: 각각 자기 글과 자기 언어로
  alternatives_korean:
  - 자기 문서와 자기 언어로
  - 자기 문자와 자기 말을 사용하여
  lexicon: HALOT
  rationale: ‘כתב’와 ‘לשון’의 병행을 한국어에서 가장 분명하게 드러내기 위해 ‘글/언어’로 구분했습니다.
- source_word: וְאֶל הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם
  english_pob_choice: and to the Jews in their own script and their own language
  chosen_korean: 유다인들에게도 자기 글과 자기 언어로
  alternatives_korean:
  - 유다인들에게도 자기 문자와 자기 언어로
  - 유다인들에게는 자기 글과 자기 언어로
  lexicon: HALOT
  rationale: 마지막 병렬에서 유다인들이 별도로 강조되므로 ‘도’로 부가성을 살렸습니다. 원문의 병렬 구조도 유지됩니다.
theological_decisions:
- issue: 하나님의 언약 백성의 호칭
  chosen_reading: ‘유다인들’로 옮겨 역사적 민족명과 본문 배경을 그대로 드러냈습니다.
  alternative_readings:
  - ‘유대인들’
  - ‘유다 사람들’
  rationale: 에스더기의 페르시아 제국 배경과 유다 공동체의 역사성을 함께 보존하는 것이 본문 이해에 더 적합합니다.
  doctrine_reference: 성경 역사서의 문맥적·서사적 정확성
