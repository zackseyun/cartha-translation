translation:
  language: ko
  text: 그때 왕은 에스더에게 금 홀을 내밀었습니다. 에스더는 일어나 왕 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내밀었습니다’는 ‘extended’의 자연스러운 한국어 대응이며, 문자적으로는 ‘금 홀을 에스더에게 뻗었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  english_pob_choice: held out
  chosen_korean: 내밀었습니다
  alternatives_korean:
  - 펴서 내보냈습니다
  - 뻗었습니다
  lexicon: HALOT
  rationale: 홀을 권하는 왕의 동작을 자연스럽고 공손하게 살리면서, 단순한 ‘뻗다’보다 행위의 방향성과 의도를 분명히 드러냅니다.
- source_word: שַׁרְבִיט הַזָּהָב
  english_pob_choice: the golden scepter
  chosen_korean: 금 홀
  alternatives_korean:
  - 황금 홀
  - 금으로 된 홀
  lexicon: HALOT
  rationale: 예복적 궁정 문맥에서 ‘홀’이 자연스러우며, ‘금’은 원문의 재질 표시를 간결하게 살립니다. ‘황금’보다 현대 한국어에서 덜 장식적입니다.
- source_word: וַתָּקָם
  english_pob_choice: rose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 몸을 일으켰습니다
  lexicon: HALOT
  rationale: 왕의 신호에 응해 자세를 바꾸는 동작을 표준적인 서술체로 옮겼습니다. 이어지는 ‘섰습니다’와도 의미가 겹치지 않습니다.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: stood before the king
  chosen_korean: 왕 앞에 섰습니다
  alternatives_korean:
  - 왕의 앞에 서 있었습니다
  - 왕 앞에 나아가 섰습니다
  lexicon: HALOT
  rationale: לִפְנֵי의 관계를 직역적으로 유지하면서도 한국어에서 가장 자연스러운 궁정 장면 표현을 택했습니다. ‘나아가’는 원문에 없는 이동을 덧붙일 수 있어 피했습니다.
