revisions:
- from: 그때 왕은 하만에게서 거두어 둔 자기 인장 반지를 벗겨 모르드개에게 주었습니다. 그리고 에스더는 모르드개를 하만의 집을 맡는 자로 세웠습니다.[a]
  to: 그때 왕은 하만에게서 빼앗은 자신의 인장 반지를 벗어 모르드개에게 주었습니다. 에스더는 모르드개를 하만의 집을 맡게 하였습니다.[a]
  rationale: 왕의 반지 제거에는 ‘벗어’를 사용하고, 하만에게서 반지를 이전한 행위는 불필요한 상태 의미 없이 ‘빼앗은’으로 옮겼습니다. 에스더가 모르드개를 하만의 집 위에 두는 행정적 행위는 ‘맡게 하였습니다’로 자연스럽게 표현했습니다. בַּיִת의 의미 범위는 본문에서는 ‘집’으로 보존하고 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:39:58Z'
review_pass:
  verdict: revise
  source_fidelity: 왕이 자신의 반지를 벗어 모르드개에게 주고, 그 반지는 앞서 하만에게서 거두어들인 것이었다는 순서와 관계를 정확히 드러내야 합니다. 초안의 ‘벗겨’는 목적어를 타인에게서 강제로 벗기는 뜻으로도 읽혀 왕이 자기 반지를 벗는 장면에 부자연스럽습니다. ‘거두어 둔’도 원문의 단순 과거 완료적 관계절보다 보관 상태를 덧붙입니다.
  naturalness: ‘자신의 인장 반지를 벗어’와 ‘하만의 집을 맡게 하였습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 행정적 위임의 뜻도 명료합니다.
  terminology: ‘인장 반지’는 왕의 공적 권한을 나타내는 טַבַּעַת의 문맥적 의미를 적절히 반영합니다. ‘하만의 집’은 בֵּית הָמָן의 폭넓은 의미를 보존하며, 각주에서 집안·재산의 가능성을 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘자기 인장 반지를 벗겨’
    rationale: ‘벗기다’는 보통 다른 사람에게서 옷이나 물건을 제거하는 타동사로 쓰이므로, 왕이 자신의 반지를 손에서 빼는 원문 장면에는 ‘벗어’가 정확하고 자연스럽습니다.
  - severity: low
    issue: ‘하만에게서 거두어 둔’
    rationale: הֶעֱבִיר는 하만에게서 빼앗아/거두어들인 과거 행위를 가리킵니다. ‘-어 둔’은 원문에 없는 보관·유지의 뉘앙스를 더합니다.
  revised_text: 그때 왕은 하만에게서 빼앗은 자신의 인장 반지를 벗어 모르드개에게 주었습니다. 에스더는 모르드개를 하만의 집을 맡게 하였습니다.[a]
  revised_footnotes:
