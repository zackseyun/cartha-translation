  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨סַר הַ/מֶּ֜לֶךְ אֶת טַבַּעְתּ֗/וֹ אֲשֶׁ֤ר הֶֽעֱבִיר֙ מֵֽ/הָמָ֔ן וַֽ/יִּתְּנָ֖/הּ לְ/מָרְדֳּכָ֑י וַ/תָּ֧שֶׂם אֶסְתֵּ֛ר אֶֽת מָרְדֳּכַ֖י עַל בֵּ֥ית הָמָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
  footnotes:
  - marker: a
    text: Or "Haman's household" or "Haman's estate."
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 하만에게서 거두어 둔 자기 인장 반지를 벗겨 모르드개에게 주었습니다. 그리고 에스더는 모르드개를 하만의 집을 맡는 자로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하만의 집안”, “하만의 재산”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבַּעְתּוֹ
  english_pob_choice: his signet ring
  chosen_korean: 자기 인장 반지
  alternatives_korean:
  - 반지
  - 왕의 인장 반지
  lexicon: HALOT
  rationale: טַבַּעַת는 일반적으로 반지를 뜻하지만, 문맥상 왕의 권한을 나타내는 봉인용 반지이므로 기능을 드러내는 ‘인장 반지’로 옮겼습니다.
- source_word: הֶעֱבִיר מֵהָמָן
  english_pob_choice: which he had taken away from Haman
  chosen_korean: 하만에게서 거두어 둔
  alternatives_korean:
  - 하만에게서 빼앗은
  - 하만에게서 옮겨 온
  lexicon: HALOT
  rationale: הֶעֱבִיר는 ‘옮기다’보다 ‘치우다/거두다/빼앗다’의 뉘앙스를 가질 수 있는데, 여기서는 하만에게서 제거되어 왕에게서 분리된 상태를 자연스럽게 드러내는 ‘거두어 둔’이 적절합니다.
- source_word: וַתָּשֶׂם ... עַל
  english_pob_choice: And Esther appointed Mordecai over
  chosen_korean: 에스더는 모르드개를 ...로 세웠습니다
  alternatives_korean:
  - 에스더는 모르드개를 ... 위에 두었습니다
  - 에스더는 모르드개를 ...로 임명했습니다
  lexicon: HALOT
  rationale: שׂוּם + עַל은 단순히 ‘놓다’가 아니라 어떤 지위나 책임 위에 ‘세우다/임명하다’는 행정적 뜻을 가집니다. 한국어에서는 문맥상 ‘세웠습니다’가 가장 직접적입니다.
- source_word: בֵּית הָמָן
  english_pob_choice: the house of Haman
  chosen_korean: 하만의 집
  alternatives_korean:
  - 하만의 집안
  - 하만의 가문
  - 하만의 재산
  lexicon: HALOT
  rationale: בַּיִת은 여기서 물리적 집만이 아니라 가문·가산·가정권 전체를 포함할 수 있으므로, 히브리어 표현을 보존하는 ‘하만의 집’을 택했습니다.
theological_decisions:
- issue: 에스더의 행위와 왕의 행위가 동시에 서술되는 구조
  chosen_reading: 본문은 왕이 반지를 주는 행위와 에스더가 모르드개를 세우는 행위를 구분해 제시합니다.
  alternative_readings:
  - 두 동작을 하나의 행정 조치로 합쳐 번역하는 방식
  - 에스더의 행위를 단순한 추천이나 제안으로 약화시키는 방식
  rationale: 히브리어는 두 주체의 행동을 분리해 기록하므로, 왕의 권한 수여와 에스더의 위임을 각각 살려 번역해야 서술의 긴장이 유지됩니다.
  doctrine_reference: 서사 본문 해석 원칙
