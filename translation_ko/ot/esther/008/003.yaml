source:
  edition: WLC
  text: וַ/תּ֣וֹסֶף אֶסְתֵּ֗ר וַ/תְּדַבֵּר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֖ל לִ/פְנֵ֣י רַגְלָ֑י/ו וַ/תֵּ֣בְךְּ וַ/תִּתְחַנֶּן ל֗/וֹ לְ/הַֽעֲבִיר֙ אֶת רָעַת֙ הָמָ֣ן הָֽ/אֲגָגִ֔י וְ/אֵת֙ מַֽחֲשַׁבְתּ֔/וֹ אֲשֶׁ֥ר חָשַׁ֖ב עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
  footnotes:
  - marker: a
    text: Or 'remove' or 'cause to pass away'; the Hebrew verb conveys making Haman's evil and plan pass away or be set aside.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에스더가 다시 왕 앞에서 말했습니다. 그녀는 그의 발 앞에 엎드려 울며, 하만 그 아각 사람의 악과 그가 유대인들에 대하여 꾸민 그의 계략을 없애 달라고 간청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘없애다’뿐 아니라 ‘지나가게 하다’, ‘지나가 버리게 하다’의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר
  english_pob_choice: Then Esther spoke again
  chosen_korean: 에스더가 다시 말했습니다
  alternatives_korean:
  - 에스더가 계속 말했습니다
  - 에스더가 말을 덧붙였습니다
  lexicon: HALOT
  rationale: יסף + 서술 동사는 반복/추가의 의미이므로, ‘다시’로 자연스럽게 옮겨 반복성을 살렸습니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 면전에서
  - 왕 앞에
  lexicon: HALOT
  rationale: 궁정적 정황을 드러내는 전치사구로, ‘왕 앞에서’가 가장 자연스럽고 격식 있는 표현입니다.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו וַתֵּבְךְּ וַתִּתְחַנֶּן לוֹ
  english_pob_choice: She fell before his feet, wept, and pleaded with him
  chosen_korean: 그의 발 앞에 엎드려 울며, ... 간청했습니다
  alternatives_korean:
  - 그의 발 앞에 쓰러져 울며, ... 애원했습니다
  - 그의 발 앞에 떨어져 울며, ... 빌었습니다
  lexicon: HALOT
  rationale: ‘발 앞에’는 낮춤과 간구의 몸짓을 그대로 살리고, ‘엎드려’는 נפל의 굴복 자세를 한국어로 자연스럽게 드러냅니다. ‘간청했습니다’는 חנן의 간절한 청원을 무리 없이 반영합니다.
- source_word: לְהַעֲבִיר אֶת רָעַת הָמָן ... וְאֵת מַחֲשַׁבְתּוֹ
  english_pob_choice: to avert the evil of Haman ... and his scheme
  chosen_korean: '... 하만 ...의 악과 그가 ... 꾸민 그의 계략을 없애 달라고'
  alternatives_korean:
  - '... 하만 ...의 악을 물리쳐 달라고'
  - '... 하만 ...의 악한 계획과 그가 꾸민 계략을 제거해 달라고'
  lexicon: HALOT
  rationale: רָעָה와 מַחֲשָׁבָה를 구별해, 앞의 것은 ‘악’, 뒤의 것은 ‘계략’으로 옮겼습니다. לְהַעֲבִיר는 ‘없애다’로, 제거·무효화의 의미를 과도하게 해석하지 않으면서 살렸습니다.
- source_word: הָאֲגָגִי
  english_pob_choice: the Agagite
  chosen_korean: 아각 사람
  alternatives_korean:
  - 아각 사람의
  - 아각 사람인
  lexicon: HALOT
  rationale: 민족/계통을 나타내는 형용사로, 한국어 성경에서 통용되는 설명적 표기인 ‘아각 사람’을 사용했습니다.
theological_decisions:
- issue: 공손한 청원 장면의 문체
  chosen_reading: 서술체는 합쇼체로 유지하되, 에스더의 간청 동작은 ‘엎드려 울며, ... 간청했습니다’로 표현해 절박한 탄원을 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘부탁했습니다’로 완화
  - 더 강하게 ‘애원했습니다’로 번역
  rationale: 본문은 왕 앞에서의 절박한 중재 장면이므로, 지나치게 완화하지 않고 간청의 강도를 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 서사와 수사적 강도에 대한 번역 원칙
- issue: ‘하만의 악’과 ‘그의 계략’의 구분
  chosen_reading: ‘악’과 ‘계략’을 분리해 번역하여 도덕적 악과 구체적 음모를 함께 드러냈습니다.
  alternative_readings:
  - ‘악한 계획’으로 통합
  - ‘악행과 계략’으로 재구성
  rationale: 원문은 רָעָה와 מַחֲשָׁבָה를 병렬로 두어 의미를 구분하므로, 한국어에서도 두 요소를 유지해야 합니다.
  doctrine_reference: 원문 어휘 대조 보존 원칙
