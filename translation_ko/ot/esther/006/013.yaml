    rationale: 통용 인명 표기 ‘세레스’와 자연스러운 집단 명칭 ‘현자들’을 사용하면 독해가 좋아지며 원문의 의미도 유지됩니다.
  - severity: low
    issue: 각주 표지가 발화 동사 뒤에 있어 혈통 표현의 대안을 직접 가리키지 못합니다.
    rationale: 어휘 대안 각주는 해당 표현인 ‘유대인의 후손’ 뒤에 두는 것이 기능적으로 명확합니다.
