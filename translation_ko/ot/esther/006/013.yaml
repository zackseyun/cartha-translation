source:
  edition: WLC
  text: וַ/יְסַפֵּ֨ר הָמָ֜ן לְ/זֶ֤רֶשׁ אִשְׁתּ/וֹ֙ וּ/לְ/כָל אֹ֣הֲבָ֔י/ו אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וַ/יֹּ֩אמְרוּ֩ ל֨/וֹ חֲכָמָ֜י/ו וְ/זֶ֣רֶשׁ אִשְׁתּ֗/וֹ אִ֣ם מִ/זֶּ֣רַע הַ/יְּהוּדִ֡ים מָרְדֳּכַ֞י אֲשֶׁר֩ הַחִלּ֨וֹתָ לִ/נְפֹּ֤ל לְ/פָנָי/ו֙ לֹא תוּכַ֣ל ל֔/וֹ כִּֽי נָפ֥וֹל תִּפּ֖וֹל לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
  footnotes:
  - marker: a
    text: Or, “is of Jewish descent.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 하만은 자기 아내 제레셰와 모든 친구들에게 자기에게 일어난 모든 일을 말했습니다. 그러자 그의 지혜로운 사람들과 그의 아내 제레셰가 그에게 말했습니다[a], “만일 모르드개가 당신이 무너지기 시작한 그 유대인들의 씨에서 난 사람이라면, 당신은 그를 이기지 못할 것입니다. 당신은 반드시 그 앞에서 무너질 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘유대인 혈통이라면.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 서술 동사 wayyiqtol을 자연스러운 현대 한국어 서술로 옮기되, 단순한 해설보다 보고의 성격을 살렸습니다.
- source_word: אֹהֲבָיו
  english_pob_choice: his friends
  chosen_korean: 모든 친구들
  alternatives_korean:
  - 그를 사랑하는 이들
  - 그의 벗들
  lexicon: HALOT
  rationale: 궁정 맥락에서 문자적인 ‘사랑하는 이들’보다 동반자·조언자 의미가 살아 있는 ‘친구들’이 적절하므로, 대상 범위를 드러내기 위해 ‘모든’을 덧붙였습니다.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  english_pob_choice: everything that had happened to him
  chosen_korean: 자기에게 일어난 모든 일
  alternatives_korean:
  - 자기에게 닥친 모든 일
  - 자기에게 일어난 모든 것
  lexicon: HALOT
  rationale: קרה는 여기서 ‘일어나다/닥치다’의 뜻이므로, 사건의 총체를 자연스럽게 살려 한국어로 옮겼습니다.
- source_word: חֲכָמָיו
  english_pob_choice: his wise men
  chosen_korean: 그의 지혜로운 사람들
  alternatives_korean:
  - 그의 현자들
  - 그의 조언자들
  lexicon: HALOT
  rationale: ‘wise men’의 직역을 유지하되 현대 독자가 이해하기 쉽게 ‘지혜로운 사람들’로 옮겼습니다.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  english_pob_choice: is from the seed of the Jews
  chosen_korean: 유대인들의 씨에서 난 사람
  alternatives_korean:
  - 유대인의 혈통이라면
  - 유대인들의 후손이라면
  lexicon: HALOT
  rationale: ‘씨’라는 혈통 이미지를 보존하여 מקור의 표현을 살렸고, 한국어에서는 ‘난 사람’으로 인격적 대상을 분명히 했습니다.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  english_pob_choice: before whom you have begun to fall
  chosen_korean: 당신이 무너지기 시작한 그
  alternatives_korean:
  - 당신이 그 앞에서 넘어지기 시작한 그
  - 당신이 그 앞에서 패배하기 시작한 그
  lexicon: HALOT
  rationale: ‘fall’의 반복을 한국어에서도 살리되, 단순한 물리적 낙하보다 패배·몰락의 뉘앙스를 반영해 ‘무너지기 시작한’으로 옮겼습니다.
- source_word: לֹא תוּכַ֣ל ל֔/וֹ
  english_pob_choice: you will not prevail against him
  chosen_korean: 당신은 그를 이기지 못할 것입니다
  alternatives_korean:
  - 당신은 그를 이겨내지 못할 것입니다
  - 당신은 그를 당해내지 못할 것입니다
  lexicon: HALOT
  rationale: 능력 부정의 표현을 자연스럽게 ‘이기지 못할 것입니다’로 옮겨 대결 구도를 분명히 했습니다.
- source_word: נָפוֹל תִּפּוֹל
  english_pob_choice: you will surely fall
  chosen_korean: 반드시 무너질 것입니다
  alternatives_korean:
  - 정녕 넘어질 것입니다
  - 틀림없이 떨어질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조용 부정사 절대형을 한국어의 ‘반드시’로 살리고, 앞의 ‘무너지기 시작한’과 의미 연결이 되도록 ‘무너지다’를 유지했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그 앞에
  - 그 면전에서
  lexicon: HALOT
  rationale: 반복되는 ‘before him’을 동일하게 옮겨 대면·굴복 관계를 유지했습니다.
theological_decisions:
- issue: 씨(seed)와 혈통/계보 표현
  chosen_reading: ‘씨’의 이미지를 유지해 모르드개의 유대인 혈통을 드러내고, 본문 의미를 분명히 하기 위해 한국어에서는 ‘유대인들의 씨에서 난 사람’으로 옮겼습니다.
  alternative_readings:
  - ‘유대인의 혈통이라면’으로 완화
  - ‘유대인 출신이라면’으로 의역
  rationale: 본문은 단순한 민족 분류가 아니라 계보적 소속을 논거로 삼으므로, 이미지를 지우지 않는 번역이 필요합니다.
  doctrine_reference: 성경 본문이 혈통/언약 계보를 논증의 근거로 사용하는 방식
