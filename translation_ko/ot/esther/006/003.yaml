id: EST.6.3
reference: Esther 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַֽה נַּעֲשָׂ֞ה יְקָ֧ר וּ/גְדוּלָּ֛ה לְ/מָרְדֳּכַ֖י עַל זֶ֑ה וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ מְשָׁ֣רְתָ֔י/ו לֹא נַעֲשָׂ֥ה עִמּ֖/וֹ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
  footnotes:
  - marker: a
    text: Or “What honor and greatness was done for Mordecai because of this?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 말했습니다. “이 일로[a] 모르드개에게 어떤 존귀와 큰 영예가 베풀어졌습니까?” 왕의 젊은 시종들, 곧 그를 모시던 이들이 말했습니다. “그를 위해 아무 조치도 취해지지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일 때문에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  english_pob_choice: What honor and greatness has been bestowed
  chosen_korean: 어떤 존귀와 위대함이 베풀어졌습니까
  alternatives_korean:
  - 무슨 존귀와 위대함이 행해졌습니까
  - 어떤 존귀와 위대함이 주어졌습니까
  lexicon: HALOT
  rationale: עשה의 수동형 질문을 한국어의 자연스러운 피동 표현으로 옮기되, 궁정 문맥에 맞게 ‘베풀어졌습니다’로 받아 예우의 부여라는 뉘앙스를 살렸습니다.
- source_word: יְקָר
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 존중
  - 명예
  lexicon: HALOT
  rationale: 궁정에서 사람에게 주어지는 सम्मान/존귀의 의미가 강해 ‘존귀’가 ‘명예’보다 원문의 격식을 더 잘 드러냅니다.
- source_word: וּגְדוּלָּה
  english_pob_choice: greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 크나큰 영예
  - 높은 지위
  - 큰 됨됨이
  lexicon: HALOT
  rationale: ‘존귀’와 병렬로 붙는 공적 상승·탁월성의 표현을 살려 ‘위대함’으로 옮겼습니다. 전통적 교회어법의 ‘영광’은 이 문맥에서 의미가 넓어집니다.
- source_word: לְמָרְדֳּכַי
  english_pob_choice: on Mordecai
  chosen_korean: 모르드개에게
  alternatives_korean:
  - 모르드개를 위해
  - 모르드개에게로
  lexicon: HALOT
  rationale: 전치사 לְ는 수혜자/수여 대상을 나타내므로 한국어에서는 여격인 ‘-에게’가 가장 직접적입니다.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  english_pob_choice: Nothing has been done for him
  chosen_korean: 그를 위해 아무것도 행해지지 않았습니다
  alternatives_korean:
  - 그에게 아무 일도 행해지지 않았습니다
  - 아무것도 그에게 이루어지지 않았습니다
  lexicon: HALOT
  rationale: ‘그를 위해’는 עִמּוֹ의 수혜적 의미를 자연스럽게 살리며, ‘아무것도 행해지지 않았습니다’는 원문의 부정 수동을 충실하게 반영합니다.
- source_word: נַעֲרֵי הַמֶּלֶךְ מְשָׁרְתָיו
  english_pob_choice: The king’s young men who attended him
  chosen_korean: 왕의 시종들, 곧 그를 모시던 이들
  alternatives_korean:
  - 왕의 젊은 신하들, 곧 그를 섬기던 이들
  - 왕의 젊은 종들, 곧 그를 시중들던 이들
  lexicon: HALOT
  rationale: נַעֲרִים의 문자적 ‘젊은 사람들’과 מְשָׁרְתִים의 ‘모시다/시중들다’를 함께 살리기 위해 ‘시종들, 곧 그를 모시던 이들’로 풀어 궁정 호칭을 자연스럽게 정리했습니다.
theological_decisions:
- issue: 궁정 대화의 존대와 직접 발화의 등록
  chosen_reading: 서술문은 합쇼체로 유지하고, 왕의 직접 발화는 궁정 문맥에 맞는 예우적 질문 형식으로 처리했습니다.
  alternative_readings:
  - 보다 평이한 구어체로 완화
  - 전통적 성서문체로 격상
  rationale: 본문은 왕의 궁정 회의 장면이므로 현대 표준어의 공적·격식체가 적절하며, 원문의 권위 있는 분위기를 흐리지 않도록 했습니다.
  doctrine_reference: 문체·화행 일치 원칙
