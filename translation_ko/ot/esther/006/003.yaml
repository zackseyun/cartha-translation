revisions:
- from: 그러자 왕이 말했습니다. 「이 일로 모르드개에게 어떤 존귀와 위대함이 베풀어졌습니까?」 왕의 시종들, 곧 그를 모시던 이들이 말했습니다. 「그를 위해 아무것도 행해지지 않았습니다.」[a]
  to: 그러자 왕이 말했습니다. “이 일로[a] 모르드개에게 어떤 존귀와 큰 영예가 베풀어졌습니까?” 왕의 젊은 시종들, 곧 그를 모시던 이들이 말했습니다. “그를 위해 아무 조치도 취해지지 않았습니다.”
  rationale: The revision preserves the Hebrew passive construction and the ambiguity of the causal phrase while improving Korean collocation. It restores '젊은' for נַעֲרֵי and moves the footnote anchor to the phrase for which the lexical alternative is supplied. No doctrinal interpretation has been introduced.
  reviewer_model: gpt-5.6-terra
