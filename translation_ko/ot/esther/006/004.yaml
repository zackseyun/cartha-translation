  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מִ֣י בֶ/חָצֵ֑ר וְ/הָמָ֣ן בָּ֗א לַ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/חִ֣יצוֹנָ֔ה לֵ/אמֹ֣ר לַ/מֶּ֔לֶךְ לִ/תְלוֹת֙ אֶֽת מָרְדֳּכַ֔י עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
  footnotes:
  - marker: a
    text: Hebrew עֵץ literally means 'tree' or 'wood'; here it refers to the execution structure Haman had prepared, hence 'gallows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 말했습니다[a]. "뜰에 누가 있느냐?" 하만은 이미 왕궁의 바깥 뜰에 와서, 자기가 모르드개를 달려고 준비해 둔 나무에 관해 왕에게 말하려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֵץ는 문자적으로는 ‘나무’ 또는 ‘목재’이지만, 여기서는 처형용 구조물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  english_pob_choice: court / outer court
  chosen_korean: 뜰 / 바깥 뜰
  alternatives_korean:
  - 법정
  - 마당
  - 궁정
  lexicon: HALOT
  rationale: חָצֵר는 궁전 맥락에서 둘러싸인 뜰을 뜻하므로, 왕궁의 공간감을 살리는 ‘뜰’이 적절합니다. 두 번째는 הַחִיצוֹנָה를 반영해 ‘바깥 뜰’로 옮겼습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s palace
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 궁전
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 집’이지만, 문맥상 거처 전체를 가리키므로 한국어에서는 ‘왕궁’이 자연스럽고 오해가 적습니다.
- source_word: לִתְלוֹת / הָעֵץ
  english_pob_choice: to hang / the gallows
  chosen_korean: 달려고 / 나무
  alternatives_korean:
  - 매달려고
  - 교수대에
  - 장대
  lexicon: HALOT
  rationale: עֵץ는 문자적으로 ‘나무/목재’이므로 본문 자체의 표현을 살려 ‘나무’로 옮겼습니다. ‘달다’는 실행 행위를 드러내면서도 원문의 폭넓은 의미를 유지합니다.
- source_word: אֲשֶׁר הֵכִין לוֹ
  english_pob_choice: that he had prepared for him
  chosen_korean: 자기가 … 준비해 둔
  alternatives_korean:
  - 그를 위해 준비한
  - 그에게 마련해 둔
  lexicon: HALOT
  rationale: 목적대상은 문맥상 모르드개이므로, 한국어에서는 관계절을 풀어 ‘자기가 모르드개를 달려고 준비해 둔’으로 자연스럽게 전달했습니다.
theological_decisions:
- issue: Haman의 의도와 서술 긴장
  chosen_reading: 하만이 왕에게 말하려는 내용은 모르드개를 처형하려는 계획이며, 본문은 그 의도를 직접 드러내되 지나치게 해석하지 않고 서술합니다.
  alternative_readings:
  - 하만이 왕에게 청하려 했다
  - 하만이 왕에게 고발하려 했다
  rationale: 히브리어 לֵאמֹר와 לִתְלוֹת의 결합은 단순 발화 목적과 처형 의도를 함께 보여 줍니다. 한국어도 그 긴장을 유지해, 하만의 악의적 계획이 배경으로 드러나도록 했습니다.
  doctrine_reference: 서사적 본문 해석 원리
