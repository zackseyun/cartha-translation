  naturalness: ‘그들이 아직 그와 말하고 있을 때에’와 ‘에스더가 마련한 잔치’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘데려오려고 서둘렀습니다’도 문법적으로 가능하나, ‘서둘러 … 데려갔습니다’가 실제로 하만을 잔치로 인도한 사건 진행을 더 직접적이고 자연스럽게 드러냅니다.
