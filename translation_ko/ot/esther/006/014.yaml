  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
  footnotes:
  - marker: a
    text: Or 'the king’s officials,' since the Hebrew term can denote court functionaries as well as eunuchs.
    reason: lexical_alternative
  - marker: b
    text: Or 'hastened' or 'rushed to bring Haman'; the Hebrew verb here conveys urgent speed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아직 그와 말하고 있을 때에 왕의 내시들이 도착하여, 에스더가 마련한 잔치에 하만을 데려오려고 서둘렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  english_pob_choice: While they were still speaking with him
  chosen_korean: 그들이 아직 그와 말하고 있을 때에
  alternatives_korean:
  - 그들이 아직 그와 이야기하는 중에
  - 그들이 아직 그와 말하던 중에
  lexicon: HALOT
  rationale: עוֹדָם과 분사 מְדַבְּרִים의 지속성을 살려, 사건이 끊기지 않은 상태를 자연스럽게 표현했습니다.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  english_pob_choice: the king’s eunuchs
  chosen_korean: 왕의 내시들이
  alternatives_korean:
  - 왕의 관리들이
  - 왕의 시종들이
  lexicon: HALOT
  rationale: סָרִיס의 기본 의미를 따라 source-direct하게 옮겼고, 본문 맥락상 궁정 관료를 가리킬 수 있는 여지도 있으나 POB의 어휘 선택을 따라 투명성을 우선했습니다.
- source_word: וַיַּבְהִלוּ לְהָבִיא
  english_pob_choice: hurried to bring
  chosen_korean: 데려오려고 서둘렀습니다
  alternatives_korean:
  - 급히 데려오려고 했습니다
  - 서둘러 데려왔습니다
  lexicon: HALOT
  rationale: בהל의 신속한 진행을 살리되, 목적부정사 לְהָבִיא를 한국어 목적 표현으로 자연스럽게 풀었습니다.
- source_word: אֶת הָמָן אֶל הַמִּשְׁתֶּה
  english_pob_choice: to bring Haman to the banquet
  chosen_korean: 하만을 에스더가 마련한 잔치에
  alternatives_korean:
  - 하만을 잔치로
  - 하만을 잔치 자리로
  lexicon: HALOT
  rationale: מִשְׁתֶּה를 ‘잔치’로 옮겨 Esther 본문의 왕실 연회 장면을 살렸고, אֶל은 방향성을 보여 주므로 ‘에스더가 마련한 잔치에’로 처리했습니다.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  english_pob_choice: that Esther had prepared
  chosen_korean: 에스더가 마련한
  alternatives_korean:
  - 에스더가 준비한
  - 에스더가 베푼
  lexicon: HALOT
  rationale: עָשְׂתָה를 연회 문맥에서 관용적으로 ‘마련하다/준비하다’로 옮겨, 사건 이전에 이미 준비된 잔치라는 흐름을 반영했습니다.
