  rationale: 본문은 왕에게 드리는 보고가 아니라 궁정 의례를 위한 구체적 명령이므로, 합쇼체 명령형이 서사적 힘과 위계를 가장 잘 전달합니다.
  doctrine_reference: 서사체의 담화 기능 보존
