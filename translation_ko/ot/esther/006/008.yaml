  - 왕실 의복
  lexicon: HALOT
  rationale: 왕권에 속한 예복이라는 뜻을 간결하게 살리기 위해 관용적인 ‘왕복’을 택했습니다.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  english_pob_choice: that the king has worn
  chosen_korean: 왕의 입었던
  alternatives_korean:
  - 왕이 입었던
  - 왕이 몸에 걸쳤던
  lexicon: HALOT
  rationale: 히브리어의 관계절이 가리키는 ‘왕이 실제로 입었던’ 옷이라는 점을 드러내기 위해 자연스러운 관형절로 옮겼습니다.
- source_word: וְסוּס אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  english_pob_choice: and a horse on which the king has ridden
  chosen_korean: 왕이 탔던 말
  alternatives_korean:
  - 왕이 올라탔던 말
  - 왕이 타던 말
  lexicon: HALOT
  rationale: 전치사 עַל의 의미를 반영하되 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: כֶּתֶר מַלְכוּת
  english_pob_choice: a royal crown
  chosen_korean: 왕관
  alternatives_korean:
  - 왕권의 관
  - 왕실 관
  lexicon: HALOT
  rationale: 왕권을 나타내는 관이라는 점을 한국어에서 가장 직접적으로 드러내는 표준어 표현을 선택했습니다.
- source_word: בְּרֹאשׁוֹ
  english_pob_choice: on whose head
  chosen_korean: 그 머리에
  alternatives_korean:
  - 말의 머리에
  - 그의 머리에
  lexicon: HALOT
  rationale: 영어 POB의 주해처럼 지시 대상은 말이 가장 자연스러우므로, 한국어에서도 중복을 피하면서 문맥상 말의 머리를 가리키게 했습니다.
theological_decisions:
- issue: 명령문 화법의 재현
  chosen_reading: 아각 사람 하만의 요청을 왕의 수행 지시처럼 직접 화법으로 재현하여, 왕권 과시 의례의 긴박함을 살렸습니다.
  alternative_readings:
  - 중립적 서술문으로 완화해 옮김
  - 더 고전적인 기도체 명령으로 옮김
  rationale: 본문은 왕에게 드리는 보고가 아니라 궁정 의례를 위한 구체적 명령이므로, 합쇼체 명령형이 서사적 힘과 위계를 가장 잘 전달합니다.
  doctrine_reference: 서사체의 담화 기능 보존
