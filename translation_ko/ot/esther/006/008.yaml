source:
  edition: WLC
  text: יָבִ֨יאוּ֙ לְב֣וּשׁ מַלְכ֔וּת אֲשֶׁ֥ר לָֽבַשׁ בּ֖/וֹ הַ/מֶּ֑לֶךְ וְ/ס֗וּס אֲשֶׁ֨ר רָכַ֤ב עָלָי/ו֙ הַ/מֶּ֔לֶךְ וַ/אֲשֶׁ֥ר נִתַּ֛ן כֶּ֥תֶר מַלְכ֖וּת בְּ/רֹאשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
  footnotes:
  - marker: a
    text: Or, more literally, 'and which a royal crown was placed on its head.' The pronoun most naturally refers to the horse, though some readers have understood it to refer to the king.
    reason: alternative_reading
translation:
  language: ko
  text: 왕께서 입으셨던 왕복과 왕께서 타셨고 그 머리에 왕관이 씌워진 말을 가져오게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘그 머리’의 대명사는 가장 자연스럽게 말을 가리키지만, 일부는 왕을 가리킨다고 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  english_pob_choice: Let them bring
  chosen_korean: 가져오게 하십시오
  alternatives_korean:
  - 가져오십시오
  - 가져오게 하소서
  lexicon: HALOT
  rationale: 직접 화법의 지시문으로서 간접 명령의 힘을 살리되, 현대 한국어에서 자연스러운 합쇼체 명령형으로 옮겼습니다.
- source_word: לְבוּשׁ מַלְכּוּת
  english_pob_choice: a royal robe
  chosen_korean: 왕복
  alternatives_korean:
