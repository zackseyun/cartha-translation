  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָמָ֖ן אֶל הַ/מֶּ֑לֶךְ אִ֕ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
  footnotes:
  - marker: a
    text: Or, more formally, 'a man whom the king delights to honor.' The Hebrew אִישׁ is singular masculine and can be read indefinitely, but English idiom in this context favors 'the man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하만이 왕에게 말했습니다. 「왕께서 높이고자 하시는 사람은—」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ은 단수 남성형으로, 문맥상 영어처럼 ‘the man’으로도 읽을 수 있지만, 한국어에서는 특정 인물을 예고하는 관용에 따라 ‘사람’으로 자연화했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 드러내되, 한국어에서는 접속사보다 동사 중심의 평서가 더 매끄러워 ‘말했습니다’로 옮겼습니다.
- source_word: אֶל הַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 임금에게
  - 왕께
  lexicon: HALOT
  rationale: 대화 상대를 가리키는 기본 전치사구이므로 ‘왕에게’로 옮기되, 바로 뒤의 직접화법 표지와 결합해 한국어 문장 흐름을 살렸습니다.
- source_word: אִישׁ
  english_pob_choice: the man
  chosen_korean: 사람은
  alternatives_korean:
  - 그 사람은
  - 한 사람은
  lexicon: HALOT
  rationale: 히브리어 단수형 ‘אִישׁ’의 인칭성과 특정성은 유지하되, 이 문맥에서 미리 특정 인물을 가리키는 한국어 관용을 고려해 자연스럽게 ‘사람은’으로 처리했습니다.
- source_word: חָפֵץ בִּיקָרוֹ
  english_pob_choice: delights to honor
  chosen_korean: 높이고자 하시는
  alternatives_korean:
  - 존귀하게 여기고자 하시는
  - 존귀를 주고자 하시는
  - 영예를 주고자 하시는
  lexicon: HALOT
  rationale: ‘חָפֵץ’의 ‘기뻐하다/기꺼이 바라다’와 ‘יָקָר’의 ‘존귀/존중’ 결합을, 왕의 공적 승진·명예 부여 관용구로서 한국어 자연성에 맞게 ‘높이다’로 옮겼습니다.
