  source_fidelity: 원문의 시간 표현, 왕의 불면, 명령, 왕실 기록의 반입, 왕 앞에서의 낭독을 모두 충실히 반영합니다. 다만 히브리어의 복수 수동 표현에 대한 한국어 지시대명사 ‘그것들이’는 선행사와의 연결이 다소 부자연스럽습니다.
  naturalness: ‘그것들이 왕 앞에서 읽혔습니다’는 문법적으로 가능하지만, 현대 한국어 성서 서사에서는 무생물 복수 지시대명사가 어색하게 들립니다. ‘그 기록들이 … 낭독되었습니다’가 더 자연스럽고, 공적 기록을 소리 내어 읽는 장면도 더 분명히 합니다.
  terminology: ‘기록책, 곧 연대기’는 סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים의 동격적 성격과 왕실 기록 문맥을 적절히 전달합니다. ‘낭독되었습니다’는 נִקְרָאִים의 문맥상 공적 읽기를 자연스럽게 표현합니다.
