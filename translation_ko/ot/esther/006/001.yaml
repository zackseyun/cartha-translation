id: EST.6.1
reference: Esther 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
  footnotes:
  - marker: a
    text: Literally, 'the king's sleep fled.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the book of remembrances, the annals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 밤 왕은 잠을 이루지 못하였습니다. 그래서 왕은 기록책, 곧 연대기를 가져오라고 명령하였고, 그 기록들이 왕 앞에서 낭독되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  english_pob_choice: On that night
  chosen_korean: 그날 밤
  alternatives_korean:
  - 그 밤
  - 그날 밤에
  lexicon: WLC
  rationale: 특정성을 지닌 지시적 시간표현이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  english_pob_choice: the king could not sleep
  chosen_korean: 왕은 잠을 이루지 못하였습니다
  alternatives_korean:
  - 왕의 잠이 달아났습니다
  - 왕은 잠들지 못하였습니다
  lexicon: WLC
  rationale: 직역적 이미지인 ‘잠이 달아나다’를 살릴 수 있으나, 서사 문맥에서 자연스럽고 분명한 표현으로 수면의 불능을 전달했습니다.
- source_word: סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים
  english_pob_choice: the book of records, the chronicles
  chosen_korean: 기록책, 곧 연대기
  alternatives_korean:
  - 기억의 책, 곧 연대기
  - 기록의 책, 곧 일지
  lexicon: WLC
  rationale: ‘기억’ 계열의 어휘가 가능하지만 왕실 문맥의 공적 보관 기록이라는 기능을 드러내기 위해 ‘기록책’으로 옮기고, 뒤의 동격 표현은 ‘곧’으로 처리했습니다.
- source_word: וַיִּהְיוּ נִקְרָאִים לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: and they were read before the king
  chosen_korean: 그것들이 왕 앞에서 읽혔습니다
  alternatives_korean:
  - 그것들이 왕 앞에서 낭독되었습니다
  - 그것들이 왕의 앞에서 읽히고 있었습니다
  lexicon: WLC
  rationale: 복수형의 기록들이 왕 앞에서 낭독되는 장면을 그대로 살리되, 한국어 서사체에 맞게 수동 표현으로 정리했습니다.
