  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
  footnotes:
  - marker: a
    text: Bigthana is rendered from the Hebrew form in this verse; elsewhere the name appears as Bigthan.
    reason: alternative_reading
  - marker: b
    text: Or 'two of the king’s court officials'; the Hebrew term can denote eunuchs specifically or royal officers more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 모르드개가 문을 지키는 자들 가운데 속한 왕의 내시[b] 두 사람, 곧 빅다나와 데레스[a]가 아하수에로 왕을 해치려 했다고 알린 기록이 발견되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 빅다나는 이 절의 히브리어 형태를 따른 표기이며, 다른 곳에서는 빅단으로 나타납니다.
    reason: alternative_reading
  - marker: b
    text: ‘내시’로 옮겼지만, 히브리어 סָרִיס는 궁정 관리 전반을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  english_pob_choice: it was found written
  chosen_korean: 기록이 발견되었습니다
  alternatives_korean:
  - 기록이 적혀 있었습니다
  - 기록된 것이 발견되었습니다
  lexicon: HALOT
  rationale: 수동 구문과 기록 문맥을 살려, 문서가 조회되어 확인되었다는 뜻을 자연스럽게 전했습니다.
- source_word: הִגִּיד
  english_pob_choice: had reported
  chosen_korean: 알렸다는
  alternatives_korean:
  - 보고했다는
  - 말했다는
  lexicon: HALOT
  rationale: 공적 문서의 맥락에서 단순한 ‘말하다’보다 ‘알리다’가 더 적절하며, 원문의 ‘알려 주다/선포하다’ 의미를 반영합니다.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  english_pob_choice: two of the king’s eunuchs
  chosen_korean: 왕의 내시 두 사람
  alternatives_korean:
  - 왕의 관리 두 사람
  - 왕의 궁정 관리 두 사람
  lexicon: HALOT
  rationale: סריס는 궁정 맥락에서 ‘내시’가 기본 뜻이므로 이를 따랐고, 넓은 의미의 ‘관리’는 본문 주석으로 남길 수 있습니다.
- source_word: מִשֹּׁמְרֵי הַסַּף
  english_pob_choice: among those who guarded the threshold
  chosen_korean: 문을 지키는 자들 가운데 있는
  alternatives_korean:
  - 문지기들 가운데 있는
  - 문턱을 지키는 자들 가운데 있는
  lexicon: HALOT
  rationale: ‘מִן + 분류명사’의 소속/귀속 뉘앙스를 살리기 위해 ‘~가운데 있는’으로 옮겼고, סַף는 문맥상 ‘문’으로 자연스럽게 풀었습니다.
- source_word: לִשְׁלֹחַ יָד בַּמֶּלֶךְ
  english_pob_choice: to lay a hand on King Ahasuerus
  chosen_korean: 아하수에로 왕에게 손을 대려고 하였습니다
  alternatives_korean:
  - 아하수에로 왕을 치려고 하였습니다
  - 아하수에로 왕을 해치려고 하였습니다
  lexicon: HALOT
  rationale: 관용구를 직역하면 의미가 살아나지 않으므로, 한국어에서 자연스러운 위협 행위 표현으로 옮기되 원문의 폭력적 의도를 유지했습니다.
theological_decisions:
- issue: 이스라엘의 하나님 이름이 직접 나오지 않는 궁정 서술의 처리
  chosen_reading: 본문 자체를 역사 기록체로 유지하고, 신학적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님의 섭리를 더 분명히 드러내는 표현을 덧붙일 수 있음
