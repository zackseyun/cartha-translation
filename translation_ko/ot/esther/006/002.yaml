revisions:
- from: 모르드개가 빅다나와 데렛, 곧 왕의 내시 두 사람—문을 지키는 자들 가운데 있는—에 관하여 알렸다는 기록이 발견되었습니다. 그들은 아하수에로 왕에게 손을 대려고 하였습니다.[a][b]
  to: 모르드개가 문을 지키는 자들 가운데 속한 왕의 내시[b] 두 사람, 곧 빅다나와 데레스[a]가 아하수에로 왕을 해치려 했다고 알린 기록이 발견되었습니다.
  rationale: 인명 ‘데렛’을 원문에 맞는 ‘데레스’로 바로잡았습니다. 두 사람이 문지기 집단에 속한 왕의 내시였으며 왕을 해하려 했다는 사실이 모르드개의 보고 내용이라는 원문의 통사 관계를 한 문장 안에서 명확히 드러냈습니다. ‘해치려 했다고’는 폭력적 적대 의도를 전달하되 실제 실행 여부를 단정하지 않습니다. 각주 b는 설명 대상인 ‘내시’에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:26Z'
