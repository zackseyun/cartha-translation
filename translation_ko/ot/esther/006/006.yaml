source:
  edition: WLC
  text: וַ/יָּבוֹא֮ הָמָן֒ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ מַה לַ/עֲשׂ֕וֹת בָּ/אִ֕ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּ/יקָר֑/וֹ וַ/יֹּ֤אמֶר הָמָן֙ בְּ/לִבּ֔/וֹ לְ/מִ֞י יַחְפֹּ֥ץ הַ/מֶּ֛לֶךְ לַ/עֲשׂ֥וֹת יְקָ֖ר יוֹתֵ֥ר מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
  footnotes:
  - marker: a
    text: Or, 'And Haman said to himself.' The Hebrew reads literally, 'said in his heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 하만이 들어가니 왕이 그에게 말하였습니다. “왕이 존귀하게 하기를 기뻐하는 사람에게 어떻게 해야 합니까?” 하만이 속으로 말하였습니다. “왕이 나보다 더 존귀하게 하기를 기뻐할 사람이 누구이겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '마음속으로 말하였다'입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּבוֹא
  english_pob_choice: So Haman came in
  chosen_korean: 그래서 하만이 들어가니
  alternatives_korean:
  - 그때 하만이 들어오니
  - 그리고 하만이 들어가니
  lexicon: HALOT
  rationale: 방향동사 '들어가다'로 왕 앞에 들어가는 장면을 살리면서, 앞선 서술을 이어 주는 wayyiqtol의 흐름을 '그래서'로 자연스럽게 옮겼습니다.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  english_pob_choice: What should be done for the man
  chosen_korean: 사람에게 어떻게 해야 합니까
  alternatives_korean:
  - 그 사람에게 무엇을 해야 합니까
  - 그 사람을 위해 어떻게 해야 합니까
  lexicon: HALOT
  rationale: 무엇을 '하다'의 관용적 질문 구조를 한국어에 맞게 풀어, 수동적·행위 지시적 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  english_pob_choice: whom the king delights to honor
  chosen_korean: 왕이 존귀하게 하기를 기뻐하는
  alternatives_korean:
  - 왕이 높이기를 기뻐하는
  - 왕이 영예롭게 하기를 바라는
  lexicon: HALOT
  rationale: חָפֵץ의 '기뻐하다/즐거워하다'와 יְקָר의 '존귀/존귀하게 함'을 함께 살려, 단순한 '존경'보다 왕의 의도적 영예 수여를 드러냈습니다.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  english_pob_choice: And Haman said in his heart
  chosen_korean: 하만이 속으로 말하였습니다
  alternatives_korean:
  - 하만이 마음속으로 말하였습니다
  - 하만이 스스로 생각하였습니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 '마음속으로 말하다'를 한국어에서 자연스러운 내부 독백 표현인 '속으로 말하다'로 옮겼습니다.
- source_word: יוֹתֵר מִמֶּנִּי
  english_pob_choice: more than me
  chosen_korean: 나보다 더
  alternatives_korean:
  - 내가 보기보다 더
  - 나를 넘어 더
  lexicon: HALOT
  rationale: 비교 구문을 현대 한국어의 자연스러운 어순으로 옮기되, 하만의 자기중심적 과장을 분명히 드러냈습니다.
theological_decisions:
- issue: 왕의 질문이 실제로는 하만의 자만심을 유도하는 서사적 아이러니를 형성하는지
  chosen_reading: 본문은 왕의 질문과 하만의 내적 독백을 병치해, 하만이 스스로를 지극히 높이는 방향으로 오해하도록 서술합니다.
  alternative_readings:
  - 단순한 궁정 예절 질문으로만 읽는 것
  - 내적 독백을 약화시켜 단순 추측으로 읽는 것
  rationale: 히브리어의 직접적 내면 발화와 왕의 존귀 표현을 그대로 살려야 서사의 아이러니와 하만의 오만이 훼손되지 않습니다.
  doctrine_reference: 서사신학 / 잠언적 교만 비판의 문맥
- issue: ‘존귀하게 하다’의 번역이 전통적 교회어 ‘영광’으로 흡수되는 문제
  chosen_reading: 여기서는 왕이 사람에게 공적 명예를 부여하는 의미이므로 '존귀하게 하다'를 사용했습니다.
  alternative_readings:
  - 영광스럽게 하다
  - 높이다
  rationale: יְקָר는 하나님께 돌리는 영광이 아니라 왕이 수여하는 사회적 명예이므로, 구별되는 한국어로 옮겨야 원문의 궁정적 의미가 보존됩니다.
  doctrine_reference: 어휘-의미 구별 / 왕권 서사
