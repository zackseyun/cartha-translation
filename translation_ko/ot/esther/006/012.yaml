id: EST.6.12
reference: Esther 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֥שָׁב מָרְדֳּכַ֖י אֶל שַׁ֣עַר הַ/מֶּ֑לֶךְ וְ/הָמָן֙ נִדְחַ֣ף אֶל בֵּית֔/וֹ אָבֵ֖ל וַ/חֲפ֥וּי רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
  footnotes:
  - marker: a
    text: Or 'was driven to his house,' preserving the passive force of the Hebrew verb.
    reason: lexical_alternative
  - marker: b
    text: Covering the head was a cultural sign of grief, humiliation, or mourning.
    reason: cultural_note
translation:
  language: ko
  text: 그때 모르드개는 왕의 문으로 돌아갔고, 하만은 슬퍼하며 머리를 가린 채 자기 집으로 급히 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 נִדְחַף는 ‘밀려가다/몰리다’의 수동적 뉘앙스도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 머리를 가리는 행위는 애도, 굴욕, 수치의 문화적 표지였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아갔고
  alternatives_korean:
  - 되돌아갔고
  - 다시 갔고
  lexicon: HALOT
  rationale: שׁוּב의 서사적 완료 동작을 자연스러운 현대 한국어로 옮기되, 단순 이동이 아니라 이전 자리로의 복귀라는 뜻을 살렸습니다.
- source_word: שַׁעַר הַמֶּלֶךְ
  english_pob_choice: the king’s gate
  chosen_korean: 왕의 문
  alternatives_korean:
  - 왕궁 문
  - 왕의 성문
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 직역하되, 한국어에서는 간결하게 '왕의 문'이 가장 직접적이고 본문 의미를 충분히 전달합니다.
- source_word: נִדְחַף
  english_pob_choice: hurried
  chosen_korean: 급히 갔습니다
  alternatives_korean:
  - 몰려갔습니다
  - 쫓기듯 갔습니다
  - 밀려갔습니다
  lexicon: HALOT
  rationale: 수동/추동 뉘앙스가 있지만 문맥상 수치스러운 급박한 퇴장에 초점을 둔 POB의 해석을 따라, 외적 원인을 단정하지 않는 '급히'로 옮겼습니다.
- source_word: חֲפוּי רֹאשׁ
  english_pob_choice: with his head covered
  chosen_korean: 머리를 가린 채
  alternatives_korean:
  - 머리를 덮은 채
  - 머리를 가리고
  lexicon: HALOT
  rationale: 그리스도교 관용구로 평탄화하지 않고, 머리를 가리는 구체적 몸짓을 그대로 살려 수치와 애도의 표지를 드러냈습니다.
theological_decisions:
- issue: 하만의 상태를 해석어로 완화할지 여부
  chosen_reading: '''슬퍼하며 머리를 가린 채''로 애도와 수치를 함께 보이게 했습니다.'
  alternative_readings:
  - '''수치스러워하며''만 강조'
  - '''슬퍼하며''만 강조'
  rationale: 히브리어 אָבֵל과 חֲפוּי רֹאשׁ는 단순한 감정 표현을 넘어 공개적 애도/굴욕의 몸짓을 함께 담으므로, 둘 다 보이도록 유지하는 것이 본문 충실도에 유리합니다.
  doctrine_reference: 서사 본문 해석의 충실성 및 문맥적 관찰
