  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/הָמָ֗ן מַ֠הֵר קַ֣ח אֶת הַ/לְּב֤וּשׁ וְ/אֶת הַ/סּוּס֙ כַּ/אֲשֶׁ֣ר דִּבַּ֔רְתָּ וַֽ/עֲשֵׂה כֵן֙ לְ/מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י הַ/יּוֹשֵׁ֖ב בְּ/שַׁ֣עַר הַ/מֶּ֑לֶךְ אַל תַּפֵּ֣ל דָּבָ֔ר מִ/כֹּ֖ל אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
  footnotes:
  - marker: a
    text: Or, more literally, “Do not let a thing fall from all that you have said,” an idiom meaning to omit nothing.
    reason: lexical_alternative
  - marker: b
    text: “The Jew” could also be rendered “the Judean,” but here it most likely marks Mordecai’s ethnic-religious identity within the story.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 하만에게 말했습니다. 「어서 하만이 말한 대로 그 옷과 그 말을 가져다가, 왕궁 문에 앉아 있는 유대인 모르드개에게 그대로 하십시오. 하만이 말한 모든 것에서 하나도 빼지 마십시오.」[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인’은 ‘유다 사람’ 또는 ‘유다인’으로도 옮길 수 있습니다. 그러나 여기서는 모르드개의 민족·종교적 정체성을 가리키는 표현으로 보았습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하만이 말한 모든 것에서 하나도 빼지 마십시오’는 직역하면 ‘하만이 말한 모든 것에서 한 가지도 떨어지게 하지 마십시오’라는 관용구로, 아무것도 생략하지 말고 모두 실행하라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: מַהֵר
  english_pob_choice: Hurry
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 서둘러 가십시오
  lexicon: HALOT
  rationale: 즉각적인 행동을 촉구하는 명령형을 현대 한국어로 자연스럽게 살리면서도, 지나치게 구어체가 되지 않게 했습니다.
- source_word: הַלְּבוּשׁ
  english_pob_choice: the robe
  chosen_korean: 옷
  alternatives_korean:
  - 겉옷
  - 예복
  lexicon: HALOT
  rationale: 직전 문맥의 왕복을 가리키지만, 한국어에서는 특정 왕복을 단정하지 않고 넓게 ‘옷’으로 옮겨 원문이 허용하는 범위를 유지했습니다.
- source_word: הַסּוּס
  english_pob_choice: the horse
  chosen_korean: 말
  alternatives_korean:
  - 그 말
  - 왕의 말
  lexicon: HALOT
  rationale: 원문은 단순히 ‘말’이므로, 문맥상 왕실의 말이라는 함의를 덧붙이기보다 기본 의미를 유지했습니다.
- source_word: הַיְּהוּדִי
  english_pob_choice: the Jew
  chosen_korean: 유다 사람
  alternatives_korean:
  - 유대인
  - 유다인
  lexicon: HALOT
  rationale: 에스더서 문맥에서 민족·종교적 정체성을 드러내는 표현으로 이해하면서도, 한국어에서 전통 교회식 명칭보다 원문 지시를 더 직접적으로 반영하는 ‘유다 사람’을 택했습니다.
- source_word: אַ ל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  english_pob_choice: Leave out nothing from all that you have said
  chosen_korean: 네가 말한 것에서 아무것도 빠뜨리지 마십시오
  alternatives_korean:
  - 네가 말한 것에서 하나도 빼지 마십시오
  - 네가 말한 모든 것에서 아무것도 누락하지 마십시오
  lexicon: HALOT
  rationale: ‘떨어뜨리다/빠지다’의 관용적 뉘앙스를 한국어에서는 ‘빠뜨리다’로 옮겨, 빠짐 없이 그대로 실행하라는 강한 명령을 분명하게 전달했습니다.
theological_decisions:
- issue: 왕의 직접 명령문에서의 높임말 처리
  chosen_reading: 서술문은 합쇼체로 유지하되, 왕의 발화는 자연스러운 명령과 위엄을 드러내는 형태로 옮겼습니다.
  alternative_readings:
  - 더 낮은 구어체 명령
  - 더 고전적인 성경체 명령
  rationale: 원문은 왕의 권위 있는 즉시 명령을 보여 주므로, 현대 공용어체 안에서 명령의 긴박성과 위계를 함께 살리는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 화법 및 담화 기능
