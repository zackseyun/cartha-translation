  source_fidelity: 원문의 동사 וַיַּרְכִּיבֵהוּ는 모르드개를 말에 타게 한 사역 행위를 뜻합니다. 초안의 ‘그를 태워 성읍 광장을 지나며’는 누가 광장을 지나는지와 사역의 범위가 문법적으로 다소 불분명합니다. 또한 כָּכָה יֵעָשֶׂה는 당위(‘하여야 합니다’)보다 미래의 수동적·관용적 선포(‘이와 같이 할 것입니다’)에 가깝습니다.
  naturalness: ‘그를 그 말에 태워 성읍 광장을 지나게 하고’로 고치면 행위의 관계가 자연스럽고 명료합니다. 인용문의 ‘왕께서 … 기뻐하시는 사람’은 현대 격식체에 적합하며, ‘이와 같이 할 것입니다’는 공개 선포의 문체를 유지합니다.
  terminology: ‘모르드개’, ‘성읍’, ‘존귀하게 하다’는 적절합니다. 정관성을 반영하여 ‘그 옷과 그 말’로 하였고, 왕의 존칭은 서술·인용문 안에서 일관되게 ‘왕께서’로 처리했습니다. 본문이 사역 의미를 직접 드러내므로 기존의 대안 각주는 실질적인 대안을 제공하지 않아 삭제했습니다.
