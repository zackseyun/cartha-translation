  text: וַ/יִּקַּ֤ח הָמָן֙ אֶת הַ/לְּב֣וּשׁ וְ/אֶת הַ/סּ֔וּס וַ/יַּלְבֵּ֖שׁ אֶֽת מָרְדֳּכָ֑י וַ/יַּרְכִּיבֵ֨/הוּ֙ בִּ/רְח֣וֹב הָ/עִ֔יר וַ/יִּקְרָ֣א לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
  footnotes:
  - marker: a
    text: 'Or “made him ride through the city square.” The Hebrew verb is causative: Haman caused Mordecai to ride in the public procession.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 하만이 그 옷과 말을 가져다가 모르드개에게 입히고, 그를 태워 성읍 광장을 지나며, 그 앞에서 외쳤습니다. “왕이 존귀하게 하기를 기뻐하는 사람에게는 이렇게 하여야 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 말에 태워 성읍 광장을 지나게 하였다.” 히브리어 동사는 사역형으로, 하만이 모르드개가 공적 행렬에 타게 한 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  english_pob_choice: the robe
  chosen_korean: 그 옷
  alternatives_korean:
  - 그 겉옷
  - 그 예복
  lexicon: HALOT
  rationale: 문맥상 이미 특정된 왕의 옷을 가리키므로 정관적 지시를 살려 ‘그 옷’으로 옮겼습니다. ‘예복’은 해석을 더해 위엄을 주지만 원문의 직접성은 덜합니다.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  english_pob_choice: clothed Mordecai
  chosen_korean: 모르드개에게 입히고
  alternatives_korean:
  - 모르드개를 입히고
  - 모르드개를 옷 입히고
  lexicon: HALOT
  rationale: 히필형 ‘입히다’의 사역적 의미를 자연스러운 한국어로 살렸습니다.
- source_word: וַיַּרְכִּיבֵהוּ
  english_pob_choice: led him on horseback
  chosen_korean: 그를 태워
  alternatives_korean:
  - 그를 말에 태워
  - 그가 타게 하여
  lexicon: HALOT
  rationale: 원문은 모르드개가 말에 오르게 되는 사역을 나타내므로, 한국어에서는 간결하게 ‘그를 태워’로 처리하되 뒤의 이동 동사와 함께 공적인 행렬의 의미를 보존했습니다.
- source_word: בִּרְחוֹב הָעִיר
  english_pob_choice: through the city square
  chosen_korean: 성읍 광장을 지나며
  alternatives_korean:
  - 성읍의 광장을 지나며
  - 도성의 광장을 지나며
  lexicon: HALOT
  rationale: רְחוֹב은 단순한 거리보다 공적 광장에 가까워 ‘광장’이 적절합니다. ‘성읍’은 히브리어의 도시-공적 공간 분위기를 유지합니다.
- source_word: כָּכָה יֵעָשֶׂה
  english_pob_choice: Thus shall it be done
  chosen_korean: 이렇게 하여야 합니다
  alternatives_korean:
  - 이같이 행하여야 합니다
  - 이와 같이 해야 합니다
  lexicon: HALOT
  rationale: 선포문체의 미래-당위적 어감을 한국어의 공손한 명령/진술형으로 옮겼습니다. 직역된 ‘이같이 행하여야 합니다’보다 자연스럽고 공적 선언에 맞습니다.
- source_word: חָפֵץ בִּיקָרוֹ
  english_pob_choice: delights to honor
  chosen_korean: 존귀하게 하기를 기뻐하는
  alternatives_korean:
  - 존귀하게 하기를 즐거워하는
  - 존귀하게 해 주기를 좋아하는
  lexicon: HALOT
  rationale: חפץ의 ‘기뻐하다/즐거워하다’와 יקר의 ‘존귀, 존중’ 의미를 함께 살려, 왕의 적극적 호의를 드러냈습니다.
theological_decisions:
- issue: 왕의 공적 선포문의 문체
  chosen_reading: 직접 인용부 안에서는 공문적·반복적 선언 어조를 유지하되, 한국어는 합쇼체로 정리했습니다.
  alternative_readings:
  - 보다 구어적인 평서문
  - 옛 문체의 하옵나이다식 번역
  rationale: 본문은 왕의 은총을 알리는 공개 선포이므로, 현대 한국어에서도 격식 있는 공적 문체가 어울립니다. 다만 고어체는 피하고 현대 출판용 표준어를 유지했습니다.
  doctrine_reference: 서사 본문 번역의 문체 일관성
