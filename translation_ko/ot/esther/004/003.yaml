reference: Esther 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל מְדִינָ֣ה וּ/מְדִינָ֗ה מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ אֵ֤בֶל גָּדוֹל֙ לַ/יְּהוּדִ֔ים וְ/צ֥וֹם וּ/בְכִ֖י וּ/מִסְפֵּ֑ד שַׂ֣ק וָ/אֵ֔פֶר יֻצַּ֖ע לָֽ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
  footnotes:
  - marker: a
    text: Or 'sackcloth and ashes were used by many.' The Hebrew לָרַבִּים after 'were spread out' is concise and may indicate either widespread use among many people or that these mourning items were spread out for many.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 지방에서, 왕의 명령과 조서가 이르는 곳마다 유다인들 가운데 큰 애통이 있었습니다. 그들은 금식하고 울며 애곡하였고, 많은 사람들을 위하여 굵은 베와 재가 펼쳐 놓였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람이 굵은 베와 재를 사용하였다.’ 히브리어 לָרַבִּים은 간결하여, 많은 사람 사이에 이러한 애도의 표지가 널리 사용되었음을 가리킬 수도 있고, 굵은 베와 재가 많은 사람을 위하여 펼쳐 놓였음을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  english_pob_choice: in every province
  chosen_korean: 각 도와 도마다
  alternatives_korean:
  - 모든 도마다
  - 각 지방마다
  lexicon: HALOT
  rationale: 반복 구조를 한국어의 분배적 표현인 ‘각 도와 도마다’로 옮겨 전체성을 살리면서도 자연스럽게 읽히게 했습니다.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  english_pob_choice: the king’s word and his decree
  chosen_korean: 왕의 말과 그의 조서
  alternatives_korean:
  - 왕의 말과 그의 decree
  - 왕의 명령과 그의 조서
  lexicon: HALOT
  rationale: דְּבַר는 ‘말’이면서도 왕실 공문맥에서는 전달된 왕의 발언/공지까지 포괄하므로 ‘말’로 살리고, דָת는 페르시아 궁정의 공식 문서 성격을 드러내는 ‘조서’로 옮겼습니다.
- source_word: אֵבֶל גָּדוֹל ... וְצוֹם וּבְכִי וּמִסְפֵּד
  english_pob_choice: there was great mourning ... with fasting and weeping and lamentation
  chosen_korean: 큰 애곡이 있었습니다. 금식과 울음과 통곡이 있었고
  alternatives_korean:
  - 큰 슬픔이 있었습니다. 금식과 울음과 애통이 있었습니다
  - 큰 곡함이 있었습니다. 금식과 울음과 비탄이 있었습니다
  lexicon: HALOT
  rationale: אֵבֶל은 일반적 슬픔보다 장례·재난 맥락의 애곡/애통에 가깝기 때문에 ‘애곡’을 택했고, מִסְפֵּד는 공적 lament의 뉘앙스를 살려 ‘통곡’으로 옮겼습니다.
- source_word: שַׂק וָאֵפֶר יֻצַּע לָרַבִּים
  english_pob_choice: sackcloth and ashes were spread out for many
  chosen_korean: 굵은 베와 재가 많은 이들에게 펼쳐졌습니다
  alternatives_korean:
  - 굵은 베와 재가 많은 이들을 위해 펼쳐졌습니다
  - 굵은 베와 재가 많은 사람들 가운데 펼쳐졌습니다
  lexicon: HALOT
  rationale: 수동형 יֻצַּע의 ‘펴 놓다/펼치다’ 이미지를 살리되, לָרַבִּים의 간결함은 ‘많은 이들에게’로 처리해 ‘많은 사람들’ 쪽으로 넓게 읽힐 여지를 남겼습니다.
theological_decisions:
- issue: 왕의 조서가 미친 결과를 통한 공동체적 애곡의 범위
  chosen_reading: 조서가 이르는 곳마다 유다인들 가운데 집단적 애곡이 일어난다는 서술로 옮겼습니다.
  alternative_readings:
  - 유다인들을 위한 슬픔으로 읽을 수 있음
  - 많은 이들이 애곡 도구를 사용했다는 물품 중심의 읽기
  rationale: 본문은 단순한 감정 묘사가 아니라 제국의 명령이 유다 공동체 전체에 끼친 실제적·공적 충격을 보여 주므로, 공동체적 애곡과 금식의 반응을 분명히 드러냈습니다.
  doctrine_reference: 공동체적 탄식과 금식의 성서적 패턴
