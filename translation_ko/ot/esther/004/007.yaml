  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
  footnotes:
  - marker: a
    text: Or 'the full account of the money' or 'the sum of money.' The Hebrew phrase refers to the specified amount Haman proposed to pay.
    reason: lexical_alternative
translation:
  language: ko
  text: 모르드개가 그에게 자기에게 일어난 모든 일과, 하만이 유대인들을 멸하려고 왕의 국고에 은을 달아 내겠다고 한 은의 정확한 액수를 알려 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 돈의 내역’이나 ‘은의 액수’. 히브리어 פָּרָשַׁת הַכֶּסֶף는 하만이 지불하겠다고 제시한 특정한 액수를, 또는 그 돈에 관한 상세한 내용을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  english_pob_choice: told
  chosen_korean: 알려 주었습니다
  alternatives_korean:
  - 말했습니다
  - 전했습니다
  - 이야기했습니다
  lexicon: HALOT נגד (Hiphil)
  rationale: נגד의 사역적 의미인 ‘알리다/전하다’를 자연스러운 현대 서술로 옮기되, 단순 회화체보다 정보 전달의 성격이 드러나도록 했습니다.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  english_pob_choice: everything that had happened to him
  chosen_korean: 자신에게 일어난 모든 일
  alternatives_korean:
  - 자신에게 닥친 모든 일
  - 그에게 일어난 모든 것
  lexicon: HALOT קרה + 접미사
  rationale: קוראה의 ‘일어나다/닥치다’ 의미와 인칭 접미사를 살려, 모르드개에게 실제로 발생한 사건 전반을 가리키는 표현으로 옮겼습니다.
- source_word: פָּרָשַׁת הַכֶּסֶף
  english_pob_choice: the exact amount of money
  chosen_korean: 정확한 금액
  alternatives_korean:
  - 돈의 정확한 액수
  - 그 돈의 상세한 내역
  lexicon: HALOT פרשׁה
  rationale: פָּרָשָׁה가 여기서는 단순한 ‘돈’이 아니라 하만이 제시한 특정한 액수, 곧 지정된 금액을 뜻하므로 ‘정확한 금액’으로 압축해 살렸습니다.
- source_word: לִשְׁקוֹל
  english_pob_choice: weigh out
  chosen_korean: 달아 내겠다고
  alternatives_korean:
  - 달아 주겠다고
  - 무게를 달아 내겠다고
  - 지불하겠다고
  lexicon: HALOT שקל
  rationale: 은을 무게로 재는 고대 경제 이미지를 보존하기 위해 일반적인 ‘지불하다’보다 ‘달아 내다’를 택했습니다.
theological_decisions:
- issue: 유대인들에 대한 하만의 목적 표현
  chosen_reading: 유대인들을 멸하려고
  alternative_readings:
  - 유대인들을 죽이려고
  - 유대인들을 멸망시키려고
  rationale: 히브리어 לְאַבְּדָם은 단순 피해가 아니라 파괴·말살의 의도를 분명히 하므로, 그 강도를 지나치게 약화하지 않는 ‘멸하려고’로 옮겼습니다.
  doctrine_reference: 본문의 서술적 강조(파괴 의도)
