  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּב֕וֹא עַ֖ד לִ/פְנֵ֣י שַֽׁעַר הַ/מֶּ֑לֶךְ כִּ֣י אֵ֥ין לָ/ב֛וֹא אֶל שַׁ֥עַר הַ/מֶּ֖לֶךְ בִּ/לְב֥וּשׁ שָֽׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
  footnotes:
  - marker: a
    text: Or 'up to the presence of the king’s gate' / 'before the king’s gate.' The Hebrew emphasizes that he approached only to the point in front of it.
    reason: lexical_alternative
  - marker: b
    text: The clause may also be expressed more formally as 'for there was no entering the king’s gate in sackcloth.' The sense is that entry in mourning attire was forbidden.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 왕의 문 앞까지 이르렀습니다.[a] 베옷을 입고는 아무도 왕의 문으로 들어갈 수 없었기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 문 앞까지’는 히브리어가 그가 문 앞의 지점까지만 다가갔음을 강조하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베옷’은 애도와 슬픔을 나타내는 옷차림입니다. 여기서는 베옷 차림으로 왕의 문에 들어가는 것이 허용되지 않았음을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: He came
  chosen_korean: 그는 … 이르렀습니다
  alternatives_korean:
  - 그는 왔습니다
  - 그는 도착했습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol의 이동 완료를 자연스러운 현대 문체로 옮기되, 뒤이어 나오는 ‘문 앞까지’라는 제한을 살려 ‘이르렀습니다’로 처리했습니다.
- source_word: עַד לִפְנֵי
  english_pob_choice: as far as the front of
  chosen_korean: 왕의 문 앞까지
  alternatives_korean:
  - 왕의 문 앞에
  - 왕의 문 앞쪽까지
  lexicon: HALOT
  rationale: ‘문 앞의 지점까지만’이라는 도달 한계를 분명히 하면서도 한국어에서 가장 자연스러운 공간 표현으로 옮겼습니다.
- source_word: בִּלְבוּשׁ שָׂק
  english_pob_choice: clothed in sackcloth
  chosen_korean: 베옷을 입었기 때문에
  alternatives_korean:
  - 베옷 차림이었기 때문에
  - 베옷을 입고 있었기 때문에
  lexicon: HALOT
  rationale: ‘sackcloth’는 애도복을 가리키는 전통적 대응어인 ‘베옷’으로 옮겼고, 출입 금지의 이유를 한국어 문맥상 가장 분명하게 드러내기 위해 원인절로 처리했습니다.
theological_decisions:
- issue: 왕의 문 출입 금지의 의미
  chosen_reading: 애도복인 베옷 차림은 왕의 문으로 들어가는 것을 허용하지 않는 상황으로 이해했습니다.
  alternative_readings:
  - 단순히 예복이 아니어서 들어갈 수 없다는 뜻
  - 문 앞에만 머물 수 있었다는 뜻
  rationale: 히브리어의 ‘들어갈 수 없었다’는 실제 출입 제한을 가리키며, 본문은 그 금지 사유를 베옷 차림과 직접 연결합니다. 한국어 본문도 그 제한의 강도를 유지해야 합니다.
  doctrine_reference: 본문의 사회적·궁정적 금지 규정
