  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: ko
  text: 그러자 모르드개가 에스더에게 대답하게 하여 말했습니다. “왕궁에 있다고 해서 너만 모든 유대인 가운데서 빠져나갈 수 있다고 생각하지 마십시오.”
  philosophy: formal
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל אֶסְתֵּר
  english_pob_choice: Then Mordecai said to reply to Esther
  chosen_korean: 그러자 모르드개가 에스더에게 대답하게 하여 말했습니다
  alternatives_korean:
  - 그러자 모르드개가 에스더에게 답하라고 말했습니다
  - 그러자 모르드개가 에스더에게 답변을 전하게 했습니다
  lexicon: מָרְדֳּכַי / לְהָשִׁיב
  rationale: 히브리어는 모르드개가 에스더에게 직접 말한 것이 아니라 ‘대답하게 하여’라는 중간 표현을 쓰므로, 영어 POB의 구조를 살리되 한국어도 간접화된 행위를 분명히 드러냈습니다.
- source_word: אַל תְּדַמִּי
  english_pob_choice: Do not imagine
  chosen_korean: 생각하지 마십시오
  alternatives_korean:
  - 상상하지 마십시오
  - 여기지 마십시오
  lexicon: דָּמָה
  rationale: 문맥상 단순한 상상이 아니라 잘못된 안도감을 경계하는 금지이므로, 자연스러운 경고로서 ‘생각하지 마십시오’로 옮겼습니다.
- source_word: בְנַפְשֵׁךְ
  english_pob_choice: that you alone
  chosen_korean: 너만
  alternatives_korean:
  - 네 마음속으로
  - 네 자신에게서
  lexicon: נֶפֶשׁ
  rationale: 직역하면 ‘네 안에서/네 생명으로’의 관용이지만, 여기서는 ‘오직 너만’이라는 배타적 의미가 핵심이므로 영어 POB의 ‘you alone’에 맞춰 압축했습니다.
- source_word: מִכָּל הַיְּהוּדִים
  english_pob_choice: of all the Jews
  chosen_korean: 모든 유대인 가운데서
  alternatives_korean:
  - 모든 유대인보다
  - 모든 유대인 중에서
  lexicon: יְהוּדִים
  rationale: 비교가 아니라 범위 안에서의 예외 가능성을 말하므로, 한국어에서는 ‘가운데서’로 집합 속 예외를 분명히 했습니다.
theological_decisions:
- issue: 왕궁의 안전감에 대한 경고
  chosen_reading: 에스더가 왕궁에 있다는 사실이 유대인 전체의 위험에서 그녀를 자동으로 보호하지 않는다는 경고로 읽었습니다.
  alternative_readings:
  - 왕의 집에 있으면 안전하다는 통념을 반박하는 일반적 격언으로 읽을 수 있습니다
  - ‘빠져나가다’의 가능성을 단순한 생존 여부가 아니라 심판의 책임 회피로 볼 수 있습니다
  rationale: 히브리어와 영어 POB 모두 에스더의 예외적 지위가 구원을 보장하지 않는다는 긴장을 유지합니다.
  doctrine_reference: 섭리와 책임의 긴장
