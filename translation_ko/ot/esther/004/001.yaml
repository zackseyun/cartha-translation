  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
  footnotes:
  - marker: a
    text: Or 'cried out a great and bitter cry.' The Hebrew uses a verb with a cognate noun for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 모르드개가 모든 일이 벌어진 것을 알게 되자, 그는 옷을 찢고 굵은 베옷을 입고 재를 뒤집어썼습니다. 그리고 도성 한가운데로 나가서 크고 쓰라린 부르짖음을 질렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부르짖다’라는 동사와 같은 어근의 명사를 함께 사용하여 강조합니다.
    reason: source_language_explanation
lexical_decisions:
- source_word: יָדַע
  english_pob_choice: learned
  chosen_korean: 알고 나서
  alternatives_korean:
  - 알게 되자
  - 알아차리고
  lexicon: HALOT
  rationale: 이 동사는 단순한 보유 지식보다 사건을 접해 새로 인지하게 된 뜻이므로, 한국어에서는 결과를 드러내는 ‘알고 나서’로 ingressive한 의미를 살렸습니다.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  english_pob_choice: all that had been done
  chosen_korean: 자기에게 일어난 모든 일
  alternatives_korean:
  - 모든 일이 행해진 것
  - 일어난 모든 것
  lexicon: HALOT
  rationale: 수동 구문이 가리키는 사건 전체를 자연스럽게 풀어, 무엇이 ‘행해졌는지’보다 모르드개가 처한 상황의 총체를 한국어로 분명히 했습니다.
- source_word: שַׂק וָאֵפֶר
  english_pob_choice: sackcloth and ashes
  chosen_korean: 굵은 베와 재
  alternatives_korean:
  - 베옷과 재
  - 금식복과 재
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 현대 한국어에서 이해되는 애도·굴욕의 상징으로 옮겼습니다.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  english_pob_choice: cried out with a loud and bitter cry
  chosen_korean: 크고 쓰라린 울부짖음을 질렀습니다
  alternatives_korean:
  - 크고 쓰라린 부르짖음을 질렀습니다
  - 크고 쓰라리게 외쳤습니다
  lexicon: HALOT
  rationale: 동사와 동족 목적어의 강조를 한국어에서 어색하지 않게 전달하기 위해 ‘울부짖음’과 ‘질렀습니다’를 사용해 강한 감정과 반복 강조를 반영했습니다.
theological_decisions:
- issue: 본문의 애통 표현 강도
  chosen_reading: 단순한 슬픔이 아니라 공적이고 격렬한 애통과 항의로 읽히는 표현을 유지했습니다.
  alternative_readings:
  - 조용히 슬퍼했습니다
  - 큰 소리로 슬퍼했습니다
  rationale: ‘크고 쓰라린 울부짖음’은 애도의 감정뿐 아니라 위기 앞의 공개적 탄식까지 드러내므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 서사적 애도 표현의 문학적 기능
