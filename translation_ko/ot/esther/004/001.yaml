- from: 모르드개가 자기에게 일어난 모든 일을 알고 나서, 옷을 찢고 굵은 베와 재를 입었습니다. 그러고는 성읍 한가운데로 나가 크고 쓰라린 울부짖음을 질렀습니다.[a]
  to: 모르드개가 모든 일이 벌어진 것을 알게 되자, 그는 옷을 찢고 굵은 베옷을 입고 재를 뒤집어썼습니다. 그리고 도성 한가운데로 나가서 크고 쓰라린 부르짖음을 질렀습니다.[a]
  rationale: 원문의 범위를 모르드개 개인사로 축소하지 않고, 수동적으로 벌어진 사건 전체라는 뜻을 자연스러운 한국어로 옮겼습니다. 애도 행위는 한국어 관용에 맞게 표현하되 원문의 굵은 베옷과 재를 모두 보존했습니다. 마지막 절의 동족어 강조는 본문과 중복되지 않는 설명 각주로 처리했습니다.
