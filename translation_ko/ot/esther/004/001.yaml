review_pass:
  verdict: revise
  source_fidelity: ‘자기에게 일어난 모든 일’은 히브리어의 ‘일어난/행해진 모든 것’에 ‘자기에게’라는 제한을 더하며, 수동적 표현도 약화합니다. ‘모든 일이 벌어진 것을’은 문맥상 사건의 총체를 자연스럽게 나타내면서 그 제한을 피합니다. ‘굵은 베와 재를 입었습니다’는 재를 ‘입는다’고 하는 한국어의 결합이 다소 부자연스럽습니다. ‘굵은 베옷을 입고 재를 뒤집어썼습니다’는 애도의 관습적 행동을 충실하고 자연스럽게 전달합니다.
  naturalness: 합쇼체는 일관되지만, ‘성읍’은 현대 표준어 성경 번역에서 가능하나 ‘도성’보다 특별히 요구되지 않는 한 다소 문어적입니다. ‘도성 한가운데로 나가서’는 현대적이면서도 공간 표현을 보존합니다. ‘부르짖음’을 사용하면 זעק/זעקה의 동족어 강조와 공적 절규의 성격을 무리 없이 살릴 수 있습니다.
  terminology: 모르드개, 굵은 베옷, 재는 적절합니다. ‘울부짖음’도 가능하지만, ‘부르짖음’이 히브리어 זעק의 호소성·절규성을 더 넓게 보존합니다. 현 각주는 본문과 동일한 문구를 ‘또는’으로 제시하므로 유효한 대안이 아니며, 동족어 강조를 설명하는 주석으로 고쳐야 합니다.
  issues:
  - severity: medium
    issue: ‘자기에게 일어난 모든 일’
    rationale: 원문 כָּל אֲשֶׁר נַעֲשָׂה는 모르드개 개인에게 일어난 일로 한정하지 않고, 벌어진/행해진 모든 일을 가리킵니다.
  - severity: low
    issue: ‘굵은 베와 재를 입었습니다’
    rationale: 히브리어의 병렬 목적어는 유지하지만, 한국어에서는 재를 ‘입었다’고 하기보다 재를 뒤집어쓰거나 몸에 뿌린 것으로 표현하는 편이 자연스럽습니다.
  - severity: medium
    issue: 각주 a가 본문을 그대로 반복함
    rationale: ‘또는’ 뒤의 문구가 본문과 동일하여 대안 번역으로 기능하지 않습니다. 원문의 동사와 동족 명사 결합에 대한 설명으로 바로잡아야 합니다.
  revised_text: 모르드개가 모든 일이 벌어진 것을 알게 되자, 그는 옷을 찢고 굵은 베옷을 입고 재를 뒤집어썼습니다. 그리고 도성 한가운데로 나가서 크고 쓰라린 부르짖음을 질렀습니다.[a]
