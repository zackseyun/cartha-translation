revisions:
- from: 그러자 에스더가 왕의 내시들 가운데 하나인 하닥[a]을 불러, 그가 자기 앞에 서도록 왕이 세운 자에게 모르드개에 관한 일을 맡기고, 이것이 무엇이며 왜 그런지 알아보게 했습니다.
  to: 그러자 에스더는 자기를 시중들도록 왕이 임명한 왕의 내시들 가운데 한 사람인 하닥[a]을 불러, 모르드개에 관하여 그에게 명하여 이것이 무엇이며 어찌하여 이런 일이 생겼는지를 알아보게 했습니다.
  rationale: 왕이 하닥을 에스더의 시중을 들도록 임명했다는 관계를 명료하게 재구성하고, ‘명하여’로 원문의 명령 동사를 보존했습니다. 마지막 질문은 직역하면 다소 부자연스러운 ‘왜 이것인가’이므로, 반복된 지시어가 가리키는 당면한 사태를 유지하여 ‘어찌하여 이런 일이 생겼는지’로 자연스럽게 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:00Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 서사 진행, 하닥의 왕궁 내시 신분, 왕이 에스더를 섬기도록 그를 임명한 사실, 그리고 모르드개와 관련하여 사정을 알아보도록 지시한 내용이 전반적으로 반영되어 있습니다. 다만 현행 본문의 관계절은 ‘그가 자기 앞에 서도록 왕이 세운 자’로 주체와 지시 대상이 불명확하고 한국어 문장 구조상 하닥을 수식하는 방식도 부자연스럽습니다.
  naturalness: ‘왕의 내시들 가운데 하나인’은 사람을 가리키는 문맥에서 ‘한 사람인’보다 다소 어색하며, ‘그가 자기 앞에 서도록 왕이 세운 자에게’는 누가 누구 앞에 서는지 분명하지 않습니다. 이를 ‘자기를 시중들도록 왕이 임명한’으로 옮기면 현대 표준 한국어 합쇼체에서 자연스럽고 의미도 명료합니다.
  terminology: ‘에스더’, ‘하닥’, ‘모르드개’, ‘내시’는 적절합니다. סָרִיס의 더 넓은 ‘궁정 관리’ 가능성도 각주에 적절히 보존되어 있습니다. צוה의 지시·명령 의미는 ‘명하여’로 유지하는 편이 ‘일을 맡기고’보다 원문에 더 가깝습니다.
  issues:
  - severity: medium
    issue: 관계절의 주체 및 수식 관계가 불명확함
    rationale: ‘그가 자기 앞에 서도록 왕이 세운 자’는 ‘그’와 ‘자기’의 지시 대상이 혼동되며, 원문의 ‘왕이 그녀 앞에 세운/그녀를 섬기도록 임명한 하닥’이라는 관계를 한국어에서 명료하게 전달하지 못합니다.
  - severity: low
    issue: ‘모르드개에 관한 일을 맡기고’가 명령 동사를 약화함
    rationale: וַתְּצַוֵּהוּ는 하닥에게 명령하거나 지시한 행위입니다. ‘일을 맡기고’도 문맥상 가능하지만 명령의 직접성을 다소 약화하므로 ‘명하여’ 또는 ‘지시하여’가 더 충실합니다.
