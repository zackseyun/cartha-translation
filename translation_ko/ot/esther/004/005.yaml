id: EST.4.5
reference: Esther 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְרָא֩ אֶסְתֵּ֨ר לַ/הֲתָ֜ךְ מִ/סָּרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר הֶעֱמִ֣יד לְ/פָנֶ֔י/הָ וַ/תְּצַוֵּ֖/הוּ עַֽל מָרְדֳּכָ֑י לָ/דַ֥עַת מַה זֶּ֖ה וְ/עַל מַה זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
  footnotes:
  - marker: a
    text: Or 'one of the king’s court officials.' The Hebrew term can denote a eunuch specifically or, in some contexts, a royal officer more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 에스더가 왕의 내시들 가운데 하나인 하닥[a]을 불러, 그가 자기 앞에 서도록 왕이 세운 자에게 모르드개에 관한 일을 맡기고, 이것이 무엇이며 왜 그런지 알아보게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 궁정 관리들 가운데 하나’. 히브리어 이 말은 특히 왕궁에서는 내시를 가리킬 수 있지만, 어떤 경우에는 더 넓게 왕실 관리로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  english_pob_choice: Then Esther called for
  chosen_korean: 그러자 에스더가 …을 불러
  alternatives_korean:
  - 에스더가 …을 불렀습니다
  - 그때 에스더가 …을 부르게 했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 자연스러운 한국어 연결어 ‘그러자’로 살리고, 요청·소환의 뉘앙스를 ‘불러’로 전달했습니다.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  english_pob_choice: one of the king’s eunuchs
  chosen_korean: 왕의 내시들 가운데 하나인
  alternatives_korean:
  - 왕의 관원들 가운데 하나인
  - 왕의 궁정 관리들 가운데 하나인
  lexicon: HALOT
  rationale: סָרִיס의 기본 의미인 ‘내시’를 본문에 유지하고, 영어 POB의 각주 가능성을 반영해 보다 넓은 관원 의미는 대안으로 남겼습니다.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  english_pob_choice: whom he had appointed to attend her
  chosen_korean: 그가 자기 앞에 서도록 왕이 세운 자에게
  alternatives_korean:
  - 그녀를 시중들도록 왕이 임명한
  - 그녀 앞에 서게 된 왕의 지정자에게
  lexicon: HALOT
  rationale: ‘세우다/임명하다’의 사역적 의미와 ‘그녀 앞에 서다’라는 관용구를 살려, 단순한 배치가 아니라 공식적 근무 배정을 드러냈습니다.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  english_pob_choice: and commanded him concerning Mordecai
  chosen_korean: 모르드개에 관한 일을 맡기고
  alternatives_korean:
  - 모르드개에 관해 그에게 명하고
  - 모르드개에 대하여 그에게 명령하여
  lexicon: HALOT
  rationale: צוה + עַל이 ‘~에 관해 지시하다’의 기능을 가지므로, 한국어에서는 명령의 대상보다 임무 부여를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לָדַעַת מַה זֶּה וְעַל מַה זֶּה
  english_pob_choice: to learn what this was and why it was
  chosen_korean: 이것이 무엇이며 왜 그런지 알아보게 했습니다
  alternatives_korean:
  - 이것이 무엇이며 왜 이것인지 알아보게 했습니다
  - 이것이 무엇인지와 왜 그런지 알아보게 했습니다
  lexicon: HALOT
  rationale: 두 개의 질문을 각각 살려 ‘무엇’과 ‘왜 그런지’를 분리했고, 영어 POB의 ‘what this was / why it was’ 구분을 한국어에서도 유지했습니다.
