    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어왔습니다
  - 도착했습니다
  lexicon: WLC / HALOT
  rationale: 서술 흐름상 하닥이 모르드개에게 갔다가 에스더에게 돌아오는 장면이므로, 단순한 이동이 아니라 돌아와 전달하는 동작을 자연스럽게 드러내기 위해 ‘와서’로 옮겼습니다.
- source_word: הֲתָךְ
  english_pob_choice: Hathach
  chosen_korean: 하닥
  alternatives_korean:
  - 하타크
  - 헤탁
  lexicon: 고유명사 표기
  rationale: 에스더서의 통용되는 한국어 음역을 따라 인명으로 처리했습니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 전했습니다
  alternatives_korean:
  - 말했습니다
  - 알렸습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: נגד의 Hiphil은 ‘알리다, 전하다, 말해 주다’의 뜻이므로, 단순 발화보다 내용을 전달하는 뉘앙스를 살려 ‘전했습니다’로 옮겼습니다.
- source_word: דִּבְרֵי
  english_pob_choice: the words of
  chosen_korean: 말들을
  alternatives_korean:
  - 말씀을
  - 메시지를
  - 전한 말을
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘말들’과 평행을 살리면서도 한국어에서 어색하지 않게 복수 의미를 드러냈습니다. POB의 각주가 지적하듯 문맥상 ‘메시지’로도 이해될 수 있지만, 본문은 문자적으로 ‘말들’이 더 가깝습니다.
