  yaml_path: translation/ot/esther/004/010.yaml
  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
  footnotes:
  - marker: a
    text: Literally, 'Then Esther said to Hathach and commanded him to Mordecai.' The Hebrew implies that she instructed Hathach to go to Mordecai.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 에스더가 하닥에게 말하고, 그를 모르드개에게 보내도록 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘에스더가 하닥에게 말하고 그를 모르드개에게 명령했다’입니다. 히브리어는 하닥에게 모르드개에게로 가라고 지시한 뜻을 함축합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then Esther spoke
  chosen_korean: 그러자 에스더가 말하고
  alternatives_korean:
  - 그러자 에스더가 말했다
  - 그러자 에스더가 하닥에게 말했다
  lexicon: WLC; HALOT
  rationale: 와우 연속의 서술 진행을 ‘그러자’로 살리고, אמר의 기본 의미를 한국어 자연문맥에 맞게 ‘말하다’로 옮겼습니다.
- source_word: לַהֲתָךְ
  english_pob_choice: to Hathach
  chosen_korean: 하닥에게
  alternatives_korean:
  - 하닥에게로
  - 하닥에게 말을 하고
  lexicon: WLC; 고유명사 표기
  rationale: 전치사 ל의 직접목적/간접목적 기능을 한국어 여격으로 반영했고, 인명은 통용 표기 ‘하닥’을 따랐습니다.
- source_word: וַתְּצַוֵּהוּ
  english_pob_choice: and commanded him
  chosen_korean: 그를 … 명령했습니다
  alternatives_korean:
  - 그에게 … 지시했습니다
  - 그에게 … 부탁했습니다
  lexicon: HALOT
  rationale: צוה의 강한 명령/지시의 뉘앙스를 약화하지 않도록 ‘명령하다’를 유지했습니다.
- source_word: אֶל מָרְדֳּכָי
  english_pob_choice: to Mordecai
  chosen_korean: 모르드개에게
  alternatives_korean:
  - 모르드개에게로
  - 모르드개에게 가도록
  lexicon: WLC; HALOT
  rationale: 문맥상 하닥을 모르드개에게 보내라는 뜻이므로, POB의 해석을 따라 방향성을 한국어로 자연스럽게 풀어 ‘모르드개에게’로 옮겼습니다.
theological_decisions:
- issue: 명령문의 간접적 완성
  chosen_reading: ‘그를 모르드개에게 보내도록 명령했습니다’로, 히브리어의 방향 전치사 אֶל이 함축하는 이동 지시를 드러냈습니다.
  alternative_readings:
  - ‘그에게 모르드개를 향해 명령했습니다’
  - ‘그에게 모르드개에게로 가라고 명령했습니다’
  rationale: 원문은 단순한 ‘말하다’보다 실제 이동 지시를 포함하며, 영어 POB의 auditable expansion을 한국어에서 명시하는 편이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 서사 문맥의 의미 보존
