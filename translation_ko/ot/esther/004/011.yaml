id: EST.4.11
reference: Esther 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
  footnotes:
  - marker: a
    text: Or 'without being called.' The Hebrew passive verb can be rendered more literally, but 'summoned' better conveys formal court protocol.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''there is but one decree: death.'' The Hebrew idiom literally speaks of ''one law'' applying in such a case.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 모든 신하들과 왕의 각 지방 사람들은, 누구든지 남자나 여자가 부름을 받지 않고 내전으로 왕에게 나아가면 그에게는 오직 한 법이 있어 곧 죽임을 당하게 된다는 것을 알고 있습니다. 다만 왕이 그에게 금 규를 내밀면 그는 살게 됩니다. 그러나 저는 왕에게 나아가도록 부름을 받지 못한 지 이미 서른 날이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부름을 받지 않고’는 왕 앞에 공식적으로 소환되지 않았음을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내전’은 왕의 제한 구역을 가리키는 궁정 용어로, ‘안뜰’보다 간결하게 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  english_pob_choice: the king’s servants
  chosen_korean: 왕의 모든 신하들
  alternatives_korean:
  - 왕의 종들
  - 왕의 시종들
  lexicon: HALOT
  rationale: 궁정 문맥에서 광범위한 왕실 봉사자들을 가리키므로, 직역보다 자연스럽고 신분을 과장하지 않는 ‘신하들’이 적절합니다.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  english_pob_choice: the people of the king’s provinces
  chosen_korean: 왕의 각 지방 사람들
  alternatives_korean:
  - 왕의 지방들의 백성
  - 왕국의 사람들
  lexicon: HALOT
  rationale: מְדִינוֹת는 에스더에서 제국의 행정 구역을 가리키므로 ‘각 지방’이 자연스럽고, ‘사람들’로 넓은 민중을 살렸습니다.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  english_pob_choice: without being summoned
  chosen_korean: 부름을 받지 않고
  alternatives_korean:
  - 불려지지 않고
  - 소환되지 않고
  lexicon: HALOT
  rationale: 궁정 예법상 공식적으로 왕 앞에 ‘불러들임’을 뜻하므로, ‘소환’보다 한국어로 덜 행정적이면서도 공식성을 유지하는 ‘부름을 받지 않고’로 옮겼습니다.
- source_word: הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the inner court
  chosen_korean: 내전
  alternatives_korean:
  - 안뜰
  - 안쪽 뜰
  lexicon: HALOT
  rationale: 왕궁의 제한된 출입 공간을 가리키는 표현이라, 한국어 궁정 문맥에서 간결한 ‘내전’을 택했습니다.
- source_word: אַחַת דָּתוֹ לְהָמִית
  english_pob_choice: 'there is one law for him: to be put to death'
  chosen_korean: 그에게는 오직 한 법이 있어 곧 죽임을 당하게 된다는 것
  alternatives_korean:
  - 그에게는 한 가지 법만 있어 죽게 된다는 것
  - 그에게는 하나의 법, 곧 죽음이라는 것
  lexicon: HALOT
  rationale: 직역의 ‘한 법’ 구조를 유지하되, 처벌의 뜻을 분명히 드러내기 위해 결과를 한국어 관용으로 풀었습니다.
theological_decisions:
- issue: 왕의 금 규를 내미는 행위의 의미
  chosen_reading: 왕의 호의와 생명 허락을 상징하는 예외적 은총으로 옮겼습니다.
  alternative_readings:
  - 단순한 예절적 제스처
  - 법적 면제 절차
  rationale: 본문은 일반 규정과 유일한 예외를 대비시키므로, 금 규는 생사 결정권을 가진 왕의 호의를 상징하는 표지로 이해하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 에스더서 4:11 문맥상 왕권과 은총의 대비
- issue: ‘다만’과 ‘오직 한 법’의 긴장
  chosen_reading: 법적 일반 원칙과 왕의 예외적 개입을 함께 살리도록 했습니다.
  alternative_readings:
  - ‘죽음이 정해져 있다’로 단순화
  - 예외를 약화시킨 완곡한 표현
  rationale: 히브리어는 사법적 확정성과 단 하나의 예외를 모두 강조하므로, 둘 중 하나를 희석하지 않도록 균형 있게 표현했습니다.
  doctrine_reference: 본문의 법정적·궁정적 진술
