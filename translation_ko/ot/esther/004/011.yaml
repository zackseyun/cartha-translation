  source_fidelity: ‘내전’은 히브리어 הֶחָצֵר הַפְּנִימִית(왕궁의 ‘안쪽 뜰/내정’)보다 왕의 거처 자체를 뜻하기 쉬워 공간 지시가 다소 부정확합니다. 또한 원문의 ‘한 법—죽임’이라는 법적 선언은 ‘죽임을 당하게 된다’보다 명사적 판결 진술로 더 직접적으로 옮기는 편이 좋습니다. 왕이 금 규를 내미는 행위가 생명을 허락하는 유일한 예외라는 관계는 보존해야 합니다.
  naturalness: ‘왕의 각 지방 사람들’보다 ‘왕의 각 지방의 백성들’이 자연스럽고 원문의 집단적 범위를 더 잘 드러냅니다. 각주 표지는 해당 표현 바로 뒤에 놓아야 하며, 문장 끝에 함께 붙인 현 형태는 두 각주의 지시 대상이 불분명합니다.
