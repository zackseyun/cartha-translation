- from: 왕의 모든 신하들과 왕의 각 지방 사람들은, 누구든지 남자나 여자가 부름을 받지 않고 내전으로 왕에게 나아가면 그에게는 오직 한 법이 있어 곧 죽임을 당하게 된다는 것을 알고 있습니다. 다만 왕이 그에게 금 규를 내밀면 그는 살게 됩니다. 그러나 저는 왕에게 나아가도록 부름을 받지 못한 지 이미 서른 날이 되었습니다.[a][b]
