  rationale: ‘내전’을 ‘안쪽 뜰’로 바로잡아 원문의 궁정 공간을 정확히 나타냈습니다. 법의 유일성과 사형이라는 결과, 그리고 왕이 금 규를 내미는 유일한 예외를 유지했습니다. 두 각주는 각각의 대상어 뒤로 옮겨 표지-각주 연결을 명확히 했습니다.
