  text: וַֽ/יַּעֲבֹ֖ר מָרְדֳּכָ֑י וַ/יַּ֕עַשׂ כְּ/כֹ֛ל אֲשֶׁר צִוְּתָ֥ה עָלָ֖י/ו אֶסְתֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/017.yaml
  text: So Mordecai went away and did according to all that Esther had commanded him[a].
  footnotes:
  - marker: a
    text: Or 'went on' or 'passed on'; the Hebrew verb literally means 'passed over/through,' but here likely refers to Mordecai's departure to do what Esther instructed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 모르드개는 떠나서 에스더가 그에게 명한 모든 대로 행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָבַר는 문자적으로는 ‘지나가다/건너가다’이지만, 여기서는 문맥상 ‘떠나다’의 의미로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: went away
  chosen_korean: 떠나서
  alternatives_korean:
  - 가서
  - 지나가서
  - 지나가 버리고
  lexicon: HALOT
  rationale: 문맥상 עבר의 기본적 ‘지나가다’를 직역하기보다, 에스더의 지시를 수행하러 자리를 뜬다는 의미를 자연스럽게 드러내는 ‘떠나서’가 가장 잘 맞습니다.
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 했습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: עשה의 일반적 의미를 살리면서, 앞의 ‘명한 모든 대로’와 어울리도록 ‘행하였습니다’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all that
  chosen_korean: 모든 대로
  alternatives_korean:
  - 모든 것에 따라
  - 전부 그대로
  - 명한 바 모두대로
  lexicon: HALOT
  rationale: ‘according to all that’의 포괄성과 순응의 뉘앙스를 한국어에서 자연스럽게 전달하는 표현으로 ‘모든 대로’를 택했습니다.
- source_word: צִוְּתָה
  english_pob_choice: had commanded
  chosen_korean: 명한
  alternatives_korean:
  - 명령한
  - 지시한
  - 분부한
  lexicon: HALOT
  rationale: 에스더의 말이 단순 제안이 아니라 권위 있는 지시였음을 드러내되, 한국어에서 과도하게 강압적으로 들릴 수 있는 ‘명령하다’보다 서술형 ‘명하다’가 더 균형적입니다.
theological_decisions:
- issue: 에스더의 지시를 따르는 모르드개의 순종 표현
  chosen_reading: 본문의 서술을 그대로 따라, 모르드개의 즉각적 순종을 강조했습니다.
  alternative_readings:
  - 보다 완곡하게 ‘말한 대로 따랐습니다’로 처리
  - ‘명령을 받들었습니다’처럼 의례적 표현으로 완화
  rationale: 히브리어는 단순한 행위 연쇄로 순종을 분명히 드러내므로, 이를 약화시키지 않고 담백하게 전달했습니다.
  doctrine_reference: 서술 순응성
