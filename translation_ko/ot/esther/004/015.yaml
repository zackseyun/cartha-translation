lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... told
  chosen_korean: 그러자 ... 지시했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 전진을 ‘그러자’로 살리고, 뒤의 부정사구가 수반하는 ‘답을 보내도록’과 자연스럽게 이어지도록 ‘지시했습니다’로 옮겼습니다.
- source_word: לְהָשִׁיב
  english_pob_choice: to reply
  chosen_korean: 답을 보내도록
  alternatives_korean:
  - 대답하도록
  - 답장하도록
  - 되돌려 보내도록
  lexicon: HALOT
  rationale: 히필 부정사구는 단순히 ‘말하다’가 아니라 모르드개에게 되돌아갈 응답을 마련하라는 뜻이므로, 한국어에서는 ‘답을 보내도록’이 가장 기능적으로 가깝습니다.
- source_word: מָרְדֳּכָי
  english_pob_choice: Mordecai
  chosen_korean: 모르드개
  alternatives_korean:
  - 모르데개
