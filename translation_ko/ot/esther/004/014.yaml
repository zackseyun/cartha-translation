revisions:
- from: 만일 당신이 이때 잠잠히 있으면[a], 유다 사람들을 위한 숨통과 구원은 다른 곳에서 일어날 것이지만, 당신과 당신 아버지의 집은 멸망할 것입니다. 누가 압니까, 당신이 이런 때를 위하여 왕위에 이르렀는지?
  to: 만일 왕후께서 이때에 잠잠히 계시면, 유대인들에게 안도와 구원이 다른 곳에서 일어날 것입니다. 그러나 왕후와 왕후의 아버지 집안은 멸망할 것입니다. 누가 압니까? 왕후께서 바로 이런 때를 위하여 왕후의 자리에 오르셨는지[a] 말입니다.
  rationale: 각주를 원문의 לְעֵת כָּזֹאת에 해당하는 마지막 목적 구절로 옮겼습니다. ‘숨통’을 격식 있는 ‘안도’로, 가문 관용구를 ‘아버지의 집안’으로 고쳤으며, 에스더의 문맥에 맞게 왕적 지위를 ‘왕후의 자리’로 번역했습니다. ‘다른 곳’의 출처는 특정하거나 하나님을 명시하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:04Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건문, 유다인에게 임할 구원, ‘다른 곳’의 의도적인 비특정성, 그리고 왕적 지위에 이른 목적에 대한 수사적 가능성은 대체로 보존되었습니다. 그러나 ‘왕위’는 왕의 보좌를 뜻하기 쉬워 에스더의 문맥상 부정확하며, ‘아버지의 집’은 여기서 가문을 가리키므로 한국어에서는 ‘아버지의 집안’이 적절합니다.
  naturalness: ‘숨통과 구원’은 병렬어로 어색하고 ‘숨통’은 본문의 엄숙한 합쇼체 문체에 다소 구어적입니다. ‘안도와 구원’으로 다듬으면 현대 표준어의 격식 있는 문체에서 자연스럽습니다. 또한 ‘유다 사람들’보다 이 문맥의 집단 명칭으로는 ‘유대인들’이 자연스럽습니다.
  terminology: הַצָּלָה의 ‘구원’은 위기에서의 구출을 뜻하는 문맥에서 가능하며, 하나님을 명시하지 않아 원문의 함의를 열어 둡니다. לַמַּלְכוּת은 이 문맥에서 에스더가 왕후가 된 지위를 가리키므로 ‘왕후의 자리에 오르셨는지’가 ‘왕위’보다 정확합니다. 기존 각주 표지는 ‘이때’ 뒤에 있으나 각주 내용은 뒤의 ‘이런 때를 위하여’에 관한 것이므로 표지를 해당 구절 뒤로 옮겨야 합니다.
