id: EST.4.14
reference: Esther 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you keep silent at this time[a], relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have attained royalty for a time like this?
  footnotes:
  - marker: a
    text: Or, more traditionally, 'for such a time as this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 이때 잠잠히 있으면[a], 유다 사람들을 위한 숨통과 구원은 다른 곳에서 일어날 것이지만, 당신과 당신 아버지의 집은 멸망할 것입니다. 누가 압니까, 당신이 이런 때를 위하여 왕위에 이르렀는지?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이때를 위하여” 또는 더 전통적으로 “이런 때를 위하여”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  english_pob_choice: you keep silent
  chosen_korean: 잠잠히 있으면
  alternatives_korean:
  - 침묵하면
  - 완전히 잠잠하면
  lexicon: HALOT
  rationale: 분사적 강조를 한국어의 조건절로 자연스럽게 풀되, 단순한 ‘묵묵함’보다 강한 금지·경고의 뉘앙스를 살렸습니다.
- source_word: רֶוַח וְהַצָּלָה
  english_pob_choice: relief and deliverance
  chosen_korean: 숨통과 구원
  alternatives_korean:
  - 안도와 구원
  - 유예와 구원
  lexicon: HALOT
  rationale: ‘relief’는 단순 심리적 안도보다 위기에서의 생존 공간을 가리키므로 ‘숨통’으로 옮기고, ‘deliverance’는 위협에서의 실제 구출을 살려 ‘구원’으로 옮겼습니다.
- source_word: מִמָּקוֹם אַחֵר
  english_pob_choice: from another place
  chosen_korean: 다른 곳에서
  alternatives_korean:
  - 다른 곳으로부터
  - 어딘가 다른 데서
  lexicon: HALOT
  rationale: 원문의 의도적 비특정성을 유지하면서도, 한국어에서 가장 자연스럽게 ‘다른 곳’을 살렸습니다.
- source_word: וּבֵית אָבִיךְ
  english_pob_choice: your father's house
  chosen_korean: 당신 아버지의 집
  alternatives_korean:
  - 당신의 아버지 집안
  - 당신의 친정 집안
  lexicon: HALOT
  rationale: 히브리어의 친족·가문 관용구를 직역에 가깝게 보존해, 개인보다 가문 전체를 가리키는 범위를 드러냈습니다.
- source_word: לַמַּלְכוּת
  english_pob_choice: royalty
  chosen_korean: 왕위
  alternatives_korean:
  - 왕권
  - 왕실 지위
  lexicon: HALOT
  rationale: 에스더의 현재 지위를 단순한 ‘왕국’이 아니라 왕적 지위로 이해해야 하므로, 한국어에서 가장 직접적인 ‘왕위’를 택했습니다.
theological_decisions:
- issue: 하나님의 섭리를 직접 명시하지 않는 표현
  chosen_reading: ‘다른 곳에서 일어날 것이지만’과 ‘누가 압니까’의 열린 표현을 유지했습니다.
  alternative_readings:
  - 하나님이 다른 곳에서 일으키실 것입니다
  - 섭리로 구원이 올 것입니다
  rationale: 본문은 하나님을 직접 언급하지 않으면서도 구원의 원천을 암시하므로, 그 긴장을 풀어 쓰지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
