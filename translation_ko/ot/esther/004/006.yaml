  yaml_path: translation/ot/esther/004/006.yaml
  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
  footnotes:
  - marker: a
    text: Or 'to the city square'; the Hebrew term refers to a broad public open area, not necessarily a street in the modern sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 하다새가 모르드개에게, 곧 왕의 문 앞에 있는 성읍의 넓은 광장으로 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성읍의 넓은 광장’은 현대적 의미의 ‘거리’가 아니라, 공적인 개방 공간을 가리키는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 갔습니다
  - 나왔습니다
  lexicon: HALOT
  rationale: wayyiqtol 동사는 완료된 서술 과거를 나타내므로, 출발·이동의 방향성을 살린 ‘나갔습니다’가 본문 흐름에 가장 자연스럽습니다.
- source_word: הֲתָךְ
  english_pob_choice: Hathach
  chosen_korean: 하다새
  alternatives_korean:
  - 하닥
  - 하타크
  lexicon: 고유명사 표기 관행
  rationale: 인명은 통용되는 음역을 따르되, 한국어 표기 관행상 ‘하다새’가 가장 읽기 자연스럽습니다.
- source_word: רְחוֹב הָעִיר
  english_pob_choice: the open square of the city
  chosen_korean: 성읍의 넓은 광장
  alternatives_korean:
  - 도시 광장
  - 성읍 광장
  - 성읍의 공터
  lexicon: HALOT
  rationale: רְחוֹב은 단순한 길보다 넓은 공적 개방 공간을 가리키므로, 현대 한국어의 ‘광장’과 수식어 ‘넓은’으로 그 의미를 살렸습니다.
- source_word: שַׁעַר הַמֶּלֶךְ
  english_pob_choice: the king's gate
  chosen_korean: 왕의 문
  alternatives_korean:
  - 왕궁 문
  - 왕문
  lexicon: HALOT
  rationale: 직역 구조를 유지해 반복되는 에스더서의 궁정 배경을 분명히 드러내는 표현으로 옮겼습니다.
