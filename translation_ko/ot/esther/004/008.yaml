revisions:
- from: 그는 또한 수산에서 그들의 멸절을 위해 내려진 글로 된 조서의 사본을[a] 그에게 주어 에스더에게 보여 주고 말하게 하며, 왕에게 들어가서 그의 은총을 간구하고 자기 백성을 위하여 그 앞에서 구하게 하라고[c][b] 그녀에게 지시하게 했습니다.
  to: 그는 또한 수산에서 그들을 멸절시키기 위해 공포된 조서의 사본을[a] 그에게 주어, 그것을 에스더에게 보여 주고 그녀에게 알리며, 왕에게 들어가 그에게 간청하고 왕 앞에서 자기 백성을 위하여 청원하라고 에스더에게 지시하게 했습니다[c][b].
  rationale: 행위의 연쇄를 한국어로 명확히 하여, 모르드개가 하닥에게 문서를 주고 에스더에게 보여 주고 알리며 그녀에게 왕 앞에서 청원하도록 지시하게 했다는 원문의 구조를 드러냈습니다. ‘그에게 간청하다’는 לו를 직접 반영하며, עַל עַמָּהּ의 의미 범위는 본문과 각주의 조합으로 보존했습니다. 각주 표지는 해당 표현 가까이에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:10Z'
