  terminology: ‘수산’, ‘에스더’, ‘조서’, ‘멸절’, ‘왕 앞에서 청원하다’는 궁정 문맥과 문서 용어를 적절히 반영합니다. עַל עַמָּהּ는 본문에서 ‘자기 백성을 위하여’로 옮기되, 각주에서 ‘관하여’와 ‘대신하여’의 가능성을 보존하는 것이 좋습니다.
