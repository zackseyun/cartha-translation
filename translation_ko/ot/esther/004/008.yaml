  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy of the written decree that had been issued in Susa for their destruction[a], to show Esther and tell her[c][b], and to instruct her to go in to the king to implore his favor and seek from before him concerning her people.
  footnotes:
  - marker: a
    text: Or 'a copy of the edict.' The Persian loanword פַּתְשֶׁגֶן refers to the text or copy of an official document.
    reason: lexical_alternative
  - marker: b
    text: Literally 'seek from before him,' a courtly expression for making a petition in the king's presence.
    reason: cultural_note
  - marker: c
    text: Or 'for her people' / 'on behalf of her people.' The Hebrew preposition can express concern for or advocacy on behalf of her people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 수산에서 그들을 멸절시키기 위해 공포된 조서의 사본을[a] 그에게 주어, 그것을 에스더에게 보여 주고 그녀에게 알리며, 왕에게 들어가 그에게 간청하고 왕 앞에서 자기 백성을 위하여 청원하라고 에스더에게 지시하게 했습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조서의 사본’입니다. פַּתְשֶׁגֶן은 공식 문서의 본문 또는 사본을 가리키는 페르시아계 차용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그 앞에서 구하다’입니다. 왕의 면전에서 청원하는 궁정적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘자기 백성에 관하여’ 또는 ‘자기 백성을 대신하여’입니다. עַל은 여기서 백성에 대한 관심이나 백성을 위한 대리적 청원을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  english_pob_choice: a copy of the written decree
  chosen_korean: 글로 된 조서의 사본
  alternatives_korean:
  - 조서의 사본
  - 문서의 사본
  lexicon: HALOT
  rationale: פַּתְשֶׁגֶן은 공식 문서의 사본을 가리키고, כְּתָב은 ‘쓴 글/문서’의 성격을 더하므로, 두 요소를 함께 살린 ‘글로 된 조서의 사본’이 적절합니다.
- source_word: הַדָּת
  english_pob_choice: decree
  chosen_korean: 조서
  alternatives_korean:
  - 명령
  - 법령
  lexicon: HALOT
  rationale: 에스더서의 페르시아 궁정 맥락에서는 단순한 ‘법’보다 왕의 공식 문서인 ‘조서’가 더 정확합니다.
- source_word: לְהִתְחַנֶּן לוֹ
  english_pob_choice: to implore his favor
  chosen_korean: 그의 은총을 간구하고
  alternatives_korean:
  - 그에게 간청하고
  - 그의 호의를 빌고
  lexicon: HALOT
  rationale: חנן의 핵심은 단순 요청이 아니라 왕의 은혜/은총을 구하는 태도이므로, 목적어를 ‘그의 은총’으로 옮겨 궁정적·청원적 뉘앙스를 살렸습니다.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  english_pob_choice: seek before him on behalf of her people
  chosen_korean: 그 앞에서 구하게 하라고… 자기 백성을 위하여
  alternatives_korean:
  - 그 앞에서 청원하게 하라고… 백성을 위해
  - 그 앞에 나아가 청하게 하라고… 백성을 위하여
  lexicon: HALOT
  rationale: מִלְּפָנָיו는 문자적으로 ‘그 앞에서/그 앞에서부터’이므로 왕 앞에서의 청원 장면을 살렸고, עַל עַמָּהּ는 단순 ‘관하여’보다 ‘위하여/대하여’의 대리·중재 의미가 자연스럽습니다.
theological_decisions:
- issue: תּוֹוַת 역할의 위계와 register
  chosen_reading: ‘지시하게 했습니다’로 옮겨 모르드개의 권한이 왕권이 아닌 가족·궁정적 조언자의 수준임을 유지했습니다.
  alternative_readings:
  - 명령하게 했습니다
  - 훈계하게 했습니다
  rationale: צוה는 강한 명령이 가능하지만, 문맥상 모르드개가 에스더의 상관이 아니므로 과도하게 위계적인 표현은 피하고 원문의 긴박한 지시 성격만 살렸습니다.
  doctrine_reference: 문맥-사회적 위계 보존
- issue: 왕 앞에 들어감의 위험성
  chosen_reading: ‘왕에게 들어가서’로 직역해 궁정 출입의 위험한 행동을 드러냈습니다.
  alternative_readings:
  - 왕을 만나러 가서
  - 왕 앞에 나아가서
  rationale: 히브리어의 court-access idiom은 단순한 면담이 아니라 왕의 존재 앞에 들어가는 행위를 가리키므로, 서술의 긴장감을 유지하는 번역이 필요합니다.
  doctrine_reference: 서사적-궁정어법 보존
