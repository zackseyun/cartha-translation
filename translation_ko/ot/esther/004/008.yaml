  source_fidelity: 핵심 의미는 대체로 충실하지만, 현재 문장은 모르드개가 하닥에게 문서를 주고 에스더에게 보이고 알리며 에스더에게 지시하게 한 연속적 지시 관계를 다소 불분명하게 표현합니다. 또한 לְהִתְחַנֶּן לוֹ는 직역상 ‘그에게 간청하다’이므로 ‘그의 은총을 간구하다’보다 직접적인 표현이 더 안전합니다.
