  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 ‘벗기게 하려 했지만’은 히브리어의 목적 표현(옷을 보내어 모르드개에게 입히고 그의 베옷을 벗기려 함)을 단순한 의도·시도로 다소 약화하며, ‘보내며’도 목적 관계를 충분히 드러내지 못합니다.
  naturalness: ‘모르드개에게 옷을 입히고 그에게서 굵은 베옷을 벗기려고 옷을 보냈으나’는 목적과 행동의 관계를 자연스러운 현대 한국어 합쇼체로 명확히 합니다. 각주 표지는 설명하는 낱말 바로 뒤에 두는 것이 독자의 참조에 더 적절합니다.
  terminology: ‘시녀들’, ‘내시들’, ‘왕비’, ‘굵은 베옷’은 왕궁 및 애도 문맥에 적절합니다. ‘내시’의 의미 범위와 베옷의 문화적 기능을 설명하는 기존 각주는 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘그녀는 … 옷을 보내며 … 벗기게 하려 했지만’
    rationale: לְהַלְבִּישׁ과 לְהָסִיר는 옷을 보낸 목적을 병렬로 나타냅니다. ‘하려 했다’는 실행된 행동의 목적보다 미완의 시도를 부각하므로, ‘…하려고 옷을 보냈으나’로 옮기는 편이 더 충실합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓임
    rationale: 각주의 대상인 ‘내시’와 ‘굵은 베옷’에 각각 직접 표지를 붙이면 앵커가 분명해집니다.
