- from: 에스더의 시녀들과 내시들이 와서 그녀에게 알리자, 왕비는 몹시 괴로워했습니다. 그녀는 모르드개에게 입힐 옷을 보내며 그의 굵은 베옷을 벗기게 하려 했지만, 그는 그것을 받지 않았습니다.[a][b]
  to: 에스더의 시녀들과 내시들[a]이 와서 그녀에게 알리자, 왕비는 몹시 괴로워했습니다. 그녀는 모르드개에게 옷을 입히고 그에게서 굵은 베옷[b]을 벗기려고 옷을 보냈으나, 그는 그 옷을 받지 않았습니다.
  rationale: 목적을 나타내는 히브리어 부정사 두 개의 병렬 관계를 한국어에서 ‘입히고 … 벗기려고 옷을 보냈으나’로 보존했습니다. 이는 에스더가 옷을 보낸 실제 행위와 모르드개의 거절을 분명히 하면서도, 누가 실제로 옷을 입히거나 벗기도록 했는지는 본문 이상으로 특정하지 않습니다. 각주 내용은 유지하되 해당 용어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:02Z'
