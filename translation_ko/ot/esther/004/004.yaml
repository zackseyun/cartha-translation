source:
  edition: WLC
  text: וַ֠/תָּבוֹאינָה נַעֲר֨וֹת אֶסְתֵּ֤ר וְ/סָרִיסֶ֨י/הָ֙ וַ/יַּגִּ֣ידוּ לָ֔/הּ וַ/תִּתְחַלְחַ֥ל הַ/מַּלְכָּ֖ה מְאֹ֑ד וַ/תִּשְׁלַ֨ח בְּגָדִ֜ים לְ/הַלְבִּ֣ישׁ אֶֽת מָרְדֳּכַ֗י וּ/לְ/הָסִ֥יר שַׂקּ֛/וֹ מֵ/עָלָ֖י/ו וְ/לֹ֥א קִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
  footnotes:
  - marker: a
    text: Or 'female attendants' for 'young women.'
    reason: lexical_alternative
  - marker: b
    text: '''Eunuchs'' can in some contexts mean royal court officials, but in Esther’s palace setting the more specific sense is likely.'
    reason: cultural_note
  - marker: c
    text: Sackcloth was a coarse garment worn as a sign of mourning, grief, or humiliation.
    reason: cultural_note
translation:
  language: ko
  text: 에스더의 시녀들과 내시들[a]이 와서 그녀에게 알리자, 왕비는 몹시 괴로워했습니다. 그녀는 모르드개에게 옷을 입히고 그에게서 굵은 베옷[b]을 벗기려고 옷을 보냈으나, 그는 그 옷을 받지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내시’는 이 궁정 문맥에서 단순한 ‘관리들’보다 더 구체적인 의미일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: ‘굵은 베옷’은 애도, 슬픔, 굴욕을 나타내는 거친 옷입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרֹות
  english_pob_choice: young women
  chosen_korean: 시녀들
  alternatives_korean:
  - 젊은 여자들
  - 여종들
  lexicon: HALOT
  rationale: 왕궁 문맥에서 에스더의 여성 시종들을 가리키므로, 한국어로는 자연스럽고 관례적인 ‘시녀들’이 가장 적절합니다.
- source_word: וְסָרִיסֶיהָ
  english_pob_choice: and her eunuchs
  chosen_korean: 내시들이
  alternatives_korean:
  - 환관들이
  - 궁정 관리들이
  lexicon: HALOT
  rationale: 페르시아 궁정 맥락에서 סָרִיס는 보통 내시를 뜻하므로, 본문이 지닌 역사적·사회적 구체성을 살려 ‘내시들’로 옮겼습니다.
- source_word: וַתִּתְחַלְחַל
  english_pob_choice: was greatly distressed
  chosen_korean: 몹시 괴로워했습니다
  alternatives_korean:
  - 몹시 동요했습니다
  - 크게 떨렸습니다
  lexicon: HALOT
  rationale: 동사에는 강한 동요와 고통이 함께 담겨 있어, 단순한 감정 표현보다 상황의 충격을 살리는 ‘몹시 괴로워했습니다’가 적절합니다.
- source_word: שַׂקּוֹ
  english_pob_choice: his sackcloth
  chosen_korean: 굵은 베옷
  alternatives_korean:
  - 삼베옷
  - 상복
  lexicon: HALOT
  rationale: ‘베옷/삼베옷’은 애도와 굴욕의 표지라는 문화적 기능을 전달하면서도, 한국어 독자에게 의미가 바로 드러나도록 ‘굵은 베옷’으로 풀어 옮겼습니다.
theological_decisions:
- issue: 왕비의 반응을 나타내는 동사의 정서 강도
  chosen_reading: 단순한 놀람이 아니라 모르드개의 애도 상태를 보고 크게 괴로워한 것으로 번역했습니다.
  alternative_readings:
  - 몹시 충격을 받았습니다
  - 깊이 동요했습니다
  rationale: 히브리어 동사는 감정적·신체적 동요를 강하게 표현하므로, 본문의 긴박함과 관계적 연민을 살리는 번역이 필요합니다.
  doctrine_reference: 서사 본문 정서 표현의 등가성
