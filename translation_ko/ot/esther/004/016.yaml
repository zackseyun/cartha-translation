- source_word: כְּנוֹס / כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  english_pob_choice: gather all the Jews who are found in Susa
  chosen_korean: 수산에 있는 모든 유다인들을 모으십시오
  alternatives_korean:
  - 수산에 있는 모든 유다인들을 모으십시오
  - 수산에 있는 모든 유다인들을 집합시키십시오
  lexicon: HALOT
  rationale: כְּנוֹס의 ‘모으다’는 회중을 한데 불러모으는 동작을 자연스럽게 드러내며, הנמצאים는 장소 안에 ‘있는’ 사람들을 가리키므로 ‘있는’이 한국어로도 가장 직접적입니다.
- source_word: וְצוּמוּ עָלַי
  english_pob_choice: and fast for me
  chosen_korean: 나를 위해 금식하되
  alternatives_korean:
  - 나를 위해 금식하되
  - 나를 대신하여 금식하되
  - 나를 위하여 금식하되
  lexicon: HALOT
  rationale: עַל + 1인칭은 에스더의 처지를 염두에 둔 금식으로 이해하는 것이 자연스러워 ‘나를 위해’로 옮겼습니다.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  english_pob_choice: for three days, night and day
  chosen_korean: 사흘 동안 밤낮으로
  alternatives_korean:
