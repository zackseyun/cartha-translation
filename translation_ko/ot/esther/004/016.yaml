source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
  footnotes:
  - marker: a
    text: Or, 'all the Jews who are in Susa.' The Hebrew participle literally means 'who are found' or 'who are present.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'fast on my behalf.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'my maids' or 'my female attendants.'
    reason: lexical_alternative
  - marker: d
    text: Or, 'contrary to the law.'
    reason: lexical_alternative
  - marker: e
    text: Or, 'and when I perish, I perish.' The Hebrew wording is terse and emphatic, expressing Esther's acceptance of the risk.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 수산에 있는 모든 유다인들을 모으십시오. 나를 위해 금식하되, 사흘 동안 밤낮으로 먹지도 마시지도 마십시오. 나도 내 여종들과 함께 그와 같이 금식하겠습니다. 그런 뒤에 나는 율법에 맞지 않더라도 왕에게 나아가겠습니다. 내가 죽게 되면 죽겠습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수산에 있는 모든 유다인들’로 옮길 수 있습니다. 히브리어 분사는 문자적으로 ‘발견된’ 또는 ‘있는’의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 대신하여 금식하라’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 여자종들’ 또는 ‘내 여성 시종들’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘법에 어긋나더라도’입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘내가 죽을 때 죽겠습니다.’ 히브리어 표현은 짧고 강하게, 에스더가 닥칠 위험을 받아들이는 태도를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנוֹס / כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  english_pob_choice: gather all the Jews who are found in Susa
  chosen_korean: 수산에 있는 모든 유다인들을 모으십시오
  alternatives_korean:
  - 수산에 있는 모든 유다인들을 모으십시오
  - 수산에 있는 모든 유다인들을 집합시키십시오
  lexicon: HALOT
  rationale: כְּנוֹס의 ‘모으다’는 회중을 한데 불러모으는 동작을 자연스럽게 드러내며, הנמצאים는 장소 안에 ‘있는’ 사람들을 가리키므로 ‘있는’이 한국어로도 가장 직접적입니다.
- source_word: וְצוּמוּ עָלַי
  english_pob_choice: and fast for me
  chosen_korean: 나를 위해 금식하되
  alternatives_korean:
  - 나를 위해 금식하되
  - 나를 대신하여 금식하되
  - 나를 위하여 금식하되
  lexicon: HALOT
  rationale: עַל + 1인칭은 에스더의 처지를 염두에 둔 금식으로 이해하는 것이 자연스러워 ‘나를 위해’로 옮겼습니다.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  english_pob_choice: for three days, night and day
  chosen_korean: 사흘 동안 밤낮으로
  alternatives_korean:
  - 사흘 동안 밤낮으로
  - 사흘 동안 밤과 낮에
  - 사흘 밤낮으로
  lexicon: HALOT
  rationale: משך의 강한 연속성을 한국어 관용 표현인 ‘밤낮으로’로 살리되, 기간은 ‘사흘 동안’으로 분명히 했습니다.
- source_word: נַעֲרֹתַי
  english_pob_choice: my young women also
  chosen_korean: 내 여종들과 함께
  alternatives_korean:
  - 내 여종들과 함께
  - 내 젊은 여자종들과 함께
  - 내 시녀들과 함께
  lexicon: HALOT
  rationale: נַעֲרוֹת는 궁정의 여성 시종들을 가리킬 수 있어, 성별과 종속성을 모두 드러내는 ‘여종들’이 문맥상 가장 적절합니다.
- source_word: כַדָּת
  english_pob_choice: according to the law
  chosen_korean: 율법에 맞지 않더라도
  alternatives_korean:
  - 율법에 맞지 않더라도
  - 법에 어긋나더라도
  - 규례에 어긋나더라도
  lexicon: HALOT
  rationale: כַדָּת는 왕의 출입 규정/법규를 가리키므로, 본문이 말하는 위법성을 분명히 하되 지나치게 해설적이지 않게 ‘율법에 맞지 않다’로 옮겼습니다.
- source_word: אָבֹוא אֶל הַמֶּלֶךְ ... וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  english_pob_choice: I will go to the king ... and if I perish, I perish
  chosen_korean: 왕에게 나아가겠습니다. 내가 죽게 되면 죽겠습니다.
  alternatives_korean:
  - 왕에게 나아가겠습니다. 내가 죽게 되면 죽겠습니다.
  - 왕에게 들어가겠습니다. 내가 망하게 되면 망하겠습니다.
  - 왕에게 나아가겠습니다. 죽으면 죽겠습니다.
  lexicon: HALOT
  rationale: ‘나아가다’는 왕 앞에 접근하는 행위를 자연스럽게 드러내며, 반복형 종결은 결연한 수용을 살려 ‘죽게 되면 죽겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 에스더의 금식이 단순 개인 금식이 아니라 공동체적 연대와 중보를 포함하는지
  chosen_reading: ‘나를 위해 금식하되’로 번역해 에스더의 위기와 공동체의 동참을 함께 드러냈습니다.
  alternative_readings:
  - ‘나를 대신하여 금식하되’
  - ‘나를 위하여 금식하되’
  rationale: עַל + 1인칭은 대상/관계를 나타내므로, 금식의 수혜가 에스더 자신에게 집중되지만 공동체가 그 사정을 짊어진다는 뉘앙스를 보존하는 것이 좋습니다.
  doctrine_reference: 공동체적 중보와 연대에 대한 성경적 서술
