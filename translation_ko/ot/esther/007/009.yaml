  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
  footnotes:
  - marker: a
    text: Hebrew 'the tree/wood' (הָעֵץ); here it refers to an execution structure, traditionally rendered 'gallows.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who spoke well for the king' or 'who spoke in the king’s favor.'
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'Impale him on it'; the Hebrew terminology can refer more broadly to suspension on a wooden structure than to a later-style gallows.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하르보나는 왕 앞에 선 내시들 중 하나로서 말했습니다. “또 보십시오. 하만이 모르드개를 위해 만든 그 나무가—왕에게 선한 말을 한 사람을 위해 만든 그 나무가—지금 하만의 집에 서 있는데, 높이가 오십 규빗입니다.” 왕이 말했습니다. “그 위에 매달아라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 나무/목재’(הָעֵץ). 여기서는 처형용 구조물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕에게 잘 말한 사람’ 또는 ‘왕의 편에서 말한 사람’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 위에 못 박아라’의 뉘앙스일 수 있습니다. 히브리어 표현은 후기의 교수대보다 더 넓게, 목재 구조물에 매다는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  english_pob_choice: Harbonah
  chosen_korean: 하르보나
  alternatives_korean:
  - 하르보나
  - 하르보나
  lexicon: 고유명사 표기 관행
  rationale: 고유명사는 현대 한국어 음역으로 옮겼습니다. 영어 POB의 Harbonah에 대응하되, 한국어 독자가 바로 읽을 수 있는 표기를 택했습니다.
- source_word: הַסָּרִיסִים
  english_pob_choice: eunuchs
  chosen_korean: 내시들
  alternatives_korean:
  - 환관들
  - 궁중 관리들
  lexicon: HALOT
  rationale: 페르시아 궁정 맥락에서 סָרִיס는 단순 관리보다 ‘내시’가 더 직접적입니다. 본문의 궁정적 배경과 직역성을 함께 살렸습니다.
- source_word: גַּם הִנֵּה
  english_pob_choice: Also, behold
  chosen_korean: 또 보십시오
  alternatives_korean:
  - 또 보라
  - 또, 보십시오
  lexicon: HALOT
  rationale: 추가 정보 제시와 주의를 끄는 뉘앙스를 살려 ‘또 보십시오’로 옮겼습니다. 왕에게 말하는 직접 인용이므로 공손한 명령형이 자연스럽습니다.
- source_word: הָעֵץ
  english_pob_choice: gallows
  chosen_korean: 나무
  alternatives_korean:
  - 교수대
  - 장대
  - 형틀
  lexicon: HALOT
  rationale: 히브리어 원어는 문자적으로 ‘나무/목재’이며, 에스더서에서는 처형용 구조물을 가리킵니다. 본문에선 원문의 폭을 보존해 ‘나무’로 두고, 처형 기구임은 문맥이 드러내도록 했습니다.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  english_pob_choice: who spoke good for the king
  chosen_korean: 왕에게 선한 말을 한
  alternatives_korean:
  - 왕을 위해 좋은 말을 한
  - 왕의 편에서 좋은 말을 한
  - 왕에게 좋은 말을 한
  lexicon: HALOT
  rationale: 관용적 표현을 과도하게 풀지 않고, 영어 POB가 유지한 ‘spoke good for the king’의 의미 범위를 따라 ‘왕에게 선한 말을 한’으로 옮겼습니다. 모르드개의 행위가 왕에게 유익했던 점을 함축합니다.
- source_word: תְּלֻהוּ עָלָיו
  english_pob_choice: Hang him on it
  chosen_korean: 그 위에 매달아라
  alternatives_korean:
  - 거기에 매달아라
  - 그것에 매달아라
  - 그 위에 달아라
  lexicon: HALOT
  rationale: 히브리어의 핵심은 그 구조물에 사람을 ‘매다는’ 명령입니다. 한국어에서는 자연스럽고도 직설적인 ‘매달아라’가 가장 가깝습니다.
theological_decisions:
- issue: הָעֵץ의 처형 방식이 현대 독자에게는 ‘교수형’ 또는 ‘매달기’로 읽힐 수 있으나, 히브리어는 더 넓은 처형용 목재 구조물을 가리킵니다.
  chosen_reading: 본문에는 ‘나무’와 ‘매달아라’를 유지해 원문의 넓은 의미를 보존했습니다.
  alternative_readings:
  - 교수대
  - 장대
  - 형틀
  - 그 위에 달아라
  rationale: 영어 POB가 ‘gallows’로 풀되 각주에서 원어의 폭을 설명한 것처럼, 한국어 본문은 원어의 문자성과 서사적 명확성을 함께 살리는 방향이 적절합니다.
  doctrine_reference: 본문 비평/어휘 의미 범위
- issue: 왕의 명령은 직접 인용 안에서 짧고 단호한 군령체입니다.
  chosen_reading: “그 위에 매달아라.”
  alternative_readings:
  - “그 위에 매달라.”
  - “그것에 매달아라.”
  rationale: 직접 명령의 단호함을 유지하되, 한국어 합쇼체 본문 속 인용문으로서 어조를 과장하지 않았습니다.
  doctrine_reference: 서술/화행 관찰
