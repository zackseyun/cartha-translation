source:
  edition: WLC
  text: וַ/תַּ֨עַן אֶסְתֵּ֤ר הַ/מַּלְכָּה֙ וַ/תֹּאמַ֔ר אִם מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ הַ/מֶּ֔לֶךְ וְ/אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב תִּנָּֽתֶן לִ֤/י נַפְשִׁ/י֙ בִּ/שְׁאֵ֣לָתִ֔/י וְ/עַמִּ֖/י בְּ/בַקָּשָׁתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “grant me my life at my petition, and my people at my request.” The Hebrew more literally says, “let my life be given to me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕후 에스더가 대답하여 말했습니다. “왕이시여, 제가 왕의 눈에 들었다면, 또 왕께서 좋게 여기신다면, 제 청원대로 제 생명을 제게 주시고, 제 요청대로 제 백성도 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청원’과 ‘요청’은 히브리어의 가까운 의미를 지닌 서로 다른 청원어(שְׁאֵלָה, בַּקָּשָׁה)를 구별하여 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 서사 속 대화 응답을 나타내는 동사 연쇄를 자연스러운 합쇼체로 옮기되, 단순한 ‘대답했습니다’보다 ‘대답하여 말했습니다’가 원문의 응답-발화 구조를 더 잘 드러냅니다.
- source_word: הַמַּלְכָּה
  english_pob_choice: Queen Esther
  chosen_korean: 왕후 에스더
  alternatives_korean:
  - 에스더 왕후
  - 여왕 에스더
  lexicon: HALOT
  rationale: 히브리어의 관직 호칭을 한국어 왕실 표현인 ‘왕후’로 옮겨 서술의 격식을 살렸습니다.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: If I have found favor in your eyes
  chosen_korean: 제가 왕의 눈에 호의를 얻었고
  alternatives_korean:
  - 제가 왕의 눈에 은혜를 얻었고
  - 제가 왕께 호의를 얻었고
  lexicon: HALOT
  rationale: ‘눈에 호의를 얻다’는 히브리어 관용구를 비교적 직역하되, חֵן을 문맥상 ‘은혜’보다 공적 청원 장면에 맞는 ‘호의’로 옮겼습니다.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: and if it pleases the king
  chosen_korean: 왕께서 좋게 여기신다면
  alternatives_korean:
  - 왕에게 좋다면
  - 왕이 기뻐하신다면
  lexicon: HALOT
  rationale: ‘좋다’의 왕실적 판단 의미를 자연스럽게 살리면서, 공손한 조건문으로 재현했습니다.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  english_pob_choice: let my life be given me
  chosen_korean: 제 생명을 ... 제게 주시고
  alternatives_korean:
  - 제 목숨을 제게 주시고
  - 제 생명을 주시고
  lexicon: HALOT
  rationale: נֶפֶשׁ은 이 죽음 위협 문맥에서 ‘생명/목숨’이므로 비물질적 ‘영혼’이 아니라 생명으로 옮겼고, 수동형 요청을 한국어에서 자연스러운 공손한 청원으로 풀었습니다.
- source_word: בִּשְׁאֵלָתִי
  english_pob_choice: at my petition
  chosen_korean: 제 청원대로
  alternatives_korean:
  - 제 탄원대로
  - 제 요청대로
  lexicon: HALOT
  rationale: שְׁאֵלָה의 공식적 ‘청원’을 살리되, 한국어에서는 조사구보다 목적어식 표현이 더 자연스러워 ‘대로’로 처리했습니다.
- source_word: בְּבַקָּשָׁתִי
  english_pob_choice: at my request
  chosen_korean: 제 요청대로
  alternatives_korean:
  - 제 부탁대로
  - 제 탄원대로
  lexicon: HALOT
  rationale: 앞의 שְׁאֵלָה와 구별되는 दूसरी 요청 어휘를 한국어에서도 ‘요청’으로 대응시켜 반복을 유지했습니다.
theological_decisions:
- issue: 왕에게 직접 청원하는 에스더의 발화 등록
  chosen_reading: 경의와 긴급성을 함께 유지하는 공적 청원체로 옮겼습니다.
  alternative_readings:
  - 더 구어적인 간청체
  - 더 전통적인 성경체
  rationale: 본문은 궁정 예절 속에서 생명과 민족의 구원을 요청하는 장면이므로, 합쇼체를 유지하되 지나치게 경직되거나 고어적이지 않게 조정했습니다.
  doctrine_reference: 서사 본문 문체 일관성
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘영혼’이 아니라 ‘생명/목숨’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 자기 자신
  rationale: 문맥이 사형 위협과 구명 청원에 있으므로, 독자가 추상적 영혼 개념으로 오해하지 않도록 생명 의미를 분명히 했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
