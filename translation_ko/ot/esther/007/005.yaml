source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
  footnotes:
  - marker: a
    text: Hebrew 'who has filled his heart to do this,' an idiom meaning 'who has dared' or 'who has presumed' to do such a thing.
    reason: lexical_alternative
  - marker: b
    text: Or, less likely, 'and which one is he?' if the phrase is taken as identifying the person rather than asking his whereabouts.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 아하수에로 왕이 에스더 왕비에게 말했습니다. “누구입니까? 또 어디 있습니까? 마음에 이런 일을 하려는 뜻을 품은 자가?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 마음을 채우다’는 관용구로, 여기서는 ‘감히’ 또는 ‘주제넘게’ 그런 일을 하다라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 덜 가능성 있게, ‘그리고 그가 어느 쪽에 있습니까?’로도 읽을 수 있습니다. 문구를 사람의 위치가 아니라 정체를 묻는 것으로 볼 때의 대안입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: Then King Ahasuerus said
  chosen_korean: 그러자 아하수에로 왕이 말했습니다
  alternatives_korean:
  - 그리고 아하수에로 왕이 말했습니다
  - 아하수에로 왕이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어의 자연스러운 사건 전환으로 옮기기 위해 ‘그러자’로 처리했습니다.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: to Esther the queen
  chosen_korean: 에스더 왕비에게
  alternatives_korean:
  - 왕비 에스더에게
  - 에스더 왕후에게
  lexicon: HALOT
  rationale: 히브리어의 ‘에스더 the queen’이라는 부연구조를 살리되, 한국어에서는 가장 직접적인 ‘에스더 왕비’가 자연스럽습니다.
- source_word: מִי הוּא זֶה
  english_pob_choice: Who is he
  chosen_korean: 누구입니까
  alternatives_korean:
  - 그는 누구입니까
  - 이 사람은 누구입니까
  lexicon: HALOT
  rationale: 남성 지시대명사의 반복된 강조를 한국어에서는 조사된 의문문으로 자연스럽게 옮기되, 정체를 캐묻는 힘을 유지했습니다.
- source_word: וְאֵי זֶה הוּא
  english_pob_choice: and where is he
  chosen_korean: 또 어디 있습니까
  alternatives_korean:
  - 그리고 어디 있습니까
  - 또 어디에 있습니까
  lexicon: HALOT
  rationale: אֵי는 이 문맥에서 위치를 묻는 말이므로 ‘어디’로 옮겼고, 앞의 신원 질문과 병렬을 이루도록 ‘또’를 붙였습니다.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ לַעֲשׂוֹת כֵּן
  english_pob_choice: who has filled his heart to do this
  chosen_korean: 마음에 이런 일을 하려는 뜻을 품은 자가
  alternatives_korean:
  - 마음을 채워 이런 일을 하게 된 자가
  - 이런 일을 하도록 마음이 부풀어 오른 자가
  lexicon: HALOT
  rationale: 직역하면 ‘그의 마음을 채운’이지만 한국어에서 자연스럽지 않으므로, 본문의 관용구가 뜻하는 ‘감히/주제넘게 마음먹다’를 드러내는 ‘뜻을 품다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 '마음을 채우다'의 함축
  chosen_reading: 직접적인 심리 묘사보다 ‘감히 그런 일을 하려는 마음을 먹다’는 의미를 살렸습니다.
  alternative_readings:
  - 그의 마음을 채운 자가
  - 그런 일을 하도록 마음이 부풀어 오른 자가
  rationale: 이 표현은 단순한 감정 충만이 아니라 대담함·무례함을 묻는 왕의 질책이므로, 한국어에서는 의미 기능을 드러내는 쪽이 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 에 7:5의 수사적 질문과 관용 표현
