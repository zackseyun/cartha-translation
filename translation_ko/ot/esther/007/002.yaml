  source_fidelity: ‘잔칫상 앞에서’는 בְּמִשְׁתֵּה הַיַּיִן(‘포도주의 잔치에서/술잔치에서’)의 핵심 요소인 포도주와 연회라는 장소를 모두 약화시키며, ‘앞에서’라는 뜻은 원문에 없습니다. 또한 ‘이루어지겠습니다’는 자동사적·피동적 약속으로 어색하고, 왕이 청을 실행하겠다는 선언을 자연스럽게 전달하지 못합니다.
  naturalness: ‘포도주 잔치에서’는 현대 표준어에서 자연스럽고 원문의 연회 장면을 명확히 합니다. 왕의 발화는 합쇼체를 유지하되 ‘청하다/바라다’와 ‘들어주다/이루어 주다’로 공손하면서도 왕실의 약속에 맞게 다듬었습니다.
