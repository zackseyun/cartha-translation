  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ הַ/מֶּ֨לֶךְ לְ/אֶסְתֵּ֜ר גַּ֣ם בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֛/ךְ אֶסְתֵּ֥ר הַ/מַּלְכָּ֖ה וְ/תִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
  footnotes:
  - marker: a
    text: Or, more literally, 'at the banquet of wine.'
    reason: lexical_alternative
  - marker: b
    text: The expression 'up to half the kingdom' is a conventional royal offer expressing extraordinary favor, not necessarily a literal proposal to divide the realm.
    reason: cultural_note
translation:
  language: ko
  text: 왕이 둘째 날에도, 곧 잔칫상 앞에서 에스더에게 말했습니다. “에스더 왕후여, 무엇을 원하십니까? 그것을 당신에게 허락하겠습니다. 또 무엇을 구하십니까? 나라의 반까지라도 이루어지겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잔칫상 앞에서’는 ‘포도주 잔치/술잔치’의 장면성을 살린 의역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라의 반까지라도’는 실제 분할 제안이 아니라, 극도의 호의를 나타내는 관용적 왕실 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  english_pob_choice: on the second day also
  chosen_korean: 둘째 날에도
  alternatives_korean:
  - 또 둘째 날에
  - 둘째 날에도 역시
  lexicon: HALOT
  rationale: גַּם의 반복·계속 뉘앙스를 ‘에도’로 자연스럽게 살렸고, בַּיּוֹם הַשֵּׁנִי는 ‘둘째 날’로 직역에 가깝게 옮겼습니다.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  english_pob_choice: at the banquet of wine
  chosen_korean: 잔칫상 앞에서
  alternatives_korean:
  - 술잔치에서
  - 포도주 잔치에서
  lexicon: HALOT
  rationale: 본문의 관용구는 포도주가 있는 연회 자리를 가리키므로, 한국어에서는 장면을 살린 ‘잔칫상 앞에서’로 풀어 자연스러운 서술을 만들었습니다.
- source_word: מַה שְּׁאֵלָתֵךְ ... וּמַה בַּקָּשָׁתֵךְ
  english_pob_choice: What is your petition ... And what is your request
  chosen_korean: 무엇을 원하십니까?... 또 무엇을 구하십니까?
  alternatives_korean:
  - 무엇이 당신의 청입니까?
  - 무엇을 청하시겠습니까?
  lexicon: HALOT
  rationale: שְׁאֵלָה와 בַּקָּשָׁה의 반복을 한국어에서 동일어 반복보다 ‘원하다/구하다’로 나누어, 왕의 공손한 청원 수락 질문임을 드러냈습니다.
- source_word: וְתִנָּתֵן לָךְ ... וְתֵעָשׂ
  english_pob_choice: It will be granted to you ... it shall be done
  chosen_korean: 그것을 당신에게 허락하겠습니다... 이루어지겠습니다
  alternatives_korean:
  - 당신에게 주어지겠습니다
  - 당신의 말대로 되겠습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 공문서적·왕실적 선언성을 한국어에서 ‘허락하겠습니다/이루어지겠습니다’로 옮겨, 단순 미래보다 약속의 수행력을 살렸습니다.
- source_word: עַד חֲצִי הַמַּלְכוּת
  english_pob_choice: Even to half the kingdom
  chosen_korean: 나라의 반까지라도
  alternatives_korean:
  - 왕국의 절반까지라도
  - 나라의 절반이라도
  lexicon: HALOT
  rationale: 관용적 과장 표현이므로 문자적으로 분할을 제안하는 뜻이 아니라는 점을 해치지 않으면서, 한국어의 ‘까지라도’로 최댓값의 허용을 표현했습니다.
theological_decisions:
- issue: 왕의 과장된 호의 표현을 어떻게 전달할지
  chosen_reading: ‘나라의 반까지라도’로 옮겨, 실제 분할 제안이 아니라 왕실적 관용 표현이라는 뉘앙스를 본문 안에서 유지했습니다.
  alternative_readings:
  - ‘왕국의 절반까지라도’
  - ‘반 왕국이라도’
  rationale: 본문의 의미는 과장된 왕실 수락 약속이지 정치적 제안이 아니므로, 독자가 수사적 관용어로 이해하도록 처리했습니다.
  doctrine_reference: 본문 맥락/수사학
