  source_fidelity: 히브리어 본문은 ‘왕과 하만이 왕비 에스더와 함께 마시러 왔다’는 뜻이며, 초안은 와우 연속법의 서사 진행, לִשְׁתּוֹת의 단순한 ‘마시다’, 그리고 에스더의 왕비 칭호를 충실히 반영합니다. 원문에 없는 포도주나 잔치의 대상을 덧붙이지 않았습니다.
