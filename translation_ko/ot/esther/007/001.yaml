  terminology: “왕”, “하만”, “왕비 에스더”는 일관되고 적절합니다. ‘왕비’는 הַמַּלְכָּה의 칭호를 자연스럽게 옮기며, 특정 교파적 해석을 덧붙이지 않습니다.
