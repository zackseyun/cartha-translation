lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 들어왔습니다
  - 들어갔습니다
  lexicon: HALOT
  rationale: wayyiqtol of בוא는 서사를 진행시키는 단순 과거로 읽는 것이 자연스러우며, 여기서는 이동의 결과를 살려 ‘왔습니다’가 원문에 가장 가깝습니다.
- source_word: לִשְׁתּוֹת
  english_pob_choice: to drink
  chosen_korean: 마시러
  alternatives_korean:
  - 술을 마시러
  - 잔치하려
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘마시다’라는 동사를 쓰므로, 잔치의 함의를 덧붙이되 원문 동사를 보존하는 ‘마시러’가 적절합니다.
- source_word: הַמַּלְכָּה
  english_pob_choice: Queen Esther
  chosen_korean: 왕비 에스더
  alternatives_korean:
  - 에스더 왕비
  - 왕후 에스더
  lexicon: HALOT
  rationale: הַמַּלְכָּה는 직역하면 ‘그 왕비’이므로, 한국어에서는 지위를 앞세운 ‘왕비 에스더’가 자연스럽고 원문의 호칭도 유지합니다.
- source_word: וַ
  english_pob_choice: So
  chosen_korean: 그리하여
  alternatives_korean:
  - 그리고
  - 그러자
  lexicon: HALOT
  rationale: 문두의 waw는 앞선 서사를 이어 주는 내러티브 접속사이므로, 단순 병렬보다 결과·진행의 흐름을 살리는 ‘그리하여’가 적합합니다.
