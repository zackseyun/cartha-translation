  lexicon: HALOT
  rationale: 세 동사는 수난의 점증을 이루므로, 모두 같은 말로 평탄화하지 않고 피해자 관점의 결과 표현으로 옮겼습니다. 아바드의 최종적 상실은 '사라지게'로 완화하지 않되 중복을 피했습니다.
