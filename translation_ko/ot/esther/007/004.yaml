base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male slaves and female slaves, I would have kept silent, for the adversary is not worth the damage to the king.
  footnotes:
  - marker: a
    text: Or 'the king’s loss.' The Hebrew expression can denote damage, injury, or financial loss to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 저와 제 백성이 멸망하고, 죽임을 당하고, 없어지도록 팔렸기 때문입니다. 그러나 우리가 남자 노예와 여자 노예로 팔렸더라면, 저는 잠잠히 있었을 것입니다. 그 대적이 왕의 손해를 보상할 수 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '왕의 손실'. 히브리어 표현은 왕에게 끼친 손해, 피해, 또는 재정적 손실을 뜻할 수 있습니다.
    reason: lexical_alternative
