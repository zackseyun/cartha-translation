  rationale: 궁정 맥락에서 특정 인물을 가리키는 적대자를 포괄적으로 살리되, 곧 이어질 하만을 암시하는 인칭성을 유지했습니다.
- source_word: בְּנֵזֶק הַמֶּלֶךְ
  english_pob_choice: the damage to the king
  chosen_korean: 왕에게 끼치는 손해
