id: EST.7.7
reference: Esther 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מֶּ֜לֶךְ קָ֤ם בַּ/חֲמָת/וֹ֙ מִ/מִּשְׁתֵּ֣ה הַ/יַּ֔יִן אֶל גִּנַּ֖ת הַ/בִּיתָ֑ן וְ/הָמָ֣ן עָמַ֗ד לְ/בַקֵּ֤שׁ עַל נַפְשׁ/וֹ֙ מֵֽ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה כִּ֣י רָאָ֔ה כִּֽי כָלְתָ֥ה אֵלָ֛י/ו הָ/רָעָ֖ה מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
  footnotes:
  - marker: a
    text: Or 'stood to seek his life from Esther the queen.' The Hebrew is more literally 'stood to seek for his life from Esther the queen.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for he saw that the disaster against him was finished/decided from the king.' The Hebrew expression conveys that the king's judgment against Haman was now fixed.
    reason: lexical_alternative
  - marker: c
    text: '''Palace garden'' translates a phrase that could also be rendered ''garden of the pavilion'' or ''garden of the palace complex.'''
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕은 포도주 잔치에서 분노하여 일어나 궁정 정원으로 나갔습니다. 하만은 왕비 에스더에게 자기 목숨을 구해 달라고 매달리고 있었습니다[a], 그가 왕이 자기에게 내리기로 한 재앙이 이미 결정된 것을 보았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하만은 왕비 에스더에게서 자기 목숨을 구하려고 서 있었습니다.’ 히브리어는 더 문자적으로는 ‘왕비 에스더에게서 자기 목숨을 구하려고 서 있었다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕이 자기에게 내린 재앙이 끝났음을 보았기 때문입니다.’ 히브리어 표현은 하만을 향한 왕의 판결이 이제 확정되었음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  english_pob_choice: in his wrath
  chosen_korean: 분노하여
  alternatives_korean:
  - 진노하여
  - 격분하여
  lexicon: HALOT
  rationale: חֵמָה의 강한 분노를 한국어로 자연스럽게 살리면서, 이어지는 서술 동작과도 잘 이어지도록 했습니다.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  english_pob_choice: from the wine banquet
  chosen_korean: 포도주 잔치에서
  alternatives_korean:
  - 포도주의 잔치에서
  - 술잔치에서
  lexicon: HALOT
  rationale: Esther 문맥의 잔치를 한국어로 자연스럽게 옮기되, 원문에 있는 포도주를 분명히 드러냈습니다.
- source_word: גִּנַּת הַבִּיתָן
  english_pob_choice: the palace garden
  chosen_korean: 궁정 정원
  alternatives_korean:
  - 왕궁 정원
  - 궁전 정원
  lexicon: HALOT
  rationale: בִּיתָן이 궁전/정원 단지를 가리킬 수 있으므로, 현대 한국어에서 자연스럽고 문맥에 맞는 궁정 정원으로 옮겼습니다.
- source_word: עָמַד לְבַקֵּשׁ עַל נַפְשׁוֹ
  english_pob_choice: remained to beg ... for his life
  chosen_korean: 매달리고 있었습니다
  alternatives_korean:
  - 목숨을 구해 달라고 애원하고 있었습니다
  - 자기 목숨을 구해 달라고 간청하고 있었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘서서 구하다’이지만, 여기서는 왕이 떠난 뒤 하만이 에스더에게 목숨을 구걸하는 절박한 상황이므로 그 의미를 한국어 동작으로 풀어 자연스럽게 살렸습니다.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה מֵאֵת הַמֶּלֶךְ
  english_pob_choice: for he saw that the evil against him had been determined by the king
  chosen_korean: 왕이 자기에게 내리기로 한 재앙이 이미 결정된
  alternatives_korean:
  - 왕이 자기에게 내린 재앙이 끝난
  - 왕의 결정으로 자기에게 닥칠 재앙이 확정된
  lexicon: HALOT
  rationale: כָלְתָה는 단순한 ‘끝남’보다 판결의 확정/종결을 뜻하므로, 하만에게 닥칠 재앙이 왕에 의해 이미 결정된 상태임을 드러냈습니다.
theological_decisions:
- issue: הָרָעָה의 의미 범위
  chosen_reading: ‘재앙’으로 옮겨, 도덕적 악이라기보다 하만에게 닥친 파멸적 판결을 강조했습니다.
  alternative_readings:
  - 악
  - 해악
  - 파멸
  rationale: 문맥상 הָרָעָה는 하만을 향한 왕의 판결로 인한 재난을 가리키므로, 한국어에서 가장 오해가 적은 ‘재앙’을 선택했습니다.
  doctrine_reference: 문맥 우선의 서사 번역 원칙
- issue: ‘매달리고 있었습니다’의 서술화
  chosen_reading: 원문의 ‘서서 구하다’라는 관용을 한국어 서사에서 통용되는 절박한 애원 동작으로 풀었습니다.
  alternative_readings:
  - 서서 구하려 했습니다
  - 구걸하고 있었습니다
  rationale: 하만의 체면이 무너진 긴박한 장면을 살리기 위해, 자세 묘사보다 행위의 의미를 전면화했습니다.
  doctrine_reference: 서사 담화 기능 보존
