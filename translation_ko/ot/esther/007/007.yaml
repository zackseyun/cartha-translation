revisions:
- from: 그때 왕은 포도주 잔치에서 분노하여 일어나 궁정 정원으로 나갔습니다. 하만은 왕비 에스더에게 자기 목숨을 구해 달라고 매달리고 있었습니다[a], 그가 왕이 자기에게 내리기로 한 재앙이 이미 결정된 것을 보았기 때문입니다[b].
  to: 그때 왕은 분노하여 포도주 잔치에서 일어나 왕궁 정원으로 나갔습니다. 그러나 하만은 남아 왕비 에스더에게 자기 목숨을 살려 달라고 애원했습니다[a]. 그는 왕이 자신에게 내릴 재앙이 이미 확정된 것을 보았기 때문입니다[b].
  rationale: 왕의 퇴장에 맞서 하만이 남아 있는 장면의 대조를 ‘그러나 하만은 남아’로 보존했습니다. 확정된 왕의 판결이라는 כָלְתָה의 의미는 ‘이미 확정된’으로 옮겨 미래의 단순한 의도라는 뉘앙스를 피했습니다. 장소 표현은 현대 표준어에서 더 명료한 ‘왕궁 정원’으로 다듬었습니다.
