id: EST.7.10
reference: Esther 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְלוּ֙ אֶת הָמָ֔ן עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֣ין לְ/מָרְדֳּכָ֑י וַ/חֲמַ֥ת הַ/מֶּ֖לֶךְ שָׁכָֽכָה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
  footnotes:
  - marker: a
    text: Or 'they impaled Haman on the stake/tree that he had prepared for Mordecai.' The Hebrew uses עֵץ ('tree,' 'wood,' 'stake'), and the verb can refer more broadly to hanging up a body; the exact execution method is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하만을 그가 모르드개를 위해 마련한 나무에[a] 매달았고, 왕의 분노는 가라앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들은 하만을 그가 모르드개를 위해 마련한 말뚝이나 나무에 꿰었다.' 히브리어 עֵץ는 '나무, 목재, 말뚝'을 뜻할 수 있고, 동사 תלה는 시신을 매달거나 걸어 두는 행위를 더 넓게 가리킬 수 있습니다. 정확한 처형 방식은 논쟁됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  english_pob_choice: they hanged
  chosen_korean: 매달았고
  alternatives_korean:
  - 달았고
  - 처형했으며
  - 목매달았고
  lexicon: HALOT
  rationale: תלה의 기본 의미인 '매달다/달다'를 살리되, 한국어에서는 사건의 결과를 자연스럽게 전달하는 '매달다'를 택했습니다. '목매달다'는 형벌 방식의 특정성을 덧씌울 수 있어 본문 표지에는 두지 않았습니다.
- source_word: עַל הָעֵץ
  english_pob_choice: on the gallows
  chosen_korean: 나무에
  alternatives_korean:
  - 틀에
  - 형틀에
  - 교수대에
  - 나무 기둥에
  lexicon: HALOT
  rationale: עֵץ는 직역하면 '나무/목재/나무 기둥'이지만, 에스더서에서는 처형 장치로 쓰인 넓은 범주의 표현이므로 '나무'를 유지했습니다. POB의 본문 선택인 'gallows'의 해석적 기능은 살리되, 원문의 넓은 어휘 범위는 각주로 보존합니다.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  english_pob_choice: that he had prepared for Mordecai
  chosen_korean: 그가 모르드개를 위하여 마련한
  alternatives_korean:
  - 그가 모르드개를 위해 준비한
  - 그가 모르드개에게 마련해 둔
  lexicon: HALOT
  rationale: הכין은 '준비하다, 마련하다'의 뜻이므로 '마련하다'로 옮겨, 하만이 모르드개를 위해 준비한 장치라는 아이러니를 자연스럽게 드러냈습니다.
- source_word: וַחֲמַת הַמֶּלֶךְ שָׁכָכָה
  english_pob_choice: and the king’s wrath subsided
  chosen_korean: 왕의 분노는 가라앉았습니다
  alternatives_korean:
  - 왕의 분노는 잦아들었습니다
  - 왕의 노여움은 누그러졌습니다
  lexicon: HALOT
  rationale: חֵמָה를 '분노'로 옮기고, שׁכך의 'subside' 의미를 한국어의 '가라앉다'로 자연스럽게 표현했습니다. 문맥상 감정의 강도가 남아 있으므로 '누그러지다'보다 '가라앉다'가 더 직접적입니다.
theological_decisions:
- issue: 처형 방식의 정확성(매달기/목에 매단 교수형/말뚝에 꽂기)
  chosen_reading: 본문에는 '나무에 매달다'를 두고, 방식의 불확실성은 각주로 열어 두었습니다.
  alternative_readings:
  - 교수대에 달다
  - 말뚝에 꽂다
  - 목매달다
  rationale: 히브리어 עֵץ와 תלה는 에스더서에서 정확한 집행 방식을 단정하기에 충분하지 않으므로, 본문은 원문의 넓은 표현을 살리고 각주에서 해석적 대안을 제시하는 편이 가장 투명합니다.
  doctrine_reference: 본문 비평/역사적 해석의 개방성
