id: EST.3.7
reference: Esther 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/חֹ֤דֶשׁ הָ/רִאשׁוֹן֙ הוּא חֹ֣דֶשׁ נִיסָ֔ן בִּ/שְׁנַת֙ שְׁתֵּ֣ים עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ אֲחַשְׁוֵר֑וֹשׁ הִפִּ֣יל פּוּר֩ ה֨וּא הַ/גּוֹרָ֜ל לִ/פְנֵ֣י הָמָ֗ן מִ/יּ֧וֹם לְ/י֛וֹם וּ/מֵ/חֹ֛דֶשׁ לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
  footnotes:
  - marker: a
    text: Or, more literally, 'from day to day and from month to month, twelve, that is, the month of Adar.' The sense is that the lot-casting extended through the calendar until the twelfth month.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 달, 곧 니산월에, 아하수에로 왕의 열두째 해에, 부르—곧 제비—를 하만 앞에서 하루에서 하루로, 또 달에서 달로 던졌는데, 그것이 열두째 달, 곧 아달월이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: In the first month
  chosen_korean: 첫째 달에
  alternatives_korean:
  - 첫째 달
  - 첫 달에
  lexicon: HALOT
  rationale: 달력상의 시점을 자연스러운 현대 한국어로 옮기되, ‘첫째’로 원문의 서수표현을 보존했습니다.
- source_word: הוּא חֹדֶשׁ נִיסָן
  english_pob_choice: that is, the month of Nisan
  chosen_korean: 곧 니산월에
  alternatives_korean:
  - 곧 니산입니다
  - 즉, 니산월
  lexicon: HALOT
  rationale: 히브리어의 설명적 동격을 ‘곧’으로 드러내어, 달 이름이 해설로 붙는 구조를 살렸습니다.
- source_word: הִפִּיל פּוּר / הוּא הַגּוֹרָל
  english_pob_choice: Pur ... was cast / that is, the lot
  chosen_korean: 부르—곧 제비—를 ... 던졌는데
  alternatives_korean:
  - 부르—곧 제비—가 뽑혔는데
  - 부르—즉 제비—를 던졌는데
  lexicon: HALOT
  rationale: פּוּר의 음역을 유지하고, 이어지는 설명어 ‘제비’로 뜻을 밝혔습니다. 한국어에서는 ‘제비를 던지다’가 제비뽑기 관용에 가깝습니다.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  english_pob_choice: from day to day and from month to month
  chosen_korean: 하루에서 하루로, 또 달에서 달로
  alternatives_korean:
  - 날에서 날로, 또 달에서 달로
  - 날마다, 달마다
  lexicon: HALOT
  rationale: 반복과 진행을 나타내는 히브리어 평행 구조를 보존하면서, 현대 한국어로는 더 자연스러운 ‘하루에서 하루로’로 옮겼습니다.
- source_word: שְׁנֵים עָשָׂר ... חֹדֶשׁ אֲדָר
  english_pob_choice: until the twelfth month, that is, the month of Adar
  chosen_korean: 열두째 달, 곧 아달월
  alternatives_korean:
  - 열두째 달, 즉 아달월
  - 아달월인 열두째 달
  lexicon: HALOT
  rationale: 마지막 도달점을 분명히 하되, 달 이름의 해설 구조를 앞뒤로 맞추어 한국어에서도 동격 관계가 드러나게 했습니다.
theological_decisions:
- issue: 제비뽑기 행위의 번역과 운명성의 뉘앙스
  chosen_reading: ‘부르—곧 제비—를 ... 던졌는데’로 옮겨, 단순한 ‘운’이 아니라 실제 제비뽑기 행위를 드러냈습니다.
  alternative_readings:
  - ‘부르가 뽑혔는데’
  - ‘제비를 뽑았는데’
  rationale: 본문은 하만 앞에서 이루어진 절차적 제비뽑기를 말하므로, 사건의 물리적 행위를 약화시키지 않도록 직접적으로 표현했습니다.
  doctrine_reference: 섭리와 인간 행위의 병행
- issue: 달 이름의 이중 표기
  chosen_reading: ‘첫째 달, 곧 니산월’과 ‘열두째 달, 곧 아달월’로 달 서수와 고유명을 함께 보존했습니다.
  alternative_readings:
  - 고유명만 제시
  - 서수만 제시
  rationale: 본문의 달력 설명을 유지해야 시간 경과와 이야기의 긴박감이 선명해지므로, 해설적 동격을 그대로 살렸습니다.
  doctrine_reference: 본문의 서사적 시간표시
