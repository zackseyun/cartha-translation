translation:
  language: ko
  text: 그때 왕의 신하들로서 왕의 문 앞에 있던 자들이 모르드개에게 말했습니다. “왜 당신은 왕의 명령을 어기고 있습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  english_pob_choice: the king’s servants
  chosen_korean: 왕의 신하들
  alternatives_korean:
  - 왕의 종들
  - 왕의 시종들
  - 왕의 관리들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עֶבֶד는 직역하면 ‘종/노예’이지만, 여기서는 왕궁 문에서 근무하는 관원들을 가리키므로 한국어로는 ‘신하들’이 가장 자연스럽고 기능도 잘 드러냅니다.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: who were at the king’s gate
  chosen_korean: 왕의 문 앞에 있던
  alternatives_korean:
  - 왕의 문에 있던
  - 왕의 문 안에 있던
  - 왕의 문에 배치되어 있던
  lexicon: HALOT
  rationale: בְּשַׁעַר은 문자적으로 ‘문/성문’의 위치를 가리키므로, 현대 한국어에서는 ‘문 앞에’가 가장 자연스럽게 궁정의 출입구 위치를 전달합니다.
- source_word: עוֹבֵר אֵת מִצְוַת הַמֶּלֶךְ
  english_pob_choice: are you transgressing the king’s command
  chosen_korean: 왕의 명령을 어기고 있습니까
  alternatives_korean:
  - 왕의 명령을 범하고 있습니까
  - 왕의 명령을 거스르고 있습니까
  - 왕의 명령을 위반하고 있습니까
  lexicon: HALOT
  rationale: עוֹבֵר는 단순한 ‘건너다’보다 규범을 ‘넘어 어기다/위반하다’는 뜻이 강하므로, 한국어 동사로는 ‘어기다’가 가장 평이하고 정확합니다. POB의 formal register를 살리기 위해 문장 전체는 ‘…습니까’로 유지했습니다.
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어째서
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 직접적인 이유를 묻는 의문사이므로 ‘왜’가 가장 간결하고 본문의 날카로운 질문감을 보존합니다.
