revisions:
- from: 그달 첫째 달, 곧 그 달의 열셋째 날에 왕의 서기관들이 소집되었고, 하만이 왕의 총독들과 각 지방을 다스리는 관원들, 그리고 각 민족의 지도자들에게 명한 그대로 기록되었습니다. 각 지방에는 그 지방의 글로, 각 민족에게는 그들의 언어로 기록되었으며, 아하수에로 왕의 이름으로 쓰고 왕의 반지로 인봉되었습니다.[a]
  to: 첫째 달, 곧 그 달 열셋째 날에 왕의 서기관들이 소집되었습니다. 하만이 명령한 모든 내용대로 왕의 사트라프들과 각 지방을 관할하는 총독들, 그리고 각 민족의 관리들에게 보낼 문서가 작성되었는데, 각 지방에는 그 지방의 문자[a]로, 각 민족에게는 그 민족의 언어로 작성되었습니다. 그 문서는 아하수에로 왕의 이름으로 작성되고 왕의 인장 반지로 봉인되었습니다.
  rationale: 첫째 달의 날짜 표현을 바로잡고, 원문에 구별되어 있는 페르시아 행정 직함을 ‘사트라프’와 ‘총독’으로 구분했습니다. 원문의 수동형 ‘기록되었다’를 한국어에서 자연스럽게 표현하기 위해 ‘보낼 문서가 작성되었다’고 하되, 문서의 내용이나 종류를 교리적·해석적으로 확정하지 않았습니다. 문자와 언어의 배정을 각각 지방과 민족에 명확히 연결하고, 각주를 해당 어휘에 배치했습니다.
  reviewer_model: gpt-5.6-terra
