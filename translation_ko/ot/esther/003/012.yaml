language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
  footnotes:
  - marker: a
    text: Or, more literally, 'it was written according to all that Haman commanded.'
    reason: lexical_alternative
  - marker: b
    text: '''Script'' refers to the writing system used by each province.'
    reason: cultural_note
translation:
  language: ko
  text: 그달 첫째 달, 곧 그 달의 열셋째 날에 왕의 서기관들이 소집되었고, 하만이 왕의 총독들과 각 지방을 다스리는 관원들, 그리고 각 민족의 지도자들에게 명한 그대로 기록되었습니다. 각 지방에는 그 지방의 글로, 각 민족에게는 그들의 언어로 기록되었으며, 아하수에로 왕의 이름으로 쓰고 왕의 반지로 인봉되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘글’은 여기서 단순한 문장체가 아니라 각 지방의 문자 체계를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  english_pob_choice: were summoned
  chosen_korean: 소집되었고
  alternatives_korean:
  - 불려왔고
  - 소집되었으며
  lexicon: HALOT
  rationale: 수동적 뉘앙스를 살리면서 궁정 행정 문맥에 맞는 공적·정식 표현으로 옮겼습니다.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  english_pob_choice: the king’s scribes
  chosen_korean: 왕의 서기관들
  alternatives_korean:
  - 왕의 기록관들
  - 왕의 서기들
  lexicon: HALOT
  rationale: 궁정 문서 작성자라는 기능을 자연스럽고 정확하게 드러내는 표현입니다.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ / הַפַּחוֹת / שָׂרֵי עַם וָעָם
  english_pob_choice: the king’s satraps / the governors ... / the officials of each people
  chosen_korean: 왕의 총독들과 각 지방을 다스리는 관원들, 그리고 각 민족의 지도자들
  alternatives_korean:
  - 왕의 사트라프들과 ...
  - 왕의 지방장관들과 ...
  lexicon: HALOT
  rationale: 페르시아 행정 직함은 한국어 독자에게 의미가 풀리도록 기능 중심으로 옮기되, 위계적 구분은 유지했습니다.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ / וְעַם וָעָם כִּלְשׁוֹנוֹ
  english_pob_choice: to every province in its own script and to every people in its own language
  chosen_korean: 각 지방에는 그 지방의 글로, 각 민족에게는 그들의 언어로
  alternatives_korean:
  - 각 지방마다 그 지방의 문자로
  - 각 민족마다 그들의 말로
  lexicon: HALOT
  rationale: כְּתָב는 단순한 '글'보다 문자 체계까지 포괄할 수 있으므로, POB의 'script' 의도를 한국어로 무리 없이 전달했습니다.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  english_pob_choice: sealed with the king’s signet ring
  chosen_korean: 왕의 반지로 인봉되었습니다
  alternatives_korean:
  - 왕의 인장 반지로 봉인되었습니다
  - 왕의 도장 반지로 봉인되었습니다
  lexicon: HALOT
  rationale: טַבַּעַת은 단순한 반지이지만 봉인 도구로 기능하므로, 본문 의미를 풀어 '인봉'과 함께 전달했습니다.
