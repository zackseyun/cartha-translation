  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
  footnotes:
  - marker: a
    text: Or 'to leave them alone' / 'to tolerate them.' The Hebrew verb can mean to let someone be or permit them to remain undisturbed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 하만이 아하수에로 왕에게 말했습니다. 「한 백성이 있는데, 그들은 왕국의 모든 지방에 여러 민족들 사이로 흩어져 있고 갈라져 있습니다. 그들의 법은 모든 백성의 법과 다르고, 왕의 법도 지키지 않으니, 왕께서는 그들을 그대로 두시는 것이 이익이 되지 않습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사의 뜻은 ‘그대로 두다, 내버려 두다, 방치하다’까지 넓어질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  english_pob_choice: There is a certain people
  chosen_korean: 한 백성이 있는데
  alternatives_korean:
  - 어떤 백성이 있는데
  - 한 민족이 있는데
  - 일부 백성이 있는데
  lexicon: HALOT
  rationale: ‘עַם אֶחָד’의 단수·부정적 도입을 살리면서, 하만의 의도적으로 모호하고 암시적인 말투를 자연스럽게 옮겼습니다.
- source_word: מְפֻזָּר וּמְפֹרָד
  english_pob_choice: scattered and separated
  chosen_korean: 여러 민족들 사이로 흩어져 있고 갈라져 있습니다
  alternatives_korean:
  - 흩어져 있고 분리되어 있습니다
  - 흩어져 있고 나뉘어 있습니다
  lexicon: HALOT
  rationale: 두 분사가 나란히 놓인 점을 살려 ‘흩어져’와 ‘갈라져’로 병렬 번역했고, 단순한 물리적 흩어짐과 구별됨을 함께 드러냈습니다.
- source_word: בֵּין הָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 여러 민족들 사이로
  alternatives_korean:
  - 백성들 사이에
  - 민족들 가운데
  lexicon: HALOT
  rationale: 제국 내의 여러 민족 집단을 가리키는 복수 개념을 반영하기 위해 ‘민족들’로 옮겼습니다.
- source_word: דָתֵיהֶם / דָּתֵי הַמֶּלֶךְ
  english_pob_choice: their laws / the king’s laws
  chosen_korean: 그들의 법 / 왕의 법
  alternatives_korean:
  - 그들의 율법 / 왕의 율법
  - 그들의 규례 / 왕의 규례
  lexicon: HALOT
  rationale: 페르시아 궁정 문맥에서의 דָּת는 법령·법 체계를 가리키므로, 하만의 법적 고발 성격을 살려 ‘법’으로 일관되게 옮겼습니다.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה לְהַנִּיחָם
  english_pob_choice: so it is not in the king’s interest to let them remain
  chosen_korean: 왕께서는 그들을 그대로 두시는 것이 이익이 되지 않습니다
  alternatives_korean:
  - 왕께 유익하지 않습니다
  - 왕께서 그들을 내버려 두시는 것이 합당하지 않습니다
  - 왕께서 그들을 그대로 두어도 좋지 않습니다
  lexicon: HALOT
  rationale: שֹׁוֶה의 ‘이익/유익’ 의미와 הִנִּיחַ의 ‘그대로 두다, 남겨 두다’ 의미를 함께 살렸습니다. POB의 해설대로 단순히 ‘학대하다’가 아니라 ‘두다/용인하다’의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 하만의 발화 속 적대적 일반화와 서술 톤
  chosen_reading: 하만의 발언을 직접 인용하되, 인신공격적 평가를 덧붙이지 않고 원문이 드러내는 제국 관리의 계산적 혐오를 그대로 보존했습니다.
  alternative_readings:
  - 보다 해설적으로 풀어 ‘문제가 되는 백성’처럼 완화하는 읽기
  - 강한 비하 어조를 더해 의역하는 읽기
  rationale: 본문은 하만의 정치적 설득 논리를 보여 주는 장면이므로, 독자에게 그의 혐오와 계산을 직접 듣게 하는 것이 source-faithful합니다.
  doctrine_reference: 서술 충실성과 화자 관점 보존
