id: EST.3.11
reference: Esther 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הָמָ֔ן הַ/כֶּ֖סֶף נָת֣וּן לָ֑/ךְ וְ/הָ/עָ֕ם לַ/עֲשׂ֥וֹת בּ֖/וֹ כַּ/טּ֥וֹב בְּ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
  footnotes:
  - marker: a
    text: Or 'The money is given to you.' Hebrew כֶּסֶף can mean 'silver' literally or 'money' by extension.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the people' is grammatically singular but collective; English renders the following pronoun as plural ('them') for natural sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 하만에게 말했습니다. 「은은 네게 주고, 백성도 네게 맡기니, 그들을 네가 좋게 여기는 대로 하십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּסֶף는 문자적으로 ‘은’을 뜻하지만, 문맥에 따라 ‘돈’으로도 넓게 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘백성’은 문법상 단수이지만 집합명사입니다. 뒤의 히브리어 대명사도 문법상 단수이나, 한국어에서는 집단의 구성원을 가리켜 ‘그들을’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC / HALOT
  rationale: 와우-연속형의 서술 진행을 한국어의 자연스러운 사건 전개로 옮기되, 단순 접속보다 결과적 흐름이 드러나도록 했습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: The silver
  chosen_korean: 은
  alternatives_korean:
  - 돈
  lexicon: HALOT
  rationale: כֶסֶף의 기본 의미인 ‘은’을 살려 원문 이미지를 보존했습니다. 문맥상 ‘돈’도 가능하지만, 본문은 실제 은의 전달을 말하는 표현으로 보입니다.
- source_word: וְהָעָם
  english_pob_choice: and the people also
  chosen_korean: 백성도
  alternatives_korean:
  - 그리고 백성도
  - 사람들도
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 한국어에서 자연스럽게 압축해 두 번째 대상이 추가로 넘겨졌음을 드러냈습니다.
- source_word: לַעֲשׂוֹת בּוֹ
  english_pob_choice: to do with them
  chosen_korean: 그들에게 하십시오
  alternatives_korean:
  - 그들을 마음대로 하십시오
  - 그들에 대해 행하십시오
  lexicon: HALOT
  rationale: 목적 부정사의 결과 의미를 한국어 명령형으로 옮겼고, 집합명사 ‘백성’에 대응하는 대명사는 문맥상 복수로 처리했습니다.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  english_pob_choice: as seems good in your eyes
  chosen_korean: 네 눈에 좋게 보이는 대로
  alternatives_korean:
  - 네가 좋게 여기는 대로
  - 네 보기에 좋은 대로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘눈에 좋다’는 이미지를 살리면서도 현대 한국어에서 이해되도록 표현했습니다.
theological_decisions:
- issue: 왕의 허가가 사실상 학살 권한처럼 서술되는 표현의 강도
  chosen_reading: 본문의 허가적 어조를 완화하지 않고, 하만이 백성을 ‘그들에게 하십시오’로 처리할 수 있도록 넘겨받았다는 점을 직설적으로 옮겼습니다.
  alternative_readings:
  - 그들에게 원하는 대로 하게 하십시오
  - 그들을 어떻게 하든 좋습니다
  rationale: 에스더 3장의 서사적 긴장과 왕의 무책임한 양도를 약화시키지 않기 위해, 원문의 위임 표현을 그대로 드러냈습니다.
  doctrine_reference: 본문 해석상 강도 보존
- issue: ‘네 눈에 좋게 보이는 대로’의 관용적 의미
  chosen_reading: 관용구를 문자적 이미지를 살리면서도 심리적 선호와 판단 권한의 위임으로 이해되도록 옮겼습니다.
  alternative_readings:
  - 네 뜻대로
  - 네가 좋다고 생각하는 대로
  rationale: 원문의 관용적 표현을 단순 평이화하면 ‘보기에 좋다’는 왕의 승인 뉘앙스가 약해지므로, 이미지와 의미를 함께 유지했습니다.
  doctrine_reference: 히브리어 관용구 보존
