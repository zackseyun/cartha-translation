id: EST.3.9
reference: Esther 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִכָּתֵ֖ב לְ/אַבְּדָ֑/ם וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים כִּכַּר כֶּ֗סֶף אֶשְׁקוֹל֙ עַל יְדֵי֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה לְ/הָבִ֖יא אֶל גִּנְזֵ֥י הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
  footnotes:
  - marker: a
    text: Or 'If it pleases the king.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten thousand talents of silver,' a very large sum measured by weight rather than coined currency.
    reason: cultural_note
  - marker: c
    text: Or 'by the hands of those who do the work,' that is, through the agency of the officials carrying it out.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 좋게 여기시면, 그것을 멸하라는 조서가 기록되게 하소서. 그리고 나는 은 열만 달란트를 일꾼들의 손에 달아, 왕의 곳간에 들이겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋게 여기시면’은 왕의 승낙을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘은 열만 달란트’는 화폐가 아니라 무게로 측정된 매우 큰 액수입니다.
    reason: cultural_note
  - marker: c
    text: ‘일꾼들의 손에’는 ‘그 일을 수행하는 자들의 손을 통해’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: If it seems good to the king
  chosen_korean: 왕이 좋게 여기시면
  alternatives_korean:
  - 왕이 기뻐하시면
  - 왕이 좋다고 여기시면
  lexicon: HALOT
  rationale: 왕의 승인/호의를 나타내는 관용구로, 현대 한국어에서는 ‘좋게 여기다’가 가장 자연스럽고 원문의 판단 뉘앙스를 잘 보존합니다.
- source_word: יִכָּתֵב
  english_pob_choice: let it be written
  chosen_korean: 기록되게 하소서
  alternatives_korean:
  - 쓰이게 하소서
  - 조서가 내려지게 하소서
  - 기록되게 하십시오
  lexicon: HALOT
  rationale: 문자 그대로는 ‘기록되다’이지만, 궁정 문맥에서 공식 조서 작성 요청임이 분명하므로 수동형의 문서화 뉘앙스를 살려 옮겼습니다.
- source_word: לְאַבְּדָם
  english_pob_choice: that they be destroyed
  chosen_korean: 그것을 멸하라는
  alternatives_korean:
  - 그들을 멸하라는
  - 그들이 멸망하도록 하라는
  - 그들을 없애라는
  lexicon: HALOT
  rationale: 히브리어의 목적/내용 표현을 한국어 종속절로 옮겼고, ‘멸하다’는 단순 제거보다 파괴적·치명적 의도를 더 직접적으로 드러냅니다.
- source_word: עֹשֵׂי הַמְּלָאכָה
  english_pob_choice: those who do the work
  chosen_korean: 일꾼들의 손에
  alternatives_korean:
  - 일하는 자들의 손에
  - 그 일을 맡은 자들의 손에
  - 그 일을 하는 사람들의 손에
  lexicon: HALOT
  rationale: 문맥상 실행 담당자들을 가리키므로, 영어 POB의 ‘those who do the work’에 맞춰 ‘일꾼들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 역설적 청원에서 왕의 ‘좋게 여김’ 표현 유지
  chosen_reading: 왕의 재가를 요청하는 궁정 예절 표현으로 평이하게 유지했습니다.
  alternative_readings:
  - 왕이 기뻐하시면
  - 왕의 뜻에 합당하면
  rationale: 이 구절은 하나님의 뜻이 아니라 아하수에로 왕의 판단을 전제로 한 정치적 요청이므로, 경건화하거나 신학적으로 완곡하게 만들지 않았습니다.
  doctrine_reference: 서사문맥의 왕권 언어 보존
