revisions:
- from: 왕이 좋게 여기시면, 그것을 멸하라는 조서가 기록되게 하소서. 그리고 나는 은 열만 달란트를 일꾼들의 손에 달아, 왕의 곳간에 들이겠습니다.[a][b][c]
  to: 왕이 좋게 여기시면[a], 그들을 멸하라는 내용이 기록되게 하소서. 그러면 저는 은 만 달란트[b]를 그 일을 하는 사람들의 손에[c] 달아 맡겨, 왕의 곳간으로 가져가게 하겠습니다.
  rationale: 수량 표현을 ‘만 달란트’로 바로잡고, 복수 목적어를 ‘그들을’로 회복했습니다. 또한 본문에 없던 ‘조서’를 제거하여 ‘기록되다’라는 원문의 표현을 보존했습니다. 담당자의 정체는 특정 관료나 노동자로 한정하지 않고 ‘그 일을 하는 사람들’로 유지했으며, 은을 그들의 손에 달아 맡긴 뒤 왕의 곳간으로 가져가게 한다는 문장 구조로 원문의 위탁과 목적 관계를 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:03Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘은 열만 달란트’는 한국어에서 통상 십만 달란트로 이해되므로, 히브리어 עֲשֶׂרֶת אֲלָפִים(만 달란트)를 잘못 전달합니다. 또한 לְאַבְּדָם의 목적어는 복수 인간 집단이므로 ‘그것을’이 아니라 ‘그들을’이어야 합니다. ‘손에’와 ‘가져가게’의 관계는 원문의 위탁/매개 및 목적을 보존하도록 다듬었습니다.
  naturalness: ‘왕이 좋게 여기시면’과 ‘하소서’는 궁정 청원의 합쇼체로 자연스럽습니다. ‘그 일을 하는 사람들’은 ‘일꾼들’보다 원문의 포괄성을 보존하며, ‘손에 달아 맡겨’는 은을 무게로 달아 위탁하는 뜻을 자연스럽게 나타냅니다.
  terminology: ‘멸하다’, ‘달란트’, ‘곳간’은 문맥과 한국어 성경 문체에 적절합니다. ‘만 달란트’로 바로잡아 수량을 정확히 전달해야 합니다. ‘조서’는 궁정 문맥상 가능하나 히브리어 본문에 명시되지 않았으므로 본문에서는 보충하지 않았습니다.
  issues:
  - severity: high
    issue: ‘은 열만 달란트’
    rationale: ‘열만’은 한국어 수사상 10만을 뜻합니다. 원문의 ‘열 천’, 곧 1만 달란트는 ‘만 달란트’로 옮겨야 합니다.
  - severity: high
    issue: ‘그것을 멸하라는’
    rationale: לְאַבְּדָם의 접미사 -ם은 복수 남성형이며, 문맥상 유대 백성을 가리킵니다. 무생물 단수 대명사 ‘그것’을 사용할 수 없습니다.
  - severity: medium
    issue: ‘조서’의 본문 보충
    rationale: יִכָּתֵב은 문자적으로 ‘기록되게 하소서’입니다. 공식 문서의 함의는 있으나 ‘조서’를 본문에 넣으면 명시되지 않은 명사를 보충하게 되므로, 내용이 기록되게 한다는 표현이 더 가깝습니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주 a, b, c는 각각 왕의 승인 관용구, 달란트 수량, ‘손에’의 매개 의미에 연결되므로 해당 표현 바로 뒤에 배치하는 편이 독자가 지시 대상을 명확히 알 수 있습니다.
