translation:
  language: ko
  text: 그러자 왕은 손에서 인장 반지를 빼어 함메다다의 아들인 아각 사람 하만, 곧 유대인들의 원수에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들.’ 히브리어 יְהוּדִים는 더 넓게는 유대 민족을, 어떤 문맥에서는 유다/유대 지방 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר / טַבַּעְתּוֹ
  english_pob_choice: took his signet ring
  chosen_korean: 자기 손에서 인장 반지를 빼어
