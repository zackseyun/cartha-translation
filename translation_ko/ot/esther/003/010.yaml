  lexicon: HALOT
  rationale: 동사 סור의 ‘제거하다/빼다’ 뜻과 궁정 맥락의 공식 표지를 반영해, 단순한 반지보다 권한을 상징하는 ‘인장 반지’로 옮겼습니다.
