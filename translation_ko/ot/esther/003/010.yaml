    rationale: 원문의 소유 접미사는 왕의 손을 가리키지만, 한국어에서는 주어가 왕이므로 ‘손에서’만으로도 충분히 자연스럽고 의미가 보존됩니다.
  revised_text: 그러자 왕은 손에서 인장 반지를 빼어 함메다다의 아들인 아각 사람 하만, 곧 유대인들의 원수에게 주었습니다.[a]
