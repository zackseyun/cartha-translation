source:
  edition: WLC
  text: וַ/יָּ֧סַר הַ/מֶּ֛לֶךְ אֶת טַבַּעְתּ֖/וֹ מֵ/עַ֣ל יָד֑/וֹ וַֽ/יִּתְּנָ֗/הּ לְ/הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י צֹרֵ֥ר הַ/יְּהוּדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Hebrew יְהוּדִים can denote the Jewish people more broadly or, in some contexts, people of Judah/Judea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕은 자기 손에서 인장 반지를 빼어 하만에게 주었습니다. 하만은 함메다다의 아각 사람이며, 유대인들의 원수였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들.’ 히브리어 יְהוּדִים는 더 넓게는 유대 민족을, 어떤 문맥에서는 유다/유대 지방 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר / טַבַּעְתּוֹ
  english_pob_choice: took his signet ring
  chosen_korean: 자기 손에서 인장 반지를 빼어
  alternatives_korean:
  - 그의 반지를 가져
  - 그의 인장 반지를 빼어
  lexicon: HALOT
  rationale: 동사 סור의 ‘제거하다/빼다’ 뜻과 궁정 맥락의 공식 표지를 반영해, 단순한 반지보다 권한을 상징하는 ‘인장 반지’로 옮겼습니다.
- source_word: מֵעַל יָדוֹ
  english_pob_choice: from his hand
  chosen_korean: 자기 손에서
  alternatives_korean:
  - 손에서부터
  - 그의 손에서
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지가 자연스럽게 드러나도록 직역에 가깝게 처리하되, 현대 한국어에서 매끄럽게 읽히도록 했습니다.
- source_word: הָאֲגָגִי
  english_pob_choice: the Agagite
  chosen_korean: 아각 사람
  alternatives_korean:
  - 아각 사람
  - 아각의 후손
  lexicon: HALOT
  rationale: 고유한 집단/계보 표지를 보존하면서도 한국어 독자가 이해하기 쉬운 형태로 옮겼습니다. 본문에서 전통적 음역보다 의미가 드러나도록 했습니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유다 사람들
  - 유대 사람들
  lexicon: HALOT
  rationale: 에스더서는 특정 지역 주민보다 민족적·공동체적 집단을 가리키는 용례가 자연스러워 ‘유대인들’이 가장 적절합니다.
theological_decisions:
- issue: צֹרֵר הַיְּהוּדִים의 적대 관계 표현
  chosen_reading: 유대인들의 원수
  alternative_readings:
  - 유대인들의 적대자
  - 유대인들의 대적
  rationale: 단순한 일반적 반대가 아니라 서사의 긴장과 파괴적 적의를 드러내는 명사형 표현이 가장 직접적입니다.
  doctrine_reference: 본문 서사 어휘의 보존
