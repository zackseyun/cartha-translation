source:
  edition: WLC
  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
  footnotes:
  - marker: a
    text: Or 'bowing' and 'paying homage.' The Hebrew uses two related but distinct verbs for acts of obeisance.
    reason: lexical_alternative
translation:
  language: ko
  text: 하만이 모르드개가 하만 앞에서 무릎을 꿇지도 않고 엎드리지도 않는 것을 보고, 하만은 분노로 가득 찼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 관련되지만 구별되는 두 동사를 사용합니다. 첫 동사는 무릎을 꿇거나 몸을 굽히는 것을, 둘째 동사는 몸을 엎드리는 경배·복종의 몸짓을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּרֵעַ
  english_pob_choice: bowing down
  chosen_korean: 꿇지도 않고
  alternatives_korean:
  - 무릎을 꿇지도 않고
  - 절하지도 않고
  lexicon: HALOT
  rationale: כרע는 무릎을 굽히거나 몸을 숙이는 동작으로, ‘꿇다’가 간결하게 그 자세를 살리면서 뒤의 동사와 구별됩니다.
- source_word: וּמִשְׁתַּחֲוֶה
  english_pob_choice: prostrating himself
  chosen_korean: 엎드리지도
  alternatives_korean:
  - 절하지도
  - 경배하지도
  lexicon: HALOT
  rationale: השׁתחוה는 더 강한 몸짓의 엎드림·경배를 가리키므로, 앞의 ‘꿇다’와 의미 차이를 살려 ‘엎드리다’로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: before him
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그에게
  - 그 앞에서
  lexicon: HALOT
  rationale: 동작의 방향을 한국어 자연문으로 풀어 ‘그 앞에서’의 관계를 분명히 했습니다.
- source_word: חֵמָה
  english_pob_choice: rage
  chosen_korean: 분노
  alternatives_korean:
  - 격노
  - 노여움
  - 격분
  lexicon: HALOT
  rationale: חֵמָה는 강한 분노를 뜻하지만, 한국어에서는 문맥상 과도하게 감정적이지 않으면서도 강도를 보존하는 ‘분노’가 적절합니다.
theological_decisions:
- issue: 두 동사의 병렬이 만드는 ‘절하지 않음’의 강도
  chosen_reading: ‘꿇지도 않고 엎드리지도 않는’으로 두 동작을 구별해 번역했습니다.
  alternative_readings:
  - ‘절하지도 않고 경배하지도 않는’
  - ‘무릎도 꿇지 않고 엎드려 절하지도 않는’
  rationale: 히브리어는 서로 가까우면서도 다른 두 동사를 병렬로 사용해 모르드개의 거절을 강조하므로, 한국어도 중복을 피하면서 구별을 유지해야 합니다.
  doctrine_reference: 본문의 서사적·예배적 긴장 보존
- issue: ‘분노로 가득 찼다’의 관용구
  chosen_reading: 히브리어 관용구를 살려 ‘분노로 가득 찼습니다’로 옮겼습니다.
  alternative_readings:
  - ‘몹시 화가 났습니다’
  - ‘격노했습니다’
  rationale: וַיִּמָּלֵא ... חֵמָה는 단순히 화가 난 상태보다 감정이 가득 찬 상태를 표현하므로, 구조를 보존하는 번역이 더 충실합니다.
  doctrine_reference: 서사적 강조의 보존
