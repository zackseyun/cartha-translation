  - severity: low
    issue: 각주의 ‘반복적으로 말합니다’는 원문의 문법적 의미를 과장합니다.
    rationale: 두 분사는 모르드개의 지속적인 비복종 상태를 나타내지만, 두 동사의 병렬 자체가 반복 행위를 뜻하지는 않습니다. 두 관련 동작의 구별을 설명하는 것이 정확합니다.
