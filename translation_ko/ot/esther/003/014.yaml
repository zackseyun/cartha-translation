  rationale: 히브리어의 분배적 반복은 자연스러운 한국어 본문에서는 ‘각 도마다’로 옮기고 각주로 보존했습니다. ‘문서의 사본’으로 중복을 제거했으며, 마지막 목적절은 ‘준비를 하도록 하였습니다’로 번역하여 준비 상태라는 원문의 뜻을 유지했습니다. 각주 표지는 본문에 모두 배치했습니다.
