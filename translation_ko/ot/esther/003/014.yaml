  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
  footnotes:
  - marker: a
    text: Or 'in each and every province.' The Hebrew repeats 'province' distributively for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'for that day,' referring to the specified day set by the decree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 서면 문서의 사본은 각 도와 도에서 법으로 공포되어야 하며[a], 모든 백성에게 널리 알려져, 그들이 이 날을 대비할 수 있어야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘도와 도’라고 반복하여, 각 도마다 빠짐없이 해당함을 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 날을 위하여’로도 옮길 수 있습니다. 히브리어는 지정된 날을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  english_pob_choice: a copy of the written decree
  chosen_korean: 그 서면 문서의 사본
  alternatives_korean:
  - 그 조서의 사본
  - 그 문서의 사본
  lexicon: HALOT
  rationale: פַּתְשֶׁגֶן은 공식 문서의 ‘사본’을 가리키고, הַכְּתָב은 단순한 글이 아니라 행정적 문서를 뜻하므로 ‘서면 문서의 사본’으로 옮겨 공문서성을 살렸습니다.
- source_word: לְהִנָּתֵן דָּת
  english_pob_choice: was to be issued as law
  chosen_korean: 법으로 공포되어야 하며
  alternatives_korean:
  - 법으로 반포되어야 하며
  - 법으로 선포되어야 하며
  lexicon: HALOT
  rationale: נתן의 수동 부정사와 דָּת의 행정적 효력을 고려하여, 단순 전달보다 공식적 시행을 드러내는 ‘법으로 공포되다’로 옮겼습니다.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  english_pob_choice: in every province and province
  chosen_korean: 각 도와 도에서
  alternatives_korean:
  - 모든 도마다
  - 각각의 도에서
  lexicon: HALOT
  rationale: 히브리어의 반복은 분배적 강조이므로, ‘각 도와 도’로 반복을 살려 ‘every province and province’의 뉘앙스를 반영했습니다.
- source_word: גָּלוּי לְכָל הָעַמִּים
  english_pob_choice: being made known to all the peoples
  chosen_korean: 모든 백성에게 널리 알려져
  alternatives_korean:
  - 모든 ժողովուրդ에게 알려져
  - 모든 민족에게 공표되어
  lexicon: HALOT
  rationale: גָּלוּי의 공적 공개성을 살려 ‘널리 알려지다’로 옮겼고, הָעַמִּים은 제국 내 여러 집단을 가리키므로 ‘백성들’보다 문맥상 자연스러운 ‘모든 백성’으로 처리했습니다.
- source_word: לִהְיוֹת עֲתִדִים לַיּוֹם הַזֶּה
  english_pob_choice: so that they would be ready for this day
  chosen_korean: 그들이 이 날을 대비할 수 있어야 합니다
  alternatives_korean:
  - 그들이 이 날에 준비되어야 합니다
  - 그들이 이 날을 맞을 준비가 되어야 합니다
  lexicon: HALOT
  rationale: עֲתִדִים은 ‘준비된 상태’를 뜻하므로, 현대 한국어에서 목적·준비 상태를 자연스럽게 드러내는 ‘대비할 수 있다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 분배적 반복 보존 여부
  chosen_reading: ‘각 도와 도’로 반복을 살려, 제국 전역에 걸친 포괄성을 드러냈습니다.
  alternative_readings:
  - ‘모든 도에서’
  - ‘각각의 도에서’
  rationale: 본문의 반복은 단순한 중복이 아니라 강조이므로, 이를 약화시키지 않도록 한국어에서도 반복 구조를 유지했습니다.
  doctrine_reference: 문맥 주해 / 본문 비평이 아닌 해석상 강조 보존
- issue: דָּת의 성격
  chosen_reading: ‘법으로 공포되다’로 번역해 단순한 전달이 아니라 공식적 효력을 가진 시행임을 드러냈습니다.
  alternative_readings:
  - ‘명령으로 발표되다’
  - ‘조서로 선포되다’
  rationale: 에스더서의 페르시아 행정어는 실제 시행력을 가진 법적 명령을 가리키므로, 한국어에서도 그 권위를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 에스더서 행정문맥 / 제국 칙령의 법적 효력
