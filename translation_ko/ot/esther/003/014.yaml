  source_fidelity: 히브리어의 행정 문구는 ‘문서의 사본’을 각 행정 구역에 법으로 공포하고 모든 민족에게 공개하여, 지정된 날에 대비하게 하는 내용입니다. 초안은 대체로 이를 반영하지만, ‘각 도와 도에서’는 히브리어의 분배적 반복을 한국어에서 부자연스럽게 직역한 표현입니다. 또한 עֲתִדִים은 ‘대비할 수 있음’보다 ‘준비되어 있음/준비하게 함’의 상태를 나타냅니다.
  naturalness: ‘서면 문서’는 의미가 겹치며, ‘각 도와 도’는 현대 표준어 문장으로 자연스럽지 않습니다. ‘각 도마다’에 각주로 반복 강조를 설명하고, 문장을 ‘공포하여 … 알리고’로 정리하면 현대적인 합쇼체 행정 서술로 자연스럽습니다.
  terminology: פַּתְשֶׁגֶן הַכְּתָב은 ‘그 문서의 사본’이 적절합니다. דָּת은 이 문맥에서 ‘법’으로, לְכָל הָעַמִּים은 제국 안의 복수 집단을 반영하여 ‘모든 민족에게’로 옮기는 것이 ‘모든 백성에게’보다 분명합니다.
