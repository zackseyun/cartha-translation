source:
  edition: WLC
  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
  footnotes:
  - marker: a
    text: Literally, 'the people of Mordecai'; that is, the people to whom Mordecai belonged.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모르드개 한 사람에게만 손을 대는 것을 하찮게 여겼습니다. 그들이 모르드개가 어느 민족에 속하는지[a] 그에게 알려 주었기 때문입니다. 그래서 하만은 아하수에로의 온 왕국에 있는 모든 유대인, 곧 모르드개의 민족을 멸하려고 꾀했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모르드개의 민족’입니다. 여기서는 모르드개가 속한 민족을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  english_pob_choice: it seemed contemptible in his eyes
  chosen_korean: 그의 눈에는 … 하찮게 여겨졌습니다
  alternatives_korean:
  - 그는 …를 업신여겼습니다
  - 그의 눈에는 … 경멸스럽게 보였습니다
  lexicon: HALOT
  rationale: בזה의 평가적 뉘앙스와 ‘눈에는’이라는 관용을 함께 살리되, 한국어에서는 자연스러운 수동·평가 표현인 ‘하찮게 여겨졌습니다’로 옮겼습니다.
- source_word: לִשְׁלֹחַ יָד בְּ
  english_pob_choice: to lay a hand on
  chosen_korean: 손을 대는 것
  alternatives_korean:
  - 공격하는 것
  - 해치는 것
  lexicon: HALOT
  rationale: 직역보다 한국어 관용을 살리면서도, 한 사람에게 물리적으로 위해를 가한다는 구체적 이미지를 유지했습니다.
- source_word: אֶת עַם מָרְדֳּכָי
  english_pob_choice: what people Mordecai belonged to
  chosen_korean: 모르드개의 민족이 무엇인지
  alternatives_korean:
  - 모르드개의 백성이 누구인지
  - 모르드개가 속한 민족이 무엇인지
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘모르드개의 백성’이지만, 여기서는 소속 관계를 드러내는 의미이므로 한국어에서는 ‘무엇인지’ 구조로 풀어 오해를 줄였습니다.
- source_word: לְהַשְׁמִיד
  english_pob_choice: to destroy
  chosen_korean: 멸하려고
  alternatives_korean:
  - 없애려고
  - 멸망시키려고
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 반영하되, 본문 전체의 서술 흐름에 맞게 ‘멸하다’로 간명하게 옮겼습니다.
- source_word: כָּל הַיְּהוּדִים
  english_pob_choice: all the Jews
  chosen_korean: 온 유대 사람들
  alternatives_korean:
  - 모든 유대인들
  - 온 유대인
  lexicon: HALOT
  rationale: 에스더서의 יְהוּדִים는 포로기/페르시아 제국 내 유대 공동체를 가리키므로, 익숙한 교회어보다 역사적 공동체를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘모르드개의 민족’의 소속 관계 표현
  chosen_reading: ‘모르드개의 민족’은 소유가 아니라 소속·동족 관계를 뜻하는 표현으로 처리했습니다.
  alternative_readings:
  - ‘모르드개의 백성’
  - ‘모르드개가 속한 민족’
  rationale: 본문은 하만이 모르드개 개인이 아니라 그가 속한 민족 전체를 표적으로 삼게 된 이유를 설명하므로, 소속 관계가 드러나도록 옮겼습니다.
  doctrine_reference: 서사적 문맥과 언어적 소속 표현의 보존
- issue: 파괴 동사의 강도
  chosen_reading: ‘멸하려고’로 번역해 의도된 전면적 파괴 의도를 분명히 했습니다.
  alternative_readings:
  - ‘파괴하려고’
  - ‘없애려고’
  rationale: 히브리어 הַשְׁמִיד는 단순 손상보다 훨씬 강한 멸절의 뜻을 가지므로, 서사의 위협 강도를 약화시키지 않도록 했습니다.
  doctrine_reference: 어휘 강도 보존
