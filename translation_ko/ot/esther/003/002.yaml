source:
  edition: WLC
  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
  footnotes:
  - marker: a
    text: Or 'prostrating themselves to Haman'; the Hebrew verb can also be rendered 'worshiping' in contexts where the object is divine.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the king had so commanded him,' though the pronoun is better understood as referring to Haman, that is, the command concerned the honor due to him.
    reason: alternative_reading
translation:
  language: ko
  text: 왕의 문에 있던 왕의 모든 신하들은 하만에게 절하고 엎드려 경의를 표하고 있었습니다.[a] 이는 왕이 하만에 관하여 그렇게 명령했기 때문입니다.[b] 그러나 모르드개는 절하지도 엎드려 경의를 표하지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하만에게 엎드려 절하는 것’으로 옮길 수 있습니다. 이 히브리어 동사는 대상이 신일 때에는 ‘경배하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕이 그에게 그렇게 명령했다’로도 볼 수 있습니다. 그러나 대명사 לוֹ는 하만을 가리키는 것으로 이해하는 편이 더 자연스럽습니다. 즉, 왕의 명령은 하만에게 드릴 경의에 관한 것이었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 신하들
  alternatives_korean:
  - 종들
  - 시종들
  - 관리들
  lexicon: HALOT
  rationale: 궁정 문맥에서 עֶבֶד/עַבְדֵי는 단순한 노예보다 왕에게 속한 궁정 신하를 가리키는 것이 자연스러워, 한국어로는 ‘신하들’이 가장 무난하고 문맥에 맞습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  english_pob_choice: at the king’s gate
  chosen_korean: 왕의 문에
  alternatives_korean:
  - 왕궁 문에
  - 왕의 성문에
  - 왕의 문 앞에
  lexicon: HALOT
  rationale: 이 표현은 왕실 행정과 공적 출입이 이루어지는 장소를 가리키므로, 영어의 ‘at the king’s gate’를 따라 ‘왕의 문에’라고 옮겨 구체적인 장소감을 살렸습니다.
- source_word: כֹּרְעִים וּמִשְׁתַּחֲוִים
  english_pob_choice: were bowing down and paying homage
  chosen_korean: 절하고 엎드려 경의를 표하고 있었는데
  alternatives_korean:
  - 몸을 굽히고 엎드리고 있었는데
  - 절하며 경배하고 있었는데
  - 엎드려 절하고 있었는데
  lexicon: HALOT
  rationale: 두 동사의 중첩된 예속·경의 행위를 한국어에서 자연스럽게 드러내기 위해 ‘절하다’와 ‘엎드려 경의를 표하다’를 병렬로 옮겼습니다. ‘경배하다’는 이 문맥에서 다소 종교적으로 들릴 수 있어 피했습니다.
- source_word: לְהָמָן
  english_pob_choice: to Haman
  chosen_korean: 하만에게
  alternatives_korean:
  - 하만에게 대해
  - 하만 앞에
  - 하만을 향해
  lexicon: HALOT
  rationale: 절과 경의의 대상이 인물 하만임을 분명히 하기 위해 단순한 여격 ‘하만에게’를 사용했습니다.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  english_pob_choice: for the king had so commanded concerning him
  chosen_korean: 왕이 그에 관하여 그렇게 명령했기 때문입니다
  alternatives_korean:
  - 왕이 그에게 그렇게 명령했기 때문입니다
  - 왕이 그를 두고 그렇게 명령했기 때문입니다
  - 왕이 그에게 그리 하라고 명령했기 때문입니다
  lexicon: HALOT
  rationale: לוֹ의 지시 대상을 하만으로 이해하여, 명령의 대상이라기보다 하만에 대한 조치가 명령되었음을 반영했습니다. ‘그에 관하여’는 이 모호성을 한국어로도 보존합니다.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  english_pob_choice: would not bow down or pay homage
  chosen_korean: 절하지도 엎드려 경의를 표하지도 않았습니다
  alternatives_korean:
  - 절하지도 엎드리지도 않았습니다
  - 몸을 굽히지도 경배하지도 않았습니다
  - 절하지도 경배하지도 않았습니다
  lexicon: HALOT
  rationale: 미완료형의 지속적·의지적 거부를 한국어에서 자연스럽게 표현하기 위해 과거 서술 대신 ‘~지도 않았습니다’로 옮겼습니다. 앞부분의 표현과 어휘를 맞춰 반복성을 살렸습니다.
theological_decisions:
- issue: הִשְׁתַּחֲוָה를 종교적 ‘경배’로 볼지, 궁정적 예의인 ‘경의 표함’으로 볼지
  chosen_reading: 궁정적 예속·존경의 의미를 살려 ‘경의를 표하다’로 옮겼습니다.
  alternative_readings:
  - 경배하다
  - 절하다
  - 엎드려 절하다
  rationale: 대상이 하나님이 아니라 하만이므로, 종교적 숭배를 뜻하는 표현은 본문이 요구하는 범위를 넘어설 수 있습니다. 다만 두 동사의 조합이 단순한 인사보다 강한 굴복을 뜻하므로, 그 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 존중/굴복의 정도는 보존하되, 대상이 인간일 때 ‘예배’ 의미를 부과하지 않습니다.'
