review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הָרָצִים는 왕실의 전달 업무를 맡은 사람들을 가리키므로 현대어에서 ‘역졸들’보다 ‘전령들’이 정확하고 자연스럽습니다. 또한 דְחוּפִים의 ‘재촉받음’을 명시하는 편이 원문의 긴급성을 더 잘 보존합니다. שׁוּשַׁן הַבִּירָה와 마지막의 הָעִיר שׁוּשָׁן은 각각 성채와 도시를 구별하므로 번역에서도 구별했습니다.
  naturalness: ‘역졸들’은 현대 표준어 성경 문체에서는 낯설고 그 직무도 불명확할 수 있습니다. ‘전령들’과 ‘수산 도성’은 현대 독자에게 더 명료하면서도 격식을 유지합니다. 각주 표지도 해당 어구 직후에 배치했습니다.
  terminology: ‘수산’은 통용되는 성경 지명 표기를 유지했습니다. דָּת은 본문에서 ‘조서’로, 대안으로 ‘법령’으로 제시하여 페르시아 행정 용어의 범위를 보존했습니다. ‘성채’와 ‘도성’을 구별하여 בִּירָה와 עִיר의 대조를 반영했습니다.
  issues:
  - severity: medium
    issue: ‘역졸들’은 הָרָצִים의 현대 한국어 대응으로 부정확하거나 지나치게 고풍스럽습니다.
    rationale: 원어는 왕의 명령을 전달하는 궁정·행정상의 전령들을 뜻합니다. ‘전령들’이 그 기능을 자연스럽고 정확하게 전달합니다.
  - severity: medium
    issue: ‘수산 성’은 마지막 הָעִיר שׁוּשָׁן의 ‘도시’ 의미를 충분히 드러내지 못합니다.
    rationale: 앞의 ‘수산 성채’(שׁוּשַׁן הַבִּירָה)와 마지막 ‘수산 도시’(הָעִיר שׁוּשָׁן)는 원문에서 구별됩니다. ‘수산 도성’으로 옮겨 그 구별을 보존하는 것이 안전합니다.
  - severity: low
    issue: 각주 a와 b가 모두 절 끝에 붙어 있어 각각의 대상 어구가 불분명합니다.
    rationale: a는 ‘조서’/‘법령’에, b는 도시의 혼란 상태에 관한 각주이므로 해당 문장 성분 직후에 붙여야 합니다.
  - severity: low
