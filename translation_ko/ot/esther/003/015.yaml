  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
  footnotes:
  - marker: a
    text: Or 'the law was given in Susa the citadel.' The Hebrew verb is literally 'was given,' and דָּת can be rendered 'law' or 'decree' in this Persian administrative setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'the city of Susa was bewildered' or 'was in turmoil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 명령에 따라 재촉을 받은 전령들이 나갔고, 조서가 수산 성채에서 내려졌습니다.[a] 왕과 하만은 앉아 술을 마셨으나, 수산 도성은 혼란에 빠졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수산 성채에서 법령이 내려졌습니다.’ 히브리어 동사는 문자적으로 ‘주어졌다’이며, 페르시아 행정 문맥에서 דָּת은 ‘법령’ 또는 ‘조서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수산 도성은 당혹해졌습니다’ 또는 ‘혼란스러워졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the couriers
  chosen_korean: 역졸들
  alternatives_korean:
  - 전령들
  - 사자들
  - 달려가는 자들
  lexicon: HALOT
  rationale: 페르시아 행정 문맥에서 왕명을 전달하는 공적 전달자라는 기능을 살려, 현대 한국어에서는 ‘역졸들’이 가장 자연스럽고 직역의 낯섦도 줄입니다.
- source_word: בִּדְבַר הַמֶּלֶךְ
  english_pob_choice: by the king’s command
  chosen_korean: 왕의 명령으로
  alternatives_korean:
  - 왕의 말에 따라
  - 왕의 말에 의해
  - 왕의 말씀으로
  lexicon: HALOT
  rationale: דבר는 단순한 말보다 권위 있는 왕명이라는 뉘앙스가 강하므로, ‘명령’으로 옮겨 통치적 강도를 드러냈습니다.
- source_word: הַדָּת
  english_pob_choice: the decree
  chosen_korean: 조서
  alternatives_korean:
  - 법령
  - 법
  - 칙령
  lexicon: HALOT
  rationale: 에스더서의 페르시아 행정 용례에서는 공식 공포문을 가리키므로, 한국어 성경에서 익숙한 ‘조서’를 택하되 ‘법’의 일반적 의미로 좁히지 않았습니다.
- source_word: נִתְּנָה
  english_pob_choice: was issued
  chosen_korean: 내려졌습니다
  alternatives_korean:
  - 주어졌습니다
  - 공포되었습니다
  - 반포되었습니다
  lexicon: HALOT
  rationale: 직역상 ‘주어졌다’이지만 행정 문맥에서는 공포·시행의 결과를 뜻하므로, 한국어에서 왕의 조서가 공식적으로 내려지는 상황을 반영했습니다.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  english_pob_choice: sat down to drink
  chosen_korean: 앉아서 술을 마셨습니다
  alternatives_korean:
  - 앉아 마셨습니다
  - 술 마시기를 시작했습니다
  - 앉아 마시기 시작했습니다
  lexicon: HALOT
  rationale: 행동의 냉혹한 대비를 유지하려면 단순한 ‘먹고 마셨다’보다 ‘술을 마셨다’가 원문의 초점을 더 분명히 보여 줍니다.
- source_word: נָבוֹכָה
  english_pob_choice: was thrown into confusion
  chosen_korean: 혼란에 빠졌습니다
  alternatives_korean:
  - 당황했습니다
  - 소란스러워졌습니다
  - 혼미해졌습니다
  lexicon: HALOT
  rationale: 시민 전체의 동요를 나타내는 결과 상태를 자연스럽게 표현하면서도, 과도한 해석 없이 원문의 집단적 혼란을 살렸습니다.
theological_decisions:
- issue: 왕의 연회와 도시의 혼란 사이의 서술적 대비
  chosen_reading: 왕과 하만의 태연한 음주와 수산 성의 혼란을 대조적으로 유지했습니다.
  alternative_readings:
  - 왕과 하만이 술을 마시자 도시가 놀랐다고 풀어 쓸 수 있습니다.
  - 도시의 공포감을 더 직접적으로 표현할 수 있습니다.
  rationale: 본문의 긴장감은 사건의 잔혹한 공적 집행과 사적인 무감각의 병치에 있으므로, 해설을 덧붙이지 않고 대비 구조 자체를 보존했습니다.
  doctrine_reference: 서사적 강조의 보존
