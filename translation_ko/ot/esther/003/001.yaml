  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
  footnotes:
  - marker: a
    text: Or 'After these events.'
    reason: lexical_alternative
  - marker: b
    text: '''The Agagite'' preserves the Hebrew designation and may indicate a lineage or association connected with Agag.'
    reason: cultural_note
  - marker: c
    text: Or 'set his seat above all the officials who were with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 일들 후에 아하수에로 왕은 하만—함므다다의 아들, 아각 사람—을 높여 주고, 자기와 함께 있던 모든 관리들보다 그의 왕좌를 높이 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사건들 후에’.
    reason: lexical_alternative
  - marker: b
    text: ‘아각 사람’은 히브리어 명칭을 보존하며, 아각과 연결된 계통 또는 연상을 나타낼 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘자기 자리를 모든 관리들보다 높이 두었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: After these things
  chosen_korean: 이러한 일들 후에
  alternatives_korean:
  - 이 사건들 후에
  - 이 일들 뒤에
  lexicon: HALOT
  rationale: 본문의 시간 전환 공식이므로, 직역의 어색함을 피하면서도 ‘these things’의 포괄적 뉘앙스를 살렸습니다.
- source_word: גִּדַּל
  english_pob_choice: promoted
  chosen_korean: 높여 주고
  alternatives_korean:
  - 승진시켜
  - 크게 하고
  - 승격시키고
  lexicon: HALOT
  rationale: 페르시아 궁정 맥락에서 지위 상승을 뜻하므로, 단순한 ‘크게 하다’보다 지위의 상승을 드러내는 표현을 택했습니다.
- source_word: הָאֲגָגִי
  english_pob_choice: the Agagite
  chosen_korean: 아각 사람
  alternatives_korean:
  - 아각 사람인
  - 아각 사람 계통의
  lexicon: HALOT
  rationale: 히브리어의 민족/계통 표지를 본문에 그대로 드러내어, 전승적·족보적 표지를 약화시키지 않도록 했습니다.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  english_pob_choice: set his throne
  chosen_korean: 그의 왕좌를 높이 두었습니다
  alternatives_korean:
  - 그의 자리를 높이 두었습니다
  - 그의 왕좌를 세웠습니다
  lexicon: HALOT
  rationale: כִּסֵּא는 여기서 단순한 의자보다 권위의 자리를 가리키므로, ‘왕좌’로 옮기되 ‘above all’의 상대적 우위를 살렸습니다.
theological_decisions:
- issue: 아각 사람(Haman의 정체 표지)을 본문에서 어떻게 처리할지
  chosen_reading: 본문에 ‘아각 사람’으로 유지했습니다.
  alternative_readings:
  - 주석으로만 처리하기
  - ‘아각계’처럼 완곡하게 옮기기
  rationale: 본문이 의도적으로 하만의 정체를 덧붙이므로, 이를 숨기지 않고 독자가 즉시 보도록 유지하는 것이 source-direct합니다.
  doctrine_reference: 서술의 투명성 원칙
