  - 이 일들 뒤에
  lexicon: HALOT
  rationale: 본문의 시간 전환 공식이므로, 직역의 어색함을 피하면서도 ‘these things’의 포괄적 뉘앙스를 살렸습니다.
- source_word: גִּדַּל
  english_pob_choice: promoted
  chosen_korean: 높여 주고
  alternatives_korean:
