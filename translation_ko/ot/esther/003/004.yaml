revisions:
- from: 그들에게 날마다 말하였으나 모르드개는 듣지 않았습니다[a]. 그들은 모르드개의 말이 설지 보려고 하만에게 알렸으니, 그가 자신이 유다 사람이라고 그들에게 알렸기 때문입니다.
  to: 그들이 날마다 그에게 말했지만, 그는 그들의 말을 듣지 않았습니다[a]. 그래서 그들은 모르드개의 말이 성립할지 보려고 하만에게 알렸습니다. 모르드개가 자신이 유다인이라고 그들에게 알렸기 때문입니다.
  rationale: 반복적으로 말한 이들과 듣기를 거부한 모르드개의 관계를 원문대로 바로잡았습니다. 하만에게 알린 목적(모르드개의 말이 성립할지 확인하려 함)과 그 이유(그가 자신의 유다인 정체성을 밝혔음)를 분명한 한국어 문장으로 유지했습니다. 원래 각주가 다룬 ‘말이 설지’의 의미는 본문에서 ‘성립할지’로 자연스럽게 반영되므로, 각주는 본문에 실제로 나타나는 ‘듣지 않았다’의 관용적 대안을 설명하도록 정리했습니다.
