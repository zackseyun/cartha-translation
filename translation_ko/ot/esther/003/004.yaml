id: EST.3.4
reference: Esther 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י ב/אמר/ם אֵלָי/ו֙ י֣וֹם וָ/י֔וֹם וְ/לֹ֥א שָׁמַ֖ע אֲלֵי/הֶ֑ם וַ/יַּגִּ֣ידוּ לְ/הָמָ֗ן לִ/רְאוֹת֙ הֲ/יַֽעַמְדוּ֙ דִּבְרֵ֣י מָרְדֳּכַ֔י כִּֽי הִגִּ֥יד לָ/הֶ֖ם אֲשֶׁר ה֥וּא יְהוּדִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
  footnotes:
  - marker: a
    text: Or 'whether Mordecai’s explanation would hold up.' The Hebrew literally says 'whether Mordecai’s words would stand,' which may refer either to his stated reason for refusing to bow or to whether his stance would endure under pressure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 날마다 말하였으나 모르드개는 듣지 않았습니다[a]. 그들은 모르드개의 말이 설지 보려고 하만에게 알렸으니, 그가 자신이 유다 사람이라고 그들에게 알렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모르드개의 설명이 버틸지’입니다. 히브리어는 문자적으로 ‘모르드개의 말이 설지’라고 하며, 그가 거절한 이유가 견고한지 또는 그 태도가 압력을 견딜지의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו יוֹם וָיוֹם
  english_pob_choice: And when they spoke to him day after day
  chosen_korean: 그들에게 날마다 말하였으나
  alternatives_korean:
  - 그리고 그들이 그에게 날마다 말했을 때
  - 그들이 그에게 날마다 말하였으나
  lexicon: HALOT
  rationale: 반복되는 서술적 전환을 한국어 자연문장으로 풀어, ‘날마다’의 지속성과 대조를 살리면서도 문장 흐름을 매끄럽게 했습니다.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  english_pob_choice: and he would not listen to them
  chosen_korean: 모르드개는 듣지 않았습니다
  alternatives_korean:
  - 모르드개는 그들에게 귀를 기울이지 않았습니다
  - 모르드개는 그들의 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל의 ‘듣다/따르다’ 의미를 따라, 완강한 거부를 간단하고 직접적으로 표현했습니다.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  english_pob_choice: whether Mordecai’s words would stand
  chosen_korean: 모르드개의 말이 설지
  alternatives_korean:
  - 모르드개의 말이 버틸지
  - 모르드개의 설명이 통할지
  lexicon: HALOT
  rationale: ‘서다’의 비유를 살려 ‘설지’로 옮겨, 말/주장이 끝까지 유효할지를 묻는 원문의 긴장을 보존했습니다.
- source_word: כִּי הִגִּיד לָהֶם אֲשֶׁר הוּא יְהוּדִי
  english_pob_choice: for he had told them that he was a Jew
  chosen_korean: 그가 자신이 유다 사람이라고 그들에게 알렸기 때문입니다
  alternatives_korean:
  - 그가 자신이 유다 사람이라고 그들에게 말했기 때문입니다
  - 그가 자신이 유대인이라고 그들에게 알렸기 때문입니다
  lexicon: HALOT
  rationale: יְהוּדִי를 한국어 성경의 전통적 ‘유대인’ 대신 문자적으로 ‘유다 사람’으로 옮겨, 민족·출신 표지를 더 직접적으로 드러냈습니다.
theological_decisions:
- issue: 이 문맥에서 יְהוּדִי의 정체성 표지 번역
  chosen_reading: ‘유다 사람’으로 옮겨, 단순한 종교명칭이 아니라 민족적·출신적 소속을 드러내게 했습니다.
  alternative_readings:
  - 유대인
  - 유다 사람
  rationale: 에스더서의 궁정 서사에서는 숨겨진 유대 정체성이 긴장의 핵심이므로, 원문의 정체성 표지를 평이하게 드러내는 번역이 적절합니다.
  doctrine_reference: 에스더 3장 문맥상 민족 정체성 표지
