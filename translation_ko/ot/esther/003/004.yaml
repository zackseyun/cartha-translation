  source_fidelity: 첫 절의 행위 주체가 뒤바뀌었습니다. 히브리어 בְּאָמְרָם אֵלָיו는 궁중 신하들이 모르드개에게 날마다 말한 것을 뜻하는데, 초안의 ‘그들에게 날마다 말하였으나’는 모르드개가 그들에게 말한 것으로 읽힙니다. 나머지 절의 인과관계와 ‘말이 설지’의 넓은 의미는 대체로 포착했습니다.
  naturalness: ‘날마다 그에게 말했지만, 그는 그들의 말을 듣지 않았습니다’가 주어와 수신자를 분명히 하면서 현대 표준어 문장으로 자연스럽습니다. ‘모르드개의 말이 성립할지’는 원문의 ‘말이 서다’ 비유가 가리키는 주장·설명의 유효성을 자연스럽게 전달하며, 특정 해석으로 한정하지 않습니다.
  terminology: מָרְדֳּכַי와 הָמָן은 ‘모르드개’, ‘하만’으로 적절합니다. יְהוּדִי는 현대 한국어 성경 용례와 민족·정체성 표지의 의미를 고려해 ‘유다인’으로 옮기는 것이 ‘유다 사람’보다 정확하고 자연스럽습니다.
  issues:
