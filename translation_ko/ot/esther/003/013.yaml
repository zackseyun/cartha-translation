source:
  edition: WLC
  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
  footnotes:
  - marker: a
    text: Or 'by couriers'; literally, 'by the hand of the runners.'
    reason: lexical_alternative
  - marker: b
    text: The three verbs 'destroy,' 'kill,' and 'annihilate' are a deliberate intensification in the Hebrew decree.
    reason: lexical_alternative
  - marker: c
    text: Or 'from young to old.' The Hebrew is literally 'from young man to old man,' used distributively for the whole population.
    reason: lexical_alternative
  - marker: d
    text: Or 'to seize their goods as plunder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 달리던 자들의 손을 통해 왕의 모든 도에 편지가 보내졌습니다[a]. 곧 모든 유다 사람을 — 어린아이에서 노인까지, 어린이와 여인까지 — 하루에, 곧 열두째 달인 아달월 열셋째 날에 멸하여 죽이고 없애며, 그들의 재산을 약탈하라는 것이었습니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달리던 자들’은 왕의 공문을 전달하던 사환들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘멸하다, 죽이다, 없애다’라는 세 동사를 의도적으로 겹쳐 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘어린 남자에서 늙은 남자까지’이지만, 나이 범위를 가리키는 분배적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그들의 노획물/전리품’을 뜻하며, 허가된 약탈을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד הָרָצִים
  english_pob_choice: by the hand of the couriers
  chosen_korean: 왕의 달리던 자들의 손을 통해
  alternatives_korean:
  - 전령들을 통해
  - 달리던 자들의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손을 통해’를 살리되, הָרָצִים의 문자적 의미인 ‘달리는 자들’을 반영했습니다. ‘전령’도 가능하지만 원문의 이미지가 더 직접적으로 드러납니다.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  english_pob_choice: to destroy, to kill, and to annihilate
  chosen_korean: 멸하여 죽이고 없애며
  alternatives_korean:
  - 멸망시키고 죽이고 진멸하며
  - 파괴하고 살해하고 전멸시키며
  lexicon: HALOT
  rationale: 세 동사가 의도적으로 격화되는 삼중 표현이므로, 한국어도 같은 누적 효과가 나도록 ‘멸하다/죽이다/없애다’를 이어 붙였습니다.
- source_word: מִנַּעַר וְעַד זָקֵן
  english_pob_choice: from young man to old man
  chosen_korean: 어린아이에서 노인까지
  alternatives_korean:
  - 젊은 남자에서 늙은 남자까지
  - 젊은이에서 노인까지
  lexicon: HALOT
  rationale: 히브리어는 나이 범위를 포괄하는 분배적 표현이므로, 성별을 불필요하게 좁히지 않는 한국어로 옮겼습니다. 영어 POB의 수정된 이해도 이 방향을 지지합니다.
- source_word: וּשְׁלָלָם לָבוֹז
  english_pob_choice: and to plunder their spoil
  chosen_korean: 그들의 재산을 약탈하라는 것이었습니다
  alternatives_korean:
  - 그들의 노획물을 노략하라는 것이었습니다
  - 그들의 소유를 노략하라는 것이었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘약탈할 전리품’을 한국어 자연문으로 풀어, 허가된 약탈이라는 뜻이 분명히 드러나게 했습니다. ‘재산’은 본문 상황에서 약탈 대상의 실질적 소유물을 가리키는 무난한 대응입니다.
theological_decisions:
- issue: 왕령의 폭력적 누적 표현을 한국어로 어떻게 보존할지
  chosen_reading: ‘멸하여 죽이고 없애며’로 삼중 동사를 유지해, 단순한 처형 명령이 아니라 전면적 말살 의도를 드러냈습니다.
  alternative_readings:
  - ‘죽여 없애고 멸하라’처럼 평준화
  - ‘진멸하라’로 단일화
  rationale: 원문은 세 동사를 나란히 두어 폭력의 강도를 높이므로, 한국어도 그 긴장을 약화시키지 않는 것이 번역상 중요합니다.
  doctrine_reference: 본문의 서술적·역사적 성격; 어휘 강도 보존 원칙
