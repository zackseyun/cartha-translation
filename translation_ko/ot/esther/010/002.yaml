lexical_decisions:
- source_word: מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ
  english_pob_choice: the acts of his power and might
  chosen_korean: 그의 권세와 능력의 모든 행위
  alternatives_korean:
  - 그의 권세와 힘의 행위
  - 그의 권력과 용맹의 모든 일
  lexicon: HALOT
  rationale: 행위/권세/능력의 병렬을 살리되, 왕의 정치적 위세를 드러내는 문맥상 '권세'와 '능력'이 가장 자연스럽습니다.
- source_word: וּפָרָשַׁת גְּדֻלַּת מָרְדֳּכַי
  english_pob_choice: the full account of the greatness of Mordecai
  chosen_korean: 모르드개의 위대함에 대한 상세한 기록
  alternatives_korean:
  - 모르드개의 عظ대함의 상세한 설명
  - 모르드개의 큰 됨됨이에 대한 기록
  lexicon: HALOT
  rationale: פָרָשַׁת는 단순한 언급이 아니라 풀어 쓴 상세한 진술을 가리키므로, '상세한 기록'으로 옮겨 공문서체의 느낌을 살렸습니다.
- source_word: אֲשֶׁר גִּדְּל֖וֹ הַמֶּלֶךְ
  english_pob_choice: to which the king raised him
  chosen_korean: 곧 왕이 그를 높여 준 일은
  alternatives_korean:
  - 왕이 그를 크게 만든 일은
  - 왕이 그를 승진시킨 일은
  lexicon: HALOT
  rationale: גִדֵּל의 ‘크게 하다/높이다’는 의미를 반영해 지위 상승을 드러내되, 현대 한국어에서 자연스러운 '높여 주다'를 택했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 연대기 책
  alternatives_korean:
  - 기록서
  - 왕들의 연대기
  lexicon: HALOT
  rationale: 관용적 표현인 ‘연대기/annals’의 성격을 살리면서, ספר와 구문 전체의 공식 기록 체계를 간결하게 표현했습니다.
theological_decisions:
- issue: 수사 의문문 처리
  chosen_reading: 문장 끝을 반문형으로 살려 ‘기록되어 있지 않습니까?’로 옮겼습니다.
  alternative_readings:
  - ‘기록되어 있습니다’로 평서 처리
  - ‘기록되지 않았습니까’로 약화
  rationale: הֲלוֹא는 사실상 독자를 설득하는 수사 의문이므로, 반문형을 유지해야 본문의 확언과 문서적 권위를 보존할 수 있습니다.
  doctrine_reference: 성경의 역사 진술은 수사 형식 속에서도 사실 확증을 수행합니다.
