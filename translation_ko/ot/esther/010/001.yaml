  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
  footnotes:
  - marker: a
    text: Or 'coastlands' for 'islands of the sea.' The Hebrew term can denote islands or maritime coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'tax' or 'levy.' The Hebrew word can also refer in some contexts to forced labor or corvée service.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하수에로 왕은 땅과 바다의 섬들에 공물을 부과했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해안지방들’. ‘바다의 섬들’에 해당하는 히브리어는 섬이나 해안지방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세금’이나 ‘부역’. 이 히브리어는 어떤 문맥에서는 강제노동이나 부역을 뜻하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: imposed
  chosen_korean: 부과했습니다
  alternatives_korean:
  - 정했습니다
  - 매겼습니다
  - 두었습니다
  lexicon: HALOT
  rationale: מַס을 다스리는 행정적 행위이므로 단순히 ‘두다/놓다’보다 세금·공물의 징수를 가리키는 ‘부과하다’가 원문의 뜻을 더 정확히 드러냅니다.
- source_word: אחשרש
  english_pob_choice: Ahasuerus
  chosen_korean: 아하수에로
  alternatives_korean:
  - 아하수에루스
  - 아하수에르
  lexicon: standard transliteration
  rationale: 에스더서의 고유명사 관습에 따라 통용되는 한국어 음역을 사용했습니다.
- source_word: מַס
  english_pob_choice: tribute
  chosen_korean: 공물
  alternatives_korean:
  - 조세
  - 세금
  - 부역
  lexicon: HALOT
  rationale: 문맥상 강제노동보다 제국이 속주에 부과하는 재정적·정치적 부담이 강조되므로, ‘공물’이 ‘tribute’의 위압적 제국성을 잘 살립니다.
- source_word: וְאִיֵּי הַיָּם
  english_pob_choice: and the islands of the sea
  chosen_korean: 바다의 섬들
  alternatives_korean:
  - 바다의 해안들
  - 해변의 섬들
  - 바다의 섬과 해안지방들
  lexicon: HALOT
  rationale: אִיִּים은 섬 또는 해안지방을 가리킬 수 있으나, 영어 POB가 유지한 직설적 지리 표현을 따라 ‘바다의 섬들’로 옮겨 원문의 범위를 보존했습니다.
