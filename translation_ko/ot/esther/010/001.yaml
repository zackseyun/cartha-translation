  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
  footnotes:
  - marker: a
    text: Or 'coastlands' for 'islands of the sea.' The Hebrew term can denote islands or maritime coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'tax' or 'levy.' The Hebrew word can also refer in some contexts to forced labor or corvée service.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하수에로 왕은 땅과 바다의 섬들에 조공을 부과했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해안 지방들’. ‘바다의 섬들’에 해당하는 히브리어는 섬이나 해안 지방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세금’이나 ‘부역’. 이 히브리어 단어는 어떤 문맥에서는 강제 노동이나 부역을 뜻하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: imposed
  chosen_korean: 부과했습니다
  alternatives_korean:
  - 정했습니다
