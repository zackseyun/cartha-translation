  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
  footnotes:
  - marker: a
    text: Or 'by most of his brothers'; the Hebrew phrase can denote either a multitude or a majority of his fellow Jews.
    reason: lexical_alternative
  - marker: b
    text: '''His brothers'' here likely means his fellow Jews or kinsmen, not only literal male siblings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to all his descendants.' The Hebrew 'offspring/seed' is a collective term.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 모르드개 유다인이 아하수에로 왕 다음가는 자요, 유다 사람들 가운데서 크고, 그의 형제들 무리에게 기쁨을 얻었으며, 자기 백성의 선을 구하고 그의 모든 자손에게 평화를 말하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 여기서 문자적 남자 형제들만이 아니라 유다 동족 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무리’는 히브리어의 רב(많음/대다수)를 반영하며, ‘대다수’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자손’은 히브리어의 집합적 ‘씨/후손’에 해당하며, 개인 후손 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 이는 … 이기 때문입니다
  lexicon: HALOT
  rationale: 앞 절의 요약을 설명하는 원인/이유 표지이므로, 문맥상 자연스러운 한국어 연결인 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  english_pob_choice: second to King Ahasuerus
  chosen_korean: 아하수에로 왕 다음가는 자
  alternatives_korean:
  - 아하수에로 왕에 이어 둘째인 자
  - 아하수에로 왕 다음의 자
  lexicon: HALOT
  rationale: ‘둘째 지위’라는 순위 관계를 드러내되, 현대 한국어에서 직관적인 ‘다음가는 자’로 옮겨 왕에 대한 종속적 순서를 분명히 했습니다.
- source_word: וְרָצוּי לְרֹב אֶחָיו
  english_pob_choice: favored by the multitude of his brothers
  chosen_korean: 그의 형제들 무리에게 기쁨을 얻었으며
  alternatives_korean:
  - 그의 형제들 대다수에게 호의를 받았으며
  - 많은 형제들에게 받아들여졌으며
  lexicon: HALOT
  rationale: רָצוּי는 단순한 ‘인정’보다 ‘호의/기쁨을 얻음’의 뉘앙스가 있어, 공동체의 승인과 호감을 드러내는 표현으로 옮겼습니다. לְרֹב는 ‘대다수/무리’ 가능성이 있으나, 본문이 수량보다 공동체적 수용을 강조하므로 ‘무리에게’로 처리했습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 동족
  - 그의 친족
  lexicon: HALOT
  rationale: 문자적으로는 ‘형제들’이지만, 에스더서 문맥에서 혈연 형제만이 아니라 유다 공동체 전체를 가리키므로 직역을 유지하되 뜻은 공동체적으로 읽히도록 했습니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 모든 자손
  alternatives_korean:
  - 그의 씨
  - 그의 후손
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서도 현대 독자가 이해하기 쉬운 표현으로 ‘자손’을 선택했습니다.
theological_decisions:
- issue: 유다 민족 정체성과 공동체적 표현
  chosen_reading: ‘유다인/유다 사람들/형제들’의 세 표현을 각각 유지해 모르드개의 민족적 소속, 공동체적 명성, 친족적 연대를 함께 드러냈습니다.
  alternative_readings:
  - 모두 ‘유대인’ 또는 모두 ‘동족’으로 평준화
  rationale: 본문은 단순한 개인 소개가 아니라 페르시아 궁정 안에서의 유다 공동체 대표성을 강조하므로, 서로 다른 관계어를 구분해 번역하는 것이 의미를 더 정확히 보존합니다.
  doctrine_reference: 성경의 언약 백성 정체성 및 공동체성
