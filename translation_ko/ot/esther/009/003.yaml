  text: וְ/כָל שָׂרֵ֨י הַ/מְּדִינ֜וֹת וְ/הָ/אֲחַשְׁדַּרְפְּנִ֣ים וְ/הַ/פַּח֗וֹת וְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁ֣ר לַ/מֶּ֔לֶךְ מְנַשְּׂאִ֖ים אֶת הַ/יְּהוּדִ֑ים כִּֽי נָפַ֥ל פַּֽחַד מָרְדֳּכַ֖י עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
  footnotes:
  - marker: a
    text: Or 'were helping the Jews'; the Hebrew verb can also carry the sense 'were lifting up' or 'favoring' them.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 지방의 모든 관리들과 사트라프들과 총독들과 왕의 일을 맡아 하는 이들이 유다 사람들을 지원하고 있었습니다. 이는 모르드개에 대한 두려움이 그들 위에 내렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지원하고 있었습니다’는 히브리어 동사의 기본적 ‘들어 올리다/받쳐 주다’ 감각을 문맥에 따라 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  english_pob_choice: officials of the provinces
  chosen_korean: 각 지방의 모든 관리들
  alternatives_korean:
  - 각 지방의 지도자들
  - 각 지방의 수령들
  lexicon: HALOT
  rationale: שָׂרִים은 행정적·통치적 ‘관리들’의 뜻이 자연스럽고, 뒤따르는 페르시아 관직 목록과도 잘 맞습니다.
- source_word: אֲחַשְׁדַּרְפְּנִים
  english_pob_choice: satraps
  chosen_korean: 사트라프들
  alternatives_korean:
  - 총독들
  - 행정장관들
  lexicon: HALOT
  rationale: 페르시아 관직명은 일반화하기보다 음역해 역사적 배경을 살리는 것이 적절합니다.
- source_word: וְהַפַּחוֹת
  english_pob_choice: governors
  chosen_korean: 총독들
  alternatives_korean:
  - 지방장관들
  - 부총독들
  lexicon: HALOT
  rationale: פַּחוֹת는 사트라프와 구별되는 지역 통치 관직이므로, 한국어에서는 통용되는 관직명 ‘총독들’로 옮겼습니다.
- source_word: מְנַשְּׂאִים אֶת הַיְּהוּדִים
  english_pob_choice: were supporting the Jews
  chosen_korean: 유다 사람들을 지원하고 있었습니다
  alternatives_korean:
  - 유다 사람들을 도와주고 있었습니다
  - 유다 사람들을 들어 올리고 있었습니다
  lexicon: HALOT
  rationale: נָשָׂא의 사역형은 ‘들어 올리다’에서 확장되어 ‘도와주다/지원하다’의 뜻을 가질 수 있으므로, 문맥상 가장 자연스러운 ‘지원하다’를 택했습니다.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  english_pob_choice: the fear of Mordecai had fallen on them
  chosen_korean: 모르드개에 대한 두려움이 그들 위에 내렸기 때문입니다
  alternatives_korean:
  - 모르드개에 대한 두려움이 그들에게 임했기 때문입니다
  - 모르드개를 두려워하는 마음이 그들 위에 내렸기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘내리다’로 살리면서, ‘두려움이…위에’라는 강한 이미지도 보존했습니다.
