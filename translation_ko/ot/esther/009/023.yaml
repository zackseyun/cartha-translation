reference: Esther 9:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קִבֵּל֙ הַ/יְּהוּדִ֔ים אֵ֥ת אֲשֶׁר הֵחֵ֖לּוּ לַ/עֲשׂ֑וֹת וְ/אֵ֛ת אֲשֶׁר כָּתַ֥ב מָרְדֳּכַ֖י אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
  footnotes:
  - marker: a
    text: Or, 'undertook what they had begun to do.' The Hebrew verb can carry the sense of accepting or taking something upon oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 유다 사람들은 그들이 이미 시작한 일을 받아들였고, 모르드개가 그들에게 쓴 것을 받아들였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 이미 시작한 일을 떠맡았습니다.” קבל은 어떤 일을 수락하거나 자기 책임으로 받아들이는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  english_pob_choice: accepted
  chosen_korean: 받아들였고
  alternatives_korean:
  - 수용했고
  - 맡아 했고
  - undertook에 해당하는 뉘앙스로 “떠맡았고”
  lexicon: HALOT
  rationale: קבל의 핵심은 어떤 일을 자기 몫으로 받아들이는 뜻이므로, 문맥상 제정된 관행을 공식적으로 받아들였다는 의미를 살려 ‘받아들였고’로 옮겼습니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들은
  alternatives_korean:
  - 유대인들은
  - 유다인들은
  lexicon: HALOT
  rationale: 에스더서는 페르시아 제국 내의 민족 집단을 가리키는 말로 자주 쓰이므로, 교회적 용어보다 역사적·민족적 뉘앙스가 드러나는 ‘유다 사람들’을 택했습니다.
- source_word: אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  english_pob_choice: what they had begun to do
  chosen_korean: 그들이 이미 시작한 일
  alternatives_korean:
  - 그들이 하기를 시작한 것
  - 그들이 해 오기 시작한 일
  - 그들이 시작한 실행
  lexicon: HALOT
  rationale: החל의 ‘시작하다’와 ‘עשה’의 행동 대상을 자연스럽게 살려, 이미 착수한 관행/행위를 가리키는 말로 옮겼습니다.
- source_word: כָּתַב
  english_pob_choice: had written
  chosen_korean: 썼
  alternatives_korean:
  - 기록했
  - 작성했
  lexicon: HALOT
  rationale: 모르드개의 서신 행위를 직접적이고 자연스럽게 표현하되, 한국어에서는 문맥상 선후가 분명하므로 과거완료를 따로 드러내지 않고도 의미가 유지됩니다.
