    rationale: קִבֵּל은 ‘그들이 시작하여 하던 것’과 ‘모르드개가 쓴 것’ 모두에 걸리는 단일 동사입니다. 한국어에서도 두 목적어를 함께 묶는 편이 충실하고 자연스럽습니다.
