  rationale: 단일 동사 ‘받아들였습니다’가 두 병렬 목적어를 지배하도록 고쳐 히브리어 구문을 반영했습니다. 불필요한 인과 접속 표현과 ‘이미’의 명시를 제거했으며, 집단 명칭을 ‘유다인들’로 다듬었습니다. 각주는 קבל의 ‘떠맡다’라는 어휘적 대안을 보존합니다.
