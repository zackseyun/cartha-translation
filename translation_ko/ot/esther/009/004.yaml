source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
  footnotes:
  - marker: a
    text: Or 'his fame was spreading through all the provinces.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the man Mordecai was going and growing great,' a Hebrew idiom for continual increase in prominence.
    reason: lexical_alternative
translation:
  language: ko
  text: 모르드개가 왕의 궁에서 크게 존귀해졌고[a] 그의 소식이 온 지방에 퍼져 갔으니[b], 이는 그 사람 모르드개가 점점 더 크게 되어 갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 명성이 온 지방에 퍼져 갔다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘그 사람 모르드개가 가고 또 커져 갔다’라는 관용적 표현으로, 지속적인 세력·명성의 증대를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 곧
  lexicon: HALOT
  rationale: 앞절의 이유를 설명하는 접속을 한국어에서 자연스럽게 받으면서도, 본문의 논리적 연결을 분명히 드러내기 위해 ‘이는’으로 옮겼습니다.
- source_word: גָדוֹל
  english_pob_choice: great
  chosen_korean: 크게 존귀해졌고
  alternatives_korean:
  - 위대했고
  - 크고
  - 중요했고
  lexicon: HALOT
  rationale: 단순한 크기보다 지위와 명성이 함께 높아진 상태를 가리키므로, 본문 전체의 문맥에 맞게 ‘존귀해졌고’로 구체화했습니다.
- source_word: שָׁמְעֹו הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  english_pob_choice: the report about him was spreading through all the provinces
  chosen_korean: 그의 소식이 온 지방에 퍼져 갔으니
  alternatives_korean:
  - 그의 평판이 모든 지방으로 퍼져 갔으니
  - 그에 대한 소문이 모든 지방에 퍼져 갔으니
  - 그에 대한 소식이 모든 지방에 퍼져 갔으니
  lexicon: HALOT
  rationale: שָׁמְעוֹ는 단순한 ‘평판’보다 넓게 ‘소식/소문’까지 포함할 수 있어, 문맥상 확산의 이미지를 살려 ‘소식이…퍼져 갔으니’로 옮겼습니다.
- source_word: הוֹלֵךְ וְגָדוֹל
  english_pob_choice: was becoming greater and greater
  chosen_korean: 점점 더 크게 되어 갔기 때문입니다
  alternatives_korean:
  - 갈수록 더 커져 갔기 때문입니다
  - 계속 더 존귀해졌기 때문입니다
  - 점점 더 위대해졌기 때문입니다
  lexicon: HALOT
  rationale: הלך + גדול의 점증적 관용구를 한국어의 진행·증가 표현으로 살려, 반복적 상승을 자연스럽게 나타내도록 했습니다.
theological_decisions:
- issue: 마르둑대와 왕궁 내 지위의 강조를 어떻게 표현할지
  chosen_reading: 정치적·사회적 탁월함을 드러내되, 과장된 영웅화 없이 ‘크게 존귀해졌다’로 옮겼습니다.
  alternative_readings:
  - 위대해졌다
  - 권세가 커졌다
  - 중요 인물이 되었다
  rationale: 본문은 모르드개의 공적 위상과 영향력의 증대를 말하지만, 신학적 평가를 덧붙이기보다 서술의 사실성을 유지하는 것이 적절합니다.
  doctrine_reference: 서술 본문에서의 역사적/문학적 사실성 유지
