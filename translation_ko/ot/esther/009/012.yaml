    rationale: 현대 한국어에서는 ‘오백 명’이 자연스럽고, אִישׁ의 남성 지시를 반영하려면 ‘남자 오백 명’이 더 가깝습니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 ‘그렇다면’이 드러내는 추론적 연결에 관한 것이므로 인용문 끝이 아니라 해당 표현 뒤에 두는 편이 앵커가 명확합니다.
