source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
  footnotes:
  - marker: a
    text: Or, 'What have they done in the rest of the king’s provinces?' The Hebrew question may be read more simply; 'then' in the main text brings out the king’s inference from the report in Susa.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 왕후 에스더에게 말했습니다. "수산의 도성에서 유대인들이 다섯백 명의 사람과 하만의 열 아들을 죽이고 멸했습니다. 그렇다면 왕의 나머지 여러 지방에서는 무엇을 했겠습니까? 이제 당신의 청이 무엇입니까? 당신에게 허락될 것입니다. 또 다른 요청은 무엇입니까? 이루어질 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렇다면’은 수산의 보고를 근거로 다른 지방의 결과를 추론하는 왕의 뉘앙스를 드러낸 것입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  english_pob_choice: In Susa the citadel
  chosen_korean: 수산의 도성
  alternatives_korean:
  - 수산의 시타델
  - 수산의 요새
  lexicon: HALOT
  rationale: בִּירָה는 단순한 성이 아니라 왕궁이 포함된 요새화된 중심지를 가리키므로, 자연스러운 현대 한국어로는 ‘도성’이 문맥상 가장 잘 맞습니다.
- source_word: הָרְגוּ ... וְאַבֵּד
  english_pob_choice: have killed and destroyed
  chosen_korean: 죽이고 멸했습니다
  alternatives_korean:
  - 죽이고 없앴습니다
  - 죽이고 진멸했습니다
  lexicon: HALOT
  rationale: 두 동사의 누적적 강세를 살리되, ‘멸하다’로 אבד의 파괴성을 반영했습니다. ‘진멸하다’는 한국 교회어로 너무 굳어져 과도한 종교어감을 줄 수 있어 피했습니다.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  english_pob_choice: five hundred men
  chosen_korean: 다섯백 명의 사람
  alternatives_korean:
  - 다섯백 명의 남자
  - 오백 명
  lexicon: HALOT
  rationale: אִישׁ은 수사 뒤에서 개별 인원을 가리키므로, 전투 맥락이지만 성별을 과도하게 좁히지 않는 ‘사람’으로 옮겼습니다.
- source_word: שְּׁאֵלָתֵךְ
  english_pob_choice: your petition
  chosen_korean: 당신의 청
  alternatives_korean:
  - 당신의 간청
  - 당신의 요청
  lexicon: HALOT
  rationale: 왕에게 올리는 공식적 요구를 살리면서도 현대 한국어에서 자연스럽고 품위 있는 관용으로 ‘청’을 택했습니다.
- source_word: בַּקָּשָׁתֵךְ ... עוֹד
  english_pob_choice: your further request
  chosen_korean: 또 다른 요청
  alternatives_korean:
  - 추가 요청
  - 더 요청
  lexicon: HALOT
  rationale: עוֹד의 추가성은 ‘또 다른’으로, בַּקָּשָׁה의 반복은 ‘요청’으로 옮겨 두 항목의 점층을 살렸습니다.
theological_decisions:
- issue: 왕의 말의 수사적 추론을 어떻게 드러낼지
  chosen_reading: “그렇다면 … 무엇을 했겠습니까?”로 옮겨, 수산의 소식을 근거로 다른 지방의 결과를 추론하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - “그들은 나머지 지방에서 무엇을 했습니까?”
  - “그러면 … 무엇을 했는지요?”
  rationale: 히브리어 질문은 단순 정보 요청이라기보다 수산의 사건에서 다른 지방의 결과를 짐작하는 수사적 질문입니다. ‘그렇다면’이 그 추론을 가장 분명하게 드러냅니다.
  doctrine_reference: 서사 맥락의 담화 기능 보존
- issue: 에스더에 대한 호칭의 격식
  chosen_reading: ‘왕후 에스더’로 유지했습니다.
  alternative_readings:
  - ‘에스더 왕후’
  - ‘왕비 에스더’
  rationale: 히브리어 הַמַּלְכָּה는 공식적 궁정 호칭이므로, 현대 한국어의 자연스러운 격식 표현으로 ‘왕후’를 사용했습니다.
  doctrine_reference: 궁정 서사체의 호칭 보존
