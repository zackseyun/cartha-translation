review_pass:
  verdict: revise
  source_fidelity: ‘수산의 도성’은 בִּירָה(요새화된 왕실 중심지/성채)를 수도·도시라는 뜻의 ‘도성’으로 좁혀 옮겨 정확하지 않습니다. 또한 ‘무엇을 했겠습니까?’는 과거 사실에 대한 히브리어 의문문보다 가정적 추측으로 들릴 수 있습니다. ‘사람’은 אִישׁ의 남성 지시를 약화합니다.
  naturalness: ‘수산 성채’, ‘남자 오백 명’, ‘무엇을 했습니까?’ 및 ‘왕후의 청’은 현대 표준 한국어 합쇼체에서 자연스럽고 궁정 장면의 격식을 유지합니다. ‘다섯백’보다 ‘오백’이 일반적입니다.
  terminology: הַמַּלְכָּה는 ‘에스더 왕후’로, בִּירָה는 ‘성채’로 옮깁니다. שְׁאֵלָה와 בַּקָּשָׁה의 근접하지만 구별되는 표현은 각각 ‘청’과 ‘요청’으로 유지하고, עוֹד는 ‘또 다른’으로 반영합니다.
  issues:
  - severity: medium
    issue: ‘수산의 도성’
    rationale: בִּירָה는 이 문맥에서 도시 일반이나 수도를 뜻하는 ‘도성’보다 ‘성채’(fortified royal complex/citadel)에 가깝습니다.
  - severity: medium
    issue: ‘무엇을 했겠습니까?’
    rationale: 히브리어 מֶה עָשׂוּ는 완료형의 질문입니다. 문맥상 추론적·수사적 색채는 있으나, 한국어의 가정적 과거 표현은 원문보다 불확실성을 더합니다.
  - severity: low
