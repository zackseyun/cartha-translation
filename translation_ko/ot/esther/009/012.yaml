  to: 그때 왕이 에스더 왕후에게 말씀하셨습니다. “수산 성채에서 유대인들이 남자 오백 명과 하만의 열 아들을 죽이고 멸했습니다. 그렇다면[a] 왕의 나머지 지방들에서는 무엇을 했습니까? 이제 왕후의 청이 무엇입니까? 왕후에게 허락될 것입니다. 또 다른 요청은 무엇입니까? 이루어질 것입니다.”
  rationale: 성채의 의미와 완료형 질문의 사실성을 회복하고, 아쉬운 성별 지시와 현대 한국어 수사 표현을 바로잡았습니다. 왕의 추론이라는 해석적 뉘앙스는 본문에 절제되어 반영하되, 더 단순한 독법은 각주로 보존했습니다.
