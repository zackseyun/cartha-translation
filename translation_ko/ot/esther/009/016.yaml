revisions:
- from: 그리고 왕의 각 지방에 있던 나머지 유다 사람들은 함께 모여 자기들의 생명을 위해 맞섰으며, 원수들로부터 쉼을 얻고 자기들을 미워하던 자들 가운데서 칠만오천 명을 죽였습니다. 그러나 그들은 plunder에 손을 대지 않았습니다.[a][b]
  to: 왕의 여러 지방에 있던 나머지 유대인들은 함께 모여 자기 목숨을 지키려고 맞서 섰고[a], 원수들에게서 벗어나 쉼을 얻었으며, 자신들을 미워하는 자들 가운데 칠만오천 명을 죽였습니다. 그러나 그들은 전리품에는 손을 대지 않았습니다.[b]
  rationale: 미번역 영어어 ‘plunder’를 ‘전리품’으로 바로잡고, 그 대안을 각주에 유지했습니다. 또한 왕의 복수 지방, 자기방어를 위한 집결과 대항, 원수들로부터의 쉼, 살해 인원 및 전리품 불취의 순서와 의미를 보존하면서 문장을 현대 한국어 합쇼체에 맞게 다듬었습니다. 각주 표지는 각각 해당 표현 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:08Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 구조(왕의 지방들에 있던 나머지 유대인들, 집결과 자기 생명 수호, 원수들에게서 얻은 쉼, 미워하는 자들 75,000명을 죽임, 전리품을 취하지 않음)는 대체로 반영되었습니다. 다만 본문의 영어어인 ‘plunder’는 한국어 번역문에 남겨 둘 수 없으므로 בִּזָּה의 적절한 한국어 대응어로 교정해야 합니다.
  naturalness: ‘plunder에 손을 대지 않았습니다’는 표준 한국어 성경 문체와 현대 합쇼체에 맞지 않습니다. ‘전리품에는 손을 대지 않았습니다’가 자연스럽고 원문의 관용적 표현도 살립니다. ‘왕의 각 지방’보다 ‘왕의 여러 지방’이 복수형 행정 구역을 더 자연스럽게 나타내며, ‘목숨을 지키려고 맞서 섰고’는 자기방어의 문맥을 명료하게 보존합니다.
  terminology: 에스더서의 집단 명칭에는 현대 한국어에서 통용되는 ‘유대인들’을 사용했습니다. בִּזָּה는 ‘전리품’으로 옮기고, ‘노획물’을 대안으로 각주에 제시했습니다. 신학적 해석을 추가하지 않고 본문이 제시하는 생명 수호의 틀과 폭력적 결과를 함께 유지했습니다.
