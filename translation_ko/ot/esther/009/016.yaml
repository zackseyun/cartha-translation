  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
  footnotes:
  - marker: a
    text: Or 'stood in defense of their lives.'
    reason: lexical_alternative
  - marker: b
    text: Or 'plunder' could be rendered 'spoil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 여러 지방에 있던 나머지 유대인들은 함께 모여 자기 목숨을 지키려고 맞서 섰고[a], 원수들에게서 벗어나 쉼을 얻었으며, 자신들을 미워하는 자들 가운데 칠만오천 명을 죽였습니다. 그러나 그들은 전리품에는 손을 대지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 목숨을 지키기 위해 섰다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘전리품’은 ‘노획물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  english_pob_choice: And the rest of the Jews
  chosen_korean: 나머지 유다 사람들
  alternatives_korean:
  - 남은 유다 사람들
  - 그 나머지 유대인들
  lexicon: HALOT
  rationale: שְׁאָר는 ‘남은/나머지’의 뜻이고, 에스더의 문맥에서는 민족 집단을 가리키므로 ‘유다 사람들’로 자연스럽게 옮겼습니다.
- source_word: נִקְהֲלוּ וְעָמֹד עַל נַפְשָׁם
  english_pob_choice: gathered themselves together and stood for their lives
  chosen_korean: 함께 모여 자기들의 생명을 위해 맞섰으며
  alternatives_korean:
  - 모여서 자기들의 생명을 위해 섰으며
  - 자기들의 생명을 지키려고 맞서며
  lexicon: HALOT
  rationale: נִקְהֲלוּ는 집단적으로 모임을 이룬다는 뜻이고, וְעָמֹד עַל נַפְשָׁם는 생명을 지키기 위한 자기방어의 관용구이므로 ‘생명을 위해 맞섰다’로 그 이미지를 살렸습니다.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  english_pob_choice: and had relief from their enemies
  chosen_korean: 원수들로부터 쉼을 얻고
  alternatives_korean:
  - 원수들로부터 안식을 얻고
  - 원수들로부터 휴식을 얻고
  lexicon: HALOT
  rationale: נוֹחַ는 단순한 휴식보다 전투 후의 ‘쉼/안정’에 가깝기 때문에, 서술의 흐름에 맞게 ‘쉼을 얻다’로 옮겼습니다.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  english_pob_choice: and killed seventy-five thousand of those who hated them
  chosen_korean: 자기들을 미워하던 자들 가운데서 칠만오천 명을 죽였습니다
  alternatives_korean:
  - 자기들을 미워하던 자들 중 칠만오천 명을 죽였습니다
  - 자기들을 미워하던 자들 가운데 칠만오천 명을 죽였습니다
  lexicon: HALOT
  rationale: בְּשֹׂנְאֵיהֶם는 ‘그들을 미워한 자들 가운데/중에서’로 자연스럽고, 히브리어의 전치사 ב를 과도하게 약화하지 않도록 ‘가운데서’를 택했습니다.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  english_pob_choice: but they did not lay a hand on the plunder
  chosen_korean: 그러나 그들은 plunder에 손을 대지 않았습니다
  alternatives_korean:
  - 그러나 그들은 전리품에 손을 대지 않았습니다
  - 그러나 그들은 노획물에 손을 대지 않았습니다
  lexicon: HALOT
  rationale: לֹא שָׁלְחוּ אֶת יָדָם는 ‘손을 대다/취하다’는 관용구이므로 그대로 살렸고, בִּזָּה는 전리품·노획물로도 옮길 수 있지만 여기서는 영어 POB의 단서를 반영해 주석 없이 본문에 ‘plunder’를 보존했습니다.
theological_decisions:
- issue: 유다 사람들의 폭력 행위와 자기방어의 틀
  chosen_reading: ‘자기들의 생명을 위해 맞섰으며’로 옮겨, 본문이 제시하는 자기방어의 틀을 유지했습니다.
  alternative_readings:
  - ‘자기들을 방어하며’
  - ‘자기들을 위해 싸우며’
  - ‘자기들의 생명을 지키려고’
  rationale: 히브리어 관용구는 단순한 공격이 아니라 생명 보전을 위한 대항을 뜻하므로, 폭력의 현실을 지우지 않으면서도 본문의 목적을 드러내는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
