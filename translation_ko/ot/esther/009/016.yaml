    rationale: 의미상 문제는 없지만 ‘왕의 여러 지방’ 및 ‘자기 목숨을 지키려고 맞서 섰고’가 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 자기방어적 관용구를 명확히 전달합니다.
