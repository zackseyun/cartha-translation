base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
  footnotes:
  - marker: a
    text: Or "these words." The Hebrew can refer either to the matters/events just described or to the words Mordecai wrote about them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모르드개가 이 일들을[a] 기록하고, 아하수에로 왕의 모든 지방에 있는 모든 유다인들, 곧 가까이 있는 이들과 멀리 있는 이들에게 서한들을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일들’은 앞서 서술된 사건들을 가리킬 수도 있고, 모르드개가 그것들에 관해 기록한 ‘말들’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: wrote
  chosen_korean: 기록하고
  alternatives_korean:
  - 썼고
  - 적었고
  lexicon: HALOT
  rationale: 단순한 필기 행위보다, 본문의 후속 공문 발송과 맞물리는 공식적 서술을 살려 ‘기록하다’로 옮겼습니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these things
  chosen_korean: 이 일들을
  alternatives_korean:
  - 이 말들을
  - 이 일들
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말들’만이 아니라 앞서 서술된 사건·사항을 가리킬 수 있으므로, 문맥을 넓게 담는 ‘일들’이 가장 자연스럽습니다.
- source_word: וַיִּשְׁלַח סְפָרִים
  english_pob_choice: sent letters
  chosen_korean: 서한들을 보냈습니다
  alternatives_korean:
  - 편지들을 보냈습니다
  - 문서들을 보냈습니다
  lexicon: HALOT
  rationale: סְפָרִים는 궁정 행정 문맥의 공문/서한을 가리키므로, 개인적 ‘편지’보다 격식 있는 ‘서한’이 더 잘 맞습니다.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  english_pob_choice: both near and far
  chosen_korean: 가까운 사람들과 먼 사람들
  alternatives_korean:
  - 가까운 자들과 먼 자들
  - 가깝거나 먼 사람들
  lexicon: HALOT
  rationale: 병렬적 대구를 한국어에서 자연스럽게 풀어, 지역적 거리를 사람 중심 표현으로 전달했습니다.
theological_decisions:
- issue: 아하수에로 왕의 칭호와 본문 어조
  chosen_reading: 역사 서술의 평서형을 유지하고, 왕호는 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 아하수에로의 왕
  - 아하수에로 대왕
  rationale: 본문은 신학적 강조보다 제국 행정의 사실 전달이 핵심이므로, 과장된 존칭을 피하고 서술 흐름을 그대로 살렸습니다.
  doctrine_reference: 본문-문맥 우선 원칙
