base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
  footnotes:
  - marker: a
    text: Or more idiomatically, 'year by year' or 'every year.' The Hebrew repeats 'year' for distributive emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 두루 확립하여 아달월 열나흗날과 그 열다섯날을 해마다 지키게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘해마다’를 반복하여 분배적 강조를 나타냅니다. 더 자연스럽게는 ‘해마다’ 또는 ‘매년’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  english_pob_choice: to establish
  chosen_korean: 두루 확립하여
  alternatives_korean:
  - 확립하여
  - 제정하여
  - 확정하여
  lexicon: HALOT
  rationale: 공적 문맥에서 관례를 세우는 뜻을 살리되, 한국어에서 자연스럽게 집단 전체에 미치는 효력을 드러내기 위해 ‘두루 확립하여’로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: among them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들 가운데
  - 그들 위에
  - 그들에게서
  lexicon: HALOT
  rationale: 직역하면 ‘그들 위에’이지만, 여기서는 유대 공동체 안에 관례를 정하는 뜻이므로 대상 집단을 자연스럽게 가리키는 ‘그들에게’가 적절합니다.
- source_word: לִהְיוֹת עֹשִׂים
  english_pob_choice: that they should observe
  chosen_korean: 지키게 하려는 것이었습니다
  alternatives_korean:
  - 행하게 하려는 것이었습니다
  - 준수하게 하려는 것이었습니다
  - 지키도록 하려는 것이었습니다
  lexicon: HALOT
  rationale: 절기 준수의 관용적 표현으로 ‘지키다’가 가장 자연스럽고, 의무화의 뉘앙스를 위해 ‘하게 하려는 것이었습니다’로 풀었습니다.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  english_pob_choice: year after year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다 또 해마다
  - 해마다 해마다
  lexicon: HALOT
  rationale: 히브리어의 반복 강조는 ‘year after year’로 정리된 영어 본문에 따라 한국어의 관용적 반복 표현인 ‘해마다’로 옮겼습니다.
theological_decisions:
- issue: 절기 준수 명령의 법적·공동체적 성격
  chosen_reading: 마르다개의 편지가 유대 공동체에 절기를 제정하는 행정적·공동체적 명령으로 들리도록 번역했습니다.
  alternative_readings:
  - 단순한 권고로 약화하는 번역
  - 종교적 의례 설명에만 머무는 번역
  rationale: 본문 동사는 단순한 마음가짐이 아니라 특정 날짜의 지속적 준수를 세우는 공적 조치를 가리키므로, 명령성과 제정성을 보존해야 합니다.
  doctrine_reference: 에스더 9:20-32의 부림절 제정 문맥
