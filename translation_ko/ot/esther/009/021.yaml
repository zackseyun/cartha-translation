  rationale: 본문 동사는 단순한 마음가짐이 아니라 특정 날짜의 지속적 준수를 세우는 공적 조치를 가리키므로, 명령성과 제정성을 보존해야 합니다.
  doctrine_reference: 에스더 9:20-32의 부림절 제정 문맥
