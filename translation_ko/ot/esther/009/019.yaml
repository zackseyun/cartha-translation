  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
  footnotes:
  - marker: a
    text: Or 'the Jews in the unwalled towns, who live in the open country settlements.'
    reason: lexical_alternative
  - marker: b
    text: '''Sending portions'' likely refers to sending food portions or gifts for the feast.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 성벽이 없는 마을들에 사는 유대인들은 아달 월 십사 일을 기쁨과 잔칫날과 즐거운 날로 지키며, 서로에게 몫을 보내고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성벽이 없는 마을들’은 히브리어의 비요새화 정착지를 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘몫을 보내다’는 이 축제에서 음식을 포함한 분량이나 선물을 주고받는 관습을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞 문맥의 결론을 나타내는 인과·추론 연결어로 자연스럽고, 원문의 논리 전개를 그대로 살립니다.
- source_word: הַפְּרָזוֹת / הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  english_pob_choice: of the villages, who live in the rural towns
  chosen_korean: 성벽이 없는 마을들에 사는
  alternatives_korean:
  - 읍성 없는 마을들에 사는
  - 열린 마을들에 사는
  lexicon: HALOT
  rationale: 문맥상 성곽 도시와 대비되는 비요새화 정착지를 가리키므로, 의미를 분명히 드러내는 ‘성벽이 없는 마을들’로 옮겼습니다.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  english_pob_choice: make the fourteenth day of the month of Adar
  chosen_korean: 아달 월 십사 일을 ... 지키며
  alternatives_korean:
  - 아달 월 십사 일을 ... 기념하며
  - 아달 월 십사 일을 ... 절기로 삼으며
  lexicon: HALOT
  rationale: ‘날을 만들다/하다’는 히브리어 관용을 한국어에서는 절기를 ‘지키다’로 자연스럽게 풀어, 행위의 계속된 관습성을 살렸습니다.
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  english_pob_choice: a day of gladness and feasting and a holiday
  chosen_korean: 기쁨과 잔칫날과 즐거운 날
  alternatives_korean:
  - 기쁨과 잔치와 명절
  - 기쁨과 잔치와 축제일
  lexicon: HALOT
  rationale: 세 항목의 병렬을 보존하면서, ‘מִשְׁתֶּה’를 단순한 잔치가 아니라 공동체적 축제 분위기를 띠는 ‘잔칫날’로, ‘יוֹם טוֹב’를 직역에 가까운 ‘즐거운 날’로 옮겼습니다.
- source_word: וּמִשְׁלוֹחַ מָנוֹת אִישׁ לְרֵעֵהוּ
  english_pob_choice: of sending portions, each man to his neighbor
  chosen_korean: 서로에게 몫을 보내고
  alternatives_korean:
  - 이웃에게 몫을 보내고
  - 각 사람이 서로에게 몫을 보내고
  lexicon: HALOT
  rationale: ‘몫’은 음식 몫을 포함한 분배된 부분을 넓게 살릴 수 있고, ‘보내다’는 חג의 나눔 관행을 자연스럽게 드러냅니다. ‘서로에게’는 분배의 상호성을 압축해 표현합니다.
theological_decisions:
- issue: 인칭·성별이 드러나는 분배 표현 אִישׁ לְרֵעֵהוּ의 처리
  chosen_reading: 서로에게
  alternative_readings:
  - 각 사람이 이웃에게
  - 각 남자가 자기 이웃에게
  rationale: 본문은 남성형 단수 분배 표현을 쓰지만, 실제 의미는 공동체 전체의 상호 나눔이므로 한국어에서는 의미를 보존하면서도 성별을 과도하게 부각하지 않는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
