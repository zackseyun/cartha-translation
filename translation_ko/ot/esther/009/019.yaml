  rationale: 원문의 지리적 대조(성벽 없는 성읍), 네 가지 축제 요소(기쁨, 잔치, 명절, 몫을 보냄), 그리고 분배 표현(각 사람이 자기 이웃에게)을 보존했습니다. 현대 합쇼체의 관습적 현재형으로 통일하고, 각주 표지를 해당 어구에 직접 붙였습니다.
