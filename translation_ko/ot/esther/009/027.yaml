  text: קִיְּמ֣וּ ו/קבל הַ/יְּהוּדִים֩ עֲלֵי/הֶ֨ם וְ/עַל זַרְעָ֜/ם וְ/עַ֨ל כָּל הַ/נִּלְוִ֤ים עֲלֵי/הֶם֙ וְ/לֹ֣א יַעֲב֔וֹר לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֣ת שְׁנֵ֤י הַ/יָּמִים֙ הָ/אֵ֔לֶּה כִּ/כְתָבָ֖/ם וְ/כִ/זְמַנָּ֑/ם בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
  footnotes:
  - marker: a
    text: Or 'all who attached themselves to them.' The Hebrew refers to those who joined or allied themselves with the Jews.
    reason: lexical_alternative
  - marker: b
    text: Or 'that it should not pass away' or 'that it should not be neglected.' The clause means the observance was not to lapse.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다인들은 자기들과 자기들의 자손, 그리고 자기들과 함께한 모든 사람을 위해 이것을 확정하고 받아들였습니다. 곧 두 날을 기록된 대로, 지정된 때에, 해마다 지켜서 결코 폐하지 않게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 유다인들에게 합류하거나 그들과 연합한 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '지나가지 않게' 또는 '소홀히 하지 않게'의 뜻으로, 절기 준수가 중단되지 않도록 하려는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ
  english_pob_choice: established
  chosen_korean: 확정하고
  alternatives_korean:
  - 세우고
  - 확립하고
  - 확인하고
  lexicon: HALOT
  rationale: 법적·공동체적 결정을 공식적으로 고정한다는 뜻을 살려 '확정하다'를 택했습니다.
- source_word: ו/קבל
  english_pob_choice: and accepted
  chosen_korean: 받아들였습니다
  alternatives_korean:
  - 스스로 맡았습니다
  - 수용했습니다
  - 받았습니다
  lexicon: HALOT
  rationale: 앞의 '확정하다'와 짝을 이루는 수락의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  english_pob_choice: all who joined them
  chosen_korean: 함께한 모든 사람
  alternatives_korean:
  - 그들에게 붙은 모든 사람
  - 그들과 연합한 모든 사람
  - 그들에게 동참한 모든 사람
  lexicon: HALOT
  rationale: לוה의 '붙다/합류하다' 의미를 살리되, 한국어에서 가장 분명하게 읽히는 표현으로 옮겼습니다.
- source_word: וְלֹא יַעֲבוֹר
  english_pob_choice: that it should not fail
  chosen_korean: 결코 폐하지 않게 하려는 것이었습니다
  alternatives_korean:
  - 사라지지 않게 하려는 것이었습니다
  - 지나가지 않게 하려는 것이었습니다
  - 소홀히 하지 않게 하려는 것이었습니다
  lexicon: HALOT
  rationale: 문맥상 절기 준수가 중단되지 않도록 한다는 뜻이므로, '폐하다'를 써서 지속성과 의무성을 드러냈습니다.
- source_word: כִּכְתָבָם וְכִזְמַנָּם
  english_pob_choice: according to what was written for them and at their appointed time
  chosen_korean: 기록된 대로, 지정된 때에
  alternatives_korean:
  - 기록된 규정대로, 정해진 때에
  - 그들에게 적힌 대로, 정해진 때에
  - 문서에 적힌 대로, 때에 맞추어
  lexicon: HALOT
  rationale: כתָב은 '기록/문서', זמן은 '정해진 때'이므로, 간결하게 두 준거를 병렬로 살렸습니다.
theological_decisions:
- issue: 연례 준수의 지속성 표현
  chosen_reading: '''해마다 지켜서 결코 폐하지 않게''로 옮겨, 단순 반복이 아니라 공동체 의무의 지속을 강조했습니다.'
  alternative_readings:
  - '''매년 지키도록'''
  - '''해마다 행하도록'''
  - '''매년 빠지지 않게'''
  rationale: 히브리어 וְלֹא יַעֲבוֹר는 관습의 이탈/중단을 막는 뜻이므로, 반복 관행 이상의 규범성을 드러내는 번역이 필요합니다.
  doctrine_reference: 공동체 기억과 절기 준수의 지속성
