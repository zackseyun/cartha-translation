  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 ‘죽였습니다’는 앞절(에스더 9:7)의 동사가 이 절의 이름들에도 이어지는 구조입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 및
  lexicon: HALOT
  rationale: 연속되는 목록을 이어 주는 접속으로 처리했습니다. 직접목적격 표지는 한국어에서 드러내지 않고 자연스러운 나열 표현으로 옮겼습니다.
- source_word: פּוֹרָתָא
  english_pob_choice: Poratha
  chosen_korean: 포라다
  alternatives_korean:
  - 포라타
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 영어 POB의 Poratha를 한국어 음운에 맞춰 옮겼습니다.
- source_word: אֲדַלְיָא
  english_pob_choice: Adalia
  chosen_korean: 아달랴
  alternatives_korean:
  - 아달리아
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 한국어에서는 ‘-lia’형보다 원음에 가까운 ‘아달랴’가 더 자연스럽습니다.
- source_word: אֲרִידָתָא
  english_pob_choice: Aridatha
  chosen_korean: 아리닷다
  alternatives_korean:
  - 아리다다
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 어말 자음과 모음 배열을 한국어 표기에 맞게 옮겼습니다.
theological_decisions:
- issue: 이 절의 문맥 보충 여부
  chosen_reading: 이름들만 제시하고, 살해되었다는 동사는 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 이름 앞에 ‘죽인’ 또는 ‘죽임을 당한’이라는 보충을 넣는 번역
  rationale: 히브리어 본문은 이 절에서 목록만 이어 가며, 영어 POB도 9:7의 동사를 문맥상 이해된 것으로 처리합니다. 따라서 한국어 본문도 절 자체의 범위를 넘는 보충은 하지 않았습니다.
  doctrine_reference: 문맥 보강 원칙
