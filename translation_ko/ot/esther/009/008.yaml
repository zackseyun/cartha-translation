revisions:
- from: 그리고 포라다와 아달랴와 아리닷다였습니다.[a]
  to: 또 포라다와 아달랴와 아리다다도 죽였습니다.[a]
  rationale: 앞절의 동사가 이 절의 세 이름을 계속 지배한다는 원문 구문을 자연스러운 합쇼체 한국어 문장으로 옮겼습니다. 이는 살해 행위를 새로 보태는 것이 아니라 원문과 문맥에 이미 걸려 있는 동사를 한국어에서 드러낸 것입니다. 인명 ‘아리다다’도 원어 및 통용 음역에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:02Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 앞절의 지배 동사에 이어 하만의 아들 세 명을 목적어로 열거합니다. 한국어에서는 절을 독립적으로 자연스럽게 제시하려면 앞절에서 이어지는 ‘죽였습니다’를 밝혀 주는 것이 적절하며, 이는 의미를 추가하는 것이 아니라 히브리어의 생략된 지배 동사를 반영하는 것입니다.
  naturalness: 초안의 “그리고 …였습니다”는 명사 나열에 서술 종결을 붙여 문법적으로 성립하지 않습니다. ‘또 …도 죽였습니다’는 앞절과의 연속성과 현대 한국어의 자연스러운 문장성을 함께 살립니다.
  terminology: 고유명사는 음역하되, 아리닷다는 히브리어 אֲרִידָתָא 및 통용 한국어 성서 표기에 맞추어 ‘아리다다’로 고칩니다. 포라다와 아달랴는 유지할 수 있습니다.
  issues:
  - severity: high
    issue: “그리고 포라다와 아달랴와 아리닷다였습니다”는 문법적으로 부자연스럽고 문장 의미가 완결되지 않습니다.
    rationale: 열거된 인명에 ‘였습니다’를 직접 결합할 수 없습니다. 원문의 목록이 앞절의 ‘죽였다’에 종속된 구조를 한국어에서 명료하게 반영해야 합니다.
  - severity: medium
    issue: ‘아리닷다’의 음역
    rationale: אֲרִידָתָא(Aridatha)는 한국어 음역에서 ‘아리다다’가 원어의 어말 -tha를 반영하면서도 통용 표기와 더 잘 맞습니다.
  - severity: low
    issue: 각주가 수정 본문의 동사 표기와 맞지 않습니다.
    rationale: 수정문은 ‘죽였습니다’를 표면적으로 제시하므로, 각주는 그 동사가 앞절에서 이어진다는 점을 설명하도록 고쳐야 합니다.
  revised_text: 또 포라다와 아달랴와 아리다다도 죽였습니다.[a]
  revised_footnotes:
  - marker: a
    text: 히브리어 본문에서 ‘죽였습니다’는 앞절(에스더 9:7)의 동사가 이 절의 이름들에도 이어지는 구조입니다.
    reason: cross_reference
  revision_rationale: 앞절의 동사가 이 절의 세 이름을 계속 지배한다는 원문 구문을 자연스러운 합쇼체 한국어 문장으로 옮겼습니다. 이는 살해 행위를 새로 보태는 것이 아니라 원문과 문맥에 이미 걸려 있는 동사를 한국어에서 드러낸 것입니다. 인명 ‘아리다다’도 원어 및 통용 음역에 맞추었습니다.
