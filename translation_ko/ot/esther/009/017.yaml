translation:
  language: ko
  text: 아달 월의 열셋째 날에, 그 이튿날인 열넷째 날에는 안식하며, 그 날을 잔치와 기쁨의 날로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문맥상 ‘열셋째 날에’로 옮길 수도 있지만, 날짜 서술의 자연스러움을 따라 서수형으로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 다음 날, 곧 아달 월의 열넷째 날을 가리킵니다.
