  - 그때에
  lexicon: day/time expression
  rationale: 히브리어의 지시적 시간표현을 자연스러운 한국어 서술어 순서로 옮겼습니다.
- source_word: מִסְפַּ֧ר הַֽ/הֲרוּגִ֛ים
  english_pob_choice: the number of those killed
  chosen_korean: 죽임을 당한 자들의 수
  alternatives_korean:
  - 살해된 자들의 수
  - 죽은 자들의 수
  lexicon: number + passive participle
  rationale: הֲרוּגִים의 수동적 의미를 살려 ‘죽임을 당한 자들’로 옮겨, 단순 사망이 아니라 살해/처형의 결과임을 드러냈습니다.
- source_word: בְּ/שׁוּשַׁ֥ן הַ/בִּירָ֖ה
  english_pob_choice: in Susa the citadel
  chosen_korean: 수산 궁성에서
  alternatives_korean:
  - 수산의 궁성에서
  - 수산 성채에서
  lexicon: proper noun + appositive noun phrase
  rationale: שׁוּשַׁן הַבִּירָה를 관용적으로 ‘수산 궁성’으로 묶어, 지명과 궁성의 결합을 간결하게 살렸습니다.
- source_word: לִ/פְנֵ֥י הַ/מֶּֽלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕 앞에
  - 왕에게
  lexicon: prepositional idiom
  rationale: לִפְנֵי의 기본 공간적/공적 면전 의미를 살려 ‘왕 앞에’로 옮겼습니다.
theological_decisions:
- issue: '동사의 방향성: ''was brought before''가 아니라 ''came before'''
  chosen_reading: 문자 그대로 ‘왕 앞에 이르렀다/나왔다’는 보고의 도착을 강조했습니다.
  alternative_readings:
  - 왕에게 보고되었다
  - 왕 앞에 제출되었다
  rationale: POB의 최신 교정이 ‘came before the king’으로 되돌아간 점을 반영하여, 단순 보고 도착의 의미를 유지하고 행위 주체를 과도하게 보강하지 않았습니다.
