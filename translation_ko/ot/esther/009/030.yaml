  naturalness: 초안의 ‘일백이십칠’은 현대 표준어 합쇼체 성경 번역에서는 다소 고풍스럽습니다. ‘127개’가 현대적이고 명료합니다. 또한 민족 집단을 가리키는 הַיְּהוּדִים에는 ‘유다 사람’보다 ‘유다인’이 더 간결하고 자연스러우며, 지명 유다의 주민이라는 오해도 줄입니다. ‘말들을 담은’은 ‘말을 담은’으로 다듬어 한국어 문장 흐름을 자연스럽게 했습니다.
