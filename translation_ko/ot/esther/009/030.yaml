id: EST.9.30
reference: Esther 9:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
  footnotes:
  - marker: a
    text: Or 'a message of peace and truth.' The Hebrew literally reads 'words of peace and truth.'
    reason: lexical_alternative
  - marker: b
    text: '''Truth'' may also be understood as ''faithfulness'' or ''reliability'' in this context.'
    reason: lexical_alternative
  - marker: c
    text: Ahasuerus is the Hebrew form of the royal name; some identify him historically with Xerxes I.
    reason: cultural_note
translation:
  language: ko
  text: 그는 아하수에로 왕국의 일백이십칠 지방에 있는 모든 유다 사람에게 평강과 진리의 말들을 담은 편지들을 보냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평강과 진리의 메시지’로 옮길 수도 있습니다. 히브리어는 문자적으로 ‘평강과 진리의 말들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진리’는 이 문맥에서 ‘신실함’ 또는 ‘신뢰성’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 아하수에로는 왕의 이름에 대한 히브리어 형태이며, 역사적으로는 크세르크세스 1세와 동일시되기도 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: And he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 전달했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도, 공식 문서 발송의 의미를 유지하는 동사로 ‘보냈습니다’를 선택했습니다.
- source_word: סְפָרִים
  english_pob_choice: letters
  chosen_korean: 편지들을
  alternatives_korean:
  - 서신들을
  - 문서들을
  lexicon: HALOT
  rationale: 페르시아 제국의 공문 성격을 반영하되 한국어에서 가장 자연스럽고 직접적인 대응은 ‘편지들’입니다.
- source_word: אֶל כָּל הַיְּהוּדִים
  english_pob_choice: to all the Jews
  chosen_korean: 모든 유다 사람에게
  alternatives_korean:
  - 모든 유대인에게
  - 모든 유다인에게
  lexicon: HALOT
  rationale: 에스더서의 민족 표기를 따라 ‘유다 사람’으로 옮기면 집단성을 유지하면서도 현대 한국어에서 자연스럽습니다.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  english_pob_choice: words of peace and truth
  chosen_korean: 평강과 진리의 말들
  alternatives_korean:
  - 평화와 진리의 말들
  - 평강과 진실의 말들
  - 평강과 성실의 말들
  lexicon: HALOT
  rationale: 히브리어의 문자적 구조인 ‘말들’을 살리면서, שָׁלוֹם은 ‘평강’, אֱמֶת은 기본 의미인 ‘진리’로 옮겼습니다.
theological_decisions:
- issue: אֱמֶת의 의미 범위
  chosen_reading: ‘진리’로 본문을 유지하되, 신학적 확장 없이 문맥상 사실성·신뢰성을 함께 담을 수 있게 했습니다.
  alternative_readings:
  - 진실
  - 성실
  - 신실함
  rationale: POB 주석처럼 이 단어는 문맥상 ‘truth’뿐 아니라 ‘faithfulness/reliability’의 뉘앙스를 가질 수 있으나, 본문에서는 공문구의 성격을 살려 가장 직접적인 ‘진리’를 택했습니다.
  doctrine_reference: 구약 히브리어 어휘의 의미 범위
