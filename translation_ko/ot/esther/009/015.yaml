source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
  footnotes:
  - marker: a
    text: Or, more formally, 'they did not stretch out their hand to the plunder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 수산에 있던 유다인들도 아달월 열나흗날에 함께 모여들어 수산에서 남자 삼백 명을 죽였지만, 그들은 그 전리품에는 손을 대지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그들은 그 전리품에 손을 뻗지 않았습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  english_pob_choice: assembled
  chosen_korean: 함께 모여들어
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  lexicon: HALOT
  rationale: קהל의 집합·자발적 집결 의미를 살리면서, 한국어에서 자연스럽고 서술적인 표현으로 옮겼습니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: The Jews
  chosen_korean: 유다인들
  alternatives_korean:
  - 유대인들
  - 유다 사람들
  lexicon: HALOT
  rationale: 에스더서의 יְהוּדִים는 디아스포라 안의 민족·종교 집단을 가리키므로, 성서 한국어에서 비교적 직접적인 ‘유다인들’을 택했습니다.
- source_word: שׁוּשָׁן
  english_pob_choice: Susa
  chosen_korean: 수산
  alternatives_korean:
  - 수사
  - 수산 성
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서에서 널리 쓰이는 표기 ‘수산’을 사용했습니다.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  english_pob_choice: they did not lay a hand on the plunder
  chosen_korean: 그들은 그 전리품에는 손을 대지 않았습니다
  alternatives_korean:
  - 그들은 그 노획물에는 손을 대지 않았습니다
  - 그들은 전리품을 차지하지 않았습니다
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘손을 대다’를 살려, 약탈물에 손대지 않았다는 금지/자제의 뉘앙스를 자연스럽게 전달했습니다. ‘전리품’은 בִּזָּה의 전쟁·전투 맥락을 반영합니다.
theological_decisions:
- issue: 전리품을 취하지 않은 행위의 도덕적 강조
  chosen_reading: 살인은 했지만 전리품에는 손대지 않았다는 대조를 분명히 드러냈습니다.
  alternative_readings:
  - 그들은 약탈을 하지 않았습니다
  - 그들은 물건에는 손대지 않았습니다
  rationale: 본문은 살육과 재산 취득의 분리를 대비적으로 보여 주므로, 한국어에서도 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: 본문 서술의 대비 구조
