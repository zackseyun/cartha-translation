revisions:
- from: 이러한 부림절의 날들을 그 정해진 때에 지키게 하려는 것이니, 곧 유다 사람 모르드개와 왕후 에스더가 그들을 위해 정해 놓았듯이, 그리고 그들이 자기 자신과 자기 자손을 위해 금식과 그들의 부르짖음의 일들을 정해 놓았듯이 하려는 것입니다.[a][b]
  to: 이는 이 부림절의 날들을 정해진 때에 확립하도록 하신 것이니, 유다 사람 모르드개와 왕후 에스더가 그들에게 정해 주었듯이, 또 그들이 자신들과 자손들에게 금식들과 그들의 부르짖음에 관한 사항들을 정하였듯이 하신 것입니다.[a][b]
  rationale: 반복되는 קים을 ‘확립하다/정하다’로 일관되게 옮겨 절기의 공적·규범적 확립이라는 원문의 의미를 보존했습니다. 문맥상 앞 절의 발송 행위에 연결되는 부정사를 한국어 완결문으로 자연스럽게 처리했으며, עַל의 의무 부과 의미와 דִּבְרֵי의 ‘사항’ 의미를 반영했습니다. 각주 표지는 각각 첫 번째 동사와 ‘부르짖음’에 붙여 해당 주석의 대상이 분명하도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:11Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 동사 קים의 반복은 절기 및 관련 사항을 공식적으로 확립·정하는 뜻입니다. 초안의 ‘지키게 하려는 것’은 준수 행위로 의미를 좁히며, 문장 끝의 ‘하려는 것입니다’도 히브리어의 부정사 연계와 맞지 않습니다. 또한 עַל־נַפְשָׁם은 ‘자기 자신을 위해’보다 스스로에게 의무로 정했다는 뜻을 나타냅니다.
  naturalness: 초안은 ‘하려는 것이니 … 하려는 것입니다’라는 중복된 미완성 구문 때문에 현대 한국어 문장으로 매우 부자연스럽습니다. ‘금식과 그들의 부르짖음의 일들’도 수식 관계가 불분명합니다.
  terminology: ‘부림절’, ‘유다 사람 모르드개’, ‘왕후 에스더’는 사용할 수 있습니다. דִּבְרֵי는 ‘일들’보다 이 문맥에서는 ‘일들에 관한 사항’이 자연스럽고, ‘부르짖음’은 זַעֲקָה의 강도를 적절히 보존합니다.
  issues:
  - severity: high
    issue: ‘지키게 하려는 것’ 및 문장 종결 ‘하려는 것입니다’
    rationale: קים은 이 문맥에서 공식적 확립·규정의 의미이며, 초안은 이를 단순 준수로 좁힙니다. 또한 원문은 앞 절의 ‘편지들을 보냈다’에 이어지는 부정사이므로, 한국어에서는 목적·결과를 나타내는 ‘확립하도록 하였습니다’가 자연스럽습니다.
  - severity: medium
    issue: ‘자기 자신과 자기 자손을 위해’
    rationale: עַל נַפְשָׁם וְעַל זַרְעָם은 자신들과 자손에게 의무로 정했다는 표현입니다. ‘위해’는 수혜 의미로 오해될 수 있으므로 ‘자신들과 자손에게’가 더 정확합니다.
  - severity: medium
    issue: ‘금식과 그들의 부르짖음의 일들’
    rationale: 한국어 수식 구조가 어색하고 의미가 불분명합니다. דִּבְרֵי를 ‘…에 관한 사항들’로 옮기면 원문의 행정적·규정적 어감을 살릴 수 있습니다.
  - severity: low
    issue: 각주 a의 ‘כאן’
    rationale: 한국어 각주 안에 문맥상 맞지 않는 히브리어 단어가 들어가 있습니다. ‘여기서’로 바로잡아야 합니다.
