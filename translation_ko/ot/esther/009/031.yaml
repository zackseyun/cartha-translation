  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
  footnotes:
  - marker: a
    text: Or 'confirm' instead of 'establish' for the repeated Hebrew verb קים in this verse; the sense is the formal fixing or ratifying of the observance.
    reason: lexical_alternative
  - marker: b
    text: '''Their outcry'' may also be rendered ''their cry'' or ''their lament.'' The Hebrew likely refers to the community''s cries associated with the fasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 부림절의 날들을 그 정해진 때에 지키게 하려는 것이니, 곧 유다 사람 모르드개와 왕후 에스더가 그들을 위해 정해 놓았듯이, 그리고 그들이 자기 자신과 자기 자손을 위해 금식과 그들의 부르짖음의 일들을 정해 놓았듯이 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘확정하려는 것’으로 옮길 수 있습니다. כאן의 קים은 반복적으로 나온 공식화·확립의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 부르짖음’은 ‘그들의 외침’ 또는 ‘그들의 탄원’으로도 옮길 수 있습니다. 히브리어는 금식과 관련된 공동체의 절박한 외침을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  english_pob_choice: to establish
  chosen_korean: 지키게 하려는 것
  alternatives_korean:
  - 확정하려는 것
  - 설정하려는 것
  - 유지하려는 것
  lexicon: HALOT
  rationale: 문맥상 부림절 준수를 공식적으로 세우고 확정하는 뜻이므로, 한국어로는 예식 준수의 결과가 드러나는 ‘지키게 하려는 것’이 가장 자연스럽습니다.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  english_pob_choice: these days of Purim
  chosen_korean: 이러한 부림절의 날들
  alternatives_korean:
  - 이 부림절의 날들
  - 이러한 부림의 날들
  lexicon: HALOT
  rationale: 절기의 고유명사를 살리되, 부림절에 속한 특정한 날들이라는 점을 ‘이러한’으로 강조했습니다.
- source_word: בִּזְמַנֵּיהֶם
  english_pob_choice: at their appointed times
  chosen_korean: 그 정해진 때에
  alternatives_korean:
  - 그들의 때에
  - 정해진 시간에
  - 지정된 때에
  lexicon: HALOT
  rationale: זְמָן의 의미는 단순한 시각보다 지정·임명된 때이므로, 절기 준수의 고정성을 드러내는 ‘정해진 때에’로 옮겼습니다.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  english_pob_choice: the matters of the fasts and their cry
  chosen_korean: 금식과 그들의 부르짖음의 일들
  alternatives_korean:
  - 금식들과 그들의 외침의 일들
  - 금식의 일들과 그들의 부르짖음
  - 금식과 그들의 탄원의 일들
  lexicon: HALOT
  rationale: דִּבְרֵי는 ‘일들/사안들’의 뜻이 강하고, זַעֲקָה는 단순한 소리보다 절박한 부르짖음을 가리키므로, ‘부르짖음의 일들’로 연결해 원문의 묶음 구조를 살렸습니다.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  english_pob_choice: Mordecai the Jew
  chosen_korean: 유다 사람 모르드개
  alternatives_korean:
  - 유대인 모르드개
  - 유다인 모르드개
  lexicon: HALOT
  rationale: 에스더서의 ეთnic 표지는 전통적 ‘유다 사람’이 본문 맥락과 가장 잘 맞고, ‘유대인’보다 고대 민족/집단성을 덜 오해하게 합니다.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: Esther the queen
  chosen_korean: 왕후 에스더
  alternatives_korean:
  - 에스더 왕후
  - 여왕 에스더
  lexicon: HALOT
  rationale: 히브리어의 명사구 배치를 살리면서도 한국어에서 가장 자연스럽고 격식 있는 호칭으로 옮겼습니다.
theological_decisions:
- issue: ‘지키게 하려는 것’ vs ‘확정하려는 것’의 절기 제정 뉘앙스
  chosen_reading: 본문은 단순한 개인적 준수가 아니라 공동체 절기의 공식적 확립을 말하므로, 준수의 결과를 드러내는 표현을 채택했습니다.
  alternative_readings:
  - 확정하려는 것
  - 정립하려는 것
  rationale: 히브리어 קים의 반복이 행정적·규범적 확립을 가리키므로, 한국어에서도 절기 제정의 공적 성격이 살아야 합니다.
  doctrine_reference: 성경 본문의 예식·공동체 규범 서술
