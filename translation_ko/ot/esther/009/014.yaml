  source_fidelity: 첫 접속사 ‘그러므로’는 히브리어 וַ־의 단순 서사 연결을 인과로 과도하게 해석합니다. 또한 תָּלוּ에는 ‘목’이라는 신체 부위가 없으므로 ‘목에 달렸습니다’는 근거 없는 구체화이며 한국어로도 부자연스럽습니다. ‘매달았습니다’는 행위의 주체가 문맥상 생략된 한국어 서술로서 히브리어 복수 동사와 형벌·공개 전시 방식의 폭을 적절히 보존합니다.
  naturalness: ‘왕이 그렇게 하라고 말하였습니다’와 ‘수산에는’도 이해 가능하지만, ‘왕이 그렇게 하도록 하였습니다’, ‘수산에’가 이 문맥에서 더 간결하고 자연스러운 현대 합쇼체입니다. ‘목에 달렸습니다’는 자연스러운 한국어 표현이 아닙니다.
  terminology: ‘수산’과 ‘조서’는 적절합니다. 처형·전시 방식은 본문에서 현대적 교수형으로 한정되지 않으므로 본문은 ‘매달았습니다’로 두고, 말뚝/기둥에 꿰거나 매다는 가능성은 각주로 보존하는 것이 적절합니다.
