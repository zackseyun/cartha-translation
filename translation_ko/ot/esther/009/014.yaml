  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
  footnotes:
  - marker: a
    text: Or "were impaled"; the Hebrew verb can refer to hanging bodies on a stake or pole, not necessarily hanging by the neck in the modern sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 왕이 그렇게 하라고 말하였습니다. 수산에는 조서가 내려졌고, 하만의 열 아들은 목에 달렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말뚝에 꽂혔다”; 히브리어 동사는 현대적 의미의 목매달기만이 아니라, 시신을 기둥이나 장대에 매다는 경우도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  english_pob_choice: So the king said
  chosen_korean: 그러므로 왕이 그렇게 하라고 말하였습니다
  alternatives_korean:
  - 왕이 명령하였습니다
  - 왕이 그렇게 하라고 말씀하셨습니다
  lexicon: HALOT
  rationale: אמר는 기본적으로 ‘말하다’이므로, 왕의 승인과 뒤따르는 조서를 구분해 살리기 위해 ‘말하였습니다’를 유지했습니다. ‘명령하였습니다’는 원문보다 공식적 강도를 높일 수 있습니다.
- source_word: וַתִּנָּתֵן דָּת
  english_pob_choice: A decree was issued
  chosen_korean: 조서가 내려졌고
  alternatives_korean:
  - 법령이 공포되었고
  - 조서가 주어졌고
  lexicon: HALOT
  rationale: נתן + דת는 페르시아 행정 문맥의 관용구이므로, 한국어에서는 자연스럽고 공문서적인 ‘조서가 내려졌고’로 옮겼습니다. ‘법’보다 행정 조치의 성격을 더 잘 드러냅니다.
- source_word: בְּשׁוּשָׁן
  english_pob_choice: in Susa
  chosen_korean: 수산에는
  alternatives_korean:
  - 수사에는
  - 수산에서
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘수산’을 따랐고, 장소 부사는 원문의 מקום감각을 살려 ‘-에는’으로 처리했습니다.
- source_word: תָּלוּ
  english_pob_choice: were hanged
  chosen_korean: 목에 달렸습니다
  alternatives_korean:
  - 매달렸습니다
  - 처형당해 매달렸습니다
  lexicon: HALOT
  rationale: תלה는 현대식 교수뿐 아니라 시신을 말뚝이나 장대에 매다는 의미를 포함할 수 있어, 영어 POB의 각주를 반영해 신체를 ‘목에 달렸다’고 직접적으로 옮겼습니다. 이는 ‘교수형’으로 좁히지 않기 위한 선택입니다.
theological_decisions:
- issue: תָּלוּ의 형벌 방식
  chosen_reading: ‘목에 달렸습니다’로 옮겨, 현대적 목매달기만을 뜻하는 것으로 오해하지 않게 했습니다.
  alternative_readings:
  - ‘매달렸습니다’
  - ‘교수되었습니다’
  rationale: 본문과 영어 주석이 시신을 기둥/말뚝에 달았을 가능성을 인정하므로, 한국어도 그 의미 폭을 남겨 두는 것이 source-grounded합니다.
  doctrine_reference: 본문의 형벌 묘사에 대한 역사·문헌학적 주의
- issue: 왕의 발화와 조서의 구분
  chosen_reading: 왕의 ‘말함’과 조서의 ‘내려짐’을 분리해, 왕의 승인 발언과 공식 행정 조치를 함께 드러냈습니다.
  alternative_readings:
  - 왕이 곧바로 명령했다로 통합
  - 조서가 곧바로 공포되었다로 단순화
  rationale: 원문은 왕의 발화와 조서 발행을 연속적으로 구별하므로, 두 층위를 모두 보존하는 번역이 더 정확합니다.
  doctrine_reference: 역사서 서술의 사건 구분
