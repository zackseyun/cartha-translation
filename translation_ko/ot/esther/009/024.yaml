id: EST.9.24
reference: Esther 9:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
  footnotes:
  - marker: a
    text: Hebrew Pur is a loanword explained in the text itself as 'the lot'; retaining it preserves the connection to the name Purim in the surrounding passage.
    reason: cultural_note
  - marker: b
    text: Or 'to throw them into panic' / 'to confound them' for 'to throw them into confusion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 함므다다의 아들인 아각 사람[a] 하만, 곧 모든 유다인의 원수가 유다인들을 멸하려고 꾀하고, 부르[b], 곧 제비를 뽑아 그들을 혼란에 빠뜨리고 멸하려고 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아각 사람’은 히브리어 명칭을 옮긴 것입니다. 하만의 출신 또는 계통을 나타내는 말로 보이지만, 그 정확한 성격은 본문에서 밝히지 않습니다.
    reason: cultural_note
  - marker: b
    text: ‘부르’는 본문에 나오는 외래어를 음역한 것으로, 이어지는 ‘제비’라는 설명과 함께 읽어야 합니다.
    reason: source_note
lexical_decisions:
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  english_pob_choice: Haman son of Hammedatha the Agagite
  chosen_korean: 하만—함므다다의 아각 사람
  alternatives_korean:
  - 하만—함므다다의 아각인
  - 하만—함므다다의 아각파 사람
  lexicon: HALOT
  rationale: 고유명사는 음역하되, הָאֲגָגִי는 단순한 지명형보다 혈통·계열을 드러내는 표현이므로 ‘아각 사람’으로 옮겼습니다.
- source_word: צֹרֵר
  english_pob_choice: the enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 대적
  lexicon: HALOT
  rationale: 현재분사형의 지속적 적대성을 살려, 문맥상 가장 응축된 대응인 ‘원수’를 선택했습니다.
- source_word: וְהִפִּיל פּוּר הוּא הַגּוֹרָל
  english_pob_choice: and had cast Pur—that is, the lot
  chosen_korean: 부르, 곧 제비를 뽑아
  alternatives_korean:
  - 푸르, 곧 제비를 뽑아
  - 부르—곧 제비—를 던져
  lexicon: HALOT
  rationale: פּוּר는 이름화된 외래어를 보존하고, הַגּוֹרָל의 설명을 ‘제비’로 분명히 하되 한국어 관용에 맞게 ‘뽑아’로 풀었습니다.
- source_word: לְהֻמָּם
  english_pob_choice: to throw them into confusion
  chosen_korean: 그들을 혼란에 빠뜨리고
  alternatives_korean:
  - 그들을 혼란시키고
  - 그들을 소동에 빠뜨리고
  - 그들을 공포에 몰아넣고
  lexicon: HALOT
  rationale: הםם의 핵심 의미를 ‘혼란/동요’로 보아, 직접적이면서도 현대 한국어로 자연스러운 ‘혼란에 빠뜨리다’로 옮겼습니다.
- source_word: לְאַבְּדָם
  english_pob_choice: to destroy them
  chosen_korean: 멸하려고
  alternatives_korean:
  - 없애려고
  - 파멸시키려고
  - 멸망시키려고
  lexicon: HALOT
  rationale: 절의 결말과 병행되는 최종 파괴 의도를 드러내기 위해 ‘멸하다’를 사용했습니다.
theological_decisions:
- issue: פּוּר의 보존 여부
  chosen_reading: 한국어 본문에 ‘부르’로 음역을 남기고, 뒤이어 ‘곧 제비를’로 설명합니다.
  alternative_readings:
  - ‘제비’로만 번역
  - ‘푸르’로 음역
  rationale: 본문 자체의 설명(הוּא הַגּוֹרָל)을 보존하면서, 주변 문맥의 ‘부림’ 연관을 잃지 않기 위해 이름성을 유지했습니다.
  doctrine_reference: 성서 번역의 본문 충실성과 문맥적 상호참조 보존
- issue: לְהֻמָּם의 강도
  chosen_reading: ‘혼란에 빠뜨리고’로 옮겨, 단순한 소동이 아니라 적대적 동요를 드러냅니다.
  alternative_readings:
  - ‘공포에 몰아넣고’
  - ‘무너뜨리고’
  rationale: 히브리어 동사는 파괴 이전의 동요·혼란을 뜻하므로, 본문의 연쇄적 의도(혼란과 멸망)를 함께 살렸습니다.
  doctrine_reference: 본문의 단계적 악의 진술 보존
