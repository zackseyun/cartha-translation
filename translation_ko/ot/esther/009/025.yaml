  to: 그러나 그녀가 왕 앞에 나아갔을 때, 왕은 문서로[a] 명령하여 유대인들을 해하려고 그가 꾸민 악한 계획이 그의 머리로 돌아가게 하였고, 그와 그의 아들들을 그 나무에[b] 달게 하였습니다.
  rationale: ‘행하려던’을 ‘해하려고 그가 꾸민’으로 고쳐, 유대인들을 향한 하만의 악한 계획과 원문의 반복된 ‘계획하다’ 표현을 반영했습니다. 각주 표지는 해당 어구인 ‘문서’와 ‘나무’에 직접 배치했습니다. 나머지 표현은 원문의 문맥적 모호성과 처형 방식의 불확실성을 보존하므로 유지했습니다.
