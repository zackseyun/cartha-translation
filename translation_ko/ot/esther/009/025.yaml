  source_fidelity: 본문의 ‘그가 유대인들을 해하려고 꾸민 악한 계획’이라는 관계절 의미가 초안의 ‘유대인들에게 행하려던 그의 악한 계획’에서는 충분히 드러나지 않습니다. 후자는 계획을 ‘실행하려 했다’는 뜻으로 기울며, חָשַׁב(계획하다/꾸미다)의 반복 표현을 약화합니다. 이를 보완하면 왕의 서면 명령, 악한 계획의 역전, 그리고 그와 아들들의 처형이라는 원문의 흐름을 충실히 옮길 수 있습니다.
  naturalness: ‘왕 앞에 나아갔을 때’, ‘문서로 명령하여’는 현대 표준어 합쇼체의 서사 문맥에 자연스럽습니다. ‘그 나무에 달게 하였습니다’는 처형 방식과 구조물의 정확한 성격을 본문에서 과도하게 특정하지 않으면서도 자연스럽게 전달합니다.
  terminology: ‘악한 계획’, ‘그의 머리로 돌아가게 하다’, ‘나무’는 각각 מַחֲשָׁבָה, עַל־רֹאשׁוֹ, עֵץ의 의미와 문맥을 적절히 반영합니다. ‘문서’는 סֵפֶר의 문맥상 서면 칙령을 자연스럽게 나타냅니다. 처형 동사와 עֵץ의 대안적 이해는 각주로 유지합니다.
