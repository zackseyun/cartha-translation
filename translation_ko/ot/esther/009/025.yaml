source:
  edition: WLC
  text: וּ/בְ/בֹאָ/הּ֮ לִ/פְנֵ֣י הַ/מֶּלֶךְ֒ אָמַ֣ר עִם הַ/סֵּ֔פֶר יָשׁ֞וּב מַחֲשַׁבְתּ֧/וֹ הָ/רָעָ֛ה אֲשֶׁר חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים עַל רֹאשׁ֑/וֹ וְ/תָל֥וּ אֹת֛/וֹ וְ/אֶת בָּנָ֖י/ו עַל הָ/עֵֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
  footnotes:
  - marker: a
    text: Or, more literally, 'he said with the letter/book'; the sense is that the king issued a written decree.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be understood as 'impaled,' and 'the tree' may refer to a stake or wooden pole rather than a modern gallows.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그녀가 왕 앞에 나아가자, 그는 글로 명령하여 유대인들에게 행하려던 그의 악한 계획이 그의 머리로 돌아가게 하고, 그와 그의 아들들을 그 나무에 달게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘그는 그 글/문서와 함께 말했다’입니다. 뜻은 왕이 서면 칙령을 내렸다는 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘꿰뚫다/장대에 매달다’로도 이해할 수 있으며, ‘나무’는 현대식 교수대가 아니라 장대나 목재 기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: But when she came before the king
  chosen_korean: 그런데 그녀가 왕 앞에 나아가자
  alternatives_korean:
  - 그런데 그녀가 왕 앞에 이르렀을 때
  - 그런데 에스더가 왕 앞에 나아가자
  lexicon: HALOT
  rationale: 여성 단수 대명사는 에스더를 가리키지만, 본문 흐름상 이름을 반복하지 않아도 자연스럽습니다. ‘왕 앞에 나아가다’는 왕에게 공식적으로 접근하는 관용을 잘 살립니다.
- source_word: אָמַר עִם הַסֵּפֶר
  english_pob_choice: he commanded by letter
  chosen_korean: 그는 글로 명령하여
  alternatives_korean:
  - 그는 편지로 명령하여
  - 그는 문서로 명령하여
  - 그는 기록으로 명령하여
  lexicon: HALOT
  rationale: 직역하면 ‘책/문서와 함께 말하다’처럼 압축되어 있지만, 문맥상 왕의 서면 칙령을 가리킵니다. ‘글로 명령하여’는 그 서면 행위의 힘을 살리면서도 한국어로 자연스럽습니다.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  english_pob_choice: his evil scheme which he had devised
  chosen_korean: 그의 악한 계획이 그의 머리로 돌아가게 하고
  alternatives_korean:
  - 그의 악한 꾀가 그 자신에게 돌아가게 하고
  - 그가 유대인들에게 꾸민 악한 계획이 그에게 돌아가게 하고
  lexicon: HALOT
  rationale: ‘מחשבה’는 단순한 생각보다 의도된 계획/꾀를 뜻하며, 이어지는 ‘그가 꾸몄던’이 그 계획의 고의성을 분명히 합니다. ‘머리로 돌아가다’는 보복적 역전의 관용을 살립니다.
- source_word: וְתָלוּ אֹתוֹ וְאֶת בָּנָיו עַל הָעֵץ
  english_pob_choice: and they hanged him and his sons on the gallows
  chosen_korean: 그와 그의 아들들을 그 나무에 달게 하였습니다
  alternatives_korean:
  - 그와 그의 아들들을 그 장대에 매달게 하였습니다
  - 그와 그의 아들들을 그 교수대에 달게 하였습니다
  lexicon: HALOT
  rationale: 히브리어 ‘나무/목재/장대’의 기본 의미를 유지해, POB가 주석으로 남긴 실행 방식의 불확실성을 한국어 본문에서 과도하게 특정하지 않았습니다. ‘달다’는 תלה의 처형 행위를 직접적으로 반영합니다.
theological_decisions:
- issue: 복수와 역전의 응보 표현
  chosen_reading: ‘그의 악한 계획이 그의 머리로 돌아가게 하고’로 보복적 역전을 분명히 드러냈습니다.
  alternative_readings:
  - 그의 악한 계획이 자기 머리 위로 돌아오게 하고
  - 그의 악한 계획이 그 위에 되돌아가게 하고
  rationale: 본문의 핵심은 유대인을 향한 악의가 가해자 자신에게 되돌아오는 역전입니다. 한국어에서도 관용적이고 이해 가능한 방식으로 그 신학적 긴장을 보존했습니다.
  doctrine_reference: 섭리와 응보의 역전; 시 7:16, 잠 26:27과 유사한 성경적 원리
