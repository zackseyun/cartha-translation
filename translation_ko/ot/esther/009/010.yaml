  rationale: 하만이 함므다다의 아들이며 유다인들의 원수라는 원문의 동격 관계를 한국어 수식 구조로 명확히 했습니다. 약탈물을 취하지 않았다는 대조와 ‘손을 대다’라는 관용적 이미지는 보존했으며, 각주는 해당 어휘인 ‘전리품’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
