  source_fidelity: 하만을 ‘하메다다의 아들’로, 하만의 열 아들 전체를 ‘유다인들의 원수’로 읽게 할 수 있는 수식 관계의 모호성이 있습니다. 히브리어는 하만이 하메다다의 아들이며 유다인들의 원수라고 동격으로 규정합니다. 또한 약탈물을 취하지 않았다는 관용은 유지되어야 합니다.
  naturalness: ‘그들은 그들의 손을 전리품에 대지 않았습니다’는 주어와 소유 대명사의 반복이 한국어에서 다소 부자연스럽습니다. ‘전리품에는 손을 대지 않았습니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 의미도 보존합니다.
  terminology: ‘유다인들의 원수’와 ‘전리품’은 적절합니다. 인명은 하만의 부친을 가리키도록 ‘함므다다의 아들 하만’으로 명료하게 처리하는 것이 필요합니다. ‘함므다다’는 히브리어의 겹자음에 더 충실한 음역입니다.
