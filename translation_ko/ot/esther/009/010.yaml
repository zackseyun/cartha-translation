lexical_decisions:
- source_word: עֲשֶׂרֶת
  english_pob_choice: the ten
  chosen_korean: 열 명
  alternatives_korean:
  - 열
  lexicon: HALOT
  rationale: 뒤따르는 ‘아들들’에 자연스럽게 결합되는 수량 표현으로, 한국어에서는 ‘열 명’이 가장 읽기 쉽고 정확합니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 문맥상 하만의 남자 자손을 가리키므로, 일반적인 ‘후손들’보다 직접적인 ‘아들들’이 원문에 더 가깝습니다.
- source_word: צֹרֵר הַיְּהוּדִים
  english_pob_choice: the enemy of the Jews
  chosen_korean: 유다인들의 원수
  alternatives_korean:
  - 유다인들의 적
  - 유다인들의 대적
  lexicon: HALOT
  rationale: צֹרֵר는 단순한 반대자가 아니라 적대하며 괴롭히는 자를 뜻하므로, 관용적이면서도 강한 ‘원수’가 적절합니다.
- source_word: וּבַבִּזָּה
  english_pob_choice: on the plunder
  chosen_korean: 전리품에
  alternatives_korean:
  - 노획물에
  - 노략물에
  lexicon: HALOT
  rationale: בִּזָּה는 전쟁 맥락의 약탈품을 가리키므로, 현대 한국어에서 자연스러운 ‘전리품’으로 옮겼습니다.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  english_pob_choice: they did not lay a hand
  chosen_korean: 그들은 그들의 손을 … 대지 않았습니다
  alternatives_korean:
  - 그들은 손을 뻗지 않았습니다
  - 그들은 손을 대지 않았습니다
  lexicon: HALOT
  rationale: ‘손을 보내다’의 직역보다, 소유를 취하지 않음을 드러내는 한국어 관용 ‘손을 대다’가 원문의 몸짓 이미지를 살리면서도 자연스럽습니다.
theological_decisions:
- issue: 하만과 그의 아들들에 대한 폭력 서술의 번역 톤
  chosen_reading: 서술적·사실적 어조로 옮기고, 원문의 판단어를 추가하지 않았습니다.
  alternative_readings:
  - 윤리적 평가를 덧붙이는 번역
  - 완화된 표현으로 바꾸는 번역
  rationale: 본문은 사건 보고에 초점이 있으며, 번역이 원문의 서술을 넘어 도덕적 해설을 덧붙이면 저자가 전달한 역사 서술의 긴장이 희석됩니다.
  doctrine_reference: 성경 본문의 역사 서술 존중
- issue: ‘손을 대지 않았다’의 관용 처리
  chosen_reading: 직역적 이미지를 유지하되 한국어 관용으로 의미를 드러냈습니다.
  alternative_readings:
  - ‘그들의 손을 보내지 않았습니다’의 직역
  - ‘약탈하지 않았습니다’로 의미만 요약
  rationale: 원문의 손-이미지는 약탈 금지를 생생하게 전달하므로, 관용적 표현과 결합해 이미지와 의미를 함께 보존했습니다.
  doctrine_reference: 본문 이미지 보존 원칙
