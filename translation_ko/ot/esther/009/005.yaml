revisions:
- from: 유다인들은 모든 원수들을 칼의 타격으로[a], 도륙과 멸망으로 쳤습니다. 그리고 그들을 미워하는 자들에게는 자신들이 좋게 여기는 대로 행했습니다[b].
  to: 유대인들은 그들의 모든 원수를 칼로 쳐서 죽이고, 도륙하고 멸망시켰습니다[a]. 그리고 자신들을 미워하는 자들에게 자기들이 원하는 대로 행했습니다[b].
  rationale: 원문의 반복적이고 강한 폭력 묘사를 약화하지 않되, 한국어에서 부자연스러운 명사구 연쇄를 동사 병렬로 풀었습니다. 마지막 절은 ‘좋게 여기는’이라는 평가의 뉘앙스를 제거하고, 원문의 ‘뜻/의지’의 의미를 ‘원하는 대로’로 직접 옮겼습니다. 각주는 직역적 칼의 타격 표현과 마지막 절의 대안을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:04Z'
review_pass:
  verdict: revise
  source_fidelity: ‘자신들이 좋게 여기는 대로’는 כִּרְצוֹנָם(‘그들의 뜻/원하는 대로’)의 의지·바람의 뜻을 충분히 직접적으로 드러내지 못합니다. 또한 ‘칼의 타격으로 … 도륙과 멸망으로 쳤습니다’는 히브리어의 폭력 행위의 누적을 한국어에서 다소 부자연스럽게 만듭니다. 수정문은 칼로 침, 살육, 멸망이라는 누적된 서술을 자연스럽게 보존합니다.
  naturalness: ‘유대인들’, ‘원하는 대로’가 현대 표준 한국어에서 더 자연스럽습니다. ‘칼로 쳐서 죽이고, 도륙하고 멸망시켰습니다’는 폭력의 강도를 완화하지 않으면서도 합쇼체 산문으로 읽기 좋습니다.
  terminology: יְהוּדִים은 이 문맥에서 ‘유대인들’로 옮기는 것이 현대 한국어의 일반적 명칭에 맞습니다. מַכַּת־חֶרֶב는 본문에서 ‘칼로 쳐서 죽이고’로 풀되, 각주에서 직역적 표현인 ‘칼의 타격/일격’을 보존합니다. כִּרְצוֹנָם은 ‘자기들이 원하는 대로’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘자신들이 좋게 여기는 대로’가 כִּרְצוֹנָם의 의미를 흐립니다.
    rationale: רָצוֹן은 여기서 ‘좋다고 판단함’보다 그들의 뜻, 의지, 바람을 가리킵니다. ‘원하는 대로’ 또는 ‘자기 뜻대로’가 더 직접적입니다.
  - severity: medium
    issue: ‘칼의 타격으로, 도륙과 멸망으로 쳤습니다’는 한국어 결합이 어색합니다.
    rationale: 히브리어의 명사 연쇄는 폭력의 결과와 강도를 강조하지만, 한국어에서는 이를 동사로 풀어 ‘쳐서 죽이고, 도륙하고 멸망시켰습니다’라고 하는 편이 의미와 문체를 더 잘 살립니다.
  - severity: low
    issue: ‘유다인들’보다 ‘유대인들’이 현대 표준어에서 더 일반적입니다.
    rationale: 원문의 집단 지시를 유지하면서 독자에게 더 익숙한 현대 명칭을 사용합니다.
