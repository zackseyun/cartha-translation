base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
  footnotes:
  - marker: a
    text: Or 'with the stroke of the sword.' The Hebrew phrase is literally 'the blow of the sword.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their will.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들은 그들의 모든 원수를 칼로 쳐서 죽이고, 도륙하고 멸망시켰습니다[a]. 그리고 자신들을 미워하는 자들에게 자기들이 원하는 대로 행했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘칼의 타격/일격, 살육과 멸망’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 뜻대로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 쳤다
  - 무찔렀습니다
  - 살해했습니다
  lexicon: HALOT נכה
  rationale: נכה는 넓게 ‘치다/타격하다/쳐서 쓰러뜨리다’를 뜻하므로, 앞의 명사들이 설명하는 폭력성을 살리면서도 결과를 미리 과도하게 특정하지 않는 ‘쳤습니다’를 택했습니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다인들은
  alternatives_korean:
  - 유대인들은
  - 유다 사람들은
  lexicon: HALOT יהודי
  rationale: 에스더서는 포로기 디아스포라의 민족-종교 집단을 가리키므로, 한국어에서는 자연스럽고 본문 맥락에도 맞는 ‘유다인들’을 사용했습니다.
- source_word: מַכַּת חֶרֶב
  english_pob_choice: the blow of the sword
  chosen_korean: 칼의 타격으로
  alternatives_korean:
  - 칼의 일격으로
  - 칼의 치기로
  - 칼의 타격으로
  lexicon: HALOT מַכָּה + חֶרֶב
  rationale: 히브리어의 직역적 구조인 ‘칼의 타격/일격’을 살리되, 한국어에서 ‘칼의 타격으로’가 가장 자연스럽고 본문의 강조된 폭력성을 유지합니다.
- source_word: כִּרְצוֹנָם
  english_pob_choice: as they pleased
  chosen_korean: 자신들이 좋게 여기는 대로
  alternatives_korean:
  - 자기 뜻대로
  - 자신들이 원하는 대로
  - 마음에 드는 대로
  lexicon: HALOT רָצוֹן
  rationale: 직역적 ‘그들의 뜻/의지대로’의 의미를 담으면서도 현대 한국어에서 무리 없이 읽히는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술의 강도를 약화하지 않고 번역할지 여부
  chosen_reading: 본문의 폭력적 표현을 완화하지 않고, ‘타격/도륙/멸망’의 누적을 그대로 살렸습니다.
  alternative_readings:
  - ‘무찔렀습니다’처럼 일반화하기
  - ‘섬멸했습니다’처럼 해석을 더 강하게 넣기
  rationale: 히브리어는 여러 폭력 명사를 병렬해 강도를 높이므로, 번역도 그 중첩을 보존해야 합니다. 다만 해석을 넘어서는 과장은 피했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 범위를 넘는 의역 금지
