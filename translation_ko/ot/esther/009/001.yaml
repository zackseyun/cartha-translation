id: EST.9.1
reference: Esther 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'Now in the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
  footnotes:
  - marker: a
    text: Or, 'it was reversed' or 'it was turned about' for 'the opposite happened.'
    reason: lexical_alternative
translation:
  language: ko
  text: 열두 번째 달, 곧 아달월 그 달 열셋째 날에, 왕의 말과 그의 조서가 시행될 날, 곧 유다 사람들의 원수들이 그들을 지배하기를 바랐던 바로 그날에, 상황은 반대로 되었습니다[a]. 유다 사람들이 자신들을 미워하는 자들을 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “상황은 반대로 되었습니다”는 히브리어 וְנַהֲפוֹךְ הוּא를 옮긴 것입니다. “뒤집혔습니다” 또는 “역전되었습니다”로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  english_pob_choice: Now in the twelfth month
  chosen_korean: 두 번째 달
  alternatives_korean:
  - 열두째 달
  - 열두 번째 달
  lexicon: HALOT
  rationale: 문맥상 이미 달 이름 아달로 풀어 주므로, 한국어에서는 “두 번째 달”을 뒤에 다시 설명되는 아달월과 자연스럽게 이어지도록 옮겼습니다.
- source_word: הוּא חֹדֶשׁ אֲדָר
  english_pob_choice: that is, the month Adar
  chosen_korean: 곧 아달월
  alternatives_korean:
  - 즉 아달 달
  - 아달월
  lexicon: HALOT
  rationale: 설명적 동격을 “곧”으로 처리해 원문의 식별 기능을 살렸고, 아달은 한국어 성경에서 통용되는 아달월로 옮겼습니다.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  english_pob_choice: the king’s word and his decree
  chosen_korean: 왕의 말과 그의 조서
  alternatives_korean:
  - 왕의 말과 그의 칙령
  - 왕의 명령과 그의 조서
  lexicon: HALOT
  rationale: דָּבָר는 단순한 “명령”보다 넓은 “말/선언”의 의미가 있어 “말”로 두고, דָּת는 공적 법적 문서의 성격을 살려 “조서”로 옮겼습니다.
- source_word: וְנַהֲפוֹךְ הוּא
  english_pob_choice: the opposite happened
  chosen_korean: 그 반대로 되었습니다
  alternatives_korean:
  - 뒤집혔습니다
  - 정반대가 되었습니다
  lexicon: HALOT
  rationale: 관용적 역전 표현을 자연스러운 현대 한국어로 옮기되, 원문의 극적인 반전을 그대로 드러내도록 했습니다.
- source_word: יִשְׁלְטוּ ... בְּשֹׂנְאֵיהֶם
  english_pob_choice: the Jews themselves ruled over those who hated them
  chosen_korean: 유다 사람들 자신이 그들을 미워하던 자들을 다스렸습니다
  alternatives_korean:
  - 유다 사람들 자신이 그들을 미워하던 자들 위에 군림했습니다
  - 유다 사람들 자신이 그들을 미워하던 자들을 지배했습니다
  lexicon: HALOT
  rationale: שׁלט의 지배/통치 의미를 살리되, 한국어에서는 이 문맥의 대조를 가장 분명히 드러내는 “다스리다”를 택했고, הֵמָּה의 강조를 “자신이”로 반영했습니다.
theological_decisions:
- issue: 계산된 시간표시와 반전 서술의 강조
  chosen_reading: 본문은 단순한 날짜 통지가 아니라, 왕의 조서가 집행되려는 바로 그날에 역전이 일어났음을 강조하는 서술로 읽었습니다.
  alternative_readings:
  - 중립적인 날짜 기록으로만 읽기
  - 마지막 반전 구절만 강조하기
  rationale: 에스더서의 서술 흐름상 날짜 표기와 ‘그 반대로 되었습니다’는 함께 작동하여 하나님의 섭리적 역전을 드러냅니다.
  doctrine_reference: 섭리와 역사 속 역전
