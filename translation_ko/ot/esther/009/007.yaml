  text: וְ/אֵ֧ת פַּרְשַׁנְדָּ֛תָא וְ/אֵ֥ת דַּֽלְפ֖וֹן וְ/אֵ֥ת אַסְפָּֽתָא׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/007.yaml
  text: Parshandatha[a], Dalphon, and Aspatha,
  footnotes:
  - marker: a
    text: These are the first three names in the list of Haman's sons, continued from the previous verse's statement that the Jews killed them.
    reason: cross_reference
translation:
  language: ko
  text: 파르산닷사[a], 달폰, 그리고 아스바다입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이름들은 앞 절에서 유대인들이 죽였다고 말한 하만의 아들들 목록의 처음 세 개입니다.
    reason: cross_reference
lexical_decisions:
- source_word: פַּרְשַׁנְדָּתָא
  english_pob_choice: Parshandatha
  chosen_korean: 파르산닷사
  alternatives_korean:
  - 파르샨다타
  - 파르산다타
  lexicon: HALOT
  rationale: 고유명사이므로 음역했습니다. 영어 POB의 Parshandatha를 바탕으로 하되, 한국어 표기에서는 고어적 자음군을 자연스럽게 풀어 표준어 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: דַּלְפוֹן
  english_pob_choice: Dalphon
  chosen_korean: 달폰
  alternatives_korean:
  - 달포ן
  - 달포온
  lexicon: HALOT
  rationale: 고유명사이므로 뜻풀이 없이 음역했습니다. 영어 POB의 Dalphon과 거의 일치하는 한국어 음역이 가장 직접적입니다.
- source_word: אַסְפָּתָא
  english_pob_choice: Aspatha
  chosen_korean: 아스바다
  alternatives_korean:
  - 아스파타
  - 아스파다
  lexicon: HALOT
  rationale: 고유명사이므로 음역했습니다. 어말 -תָא의 값을 한국어에서 무리하게 '타'로 고정하기보다, 영어 POB의 Aspatha를 참고해 한국어 음성 체계에 맞게 옮겼습니다.
theological_decisions:
- issue: 이 절이 이전 절의 '죽였다'는 서술에 이어지는 이름 목록이라는 점
  chosen_reading: 이 절만 단독으로는 동사가 없으므로, 앞 절의 행위를 이어 받는 목록으로 읽히도록 이름들을 쉼표로 나열하고 마지막에 '그리고'를 두었습니다.
  alternative_readings:
  - 단순한 이름 세 개의 병렬 나열
  - 각 이름 앞에 반복 접속사 '그리고'를 붙이는 방식
  rationale: 히브리어 원문은 반복된 וְ/אֵת로 목적어 목록을 구성하므로, 한국어에서도 서술을 덧붙이지 않고 앞 절의 동작을 이어 받는 명단으로 보이게 하는 것이 원문 기능을 가장 잘 반영합니다.
  doctrine_reference: 본문 연속성 및 서사 문맥
