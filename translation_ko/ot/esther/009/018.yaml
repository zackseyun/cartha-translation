base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
  footnotes:
  - marker: a
    text: Hebrew literally, 'on the thirteenth of it ... on the fourteenth of it ... on the fifteenth of it,' with 'it' referring to the month from context.
    reason: lexical_alternative
  - marker: b
    text: Or 'made it a day of banqueting and joy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 수사에 있던 유다 사람들은 그달 열셋째 날과 열넷째 날에[a] 모였고, 그달 열다섯째 날에는 쉬고, 그날을 잔치와 기쁨의 날로 삼았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것의 열셋째 날 … 그것의 열넷째 날 … 그것의 열다섯째 날’이라고 되어 있으며, 여기서 ‘그것’은 문맥상 그달을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그날을 잔치와 기쁨의 날로 정했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  english_pob_choice: But the Jews
  chosen_korean: 그런데 유다 사람들은
  alternatives_korean:
  - 그리고 유다 사람들은
  - 그 유다 사람들은
  lexicon: HALOT
  rationale: 앞 절과의 대비를 살려 '그런데'로 옮기고, ליהודים는 민족명으로 자연스러운 '유다 사람들'을 택했습니다.
- source_word: בְּשׁוּשָׁן
  english_pob_choice: who were in Susa
  chosen_korean: 수사에 있던
  alternatives_korean:
  - 수사에 있는
  - 수산에 있던
  lexicon: HALOT
  rationale: 지명 שושן은 한국어 성서 용례에 맞는 '수사'를 쓰고, יחס절은 자연스럽게 '있던'으로 처리했습니다.
- source_word: נִקְהֲלוּ
  english_pob_choice: assembled
  chosen_korean: 모였고
  alternatives_korean:
  - 집결했고
  - 모여들었고
  lexicon: HALOT
  rationale: נקהל의 집합 의미를 간결하게 살리되, 본문의 날짜 열거와 어울리는 자연한 서술로 옮겼습니다.
- source_word: וְעָשֹׂה אֹתוֹ יוֹם מִשְׁתֶּה וְשִׂמְחָה
  english_pob_choice: and made it a day of feasting and gladness
  chosen_korean: 그날을 잔치와 기쁨의 날로 삼았습니다
  alternatives_korean:
  - 그날을 잔치와 즐거움의 날로 만들었습니다
  - 그날을 잔치와 기쁨의 날로 정했습니다
  lexicon: HALOT
  rationale: עשה + 목적어는 단순한 '만들다'보다 '삼다/정하다'가 한국어에서 관용적으로 더 정확하며, מִשְׁתֶּה와 שִׂמְחָה는 각각 '잔치'와 '기쁨'으로 옮겼습니다.
theological_decisions:
- issue: 절기적 기념일을 뜻하는 'made it'의 처리
  chosen_reading: 그날을 잔치와 기쁨의 날로 삼았습니다
  alternative_readings:
  - 그날을 잔치와 기쁨의 날로 만들었습니다
  - 그날을 잔치와 기쁨의 날로 정했습니다
  rationale: 히브리어 관용구는 단순한 제작이 아니라 특정 날을 기념일로 설정하는 의미이므로, 의미를 분명히 드러내되 과장 없이 번역했습니다.
  doctrine_reference: 본문의 역사서술/기념일 제정 맥락
