  to: 그러므로 그들은 이 날들을 부림[a]이라 불렀습니다. 이는 부르의 이름을 따른 것이었습니다. 그러므로 이 편지의 모든 내용과 이 일에 관하여 그들이 본 것과 그들에게 일어난 일[b] 때문에—
