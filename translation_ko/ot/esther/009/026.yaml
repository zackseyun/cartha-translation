    text: 또는 ‘부르를 따라’. 히브리어는 문자적으로 ‘부르의 이름을 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 닥쳐온 일’.
    reason: lexical_alternative
