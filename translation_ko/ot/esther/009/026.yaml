id: EST.9.26
reference: Esther 9:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
  footnotes:
  - marker: a
    text: Or 'after Pur'; Hebrew literally 'after the name of Pur.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what had come upon them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 이 날들을 부림[a]이라 불렀는데, 이는 부르의 이름을 따서였습니다. 그러므로 이 모든 편지의 말들과 그들이 이 일에 대해 본 것, 그리고 그들에게 일어난 일을 두고서입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부르를 따라’. 히브리어는 문자적으로 ‘부르의 이름을 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 닥친 일’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  english_pob_choice: they called
  chosen_korean: 불렀는데
  alternatives_korean:
  - 이름 지었는데
  - 호칭했는데
  lexicon: HALOT
  rationale: 명명 행위의 단순 서술이므로, 직역성이 있으면서도 한국어에서 자연스러운 ‘불렀는데’를 택했습니다.
- source_word: פוּרִים
  english_pob_choice: Purim
  chosen_korean: 부림
  alternatives_korean:
  - 푸림
  - 부림절
  lexicon: HALOT
  rationale: 절기 고유명사로 음역하되, 한국어 성경 전통에서 통용되는 형태를 고려해 ‘부림’으로 옮겼습니다.
- source_word: עַל שֵׁם הַפּוּר
  english_pob_choice: after the name of Pur
  chosen_korean: 부르의 이름을 따서
  alternatives_korean:
  - 부르의 이름에 따라
  - 부르라는 이름을 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 עַל שֵׁם의 명명 근거를 살리기 위해 ‘이름을 따서’로 옮겼고, 뒤의 ‘부르’는 바로 앞의 어원 설명을 반영했습니다.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  english_pob_choice: and what had happened to them
  chosen_korean: 그리고 그들에게 일어난 일을
  alternatives_korean:
  - 그리고 그들에게 닥친 일을
  - 그리고 그들에게 닿은 일을
  lexicon: HALOT
  rationale: הִגִּיעַ אֲלֵיהֶם의 ‘미치다/닥치다’ 의미를 한국어에서 가장 자연스럽고 과도하지 않게 드러내기 위해 ‘일어난 일’로 처리했습니다.
theological_decisions:
- issue: 절기 이름과 어원적 연결을 어떻게 드러낼지
  chosen_reading: ‘부림’을 고유명사로 두고, 각주에서 ‘부르의 이름을 따서’라는 어원적 설명을 보충했습니다.
  alternative_readings:
  - ‘부르’로 음역을 통일하는 읽기
  - ‘제비’로 의미 번역하는 읽기
  rationale: 본문은 절기 명칭을 이미 고정된 이름으로 제시하면서도 어원을 설명하므로, 고유명사는 보존하고 어원은 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: 성경 번역의 투명성 및 어원 주석 원칙
