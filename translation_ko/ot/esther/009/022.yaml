    rationale: וּמִשְׁלוֹחַ מָנוֹת ... וּמַתָּנוֹת ...은 ‘날들’을 규정하는 두 관습적 행위 항목입니다. 한국어에서는 몫을 보내고 선물을 주는 행위로 병렬 처리해야 의미가 분명합니다.
  - severity: medium
    issue: ‘그 달과 같이’가 원문의 병렬 구조를 부정확하고 어색하게 처리합니다.
    rationale: 본문은 쉼을 얻은 날들과 슬픔·애통이 전환된 달을 함께 언급합니다. ‘그 날들과 ... 그 달을’로 병렬 대상을 드러내는 것이 자연스럽습니다.
  revised_text: 유다 사람들이 원수들에게서 쉼을 얻은 날들과, 그들에게 슬픔이 즐거움으로, 애통이 좋은 날로 바뀐 그 달을 잔치와 즐거움의 날들로 삼고, 각 사람이 자기 이웃에게 몫을 보내며 가난한 사람들에게 선물을 주게 하였습니다.[a][b]
