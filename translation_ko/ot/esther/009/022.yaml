revisions:
- from: 그들이 원수들에게서 쉼을 얻은 날들과, 슬픔에서 즐거움으로, 애통에서 좋은 날로 바뀐 그 달과 같이, 그날들을 잔치와 즐거움의 날로, 그리고 각 사람이 자기 이웃에게 보내는 몫과 가난한 사람들에게 주는 선물의 날로 삼게 하였습니다.[a][b]
  to: 유다 사람들이 원수들에게서 쉼을 얻은 날들과, 그들에게 슬픔이 즐거움으로, 애통이 좋은 날로 바뀐 그 달을 잔치와 즐거움의 날들로 삼고, 각 사람이 자기 이웃에게 몫을 보내며 가난한 사람들에게 선물을 주게 하였습니다.[a][b]
  rationale: 원문의 명시적 주어와 병렬 구조를 복원하고, ‘잔치와 즐거움의 날들’ 및 ‘몫을 보내고 선물을 주는’ 두 요소의 문법적 관계를 한국어에서 분명히 했습니다. ‘좋은 날’은 해석으로 대체하지 않고 유지했으며, 그 절기적 뉘앙스와 ‘몫’의 음식 의미 가능성은 각주로 제한했습니다.
