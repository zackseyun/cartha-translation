source:
  edition: WLC
  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
  footnotes:
  - marker: a
    text: Or 'each person to another.' The Hebrew reads literally 'a man to his neighbor,' a distributive expression for mutual giving.
    reason: lexical_alternative
  - marker: b
    text: Or 'to a festive day' or 'to a day of celebration.' Literally, 'to a good day.'
    reason: lexical_alternative
  - marker: c
    text: '''Sending portions'' likely refers to sending food portions as festival gifts.'
    reason: cultural_note
translation:
  language: ko
  text: 유다 사람들이 원수들에게서 쉼을 얻은 날들과, 그들에게 슬픔이 즐거움으로, 애통이 좋은 날로 바뀐 그 달을 잔치와 즐거움의 날들로 삼고, 각 사람이 자기 이웃에게 몫을 보내며 가난한 사람들에게 선물을 주게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 날’은 히브리어를 직역한 표현입니다. 문맥에서는 축제일 또는 기념일을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘몫을 보내는 것’은 대체로 절기에 음식 몫을 서로 보내는 관습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: נָחוּ ... מֵאֹיְבֵיהֶם
  english_pob_choice: had rest from their enemies
  chosen_korean: 원수들에게서 쉼을 얻은
  alternatives_korean:
  - 원수들에게서 휴식을 얻은
  - 원수들에게서 안식을 얻은
  lexicon: HALOT
  rationale: נוח의 핵심은 ‘쉬다/쉼을 얻다’이므로, 문맥의 전쟁적 긴장 속에서 ‘쉼을 얻은’으로 옮겨 원수들로부터의 해방감을 살렸습니다.
- source_word: נֶהְפַּךְ
  english_pob_choice: had been turned
  chosen_korean: 바뀐
  alternatives_korean:
  - 뒤바뀐
  - 변한
  lexicon: HALOT
  rationale: פך의 수동적 전환 의미를 살리되, 한국어에서는 달력적 기념의 역전을 자연스럽게 드러내는 ‘바뀐’이 가장 간결합니다.
- source_word: מִיָּגוֹן ... לְשִׂמְחָה וּמֵאֵבֶל לְיוֹם טוֹב
  english_pob_choice: from sorrow to gladness and from mourning to a good day
  chosen_korean: 슬픔에서 즐거움으로, 애통에서 좋은 날로
  alternatives_korean:
  - 근심에서 기쁨으로, 애곡에서 좋은 날로
  - 슬픔에서 환희로, 애도에서 축일로
  lexicon: HALOT
  rationale: יָגוֹן/שִׂמְחָה/אֵבֶל의 감정 대비를 유지하면서, ‘좋은 날’은 본문의 직역성을 살리되 한국어에서 어색하지 않게 배치했습니다.
- source_word: מִשְׁלוֹחַ מָנוֹת אִישׁ לְרֵעֵהוּ
  english_pob_choice: sending portions, each man to his neighbor
  chosen_korean: 각 사람이 자기 이웃에게 보내는 몫
  alternatives_korean:
  - 각 사람이 자기 이웃에게 보내는 음식 몫
  - 각 사람이 자기 이웃에게 보내는 음식 부분
  lexicon: HALOT
  rationale: ‘몫’은 מָנוֹת의 기본 뜻을 보존하고, 뒤의 분배 문구와 결합해 절기 음식 나눔을 지나치게 풀이하지 않으면서도 충분히 이해 가능하게 합니다.
- source_word: וּמַתָּנוֹת לָאֶבְיוֹנִים
  english_pob_choice: and gifts to the poor
  chosen_korean: 가난한 사람들에게 주는 선물
  alternatives_korean:
  - 가난한 사람들에게 주는 예물
  - 빈궁한 사람들에게 주는 선물
  lexicon: HALOT
  rationale: אֶבְיוֹנִים을 ‘가난한 사람들’로 옮겨 사회적 대상이 분명하게 드러나도록 했고, ‘선물’은 חג적 나눔의 성격을 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘좋은 날’의 직역성과 절기 의미
  chosen_reading: 본문의 ‘좋은 날’ 표현을 유지하되, 문맥 전체에서 잔치와 즐거움의 절기성으로 이해되도록 했습니다.
  alternative_readings:
  - ‘축제일’로 의역
  - ‘즐거운 날’로 완화
  rationale: 히브리어는 문자적으로 ‘좋은 날’이라고 말하므로, 본문의 역전 구조를 보존하는 쪽이 더 투명합니다. 그 의미는 뒤의 ‘잔치와 즐거움’으로 충분히 해명됩니다.
  doctrine_reference: 'Translation philosophy: source transparency over domestication'
- issue: אִישׁ לְרֵעֵהוּ의 분배적 남성형
  chosen_reading: ‘각 사람이 자기 이웃에게’로 옮겨 분배적 기능을 살리면서 현대 한국어에서 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘각 남자가 자기 이웃에게’
  - ‘각 사람이 서로에게’
  rationale: 히브리어의 남성 단수 표현은 관용적 분배 구조이므로, 의미를 유지하되 한국어에서는 과도한 성별 표지를 피하는 것이 문맥상 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
