id: EST.9.2
reference: Esther 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
  footnotes:
  - marker: a
    text: Or 'to attack those seeking their harm'; the Hebrew idiom is literally 'to send/stretch out a hand against.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and no one could withstand them.'
    reason: lexical_alternative
  - marker: c
    text: '''Peoples'' likely refers to the various ethnic groups or populations within the empire, not merely a single nation.'
    reason: cultural_note
translation:
  language: ko
  text: 유다 사람들은 아하수에로 왕의 모든 지방에 있는 자기들의 성읍에서, 자기들에게 해를 끼치려는 자들에게 손을 대기 위해 모였습니다[a]. 아무도 그들 앞에 설 수 없었습니다[b]. 그들에 대한 두려움이 모든 민족들[c] 위에 내렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기들에게 해를 끼치려는 자들에게 손을 내밀다’라는 관용구입니다. 여기서는 그들을 공격하거나 해치려는 행동을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무도 그들을 당해 낼 수 없었습니다’.
    reason: lexical_alternative
  - marker: c
    text: ‘민족들’은 여기서 한 민족만이 아니라 제국 안의 여러 민족 집단이나 주민들을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  english_pob_choice: assembled
  chosen_korean: 모였으며
  alternatives_korean:
  - 집결하였으며
  - 모였습니다
  lexicon: HALOT
  rationale: נִקְהֲלוּ는 단순히 흩어진 것이 아니라 공동체적으로 모여든다는 뜻이므로, 자연스러운 합쇼체로 ‘모였으며’가 가장 직접적입니다.
- source_word: לִשְׁלֹחַ יָד
  english_pob_choice: to lay hands on
  chosen_korean: 손을 뻗쳤습니다
  alternatives_korean:
  - 손을 내밀었습니다
  - 공격하였습니다
  - 손을 뻗어 쳤습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 대상을 향한 적대적 행동을 뜻하므로, 문자성과 공격성을 함께 살린 ‘손을 뻗쳤습니다’로 옮겼습니다.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  english_pob_choice: those seeking their harm
  chosen_korean: 자기들의 해를 꾀하는 자들
  alternatives_korean:
  - 자기들의 해를 찾는 자들
  - 자기들에게 해를 끼치려는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 악/해를 찾는 자들’이므로, 한국어에서 의미가 분명한 ‘해를 꾀하는 자들’로 풀어 적대 의도를 드러냈습니다.
- source_word: וְ/אִישׁ לֹא עָמַד לִפְנֵי/הֶם
  english_pob_choice: and no one could stand before them
  chosen_korean: 아무도 그들 앞에 설 수 없었습니다
  alternatives_korean:
  - 아무도 그들 앞에 맞설 수 없었습니다
  - 그들 앞에 설 사람이 없었습니다
  lexicon: HALOT
  rationale: ‘서다’는 כאן에서 대항·저항의 관용적 의미이므로, ‘그들 앞에 설 수 없었습니다’로 자연스럽게 재현했습니다.
- source_word: עַל כָּל הָעַמִּים
  english_pob_choice: on all the peoples
  chosen_korean: 모든 민족들 위에
  alternatives_korean:
  - 모든 백성들 위에
  - 모든 민족 위에
  lexicon: HALOT
  rationale: פַּחַד이 ‘내려지다’는 이미지와 연결해, 여러 민족/집단을 가리키는 복수형의 넓은 범위를 살려 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: ‘유다 사람들’과 ‘아하수에로 왕의 모든 지방’의 역사적·서술적 범위
  chosen_reading: 본문은 유다 공동체의 집단적 방어 행동이 제국 전역의 행정 구역 안에서 일어났음을 그대로 서술합니다.
  alternative_readings:
  - 상징적으로 일반화해 읽기
  - 단순히 한 지역 사건으로 축소하기
  rationale: 에스더서의 서술은 특정 역사적 권역과 집단을 전제로 하므로, 범위를 약화시키지 않고 그대로 유지하는 것이 본문 의도에 충실합니다.
  doctrine_reference: 성경 본문은 구체적 역사 서술로 읽어야 한다는 문해 원칙
- issue: ‘그들에 대한 두려움이 모든 민족들 위에 내려졌기 때문입니다’의 주체와 수동성
  chosen_reading: 두려움은 유다 사람들의 힘을 과장하기보다, 하나님 섭리 속에서 열방 위에 덮인 결과로 이해할 수 있으나 본문 자체는 직접적으로 하나님을 언급하지 않습니다.
  alternative_readings:
  - 순전히 심리적 공포로만 읽기
  - 명시적 신적 개입으로 단정하기
  rationale: 히브리어의 수동형 이미지를 보존하되, 본문에 없는 주어를 삽입하지 않도록 신학적 해석은 절제했습니다.
  doctrine_reference: 본문 우선 원칙과 암시적 섭리 이해
