revisions:
- from: 유다 사람들은 아하수에로 왕의 모든 지방에 있는 각 성읍에서 모였으며, 자기들의 해를 꾀하는 자들에게 손을 뻗쳤습니다[a]. 그리고 아무도 그들 앞에 설 수 없었습니다[b], 이는 그들에 대한 두려움이 모든 민족들 위에 내려졌기 때문입니다[c].
  to: 유다 사람들은 아하수에로 왕의 모든 지방에 있는 자기들의 성읍에서, 자기들에게 해를 끼치려는 자들에게 손을 대기 위해 모였습니다[a]. 아무도 그들 앞에 설 수 없었습니다[b]. 그들에 대한 두려움이 모든 민족들[c] 위에 내렸기 때문입니다.
  rationale: 히브리어의 목적 표현(‘손을 대기 위해’)과 적대 행위의 대상을 명확히 하되, 관용구의 문자적 이미지는 각주에서 보존했습니다. ‘그들 앞에 서다’와 ‘두려움이 … 위에 내리다’의 표현은 원문의 비유와 모호성을 유지했습니다. 본문에 명시되지 않은 신적 행위나 해석을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:03Z'
