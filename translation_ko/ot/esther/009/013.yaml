  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
  footnotes:
  - marker: a
    text: Or, 'be hung on the tree' or 'be impaled on the stake.' The Hebrew literally says 'on the wood/tree,' which in context refers to an execution structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더가 말했습니다. “왕께서 좋게 여기신다면, 수산에 있는 유다인들이 내일도 오늘의 조서대로 행할 수 있게 허락해 주시고, 하만의 열 아들을 나무에 매달게 해 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나무에 매달게 하라’로 옮길 수 있습니다. 문맥에 따라 ‘장대에 꿰뚫어 달게 하라’로 이해할 수도 있습니다. 히브리어는 문자적으로 ‘나무/목재에’라고 하며, 문맥상 처형용 구조물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  english_pob_choice: If it pleases the king
  chosen_korean: 왕께서 좋게 여기신다면
  alternatives_korean:
