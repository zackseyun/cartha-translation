  lexicon: HALOT
  rationale: 왕에게 올리는 궁정식 청원 표현으로서, 단순한 도덕적 ‘좋음’보다 왕의 승낙과 호의를 드러내는 한국어가 자연스럽습니다.
- source_word: יִנָּתֵן
  english_pob_choice: let it be granted
  chosen_korean: 허락해 주시고
  alternatives_korean:
