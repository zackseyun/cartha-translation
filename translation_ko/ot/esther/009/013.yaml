  - 허가해 주시고
  - 허락되게 해 주시고
  lexicon: HALOT
  rationale: 수동-사역적 요청을 한국어 청원문으로 옮겨, 공식적 승인이라는 뉘앙스를 살렸습니다.
- source_word: כְּדָת הַיּוֹם
  english_pob_choice: according to today’s decree
  chosen_korean: 오늘의 법에 따라
  alternatives_korean:
  - 오늘의 법령에 따라
  - 오늘의 조서에 따라
  - 오늘의 칙령에 따라
  lexicon: HALOT
  rationale: 에스더서의 דָּת는 왕실의 공식 규정/법령을 가리키므로, ‘법’으로 직역하되 문맥상 공식성을 유지했습니다.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  english_pob_choice: Haman’s ten sons
  chosen_korean: 하만의 열 아들
  alternatives_korean:
  - 하만의 열 아들들
  - 하만의 열 명의 아들
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 한국어 소유 표현으로 옮겼습니다.
- source_word: יִתְלוּ עַל־הָעֵץ
  english_pob_choice: be hanged on the gallows
  chosen_korean: 나무에 매달게 해 주십시오
  alternatives_korean:
  - 목에 매달게 해 주십시오
  - 기둥에 매달게 해 주십시오
  - 나무/목재에 매달게 해 주십시오
  lexicon: HALOT
  rationale: עֵץ의 기본 의미인 ‘나무/목재’를 보존하면서도, 본문이 가리키는 처형 구조를 과도하게 특정하지 않도록 했습니다.
theological_decisions:
- issue: עֵץ의 형벌 이미지와 번역의 구체성
  chosen_reading: ‘나무에 매달게 해 주십시오’로 옮겨, 본문의 물질적 표현을 유지하되 처형 방식의 세부는 열어 두었습니다.
  alternative_readings:
  - ‘교수대에 매달게 해 주십시오’
  - ‘장대에 매달게 해 주십시오’
  - ‘나무에 달게 해 주십시오’
  rationale: 히브리어는 문자적으로 ‘나무/목재 위에’라고 말하며, 문맥상 처형 도구를 가리키지만 정확한 형태를 더 단정적으로 고정할 근거는 본문 자체에 제한적입니다.
  doctrine_reference: source transparency / lexical caution
