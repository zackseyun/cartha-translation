base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
  footnotes:
  - marker: a
    text: Or, 'be hung on the tree' or 'be impaled on the stake.' The Hebrew literally says 'on the wood/tree,' which in context refers to an execution structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더가 말했습니다. 「왕께서 좋게 여기신다면, 오늘의 법에 따라 행하도록 수산에 있는 유다인들에게도 내일 또한 허락해 주시고, 하만의 열 아들을 나무에 매달게 해 주십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나무에 매달리게 하라’, ‘기둥에 꿰뚫리게 하라’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘나무/목재 위에’라고 하며, 문맥상 처형용 구조물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  english_pob_choice: If it pleases the king
  chosen_korean: 왕께서 좋게 여기신다면
  alternatives_korean:
