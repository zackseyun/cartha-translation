  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
  footnotes:
  - marker: a
    text: Or 'with all authority' or 'with full force.' The Hebrew expression emphasizes the official forcefulness of the letter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에스더 왕비, 곧 아비하일의 딸인 에스더와 유다인 모르드개가 이 두 번째 부림절 서신을 확정하려고 온전한 권위를 가지고 썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온전한 효력을 가지고’, ‘모든 권한을 가지고’. 히브리어 표현은 이 서신의 공식적인 권위와 효력을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: Esther the queen
  chosen_korean: 에스더 왕비
  alternatives_korean:
  - 왕비 에스더
