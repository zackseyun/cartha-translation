  to: 그때 에스더 왕비, 곧 아비하일의 딸인 에스더와 유다인 모르드개가 이 두 번째 부림절 서신을 확정하려고 온전한 권위를 가지고 썼습니다.[a]
  rationale: 인물 식별의 동격을 ‘곧 아비하일의 딸인 에스더’로 명료하게 했고, 민족 표지는 자연스러운 ‘유다인’으로 다듬었습니다. תֹּקֶף는 본문에서 ‘온전한 권위’로 번역하되, 각주에서 권위·효력·권한의 의미 범위를 제시했습니다. ‘확정하려고’와 ‘두 번째 부림절 서신’은 원문의 목적과 수식 관계를 유지합니다.
