source:
  edition: WLC
  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
  footnotes:
  - marker: a
    text: Or 'with all authority' or 'with full force.' The Hebrew expression emphasizes the official forcefulness of the letter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에스더 왕비, 아비하일의 딸, 그리고 유다 사람 모르드개가 이 두 번째 부림절 서신을 확정하려고 온전한 권한으로 글을 썼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶסְתֵּר הַמַּלְכָּה
  english_pob_choice: Esther the queen
  chosen_korean: 에스더 왕비
  alternatives_korean:
  - 왕비 에스더
  - 에스더 여왕
  lexicon: HALOT
  rationale: 히브리어의 동격 표현을 자연스럽게 살리되, 현대 한국어에서 가장 직접적이고 품위 있는 호칭으로 옮겼습니다.
- source_word: בַת אֲבִיחַיִל
  english_pob_choice: daughter of Abihail
  chosen_korean: 아비하일의 딸
  alternatives_korean:
  - 아비하일의 딸인
  - 아비하일의 딸로
  lexicon: HALOT
  rationale: 계보적 식별표현이므로 보존적으로 옮겨, 본문의 인물 확인 기능을 유지했습니다.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  english_pob_choice: and Mordecai the Jew
  chosen_korean: 유다 사람 모르드개
  alternatives_korean:
  - 유대인 모르드개
  - 유대 사람 모르드개
  lexicon: HALOT
  rationale: 에스더서에서 יהודי는 민족적 정체성을 가리키는 말로 쓰이므로, 전통적 교회어감보다 स्रोत의 민족 표지를 드러내는 표현을 택했습니다.
- source_word: אֶת כָּל תֹּקֶף
  english_pob_choice: with full authority
  chosen_korean: 온전한 권한으로
  alternatives_korean:
  - 완전한 권위로
  - 모든 권한을 가지고
  lexicon: HALOT
  rationale: תֹקֶף의 핵심은 힘 자체보다 공문서의 공식적 효력과 권한이므로, ‘권한’으로 옮겨 문맥의 행정적 무게를 살렸습니다.
- source_word: לְקַיֵּם
  english_pob_choice: to confirm
  chosen_korean: 확정하려고
  alternatives_korean:
  - 확인하려고
  - 확립하려고
  lexicon: HALOT
  rationale: 이미 선포된 부림절 관련 서신을 다시 공식화하는 맥락이므로, 단순 확인보다 제도의 효력을 굳히는 뜻이 드러나는 ‘확정하다’를 택했습니다.
- source_word: אֵת אִגֶּרֶת הַפּוּרִים
  english_pob_choice: this second letter of Purim
  chosen_korean: 이 두 번째 부림절 서신
  alternatives_korean:
  - 이 부림절의 두 번째 서신
  - 이 두 번째 부림절 편지
  lexicon: HALOT
  rationale: איגרת은 공적 문서 성격이 강한 ‘서신’이 적절하며, 부림절과의 속격 관계도 한국어에서 자연스럽게 반영했습니다.
theological_decisions:
- issue: 공식 문서의 효력과 ‘온전한 권한’의 뉘앙스
  chosen_reading: 본문의 תֹּקֶף을 행정적·공적 효력을 지닌 권한으로 이해해 ‘온전한 권한’으로 옮겼습니다.
  alternative_readings:
  - ‘온전한 힘으로’
  - ‘모든 권위로’
  rationale: 문맥은 물리적 힘이 아니라 왕실 문서의 공식성과 구속력을 말하므로, 서신의 법적 효력을 드러내는 번역이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 성경 본문의 역사·행정적 맥락을 존중하는 번역 원칙
