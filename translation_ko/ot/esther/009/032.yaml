  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
  footnotes:
  - marker: a
    text: Or 'the words of these Purim observances.' Hebrew 'words' can also mean 'matters' or 'affairs' in administrative contexts.
