  - marker: b
    text: Or 'and it was recorded in the book.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에스더의 명령이 이들 부림절의 일들을 확정하였고, 그것이 책에 기록되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘말들’은 행정 문맥에서 ‘일들’, ‘사항들’, ‘업무’의 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘책에 기록되었고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר אֶסְתֵּר
  english_pob_choice: Esther’s command
  chosen_korean: 에스더의 명령
  alternatives_korean:
  - 에스더의 말
  - 에스더의 칙령
  - 에스더의 지시
  lexicon: HALOT
  rationale: מַאֲמַר은 단순한 ‘말’보다 공식적 권위를 지닌 발화를 가리키므로, 문맥상 행정적 효력을 살리는 ‘명령’이 가장 자연스럽습니다.
- source_word: קִיַּם
  english_pob_choice: confirmed
  chosen_korean: 확정하였고
  alternatives_korean:
  - 확인하였고
  - 확립하였고
  - 인준하였고
  lexicon: HALOT
  rationale: 동사는 어떤 일을 서 있게 하여 확정시키는 뜻이므로, 부림절 준수 사항을 제도적으로 굳힌 뉘앙스를 살린 ‘확정하다’가 적절합니다.
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  english_pob_choice: these matters of Purim
  chosen_korean: 이들 부림절의 일들
  alternatives_korean:
  - 이들 부림절의 사항들
  - 이 부림절의 문제들
  - 이 부림절의 말들
  lexicon: HALOT
  rationale: דִּבְרֵי는 여기서 문자 그대로의 ‘말’보다 관련된 사항·일들을 뜻하므로, POB의 ‘matters’에 맞춰 ‘일들’로 옮겼습니다. ‘이들’은 히브리어 지시어를 반영합니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in the book
  chosen_korean: 책에
  alternatives_korean:
  - 기록에
  - 두루마리에
  - 서책에
  lexicon: HALOT
  rationale: סֵפֶר은 책·두루마리·기록을 모두 가리킬 수 있지만, 본문 자체가 특정 대상을 밝히지 않으므로 과도하게 특정하지 않는 ‘책’이 가장 무난합니다.
theological_decisions:
- issue: 부림절 제정/공인 표현의 강도
  chosen_reading: 에스더의 명령이 부림절 준수의 내용을 확정한 것으로 번역했습니다.
  alternative_readings:
  - 에스더의 말이 이 일을 유지하였다
  - 에스더의 명령이 이 일들을 세웠다
  rationale: 본문은 단순 서술이 아니라 축제를 공식적으로 제도화하는 행정적 성격을 띠므로, 그 권위를 약화시키지 않도록 했습니다.
  doctrine_reference: 성경 본문 자체의 역사·행정적 의미 보존
