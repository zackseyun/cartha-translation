    rationale: ‘기억’이 단순한 내적 회상이 아니라 공동체가 이어 가는 절기 기념을 포함한다는 설명은 가능한 이해이지만, 본문 자체의 어휘 의미를 넘어 해설적 대조를 도입합니다. 필요한 어휘·문법 각주만 남기는 편이 적절합니다.
