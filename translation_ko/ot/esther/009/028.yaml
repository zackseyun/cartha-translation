id: EST.9.28
reference: Esther 9:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
  footnotes:
  - marker: a
    text: Or 'are remembered and kept.' The Hebrew verb rendered 'observed' is literally 'done/made' and refers to carrying out the festival in practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'from generation to generation, family by family, province by province, and city by city.' The Hebrew uses repeated singular nouns for distributive emphasis.
    reason: lexical_alternative
  - marker: c
    text: Or 'their remembrance shall not cease from their descendants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 날들은 모든 세대마다, 모든 가문마다, 모든 지방마다, 모든 성읍마다 기억되고 지켜집니다. 그리고 이 부림의 날들은 유대인들 가운데서 사라지지 않을 것이며, 그들의 기억도 그 자손에게서 끊어지지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 반복된 단수형으로 ‘세대마다, 가문마다, 지방마다, 성읍마다’라는 분배적 강조를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘지켜집니다’는 직역 ‘행해집니다’보다 절기 준수의 실제적 이행을 자연스럽게 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기억’은 여기서 단순한 내적 회상이 아니라 공동체가 이어 가는 절기 기념의 뜻을 포함합니다.
    reason: theological_note
lexical_decisions:
- source_word: נִזְכָּרִים
  english_pob_choice: are remembered
  chosen_korean: 기억되고
  alternatives_korean:
  - 기념되고
  - 기억됩니다
  lexicon: HALOT
  rationale: 반복적·공동체적 기억의 뜻을 살리되, 다음 동사와의 병렬을 위해 간결하게 ‘기억되고’로 옮겼습니다.
- source_word: וְנַעֲשִׂים
  english_pob_choice: and observed
  chosen_korean: 지켜집니다
  alternatives_korean:
  - 행해집니다
  - 실행됩니다
  - 준수됩니다
  lexicon: HALOT
  rationale: 직역하면 ‘행해집니다’이지만, 절기 준수의 실제적 이행을 드러내는 동사로 ‘지켜집니다’를 택했습니다.
- source_word: בְּכָל דּוֹר וָדוֹר / מִשְׁפָּחָה וּמִשְׁפָּחָה / מְדִינָה וּמְדִינָה / וְעִיר וָעִיר
  english_pob_choice: in every generation, every family, every province, and every city
  chosen_korean: 모든 세대마다, 모든 가문마다, 모든 지방마다, 모든 성읍마다
  alternatives_korean:
  - 세대마다, 가문마다, 지방마다, 성읍마다
  - 각 세대마다, 각 가문마다, 각 지방마다, 각 성읍마다
  lexicon: HALOT
  rationale: 히브리어의 반복된 단수형이 분배적 의미를 주므로, 한국어에서도 ‘마다’를 반복해 범위를 분명히 했습니다.
- source_word: יְמֵי הַפּוּרִים
  english_pob_choice: days of Purim
  chosen_korean: 부림의 날들
  alternatives_korean:
  - 부림절의 날들
  - 부림의 절기
  lexicon: HALOT
  rationale: 축제명 ‘부림’을 음역으로 유지하고, 소유/관계 구조는 ‘의 날들’로 반영했습니다.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  english_pob_choice: shall not pass away from among the Jews
  chosen_korean: 유대인들 가운데서 사라지지 않을 것이며
  alternatives_korean:
  - 유대인들 가운데서 지나가지 않을 것이며
  - 유대인들 사이에서 없어지지 않을 것이며
  lexicon: HALOT
  rationale: ‘통과하다’의 문자성을 지나치게 살리기보다 공동체 안에서 절기가 소멸되지 않는다는 의미를 자연스럽게 드러냈습니다.
- source_word: וְזִכְרָם לֹא יָסוּף מִזַּרְעָם
  english_pob_choice: and their remembrance shall not cease from their offspring
  chosen_korean: 그들의 기억도 그 자손에게서 끊어지지 않을 것입니다
  alternatives_korean:
  - 그들의 기억도 그 후손에게서 사라지지 않을 것입니다
  - 그들의 기념도 그 자손에게서 끊어지지 않을 것입니다
  lexicon: HALOT
  rationale: זִכְרָם은 공동체가 이어 가는 ‘기억/기념’을 가리키므로, 문맥상 자연스러운 ‘기억’으로 두고 세대 지속성을 ‘그 자손에게서’로 옮겼습니다.
theological_decisions:
- issue: 절기의 지속성과 공동체 정체성
  chosen_reading: 부림의 날들이 유대인 공동체 안에서 세대·가문·지방·성읍을 가로질러 계속 기억되고 준수된다는 선언으로 옮겼습니다.
  alternative_readings:
  - 단순히 역사적 사실 진술로 축소하는 번역
  - 예전적·교회적 표현으로 일반화하는 번역
  rationale: 본문은 절기 관행의 지속을 규범적으로 선언하므로, 공동체적·세대적 지속성을 분명히 드러내는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 공동체 기억과 언약적 정체성의 지속
- issue: ‘זַרְעָם’의 번역
  chosen_reading: ‘그 자손’으로 번역해 혈통적 후속 세대를 분명히 했습니다.
  alternative_readings:
  - ‘그 씨’로 직역하는 방식
  - ‘그 후손’으로 풀어 쓰는 방식
  rationale: 히브리어 ‘씨/자손’의 비유를 한국어에서 자연스럽게 전달하면서도, 출생 계승의 의미를 분명히 하기 위해 ‘자손’을 택했습니다.
  doctrine_reference: 세대 간 계승과 기억의 전승
