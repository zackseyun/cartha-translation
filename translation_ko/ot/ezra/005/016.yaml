base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
  footnotes:
  - marker: a
    text: Or, more formally, 'set the foundations.' The Aramaic idiom is literally 'gave foundations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it is being built'; the Aramaic verb can be rendered as an ongoing passive process.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이 스룹바벨이 와서 예루살렘에 있는 하나님의 집의 기초를 놓았습니다[a]. 그리고 그때부터 지금까지 그것은 계속 지어지고 있지만[b], 아직 완공되지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기초를 주었다’입니다. 아람어 관용구를 한국어 자연어로 옮겨 ‘기초를 놓았습니다’로 풀었습니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어 동사는 지속적 수동/진행의 뜻을 가질 수 있어, ‘계속 지어지고 있지만’으로 옮길 수 있습니다.
    reason: lexical_alternative
