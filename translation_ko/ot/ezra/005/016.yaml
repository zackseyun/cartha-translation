  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
  footnotes:
  - marker: a
    text: Or, more formally, 'set the foundations.' The Aramaic idiom is literally 'gave foundations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it is being built'; the Aramaic verb can be rendered as an ongoing passive process.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 이 세스바살이 와서 예루살렘에 있는 하나님의 집의 기초를 놓았습니다[a]. 그때부터 지금까지 그 집은 지어지고 있으나[b], 아직 완공되지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기초들을 주었다’입니다. 아람어 관용구를 한국어로 자연스럽게 옮겨 ‘기초를 놓았습니다’로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어 동사는 수동의 진행·지속 과정을 나타낼 수 있습니다. ‘지어지고 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
