- from: 왕에게 알리시기 바랍니다. 우리가 유다 지방으로, 곧 그 큰 하나님의 집으로 갔습니다. 그곳은 큰 돌들로 지어지고 있으며, 나무는 성벽에 놓이고 있습니다. 이 일은 부지런히 진행되고 있으며, 그들의 손에서 번성하고 있습니다.[a][b]
