  source_fidelity: ‘성벽’은 성곽을 뜻하므로, 건물의 벽을 가리키는 아람어 כֻתְלַיָּא에 맞지 않습니다. 또한 ‘그들의 손에서 번성하고 있습니다’는 원문의 관용적 성공·순조로운 진행의 뜻을 한국어에서 부자연스럽게 직역한 것입니다. 두 각주는 각각 해당 어구에 직접 붙여야 합니다.
