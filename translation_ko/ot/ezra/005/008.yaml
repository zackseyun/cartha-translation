  text: יְדִ֣יעַ לֶהֱוֵ֣א לְ/מַלְכָּ֗/א דִּֽי אֲזַ֜לְנָא לִ/יה֤וּד מְדִֽינְתָּ/א֙ לְ/בֵית֙ אֱלָהָ֣/א רַבָּ֔/א וְ/ה֤וּא מִתְבְּנֵא֙ אֶ֣בֶן גְּלָ֔ל וְ/אָ֖ע מִתְּשָׂ֣ם בְּ/כֻתְלַיָּ֑/א וַ/עֲבִ֥ידְתָּ/א דָ֛ךְ אָסְפַּ֥רְנָא מִתְעַבְדָ֖א וּ/מַצְלַ֥ח בְּ/יֶדְ/הֹֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
  footnotes:
  - marker: a
    text: Or 'with great stones.' The Aramaic phrase may refer generally to very large building stones.
    reason: lexical_alternative
  - marker: b
    text: Or 'carefully' or possibly 'rapidly' for 'diligently.' The adverb's nuance is debated, but it clearly describes the work as proceeding effectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕에게 알리시기 바랍니다. 우리가 유다 지방으로, 곧 그 큰 하나님의 집으로 갔습니다. 그곳은 큰 돌들로 지어지고 있으며, 나무는 성벽에 놓이고 있습니다. 이 일은 부지런히 진행되고 있으며, 그들의 손에서 번성하고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 돌들’은 매우 큰 축조용 돌들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부지런히’는 ‘조심스럽게’ 또는 ‘신속하게’로도 옮길 수 있으나, 여기서는 일이 효과적으로 진행된다는 뜻이 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  english_pob_choice: Let it be known
  chosen_korean: 알리시기 바랍니다
  alternatives_korean:
  - 알려지게 하십시오
  - 알려지기를 바랍니다
  lexicon: HALOT
  rationale: 아람어의 공식 보고 서두를 한국어 공문체의 정중한 요청으로 살려, 단순 서술보다 행정적·보고적 register를 유지했습니다.
- source_word: לְמַלְכָּא
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 임금에게
  - 왕 앞에
  lexicon: HALOT
  rationale: 보고의 수신자를 나타내는 여격으로 자연스럽게 옮겼습니다.
- source_word: אֶבֶן גְּלָל
  english_pob_choice: with huge stones
  chosen_korean: 큰 돌들
  alternatives_korean:
  - 거대한 돌들
  - 대형 돌들
  lexicon: HALOT
  rationale: 문맥상 매우 큰 축조용 돌을 가리키므로, 너무 과장되지 않으면서도 원문의 규모감을 살리는 표현을 택했습니다.
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  english_pob_choice: and timber is being laid in the walls
  chosen_korean: 나무는 성벽에 놓이고 있습니다
  alternatives_korean:
  - 재목은 성벽에 놓이고 있습니다
  - 목재가 성벽에 끼워지고 있습니다
  lexicon: HALOT
  rationale: אָע는 건축 재료로서의 목재를 가리키므로 나무보다 조금 더 구체적인 '재목/목재'가 가능하지만, 한국어 문장에서는 '나무'가 원문 대비 과도한 기술성을 피하면서도 의미를 전달합니다.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  english_pob_choice: and is prospering in their hands
  chosen_korean: 그들의 손에서 번성하고 있습니다
  alternatives_korean:
  - 그들의 손에서 잘되고 있습니다
  - 그들의 손에서 성공적으로 진행되고 있습니다
  lexicon: HALOT
  rationale: 히브리계 아람어의 관용구를 직역에 가깝게 살려, 단순한 '진행'보다 성공과 번영의 뉘앙스를 보존했습니다.
