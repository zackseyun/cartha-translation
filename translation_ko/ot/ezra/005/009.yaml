  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
  footnotes:
  - marker: a
    text: Or “this house and this structure,” preserving the more literal wording; “house” refers to the temple.
    reason: lexical_alternative
  - marker: b
    text: The Aramaic term rendered “structure” may refer more specifically to the building’s fabric, framework, or associated construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리는 그 장로들에게 물어 다음과 같이 말했습니다. “누가 여러분에게 이 집을 짓고 이 건축물을 완공하라고 명령을 내렸습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이 집”은 문자적으로는 ‘집’이지만, 에스라서에서는 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: “건축물”은 원문의 드문 아람어 표현을 넓게 옮긴 것으로, 더 구체적으로는 건물의 구조·골조나 관련 건축 부분을 가리킬 수 있습니다.
    reason: lexical_alternative
