id: EZR.5.1
reference: Ezra 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Now Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Aramaic term can denote the Jewish people or, more geographically, the people of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the authority of the God of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 학개 선지자와 잇도의 아들 스가랴, 곧 그 선지자들이 유다와 예루살렘에 있는 유다 사람들에게, 이스라엘의 하나님 이름으로 그들을 향하여 예언하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְנַבִּי
  english_pob_choice: Now ... prophesied
  chosen_korean: 예언하였습니다
  alternatives_korean:
  - 그리고 예언하였습니다
  - 예언하기 시작했습니다
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 옮기되, נבא의 예언 행위를 분명히 드러내기 위해 평서 과거형으로 옮겼습니다.
- source_word: נביא / נביאיא
  english_pob_choice: the prophet / the prophets
  chosen_korean: 선지자
  alternatives_korean:
  - 예언자
  - 선견자
  lexicon: HALOT
  rationale: 학개와 스가랴를 지칭하는 호칭이므로 한국어 성경에서 널리 통용되는 ‘선지자’를 사용해 본문의 병렬 구조를 살렸습니다.
- source_word: יְהוּדָיֵא
  english_pob_choice: the Jews / the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 포로귀환 공동체의 민족·지역적 뉘앙스를 함께 살리기 위해 ‘유다 사람들’로 옮겼습니다.
- source_word: בְּשֻׁם אֱלָהּ יִשְׂרָאֵל
  english_pob_choice: in the name of the God of Israel
  chosen_korean: 이스라엘의 하나님 이름으로
  alternatives_korean:
  - 이스라엘의 하나님의 이름으로
  - 이스라엘의 하나님의 권위로
  lexicon: HALOT
  rationale: ‘이름으로’는 대표·대리·권위의 관용구를 자연스럽게 담으며, 본문의 예언이 하나님의 권위 아래 이루어졌음을 보존합니다.
- source_word: עֲלֵיהוֹן
  english_pob_choice: who was over them
  chosen_korean: 그들을 향하여
  alternatives_korean:
  - 그들 위에
  - 그들 위에 계신
  lexicon: HALOT
  rationale: 영어 POB의 문맥상 ‘prophesied to’와 긴밀히 연결되는 방향성을 살리되, 하나님의 주권적 임재를 너무 설명적으로 풀지 않기 위해 간결하게 처리했습니다.
theological_decisions:
- issue: 마지막 구절의 עֲלֵיהוֹן을 어떻게 이해할지
  chosen_reading: 예언의 대상과 하나님의 주권적 임재를 함께 암시하는 표현으로 보고, 한국어 본문에서는 ‘그들을 향하여’로 간결하게 옮겼습니다.
  alternative_readings:
  - ‘그들 위에 계신’처럼 하나님이 그들 위에 계신다는 뜻을 더 직접적으로 드러낼 수 있습니다.
  - ‘그들 위에’로 더 직역할 수도 있습니다.
  rationale: 문맥상 예언 대상은 분명하지만, 접미대명사의 방향성과 하나님의 위계적 권위를 과도하게 해석하지 않도록 균형을 택했습니다.
  doctrine_reference: 하나님의 주권과 예언의 권위
