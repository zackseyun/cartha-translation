    rationale: 이 표현은 가장 자연스럽게 ‘이스라엘의 하나님’을 수식하며, 하나님께서 그들 위에 계심/그들을 다스리심을 나타냅니다. 예언 대상은 이미 עַל יְהוּדָיֵא로 표현되어 있으므로 ‘그들을 향하여’는 중복일 뿐 아니라 종결구의 의미를 변경합니다.
