  source_fidelity: 개역 초안은 동사와 인명, 지명, 예언자 호칭을 대체로 충실히 옮겼습니다. 그러나 문두의 ‘이제’는 아람어 접속사에 명시된 시간 부사가 없고 영어 POB도 이를 삭제했으므로 삭제하는 것이 낫습니다. 더 중요하게는 עֲלֵיהוֹן은 ‘그들을 향하여’가 아니라 ‘그들 위에 계신’ 이스라엘의 하나님을 수식하는 표현입니다. 초안은 이를 예언의 방향으로 중복시켜 종결구의 의미를 바꾸었습니다.
  naturalness: ‘학개 선지자와 잇도의 아들 스가랴, 곧 그 선지자들이’는 호응이 다소 어색합니다. ‘곧 이 두 선지자가’로 풀면 복수 apposition을 자연스러운 현대 합쇼체 문장으로 보존합니다. ‘그들 위에 계신 이스라엘의 하나님의 이름으로’는 수식 관계도 분명합니다.
  terminology: ‘선지자’, ‘유다’, ‘예루살렘’, ‘이스라엘의 하나님’은 한국어 성경 문맥에서 자연스럽고 적절합니다. יְהוּדָיֵא의 민족적·지리적 범위를 보존하기 위해 본문은 ‘유다 사람들’을 유지하고 ‘유대인들’을 각주 대안으로 제시합니다. בְּשֻׁם의 ‘이름으로’에는 권위·대표의 의미가 있으므로 해당 대안을 각주로 둡니다.
  issues:
