lexical_decisions:
- source_word: אֱדַיִן כְּנֵמָא
  english_pob_choice: Then we told them this
  chosen_korean: 그러자 우리는 그들에게 이렇게 말했습니다
  alternatives_korean:
  - 그때 우리는 그들에게 이렇게 말했습니다
  - 그러고 나서 우리는 그들에게 이렇게 말했습니다
  lexicon: HALOT
  rationale: 시간적·서술적 연결을 한국어 담화 흐름에 맞게 ‘그러자’와 ‘이렇게’로 자연스럽게 풀되, 직설 인용을 앞두고 원문의 ‘이렇게’ 기능을 살렸습니다.
- source_word: אֲמַרְנָא לְּהֹם
  english_pob_choice: we told them
  chosen_korean: 우리는 그들에게 말했습니다
  alternatives_korean:
  - 우리는 그들에게 전했습니다
  - 우리는 그들에게 물었습니다
  lexicon: HALOT
  rationale: 동사는 단순히 ‘말하다’이지만, 목적어가 있는 직접 화법 도입으로 한국어에서는 ‘그들에게 말했습니다’가 가장 무난하며, ‘물었습니다’보다 원문 동사를 더 가깝게 보존합니다.
- source_word: מַן אִנּוּן שְׁמָהָת גֻּבְרַיָּא
  english_pob_choice: What are the names of the men
  chosen_korean: 이 건물을 짓고 있는 사람들의 이름은 무엇입니까
  alternatives_korean:
  - 그 남자들의 이름은 무엇입니까
  - 이 일을 하는 사람들의 이름은 무엇입니까
  lexicon: HALOT
  rationale: ‘이 건물’은 뒤의 지시사와 명사에 맞춰 자연스럽게 옮겼고, ‘men’은 여기서 성별이 분명한 남성 집단을 가리키므로 ‘사람들’보다 ‘사람들의 이름’으로 부드럽게 처리하되 원문의 질문 초점을 유지했습니다.
- source_word: דִּי ... בָּנַיִן
  english_pob_choice: who are building
  chosen_korean: 짓고 있는
  alternatives_korean:
  - 건축하고 있는
  - 세우고 있는
  lexicon: HALOT
  rationale: 진행형 분사 의미를 한국어 관형절 ‘짓고 있는’으로 옮겨 현재 진행 중인 행위를 반영했습니다.
