base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
  footnotes:
  - marker: a
    text: Or "the Afarsachites," if the term is taken as the name of a people or administrative group rather than a functional title.
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 다르იოს 왕에게 보낸 편지의 사본입니다. 강 저편의 총독 다드내와 셋르-보즈내와 그의 동료들, 곧 강 저편에 있던 관리들이 보낸 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  english_pob_choice: copy
  chosen_korean: 사본
  alternatives_korean:
  - 복사본
  - 원문 사본
  lexicon: HALOT
  rationale: 문서 서두의 פַּרְשֶׁגֶן은 원문 자체가 아니라 ‘편지의 사본’을 가리키므로, 한국어에서는 행정 문서 문맥에 자연스러운 ‘사본’이 가장 정확합니다.
- source_word: אִגַּרְתָּא
  english_pob_choice: letter
  chosen_korean: 편지
  alternatives_korean:
  - 서신
  - 문서
  lexicon: HALOT
  rationale: 공식적인 서면 교신이지만, 한국어에서는 이 문맥의 수신·발신 관계를 가장 분명하게 드러내는 ‘편지’가 적절합니다.
- source_word: פַּחַת
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지사
  - 부총독
  lexicon: HALOT
  rationale: 아람어 행정 용어 פַּחַת은 지역 통치자를 가리키며, 한국어 성경 용례와 행정적 뉘앙스를 함께 살리기 위해 ‘총독’으로 옮겼습니다.
- source_word: עֲבַר נַהֲרָה
  english_pob_choice: Beyond the River
  chosen_korean: 강 저편
  alternatives_korean:
  - 강 건너편
  - 유브라데 강 너머
  lexicon: HALOT
  rationale: 페르시아 행정구역 명칭을 한국어로는 지리 설명처럼 풀어 ‘강 저편’으로 옮기되, 지역명 자체라는 점을 유지했습니다.
- source_word: אֲפַרְסְכָיֵא
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 아파르스카인
  - 관료들
  lexicon: HALOT
  rationale: 이 용어는 민족명인지 관직명인지가 불확실하므로, POB의 기능적 해석을 따라 문맥상 역할을 드러내는 ‘관리들’로 처리했습니다.
