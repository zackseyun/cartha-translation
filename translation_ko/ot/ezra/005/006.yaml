review_pass:
  verdict: revise
  source_fidelity: 원문의 문서 표제 구조와 발신자 목록은 대체로 반영했으나, 인명 표기와 수신자 이름에 명백한 오류가 있습니다. 특히 ‘다르იოს’는 한국어 표기가 아니며, 원문 아람어의 다리오 왕을 정확히 옮겨야 합니다. אֲפַרְסְכָיֵא는 의미가 불확실하므로 기능적으로 ‘관리들’로 번역할 경우 그 불확실성을 각주로 밝혀야 합니다.
  naturalness: 현대 표준 한국어 합쇼체로 ‘이것은 … 보낸 편지의 사본입니다’는 자연스럽습니다. 다만 발신자들을 먼저 제시한 뒤 동사를 배치하면 원문의 수식 관계가 더 명료해집니다.
  terminology: פַּרְשֶׁגֶן의 ‘사본’, פַּחַת의 ‘총독’, עֲבַר נַהֲרָה의 ‘강 저편’은 적절합니다. 통용 성경식 음역을 따라 Tattenai, Shethar-bozenai, Darius는 각각 ‘닷드내’, ‘스달보스내’, ‘다리오’로 바로잡는 것이 좋습니다. 아파르스카이아는 민족명 또는 행정 집단명일 수 있으므로 ‘관리들’이라는 기능적 번역에 대안 각주가 필요합니다.
  issues:
  - severity: high
    issue: ‘다르იოს’는 한글 표기가 아니며 다리오의 이름이 잘못 표기되었습니다.
    rationale: דָּרְיָוֶשׁ מַלְכָּא는 ‘다리오 왕’입니다. 혼입된 비한글 문자는 독해와 명칭 정확성을 모두 해칩니다.
  - severity: medium
    issue: 다드내와 셋르-보즈내의 음역이 통용 한국어 성경 표기와 어긋납니다.
    rationale: 원문의 인명을 현대 한국어 성경 독자가 식별할 수 있도록 ‘닷드내’, ‘스달보스내’로 표기하는 것이 적절합니다.
  - severity: medium
    issue: ‘관리들’은 불확실한 אֲפַרְסְכָיֵא의 기능적 해석이지만, 이를 알리는 각주가 없습니다.
    rationale: 이 단어는 민족명·집단명·직능 명칭으로 분석될 여지가 있으므로, 본문에서 한 해석을 채택하더라도 대안 독법을 각주로 보존해야 합니다.
  revised_text: 이것은 강 저편의 총독 닷드내와 스달보스내와 그의 동료들, 곧 강 저편에 있는 관리들이 다리오 왕에게 보낸 편지의 사본입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘아파르스카이 사람들’. 이 말은 민족명이나 행정 집단의 이름일 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 수신자 이름의 표기 오류를 ‘다리오’로 바로잡고, 인명 음역을 통용 한국어 성경 표기에 맞추었습니다. 원문의 발신자 열거와 ‘강 저편’이라는 행정 지역 명칭을 유지했습니다. 아파르스카이아의 의미가 확정되지 않으므로 본문에서는 영어 POB의 기능적 해석인 ‘관리들’을 따르되, 대안인 집단명을 각주로 보존했습니다.
