  text: וְ/אַ֧ף שְׁמָהָתְ/הֹ֛ם שְׁאֵ֥לְנָא לְּ/הֹ֖ם לְ/הוֹדָעוּתָ֑/ךְ דִּ֛י נִכְתֻּ֥ב שֻׁם גֻּבְרַיָּ֖/א דִּ֥י בְ/רָאשֵׁי/הֹֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to inform you' for 'so as to make them known to you.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'who were at their head'; that is, the leading men among them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 우리는 임금님께 알려 드리고자 그들에게 그들의 이름을 물었습니다. 곧 그들 가운데 우두머리인 사람들의 이름을 기록하려고 한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף
  english_pob_choice: We also
  chosen_korean: 우리도
  alternatives_korean:
  - 우리는 또한
  - 그리고 또한
  lexicon: HALOT
  rationale: 추가 항목을 덧붙이는 접속·부사 기능을 살려 ‘우리도’로 옮기면 자연스럽고, 앞선 보고에 항목을 더하는 뉘앙스도 유지됩니다.
- source_word: שְׁמָהָתְהֹם
  english_pob_choice: their names
  chosen_korean: 그들의 이름
  alternatives_korean:
  - 그 이름들
  - 그들의 명칭
  lexicon: HALOT
  rationale: 3인칭 복수 접미사가 붙은 명사구이므로 단순하고 직접적으로 ‘그들의 이름’이 가장 정확합니다.
- source_word: לְהוֹדָעוּתָךְ
  english_pob_choice: to make them known to you
  chosen_korean: 당신에게 알려 드리기 위해서
  alternatives_korean:
  - 당신에게 알리기 위해서
  - 당신이 알게 하려고
  lexicon: HALOT
  rationale: ידע의 사역형 목적을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘알려 드리다’이며, 왕에게 보고하는 문맥도 잘 반영합니다.
- source_word: דִּי בְרָאשֵׁיהֹם
  english_pob_choice: who were at their head
  chosen_korean: 그들 가운데 우두머리였던 사람들
  alternatives_korean:
  - 그들 앞에 선 사람들
  - 그들 머리 위에 있던 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 머리들 위에/앞에’라는 관용구이지만, 문맥상 무리를 이끄는 사람들을 뜻하므로 그 은유를 풀어 ‘우두머리였던 사람들’로 옮겼습니다.
theological_decisions:
- issue: 아람어 관용구 דִּי בְרָאשֵׁיהֹם의 처리
  chosen_reading: 직접 ‘머리 위에’로 옮기지 않고, 의미를 풀어 ‘우두머리였던 사람들’로 제시했습니다.
  alternative_readings:
  - 그들 위에 있던 사람들
  - 그들 앞머리에 있던 사람들
  rationale: 이 표현은 단순한 위치가 아니라 지도·대표성을 가리키는 관용구이므로, 한국어 독자가 실제 의미를 바로 이해하도록 풀어 쓰되 원문의 지배적 의미를 보존했습니다.
  doctrine_reference: 본문 의미론·관용구 처리
