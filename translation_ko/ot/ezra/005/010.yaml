revisions:
- from: 우리는 그들의 이름도 물었습니다[a]. 그것을 당신에게 알려 드리기 위해서입니다[b]. 그래서 우리는 그들의 이름, 곧 그들 가운데 우두머리였던 사람들의 이름을 적으려 했습니다.
  to: 또한 우리는 임금님께 알려 드리고자 그들에게 그들의 이름을 물었습니다. 곧 그들 가운데 우두머리인 사람들의 이름을 기록하려고 한 것입니다.
  rationale: 원문의 목적 관계를 ‘알려 드리고자’와 ‘기록하려고’로 보존하고, 왕에게 보내는 공식 보고라는 문맥에 맞게 수신자를 ‘임금님’으로 밝혔습니다. 지도자를 가리키는 아람어 관용구는 교리적 해석을 더하지 않고 ‘그들 가운데 우두머리인 사람들’로 옮겼습니다. 의미를 보충하지 않는 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:56Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 아람어는 관리들이 수신자인 왕에게 알리기 위한 목적으로 그들에게 이름을 묻고, 그들 가운데 우두머리인 사람들의 이름을 기록하려 했다고 말합니다. 초안은 핵심 의미를 대체로 담았지만, 목적 관계를 ‘그래서’라는 결과 관계로 바꾸고 대명사 ‘그것’의 지시 대상도 불분명하게 했습니다.
  naturalness: ‘당신에게’는 왕에게 올리는 공식 보고라는 문맥과 현대 한국어 성경의 격식에 잘 맞지 않습니다. ‘임금님께’와 한 문장 안의 목적 구성이 자연스럽고 분명합니다.
  terminology: ‘우두머리인 사람들’은 דִּי בְרָאשֵׁיהֹם의 지도자 관용구를 무리 없이 전달합니다. 수신자는 문맥상 왕이므로 ‘임금님께’로 명시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 목적 관계가 결과 관계로 바뀜
    rationale: ‘그래서 우리는 … 적으려 했습니다’는 앞선 행위의 결과처럼 들리지만, לְהוֹדָעוּתָךְ와 이어지는 절은 왕에게 알리고 기록하기 위한 목적을 나타냅니다.
  - severity: medium
    issue: ‘그것’의 지시 대상이 불명확함
    rationale: 복수인 ‘그들의 이름’을 ‘그것’으로 받으면 무엇을 알리는지 흐려집니다.
  - severity: medium
    issue: 수신자 호칭의 격식 및 문맥 부적합
    rationale: 왕에게 보내는 보고에서 ‘당신에게’보다 ‘임금님께’가 표준 한국어의 공식적 존대와 본문 문맥을 더 정확히 반영합니다.
  - severity: low
