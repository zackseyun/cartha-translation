revisions:
- from: 그러나 그들의 하나님의 눈이 유다의 장로들 위에 있었고, 그들은 다리우스에게 명령이 갈 때까지 그들을 멈추게 하지 못했습니다. 그러면 그들은 이 일에 대한 편지를 돌려보낼 것이었습니다.[a][b][c]
  to: 그러나 그들의 하나님의 눈이 유다 사람들의 장로들 위에 머물러 있었으므로,[a] 그들은 다리우스에게 조서가 이르기까지[b] 그들을 중단시키지 않았습니다. 그런 뒤에 그들은 이 일에 관하여 회답으로 서신을 보낼 것이었습니다.[c]
  rationale: 원문의 사역 동사에 맞추어 ‘못했습니다’를 ‘중단시키지 않았습니다’로 바로잡았습니다. 민족 집단을 나타내는 표현을 명료화하고, 하나님의 ‘눈’이라는 신체 은유는 보존하되 자연스러운 한국어 문장으로 조정했습니다. 조서가 다리우스에게 이른 뒤 서신으로 회답하는 순서와 장래적·예정적 미완료형의 뉘앙스도 유지했습니다. 각주는 해당 본문 어휘에 직접 배치했습니다.
