source:
  edition: WLC
  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
  footnotes:
  - marker: a
    text: Or 'was watching over the elders of the Jews.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until a decision/order should go to Darius.'
    reason: lexical_alternative
  - marker: c
    text: Or 'then they would send a reply in writing concerning this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들의 하나님의 눈이 유다 사람들의 장로들 위에 머물러 있었으므로,[a] 그들은 다리우스에게 조서가 이르기까지[b] 그들을 중단시키지 않았습니다. 그런 뒤에 그들은 이 일에 관하여 회답으로 서신을 보낼 것이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들의 장로들을 지켜보고 계셨다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘결정/명령이 다리우스에게 이르기까지’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그런 뒤에 그들은 이 일에 관하여 서신으로 회답할 것이었다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם
  english_pob_choice: But the eye of their God
  chosen_korean: 그들의 하나님의 눈
  alternatives_korean:
  - 하나님의 눈
  - 그들의 하나님이 지켜보시는 것
  lexicon: HALOT
  rationale: 아람어의 구체적 은유인 '눈'을 살리고, 소유 접미사 '그들의'도 반영했습니다. '지켜보시다'는 해석을 덧붙이는 표현이어서 본문에는 직접적 은유를 유지했습니다.
- source_word: הֲוָת עַל
  english_pob_choice: was on
  chosen_korean: 위에 있었고
  alternatives_korean:
  - 위에 있었으며
  - 지켜보고 있었고
  lexicon: HALOT
  rationale: 관용적으로는 '위에 있었다'가 자연스러우면서도, 영어 POB가 유지한 구체적 공간 은유를 한국어에서도 보존합니다.
- source_word: שָׂבֵי יְהוּדָיֵא
  english_pob_choice: the elders of the Jews
  chosen_korean: 유다의 장로들
  alternatives_korean:
  - 유대인들의 장로들
  - 유다 사람들의 장로들
  lexicon: HALOT
  rationale: שָׂבֵי는 단순한 지도자가 아니라 '장로들'이므로 이를 유지했습니다. 지명적/민족적 범위를 자연스럽게 나타내기 위해 '유다'를 택했습니다.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  english_pob_choice: and they did not make them stop
  chosen_korean: 그들을 멈추게 하지 못했습니다
  alternatives_korean:
  - 그들을 멈추게 하지 않았습니다
  - 그들을 중단시키지 못했습니다
  lexicon: HALOT
  rationale: Pael의 사역적 뉘앙스를 살려 단순히 '멈추지 않았다'보다 '멈추게 하지 못했다'로 옮겼습니다.
- source_word: עַד טַעְמָא
  english_pob_choice: until a decree
  chosen_korean: 명령이
  alternatives_korean:
  - 조서가
  - 결정이
  lexicon: HALOT
  rationale: 페르시아 행정 문맥에서 공식 결정을 가리키므로 '명령'을 택했습니다. 다만 문맥상 그 성격은 조서/결정도 포함할 수 있습니다.
- source_word: לְדָרְיָוֶשׁ יְהָךְ
  english_pob_choice: should go to Darius
  chosen_korean: 다리우스에게 ... 갈 때까지
  alternatives_korean:
  - 다리우스에게 ... 가기까지
  - 다리우스에게 ... 갈 때
  lexicon: HALOT
  rationale: 미완료형의 장래적 진행을 한국어의 '-까지' 구조로 자연스럽게 반영했습니다.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא
  english_pob_choice: then they would send back a letter
  chosen_korean: 그러면 그들은 이 일에 대한 편지를 돌려보낼 것이었습니다
  alternatives_korean:
  - 그때 그들은 이 일에 대한 편지를 보내 답할 것이었습니다
  - 그런 다음 그들은 이 일에 대한 서신을 돌려보낼 것이었습니다
  lexicon: HALOT
  rationale: יְתִיבוּן은 '돌려보내다/응답하다'의 뜻이므로, 행정 문맥을 살려 '편지를 돌려보내다'로 옮겼습니다. '편지'는 공식 서신의 일반적 대응어로 충분합니다.
theological_decisions:
- issue: 하나님의 감시/보호를 나타내는 신체 은유
  chosen_reading: '''그들의 하나님의 눈이 ... 위에 있었다''를 그대로 유지했습니다.'
  alternative_readings:
  - 하나님이 그들을 지켜보고 계셨습니다
  - 하나님의 돌보심이 있었다
  rationale: 본문은 하나님의 주권적 돌봄을 구체적 은유로 표현하므로, 이를 설명적으로 풀지 않고 보존하는 것이 원문의 힘을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §6
