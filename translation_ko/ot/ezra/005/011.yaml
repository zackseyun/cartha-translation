id: EZR.5.11
reference: Ezra 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
  footnotes:
  - marker: a
    text: Or, 'And thus the message they returned to us was.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'we are building the house'; the Aramaic participle can denote ongoing action, and 'rebuilding' makes explicit that this temple had existed previously.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 우리에게 이렇게 답했습니다[a]. “우리는 하늘과 땅의 하나님을 섬기는 종들입니다. 그리고 우리는 여러 해 전에 지어졌던 그 집을 다시 세우고 있습니다[b]. 그것은 이스라엘의 위대한 왕이 세우고 완성한 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그리고 그들이 우리에게 전해 준 말은 이렇습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘우리는 그 집을 짓고 있습니다.’ 아람어 분사는 진행 중인 행위를 나타낼 수 있으므로, 여기서는 이전에 있던 성전을 다시 짓는 뜻을 분명히 하기 위해 ‘다시 세우고 있습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא לְמֵמַר
  english_pob_choice: And this is the answer they returned to us, saying
  chosen_korean: “그리고 그들이 우리에게 이렇게 답했습니다”
  alternatives_korean:
  - “그리고 그들이 우리에게 이렇게 말했습니다”
  - “그리고 그들이 우리에게 이렇게 응답했습니다”
  lexicon: HALOT
  rationale: 피תגָם과 하ֲתִיבוּ나의 담화 기능을 살려 ‘답했습니다’로 옮기면, 단순 발화가 아니라 이미 주어진 질문에 대한 응답임이 드러납니다.
- source_word: עַבְדוֹהִי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종
  - 노예
  - 섬기는 자들
  lexicon: HALOT
  rationale: 하나님께 대한 예속과 충성을 나타내는 기본 의미를 살리되, 여기서는 복수 주어이므로 ‘종들’이 가장 자연스럽습니다.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  english_pob_choice: the God of heaven and earth
  chosen_korean: 하늘과 땅의 하나님
  alternatives_korean:
  - 하늘의 하나님과 땅의 하나님
  - 하늘들과 땅의 하나님
  lexicon: HALOT
  rationale: 원문의 보편적 주권 표지를 한국어 관용에 맞게 간결하게 옮기되, 하나님의 우주적 통치를 분명히 드러냈습니다.
- source_word: וּבָנַיִן בַּיְתָא דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  english_pob_choice: and we are rebuilding the house that was built many years ago
  chosen_korean: “그리고 우리는 여러 해 전에 지어졌던 그 집을 다시 세우고 있습니다”
  alternatives_korean:
  - “그리고 우리는 여러 해 전에 지어진 그 집을 짓고 있습니다”
  - “그리고 우리는 그 집을 재건하고 있습니다”
  lexicon: HALOT
  rationale: 동사 바나의 진행상과 과거의 선행 건축을 함께 살리기 위해 ‘다시 세우고 있습니다’로 옮겼습니다. ‘집’은 원문의 bêt를 따라 가되, 문맥상 성전을 가리킵니다.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב בְּנָהִי וְשַׁכְלְלֵהּ
  english_pob_choice: which a great king of Israel built and completed
  chosen_korean: “그것은 이스라엘의 위대한 왕이 세우고 완성한 것입니다”
  alternatives_korean:
  - “이스라엘의 큰 왕이 세우고 마친 것입니다”
  - “이스라엘의 위대한 왕이 지어 완성한 것입니다”
  lexicon: HALOT
  rationale: רַב은 단순한 규모보다 탁월함을 가리키므로 ‘위대한 왕’이 적절합니다. שׁכלל은 건축을 끝맺어 완성하는 뜻을 반영해 ‘완성한’으로 옮겼습니다.
theological_decisions:
- issue: 하나님에 대한 종의 자기 규정
  chosen_reading: ‘종들’은 하나님께 대한 충성된 예속을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘노예들’로 더 강하게 옮길 수 있음
  rationale: 이 절에서는 예배적·언약적 자기 규정이 중심이므로, 본문이 요구하는 강도를 훼손하지 않으면서도 한국어로 가장 자연스럽게 ‘종들’을 유지했습니다.
  doctrine_reference: Translation philosophy §1; lexical consistency
- issue: ‘집’의 의미
  chosen_reading: ‘집’으로 직역하고 문맥으로 성전을 식별하게 했습니다.
  alternative_readings:
  - ‘성전’으로 명시할 수 있음
  rationale: 원문은 בַּיְתָא(집)를 사용하므로, 성전이라는 해석을 본문 안에 미리 대체하지 않고 원어 이미지를 보존했습니다.
  doctrine_reference: Source transparency; optimal-equivalence
