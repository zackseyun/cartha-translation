review_pass:
  verdict: revise
  source_fidelity: 원문의 통치자 직함, 행정 지역, 방문·질문 구조는 대체로 잘 반영되었습니다. 그러나 תַּתְּנַי에는 ‘르’에 해당하는 자음이 없으므로 ‘다르타냐’는 원문 음역으로 지지되기 어렵습니다. 또한 טְעֵם은 왕의 칙령에 한정되지 않는 공적 명령·지시이므로 ‘칙령’보다 ‘명령’이 문맥과 어휘 범위를 더 잘 보존합니다.
  naturalness: 합쇼체 서술과 직접 질문은 자연스럽습니다. 다만 ‘건축물을 완성하도록 너희에게 누가 칙령을 주었습니까’는 다소 번역투이므로, ‘…하라고 누가 너희에게 명령했습니까’가 현대 한국어에서 더 자연스럽습니다.
  terminology: 통상적인 한국어 성경식 음역인 ‘닷드내’와 ‘스달보스내’를 사용했습니다. ‘강 건너편 지역’은 페르시아 행정 명칭의 의미를 무리 없이 전달합니다. 불확실한 אֻשַּׁרְנָא는 ‘구조물’로 넓게 옮기고 각주에서 가능한 이해를 밝혔습니다.
  issues:
  - severity: high
    issue: ‘다르타냐’라는 인명 음역
    rationale: 원문 תַּתְּנַי(Tattenai)에 ‘르’ 음가를 뒷받침할 요소가 없습니다. 한국어 성경 전통 및 원문 자음에 더 가까운 ‘닷드내’로 고쳐야 합니다.
  - severity: medium
    issue: ‘셋르-보즈나이’라는 인명 음역
    rationale: שְׁתַר בּוֹזְנַי의 일반적 한국어 음역은 ‘스달보스내’입니다. 현 표기는 한국어 음역 관행과 기존 성경 표기에서 벗어나며 원문과의 대응도 덜 분명합니다.
  - severity: medium
    issue: טְעֵם을 ‘칙령’으로 한정
    rationale: 이 어휘는 공식 명령·결정·법령을 가리킬 수 있으나, ‘칙령’은 특히 군주의 명령이라는 의미가 강합니다. 화자가 묻는 승인 권한의 범위를 보존하려면 ‘명령’이 안전합니다.
  revised_text: 그때 강 건너편 지역의 총독 닷드내[a]와 스달보스내와 그들의 동료들이 그들에게 와서 이렇게 말했습니다. “이 집을 짓고 이 구조물[c]을 완성하라고 누가 너희에게 명령했습니까?”
  revised_footnotes:
  - marker: a
    text: 닷드내는 페르시아 제국의 관리 이름입니다.
    reason: source_note
  - marker: b
    text: ‘강 건너편 지역’은 유프라테스강 서쪽의 페르시아 행정 구역 이름입니다.
    reason: cultural_note
  - marker: c
    text: 이 표현은 성전 건축물의 구조나 건축 공사를 가리킬 수 있습니다. 일부는 성벽 또는 골조로 이해합니다.
    reason: lexical_alternative
  revision_rationale: 인명 음역을 원문 자음 및 널리 쓰이는 한국어 성경 표기에 맞추어 바로잡았습니다. ‘칙령’을 더 포괄적인 ‘명령’으로 바꾸어 טְעֵם의 행정적 권한 의미를 보존했고, 질문문의 어순을 현대 합쇼체로 다듬었습니다. ‘구조물’은 אֻשַּׁרְנָא의 불확실성을 본문에서 과도하게 특정하지 않으며, 관련 대안은 각주에 남겼습니다.
