reference: Ezra 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
  footnotes:
  - marker: a
    text: Or 'Who gave you a command/decree to build this house and to finish this structure?' The Aramaic טְעֵם can denote an official order or decree.
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' is the Persian administrative name for the region west of the Euphrates.'
    reason: cultural_note
  - marker: c
    text: The term rendered 'structure' may refer more specifically to the temple's building work; some understand it as 'wall' or 'framework.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 다르타냐[a]—강 건너편 지역의 총독[b]—와 셋르-보즈나이, 그리고 그들의 동료들이 그들에게 와서 이렇게 말했습니다. “이 집을 짓고 이 건축물[c]을 완성하도록 너희에게 누가 칙령을 주었습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tattenai는 페르시아 시대 총독의 이름입니다.
    reason: source_note
  - marker: b
    text: ‘강 건너편 지역’은 유브라데 강 서쪽의 페르시아 행정 구역 이름입니다.
    reason: cultural_note
  - marker: c
    text: 이 표현은 성전의 건축 공사나 그 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 무렵에
  - 그때
  lexicon: HALOT
  rationale: 아람어의 관용적 시간 표현으로, 한국어 서술에서는 간결한 ‘그때에’가 자연스럽고 문맥의 진행을 살립니다.
- source_word: פַּחַת עֲבַר נַהֲרָה
  english_pob_choice: the governor of Beyond the River
  chosen_korean: 강 건너편 지역의 총독
  alternatives_korean:
  - 하 강 너머의 총독
  - 유브라데 강 건너 지역의 총독
  lexicon: HALOT
  rationale: פַּחַת은 행정관/총독을 뜻하므로 ‘총독’으로 옮기고, עֲבַר נַהֲרָה는 페르시아 행정명칭을 살려 직역적으로 ‘강 건너편 지역’으로 번역했습니다.
- source_word: וּכְנָוָתְהוֹן
  english_pob_choice: and their associates
  chosen_korean: 그리고 그들의 동료들
  alternatives_korean:
  - 그리고 그들의 동행들
  - 그리고 그들의 협력자들
  lexicon: HALOT
  rationale: 함께 딸린 사람들을 가리키는 넓은 표현이므로, 현대 한국어에서 무난한 ‘동료들’로 처리했습니다.
- source_word: טְעֵם
  english_pob_choice: decree
  chosen_korean: 칙령
  alternatives_korean:
  - 명령
  - 법령
  - 지시
  lexicon: HALOT
  rationale: 아람어 טְעֵם은 공식적 명령이나 행정 명령을 가리킬 수 있어, ‘칙령’이 권위 있는 공적 명령의 뉘앙스를 비교적 잘 살립니다.
- source_word: בַּיְתָא דְנָה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 건물
  lexicon: HALOT
  rationale: 원문은 ‘집’을 쓰지만, 에스라 문맥에서는 성전을 가리키므로 ‘이 집’으로 옮겨 원문 표지를 보존했습니다.
- source_word: וְאֻשַּׁרְנָא דְנָה
  english_pob_choice: this structure
  chosen_korean: 이 건축물
  alternatives_korean:
  - 이 구조물
  - 이 공사
  - 이 성전 건축
  lexicon: HALOT
  rationale: 이 단어는 다소 불확실하지만 진행 중인 건축 작업/구조를 가리킬 수 있으므로, 의미를 과도하게 특정하지 않는 ‘건축물’로 옮겼습니다.
- source_word: לְשַׁכְלָלָה
  english_pob_choice: to complete
  chosen_korean: 완성하도록
  alternatives_korean:
  - 마치도록
  - 끝내도록
  - 완료하도록
  lexicon: HALOT
  rationale: ‘완성하다’는 공사나 건축의 마무리를 자연스럽게 나타내며, 뒤의 ‘건축물’과도 잘 맞습니다.
theological_decisions:
- issue: Tattenai의 음역
  chosen_reading: 다르타냐
  alternative_readings:
  - 타드내
  - 타드나이
  rationale: 히브리/아람어 اسم의 한국어 음차를 현대 외래어 표기 관행에 가깝게 맞추되, 기존 영어형 Tattenai와의 대응이 보이도록 정리했습니다.
  doctrine_reference: proper-noun transliteration policy
- issue: ‘Beyond the River’의 행정명칭 유지
  chosen_reading: 강 건너편 지역
  alternative_readings:
  - 유브라데 강 서편
  - 강 저편
  rationale: 지명 설명을 덧붙여야 할 정도의 문화적 행정명칭이므로, 본문에서는 원문 의미를 살린 설명형 번역을 사용했습니다.
  doctrine_reference: historical-cultural reference preservation
