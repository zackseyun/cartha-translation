id: EZR.5.2
reference: Ezra 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
  footnotes:
  - marker: a
    text: Or 'the temple of God.' The Aramaic reads literally 'the house of God.'
    reason: lexical_alternative
  - marker: b
    text: Jeshua is the personal name form used here; compare the related name form 'Joshua' elsewhere.
    reason: lexical_alternative
  - marker: c
    text: Or 'helping them' or 'assisting them.' The participle conveys active support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 스룹바벨, 셰알디엘의 아들, 그리고 여호사닥의 아들 예수아가 일어나 예루살렘에 있는 하나님의 집을 짓기 시작하였고, 하나님의 예언자들이 그들과 함께 있어 그들을 도왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 이에
  - 그때에
  lexicon: HALOT
  rationale: 아람어 담화 표지로서 앞선 사건 다음의 진행을 나타내므로, 현대 문장에 자연스러운 시간 부사 ‘그때’로 옮겼습니다.
- source_word: קָמוּ
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰고
  - 일어나서
  - 몸을 일으켜
  lexicon: HALOT
  rationale: 단순히 서게 되었다기보다 행동을 개시하는 뉘앙스를 살려 ‘일어나’로 옮겼습니다.
- source_word: וְשָׁרִיו לְמִבְנֵא
  english_pob_choice: and began to build
  chosen_korean: 짓기 시작하였고
  alternatives_korean:
  - 건축하기 시작하였고
  - 세우기 시작하였고
  lexicon: HALOT
  rationale: 동사와 부정사 결합이 ‘~하기 시작하다’의 의미를 이루므로, 자연스러운 한국어 관용으로 풀되 건축 행위를 분명히 했습니다.
- source_word: בֵּית אֱלָהָא
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 전
  lexicon: HALOT
  rationale: 원문의 직역 표현인 ‘house of God’를 유지했습니다. POB의 주석처럼 ‘성전’은 가능하지만, 본문에는 보다 원문 밀착적인 ‘하나님의 집’이 적절합니다.
- source_word: נביאיא דִי אֱלָהָא
  english_pob_choice: the prophets of God
  chosen_korean: 하나님의 예언자들이
  alternatives_korean:
  - 하나님의 선지자들이
  - 하나님의 예언자들
  lexicon: HALOT
  rationale: 아람어 נביאיא는 예언자/선지자를 가리키며, 현대 한국어 합쇼체 본문에서는 ‘예언자’가 더 직역적이고 중립적이어서 이를 택했습니다.
- source_word: מְסָעֲדִין לְהוֹן
  english_pob_choice: supporting them
  chosen_korean: 그들을 도왔습니다
  alternatives_korean:
  - 그들을 지원했습니다
  - 그들을 돕고 있었습니다
  - 그들을 보조했습니다
  lexicon: HALOT
  rationale: 분사형은 지속적·실질적 지원을 뜻하므로, 한국어에서는 간결하게 ‘도왔습니다’로 옮겨 도움의 기능을 살렸습니다.
theological_decisions:
- issue: ‘house of God’의 번역 방식
  chosen_reading: ‘하나님의 집’으로 유지했습니다.
  alternative_readings:
  - ‘하나님의 성전’
  - ‘하나님의 전’
  rationale: 원문이 말하는 것은 관용적이지만 직설적인 ‘하나님의 집’이며, 이는 건물 의미를 넘어서 하나님의 거처라는 성격도 남겨 둡니다. 본문 자체의 표현력을 보존하기 위해 교회적 관용어보다 직역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
