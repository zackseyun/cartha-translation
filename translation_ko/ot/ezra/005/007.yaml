revisions:
- from: '그들은 그에게 보고서를 보냈습니다. 그리고 그 안에 이렇게 기록되어 있었습니다. 「다리우스 왕께: 온전한 평강이 있기를 바랍니다.」[a][b]'
  to: '그들은 그에게 보고서[a]를 보냈는데, 그 안에는 이렇게 기록되어 있었습니다. “다리우스 왕께: 온전한 평안이 있기를 바랍니다.”[b]'
  rationale: 문서 내용을 도입하는 문장을 자연스러운 현대 한국어로 다듬고, 공식 서신의 관용적 인사말을 ‘온전한 평안’으로 옮겼습니다. ‘있기를 바랍니다’는 한국어의 축원형 서신 인사로서 원문의 관용적 기능을 반영합니다. 각주는 해당 어휘와 인사말에 직접 연결하고 한국어 번역에 맞게 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:45Z'
