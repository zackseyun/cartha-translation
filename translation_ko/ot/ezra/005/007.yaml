base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
  footnotes:
  - marker: a
    text: Or “They sent him a letter/report, and this is what was written in it.” The Aramaic פתגמא can denote an official message, report, or document.
    reason: lexical_alternative
  - marker: b
    text: “All peace” is a formal epistolary greeting meaning complete peace or well-being.
    reason: cultural_note
translation:
  language: ko
  text: '그들은 그에게 보고서를 보냈습니다. 그리고 그 안에 이렇게 기록되어 있었습니다. 「다리우스 왕께: 온전한 평강이 있기를 바랍니다.」[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 פִּתְגָמָא는 공식적인 메시지, 보고, 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온전한 평강’은 공식 서신 인사말인 ‘all peace’를 뜻하는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  english_pob_choice: report
  chosen_korean: 보고서
  alternatives_korean:
  - 문서
  - 편지
  - 보고
  lexicon: HALOT
  rationale: 행정적 문맥에서 왕에게 보내는 공식 문서를 가리키므로, 일반적인 ‘편지’보다 ‘보고서’가 기능을 더 잘 드러냅니다.
- source_word: עֲלֹוהִי
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게로
  - 그를 향해
  lexicon: HALOT
  rationale: 전치사 על+대명사 접미사는 수신자를 가리키므로 자연스러운 한국어로 ‘그에게’가 적합합니다.
- source_word: וְכִדְנָה כְּתִיב
  english_pob_choice: and this was what was written
  chosen_korean: 그리고 그 안에 이렇게 기록되어 있었습니다
  alternatives_korean:
  - 그리고 그것에는 이렇게 লেখা되어 있었습니다
  - 그리고 그 문서에는 다음과 같이 적혀 있었습니다
  lexicon: HALOT
  rationale: 문서의 실제 내용을 도입하는 표현이므로 ‘이렇게 기록되어 있었습니다’로 문어체의 전달성을 살렸습니다.
- source_word: שְׁלָמָא כֹּלָּא
  english_pob_choice: all peace
  chosen_korean: 온전한 평강
  alternatives_korean:
  - 완전한 평안
  - 온 평강
  - 모든 평강
  lexicon: HALOT
  rationale: 아람어 관용 인사말로서 단순한 ‘평화’보다 완전성과 안녕을 함께 담는 한국어 표현이 더 자연스럽습니다.
theological_decisions:
- issue: 왕에게 보내는 서신의 인사말을 어떻게 처리할지
  chosen_reading: 평강을 비는 정중한 서신 인사로 옮겼습니다.
  alternative_readings:
  - ‘평강’이라는 단어만 직역하기
  - ‘안부’로 풀어 옮기기
  rationale: 본문의 שְׁלָמָא כֹּלָּא는 공식 서신에서 쓰는 관용적 축원으로, 의미를 살리면서도 한국어 독자에게 자연스럽게 들리도록 번역했습니다.
  doctrine_reference: 서신체 관용구 해석
