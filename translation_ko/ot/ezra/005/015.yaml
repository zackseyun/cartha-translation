  text: וַ/אֲמַר לֵ֓/הּ אלה מָֽאנַיָּ֔/א שֵׂ֚א אֵֽזֶל אֲחֵ֣ת הִמּ֔וֹ בְּ/הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/בֵ֥ית אֱלָהָ֖/א יִתְבְּנֵ֥א עַל אַתְרֵֽ/הּ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
  footnotes:
  - marker: a
    text: Or “be built on its place.” The Aramaic expression emphasizes rebuilding the house of God at its proper location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「이 기물들을 가져다가 예루살렘에 있는 성전으로 가서 놓으십시오. 그리고 하나님의 집이 그 자리에 다시 세워지게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 자리에.” 아람어 표현은 하나님의 집이 마땅한 위치에 다시 세워지는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מָאנַיָּא
  english_pob_choice: these vessels
  chosen_korean: 이 기물들
  alternatives_korean:
  - 이 그릇들
  - 이 제의 기물들
  - 이 성전 기물들
  lexicon: HALOT
  rationale: מָאנַיָּא는 성전에서 쓰던 기구·용기를 가리키므로, 한국어에서는 너무 일상적인 '그릇'보다 문맥을 살리는 '기물'이 더 정확합니다.
- source_word: שֵׂא ... אֲחֵת הִמּוֹ
  english_pob_choice: Take ... put them
  chosen_korean: 가져다가 ... 놓으십시오
  alternatives_korean:
  - 가지고 가서 ... 두십시오
  - 들고 가서 ... 놓으십시오
  - 옮겨 ... 두십시오
  lexicon: HALOT
  rationale: 연속된 명령형은 한국어에서 '가져다가'와 '놓으십시오'로 자연스럽게 이어지며, 단순 보관보다 지정된 장소로 옮겨 두는 뜻을 잘 드러냅니다.
- source_word: יִתְבְּנֵא
  english_pob_choice: be rebuilt
  chosen_korean: 다시 세워지게 하십시오
  alternatives_korean:
  - 재건되게 하십시오
  - 세워지게 하십시오
  - 다시 지어지게 하십시오
  lexicon: HALOT
  rationale: 문맥상 이미 무너진 성전의 복구를 말하므로 '다시 세워지게 하십시오'가 자연스럽고, 재건의 의미를 분명하게 전달합니다.
- source_word: עַל אַתְרֵהּ
  english_pob_choice: on its site
  chosen_korean: 그 자리에
  alternatives_korean:
  - 그 터에
  - 원래 자리에서
  - 제자리에
  lexicon: HALOT
  rationale: אַתְרָא는 '장소, 자리'이므로 '그 자리에'가 가장 간결하고, 성전이 원래 있어야 할 위치를 가리키는 뜻을 살립니다.
theological_decisions:
- issue: 하나님 성전의 복구 명령
  chosen_reading: '''하나님의 집''을 단순한 건축물이 아니라 예루살렘 성전으로 이해하되, 본문이 강조하는 것은 정해진 자리에서의 복구입니다.'
  alternative_readings:
  - '''하나님의 성전''으로 명시하기'
  - '''하나님의 집''을 일반적 예배 장소로 완화하기'
  rationale: 아람어 원문은 '하나님의 집'을 직접 말하지만, 예루살렘 성전 문맥이 분명하므로 건물의 신학적 위상을 유지하면서도 위치 강조를 흐리지 않도록 옮겼습니다.
  doctrine_reference: 성전 회복과 포로 귀환 서사(에스라 1–6장)
