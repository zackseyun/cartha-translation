    rationale: 원문의 ‘바벨론에 있는 왕의 보물 집’이라는 위치·소유 관계를 ‘바벨론에 있는 왕실 보물 보관소’로 정리하고, 문서·칙령 검색 문맥에는 ‘조사하게 하시고’가 더 적합합니다.
