source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
  footnotes:
  - marker: a
    text: Or, 'to build this house of God in Jerusalem.' The Aramaic verb can be rendered simply 'build'; 'rebuild' reflects the restoration context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the king's will' or 'the king's decision.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕께서 좋게 여기시면, 바벨론에 있는 왕실 보물 보관소를 조사하게 하시고, 고레스 왕이 예루살렘에 있는 이 하나님의 집을 짓도록[a] 명령을 내렸는지 확인하게 하십시오. 그리고 이 일에 관한 왕의 뜻을[b] 우리에게 보내 주시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 세우도록’. 아람어 동사는 단순히 ‘짓다’로도 번역될 수 있으며, ‘다시 세우다’는 성전 회복의 문맥을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 의향’ 또는 ‘왕의 결정’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 담화 전환 표지로서 요청의 결론을 여는 기능을 살려 자연스럽게 옮겼습니다.
- source_word: הֵן עַל מַלְכָּא טָב
  english_pob_choice: if it seems good to the king
  chosen_korean: 왕께서 좋게 여기시면
  alternatives_korean:
  - 왕에게 좋다면
  - 왕의 뜻에 맞는다면
  lexicon: HALOT
  rationale: 궁정 문체의 공손한 조건문을 유지하면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: בְּבֵית גִּנְזַיָּא
  english_pob_choice: in the royal treasury
  chosen_korean: 왕실 보물 창고
  alternatives_korean:
  - 왕실 خز? 창고
  - 왕실 금고
  - 왕실 보관소
  lexicon: HALOT
  rationale: 직역하면 ‘보물의 집’이지만, 여기서는 문서 조회가 이루어지는 왕실 저장/보관 장소를 가리키므로 기능을 살려 표현했습니다.
- source_word: יִתְבַּקַּר
  english_pob_choice: let a search be made
  chosen_korean: 조사를 해 보게 하십시오
  alternatives_korean:
  - 수색을 하게 하십시오
  - 탐문을 하게 하십시오
  lexicon: HALOT
  rationale: 공식 문서 검색의 맥락을 반영하되, 현대 한국어에서 너무 형사적이지 않게 ‘조사’로 옮겼습니다.
- source_word: לְמִבְנֵא
  english_pob_choice: to rebuild
  chosen_korean: 다시 세우도록
  alternatives_korean:
  - 건축하도록
  - 짓도록
  lexicon: HALOT
  rationale: 성전 복구의 역사적 맥락을 드러내기 위해 ‘다시 세우다’로 옮겼습니다; 영어 POB의 ‘rebuild’에 대응합니다.
- source_word: בֵּית אֱלָהָא דֵךְ
  english_pob_choice: this house of God
  chosen_korean: 이 하나님의 집
  alternatives_korean:
  - 이 하나님의 성전
  - 이 하나님 집
  lexicon: HALOT
  rationale: 원문의 ‘집’을 보존하면서도, 문맥상 성전임을 한국어 독자에게 자연스럽게 전달했습니다.
- source_word: וּרְעוּת מַלְכָּא
  english_pob_choice: the king's pleasure
  chosen_korean: 왕의 뜻
  alternatives_korean:
  - 왕의 기쁨
  - 왕의 결정
  - 왕의 의사
  lexicon: HALOT
  rationale: 궁정 공식문의 관용구를 현대 한국어에서 가장 자연스럽고 명료한 ‘뜻’으로 옮겼습니다.
theological_decisions:
- issue: 성전 회복 명령의 표현
  chosen_reading: ‘다시 세우도록’으로 번역해 단순 건축이 아니라 예루살렘 성전의 회복이라는 역사적 함의를 살렸습니다.
  alternative_readings:
  - ‘짓도록’
  - ‘건축하도록’
  rationale: 원문 동사는 일반적으로 ‘짓다’일 수 있으나, 본문이 포로기 이후의 성전 복구 문맥에 있으므로 회복적 의미를 드러내는 번역이 적절합니다.
  doctrine_reference: 역대기-에스라의 성전 회복 서술 맥락
- issue: ‘하나님의 집’ 보존
  chosen_reading: 전통적 ‘성전’ 대신 원문 직유에 가까운 ‘하나님의 집’을 유지했습니다.
  alternative_readings:
  - ‘성전’
  rationale: 문맥상 성전 의미가 분명하지만, 원문 표현의 직접성을 살려 독자가 저자의 어휘를 보도록 했습니다.
  doctrine_reference: 원문 표현 보존 원칙
