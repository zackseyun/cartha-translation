source:
  edition: WLC
  text: בְּרַם֙ בִּ/שְׁנַ֣ת חֲדָ֔ה לְ/כ֥וֹרֶשׁ מַלְכָּ֖/א דִּ֣י בָבֶ֑ל כּ֤וֹרֶשׁ מַלְכָּ/א֙ שָׂ֣ם טְעֵ֔ם בֵּית אֱלָהָ֥/א דְנָ֖ה לִ/בְּנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
  footnotes:
  - marker: a
    text: Or 'to build this house of God.' The Aramaic verb itself means 'to build'; 'rebuild' reflects the restoration context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바벨론 왕 고레스의 제1년에 고레스 왕이 이 하나님의 집을 다시 세우도록 칙령을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 하나님의 집을 세우도록.’ 아람어 동사 자체는 ‘짓다/세우다’를 뜻하며, ‘다시 세우다’는 회복 문맥을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그러나
  lexicon: HALOT
  rationale: 앞절과의 대비를 나타내는 접속부사로, 문맥상 자연스럽고 문어체에 맞는 ‘그러나’가 가장 적절합니다.
- source_word: בִּשְׁנַת חֲדָה
  english_pob_choice: in the first year
  chosen_korean: 제1년에
  alternatives_korean:
  - 첫 해에
  - 제일 년에
  - 첫 번째 해에
  lexicon: HALOT
  rationale: 왕의 즉위 연대를 나타내는 관용구로, 현대 한국어에서는 ‘제1년에’가 간결하고 공식 문체에 어울립니다.
- source_word: שָׂם טְעֵם
  english_pob_choice: issued a decree
  chosen_korean: 칙령을 내렸습니다
  alternatives_korean:
  - 명령을 내렸습니다
  - 조서를 반포했습니다
  - 법령을 제정했습니다
  lexicon: HALOT
  rationale: 아람어 관료 문맥의 공식 명령 표현을 한국어 행정어인 ‘칙령’으로 옮기면 왕의 공문서적 결을 살릴 수 있습니다.
- source_word: בֵּית אֱלָהָא דְנָה
  english_pob_choice: this house of God
  chosen_korean: 이 하나님의 집
  alternatives_korean:
  - 이 하나님의 성전
  - 이 하나님의 집
  - 이 성전
  lexicon: HALOT
  rationale: 원문이 직역적으로 ‘하나님의 집’이라 하므로 이를 유지해 원문 표현과 성전 의미를 함께 살렸습니다.
- source_word: לִבְנֵא
  english_pob_choice: to rebuild
  chosen_korean: 다시 세우도록
  alternatives_korean:
  - 건축하도록
  - 세우도록
  - 재건하도록
  lexicon: HALOT
  rationale: 기존 건물의 회복이라는 복원 맥락을 반영해 ‘다시 세우다’로 옮기되, 원문의 ‘build’ 의미를 과도하게 바꾸지 않았습니다.
theological_decisions:
- issue: 성전 회복 명령의 표현
  chosen_reading: ‘이 하나님의 집을 다시 세우도록’으로 번역해, 단순한 신축이 아니라 포로기 이후의 회복·재건이라는 역사적 의미를 드러냈습니다.
  alternative_readings:
  - ‘이 하나님의 집을 세우도록’
  - ‘이 하나님의 집을 건축하도록’
  rationale: 문맥상 이미 무너진 성전의 복원이 핵심이므로, 번역에서 그 회복성을 명시하는 것이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 성전 회복/포로 귀환 본문 맥락
