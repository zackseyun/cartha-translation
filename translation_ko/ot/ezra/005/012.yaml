base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
  footnotes:
  - marker: a
    text: Or 'angered the God of heaven.'
    reason: lexical_alternative
  - marker: b
    text: Aramaic 'this house,' that is, the temple.
    reason: cultural_note
  - marker: c
    text: Or 'exiled the people to Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리 조상들이 하늘의 하나님을 진노하게 하였기[a] 때문에, 그분께서 그들을 갈대아 사람인 바빌론 왕 느부갓네살의 손에 넘기셨고, 느부갓네살이 이 집을[b] 무너뜨리고 백성을 바빌론으로 유배시켰습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 하나님을 격노하게 하였다’.
    reason: alternative_reading
  - marker: b
    text: 아람어의 ‘이 집’, 곧 성전입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘백성을 바빌론으로 끌고 갔다’.
    reason: alternative_reading
lexical_decisions:
- source_word: לָהֵן / מִן דִּי
  english_pob_choice: Therefore / because
  chosen_korean: 그러므로 … 하였기 때문에
  alternatives_korean:
  - 그래서 … 때문에
  - 그런즉 … 하였으므로
  lexicon: HALOT
  rationale: 아람어의 결과-원인 연결을 한국어의 인과 구조로 자연스럽게 옮기되, 결론을 이끄는 ‘그러므로’와 이유를 밝히는 ‘때문에’를 함께 살렸습니다.
- source_word: הַרְגִּזוּ אֲבָהֳתַנָא לֶאֱלָהּ שְׁמַיָּא
  english_pob_choice: our fathers provoked the God of heaven to wrath
  chosen_korean: 우리 조상들이 하늘의 하나님을 진노하게 하였기 때문에
  alternatives_korean:
  - 우리 조상들이 하늘의 하나님을 격노하게 하였기 때문에
  - 우리 조상들이 하늘의 하나님을 분노케 하였기 때문에
  lexicon: HALOT
  rationale: הַרְגִּזוּ의 원인-유발 의미를 단순히 ‘화나게 하다’보다 더 강한 ‘진노하게 하다’로 옮겨, 하나님의 언약적 심판 어조를 보존했습니다.
- source_word: יְהַב הִמּוֹ בְּיַד
  english_pob_choice: he gave them into the hand of
  chosen_korean: 그분께서 그들을 … 손에 넘기셨고
  alternatives_korean:
  - 그분께서 그들을 … 손에 주셨고
  - 그분께서 그들을 … 손에 넘기셨으며
  lexicon: HALOT
  rationale: 히브리-아람어 관용구를 직역하되, 한국어에서는 ‘넘기다’가 권력 아래로 맡겨 넘기는 의미를 더 분명히 전달합니다.
- source_word: כסדיא
  english_pob_choice: the Chaldean
  chosen_korean: 곧 갈대아 사람
  alternatives_korean:
  - 곧 갈대아인
  - 곧 칼데아 사람
  lexicon: HALOT
  rationale: 느부갓네살을 수식하는 민족·집단 표지를 한국어 성경 어법에 맞춰 ‘갈대아 사람’으로 옮겼습니다.
- source_word: וּבַיְתָה דְנָה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 집 곧 성전
  lexicon: HALOT
  rationale: 원문이 사용하는 ‘집’을 그대로 살리되, 에스라 문맥에서 성전을 가리키는 표현이라는 점도 유지했습니다.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  english_pob_choice: and carried the people away to Babylon
  chosen_korean: 백성을 바빌론으로 끌고 갔습니다
  alternatives_korean:
  - 백성을 바빌론으로 유배시켰습니다
  - 백성을 바빌론으로 사로잡아 갔습니다
  lexicon: HALOT
  rationale: הגלי의 유배 의미를 살리면서도 한국어 서술로는 ‘끌고 갔다’가 포로로 데려감의 동작성을 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 하나님의 행위와 인간의 책임을 함께 보존하는 방식
  chosen_reading: 그분께서 그들을 바빌론 왕 느부갓네살의 손에 넘기셨고
  alternative_readings:
  - 그분께서 그들이 바빌론 왕 느부갓네살의 손에 넘어가도록 하셨고
  - 그분께서 그들을 바빌론 왕 느부갓네살에게 내주셨고
  rationale: 본문은 예루살렘 멸망과 포로 됨을 하나님이 심판으로 주도하셨다고 직접 말하므로, 이를 ‘허용하셨다’로 약화하지 않고 능동적 심판 행위로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘집’ 표현의 신학적 보존
  chosen_reading: 이 집
  alternative_readings:
  - 이 성전
  - 이 하나님의 집
  rationale: 원문이 ‘집’을 사용하므로, 성전이라는 해석을 본문에 미리 풀어 넣지 않고 하나님 임재의 장소를 지칭하는 성경적 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
