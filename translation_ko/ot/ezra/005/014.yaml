  lexicon: HALOT
  rationale: 아람어의 이름 제시 관용구를 한국어에서 자연스럽게 풀어, 이름 소개와 사람 지시를 함께 드러냈습니다.
theological_decisions:
- issue: 바빌론 왕이 옮긴 성전 기물의 귀속을 어떻게 드러낼지
  chosen_reading: 기물들이 예루살렘 성전에서 바빌론 성전으로, 그리고 다시 바빌론 성전에서 세스바살에게 넘어가는 역사적 이동을 그대로 살렸습니다.
  alternative_readings:
  - 추상적으로 ‘보관했다’고 완화
  - 왕권 서술을 일반화하여 생략
  rationale: 본문은 포로기와 귀환기의 실물 이동을 강조하므로, 역사적 연속성과 하나님의 집에 속한 물건이라는 긴장을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 포로기-귀환기 섭리 이해
