source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
  footnotes:
  - marker: a
    text: Or, more formally, 'and gave them to Sheshbazzar—his name—whom he had made governor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 하나님의 집의 금과 은 그릇들, 곧 느부갓네살이 예루살렘에 있던 성전에서 가져다가 바빌론의 성전으로 옮겨 놓은 것들을 — 고레스 왕이 바빌론의 성전에서 가져다가 세스바살이라는 사람, 곧 자기가 총독으로 세운 사람에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘그리고 세스바살에게 주었는데, 그의 이름이 세스바살이었습니다’라는 이름 제시 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 더욱이
  lexicon: HALOT
  rationale: 추가 항목을 여는 연결 부사이므로, 한국어에서는 자연스럽게 앞 절에 덧붙이는 ‘또한’이 적절합니다.
- source_word: מָאנַיָּא
  english_pob_choice: vessels
  chosen_korean: 그릇들
  alternatives_korean:
  - 기물들
  - 기구들
  lexicon: HALOT
  rationale: 성전의 봉헌 물품을 가리키는 말로, 한국어에서는 문맥상 가장 직접적인 ‘그릇들’이 간결하고 구체적입니다.
- source_word: בֵית אֱלָהָא / הֵיכְלָא
  english_pob_choice: the house of God / temple
  chosen_korean: 하나님의 집 / 성전
  alternatives_korean:
  - 하나님의 성전 / 궁전
  lexicon: HALOT
  rationale: 앞의 בֵית אֱלָהָא 는 ‘하나님의 집’으로 직역하고, 뒤의 הֵיכְלָא 는 동일 절 안에서 반복되는 예배 공간이므로 ‘성전’으로 옮겨 구별을 살렸습니다.
- source_word: שְׁמֵהּ
  english_pob_choice: one named Sheshbazzar
  chosen_korean: 세스바살이라는 사람
  alternatives_korean:
  - 세스바살이라고 이름한 사람
  - 이름이 세스바살인 사람
  lexicon: HALOT
  rationale: 아람어의 이름 제시 관용구를 한국어에서 자연스럽게 풀어, 이름 소개와 사람 지시를 함께 드러냈습니다.
theological_decisions:
- issue: 바빌론 왕이 옮긴 성전 기물의 귀속을 어떻게 드러낼지
  chosen_reading: 기물들이 예루살렘 성전에서 바빌론 성전으로, 그리고 다시 바빌론 성전에서 세스바살에게 넘어가는 역사적 이동을 그대로 살렸습니다.
  alternative_readings:
  - 추상적으로 ‘보관했다’고 완화
  - 왕권 서술을 일반화하여 생략
  rationale: 본문은 포로기와 귀환기의 실물 이동을 강조하므로, 역사적 연속성과 하나님의 집에 속한 물건이라는 긴장을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 포로기-귀환기 섭리 이해
