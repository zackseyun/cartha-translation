  text: וַ/יִּמָּצֵא֙ מִ/בְּנֵ֣י הַ/כֹּהֲנִ֔ים אֲשֶׁ֥ר הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת מִ/בְּנֵ֨י יֵשׁ֤וּעַ בֶּן יֽוֹצָדָק֙ וְ/אֶחָ֔י/ו מַֽעֲשֵׂיָה֙ וֶֽ/אֱלִיעֶ֔זֶר וְ/יָרִ֖יב וּ/גְדַלְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
  footnotes:
  - marker: a
    text: Or, 'who had married foreign women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이방 여인들을 아내로 맞은 제사장들의 자손들 가운데서, 요사닥의 아들 여호수아와 그의 형제들의 자손 가운데 마아세야와 엘리에셀과 야립과 그달랴가 발견되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방 여인들과 결혼한’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  english_pob_choice: there were found
  chosen_korean: 발견되었습니다
  alternatives_korean:
  - 있었습니다
  - 찾아졌습니다
  lexicon: HALOT
  rationale: 여기서는 명단을 도입하는 존재문이므로, 단순한 ‘있었습니다’보다 ‘발견되었습니다’가 히브리어 수동형의 결과와 조사 맥락을 더 분명히 드러냅니다.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  english_pob_choice: among the sons of the priests
  chosen_korean: 제사장들 가운데서
  alternatives_korean:
  - 제사장들의 자손들 가운데서
  - 제사장 가문들 가운데서
  lexicon: HALOT
  rationale: 직역하면 ‘제사장들의 아들들’이지만, 한국어에서는 문맥상 제사장 집단 내부를 자연스럽게 가리키는 ‘제사장들 가운데서’가 더 읽기 쉽고 의미도 보존합니다.
- source_word: נָשִׁים נָכְרִיּוֹת
  english_pob_choice: foreign wives
  chosen_korean: 이방 여자를 아내로 들인
  alternatives_korean:
  - 이방 여인을 아내로 맞은
  - 외국 여인과 결혼한
  lexicon: HALOT
  rationale: 문맥이 결혼 문제이므로 단순히 ‘이방 여자들’이라 하지 않고, 혼인 행위를 드러내는 ‘아내로 들인’으로 옮겨 영어 POB의 의미를 반영했습니다.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  english_pob_choice: from the sons of Jeshua son of Jozadak
  chosen_korean: 여호수아의 아들 요사닥의 자손들 가운데서
  alternatives_korean:
  - 여호수아의 아들 요사닥의 아들들 가운데서
  - 여호수아, 요사닥의 아들들의 자손들 가운데서
  lexicon: HALOT
  rationale: 고유명사 계보 표현은 직역 구조를 유지하되, 한국어 성경에서 통용되는 ‘여호수아’와 ‘요사닥’을 사용해 계보 관계를 분명히 했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 동족들
  - 그의 친족들
  lexicon: HALOT
  rationale: 직접 대응어는 ‘형제들’이며, 계보 목록의 반복 구조도 가장 잘 보존합니다.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  english_pob_choice: Maaseiah, Eliezer, Jarib, and Gedaliah
  chosen_korean: 마아세야, 엘르아살, 야립, 그리고 그달랴
  alternatives_korean:
  - 마아세야, 엘리에셀, 야립, 그리고 그달랴
  lexicon: HALOT
  rationale: 인명은 음역을 유지했으며, 엘리르아저/엘르아살처럼 한국어 관용 표기와 가까운 형태를 택해 가독성을 높였습니다.
theological_decisions:
- issue: 혼인 서술의 직설성
  chosen_reading: ‘이방 여자를 아내로 들인’이라고 직설적으로 옮겨, 본문이 문제 삼는 혼인 상태를 희석하지 않았습니다.
  alternative_readings:
  - ‘이방 여자와 결혼한’
  - ‘외국 여자들과 관계한’
  rationale: 에스라 10장은 혼인 문제를 공적 조사 문맥에서 다루므로, 결혼의 결과를 분명히 드러내는 번역이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: Ezra 10:18; source-context fidelity
