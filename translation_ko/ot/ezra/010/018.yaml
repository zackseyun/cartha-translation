  source_fidelity: 개정이 필요합니다. 원문의 두 번째 מִבְּנֵי는 ‘요사닥의 아들 여호수아와 그의 형제들’에 속한 자손/구성원을 가리키는데, 초안의 ‘여호수아의 아들 요사닥’은 부자 관계를 역전시켰습니다. 또한 אֱלִיעֶזֶר는 엘르아살(엘르아자르/Eleazar)이 아니라 엘리에셀(Eliezer)입니다.
