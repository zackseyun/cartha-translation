  terminology: ‘이방 여인들을 아내로 맞은’은 문맥상 혼인 관계를 드러내면서도 נָשִׁים의 복수를 보존합니다. ‘여호수아’, ‘요사닥’, ‘마아세야’, ‘엘리에셀’, ‘야립’, ‘그달랴’로 음역을 통일합니다.
