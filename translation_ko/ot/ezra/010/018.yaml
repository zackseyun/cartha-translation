revisions:
- from: 그리고 제사장들 가운데서, 곧 이방 여자를 아내로 들인 자들 가운데서, 여호수아의 아들 요사닥의 자손들과 그의 형제들 가운데서 마아세야, 엘르아살, 야립, 그리고 그달랴가 발견되었습니다.[a]
  to: 이방 여인들을 아내로 맞은 제사장들의 자손들 가운데서, 요사닥의 아들 여호수아와 그의 형제들의 자손 가운데 마아세야와 엘리에셀과 야립과 그달랴가 발견되었습니다.[a]
  rationale: 계보의 부자 관계를 원문대로 바로잡고, 엘리에셀의 인명을 정확히 음역했습니다. ‘그의 형제들’이 누구와 어떻게 결속되는지는 히브리어의 계보 목록식 표현을 따라 ‘여호수아와 그의 형제들의 자손’으로 유지하여, 불필요하게 해석을 확정하지 않았습니다. 각주 표지는 본문의 혼인 동사에 붙도록 문장 끝에 유지했습니다.
