revisions:
- from: 그때 에스라는 하나님의 집 앞에서 일어나 여호하난[a] — 엘리아십의 아들 — 의 방으로 가서, 그곳에서 빵을 먹지 않고 물도 마시지 않았습니다[c][b]. 이는 그가 포로 귀환 공동체의 불성실함[b] 때문에 슬퍼하며 애도하고 있었기 때문입니다.
  to: 그때 에스라는 하나님의 집 앞에서 일어나 엘리아십의 아들 여호하난[a]의 방으로 갔습니다. 그는 그곳에서 빵을 먹지 않고 물도 마시지 않았습니다. 이는 그가 포로 귀환 공동체[c]의 신의 저버림[b]을 애도하고 있었기 때문입니다.
  rationale: 각주 표지를 해당 어구에 바로 배치하여 참조 관계를 바로잡았습니다. 본문은 히브리어의 ‘하나님의 집’, ‘방’, ‘빵’, ‘물’이라는 구체적 표현을 유지했습니다. מַעַל은 단순한 성실성 부족으로 오해되지 않도록 관계적·언약적 위반을 나타내는 ‘신의 저버림’으로 조정했으며, 대안은 각주에 보존했습니다. הַגּוֹלָה의 역사적 지시는 본문에서 지나치게 해설하지 않고 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:21Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 전반적으로 히브리어의 순서와 핵심 의미를 잘 따릅니다. 다만 מַעַל의 언약적·관계적 위반 의미에 비해 ‘불성실함’은 현대 한국어에서 업무상 성실성 부족으로도 쉽게 들릴 수 있어 더 적절한 표현으로 조정했습니다. הַגּוֹלָה는 본문에서 과도하게 풀지 않고, 귀환 공동체라는 역사적 지시는 각주로 보완했습니다.
  naturalness: ‘여호하난—엘리아십의 아들—의 방’은 삽입 대시와 조사 결합이 어색하므로 한국어의 자연스러운 소유·계보 어순으로 고쳤습니다. 또한 ‘슬퍼하며 애도하고’는 같은 의미를 중복하므로 ‘애도하고’로 간결하게 했습니다.
  terminology: ‘하나님의 집’은 בית האלהים의 표현을 보존합니다. לשכה는 문맥상 ‘방’으로 유지할 수 있습니다. 여호하난은 히브리어 형태를 반영한 음역으로 적절하며, 요하난을 대안으로 각주 처리했습니다. מַעַל은 ‘신의를 저버림’으로 옮겨 배신·불신실의 의미를 드러냈습니다.
  issues:
  - severity: medium
    issue: 각주 표지가 관련 어구에서 벗어나 있고 순서도 혼재되어 있습니다.
    rationale: c는 ‘물’ 뒤에, b는 ‘물’ 뒤와 ‘불성실함’ 뒤에 중복 배치되어 있어 각주 대상이 불명확합니다. a는 인명, b는 מַעַל, c는 הַגּוֹלָה에 각각 바로 붙여야 합니다.
  - severity: medium
    issue: ‘불성실함’은 מַעַל의 의미를 충분히 전달하지 못할 수 있습니다.
    rationale: 현대 한국어의 ‘불성실함’은 성실성 부족으로 이해될 여지가 있습니다. 이 문맥의 배신·신의 위반의 뜻을 ‘신의를 저버림’으로 더 분명하게 표현하는 것이 안전합니다.
  - severity: low
    issue: 계보 삽입구와 ‘슬퍼하며 애도하고’가 한국어 문장 흐름을 저해합니다.
