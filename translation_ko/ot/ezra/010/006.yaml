  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
  footnotes:
  - marker: a
    text: Or 'Johanan son of Eliashib.'
    reason: lexical_alternative
  - marker: b
    text: '''Unfaithfulness'' could also be rendered ''treachery'' or ''faithlessness.'''
    reason: lexical_alternative
  - marker: c
    text: '''The exiles'' refers to the returned exile community.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 에스라는 하나님의 집 앞에서 일어나 엘리아십의 아들 여호하난[a]의 방으로 갔습니다. 그는 그곳에서 빵을 먹지 않고 물도 마시지 않았습니다. 이는 그가 포로 귀환 공동체[c]의 신의 저버림[b]을 애도하고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요하난’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신의 저버림’은 ‘배신’ 또는 ‘신실하지 못함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘포로 귀환 공동체’는 포로 생활에서 돌아온 이스라엘 공동체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  english_pob_choice: from before the house of God
  chosen_korean: 하나님의 집 앞에서
  alternatives_korean:
  - 하나님의 집에서부터
  - 하나님의 집 앞에서부터
  - 하나님의 집의 앞에서
  lexicon: HALOT
  rationale: 히브리어의 ‘from before’ 공간 표현을 자연스러운 한국어로 살리되, ‘집’의 직접적 표현도 유지했습니다.
- source_word: לִשְׁכַּת
  english_pob_choice: the chamber
  chosen_korean: 방
  alternatives_korean:
  - 방
  - 침실
  - 회랑
  lexicon: HALOT
  rationale: 성전 부속 공간을 가리키지만, 한국어에서는 ‘방’이 가장 자연스럽고 과도한 해석을 덜 합니다.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  english_pob_choice: Jehohanan son of Eliashib
  chosen_korean: 여호하난 — 엘리아십의 아들 —
  alternatives_korean:
  - 예호하난 — 엘리아십의 아들 —
  - 요하난 — 엘리아십의 아들 —
  lexicon: 고유명사 음역
  rationale: 히브리어 형태 יְהוֹחָנָן을 반영해 ‘여호하난’으로 옮겼고, 영어 주석의 대안형도 감안할 수 있도록 각주를 달았습니다.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  english_pob_choice: ate no bread and drank no water
  chosen_korean: 빵을 먹지 않고 물도 마시지 않았습니다
  alternatives_korean:
  - 빵을 먹지 않고 물도 마시지 않았습니다
  - 떡을 먹지 않고 물도 마시지 않았습니다
  - 음식을 먹지 않고 물도 마시지 않았습니다
  lexicon: HALOT
  rationale: ‘빵/물’의 병렬을 유지하면서 현대 한국어에서 즉시 이해되는 표현으로 옮겼습니다. ‘빵’은 히브리어 ‘לֶחֶם’의 구체성을 살립니다.
- source_word: מַעַל
  english_pob_choice: unfaithfulness
  chosen_korean: 불성실함
  alternatives_korean:
  - 불성실함
  - 배신
  - 신실하지 않음
  lexicon: HALOT
  rationale: 언약적 위반의 무게를 살리면서도, 지나치게 법정적이거나 추상적인 ‘배신/신실하지 않음’보다 문맥상 자연스러운 ‘불성실함’을 택했습니다.
- source_word: הַגּוֹלָה
  english_pob_choice: the exiles
  chosen_korean: 포로 귀환 공동체
  alternatives_korean:
  - 포로 귀환 공동체
  - 귀환한 포로들
  - 포로 공동체
  lexicon: HALOT
  rationale: 이 단어가 단순히 과거의 포로가 아니라 귀환한 공동체를 가리키는 점을 영어 각주에 따라 한국어 본문에 반영했습니다.
theological_decisions:
- issue: מַעַל의 신학적 뉘앙스
  chosen_reading: ‘불성실함’으로 번역해 언약적 충실성의 위반을 드러냈습니다.
  alternative_readings:
  - 배신
  - 신실하지 않음
  rationale: 에스라의 슬픔은 단순한 감정 반응이 아니라 공동체의 언약 파기를 향한 애도이므로, 도덕적·언약적 긴장을 함께 담는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘house of God’의 처리
  chosen_reading: ‘하나님의 집’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 성전
  - 하나님의 성전
  rationale: 히브리어의 집(בית) 표현을 유지해 원문 이미지를 살리고, 해설적 치환으로 의미를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
