base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: Now while Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
  footnotes:
  - marker: a
    text: Or, more literally, 'for the people wept with much weeping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에스라가 기도하며 고백하고, 울며 하나님의 집 앞에 엎드려 있을 때, 이스라엘에서 남자들과 여자들과 아이들이 포함된 매우 큰 무리가 그에게 모여들었습니다. 백성이 크게 울었기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘백성이 많은 울음으로 울었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל
  english_pob_choice: while Ezra was praying
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도하는 동안
  - 기도하고 있는 동안
  lexicon: HALOT
  rationale: 동시 진행을 나타내는 접두사 וּכְ를 자연스럽게 살려, 배경 동작인 ‘기도하며’로 옮겼습니다.
- source_word: וּכְהִתְוַדֹּתוֹ
  english_pob_choice: and making confession
  chosen_korean: 죄를 고백하고
  alternatives_korean:
  - 고백하고
  - 자백하고
  lexicon: HALOT
  rationale: 히트파엘형의 ‘고백하다’ 의미를 살리되, 한국어에서 회개의 맥락이 분명하도록 ‘죄를’을 보완했습니다.
- source_word: קָהָל רַב מְאֹד
  english_pob_choice: a very large assembly
  chosen_korean: 매우 큰 회중
  alternatives_korean:
  - 아주 큰 집회
  - 지극히 큰 무리
  lexicon: HALOT
  rationale: קָהָל은 ‘모인 공동체’의 뜻이므로 ‘회중’으로 옮기되, 교회 제도적 뉘앙스를 피하면서 규모를 ‘매우 큰’으로 반영했습니다.
- source_word: הַרְבֵּה בֶכֶה
  english_pob_choice: wept bitterly
  chosen_korean: 크게 울었기
  alternatives_korean:
  - 많이 울었기
  - 몹시 울었기
  lexicon: HALOT
  rationale: ‘많이 울다’의 직역보다, 반복·강조를 가진 לבכי를 한국어의 자연스러운 강도 표현 ‘크게 울다’로 옮겼습니다.
theological_decisions:
- issue: 집회 성격을 어떻게 드러낼 것인가
  chosen_reading: ‘회중’으로 번역해 실제로 모인 사람들의 집합을 나타내되, 후대의 교회 제도 용어로 읽히지 않게 했습니다.
  alternative_readings:
  - 교회
  - 집회
  - 무리
  rationale: 본문은 성전 앞에 모인 이스라엘의 실제 집합을 말하므로, संस्थਿਤ화된 교회보다 중립적이고 공동체적인 ‘회중’이 가장 적합합니다.
  doctrine_reference: 성경 번역의 역사적-문맥적 의미 보존
