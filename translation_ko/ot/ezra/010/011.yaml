source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
  footnotes:
  - marker: a
    text: Or 'make confession to the LORD.' The Hebrew idiom 'give thanks/confession' can carry either sense in context.
    reason: alternative_reading
  - marker: b
    text: Or 'from the foreign wives.' The broader context concerns marriages, though the Hebrew here says 'the foreign women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 야훼께, 곧 조상들의 하나님께 감사드리고 그의 뜻을 행하십시오. 스스로 그 땅의 백성들과 외국 여자들로부터 분리되십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고백하라’입니다. 히브리어 관용구 ‘감사/고백을 드리다’는 문맥에 따라 둘 다 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘외국 아내들로부터’입니다. 더 넓은 문맥은 혼인 문제를 다루지만, 히브리어 본문은 여기서 ‘외국 여자들’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  english_pob_choice: give praise / give thanks
  chosen_korean: 감사드리고
  alternatives_korean:
  - 찬양하고
  - 고백하고
  lexicon: HALOT
  rationale: תוֹדָה는 문맥에 따라 감사, 찬양, 혹은 고백의 뜻을 띨 수 있으므로, 한국어에서는 예배적·회개적 뉘앙스를 함께 담을 수 있는 ‘감사드리다’를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 원문 שם יהוה를 학술 음역인 ‘야훼’로 옮겨 POB의 본문 원칙을 따랐습니다.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: the God of your fathers
  chosen_korean: 조상들의 하나님께
  alternatives_korean:
  - 너희 아버지들의 하나님께
  - 너희 선조들의 하나님께
  lexicon: HALOT
  rationale: 언약적·세대적 연속성을 드러내되 한국어에서는 자연스러운 ‘조상들’로 옮겼습니다.
- source_word: וְהִבָּדְלוּ
  english_pob_choice: Separate yourselves
  chosen_korean: 스스로 … 분리되십시오
  alternatives_korean:
  - 스스로 … 떼어내십시오
  - 구별되십시오
  lexicon: HALOT
  rationale: 니팔 명령형의 반사적 의미를 살려 공동체의 능동적 분리를 분명하게 표현했습니다.
theological_decisions:
- issue: תוֹדָה의 핵심 의미를 감사/찬양/고백 중 어떻게 처리할지
  chosen_reading: 감사드리고
  alternative_readings:
  - 찬양하고
  - 고백하고
  rationale: 이 구절은 순종 명령과 분리 명령이 이어져 죄의 인정이 배경에 있지만, 단어 자체의 기본값은 감사/찬양 쪽에 가깝습니다. 본문에서는 의미를 과도하게 단정하지 않고 ‘감사드리고’로 두어 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
