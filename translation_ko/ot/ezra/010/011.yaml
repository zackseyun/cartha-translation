  terminology: ‘야훼’, ‘하나님’, ‘외국 여자들’은 원문 및 프로젝트의 명명·어휘 선택과 부합합니다. ‘그분의 뜻’은 하나님을 가리키는 현대 한국어의 자연스러운 존대 지시 표현입니다.
  issues:
