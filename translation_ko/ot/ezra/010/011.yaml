  to: 그러므로 이제 야훼께, 곧 여러분 조상들의 하나님께 감사드리십시오[a]. 그리고 그분의 뜻을 행하십시오. 스스로 그 땅의 민족들과 외국 여자들에게서 분리되십시오[b].
