source:
  edition: WLC
  text: וּ/בְנֵ֖י חָרִ֑ם אֱלִיעֶ֧זֶר יִשִּׁיָּ֛ה מַלְכִּיָּ֖ה שְׁמַֽעְיָ֥ה שִׁמְעֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
  footnotes:
  - marker: a
    text: 'Or “the sons of Harim: Eliezer, Isshijah, Malkijah, Shemaiah, and Shimeon,” taking the phrase as a simple list heading rather than explicitly supplying “from.”'
    reason: lexical_alternative
  - marker: b
    text: Isshijah may also be transliterated “Jeshiah” or “Ishijah.”
    reason: lexical_alternative
  - marker: c
    text: Shimeon is traditionally rendered “Simeon.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하림 자손 가운데서는 엘리에셀, 이시야, 말기야, 스마야, 시므온이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하림 자손 가운데서’ 또는 ‘하림 자손은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이시야는 ‘예시야’ 또는 ‘잇시야’로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 시므온은 전통적으로 ‘시므온’으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 … 자손 가운데서는
  alternatives_korean:
  - 그리고 … 자손 중에는
  - 그리고 … 자손에게서
  lexicon: HALOT
  rationale: 목록 문맥에서 특정 집단 안에서 뽑힌 사람들을 가리키므로, ‘from’의 소속·범위 감각을 살려 ‘가운데서는’으로 옮겼습니다. 접속성도 ‘그리고’로 반영했습니다.
- source_word: חָרִם
  english_pob_choice: Harim
  chosen_korean: 하림
  alternatives_korean:
  - 하림
  lexicon: HALOT
  rationale: 고유명사이므로 히브리어 발음을 따라 음역했습니다.
- source_word: יִשִּׁיָּה
  english_pob_choice: Isshijah
  chosen_korean: 이시야
  alternatives_korean:
  - 잇시야
  - 예시야
  - 이슈야
  lexicon: HALOT
  rationale: 히브리어 자음과 모음을 비교적 직접적으로 반영하는 음역을 택했습니다. 영어 전통형보다 원어 투명성을 우선했습니다.
- source_word: מַלְכִּיָּה
  english_pob_choice: Malkijah
  chosen_korean: 말기야
  alternatives_korean:
  - 말키야
  - 말기야후
  lexicon: HALOT
  rationale: 말기야는 히브리어 מלכי־ 계열 이름의 음가를 자연스럽게 반영하는 현대 음역입니다.
- source_word: שְׁמַעְיָה
  english_pob_choice: Shemaiah
  chosen_korean: 스마야
  alternatives_korean:
  - 세마야
  - 쉬마야
  lexicon: HALOT
  rationale: שְׁמַעְיָה를 한국어 음운 체계에 맞게 간결하게 음역했습니다. 영어 관용형보다 원어 자음군을 반영했습니다.
- source_word: שִׁמְעוֹן
  english_pob_choice: Shimeon
  chosen_korean: 시므온
  alternatives_korean:
  - 시메온
  - 쉬메온
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 알려진 전통적 음역을 따르되, 영어 POB의 Shimeon이 주는 원어 투명성은 주석 없이 본문에서 과도하게 살리지 않았습니다.
theological_decisions:
- issue: 목록 서술의 문장 구조
  chosen_reading: 이 절은 단순한 인명 목록이므로 서술을 덧붙이지 않고 집단 소속을 나타내는 범위 표현만 유지했습니다.
  alternative_readings:
  - ‘하림 자손은’으로 더 직접적으로 처리하는 방식
  - ‘하림 자손 가운데서’로 더 좁게 처리하는 방식
  rationale: 히브리어는 개인들을 열거하는 목록 형식이며, POB의 ‘from’은 명시적 포함 범위를 드러내는 보조적 요소입니다. 한국어에서는 자연스러운 목록 문맥을 해치지 않으면서도 그 범위감을 보존했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
