  text: 그리고 하림 자손 중에서는[a] 엘리에셀, 잇시야[b], 말기야, 스마야, 시므온[c]이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그리고 하림 자손은’입니다. 문맥상 하림 자손 가운데 열거된 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잇시야’는 ‘이시야’ 또는 ‘예시야’로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘시므온’은 ‘시메온’으로도 음역할 수 있습니다.
    reason: lexical_alternative
