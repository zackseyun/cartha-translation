  source_fidelity: 원문의 וַיַּעֲבִירוּ קוֹל은 공식적인 공고를 널리 알린 행위이며, לְהִקָּבֵץ는 집결을 요구하는 공고의 목적입니다. 초안의 ‘모이게 했습니다’는 실제로 그들을 모이게 한 결과처럼 들려 공고의 내용/목적을 넘어섭니다. 또한 ‘포로의 자손들’은 현대 한국어에서 포로가 된 사람들의 후손이라는 뜻으로 읽혀, 포로 생활을 겪은 귀환 공동체를 가리키는 히브리어 관용구를 정확히 전달하지 못합니다.
  naturalness: ‘공포하여’와 ‘모이게 했습니다’의 연결은 다소 부자연스럽고, ‘포로의 자손들’은 현대 한국어에서 오해를 낳습니다. ‘…에게 예루살렘에 모이라고 공포했습니다’는 공식 소집 통지라는 문맥과 합쇼체 문체에 자연스럽습니다.
  terminology: ‘공포했습니다’는 행정적·공적인 קוֹל의 성격을 적절히 살립니다. בְּנֵי הַגּוֹלָה는 본문에서는 ‘포로 공동체에 속한 모든 이’로 자연스럽게 옮기고, 각주에서 문자적 표현과 관용적 의미를 밝혀야 합니다. 유다, 예루살렘은 표준 성경 지명 표기와 일치합니다.
