language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲבִ֨ירוּ ק֜וֹל בִּ/יהוּדָ֣ה וִ/ירֽוּשָׁלִַ֗ם לְ/כֹל֙ בְּנֵ֣י הַ/גּוֹלָ֔ה לְ/הִקָּבֵ֖ץ יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'to all the exiles' / 'to all the returned exiles.' Literally, 'to all the sons of the exile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 유다와 예루살렘 전역에서 모든 포로의 자손들에게 공포하여, 그들이 예루살렘에 모이게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘포로의 자손들’입니다. 이 표현은 포로 공동체 전체를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  english_pob_choice: they made a proclamation
  chosen_korean: 공포하여
  alternatives_korean:
  - 선포하여
  - 알려
  - 외쳐
  lexicon: HALOT
  rationale: 동사와 ‘소리/말’의 결합은 공적 공지를 뜻하므로, 행정적·공적 뉘앙스를 살려 ‘공포하다’로 옮겼습니다.
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  english_pob_choice: throughout Judah and Jerusalem
  chosen_korean: 유다와 예루살렘 전역에서
  alternatives_korean:
  - 유다와 예루살렘에서
  - 유다와 예루살렘 안에서
  lexicon: HALOT
  rationale: ב의 분포적 용법을 살려 공지가 널리 퍼졌음을 드러내기 위해 ‘전역에서’로 옮겼습니다.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  english_pob_choice: to all the sons of the exile
  chosen_korean: 모든 포로의 자손들에게
  alternatives_korean:
  - 모든 포로들에게
  - 모든 귀환한 포로들에게
  - 모든 포로의 사람들에게
  lexicon: HALOT
  rationale: 직역하면 ‘포로의 자손들’이지만, 한국어에서는 ‘포로의 자손들’보다 ‘포로의 자손들/포로의 사람들’보다도 공동체를 더 자연스럽게 가리키는 ‘포로의 자손들’ 계열이 적절하여, 성별 포괄을 무리하게 바꾸지 않으면서도 이해 가능하도록 유지했습니다.
- source_word: לְהִקָּבֵץ
  english_pob_choice: that they should gather
  chosen_korean: 모이게 했습니다
  alternatives_korean:
  - 모이도록 했습니다
  - 모이게 하였습니다
  - 모이게 하라는 공포를 했습니다
  lexicon: HALOT
  rationale: 니팔 부정사의 목적을 자연스러운 한국어 결과절로 풀어, 공포의 목적이 ‘모이게 함’임을 분명히 했습니다.
theological_decisions:
- issue: 전달 행위의 성격
  chosen_reading: 행정적 공지로서의 공포를 드러내는 번역을 택했습니다.
  alternative_readings:
  - 선포
  - 알림
  - 외침
  rationale: 본문은 단순한 음성 발화보다 공식적인 집결 통보의 성격이 강하므로, 독자가 공동체적 소집을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문 맥락(포로 귀환 공동체의 집결 명령)
