  - 알림
  - 외침
  rationale: 본문은 단순한 음성 발화보다 공식적인 집결 통보의 성격이 강하므로, 독자가 공동체적 소집을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문 맥락(포로 귀환 공동체의 집결 명령)
