revisions:
- from: 그러므로 유다와 베냐민의 모든 남자들이 세 날 안에 예루살렘에 모였습니다[a]. 때는 아홉째 달, 곧 그 달의 스무째 날이었습니다. 그리고 모든 백성은 하나님의 집의 넓은 광장에 앉아, 이 일과 비 때문에 떨고 있었습니다[c][b].
  to: 그러자 유다와 베냐민의 모든 남자들이[b] 사흘 안에 예루살렘에 모였습니다[a]. 때는 아홉째 달, 곧 그 달 스무째 날이었습니다. 온 백성이 하나님의 집 앞 넓은 광장에[c] 앉아 이 일과 비 때문에 떨고 있었습니다.
  rationale: 원문의 단순한 서사 연결을 ‘그러자’로 보존하고, 현대 한국어의 자연스러운 시간 표현인 ‘사흘’을 사용했습니다. 공간 표현은 원문의 רחוב이 가리키는 열린 장소를 유지하면서 한국어 소유격 중첩을 피했습니다. 남성 표지, 날짜, 떨림의 두 원인, 그리고 ‘하나님의 집’이라는 용어는 유지했습니다. 중복된 각주 a와 불명확한 각주 표지 배치를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:16Z'
