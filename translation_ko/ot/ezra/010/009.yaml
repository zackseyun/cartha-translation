  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַיִּקָּבְצוּ는 앞 문맥의 기한 명령에 대한 이행이지만 접속사 וַ는 ‘그러므로’라는 논리적 귀결을 명시하지 않으므로 ‘그러자’가 더 정확합니다. 또한 גְּשָׁמִים는 복수형으로 비/큰비/비바람을 가리킬 수 있으나, 근거 없이 ‘heavy’를 확정할 필요는 없으며 ‘비’가 안전합니다.
  naturalness: 합쇼체 서술은 자연스럽습니다. ‘하나님의 집의 넓은 광장’은 소유격이 겹쳐 다소 어색하므로 ‘하나님의 집 앞 넓은 광장’이 현대 한국어에서 더 자연스럽고, 원문의 열린 공간이라는 뜻도 잘 드러냅니다. ‘세 날’보다 ‘사흘’이 자연스럽습니다.
  terminology: ‘하나님의 집’은 בֵּית הָאֱלֹהִים에 충실하며 유지할 수 있습니다. אַנְשֵׁי의 남성 표지와 이후 כָל־הָעָם의 포괄적 표현도 각각 ‘모든 남자들’과 ‘온 백성’으로 구별해 유지했습니다. 각주 a는 본문과 동일한 표현을 대안으로 제시하여 기능하지 않으므로 ‘집결했습니다’로 바로잡아야 합니다. 각주 표지는 해당 어구 바로 뒤에 붙여야 합니다.
