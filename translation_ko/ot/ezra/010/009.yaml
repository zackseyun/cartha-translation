  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
  footnotes:
  - marker: a
    text: Or 'assembled.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the men of Judah and Benjamin'; the wording is grammatically masculine and likely refers to the male members or representatives summoned to the assembly.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the plaza before the house of God.' The Hebrew refers to a broad open area, not necessarily an inner court.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유다와 베냐민의 모든 남자들이 세 날 안에 예루살렘에 모였습니다[a]. 때는 아홉째 달, 곧 그 달의 스무째 날이었습니다. 그리고 모든 백성은 하나님의 집의 넓은 광장에 앉아, 이 일과 비 때문에 떨고 있었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모였습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유다와 베냐민의 모든 남자들’이며, 문법상 남성형으로 소집된 남성 대표자들 또는 가구 대표자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 집 앞 광장에.’ 히브리어는 성전 안쪽 뜰이라기보다 넓은 열린 공간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  english_pob_choice: gathered
  chosen_korean: 모였습니다
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  - 모여들었습니다
  lexicon: HALOT
  rationale: נִפְעַל형 קבץ는 단순한 집합/모임을 뜻하므로, 자연스러운 서술문인 ‘모였습니다’로 옮겨 집단 이동의 결과를 살렸습니다.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  english_pob_choice: all the men of Judah and Benjamin
  chosen_korean: 유다와 베냐민의 모든 남자들
  alternatives_korean:
  - 유다와 베냐민의 모든 사람들
  - 유다와 베냐민의 모든 남성들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘~의 남자들’이므로, 성별 표지를 지우지 않고 ‘모든 남자들’로 옮겼습니다.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  english_pob_choice: within the three days
  chosen_korean: 세 날 안에
  alternatives_korean:
  - 사흘 안에
  - 세 날 이내에
  lexicon: HALOT
  rationale: 정해진 기한 안의 도착을 뜻하므로, 기한성을 분명히 하는 ‘세 날 안에’를 택했습니다.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  english_pob_choice: in the open square of the house of God
  chosen_korean: 하나님의 집의 넓은 광장
  alternatives_korean:
  - 하나님의 집 앞 광장
  - 하나님의 집 뜰
  lexicon: HALOT
  rationale: רְחוֹב은 성전 ‘뜰’보다 넓은 열린 공간을 가리키므로, ‘넓은 광장’으로 옮겨 공간 감각을 보존했습니다.
- source_word: מַרְעִידִים
  english_pob_choice: trembling
  chosen_korean: 떨고 있었습니다
  alternatives_korean:
  - 떨고 있었습니다
  - 전율하고 있었습니다
  - 몸을 떨고 있었습니다
  lexicon: HALOT
  rationale: רעד의 히필 분사는 두려움과 신체적 떨림을 함께 드러내므로, 진행 상황을 살린 ‘떨고 있었습니다’가 적절합니다.
theological_decisions:
- issue: עַל הַדָּבָר / וּמֵהַגְּשָׁמִים의 원인 표현
  chosen_reading: ‘이 일과 비 때문에’로 옮겨, 사태 자체와 날씨가 함께 그들의 떨림의 원인임을 유지했습니다.
  alternative_readings:
  - ‘그 일과 비 때문에’
  - ‘그 문제와 비 때문에’
  rationale: הַדָּבָר는 특정한 문제/사안을 가리키는 지시적 표현이므로 ‘이 일’이 문맥의 긴박함을 가장 직접적으로 드러냅니다. 또한 גְּשָׁמִים는 단순한 물방울이 아니라 비로 내리는 기상 현상을 가리키므로, 추가 수식 없이 ‘비’로 옮겼습니다.
  doctrine_reference: 문맥 충실성; 해석 과잉 방지
