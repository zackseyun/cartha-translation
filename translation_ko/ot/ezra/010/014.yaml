revisions:
- from: 우리 지도자들이 온 회중을 대표하여 서게 하시고, 우리 성읍들에 있는 모든 사람 곧 외국 여인을 아내로 맞이한 사람들은 정해진 때마다 그들, 각 성읍의 장로들과 그 성읍의 재판관들과 함께 오게 하십시오. 그러면 우리 하나님의 타오르는 분노가 이 일로 말미암아 우리에게서 돌이킬 것입니다.[a][b]
