  verdict: revise
  source_fidelity: 원문의 청유/제안 형식과 '…까지'의 지속·목적 범위를 살려야 합니다. 초안의 '그러면 … 돌이킬 것입니다'는 히브리어의 עַד לְהָשִׁיב(… 돌이킬 때까지)을 결과에 대한 직설적 미래 진술로 바꾸므로 수정이 필요합니다. 또한 וְעִמָּהֶם은 해당 당사자들과 지방 장로들 및 재판관들이 함께 출석하는 뜻으로 자연스럽게 연결하는 것이 좋습니다.
