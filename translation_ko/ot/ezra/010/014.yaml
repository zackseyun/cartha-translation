  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
  footnotes:
  - marker: a
    text: Or 'who has married foreign women.' The Hebrew idiom is literally 'has caused to dwell / has settled' foreign wives, referring to taking them into the household as wives.
    reason: lexical_alternative
  - marker: b
    text: Or 'until the fierce anger of our God is turned away from us concerning this matter.'
    reason: alternative_reading
translation:
  language: ko
  text: 우리 지도자들이 온 회중을 대표하여 서게 하시고, 우리 성읍들에 있는 모든 사람 곧 외국 여인을 아내로 맞이한 사람들은 정해진 때마다 그들, 각 성읍의 장로들과 그 성읍의 재판관들과 함께 오게 하십시오. 그러면 우리 하나님의 타오르는 분노가 이 일로 말미암아 우리에게서 돌이킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '외국 여자들을 아내로 맞이한 사람들'. 히브리어 관용구는 문자적으로는 '거주시키다/들여앉히다'를 뜻하며, 아내로 들인 혼인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '우리 하나님의 맹렬한 분노가 이 일에 관하여 우리에게서 돌이킬 때까지'.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא שָׂרֵינוּ לְכָל הַקָּהָל
  english_pob_choice: Please let our leaders stand for the whole assembly
  chosen_korean: 우리 지도자들이 온 회중을 대표하여 서게 하시고
  alternatives_korean:
  - 우리 지도자들이 온 회중 앞에 서게 하시고
  - 우리 지도자들이 온 회중을 위하여 서게 하시고
  lexicon: HALOT
  rationale: נָא가 붙은 청유형을 한국어 청원문으로 옮기고, שָׂרִים은 행정적 문맥에 맞게 '지도자들'로 표현했습니다. לְכָל הַקָּהָל은 단순 위치가 아니라 대표 기능을 드러내므로 '대표하여'로 옮겼습니다.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  english_pob_choice: who has taken foreign wives
  chosen_korean: 외국 여인을 아내로 맞이한 사람들은
  alternatives_korean:
  - 외국 아내를 둔 사람들은
  - 외국 여인들을 아내로 맞이한 사람들은
  lexicon: HALOT
  rationale: 히브리어 관용구는 거주시키다/들여앉히다의 혼인 관용으로, 자연스러운 한국어로는 '아내로 맞이하다'가 의미를 잘 드러냅니다. '여인'은 'נשים'의 성별을 반영하되, 결혼 관계는 뒤에서 분명히 했습니다.
- source_word: לְעִתִּים מְזֻמָּנִים
  english_pob_choice: at appointed times
  chosen_korean: 정해진 때마다
  alternatives_korean:
  - 지정된 때마다
  - 약정된 시각마다
  lexicon: HALOT
  rationale: 공적 심리 절차의 정기성을 나타내므로 '정해진 때마다'가 가장 자연스럽고, 시간의 배정/지정을 드러냅니다.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  english_pob_choice: with them the elders of each city and its judges
  chosen_korean: 그들, 각 성읍의 장로들과 그 성읍의 재판관들과 함께
  alternatives_korean:
  - 각 성읍의 장로들과 그 재판관들과 함께
  - 그들과 함께 각 성읍의 장로들과 재판관들과
  lexicon: HALOT
  rationale: עִיר וָעִיר의 분배적 의미를 살려 '각 성읍'으로 옮기고, שֹׁפְטִים은 문맥상 '재판관들'이 적절합니다. 대명사 '그들'을 앞에 두어 조사 구조를 한국어에 맞췄습니다.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  english_pob_choice: the burning anger of our God
  chosen_korean: 우리 하나님의 타오르는 분노
  alternatives_korean:
  - 우리 하나님의 불타는 분노
  - 우리 하나님의 격렬한 진노
  lexicon: HALOT
  rationale: חרון אף의 관용적 이미지인 '불붙는/타오르는 분노'를 살려 직역적이면서도 읽기 쉬운 표현을 택했습니다. '진노'보다 '분노'가 어구의 불길 이미지를 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 공동체적 청원과 심판 회복의 표현
  chosen_reading: 우리에게서 돌이킬 것입니다
  alternative_readings:
  - 우리에게서 거둬질 것입니다
  - 우리에게서 떠날 것입니다
  rationale: סוּר/הָשִׁיב의 결과를 수동적으로 받아 공동체에 임한 분노가 물러나는 뜻을 살렸습니다. 주어를 자연스럽게 '분노'로 두어 하나님의 심판적 반응을 희석하지 않았습니다.
  doctrine_reference: Ezra 10:14의 회개-심판-회복 구조
- issue: 혼인 대상의 문화적 뉘앙스
  chosen_reading: 외국 여인
  alternative_readings:
  - 이방 여자
  - 타국 여인
  rationale: 원문의 נָכְרִיּוֹת는 혈통적/언약적 타자성을 지시하므로, 과도한 현대적 문화 해석을 피하면서도 '외국'으로 비교적 중립적으로 옮겼습니다. 다만 문맥상 혼인 문제임을 분명히 했습니다.
  doctrine_reference: 본문의 언약적 순결 문제
