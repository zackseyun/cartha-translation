  rationale: 청유형 '부디 … 하십시오'를 유지하고, 출석 절차가 하나님의 분노가 이 일로 말미암아 공동체에게서 돌이킬 때까지 계속되도록 제안하는 원문의 범위를 회복했습니다. '그들과 함께'의 동반 출석 관계를 자연스러운 한국어 어순으로 재구성했으며, 각주 표지를 해당 어구에 붙였습니다.
