translation:
  language: ko
  text: 이 모든 사람은 외국 여자들과 결혼했습니다. 그들 가운데에는 자녀를 둔 아내들이 있는 이들도 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로는 ‘그들 가운데 아내들이 있었고, 그들이 아들들을 두었다’ 정도입니다. 끝 구절은 매우 간결하고 다소 어렵습니다. 여기서는 아내들이 자녀를 둔 것으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘아들들’입니다. 문맥상 더 넓게 ‘자녀’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂא/נשא/י ... נָשִׁים
  english_pob_choice: had married foreign women
  chosen_korean: 외국 여자를 아내로 맞이했고
  alternatives_korean:
  - 외국 여자들을 취했고
  - 외국 여자들과 결혼했고
  lexicon: HALOT
  rationale: נשא의 관용적 결혼 용례를 한국어에서 자연스럽고 공손한 합쇼체로 옮기기 위해 ‘아내로 맞이하다’를 택했습니다. ‘외국’은 נָכְרִיּוֹת의 민족·언약적 경계성을 드러냅니다.
- source_word: וְיֵשׁ מֵהֶם
  english_pob_choice: and some of them
  chosen_korean: 그들 가운데 어떤 이들은
  alternatives_korean:
  - 그리고 그들 가운데는
  - 그들 중 어떤 이들은
  lexicon: HALOT
  rationale: 존재구문 יֵשׁ + מֵהֶם을 한국어에서 간결하게 살리면서도 문맥상 자연스럽게 전달하기 위해 이 표현을 사용했습니다.
- source_word: וַיָּשִׂימוּ בָּנִים
  english_pob_choice: had children
  chosen_korean: 자녀를 두었습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 בָּנִים은 문자상 ‘아들들’이지만, 이 문맥에서는 그 결합에서 난 후손 전체를 가리킬 수 있어 더 넓은 ‘자녀’를 택했습니다. ‘두다’는 결과를 서술하는 축약적 표현을 자연스럽게 반영합니다.
theological_decisions:
- issue: 나그네/외국 여성과의 결혼이 지닌 언약적 함의
  chosen_reading: ‘외국 여자’로 옮겨, 단순한 지리적 외국인이라기보다 공동체 경계 밖의 여성을 가리키는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘외국 아내들’
  - ‘이방 여자들’
  rationale: 본문의 초점은 민족적·언약적 경계 위반에 있으며, 이를 한국어에서 너무 완화하지 않으면서도 현대어로 읽히게 하기 위한 선택입니다.
  doctrine_reference: Ezra 9–10의 언약 순결과 공동체 구별
