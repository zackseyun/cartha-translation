  - 이 일에 대항했고
  lexicon: HALOT
  rationale: 히브리어의 ‘서다’ 이미지를 과도하게 살리기보다, 여기서는 제안/결정에 대한 명백한 반대라는 뜻을 한국어로 분명하게 전달했습니다.
