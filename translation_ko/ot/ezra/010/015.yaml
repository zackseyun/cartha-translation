base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
  footnotes:
  - marker: a
    text: Or 'Jahaziah son of Tikvah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'helped them' or 'assisted them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아사헬의 아들 요나단과 디그와의 아들 야흐지야만이 이 일에 반대했고, 므술람과 레위 사람 샤브대가 그들을 도왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야하지야의 아들 티크와’로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 도왔다’/‘그들을 지원했다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 그러나 …만이
  alternatives_korean:
  - 오직 …만이
  - 다만 …만이
  lexicon: HALOT
  rationale: 제한의 뜻을 살리되, 문맥상 앞선 결의와의 대비를 한국어로 자연스럽게 드러내기 위해 ‘그러나 …만이’로 옮겼습니다.
- source_word: עָמְדוּ עַל זֹאת
  english_pob_choice: stood against this
  chosen_korean: 이 일에 반대했고
  alternatives_korean:
  - 이 일에 맞섰고
  - 이 문제에 서서 반대했고
  - 이 일에 대항했고
  lexicon: HALOT
  rationale: 히브리어의 ‘서다’ 이미지를 과도하게 살리기보다, 여기서는 제안/결정에 대한 명백한 반대라는 뜻을 한국어로 분명하게 전달했습니다.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  english_pob_choice: Jahzeiah son of Tikvah
  chosen_korean: 디그와의 아들 야흐지야
  alternatives_korean:
  - 디그와의 아들 야하지야
  - 디그와의 아들 야흐즈야
  lexicon: HALOT
  rationale: 영어 POB의 표기와는 별개로, 본문의 자음형에 따라 이름을 옮기고, 기존 전통 표기와의 차이는 footnote로 처리했습니다.
- source_word: וַ/יַּחְזְיָה
  english_pob_choice: Jahzeiah / Jahaziah (alternative)
  chosen_korean: 야흐지야
  alternatives_korean:
  - 야하지야
  - 야흐즈야
  lexicon: source_note
  rationale: 이 인명은 자음 배열상 여러 전사 가능성이 있어, 본문에는 하나의 읽기를 택하되 대안 표기를 주석으로 남겼습니다.
- source_word: עֲזָרֻם
  english_pob_choice: supported them
  chosen_korean: 그들을 도왔습니다
  alternatives_korean:
  - 그들을 지원했습니다
  - 그들을 도와주었습니다
  lexicon: HALOT
  rationale: 원뜻인 ‘돕다/지원하다’를 따라, 문맥상 입장을 함께한 이들의 지지 행위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 반대와 지지의 대비 표현
  chosen_reading: ‘이 일에 반대했고’와 ‘그들을 도왔습니다’로 서로 맞서는 입장 차이를 분명히 드러냈습니다.
  alternative_readings:
  - ‘이 일에 맞섰고’/‘그들을 지지했습니다’
  - ‘이 결정에 대항했고’/‘그들을 지원했습니다’
  rationale: 본문은 소수의 반대자와 그들을 도운 동조자를 대비시키므로, 한국어에서도 입장 대립이 선명하게 읽히도록 했습니다.
  doctrine_reference: 서사 문맥의 공적 판단과 공동체적 분별
