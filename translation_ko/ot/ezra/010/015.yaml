revisions:
- from: 그러나 아사헬의 아들 요나단과 디그와의 아들 야흐지야만이 이 일에 반대했고, 므술람과 레위 사람 샤브대가 그들을 도왔습니다.[a][b]
  to: 오직 아사헬의 아들 요나단과 디과의 아들 야스야만이 이 일에 반대하였고, 므술람과 레위 사람 삽브대는 그들을 도왔습니다.[a][b]
  rationale: 제한사 אַךְ를 ‘오직’으로 옮겨 원문의 예외·한정 기능을 보존했습니다. 원문 및 영어 감사 기록의 인명 대안은 야스야(יַחְזְיָה)의 대안 표기만을 다루므로, 잘못 뒤바뀐 부칭을 바로잡았습니다. 또한 통용 한국어 성경 인명 표기를 사용하고, 동사 עזר의 유효한 대안 번역을 각주에 제시했습니다.
