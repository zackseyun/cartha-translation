translation:
  language: ko
  text: 오직 아사헬의 아들 요나단과 디과의 아들 야스야만이 이 일에 반대하였고, 므술람과 레위 사람 삽브대는 그들을 도왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘디과의 아들 야하지야’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 지원했습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
