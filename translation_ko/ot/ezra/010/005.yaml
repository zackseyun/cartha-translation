base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
  footnotes:
  - marker: a
    text: Or 'according to this matter' or 'according to this proposal.' The Hebrew word can refer either to a spoken word or to the matter under discussion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 에스라가 일어나서 제사장들의 지도자들과 레위 사람들과 온 이스라엘에게 이 말대로 행하라고 맹세하게 하였고, 그들도 맹세하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 여기서 ‘말’뿐 아니라 ‘일, 문제, 제안’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어났습니다
  - 자리에서 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행에서 에스라의 결단 있는 행동 개시를 자연스럽게 드러내며, POB의 ‘arose’가 가진 격식을 한국어로 살렸습니다.
- source_word: שָׂרֵי הַכֹּהֲנִים
  english_pob_choice: the chief priests
  chosen_korean: 제사장들의 지도자들
  alternatives_korean:
  - 제사장들의 우두머리들
  - 대제사장들
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘지도자들, 통치자들’의 뜻이므로 직함화된 ‘대제사장들’보다 직역성이 높은 ‘제사장들의 지도자들’로 옮겼습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: according to this word
  chosen_korean: 이 말대로
  alternatives_korean:
  - 이 일대로
  - 이 문제대로
  - 이 제안대로
  lexicon: HALOT
  rationale: דָּבָר가 ‘말, 일, 문제, 제안’ 모두를 가질 수 있으므로, 문맥상 제시된 구체적 요구를 포괄하면서도 한국어에서 가장 자연스러운 ‘이 말대로’를 택했습니다.
- source_word: וַיִּשָּׁבֵעוּ
  english_pob_choice: and they swore
  chosen_korean: 맹세하였습니다
  alternatives_korean:
  - 맹세했습니다
  - 서약하였습니다
  lexicon: HALOT
  rationale: 히브리어의 반복을 그대로 살리되, 한국어에서는 뒤의 ‘그들도’와 함께 한 번만 명시해도 의미가 전달되므로 과도한 반복을 줄여 자연스럽게 표현했습니다.
theological_decisions:
- issue: 서사적 서약 장면의 강도
  chosen_reading: ‘맹세하게 하였고… 그들도 맹세하였습니다’로, 강제적 서약의 성격을 분명히 드러냈습니다.
  alternative_readings:
  - ‘서약하도록 했고… 그들도 서약했습니다’
  - ‘맹세하도록 했고… 그들도 맹세했습니다’
  rationale: 동사는 단순한 동의가 아니라 공식적인 oath-taking을 뜻하므로, ‘맹세’ 계열을 유지해 본문의 엄중함을 보존했습니다.
  doctrine_reference: 서사/언약적 서약의 표지
