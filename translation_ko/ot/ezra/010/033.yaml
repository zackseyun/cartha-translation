lexical_decisions:
- source_word: מִ/בְּנֵי
  english_pob_choice: From the sons of
  chosen_korean: 자손들 가운데서는
  alternatives_korean:
  - ~의 자손들
  - 자손들 중에서
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 구성원들을 집합에서 뽑아 열거하는 의미를 살려, 자연스러운 한국어로 ‘~의 자손들 가운데서는’으로 옮겼습니다.
- source_word: חָשֻׁם
  english_pob_choice: Hashum
  chosen_korean: 하다스
  alternatives_korean:
