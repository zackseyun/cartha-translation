  source_fidelity: 원문은 하숨(חָשֻׁם) 가문에서 나온 일곱 사람의 이름을 열거합니다. 초안의 ‘하다스’는 חָשֻׁם에 대응하지 않으며, ‘자밧’과 ‘예레마이’도 한국어 성경 인명 표기 관례 및 해당 히브리어 이름의 통상적 음역과 조정하는 것이 적절합니다.
  naturalness: ‘~의 자손들 가운데서는’과 ‘있었습니다’는 현대 격식체 문장으로 자연스럽습니다. 다만 열거 인명은 한국어 성경에서 널리 쓰이는 표기를 사용하면 독자성이 좋아집니다.
  terminology: חָשֻׁם은 ‘하숨’, מַתְּנַי는 ‘맛드내’, זָבָד은 ‘사밧’, יְרֵמַי는 ‘예레매’로 표기했습니다. מַתַּתָּה, אֱלִיפֶלֶט, מְנַשֶּׁה, שִׁמְעִי는 각각 ‘맛다다, 엘리벨렛, 므낫세, 시므이’가 적절합니다. 초안의 각주가 주장하는 ‘하다스=Hashum’ 대응은 음역상 성립하지 않으므로 삭제했습니다.
