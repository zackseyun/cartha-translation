  - 하슘
  lexicon: HALOT
  rationale: 히브리어 인명 חָשֻׁם은 표준 한국어 음역에서 ‘하숨’에 가깝지만, 본 기록의 기존 영어 음역(Hashum)을 따라 계통적으로 적되 한국어 음역 표기는 문맥상 필요 최소한으로만 반영했습니다.
- source_word: מַתַּתָּה
  english_pob_choice: Mattattah
  chosen_korean: 맛다다
  alternatives_korean:
  - 맛다타
  - 맛다다
  lexicon: HALOT
  rationale: 쌍자음 תּ을 반영해 한국어로는 ‘맛다다’로 적어 영어 POB의 Mattattah라는 음가를 최대한 가깝게 보존했습니다.
- source_word: שִׁמְעִי
  english_pob_choice: Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 시미
  - 시메이
  lexicon: HALOT
  rationale: 이름 끝의 -י를 한국어에서 흔히 ‘-이’로 옮기는 관행을 따르되, 성경 인명에서 널리 쓰이는 음역을 유지했습니다.
