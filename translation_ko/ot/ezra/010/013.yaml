  source_fidelity: 본문의 대조(‘그러나’), 많은 백성, 비가 오는 때, 밖에 서 있을 힘이 없음, 일이 하루나 이틀 안에 끝나지 않음, 그리고 이 일에서 크게 범죄하였다는 인과관계가 충실히 보존되었습니다. 다만 각 대안 번역 각주의 표지가 관련 어구가 아니라 문단 끝에 함께 놓여 있어, 각주가 가리키는 원어 표현을 분명히 하도록 옮기는 것이 좋습니다.
  naturalness: 합쇼체 문체는 일관되고 자연스럽습니다. ‘하루나 이틀 만에 끝날 일이 아닙니다’도 이해 가능하나, ‘마칠 일이 아닙니다’가 과업의 완료를 더 직접적으로 나타냅니다.
