  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
  footnotes:
  - marker: a
    text: Or 'the time is one of rains.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the work cannot be done in one day or two.'
    reason: lexical_alternative
  - marker: c
    text: Or 'we have sinned greatly in this matter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성이 많고 비가 오는 시기라서 밖에 서 있을 힘이 없습니다. 이 일은 하루나 이틀 만에 끝날 일이 아닙니다. 우리가 이 일로 크게 범죄하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘때가 비의 시기이다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 일은 하루나 이틀 만에 끝낼 수 없습니다.’
    reason: alternative_reading
  - marker: c
    text: 또는 ‘우리가 이 일로 크게 죄를 지었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם רָב
  english_pob_choice: the people are many
  chosen_korean: 백성이 많고
  alternatives_korean:
  - 백성이 매우 많고
  - 백성이 많은데
  lexicon: HALOT
  rationale: 집합 명사 ‘백성’에 형용사적 서술 ‘많고’를 붙여, 본문의 단순한 수적 많음을 자연스러운 한국어로 살렸습니다.
- source_word: וְהָעֵת גְּשָׁמִים
  english_pob_choice: it is the rainy season
  chosen_korean: 비가 오는 시기라서
  alternatives_korean:
  - 비의 시기라서
  - 장마철이라서
  lexicon: HALOT
  rationale: 직역형 ‘비의 시기’보다 현재 상황을 바로 드러내는 ‘비가 오는 시기’가 원문의 계절적 배경을 더 분명하게 전달합니다.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  english_pob_choice: there is no strength to stand outside
  chosen_korean: 밖에 서 있을 힘이 없습니다
  alternatives_korean:
  - 밖에 버틸 힘이 없습니다
  - 야외에 서 있을 힘이 없습니다
  lexicon: HALOT
  rationale: ‘힘이 없다’는 무능력을 자연스럽게 풀되, ‘서 있다’는 동작을 유지해 비를 견디며 밖에 버티는 뜻을 살렸습니다.
- source_word: לִפְשֹׁעַ
  english_pob_choice: transgressed
  chosen_korean: 범죄하였기
  alternatives_korean:
  - 죄를 지었기
  - 범하였기
  lexicon: HALOT
  rationale: 문맥상 단순 실수보다 언약적 위반의 무게가 강하므로, 비교적 강한 ‘범죄하다’를 택했습니다. 다만 본문이 그 범죄의 유형을 여기서 더 세분하지는 않도록 유지했습니다.
theological_decisions:
- issue: לִפְשֹׁעַ의 도덕적·언약적 무게
  chosen_reading: ‘크게 범죄하였기’로 옮겨, 죄의 중대성을 드러내되 추가 설명은 붙이지 않았습니다.
  alternative_readings:
  - 크게 죄를 지었기
  - 크게 반역하였기
  rationale: 본문은 공동체의 심각한 위반을 고백하지만, 여기서 정치적 반역이나 특정 교리 범주까지 확정하지는 않습니다. 원문의 긴장을 그대로 남기는 쪽이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
