  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
  footnotes:
  - marker: a
    text: Or, 'the matter is upon you' or 'this responsibility is yours.' The Hebrew idiom indicates that the charge for dealing with this issue rests with Ezra.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오. 이 일은 당신에게 맡겨졌고, 우리는 당신과 함께 있습니다. 강하게 하시고 그것을 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘그 일이 당신 위에 있습니다’이며 책임이나 담당이 당신에게 맡겨졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나라
  - 일어서십시오
  lexicon: HALOT
  rationale: 즉각적인 행동을 촉구하는 명령형을 자연스러운 현대 한국어 합쇼체로 옮겼습니다. ‘일어서십시오’보다 단순한 동작의 개시와 결단을 더 직접적으로 드러냅니다.
- source_word: עָלֶיךָ הַדָּבָר
  english_pob_choice: this matter is on you
  chosen_korean: 이 일은 당신에게 맡겨졌고
  alternatives_korean:
  - 이 일은 당신에게 있습니다
  - 이 책임은 당신의 몫입니다
  - 이 일은 당신 위에 있습니다
  lexicon: HALOT
  rationale: ‘על + 인칭대명사’의 책임/부담 관용구를 살리되, 한국어에서 자연스럽고 공적인 문맥에 맞게 ‘맡겨지다’로 풀었습니다. 단순한 위치 표현보다 담당과 책임의 뉘앙스를 더 분명히 전합니다.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  english_pob_choice: and we are with you
  chosen_korean: 우리는 당신과 함께 있습니다
  alternatives_korean:
  - 우리는 당신 편입니다
  - 우리는 당신 곁에 있습니다
  lexicon: HALOT
  rationale: 연대와 지지를 나타내는 직접적인 표현이므로 ‘함께 있습니다’가 가장 무난하고 본문에 가깝습니다.
- source_word: חֲזַק
  english_pob_choice: Be strong
  chosen_korean: 강하게 하시고
  alternatives_korean:
  - 강해지십시오
  - 담대하십시오
  - 굳세십시오
  lexicon: HALOT
  rationale: 직역을 유지하면서도 한국어에서 어색하지 않게 동사의 상태/행동을 살렸습니다. 다만 ‘be strong’의 명령형 힘을 보존하기 위해 완전한 의역 대신 짧은 권면형으로 처리했습니다.
- source_word: וַעֲשֵׂה
  english_pob_choice: and do it
  chosen_korean: 그것을 행하십시오
  alternatives_korean:
  - 그 일을 하십시오
  - 행하십시오
  - 실행하십시오
  lexicon: HALOT
  rationale: 앞에서 언급된 ‘이 일/이 일(문제)’을 가리키는 지시를 한국어로 명시해, 단순한 ‘하다’보다 결단과 수행을 더 분명히 드러냈습니다.
theological_decisions:
- issue: 책임의 귀속과 공동 동행의 긴장
  chosen_reading: 이 일의 부담과 책임이 에스라에게 있으나, 공동체는 그와 함께 서서 실행을 권면합니다.
  alternative_readings:
  - 단순한 위로의 말로만 읽는 것
  - 책임이 공동체 전체에 있다는 뜻으로 완화하는 것
  rationale: 히브리어 관용구는 실제 책임의 귀속을 말하면서도 공동체의 지지를 함께 제시합니다. 둘을 모두 살려야 본문의 권면이 약화되지 않습니다.
  doctrine_reference: 성경 본문의 책임 귀속과 공동체적 연대에 대한 일반 원리
