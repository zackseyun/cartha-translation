lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 중에서는
  alternatives_korean:
  - 그리고 …에서
  - … 중에는
  lexicon: HALOT
  rationale: 목록 안의 하위 집단을 이어 주는 연결과 소속을 함께 살리기 위해 ‘그리고 … 중에서는’으로 옮겼습니다.
- source_word: הַמְשֹׁרְרִים
  english_pob_choice: the singers
  chosen_korean: 노래하는 사람들
  alternatives_korean:
  - 찬양하는 사람들
  - 노래하는 자들
  - 성가대원들
  lexicon: HALOT
  rationale: 성전 봉사 문맥의 분사형을 한국어에서는 직역보다 자연스러운 ‘노래하는 사람들’로 옮겨 직능을 분명히 했습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문을 지키는 사람들
  - 성문 지기들
  - 문지키는 자들
  lexicon: HALOT
  rationale: 성전/공동체 행정 문맥에서 שערים은 문을 지키는 이들을 뜻하므로, 표준적이고 간결한 ‘문지기들’을 택했습니다.
theological_decisions:
- issue: 열거 구조의 보존
  chosen_reading: ‘노래하는 사람들’과 ‘문지기들’이라는 두 봉사 집단을 각각 따로 제시해, 본문의 행정적 열거성을 유지했습니다.
  alternative_readings:
  - 두 집단을 한 문장으로 합쳐 완만하게 재구성하는 방식
  - 직책을 일반화해 의미를 넓히는 방식
  rationale: 이 절은 신학적 해설보다 명단 형식의 기록이 핵심이므로, 본문의 분류와 배열을 그대로 드러내는 쪽이 좋습니다.
  doctrine_reference: 본문 관찰에 따른 번역 원칙
