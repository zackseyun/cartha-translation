  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
  footnotes:
  - marker: a
    text: Or “foreign wives.” The Hebrew phrase is literally “foreign women,” but in this context it refers to women taken in marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제사장 에스라가 일어나 그들에게 말했습니다. “여러분은 신의를 저버렸고, 이방 여인들을 아내로 맞아들여 이스라엘의 죄책을 더했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이방 여자들”. 히브리어 표현은 문자적으로 “이방 여자들”이지만, 이 문맥에서는 아내로 맞아들인 여인들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: stood up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 나섰습니다
  lexicon: HALOT
  rationale: 공적 자리에서의 행동을 자연스럽게 드러내는 동작으로 옮겼습니다.
- source_word: מְעַלְתֶּם
  english_pob_choice: have acted unfaithfully
  chosen_korean: 신의를 저버렸고
  alternatives_korean:
  - 불충실했습니다
  - 배신했습니다
  - 언약을 어겼습니다
  lexicon: HALOT
  rationale: מעל의 ‘불성실/신의 저버림’ 의미를 살리되, 한국어에서는 ‘신의를 저버리다’가 간결하고 본문의 도덕·언약적 뉘앙스를 함께 담습니다.
- source_word: וַתֹּשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  english_pob_choice: have taken foreign women as wives
  chosen_korean: 이방 여인을 아내로 맞아들여
  alternatives_korean:
  - 이방 여자들을 아내로 삼아
  - 외국 여인들과 결혼하여
  - 이방 여자들을 들여
  lexicon: HALOT
  rationale: 히필 ישב의 ‘들여 살게 하다/가정 안으로 들이다’라는 말맛을 살리면서, 이 문맥이 결혼 관계를 가리킨다는 점을 한국어로 자연스럽게 드러냈습니다.
- source_word: אַשְׁמַת
  english_pob_choice: the guilt
  chosen_korean: 죄책을
  alternatives_korean:
  - 죄를
  - 허물의 책임을
  - 죄과를
  lexicon: HALOT
  rationale: אַשְׁמָה의 책임성과 유죄성을 함께 살려 공동체적 ‘죄책’으로 옮겼습니다.
theological_decisions:
- issue: 공동체적 책임의 강조
  chosen_reading: 이스라엘의 죄책을 더했습니다
  alternative_readings:
  - 이스라엘의 죄를 더했습니다
  - 이스라엘의 허물을 더했습니다
  rationale: 본문은 개인적 잘못이 아니라 이스라엘 공동체 전체의 죄책이 증가하는 것으로 진술하므로, 그 집단적·언약적 무게를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §5
