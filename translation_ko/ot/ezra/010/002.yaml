revisions:
- from: 그때 스가냐야—여히엘의 아들로서 엘람 자손 중 한 사람입니다—가 에스라에게 대답하여 말했습니다. "우리가 우리 하나님께 신실하지 않게 행하여 그 땅의 여러 백성 가운데서 이방 여자들을 아내로 맞아들였습니다. 그러나 이제 이 일에 대해 이스라엘에게 아직 희망이 있습니다."[a][b][c]
  to: 그때 여히엘의 아들이며 엘람 자손 중 한 사람인 스가냐가 에스라에게 대답하여 말했습니다. “우리가 우리 하나님께 불성실하게 행했으며[a] 그 땅의 여러 민족 가운데서 이방 여인들을 아내로 맞아들였습니다.[b] 그러나 이제 이 일에 관하여 이스라엘에는 희망이 있습니다.[c]”
  rationale: The revision uses the conventional Korean name, restores smooth formal narrative syntax, removes the unsupported ‘아직’, and places each footnote marker at the expression it explains. It retains the source’s ambiguity concerning the nature of Israel’s hope and does not expand the historical or theological implications of the marriages.
