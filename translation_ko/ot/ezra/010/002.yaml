source:
  edition: WLC
  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
  footnotes:
  - marker: a
    text: Or 'have committed a breach of faith against our God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have taken foreign women as wives from the peoples of the land.'
    reason: lexical_alternative
  - marker: c
    text: Or 'there is hope for Israel concerning this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 스가냐야—여히엘의 아들로서 엘람 자손 중 한 사람입니다—가 에스라에게 대답하여 말했습니다. "우리가 우리 하나님께 신실하지 않게 행하여 그 땅의 여러 백성 가운데서 이방 여자들을 아내로 맞아들였습니다. 그러나 이제 이 일에 대해 이스라엘에게 아직 희망이 있습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실하지 않게 행하여’는 ‘우리 하나님께 대한 breach of faith’라는 뜻을 반영한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘아내로 맞아들였습니다’는 ‘foreign women’의 결혼 문맥을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이 일에 대해’는 히브리어 עַל זֹאת의 관계 표지를 보존한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן / וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동사 공식을 자연스러운 현대 문체로 옮기되, 단순히 ‘말하다’보다 응답의 흐름을 살리기 위해 ‘대답하여 말했습니다’를 택했습니다.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  english_pob_choice: have acted unfaithfully against our God
  chosen_korean: 우리 하나님께 신실하지 않게 행하여
  alternatives_korean:
  - 우리 하나님께 불충실하게 행하여
  - 우리 하나님을 배반하여
  - 우리 하나님께 죄를 지어
  lexicon: HALOT
  rationale: מעל은 단순한 일반적 ‘죄’보다 언약적 배신/불성실의 뉘앙스가 강하므로, 그 긴장을 살려 ‘신실하지 않게 행하다’로 옮겼습니다.
- source_word: נָשִׁים נָכְרִיּוֹת מֵעַמֵּי הָאָרֶץ
  english_pob_choice: foreign women from the peoples of the land
  chosen_korean: 그 땅의 여러 백성 가운데서 이방 여자들을 아내로 맞아들였습니다
  alternatives_korean:
  - 그 땅의 여러 백성의 이방 여자들을 아내로 삼았습니다
  - 그 땅의 이방 여자들을 맞아들였습니다
  lexicon: HALOT
  rationale: ‘이방 여자들’은 원문의 민족적 구분을 직접 반영하고, 혼인 행위는 동사와 문맥이 이미 충분히 드러내므로 ‘아내로 맞아들였습니다’로 자연스럽게 표현했습니다.
- source_word: יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל זֹאת
  english_pob_choice: there is hope for Israel concerning this
  chosen_korean: 이 일에 대해 이스라엘에게 아직 희망이 있습니다
  alternatives_korean:
  - 이 일에 대해 이스라엘에게 희망이 있습니다
  - 이런 사정에도 이스라엘에게 희망이 있습니다
  - 이스라엘에게 이 일에 관한 희망이 있습니다
  lexicon: HALOT
  rationale: מִקְוֶה를 ‘희망’으로 옮기고, עַל זֹאת은 문맥상 ‘이 일에 대해/관해’라는 대상 표지가 가장 직접적이어서 과도한 해석 없이 반영했습니다.
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל מִבְּנֵי עוֹלָם
  english_pob_choice: Shecaniah son of Jehiel, from the sons of Elam
  chosen_korean: 스가냐야—여히엘의 아들로서 엘람 자손 중 한 사람
  alternatives_korean:
  - 스가냐야, 여히엘의 아들, 엘람 자손 중 한 사람
  - 스가냐, 여히엘의 아들로서 엘람 자손 가운데서
  lexicon: HALOT
  rationale: 인명은 음역하고, מִבְּנֵי를 ‘중 한 사람’으로 풀어 집단 소속을 살렸습니다. ‘엘람’은 본문상 지명/씨족명으로 읽히는 고유명사입니다.
theological_decisions:
- issue: מָעַל의 언약적 책임성
  chosen_reading: ‘신실하지 않게 행하다’로 옮겨 단순한 도덕적 실수보다 하나님께 대한 언약적 불성실을 드러냈습니다.
  alternative_readings:
  - 죄를 지었습니다
  - 배반했습니다
  - 언약을 저버렸습니다
  rationale: 본문은 회개적 고백의 맥락에서 공동체가 하나님께 대해 한 행위를 고발하므로, 언약적 긴장을 유지하는 번역이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: עַל זֹאת의 범위
  chosen_reading: ‘이 일에 대해’로 처리해, 희망이 ‘이 사건/상황’과 관련된다는 점을 과도한 확장 없이 드러냈습니다.
  alternative_readings:
  - 이런 사정에도
  - 이 일로 말미암아
  - 이 점에서
  rationale: 원문은 희망의 근거를 특정 교리로 확장하지 않고 현재 상황과의 관련성을 제시하므로, 관계 표지를 최소한으로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
