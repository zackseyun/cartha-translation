    text: ‘하림 자손 중에서’보다 더 문자적으로는 ‘하림 자손에서/중에서’이지만, 한국어에서는 소속 분류를 자연스럽게 드러내기 위해 ‘중에서는’으로 다듬었습니다.
    reason: korean_style_note
