  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: ko
  text: 그리고 바핫모압 자손 가운데서는 아드나, 글랄, 브나야, 마아세야, 맛다냐, 브살렐, 빈누이, 므낫세가 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 … 자손 가운데서는
  alternatives_korean:
  - 그리고 … 아들들 가운데서는
  - 그리고 … 후손 가운데서는
  lexicon: HALOT
  rationale: מִן의 출처/소속 의미를 살려 ‘가운데서는’으로 옮기고, בְּנֵי는 목록형 족속 표지로서 ‘자손’을 사용해 계보적 구조를 유지했습니다.
- source_word: פַּחַת מוֹאָב
  english_pob_choice: Pahath-moab
  chosen_korean: 바핫모압
  alternatives_korean:
  - 파핫모압
  - 바핫-모압
  lexicon: HALOT
  rationale: 고유한 가문명으로 보아 음역했고, 한국어에서는 하이픈 없이 붙여 적어도 합성명칭이 자연스럽게 읽히므로 ‘바핫모압’으로 정했습니다.
- source_word: וּכְלָל
  english_pob_choice: Chelal
  chosen_korean: 헤랄
  alternatives_korean:
  - 켈랄
  - 헬랄
  lexicon: HALOT
  rationale: 히브리어 כ의 거센소리를 반영하되 한국어 성서 음역 관행에 맞춰 ‘헤랄’로 옮겼습니다.
- source_word: וּמְנַשֶּׁה
  english_pob_choice: and Manasseh
  chosen_korean: 므낫세
  alternatives_korean:
  - 그리고 므낫세
  - 마낫세
  lexicon: HALOT
  rationale: 인명은 관용적 한국어 성서형을 우선했고, 끝의 접속사는 목록 전체가 이미 한국어로 연결되므로 반복하지 않았습니다.
theological_decisions:
- issue: 족속 목록의 문체
  chosen_reading: 서사적 설명을 덧붙이지 않고 단순한 명단 구조를 그대로 유지했습니다.
  alternative_readings:
  - 보다 풀어서 ‘~에 속한 사람들’로 옮기는 방식
  rationale: 본문은 회중의 명단이며, 의미를 확장하면 족속 목록의 간결함과 기능이 약화됩니다.
  doctrine_reference: 본문 장르 보존
