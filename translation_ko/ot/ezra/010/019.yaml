  text: 그들은 아내들을 내보내기로 서약하였으며[a], 죄를 지었으므로 자기들의 죄 때문에 양 떼에서 숫양 한 마리를 드렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 손을 주었다’입니다. 이는 서약하거나 구속력 있는 약속을 맺는다는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 죄를 지은 자들로서, 자기들의 죄에 대하여 양 떼의 숫양 한 마리를 속건제물로 드렸다’라고 옮길 수 있습니다.
    reason: alternative_reading
