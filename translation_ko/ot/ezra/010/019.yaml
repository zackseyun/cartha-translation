    rationale: 희생 동물의 종류는 유지되지만, ‘양 떼의/양 떼에서’가 원문에 있으므로 번역에 반영하는 것이 더 충실합니다.
  - severity: low
    issue: 각주 b의 대안 번역이 제의적 대안을 충분히 제시하지 못함
    rationale: 기존 각주는 사실상 본문을 약간 바꾸어 말할 뿐입니다. 영어 감사 기록에 따른 ‘속건제물’이라는 더 명시적인 해석을, 본문을 과잉 규정하지 않도록 대안 각주로 제시할 수 있습니다.
