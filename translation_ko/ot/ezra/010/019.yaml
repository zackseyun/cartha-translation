source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
  footnotes:
  - marker: a
    text: Literally, 'they gave their hand,' a Hebrew idiom for making a pledge or binding agreement.
    reason: lexical_alternative
  - marker: b
    text: Or, more explicitly, 'they offered a ram of the flock as a guilt offering for their guilt.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 자기들의 아내를 내보내기로 손을 내밀어 맹세하였으며, 죄가 있는 자들로서 자기들의 죄 때문에 숫양 한 마리를 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손을 주었다’로, 여기서는 서약하거나 구속력 있는 약속을 맺는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 더 풀어 옮기면 ‘자기들의 죄에 대하여 숫양 한 마리를 드렸다’는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  english_pob_choice: They pledged themselves
  chosen_korean: 손을 내밀어 맹세하였으며
  alternatives_korean:
  - 손을 주었습니다
  - 약속하였습니다
  - 맹세하였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘손을 주다’의 결속·서약 의미를 살리되, 한국어에서는 자연스럽고 공적 약속의 힘이 드러나도록 ‘손을 내밀어 맹세하다’로 옮겼습니다.
- source_word: לְהוֹצִיא נְשֵׁיהֶם
  english_pob_choice: to send away their wives
  chosen_korean: 자기들의 아내를 내보내기로
  alternatives_korean:
  - 자기들의 아내를 떠나보내기로
  - 자기들의 아내를 버리기로
  - 자기들의 아내를 보내기로
  lexicon: HALOT
  rationale: 이 동사는 여기서 혼인 관계를 끊고 내보내는 의미이므로, 직설적이지만 완곡하지 않은 ‘내보내다’를 택해 원문의 결단을 드러냈습니다.
- source_word: אֵיל צֹאן
  english_pob_choice: a ram from the flock
  chosen_korean: 숫양 한 마리
  alternatives_korean:
  - 양 떼의 숫양 한 마리
  - 무리에서 나온 숫양 한 마리
  - 양 한 마리
  lexicon: HALOT
  rationale: 제사 동물임이 분명하므로 한국어에서는 간결하게 ‘숫양 한 마리’로 옮기되, flock의 범주는 문맥상 자연스럽게 유지됩니다.
- source_word: עַל אַשְׁמָתָם
  english_pob_choice: for their guilt
  chosen_korean: 자기들의 죄 때문에
  alternatives_korean:
  - 자기들의 죄로 인해
  - 자기들의 죄를 위하여
  - 자기들의 죄에 대하여
  lexicon: HALOT
  rationale: אַשְׁמָה의 책임·죄책을 한국어에서 가장 분명하게 드러내기 위해 ‘죄 때문에’로 옮겼습니다. 제의적 배경은 다음 절의 맥락과 함께 읽히도록 했습니다.
theological_decisions:
- issue: 죄책을 위한 희생이지만 본문에 별도의 기술적 용어가 없음
  chosen_reading: ‘숫양 한 마리’를 본문에 두고, 제의적 의미는 ‘죄 때문에’로만 드러냈습니다.
  alternative_readings:
  - ‘속죄제물로 숫양 한 마리’
  - ‘속건제물로 숫양 한 마리’
  rationale: 히브리어 본문은 숫양과 죄책의 관계를 말하지만, 여기에는 별도의 제사명사가 직접 나오지 않습니다. 따라서 기술적 제사 용어를 본문에 덧붙여 의미를 과잉 규정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: never paraphrase beyond what the source text warrants'
