  source_fidelity: ‘외국 여자를 맞아들인 모든 사람’은 문맥상 의미가 통하지만, אֲנָשִׁים의 남성 지시와 נָשִׁים נָכְרִיּוֹת가 문맥에서 아내를 가리키는 뜻을 더 분명히 드러내는 편이 좋습니다. עַד의 시간적 경계는 ‘까지’로 보존할 수 있습니다.
  naturalness: 현 문장도 이해되지만 ‘모든 사람에 대한 일’은 조사 대상의 범위가 다소 추상적으로 들립니다. ‘모든 남자에 관한 일을’로 하면 절차적 문맥과 한국어 연결이 더 자연스럽습니다.
  terminology: ‘외국 여자를 아내로 맞아들인’은 혼인 관계를 나타내는 문맥을 분명히 하면서도 원문의 ‘거하게 하다/맞아들이다’ 계열 표현을 과도하게 교리적으로 해석하지 않습니다. ‘남자’는 원문의 남성 복수를 반영합니다.
