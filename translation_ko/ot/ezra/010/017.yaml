  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
  footnotes:
  - marker: a
    text: Or 'until the first day of the first month.' The Hebrew temporal expression can be rendered either way; the main text uses idiomatic English to show the date by which the inquiry was completed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 첫째 달 첫째 날에 이르기까지 외국 여자를 맞아들인 모든 사람에 대한 일을 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이르기까지’는 완료 시한을 드러낸 번역입니다. 히브리어 시간 표현은 ‘~까지’ 또는 ‘~에 이르기까지’로 모두 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  english_pob_choice: they finished
  chosen_korean: 일을 마쳤습니다
  alternatives_korean:
  - 마쳤습니다
  - 완료했습니다
  - 끝냈습니다
  lexicon: HALOT
  rationale: כלה의 완료 의미를 살리되, 한국어에서는 진행 중이던 조사와 처리를 끝냈다는 뜻을 자연스럽게 드러내는 ‘일을 마쳤습니다’가 적절합니다.
- source_word: בַ/כֹּל
  english_pob_choice: with all
  chosen_korean: 모든 사람에 대한 일을
  alternatives_korean:
  - 모든 사람에 대해
  - 모든 사람과 관련하여
  - 모든 사람에 관한
  lexicon: HALOT
  rationale: ב+כֹּל의 범위 포괄을 한국어 조사구로 풀어, 대상이 된 사례 전체를 다 다루었다는 절차적 의미를 살렸습니다.
- source_word: הַ/הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  english_pob_choice: the men who had taken foreign wives
  chosen_korean: 외국 여자를 맞아들인 사람
  alternatives_korean:
  - 외국 여자를 아내로 맞이한 사람
  - 외국 여자를 취한 사람
  - 이방 여자를 맞아들인 사람
  lexicon: HALOT
  rationale: 히브리어의 ‘거하게 하다/들이다’ 계열 표현을 직역하지 않고, 문맥상 혼인 관계를 가리키는 관용을 반영해 ‘맞아들인’으로 옮겼습니다. ‘외국’은 נָכְרִיּוֹת의 일반적 의미를 살린 것입니다.
- source_word: עַד י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן
  english_pob_choice: by the first day of the first month
  chosen_korean: 첫째 달 첫째 날에 이르기까지
  alternatives_korean:
  - 첫째 달 첫째 날까지
  - 첫째 달의 첫째 날로
  - 첫째 달 첫째 날에
  lexicon: HALOT
  rationale: עַד가 경계 시점을 나타내므로, 종료 시한을 분명히 하는 ‘이르기까지’를 사용했습니다. 달력 표현은 한국어 성경 문체에 맞게 ‘첫째 달 첫째 날’로 옮겼습니다.
