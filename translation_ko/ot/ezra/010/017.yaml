  lexicon: HALOT
  rationale: ב+כֹּל의 범위 포괄을 한국어 조사구로 풀어, 대상이 된 사례 전체를 다 다루었다는 절차적 의미를 살렸습니다.
- source_word: הַ/הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  english_pob_choice: the men who had taken foreign wives
  chosen_korean: 외국 여자를 맞아들인 사람
  alternatives_korean:
  - 외국 여자를 아내로 맞이한 사람
  - 외국 여자를 취한 사람
  - 이방 여자를 맞아들인 사람
  lexicon: HALOT
  rationale: 히브리어의 ‘거하게 하다/들이다’ 계열 표현을 직역하지 않고, 문맥상 혼인 관계를 가리키는 관용을 반영해 ‘맞아들인’으로 옮겼습니다. ‘외국’은 נָכְרִיּוֹת의 일반적 의미를 살린 것입니다.
- source_word: עַד י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן
  english_pob_choice: by the first day of the first month
  chosen_korean: 첫째 달 첫째 날에 이르기까지
  alternatives_korean:
  - 첫째 달 첫째 날까지
  - 첫째 달의 첫째 날로
  - 첫째 달 첫째 날에
  lexicon: HALOT
  rationale: עַד가 경계 시점을 나타내므로, 종료 시한을 분명히 하는 ‘이르기까지’를 사용했습니다. 달력 표현은 한국어 성경 문체에 맞게 ‘첫째 달 첫째 날’로 옮겼습니다.
