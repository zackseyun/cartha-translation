translation:
  language: ko
  text: 그들은 외국 여자를 아내로 맞아들인 모든 남자에 관한 일을 첫째 달 첫째 날까지 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 시간 표현은 ‘첫째 달 첫째 날까지’로도, 그날을 완료 시점으로 나타내는 말로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  english_pob_choice: they finished
  chosen_korean: 일을 마쳤습니다
  alternatives_korean:
  - 마쳤습니다
  - 완료했습니다
  - 끝냈습니다
  lexicon: HALOT
  rationale: כלה의 완료 의미를 살리되, 한국어에서는 진행 중이던 조사와 처리를 끝냈다는 뜻을 자연스럽게 드러내는 ‘일을 마쳤습니다’가 적절합니다.
- source_word: בַ/כֹּל
