  source_fidelity: 마지막 이름 ויעשו는 히브리어 인명 יַעֲשׂוּ(야아수)에 해당합니다. 초안의 ‘야아사이’는 영어 POB의 선택을 따랐으나, 마소라 본문의 어말 모음 -u와 일치하지 않습니다.
  naturalness: 인명 목록에는 한국어 성경에서 널리 쓰이는 음역인 ‘맛다냐, 맛드내, 야아수’가 자연스럽습니다. 합쇼체 문장 종결도 유지했습니다.
  terminology: 고유명사는 번역하지 않고 음역했습니다. ‘맛다냐’와 ‘맛드내’는 표준 한국어 성경 음역 관행에도 부합하며, 마지막 이름은 본문 형태를 우선하여 ‘야아수’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘야아사이’
    rationale: 히브리어 ויעשו의 인명형은 יַעֲשׂוּ로 읽히며 어말 שׂוּ는 ‘수’에 해당합니다. ‘야아사이’는 제시된 영어 감사 기록의 선택과는 맞지만 원문 철자·모음과 맞지 않습니다.
  - severity: low
    issue: ‘마탸냐, 마트나이’ 음역
    rationale: 직역 음역으로 불가능하지는 않지만, 표준 한국어 성경의 확립된 인명 표기인 ‘맛다냐, 맛드내’가 더 자연스럽고 독자 친화적입니다.
  revised_text: 맛다냐, 맛드내, 그리고 야아수[a]입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 본문은 이 이름을 ‘야아수’로 읽습니다. 일부 번역 전통에서는 다르게 표기합니다.
    reason: lexical_alternative
  revision_rationale: 영어 POB 감사 기록의 ‘Jaasai’는 원문 히브리어의 어말 -u와 충돌하므로 따르지 않았습니다. 원문을 우선하여 마지막 이름을 ‘야아수’로 바로잡고, 한국어의 관용적 성경 인명 표기를 적용했습니다. 영어 전통의 표기 차이는 각주로만 보존했습니다.
