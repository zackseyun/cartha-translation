translation:
  language: ko
  text: 그리고 엘람 자손 가운데서는 맛다냐, 스가랴, 여히엘, 압디, 여레못, 엘리야입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 … 자손 가운데서는
  alternatives_korean:
  - 그리고 … 아들들 가운데서는
  - 그리고 … 후손들 가운데서는
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי를 한국어로는 ‘자손’으로 옮기면 혈연 집단을 자연스럽게 드러내면서도 원문의 관용구를 과도하게 풀지 않습니다.
- source_word: עֵילָם
  english_pob_choice: Elam
  chosen_korean: 엘람
  alternatives_korean:
  - 일람
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하며, 이 문맥에서는 집안/씨족 조상 이름으로 보이므로 ‘엘람’으로 옮깁니다.
- source_word: מַתַּנְיָה / זְכַרְיָה / וִ/יחִיאֵל / וְ/עַבְדִּי / וִ/ירֵמ֖וֹת / וְ/אֵלִיָּה
  english_pob_choice: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah
  chosen_korean: 맛다냐, 스가랴, 여히엘, 압디, 여레못, 엘리야
  alternatives_korean:
  - 맛다냐, 스가랴, 여이엘, 압디, 여리못, 엘리야
  - 맛다냐, 스가랴, 예히엘, 압디, 예레못, 엘리야
  lexicon: HALOT
  rationale: 각 인명은 한국어 성경에서 통용되는 표기를 우선 적용했습니다. ‘Jehiel’은 관용형 ‘여히엘’, ‘Jeremoth’는 ‘여레못’이 가장 자연스럽고 식별 가능합니다.
