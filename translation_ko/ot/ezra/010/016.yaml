  text: וַ/יַּֽעֲשׂוּ כֵן֮ בְּנֵ֣י הַ/גּוֹלָה֒ וַ/יִּבָּדְלוּ֩ עֶזְרָ֨א הַ/כֹּהֵ֜ן אֲנָשִׁ֨ים רָאשֵׁ֧י הָ/אָב֛וֹת לְ/בֵ֥ית אֲבֹתָ֖/ם וְ/כֻלָּ֣/ם בְּ/שֵׁמ֑וֹת וַ/יֵּשְׁב֗וּ בְּ/י֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י לְ/דַרְי֖וֹשׁ הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
  footnotes:
  - marker: a
    text: Or 'the exiles did so.' The Hebrew is literally 'the sons of the exile,' a corporate designation for the returned community.
    reason: lexical_alternative
  - marker: b
    text: Or 'separated themselves.' The Hebrew verb can be understood more literally as separation, though here it functions in context for appointing or setting apart representatives.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'heads of fathers’ houses,' referring to clan or family leaders.
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 포로에서 돌아온 사람들이 그렇게 하였습니다.[a] 제사장 에스라와 각 아버지 집안의 우두머리인 남자들이, 각자의 아버지 집안별로 모두 이름을 따라 따로 세워졌습니다. 그리고 그들은 열째 달 첫째 날에 그 일을 조사하려고 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '포로의 아들들'이며, 귀환 공동체를 가리키는 집합적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  english_pob_choice: the sons of the exile
  chosen_korean: 포로에서 돌아온 사람들
  alternatives_korean:
  - 포로의 아들들
  - 포로민들
  - 포로에서 돌아온 자들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '포로의 아들들'이지만, 한국어에서는 혈연적 아들들이 아니라 귀환 공동체 전체를 가리키는 집합명사로 읽히므로 의미를 분명하게 풀어 옮겼습니다.
- source_word: וַיִּבָּדְלוּ
  english_pob_choice: set apart
  chosen_korean: 골라 세웠습니다
  alternatives_korean:
  - 구별하였습니다
  - 선정하였습니다
  - 따로 세웠습니다
  lexicon: HALOT
  rationale: 문맥상 에스라가 조사에 참여할 대표자들을 지정하는 행위이므로, 분리의 뉘앙스를 살리되 행정적 의미가 드러나도록 옮겼습니다.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  english_pob_choice: men, heads of fathers’ houses according to their fathers’ houses
  chosen_korean: 아버지들의 가문 우두머리들을, 곧 그들의 아버지들의 가문에 속한 사람들을
  alternatives_korean:
  - 족장들을
  - 가문 우두머리들을
  - 조상 집안의 우두머리들을
  lexicon: HALOT
  rationale: '''아버지들의 가문''이라는 히브리어 사회 단위를 그대로 드러내어, 단순한 ''가족''보다 클랜/가문 구조를 보존했습니다.'
- source_word: וְכֻלָּם בְּשֵׁמֹות
  english_pob_choice: all of them by name
  chosen_korean: 모두 이름대로
  alternatives_korean:
  - 모두 이름별로
  - 모두 각자 이름으로
  - 그들 모두를 이름으로
  lexicon: HALOT
  rationale: 개별 식별 또는 명단 작성의 의미를 간결하게 살리기 위해 '이름대로'로 옮겼습니다.
- source_word: לְדַרְי֖וֹשׁ הַדָּבָֽר
  english_pob_choice: to investigate the matter
  chosen_korean: 그 일을 조사하려고
  alternatives_korean:
  - 그 사안을 조사하려고
  - 그 문제를 살피려고
  - 그 일을 알아보려고
  lexicon: HALOT
  rationale: דָּרַשׁ의 '조사하다/탐구하다' 의미를 따라, 행정적·사법적 심문 맥락이 드러나도록 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 귀환 공동체의 집합명사 처리
  chosen_reading: '''포로에서 돌아온 사람들''로 옮겨 공동체적 의미를 분명히 하되, 본문의 역사적 집단성을 유지했습니다.'
  alternative_readings:
  - 문자적으로 '포로의 아들들'
