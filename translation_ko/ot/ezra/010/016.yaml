revisions:
- from: 그리하여 포로에서 돌아온 사람들이 그렇게 하였습니다. 제사장 에스라는 아버지들의 가문 우두머리들을, 곧 그들의 아버지들의 가문에 속한 사람들을 모두 이름대로 골라 세웠습니다. 그리고 그들은 열째 달 첫째 날에 그 일을 조사하려고 앉았습니다.[a]
  to: 그리하여 포로에서 돌아온 사람들이 그렇게 하였습니다.[a] 제사장 에스라와 각 아버지 집안의 우두머리인 남자들이, 각자의 아버지 집안별로 모두 이름을 따라 따로 세워졌습니다. 그리고 그들은 열째 달 첫째 날에 그 일을 조사하려고 앉았습니다.
  rationale: 복수 니팔 동사 וַיִּבָּדְלוּ와 그 복합 주어를 반영하여, 에스라가 다른 이들을 선발했다는 단정 대신 에스라와 가문 우두머리들이 '따로 세워졌다'고 옮겼습니다. 이 표현은 문자적인 분리의 뉘앙스와 문맥상 조사 담당자로 지정된 뜻을 함께 보존합니다. 가문 우두머리 구문의 원래 구조를 회복하고, 기존 각주를 설명 대상 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
