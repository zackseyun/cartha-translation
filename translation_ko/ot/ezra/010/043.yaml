  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원칙이며, 영어 POB의 표준형 Jeiel에 대응하는 현대 한국어 음역으로 옮겼습니다.
- source_word: מַתִּתְיָה
  english_pob_choice: Mattithiah
  chosen_korean: 맛디댜
  alternatives_korean:
  - 맛디다
  - 맛디디야
  lexicon: HALOT
  rationale: 히브리어 איש명 Mattithiah의 통용 음역을 따르되, 한국어 표기 관습에 맞춰 음가를 최대한 보존했습니다.
- source_word: ידו
  english_pob_choice: Jaddai
  chosen_korean: 야다이
  alternatives_korean:
  - 이두
  - 여도
  lexicon: HALOT
  rationale: 해당 이름은 자음 형태와 전통적 처리에 따라 식별이 다소 불확실하므로, 영어 POB의 Jaddai를 반영하되 가능한 다른 음역을 염두에 둔 한국어 표기를 채택했습니다.
