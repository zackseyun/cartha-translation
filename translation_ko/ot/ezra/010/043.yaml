lexical_decisions:
- source_word: מִ/בְּנֵי
  english_pob_choice: From the sons of
  chosen_korean: 느보의 아들들 가운데서는
  alternatives_korean:
  - 느보의 아들들로부터
  - 느보의 아들들 중에서
  lexicon: HALOT
  rationale: מין + בְּנֵי는 특정 집단 안의 하위 항목을 도입하므로, 목록 문맥에 맞게 ‘…가운데서는’으로 풀어 자연스러운 집단-열거 기능을 살렸습니다.
- source_word: יְעִיאֵל
