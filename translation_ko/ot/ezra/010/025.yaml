base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
  footnotes:
  - marker: a
    text: Hebrew repeats the name Malkijah twice in this list, likely referring to two different men with the same name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘에서, 바로스의 자손들 가운데서는 라미야와 이찌야와 말기야와 미야민과 엘르아살과 말기야와 브나야입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 같은 이름 ‘말기야’를 두 번 반복하며, 두 사람의 동명이인일 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  english_pob_choice: And from Israel
  chosen_korean: 그리고 이스라엘에서
  alternatives_korean:
  - 그리고 이스라엘 가운데서
  - 그리고 이스라엘 사람들 가운데서
  lexicon: WLC
  rationale: 문맥상 명단 안에서 이스라엘이라는 더 큰 집단에서의 하위 분류를 뜻하므로, ‘에서’로 자연스럽게 옮기되 앞의 연결을 살려 ‘그리고’를 붙였습니다.
- source_word: מִבְּנֵי פַרְעֹשׁ
  english_pob_choice: from the sons of Parosh
  chosen_korean: 바로스의 자손들 가운데서는
  alternatives_korean:
  - 바로스의 아들들 가운데서는
  - 바로스 집안에서는
  lexicon: WLC
  rationale: ‘בְּנֵי’는 족보·명단 문맥에서 혈연적 후손이나 씨족 구성원을 가리키므로, 직역적 구조를 유지하면서도 한국어에서는 ‘자손들’이 가장 자연스럽습니다.
- source_word: רַמְיָה ... וּבְנָיָה
  english_pob_choice: Ramiah ... and Benaiah
  chosen_korean: 라미야 … 브나야
  alternatives_korean:
  - 라미아 … 브나야
  - 라먀 … 브나야
  lexicon: WLC
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 옮겼고, ‘-야’ 어말을 살려 히브리어 이름 형태를 최대한 반영했습니다.
- source_word: מַלְכִּיָּה (twice)
  english_pob_choice: Malkijah ... Malkijah
  chosen_korean: 말기야 ... 말기야
  alternatives_korean:
  - 말기야 ... 다른 말기야
  - 말기야 ... 말기야(동명이인)
  lexicon: WLC
  rationale: 히브리어는 같은 이름을 두 번 반복하므로, 한국어도 동일한 음역을 두 번 유지해 본문이 가진 동명 인물 가능성을 지우지 않았습니다.
