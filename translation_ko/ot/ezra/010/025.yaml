translation:
  language: ko
  text: 이스라엘 사람들 가운데 바로스의 자손으로는 라먀와 잇시야와 말기야와 미야민과 엘르아살과 말기야와 브나야가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
