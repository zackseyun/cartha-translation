  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
  footnotes:
  - marker: a
    text: Or 'shall be forfeited' or 'shall be put under the ban.' The Hebrew verb denotes being placed under חרם, a ban/devotion that can imply destruction or confiscation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 삼 일 안에 오지 않는 사람은, 관리들과 장로들의 권고에 따라 그의 모든 재산이 몰수되고, 그 자신은 포로들의 회중에서 분리될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몰수될 것입니다’ 혹은 ‘저주 아래 두어 멸망시킬 것입니다.’ 히브리어 동사는 חרם 아래 두는 것, 곧 금지·봉헌 상태에 두는 것을 뜻하며, 멸망이나 몰수의 결과를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  english_pob_choice: And everyone who
  chosen_korean: 그리고 삼 일 안에 오지 않는 사람은
  alternatives_korean:
  - 그리고 누구든지
  - 그리고 오지 않는 모든 사람은
  lexicon: HALOT
  rationale: 보편적 조건문을 자연스러운 현대 한국어 법령체로 옮기기 위해 ‘사람은’으로 풀어 썼습니다.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  english_pob_choice: within three days
  chosen_korean: 삼 일 안에
  alternatives_korean:
  - 삼 일 내에
  - 사흘 안에
  lexicon: HALOT
  rationale: 마감 시한을 분명히 드러내는 표현으로 ‘안에’를 택했습니다.
- source_word: יָחֳרַם כָּל רְכוּשׁוֹ
  english_pob_choice: all his property shall be forfeited
  chosen_korean: 그의 모든 재산이 몰수되고
  alternatives_korean:
  - 그의 모든 재산이 바쳐져 멸망될 것이며
  - 그의 모든 재산이 몰수되며
  lexicon: HALOT
  rationale: 여기서는 재산에 대한 חרם의 실제 효과가 제재·박탈이므로, 한국어 법률 감각에 맞는 ‘몰수’로 옮겼습니다.
- source_word: וְהוּא יִבָּדֵל מִקְּהַל הַגּוֹלָה
  english_pob_choice: and he himself shall be separated from the assembly of the exiles
  chosen_korean: 그 자신은 포로들의 회중에서 분리될 것입니다
  alternatives_korean:
  - 그는 포로들의 회중에서 제외될 것입니다
  - 그 자신은 포로들의 공동체에서 끊어질 것입니다
  lexicon: HALOT
  rationale: בדל의 핵심 의미를 살려 ‘분리되다’로 직역하되, קהל을 문맥에 맞게 ‘회중’으로 옮겨 공동체적 배제를 나타냈습니다.
theological_decisions:
- issue: חרם의 제재 성격
  chosen_reading: 재산에 대한 חרם을 ‘몰수’로 번역해, 단순한 손실이 아니라 공동체 권위 아래의 강제 박탈임을 드러냈습니다.
  alternative_readings:
  - 저주 아래 두어 파멸시킬 것입니다
  - 바쳐져 멸망될 것입니다
  rationale: 이 구절은 재산 처분을 다루는 행정적·징벌적 맥락이므로, 본문이 지시하는 실질적 결과를 한국어로 분명히 표현하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 공동체로부터의 분리
  chosen_reading: ‘포로들의 회중에서 분리될 것입니다’로 옮겨, 후대 교회적 ‘출교’ 개념을 덧씌우지 않았습니다.
  alternative_readings:
  - 회중에서 제외될 것입니다
  - 공동체에서 추방될 것입니다
  rationale: 히브리어 본문은 귀환 포로 공동체로부터의 분리를 말할 뿐, 제도화된 교회 징계 용어를 사용하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3
