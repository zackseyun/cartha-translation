base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
  footnotes:
  - marker: a
    text: Malluk is also spelled Malluch in some English renderings.
    reason: lexical_alternative
  - marker: b
    text: Jeremoth may reflect a variant vocalization or name-form in some traditions.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 바니의 아들들 중에서는 메술람, 말룩, 아다야, 야숩, 스알, 그리고 예레못이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 말룩은 일부 영어 번역에서 Malluch로도 표기됩니다.
    reason: lexical_alternative
  - marker: b
    text: 예레못은 일부 전통에서 다른 모음화나 이름형으로 이해될 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 중에서는
  alternatives_korean:
  - 그리고 …의 아들들에서
  - 그리고 …의 자손들 가운데서는
  lexicon: HALOT
  rationale: 명단 도입의 소속·부분 포함 관계를 살리기 위해 ‘중에서는’을 사용했고, genealogical list의 형식을 유지하기 위해 ‘아들들’을 보존했습니다.
- source_word: מְשֻׁלָּם
  english_pob_choice: Meshullam
  chosen_korean: 메술람
  alternatives_korean:
  - 메슐람
  - 메술람
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기와 통용 음역을 따라 옮겼습니다.
- source_word: מַלּוּךְ
  english_pob_choice: Malluk
  chosen_korean: 말룩
  alternatives_korean:
  - 말룩
  - 말루크
  lexicon: HALOT
  rationale: 히브리어 자음형에 가까운 음역을 취했고, 영어 전통형 Malluch는 본문이 아니라 각주로 처리하지 않았습니다.
- source_word: ירמות
  english_pob_choice: Jeremoth
  chosen_korean: 예레못
  alternatives_korean:
  - 여레못
  - 예레못
  lexicon: HALOT
  rationale: 마소라 본문의 이 문맥에서 읽히는 이름형을 음역해, 영어 전통형의 철자 차이를 그대로 본문에 반영하지 않았습니다.
theological_decisions:
- issue: 명단 구문에서의 접속사와 목록 리듬
  chosen_reading: 첫 항목 앞의 ‘그리고’와 마지막 항목 앞의 ‘그리고’를 모두 살려, 히브리어 목록 문장의 나열감을 유지했습니다.
  alternative_readings:
  - 접속사를 모두 생략해 더 간결하게 옮기기
  - 한국어식으로 한 번만 ‘그리고’를 쓰기
  rationale: 본문은 서사보다는 족보/명단식 진술이므로, 원문의 나열 구조를 드러내는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 문법적 구조 보존
- issue: ירמות의 이름형 처리
  chosen_reading: ‘예레못’으로 옮기고, 본문에서는 추정적 별칭을 만들지 않았습니다.
  alternative_readings:
  - ‘예레못/라마못’처럼 이중형을 본문에 병기하기
  - 영어 전통형을 따라 ‘제레못’으로 옮기기
  rationale: 히브리어 자음형과 문맥상 이름형을 우선하여 본문을 정리하고, 별도 전통형은 필요할 때만 주석에서 다루는 편이 소스-기반입니다.
  doctrine_reference: 이름형/본문비평
