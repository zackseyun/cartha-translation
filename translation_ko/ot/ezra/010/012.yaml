  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעְנ֧וּ כָֽל הַ/קָּהָ֛ל וַ/יֹּאמְר֖וּ ק֣וֹל גָּד֑וֹל כֵּ֛ן כ/דברי/ך עָלֵ֖י/נוּ לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “As you have said, so we must do.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 온 회중이 대답하며 큰 소리로 말했습니다. 「그렇습니다. 당신의 말씀대로, 그렇게 하는 것이 우리에게 달려 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, 「당신이 말씀하신 대로, 우리가 그렇게 해야 합니다.」
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַקָּהָל
  english_pob_choice: all the assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 모임
  - 온 집회
  lexicon: WLC
  rationale: קָהָל은 한자어식 ‘회중’으로 공동체가 함께 모인 집합성을 살릴 수 있어, 영어 POB의 ‘assembly’에 대응하여 자연스럽게 옮겼습니다.
- source_word: וַיַּעֲנוּ / וַיֹּאמְרוּ
  english_pob_choice: answered and said
  chosen_korean: 대답하며 … 말했습니다
  alternatives_korean:
  - 응답하며 … 말했습니다
  - 대답하고 … 말했습니다
  - 대답하여 … 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 반응-발화 연속을 한국어에서 과도하게 중복하지 않으면서도, 공적 응답의 흐름이 드러나도록 ‘대답하며’와 ‘말했습니다’를 나누어 옮겼습니다.
- source_word: קוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 높은 소리로
  - 크게
  - 우렁차게
  lexicon: HALOT
  rationale: 직역의 ‘큰 소리’ 계열을 유지하되 한국어에서 가장 자연스럽고 공적 선언의 울림을 살리는 표현으로 다듬었습니다.
- source_word: כֵּן כִּדְבָרֶיךָ עָלֵינוּ לַעֲשׂוֹת
  english_pob_choice: Yes, according to your words, so it is upon us to do.
  chosen_korean: 그렇습니다. 당신의 말씀대로, 그렇게 하는 것이 우리에게 달려 있습니다.
  alternatives_korean:
  - 예, 당신의 말씀대로, 그렇게 하는 것이 우리 몫입니다.
  - 그렇습니다. 당신의 말씀대로, 그렇게 해야 합니다.
  lexicon: HALOT
  rationale: כֵּן의 단순 동의와 עָלֵינוּ의 ‘우리 위에/우리에게 지워진 책임’이라는 부담을 함께 살려, 의무의 무게를 직접적이면서도 한국어답게 표현했습니다.
theological_decisions:
- issue: 회중의 집단적 순종 선언을 어떻게 옮길지
  chosen_reading: 개인의 감정표현보다 공동체 전체가 에스라의 말에 공적으로 동의하며 순종 의무를 인정하는 선언으로 번역했습니다.
  alternative_readings:
  - ‘우리의 의무입니다’처럼 도덕 명제로 평탄화하는 읽기
  - ‘우리가 반드시 해야 합니다’로 단순 명령형으로 바꾸는 읽기
  rationale: 본문은 단순한 동의가 아니라 공동체의 책임 수락을 말하므로, ‘우리에게 달려 있습니다’로 책임의 귀속을 보존했습니다.
  doctrine_reference: 공동체적 회개와 순종의 책임(에스라 10장 문맥)
