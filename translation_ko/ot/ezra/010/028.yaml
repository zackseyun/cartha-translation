  source_fidelity: 히브리어 וּמִבְּנֵי는 이 명단 문맥에서 ‘그리고 베바이 자손 중에서는’으로 충실히 옮길 수 있습니다. 인명 가운데 זַבַּי는 ‘잡배’가 아니라 통상 ‘삽배’로 음역하는 것이 적절하며, עַתְלָי는 ‘아들래’가 자연스럽고 통용되는 한국어 성경식 음역입니다.
