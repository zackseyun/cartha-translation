  - marker: b
    text: Jehohanan is often simplified in English as 'Johanan.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 베바이 자손[a] 중에서는 여호하난[b], 하나냐, 삽배, 아들래입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘자손’은 여기서 베바이 가문의 구성원이나 후손을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여호하난은 ‘요하난’으로도 음역합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 … 자손 중에서는
  alternatives_korean:
  - 그리고 …의 아들들 가운데서는
  - 그리고 …의 후손들 가운데서는
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 ‘sons of’는 혈통 집단을 가리키는 관용 표현이므로, 직역 성격을 살리되 한국어에서는 자연스러운 ‘자손 중’으로 옮겼습니다.
- source_word: בֵּבָי
