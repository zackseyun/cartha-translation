  terminology: ‘베바이 자손’은 가문·후손 집단을 나타내는 히브리어 관용을 적절히 반영합니다. 각주 내용의 대상과 표지 위치를 맞추어, 자손 관련 각주는 ‘자손’에, 여호하난의 대체 음역 각주는 ‘여호하난’에 붙였습니다.
