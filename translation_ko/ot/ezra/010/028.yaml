  lexicon: 고유명사 음역
  rationale: 인명은 번역하지 않고 음역하는 원칙에 따라 한국어 표기를 맞췄습니다.
- source_word: יְהוֹחָנָן
  english_pob_choice: Jehohanan
  chosen_korean: 여호하난
  alternatives_korean:
