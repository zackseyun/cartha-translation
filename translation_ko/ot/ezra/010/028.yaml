  lexicon: 고유명사 음역
  rationale: 히브리어의 길어진 신명 요소를 반영해 ‘Jehohanan’에 가까운 형태로 옮겼고, 흔한 축약형 ‘요한’은 피했습니다.
- source_word: זַבַּי
  english_pob_choice: Zabbai
  chosen_korean: 잡배
  alternatives_korean:
  - 자배
  - 잠배
  lexicon: 고유명사 음역
  rationale: 표준 음역 원칙에 따라 영어 POB의 철자값과 히브리어 자음을 반영해 옮겼습니다.
- source_word: עַתְלָי
  english_pob_choice: Athlai
  chosen_korean: 앗들래
  alternatives_korean:
  - 앗랄래
  - 아틀래
  lexicon: 고유명사 음역
  rationale: 어말 자음과 모음값을 반영해 가능한 한 원형에 가깝게 음역했습니다.
theological_decisions:
- issue: 족보 목록의 ‘sons of’ 표현을 어떻게 처리할지
  chosen_reading: 직역을 유지하되 한국어에서는 ‘자손 중’으로 풀어, 혈통 집단을 나타내는 명단 문맥을 드러냈습니다.
  alternative_readings:
  - ‘아들들 중에서’로 더 문자적으로 옮김
  - ‘후손 가운데서’로 더 의역함
  rationale: 본문은 신학적 진술보다 명단 정보 전달이 중심이므로, 형식을 너무 평탄화하지 않으면서도 한국어 독해성을 확보하는 쪽이 적절합니다.
  doctrine_reference: 족보/명단 해석 원칙
