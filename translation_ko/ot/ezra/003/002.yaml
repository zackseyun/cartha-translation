  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
  footnotes:
  - marker: a
    text: Or 'his kinsmen' / 'his associates'; Hebrew 'his brothers,' with the following phrase specifying Jeshua's group as 'the priests.'
    reason: lexical_alternative
  - marker: b
    text: '''Law'' translates Hebrew torah, which can also mean ''instruction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아의 아들 여호사닥의 아들 예수아가 자기 형제인 제사장들과 함께 일어났고, 스룹바벨의 아들 스알디엘의 아들 스룹바벨도 자기 형제들과 함께 일어나, 이스라엘의 하나님 제단을 쌓아 그 위에 번제물을 드렸습니다. 이것은 하나님의 사람 모세의 율법에 기록된 대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 직역한 표현이며, 문맥상 예수아와 함께한 제사장 동료들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 כאן의 토라를 옮긴 것으로, 문맥에 따라 ‘가르침’이나 ‘훈계’의 의미도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났고
  alternatives_korean:
  - 일어났습니다
  - 나아갔고
  lexicon: HALOT
  rationale: 서사의 첫 동작을 시작하는 표현으로, 단순한 물리적 기립보다 행위 개시를 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  english_pob_choice: his brothers the priests
  chosen_korean: 자기 형제인 제사장들
  alternatives_korean:
  - 제사장인 형제들
  - 그의 형제들인 제사장들
  lexicon: HALOT
  rationale: אָח의 기본 의미를 살리되, 뒤따르는 동격인 ‘제사장들’이 그 형제들의 정체를 규정하므로 한국어에서도 그 관계가 분명하게 드러나도록 했습니다.
- source_word: וַיִּבְנוּ אֶת מִזְבַּח
  english_pob_choice: they built the altar
  chosen_korean: 제단을 쌓아
  alternatives_korean:
  - 제단을 세워
  - 제단을 건축하여
  lexicon: HALOT
  rationale: מזבח은 제의적 제단이지만 여기서는 성전 재건 맥락의 실제 조성 행위를 나타내므로, ‘쌓다’가 한국어에서 가장 직접적이고 자연스럽습니다.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  english_pob_choice: to offer burnt offerings on it
  chosen_korean: 그 위에 번제물을 드렸습니다
  alternatives_korean:
  - 그 위에 번제물을 올리려고
  - 그 위에 번제물을 바치기 위해
  lexicon: HALOT
  rationale: 히필 동사와 제사 용례를 함께 살려, 번제의 목적이 아니라 실제 제의 행위를 간명하게 나타내는 표현으로 옮겼습니다.
- source_word: בְּתוֹרַת מֹשֶׁה
  english_pob_choice: in the Law of Moses
  chosen_korean: 모세의 율법에 기록된 대로
  alternatives_korean:
  - 모세의 율법에
  - 모세의 토라에 기록된 대로
  lexicon: HALOT
  rationale: 토라의 여기서는 성전 제사 규범을 가리키므로, ‘율법’이 문맥상 가장 분명하며 ‘기록된 대로’를 더해 כַּכָּתוּב의 준수 의미를 살렸습니다.
theological_decisions:
- issue: יהוה 대신 אֱלֹהֵי יִשְׂרָאֵל의 호칭을 어떻게 한국어로 드러낼지
  chosen_reading: 이스라엘의 하나님
  alternative_readings:
  - 이스라엘 하나님
  - 이스라엘의 하느님
  rationale: 본문은 언약적 소유격 구조를 가진 일반 호칭이므로, 신학적 중립성을 유지하면서도 표준적인 기독교 한국어 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
- issue: 제단 재건과 제사 행위의 동시 표현
  chosen_reading: 제단을 쌓아 그 위에 번제물을 드렸습니다
  alternative_readings:
  - 제단을 쌓고 그 위에 번제물을 드렸습니다
  - 제단을 세우고 그 위에 번제물을 바쳤습니다
  rationale: 히브리어는 ‘쌓다’와 ‘번제물 드리다’를 연속해서 제시해 행위의 목적성을 드러내므로, 한국어에서도 그 긴밀한 관계를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
