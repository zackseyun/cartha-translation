source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
  footnotes:
  - marker: a
    text: Or 'on its base' or 'in its fixed place.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fear was upon them from the peoples of the lands,' that is, they were afraid because of the surrounding peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두려움이 그들 위에 있었기 때문에, 그 제단을 그 기초 위에 세웠습니다. 그리고 그 위에 야훼께 번제물을 올려드렸습니다. 아침 번제와 저녁 번제였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 받침 위에’ 또는 ‘그 고정된 자리에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들 위에 두려움이 있었다’는 식으로 말하며, 즉 주변 민족들 때문에 그들이 두려워했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ הַמִּזְבֵּחַ
  english_pob_choice: They set up the altar
  chosen_korean: 그들은 … 그 제단을 … 세웠습니다
  alternatives_korean:
  - 그들은 … 그 제단을 설치했습니다
  - 그들은 … 그 제단을 준비했습니다
  lexicon: HALOT
  rationale: 제단을 예배용으로 제자리에 놓는 뜻을 한국어에서 가장 자연스럽게 드러내는 동사는 ‘세우다’이며, 뒤의 ‘그 기초 위에’와도 잘 어울립니다.
- source_word: עַל מְכֹנוֹתָיו
  english_pob_choice: on its foundations
  chosen_korean: 그 기초 위에
  alternatives_korean:
  - 그 받침 위에
  - 그 고정된 자리에
  lexicon: HALOT
  rationale: מְכֹנוֹת는 기초, 받침, 고정된 자리의 뜻을 가지므로, 본문의 구체적 이미지와 문맥을 살려 ‘기초 위에’로 옮겼습니다.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  english_pob_choice: for fear was upon them because of the peoples of the lands
  chosen_korean: 두려움이 그들 위에 있었기 때문에
  alternatives_korean:
  - 그들이 두려움에 사로잡혀 있었기 때문에
  - 땅의 여러 백성들 때문에 두려워하고 있었기 때문에
  lexicon: HALOT
  rationale: 히브리어의 ‘두려움이 위에 있다’는 관용을 보존하되, 한국어에서 자연스럽게 읽히도록 원인을 함께 드러냈습니다.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  english_pob_choice: burnt offerings morning and evening
  chosen_korean: 아침 번제와 저녁 번제였습니다
  alternatives_korean:
  - 아침과 저녁의 번제였습니다
  - 아침마다 저녁마다 번제물을 드렸습니다
  lexicon: HALOT
  rationale: 반복된 עֹלוֹת를 ‘번제’로 유지하여 제의적 성격을 분명히 했고, ‘아침과 저녁’의 규칙적 시간을 간결하게 전달했습니다.
theological_decisions:
