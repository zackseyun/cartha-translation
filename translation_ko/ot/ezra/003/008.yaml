revisions:
- from: 그들이 예루살렘 하나님의 집에 온 뒤 두 번째 해 둘째 달에, 스룹바벨—스알디엘의 아들—과 여호수아—요사닥의 아들—와 그들의 나머지 형제들, 곧 제사장들과 레위 사람들, 그리고 포로에서 예루살렘으로 돌아온 모든 이가 일을 시작하였으며, 레위 사람들을 스무 살 이상으로 세워 야훼의 집 일꾼들을 감독하게 하였습니다.[a]
  to: 그들이 예루살렘에 있는 하나님의 집에 온 뒤 둘째 해 둘째 달에, 스룹바벨 곧 스알디엘의 아들과 여호수아 곧 요사닥의 아들과, 그들의 나머지 형제들인 제사장들과 레위 사람들과, 포로 생활에서 예루살렘으로 온 모든 사람이 공사를 시작하고, 스무 살 이상 된 레위 사람들을 세워 야훼의 집의 일을 감독하게 하였습니다.[a]
  rationale: The revision preserves the source’s coordinated subject and two actions (“began” and “appointed”), states the age requirement correctly, and renders the Levites’ responsibility as supervision of the work of Yahweh’s house. It removes the unsupported reference to temple workers and the added implication that the arrivals were necessarily returning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:21:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the temporal setting, principal names, the designation “house of God,” and the divine name “Yahweh/야훼.” However, it materially alters the final clause: the Hebrew appoints Levites aged twenty and above to oversee the work of Yahweh’s house, not to oversee workers in Yahweh’s house. “돌아온” also adds a return nuance not explicitly expressed by the source.'
  naturalness: The proposed revision uses idiomatic modern formal-polite Korean and clarifies that the age qualification applies to the Levites. It also avoids the awkward and potentially misleading phrase “스무 살 이상으로 세워.”
  terminology: “하나님의 집,” “야훼,” “제사장,” and “레위 사람” are retained. “포로 생활에서” naturally represents מֵהַשְּׁבִי without introducing the stronger implication of return. “야훼의 집의 일” preserves the source’s reference to the work belonging to/associated with the house, rather than adding “workers.”
  issues:
  - severity: high
    issue: “야훼의 집 일꾼들을 감독하게 하였습니다” makes the Levites oversee workers.
    rationale: לְנַצֵּחַ עַל מְלֶאכֶת בֵּית־יְהוָה means overseeing the work of the house of Yahweh. The source does not contain a term for workers, and the added object changes the assigned responsibility.
  - severity: high
    issue: “레위 사람들을 스무 살 이상으로 세워” fails to express the age threshold as a qualification of the Levites.
    rationale: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה denotes Levites from twenty years of age and upward. Korean should state that those appointed were aged twenty and above.
  - severity: medium
    issue: “포로에서 … 돌아온” introduces an unexpressed return nuance.
    rationale: The Hebrew says those who came from the captivity to Jerusalem. “포로 생활에서 예루살렘으로 온” retains the directional and temporal sense without adding “returned.”}],
  - severity: low
    issue: The current footnote describes the English audit trail rather than serving Korean readers directly.
    rationale: A Korean footnote should simply provide the viable Korean lexical alternative, not explain that it follows an English rendering.
  revised_text: 그들이 예루살렘에 있는 하나님의 집에 온 뒤 둘째 해 둘째 달에, 스룹바벨 곧 스알디엘의 아들과 여호수아 곧 요사닥의 아들과, 그들의 나머지 형제들인 제사장들과 레위 사람들과, 포로 생활에서 예루살렘으로 온 모든 사람이 공사를 시작하고, 스무 살 이상 된 레위 사람들을 세워 야훼의 집의 일을 감독하게 하였습니다.[a]
