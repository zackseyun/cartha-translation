  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or, “from exile.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예루살렘 하나님의 집에 온 뒤 두 번째 해 둘째 달에, 스룹바벨—스알디엘의 아들—과 여호수아—요사닥의 아들—와 그들의 나머지 형제들, 곧 제사장들과 레위 사람들, 그리고 포로에서 예루살렘으로 돌아온 모든 이가 일을 시작하였으며, 레위 사람들을 스무 살 이상으로 세워 야훼의 집 일꾼들을 감독하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로’는 영어 POB의 “captivity”를 따른 직역입니다. 본문은 ‘유배’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוֹאָם
  english_pob_choice: after their coming
  chosen_korean: 온 뒤
  alternatives_korean:
  - 도착한 뒤
  - 그들이 온 후에
  lexicon: HALOT
  rationale: 히브리어의 시간적 관계를 한국어의 자연스러운 ‘온 뒤’로 살리되, 사건의 선후를 분명히 했습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님 집
  - 성전
  lexicon: HALOT
  rationale: 원문의 직역 구조를 유지했습니다. ‘성전’은 이해를 돕지만 본문이 말하는 표현을 좀 더 해석적으로 바꾸므로 본문에서는 피했습니다.
- source_word: הֵחֵלּוּ
  english_pob_choice: began
  chosen_korean: 일을 시작하였으며
  alternatives_korean:
  - 시작하였으며
  - 착수하였으며
  lexicon: HALOT
  rationale: 동사가 뒤에 이어지는 성전 공사와 연결되므로, 한국어에서는 ‘일을 시작하다’로 풀어 의미를 분명히 했습니다.
- source_word: וַיַּעֲמִידוּ
  english_pob_choice: appointed
  chosen_korean: 세워 … 감독하게 하였습니다
  alternatives_korean:
  - 임명하여 … 맡겼습니다
  - 배치하여 … 감독하게 하였습니다
  lexicon: HALOT
  rationale: ‘세우다’의 설치/임명 의미와 감독 책임을 함께 살리기 위해 ‘세워 … 감독하게 하다’로 옮겼습니다.
- source_word: מֵהַשְּׁבִי
  english_pob_choice: from the captivity
  chosen_korean: 포로에서
  alternatives_korean:
  - 포로 생활에서
  - 유배에서
  lexicon: HALOT
  rationale: 영어 POB의 ‘from the captivity’에 맞추면서도, 한국어에서는 상태를 나타내는 간결한 표현으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 규정에 따라 여호와 대신 학술적 음역 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 예루살렘 하나님의 집과 성전 표현
  chosen_reading: ‘하나님의 집’으로 직역을 유지하고, ‘성전’은 본문 밖 해설로 남겼습니다.
  alternative_readings:
  - 성전
  - 여호와의 성전
  rationale: 이 절은 건물의 기능을 설명하기보다 언약적 호칭인 ‘하나님의 집’을 사용합니다. 본문을 해석어로 바꾸기보다 원문 표현의 결을 보존했습니다.
  doctrine_reference: 'POB 번역 원칙: source-direct rendering'
- issue: 스무 살 이상의 레위 사람들을 일꾼으로 감독하게 함
  chosen_reading: 레위 사람들을 스무 살 이상으로 세워 야훼의 집 일꾼들을 감독하게 했습니다.
  alternative_readings:
  - 레위 사람들을 스무 살 이상으로 세워 감독하게 했습니다
  - 레위 사람들을 스무 살 이상으로 임명했습니다
  rationale: 히브리어는 레위 사람들에게 성전 공사의 감독 역할을 부여합니다. 단순 임명보다 ‘감독하게 하다’가 책임 범위를 더 정확히 드러냅니다.
  doctrine_reference: 'HALOT: נצח in administrative oversight context'
