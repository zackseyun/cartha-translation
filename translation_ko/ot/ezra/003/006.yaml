  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
  footnotes:
  - marker: a
    text: 'Or: ''But the foundation of the temple of the LORD had not yet been laid.'' The Hebrew conjunction can be rendered more simply as ''and'' or adversatively as ''but''; the sense is that sacrifices began before the temple foundation was laid.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제칠월 초하루부터 그들은 야훼께 번제물을 드리기 시작했으나, 야훼의 성전의 기초는 아직 놓이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: 「그러나 야훼의 성전의 기초는 아직 놓이지 않았습니다」. 히브리어 접속사는 단순한 ‘그리고’로도, 문맥상 대조적인 ‘그러나’로도 옮길 수 있으며, 의미는 제사가 성전 기초가 놓이기 전에 시작되었다는 점입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד
  english_pob_choice: From the first day
  chosen_korean: 초하루부터
  alternatives_korean:
  - 첫째 날부터
  - 그 달의 첫날부터
  lexicon: HALOT
  rationale: מִן + יוֹם은 시작점을 나타내므로, 한국어에서는 자연스럽고 간결한 시간 시작 표현인 ‘초하루부터’로 옮겨 시작의 뉘앙스를 살렸습니다.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: of the seventh month
  chosen_korean: 제칠월
  alternatives_korean:
  - 일곱째 달
  - 제7월
  lexicon: HALOT
  rationale: 달의 번호를 명시하는 관용적 표현으로 ‘제칠월’을 사용해 본문이 가리키는 특정 월을 분명히 했습니다.
- source_word: לְהַעֲלוֹת עֹלוֹת
  english_pob_choice: to offer burnt offerings
  chosen_korean: 번제물을 드리기 시작했으나
  alternatives_korean:
  - 번제물을 올리기 시작했으나
  - 번제물을 바치기 시작했으나
  lexicon: HALOT
  rationale: 제사 문맥의 ‘올리다’ 직역보다, 예배 행위의 자연스러운 한국어인 ‘드리다’를 택하되 제사의 종류인 ‘번제물’은 유지했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격은 ‘-께’로 표시했습니다.
- source_word: וְהֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 성소
  - 야훼의 궁전
  lexicon: HALOT
  rationale: 에스라의 귀환·성전 재건 맥락에서 הֵיכָל은 가장 분명하게 ‘성전’으로 이해되므로, 전통적이면서도 문맥에 맞는 한국어로 옮겼습니다.
- source_word: לֹא יֻסָּד
  english_pob_choice: had not been laid
  chosen_korean: 기초는 아직 놓이지 않았습니다
  alternatives_korean:
  - 기초는 아직 세워지지 않았습니다
  - 아직 기초가 놓이지 않았습니다
  lexicon: HALOT
  rationale: 수동형 יסד의 핵심 의미인 ‘기초를 놓다’를 한국어 관용에 맞게 풀어, 성전 건축이 아직 시작 단계에 이르지 않았음을 분명히 했습니다.
