  rationale: 본문은 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 언약적 고유명을 ‘야훼’로 표기해 본문의 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
