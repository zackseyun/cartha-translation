id: EZR.3.9
reference: Ezra 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Judah.'' Some ancient versions and modern translations read ''the sons of Hodaviah.'''
    reason: textual_variant
translation:
  language: ko
  text: 예수아와 그의 아들들과 형제들, 갓미엘과 그의 아들들 곧 유다의 아들들[a], 그리고 헤나닷의 아들들과 그들의 아들들과 형제들, 곧 레위 사람들은 모두 한마음으로 서서 하나님의 집에서 일하는 이들을 감독했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘유다의 아들들’로 되어 있습니다. 일부 고대 역본과 현대 번역본은 ‘호다위야의 아들들’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 일어나
  alternatives_korean:
  - 서 있었습니다
  - 자리를 잡았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 기립보다 직무 수행을 위한 자세를 취하는 뜻이므로, 자연스러운 현대 한국어로 ‘일어나’가 동작의 개시를 잘 드러냅니다.
- source_word: לְנַצֵּחַ עַל
  english_pob_choice: to oversee
  chosen_korean: 감독했으며
  alternatives_korean:
  - 감독하여
  - 살폈으며
  lexicon: HALOT
  rationale: נצב/נצח 계열의 의미를 여기서는 노동자들을 관리·감독하는 기능으로 이해하는 것이 적절하므로, 교회 직분 용어와도 겹치는 ‘감독하다’를 사용했습니다.
- source_word: בְּנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다의 아들들
  alternatives_korean:
  - 유다 사람들
  - 유다의 자손들
  lexicon: HALOT
  rationale: 본문의 자음독과 영어 POB의 결정을 따라 ‘Judah’로 직접 옮기되, 남성 친족 표현인 ‘sons’를 보존했습니다.
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 집 안
  - 하나님의 성전
  lexicon: HALOT
  rationale: 에즈라-느헤미야에서 반복되는 성전적 관용구를 살리면서도, 과도하게 해설하지 않기 위해 직역에 가까운 ‘하나님의 집’을 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 자손들
  lexicon: HALOT
  rationale: 족보적·집단적 표지를 지닌 הלויים는 한국어 성서에서 통용되는 ‘레위 사람들’로 옮겨, 직함보다 혈통 집단임을 분명히 했습니다.
theological_decisions:
- issue: בְּנֵי יְהוּדָה의 전승 차이
  chosen_reading: 마소라 본문대로 ‘유다의 아들들’로 옮기고, 대안 전승은 각주로 처리합니다.
  alternative_readings:
  - 호다위야의 아들들
  rationale: 주어진 원문은 WLC의 마소라 본문이므로 이를 우선하고, 전승 차이는 본문 밖에서 투명하게 표시하는 편이 원문 충실성과 감사 가능성에 부합합니다.
  doctrine_reference: 원문 우선 원칙; 본문 이문에 대한 투명성 유지
