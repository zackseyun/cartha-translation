id: EZR.3.7
reference: Ezra 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
  footnotes:
  - marker: a
    text: Or 'silver' instead of 'money.' The Hebrew term can denote the metal itself or money in a payment context.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the port of Joppa.' Literally, 'to the sea of Joppa.'
    reason: lexical_alternative
  - marker: c
    text: Or 'according to the permission/grant of Cyrus king of Persia to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들은 석공들과 기술자들에게 돈[a]을 주고, 시돈 사람들과 두로 사람들에게는 음식과 마실 것과 기름을 주어 레바논에서 삼나무 재목을 욥바 바다[b]까지 가져오게 하였습니다. 이것은 바사 왕 고레스가 그들에게 내린 허가[c]에 따른 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은’. 이 히브리어는 지급 문맥에서 금속 자체나 돈을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘욥바 항구로’. 문자적으로는 ‘욥바의 바다로’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘바사 왕 고레스가 그들에게 내린 허가에 따라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 화폐
  lexicon: HALOT
  rationale: 제사/건축 맥락의 지급 수단이므로 현대 한국어에서는 ‘돈’이 가장 자연스럽고, ‘은’의 금속성보다 지불 기능을 분명히 드러냅니다.
- source_word: לַחֹצְבִים
  english_pob_choice: to the stonecutters
  chosen_korean: 돌을 다듬는 사람들
  alternatives_korean:
  - 돌공들에게
  - 석공들에게
  lexicon: HALOT
  rationale: 어근 חצב의 ‘돌을 자르다/캐다’ 의미를 살리면서도, 한국어에서 문맥상 자연한 건축 노동자를 뜻하도록 옮겼습니다.
- source_word: וְלֶחָרָשִׁים
  english_pob_choice: and to the craftsmen
  chosen_korean: 기술자들
  alternatives_korean:
  - 장인들에게
  - 목수들에게
  lexicon: HALOT
  rationale: חרש가 특정 직종보다 숙련된 기술자를 가리킬 수 있어, 너무 좁히지 않도록 ‘기술자들’로 옮겼습니다.
- source_word: עֲצֵי אֲרָזִים
  english_pob_choice: cedar timber
  chosen_korean: 삼나무 재목
  alternatives_korean:
  - 백향목 재목
  - 삼나무 목재
  lexicon: HALOT
  rationale: POB의 ‘cedar timber’를 건축용 재목으로 살리면서, 한국어 성경어법에서 통용되는 재료 표현으로 옮겼습니다. '백향목'은 전통어지만 본문은 나무 재료의 물류 전달을 말하므로 '재목'이 더 직접적입니다.
- source_word: יָם יָפוֹא
  english_pob_choice: the sea at Joppa
  chosen_korean: 욥바 바다
  alternatives_korean:
  - 욥바 항구
  - 욥바 해안
  lexicon: HALOT
  rationale: 히브리어의 직역에 가까운 ‘바다’를 유지하되, 한국어에서 이해 가능한 지명 결합으로 표현했습니다. 항구로 풀어 쓰는 대안도 가능하지만 원문의 지시적 표현을 보존했습니다.
- source_word: כְּרִשְׁיֹון
  english_pob_choice: according to the authorization
  chosen_korean: 허가에 따른
  alternatives_korean:
  - 인가에 따른
  - 허용에 따른
  - 허가를 받은
  lexicon: HALOT
  rationale: 공적 승인/허가의 행정적 의미를 반영했습니다. ‘허가를 받은’보다 문장 구조상 원문의 근거성(according to)을 더 잘 드러냅니다.
theological_decisions:
- issue: 왕의 허가를 나타내는 עֲלֵיהֶם의 처리
  chosen_reading: ‘그들에게 대한 허가’로 옮겨, 허가가 사람들에게 적용된다는 행정적 관계를 드러냈습니다.
  alternative_readings:
  - 그들에게 주어진 허가
  - 그들에게 대한 승인
  rationale: 본문은 단순한 감정적 ‘호의’가 아니라, 왕의 공식적 허가가 그들에게 부여된 상황을 말합니다. 따라서 관계를 약화시키지 않고 그대로 보존했습니다.
  doctrine_reference: 성경 본문의 역사-행정적 진술은 과장 없이 그대로 전달되어야 한다는 원칙
