id: EZR.3.12
reference: Ezra 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
  footnotes:
  - marker: a
    text: Or 'the former house' for 'the first house.' The Hebrew literally says 'the first house,' referring to the earlier temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'when the foundation of this house was laid.'
    reason: lexical_alternative
  - marker: c
    text: '''Heads of fathers’ houses'' refers to leaders of ancestral family groups or clans.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 제사장들과 레위 사람들과 조상들의 우두머리들[a], 곧 첫 번째 집을 보았던 늙은이들은 이 집의 기초가 그들의 눈앞에서 놓일 때[b] 큰 소리로 울었고, 많은 사람은 기쁨의 함성을 지르며 소리를 높였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들의 우두머리들’은 씨족 또는 가문의 지도자들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이 집의 기초가 놓일 때’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  english_pob_choice: of the priests and Levites and heads of fathers’ houses
  chosen_korean: 제사장들과 레위 사람들과 조상들의 우두머리들
  alternatives_korean:
  - 제사장들과 레위인들과 족장들
  - 제사장들과 레위 사람들과 가문의 우두머리들
  lexicon: HALOT
  rationale: partitive 관계를 살려 ‘~들 가운데 많은 사람’의 의미를 문장 흐름에서 자연스럽게 풀었고, רָאשֵׁי הָאָבוֹת는 씨족/가문 지도자를 가리키므로 ‘조상들의 우두머리들’로 옮겼습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the old men
  chosen_korean: 늙은이들
  alternatives_korean:
  - 장로들
  - 연로한 사람들
  lexicon: HALOT
  rationale: 여기서는 직분보다 연령이 초점이므로, 문맥상 성전 이전을 기억할 수 있을 만큼 나이 든 사람들을 가리키는 표현으로 옮겼습니다.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  english_pob_choice: who had seen the first house
  chosen_korean: 첫 번째 집을 보았던
  alternatives_korean:
  - 이전 집을 보았던
  - 첫 집을 보았던
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 히브리어의 반복적 연결을 살리고, 문맥상 그 집이 곧 성전임은 독자가 알 수 있도록 했습니다.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  english_pob_choice: when this house was founded / when the foundation of this house was laid
  chosen_korean: 이 집의 기초가 그들의 눈앞에서 놓일 때
  alternatives_korean:
  - 이 집의 기초가 놓일 때
  - 이 집의 기초가 세워질 때
  lexicon: HALOT
  rationale: יסד의 기초 놓음/기초 세움 의미를 살리면서, בְּעֵינֵיהֶם의 ‘그들의 눈앞에서’라는 직접 목격성을 함께 드러냈습니다.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  english_pob_choice: were weeping with a loud voice
  chosen_korean: 큰 소리로 울었고
  alternatives_korean:
  - 큰소리로 울었고
  - 높은 소리로 울었고
  lexicon: HALOT
  rationale: 현재분사적 진행을 한국어 과거 서술로 자연스럽게 처리하되, בְּקוֹל גָּדוֹל의 강한 음성성을 보존했습니다.
- source_word: בִּתְרוּעָה בְשִׂמְחָה
  english_pob_choice: with a shout of joy
  chosen_korean: 기쁨의 함성을 지르며
  alternatives_korean:
  - 기쁨의 환호를 지르며
  - 즐거운 함성으로
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 감정이 아니라 외치는 함성의 성격이 있어 ‘함성’을 택했고, בְשִׂמְחָה를 목적격적 수식으로 반영했습니다.
theological_decisions:
- issue: 출력 문체에서 탄식과 환호의 동시 대비를 어떻게 살릴지
  chosen_reading: ‘그러나 ... 울었고, ... 기쁨의 함성을 지르며’로 대조를 분명히 드러냈습니다.
  alternative_readings:
  - 그리고 ... 울었고, ... 기쁨의 함성을 지르며
  - 한편 ... 울었고, ... 환호했습니다
  rationale: 본문은 같은 장면 안에서 두 반응을 병렬적으로 제시하면서도, 전후 문맥상 대조가 강하므로 ‘그러나’가 자연스럽습니다.
  doctrine_reference: 서사 문맥의 수사적 대비
