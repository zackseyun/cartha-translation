source:
  edition: WLC
  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
  footnotes:
  - marker: a
    text: Or, 'they answered'—the Hebrew verb can mean 'responded,' likely in antiphonal or responsive praise.
    reason: lexical_alternative
  - marker: b
    text: Or, 'for his steadfast love endures forever toward Israel.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'because the house of the LORD was founded'; in context this refers to the laying of the temple's foundation.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 야훼께 찬양과 감사의 노래로 화답했습니다[a]. “그분은 선하시며, 이스라엘을 향한 그분의 한결같은 사랑은 영원합니다.”[b] 온 백성은 야훼를 찬양하며 큰 함성을 질렀습니다. 야훼의 집의 기초가 놓였기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “응답했습니다.” 히브리어 동사는 단순히 대답한다는 뜻일 수도 있으나, 이 예배 문맥에서는 교창으로 화답하는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분의 이스라엘을 향한 한결같은 사랑은 영원합니다.”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “야훼의 집이 기초를 놓았다” 또는 “야훼의 집이 창건되었다”입니다. 문맥상 성전의 기초가 놓인 일을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  english_pob_choice: they sang responsively
  chosen_korean: 찬양하며 감사하는 노래로 화답하였고
  alternatives_korean:
  - 응답하였고
  - 화답하며 노래하였고
  lexicon: HALOT
  rationale: 문맥상 단순한 '대답'보다 예배 중 교창적 응답을 가리키므로, POB의 해석을 따라 화답의 의미를 살렸습니다.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  english_pob_choice: praising and giving thanks
  chosen_korean: 찬양하며 감사하는
  alternatives_korean:
  - 찬양과 감사로
  - 찬양하며 감사드리며
  lexicon: HALOT
  rationale: 두 동작을 모두 드러내기 위해 수식적 표현으로 옮겨, 찬양과 감사가 함께 이루어진 예배 행위를 자연스럽게 반영했습니다.
- source_word: לַיהוָה / יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 이름(יהוה)을 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약 이름인 '야훼'로 옮겼습니다.
- source_word: כִּי טוֹב
  english_pob_choice: For he is good
  chosen_korean: 그분은 선하시다
  alternatives_korean:
  - 그는 좋으시다
  - 그분은 좋으시다
  lexicon: HALOT
  rationale: 예배적 고백 공식으로서 한국어에서 자연스러운 하나님의 선하심 표현인 '선하시다'를 택했습니다.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  english_pob_choice: for his steadfast love toward Israel is forever
  chosen_korean: 그의 인자하심이 이스라엘을 향하여 영원하기 때문이다
  alternatives_korean:
  - 그의 변함없는 사랑이 이스라엘을 향해 영원하기 때문이다
  - 그의 인자하심이 이스라엘 위에 영원하기 때문이다
  lexicon: HALOT
  rationale: חסד의 언약적 뉘앙스를 '인자하심'으로 살리고, עַל의 방향성을 '을 향하여'로 드러냈습니다.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  english_pob_choice: shouted a great shout
  chosen_korean: 큰 함성을 질렀습니다
  alternatives_korean:
  - 큰 외침을 올렸습니다
  - 크게 함성을 질렀습니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 중복 표현을 한국어 관용으로 옮겨, 단순한 '소리 냄'보다 강한 환호의 규모를 살렸습니다.
- source_word: עַל הוּסַד בֵּית יְהוָה
  english_pob_choice: because the house of Yahweh had been founded
  chosen_korean: 야훼의 집의 기초가 놓였기 때문입니다
  alternatives_korean:
  - 야훼의 집이 세워졌기 때문입니다
  - 야훼의 집의 터가 놓였기 때문입니다
  lexicon: HALOT
  rationale: Hophal הוּסַד를 문맥상 성전의 기초 놓임으로 분명히 드러내면서도, 원문의 'found/lay a foundation' 의미를 반영했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: יהוה를 '야훼'로 직역적 음역하여 본문에 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 예배 응답과 찬양의 중심에 언약 이름을 두므로, 전통적 대체어보다 고유 이름을 드러내는 편이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → Yahweh'
- issue: חסד의 번역
  chosen_reading: '''인자하심''으로 옮겨 언약적 사랑과 신실함의 뉘앙스를 보존했습니다.'
  alternative_readings:
  - 사랑
  - 긍휼
  - 변함없는 사랑
  rationale: 문맥은 단순한 호의보다 야훼의 지속적 언약 사랑을 찬양하는 고백이므로, 교회적 상투어보다 의미 범위가 넓은 '인자하심'이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6; consistency of key terms §5
