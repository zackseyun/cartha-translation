  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''as one man,'' that is, in united action or with one accord.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱째 달이 이르렀을 때, 이스라엘의 아들들이 여러 성읍들에 있었으나, 백성은 한 사람처럼 예루살렘에 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 히브리어 관용구로, ‘한 사람처럼’, 곧 한마음 한뜻으로라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע / the seventh month arrived
  english_pob_choice: arrived
  chosen_korean: 이르렀을 때
  alternatives_korean:
  - 도래했을 때
  - 찾아왔을 때
  lexicon: HALOT
  rationale: 달이 ‘도착하다’는 시간 표현으로 쓰인 점을 살려, 현대 한국어에서 자연스러운 ‘이르렀을 때’로 옮겼습니다.
- source_word: וּבְנֵי יִשְׂרָאֵל / the sons of Israel
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 원문의 남성 복수 표현을 지워 버리지 않고 직접 반영했습니다. POB의 소스 직역 경향을 따라 ‘아들들’을 유지했습니다.
- source_word: בֶּעָרִים / were in the cities
  english_pob_choice: were in the cities
  chosen_korean: 여러 성읍들에 있었으나
  alternatives_korean:
  - 성읍들에 있었습니다
  - 성읍들 가운데 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 서술 관계를 한국어에서 풀어 주되, 단순한 위치 진술이 아니라 각 성읍에 분산되어 있던 상황을 자연스럽게 드러냈습니다.
- source_word: כְּאִישׁ אֶחָד / as one man
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로
  - 한 뜻으로
  lexicon: HALOT
  rationale: 관용구의 일치·연합의 의미를 살리면서도 한국어에서 부자연스러운 직역을 약간 완화했습니다. 원문의 남성 단수 이미지를 완전히 평준화하지 않으면서도 읽기 쉽게 했습니다.
- source_word: וַיֵּאָסְפוּ הָעָם / the people gathered
  english_pob_choice: the people gathered
  chosen_korean: 백성은 … 모였습니다
  alternatives_korean:
  - 백성이 … 모였습니다
  - 백성은 … 함께 모였습니다
  lexicon: HALOT
  rationale: 공동체 전체의 집합을 한국어에서 ‘백성’과 ‘모였습니다’로 간결하게 옮겼습니다. ‘gathered together’의 공동성은 문맥과 병렬 구조로 충분히 전달됩니다.
theological_decisions:
- issue: 공동체의 연합을 나타내는 כְּאִישׁ אֶחָד의 처리
  chosen_reading: ‘한 사람처럼’으로 옮겨 연합의 강도를 살리되, 남성 단수 이미지를 삭제하지 않았습니다.
  alternative_readings:
  - 한 뜻으로
  - 일치하여
  rationale: 본문은 단순한 동의가 아니라 하나의 몸처럼 움직이는 공동 행동을 강조합니다. 한국어에서도 그 압축된 강도를 유지하는 것이 소스 충실성에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
