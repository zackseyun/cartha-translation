base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
  footnotes:
  - marker: a
    text: Or 'could not recognize the sound of the joyful shouting from the sound of the people’s weeping.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with a great shout'; some English versions render 'with a loud shout.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성은 기쁨의 환호 소리와 백성의 울음소리를 분간하지 못했습니다[a]. 백성이 큰 함성을 지르고 있었고 그 소리가 멀리까지 들렸기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁨의 환호 소리와 백성의 울음소리를 구별하지 못했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘큰 함성을 외치다’라는 동족어근 반복 표현입니다. 또는 ‘크게 외치고 있었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  english_pob_choice: could not distinguish
  chosen_korean: 분간하지 못했습니다
  alternatives_korean:
  - 알아보지 못했습니다
  - 구별하지 못했습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 두 소리를 서로 가려내지 못한다는 뜻이므로, 단순 인지보다 ‘분간하다’가 문맥에 가장 정확합니다.
- source_word: ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה
  english_pob_choice: the sound of the shout of joy
  chosen_korean: 기쁨의 외치는 소리
  alternatives_korean:
  - 기뻐 외치는 소리
  - 기쁨의 함성
  lexicon: HALOT
  rationale: קוֹל과 תְּרוּעָה의 중첩을 살려, ‘기쁨’과 ‘외치는 소리’를 함께 드러내는 표현으로 옮겼습니다.
- source_word: בְּכִ֣י הָ/עָ֑ם
  english_pob_choice: the people’s weeping
  chosen_korean: 백성의 울음소리
  alternatives_korean:
  - 백성의 통곡소리
  - 백성의 울음
  lexicon: HALOT
  rationale: 비교 대상이 청각적 현상이므로 ‘울음’보다 소리성을 분명히 한 ‘울음소리’가 원문의 대비를 더 잘 드러냅니다.
- source_word: מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה
  english_pob_choice: were shouting with a great shout
  chosen_korean: 큰 함성을 지르고 있었고
  alternatives_korean:
  - 크게 함성을 지르고 있었고
  - 큰 소리로 외치고 있었고
  lexicon: HALOT
  rationale: 동사 רוע와 명사 תְּרוּעָה의 어근 반복을 자연스러운 한국어로 살리기 위해 ‘함성을 지르다’를 택했습니다.
- source_word: עַד לְ/מֵ/רָחֽוֹק
  english_pob_choice: was heard far away
  chosen_korean: 멀리까지 들렸기 때문입니다
  alternatives_korean:
  - 먼 데까지 들렸기 때문입니다
  - 아주 멀리 들렸기 때문입니다
  lexicon: HALOT
  rationale: 수동형 ‘들렸다’와 거리 표현을 함께 살려, 소리가 멀리 전파되었다는 뜻을 간결하게 전달합니다.
