id: EZR.3.5
reference: Ezra 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering' or 'the daily burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'new moons,' referring to the monthly sacred observances at the start of each month.
    reason: cultural_note
  - marker: c
    text: Or 'appointed times' or 'festivals' of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에는 상번제와 초하루 제물과 야훼의 모든 정해진 절기들—곧 거룩하게 구별된 절기들—과 야훼께 자원하여 드리는 모든 사람이 드리는 자원제가 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상번제’는 ‘continual’의 의미를 담는 제의적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘초하루’는 히브리어 ‘new moons’가 가리키는 매달 초의 예배 관습을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘정해진 절기들’은 ‘appointed times’ 또는 ‘festivals’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: And after that
  chosen_korean: 그 뒤에는
  alternatives_korean:
  - 그 후에는
  - 그리고 그 뒤에는
  lexicon: HALOT
  rationale: 시간적 순서를 자연스러운 현대 한국어로 옮기되, 원문의 연결 의미를 유지했습니다.
- source_word: עֹלַת תָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 상번제
  alternatives_korean:
  - 늘 드리는 번제
  - 매일 드리는 번제
  lexicon: HALOT
  rationale: 성전 제의 용어로서 관용적인 ‘번제’를 유지하되, תָּמִיד의 지속/정규성을 담는 표준적 제의어인 ‘상번제’를 택했습니다.
- source_word: לֶחֳדָשִׁים
  english_pob_choice: the new moons
  chosen_korean: 초하루 제물
  alternatives_korean:
  - 새달 제물
  - 월삭 제물
  lexicon: HALOT
  rationale: 달의 시작에 드리는 성경적 제의 관습을 한국어 독자가 이해하도록 ‘초하루’로 풀어, 단순한 달(월) 일반이 아니라 새달 의례를 가리킨다는 점을 살렸습니다.
- source_word: מוֹעֲדֵי יְהוָה
  english_pob_choice: the appointed feasts of Yahweh
  chosen_korean: 야훼의 모든 정해진 절기들
  alternatives_korean:
  - 야훼의 모든 지정된 때들
  - 야훼의 모든 절기들
  lexicon: HALOT
  rationale: מוֹעֲדִים의 고정된 예배 시기라는 뜻을 반영해 ‘정해진 절기들’로 옮겼고, POB의 신명사 사용을 따라 ‘야훼’를 유지했습니다.
- source_word: הַמְקֻדָּשִׁים
  english_pob_choice: that were consecrated
  chosen_korean: 거룩하게 구별된
  alternatives_korean:
  - 성별된
  - 성화된
  lexicon: HALOT
  rationale: 절기들이 단지 ‘거룩하다’는 상태가 아니라 예배를 위해 따로 구별되었다는 점을 드러내는 표현으로 옮겼습니다.
- source_word: נְדָבָה
  english_pob_choice: a freewill offering
  chosen_korean: 자원제
  alternatives_korean:
  - 자원하는 제물
  - 자발제
  lexicon: HALOT
  rationale: 자원의 의미가 분명한 제의 용어이므로 한국어 성경에서 통용되는 ‘자원제’로 옮겨, 문맥의 제사적 성격을 분명히 했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기준에 따라 언약명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 절기들을 ‘거룩하게 구별된’으로 보강한 이유
  chosen_reading: 제의적 성별과 구별을 드러내는 번역
  alternative_readings:
  - 그냥 ‘정해진 절기들’로만 번역
  - ‘거룩한 절기들’
  rationale: הַמְקֻדָּשִׁים는 단순한 일정표가 아니라 예배를 위해 성별된 절기라는 의미이므로, 신학적 함의를 약화시키지 않도록 ‘거룩하게 구별된’으로 풀었습니다.
  doctrine_reference: 구약 제의성/성별 개념
