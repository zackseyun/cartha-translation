translation:
  language: ko
  text: 건축자들이 야훼의 성전의 기초를 놓을 때, 그들은 예복을 입고 나팔을 든 제사장들과 제금을 든 아삽의 자손인 레위 사람들을 세워, 이스라엘 왕 다윗의 지시에 따라[a] 야훼를 찬양하도록 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘이스라엘 왕 다윗의 손을 따라’라고 되어 있습니다. 이는 다윗을 통하여 전해진 지시나 규정에 따른다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּדוּ
  english_pob_choice: laid the foundation
  chosen_korean: 기초를 놓자
  alternatives_korean:
  - 기초를 놓았습니다
  - 토대를 놓자
  - 기반을 세우자
  lexicon: HALOT
  rationale: יסד는 여기서 건물의 기초 놓기를 뜻하므로, 성전 건축 문맥에 자연스러운 ‘기초를 놓다’로 옮겼습니다.
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 궁전
  - 야훼의 집
  - 주님의 성전
  lexicon: HALOT
  rationale: הֵיכָל은 성전/궁전 구조물을 가리키지만, 에스라의 성전 건축 문맥에서는 ‘성전’이 가장 직접적입니다.
- source_word: מְלֻבָּשִׁים
  english_pob_choice: clothed in their vestments
  chosen_korean: 예복을 입은 채
  alternatives_korean:
  - 제복을 입은 채
  - 의복을 입은 채
  - 성복을 입은 채
  lexicon: HALOT
  rationale: 공적 예배의 제사장 복장을 가리키므로, 단순한 ‘옷’보다 예식적 뉘앙스를 살린 ‘예복’이 적절합니다.
- source_word: לְהַלֵּל אֶת יְהוָה
  english_pob_choice: to praise Yahweh
  chosen_korean: 야훼를 찬양하려고
  alternatives_korean:
  - 야훼를 찬양하기 위해
  - 야훼를 찬송하려고
  - 야훼를 높이 찬양하려고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구이므로, 현대 한국어에서 자연스러운 목적 표현으로 옮겼습니다.
- source_word: עַל יְדֵי דָּוִיד
  english_pob_choice: according to the directions of David
  chosen_korean: 다윗의 지시에 따라
  alternatives_korean:
  - 다윗의 규례에 따라
  - 다윗의 명령에 따라
  - 다윗이 정한 대로
  lexicon: HALOT
  rationale: 직역하면 ‘다윗의 손을 따라’이지만, 여기서는 예배 절차가 다윗에게서 전해진 규정에 따른다는 뜻이므로 의미를 드러내는 표현이 적절합니다.
theological_decisions:
- issue: YHWH의 음역 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 여호와 대체어 대신 고유명사 음역을 유지해 하나님의 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עַל יְדֵי דָּוִיד의 관용구 처리
  chosen_reading: 다윗의 지시에 따라
  alternative_readings:
