  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עַל יְדֵי דָּוִיד의 관용구 처리
  chosen_reading: 다윗의 지시에 따라
  alternative_readings:
  - 다윗의 손으로
  - 다윗의 규례대로
  - 다윗이 정한 대로
  rationale: 문맥상 다윗의 물리적 행위가 아니라 성전 예배의 다윗식 규범을 뜻하므로, 현대 독자가 오해하지 않도록 관용적 의미를 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
