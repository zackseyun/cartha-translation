revisions:
- from: 이 스라야는 바벨론에서 올라왔으며, 그는 모세의 율법에 능숙한 서기관이었습니다. 그 율법은 야훼, 이스라엘의 하나님께서 주신 것이었습니다. 왕은 야훼 그의 하나님께서 그 위에 계신 손과 같이 그의 모든 요청을 들어주었습니다.[a]
  to: 이 에스라는 바벨론에서 올라왔으며, 모세의 율법에 능숙한 서기관이었습니다. 그 율법은 이스라엘의 하나님이신 야훼께서 주신 것이었습니다. 왕은 그의 하나님 야훼의 손이 그 위에 있는 대로 그가 요청한 모든 것을 허락해 주었습니다.[a]
  rationale: 에스라의 인명을 바로잡고, 마지막 절을 원문의 통사에 맞게 재구성했습니다. ‘손’의 구체적 이미지는 본문에 보존하되, 그 관용적 함의는 각주에서 복수의 가능성으로 제시하여 해석을 단정하지 않았습니다. 나머지 표현은 원문의 의미와 현대 한국어 합쇼체 문체에 부합하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:16Z'
