id: EZR.7.6
reference: Ezra 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
  footnotes:
  - marker: a
    text: Hebrew 'according to the hand of the LORD his God upon him,' an idiom for the LORD's favor, power, or providential help.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 스라야는 바벨론에서 올라왔으며, 그는 모세의 율법에 능숙한 서기관이었습니다. 그 율법은 야훼, 이스라엘의 하나님께서 주신 것이었습니다. 왕은 야훼 그의 하나님께서 그 위에 계신 손과 같이 그의 모든 요청을 들어주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 하나님 야훼의 손이 그 위에 있음에 따라’라는 뜻으로, 여기서는 야훼의 호의, 권능, 또는 섭리적 도움을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  english_pob_choice: went up from Babylon
  chosen_korean: 바벨론에서 올라왔으며
  alternatives_korean:
  - 바벨론에서 왔으며
  - 바벨론에서 올라갔으며
  lexicon: HALOT
  rationale: עלה with מן의 상승/이동 관용을 살려 '올라오다'로 옮기고, 예루살렘 방향성을 드러내기 위해 '왔다'보다 '올라왔다'를 택했습니다.
- source_word: סֹפֵר מָהִיר
  english_pob_choice: skilled scribe
  chosen_korean: 능숙한 서기관
  alternatives_korean:
  - 유능한 서기관
  - 학식 있는 서기관
  - 빠른 서기관
  lexicon: HALOT
  rationale: מָהִיר는 빠름보다 숙련/능숙의 의미가 핵심이므로, 법적·문서적 맥락을 유지하는 '능숙한 서기관'으로 옮겼습니다.
- source_word: בְּתוֹרַת מֹשֶׁה
  english_pob_choice: in the Law of Moses
  chosen_korean: 모세의 율법에
  alternatives_korean:
  - 모세의 가르침에
  - 모세의 토라에
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 일반적 '가르침'보다 규범적·언약적 의미가 강하므로, 일반 독자에게 분명한 '율법'을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 יְהוָה는 고유 신명으로, 프로젝트 기본값에 따라 '야훼'를 사용했습니다.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  english_pob_choice: according to the hand of Yahweh his God upon him
  chosen_korean: 야훼 그의 하나님께서 그 위에 계신 손과 같이
  alternatives_korean:
  - 야훼 그의 하나님의 손이 그 위에 있는 대로
  - 야훼 그의 하나님께서 그에게 베푸시는 은혜처럼
  lexicon: HALOT
  rationale: '''ה손''의 비유를 해석적으로 풀어버리지 않고, 하나님의 임재·권능·호의의 여지를 남기기 위해 손 관용을 유지했습니다.'
- source_word: כֹּל בַּקָּשָׁתוֹ
  english_pob_choice: all his request
  chosen_korean: 그의 모든 요청
  alternatives_korean:
  - 그가 구한 모든 것
  - 그의 모든 간구
  lexicon: HALOT
  rationale: 왕에게 올린 청원을 가리키므로 '요청'이 가장 자연스럽고, כֹּל의 전면성을 '모든'으로 보존했습니다.
theological_decisions:
- issue: 여호와 신명과 손 관용구 처리
  chosen_reading: 신명은 '야훼'로, '손' 관용구는 본문에 유지했습니다.
  alternative_readings:
  - 신명은 '주'로 대체
  - 관용구를 '은혜' 또는 '도우심'으로 풀어씀
  rationale: 본문의 신명과 '손' 이미지를 해석적으로 평탄화하면, 하나님의 인격적 이름과 섭리적 작용 사이의 긴장이 약화됩니다. 따라서 고유명은 보존하고 관용구도 가능한 한 직역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼; Translation philosophy #3: Preserve theological tension rather than resolve it'
