id: EZR.7.16
reference: Ezra 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
  footnotes:
  - marker: a
    text: Or “the voluntary offering.” The Aramaic term denotes a gift given willingly, especially in a temple context.
    reason: lexical_alternative
  - marker: b
    text: “House of their God” refers to the temple in Jerusalem.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 바벨론 온 지방에서 얻는 모든 은과 금, 곧 백성과 제사장들이 자원하여 드리는 예물은, 예루살렘에 있는 그들의 하나님의 집을 위한 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “바벨론 온 지방”은 재원이 나오는 행정 구역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: “하나님의 집”은 예루살렘의 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּסַף וּדְהַב
  english_pob_choice: the silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은과 황금
  - 은과 금붙이
  lexicon: HALOT
  rationale: 두 귀금속의 병렬을 자연스럽게 살려 표준적인 성경 한국어로 옮겼습니다.
- source_word: תְהַשְׁכַּח בְּכֹל מְדִינַת בָּבֶל
  english_pob_choice: that you find in all the province of Babylon
  chosen_korean: 바벨론 온 지방에서 얻는
  alternatives_korean:
  - 바벨론 온 지방에서 찾는
  - 바벨론 전 지방에서 발견하는
  lexicon: HALOT
  rationale: 동사 의미를 문맥상 ‘구하다/얻다’로 풀어, 에스라에게 수집되는 재원을 자연스럽게 표현했습니다.
- source_word: הִתְנַדָּבוּת ... מִתְנַדְּבִין
  english_pob_choice: the freewill offering ... who are freely offering
  chosen_korean: 자원하여 드리는 예물
  alternatives_korean:
  - 자원 예물
  - 기쁜 마음으로 드리는 예물
  lexicon: HALOT
  rationale: 같은 어근의 명사와 분사를 하나의 표현으로 묶어 ‘자원하여 드리는’으로 살려, 자발성을 분명히 했습니다.
- source_word: לְבֵית אֱלָהֲהֹם
  english_pob_choice: for the house of their God
  chosen_korean: 그들의 하나님의 집을 위한
  alternatives_korean:
  - 그들의 하나님의 성전을 위한
  - 그들의 하나님의 집에 드리는
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘하나님의 집’을 유지해 성전 언어를 보존했고, 헌납의 방향을 드러내기 위해 ‘위한’으로 옮겼습니다.
theological_decisions:
- issue: ‘집’(house)과 성전 함의
  chosen_reading: ‘하나님의 집’이라는 원문 표현을 그대로 살려, 예루살렘 성전을 가리키는 성전-주택 은유를 유지했습니다.
  alternative_readings:
  - ‘성전’으로 풀어 쓰는 번역
  - ‘집’만 남겨 현대 독자가 장소 의미를 덜 떠올리게 하는 번역
  rationale: 영 POB의 주석처럼 원문은 예루살렘 성전을 가리키는 표현이므로, 교회식 일반어보다 source-direct한 ‘하나님의 집’을 유지하는 편이 문맥과 맞습니다.
  doctrine_reference: 성전/회막 어휘의 역사적-문학적 용법
