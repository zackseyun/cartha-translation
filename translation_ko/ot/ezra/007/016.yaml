    rationale: תְהַשְׁכַּח는 기본적으로 ‘찾다/발견하다’이며, 여기서는 에스라가 관할 지역에서 확보하게 되는 금은을 가리킵니다. ‘찾게 되는’은 불필요한 의미 추가 없이 이를 보존합니다.
