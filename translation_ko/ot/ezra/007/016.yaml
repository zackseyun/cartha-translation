  to: 또한 바벨론 온 지방에서 찾게 되는 모든 은과 금과, 예루살렘에 있는 그들의 하나님의 집을 위하여 백성과 제사장들이 자원하여 드리는 자원 예물[a]을[b]
  rationale: 원문의 접속사와 열거 구조를 유지하도록 종결 서술을 제거하고, ‘찾게 되는’으로 동사의 기본 의미를 보존했습니다. 자원 예물과 이를 드리는 행위의 같은 어근 관계도 ‘자원 예물’과 ‘자원하여 드리는’으로 드러냈습니다. 각주 표지는 각각의 주석 대상 바로 뒤에 배치했습니다.
