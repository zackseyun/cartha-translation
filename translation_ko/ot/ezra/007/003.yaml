translation:
  language: ko
  text: 아마랴의 아들이요, 아사랴의 아들이요, 메라욧의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 성경 족보에서 ‘아들’은 반드시 직계 부자관계만이 아니라 계보상의 후손을 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - 자손
  lexicon: HALOT
  rationale: 족보 문맥에서는 בֶּן을 가장 직접적으로 ‘아들’로 옮기는 것이 원문의 계보 형식을 투명하게 드러냅니다. 여기서는 즉각적인 부자관계로만 한정하지 않고, 족보상의 계열 표현으로 읽도록 합니다.
- source_word: אֲמַרְיָה
  english_pob_choice: Amariah
  chosen_korean: 아마랴
  alternatives_korean:
  - 아마리아
  lexicon: 고유명사 표기 관례
  rationale: 인명은 음역하는 것이 원칙이므로, 히브리어 בשם에 맞춰 ‘아마랴’로 옮겼습니다.
- source_word: עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자랴
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 인명 אַזַרְיָה는 한국어 성서 관행에서 ‘아사랴’가 널리 통용되므로 이를 따랐습니다.
- source_word: מְרָיוֹת
  english_pob_choice: Meraioth
  chosen_korean: 메라욧
  alternatives_korean:
  - 메라이오스
  - 메라욘
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 인명을 음역하되, 한국어에서 읽기 쉬운 현대 표기 ‘메라욧’을 사용했습니다. 영어 전통형 ‘Meraioth’의 음가를 과도하게 따르기보다 원형 발음을 반영했습니다.
theological_decisions:
- issue: 족보의 בֶּן을 혈연적 아들로만 제한할지 여부
  chosen_reading: ‘아들’로 직역하되, 족보에서는 더 먼 계열 후손을 가리킬 수 있음을 열어 둡니다.
  alternative_readings:
  - ‘후손’으로 완화
  - ‘자손’으로 일반화
  rationale: 본문은 계보 목록이므로 관계 표현을 약화시키지 않는 것이 원문 충실성에 맞습니다. 다만 성경 족보의 관용법상 직계만 뜻하지 않을 수 있어 그 가능성은 유지합니다.
  doctrine_reference: 성경 족보의 관용적 계열 용법
