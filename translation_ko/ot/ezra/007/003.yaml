  text: בֶּן אֲמַרְיָ֥ה בֶן עֲזַרְיָ֖ה בֶּן מְרָיֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/003.yaml
  text: son of Amariah[a], son of Azariah, son of Meraioth,
  footnotes:
  - marker: a
    text: Hebrew genealogies may use 'son of' for a descendant in a lineage, not necessarily only an immediate father-son relationship.
