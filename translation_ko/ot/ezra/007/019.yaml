    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘의 하나님 앞에 온전히 바치십시오’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  english_pob_choice: the vessels
  chosen_korean: 그 기물들은
  alternatives_korean:
  - 그릇들은
  - 용기들은
  lexicon: HALOT
  rationale: 성전 문맥의 अर라미어 מָאנַיָּא는 단순한 그릇보다 성전 기물·기구의 뉘앙스를 가지므로, 현대 한국어에서는 ‘기물’이 가장 정확하고 격식에 맞습니다.
- source_word: לְפָלְחָן
  english_pob_choice: for the service
  chosen_korean: 섬김을 위한
  alternatives_korean:
  - 봉사를 위한
  - 예배를 위한
  - 사역을 위한
  lexicon: HALOT
  rationale: 이 단어는 제의적 ‘섬김/봉사’를 뜻하지만, 본문이 성전 기물의 용도를 말하므로 ‘섬김’을 택해 예배로 과도하게 좁히지 않았습니다.
- source_word: הַשְׁלֵם
  english_pob_choice: deliver in full
  chosen_korean: 온전히 드리십시오
  alternatives_korean:
  - 완전히 드리십시오
  - 전부 넘기십시오
  - 빠짐없이 드리십시오
  lexicon: HALOT
  rationale: 문맥상 단순히 끝내라는 뜻이 아니라 맡겨진 물건을 하나도 빠짐없이 온전하게 인도하라는 명령이므로, ‘온전히 드리십시오’가 가장 자연스럽습니다.
- source_word: קֳדָם אֱלָהּ יְרוּשְׁלֶם
  english_pob_choice: before the God of Jerusalem
  chosen_korean: 예루살렘의 하나님 앞에
  alternatives_korean:
  - 예루살렘의 하나님 전에
  - 예루살렘의 하나님 면전에
  lexicon: HALOT
  rationale: קֳדָם은 ‘앞에/면전에서’의 뜻이므로, 한국어에서는 예배적·공식적 어감이 살아 있는 ‘앞에’를 사용했습니다.
theological_decisions:
- issue: לְפָלְחָן의 의미 범위
  chosen_reading: ‘섬김’으로 번역해 성전 사용의 문맥을 살리되, ‘예배’로 협소화하지 않았습니다.
  alternative_readings:
  - 예배
  - 봉사
  - 사역
  rationale: 본문은 성전 기물의 용도에 관한 행정적·제의적 진술이므로, 일반적 예배 용어보다 넓은 ‘섬김’이 원문의 범위를 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; preserve plain sense without importing later ecclesial terminology.'
