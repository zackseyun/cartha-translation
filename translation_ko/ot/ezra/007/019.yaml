translation:
  language: ko
  text: 그리고 당신에게 주어진 하나님의 집의 섬김을 위한 그 기물들은, 예루살렘의 하나님 앞에 온전히 드리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
