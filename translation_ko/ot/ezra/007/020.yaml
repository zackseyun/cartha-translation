source:
  edition: WLC
  text: וּ/שְׁאָ֗ר חַשְׁחוּת֙ בֵּ֣ית אֱלָהָ֔/ךְ דִּ֥י יִפֶּל לָ֖/ךְ לְ/מִנְתַּ֑ן תִּנְתֵּ֕ן מִן בֵּ֖ית גִּנְזֵ֥י מַלְכָּֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
  footnotes:
  - marker: a
    text: Or more smoothly, 'from the king’s treasury.' The Aramaic is more literally 'from the house of the king’s treasuries.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신의 하나님 집에 필요한 나머지 것은, 당신에게 맡겨져 제공해야 할 것이면, 왕의 곳간에서 그것을 제공하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 '왕의 곳간에서'입니다. 아람어는 문자적으로 '왕의 곳간들의 집에서'라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  english_pob_choice: whatever other need
  chosen_korean: 필요한 나머지 것은
  alternatives_korean:
  - 그 밖의 필요한 것은
  - 기타 필요 사항
  - 남은 필요
  lexicon: HALOT
  rationale: וּשְׁאָר는 '나머지/그 밖의'이고 חַשְׁחוּת는 필요·요구를 뜻하므로, 행정 문맥에 맞게 '필요한 나머지 것은'으로 자연스럽게 옮겼습니다.
- source_word: בֵּית אֱלָהָךְ
  english_pob_choice: the house of your God
  chosen_korean: 당신의 하나님 집
  alternatives_korean:
  - 당신의 하나님의 집
  - 당신의 하나님 성전
  - 하나님의 집
  lexicon: HALOT
  rationale: 직역의 구조를 살리되 한국어에서는 소유격을 앞세운 '당신의 하나님 집'이 문맥상 가장 자연스럽고, '집'이라는 성전 관용어도 유지합니다.
- source_word: יִפֶּל לָךְ לְמִנְתַּן תִּנְתֵּן
  english_pob_choice: falls to you to provide / you shall provide it
  chosen_korean: 당신에게 맡겨져 제공해야 할 것이면 ... 그것을 제공하십시오
  alternatives_korean:
  - 당신에게 돌아와 공급해야 할 것이면 ... 그것을 공급하십시오
  - 당신에게 책임이 있는 것이면 ... 그것을 주십시오
  - 당신에게 떨어진 것이면 ... 그것을 주십시오
  lexicon: HALOT
  rationale: י־פ־ל의 관용적 의무 표현을 '맡겨져'로 풀어 행정적 책임감을 살렸고, לְמִנְתַּן/תִּנְתֵּן의 반복된 '주다' 의미는 '제공하다'로 통일해 문맥을 분명히 했습니다.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  english_pob_choice: from the house of the king’s treasuries
  chosen_korean: 왕의 곳간에서
  alternatives_korean:
  - 왕의 보물 창고에서
  - 왕의 재무 창고에서
  - 왕의 곳간 집에서
  lexicon: HALOT
  rationale: 원문은 '왕의 treasuries/storehouses의 집'이라는 관료적 표현이지만, 한국어에서는 '왕의 곳간'이 같은 재정 보관소 개념을 가장 간명하게 전달합니다. EN POB의 각주에 해당하는 더 직역적인 구조는 본문이 아니라 주석으로 보존했습니다.
