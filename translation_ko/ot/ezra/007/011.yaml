id: EZR.7.11
reference: Ezra 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'Now this is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
  footnotes:
  - marker: a
    text: Or 'the text of the letter' or 'the transcript of the document.'
    reason: lexical_alternative
  - marker: b
    text: Or 'concerning Israel' or 'over Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 아닥사스다 왕이 제사장이며 야훼의 계명의 말씀과 이스라엘을 위한 그분의 규례에 관한 서기관인 에스라에게 준 문서의 사본[a]입니다. 이스라엘을 위한[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문서의 본문’이나 ‘문서의 필사본’입니다.
    reason: פַּרְשֶׁגֶן의 어휘적 대안입니다.
  - marker: b
    text: 또는 ‘이스라엘에 관한’이나 ‘이스라엘 위에’입니다.
    reason: עַל יִשְׂרָאֵל의 전치사구에 대한 어휘적·통사적 대안입니다.
lexical_decisions:
- source_word: וְזֶה פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  english_pob_choice: Now this is the copy of the document
  chosen_korean: 이것은 … 문서의 사본입니다
  alternatives_korean:
  - 이것은 … 문서의 복사본입니다
  - 이것은 … 서면의 사본입니다
  lexicon: HALOT
  rationale: פַּרְשֶׁגֶן은 공식 문서의 ‘사본’이라는 뜻이므로, 현대 한국어에서 자연스럽고 행정문서의 성격을 살리는 ‘사본’을 택했습니다. הַנִּשְׁתְּוָן은 왕의 공식 서면을 가리키므로 ‘문서’로 넓게 옮겼습니다.
- source_word: הַכֹּהֵן הַסֹּפֵר
  english_pob_choice: the priest, the scribe
  chosen_korean: 제사장 … 서기관
  alternatives_korean:
  - 제사장 … 필사자
  - 제사장 … 학자
  lexicon: HALOT
  rationale: 에스라의 제사장 직분과 문서 작성/해석의 직분을 각각 살려 ‘제사장’과 ‘서기관’으로 옮겼습니다. ‘서기관’은 페르시아 시대의 행정적·율법적 문맥을 함께 담습니다.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה וְחֻקָּיו
  english_pob_choice: a scribe of the words of the commandments of Yahweh and of his statutes
  chosen_korean: 야훼의 명령의 말과 그의 규례들의 서기관
  alternatives_korean:
  - 야훼의 명령과 규례를 맡은 서기관
  - 야훼의 계명과 규례의 서기관
  lexicon: HALOT
  rationale: Hebrew의 ‘말들(דִּבְרֵי)’을 완화하지 않고 ‘명령의 말’로 남겨, 에스라가 단순한 행정 서기가 아니라 기록된 하나님의 말씀을 다루는 사람이라는 점을 드러냈습니다. ‘חֻקִּים’은 율법적 성격을 살려 ‘규례들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 YHWH의 고유 이름이므로 프로젝트 기본어인 ‘야훼’를 유지했습니다. 관용적 ‘주님’으로 바꾸면 원문의 고유명성 및 추적 가능성이 약해집니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: for Israel
  chosen_korean: 이스라엘에 관한
  alternatives_korean:
  - 이스라엘을 위한
  - 이스라엘 위에
  lexicon: HALOT
  rationale: עַל은 여기서 ‘대상/범위’를 나타내므로 ‘이스라엘에 관한’이 가장 무난하게 원문의 적용 범위를 전달합니다. ‘위에’는 통치 뉘앙스가 강해 문맥에 비해 좁습니다.
theological_decisions:
- issue: 야훼의 명칭을 본문에서 어떻게 드러낼지
  chosen_reading: 고유명 ‘야훼’를 본문에 직접 유지했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 제목적 대체어보다 고유 이름을 보존하는 편이 원문 인식에 더 충실합니다.
  doctrine_reference: 'POB name rendering policy: יְהוָה / YHWH → 야훼'
