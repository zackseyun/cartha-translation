  yaml_path: translation/ot/ezra/007/001.yaml
  text: Now after these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
  footnotes:
  - marker: a
    text: Hebrew 'son of' in genealogies can also denote a more remote descendant, not only an immediate father-son relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 일들 뒤에, 페르시아 왕 아닥사스다의 치세에 에스라는 스라야의 아들[a]이며, 아사랴의 아들이며, 힐기야의 아들입니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서 ‘아들’은 직접 아들뿐 아니라 더 먼 후손을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר הַ/דְּבָרִים הָ/אֵלֶּה
  english_pob_choice: Now after these things
  chosen_korean: 이러한 일들 뒤에
  alternatives_korean:
  - 이 일들 후에
  - 그리고 이러한 일들 뒤에
  lexicon: HALOT
  rationale: 서두의 연결사 וְ와 אַחַר를 살려 앞선 서술과 이어 주되, 한국어에서는 ‘이러한 일들 뒤에’가 가장 자연스럽고 본문의 전환 기능을 잘 드러냅니다.
- source_word: בְּ/מַלְכ֖וּת
  english_pob_choice: in the reign of
  chosen_korean: …의 치세에
  alternatives_korean:
  - …의 통치 중에
  - …의 왕국에서
  lexicon: HALOT
  rationale: 여기서는 영토의 왕국이 아니라 왕의 통치 기간을 가리키므로, ‘치세에’가 문맥상 가장 정확합니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: …의 아들이요
  alternatives_korean:
  - …의 자손이요
  - …의 후손이요
  lexicon: HALOT
  rationale: 족보 형식의 반복을 살려 ‘아들이요’로 옮기되, 영어 주석처럼 직계만이 아니라 더 넓은 후손 가능성은 본문 뜻을 훼손하지 않으므로 별도 각주로 남기지 않았습니다.
