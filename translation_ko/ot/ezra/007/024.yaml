id: EZR.7.24
reference: Ezra 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
  footnotes:
  - marker: a
    text: Or 'Nethinim,' a traditional transliteration of נְתִינַיָּא.
    reason: lexical_alternative
  - marker: b
    text: 'The three fiscal terms likely distinguish different kinds of imperial levy: ''tribute, tax, or toll'' could also be rendered ''tribute, custom, or transit duty.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 귀하에게 알립니다. 이 집행문은 제사장들, 레위 사람들, 노래하는 사람들, 문지기들, 성전 봉사자들, 또는 이 하나님의 집의 섬기는 자들에게 조공, 세금, 통행세를 부과하는 것이 허용되지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְהוֹדְעִין
  english_pob_choice: we make known
  chosen_korean: 우리는 귀하에게 알립니다
  alternatives_korean:
  - 우리는 귀하에게 알립니다
  - 우리는 귀하에게 알게 합니다
  lexicon: HALOT
  rationale: 공식 행정 통고문의 어조를 살리기 위해 단순한 ‘알다’보다 통보성 있는 표현을 택했습니다.
- source_word: כָל כָּהֲנַיָּא וְלֵוָיֵא זַמָּרַיָּא תָרָעַיָּא נְתִינַיָּא
  english_pob_choice: any of the priests, Levites, singers, gatekeepers, temple servants
  chosen_korean: 제사장들, 레위 사람들, 노래하는 사람들, 문지기들, 성전 봉사자들
  alternatives_korean:
  - 제사장들, 레위 사람들, 노래하는 사람들, 문지기들, 느디님 사람들
  - 제사장들, 레위 사람들, 찬양하는 사람들, 문지기들, 성전 하인들
  lexicon: HALOT
  rationale: 목록의 직무를 한국어로 직접 풀어, 전통 음역인 ‘느디님’을 피하면서도 성전 관련 집단임을 드러냈습니다.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  english_pob_choice: servants of this house of God
  chosen_korean: 이 하나님의 집의 섬기는 자들
  alternatives_korean:
  - 이 하나님의 집의 종들
  - 이 하나님의 집에서 봉사하는 자들
  lexicon: HALOT
  rationale: פָלְחֵי의 섬김/봉사 의미를 살리되, 앞의 ‘성전 봉사자들’과 구별되도록 보다 일반적인 ‘섬기는 자들’로 옮겼습니다.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  english_pob_choice: tribute, tax, or toll
  chosen_korean: 조공, 세금, 통행세
  alternatives_korean:
  - 조공, 관세, 통행세
  - 조공, 세금, 관로세
  lexicon: HALOT
  rationale: 세 항목의 구별을 유지하기 위해 세 관용적 재정 용어를 각각 분리해 옮겼습니다.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  english_pob_choice: it is not permitted to impose ... on
  chosen_korean: 부과하는 것이 허용되지 않습니다
  alternatives_korean:
  - 부과할 권한이 없습니다
  - 부과하는 것이 합법적이지 않습니다
  lexicon: HALOT
  rationale: 법적 금지의 뉘앙스를 한국어 행정문체로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 성전 관련 직군의 범주 구분
  chosen_reading: ‘성전 봉사자들’과 ‘이 하나님의 집의 섬기는 자들’을 별도로 구분해 번역했습니다.
  alternative_readings:
  - 둘을 하나로 묶어 ‘성전 봉사자들’로 통합
  - ‘느디님’으로 음역
  rationale: 원문은 느디님과 ‘이 하나님의 집의 섬기는 자들’을 별개의 항목으로 배열하므로, 한국어에서도 중복을 피하면서 구분을 유지했습니다.
  doctrine_reference: 본문의 행정-제의적 구분 보존
- issue: 직접 대화의 호칭
  chosen_reading: 행정 대상에 대한 통고문 어조를 살리기 위해 ‘귀하’로 높임말을 유지했습니다.
  alternative_readings:
  - ‘당신’
  - 호칭 생략
  rationale: 에스라 7:24는 공문체이므로 현대 한국어에서도 격식을 유지하는 편이 원문 기능을 더 잘 드러냅니다.
  doctrine_reference: 문체 보존
