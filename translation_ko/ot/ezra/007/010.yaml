  - marker: b
    text: Or 'to inquire into' or 'to study' the Law of the LORD.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
  - marker: d
    text: Or 'statute and ordinance' or 'statutes and rules.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 에스라가 야훼[c]의 율법을 탐구하고[b], 그것을 행하며, 이스라엘 가운데서 규례와 법도[d]를 가르치기 위하여 마음을 굳게 정하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음을 준비하였다’. 이 히브리어 관용구는 의도적인 내적 결심을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘율법을 찾다’ 또는 ‘율법을 살피다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘야훼’는 하나님의 이름 YHWH를 가리킵니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘규례와 판결’ 또는 ‘규례와 규정’.
    reason: lexical_alternative
