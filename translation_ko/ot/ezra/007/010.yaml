  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
  footnotes:
  - marker: a
    text: Or 'had prepared his heart.' The Hebrew idiom expresses deliberate inward resolve.
    reason: lexical_alternative
  - marker: b
    text: Or 'to inquire into' or 'to study' the Law of the LORD.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
  - marker: d
    text: Or 'statute and ordinance' or 'statutes and rules.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에스라는 마음을 굳게 정하여 야훼의 율법을 찾고, 그것을 행하며, 이스라엘 가운데서 규례와 판결을 가르치고자 하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '마음을 준비하였으니'. 이 히브리어 관용구는 의도적인 내적 결심을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '조사하다', '연구하다'의 의미일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 '야훼'는 신명기 이름 YHWH를 가리킵니다.
    reason: alternative_reading
  - marker: d
    text: 또는 '규례와 법도', '규례와 규정'.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵכִין לְבָבוֹ
  english_pob_choice: had set his heart
  chosen_korean: 마음을 굳게 정하여
  alternatives_korean:
  - 마음을 준비하여
  - 마음을 세워
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 결심과 의도적 준비를 함께 드러내므로, 한국어에서는 자연스러운 결심 표현인 '마음을 굳게 정하여'로 옮겨 의지의 강도를 살렸습니다.
- source_word: לִדְרוֹשׁ אֶת תּוֹרַת יְהוָה
  english_pob_choice: to seek the Law of Yahweh
  chosen_korean: 야훼의 율법을 찾고
  alternatives_korean:
  - 야훼의 율법을 연구하고
  - 야훼의 율법을 살피고
  lexicon: HALOT
  rationale: דרש는 '찾다/구하다/조사하다'의 폭이 있으나, 이 문맥에서는 토라를 향한 헌신적 추구가 핵심이므로 '찾고'를 택해 탐구와 헌신을 함께 담았습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the Law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 야훼의 토라
  lexicon: HALOT
  rationale: 에스라의 제사장-서기관적 문맥에서 תּוֹרָה는 일반적 가르침보다 언약적 율법을 가리키므로, 프로젝트 기본어인 '율법'을 사용했습니다.
- source_word: חֹק וּמִשְׁפָּט
  english_pob_choice: statutes and judgments
  chosen_korean: 규례와 판결
  alternatives_korean:
  - 규례와 법도
  - 규정과 판결
  - 규례와 판단
  lexicon: HALOT
  rationale: 두 법률 용어의 짝을 한국어의 격식 있는 법률 어휘로 살리되, '판결'은 משפט의 법적·재판적 의미를 드러내며 '규례'와 함께 자연스럽게 읽히도록 했습니다.
theological_decisions:
