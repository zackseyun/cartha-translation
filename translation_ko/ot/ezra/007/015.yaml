  naturalness: ‘가져가되’는 양보·대조를 암시하는 연결 어미여서 이 문맥에 부자연스럽고 문장이 미완성처럼 들립니다. 또한 ‘그분의 거처는 예루살렘에 있습니다’가 앞의 ‘이스라엘의 하나님’을 뒤늦게 설명하여 원문의 관계절 결속이 약해집니다.
  terminology: ‘은과 금’, ‘보좌관들’, ‘자원하여 드린’은 적절합니다. ‘거처’를 유지하여 מִשְׁכְּנֵהּ의 명사적 표현과 성전 중심의 의미를 보존할 수 있습니다.
