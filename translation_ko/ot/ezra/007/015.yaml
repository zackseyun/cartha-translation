  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
  footnotes:
  - marker: a
    text: Or, 'who dwells in Jerusalem.' The Aramaic more literally says 'whose dwelling is in Jerusalem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 은과 금을 가져가되, 왕과 그의 보좌관들이 이스라엘의 하나님께 자원하여 드린 것인데, 그분의 거처는 예루살렘에 있습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘예루살렘에 거하시는 분.’ 아람어는 더 문자적으로는 ‘예루살렘에 있는 그분의 거처’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  english_pob_choice: and to bring
  chosen_korean: 가져가되
  alternatives_korean:
  - 가져가고
  - 운반하여
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 자연스러운 현대 한국어로 옮기되, 단순한 이동보다 왕실에서 예루살렘으로 보내는 맥락을 살리기 위해 ‘가져가다’를 썼습니다.
- source_word: כְּסַף וּדְהַב
  english_pob_choice: the silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은과 황금
  - 은과 금붙이
  lexicon: HALOT
  rationale: 재물의 종류를 직역해 간결하게 살렸습니다. 문맥상 특정 헌물의 항목이므로 별도 수식 없이도 충분합니다.
- source_word: וְיָעֲטוֹהִי
  english_pob_choice: and his counselors
  chosen_korean: 그의 보좌관들
  alternatives_korean:
  - 그의 조언자들
  - 그의 신하들
  lexicon: HALOT
  rationale: 궁정 자문역을 가리키므로, 현대 독자가 이해하기 쉬운 ‘보좌관들’을 택했습니다. ‘신하들’은 뜻이 넓고, ‘조언자들’은 다소 직역적입니다.
- source_word: הִתְנַדַּבוּ
  english_pob_choice: have freely offered
  chosen_korean: 자원하여 드린
  alternatives_korean:
  - 기꺼이 바친
  - 자발적으로 바친
  lexicon: HALOT
  rationale: 자발성을 분명히 하되, 하나님께 드리는 헌납의 뉘앙스를 살리기 위해 ‘드리다’를 사용했습니다.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  english_pob_choice: whose dwelling is in Jerusalem
  chosen_korean: 그분의 거처는 예루살렘에 있습니다
  alternatives_korean:
  - 예루살렘에 그분의 거처가 있습니다
  - 예루살렘에 거하십니다
  lexicon: HALOT
  rationale: 아람어는 ‘거처/거주지’라는 명사 표현을 쓰므로, ‘거처’로 옮겨 문장 구조를 보존했습니다. ‘거하십니다’는 동사화하여 원문의 명사적 표현이 약해집니다.
theological_decisions:
- issue: 하나님의 예루살렘 거처 표현
  chosen_reading: 그분의 거처는 예루살렘에 있습니다
  alternative_readings:
  - 예루살렘에 거하십니다
  - 예루살렘이 그분의 처소입니다
  rationale: 원문은 하나님의 임재를 예루살렘의 거처로 말하지만, 이를 단순한 공간 제한으로 오해하지 않도록 명사구를 유지했습니다. 이는 성전 중심의 언약적 표현을 살리면서도 하나님의 무소부재와 충돌을 피합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
