id: EZR.7.5
reference: Ezra 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
  footnotes:
  - marker: a
    text: Or 'son of Aaron, the head priest' or, in genealogical sense, 'descendant of.' Hebrew genealogies often use 'son of' for lineal descent more broadly.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'high priest.' The Hebrew reads literally 'the priest, the head/chief,' not the more usual expression for 'high priest.'
    reason: alternative_reading
translation:
  language: ko
  text: 아비수아의 아들, 비느하스의 아들, 엘르아살의 아들, 아론 대제사장의 아들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서 ‘아들’은 직계 아들뿐 아니라 더 넓은 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 통상적인 ‘대제사장’ 표현보다 문자적으로 ‘제사장, 우두머리’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - ~의 자손
  lexicon: HALOT
  rationale: 족보 문맥에서는 בֶּן의 가장 직접적인 의미를 살려 반복형으로 ‘아들’이라고 옮겼습니다. 한국어에서도 계보 연결을 자연스럽게 보여 줍니다.
- source_word: אֲבִישׁוּעַ
  english_pob_choice: Abishua
  chosen_korean: 아비수아
  alternatives_korean:
  - 아비슈아
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 한국어 음역 원칙에 따라 음역했고, 영어 표기와의 대응성을 유지했습니다.
- source_word: פִּֽינְחָס
  english_pob_choice: Phinehas
  chosen_korean: 비느하스
  alternatives_korean:
  - 피느하스
  lexicon: 고유명사 음역
  rationale: 성경에서 널리 굳어진 한국어 음역을 따랐습니다.
- source_word: הַכֹּהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수석 제사장
  - 주요 제사장
  - 대장 제사장
  lexicon: 의미역
  rationale: 히브리어는 문자적으로 ‘제사장, 머리/우두머리’이지만, 한국어에서는 이 직함을 가장 자연스럽게 전달하는 표현으로 ‘대제사장’을 선택했습니다. 다만 영어 POB의 ‘chief priest’가 지닌 직역적 긴장은 본문에서 무리 없이 살렸습니다.
theological_decisions:
- issue: 아론의 제사장 직함을 어떻게 표기할지
  chosen_reading: ‘대제사장’으로 옮기되, 족보 문맥의 직함임을 살렸습니다.
  alternative_readings:
  - ‘수석 제사장’
  - ‘우두머리 제사장’
  rationale: 본문은 아론의 계보적 위치를 강조하는 족보 구절이므로, 독자에게 익숙하면서도 직함의 최고위성을 분명히 하는 표현을 택했습니다.
  doctrine_reference: '번역 철학: 원문 우선, 전통 용어는 원문이 요구할 때만 채택'
