- source_word: הַכֹּהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수석 제사장
  - 주요 제사장
  - 대장 제사장
  lexicon: 의미역
  rationale: 히브리어는 문자적으로 ‘제사장, 머리/우두머리’이지만, 한국어에서는 이 직함을 가장 자연스럽게 전달하는 표현으로 ‘대제사장’을 선택했습니다. 다만 영어 POB의 ‘chief priest’가 지닌 직역적 긴장은 본문에서 무리 없이 살렸습니다.
theological_decisions:
- issue: 아론의 제사장 직함을 어떻게 표기할지
  chosen_reading: ‘대제사장’으로 옮기되, 족보 문맥의 직함임을 살렸습니다.
  alternative_readings:
  - ‘수석 제사장’
  - ‘우두머리 제사장’
  rationale: 본문은 아론의 계보적 위치를 강조하는 족보 구절이므로, 독자에게 익숙하면서도 직함의 최고위성을 분명히 하는 표현을 택했습니다.
  doctrine_reference: '번역 철학: 원문 우선, 전통 용어는 원문이 요구할 때만 채택'
