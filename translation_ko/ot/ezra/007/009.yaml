id: EZR.7.9
reference: Ezra 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן ה֣וּא יְסֻ֔ד הַֽ/מַּעֲלָ֖ה מִ/בָּבֶ֑ל וּ/בְ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֗י בָּ֚א אֶל יְר֣וּשָׁלִַ֔ם כְּ/יַד אֱלֹהָ֖י/ו הַ/טּוֹבָ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: ko
  text: 첫째 달 초하루에 그는 바벨론에서 떠나 올라가는 길을 시작하였고, 다섯째 달 초하루에 그의 하나님이 그에게 베푸신 선한 손길에 따라 예루살렘에 도착하였습니다.
  philosophy: formal
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  english_pob_choice: began the journey up
  chosen_korean: 올라가는 길을 시작하였고
  alternatives_korean:
  - 여정을 시작하였고
  - 올라가기 시작하였고
  lexicon: יסד
  rationale: 히브리어 יסד는 여기서 ‘기초를 놓다’보다 여정을 ‘시작하다’는 의미로 쓰였으므로, POB의 begun the journey up을 살려 ‘올라가는 길을 시작하다’로 옮겼습니다.
- source_word: מִבָּבֶל / אֶל יְרוּשָׁלִַם
  english_pob_choice: from Babylon / came to Jerusalem
  chosen_korean: 바벨론에서 떠나 ... 예루살렘에 도착하였습니다
  alternatives_korean:
  - 바벨론에서 올라와 ... 예루살렘에 이르렀습니다
  - 바벨론에서 ... 예루살렘에 왔습니다
  lexicon: בוא / מן
  rationale: ‘떠나’는 출발을, ‘도착하였습니다’는 יעד 도달을 분명히 하여 두 시점을 대구적으로 살렸습니다.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  english_pob_choice: according to the good hand of his God upon him
  chosen_korean: 그의 하나님이 그에게 베푸신 선한 손길에 따라
  alternatives_korean:
  - 그의 하나님이 그 위에 두신 선한 손에 따라
  - 그의 하나님의 선한 손이 그 위에 있었기에
  lexicon: יד
  rationale: כְּיַד는 관용적으로 ‘손’이지만, 한국어에서는 ‘선한 손길’이 자연스럽고 POB의 ‘good hand’의 보호·인도 이미지를 잘 전달합니다.
theological_decisions:
- issue: 하나님의 주권적 인도 표지로서의 "선한 손"
  chosen_reading: 하나님이 여정의 시작과 도착을 주권적으로 선하게 인도하신다는 의미를 그대로 드러냈습니다.
  alternative_readings:
  - 단순한 호의나 운이 따랐다는 식으로 완화하는 읽기
  - ‘좋은 기회’ 정도의 일반적 성공 서사로 바꾸는 읽기
  rationale: 본문은 여행의 성패가 에스라 자신의 능력보다 하나님의 선한 손에 달려 있음을 강조하므로, 이를 약화하지 않았습니다.
  doctrine_reference: 섭리와 하나님의 인도
- issue: ‘올라가다’의 방향성 유지
  chosen_reading: 예루살렘으로의 이동을 단순 이동이 아니라 ‘올라감’으로 보존했습니다.
  alternative_readings:
  - ‘여행하다’로 평탄화하는 읽기
  - ‘가다’로만 옮겨 지리·신학적 방향성을 흐리는 읽기
  rationale: 예루살렘은 지리적으로도, 언약 공동체의 중심으로서도 ‘올라가는’ 방향이므로 그 함의를 유지했습니다.
  doctrine_reference: 성전/예루살렘 중심성
