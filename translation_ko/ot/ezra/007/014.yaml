source:
  edition: WLC
  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
  footnotes:
  - marker: a
    text: Or 'from the presence of the king.' The Aramaic court idiom emphasizes that Ezra's commission comes from the royal presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'which is in your possession' or 'which is entrusted to you.' Literally, 'that is in your hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 왕과 그의 일곱 모사에게서 파견되어, 네 손에 있는 네 하나님의 율법에 따라 유다와 예루살렘에 관하여 조사하도록 하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕과 그의 일곱 모사에게서’는 직역하면 ‘왕과 그의 일곱 모사 앞에서’입니다. 이는 파견이 왕실의 공식 권위에서 나왔음을 나타내는 아람어 궁정 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 손에 있는’은 ‘네 소유에 있는’ 또는 ‘네게 맡겨진’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דִּי
  english_pob_choice: because
  chosen_korean: 이는 … 하려는 것입니다
  alternatives_korean:
  - 왜냐하면 … 때문입니다
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 아람어의 원인·이유를 밝히는 관용구이므로, 현대 한국어에서는 문맥상 앞선 명령의 목적과 이유를 함께 드러내는 종속절로 자연스럽게 옮겼습니다.
- source_word: מִן קֳדָם מַלְכָּא
  english_pob_choice: from before the king
  chosen_korean: 왕과 그의 일곱 모사들 앞에서
  alternatives_korean:
  - 왕의 면전에서
  - 왕 앞에서
  lexicon: HALOT
  rationale: 직역의 ‘before’는 궁정 문맥에서 왕의 면전/앞을 뜻하는 공식 표현이므로, 한국어에서는 어색한 “왕 앞에서”보다 문맥을 살린 “왕과 그의 일곱 모사들 앞에서”로 옮겼습니다.
- source_word: שִׁבְעַת יָעֲטֹהִי
  english_pob_choice: his seven counselors
  chosen_korean: 그의 일곱 모사들
  alternatives_korean:
  - 그의 일곱 조언자들
  - 그의 일곱 신하들
  lexicon: HALOT
  rationale: 궁정 관료를 가리키는 말이므로, 의미를 분명히 하는 “모사들”을 택했습니다.
- source_word: לְבַקָּרָא עַל יְהוּד וְלִירוּשְׁלֶם
  english_pob_choice: to inquire concerning Judah and Jerusalem
  chosen_korean: 유다와 예루살렘에 대하여 조사하되
  alternatives_korean:
  - 유다와 예루살렘에 관해 살피되
  - 유다와 예루살렘을 살펴보되
  lexicon: HALOT
  rationale: 동사는 단순한 정보 수집보다 상황을 살피고 조사하는 뜻이 강하므로, 공식 행정 문맥에 맞는 “조사하되”를 사용했습니다.
- source_word: דִּי בִידָךְ
  english_pob_choice: that is in your hand
  chosen_korean: 네 손에 있는
  alternatives_korean:
  - 네게 맡겨진
  - 네가 소유한
  lexicon: HALOT
  rationale: 직역을 유지해 원문의 관용성을 살렸고, 필요하면 ‘맡겨진/소유한’으로 이해할 수 있도록 열어 두었습니다.
theological_decisions:
- issue: 율법의 기준성
  chosen_reading: 아티클 없이도 ‘네 하나님의 율법’이 조사와 판단의 기준이 되는 것으로 읽었습니다.
  alternative_readings:
  - 단순히 정보로서의 율법
  - 왕의 행정 명령이 우선하는 것으로 읽는 해석
  rationale: 문맥상 조사는 왕권에 의해 위임되지만, 그 실행 기준은 분명히 에스라가 가진 하나님의 율법입니다. 본문은 행정 권한과 신앙적 기준을 함께 드러냅니다.
  doctrine_reference: Ezra 7:14 context; source-text governance by divine law
