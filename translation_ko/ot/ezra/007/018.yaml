  text: וּ/מָ֣ה דִי֩ עלי/ך וְ/עַל אחי/ך יֵיטַ֗ב בִּ/שְׁאָ֛ר כַּסְפָּ֥/א וְ/דַהֲבָ֖/ה לְ/מֶעְבַּ֑ד כִּ/רְע֥וּת אֱלָהֲ/כֹ֖ם תַּעַבְדֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
  footnotes:
  - marker: a
    text: Or 'whatever is good to you and your brothers.' The Aramaic idiom can be rendered more formally as 'is good' or more idiomatically as 'seems good.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the desire of your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 은과 금의 남은 것으로 너와 네 형제들에게 무엇이든 좋게 여겨지는 대로, 너희 하나님의 뜻에 따라 행하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너와 네 형제들에게 무엇이든 좋다/좋게 보인다’라고 옮길 수 있습니다. 아람어 관용구는 보다 직역하면 ‘좋다’이며, 더 자연스럽게는 ‘좋게 여겨지다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 하나님의 원하심에 따라’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  english_pob_choice: And whatever
  chosen_korean: 그리고 무엇이든
  alternatives_korean:
  - 그리고 무엇이
  - 그리고 무엇이든지
  lexicon: HALOT
  rationale: 불특정 관계절의 개방성을 살리기 위해 한국어에서는 간결한 ‘무엇이든’이 가장 자연스럽습니다.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  english_pob_choice: seems good to you and your brothers
  chosen_korean: 너와 네 형제들에게 좋게 여겨지는 대로
  alternatives_korean:
  - 너와 네 형제들에게 좋은 대로
  - 너와 네 형제들에게 기쁘게 여겨지는 대로
  lexicon: HALOT
  rationale: יֵיטַב + עַל은 단순히 ‘좋다’가 아니라 당사자들에게 좋게/마음에 들게 보이는 의미이므로, 결정을 허용하는 왕령의 뉘앙스를 살려 ‘좋게 여겨지는 대로’로 옮겼습니다.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  english_pob_choice: with the rest of the silver and the gold
  chosen_korean: 은과 금의 남은 것
  alternatives_korean:
  - 남은 은과 금으로
  - 은과 금의 나머지
  lexicon: HALOT
  rationale: שְׁאָר는 ‘남은 것, 잔여분’이므로 이전에 언급된 재정의 잔액이라는 의미가 드러나도록 ‘은과 금의 남은 것’으로 표현했습니다.
- source_word: כִּרְעוּת אֱלָהֲכֹם
  english_pob_choice: according to the will of your God
  chosen_korean: 너희 하나님의 뜻에 따라
  alternatives_korean:
  - 너희 하나님의 원하심에 따라
  - 너희 하나님의 뜻을 따라
  lexicon: HALOT
  rationale: רְעוּת은 ‘뜻, 소원, इच्छा’의 범위를 가지며, 공식 문맥에서는 ‘뜻’이 가장 자연스럽고도 원문과 가깝습니다.
theological_decisions:
- issue: 왕의 허가가 인간 재량이 아니라 하나님 뜻에 종속되어 있음
  chosen_reading: 행하십시오
  alternative_readings:
  - 하시오
  - 하도록 하십시오
  rationale: 히브리어/아람어 동사의 허락·명령 뉘앙스를 한국어 합쇼체 명령으로 옮기되, 행위의 기준을 ‘너희 하나님의 뜻’에 분명히 종속시켜 원문의 신학적 초점을 보존했습니다.
  doctrine_reference: 섭리와 순종
