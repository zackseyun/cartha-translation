theological_decisions:
- issue: 하나님의 율법과 왕의 율법의 병렬 관계
  chosen_reading: 두 권위를 서로 종속시키지 않고 병렬로 제시했습니다.
  alternative_readings:
  - 왕의 율법을 하나님의 율법 아래에 두는 해석
  - 왕의 율법을 하나님의 율법 집행으로 제한하는 해석
  rationale: 본문은 페르시아 왕의 명령 안에서 두 법을 나란히 두므로, 번역에서도 그 긴장을 해소하지 않고 그대로 드러내는 것이 source-driven입니다.
  doctrine_reference: 본문의 긴장 보존
- issue: ‘lשרשו’의 형벌 의미
  chosen_reading: ‘추방’으로 옮겨 공동체나 거처로부터의 축출 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘뿌리뽑음’으로 직역
  - ‘유배’로 옮김
  rationale: 희귀한 아람어 어근의 문자적 이미지는 있으나, 법정 형벌 문맥에서는 실제 집행 결과를 드러내는 ‘추방’이 가장 균형 잡힌 번역입니다.
  doctrine_reference: lexical caution
