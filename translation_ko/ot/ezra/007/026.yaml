  source_fidelity: ‘율법’은 하나님의 법뿐 아니라 왕의 법에도 적용되어 원문의 일반 법적 용어 דָּתָא를 지나치게 종교화합니다. 두 경우 모두 ‘법’으로 옮겨 병렬성과 페르시아 칙령의 법적 문맥을 보존하는 것이 적절합니다. 또한 현 초안의 마지막 ‘…형벌이든지 해야 합니다’는 열거된 형벌을 다시 수행해야 한다는 뜻처럼 들려 원문의 구문을 정확히 반영하지 못합니다.
  naturalness: ‘판결이 집행되어야 합니다’는 자연스럽지만, 뒤 문장의 ‘해야 합니다’와 결합하면 어색하고 의미가 중복됩니다. 수정문은 판결의 신속한 집행과 가능한 형벌들의 열거를 한 문장 안에서 자연스럽게 연결합니다.
