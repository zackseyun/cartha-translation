base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
  footnotes:
  - marker: a
    text: Or 'for expulsion' or more literally 'for uprooting.' The Aramaic term is rare and may refer to banishment from one's place or community.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 당신의 하나님의 법과 왕의 법을 따르지 않으면, 그에게 신속히 판결을 집행해야 합니다. 그 형벌은 죽음이든지, 추방이든지, 재산 몰수이든지, 또는 투옥이든지 할 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘추방’으로 옮긴 말은 문자적으로 ‘뿌리뽑음’ 또는 ‘뽑아냄’에 가까울 수 있습니다. 이 희귀한 아람어 용어는 거처나 공동체로부터 내쫓는 처벌을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
