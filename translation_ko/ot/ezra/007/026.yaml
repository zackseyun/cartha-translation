- source_word: אַסְפַּרְנָא דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  english_pob_choice: let judgment be executed on him promptly
  chosen_korean: 그에게 곧바로 판결이 집행되어야 합니다
  alternatives_korean:
