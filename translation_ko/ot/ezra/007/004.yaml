lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 자손
  - ~의 후손
  lexicon: HALOT
  rationale: 족보의 בֶּן은 POB의 'son of'처럼 기본적으로 친계 계보를 나타내므로, 한국어에서도 가장 직접적인 족보 표현인 '~의 아들'로 옮겼습니다.
- source_word: זְרַחְיָה
