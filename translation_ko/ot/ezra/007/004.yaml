  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 음역했으며, 영어 POB의 Zerahiah에 대응하는 표준 한국어 음역으로 처리했습니다.
- source_word: עֻזִּי
  english_pob_choice: Uzzi
  chosen_korean: 우찌
  alternatives_korean:
  - 우지
  lexicon: 고유명사 음역
  rationale: 고유명사는 관용 음역을 따랐고, 이 이름은 한국어에서 흔히 우지로도 적지만 히브리어 자음의 겹침을 드러내기 위해 우찌를 선택했습니다.
- source_word: בֻּקִּי
  english_pob_choice: Bukki
  chosen_korean: 북기
  alternatives_korean:
  - 부끼
  - 부기
  lexicon: 고유명사 음역
  rationale: 히브리어 자음과 영어 POB의 Bukki를 반영하여 한국어 음역을 북기로 두었습니다.
