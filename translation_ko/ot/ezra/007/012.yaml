base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
  footnotes:
  - marker: a
    text: Or 'the scribe of the decree of the God of heaven,' if דָּתָא is taken in the broader administrative sense 'decree' rather than 'law.'
    reason: lexical_alternative
  - marker: b
    text: The Aramaic greeting is formulaic; 'complete peace' could also be rendered 'perfect peace' or more idiomatically 'greetings.'
    reason: lexical_alternative
translation:
  language: ko
  text: '아르닥사스다[a], 왕 중의 왕이, 제사장 에스라에게, 하늘의 하나님 율법의 서기관에게: 완전한 평강[b]. 그리고 이제—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 하나님 법령의 서기관’으로도 옮길 수 있습니다. 다ָּתָא를 더 넓은 행정 의미의 ‘칙령/법령’으로 볼 가능성이 있기 때문입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어 인사말의 관용구입니다. ‘완전한 평화’ 또는 더 자연스럽게 ‘인사드립니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
