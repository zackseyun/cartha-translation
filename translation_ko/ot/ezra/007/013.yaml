id: EZR.7.13
reference: Ezra 7:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
  footnotes:
  - marker: a
    text: Or 'everyone who volunteers.' The Aramaic participle emphasizes willing, voluntary action.
    reason: lexical_alternative
  - marker: b
    text: Or 'and his priests,' if the suffix is taken differently; context favors 'its priests,' referring to Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 왕명은 내가 내리노니, 내 왕국에 있는 이스라엘 백성 가운데서, 그리고 그들의 제사장들과 레위 사람들 가운데서, 예루살렘으로 당신과 함께 가기를 자원하는 사람은 누구든지 갈 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנִּי / שִׂים טְעֵם
  english_pob_choice: A decree is issued by me
  chosen_korean: 왕명은 내가 내리노니
  alternatives_korean:
  - 내가 칙령을 내리노니
  - 내가 명령을 내리노니
  lexicon: HALOT
  rationale: 아람어 관용구는 문자적으로는 ‘명령을 두다’에 가깝지만, 한국어에서는 왕의 공식 선포를 ‘왕명’과 ‘내리다’로 옮기는 것이 행정문서체를 가장 자연스럽게 살립니다.
- source_word: כָל מִתְנַדַּב
  english_pob_choice: anyone ... who freely offers himself
  chosen_korean: 자원하는 사람은 누구든지
  alternatives_korean:
  - 기꺼이 자기를 내어놓는 사람은 누구든지
  - 자진하여 나서는 사람은 누구든지
  lexicon: HALOT
  rationale: 히트파엘 분사는 단순한 의사표시가 아니라 자발적 헌신을 강조하므로, ‘자원하는’으로 그 자발성을 간결하게 살렸습니다.
- source_word: וְכָהֲנוֹהִי
  english_pob_choice: and their priests
  chosen_korean: 그들의 제사장들과
  alternatives_korean:
  - 그 제사장들과
  - 그의 제사장들과
  lexicon: HALOT
  rationale: 문맥상 수식어는 이스라엘을 가리키므로, 한국어에서도 소유 대명사를 덧붙여 이스라엘의 제사장들을 분명히 했습니다.
- source_word: וְלֵוָיֵא
  english_pob_choice: and Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 템플 봉사 집단을 가리키는 표준 표현으로 ‘레위 사람들’을 택해, 본문이 특정 직분 집단을 포괄하고 있음을 드러냈습니다.
theological_decisions:
- issue: 왕의 허가를 나타내는 종결 표현
  chosen_reading: ‘갈 수 있습니다’로 허가의 의미를 살렸습니다.
  alternative_readings:
  - ‘가도 됩니다’
  - ‘가게 하십시오’
  rationale: 본문의 יְהָךְ는 명령이라기보다 허가/허용의 뉘앙스를 가지므로, 왕령의 승인성을 드러내는 ‘갈 수 있습니다’가 가장 균형적입니다.
  doctrine_reference: 본문 해석상 행정적 허가의 문체 선택
