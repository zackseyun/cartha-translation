  to: 나는 칙령을 내립니다. 내 왕국에 있는 이스라엘 백성과 그 제사장들과 레위 사람들 가운데서, 그대와 함께 예루살렘으로 가기를 자원하는 사람은 누구든지 갈 수 있습니다.
