base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'carefully' or 'exactly' for 'diligently'; the Aramaic adverb emphasizes precise execution of the command.
    reason: lexical_alternative
  - marker: b
    text: '''Silver'' may function as money here, but the text literally says ''silver.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'the temple of your God'; literally, 'the house of your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 은으로 수송아지들과 숫양들과 어린 양들과 그들의 소제와 그들의 전제까지도 부지런히 사서, 예루살렘에 있는 너희 하나님 집의 제단 위에 바치십시오.
  philosophy: optimal-equivalence
