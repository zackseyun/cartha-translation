revisions:
- from: 하늘의 하나님께서 명하시는 것은 무엇이든지 하나님의 집을 위하여 신속히 행하시오. 그렇지 않으면 왕과 그의 아들들의 나라에 진노가 임할까 합니다.[a][b]
  to: 하늘의 하나님께서 명하신 모든 것은 하늘의 하나님의 집을 위하여 부지런히[a] 행하십시오. 어찌하여 왕과 그의 아들들의 왕국 위에 진노가 내리겠습니까?[b]
  rationale: 반복되는 ‘하늘의 하나님’ 호칭과 ‘집’이라는 원문 표현을 유지하고, 집행 부사의 의미를 속도에 한정하지 않도록 조정했습니다. 마지막 절은 원문의 수사의문문을 한국어 합쇼체로 직접 옮겨 경고의 힘을 보존했으며, 각주 표지는 해당 표현에 연결했습니다.
