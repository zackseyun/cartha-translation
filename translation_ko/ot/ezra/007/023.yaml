  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
  footnotes:
  - marker: a
    text: Or, more literally, 'for why should there be wrath upon the kingdom of the king and his sons?'
    reason: lexical_alternative
  - marker: b
    text: '''House of the God of heaven'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 하늘의 하나님께서 명하신 모든 것은 하늘의 하나님의 집을 위하여 부지런히[a] 행하십시오. 어찌하여 왕과 그의 아들들의 왕국 위에 진노가 내리겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 אַדְרַזְדָּא는 ‘부지런히’ 외에 ‘철저히’, ‘세심하게’라는 뉘앙스도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 문자적으로 ‘왕과 그의 아들들의 왕국 위에 어찌하여 진노가 있겠는가?’라는 경고성 수사의문문입니다. ‘하늘의 하나님의 집’은 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל דִּי
  english_pob_choice: Whatever
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 모든 것
  - 무릇
  lexicon: HALOT
  rationale: 총괄적 관계절의 의미를 한국어에서 가장 자연스럽게 살려, 범위를 포괄하는 표현으로 옮겼습니다.
- source_word: מִן טַעַם
  english_pob_choice: is commanded by
  chosen_korean: 명하시는 것은
  alternatives_korean:
  - 명령하신 것은
  - 분부하시는 것은
  lexicon: HALOT
  rationale: 임페리얼 행정 문맥의 ‘명하다/분부하다’ 의미를 살리되, 한국어에서는 관계절로 풀어 자연스럽게 표현했습니다.
- source_word: אַדְרַזְדָּא
  english_pob_choice: diligently
  chosen_korean: 신속히
  alternatives_korean:
  - 열심히
  - 정성껏
  - 철저히
  lexicon: HALOT
  rationale: 이 부사는 단순한 성실성보다 신속한 집행의 뉘앙스가 강하므로, 실행의 속도와 긴급성을 드러내는 표현을 택했습니다.
- source_word: בֵית אֱלָהּ שְׁמַיָּא
  english_pob_choice: the house of the God of heaven
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하늘의 하나님 집
  - 하늘의 하나님의 집
  - 성전
  lexicon: HALOT
  rationale: 원문의 ‘집’을 기본으로 유지하되, 한국어에서는 예배 처소를 자연스럽게 가리키는 ‘하나님의 집’으로 옮겼습니다. ‘성전’은 해석을 더 강하게 드러내므로 본문에서는 피했습니다.
- source_word: לֶהֱוֵא קְצַף עַל
  english_pob_choice: lest wrath come upon
  chosen_korean: 진노가 임할까 합니다
  alternatives_korean:
  - 진노가 임하지 않도록
  - 진노가 내릴까 합니다
  - 노가 닥칠까 합니다
  lexicon: HALOT
  rationale: 아람어의 경고 목적/결과 표현을 한국어의 완곡한 경고문으로 살리면서도, ‘임하다’로 진노의 도래를 유지했습니다.
theological_decisions:
- issue: ‘하늘의 하나님’과 ‘하나님의 집’의 결합
  chosen_reading: 하늘의 하나님께서 명하시는 것은 무엇이든지 하나님의 집을 위하여…
  alternative_readings:
  - 하늘의 하나님이 명하시는 것은 무엇이든지 성전을 위하여…
  - 하늘의 하나님께서 명하시는 것은 무엇이든지 그 집을 위하여…
  rationale: 원문의 관용적 호칭을 유지하면서도, 본문이 가리키는 예배 공간을 한국어 독자가 바로 이해하도록 ‘하나님의 집’으로 옮겼습니다. 이는 해석이 아니라 맥락이 요구하는 최소한의 명시화입니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 경고 절의 문법적 형태
  chosen_reading: 그렇지 않으면 왕과 그의 아들들의 나라에 진노가 임할까 합니다.
  alternative_readings:
  - 왕과 그의 아들들의 나라에 진노가 임할까 보오
  - 왕과 그의 아들들의 나라에 진노가 임하지 않기를 바랍니다
  rationale: 원문의 경고 목적을 한국어에서 자연스럽게 전달하기 위해 ‘그렇지 않으면…’ 구조를 사용했습니다. 이는 위협의 성격을 약화하지 않으면서도 현대 한국어 독자에게 명료합니다.
  doctrine_reference: Translation philosophy §3, §6
