base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
  footnotes:
  - marker: a
    text: Or 'some of the Israelites.' The Hebrew literally says 'some of the sons of Israel,' with a partitive sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Nethinim,' a technical term for a class of temple servants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손들 가운데서 얼마와 제사장들, 레위인들, 노래하는 자들, 문지기들, 그리고 성전 봉사자들이 바사 왕 아닥사스다의 제칠 년에 예루살렘으로 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 올랐습니다
  lexicon: WLC / HALOT
  rationale: 예루살렘으로의 이동에서 ‘עלה’의 지리적·상향적 뉘앙스를 살리기 위해 ‘올라가다’를 유지했습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: some of the sons of Israel
  chosen_korean: 이스라엘 자손들 가운데서 얼마
  alternatives_korean:
  - 이스라엘 사람들 가운데서 얼마
  - 이스라엘 자손들 중 일부
  lexicon: WLC / HALOT
  rationale: מִן의 부분적 의미를 살려 ‘가운데서 얼마’로 옮겨, 전체가 아니라 일부만 올라갔다는 점을 드러냈습니다.
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 느디님들
  - 성전 종들
  lexicon: WLC / HALOT
  rationale: 영문 POB의 기능 번역을 따라 의미를 분명히 하되, 현대 독자에게 낯선 음역어보다 역할이 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 직함과 열거의 직역성
  chosen_reading: ‘제사장들, 레위인들, 노래하는 자들, 문지기들, 그리고 성전 봉사자들’로 직역해 성전 공동체의 구성 목록을 보존했습니다.
  alternative_readings:
  - ‘성직자들’처럼 포괄적으로 처리
  - 일부 항목을 묶어 완화된 표현으로 정리
  rationale: 본문은 귀환 집단의 구성 항목을 구체적으로 나열하므로, 각 직분을 분리해 제시하는 것이 본문의 사회·예배적 구분을 가장 잘 반영합니다.
  doctrine_reference: Ezra-Nehemiah historical/cultic context
