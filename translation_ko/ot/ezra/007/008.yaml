translation:
  language: ko
  text: 그는 다섯째 달에 예루살렘에 도착했는데, 그 해는 왕의 일곱째 해였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 다섯째 달에 예루살렘에 도착했으며, 그때가 왕의 일곱째 해였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: And he came
  chosen_korean: 도착했는데
  alternatives_korean:
  - 왔습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 이동의 종결점을 분명히 드러내는 서술로, 영어 POB의 단순한 ‘came’에 대응하면서 한국어 독자가 자연스럽게 이해할 수 있게 했습니다.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  english_pob_choice: in the fifth month
  chosen_korean: 다섯째 달에
  alternatives_korean:
  - 다섯째 달 동안에
  - 오월에
  lexicon: HALOT
  rationale: 히브리어의 달력 표현을 직역해 달 수를 보존했습니다. ‘오월’은 현대 달 이름으로 바꾸는 해석을 피했습니다.
- source_word: שְׁנַת הַשְּׁבִיעִית
  english_pob_choice: the seventh year
  chosen_korean: 왕의 일곱째 해
  alternatives_korean:
  - 일곱째 해
  - 왕의 제7년
  lexicon: HALOT
  rationale: 문맥상 רגnal dating이므로 ‘해’로 옮기되, 뒤의 לַמֶּלֶךְ과 결합된 관계를 한국어에서 자연스럽게 드러냈습니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: of the king
  chosen_korean: 왕의
  alternatives_korean:
  - 임금의
  - 그 왕의
  lexicon: HALOT
  rationale: 통치 연대를 나타내는 관계 표현으로 ‘왕의’가 가장 간결하고 본문 구조를 잘 반영합니다.
theological_decisions:
- issue: 본문의 왕이 누구인지 본절에서 명시하지 않는 문제
  chosen_reading: 본문 그대로 ‘왕’만 유지했습니다.
  alternative_readings:
  - 아닥사스다 왕으로 풀어 쓰기
  rationale: 이 절 자체는 인명을 덧붙이지 않고 연대 표지 기능만 수행하므로, 명시되지 않은 이름을 삽입하지 않았습니다.
  doctrine_reference: source fidelity
