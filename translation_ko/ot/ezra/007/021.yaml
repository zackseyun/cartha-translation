id: EZR.7.21
reference: Ezra 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֠/מִנִּ/י אֲנָ֞ה אַרְתַּחְשַׁ֤סְתְּא מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/כֹל֙ גִּזַּֽבְרַיָּ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה דִּ֣י כָל דִּ֣י יִ֠שְׁאֲלֶנְ/כוֹן עֶזְרָ֨א כָהֲנָ֜/ה סָפַ֤ר דָּתָ/א֙ דִּֽי אֱלָ֣הּ שְׁמַיָּ֔/א אָסְפַּ֖רְנָא יִתְעֲבִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
  footnotes:
  - marker: a
    text: Or 'let it be done exactly/promptly'; the Aramaic adverb emphasizes careful and full compliance.
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' is the Persian administrative name for the region west of the Euphrates.'
    reason: cultural_note
translation:
  language: ko
  text: 또한 나 아르타크세르크세스 왕이 강 건너편 지역[b]의 모든 재무관에게 칙령을 내립니다. 제사장 에스라, 곧 하늘의 하나님의 율법을 맡은 서기관이 여러분에게 요청하는 것은 무엇이든지 정확히[a] 시행되게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정확히’는 아람어 부사가 나타내는 ‘세밀하게, 빈틈없이, 정확하게’라는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강 건너편 지역’은 유브라데 강 서쪽 지역을 가리키는 페르시아 행정 명칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי / אֲנָה
  english_pob_choice: And from me, I
  chosen_korean: 그리고 나로부터, 나
  alternatives_korean:
  - 그리고 나에게서, 나
  - 또 나로부터, 나 자신이
  lexicon: HALOT
  rationale: 전문 앞의 개인적 권한 부여를 살리기 위해 출처의 전면적 1인칭 강조를 유지했습니다.
- source_word: שִׂים טְעֵם
  english_pob_choice: issue a decree
  chosen_korean: 조서를 내립니다
  alternatives_korean:
  - 칙령을 내립니다
  - 명령을 반포합니다
  lexicon: HALOT
  rationale: 왕의 공식 행정 문맥이므로 현대 한국어에서 자연스럽고 격식을 갖춘 행정 법령 표현을 택했습니다.
- source_word: לְכֹל גִּזַּבְרַיָּא
  english_pob_choice: to all the treasurers
  chosen_korean: 모든 금고 관리자들에게
  alternatives_korean:
  - 모든 재정 관리인들에게
  - 모든 보물 관리자들에게
  lexicon: HALOT
  rationale: גִּזַּבְרַיָּא를 단순 직함으로 옮기기보다, 문맥상 재정·금고를 맡은 관원이라는 기능을 드러내는 표현을 선택했습니다.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  english_pob_choice: in Beyond the River
  chosen_korean: 강 건너편의
  alternatives_korean:
  - 강 건너 지역의
  - 유브라데 강 건너 지역의
  lexicon: HALOT
  rationale: 인명 고유지명으로 음역하기보다 페르시아 행정 구역명이라는 기능을 한국어 독자가 즉시 이해하도록 풀어 옮겼습니다. 다만 본문은 간결하게 유지했습니다.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  english_pob_choice: of the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 하나님께 속한
  - 하늘 하나님
  lexicon: HALOT
  rationale: 관형격을 자연스러운 한국어로 압축하되, 하나님에 대한 제국 문서의 공식 칭호를 유지했습니다.
- source_word: אָסְפַּרְנָא
  english_pob_choice: diligently
  chosen_korean: 정확히
  alternatives_korean:
  - 신속히
  - 주의 깊게
  - 빈틈없이
  lexicon: HALOT
  rationale: POB의 주석처럼 이 부사는 주로 속도보다 정확·철저함을 강조하므로, 한국어에서는 ‘정확히’가 그 핵심을 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 페르시아 왕의 칙령 문체를 한국어에서 어떻게 재현할지
  chosen_reading: 명령의 공식성과 즉시성을 살려 ‘조서를 내립니다… 시행되게 하십시오’로 번역했습니다.
  alternative_readings:
  - ‘명령합니다’
  - ‘법령을 반포합니다’
  rationale: 원문은 왕의 권위로 발해진 행정적 법령 문맥이므로, 단순한 일반 명령보다 공식 문서의 어조를 유지하는 것이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 문맥상 역사 서술이며 교리 쟁점은 없으나, 왕권과 행정 권위의 언어는 약화하지 않았습니다.
