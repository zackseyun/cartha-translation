  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 כְּחָכְמַת ... דִּי בִידָךְ는 ‘지혜에 따라—손에 있는 지혜에 따라’처럼 준거 표현을 반복하기보다, ‘손에 있는 ... 지혜를 따라’로 한 단위로 옮기는 것이 원문 구조에 더 가깝습니다. 또한 법을 모르는 이들이 알지 못하는 대상은 앞선 하나님의 법들이므로 이를 명시하는 편이 안전합니다.
  naturalness: 현 초안의 ‘당신의 하나님의’, ‘그 지혜에 따라’의 반복, 그리고 ‘모든 백성, 곧 ... 모든 사람’은 다소 부자연스럽습니다. 문장을 재구성하여 현대 표준어 합쇼체의 공식적 명령 문체를 유지했습니다.
  terminology: ‘법들’로 복수형을 반영했고, 두 사법 직함은 ‘치안관들과 재판관들’로 구별했습니다. ‘강 건너편’은 페르시아 행정 명칭의 성격을 보존하되, 해당 표현에 문화 주석 표지를 직접 붙였습니다.
