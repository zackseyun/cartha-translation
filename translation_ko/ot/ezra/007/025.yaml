revisions:
- from: 그리고 당신, 에스라여, 당신의 하나님의 지혜에 따라 — 곧 당신 손에 있는 그 지혜에 따라 — 재판관들과 심판관들을 세우십시오. 그들이 강 건너편에 있는 모든 백성, 곧 당신의 하나님의 법을 아는 모든 사람을 재판하게 하고, 그것을 알지 못하는 사람들에게는 당신이 가르치십시오.[a][b]
  to: 에스라여, 당신의 손에 있는[a] 당신의 하나님의 지혜를 따라 치안관들과 재판관들을 세우십시오. 그들이 강 건너편에 있는[b] 모든 백성, 곧 당신의 하나님의 법들을 아는 모든 사람을 재판하게 하십시오. 그 법들을 알지 못하는 이들에게는 당신이 가르치십시오.
  rationale: 원문의 문법적 연결을 보존하도록 ‘손에 있는’이 ‘지혜’를 수식하게 했고, 병렬된 사법 직함과 법들의 복수성을 반영했습니다. 필수 주석 표지를 관련 어구에 배치했으며, 어느 특정 교리적 해석도 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:18Z'
