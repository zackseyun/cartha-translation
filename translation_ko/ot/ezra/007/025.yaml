reference: Ezra 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
  footnotes:
  - marker: a
    text: Or 'which you possess' for 'that is in your hand'; the Aramaic idiom can denote possession or entrusted authority.
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' is the Persian administrative designation for the territory west of the Euphrates.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 당신, 에스라여, 당신의 하나님의 지혜에 따라 — 곧 당신 손에 있는 그 지혜에 따라 — 재판관들과 심판관들을 세우십시오. 그들이 강 건너편에 있는 모든 백성, 곧 당신의 하나님의 법을 아는 모든 사람을 재판하게 하고, 그것을 알지 못하는 사람들에게는 당신이 가르치십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신 손에 있는’은 ‘당신이 소유한’ 또는 ‘당신에게 위임된’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강 건너편’은 페르시아 행정 용어로, 유브라데 강 서쪽 지역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  english_pob_choice: according to the wisdom of your God
  chosen_korean: 당신의 하나님의 지혜에 따라
  alternatives_korean:
  - 당신의 하나님의 지혜대로
  - 당신의 하나님의 지혜를 따라
  lexicon: HALOT
  rationale: כְּ는 ‘~에 따라/대로’의 일치·준거를 나타내므로, 한국어에서도 그 관계를 자연스럽게 살려야 합니다.
- source_word: דִּי בִידָךְ
  english_pob_choice: that is in your hand
  chosen_korean: 당신 손에 있는 그 지혜
  alternatives_korean:
  - 당신이 가진 그 지혜
  - 당신에게 맡겨진 그 지혜
  lexicon: HALOT
  rationale: 직역상 ‘손에 있다’는 이미지를 유지하되, 한국어에서는 소유와 위임된 권한의 뉘앙스를 함께 살리는 쪽이 자연스럽습니다.
- source_word: שָׁפְטִין וְדַיָּנִין
  english_pob_choice: magistrates and judges
  chosen_korean: 재판관들과 심판관들
  alternatives_korean:
  - 재판관들과 판사들
  - 행정관들과 재판관들
  lexicon: HALOT
  rationale: 두 직함의 병렬을 유지해야 하므로, 두 단어를 서로 구별되는 한국어로 옮겼습니다.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  english_pob_choice: all who know the laws of your God
  chosen_korean: 당신의 하나님의 법을 아는 모든 사람
  alternatives_korean:
  - 당신의 하나님의 법들 아는 모든 사람
  - 당신의 하나님의 율법을 아는 모든 사람
  lexicon: HALOT
  rationale: דָּתֵי는 여기서 복수형 ‘법들’의 성격이 있으나, 한국어에서는 자연성을 위해 집합명사 ‘법’으로 처리했습니다.
- source_word: תְּהוֹדְעוּן
  english_pob_choice: you shall teach
  chosen_korean: 당신이 가르치십시오
  alternatives_korean:
  - 당신이 알게 하십시오
  - 당신이 알려 주십시오
  lexicon: HALOT
  rationale: 동사의 사역적 의미 ‘알게 하다’를 행정·교육적 문맥에서 가장 자연스럽게 드러내는 표현은 ‘가르치다’입니다.
theological_decisions:
- issue: 강 건너편 표지구의 지리·행정적 의미
  chosen_reading: ‘강 건너편’으로 옮겨 페르시아 행정지명인 고유 표현의 성격을 유지했습니다.
  alternative_readings:
  - ‘유브라데 강 건너편’
  - ‘강 저쪽 지역’
  rationale: 원문은 서쪽 유브라데 지역을 가리키는 제국 행정명칭이므로, 과도한 해설을 본문에 넣지 않고도 식별 가능한 번역을 택했습니다.
  doctrine_reference: 역사·지리 배경 보존
