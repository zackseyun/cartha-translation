  - severity: medium
    issue: 목적 관계가 이중 사역 표현으로 흐려짐
    rationale: ‘왕의 마음에 두셔서 … 아름답게 하게 하셨습니다’는 ‘두다’와 ‘하게 하다’를 중첩합니다. 원문의 ‘왕의 마음에 이것을 두어 … 아름답게 하게 하다’라는 목적 관계를 ‘왕이 … 하도록 … 두셨습니다’로 명확히 옮길 수 있습니다.
