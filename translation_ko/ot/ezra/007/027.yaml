base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
  footnotes:
  - marker: a
    text: Or 'to adorn' or 'to glorify' the house of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 곧 우리 조상들의 하나님은 복되십니다. 그분께서 이와 같은 것을 왕의 마음에 두셔서, 예루살렘에 있는 야훼의 집을 아름답게 하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꾸미다’, ‘영화롭게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼, 곧 우리 조상들의 하나님은 복되십니다
  alternatives_korean:
  - 야훼는 복되십니다
  - 야훼를 찬양합니다
  lexicon: HALOT
  rationale: 도복(doxology) 공식으로서 단순 상태술어보다 ‘복되십니다’가 축복/찬양의 방향을 더 잘 살립니다. ‘야훼’는 본문에 있는 신명사 יְהוָה를 직접 반영합니다.
- source_word: אֱלֹהֵי אֲבוֹתֵי/נוּ
  english_pob_choice: the God of our fathers
  chosen_korean: 우리 조상들의 하나님
  alternatives_korean:
  - 우리 조상의 하나님
  - 우리 조상들의 하나님
  lexicon: HALOT
  rationale: 언약적 관용구를 자연스러운 현대 한국어로 옮기되, 집합적·세대적 연결을 보존했습니다.
- source_word: כָּ/זֹאת
  english_pob_choice: this / such a thing
  chosen_korean: 이와 같은 것
  alternatives_korean:
  - 이것
  - 이런 일
  lexicon: HALOT
  rationale: 문맥상 왕의 마음에 ‘들어간’ 구체적 결심이나 계획을 가리키므로, 단순 지시어 ‘이것’보다 ‘이와 같은 것’이 히브리어의 넓은 지시 범위를 더 안전하게 반영합니다.
- source_word: לְ/פָאֵר
  english_pob_choice: to beautify
  chosen_korean: 아름답게 하게
  alternatives_korean:
  - 꾸미게
  - 영화롭게 하게
  - 아름답게 하게
  lexicon: HALOT
  rationale: 성전의 외형적 장엄함을 말하는 문맥이므로 ‘영화롭게’보다 ‘아름답게’가 구체적이고 직역에 가깝습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: 히브리어 직역 표현을 유지해 언약적 울림을 보존했습니다. 문맥상 성전을 가리키지만 ‘성전’으로 바꾸지 않았습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
