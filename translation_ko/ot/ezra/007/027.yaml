  to: 우리 조상들의 하나님이신 야훼는 찬송을 받으실 분이십니다. 그분께서는 왕이 예루살렘에 있는 야훼의 집을 아름답게 하도록 왕의 마음에 이 일을 두셨습니다.[a]
  rationale: 송영 공식의 자연스러운 한국어 표현을 채택하고, 왕의 마음에 뜻을 두신 행위와 성전을 아름답게 하는 목적의 관계를 명료하게 했습니다. ‘야훼의 집’과 지시어 ‘이 일’을 유지하여 원문의 표현과 지시성을 보존했습니다.
