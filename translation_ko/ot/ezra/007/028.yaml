revisions:
- from: 왕 앞과 그의 조언자들 앞과 왕의 모든 용사 같은 관리들 앞에서 내게 호의를 베푸신 분이시며, 야훼 나의 하나님의 손이 내 위에 있었으므로 내가 용기를 내어 이스라엘에서 우두머리들을 모아 나와 함께 올라가게 하였습니다.[a][b][c]
  to: 하나님께서는 또한 왕과 그의 조언자들과 왕의 모든 유력한 관리들 앞에서 내게 호의를 베푸셨습니다.[a] 야훼 나의 하나님의 손이 내 위에 있었으므로,[b] 나는 힘을 얻어 이스라엘 사람들 가운데서 나와 함께 올라가도록 지도자들을 모았습니다.[c]
  rationale: 원문의 단일 전치사구가 왕, 조언자들, 모든 유력한 관리들에게 함께 걸리는 구조를 자연스럽게 반영했습니다. ‘용사 같은’이라는 추가된 비유를 제거하고, 앞 절에서 이어지는 하나님의 은혜 베푸심을 한국어 문장 안에서 명확히 했습니다. ‘힘을 얻어’는 הִתְחַזַּקְתִּי의 담대해짐/강해짐을 자연스럽게 나타내며, ‘나와 함께 올라가도록’은 לַעֲלוֹת עִמִּי의 목적을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:17Z'
