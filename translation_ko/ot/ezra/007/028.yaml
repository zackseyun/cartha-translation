  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
  footnotes:
  - marker: a
    text: Or 'showed favor to me' for 'extended steadfast love to me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I strengthened myself according to the hand of the LORD my God upon me.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'heads'; that is, leading men or chiefs from Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕 앞과 그의 조언자들 앞과 왕의 모든 용사 같은 관리들 앞에서 내게 호의를 베푸신 분이시며, 야훼 나의 하나님의 손이 내 위에 있었으므로 내가 용기를 내어 이스라엘에서 우두머리들을 모아 나와 함께 올라가게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''왕의 모든 용사 같은 관리들''은 히브리어의 ''왕의 용사된/강한 관리들''에 해당합니다.'
    reason: source_note
  - marker: b
    text: 직역하면 '야훼 나의 하나님의 손이 내 위에'입니다.
    reason: source_note
  - marker: c
    text: '''우두머리들''은 문자적으로는 ''머리들''로, 이스라엘의 대표적 지도자들을 뜻합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  english_pob_choice: extended steadfast love
  chosen_korean: 호의를 베푸신
  alternatives_korean:
  - 인자(חֶסֶד)를 베푸신
  - 변함없는 사랑을 펼치신
  - 은혜를 베푸신
  lexicon: HALOT
  rationale: 문맥상 페르시아 왕을 통해 주어진 우호를 가리키므로, 한국어에서는 자연스럽게 '호의를 베푸신'으로 옮기되, חֶסֶד의 언약적 무게를 과도하게 신학화하지는 않았습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 보는 앞에서
  lexicon: HALOT
  rationale: 왕, 조언자들, 관리들 앞이라는 궁정 맥락을 살려 가장 პირდაპირ적인 공간적 표현인 '앞에서'를 사용했습니다.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  english_pob_choice: the king’s mighty officials
  chosen_korean: 왕의 모든 용사 같은 관리들
  alternatives_korean:
  - 왕의 강력한 관리들
  - 왕의 용맹한 대신들
  - 왕의 모든 유력한 관리들
  lexicon: HALOT
  rationale: שָׂרִים은 '관리들/지도자들'의 성격이 강하고, הַגִּבֹּרִים는 단순한 직함이 아니라 그들의 힘과 위상을 덧붙입니다. 한국어에서는 '관리들'로 행정적 맥락을 살리고 '용사 같은'으로 강한 인상을 반영했습니다.
- source_word: הִתְחַזַּקְתִּי
  english_pob_choice: I took courage
  chosen_korean: 내가 용기를 내어
  alternatives_korean:
  - 내가 스스로 강해져서
  - 내가 힘을 얻어
  - 내가 기운을 내어
  lexicon: HALOT
  rationale: 히트파엘의 관용적 뜻인 '힘을 내다/담대해지다'를 한국어 자연문으로 옮겨, 자기원천적 강함보다 상황 속에서 담대해진 의미를 살렸습니다.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  english_pob_choice: because the hand of Yahweh my God was upon me
  chosen_korean: 야훼 나의 하나님의 손이 내 위에 있었으므로
  alternatives_korean:
  - 야훼 나의 하나님의 손이 내 위에 있었기 때문에
  - 야훼 나의 하나님의 손이 내게 임했으므로
  - 야훼 나의 하나님의 손이 내 위에 있었기에
  lexicon: HALOT
  rationale: 직역적 은유인 '손이 내 위에'를 유지해 하나님의 주권적 임재와 능력을 보존했습니다. 영어 POB의 인과적 이해를 반영해 후행절을 가능하게 하는 이유절로 처리했습니다.
- source_word: רָאשִׁים
  english_pob_choice: leading men
  chosen_korean: 우두머리들
  alternatives_korean:
  - 지도자들
  - 머리들
  - 수령들
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미인 'heads'를 반영하되, 사람을 뜻하는 '우두머리들'로 옮겨 '이스라엘에서 데려온 핵심 대표자들'이라는 기능을 드러냈습니다.
