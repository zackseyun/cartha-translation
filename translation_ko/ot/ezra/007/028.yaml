  source_fidelity: ‘용사 같은 관리들’은 הַגִּבֹּרִים를 직유로 바꾸어 원문의 ‘강력한/유력한 관리들’이라는 수식 관계를 흐립니다. 또한 이 절의 וְ/עָלַי는 앞 절의 하나님을 이어 받으므로, 한국어에서도 그 주어를 자연스럽게 드러내는 편이 안전합니다. ‘나와 함께 올라가도록’은 목적을 적절히 나타냅니다.
  naturalness: 초안의 ‘왕 앞과 그의 조언자들 앞과’은 반복적이고, ‘내게 호의를 베푸신 분이시며’는 절 단독으로는 다소 매달린 표현입니다. ‘왕과 … 앞에서’, ‘유력한 관리들’, ‘힘을 얻어’ 및 ‘지도자들을 모았습니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
