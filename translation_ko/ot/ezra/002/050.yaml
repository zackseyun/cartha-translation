translation:
  language: ko
  text: 아스나의 자손들, 메우님의 자손들, 네피심의 자손들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 메우님은 영어 전통에서 Maonim으로도 옮겨집니다.
