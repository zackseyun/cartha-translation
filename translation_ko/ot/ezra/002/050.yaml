lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  lexicon: HALOT
  rationale: 족보·귀환자 명단에서는 בְּנֵי가 혈연적 아들보다 집단/가문을 가리키는 경우가 많아, 한국어에서는 자연스럽고 문맥에 맞는 ‘자손들’로 옮겼습니다.
- source_word: אַסְנָה
  english_pob_choice: Asnah
  chosen_korean: 아스나
  alternatives_korean:
  - 아스낳
  - 아스나아
  lexicon: 고유명사 음역
  rationale: 고유명사는 의미 번역보다 음역이 적절하므로 표준적인 외래어 표기 방식에 따라 옮겼습니다.
- source_word: מעינים
  english_pob_choice: Meunim
  chosen_korean: 메우님
  alternatives_korean:
  - 메우님족
  - 마우님
  lexicon: HALOT
  rationale: 영어 전통의 Meunim을 따라 음역하되, 히브리어 자모의 소리를 반영해 한국어에서는 ‘메우님’이 무난합니다.
- source_word: נפיסים
  english_pob_choice: Nephisim
  chosen_korean: 네피심
  alternatives_korean:
  - 네푸심
  - 네피심족
  lexicon: HALOT
  rationale: 마소라 본문의 자음·모음을 따른 음역을 우선해 ‘네피심’으로 옮겼고, 영어 전통의 변이형은 본문보다 주석에 두는 편이 적절합니다.
theological_decisions:
- issue: 명단 형식의 집단 표지
  chosen_reading: 세 이름 모두를 개인명보다 가문/집단명으로 이해하도록 ‘자손들’로 일관되게 처리했습니다.
  alternative_readings:
  - ‘아들들’로 직역
  - 각 항목을 단순 고유명사 나열로 처리
  rationale: 에스라의 귀환자 명단은 역사적·공동체적 단위를 세는 계보 목록이므로, 한국어에서도 집단성을 드러내는 번역이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 역사서 계보/귀환자 목록의 문맥 이해
- issue: 번역의 가독성과 전통 용어
  chosen_reading: 전통 교회식 표현보다 현대 합쇼체의 간결한 명단 문장으로 제시했습니다.
  alternative_readings:
  - ‘~의 아들들이니라’ 식의 고전적 문체
  - 형용사적 나열
  rationale: 본문이 예배적 설교가 아니라 명단이므로, 현대 독자가 즉시 이해할 수 있는 간결한 보고형 문장이 문맥에 가장 충실합니다.
  doctrine_reference: 현대 한국어 성서문체
