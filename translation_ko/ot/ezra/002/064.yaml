lexical_decisions:
- source_word: כָּל הַקָּהָל
  english_pob_choice: The whole assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 전체 회중
  - 온 공동체
  lexicon: HALOT
  rationale: כָּל은 전체성을, הַקָּהָל은 모인 공동체를 가리키므로, ‘온 회중’이 간결하게 총체성을 살리면서도 교회적 뉘앙스를 과하게 넣지 않습니다.
- source_word: כְּאֶחָד
  english_pob_choice: together
  chosen_korean: 한 사람처럼 합하여
  alternatives_korean:
  - 함께
  - 한데
  - 한 몸처럼
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람처럼’이지만, 한국어에서는 ‘합하여’가 집합의 완결성을 자연스럽게 드러내며, POB가 각주로 보존한 ‘as one’의 의미를 해치지 않습니다.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  english_pob_choice: forty-two thousand three hundred sixty
  chosen_korean: 사만이천삼백육십 명
  alternatives_korean:
  - 사십이천삼백육십 명
  - 마흔두 천 삼백 예순 명
  lexicon: HALOT
  rationale: 히브리어 수사는 4만 + 2천 + 300 + 60의 합이므로, 현대 한국어에서 가장 읽기 자연스러운 표기로 옮겼습니다.
theological_decisions:
- issue: 회중에 대한 용어 선택
  chosen_reading: ‘회중’으로 번역해 귀환 공동체의 집합성을 드러냈습니다.
  alternative_readings:
  - 교회
  - 회중 공동체
  rationale: 이 본문은 성전 귀환자들의 인원 집계이므로, 후대 제도적 의미가 강한 ‘교회’보다 원문이 말하는 모인 백성의 뜻을 직접적으로 반영하는 ‘회중’이 적절합니다.
  doctrine_reference: 구약 회중(קָהָל) 용례
