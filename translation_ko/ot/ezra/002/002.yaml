language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
  footnotes:
  - marker: a
    text: In the parallel list at Nehemiah 7:7, 'Reelaiah' appears as 'Raamiah.'
    reason: alternative_reading
  - marker: b
    text: In the parallel list at Nehemiah 7:7, 'Mispar' appears as 'Mispereth.'
    reason: alternative_reading
  - marker: c
    text: In the parallel list at Nehemiah 7:7, 'Rehum' appears as 'Nehum.'
    reason: alternative_reading
  - marker: d
    text: This clause introduces the census total that is given in the following verse.
    reason: cross_reference
translation:
  language: ko
  text: '스룹바벨과 함께 온 사람들은 예수아, 느헤미야, 스라야, 르엘라야, 모르드개, 빌산, 므스발, 빅왜, 르훔, 바아나입니다[d][c][b][a]. 이스라엘 백성의 남자 수는:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 느헤미야 7:7의 평행 본문에는 이 이름이 '느훔'으로 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 느헤미야 7:7의 평행 본문에는 이 이름이 '므스비렛'으로 나옵니다.
    reason: alternative_reading
  - marker: c
    text: 느헤미야 7:7의 평행 본문에는 이 이름이 '라훔'으로 나옵니다.
    reason: alternative_reading
  - marker: d
    text: 이 구절은 다음 절에 제시될 계수 합계를 소개합니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ עִם
  english_pob_choice: who came with
  chosen_korean: 함께 온 사람들은
  alternatives_korean:
  - 스룹바벨과 함께 온 자들은
  - 스룹바벨과 함께 온 이들은
  lexicon: HALOT
  rationale: 관계절을 자연스럽게 한국어 명사구로 풀되, בָּאוּ의 기본 의미인 '오다'를 살려 '온'으로 옮겼습니다. 이 절은 귀환을 해석적으로 덧붙이기보다 단순 동행을 표시합니다.
- source_word: מִסְפָּר
  english_pob_choice: Mispar
  chosen_korean: 므스발
  alternatives_korean:
  - 미스파르
  lexicon: HALOT
  rationale: 이곳의 מִסְפָּר는 일반 명사 '수/번호'가 아니라 인명으로 쓰이므로, 남성 이름으로 음역했습니다. 본문은 열거 형식을 유지하되, 한국어 음역은 발음 가능한 형태로 정리했습니다.
- source_word: אַנְשֵׁי עַם יִשְׂרָאֵל
  english_pob_choice: the men of the people of Israel
  chosen_korean: 이스라엘 백성의 남자 수는
  alternatives_korean:
  - 이스라엘 백성의 남자들은
  - 이스라엘 사람들의 수는
  lexicon: HALOT
  rationale: אַנְשֵׁי를 남성형 명사로 살려 '남자'를 유지했고, 뒤의 מִסְפַּר는 이어지는 인구 집계를 예고하는 말이므로 '수는'으로 마무리했습니다. 원문의 성별 표지를 희석하지 않기 위해 일반적 '사람들'보다 '남자'를 택했습니다.
- source_word: זְרֻבָּבֶל
  english_pob_choice: Zerubbabel
  chosen_korean: 스룹바벨
  alternatives_korean:
  - 제로바벨
  lexicon: 공인 성서 인명 표기
  rationale: 한국어 성서에서 널리 쓰이는 고유명사 표기를 따랐습니다.
theological_decisions:
- issue: 열거 목록 끝의 문장부호 처리
  chosen_reading: 인명 열거 뒤에 이어지는 총계 예고는 다음 절로 넘어가는 구조를 보여 주므로, 끝을 콜론으로 열었습니다.
  alternative_readings:
  - 마침표로 닫기
  - 쉼표로 이어 붙이기
  rationale: 히브리어 본문과 영어 POB가 모두 다음 절의 계수 절로 연결함을 드러내므로, 콜론이 가장 잘 그 관계를 보여 줍니다.
  doctrine_reference: 본문 구조/담화 흐름
- issue: אַנְשֵׁי의 성별 표지 보존
  chosen_reading: 집단 전체를 중성화하지 않고 '남자 수'로 옮겨, 히브리어의 남성형 표현을 그대로 드러냈습니다.
  alternative_readings:
  - 사람 수
  - 백성의 수
  rationale: 원문은 분명히 남성형 집합 명사를 사용하므로, 이를 일반화하면 목록과 계수의 성격이 흐려집니다. 본문이 실제로 무엇을 말하는지 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문 충실성 / 성별 표지
