translation:
  language: ko
  text: 솔로몬의 종들의 아들들 곧 소타이의 아들들, 하소페렛의 아들들, 그리고 베루다의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 에스라 본문은 ‘베루다’로 읽으며, 평행 본문인 느헤미야 7:57에는 ‘베리다’가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 집단적 계보 표지를 이루므로, 반복 구조를 살리기 위해 직역에 가까운 ‘아들들’을 사용했습니다.
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들의
  alternatives_korean:
  - 노예들의
  - 섬기는 이들의
  lexicon: HALOT
  rationale: 여기서는 솔로몬에게 속한 특정 집단의 명칭이므로, 본문의 행정적·명단적 성격을 살려 ‘종들’로 옮겼습니다.
- source_word: הַסֹּפֶרֶת
  english_pob_choice: Hassophereth
  chosen_korean: 하소페렛
  alternatives_korean:
  - 하소페레트
  - 소페렛
  lexicon: HALOT
  rationale: 고유명사는 음역으로 옮기되, 어두의 정관사와 결합된 히브리어 형태를 한국어 음가로 최대한 반영했습니다.
- source_word: פְרוּדָא
  english_pob_choice: Peruda
  chosen_korean: 베루다
  alternatives_korean:
  - 페루다
  - 베리다
  lexicon: HALOT
  rationale: 마소라 본문의 철자를 따라 Ezra 본문의 이름을 음역했습니다. 네헤미야의 대응 목록과 철자 차이가 있어 각주로 보존했습니다.
theological_decisions:
- issue: 명단 속 ‘솔로몬의 종들’의 신분 표현
  chosen_reading: 신분적 예속을 강조하는 ‘노예’ 대신, 본문이 전하는 집단 명칭으로서 ‘종들’을 유지했습니다.
  alternative_readings:
  - 노예들
  - 섬긴 사람들
  rationale: 이 절은 해방/예속 논증이 아니라 귀환 공동체 명단이므로, 본문의 관용적 집단명 자체를 보존하는 쪽이 적절합니다.
  doctrine_reference: 역대기·에스라의 포로 귀환 명단 해석
