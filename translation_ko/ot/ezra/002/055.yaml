    rationale: בְּנֵי는 이 명단에서 가문·집단의 구성원을 나타내므로, 한국어의 ‘아들들’은 지나치게 직역적이고 직계 남성 자녀로 오해될 수 있습니다. ‘자손’이 집단적 의미와 명단 문체를 더 잘 전달합니다.
