  source_fidelity: 히브리어의 반복되는 בְּנֵי 구조와 ‘솔로몬의 종들’이라는 집단 명칭은 충실히 반영되었습니다. 다만 한국어에서 족보·명단의 집단 표지로 ‘아들들’을 반복하면 직계 남자 자녀만을 가리키는 듯하고 매우 부자연스러우므로, 문맥상 집단적 의미를 보존하는 ‘자손’이 적절합니다. 각주는 베루다라는 이름의 이문을 설명하므로 해당 이름에 직접 붙여야 합니다.
  naturalness: ‘아들들’의 연쇄보다 ‘자손’의 반복이 현대 한국어 성경식 명단 문체에서 자연스럽고 명료합니다. 접속사 ‘그리고’는 원문의 단순 병렬을 과도하게 해석하지 않도록 쉼표 병렬로 처리할 수 있습니다.
