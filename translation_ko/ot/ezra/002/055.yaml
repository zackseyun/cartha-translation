  - 섬긴 사람들
  rationale: 이 절은 해방/예속 논증이 아니라 귀환 공동체 명단이므로, 본문의 관용적 집단명 자체를 보존하는 쪽이 적절합니다.
  doctrine_reference: 역대기·에스라의 포로 귀환 명단 해석
