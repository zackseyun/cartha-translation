theological_decisions:
- issue: 노예(enslaved) 용어 선택
  chosen_reading: census 맥락에서 עבד/אָמָה를 ‘노예’로 번역해 의존적·소유적 신분을 드러냈습니다.
  alternative_readings:
  - 종
  - 종들 / 남녀 종들
  rationale: 영어 POB가 ‘slaves’를 택한 근거와 동일하게, 단순한 예속 일반보다 법적·사회적 종속 상태가 더 강하게 드러납니다. 역사적 현실을 희석하지 않는 방향이 본문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기/율법 전통의 사회사적 용례; 포로 귀환 공동체의 인구 집계 문맥
- issue: 성별 대구 보존
  chosen_reading: 남녀 노예들, 남녀 노래하는 사람
  alternative_readings:
