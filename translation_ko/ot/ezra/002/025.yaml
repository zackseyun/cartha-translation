lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 주민들
  alternatives_korean:
  - ~의 자손들
  - ~의 사람들
  - ~의 아들들
  lexicon: HALOT
  rationale: 명단 문맥에서 בְּנֵי는 혈연 아들보다 특정 지명에 속한 집단을 가리키므로, 한국어에서는 직역의 어색함을 줄이면서도 집단 소속을 드러내는 ‘주민들’로 옮겼습니다.
- source_word: קִרְיַת עָרִים
  english_pob_choice: Kiriath-arim
  chosen_korean: 가아라임
  alternatives_korean:
  - 기럇아림
  - 가리앗아림
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 원칙이므로, 현대식 표기를 따라 한국어 음가에 맞게 옮겼습니다.
- source_word: כְּפִירָה
  english_pob_choice: Kephirah
  chosen_korean: 게피라
  alternatives_korean:
  - 케피라
  - 게필라
  lexicon: HALOT
  rationale: כְּפִירָה는 고유 지명으로, 영어 전통 표기보다 현대 한국어 음역에 맞추어 옮겼습니다.
- source_word: וּבְאֵרוֹת
  english_pob_choice: and Beeroth
  chosen_korean: 브에롯
  alternatives_korean:
  - 베에롯
  - 브에로트
  lexicon: HALOT
  rationale: 지명은 음역을 유지하되, 접속사 ‘and’는 한국어 문장 구조에서 쉼표와 병렬로 처리해 목록의 대응 관계를 자연스럽게 보이게 했습니다.
theological_decisions:
- issue: 족보/귀환자 명단의 집단 표지 번역
  chosen_reading: ‘~의 주민들’로 풀어, 혈연 계보보다 특정 지역 공동체에 속한 사람들의 명단임을 드러냈습니다.
  alternative_readings:
  - ‘~의 아들들’
  - ‘~의 자손들’
  rationale: 에스라 2장의 문맥은 돌아온 공동체의 등록 명단이므로, 히브리어 형식을 너무 경직되게 유지하기보다 청자가 실제 의미를 즉시 이해하도록 집단 소속을 분명히 하는 것이 적절합니다.
  doctrine_reference: Ezra 2:1-70 귀환 공동체 명단
