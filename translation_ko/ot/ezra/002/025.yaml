  - ‘~의 자손들’
  rationale: 에스라 2장의 문맥은 돌아온 공동체의 등록 명단이므로, 히브리어 형식을 너무 경직되게 유지하기보다 청자가 실제 의미를 즉시 이해하도록 집단 소속을 분명히 하는 것이 적절합니다.
  doctrine_reference: Ezra 2:1-70 귀환 공동체 명단
