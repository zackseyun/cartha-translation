  - 아즈마웻
  lexicon: 고유명사 표기
  rationale: 고유명사는 현대 외래어 표기 관례에 맞춰 음역했고, 통용 가능한 표기들 가운데 한국어 독음이 가장 자연스러운 형태를 택했습니다.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  english_pob_choice: forty-two
  chosen_korean: 마흔두 명
  alternatives_korean:
  - 마흔둘
  - 사십이 명
  lexicon: HALOT
  rationale: 히브리어 수사는 현대 한국어에서 자연스러운 ‘마흔두’로 옮기되, 명단 항목임을 분명히 하기 위해 단위 표지 ‘명’을 붙였습니다.
theological_decisions:
- issue: בְּנֵי의 범위
  chosen_reading: 직계 아들만이 아니라 한 가문/씨족 전체를 가리키는 명단 표현으로 읽었습니다.
  alternative_readings:
  - 아버지의 실제 아들들로만 제한하는 읽기
  - ‘가문’으로만 번역해 친자 관계를 완전히 약화하는 읽기
  rationale: 영어 POB 주석이 밝히듯 이 표현은 족보·귀환자 명단에서 더 넓은 혈통 집단을 뜻할 수 있으므로, 한국어에서도 그 계보적 범위를 유지하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 족보/명단 해석상의 문맥적 범위
