lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 자손은
  alternatives_korean:
  - 아들들은
  - 후손들은
  - 가문은
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 직계 아들보다 더 넓은 가문/집단을 가리킬 수 있으므로, 영어 POB의 ‘sons of’가 담은 계보적 범위를 한국어로는 ‘자손’으로 자연스럽게 반영했습니다.
- source_word: עַזְמָוֶת
  english_pob_choice: Azmaveth
  chosen_korean: 아스마웻
  alternatives_korean:
