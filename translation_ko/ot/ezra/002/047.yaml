lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 자녀들
  lexicon: HALOT
  rationale: 족보·명부 맥락의 בְּנֵי는 혈통과 소속 집단을 가리키므로, 한국어에서는 성별을 과도하게 드러내지 않으면서도 계보 의미를 살리는 ‘자손’이 가장 자연스럽습니다.
- source_word: גִדֵּל
  english_pob_choice: Giddel
  chosen_korean: 기델
  alternatives_korean:
  - 기덜
  - 기델
  lexicon: HALOT
  rationale: 고유명사이므로 음역했습니다. 영어 POB의 Giddel을 표준 한국어 음역에 맞춰 옮겼습니다.
- source_word: גַחַר
  english_pob_choice: Gahar
  chosen_korean: 가할
  alternatives_korean:
  - 가하르
  - 가할
  lexicon: HALOT
  rationale: 고유명사이므로 음역했습니다. 끝의 자음값을 한국어에서 과도하게 보강하지 않고 간명하게 옮겼습니다.
- source_word: רְאָיָה
  english_pob_choice: Reaiah / Raiah
  chosen_korean: 르아야
  alternatives_korean:
  - 레아야
  - 라아야
  lexicon: HALOT
  rationale: 영어 POB가 Reaiah와 Raiah의 변이를 보존하므로, 히브리어 철자에 더 직접적인 음역을 채택하되 한국어에서 읽기 쉬운 형태로 옮겼습니다.
theological_decisions:
- issue: 명부형 족보 표현의 성별 표지
  chosen_reading: ‘sons of’를 직역하기보다 족속·가문을 드러내는 ‘자손’으로 옮겼습니다.
  alternative_readings:
  - 아들들
  - 자녀들
  rationale: 이 절은 개인을 말하기보다 귀환 공동체의 가문 목록을 제시하므로, 한국어 독자가 혈통적 집단을 이해하도록 하는 번역이 원문 기능을 더 잘 살립니다.
  doctrine_reference: 족보/명부 본문 해석
