lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  lexicon: HALOT
  rationale: 족보·명부 문맥에서 בְּנֵי는 직계 아들만이 아니라 가문/씨족 단위를 가리킬 수 있으므로, 한국어에서는 의미를 살리되 남성 직계로만 좁히지 않는 ‘자손들’로 옮겼습니다.
