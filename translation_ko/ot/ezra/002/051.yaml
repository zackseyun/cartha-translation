    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  lexicon: HALOT
  rationale: 족보·명부 문맥에서 בְּנֵי는 직계 아들만이 아니라 가문/씨족 단위를 가리킬 수 있으므로, 한국어에서는 의미를 살리되 남성 직계로만 좁히지 않는 ‘자손들’로 옮겼습니다.
- source_word: בַקְבּוּק
  english_pob_choice: Bakbuk
  chosen_korean: 바구북
  alternatives_korean:
  - 박북
  - 바크북
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 히브리어 자음값과 현대 한국어 음역 관례를 고려해 ‘바구북’으로 옮겼습니다.
- source_word: חֲקוּפָא
  english_pob_choice: Hakupha
  chosen_korean: 하구바
  alternatives_korean:
  - 하쿠파
  - 하쿠바
  lexicon: HALOT
  rationale: 고유명사는 음역이 원칙이며, 히브리어 어형을 자연스러운 한국어 표기로 옮겨 ‘하구바’로 처리했습니다.
- source_word: חַרְחוּר
  english_pob_choice: Harhur
  chosen_korean: 하르훌
  alternatives_korean:
  - 하르후르
  - 하르훌르
  lexicon: HALOT
  rationale: 고유명사 음역을 따르되 한국어에서 발음하기 쉬운 형태로 ‘하르훌’을 사용했습니다.
theological_decisions:
- issue: 족보 공식의 의미 범위
  chosen_reading: 직계 아들로만 제한하지 않고 씨족·가문 구성원을 포함하는 명부 표현으로 읽었습니다.
  alternative_readings:
  - 각 단어를 문자적으로 ‘아들들’로만 옮김
  rationale: 에스라의 귀환자 명단에서 בְּנֵי 반복은 혈통 집단 표지로 기능하므로, 본문 의미를 오해 없이 전달하는 번역이 필요합니다.
  doctrine_reference: 본문 장르/역사적 용법
