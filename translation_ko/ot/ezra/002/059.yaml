review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존했지만, ‘이스라엘 출신’은 혈통·소속에 관한 히브리어의 불확실성을 지리적 출신으로 좁힐 수 있습니다. 또한 ‘밝혀서 … 말할 수 없었습니다’는 לְהַגִּיד의 목적과 내용절의 관계를 어색하게 분리합니다.
  naturalness: 현 문장은 ‘조상의 집과 자손을 밝혀서 … 말할 수 없었습니다’라는 연결이 현대 한국어에서 부자연스럽습니다. ‘…인지 밝힐 수 없었습니다’로 한 문장 구조를 정리하는 것이 자연스럽고 행정·족보 문맥에도 맞습니다.
  terminology: בֵּית אֲבוֹתָם는 단순한 건물이 아니라 부계 조상 집안/가문이라는 기술적 족보 표현입니다. 본문에는 ‘조상의 집안’을 유지하고, 각주에서 ‘부계 가문’이라는 대안을 제시합니다. 고유명사는 히브리어 자음군과 한국어 성경 표기 관행을 고려하여 ‘앗단’으로 바로잡습니다.
  issues:
