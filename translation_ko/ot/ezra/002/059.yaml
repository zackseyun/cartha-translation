  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
  footnotes:
  - marker: a
    text: Or 'their ancestral house and their descendants.' The Hebrew expression refers to documented paternal lineage.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이들은 텔-멜라흐, 텔-하르사, 그룹, 앗단, 임멜에서 올라온 사람들이었습니다. 그러나 그들은 자기 조상의 집안과 자손이 이스라엘에 속하는지 밝힐 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 부계 가문과 후손’. 히브리어 표현은 문서로 확인되는 부계 계보를 가리킵니다.
    reason: lexical_alternative
