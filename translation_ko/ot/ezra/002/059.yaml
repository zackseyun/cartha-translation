    issue: ‘이스라엘 출신인지’라는 표현
    rationale: מִיִּשְׂרָאֵל은 이 문맥에서 이스라엘 혈통 또는 이스라엘에 속함에 관한 문제입니다. ‘출신’은 현대 한국어에서 출생지·지역 출신으로 이해될 여지가 있습니다.
  - severity: medium
    issue: ‘밝혀서, 자신들이 … 말할 수 없었습니다’의 구문
    rationale: 히브리어는 ‘그들의 조상 집안과 자손이 이스라엘에 속하는지 밝힐 수 없었다’는 하나의 진술입니다. 초안은 ‘밝히다’와 ‘말하다’를 중복시켜 목적 관계가 불명확해집니다.
  - severity: low
    issue: 각주가 본문과 동일한 문구를 ‘또는’으로 제시함
    rationale: 각주는 실제 lexical alternative을 제시해야 합니다. ‘부계 가문과 후손’은 기술적 족보 의미를 보충하는 유효한 대안입니다.
  - severity: low
