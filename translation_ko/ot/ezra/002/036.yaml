  - 예수아 집안에 속한 자들
  lexicon: HALOT
  rationale: לְבֵית은 단순한 ‘~의 집’보다 소속·계열을 나타내므로, 족보적 의미가 드러나도록 ‘집에 속한 자들’로 풀었습니다.
- source_word: יֵשׁוּעַ
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  lexicon: 개역계열/현대 음역 관행
  rationale: 포로기 이후 인명으로서의 표준 음역을 따랐고, ‘여호수아’는 관련 형태이지만 여기의 철자와 문맥에는 덜 정확합니다.
