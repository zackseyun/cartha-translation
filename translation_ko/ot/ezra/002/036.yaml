  - marker: b
    text: Jeshua is the postexilic personal name also related to the name Joshua.
    reason: cultural_note
translation:
  language: ko
  text: '제사장들: 예다야의 아들들, 예수아의 집에 속한 자들, 973명입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예수아’는 포로기 이후 인명으로, 관련 이름 ‘여호수아’와 어원이 이어집니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: The priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 제사장들의 무리
  - 제사장 계열
  lexicon: HALOT
  rationale: 정관사 붙은 복수 명사로 제사장 집단 전체를 가리키므로, 한국어에서는 가장 직접적인 표준어인 ‘제사장들’로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 후손들
  - 자손들
  lexicon: HALOT
  rationale: 족보·명부 문맥의 표준적 표현을 살려 문자적으로 ‘아들들’을 유지하되, 한국어 문장 안에서는 관계를 분명히 하기 위해 앞에 소속 구문을 붙였습니다.
- source_word: לְבֵית יֵשׁוּעַ
  english_pob_choice: of the house of Jeshua
  chosen_korean: 예수아의 집에 속한 자들
  alternatives_korean:
