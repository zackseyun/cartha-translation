lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보 목록에서 בְּנֵי는 특정 가문이나 씨족을 가리키는 관용적 연결이므로, 직역에 가깝게 ‘~의 아들들’로 옮겨 원문의 계보 형식을 보존했습니다.
- source_word: בַרְק֥וֹס
  english_pob_choice: Barkos
  chosen_korean: 바르코스
  alternatives_korean:
  - 바르콰스
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하므로 POB의 영어 음역에 맞춰 ‘바르코스’로 옮겼습니다.
- source_word: סִֽיסְרָא
  english_pob_choice: Sisera
  chosen_korean: 시스라
  alternatives_korean:
  - 시세라
  lexicon: HALOT
  rationale: 이미 널리 알려진 성경 인명 표기를 따르되, 같은 이름이 여기서는 역사적 인물 호칭이 아니라 족보상의 조상명으로 기능함을 유지했습니다.
- source_word: תָֽמַח
  english_pob_choice: Temah
  chosen_korean: 테마
  alternatives_korean:
  - 타마
  lexicon: HALOT
  rationale: 히브리어 모음과 POB의 영어 표기를 반영해 ‘테마’로 음역했고, 영어 전통의 변이 가능성은 본문이 아니라 주석으로 처리하는 것이 적절합니다.
theological_decisions:
- issue: 족보/명부에서 ‘sons of’ 표현의 범위
  chosen_reading: 가문·씨족을 가리키는 계보 공식으로 이해하여 ‘아들들’로 직역했습니다.
  alternative_readings:
