  - 예수아와 깟미엘 집안 사람들
  lexicon: HALOT
  rationale: 족보·인구조사 문맥의 בְּנֵי는 문자적 ‘아들들’보다 집안/후손 관계를 드러내는 말이 더 정확하여 ‘후손들’로 옮겼습니다.
- source_word: לִבְנֵי הוֹדַוְיָה
