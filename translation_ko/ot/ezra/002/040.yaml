  terminology: ‘레위 사람들’은 가능하나 ‘레위인들’이 현대 한국어 성경 문맥에서 더 관용적입니다. יֵשׁוּעַ는 ‘예수아’, קַדְמִיאֵל은 ‘갓미엘’, הוֹדַוְיָה는 ‘호다위야’로 바로잡았습니다.
