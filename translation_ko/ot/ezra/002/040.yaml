  source_fidelity: 원문의 명단 구조는 레위인 범주 아래 ‘예수아와 갓미엘의 자손’을 ‘호다위야의 자손’과 연관 지어 제시합니다. 초안은 ‘예수아와 그 손자들’이라고 하여 원문에 없는 손자 관계를 도입하고, 호다위야와의 계통 관계도 뒤바꾸었습니다.
