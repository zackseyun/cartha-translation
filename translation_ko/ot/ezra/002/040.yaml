    text: 히브리어 본문에는 ‘호다위야’라고 되어 있으나, 느헤미야 7:43의 평행 본문에는 ‘호데와’라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הַלוִיִּם
  english_pob_choice: The Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 명단의 범주 표지이므로 집단명으로 자연스럽게 옮기되, ‘레위 사람들’로 본문 흐름을 살렸습니다.
- source_word: בְּנֵי יֵשׁוּעַ וְקַדְמִיאֵל
  english_pob_choice: the sons of Jeshua and Kadmiel
  chosen_korean: 예수아와 깟미엘의 후손들
