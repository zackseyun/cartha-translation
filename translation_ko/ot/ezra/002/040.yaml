translation:
  language: ko
  text: 레위 사람들 곧 예수아와 그 손자들 가운데 속한 깟미엘과 호다뱌의 아들들은 모두 일흔넷이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘호다뱌’로 읽히며, 느헤미야 7:43의 평행 본문에는 ‘호데바’가 나옵니다.
    reason: textual_variant
lexical_decisions:
- source_word: הַלוִיִּם
  english_pob_choice: The Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 명단의 범주 표지이므로 집단명으로 자연스럽게 옮기되, ‘레위 사람들’로 본문 흐름을 살렸습니다.
- source_word: בְּנֵי יֵשׁוּעַ וְקַדְמִיאֵל
  english_pob_choice: the sons of Jeshua and Kadmiel
  chosen_korean: 예수아와 깟미엘의 후손들
