  - 예수아와 깟미엘 집안 사람들
  lexicon: HALOT
  rationale: 족보·인구조사 문맥의 בְּנֵי는 문자적 ‘아들들’보다 집안/후손 관계를 드러내는 말이 더 정확하여 ‘후손들’로 옮겼습니다.
- source_word: לִבְנֵי הוֹדַוְיָה
  english_pob_choice: of the sons of Hodaviah
  chosen_korean: 호다뱌의 아들들 가운데 속한
  alternatives_korean:
  - 호다뱌의 자손들 가운데 속한
  - 호다뱌 집안에 속한
  lexicon: HALOT
  rationale: לִבְנֵי는 앞의 예수아와 깟미엘이 호다뱌의 계열에 속함을 표시하므로, 관계를 분명히 하는 방향으로 ‘~가운데 속한’ 구조를 택했습니다.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  english_pob_choice: seventy-four
  chosen_korean: 모두 일흔넷
  alternatives_korean:
  - 일흔넷
  - 일흔네 명
  lexicon: HALOT
  rationale: 히브리어 수사는 한국어에서도 자연스럽게 수량을 직접 제시하는 방식이 적절하여 ‘모두 일흔넷’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 명단 표지의 번역 방식
  chosen_reading: 본 절의 הַלוִיִּם은 신학적 서술이 아니라 인구조사 범주 표지로 보고, 장식적 표현 없이 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘레위인들에 관하여’와 같은 설명적 도입
  - ‘레위 사람들’ 대신 더 관용적인 ‘레위인들’
  rationale: 이 절은 계수 목록의 항목 제목이므로, 본문의 기능을 드러내는 간결한 표지가 가장 적절합니다.
  doctrine_reference: 민수기 1장 계수 목록과 에스라 2장의 귀환 공동체 명단
