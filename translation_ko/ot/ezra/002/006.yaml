  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: ko
  text: 바핫모압 자손들, 예수아와 요압의 자손들, 2,812명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 בְּנֵי는 혈통 집단을 가리키므로, 현대 한국어에서는 성별을 좁히지 않으면서도 집단성을 살리는 ‘자손들’이 자연스럽습니다.
- source_word: פַחַת מוֹאָב
  english_pob_choice: Pahath-moab
  chosen_korean: 바핫모압
  alternatives_korean:
  - 파핫모압
  - 바핫-모압
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하며, 한국어 외래어 표기 관행에 맞춰 붙여 적었습니다.
- source_word: לִבְנֵי
  english_pob_choice: of the sons of
  chosen_korean: —의 자손들
  alternatives_korean:
  - 속한 자손들
  - 곧 자손들
  lexicon: HALOT
  rationale: 앞의 집단명에 속하는 하위 계열을 표시하는 관계를 살리기 위해, 소속 관계를 드러내는 구조로 옮겼습니다.
- source_word: יֵשׁוּעַ יוֹאָב
  english_pob_choice: Jeshua and Joab
  chosen_korean: 예수아와 요압
  alternatives_korean:
  - 여호수아와 요압
  - 예슈아와 요압
  lexicon: HALOT
  rationale: 에스라-느헤미야의 포로기 이후 인명은 통상 ‘예수아’로 음역하며, יוֹאָב은 널리 쓰이는 ‘요압’이 적절합니다.
theological_decisions:
- issue: 인명과 집단 명칭의 계보적 전달
  chosen_reading: 이 절은 개인 이름을 나열하는 족보/명단 형식이므로, 의미를 풀이하기보다 음역과 집단 표지를 유지했습니다.
  alternative_readings:
  - 의미 중심으로 ‘모압의 바핫 가문 자손들’처럼 풀어쓰기
  - 전통 교회식으로 성별 중심의 ‘아들들’로 번역
  rationale: 본문의 목적은 신학적 해설보다 귀환 공동체의 구성원을 정확히 식별하는 데 있으므로, 명단의 형식을 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 성경 본문 장르 보존 원칙
