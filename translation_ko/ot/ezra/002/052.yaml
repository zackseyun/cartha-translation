base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/052.yaml
  text: the sons of Bazluth[a], the sons of Mehida, the sons of Harsha—
  footnotes:
  - marker: a
    text: Or 'descendants of' for each occurrence of 'sons of'; the Hebrew list formula בְּנֵי often denotes a family or clan line, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 바슬룻의 자손들, 메히다의 자손들, 하르사의 자손들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּנֵי는 문자적으로 ‘아들들’이지만, 각 항목에서 ‘~의 후손들’로도 옮길 수 있습니다. 이 말은 직계 아들들만이 아니라 한 가문이나 씨족의 계통을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  - 가문들
  lexicon: HALOT
  rationale: 이 족보·귀환자 목록에서 בְּנֵי는 직계 아들보다 집단적 혈통표현으로 기능하므로, 한국어에서는 자연스럽고 포괄적인 ‘자손들’로 옮겨 원문의 계보 구조를 살렸습니다.
- source_word: בַצְל֥וּת
  english_pob_choice: Bazluth
  chosen_korean: 바슬루스
  alternatives_korean:
  - 바즐룻
  - 바즐루스
  lexicon: 고유명사 음역
  rationale: 고유명사는 의미 번역보다 음역이 적절하므로, 히브리어 자음과 기존 영어 표기를 반영해 ‘바슬루스’로 옮겼습니다.
- source_word: מְחִידָ֖א
  english_pob_choice: Mehida
  chosen_korean: 메히다
  alternatives_korean:
  - 메치다
  - 메이다
  lexicon: 고유명사 음역
  rationale: 이름의 뜻을 추정해 풀지 않고, 기존 영어 음역을 따라 읽기 쉬운 형태로 음역했습니다.
- source_word: חַרְשָֽׁא
  english_pob_choice: Harsha
  chosen_korean: 하르사
  alternatives_korean:
  - 하르샤
  - 하르사아
  lexicon: 고유명사 음역
  rationale: 끝의 어말 성문음을 한국어 본문에서 별도 표기하지 않고, 통용 가능한 음역 ‘하르사’를 사용했습니다.
theological_decisions:
- issue: 족보/목록에서 בְּנֵי의 의미 범위
  chosen_reading: 문맥상 가족·씨족을 가리키는 집단 표현으로 읽어 ‘자손들’로 번역했습니다.
  alternative_readings:
  - 직역에 가까운 ‘아들들’
  - ‘후손들’
  rationale: 이 구절은 명단 형식이므로 성별·직계에 국한된 뜻보다 공동체적 혈통 표시가 더 정확합니다. ‘자손들’은 원문이 의도하는 목록 기능을 보존합니다.
  doctrine_reference: 족보/귀환자 명단의 문맥 해석
