  yaml_path: translation/ot/ezra/002/052.yaml
  text: the sons of Bazluth[a], the sons of Mehida, the sons of Harsha—
  footnotes:
  - marker: a
    text: Or 'descendants of' for each occurrence of 'sons of'; the Hebrew list formula בְּנֵי often denotes a family or clan line, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 바슬루스의 자손들, 메히다의 자손들, 하르사의 자손들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘sons of’는 각 항목마다 ‘descendants of’로도 옮길 수 있으며, 히브리어 בְּנֵי는 즉각적 아들만이 아니라 가족·씨족 계통을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  - 가문들
  lexicon: HALOT
  rationale: 이 족보·귀환자 목록에서 בְּנֵי는 직계 아들보다 집단적 혈통표현으로 기능하므로, 한국어에서는 자연스럽고 포괄적인 ‘자손들’로 옮겨 원문의 계보 구조를 살렸습니다.
- source_word: בַצְל֥וּת
