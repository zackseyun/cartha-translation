  terminology: בְּנֵי는 이 귀환자 명단에서 가문 구성원을 가리키므로 ‘자손’이 적절합니다. בֵצָי는 영어식 ‘베자이’보다 한국어 성서 음역 관례 및 원어 자음값에 맞춘 ‘베새’로 고쳐야 합니다.
