  source_fidelity: 히브리어는 베새(Bēṣay)라는 가문/집단의 ‘자손들’과 그 수 ‘323’을 제시합니다. ‘자손’ 및 ‘삼백이십삼 명’은 목록 문맥과 수량을 충실히 전달합니다. 다만 고유명사 음역은 히브리어 צ를 반영하고 통용 한국어 성서 표기와도 일치하는 ‘베새’가 적절합니다.
