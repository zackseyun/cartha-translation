source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
  footnotes:
  - marker: a
    text: Or, more idiomatically, “and took their name.” The Hebrew literally says “and was called by their name.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 자손들 가운데서는 훠바야의 자손들, 학고스의 자손들, 바르질래의 자손들이 있었습니다. 이 바르질래는 길르앗 사람 바르질래의 딸들 가운데서 아내를 맞아들였고, 그들의 이름으로 불렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 이름으로 불렸다’는 히브리어의 문자적 표현입니다. 더 자연스럽게는 ‘그들의 이름을 따랐다’ 또는 ‘그들의 이름을 따서 불렸다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  english_pob_choice: And from among the sons of the priests
  chosen_korean: 제사장 자손들 가운데서는
  alternatives_korean:
  - 제사장들 가운데서
  - 제사장들의 자손들 가운데서
  lexicon: HALOT
  rationale: מן의 부분적 용법을 살려 ‘가운데서는’으로 풀었고, בְּנֵי는 족보 문맥을 유지하기 위해 ‘자손들’로 옮겼습니다.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  english_pob_choice: the sons of Hobaiah, the sons of Hakkoz, the sons of Barzillai
  chosen_korean: 훠바야의 자손들, 학고스의 자손들, 바르질래의 자손들
  alternatives_korean:
  - 호바야의 자손들, 학고스의 자손들, 바르질래의 자손들
  - 훠바야 가문, 학고스 가문, 바르질래 가문
  lexicon: HALOT
  rationale: 열거 구조를 따라 반복을 살렸고, 고유명사는 현대 음역으로 통일했습니다.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  english_pob_choice: who had taken a wife from the daughters of
  chosen_korean: 이 바르질래는 길르앗 사람 바르질래의 딸들 가운데서 아내를 맞아들였고
  alternatives_korean:
  - 이 바르질래는 ... 딸들 가운데서 아내를 취했고
  - '... 딸들 중 한 여자와 결혼했고'
  lexicon: HALOT
  rationale: לָקַח אִשָּׁה의 관용구를 ‘아내를 맞아들이다’로 자연스럽게 살리면서도, מן과 복수 ‘딸들’의 관계를 유지했습니다.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  english_pob_choice: and was called by their name
  chosen_korean: 그들의 이름으로 불렸습니다
  alternatives_korean:
  - 그들 이름을 따라 불렸습니다
  - 그들의 이름을 따서 불렸습니다
  lexicon: HALOT
  rationale: 직역형 ‘그들의 이름으로 불렸다’는 히브리어의 수동 표현을 가장 가깝게 반영하며, 한국어에서도 자연스럽습니다.
