base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
  footnotes:
  - marker: a
    text: Or, more idiomatically, “and took their name.” The Hebrew literally says “and was called by their name.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 자손들 가운데서는 호바야의 자손들, 학고스의 자손들, 바르질래의 자손들이 있었습니다. 이 바르질래는 길르앗 사람 바르질래의 딸들 가운데서 아내를 맞아들였고, 그들의 이름을 따라 불렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그들의 이름으로 불렸다’입니다. ‘그들의 이름을 따라 불렸다’는 이를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
