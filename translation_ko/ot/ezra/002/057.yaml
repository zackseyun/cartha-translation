  lexicon: HALOT
  rationale: 영문 POB가 복합 인명으로 유지한 점을 따라 음역을 보존했습니다. ‘하츠바임’은 정관사와 결합한 מקור 형태를 살려 음역했고, 소유격으로 풀지 않았습니다.
- source_word: אָמִי
