  rationale: 이 이름은 한국어 성경 전승에서 보통 ‘스바냐’로 알려져 있어, 독자가 즉시 인지할 수 있는 확립형을 따랐습니다.
- source_word: פֹּכֶרֶת הַצְּבָיִים
