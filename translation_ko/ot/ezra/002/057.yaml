    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: ~의 자손들
  alternatives_korean:
  - ~의 아들들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 씨족/가문 집단을 가리키므로, 형식은 유지하되 한국어에서는 성별을 좁히는 ‘아들들’보다 포괄적인 ‘자손들’이 자연스럽습니다.
