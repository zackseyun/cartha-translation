id: EZR.2.68
reference: Ezra 2:68
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
  footnotes:
  - marker: a
    text: Or, 'family heads.' The Hebrew literally refers to 'the heads of the fathers’ houses,' an Israelite clan-based social unit.
    reason: lexical_alternative
  - marker: b
    text: Or, 'offered willingly.' The verb emphasizes voluntary giving.
    reason: lexical_alternative
  - marker: c
    text: Or, 'to establish it in its place' or 'on its site.' The Hebrew may refer either to the temple’s foundation or to its fixed location.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 가문의 우두머리들 가운데 몇 사람은[a] 예루살렘에 있는 야훼의 집에 이르러, 하나님의 집을 제자리에 세우기 위하여[c] 자원하여 예물을 드렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지 집안의 우두머리들’. 히브리어는 문자적으로 ‘아버지들의 우두머리들’이라고 하며, 이스라엘의 친족·가문 단위의 지도자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자발적으로 헌납했습니다’. 이 동사는 자원하여 드리는 행위를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 기초 위에’ 또는 ‘그 터에’. 히브리어는 성전의 기초를 가리킬 수도 있고, 정해진 자리나 터를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מֵ/רָאשֵׁי הָאָבוֹת
  english_pob_choice: And some of the heads of the fathers’ houses
  chosen_korean: 아버지들의 집들의 우두머리들 가운데 몇 사람은
  alternatives_korean:
  - 몇몇 가문의 우두머리들은
  - 아버지 집안의 지도자들 가운데 몇 사람은
  lexicon: HALOT
  rationale: מן의 분량적 의미를 살려 ‘가운데 몇 사람’으로 옮기고, רָאשֵׁי הָאָבוֹת의 족장/가문 단위를 ‘아버지들의 집들’로 최대한 구조적으로 반영했습니다.
- source_word: בְּבוֹאָם
  english_pob_choice: when they came
  chosen_korean: 올 때
  alternatives_korean:
  - 그들이 왔을 때
  - 도착했을 때
  lexicon: HALOT
  rationale: 전치사 ב가 붙은 부정사구의 시간적 의미를 자연스러운 현대 한국어로 처리했습니다.
- source_word: הִתְנַדְּבוּ
  english_pob_choice: gave freewill offerings
  chosen_korean: 자원하여 드렸습니다
  alternatives_korean:
  - 자발적으로 바쳤습니다
  - 기쁜 마음으로 예물을 드렸습니다
  lexicon: HALOT
  rationale: 히트파엘 נדב의 ‘자원함/자발성’을 살리면서, 문맥상 성전 관련 헌납이므로 ‘드리다’로 옮겼습니다.
- source_word: לְבֵית הָאֱלֹהִים
  english_pob_choice: for the house of God
  chosen_korean: 하나님의 집을 위해
  alternatives_korean:
  - 하나님의 성전을 위해
  - 하나님의 집을 위하여
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 앞절의 ‘야훼의 집’과 어휘 대응을 보존했습니다.
- source_word: לְהַעֲמִידוֹ עַל מְכוֹנֹו
  english_pob_choice: to set it up on its foundation
  chosen_korean: 그것을 제자리에 세우기 위함이었습니다
  alternatives_korean:
  - 그 기초 위에 세우기 위함이었습니다
  - 그 자리에 굳게 세우기 위함이었습니다
  lexicon: HALOT
  rationale: מָכוֹן의 ‘기초/정착한 자리’ 사이의 긴장을 살리기 위해, 확정적 의미를 과도하게 좁히지 않는 ‘제자리에 세우다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값에 따라 신명기를 직접 가리키는 고유명으로 ‘야훼’를 사용해, 전통적 대체어가 지우는 명칭성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: הָאָבוֹת의 친족 구조 보존
  chosen_reading: 아버지들의 집들
  alternative_readings:
  - 가문들
  - 가족들
  rationale: 이스라엘의 족장-친족 단위를 평탄화하지 않고 드러내기 위해 직역적 구조를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 Gender-accurate over gender-neutral
