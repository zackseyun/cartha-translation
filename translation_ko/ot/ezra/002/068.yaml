revisions:
- from: 그리고 아버지들의 집들의 우두머리들 가운데 몇 사람은, 예루살렘에 있는 야훼의 집에 올 때, 하나님의 집을 위해 자원하여 드렸습니다[a][b]. 그것을 제자리에 세우기 위함이었습니다[c].
  to: 그리고 가문의 우두머리들 가운데 몇 사람은[a] 예루살렘에 있는 야훼의 집에 이르러, 하나님의 집을 제자리에 세우기 위하여[c] 자원하여 예물을 드렸습니다[b].
  rationale: 가문 지도자라는 히브리어 관용구를 자연스러운 한국어로 옮기되 각주에서 직역과 사회적 배경을 보완했습니다. 자원하여 드린 행위와 성전을 세우는 목적을 한 문장 안에 연결했으며, מָכוֹן의 의미상 모호성은 본문 ‘제자리’와 각주 대안으로 보존했습니다. 각주 표지도 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:54Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 분량 표현(‘…가운데 몇 사람’), 시간절, 자원하여 드림, 그리고 성전을 세우는 목적을 대체로 충실히 반영했습니다. 다만 ‘아버지들의 집들의 우두머리들’은 히브리어 관용구를 기계적으로 중첩해 옮긴 표현이며, 마지막 목적절을 독립 문장으로 처리한 것은 원문의 연결을 약화합니다.
  naturalness: ‘가문의 우두머리들’, ‘이르러’, ‘자원하여 예물을 드렸습니다’, ‘제자리에 세우기 위하여’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘야훼’는 제시된 프로젝트 방침과 일치합니다. בֵּית הָאֱלֹהִים는 본문에서 ‘하나님의 집’으로 유지하여 앞의 ‘야훼의 집’과의 어휘 대응을 보존했습니다. מְכוֹנוֹ의 기초/정해진 자리라는 의미 범위는 ‘제자리’와 각주로 보존했습니다.
