    rationale: רָאשֵׁי הָאָבוֹת는 문맥상 친족·가문의 지도자들을 뜻하는 관용적 사회 구조 표현입니다. ‘가문의 우두머리들’로 본문을 자연스럽게 옮기고, 직역적 표현은 각주에서 설명하는 것이 적절합니다.
