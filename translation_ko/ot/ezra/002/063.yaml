  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד כֹּהֵ֖ן לְ/אוּרִ֥ים וּ/לְ/תֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the Tirshatha,' a Persian administrative title.
    reason: lexical_alternative
  - marker: b
    text: That is, the priestly portions of the offerings regarded as especially holy; not the inner sanctuary ('the Holy of Holies').
    reason: cultural_note
  - marker: c
    text: Urim and Thummim were sacred means of priestly inquiry; the exact form and procedure are uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 총독이 그들에게 말하기를, 제사장이 우림과 둠밈을 가지고 일어날 때까지는 가장 거룩한 것들에서 먹지 말라고 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘티르솨타’라는 페르시아 행정 칭호입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 제사장 몫의 제물 가운데 특히 거룩한 몫을 가리키며, 지성소를 뜻하는 말은 아닙니다.
    reason: cultural_note
  - marker: c
    text: 우림과 둠밈은 제사장이 하나님의 뜻을 묻는 데 쓰던 거룩한 수단이며, 정확한 형식과 절차는 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 티르솨타
  - 지방 총독
  lexicon: HALOT
  rationale: 본문의 פּارس 행정 칭호를 한국어 독자에게 분명하게 전달하기 위해 기능어로 옮겼습니다. 영어 POB의 ‘the governor’와 같은 방향이지만, 한국어에서는 ‘총독’이 행정 수장이라는 의미를 가장 간결하게 드러냅니다.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  english_pob_choice: that they should not eat
  chosen_korean: 먹지 말라고
  alternatives_korean:
  - 먹어서는 안 된다고
  - 먹지 못하도록
  lexicon: HALOT
  rationale: 간접 명령의 힘을 살리되 한국어 행정·서술 문맥에 자연스럽게 맞도록 ‘먹지 말라고’로 옮겼습니다.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: from the most holy things
  chosen_korean: 가장 거룩한 것들에서
  alternatives_korean:
  - 가장 거룩한 제물들에서
  - 지극히 거룩한 것들에서
  - 지성소에서
  lexicon: HALOT
  rationale: 문맥상 ‘지성소’라는 공간이 아니라 제사장 몫의 거룩한 먹을거리를 가리키므로, 영어 POB처럼 오해를 피하면서 superlative force를 살려 ‘가장 거룩한 것들’로 옮겼습니다.
- source_word: לְאוּרִים וּלְתֻמִּים
  english_pob_choice: with Urim and Thummim
  chosen_korean: 우림과 둠밈을 가지고
  alternatives_korean:
  - 우림과 둠밈으로
  - 우림과 둠밈과 함께
  - 우림과 둠밈으로 말미암아
  lexicon: HALOT
  rationale: 우림과 둠밈은 기술적 제의 용어이므로 음역을 유지했고, לְ의 도구·수단 뉘앙스를 한국어에서 가장 자연스럽게 드러내기 위해 ‘가지고’로 옮겼습니다.
theological_decisions:
- issue: ‘가장 거룩한 것들’의 의미
  chosen_reading: 이 표현은 지성소가 아니라 제사장 몫의 가장 거룩한 제물/음식을 가리킵니다.
  alternative_readings:
  - 지성소라는 장소를 가리킨다
  - 일반적인 거룩한 음식만을 가리킨다
  rationale: 본문은 ‘먹지 말라’는 금지와 연결되므로, 공간 접근이 아니라 식용 가능한 거룩한 제의 몫에 관한 규정으로 읽어야 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘우림과 둠밈’의 처리
  chosen_reading: 의미를 풀어 번역하지 않고 음역을 유지했습니다.
  alternative_readings:
  - ‘빛과 완전함’으로 의미 번역한다
  rationale: 정확한 제의 기능과 형식이 역사적으로 불확실하므로, 해석을 과도하게 고정하지 않도록 기술어를 보존했습니다.
  doctrine_reference: Translation philosophy §3
