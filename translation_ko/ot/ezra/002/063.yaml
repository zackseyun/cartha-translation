revisions:
- from: 그리고 총독이 그들에게 말하기를, 제사장이 우림과 둠밈을 가지고 일어날 때까지는 가장 거룩한 것들에서 먹지 말라고 하였습니다.[a][b][c]
  to: 총독은 그들에게, 우림과 둠밈을 지닌 제사장이 일어날 때까지 지극히 거룩한 제물을 먹지 말라고 말하였습니다.[a][b][c]
  rationale: 수정은 원문의 의미를 바꾸지 않고, 제의 음식에 관한 금지라는 문맥을 자연스러운 한국어 목적어 구문으로 드러냅니다. ‘일어날 때까지’는 עַד עֲמֹד의 미래 지향적 ‘일어나다/나타나다’의 여지를 보존하며, 우림과 둠밈은 불확실한 기술적 제의 용어이므로 음역을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:37Z'
review_pass:
  verdict: revise
  source_fidelity: 총독(הַתִּרְשָׁתָא), 금지의 간접 명령, 우림과 둠밈의 음역은 원문과 영어 감사 기록에 대체로 충실합니다. 그러나 ‘가장 거룩한 것들에서 먹다’는 히브리어의 מִן을 한국어에 부자연스럽게 직역한 표현입니다. 문맥상 제사장이 먹는 지극히 거룩한 제물의 몫을 뜻하므로 목적어 구문으로 바로 옮기는 것이 정확합니다.
  naturalness: 현 문장은 ‘말하기를’과 ‘것들에서 먹다’가 현대 표준 한국어의 서술 문체로 다소 어색합니다. ‘총독은 … 먹지 말라고 말하였습니다’ 및 ‘지극히 거룩한 제물을 먹지 말라고’로 다듬으면 합쇼체 서술문으로 자연스럽습니다.
  terminology: ‘총독’, ‘우림과 둠밈’은 적절합니다. קֹדֶשׁ הַקֳּדָשִׁים은 공간인 지성소가 아니라 먹을 수 있는 제사장 몫을 가리키므로, 본문에서는 ‘지극히 거룩한 제물’로 명시하는 것이 문맥과 용어 기능을 잘 보존합니다. ‘지극히 거룩한’은 원문의 최상급 강조를 반영합니다.
  issues:
  - severity: medium
    issue: ‘가장 거룩한 것들에서 먹지 말라고’라는 표현
    rationale: 한국어에서 ‘것들에서 먹다’는 자연스럽지 않으며, 무엇을 먹지 말라는지 अस्पष्ट합니다. 본문의 제의적 식용 문맥을 따라 ‘지극히 거룩한 제물을 먹지 말라고’로 옮겨야 합니다.
  - severity: low
    issue: ‘말하기를’의 문체
    rationale: 문법적으로 가능하지만 현대 합쇼체 성경 서술로는 ‘그들에게 … 말하였습니다’가 더 자연스럽고 간결합니다.
  - severity: low
    issue: 각주 a의 대안 표기 불명확
    rationale: ‘곧’은 본문 번역의 설명처럼 보입니다. 영어 감사 기록의 lexical alternative에 맞게 ‘또는’으로 티르솨타를 번역 대안으로 분명히 제시하는 편이 낫습니다.
