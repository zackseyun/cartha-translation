  text: 야알라의 자손, 다르곤의 자손, 기델의 자손입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: ~의 자손
  alternatives_korean:
  - ~의 아들들
  - ~의 후손들
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 בְּנֵי는 단순 생물학적 ‘아들들’보다 씨족/가문 표지를 이루므로, 한국어에서는 자연스럽고도 원문 기능을 살리는 ‘자손’이 적절합니다.
- source_word: יַעְלָה
  english_pob_choice: Jaalah
  chosen_korean: 야알라
  alternatives_korean:
  - 자알라
  - 야알라흐
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 현대 한국어 외래어 표기 관행에 맞춰 야알라로 옮겼습니다.
- source_word: דַרְקוֹן
  english_pob_choice: Darkon
  chosen_korean: 다르곤
  alternatives_korean:
  - 다르콘
  - 다르코ן
  lexicon: HALOT
  rationale: 고유명사는 의미 번역 없이 음역하고, 한국어 표기에서는 어간의 음가를 살려 다르곤으로 옮겼습니다.
- source_word: גִדֵּל
  english_pob_choice: Giddel
  chosen_korean: 기델
  alternatives_korean:
  - 지델
  - 기덜
  lexicon: HALOT
  rationale: 반복되는 ‘~의 자손’ 구조가 가문 이름을 가리키므로, 이름 자체는 음역하여 기델로 유지했습니다.
