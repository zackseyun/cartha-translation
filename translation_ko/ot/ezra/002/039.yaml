  source_fidelity: 히브리어 בְּנֵי חָרִם은 귀환자 명단에서 하림이라는 가문·씨족 집단을 가리키며, ‘하림의 자손’은 이 범위를 자연스럽고 충실하게 옮깁니다. אֶלֶף וְשִׁבְעָה עָשָׂר의 수량 1,017도 ‘천십칠 명’으로 정확히 반영되었습니다.
  naturalness: ‘하림의 자손은 천십칠 명이었습니다’는 현대 표준 한국어로 자연스럽고, 합쇼체 문체에도 맞습니다. 명단 문맥에서 ‘명’을 보충한 것은 뜻을 명확히 할 뿐 원문의 의미를 더하지 않습니다.
  terminology: 고유명사 Harim은 ‘하림’으로 일관되게 음역되었고, ‘자손’은 여기서 직계 아들만이 아닌 가문 구성원을 포괄할 수 있는 בְּנֵי의 용례에 적절합니다.
