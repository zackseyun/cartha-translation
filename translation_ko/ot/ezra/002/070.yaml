  text: 제사장들과 레위 사람들과 백성 가운데 일부와 노래하는 사람들과 문지기들과 성전 봉사자들[a]은 각자의 성읍에 살았으며, 온 이스라엘도 각자의 성읍에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
