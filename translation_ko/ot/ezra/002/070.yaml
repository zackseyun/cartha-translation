  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Nethinim,'' a technical term for a class assigned to temple service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 레위 사람들과 일부 백성과 노래하는 사람들과 문지기들과 성전 봉사자들은 자기들의 성읍들에 살았고, 온 이스라엘도 자기들의 성읍들에 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘느디님’은 성전 봉사에 배정된 특정 집단을 가리키는 전문 용어입니다.
    reason: lexical_alternative
