language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
  footnotes:
  - marker: a
    text: Or, 'they were considered defiled from the priesthood' or 'they were disqualified from the priesthood.' The Hebrew verb carries the sense of being treated as unfit for priestly status because their genealogy could not be verified.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 계보에 따라 등록된 명부에서 자기들의 기록을 찾았으나 발견되지 않았고, 제사장직에서 제외되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘제사장직에서 부정하게 여겨졌다’ 또는 ‘제사장직에 부적합한 것으로 판단되었다’는 뜻을 띨 수 있습니다. 혈통을 확인할 수 없었기 때문에 제사장 신분에 적합하지 않은 것으로 취급되었다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְשׁוּ
  english_pob_choice: sought
  chosen_korean: 찾았으나
  alternatives_korean:
  - 구했으나
  - 찾으려 했으나
  - 수소문했으나
  lexicon: HALOT
  rationale: 행정적 문맥에서 기록의 존재를 확인하려는 동작이므로, 자연스러운 합쇼체로 ‘찾다’를 사용했습니다.
- source_word: כְתָבָם
  english_pob_choice: their record
  chosen_korean: 그들의 기록
  alternatives_korean:
  - 그들의 문서
  - 그들의 등록기록
  - 그들의 족보 기록
  lexicon: HALOT
  rationale: כְתָב은 문자 그대로 ‘쓴 것/문서’이지만, 여기서는 신분 확인용 공적 기록을 가리키므로 ‘기록’이 가장 무난합니다.
- source_word: הַמִּתְיַחְשִׂים
  english_pob_choice: among those enrolled by genealogy
  chosen_korean: 족보로 등록된 사람들 가운데서
  alternatives_korean:
  - 족보에 따라 등록된 사람들 가운데서
  - 계보로 등록된 사람들 가운데서
  - 족보 명부에 오른 사람들 가운데서
  lexicon: HALOT
  rationale: 히트파엘형 יחס는 혈통/계보를 입증하여 등록된 상태를 가리키므로, ‘족보로 등록된 사람들’로 행정적·계보적 의미를 살렸습니다.
- source_word: וַיְגֹאֲלוּ
  english_pob_choice: they were excluded
  chosen_korean: 제사장직에서 제외되었습니다
  alternatives_korean:
  - 제사장직에서 배제되었습니다
  - 제사장직에 부적합한 것으로 여겨졌습니다
  - 제사장직에서 탈락되었습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 혈통 확인 실패로 인해 제사장 신분에서 받아들여지지 못한 결과를 나타내므로, 본문의 행정적 결과를 드러내는 ‘제외되었습니다’가 적절합니다.
- source_word: מִן הַכְּהֻנָּה
  english_pob_choice: from the priesthood
  chosen_korean: 제사장직에서
  alternatives_korean:
  - 제사장직으로부터
  - 제사장 신분에서
  - 제사직에서
  lexicon: HALOT
  rationale: כְּהֻנָּה는 제사장 직분을 뜻하므로, 한국어 성경 문맥에 자연스러운 ‘제사장직’으로 옮겼습니다.
theological_decisions:
- issue: 혈통 확인 실패로 인한 제사장 자격 상실의 표현
  chosen_reading: 행정적 배제의 결과를 본문 그대로 드러내되, 추가적인 의식적 정죄는 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 부정하게 여겨졌습니다
  - 제의적으로 부적격 판정을 받았습니다
  - 정결하지 않은 것으로 간주되었습니다
  rationale: 히브리어는 혈통을 입증하지 못한 이들이 제사장직에서 받아들여지지 못한 결과를 말하며, 본문 자체는 그들을 더 강하게 신학적으로 규정하지 않습니다. 따라서 결과 중심으로 번역하되 의미 과잉을 피했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
