revisions:
- from: 이들은 족보로 등록된 사람들 가운데서 그들의 기록을 찾았으나 발견되지 않았고, 그래서 제사장직에서 제외되었습니다.[a]
  to: 이들은 계보에 따라 등록된 명부에서 자기들의 기록을 찾았으나 발견되지 않았고, 제사장직에서 제외되었습니다.[a]
  rationale: ‘계보에 따라 등록된 명부’로 원문의 계보 등록·행정 문서 맥락을 정확히 반영했습니다. ‘발견되지 않았고’는 히브리어 수동 표현의 타원성과 선행사의 약간의 불확정성을 보존합니다. 제사장직에서의 배제라는 본문의 결과는 유지하고, 동사의 부정·부적격 어감은 각주에서 제시했습니다.
