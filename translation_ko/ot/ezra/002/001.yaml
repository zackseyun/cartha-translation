source:
  edition: WLC
  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: Now these are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
  footnotes:
  - marker: a
    text: Hebrew 'sons of the province' is an idiom for the members or people of the province; the translation keeps the literal form to reflect the source wording.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the exile' or 'from the captivity.' The Hebrew expression is fuller, literally 'from the captivity of the exiles.'
    reason: lexical_alternative
  - marker: c
    text: Nebuchadnezzar is also spelled 'Nebuchadrezzar' in some English transliterations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 바빌론 왕 느부갓네살이 바빌론으로 사로잡아 간 유배민들의 포로 생활에서 올라온 그 지방의 자손들입니다[a][b]. 그들은 예루살렘과 유다로, 각자 자기 성읍으로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 지방의 자손들’은 그 지방의 주민들을 가리키는 관용구입니다. 원문의 표현을 살리기 위해 직역형으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유배민들의 포로 생활에서’라고 하여, 포로 상태와 유배민 공동체를 함께 언급합니다. 또는 ‘유배에서’ 또는 ‘포로 생활에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  english_pob_choice: sons of the province
  chosen_korean: 그 지방의 자손들
  alternatives_korean:
  - 그 지방의 사람들
  - 그 지방의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리기 위해 직역 요소인 ‘자손들’을 유지하되, ‘province’는 행정적 의미가 있는 ‘그 지방’으로 옮겼습니다.
- source_word: מִשְּׁבִי הַגּוֹלָה
  english_pob_choice: from the captivity of the exiles
  chosen_korean: 유배민의 포로 생활에서
  alternatives_korean:
  - 유배에서
  - 포로 상태에서
  - 유배 포로들 가운데서
  lexicon: HALOT
  rationale: 두 겹의 표현인 ‘captivity’와 ‘exiles’를 함께 드러내기 위해 단순한 ‘유배에서’보다 ‘유배민의 포로 생활에서’로 옮겼습니다.
- source_word: הֶגְלָה
  english_pob_choice: had carried away
  chosen_korean: 사로잡아 간
  alternatives_korean:
  - 유배시킨
  - 끌고 간
  - 포로로 끌어간
  lexicon: HALOT
  rationale: 강제 이주의 뉘앙스를 자연스러운 한국어로 드러내기 위해 ‘사로잡아 간’으로 옮겼습니다.
- source_word: אִישׁ לְעִירוֹ
  english_pob_choice: each to his own city
  chosen_korean: 각기 자기 성읍으로
  alternatives_korean:
  - 각자 자기 성읍으로
  - 사람마다 자기 성읍으로
  lexicon: HALOT
  rationale: 분배적 의미를 살리면서도 한국어 문맥에 자연스럽게 ‘각기 자기 성읍으로’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘과 유다의 병렬 표기
  chosen_reading: ‘예루살렘과 유다’라는 병렬 목적지를 그대로 유지했습니다.
  alternative_readings:
  - ‘예루살렘으로 그리고 유다로’
  - ‘예루살렘과 유다 땅으로’
  rationale: 본문의 병렬 구조와 귀환 범위를 보존하는 것이 더 중요하므로, 지명 해설을 덧붙이지 않고 원문 구조를 유지했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
