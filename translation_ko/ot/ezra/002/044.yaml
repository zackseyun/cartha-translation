    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: …의 자손
  alternatives_korean:
  - …의 아들들
  - …의 후손들
  lexicon: HALOT
  rationale: 족보·귀환자 명단의 관용구로서 직계 아들보다 씨족/가문 구성원을 가리킬 수 있으므로, 영어 POB의 ‘the sons of’에 대응하면서 한국어에서는 자연스러운 ‘자손’으로 옮겼습니다.
- source_word: קֵרֹס
  english_pob_choice: Keros
  chosen_korean: 고레스
  alternatives_korean:
  - 케로스
  lexicon: HALOT
  rationale: 고유명사는 음역해야 하며, 이 이름은 한국어 성경에서 널리 알려진 형태보다 원음에 따른 음역이 더 적절합니다.
- source_word: סִיעֲהָא
  english_pob_choice: Siaha
  chosen_korean: 시아하
  alternatives_korean:
  - 시아아
  - 시아하아
  lexicon: HALOT
  rationale: 마소라 본문의 자음·모음형을 반영해 음역했습니다. 영어 POB의 표기도 같은 계열의 이름을 가리키므로 이를 따르되 한국어 표기법에 맞췄습니다.
- source_word: פָדוֹן
  english_pob_choice: Padon
  chosen_korean: 파돈
  alternatives_korean:
  - 패돈
  - 파돈
  lexicon: HALOT
  rationale: 고유명사 음역으로 처리했고, 영어 POB의 Padon에 대응하는 표준적 한국어 음역을 택했습니다.
theological_decisions:
- issue: 족보 용어 ‘sons of’의 범위
  chosen_reading: 직계 아들만이 아니라 가문/씨족의 후손들을 가리키는 뜻을 살려 ‘자손’으로 번역했습니다.
  alternative_readings:
  - ‘아들들’로 직역
  - ‘후손들’로 풀어 번역
  rationale: 에스라의 귀환자 목록은 가문 단위를 세는 문맥이므로, 청자가 혈연 집단의 계속성을 이해하도록 해야 합니다.
  doctrine_reference: 역사 서술/족보 해석 원칙
