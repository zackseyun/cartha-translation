  text: 드랴의 자손, 도비야의 자손, 느고다의 자손이니, 모두 육백오십이 명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: …의 자손
  alternatives_korean:
  - …의 아들들
  - …의 후손들
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 씨족/가문 집단을 가리키므로, 원문의 계보적 구조를 살리면서도 현대 한국어에서 자연스러운 ‘자손’으로 옮겼습니다.
- source_word: דְלָיָה
  english_pob_choice: Delaiah
  chosen_korean: 드랴
  alternatives_korean:
  - 델라야
  - 드랴야
  lexicon: 표준 음역
  rationale: 고유명사는 의미 번역보다 음역이 원칙이므로, 히브리어 자음·모음값을 반영한 현대적 음역을 사용했습니다.
- source_word: טוֹבִיָּה
  english_pob_choice: Tobiah
  chosen_korean: 도비야
  alternatives_korean:
  - 토비야
  - 도비야후
  lexicon: 표준 음역
  rationale: 고유명사는 표준적인 한국어 음역으로 옮겼고, 한국어 성경에서 익숙한 인명 형태와도 잘 맞습니다.
- source_word: נְקוֹדָא
  english_pob_choice: Nekoda
  chosen_korean: 느고다
  alternatives_korean:
  - 네코다
  - 느코다
  lexicon: 표준 음역
  rationale: 히브리어 어형을 따라 고유명사를 음역했습니다. 끝의 장모음/어미를 한국어에서 과도하게 해석하지 않고 간결하게 처리했습니다.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  english_pob_choice: six hundred fifty-two
  chosen_korean: 모두 육백오십이 명
  alternatives_korean:
  - 육백오십이 명
  - 총 육백오십이 명
  lexicon: HALOT
  rationale: 히브리어 수사는 명단의 총계를 나타내므로, 한국어에서는 자연스럽게 ‘모두 … 명’으로 정리해 수량의 합계를 분명히 했습니다.
