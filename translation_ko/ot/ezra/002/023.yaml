  - 백 스물여덟 명
  - 백이십팔
  lexicon: HALOT
  rationale: 원문의 수사 표현을 현대 한국어의 자연스러운 수량 표현으로 옮겼습니다. 명단 항목이므로 ‘명’을 보충해 인원을 분명히 했습니다.
