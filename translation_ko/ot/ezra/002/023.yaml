- source_word: אַנְשֵׁי
  english_pob_choice: the men of
  chosen_korean: 사람은
  alternatives_korean:
  - 남자들은
  - 아낫못의 남자들은
  - 아낫못 사람들은
  lexicon: HALOT
  rationale: 문맥이 족보·귀환자 명단이므로 האנשים/אַנְשֵׁי의 소속 집단을 자연스럽게 한국어로 옮기되, 현대 한국어에서 성별을 과도하게 드러내지 않는 ‘사람은’을 택했습니다. POB의 ‘the men of’는 원문의 남성형을 반영하지만, 한국어에서는 목록체 서술상 ‘아낫못 사람은’이 가장 간결합니다.
- source_word: עֲנָתוֹת
  english_pob_choice: Anathoth
  chosen_korean: 아낫못
  alternatives_korean:
  - 아나돗
  - 아나돗 사람
  - 아낫돗
  lexicon: 고유명사(성경 지명)
  rationale: 통용되는 한국어 성경 지명 ‘아낫못’을 사용했습니다. 직역보다 표준 음역을 따르는 것이 독자가 지명을 식별하는 데 유리합니다.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  english_pob_choice: one hundred twenty-eight
  chosen_korean: 백이십팔 명
  alternatives_korean:
