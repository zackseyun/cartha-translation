translation:
  language: ko
  text: 문지기들의 자손은, 살룸의 자손, 아터의 자손, 달몬의 자손, 악굽의 자손, 하디다의 자손, 쇼배의 자손이었으며, 모두 합하여 백서른아홉 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
