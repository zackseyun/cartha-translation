  rationale: 이 구절은 성전 봉사 집단의 목록이므로, 청중이 혈연만이 아니라 가문/계열 소속을 이해하도록 하는 것이 원문의 기능에 더 가깝습니다.
  doctrine_reference: Ezra 2의 귀환 공동체 명부 문맥
