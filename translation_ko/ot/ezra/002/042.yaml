  lexicon: standard Korean number usage
  rationale: 현대 한국어의 자연스러운 수사 표현을 따르되, 인원 수를 분명히 하기 위해 ‘명’을 붙였습니다.
- source_word: שַׁלּוּם / אָטֵר / טַלְמוֹן / עַקּוּב / חֲטִיטָא / שֹׁבָי
  english_pob_choice: Shallum / Ater / Talmon / Akkub / Hatita / Shobai
  chosen_korean: 살룸 / 아터 / 달몬 / 악굽 / 하디다 / 쇼배
  alternatives_korean:
