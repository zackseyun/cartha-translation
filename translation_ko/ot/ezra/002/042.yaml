lexical_decisions:
- source_word: בְּנֵי הַשֹּׁעֲרִים
  english_pob_choice: the sons of the gatekeepers
  chosen_korean: 문지기들의 자손
  alternatives_korean:
  - 문지기들의 아들들
  - 문지기들의 사람들
  lexicon: HALOT
  rationale: 족보·명부 문맥에서 בְּנֵי는 혈통적 소속을 나타내므로 ‘자손’이 가장 자연스럽고, הַשֹּׁעֲרִים는 성전 봉사자 맥락의 ‘문지기들’로 옮기는 것이 적절합니다.
- source_word: הַכֹּל
  english_pob_choice: all together
  chosen_korean: 모두 합하여
  alternatives_korean:
  - 전체로
  - 합계
  lexicon: HALOT
  rationale: 앞의 무리들을 합산하는 총계 표현이므로, 명부 문맥에서 자연스럽고 분명한 ‘모두 합하여’로 옮겼습니다.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  english_pob_choice: one hundred thirty-nine
  chosen_korean: 백서른아홉 명
  alternatives_korean:
  - 백서른아홉
  - 백삼십구 명
  lexicon: standard Korean number usage
  rationale: 현대 한국어의 자연스러운 수사 표현을 따르되, 인원 수를 분명히 하기 위해 ‘명’을 붙였습니다.
- source_word: שַׁלּוּם / אָטֵר / טַלְמוֹן / עַקּוּב / חֲטִיטָא / שֹׁבָי
  english_pob_choice: Shallum / Ater / Talmon / Akkub / Hatita / Shobai
  chosen_korean: 살룸 / 아터 / 달몬 / 악굽 / 하디다 / 쇼배
  alternatives_korean:
  - 샬룸 / 에터 / 탈몬 / 아쿠브 / 하티타 / 쇼바이
  lexicon: proper-name transliteration
  rationale: 고유명사는 현대 한국어 외래어 표기 관행에 맞춰 음역했고, 한국 교회 전통의 익숙한 형태보다 원문 발음을 더 직접적으로 반영했습니다.
theological_decisions:
- issue: 명부형 문맥에서 בְּנֵי의 의미
  chosen_reading: 혈연적 ‘아들들’보다 집단·가문 소속을 나타내는 ‘자손’으로 번역했습니다.
  alternative_readings:
