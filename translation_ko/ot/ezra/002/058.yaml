lexical_decisions:
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 느디님
  - 성전 종들
  lexicon: HALOT
  rationale: נְתִינִים은 포로기 이후 성전 봉사에 배치된 기술용어이므로, 기능을 드러내는 ‘성전 봉사자들’이 가장 직접적입니다. 음역 ‘느디님’은 의미를 가리기 쉽고, ‘종들’만으로는 성전 봉사의 전문성을 충분히 드러내지 못합니다.
- source_word: וּבְנֵי
  english_pob_choice: and the sons of
  chosen_korean: 그리고 ... 자손은
  alternatives_korean:
  - 그리고 ... 아들들은
  - 그리고 ... 후손들은
  lexicon: HALOT
  rationale: 이곳의 בְּנֵי는 단순한 생물학적 ‘아들들’보다 집단·계보 표지를 이루므로, 자연스러운 한국어로는 ‘자손’이 그 기능을 잘 살립니다.
- source_word: עַבְדֵי שְׁלֹמֹה
  english_pob_choice: the sons of Solomon’s servants
  chosen_korean: 솔로몬의 종들의
  alternatives_korean:
  - 솔로몬의 노예들의
  - 솔로몬의 종들
  lexicon: HALOT
  rationale: עֶבֶד은 문맥에 따라 ‘종/노예’가 갈리지만, 여기서는 솔로몬과 관련된 역사적 집단명으로 제시되어 있어 POB의 영어 선택을 따라 ‘종’으로 옮기는 것이 적절합니다.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  english_pob_choice: three hundred ninety-two
  chosen_korean: 삼백아흔둘
  alternatives_korean:
  - 삼백아흔두
  - 392명
  lexicon: HALOT
  rationale: 히브리어 수사 표현을 한국어 관용에 맞게 한글 숫자로 옮겼으며, 목록 항목의 총계이므로 ‘명’을 덧붙이지 않고 간결하게 처리했습니다.
