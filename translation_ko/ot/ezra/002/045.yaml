  source_fidelity: 히브리어 원문은 세 가문/집단 명칭 앞에 반복되는 בְּנֵי(‘~의 아들들’)를 제시합니다. ‘레바나의 자손들, 하가바의 자손들, 악굽의 자손들’은 이 반복 구조와 명부·족보 문맥의 집단 지시를 충실히 반영합니다. 절 말미의 서술형 종결 ‘입니다’는 한국어 명부 문장으로 자연스럽게 연결하며 의미를 더하지 않습니다.
  naturalness: 표준어 현대 한국어 합쇼체로 자연스럽습니다. 쉼표로 나열한 뒤 ‘입니다’로 마무리한 형식은 앞뒤 명부 문맥에서 매끄럽고, ‘자손들’의 반복도 원문의 반복을 보존합니다.
  terminology: ‘자손들’은 이 명부 문맥에서 בְּנֵי가 가리키는 가문·씨족 집단의 범위를 무리 없이 나타냅니다. 레바나, 하가바, 악굽은 일관된 한국어 성경식 음역이며, 신학적 해석을 덧붙이지 않습니다. 각주 [a]는 본문의 첫 ‘자손들’에 적절히 연결되어 בְּנֵי의 집단적 용법을 설명합니다.
