  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵי לְבָנָ֥ה בְנֵי חֲגָבָ֖ה בְּנֵ֥י עַקּֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/045.yaml
  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
  footnotes:
  - marker: a
    text: Hebrew 'sons of' may denote a family line or clan group, not only immediate male children.
    reason: lexical_alternative
translation:
  language: ko
  text: 레바나의 자손들, 하가바의 자손들, 악굽의 자손들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘~의 아들들’은 직계 남자 자녀뿐 아니라 씨족이나 가문 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 가문의 사람들
  - 후손들
  lexicon: HALOT
  rationale: 이 족보/명부 문맥에서는 직역상 ‘아들들’이 가능하지만, 실제로는 특정 남성 자녀들만이 아니라 씨족·가문 집단을 가리킬 수 있어 한국어에서는 더 자연스럽고 오해가 적은 ‘자손들’로 옮겼습니다.
- source_word: לְבָנָה
  english_pob_choice: Lebanah
  chosen_korean: 레바나
  alternatives_korean:
  - 레바나흐
  - 레바나
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원칙이므로, 히브리어 형태를 반영해 ‘레바나’로 옮겼습니다.
- source_word: חֲגָבָה
  english_pob_choice: Hagabah
  chosen_korean: 하가바
  alternatives_korean:
  - 하가바흐
  - 하가바
  lexicon: HALOT
  rationale: 고유명사이므로 의미 번역이 아니라 음역을 택했고, 마소라 표기를 반영해 ‘하가바’로 옮겼습니다.
- source_word: עַקּוּב
  english_pob_choice: Akkub
  chosen_korean: 악굽
  alternatives_korean:
  - 아굽
  - 아쿠브
  lexicon: HALOT
  rationale: 영어 POB의 표준형 Akkub을 한국어 음역으로 반영하되, 이중 자음과 장모음을 고려해 ‘악굽’으로 옮겼습니다.
theological_decisions:
- issue: 씨족/가문을 뜻하는 בְּנֵי의 범위
  chosen_reading: ‘자손들’은 즉각적인 남자 자녀들보다 넓게 씨족·가문 구성원을 가리킬 수 있게 옮겼습니다.
  alternative_readings:
  - ‘아들들’로 더 문자적으로 옮김
  - ‘후손들’로 더 풀어 옮김
  rationale: 이 구절은 예루살렘 귀환 명부의 항목이므로, 혈연 집단 표지를 과도하게 축소하지 않으면서도 반복 구조를 살리는 번역이 필요합니다.
  doctrine_reference: 족보/공동체 명부의 집단 표지
- issue: 고유명사의 음역 원칙
  chosen_reading: 세 이름은 모두 의미화하지 않고 음역했습니다.
  alternative_readings:
  - 뜻풀이 번역
  - 전통 교회식 한자음 표기
  rationale: 원문이 전달하는 것은 인물 의미가 아니라 명단의 식별 기능이므로, 독자가 동일한 이름 항목을 추적할 수 있도록 음역을 유지했습니다.
  doctrine_reference: 고유명사 처리 원칙
