theological_decisions:
- issue: 성전 일꾼들에 대한 용어 선택
  chosen_reading: ‘느디님’처럼 음역만 하지 않고 기능을 드러내는 ‘성전 일꾼들’로 옮겼습니다.
  alternative_readings:
