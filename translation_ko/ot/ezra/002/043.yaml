  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נְּתִינִ֑ים בְּנֵי צִיחָ֥א בְנֵי חֲשׂוּפָ֖א בְּנֵ֥י טַבָּעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Nethinim''; traditionally transliterated rather than translated. The term refers to a class of temple servants attached to sanctuary service.'
    reason: lexical_alternative
  - marker: b
    text: Or 'descendants of' for each repeated 'sons of'; the Hebrew genealogical formula can denote a family line, not only immediate sons.
    reason: lexical_alternative
  - marker: c
    text: Hasupha is also spelled 'Hashupha' in some English traditions.
    reason: lexical_alternative
translation:
  language: ko
  text: '성전 일꾼들: 지하의 아들들, 하수바의 아들들, 답바옷의 아들들입니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַנְּתִינִים은 전통적으로 음역되는 용어이지만, 여기서는 성전 봉사 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아들들’은 여기서 직계 아들만이 아니라 가문·후손을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 하수바는 영어 전통 표기 Hasupha/Hashupha에 해당하는 이름 변이입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 일꾼들
  alternatives_korean:
  - 느디님
  - 성전 종들
  - 성전 봉사자들
  lexicon: HALOT
  rationale: WLC의 고유 집단명 הַנְּתִינִים은 후대 성전 봉사 집단을 가리키므로, 의미를 풀어 ‘성전 일꾼들’로 옮겨 독자가 기능을 즉시 이해하도록 했습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 후손들
  - 가문
  - 자손들
  lexicon: HALOT
  rationale: 족보·명단 형식의 반복 구조를 살리기 위해 직역에 가까운 ‘아들들’을 유지했습니다. 한국어에서도 집단/가문 지시 기능이 충분히 전달됩니다.
- source_word: צִיחָא
  english_pob_choice: Ziha
  chosen_korean: 지하
  alternatives_korean:
  - 지하
  - 시하
  lexicon: standard transliteration
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 음차했고, 영어 POB의 Ziha에 맞춰 ‘지하’로 옮겼습니다.
- source_word: חֲשׂוּפָא
  english_pob_choice: Hasupha
  chosen_korean: 하수바
  alternatives_korean:
  - 하슈바
  - 하수파
  lexicon: standard transliteration
  rationale: 자음 ח와 ㅅ 계열의 표기를 고려해 표준 음역형으로 ‘하수바’를 선택했습니다. 영어 전통 표기 변이(Hasupha/Hashupha)를 반영하되 한국어 읽기 자연성을 우선했습니다.
- source_word: טַבָּעוֹת
  english_pob_choice: Tabbaoth
  chosen_korean: 답바옷
  alternatives_korean:
  - 다바옷
  - 탑바옷
  lexicon: standard transliteration
  rationale: 이 항목은 고유명사로 기능하므로 번역하지 않고 음역했습니다. 히브리어 어형에 맞춰 ‘답바옷’으로 옮겼습니다.
theological_decisions:
- issue: 성전 일꾼들에 대한 용어 선택
  chosen_reading: ‘느디님’처럼 음역만 하지 않고 기능을 드러내는 ‘성전 일꾼들’로 옮겼습니다.
  alternative_readings:
  - 느디님
  - 성전 봉사자들
  rationale: 본문의 핵심은 이들이 성전 봉사에 속한 집단이라는 점이므로, 고유명사화된 음역보다 기능역이 독자의 이해를 더 정확하게 돕습니다. 다만 번역을 과도하게 해석적으로 만들지는 않도록 ‘일꾼들’ 수준에서 절제했습니다.
  doctrine_reference: postexilic temple service / community organization
