  - 성전 봉사자들
  rationale: 본문의 핵심은 이들이 성전 봉사에 속한 집단이라는 점이므로, 고유명사화된 음역보다 기능역이 독자의 이해를 더 정확하게 돕습니다. 다만 번역을 과도하게 해석적으로 만들지는 않도록 ‘일꾼들’ 수준에서 절제했습니다.
