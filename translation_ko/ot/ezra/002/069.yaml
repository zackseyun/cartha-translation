  to: 그들은 능력에 따라 공사를 위한 금고에 금 다릭[a] 6만 1천 개와 은 5천 미나[b]와 제사장들의 긴 옷 100벌을 바쳤습니다.
  rationale: 원문의 비례적 헌납(‘능력에 따라’), 수납처(‘공사를 위한 금고’), 세 헌납 품목과 수량을 모두 보존했습니다. ‘성전’이라는 문맥적 보충은 피하고, 의복 명칭도 ‘겉옷’보다 덜 한정적인 ‘긴 옷’으로 조정했습니다. 다릭과 미나는 역사적 단위를 유지하고 기존 각주를 համապատասխան 위치에 배치했습니다.
