id: EZR.2.69
reference: Ezra 2:69
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
  footnotes:
  - marker: a
    text: Or 'gold coins'; the Hebrew term refers specifically to Persian darics.
    reason: lexical_alternative
  - marker: b
    text: A mina was an ancient unit of weight and money.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 능력에 따라 공사를 위한 금고에 금 다릭[a] 6만 1천 개와 은 5천 미나[b]와 제사장들의 긴 옷 100벌을 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다릭’은 페르시아의 금화를 가리키는 말입니다.
    reason: cultural_note
  - marker: b
    text: ‘미나’는 고대의 중량·화폐 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  english_pob_choice: According to their ability
  chosen_korean: 그들의 능력에 따라
  alternatives_korean:
  - 그들이 할 수 있는 만큼
  - 그들의 힘에 따라
  - 그들의 재력에 따라
  lexicon: HALOT
  rationale: כְ + כֹחַ는 분량과 능력에 따른 비례를 나타내므로, 한국어에서도 자연스럽게 ‘능력에 따라’로 옮겨 비례적 의미를 살렸습니다.
- source_word: לְאוֹצַר הַמְּלָאכָה
  english_pob_choice: to the treasury for the work
  chosen_korean: 성전 공사에
  alternatives_korean:
  - 공사를 위한 보물창고에
  - 공사 비용으로
  - 일을 위한 خز고에
  lexicon: HALOT
  rationale: אוֹצָר는 보관소/금고를 뜻하지만, 문맥상 예루살렘 성전 재건 공사에 쓰이는 헌납을 가리키므로 한국어에서는 기능을 드러내어 ‘성전 공사에’로 풀었습니다.
- source_word: דַּרְכְּמוֹנִים
  english_pob_choice: darics
  chosen_korean: 다릭
  alternatives_korean:
  - 다리크
  - 금화
  - 드라크마
  lexicon: HALOT
  rationale: 페르시아 금화인 다릭을 가리키는 구체적 명칭이므로, 역사적 특수성을 살려 음역형 ‘다릭’을 채택했습니다.
- source_word: מָנִים
  english_pob_choice: minas
  chosen_korean: 미나
  alternatives_korean:
  - 민아
  - 파운드
  - 무게 단위
  lexicon: HALOT
  rationale: מָנֶה는 고대의 중량·화폐 단위이므로 현대 단위로 환산하지 않고 ‘미나’로 옮겨 문화적·역사적 정보를 보존했습니다.
- source_word: וְכָתְנֹת כֹּהֲנִים
  english_pob_choice: and 100 priests’ tunics
  chosen_korean: 제사장들의 겉옷 100벌
  alternatives_korean:
  - 제사장들의 튜닉 100벌
  - 제사장용 옷 100벌
  - 제사장들의 예복 100벌
  lexicon: HALOT
  rationale: כָּתְנֹת은 몸에 입는 긴 옷/튜닉 계열이지만, 한국어 성경 문맥에서는 의미가 지나치게 낯설지 않도록 ‘겉옷’으로 옮기되, ‘제사장들의’라는 소유/대상 관계는 분명히 유지했습니다.
theological_decisions:
- issue: 헌납의 기준을 나타내는 כְּכֹחָם의 의미
  chosen_reading: 성전 공사는 각 사람의 능력에 맞추어 자발적으로 헌납한 것으로 읽었습니다.
  alternative_readings:
  - 단순한 금액 목록으로만 읽는 해석
  - 의무적 세금이나 할당금으로 읽는 해석
  rationale: 본문은 ‘그들의 능력에 따라’라는 비례 표현을 사용하므로, 부담금보다 자원에 맞춘 자원 봉헌의 성격을 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 공동체적 헌신과 자원에 따른 자발적 헌납
- issue: 성전 관련 용어의 한국어화
  chosen_reading: אוֹצַר הַמְּלָאכָה를 직접 ‘성전 공사에’로 풀어 기능을 분명히 했습니다.
  alternative_readings:
  - ‘공사의 금고에’처럼 직역하는 방식
  - ‘일의 창고에’처럼 물리적 장소성을 강조하는 방식
  rationale: 문맥은 헌금의 최종 목적을 보여 주는 것이 핵심이므로, 한국어 독자가 즉시 이해하도록 공사 목적을 전면에 드러냈습니다.
  doctrine_reference: 예루살렘 성전 재건 서술의 문맥적 명료성
