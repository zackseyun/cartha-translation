translation:
  language: ko
  text: 우사의 아들들, 바세아의 아들들, 베사이의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 직계 아들뿐 아니라 더 넓은 가문이나 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보·명단 문맥이므로 직역 구조를 살리되, 한국어에서는 반복되는 ‘~의 아들들’이 가장 자연스럽고 간결합니다. 여기서도 immediate sons보다 더 넓은 가문/계열을 뜻할 수 있는 여지를 유지합니다.
- source_word: עֻזָּא
  english_pob_choice: Uzza
  chosen_korean: 우사
  alternatives_korean:
  - 웃사
  - 우자
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역으로 옮기되, 표준 외래어 표기 관행에 맞춰 ‘우사’로 적었습니다.
- source_word: פָסֵחַ
  english_pob_choice: Paseah
  chosen_korean: 바세아
  alternatives_korean:
  - 파세아
  - 페세아
  lexicon: HALOT
  rationale: 고유명사는 통용되는 성경 인명 음역을 따랐습니다. 한국어에서는 ‘바세아’가 목록형 본문에서 읽기 자연스럽습니다.
- source_word: בֵסָי
  english_pob_choice: Besai
  chosen_korean: 베사이
  alternatives_korean:
  - 베새
  - 비사이
  lexicon: HALOT
  rationale: 고유명사는 원어 자음·모음값을 반영한 음역으로 처리했고, 영어 POB의 표기와도 대응되도록 ‘베사이’를 선택했습니다.
theological_decisions:
- issue: בְּנֵי의 범위
  chosen_reading: ‘아들들’로 옮기되 혈통적 직계 아들만을 뜻하지 않는 족속/가문 표지로 이해할 수 있게 유지했습니다.
  alternative_readings:
  - ‘후손들’
  - ‘자손들’
  rationale: 에스라의 귀환 명단에서는 בְּנֵי가 개별 아들보다 더 넓은 집단 표지를 가리킬 수 있으므로, 한국어 본문은 전통적 반복 구조를 살리면서도 주석 없이 너무 협소하게 읽히지 않도록 했습니다.
  doctrine_reference: 족보·언약 공동체 표지에 대한 성경 문맥 해석
