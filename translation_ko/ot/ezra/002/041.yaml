  yaml_path: translation/ot/ezra/002/041.yaml
  text: 'The singers: the sons of Asaph, one hundred twenty-eight.'
translation:
  language: ko
  text: 노래하는 이들—아삽의 자손—은 백이십팔 명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  english_pob_choice: the singers
  chosen_korean: 노래하는 이들
  alternatives_korean:
  - 노래하는 사람들
  - 성가대원들
  - 찬양하는 이들
  lexicon: HALOT
  rationale: 히브리어 분사형은 ‘노래하는 사람들’을 직접 가리키므로, 직무를 과장하지 않고 자연스럽게 옮겼습니다. ‘성가대원들’은 제도적 뉘앙스가 더 강하고, ‘찬양하는 이들’은 의미를 넓혀 원문보다 해석적입니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아삽의 자손
  alternatives_korean:
  - 아삽의 아들들
  - 아삽의 후손
  - 아삽 집안
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 בְּנֵי는 혈통/가문 집단을 표시하므로 ‘자손’이 형식과 의미를 함께 보존합니다. ‘아들들’은 문자적으로 가깝지만 한국어에서는 너무 협소할 수 있습니다.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  english_pob_choice: one hundred twenty-eight
  chosen_korean: 백이십팔 명
  alternatives_korean:
  - 일백이십팔 명
  - 백 스물여덟 명
  lexicon: HALOT
  rationale: 수사는 간결한 현대 한국어 수치 표현으로 옮기되, 명단 항목임을 분명히 하기 위해 단위 ‘명’을 보탰습니다. 히브리어의 단순한 합산 수치(100+20+8)를 반영합니다.
theological_decisions:
- issue: 명단 항목의 서술 방식
  chosen_reading: 이 구절은 제의적 직분을 지닌 집단의 인원 수를 단순한 목록 형식으로 제시합니다.
  alternative_readings:
  - 의미를 풀어 ‘성전 노래꾼들’로 해석하는 방식
  - 직무를 일반화해 ‘음악가들’로 옮기는 방식
  rationale: 원문은 직무의 정체성을 간단히 표지하고 수를 제시하는 목록 문장입니다. 따라서 설명을 덧붙이기보다, 이름-가문-인원 구조를 유지하는 것이 본문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 본문 기능과 장르에 대한 번역 판단
