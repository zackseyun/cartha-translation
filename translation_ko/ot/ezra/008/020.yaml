  to: 또 다윗과 지도자들이 레위 사람들의 봉사를 위해 지정한 성전 봉사자들[a] 가운데 220명이 있었으며, 그들 모두의 이름이 명시되었습니다.[b]
  rationale: 반복되는 נְתִינִים을 일관되게 ‘성전 봉사자들’로 번역하고, 한국어에서 오해되기 쉬운 ‘지명되었습니다’를 이름별 명시·등록의 뜻을 나타내는 표현으로 고쳤습니다. 목적구는 원문의 범위를 보존하도록 ‘레위 사람들의 봉사를 위해’로 유지했으며, 각주 앵커를 해당 단어 및 대안 독법이 적용되는 절에 각각 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:17Z'
