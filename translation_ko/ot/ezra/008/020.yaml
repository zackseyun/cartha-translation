id: EZR.8.20
reference: Ezra 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
  footnotes:
  - marker: a
    text: Hebrew נְתִינִים (Nethinim), a technical term for a class of temple servants.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of them were listed by name.'
    reason: alternative_reading
translation:
  language: ko
  text: 또 다윗과 지도자들이 레위 사람들의 봉사를 위해 지정한 성전 봉사자들[a] 가운데 220명이 있었으며, 그들 모두의 이름이 명시되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְתִינִים(느디님)은 성전 봉사에 속한 특정 집단을 가리키는 전문 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 모두는 이름으로 기록되었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  english_pob_choice: temple servants
  chosen_korean: 성전 종들
  alternatives_korean:
  - 느디님
  - 성전 일꾼들
  - 종들
  lexicon: HALOT
  rationale: 특정한 성전 봉사 집단이라는 기능을 드러내기 위해 ‘성전 종들’로 옮겼습니다. ‘느디님’은 음차를 보존하지만 오늘 독자에게는 설명 없이는 불투명합니다.
- source_word: וְהַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 지도자들이
  alternatives_korean:
  - 관리들이
  - 관원들이
  - 통치자들이
  lexicon: HALOT
  rationale: 포로기 이후의 행정적 맥락에서 지위와 역할을 자연스럽게 드러내는 표현으로 옮겼습니다. ‘지도자들’은 문맥상 권위를 전하면서도 지나치게 고어적이지 않습니다.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  english_pob_choice: to the service of the Levites
  chosen_korean: 레위 사람들의 일을 위해
  alternatives_korean:
  - 레위 사람들의 봉사를 위해
  - 레위 사람들의 직무를 위해
  - 레위 사람들을 섬기는 일을 위해
  lexicon: HALOT
  rationale: עֲבֹדָה의 ‘봉사/일’ 의미를 살리되, 이들이 레위 사람들의 직무 수행을 돕는 배치라는 점을 드러내기 위해 ‘일을 위해’로 옮겼습니다.
- source_word: נִקְּב֥וּ בְ/שֵׁמֽוֹת
  english_pob_choice: were designated by name
  chosen_korean: 이름으로 지명되었습니다
  alternatives_korean:
  - 이름이 기록되었습니다
  - 이름별로 지정되었습니다
  - 이름으로 기록되었습니다
  lexicon: HALOT
  rationale: נקב의 수동형이 단순 목록 작성보다 공식적으로 특정 지목·지정을 뜻하므로, 행정적 뉘앙스를 살려 ‘지명되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 숫자와 집합성의 전달
  chosen_reading: ‘성전 종이 220명’으로 수치를 분명히 하고, ‘그들 모두’로 집합적 완전성을 살렸습니다.
  alternative_readings:
  - ‘이백이십 명’
  - ‘모두 이름으로 기록되었습니다’
  rationale: 히브리어의 정확한 수와 전체성을 독자가 즉시 파악하도록 하면서도, 이름별 식별이라는 문맥을 흐리지 않기 위해 현대적 수치 표기를 사용했습니다.
  doctrine_reference: 없음
