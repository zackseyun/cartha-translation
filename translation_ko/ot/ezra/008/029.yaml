revisions:
- from: 주의를 기울이고 그것들을 지키십시오. 예루살렘에서 대제사장들과 레위 사람들과 이스라엘 조상들의 집안 우두머리들 앞에서 그것들을 달아 놓을 때까지, 야훼의 집의 방들에 있습니다.[a][b][c]
  to: 그것들을 깨어 살피고 지키십시오[a]. 예루살렘에 있는 야훼의 집[c]의 방들에서 제사장 지도자들과 레위 사람들과 이스라엘의 조상 집안 우두머리들[b] 앞에서 그것들의 무게를 달아 확인할 때까지 그렇게 하십시오.
  rationale: 장소구를 원문의 계량 절차에 연결하고, שקל의 검수·계량 의미를 명료하게 했습니다. 제사장들의 지도자라는 뜻을 보존하기 위해 ‘대제사장들’을 ‘제사장 지도자들’로 바꾸었으며, 신학적 해석을 덧붙이지 않고 בית יהוה의 표현은 유지했습니다.
