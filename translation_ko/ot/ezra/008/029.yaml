  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'Be watchful and keep them.' The Hebrew imperatives emphasize careful vigilance over the entrusted items.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the heads of the fathers’ houses of Israel,' referring to clan or ancestral-house leaders.
    reason: cultural_note
  - marker: c
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 깨어 살피고 지키십시오[a]. 예루살렘에 있는 야훼의 집[c]의 방들에서 제사장 지도자들과 레위 사람들과 이스라엘의 조상 집안 우두머리들[b] 앞에서 그것들의 무게를 달아 확인할 때까지 그렇게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘깨어 살피고 그것들을 지키라’는 뜻입니다. 히브리어의 두 명령형은 맡겨진 물건을 주의 깊게 살피고 보호하라는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상 집안 우두머리들’은 씨족 또는 가문 단위의 지도자들을 가리키는 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어로는 ‘야훼의 집’이며, 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ
  english_pob_choice: Be watchful
  chosen_korean: 주의를 기울이고
  alternatives_korean:
  - 깨어 있으십시오
  - 경계하십시오
  lexicon: HALOT
  rationale: שׁקד는 단순한 주의보다 깨어 살피는 태도를 나타내므로, 한국어에서는 명령형의 자연스러움을 살려 ‘주의를 기울이고’로 옮겼습니다.
- source_word: וְשִׁמְרוּ
  english_pob_choice: and guard them
  chosen_korean: 그것들을 지키십시오
  alternatives_korean:
  - 그것들을 보호하십시오
  - 그것들을 간수하십시오
  lexicon: HALOT
  rationale: 금과 은 같은 위탁물을 안전하게 보존하는 문맥이므로, 보호보다 직접적인 ‘지키다’가 더 적절합니다.
- source_word: עַד תִּשְׁקְלוּ
  english_pob_choice: until you weigh them out
  chosen_korean: 그것들을 달아 놓을 때까지
  alternatives_korean:
  - 그것들을 달아 볼 때까지
  - 그것들이 달릴 때까지
  lexicon: HALOT
  rationale: שקל의 핵심은 계량·검수이므로, 단순히 ‘무게를 재다’보다 ‘달아 놓다’가 공적인 인수인계 절차를 더 잘 드러냅니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 본문의 직접적인 표현은 ‘야훼의 집’이며, 프로젝트 기본 용례에 따라 하나님의 언약 이름을 보존했습니다. ‘성전’은 해설적 대체어이지만 원문 구조를 덜 보존합니다.
theological_decisions:
- issue: 야훼의 집을 어떻게 옮길지
  chosen_reading: 문맥상 성전이지만, 본문 표현은 직역해 ‘야훼의 집’으로 유지합니다.
  alternative_readings:
  - 성전
  - 주님의 집
  rationale: 히브리어 본문은 בית יהוה라는 직조 표현을 사용하므로, 건물의 의미를 해설적으로 바꾸기보다 원문 형식을 보존하는 편이 문맥과 감사 보고 절차를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
