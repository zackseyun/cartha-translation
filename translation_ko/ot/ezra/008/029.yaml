  source_fidelity: 수정이 필요합니다. 초안의 ‘달아 놓을 때까지’는 שקל의 공적 계량·검수 의미보다 물건을 놓아 두는 뜻으로 읽히기 쉽고, 이어지는 ‘야훼의 집의 방들에 있습니다’는 명령문의 구문과 맞지 않아 원문의 장소구를 전달하지 못합니다. 또한 שָׂרֵי הַכֹּהֲנִים는 신약 시대의 직함처럼 들릴 수 있는 ‘대제사장들’보다 ‘제사장 지도자들’이 본문의 행정적 지도자 의미를 더 정확히 보존합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 하려면 장소구를 ‘예루살렘에 있는 야훼의 집의 방들에서’로 연결하고, 계량 행위는 ‘무게를 달아 확인할 때까지’로 표현하는 것이 적절합니다.
  terminology: ‘야훼의 집’은 בית יהוה의 직역적 표현을 유지하며, 각주에서 성전을 가리킴을 밝혔습니다. ‘조상 집안 우두머리들’은 אָבוֹת의 가문·씨족 단위 뉘앙스를 보존합니다. ‘레위 사람들’은 통용되는 한국어 성경 용례입니다.
