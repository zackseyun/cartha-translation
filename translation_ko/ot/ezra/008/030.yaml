id: EZR.8.30
reference: Ezra 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קִבְּלוּ֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מִשְׁקַ֛ל הַ/כֶּ֥סֶף וְ/הַ/זָּהָ֖ב וְ/הַ/כֵּלִ֑ים לְ/הָבִ֥יא לִ/ירוּשָׁלִַ֖ם לְ/בֵ֥ית אֱלֹהֵֽי/נוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
  footnotes:
  - marker: a
    text: Or 'the weight of the silver, the gold, and the vessels.' The Hebrew term can denote either the measured weight itself or the weighed amount.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the temple of our God.' Literally, 'to the house of our God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제사장들과 레위 사람들은 은의 저울친 양과 금과 그릇들을 받아 예루살렘으로, 우리 하나님의 집으로 가져가게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은의 무게, 곧 금과 그릇들의 무게’라는 뜻일 수 있습니다. 히브리어는 실제 무게값 자체나 그 무게로 계량된 양을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 하나님의 성전으로’. 문자적으로는 ‘우리 하나님의 집으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  english_pob_choice: received
  chosen_korean: 받았습니다
  alternatives_korean:
  - 받아들였습니다
  - 인수하였습니다
  - 받아 보관했습니다
  lexicon: HALOT
  rationale: 문맥상 에스라 일행에게서 귀중품의 인계를 받는 행위이므로, 자연스럽고 책임 이전의 뉘앙스를 살리는 ‘받다’가 가장 적절합니다.
- source_word: מִשְׁקַל הַכֶּסֶף
  english_pob_choice: the weighed amount of the silver
  chosen_korean: 은의 저울친 양
  alternatives_korean:
  - 은의 무게
  - 은의 무게만큼
  - 저울로 잰 은
  lexicon: HALOT
  rationale: מִשְׁקַל은 단순한 ‘무게’보다 실제로 계량된 양을 가리킬 수 있어, POB의 해석을 따라 ‘저울친 양’으로 옮겨 계량의 정확성을 드러냈습니다.
- source_word: וְהַכֵּלִים
  english_pob_choice: the vessels
  chosen_korean: 그릇들
  alternatives_korean:
  - 기물들
  - 기구들
  - 용기들
  lexicon: HALOT
  rationale: 성전 맥락에서 כלים은 의례용 기물들을 가리키지만, 한국어로는 너무 전문화된 ‘기물’보다 보다 직접적이고 넓게 이해되는 ‘그릇들’이 원문 범위를 무리 없이 살립니다.
- source_word: לְבֵית אֱלֹהֵינוּ
  english_pob_choice: to the house of our God
  chosen_korean: 우리 하나님의 집으로
  alternatives_korean:
  - 우리 하나님의 성전으로
  - 우리 하나님의 집에
  - 우리 하나님 집으로
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘하나님의 집’을 유지해 POB의 본문 선택을 따르되, 한국어 문장에서는 방향을 자연스럽게 드러내기 위해 ‘으로’를 사용했습니다.
theological_decisions:
- issue: 성전/집 표현
  chosen_reading: ‘하나님의 집’으로 직역해 성전이라는 해석어를 본문에는 넣지 않았습니다.
  alternative_readings:
  - ‘성전’으로 번역
  - ‘우리 하나님의 성전으로’로 번역
  rationale: 본문은 문자적으로 ‘집’(בֵית)이며, 영어 POB도 주석에서만 ‘temple’을 대안으로 제시합니다. 따라서 본문은 원표현을 보존하고, 해석적 확장은 피했습니다.
  doctrine_reference: 성전 용어의 해석적 절제
