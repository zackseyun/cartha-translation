- from: 그래서 제사장들과 레위 사람들은 은의 저울친 양과 금과 그릇들을 받아 예루살렘으로, 우리 하나님의 집으로 가져가게 하였습니다.[a][b]
  to: 그러므로 제사장들과 레위 사람들은 달아 둔 은과 금과 기물들을 예루살렘, 곧 우리 하나님의 집으로 가져가려고 받았습니다.[a][b]
