  source_fidelity: 수정이 필요합니다. 원문의 מִשְׁקַל은 은뿐 아니라 뒤따르는 금과 기물에도 걸릴 수 있는 ‘무게/계량된 분량’이며, 현 번역의 ‘은의 저울친 양과 금과 그릇들’은 계량의 범위를 은에만 한정하는 듯합니다. 또한 לְהָבִיא의 목적 용법은 ‘가져가게 하였습니다’라는 사역 표현이 아니라, 수령자들이 가져가기 위한 목적을 나타냅니다.
  naturalness: ‘저울친 양’은 현대 표준어에서 부자연스럽고, ‘받아 … 가져가게 하였습니다’는 주어가 스스로 운반할 물품을 타인에게 운반시키는 것처럼 들립니다. ‘달아 둔 …을 … 가져가려고 받았습니다’가 자연스럽고 원문의 책임 인수 및 목적 관계를 보존합니다.
  terminology: כֵּלִים은 이 성전 재물 문맥에서 단순한 식기만을 뜻하는 ‘그릇들’보다 넓은 ‘기물들’이 적절합니다. ‘우리 하나님의 집’은 원문의 문자적 표현을 잘 보존하므로 유지합니다.
  issues:
