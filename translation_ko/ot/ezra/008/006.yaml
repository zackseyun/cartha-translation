theological_decisions:
- issue: 명단의 성별 표지 보존
  chosen_reading: ‘남자 쉰 명’으로 옮겨 히브리어의 성별 지정어를 그대로 살렸습니다.
  alternative_readings:
  - ‘쉰 사람’
  - ‘쉰 명’
  rationale: 본문은 단순한 인원수가 아니라 זכרים(수컷/남자들)이라는 성별 표지를 포함하므로, 이를 완화하지 않고 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: 본문의 목록/계보적 정확성
- issue: 히브리어 계보 구문 처리
  chosen_reading: ‘아딘의 자손 중에서는 …’로 한국어 명단 문체에 맞춰 재구성했습니다.
  alternative_readings:
  - ‘아딘의 아들들 가운데’
  - ‘아딘의 자손들로부터’
  rationale: 원문의 מִן-בְּנֵי 구문을 지나치게 기계적으로 반복하지 않으면서도, 출처 집단에서 일부가 나온다는 뜻을 분명히 전합니다.
  doctrine_reference: 문학적/역사적 서술의 정확성
