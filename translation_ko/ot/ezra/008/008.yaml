theological_decisions:
- issue: 족보/명단에서 '아들들'의 범위
  chosen_reading: 직계 아들만이 아니라 집단적 혈통/가문을 가리키는 표현으로 읽되, 본문은 그대로 '아들들' 구조를 살렸습니다.
  alternative_readings:
  - '''자손들''로 풀어 직계 제한을 약화하는 읽기'
  - '''가문''으로 해석하는 읽기'
  rationale: 본문이 명단형 족보 문맥에 있으므로, 원문의 집단적 용례 가능성을 주석 없이 번역 내부에서 과도하게 해석하지 않고 유지하는 것이 안전합니다.
  doctrine_reference: 족보 문맥의 서술 관행
