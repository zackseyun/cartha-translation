source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
  footnotes:
  - marker: a
    text: Or 'in the charge of Meremoth son of Uriah the priest.' The Hebrew idiom literally reads 'into the hand of.'
    reason: lexical_alternative
  - marker: b
    text: That is, temple vessels or articles.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 넷째 날에 은과 금과 기물은 우리 하나님의 집에서 무게를 달아 제사장 우리야의 아들 므레못의 손에 맡겨졌습니다.[a] 그와 함께 비느하스의 아들 엘르아살이 있었고, 그들과 함께 예수아의 아들 요사밧과 비누이의 아들 느아댜가 있었습니다. 이들은 레위 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘므레못의 손에’입니다. 이 표현은 그의 책임 아래 인계하거나 맡긴다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  english_pob_choice: And on the fourth day
  chosen_korean: 그리고 넷째 날에
  alternatives_korean:
  - 넷째 날에
  - 그리고 넷째 날
  lexicon: HALOT
  rationale: 시간 표현의 순서를 자연스러운 한국어 서술로 옮기되, 서사 연결을 위해 접속사 ‘그리고’를 살렸습니다.
- source_word: נִשְׁקַל
  english_pob_choice: were weighed out
  chosen_korean: 세어 넘겨
  alternatives_korean:
  - 저울질되어
  - 무게를 달아
  lexicon: HALOT
  rationale: 히브리어는 단순 계량이 아니라 공식적으로 계량하여 인계하는 행위를 가리키므로, ‘세어 넘겨’로 custody 전달의 뉘앙스를 살렸습니다.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  english_pob_choice: the silver and the gold and the vessels
  chosen_korean: 은과 금과 기명들
  alternatives_korean:
  - 은과 금과 그릇들
  - 은과 금과 성물들
  lexicon: HALOT
  rationale: 성전 맥락의 כֵּלִים은 단순한 그릇보다 성전 기물 전체를 가리키므로 ‘기명들’이 구체성과 범위를 함께 유지합니다.
- source_word: עַל יַד
  english_pob_choice: into the hand of
  chosen_korean: '...의 손에 맡겼습니다'
  alternatives_korean:
  - '...의 손으로'
  - '...의 책임 아래'
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 위임 표현으로 옮기되, 책임 있는 인계를 드러내기 위해 ‘맡겼습니다’를 사용했습니다.
theological_decisions:
- issue: 성전 재산의 인계 방식
  chosen_reading: 단순 보관이 아니라 하나님 집 안에서 공식적으로 계량한 뒤 책임자에게 인계한 행위로 옮겼습니다.
  alternative_readings:
  - 그냥 저울로 잰 것으로만 읽기
  - 단순한 회계 절차로만 축소하기
  rationale: 문맥은 봉헌 물품의 안전한 인수인계를 강조하므로, 계량과 위임의 두 요소를 모두 보존해야 합니다.
  doctrine_reference: 성전 봉헌물의 거룩함과 공동체적 책임 관리
- issue: 레위 사람들의 명시
  chosen_reading: 마지막 문장은 네 사람 전체가 아니라 마지막 두 사람을 포함한 관련 집단을 ‘레위 사람들’로 규정하는 구문으로 이해했습니다.
  alternative_readings:
  - 뒤의 네 사람 모두를 레위 사람들로 보기
  - ‘레위 사람들’ 없이 이름만 나열하기
  rationale: 히브리어 문맥상 문장 끝의 집합 명시는 기록적 분류이므로, 이름 나열 뒤에 집단 표지를 유지했습니다.
  doctrine_reference: 성전 직무의 레위인 분담
