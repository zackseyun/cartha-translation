translation:
  language: ko
  text: 엘람 자손 가운데서는 여사야, 아달랴의 아들이 있었는데, 그와 함께한 남자는 일흔 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자들”이라고도 할 수 있습니다. 히브리어는 더 구체적으로 “남성들”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 엘람 자손 가운데서는
  alternatives_korean:
  - 엘람의 아들들 가운데서는
  - 엘람의 후손들 가운데서는
  lexicon: HALOT
  rationale: 계보 목록의 형식을 살리면서도 한국어에서는 자연스럽게 읽히도록 ‘자손 가운데서는’으로 옮겼습니다. ‘sons of’의 직역감을 유지하되 집단 소속을 드러냅니다.
- source_word: בֶּן עֲתַלְיָה
  english_pob_choice: son of Athaliah
  chosen_korean: 아달랴의 아들
  alternatives_korean:
  - 아달랴의 아들된
  - 아달랴의 후손
  lexicon: HALOT
  rationale: 히브리어의 부자 관계를 그대로 반영해 ‘아들’로 옮겼습니다. 족보적 표지이므로 ‘후손’보다 직접적입니다.
- source_word: שִׁבְעִים הַזְּכָרִים
  english_pob_choice: seventy males
  chosen_korean: 그와 함께한 남자는 일흔 명
  alternatives_korean:
  - 그와 함께한 수컷은 일흔 명
  - 그와 함께한 사람은 일흔 명
  lexicon: HALOT
  rationale: 원문은 일반적인 ‘사람’이 아니라 성별을 분명히 하는 ‘남성들/수컷들’을 뜻하므로, 행정적·목록적 뉘앙스를 살려 ‘남자’로 옮겼습니다. 영어 POB의 각주가 지적한 성별 표지를 한국어 본문에서도 보존했습니다.
theological_decisions:
- issue: 가계 목록에서의 성별 표지 표현
  chosen_reading: ‘הַזְּכָרִים’은 중립적 ‘사람들’이 아니라 ‘남자들’로 구체화했습니다.
  alternative_readings:
  - ‘일흔 사람’
  - ‘일흔 명’만 제시
  rationale: 본문은 귀환자 수를 세는 목록 문맥에서 성별을 표시하는 표현을 사용하므로, 이를 희석하지 않고 드러내는 것이 원문 충실도에 더 맞습니다.
  doctrine_reference: 본문의 인구/명단 표기 방식에 관한 주해적 결정
