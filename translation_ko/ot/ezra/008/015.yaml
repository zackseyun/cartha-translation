id: EZR.8.15
reference: Ezra 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
  footnotes:
  - marker: a
    text: Or, 'the canal that goes to Ahava.' The Hebrew term can denote a river or a man-made watercourse in this setting.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''of the sons of Levi,'' that is, Levites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 아하와로 가는 강[a]가에 모아 놓았고, 거기서 사흘 동안 진을 쳤습니다. 그런 다음 내가 백성과 제사장[b]들을 살펴보았으나, 거기에서는 레위 자손을 하나도 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아하와로 가는 운하’. 히브리어는 이 문맥에서 강이나 인공 수로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘레위의 아들들’이며, 곧 레위 사람들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  english_pob_choice: I gathered them
  chosen_korean: 내가 그들을 ... 모아 놓았고
  alternatives_korean:
  - 내가 그들을 모았습니다
  - 내가 그들을 모아 두었습니다
  lexicon: HALOT
  rationale: קבץ의 핵심은 ‘모으다/모아들이다’이므로, 집합의 결과를 자연스럽게 드러내는 ‘모아 놓았고’로 옮겨 에스라의 주도적 행동을 살렸습니다.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  english_pob_choice: the river that comes to Ahava
  chosen_korean: 아하와로 가는 강
  alternatives_korean:
  - 아하와로 오는 강
  - 아하와로 흐르는 강
  - 아하와로 가는 운하
  lexicon: HALOT
  rationale: נָהָר는 기본적으로 ‘강’이지만, 본문 맥락상 물길 전체를 가리킬 수 있어 ‘강’으로 두되, ‘가는’으로 יחס적 방향을 살렸습니다. POB의 주석처럼 운하 가능성은 주석으로 처리했습니다.
- source_word: וַנַּחֲנֶה שָׁם יָמִים שְׁלֹשָׁה
  english_pob_choice: we camped there three days
  chosen_korean: 거기서 사흘 동안 진을 쳤습니다
  alternatives_korean:
  - 거기서 사흘 동안 야영했습니다
  - 거기서 사흘 동안 머물렀습니다
  lexicon: HALOT
  rationale: חנה의 군사적·행군 맥락을 살려 ‘진을 치다’로 옮겼습니다. ‘사흘’은 히브리어 숫자 표현을 자연스럽게 반영합니다.
- source_word: וָאָבִינָה
  english_pob_choice: I examined
  chosen_korean: 내가 ... 살펴보았으나
  alternatives_korean:
  - 내가 ... 검토했으나
  - 내가 ... 조사했으나
  - 내가 ... 이해했으나
  lexicon: HALOT
  rationale: בין의 이 용법은 단순 ‘이해하다’보다 대상을 주의 깊게 살피는 뜻이 강하므로, 인원 구성을 확인하는 문맥에 맞게 ‘살펴보다’로 옮겼습니다.
- source_word: וּמִבְּנֵי לֵוִי
  english_pob_choice: of the sons of Levi
  chosen_korean: 레위 자손
  alternatives_korean:
  - 레위 사람들
  - 레위의 아들들
  lexicon: HALOT
  rationale: 히브리어의 친족·계보 표현을 유지하되, 한국어에서는 ‘레위 자손’이 가장 직접적이고 자연스럽습니다. POB가 주석으로 ‘레위 사람들’을 풀어준 점도 반영했습니다.
theological_decisions:
- issue: 레위 지파 부재를 어떻게 드러낼 것인지
  chosen_reading: ‘레위 자손을 하나도 찾지 못했습니다’로 옮겨 단순한 인원 누락이 아니라 성전 봉사에 필요한 계통 집단의 부재를 분명히 드러냈습니다.
  alternative_readings:
  - ‘레위 사람들이 없었습니다’
  - ‘레위 자손이 없음을 보았습니다’
  rationale: 본문은 제사장과 구별되는 레위 계보의 부재를 강조하므로, 계보적 표현을 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 포로기 귀환 공동체와 성전 봉사 질서
