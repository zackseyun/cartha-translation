  source_fidelity: 히브리어의 수량 구조는 스레뱌와 하사뱌 두 사람 및 그들과 함께한 그들의 형제 열 사람, 곧 모두 열두 사람을 가리킵니다. 초안도 대체로 이를 반영하지만, ‘따로 세웠는데, 곧 …였습니다’라는 연결은 ‘세운 사람’과 뒤의 인명·집단을 서술상 동격으로 처리하여 한국어 문장 구조가 부자연스럽습니다.
  naturalness: ‘그들과 함께한 그들의 형제’는 가능하나, ‘스레뱌와 하사뱌, 그리고 그들과 함께한 그들의 형제 열 사람’으로 열거 구조를 분명히 하면 현대 표준 한국어에서 더 자연스럽고 열두 명의 구성이 명료해집니다. 합쇼체 종결도 ‘세웠습니다’로 정리합니다.
