source:
  edition: WLC
  text: וָ/אַבְדִּ֛ילָ/ה מִ/שָּׂרֵ֥י הַ/כֹּהֲנִ֖ים שְׁנֵ֣ים עָשָׂ֑ר לְ/שֵׁרֵֽבְיָ֣ה חֲשַׁבְיָ֔ה וְ/עִמָּ/הֶ֥ם מֵ/אֲחֵי/הֶ֖ם עֲשָׂרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
  footnotes:
  - marker: a
    text: Or 'from the chiefs of the priests.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' may refer more broadly to their fellow kinsmen or associates, but the Hebrew uses the masculine familial term.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 제사장 지도자들[a] 가운데서 열두 사람, 곧 스레뱌와 하사뱌, 그리고 그들과 함께한 그들의 형제[b] 열 사람을 따로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사장들의 우두머리들 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 더 넓게는 그들의 친족이나 동료를 가리킬 수 있지만, 히브리어는 남성 친족어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  english_pob_choice: Then I set apart
  chosen_korean: 나는 …를 따로 세웠는데
  alternatives_korean:
  - 나는 …를 구별했는데
  - 나는 …를 분리했는데
  lexicon: HALOT
  rationale: בדל의 히필은 ‘분리하다/구별하다/따로 세우다’의 뜻이므로, 임명·위임의 문맥에 맞게 ‘따로 세웠다’로 옮겼습니다. 앞의 וְ는 서술 순서를 살려 ‘그때’로 처리했습니다.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  english_pob_choice: of the leading priests
  chosen_korean: 제사장들 중 지도자
  alternatives_korean:
  - 제사장들의 우두머리
  - 제사장들의 지도자
  lexicon: HALOT
  rationale: שָׂרִים은 ‘지도자, 우두머리’의 뜻이므로, 한국어에서 자연스럽고 과장되지 않게 ‘지도자’로 옮겼습니다. מִן은 분량/범주를 나타내는 관계로 ‘중’으로 반영했습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열두 사람
  alternatives_korean:
  - 열둘
  - 열두 명
  lexicon: HALOT
  rationale: 수사 다음의 단위 명사를 보충해 독자가 대상 수를 바로 이해하도록 했습니다. 문맥상 사람을 가리키므로 ‘사람’이 가장 자연스럽습니다.
- source_word: מֵאֲחֵיהֶם
  english_pob_choice: of their brothers
  chosen_korean: 그들의 형제
  alternatives_korean:
  - 그들의 친족
  - 그들의 동료
  lexicon: HALOT
  rationale: אָח의 복수형은 직역하면 ‘형제’이지만, 여기서는 혈연만이 아니라 같은 공동체의 남자들을 가리킬 수 있습니다. 다만 원문이 사용하는 친족적 호칭을 보존하기 위해 ‘형제’를 유지했습니다.
theological_decisions:
- issue: 제사장 지도자들의 선발이 ‘거룩한 임무를 위한 구별’인지 여부
  chosen_reading: 본문의 동사는 단순한 선발보다 거룩한 목적을 위한 ‘따로 세움’의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 단순히 뽑았다
  - 분리했다
  rationale: 에스라의 행위는 행정적 선발을 넘어서 성소 관련 사명을 위한 위임의 성격을 띱니다. 따라서 한국어에서도 그 기능적·성례적 긴장을 유지했습니다.
  doctrine_reference: 구별/봉헌의 성격을 띤 직무 위임
