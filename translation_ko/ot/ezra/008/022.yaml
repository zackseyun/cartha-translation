id: EZR.8.22
reference: Ezra 8:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
  footnotes:
  - marker: a
    text: Or “from the enemy on the journey.” The Hebrew phrase can be rendered more literally this way, but “against the enemy on the way” better fits the request for military protection.
    reason: lexical_alternative
  - marker: b
    text: “The hand of our God” is a Hebrew expression for his active favor or power.
    reason: cultural_note
translation:
  language: ko
  text: 저는 길에서 적에게 맞서 우리를 도울 군대와 기병을 왕에게 요청하기가 부끄러웠습니다[a]. 이는 우리가 왕에게 이미 이렇게 말씀드렸기 때문입니다. “우리 하나님의 손은 그분을 찾는 모든 사람에게 선을 베푸시지만[b], 그분의 능력과 분노는 그분을 버리는 모든 사람에게 맞섭니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “길에서 적에게서.” 히브리어 구문은 더 문자적으로 이렇게도 옮길 수 있지만, 군사적 보호를 요청하는 문맥에서는 “길에서 적에게 맞서”가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: “우리 하나님의 손”은 그분의 능동적인 호의나 권능을 가리키는 히브리식 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  english_pob_choice: I was ashamed
  chosen_korean: 부끄러워했습니다
  alternatives_korean:
  - 창피했습니다
  - 수치스러웠습니다
  lexicon: HALOT
  rationale: בוש는 단순한 당황보다 수치와 부끄러움을 가리키므로, 현대 한국어에서는 문맥에 맞는 ‘부끄러워했습니다’가 자연스럽고 무게도 유지합니다.
- source_word: חַיִל וּפָרָשִׁים
  english_pob_choice: troops and horsemen
  chosen_korean: 군대와 기병
  alternatives_korean:
  - 병력과 말탄 사람들
  - 병사들과 기병
  lexicon: HALOT
  rationale: 왕이 제공할 수 있는 무장 보호를 가리키므로 ‘군대와 기병’이 가장 간결하게 대응하며, 두 명사 병렬도 살립니다.
- source_word: יַד אֱלֹהֵינוּ
  english_pob_choice: The hand of our God
  chosen_korean: 우리 하나님의 손
  alternatives_korean:
  - 우리 하나님의 권능
  - 우리 하나님의 능한 손
  lexicon: HALOT
  rationale: ‘손’은 하나님의 सक्रिय한 개입을 나타내는 히브리식 은유이므로, 설명어로 바꾸지 않고 그대로 살렸습니다.
- source_word: מְבַקְשָׁיו לְטוֹבָה
  english_pob_choice: all who seek him ... for good
  chosen_korean: 그를 찾는 모든 사람에게 선을 베푸시지만
  alternatives_korean:
  - 그를 찾는 모든 사람에게 복을 주시지만
  - 그를 찾는 모든 사람에게 유익하시지만
  lexicon: HALOT
  rationale: לְטוֹבָה의 선한 유익을 한국어에서는 ‘선을 베푸시다’로 옮기면 단순한 호의보다 적극적인 복리의 의미를 유지할 수 있습니다.
- source_word: עֻזּוֹ וְאַפּוֹ
  english_pob_choice: his strength and his anger
  chosen_korean: 그의 능력과 그의 분노
  alternatives_korean:
  - 그의 힘과 그의 진노
  - 그의 권세와 그의 분노
  lexicon: HALOT
  rationale: עֹז는 물리적 힘보다 কার্য동적인 힘/능력의 뉘앙스가 강하므로 ‘능력’이 문맥상 더 자연스럽고, אַף는 관용적으로 ‘분노’로 옮겼습니다.
- source_word: עַל כָּל עֹזְבָיו
  english_pob_choice: are against all who forsake him
  chosen_korean: 그를 버리는 모든 사람에게 미칩니다
  alternatives_korean:
  - 그를 버리는 모든 사람을 향합니다
  - 그를 버리는 모든 사람에게 임합니다
  lexicon: HALOT
  rationale: ‘against’의 대립·향함을 한국어에서 동사로 드러내기 위해 ‘미칩니다’를 택했으며, עזב의 언약적 뉘앙스는 ‘버리다’로 살렸습니다.
theological_decisions:
- issue: 하나님의 손이라는 신체 은유의 처리
  chosen_reading: ‘우리 하나님의 손’을 그대로 유지해 하나님의 능동적 개입과 호의를 함께 드러내도록 했습니다.
  alternative_readings:
  - 우리 하나님의 권능
  - 우리 하나님의 손길
  rationale: 원문은 손을 추상어로 바꾸지 않고 하나님의 실제적 개입을 형상적으로 말합니다. 은유를 보존해야 뒤이어 나오는 선/대적의 두 진술도 같은 이미지 층위에서 읽힙니다.
  doctrine_reference: 번역 철학 §1, §3, §6
- issue: ‘그의 능력과 그의 분노’의 이중 진술
  chosen_reading: 두 명사를 분리해 하나님의 선한 편향과 심판적 대립을 함께 유지했습니다.
  alternative_readings:
  - 그의 강한 분노
  - 그의 권능과 진노
  rationale: 히브리어는 두 요소를 병렬로 제시하므로, 하나로 합치면 힘과 분노의 긴장이 약해집니다. 분리 번역이 원문의 강조를 더 잘 보존합니다.
  doctrine_reference: 번역 철학 §3, §5
