translation:
  language: ko
  text: 그리고 베바이의 아들들 가운데서는 베바이의 아들 스가랴와 그와 함께한 남자 스물여덟 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베바이의 아들들’은 문자적으로는 ‘베바이의 아들들’이지만, 더 넓게는 베바이의 자손이나 가문 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 가운데서
  alternatives_korean:
  - 그리고 …의 자손들 가운데서
  - 그리고 …의 가족 가운데서
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 직역의 형식을 살리되, 한국어에서는 자연스러운 집단 표지를 위해 ‘가운데서’를 보탰습니다.
- source_word: בֵבַי / בֶּן בֵּבָי
  english_pob_choice: Bebai / son of Bebai
  chosen_korean: 베바이 / 베바이의 아들
  alternatives_korean:
  - 베배이 / 베배이의 아들
  - 베바이 / 베바이에게서 난 아들
  lexicon: 고유명사 표기 관행
  rationale: 고유명사는 현대 음역에 따라 ‘베바이’로 옮기고, patronymic 관계는 ‘의 아들’로 직접 반영했습니다.
- source_word: זְכַרְיָה
  english_pob_choice: Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 사가랴
  - 즈카랴
  lexicon: 한국어 성경 고유명사 관행
  rationale: 이미 널리 정착된 한국어 성경 인명형을 따라 독자가 곧바로 인물명을 식별하도록 했습니다.
- source_word: הַזְּכָרִים
  english_pob_choice: males
  chosen_korean: 남자
  alternatives_korean:
  - 남성
  - 사내
  lexicon: HALOT
  rationale: 히브리어는 연령이 아니라 성별을 표시하므로, 명단 문맥에서 ‘남자’가 가장 간결하고 정확합니다.
