source:
  edition: WLC
  text: וַ/יָּבִ֨יאּוּ לָ֜/נוּ כְּ/יַד אֱלֹהֵ֨י/נוּ הַ/טּוֹבָ֤ה עָלֵ֨י/נוּ֙ אִ֣ישׁ שֶׂ֔כֶל מִ/בְּנֵ֣י מַחְלִ֔י בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵ֑ל וְ/שֵׁרֵֽבְיָ֛ה וּ/בָנָ֥י/ו וְ/אֶחָ֖י/ו שְׁמֹנָ֥ה עָשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
  footnotes:
  - marker: a
    text: Or, 'as the good hand of our God was upon us.' The Hebrew idiom speaks of God's favorable providence.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 하나님의 선한 손이 우리 위에 있었으므로, 그들은 이스라엘의 아들 레위의 아들 마흘리의 자손 가운데서 분별 있는 사람, 곧 스레뱌와 그의 아들들과 그의 형제들, 모두 열여덟 명을 우리에게 데려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 하나님의 선한 손이 우리 위에 있는 대로’. 이 히브리어 관용구는 하나님의 호의로운 섭리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: they brought
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 이끌어 왔습니다
  lexicon: HALOT
  rationale: 히필형의 ‘bring/cause to come’ 의미를 자연스러운 서술체로 옮기되, 사람을 데려오는 문맥이므로 ‘데려왔습니다’가 가장 적절합니다.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  english_pob_choice: by the good hand of our God upon us
  chosen_korean: 우리 하나님의 선한 손이 우리 위에 계셨기에
  alternatives_korean:
  - 우리 하나님의 선한 손으로 말미암아
  - 우리 하나님의 선한 손이 우리 위에 있었기에
  lexicon: HALOT
  rationale: 에스라-느헤미야에서 반복되는 관용구를 손의 이미지와 섭리적 호의를 함께 살려 옮겼습니다. ‘계셨기에’는 단순한 상태보다 하나님의 능동적 호의를 더 분명히 드러냅니다.
- source_word: אִישׁ שֶׂכֶל
  english_pob_choice: a man of insight
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 통찰력 있는 사람
  - 지혜로운 사람
  - 숙련된 사람
  lexicon: HALOT
  rationale: שׂכל은 단순 기술보다 분별, 통찰, 판단력을 가리키므로, 문맥상 인물의 자질을 드러내는 ‘분별 있는 사람’이 가장 자연스럽습니다.
- source_word: וְשֵׁרֵבְיָה וּבָנָיו וְאֶחָיו
  english_pob_choice: namely Sherebiah, and his sons and his brothers
  chosen_korean: 곧 셔레뱌와 그의 아들과 그의 형제들
  alternatives_korean:
  - 그리고 셔레뱌와 그의 아들과 그의 형제들
  - 즉 셔레뱌와 그의 아들과 그의 형제들
  lexicon: HALOT
  rationale: 히브리어의 접속사 וְ가 앞의 인물을 구체화하는 동격 용법이므로, 한국어에서는 ‘곧’으로 풀어 주어 문장 관계를 명료하게 했습니다.
- source_word: שְׁמֹנָה עָשָׂר
  english_pob_choice: eighteen
  chosen_korean: 열여덟 명
  alternatives_korean:
  - 열여덟
  lexicon: HALOT
  rationale: 명시된 사람 수이므로 한국어에서는 단위를 보충해 자연스럽게 읽히도록 ‘명’을 붙였습니다.
theological_decisions:
- issue: 하나님의 ‘선한 손’ 관용구 처리
  chosen_reading: 직역의 이미지를 유지하면서도 섭리적 호의를 나타내는 문장으로 옮겼습니다.
  alternative_readings:
  - ‘좋은 손’으로 직역하기
  - 완전히 설명적으로 ‘하나님의 은혜로운 인도하심’으로 풀기
  rationale: 본문은 하나님의 호의로운 섭리를 손의 이미지로 표현합니다. 이미지를 보존하되 한국어에서 의미가 분명하도록 약간의 문장형 조정을 했습니다.
  doctrine_reference: Translation philosophy §1, §3
