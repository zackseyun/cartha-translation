revisions:
- from: 그리고 우리 하나님의 선한 손이 우리 위에 계셨기에, 그들이 우리에게 마흘리의 아들로서 레위의 아들이며 이스라엘의 아들인 분별 있는 사람, 곧 셔레뱌와 그의 아들과 그의 형제들 열여덟 명을 데려왔습니다.[a]
  to: 우리 하나님의 선한 손이 우리 위에 있었으므로, 그들은 이스라엘의 아들 레위의 아들 마흘리의 자손 가운데서 분별 있는 사람, 곧 스레뱌와 그의 아들들과 그의 형제들, 모두 열여덟 명을 우리에게 데려왔습니다.[a]
  rationale: 하나님의 ‘손’이라는 비유를 보존하되 존대 동사의 부자연스러움을 제거했습니다. 계보는 ‘이스라엘→레위→마흘리’의 순서와 마흘리의 자손이라는 범위를 분명히 했으며, 스레뱌와 아들들 및 형제들의 총수가 열여덟 명임을 문장 안에서 명료하게 나타냈습니다. 각주도 원문의 כְּ가 허용하는 대안적 관계를 보존하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:18Z'
review_pass:
  verdict: revise
  source_fidelity: ‘손이 … 계셨기에’는 하나님의 ‘손’에 존대 동사 ‘계시다’를 적용하여 한국어에서 부자연스럽고, כְּיַד의 ‘~에 따라/말미암아’ 관계도 다소 흐립니다. 또한 계보는 마흘리-레위-이스라엘의 연쇄를 더 명확히 표시할 필요가 있습니다. 스레뱌와 그 일행의 총수 열여덟 명이라는 구조는 유지해야 합니다.
  naturalness: ‘우리 하나님의 선한 손이 우리 위에 있었으므로’는 원문의 손 이미지를 보존하면서 현대 표준어 문어체로 자연스럽습니다. ‘이스라엘의 아들 레위의 아들 마흘리의 자손 가운데서’는 계보 수식의 범위를 분명히 합니다.
  terminology: 고유명사는 한국어 성경에서 널리 쓰이는 ‘스레뱌’를 사용했습니다. ‘분별 있는 사람’과 ‘선한 손’은 원문의 의미와 비유를 무리하게 해설하지 않고 보존합니다.
  issues:
  - severity: medium
    issue: ‘우리 하나님의 선한 손이 우리 위에 계셨기에’
    rationale: ‘손’은 존대의 대상이 아니므로 ‘계셨기에’는 어색합니다. 원문의 비유를 유지하여 ‘있었으므로’로 고치는 편이 자연스럽고 충실합니다.
  - severity: medium
    issue: 계보의 수식 관계가 불명확함
    rationale: ‘마흘리의 아들로서 레위의 아들이며 이스라엘의 아들인’은 한국어에서 ‘분별 있는 사람’이 직접 레위와 이스라엘의 아들인 듯 읽힐 수 있습니다. 원문의 계보 연쇄를 명시적으로 재배열해야 합니다.
  - severity: low
    issue: 고유명사 ‘셔레뱌’
    rationale: 한국어 성경의 통용 표기는 ‘스레뱌’이므로, 이름의 일관성과 독자 인지성을 위해 이를 따르는 것이 적절합니다.
