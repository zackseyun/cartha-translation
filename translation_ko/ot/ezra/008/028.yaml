  text: וָ/אֹמְרָ֣/ה אֲלֵ/הֶ֗ם אַתֶּ֥ם קֹ֨דֶשׁ֙ לַ/יהוָ֔ה וְ/הַ/כֵּלִ֖ים קֹ֑דֶשׁ וְ/הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ נְדָבָ֔ה לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: ko
  text: 내가 그들에게 말했습니다. “너희는 야훼께 속한 거룩한 사람들입니다. 그 그릇들도 거룩하며, 은과 금은 야훼, 너희 조상의 하나님께 드리는 자원 예물입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 사람들입니다’는 직역적 대응이며, 문맥상 ‘야훼께 속한’이라는 소속 의미를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그릇들’은 성전 맥락의 כֵּלִים을 현대 한국어로 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: holy to Yahweh
  chosen_korean: 야훼께 속한 거룩한 사람들입니다
  alternatives_korean:
  - 야훼께 거룩합니다
  - 야훼를 위한 거룩한 이들입니다
  - 야훼께 바쳐진 거룩한 것입니다
  lexicon: HALOT
  rationale: קֹדֶשׁ은 단순한 도덕적 ‘거룩함’보다 예배적·성별된 소속을 나타내므로, 한국어에서는 ‘속한’으로 소속성과 구별됨을 함께 살렸습니다.
- source_word: הַכֵּלִים
  english_pob_choice: the vessels
  chosen_korean: 그 그릇들도
  alternatives_korean:
  - 그 기물들도
  - 그 용기들도
  - 그 제기들도
  lexicon: HALOT
  rationale: 성막/성전 맥락의 כֵּלִים은 의례용 기구를 가리키므로, 자연스러운 현대 한국어로는 ‘그릇들’이 가장 무난하면서도 성물의 물품성을 유지합니다.
- source_word: נְדָבָה
  english_pob_choice: a freewill offering
  chosen_korean: 자원 예물입니다
  alternatives_korean:
  - 자발적 제물입니다
  - 기쁜 마음으로 드린 예물입니다
  - 자유로운 헌물입니다
  lexicon: HALOT
  rationale: נְדָבָה는 강요가 아닌 자발성을 강조하는 제의 용어이므로, ‘자원 예물’로 옮겨 자원성과 제물/예물의 성격을 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명표기는 전통적 대체어가 아니라 고유 이름으로 처리해야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘קֹדֶשׁ’의 번역에서 소속성과 구별됨의 관계
  chosen_reading: ‘거룩한 사람들’/‘거룩한 그릇들’로 하되, 문맥상 야훼께 바쳐져 구별된 상태를 함께 드러냈습니다.
  alternative_readings:
  - ‘성결한 사람들’
  - ‘성스러운 사람들’
  - ‘성물’
  rationale: 본문은 도덕적 품성보다 제의적 성별을 말하므로, ‘거룩한’만 남기면 추상화될 수 있어 ‘속한’ 표현을 덧붙여 의미를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (source-directed cultic sense)
- issue: ‘אֱלֹהֵי אֲבֹתֵיכֶם’의 인칭·관계 보존
  chosen_reading: ‘너희 조상의 하나님’
  alternative_readings:
  - ‘너희 조상들의 하나님’
  - ‘너희 선조의 하나님’
  rationale: 히브리어 복수 소유격을 한국어에서도 유지해, 언약적 계승 관계를 평탄화하지 않고 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
