  text: So we came to Jerusalem and stayed there three days.
translation:
  language: ko
  text: 우리는 예루살렘에 도착하여 거기서 사흘 동안 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/נָּב֖וֹא
  english_pob_choice: So we came
  chosen_korean: 우리는 … 도착하여
  alternatives_korean:
  - 우리는 왔습니다
  - 그리고 우리는 왔습니다
  - 우리는 도착했습니다
  lexicon: HALOT
  rationale: 서술의 다음 진행을 자연스럽게 잇는 방식으로 ‘도착하여’를 택해, 단순 이동의 도착점이 예루살렘임을 분명히 했습니다. 영어 POB의 ‘came’처럼 과도한 해석은 피했습니다.
- source_word: יְרוּשָׁלִָ֑ם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘성
  lexicon: 고유명사
  rationale: 지명은 한국어 성경에서 널리 쓰이는 표준 음역인 ‘예루살렘’을 유지했습니다.
- source_word: וַ/נֵּ֥שֶׁב
  english_pob_choice: and stayed
  chosen_korean: 거기서 … 머물렀습니다
  alternatives_korean:
  - 거기서 앉았습니다
  - 거기서 지냈습니다
  - 거기서 머뭇거렸습니다
  lexicon: HALOT
  rationale: ישב의 넓은 의미 가운데 여행 문맥에는 ‘머물다’가 가장 정확합니다. ‘앉다’는 오해를 낳을 수 있어 피했습니다.
- source_word: יָמִ֥ים שְׁלֹשָֽׁה
  english_pob_choice: three days
  chosen_korean: 사흘 동안
  alternatives_korean:
  - 삼 일 동안
  - 세 날 동안
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 한국어 관용에 맞게 ‘사흘 동안’으로 옮겨, 기간의 길이를 자연스럽게 드러냈습니다.
