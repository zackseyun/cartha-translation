base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/027.yaml
  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
  footnotes:
  - marker: a
    text: Or 'twenty gold bowls worth one thousand darics.' The Hebrew may be read as giving the total valuation of the bowls.
    reason: lexical_alternative
  - marker: b
    text: Or 'two vessels of good burnished bronze.' The rare expression describing the bronze likely refers to especially fine, gleaming workmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 금 대접 스무 개는 다릭 천 개의 값이었고,[a] 질이 좋고 윤이 나는 놋그릇 두 개는,[b] 금처럼 귀한 것들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금 대접 스무 개, 다릭 천 개.’ 히브리어 표현은 대접들의 가치를 다릭 천 개로 나타내는 것으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘좋은 광택의 놋그릇 두 개.’ 희귀한 표현은 특히 정교하게 만들어져 윤이 나고 빛나는 상태를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי זָהָב
  english_pob_choice: bowls of gold
  chosen_korean: 금 그릇
  alternatives_korean:
  - 금으로 된 그릇
  - 금잔
  - 금 사발
  lexicon: HALOT
  rationale: כְפֹרֵי는 그릇류를 가리키므로, 현대 한국어에서는 자연스러운 ‘그릇’으로 옮기고 재질을 앞에 두어 항목형 목록의 흐름을 살렸습니다.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  english_pob_choice: worth a thousand darics
  chosen_korean: 그 값은 다릭 천 개에 해당하였고
  alternatives_korean:
  - 다릭 천 개 값이었고
  - 다릭 천 개의 값이었고
  - 다릭 천 개에 이를 만큼이었고
  lexicon: HALOT
  rationale: ל은 여기서 가치/평가를 나타내는 용법으로 보이므로, 단순 소유가 아니라 ‘그 값은 …에 해당하였고’로 옮겨 평가 의미를 드러냈습니다.
- source_word: מֻצְהָב טוֹבָה
  english_pob_choice: fine gleaming bronze
  chosen_korean: 좋은 광택의 놋그릇
  alternatives_korean:
  - 광택 있는 좋은 놋그릇
  - 잘 윤이 난 놋그릇
  - 반짝이는 좋은 놋그릇
  lexicon: HALOT
  rationale: 희귀한 형용구는 질 좋은 반짝임을 가리키므로, 영어의 ‘fine gleaming bronze’에 맞춰 자연스럽고 과장되지 않게 ‘좋은 광택의’로 풀었습니다.
- source_word: חֲמוּדֹת כַּזָּהָב
  english_pob_choice: precious as gold
  chosen_korean: 금처럼 귀한 것이었습니다
  alternatives_korean:
  - 금처럼 소중한 것이었습니다
  - 금과 같이 귀한 것이었습니다
  - 금처럼 값진 것이었습니다
  lexicon: HALOT
  rationale: 비교구문 כַּזָּהָב를 직역하여 ‘금처럼’으로 살리고, חֲמוּדֹת의 가치감을 ‘귀한’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 제의적 목록의 어조
  chosen_reading: 단순 재물 목록이 아니라 성전 귀환용 예물의 목록으로 읽히는 어조를 유지했습니다.
  alternative_readings:
  - 일반 금속 공예품의 재고 목록으로 중화하는 읽기
  - 장식품 목록으로만 제한하는 읽기
  rationale: 문맥상 예루살렘 귀환을 위한 성전 재산의 수량 기록이므로, 과도한 일상화보다 재정·제의적 무게를 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: Ezra 8장의 성전 귀환 맥락
- issue: mutsahav의 의미
  chosen_reading: ‘좋은 광택의’로 옮겨 놋이 실제로 금빛이라는 뜻이 아니라, 고급스럽게 윤이 나는 제작 상태를 나타내게 했습니다.
  alternative_readings:
  - ‘금빛의’로 처리하는 읽기
  - ‘도금한’으로 보는 읽기
  rationale: 원문과 EN POB 모두 물질 자체를 금으로 바꾸지 않고, 놋의 뛰어난 광택과 품질을 말한다고 보므로 그 긴장을 보존했습니다.
  doctrine_reference: 문맥상 어휘적 긴장 보존
