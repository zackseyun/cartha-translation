  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
  footnotes:
  - marker: a
    text: Or 'to afflict ourselves before our God.' The Hebrew idiom refers to self-denial or self-humbling, especially in fasting.
    reason: lexical_alternative
  - marker: b
    text: Or 'a right way' or 'a safe journey.' The Hebrew literally says 'a straight path.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 나는 아하와 강가에서 금식을 선포하여, 우리 하나님 앞에서 스스로 낮추고, 우리와 우리 어린아이들과 우리의 모든 소유를 위해 그분께 곧은 길을 구하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘금식’은 문자적으로는 ‘자기 몸을 괴롭게 하다’는 관용적 표현입니다. 이 번역은 그 의미를 한국어로 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곧은 길’은 문자적으로는 ‘곧은 길/길’이지만, 문맥상 ‘바른 길’이나 ‘안전한 여정’까지 함의할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  english_pob_choice: Then I proclaimed
  chosen_korean: 나는 ... 선포하여
  alternatives_korean:
  - 나는 ... 외쳐
  - 나는 ... 알리고
  lexicon: HALOT
  rationale: קרא는 여기서 단순 발화가 아니라 공개적으로 알리는 행위를 가리키므로, 문맥에 맞게 ‘선포하여’로 옮겼습니다.
- source_word: צּוֹם
  english_pob_choice: a fast
  chosen_korean: 금식
  alternatives_korean:
  - 하나의 금식
  - 단식
  lexicon: HALOT
  rationale: 명사 צוֹם은 금식 행위 자체를 뜻하므로, 한국어에서는 가장 자연스러운 ‘금식’으로 옮겼습니다.
- source_word: לְהִתְעַנּוֹת לִפְנֵי אֱלֹהֵינוּ
  english_pob_choice: that we might humble ourselves before our God
  chosen_korean: 우리 하나님 앞에서 스스로 낮추고
  alternatives_korean:
  - 우리 하나님 앞에서 스스로 괴롭게 하고
  - 우리 하나님 앞에서 자신을 낮추고
  lexicon: HALOT
  rationale: 금식 맥락의 ענה는 자해가 아니라 자기 낮춤/절제의 관용구이므로, 오해를 피하면서도 의미를 살려 ‘스스로 낮추다’로 렌더링했습니다.
- source_word: דֶּרֶךְ יְשָׁרָה
  english_pob_choice: a straight path
  chosen_korean: 곧은 길
  alternatives_korean:
  - 바른 길
  - 곧바른 길
  - 안전한 여정
  lexicon: HALOT
  rationale: 직역상 ‘곧은 길/곧은 path’이며, 본문의 비유적 긴장을 살리기 위해 ‘곧은 길’을 선택했습니다. '바른 길'로 좁히면 도덕적 의미가 앞서기 쉽고, '안전한 여정'은 비유를 약화시킵니다.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  english_pob_choice: for us, for our little ones, and for all our possessions
  chosen_korean: 우리와 우리 어린아이들과 우리의 모든 소유를 위해
  alternatives_korean:
  - 우리와 우리 자녀들과 우리의 모든 소유를 위해
  - 우리와 우리 부양가족들과 우리의 모든 재산을 위해
  lexicon: HALOT
  rationale: טף는 어린아이들/의존자들을 가리키지만, 여기서는 여행 공동체의 취약한 구성원을 포함하므로 ‘어린아이들’이 자연스럽고, רְכוּשׁ은 소유/재산의 물질적 의미를 살려 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: 금식 동사의 관용구적 의미
  chosen_reading: ‘스스로 낮추고’로 번역해 금식이 내포하는 자기 겸비를 드러냈습니다.
  alternative_readings:
  - ‘스스로 괴롭게 하고’로 직역할 수 있습니다.
  rationale: 히브리어 관용구를 한국어에서 오해 없이 전달해야 하므로, 금식의 영적 태도를 분명히 하되 신체적 가해로 오독되지 않게 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘곧은 길’의 의미 범위
  chosen_reading: 여정의 안전만이 아니라 하나님께서 인도하시는 올바른 길까지 포괄하도록 ‘곧은 길’을 유지했습니다.
  alternative_readings:
  - ‘바른 길’
  - ‘안전한 여정’
  rationale: 문맥상 여행의 보호를 포함하지만, 히브리어 직유는 더 넓게 ‘곧음/정직함/올바름’의 이미지를 담으므로 의미를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3
