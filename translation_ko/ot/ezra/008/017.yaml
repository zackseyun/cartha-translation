revisions:
- from: 내가 그들을 우두머리 이도에게, 곧 카시피아라는 곳에 있는 그들에게 보냈습니다. 나는 그들의 입에 말을 넣어, 카시피아라는 곳에 있는 이도와 그의 형제들, 곧 성전 봉사자들에게 우리 하나님의 집을 위해 섬길 사람들을 우리에게 데려오라고 말하게 했습니다.[a][b]
  to: 내가 그들을 카시피아라는 곳의 우두머리 이도에게 보냈습니다. 나는 그들의 입에, 카시피아라는 곳에 있는 이도와 그의 형제들, 곧 성전 봉사자들에게 우리 하나님의 집을 위해 봉사할 사람들을 우리에게 데려오라고 말할 말을 넣어 주었습니다.[a][b]
  rationale: 원문에 없는 복수 대명사를 제거하고, ‘카시피아라는 곳’이 이도 및 그의 형제들이 있는 장소라는 구문을 보존했습니다. 또한 사절들이 전달하도록 받은 말의 내용이 봉사 인력을 데려오라는 요청임을 분명히 했습니다. 느디님이라는 특정 집단과 추가로 요청되는 봉사 인력의 구별도 유지했습니다.
