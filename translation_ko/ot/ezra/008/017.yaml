  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
  footnotes:
  - marker: a
    text: Or “the Nethinim,” a recognized class of temple servants attached to sanctuary service.
    reason: lexical_alternative
  - marker: b
    text: “Ministers” here means those who serve in the temple, not necessarily holders of a later formal religious office.
    reason: cultural_note
translation:
  language: ko
  text: 내가 그들을 우두머리 이도에게, 곧 카시피아라는 곳에 있는 그들에게 보냈습니다. 나는 그들의 입에 말을 넣어, 카시피아라는 곳에 있는 이도와 그의 형제들, 곧 성전 봉사자들에게 우리 하나님의 집을 위해 섬길 사람들을 우리에게 데려오라고 말하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전 봉사자들’은 느디님으로 불리는, 성전 봉사에 속한 알려진 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘섬길 사람들’은 후대의 공식 교회 직분이 아니라 성전에서 봉사할 사람들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה
  english_pob_choice: And I sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 내가 데려냈습니다
  - 내가 내보냈습니다
  lexicon: HALOT
  rationale: 히필형 יצא의 문맥상 ‘보내다/파견하다’가 자연스럽고, 왕실·행정적 파견 상황을 한국어로도 분명하게 전달합니다.
- source_word: אִדּוֹ הָרֹאשׁ
  english_pob_choice: Iddo, the chief
  chosen_korean: 우두머리 이도
  alternatives_korean:
  - 지도자 이도
  - 수장 이도
  lexicon: HALOT
  rationale: הָרֹאשׁ는 문자적으로 ‘머리’이지만 여기서는 책임자 칭호이므로, 행정적 리더를 드러내는 ‘우두머리’가 가장 직접적입니다.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  english_pob_choice: at the place Casiphia
  chosen_korean: 카시피아라는 곳에 있는
  alternatives_korean:
  - 카시피아라는 곳에서
  - 카시피아에 있는
  lexicon: HALOT
  rationale: ‘그 곳’이라는 설명어를 살리되 한국어 어순에 맞게 옮겨, 지명과 장소 표지를 함께 보존했습니다.
- source_word: הַנְּתוּנִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 성전 일꾼들
  - 성전 종들
  - 느디님
  lexicon: HALOT
  rationale: Ezra의 נתינים는 성전 봉사에 속한 특정 집단이므로 기능을 드러내는 번역을 택했고, 전통 음역 ‘느디님’은 주석으로 돌리는 것이 현대 독자에게 더 투명합니다.
- source_word: מְשָׁרְתִים
  english_pob_choice: ministers
  chosen_korean: 섬길 사람들
  alternatives_korean:
  - 봉사자들
  - 사역자들
  - 종들
  lexicon: HALOT
  rationale: 이 단어는 성전에서 실제로 봉사하는 사람들을 가리키므로, 후대 교회 직분인 ‘사역자’보다 중립적이고 문맥에 맞는 ‘섬길 사람들’로 옮겼습니다.
- source_word: לְבֵית אֱלֹהֵינוּ
  english_pob_choice: for the house of our God
  chosen_korean: 우리 하나님의 집을 위해
  alternatives_korean:
  - 우리 하나님의 성전을 위해
  - 우리 하나님의 집에
  lexicon: HALOT
  rationale: ‘하나님의 집’이라는 히브리어 표현을 유지해 성전의 종교적·언약적 뉘앙스를 보존했습니다.
theological_decisions:
- issue: הַנְּתוּנִים와 מְשָׁרְתִים의 구분
  chosen_reading: 성전 봉사자들 / 섬길 사람들
  alternative_readings:
  - 느디님 / 봉사자들
  - 성전 일꾼들 / 사역자들
  rationale: 두 표현을 모두 ‘봉사’로 평평하게 만들지 않고, 하나는 특정 집단명, 다른 하나는 기능적 요청으로 구분해 본문의 행정적·성전적 구도를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘섬길 사람들’의 직분성 약화 방지
  chosen_reading: 직분 용어 대신 문맥적 기능 표현
  alternative_readings:
  - 사역자들
  - 성직자들
  rationale: 본문은 후대 교회 직제를 말하는 것이 아니라 성전 봉사를 위한 인력 요청이므로, 교회 제도 용어로 오해되지 않게 했습니다.
  doctrine_reference: Translation philosophy §6
