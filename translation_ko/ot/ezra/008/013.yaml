revisions:
- from: 아도니감의 자손 가운데 마지막 사람들은 이러합니다. 곧 그들의 이름은 엘리벨렛과 여이엘과 스마야이며, 그들과 함께한 사람은 남자 육십 명이었습니다.[a]
  to: 아도니감의 자손 가운데 마지막 무리는[a] 이러합니다. 그들의 이름은 엘리벨렛, 여이엘, 스마야이며, 그들과 함께 남자 육십 명이었습니다.
  rationale: The revision preserves the Hebrew list structure and its limited ambiguity while using idiomatic modern Korean. It removes the added implication that the sixty males were specifically persons who accompanied the named leaders, improves the rendering of the disputed descriptor, and moves the footnote marker to its proper lexical anchor.
