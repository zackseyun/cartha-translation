base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
  footnotes:
  - marker: a
    text: Or 'the latter ones' or 'the last.' The Hebrew likely identifies this as the final group from the line of Adonikam, possibly in distinction from an earlier group listed elsewhere.
    reason: lexical_alternative
translation:
  language: ko
  text: 아도니감의 자손 가운데 마지막 사람들은 이러합니다. 곧 그들의 이름은 엘리벨렛과 여이엘과 스마야이며, 그들과 함께한 사람은 남자 육십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후반 사람들’, ‘마지막 사람들’입니다. 히브리어는 아도니감 계열의 마지막 무리를 가리키는 것으로 보이며, 앞서 기록된 다른 집단과 대비될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי אֲדֹנִיקָם
  english_pob_choice: And from the sons of Adonikam
  chosen_korean: 아도니감의 자손 가운데
  alternatives_korean:
  - 아도니감의 아들들 가운데
  - 아도니감의 후손 가운데
  - 아도니감 집안에서
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 문자적으로 ‘아들들’이지만 집단 전체를 가리킬 수 있어 ‘자손 가운데’로 옮겼습니다. 고유명사 아도니감은 음역을 유지했습니다.
- source_word: אַחֲרֹנִים
  english_pob_choice: the last ones
  chosen_korean: 마지막 사람들은
  alternatives_korean:
  - 후자들입니다
  - 나중 사람들입니다
  - 마지막 자들입니다
  lexicon: HALOT
  rationale: 이 표현은 단순한 수량이 아니라 아도니감 계열의 ‘마지막/후속 무리’라는 구분을 드러냅니다. 한국어에서는 명단 문맥에 맞게 자연스럽게 ‘마지막 사람들’로 풀었습니다.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  english_pob_choice: and these were their names
  chosen_korean: 곧 그들의 이름은 이러합니다
  alternatives_korean:
  - 그리고 이들은 그들의 이름입니다
  - 이것이 그들의 이름입니다
  lexicon: HALOT
  rationale: 명단 도입 공식으로서, 히브리어의 간결한 열거 기능을 한국어에서 자연스럽게 살리기 위해 ‘곧’과 현재형 서술을 사용했습니다.
- source_word: הַזְּכָרִים
  english_pob_choice: males
  chosen_korean: 남자 육십 명
  alternatives_korean:
  - 수컷 육십 마리
  - 남성 육십 명
  - 남자들 육십 명
  lexicon: HALOT
  rationale: זְכָרִים는 성별 표지로서 ‘남자들’보다 ‘남자’가 더 정확하며, 인원 집계이므로 ‘육십 명’을 붙여 한국어 문장으로 자연화했습니다.
theological_decisions:
- issue: 명단 서술의 체감 register
  chosen_reading: 서술체로 평이하게 옮겨, 족보/행정 목록의 건조한 정보성을 유지했습니다.
  alternative_readings:
  - 보다 문어적인 ‘이들이니’
  - 더 성경식인 어순 재배열
  rationale: 이 절은 신학적 진술보다 귀환자 명단의 사실 전달이 중심이므로, 과도한 운율화나 해석적 장식을 피했습니다.
  doctrine_reference: Ezra의 귀환 공동체 명단은 역사적·공동체적 기록으로 읽는 것이 기본입니다.
