  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
  footnotes:
  - marker: a
    text: Hebrew reads 'with him' (singular), though some translations smooth this to 'with them' because two names are mentioned.
    reason: lexical_alternative
  - marker: b
    text: Some textual traditions and ancient versions reflect a different second name here; the Masoretic Text reads 'Zabbud.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 비그왜의 아들들 중에서는 웃대와 잡둡이 있었으며, 그들과 함께 남자 70명이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '그와 함께'의 단수형을 쓰지만, 두 이름이 함께 언급되므로 의미상 복수로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본 전통과 고대 역본은 둘째 이름을 달리 전하며, 마소라 본문은 '잡둡'을 읽습니다.
    reason: textual_variant
