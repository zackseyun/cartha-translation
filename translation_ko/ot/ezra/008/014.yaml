    text: 히브리어는 문자적으로 ‘그와 함께’라는 단수형을 씁니다. 앞에 두 이름이 언급되어 있어 일부 번역은 이를 ‘그들과 함께’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본 전통과 고대 역본은 둘째 이름을 달리 전하며, 마소라 본문은 ‘잡둡’을 읽습니다.
