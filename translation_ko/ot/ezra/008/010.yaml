    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들
  alternatives_korean:
  - 그리고 …의 후손
  - 그리고 …의 자손
  lexicon: HALOT
  rationale: 계보·명단 문맥에서 בְּנֵי는 혈통 집단을 가리키므로, 한국어에서도 ‘아들들/아들’의 계보적 표현을 살리되, 앞의 מִ를 반영해 목록 속 한 분파를 나타내도록 옮겼습니다.
- source_word: שְׁלוֹמִית
  english_pob_choice: Shelomith
  chosen_korean: 스헬로밋
  alternatives_korean:
  - 셀로밋
  - 쉘로밋
  lexicon: 고유명사 음역
  rationale: 히브리어 자음형에 더 가까운 음역을 택해 고유명사성을 유지했습니다.
- source_word: בֶּן יוֹסִפְיָה
  english_pob_choice: the son of Josiphiah
  chosen_korean: 곧 요시비야의 아들
  alternatives_korean:
  - 요시피야의 아들
  - 요시바의 아들
  lexicon: HALOT
  rationale: בֶּן은 단순 소속이 아니라 셀로밋을 더 구체화하는 계보적 동격이므로 ‘곧’으로 풀어 연결했고, יוֹסִפְיָה는 한국어 음역 관례에 따라 옮겼습니다.
- source_word: מֵאָה וְשִׁשִּׁים הַזְּכָרִים
  english_pob_choice: 160 males
  chosen_korean: 160명의 남자
  alternatives_korean:
  - 160명의 수컷
  - 160명의 남성
  lexicon: HALOT
  rationale: הַזְּכָרִים는 성별을 가리키는 일반 명사이므로 ‘남자’로 옮겼고, 목록의 수를 자연스럽게 드러내기 위해 수사 뒤에 ‘명’을 보탰습니다.
theological_decisions:
- issue: 명단 문맥에서 בְּנֵי의 집단성 보존
  chosen_reading: 개인보다 가문/분파를 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘후손’으로 일반화
  - 개인 이름만 남기고 집단 표지를 약화
  rationale: 스라서 문맥은 귀환 공동체의 구성 단위를 세는 목록이므로, 집단적 혈통 표지를 약화시키지 않는 번역이 본문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 본문-역사 문맥 보존
- issue: הַזְּכָרִים의 성별 표시
  chosen_reading: ‘남자’로 옮겨 성별 수치를 분명히 했습니다.
  alternative_readings:
  - ‘사람’으로 완화
  - ‘남성’으로 격식화
  rationale: 히브리어는 단순 인원수가 아니라 남성 표기를 사용하므로, 목록의 통계적 정보와 원문의 구체성을 유지하는 것이 적절합니다.
  doctrine_reference: 원문 정보 보존
