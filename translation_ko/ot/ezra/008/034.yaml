  - 무게로
  - 저울로
  lexicon: HALOT
  rationale: מִשְׁקָל은 무게를 뜻하므로, 앞 구와 평행을 이루는 방식으로 ‘무게대로’라고 옮겨 계수와 계량의 대응을 살렸습니다.
