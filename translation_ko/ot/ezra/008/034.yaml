theological_decisions:
- issue: 회계·검수 행위의 표현을 지나치게 해석하지 않을지
  chosen_reading: 본문의 단순한 계수·계량·기록 절차를 그대로 드러내는 행정적 표현으로 옮겼습니다.
  alternative_readings:
  - 헌물의 정결성과 질서를 강조하는 해석적 표현
  - ‘검사되었다’처럼 심사 의미를 덧붙이는 표현
  rationale: 본문은 신학적 논평보다 전달된 물품이 수량과 무게로 확인되고 문서화되었음을 보고하는 서술이므로, 해석을 과도하게 덧입히지 않는 것이 원문에 충실합니다.
  doctrine_reference: 성전 봉헌물 관리와 기록의 공적 투명성
- issue: כָּל הַמִּשְׁקָל의 처리
  chosen_reading: ‘그 모든 무게’로 옮겨 전체 합계를 암시하되, 지나친 수학적 용어인 ‘총무게’는 피했습니다.
  alternative_readings:
  - 총무게
  - 전체 무게
  - 모든 무게
  rationale: 히브리어의 직역 가능성과 한국어의 자연스러움 사이에서, 합계의 의미를 유지하면서도 본문이 말하는 ‘무게 전체’라는 직관을 보존했습니다.
  doctrine_reference: 문맥상 행정 기록의 완결성
