  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
  footnotes:
  - marker: a
    text: Or “helped” / “assisted”; the Hebrew verb literally means “lifted up” or “carried,” here in the sense of giving support.
    reason: lexical_alternative
  - marker: b
    text: “Beyond the River” is the Persian administrative term for the region west of the Euphrates.
    reason: cultural_note
  - marker: c
    text: Or “the temple of God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕의 조서들을 왕의 사트라프들과 강 건너편 지역의 총독들에게 전달하였고, 그들은 백성과 하나님의 집을 도왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강 건너편 지역’은 페르시아 행정 용어로, 유브라데 강 서쪽 지역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘도왔습니다’로 옮긴 히브리어 동사는 문자적으로 ‘들어 올리다’, ‘메다’를 뜻하며, 여기서는 지원하거나 돕는다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  english_pob_choice: they delivered
  chosen_korean: 전달하였고
  alternatives_korean:
  - 주었고
  - 건네주었고
  lexicon: HALOT
  rationale: 공식 문서인 왕의 조서를 상급 행정 당국에 넘기는 상황이므로, 단순한 ‘주다’보다 공식적 전달을 드러내는 ‘전달하다’가 적절합니다.
- source_word: דָּתֵי הַמֶּלֶךְ
  english_pob_choice: the king’s decrees
  chosen_korean: 왕의 조서
  alternatives_korean:
  - 왕의 법령
  - 왕의 칙령
  lexicon: HALOT
  rationale: 페르시아 행정 문맥의 공식 명령을 가리키므로, 한국어에서는 ‘조서’가 가장 자연스럽고 행정적 성격도 잘 살립니다.
- source_word: עֵבֶר הַנָּהָר
  english_pob_choice: Beyond the River
  chosen_korean: 강 서쪽 지방
  alternatives_korean:
  - 강 건너편
  - 유브라데 강 너머
  lexicon: HALOT
  rationale: 이 표현은 유브라데 강 서쪽의 페르시아 행정구역을 가리키므로, 지리·행정적 의미를 풀어 ‘강 서쪽 지방’으로 옮겼습니다.
- source_word: וְנִשְּׂאוּ
  english_pob_choice: they supported
  chosen_korean: 도왔습니다
  alternatives_korean:
  - 지탱하였습니다
  - 붙들어 주었습니다
  - 지원하였습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로는 ‘들어 올리다/메다’이지만, 여기서는 사람과 하나님의 집에 대한 실제적 지원을 뜻하므로 과도하게 문자적이지 않게 ‘도왔다’로 옮겼습니다.
