revisions:
- from: 우리는 아하와 강에서 떠나 첫째 달 열둘째 날에 예루살렘으로 가게 되었습니다[a]. 우리 하나님의 손이 우리 위에 있었으므로, 그분은 원수의 손과 길 위의 매복한 자들로부터 우리를 건져 주셨습니다.
  to: 우리는 첫째 달 열이틀에 예루살렘으로 가기 위해 아하와 강에서 떠났습니다. 우리 하나님의 손이 우리 위에 있었고, 그분은 원수와 길에서 매복하는 자의 손에서 우리를 건져 주셨습니다[a].
  rationale: 목적 부정사와 서술 접속을 원문에 맞게 바로잡고, 매복 관련 분사의 단수·인칭적 기본 의미를 유지했습니다. 하나님의 ‘손’과 원수의 ‘손’의 대응 이미지는 보존하되, 한국어에서 자연스럽게 ‘원수와 길에서 매복하는 자의 손에서’로 표현했습니다. 각주를 관련 어휘에 정확히 연결하고 한국어 독자를 위한 설명으로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:20Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘가게 되었습니다’는 원문의 목적을 나타내는 부정사(‘예루살렘으로 가기 위해’)보다 불필요하게 상황의 전개·결과를 암시합니다. 또한 וְיַד ... הָיְתָה와 וַיַּצִּילֵנוּ는 인과절이 아니라 이어지는 서술이므로 ‘있었고’로 연결하는 것이 충실합니다. אָרֵב은 단수 분사로서 기본적으로 ‘매복하는 자/숨어 기다리는 자’이며, 이를 복수 ‘매복한 자들’로 확정할 근거는 없습니다.
  naturalness: ‘첫째 달 열이틀’, ‘예루살렘으로 가기 위해’, ‘길에서 매복하는 자의 손에서’는 현대 표준 한국어의 합쇼체 서술문으로 자연스럽습니다. ‘우리 위에 있었으므로’는 직역적 이미지 자체는 보존하나, 인과관계를 덧붙이므로 ‘우리 위에 있었고’로 고쳤습니다.
  terminology: ‘아하와 강’, ‘우리 하나님의 손’, ‘건져 주셨습니다’는 지명 음역, 하나님의 ‘손’이라는 핵심 이미지를 보존하며, נצל의 구출 의미를 적절히 전달합니다. 각주 표지는 본문에서 어휘 대안이 발생하는 ‘매복하는 자’에 붙여야 하므로 예루살렘 뒤의 잘못된 위치에서 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘예루살렘으로 가게 되었습니다’
    rationale: לָלֶכֶת는 목적을 나타내는 부정사입니다. ‘가게 되었습니다’는 원문에 없는 결과성 또는 비자발성을 더할 수 있습니다.
  - severity: medium
    issue: ‘우리 하나님의 손이 우리 위에 있었으므로’
    rationale: 접속사 וְ는 다음 구출 행위와의 단순한 서술적 연결을 나타냅니다. ‘으므로’는 원문보다 명시적인 인과관계를 부가합니다.
  - severity: low
    issue: ‘길 위의 매복한 자들’ 및 각주 표지 위치
    rationale: אָרֵב은 단수 분사이므로 일반적 단수 ‘매복하는 자’가 더 가깝습니다. 또한 해당 어휘의 대안을 설명하는 각주는 ‘예루살렘’이 아니라 그 표현에 연결되어야 합니다.
  - severity: low
    issue: 각주의 ‘영어 관용’ 언급
    rationale: 한국어 번역 각주는 영어의 관용을 기준으로 설명하기보다 히브리어 분사의 인칭적 기본 의미와 한국어 번역상 가능한 추상적 표현을 설명해야 합니다.
  revised_text: 우리는 첫째 달 열이틀에 예루살렘으로 가기 위해 아하와 강에서 떠났습니다. 우리 하나님의 손이 우리 위에 있었고, 그분은 원수와 길에서 매복하는 자의 손에서 우리를 건져 주셨습니다[a].
