source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
  footnotes:
  - marker: a
    text: Or 'from the ambusher' or 'from one lying in wait.' The Hebrew participle can refer either to the person lying in wait or, by English idiom, to the danger of ambush.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 아하와 강에서 떠나 첫째 달 열둘째 날에 예루살렘으로 가게 되었습니다[a]. 우리 하나님의 손이 우리 위에 있었으므로, 그분은 원수의 손과 길 위의 매복한 자들로부터 우리를 건져 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매복하는 자로부터’ 혹은 ‘숨어 기다리는 자로부터’. 히브리어 분사형은 매복하는 사람을 가리킬 수도 있고, 영어 관용으로는 매복의 위험 자체를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  english_pob_choice: Then we set out
  chosen_korean: 우리는 … 떠나
  alternatives_korean:
  - 우리는 … 출발했습니다
  - 우리는 … 길을 떠났습니다
  lexicon: HALOT
  rationale: 여행 문맥의 נסע는 천막을 걷고 이동을 시작한다는 뜻이어서, 자연스러운 현대 한국어의 ‘떠나’로 옮겼습니다. 앞의 서술 진행도 한국어 어순에 맞게 처리했습니다.
- source_word: מִנְּהַר אֲהֲוָא
  english_pob_choice: from the river Ahava
  chosen_korean: 아하와 강에서
  alternatives_korean:
  - 아하와 강으로부터
  - 아하와 강에서부터
  lexicon: HALOT
  rationale: נָהָר는 그대로 ‘강’이며, 지명은 음역해 ‘아하와’로 두었습니다. 한국어에서는 출발 지점을 자연스럽게 ‘~에서’로 나타냈습니다.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  english_pob_choice: and the hand of our God was upon us
  chosen_korean: 우리 하나님의 손이 우리 위에 있었으므로
  alternatives_korean:
  - 우리 하나님의 손이 우리 위에 있었고
  - 우리 하나님의 손이 우리 위에 임했으므로
  lexicon: HALOT
  rationale: 하나님의 보호를 가리키는 ‘손’의 관용적 이미지를 보존했습니다. ‘우리 위에’는 원문의 위에 있음이라는 이미지를 살리면서 한국어로도 자연스럽습니다.
- source_word: וַיַּצִּילֵנוּ מִכַּף אוֹיֵב וְאוֹרֵב
  english_pob_choice: and he delivered us from the hand of the enemy and the ambushes
  chosen_korean: 그분은 원수의 손과 길 위의 매복한 자들로부터 우리를 건져 주셨습니다
  alternatives_korean:
  - 그분은 원수의 손과 길 위의 매복으로부터 우리를 구해 주셨습니다
  - 그분은 원수의 손과 길에서 숨어 기다리는 자들로부터 우리를 건져 주셨습니다
  lexicon: HALOT
  rationale: ‘손’은 오יֵב의 통제력을 나타내는 표현이므로 유지했고, אָרֵב은 영어 POB의 메모처럼 ‘매복한 자들’이라는 인적 의미를 살렸습니다. ‘건져 주셨습니다’는 נצל의 구출 의미와 서술체에 잘 맞습니다.
theological_decisions:
- issue: 하나님의 손이라는 신적 보호의 관용구
  chosen_reading: 이미지를 풀어버리지 않고 ‘우리 하나님의 손이 우리 위에 있었으므로’로 유지했습니다.
  alternative_readings:
  - 하나님이 우리를 보호하셨으므로
  - 하나님이 우리를 지켜 주셨으므로
  rationale: 에스라-느헤미야에서 반복되는 신적 호의와 보호의 모티프를 유지하려면 관용구를 보존하는 편이 더 적절합니다. 의미는 충분히 전달되면서도 본문의 신학적 표지를 남깁니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
