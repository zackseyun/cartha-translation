    rationale: 원문은 은·금·그릇이 ‘우리 하나님의 집을 위한 헌납물’임을 동격으로 설명하고, 이어서 그 헌납 주체를 관계절로 밝힙니다. 문장을 분리하면 이 구조를 명료하게 재현할 수 있습니다.
