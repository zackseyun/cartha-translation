id: EZR.8.25
reference: Ezra 8:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אשקול/ה לָ/הֶ֔ם אֶת הַ/כֶּ֥סֶף וְ/אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כֵּלִ֑ים תְּרוּמַ֣ת בֵּית אֱלֹהֵ֗י/נוּ הַ/הֵרִ֨ימוּ֙ הַ/מֶּ֨לֶךְ֙ וְ/יֹעֲצָ֣י/ו וְ/שָׂרָ֔י/ו וְ/כָל יִשְׂרָאֵ֖ל הַ/נִּמְצָאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
  footnotes:
  - marker: a
    text: Or "the offering for the house of our God." The Hebrew term can denote a contribution set apart for sacred use.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들에게 은과 금과 그릇을 달아 주었습니다. 곧 우리 하나님 집을 위한 예물로서, 왕과 그의 조언자들과 그의 관리들과 거기에 있던 온 이스라엘이 드린 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  english_pob_choice: And I weighed out to them
  chosen_korean: 나는 그들에게 … 달아 주었습니다
  alternatives_korean:
  - 나는 그들에게 … 저울질해 주었습니다
  - 나는 그들에게 … 무게를 달아 주었습니다
  lexicon: HALOT
  rationale: שקל의 핵심은 ‘무게를 달다/달아 주다’이므로, 단순히 ‘주었다’보다 분배·인도를 드러내는 표현으로 옮겼습니다.
- source_word: הַכֶּסֶף / הַזָּהָב / הַכֵּלִים
  english_pob_choice: the silver, the gold, and the vessels
  chosen_korean: 은과 금과 그릇
  alternatives_korean:
  - 은과 금과 기물
  - 은과 금과 기구
  lexicon: HALOT
  rationale: 성전 헌납물 목록이므로 물질명은 ‘은, 금’으로, כליים은 현대 한국어에서 자연스러운 ‘그릇’으로 옮겨 과도한 제의 용어화를 피했습니다.
- source_word: תְּרוּמַת בֵּית אֱלֹהֵינוּ
  english_pob_choice: the contribution for the house of our God
  chosen_korean: 우리 하나님 집을 위한 예물
  alternatives_korean:
  - 우리 하나님 집을 위한 헌납물
  - 우리 하나님 집의 헌물
  lexicon: HALOT
  rationale: תרומה는 성별된 헌납이라는 뜻을 살리되, ‘예물’이 현대 한국어에서 공적·종교적 바침을 무리 없이 드러내므로 선택했습니다.
- source_word: הֵרִימוּ
  english_pob_choice: had offered
  chosen_korean: 드린 것입니다
  alternatives_korean:
  - 바친 것입니다
  - 헌납한 것입니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘들어 올리다’는 제의적 헌납을 가리키므로, 문맥상 자연한 ‘드리다’로 옮기되 완료된 행위임을 밝혔습니다.
- source_word: יֹעֲצָיו / שָׂרָיו
  english_pob_choice: his counselors, his officials
  chosen_korean: 그의 조언자들과 그의 관리들
  alternatives_korean:
  - 그의 모사들과 그의 관원들
  - 그의 신하들과 그의 관리들
  lexicon: HALOT
  rationale: 왕실 행정 맥락에서 יועצים는 ‘조언자들’, שרים는 혈통적 ‘방백’보다 직무를 드러내는 ‘관리들’이 더 정확합니다.
theological_decisions:
- issue: תְּרוּמָה를 제의 제물로 볼지 일반 헌납물로 볼지
  chosen_reading: ‘예물’로 번역하되 성전 집을 위한 성별된 헌납임을 문맥으로 유지했습니다.
  alternative_readings:
  - ‘헌물’로 번역
  - ‘헌납물’로 번역
  rationale: 이 구절은 제사 규정의 특정 제물보다 성전용 헌납 재산을 말하므로, 지나치게 기술적인 제의어를 피하면서도 ‘거룩하게 구별된 바침’의 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean, not archaic or overly technical)
