  source_fidelity: 히브리어의 목록 공식(‘아스갓의 아들들 중에서 … 학가단의 아들 요하난, 그와 함께 남자 110명’)은 대체로 반영되어 있습니다. 그러나 초안의 ‘요하난 …이 있었고’는 원문에 없는 서술을 보태며, 두 각주 표지가 각각 관련 어구에 붙어 있지 않아 대안의 적용 범위가 불분명합니다.
