source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י עַזְגָּ֔ד יוֹחָנָ֖ן בֶּן הַ/קָּטָ֑ן וְ/עִמּ֕/וֹ מֵאָ֥ה וַ/עֲשָׂרָ֖ה הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
  footnotes:
  - marker: a
    text: Or 'descendants of Azgad.' The Hebrew 'sons of' can denote a broader family line, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Or 'son of the younger' if הַקָּטָן is taken descriptively rather than as the proper name Hakkatan.
    reason: alternative_reading
translation:
  language: ko
  text: 아스갓의 아들들[a] 가운데서는 학가단[b]의 아들 요하난과 그와 함께한 남자 110명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들들’은 직계 아들만이 아니라 아스갓 계열의 후손들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘학가단의 아들’은 ‘더 어린 이의 아들’이라는 서술적 표현으로 번역할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  english_pob_choice: And from the sons of
  chosen_korean: 아스갓의 아들들 중에서는
  alternatives_korean:
  - 아스갓의 후손들 중에서는
  - 아스갓 집안에서
  lexicon: HALOT
  rationale: מין + בְּנֵי는 목록에서 한 계통/집단을 가리키므로, 혈통 목록의 형식을 살리기 위해 ‘아들들 중에서는’로 옮겼습니다. 여기서는 보다 자연스러운 한국어 흐름을 위해 서두를 재배열했습니다.
- source_word: יוֹחָנָן
  english_pob_choice: Johanan
  chosen_korean: 요하난
  alternatives_korean:
  - 여호하난
  - 요한
  lexicon: SBLGNT/modern transliteration convention
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했습니다. 기존 성서 관용형 ‘요한’보다 히브리어 원형에 더 가깝게 보존했습니다.
- source_word: בֶּן הַקָּטָן
  english_pob_choice: son of Hakkatan
  chosen_korean: 학가단의 아들
  alternatives_korean:
  - 학가단의 아들
  - 작은 자의 아들
  - 작은 자의 아들
  lexicon: HALOT
  rationale: 이 표현은 이름 목록의 문맥에서 관형적 별칭보다는 고유명 ‘학가단’으로 읽는 편이 자연스럽습니다. 따라서 ‘학가단의 아들’로 옮겨 이름 구조를 보존했습니다.
- source_word: הַזְּכָרִים
  english_pob_choice: males
  chosen_korean: 남자
  alternatives_korean:
  - 남성
  - 수컷
  lexicon: HALOT
  rationale: זְכָרִים는 성별을 가리키는 말이므로, 인원 집계 문맥에서는 ‘남자들’보다 간결한 ‘남자’가 한국어에서 자연스럽고 의미도 유지합니다.
