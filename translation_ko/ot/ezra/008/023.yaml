  - 그분께서 우리 기도를 들으셨습니다
  lexicon: WLC/표준 어휘
  rationale: עתר의 수동/피동 뉘앙스를 현대 한국어에서는 '간구를 들어주셨다'로 옮기면, 단순 회신보다 하나님이 호의롭게 응답하신 뜻을 살릴 수 있습니다.
theological_decisions:
- issue: 하나님의 응답 동사 וַיֵּעָתֵר의 번역
  chosen_reading: 그분께서 우리의 간구를 들어주셨습니다
  alternative_readings:
  - 그분께서 우리에게 응답하셨습니다
  - 그분께서 우리 간구를 받아주셨습니다
  rationale: 본문은 금식과 구함에 대한 하나님의 호의적 응답을 말합니다. '들어주셨습니다'는 그 응답의 긍정성을 유지하면서도 과도하게 교리화하지 않습니다.
  doctrine_reference: '번역 원칙: 원문 의미 보존과 현대적 가독성'
