  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
  footnotes:
  - marker: a
    text: Or 'one hundred silver vessels valued at one hundred talents.' The Hebrew is elliptical at this point, and the sense is that the silver vessels together amounted to a valuation of one hundred talents.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들의 손에 은 육백오십 달란트와 값이 백 달란트인 은그릇과 금 백 달란트를 달아 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 부분이 생략적으로 표현되어 있습니다. 은그릇의 수량이 아니라 그 은그릇들의 총가치가 백 달란트라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  english_pob_choice: I weighed out
  chosen_korean: 달아 주었습니다
  alternatives_korean:
  - 달아 주었습니다
  - 저울질하여 주었습니다
  lexicon: HALOT
  rationale: 문맥이 단순한 계량이 아니라 인수·인계의 성격을 가지므로, 무게를 달아 건네는 뜻을 자연스럽게 살렸습니다.
- source_word: עַל יָדָם
  english_pob_choice: into their hands
  chosen_korean: 그들의 손에
  alternatives_korean:
  - 그들에게
  - 그들의 책임 아래
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 이미지를 유지하면서도 한국어로는 전달 행위를 자연스럽게 나타냈습니다.
- source_word: כְּלֵי כֶסֶף
  english_pob_choice: silver vessels
  chosen_korean: 은그릇
  alternatives_korean:
  - 은그릇들
  - 은으로 된 기구들
  lexicon: HALOT
  rationale: 성전 재물 목록의 맥락에서 כְּלִי는 ‘그릇/용기’가 가장 자연스럽고, ‘은그릇’이 간결하게 재질을 드러냅니다.
- source_word: מֵאָה לְכִכָּרִים
  english_pob_choice: one hundred talents worth of silver vessels
  chosen_korean: 백 달란트 값
  alternatives_korean:
  - 백 달란트의 값어치
  - 백 달란트에 해당하는 값
  lexicon: HALOT
  rationale: 히브리어가 생략된 평가 표현이므로, ‘값’을 써서 은그릇의 총가치가 백 달란트임을 과도한 풀이 없이 드러냈습니다.
theological_decisions:
