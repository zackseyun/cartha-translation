base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
  footnotes:
  - marker: a
    text: Or "men." The Hebrew specifically says "the males," emphasizing sex rather than using a more general term for people.
    reason: lexical_alternative
translation:
  language: ko
  text: '모압의 자손 가운데서: 세라히야의 아들 엘리여호에나이와 함께 남자 이백 명이 있었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자들.” 히브리어는 더 일반적인 “사람들”이 아니라 성별을 분명히 하는 “남자들/남성들”을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  english_pob_choice: From the sons of
  chosen_korean: …의 자손 가운데서
  alternatives_korean:
  - …의 아들들 가운데서
  - …의 후손들 가운데서
  lexicon: HALOT
  rationale: 족보·명단 문맥이므로 집합적 혈통 표현을 살리되, 한국어에서는 전치사적 출발점이 자연스러운 ‘가운데서’로 풀어 명단 도입을 유지했습니다.
- source_word: פַּחַת מוֹאָב
  english_pob_choice: Pahath-moab
  chosen_korean: 모압
  alternatives_korean:
  - 파핫-모압
  - 파핫 모압
  lexicon: HALOT
  rationale: 이 절의 핵심은 가문/계열 표지이므로, 한국어에서는 본문 가독성을 위해 ‘모압의 자손’으로 자연화하고 별도의 고유명 음역은 생략했습니다. 다만 원문 계열명은 본래 고유명입니다.
- source_word: אֶלְיְהוֹעֵינַי
  english_pob_choice: Eliehoenai
  chosen_korean: 엘리여호에나이
  alternatives_korean:
  - 엘리에호에나이
  - 엘리호에나이
  lexicon: HALOT
  rationale: 인명은 음역이 원칙이며, 히브리어 자음군과 모음 흐름을 반영해 한국어 음역으로 옮겼습니다.
- source_word: הַזְּכָרִים
  english_pob_choice: males
  chosen_korean: 남자
  alternatives_korean:
  - 남성
  - 사내들
  lexicon: HALOT
  rationale: 원문은 일반적인 ‘사람들’이 아니라 성별을 명시한 표현이므로, POB의 ‘males’ 취지를 살려 성별 표지가 드러나는 ‘남자’로 옮겼습니다.
