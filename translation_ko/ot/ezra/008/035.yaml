base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
  footnotes:
  - marker: a
    text: Or 'on behalf of all Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of the exile,' an idiom referring to the returned exiles.
    reason: cultural_note
  - marker: c
    text: Hebrew 'All of it was a burnt offering to the LORD.' The wording is preserved as in the source text, even though the verse also mentions male goats for a sin offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 포로 생활에서 돌아온 자들, 곧 유배에서 돌아온 자손들이 이스라엘의 하나님께 번제물을 드렸습니다. 곧 모든 이스라엘을 위하여 수송아지 열두 마리, 숫양 아흔여섯 마리, 어린양 일흔일곱 마리, 그리고 속죄제물로 숫염소 열두 마리였습니다. 모든 것은 야훼께 드리는 번제였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 이스라엘을 위하여’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘유배의 자손들’은 귀환한 유배민을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘모든 것이 야훼께 드리는 번제였다’라고 말합니다. 앞에서 숫염소의 속죄제가 언급되지만, 본문은 이 요약 진술을 그대로 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  english_pob_choice: Those who had come from the captivity
  chosen_korean: 포로 생활에서 돌아온 자들
  alternatives_korean:
  - 포로에서 온 이들
  - 감금에서 나온 자들
  lexicon: HALOT
  rationale: הַבָּאִים은 특정 집단을 가리키는 실질분사이고, מֵהַשְּׁבִי는 구체적 포로 상태를 뜻하므로, 한국어에서는 귀환 완료의 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: בְנֵי הַגּוֹלָה
  english_pob_choice: the sons of the exile
  chosen_korean: 유배에서 돌아온 자손들
  alternatives_korean:
  - 유배의 자손들
  - 포로 귀환자들
  lexicon: HALOT
  rationale: 직역하면 ‘유배의 아들들’이지만, 관용적으로는 귀환 유배민을 가리키는 표현이므로, 독자가 신분적·역사적 정체성을 이해하도록 풀어 옮겼습니다.
- source_word: הִקְרִיבוּ עֹלוֹת
  english_pob_choice: offered burnt offerings
  chosen_korean: 번제물을 드렸습니다
  alternatives_korean:
  - 번제를 드렸습니다
  - 번제들을 바쳤습니다
  lexicon: HALOT
  rationale: הִקְרִיבוּ는 제의 문맥에서 ‘드리다/바치다’가 자연스럽고, עֹלוֹת는 번제의 복수형이므로 한국어에서는 제물성을 살려 ‘번제물’로 옮겼습니다.
- source_word: צְפִירֵי חַטָּאת
  english_pob_choice: male goats as a sin offering
  chosen_korean: 속죄제물로 숫염소 열두 마리
  alternatives_korean:
  - 죄제물로 숫염소 열두 마리
  - 속죄제를 위한 숫염소 열두 마리
  lexicon: HALOT
  rationale: צְפִירֵי는 숫염소, חַטָּאת는 속죄제 범주를 가리키므로 기능을 분명히 하되, 제사 용어를 한국어 성경 문체에 맞게 정리했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약 이름을 드러냈습니다. 제사 동사의 수혜 방향은 ‘께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 마지막 절의 총괄 진술과 앞선 속죄제 언급 사이의 긴장
  chosen_reading: 앞의 숫염소 속죄제 언급과 뒤의 ‘모든 것은 야훼께 드리는 번제’라는 종결 진술을 함께 유지했습니다.
  alternative_readings:
  - 번제 목록만 가리키는 것으로 완화해 번제물로만 정리하기
  - 텍스트의 긴장을 해소하도록 의역하기
  rationale: 히브리어 본문이 실제로 병치하는 표현을 평탄화하지 않고 그대로 살려, 제사의 요약 진술이 지닌 문법적·신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
