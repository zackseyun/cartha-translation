  source_fidelity: 초안은 제물의 종류와 수량, ‘모든 이스라엘을 위하여’ 및 마지막의 긴장된 요약 진술을 대체로 충실히 반영합니다. 그러나 בְנֵי הַגּוֹלָה는 ‘유배에서 돌아온 자손들’이라기보다 문자적으로 ‘유배민의 자손들’이며, 문맥상 포로 귀환 공동체를 가리키는 관용적 명칭입니다. 또한 원문의 병렬적 호칭을 살리면서 각주를 해당 어구에 연결하는 편이 좋습니다.
  naturalness: 합쇼체 문체는 적절하나, ‘포로 생활에서 돌아온 자들, 곧 유배에서 돌아온 자손들’은 ‘돌아온’이 중복되고 ‘자손들’의 수식 관계도 다소 부자연스럽습니다. 목록은 콜론으로 도입하고, 마지막 요약문을 별도 문장으로 처리하면 더 자연스럽고 명료합니다.
