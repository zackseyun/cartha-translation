  - 하사비야
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 음역했고, 영어 POB의 Hashabiah에 대응되도록 하였습니다.
- source_word: יְשַׁעְיָה
  english_pob_choice: Jeshaiah
  chosen_korean: 예사야
  alternatives_korean:
  - 여사야
  - 예샤야
  lexicon: HALOT
  rationale: 이름은 일반적으로 알려진 선지자 이름 ‘이사야’와 구별되는 인명으로, 여기의 영어 음역 Jeshaiah에 맞춰 한국어 음역을 사용했습니다.
- source_word: מִבְּנֵי מְרָרִי
  english_pob_choice: from the sons of Merari
  chosen_korean: 메라리의 아들들 가운데서 온
  alternatives_korean:
  - 메라리의 자손 가운데서 온
  - 메라리 사람들 가운데서 온
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘메라리의 아들들’ 구조를 살리되, 한국어에서 자연스럽도록 출처를 나타내는 ‘가운데서 온’으로 풀어 genealogical idiom을 보존했습니다.
- source_word: אֶחָיו וּבְנֵיהֶם
  english_pob_choice: his brothers and their sons
  chosen_korean: 그의 형제들과 그들의 아들들
  alternatives_korean:
  - 그의 형제들과 그들의 자녀들
  - 그의 친족들과 그들의 아들들
  lexicon: HALOT
  rationale: ‘형제들’과 ‘아들들’의 혈연 목록을 그대로 살렸습니다. 영어 POB가 지적하듯 여기의 ‘형제들’은 반드시 생물학적 형제만이 아니라 씨족/가문 내부의 남성 친족을 가리킬 수 있으므로, 문맥을 과도하게 좁히지 않았습니다.
