revisions:
- from: 그리고 하사뱌와 함께 있는 예사야는, 메라리의 아들들 가운데서 온 그의 형제들과 그들의 아들들이니 모두 스무 명입니다.[a][b]
  to: 메라리 자손 가운데서는 하사뱌와, 그와 함께 여사야와 그의 형제들과 그들의 아들들, 모두 스무 명을 데려왔습니다.[a][b]
  rationale: 앞 절에서 계속되는 ‘데려왔다’를 보충하여 히브리어 목적어 목록의 문법과 스무 명이라는 총계를 분명히 했습니다. ‘그와 함께’를 독립 병렬구로 처리했으며, ‘그의 형제들’의 지시 대상에 관한 원문의 여지를 유지했습니다. 각주는 각각 ‘메라리 자손’ 및 ‘형제들’ 뒤에 붙여 해당 표현과 직접 연결됩니다.
