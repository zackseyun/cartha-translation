source:
  edition: WLC
  text: וְ/אֶת חֲשַׁבְיָ֔ה וְ/אִתּ֥/וֹ יְשַֽׁעְיָ֖ה מִ/בְּנֵ֣י מְרָרִ֑י אֶחָ֥י/ו וּ/בְנֵי/הֶ֖ם עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
  footnotes:
  - marker: a
    text: Or 'of the Merarites.' The Hebrew reads literally 'from the sons of Merari.'
    reason: lexical_alternative
  - marker: b
    text: '''His brothers'' likely refers to clan-brothers or close male relatives within the Merarite line, not necessarily only biological brothers.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 하사뱌와 함께 있는 예사야는, 메라리의 아들들 가운데서 온 그의 형제들과 그들의 아들들이니 모두 스무 명입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메라리 사람들 가운데서 온’입니다. 히브리어는 문자적으로 ‘메라리의 아들들 가운데서 온’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘형제들’은 반드시 생물학적 형제만이 아니라 씨족 안의 가까운 남성 친족을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고 또한
  lexicon: HALOT
  rationale: 목록을 이어 주는 접속의 기능을 살려 한국어에서는 자연스러운 나열 연결어인 ‘그리고’로 옮겼습니다.
- source_word: חֲשַׁבְיָה
  english_pob_choice: Hashabiah
  chosen_korean: 하사뱌
