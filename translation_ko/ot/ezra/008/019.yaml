review_pass:
  verdict: revise
  source_fidelity: 현 초안은 히브리어 명단의 목적어 열거를 ‘예사야는 … 스무 명입니다’라는 서술문으로 바꾸어, 하사뱌·예사야·형제들·그들의 아들들이 한 집단으로 계수된다는 구조를 흐립니다. 앞 절에서 이어지는 ‘데려왔다’의 동사를 한국어에 보충하여 목적어 명단 구조를 보존하는 편이 정확합니다.
  naturalness: ‘하사뱌와 함께 있는 예사야는’은 예사야만 하사뱌와 동행한다는 관계를 부자연스럽게 주제화하며, 뒤의 ‘그의 형제들’의 연결도 불명료하게 만듭니다. 명단식 병렬 구조로 옮기면 현대 한국어 성경 문체에 더 자연스럽습니다.
  terminology: 고유명사는 한국어 성경 음역 관행에 맞춰 ‘하사뱌’, ‘여사야’, ‘메라리’를 사용했습니다. 히브리어의 ‘아들들’은 족보적 표현을 보존하되, 본문에서는 자연스러운 ‘자손’으로 옮기고 각주에서 직역을 밝혔습니다. ‘형제들’은 본문의 잠재적 친족적 넓이를 각주로만 설명하여 과도하게 해석하지 않았습니다.
  issues:
  - severity: high
    issue: 명단의 문법 구조가 서술문으로 재구성됨
    rationale: 원문은 앞 절의 동사에 연결되는 목적어 목록입니다. 초안의 ‘예사야는 … 모두 스무 명입니다’는 예사야를 주제로 만들고 수량의 적용 범위를 불명료하게 합니다.
  - severity: medium
    issue: ‘함께 있는’의 부자연스러운 관계 표현
    rationale: וְאִתּוֹ는 ‘그와 함께’라는 병렬적 동반 관계입니다. ‘함께 있는 예사야’는 수식 관계를 과도하게 만들며 명단 문체에 맞지 않습니다.
  - severity: low
    issue: 여사야 음역
    rationale: Jeshaiah(יְשַׁעְיָה)는 한국어 성경의 통상 표기인 ‘여사야’가 더 적절하며, 선지자 이사야와도 구별됩니다.
