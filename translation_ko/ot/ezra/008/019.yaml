translation:
  language: ko
  text: 메라리 자손 가운데서는 하사뱌와, 그와 함께 여사야와 그의 형제들과 그들의 아들들, 모두 스무 명을 데려왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메라리 사람들 가운데서 온’입니다. 히브리어는 문자적으로 ‘메라리의 아들들 가운데서’라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘형제들’은 반드시 생물학적 형제만이 아니라 씨족 안의 가까운 남성 친족을 가리킬 가능성이 큽니다.
    reason: cultural_note
