  text: 'Now these are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
  footnotes:
  - marker: a
    text: Or “their genealogy” or “those enrolled by genealogy.” The Hebrew term refers to a genealogical registration or record, not merely ancestry in the abstract.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이것은 바벨론에서 올라온 사람들 가운데, 아르타크세르크세스 왕의 치세에 나와 함께 올라온 그들의 조상들의 집안 우두머리들과 그들의 족보입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Now these are
  chosen_korean: 이제 이것은
  alternatives_korean:
  - 그리고 이것들은
  - 이것들은
  lexicon: HALOT
  rationale: 새 단락을 여는 지시 표현으로 이해하여, 현대 한국어에서 자연스러운 서두인 ‘이제 이것은’으로 옮겼습니다.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  english_pob_choice: the heads of their fathers’ houses
  chosen_korean: 그들의 조상들의 집안 우두머리들
  alternatives_korean:
  - 그들의 아버지들의 집들의 우두머리들
  - 그들의 족장들
  lexicon: HALOT
  rationale: 족보·행정 맥락의 관용구로서 혈통 집단의 대표자들을 가리키므로, 문자적이면서도 이해 가능한 ‘집안 우두머리들’로 옮겼습니다.
- source_word: וְהִתְיַחְשָׂם
  english_pob_choice: their genealogy
  chosen_korean: 그들의 족보
  alternatives_korean:
  - 그들의 족보 등록
  - 그들의 계보 기록
  lexicon: HALOT
  rationale: 이 항목은 단순한 혈통이 아니라 등록된 계보 기록을 뜻하므로, 한국어에서도 관용적이면서 기록성을 보존하는 ‘족보’로 번역했습니다.
- source_word: הָעֹלִים עִמִּי
  english_pob_choice: those who went up with me
  chosen_korean: 나와 함께 올라온 사람들
  alternatives_korean:
  - 나와 함께 올라간 사람들
  - 나와 함께 귀환한 사람들
  lexicon: HALOT
  rationale: ‘올라가다’는 예루살렘/유다로의 귀환을 가리키는 표준 표현이므로, 종교적·지리적 함의를 살려 ‘올라온’으로 옮겼습니다.
theological_decisions:
- issue: 바벨론에서 예루살렘으로의 귀환을 가리키는 ‘올라가다’의 방향성
  chosen_reading: 단순한 이동이 아니라 예루살렘으로 향하는 귀환·상승의 표현으로 유지했습니다.
  alternative_readings:
  - ‘돌아온’으로 완화
  - ‘이주한’으로 일반화
  rationale: 히브리어 עלה의 관용적 종교-지리 의미를 보존해야 본문의 역사적·신학적 방향성이 살아납니다.
  doctrine_reference: 포로 귀환과 시온 상승의 성경적 서사
