reference: Ezra 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֡/ה לֶ/אֱלִיעֶ֡זֶר לַ/אֲרִיאֵ֡ל לִֽ֠/שְׁמַעְיָה וּ/לְ/אֶלְנָתָ֨ן וּ/לְ/יָרִ֜יב וּ/לְ/אֶלְנָתָ֧ן וּ/לְ/נָתָ֛ן וְ/לִ/זְכַרְיָ֥ה וְ/לִ/מְשֻׁלָּ֖ם רָאשִׁ֑ים וּ/לְ/יוֹיָרִ֥יב וּ/לְ/אֶלְנָתָ֖ן מְבִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
  footnotes:
  - marker: a
    text: Or 'leaders' for 'heads' (Hebrew literally 'heads').
    reason: lexical_alternative
  - marker: b
    text: '''Men of understanding'' may also be rendered ''men of insight'' or ''learned men.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 엘리에셀, 아리엘, 스마야, 엘르아단, 야립, 엘르아단, 나단, 스가랴, 므술람을 불렀습니다. 이들은 우두머리들이었고, 또 요야립과 엘르아단을 불렀는데, 이들은 분별력이 있는 사람들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우두머리들’은 문자적으로는 ‘머리들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘분별력이 있는 사람들’은 ‘통찰력이 있는 사람들’ 또는 ‘배운 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  english_pob_choice: Then I sent for
  chosen_korean: 내가 …를 불렀습니다
  alternatives_korean:
  - 내가 …를 보냈습니다
  - 내가 …를 불러 모았습니다
  lexicon: HALOT
  rationale: 이 문맥의 ל+인명들은 단순 발송보다 소집/호출의 뜻이 분명하므로, 한국어는 자연스럽게 ‘부르다’로 옮겨 소환의 의미를 살렸습니다.
- source_word: רָאשִׁים
  english_pob_choice: heads
  chosen_korean: 우두머리들
  alternatives_korean:
  - 머리들
  - 지도자들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘heads’를 살리되, 한국어에서는 뜻이 드러나도록 ‘우두머리들’로 옮겨 구체성과 이해 가능성을 함께 확보했습니다.
- source_word: מְבִינִים
  english_pob_choice: men of understanding
  chosen_korean: 분별력이 있는 사람들
  alternatives_korean:
  - 이해력이 있는 사람들
  - 통찰력이 있는 사람들
  - 지식 있는 사람들
  lexicon: HALOT
  rationale: 분사 בין의 핵심은 단순 지식보다 분별/이해이므로, 기능을 드러내는 ‘분별력이 있는 사람들’이 문맥상 가장 자연스럽습니다.
- source_word: יוֹיָרִיב
  english_pob_choice: Joiarib
  chosen_korean: 요야립
  alternatives_korean:
  - 조이아립
  - 여호야립
  lexicon: HALOT
  rationale: 이 고유명사는 한국어에서 보편적으로 굳어진 표기가 없으므로 현대 음역으로 옮겼습니다.
- source_word: אֶלְנָתָן
  english_pob_choice: Elnathan
  chosen_korean: 엘르아단
  alternatives_korean:
  - 엘나단
  - 엘르나단
  lexicon: HALOT
  rationale: 히브리어 고유명사의 표준 음역을 따라 반복되는 동일 이름을 그대로 보존했습니다.
theological_decisions:
- issue: 라스트 구의 apposition 구조
  chosen_reading: ‘요야립과 엘르아단을 불렀는데, 이들은 분별력이 있는 사람들이었습니다’로 처리해 마지막 두 이름에만 붙는 수식을 살렸습니다.
  alternative_readings:
  - ‘요야립과 엘르아단, 분별력이 있는 사람들’을 직역적으로 나열
  - 앞부분의 ‘우두머리들’과 병렬로 모두 동일한 직분처럼 처리
  rationale: 원문은 마지막 구가 앞의 ‘우두머리들’과 구별되는 별도 설명으로 읽히므로, 한국어에서도 그 대조를 분명히 해야 합니다.
  doctrine_reference: 문법-구문상의 구별 보존
