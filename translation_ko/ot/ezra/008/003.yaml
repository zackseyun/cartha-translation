base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
  footnotes:
  - marker: a
    text: Or 'were registered by genealogy 150 males.' The Hebrew verb refers to formal genealogical enrollment or reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 스가냐의 자손 가운데, 바로 바르오스의 자손인 스가랴와 함께 기재된 남자는 150명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족보로 등록된 150명’으로도 옮길 수 있습니다. 히브리어 동사는 공식적인 족보 등재나 계수의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי שְׁכַנְיָה מִבְּנֵי פַרְעֹשׁ
  english_pob_choice: From the sons of Shecaniah, from the sons of Parosh
  chosen_korean: 스가냐의 자손 가운데, 바로 바르오스의 자손인
  alternatives_korean:
  - 스가냐의 자손 가운데, 바르오스의 자손인
  - 스가냐 자손 중 바르오스 자손인
  lexicon: HALOT
  rationale: 두 개의 מִן+בְּנֵי 구문은 족보 목록 안의 하위 집단을 가리키므로, ‘~의 자손 가운데’로 옮겨 계보적 소속을 살렸습니다.
- source_word: זְכַרְיָה
  english_pob_choice: Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 즈가랴
  - 제카랴
  lexicon: 표준 성경 인명 표기
  rationale: 히브리어 אישי명은 한국어 성경에서 널리 통용되는 ‘스가랴’가 가장 자연스럽고 인지 가능성이 높습니다.
- source_word: הִתְיַחֵשׂ
  english_pob_choice: were enrolled by genealogy
  chosen_korean: 기재된
  alternatives_korean:
  - 족보에 등록된
  - 계보로 등록된
  - 족보에 기록된
  lexicon: HALOT
  rationale: 동사는 단순한 동거가 아니라 족보적·공적 명부에 올라 있음을 뜻하므로, 현대 한국어에서는 간결하게 ‘기재된’으로 옮기되 등록 의미를 유지했습니다.
- source_word: לִזְכָרִים
  english_pob_choice: males
  chosen_korean: 남자는
  alternatives_korean:
  - 남성은
  - 수컷은
  - 사내는
  lexicon: HALOT
  rationale: 히브리어는 성별을 명시하므로, 숫자와 결합한 자연스러운 한국어 서술로 ‘남자는’이라 하여 성별 표지를 분명히 했습니다.
