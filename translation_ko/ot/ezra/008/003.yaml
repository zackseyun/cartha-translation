translation:
  language: ko
  text: 스가냐의 자손 가운데 바르오스의 자손으로는 스가랴가 있었고, 그와 함께 족보에 등록된[a] 남자가 150명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계보에 따라 등록된’으로 옮길 수 있습니다. 히브리어 동사는 공식적인 족보 등록 또는 계보에 따른 산정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי שְׁכַנְיָה מִבְּנֵי פַרְעֹשׁ
  english_pob_choice: From the sons of Shecaniah, from the sons of Parosh
  chosen_korean: 스가냐의 자손 가운데, 바로 바르오스의 자손인
  alternatives_korean:
