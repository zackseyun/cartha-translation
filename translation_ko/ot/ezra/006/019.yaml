    issue: ‘유배에서 돌아온’이 본문에 없는 귀환 정보를 명시합니다.
    rationale: הַגּוֹלָה는 유배 또는 유배 공동체를 뜻하며, 이 구절의 표현 자체는 ‘돌아온’을 말하지 않습니다. 앞뒤 문맥의 귀환 상황을 본문 번역에 추가하지 않고, 유배 공동체를 가리키는 표현으로 옮기는 것이 더 안전합니다.
  revised_text: 유배 공동체의 사람들은 첫째 달 열나흗날에 유월절을 지켰습니다.
