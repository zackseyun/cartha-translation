translation:
  language: ko
  text: 유배에서 돌아온 자손들은 첫째 달 열나흗날에 유월절을 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: kept
  chosen_korean: 지켰습니다
  alternatives_korean:
  - 행했습니다
  - 행하였습니다
  - 지켰습니다
  lexicon: HALOT
  rationale: 유월절을 목적어로 둘 때 단순한 ‘하다/행하다’보다 규례를 준수하는 의미가 살아 있어 ‘지켰습니다’가 가장 자연스럽고 source-near합니다.
- source_word: בְנֵי הַגּוֹלָה
  english_pob_choice: the sons of the exile
  chosen_korean: 유배에서 돌아온 자손들은
  alternatives_korean:
  - 유배의 아들들은
  - 유배자들은
  - 유배에서 돌아온 자손들은
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘유배의 아들들’을 그대로 살리기보다, 한국어에서는 공동체를 가리키는 자연스러운 표현으로 풀어 주되 ‘돌아온’은 문맥상 드러나는 귀환 공동체를 반영합니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스하
  - 유월절 제사
  - 유월절
  lexicon: HALOT
  rationale: 이 문맥에서는 절기 전체를 가리키므로 한국어 표준 교회 용례이면서도 본문의 범위를 과도하게 좁히지 않는 ‘유월절’이 적절합니다.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: on the fourteenth day of the first month
  chosen_korean: 첫째 달 열나흗날에
  alternatives_korean:
  - 첫째 달의 열나흗날에
  - 첫째 달 열나흗날
  - 첫째 달의 열네 번째 날에
  lexicon: HALOT
  rationale: 날짜 공식은 한국어 관용에 맞게 ‘열나흗날’로 옮기되, ‘첫째 달’로 חודש의 순번을 보존해 원문의 달력 정보를 정확히 반영합니다.
theological_decisions:
- issue: ‘sons of the exile’의 공동체 정체성
  chosen_reading: 특정 개인이 아니라 귀환한 유배 공동체 전체를 가리키는 집합 표현으로 읽었습니다.
  alternative_readings:
  - 유배의 남자들로 제한해서 읽기
  - 단순히 ‘유배자들’로 일반화하기
  rationale: בְנֵי הַגּוֹלָה는 족속적/공동체적 표현이므로, 성별을 좁히지 않으면서도 귀환 공동체의 역사적 정체성을 드러내는 번역이 본문 의도에 가장 부합합니다.
  doctrine_reference: 공동체 정체성 및 구속사적 귀환 이해
- issue: 유월절의 준수 의미
  chosen_reading: 단순한 행사 수행이 아니라 규례에 따른 절기 준수로 이해했습니다.
  alternative_readings:
  - 행사했다
  - 거행했다
  rationale: וַיַּעֲשׂוּ가 제의 대상과 결합할 때는 ‘준수하다/지키다’의 관용적 의미가 강하므로, 의례적 순종의 뉘앙스를 보존했습니다.
  doctrine_reference: 율법 준수와 절기 관행
