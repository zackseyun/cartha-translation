  source_fidelity: ‘유배에서 돌아온’은 이 절의 히브리어 בְנֵי הַגּוֹלָה에 명시되어 있지 않은 정보를 보탭니다. 이 표현은 ‘유배/포로 공동체의 아들들’이라는 집합적 관용구이며, 문맥상 귀환 공동체를 가리킬 수 있으나 이 절만으로 ‘돌아온’을 번역문에 확정적으로 넣지는 않는 편이 좋습니다. 유월절을 ‘지켰습니다’와 날짜를 ‘첫째 달 열나흗날에’로 옮긴 것은 원문에 충실합니다.
  naturalness: ‘유배 공동체의 사람들’은 한국어에서 집합적 정체성을 자연스럽게 드러내며, 원문의 성별 비한정적 공동체 용법도 적절히 반영합니다. 문장은 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘유월절’과 ‘지켰습니다’는 한국어 성서 용례 및 제의 문맥에 알맞습니다. ‘첫째 달 열나흗날’은 자연스러운 날짜 표현입니다.
  issues:
