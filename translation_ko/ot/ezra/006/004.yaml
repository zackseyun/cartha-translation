  - 새로운 목재
  lexicon: HALOT
  rationale: אָע는 목재/나무를 가리키지만 건축용 재료 맥락에서는 ‘목재’가 더 정확하고, חֲדַת의 ‘새’도 유지했습니다.
- source_word: מִן בֵּית מַלְכָּא
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕실에서
  - 왕의 궁전에서
  lexicon: HALOT
  rationale: 직역은 ‘왕의 집’이지만 행정 문맥에서는 왕실 재정 또는 왕궁을 뜻할 가능성이 높아, POB의 주석 취지를 반영해 ‘왕궁에서’로 옮겼습니다.
- source_word: תִּתְיְהִב
  english_pob_choice: let ... be given
  chosen_korean: 지급하게 하십시오
  alternatives_korean:
  - 주게 하십시오
  - 주도록 하십시오
  - 내리게 하십시오
  lexicon: HALOT
  rationale: 왕의 칙령 형식에 맞게 수동적 허가가 아니라 행정적 집행 명령으로 자연스럽게 표현했습니다.
