  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִדְבָּכִ֞ין דִּי אֶ֤בֶן גְּלָל֙ תְּלָתָ֔א וְ/נִדְבָּ֖ךְ דִּי אָ֣ע חֲדַ֑ת וְ/נִ֨פְקְתָ֔/א מִן בֵּ֥ית מַלְכָּ֖/א תִּתְיְהִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
  footnotes:
  - marker: a
    text: Or “three courses of hewn stone.”
    reason: lexical_alternative
  - marker: b
    text: “The king’s house” likely refers to the royal treasury or royal funds.
    reason: cultural_note
translation:
  language: ko
  text: 석재를 다듬은 돌로 세 층, 새 목재로 한 층으로 하고, 그 비용은 왕궁에서 지급하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִדְבָּכִין
  english_pob_choice: layers
  chosen_korean: 층
  alternatives_korean:
  - 줄
  - 단
  lexicon: HALOT
  rationale: 건축 문맥에서 구조적 층위를 가리키므로 한국어로는 자연스럽고 현대적인 ‘층’이 적절합니다.
- source_word: אֶבֶן גְּלָל
  english_pob_choice: dressed stone
  chosen_korean: 석재를 다듬은 돌
  alternatives_korean:
  - 다듬은 돌
  - 다듬은 석재
  - 깎은 돌
  lexicon: HALOT
  rationale: 문맥상 건축용으로 가공된 돌을 뜻하므로, ‘다듬은 돌’의 의미를 살리되 한국어 명사구로 자연스럽게 옮겼습니다.
- source_word: אָע חֲדַת
  english_pob_choice: new timber
  chosen_korean: 새 목재
  alternatives_korean:
  - 새 나무
  - 새 목재로 된 것
  - 새로운 목재
  lexicon: HALOT
  rationale: אָע는 목재/나무를 가리키지만 건축용 재료 맥락에서는 ‘목재’가 더 정확하고, חֲדַת의 ‘새’도 유지했습니다.
- source_word: מִן בֵּית מַלְכָּא
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕실에서
  - 왕의 궁전에서
  lexicon: HALOT
  rationale: 직역은 ‘왕의 집’이지만 행정 문맥에서는 왕실 재정 또는 왕궁을 뜻할 가능성이 높아, POB의 주석 취지를 반영해 ‘왕궁에서’로 옮겼습니다.
- source_word: תִּתְיְהִב
  english_pob_choice: let ... be given
  chosen_korean: 지급하게 하십시오
  alternatives_korean:
  - 주게 하십시오
  - 주도록 하십시오
  - 내리게 하십시오
  lexicon: HALOT
  rationale: 왕의 칙령 형식에 맞게 수동적 허가가 아니라 행정적 집행 명령으로 자연스럽게 표현했습니다.
