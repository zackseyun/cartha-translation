  - 단
  lexicon: HALOT
  rationale: 건축 문맥에서 구조적 층위를 가리키므로 한국어로는 자연스럽고 현대적인 ‘층’이 적절합니다.
- source_word: אֶבֶן גְּלָל
  english_pob_choice: dressed stone
  chosen_korean: 석재를 다듬은 돌
  alternatives_korean:
  - 다듬은 돌
  - 다듬은 석재
  - 깎은 돌
  lexicon: HALOT
  rationale: 문맥상 건축용으로 가공된 돌을 뜻하므로, ‘다듬은 돌’의 의미를 살리되 한국어 명사구로 자연스럽게 옮겼습니다.
- source_word: אָע חֲדַת
  english_pob_choice: new timber
  chosen_korean: 새 목재
  alternatives_korean:
  - 새 나무
