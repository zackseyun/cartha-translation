  to: 이제 ‘강 건너’ 지방 총독 다뜨내와 스달보스내와 그대들의 동료들, 곧 ‘강 건너’에 있는 아파르사키 사람들은 그곳에서 멀리 떨어져 있으십시오.[a][b][c]
  rationale: 원문에 있는 행정 지역명과 명령의 강도를 유지하되, 논쟁적인 집단명은 음역하여 해석의 불확실성을 보존했습니다. 한국어의 현대적 공적 합쇼체를 유지하고, 통용되는 고유명사 표기 및 복수 소유를 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: 원문은 다뜨내를 ‘강 건너’의 총독으로, 스달보스내와 그들의 동료들을 ‘강 건너’에 있는 아파르사키 사람들로 덧붙여 지칭하고, 그들에게 그곳에서 멀리 떨어져 있으라고 명합니다. 초안의 ‘페르시아의 관리들’은 가능한 해석이지만 아람어 집단명 אֲפַרְסְכָיֵא를 단정적으로 해석하여 본문의 불확실성을 줄입니다. 또한 고유명사 표기는 통용 성경 표기와 거리가 있습니다.
  naturalness: 합쇼체 명령형 ‘있으십시오’는 적절합니다. 다만 ‘강 건너 지방의 총독’보다 행정 직함으로서 ‘강 건너 지방 총독’이 자연스럽고, 대상이 복수이므로 ‘그대들의 동료들’이 초안의 ‘그대의 동료들’보다 정확합니다. 행정 지역명임을 보이기 위해 ‘강 건너’를 따옴표로 처리했습니다.
  terminology: 다뜨내와 스달보스내는 한국어 성경에서 널리 쓰이는 고유명사 표기를 따랐습니다. אֲפַרְסְכָיֵא는 의미를 ‘페르시아의 관리들’로 확정하지 않고 ‘아파르사키 사람들’로 음역하여 원문의 논쟁적 성격을 보존했습니다. 각주에서 ‘페르시아 관리들’이라는 가능한 해석을 제시합니다.
  issues:
  - severity: medium
    issue: 아파르사키 사람들을 ‘페르시아의 관리들’로 단정함
    rationale: 원문의 אֲפַרְסְכָיֵא는 음역되는 집단명이며 정확한 지시 대상 또는 기능이 논의됩니다. 영어 감사 기록도 음역 대안을 인정하므로, 본문에서 해석을 확정하기보다 음역하고 각주로 해석 가능성을 밝혀야 합니다.
  - severity: medium
    issue: 고유명사 표기 ‘다느닷’, ‘셧르-보즈내’
    rationale: 통용 한국어 성경 표기인 ‘다뜨내’, ‘스달보스내’와 현저히 달라 독자의 식별을 어렵게 합니다. 특히 ‘셧르-보즈내’는 שְׁתַר בּוֹזְנַי의 일반적 한국어 음역을 잘 반영하지 못합니다.
  - severity: low
    issue: 복수 소유 접미사의 수가 본문에 충분히 반영되지 않음
    rationale: וּכְנָוָתְהוֹן의 접미사는 복수이므로, 명령 대상 목록에 맞추어 ‘그대들의 동료들’로 옮기는 편이 정확합니다.
