id: EZR.6.6
reference: Ezra 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
  footnotes:
  - marker: a
    text: Or, more literally, 'be far from there.'
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' is the Persian administrative name for the province west of the Euphrates.'
    reason: cultural_note
  - marker: c
    text: The term rendered 'officials of Persia' may also be transliterated as 'Apharsachites.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 다느닷과 강 건너 지방의 총독 셧르-보즈내와 그대의 동료들, 곧 강 건너에 있는 페르시아의 관리들은 그곳에서 멀리 떨어져 있으십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거기서 멀리 있으십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강 건너’는 페르시아 행정명으로, 유프라테스강 서쪽 지역을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 이 표현은 ‘아파르사키 사람들’로 음역할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַן
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그러므로
  - 자, 이제
  lexicon: HALOT
  rationale: 새로운 왕명 전환을 알리는 담화 표지로, 한국어에서는 자연스럽게 명령의 도입을 여는 「이제」가 적절합니다.
- source_word: פַּחַת עֲבַר נַהֲרָה
  english_pob_choice: governor of the province Beyond the River
  chosen_korean: 강 건너 지방의 총독
  alternatives_korean:
  - 강 건너 총독
  - 저편 강의 총독
  lexicon: HALOT
  rationale: פַּחַת은 행정관/총독으로, עֲבַר נַהֲרָה는 제국 행정구역명인 ‘Beyond the River’를 가리키므로 이를 한국어로 풀어 옮겼습니다.
- source_word: שְׁתַר בּוֹזְנַי
  english_pob_choice: Shethar-bozenai
  chosen_korean: 셧르-보즈내
  alternatives_korean:
  - 세타르-보즈내
  - 셰타르-보즈내
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 방식에 따라 음역하고, 합성 이름의 하이픈 구조를 유지했습니다.
- source_word: וּכְנָוָתְהוֹן
  english_pob_choice: and your associates
  chosen_korean: 그대의 동료들
  alternatives_korean:
  - 그대의 동료들 및 동반자들
  - 그대의 동료들, 곧 동료 관리들
  lexicon: HALOT
  rationale: 2인칭 복수 소유가 붙은 ‘동료/동반자들’의 의미를 살리되, 왕의 직접 명령문에 맞게 한국어 존대 대상 표지인 ‘그대의’를 사용했습니다.
- source_word: אֲפַרְסְכָיֵא
  english_pob_choice: the officials of Persia
  chosen_korean: 페르시아의 관리들
  alternatives_korean:
  - 아파르사키 사람들
  - 페르시아 관료들
  lexicon: HALOT
  rationale: 이 용어는 단순 민족명보다 행정적 직무 집단을 가리킬 가능성이 크므로, POB의 해석을 따라 ‘관리들’로 뜻을 옮겼습니다.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  english_pob_choice: keep far away from there
  chosen_korean: 그곳에서 멀리 떨어져 있으십시오
  alternatives_korean:
  - 그곳에서 멀리 떨어져 있으시오
  - 거기서 물러나 있으십시오
  lexicon: HALOT
  rationale: 직역하면 ‘거기서 멀리 있으라’이지만, 한국어에서는 출입 금지의 왕명 뉘앙스를 자연스럽게 전달하는 명령형으로 옮겼습니다.
theological_decisions:
- issue: 왕명체의 한국어 화법과 존대 수준
  chosen_reading: 왕의 직접 명령으로서 문장 전체는 합쇼체로 유지하고, 명령형도 ‘-십시오’로 처리했습니다.
  alternative_readings:
  - 반말 명령형으로 직역
  - 더 공식적인 문어체로 완화
  rationale: 원문은 권위를 지닌 행정 명령이므로, 현대 한국어에서 공적·격식체로 기능하는 합쇼체가 가장 적절합니다.
  doctrine_reference: 본문의 서술/명령 화법 보존 원칙
