id: EZR.6.12
reference: Ezra 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
  footnotes:
  - marker: a
    text: Or 'has set his name there.' The Aramaic idiom refers to God's covenantal identification of the temple as the place associated with his name.
    reason: lexical_alternative
  - marker: b
    text: Or 'speedily.' The adverb can emphasize prompt execution; 'with all diligence' brings out both promptness and careful compliance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에 자기 이름을 두신 하나님께서, 이 조서를 변경하여 예루살렘에 있는 이 하나님의 집을 파괴하려고 손을 뻗는 어떤 왕이나 백성도 무너뜨리시기를 바랍니다. 나 다리오는 조서를 내렸습니다. 이 명령은 지체 없이 철저하게 시행되어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  english_pob_choice: has caused his name to dwell there
  chosen_korean: 그곳에 자기 이름을 두게 하신
  alternatives_korean:
  - 그곳에 자기 이름을 두신
  - 그곳에 자기 이름이 거하게 하신
  lexicon: HALOT
  rationale: ‘이름’을 두는 언약적 성소 표현을 살리되, 한국어에서는 ‘거하다’보다 ‘두다’가 더 자연스럽고 원문의 의도된 결속을 잘 드러냅니다.
- source_word: יְמַגַּר
  english_pob_choice: overthrow
  chosen_korean: 무너뜨리십니다
  alternatives_korean:
  - 뒤엎으십니다
  - 전복하십니다
  lexicon: HALOT
  rationale: 심판적 파괴를 뜻하므로 단순한 ‘파괴’보다 권력과 안전을 무너뜨리는 뉘앙스를 살린 ‘무너뜨리십니다’가 적절합니다.
- source_word: יִשְׁלַח יְדֵהּ
  english_pob_choice: stretches out his hand
  chosen_korean: 손을 뻗는
  alternatives_korean:
  - 손을 내미는
  - 손을 들어
  lexicon: HALOT
  rationale: 셈어적 관용구를 직역에 가깝게 살려, 어떤 왕이나 백성이 하나님 집을 해치려 직접 행동에 나서는 모습을 보존했습니다.
- source_word: לְהַשְׁנָיָה לְחַבָּלָה
  english_pob_choice: to alter this / to destroy this house of God
  chosen_korean: 바꾸거나 파괴하려고
  alternatives_korean:
  - 변경하거나 해치려고
  - 고치거나 무너뜨리려고
  lexicon: HALOT
  rationale: ‘alter’와 ‘destroy’의 두 동사를 구분해, 제의 질서를 변경하려는 시도와 성전 파괴를 함께 드러냈습니다.
- source_word: שָׂמֶת טְעֵם
  english_pob_choice: have issued a decree
  chosen_korean: 조서를 내렸습니다
  alternatives_korean:
  - 칙령을 내렸습니다
  - 법령을 선포했습니다
  lexicon: HALOT
  rationale: 페르시아 왕실의 공식 명령어이므로, 현대 한국어에서도 행정·법적 무게를 지닌 ‘조서’를 택했습니다.
- source_word: אָסְפַּרְנָא
  english_pob_choice: with all diligence
  chosen_korean: 지체 없이
  alternatives_korean:
  - 신속하게
  - 지체 없이 신중히
  lexicon: HALOT
  rationale: ‘즉시성’이 핵심이므로, 명령 집행의 촉박함을 가장 직접적으로 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 하나님이 ‘이름을 두신’ 성전-시온 신학 표현
  chosen_reading: 단순한 소유나 현존이 아니라, 하나님이 자기 이름을 두게 하신 언약적 표지로 유지했습니다.
  alternative_readings:
  - 그곳에 하나님이 계신
  - 그곳을 하나님께서 선택하신
  rationale: 본문의 ‘이름’ 표현은 하나님이 성전을 자신의 언약적 임재와 연결해 두셨다는 뜻을 담으므로, 이를 평범한 현존 표현으로 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 문장 끝의 왕적 명령문 처리
  chosen_reading: ‘그것은 지체 없이 집행되어야 합니다’로 권위 있는 명령의 법정적 어조를 살렸습니다.
  alternative_readings:
  - 그것을 빨리 시행하십시오
  - 그것을 반드시 곧바로 실행해야 합니다
  rationale: 페르시아 칙령의 공식성을 보존하면서도 한국어 합쇼체의 공적 명령체를 유지하기 위한 선택입니다.
  doctrine_reference: 공적 명령문/행정 문체 원칙
