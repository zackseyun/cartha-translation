revisions:
- from: 그리고 그곳에 자기 이름을 두게 하신 하나님께서, 이 예루살렘에 있는 하나님의 집을 바꾸거나 파괴하려고 손을 뻗는 어떤 왕이나 백성이라도 무너뜨리십니다. 나 다리오는 조서를 내렸습니다[b]; 그것은 지체 없이 집행되어야 합니다.
  to: 그곳에 자기 이름을 두신 하나님께서, 이 조서를 변경하여 예루살렘에 있는 이 하나님의 집을 파괴하려고 손을 뻗는 어떤 왕이나 백성도 무너뜨리시기를 바랍니다. 나 다리오는 조서를 내렸습니다. 이 명령은 지체 없이 철저하게 시행되어야 합니다.
  rationale: 원문의 기원적 저주 어조를 복원하고, ‘변경’의 목적어를 조서로 명시하여 성전 파괴와의 문법적·의미적 관계를 분명히 했습니다. 성전에 관한 ‘이름을 두신’ 관용구와 왕실 조서의 공식적 문체는 유지했으며, 마지막 부사는 신속성과 성실한 이행을 함께 반영했습니다. 영어 감사본의 각주 a는 영어의 ‘그곳’ 표현에 관한 대안이고, b는 본문 번역에 흡수되었으므로 한국어 본문에는 별도 각주가 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:23Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 원문의 저주/기원적 동사(‘하나님께서 … 무너뜨리시기를’)가 초안에서는 직설적 현재형 ‘무너뜨리십니다’가 되어 양태가 약화되었습니다. 또한 ‘변경하다’의 목적어는 성전 자체라기보다 앞서 제정된 조서·명령을 가리키며, 성전 파괴는 그 변경의 목적/결과로 이어집니다.
  naturalness: ‘그곳에 자기 이름을 두게 하신’은 뜻은 전달하지만 현대 한국어에서는 ‘자기 이름을 그곳에 두신’이 더 자연스럽습니다. 결말의 ‘그것은’은 지시 대상이 다소 모호하므로 ‘이 명령은’으로 명시하는 편이 행정 문맥에 맞습니다.
  terminology: ‘하나님의 집’, ‘조서’, ‘다리오’는 적절합니다. 아람어 성전-이름 관용구는 ‘이름을 그곳에 두신’으로 보존했습니다. אָסְפַּרְנָא의 신속성과 성실한 이행의 함의를 ‘지체 없이 철저하게’로 반영했습니다.
  issues:
  - severity: high
    issue: 기원/저주 표현이 직설적 현재형으로 번역됨
    rationale: יְמַגַּר는 이 왕실 저주 공식에서 하나님께 대한 기원적 표현으로 이해하는 것이 자연스럽습니다. ‘무너뜨리십니다’는 선언적 현재 사실처럼 들리므로 ‘무너뜨리시기를 바랍니다’로 옮겨야 합니다.
  - severity: high
    issue: ‘바꾸거나’가 성전을 직접 변경하는 것으로 연결됨
    rationale: לְהַשְׁנָיָה의 지시 대상은 문맥상 조서/명령이며, 이어지는 성전 파괴와 구별됩니다. ‘이 조서를 변경하여 … 성전을 파괴하려고’라고 명시하면 원문의 두 행위를 혼동하지 않습니다.
  - severity: medium
