source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
  footnotes:
  - marker: a
    text: 'Or ''The Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'from the impurity/defilement of the peoples of the land.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to them'; that is, they joined themselves to the returned community.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 자손들, 곧 포로에서 돌아온 자들과 그 땅의 민족들의 부정함에서 스스로를 분리한 모든 사람이 함께 먹고, 이스라엘의 하나님 야훼를 찾았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 자손들’은 곧 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부정함’은 제의적/도덕적 오염을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들에게’이지만, 문맥상 귀환 공동체에 합류함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: The sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  english_pob_choice: who had returned from the exile
  chosen_korean: 포로에서 돌아온 자들
  alternatives_korean:
  - 포로 생활에서 돌아온 사람들
  - 유배에서 돌아온 자들
  lexicon: HALOT
  rationale: 문맥상 귀환 공동체를 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘포로에서 돌아온’으로 옮겼습니다.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  english_pob_choice: from the uncleanness of the peoples of the land
  chosen_korean: 그 땅의 민족들의 부정함
  alternatives_korean:
  - 그 땅의 백성들의 부정함
  - 그 땅의 민족들의 더러움
  lexicon: HALOT
  rationale: טֻמְאָה의 제의적·도덕적 오염 의미를 살려 ‘부정함’으로 옮기고, גּוֹיֵי הָאָרֶץ는 ‘그 땅의 민족들’로 렌더링했습니다.
- source_word: לִדְרֹשׁ
  english_pob_choice: to seek
  chosen_korean: 찾았습니다
  alternatives_korean:
  - 구하려고 했습니다
  - 찾고자 했습니다
  lexicon: HALOT
  rationale: 하나님을 향한 דרשׁ는 단순 탐색보다 언약적 추구를 뜻하므로, 문맥상 목적절을 자연스럽게 살린 ‘찾았습니다’로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: to seek Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼를
  alternatives_korean:
  - 이스라엘의 하나님 여호와를
  - 이스라엘의 하나님 주님을
  lexicon: HALOT
  rationale: 원문 표제어 יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ‘이스라엘의 하나님’이라는 언약적 수식을 보존했습니다.
theological_decisions:
- issue: 추가 참여자들의 정체성
  chosen_reading: 본문은 귀환한 유다인들뿐 아니라, 그 땅의 민족들의 부정함에서 스스로를 분리한 사람들도 함께 식사에 참여했음을 넓게 말합니다.
  alternative_readings:
  - 이들을 개종한 이방인으로 특정하는 읽기
  - 이스라엘인 가운데 정결을 위해 분리한 사람들로 보는 읽기
  rationale: 히브리어 표현이 이 집단을 좁게 규정하지 않으므로, 번역도 그 열린 범위를 유지했습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존한다.
