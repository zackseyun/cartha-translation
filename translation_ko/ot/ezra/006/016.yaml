  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'and the rest of the exiles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손들과 제사장들과 레위 사람들과 포로 생활에서 돌아온 나머지 사람들이 이 하나님의 집 봉헌식을 기쁨으로 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘포로에서 돌아온 나머지 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  english_pob_choice: celebrated
  chosen_korean: 행했습니다
  alternatives_korean:
  - 지켰습니다
  - 봉헌했습니다
  - 거행했습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘하다’가 아니라 봉헌식을 예식으로 치른 뜻이므로, 자연스러운 한국어로 ‘행했습니다’라고 옮겼습니다. ‘봉헌했습니다’는 바로 뒤의 ‘봉헌식’과 겹쳐 다소 중복될 수 있어 피했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성들
  lexicon: HALOT
  rationale: 출발어의 집합 표현을 살리기 위해 직역에 가까운 ‘이스라엘 자손들’을 유지했습니다.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  english_pob_choice: and the rest of the sons of the exile
  chosen_korean: 포로 생활에서 돌아온 나머지 사람들
  alternatives_korean:
  - 그리고 포로들의 나머지
  - 그리고 포로에서 돌아온 나머지 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘포로의 자손들’이지만, 문맥상 귀환 공동체를 가리키므로 한국어에서는 의미를 분명히 하되 원뜻을 유지하도록 옮겼습니다. EN POB의 각주가 제시한 더 매끄러운 의미를 본문에 반영했습니다.
- source_word: בֵּית אֱלָהָא דְנָה
  english_pob_choice: this house of God
  chosen_korean: 이 하나님의 집
  alternatives_korean:
  - 이 성전
  - 이 하나님의 전
  lexicon: HALOT
  rationale: ‘house of God’를 교회적 관용어인 ‘성전’으로 바꾸지 않고, 히브리어/아람어의 이미지인 ‘하나님의 집’을 그대로 살렸습니다.
- source_word: בְּחֶדְוָה
  english_pob_choice: with joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐겁게
  - 기뻐하며
  lexicon: HALOT
  rationale: 전치사구를 한국어 부사어로 자연스럽게 풀어 ‘기쁨으로’라고 옮겼습니다.
theological_decisions:
- issue: ‘봉헌식’과 ‘하나님의 집’의 예전적·성전적 뉘앙스
  chosen_reading: 건물 일반이 아니라 하나님께 구별해 드린 예배 공간의 봉헌 행사로 이해해 번역했습니다.
  alternative_readings:
  - ‘이 성전의 봉헌’으로 더 교회적 용어를 사용한다
  - ‘이 집의 헌당’으로 보다 의례적 표현을 택한다
  rationale: 본문은 귀환 공동체가 성전을 하나님께 봉헌하는 장면이므로, 예식성과 성전성을 함께 드러내는 표현이 필요합니다. 다만 전통적 ‘성전’으로 고정하면 원문 이미지가 약해질 수 있어 ‘하나님의 집’을 유지했습니다.
  doctrine_reference: 성전 봉헌 본문에 대한 서술적 이해
