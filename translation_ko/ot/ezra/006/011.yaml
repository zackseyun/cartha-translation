id: EZR.6.11
reference: Ezra 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
  footnotes:
  - marker: a
    text: Or, 'he shall be hanged on it.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'a beam/timber shall be pulled out from his house.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally, 'dunghill.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내게서 조서가 나옵니다. 누구든지 이 조서를 바꾸는 사람은 집에서 들보 하나가 뽑혀 나가고, 그는 그것에 매달릴 것입니다[a][b]; 그리고 그 집은 이 일 때문에 거름더미가 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그것에 매달릴 것입니다.’
    reason: alternative_reading
  - marker: b
    text: 직역하면, ‘집에서 들보/목재가 뽑혀 나갈 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘dunghill’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  english_pob_choice: a decree is issued
  chosen_korean: 조서가 나옵니다
  alternatives_korean:
  - 명령이 내려집니다
  - 칙령이 반포됩니다
  lexicon: HALOT
  rationale: 아람어 관료 문맥의 공식 명령을 자연스러운 한국어 공문체로 옮기되, ‘내가 내립니다’보다 제도적으로 효력이 발생하는 느낌을 살려 ‘나옵니다’로 처리했습니다.
- source_word: יְהַשְׁנֵא פִּתְגָמָא דְנָה
  english_pob_choice: alters this edict
  chosen_korean: 이 조서를 바꾸는
  alternatives_korean:
  - 이 조서를 변경하는
  - 이 조서를 어기는
  lexicon: HALOT
  rationale: פִּתְגָמָא는 왕실의 공식 ‘말/조서’로, 단순 불복종보다 문서 자체를 손대는 의미가 핵심이므로 ‘바꾸는’으로 옮겼습니다.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  english_pob_choice: a beam shall be pulled out from his house
  chosen_korean: 집에서 들보 하나가 뽑혀 나가고
  alternatives_korean:
  - 집에서 목재 하나가 뜯겨 나가고
  - 집에서 기둥 하나가 뽑혀 나가고
  lexicon: HALOT
  rationale: אָע는 일반적 목재이지만, 처벌용으로 집에서 떼어 내는 구체적 목재는 한국어에서 ‘들보’가 가장 이미지와 기능을 함께 전달합니다.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  english_pob_choice: he shall be impaled on it
  chosen_korean: 그는 그것에 매달릴 것입니다
  alternatives_korean:
  - 그는 그것에 못 박힐 것입니다
  - 그는 그것에 찔려 달릴 것입니다
  lexicon: HALOT
  rationale: 아람어는 목재에 ‘들어 올려’ 붙이는 형벌적 처형을 가리키며, 영어 POB의 대안 주석처럼 전통적으로는 ‘매달리다’가 가능한 번역입니다. 한국어에서는 고문적·고대적 형벌 이미지를 과장 없이 보존하기 위해 ‘매달릴 것입니다’로 옮겼습니다.
- source_word: נְוָלוּ
  english_pob_choice: refuse heap
  chosen_korean: 거름더미
  alternatives_korean:
  - 쓰레기더미
  - 오물더미
  lexicon: HALOT
  rationale: 전통적 ‘dunghill’의 의미를 한국어 독자가 즉시 이해할 수 있도록 하되, 수치와 부정함의 뉘앙스를 살리기 위해 ‘거름더미’로 옮겼습니다.
theological_decisions:
- issue: 형벌 동사의 한국어 선택과 전통 번역 대비
  chosen_reading: ‘매달릴 것입니다’로 옮겨 고대 제국형 처벌의 직접적 충격을 보존했습니다.
  alternative_readings:
  - ‘못 박힐 것입니다’
  - ‘목에 매달릴 것입니다’
  rationale: 본문은 단순한 처형 선언이 아니라 제국 조서의 저주적 경고를 담고 있으므로, 현대 독자에게도 형벌의 무게가 약화되지 않도록 직접적이되 불필요한 추정을 피하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
