source:
  edition: WLC
  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
  footnotes:
  - marker: a
    text: Or 'according to the instruction of the priests who are in Jerusalem.' The Aramaic phrase is literally 'according to the word of the priests.'
    reason: lexical_alternative
  - marker: b
    text: Or 'without fail' / 'so that there is no omission.' The final clause stresses that the daily provisions are not to lapse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무엇이든 필요한 것—번제물로 드릴 어린 수소와 숫양과 어린 양, 곧 하늘의 하나님께 드릴 것과 밀, 소금, 포도주, 기름은 예루살렘에 있는 제사장들의 말에 따라 그들에게 날마다 빠짐없이 주어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에 있는 제사장들의 지시에 따라’. 아람어 표현은 문자적으로 ‘제사장들의 말에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘누락 없이’ / ‘빠뜨림 없이’. 끝 구절은 매일의 공급이 끊기지 않아야 함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  english_pob_choice: whatever is needed
  chosen_korean: 무엇이든 필요한 것
  alternatives_korean:
  - 그리고 무엇이든
  - 무엇이든
  lexicon: HALOT
  rationale: 아람어의 개방형 요청 표현을 한국어에서 자연스럽게 살려, 행정적·실무적 뉘앙스를 담아 ‘무엇이든 필요한 것’으로 옮겼습니다.
- source_word: בְנֵי תוֹרִין וְדִכְרִין וְאִמְּרִין
  english_pob_choice: young bulls, rams, and lambs
  chosen_korean: 어린 수소와 숫양과 어린 양
  alternatives_korean:
  - 수소와 숫양과 양
  - 젊은 수소와 숫양과 어린 양
  lexicon: HALOT
  rationale: 제물 목록이므로 축제적 표현보다 제사용 어휘를 우선하되, ‘young bulls’를 ‘어린 수소’로 자연스럽게 옮기고 나머지도 동물 종류가 분명하게 드러나도록 했습니다.
- source_word: לַעֲלָוָן לֶאֱלָהּ שְׁמַיָּא
  english_pob_choice: for burnt offerings to the God of heaven
  chosen_korean: 번제물로 드릴 … 하늘의 하나님께
  alternatives_korean:
  - 번제물로 드릴 … 하늘의 하나님께 바칠
  - 번제물로 삼을 … 하늘의 하나님께
  lexicon: HALOT
  rationale: ‘번제물’은 제의 용어로 고정하고, ‘to the God of heaven’은 에스라-아람어의 표준 칭호이므로 ‘하늘의 하나님’으로 직역해 유지했습니다.
- source_word: כְּמֵאמַר כָּהֲנַיָּא דִי בִירוּשְׁלֶם
  english_pob_choice: according to the word of the priests who are in Jerusalem
  chosen_korean: 예루살렘에 있는 제사장들의 말에 따라
  alternatives_korean:
  - 예루살렘에 있는 제사장들의 명령에 따라
  - 예루살렘에 있는 제사장들의 지시에 따라
  lexicon: HALOT
  rationale: 직역상 ‘말’이지만 행정 문맥에서 권위 있는 지침을 뜻할 수 있어, 본문을 과도하게 해석하지 않으면서도 한국어로는 ‘말에 따라’로 살렸습니다.
- source_word: דִּי לָא שָׁלוּ
  english_pob_choice: without fail
  chosen_korean: 빠짐없이
  alternatives_korean:
  - 실패 없이
  - 무중단으로
  - 빠뜨림 없이
  lexicon: HALOT
  rationale: 아람어는 ‘누락이 없도록’이라는 뜻이므로, 일상적인 한국어 행정 표현인 ‘빠짐없이’가 가장 자연스럽고 원문 의미를 잘 전달합니다.
theological_decisions:
- issue: ‘하늘의 하나님’ 호칭 유지 여부
  chosen_reading: ‘하늘의 하나님’으로 직접 옮겨, 제국 행정 문서 속 예배 대상 호칭의 격식을 살렸습니다.
  alternative_readings:
  - ‘하늘 하나님’
  - ‘하늘에 계신 하나님’
  rationale: 본문은 제의 목록과 연결된 공식 칭호를 사용하므로, 친숙한 기도체보다 원문에 가까운 호칭을 유지하는 편이 문맥상 더 적절합니다.
  doctrine_reference: Ezra의 제국 문서/공식 칭호 사용
- issue: ‘according to the word of the priests’의 해석 강도
  chosen_reading: ‘제사장들의 말에 따라’로 두어, 본문이 명시한 권위의 근거를 그대로 드러냈습니다.
  alternative_readings:
  - ‘제사장들의 지시대로’
  - ‘제사장들의 규정에 따라’
  rationale: 아람어는 문자적으로 ‘말’이지만, 이를 곧바로 ‘법규’로 강하게 끌어올리면 본문보다 더 해석적이 될 수 있어, 원문 긴장을 남기는 번역을 택했습니다.
  doctrine_reference: 성경 본문 해석에서의 최소개입 원칙
