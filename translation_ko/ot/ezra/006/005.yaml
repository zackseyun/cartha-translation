  text: וְ֠/אַף מָאנֵ֣י בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבֽוּכַדְנֶצַּ֗ר הַנְפֵּ֛ק מִן הֵיכְלָ֥/א דִי בִ/ירוּשְׁלֶ֖ם וְ/הֵיבֵ֣ל לְ/בָבֶ֑ל יַהֲתִיב֗וּן וִ֠/יהָךְ לְ/הֵיכְלָ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לְ/אַתְרֵ֔/הּ וְ/תַחֵ֖ת בְּ/בֵ֥ית אֱלָהָֽ/א־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
  footnotes:
  - marker: a
    text: Or 'let them be restored, and let them go to the temple in Jerusalem, each to its place.' The Aramaic wording around 'and let each be brought/go' is somewhat difficult, but the sense is the restoration of the temple vessels to their proper places in Jerusalem.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 하나님의 집에 속한 금과 은으로 만든 기명들을, 느부갓네살이 예루살렘에 있던 성전에서 가져다가 바빌론으로 옮긴 것들을 돌려주고, 예루살렘에 있는 성전으로 가져가 각각 제자리에 두십시오. 그것들을 하나님의 집에 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 기명들을 돌려주어 예루살렘에 있는 성전으로 돌아가 각각 제자리에 있게 하십시오.” ‘성전으로 가다/가져가다’에 해당하는 아람어 표현은 다소 어렵습니다. 문맥상 뜻은 성전 기명들을 예루살렘의 제자리로 회복시키라는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  english_pob_choice: And also
  chosen_korean: 그리고 ...도
  alternatives_korean:
  - 또한
  - 그리고 또한
  lexicon: HALOT
  rationale: 추가 항목을 도입하는 연결 표현이므로, 문맥상 자연스럽고 누적 명령의 흐름을 살리는 ‘그리고 ...도’를 택했습니다.
- source_word: בֵית אֱלָהָא
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집(성전)
  lexicon: HALOT
  rationale: 직역에 가까운 ‘하나님의 집’을 유지해 앞의 הֵיכְלָא ‘성전’과의 어휘 구분을 살렸습니다.
- source_word: יַהֲתִיבוּן / וִיהָךְ לְאַתְרֵהּ
  english_pob_choice: be returned ... let each be brought ... to its place
  chosen_korean: 되돌려 보내어 ... 각기 제자리로 가져가게 하며
  alternatives_korean:
  - 되돌려 가져오게 하며
  - 되돌려 보내어 ... 제자리에 두게 하며
  lexicon: HALOT
  rationale: 아람어의 다소 어려운 분사·jussive 흐름을 한국어에서는 ‘되돌려 보내어’와 ‘각기 제자리로’로 풀어, 회복과 원위치를 함께 드러냈습니다.
- source_word: וְתַחֵת
  english_pob_choice: you shall put them
  chosen_korean: 두게 하십시오
  alternatives_korean:
  - 놓게 하십시오
  - 두십시오
  lexicon: HALOT
  rationale: 왕의 명령을 받는 실무 지시로서, 격식을 유지하면서도 현대 한국어에서 자연스러운 ‘두게 하십시오’를 사용했습니다.
theological_decisions:
- issue: 성전 기명 회복의 강조
  chosen_reading: 포로로 옮겨진 성전 기명을 원래의 장소로 되돌리는 회복 명령으로 옮겼습니다.
  alternative_readings:
  - 단순한 반환 지시
  - 예배 도구의 재배치 지시
  rationale: 본문의 핵심은 귀금속 자체보다 하나님의 집에 속한 기명의 회복과 제자리 복귀에 있으므로, 그 신학적 함의를 드러내는 방향을 유지했습니다.
  doctrine_reference: Ezra 6:5의 문맥상 성전 회복과 예루살렘 예배 재건
