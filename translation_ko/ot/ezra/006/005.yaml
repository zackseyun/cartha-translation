revisions:
- from: 그리고 하나님의 집의 금그릇과 은그릇도 — 느부갓네살이 예루살렘에 있던 성전에서 가져다가 바빌론으로 옮긴 것들인데 — 되돌려 보내어 예루살렘에 있는 성전으로, 각기 제자리로 가져가게 하며, 그것들을 하나님의 집에 두게 하십시오.[a]
  to: 또한 하나님의 집에 속한 금과 은으로 만든 기명들을, 느부갓네살이 예루살렘에 있던 성전에서 가져다가 바빌론으로 옮긴 것들을 돌려주고, 예루살렘에 있는 성전으로 가져가 각각 제자리에 두십시오. 그것들을 하나님의 집에 두십시오.[a]
  rationale: 원문의 어휘 구분(‘하나님의 집’/‘성전’)과 반환·재배치 명령을 유지하면서, 수신자에게 직접 내리는 마지막 명령을 ‘두십시오’로 바로잡았습니다. 난해한 아람어 동사구는 본문에서 과도하게 단정하지 않고, 성전으로의 복귀와 각자의 제자리라는 공통 의미만 제시했으며 대안적 구문 이해는 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 내용은 대체로 충실하지만, ‘가져가게 하며’는 주체가 불분명하고 앞선 ‘되돌려 보내어’와 결합될 때 동작의 흐름이 어색합니다. 마지막 וְתַחֵת는 수신자에게 직접 내리는 명령이므로 ‘두게 하십시오’보다 ‘두십시오’가 더 정확합니다. 난해한 וִיהָךְ는 각 기명이 성전의 제자리로 돌아가게 된다는 최소 의미로 옮기고 각주에서 대안을 보존하는 것이 안전합니다.
  naturalness: 삽입 대시로 된 관계절은 가능하나, 이 긴 왕령 문장에서는 관계절을 쉼표로 자연스럽게 연결하는 편이 더 읽기 쉽습니다. ‘금그릇과 은그릇’보다 성전 물품을 가리키는 ‘금과 은으로 만든 기명’이 문맥에 더 적절하며, ‘각기 제자리로 가져가’는 ‘각각 제자리에 두십시오’로 정리하는 것이 현대 표준어에 자연스럽습니다.
  terminology: בֵית אֱלָהָא는 ‘하나님의 집’으로, הֵיכְלָא는 ‘성전’으로 구분했습니다. מָאנֵי는 의례적·성전 문맥에 맞게 ‘기명’으로 옮겼습니다. 느부갓네살 및 바빌론 표기는 표준적이며 문제없습니다.
