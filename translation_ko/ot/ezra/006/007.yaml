    rationale: עַל אַתְרֵהּ는 건축이 이루어질 위치를 뜻하므로 ‘그 자리에’가 적절합니다. יִבְנוֹן은 ‘건축하다/짓다’로 옮기는 것이 직접적이며, ‘다시’는 문맥상 타당하더라도 이 절의 어휘에는 명시되지 않았으므로 본문에서 추가하지 않는 편이 안전합니다.
