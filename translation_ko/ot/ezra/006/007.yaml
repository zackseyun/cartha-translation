    issue: ‘하나님의 집’이 첫 구절에서는 ‘이 집’으로 약화되고, 둘째 구절에서는 생략됨
    rationale: 원문은 בֵּית אֱלָהָא דֵךְ를 두 차례 반복합니다. 두 번 모두 하나님의 집, 곧 성전을 가리키므로 이를 보존해야 합니다.
  - severity: medium
