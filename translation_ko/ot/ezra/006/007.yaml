id: EZR.6.7
reference: Ezra 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁבֻ֕קוּ לַ/עֲבִידַ֖ת בֵּית אֱלָהָ֣/א דֵ֑ךְ פַּחַ֤ת יְהוּדָיֵ/א֙ וּ/לְ/שָׂבֵ֣י יְהוּדָיֵ֔/א בֵּית אֱלָהָ֥/א דֵ֖ךְ יִבְנ֥וֹן עַל אַתְרֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
  footnotes:
  - marker: a
    text: Or 'the Judeans' instead of 'the Jews.' The Aramaic term can denote the people of Judah in either an ethnic or regional sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집의 일은 그대로 두십시오[a]. 유다의 총독과 유다의 장로들이 이 집을 그 자리에서 다시 세우게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인들의’ 대신 ‘유다 사람들의’. 아람어 용어는 유다 백성을 민족적 또는 지역적 의미로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ
  english_pob_choice: Leave ... alone
  chosen_korean: 그대로 두십시오
  alternatives_korean:
  - 건드리지 마십시오
  - 그 일을 멈추십시오
  - 내버려 두십시오
  lexicon: HALOT
  rationale: 임페라티브 복수의 금지·중지 명령을 한국어에서 자연스럽게 살리기 위해 ‘그대로 두십시오’를 택했습니다.
- source_word: לַעֲבִידַת
  english_pob_choice: the work
  chosen_korean: 일
  alternatives_korean:
  - 일손
  - 사역
  - 노동
  lexicon: HALOT
  rationale: 성전 재건 맥락에서는 ‘work’가 건축 작업을 가리키므로, 과도하게 종교적인 뉘앙스가 없는 ‘일’이 가장 무난합니다.
- source_word: יְהוּדָיֵא
  english_pob_choice: of the Jews
  chosen_korean: 유다의
  alternatives_korean:
  - 유대인의
  - 유대인들의
  - 유다 사람들의
  lexicon: HALOT
  rationale: 아람어의 지명·민족명은 이 구절에서 예루살렘과 성전이 있는 유다 지역을 가리키므로, 문맥상 ‘유다의’가 가장 직접적입니다.
- source_word: עַל אַתְרֵהּ
  english_pob_choice: on its site
  chosen_korean: 그 자리에서
  alternatives_korean:
  - 그 자리에
  - 제자리에
  - 그 부지 위에
  lexicon: HALOT
  rationale: ‘site/place’의 공간적 의미를 한국어의 자연스러운 표현으로 옮기기 위해 ‘그 자리에서’를 사용했습니다.
theological_decisions:
- issue: 명령문의 강도와 허용의 뉘앙스
  chosen_reading: “그대로 두십시오 … 다시 세우게 하십시오”로 번역해, 방해 중단과 재건 허용이라는 이중 명령을 분명히 했습니다.
  alternative_readings:
  - “일을 멈추십시오 … 다시 짓게 하십시오”
  - “손대지 마십시오 … 건축하게 하십시오”
  rationale: 본문은 단순한 허락이 아니라 관청 문서형 금지·허가 명령이므로, 두 동사의 대조를 살려야 합니다.
  doctrine_reference: 문맥 주해(페르시아 왕령의 행정적 명령 형식)
