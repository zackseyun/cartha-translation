revisions:
- from: 그들은 이레 동안 무교절을 기쁨 가운데 지켰습니다. 이는 야훼께서 그들을 기쁘게 하셨고, 앗수르 왕의 마음을 그들에게로 돌리셔서 이스라엘의 하나님 집의 일에 그들의 손을 강하게 하셨기 때문입니다.[a][b][c]
  to: 그들은 이레 동안 무교절을 기쁨 가운데 지켰습니다. 이는 야훼께서 그들을 기쁘게 하셨고[b], 앗수르 왕[a]의 마음을 그들에게로 돌리셔서[c] 이스라엘의 하나님이신 하나님의 집에서 하는 일을 하도록 그들의 손에 힘을 주셨기 때문입니다.
  rationale: 원문의 동격인 ‘이스라엘의 하나님’을 ‘하나님이신’으로 명시하여 ‘하나님의 집’을 수식하게 했습니다. ‘그들의 손을 강하게 하셨다’는 ‘그들의 손에 힘을 주셨다’로 다듬어 히브리 관용이 뜻하는 지원·격려를 자연스럽게 전달했습니다. 역사적으로 난해한 왕의 칭호는 본문에 그대로 보존하고 각주를 해당 낱말에 연결했습니다.
