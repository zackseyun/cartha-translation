source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the king of Assyria.'' Though the ruler in Ezra''s time was Persian, the text uses the older imperial designation, likely referring to the realm that included former Assyrian territory.'
    reason: cultural_note
  - marker: b
    text: Or 'had made them rejoice.'
    reason: lexical_alternative
  - marker: c
    text: Or 'had inclined the heart of the king of Assyria toward them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이레 동안 무교절을 기쁨 가운데 지켰습니다. 이는 야훼께서 그들을 기쁘게 하셨고[b], 앗수르 왕[a]의 마음을 그들에게로 돌리셔서[c] 이스라엘의 하나님이신 하나님의 집에서 하는 일을 하도록 그들의 손에 힘을 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘앗수르 왕’이라고 말합니다. 에스라 시대의 통치자는 페르시아 왕이지만, 본문은 옛 제국 명칭을 사용합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들을 즐겁게 하셨다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘앗수르 왕의 마음을 그들에게로 기울이셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ חַג מַצּוֹת
  english_pob_choice: they kept the Feast of Unleavened Bread
  chosen_korean: 무교절을 … 지켰습니다
  alternatives_korean:
  - 무교절을 … 지냈습니다
  - 무교절을 … 지켰습니다
  lexicon: HALOT
  rationale: חג with a festival object는 단순히 ‘하다’가 아니라 절기를 지키다/지내다의 관용 표현이므로, 한국어도 ‘지켰습니다’로 자연스럽게 옮겼습니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with joy
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 기쁘게
  - 즐거움 속에서
  lexicon: HALOT
  rationale: 전치사구를 부사적으로 살리되, 명사 ‘기쁨’을 유지해 원문의 감정 상태를 드러내도록 했습니다.
- source_word: שִׂמְּחָם יְהוָה
  english_pob_choice: Yahweh had made them joyful
  chosen_korean: 야훼께서 그들을 기쁘게 하셨고
  alternatives_korean:
  - 야훼께서 그들에게 기쁨을 주셨고
  - 야훼께서 그들을 즐겁게 하셨고
  lexicon: HALOT
  rationale: 피엘형의 사역적 의미를 반영해 ‘기쁘게 하셨고’로 옮겼습니다. 단순한 감정 결과가 아니라 야훼의 원인 제공을 살렸습니다.
- source_word: וְהֵסֵב לֵב מֶלֶךְ אַשּׁוּר עֲלֵיהֶם
  english_pob_choice: and had turned the heart of the king of Assyria toward them
  chosen_korean: 앗수르 왕의 마음을 그들에게로 돌리셔서
  alternatives_korean:
  - 앗수르 왕의 마음을 그들에게 향하게 하셔서
  - 앗수르 왕의 마음을 그들에게로 돌이키셔서
  lexicon: HALOT
  rationale: ‘마음을 돌리다/향하게 하다’가 הסב + לב의 핵심이므로, 방향성을 살려 ‘그들에게로 돌리셔서’로 처리했습니다.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: in the work of the house of God, the God of Israel
  chosen_korean: 이스라엘의 하나님 집의 일에
  alternatives_korean:
  - 이스라엘의 하나님 집의 일에
  - 이스라엘의 하나님 집에서 하는 일에
  lexicon: HALOT
  rationale: ‘베이트 하엘로힘’은 직역하면 ‘하나님의 집’이지만, 한국어에서는 소유격 구조보다 ‘…집의 일’이 더 자연스러워 원문의 의미를 유지하며 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기식 대체표현이 아닌 직접적으로 YHWH를 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘앗수르 왕’이라는 역사적 명칭 유지
  chosen_reading: 본문대로 ‘앗수르 왕’을 유지
  alternative_readings:
  - 페르시아 왕
  - 앗수르 지역의 왕
  rationale: 히브리어 원문이 실제 시대와 다소 어긋나는 표현을 그대로 사용하므로, 조화시키지 않고 원문 표현을 보존했습니다. 역사적 배경 설명은 본문이 아니라 주석에 맡기는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition'
