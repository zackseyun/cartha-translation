base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
  footnotes:
  - marker: a
    text: Or 'and succeeding' or 'and making progress.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the command of' for 'by the decree of.'
    reason: lexical_alternative
  - marker: c
    text: The verse attributes the completion both to God's decree and to the decrees of Persian kings, with God's decree named first.
    reason: cross_reference
translation:
  language: ko
  text: 유다 사람들의 장로들은 학개 선지자와 잇도의 아들 스가랴가 전한 예언을 통하여 건축하며 형통하였습니다. 그들은 이스라엘 하나님의 명령과 고레스와 다리오와 페르시아 왕 아닥사스다의 명령에 따라 건축을 완성하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형통하였습니다’는 ‘성공하였습니다’ 또는 ‘일이 잘되어 갔습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘명령’은 여기서 ‘조서’ 또는 ‘칙령’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 완공을 이스라엘 하나님의 명령과 페르시아 왕들의 명령 모두에 귀속시키며, 하나님의 명령을 먼저 언급합니다.
    reason: cross_reference
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  english_pob_choice: the elders of the Jews
  chosen_korean: 유다의 장로들
  alternatives_korean:
  - 유대인들의 장로들
  - 유대의 장로들
  lexicon: HALOT
  rationale: 아람어 표현은 공동체를 이끄는 장로들을 가리키므로, 한국어에서는 역할과 소속을 자연스럽게 살려 ‘유다의 장로들’로 옮겼습니다.
- source_word: בָּנַיִן וּמַצְלְחִין
  english_pob_choice: were building and prospering
  chosen_korean: 건축하며 형통하였고
  alternatives_korean:
  - 건축하고 있었고 번성하였고
  - 짓고 있었고 성공하고 있었고
  lexicon: HALOT
  rationale: 진행 중인 행위와 함께 일이 잘 풀린다는 의미를 함께 살리기 위해 ‘건축하며 형통하였고’로 옮겼습니다.
- source_word: בִּנְבוּאַת חַגַּי ... וּזְכַרְיָה
  english_pob_choice: through the prophecy of Haggai the prophet and Zechariah son of Iddo
  chosen_korean: 학개 선지자와 잇도의 아들 스가랴의 예언으로 말미암아
  alternatives_korean:
  - 학개 선지자와 잇도의 아들 스가랴의 예언을 통해
  - 학개와 잇도의 아들 스가랴의 예언으로
  lexicon: HALOT
  rationale: ‘בִּנְ’의 수단/매개 의미를 드러내기 위해 ‘-으로 말미암아’로 옮기고, 예언자 호칭은 원문의 병렬 관계를 유지했습니다.
- source_word: וְשַׁכְלִלוּ מִן טַעַם
  english_pob_choice: They finished building by the decree of
  chosen_korean: 공사를 마쳤습니다
  alternatives_korean:
  - 건축을 마쳤습니다
  - 완공하였습니다
  lexicon: HALOT
  rationale: 동사의 완료 의미를 자연스럽게 살리되, 이어지는 ‘명령/조서’ 표현과의 중복을 피하기 위해 본문에는 ‘공사를 마쳤습니다’로 정리했습니다.
- source_word: מִן טַעַם אֱלָהּ יִשְׂרָאֵל ... כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  english_pob_choice: by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia
  chosen_korean: 이스라엘의 하나님과 고레스와 다리오와 아닥사스다, 곧 바사의 왕의 명령으로
  alternatives_korean:
  - 이스라엘의 하나님과 고레스와 다리오와 아닥사스다 왕의 조서로
  - 이스라엘의 하나님과 고레스와 다리오와 아닥사스다의 명령으로
  lexicon: HALOT
  rationale: ‘טַעַם’을 행정적 ‘명령/조서’로 보고, 하나님과 페르시아 왕들의 권위를 병렬로 보이도록 ‘명령으로’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 명령과 페르시아 왕들의 명령의 병렬성
  chosen_reading: 완공은 이스라엘의 하나님의 명령과 고레스, 다리오, 아닥사스다의 명령이 함께 언급되는 방식으로 제시됩니다.
  alternative_readings:
  - 왕의 명령은 하나님의 명령의 종속적 표현일 뿐입니다.
  - 인간의 명령은 단지 역사적 배경입니다.
  rationale: 본문은 하나님과 이방 왕들의 명령을 모두 실제 원인으로 병렬 제시하므로, 그 긴장을 해소하지 않고 그대로 유지했습니다.
  doctrine_reference: 본문의 이중 귀속을 보존
