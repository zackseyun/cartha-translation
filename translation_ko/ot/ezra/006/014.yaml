  to: 유다 사람들의 장로들은 학개 선지자와 잇도의 아들 스가랴가 전한 예언을 통하여 건축하며 형통하였습니다. 그들은 이스라엘 하나님의 명령과 고레스와 다리오와 페르시아 왕 아닥사스다의 명령에 따라 건축을 완성하였습니다.[a][b][c]
