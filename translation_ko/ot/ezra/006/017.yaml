id: EZR.6.17
reference: Ezra 6:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
  footnotes:
  - marker: a
    text: Or 'on behalf of all Israel.'
    reason: lexical_alternative
  - marker: b
    text: The twelve male goats correspond to the twelve tribes of Israel, expressing the offering's representative scope.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들은 이 집, 곧 하나님의 집의 봉헌을 위해 수송아지 백 마리, 숫양 이백 마리, 어린양 사백 마리, 그리고 이스라엘 온 백성을 위한 속죄제물로 숫염소 열두 마리를 바쳤습니다. 이는 이스라엘 지파의 수에 따른 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 이스라엘을 대신하여’.
    reason: alternative_reading
  - marker: b
    text: 열두 숫염소는 이스라엘 열두 지파를 대응시키며, 제사의 대표적 범위를 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  english_pob_choice: And they offered
  chosen_korean: 그들은 … 바쳤습니다
  alternatives_korean:
  - 드렸습니다
  - 제물로 올렸습니다
  lexicon: HALOT
  rationale: 제의적 문맥에서 קרב의 사역형은 제물을 하나님께 바치는 행위를 뜻하므로, 자연스러운 현대 한국어로는 ‘바쳤습니다’가 가장 직접적입니다.
- source_word: לַחֲנֻכַּת
  english_pob_choice: for the dedication
  chosen_korean: 봉헌을 위해
  alternatives_korean:
  - 헌당을 위해
  - 봉헌식에
  lexicon: HALOT
  rationale: חנכה는 성전/집의 봉헌·헌당을 가리키므로, 한국어 성서 문맥에서 의미가 분명한 ‘봉헌’으로 옮겼습니다.
- source_word: בֵּית אֱלָהָא דְנָה
  english_pob_choice: of this house of God
  chosen_korean: 이 집, 곧 하나님의 집
  alternatives_korean:
  - 이 하나님의 집
  - 이 성전
  lexicon: HALOT
  rationale: 아람어 직역 구조를 살리면서도 ‘집’과 ‘하나님의 집’의 동일시를 풀어 주어 원문의 지시성과 문맥을 함께 드러냈습니다.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: according to the number of the tribes of Israel
  chosen_korean: 이스라엘 지파의 수에 따른 것입니다
  alternatives_korean:
  - 이스라엘 지파의 숫자에 따라
  - 이스라엘 지파의 수를 따라서
  lexicon: HALOT
  rationale: ‘수에 따른’은 12마리 숫염소가 지파 수와 대응한다는 설명적 의미를 간결하게 보존합니다.
theological_decisions:
- issue: עַל כָּל יִשְׂרָאֵל의 대표/유익 범위
  chosen_reading: ‘이스라엘 온 백성을 위한’으로 옮겨, 제사가 대표적 범위를 가진다는 점을 본문대로 유지했습니다.
  alternative_readings:
  - ‘이스라엘을 위하여’
  - ‘모든 이스라엘을 대신하여’
  rationale: 전치사 עַל은 이 문맥에서 ‘~을 위하여/대신하여’의 대표성을 띠며, 본문이 곧바로 열두 마리라는 상징적 수를 지파 수와 연결하므로 범위를 좁히지 않았습니다.
  doctrine_reference: 공동체적 대표성은 본문이 제시하는 신학적 긴장을 그대로 보존합니다.
