  rationale: 본문은 예루살렘에서의 레위 직무를 말하므로, 지나친 확대나 축소 없이 성전 관련 사역임을 드러내는 방향을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥 기반 의미 범위 유지
- issue: 모세의 책에 대한 규범성
