base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
  footnotes:
  - marker: a
    text: Or 'in their divisions' for both the priests and the Levites; the two Aramaic nouns are closely related organizational terms.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to what is written in the Book of Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제사장들을 그들의 반열대로, 레위 사람들을 그들의 반열대로 세워, 예루살렘에 있는 하나님의 일을 맡기되, 모세의 책에 기록된 대로 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 반열대로’가 제사장과 레위 사람 모두를 함께 수식할 수 있습니다. 두 아람어 명사는 밀접하게 연결된 조직 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모세의 책에 기록된 바에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  english_pob_choice: they set up
  chosen_korean: 세워
  alternatives_korean:
  - 임명하여
  - 배치하여
  - 설정하여
  lexicon: HALOT
  rationale: 히브리어 사역형은 ‘세우다/서게 하다’의 구체성을 가지므로, 직무 배치의 의미를 살리면서도 한국어에서 자연스럽게 옮겼습니다.
- source_word: כָהֲנַיָּא ... בִּפְלֻגָּתְהוֹן
  english_pob_choice: the priests in their divisions
  chosen_korean: 제사장들을 그들의 반열대로
  alternatives_korean:
  - 제사장들을 그들의 분열대로
  - 제사장들을 그들의 구역대로
  - 제사장들을 그들의 조로
  lexicon: HALOT
  rationale: 조직된 순번·편제의 뜻을 살려 ‘반열’로 옮겼고, ‘their divisions’의 집단적 배치 구조를 드러냈습니다.
- source_word: וְלֵוָיֵא ... בְּמַחְלְקָתְהוֹן
  english_pob_choice: the Levites in their divisions
  chosen_korean: 레위 사람들을 그들의 반열대로
  alternatives_korean:
  - 레위 사람들을 그들의 분할대로
  - 레위 사람들을 그들의 조로
  - 레위 사람들을 그들의 구분대로
  lexicon: HALOT
  rationale: 앞절과 같은 조직 용어를 일관되게 살리기 위해 동일하게 ‘반열’로 렌더링했습니다.
- source_word: עַל עֲבִידַת אֱלָהָא
  english_pob_choice: for the service of God
  chosen_korean: 하나님의 일을 맡기되
  alternatives_korean:
  - 하나님의 섬김을 위해
  - 하나님의 봉사를 위해
  - 하나님의 일을 위해
  lexicon: HALOT
  rationale: 문맥상 성전 직무를 가리키므로 ‘일’이 지나치게 일반적이지 않도록 ‘맡기다’를 더해 임명·배정의 뉘앙스를 살렸습니다.
- source_word: כִּכְתָב סְפַר מֹשֶׁה
  english_pob_choice: as it is written in the Book of Moses
  chosen_korean: 모세의 책에 기록된 대로
  alternatives_korean:
  - 모세의 책에 기록된 바와 같이
  - 모세의 책에 씌어 있는 대로
  - 모세의 책에 적힌 대로
  lexicon: HALOT
  rationale: ‘Book of Moses’는 문자 그대로 ‘모세의 책’으로 옮기되, 기록된 권위를 드러내는 관용으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘하나님의 일’의 범위
  chosen_reading: 성전 봉사를 가리키는 표현으로, 직무 배정 자체를 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 보다 일반적인 종교적 ‘섬김’으로 이해할 수도 있습니다.
  - 성전 제의의 기술적 표현으로 더 좁게 한정할 수도 있습니다.
  rationale: 본문은 예루살렘에서의 레위 직무를 말하므로, 지나친 확대나 축소 없이 성전 관련 사역임을 드러내는 방향을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥 기반 의미 범위 유지
- issue: 모세의 책에 대한 규범성
  chosen_reading: 배치가 모세의 기록된 권위에 근거함을 그대로 보존했습니다.
  alternative_readings:
  - 단순한 관습적 전승으로 완화할 수도 있습니다.
  rationale: 마지막 절이 명시적으로 기록된 규범을 가리키므로, 이를 약화시키지 않고 번역했습니다.
  doctrine_reference: 원문 우선 원칙; 문서적 권위 보존
