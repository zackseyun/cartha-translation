  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
  footnotes:
  - marker: a
    text: Or 'in their divisions' for both the priests and the Levites; the two Aramaic nouns are closely related organizational terms.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to what is written in the Book of Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제사장들을 그들의 반열에 따라[a] 배치하고, 레위 사람들도 그들의 반열에 따라 배치하여, 예루살렘에서 하나님을 섬기는 일을 맡게 하였습니다. 이는 모세의 책에 기록된 대로였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 제사장과 레위 사람 모두를 가리켜 ‘그들의 반열에 따라’로 옮길 수 있습니다. 두 아람어 명사는 밀접하게 관련된 조직 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모세의 책에 기록된 바에 따라’로 옮길 수 있습니다.
    reason: lexical_alternative
