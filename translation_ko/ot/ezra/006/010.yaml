source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
  footnotes:
  - marker: a
    text: Or 'sweet aromas' or 'soothing aromas.' The Aramaic term refers to the pleasing aroma of acceptable sacrifices.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the welfare of the king and his sons.' Literally, 'for the life of the king and his sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 하늘의 하나님께 향기로운 제물을 드리고, 왕과 그의 아들들의 생명을 위해 기도하게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁘게 하는 향기들’ 또는 ‘달콤한 향기들’. 이 아람어 표현은 받아들여지는 제사와 관련된 기분 좋은 향기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕과 그의 아들들의 안위를 위해’. 문자적으로는 ‘왕과 그의 아들들의 생명을 위해’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַקְרְבִין
  english_pob_choice: offer
  chosen_korean: 제물을 드리고
  alternatives_korean:
  - 바치고
  - 드려 올리고
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘offer’는 단순한 ‘가져오다’보다 제물을 드리는 행위를 자연스럽게 드러냅니다. 한국어에서는 ‘제물을 드리다’가 가장 직역에 가깝고 예배적 뉘앙스도 유지합니다.
- source_word: נִיחוֹחִין
  english_pob_choice: pleasing aromas
  chosen_korean: 기쁨이 되는 향기로운
  alternatives_korean:
  - 향기로운
  - 기쁘게 하는 향의
  - 향기로운 냄새의
  lexicon: HALOT
  rationale: 이 단어는 단순한 ‘향’이 아니라 받아들여진 제사에서 나는 기쁘게 하는 향을 가리킵니다. 한국어에서는 ‘기쁨이 되는 향기로운’으로 옮겨 제물의 향기라는 이미지를 살리되, 의미를 제사 자체로 환원하지 않도록 했습니다.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  english_pob_choice: to the God of heaven
  chosen_korean: 하늘의 하나님께
  alternatives_korean:
  - 하늘의 하나님에게
  - 하늘의 하나님을 향하여
  lexicon: HALOT
  rationale: 에스라서에 반복되는 칭호를 한국어로 자연스럽게 옮기기 위해 ‘하늘의 하나님께’로 했습니다. 이는 예물을 드리는 목적 방향을 잘 드러냅니다.
- source_word: לְחַיֵּי
  english_pob_choice: for the life of
  chosen_korean: 생명을 위해
  alternatives_korean:
  - 목숨을 위해
  - 생존을 위해
  - 안위를 위해
  lexicon: HALOT
  rationale: 직역하면 ‘생명을 위해’이지만, 한국어에서는 왕의 보존과 안전을 함께 가리키는 기도 뜻이 드러나야 합니다. 그래서 본문 구조를 살리면서도 자연스럽게 ‘생명을 위해’로 옮겼습니다.
theological_decisions:
- issue: 제사 용어 נִיחוֹחִין을 어떻게 처리할지
  chosen_reading: ‘기쁨이 되는 향기로운 제물’로 옮겨, 제사의 향기 이미지를 유지하면서도 제물 행위와 분리되지 않게 했습니다.
  alternative_readings:
  - ‘향기로운 제물’
  - ‘달콤한 향’
  - ‘기분 좋은 냄새’
  rationale: 이 구절은 왕의 칙령 속에서 성전 제사의 목적을 설명하므로, 향기 표현을 지우면 문맥의 예배적 성격이 약해집니다. 반대로 너무 문자적으로만 옮기면 한국어가 부자연스러우므로, 의미와 이미지를 함께 살리는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve cultic imagery without over-interpretation.'
