  text: כִּ֣י הִֽטַּהֲר֞וּ הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם כְּ/אֶחָ֖ד כֻּלָּ֣/ם טְהוֹרִ֑ים וַ/יִּשְׁחֲט֤וּ הַ/פֶּ֨סַח֙ לְ/כָל בְּנֵ֣י הַ/גּוֹלָ֔ה וְ/לַ/אֲחֵי/הֶ֥ם הַ/כֹּהֲנִ֖ים וְ/לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: ko
  text: 이는 제사장들과 레위 사람들이 함께 스스로를 정결하게 하였고, 모두가 깨끗하였기 때문입니다. 그들은 모든 포로 귀환자들과 그들의 형제인 제사장들과 자기들을 위하여 유월절 희생제물을 잡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함께’는 כְּאֶחָד의 직역 가능성을 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유월절 희생제물’은 문자적으로는 ‘유월절’을 가리키지만, 여기서는 잡아 죽인 제물의 의미를 드러내기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטַּהֲרוּ
  english_pob_choice: had purified themselves
  chosen_korean: 스스로를 정결하게 하였고
  alternatives_korean:
  - 자신을 깨끗하게 하였고
  - 정결해졌고
  lexicon: טהר
  rationale: 능동 반사적 의미를 살려 제사장들과 레위 사람들이 스스로 정결 절차를 행했다는 점을 분명히 했습니다.
- source_word: כְּאֶחָד כֻּלָּם טְהוֹרִים
  english_pob_choice: as one; all of them were clean
  chosen_korean: 함께 … 모두가 깨끗하였기 때문입니다
  alternatives_korean:
  - 한마음으로 … 모두 깨끗하였기 때문입니다
  - 일제히 … 모두 정결하였기 때문입니다
  lexicon: אחד / טהר
  rationale: ‘하나처럼’이라는 직역 가능성을 유지하되, 공동의 정결 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: הַפֶּסַח
  english_pob_choice: the Passover lamb
  chosen_korean: 유월절 희생제물
  alternatives_korean:
  - 유월절 양
  - 유월절 제물
  lexicon: פסח
  rationale: 문맥상 잡아 죽이는 대상이므로 ‘희생제물’로 옮겨 행위와 제의적 성격을 함께 드러냈습니다.
- source_word: לְכָל בְּנֵי הַגּוֹלָה
  english_pob_choice: for all the sons of the exile
  chosen_korean: 모든 포로 귀환자들을 위하여
  alternatives_korean:
  - 모든 포로의 자녀들을 위하여
  - 모든 유배의 아들들을 위하여
  lexicon: גולה
  rationale: 한국어 성경에서 문맥상 ‘포로 귀환자들’이 의미를 가장 분명하게 전달하므로 그 집단성을 살렸습니다.
theological_decisions:
- issue: ‘all of them were clean’의 제의적 정결성
  chosen_reading: 제사장들과 레위 사람들이 공동으로 정결하여 유월절을 집례할 자격이 있음을 서술합니다.
  alternative_readings:
  - 도덕적 순결을 말하는 것으로 읽을 수 있습니다
  - 단순한 위생적 정결로 오해될 수 있습니다
  rationale: 본문은 유월절 제사 집행 직전의 제의적 정결 상태를 말하므로, 일반적 ‘깨끗함’보다 예배 자격과 관련된 정결로 이해하는 것이 더 정확합니다.
  doctrine_reference: 레 11–15의 정결 규례, 출 12:6의 유월절 규정
- issue: 유월절 양/희생제물 번역
  chosen_reading: ‘유월절 희생제물’로 옮겨, 단순한 동물명보다 제의적 도살 행위를 강조합니다.
  alternative_readings:
  - ‘유월절 양’은 더 익숙하지만 희생 행위를 충분히 드러내지 못합니다
  - ‘유월절 제물’은 대상은 보이지만 피 흘림의 뉘앙스가 약합니다
  rationale: 히브리어 פֶּסַח는 여기서 도살된 유월절 제물을 가리키므로, 제의적 의미를 보존하는 번역이 적절합니다.
  doctrine_reference: 출애굽기 12장 유월절 제정
