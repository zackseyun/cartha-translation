id: EZR.6.13
reference: Ezra 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
  footnotes:
  - marker: a
    text: Or 'did it carefully' or 'carried it out with all exactness.' The Aramaic expression emphasizes precise compliance with the king's directive.
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' was the Persian administrative term for the region west of the Euphrates.'
    reason: cultural_note
translation:
  language: ko
  text: 그때에 다르다이[a]와 강 건너편의 총독, 스달 보스내와 그들의 동료들은[b] 다리오 왕이 보낸 대로 정확히 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '조심스럽게 하였다', '모든 점에서 정확하게 수행하였다'로도 옮길 수 있습니다. 아람어 표현은 왕의 지시에 대한 정확한 준수를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: '''강 건너편''은 페르시아 행정상 유프라테스 강 서쪽 지역을 가리키는 관용적 지명입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그리하여
  - 그런 다음
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 아람어 담화 표지이므로, 문맥상 자연스러운 시간 연결 표현인 '그때에'로 옮겼습니다.
- source_word: פַּחַת עֲבַר נַהֲרָה
  english_pob_choice: the governor of Beyond the River
  chosen_korean: 강 건너편의 총독
  alternatives_korean:
  - 유브라데 강 건너편의 총독
  - 강 건너편 지역의 총독
  lexicon: HALOT
  rationale: פַּחַת는 행정관/총독을 뜻하므로 '총독'으로, עֲבַר נַהֲרָה는 제국 행정 구역 명칭을 살려 직역적이되 한국어로 자연스럽게 '강 건너편'으로 옮겼습니다.
- source_word: וּכְנָוָתְהוֹן
  english_pob_choice: and their associates
  chosen_korean: 그들의 동료들은
  alternatives_korean:
  - 그들의 협력자들은
  - 그들의 동반자들은
  lexicon: HALOT
  rationale: 행정적·공적 맥락에서 함께한 사람들을 가리키므로, 단순한 동행보다 관계와 협조를 드러내는 '동료들'이 가장 적절합니다.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  english_pob_choice: exactly so
  chosen_korean: 정확히 그렇게
  alternatives_korean:
  - 꼼꼼히
  - 세밀하게
  lexicon: HALOT
  rationale: 두 부사적 표현이 왕의 지시와의 정확한 일치를 강조하므로, '정확히 그렇게'로 합쳐 원문의 엄격한 순응성을 살렸습니다.
- source_word: עֲבַדוּ
  english_pob_choice: did
  chosen_korean: 하였습니다
  alternatives_korean:
  - 행하였습니다
  - 수행하였습니다
  lexicon: HALOT
  rationale: 단순 수행을 뜻하는 넓은 동사이므로, 공문서적 서술에 맞는 평이한 '하였습니다'로 옮겼습니다.
theological_decisions:
- issue: 왕의 명령에 대한 완전한 순종의 강조
  chosen_reading: 본문은 단순히 '했다'가 아니라 '정확히 그렇게 하였다'고 하여, 행정 명령에 대한 철저한 이행을 강조합니다.
  alternative_readings:
  - 완화하여 단순한 수행 사실만을 말하는 읽기
  - 의례적 예의로만 보는 읽기
  rationale: 아람어의 כְּנֵמָא אָסְפַּרְנָא와 영어 POB의 'exactly so'는 정확한 준수를 강조하므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 성경의 역사 서술은 하나님의 섭리 아래 제국 권력이 하나님의 뜻에 순응하게 되는 장면을 드러냅니다.
