  - 문서들의 집에서
  lexicon: HALOT
  rationale: 직역하면 ‘책/문서의 집’이지만 행정 문맥상 공식 기록 저장소를 뜻하므로, 공지된 용례를 살려 문서고로 옮겼습니다.
- source_word: גִנְזַיָּא
  english_pob_choice: the treasures
  chosen_korean: 보화가
  alternatives_korean:
  - 재보가
  - 귀중품이
  - 저장품이
  lexicon: HALOT
  rationale: 문맥상 단순한 금전 보관뿐 아니라 저장된 귀중품 전반을 가리킬 수 있어, 너무 협소한 ‘금고’보다 넓은 의미의 보화를 택했습니다.
