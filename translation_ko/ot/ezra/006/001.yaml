source:
  edition: WLC
  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
  footnotes:
  - marker: a
    text: Or 'Darius the king made a decree, and a search was made in the archive house.' The Aramaic more literally reads 'set a decree' and uses a third-person plural verb ('they searched'), which may function impersonally.
    reason: alternative_reading
  - marker: b
    text: '''House of the archives'' is literally ''house of the books/documents,'' referring to an official records repository.'
    reason: lexical_alternative
  - marker: c
    text: '''Treasures'' may also be understood more broadly as stored valuables or deposits kept in the archive complex.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다리오 왕이 조서를 내렸고, 그들은 바빌로에 있는 문서고의 집에서, 곧 보화가 보관되어 있던 곳을 찾아보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문서고의 집’은 문자적으로는 ‘책/문서의 집’이며, 공식 기록 저장소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보화’는 여기서 단지 금은보화만이 아니라 보관된 귀중품이나 예치물을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그때에
  - 그러자
  lexicon: HALOT
  rationale: 서사 전환 표지로서 시간적 순서를 자연스럽게 이어 주는 현대 한국어 표현입니다.
- source_word: שָׂם טְעֵם
  english_pob_choice: issued a decree
  chosen_korean: 조서를 내렸고
  alternatives_korean:
  - 명령을 내렸고
  - 법령을 공포했고
  - 칙령을 내렸고
  lexicon: HALOT
  rationale: 왕의 공적 행정 결정을 가리키는 말로, 원문의 ‘정하다/세우다’ 뉘앙스를 살리면서도 한국어 역사 서술에 자연스럽게 맞췄습니다.
- source_word: בְּבֵית סִפְרַיָּא
  english_pob_choice: in the house of the archives
  chosen_korean: 문서고의 집에서
  alternatives_korean:
  - 기록 보관소에서
