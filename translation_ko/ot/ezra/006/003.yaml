revisions:
- from: 고레스 왕 제일 년에 고레스 왕이 조서를 내렸습니다. 예루살렘에 있는 하나님의 집에 관하여는 그 집을 다시 지으라 — 곧 제물을 바치는 곳이 되게 하고, 그 기초를 놓게 하라. 그 높이는 육십 규빗이고 그 너비도 육십 규빗입니다.[a]
  to: 고레스 왕 첫해에 고레스 왕이 조서를 내렸습니다. “예루살렘에 있는 하나님의 집에 관하여, 그 집을 다시 지으라. 이는 제물을 바치는 곳이며, 그 기초를 놓게 하라.[a] 그 높이는 육십 규빗이고 그 너비는 육십 규빗이다.”
