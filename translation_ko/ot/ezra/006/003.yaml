  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲדָ֜ה לְ/כ֣וֹרֶשׁ מַלְכָּ֗/א כּ֣וֹרֶשׁ מַלְכָּ/א֮ שָׂ֣ם טְעֵם֒ בֵּית אֱלָהָ֤/א בִֽ/ירוּשְׁלֶם֙ בַּיְתָ֣/א יִתְבְּנֵ֔א אֲתַר֙ דִּֽי דָבְחִ֣ין דִּבְחִ֔ין וְ/אֻשּׁ֖וֹ/הִי מְסֽוֹבְלִ֑ין רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֥ין שִׁתִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
  footnotes:
  - marker: a
    text: Or, 'let its foundations be retained/raised up.' The Aramaic phrase is difficult, and translations vary; 'let its foundations be laid' best fits the building context.
    reason: lexical_alternative
translation:
  language: ko
  text: 고레스 왕 제일 년에 고레스 왕이 조서를 내렸습니다. 예루살렘에 있는 하나님의 집에 관하여는 그 집을 다시 지으라 — 곧 제물을 바치는 곳이 되게 하고, 그 기초를 놓게 하라. 그 높이는 육십 규빗이고 그 너비도 육십 규빗입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 기초를 놓게 하라’는 해석은 건축 문맥에 따른 것입니다. 아람어 어구는 어려워서, ‘그 기초를 유지하라/올리라’로 옮기는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  english_pob_choice: issued a decree
  chosen_korean: 조서를 내렸습니다
  alternatives_korean:
  - 조서를 반포했습니다
  - 명령을 내렸습니다
  - 칙령을 발표했습니다
  lexicon: HALOT
  rationale: 아람어 관용구는 공식적인 통치를 공포한다는 뜻이므로, 현대 한국어의 행정 문체에 맞는 ‘조서를 내렸습니다’가 가장 자연스럽고 문맥상 정확합니다.
- source_word: בֵּית אֱלָהָא / בַיְתָא
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집터
  - 하나님의 전
  lexicon: HALOT
  rationale: 원문이 반복해서 ‘집’(house)을 사용하므로, 한국어에서도 ‘성전’으로 바꾸지 않고 ‘하나님의 집’으로 유지해 원문 어휘와 반복을 살렸습니다.
- source_word: יִתְבְּנֵא
  english_pob_choice: let the house be rebuilt
  chosen_korean: 그 집을 다시 지으라
  alternatives_korean:
  - 그 집을 지으라
  - 그 집이 다시 세워지게 하라
  - 그 집을 재건하라
  lexicon: HALOT
  rationale: 이 문맥의 동사는 공적 명령문으로서 복원 건축을 뜻하므로 ‘다시 지으라’가 가장 직접적입니다. ‘재건하라’도 가능하지만 현대 한국어에서는 다소 문어적입니다.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  english_pob_choice: the place where they offer sacrifices
  chosen_korean: 제물을 바치는 곳
  alternatives_korean:
  - 희생 제사를 드리는 곳
  - 제사를 드리는 곳
  - 제물을 드리는 곳
  lexicon: HALOT
  rationale: 아람어의 동족어 구조가 제사 행위를 강조하므로, 의미를 살리면서도 한국어에서 자연스러운 ‘제물을 바치는 곳’으로 옮겼습니다.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  english_pob_choice: and let its foundations be laid
  chosen_korean: 그 기초를 놓게 하라
  alternatives_korean:
  - 그 기초를 세우게 하라
  - 그 기초가 놓이게 하라
  - 그 기초를 받치게 하라
  lexicon: HALOT
  rationale: 해당 어구는 해석이 어려우나, 건축 문맥상 기초를 마련하는 뜻이 가장 타당하므로 ‘기초를 놓게 하라’로 번역했습니다. 영어 POB의 주석 취지도 반영했습니다.
- source_word: רוּמֵהּ / פְּתָיֵהּ
  english_pob_choice: Its height / its width
  chosen_korean: 그 높이는 / 그 너비도
  alternatives_korean:
  - 그 높이는 / 그 넓이는
  - 높이는 / 너비는
  - 그 높이는 / 그 폭도
  lexicon: HALOT
  rationale: 건축 치수 표현은 현대 한국어의 기본어휘인 ‘높이’와 ‘너비’를 사용해 분명하게 전달했습니다.
theological_decisions:
- issue: ‘하나님의 집’의 직역 유지 여부
  chosen_reading: 전통적 ‘성전’ 대신 원문 반복을 따라 ‘하나님의 집’으로 유지했습니다.
  alternative_readings:
  - 하나님의 성전
  - 하나님의 전
  rationale: 이 절은 ‘집’이라는 표현을 의도적으로 반복하므로, 건물의 신학적 의미를 유지하면서도 원문 어휘의 표면 구조를 보존하는 편이 더 충실합니다.
  doctrine_reference: 성전/성소의 언약적 표상과 본문 반복의 수사 효과
