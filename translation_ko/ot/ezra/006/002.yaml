  text: '그리고 메대 지방에 있는 성채 아흐메타[a]에서 한 두루마리[b]가 발견되었습니다. 그 안에는 다음과 같은 기록[c]이 적혀 있었습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아흐메타’는 아람어 지명 형태를 따른 음역입니다. 통용되는 그리스어계 지명은 ‘에크바타나’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두루마리’는 문서의 물리적 형태를 가리킵니다. 원문은 ‘한 두루마리’라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기록’에 해당하는 아람어는 공식적인 기록 또는 메모를 가리킬 수 있습니다.
    reason: lexical_alternative
