  alternative_readings:
  - ‘발견되었고 … 그 안에 기록되어 있었습니다’
  - ‘발견되었는데 … 거기에는 기록되어 있었습니다’
  rationale: 아람어 원문의 발견 진술과 이어지는 문서 인용 도입을 구분해, 조사 보고문 같은 긴장감과 서사 흐름을 유지했습니다.
  doctrine_reference: 성경 본문 자체의 역사 서술을 최대한 보존하는 번역 원칙
