base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
  footnotes:
  - marker: a
    text: Or "Achmetha," a closer transliteration of the Aramaic name for Ecbatana.
    reason: lexical_alternative
  - marker: b
    text: Or "citadel" for "fortress." The Aramaic term refers to a fortified royal or administrative complex.
    reason: lexical_alternative
  - marker: c
    text: Or "memorandum" for "record." The term denotes an official written remembrance or archival note.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아흐메타, 곧 메대 지방에 있는 그 성채에서 한 두루마리가 발견되었는데, 그 안에는 다음과 같이 기록되어 있었습니다:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아흐메타’는 아람어 지명 형태를 따른 음역입니다. 영어 POB는 더 알려진 지명인 ‘Ecbatana’를 본문에 두고, 더 가까운 음역인 ‘Achmetha’를 각주로 달았습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성채’는 영어 POB의 ‘fortress’에 해당하며, ‘요새’나 ‘성곽’도 가능합니다. 원문의 뜻은 방어된 왕실/행정 복합체입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기록되어 있었습니다’는 영어 POB의 ‘as a record’가 가리키는 공식 문서·기록의 성격을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  english_pob_choice: was found
  chosen_korean: 발견되었는데
  alternatives_korean:
  - 찾아냈는데
  - 있음을 발견했는데
  lexicon: HALOT
  rationale: 수동적 ‘found’의 의미를 자연스럽게 살리면서, 공문서 조사 맥락에 맞는 간결한 서술로 옮겼습니다.
- source_word: אַחְמְתָא
  english_pob_choice: Ecbatana
  chosen_korean: 아흐메타
  alternatives_korean:
  - 에크바타나
  - 엑바타나
  lexicon: HALOT
  rationale: 본문의 아람어 지명 형태를 반영해 음역했고, POB 각주처럼 통용 지명인 에크바타나와 구별되는 원형성을 살렸습니다.
- source_word: בִּירְתָּא
  english_pob_choice: the fortress
  chosen_korean: 그 성채
  alternatives_korean:
  - 그 요새
  - 그 성곽
  lexicon: HALOT
  rationale: 방어된 행정·왕실 복합체라는 뜻을 살리되, 한국어에서 자연스러운 역사 서술어인 ‘성채’를 택했습니다.
- source_word: מְגִלָּה חֲדָה
  english_pob_choice: a scroll
  chosen_korean: 한 두루마리
  alternatives_korean:
  - 한 책
  - 한 문서
  lexicon: HALOT
  rationale: 공적 기록이 담긴 문서를 가리키므로, 한국어 성경 문맥에서 익숙하면서도 물리적 매체를 드러내는 ‘두루마리’로 옮겼습니다.
- source_word: דִּכְרוֹנָה
  english_pob_choice: as a record
  chosen_korean: 기록되어 있었습니다
  alternatives_korean:
  - 기억문으로 적혀 있었습니다
  - 기록문으로 적혀 있었습니다
  lexicon: HALOT
  rationale: 공식적 보관문서의 의미를 살리면서도, 한국어에서는 본문 안의 내용을 도입하는 표현으로 ‘기록되어 있었습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 제국 문서의 발견과 인용을 어떻게 한국어로 드러낼지
  chosen_reading: 본문의 발견 사실과 그 안의 기록을 분리해, ‘발견되었는데 … 그 안에는 다음과 같이 기록되어 있었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘발견되었고 … 그 안에 기록되어 있었습니다’
  - ‘발견되었는데 … 거기에는 기록되어 있었습니다’
  rationale: 아람어 원문의 발견 진술과 이어지는 문서 인용 도입을 구분해, 조사 보고문 같은 긴장감과 서사 흐름을 유지했습니다.
  doctrine_reference: 성경 본문 자체의 역사 서술을 최대한 보존하는 번역 원칙
