revisions:
- from: 그리고 나를 통해 조서가 내려집니다. 곧, 유다의 그 장로들을 어떻게 대할지, 곧 하나님의 집을 다시 세우는 일에 관하여 말입니다. 그 모든 비용은 왕의 재산에서, 강 건너 편 지방에서, 이 사람들에게 신속히 지급되어야 합니다. 그래야 그 일이 중단되지 않습니다.
  to: 내가 또한 이 유다 사람 장로들과 관련하여 너희가 해야 할 일에 관해 명령을 내립니다. 하나님의 집을 다시 세우는 일을 위하여, 그 비용을 강 건너편 지방[a]에 있는 왕의 재산에서 이 사람들에게 즉시 지급해야 합니다. 그 일이 중단되지 않도록 해야 합니다.
  rationale: 원문의 행정적 명령 형식, 장로들과 ‘관련하여’ 수신자들이 해야 할 일이라는 문장 구조, 그리고 강 건너편 지방의 왕실 재산이라는 재원 관계를 보존하도록 고쳤습니다. לְמִבְנֵא는 문맥상 재개된 성전 건축을 가리키므로 ‘다시 세우는 일’로 유지했으며, 비용 지급의 목적절은 ‘중단되지 않도록’으로 자연스럽게 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:16Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 조서의 공적 성격과 재건 사업의 비용을 왕의 재산에서 지급하라는 핵심을 대체로 전달합니다. 그러나 לְמָא דִי תַעַבְדוּן עִם의 의미는 장로들을 ‘어떻게 대할지’라기보다 ‘이 유다 사람 장로들과 관련하여 너희가 해야 할 일’입니다. 또한 왕의 재산과 강 건너편 지방의 관계를 한국어 문장에서 더 분명히 밝혀야 합니다.
  naturalness: ‘그리고 나를 통해 조서가 내려집니다’는 한국어 공식 명령문으로 다소 부자연스럽습니다. ‘내가 또한 명령을 내립니다’가 원문의 1인칭 왕실 칙령 형식과 현대 합쇼체에 자연스럽습니다. ‘곧’의 반복도 제거하는 편이 좋습니다.
  terminology: ‘유다 사람 장로들’, ‘하나님의 집’, ‘비용’, ‘강 건너편 지방’을 유지했습니다. ‘강 건너편 지방’은 페르시아의 행정 명칭이므로 각주로 그 역사적 성격을 밝혔습니다. 원문은 ‘하나님의 집’에 2인칭 소유격을 붙이지 않으므로 ‘너희 하나님’으로 고치지 않았습니다.
  issues:
  - severity: high
    issue: ‘유다의 그 장로들을 어떻게 대할지’
    rationale: עִם은 여기서 장로들을 처우하는 방식 자체보다 그들과 관련하여 수신자들이 수행할 일을 도입합니다. ‘어떻게 대할지’는 원문의 지시 범위를 부당하게 좁히고 의미를 바꿉니다.
  - severity: medium
    issue: ‘나를 통해 조서가 내려집니다’
    rationale: וּמִנִּי שִׂים טְעֵם은 왕이 직접 내리는 칙령임을 나타냅니다. ‘내가 또한 명령을 내립니다’가 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: 왕의 재산과 강 건너편 지방의 관계가 불명확함
    rationale: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה는 강 건너편 지방에 속한 왕의 재산/자원에서 비용을 지급하라는 뜻입니다. 현 문장의 쉼표 나열은 두 별개의 출처처럼 읽힐 수 있습니다.
  revised_text: 내가 또한 이 유다 사람 장로들과 관련하여 너희가 해야 할 일에 관해 명령을 내립니다. 하나님의 집을 다시 세우는 일을 위하여, 그 비용을 강 건너편 지방[a]에 있는 왕의 재산에서 이 사람들에게 즉시 지급해야 합니다. 그 일이 중단되지 않도록 해야 합니다.
