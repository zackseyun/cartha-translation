id: EZR.6.8
reference: Ezra 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'And by me a decree is issued concerning what you are to do with these elders of the Jews for the rebuilding of the house of God: the full expense is to be paid promptly to these men from the king’s goods[a], from the province Beyond the River[c][b], so that the work may not cease.'
  footnotes:
  - marker: a
    text: Or 'the cost' or 'the expenditure' for 'the full expense.'
    reason: lexical_alternative
  - marker: b
    text: '''Beyond the River'' was the Persian administrative name for the region west of the Euphrates.'
    reason: cultural_note
  - marker: c
    text: Or 'so that there may be no interruption.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나를 통해 조서가 내려집니다. 곧, 유다의 그 장로들을 어떻게 대할지, 곧 하나님의 집을 다시 세우는 일에 관하여 말입니다. 그 모든 비용은 왕의 재산에서, 강 건너 편 지방에서, 이 사람들에게 신속히 지급되어야 합니다. 그래야 그 일이 중단되지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂים טְעֵם
  english_pob_choice: a decree is issued
  chosen_korean: 조서가 내려집니다
  alternatives_korean:
  - 명령이 내려집니다
  - 법령이 내려집니다
  lexicon: HALOT
  rationale: 아람어 관용구의 공적·행정적 힘을 살리면서 한국어 행정문서체로 자연스럽게 옮겼습니다.
- source_word: לְמָא דִי תַעַבְדוּן
  english_pob_choice: concerning what you are to do
  chosen_korean: 어떻게 대할지, 곧 …에 관하여
  alternatives_korean:
  - 무엇을 해야 하는지에 관하여
  - 어떻게 해야 하는지에 관하여
  lexicon: HALOT
  rationale: 조서의 내용이 단순 정보가 아니라 행위 지시임을 드러내기 위해 ‘어떻게 대할지’로 풀어 주었습니다.
- source_word: בֵּית אֱלָהָא דֵךְ
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집터
  lexicon: HALOT
  rationale: source의 직역성을 살려 ‘집’을 유지했으며, 성전으로 좁히지 않아 원문의 표현을 보존했습니다.
- source_word: מִדַּת עֲבַר נַהֲרָה
  english_pob_choice: from the province Beyond the River
  chosen_korean: 강 건너 편 지방에서
  alternatives_korean:
  - 강 건너 지방에서
  - 유프라테스 강 건너 지방에서
  lexicon: HALOT
  rationale: 페르시아 행정구역명을 독자에게 이해되도록 옮기되, 고유 행정명칭의 의미는 유지했습니다.
- source_word: לָא לְבַטָּלָא
  english_pob_choice: so that the work may not cease
  chosen_korean: 그래야 그 일이 중단되지 않습니다
  alternatives_korean:
  - 그래서 그 일이 멈추지 않습니다
  - 그래야 공사가 중단되지 않습니다
  lexicon: HALOT
  rationale: 문맥상 성전 재건 공사를 가리키므로 ‘그 일’로 받되, 중단 금지를 분명히 했습니다.
theological_decisions:
- issue: ‘the house of God’의 번역에서 소유격 ‘your’를 넣을지 여부
  chosen_reading: 본문의 신학적 초점에 따라 단순히 ‘하나님의 집’으로 옮기고, 소유격을 보태지 않았습니다.
  alternative_readings:
  - ‘너희 하나님’
  - ‘너의 하나님’
  rationale: 아람어 원문은 하나님을 가리키지만, 청자에게 직접 호칭하는 소유격은 아니므로 이를 보태지 않는 것이 더 정확합니다.
  doctrine_reference: 본문 정밀성 및 번역 투명성
- issue: ‘Beyond the River’의 처리
  chosen_reading: 고유 행정명칭을 설명적으로 풀어 ‘강 건너 편 지방’으로 옮겼습니다.
  alternative_readings:
  - ‘유프라테스 강 저편’
  - ‘강 건너 지방’
  rationale: 청자가 역사적 배경을 모르더라도 문맥을 이해할 수 있게 하되, 관용적 행정명칭이라는 성격은 유지합니다.
  doctrine_reference: 역사·지리 맥락 보존
