base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
  footnotes:
  - marker: a
    text: Or “from Beyond the River”; the phrase is the Persian provincial designation often rendered “Trans-Euphrates.”
    reason: lexical_alternative
  - marker: b
    text: The Aramaic expression at the end is a formal epistolary formula, traditionally rendered “and at such a time” or understood as “and so forth.” The text continues in the next verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 「이것은 그들이 아르타크세르크세스 왕에게 보낸 편지의 사본입니다. “왕의 종들, 곧 강 건너편 지방의 사람들[a], 그리고 이제[b]—”」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강 건너편에서 온”; 이 표현은 페르시아의 행정 구역 명칭으로, 흔히 “트랜스유프라테스”로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어 표현은 공식 서신의 관용적 종결 형식으로, 전통적으로 “그리고 때가 되어” 또는 “등등”으로 옮겨집니다. 본문은 다음 절에서 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא
  english_pob_choice: This is a copy of the letter
  chosen_korean: 「이것은 … 편지의 사본입니다」
  alternatives_korean:
  - 「이것은 … 편지입니다」
  - 「여기에 … 편지의 사본이 있습니다」
  lexicon: HALOT
  rationale: 문서 인용을 여는 Aramaic 관용 표현으로, ‘사본’은 פַּרְשֶׁגֶן의 공식 문서 복제본 의미를 가장 직접적으로 살립니다.
- source_word: עַבְדָיךְ
  english_pob_choice: Your servants
  chosen_korean: 왕의 종들
  alternatives_korean:
  - 왕의 신하들
  - 왕의 관리들
  lexicon: HALOT
  rationale: 왕에게 자신을 낮추는 공식 호칭이므로, 원문의 봉사/예속 관계를 살려 ‘종들’로 옮겼습니다.
- source_word: עֲבַר נַהֲרָה
  english_pob_choice: Beyond the River
  chosen_korean: 강 건너편 사람들
  alternatives_korean:
  - 강 건너편 지방 사람들
  - 유브라데 강 너머 사람들
  lexicon: HALOT
  rationale: 페르시아 행정 구역 표지를 한국어 독자가 이해할 수 있게 하되, 지리적·행정적 의미가 남도록 ‘강 건너편’으로 렌더링했습니다.
- source_word: וּכְעֶנֶת
  english_pob_choice: and now—
  chosen_korean: 그리고 이제—
  alternatives_korean:
  - 그리고 지금—
  - 그리고 이제
  lexicon: HALOT
  rationale: 뒤 문맥으로 이어지는 미완결 서신 형식을 살리기 위해, 문장 종결을 열어 두는 대시를 유지했습니다.
theological_decisions:
- issue: 서신 도입문의 미완결성
  chosen_reading: 문장을 완결하지 않고 ‘그리고 이제—’로 남겨 다음 절로 이어지는 형식을 보존했습니다.
  alternative_readings:
  - ‘그리고 때로는’처럼 관용적 의미를 보충해 완결하는 읽기
  - 문장부호 없이 단순 연결하는 읽기
  rationale: 원문과 POB 모두 편지 인용이 다음 절에서 계속되는 미완결 서신 공식이므로, 한국어에서도 그 긴장을 지우지 않는 것이 적절합니다.
  doctrine_reference: 본문 비평/담화 구조
