  text: כְּעַן֙ שִׂ֣ימוּ טְּעֵ֔ם לְ/בַטָּלָ֖א גֻּבְרַיָּ֣/א אִלֵּ֑ךְ וְ/קִרְיְתָ֥/א דָךְ֙ לָ֣א תִתְבְּנֵ֔א עַד מִנִּ֖/י טַעְמָ֥/א יִתְּשָֽׂם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
  footnotes:
  - marker: a
    text: Or 'set forth an order' or 'make a decree'; the Aramaic idiom is literally 'set a decree.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until I issue a decree.' Literally, 'until from me a decree is set.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지금 명령을 내려 이 사람들을 멈추게 하십시오[a]. 그러면 이 성읍은 내게서 명령이 내려질 때까지 다시 건축되지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령을 공포하십시오’로도 옮길 수 있습니다. 아람어 관용구는 문자적으로 ‘명령을 세우다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 명령을 내릴 때까지’. 문자적으로는 ‘내게서 명령이 세워질 때까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  english_pob_choice: Now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 그러므로 지금
  lexicon: HALOT
  rationale: 아람어의 즉각적인 왕명 발화를 한국어에서 자연스럽게 살리되, 논리적 결론보다 시간적 긴급성을 드러내기 위해 ‘지금’으로 옮겼습니다.
- source_word: שִׂימוּ טְּעֵם
  english_pob_choice: issue a decree
  chosen_korean: 명령을 내려
  alternatives_korean:
  - 법령을 내리십시오
  - 조서를 내리십시오
  lexicon: HALOT
  rationale: 직역의 ‘명령을 세우다’는 한국어에서 어색하므로, 행정적 결정을 공표하는 왕명이라는 기능을 살려 ‘명령을 내려’로 옮겼습니다.
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  english_pob_choice: to make these men stop
  chosen_korean: 이 사람들을 멈추게 하십시오
  alternatives_korean:
  - 이 사람들의 일을 중지시키십시오
  - 이 사람들을 그치게 하십시오
  lexicon: HALOT
  rationale: 동사의 사역적 의미를 살리되, 문맥상 공사 중지 명령이므로 한국어에서는 ‘멈추게 하십시오’가 가장 직접적입니다. ‘이 사람들’은 원문의 남성 복수 인칭을 반영합니다.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  english_pob_choice: and this city shall not be rebuilt
  chosen_korean: 그러면 이 성읍은 다시 건축되지 않을 것입니다
  alternatives_korean:
  - 이 성읍은 다시 세워지지 않을 것입니다
  - 이 성읍은 재건되지 않을 것입니다
  lexicon: HALOT
  rationale: 원문은 행정적 금지 선언이므로 미래형 금지의 단정적 어조를 살렸습니다. ‘성읍’은 עיר/קִרְיְתָא의 고전적 도시 개념을 자연스럽게 반영합니다.
theological_decisions:
- issue: 왕명 형식의 절대적 금지와 종속절의 시간 표현
  chosen_reading: ‘내게서 명령이 내려질 때까지’로 옮겨, 재건 금지가 왕의 추가 칙령에 종속된다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘내가 명령을 내릴 때까지’
  - ‘내가 명령을 내리기 전까지’
  rationale: 원문의 ‘from me a decree is set’는 출처와 권한의 근원을 강조하므로, 단순한 시간 표현보다 권위의 출처를 드러내는 번역이 더 충실합니다.
  doctrine_reference: 본문 해석상 권력 구조와 행정권의 주체를 드러내는 문제이지, 교리적 쟁점은 아닙니다.
