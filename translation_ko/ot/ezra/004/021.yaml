    reason: lexical_alternative
translation:
  language: ko
  text: 지금 명령을 내려 이 사람들이 일을 중단하게 하십시오[a]. 이 성읍은 내게서 명령이 내려질 때까지 건축되지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령을 공포하십시오’로도 옮길 수 있습니다. 아람어 관용구는 문자적으로 ‘명령을 세우다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 명령을 내릴 때까지’로 옮길 수 있습니다. 문자적으로는 ‘내게서 명령이 세워질 때까지’입니다.
    reason: lexical_alternative
