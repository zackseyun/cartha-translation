  source_fidelity: ‘בְּעֵל טְעֵם’은 르훔의 관직이지만 정확한 제도상 등가가 불확실합니다. ‘총독’은 영토 통치 관직을 구체적으로 단정하므로 원문의 불확실성 및 영어 POB의 ‘commander’보다 과도하게 특정합니다. ‘지휘관’으로 옮기고 대안 관직명은 주석으로 남기는 편이 안전합니다. 또한 ‘강 저편’은 원문에서 별도의 수신자 범주에 속하므로 이를 분명히 유지했습니다.
  naturalness: 현대 공식 문체에 맞추어 ‘답장’을 ‘회답’으로, 나열 구조는 ‘와 … 그리고 …’로 다듬었습니다. 서신의 짧은 인사말은 원문의 명사적 형식을 살려 ‘평안.’으로 두었고, 다음 절로 이어지는 ‘이제—’를 보존했습니다.
