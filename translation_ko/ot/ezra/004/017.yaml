id: EZR.4.17
reference: Ezra 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
  footnotes:
  - marker: a
    text: Aramaic 'Beyond the River' refers to the Persian administrative region west of the Euphrates.
    reason: cultural_note
  - marker: b
    text: Or 'Greetings' for 'Peace.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the chancellor' for 'the commander.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 르훔 총독[a]과 서기관 심새이, 그리고 사마리아에 사는 그들의 나머지 동료들과 강 저편에 있는 나머지 사람들에게 답장을 보냈습니다. “평안[b]. 이제—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 ‘강 저편’은 유프라테스 강 서쪽의 페르시아 행정 구역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘평안’은 ‘인사’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא / reply
  english_pob_choice: a reply
  chosen_korean: 답장
  alternatives_korean:
  - 대답
  - 회신
  - 답변
  lexicon: HALOT
  rationale: 왕의 공식 서신이 이전 편지에 대한 응답이라는 점을 살려, 자연스러운 현대 한국어로 ‘답장’을 선택했습니다.
- source_word: בְּעֵל טְעֵם
  english_pob_choice: the commander
  chosen_korean: 총독
  alternatives_korean:
  - 사령관
  - 감독관
  - 수석 관리
  lexicon: HALOT
  rationale: 이 표현은 직역하면 ‘분별/조언의 주인’에 가까운 행정 직함으로, POB의 영어 주석처럼 정확한 관직 일치를 단정하기보다 당시 행정적 책임자를 가리키는 한국어 관직어로 옮겼습니다. 본문 용례상 르훔의 지위는 문맥적으로 행정장관에 가까워 ‘총독’이 가장 읽기 쉽고 기능적입니다.
- source_word: שְׁלָם
  english_pob_choice: Peace
  chosen_korean: 평안
  alternatives_korean:
  - 평화
  - 안녕
  - 인사
  lexicon: HALOT
  rationale: 서신 서두의 상투적 인사말로서, 영어 POB의 ‘Peace’를 그대로 살리되 한국어에서는 문맥상 ‘평안’이 가장 자연스럽고 어감도 유지합니다.
- source_word: עֲבַר נַהֲרָה
  english_pob_choice: Beyond the River
  chosen_korean: 강 저편
  alternatives_korean:
  - 강 건너편
  - 유브라데 강 건너 지역
  - 강 너머
  lexicon: HALOT
  rationale: 아람어 관용구를 행정구역명으로 과잉 풀이하지 않고, 영어 POB의 주석처럼 유프라테스 강 서쪽을 가리키는 지역표현임을 드러내는 직역형으로 옮겼습니다.
theological_decisions:
- issue: 왕의 서신 서두에 대한 한국어 어조
  chosen_reading: 본문은 왕의 공식 회답과 이어지는 인용문을 분명히 하도록 평서체 서술 뒤에 직접화법을 붙였습니다.
  alternative_readings:
  - 직접화법 없이 한 문장으로 평서 처리
  - ‘평안’을 ‘인사드립니다’로 완화
  rationale: 원문은 관청 서신 형식의 짧은 공식 문구이므로, 서술과 인용을 구분해 문체를 보존하는 것이 가장 स्रोत 충실적입니다.
  doctrine_reference: 서신체/담화 구조 보존
