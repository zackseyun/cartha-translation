revisions:
- from: 이제 왕께 알려지게 하십시오. 만일 이 성읍이 다시 건축되고 그 성벽이 완성되면, 그들은 조공과 세금과 통행세를 바치지 않을 것이며, 끝내 왕들의 수입에 손해를 끼칠 것입니다.[a]
  to: 이제 왕께 알려 드립니다. 만일 이 성읍이 다시 건축되고 그 성벽이 완성되면, 그들은 조공과 세금과 통행세를 바치지 않을 것이며, 결국 왕들에게 손해를 끼칠 것입니다.[a]
  rationale: 공식 통지 문구를 현대 격식체로 자연스럽게 고치고, 마지막 경고에서 원문이 명시하지 않는 ‘수입’을 본문에서 제거했습니다. 재정 손실이라는 문맥적 해석은 각주에 가능성으로만 남겨 원문의 압축성과 해석 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:42Z'
review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 아람어 표현(וְאַפְּתֹם מַלְכִים תְּהַנְזִק)은 ‘왕들의 수입’을 직접 언급하지 않고, 왕들에게 손해를 끼친다는 뜻으로 압축되어 있습니다. 현 번역은 문맥상 가능한 ‘수입’ 해석을 본문에 확정적으로 넣어 원문의 여지를 좁힙니다. 또한 ‘왕께 알려지게 하십시오’는 한국어에서 수신자인 왕에게 명령하는 듯하여 공문서 통지 공식으로 자연스럽지 않습니다.
  naturalness: ‘이제 왕께 알려 드립니다’는 현대 표준 한국어의 격식 있는 공문체로 자연스럽습니다. ‘왕들에게 손해를 끼칠 것입니다’도 원문의 간결한 경고를 자연스럽게 재현합니다.
  terminology: ‘성읍’, ‘성벽’, ‘조공과 세금과 통행세’는 문맥과 격식에 적절합니다. ‘왕들’의 복수는 보존해야 합니다. 수입/재정이라는 해석은 본문이 아니라 각주에서 문맥적 가능성으로 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘왕들의 수입에 손해를 끼칠 것입니다’가 원문에 없는 ‘수입’을 본문 의미로 확정합니다.
    rationale: 아람어는 왕들에게 발생할 손해를 말할 뿐 ‘수입’이라는 명사를 명시하지 않습니다. 세금 항목이라는 문맥상 재정 손실로 이해할 수 있으나, 이는 각주로 처리하여 해석상의 여지를 보존해야 합니다.
  - severity: medium
    issue: 각주가 ‘문자적으로는 “왕들의 수입”’이라고 설명합니다.
    rationale: 이는 원문의 문자적 의미가 아닙니다. 문자적으로는 대체로 ‘그리고 마침내 왕들에게 손해를 끼칠 것입니다’이며, 수입 손실은 문맥적 추론입니다.
  - severity: low
    issue: ‘왕께 알려지게 하십시오’의 화용이 부자연스럽습니다.
    rationale: 한국어에서는 왕에게 알려 달라고 명령하는 말로 들릴 수 있습니다. 발신자가 왕에게 공식적으로 알리는 표현으로 바꾸는 편이 적절합니다.
