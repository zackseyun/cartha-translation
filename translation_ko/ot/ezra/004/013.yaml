id: EZR.4.13
reference: Ezra 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּעַ֗ן יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן מִנְדָּֽה בְל֤וֹ וַ/הֲלָךְ֙ לָ֣א יִנְתְּנ֔וּן וְ/אַפְּתֹ֥ם מַלְכִ֖ים תְּהַנְזִֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
  footnotes:
  - marker: a
    text: Or 'and finally it will cause loss to the kings.' The Aramaic expression is concise, and the exact nuance of the loss is inferred from the context of unpaid tribute, tax, and toll.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕께 알려 드립니다. 만일 이 성읍이 다시 건축되고 그 성벽이 완성되면, 그들은 조공과 세금과 통행세를 바치지 않을 것이며, 결국 왕들에게 손해를 끼칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마침내 왕들에게 손실을 입힐 것입니다.” 아람어 표현은 간결하며 ‘수입’이나 ‘재정’을 직접 언급하지 않습니다. 조공·세금·통행세를 바치지 않는다는 앞 문맥상, 왕들의 재정에 손실이 생긴다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן / יְדִיעַ לֶהֱוֵא
  english_pob_choice: Now let it be known
  chosen_korean: 이제 왕께 알려지게 하십시오
  alternatives_korean:
  - 이제 왕께 알리게 하십시오
  - 지금 알려지게 하십시오
  lexicon: HALOT
  rationale: 공문체 아람어의 통지 공식에 맞춰 수동적·격식적 표현을 살렸습니다. '왕께'는 수신자를 분명히 하고, 현대 한국어 문서체에 맞게 자연스럽게 다듬었습니다.
- source_word: דִּי הֵן
  english_pob_choice: that if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 만약
  lexicon: HALOT
  rationale: 조건절의 도입 기능을 살려 간결한 '만일'로 옮겼습니다. 앞의 통지 공식과 결합될 때 'that if'의 의미를 충분히 전달합니다.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  english_pob_choice: tribute, tax, or toll
  chosen_korean: 조공과 세금과 통행세
  alternatives_korean:
  - 세공과 세금과 통행세
  - 조세와 세금과 통행세
  lexicon: HALOT
  rationale: 페르시아 행정용 세 항목을 서로 구분되게 옮겼습니다. '조공'은 מִנְדָּה의 상납적 성격을, '통행세'는 הֲלָךְ의 이동·통과 관련 부담을 드러냅니다.
- source_word: תְּהַנְזִק
  english_pob_choice: it will damage the revenue of the kings
  chosen_korean: 왕들의 수입에 손해를 끼칠 것입니다
  alternatives_korean:
  - 왕들의 수입을 해칠 것입니다
  - 왕들의 수입에 손실을 줄 것입니다
  lexicon: HALOT
  rationale: 동사의 '손해/손실을 야기하다'는 뜻을 한국어 관용에 맞게 풀었습니다. POB의 'revenue' 해석을 반영하되, 아람어의 압축된 표현은 '수입'으로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: '''왕들'' 복수형의 보존'
  chosen_reading: '''왕들의 수입''으로 복수를 그대로 살렸습니다.'
  alternative_readings:
  - '''왕의 수입''으로 단수화'
  - '''왕실의 수입''으로 제도화'
  rationale: 본문의 복수형을 평탄화하지 않고 그대로 유지하여, 아람어가 암시하는 왕권 계승자들의 재정적 손실 경고를 보존했습니다.
  doctrine_reference: 문맥상 역사서의 공문체 보존; 본문 비평/해석상 복수형 유지
- issue: 공문체 경고의 화법
  chosen_reading: 직접적인 명령·보고체로 옮겨 행정 문서의 긴박함을 살렸습니다.
  alternative_readings:
  - 완곡한 서술형으로 중화
  - 서간체를 약화시켜 서술
  rationale: 이 절은 단순 정보 전달이 아니라 왕의 정책 결정을 압박하는 공식 보고이므로, 현대 한국어에서도 단정적·경고적 어조를 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 본문 장르 보존
