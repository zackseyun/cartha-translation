source:
  edition: WLC
  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Now because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: ko
  text: 이제 우리는 궁궐의 소금을 먹는 사람들이며, 왕의 수치를 보는 것은 우리에게 합당하지 않으므로, 우리는 왕에게 사람을 보내어 알렸습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘궁궐의 소금을 먹는다’는 표현은 궁정의 은혜와 급료를 받으며 섬긴다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘왕의 벌거벗음/수치’에 해당하는 표현입니다. 문맥상 체면과 불명예를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַח הֵיכְלָא / 'eat the salt of the palace'
  english_pob_choice: we eat the salt of the palace
  chosen_korean: 궁궐의 소금을 먹는 사람들
  alternatives_korean:
  - 궁궐의 소금을 먹습니다
  - 궁궐의 양식을 받는 사람들
  lexicon: salt idiom
  rationale: 아람어 관용구를 직역해 궁정의 봉급·의무 관계를 드러내고, 평범한 식사보다 궁중 종속성을 보이기 위해 ‘먹는 사람들’로 옮겼습니다.
- source_word: עַרְוַת מַלְכָּא
  english_pob_choice: the king’s dishonor
  chosen_korean: 왕의 수치
  alternatives_korean:
  - 왕의 수치스러움
  - 왕의 불명예
  lexicon: ערוה/ dishonor
  rationale: 문맥상 ‘벌거벗음’보다 왕권에 대한 모욕과 수치를 가리키므로, 한국어에서도 가장 직접적인 의미인 ‘수치’로 옮겼습니다.
- source_word: לָא אֲרִיךְ לָנָא לְמֶחֱזֵא
  english_pob_choice: it is not fitting for us to see
  chosen_korean: 보는 것은 우리에게 합당하지 않으므로
  alternatives_korean:
  - 보는 것은 우리에게 마땅하지 않으므로
  - 목격하는 것은 우리에게 적절하지 않으므로
  lexicon: ראי/ fitting
  rationale: ‘합당하지 않다’는 도덕적·예의상의 부적절함을 함께 담을 수 있어, 본문의 궁정 예법과 정치적 충성을 자연스럽게 반영합니다.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  english_pob_choice: we have sent and informed the king
  chosen_korean: 우리는 왕에게 사람을 보내어 알렸습니다
  alternatives_korean:
  - 우리는 보내어 왕에게 알렸습니다
  - 우리는 왕께 보내어 알렸습니다
  lexicon: send / inform
  rationale: 두 동사를 한국어에서 자연스럽게 풀어, ‘보내다’와 ‘알리다’의 행위를 모두 유지하되 과도한 문어체 반복을 피했습니다.
theological_decisions:
- issue: 왕실 충성의 언어를 어떻게 옮길지
  chosen_reading: 궁정에 대한 충성과 왕의 체면을 강조하는 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 행정 보고로 약화시키기
  - ‘불명예’만 남기고 충성의 뉘앙스를 지우기
  rationale: 본문은 조서형 보고가 아니라, 궁정에 의존하는 자들이 왕의 명예를 지킨다는 정치-사회적 논리를 말하므로 그 긴장을 살렸습니다.
  doctrine_reference: 문맥 해석 / 왕권 예법
- issue: ‘see’의 번역
  chosen_reading: ‘보다’로 직접 옮기되, ‘목격하다’보다 더 중립적인 ‘보다’를 택했습니다.
  alternative_readings:
  - 목격하다
  - 바라보다
  rationale: 히브리/아람어 문맥에서 단순 시각 행위보다 ‘그 상황을 눈앞에서 보게 되는 것’을 뜻하므로, 지나치게 법률적이거나 감정적인 동사를 피했습니다.
  doctrine_reference: 어휘-문맥 해석
