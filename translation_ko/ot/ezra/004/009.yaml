  naturalness: 대괄호를 포함한 ‘선임[사령관]’은 한국어 본문으로 자연스럽지 않으며, ‘그 밖의 그들의 동료들’은 소유 표현이 중복됩니다. ‘심새’, ‘타르펠 사람들’, ‘페르시아 사람들’은 현대 표준 한국어 음역과 표현에 맞게 다듬었습니다. 이 절은 다음 절로 이어지는 명단의 도입부이므로 끝의 대시는 유지했습니다.
  terminology: 서기관, 재판관들, 관리들은 행정 문맥에 적절합니다. 르훔과 심새는 인명으로 음역하였고, 식별이 불확실한 타르펠 사람들은 음역했습니다. ‘곧 엘람 사람들’은 수사 사람들에 대한 원문의 설명적 동격을 잘 전달합니다.
  issues:
