revisions:
- from: 그때 르훔 선임[사령관], 삼새 서기관과 그 밖의 그들의 동료들—재판관들, 관리들, 다르펠 사람들, 바사 사람들, 에렉 사람들, 바벨론 사람들, 수사 사람들(곧 엘람 사람들)—[a][b]
  to: 그때 르훔 장관[a], 심새 서기관, 그리고 그 밖의 동료들—재판관들[b], 관리들[c], 타르펠 사람들, 페르시아 사람들, 에렉 사람들, 바벨론 사람들, 수사 사람들(곧 엘람 사람들)—
  rationale: 원문상 불확정적인 관직·집단명은 본문에서 과도하게 단정하지 않고, 필요한 대안은 해당 어휘에 연결된 각주로 보존했습니다. 영어 POB의 ‘judges’와 ‘officials’ 선택은 유지하되, 영어 감사 기록에서 잘못 배치된 각주 구조를 한국어 본문에 답습하지 않았습니다. 또한 자연스럽지 않은 대괄호 표기와 중복 소유 표현을 제거하고 인명·집단명 음역을 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:21:09Z'
