source:
  edition: WLC
  text: אֱדַ֜יִן רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א וּ/שְׁאָ֖ר כְּנָוָתְ/ה֑וֹן דִּ֠ינָיֵ/א וַ/אֲפַרְסַתְכָיֵ֞/א טַרְפְּלָיֵ֣/א אֲפָֽרְסָיֵ֗/א ארכוי בָבְלָיֵ/א֙ שֽׁוּשַׁנְכָיֵ֔/א ד/הוא עֵלְמָיֵֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
  footnotes:
  - marker: a
    text: Or 'the Dinaites'; the Aramaic term דִּינָיֵא may be read as an ethnic group name in traditional translations, but here it is rendered 'the judges' because the form also suits an administrative title and fits the surrounding official context.
    reason: alternative_reading
  - marker: b
    text: Or 'the Apharsathchites'; the Aramaic term אֲפַרְסַתְכָיֵא is difficult and has often been transliterated as a people-group name. Here it is rendered 'the lesser officials' as a plausible administrative designation.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 르훔 선임[사령관], 삼새 서기관과 그 밖의 그들의 동료들—재판관들, 관리들, 다르펠 사람들, 바사 사람들, 에렉 사람들, 바벨론 사람들, 수사 사람들(곧 엘람 사람들)—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선임[사령관]’은 본문의 관직 뜻을 살린 풀이이며, 원문은 해석상 ‘총독’이나 다른 행정 직함으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘곧’은 앞의 ‘수사 사람들’을 뒤의 ‘엘람 사람들’로 설명하는 관계를 풀어 쓴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  english_pob_choice: the commander
  chosen_korean: 선임[사령관]
  alternatives_korean:
  - 사령관
  - 지휘관
  - 총독
  lexicon: HALOT
  rationale: 아람어 관직명은 군사·행정 권위를 함께 시사하므로, 본문 문맥을 살리면서도 현대 한국어에서 관직성을 분명히 하는 표현으로 옮겼습니다.
- source_word: סָפְרָא
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 서기
  - 비서
  lexicon: HALOT
  rationale: 행정 문서 작성과 기록을 맡는 관직을 가리키므로, 성경 번역에서 익숙하고 원문 기능을 잘 드러내는 ‘서기관’을 택했습니다.
- source_word: דִּינָיֵא
  english_pob_choice: the judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 다인 사람들
  - 다니 사람들
  lexicon: HALOT
  rationale: 영어 POB가 이 단어를 관직명으로 읽는 해석을 따랐고, 주변의 행정 직함 목록과도 맞도록 ‘재판관들’로 옮겼습니다.
- source_word: אֲפַרְסַתְכָיֵא
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 아파르삿카 사람들
  - 하위 관리들
  lexicon: HALOT
  rationale: 불확실한 집단명으로 음역하기보다, POB의 판단처럼 행정적 기능을 드러내는 일반 명칭을 택해 본문의 관직 목록 흐름을 살렸습니다.
- source_word: טַרְפְּלָיֵא
  english_pob_choice: the Tarpelites
  chosen_korean: 다르펠 사람들
  alternatives_korean:
  - 다르펠리 사람들
  lexicon: HALOT
  rationale: 식별이 불확실한 집단명은 과도하게 뜻을 부여하지 않고 한국어 음역으로 처리했습니다.
- source_word: שׁוּשַׁנְכָיֵא
  english_pob_choice: the men of Susa
  chosen_korean: 수사 사람들
  alternatives_korean:
  - 수사 주민들
  - 수사인들
  lexicon: HALOT
  rationale: 지명 수사의 거주민을 뜻하므로, 원문의 투명성을 살리는 ‘수사 사람들’로 옮겼습니다.
theological_decisions:
- issue: 수사 사람들 뒤의 해설적 동격 처리
  chosen_reading: ‘(곧 엘람 사람들)’로 풀어, 본문의 설명적 관계를 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - ‘즉 엘람 사람들’
  - ‘그것은 엘람 사람들이다’
  rationale: דְּהוּא는 앞의 집단을 설명하는 표지이므로, 현대 한국어에서 자연스러운 동격 표지 ‘곧’으로 옮겨 의미 관계를 유지했습니다.
  doctrine_reference: 문맥 해석 및 서술 구조
- issue: 관직명들의 연쇄를 민족명으로 평준화하지 않음
  chosen_reading: 재판관들, 관리들 같은 관직 용어를 본문에 남겨 행정적 성격을 드러냈습니다.
  alternative_readings:
  - 다인 사람들, 아파르삿카 사람들 같은 집단명 음역
  - 혼합형 번역
  rationale: 영어 POB의 주석이 지적하듯 원문은 관직명으로도 읽히므로, 그 긴장을 지우지 않고 행정 문맥을 우선 반영했습니다.
  doctrine_reference: 원문 의미의 보존과 역사적 문맥 이해
