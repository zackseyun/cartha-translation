    rationale: 각주는 해당 본문 어휘 직후에 붙여야 합니다. 특히 두 표현의 관직명/집단명 구분은 논쟁적이므로, 본문 선택을 하더라도 대안 독법을 해당 위치의 주석에서 밝혀야 합니다.
  - severity: low
