    rationale: 번역 본문에 해설용 대괄호를 넣으면 독해를 방해합니다. 또한 בְּעֵל טְעֵם은 논쟁적인 행정 직함이지 ‘선임 사령관’이라는 확정된 군사 계급이 아닙니다.
  - severity: medium
    issue: 심새와 타르펠의 음역이 ‘삼새’, ‘다르펠’로 되어 있습니다.
    rationale: שִׁמְשַׁי는 ‘심새’가 더 직접적인 한국어 음역이며, טַרְפְּלָיֵא의 첫 자음 ט는 ‘타르펠’로 옮기는 것이 적절합니다.
  - severity: medium
