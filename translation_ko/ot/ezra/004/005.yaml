id: EZR.4.5
reference: Ezra 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
  footnotes:
  - marker: a
    text: Or 'to thwart their counsel.' The Hebrew עֲצָה can mean 'counsel,' 'plan,' or 'purpose.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바사 왕 고레스의 모든 날 동안, 바사 왕 다리오의 통치 때에 이르기까지, 그들의 계획[a]을 좌절시키려고 그들에게 맞서 조언자들을 고용하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 조언을 좌절시키려고’ 또는 ‘그들의 목적을 좌절시키려고’로도 옮길 수 있습니다. 히브리어 עֲצָה는 ‘조언’, ‘계획’, ‘목적’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  english_pob_choice: they hired
  chosen_korean: 고용하였습니다
  alternatives_korean:
  - 샀습니다
  - 뇌물을 주었습니다
  - 채용하였습니다
  lexicon: HALOT
  rationale: שׂכר의 여기서는 대가를 지불해 사람들의 서비스를 확보하는 뜻이므로, 현대 한국어에서 가장 자연스럽고 중립적인 동사인 ‘고용하다’로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들에 맞서
  alternatives_korean:
  - 그들에 대하여
  - 그들 위에
  lexicon: HALOT
  rationale: 문맥이 적대적이므로 עַל의 대립적 용법을 드러내기 위해 ‘맞서’로 옮겼습니다.
- source_word: יוֹעֲצִים
  english_pob_choice: counselors
  chosen_korean: 조언자들
  alternatives_korean:
  - 상담자들
  - 자문자들
  lexicon: HALOT
  rationale: יעץ 계열 명사로서 ‘조언을 주는 사람들’이라는 기능을 살려, 관료적 뉘앙스를 지나치게 좁히지 않는 ‘조언자들’로 옮겼습니다.
- source_word: לְהָפֵר עֲצָתָם
  english_pob_choice: to frustrate their plan
  chosen_korean: 그들의 계획을 무너뜨리려고
  alternatives_korean:
  - 그들의 계획을 좌절시키려고
  - 그들의 조언을 무효로 하려고
  - 그들의 목적을 무산시키려고
  lexicon: HALOT
  rationale: הפר는 ‘깨뜨리다/무효로 하다/좌절시키다’ 범위를 가지며, 여기서는 נגד(대적) 맥락의 방해를 자연스럽게 드러내는 ‘무너뜨리다’가 적합합니다. עֵצָה는 본문에서 ‘계획’의 뜻이 더 분명하므로 이를 반영했습니다.
- source_word: כָּל יְמֵי ... וְעַד
  english_pob_choice: all the days of ... even until
  chosen_korean: 모든 날 동안, 곧 … 때까지
  alternatives_korean:
  - 그 모든 날 내내, … 때까지
  - … 왕의 모든 날 동안
  - … 때까지 계속
  lexicon: HALOT
  rationale: משך הזמן의 시작과 끝을 함께 보여 주는 관용구이므로, ‘모든 날 동안’과 ‘때까지’를 짝지어 기간의 연속성을 살렸습니다.
- source_word: מַלְכוּת
  english_pob_choice: the reign
  chosen_korean: 통치
  alternatives_korean:
  - 왕국
  - 왕위
  - 다스림
  lexicon: HALOT
  rationale: 여기서는 나라의 영역이 아니라 왕권 행사의 기간을 가리키므로, 시간적 의미가 드러나는 ‘통치’가 가장 적절합니다.
theological_decisions:
- issue: 바사 왕들의 통치 기간을 역사적 한계로 제시하는 표현
  chosen_reading: 고레스에서 다리오에 이르는 기간 전체를, 적대적 방해가 지속된 역사적 시간대로 읽고 반영했습니다.
  alternative_readings:
  - 단순한 연대 정보로만 읽음
  - ‘통치’를 ‘왕국’으로 옮겨 공간적 의미를 강조함
  rationale: 본문의 초점은 방해 행위의 지속 기간에 있으며, 이를 역사 서술로 충실히 보여 주는 것이 문맥상 가장 분명합니다.
  doctrine_reference: Ezra-Nehemiah의 역사 서술 맥락
