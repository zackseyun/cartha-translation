source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
  footnotes:
  - marker: a
    text: Or, more literally, “for we together will build”; here “together” is understood in context to mean that they themselves, without the offered partners, would do the building.
    reason: lexical_alternative
  - marker: b
    text: “A house” refers to the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 스룹바벨과 예수아와 이스라엘의 나머지 가문 우두머리들이 그들에게 말했습니다. “여러분은 우리와 함께 우리 하나님의 집[a]을 짓는 일에 아무런 몫이 없습니다. 왜냐하면 우리는 우리만이 함께 이스라엘의 하나님 야훼를 위해 그것을 건축할 것이기 때문입니다. 이는 고레스 왕, 곧 페르시아 왕이 우리에게 명령한 대로입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא לָכֶם וָלָנוּ
  english_pob_choice: You have no part with us
  chosen_korean: 여러분은 우리와 함께 … 아무런 몫이 없습니다
  alternatives_korean:
  - 여러분은 우리와 우리 사이에 아무 관계가 없습니다
  - 여러분에게는 우리와 함께할 몫이 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 동참 여부가 아니라 공동 권리나 몫의 부정을 뜻하므로, 한국어로도 ‘몫이 없습니다’로 배타적 의미를 살렸습니다.
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  english_pob_choice: in building a house for our God
  chosen_korean: 우리 하나님의 집을 짓는 일
  alternatives_korean:
  - 우리 하나님을 위한 집을 짓는 것
  - 우리 하나님의 성전을 짓는 일
  lexicon: HALOT
  rationale: בַּיִת는 문자적으로 ‘집’이지만 문맥상 성전을 가리키므로, 원문 표현을 유지하면서도 이해를 돕기 위해 ‘집’을 살렸습니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: for Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼를 위해서만
  alternatives_korean:
  - 이스라엘의 하나님 여호와를 위해서만
  - 이스라엘의 하나님 주님을 위해서만
  lexicon: HALOT
  rationale: 이 구절은 야훼의 직접 표기를 쓰므로, 프로젝트 기본값에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  english_pob_choice: King Cyrus, the king of Persia
  chosen_korean: 페르시아 왕 고레스 왕
  alternatives_korean:
  - 페르시아의 왕 고레스
  - 고레스 왕, 페르시아 왕
  lexicon: HALOT
  rationale: 히브리어의 반복된 왕호를 반영해 ‘왕’을 두 번 살렸고, 고레스는 한국어 성경에서 널리 통용되는 고유명으로 옮겼습니다.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  english_pob_choice: Zerubbabel, Jeshua
  chosen_korean: 스룹바벨과 예수아
  alternatives_korean:
  - 스룹바벨과 여호수아
  lexicon: HALOT
  rationale: 인명은 통용되는 한국어 음역을 따르되, יֵשׁוּעַ는 본문 형태를 반영해 ‘예수아’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 이름의 음역인 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
