  source_fidelity: 원문의 두 병렬 분사, 곧 유다 백성의 결의를 약화시키는 행위와 건축을 막기 위해 두려움을 일으키는 행위를 모두 보존해야 합니다. 초안의 ‘손을 꺾어 힘을 잃게 하고’는 히브리어 관용구를 지나치게 신체적 손상처럼 들리게 하므로 수정이 필요합니다.
  naturalness: ‘의지를 꺾고’는 현대 표준 한국어에서 자연스럽고, 원문의 관용적 효과인 낙담·결의 약화를 정확히 전달합니다. ‘건축하지 못하도록 두렵게 했습니다’도 합쇼체 서술로 자연스럽습니다.
  terminology: ‘그 땅의 백성’, ‘유다 백성’, ‘건축’은 문맥과 성경 번역의 용례에 적절합니다. 관용구의 문자적 이미지는 각주에서 밝혀 의미와 원문의 표현을 함께 보존합니다.
