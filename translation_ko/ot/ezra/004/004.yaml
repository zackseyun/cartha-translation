  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ עַם הָ/אָ֔רֶץ מְרַפִּ֖ים יְדֵ֣י עַם יְהוּדָ֑ה ו/מבלהים אוֹתָ֖/ם לִ/בְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/004.yaml
  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''weakening the hands of,'' an idiom for discouraging or undermining resolve.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and making them afraid to build.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그 땅의 백성이 유다 백성의 손을 꺾어 힘을 잃게 하고, 그들이 건축하지 못하도록 두렵게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 관용적으로 ‘손을 약하게 하다’라는 뜻으로, 낙담시키거나 결심을 약화시키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 건축하지 못하도록 두렵게 하였다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그리고
  - 이 일이 있어
  lexicon: HALOT
  rationale: 서사 전개의 다음 사건을 자연스러운 현대 한국어로 연결하면서, 원문의 서사적 진행을 살렸습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 지역의 사람들
  - 토지의 백성
  - 그 나라의 백성
  lexicon: HALOT
  rationale: 본문의 관용구를 비교적 직역해, 귀환 공동체에 대항하는 주변 거주민이라는 문맥을 드러냈습니다.
- source_word: מְרַפִּים יְדֵי
  english_pob_choice: kept weakening the hands of
  chosen_korean: 손을 꺾어 힘을 잃게 하고
  alternatives_korean:
  - 손을 약하게 하며
  - 손을 무기력하게 하며
  - 의욕을 꺾어
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손을 약하게 하다’는 뜻을 살리되, 한국어에서 의미가 분명하도록 결말을 보강했습니다.
- source_word: וּמְבַלְהִים
  english_pob_choice: frightening
  chosen_korean: 두렵게 했습니다
  alternatives_korean:
  - 겁주었습니다
  - 불안하게 했습니다
  - 놀라게 했습니다
  lexicon: HALOT
  rationale: בהל의 감정적 충격과 공포 유발을 현대어로 자연스럽게 옮겼습니다.
- source_word: לִבְנוֹת
  english_pob_choice: from building
  chosen_korean: 건축하지 못하도록
  alternatives_korean:
  - 짓지 못하도록
  - 건축하는 일을 못 하게
  - 건축을 못 하게
  lexicon: HALOT
  rationale: 부정적 방해의 목적/결과를 분명히 하여, 단순한 ‘짓도록’으로 오해되지 않게 했습니다.
theological_decisions:
- issue: 본문의 이중적 압박(손을 약하게 함 + 두렵게 함)을 어떻게 표현할지
  chosen_reading: 외적 방해와 심리적 공포를 모두 드러내는 이중 표현을 유지했습니다.
  alternative_readings:
  - 한 가지로 압축해 ‘방해했다’고만 번역
  - ‘의욕을 꺾었다’로 심리적 측면만 강조
  rationale: 원문은 행동과 감정 양쪽을 병렬로 제시하므로, 둘 중 하나로 평준화하면 본문의 강도를 약화시킬 수 있습니다.
  doctrine_reference: '본문 주해 원칙: 원문의 수사적 중첩 보존'
- issue: ‘손을 약하게 하다’ 관용구의 직역과 의역 사이 균형
  chosen_reading: 직역 이미지를 유지하되 한국어 의미가 즉시 이해되도록 ‘손을 꺾어 힘을 잃게 하고’로 옮겼습니다.
  alternative_readings:
  - ‘손을 약하게 하고’
  - ‘의욕을 꺾고’
  rationale: 히브리어 이미지와 효과를 함께 전달하기 위해, 관용구의 핵심 이미지를 남기면서도 독해 가능성을 높였습니다.
  doctrine_reference: '본문 주해 원칙: 관용구의 이미지 보존'
