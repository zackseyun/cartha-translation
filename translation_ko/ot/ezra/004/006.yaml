    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  english_pob_choice: And in the reign of
  chosen_korean: 통치 중
  alternatives_korean:
  - 왕국에서
  - 치세에
  lexicon: HALOT
  rationale: מַלְכוּת는 여기서 왕의 통치 기간을 가리키므로, 한국어로는 자연스럽고 문맥에 맞는 ‘통치 중’으로 옮겨 시점 표지를 살렸습니다.
- source_word: אֲחַשְׁוֵרוֹשׁ
  english_pob_choice: Ahasuerus
  chosen_korean: 아하수에로
  alternatives_korean:
  - 아하수에루스
  - 크세르크세스
  lexicon: 고유명사 표기
  rationale: 히브리어 인명은 본문 보존을 위해 음역하고, 한국어 성경에서 널리 쓰이는 형태인 ‘아하수에로’를 택했습니다.
- source_word: בִּ/תְחִלַּת מַלְכוּתוֹ
  english_pob_choice: at the beginning of his reign
  chosen_korean: 그의 통치 초기에
  alternatives_korean:
  - 그의 왕권의 시작에
  - 그의 치세 시작에
  lexicon: HALOT
  rationale: 구문이 통치의 초기 시점을 뜻하므로, 압축되면서도 자연스러운 ‘그의 통치 초기에’로 옮겼습니다.
- source_word: שִׂטְנָה
  english_pob_choice: an accusation
  chosen_korean: 고발장
  alternatives_korean:
  - 고발
  - 반대 진술
  - 송사
  lexicon: HALOT
  rationale: 이 명사는 적대적·공식적 성격의 서면 고발을 가리키므로, 단순한 ‘고발’보다 문서성을 드러내는 ‘고발장’이 문맥에 더 가깝습니다.
