id: EZR.4.19
reference: Ezra 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
  footnotes:
  - marker: a
    text: Or 'has exalted itself against kings.' The Aramaic verb can suggest self-exaltation, but in this context it carries the sense of rising up in opposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'rebellion and insurrection have been done in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 조서를 내렸으므로, 그들이 찾아보아 이 성읍이 예로부터 왕들에게 반역해 왔고[a], 그 안에서 반역과 소요가 행해져 왔음을 알아냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕들에게 스스로 높아져 왔다.” 아람어 동사는 자기 높임의 뉘앙스를 띨 수 있지만, 여기서는 반역적 상승의 뜻으로 읽는 것이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “반역과 insurrection이 그 안에서 이루어져 왔다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  english_pob_choice: a decree was issued
  chosen_korean: 조서를 내렸으므로
  alternatives_korean:
  - 명령을 내렸으므로
  - 칙령을 반포하였으므로
  lexicon: HALOT
  rationale: 아람어 관용구의 행정적 의미를 살리면서, 왕이 직접 발한 공식 문서라는 점을 자연스럽게 드러냅니다.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  english_pob_choice: they searched and found
  chosen_korean: 찾아보아 … 알아냈습니다
  alternatives_korean:
  - 조사하여 … 발견했습니다
  - 살펴보고 … 찾았습니다
  lexicon: HALOT
  rationale: 공적 조사와 기록 검토의 흐름을 한국어로 자연스럽게 옮기되, 결과 동사로서의 ‘found’는 ‘알아냈습니다’로 전달했습니다.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  english_pob_choice: has ... risen up against kings
  chosen_korean: 왕들에게 반역해 왔고
  alternatives_korean:
  - 왕들에게 맞서 उठ어 왔고
  - 왕들에게 대항하여 스스로 높아져 왔고
  lexicon: HALOT
  rationale: 문맥상 정치적 반항을 가리키므로 ‘반역하다’로 옮기되, 동사의 지속적 뉘앙스를 ‘-해 왔고’로 살렸습니다.
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  english_pob_choice: rebellion and sedition
  chosen_korean: 반역과 소요
  alternatives_korean:
  - 반란과 선동
  - 반역과 불온한 소요
  lexicon: HALOT
  rationale: 두 명사를 구별하면서도 서로 겹치는 정치적 혼란의 의미를 한국어에서 간결하게 살렸습니다.
- source_word: מִתְעֲבֶד בַּהּ
  english_pob_choice: have been carried out in it
  chosen_korean: 행해져 왔음을
  alternatives_korean:
  - 행하여져 왔음을
  - 그 안에서 일어났음을
  lexicon: HALOT
  rationale: 수동적/관행적 의미를 보존하기 위해 ‘행해지다’를 택했고, 장소 표현 ‘그 안에서’로 도시 내부를 분명히 했습니다.
theological_decisions:
- issue: 왕권에 대한 반역 표현의 강도
  chosen_reading: ‘반역해 왔고’로 옮겨, 단순한 불일치가 아니라 지속적인 정치적 대항을 드러냈습니다.
  alternative_readings:
  - ‘맞서 왔고’
  - ‘대항해 왔고’
  rationale: 아람어의 왕들에 대한 적대적 상승/반항 의미를 약화하지 않기 위해, 본문이 제시하는 고발의 성격을 분명히 했습니다.
  doctrine_reference: 본문 문맥상 역사적-정치적 진술이며 교리 논쟁은 아니지만, 왕권에 대한 지속적 저항이라는 서술의 뉘앙스를 보존해야 합니다.
