  text: 지휘관 르훔과 서기관 시므새가 예루살렘을 거슬러 아르닥사스다 왕에게 편지를 썼습니다. 그 내용은 다음과 같습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지휘관’으로 옮긴 아람어 직함(בְּעֵל טְעֵם)은 정확한 페르시아 행정 관직과의 대응이 확정되지 않았습니다. ‘총리’ 또는 ‘고문관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  english_pob_choice: the commander
  chosen_korean: 다스리는 자
  alternatives_korean:
  - 사령관
  - 총리
  - 서기관장
  lexicon: HALOT
  rationale: 이 아람어 직함은 정확한 페르시아 관직명보다 공식적 권한을 가진 관리라는 기능이 핵심이므로, 본문 맥락을 살리면서도 현대 한국어에서 과도하게 특정되지 않는 ‘다스리는 자’로 옮겼습니다.
- source_word: סָפְרָא
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 문서관
  - 비서
  lexicon: HALOT
  rationale: שרפָא는 문서 작성·기록 업무를 맡은 관직을 가리키므로, 한국어에서도 lexical 연결이 분명한 ‘서기관’이 가장 직접적입니다.
- source_word: אִגְּרָה חֲדָה
  english_pob_choice: a letter
  chosen_korean: 한 편지
  alternatives_korean:
  - 한 통의 편지
  - 편지 한 통
  lexicon: HALOT
  rationale: חֲדָה의 ‘하나’는 수량을 강조할 수 있지만, 한국어에서는 서신 도입에 자연스러운 ‘한 편지’가 원문의 비정관성을 충분히 반영합니다.
- source_word: עַל יְרוּשְׁלֶם
  english_pob_choice: against Jerusalem
  chosen_korean: 예루살렘에 대하여
  alternatives_korean:
  - 예루살렘을 상대로
  - 예루살렘에 반하여
  lexicon: HALOT
  rationale: 여기서는 편지의 적대적 성격이 문맥에서 분명하지만, 전치사 자체는 중립적인 ‘대하여’이므로 의미를 과장하지 않으면서도 다음 문맥의 대립성을 유지했습니다.
