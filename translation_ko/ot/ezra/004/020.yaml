source:
  edition: WLC
  text: וּ/מַלְכִ֣ין תַּקִּיפִ֗ין הֲווֹ֙ עַל יְר֣וּשְׁלֶ֔ם וְ/שַׁ֨לִּיטִ֔ין בְּ/כֹ֖ל עֲבַ֣ר נַהֲרָ֑/ה וּ/מִדָּ֥ה בְל֛וֹ וַ/הֲלָ֖ךְ מִתְיְהֵ֥ב לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
  footnotes:
  - marker: a
    text: Or 'over all Beyond the River'; the phrase is an official designation for the imperial territory west of the Euphrates.
    reason: cultural_note
  - marker: b
    text: The three terms 'tribute, tax, and toll' are distinct categories of imperial revenue; alternatives include 'tribute, custom, and toll' or 'tribute, tax, and customs duty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘을 다스리고 강 저편[a] 전 지역을 통치하던 막강한 왕들이 있었으며, 그들에게 조공과 세금과 통행세가 바쳐졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강 저편’은 유프라테스강 서쪽의 제국 행정 지역을 가리키는 공식 명칭입니다.
    reason: cultural_note
  - marker: b
    text: 원문의 ‘조공, 세금, 통행세’는 서로 구별되는 제국 수입 항목입니다. 각 항목의 정확한 세부 구분에 대해서는 다른 견해들이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  english_pob_choice: mighty kings
  chosen_korean: 강한 왕들
  alternatives_korean:
  - 힘센 왕들
  - 막강한 왕들
  lexicon: HALOT
  rationale: 복수 명사와 힘/권세의 형용사 조합을 자연스러운 현대 한국어로 옮겼습니다. ‘강한’은 힘과 권세를 함께 포괄하면서도 과도하게 해석을 덧붙이지 않습니다.
- source_word: עַל יְרוּשְׁלֶם
  english_pob_choice: were over Jerusalem
  chosen_korean: 예루살렘 위에 있었고
  alternatives_korean:
  - 예루살렘을 다스렸고
  - 예루살렘 위에 군림했고
  lexicon: HALOT
  rationale: 전치사 עַל의 지배적 의미를 살리되, 단순 위치보다 통치 관계가 드러나도록 했습니다. 뒤의 ‘다스렸으며’와 함께 권위 관계를 분명히 합니다.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  english_pob_choice: over all the region Beyond the River
  chosen_korean: 강 저편 온 지역
  alternatives_korean:
  - 유브라데 강 건너편 온 지역
  - 강 저편 전 지역
  lexicon: HALOT
  rationale: 관청식 지명 표현인 ‘Beyond the River’를 한국어로 기능적으로 옮겼습니다. 원문의 공식 지리 지칭을 유지하면서도 읽기 쉽게 했습니다.
- source_word: מִדָּה בְלוֹ וַהֲלָךְ
  english_pob_choice: tribute, tax, and toll
  chosen_korean: 조공과 세금과 통행세
  alternatives_korean:
  - 공물과 세금과 관세
  - 조세와 세금과 통행세
  lexicon: HALOT
  rationale: 세 항목의 구별을 살리기 위해 서로 다른 한국어 항목을 유지했습니다. 특히 וַהֲלָךְ는 통행·운송 관련 부과금의 성격이 있어 ‘통행세’가 적합합니다.
- source_word: מִתְיְהֵב לְהוֹן
  english_pob_choice: were paid to them
  chosen_korean: 바쳐졌습니다
  alternatives_korean:
  - 그들에게 지급되었습니다
  - 그들에게 납부되었습니다
  lexicon: HALOT
  rationale: 수동형으로 제국의 세입이 통치자들에게 돌아간다는 점을 반영했습니다. ‘바쳐지다’는 단순 지급보다 조공·세금 문맥에 더 잘 맞습니다.
theological_decisions:
- issue: 제국 권위의 묘사
  chosen_reading: 본문은 예루살렘과 강 저편 지역이 제국의 지배와 조세 체계 아래 있었음을 사실적으로 서술합니다.
  alternative_readings:
  - 단순한 역사 서술로만 제한하는 읽기
  - 과장된 제국 선전어로만 보는 읽기
  rationale: 이 절은 왕권과 조세의 실제 통치 구조를 보여 주므로, ‘다스렸으며’와 ‘바쳐졌습니다’를 통해 지배와 예속의 현실을 그대로 드러냈습니다.
  doctrine_reference: 역사-신학적 서술의 문자적 의미 보존
