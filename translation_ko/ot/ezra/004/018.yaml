translation:
  language: ko
  text: 그대들이 우리에게 보낸 문서는 내 앞에서 분명하게 낭독되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그대들이 우리에게 보낸 편지는 내 앞에서 분명하게 낭독되었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  english_pob_choice: the document
  chosen_korean: 문서
  alternatives_korean:
  - 편지
  - 서신
  - 기록문
  lexicon: HALOT
  rationale: 아람어 관료 문맥에서 공식 서면을 가리키므로, 영어 POB의 'document'에 맞춰 가장 포괄적인 ‘문서’로 옮겼습니다.
- source_word: שְׁלַחְתּוּן עֲלֶינָא
  english_pob_choice: you sent to us
  chosen_korean: 당신이 보내신
  alternatives_korean:
  - 우리에게 보내신
  - 우리를 향해 보내신
  lexicon: HALOT
  rationale: 문맥상 대상은 왕실로 도착한 공문이므로 ‘to us’의 의미를 살려 정중한 2인칭 복수 과거를 한국어 높임 표현으로 처리했습니다.
- source_word: מְפָרַשׁ
  english_pob_choice: plainly
  chosen_korean: 분명하게
  alternatives_korean:
  - 명확하게
  - 뚜렷하게
  - 명시적으로
  lexicon: HALOT
  rationale: ‘읽히다/읽다’의 방식이 분명해졌다는 뜻을 살려, 해석을 과도하게 좁히지 않는 ‘분명하게’를 선택했습니다.
- source_word: קָדָמָי
  english_pob_choice: before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 앞에
  - 내 면전에서
  - 내 앞에 놓여
  lexicon: HALOT
  rationale: 왕의 궁정 표현인 ‘before me’를 자연스러운 한국어 관용으로 옮기되, 공식 보고 상황의 직접성을 유지했습니다.
