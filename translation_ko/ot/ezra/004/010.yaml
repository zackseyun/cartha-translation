id: EZR.4.10
reference: Ezra 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאָ֣ר אֻמַּיָּ֗/א דִּ֤י הַגְלִי֙ אָסְנַפַּר֙ רַבָּ֣/א וְ/יַקִּירָ֔/א וְ/הוֹתֵ֣ב הִמּ֔וֹ בְּ/קִרְיָ֖ה דִּ֣י שָׁמְרָ֑יִן וּ/שְׁאָ֥ר עֲבַֽר נַהֲרָ֖/ה וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
  footnotes:
  - marker: a
    text: Osnappar is often identified with the Assyrian king Ashurbanipal, but the translation keeps the Aramaic name form found in the text.
    reason: cross_reference
  - marker: b
    text: Or 'beyond the River.' This was a Persian administrative term for the region west of the Euphrates.
    reason: cultural_note
  - marker: c
    text: The final expression is an Aramaic letter formula; alternatively, 'and so forth' or 'at such a time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사마리아 성에 정착시킨 큰 자요 귀한 자인 오스납발이 끌어간 백성의 나머지와, 강 건너편의 나머지, 그리고 지금:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 오스납발은 흔히 아시리아 왕 아슈르바니팔과 동일시되지만, 본문에 있는 아람어 이름 형태를 본문에서 그대로 살렸습니다.
    reason: cross_reference
  - marker: b
    text: ‘강 건너편’은 유프라테스 강 서쪽 지역을 가리키는 페르시아 행정 용어일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 마지막 표현은 아람어 서신 공식구입니다. 달리 ‘그리고 그 밖에’ 또는 ‘그때에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  english_pob_choice: the rest of the peoples
  chosen_korean: 백성의 나머지
  alternatives_korean:
  - 민족들의 나머지
  - 사람들의 나머지
  lexicon: HALOT
  rationale: 여기서는 앞선 열거에서 남은 집단들을 가리키므로, 집합적 의미를 살리면서도 한국어에서 자연스러운 ‘백성의 나머지’로 옮겼습니다.
- source_word: הַגְלִי
  english_pob_choice: deported
  chosen_korean: 끌어간
  alternatives_korean:
  - 유배시킨
  - 추방한
  lexicon: HALOT
  rationale: 제국의 강제 이주 행위를 가리키므로 ‘끌어간’이 원문의 강제성을 드러내면서도 합쇼체 문맥에서 지나치게 현대 행정어처럼 들리지 않습니다.
- source_word: רַבָּא וְיַקִּירָא
  english_pob_choice: the great and noble
  chosen_korean: 큰 자요 귀한 자인
  alternatives_korean:
  - 위대하고 고귀한
  - 크고 존귀한
  lexicon: HALOT
  rationale: 두 형용사는 오스납발에 대한 존칭이므로, 직역을 유지하되 한국어 관용에 맞게 ‘큰 자요 귀한 자인’으로 처리했습니다.
- source_word: עֲבַר נַהֲרָה
  english_pob_choice: Beyond the River
  chosen_korean: 강 건너편
  alternatives_korean:
  - 강 건너 지역
  - 유프라테스 건너편
  lexicon: HALOT
  rationale: 이는 유프라테스 서쪽 지역을 가리키는 행정 용어이지만, 본문 맥락에서는 지리적·행정적 지시를 함께 살려 ‘강 건너편’으로 번역했습니다.
theological_decisions:
- issue: 아람어 서신 공식구 וּכְעֶנֶת의 처리
  chosen_reading: ‘그리고 지금:’으로 옮겨 서신 서두의 전환 공식을 보존했습니다.
  alternative_readings:
  - '그리고 이제:'
  - '그리고 그러므로:'
  rationale: 이 표현은 내용 정보가 아니라 문서 담화 표지이므로, 한국어 독자가 이어지는 본문이 편지 본문임을 느끼도록 표지 성격을 드러냈습니다.
  doctrine_reference: 서신 형식 보존
