source:
  edition: WLC
  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
  footnotes:
  - marker: a
    text: Or 'ceased' / 'was stopped' for the first verb; the Aramaic root בטל carries the sense of stopping or ceasing.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of God.' Literally, 'the house of God.'
    reason: lexical_alternative
  - marker: c
    text: The clause 'and it remained stopped' expresses an ongoing state, not merely a second mention of the stoppage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예루살렘에 있는 하나님의 집 공사가 중단되었고, 페르시아 왕 다리오의 통치 둘째 해까지 계속 중단된 상태로 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그러자
  lexicon: HALOT
  rationale: 서술 전환을 표시하는 아람어 시간 부사로, 한국어에서는 자연스러운 장면 연결인 ‘그때’가 가장 간결하고 현대적입니다.
- source_word: בְּטֵלַת / וַהֲוָת בָּטְלָא
  english_pob_choice: stopped / remained stopped
  chosen_korean: 중단되었고 / 계속 중단된 상태로 있었습니다
  alternatives_korean:
  - 멈추었고 / 멈춘 채 있었습니다
  - 중지되었고 / 중지된 채 있었습니다
  lexicon: HALOT
  rationale: 첫 동사는 공사가 실제로 멈춘 사건을, 뒤의 절은 그 중단 상태의 지속을 나타내므로 두 표현을 구분해 옮겼습니다.
- source_word: בֵּית אֱלָהָא
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 전
  lexicon: HALOT
  rationale: 직역에 가까운 ‘하나님의 집’을 유지하여 원문의 형식을 보존했고, ‘성전’은 해석적이지만 본문이 허용하는 범위의 대안입니다.
- source_word: עַד שְׁנַת תַּרְתֵּין לְמַלְכוּת דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  english_pob_choice: until the second year of the reign of Darius king of Persia
  chosen_korean: 페르시아 왕 다리오의 통치 제2년까지
  alternatives_korean:
  - 다리오 왕의 통치 제2년까지
  - 페르시아 왕 다리오의 왕위 제2년까지
  lexicon: HALOT
  rationale: 왕의 재위 연대라는 관용적 시점을 살리되, ‘reign’에 해당하는 표현을 ‘통치’로 옮겨 현대적이고 명확하게 했습니다.
