source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
  footnotes:
  - marker: a
    text: Or 'went up against the Jews'; the Aramaic preposition can carry a hostile sense, which is reflected by the following action of stopping the work.
    reason: lexical_alternative
  - marker: b
    text: Or 'stopped them with force and strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아닥사스다 왕의 서한 사본이 르훔과 서기관 심새와 그들의 동료들 앞에서 낭독되자, 그들은 예루살렘으로, 유다 사람들에게[a] 급히 올라가 힘과 강압으로 그들을 멈추게 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들에게 맞서’. 아람어 전치사는 적대적인 뜻을 나타낼 수 있으며, 뒤따르는 강제 행위가 그 의미를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘힘과 위력으로 그들을 멈추게 하였다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그런 뒤
  lexicon: HALOT
  rationale: 서사의 다음 진행을 나타내는 시간 부사로, 한국어에서는 ‘그때’가 가장 자연스럽게 연결됩니다.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  english_pob_choice: the copy of the letter
  chosen_korean: 서한 사본
  alternatives_korean:
  - 공문 사본
  - 편지 사본
  lexicon: HALOT
  rationale: פַּרְשֶׁגֶן은 ‘사본/전사본’이고 נִשְׁתְּוָנָא는 공식 문서성의 서한을 가리키므로, 두 요소를 간명하게 살려 ‘서한 사본’으로 옮겼습니다.
- source_word: קֱרִי קֳדָם
  english_pob_choice: was read before
  chosen_korean: 앞에서 낭독되자
  alternatives_korean:
  - 앞에서 읽히자
  - 그들 앞에서 읽자
  lexicon: HALOT
  rationale: ‘before’의 자리 관계를 ‘앞에서’로 살리고, 공적 문서의 전달 상황을 고려해 ‘읽다’보다 ‘낭독하다’를 택했습니다.
- source_word: בְּאֶדְרָע וְחָיִל
  english_pob_choice: by force and power
  chosen_korean: 힘과 권세로
  alternatives_korean:
  - 힘과 능력으로
  - 폭력과 힘으로
  lexicon: HALOT
  rationale: 강제성을 나타내는 관용구로, 단순 물리력뿐 아니라 지배적 강압을 함께 드러내기 위해 ‘힘과 권세로’를 선택했습니다.
theological_decisions:
- issue: עַל יְהוּדָיֵא의 방향성
  chosen_reading: ‘유다 사람들에게’로 옮기되, 뒤의 강제 행위가 본문의 적대적 의도를 분명히 드러내도록 했습니다.
  alternative_readings:
  - ‘유다 사람들을 향해’
  - ‘유다 사람들에 맞서’
  rationale: 이 전치사는 문맥상 적대적 움직임을 띨 수 있지만, 한국어에서는 목적지 표현을 자연스럽게 두고 이후 동사구가 적대성을 충분히 보여 주도록 하는 편이 본문의 흐름을 잘 살립니다.
  doctrine_reference: 본문의 서술적 의미와 문맥적 적대성
