  text: Now the adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of the exile''; that is, the community of those who had gone into exile and returned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 유다와 베냐민의 적대자들은, 유배에서 돌아온 사람들의 자손이 야훼, 이스라엘의 하나님을 위한 성전을 짓고 있다는 것을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘유배의 자손’입니다. 즉, 유배로 끌려갔다가 돌아온 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵי
  english_pob_choice: adversaries
  chosen_korean: 적대자들
  alternatives_korean:
  - 원수들
  - 대적자들
  lexicon: HALOT
  rationale: 문맥상 유다와 베냐민에 맞서는 hostile party를 가리키므로 ‘적대자들’이 직접적이면서도 과도하게 군사적이지 않습니다.
- source_word: בְנֵי הַגּוֹלָה
  english_pob_choice: the sons of the exile
  chosen_korean: 유배에서 돌아온 사람들의 자손
  alternatives_korean:
  - 유배의 자손
  - 포로들의 자손
  - 포로 귀환자들
  lexicon: HALOT
  rationale: 히브리어 표현의 ‘자손’ 구조를 살리되, 한국어에서 자연스럽게 이해되도록 POB 각주 취지에 따라 공동체적 의미를 풀어 옮겼습니다.
- source_word: בּוֹנִים
  english_pob_choice: were building
  chosen_korean: 짓고 있다는 것을
  alternatives_korean:
  - 짓고 있었다는 것을
  - 건축하고 있다는 것을
  lexicon: HALOT
  rationale: 서술형 문맥의 현재진행적 동작을 한국어 간접인용 안에서 자연스럽게 나타내기 위해 ‘짓고 있다는 것을’로 옮겼습니다.
- source_word: הֵיכָל לַיהוָה
  english_pob_choice: a temple for Yahweh
  chosen_korean: 야훼 …를 위한 성전
  alternatives_korean:
  - 야훼를 위한 성전
  - 야훼의 성전
  - 주님의 성전
  lexicon: HALOT
  rationale: 히브리어의 목적격/용도 관계를 살려 ‘...를 위한 성전’으로 옮겼고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 유배 공동체를 가리키는 בני הגולה의 처리
  chosen_reading: 유배에서 돌아온 사람들의 자손
  alternative_readings:
  - 포로들의 자손
  - 귀환한 포로들
  - 유배민
  rationale: 본문의 직접 표현은 ‘자손’이지만, 한국어에서 오해 없이 읽히도록 공동체 지칭을 풀어 주되, 의미를 ‘귀환 공동체’로 과도하게 축소하지 않았습니다.
  doctrine_reference: 'POB translation principle: maintain what the author meant for the audience to understand'
