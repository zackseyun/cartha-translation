  text: 유다와 베냐민의 적대자들은 유배 공동체의 자손[a]이 야훼 곧 이스라엘의 하나님을 위한 성전을 짓고 있었다는 것을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
