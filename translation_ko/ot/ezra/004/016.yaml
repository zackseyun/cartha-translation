  text: מְהוֹדְעִ֤ין אֲנַ֨חְנָה֙ לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן לָ/קֳבֵ֣ל דְּנָ֔ה חֲלָק֙ בַּ/עֲבַ֣ר נַהֲרָ֔/א לָ֥א אִיתַ֖י לָֽ/ךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
  footnotes:
  - marker: a
    text: Aramaic 'portion/share' could also be rendered 'share' or, more specifically in context, 'revenue.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Beyond the River,' the official Persian name for the trans-Euphrates province.
    reason: cultural_note
translation:
  language: ko
  text: 우리는 왕께 아룁니다. 만일 이 성이 다시 세워지고 그 성벽들이 완공되면, 이 때문에 왕께서는 강 건너 지방[b]에서 아무 몫도[a] 갖지 못하게 되실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫’은 아람어 חֲלָק의 넓은 의미로, 문맥에 따라 ‘분깃’이나 ‘지분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강 건너 지방’은 페르시아 제국의 공식 행정 구역명인 ‘강 건너편(Beyond the River)’을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין
  english_pob_choice: We make known
  chosen_korean: 우리는 아뢰오니
  alternatives_korean:
  - 우리는 알리오니
  - 우리는 알려 드리오니
  lexicon: HALOT
  rationale: 공문서식 보고 문맥을 살려 ‘아뢰다’를 택했습니다. 현대 한국어에서 다소 격식이 높지만, 왕에게 올리는 진술의 형식을 잘 반영합니다.
- source_word: דִּי הֵן
  english_pob_choice: that if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 만약
  lexicon: HALOT
  rationale: 아람어의 조건 도입을 자연스럽게 옮기되, 보고문의 경직된 어조를 유지했습니다.
- source_word: חֲלָק
  english_pob_choice: possession
  chosen_korean: 소유하실 몫
  alternatives_korean:
  - 소유권
  - 몫
  - 분깃
  lexicon: HALOT
  rationale: 문맥상 정치적·행정적 ‘몫/몫에 해당하는 지분’이라는 뜻이므로, 단순한 재산 소유보다 넓은 의미를 살려 ‘소유하실 몫’으로 옮겼습니다.
- source_word: בַּעֲבַר נַהֲרָא
  english_pob_choice: Beyond the River
  chosen_korean: 강 건너 지방
  alternatives_korean:
  - 강 건너편
  - 하천 건너 지방
  lexicon: HALOT
  rationale: 페르시아의 공식 지방명임을 드러내면서도, 한국어 본문은 지나치게 설명적이지 않게 옮겼습니다. 기존 관용구 ‘강 건너 지방’을 사용하되, 지명성을 유지했습니다.
theological_decisions:
- issue: 왕에게 대한 공식 보고의 화자 표기
  chosen_reading: ‘우리는 아뢰오니’로 왕에게 올리는 공문체를 유지했습니다.
  alternative_readings:
  - ‘우리는 알립니다’
  - ‘왕께 보고합니다’
  rationale: 본문은 단순 서술이 아니라 제국 행정문서의 경고 보고이므로, 문체가 내용의 긴장과 권력 관계를 드러내야 합니다.
  doctrine_reference: 문체/담화 기능 보존
