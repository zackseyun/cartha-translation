  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
  footnotes:
  - marker: a
    text: Hebrew reads 'and not we are sacrificing'; many understand this as a scribal form for 'and to him we are sacrificing' or otherwise take it idiomatically in a positive sense from the context.
    reason: textual_variant
  - marker: b
    text: Or 'we worship your God' / 'we inquire of your God.' The Hebrew verb 'seek' can carry religious overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 스룹바벨과 족장들의 우두머리들에게 다가와 말했습니다. “우리가 당신들과 함께 건축하게 해 주십시오. 우리도 당신들과 같이 당신들의 하나님을 찾고 있으며, 우리도 앗수르 왕 에살핫돈이 우리를 이곳으로 데려온 때부터 그분께 희생제를 드려 왔습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그리고 우리가 희생하지 않는다’로 되어 있으나, 많은 이들은 이를 ‘그리고 우리가 그분께 희생한다’는 뜻의 서기적 형태로 보거나 문맥상 긍정적으로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘당신들의 하나님을 예배합니다’/‘당신들의 하나님께 묻습니다’. 히브리어 동사는 종교적 의미로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  english_pob_choice: they approached
  chosen_korean: 다가와
  alternatives_korean:
  - 나아와
  - 다가갔습니다
  lexicon: HALOT
  rationale: 서술적 wayyiqtol의 이동 의미를 자연스러운 현대 한국어로 살리되, 문어체의 흐름을 유지하기 위해 ‘다가와’로 옮겼습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 족장들의 우두머리들
  alternatives_korean:
  - 가문의 우두머리들
  - 조상 집안의 우두머리들
  lexicon: HALOT
  rationale: 에스라에서 반복되는 사회·가문 구조를 드러내기 위해 직역적 요소를 남기면서도, 한국어에서 이해되는 표현으로 다듬었습니다.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  english_pob_choice: we seek your God
  chosen_korean: 당신들의 하나님을 찾고 있으며
  alternatives_korean:
  - 당신들의 하나님을 구하고 있으며
  - 당신들의 하나님께 묻고 있으며
  lexicon: HALOT
  rationale: דרשׁ의 종교적 범위를 좁히지 않기 위해 ‘찾다’를 기본으로 두었고, 문맥상 지속 상태를 나타내기 위해 ‘찾고 있으며’로 처리했습니다.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  english_pob_choice: and we have been sacrificing to him
  chosen_korean: 우리도 … 희생제를 드려 왔습니다
  alternatives_korean:
  - 우리도 … 제사를 드려 왔습니다
  - 우리도 … 바치고 있습니다
  lexicon: HALOT
  rationale: 본문의 לא/לו 문제를 반영해, 영어 POB처럼 문맥상 긍정 취지를 살리되 한국어 본문은 관용적이면서도 제의적 뉘앙스가 드러나는 ‘희생제를 드리다’로 옮겼습니다.
- source_word: מִימֵי אֵסַר חַדֹּן
  english_pob_choice: since the days of Esar-haddon
  chosen_korean: 앗수르 왕 에살핫돈이 … 때부터
  alternatives_korean:
  - 에살핫돈 왕의 날들부터
  - 에살핫돈의 시대부터
  lexicon: HALOT
  rationale: 시간의 기점을 나타내는 관용을 한국어에서 자연스럽게 풀어 ‘때부터’로 옮겼습니다.
theological_decisions:
- issue: 이방인들의 종교적 주장에 대한 평가
  chosen_reading: 그들의 말을 그대로 보고하는 방식으로 옮겨, 그들이 באמת/진정한 예배자라는 판단을 본문에 주입하지 않았습니다.
  alternative_readings:
  - ‘당신들의 하나님을 예배합니다’로 더 강하게 번역
  - ‘당신들의 하나님을 묻고 있습니다’로 한정
  rationale: 본문은 화자들의 주장만 전달하며, 서술자는 그 진실성이나 정통성을 판정하지 않습니다. 따라서 긴장을 해소하지 않고 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 긴장 보존
- issue: 유월절/제사 용어의 현대화와 직역성
  chosen_reading: זֹבְחִים를 ‘희생제를 드리다’로 옮겨 제의 행위를 분명히 하되, 전통 교회어 ‘제사’를 무조건 대체하지는 않았습니다.
  alternative_readings:
  - 제사를 드리다
  - 희생을 바치다
  rationale: 본문의 동사는 단순한 일반 행위가 아니라 제의적 희생을 가리키므로, 현대 한국어 독자가 바로 파악할 수 있는 표현을 선택했습니다.
  doctrine_reference: 제의적 의미 보존
