  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
  footnotes:
  - marker: a
    text: Or 'be warned not to be negligent in carrying this out.'
    reason: lexical_alternative
  - marker: b
    text: The plural 'kings' is retained from the Aramaic rather than simplified to 'the king,' likely referring more broadly to the royal interest or dynasty.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이 일을 게을리하지 않도록 주의하십시오[b][a]. 어찌하여 왕들에게 해가 더 커지게 하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일을 수행하는 데 소홀하지 않도록 경고를 받으십시오.’
    reason: lexical_alternative
  - marker: b
    text: 아람어의 복수 ‘왕들’은 단수 ‘왕’으로 단순화하지 않았습니다. 더 넓게는 왕권이나 왕조의 이해관계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱו֛וֹ
  english_pob_choice: be careful
  chosen_korean: 주의하십시오
  alternatives_korean:
  - 조심하십시오
  - 주의를 기울이십시오
  - 경계하십시오
  lexicon: HALOT
  rationale: 원문의 명령형적 경고를 현대 한국어에서 가장 자연스럽게 살리면서도, 단순한 심리 상태보다 실제적 주의를 요구하는 뜻을 담았습니다.
- source_word: שָׁלוּ לְמֶעְבַּד
  english_pob_choice: not to neglect doing
  chosen_korean: 게을리하지 않도록
  alternatives_korean:
  - 소홀히 하지 않도록
  - 행하는 일을 빠뜨리지 않도록
  - 이행하는 데 태만하지 않도록
  lexicon: HALOT
  rationale: 아람어의 ‘태만/소홀’ 뉘앙스를 살려, 명령을 중단하거나 빠뜨리는 것을 경계하는 뜻으로 옮겼습니다.
- source_word: עַל דְּנָה
  english_pob_choice: this
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 문제
  - 이것을
  lexicon: HALOT
  rationale: 직전의 왕령을 가리키는 지시어이므로, 한국어에서는 문맥을 드러내는 ‘이 일’이 가장 분명합니다.
- source_word: מַלְכִין
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 왕
  - 왕실
  - 통치자들
  lexicon: HALOT
  rationale: 아람어 복수를 그대로 살려 단수로 완화하지 않았습니다. 본문이 더 넓은 왕권/왕조의 이해관계를 염두에 둔 것으로 보이므로 ‘왕들’을 유지했습니다.
theological_decisions:
- issue: 수사 의문문의 기능
  chosen_reading: ‘어찌하여 … 하겠습니까?’로 옮겨, 단순 정보 요청이 아니라 행정적·경고적 수사 의문으로 읽히게 했습니다.
  alternative_readings:
  - ‘왜 … 하겠습니까?’
  - ‘무슨 이유로 … 하겠습니까?’
  rationale: 본문의 질문은 반대 근거를 제시하며 순종을 촉구하는 수사 질문이므로, 한국어에서도 그 압박감을 보존해야 합니다.
  doctrine_reference: 본문의 의미론적 화행(수사 의문) 보존
- issue: 복수 ‘왕들’ 유지
  chosen_reading: ‘왕들’로 유지하여 아람어 복수를 단수로 평탄화하지 않았습니다.
  alternative_readings:
  - ‘왕’
  - ‘그 왕’
  rationale: 영어 POB의 주석처럼 복수는 왕조/제국의 더 넓은 이해관계를 가리킬 수 있으므로, 본문 차원의 긴장을 보존하는 것이 바람직합니다.
  doctrine_reference: 역사-문맥적 본문 읽기
