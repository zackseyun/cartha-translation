translation:
  language: ko
  text: 또한 이 일을 하는 데 소홀하지 않도록 주의하십시오[a]. 어찌하여 왕들에게 해가 더 커지게 하겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
