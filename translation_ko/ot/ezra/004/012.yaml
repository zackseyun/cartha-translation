  source_fidelity: 아람어의 공문 서두, 유다인들의 이동, 예루살렘 도착, 적대적인 도시 규정, 그리고 건축 작업의 세 항목을 대체로 반영합니다. 다만 왕을 가리키는 2인칭을 현대 한국어에서 ‘당신’으로 옮긴 것은 부적절하며, 난해한 기초 관련 어구의 주석 표지도 해당 어구에 붙여야 합니다.
  naturalness: ‘알리옵나이다’, ‘왔나이다’는 현대 표준어 합쇼체의 요청에 맞지 않는 고어적 문체입니다. ‘왕께 알립니다/왔습니다’가 현대의 격식 있는 공문·보고체로 자연스럽습니다. 또한 건축 공정에는 ‘성벽을 완성하다’가 ‘성벽을 마감하다’보다 자연스럽습니다.
  terminology: יְהוּדָיֵא는 문맥상 ‘유다 사람들’로 옮기고, ‘유대인들’이라는 가능한 넓은 번역을 주석으로 제시하는 것이 자연스럽고 원문의 범위를 보존합니다. 적대자의 평가인 ‘반역적이고 악한’은 그 평가를 그대로 전달합니다.
  issues:
