  lexicon: HALOT
  rationale: 아람어 공문 서두의 통보 공식이라, 현대 한국어에서는 간결하고 격식 있는 보고체로 옮기되 왕에게 올리는 형식성을 살렸습니다.
- source_word: יְהוּדָיֵא
