    issue: ‘당신에게서’
    rationale: 현대 한국어에서 ‘당신’은 왕에게 올리는 공식 보고에 적합하지 않고, 친족·부부 간 호칭 또는 대립적 호칭으로도 들릴 수 있습니다. 원문의 2인칭 지시는 ‘왕께서 계신 곳에서’로 자연스럽게 풀어야 합니다.
