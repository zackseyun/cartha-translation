revisions:
- from: 왕께 알리옵나이다. 당신에게서 우리에게 올라온 유다인들이 예루살렘에 왔나이다[a]. 그들은 반역하고 악한 그 도시를 다시 건축하며[b] 성벽을 마감하고 기초를 보수하고 있나이다.
  to: 왕께 알립니다. 왕께서 계신 곳에서 우리에게로 올라온 유다 사람들[a]이 예루살렘에 왔습니다. 그들은 그 반역적이고 악한 도시를 재건하고, 성벽을 완성하며, 기초를 보수하고 있습니다[b].
  rationale: 현대 합쇼체로 문체를 정비하고, 왕에게 쓰는 공문에서 부적절한 ‘당신’을 제거했습니다. 원문의 이동 방향과 보고자의 관점을 ‘왕께서 계신 곳에서 우리에게로’로 보존했습니다. ‘유다 사람들’은 지역·집단 지시의 폭을 살리고, 대안인 ‘유대인들’은 각주에 남겼습니다. 난해한 기초 관련 표현의 번역은 본문의 복원 문맥 및 POB 판단에 따라 유지하되, 해당 위치에 각주를 붙여 불확실성을 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:54Z'
