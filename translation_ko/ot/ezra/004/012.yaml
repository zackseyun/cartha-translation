source:
  edition: WLC
  text: יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֣י יְהוּדָיֵ֗/א דִּ֤י סְלִ֨קוּ֙ מִן לְוָתָ֔/ךְ עֲלֶ֥י/נָא אֲת֖וֹ לִ/ירוּשְׁלֶ֑ם קִרְיְתָ֨/א מָֽרָדְתָּ֤/א ו/באישת/א בָּנַ֔יִן ו/שורי אשכללו וְ/אֻשַּׁיָּ֖/א יַחִֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Aramaic term can denote the people of Judah/Judea as well as the Jews more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or “laying/setting the foundations.” The Aramaic expression is somewhat difficult and may refer either to repairing existing foundations or setting them in place.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕께 알리옵나이다. 당신에게서 우리에게 올라온 유다인들이 예루살렘에 왔나이다[a]. 그들은 반역하고 악한 그 도시를 다시 건축하며[b] 성벽을 마감하고 기초를 보수하고 있나이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들.” 아람어 용어는 유다/유대 사람들을 가리킬 수도 있고, 더 넓게는 유대인을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “기초를 놓고/세우고.” 아람어 표현은 다소 어려우며, 기존 기초를 보수하는 뜻일 수도 있고 기초를 놓는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  english_pob_choice: Let it be known
  chosen_korean: 왕께 알리옵나이다
  alternatives_korean:
  - 알려 드립니다
  - 알리게 하소서
  lexicon: HALOT
  rationale: 아람어 공문 서두의 통보 공식이라, 현대 한국어에서는 간결하고 격식 있는 보고체로 옮기되 왕에게 올리는 형식성을 살렸습니다.
- source_word: יְהוּדָיֵא
  english_pob_choice: the Jews
  chosen_korean: 유다인들
  alternatives_korean:
  - 유대인들
  - 유다 사람들
  lexicon: HALOT
  rationale: 여기서는 민족·지역명으로서의 유다/Judah 계열 집단을 가리킬 수 있으므로, 종교적 뉘앙스가 강한 통상 번역보다 문맥상 더 직접적인 ‘유다인들’을 택했습니다.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  english_pob_choice: that rebellious and wicked city
  chosen_korean: 반역하고 악한 그 도시
  alternatives_korean:
  - 반역적이고 악한 도시
  - 반역하고 사악한 도시
  lexicon: HALOT
  rationale: 원문의 정치적 비난과 도덕적 비난을 함께 살리기 위해 ‘반역하고 악한’으로 직역에 가깝게 옮겼습니다. '사악한'보다 ‘악한’이 공문체에 더 자연스럽습니다.
- source_word: בָּנַיִן
  english_pob_choice: They are rebuilding
  chosen_korean: 다시 건축하며
  alternatives_korean:
  - 건축하며
  - 재건하며
  lexicon: HALOT
  rationale: 예루살렘이 이미 존재하던 도시라는 역사적 문맥을 반영하여 단순한 ‘짓다’보다 ‘다시 건축하다’의 의미를 살렸습니다.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ / וְאֻשַּׁיָּא יַחִיטוּ
  english_pob_choice: finishing the walls and repairing the foundations
  chosen_korean: 성벽을 마감하고 기초를 보수하고
  alternatives_korean:
  - 성벽을 완성하고 기초를 보수하고
  - 성벽을 끝내고 기초를 보수하고
  lexicon: HALOT
  rationale: ‘성벽’은 분명하고, 뒤의 난해한 ‘기초’ 관련 표현은 POB의 판단을 따라 복원 작업의 의미를 살려 ‘보수하다’로 옮겼습니다. ‘마감하다’는 완료의 뜻과 원문의 진행상을 함께 반영합니다.
theological_decisions:
- issue: 유다인들/유대인들 중 어느 집단명으로 옮길지
  chosen_reading: 유다인들
  alternative_readings:
  - 유대인들
  rationale: 본문은 예루살렘 복구를 둘러싼 유다 지역 귀환자들을 가리키는 적대적 보고이므로, 민족명과 지역 정체성을 함께 담는 ‘유다인들’이 문맥상 더 정확합니다.
  doctrine_reference: 역사서 문맥의 집단 지시어 해석
