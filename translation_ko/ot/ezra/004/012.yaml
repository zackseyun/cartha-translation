  - 유다 사람들
  lexicon: HALOT
  rationale: 여기서는 민족·지역명으로서의 유다/Judah 계열 집단을 가리킬 수 있으므로, 종교적 뉘앙스가 강한 통상 번역보다 문맥상 더 직접적인 ‘유다인들’을 택했습니다.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  english_pob_choice: that rebellious and wicked city
  chosen_korean: 반역하고 악한 그 도시
  alternatives_korean:
  - 반역적이고 악한 도시
  - 반역하고 사악한 도시
  lexicon: HALOT
  rationale: 원문의 정치적 비난과 도덕적 비난을 함께 살리기 위해 ‘반역하고 악한’으로 직역에 가깝게 옮겼습니다. '사악한'보다 ‘악한’이 공문체에 더 자연스럽습니다.
- source_word: בָּנַיִן
  english_pob_choice: They are rebuilding
  chosen_korean: 다시 건축하며
  alternatives_korean:
  - 건축하며
  - 재건하며
  lexicon: HALOT
  rationale: 예루살렘이 이미 존재하던 도시라는 역사적 문맥을 반영하여 단순한 ‘짓다’보다 ‘다시 건축하다’의 의미를 살렸습니다.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ / וְאֻשַּׁיָּא יַחִיטוּ
  english_pob_choice: finishing the walls and repairing the foundations
  chosen_korean: 성벽을 마감하고 기초를 보수하고
  alternatives_korean:
  - 성벽을 완성하고 기초를 보수하고
  - 성벽을 끝내고 기초를 보수하고
  lexicon: HALOT
  rationale: ‘성벽’은 분명하고, 뒤의 난해한 ‘기초’ 관련 표현은 POB의 판단을 따라 복원 작업의 의미를 살려 ‘보수하다’로 옮겼습니다. ‘마감하다’는 완료의 뜻과 원문의 진행상을 함께 반영합니다.
