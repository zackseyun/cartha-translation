  source_fidelity: 아람어의 청원적 문맥(‘조사하게 하시고 … 알게 하소서’)은 왕에게 드리는 요청입니다. 초안의 ‘당신들의’는 현대 한국어의 존대 대상과 맞지 않고, ‘조사하게 하시고 … 알게 하소서’도 주체와 높임이 어색하게 혼합되어 있습니다. ‘왕께서 … 조사하게 하시면 … 아시게 될 것입니다’로 청원과 그 결과를 자연스럽게 반영하는 것이 적절합니다. 또한 ‘반역이 일어나 왔고’는 난해한 아람어 구절의 의미 범위 안에 있으나, 영어 POB의 주석에 맞추어 반란·소요가 그 성읍 안에서 조성되었다는 뜻을 주석으로 밝혀야 합니다.
  naturalness: ‘반역하는 도시’보다 ‘반역적인 도시’가 현대 표준 한국어에서 더 자연스럽습니다. ‘왕들과 지방들’은 원문의 복수 행정 단위를 보존하며 자연스럽습니다. ‘황폐해졌습니다’는 결과 피동의 뜻을 간결히 전달합니다.
  terminology: ‘기록책’은 공식 기록 문서를 가리키는 표현으로 유지할 수 있습니다. ‘조상들’은 문자적 ‘아버지들’보다 문맥상 적절하지만, 원문의 문자적 표현과 선대·선임자라는 가능성을 주석에서 보존해야 합니다. ‘반란’은 정치적 반역/소요라는 문맥을 잘 전달하며, 특정 교리적 해석을 부과하지 않습니다.
