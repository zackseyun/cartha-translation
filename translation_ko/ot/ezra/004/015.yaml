source:
  edition: WLC
  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
  footnotes:
  - marker: a
    text: Or 'your ancestors' or 'your predecessors'; literally 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: The Aramaic expression rendered 'rebellion has been stirred up' refers to sedition or revolt being fomented within the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 당신들의 조상들의 기록책을 조사하게 하시고, 기록책에서 찾아 알게 하소서. 이 도시는 반역하는 도시로서 왕들과 지방들에 해를 끼치며, 예로부터 그 안에서 반역이 일어나 왔고[a], 이 때문에 이 도시는 폐허가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신들의 조상들’ 혹은 ‘당신들의 선대들’; 문자적으로는 ‘당신들의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפַר דָּכְרָנַיָּא
  english_pob_choice: book of records
  chosen_korean: 기록책
  alternatives_korean:
  - 기록서
  - 기록의 책
  - 문서 보관록
  lexicon: HALOT
  rationale: 공식 문서 보관소의 이미지를 살리면서도 한국어에서 자연스러운 행정 문체를 유지하기 위해 ‘기록책’으로 옮겼습니다.
- source_word: אֲבָהָתָךְ
  english_pob_choice: your fathers
  chosen_korean: 당신들의 조상들
  alternatives_korean:
  - 당신들의 아버지들
  - 당신들의 선조들
  - 당신들의 이전 통치자들
  lexicon: HALOT
  rationale: 직역하면 ‘당신들의 아버지들’이지만, 문맥상 왕조의 선대들을 가리키므로 한국어에서는 오해를 줄이는 ‘조상들’이 적절합니다.
- source_word: קִרְיָא מָרָדָא
  english_pob_choice: a rebellious city
  chosen_korean: 반역하는 도시
  alternatives_korean:
  - 반역의 도시
  - 반란 도시
  - 반역적인 도시
  lexicon: HALOT
  rationale: 도시의 성격을 규정하는 비난 표현을 자연스럽게 살리기 위해 ‘반역하는 도시’로 번역했습니다.
- source_word: מְהַנְזְקַת
  english_pob_choice: harmful to
  chosen_korean: 해를 끼치며
  alternatives_korean:
  - 손해를 끼치며
  - 유해하며
  - 피해를 주며
  lexicon: HALOT
  rationale: 왕들과 지방들에 대한 실제적 피해를 폭넓게 담는 표현으로 ‘해를 끼치며’를 선택했습니다.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  english_pob_choice: sedition has been made within it
  chosen_korean: 반역이 일어나 왔고
  alternatives_korean:
  - 소요가 일어나 왔고
  - 선동이 이루어져 왔고
  - 반란이 조성되어 왔고
  lexicon: HALOT
  rationale: 아람어의 난해한 관용구를 한국어로 너무 기술적으로 만들지 않으면서도 지속적 내적 반역의 뜻을 보이기 위해 이처럼 옮겼습니다.
- source_word: הָחָרְבַת
  english_pob_choice: was laid waste
  chosen_korean: 폐허가 되었습니다
  alternatives_korean:
  - 황폐해졌습니다
  - 무너졌습니다
  - 황무지가 되었습니다
  lexicon: HALOT
  rationale: 피동의 결과 상태를 자연스럽게 드러내는 한국어로서, 공식적인 문체를 유지하면서도 의미를 분명히 하는 표현입니다.
theological_decisions:
- issue: ‘your fathers’의 지시 대상
  chosen_reading: 선대 왕들과 통치자들을 가리키는 역사적·행정적 표현으로 이해했습니다.
  alternative_readings:
  - 일반적인 조상들로 읽는 해석
  - 문자적으로 아버지로 읽는 해석
  rationale: 문맥이 제국 문서 검증 요청이므로, 혈연적 아버지보다 역사적 선대 통치자들을 가리키는 것으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 역사-문맥 우선 원칙
