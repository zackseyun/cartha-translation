    rationale: 원문은 왕에게 기록을 조사하도록 요청하고 그 결과를 알게 될 것이라고 말합니다. ‘당신들의 … 조사하게 하시고, … 알게 하소서’는 복수 ‘당신들’, 사동, 청유/기원 표현이 혼재하여 현대 합쇼체의 행정 청원문으로 자연스럽지 않습니다.
