revisions:
- from: 우리는 종들입니다[a]. 그러나 우리의 종살이 가운데서도 우리 하나님께서는 우리를 버리지 않으셨고, 바사 왕들 앞에서 우리에게 언약적 신실함을 베푸셔서 우리에게 소생을 주시고, 우리 하나님의 집을 세우게 하시며, 그 무너진 곳들을 다시 세우게 하시고[b], 유다와 예루살렘에 우리에게 담을 주셨습니다.
  to: 우리는 종들이지만, 우리의 종살이 중에도 우리 하나님께서는 우리를 버리지 않으셨습니다. 오히려 바사 왕들 앞에서 우리에게 신실한 사랑을 베푸셔서[a] 우리에게 생기를 주시고, 우리 하나님의 성전을 일으켜 세우시며, 그 폐허를 복구하시고, 유다와 예루살렘에서 우리에게 담을 마련해 주셨습니다.[b]
  rationale: 원문의 문장 구조와 목적 표현을 따라 하나님께서 생명을 주시고 성전을 재건하며 폐허를 복구하고 담을 주시는 분으로 분명히 했습니다. חֶסֶד는 현대적으로 자연스러운 ‘신실한 사랑’으로 옮기되 각주에서 의미 범위를 보존했습니다. 또한 두 각주를 실제 설명 대상인 חֶסֶד와 גָדֵר에 각각 재배치했습니다.
  reviewer_model: gpt-5.6-terra
