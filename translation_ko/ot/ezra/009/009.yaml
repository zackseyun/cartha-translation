  naturalness: ‘언약적 신실함’은 의미는 전달하지만 현대 표준 한국어 본문으로는 다소 추상적이고 비관용적입니다. ‘신실한 사랑’이 חֶסֶד의 충성스럽고 은혜로운 성격을 자연스럽게 살립니다. 또한 ‘유다와 예루살렘에 우리에게’는 어순이 부자연스러워 다듬었습니다.
