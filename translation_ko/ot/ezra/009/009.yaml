  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are slaves[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'steadfast love,' 'kindness,' or 'favor' for 'covenant faithfulness.' The Hebrew חֶסֶד carries the sense of loyal, gracious covenant mercy.
    reason: lexical_alternative
  - marker: b
    text: Or 'a protective enclosure' or 'a hedge.' The image may refer more broadly to security and protection in Judah and Jerusalem, not only to a literal wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 종들입니다[a]. 그러나 우리의 종살이 가운데서도 우리 하나님께서는 우리를 버리지 않으셨고, 바사 왕들 앞에서 우리에게 언약적 신실함을 베푸셔서 우리에게 소생을 주시고, 우리 하나님의 집을 세우게 하시며, 그 무너진 곳들을 다시 세우게 하시고[b], 유다와 예루살렘에 우리에게 담을 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예들’. 여기서는 예속된 신분을 드러내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보호용 울타리’나 ‘울타리’. 이 이미지는 예루살렘과 유다의 안전과 보호를 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 종들입니다
  lexicon: HALOT
  rationale: 히브리어 עֲבָדִים은 예속된 신분을 가리키므로, 여기서는 완곡한 ‘종들’보다도 예속성을 드러내는 표현이 필요합니다. 다만 한국어 본문에서는 문맥의 기도문체에 맞춰 ‘우리는 종들입니다’로 자연스럽게 풀었습니다.
- source_word: וּבְעַבְדֻתֵנוּ
  english_pob_choice: in our slavery
  chosen_korean: 우리의 종살이 가운데서
  alternatives_korean:
  - 우리의 노예 상태 가운데서
  - 우리의 종됨 가운데서
  lexicon: HALOT
  rationale: 앞의 ‘종들’과 어근을 연결하면서도 상태를 나타내는 표현으로 옮겨, 하나님이 버리지 않으신 처지를 강조했습니다.
- source_word: חֶסֶד
  english_pob_choice: extended covenant faithfulness
  chosen_korean: 언약적 신실함
  alternatives_korean:
  - 인애
  - 변함없는 사랑
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·충성적 뉘앙스를 살리기 위해, 단순한 ‘사랑’이나 ‘친절’보다 ‘언약적 신실함’이 원문 의미를 더 정확히 드러냅니다.
- source_word: חָרְבֹתָיו
  english_pob_choice: its ruins
  chosen_korean: 그 무너진 곳들
  alternatives_korean:
  - 그 황폐한 것들
  - 그 폐허들
  - 그 파괴된 자리들
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 폐허들’이지만, 한국어에서는 ‘무너진 곳들’이 템플 재건의 이미지를 더 자연스럽게 전달합니다. 대명사 ‘그’는 앞의 ‘하나님의 집’을 가리킵니다.
- source_word: גָדֵר
  english_pob_choice: a wall
  chosen_korean: 담
  alternatives_korean:
  - 성벽
  - 울타리
  - 보호 울타리
  lexicon: HALOT
  rationale: 여기서는 물리적 성벽일 수도 있고 보호의 장벽일 수도 있으므로, 너무 군사적인 ‘성벽’보다 넓은 보호 이미지를 담는 ‘담’이 적절합니다.
theological_decisions:
- issue: חֶסֶד의 번역
  chosen_reading: 언약적 신실함
  alternative_readings:
  - 인애
  - 변함없는 사랑
  - 자비
  rationale: 본문은 포로기 이후 공동체가 바사 왕들 앞에서 경험한 하나님의 충성스러운 긍휼을 강조합니다. ‘언약적 신실함’은 그 신학적 무게를 유지하면서도 한국어로 이해 가능합니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: גָדֵר의 이미지
  chosen_reading: 담
  alternative_readings:
  - 성벽
  - 보호 울타리
  - 울타리
  rationale: ‘담’은 단순 건축물만이 아니라 보호와 안전의 의미를 함께 살릴 수 있습니다. 본문이 말하는 하나님의 보호를 너무 구체적인 도시 성벽으로 제한하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
