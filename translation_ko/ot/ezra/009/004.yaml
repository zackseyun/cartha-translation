source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
  footnotes:
  - marker: a
    text: Or 'because of the trespass of the exile community.'
    reason: lexical_alternative
  - marker: b
    text: '''Evening offering'' translates minḥah, often specifically a grain offering, here functioning as the stated time of day for the regular temple offering.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 이스라엘의 하나님의 말씀들로 인해 떨던 모든 이가 포로 공동체의 범죄 때문에 내게 모여들었고, 나는 저녁 제사 때까지 놀란 채로 앉아 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로 공동체’는 히브리어 הַגּוֹלָה가 가리키는 귀환 공동체를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저녁 제사’는 민하(minḥah)가 가리키는 정규 저녁 제의 시간을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  english_pob_choice: gathered
  chosen_korean: 모여들었고
  alternatives_korean:
  - 모였습니다
  - 모여 있었습니다
  lexicon: HALOT
  rationale: נִפעל형의 집합 동작을 자연스럽게 살리면서, 에스라에게 사람들이 한데 모이는 장면을 간결하게 드러냅니다.
- source_word: כֹּל חָרֵד
  english_pob_choice: everyone who trembled
  chosen_korean: 떨던 모든 이
  alternatives_korean:
  - 떨었던 모든 사람
  - 두려워하던 모두
  lexicon: HALOT
  rationale: ‘떨다’는 חרד의 경외적 두려움을 현대 한국어로 자연스럽게 살리며, 집합적 표현도 유지합니다.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: at the words of the God of Israel
  chosen_korean: 이스라엘의 하나님의 말씀들로 인해
  alternatives_korean:
  - 이스라엘의 하나님의 말씀 앞에서
  - 이스라엘의 하나님의 말씀 때문에
  lexicon: HALOT
  rationale: ב는 여기서 두려움의 원인/대상을 나타내므로, ‘말씀들로 인해’로 옮겨 מקור의 복수형과 인과 관계를 함께 살렸습니다.
- source_word: עַל מַעַל הַגּוֹלָה
  english_pob_choice: because of the unfaithfulness of the exiles
  chosen_korean: 포로 공동체의 범죄 때문에
  alternatives_korean:
  - 포로들의 불성실 때문에
  - 포로 공동체의 불충실 때문에
  lexicon: HALOT
  rationale: מַעַל의 핵심인 언약적 위반을 ‘범죄’로 옮기되, הַגּוֹלָה는 단순한 상태가 아니라 공동체를 가리키므로 ‘포로 공동체’로 표현했습니다.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  english_pob_choice: sat appalled
  chosen_korean: 놀란 채로 앉아 있었습니다
  alternatives_korean:
  - 망연자실한 채로 앉아 있었습니다
  - 경악한 채로 앉아 있었습니다
  lexicon: HALOT
  rationale: משך되는 앉은 자세와 충격 상태를 함께 나타내기 위해, ‘앉아 있었습니다’에 상태 표현을 붙였습니다.
- source_word: עַד לְמִנְחַת הָעָרֶב
  english_pob_choice: until the evening offering
  chosen_korean: 저녁 제사 때까지
  alternatives_korean:
  - 저녁 곡식 제사 때까지
  - 저녁 예물 때까지
  lexicon: HALOT
  rationale: 민하가 예전 제의 시간표현으로 쓰이므로, 시간표로 기능하는 점을 살려 ‘저녁 제사 때까지’로 옮겼습니다.
theological_decisions:
- issue: מַעַל의 죄 성격
  chosen_reading: 공동체의 언약적 범죄를 가리키는 표현으로 보아 ‘범죄’로 옮겼습니다.
  alternative_readings:
  - 불성실
  - 배신
  - 허물
  rationale: 본문은 단순한 실수보다 하나님과의 관계를 깨뜨리는 위반을 말하므로, 한국어로는 도덕적·언약적 무게가 드러나는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 6
