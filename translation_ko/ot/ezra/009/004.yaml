    issue: ‘포로 공동체’
    rationale: הַגּוֹלָה는 포로에서 돌아온 사람들의 공동체를 가리키며, ‘포로 공동체’는 이들이 여전히 포로 상태에 있는 듯 들릴 수 있습니다.
  - severity: medium
    issue: ‘놀란 채로’
    rationale: מְשׁוֹמֵם은 일시적 놀람보다 황망함·참담함·경악으로 망연해진 상태를 뜻합니다.
  - severity: medium
    issue: ‘저녁 제사’
    rationale: מִנְחָה는 통상 곡식 예물이며, ‘제사’는 원어가 명시하지 않은 희생제사 의미를 넓게 암시할 수 있습니다.
  - severity: low
    issue: ‘말씀들’
    rationale: 히브리어의 복수형을 한국어에서 그대로 복수화하면 어색합니다. ‘하나님의 말씀’이 자연스럽고 의미도 보존합니다.
