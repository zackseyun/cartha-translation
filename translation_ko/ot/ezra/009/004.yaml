  to: 그때 이스라엘의 하나님의 말씀 때문에 떨던 모든 사람이 귀환 공동체의 불성실 때문에 내게 모여들었고, 나는 저녁 예물 때까지 망연자실한 채 앉아 있었습니다.[a][b]
