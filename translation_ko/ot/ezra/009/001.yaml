  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: Now when these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
  footnotes:
  - marker: a
    text: Or 'in accordance with their detestable practices.' The Hebrew term is strong and often used for religiously offensive or idolatrous practices.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 끝나자, 관리들이 내게 나아와 말하였습니다. 「이스라엘 백성과 제사장들과 레위 사람들은 그 땅의 백성들과, 곧 가나안 사람들, 헷 사람들, 브리스 사람들, 여부스 사람들, 암몬 사람들, 모압 사람들, 이집트 사람들, 아모리 사람들과 같이 스스로를 분리하지 않았습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 가증한 행실에 따라’. 히브리어 용어는 강한 표현으로, 종종 종교적으로 거슬리거나 우상숭배적인 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  english_pob_choice: Now when these things were finished
  chosen_korean: 이 일들이 끝나자
  alternatives_korean:
  - 이 일들이 마치자
  - 이 일들이 완료되었을 때
  lexicon: HALOT
  rationale: 시간 절을 자연스러운 한국어 서술로 옮기되, 사건의 완료 뒤에 이어지는 다음 행동이라는 순서를 보존했습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 고관들
  lexicon: HALOT
  rationale: 페르시아 시대의 행정적 배경에서 שׂרים는 왕족적 뉘앙스보다 공적 직분을 가리키므로, ‘관리들’이 가장 무난하고 오해가 적습니다.
- source_word: לֹא נִבְדְּלוּ
  english_pob_choice: have not separated themselves
  chosen_korean: 스스로를 분리하지 않았습니다
  alternatives_korean:
  - 스스로 구별하지 않았습니다
  - 분리되지 않았습니다
  lexicon: HALOT
  rationale: נבדל의 반사적 의미를 살리면서도 공동체적·윤리적 분리를 드러내기 위해 능동적 반사 표현을 택했습니다.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  english_pob_choice: from the peoples of the lands
  chosen_korean: 그 땅의 백성들과
  alternatives_korean:
  - 그 땅들의 백성들로부터
  - 여러 땅의 백성들로부터
  lexicon: HALOT
  rationale: 히브리어 복수형의 감각은 유지하되, 한국어에서는 집합적 표현 ‘그 땅의 백성들’이 자연스러워 문맥을 해치지 않는 범위에서 옮겼습니다.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  english_pob_choice: according to their abominations
  chosen_korean: 같이
  alternatives_korean:
  - 그들의 가증한 일들에 따라
  - 그들의 가증함에 따라
  lexicon: HALOT
  rationale: 본절의 핵심 비교 표지는 ‘כ’이므로, 앞의 민족 목록과 연결되는 비교구조를 한국어 ‘같이’로 간결하게 재현했습니다. 이 표현은 본문이 말하는 동화·동일시의 비난을 직접 드러냅니다.
theological_decisions:
- issue: תועבות의 강한 도덕·예배적 비난을 한국어에서 어떻게 유지할 것인가
  chosen_reading: 직역적 비교표지와 함께 민족 목록을 붙여, 그들의 관행을 본받았다는 강한 비난을 문맥 속에서 유지했습니다.
  alternative_readings:
  - 그들의 가증한 행위들에 따라
  - 그들의 혐오스러운 풍속을 따라
  rationale: 영어 POB의 ‘according to their abominations’는 단순한 관습 차이가 아니라 언약적 부정을 가리키므로, 한국어도 완화하지 않고 강한 비난의 힘을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 이스라엘 백성, 제사장들, 레위 사람들을 한꺼번에 책임 주체로 제시하는가
  chosen_reading: 세 집단을 모두 같은 진술 아래 묶어 번역했습니다.
  alternative_readings:
  - 평민이 주된 대상이고 제사장들과 레위 사람들은 부가적으로 언급됨
  - 제사장들과 레위 사람들만 특별히 지적됨
  rationale: 히브리어 문장은 세 집단을 병렬로 엮어 동일한 소식을 전하므로, 한국어에서도 책임 범위를 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
