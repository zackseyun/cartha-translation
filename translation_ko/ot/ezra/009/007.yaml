  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
  footnotes:
  - marker: a
    text: Or 'to open shame' or 'to humiliation'; literally, 'to shame of face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들의 날부터 오늘에 이르기까지 우리는 큰 죄책 아래에 있었습니다. 우리의 죄악 때문에 우리와 우리의 왕들과 우리의 제사장들이 나라들의 왕들의 손에 넘겨져 칼과 포로됨과 탈취와 얼굴의 부끄러움에 이르렀는데, 오늘까지도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘얼굴의 부끄러움’입니다. 공적 수치나 굴욕의 뜻도 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  english_pob_choice: From the days of our fathers
  chosen_korean: 우리 조상들의 날부터
  alternatives_korean:
  - 우리 조상들의 때부터
  - 우리 조상들의 시절부터
  lexicon: HALOT
  rationale: מִן + יָמִים은 시작점을 나타내는 시간 표현이므로, 한국어에서는 자연스럽고 직역성이 있는 ‘~부터’로 살렸습니다.
- source_word: בְּאַשְׁמָה גְדֹלָה
  english_pob_choice: we have been in great guilt
  chosen_korean: 큰 죄책 아래에 있었습니다
  alternatives_korean:
  - 큰 죄책 가운데 있었습니다
  - 큰 죄악 가운데 있었습니다
  lexicon: HALOT
  rationale: אַשְׁמָה는 단순한 감정적 수치심보다 법적·언약적 ‘죄책’에 가깝기 때문에, ‘죄책’으로 번역해 책임과 상태를 함께 드러냈습니다.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  english_pob_choice: into the hand of the kings of the lands
  chosen_korean: 나라들의 왕들의 손에 넘겨져
  alternatives_korean:
  - 땅들의 왕들의 손에 넘겨져
  - 나라의 왕들의 손에 넘겨져
  lexicon: HALOT
  rationale: ‘손에’는 지배·권력의 관용구이므로 유지했고, אֲרָצוֹת는 주변 ‘나라들’로 옮겨 자연스러운 한국어로 처리했습니다.
- source_word: וּבְבֹשֶׁת פָּנִים
  english_pob_choice: to shame of face
  chosen_korean: 얼굴의 부끄러움에 이르렀는데
  alternatives_korean:
  - 얼굴의 수치에 이르렀는데
  - 얼굴을 붉힐 부끄러움에 이르렀는데
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴의 부끄러움’이므로 그 이미지를 살리되, 한국어 문맥에서는 결과 상태를 나타내는 ‘~에 이르렀는데’로 풀었습니다.
theological_decisions:
- issue: 공동체적 고백의 범위
  chosen_reading: ‘우리와 우리의 왕들과 우리의 제사장들’을 그대로 살려 공동체와 지도층이 함께 심판 아래 있었음을 드러냈습니다.
  alternative_readings:
  - 주어를 간단히 줄여 공동체적 강조를 약화시키는 방식
  - 지도층 언급을 일반화하는 방식
  rationale: 히브리어는 공동체 전체와 그 대표자들을 함께 묶어 고백하므로, 그 집단적 책임을 희석하지 않도록 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §1
- issue: אַשְׁמָה와 עָוֹן의 구별
  chosen_reading: ‘죄책’과 ‘죄악’으로 나누어 번역해 고백과 징계의 결을 구별했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일하는 방식
  - 둘 다 ‘허물’로 완화하는 방식
  rationale: 서로 다른 어휘를 같은 낱말로 합치면 본문의 누적된 죄 고백의 뉘앙스가 약해지므로, 한국어에서도 구별을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
