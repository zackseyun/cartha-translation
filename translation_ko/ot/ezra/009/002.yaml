revisions:
- from: 그들이 자기 딸들 가운데서 일부를 자기들과 자기 아들들을 위해 데려왔고, 거룩한 씨가 그 땅들의 백성들과 뒤섞였으며, 이 불성실함에서 관리들과 총독들의 손이 으뜸이었습니다.
  to: 그들이 여러 땅의 백성들의 딸들 가운데 일부를 자기들과 자기 아들들의 아내로 맞아들였고, 거룩한 자손이 여러 땅의 백성들과 섞였습니다. 관리들과 부관리들이 이 불성실한 일에 앞장섰습니다.
  rationale: 소유 관계와 혼인 문맥을 분명히 하고, ‘거룩한 자손’으로 원문의 계보적·언약적 표현을 자연스러운 한국어로 유지했습니다. 지도자들의 ‘손’이라는 히브리어 관용구는 현대 한국어에서 이해 가능한 ‘앞장섰습니다’로 옮겨, 이들이 단순히 시간상 먼저가 아니라 주도적 책임을 졌다는 רִאשׁוֹנָה의 의미를 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:18Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기 딸들’은 히브리어 소유대명사가 가리키는 ‘여러 땅의 백성들’이 아니라 주절의 행위자들을 가리키는 것으로 읽힐 수 있습니다. 또한 נָשְׂאוּ의 혼인 문맥이 한국어 ‘데려왔고’에는 충분히 드러나지 않습니다. הַסְּגָנִים는 ‘총독들’보다 ‘부관리들/대리 관리들’이 적절합니다.
  naturalness: ‘관리들과 총독들의 손이 으뜸이었습니다’는 히브리어 관용구를 지나치게 직역하여 현대 표준 한국어로 매우 부자연스럽습니다. 행위 주체와 주도적 책임이라는 관용적 의미를 자연스럽게 옮기는 것이 안전합니다. ‘거룩한 자손’은 ‘거룩한 씨’보다 한국어 성경 문체와 현대 독해에서 자연스럽고, 계보적 표현도 보존합니다.
  terminology: ‘거룩한 자손’은 זֶרַע הַקֹּדֶשׁ의 계보적·언약적 언어를 보존합니다. ‘관리들과 부관리들’은 שָׂרִים וּסְגָנִים의 행정적 지도자 집단을 과도한 관직 등급화 없이 반영합니다. מַעַל은 ‘불성실한 일’로 옮겨 신의의 위반이라는 의미를 유지합니다.
  issues:
  - severity: medium
    issue: ‘자기 딸들’의 지시 대상이 불분명하고 문맥상 잘못 읽힐 수 있음
    rationale: מִבְּנֹתֵיהֶם의 ‘그들의’는 ‘여러 땅의 백성들’을 받습니다. 한국어 재귀 소유 표현 ‘자기 딸들’은 행위자인 이스라엘 쪽 사람들이 자기 딸들을 데려온 것처럼 이해될 수 있습니다.
  - severity: medium
    issue: ‘데려왔고’가 혼인 행위를 충분히 표시하지 못함
    rationale: נָשְׂאוּ는 이 문맥에서 여성을 아내로 맞는다는 뜻입니다. ‘아내로 맞아들였고’는 원문의 혼인 의미를 명확히 하면서도 과도한 해석을 더하지 않습니다.
  - severity: medium
    issue: הַסְּגָנִים를 ‘총독들’로 번역함
    rationale: סְגָנִים는 통상 고위 관리의 보좌자·대리자·부관리들을 가리키며, ‘총독’은 본문이 요구하지 않는 독립적인 지방 통치자 직함을 부여합니다.
  - severity: medium
    issue: ‘손이 으뜸이었습니다’가 한국어 관용으로 자연스럽지 않음
    rationale: וְיַד…הָיְתָה…רִאשׁוֹנָה는 지도자들이 이 배신 행위에 앞장서고 주된 책임이 있었다는 뜻입니다. 한국어에서는 관용구를 그대로 보존하기보다 의미를 명료하게 번역하는 편이 충실합니다.
  revised_text: 그들이 여러 땅의 백성들의 딸들 가운데 일부를 자기들과 자기 아들들의 아내로 맞아들였고, 거룩한 자손이 여러 땅의 백성들과 섞였습니다. 관리들과 부관리들이 이 불성실한 일에 앞장섰습니다.
