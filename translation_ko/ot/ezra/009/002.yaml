source:
  edition: WLC
  text: כִּֽי נָשְׂא֣וּ מִ/בְּנֹֽתֵי/הֶ֗ם לָ/הֶם֙ וְ/לִ/בְנֵי/הֶ֔ם וְ/הִתְעָֽרְבוּ֙ זֶ֣רַע הַ/קֹּ֔דֶשׁ בְּ/עַמֵּ֖י הָ/אֲרָצ֑וֹת וְ/יַ֧ד הַ/שָּׂרִ֣ים וְ/הַ/סְּגָנִ֗ים הָֽיְתָ֛ה בַּ/מַּ֥עַל הַ/זֶּ֖ה רִאשׁוֹנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
  footnotes:
  - marker: a
    text: Or 'have married some of their daughters.' The Hebrew says literally 'have taken from their daughters.'
    reason: lexical_alternative
  - marker: b
    text: '''The holy seed'' may also be rendered ''the holy offspring.'' The Hebrew preserves covenantal lineage language.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the hand of the officials and the deputies was first in this faithlessness,' an idiom meaning they were chiefly responsible.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 여러 땅의 백성들의 딸들 가운데 일부를 자기들과 자기 아들들의 아내로 맞아들였고, 거룩한 자손이 여러 땅의 백성들과 섞였습니다. 관리들과 부관리들이 이 불성실한 일에 앞장섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם לָהֶם וְלִבְנֵיהֶם
  english_pob_choice: have taken some of their daughters for themselves and for their sons
  chosen_korean: 자기 딸들 가운데서 일부를 자기들과 자기 아들들을 위해 데려왔고
  alternatives_korean:
  - 자기 딸들 가운데서 일부를 자기들과 자기 아들들을 위해 취했고
  - 그들의 딸들 가운데서 일부를 자기들과 자기 아들들을 위해 데려갔고
  lexicon: HALOT
  rationale: נָשְׂאוּ는 문자적으로 ‘들다/취하다’이지만 여기서는 결혼 맥락이므로 ‘데려오다/취하다’ 계열로 옮기는 것이 원문과 자연성을 함께 살립니다. מִן의 부분적 용법은 ‘가운데서 일부’로 드러냈습니다.
- source_word: זֶרַע הַקֹּדֶשׁ
  english_pob_choice: the holy seed
  chosen_korean: 거룩한 씨
  alternatives_korean:
  - 거룩한 후손
  - 거룩한 자손
  lexicon: HALOT
  rationale: ‘씨’를 유지해 언약적·계보적 표현을 보존했습니다. 이를 단순한 생물학적 표현이나 민족주의적 용어로 바꾸지 않도록 주의했습니다.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  english_pob_choice: with the peoples of the lands
  chosen_korean: 그 땅들의 백성들과
  alternatives_korean:
  - 땅들의 백성들과
  - 그 나라들의 백성들과
  lexicon: HALOT
  rationale: 복수 ‘땅들’을 살려 포로기 이후의 지역적 범위를 반영했고, ‘백성들’로 현대 한국어에서 자연스럽게 풀었습니다.
- source_word: וְיַד הַשָּׂרִים וְהַסְּגָנִים הָיְתָה בַּמַּעַל הַזֶּה רִאשׁוֹנָה
  english_pob_choice: And the hand of the officials and the deputies has been foremost in this unfaithfulness
  chosen_korean: 이 불성실함에서 관리들과 총독들의 손이 으뜸이었습니다
  alternatives_korean:
  - 이 불성실함에서 관리들과 총독들의 손이 먼저였습니다
  - 관리들과 총독들의 손이 이 불성실함에 가장 앞섰습니다
  lexicon: HALOT
  rationale: ‘손’은 행위 주체를 가리키는 관용구이므로 유지했고, רִאשׁוֹנָה는 ‘으뜸이었습니다’로 책임이 선도적이었음을 드러냈습니다. הַשָּׂרִים וְהַסְּגָנִים은 행정 책임자들을 가리키므로 ‘관리들과 총독들’로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 씨’의 의미를 어떻게 유지할지
  chosen_reading: ‘거룩한 씨’라는 언어를 그대로 살려 언약적 구별성을 드러내고, 혈통주의나 인종주의로 확장하지 않도록 했습니다.
  alternative_readings:
  - ‘거룩한 후손’으로 완화하기
  - 민족적 순수성 개념으로 해석하기
  rationale: 본문은 포로기 공동체의 언약 정체성을 말하므로, 표현을 약화시키지 않되 후대의 왜곡된 범주를 덧씌우지 않는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 지도자들의 책임을 나타내는 관용구 처리
  chosen_reading: ‘손이 으뜸이었습니다’로 옮겨 지도자들이 이 불성실함에 주도적 책임을 졌다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘가장 먼저였습니다’
  - ‘주도했습니다’
  rationale: 히브리어의 ‘손’과 ‘처음/으뜸’은 단순한 순서가 아니라 책임의 우선성을 드러냅니다. 관용구를 유지하면서 의미를 분명히 하는 편이 본문에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
