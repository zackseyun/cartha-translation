base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
  footnotes:
  - marker: a
    text: Or, more specifically, 'At the evening grain offering.' The Hebrew term often refers to a grain offering, though here it can stand for the evening sacrificial time more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁 제사 때에 나는 금식에서 일어났습니다[a]. 내 옷과 겉옷이 찢어진 채로, 무릎을 꿇고 손을 야훼 내 하나님께 펼쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금식’으로 옮겼지만, 히브리어 מִנְחַת הָעֶרֶב은 문맥에 따라 ‘저녁 곡식제사’ 또는 저녁 제사의 정해진 시각을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  english_pob_choice: At the evening offering
  chosen_korean: 저녁 제사 때에
  alternatives_korean:
  - 저녁 곡식제사 때에
  - 저녁 제물 때에
  lexicon: HALOT
  rationale: מִנְחָה는 문맥에 따라 곡식제사이기도 하지만, 여기서는 성전 예배의 정해진 저녁 제사 시점을 가리키므로 한국어로는 자연스러운 ‘저녁 제사 때에’가 원문의 예배 시각을 잘 살립니다.
- source_word: מִתַּעֲנִיתִי
  english_pob_choice: from my fasting
  chosen_korean: 금식에서
  alternatives_korean:
  - 내 금식에서
  - 내 스스로를 괴롭게 한 데서
  - 내 금식 상태에서
  lexicon: HALOT
  rationale: 문맥상 단순한 금식 행위를 가리키므로 ‘금식에서’로 옮기되, 동작의 시작점인 ‘일어났습니다’와 자연스럽게 연결되도록 했습니다.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  english_pob_choice: with my garment and my robe torn
  chosen_korean: 내 옷과 겉옷이 찢어진 채로
  alternatives_korean:
  - 내 옷과 내 겉옷을 찢은 채로
  - 옷과 겉옷이 찢어진 채로
  - 내 의복과 망토가 찢어진 채로
  lexicon: HALOT
  rationale: 두 명사를 구별해 ‘옷’과 ‘겉옷’으로 옮겼고, 수식어구는 동시상태를 드러내는 ‘-된 채로’로 처리해 슬픔의 표지를 보존했습니다.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  english_pob_choice: and I fell on my knees
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎에 엎드리고
  - 무릎 위에 꿇고
  - 엎드려 무릎을 꿇고
  lexicon: HALOT
  rationale: כּרע의 핵심은 무릎을 굽혀 기도 자세를 취하는 것이므로, 한국어 관용에 맞는 ‘무릎을 꿇고’가 동작과 경건한 태도를 함께 전달합니다.
- source_word: וָאֶפְרְשָׂה כַפַּי
  english_pob_choice: and spread out my hands
  chosen_korean: 손을 … 펼쳤습니다
  alternatives_korean:
  - 손바닥을 펼쳤습니다
  - 두 손을 펴 들었습니다
  - 손을 내밀었습니다
  lexicon: HALOT
  rationale: כַּף의 손바닥을 포함하되 기도 동작을 자연스럽게 살리기 위해 ‘손을 펼쳤습니다’로 옮겼습니다.
- source_word: אֶל יְהוָה אֱלֹהָי
  english_pob_choice: to Yahweh my God
  chosen_korean: 야훼 내 하나님께
  alternatives_korean:
  - 야훼 나의 하나님께
  - 주님 내 하나님께
  - 여호와 내 하나님께
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 직역했고, אֶל은 기도 방향을 나타내는 ‘-께’로 자연스럽게 처리했습니다.
