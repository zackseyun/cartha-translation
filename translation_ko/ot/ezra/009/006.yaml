base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
  footnotes:
  - marker: a
    text: Or 'over our heads.' The Hebrew idiom is singular 'head' with a plural possessive sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제가 말하였습니다. “나의 하나님, 제가 부끄럽고 수치스럽습니다. 나의 하나님, 제 얼굴을 주님께 들지 못하겠습니다. 우리의 죄악이 머리 위까지 많아졌고, 우리의 죄책이 하늘까지 커졌기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리 위까지’는 히브리어 관용구로, 직역하면 ‘머리 위’(단수)지만 복수 소유의 집합적 의미를 가질 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בֹּשְׁתִּי
  english_pob_choice: I am ashamed
  chosen_korean: 부끄럽습니다
  alternatives_korean:
  - 수치스럽습니다
  - 부끄러움을 느낍니다
  lexicon: HALOT
  rationale: 개인의 심한 수치감을 자연스러운 현대 한국어로 살리면서, 다음 표현과 함께 겹쳐지는 disgrace의 강도를 유지합니다.
- source_word: וְנִכְלַמְתִּי
  english_pob_choice: and humiliated
  chosen_korean: 수치스럽습니다
  alternatives_korean:
  - 굴욕을 당했습니다
  - 창피합니다
  lexicon: HALOT
  rationale: 앞의 בֹּשְׁתִּי와 함께 감정의 중첩을 이루므로, ‘부끄럽고 수치스럽다’로 두 단계의 수치를 병렬적으로 드러냈습니다.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  english_pob_choice: to lift up my face to you
  chosen_korean: 제 얼굴을 주님께 들지 못하겠습니다
  alternatives_korean:
  - 주님께 제 얼굴을 들지 못하겠습니다
  - 주님 앞에 고개를 들지 못하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴/face’ 이미지를 유지하되, 한국어에서는 ‘고개를 들다’ 관용도 가능하지만 원문 단어를 더 직접적으로 반영하기 위해 ‘얼굴’로 옮겼습니다.
- source_word: עֲוֺנֹתֵינוּ
  english_pob_choice: our iniquities
  chosen_korean: 우리의 죄악
  alternatives_korean:
  - 우리의 불의
  - 우리의 죄들
  lexicon: HALOT
  rationale: 단순한 일반적 ‘죄’보다 무게감 있는 도덕적 일탈을 나타내므로, POB의 ‘iniquities’에 맞춰 ‘죄악’으로 옮겼습니다.
- source_word: לְמַעְלָה רֹאשׁ
  english_pob_choice: above our heads
  chosen_korean: 머리 위까지
  alternatives_korean:
  - 머리 위로
  - 우리 머리 위까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 상승 이미지를 살리면서, 복수 소유격의 의미를 한국어 문맥에서 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אַשְׁמָתֵנוּ
  english_pob_choice: our guilt
  chosen_korean: 우리의 죄책
  alternatives_korean:
  - 우리의 죄책감
  - 우리의 책임
  lexicon: HALOT
  rationale: 이 문맥에서는 제사적 ‘속건제’가 아니라 죄로 인한 책임성과 유죄 상태를 가리키므로, ‘죄책’이 가장 직접적입니다.
theological_decisions:
- issue: 하나님께 감히 얼굴을 들지 못하는 고백의 수치 표현
  chosen_reading: ‘제 얼굴을 주님께 들지 못하겠습니다’로, 단순한 내적 감정이 아니라 하나님 앞에서의 실재적 부끄러움과 불능을 드러냈습니다.
  alternative_readings:
  - ‘주님께 고개를 들지 못하겠습니다’
  - ‘주님 앞에 얼굴을 들 수 없습니다’
  rationale: 본문은 자기 비하를 넘어 하나님 앞에서의 접근 불가 상태를 고백하므로, 직접적인 신체 이미지와 존대 표현을 함께 유지했습니다.
  doctrine_reference: '경건한 회개와 하나님의 거룩 앞에서의 인간의 수치(참조: 시 25:2-3, 단 9:7-8)'
