source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
  footnotes:
  - marker: a
    text: Or more literally, 'with the peoples of these abominations.' The Hebrew likely means peoples characterized by such abominable practices.
    reason: lexical_alternative
  - marker: b
    text: Or 'leaving no remnant or escaped survivor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 다시 주님의 명령을 어기고 이 가증한 행위를 하는 백성과[a] 통혼하겠습니까? 주님께서 우리에게 진노하셔서 우리를 다 멸하시고 남은 자도 피한 자도 없게 하시지 않겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 가증한 것들의 백성과’입니다. 히브리어의 압축된 표현은 문맥상 이 가증한 행위로 특징지어지는 백성을 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: ‘피한 자’는 히브리어의 ‘탈출한 자, 피하여 살아남은 자’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  english_pob_choice: Shall we again
  chosen_korean: 우리가 다시
  alternatives_korean:
  - 우리가 돌아가
  - 우리가 되돌아
  lexicon: HALOT
  rationale: שׁוּב는 문자적으로 ‘돌아가다’이지만, 여기서는 이전의 불순종을 또다시 반복하겠느냐는 수사적 질문이므로 ‘다시’가 자연스럽고 의미를 정확히 살립니다.
- source_word: לְהָפֵר מִצְוֺתֶיךָ
  english_pob_choice: break your commandments
  chosen_korean: 주님의 명령을 어기고
  alternatives_korean:
  - 주님의 계명을 깨고
  - 주님의 명령을 위반하고
  lexicon: HALOT
  rationale: פר는 언약·법적 문맥에서 ‘깨다/어기다’의 뜻이므로, 현대 한국어에서 자연스러운 ‘어기고’로 렌더링하되, 직접 호칭의 대상은 문맥상 하나님으로 정리했습니다.
- source_word: וּלְהִתְחַתֵּן
  english_pob_choice: and intermarry
  chosen_korean: 통혼하겠습니까
  alternatives_korean:
  - 혼인 관계를 맺겠습니까
  - 정략적으로 혼인하겠습니까
  lexicon: HALOT
  rationale: 히트파엘 חתן은 집단 간 혼인 관계를 맺는 뜻이므로, 성경적·사회적 결을 유지하는 전문어 ‘통혼’이 가장 압축적이고 정확합니다.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  english_pob_choice: with the peoples of these abominations
  chosen_korean: 이 가증한 것들의 백성과
  alternatives_korean:
  - 이 가증한 일들을 행하는 백성과
  - 이 가증한 백성과
  lexicon: HALOT
  rationale: 구조상 ‘가증한 것들의 백성’이라는 속격 결합을 살리면서도, 한국어에서는 오해를 줄이기 위해 ‘백성’과 ‘가증한 것들’의 관계를 그대로 드러냈습니다.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  english_pob_choice: Would you not be angry with us
  chosen_korean: 주님께서 우리에게 진노하셔서
  alternatives_korean:
  - 주님께서 우리를 향해 분노하셔서
  - 주님께서 우리에게 노하셔서
  lexicon: HALOT
  rationale: אנף는 단순 감정적 ‘화내다’보다 심판적 진노의 뉘앙스가 있어 ‘진노하셔서’가 문맥에 더 맞습니다.
- source_word: עַד כַּלֵּה לְאֵין שְׁאֵרִית וּפְלֵיטָה
  english_pob_choice: until you had consumed us, leaving no remnant or survivor
  chosen_korean: 우리가 멸망하여 남은 자도, 도망한 자도 없게 되실 것 아닙니까
  alternatives_korean:
  - 우리를 다 멸하시어 남은 자도, 도망한 자도 없게 되실 것 아닙니까
  - 우리를 소멸하여 남은 자도, 살아남은 자도 없게 되실 것 아닙니까
  lexicon: HALOT
  rationale: כלה는 완전한 파괴/소진을 가리키므로 ‘멸망하여’로 옮기고, שְׁאֵרִית과 פְלֵיטָה의 평행을 한국어로 자연스럽게 살리기 위해 ‘남은 자’와 ‘도망한 자’를 병렬했습니다.
theological_decisions:
- issue: ‘이 가증한 것들의 백성’의 의미
  chosen_reading: 이 표현을 백성 자체의 본질적 열등성으로 읽지 않고, 가증한 행위와 결합된 집단을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 가증한 백성
  - 가증한 일들을 행하는 백성
  rationale: 히브리어 속격구는 민족 혐오가 아니라 금지된 관행에 대한 종교적 평가를 담고 있으므로, 본문이 겨냥하는 윤리·예배상의 문제를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘남은 자’ 보존 여부
  chosen_reading: ‘남은 자’의 예언적·정경적 울림을 살리되, 한국어에서는 병렬 종결을 위해 ‘도망한 자’로 풀어 자연스럽게 정리했습니다.
  alternative_readings:
  - 남은 자도, 생존자도
  - 남은 자도, 도망쳐 살아난 자도
  rationale: Ezra의 심판-잔존 어휘는 정경적 연결성이 크므로 핵심 의미를 유지해야 하지만, 본절의 수사적 질문을 매끄럽게 읽히도록 한국어 병렬 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §5
