  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존되어 있으나, ‘이 가증한 것들의 백성’은 히브리어의 압축된 속격을 한국어에서 부자연스럽고 불명확하게 재현합니다. 또한 ‘우리가 멸망하여 … 없게 되실 것’은 멸망의 행위 주체와 ‘없게 하다’의 주체가 문법적으로 어긋나며, 하나님께서 완전히 멸하신다는 히브리어의 타동적 의미를 약화합니다.
  naturalness: ‘이 가증한 행위를 하는 백성’은 현대 표준 한국어에서 자연스럽고, 본문이 문제 삼는 것이 백성의 본질이 아니라 가증한 관행임을 분명히 합니다. ‘우리를 다 멸하시고 남은 자도 피한 자도 없게 하시지 않겠습니까?’는 수사 의문문의 흐름과 합쇼체를 자연스럽게 살립니다.
  terminology: ‘명령을 어기고’, ‘통혼’, ‘진노’, ‘남은 자’는 적절합니다. פְלֵיטָה에는 ‘피한 자’를 사용하여 שְׁאֵרִית(남은 자)와의 병행을 보존했습니다. ‘주님’은 기도문의 직접 호칭으로 적절합니다.
