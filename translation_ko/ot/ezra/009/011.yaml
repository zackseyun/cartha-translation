source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'from mouth to mouth,' an idiom meaning the land was filled completely, from one end to the other.
    reason: lexical_alternative
  - marker: b
    text: Or 'an unclean land' for 'a land of impurity.' The Hebrew term carries defilement language that may include both ritual and moral overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 종 선지자들의 손을 통해 주께서 명령하셔서 말씀하시기를, 「너희가 차지하려고 들어가는 땅은 땅의 부정함 때문에 부정한 땅이니, 그 땅의 민족들의 부정함과 그들의 가증한 일들 때문에 그들이 그 땅을 이 끝에서 저 끝까지 자기들의 더러움으로 가득 채웠습니다」 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘입에서 입으로’는 관용구로서, 땅이 이 끝에서 저 끝까지 완전히 채워졌다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부정한 땅’ 또는 ‘부정함의 땅’으로도 옮길 수 있습니다. 이 표현은 제의적 부정과 도덕적 오염의 함의를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: ~의 손을 통해
  alternatives_korean:
  - ~으로
  - ~를 통해
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리면서도 한국어에서 자연스럽게 예언자적 매개를 드러내기 위해 ‘손을 통해’로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 주님의 시종
  lexicon: HALOT
  rationale: 여기서는 하나님께 속한 예언자들을 가리키는 존칭적 표현이므로, 본문 뜻을 살려 ‘종’으로 두었습니다.
- source_word: אֶרֶץ נִדָּה
  english_pob_choice: a land of impurity
  chosen_korean: 부정한 땅
  alternatives_korean:
  - 부정의 땅
  - 더러운 땅
  - 불결한 땅
  lexicon: HALOT
  rationale: 추상명사 구조를 한국어에서는 형용사구로 압축해 자연스럽게 옮기되, 제의적·도덕적 오염의 긴장을 약화시키지 않기 위해 ‘부정한’으로 번역했습니다.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  english_pob_choice: because of their abominations
  chosen_korean: 그들의 가증한 일들 때문에
  alternatives_korean:
  - 그들의 가증함 때문에
  - 그들의 혐오스러운 행위들 때문에
  lexicon: HALOT
  rationale: תועבה는 단순한 혐오감보다 언약적으로 가증한 행위를 가리키므로, 행위성을 드러내는 ‘가증한 일들’이 적절합니다.
- source_word: מִפֶּה אֶל פֶּה
  english_pob_choice: from end to end
  chosen_korean: 이 끝에서 저 끝까지
  alternatives_korean:
  - 처음부터 끝까지
  - 구석구석
  lexicon: HALOT
  rationale: 직역의 ‘입에서 입으로’는 한국어에서 의미가 불분명하므로, 관용적 의미인 전면적 충만을 살려 ‘이 끝에서 저 끝까지’로 옮겼습니다.
- source_word: בְּטֻמְאָתָם
  english_pob_choice: with their uncleanness
  chosen_korean: 자기들의 더러움
  alternatives_korean:
  - 그들의 부정함
  - 그들의 더러움
  lexicon: HALOT
  rationale: 마지막 절은 앞의 ‘부정함’과 연결되지만, 여기서는 가득 채운 결과 상태를 강조하므로 한국어에서는 더 구체적인 ‘더러움’으로 마무리했습니다.
theological_decisions:
- issue: 부정함/가증함의 범위
  chosen_reading: 제의적 부정과 도덕적 가증함을 한 범주로 축소하지 않고 함께 살렸습니다.
  alternative_readings:
  - 순전히 제의적 부정으로만 읽기
  - 순전히 도덕적 타락으로만 읽기
  rationale: 히브리어의 נִדָּה, טֻמְאָה, תוֹעֵבָה는 서로 겹치며 작동하므로, 한국어도 그 긴장을 유지해야 본문의 신학적 무게가 보존됩니다.
  doctrine_reference: Translation philosophy §3
- issue: 주님의 종들의 호칭
  chosen_reading: 예언자들을 가리키는 표현은 ‘종’으로 옮기되, 주체가 하나님이심을 분명히 했습니다.
  alternative_readings:
  - 노예
  - 시종
  rationale: 본문의 초점은 종속 신분 자체가 아니라 하나님의 말씀 전달자라는 직무와 권위에 있으므로, 존칭적 ‘종’이 가장 적절합니다.
  doctrine_reference: POB terminology policy
