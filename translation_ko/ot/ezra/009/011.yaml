revisions:
- from: 주님의 종 선지자들의 손을 통해 주께서 명령하셔서 말씀하시기를, 「너희가 차지하려고 들어가는 땅은 땅의 부정함 때문에 부정한 땅이니, 그 땅의 민족들의 부정함과 그들의 가증한 일들 때문에 그들이 그 땅을 이 끝에서 저 끝까지 자기들의 더러움으로 가득 채웠습니다」 하셨습니다.[a][b]
  to: 주님께서 주님의 종 예언자들을 통하여 명령하여 말씀하셨습니다. “너희가 차지하러 들어가는 땅은 여러 땅의 민족들의 부정함과 그들의 가증한 일들 때문에 부정한 땅[b]입니다. 그들이 자기들의 가증한 일들로 그 땅을 이 끝에서 저 끝까지[a] 자기들의 부정함으로 가득 채웠습니다.”
  rationale: 수정문은 원문의 명령 전달 구조, ‘여러 땅의 민족들’의 복수 표현, 부정함과 가증한 일들의 원인 관계, 그리고 가증한 일들과 부정함으로 땅을 가득 채웠다는 결말을 보존합니다. 의미를 덧붙이지 않고 현대 표준어 합쇼체로 문장을 다듬었으며, 두 각주를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:20Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘여러 땅의 민족들의 부정함’이라는 מקור의 핵심을 앞서 ‘땅의 부정함 때문에’로 한 차례 잘못 옮긴 뒤 다시 반복하여, 원문의 수식 관계를 흐립니다. 또한 ‘부정함과 가증한 일들 때문에 그들이 … 채웠습니다’는 히브리어의 ‘그들의 가증한 일들로 그 땅을 … 그들의 부정함으로 채웠다’라는 관계를 충분히 드러내지 못합니다. 수정문은 두 전치사구와 관계절의 연결을 보존합니다.
  naturalness: ‘주님의 종 선지자들의 손을 통해 주께서’는 소유격과 ‘손을 통해’가 겹쳐 다소 무겁습니다. ‘주님께서 주님의 종 예언자들을 통하여’가 현대 표준어 합쇼체에서 자연스럽습니다. ‘선지자’보다 중립적이고 현대적인 ‘예언자’를 사용했습니다.
  terminology: נִדָּה와 טֻמְאָה는 모두 ‘부정함’으로 일관되게 옮겨 제의적·도덕적 함의를 열어 둡니다. תּוֹעֲבֹת는 ‘가증한 일들’로 유지했습니다. ‘여러 땅의 민족들’은 עַמֵּי הָאֲרָצוֹת의 복수성을 보존하면서 한국어로도 이해 가능합니다.
  issues:
  - severity: high
    issue: 원문의 원인·수식 관계가 중복되고 흐려짐
    rationale: ‘땅의 부정함 때문에’는 원문에 없는 원인 구절이며, 이어지는 ‘그 땅의 민족들의 부정함’과 중복됩니다. 원문은 땅이 ‘여러 땅의 민족들의 부정함과 그들의 가증한 일들’ 때문에 부정하다고 말합니다.
  - severity: medium
    issue: 가증한 일들과 ‘채웠다’의 관계가 불명확함
    rationale: אֲשֶׁר는 ‘그들의 가증한 일들’을 받아, 그 행위들로 땅을 채웠다는 뜻을 이룹니다. 한국어 문장을 재구성하여 이 관계와 마지막 ‘그들의 부정함으로’를 분명히 해야 합니다.
