lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그런데 이제
  lexicon: HALOT
  rationale: 시간 전환과 담화 전개를 자연스럽게 살리면서, 한국어 기도문에서는 '이제'가 가장 간결하고 합쇼체에 맞습니다.
- source_word: מַה נֹּאמַר
