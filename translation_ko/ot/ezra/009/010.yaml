  chosen_reading: 직접 호칭과 공손한 자기고백이 함께 있는 참회 기도로 읽었습니다.
  alternative_readings:
  - 단순한 정보 전달문
  - 중립적 상담 요청문
  rationale: 문맥상 에스라가 하나님 앞에서 자신의 무력함과 죄책을 고백하는 것이므로, 한국어도 기도체를 유지하되 원문의 수사적 질문성을 보존했습니다.
  doctrine_reference: 죄 고백과 하나님의 면전에서의 겸손한 기도
