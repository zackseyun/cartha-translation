  rationale: 수사적 무력감이 있는 질문으로 읽히므로, 단순 미래형보다 공손한 반문 형태로 옮겼습니다. 하나님께 직접 말하는 문맥이라 '말하다'보다 '말씀드리다'가 적절합니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 오 우리 하나님
  lexicon: HALOT
  rationale: 소유격 겸 호격의 기능을 한국어 기도문에서는 '우리 하나님'으로 자연스럽게 드러낼 수 있으며, '오'는 불필요하게 고풍스럽습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 명령들
  alternatives_korean:
  - 주님의 계명들
  - 당신의 명령들
  lexicon: HALOT
  rationale: 언약적 불순종의 무게를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 '명령들'로 옮겼습니다. 여기서는 전통적 교회어인 '계명'보다 원문의 일반적 명령 개념이 더 직접적입니다.
theological_decisions:
