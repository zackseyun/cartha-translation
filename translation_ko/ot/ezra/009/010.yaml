  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
  footnotes:
  - marker: a
    text: Or 'what shall we say.' The Hebrew imperfect may be rendered more formally this way.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 무엇을 말씀드리겠습니까, 우리 하나님, 이 일 후에? 이는 우리가 주님의 명령들을 버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무엇을 말씀드리겠습니까.” 히브리어 미완료형은 보다 형식적으로 이렇게 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그런데 이제
  lexicon: HALOT
  rationale: 시간 전환과 담화 전개를 자연스럽게 살리면서, 한국어 기도문에서는 '이제'가 가장 간결하고 합쇼체에 맞습니다.
- source_word: מַה נֹּאמַר
  english_pob_choice: what shall we say
  chosen_korean: 무엇을 말씀드리겠습니까
  alternatives_korean:
  - 무엇이라 하겠습니까
  - 무엇을 말하겠습니까
  lexicon: HALOT
  rationale: 수사적 무력감이 있는 질문으로 읽히므로, 단순 미래형보다 공손한 반문 형태로 옮겼습니다. 하나님께 직접 말하는 문맥이라 '말하다'보다 '말씀드리다'가 적절합니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 오 우리 하나님
  lexicon: HALOT
  rationale: 소유격 겸 호격의 기능을 한국어 기도문에서는 '우리 하나님'으로 자연스럽게 드러낼 수 있으며, '오'는 불필요하게 고풍스럽습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 명령들
  alternatives_korean:
  - 주님의 계명들
  - 당신의 명령들
  lexicon: HALOT
  rationale: 언약적 불순종의 무게를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 '명령들'로 옮겼습니다. 여기서는 전통적 교회어인 '계명'보다 원문의 일반적 명령 개념이 더 직접적입니다.
theological_decisions:
- issue: 하나님께 직접 드리는 참회 기도의 어조
  chosen_reading: 직접 호칭과 공손한 자기고백이 함께 있는 참회 기도로 읽었습니다.
  alternative_readings:
  - 단순한 정보 전달문
  - 중립적 상담 요청문
  rationale: 문맥상 에스라가 하나님 앞에서 자신의 무력함과 죄책을 고백하는 것이므로, 한국어도 기도체를 유지하되 원문의 수사적 질문성을 보존했습니다.
  doctrine_reference: 죄 고백과 하나님의 면전에서의 겸손한 기도
