id: EZR.9.13
reference: Ezra 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
  footnotes:
  - marker: a
    text: Or, 'have spared us more than our iniquities warranted.' The Hebrew idiom literally speaks of God withholding judgment below the measure of their guilt.
    reason: lexical_alternative
  - marker: b
    text: Or, 'an escape' or 'survivors.' The term refers to those preserved through judgment; 'remnant' brings out the post-exilic covenant context.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 악한 행위와 큰 죄과 때문에 이 모든 일이 우리에게 닥친 뒤에도—우리 하나님이시여, 주께서는 우리 죄악에 마땅한 벌보다 우리를 덜 벌하시고[a], 이러한 남은 자를 우리에게 주셨습니다[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 죄악에 마땅한 벌보다 우리를 더 많이 아끼셨다.’ 히브리어 관용구는 하나님께서 그들의 죄악에 상응하는 심판보다 적게 내리셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이러한 피난’ 또는 ‘이러한 생존자들.’ 이 단어는 심판을 지나 보존된 사람들을 가리키며, ‘남은 자’는 포로기 이후 언약 공동체라는 문맥을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל הַבָּא עָלֵינוּ
  english_pob_choice: And after all that has come upon us
  chosen_korean: 우리에게 닥친 모든 일 뒤에도
  alternatives_korean:
  - 우리에게 일어난 모든 일 뒤에도
  - 우리에게 임한 모든 일 뒤에도
  lexicon: HALOT
  rationale: ‘닥친’은 על의 압박적·엄습적 뉘앙스를 살리면서도 자연스러운 현대 한국어로 재현합니다. ‘뒤에도’는 전후 관계와 역접적 흐름을 함께 드러냅니다.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  english_pob_choice: because of our evil deeds and our great guilt
  chosen_korean: 우리의 악한 행위와 큰 죄악 때문에
  alternatives_korean:
  - 우리의 악한 행위와 큰 허물 때문에
  - 우리의 악한 행위와 큰 죄책 때문에
  lexicon: HALOT
  rationale: ב의 인과 용법을 ‘때문에’로 자연스럽게 옮기고, מַעֲשִׂים/אַשְׁמָה의 병렬을 ‘악한 행위’와 ‘큰 죄악’으로 살렸습니다. ‘죄악’은 단순한 감정이 아니라 객관적 책임을 강조합니다.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  english_pob_choice: have punished us less than our iniquities deserve
  chosen_korean: 우리의 죄악이 마땅히 받아야 할 것보다 우리를 덜 치시고
  alternatives_korean:
  - 우리의 죄악에 합당한 것보다 덜 벌하시고
  - 우리의 죄악 아래에서 우리를 덜 징벌하시고
  lexicon: HALOT
  rationale: חָשַׂךְ의 ‘아끼다/덜어 주다/보류하다’ 의미를 한국어 동사구 ‘덜 치시고’로 풀어, 문맥상 ‘마땅한 형벌보다 적게 다루심’을 드러냈습니다. ‘치시다’는 하나님의 징계적 행위를 지나치게 설명하지 않으면서도 본문 의미를 보존합니다.
- source_word: פְּלֵיטָה כָּזֹאת
  english_pob_choice: such a remnant as this
  chosen_korean: 이런 남은 자
  alternatives_korean:
  - 이런 남은 무리
  - 이런 구원받은 무리
  lexicon: HALOT
  rationale: פְּלֵיטָה는 단순한 ‘도피’가 아니라 심판 가운데 보존된 생존 공동체를 가리키므로, 포로기 이후 문맥을 살려 ‘남은 자’로 옮겼습니다. ‘이런’은 כָּזֹאת의 지시적 강조를 반영합니다.
theological_decisions:
- issue: 하나님의 심판과 자비의 긴장
  chosen_reading: 주께서는 우리의 죄악이 마땅히 받아야 할 것보다 우리를 덜 치시고
  alternative_readings:
  - 주께서는 우리를 죄악보다 덜 벌하시고
  - 주께서는 우리에게 합당한 벌을 덜 내리시고
  rationale: 본문은 죄에 대한 정당한 심판을 인정하면서도, 실제로는 그보다 적게 다루신 하나님의 자비를 고백합니다. ‘덜 치시고’는 심판의 실재와 절제된 자비를 함께 보존합니다.
  doctrine_reference: Ezra 9:13의 회개 기도와 하나님의 공의/긍휼 균형
- issue: פְּלֵיטָה의 공동체적·구속사적 함의
  chosen_reading: 이런 남은 자
  alternative_readings:
  - 이런 생존자들
  - 이런 탈출자들
  rationale: 문맥상 단순 생존이 아니라 심판 뒤에도 보존된 언약 공동체를 가리키므로, POB의 ‘remnant’ 흐름에 맞춰 ‘남은 자’를 채택했습니다.
  doctrine_reference: 포로기 이후 남은 자 신학
