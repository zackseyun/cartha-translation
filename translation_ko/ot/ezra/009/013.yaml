review_pass:
  verdict: revise
  source_fidelity: ‘우리의 죄악이 마땅히 받아야 할 것보다 우리를 덜 치시고’는 죄악 자체가 형벌을 받는다는 문법적 어색함이 있고, חָשַׂךְ의 ‘아끼다/덜어 주다/보류하다’보다 ‘치다’를 앞세웁니다. ‘우리 죄악에 마땅한 벌보다 우리를 덜 벌하시고’는 문맥상 생략된 심판을 자연스럽게 보충하면서, 하나님의 절제된 심판이라는 히브리어 관용구의 의미를 충실히 전달합니다. אַשְׁמָה는 עָוֺן과 구별하여 ‘큰 죄과’로 옮겼습니다.
  naturalness: ‘우리에게 닥친 모든 일 뒤에도’도 이해되지만, ‘이 모든 일이 우리에게 닥친 뒤에도’가 한국어 어순상 더 자연스럽고 ‘all’의 범위를 명확히 합니다. 각주 표지는 해당 표현 바로 뒤에 두어 지시 대상이 분명하게 했습니다. 본문은 기도의 미완결된 흐름을 보존하기 위해 끝맺음 대시를 유지했습니다.
  terminology: ‘악한 행위’, ‘큰 죄과’, ‘죄악’, ‘남은 자’는 각각 מעשים רעים, אשמה, עון, פליטה의 문맥상 구별을 무리 없이 반영합니다. ‘남은 자’는 포로기 이후 보존된 공동체라는 문맥에 적합하며, 각주에서 ‘피난’ 및 ‘생존자들’의 어휘적 가능성을 밝혔습니다.
  issues:
