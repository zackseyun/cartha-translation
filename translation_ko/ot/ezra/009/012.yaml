  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
  footnotes:
  - marker: a
    text: Literally, 'do not seek their peace or their good forever.'
    reason: lexical_alternative
  - marker: b
    text: Or 'leave it to your sons as an inheritance forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제[a] 여러분의 딸을 그들의 아들들에게 주지 말고, 그들의 딸을 여러분의 아들들을 위해 취하지도 마십시오. 그들의 평강이나 그들의 복리[b]를 영원히 구하지 마십시오. 그러면 여러분이 강해지고 그 땅의 좋은 것을 먹으며 그것을 여러분의 아들들에게 영원히 유산으로 남길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 평강이나 그들의 복리를 영원히 구하지 말라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 여러분의 아들들에게 영원히 유산으로 남기라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  lexicon: BDB / HALOT
  rationale: 전환 표지와 결론적 권고를 함께 살려, 문맥의 호소력을 드러내면서도 자연스러운 한국어로 옮겼습니다.
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם / וּבְנֹתֵיהֶם ... לִבְנֵיכֶם
  english_pob_choice: give your daughters to their sons / do not take their daughters for your sons
  chosen_korean: 여러분의 딸을 그들의 아들들에게 주지 말고, 그들의 딸을 여러분의 아들들을 위해 취하지도 마십시오
  alternatives_korean:
  - 여러분의 딸을 그들의 아들들에게 주지 말고, 그들의 딸을 여러분의 아들들에게 들이지도 마십시오
  - 여러분의 딸을 그들의 아들들과 결혼시키지 말고, 그들의 딸을 여러분의 아들들에게 아내로 맞이하지도 마십시오
  lexicon: HALOT
  rationale: 히브리어의 평행 구조와 직설적 표현을 살리되, 한국어에서는 '주다/취하다'만으로 혼인 금지를 분명히 전달할 수 있어 과도한 의역을 피했습니다.
- source_word: שְׁלֹמָם וְטוֹבָתָם
  english_pob_choice: their peace or their prosperity
  chosen_korean: 그들의 평강이나 그들의 복리
  alternatives_korean:
  - 그들의 평안이나 그들의 번영
  - 그들의 평화나 그들의 복지
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 평화보다 넓은 '평강'이 적절하고, טוֹבָה는 물질적·사회적 유익을 가리키므로 '복리'로 구분해 두 용어의 차이를 보존했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: never / forever
  chosen_korean: 영원히
  alternatives_korean:
  - 결코
  - 끝까지
  lexicon: HALOT
  rationale: 금지문의 지속성과 마지막의 영속성을 한국어에서 가장 간결하게 드러내는 표현으로, 같은 어구가 앞뒤에서 다른 뉘앙스로 쓰이더라도 '영원히'로 일관되게 살렸습니다.
- source_word: וְהוֹרַשְׁתֶּם לִבְנֵיכֶם
  english_pob_choice: leave it as an inheritance to your sons
  chosen_korean: 그것을 여러분의 아들들에게 영원히 유산으로 남길 것입니다
  alternatives_korean:
  - 그것을 여러분의 아들들에게 영원한 유산으로 물려줄 것입니다
  - 그 땅의 좋은 것을 여러분의 아들들에게 유산으로 남길 것입니다
  lexicon: HALOT
  rationale: 히필 ירש의 사역적 의미를 한국어의 '유산으로 남기다'로 풀어, 단순 소유가 아니라 다음 세대에 넘겨지는 상속 개념을 드러냈습니다.
theological_decisions:
- issue: 포로기 이후 공동체 보존과 혼인 금지의 직접성
  chosen_reading: 구체적 역사 맥락의 금지로 그대로 옮기고, 보편적 관계 윤리로 완화하지 않았습니다.
  alternative_readings:
  - 영적 타협을 막는 일반 원칙으로 넓혀 번역하기
  - 이방인과의 관계 전반을 피하라는 뜻으로 부드럽게 바꾸기
  rationale: 본문은 귀환 공동체의 언약적 순결과 가문 보존을 다루므로, 원문의 강한 금지와 긴장감을 유지하는 것이 source-direct에 부합합니다.
  doctrine_reference: Ezra 9의 역사-언약적 맥락
