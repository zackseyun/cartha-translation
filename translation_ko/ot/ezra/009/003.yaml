id: EZR.9.3
reference: Ezra 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
  footnotes:
  - marker: a
    text: Or 'When I heard this report, I tore my clothes and my robe ... and sat astonished.'
    reason: lexical_alternative
  - marker: b
    text: Tearing garments and pulling out hair were customary expressions of grief, horror, or mourning.
    reason: cultural_note
translation:
  language: ko
  text: 제가 이 일을 듣자마자, 제 옷과 겉옷을 찢고 제 머리털과 수염털을 일부 뽑고[a] 경악한 채 앉아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 옷을 찢고 머리털과 수염털을 뽑는 것은 슬픔, 충격, 애도를 나타내는 관습적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  english_pob_choice: As soon as I heard
  chosen_korean: 내가 이 일을 들었을 때
  alternatives_korean:
  - 내가 이 소식을 들었을 때
  - 내가 이 말을 들었을 때
  lexicon: HALOT
  rationale: 즉시성은 한국어에서 '들었을 때'로 충분히 드러나며, '이 일'은 דָּבָר의 넓은 범위를 자연스럽게 살립니다.
- source_word: בִּגְדִי וּמְעִילִי
  english_pob_choice: my garment and my robe
  chosen_korean: 내 옷과 겉옷
  alternatives_korean:
  - 내 의복과 내 로브
  - 내 옷과 내 망토
  lexicon: HALOT
  rationale: 두 의복을 구별하되 현대 한국어에서 자연스럽게 읽히도록 '옷'과 '겉옷'으로 옮겼습니다.
- source_word: וָאֶמְרְטָה מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  english_pob_choice: pulled out some of the hair of my head and my beard
  chosen_korean: 내 머리와 수염의 털을 뽑은 뒤
  alternatives_korean:
  - 내 머리와 수염에서 일부 털을 뽑고
  - 내 머리털과 수염털을 뽑고
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 한국어에서 과도하게 풀지 않되, 머리와 수염에서 털을 뽑는 동작을 분명히 드러냈습니다.
- source_word: מְשׁוֹמֵם
  english_pob_choice: appalled
  chosen_korean: 놀라 넋을 잃은 채
  alternatives_korean:
  - 경악한 채
  - 망연자실한 채
  - 넋이 나간 채
  lexicon: HALOT
  rationale: מידע/상태를 나타내는 분사적 용법을 살려, 단순한 놀람보다 충격으로 멍해진 상태를 표현했습니다.
theological_decisions:
- issue: 에스라의 애도 표현의 강도
  chosen_reading: 겉옷과 머리카락을 훼손하는 행위를 문자 그대로 옮기되, 한국어에서 문화적 의미가 바로 드러나도록 표현했습니다.
  alternative_readings:
  - 행동을 완화해 '슬퍼하며 앉아 있었습니다'로만 옮김
  - 관습 설명을 본문에 직접 삽입함
  rationale: 본문은 애도와 충격의 관습적 표지를 실제 행위로 제시하므로, 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경 본문의 서술적·상징적 행위는 역사적 의미를 유지한 채 번역되어야 함
