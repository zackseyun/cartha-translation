  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
  footnotes:
  - marker: a
    text: Or 'a secure hold' for 'a peg'; the Hebrew keeps the concrete image of something fixed firmly in place.
    reason: lexical_alternative
  - marker: b
    text: Or 'give light to our eyes'; this idiom expresses renewed vitality or hope.
    reason: lexical_alternative
  - marker: c
    text: Or 'in our servitude' or 'in our bondage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 잠시 동안 우리 하나님 야훼께서 은혜를 베푸셔서, 우리에게 피한 남은 자를 남겨 주시고, 그의 거룩한 곳에 못 하나를 주셔서, 우리 하나님께서 우리의 눈을 밝히시고, 우리의 노예 상태에서 우리에게 조금이나마 소생을 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘든든한 붙잡음’으로 볼 수 있습니다. 히브리어는 고정된 것을 가리키는 구체적 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 눈에 빛을 주시기’입니다. 이 관용구는 새 힘과 희망의 회복을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리의 종살이 가운데’ 혹은 ‘우리의 속박 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  english_pob_choice: favor
  chosen_korean: 은혜를 베푸셔서
  alternatives_korean:
  - 은총이 임하여
  - 호의가 있어
  - 은혜가 있어
  lexicon: HALOT
  rationale: 이 문맥에서는 ‘부탁’이 아니라 야훼께서 베푸신 호의이므로, POB의 ‘favor’를 따라 ‘은혜를 베푸셔서’로 옮겨 주어 수여된 호의의 성격을 드러냈습니다.
- source_word: פְּלֵיטָה
  english_pob_choice: a remnant that has escaped
  chosen_korean: 피한 남은 자
  alternatives_korean:
  - 도망쳐 살아남은 남은 자
  - 남은 자들
  - 살아남은 자들
  lexicon: HALOT
  rationale: ‘피한’으로 생존·탈출의 의미를 살리고, ‘남은 자’로 공동체의 언약사적 잔존 개념을 함께 보존했습니다.
- source_word: יָתֵד
  english_pob_choice: a peg
  chosen_korean: 못 하나
  alternatives_korean:
  - 말뚝 하나
  - 안전한 발판
  - 고정된 자리
  lexicon: HALOT
  rationale: 이미지 자체를 유지하기 위해 구체적 사물인 ‘못’으로 옮기되, 수량과 결합해 고정된 지지점이라는 감각을 살렸습니다. 주석에서 다른 가능성을 열어 두었습니다.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  english_pob_choice: in his holy place
  chosen_korean: 그의 거룩한 곳
  alternatives_korean:
  - 그의 성소 안에
  - 그의 거룩한 처소에
  - 그의 거룩한 장소에
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 ‘거룩한 곳’으로 두어, 성전 중심의 의미를 함축하되 본문 이상으로 특정화하지 않았습니다.
- source_word: בְּעַבְדֻתֵנוּ
  english_pob_choice: in our slavery
  chosen_korean: 우리의 노예 상태에서
  alternatives_korean:
  - 우리의 종살이 가운데
  - 우리의 종속 상태에서
  - 우리의 속박 가운데
  lexicon: HALOT
  rationale: POB가 ‘slavery’를 택해 강한 종속성을 드러내므로, 한국어도 완곡하게 낮추지 않고 ‘노예 상태’로 옮겨 본문의 압박감을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름과 경어 처리
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 두고, 하나님께 향하는 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 순화
  - ‘여호와’ 표기
  - 보다 경전문어체로 조정
  rationale: 본문은 יְהוָה를 직접 사용하므로 POB의 원칙에 따라 ‘야훼’를 유지했습니다. 다만 한국어 문장 전체는 현대 예배문이 아닌 성경 본문답게 합쇼체를 유지해, 독자에게 공적 서술의 높임을 전달했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
