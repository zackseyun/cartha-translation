base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
  footnotes:
  - marker: a
    text: Or 'a secure hold' for 'a peg'; the Hebrew keeps the concrete image of something fixed firmly in place.
    reason: lexical_alternative
  - marker: b
    text: Or 'give light to our eyes'; this idiom expresses renewed vitality or hope.
    reason: lexical_alternative
  - marker: c
    text: Or 'in our servitude' or 'in our bondage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 잠시 동안 우리 하나님 야훼께서 은혜를 베푸셔서, 우리에게 피하여 살아남은 남은 자들을 남겨 두시고, 그의 거룩한 곳에 우리에게 못 하나를 주셔서, 우리 하나님께서 우리의 눈을 밝히시고 우리의 종살이 가운데 우리에게 조금이나마 소생을 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘든든한 자리’ 또는 ‘안정된 거점’으로 옮길 수 있습니다. 히브리어는 단단히 고정된 물건인 ‘못’의 구체적 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 눈에 빛을 주시고’입니다. 이 관용구는 새 힘과 희망의 회복을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리의 노예 상태에서’ 또는 ‘우리의 속박 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  english_pob_choice: favor
  chosen_korean: 은혜를 베푸셔서
  alternatives_korean:
