  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
  footnotes:
  - marker: a
    text: Or 'just.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an escaped remnant' or 'survivors.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'there is no standing before you because of this,' an idiom for being unable to remain or endure in God's presence under guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님이시여, 주께서는 의로우십니다.[a] 우리가 오늘날까지 살아남은 자들로 남아 있기 때문입니다.[b] 보십시오, 우리는 우리의 죄책을 지닌 채 주 앞에 서 있습니다. 이 일 때문에 아무도 주 앞에 설 수 없습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옳으십니다’, ‘공의로우십니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도망쳐 살아남은 자들’, ‘생존자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘이 일 때문에 주 앞에 설 수 없다’는 표현입니다. 죄책 아래서 하나님의 임재 앞에 머물거나 견딜 수 없음을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 언약 이름을 보존하기 위해 음역을 택했으며, 예배적 완곡어인 ‘주’로 바꾸지 않았습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 공의로우십니다
  - 옳으십니다
  lexicon: HALOT
  rationale: 하나님의 도덕적·재판적 정당성을 함께 담는 기본 의미를 살려 ‘의롭다’로 옮겼습니다.
- source_word: פְלֵיטָה
  english_pob_choice: a remnant
  chosen_korean: 남은 살아남은 무리
  alternatives_korean:
  - 남은 자
  - 남은 사람들
  - 잔존자
  lexicon: HALOT
  rationale: 문맥상 심판에서 벗어나 남은 자들을 가리키므로, POB의 ‘remnant’ 의미를 살리되 한국어에서는 생존의 뉘앙스를 드러냈습니다.
- source_word: בְּאַשְׁמָתֵינוּ
  english_pob_choice: in our guilt
  chosen_korean: 우리의 죄책 가운데
  alternatives_korean:
  - 우리의 죄 가운데
  - 우리의 허물 가운데
  lexicon: HALOT
  rationale: 명사 אשמה의 책임·죄책 상태를 보존하기 위해 ‘죄책’을 택했습니다.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  english_pob_choice: for no one can stand before you because of this
  chosen_korean: 이 일로 말미암아 아무도 주 앞에 설 수 없습니다
  alternatives_korean:
  - 이것 때문에 아무도 주 앞에 설 수 없습니다
  - 이로 인해 아무도 주 앞에 설 수 없습니다
  lexicon: HALOT
  rationale: ‘서다’의 관용적 의미인 ‘버티다/견디다’까지 포함하는 심판 문맥을 살려, 능력 부재를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 여호와/야훼 번역
  chosen_reading: 하나님의 언약 이름을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 יהוה를 직접 사용하므로, 일반 호칭으로 평준화하지 않고 고유 이름을 드러내는 쪽이 본문의 청원적·언약적 성격을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘아무도 주 앞에 설 수 없습니다’의 의미
  chosen_reading: 물리적 서 있음이 아니라 하나님의 임재와 심판 앞에서 견딜 수 없다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그대로 서 있을 수 없습니다
  - 머물 수 없습니다
  rationale: 히브리어 관용구를 한국어 독자에게 분명히 전달하되, 죄책으로 인한 무력함이라는 신학적 긴장을 약화시키지 않기 위해서입니다.
  doctrine_reference: 'POB translation philosophy: preserve theological tension rather than resolve it'
