  source_fidelity: 히브리어의 지원 관용구 חִזְּקוּ בִידֵיהֶם는 실제적 도움·후원을 뜻합니다. 초안의 ‘그들의 손을 도와주었으며’는 한국어에서 비문에 가깝고 관용구의 뜻을 정확히 전달하지 못합니다. 마지막 절도 ‘그 밖에도 … 있었습니다’로 옮길 수 있으나, 자원하여 바친 것을 별도의 추가 항목으로 제시하는 구조를 더 분명하고 자연스럽게 표현할 필요가 있습니다.
  naturalness: ‘그들의 손을 도와주다’는 현대 표준 한국어의 자연스러운 표현이 아닙니다. ‘그들을 도와주었습니다’가 합쇼체 문체에 맞고, 문맥상 물질적 지원의 의미도 분명합니다. 열거 항목에는 ‘값진 물품들’을 사용하여 자연스럽게 다듬었습니다.
  terminology: ‘은그릇’, ‘금’, ‘재물’, ‘가축’은 원문의 물품 목록을 충실히 반영합니다. מִגְדָּנוֹת은 문맥상 귀하고 값진 물품을 가리킬 수 있으므로 ‘값진 물품들’로 번역했습니다. הִתְנַדֵּב의 자발성은 ‘자원하여 바친’으로 유지했습니다.
