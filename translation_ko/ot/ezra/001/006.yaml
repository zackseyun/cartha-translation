language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל סְבִיבֹֽתֵי/הֶם֙ חִזְּק֣וּ בִֽ/ידֵי/הֶ֔ם בִּ/כְלֵי כֶ֧סֶף בַּ/זָּהָ֛ב בָּ/רְכ֥וּשׁ וּ/בַ/בְּהֵמָ֖ה וּ/בַ/מִּגְדָּנ֑וֹת לְ/בַ֖ד עַל כָּל הִתְנַדֵּֽב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
  footnotes:
  - marker: a
    text: Or 'their neighbors helped them' for the idiom 'strengthened their hands.'
    reason: lexical_alternative
  - marker: b
    text: Or 'besides every freewill offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 주변에 있던 모든 이들이 은그릇과 금, 재물과 가축과 값진 것들로 그들의 손을 도와주었으며, 그 밖에도 자원하여 바친 모든 것까지 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל סְבִיבֹתֵיהֶם
  english_pob_choice: And all those around them
  chosen_korean: 그들 주변에 있던 모든 이들
  alternatives_korean:
  - 그들을 둘러싼 모든 사람들
  - 그들 가까이 있던 모든 이들
  lexicon: HALOT
  rationale: סְבִיבֹתֵיהֶם은 단순한 지리적 '이웃'보다 주변에 있던 사람들을 가리키므로, 의미를 유지하면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: חִזְּקוּ בִידֵיהֶם
  english_pob_choice: strengthened their hands
  chosen_korean: 그들의 손을 도와주었으며
  alternatives_korean:
  - 그들의 손을 강하게 하였으며
  - 그들을 도와주었으며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색할 수 있어, 지원과 후원을 뜻하는 관용적 의미를 살리되 '손'의 이미지는 유지했습니다.
- source_word: בִּכְלֵי כֶסֶף
  english_pob_choice: with vessels of silver
  chosen_korean: 은그릇과
  alternatives_korean:
  - 은으로 된 그릇과
  - 은기와
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 금속 기물을 가리키므로, 목록의 첫 항목에 맞게 '은그릇'으로 간결하게 옮겼습니다.
- source_word: בָּרְכוּשׁ וּבַבְּהֵמָה וּבַמִּגְדָּנוֹת
  english_pob_choice: with goods, with livestock, and with precious things
  chosen_korean: 재물과 가축과 값진 것들
  alternatives_korean:
  - 재산과 가축과 귀한 물품들
  - 소유물과 가축과 보배로운 것들
  lexicon: HALOT
  rationale: רְכוּשׁ은 이동 가능한 재산, בְּהֵמָה는 가축, מִגְדָּנוֹת은 값진 선물이나 물품의 범위가 있어, 목록의 경제적·헌물적 성격을 유지하는 표현을 택했습니다.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  english_pob_choice: besides all that was freely offered
  chosen_korean: 그 밖에도 자원하여 바친 모든 것까지
  alternatives_korean:
  - 모든 자원 예물 외에도
  - 모든 자원한 헌물 외에도
  lexicon: HALOT
  rationale: לְבַד는 '그 밖에/별도로'의 덧붙임을 나타내고, הִתְנַדֵּב은 자발적 봉헌을 뜻하므로, 자유의지로 바친 헌물이라는 의미를 드러냈습니다.
theological_decisions:
- issue: 자발적 봉헌의 범위
  chosen_reading: 열거된 물품들은 포로 귀환자들을 실질적으로 지원한 헌물이며, 마지막 구절은 그 외에 자원하여 바친 추가 헌물을 따로 덧붙입니다.
  alternative_readings:
  - 모든 항목을 하나의 총괄적 '자원 헌물'로 보는 읽기
  - 마지막 구절을 단순한 중복 표현으로 보는 읽기
  rationale: 히브리어는 목록과 '그 밖에도'를 분명히 구분하므로, 지원 물품과 별도의 자원 봉헌을 구별해 주는 편이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: 헌물과 자원성에 대한 성경적 이해
- issue: 관용구의 의미 전달
  chosen_reading: '''strengthened their hands''는 문자적 이미지보다 실제적 후원과 격려를 나타내는 관용구로 이해해 번역했습니다.'
  alternative_readings:
  - 직역하여 '그들의 손을 강하게 하였다'
  - '''그들을 지지하였다''로 완전히 관용화'
  rationale: 히브리어 원문의 이미지와 의미를 함께 살리려면, 관용적 의미를 드러내되 핵심 비유를 완전히 지우지 않는 절충이 적절합니다.
  doctrine_reference: 본문 의미 보존 원칙
