base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
  footnotes:
  - marker: a
    text: Or 'through Mithredath the treasurer.' The Hebrew idiom is literally 'by the hand of Mithredath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the leader of Judah' or 'the governor of Judah.' The Hebrew term can denote a chief or ruler more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 바사 왕 고레스가 재무관 미드르닷[a]을 통해 그것들을 꺼내어 유다의 지도자[b] 세스바살에게 하나씩 세어 넘겨주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재무관 미드르닷의 손으로’. 히브리어 관용구는 문자적으로 ‘미드르닷의 손으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유다의 우두머리’ 또는 ‘유다의 총독’. 히브리어 용어는 더 넓게 지도자나 통치자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  english_pob_choice: brought them out
  chosen_korean: 그것들을 꺼내고
  alternatives_korean:
  - 그것들을 끌어내고
  - 그것들을 밖으로 내고
  - 그것들을 내어 주고
  lexicon: HALOT
  rationale: 문맥상 1절의 성전 기명들을 보관처에서 꺼내는 장면이므로, 사람 이동이 아니라 물건을 ‘꺼내다’로 옮기는 것이 자연스럽습니다.
- source_word: עַל יַד
  english_pob_choice: by the hand of
  chosen_korean: 미드르닷[a]을 통해
  alternatives_korean:
  - 미드르닷의 손으로
  - 미드르닷의 손을 통해
  - 미드르닷을 거쳐
  lexicon: HALOT
  rationale: 히브리어 관용구의 대리·매개 의미를 살리되, 한국어에서는 ‘~을 통해’가 가장 자연스럽고 오해가 적습니다.
- source_word: הַגִּזְבָּר
  english_pob_choice: the treasurer
  chosen_korean: 재무관
  alternatives_korean:
  - 재정 관리인
  - 금고 담당관
  - 보물지기
  lexicon: HALOT
  rationale: 페르시아 행정 맥락의 공식 직함이므로, 단순히 돈을 맡는 사람보다 ‘재무관’이 더 정확합니다.
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 지도자[b]
  alternatives_korean:
  - 지도자
  - 우두머리
  - 군주
  lexicon: HALOT
  rationale: נָשִׂיא는 ‘왕자’보다 넓게 ‘우두머리, 지도자’의 뜻을 가질 수 있으므로, 본문 문맥에 맞는 포괄적 표현을 택했습니다.
theological_decisions:
- issue: שֵׁשְׁבַּצַּר의 호칭을 어떻게 옮길지
  chosen_reading: 스룹바벨을 ‘유다의 지도자’로 설명적으로 옮겨, 본문의 행정적·대표적 지위를 드러냈습니다.
  alternative_readings:
  - 유다의 총독
  - 유다의 군주
  rationale: 이 절의 נָשִׂיא는 특정 제국 직함보다 공동체 대표를 가리키는 넓은 말이어서, 지나치게 제도화된 ‘총독’보다 본문이 허용하는 범위 안의 ‘지도자’가 더 안전합니다.
  doctrine_reference: 성경 본문은 역사적 인물의 공식 직함보다 공동체 대표성을 우선해 드러낼 수 있습니다.
