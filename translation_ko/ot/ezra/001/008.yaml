  source_fidelity: 개정이 필요합니다. 히브리어 본문은 수령자를 שֵׁשְׁבַּצַּר(세스바살)로 명시하는데, 초안은 이를 스룹바벨로 바꾸었습니다. 또한 הַגִּזְבָּר(재무관)가 본문 문장에서 누락되어 있습니다. ‘하나씩 세어 넘겨주었습니다’는 וַיִּסְפְּרֵם의 물품 계수·인도 문맥을 잘 반영합니다.
  naturalness: ‘재무관 미드르닷을 통해 … 꺼내어’와 ‘유다의 지도자 세스바살에게 … 넘겨주었습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘세어 넘겨주었습니다’는 기명들을 목록화하여 인도하는 상황에 적절합니다.
  terminology: מִתְרְדָת는 ‘미드르닷’, שֵׁשְׁבַּצַּר는 통상적 음역인 ‘세스바살’로 옮깁니다. הַגִּזְבָּר는 ‘재무관’, הַנָּשִׂיא는 특정 페르시아 관직을 단정하지 않는 ‘지도자’로 번역합니다.
