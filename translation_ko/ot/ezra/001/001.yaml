language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'Now in the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
  footnotes:
  - marker: a
    text: Literally, 'from the mouth of Jeremiah.' This Hebrew idiom means that Jeremiah was the human spokesman through whom the LORD's word came.
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'to complete the word of the LORD.' The main text uses 'fulfilled' because the context is the realization of prophecy.
    reason: lexical_alternative
  - marker: c
    text: Or, 'he made a proclamation' / 'he caused a proclamation to pass.' The Hebrew idiom refers to publicly circulating an official announcement.
    reason: lexical_alternative
translation:
  language: ko
  text: 페르시아 왕 고레스의 첫 해에, 야훼의 말씀, 곧 예레미야의 입을 통해 하신 말씀을 이루시려고 야훼께서 페르시아 왕 고레스의 영을 움직이셨습니다. 그리하여 그는 온 나라에 공포문을 내렸고, 글로도 내렸습니다. 말씀하셨습니다:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '예레미야의 입으로부터'입니다. 이는 예레미야가 여호와의 말씀을 전한 인간 대언자였다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 문자적으로는 '그 말씀을 이루려고'입니다. 본문은 예언의 성취를 가리키므로 본문에서는 '이루시려고'로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '공포문을 내렸다' / '공포문이 통과하게 했다'입니다. 히브리어 관용구는 공식적인 왕령의 공포를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  english_pob_choice: Now in the first year
  chosen_korean: 페르시아 왕 고레스의 첫 해에
  alternatives_korean:
  - 그리고 페르시아 왕 고레스의 첫 해에
  - 페르시아 왕 고레스의 첫 해에
  lexicon: HALOT
  rationale: 서술 도입의 'Now'는 한국어에서 자연스러운 문장 개시보다 시간 배경 제시가 더 적합하므로 생략하고, 첫 해라는 연대 표지를 간결하게 살렸습니다.
- source_word: לִכְלוֹת דְּבַר יְהוָה מִפִּי יִרְמְיָה
  english_pob_choice: so that the word of Yahweh from the mouth of Jeremiah might be fulfilled
  chosen_korean: 야훼의 말씀, 곧 예레미야의 입을 통해 하신 말씀을 이루시려고
  alternatives_korean:
  - 야훼의 말씀이 예레미야의 입에서 완성되도록
  - 예레미야의 입으로 하신 야훼의 말씀을 성취하시려고
  lexicon: HALOT
  rationale: לִכְלוֹת의 목적/성취 의미를 '이루시려고'로 살리고, מִפִּי는 직역형 '입을 통해'로 옮겨 예언적 매개를 드러냈습니다.
- source_word: הֵעִיר
  english_pob_choice: stirred up
  chosen_korean: 영을 움직이셨습니다
  alternatives_korean:
  - 영을 일깨우셨습니다
  - 영을 자극하셨습니다
  - 마음을 움직이셨습니다
  lexicon: HALOT
  rationale: רוּחַ의 넓은 의미를 살리면서도, 하나님의 내적 감동/촉발을 한국어로 자연스럽게 표현하기 위해 '움직이셨습니다'를 선택했습니다.
- source_word: וַיַּעֲבֶר קוֹל
  english_pob_choice: he sent a proclamation
  chosen_korean: 공포문을 내렸고
  alternatives_korean:
  - 선포를 하였고
  - 포고를 내렸고
  - 선언을 내렸고
  lexicon: HALOT
  rationale: 공식적이고 공개적인 왕령의 성격을 반영하기 위해 '공포문'과 '내렸고'를 사용했습니다.
- source_word: וְגַם בְּמִכְתָּב
  english_pob_choice: and also in writing
  chosen_korean: 글로도 내렸습니다
  alternatives_korean:
  - 문서로도 내렸습니다
  - 서면으로도 내렸습니다
  lexicon: HALOT
  rationale: 구두 공포와 병행된 서면 공표를 간결하게 나타내기 위해 '글로도'를 선택했습니다.
theological_decisions:
- issue: 예언 성취 표현 לִכְלוֹת דְּבַר יְהוָה의 번역
  chosen_reading: '''이루시려고''로 번역하여 예언의 성취를 전면에 드러냅니다.'
  alternative_readings:
  - '''완성하시려고'''
  - '''끝내시려고'''
  rationale: 이 구절은 역사가 예언의 실현으로 읽히는 점이 핵심이므로, 한국어에서도 단순 완료보다 성취·실현의 뉘앙스를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 루아흐(רוּחַ)와 왕의 내적 동기
  chosen_reading: '''고레스의 영''을 하나님의 주권 아래 움직이신 것으로 번역했습니다.'
  alternative_readings:
  - '''고레스의 마음'''
  - '''고레스의 속마음'''
  rationale: 원문이 רוח를 사용하므로 심리화된 '마음'보다 '영'이 더 직접적이며, 하나님의 주도적 개입도 분명히 드러납니다.
  doctrine_reference: DOCTRINE.md contested terms — רוּחַ
