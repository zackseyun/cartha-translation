  rationale: 예레미야를 통한 야훼의 말씀의 성취, 야훼께서 고레스의 영을 움직이신 일, 그리고 구두 포고와 서면 알림의 병행을 보존했습니다. 공적 선포를 문서 자체로 한정하는 표현과 원문에 없는 고레스에 대한 주체 높임을 바로잡았으며, 각주 표지와 신명 표기를 일관되게 정비했습니다.
