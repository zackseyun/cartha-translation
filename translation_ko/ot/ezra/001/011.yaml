  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'vessels' for 'articles.' The Hebrew term can refer broadly to utensils, vessels, or articles, especially temple objects.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'brought up' twice in this verse, reflecting the customary expression for going up to Jerusalem.
    reason: cultural_note
  - marker: c
    text: Or 'the exile community' or 'the deportees' for 'the exiles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 금과 은으로 된 모든 기물은 합계가 오천사백 개였습니다. 사릅바살이 그것들을 바벨론에서 예루살렘으로 올라오는 포로들과 함께 가져왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל כֵּלִים
  english_pob_choice: All the articles
  chosen_korean: 모든 기물
  alternatives_korean:
  - 모든 물건
  - 모든 그릇
  - 모든 기구
  lexicon: HALOT
  rationale: כֵּלִים은 넓게는 물건·그릇·기물을 가리키며, 성전 맥락에서는 단순한 용기보다 성전용 물품까지 포괄하므로 ‘기물’이 가장 무난합니다.
- source_word: לַזָּהָב וְלַכֶּסֶף
  english_pob_choice: of gold and silver
  chosen_korean: 금과 은으로 된
  alternatives_korean:
  - 금과 은의
  - 금과 은으로 만든
  lexicon: HALOT
  rationale: 앞의 ל는 재질 분류를 나타내므로, 한국어에서는 ‘~으로 된’이 가장 자연스럽고 원문의 분류 의미를 잘 살립니다.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  english_pob_choice: five thousand four hundred
  chosen_korean: 오천사백
  alternatives_korean:
  - 5,400
  - 오천 사백
  lexicon: HALOT
  rationale: 본문의 수량을 현대 한국어 서술체에 맞게 붙여 적어 간결하게 옮겼습니다.
- source_word: הֶעֱלָה / הֵעָלוֹת
  english_pob_choice: brought up / when they were brought up
  chosen_korean: 올라오는 / 가져왔습니다
  alternatives_korean:
  - 올라갈 때
  - 올려왔습니다
  - 데리고 올라왔습니다
  lexicon: HALOT
  rationale: עלה의 반복은 예루살렘으로 ‘올라감’이라는 관용을 반영하므로, 둘째 절의 동작과 결합해 ‘올라오는’과 ‘가져왔습니다’로 자연스럽게 살렸습니다.
- source_word: הַגּוֹלָה
  english_pob_choice: the exiles
  chosen_korean: 포로들
  alternatives_korean:
  - 포로 공동체
  - 귀환자들
  - 포로민들
  lexicon: HALOT
  rationale: 여기서는 바벨론에서 돌아오는 사람들을 가리키므로, ‘포로들’이 문맥상 직접적입니다. 다만 공동체 뉘앙스도 가능하나 본문 진행에는 사람 중심 표현이 더 분명합니다.
- source_word: שֵׁשְׁבַּצַּר
  english_pob_choice: Sheshbazzar
  chosen_korean: 사릅바살
  alternatives_korean:
  - 세스바살
  - 세스바차르
  - 쉐스바살
  lexicon: 표준 음역 관행
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역했습니다. 전통 교회 표기보다 원음 접근성을 우선했습니다.
theological_decisions:
- issue: 예루살렘으로의 ‘올라감’ 표현 보존
  chosen_reading: ‘올라오는’과 ‘올라왔습니다’의 상승 관용을 유지했습니다.
  alternative_readings:
  - 단순히 ‘가져왔습니다’
  - ‘예루살렘으로 갔을 때’
  rationale: 히브리어 עלה의 반복은 예루살렘을 향한 상승 관용을 드러내므로, 지리적 이동만으로 평평하게 만들지 않고 원문의 문학적·신학적 뉘앙스를 살렸습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: הַגּוֹלָה의 의미
  chosen_reading: 사람들을 가리키는 ‘포로들’로 옮겼습니다.
  alternative_readings:
  - 포로 공동체
  - 포로 신분
  - 유배
  rationale: 이 절에서는 추상적 상태보다 바벨론에서 돌아오는 사람들의 집단을 말하므로, 독자가 즉시 이해할 수 있는 사람 중심 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §6
