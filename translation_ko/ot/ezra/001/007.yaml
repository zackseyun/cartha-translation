  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the house of the LORD''; alternatively, ''the temple of the LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'had taken out of Jerusalem and placed in the house of his god.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바사 왕 고레스가 야훼의 집 기구들을 꺼냈습니다. 느부갓네살이 예루살렘에서 가져다가 자기 신의 집에 두었던 것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 직역이며, 문맥상 ‘성전’으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 느부갓네살이 예루살렘에서 가져간 뒤, 자기 신의 집에 둔 것이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  english_pob_choice: King Cyrus
  chosen_korean: 바사 왕 고레스
  alternatives_korean:
  - 고레스 왕
  - 왕 고레스
  lexicon: HALOT
  rationale: 히브리어의 ‘왕’과 고유명사를 한국어 왕호 관용에 맞게 자연스럽게 옮기되, 당시 역사적 통치 배경을 드러내기 위해 ‘바사 왕’을 덧붙였습니다.
- source_word: הוֹצִיא אֶת כְּלֵי
  english_pob_choice: brought out the vessels
  chosen_korean: 기구들을 꺼냈습니다
  alternatives_korean:
  - 그릇들을 꺼냈습니다
  - 기물들을 꺼냈습니다
  - 기구들을 밖으로 내놓았습니다
  lexicon: HALOT
  rationale: 성전 맥락의 כְּלֵי는 단순한 물건보다 제의용 ‘기구들’이 가장 자연스럽고, הוֹצִיא의 ‘끌어내다/꺼내다’ 의미를 살렸습니다.
- source_word: בֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집 곧 성전
  lexicon: HALOT
  rationale: 직역상 ‘집’을 유지해 מקור 표현을 보존했고, POB의 원칙에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: וַיִּתְּנֵם בְּבֵית אֱלֹהָיו
  english_pob_choice: had put in the house of his god
  chosen_korean: 자기 신의 집에 두었던 것들입니다
  alternatives_korean:
  - 자기 신의 집에 놓아두었던 것들입니다
  - 자기 신의 집에 넣어 두었던 것들입니다
  lexicon: HALOT
  rationale: ‘두다/놓아두다’는 נתן의 배치·보관 의미를 살리며, 뒤따르는 소유격 ‘자기 신’도 히브리어의 단수형을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥이 야훼의 집을 가리키므로, 인명적 표지를 가진 신명은 관용적 대체어보다 음역형 ‘야훼’로 드러내는 것이 본문 대비를 더 분명하게 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 느부갓네살이 넣어 둔 대상의 소유격
  chosen_reading: 자기 신
  alternative_readings:
  - 그의 신들
  - 자기들의 신들
  rationale: 히브리어는 단수형과 3인칭 남성 단수 소유격을 사용하므로, 복수화하지 않고 ‘자기 신’으로 옮겨 본문의 대비를 보존했습니다.
  doctrine_reference: 히브리어 원문 단수형 유지
