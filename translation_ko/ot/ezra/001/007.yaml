revisions:
- from: 바사 왕 고레스가 야훼의 집 기구들을 꺼냈습니다. 느부갓네살이 예루살렘에서 가져다가 자기 신의 집에 두었던 것들입니다.[a][b]
  to: 고레스 왕은 야훼의 집[a] 기구들을 꺼냈습니다. 이 기구들은 느부갓네살이 예루살렘에서 가져가 그의 신의 집에 두었던 것입니다.[b]
  rationale: 본문에 없는 ‘바사’를 삭제하고, 한국어 왕호 어순을 자연스럽게 조정했습니다. 두 번째 문장에서 선행사 ‘기구들’을 명시하여 관계절을 분명하게 했으며, 히브리어 단수 3인칭 소유격은 ‘그의 신’으로 유지했습니다. 각주 b는 원문의 반복 동사 הוֹצִיא에 대한 번역 대안을 제공하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:23Z'
