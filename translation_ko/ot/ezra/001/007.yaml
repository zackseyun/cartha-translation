  naturalness: ‘고레스 왕’ 및 ‘이 기구들은 … 두었던 것입니다’가 현대 표준어 합쇼체에서 자연스럽고, 원문의 선행사와 관계절 관계를 명확히 드러냅니다.
  terminology: ‘야훼’, ‘야훼의 집’, ‘기구들’, ‘그의 신’은 원문의 신명, 단수 소유격, 성전 기물의 의미를 무리 없이 반영합니다. ‘성전’은 가능한 해석이지만 본문에는 ‘집’을 유지합니다.
