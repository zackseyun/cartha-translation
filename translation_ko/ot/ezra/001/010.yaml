translation:
  language: ko
  text: 금 그릇 30개, 둘째 종류의 은 그릇 410개, 그리고 다른 그릇 1,000개였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은 그릇, 곧 둘셋으로 된 410개’. 여기서 ‘둘째 종류의’로 옮긴 히브리어는 문맥상 불확실하여, 두 번째 분류, 복제품, 또는 이중 형태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  english_pob_choice: bowls
  chosen_korean: 그릇
  alternatives_korean:
  - 사발
  - 대접
  - 바리
  lexicon: HALOT
  rationale: 문맥이 성전 기물 목록이므로 형태를 과도하게 특정하지 않는 포괄어 ‘그릇’이 자연스럽고, POB의 ‘bowls’에 대응하기에도 무리가 없습니다.
- source_word: זָהָב / כֶסֶף
  english_pob_choice: gold / silver
  chosen_korean: 금 / 은
  alternatives_korean:
