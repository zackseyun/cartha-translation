  text: כְּפוֹרֵ֤י זָהָב֙ שְׁלֹשִׁ֔ים כְּפ֤וֹרֵי כֶ֨סֶף֙ מִשְׁנִ֔ים אַרְבַּ֥ע מֵא֖וֹת וַ/עֲשָׂרָ֑ה כֵּלִ֥ים אֲחֵרִ֖ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/010.yaml
  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
  footnotes:
  - marker: a
    text: 'Or ''silver bowls, double: 410.'' The Hebrew term translated ''of a second kind'' is uncertain in this inventory context and may indicate a second class, duplicates, or a doubled form.'
    reason: lexical_alternative
translation:
  language: ko
  text: 금 그릇 30개, 두 번째 종류의 은 그릇 410개, 그 밖의 기물 1,000개였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 겹의 은 그릇 410개’. ‘두 번째 종류의’로 옮긴 히브리어는 이 목록에서 뜻이 확실하지 않아, 두 번째 부류, 짝을 이루는 그릇, 또는 두 겹의 형태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  english_pob_choice: bowls
  chosen_korean: 그릇
  alternatives_korean:
  - 사발
  - 대접
  - 바리
  lexicon: HALOT
  rationale: 문맥이 성전 기물 목록이므로 형태를 과도하게 특정하지 않는 포괄어 ‘그릇’이 자연스럽고, POB의 ‘bowls’에 대응하기에도 무리가 없습니다.
- source_word: זָהָב / כֶסֶף
  english_pob_choice: gold / silver
  chosen_korean: 금 / 은
  alternatives_korean:
  - 황금 / 은제
  - 금으로 된 / 은으로 된
  lexicon: HALOT
  rationale: 재료를 나타내는 단순 속성어이므로 한국어에서도 가장 직접적인 ‘금, 은’으로 옮기는 것이 목록형 기록에 적합합니다.
- source_word: מִשְׁנִים
  english_pob_choice: of a second kind
  chosen_korean: 둘째 종류의
  alternatives_korean:
  - 두 번째의
  - 이중의
  - 복제된
  lexicon: HALOT
  rationale: 어휘의 정확한 뜻이 이 문맥에서 불확실하므로, POB처럼 단정적으로 ‘double’이라 하지 않고 구분 표지로 읽히는 ‘둘째 종류의’로 옮겨 의미의 긴장을 보존했습니다.
- source_word: כֵּלִים אֲחֵרִים
  english_pob_choice: other vessels
  chosen_korean: 다른 그릇
  alternatives_korean:
  - 다른 기물
  - 다른 기구
  - 기타 그릇
  lexicon: HALOT
  rationale: ‘כֵּלִים’은 넓은 뜻의 기물/용기이지만, 앞의 그릇들과 같은 목록 안에서 자연스럽게 이어지도록 ‘그릇’으로 유지하고, ‘אֲחֵרִים’은 가장 직접적인 ‘다른’으로 처리했습니다.
