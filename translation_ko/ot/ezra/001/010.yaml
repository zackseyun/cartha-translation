  lexicon: HALOT
  rationale: 재료를 나타내는 단순 속성어이므로 한국어에서도 가장 직접적인 ‘금, 은’으로 옮기는 것이 목록형 기록에 적합합니다.
- source_word: מִשְׁנִים
  english_pob_choice: of a second kind
  chosen_korean: 둘째 종류의
