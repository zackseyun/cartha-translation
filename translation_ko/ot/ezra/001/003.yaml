id: EZR.1.3
reference: Ezra 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'and build the house of the LORD.' The Hebrew verb simply means 'build'; 'rebuild' makes explicit the restoration context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he is God who is in Jerusalem.' The Hebrew can be rendered more tersely, but the article favors 'the God.'
    reason: alternative_reading
translation:
  language: ko
  text: 여러분 가운데 누구든지 그의 모든 백성 중에 속한 사람은, 그의 하나님이 그와 함께하시기를 바라며, 예루살렘—유다에 있는—으로 올라가서 야훼의 집, 곧 이스라엘의 하나님이신 그분의 집을 다시 지으십시오. 그분은 예루살렘에 계신 하나님이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여러분 가운데 그의 모든 백성 중에 속한 사람은.’ 히브리어는 ‘누구든지’로 옮겨도 되며, 문맥상 초청형 의미가 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그분은 예루살렘에 계신 하나님이십니다.’ 히브리어는 더 간결하게도 옮길 수 있으나, 본문은 지역적 진술을 분명히 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  english_pob_choice: Whoever among all his people is among you
  chosen_korean: 여러분 가운데 누구든지 그의 모든 백성 중에 속한 사람은
  alternatives_korean:
  - 여러분 가운데 그의 모든 백성 중 누구든지
  - 여러분 가운데 모든 백성 중에 있는 누구든지
  lexicon: HALOT
  rationale: מִי는 여기서 질문이 아니라 초청형의 부정 대명사이므로 ‘누구든지’로 옮기고, ‘his people’의 3인칭 소유를 살려 ‘그의 모든 백성 중에’라고 표현했습니다.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  english_pob_choice: may his God be with him
  chosen_korean: 그의 하나님이 그와 함께하시기를 바라며
  alternatives_korean:
  - 그의 하나님이 그와 함께하시기를
  - 그의 하나님이 그와 함께하시길
  lexicon: HALOT
  rationale: יְהִי의 청유·축복 뉘앙스를 살려 ‘-시기를 바라며’로 옮겼고, 공적 칙령의 축복적 어조를 유지했습니다.
- source_word: וְיַעַל
  english_pob_choice: let him go up
  chosen_korean: 예루살렘으로 올라가서
  alternatives_korean:
  - 예루살렘으로 올라가십시오
  - 예루살렘으로 올라가
  lexicon: HALOT
  rationale: עלה의 예루살렘 향해 ‘올라가다’는 관용을 보존했고, 앞의 초청 구문에 이어지는 연속 동작으로 처리했습니다.
- source_word: וְיִבֶן אֶת בֵּית יְהוָה
  english_pob_choice: and rebuild the house of Yahweh
  chosen_korean: 야훼의 집을 다시 지으십시오
  alternatives_korean:
  - 야훼의 집을 지으십시오
  - 야훼의 집을 재건하십시오
  lexicon: HALOT
  rationale: 이 절은 포로귀환 맥락의 회복을 전제하므로 ‘build’의 문자성보다 ‘다시 지으십시오’가 역사적 의미를 더 분명히 드러냅니다. יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הוּא הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלִָם
  english_pob_choice: he is the God who is in Jerusalem
  chosen_korean: 그분은 예루살렘에 계신 하나님이십니다
  alternatives_korean:
  - 그분은 예루살렘에 계신 그 하나님이십니다
  - 그분은 예루살렘에 있는 하나님이십니다
  lexicon: HALOT
  rationale: 문법상 강한 정체성 진술을 살리면서, 로컬라이즈된 왕의 칙령 표현을 평이한 한국어로 유지했습니다. ‘계신’은 स्थान적 문맥을 자연스럽게 담습니다.
theological_decisions:
- issue: 이사야적/왕령적 문맥에서의 하나님의 이름 표기
  chosen_reading: יַהְוֶה를 ‘야훼’로 음역해 본문에 직접 반영했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 원문에 직접 나타나는 신명을 가리기보다 그대로 드러내는 편이 본문 증거를 더 충실히 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘그 하나님이 예루살렘에 계신다’는 지역적 진술의 보존
  chosen_reading: ‘그분은 예루살렘에 계신 하나님이십니다’로 유지했습니다.
  alternative_readings:
  - 그분은 하나님이십니다
  - 그분은 예루살렘에 계신 그 하나님이십니다
  rationale: 이 문장은 고대 왕의 칙령이 가진 역사적·지리적 표현을 담고 있으므로, 후대적 신학적 평준화 없이 locative force를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
