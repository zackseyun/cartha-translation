base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'wherever he resides' or 'wherever he sojourns.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the men of his place'; this may refer more broadly to the local inhabitants or neighbors.
    reason: lexical_alternative
  - marker: c
    text: Or 'assist him'; the Hebrew verb is literally 'lift/carry,' used here for giving practical support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 머무는 어느 곳에든 남아 있는 모든 사람은, 그 곳의 사람들이 은과 금과 재물과 가축으로 그를 도울지니, 예루살렘에 있는 하나님의 집을 위한 자원 제물도 함께 바쳐야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 머무는 어느 곳에든’은 ‘그가 거주하는 곳’ 또는 ‘그가 머무는 곳’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘그 곳의 사람들’은 문자적으로는 ‘그 곳의 남자들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘도울지니’는 문자적 의미인 ‘들어 올리다/짊어지다’를 문맥에 맞게 풀어낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנִּשְׁאָר
  english_pob_choice: And everyone who remains
  chosen_korean: 남아 있는 모든 사람
  alternatives_korean:
  - 남은 모든 사람
  - 머무는 모든 사람
  lexicon: HALOT
  rationale: נשׁאר의 분사적 의미를 살려 ‘남아 있는’으로 옮기고, 문맥상 귀환에 참여하지 않은 남은 자를 자연스럽게 드러냈습니다.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  english_pob_choice: in any place where he is living
  chosen_korean: 그가 머무는 어느 곳에든
  alternatives_korean:
  - 그가 사는 어느 곳에든
  - 그가 거주하는 어느 곳에서든
  lexicon: HALOT
  rationale: גּוּר는 ‘거주하다/머무르다/이주해 살다’의 뜻을 가지므로, 현대 한국어에서 자연스럽고 뜻을 넓게 담는 ‘머무는’으로 처리했습니다.
- source_word: יְנַשְּׂאֻהוּ
  english_pob_choice: let the men of his place support him
  chosen_korean: 그 곳의 사람들이 … 그를 도울지니
  alternatives_korean:
  - 그 곳의 사람들이 … 그를 받들지니
  - 그 곳의 사람들이 … 그를 지원할지니
  lexicon: HALOT
  rationale: 직역하면 ‘들어 올리다/짊어지다’이지만, 여기서는 물질적 지원의 관용적 의미이므로 ‘돕다’로 풀어 실제 행위를 드러냈습니다.
- source_word: בְּכֶסֶף וּבְזָהָב וּבִרְכּוּשׁ וּבִבְהֵמָה
  english_pob_choice: with silver and gold, with goods and with livestock
  chosen_korean: 은과 금과 재물과 가축으로
  alternatives_korean:
  - 은과 금과 소유물과 가축으로
  - 은과 금과 재산과 가축으로
  lexicon: HALOT
  rationale: כסף/זהב은 통상적인 금속 명칭을 유지하고, רכוש은 소유 재산의 넓은 범주를 살려 ‘재물’로, בהמה는 집합적 의미를 반영해 ‘가축’으로 옮겼습니다.
- source_word: עִם הַנְּדָבָה לְבֵית הָאֱלֹהִים
  english_pob_choice: together with the freewill offering for the house of God
  chosen_korean: 예루살렘에 있는 하나님의 집을 위한 자원 제물도 함께 바쳐야 합니다
  alternatives_korean:
  - 하나님의 집을 위한 자원 제물도 함께 가져야 합니다
  - 하나님의 집을 위한 자원 헌물도 함께 드려야 합니다
  lexicon: HALOT
  rationale: נדבה는 자원·자발적 헌납을 가리키므로 ‘자원 제물’로 옮겼고, 집합명사적 공헌의 성격을 한국어 동사 ‘바치다’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: אַנְשֵׁי מְקֹמוֹ의 성별 표지 유지
  chosen_reading: 그 곳의 사람들이
  alternative_readings:
  - 그 곳의 남자들이
  - 그 곳의 주민들이
  rationale: 히브리어는 문자적으로 남성 복수 표현이지만, 이 구절의 핵심은 지역 공동체의 실질적 지원이므로 한국어에서는 의미를 해치지 않는 범위에서 자연스러운 집합 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
