  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
  footnotes:
  - marker: a
    text: Or 'has charged me' to build a house for him.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple in Jerusalem.
    reason: cultural_note
translation:
  language: ko
  text: “바사 왕 고레스는 이렇게 말합니다. ‘하늘의 하나님 야훼께서 땅의 모든 나라를 내게 주셨고, 그분께서 나를 지명하여 예루살렘 — 곧 유다에 있는 곳 — 에 그분을 위한 집을 짓게 하셨습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘집’은 예루살렘 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 왕의 선포 공식으로서의 문체를 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי הַשָּׁמַיִם
  english_pob_choice: Yahweh, the God of heaven
  chosen_korean: 하늘의 하나님 야훼
  alternatives_korean:
  - 하늘의 하나님 여호와
  - 하늘의 하나님
  lexicon: HALOT
  rationale: 여기서는 여호와 대신 자료 규정에 따른 야훼를 사용해 고유한 신명성을 보존했고, אֱלֹהֵי הַשָּׁמַיִם은 ‘하늘의 하나님’으로 자연스럽게 옮겼습니다.
- source_word: פָקַד עָלַי
  english_pob_choice: has appointed me
  chosen_korean: 나를 지명하여
  alternatives_korean:
  - 나를 임명하여
  - 나에게 맡겨
  lexicon: HALOT
  rationale: פקד는 여기서 단순한 명령보다 특정 임무에 대한 지정·위임의 뉘앙스가 있어, ‘지명하여’가 가장 간결하게 그 의미를 살립니다.
- source_word: לִבְנוֹת לוֹ בַיִת
  english_pob_choice: to build a house for him
  chosen_korean: 그분을 위한 집을 짓게 하셨습니다
  alternatives_korean:
  - 그분을 위해 성전을 짓게 하셨습니다
  - 그분에게 집을 짓게 하셨습니다
  lexicon: HALOT
  rationale: 본문의 직역값인 ‘집’을 유지해 원문 어휘를 보존했고, 문맥상 성전임은 독자가 알 수 있도록 했습니다.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  english_pob_choice: in Jerusalem, which is in Judah
  chosen_korean: 예루살렘 — 곧 유다에 있는 곳 —
  alternatives_korean:
  - 유다에 있는 예루살렘
  - 예루살렘, 곧 유다에 있는 곳
  lexicon: HALOT
  rationale: 상대절의 지리적 설명을 유지하면서 한국어에서는 삽입구 형식으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: YHWH의 고유명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 칭호가 아니라 언약적 고유명으로 쓰였으므로, 프로젝트 기본값에 따라 야훼를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בַיִת의 번역
  chosen_reading: 집
  alternative_readings:
  - 성전
  rationale: 본문은 문자 그대로 ‘집’을 말하지만, 문맥상 성전을 가리키므로 본문에는 원어 어휘를 살리고 독자가 문맥을 파악하도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
