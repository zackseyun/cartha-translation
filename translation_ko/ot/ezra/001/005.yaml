  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'everyone whose spirit God had awakened' or 'everyone whom God had moved in spirit.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 유다와 베냐민의 조상들의 우두머리들과 제사장들과 레위 사람들, 곧 하나님이 그들의 영을 깨우신 모든 사람이 일어나 예루살렘에 있는 야훼의 집을 건축하러 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לִיהוּדָה וּבִנְיָמִן
  english_pob_choice: the heads of the fathers’ houses of Judah and Benjamin
  chosen_korean: 유다와 베냐민의 조상들의 우두머리들
  alternatives_korean:
  - 유다와 베냐민의 가문 우두머리들
  - 유다와 베냐민의 아버지 집들의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 족장/가문 단위 표현을 살리되, 한국어에서는 ‘조상들의 우두머리들’이 계보적 구조를 가장 직접적으로 드러냅니다.
- source_word: וַיָּק֜וּמוּ
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 떨쳐 일어났습니다
  lexicon: HALOT
  rationale: 응답하여 행동을 시작하는 동작을 자연스럽게 옮기면서도, 단순한 출발보다 넓은 서사적 개시를 유지합니다.
- source_word: הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  english_pob_choice: everyone whose spirit God had stirred
  chosen_korean: 하나님이 그들의 영을 깨우신
  alternatives_korean:
  - 하나님이 그들의 영을 흔드신
  - 하나님이 그들의 영을 움직이신
  lexicon: HALOT
  rationale: הֵעִיר의 ‘깨우다/일깨우다’ 의미를 살려, 외적 강제가 아니라 내적 촉발이라는 뉘앙스를 보존합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 전
  lexicon: HALOT
  rationale: 직역형인 ‘집’을 유지해 히브리어의 표현을 보존하고, 본문 자체의 명칭을 해치지 않도록 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명기를 포함한 본문에서 고유 신명은 ‘야훼’로 옮겨, 본문이 가진 언약명 자체를 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 하나님이 영을 ‘깨우신’ 표현의 의미
  chosen_reading: 내적 촉발을 나타내는 ‘깨우신’
  alternative_readings:
  - 감동하신
  - 영감을 주신
  rationale: 본문은 하나님이 사람들의 내부 의지를 움직이셨다고 말할 뿐, 그 방식을 더 강하게 규정하지 않습니다. ‘깨우신’은 그 긴장을 그대로 유지합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
