  lexicon: HALOT
  rationale: 직역형인 ‘집’을 유지해 히브리어의 표현을 보존하고, 본문 자체의 명칭을 해치지 않도록 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
