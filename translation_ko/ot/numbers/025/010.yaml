  text: 그때 야훼께서 모세에게 이렇게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH. 전통적으로는 ‘여호와’로 표기하거나 ‘주’로 옮기기도 하지만, 여기서는 음역형 ‘야훼’를 사용했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 말씀하셨습니다'
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어의 시간 부사 '그때'로 자연스럽게 살리고, דבר의 격식을 반영해 '말씀하셨습니다'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사형을 전통 대체어가 아니라 음역형 '야훼'로 옮겨, POB의 본문-주석 분리를 유지했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 을/를 향해
  - 께
  lexicon: HALOT
  rationale: 말의 수신자를 나타내는 전치사로서, 현대 표준어의 자연스러운 조사 '-에게'가 가장 직접적입니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르시되
  lexicon: HALOT
  rationale: 히브리어의 발화 도입 공식은 한국어에서 반복적으로 '말씀하셨습니다'로 자연스럽게 흡수할 수 있어, 별도의 '말하여' 구문보다 문맥상 간결합니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문에서는 야훼를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: יהוה를 인격적 신명으로 드러내기 위해 전통적 치환어보다 음역형을 택했습니다. 이는 POB의 일관된 명명 원칙을 따릅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
