review_pass:
  verdict: revise
  source_fidelity: 히브리어의 수여 공식(‘그와 그의 뒤를 이을 자손에게 … 언약이 될 것이다’), 제사장직의 지속성, 하나님을 위한 קנא의 열심, 그리고 이스라엘 자손을 위한 속죄를 모두 보존해야 합니다. 초안의 ‘그의 뒤의 그의 씨’는 זַרְעוֹ אַחֲרָיו를 기계적으로 옮겨 현대 한국어에서 부자연스럽고 의미 파악을 어렵게 합니다. קִנֵּא는 이 문맥에서 ‘질투하다’보다 ‘열심을 내다’가 한국어의 통상적 의미와 원문의 언약적 열심을 더 충실히 전달하며, ‘질투하다’ 가능성은 주석으로 보존할 수 있습니다.
  naturalness: ‘그와 그의 뒤를 이을 자손’이 승계 관계를 자연스럽고 정확하게 나타냅니다. ‘자기 하나님을 위하여 질투하였고’는 현대 표준 한국어에서 부자연스럽고 단순한 시기심으로 오해될 수 있으므로 ‘그의 하나님을 위하여 열심을 내었고’로 고칩니다. 각 주석 표지는 해당 어구 바로 뒤에 배치합니다.
  terminology: ‘언약’, ‘제사장직’, ‘속죄’, ‘이스라엘 자손’은 적절한 성경·신학 용어입니다. עוֹלָם의 해석 범위를 과도하게 단정하지 않도록 본문은 ‘영원한’을 유지하고, ‘영속하는’을 대안으로 제시합니다.
  issues:
  - severity: medium
    issue: ‘그의 뒤의 그의 씨에게’
    rationale: 현대 한국어에서 비문에 가깝고, ‘씨’는 여기서 사람들의 집합적 후손을 가리키는 말로 매우 부자연스럽습니다. ‘그의 뒤를 이을 자손에게’가 원문의 시간적·승계적 의미를 보존합니다.
  - severity: medium
    issue: ‘자기 하나님을 위하여 질투하였고’
    rationale: קנא는 하나님의 명예와 언약을 위한 열심을 뜻하며, 한국어 ‘질투하다’는 주로 개인적 시기심을 뜻합니다. 본문에는 ‘열심을 내다’를 사용하고 어휘적 대안은 주석으로 보존하는 편이 정확하고 자연스럽습니다.
  - severity: low
