- from: 그것은 그와 그의 뒤의 그의 씨에게 영원한 제사장직의 언약이 될 것입니다. 이는 그가 자기 하나님을 위하여 질투하였고 이스라엘 자손을 위하여 속죄하였기 때문입니다.[a][b][c]
  to: 그것은 그와 그의 뒤를 이을 자손에게 영원한 제사장직의 언약이 될 것입니다.[b] 이는 그가 그의 하나님을 위하여 열심을 내었고[a] 이스라엘 자손을 위하여 속죄하였기 때문입니다.[c]
  rationale: 자연스럽지 않은 직역 표현을 현대 표준어로 바로잡되, 후손의 승계, 언약, 제사장직의 지속성, 속죄라는 원문의 핵심 요소를 유지했습니다. קנא의 ‘질투/열심’ 의미 범위는 본문과 주석의 조합으로 보존했고, 모든 주석 표지를 해당 어구에 연결했습니다.
