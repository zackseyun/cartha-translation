id: NUM.25.13
reference: Numbers 25:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'zealous for his God.' The Hebrew verb can express covenant jealousy or zeal.
    reason: lexical_alternative
  - marker: b
    text: Or 'an everlasting priesthood.'
    reason: alternative_reading
  - marker: c
    text: '''Sons of Israel'' is the traditional Hebrew national designation and refers to the people of Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 그것은 그와 그의 뒤를 이을 자손에게 영원한 제사장직의 언약이 될 것입니다.[b] 이는 그가 그의 하나님을 위하여 열심을 내었고[a] 이스라엘 자손을 위하여 속죄하였기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 하나님을 위하여 질투하였고’. 히브리어 동사는 언약적 질투 또는 열심을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영속하는 제사장직’.
    reason: alternative_reading
  - marker: c
    text: ‘이스라엘 자손’은 히브리어의 전통적 민족 명칭이며, 이스라엘 백성을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: It shall be
  chosen_korean: 그것은 … 될 것입니다
  alternatives_korean:
  - 그리고 그것은 … 될 것입니다
  - 그것은 … 되겠습니다
  lexicon: HALOT
  rationale: 문맥상 앞의 약속/언약 진술을 받는 결과 절이므로 미래 서술형으로 자연스럽게 옮겼습니다. 주어는 한국어에서 문맥상 ‘그것’으로 받는 것이 가장 명료합니다.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  english_pob_choice: for him and for his offspring after him
  chosen_korean: 그와 그의 뒤의 그의 씨에게
  alternatives_korean:
  - 그와 그 뒤의 그의 후손에게
  - 그와 그의 뒤의 그의 자손에게
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리기 위해 ‘씨’를 유지했습니다. ‘after him’은 직역해 ‘그의 뒤의’로 두어 승계의 시간을 드러냈습니다.
- source_word: כְּהֻנַּת עוֹלָם
  english_pob_choice: a perpetual priesthood
  chosen_korean: 영원한 제사장직
  alternatives_korean:
  - 영속하는 제사장직
  - 끝없는 제사장직
  lexicon: HALOT
  rationale: 한국어에서는 직분의 성격을 나타내는 ‘제사장직’이 자연스럽고, עוֹלָם은 언약적 지속성을 살려 ‘영원한’으로 옮겼습니다.
- source_word: קִנֵּא לֵאלֹהָיו
  english_pob_choice: he was jealous for his God
  chosen_korean: 그가 자기 하나님을 위하여 질투하였고
  alternatives_korean:
  - 그가 자기 하나님을 위하여 열심을 내었고
  - 그가 자기 하나님을 위하여 열정적으로 수호하였고
  lexicon: HALOT
  rationale: POB의 ‘jealous’ 선택을 따라 covenantal jealousy의 긴장을 살렸습니다. 한국어 ‘질투하다’는 다소 거칠 수 있지만, 본문이 요구하는 강한 배타적 열심을 가장 직접적으로 드러냅니다.
- source_word: וַיְכַפֵּר
  english_pob_choice: made atonement
  chosen_korean: 속죄하였기 때문입니다
  alternatives_korean:
  - 속죄를 이루었기 때문입니다
  - 속죄 제사를 드렸기 때문입니다
  lexicon: HALOT
  rationale: 제사장적/속죄적 문맥을 반영해 표준적인 ‘속죄하다’를 사용했습니다. 행위의 결과를 간결하게 연결하기 위해 이유절 안에 배치했습니다.
theological_decisions:
- issue: קִנֵּא의 정서적 뉘앙스와 covenantal zeal 보존
  chosen_reading: ‘질투하였고’로 유지하여, 단순한 감정이 아니라 하나님의 영예를 지키는 언약적 열심을 드러냈습니다.
  alternative_readings:
  - ‘열심을 내었고’
  - ‘질투하여 맹렬히 대항했고’
  rationale: 히브리어 קנא의 의미 범위는 질투와 열심을 모두 포함하지만, POB가 유지한 긴장을 한국어에서도 보존하는 것이 중요합니다. 독자가 부정적 감정으로만 오해하지 않도록 문맥 전체가 그 배경을 규정합니다.
  doctrine_reference: Translation philosophy §§3, 5
- issue: עוֹלָם의 범위
  chosen_reading: ‘영원한’으로 옮겨, 제사장직의 지속성과 언약적 확정성을 함께 드러냈습니다.
  alternative_readings:
  - ‘영속하는’
  - ‘끝없는’
  rationale: 히브리어 עוֹלָם은 맥락에 따라 ‘오래 지속되는’ 또는 ‘영원한’의 범위를 가질 수 있으나, 이 절은 하나님이 주시는 직분의 공적 보증을 말하므로 더 강한 지속성을 허용합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
