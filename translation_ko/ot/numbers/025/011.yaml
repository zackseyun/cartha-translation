id: NUM.25.11
reference: Numbers 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
  footnotes:
  - marker: a
    text: Or 'by being zealous with my zeal ... in my zeal.' The Hebrew uses cognate forms of the same root for Phinehas's action and God's response.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들, 제사장 엘르아살의 아들 비느하스가 그들 가운데에서 내 질투로 질투하여 이스라엘 자손에게서 내 진노를 돌이켜 놓았으므로, 내가 내 질투로 이스라엘 자손을 멸하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 열심으로 열심을 내어 … 내 열심 안에서’. 히브리어는 비느하스의 행동과 하나님의 반응에 같은 어근의 말을 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  english_pob_choice: has turned back
  chosen_korean: 돌이켜 놓았으므로
  alternatives_korean:
  - 돌이켰으므로
  - 물리쳤으므로
  - 거두어 가셨으므로
  lexicon: HALOT
  rationale: 히필의 ‘되돌리다/돌려 놓다’라는 사역적 의미를 살리면서, 진노가 이스라엘에게서 멀어지게 된 결과를 자연스럽게 표현했습니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 진노
  alternatives_korean:
  - 내 분노
  - 내 노여움
  lexicon: HALOT
  rationale: חֵמָה의 강한 심판적 분노를 한국어 ‘진노’로 옮겨, 단순한 감정 분노보다 더 무거운 뉘앙스를 살렸습니다.
- source_word: בְּקַנְאוֹ אֶת קִנְאָתִי
  english_pob_choice: by being jealous with my jealousy
  chosen_korean: 내 질투로 질투하여
  alternatives_korean:
  - 내 열심으로 열심을 내어
  - 내 열심으로 질투하여
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서도 드러내기 위해 ‘질투’와 ‘질투하다’를 대응시켰습니다. ‘열심’은 가능하지만, 본문이 의도적으로 만드는 어휘적 연결이 약해집니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데에서
  alternatives_korean:
  - 그들 한가운데서
  - 그들 가운데
  lexicon: HALOT
  rationale: 공동체 내부에서 일어난 행동임을 드러내면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: בְּקִנְאָתִי
  english_pob_choice: in my jealousy
  chosen_korean: 내 질투
  alternatives_korean:
  - 내 열심
  - 내 질투 가운데
  lexicon: HALOT
  rationale: 앞의 표현과 일관되게 같은 어근을 유지해, 비느하스의 행위와 하나님의 반응 사이의 어휘적 평행을 보존했습니다.
theological_decisions:
- issue: קנא 어휘를 ‘질투’로 유지할지 ‘열심’으로 완화할지
  chosen_reading: ‘질투’로 일관되게 번역합니다.
  alternative_readings:
  - ‘열심’으로 번역합니다.
  - ‘열심/질투’로 혼합 번역합니다.
  rationale: 본문은 비느하스의 행동과 하나님의 반응을 같은 어근으로 연결합니다. 이를 ‘열심’으로 바꾸면 이 신학적·수사적 연결이 약해지므로, 다소 거칠어도 ‘질투’로 유지했습니다.
  doctrine_reference: Translation philosophy items 3 and 5
