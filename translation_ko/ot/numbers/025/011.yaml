  rationale: 아론이 ‘제사장’으로 수식됨을 명확히 하여 히브리어 계보 구문을 바로잡았습니다. 진노를 ‘돌이켰다’로 자연스럽게 옮겼고, קנא 어근의 수사적 반복은 ‘질투심으로 질투하여’ 및 ‘질투심으로’로 보존했습니다. 열심/질투의 유효한 어휘 대안은 각주에 남겼습니다.
