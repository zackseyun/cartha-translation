  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
  footnotes:
  - marker: a
    text: Or 'began to commit sexual immorality with the daughters of Moab'; Hebrew 'began to play the prostitute with the daughters of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 싯딤에 머무는 동안, 백성이 모압의 딸들과 함께 자신을 창녀처럼 굴기 시작했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 딸들과 성적 부정을 저지르기 시작했습니다’로 옮길 수 있습니다. 히브리어는 ‘모압의 딸들과 창녀처럼 행하기 시작했습니다’라는 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: was staying
  chosen_korean: 머무는 동안
  alternatives_korean:
  - 거주하던 동안
  - 머물고 있을 때
  - 머무르던 중
  lexicon: HALOT
  rationale: ישׁב는 여기서 정착보다 임시 체류의 뉘앙스가 강하므로, 이스라엘의 야영 상태를 자연스럽게 살리는 ‘머무는 동안’이 적절합니다.
- source_word: בַּשִּׁטִּים
  english_pob_choice: at Shittim
  chosen_korean: 싯딤에
  alternatives_korean:
  - 싯딤에서
  - 싯딤 가운데
  - 싯딤에 있는
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, 장소 표현은 한국어에서 자연스러운 ‘-에’로 처리했습니다.
- source_word: לִזְנוֹת
  english_pob_choice: to prostitute themselves
  chosen_korean: 자신을 창녀처럼 굴기 시작했습니다
  alternatives_korean:
  - 음행을 저지르기 시작했습니다
  - 성적 부정을 저지르기 시작했습니다
  - 창녀처럼 행하기 시작했습니다
  lexicon: HALOT
  rationale: זנה의 직설적이고 수치적인 힘을 살리되, 한국어에서 지나치게 딱딱한 직역보다 ‘창녀처럼 굴다’가 행위의 모욕성과 비유적 강도를 함께 전달합니다.
- source_word: בְּנוֹת מוֹאָב
  english_pob_choice: the daughters of Moab
  chosen_korean: 모압의 딸들과
  alternatives_korean:
  - 모압의 딸들와
  - 모압의 여자들과
  - 모압 여인들과
  lexicon: HALOT
  rationale: 히브리어의 표현을 최대한 보존하기 위해 직역형을 택했으며, POB의 ‘with’ 해석에 맞춰 한국어 조사도 함께 조정했습니다.
theological_decisions:
- issue: זנה의 강한 도덕·언약적 성격을 어떻게 드러낼 것인가
  chosen_reading: 완곡한 ‘부정을 저지르다’보다, 수치와 성적 타락을 드러내는 표현을 사용했습니다.
  alternative_readings:
  - 성적 부정을 저지르기 시작했습니다
  - 음행을 저지르기 시작했습니다
  rationale: 이 동사는 단순한 일반적 도덕 실패보다 더 날카로운 성적·언약적 배교의 이미지를 담으므로, 의미를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
