  source_fidelity: 히브리어 זנה는 여기서 모압의 딸들과 관련된 성적 음행을 가리키며, ‘음행을 저지르다’는 이를 정확히 옮깁니다. 원문의 시작 동사 וַיָּחֶל(‘시작했다’)도 보존했습니다. 다만 초안의 ‘자신을 창녀처럼 굴다’는 한국어 어법상 부자연스럽고, 재귀 목적어 ‘자신을’이 원문에 없는 의미를 덧붙입니다.
  naturalness: ‘이스라엘이 싯딤에 머물러 있을 때’와 ‘음행을 저지르기 시작했습니다’는 현대 표준 한국어의 공식적 성경 문체에 자연스럽습니다. ‘모압의 딸들과’는 원문의 표현을 유지하면서도 문맥상 자연스럽습니다.
