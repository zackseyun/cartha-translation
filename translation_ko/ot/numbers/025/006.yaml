base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'to his kinsmen' or 'to his fellow Israelites.' The Hebrew reads 'to his brothers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Midianite'; English idiom often uses 'a Midianite woman' when introducing her into the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이스라엘 자손 가운데 한 사람이 와서 자기 형제들에게[a] 미디안 여인[b]을 데려왔습니다. 그는 모세가 보는 앞과 이스라엘 자손의 온 회중이 보는 앞에서 그렇게 했습니다. 온 회중은 회막 어귀에서 울고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 형제들에게’입니다. 문맥상 ‘친족들에게’ 또는 ‘동료 이스라엘 사람들에게’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 미디안 여인’입니다. 이야기에서 처음 등장하는 인물이므로 한국어에서는 관사를 따로 옮기지 않았습니다.
    reason: lexical_alternative
