  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'to his kinsmen' or 'to his fellow Israelites.' The Hebrew reads 'to his brothers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Midianite'; English idiom often uses 'a Midianite woman' when introducing her into the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이스라엘 자손 가운데 한 사람이 와서 자기 형제들에게 미디안 여인을 데려왔는데, 모세와 이스라엘 자손의 온 회중이 보는 앞에서 그들이 회막 어귀에서 울고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 형제들/형제들에게’입니다. 문맥상 ‘친족들’ 또는 ‘동료 이스라엘 사람들’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 미디안 여자/미디안 여인’입니다. 한국어에서는 도입되는 인물을 자연스럽게 드러내기 위해 ‘한’에 해당하는 표현을 보완할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 서술 흐름을 급작스럽게 전환하며 주의를 끄는 감탄/지시 표현을 한국어의 직접적인 호소형으로 옮겼습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손 가운데 한 사람이
  alternatives_korean:
  - 이스라엘 사람들 가운데 한 사람이
  - 이스라엘의 아들들 가운데 한 사람이
  lexicon: HALOT
  rationale: 남성 복수 표현의 집단 소속을 살리면서도 한국어에서는 자연스럽게 읽히도록 ‘가운데 한 사람’으로 풀었습니다.
- source_word: וַיַּקְרֵב אֶל אֶחָי/ו
  english_pob_choice: brought near to his brothers
  chosen_korean: 자기 형제들에게 데려왔는데
  alternatives_korean:
  - 자기 형제들에게 가까이 데리고 왔는데
  - 자기 형제들에게 가져왔는데
  - 자기 친족들에게 데려왔는데
  lexicon: HALOT
  rationale: קרב의 ‘가까이 오게 하다’라는 강한 동작을 살리되, 한국어에서는 대상 앞에 끌어다 놓는 행위를 드러내는 ‘데려오다’가 가장 자연스럽습니다.
- source_word: הַמִּדְיָנִית
  english_pob_choice: a Midianite woman
  chosen_korean: 미디안 여인
  alternatives_korean:
  - 미디안 여자
  - 미디안 사람 여자
  - 미디안 여인 한 사람
  lexicon: HALOT
  rationale: 히브리어의 여성형 형용사를 인물 지칭 명사처럼 처리한 표현을 따라, 간결하게 ‘미디안 여인’으로 옮겼습니다.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  english_pob_choice: before the eyes of ... and before the eyes of
  chosen_korean: '...이 보는 앞에서'
  alternatives_korean:
  - '...의 눈앞에서'
  - '...이 보는 데서'
  - '...이 지켜보는 가운데'
  lexicon: HALOT
  rationale: 반복된 관용구를 한국어에서 중복이 과하지 않도록 ‘보는 앞에서’로 유지해 공개적이고 노골적인 행위를 드러냈습니다.
theological_decisions:
- issue: عֲדַת בְּנֵי יִשְׂרָאֵל의 공동체 표지
  chosen_reading: ‘이스라엘 자손의 온 회중’으로 공동체적·예배적 모임의 뉘앙스를 보존했습니다.
  alternative_readings:
  - 이스라엘 자손의 온 집회
  - 이스라엘 온 회중
  - 이스라엘 자손의 모든 모임
  rationale: עֵדָה는 단순 군중이 아니라 소집된 언약 공동체를 가리키므로, 한국어에서도 ‘회중’을 유지하는 것이 문맥에 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
