    rationale: 이 분사는 ‘맞다/쳐서 쓰러뜨리다’에서 온 수동형이며, 바로 앞 문맥에서 여자가 살해된 사실을 가리킵니다. ‘치워진’은 제거·정리의 뜻으로 바뀝니다.
  - severity: medium
    issue: ‘스르’ 및 ‘코즈비’는 한국어 성경의 통용 표기와 다릅니다.
    rationale: 한국어 고유명사 표기의 일관성과 독자 인지성을 위해 ‘수르’, ‘고스비’가 적절합니다.
  - severity: medium
    issue: 수르가 우두머리였다는 문법적 관계가 불분명하고 친족 용어가 부자연스럽습니다.
    rationale: 히브리어 הוּא는 수르를 다시 가리킵니다. ‘부계 가문’과 ‘씨족들’을 사용하면 관계와 사회적 배경을 더 명료하게 드러낼 수 있습니다.
