revisions:
- from: 그리고 치워진 미디안 여자의 이름은 코즈비, 즉 미디안에서 한 아버지의 집안 족장인 스르의 딸이었다.
  to: 또 죽임을 당한 그 미디안 여자의 이름은 미디안에 있는 한 부계 가문[b]의 씨족들[a]의 우두머리였던 수르의 딸 고스비였습니다.
  rationale: 문맥상 살해된 여자를 가리키는 수동분사를 정확히 반영하고, 수르의 지도자 지위와 부계 친족 집단의 관계를 현대 표준 한국어로 분명히 했습니다. אֻמּוֹת의 ‘민족들/씨족들’ 어의 가능성은 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:40:06Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘치워진’은 נכה의 수동분사 הַמֻּכָּה(문맥상 죽임을 당한)를 충실히 옮기지 못합니다. 또한 ‘스르’는 통용 음역 ‘수르’로 고치는 것이 적절하며, 수르가 미디안의 부계 가문에 속한 씨족들의 우두머리였다는 수식 관계를 분명히 해야 합니다.
  naturalness: ‘한 아버지의 집안 족장’은 현대 한국어에서 어색하고 구조가 불명확합니다. ‘한 부계 가문의 씨족들의 우두머리’는 고대 친족 집단이라는 뜻을 비교적 자연스럽게 전달합니다.
  terminology: 고유명사는 ‘고스비’, ‘수르’로 표기했습니다. בֵּית אָב는 ‘부계 가문’으로, אֻמּוֹת는 문맥상 ‘씨족들’로 옮기되 가능한 다른 어의를 각주로 보존했습니다.
