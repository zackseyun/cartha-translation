translation:
  language: ko
  text: 그리고 그 재앙 뒤에였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그 재앙 뒤에였습니다
  alternatives_korean:
  - 그리고 그런 일이 있었습니다
  - 그리고 일어난 것은
  lexicon: HALOT
  rationale: 서사 전환 सूत्र인 וַיְהִי의 기능을 살려, 자연스러운 현대 한국어로 사건의 연결을 표시했습니다. ‘그리고’와 ‘-뒤에였습니다’는 짧은 전환 구문을 살리면서도 문어체를 유지합니다.
- source_word: אַחֲרֵי
  english_pob_choice: after
  chosen_korean: 뒤에
  alternatives_korean:
  - 후에
  - 이후에
  lexicon: HALOT
  rationale: 시간 순서를 직접적으로 나타내는 말이므로 ‘뒤에’로 옮겼습니다. 본문의 간결한 접속 관계를 가장 짧고 분명하게 드러냅니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 전염병
  - 그 염병
  - 그 역병
  lexicon: HALOT
  rationale: 문맥상 단순한 질병보다 하나님의 심판으로 인한 재난의 뉘앙스가 강하므로 ‘재앙’으로 옮겼습니다. 한국 교회어의 ‘전염병/역병’보다 원문의 심판적 분위기를 더 직접적으로 드러냅니다.
theological_decisions:
- issue: מַגֵּפָה의 심판성
  chosen_reading: ‘재앙’으로 번역해 하나님의 징계/심판의 성격을 드러냈습니다.
  alternative_readings:
  - 전염병
  - 역병
  rationale: 민수기 25장의 문맥에서 מַגֵּפָה는 단순 의학적 질병보다 하나님께서 내리신 심판적 재난을 가리키므로, 그 신학적 뉘앙스를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 민수기 25장 문맥상 언약 백성에 대한 하나님의 징계
