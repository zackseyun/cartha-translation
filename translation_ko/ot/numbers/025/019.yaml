  terminology: ‘재앙’은 מַגֵּפָה의 문맥적 의미를 무리 없이 전달합니다. 하나님의 심판이라는 해석을 본문 단어 자체에 확정적으로 부가하지 않으며, 본문에는 신적 행위자를 명시하지 않습니다.
