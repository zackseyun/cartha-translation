    rationale: 히브리어 הַנִּצְמָדִים는 ‘붙어 있는/결속되어 있는 자들’이라는 참여사입니다. ‘붙어 간’은 완료된 이동처럼 들리고 현대 한국어에서도 어색합니다.
  - severity: medium
    issue: 각주 a가 본문과 동일한 표현을 반복함
    rationale: 본문의 ‘바알 브올’에 대해 각주도 ‘바알 브올’을 제시하여 lexical alternative 각주가 되지 않습니다. 본문을 ‘브올의 바알’로 옮기고 대안 표기를 각주에 제시하면 영어 POB의 대안 관계를 반영할 수 있습니다.
  revised_text: 모세가 이스라엘의 재판관들에게 말했습니다. 「너희는 각자 자기에게 속한 남자들 가운데 브올의 바알에게[a] 붙어 있는 자들을 죽이십시오.」
