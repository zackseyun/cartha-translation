- from: 모세가 이스라엘의 재판관들에게 말했습니다. 「너희는 각자 자기에게 속한 남자들, 곧 바알 브올에 붙어 간 자들을 죽이십시오.」[a]
  to: 모세가 이스라엘의 재판관들에게 말했습니다. 「너희는 각자 자기에게 속한 남자들 가운데 브올의 바알에게[a] 붙어 있는 자들을 죽이십시오.」
  rationale: 참여사의 지속적 결속 의미를 ‘붙어 있는’으로 바로잡았습니다. 또한 신칭을 본문에서는 히브리어 관계 구문에 가깝게 ‘브올의 바알’로 번역하고, 전통적 결합형 ‘바알 브올’을 실제 대안으로 각주에 제시하여 중복 각주를 해소했습니다.
