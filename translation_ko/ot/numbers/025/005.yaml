  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
  footnotes:
  - marker: a
    text: Or “Baal-peor.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally reads “kill, each man, his men,” meaning each judge was to put to death the men under his authority who had attached themselves to Baal of Peor.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 이스라엘의 재판관들에게 말했습니다. 「너희는 각자 자기에게 속한 남자들 가운데 브올의 바알에게[a] 붙어 있는 자들을 죽이십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바알 브올에게”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  english_pob_choice: judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판관들
  - 지도자들
  - 관리들
  lexicon: HALOT
  rationale: שׁפט는 여기서 이스라엘 안에서 사법·통치 권한을 가진 사람들을 가리키므로, 직역에 가깝고 기능을 드러내는 ‘재판관들’이 가장 적절합니다.
- source_word: הִרְגוּ
  english_pob_choice: must kill
  chosen_korean: 죽이십시오
  alternatives_korean:
  - 반드시 죽이십시오
  - 처형하십시오
  - 죽이라
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접성을 살리되, 한국어 본문에서는 합쇼체 명령으로 자연스럽게 옮겼습니다. 원문 자체에 ‘처형’의 제도적 뉘앙스가 명시되지는 않으므로 본문에는 넣지 않았습니다.
- source_word: אִישׁ אֲנָשָׁיו
  english_pob_choice: Each of you ... his men
  chosen_korean: 각자 자기에게 속한 남자들
  alternatives_korean:
  - 각자 그의 남자들을
  - 각 사람이 자기 사람들을
  - 각자 자기 부하들을
  lexicon: HALOT
  rationale: 문자적으로는 ‘한 사람, 그의 남자들’이라는 분배구문이므로, 각 재판관이 자기 권한 아래 있는 남자들을 다루라는 뜻을 한국어로 자연스럽게 살렸습니다.
- source_word: לְבַעַל פְּעֹר
  english_pob_choice: to Baal of Peor
  chosen_korean: 바알 브올에
  alternatives_korean:
  - 바알 브올에게
  - 브올의 바알에게
  - 바알-브올에게
  lexicon: HALOT
  rationale: 이 표현은 ‘브올과 관련된 바알’이라는 신칭을 가리키므로, 전통적으로 알려진 고유명 형태를 살리면서도 관계를 드러내는 ‘바알 브올’로 옮겼습니다.
theological_decisions:
- issue: 폭력 명령의 제시 방식
  chosen_reading: 원문의 급박하고 단호한 명령을 그대로 살려, 본문에서 그 강도를 완화하거나 법적 절차 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 처벌하라로 완화
  - 재판에 회부하라로 해석
  rationale: 이 절은 우상숭배에 대한 즉각적인 처단 명령을 직접 말할 뿐, 절차나 신학적 해설을 제공하지 않습니다. 따라서 본문은 명령의 무게를 그대로 전달해야 합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
