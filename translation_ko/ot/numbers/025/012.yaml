  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: ko
  text: 그러므로 말하십시오. ‘보십시오, 나는 그에게 내 평화의 언약을 주고 있습니다.’
  philosophy: formal
lexical_decisions:
- source_word: לָכֵן / Therefore
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그런즉
  lexicon: לכן
  rationale: 인과 관계를 분명히 드러내는 접속사로, 문맥의 선언적 흐름을 자연스럽게 유지합니다.
- source_word: הִנְנִי / Look, I
  english_pob_choice: Look, I
  chosen_korean: 보십시오, 나는
  alternatives_korean:
  - 보라, 나는
  - 보세요, 나는
  lexicon: הנני
  rationale: POB의 ‘Look’에 맞춰 주의를 환기하는 감탄을 살리되, 한국어 합쇼체에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: בְּרִיתִי שָׁלוֹם / my covenant of peace
  english_pob_choice: my covenant of peace
  chosen_korean: 내 평화의 언약
  alternatives_korean:
  - 내 평강의 언약
  - 내 화평의 언약
  lexicon: ברית שלום
  rationale: 언약 구조를 보존하면서 שָׁלוֹם의 기본 의미를 ‘평화’로 옮겨, POB의 ‘peace’와 대응시켰습니다.
theological_decisions:
- issue: שָׁלוֹם의 번역어
  chosen_reading: ‘평화’로 번역했습니다.
  alternative_readings:
  - 평강
  - 화평
  rationale: 이 구절의 핵심은 하나님이 주시는 관계적 평화와 언약적 안정이며, 본문과 POB의 영어 표현을 직접 반영하는 ‘평화’가 가장 투명합니다.
  doctrine_reference: 언약과 샬롬의 관계에 대한 구약 신학
