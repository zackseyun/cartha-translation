  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
  footnotes:
  - marker: a
    text: Or 'saw this.' The Hebrew simply says 'saw,' with the object implied by the preceding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'from among the congregation' or 'from the assembly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비느하스는 엘르아살의 아들이요, 제사장 아론의 손자인데, 그것을 보고 회중 한가운데에서 일어나 손에 창을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것’은 바로 앞 문맥에서 암시된 대상을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘회중 한가운데에서’는 ‘회중 가운데에서’ 또는 ‘회중 속에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw it
  chosen_korean: 그것을 보고
  alternatives_korean:
  - 보고
  - 그것을 보았습니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘보다’이지만, 바로 앞 문맥의 행위를 가리키는 암시된 목적어를 한국어에서는 ‘그것을’로 드러내어 문맥 연계를 분명히 했습니다.
- source_word: הָעֵדָה
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 총회
  - 모임
  - 공동체
  lexicon: HALOT
  rationale: 광야 서사의 공동체를 가리키는 עֵדָה를 기관적 교회 뜻을 피하면서도 ‘회중’으로 자연스럽게 옮겼습니다.
- source_word: רֹמַח
  english_pob_choice: a spear
  chosen_korean: 창
  alternatives_korean:
  - 창끝이 달린 무기
  - 창槍
  - 창자루
  lexicon: HALOT
  rationale: רֹמַח은 창 또는 창 계열 무기를 가리키므로, 현대 한국어에서 가장 자연스럽고 일반적인 대응인 ‘창’을 택했습니다.
theological_decisions:
- issue: יָּקָם의 동작 강도
  chosen_reading: ‘일어났습니다’로 즉각적이고 결단적인 행동을 살렸습니다.
  alternative_readings:
  - ‘일어났습니다’보다 완곡하게 ‘몸을 일으켰습니다’로 옮김
  - ‘일어나 섰습니다’로 옮김
  rationale: 문맥상 단순 기립이 아니라 공동체 한가운데서의 결단적 행동 전환이므로, 동사의 서사적 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: 서사적 충실성 원칙
