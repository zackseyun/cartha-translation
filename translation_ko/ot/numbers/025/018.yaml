id: NUM.25.18
reference: Numbers 25:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
  footnotes:
  - marker: a
    text: Peor refers to the incident involving Baal-peor described earlier in the chapter.
    reason: cross_reference
  - marker: b
    text: Or 'by their wiles' / 'through their treachery.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'their sister,' likely meaning a woman of their own people or kin-group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 여러분에게 대적하는 자들입니다. 그들은 그들의 꾀로, 곧 여러분을 미혹하여 페올 사건에서, 그리고 미디안의 한 지도자의 딸이요 그들의 자매인 코즈비 사건에서 여러분을 속였고, 그녀는 페올 사건 때문에 내린 재앙의 날에 죽임을 당했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘페올’은 앞 장에 나오는 바알-브올 사건을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그들의 술책으로’ / ‘그들의 배신으로’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그들의 자매’로, 같은 민족이나 친족 집단의 여성을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  english_pob_choice: are hostile
  chosen_korean: 대적하는 자들입니다
  alternatives_korean:
  - 적대하는 자들입니다
  - 원수들입니다
  lexicon: HALOT
  rationale: 현재적·지속적 적대관계를 나타내므로 단순 서술보다 ‘대적하는’으로 동사성을 살렸습니다.
- source_word: בְּנִכְלֵיהֶם / נִכְּלוּ
  english_pob_choice: through their schemes / they deceived
  chosen_korean: 그들의 꾀로, 곧 … 속였고
  alternatives_korean:
  - 그들의 간계로
  - 그들의 술수로
  lexicon: HALOT
  rationale: 명사와 동사가 어근을 공유하는 점을 살려 ‘꾀’와 ‘속이다’로 대응시켜, 기만의 도구성과 행위를 함께 드러냈습니다.
- source_word: עַל דְּבַר פְּעוֹר
  english_pob_choice: in the matter of Peor / because of the matter of Peor
  chosen_korean: 페올 사건에서
  alternatives_korean:
  - 페올 일에 관하여
  - 페올 때문에
  lexicon: HALOT
  rationale: 반복되는 관용구를 한국어에서 자연스러운 서술로 풀되, 본문에서 가리키는 역사적 사건성을 살리기 위해 ‘사건’으로 옮겼습니다.
- source_word: בַת נְשִׂיא מִדְיָן
  english_pob_choice: the daughter of a leader of Midian
  chosen_korean: 미디안의 한 지도자의 딸
  alternatives_korean:
  - 미디안의 한 족장의 딸
  - 미디안의 한 수장의 딸
  lexicon: HALOT
  rationale: נשיא는 높임받은 통치자/지도자를 가리키므로, 현대 한국어에서 과도한 귀족적 뉘앙스가 없는 ‘지도자’로 옮겼습니다.
- source_word: אֲחֹתָם
  english_pob_choice: their sister
  chosen_korean: 그들의 자매
  alternatives_korean:
  - 그들의 누이
  - 그들의 친족 여성
  lexicon: HALOT
  rationale: 히브리어의 직설적 친족 표현을 보존하되, 한국어에서는 성별 중립적이면서도 혈족/동족 관계를 암시하는 ‘자매’가 가장 자연스럽습니다.
theological_decisions:
- issue: פְּעוֹר의 지시 대상
  chosen_reading: 본문의 ‘페올’은 그대로 음역하고, 본문 자체는 특정 사건을 지시하는 역사적 이름으로 유지했습니다.
  alternative_readings:
  - 바알-브올로 풀어 씀
  - 우상숭배 사건으로 해석해 번역
  rationale: 히브리어가 단지 ‘Peor’라고만 말하므로, 본문에서 해석을 덧붙이기보다 사건명으로 보존하는 것이 원문 밀착에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §1, §2
- issue: 직접적 죽음 표현
  chosen_reading: ‘죽임을 당했습니다’로 옮겨, ‘strike down’의 수동적·법정적/심판적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 죽었습니다
  - 살해당했습니다
  rationale: נכה의 수동 분사는 단순 사망보다 외부 행위에 의해 쓰러짐을 강조하므로, 심판의 맥락을 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §5
