source:
  edition: WLC
  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: Now the name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
  footnotes:
  - marker: a
    text: Or, more formally, 'the Israelite man who was struck down, who was struck down with the Midianite.' The Hebrew repeats the verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Father''s house'' refers to a patrilineal family or clan unit within the tribe.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 그 이스라엘 사람의 이름, 곧 미디안 여인과 함께 함께 죽임을 당한 자의 이름은 살루의 아들 시므리였으며, 그는 시므온 사람들 가운데 있는 한 아버지 집의 지도자였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 동사 형태를 반복하여 이 사람의 죽음을 강조합니다.
    reason: source_note
  - marker: b
    text: ‘아버지 집’은 부족 안의 부계 친족 단위를 가리키는 기술어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  english_pob_choice: Now the name
  chosen_korean: 이제 그 사람의 이름
  alternatives_korean:
  - 그리고 그 이름
  - 그 이름은
  lexicon: HALOT
  rationale: 서술 전환의 연결감은 살리되, 한국어에서는 ‘이제’가 자연스럽게 새 정보 소개를 이끕니다.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  english_pob_choice: who was struck down, who was struck down
  chosen_korean: 함께 죽임을 당한 자의 이름
  alternatives_korean:
  - 쳐 죽임을 당한 자
  - 죽임을 당한 ... 죽임을 당한
  lexicon: HALOT
  rationale: 반복된 히브리어 동사를 한국어에서 완전히 기계적으로 두 번 되살리기보다, 사람을 식별하는 구문으로 자연스럽게 풀어주되 폭력성과 수동성을 유지했습니다.
- source_word: אֶת הַמִּדְיָנִית
  english_pob_choice: with the Midianite woman
  chosen_korean: 미디안 여인과 함께
  alternatives_korean:
  - 미디안 여자와 함께
  - 미디안 여인과 더불어
  lexicon: HALOT
  rationale: 문맥상 동반 관계를 나타내므로 ‘과 함께’로 옮겼고, feminine singular 형식을 반영해 ‘여인’을 택했습니다.
- source_word: בֵית אָב
  english_pob_choice: a father's house
  chosen_korean: 한 아버지 집
  alternatives_korean:
  - 아버지의 집
  - 가문
  - 족속
  lexicon: HALOT
  rationale: 히브리어의 친족 단위를 드러내는 기술어를 살리기 위해 직역성을 유지했습니다.
- source_word: לַשִּׁמְעֹנִי
  english_pob_choice: among the Simeonites
  chosen_korean: 시므온 사람들 가운데
  alternatives_korean:
  - 시므온 사람들 중
  - 시므온 지파에 속한
  lexicon: HALOT
  rationale: 소속 집단을 자연스럽게 나타내면서도 ‘among’의 범주성을 살렸습니다.
