  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְרֶ֣אןָ לָ/עָ֔ם לְ/זִבְחֵ֖י אֱלֹהֵי/הֶ֑ן וַ/יֹּ֣אכַל הָ/עָ֔ם וַ/יִּֽשְׁתַּחֲוּ֖וּ לֵֽ/אלֹהֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
  footnotes:
  - marker: a
    text: Or 'worshiped their gods.' The Hebrew verb literally refers to bowing oneself down, often as an act of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 백성을 자기들의 신들의 제사에 초대했고, 백성은 먹고 자기들의 신들에게 엎드려 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들을 예배했습니다.’ 히브리어 동사는 문자적으로는 몸을 굽혀 엎드리는 것을 가리키며, 대개 예배 행위로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ לָעָם
  english_pob_choice: they invited the people
  chosen_korean: 그들은 백성을 초대했고
  alternatives_korean:
  - 그들은 백성을 불렀고
  - 그들은 백성을 불러 모았고
  lexicon: HALOT
  rationale: לְ와 사람을 목적어로 취하는 קרא는 여기서 단순한 ‘부르다’보다 ‘초대하다’가 문맥상 자연스럽고, 유혹적 상황을 드러내는 흐름도 살릴 수 있습니다.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  english_pob_choice: to the sacrifices of their gods
  chosen_korean: 자기들의 신들의 제사에
  alternatives_korean:
  - 자기들의 신들에게 드리는 제사에
  - 자기들의 신들의 희생제물에
  lexicon: HALOT
  rationale: זִבְחֵי는 ‘제사들/희생제물들’의 복수 연계형으로, 여기서는 우상 숭배와 결부된 제의적 식사 자리를 가리키므로 ‘제사에’가 가장 간결하고 원문 구조도 잘 반영합니다.
- source_word: וַיִּשְׁתַּחֲוּוּ
  english_pob_choice: bowed down
  chosen_korean: 엎드려 절했습니다
  alternatives_korean:
  - 엎드렸습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 몸을 굽혀 엎드리는 물리적 동작을 가리키므로, 한국어로도 그 동작을 드러내는 ‘엎드려 절하다’가 ‘경배하다’보다 원문에 가깝습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחֲוּוּ의 번역을 행위 중심으로 유지할지 여부
  chosen_reading: ‘엎드려 절했습니다’로 번역해 우상 숭배의 구체적 몸짓을 드러냈습니다.
  alternative_readings:
  - ‘신들에게 예배했습니다’
  - ‘신들을 섬겼습니다’
  rationale: 원문은 먼저 절하는 행위를 말하고, 그 행위가 문맥상 우상 숭배임을 보여 줍니다. 따라서 해석어보다 몸짓을 보존하는 편이 경고의 강도를 살립니다.
  doctrine_reference: Translation philosophy §3, §6
