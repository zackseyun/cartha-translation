  lexicon: HALOT
  rationale: 희귀어라서 특정 건축형을 단정하지 않고, POB의 'chamber'에 맞게 폐쇄된 내부 공간이라는 뜻을 자연스러운 한국어로 살렸습니다.
- source_word: וַיִּדְקֹר
