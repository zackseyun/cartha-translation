  source_fidelity: 번역은 사건의 순서와 주요 어휘를 대체로 충실히 옮겼습니다. 다만 원문의 '두 사람 ... 그 여자[의 배]'라는 연결이 한국어 초안에서는 목적어 배열상 다소 불명확합니다. '그 여자의 배를 꿰뚫어'를 뒤 절로 배치하여, 두 사람을 찌른 행위와 여자의 복부를 꿰뚫은 결과를 자연스럽게 연결했습니다.
  naturalness: '''그녀의 배를 꿰뚫어 찔렀습니다''는 선행 목적어인 ''두 사람''과의 관계가 어색하게 읽힐 수 있습니다. ''그 여자''가 이 문맥의 현대 한국어 성서 문체에도 더 자연스럽습니다. 또한 각주 표지는 관련 어구 바로 뒤에 두는 것이 독해와 주석 연결에 적절합니다.'
  terminology: '''이스라엘 자손'', ''재앙'', ''방''은 적절합니다. 희귀어 הַקֻּבָּה에 대해 ''방''은 특정 구조를 단정하지 않는 안전한 선택입니다. ''그 재앙''으로 정관성을 반영했습니다.'
