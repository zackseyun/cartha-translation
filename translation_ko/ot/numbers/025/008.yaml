source:
  edition: WLC
  text: וַ֠/יָּבֹא אַחַ֨ר אִֽישׁ יִשְׂרָאֵ֜ל אֶל הַ/קֻּבָּ֗ה וַ/יִּדְקֹר֙ אֶת שְׁנֵי/הֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְ/אֶת הָ/אִשָּׁ֖ה אֶל קֳבָתָ֑/הּ וַ/תֵּֽעָצַר֙ הַ/מַּגֵּפָ֔ה מֵ/עַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the tent chamber,' 'the alcove,' or 'the pavilion'; the Hebrew term is rare and refers to an inner compartment or chamber.
    reason: lexical_alternative
  - marker: b
    text: Or 'through her abdomen.' The Hebrew refers specifically to the belly or abdominal cavity.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘 남자를 따라 그 방으로 들어가서, 두 사람 곧 이스라엘 남자와 여자를 그녀의 배를 꿰뚫어 찔렀습니다. 그러자 이 재앙이 이스라엘 자손에게서 그쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀어 קֻבָּה는 내부의 칸막이 또는 방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 배 또는 복부를 가리키는 구체적 신체 표현을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 '이스라엘 자손'은 언약적 공동체를 가리키는 표준 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  english_pob_choice: the chamber
  chosen_korean: 그 방
  alternatives_korean:
  - 그 방 안쪽의 칸막이
  - 내실
  - 내부 방
  lexicon: HALOT
  rationale: 희귀어라서 특정 건축형을 단정하지 않고, POB의 'chamber'에 맞게 폐쇄된 내부 공간이라는 뜻을 자연스러운 한국어로 살렸습니다.
- source_word: וַיִּדְקֹר
  english_pob_choice: pierced
  chosen_korean: 꿰뚫어 찔렀습니다
  alternatives_korean:
  - 찌르셨습니다
  - 관통하셨습니다
  - 찔러 꿰뚫었습니다
  lexicon: HALOT
  rationale: 단순한 찌름보다 관통의 폭력성을 드러내는 동사로, שניֵהֶם과 뒤이은 결과를 잘 반영합니다.
- source_word: קֳבָתָהּ
  english_pob_choice: through her belly
  chosen_korean: 그녀의 배를
  alternatives_korean:
  - 그녀의 배를 통해
  - 그녀의 복부를
  - 배 속을
  lexicon: HALOT
  rationale: 히브리어가 지시하는 구체적 신체 부위를 과도하게 완곡하게 만들지 않으면서도, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from upon the sons of Israel
  chosen_korean: 이스라엘 자손에게서
  alternatives_korean:
  - 이스라엘 자손 위에서
  - 이스라엘의 아들들에게서
  - 이스라엘 백성에게서
  lexicon: HALOT
  rationale: '''from upon''의 공간적 표현은 한국어에서 자연스럽지 않으므로 ''에게서''로 옮기되, covenantal 표현은 POB의 판단에 따라 ''이스라엘 자손''을 유지했습니다.'
theological_decisions:
- issue: 이스라엘 집단 지칭의 성별-정확성
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어 בְּנֵי יִשְׂרָאֵל의 형식을 보존해 집단 명칭의 남성 복수 표현을 지웠다가 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 잔혹한 신체 묘사의 직접성
  chosen_reading: 그녀의 배를 꿰뚫어 찔렀습니다
  alternative_readings:
  - 그녀의 복부를 찔렀습니다
  - 그녀의 몸을 찔렀습니다
  rationale: 본문의 심판 장면을 완곡하게 누그러뜨리지 않고, 히브리어의 구체적 신체 묘사를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
