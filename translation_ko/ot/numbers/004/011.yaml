base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
  footnotes:
  - marker: a
    text: Or 'with a covering of leather from tachash skin'; the precise animal denoted by tachash is uncertain. Proposed renderings include 'fine leather,' 'dugong skin,' and similar durable-hide terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 금 제단 위에 푸른 천을 펴고, 그것을 가죽 덮개[a]로 덮은 뒤, 그 채들을 끼우십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תחש(타하스)가 가리키는 동물은 확실하지 않습니다. ‘가죽 덮개’로 옮겼으나, 특정 동물의 가죽으로 보는 번역들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  english_pob_choice: the golden altar
  chosen_korean: 금 제단
  alternatives_korean:
  - 황금 제단
  - 금으로 된 제단
  lexicon: HALOT
  rationale: 히브리어는 ‘금의 제단’이라는 소유격적 구성으로, 한국어에서는 자연스럽게 ‘금 제단’이라고 옮기면 재료와 용도를 함께 살릴 수 있습니다.
- source_word: בֶּגֶד תְּכֵלֶת
  english_pob_choice: a blue cloth
  chosen_korean: 푸른 천
  alternatives_korean:
  - 청색 천
  - 푸른 옷감
  lexicon: HALOT
  rationale: בגד은 의복보다 넓게 천/직물을 가리킬 수 있고, תכלת는 성막 문맥의 특수한 청록 계열 염색색을 뜻하므로, 과도하게 해석하지 않으면서도 현대 독자가 이해하기 쉬운 ‘푸른 천’이 적절합니다.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  english_pob_choice: with a covering of fine leather
  chosen_korean: 가죽 덮개
  alternatives_korean:
  - 다합 가죽 덮개
  - 정교한 가죽 덮개
  - 바다소 가죽 덮개
  lexicon: HALOT
  rationale: תחש의 정확한 동물은 불확실하므로, POB의 취지를 따라 특정 동물을 단정하지 않고 기능을 드러내는 ‘가죽 덮개’로 옮겼습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles in place
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 막대들
  - 운반 채들
  lexicon: HALOT
  rationale: בדים은 성막 기구를 운반하는 채를 가리키므로, 한국어 성경에서 익숙하면서도 기능을 보존하는 ‘채’가 가장 적절합니다.
theological_decisions:
- issue: 성막 기구를 가리는 순서와 보존의 의미
  chosen_reading: 제단 위에 천을 펴고 덮개로 덮은 뒤 채를 꽂아 두는 지시로 옮겼습니다.
  alternative_readings:
  - 단순한 보관 절차로만 축소하는 번역
  - 의례적 상징을 과도하게 설명하는 번역
  rationale: 본문은 제의 절차를 간명하게 지시하므로, 상징을 덧붙이지 않고 순서와 동작을 그대로 살리는 것이 원문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 민수기 4장의 성막 운반 규례
