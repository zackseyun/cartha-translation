id: NUM.4.27
reference: Numbers 4:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
  footnotes:
  - marker: a
    text: Or 'according to the word of Aaron and his sons.' The Hebrew idiom is literally 'upon the mouth of.'
    reason: lexical_alternative
  - marker: b
    text: Or 'as a charge.' The Hebrew term can denote an assigned responsibility or obligation.
    reason: lexical_alternative
translation:
  language: ko
  text: 게르손 자손이 그들의 모든 운반물과 그들의 모든 봉사에 관하여 하는 모든 일은 아론과 그의 아들들의 명령에 따라야 합니다.[a] 또 여러분은 그들이 나르는 모든 것을 그들의 책임으로 맡겨야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 ‘입 위에’이며, 보통 어떤 이의 명령이나 지시에 따라 행동한다는 뜻입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘맡은 직무로.’ 여기의 히브리어는 지정된 의무나 맡은 책임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  english_pob_choice: at the command of
  chosen_korean: 명령에 따라
  alternatives_korean:
  - 말에 따라
  - 지시에 따라
  - 말씀에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입 위에’는 권위에 따른 지시를 뜻하므로, 현대 한국어에서는 자연스럽고 통치적 뉘앙스를 살리는 ‘명령에 따라’가 가장 적절합니다.
- source_word: כָּל עֲבֹדַת ... לְכָל מַשָּׂאָם וּלְכֹל עֲבֹדָתָם
  english_pob_choice: for all their loads and for all their service
  chosen_korean: 그들의 모든 운반물과 그들의 모든 일
  alternatives_korean:
  - 그들의 모든 짐과 그들의 모든 봉사
  - 그들의 모든 부담과 그들의 모든 사역
  - 그들이 나르는 모든 것과 그들의 모든 일
  lexicon: HALOT
  rationale: מַשָּׂא 는 성막 운송 문맥에서 실제로 ‘나르는 것/운반물’을 가리키므로 추상적인 ‘짐’보다 구체적인 ‘운반물’이 좋고, עֲבֹדָה 는 문맥상 배정된 노동이어서 ‘일’로 옮겼습니다.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם בְּמִשְׁמֶרֶת
  english_pob_choice: you shall assign to them, as a duty
  chosen_korean: 그들에게 그들의 모든 운반물을 맡겨, 책임으로 삼게 해야 합니다
  alternatives_korean:
  - 그들에게 맡겨, 책임으로 정해야 합니다
  - 그들에게 배정하여, 맡은 직무로 삼게 해야 합니다
  - 그들에게 맡겨, 경계로 삼게 해야 합니다
  lexicon: HALOT
  rationale: פקד 은 여기서 단순한 점검보다 ‘책임을 맡겨 배정하다’는 행정적 의미가 강하고, מִשְׁמֶרֶת 는 ‘charge/duty’에 해당하므로 ‘책임으로 삼게’가 가장 자연스럽게 대응합니다.
theological_decisions:
- issue: 제사장 권위 아래 레위 지파의 역할 분담
  chosen_reading: 아론과 그의 아들들의 권한 아래에서 고르손 자손의 운송·봉사 업무가 배정되는 행정 질서를 그대로 살렸습니다.
  alternative_readings:
  - ‘감독 아래에서’처럼 완화할 수 있음
  - ‘지시에 따라’로만 처리해 권위성을 약화시킬 수 있음
  rationale: 본문은 성막 봉사의 실제적 위계와 책임 배분을 말하므로, 이를 평면화하지 않고 권위와 배정을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 민수기 4장 레위인의 성막 봉사 질서
- issue: ‘책임으로 삼게 해야 합니다’의 의도
  chosen_reading: מִשְׁמֶרֶת 를 단순 업무가 아니라 맡은 책임과 의무로 이해해 번역했습니다.
  alternative_readings:
  - ‘감시’나 ‘보초’로 이해할 수 있음
  - ‘직무’로만 옮겨 책임성을 약화시킬 수 있음
  rationale: 문맥상 운반 업무의 배당을 말하므로, 감시 의미보다 위탁된 의무라는 뜻을 살리는 것이 더 적절합니다.
  doctrine_reference: HALOT, מִשְׁמֶרֶת 용례
