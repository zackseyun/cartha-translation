revisions:
- from: 고르손 자손의 모든 일은 아론과 그의 아들들의 명령에 따라야 하며, 그들의 모든 운반물과 그들의 모든 일에 관하여 그래야 합니다. 또 여러분은 그들에게 그들의 모든 운반물을 맡겨, 책임으로 삼게 해야 합니다.[a][b]
  to: 게르손 자손이 그들의 모든 운반물과 그들의 모든 봉사에 관하여 하는 모든 일은 아론과 그의 아들들의 명령에 따라야 합니다.[a] 또 여러분은 그들이 나르는 모든 것을 그들의 책임으로 맡겨야 합니다.[b]
  rationale: 히브리어 어순과 범위 관계를 한국어에 맞게 재구성하여, 고르손 자손의 운반 및 봉사 전체가 아론과 그의 아들들의 명령 아래 있다는 뜻을 명료하게 했습니다. 마지막 명령은 운반물을 그들에게 책임으로 배정한다는 의미를 유지했습니다. 고유명사를 통용 표기인 ‘게르손’으로 고쳤고, 두 각주를 해당 번역어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:51Z'
