  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
  footnotes:
  - marker: a
    text: Or 'cleanse the altar' / 'remove the fatty ashes from the altar.' The Hebrew verb refers specifically to clearing away the altar's ash residue in a sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제단의 재를 치우고 그 위에 자주색 천을 펼쳐야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단을 정결하게 하라’ / ‘제단에서 기름진 재를 치워 내라’. 이 히브리어 동사는 제의 문맥에서 제단의 재 잔여물을 치우는 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  english_pob_choice: they shall remove the ashes
  chosen_korean: 재를 치우고
  alternatives_korean:
  - 재를 제거하고
  - 재를 걷어내고
  - 제단을 정결하게 하고
  lexicon: HALOT
  rationale: 제의적 문맥에서 דשׁן의 뜻은 제단의 잿더미를 치워 내는 것입니다. ‘재를 치우고’는 현대 한국어로 자연스럽고, 일반적인 ‘정결하게 하다’보다 구체적 행위를 드러냅니다.
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 번제단
  - 제물 드리는 단
  lexicon: HALOT
  rationale: מִזְבֵּחַ의 표준적 대응어로, 본문이 성막 제의 절차를 말하므로 ‘제단’이 가장 직접적입니다.
- source_word: בֶּגֶד אַרְגָּמָן
  english_pob_choice: a purple cloth
  chosen_korean: 자주색 천
  alternatives_korean:
  - 보라색 천
  - 자주빛 천
  - 자주색 옷감
  lexicon: HALOT
  rationale: בֶּגֶד은 여기서 입는 옷보다 덮개용 직물을 가리키므로 ‘천’이 자연스럽고, אַרְגָּמָן은 염색된 자주색을 가리켜 ‘자주색’이 적절합니다.
- source_word: וּפָרְשׂוּ עָלָיו
  english_pob_choice: and spread over it
  chosen_korean: 그 위에 … 펼쳐야 합니다
  alternatives_korean:
  - 그 위에 … 덮어야 합니다
  - 그 위에 … 깔아야 합니다
  lexicon: HALOT
  rationale: פָרַשׂ는 넓게 펴 놓는 동작을 뜻하므로, 덮는 행위가 아니라 직물을 ‘펼치다’로 옮기면 원문의 동작감이 살아납니다.
theological_decisions:
- issue: 제의 절차의 세부 동작을 얼마나 구체적으로 드러낼 것인가
  chosen_reading: ‘재를 치우고’로 옮겨 제단의 잔재를 제거하는 실제 행위를 드러냈습니다.
  alternative_readings:
  - ‘제단을 정결하게 하고’
  - ‘재를 제거하고’
  rationale: 본문은 일반적 정결 행위보다 제단에 남은 재를 치우는 구체적 준비 과정을 말하므로, 그 제의적 구체성을 보존하는 번역이 적절합니다.
  doctrine_reference: 제의 규례의 서술적 정확성
