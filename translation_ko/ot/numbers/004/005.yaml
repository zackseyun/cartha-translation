  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the ark of the covenant.' The Hebrew here, however, says 'testimony.'
    reason: lexical_alternative
translation:
  language: ko
  text: 회중이 떠날 때에 아론과 그의 아들들이 와서 휘장인 가리개를 내리고, 그것으로 증거궤를 덮어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로는 ‘언약궤’입니다. 그러나 히브리어 본문은 여기서 ‘증거’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  english_pob_choice: When the camp sets out
  chosen_korean: 회중이 떠날 때에
  alternatives_korean:
  - 진영이 출발할 때에
  - 군대가 길을 떠날 때에
  lexicon: HALOT
  rationale: 캠프를 그대로 옮기기보다, 문맥상 이동하는 집단을 자연스럽게 드러내는 ‘회중’과 ‘떠날 때에’로 시간 절을 살렸습니다.
- source_word: פָּרֹכֶת הַמָּסָךְ
  english_pob_choice: the veil of the screen
  chosen_korean: 휘장인 가리개
  alternatives_korean:
  - 가리개의 휘장
  - 가리개인 휘장
  lexicon: HALOT
  rationale: פָּרֹכֶת과 הַמָּסָךְ의 이중 명칭을 평이하게 풀어, 성막 내부 분리 휘장이라는 점을 유지하면서도 한국어에서 과도하게 어색한 직역을 피했습니다.
- source_word: וְכִסּוּ בָהּ
  english_pob_choice: and cover ... with it
  chosen_korean: 그것으로 ... 덮어야 합니다
  alternatives_korean:
  - 그것으로 ... 가려야 합니다
  - 그것에 ... 싸야 합니다
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 살리되, 한국어에서 도구·수단을 나타내는 ‘그것으로’로 여성 단수 대명사의 지시를 분명히 했습니다.
- source_word: אֲרֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 히브리어가 בְּרִית(언약)가 아니라 עֵדוּת(증거/증언)를 쓰므로, 전통적 ‘언약궤’보다 원어의 의미를 드러내는 ‘증거궤’를 택했습니다.
theological_decisions:
- issue: 전통적 ‘언약궤’ 대신 עֵדוּת의 직접 반영
  chosen_reading: 증거궤
  alternative_readings:
  - 언약궤
  rationale: 본문은 ‘언약’이 아니라 ‘증거/증언’을 명시하므로, 독자가 원문 차이를 놓치지 않도록 전통 용어를 따르지 않았습니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
