  source_fidelity: ‘회중’은 עֵדָה 등에 해당하는 집회를 가리키는 말로 이해되기 쉬우나, 히브리어 הַמַּחֲנֶה는 이동·출발하는 ‘진영’입니다. 이를 ‘진영’으로 고쳐야 합니다. 또한 פָּרֹכֶת הַמָּסָךְ의 두 명사를 보존하는 ‘가리개 휘장’이 ‘휘장인 가리개’보다 원문의 관계를 더 충실히 드러냅니다.
