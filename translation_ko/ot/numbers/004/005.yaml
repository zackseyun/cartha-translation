  lexicon: HALOT
  rationale: פָּרֹכֶת과 הַמָּסָךְ의 이중 명칭을 평이하게 풀어, 성막 내부 분리 휘장이라는 점을 유지하면서도 한국어에서 과도하게 어색한 직역을 피했습니다.
- source_word: וְכִסּוּ בָהּ
  english_pob_choice: and cover ... with it
  chosen_korean: 그것으로 ... 덮어야 합니다
  alternatives_korean:
  - 그것으로 ... 가려야 합니다
  - 그것에 ... 싸야 합니다
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 살리되, 한국어에서 도구·수단을 나타내는 ‘그것으로’로 여성 단수 대명사의 지시를 분명히 했습니다.
- source_word: אֲרֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 히브리어가 בְּרִית(언약)가 아니라 עֵדוּת(증거/증언)를 쓰므로, 전통적 ‘언약궤’보다 원어의 의미를 드러내는 ‘증거궤’를 택했습니다.
theological_decisions:
