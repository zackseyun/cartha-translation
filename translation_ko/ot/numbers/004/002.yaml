translation:
  language: ko
  text: 레위 사람들 가운데에서 고핫 자손을 그들의 종족과 조상 가문대로 계수하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '고핫 자손의 머리를 들어 올리다'이며, 여기서는 계수하거나 조사한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  english_pob_choice: Take a census
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 인원수를 세십시오
  - 조사하십시오
  - 머리를 들어 세십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 '머리를 들어 올리다'이지만, 문맥상 인구·인원 집계의 뜻이므로 현대 한국어에서는 행정적 의미가 분명한 '계수하십시오'로 옮겼습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫 자손
  alternatives_korean:
  - 고핫의 아들들
  - 고핫 사람들
  - 고핫 사람의 후손
  lexicon: HALOT
  rationale: 족보적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 '자손'을 택했습니다. '고핫 사람들'은 집단명처럼 들려 원문의 계보성을 약화시킵니다.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  english_pob_choice: from among the sons of Levi
  chosen_korean: 레위 사람들 가운데에서
  alternatives_korean:
  - 레위 자손들 가운데에서
  - 레위의 아들들 중에서
  - 레위 사람들 중에서
  lexicon: HALOT
  rationale: 선택의 출처를 나타내는 מִתּוֹךְ의 뜻을 살려 '가운데에서'로 옮겼습니다. '레위 사람들'은 한국어에서 '레위 지파 구성원'을 자연스럽게 가리키면서도 계보적 구성을 크게 해치지 않습니다.
- source_word: לְמִשְׁפְּחֹתָם לְבֵית אֲבֹתָם
  english_pob_choice: by their clans, by their fathers’ houses
  chosen_korean: 그들의 종족과 조상 가문대로
  alternatives_korean:
  - 그들의 종족별로, 조상 가문별로
  - 그들의 가족별로, 조상 집안별로
  - 그들의 종족과 아버지의 집안대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 광의의 '가문/종족'보다도 여기서는 계수용 분류 단위인 '종족'에 가깝고, בֵּית־אָב은 '조상 가문'으로 옮겨 고대 이스라엘의 가부장적 가계 구조를 드러냈습니다.
theological_decisions:
- issue: 인구 조사 관용구를 직역할지, 행정적 의미로 풀어쓸지
  chosen_reading: '''계수하십시오''로 옮겨 관용구의 실제 의미를 드러냈습니다.'
  alternative_readings:
  - '''머리를 들어 올리십시오''처럼 문자적으로 옮김'
  - '''인원을 세십시오''처럼 완전 풀이'
  rationale: 본문은 레위 자손의 행정적 계수 명령이므로, 문자성만 남기면 한국어 독자가 오해할 수 있습니다. 동시에 '계수'는 원문의 공식적·공문서적 어조를 유지합니다.
  doctrine_reference: 민수기의 인구 조사/편제 명령
