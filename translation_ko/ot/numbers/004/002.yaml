  lexicon: HALOT
  rationale: 족보적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 '자손'을 택했습니다. '고핫 사람들'은 집단명처럼 들려 원문의 계보성을 약화시킵니다.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
