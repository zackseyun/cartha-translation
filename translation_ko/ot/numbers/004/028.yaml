revisions:
- from: 이것은 회막에서 그르손 자손 가문의 봉사입니다. 그리고 그들의 책임은 아론의 아들 제사장 이다말의 감독 아래에 있습니다.[a][b]
  to: 이것은 그르손 자손의 가문들이 회막에서 하는 봉사입니다. 그들이 맡은 직무[a]는 제사장 아론의 아들 이다말의 감독 아래에 있습니다.[b]
