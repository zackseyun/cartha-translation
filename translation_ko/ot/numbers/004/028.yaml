  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
  footnotes:
  - marker: a
    text: Or "their charge"; the Hebrew term can denote an assigned responsibility or obligation.
    reason: lexical_alternative
  - marker: b
    text: Literally "under the hand of Ithamar," an idiom meaning under his supervision or authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 그르손 자손의 가문들이 회막에서 하는 봉사입니다. 그들이 맡은 직무[a]는 제사장 아론의 아들 이다말의 감독 아래에 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들이 맡은 직무’를 뜻하며, ‘그들의 의무’ 또는 ‘그들의 책임’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 문자적으로 ‘이다말의 손 아래에’이며, 그의 감독이나 권위 아래에 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת / This is
  english_pob_choice: This is
  chosen_korean: 이것은
  alternatives_korean:
  - 이것
  lexicon: HALOT
  rationale: 선언문을 시작하는 지시어로서 식별적 힘을 살리기 위해 ‘이것은’으로 옮겼습니다.
- source_word: עֲבֹדַת / the service
  english_pob_choice: the service
  chosen_korean: 봉사
  alternatives_korean:
  - 섬김
  - 일
  lexicon: HALOT
  rationale: 회막 문맥의 지정된 제의적 업무를 가리키므로, 과도하게 교회 제도적 뉘앙스를 띠지 않는 ‘봉사’를 선택했습니다.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי / the sons of the Gershonites
  english_pob_choice: the sons of the Gershonites
  chosen_korean: 그르손 자손
  alternatives_korean:
  - 그르손 사람들
  - 게르손 자손
  lexicon: HALOT
  rationale: 히브리어 계보 표현을 따라 ‘자손’을 유지했고, 고유명사는 현대 외래어 표기보다 성경 인명 관용형에 맞춰 ‘그르손’으로 옮겼습니다.
- source_word: בְּאֹהֶל מוֹעֵד / in the tent of meeting
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 회중의 천막에서
  lexicon: HALOT
  rationale: 성막 용례에서 굳어진 표현을 살리되, 한국어 독자에게 자연스러운 표준 교회-성경 어휘인 ‘회막’으로 옮겼습니다.
- source_word: וּמִשְׁמַרְתָּם / and their duty
  english_pob_choice: and their duty
  chosen_korean: 그들의 책임
  alternatives_korean:
  - 그들의 직분
  - 그들의 맡은 일
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת의 ‘맡은 의무/책임’이라는 의미를 살려, 문맥상 가장 분명한 ‘책임’을 선택했습니다.
- source_word: בְּיַד / under the hand of
  english_pob_choice: under the hand of
  chosen_korean: 감독 아래에
  alternatives_korean:
  - 손 아래에
  - 권한 아래에
  - 관할 아래에
  lexicon: HALOT
  rationale: 히브리 관용구를 직역하기보다, POB의 주석이 밝힌 ‘감독/권위 아래’라는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן / Ithamar son of Aaron the priest
  english_pob_choice: Ithamar son of Aaron the priest
  chosen_korean: 아론의 아들 제사장 이다말
  alternatives_korean:
  - 제사장 아론의 아들 이다말
  - 이다말, 아론의 아들인 제사장
  lexicon: HALOT
  rationale: 인명과 직함의 관계를 보존하면서 한국어 어순에 맞게 재배열했고, ‘제사장’은 아론의 신분 수식으로 붙였습니다.
theological_decisions:
- issue: בְּיַד idiom as supervision/authority
  chosen_reading: ‘under the hand of’는 문자적 손이 아니라 감독과 권위 아래 있음을 뜻하므로, 본문 의미를 드러내는 ‘감독 아래에’로 옮겼습니다.
  alternative_readings:
  - ‘손 아래에’로 더 직역
  - ‘관할 아래에’로 행정적으로 번역
  rationale: 본문의 실질 의미는 배정된 직무의 상위 감독이므로, 오해를 줄이는 해석적 번역이 적절합니다.
  doctrine_reference: 민수기 4장의 레위 직무 배분과 제사장 감독 구조
