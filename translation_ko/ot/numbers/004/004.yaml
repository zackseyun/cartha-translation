base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
  footnotes:
  - marker: a
    text: Or, 'the Holy of Holies' / 'the most holy place.' Here the phrase likely refers to the holiest sacred objects rather than only the inner sanctuary.
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 회막에서 고핫 자손이 수행하는 지극히 거룩한 것들에 관한 직무입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지성소’ 또는 ‘지극히 거룩한 곳’. 여기서는 문맥상 내실 공간만을 가리키기보다 고핫 자손이 맡은 지극히 거룩한 성물들을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This is
  chosen_korean: 이것은
  alternatives_korean:
  - 이것
  lexicon: HALOT
  rationale: 히브리어 여성형 지시대명사가 절을 도입하므로, 한국어에서는 자연스러운 주어-서술 연결인 ‘이것은’으로 옮겼습니다.
- source_word: עֲבֹדַת
  english_pob_choice: the service
  chosen_korean: 직무
  alternatives_korean:
  - 봉사
  - 일
  - 섬김
  lexicon: HALOT
  rationale: 문맥상 고핫 자손에게 지정된 성막 관련 수행 업무를 가리키므로, 예배적 뉘앙스를 유지하면서도 ‘서비스’보다 한국어 성경체에 자연스러운 ‘직무’를 택했습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫 자손
  alternatives_korean:
  - 고핫의 아들들
  - 고핫 사람들
  - 고핫 족속
  lexicon: HALOT
  rationale: 족보적 표현을 직역하기보다 성경에서 널리 통용되는 집단명 형태를 유지해 식별성을 높였습니다.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the most holy things
  chosen_korean: 가장 거룩한 것들
  alternatives_korean:
  - 지성소
  - 가장 거룩한 장소
  - 지극히 거룩한 물건들
  lexicon: HALOT
  rationale: 문맥상 장소가 아니라 고핫 자손이 맡은 거룩한 성물들을 가리키므로, 공간명인 ‘지성소’ 대신 사물 지시를 살린 ‘가장 거룩한 것들’을 선택했습니다.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים의 지시 대상
  chosen_reading: 회막 안에서 취급되는 가장 거룩한 성물들을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 지성소라는 내실 공간을 가리키는 표현으로 읽을 수 있습니다.
  rationale: 민수기 4장의 문맥은 고핫 자손이 성막 기구를 운반하고 다루는 규정을 다루므로, 이 표현은 공간 자체보다 가장 거룩한 물품들을 기능적으로 지칭하는 것으로 보는 것이 더 자연스럽습니다.
  doctrine_reference: 민수기 4장 문맥
