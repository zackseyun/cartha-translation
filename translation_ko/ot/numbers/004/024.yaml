  to: 이것은 게르손 자손의 여러 가족이 맡은 직무, 곧 섬기는 일과 운반하는 일입니다.[a]
  rationale: 집단 명칭을 자연스러운 표준 한국어로 고치고, 원문의 병렬된 목적 기능을 ‘곧 섬기는 일과 운반하는 일’로 명료하게 연결했습니다. ‘운반’의 더 구체적인 ‘짐을 나름’ 가능성은 각주로 남겨 어휘 범위를 보존했습니다.
