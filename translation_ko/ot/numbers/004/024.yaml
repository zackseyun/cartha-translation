review_pass:
  verdict: revise
  source_fidelity: 히브리어는 게르손 계열의 가족 집단에 배정된 직무를 ‘섬김’과 ‘운반/짐 지기’라는 병렬 목적어로 규정합니다. 초안은 두 기능을 대체로 충실히 반영하지만, ‘그르손 사람들의 가족들’은 מִשְׁפְּחֹת הַגֵּרְשֻׁנִּי의 집단 관계를 한국어에서 부자연스럽고 중복되게 표현합니다.
  naturalness: ‘게르손 자손의 여러 가족’은 현대 표준어에서 자연스럽게 가족 집단의 복수를 나타냅니다. 또한 ‘직무입니다. 섬기고 운반하는 일입니다’라는 분리된 두 문장보다 한 문장 안에서 직무의 내용을 제시하는 편이 매끄럽습니다.
  terminology: ‘직무’, ‘섬기는 일’, ‘운반하는 일’은 성막 봉사 문맥과 원문의 어휘 범위를 무리 없이 보존합니다. ‘게르손’은 한국어 성경에서 통용되는 인명 표기입니다.
  issues:
  - severity: medium
    issue: ‘그르손 사람들의 가족들의’라는 집단 명칭 표현
    rationale: ‘사람들’과 ‘가족들’이 연이어 중복되고, 고유명사 표기도 통용 표기인 ‘게르손’과 다릅니다. 원문의 ‘게르손 계열에 속한 가족 집단들’이라는 관계를 ‘게르손 자손의 여러 가족’으로 자연스럽게 옮길 수 있습니다.
