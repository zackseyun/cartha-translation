base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
  footnotes:
  - marker: a
    text: Or 'for serving and for bearing burdens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 게르손 자손의 여러 가족이 맡은 직무, 곧 섬기는 일과 운반하는 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬기는 일과 짐을 나르는 일’로 옮길 수 있습니다.
    reason: מַשָּׂא는 ‘운반’뿐 아니라 운반되는 ‘짐’ 또는 ‘짐을 나름’을 가리킬 수 있습니다.
lexical_decisions:
- source_word: זֹאת
  english_pob_choice: This is
  chosen_korean: 이것은
  alternatives_korean:
  - 이것
  lexicon: HALOT
  rationale: 히브리어 지시대명사로 절의 선언을 여는 표현이므로, 한국어에서도 자연스럽게 계사 역할을 하는 ‘이것은’으로 옮겼습니다.
- source_word: עֲבֹדַת
  english_pob_choice: the service
  chosen_korean: 직무
  alternatives_korean:
  - 봉사
  - 섬김
  - 일
  lexicon: HALOT
  rationale: 레위인 직무 문맥에서 단순 노동보다 지정된 책임과 임무를 드러내는 말이므로 ‘직무’가 가장 정확합니다.
- source_word: לַעֲבֹד וּלְמַשָּׂא
  english_pob_choice: for serving and for carrying
  chosen_korean: 섬기고 운반하는 일입니다
  alternatives_korean:
  - 섬김과 운반을 위한 것입니다
  - 섬기며 나르는 일입니다
  lexicon: HALOT
  rationale: 두 목적부정사 לַעֲבֹד / וּלְמַשָּׂא의 병렬을 자연스러운 한국어 서술로 풀어, 예배적 섬김과 운반의 이중 기능을 함께 드러냈습니다.
- source_word: מַשָּׂא
  english_pob_choice: carrying
  chosen_korean: 운반
  alternatives_korean:
  - 짐 나르기
  - 부담을 짐
  lexicon: HALOT
  rationale: הַמַשָּׂא는 ‘짐/짐을 나름’의 뜻이지만 성막 운송 문맥에서 현대 한국어에는 ‘운반’이 가장 직접적이고 과장되지 않습니다.
theological_decisions:
- issue: 레위인 업무를 설명하는 절의 성격
  chosen_reading: 이 절은 예배 봉사의 성격을 가진 레위인 책임을 간명하게 규정하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 물류 업무 안내로만 읽는 것
  - ‘섬김’을 예배적 의미 없이 일반 봉사로만 읽는 것
  rationale: 문맥상 성막 봉사의 분담을 말하므로, 직무가 단순 운송이 아니라 야훼의 거룩한 처소를 섬기는 책임임을 반영했습니다.
  doctrine_reference: 민수기 4장 레위인 직무 배정 문맥
- issue: ‘운반’의 표현 강도
  chosen_reading: ‘운반’으로 옮겨 מַשָּׂא의 짐-지기 의미를 유지했습니다.
  alternative_readings:
  - ‘나르기’
  - ‘짐을 메는 것’
  rationale: 문맥상 성막 기구를 실제로 들어 옮기는 일을 가리키므로, 의미를 약화하지 않는 표준어 ‘운반’을 선택했습니다.
  doctrine_reference: 성막 봉사와 레위인의 구별된 직무
