translation:
  language: ko
  text: 레위인 가운데에서 고핫 자손의 지파를 끊어 버리지 마십시오.<a>[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위인 가운데에서 고핫 자손의 가문을 멸하지 마십시오.’ 히브리어 동사는 ‘끊어 버리다’ 또는 ‘멸하다’를 뜻할 수 있고, ‘families’는 ‘가문들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּכְרִ֕יתוּ
  english_pob_choice: Do not cut off
  chosen_korean: 끊어 버리지 마십시오
