  - 멸하지 마십시오
  lexicon: HALOT
  rationale: כרת의 사역형 금지로서 ‘cut off’의 단절·제거 의미를 살리되, 한국어에서는 관계적·공동체적 제거를 자연스럽게 드러내는 ‘끊어 버리다’를 택했습니다.
