review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘고핫 자손의 지파’는 שֵׁבֶט은 반영하지만 복수 מִשְׁפְּחֹת(가문들/씨족들)를 빠뜨립니다. 또한 히브리어 사역형 금지는 단순히 그들을 ‘끊다’라기보다 그 집단이 끊어지게 하지 말라는 뜻이므로 이를 한국어에서 분명히 하는 것이 좋습니다.
  naturalness: ‘레위 사람 가운데서 … 끊어지게 하지 마십시오’는 현대 표준어 합쇼체로 자연스럽고, 공동체 안에서 제거되는 관계를 명료하게 나타냅니다. ‘여러 가문의 지파’는 원문의 중첩된 계보 표현을 유지하면서도 이해 가능합니다.
  terminology: ‘레위 사람’, ‘고핫 자손’, ‘지파’, ‘가문’은 적절한 성경·계보 용어입니다. 각주에 남아 있는 영어 단어 ‘families’는 한국어 ‘가문들’로 고쳐야 합니다.
  issues:
  - severity: medium
    issue: מִשְׁפְּחֹת의 복수 의미가 본문에서 누락됨
    rationale: ‘고핫 자손의 지파’는 ‘고핫 사람들의 가문들’이라는 구성 요소를 충분히 드러내지 못합니다.
  - severity: medium
    issue: 사역형 금지의 한국어 표현이 덜 명시적임
    rationale: תַּכְרִיתוּ는 ‘끊어지게 하다/멸하게 하다’라는 사역적 의미입니다. ‘끊어지게 하지 마십시오’가 행위의 결과를 더 충실히 표현합니다.
  - severity: high
    issue: 본문 각주 표지가 중복됨
    rationale: ‘<a>[a]’는 동일 각주를 두 번 표기한 구조 오류입니다. 단일 표지로 통일해야 합니다.
  - severity: low
    issue: 각주에 영어 표현이 남아 있음
    rationale: 한국어 각주에서는 ‘families’ 대신 ‘가문들’을 사용해야 합니다.
  revised_text: 레위 사람 가운데서 고핫 자손의 여러 가문의 지파가 끊어지게 하지 마십시오.<a>
  revised_footnotes:
