    text: 또는 ‘레위 사람 가운데서 고핫 자손의 여러 가문의 지파를 멸하지 마십시오.’ 히브리어 동사는 ‘끊어지게 하다’ 또는 ‘멸하다’를 뜻할 수 있고, ‘가문들’은 ‘씨족들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 복수 ‘가문들’을 본문에 반영하고, 사역형 금지를 ‘끊어지게 하지 마십시오’로 옮겨 원문의 행위·결과 관계를 보존했습니다. 중복된 각주 표지를 하나로 정정하고 각주의 미번역 영어를 한국어로 바로잡았습니다. ‘끊어지다/멸하다’의 어휘적 긴장은 각주에 남겨 두었습니다.
