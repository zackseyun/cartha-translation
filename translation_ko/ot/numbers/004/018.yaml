  lexicon: HALOT
  rationale: 계보적·공동체적 단위를 가리키는 표준 성경 용어인 ‘지파’가 문맥에 가장 자연스럽습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: families
  chosen_korean: 자손
  alternatives_korean:
