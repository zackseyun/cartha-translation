  - 고핫 사람들
  - 고핫 지파
  lexicon: HALOT
  rationale: 형태상 단수 형용사/족칭이지만 집합적으로 쓰이므로, 한국어에서는 통용되는 계보 표현인 ‘고핫 자손’으로 풀어 집단성을 분명히 했습니다.
- source_word: מִתּוֹךְ
