  rationale: 분리의 출처를 나타내는 표현으로, 공동체 내부에서의 제거를 드러내는 ‘가운데에서’가 가장 자연스럽습니다.
theological_decisions:
- issue: כרת의 의미를 본문에서 어떻게 유지할 것인가
  chosen_reading: 본문은 고핫 자손을 레위인 공동체에서 제거하는 금지를 넓게 말하는 ‘끊어 버리다’로 두고, 구체적 사유는 본절에 덧붙이지 않았습니다.
  alternative_readings:
  - ‘멸하다’로 더 강하게 옮김
  - ‘제외하다’로 완화하여 옮김
  rationale: 이 절은 결과를 선언할 뿐 방식은 설명하지 않으므로, 공동체적 단절의 긴장을 보존하는 번역이 본문의 범위를 가장 정확히 따릅니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
