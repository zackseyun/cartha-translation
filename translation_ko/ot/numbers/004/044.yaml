  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: And ... were
  chosen_korean: 그리고 ...이었습니다
  alternatives_korean:
  - 그리고 ...였습니다
  - 또 ...이었습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어에서는 ‘그리고’와 평서형 종결로 자연스럽게 옮겨, 계산 결과를 이어 주는 흐름을 살렸습니다.
- source_word: פְקֻדֵיהֶם
  english_pob_choice: those counted from them
  chosen_korean: 그들의 계수된 사람들
  alternatives_korean:
  - 그들 가운데 계수된 자들
  - 그들에게서 계수된 사람들
  - 그들의 등록된 사람들
  lexicon: HALOT
  rationale: 이 문맥의 פקד는 인구조사에서 ‘계수되다/등록되다’의 뜻이므로, ‘계수된 사람들’로 옮겨 인원 총계를 직접 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 가문별로
  alternatives_korean:
  - 그들의 종족별로
  - 그들의 가족별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 지파 아래의 하위 단위인 가문/씨족을 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘가문별로’를 택했습니다.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  english_pob_choice: three thousand two hundred
  chosen_korean: 삼천이백 명
  alternatives_korean:
  - 삼천이백
  - 세 천이백 명
  lexicon: HALOT
  rationale: 히브리어 수사는 현대 한국어에서 일반적인 수량 표현으로 옮기되, 인원 문맥을 분명히 하기 위해 ‘명’을 보완했습니다.
