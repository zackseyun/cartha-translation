source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
  footnotes:
  - marker: a
    text: Or 'cords' for 'ropes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all that is to be done for them.' The Hebrew may refer either to tasks done with these items or tasks done for them in the course of service.
    reason: alternative_reading
translation:
  language: ko
  text: 또 뜰의 휘장들과 회막과 제단 주위를 둘러싼 뜰의 문 어귀를 가리는 휘장, 그것들에 딸린 줄들, 그들의 봉사에 필요한 모든 기구, 그리고 그것들을 가지고 해야 할 모든 일입니다. 그들은 이 직무를 수행해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄들’은 ‘끈들’ 또는 ‘밧줄들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것들을 가지고 해야 할 모든 일’은 ‘그것들을 위해 해야 할 모든 일’로도 이해할 수 있습니다. 히브리어는 이 물품들을 사용하여 수행하는 일인지, 그 물품들을 위해 수행하는 일인지에 여지를 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי הֶחָצֵר
  english_pob_choice: hangings of the court
  chosen_korean: 뜰의 휘장
  alternatives_korean:
  - 뜰의 휘장들
  - 뜰의 막
  lexicon: HALOT
  rationale: 성막 문맥에서 החצר의 둘레를 이루는 직물류를 자연스럽게 옮기되, ‘휘장’으로 텍스타일 장치를 살렸습니다.
- source_word: מָסַךְ פֶּתַח שַׁעַר הֶחָצֵר
  english_pob_choice: the screen for the entrance of the gate of the court
  chosen_korean: 뜰의 문 어귀의 휘장
  alternatives_korean:
  - 뜰 문 입구의 가림막
  - 뜰의 대문 어귀의 휘장
  lexicon: HALOT
  rationale: 문/어귀/휘장의 구조를 유지하면서도 현대 한국어에서 이해 가능한 형태로 정리했습니다. ‘screen’을 ‘휘장’으로 처리해 앞 구의 ‘hangings’와 구별되는 기능적 장치를 드러냈습니다.
- source_word: מֵיתְרֵיהֶם
  english_pob_choice: their ropes
  chosen_korean: 그들의 줄
  alternatives_korean:
  - 그들의 밧줄
  - 그들의 끈
  lexicon: HALOT
  rationale: POB의 문맥상 묶고 지탱하는 끈/줄을 가리키므로, 성막 용품에 과도하게 무거운 느낌을 주지 않는 ‘줄’을 택했습니다.
- source_word: כְּלֵי עֲבֹדָתָם
  english_pob_choice: all the equipment for their service
  chosen_korean: 그들의 모든 봉사에 쓰는 기구
  alternatives_korean:
  - 그들의 모든 봉사용 기구
  - 그들의 모든 섬김에 필요한 기물
  lexicon: HALOT
  rationale: כֵּלִים의 넓은 범위를 ‘기구’로, עֲבֹדָה를 성막 봉사의 기능으로 살려 옮겼습니다. ‘봉사’는 제의적 노동의 뉘앙스를 유지합니다.
- source_word: וְעָבָדוּ
  english_pob_choice: And they shall serve
  chosen_korean: 그들은 섬겨야 합니다
  alternatives_korean:
  - 그들은 봉사해야 합니다
  - 그들은 섬길 것입니다
  lexicon: HALOT
  rationale: 마지막 절의 결론적 직무 수행을 드러내면서, 성막 섬김의 제의적 의미를 한국어 ‘섬기다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 동사의 미래/의무 뉘앙스
  chosen_reading: ‘그들은 섬겨야 합니다’로 옮겨, 단순 미래 진술보다 위임된 직무 수행의 당위성을 드러냈습니다.
  alternative_readings:
  - 그들은 섬길 것입니다
  - 그들은 섬깁니다
  rationale: 히브리어 완료·미완료의 문맥상 여기서는 레위인에게 부과된 직무를 서술하므로, 한국어에서 의무/사명성을 약하게 반영하는 표현이 적절합니다.
  doctrine_reference: 민수기 4장 레위인의 성막 직무 분담
- issue: ‘봉사’의 제의적 의미
  chosen_reading: 일상적 친교 봉사가 아니라 성막에서의 제의적 섬김을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 봉사
  - 섬김
  - 일
  rationale: 문맥이 성소 기물의 운반·관리와 직접 연결되므로, 교회적 의미로 순화하지 않고 제의적 노동의 성격을 보존했습니다.
  doctrine_reference: 레위기·민수기의 성막 봉사 전통
