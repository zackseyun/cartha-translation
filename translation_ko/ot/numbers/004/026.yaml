revisions:
- from: 그리고 뜰의 휘장과, 회막과 제단을 둘러싼 뜰의 문 어귀의 휘장, 그들의 줄과, 그들의 모든 봉사에 쓰는 기구와, 그들에게 해야 할 모든 일을; 그들은 섬겨야 합니다.[a][b]
  to: 또 뜰의 휘장들과 회막과 제단 주위를 둘러싼 뜰의 문 어귀를 가리는 휘장, 그것들에 딸린 줄들, 그들의 봉사에 필요한 모든 기구, 그리고 그것들을 가지고 해야 할 모든 일입니다. 그들은 이 직무를 수행해야 합니다.[a][b]
  rationale: 수정은 לָהֶם의 지시 대상을 바로잡고 그 해석상의 여지를 각주에 보존합니다. 또한 מָסָךְ의 가림 기능을 자연스러운 한국어로 드러내고, 종결 동사를 성막 직무 수행의 지시로 명확히 했습니다. ‘이 직무’는 문맥상 열거된 운반·관리 업무를 가리키며, 별도의 교리적 해석을 더하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:56Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 뜰의 휘장, 뜰 문 입구의 가림막, 줄, 봉사용 기구라는 열거를 대체로 충실히 반영합니다. 그러나 כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם의 לָהֶם을 본문의 ‘그들에게 해야 할’로 옮기면 열거된 물품이 아니라 사람들에게 해야 하는 일로 이해되어 문맥과 맞지 않습니다. 본문은 물품을 가지고 수행하는 일을 택하고, ‘물품을 위해’라는 가능한 대안은 각주로 보존하는 편이 안전합니다. 마지막 וְעָבָדוּ는 직무 지시 문맥에서 수행 의무를 나타내므로 ‘수행해야 합니다’가 자연스럽습니다.
  naturalness: ‘뜰의 문 어귀의 휘장’은 소유·수식 관계가 연속되어 다소 부자연스럽습니다. ‘뜰의 문 어귀를 가리는 휘장’으로 하면 מָסָךְ의 기능과 현대 한국어의 자연스러움을 함께 살릴 수 있습니다. 열거의 끝은 한국어 문장 구조에 맞게 종결하고 마지막 직무 지시를 별문장으로 처리했습니다.
  terminology: ‘회막’, ‘제단’, ‘뜰’, ‘휘장’, ‘봉사’는 성막 문맥에 적절합니다. מֵיתְרֵיהֶם은 단순한 ‘줄’보다 고정·지지용 성격을 드러내는 ‘줄들’로 옮길 수 있으며, 각주에서 ‘끈’이라는 어휘 대안을 제공합니다. 마지막 동사는 특정 교파적 의미의 ‘섬김’보다 성막의 맡은 노동을 가리키는 ‘직무를 수행하다’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그들에게 해야 할 모든 일’이 לָהֶם의 지시 대상을 사람으로 바꿉니다.
    rationale: 문맥상 앞서 열거된 휘장·가림막·줄·기구와 관련하여 수행할 일을 가리킵니다. 히브리어 전치사 לְ는 ‘그것들을 가지고/그것들에 관하여’ 또는 ‘그것들을 위해’로 논의될 수 있으나, ‘그들에게’는 부정확합니다.
  - severity: medium
    issue: 각주 b가 본문과 다른 대안을 충분히 제시하지 못합니다.
    rationale: 본문을 ‘그것들을 가지고 해야 할 모든 일’로 바로잡는 경우, 대안은 ‘그것들을 위해 해야 할 모든 일’이어야 히브리어의 가능한 해석 범위를 보존합니다.
  - severity: low
    issue: ‘뜰의 문 어귀의 휘장’은 현대 한국어에서 수식 연쇄가 무겁습니다.
    rationale: ‘뜰의 문 어귀를 가리는 휘장’이 같은 기능과 관계를 더 명확하고 자연스럽게 전달합니다.
