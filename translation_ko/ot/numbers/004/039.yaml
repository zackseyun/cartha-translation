lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  english_pob_choice: from thirty years old and upward
  chosen_korean: 서른 살부터
  alternatives_korean:
  - 서른 살 이상부터
  - 서른 살부터 위로
  lexicon: HALOT
  rationale: 히브리어 관용구는 최소 연령을 표시하므로, 현대 한국어에서는 자연스러운 ‘서른 살부터’로 옮기되 상한과 짝을 이루는 구조를 유지했습니다.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: up to fifty years old
  chosen_korean: 쉰 살까지
  alternatives_korean:
  - 쉰 살에 이르기까지
  - 쉰 살에 이르도록
  lexicon: HALOT
  rationale: 상한 연령을 간결하고 명료하게 표시하기 위해 ‘쉰 살까지’로 옮겼습니다.
- source_word: כָּל הַבָּא לַצָּבָא
  english_pob_choice: everyone who enters the service
  chosen_korean: 복무에 들어오는 사람은 모두
  alternatives_korean:
  - 그 복무에 들어오는 사람은 모두
  - 봉사에 들어오는 사람은 모두
  lexicon: HALOT
  rationale: צָבָא를 군대보다 제도화된 레위인의 배치·복무로 보아 ‘복무’로 옮겼고, בוא는 직역보다 자연스러운 ‘들어오는’으로 살렸습니다.
- source_word: לַעֲבֹדָה בְּאֹהֶל מוֹעֵד
  english_pob_choice: for the work in the tent of meeting
  chosen_korean: 곧 회막에서 일하기 위해
  alternatives_korean:
  - 곧 회막에서 하는 일을 위해
  - 회막 안에서 일하는 일을 위해
  lexicon: HALOT
  rationale: עֲבֹדָה는 단순한 업무보다 실제 수행되는 일을 가리키므로 ‘일하기 위해’로 옮겼고, בְּאֹהֶל מוֹעֵד는 통상적인 ‘회막’으로 번역했습니다.
theological_decisions:
- issue: צָבָא와 עֲבֹדָה의 관계
  chosen_reading: ‘복무’와 ‘일하기 위해’를 구분해, 조직된 레위 봉사와 실제 노동을 함께 드러냈습니다.
  alternative_readings:
  - ‘군역’과 ‘봉사’를 함께 쓰는 방식
  - 둘 다 ‘봉사’로 평준화하는 방식
  rationale: 문맥상 ռազմական적 ‘군대’보다 성막 봉직에 대한 정해진 복무가 중심이므로, 두 용어를 동일화하지 않고 각각의 뉘앙스를 살렸습니다.
  doctrine_reference: 민수기 4장의 레위인 직무 규정
