base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
  footnotes:
  - marker: a
    text: Or 'for an instant.' The Hebrew expression is idiomatic and may refer to seeing the holy things only briefly, or while they are being covered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성물들을 잠깐이라도 보려고 들어가서는 안 됩니다. 그렇지 않으면 죽습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “순간이라도.” 히브리어 표현은 관용적이며 해석이 어렵습니다. 이는 성물들을 아주 잠깐만 보는 것을 뜻할 수도 있고, 성물들을 덮는 동안에 보는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָבֹאוּ
  english_pob_choice: But they must not go in
  chosen_korean: 그들은 … 들어가서는 안 됩니다
  alternatives_korean:
  - 그들은 … 들어가면 안 됩니다
  - 그들은 … 들어가지 말아야 합니다
  lexicon: HALOT
  rationale: 접속사와 부정의 금지 명령을 현대 한국어의 자연스러운 금지 표현으로 옮겼습니다. "들어가서는 안 됩니다"가 문맥의 엄중한 금지를 가장 직접적으로 드러냅니다.
- source_word: לִרְאֹת
  english_pob_choice: to look at
  chosen_korean: 보러
  alternatives_korean:
  - 보기 위해
  - 쳐다보러
  lexicon: HALOT
  rationale: 단순한 시각 인지가 아니라 의도적으로 눈을 두는 행위를 가리키므로, "보러"가 간결하면서도 목적성을 살립니다.
- source_word: כְבַלַּע
  english_pob_choice: for even a moment
  chosen_korean: 잠깐이라도
  alternatives_korean:
  - 순간이라도
  - 한순간이라도
  lexicon: HALOT
  rationale: 히브리어 표현은 관용적으로 매우 짧은 시간을 가리키므로, "잠깐이라도"가 한국어에서 가장 자연스럽게 그 긴박성을 전달합니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: the holy things
  chosen_korean: 성물들
  alternatives_korean:
  - 거룩한 것들
  - 거룩한 물건들
  - 성스러운 물건들
  lexicon: HALOT
  rationale: 문맥상 장막의 기구들과 덮개 등 구체적이고 집합적인 대상을 가리키므로, 전통적이면서도 대상성을 분명히 하는 "성물들"을 택했습니다.
theological_decisions:
- issue: 위반 시 죽음의 경고 표현
  chosen_reading: 그렇지 않으면 죽습니다
  alternative_readings:
  - 죽게 됩니다
  - 죽을 것입니다
  - 죽으리라
  rationale: 본문은 금지 위반에 따르는 직접적 경고를 제시하므로, 완곡함을 줄인 "죽습니다"가 경고의 긴박성을 잘 보존합니다.
  doctrine_reference: 언약적 거룩성과 접근 제한의 경고(민수기 4장 문맥)
- issue: הַקֹּדֶשׁ의 지시 대상
  chosen_reading: 장소가 아니라 성물들의 집합적 지시
  alternative_readings:
  - 성소
  - 성물
  - 거룩한 것
  rationale: 주변 문맥이 회막 기구의 덮음과 운반을 다루므로, 장소인 "성소"보다 집합적 대상인 "성물들"이 본문의 구체성을 더 정확히 반영합니다.
  doctrine_reference: 민수기 4장의 레위인 직무와 거룩성 경계
