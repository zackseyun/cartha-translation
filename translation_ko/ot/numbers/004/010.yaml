id: NUM.4.10
reference: Numbers 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתְנ֤וּ אֹתָ/הּ֙ וְ/אֶת כָּל כֵּלֶ֔י/הָ אֶל מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
  footnotes:
  - marker: a
    text: Hebrew תַּחַשׁ (tachash) is uncertain; it may refer to a particular animal skin or to a kind of durable leather. Traditional renderings include 'porpoise skin' or similar identifications.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것과 그 모든 기구를 가죽 덮개 안에 넣고, 그것을 운반용 막대 위에 놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַּחַשׁ(tachash)의 정확한 의미는 확실하지 않습니다. 특정 동물의 가죽을 가리킬 수도 있고, 내구성 있는 가죽의 한 종류를 가리킬 수도 있습니다. 전통적으로는 ‘돌고래 가죽’ 또는 이와 유사한 것으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  english_pob_choice: they shall put / they shall place
  chosen_korean: 넣고, … 두십시오
  alternatives_korean:
  - 넣으십시오
  - 두십시오
  - 놓으십시오
  lexicon: HALOT
  rationale: 절차 지시의 연속 동사를 한국어에서는 자연스럽게 이어 주어 앞 동작은 ‘넣고’, 다음 단계는 ‘두십시오’로 옮겨 순서를 살렸습니다.
- source_word: כָּל כֵּלֶיהָ
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 기구들
  - 그 모든 도구
  lexicon: HALOT
  rationale: 성막 문맥의 כֵּלִים은 단순한 도구보다 예배용 장비·기구의 범위가 맞아 ‘기구’가 가장 간결하고 정확합니다.
- source_word: עוֹר תָּחַשׁ
  english_pob_choice: fine leather
  chosen_korean: fine leather로 만든 덮개
  alternatives_korean:
  - 두꺼운 가죽으로 만든 덮개
  - 택하시 가죽으로 만든 덮개
  - 가죽 덮개
  lexicon: HALOT
  rationale: תָּחַשׁ의 정확한 동물은 불확실하므로 POB의 결정처럼 특정 동물을 단정하지 않고, 기능을 드러내는 ‘덮개’와 질감/재질 표지인 ‘fine leather’는 음역 유지 대신 설명적으로 처리했습니다.
- source_word: עַל הַמּוֹט
  english_pob_choice: on the carrying frame
  chosen_korean: 운반용 막대 위에
  alternatives_korean:
  - 운반용 틀 위에
  - 운반 막대 위에
  - 메는 막대 위에
  lexicon: HALOT
  rationale: מּוֹט는 운반에 쓰는 막대/장대이므로, 단수 이미지를 살리되 기능을 분명히 하는 ‘운반용 막대’가 가장 직접적입니다.
theological_decisions:
- issue: 예물 기구의 취급 방식과 성소 물건의 거룩성
  chosen_reading: ‘넣고’와 ‘운반용 막대 위에 두십시오’로 옮겨, 감싸서 보호한 뒤 정해진 방식으로 운반하게 하는 절차성을 드러냈습니다.
  alternative_readings:
  - ‘싸서 막대에 메십시오’
  - ‘덮개에 넣어 운반하십시오’
  rationale: 이 절은 신학적 해설보다 제의적 절차가 핵심이므로, 물건을 임의로 다루지 않고 정해진 운반 질서를 따르게 하는 의미를 보존했습니다.
  doctrine_reference: 민수기 4장의 성막 기구 운반 규정
