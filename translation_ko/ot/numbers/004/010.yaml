  source_fidelity: 히브리어는 앞 절의 등잔대를 가리키는 여성 단수 목적어와 그 기구들을 תחש 가죽 덮개 안에 넣은 뒤 운반용 막대(단수) 위에 놓는 순차적 절차를 말합니다. 초안의 절차와 ‘운반용 막대’는 대체로 충실하지만, 영어 표현 ‘fine leather’를 한국어 문장에 그대로 남긴 것은 번역문으로 부적절합니다. 또한 원문의 3인칭 복수 절차 지시를 2인칭 명령형 ‘두십시오’로 바꾼 것은 화자와 행위자를 변경합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 ‘그들은 … 놓아야 합니다’가 본문의 비인칭적·규정적 절차 지시를 자연스럽게 보존합니다. ‘가죽 덮개 안에’는 한국어로 매끄러우며, 불확실한 어휘를 본문에서 과도하게 특정하지 않습니다.
  terminology: ‘기구’와 ‘운반용 막대’는 성막 기물과 מוֹט의 운반 기능을 적절히 나타냅니다. תַּחַשׁ의 지시 대상은 불확실하므로 본문은 ‘가죽 덮개’로 절제하고, 각주에서 불확실성과 가능한 이해를 밝혀야 합니다.
