id: NUM.4.14
reference: Numbers 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
  footnotes:
  - marker: a
    text: Or 'a covering of goatskin,' 'a covering of porpoise skin,' or more generally 'a covering of durable leather.' The Hebrew term for the animal/hide (taḥash) is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 위에 거기서 봉사하는 데 쓰는 모든 기구들, 곧 불판, 갈고리, 삽, 대접들—곧 제단의 모든 기구들—을 놓고, 그 위에 해달 가죽 덮개를 펴고 그 채를 꽂아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַּחַשׁ의 정확한 동물 정체는 확실하지 않습니다. ‘해달 가죽’ 외에도 ‘염소가죽’, ‘돌고래 가죽’, 또는 더 일반적으로 ‘질긴 가죽’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  english_pob_choice: Then they shall place on it
  chosen_korean: 그들은 그 위에 ...을 놓고
  alternatives_korean:
  - 그들은 그 위에 ...을 두고
  - 그들은 그 위에 ...을 얹고
  lexicon: HALOT
  rationale: 지시적 절차 문맥의 연속 동사를 한국어에서 자연스럽게 살리기 위해 ‘놓고’로 옮겼습니다.
- source_word: כָּל כֵּלָיו / כֹּל כְּלֵי הַמִּזְבֵּחַ
  english_pob_choice: all its utensils / all the utensils of the altar
  chosen_korean: 모든 기구들 ... 제단의 모든 기구들
  alternatives_korean:
  - 모든 기물들
  - 모든 도구들
  lexicon: HALOT
  rationale: 제의용 כלי는 일반 ‘도구’보다 ‘기구’가 더 공적·의례적이며, 앞뒤 반복도 원문의 포괄적 열거를 반영합니다.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  english_pob_choice: with which they minister at it
  chosen_korean: 거기서 봉사하는 데 쓰는
  alternatives_korean:
  - 그 위에서 섬기는 데 쓰는
  - 그 위에서 직무를 수행하는
  lexicon: HALOT
  rationale: שרת의 제의적 ‘봉사/섬김’ 의미를 살리면서, 현대 한국어에서 자연스러운 용법인 ‘쓰는 데’ 구조로 기능을 드러냈습니다.
- source_word: עֹור תַּחַשׁ
  english_pob_choice: a covering of fine leather
  chosen_korean: 해달 가죽 덮개
  alternatives_korean:
  - 달팽이 바다짐승 가죽 덮개
  - 질긴 가죽 덮개
  - 고운 가죽 덮개
  lexicon: HALOT
  rationale: תַּחַשׁ의 동물/가죽 정체가 불확실하므로, 본문 의미를 과도하게 해석하지 않으면서 POB의 lexical note에 따라 대표적 가능성 중 하나를 옮겼습니다.
- source_word: וְשָׂמוּ בַדָּיו
  english_pob_choice: and put its poles in place
  chosen_korean: 그 채를 꽂아야 합니다
  alternatives_korean:
  - 그 채를 제자리에 두어야 합니다
  - 그 운반채를 꽂아야 합니다
  lexicon: HALOT
  rationale: בַּדִּים는 운반용 채이므로 ‘채’로 옮기고, 제의 기구의 조립·운반 준비를 한국어 동사 ‘꽂다’로 간결하게 표현했습니다.
theological_decisions:
- issue: 제의용 כלי와 שרת의 번역 톤
  chosen_reading: 성막/제단 문맥의 기술적 지시로 보고, 의례적 기능이 드러나는 ‘기구’와 ‘봉사’를 사용했습니다.
  alternative_readings:
  - 더 중성적인 ‘도구/쓰는 일’로 완화하기
  - 전통 교회어인 ‘그릇/섬기다’로 통일하기
  rationale: 본문은 단순한 물건 목록이 아니라 제단 봉사용 물품의 규정이므로, 기능성과 성스러운 업무성을 함께 드러내는 표현이 적절합니다.
  doctrine_reference: 민수기 4장의 성막 봉사 규정
- issue: תַּחַשׁ의 미확정성
  chosen_reading: 확정적 동물명 대신 원문의 불확실성을 반영하는 번역을 택했습니다.
  alternative_readings:
  - ‘고운 가죽’처럼 재질 중심으로만 옮기기
  - 주석 없이 특정 동물로 단정하기
  rationale: 히브리어 어휘 자체가 불확실하므로, 본문 번역에서 단정적 독해를 피하고 주석으로 그 범위를 밝혀야 합니다.
  doctrine_reference: 사전적·주석적 보존 원칙
