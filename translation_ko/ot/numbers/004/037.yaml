id: NUM.4.37
reference: Numbers 4:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
  footnotes:
  - marker: a
    text: Or 'through Moses' for 'by the hand of Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 회중의 tent of meeting에서 섬기는 모든 사람과 함께 고핫 사람들의 가족들 가운데서 계수된 자들이었습니다. 모세와 아론이 야훼의 명령에 따라 모세의 손을 통해 계수한 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모세를 통해'.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  english_pob_choice: the counted men
  chosen_korean: 계수된 자들
  alternatives_korean:
  - 센 사람들
  - 번호 매겨진 자들
  - 조사된 자들
  lexicon: HALOT
  rationale: 인구 조사 맥락의 פָּקַד를 살려 결과 상태를 나타내는 표현으로 옮겼습니다. '계수된 자들'은 문맥상 자연스럽고 형식도 유지합니다.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  english_pob_choice: the families of the Kohathites
  chosen_korean: 고핫 사람들의 가족들
  alternatives_korean:
  - 고핫 자손들의 가족들
  - 고핫 사람들의 씨족들
  lexicon: HALOT
  rationale: מִשְׁפָּחֹת는 가족 집단/씨족을 가리키므로 '가족들'로 옮겼고, קְהָתִי는 고핫 계열 집단을 뜻해 '고핫 사람들'로 자연스럽게 표현했습니다.
- source_word: כָּל הָעֹבֵד בְּאֹהֶל מוֹעֵד
  english_pob_choice: everyone serving in the tent of meeting
  chosen_korean: 회중의 tent of meeting에서 섬기는 모든 사람
  alternatives_korean:
  - 회막에서 섬기는 모든 사람
  - 만남의 장막에서 섬기는 모든 사람
  lexicon: HALOT
  rationale: בְּאֹהֶל מוֹעֵד는 통상 '회막' 또는 '만남의 장막'으로 옮기지만, 본문은 임무 수행 장소를 나타내므로 직역성을 살린 'tent of meeting'을 그대로 두었습니다. '섬기는 모든 사람'은 כָּל הָעֹבֵד의 집합적 뜻을 반영합니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 지시에 따라
  lexicon: HALOT
  rationale: '''입의 따라''라는 관용구를 한국어로 자연스럽게 풀되, 단순한 정보 전달이 아니라 권위 있는 명령임을 드러내기 위해 ''명령에 따라''를 택했습니다.'
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개성과 대행성을 살리면서도 한국어에서 과도하게 낯설지 않게 하려면 '모세의 손을 통해'가 가장 균형적입니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신명기적/제사장적 서술 속에서 신성명 יְהוָה를 직접 사용하므로, 본 프로젝트 원칙에 따라 고유명 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בְּיַד מֹשֶׁה의 대행성
  chosen_reading: 모세의 손을 통해
  alternative_readings:
  - 모세를 통해
  - 모세의 손으로
  rationale: '''손''은 단순 신체 부위가 아니라 매개된 실행을 나타내는 표현이므로, 문맥의 권위와 중개를 함께 보존했습니다.'
  doctrine_reference: Numbers 4:37 mediation/agency idiom
