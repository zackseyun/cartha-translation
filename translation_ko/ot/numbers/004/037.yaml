  naturalness: '''회막에서 섬기는 고핫 자손들의 씨족들에 속한 모든 이들''은 현대 표준 한국어에서 자연스럽고, 원문의 수식 관계를 무리 없이 반영합니다. 두 문장으로 나누어 중복된 ''계수하다''도 원문대로 유지했습니다.'
  terminology: אָהֶל מוֹעֵד는 통용되고 자연스러운 '회막'으로, קְהָתִי는 '고핫 자손들'로, יְהוָה는 프로젝트 원칙에 따라 '야훼'로 옮겼습니다. בְּיַד מֹשֶׁה는 한국어 관용에 맞게 '모세를 통하여'로 번역하고 대안을 각주에 제시했습니다.
