revisions:
- from: 이것들은 회중의 tent of meeting에서 섬기는 모든 사람과 함께 고핫 사람들의 가족들 가운데서 계수된 자들이었습니다. 모세와 아론이 야훼의 명령에 따라 모세의 손을 통해 계수한 자들입니다.[a]
  to: 이들은 회막에서 섬기는 고핫 자손들의 씨족들에 속하여 계수된 모든 이들입니다. 모세와 아론이 야훼의 명령에 따라 모세를 통하여 그들을 계수하였습니다.[a]
  rationale: 원문에 없는 '회중의'를 삭제하고, 남아 있던 영어를 '회막'으로 완역했습니다. 고핫 계열의 가족 집단을 한국어 성경 문맥에 맞는 '씨족들'로 옮겼으며, 계수 대상과 회막 봉사의 관계를 명확히 했습니다. 원문의 반복된 계수 동사와 모세를 통한 매개 표현도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:52Z'
