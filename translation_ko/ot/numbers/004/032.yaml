  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
  footnotes:
  - marker: a
    text: 'Or, more smoothly: ''you shall assign by name the equipment each man is responsible to carry.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주변 뜰의 기둥들과 그들의 받침대와 그들의 말뚝들과 그들의 줄들과, 그들의 모든 장비와 그들의 모든 직무를 따라, 그리고 이름들을 따라 너희는 그 물건들을 직무와 운반의 물건으로 지정해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 더 자연스럽게: “각 사람이 책임지고 운반할 장비를 이름별로 지정해야 합니다.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  english_pob_choice: the pillars of the surrounding court
  chosen_korean: 주변 뜰의 기둥들
  alternatives_korean:
  - 뜰 둘레의 기둥들
  - 뜰을 둘러싼 기둥들
  lexicon: HALOT
  rationale: עַמּוּדֵי는 구조물의 기둥/주를 가리키며, הֶחָצֵר סָבִיב는 뜰을 둘러싼 배치를 뜻하므로 간결하게 ‘주변 뜰의 기둥들’로 옮겼습니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their bases
  chosen_korean: 그들의 받침대
  alternatives_korean:
  - 그들의 소켓
  - 그들의 주초
  lexicon: HALOT
  rationale: 성막 구조물 문맥에서 אֶדֶן은 기둥을 지탱하는 받침/소켓을 뜻하므로, 현대 한국어에서 이해하기 쉬운 ‘받침대’를 택했습니다.
- source_word: יְתֵדֹתָם וּמֵיתְרֵיהֶם
  english_pob_choice: their pegs ... their cords
  chosen_korean: 그들의 말뚝들과 그들의 줄들
  alternatives_korean:
  - 그들의 말뚝들과 그들의 밧줄들
  - 그들의 말뚝들과 그들의 끈들
  lexicon: HALOT
  rationale: יַתֵד는 성막을 고정하는 말뚝/못에 가깝고, מֵיתָר는 줄/끈/밧줄을 뜻하므로, 구조물 고정의 기능을 살려 ‘말뚝’과 ‘줄’로 옮겼습니다.
- source_word: בְשֵׁמֹת תִּפְקְדוּ
  english_pob_choice: you shall assign by name
  chosen_korean: 이름들을 따라 너희는 ... 지정해야 합니다
  alternatives_korean:
  - 이름별로 너희는 ... 지정해야 합니다
  - 이름을 불러 너희는 ... 임명해야 합니다
  lexicon: HALOT
  rationale: פקד는 여기서 단순 계산보다 책임 배분/지정을 뜻하므로, ‘이름들을 따라’라는 표현으로 인별 지정의 뉘앙스를 살려 옮겼습니다.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  english_pob_choice: the items of the duty of their burden
  chosen_korean: 그 물건들을 직무와 운반의 물건으로
  alternatives_korean:
  - 그 운반 책임의 물건들로
  - 그들이 맡아 나를 물건들로
  lexicon: HALOT
  rationale: כְּלֵי, מִשְׁמֶרֶת, מַשָּׂא의 압축된 결합을 한국어에서 자연스럽게 풀어, 각 사람이 맡아 운반할 성막 물건이라는 의미가 드러나도록 했습니다.
theological_decisions:
- issue: 성막 기구의 배분을 ‘이름들을 따라’ 지정하는 의미
  chosen_reading: 단순한 목록 작성이 아니라, 각 사람에게 운반 책임을 개별적으로 부여하는 명령으로 읽었습니다.
  alternative_readings:
  - 그냥 인명부대로 계산하는 지시
  - 공적 예식용 호명으로 보는 읽기
  rationale: 문맥상 레위인의 직무 분담을 위한 지정이므로, פקד의 기능을 책임 배분으로 이해하는 것이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: 민수기 4장 레위인 직무 분담 문맥
