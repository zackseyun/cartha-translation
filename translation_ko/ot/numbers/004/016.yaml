id: NUM.4.16
reference: Numbers 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
  footnotes:
  - marker: a
    text: Or 'charge' or 'responsibility' for פְקֻדַּת; the Hebrew term denotes assigned supervision.
    reason: lexical_alternative
  - marker: b
    text: '''The regular grain offering'' could also be rendered ''the continual grain offering.'''
    reason: lexical_alternative
  - marker: c
    text: '''In the sanctuary'' may also be rendered ''in the holy place,'' though here it likely refers more broadly to the holy area and its sacred objects.'
    reason: lexical_alternative
  - marker: d
    text: '''Furnishings'' may also be translated ''vessels'' or ''utensils.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 엘르아살 곧 아론의 아들의 제사장의 책임은 등잔을 위한 기름[a], 향기로운 향[b], 정기적인 곡식제물[c], 그리고 관유입니다. 곧 온 장막과 그 안에 있는 모든 것[d]—성소와 그 기구들—에 대한 책임입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름’은 문자적으로 ‘빛의 기름’이며, 등잔에 쓰는 기름을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 향’은 향료로 만든 향을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정기적인’은 ‘항상/지속적인’의 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그 안에 있는 모든 것’은 성막 내부의 소지품·기구들을 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  english_pob_choice: oversight
  chosen_korean: 책임
  alternatives_korean:
  - 감독
  - 관리
  - 맡은 일
  lexicon: HALOT
  rationale: 제사장 엘르아살에게 맡겨진 관리·감독의 직분을 한국어로 가장 자연스럽게 드러내면서도, 단순한 임명이 아니라 맡겨진 책임이라는 점을 살렸습니다.
- source_word: שֶׁמֶן הַמָּאוֹר
  english_pob_choice: the oil for the light
  chosen_korean: 등잔을 위한 기름
  alternatives_korean:
  - 등불 기름
  - 조명을 위한 기름
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘빛/등잔을 위한 기름’의 관계를 보존했고, 성막 문맥에서 등잔의 기름을 자연스럽게 나타냅니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료로 만든 향
  - 향내 나는 향
  lexicon: HALOT
  rationale: 향료로 조합된 분향을 가리키므로 ‘향기로운’으로 의미를 살렸고, 현대 한국어에서 문맥상 자연스럽게 읽히도록 했습니다.
- source_word: מִנְחַת הַתָּמִיד
  english_pob_choice: the regular grain offering
  chosen_korean: 정기적인 곡식제물
  alternatives_korean:
  - 항상 드리는 곡식제물
  - 지속적인 곡식제물
  lexicon: HALOT
  rationale: מִנְחָה를 ‘곡식제물’로 옮겨 제의적 의미를 분명히 했고, תָּמִיד의 반복·지속성을 ‘정기적인’으로 표현했습니다.
- source_word: כָּל הַמִּשְׁכָּן וְכָל אֲשֶׁר בּוֹ
  english_pob_choice: the whole tabernacle and all that is in it
  chosen_korean: 온 장막과 그 안에 있는 모든 것
  alternatives_korean:
  - 온 성막과 그 안의 모든 것
  - 장막 전체와 그 안에 있는 모든 것
  lexicon: HALOT
  rationale: מִשְׁכָּן은 여기서 성막/장막을 가리키므로, 전체 범위를 살리기 위해 ‘온 장막’으로 옮겼습니다. ‘그 안에 있는 모든 것’은 히브리어 יחס절을 직접 반영합니다.
theological_decisions:
- issue: 성막 관련 항목들의 결합 방식
  chosen_reading: 엘르아살의 책임은 먼저 제의 물품들에, 더 넓게는 온 장막과 그 모든 소유물에까지 미치는 것으로 읽었습니다.
  alternative_readings:
  - 첫 절반과 끝 절반을 단순 동격으로 보아 하나의 목록으로만 읽는 해석
  - ‘성소와 그 기구들’을 별도 장소 정보로만 처리하는 해석
  rationale: 히브리어는 명사구가 연이어 제시되어 책임의 범위를 점층적으로 넓히는 구조입니다. 한국어에서는 이를 ‘곧’과 대시로 풀어 주어 목록과 총괄 설명이 함께 보이도록 했습니다.
  doctrine_reference: 민수기 4장의 레위인 직무 분배
