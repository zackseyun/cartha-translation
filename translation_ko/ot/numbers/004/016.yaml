theological_decisions:
- issue: 성막 관련 항목들의 결합 방식
  chosen_reading: 엘르아살의 책임은 먼저 제의 물품들에, 더 넓게는 온 장막과 그 모든 소유물에까지 미치는 것으로 읽었습니다.
  alternative_readings:
  - 첫 절반과 끝 절반을 단순 동격으로 보아 하나의 목록으로만 읽는 해석
  - ‘성소와 그 기구들’을 별도 장소 정보로만 처리하는 해석
  rationale: 히브리어는 명사구가 연이어 제시되어 책임의 범위를 점층적으로 넓히는 구조입니다. 한국어에서는 이를 ‘곧’과 대시로 풀어 주어 목록과 총괄 설명이 함께 보이도록 했습니다.
  doctrine_reference: 민수기 4장의 레위인 직무 분배
