source:
  edition: WLC
  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
  footnotes:
  - marker: a
    text: Or 'the Holy of Holies' / 'the most holy place.' Here the phrase likely refers to the holiest sacred objects rather than the inner sanctuary itself, given the context of carrying duties.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'man by man,' a distributive expression meaning each individual was assigned his own service and load.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 지극히 거룩한 것들[a]에 가까이 갈 때에 살아서 죽지 않도록, 그들을 위해 이렇게 하십시오. 아론과 그의 아들들은 와서 각 사람[b]에게 자기 직무와 자기가 질 짐을 맡겨야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 여기서 ‘지성소’라는 장소보다 거룩한 운반 대상들을 가리킬 가능성이 높습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘사람마다’라는 분배적 표현으로, 각 개인에게 자기 책임이 따로 배정됨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  english_pob_choice: But do this for them
  chosen_korean: 그러나 그들을 위해 이렇게 하십시오
  alternatives_korean:
  - 그리고 이것을 그들에게 행하십시오
  - 그러니 그들에게 이렇게 하십시오
  lexicon: HALOT
  rationale: 명령문 앞의 전환과 혜택 대상(לָהֶם)을 살려 자연스러운 지시문으로 옮겼습니다.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  english_pob_choice: so that they may live and not die
  chosen_korean: 그러면 그들이 살아서 죽지 않을 것입니다
  alternatives_korean:
  - 그래서 그들이 살고 죽지 않을 것입니다
  - 그들이 살아서 죽지 않게 하십시오
  lexicon: HALOT
  rationale: 의도된 결과를 나타내는 문맥이므로 목적/결과를 드러내되, 한국어에서는 미래 진술로 자연스럽게 표현했습니다.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the most holy things
  chosen_korean: 지극히 거룩한 것들
  alternatives_korean:
  - 지성소
  - 가장 거룩한 곳
  lexicon: HALOT
  rationale: 문맥이 장소가 아니라 운반되는 거룩한 대상들을 가리키므로, ‘지성소’보다 ‘거룩한 것들’이 원문의 지시 대상을 더 정확히 반영합니다.
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  english_pob_choice: shall come and assign each man
  chosen_korean: 와서 각 사람을 … 맡겨야 합니다
  alternatives_korean:
  - 와서 각 사람을 … 임명해야 합니다
  - 와서 각 사람을 … 배정해야 합니다
  lexicon: HALOT
  rationale: אִישׁ אִישׁ의 분배적 반복을 ‘각 사람’으로 살리고, 행정적 배분 의미를 한국어에서 가장 무리 없이 드러내는 ‘맡기다’를 택했습니다.
- source_word: עַל עֲבֹדָתוֹ וְאֶל מַשָּׂאוֹ
  english_pob_choice: to his service and to his load
  chosen_korean: 그의 직무와 그의 짐에 따라
  alternatives_korean:
  - 그의 봉사와 그의 짐에 따라
  - 그의 일과 그의 짐에 따라
  lexicon: HALOT
  rationale: עֲבֹדָה는 성소 봉사 맥락에서 ‘직무’가 적절하고, מַשָּׂא 는 운반할 물건/짐의 구체성을 살려 ‘짐’으로 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים의 지시 대상
  chosen_reading: ‘지극히 거룩한 것들’로 옮겨, 내부 공간보다 거룩한 운반 대상들을 가리키는 읽기를 따랐습니다.
  alternative_readings:
  - 지성소
  - 가장 거룩한 곳
  rationale: 문맥상 고핫 자손이 담당하는 것은 성막 내부 공간 자체가 아니라 제사장들이 덮은 뒤 운반하는 성물들이므로, 장소화된 번역은 의미를 좁힐 수 있습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: עַל עֲבֹדָתוֹ וְאֶל מַשָּׂאוֹ의 배치 의미
  chosen_reading: ‘그의 직무와 그의 짐에 따라’로, 각 사람에게 맡겨진 봉사와 운반 책임의 이중 구조를 드러냈습니다.
  alternative_readings:
  - 그의 직무와 그의 부담에 따라
  - 그의 봉사와 그의 운반물에 따라
  rationale: 아론과 그의 아들들이 제사적 질서를 따라 각각의 책임을 분배하는 본문이므로, 단순한 노동 배분보다 직무와 운반 책임의 구분을 유지하는 것이 좋습니다.
  doctrine_reference: 번역 원칙 §4
