  to: 그러나 그들이 지극히 거룩한 것들[a]에 가까이 갈 때에 살아서 죽지 않도록, 그들을 위해 이렇게 하십시오. 아론과 그의 아들들은 와서 각 사람[b]에게 자기 직무와 자기가 질 짐을 맡겨야 합니다.
