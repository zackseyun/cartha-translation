  source_fidelity: 핵심 어휘 선택인 ‘그들을 위해’, ‘지극히 거룩한 것들’, ‘각 사람’, ‘직무’, ‘짐’은 히브리어와 문맥에 대체로 충실합니다. 다만 ‘각 사람을 그의 직무와 그의 짐에 따라 맡겨야 합니다’는 원문의 배정 관계를 한국어에서 정확히 드러내지 못합니다. 각 사람은 ‘맡겨지는’ 대상이 아니라, 각자에게 직무와 운반 짐이 배정되는 대상입니다.
  naturalness: 현 문장은 마지막 구절의 목적격과 ‘~에 따라 맡기다’의 결합이 어색하고 의미가 불명확합니다. ‘각 사람에게 자기 직무와 자기가 질 짐을 맡기다’로 고치면 자연스럽고 분배 표현도 분명해집니다. 각주 표지는 해당 표현 바로 뒤에 두는 편이 독자의 연결을 돕습니다.
