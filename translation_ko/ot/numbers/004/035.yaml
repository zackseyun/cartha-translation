  source_fidelity: 개정이 필요합니다. 초안의 ‘서른 살부터 쉰 살까지’는 וָמַעְלָה(‘그 이상’)를 충분히 드러내지 못하며, ‘서비스’는 현대 한국어 성경 문맥에서 부자연스럽고 외래어적입니다. 또한 원문의 열거·명사구 구조에 없는 ‘…하도록 합니다’를 덧붙여 문장 관계를 바꾸었습니다.
  naturalness: ‘서비스에 들어오는 모든 사람은, 회막에서 일하도록 합니다’는 어순과 주술 관계가 부자연스럽습니다. ‘회막에서 일을 하기 위해 봉사의 직무에 나아오는 모든 사람’은 현대 한국어에서 자연스럽고, 본문의 인원 범주를 규정하는 형식도 유지합니다.
  terminology: ‘회막’은 적절합니다. צָבָא는 이 문맥에서 군사 집단으로 한정하지 않고 ‘봉사의 직무’로 옮기는 것이 적절합니다. עֲבֹדָה는 이를 구별하여 ‘일을 하기 위해’로 번역했습니다.
