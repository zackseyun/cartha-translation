  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'everyone who enters for duty, for the work in the tent of meeting.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'service' (צָבָא) can also carry the sense of organized duty or service-company, reflecting the structured nature of Levitical work.
    reason: cultural_note
translation:
  language: ko
  text: 서른 살부터 쉰 살까지, 곧 서비스에 들어오는[a] 모든 사람은, 회막에서 일하도록 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘직무에 들어오는 모든 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  english_pob_choice: from thirty years old and upward
  chosen_korean: 서른 살부터…까지
  alternatives_korean:
  - 서른 살에서 그 이상까지
  - 서른 살 이상부터
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 자연스러운 현대 한국어로 옮겼으며, וָמַעְלָה의 상향 의미는 문맥상 ‘부터’로 충분히 살렸습니다.
- source_word: כָּל הַבָּא לַצָּבָא
  english_pob_choice: everyone who comes for service
  chosen_korean: …모든 사람은, 서비스에 들어오는[a]
  alternatives_korean:
  - …모든 사람은, 직무를 위해 들어오는
  - …모든 사람은, 의무에 들어오는
  lexicon: HALOT
  rationale: בוא의 분사 의미를 살려 ‘들어오다’로 옮기고, צָבָא의 조직된 봉사/직무 뉘앙스를 군사적 ‘군대’로 좁히지 않기 위해 문맥상 ‘서비스’로 처리했습니다.
- source_word: לַעֲבֹדָה
  english_pob_choice: to do the work
  chosen_korean: 회막에서 일하도록 합니다
  alternatives_korean:
  - 회막에서 그 일을 하도록 합니다
  - 회막에서 봉사하도록 합니다
  lexicon: HALOT
  rationale: עֲבֹדָה의 기본 의미인 ‘일/봉사’를 평이하게 살렸고, 앞의 צָבָא와 구분되도록 동사구로 풀어 자연스럽게 만들었습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 회막 안에서
  - 만남의 장막에서
  lexicon: HALOT
  rationale: 전통적으로 확립된 ‘회막’ 표현을 유지해 성막 지정어를 분명히 했습니다.
theological_decisions:
- issue: צָבָא의 군사적 의미를 이 본문에서 어떻게 처리할지
  chosen_reading: ‘서비스’로 옮겨, 레위인의 조직된 직무 참여를 드러내면서 군사적 이미지로 오해되지 않게 했습니다.
  alternative_readings:
  - 군대
  - 부대
  - 의무
  rationale: 민수기 4장의 문맥은 성막 봉사 인원 규정이므로, 영어 POB의 ‘service’에 맞춰 조직된 봉사/직무 의미를 유지하는 것이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 레위 지파의 성막 봉사 규정(민 4장)
