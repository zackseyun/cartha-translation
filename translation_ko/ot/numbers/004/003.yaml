source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל בָּא֙ לַ/צָּבָ֔א לַ/עֲשׂ֥וֹת מְלָאכָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'everyone who comes for the duty.' The Hebrew participle 'comes/enters' can be rendered more generally as 'comes.'
    reason: lexical_alternative
  - marker: b
    text: '''Service'' translates Hebrew צָבָא, a term that can also mean ''duty,'' ''company,'' or ''host.'' Here it refers to organized Levitical service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서른 살부터 쉰 살까지, 곧 회중의 일을 위해 들어오는 사람은 모두, 만남의 장막에서 일을 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּא(‘들어오는’)는 더 일반적으로 ‘오는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: צָבָא는 ‘일/직무’뿐 아니라 ‘군대/부대’도 뜻할 수 있으나, 여기서는 조직된 레위 봉사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה
  english_pob_choice: from thirty years old
  chosen_korean: 서른 살부터
  alternatives_korean:
  - 서른 살에서부터
  - 서른 살 이후로
  - 서른세 해부터
  lexicon: HALOT
  rationale: 나이 범위를 시작하는 히브리어 관용구를 한국어의 자연스러운 연령 표현으로 옮기되, 하한의 의미를 살리기 위해 ‘부터’를 사용했습니다.
- source_word: וָמַעְלָה
  english_pob_choice: and upward
  chosen_korean: 그리고 그 이상
  alternatives_korean:
  - 그리고 위로
  - 그리고 더 나이 들어
  - 이상
  lexicon: HALOT
  rationale: 연령 범위의 상한이 아닌 하한 초과를 가리키는 관용 표현이므로, 한국어에서도 ‘그 이상’으로 간결하게 옮겼습니다.
- source_word: כָּל בָּא לַצָּבָא
  english_pob_choice: everyone who enters the service
  chosen_korean: 곧 회중의 일을 위해 들어오는 사람은 모두
  alternatives_korean:
  - 곧 그 봉사를 위해 들어오는 사람은 모두
  - 곧 그 직무에 들어오는 사람은 모두
  - 곧 그 일을 맡으러 오는 사람은 모두
  lexicon: HALOT
  rationale: צָבָא를 단순한 군사 용어로 만들지 않고, 민수기 4장의 레위 사람 조직 봉사라는 문맥을 반영해 ‘회중의 일’로 풀어 썼습니다.
- source_word: לַעֲשׂוֹת מְלָאכָה
  english_pob_choice: to do the work
  chosen_korean: 일을 해야 합니다
  alternatives_korean:
  - 일을 하게 됩니다
  - 일을 수행해야 합니다
  - 노동을 해야 합니다
  lexicon: HALOT
  rationale: מְלָאכָה의 실제적·구체적 노동 의미를 살리되, 현대 한국어에서 가장 자연스러운 의무 표현으로 옮겼습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 만남의 장막에서
  alternatives_korean:
  - 회막에서
  - 만남의 천막에서
  - 모임의 장막에서
  lexicon: HALOT
  rationale: 표준적인 ‘회막’도 가능하지만, 히브리어의 직역성을 살린 ‘만남의 장막’을 채택해 장소 명칭의 의미를 더 분명히 드러냈습니다.
theological_decisions:
- issue: צָבָא의 의미를 군사적 이미지로 둘 것인가, 레위 봉사로 둘 것인가
  chosen_reading: 민수기 4장의 문맥에 따라 조직된 레위 직무를 가리키는 표현으로 읽고 ‘회중의 일’로 옮겼습니다.
  alternative_readings:
  - 군대
  - 진영
  - 봉사 부대
  rationale: 같은 어근이 군대/부대를 뜻할 수 있지만, 본문은 성막 운반과 관련한 레위인 자격 규정이므로 군사적 뉘앙스를 전면에 두면 문맥을 흐릴 수 있습니다.
  doctrine_reference: 민수기 4장 레위 직무 규정
