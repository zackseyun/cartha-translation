    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  english_pob_choice: those counted from them
  chosen_korean: 그들에게서 계수된 자들
  alternatives_korean:
  - 그들에게서 등록된 자들
  - 그들의 계수된 사람들
  - 그들의 수를 센 자들
  lexicon: HALOT
  rationale: פקד의 인구조사 문맥상 의미를 살려 '계수된'으로 옮기되, 영어 POB의 'from them'에 해당하는 출처성을 자연스럽게 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 종족별로
  - 그들의 족속별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 인구조사 문맥에서 혈연 하위단위를 가리키므로 '씨족'이 가장 적절합니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 아버지들의 집별로
  - 그들의 부계 가문별로
  - 그들의 조상 집안별로
  lexicon: HALOT
  rationale: 직역형 '아버지들의 집'도 가능하지만, 한국어로는 족보적·가문적 구조를 드러내는 '조상 가문'이 더 자연스럽고 원문의 사회구조를 보존합니다.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  english_pob_choice: two thousand six hundred and thirty
  chosen_korean: 이천육백삼십 명
  alternatives_korean:
  - 이천육백삼십
  - 이천육백삼십명
  - 2,630명
  lexicon: HALOT
  rationale: 수량 표현 뒤에 인원임을 분명히 하는 '명'을 붙여 한국어 독자에게 명확하게 전달했습니다.
