  - marker: a
    text: Hebrew tahash; the exact animal or material is uncertain. Traditional renderings include 'badger skin,' 'porpoise skin,' or more generally 'fine leather.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것들 위에 진홍색 천을 펴고, 타하스[a] 가죽 덮개로 그것을 덮고, 그 운반채를 끼워 넣어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תָּחַשׁ는 정확한 동물이나 재질이 확실하지 않습니다. 전통 번역에는 ‘오소리 가죽’, ‘돌고래 가죽’, 또는 더 일반적으로 ‘고급 가죽’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  english_pob_choice: they shall spread over them
  chosen_korean: 그들 위에 ... 펴고
  alternatives_korean:
  - 그들 위에 ... 펼치고
  - 그 위에 ... 깔고
  lexicon: HALOT
  rationale: פָּרַשׂ은 이 문맥에서 성물 위에 덮개를 펴는 동작을 가리키므로, ‘펴다’로 자연스럽게 옮겨 물리적 동작을 살렸습니다.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  english_pob_choice: a cloth of scarlet
  chosen_korean: 붉은 천
  alternatives_korean:
  - 주홍빛 천
  - 홍색 천
  - 붉은 직물
  lexicon: HALOT
  rationale: תּוֹלַעַת שָׁנִי의 핵심은 색과 재질감이 있는 천이므로, 본문이 요구하는 최소한의 의미를 살려 ‘붉은 천’으로 옮겼습니다.
- source_word: עוֹר תָּחַשׁ
  english_pob_choice: tahash skin
  chosen_korean: 타하스 가죽
  alternatives_korean:
  - 타하시 가죽
  - 바닷소 가죽
  - 오소리 가죽
  lexicon: HALOT
  rationale: תָּחַשׁ의 정확한 동물은 불확실하므로, 추정 번역을 피하고 히브리어를 음역한 ‘타하스’로 불확실성을 보존했습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles in place
  chosen_korean: 그 채를 끼워 넣어야 합니다
  alternatives_korean:
  - 그 막대를 끼워 넣어야 합니다
  - 그 채를 놓아야 합니다
  - 그 운반채를 넣어야 합니다
  lexicon: HALOT
  rationale: בַּדִּים은 성막 기구를 운반하는 채이므로 ‘채’로 옮기고, 문맥상 미리 맞추어 끼우는 동작을 드러내기 위해 ‘끼워 넣다’를 택했습니다.
