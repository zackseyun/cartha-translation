base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
  footnotes:
  - marker: a
    text: Hebrew תַּחַשׁ refers to an uncertain material or animal hide; traditional renderings include 'badger skin,' while others transliterate 'tahash.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성막의 휘장들과 회막과 그 덮개, 그 위를 덮는 타하스[a] 덮개, 그리고 회막 입구의 휘장을 운반해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַּחַשׁ는 재료나 동물 가죽을 가리키는 말로 보이지만 정확한 뜻은 확정되지 않았습니다. 전통 번역에는 ‘돌고래가죽’과 같은 표현도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  english_pob_choice: They shall carry
  chosen_korean: 메고 가야 합니다
  alternatives_korean:
  - 들고 가야 합니다
  - 운반해야 합니다
  lexicon: HALOT
  rationale: 운반 명령이므로 ‘메다’가 한국어로 가장 자연스럽고, 장막 기구를 옮기는 물리적 동작을 잘 드러냅니다.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  english_pob_choice: the curtains of the tabernacle
  chosen_korean: 성막의 휘장
  alternatives_korean:
  - 성막의 막
  - 장막의 휘장
  lexicon: HALOT
  rationale: יְרִיעוֹת는 성막 맥락의 천막 패널/휘장으로, 한국어 성경 관용을 살리되 문맥상 ‘성막’과 연결되는 ‘휘장’으로 옮겼습니다.
- source_word: מִכְסֵה הַתַּחַשׁ
  english_pob_choice: the covering of fine leather
  chosen_korean: 돌고래가죽 덮개
  alternatives_korean:
  - 타하스 가죽 덮개
  - 좋은 가죽 덮개
  lexicon: HALOT
  rationale: תַּחַשׁ는 동물/가죽이 불확실하므로, 전통적이지만 특정성이 약한 한국어 관용을 따라 ‘돌고래가죽’으로 처리해 재료의 의미를 유지했습니다.
- source_word: מָסַךְ פֶּתַח
  english_pob_choice: the screen for the entrance
  chosen_korean: 회막 입구의 휘장
  alternatives_korean:
  - 회막 문간의 휘장
  - 회막 입구의 막
  lexicon: HALOT
  rationale: מָסַךְ는 성막 문을 가리는 걸개이므로 ‘휘장’이 적절하고, פֶּתַח는 ‘입구’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 성막 이동 명령의 직설성
  chosen_reading: 명령문의 기능을 살려 ‘메고 가야 합니다’로 옮겼습니다.
  alternative_readings:
  - 운반해야 합니다
  - 짊어져야 합니다
  rationale: 본문은 레위인들의 실제 운반 책임을 규정하는 지시문이므로, 완곡화보다 지시적 어조를 유지하는 편이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 민수기 4장의 성막 봉사 규정
