revisions:
- from: 아론과 그의 아들들이 성소와 성소의 모든 기구를 덮는 일을 마치고 진영이 출발할 때에, 그다음에는 고핫의 아들들이 와서 그것들을 메어야 합니다. 그러나 그들은 거룩한 것들에 손을 대서는 안 되며, 그렇지 않으면 죽습니다. 이것이 회막에서 고핫의 아들들이 져야 할 부담입니다.[a][b][c]
  to: 아론과 그의 아들들이 성물[a]과 모든 거룩한 기구를 덮는 일을 마치고, 진영이 출발할 때에 그 뒤에 고핫의 아들들[c]이 와서 그것들을 운반해야 합니다. 그러나 그들은 성물에 손을 대서는 안 되며, 그렇지 않으면 죽습니다[b]. 이것들은 회막에서 고핫의 아들들이 맡아 나를 짐입니다.
  rationale: 원문 문맥상 덮고 운반하는 대상의 구체성을 위해 첫 הַקֹּדֶשׁ를 ‘성물’로 옮겼으며, 성소 해석은 각주로 보존했습니다. 마지막 절은 복수 지시사 אֵלֶּה와 מַשָּׂא의 운반 의미를 반영하여 ‘이것들은 … 맡아 나를 짐’으로 고쳤습니다. 각주 표지도 각각의 관련 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:58Z'
