source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'they shall not touch the sanctuary.' The Hebrew 'the holy' can be understood either collectively for the sacred objects or more broadly for the sanctuary.
    reason: alternative_reading
  - marker: b
    text: Or 'and they will die.' The Hebrew wording states the consequence directly.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Kohathites.' Literally, 'the sons of Kohath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들이 성물[a]과 모든 거룩한 기구를 덮는 일을 마치고, 진영이 출발할 때에 그 뒤에 고핫의 아들들[c]이 와서 그것들을 운반해야 합니다. 그러나 그들은 성물에 손을 대서는 안 되며, 그렇지 않으면 죽습니다[b]. 이것들은 회막에서 고핫의 아들들이 맡아 나를 짐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소’. 히브리어 ‘거룩한 것’은 성물 전체를 가리키거나 더 넓게 성소를 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들이 죽을 것입니다’. 히브리어 표현은 결과를 직접 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘고핫 사람들’. 문자적으로는 ‘고핫의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה אַהֲרֹן וּבָנָיו לְכַסֹּת
  english_pob_choice: When Aaron and his sons have finished covering
  chosen_korean: 아론과 그의 아들들이 성소와 성소의 모든 기구를 덮는 일을 마치고
  alternatives_korean:
  - 아론과 그의 아들들이 덮는 일을 끝내고
  - 아론과 그의 아들들이 덮기를 마치고
  lexicon: HALOT
  rationale: 완료 동사와 목적 부정사구의 결합을 자연스러운 한국어로 옮기되, ‘마치고’로 절차의 완료를 분명히 했습니다.
- source_word: הַקֹּדֶשׁ / כָּל כְּלֵי הַקֹּדֶשׁ
  english_pob_choice: the sanctuary / all the furnishings of the sanctuary
  chosen_korean: 성소와 성소의 모든 기구
  alternatives_korean:
  - 거룩한 것과 거룩한 것의 모든 기구
  - 성소와 그 안의 모든 기구
  lexicon: HALOT
  rationale: 첫 번째 הַקֹּדֶשׁ는 의례적 공간/대상을 포괄하는 ‘성소’로, כְּלֵי는 현대 한국어의 ‘기구’로 옮겨 성막 기물의 구체성을 살렸습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫의 아들들
  alternatives_korean:
  - 고핫 자손들
  - 고핫 사람들
  lexicon: HALOT
  rationale: 족속명보다 문자적인 친족 표현을 유지하여, POB의 ‘sons of Kohath’ 대응을 그대로 드러냈습니다.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ וָמֵתוּ
  english_pob_choice: but they shall not touch the holy things, lest they die
  chosen_korean: 그러나 그들은 거룩한 것들에 손을 대서는 안 되며, 그렇지 않으면 죽습니다
  alternatives_korean:
  - 그러나 그들은 거룩한 것들에 닿아서는 안 되며, 그렇지 않으면 죽습니다
  - 그러나 그들은 성소에 손대서는 안 되며, 그렇게 하면 죽습니다
  lexicon: HALOT
  rationale: 접촉 금지와 결과를 직접적으로 드러내기 위해 ‘손을 대다’를 사용했고, 히브리어의 직접적 결과 진술을 ‘그렇지 않으면 죽습니다’로 옮겼습니다.
- source_word: מַשָּׂא
  english_pob_choice: the burden
  chosen_korean: 부담
  alternatives_korean:
  - 짐
  - 짐으로 지는 일
  - 맡은 짐
  lexicon: HALOT
  rationale: 문맥상 이동해야 할 성막 봉사의 책임과 짐을 함께 가리키므로, 현대 한국어에서 직무적·물리적 중의를 살릴 수 있는 ‘부담’을 선택했습니다.
theological_decisions:
- issue: הַקֹּדֶשׁ의 범위
  chosen_reading: ‘성소/거룩한 것들’로 나누어, 앞부분은 성소와 기구 전체를 가리키고 금지 조항은 직접 접촉 금지 대상인 거룩한 물건들로 읽었습니다.
  alternative_readings:
  - 모두 ‘성소’로 통일하는 읽기
  - 모두 ‘거룩한 것들’로 통일하는 읽기
  rationale: 수송 준비와 접촉 금지라는 두 문맥을 구분해야 본문의 절차적 긴장—덮은 뒤에야 레위인이 운반할 수 있다는 점—이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 절차적 성결 규정의 긴장 보존
