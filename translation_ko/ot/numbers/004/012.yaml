  source_fidelity: 개정이 필요합니다. 초안의 절차적 순서와 ‘성소에서 봉사할 때 쓰는 모든 기구’라는 뜻은 대체로 충실합니다. 그러나 תָּחַשׁ를 ‘질긴 가죽’으로 한정하면 본문의 불확실한 어휘에 ‘질김’이라는 특정 성질을 부가합니다. 또한 הַמּוֹט는 단수 ‘막대/봉’이므로 ‘운반대’보다 ‘운반 막대’가 원문의 형태와 의미 범위를 더 잘 보존합니다.
  naturalness: ‘성소에서 봉사하는 데 쓰는’, ‘청색 천으로 싸고’, ‘그것들을 덮은 다음’은 현대 표준 한국어의 자연스러운 합쇼체 절차문입니다. ‘운반 막대 위에 놓아야 합니다’도 문맥상 자연스럽습니다.
  terminology: ‘성소’, ‘봉사’, ‘기구’는 제의 문맥에 적절합니다. תָּחַשׁ의 불확실성은 본문에서 중립적인 ‘가죽’으로 처리하고 해당 어휘에 각주를 붙이는 편이 안전합니다. 각주 표지도 각각 가죽과 운반 막대에 직접 붙여야 합니다.
