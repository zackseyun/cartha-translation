source:
  edition: WLC
  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
  footnotes:
  - marker: a
    text: Hebrew תָּחַשׁ (tahash) is uncertain; it may refer to a particular animal skin or to a kind of fine or durable leather.
    reason: lexical_alternative
  - marker: b
    text: Or 'place them on the pole.' The Hebrew uses the singular 'pole/bar,' which may stand for the carrying apparatus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성소에서 봉사하는 데 쓰는 모든 기구를 가져다가 청색 천으로 싸고, 가죽 덮개[a]로 그것들을 덮은 다음, 운반 막대[b] 위에 놓아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תָּחַשׁ(tahash)의 정확한 의미는 확실하지 않습니다. 특정 동물의 가죽을 가리킬 수도 있고, 질 좋은 가죽이나 튼튼한 가죽의 종류를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘운반 장치에’로 옮길 수 있습니다. 히브리어는 단수 ‘막대/봉’을 사용하지만, 운반 장치를 통칭하는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  english_pob_choice: Then they shall take
  chosen_korean: 그들은 … 가져다가
  alternatives_korean:
  - 그들은 … 취해야 합니다
  - 그들은 … 가져야 합니다
  lexicon: HALOT
  rationale: 절차를 잇는 와우 연속형을 한국어에서도 순차 동작으로 살려 ‘가져다가’로 옮겼습니다.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  english_pob_choice: all the utensils of the service
  chosen_korean: 모든 기구
  alternatives_korean:
  - 봉사의 모든 기구
