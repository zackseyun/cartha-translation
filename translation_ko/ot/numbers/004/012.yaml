id: NUM.4.12
reference: Numbers 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
  footnotes:
  - marker: a
    text: Hebrew תָּחַשׁ (tahash) is uncertain; it may refer to a particular animal skin or to a kind of fine or durable leather.
    reason: lexical_alternative
  - marker: b
    text: Or 'place them on the pole.' The Hebrew uses the singular 'pole/bar,' which may stand for the carrying apparatus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성소에서 봉사할 때 쓰는 모든 기구를 가져다가 파란 천에 싸고, 그 위를 질긴 가죽 덮개로 덮은 뒤, 운반대에 얹어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תָּחַשׁ(tahash)는 정확한 의미가 확실하지 않으며, 특정 동물의 가죽이나 질 좋고 튼튼한 가죽을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘막대에’로도 옮길 수 있습니다. 히브리어는 단수 ‘막대/봉’을 사용하지만, 운반 장치를 통칭하는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  english_pob_choice: Then they shall take
  chosen_korean: 그들은 … 가져다가
  alternatives_korean:
  - 그들은 … 취해야 합니다
  - 그들은 … 가져야 합니다
  lexicon: HALOT
  rationale: 절차를 잇는 와우 연속형을 한국어에서도 순차 동작으로 살려 ‘가져다가’로 옮겼습니다.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  english_pob_choice: all the utensils of the service
  chosen_korean: 모든 기구
  alternatives_korean:
  - 봉사의 모든 기구
  - 성막 봉사에 쓰는 모든 기구
  lexicon: HALOT
  rationale: כְּלִי는 예배용 기구를 가리키므로, 문맥상 자연스러운 ‘기구’로 옮기되 봉사 용도를 뒤의 절로 풀었습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩한 곳에서
  - 성역에서
  lexicon: HALOT
  rationale: 이 용법은 성막의 거룩한 영역을 가리키므로, 성소라는 표준적인 예배 용어를 사용했습니다.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  english_pob_choice: a covering of fine leather
  chosen_korean: 질긴 가죽 덮개
  alternatives_korean:
  - 다듬은 가죽 덮개
  - 다루기 좋은 가죽 덮개
  - 타하스 가죽 덮개
  lexicon: HALOT
  rationale: תָּחַשׁ의 정확한 동물은 불확실하므로, 본문 기능을 살리는 중립적 표현을 택하고 어휘상의 불확실성은 주해로 남기는 편이 낫습니다.
- source_word: עַל הַמּוֹט
  english_pob_choice: on the carrying frame
  chosen_korean: 운반대에
  alternatives_korean:
  - 막대에
  - 멜 운반 막대에
  lexicon: HALOT
  rationale: מּוֹט는 운반용 막대/장치를 가리킬 수 있어, 여기서는 문맥상 기능을 드러내는 ‘운반대’로 옮겼습니다.
theological_decisions:
- issue: קדש를 예배 공간으로 번역하는 문제
  chosen_reading: ‘성소’는 단순히 추상적 ‘거룩함’이 아니라 성막에서 거룩하게 구별된 실재적 공간을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - ‘거룩한 곳’
  - ‘성역’
  rationale: 이 절은 제의 절차 설명이므로 공간적·제의적 뉘앙스를 살리는 것이 본문의 의도를 가장 잘 전달합니다.
  doctrine_reference: 성막/성소에 대한 구약 제의 이해
