id: NUM.4.30
reference: Numbers 4:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'everyone who comes for duty.'
    reason: lexical_alternative
  - marker: b
    text: '''Service'' translates a term that can also denote an organized company or host; here it refers to assigned Levitical duty.'
    reason: cultural_note
translation:
  language: ko
  text: 서른 살부터 쉰 살까지는, 회중의 봉사를 위해 들어오는 사람은 모두 계수하십시오 — 곧 회막의 일을 하도록 하는 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉사를 위해 들어오는 사람들 모두’.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  english_pob_choice: From thirty years old and upward
  chosen_korean: 서른 살부터
  alternatives_korean:
  - 서른 살에서부터
  - 서른 살 이상부터
  lexicon: HALOT
  rationale: 나이 범위를 나타내는 관용구이므로, 한국어에서는 자연스러운 ‘서른 살부터’로 옮겨 원문의 시작점을 분명히 살렸습니다.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: up to fifty years old
  chosen_korean: 쉰 살까지
  alternatives_korean:
  - 쉰 살에 이르기까지
  - 쉰 살 이하까지
  lexicon: HALOT
  rationale: 끝나는 연령 한계를 간결하고 명확하게 드러내기 위해 ‘쉰 살까지’로 옮겼습니다.
- source_word: תִּפְקְדֵם
  english_pob_choice: you shall count them
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 세십시오
  - 기록하십시오
  - 인원으로 등록하십시오
  lexicon: HALOT
  rationale: פקד은 이 문맥에서 인원을 조사하여 등록하는 뜻이므로, 단순한 숫자 세기보다 행정적·공적 성격을 살린 ‘계수하십시오’가 적절합니다.
- source_word: לַצָּבָא
  english_pob_choice: the service
  chosen_korean: 봉사
  alternatives_korean:
  - 직무
  - 근무
  - 편성된 부대
  lexicon: HALOT
  rationale: 여기서는 전투가 아니라 레위인의 정해진 직무를 가리키므로, 조직된 의무를 드러내는 ‘봉사’로 옮기되 군사적 뉘앙스는 과도하게 넣지 않았습니다.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  english_pob_choice: the work of the tent of meeting
  chosen_korean: 회막의 일을
  alternatives_korean:
  - 회막의 직무를
  - 회막의 봉사를
  lexicon: HALOT
  rationale: עֲבֹדָה는 여기서 수행해야 할 구체적 일을 뜻하므로 ‘일’로 옮겼고, אֹהֶל מוֹעֵד는 관용적 표현인 ‘회막’으로 표준화했습니다.
theological_decisions:
- issue: לַצָּבָא의 군사적 연상 처리
  chosen_reading: ‘봉사’로 옮겨 레위인의 지정된 직무를 나타냈습니다.
  alternative_readings:
  - ‘군대’로 옮김
  - ‘부대’로 옮김
  - ‘근무’로 옮김
  rationale: 문맥은 전쟁이 아니라 성막에서의 조직된 섬김이므로, 군사 어휘를 그대로 살리기보다 독자가 본문 의도를 오해하지 않도록 직무 중심의 표현을 택했습니다.
  doctrine_reference: 본문 문맥 우선 원칙; 레위 직무의 비군사적 성격 보존
