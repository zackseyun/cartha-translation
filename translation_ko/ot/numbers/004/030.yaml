  to: 서른 살부터 쉰 살까지, 회막의 일을 수행하려고 복무에 들어오는 모든 사람을 계수하십시오.
  rationale: 원문의 연령 범위, 계수 명령, ‘복무에 들어오는 모든 사람’이라는 자격 조건, 그리고 회막의 일을 수행한다는 목적을 모두 보존했습니다. 원문에 없는 ‘회중’을 제거하고, 일을 수행하는 주체가 계수 대상자임을 분명히 했습니다. 불필요하고 중복적인 각주는 삭제했습니다.
