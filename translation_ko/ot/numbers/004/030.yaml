  source_fidelity: 원문은 ‘서른 살부터 쉰 살까지’의 대상 전원을 계수하되, 그들이 ‘복무/정해진 봉사에 들어와’ 회막의 일을 수행하는 사람들이라고 규정합니다. 초안의 ‘회중의 봉사’는 원문에 없는 ‘회중’을 추가하며, ‘회막의 일을 하도록 하는 사람들’은 לַעֲבֹד(‘일하다, 수행하다’)의 주체를 바꾸어 원문의 뜻을 훼손합니다.
  naturalness: ‘서른 살부터 쉰 살까지’와 ‘계수하십시오’는 자연스럽고 격식 있는 합쇼체입니다. 다만 초안의 대시 뒤 동격 설명은 문법적으로도 어색하고, 수식 관계가 불명확합니다. 수정문은 원문의 계수 명령과 자격 조건을 한국어 어순으로 명확히 연결합니다.
  terminology: אֹהֶל מוֹעֵד는 통용되는 ‘회막’으로 유지했습니다. לַצָּבָא는 군사 행동이 아니라 조직된 레위 직무를 가리키므로 ‘복무’로 옮겼으며, 이어지는 עֲבֹדַת는 ‘회막의 일을 수행하다’로 번역하여 두 표현의 기능상 차이를 보존했습니다.
