    rationale: 앞의 ‘각 사람’과 연결되는 배정·임무를 가리키나, 한국어의 단수 소유 표현은 누구를 가리키는지 모호합니다. ‘각 사람에게 맡겨진 임무’로 분배적 문맥을 명확히 하되, 논쟁적인 명사의 의미 범위는 각주에 남기는 것이 안전합니다.
