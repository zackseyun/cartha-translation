  - 여호와
  rationale: 원문에 직접 나온 신적 고유명사를 유지하기 위해 한국어 본문에서는 ‘야훼’를 사용했습니다. 이는 호칭 대체보다 מקור의 이름성을 보존하는 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
