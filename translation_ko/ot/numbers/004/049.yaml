  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
  footnotes:
  - marker: a
    text: Or 'By the command of the LORD.' Literally, 'Upon the mouth of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'through Moses' for 'by the hand of Moses.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may also be understood as 'appointment,' 'oversight,' or 'charge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 명령에 따라 그들은 모세의 손으로 계수되었습니다. 각 사람은 자기의 직무에 따라, 자기의 짐에 따라 계수되었으며, 그의 임무는 야훼께서 모세에게 명하신 대로였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 명령에 따라’. 직역하면 ‘야훼의 입에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모세를 통해’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 용어는 ‘배정’, ‘감독’, ‘맡은 바’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּ֨י יְהוָ֜ה
  english_pob_choice: At the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 입에 따라
  - 야훼의 말씀대로
  lexicon: HALOT
  rationale: 관용구 עַל־פִּי 는 직역하면 ‘입에 따라’이지만, 문맥상 ‘명령에 따라’라는 뜻이므로 한국어에서도 자연스럽고 원문 의미를 드러내는 표현을 택했습니다.
- source_word: פָּקַ֤ד אוֹתָם
  english_pob_choice: they were counted
  chosen_korean: 그들은 계수되었습니다
  alternatives_korean:
  - 그들은 임명되었습니다
  - 그들은 점검되었습니다
  - 그들은 소집되었습니다
  lexicon: HALOT
  rationale: 이 절은 레위인들의 인원 파악과 배치에 관한 문맥이므로 פקד 를 ‘계수하다’로 옮겨 행정적·수적 의미를 살렸습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손으로
  alternatives_korean:
  - 모세를 통해
  - 모세의 지휘 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되 한국어에서 이해 가능한 형태로 유지하여, 매개된 실행이라는 뉘앙스를 보존했습니다.
- source_word: אִישׁ אִישׁ עַל עֲבֹדָתוֹ וְעַל מַשָּׂאוֹ
  english_pob_choice: each man according to his service and according to his burden
  chosen_korean: 각 사람은 자기의 직무에 따라, 자기의 짐에 따라
  alternatives_korean:
  - 각 사람은 자기 봉사에 따라, 자기 짐에 따라
  - 각 사람은 자기의 일에 따라, 자기의 부담에 따라
  lexicon: HALOT
  rationale: 반복된 אִישׁ אִישׁ 의 분배적 강조를 ‘각 사람’으로, עֲבֹדָה 는 성막 봉사 맥락의 ‘직무’로, מַשָּׂא 는 운반해야 할 ‘짐’으로 옮겨 구체적 의미를 살렸습니다.
- source_word: וּפְקֻדָיו
  english_pob_choice: his assignment
  chosen_korean: 그의 임무는
  alternatives_korean:
  - 그의 배정은
  - 그의 맡겨진 일은
  - 그의 직책은
  lexicon: HALOT
  rationale: פְקֻדָיו 는 문맥상 각 사람에게 맡겨진 배정·책임을 가리키므로, ‘임무’로 옮겨 계수와 직무 배분의 흐름을 자연스럽게 연결했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
