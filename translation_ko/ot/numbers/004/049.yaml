  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
  footnotes:
  - marker: a
    text: Or 'By the command of the LORD.' Literally, 'Upon the mouth of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'through Moses' for 'by the hand of Moses.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may also be understood as 'appointment,' 'oversight,' or 'charge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 명령에 따라[a] 그들은 모세를 통하여[b] 계수되었습니다. 각 사람은 자기의 직무와 자기가 져야 할 짐에 따라 계수되었으며, 각 사람에게 맡겨진 임무는[c] 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입을 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모세의 손으로’입니다. 이는 모세를 통한 매개나 대리를 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 용어는 문맥에 따라 ‘배정’, ‘감독’, ‘맡은 바’ 또는 ‘임명’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּ֨י יְהוָ֜ה
  english_pob_choice: At the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
