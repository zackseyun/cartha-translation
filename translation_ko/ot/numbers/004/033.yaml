  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
  footnotes:
  - marker: a
    text: Hebrew literally, 'by the hand of Ithamar,' an idiom for supervision or administrative direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 회막에서 레위인 므라리 자손의 모든 일입니다. 곧 아론의 아들 제사장 이다말의 감독 아래 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이다말의 손으로’이지만, 관용적으로는 감독이나 행정적 지휘를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹדַת / עֲבֹדָתָם
  english_pob_choice: the service of / their service
  chosen_korean: 일
  alternatives_korean:
  - 섬김
  - 봉사
  - 직무
  lexicon: HALOT
  rationale: 이 문맥의 עֲבֹדָה는 성막 관련 배정된 역할과 업무를 가리키므로, 반복을 살리되 현대 한국어로는 ‘일’이 가장 자연스럽습니다. 다만 ‘서비스’보다 의미가 구체적이지 않아, 같은 절의 반복 구조는 ‘모든 일’로 풀었습니다.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  english_pob_choice: the clans of the sons of Merari
  chosen_korean: 레위인 므라리 자손
  alternatives_korean:
  - 므라리의 자손들
  - 므라리 자손의 씨족들
  - 므라리 자손의 가문들
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 보통 ‘씨족/가문’이지만, 영어 본문처럼 ‘clans’의 집합적 의미가 이미 ‘므라리 자손’에 포함되므로 한국어에서는 과도한 중복을 피하고 자연스럽게 ‘레위인 므라리 자손’으로 정리했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 모임의 장막에서
  - 회중의 장막에서
  lexicon: HALOT
  rationale: 오아헬 모에드는 성막의 통상 명칭인 ‘회막’으로 옮기는 것이 한국어 성서 관용과 의미를 함께 살립니다. 위치 표지는 ‘에서’로 처리했습니다.
- source_word: בְּיַד אִיתָמָר
  english_pob_choice: under the direction of Ithamar
  chosen_korean: …의 감독 아래 있습니다
  alternatives_korean:
  - …의 손 아래 있습니다
  - …의 지휘 아래 있습니다
  - …의 관리 아래 있습니다
  lexicon: HALOT
  rationale: 직역하면 ‘이다말의 손으로/손에 의해’이지만, 영어 POB가 지적하듯 행정적 감독의 관용구입니다. 한국어에서는 ‘감독 아래’가 가장 직접적으로 그 기능을 드러냅니다.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  english_pob_choice: Ithamar son of Aaron the priest
  chosen_korean: 아론의 아들 제사장 이다말
  alternatives_korean:
  - 제사장 아론의 아들 이다말
  - 아론 제사장 이다말
  - 아론의 아들 이다말 제사장
  lexicon: HALOT
  rationale: 히브리어의 친족관계와 직분 표지를 함께 보이기 위해 ‘아론의 아들 제사장 이다말’로 옮겼습니다. ‘제사장’은 아론에 붙기보다 이다말의 신분을 규정하는 것으로 읽히지만, 한국어에서는 후행 배치를 통해 과도한 어색함을 피했습니다.
theological_decisions:
- issue: ‘by the hand of’ 관용구의 의미
  chosen_reading: 행정적 통제나 감독을 뜻하는 관용구로 보고 ‘감독 아래’로 번역했습니다.
  alternative_readings:
  - 직역하여 ‘이다말의 손 아래’
  - ‘이다말의 손을 통해’
  rationale: 본문은 회막의 레위 업무 배치와 책임 체계를 설명하므로, 단순한 신체 이미지를 살리기보다 실제 기능인 감독/관리의 뜻을 드러내는 것이 원문 의도를 더 분명히 전달합니다.
  doctrine_reference: 민수기 4장의 성막 봉사 분담 구조
