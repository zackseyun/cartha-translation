source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
  footnotes:
  - marker: a
    text: Or 'those numbered' or 'those registered.' The Hebrew uses census language from the verb פקד.
    reason: lexical_alternative
  - marker: b
    text: '''Fathers'' houses'' refers to ancestral households or family divisions within the clans.'
    reason: cultural_note
translation:
  language: ko
  text: 모세와 아론과 이스라엘의 지도자들이 레위 사람들을 그들의 씨족과 조상들의 가문에 따라 계수한[a] 모든 사람은—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פקד는 여기서 공식적인 인구 조사 또는 계수를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들의 가문’은 씨족 안에서 조상 계통에 따라 구분된 가문 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  english_pob_choice: All those counted
  chosen_korean: 그 수를 센 모든 사람
  alternatives_korean:
  - 모든 계수된 자들
  - 모든 등록된 자들
  - 모두 센 사람들
  lexicon: HALOT
  rationale: פקד의 인구 조사 문맥을 살려 ‘수를 센’으로 옮기고, כָּל은 전체를 가리키는 ‘모든 사람’으로 자연스럽게 풀었습니다.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들이
  alternatives_korean:
  - 이스라엘의 족장들이
  - 이스라엘의 방백들이
  lexicon: HALOT
  rationale: נשיאים는 지파/공동체 지도자를 뜻하므로, 현대 독자에게 분명한 ‘지도자들’로 옮겼습니다.
- source_word: אֶת הַלְוִיִּם
  english_pob_choice: among the Levites
  chosen_korean: 레위 사람들 가운데서
  alternatives_korean:
  - 레위 사람들을
  - 레위인들 가운데서
  lexicon: HALOT
  rationale: 직역하면 목적어 표지이지만 문맥상 레위 사람들 안에서 실시된 계수임이 핵심이므로, 관계를 드러내는 ‘가운데서’를 택했습니다.
- source_word: לְמִשְׁפְּחֹתָם וּלְבֵית אֲבֹתָם
  english_pob_choice: by their clans and by their fathers' houses
  chosen_korean: 그들의 종족대로와 조상들의 가문대로
  alternatives_korean:
  - 그들의 씨족대로와 아버지들의 집대로
  - 그들의 가족 집단대로와 조상 가문대로
  lexicon: HALOT
  rationale: משפחה와 בית אבות의 이스라엘 족보·조직 단위를 반영해 ‘종족’과 ‘조상들의 가문’으로 구분해 옮겼습니다.
theological_decisions:
- issue: 민수기 4장의 계수 표현을 한국어로 어떻게 드러낼지
  chosen_reading: ‘수를 센’은 단순한 산술이 아니라 야훼께서 정하신 질서 아래서의 공식적 계수라는 점을 함축합니다.
  alternative_readings:
  - ‘등록된’
  - ‘계수된’
  rationale: 본문은 פקד의 인구조사 용례를 사용하므로, 지나치게 행정적이거나 낯선 표현보다 원문의 공식적 계수 의미를 살리는 번역이 적절합니다.
  doctrine_reference: 민수기의 광야 공동체 질서와 계수 문맥
- issue: 레위 사람들의 가문 구분을 어떻게 표시할지
  chosen_reading: ‘종족’과 ‘조상들의 가문’의 병렬로, 부족 아래의 더 세부적인 혈연 단위를 구분했습니다.
  alternative_readings:
  - ‘씨족’과 ‘가문’
  - ‘가족’과 ‘아버지들의 집’
  rationale: 히브리어의 조직 단위를 한국어 독자에게도 구별되게 보여 주되, 전통 교회어보다 원문 구조를 더 투명하게 드러내기 위해서입니다.
  doctrine_reference: 이스라엘의 지파·가문 질서
