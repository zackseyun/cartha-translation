source:
  edition: WLC
  text: וַ/יִּפְקֹ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י הָ/עֵדָ֖ה אֶת בְּנֵ֣י הַ/קְּהָתִ֑י לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
  footnotes:
  - marker: a
    text: Or 'numbered' or 'took a census of.' The Hebrew verb can also mean 'appoint' in other contexts, but here it refers to counting for service.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of the Kohathite,' that is, the Kohathite clan-group descended from Kohath.
    reason: lexical_alternative
  - marker: c
    text: '''Fathers’ houses'' is a traditional Israelite kinship term for ancestral households or family divisions.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 모세와 아론과 회중의 지도자들이 고핫 자손들을 그들의 씨족별로, 그리고 그들의 조상의 집별로 계수했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수했습니다’는 이 문맥의 פּקד를 ‘임명하다’가 아니라 인원 수를 세어 등록하는 뜻으로 읽은 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고핫 자손들’은 히브리어의 직역적 계보 표현으로, 고핫 계열 씨족을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조상의 집’은 이스라엘 족보·친족 체계에서 쓰이는 전통적 관용구로, 가문/가족 분단을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  english_pob_choice: counted
  chosen_korean: 계수했습니다
  alternatives_korean:
  - 세었습니다
  - 인원조사를 했습니다
  - 등록했습니다
  lexicon: HALOT
  rationale: 인구·편성 문맥에서 פּקד는 단순한 ‘세다’보다 공식적인 ‘계수하다’가 더 정확하게 행정적 뉘앙스를 살립니다.
- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
  - 회중의 장들
  - 공동체의 지도자들
  - 회중의 통치자들
  lexicon: HALOT
  rationale: נְשִׂיאים의 역할을 현대 한국어로 자연스럽게 ‘지도자들’로 옮기고, הָעֵדָה는 광야 본문 맥락에 맞게 ‘회중’으로 유지했습니다.
- source_word: בְּנֵי הַקְּהָתִי
  english_pob_choice: the sons of the Kohathites
  chosen_korean: 고핫 자손들
  alternatives_korean:
  - 고핫 사람들
  - 고핫의 후손들
  - 고핫 족속
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of ...’ 계보 관용구를 한국어 성경 문체에 맞게 ‘자손들’로 옮겨, 혈통·소속의 의미를 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 종족별로
  - 그들의 가족별로
  - 그들의 가문별로
  lexicon: HALOT
  rationale: 미슈파하를 단순한 핵가족보다 넓은 친족 단위로 드러내기 위해 ‘씨족’이 가장 적합하며, 분류의 לְ는 ‘-별로’로 자연스럽게 살렸습니다.
- source_word: וּלְבֵית אֲבֹתָם
  english_pob_choice: and by their fathers’ houses
  chosen_korean: 그들의 조상의 집별로
  alternatives_korean:
  - 그들의 아버지의 집별로
  - 그들의 조상 가문별로
  - 그들의 부계 집안별로
  lexicon: HALOT
  rationale: בֵּית אָבוֹת의 기술적 친족 표현을 직역하되, 현대 한국어에서 이해되도록 ‘조상의 집’으로 옮겼습니다.
