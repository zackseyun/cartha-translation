- source_word: נְשִׂיאֵי הָעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 지도자들
  alternatives_korean:
  - 회중의 장들
  - 공동체의 지도자들
  - 회중의 통치자들
  lexicon: HALOT
  rationale: נְשִׂיאים의 역할을 현대 한국어로 자연스럽게 ‘지도자들’로 옮기고, הָעֵדָה는 광야 본문 맥락에 맞게 ‘회중’으로 유지했습니다.
- source_word: בְּנֵי הַקְּהָתִי
  english_pob_choice: the sons of the Kohathites
  chosen_korean: 고핫 자손들
  alternatives_korean:
  - 고핫 사람들
  - 고핫의 후손들
  - 고핫 족속
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of ...’ 계보 관용구를 한국어 성경 문체에 맞게 ‘자손들’로 옮겨, 혈통·소속의 의미를 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 종족별로
  - 그들의 가족별로
  - 그들의 가문별로
  lexicon: HALOT
  rationale: 미슈파하를 단순한 핵가족보다 넓은 친족 단위로 드러내기 위해 ‘씨족’이 가장 적합하며, 분류의 לְ는 ‘-별로’로 자연스럽게 살렸습니다.
- source_word: וּלְבֵית אֲבֹתָם
  english_pob_choice: and by their fathers’ houses
  chosen_korean: 그들의 조상의 집별로
  alternatives_korean:
  - 그들의 아버지의 집별로
  - 그들의 조상 가문별로
  - 그들의 부계 집안별로
  lexicon: HALOT
  rationale: בֵּית אָבוֹת의 기술적 친족 표현을 직역하되, 현대 한국어에서 이해되도록 ‘조상의 집’으로 옮겼습니다.
