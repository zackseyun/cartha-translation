  source_fidelity: 히브리어 원문은 모세·아론·회중의 지도자들이 고핫 자손을 그들의 씨족과 조상의 집(부계 친족 집단)에 따라 계수했음을 말합니다. 초안은 핵심 의미를 충실히 옮겼습니다. 다만 ‘조상의 집’은 בֵּית אָבוֹת의 기술적 친족 용어를 다소 모호하게 만들 수 있어 ‘조상들의 집안’으로 다듬는 편이 한국어에서 더 자연스럽고 원문의 복수적 계보 범주를 더 잘 드러냅니다.
  naturalness: ‘계수했습니다’, ‘회중의 지도자들’, ‘씨족별로’는 현대의 격식 있는 성경 한국어로 자연스럽습니다. ‘그들의’가 반복되지만 원문의 소유 접미사를 명시적으로 반영하며, 분류 기준을 분명하게 합니다. ‘조상의 집별로’보다 ‘조상들의 집안별로’가 관용적이고 이해하기 쉽습니다.
  terminology: ‘고핫 자손들’은 בְּנֵי הַקְּהָתִי의 계보 표현을 적절히 반영합니다. ‘회중’은 עֵדָה에 적합합니다. בֵּית אָבוֹת는 일반 주거지를 뜻하지 않는 친족·계보상의 단위이므로, 본문과 주석 모두에서 ‘집안’으로 표현하는 것이 오해를 줄입니다.
