lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  english_pob_choice: their counted men
  chosen_korean: 그들의 계수된 사람
  alternatives_korean:
  - 그들의 شمار된 자들
  - 그들의 번호 매겨진 자들
  - 그들의 등록된 사람들
  lexicon: HALOT
  rationale: פקד는 여기서 인구 조사·계수의 맥락에서 ‘계수되다/등록되다’의 뜻이므로, 인원 총계를 드러내는 ‘계수된 사람’으로 옮겼습니다. 영어 POB의 성별-정확성 의도를 반영하되, 한국어에서는 군더더기 없이 본문에 충실하게 표현했습니다.
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאֹת וּשְׁמֹנִים
  english_pob_choice: eight thousand five hundred and eighty
  chosen_korean: 팔천오백팔십명
  alternatives_korean:
  - 팔천오백여든 명
  - 8,580명
  lexicon: HALOT
  rationale: 히브리어의 누적 합산 수사 구조를 한국어의 자연스러운 총수 표현으로 옮겼습니다. 본문이 인명/인원 총계를 말하므로 단위 ‘명’을 보완했습니다.
- source_word: וַיִּהְיוּ
  english_pob_choice: were
  chosen_korean: …이었습니다
  alternatives_korean:
  - 되었다
  - 합계는
  lexicon: HALOT
  rationale: waw-연결형 היה는 여기서 단순 과거의 서술적 연결로 기능하므로, 한국어에서는 결과 총계를 제시하는 평서형 ‘이었습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 민수기 인구조사의 성별-정확성 유지
  chosen_reading: ‘사람’과 문맥상 암시되는 남성 계수 대상을 그대로 두어, 본문이 말하는 등록된 인원을 보존했습니다.
  alternative_readings:
  - 성원
  - 인원
  - 사람들
  rationale: 4장의 레위인 계수는 실제로 특정 조건의 남성을 가리키지만, 이 절 자체는 총합을 제시하므로 성별 정보를 과도하게 확대하지 않고 본문 수준에서 보존하는 편이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
