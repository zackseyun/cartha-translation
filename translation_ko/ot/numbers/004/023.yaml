  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'to do duty'; the Hebrew expression uses military-service language metaphorically for organized tabernacle service.
    reason: lexical_alternative
translation:
  language: ko
  text: 서른 살부터 쉰 살까지는 그들을 계수하십시오. 곧 회막에서 일을 하려고 나아오는 모든 사람을 계수하여, 일을 하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘직무를 수행하려고’; 히브리어 표현은 조직된 성막 봉사를 비유적으로 군복무 언어로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן ... וָמַעְלָה / עַד בֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: From thirty years old and upward to fifty years old
  chosen_korean: 서른 살부터 쉰 살까지
  alternatives_korean:
  - 서른 살부터 그 이상 쉰 살까지
  - 서른 살부터 오십 살까지
  lexicon: HALOT
  rationale: 나이 범위를 한국어 자연문으로 옮기되, ‘부터 …까지’로 상한과 하한을 모두 분명히 드러냈습니다.
- source_word: תִּפְקֹד אוֹתָם
  english_pob_choice: you shall count them
  chosen_korean: 그들을 계수하십시오
  alternatives_korean:
  - 그들을 세십시오
  - 그들을 등록하십시오
  - 그들을 조사하십시오
  lexicon: HALOT
  rationale: פקד의 행정적·인구조사적 용법을 살려 단순 산술보다 공식적 ‘계수’로 옮겼습니다.
- source_word: כָּל הַבָּא לִצְבֹא צָבָא
  english_pob_choice: everyone who comes to do the service
  chosen_korean: 회막에서 일을 하려고 나아오는 모든 사람
  alternatives_korean:
  - 봉사하려고 들어오는 모든 사람
  - 직무를 수행하려고 오는 모든 사람
  lexicon: HALOT
  rationale: צבא의 군사적 어감은 원문에 있지만 여기서는 회막 봉사의 조직된 직무를 가리키므로, ‘일을 하려고 나아오는’으로 그 뉘앙스를 보존했습니다.
- source_word: לַעֲבֹד עֲבֹדָה
  english_pob_choice: to do the work
  chosen_korean: 일을 하게 하십시오
  alternatives_korean:
  - 봉사를 하게 하십시오
  - 업무를 하게 하십시오
  lexicon: HALOT
  rationale: עבד/עבדה의 반복을 한국어에서도 ‘일’로 살려, 직무 수행의 중복 강조를 자연스럽게 반영했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 회중의 장막에서
  lexicon: HALOT
  rationale: 성막 명칭의 통상적 대응인 ‘회막’을 사용해 지시 대상을 분명하게 했습니다.
theological_decisions:
- issue: לִצְבֹא צָבָא의 뉘앙스를 군사 용어로 살릴지 여부
  chosen_reading: 군사 은유는 살리되, 한국어 본문은 회막 직무를 가리키는 봉사 언어로 번역했습니다.
  alternative_readings:
  - 군역을 하려고 나아오는
  - 전쟁을 하듯 봉사하려는
  rationale: 민수기 4장의 문맥은 전투가 아니라 레위인의 지정된 성막 직무이므로, 군사 어휘의 조직성은 유지하되 실제 전쟁 의미는 피했습니다.
  doctrine_reference: 레위인의 회막 봉직에 대한 문맥적 해석
