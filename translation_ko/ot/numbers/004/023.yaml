  source_fidelity: 원문은 서른 살 이상 쉰 살까지의 대상, 곧 회막에서 ‘복무/조직된 직무’를 수행하고 일을 하려고 나아오는 모든 사람을 계수하라는 하나의 명령입니다. 초안은 ‘계수하여, 일을 하게 하십시오’라고 하여 원문에 없는 별도의 사역 명령과 계수 행위를 도입합니다.
