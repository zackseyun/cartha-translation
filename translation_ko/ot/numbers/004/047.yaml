  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּ֗א לַ/עֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַ/עֲבֹדַ֥ת מַשָּׂ֖א בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'the work of labor and the labor of bearing burdens.' The Hebrew repeats forms of the same noun for emphasis or categorization.
    reason: lexical_alternative
translation:
  language: ko
  text: 서른 살부터 쉰 살까지 — 곧 그 이상까지 — 곧 회막에서 일의 일을 하고 짐을 나르는 일을 하러 오는 모든 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘일의 일’과 ‘짐 나르기’처럼 같은 어근을 반복해 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  english_pob_choice: from thirty years old and upward
  chosen_korean: 서른 살부터 쉰 살까지 — 곧 그 이상까지
  alternatives_korean:
  - 서른 살부터 위로
  - 서른 살부터 그 이상
  lexicon: HALOT
  rationale: 나이의 하한과 상한을 함께 제시하는 범위 표현이므로, 한국어에서는 자연스럽게 ‘부터’와 ‘까지’를 써서 구조를 살렸습니다. ‘그 이상까지’는 원문의 상승 방향을 보완해 줍니다.
- source_word: כָּל הַבָּא
  english_pob_choice: everyone who comes
  chosen_korean: 오는 모든 사람
  alternatives_korean:
  - 나오는 모든 사람
  - 나아오는 모든 사람
  lexicon: HALOT
  rationale: בוא의 분사형을 자격 규정처럼 풀지 않고, 실제로 앞으로 나와 직무에 참여하는 사람들을 가리키는 말로 간결하게 옮겼습니다.
- source_word: לַעֲבֹד עֲבֹדַת עֲבֹדָה
  english_pob_choice: to perform the work of service
  chosen_korean: 일의 일을 하고
  alternatives_korean:
  - 봉사의 일을 하고
  - 섬김의 일을 하고
  lexicon: HALOT
  rationale: עבד/עבודה의 반복을 한국어에서 동일 어근 반복으로 드러내기보다, 의미상 긴장을 살리면서도 어색하지 않게 ‘일의 일’로 옮겨 반복성을 반영했습니다.
- source_word: וַעֲבֹדַת מַשָּׂא
  english_pob_choice: and the service of carrying loads
  chosen_korean: 짐을 나르는 일
  alternatives_korean:
  - 짐을 지는 일
  - 짐 나르기의 일
  lexicon: HALOT
  rationale: מַשָּׂא를 구체적인 ‘짐/부담’으로 이해하여, ‘나르는 일’로 옮겨 운반의 실제적 의미를 드러냈습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 회막 안에서
  - 만남의 장막에서
  lexicon: HALOT
  rationale: 성막 명칭으로 굳어진 표현을 살리되, 한국어에서는 장소 기능을 자연스럽게 드러내는 ‘-에서’를 사용했습니다.
theological_decisions:
- issue: 레위인의 직무를 나타내는 반복 어근의 번역
  chosen_reading: ‘일의 일을’이라는 중첩 표현으로 원문의 반복을 드러냈습니다.
  alternative_readings:
  - ‘봉사의 일’로 한 번만 풀어 유려하게 정리하는 방식
  - ‘일하는 일’처럼 더 직역하는 방식
  rationale: 원문은 עֲבֹדָה의 반복으로 직무의 성격을 강조하므로, 이를 평준화하지 않고 한국어에서도 반복감이 느껴지도록 했습니다.
  doctrine_reference: 본문의 문학적 강조를 보존하는 번역 원칙
- issue: ‘경배/예배’로의 신학적 전치 여부
  chosen_reading: 예배적 용어로 옮기지 않고 물리적·제도적 직무 표현을 유지했습니다.
  alternative_readings:
  - ‘성막 봉사’로 일반화하는 방식
  - ‘예배 봉사’로 전치하는 방식
  rationale: 이 절은 성소에서의 레위 직무 범위를 규정하는 문맥이므로, 예배 언어로 확대하면 מקור의 업무적·행정적 의미가 흐려집니다.
  doctrine_reference: 민수기 4장의 레위 직무 규정
