  lexicon: HALOT
  rationale: 나이의 하한과 상한을 함께 제시하는 범위 표현이므로, 한국어에서는 자연스럽게 ‘부터’와 ‘까지’를 써서 구조를 살렸습니다. ‘그 이상까지’는 원문의 상승 방향을 보완해 줍니다.
- source_word: כָּל הַבָּא
  english_pob_choice: everyone who comes
  chosen_korean: 오는 모든 사람
  alternatives_korean:
