  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
  footnotes:
  - marker: a
    text: Hebrew תַּחַשׁ (tahash) is uncertain; it may refer to a particular animal skin (traditionally rendered with options such as 'goatskin,' 'porpoise skin,' or 'dugong skin').
    reason: lexical_alternative
translation:
  language: ko
  text: 그 위에 가죽 덮개를 씌우고, 그 위에 온통 청색인 천을 펴고, 그 채들을 제자리에 놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַּחַשׁ(tahash)가 가리키는 동물 가죽의 종류는 확정하기 어렵습니다. 전통적으로 여러 종류의 가죽으로 이해되어 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  english_pob_choice: they shall put over it
  chosen_korean: 그 위에 ... 씌우고
  alternatives_korean:
  - 그 위에 ... 두고
  - 그 위에 ... 놓고
  lexicon: HALOT
  rationale: 덮개를 그 대상 위에 얹는 절차를 한국어로 자연스럽게 나타내기 위해 ‘씌우고’를 사용했습니다. 단순한 ‘두다/놓다’보다 덮는 동작이 더 분명합니다.
- source_word: עוֹר תַּחַשׁ
  english_pob_choice: fine leather
  chosen_korean: 가죽 덮개
  alternatives_korean:
  - 다시 가죽 덮개
  - 해달가죽 덮개
  - 두종가죽 덮개
  lexicon: HALOT
  rationale: תַּחַשׁ의 정확한 동물 식별이 불확실하므로, 본문 기능을 드러내는 ‘가죽 덮개’로 옮겼습니다. 추정 가능한 동물명을 단정하지 않기 위한 선택입니다.
- source_word: בֶגֶד כְּלִיל תְּכֵלֶת
  english_pob_choice: a cloth wholly of blue
  chosen_korean: 온통 청색인 천
  alternatives_korean:
  - 온전히 청색인 천
  - 전부 청색인 천
  lexicon: HALOT
  rationale: ‘כְּלִיל’의 완전성은 ‘온통’으로, ‘תְּכֵלֶת’은 성막 문맥의 관용적 색채어로서 ‘청색’으로 옮겼습니다. ‘천’은 여기서 덮는 층의 기능을 잘 드러냅니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles in place
  chosen_korean: 그 채들을 꽂아 두어야 합니다
  alternatives_korean:
  - 그 막대들을 꽂아 두어야 합니다
  - 그 운반 채들을 제자리에 두어야 합니다
  lexicon: HALOT
  rationale: בַּדִּים은 언약궤의 운반 채를 가리키므로 전통적 성막 용어에 맞는 ‘채들’을 사용했습니다. 동작은 문맥상 ‘꽂다’가 가장 직접적입니다.
theological_decisions:
- issue: 성막 기물 덮기의 순서와 완전한 가림
  chosen_reading: 가죽 덮개를 먼저 씌우고 그 위에 청색 천을 덮는 순서를 그대로 살렸습니다.
  alternative_readings:
  - ‘가죽’과 ‘청색 천’을 하나의 일반 덮개로 완화해서 표현하는 방식
  - 순서를 덜 분명하게 옮기는 방식
  rationale: 본문은 두 겹의 덮개와 마지막으로 채를 꽂는 절차를 명시하므로, 예배 기물의 거룩함과 운반 준비를 드러내기 위해 순서를 보존해야 합니다.
  doctrine_reference: 민수기 4장의 성막 운반 규례
