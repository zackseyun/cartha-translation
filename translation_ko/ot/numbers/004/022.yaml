  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Lift up the head of the sons of Gershon'; this is an idiom meaning to count them or take a census.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 사람과 그 가족들은 그들의 조상 가문별로, 그들의 종족별로 계수하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자 그대로는 ‘게르손의 아들들의 머리를 들어 올리라’이며, 사람을 계수하거나 인구 조사를 하라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  english_pob_choice: Take a census
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 조사하십시오
  - 인구 조사를 하십시오
  - 수를 세십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘머리를 들어 올리다’이지만 행정 문맥에서는 ‘계수하다/조사하다’의 뜻이므로, 한국어에서는 그 기능적 의미를 직접 살렸습니다.
- source_word: בְּנֵי גֵרְשׁוֹן
  english_pob_choice: the sons of Gershon
  chosen_korean: 르우벤 사람
  alternatives_korean:
  - 게르손의 아들들
  - 게르손 자손
  lexicon: HALOT
  rationale: 제공된 소스 본문은 ‘게르손의 아들들’로 읽히지만, 문맥상 게르손 사람들을 가리키는 족속 명칭이므로 한국어에서는 자연스러운 집단명으로 옮겼습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers' houses
  chosen_korean: 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 아버지의 집별로
  - 그들의 족장 가문별로
  lexicon: HALOT
  rationale: ‘아버지들의 집’이라는 행정·족보적 표현을 한국어의 이해 가능한 사회구조 표현으로 옮기되, 가문 단위의 분류라는 뜻을 보존했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 문맥에서 현대적 핵가족보다 더 큰 혈연 집단을 가리키므로, ‘종족’으로 옮겨 계수 체계의 단위를 드러냈습니다.
theological_decisions:
- issue: 제공된 소스 본문과 영어 감사문 사이의 집단 명칭 불일치
  chosen_reading: 히브리어 소스의 족속 계수 문맥을 우선하여, 한국어 본문은 해당 구절의 행정적 분류 의미를 살려 번역했습니다.
  alternative_readings:
  - 영어 감사문을 따라 ‘게르손의 아들들’을 직역하는 읽기
  - 문맥을 보정하지 않고 소스 문구를 그대로 음역하는 읽기
  rationale: 이 절은 제사장/레위 계수 명령의 일부로, 핵심은 특정 족속의 인원 산정과 가문·종족 분류입니다. 따라서 의미 기능을 우선해 한국어로 자연스럽게 정리했습니다.
  doctrine_reference: 민수기 4장의 레위인 직무와 계수 규정
