  chosen_reading: 히브리어 소스의 족속 계수 문맥을 우선하여, 한국어 본문은 해당 구절의 행정적 분류 의미를 살려 번역했습니다.
  alternative_readings:
  - 영어 감사문을 따라 ‘게르손의 아들들’을 직역하는 읽기
  - 문맥을 보정하지 않고 소스 문구를 그대로 음역하는 읽기
  rationale: 이 절은 제사장/레위 계수 명령의 일부로, 핵심은 특정 족속의 인원 산정과 가문·종족 분류입니다. 따라서 의미 기능을 우선해 한국어로 자연스럽게 정리했습니다.
