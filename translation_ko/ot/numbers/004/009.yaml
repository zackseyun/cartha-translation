  naturalness: ‘그 등잔들과 그 불집게들과… 위에 덮어’는 한국어로 부자연스럽고, ‘그것에 대해 섬기는 데 쓰게 해야 합니다’도 결속과 의미가 불명확합니다. 기물들을 목적어로 묶고 ‘푸른 천으로 덮어야 합니다’로 옮기는 것이 현대 표준 한국어 합쇼체에 자연스럽습니다.
