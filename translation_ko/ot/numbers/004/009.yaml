id: NUM.4.9
reference: Numbers 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקְח֣וּ בֶּ֣גֶד תְּכֵ֗לֶת וְ/כִסּ֞וּ אֶת מְנֹרַ֤ת הַ/מָּאוֹר֙ וְ/אֶת נֵ֣רֹתֶ֔י/הָ וְ/אֶת מַלְקָחֶ֖י/הָ וְ/אֶת מַחְתֹּתֶ֑י/הָ וְ/אֵת֙ כָּל כְּלֵ֣י שַׁמְנָ֔/הּ אֲשֶׁ֥ר יְשָׁרְתוּ לָ֖/הּ בָּ/הֶֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
  footnotes:
  - marker: a
    text: Or 'a cloth of blue' or 'a blue-purple cloth.' The Hebrew תְּכֵלֶת refers to the distinctive dyed fabric used in tabernacle furnishings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 빛을 위한 등잔대와 그 등잔들, 불집게들, 불똥그릇들, 그리고 그것을 섬기는 데 쓰는 모든 기름 그릇을 푸른 천으로 덮어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘푸른’은 히브리어 תְּכֵלֶת를 옮긴 것입니다. 이 말은 성막 기물에 사용된 특징적인 푸른색 또는 청자색 계열의 염색 직물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  english_pob_choice: a blue cloth
  chosen_korean: 푸른 천
  alternatives_korean:
  - 푸른 옷감
  - 청색 천
  - 푸른 직물
  lexicon: HALOT
  rationale: בֶּגֶד는 여기서 제의용 '옷'보다 덮는 용도의 '천'이 자연스럽고, תְּכֵלֶת의 전용 염색 재질은 색채를 드러내는 '푸른'으로 옮겼습니다.
- source_word: מְנֹרַת הַמָּאוֹר
  english_pob_choice: the lampstand for the light
  chosen_korean: 빛을 위한 등잔대
  alternatives_korean:
  - 빛의 등잔대
  - 등불을 위한 등잔대
  - 조명을 위한 등잔대
  lexicon: HALOT
  rationale: מְנוֹרָה는 '등잔대'이고, הַמָּאוֹר는 단순 소유가 아니라 기능을 나타내므로 '빛을 위한'으로 기능적 관계를 살렸습니다.
- source_word: מַלְקָחֶיהָ / מַחְתֹּתֶיהָ
  english_pob_choice: its tongs / its firepans
  chosen_korean: 그 불집게들 / 그 불똥그릇들
  alternatives_korean:
  - 그 집게들 / 그 화로들
  - 그 불집게들 / 그 향로들
  lexicon: HALOT
  rationale: מַלְקָחִים은 등잔을 손질하는 집게류이고, מַחְתָּה는 제의 맥락에서 '불똥그릇'이 가장 구체적으로 기능을 드러내므로, 일반적인 '화로'보다 정확한 물건 이름을 택했습니다.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  english_pob_choice: all its oil vessels
  chosen_korean: 그 모든 기름 그릇들
  alternatives_korean:
  - 그 모든 기름 용기들
  - 그 모든 기름을 담는 기구들
  lexicon: HALOT
  rationale: כְּלִים은 그릇/용기이며, שֶׁמֶן과 결합해 등잔의 기름을 담거나 다루는 물건들을 가리키므로 직역에 가까운 '기름 그릇들'이 무난합니다.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  english_pob_choice: with which they minister to it
  chosen_korean: 그것에 대해 섬기는 데 쓰게 해야 합니다
  alternatives_korean:
  - 그것을 섬기는 데 사용해야 합니다
  - 그것에 봉사하는 데 써야 합니다
  lexicon: HALOT
  rationale: יָשַׁר/שָׁרַת의 성막 문맥상 의미는 단순 '사용하다'보다 '제의적으로 섬기다'에 가깝지만, 도구(בָּהֶם)가 복수이므로 한국어는 '쓰게 해야 합니다'로 도구성과 섬김의 뜻을 함께 살렸습니다.
theological_decisions:
- issue: 성막 기물의 기능적 관계 표현
  chosen_reading: '''빛을 위한 등잔대''처럼 기능을 드러내어 번역했습니다.'
  alternative_readings:
  - '''빛의 등잔대''처럼 속격을 직역하는 방식'
  - '''조명을 위한 등잔대''처럼 현대적 기능어로 풀이하는 방식'
  rationale: 본문은 단순 소유보다 성막에서의 용도와 역할을 강조하므로, 제의 문맥을 유지하면서도 한국어로 자연스러운 기능 표현을 택했습니다.
  doctrine_reference: 성막 기물 묘사에 대한 문맥 충실성
- issue: 제의적 섬김 동사
  chosen_reading: '''섬기다''를 유지하되 도구 사용을 함께 드러내는 표현을 택했습니다.'
  alternative_readings:
  - '''사용하다''로 평이하게 옮기는 방식'
  - '''봉사하다''로 일반화하는 방식'
  rationale: 성막 문맥의 שׁרת는 단순한 사용이 아니라 하나님께 드리는 제의적 봉사를 포함하므로, 한국어에서도 그 뉘앙스가 보이도록 했습니다.
  doctrine_reference: 레위기/민수기의 성막 봉사 용어
