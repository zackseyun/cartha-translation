id: NUM.4.43
reference: Numbers 4:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'everyone who enters for duty.' The Hebrew participle can emphasize those who present themselves or enter into the assigned service.
    reason: lexical_alternative
  - marker: b
    text: '''For service'' translates a term that can denote organized duty, sometimes with military overtones; here it refers to Levitical service.'
    reason: cultural_note
translation:
  language: ko
  text: 서른 살 이상 쉰 살까지의 사람으로서, 회막에서 할 일을 위하여 봉사[b]에 나아오는[a] 모든 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 ‘나아오는’은 맡겨진 직무에 참여하려고 오는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘봉사’는 조직된 직무 또는 복무를 뜻할 수 있는 말입니다. 여기서는 레위인의 회막 봉사를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן ... שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  english_pob_choice: from thirty years old and upward
  chosen_korean: 서른 살부터
  alternatives_korean:
  - 서른 살에서부터
  - 서른 살 이상
  lexicon: HALOT
  rationale: 나이 범위를 자연스러운 한국어로 옮기되, 하한선의 포함 의미를 살리기 위해 ‘부터’를 사용했습니다.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: and up to fifty years old
  chosen_korean: 쉰 살까지의 사람으로서
  alternatives_korean:
  - 쉰 살까지
  - 쉰 살에 이르기까지
  lexicon: HALOT
  rationale: 상한선을 분명히 하면서 이어지는 주어 역할을 드러내기 위해 ‘사람으로서’로 풀어 썼습니다.
- source_word: כָּל הַבָּא
  english_pob_choice: everyone who comes
  chosen_korean: 나오는 모든 사람
  alternatives_korean:
  - 오는 모든 사람
  - 들어오는 모든 사람
  lexicon: HALOT
  rationale: 히브리어 분사 בוא는 이 문맥에서 임무에 나아오는 사람들을 가리키므로, ‘나오는’으로 자연스럽게 옮겼습니다.
- source_word: לַצָּבָא
  english_pob_choice: for service
  chosen_korean: 회막에서의 일을 위해
  alternatives_korean:
  - 봉사를 위해
  - 임무를 위해
  lexicon: HALOT
  rationale: צָבָא의 조직된 직무성을 살리되 군사적 뉘앙스는 피하고, 이어지는 עֲבֹדָה와의 중복을 줄이기 위해 ‘회막에서의 일’로 구체화했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 회막 안에서
  - 만남의 장막에서
  lexicon: HALOT
  rationale: פְּרËאָׁ? standard Pentateuchal 용어인 אֹהֶל מוֹעֵד는 관용적으로 ‘회막’으로 옮기며, 전치사 בְּ는 한국어 문맥상 ‘에서’로 처리했습니다.
theological_decisions:
- issue: צָבָא의 군사적 배경 여부
  chosen_reading: 레위인의 정규 봉사/직무를 가리키는 조직된 섬김으로 읽었습니다.
  alternative_readings:
  - 군대식 편제의 복무
  - 단순한 일반 노동
  rationale: 문맥이 성막 봉사 규정이므로 군사 은유를 과장하지 않으면서도, 단순 노동보다 더 구조화된 직무라는 점을 보존했습니다.
  doctrine_reference: 민수기 4장의 레위 직무 규정
