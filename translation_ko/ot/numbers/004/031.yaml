id: NUM.4.31
reference: Numbers 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
  footnotes:
  - marker: a
    text: Or 'charge' for 'duty' (מִשְׁמֶרֶת), emphasizing an assigned responsibility.
    reason: lexical_alternative
  - marker: b
    text: Or 'boards of the tabernacle' for 'frames of the tabernacle.' The Hebrew term can denote structural boards/planks; 'frames' is chosen to reflect their architectural function.
    reason: lexical_alternative
  - marker: c
    text: Or 'sockets' for 'bases' (אֲדָנִים), a more technical term for the foundation pieces in the tabernacle structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 회막에서 하는 모든 일을 위하여 그들에게 맡겨진 운반 임무[a]입니다. 곧 성막의 널빤지[b]와 가로대와 기둥과 받침[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맡겨진 직무’로 옮길 수 있습니다. 히브리어 מִשְׁמֶרֶת는 여기서 맡겨진 책임 또는 직무를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘판자들’로 옮길 수 있습니다. 히브리어 קֶרֶשׁ는 성막을 이루는 구조 부재를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘소켓들’로 옮길 수 있습니다. 히브리어 אֲדָנִים은 성막 구조물의 받침 또는 기초 부품을 가리키는 기술 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  english_pob_choice: duty
  chosen_korean: 책임
  alternatives_korean:
  - 직무
  - 맡은 일
  - 의무
  lexicon: HALOT
  rationale: 배당된 맡은 바를 뜻하는 문맥이므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘책임’을 택했습니다.
- source_word: מַשָּׂאָם
  english_pob_choice: their burden
  chosen_korean: 그들의 짐
  alternatives_korean:
  - 그들의 짐거리
  - 그들이 져야 할 것
  - 그들의 부담
  lexicon: HALOT
  rationale: 운반해야 할 물건들을 가리키므로, 추상적 ‘부담’보다 구체적인 ‘짐’이 원문의 물리적 의미를 더 잘 드러냅니다.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  english_pob_choice: the frames of the tabernacle
  chosen_korean: 성막의 널판들
  alternatives_korean:
  - 성막의 틀들
  - 성막의 판자들
  - 성막의 프레임들
  lexicon: HALOT
  rationale: tabernacle의 구조 부재를 한국어 성막 용례에 맞춰 ‘널판들’로 옮겼습니다. ‘프레임’은 기능을 살리지만 성경 문맥에서 다소 기술적 외래어로 들릴 수 있습니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침들
  alternatives_korean:
  - 그 소켓들
  - 그 기초들
  - 그 밑받침들
  lexicon: HALOT
  rationale: 성막 구조물의 바닥받침을 가리키므로, 기술적이되 이해하기 쉬운 ‘받침들’이 적절합니다.
theological_decisions:
- issue: 회막/성막의 이중 구조물 표현
  chosen_reading: 회막에서의 봉사 범위와 성막 구조 부재를 모두 살리기 위해, 앞부분은 ‘회막에서의 그들의 모든 일’로, 뒤는 ‘성막의 널판들…’로 구분해 옮겼습니다.
  alternative_readings:
  - ‘회막 안에서’로 단순화
  - ‘장막’으로 통일
  rationale: 원문은 장소(회막)와 운반 대상(성막 구조 부재)을 함께 제시하므로, 두 요소를 분리해 주는 편이 의미를 더 정확히 보존합니다.
  doctrine_reference: 민수기 4장의 레위인 직무 규정
- issue: 집합 명사와 열거의 관계
  chosen_reading: 열거되는 부재들을 모두 복수형으로 처리해, 운반·관리 대상이 여러 항목임을 분명히 했습니다.
  alternative_readings:
  - 단수 집합으로 처리
  - ‘널판, 띠, 기둥, 받침’처럼 무관사식 나열
  rationale: 히브리어 복수형과 목록 구조를 한국어에서도 반영해야 각 부품이 각각 담당된 품목임이 드러납니다.
  doctrine_reference: 성막 운반 규례의 문맥상 해석
