lexical_decisions:
- source_word: וּ/פְקוּדֵ֕י
  english_pob_choice: the numbered men
  chosen_korean: 등록된 사람들
  alternatives_korean:
  - 계수된 사람들
  - 조사된 사람들
  - 번호가 매겨진 사람들
  lexicon: פָּקַד
  rationale: 문맥상 단순한 ‘계수’보다 공동체 안에서 명단에 올려져 파악된 사람들을 뜻하므로, 출애굽기·민수기의 인구 조사 맥락을 살려 ‘등록된 사람들’로 옮겼습니다.
- source_word: מִשְׁפְּחֹ֖ת
  english_pob_choice: clans
  chosen_korean: 가문들의
  alternatives_korean:
  - 족속들의
  - 씨족들의
  - 가문들
  lexicon: מִשְׁפָּחָה
  rationale: 히브리어 מִשְׁפָּחָה는 혈연 단위를 가리키므로, 현대 한국어에서 가장 자연스럽고 문맥에 맞는 ‘가문’으로 옮겼습니다.
- source_word: לְ/בֵ֥ית אֲבֹתָֽ/ם
  english_pob_choice: by their fathers' houses
  chosen_korean: 그들의 조상들의 집별로
  alternatives_korean:
  - 그들의 조상 가문별로
  - 그들의 아버지들의 집별로
  - 그들의 부계 집안별로
  lexicon: בֵּית אָב
  rationale: 직역의 골격을 유지하면서도 한국어에서 이해되도록 ‘조상들의 집’으로 풀어, 혈통·가계 단위를 나타내는 표현임을 드러냈습니다.
theological_decisions:
- issue: 민수기 인구 조사 용어의 번역 톤
  chosen_reading: 의례적·행정적 목록을 드러내기 위해 ‘등록된 사람들’로 번역했습니다.
  alternative_readings:
  - ‘계수된 사람들’
  - ‘명수된 자들’
  rationale: 본문은 신학적 해설보다 공동체 편제의 실제 목록을 제시하므로, 지나치게 종교적이거나 고어적인 표현보다 행정적 성격이 살아 있는 표현을 택했습니다.
  doctrine_reference: 민수기 1–4장의 레위인 계수/배치 문맥
- issue: 문장 종결부의 콜론 처리
  chosen_reading: 히브리어 원문의 열거 구조를 반영해 한국어도 미완결의 목록형 종결로 두었습니다.
  alternative_readings:
  - 완결형 서술로 매끈하게 재구성
  rationale: 이 절은 앞뒤 목록 항목과 함께 읽히는 형식이므로, 원문의 구조를 보존하는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 히브리어 시상/문장 구조 보존 원칙
