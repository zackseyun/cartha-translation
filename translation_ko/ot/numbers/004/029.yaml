  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
  footnotes:
  - marker: a
    text: Or 'the descendants of Merari' or 'the Merarites.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by their fathers' houses,' a genealogical expression for paternal household groupings.
    reason: cultural_note
translation:
  language: ko
  text: 므라리의 아들들[a]을 그들의 씨족별로, 그들의 조상 가문별로[b] 계수하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘므라리의 후손들’ 또는 ‘므라리 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 아버지들의 집별로’. 부계 계보에 따른 가문 단위를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  english_pob_choice: the sons of Merari
  chosen_korean: 므라리의 아들들
  alternatives_korean:
  - 므라리의 후손들
  - 므라리 사람들
  lexicon: HALOT
  rationale: בְּנֵי + 인명은 문자적으로는 ‘아들들’이지만, 계수 문맥에서는 혈통상 후손을 가리키므로 한국어에서도 직역 구조를 유지하되 자연스럽게 ‘므라리의 아들들’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족들
  alternatives_korean:
  - 그들의 가족들
  - 그들의 종족들
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이스라엘의 계수·행정 문맥에서 친족 하위 단위를 가리키므로, 현대 한국어에서 그 구조를 잘 드러내는 ‘씨족들’을 택했습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers' houses
  chosen_korean: 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 아버지들의 집별로
  - 그들의 부계 가문별로
  lexicon: HALOT
  rationale: 직역하면 ‘아버지들의 집’이지만, 한국어에서는 낯설고 의미가 흐려질 수 있어 부계 친족 단위를 드러내는 ‘조상 가문’으로 옮기되 구조는 보존했습니다.
- source_word: תִּפְקֹד
  english_pob_choice: you shall count
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 세십시오
  - 기록하십시오
  - 소집하여 세십시오
  lexicon: HALOT
  rationale: פקד는 이 절에서 인구 조사·명부 작성의 뜻이므로, 단순 계산보다 공식적 등록 뉘앙스가 있는 ‘계수하십시오’가 적절합니다.
