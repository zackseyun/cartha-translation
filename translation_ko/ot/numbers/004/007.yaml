  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the table of showbread.' The Hebrew is more literally 'the table of the Presence.'
    reason: alternative_reading
  - marker: b
    text: Or 'the continual bread.' This refers to the bread regularly kept before the LORD on the table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 임재의 상[a] 위에 청색 천을 펴고, 그 위에 접시들과 잔들과 대접들과 전제용 병들을 놓아야 합니다. 늘 두는 떡[b]도 그 위에 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진설병상’. 히브리어를 더 직역하면 ‘얼굴/임재의 상’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘계속되는 떡’. 이는 야훼 앞의 상 위에 늘 놓아 두는 떡을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  english_pob_choice: the table of the Presence
  chosen_korean: 진설병상
  alternatives_korean:
  - 임재의 상
  - 진설병의 상
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘얼굴/임재의 상’이라는 뜻이지만, 한국어에서는 성막 제의 용어로 굳어진 ‘진설병상’이 본문의 제의적 대상을 가장 자연스럽게 드러냅니다.
- source_word: בֶּגֶד תְּכֵלֶת
  english_pob_choice: a blue cloth
  chosen_korean: 청색 휘장
  alternatives_korean:
  - 파란 천
  - 푸른 휘장
  lexicon: HALOT
  rationale: תְּכֵלֶת의 성막 문맥상 특수한 청색을 살리되, 물건을 덮는 천이라는 기능을 살려 ‘휘장’으로 옮겼습니다.
- source_word: הַקְּעָרֹת / הַכַּפֹּת / הַמְּנַקִּיֹּת
  english_pob_choice: the plates, the cups, the bowls
  chosen_korean: 대접들과 숟가락들과 그릇들
  alternatives_korean:
  - 접시들과 컵들과 사발들
  - 쟁반들과 잔들과 대접들
  lexicon: HALOT
  rationale: 각 기명의 정확한 형태가 분명하지 않으므로, 제의 기물이라는 기능을 유지하면서 한국어로 자연스럽고 구별되는 일반 명칭으로 옮겼습니다.
- source_word: קְשׂוֹת הַנָּסֶךְ
  english_pob_choice: the pitchers for the drink offering
  chosen_korean: 전제의 주발들
  alternatives_korean:
  - 전제용 주전자들
  - 부어 드리는 그릇들
  lexicon: HALOT
  rationale: נֶסֶךְ의 ‘붓는 제물’ 개념을 살려 ‘전제’로 옮기고, 그에 속한 용기를 문맥상 자연스러운 제의 용어인 ‘주발들’로 처리했습니다.
- source_word: לֶחֶם הַתָּמִיד
  english_pob_choice: the regular bread
  chosen_korean: 항상 드리는 떡
  alternatives_korean:
  - 계속 드리는 떡
  - 정기적으로 드리는 떡
  lexicon: HALOT
  rationale: 문맥은 상 위에 계속 놓이는 떡을 가리키므로, English POB의 ‘regular bread’에 대응하면서 제의적 지속성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 제의 용어의 가시성
  chosen_reading: ‘진설병상’과 ‘항상 드리는 떡’으로 성막 안의 지속적 예식을 한국어 독자가 즉시 알아보게 했습니다.
  alternative_readings:
  - ‘임재의 상’과 ‘상시의 빵’
  - ‘진설된 떡’ 중심의 직역
  rationale: 이 절은 단순한 식탁 묘사가 아니라 야훼 앞에 계속 놓이는 성소 기물을 지시하므로, 한국 교회 용례에 맞으면서도 제의 의미가 분명한 표현이 필요합니다.
  doctrine_reference: 출 25장/레 24장의 성막 제의 배경
