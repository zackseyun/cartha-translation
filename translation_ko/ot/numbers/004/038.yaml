  lexicon: פקד
  rationale: 문맥상 단순한 ‘명단 등재’가 아니라 인원 집계를 가리키므로, POB의 ‘numbered men’을 따라 ‘계수된 사람들’로 옮겨 원문의 계수 의미를 드러냈습니다.
- source_word: בְּנֵ֣י גֵרְשׁ֑וֹן
  english_pob_choice: the sons of Gershon
  chosen_korean: 게르손 자손
  alternatives_korean:
  - 게르손의 아들들
  - 게르손의 자손들
  lexicon: בני + 고유명사
  rationale: 히브리어의 집단/씨족 표지를 살려 관용적으로 ‘자손’으로 옮겼고, 성경 인명은 통용되는 음역을 따랐습니다.
- source_word: לְמִשְׁפְּחוֹתָ֖ם וּלְבֵית אֲבֹתָֽם
  english_pob_choice: by their clans and by their fathers' houses
  chosen_korean: 그들의 씨족과 그들의 조상의 집안별로
  alternatives_korean:
  - 그들의 가족들과 그들의 조상의 집안별로
  - 그들의 족속과 그들의 조상의 집안별로
  lexicon: משפחה / בית אב
  rationale: ‘clans’와 ‘fathers’ houses’를 각각 씨족과 조상의 집안으로 분리해, 계보적·사회적 구분을 한국어로 분명히 했습니다.
