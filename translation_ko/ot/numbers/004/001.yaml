    issue: The Korean footnote inaccurately presents ‘야훼’ as an alternative rendering while the translation itself already uses ‘야훼’.
    rationale: This obscures rather than documents the rendering of יהוה. A neutral source-language/transliteration note resolves the problem without asserting a textual variant or a doctrinally preferred alternative.
  - severity: low
    issue: ‘말씀하여 이르셨습니다’ is overly literal and awkward in this isolated, modern Korean verse.
    rationale: The paired Korean verbs imitate the Hebrew speech formula but do not read naturally with a sentence-final 합쇼체 ending. ‘말씀하셨습니다’ retains the verse’s communicative meaning.
