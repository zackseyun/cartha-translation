  language: ko
  text: 레위 사람들을 이스라엘 자손 가운데서 데려다가 그들을 정결하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘 백성’. 직역하면 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 데려다가
  alternatives_korean:
  - 데려오십시오
  - 가져오십시오
  - 선택하십시오
  lexicon: HALOT
  rationale: 레위인을 공동체 가운데서 분리해 세우는 동작을 한국어에서 자연스럽게 드러내기 위해, 단순한 ‘취하다’보다 관계적·행위적 뉘앙스가 있는 ‘데려다가’를 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 직역형 ‘레위인들’도 가능하지만, 한국어에서 자연스럽고 현재 문맥의 집단 명칭으로 분명한 ‘레위 사람들’을 사용했습니다.
- source_word: מִתּוֹךְ
  english_pob_choice: from among
  chosen_korean: 가운데서
  alternatives_korean:
  - 중에서
  - 한가운데서
  lexicon: HALOT
  rationale: 선택·분리의 의미를 담는 전치사구이므로, 공동체 내부에서 떼어 내는 뜻을 살리는 ‘가운데서’가 가장 간명합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 영어 POB가 남성형을 유지한 것처럼, 히브리어의 친족·언약적 표현을 살려 ‘이스라엘 자손’을 유지했습니다.
- source_word: וְטִהַרְתָּ
  english_pob_choice: and cleanse them
  chosen_korean: 정결하게 하십시오
  alternatives_korean:
  - 깨끗하게 하십시오
  - 정화하십시오
  lexicon: HALOT
  rationale: 의례적 정결을 뜻하는 טהר의 문맥이므로, 일상적 위생보다 제의적 의미가 분명한 ‘정결하게 하다’를 택했습니다.
theological_decisions:
- issue: 의례적 정결 명령의 성격
  chosen_reading: 이 구절은 레위인을 봉사에 앞서 제의적으로 정결하게 하라는 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 신체적 세정 명령
  - 상징적 준비만을 뜻하는 표현
  rationale: 문맥상 정결은 성막 봉사에 참여하기 위한 예식적 준비를 가리키므로, 이를 한국어에서도 ‘정결하게 하다’로 드러내는 것이 본문 의도를 가장 잘 보존합니다.
  doctrine_reference: 민수기 8장 문맥의 제의적 정결 개념
