translation:
  language: ko
  text: 그리하여 너는 레위인들을 이스라엘 자손들[b] 가운데서 구별해야 합니다[a]. 그리고 레위인들은 내 것이 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분리하다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’; 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내게 속할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  english_pob_choice: So you shall separate
  chosen_korean: 그리하여 너는 … 구별해야 합니다
  alternatives_korean:
  - 너는 … 분리해야 합니다
  - 너는 … 따로 떼어 놓아야 합니다
  - 너는 … 따로 세워야 합니다
  lexicon: HALOT
  rationale: בדל의 기본 의미는 ‘나누다/구별하다’이므로, 제의적·관계적 분리를 함께 살릴 수 있는 ‘구별하다’가 가장 자연스럽고 원문의 명령성을 잘 전달합니다.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the sons of Israel
  chosen_korean: 이스라엘 자손들 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘 백성 가운데서
  - 이스라엘 자손들 중에서
  lexicon: HALOT
  rationale: מִתּוֹךְ은 집단 내부에서의 분리를 뜻하므로 ‘가운데서’가 가장 직접적입니다. בְּנֵי יִשְׂרָאֵל은 문자형을 살려 ‘이스라엘 자손들’로 옮겼습니다.
- source_word: וְהָיוּ לִי
  english_pob_choice: and the Levites shall be mine
  chosen_korean: 레위 사람들은 내 것이 될 것입니다
  alternatives_korean:
  - 레위 사람들은 내 소유가 될 것입니다
  - 레위 사람들은 내게 속할 것입니다
  - 레위 사람들은 내 것입니다
  lexicon: HALOT
  rationale: לִי + היה는 단순한 소속/귀속을 나타내므로, POB의 ‘shall be mine’을 따라 소유·귀속의 관계를 직설적으로 표현했습니다. ‘내 것이 될 것입니다’는 소속의 뉘앙스를 유지하면서도 현대 한국어로 자연스럽습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 사람
  - 레위인
  lexicon: HALOT
  rationale: 레위 지파 구성원을 가리키는 표현으로, 현대 한국어에서 충분히 이해되면서도 집단성을 보존하는 ‘레위 사람들’을 택했습니다.
theological_decisions:
- issue: ‘separate’의 번역을 의식적 구별과 제의적 구별 중 어떻게 살릴지
  chosen_reading: ‘구별하다’로 번역하되, 본문 자체의 소속 선언을 해치지 않도록 유지했습니다.
  alternative_readings:
  - ‘성별하다’
  - ‘따로 떼어 놓다’
  rationale: 이 절은 레위인들의 제의적 지위 배경을 전제하지만, 직접적으로는 야훼께 속하게 되는 분리를 말합니다. 따라서 한국어에서는 ‘구별하다’가 가장 과도한 신학적 확장을 피하면서도 본문의 기능을 살립니다.
  doctrine_reference: 본문의 표면적 명령과 소속 선언을 우선 보존하는 번역 원칙
