reference: Numbers 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
  footnotes:
  - marker: a
    text: Or 'among humankind and among animals.' The Hebrew uses singular collective terms in contrast.
    reason: lexical_alternative
  - marker: b
    text: Or 'I set them apart for myself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이스라엘 자손 가운데 사람에게서나 짐승에게서나 처음 난 것은 모두 내 것이기 때문입니다.[a] 내가 이집트 땅에서 모든 처음 난 것을 친 날에, 나는 그들을 나를 위하여 거룩하게 구별하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간과 동물 가운데.’ 히브리어는 사람과 짐승을 대조하는 단수 집합 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 나를 위하여 성별하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 진술의 근거를 밝히는 설명적 כִּי를 한국어에서는 문두의 ‘이는’으로 자연스럽게 옮겨, 단순 인과보다 해설적 연결을 살렸습니다.
- source_word: כָל בְּכוֹר
  english_pob_choice: every firstborn
  chosen_korean: 모든 첫째 태어난 자들
  alternatives_korean:
  - 모든 맏아들
  - 모든 첫생아
  lexicon: HALOT
  rationale: ‘בְּכוֹר’의 핵심은 ‘첫째로 난 자’이므로 성별을 미리 제한하지 않고, 문맥상 사람과 짐승 모두에 적용되는 집합적 표현을 살렸습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: among man and among beast
  chosen_korean: 사람이나 짐승이나
  alternatives_korean:
  - 인간과 짐승 가운데
  - 사람과 가축 가운데
  lexicon: HALOT
  rationale: 반복되는 전치사의 병렬을 한국어에서는 자연스럽게 ‘~이나’로 풀어, 인간/동물의 대조를 유지하면서도 과도하게 문어적이지 않게 했습니다.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  english_pob_choice: I consecrated them to myself
  chosen_korean: 그들을 내게 구별하여 드렸습니다
  alternatives_korean:
  - 그들을 내게 성별하였습니다
  - 그들을 내게 거룩하게 하였습니다
  lexicon: HALOT
  rationale: קדשׁ의 성별·구별 의미를 살리되, 한국어에서 ‘구별하여 드리다’는 하나님께 돌려 바치고 따로 떼어 놓는 사역적 의미를 비교적 직접적으로 전달합니다.
theological_decisions:
- issue: ‘אָדָם’의 성별 비특정 인간 범주 표현
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 인간
  rationale: 여기서는 짐승과의 대조 속에서 인간 범주를 가리키므로, 성별-비특정이면서도 원문의 구체성을 보존하는 ‘사람’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; contextually human category terms may be rendered with ordinary Korean nouns.'
- issue: ‘הִקְדַּשְׁתִּי’의 성별/헌신 의미
  chosen_reading: 구별하여 드렸습니다
  alternative_readings:
  - 성별하였습니다
  - 거룩하게 하였습니다
  rationale: 이 구절은 첫째 태어난 자들이 야훼께 속한 것으로 선언되는 맥락이므로, 단순한 분리보다 하나님께 돌려 바치는 헌납적 뉘앙스를 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological weight without unnecessary jargon.'
