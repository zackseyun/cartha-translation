revisions:
- from: 이는 이스라엘 자손 가운데 있는 모든 첫째 태어난 자들 — 사람이나 짐승이나 — 가 다 내 것입니다. 내가 이집트 땅에서 모든 첫째 태어난 자를 치던 날, 나는 그들을 내게 구별하여 드렸습니다.[a][b]
  to: 이는 이스라엘 자손 가운데 사람에게서나 짐승에게서나 처음 난 것은 모두 내 것이기 때문입니다.[a] 내가 이집트 땅에서 모든 처음 난 것을 친 날에, 나는 그들을 나를 위하여 거룩하게 구별하였습니다.[b]
  rationale: The revision removes the unsupported offering nuance, corrects the awkward opening construction, and places each footnote at its relevant phrase. It retains the collective scope of ‘every firstborn,’ the contrast between humans and animals, the historical temporal clause, and the sacred sense of consecration.
