    rationale: 원문은 문맥상 ‘그 일의 봉사’에서 물러난 뒤 더 이상 그 봉사 일을 수행하지 않는다는 뜻입니다. 한국어 ‘일하지 않아야 합니다’는 모든 종류의 일을 해서는 안 된다는 의미로 넓게 읽힐 수 있으며, 바로 다음 절에서 계속 허용되는 보조 역할과도 긴장을 일으킬 수 있습니다.
