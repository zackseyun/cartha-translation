review_pass:
  verdict: revise
  source_fidelity: 히브리어의 연령 기준(‘쉰 살부터’), 직무에서 물러남(יָשׁוּב), 그리고 더 이상 해당 직무를 수행하지 않음을 전반적으로 반영합니다. 다만 ‘더 이상 일하지 않아야 합니다’는 일반적인 모든 노동의 금지로 들릴 수 있어, 문맥상 레위인의 특정 봉사 직무를 그만둔다는 뜻을 충분히 한정하지 못합니다.
  naturalness: ‘그 일의 봉사’는 현대 한국어에서 다소 어색하고 의미 관계가 불분명합니다. ‘그 일을 맡아 하는 봉사’는 직무 수행이라는 뜻을 자연스럽게 드러냅니다. 또한 법규·서술 문맥에서는 ‘하지 않습니다’가 히브리어 미완료형의 규정적 진술을 합쇼체로 자연스럽게 옮깁니다.
  terminology: צָבָא와 עֲבֹדָה의 결합은 군사 복무가 아니라 성소 관련 직무 봉사를 가리킵니다. ‘그 일을 맡아 하는 봉사’와 ‘그 일’의 반복은 두 표현의 연결을 유지하면서도, 일반 노동을 뜻하는 것으로 오해될 가능성을 줄입니다.
  issues:
