translation:
  language: ko
  text: 쉰 살부터는 그는 그 일을 맡아 하는 봉사에서 물러나, 더 이상 그 일을 하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물러나다’는 문자적으로는 ‘돌아가다/되돌아가다’이며, 여기서는 정식 직무에서 물러나는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: And from fifty years old
  chosen_korean: 그리고 쉰 살부터
