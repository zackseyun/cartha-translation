reference: Numbers 8:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
  footnotes:
  - marker: a
    text: Or 'he shall return from the service of the work'; the Hebrew verb is literally 'return/turn back,' here used in the sense of withdrawing from active duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 쉰 살부터 그는 그 일의 봉사에서 물러나고 더 이상 일하지 않아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아가다/되돌아가다’가 문자적 의미이지만, 이 문맥에서는 정식 직무에서 물러나는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  english_pob_choice: And from fifty years old
  chosen_korean: 그리고 쉰 살부터
  alternatives_korean:
  - 그리고 쉰 살이 되면
  - 그리고 쉰 살의 나이부터
  lexicon: HALOT
  rationale: 연령의 시작점을 나타내는 관용구로 이해하여, 현대 한국어에서 자연스러운 ‘쉰 살부터’로 옮겼습니다.
- source_word: יָשׁוּב
  english_pob_choice: he shall withdraw
  chosen_korean: 물러나고
  alternatives_korean:
  - 돌아가고
  - 되돌아가고
  - 철수하고
  lexicon: HALOT
  rationale: 문자적으로는 ‘돌아가다/되돌아가다’이지만, 여기서는 직무에서의 이탈을 뜻하므로 ‘물러나다’가 기능적 의미를 가장 잘 드러냅니다.
- source_word: מִצְּבָא הָעֲבֹדָה
  english_pob_choice: from the service of the work
  chosen_korean: 그 일의 봉사에서
  alternatives_korean:
  - 그 봉사의 일에서
  - 그 섬김의 직무에서
  - 그 노동의 봉사에서
  lexicon: HALOT
  rationale: צָבָא와 עֲבֹדָה의 결합을 하나로 뭉개지 않고, 의례적·공적 직무의 성격을 살려 ‘그 일의 봉사’로 옮겼습니다.
- source_word: וְלֹא יַעֲבֹד עוֹד
  english_pob_choice: and shall serve no more
  chosen_korean: 더 이상 일하지 않아야 합니다
  alternatives_korean:
  - 더 이상 섬기지 않아야 합니다
  - 더 이상 봉사하지 않아야 합니다
  - 더 이상 일해서는 안 됩니다
  lexicon: HALOT
  rationale: עבד의 기본 의미를 살려 지속적 수행을 금지하는 표현으로 옮겼고, 한국어에서는 현대적이고 명확한 ‘일하지 않아야 합니다’가 자연스럽습니다.
