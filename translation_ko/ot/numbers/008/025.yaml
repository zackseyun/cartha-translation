- source_word: יָשׁוּב
  english_pob_choice: he shall withdraw
  chosen_korean: 물러나고
  alternatives_korean:
  - 돌아가고
  - 되돌아가고
  - 철수하고
  lexicon: HALOT
  rationale: 문자적으로는 ‘돌아가다/되돌아가다’이지만, 여기서는 직무에서의 이탈을 뜻하므로 ‘물러나다’가 기능적 의미를 가장 잘 드러냅니다.
- source_word: מִצְּבָא הָעֲבֹדָה
  english_pob_choice: from the service of the work
  chosen_korean: 그 일의 봉사에서
  alternatives_korean:
