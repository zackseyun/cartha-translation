id: NUM.8.4
reference: Numbers 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'Now this was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
  footnotes:
  - marker: a
    text: Or 'beaten work'; the Hebrew emphasizes that the lampstand was fashioned by hammering. Some also understand the term to imply 'of one piece.'
    reason: lexical_alternative
  - marker: b
    text: '''According to the pattern'' could also be rendered ''according to the appearance'' or ''according to the vision'' that the LORD showed Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 등잔대의 제작은 이러했습니다. 그것은 금을 두드려 만든 것[a]이었으며, 그 밑동에서 꽃 장식에 이르기까지 두드려 만든 것이었습니다. 야훼께서 모세에게 보여 주신 모양[b]대로 등잔대는 만들어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두드려 만든 금속 세공품’. 히브리어는 금속을 두드려 형태를 낸 제작 방식을 강조하며, 한 덩어리로 만들었다는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘본대로’, ‘보여 주신 모습대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  english_pob_choice: workmanship
  chosen_korean: 제작 방식
  alternatives_korean:
  - 작품
  - 공작
  lexicon: HALOT
  rationale: 등잔대가 어떻게 만들어졌는지를 가리키므로 단순한 ‘일’보다 제작의 양식을 드러내는 표현이 적절합니다. '제작 방식'은 문맥상 자연스럽고 공예적 뉘앙스를 살립니다.
- source_word: הַמְּנֹרָה
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 메노라
  - 등대
  lexicon: HALOT
  rationale: 성막 기구의 일반 명칭은 음역보다 의미역이 더 분명하므로 ‘등잔대’로 옮겼습니다.
- source_word: מִקְשָׁה
  english_pob_choice: hammered work / hammered gold
  chosen_korean: 금을 두드려 만든
  alternatives_korean:
  - 두드린 금의
  - 망치질한
  lexicon: HALOT
  rationale: 히브리어는 금속을 두드려 형성한 제작법을 강조합니다. ‘두드려 만든’은 그 기술적 의미를 살리면서도 한국어로 자연스럽습니다.
- source_word: כַּמַּרְאֶה
  english_pob_choice: according to the pattern
  chosen_korean: 그 모양대로
  alternatives_korean:
  - 그 본에 따라
  - 그 보인 것에 따라
  lexicon: HALOT
  rationale: 성막 제작 문맥에서 ‘pattern’은 단순한 시각적 모습보다 하나님이 보여 주신 제작 도면/형상을 뜻하므로, 한국어로는 ‘모양’이 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: עָשָׂה의 주어 보충
  chosen_reading: 그가 만들었습니다
  alternative_readings:
  - 그것이 만들어졌습니다
  - 만들었습니다
  rationale: 히브리어는 주어를 생략하지만, 앞선 문맥상 모세가 시행한 제작을 가리키므로 능동형으로 자연스럽게 보충했습니다. 이는 원문의 행위 주체를 흐리지 않습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
