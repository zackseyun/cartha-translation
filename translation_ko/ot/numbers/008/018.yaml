  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 이스라엘 자손의 모든 첫째를 대신하여 레위인들을 취하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라고 직역되지만, 문맥상 이스라엘 공동체 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  english_pob_choice: And I took
  chosen_korean: 취하였습니다
  alternatives_korean:
  - 데려왔습니다
  - 가져왔습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 문맥상 레위인들을 어떤 사역을 위해 ‘취하다/데려오다’의 의미이므로, 단순한 소유 취득처럼 들리지 않도록 공적인 행위감을 살려 ‘취하였습니다’로 옮겼습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: 대신하여
  alternatives_korean:
  - 대신에
  - 자리에
  - 아래에
  lexicon: HALOT
  rationale: 여기서는 공간적 의미가 아니라 대체·대속의 의미이므로, 교환 관계를 분명히 드러내는 ‘대신하여’를 선택했습니다.
- source_word: בְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 첫째
  alternatives_korean:
  - 맏아들
  - 장자
  - 첫 태생
  lexicon: HALOT
  rationale: 히브리어는 성별을 직접 덧붙이지 않고 ‘첫째/첫태생’의 뜻을 가지므로, 본문에 추가 정보를 넣지 않으면서 자연스러운 한국어로 ‘첫째’라고 옮겼습니다.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손의
  alternatives_korean:
  - 이스라엘 사람들의
  - 이스라엘의 자녀들의
  - 이스라엘 사람들 가운데의
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 아들들/자손들’이므로, 표준적이고 성별 정보를 보존하는 ‘이스라엘 자손’으로 유지했습니다.
theological_decisions:
- issue: 레위인과 첫째의 대체 관계
  chosen_reading: 레위인들을 이스라엘 자손의 모든 첫째를 대신하여 취하셨다고 옮겼습니다.
  alternative_readings:
  - 레위인들을 첫째 대신으로 삼으셨다고 옮길 수 있습니다.
  - 레위인들을 모든 장자를 대신하여 받으셨다고 옮길 수 있습니다.
  rationale: 본문의 핵심은 단순한 선발이 아니라 대표적 대체이므로, ‘대신하여’로 대속적/대체적 관계를 분명히 했습니다.
  doctrine_reference: 민수기 3장 및 레위인의 봉헌 맥락
