- from: 아론은 야훼 앞에서 이스라엘 자손들로부터 레위 사람들을 요제물로 드리고, 그들은 야훼의 일을 섬기게 될 것입니다.[a][b]
  to: 아론은 야훼 앞에서 이스라엘 자손들로부터 레위 사람들을 요제물로 드리고, 그들은 야훼를 섬기는 일을 하게 될 것입니다.[a][b]
  rationale: The revision corrects the unnatural and semantically weakened final clause by rendering the Levites’ assigned cultic duty as '야훼를 섬기는 일.' It retains the source-oriented ambiguity of '이스라엘 자손들로부터,' the established technical term '요제물,' and the formal-polite register. The lexical footnote is refined for ritual precision.
