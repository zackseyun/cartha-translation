id: NUM.8.11
reference: Numbers 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
  footnotes:
  - marker: a
    text: Or 'Aaron shall wave the Levites as a wave offering before the LORD.' The Hebrew verb is the same root as 'wave offering' and refers to a ritual presentation.
    reason: lexical_alternative
  - marker: b
    text: '''From the sons of Israel'' may also mean ''on behalf of the sons of Israel,'' indicating that the Levites are presented as representatives of the Israelites in the LORD''s service.'
    reason: alternative_reading
translation:
  language: ko
  text: 아론은 야훼 앞에서 이스라엘 자손들로부터 레위 사람들을 요제물로 드리고, 그들은 야훼를 섬기는 일을 하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요제물’은 흔들어 드리는 제의적 봉헌을 가리키는 기술 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손들로부터’는 문맥상 ‘이스라엘 자손들을 대표하여’라는 의미를 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף
  english_pob_choice: shall present
  chosen_korean: 드리고
  alternatives_korean:
  - 흔들어 드리고
  - 제시하고
  lexicon: HALOT
  rationale: 레위 사람처럼 사람을 대상화한 제의 행위이므로, 물리적 동작을 직접 드러내는 ‘흔들어’보다 제의적 헌납의 의미를 살리는 ‘드리고’가 한국어로 자연스럽고 오해가 적습니다.
- source_word: תְּנוּפָה
  english_pob_choice: as a wave offering
  chosen_korean: 요제물로
  alternatives_korean:
  - 요제물로서
  - 흔들어 바치는 제물로
  lexicon: HALOT
  rationale: 기술적 제의 용어는 관용적으로 ‘요제물’이 가장 직접적으로 대응하며, 레위 사람들의 봉헌 성격도 함께 드러냅니다.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손들로부터
  alternatives_korean:
  - 이스라엘 자손들을 대신하여
  - 이스라엘 자손들 가운데서
  lexicon: HALOT
  rationale: מֵאֵת의 출처/기원을 살려 ‘-로부터’로 옮겼고, האנּ된 표현인 ‘이스라엘 자손들’을 유지해 히브리어의 직접성을 보존했습니다.
- source_word: עֲבֹדַת יְהוָה
  english_pob_choice: the service of Yahweh
  chosen_korean: 야훼의 일
  alternatives_korean:
  - 야훼의 섬김
  - 야훼의 봉사
  lexicon: HALOT
  rationale: 제의적 봉사를 뜻하지만 한국어 ‘야훼의 일’은 본문의 봉사·직무 의미를 과도하게 기술화하지 않으면서도 넓은 담당 업무를 자연스럽게 전달합니다.
theological_decisions:
- issue: 레위 사람들을 사람 제물처럼 보일 수 있는 제의 언어
  chosen_reading: ‘요제물로 드리고’로 옮겨 제의적 봉헌을 분명히 하되, 실제 희생 제사로 오해될 표현은 피했습니다.
  alternative_readings:
  - 레위 사람들을 흔들어 바치고
  - 레위 사람들을 제물로 드리고
  rationale: 본문은 레위 사람들의 구별과 봉헌을 제의 언어로 묘사할 뿐, 그들이 문자적으로 희생된다는 뜻은 아닙니다. 따라서 제의 범주를 유지하면서도 오해를 줄이는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
