review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Aaron, the Levites, the ritual designation 'wave offering' (요제물), Yahweh, and the source phrase 'from the sons of Israel.' However, '야훼의 일을 섬기게' does not adequately represent the Hebrew cognate construction לַעֲבֹד אֶת־עֲבֹדַת יהוה ('to perform/serve the service of Yahweh') and is unnatural Korean.
  naturalness: The first clause is understandable in modern formal Korean. The final expression '야훼의 일을 섬기게 될 것입니다' is not idiomatic, since one normally performs work or serves a person; '야훼를 섬기는 일을 하게 될 것입니다' naturally preserves both aspects of the Hebrew expression.
  terminology: '''요제물'' is an appropriate established Korean technical term for תְּנוּפָה. The explanatory note should describe it as a ritual presentation involving waving, rather than broadly defining it as something lifted or waved. ''야훼'' consistently reflects the project’s divine-name policy.'
  issues:
  - severity: medium
    issue: The final clause renders עֲבֹדַת יהוה as '야훼의 일' and then makes it the object of '섬기다.'
    rationale: This loses the specific cultic sense of 'service' and produces unnatural Korean. Rendering it as '야훼를 섬기는 일을 하다' retains the Hebrew's emphatic service wording without imposing an interpretation.
  - severity: low
    issue: Footnote a says that 요제물 may be an offering that is 'lifted or waved.'
    rationale: The relevant term תְּנוּפָה is specifically associated with ritual waving/presentation. A narrower explanation is more accurate and avoids conflating it with distinct elevation-offering terminology.
  revised_text: 아론은 야훼 앞에서 이스라엘 자손들로부터 레위 사람들을 요제물로 드리고, 그들은 야훼를 섬기는 일을 하게 될 것입니다.[a][b]
  revised_footnotes:
  - marker: a
    text: ‘요제물’은 흔들어 드리는 제의적 봉헌을 가리키는 기술 용어입니다.
