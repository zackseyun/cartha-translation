    reason: alternative_reading
  revision_rationale: The revision corrects the unnatural and semantically weakened final clause by rendering the Levites’ assigned cultic duty as '야훼를 섬기는 일.' It retains the source-oriented ambiguity of '이스라엘 자손들로부터,' the established technical term '요제물,' and the formal-polite register. The lexical footnote is refined for ritual precision.
