id: NUM.8.19
reference: Numbers 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
  footnotes:
  - marker: a
    text: Or 'the Levites, who are given to Aaron and to his sons.' The Hebrew repeats the root 'give' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'from among the Israelites.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이스라엘 자손 가운데에서 레위 사람들을 아론과 그의 아들들에게 주어진 선물로 주었습니다[a]. 이는 그들이 회막에서 이스라엘 자손의 봉사를 수행하고 이스라엘 자손을 위하여 속죄하도록 하여, 이스라엘 자손이 거룩한 곳에 가까이 올 때 그들 가운데 재앙이 일어나지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “레위 사람들, 곧 아론과 그의 아들들에게 주어진 자들.” 히브리어는 ‘주다’라는 어근을 반복하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה / נְתֻנִים
  english_pob_choice: And I have given ... as a gift
  chosen_korean: “주어”
  alternatives_korean:
  - “선물로 주어”
  - “맡겨”
  lexicon: HALOT
  rationale: נתן의 반복이 주는 강조를 살리면서, 레위인들이 아론과 그의 아들들에게 ‘주어진’ 존재라는 점을 한국어에서 자연스럽게 나타내기 위해 ‘주어’로 옮겼습니다.
- source_word: לְעֲבֹד אֶת עֲבֹדַת
  english_pob_choice: to do the service of
  chosen_korean: “일을 맡아 섬기게 하고”
  alternatives_korean:
  - “봉사를 하게 하고”
  - “섬기는 일을 하게 하고”
  lexicon: HALOT
  rationale: עבד의 반복적 어근 구조를 단순한 ‘봉사’보다 ‘일을 맡아 섬기다’로 살려, 성막 봉사의 지정된 직무라는 점을 드러냈습니다.
- source_word: וּלְכַפֵּר עַל
  english_pob_choice: and to make atonement for
  chosen_korean: “속죄하게 하였으니”
  alternatives_korean:
  - “속죄하게 하고”
  - “속죄 제사를 드리게 하고”
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 보존하기 위해 ‘속죄하다’를 택했고, 한국어 문맥상 뒤의 목적절과 자연스럽게 연결되도록 서술했습니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: the holy place
  chosen_korean: “거룩한 곳”
  alternatives_korean:
  - “성소”
  - “거룩한 장소”
  lexicon: HALOT
  rationale: 이 구절의 קדש은 성막 영역의 ‘거룩한 곳’을 가리키므로, POB의 직역성을 살리면서도 한국어에서 지나치게 제도화된 ‘성소’보다 문맥상 분명한 ‘거룩한 곳’으로 옮겼습니다.
theological_decisions:
- issue: 레위인의 역할이 단순 보조인지, 속죄 기능까지 포함하는지
  chosen_reading: 본문의 서술을 따라 레위인에게 회막 봉사와 더불어 이스라엘을 위한 속죄 기능이 함께 부여된 것으로 표현했습니다.
  alternative_readings:
  - 단순히 제사장 보조 역할만 수행하는 것으로 완화하는 번역
  rationale: 히브리어 본문은 봉사와 속죄를 병렬로 제시하므로, 후대의 역할 구분을 미리 도입하지 않고 본문의 긴장을 그대로 유지했습니다.
  doctrine_reference: 본문의 기능적 긴장을 보존
