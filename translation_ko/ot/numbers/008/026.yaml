id: NUM.8.26
reference: Numbers 8:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
  footnotes:
  - marker: a
    text: Or 'to keep the charge.' The Hebrew expression לִשְׁמֹר מִשְׁמֶרֶת refers to fulfilling an assigned responsibility.
    reason: lexical_alternative
  - marker: b
    text: Or 'but he shall do no labor.' The Hebrew contrasts permitted ministry with the regular work/service from which the older Levite is exempt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 회막에서 자기 형제들과 함께 섬기며 맡겨진 직무를 지킬 수 있습니다[a]. 그러나 봉사 업무는 해서는 안 됩니다[b]. 이와 같이 너는 레위 사람들의 맡겨진 직무에 관하여 행하여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맡겨진 책임을 수행할 수 있습니다.’ 히브리어 לִשְׁמֹר מִשְׁמֶרֶת는 맡겨진 책임이나 직무를 지키고 수행한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노동을 해서는 안 됩니다.’ 히브리어는 허용된 섬김과, 나이 든 레위인이 하지 않아야 하는 일반적인 봉사 업무 또는 노동을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  english_pob_choice: But he may minister
  chosen_korean: 그는 … 섬기며
  alternatives_korean:
  - 그는 … 봉사하며
  - 그는 … 시중들며
  lexicon: HALOT
  rationale: שרת는 성소 맥락에서 제의적·보조적 섬김을 뜻하므로, 한국어에서는 ‘섬기다’로 살리고 앞의 금지된 עבודה와 구별했습니다.
- source_word: אֶת־אֶחָיו
  english_pob_choice: with his brothers
  chosen_korean: 그의 형제들과 함께
  alternatives_korean:
  - 그의 형제들과
  - 그의 동료 레위 사람들과 함께
  lexicon: HALOT
  rationale: 직접목적 표지를 한국어 관용에 맞게 동반 의미로 옮기되, ‘형제들’이라는 친족 표현을 유지해 레위 집단을 가리키는 점을 보존했습니다.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  english_pob_choice: to keep the charge
  chosen_korean: 직무를 지키되
  alternatives_korean:
  - 맡겨진 책임을 지키되
  - 직책을 지키되
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת의 ‘맡겨진 책임/직무’ 의미를 자연스러운 현대 한국어로 옮기되, 앞의 ‘봉사’와 구별되도록 ‘지키다’를 사용했습니다.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  english_pob_choice: but he shall do no service
  chosen_korean: 더 이상 봉사하지는 못합니다
  alternatives_korean:
  - 더 이상 일하지는 못합니다
  - 더 이상 노동하지는 못합니다
  lexicon: HALOT
  rationale: עֲבֹדָה/עבד의 반복을 한국어로는 ‘봉사’로 옮겨 제의적 섬김과 일반 노동의 긴장을 드러냈습니다. 다만 본문 대비를 위해 금지의 뉘앙스를 살렸습니다.
- source_word: כָּכָה תַּעֲשֶׂה לַ/לְוִיִּם
  english_pob_choice: Thus you shall do for the Levites
  chosen_korean: 너는 레위 사람들에게 … 이렇게 하여야 합니다
  alternatives_korean:
  - 너는 레위 사람들을 위해 … 이렇게 해야 합니다
  - 너는 레위 사람들에게 이렇게 해야 합니다
  lexicon: HALOT
  rationale: 명령형 종결을 현대 한국어 법규 문체로 옮기고, לְ의 적용 대상을 ‘레위 사람들’로 자연스럽게 처리했습니다.
- source_word: בְּ/מִשְׁמְרֹתָם
  english_pob_choice: in their duties
  chosen_korean: 그들의 직분에 따라
  alternatives_korean:
  - 그들의 책임에 따라
  - 그들의 임무에 따라
  lexicon: HALOT
  rationale: 복수 מִשְׁמְרוֹת는 개인적 직무 분배를 가리키므로, 결과 구를 ‘직분에 따라’로 풀어 전체 절의 규정적 성격을 살렸습니다.
theological_decisions:
- issue: 허용된 섬김과 금지된 노동의 구분
  chosen_reading: 이 절은 나이 든 레위인이 성막에서 전혀 아무 일도 하지 못한다는 뜻이 아니라, 동료들과 함께 제의적 섬김은 계속하되 नियमित한 봉사/노동은 면제된다는 구분을 드러냅니다.
  alternative_readings:
  - 모든 섬김이 전면 금지된 것으로 보는 읽기
  - 오직 경비 업무만 허용된 것으로 보는 읽기
  rationale: שרת와 עבד/עֲבֹדָה의 대비가 본문 안에 있으므로, 번역도 두 활동을 서로 다른 한국어 표현으로 갈라 이 긴장을 보존했습니다.
  doctrine_reference: 민수기 8:24-26의 레위 직무 규정
