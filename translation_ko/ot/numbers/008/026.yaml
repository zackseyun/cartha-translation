  to: 그는 회막에서 자기 형제들과 함께 섬기며 맡겨진 직무를 지킬 수 있습니다[a]. 그러나 봉사 업무는 해서는 안 됩니다[b]. 이와 같이 너는 레위 사람들의 맡겨진 직무에 관하여 행하여야 합니다.
  rationale: 본문은 나이 든 레위인이 회막에서 동료 레위인들과 함께 맡겨진 책임을 지키는 섬김은 계속할 수 있으나, עֲבֹדָה로 표현된 정규 봉사 업무는 하지 않도록 규정합니다. 수정문은 이 허용과 금지의 대비를 보존하고, 금지를 ‘못합니다’가 아닌 ‘해서는 안 됩니다’로 명확히 했습니다. 마지막 구절도 ‘직분에 따라’라는 해석적 표현 대신 직무에 관한 규정이라는 원문의 범위를 유지했습니다.
