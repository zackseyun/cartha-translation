  source_fidelity: 핵심 의미는 대체로 충실합니다. נְתֻנִים의 반복 강조를 ‘온전히’로, מִתּוֹךְ의 선택 의미를 ‘가운데서’로, תַּחַת의 대체 의미를 ‘대신하여’로, לָקַחְתִּי ... לִי의 귀속 의미를 ‘내 것으로 취하였습니다’로 적절히 옮겼습니다. 다만 ‘배를 여는’보다 원문의 רֶחֶם에 대응하는 ‘태를 여는’이 더 정확하며, 첫태생의 범위는 ‘이스라엘 자손 가운데 있는 모든 첫태생’으로 표현하는 편이 한국어에서 더 명료합니다.
  naturalness: 현대 표준어 합쇼체의 문체는 전반적으로 적절합니다. 그러나 본문의 각주 표기 ‘[ [c] ]’는 잘못된 구조이며, ‘배를 여는’은 현대 한국어에서 다소 어색하고 해부학적 표현으로 들릴 수 있습니다. ‘태를 여는’이 성서적 문맥과 자연스러운 문어체에 더 알맞습니다.
  terminology: ‘이스라엘 자손들’, ‘첫태생’, ‘내 것으로 취하였습니다’는 원문의 집합적 표현, 첫 출생의 개념, 하나님께 속하도록 취하심을 잘 반영합니다. ‘태를 여는 모든 자’는 첫태생을 뜻하는 관용구의 표면 표현을 보존하며, 각주가 이를 보완합니다.
