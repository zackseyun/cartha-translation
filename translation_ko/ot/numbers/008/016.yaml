  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
  footnotes:
  - marker: a
    text: Or 'surely given to me' or 'completely given to me'; the Hebrew repeats 'given' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'everyone who opens the womb,' an idiom for the firstborn.
    reason: lexical_alternative
  - marker: c
    text: Or 'people of Israel' or 'Israelites'; Hebrew 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이스라엘 자손들 가운데서[c] 온전히 나에게 바쳐진 자들입니다[a]. 곧 태를 여는 모든 자, 이스라엘 자손 가운데 있는 모든 첫태생[b]을 대신하여 내가 그들을 내 것으로 취하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주어지다’를 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘태를 여는 모든 자’는 첫태생을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  english_pob_choice: wholly given
  chosen_korean: 온전히 나에게 바쳐진
  alternatives_korean:
  - 완전히 나에게 바쳐진
  - 온전히 주어진
  - 분명히 바쳐진
  lexicon: HALOT
  rationale: 히브리어의 반복은 강조를 나타내므로, 단순한 ‘주어졌다’보다 ‘온전히 바쳐진’이 중첩된 강조를 자연스러운 한국어로 살립니다.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the sons of Israel
  chosen_korean: 이스라엘 자손들 가운데서
  alternatives_korean:
  - 이스라엘 백성 가운데서
  - 이스라엘 사람들 가운데서
  lexicon: HALOT
  rationale: מִתּוֹךְ의 선택적 의미를 살려 ‘가운데서’로 옮기고, ‘sons of Israel’은 직역에 가까운 ‘이스라엘 자손들’로 유지했습니다.
- source_word: פִּטְרַת כָּל רֶחֶם
  english_pob_choice: everyone who opens the womb
  chosen_korean: 배를 여는 모든 자
  alternatives_korean:
  - 태를 여는 모든 자
  - 태를 처음 여는 자
  - 태를 여는 모든 첫째
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 드러내면서도 한국어로 이해 가능하도록 ‘배를 여는’으로 옮겼습니다. POB의 설명처럼 이는 첫태생을 가리킵니다.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: the firstborn of all the sons of Israel
  chosen_korean: 이스라엘 자손들의 모든 첫태생
  alternatives_korean:
  - 이스라엘 자손들의 모든 장자
  - 이스라엘 자손 중 모든 첫태생
  lexicon: HALOT
  rationale: 여기서 בְּכוֹר는 문맥상 ‘첫태생’이 적절하며, 반복되는 소유격 구조를 한국어의 자연스러운 어순으로 정리했습니다.
- source_word: לָקַחְתִּי אֹתָם לִי
  english_pob_choice: I have taken them for myself
  chosen_korean: 내 것으로 취하였습니다
  alternatives_korean:
  - 내가 그들을 내게 취하였습니다
  - 내가 그들을 내 사람으로 삼았습니다
  lexicon: HALOT
  rationale: לָקַח with final לִי는 신적 소유·귀속의 뜻을 가지므로, ‘내 것으로 취하다’가 이를 간결하게 반영합니다.
theological_decisions:
- issue: ‘배를 여는 모든 자’의 관용구 처리
  chosen_reading: 직역을 유지하되 의미는 첫태생을 가리키는 관용구로 읽히도록 처리했습니다.
  alternative_readings:
  - ‘첫태생’만 단독으로 번역
