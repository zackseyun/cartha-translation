  rationale: 원문은 의도적으로 관용구와 설명구를 병렬로 두므로, 직역 흔적을 남겨 독자가 표층 이미지와 본의를 함께 보게 하는 편이 더 충실합니다.
  doctrine_reference: Numbers 8:16의 문맥상 레위인의 대속적 대체 개념
- issue: ‘이스라엘 자손들’의 성중립화 여부
  chosen_reading: ‘이스라엘 자손들’을 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 히브리어가 명시적으로 בְּנֵי יִשְׂרָאֵל을 사용하므로, 문맥상 집합적 의미를 가지더라도 원문 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
