    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  english_pob_choice: Then you shall bring
  chosen_korean: 데려오고
  alternatives_korean:
  - 가까이 데리고 오고
  - 가져오고
  - 제시하고
  lexicon: HALOT
  rationale: 제의적 맥락에서 ‘가까이 데려오다/이끌어 오다’의 의미를 살리면서 현대 한국어로 자연스럽게 풀었습니다. ‘데려오다’는 이동과 제의적 접근을 함께 드러냅니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 성막 용어로 굳어진 표준 번역인 ‘회막’을 사용해 제의적 전문용어를 유지했습니다.
- source_word: וְהִקְהַלְתָּ
  english_pob_choice: and you shall assemble
  chosen_korean: 모으십시오
  alternatives_korean:
  - 소집하십시오
  - 집결시키십시오
  - 모여 있게 하십시오
  lexicon: HALOT
  rationale: קהל의 핵심은 집합시키는 행위이므로, 공적 명령문으로 자연스러운 ‘모으십시오’를 택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직접 표현을 따라 ‘이스라엘 자손’을 유지해 문구의 전통적·문자적 형식을 보존했습니다.
theological_decisions:
- issue: 공동체 호칭의 형태 유지
  chosen_reading: ‘이스라엘 자손의 온 회중’으로 직역적 구조를 유지했습니다.
  alternative_readings:
  - ‘이스라엘 백성 전체’
  - ‘이스라엘 사람들을 모두’
  rationale: 본문은 단지 집합을 말하는 것이 아니라 언약 공동체의 공식 소집을 말하므로, המקור의 구조를 살려 ‘이스라엘 자손’과 ‘온 회중’을 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
