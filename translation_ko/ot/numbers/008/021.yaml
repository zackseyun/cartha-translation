id: NUM.8.21
reference: Numbers 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
  footnotes:
  - marker: a
    text: Or 'waved them as a wave offering.' The Hebrew uses the standard ritual expression for presenting something before the LORD as a תְּנוּפָה.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들은 자신을 정결하게 하고 그들의 옷을 빨았으며, 아론은 그들을 야훼 앞에서 요제로 드렸으며[a], 아론은 그들을 정결하게 하려고 그들을 위하여 속죄하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 요제로 흔들었습니다.” 히브리어는 야훼 앞에 요제로 바치는 표준 제의 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  english_pob_choice: purified themselves
  chosen_korean: 자신을 정결하게 하고
  alternatives_korean:
  - 자신을 정화하고
  - 자신을 깨끗하게 하고
  - 자신의 죄를 씻고
  lexicon: HALOT
  rationale: 히트파엘 형태는 단순한 도덕적 회개보다 제의적 정결 행위를 가리키므로, 문맥에 맞게 ‘정결하게 하다’로 옮겼습니다.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  english_pob_choice: washed their garments
  chosen_korean: 자기들의 옷을 빨았으며
  alternatives_korean:
  - 자기들의 옷을 씻었으며
  - 자기들의 의복을 빨았으며
  lexicon: HALOT
  rationale: בִּגְדֵיהֶם는 제의 문맥에서 실제 의복을 뜻하므로, 자연스러운 현대 한국어로 ‘옷을 빨다’가 가장 직접적입니다.
- source_word: וַיָּנֶף ... תְּנוּפָה
  english_pob_choice: presented them as a wave offering
  chosen_korean: 그들을 야훼 앞에서 요제로 드렸고
  alternatives_korean:
  - 그들을 요제로 흔들었고
  - 그들을 요제물로 드렸고
  - 그들을 앞에 요제로 바쳤고
  lexicon: HALOT
  rationale: תְּנוּפָה는 전통적으로 ‘요제’로 알려진 제의 행위이므로, 의례 용어를 보존하되 한국어 문장에서는 ‘드렸고’로 자연스럽게 연결했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 YHWH는 ‘야훼’로 음역해 언약적 고유성을 보존했습니다.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  english_pob_choice: made atonement for them
  chosen_korean: 그들 위에 속죄하였습니다
  alternatives_korean:
  - 그들을 위하여 속죄하였습니다
  - 그들을 위해 속죄 제사를 드렸습니다
  - 그들을 위하여 속죄제를 행하였습니다
  lexicon: HALOT
  rationale: כפר는 제의적 ‘속죄/속죄하다’의 의미를 가지며, 여기서는 목적어 위에 행해지는 의례를 드러내기 위해 ‘그들 위에 속죄하였습니다’로 옮겼습니다.
- source_word: לְטַהֲרָם
  english_pob_choice: to cleanse them
  chosen_korean: 그들을 정결하게 하려고
  alternatives_korean:
  - 그들을 깨끗하게 하려고
  - 그들을 정화하려고
  lexicon: HALOT
  rationale: 마지막 목적절은 아론의 속죄 행위의 결과/목적을 설명하므로, 앞의 ‘정결하게 하다’와 구별되도록 다시 ‘정결하게 하려고’로 처리했습니다.
theological_decisions:
- issue: 제의적 정결과 속죄의 구별
  chosen_reading: ‘자신을 정결하게 하고’, ‘속죄하였습니다’, ‘정결하게 하려고’로 구분해 번역했습니다.
  alternative_readings:
  - 모두 ‘깨끗하게 하다’로 통일
  - ‘속죄’ 대신 ‘대속하다’ 사용
  rationale: 본문은 레위인의 자기 정결, 아론의 속죄 행위, 최종 정결의 목적을 서로 다른 동사로 구분합니다. 한국어에서도 이 차이를 유지해야 제의 구조가 흐려지지 않습니다.
  doctrine_reference: Numbers 8:21 priestly purification context
- issue: 여호와 신명 처리
  chosen_reading: YHWH를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 신명기적 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 사용해 고유성을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
