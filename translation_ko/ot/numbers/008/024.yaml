base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
  footnotes:
  - marker: a
    text: Or 'to perform duty' / 'to do service'; the Hebrew לִצְבֹא צָבָא uses a service-duty idiom with military overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들에 관해서는 이러합니다. 스물다섯 살 이상인 사람은 회막에서 봉사의 직무를 수행하기 위해 나아와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “봉사의 임무를 맡기 위해” / “봉사하기 위해”. 히브리어 לִצְבֹא צָבָא는 군사적 뉘앙스를 지닌 봉사·직무 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר
  english_pob_choice: This is what pertains to
  chosen_korean: 이것은 …에게 해당하는 규례입니다
  alternatives_korean:
  - 이것은 …에 속하는 것입니다
  - 이것은 …에 관한 것입니다
  - 이것은 …에 적용됩니다
  lexicon: HALOT
  rationale: 법규 문맥에서 대상 집단에 적용되는 규정을 자연스럽게 드러내면서도, 단순한 해설로 약화하지 않기 위해 ‘해당하는 규례’로 옮겼습니다.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  english_pob_choice: from twenty-five years old and upward
  chosen_korean: 스물다섯 살부터 그 위로는
  alternatives_korean:
  - 스물다섯 살 이상부터
  - 스물다섯 살부터 위로는
  - 스물다섯 살이 되고 위로는
  lexicon: HALOT
  rationale: 최저 연령 기준을 한국어 관용에 맞게 간명하게 살리기 위해 ‘스물다섯 살부터 그 위로는’으로 옮겼습니다.
- source_word: לִצְבֹא צָבָא
  english_pob_choice: to do duty
  chosen_korean: 직무를 수행하러 나아와야 합니다
  alternatives_korean:
  - 봉사의 직무를 해야 합니다
  - 임무를 맡아야 합니다
  - 봉사해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 ‘직무/봉사’ 관용구와 군사적 뉘앙스를 반영해, 단순한 ‘봉사하다’보다 ‘직무를 수행하러 나아오다’로 책임성과 공적 소집의 느낌을 살렸습니다.
- source_word: בַּעֲבֹדַת אֹהֶל מוֹעֵד
  english_pob_choice: in the service of the tent of meeting
  chosen_korean: 회막의 봉사
  alternatives_korean:
  - 회막에서의 봉사
  - 회막의 일
  - 회막의 섬김
  lexicon: HALOT
  rationale: ‘אֹהֶל מוֹעֵד’는 통상적인 ‘회막’으로, ‘עֲבֹדָה’는 제의적 업무를 뜻하므로 ‘봉사’로 옮겨 직무성과 경건성을 함께 보존했습니다.
theological_decisions:
- issue: 레위인 집단에 대한 명령을 단수로 서술하는 방식
  chosen_reading: “그는 … 나아와야 합니다”로 단수형을 유지했습니다.
  alternative_readings:
  - “그들은 … 나아와야 합니다”로 집단 복수화
  - “레위 사람들은 … 나아와야 합니다”로 명시적 주어 보강
  rationale: 히브리어가 집단을 가리키면서도 단수 동사를 사용하므로, 법규 문체와 원문 형식을 살려 일반적 단수로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
