  source_fidelity: 히브리어의 연령 하한, 레위인 대상, 회막 봉사, 그리고 לִצְבֹא צָבָא의 직무 수행 관용구는 대체로 반영되었습니다. 다만 ‘그 위로는’은 연령 조건 표현으로 부자연스럽고, ‘회막의 봉사에서 직무를 수행하러’는 겹친 표현이어서 원문의 구조를 더 명료하게 옮길 수 있습니다.
  naturalness: ‘스물다섯 살 이상인 사람’과 ‘회막에서 봉사의 직무를 수행하기 위해’가 현대 표준 한국어의 공식적 규정 문체에 더 자연스럽습니다. 또한 ‘레위 사람들에게 해당하는 규례’보다 ‘레위 사람들에 관해서는 이러합니다’가 זֹאת אֲשֶׁר לַלְוִיִּם의 도입 공식을 과도하게 명사화하지 않고 자연스럽게 재현합니다.
  terminology: ‘레위 사람들’, ‘회막’, ‘봉사’, ‘직무’는 적절합니다. לִצְבֹא צָבָא의 군사적 배경 뉘앙스는 본문에서 과장하지 않고 각주로 보존하는 것이 적절합니다.
