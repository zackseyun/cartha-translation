  rationale: 비교절을 아론의 행위에 직접 연결하여 문장을 자연스럽게 고쳤습니다. הֶעֱלָה의 논쟁적 의미는 주본문에서 배치/설치에 가까운 ‘올려놓았습니다’로 절제해 옮기고, 점등을 비롯한 가능한 이해는 각주에 보존했습니다. 야훼라는 신명 표기와 원문의 방향성은 유지했습니다.
