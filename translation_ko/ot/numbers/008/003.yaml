source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
  footnotes:
  - marker: a
    text: Or 'opposite the front of' or 'facing the front of' the lampstand.
    reason: lexical_alternative
  - marker: b
    text: Or 'he lit its lamps.' The Hebrew verb can be understood as causing the lamps to go up, which in context may refer to setting them up or lighting them.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 야훼께서 모세에게 명령하신 대로, 등잔대 앞쪽을 향해[a] 그 등잔들을 올려놓았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘등잔대의 앞을 마주하여’ 또는 ‘등잔대 정면을 향하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 등잔들을 켰습니다’ 또는 ‘그 등잔들에 불을 붙였습니다.’ 히브리어 동사는 문자적으로 등잔들을 올리게 하는 것을 뜻하며, 문맥상 등잔을 올려놓는 일 또는 점등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  english_pob_choice: And Aaron did so
  chosen_korean: 아론은 그대로 행했습니다
  alternatives_korean:
  - 아론은 그렇게 했습니다
  - 아론이 그렇게 했습니다
  - 아론은 그와 같이 했습니다
  lexicon: HALOT
  rationale: 관용구 כֵּן의 순응·이행 의미를 자연스럽게 살리되, 서술 흐름을 현대 한국어에 맞게 간결하게 표현했습니다.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  english_pob_choice: toward the front of the lampstand
  chosen_korean: 등잔대의 앞쪽을 향하여
  alternatives_korean:
  - 등잔대 앞을 향하여
  - 등잔대의 정면을 향하여
  - 등잔대 앞쪽을 마주하여
  lexicon: HALOT
  rationale: אֶל מוּל פְּנֵי의 방향성은 ‘향하여’로 살리고, פְּנֵי를 공간적 ‘앞쪽/정면’으로 옮겨 지나친 해석을 피했습니다.
- source_word: הֶעֱלָה נֵרֹתֶיהָ
  english_pob_choice: he set up its lamps
  chosen_korean: 그 등잔들을 켰습니다
  alternatives_korean:
  - 그 등잔들을 세웠습니다
  - 그 등잔들을 올렸습니다
  - 그 등잔들을 놓았습니다
  lexicon: HALOT
  rationale: הֶעֱלָה는 문맥상 ‘켜다/불을 붙이다’와 ‘세우다/올리다’의 여지가 있으므로, 등잔의 기능과 앞선 문맥을 고려해 핵심 결과를 드러내는 ‘켰습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 문서의 기본 원칙에 따라 여호와 대신 고유명사 표기인 ‘야훼’를 사용해 히브리어 원문의 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: הֶעֱלָה의 의미 범위
  chosen_reading: 문맥상 ‘켜다’로 읽되, 등잔의 배치·점등을 함께 함축하는 표현으로 처리했습니다.
  alternative_readings:
  - 등잔들을 세우다
  - 등잔들을 올리다
  - 등잔에 불을 붙이다
  rationale: 직전 문맥이 등잔의 배치와 방향을 다루므로, 한국어에서는 단순한 기계적 직역보다 실제 수행된 행위가 분명히 드러나는 표현이 더 적절합니다. 다만 ‘세우다/올리다’의 가능성을 완전히 지우지 않도록 주석으로 남깁니다.
  doctrine_reference: Numbers 8:2-3 문맥
- issue: 야훼의 명령 준수 강조
  chosen_reading: ‘야훼께서 모세에게 명령하신 대로’로 번역해 순종의 완결성을 드러냈습니다.
  alternative_readings:
  - 야훼께서 모세에게 명령하신 것 같이
  - 주님께서 모세에게 명령하신 대로
  rationale: וְכַאֲשֶׁר는 단순 비교가 아니라 정확한 일치와 이행을 강조하므로, ‘대로’가 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문의 명령-순종 구조
