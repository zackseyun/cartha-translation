  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
  footnotes:
  - marker: a
    text: Or 'so they did to them.' The Hebrew is concise and may refer to carrying out the prescribed rites with respect to the Levites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 레위인들이 회막에서 아론과 그의 아들들 앞에서 자기들의 직무를 수행하려고 왔습니다. 야훼께서 레위인들에 관하여 모세에게 명령하신 그대로, 그들은 그들에게 그대로 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 위해’. 히브리어는 매우 간결하며, 규정된 의식을 레위인들에 대하여 집행했다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: And after that
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 시간 순서를 자연스러운 현대 한국어로 살리되, 다음 행위를 이어 주는 접속성을 유지했습니다.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  english_pob_choice: to perform their service
  chosen_korean: 자기들의 일을 하러
  alternatives_korean:
  - 자기들의 봉사를 하러
  - 자기들의 직무를 수행하러
  lexicon: HALOT
  rationale: עבד/עֲבֹדָה의 제의적 맥락을 살리면서도 한국어에서 어색한 ‘그들의 봉사를 봉사하다’ 식의 중복을 피했습니다.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  english_pob_choice: before Aaron and before his sons
  chosen_korean: 아론 앞과 그의 아들들 앞에서
  alternatives_korean:
  - 아론과 그의 아들들 앞에서
  - 아론의 감독 아래서
  lexicon: HALOT
  rationale: לִפְנֵי의 문자적 공간 관계를 보존해 ‘앞에서’로 옮기되, 감독의 의미를 본문 밖에서 과하게 풀지 않았습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  english_pob_choice: Just as Yahweh had commanded
  chosen_korean: 야훼께서 … 명령하신 그대로
  alternatives_korean:
  - 야훼께서 … 명령하신 대로
  - 야훼께서 … 명령하신 바와 같이
  lexicon: HALOT
  rationale: 명령의 준수를 강조하는 כַּאֲשֶׁר의 비교·준거 기능을 한국어의 ‘-대로/그대로’로 자연스럽게 반영했습니다.
- source_word: עַל הַלְוִיִּם
  english_pob_choice: concerning the Levites
  chosen_korean: 레위인들에 관하여
  alternatives_korean:
  - 레위인들을 두고
  - 레위인들에 대해
  lexicon: HALOT
  rationale: עַל의 주제 표지를 ‘관하여’로 옮겨, 명령의 대상·주제를 분명히 하면서도 문어성을 유지했습니다.
- source_word: כֵּן עָשׂוּ לָהֶם
  english_pob_choice: so they did for them
  chosen_korean: 그들은 그렇게 그들을 위해 행했습니다
  alternatives_korean:
  - 그들은 그렇게 그들에게 행했습니다
  - 그들은 그렇게 그들에 대하여 행했습니다
  lexicon: HALOT
  rationale: 히브리어가 간결하게 남긴 목적어 관계를 살려 ‘그들을 위해’로 옮겼고, 강한 해석을 덧붙이지 않았습니다.
