source:
  edition: WLC
  text: דַּבֵּר֙ אֶֽל אַהֲרֹ֔ן וְ/אָמַרְתָּ֖ אֵלָ֑י/ו בְּ/הַעֲלֹֽתְ/ךָ֙ אֶת הַ/נֵּרֹ֔ת אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה יָאִ֖ירוּ שִׁבְעַ֥ת הַ/נֵּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
  footnotes:
  - marker: a
    text: Or “When you light the lamps.” The Hebrew verb literally means “cause to go up” and in this context may refer either to lighting the lamps or to setting them in place so that they shine forward.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론에게 말하여 그에게 이르십시오. ‘당신이 등잔들을 세울 때, 일곱 등잔이 등잔대 앞쪽을 향해 빛을 비추어야 합니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “등잔들에 불을 붙일 때.” 히브리어 동사는 문자적으로는 “올려 가게 하다”의 뜻이며, 이 문맥에서는 등잔에 불을 붙이는 것과 제자리에 세워 비추게 하는 것을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 이르십시오
  lexicon: HALOT
  rationale: 도입부의 직접 명령형을 살리되, 이어지는 두 번째 동사와의 균형을 위해 한국어에서는 자연스러운 연결형으로 옮겼습니다.
- source_word: וְאָמַרְתָּ אֵלָיו
  english_pob_choice: and say to him
  chosen_korean: 그에게 이르십시오
  alternatives_korean:
  - 그에게 말하십시오
  - 그에게 말씀하십시오
  lexicon: HALOT
  rationale: 히브리어의 연속된 말하기 공식을 유지하면서, 아론에게 주어지는 계시성 있는 전달을 드러내기 위해 ‘이르십시오’를 선택했습니다.
- source_word: בְּהַעֲלֹתְךָ
  english_pob_choice: When you set up
  chosen_korean: 당신이 등잔들을 세울 때
  alternatives_korean:
  - 등잔들에 불을 붙일 때
  - 당신이 등잔들을 들어 올릴 때
  lexicon: HALOT
  rationale: 직역하면 ‘올려 놓다/올리다’의 뉘앙스가 있으나, 등잔 문맥에서는 위치를 갖추어 두는 행위를 자연스럽게 반영하는 ‘세우다’가 source의 해석적 긴장을 가장 잘 보존합니다.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  english_pob_choice: in front of the lampstand
  chosen_korean: 등잔대 앞쪽을 향해
  alternatives_korean:
  - 등잔대 앞을 향해
  - 등잔대의 정면을 향해
  lexicon: HALOT
  rationale: אֶל מוּל פְּנֵי의 방향성을 단순한 정적인 ‘앞에’보다 ‘향해’로 살려, 등불의 비추는 방향을 분명하게 했습니다.
- source_word: יָאִירוּ
  english_pob_choice: shall give light
  chosen_korean: 빛을 비추어야 합니다
  alternatives_korean:
  - 빛나야 합니다
  - 빛을 내야 합니다
  lexicon: HALOT
  rationale: 히브리어 사역형의 결과를 드러내기 위해 ‘비추다’를 택했고, 의무/규정의 뉘앙스를 한국어 미래-의무형으로 옮겼습니다.
- source_word: שִׁבְעַת הַנֵּרוֹת
  english_pob_choice: the seven lamps
  chosen_korean: 일곱 등잔
  alternatives_korean:
  - 일곱 개의 등잔
  - 일곱 등불
  lexicon: HALOT
  rationale: 성막 기구 문맥에서 נֵר은 일반적으로 ‘등잔’이 가장 정확하므로, 수식 구조를 간결하게 유지했습니다.
- source_word: הַמְּנוֹרָה
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 등대
  - 메노라
  lexicon: HALOT
  rationale: 예배 기구로서의 המְּנוֹרָה를 한국어 성경 용례에 맞게 ‘등잔대’로 옮겼습니다.
theological_decisions:
- issue: 등불의 방향과 기능을 어떻게 드러낼 것인가
  chosen_reading: 등잔들은 등잔대 앞쪽을 향해 빛을 비추어야 합니다.
  alternative_readings:
  - 등잔들이 등잔대 앞에 빛을 비추어야 합니다
  - 등잔들이 등잔대 앞을 향해 비춰야 합니다
  rationale: 본문은 단순한 위치 설명이 아니라 성막 등잔의 방향성과 기능을 함께 지시하므로, 방향성(향해)과 발광 기능(빛을 비추다)을 함께 살렸습니다.
  doctrine_reference: 성막 규례의 정확한 수행을 강조하는 출애굽기/민수기 제사장 전통
