base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
  footnotes:
  - marker: a
    text: Or “When you light the lamps.” The Hebrew verb literally means “cause to go up” and in this context may refer either to lighting the lamps or to setting them in place so that they shine forward.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론에게 말하여 그에게 이르십시오. ‘등잔들을 세울 때, 일곱 등잔이 등잔대 앞쪽을 향해 빛을 비추어야 합니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “등잔들에 불을 붙일 때.” 히브리어 동사는 문자적으로는 “올리다”라는 뜻이며, 이 문맥에서는 등잔에 불을 붙이는 일이나 등잔을 제자리에 놓아 앞쪽을 비추게 하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
