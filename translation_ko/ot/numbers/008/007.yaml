  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
  footnotes:
  - marker: a
    text: Or 'the water of purification'; literally, 'water of sin.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'let them pass a razor over all their flesh,' that is, shave their whole body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 그들에게 행하여 그들을 정결하게 하십시오. 곧 그들 위에 속죄의 물[a]을 뿌리고, 그들 온몸에 면도칼을 대게 하고, 그들의 옷을 빨게 하십시오[b]. 그러면 그들이 정결해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결의 물’. 문자적으로는 ‘죄의 물’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그들 온몸에 면도칼을 대게 하십시오’입니다. 곧 온몸의 털을 밀라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה / And thus
  english_pob_choice: And thus
  chosen_korean: 그리고 이렇게
  alternatives_korean:
  - 이와 같이
  - 그렇게
  lexicon: HALOT
  rationale: 지시문을 시작하는 절차적 표현이므로, 문맥의 계속성과 규범성을 살려 ‘그리고 이렇게’로 옮겼습니다.
- source_word: לְטַהֲרָם / to cleanse them
  english_pob_choice: to cleanse them
  chosen_korean: 그들을 정결하게 하십시오
  alternatives_korean:
  - 그들을 깨끗하게 하십시오
  - 그들을 정화하십시오
  lexicon: HALOT
  rationale: 제의적 정결을 뜻하므로 ‘정결하게 하다’가 가장 직접적이며, 현대 한국어에서도 예식적 의미를 분명히 드러냅니다.
- source_word: מֵי חַטָּאת / the water for purification from sin
  english_pob_choice: the water for purification from sin
  chosen_korean: 속죄의 물
  alternatives_korean:
  - 정결의 물
  - 죄를 씻는 물
  lexicon: HALOT
  rationale: 히브리어의 직역적 의미를 너무 늘이지 않으면서 제의적 기능을 살리기 위해 간결한 ‘속죄의 물’로 옮겼습니다.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם / let them pass a razor over all their flesh
  english_pob_choice: let them pass a razor over all their flesh
  chosen_korean: 그들 온몸에 면도칼을 대게 하고
  alternatives_korean:
  - 그들의 살 전체에 면도칼을 지나가게 하고
  - 그들 온몸에 면도칼을 지나가게 하고
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 동작의 구체성을 유지하기 위해, 머리와 몸의 제모를 포함하는 의례 행위를 자연스러운 한국어로 풀어 옮겼습니다.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם / and wash their clothes
  english_pob_choice: and wash their clothes
  chosen_korean: 그들의 옷을 빨게 하십시오
  alternatives_korean:
  - 그들의 옷을 씻게 하십시오
  - 그들의 옷을 세탁하게 하십시오
  lexicon: HALOT
  rationale: בגד의 기본적 세탁 행위를 현대 한국어로 가장 자연스럽게 전달하는 동사는 ‘빨다’이므로 이를 선택했습니다.
theological_decisions:
- issue: 정결 언어의 범위
  chosen_reading: 이 절의 טהר와 관련 의례를 도덕적 정화로 좁히지 않고, 레위인 봉헌을 위한 제의적 정결 절차로 옮겼습니다.
  alternative_readings:
  - ‘깨끗하게 하다’로 더 일상적으로 번역하기
  - ‘정화하다’로 보다 기술적으로 번역하기
  rationale: 문맥은 죄책 일반보다 예식적 자격 회복에 초점이 있으므로, 제의적 정결의 의미가 분명한 표현을 택해야 합니다.
  doctrine_reference: 민수기 8장 레위인 정결 예식 문맥
- issue: ‘속죄의 물’의 표현
  chosen_reading: 히브리어 מֵי חַטָּאת을 본문 안에서는 간결하게 ‘속죄의 물’로 옮기고, 대안적 뜻은 각주로 남겼습니다.
  alternative_readings:
  - ‘정결의 물’
  - ‘죄를 위한 물’
  rationale: 원문이 기능상 정결 물을 가리키지만 문자상 ‘죄/속죄’ 요소가 남아 있으므로, 이를 완전히 지우지 않으면서 읽기 쉬운 표현을 택했습니다.
  doctrine_reference: 제의 언어의 번역 투명성
