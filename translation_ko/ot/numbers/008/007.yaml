  source_fidelity: ‘속죄의 물’은 מֵי חַטָּאת의 제의적 정결 용례를 속죄 개념으로 다소 좁히며, ‘정결 예식의 물’이 이 문맥에 더 충실합니다. 또한 원문의 동작 순서와 행위 주체를 살려, 물은 명령을 받는 이가 뿌리고 레위인들은 면도칼을 온몸에 지나가게 하며 옷을 빨도록 구분했습니다.
  naturalness: 초안의 ‘면도칼을 대게 하고’는 동작의 완료와 ‘온몸’에 대한 관계가 다소 불명확합니다. ‘면도칼을 온몸에 지나가게 하게 하십시오’는 원문의 관용적 표현을 자연스러운 현대 한국어로 비교적 가깝게 재현합니다.
  terminology: טהר는 제의적 정결을 나타내는 ‘정결하게 하다/정결해지다’로 일관되게 옮겼습니다. מֵי חַטָּאת은 본문에서 ‘정결 예식의 물’로 번역하고, 직역 및 대안은 각주에 보존했습니다. ‘옷을 빨게 하십시오’는 כבס בגד의 의미에 적절합니다.
  issues:
