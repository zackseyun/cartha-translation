lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then spoke
  chosen_korean: 그때 … 말씀하여
  alternatives_korean:
  - 그리고 … 말씀하시어
  - 그때 … 말씀하셨습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 한국어의 시간 부사어 ‘그때’로 자연스럽게 살리면서, ‘말씀하여’로 뒤의 לֵאמֹר 공식과 연결되는 히브리어 구조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 출애굽기·민수기 맥락의 신명기 표기를 전통적 칭호로 바꾸지 않고, POB의 원칙에 따라 고유명사성을 드러내는 ‘야훼’로 옮겼습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향해
  - 모세께
  lexicon: HALOT
  rationale: אֶל은 발화의 수신자를 가리키므로 ‘~에게’가 가장 직접적이며, 고유명사는 현대 한국어에서 통용되는 ‘모세’를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하며
  - 이르시며
  lexicon: HALOT
  rationale: 히브리어의 관용적 발화 도입어를 단순 ‘말하며’로 풀기보다, 한국어 성경체에서 자연스럽고 명시적인 발화 전개인 ‘말씀하여 이르셨습니다’로 옮겨 직접 인용을 예고했습니다.
theological_decisions:
- issue: 신명기 표기 יְהוָה의 번역
  chosen_reading: ‘야훼’를 본문에 직접 표기했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문이 인칭 호칭이 아니라 언약 이름을 사용하므로, 대체 칭호보다 고유한 신적 이름을 드러내는 번역이 원문의 신학적 무게를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
