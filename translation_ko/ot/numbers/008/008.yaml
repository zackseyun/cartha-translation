id: NUM.8.8
reference: Numbers 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
  footnotes:
  - marker: a
    text: Or "for a purification offering." The Hebrew term חַטָּאת can denote the sin/purification offering in priestly ritual contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 한 수송아지와 그 소제 곧 기름에 섞은 고운 가루를 가져오고[a], 너는 둘째 수송아지를 속죄제물로 가져오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정결제물로.” 히브리어 חַטָּאת는 제의 문맥에서 죄제물/정결제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  english_pob_choice: Then they shall take
  chosen_korean: 그러면 그들은 가져오고
  alternatives_korean:
  - 그리고 그들은 가져오고
  - 그들이 취할 것이며
  lexicon: HALOT
  rationale: 의례 지시의 순차성을 살리되, 한국어에서는 자연스러운 연결어 ‘그러면’과 동사 ‘가져오다’로 제물을 준비해 오는 행위를 분명하게 나타냈습니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: one young bull
  chosen_korean: 한 수송아지
  alternatives_korean:
  - 젊은 수소 한 마리
  - 한 어린 황소
  lexicon: HALOT
  rationale: 관용적 제의 표현인 ‘젊은 수소’보다 현대 한국어에서 더 자연스럽고 정확한 ‘수송아지’로 옮겼고, 첫 번째 제물임을 ‘한’으로 반영했습니다.
- source_word: מִנְחָתוֹ
  english_pob_choice: its grain offering
  chosen_korean: 그 소제
  alternatives_korean:
  - 그 곡식제물
  - 그 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 용례를 따라 ‘소제’로 옮겼고, 소유격 대명사는 문맥상 첫 수송아지의 동반 제물을 가리키므로 ‘그’로 처리했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄를 위한 제물로
  - 죄를 위한 제물로
  lexicon: HALOT
  rationale: חַטָּאת는 제의 문맥에서 ‘속죄제물’로도, ‘죄제물’로도 이해될 수 있으나, 한국어 성경에서 제의 기능을 분명히 드러내는 ‘속죄제물’이 본문 의도에 가장 가깝습니다.
theological_decisions:
- issue: חַטָּאת의 번역 선택
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄제물
  - 정결제물
  rationale: 이 구절은 제사 규례의 절차를 설명하므로, ‘죄’ 자체보다 제의적 효력을 드러내는 번역이 적절합니다. 다만 용어의 해석 여지는 남겨 두어, 본문은 기능 중심으로 읽히도록 했습니다.
  doctrine_reference: 레위기·민수기 제사 규정의 제의적 용례
