  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
  footnotes:
  - marker: a
    text: Or 'a purification offering' for 'a sin offering.' The Hebrew term חַטָּאת can denote the offering associated with sin and purification in priestly contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위인들은 수소들의 머리에 손을 얹어야 하며, 한 마리는 속죄제[a]로, 다른 한 마리는 번제로 야훼께 드려 레위인들을 위하여 속죄하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת은 제의 문맥에서 죄 및 정결과 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
