  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
  footnotes:
  - marker: a
    text: Or 'a purification offering' for 'a sin offering.' The Hebrew term חַטָּאת can denote the offering associated with sin and purification in priestly contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위인들은 수소들의 머리에 자기들의 손을 얹고, 당신은 한 마리는 속죄제물로, 다른 한 마리는 번제물로 야훼께 드려 레위인들을 위하여 속죄해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물’. 히브리어 חַטָּאת은 제의 문맥에서 죄와 정결과 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכ֣וּ אֶת יְדֵיהֶם
  english_pob_choice: shall lay their hands
  chosen_korean: 자기들의 손을 얹고
  alternatives_korean:
  - 자기들의 손을 놓고
  - 자기들의 손을 대고
  lexicon: HALOT
  rationale: 제사 문맥의 סמך는 단순한 접촉이 아니라 예식적 ‘안수’를 가리키므로, 한국어에서는 자연스럽고도 의례적인 ‘손을 얹다’로 옮겼습니다.
- source_word: עַל רֹאשׁ הַפָּרִים
  english_pob_choice: on the heads of the bulls
  chosen_korean: 수소들의 머리에
  alternatives_korean:
  - 수소의 머리에
  - 황소들의 머리에
  lexicon: HALOT
  rationale: פָּרִים은 제의용 수소들이며, 히브리어의 분배적 복수를 한국어 복수 표현으로 살려 ‘수소들의 머리’로 옮겼습니다.
- source_word: וַעֲשֵׂה
  english_pob_choice: and you shall offer
  chosen_korean: 당신은 … 드려
  alternatives_korean:
  - 당신은 … 바치고
  - 당신은 … 제물로 드리고
  lexicon: HALOT
  rationale: 이 동사는 제의 행위의 결과를 가리키므로 직역적 ‘하다’보다 제물 봉헌을 드러내는 ‘드리다’가 원문의 예식적 의미를 더 분명하게 전달합니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 죄를 위한 제물
  lexicon: HALOT
  rationale: POB의 영어 주석이 지적하듯 חַטָּאת은 죄와 정결과 관련된 제물을 뜻할 수 있으므로, 한국어에서는 ‘죄’보다 기능을 드러내는 ‘속죄제물’을 택했습니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 전번제물
  - 전소제물
  lexicon: HALOT
  rationale: עֹלָה는 전소되는 제사를 가리키는 표준 제의 용어이므로, 기존 한국어 성경 전통과 학술적 정확성을 함께 고려해 ‘번제물’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 원문의 신명기적 고유명사는 POB 기준에 따라 학술 음역 ‘야훼’로 유지해, 제의의 수신자를 분명히 드러냈습니다.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  english_pob_choice: to make atonement for the Levites
  chosen_korean: 레위인들을 위하여 속죄해야 합니다
  alternatives_korean:
  - 레위인들을 위하여 속죄하게 해야 합니다
  - 레위인들을 위하여 속죄하게 합니다
  lexicon: HALOT
  rationale: כפר는 제의적 ‘속죄/속죄하다’의 핵심 동사이므로, 결과 목적을 가진 부정사 구문을 한국어에서 자연스럽게 서술형으로 풀어 옮겼습니다.
