lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  english_pob_choice: You shall bring
  chosen_korean: 데려오고
  alternatives_korean:
  - 가져오고
  - 가까이 데리고 오고
  - 소집하고
  lexicon: HALOT
  rationale: 제의적 문맥에서 קרב의 ‘가까이 오게 하다/데려오다’ 의미를 살리되, 현대 한국어에서는 ‘데려오다’가 가장 자연스럽고 간결합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼의 앞에
  - 야훼 면전에
  - 주님 앞에
  lexicon: HALOT
  rationale: 고유신명은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, לִפְנֵי는 제의적 방향성을 드러내는 ‘앞에’로 자연스럽게 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 집합 표현을 직역에 가깝게 유지하면서도, 한국어 성서 용례상 가장 투명한 ‘이스라엘 자손’을 사용했습니다.
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם עַל
  english_pob_choice: shall lay their hands on
  chosen_korean: 안수해야 합니다
  alternatives_korean:
  - 손을 얹어야 합니다
  - 손을 레위인들 위에 얹어야 합니다
  - 손을 레위인들에게 얹어야 합니다
  lexicon: HALOT
  rationale: 안수는 이 제의적 행위를 한국어 성서 용례로 가장 분명하게 드러내는 표현이며, ‘손을 얹다’보다 의례적 의미가 선명합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기준에 따라 ‘야훼’로 옮겨 언약적 신명을 직접 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘손을 얹다’와 ‘안수하다’의 선택
  chosen_reading: 안수하다
  alternative_readings:
  - 손을 얹다
  - 손을 올리다
  rationale: 본문은 단순 접촉이 아니라 제의적 안수 행위를 가리키므로, 한국어에서 그 기능을 가장 정확히 표시하는 ‘안수하다’를 택했습니다.
  doctrine_reference: HALOT / ritual idiom סמך with hands
