id: NUM.8.20
reference: Numbers 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew reads “the sons of Israel,” a standard covenant-community expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론과 이스라엘 자손의 온 회중이 레위 사람들에게 야훼께서 모세에게 레위 사람들에 관하여 명하신 모든 대로 행하였고, 이스라엘 자손[a]은 그들에게 그대로 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “이스라엘 자손”이라고 읽습니다. 이는 언약 공동체를 가리키는 표준 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  english_pob_choice: did
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: עשה는 넓게 '하다/행하다'의 뜻이므로, 구체적 의식명을 덧붙이지 않고 본문의 일반성을 살린 '행하다'를 택했습니다.
- source_word: עֲדַת
  english_pob_choice: congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 회중
  - 공동체
  lexicon: HALOT
  rationale: 언약 공동체의 집합성을 드러내면서도 현대 한국어에서 자연스럽게 읽히도록 '회중'에 전체성을 보태는 '온'을 붙였습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 원문의 친족적 표현을 유지하면서도 한국어 성경에서 널리 통용되는 직역형을 살렸습니다.
- source_word: לַלְוִיִּם / לָהֶם
  english_pob_choice: to the Levites / to them
  chosen_korean: 레위 사람들을 위해 / 그들에게
  alternatives_korean:
  - 레위 사람들에게
  - 레위 사람들에 관하여
  lexicon: HALOT
  rationale: ל가 여기서는 레위 사람들을 향한 행동의 수혜·대상 관계를 나타내므로, 전반부는 '위해'로 자연스럽게 풀고 끝부분은 직접목적을 살려 '그들에게'로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  english_pob_choice: according to all that ... had commanded
  chosen_korean: …께서 … 명하신 모든 대로
  alternatives_korean:
  - …께서 … 명령하신 대로
  - …께서 … 명하신 모든 것대로
  lexicon: HALOT
  rationale: 전적인 일치와 순종을 나타내는 כְּכֹל אֲשֶׁר를 '모든 대로'로 옮겨 범위를 살렸고, 선행 명령을 드러내기 위해 완료형 '명하신'을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 신명을 직접 사용하므로, 본 프로젝트 기준에 따라 대체 호칭이 아니라 고유한 신명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: 이스라엘 집단표현의 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 남성 복수 친족표현을 완화하지 않고 보존해, 본문의 언약 공동체 언어를 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
