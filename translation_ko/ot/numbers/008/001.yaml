    issue: ‘말씀하시며 이르셨습니다’ does not accurately represent the לֵאמֹר speech formula.
    rationale: The connective -며 normally conveys accompanying or simultaneous action. Here לֵאמֹר introduces the ensuing divine speech; ‘말씀하여 이르셨습니다’ is the established formal Korean equivalent and more closely reflects the source structure.
