id: NUM.8.15
reference: Numbers 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
  footnotes:
  - marker: a
    text: Or 'purify them.' The Hebrew verb is used for ritual cleansing.
    reason: lexical_alternative
  - marker: b
    text: That is, ceremonially present them before the LORD as a wave offering.
    reason: cultural_note
translation:
  language: ko
  text: 그런 다음 레위 사람들이 회막에서 봉사하게 하십시오. 그들을 정결하게 하시고[a], 그들을 요제로 드리십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 깨끗하게 하십시오.’ 히브리어 동사는 의식적 정결을 뜻하는 데 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 그들을 여호와 앞에 요제로 의식적으로 제시하라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: And after that
  chosen_korean: 그런 다음
  alternatives_korean:
  - 그리고 나서
  - 그 후에
  lexicon: HALOT
  rationale: 앞선 정결 절차 이후의 시간적 순서를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יָבֹאוּ הַלוִיִּם לַעֲבֹד
  english_pob_choice: the Levites shall come to serve
  chosen_korean: 레위 사람들이 회막에서 섬기러 나아오게 하십시오
  alternatives_korean:
  - 레위 사람들이 섬기러 오게 하십시오
  - 레위 사람들이 회막에서 봉사하러 오게 하십시오
  lexicon: HALOT
  rationale: בוא의 ‘오다/나아오다’와 עבד의 예배적 ‘섬기다’를 살렸고, 문맥상 서비스의 장소인 회막을 분명히 했습니다.
- source_word: אֶת אֹהֶל מוֹעֵד
  english_pob_choice: at the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 회막 곁에서
  - 회막에서 섬기도록
  lexicon: HALOT
  rationale: עבד와 결합된 המקום 용법으로 보아 ‘회막에서’가 가장 자연스럽고, 성막/회막의 기능적 장소성을 유지합니다.
- source_word: וְטִהַרְתָּ אֹתָם
  english_pob_choice: and you shall cleanse them
  chosen_korean: 그들을 깨끗하게 하시고
  alternatives_korean:
  - 그들을 정결하게 하시고
  - 그들을 정화하시고
  lexicon: HALOT
  rationale: טהר의 의식적 정결 의미를 반영하면서도, 현대 한국어에서 너무 추상적이지 않은 ‘깨끗하게 하다’를 택했습니다.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  english_pob_choice: and wave them as a wave offering
  chosen_korean: 그들을 요제물로 흔드십시오
  alternatives_korean:
  - 그들을 요제물로 바치십시오
  - 그들을 흔들어 요제로 삼으십시오
  lexicon: HALOT
  rationale: תְּנוּפָה의 제의적 ‘흔듦/들어 올림’ 이미지를 유지하기 위해 직설적으로 옮겼고, POB의 ‘wave offering’에 대응하여 ‘요제물’을 사용했습니다.
theological_decisions:
- issue: 레위인 봉헌의 제의적 성격
  chosen_reading: 단순 임명이나 파견이 아니라, 정결과 요제의식을 포함한 예배적 봉헌으로 옮겼습니다.
  alternative_readings:
  - 레위 사람들이 봉사하도록 하십시오
  - 그들을 임명하십시오
  rationale: 본문은 레위인의 직무 시작을 특정 성막 의식으로 묘사하므로, 그 의례성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 민수기 8장의 레위인 봉헌 문맥
- issue: 화자 존대의 처리
  chosen_reading: 하나님께 직접 드리는 명령형을 피하고, 모세에게 주시는 지시문 형식인 합쇼체로 번역했습니다.
  alternative_readings:
  - 그들을 깨끗하게 하십시오
  - 그들을 흔드십시오
  rationale: 본문은 서술적 지시문이므로 한국어 공손 체계를 일관되게 유지하는 것이 적절합니다.
  doctrine_reference: 한국어 성경 문체 원칙
