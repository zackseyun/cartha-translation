revisions:
- from: 그런 다음 레위 사람들이 회막에서 섬기러 나아오게 하십시오. 그리고 그들을 깨끗하게 하시고, 그들을 요제물로 흔드십시오.[a][b]
  to: 그런 다음 레위 사람들이 회막에서 봉사하게 하십시오. 그들을 정결하게 하시고[a], 그들을 요제로 드리십시오.[b]
  rationale: 시간 순서와 레위인들의 회막 봉사를 유지했습니다. 의례 문맥의 טהר를 ‘정결하게’로 명확히 하고, 레위인들이 요제로 봉헌되는 제의적 행위를 한국어 성경 문체에 맞게 ‘요제로 드리십시오’로 옮겼습니다. 각주도 해당 낱말 및 행위에 직접 연결되도록 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:04Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그들을 깨끗하게 하시고’는 טהר의 의례적 정결 의미를 충분히 드러내지 못하므로 ‘정결하게 하시고’로 고치는 것이 필요합니다. 또한 תְּנוּפָה는 통상적인 제의 용어 ‘요제’로 옮기되, 레위인들 자신을 요제로 드리는 독특한 행위를 보존해야 합니다.
  naturalness: 합쇼체 지시문으로 자연스럽습니다. ‘회막에서 봉사하게 하십시오’는 אֶת אֹהֶל מוֹעֵד와 결합한 봉사의 기능적 장소를 자연스럽게 표현합니다. ‘요제로 드리십시오’는 현대 한국어 성경 문체와 제의 용어 사용에 잘 맞습니다.
  terminology: ‘레위 사람들’, ‘회막’, ‘정결하게’, ‘요제’는 문맥과 한국어 성경 용례에 적절합니다. ‘요제물로 흔드십시오’보다 ‘요제로 드리십시오’가 레위인들을 물건처럼 흔드는 인상을 피하면서도 제의적 봉헌의 뜻을 보존합니다.
