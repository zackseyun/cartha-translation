base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'wave them as a wave offering to the LORD.' The Hebrew uses the verb for ritual waving/presentation together with the noun 'wave offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 레위 사람들을 아론과 그의 아들들 앞에 세우고, 그들을 야훼께 요제로 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동사 ‘흔들다/바치다’와 명사 ‘요제’를 함께 써서, 문자적으로는 ‘요제로 흔들다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  english_pob_choice: you shall set
  chosen_korean: 세우고
  alternatives_korean:
  - 배치하고
  - 서게 하고
  lexicon: HALOT
  rationale: 히필형 עמד는 ‘서게 하다/세우다’의 사역적 의미이므로, 예식적 배치를 자연스럽게 드러내는 ‘세우고’로 옮겼습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 공동체 안의 집단 명칭을 한국어에서 자연스럽고 분명하게 드러내기 위해 ‘레위 사람들’을 선택했습니다.
- source_word: וְהֵנַפְתָּ ... תְּנוּפָה
  english_pob_choice: present them as a wave offering
  chosen_korean: 그들을 … 요제로 드리십시오
  alternatives_korean:
  - 그들을 … 흔들어 드리십시오
  - 그들을 … 요제 제물로 드리십시오
  lexicon: HALOT
  rationale: נוף와 תְּנוּפָה의 결합은 제의적 ‘흔듦/바침’의 기술 용어이므로, 한국어 성경 전통에서 통용되는 ‘요제’로 표시해 제의 범주를 보존했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 이 번역본의 기본 원칙에 따라 יהוה는 학술적 표기인 ‘야훼’로 옮기고, ל의 방향성은 여격 조사 ‘께’로 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약명을 직접 드러내기 위해 전통적 완곡어인 ‘주님’ 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 제의 동작의 표현
  chosen_reading: 요제로 드리십시오
  alternative_readings:
  - 흔들어 드리십시오
  - 제물로 바치십시오
  rationale: 사람인 레위 사람들에게 적용된 제의 행위를 과도하게 문자화하지 않으면서도, 본문의 제의적 기술어를 살리기 위해 ‘요제’ 표현을 유지했습니다.
  doctrine_reference: 'POB translation philosophy: optimal equivalence'
