id: NUM.5.14
reference: Numbers 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
  footnotes:
  - marker: a
    text: Or 'has become unclean.' The Hebrew uses impurity language that can denote ritual uncleanness, but here it refers specifically to suspected sexual defilement.
    reason: lexical_alternative
  - marker: b
    text: Or 'and she has not defiled herself.' The Hebrew conjunction is simply 'and'; 'though' in the main text brings out the contrast in the legal scenario.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 질투의 영이 그에게 임하여 그의 아내를 질투하게 되고, 그녀가 더럽혀졌거나, 또는 질투의 영이 그에게 임하여 그의 아내를 질투하게 되되, 그녀가 더럽혀지지 않았을 경우라면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 더럽혀졌다.’ 히브리어의 부정 언어는 의례적 부정을 뜻할 수 있지만, 여기서는 의심되는 성적 더럽힘을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 더럽혀지지 않았다.’ 히브리어 접속사는 단순히 ‘그리고’이지만, 본문에서는 법적 대비를 드러내기 위해 ‘경우라면’으로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  english_pob_choice: comes over him
  chosen_korean: 그에게 임하여
  alternatives_korean:
  - 그를 덮쳐
  - 그에게 내려와
  lexicon: HALOT
  rationale: ‘רוח’가 사람에게 강하게 미치는 onset을 한국어에서는 ‘임하다’로 비교적 자연스럽게 살려, 돌발적이고 압도적인 작용을 드러냈습니다.
- source_word: רוּחַ קִנְאָה
  english_pob_choice: a spirit of jealousy
  chosen_korean: 질투의 영
  alternatives_korean:
  - 질투의 영
  - 시기의 영
  - 질투하는 영
  lexicon: HALOT
  rationale: 여기서 קִנְאָה는 열심보다 질투의 의미가 분명하므로 ‘질투의 영’으로 옮기되, ‘영’은 인격적 존재라기보다 그 사람을 사로잡는 내적 충동을 함께 드러냅니다.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  english_pob_choice: he is jealous of his wife
  chosen_korean: 그의 아내를 질투하게 되고
  alternatives_korean:
  - 그의 아내를 질투하고
  - 그의 아내에 대해 질투하여
  lexicon: HALOT
  rationale: 히브리어 동사의 진행을 살려 상태 진술보다 ‘질투하게 되고’로 풀어, 원인의 작용과 결과를 순차적으로 보여 주었습니다.
- source_word: נִטְמָאָה
  english_pob_choice: has defiled herself
  chosen_korean: 더럽혀졌거나
  alternatives_korean:
  - 부정하게 되었거나
  - 더럽혀졌거나
  lexicon: HALOT
  rationale: 민수기 5장의 문맥은 의례적 부정만이 아니라 간음 의혹에 따른 도덕적·언약적 오염을 포함하므로, ‘더럽혀지다’로 그 긴장을 유지했습니다.
- source_word: וְהִיא לֹא נִטְמָאָה
  english_pob_choice: though she has not defiled herself
  chosen_korean: 그녀가 더럽혀지지 않았을 경우라면
  alternatives_korean:
  - 그녀가 더럽혀지지 않았지만
  - 그녀가 더럽혀지지 않았다면
  lexicon: HALOT
  rationale: 히브리어의 단순 접속사를 한국어에서는 판례식 법문 문체에 맞게 조건적 대비로 풀어, 무고한 경우의 법적 상황을 분명히 했습니다.
theological_decisions:
- issue: ‘영’이 사람에게 임하는 표현의 성격
  chosen_reading: 직접적 영적 사역이라기보다 사람을 사로잡는 질투의 충동이 임하는 상황으로 읽고, ‘임하여’로 번역했습니다.
  alternative_readings:
  - 질투의 마음이 생겨
  - 질투가 그를 덮쳐
  rationale: 본문은 예언적 영감이 아니라 법문 속 인간 내면의 발동을 묘사하므로, 너무 영적 체험처럼 읽히지 않도록 하되 원문의 강한 작용은 보존해야 합니다.
  doctrine_reference: 민수기 5:14의 법적·서술적 문맥
- issue: נִטְמָאָה의 의미 범위
  chosen_reading: ‘더럽혀지다’로 옮겨 성적 부정과 의례적 부정의 중첩을 함께 살렸습니다.
  alternative_readings:
  - 부정하게 되다
  - 오염되다
  rationale: POB의 영어 선택처럼, 이 구절은 단순한 의식 정결 문제가 아니라 혼인 충실성에 대한 의혹을 포함하므로 도덕적 함의를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 민수기 5장 정결 규정의 문맥
