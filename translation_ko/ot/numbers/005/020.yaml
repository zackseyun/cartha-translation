review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence of conditional clauses, the marital-deviation metaphor, defilement language, and the Hebrew sexual euphemism. However, ‘그의 잠자리를 두었으면’ is not idiomatic Korean and does not clearly convey the Hebrew idiom for sexual relations. ‘더럽혀졌으며’ also unnecessarily makes the Niphal verbal form sound externally passive rather than describing the woman's resultant defiled state.
  naturalness: ‘네 남편 아래에서’ is understandable but stiff. ‘네 남편 아래에 있으면서’ is a more natural Korean way to retain the literal idiom. ‘너와 잠자리를 하였으면’ is established modern Korean euphemistic usage and conveys the source expression clearly without becoming clinically explicit.
  terminology: ‘빗나가다’ appropriately preserves the source metaphor without prematurely replacing it with ‘간음하다.’ ‘더럽혀지다’ preserves the ritual-sexual defilement category. The footnotes should be anchored to their respective expressions rather than collected after the entire sentence.
  issues:
  - severity: medium
    issue: ‘어떤 남자가 네게 그의 잠자리를 두었으면’ is unnatural and semantically opaque in Korean.
    rationale: Korean does not normally use ‘잠자리를 두다’ for sexual intercourse. It risks being read as placing bedding rather than as the Hebrew euphemism for sexual relations.
  - severity: low
    issue: The footnote markers are all placed after the sentence rather than at the relevant words.
    rationale: Anchoring each note at its corresponding expression improves usability and makes the lexical and idiomatic explanations unambiguous.
  - severity: low
    issue: ‘더럽혀졌으며’ can suggest an external agent more strongly than the Hebrew Niphal resultant-state expression.
    rationale: ‘더럽게 되었으며’ more naturally expresses having become defiled while retaining the text’s evaluative ritual-sexual language.
  revised_text: 그러나 네가 네 남편 아래에 있으면서 빗나가고[a], 더럽게 되었으며[b], 어떤 남자가 네 남편 외에 너와 잠자리를 하였으면[c]—
