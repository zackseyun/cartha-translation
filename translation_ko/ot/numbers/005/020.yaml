  lexicon: HALOT
  rationale: 히브리어의 ‘벗어남’ 비유를 살리면서, 결혼 관계에서의 일탈이라는 뉘앙스를 과도하게 해석하지 않도록 ‘빗나가고’로 옮겼습니다.
