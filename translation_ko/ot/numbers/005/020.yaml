theological_decisions:
- issue: 성적 관계 완곡어법을 현대 한국어에서 얼마나 직접적으로 드러낼지
  chosen_reading: 원문의 완곡어법을 살리되 ‘그의 잠자리’를 통해 성적 관계를 암시하게 했습니다.
  alternative_readings:
  - ‘성관계를 맺었으면’처럼 명시적으로 풀어쓰기
  - ‘함께 누웠으면’처럼 더 전통적인 완곡어법 사용
  rationale: 이 절은 משפט적 진술의 엄중함과 동시에 히브리어의 완곡표현을 포함하므로, 너무 풀면 과도한 설명이 되고 너무 약하면 의미가 흐려집니다. ‘그의 잠자리’는 그 긴장을 비교적 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source idiom and legal force without over-paraphrase.'
