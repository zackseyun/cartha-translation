  naturalness: ‘이스라엘 자손에게 명령하십시오. ... 모두를 진영에서 내보내게 하십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 명령의 수신자와 실제 행위 주체를 분명히 합니다. ‘분비물이 있는 사람’보다 ‘몸에 유출이 있는 사람’이 정결 규례의 비정상적 신체 유출이라는 뜻을 더 자연스럽게 드러냅니다.
