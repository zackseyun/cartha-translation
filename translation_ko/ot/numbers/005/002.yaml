id: NUM.5.2
reference: Numbers 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
  footnotes:
  - marker: a
    text: Or, 'every leprous person.' The Hebrew term refers broadly to a serious skin affliction in ritual-law contexts, not necessarily modern leprosy.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'everyone unclean by a person/soul'; this idiom refers to impurity from a dead body.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 명령하여 진영 밖으로 내보내십시오. 곧 피부병이 있는 사람[a]과 분비물이 있는 사람[b]과 죽은 사람으로 인해 부정한 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나병에 걸린 사람’. 히브리어 용어는 정결법 문맥에서 현대 의학의 나병에 한정되지 않는 심한 피부 질환을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘분비가 있는 사람’입니다. 이 표현은 정결법에서의 신체 분비를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  english_pob_choice: Command
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: מְצַוֶּה의 명령형 강도를 살리면서도 한국어 문장에서는 자연스러운 행정적 문체가 되도록 ‘명령하여’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 직역인 ‘sons of Israel’의 혈연·언약적 표현을 보존하되, 한국어에서는 관용적인 성서 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: צָרוּעַ
  english_pob_choice: everyone with a skin disease
  chosen_korean: 피부병이 있는 사람
  alternatives_korean:
  - 나병 환자
  - 심한 피부병이 있는 사람
  lexicon: HALOT
  rationale: 율법의 정결 규례 문맥에서 현대 의학적 ‘나병’으로 좁히지 않기 위해, POB의 폭넓은 의미를 따라 ‘피부병이 있는 사람’으로 옮겼습니다.
- source_word: זָב
  english_pob_choice: everyone with a discharge
  chosen_korean: 분비물이 있는 사람
  alternatives_korean:
  - 유출이 있는 사람
  - 몸에서 흐름이 있는 사람
  lexicon: HALOT
  rationale: 신체 분비로 인한 정결 부정을 가리키므로, 한국어에서 원의가 드러나도록 ‘분비물이 있는 사람’으로 옮겼습니다.
- source_word: טָמֵא לָנָפֶשׁ
  english_pob_choice: everyone unclean by a dead body
  chosen_korean: 죽은 사람으로 인해 부정한 사람
  alternatives_korean:
  - 시체로 인해 부정한 사람
  - 죽은 몸으로 부정하게 된 사람
  lexicon: HALOT
  rationale: 히브리어 관용구가 시체 접촉에 의한 부정을 뜻하므로, ‘죽은 사람’과 ‘부정한’의 결합으로 그 의미를 직접 드러냈습니다.
theological_decisions:
- issue: 정결 규례에서의 ‘부정한’의 의미
  chosen_reading: 윤리적 비난이 아니라 성소 공동체 안에서의 의례적 부정 상태로 읽도록 ‘부정한’으로 유지했습니다.
  alternative_readings:
  - 더러운
  - 오염된
  - 불결한
  rationale: 민수기 5장의 초점은 죄책 선포가 아니라 진영의 거룩함과 접촉 규정이므로, 정결-부정 범주를 흐리지 않는 용어를 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
