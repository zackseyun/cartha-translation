theological_decisions:
- issue: 저주 문구의 신체적 효과를 얼마나 구체화할 것인가
  chosen_reading: 본문의 신체 이미지를 유지하면서도, 그것을 임신 상실이나 불임으로 단정하지 않고 ‘넓적다리 쇠약’과 ‘배 부풂’으로 남깁니다.
  alternative_readings:
  - 당신의 태가 유산하게 하시며 배가 붓게 하시기를 바랍니다
  - 당신의 자궁이 무너지게 하시며 배가 붓게 하시기를 바랍니다
  rationale: 히브리어 표현은 난해하고 해석이 분분하므로, 본문이 직접 말하는 만큼만 옮겨 의미를 좁히지 않았습니다. 이는 해석적 논쟁을 번역 본문에서 미리 확정하지 않으려는 방침에 부합합니다.
  doctrine_reference: '번역 철학 #3: 본문의 신학적 긴장을 해소하지 않고 보존합니다.'
