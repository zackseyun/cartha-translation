base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'make you an example of cursing and oath-taking' among your people.
    reason: lexical_alternative
  - marker: b
    text: '''Your thigh fall away'' is a literal rendering of a difficult Hebrew expression. It may be a euphemism involving the reproductive organs or indicate wasting/shriveling of that part of the body.'
    reason: lexical_alternative
  - marker: c
    text: '''Abdomen'' may also be rendered ''belly'' or, in some interpretations, ''womb.'' The exact medical or reproductive effect described in this curse is debated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 그 여자에게 저주 선서의 맹세를 하게 하고, 제사장은 그 여자에게 말할 것입니다. “야훼께서 당신을 당신의 백성 가운데서 저주와 맹세가 되게 하시고, 야훼께서 당신의 넓적다리를 쇠약하게 하시며 당신의 배를 부풀게 하시기를 바랍니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주 선서의 맹세’는 보다 관용적으로는 ‘당신을 저주의 표본, 곧 저주와 맹세의 대상으로 삼으시기를’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘넓적다리’는 히브리어의 문자적 표현을 따른 것이며, 이 문맥에서는 생식 기관과 관련된 완곡어법일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘배’는 문자적으로는 복부를 뜻하며, 어떤 해석에서는 자궁으로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  english_pob_choice: shall make ... swear
  chosen_korean: 맹세를 하게 하고
  alternatives_korean:
  - 맹세시키고
  - 서약하게 하고
  lexicon: HALOT
  rationale: 히필형은 제사장이 여인으로 하여금 맹세하게 하는 사역 의미이므로, 현대 한국어에서는 법적·의례적 힘을 살린 ‘맹세를 하게 하고’가 자연스럽습니다.
- source_word: בִּשְׁבֻעַת הָאָלָה
  english_pob_choice: with the oath of the curse
  chosen_korean: 저주 선서의 맹세
  alternatives_korean:
  - 저주의 맹세
  - 저주에 대한 선서
  lexicon: HALOT
  rationale: ‘맹세’와 ‘저주’ 두 요소를 함께 드러내기 위해 복합적으로 옮겼습니다. POB의 ‘oath of the curse’가 지닌 공식적·의례적 중첩을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 관례/번역 방침
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 고유명과 서술어적 칭호를 구별했습니다.
- source_word: יְרֵכֵךְ נֹפֶלֶת
  english_pob_choice: your thigh waste away / fall away
  chosen_korean: 당신의 넓적다리를 쇠약하게 하시며
  alternatives_korean:
  - 당신의 넓적다리가 빠지게 하시며
  - 당신의 넓적다리가 떨어져 나가게 하시며
  lexicon: HALOT
  rationale: 직역적 이미지를 유지하되 한국어에서 더 자연스럽고 의미상 ‘쇠약/쇠함’의 뉘앙스를 살릴 수 있도록 옮겼습니다. 이 표현의 신체·완곡적 의미는 본문이 허용하는 범위 안에서 열어 둡니다.
- source_word: בִּטְנֵךְ צָבָה
  english_pob_choice: your abdomen swell
  chosen_korean: 당신의 배를 부풀게 하시기를 바랍니다
  alternatives_korean:
  - 당신의 배가 붓게 하시기를 바랍니다
  - 당신의 복부가 팽창하게 하시기를 바랍니다
  lexicon: HALOT
  rationale: ‘배’는 현대 독자가 이해하기 쉬운 신체 표현이며, ‘부풀게 하시기를 바랍니다’는 본문의 팽창 이미지를 자연스럽게 전달합니다.
theological_decisions:
- issue: 저주 문구의 신체적 효과를 얼마나 구체화할 것인가
  chosen_reading: 본문의 신체 이미지를 유지하면서도, 그것을 임신 상실이나 불임으로 단정하지 않고 ‘넓적다리 쇠약’과 ‘배 부풂’으로 남깁니다.
  alternative_readings:
  - 당신의 태가 유산하게 하시며 배가 붓게 하시기를 바랍니다
  - 당신의 자궁이 무너지게 하시며 배가 붓게 하시기를 바랍니다
  rationale: 히브리어 표현은 난해하고 해석이 분분하므로, 본문이 직접 말하는 만큼만 옮겨 의미를 좁히지 않았습니다. 이는 해석적 논쟁을 번역 본문에서 미리 확정하지 않으려는 방침에 부합합니다.
  doctrine_reference: '번역 철학 #3: 본문의 신학적 긴장을 해소하지 않고 보존합니다.'
