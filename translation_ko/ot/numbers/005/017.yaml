id: NUM.5.17
reference: Numbers 5:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
  footnotes:
  - marker: a
    text: Or 'sacred water.' The Hebrew simply means water set apart as holy for ritual use.
    reason: lexical_alternative
  - marker: b
    text: Or 'in a clay vessel' or 'in a pottery vessel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the ground of the tabernacle.' The Hebrew term can mean 'ground' or 'floor'; 'floor' fits the tabernacle setting well.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 질그릇에[b] 거룩한 물을[a] 담고, 회막 바닥에[c] 있는 흙을 조금 가져다가 그 물에 넣을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성스러운 물’. 히브리어는 의식에 쓰이도록 거룩하게 구별된 물을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘토기 그릇에’ 또는 ‘흙으로 만든 그릇에’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘회막의 지면에’. 히브리어는 ‘바닥’ 또는 ‘지면’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  english_pob_choice: holy water
  chosen_korean: 거룩한 물
  alternatives_korean:
  - 성별된 물
  - 성스러운 물
  lexicon: HALOT
  rationale: קְדֹשִׁים은 의식용으로 구별된 상태를 가리키므로, 교회 전통의 특정 용례를 피하면서도 가장 सीधे한 의미인 '거룩한'으로 옮겼습니다.
- source_word: בִּכְלִי חָרֶשׂ
  english_pob_choice: in an earthen vessel
  chosen_korean: 질그릇에
  alternatives_korean:
  - 토기 그릇에
  - 진흙 그릇에
  lexicon: HALOT
  rationale: כְּלִי חָרֶשׂ는 흙으로 만든 용기를 뜻하므로 한국어 관용과 재료감을 함께 살리는 '질그릇'이 가장 자연스럽습니다.
- source_word: הֶעָפָר
  english_pob_choice: the dust
  chosen_korean: 흙
  alternatives_korean:
  - 먼지
  - 티끌
  - 마른 흙
  lexicon: HALOT
  rationale: 제의 맥락에서 עָפָר는 단순한 먼지보다 바닥의 흙/마른 흙을 가리키므로, 회막 내부의 바닥 재료를 살리는 '흙'으로 옮겼습니다.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  english_pob_choice: on the floor of the tabernacle
  chosen_korean: 회막 바닥
  alternatives_korean:
  - 성막 바닥
  - 회막의 바닥
  lexicon: HALOT
  rationale: קַרְקַע는 표면으로서의 바닥/지면을 뜻하며, 여기서는 성막 내부의 바닥이므로 '회막 바닥'이 문맥을 가장 분명하게 전달합니다.
- source_word: וְנָתַן אֶל הַמָּיִם
  english_pob_choice: and put it into the water
  chosen_korean: 그 물에 넣을 것입니다
  alternatives_korean:
  - 그 물에 둘 것입니다
  - 그 물에 담을 것입니다
  lexicon: HALOT
  rationale: נָתַן + אֶל은 물에 '넣다'가 가장 자연스럽고, 앞서 언급된 물을 가리키는 대명사적 용법은 한국어에서 '그 물'로 처리했습니다.
theological_decisions:
- issue: 의식용 물의 성격
  chosen_reading: 거룩한 물은 일반적인 음용수가 아니라 제의적으로 구별된 물이라는 뜻으로 유지했습니다.
  alternative_readings:
  - 성수로 오해될 수 있는 표현
  - 단순한 물로 평준화하는 표현
  rationale: 본문은 물 자체의 본질보다 의식적 구별을 말하므로, 후대 교회 용어를 덧씌우지 않으면서도 제의적 성격을 보존하는 번역이 필요합니다.
  doctrine_reference: 민수기 5장의 정결/시련 의식 문맥
