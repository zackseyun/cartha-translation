  source_fidelity: 조건문의 역접과 정결/무죄의 대비는 대체로 반영되었으나, 본문에 없는 ‘입증’이라는 증명 절차를 더한 표현과 ‘씨를 낳다’라는 부정확하고 비자연스러운 표현은 고쳐야 합니다. וְנִזְרְעָה זָרַע는 여성이 ‘씨를 낳는다’는 뜻이 아니라 임신/수태를 가리키는 관용구입니다.
  naturalness: ‘몸을 더럽히다’와 ‘깨끗하다’는 현대 한국어에서 이해 가능하지만, 본문의 성적·의례적 문맥에서는 ‘자신을 더럽히다’와 ‘정결하다’가 더 자연스럽고 의미상 분명합니다. ‘씨를 낳게 될 것입니다’는 한국어 관용에 맞지 않습니다.
  terminology: טמא/טהור의 짝은 ‘더럽히다/정결하다’로, נקה는 결과를 과도하게 설명하지 않는 ‘무죄가 되다’로 옮기는 것이 적절합니다. 생식 관용구는 ‘임신하다’로 풀어 옮기되, 직역 가능성은 각주에서 밝혀야 합니다.
