  to: 그러나 그 여자가 자신을 더럽히지 않아 정결하면, 그 여자는 무죄가 되고 임신할 것입니다.[a]
  rationale: ‘그러나’를 보충하여 조건문의 문맥상 대조를 살렸습니다. ‘자신을 더럽히지 않아 정결하면’은 טמא와 טהור의 대조를 보존하면서도 현대 한국어에 맞춥니다. ‘무죄가 되고’는 נקה의 해소·면책 의미를 유지하되 ‘입증’이 덧붙이던 절차적 함의를 제거합니다. 마지막 관용구는 ‘임신할 것입니다’로 자연스럽고 직접적으로 옮기고, 직역 및 관용적 의미는 각주에 남겼습니다.
