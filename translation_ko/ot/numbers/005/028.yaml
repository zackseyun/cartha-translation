source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
  footnotes:
  - marker: a
    text: 'Hebrew: ''will be sown with seed,'' an idiom meaning to conceive or have offspring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가 몸을 더럽히지 않고 깨끗하면, 그녀는 죄 없음이 입증되고 씨를 낳게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “씨로 뿌려질 것이다”로, 임신하거나 자녀를 갖게 되는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절과 대비되는 조건문이므로 단순한 연결보다 역접을 살린 ‘그러나 만일’이 문맥을 더 정확히 드러냅니다.
- source_word: נִטְמְאָה
  english_pob_choice: has not defiled herself
  chosen_korean: 몸을 더럽히지 않고
  alternatives_korean:
  - 더럽혀지지 않고
  - 부정해지지 않고
  lexicon: HALOT
  rationale: 이 절의 טמא는 의례적 오염이면서 성적 부정의 함의를 가지므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘몸을 더럽히다’로 옮겼습니다.
- source_word: וּטְהֹרָה הִוא
  english_pob_choice: and is clean
  chosen_korean: 깨끗하면
  alternatives_korean:
  - 정결하면
  - 깨끗하고
  lexicon: HALOT
  rationale: טָהוֹר의 기본 의미를 살리되, 한국어에서 가장 자연스러운 상태 표현으로 ‘깨끗하다’를 선택했습니다.
- source_word: וְנִקְּתָה
  english_pob_choice: then she will be cleared
  chosen_korean: 죄 없음이 입증되고
  alternatives_korean:
  - 무죄가 되고
  - 정결함이 확인되고
  - 풀려나고
  lexicon: HALOT
  rationale: נקה의 수동형은 ‘깨끗하게 되다/면제되다/무죄가 입증되다’의 폭이 있으므로, 의혹이 해소되는 결과를 분명히 하면서도 지나치게 법정화하지 않기 위해 이처럼 옮겼습니다.
- source_word: וְנִזְרְעָה זָרַע
  english_pob_choice: will conceive offspring
  chosen_korean: 씨를 낳게 될 것입니다
  alternatives_korean:
  - 후손을 낳게 될 것입니다
  - 잉태하게 될 것입니다
  - 자손을 갖게 될 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘씨로 뿌려지다’라는 관용구이지만, 문맥상 임신/출산의 회복을 뜻하므로 한국어 관용을 살려 ‘씨를 낳다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 생식 관련 관용구 해석
  chosen_reading: 이 표현은 무죄 판정 뒤의 회복된 임신 가능성/자녀 출산을 가리키는 관용구로 읽었습니다.
  alternative_readings:
  - 단순히 곧 임신할 것이라는 예고
  - 일반적인 생식력의 지속을 뜻하는 표현
  rationale: 히브리어 וְנִזְרְעָה זָרַע는 문자적으로는 매우 비유적이므로, 의미를 풀되 본문이 보증하는 범위를 넘지 않도록 조심스럽게 번역했습니다.
  doctrine_reference: 민수기 5장 정결 의식 본문 해석
- issue: ‘죄 없음이 입증되고’의 선택
  chosen_reading: 의례적·도덕적 의심이 해소되는 공적 선언으로 이해했습니다.
  alternative_readings:
  - 법정적 무죄 선고
  - 단순한 신체적 무해
  rationale: נקה는 여기서 단순한 신체 안전보다 공동체 앞에서의 무결성 확인을 포함하므로, 법정 용어를 과도하게 고정하지 않으면서도 의혹의 해소를 드러냈습니다.
  doctrine_reference: 의례적 정결과 공동체 판정
