id: NUM.5.13
reference: Numbers 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
  footnotes:
  - marker: a
    text: Literally, 'the lying of seed,' that is, sexual intercourse.
    reason: lexical_alternative
  - marker: b
    text: Or, 'there is no witness concerning her.'
    reason: alternative_reading
  - marker: c
    text: Or, 'she was not seized'; some understand this to imply, 'she was not forced.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 한 남자가 그녀와 동침하여 정액을 흘리고[a], 그것이 남편의 눈에 숨겨져 있으며, 그녀가 숨겨져 있고, 그녀는 부정하게 되었으며, 그녀를 두고 증인이 없고[b], 그녀는 붙잡히지 않았습니다[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘씨의 눕기’로, 곧 정액의 배출을 수반한 성관계를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀에 관하여 증인이 없다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘붙들리지 않았다’입니다. 어떤 이들은 이를 ‘강요당하지 않았다’는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  english_pob_choice: a man lies with her
  chosen_korean: 한 사람이 그녀와 동침하고
  alternatives_korean:
  - 한 남자가 그녀와 누우며
  - 한 남자가 그녀와 잠자리를 같이하고
  lexicon: HALOT
  rationale: שׁכב의 성적 용례를 살려 ‘동침하다’로 옮기되, 법률문맥의 조건절에 맞게 현재형 연결로 처리했습니다.
- source_word: שִׁכְבַת זֶרַע
  english_pob_choice: with an emission of seed
  chosen_korean: 씨를 가진 채로
  alternatives_korean:
  - 씨의 배출과 함께
  - 정액의 배출과 함께
  lexicon: HALOT
  rationale: 직역상 ‘씨의 눕기/배출’에 해당하는 법정·정결 표현이므로, 지나치게 기술적이거나 노골적이지 않으면서도 생식 행위를 드러내는 표현을 택했습니다.
- source_word: וְעֵד אֵין בָּהּ
  english_pob_choice: there is no witness against her
  chosen_korean: 그녀에 대한 증인은 없고
  alternatives_korean:
  - 그 일에 대한 증인은 없고
  - 그녀를 고발할 증인은 없고
  lexicon: HALOT
  rationale: 문맥의 법적 의미를 살려 증언의 부재를 분명하게 했고, ‘against her’는 한국어에서 자연스러운 법률 표현으로 풀었습니다.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  english_pob_choice: she was not caught
  chosen_korean: 그녀는 붙잡히지 않았습니다
  alternatives_korean:
  - 그녀는 들키지 않았습니다
  - 그녀는 체포되지 않았습니다
  lexicon: HALOT
  rationale: נתפשׂ는 여기서 현장에서 발각·포착되지 않았다는 뜻이 가장 자연스러워 ‘붙잡히다’를 택했습니다. 강제성 가능성은 본문이 아니라 주석으로 남기는 편이 좋습니다.
theological_decisions:
- issue: 정결/부정 표현의 번역
  chosen_reading: 그녀는 부정하게 되었습니다
  alternative_readings:
  - 그녀는 더럽혀졌습니다
  - 그녀는 불결하게 되었습니다
  rationale: 율법의 정결 범주를 유지하면서도 현대 한국어에서 이해 가능한 표현을 사용했습니다. ‘부정’은 본문의 제의적 상태를 직접 드러냅니다.
  doctrine_reference: 토라 정결 규례의 용례(민 5장 문맥)
- issue: שִׁכְבַת זֶרַע의 성적 함의
  chosen_reading: 씨를 가진 채로 동침하고
  alternative_readings:
  - 성교하고
  - 정액의 배출과 함께 동침하고
  rationale: 본문의 금기·정결 맥락을 흐리지 않으면서도 과도한 의학적 표현을 피했습니다. 성행위 자체를 분명히 하되, 직역의 거칠음은 한국어 관용으로 완화했습니다.
  doctrine_reference: 번역 철학 §1, §3
