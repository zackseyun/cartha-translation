    rationale: ‘넓적다리를 떨어지게 하다’보다 ‘넓적다리가 떨어지게 하다’가 히브리어의 ‘thigh fall’에 대응하는 한국어 구조이며, 문자적 대안임을 유지하면서도 문법적으로 자연스럽습니다.
