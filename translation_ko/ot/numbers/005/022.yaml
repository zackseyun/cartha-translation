revisions:
- from: 그리고 이 저주를 가져오는 이 물이 네 배 속으로 들어가서, 배를 부풀게 하고 넓적다리를 쇠약하게 하기를. 그리고 그 여자는 「아멘, 아멘」이라고 말해야 합니다.[a]
  to: 그리고 이 저주를 일으키는 물이 네 배 속으로 들어가 네 배를 부풀게 하고 네 넓적다리를 쇠약하게 하기를. 그리고 그 여자는 「아멘, 아멘」이라고 말해야 합니다.[a]
  rationale: 문장 구조를 현대 한국어의 자연스러운 저주적 기원문으로 바로잡고, 원문의 2인칭 여성 단수 대상이 두 신체 결과 모두에 걸림을 명확히 했습니다. 난해한 נפל יָרֵךְ의 의학적 의미는 본문에서 특정하지 않았으며, 문자적 대안과 생식 관련 완곡 표현 가능성은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:53Z'
review_pass:
  verdict: revise
  source_fidelity: 저주/맹세의 문맥에서 וּבָאוּ의 기원적·저주적 뉘앙스와 ‘물들’의 복수, מֵעַיִךְ의 신체 내부 의미, 배의 팽창 및 넓적다리의 난해한 손상 표현을 대체로 잘 보존했습니다. 다만 현행 본문의 ‘들어가서 … 하기를’은 한국어 문장 구조상 어색하며, 결과를 나타내는 두 신체 부위의 소유 관계도 명시하는 편이 원문에 더 충실합니다.
  naturalness: 합쇼체의 의례·법문체로 ‘말해야 합니다’는 적절합니다. 그러나 저주적 기원문은 ‘들어가서 … 하기를’보다 ‘들어가 … 하기를’이 자연스럽고 완결된 구조입니다. ‘저주를 가져오는’도 이해 가능하나 ‘저주를 일으키는’이 물이 저주를 초래하는 기능을 더 자연스럽게 드러냅니다.
  terminology: ‘배 속’, ‘배’, ‘넓적다리’, ‘아멘, 아멘’은 현대 표준어와 원문의 완곡성에 부합합니다. נפל의 정확한 의학적 함의를 특정하지 않고 ‘쇠약하게 하다’로 옮긴 것은 안전합니다. 각주에서는 문자적 대안을 제시하되, 그것이 확정된 의학적 진단이 아님을 유지해야 합니다.
  issues:
  - severity: medium
    issue: 저주적 기원문의 문장 구조가 어색합니다.
    rationale: ‘물이 네 배 속으로 들어가서, 배를 부풀게 하고 넓적다리를 쇠약하게 하기를’은 연결형 ‘들어가서’ 뒤에 종결적 기원형 ‘하기를’이 이어져 문법적·문체적으로 매끄럽지 않습니다. ‘들어가 네 배를 … 하기를’으로 고치면 원문의 기원/저주적 힘도 더 분명해집니다.
  - severity: low
    issue: 결과를 겪는 신체 부위의 소유 관계가 본문에서 생략되었습니다.
    rationale: 히브리어의 여성 단수 2인칭 접미사는 ‘네 배 속’에만 아니라 저주 효과 전체의 대상에 걸립니다. ‘네 배’와 ‘네 넓적다리’라고 밝혀 주면 한국어에서 의미 연결이 명료합니다.
  - severity: low
