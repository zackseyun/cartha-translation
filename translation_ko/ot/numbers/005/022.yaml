  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
  footnotes:
  - marker: a
    text: Or, more literally, 'to swell the belly and to cause the thigh to fall.' The Hebrew expression is difficult and may be a euphemism for reproductive affliction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 저주를 가져오는 이 물이 네 배 속으로 들어가서, 배를 부풀게 하고 넓적다리를 쇠약하게 하기를. 그리고 그 여자는 「아멘, 아멘」이라고 말해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘배를 붓게 하고 넓적다리를 떨어지게 하다’에 가깝지만, 이 표현의 정확한 의학적 의미는 분명하지 않으며 생식 관련 재앙을 완곡하게 가리키는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  english_pob_choice: and may ... enter
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어가기를
  - 들어갈 것이며
  lexicon: HALOT
  rationale: 저주의 선포 문맥에서 단순 미래보다 소망/저주적 수행성을 살리는 연결 표현이 더 적절하므로, 결과를 이어 주는 동사형으로 옮겼습니다.
- source_word: בְּמֵעַיִךְ
  english_pob_choice: your inward parts
  chosen_korean: 네 배 속
  alternatives_korean:
  - 네 내장
  - 네 속사람
  - 네 장부
  lexicon: HALOT
  rationale: מֵעֶה의 구체적인 신체 내부를 현대 한국어에서 과도하게 해부학화하지 않으면서도 직접적으로 드러내기 위해 ‘배 속’을 택했습니다.
- source_word: לַצְבּוֹת בֶּטֶן
  english_pob_choice: to make the belly swell
  chosen_korean: 배를 부풀게 하고
  alternatives_korean:
  - 배를 붓게 하고
  - 복부를 부풀게 하고
  lexicon: HALOT
  rationale: infinitive of result의 기능을 살리면서 בֶּטֶן의 직역을 유지하기 위해 ‘배’를 쓰고, 결과적 변화를 자연스럽게 드러내는 ‘부풀게 하고’로 옮겼습니다.
- source_word: וְלַנְפִּל יָרֵךְ
  english_pob_choice: and the thigh waste away
  chosen_korean: 넓적다리를 쇠약하게 하기를
  alternatives_korean:
  - 넓적다리가 떨어지게 하기를
  - 허벅지가 쇠잔하게 하기를
  - 넓적다리를 무너지게 하기를
  lexicon: HALOT
  rationale: יָרֵךְ는 기본적으로 넓적다리/허벅지이므로 이를 살리고, נפל의 관용적·난해한 의미는 한국어에서 직접적인 손상 효과를 주는 ‘쇠약하게’로 처리해 본문이 지닌 해석의 긴장을 보존했습니다.
theological_decisions:
- issue: 이 저주의 신체적 결과를 얼마나 구체화할 것인가
  chosen_reading: 본문의 모호성을 유지하여 ‘배를 부풀게 하고 넓적다리를 쇠약하게 하기를’로 번역했습니다.
  alternative_readings:
  - 유산하게 하고 배를 부풀게 하기를
  - 자궁을 붓게 하고 넓적다리를 떨어지게 하기를
  - 복부를 부풀게 하고 생식 부위를 쇠약하게 하기를
  rationale: 히브리어 표현은 의도적으로 난해하고 완곡할 가능성이 있으므로, 원문이 분명히 말하는 범위를 넘어서 의학적 결과를 단정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
