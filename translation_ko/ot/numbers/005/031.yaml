translation:
  language: ko
  text: 그러면 그 남자는[a] 죄책을 면하게 되고, 그 여자는 자기 죄책을 지게 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 남편은 죄책을 면하게 되고.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 죄악을 지게 됩니다.’ 히브리어 관용구는 죄책의 결과를 짊어지는 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  english_pob_choice: will be free
  chosen_korean: 벗어나게 되지만
  alternatives_korean:
  - 풀려나게 되지만
  - 무죄가 되지만
  - 면책되지만
  lexicon: HALOT
  rationale: נקה의 ‘깨끗하게 되다/책임에서 벗어나다’ 의미를 살려, משפט적·도덕적 책임에서 풀려나는 뉘앙스를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 남자는
  alternatives_korean:
  - 그 사람은
  - 그 남편은
  lexicon: HALOT
  rationale: 직역 쪽인 ‘그 남자’가 원문 איש의 기본 의미를 보존하며, 본문 맥락상 남편을 가리키더라도 본문은 우선적으로 ‘남자’라고 말합니다.
- source_word: מֵעָוֺן
  english_pob_choice: from guilt
  chosen_korean: 죄책에서
  alternatives_korean:
  - 죄에서
  - 불의에서
  - 유죄에서
  lexicon: HALOT
  rationale: עָוֹן을 여기서는 단순한 ‘죄’보다 책임성과 법적 부담을 함께 드러내는 ‘죄책’으로 옮겨, 앞절의 면책과 짝을 이루게 했습니다.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  english_pob_choice: will bear her guilt
  chosen_korean: 자기 죄책을 져야 합니다
  alternatives_korean:
  - 자기 죄를 지게 됩니다
  - 자기 죄책을 짊어져야 합니다
  - 자기 죄의 결과를 져야 합니다
  lexicon: HALOT
  rationale: נשא עון의 관용구를 ‘지다’로 살려, 죄책이 그녀에게 귀속되어 감당해야 하는 상태를 표현했습니다. ‘결과를 지다’는 의미를 설명적으로 풀어 원문의 압축성을 약화시킵니다.
theological_decisions:
- issue: 남자와 여자의 대조적 법적 상태
  chosen_reading: ‘죄책에서 벗어나게 되지만 … 죄책을 져야 합니다’로 대조를 살려, 남자의 면책과 여자의 책임 부담을 병렬로 드러냈습니다.
  alternative_readings:
  - ‘무죄가 되지만 … 벌을 받습니다’
  - ‘책임이 면제되지만 … 책임을 집니다’
  rationale: 이 절의 핵심은 형벌 자체보다 죄책/책임의 귀속 여부에 있으므로, 같은 어근 계열의 표현을 반복해 법적·도덕적 대비를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
