  rationale: 말씀의 수신자를 나타내는 전치사이므로 한국어에서는 간결하고 자연스러운 여격 조사 '에게'로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 이르시기를
