lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 히브리어 דבר의 전형적인 계시 서두 공식을 살려, 단순한 '말하다'보다 엄숙한 '말씀하다'를 택했습니다. 뒤의 לֵאמֹר까지 포함한 연결 표현이므로 '말씀하시기를'로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 사전 원칙에 따라 여호와 대신 고유명사 표기인 '야훼'를 사용하여, 본문이 지시하는 언약 이름을 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 에
  lexicon: HALOT
  rationale: 말씀의 수신자를 나타내는 전치사이므로 한국어에서는 간결하고 자연스러운 여격 조사 '에게'로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 통상적 발화 도입 공식으로, 한국어에서는 반복을 줄이면서도 다음 직접 인용을 예고하는 연결 표현으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 본문의 יְהוָה는 '야훼'로 옮겼습니다.
  alternative_readings:
