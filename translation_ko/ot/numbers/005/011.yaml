  rationale: 계시된 하나님의 이름을 제목어로 대체하지 않고, POB 원칙대로 고유명사성을 드러내는 번역을 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → 야훼'
