  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
  footnotes:
  - marker: a
    text: Or 'the curse-bringing water will enter her as bitter water.' The Hebrew phrase 'for bitterness' is difficult and may describe the water's effect or quality.
    reason: lexical_alternative
  - marker: b
    text: Literally 'her thigh will fall.' The expression is likely a euphemism for a severe bodily affliction affecting her reproductive organs, but the exact sense is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 여자에게 그 물을 마시게 할 때, 만일 그 여자가 자신을 더럽히고 남편에게 불성실하게 행하였다면, 저주를 가져오는 물이 그 여자 안에 들어가 쓰라림을 일으키고[a], 그 여자의 배가 붓고 허벅지가 쇠하며[b], 그 여자는 자기 백성 가운데서 저주가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘레마림’은 뜻이 어려운 표현입니다. 물이 일으키는 결과를 가리킬 수도 있고, 물 자체가 쓰다는 성질을 가리킬 수도 있습니다. 달리 옮기면 ‘쓴 것이 되게 하여’ 또는 ‘쓴 물로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 여자의 허벅지가 떨어질 것이다’입니다. 이 표현은 심한 신체적 고통을 가리키는 완곡한 말일 수 있으나, 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת הַמַּיִם
  english_pob_choice: When he makes her drink the water
  chosen_korean: 그가 그 여자에게 그 물을 마시게 한 뒤
  alternatives_korean:
  - 그가 그 여자에게 그 물을 마시게 하면
  - 그가 그 여자에게 물을 마시게 한 후
  lexicon: HALOT
  rationale: 히필형 שׁקה의 사역적 의미를 살려 ‘마시게 하다’로 옮겼고, 뒤이은 조건문 흐름을 자연스럽게 연결하기 위해 ‘뒤’로 처리했습니다.
- source_word: נִטְמְאָה … וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  english_pob_choice: she has defiled herself and has acted unfaithfully against her husband
  chosen_korean: 자신을 더럽히고 자기 남편에게 불성실하게 행했다면
  alternatives_korean:
  - 부정을 저지르고 자기 남편에게 배신했다면
  - 자신을 부정하게 하고 자기 남편에게 신실하지 않았다면
  lexicon: HALOT
  rationale: נִטְמְאָה는 의례적·도덕적 더러움을 함께 담을 수 있어 ‘자신을 더럽히다’로 옮겼고, מעל의 언약적/관계적 배반은 ‘불성실하게 행하다’로 살렸습니다.
- source_word: וּבָאוּ בָהּ הַמַּיִם הַמְאֲרֲרִים לְמָרִים
  english_pob_choice: the water that brings the curse will enter her for bitterness
  chosen_korean: 저주를 가져오는 그 물이 bitterness를 위해 그 여자 안으로 들어가고
  alternatives_korean:
  - 저주를 가져오는 그 물이 쓴맛을 위해 그 여자 안으로 들어가고
  - 저주를 가져오는 그 물이 쓴 고통이 되도록 그 여자에게 들어가고
  lexicon: HALOT
  rationale: המאררים은 ‘저주를 가져오는’으로, בּוֹא בְּ는 ‘안으로 들어가다’로 옮겼습니다. לְמָרִים은 의미가 어려워 원어의 난점을 드러내기 위해 핵심어를 음역형처럼 남기고, 주석으로 뜻을 풀 수 있게 했습니다.
- source_word: וְצָבְתָה בִטְנָהּ וְנָפְלָה יְרֵכָהּ
  english_pob_choice: her belly will swell and her thigh will waste away
  chosen_korean: 그 여자의 배는 붓고 허벅지는 빠져나가며
  alternatives_korean:
  - 그 여자의 배는 붓고 허벅지는 떨어져 나가며
  - 그 여자의 배는 붓고 허벅지는 쇠하여
  lexicon: HALOT
  rationale: בטן은 직접적으로 ‘배’, יָרֵךְ는 문자적 ‘허벅지’를 유지하되, נפל의 난해한 관용을 한국어에서 가장 근접한 동작 이미지인 ‘빠져나가다’로 처리해 문맥의 신체적 파괴성을 보존했습니다.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  english_pob_choice: and the woman will become a curse among her people
  chosen_korean: 그 여자는 자기 백성 가운데서 저주가 될 것입니다
  alternatives_korean:
  - 그 여자는 자기 백성 가운데서 저주거리로 될 것입니다
  - 그 여자는 자기 백성 가운데서 저주로 남을 것입니다
  lexicon: HALOT
  rationale: אָלָה는 단순한 감정적 저주가 아니라 공동체 안에서 경고 사례가 되는 ‘저주’이므로, ציבור성까지 살려 ‘자기 백성 가운데서 저주가 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘for bitterness’의 난해한 표현을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 원문의 난점을 보존하기 위해 본문에는 ‘bitterness를 위해’처럼 직역 신호를 남기고, 주석에서 쓴맛/쓴 결과의 가능성을 밝힙니다.
  alternative_readings:
  - ‘쓴맛으로’
  - ‘쓴 고통이 되도록’
  rationale: לְמָרִים은 물의 성질인지 결과인지가 분명하지 않아, 의미를 단정적으로 좁히기보다 번역문과 주석이 함께 긴장을 드러내도록 했습니다.
  doctrine_reference: 'Translation philosophy: Preserve lexical/theological tension where Hebrew is ambiguous.'
- issue: ‘허벅지’에 담긴 완곡성과 신체적 심판의 강도
  chosen_reading: ‘허벅지’라는 표면 이미지를 유지하되, 한국어에서는 ‘빠져나가다’로 신체적 붕괴를 드러냅니다.
  alternative_readings:
  - ‘허벅지가 떨어져 나가며’
  - ‘허벅지가 쇠하여’
  rationale: יָרֵךְ의 완곡한 가능성을 과잉 해석하지 않으면서도, 심판의 실제적·육체적 성격을 약화하지 않기 위해 중간 강도의 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: Keep the source''s embodied severity without over-specifying the anatomy.'
