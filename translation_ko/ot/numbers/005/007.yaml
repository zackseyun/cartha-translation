id: NUM.5.7
reference: Numbers 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to the one he wronged.' The Hebrew literally identifies the recipient as the person with respect to whom he incurred guilt.
    reason: lexical_alternative
  - marker: b
    text: '''Make full restitution for his guilt'' renders a Hebrew expression that can also be translated ''restore what he owes'' or ''repay his compensation''; the sense here is repayment of the principal amount, not a sacrificial guilt offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 자신들이 저지른 죄를 고백해야 합니다. 그리고 각 사람은 자신이 진 배상 책임을 원금대로 갚고[b], 거기에 오분의 일을 더하여, 자신이 잘못을 저지른 사람에게[a] 주어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘자신이 해를 끼친 사람에게’. 히브리어는 문자적으로 그가 그 사람에 대하여 죄책을 지게 되었음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자신이 진 배상 책임을 원금대로 갚고’는 히브리어 표현을 옮긴 것입니다. 이 표현은 ‘자신이 빚진 것을 갚다’ 또는 ‘배상금을 돌려주다’로도 번역할 수 있습니다. 여기서는 제물인 ‘속건제물’을 가리키는 것이 아니라, 원금에 오분의 일을 더하여 갚는 배상을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  english_pob_choice: then they shall confess
  chosen_korean: 그들은 ... 고백해야 합니다
  alternatives_korean:
  - 그들은 ... 자복해야 합니다
  - 그들은 ... 인정해야 합니다
  lexicon: HALOT
  rationale: Hitpael of ידה는 여기서 공개적으로 죄를 인정하는 뜻이므로, 교회적 상투어인 자복보다 표준어로도 자연스러운 고백을 택했습니다.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  english_pob_choice: the sin that they have committed
  chosen_korean: 자기가 저지른 죄
  alternatives_korean:
  - 그들이 행한 죄
  - 그들의 범죄
  lexicon: HALOT
  rationale: עשה와 결합한 חטאת는 여기서 실제로 행한 잘못을 가리키므로, 저지른 죄가 직역성과 자연성을 함께 살립니다.
- source_word: וְהֵשִׁיב ... בְּרֹאשׁוֹ וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  english_pob_choice: he shall make full restitution ... adding a fifth to it
  chosen_korean: 온전히 배상하고, 거기에 오분의 일을 더하여
  alternatives_korean:
  - 완전 배상하고, 그 위에 오분의 일을 더하여
  - 본액을 갚고, 거기에 오분의 일을 더하여
  lexicon: HALOT
  rationale: שׁוב의 배상 문맥은 단순히 돌려주는 것보다 법적·경제적 배상의 뜻이 강하므로 배상을 택했고, 오분의 일은 히브리어의 20% 추가분을 분명히 드러냅니다.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  english_pob_choice: to the one against whom he was guilty
  chosen_korean: 자기가 죄를 지은 그에게
  alternatives_korean:
  - 그가 해를 끼친 그에게
  - 그에게 대하여 책임이 있는 그에게
  lexicon: HALOT
  rationale: 이 표현은 피해자를 '그가 죄를 진 상대'로 지칭하는 구조이므로, 직역적이면서도 한국어로 자연한 자기가 죄를 지은 그에게로 옮겼습니다.
theological_decisions:
- issue: אָשָׁם의 의미를 속죄제물로 볼 것인지, 배상 책임으로 볼 것인지
  chosen_reading: 이 절에서는 제물 용어가 아니라 죄로 인한 배상 책임을 뜻하는 것으로 보았습니다.
  alternative_readings:
  - 속죄제물
  - guilt offering
  rationale: 문맥이 고백과 금전 배상 및 오분의 일 추가를 다루므로, 제사 용어를 끌어오지 않고 책임·배상 의미를 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 요구하지 않는 제의적 의미의 과잉도입 지양
