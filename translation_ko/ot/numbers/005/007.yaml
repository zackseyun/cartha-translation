revisions:
- from: 그러면 그들은 자기가 저지른 죄를 고백해야 합니다. 그는 자기의 허물에 대하여 온전히 배상하고, 거기에 오분의 일을 더하여, 자기가 죄를 지은 그에게 그것을 주어야 합니다.[a][b]
  to: 그러면 그들은 자신들이 저지른 죄를 고백해야 합니다. 그리고 각 사람은 자신이 진 배상 책임을 원금대로 갚고[b], 거기에 오분의 일을 더하여, 자신이 잘못을 저지른 사람에게[a] 주어야 합니다.
  rationale: 법규 문맥의 분배적 단수를 ‘각 사람은’으로 명시하고, אָשָׁם 및 בְּרֹאשׁוֹ의 배상·원금 의미를 한국어에서 명료하게 했습니다. 수혜자 표현은 원문의 죄책/책임 관계를 보존하면서 자연스럽게 다듬었고, 각주의 용어와 표지 위치를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:54Z'
