  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어의 복수 고백 명령 뒤에 이어지는 단수 배상 의무는 각 개인에게 적용되는 법규적 단수로 자연스럽게 처리할 수 있습니다. אשם은 이 문맥에서 제물 자체가 아니라 잘못으로 발생한 배상 책임/배상액을 가리키며, בְּרֹאשׁוֹ는 추가되는 오분의 일과 대조되는 원금 전액을 뜻합니다.
  naturalness: 초안의 ‘자기의 허물에 대하여 온전히 배상하고’는 배상 대상이 불명확하고 한국어 결합도 다소 부자연스럽습니다. ‘자신이 진 배상 책임을 원금대로 갚고’는 법률적 문맥과 원금+추가분 구조를 명료하게 전달합니다. 또한 ‘자기가 죄를 지은 그에게’보다 ‘자신이 잘못을 저지른 사람에게’가 현대 표준어에서 자연스럽습니다.
  terminology: ‘속죄제물’은 אָשָׁם의 제의적 용례를 지칭할 경우 통상 ‘속건제물’로 구별하는 것이 정확합니다. 그러나 본절에서는 그 의미를 본문에 도입하지 않아야 합니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 합니다.
  issues:
  - severity: medium
    issue: 배상 대상의 의미가 불명확함
    rationale: ‘자기의 허물에 대하여 온전히 배상하고’는 אָשָׁמוֹ가 가리키는 배상 책임 또는 그에 따른 원금을 충분히 드러내지 못합니다. 뒤의 ‘오분의 일을 더하여’와의 관계상 원금대로 갚는다는 뜻을 밝혀 주는 것이 안전합니다.
  - severity: low
    issue: 수혜자 표현의 자연성
    rationale: ‘자기가 죄를 지은 그에게’는 이해할 수 있으나 어색합니다. 히브리어의 ‘그에게 대하여 죄책을 지게 된 사람’이라는 관계를 ‘자신이 잘못을 저지른 사람’으로 자연스럽게 옮길 수 있습니다.
