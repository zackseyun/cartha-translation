  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: ko
  text: 그 제사장은 여자의 손에서 질투의 소제물을 받아서, 그 소제물을 야훼 앞에서 흔들고 제단에 가까이 가져가야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 그 제사장
  alternatives_korean:
  - 제사장
  lexicon: HALOT
  rationale: 성막 의례 문맥의 직분 용어로서 ‘제사장’이 가장 직접적이며, 지시성도 문맥상 자연스럽습니다.
- source_word: מִיַּד הָאִשָּׁה
  english_pob_choice: from the woman’s hand
  chosen_korean: 여자의 손에서
  alternatives_korean:
  - 그 여자의 손에서
  - 여인에게서
  lexicon: HALOT
  rationale: 히브리어 관용구의 직접 수납 동작을 살리기 위해 ‘손에서’로 옮기되, 한국어에서도 자연스럽게 읽히도록 했습니다.
- source_word: מִנְחַת הַקְּנָאֹת
  english_pob_choice: the grain offering of jealousy
  chosen_korean: 질투의 소제물
  alternatives_korean:
  - 질투의 곡식 제물
  - 질투 제물
  lexicon: HALOT
  rationale: מִנְחָה는 제의적 맥락에서 ‘소제물’로 옮기고, 속격 ‘질투의’는 본문의 특수한 의식 명칭을 그대로 드러내기 위해 유지했습니다.
- source_word: וְהֵנִיף
  english_pob_choice: shall wave
  chosen_korean: 흔들고
  alternatives_korean:
  - 들어 흔들고
  - 요제하듯 흔들고
  lexicon: HALOT
  rationale: 제의적 동작을 가리키는 히필 용례를 한국어 동작어 ‘흔들다’로 간결하게 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겨, 본문의 고유한 언약명 사용을 보존했습니다.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  english_pob_choice: and bring it near to the altar
  chosen_korean: 제단에 가까이 가져가야 합니다
  alternatives_korean:
  - 제단으로 가져가야 합니다
  - 제단 앞에 가져가야 합니다
  lexicon: HALOT
  rationale: קרב의 제의적 의미인 ‘가까이 가져오다’를 살리되, 한국어에서는 목적어와 방향을 자연스럽게 연결했습니다.
theological_decisions:
