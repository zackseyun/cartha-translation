  lexicon: HALOT
  rationale: 앞선 명령에 대한 순종을 드러내는 관용구로서, 단순한 행위보다 ‘그대로’의 일치감을 살렸습니다.
- source_word: וַיְשַׁלְּחוּ אֹתָם אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: sent them outside the camp
  chosen_korean: 그들을 진영 밖으로 내보냈습니다
  alternatives_korean:
  - 그들을 진영 밖으로 보냈습니다
  - 그들을 진영 밖으로 내쫓았습니다
  lexicon: HALOT
  rationale: שׁלח의 추방/이동 의미를 반영하되, 한국어에서 과도하게 강한 ‘내쫓다’보다 서술에 맞는 중립적 동사 ‘내보내다’를 택했습니다.
