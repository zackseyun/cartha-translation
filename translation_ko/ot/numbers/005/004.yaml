  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel'; many English versions render this corporately as 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 그대로 행하여 그들을 진영 밖으로 내보냈습니다. 야훼께서 모세에게 말씀하신 그대로 이스라엘 자손이 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이스라엘의 아들들’이지만, 한국어에서는 공동체 전체를 가리키는 ‘이스라엘 자손’이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
