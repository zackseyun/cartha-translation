theological_decisions:
- issue: 예언/계시 서술에서 하나님의 이름과 발화 방식
  chosen_reading: ‘야훼께서 … 말씀하여 이르셨습니다’로 옮겨, 이름과 발화 행위를 모두 분명히 드러냅니다.
  alternative_readings:
  - ‘주께서 … 말씀하셨습니다’
  - ‘야훼께서 … 말씀하셨습니다’
  rationale: 원문은 단순 과거 서술이 아니라 계시적 발화 공식입니다. ‘야훼’는 고유명사를 보존하고, ‘말씀하여 이르셨습니다’는 공식적 계시 서두의 무게를 유지합니다.
  doctrine_reference: YHWH divine-name rendering; narrative revelation formula
