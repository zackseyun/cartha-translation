  lexicon: HALOT
  rationale: divine speech 서두의 דבר는 단순한 ‘말하다’보다 공식적이고 서술적인 ‘말씀하여 이르다’가 한국어 문맥에 자연스럽고, 이어질 직접 인용을 준비합니다.
