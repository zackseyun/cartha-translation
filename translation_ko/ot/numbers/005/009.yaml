revisions:
- from: 또 이스라엘 자손의 모든 거룩한 예물에서 드리는 모든 봉헌물은 제사장에게로 가져가게 되며, 그것은 그의 것이 됩니다.[a][b][c]
  to: 이스라엘 자손[a]이 제사장에게 가져오는[c] 모든 거룩한 예물[b]에 관한 모든 봉헌물은 그 제사장의 것이 됩니다.
  rationale: The revision resolves the unclear relationship between the contribution and the sacred gifts by using “...에 관한 모든 봉헌물,” keeps both occurrences of כָּל (“모든”), makes the Israelites explicitly the subject of the relative clause, and identifies the priest as the legal possessor. It also relocates footnote markers to their proper anchors without adding interpretive content.
