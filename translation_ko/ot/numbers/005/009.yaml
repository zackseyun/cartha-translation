id: NUM.5.9
reference: Numbers 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “holy things” or “sacred offerings.”
    reason: lexical_alternative
  - marker: c
    text: The verb can also be rendered “present” in sacrificial contexts; literally, “bring near.”
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이스라엘 자손의 모든 거룩한 예물에서 드리는 모든 봉헌물은 제사장에게로 가져가게 되며, 그것은 그의 것이 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: source_note
  - marker: b
    text: 또는 “거룩한 것들”, “성스러운 제물들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 제의 문맥에서는 “가까이 가져가다”라는 뜻도 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  english_pob_choice: contribution
  chosen_korean: 봉헌물
  alternatives_korean:
  - 기증물
  - 헌물
  - 드리는 것
  lexicon: HALOT
  rationale: פָּרָשׁ/קדש 관련 제의 문맥에서 תְּרוּמָה는 단순한 일반 기부보다 따로 구별하여 바치는 헌납물을 가리키므로, 현대 한국어에서는 ‘봉헌물’이 그 제의적 성격을 가장 분명하게 드러냅니다.
- source_word: קָדְשֵׁי
  english_pob_choice: holy gifts
  chosen_korean: 거룩한 예물
  alternatives_korean:
  - 거룩한 것들
  - 성스러운 예물
  - 거룩한 제물
  lexicon: HALOT
  rationale: 복수 구성형으로서 성별된 제의 물건들을 가리키므로 ‘거룩한 예물’이 자연스러우면서도 ‘holy gifts’의 헌납·성별 의미를 유지합니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 히브리어의 남성 친족 표현을 직접 반영하면서도 한국어 성경 독자에게 익숙한 관용 표현을 유지하기 위해 ‘이스라엘 자손’을 택했습니다.
- source_word: יַקְרִיבוּ
  english_pob_choice: bring near
  chosen_korean: 가져가게 되며
  alternatives_korean:
  - 가까이 가져오게 되며
  - 드리게 되며
  - 제사장에게 바치게 되며
  lexicon: HALOT
  rationale: 제의 문맥에서 ‘bring near’는 단순 이동이 아니라 제사장 앞에 예물로 제시하는 행위를 뜻하므로, 한국어에서는 그 기능을 드러내는 ‘가져가게 되며’로 옮겼습니다.
- source_word: לוֹ יִהְיֶה
  english_pob_choice: shall be his
  chosen_korean: 그것은 그의 것이 됩니다
  alternatives_korean:
  - 그의 것이 될 것입니다
  - 그에게 속하게 됩니다
  - 그의 몫이 됩니다
  lexicon: HALOT
  rationale: 법적 소유를 나타내는 관용구이므로 직역적인 ‘그의 것’보다 현재형 진술로 명확하게 옮겨 소유 귀속을 분명히 했습니다.
theological_decisions:
- issue: 제의적 ‘가져가다/드리다’의 뉘앙스
  chosen_reading: ‘제사장에게로 가져가게 되며’로 옮겨 예물을 제사장에게 제의적으로 제시하는 행위를 드러냈습니다.
  alternative_readings:
  - 제사장에게 드리게 되며
  - 제사장에게 바치게 되며
  rationale: 히브리어 יקריבו는 일반적 ‘가져오다’보다 제의적 ‘가까이 가져가다/제시하다’의 의미가 핵심이므로, 의미를 희석하지 않으면서도 한국어로는 이해 가능한 표현을 택했습니다.
  doctrine_reference: Numbers 5:9의 제의법 문맥
