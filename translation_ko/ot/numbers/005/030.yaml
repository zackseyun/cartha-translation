id: NUM.5.30
reference: Numbers 5:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
  footnotes:
  - marker: a
    text: Or 'comes upon'; literally 'passes over him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all this law,' 'all this procedure,' or 'all this ritual.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 어떤 남자에게 질투의 영이 임하여[a] 그가 자기 아내를 질투하고, 그 여자를 야훼 앞에 세우면, 제사장은 그 여자에게 이 모든 율법을 시행해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘임하여’는 문자적으로는 ‘그 위를 지나가다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 모든 율법’은 여기서 앞서 지시된 전체 절차를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  english_pob_choice: a spirit of jealousy comes over
  chosen_korean: 질투의 영이 한 사람 위에 지나가
  alternatives_korean:
  - 질투의 영이 한 사람에게 임하고
  - 질투의 영이 한 사람 위를 지나가
  lexicon: HALOT
  rationale: ‘지나가’는 원문의 תַּעֲבֹר / עָלָיו의 이동 이미지를 살리면서, POB가 유지한 ‘spirit of jealousy’의 모호성을 한국어에서도 보존합니다.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  english_pob_choice: and he is jealous of his wife
  chosen_korean: 그가 자기 아내를 질투하게 되어
  alternatives_korean:
  - 그가 자기 아내를 질투하고
  - 그가 자기 아내를 시기하게 되어
  lexicon: HALOT
  rationale: 동사 קנא의 반복을 살리되, 문맥상 의심과 반응의 발생을 자연스럽게 드러내는 ‘질투하게 되어’를 택했습니다.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  english_pob_choice: and he brings the woman before Yahweh
  chosen_korean: 그 여자를 야훼 앞에 세우고
  alternatives_korean:
  - 그 여자를 야훼 앞에 데려오고
  - 그 여자를 야훼 앞에 서게 하고
  lexicon: HALOT
  rationale: העמיד의 ‘서게 하다/세우다’는 법정·제의적 제시를 가리키므로, ‘세우고’가 원문 동작을 가장 직접적으로 반영합니다.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  english_pob_choice: all this law
  chosen_korean: 이 모든 율법을
  alternatives_korean:
  - 이 모든 규례를
  - 이 모든 절차를
  - 이 모든 지시를
  lexicon: HALOT
  rationale: 여기서는 이미 정해진 제의적 규정 전체를 가리키므로, 프로젝트 기본어인 ‘율법’을 유지하는 것이 가장 일관됩니다.
theological_decisions:
- issue: 질투의 영의 성격을 어떻게 처리할 것인가
  chosen_reading: ‘질투의 영’이라고 직역하여, 내적 충동인지 영적 실재인지 결론짓지 않았습니다.
  alternative_readings:
  - 질투심이
  - 질투의 충동이
  - 질투의 악한 영이
  rationale: 원문과 POB는 이 표현의 의미를 열어 두며, 텍스트가 허용하는 긴장을 해소하지 않는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve ambiguity rather than resolve theological tension.'
