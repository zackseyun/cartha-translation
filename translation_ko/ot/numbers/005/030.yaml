revisions:
- from: 또 어떤 경우든지, 질투의 영이 한 사람 위에 지나가 그가 자기 아내를 질투하게 되어 그 여자를 야훼 앞에 세우고, 제사장은 그 여자에게 이 모든 율법을 행해야 합니다.[a][b]
  to: 또는 어떤 남자에게 질투의 영이 임하여[a] 그가 자기 아내를 질투하고, 그 여자를 야훼 앞에 세우면, 제사장은 그 여자에게 이 모든 율법을 시행해야 합니다.[b]
  rationale: 인물 명사 אִישׁ을 ‘어떤 남자’로 회복하고, ‘질투의 영’의 의미상 모호성은 유지했습니다. 본문에서는 현대 한국어에 맞게 ‘임하다’를 사용하고 문자적 ‘지나가다’는 각주로 보존했습니다. 제사장이 여인에게 규정된 절차를 수행한다는 의미는 ‘시행해야 합니다’로 자연스럽게 표현했습니다. 각주 표지도 각각 해당 어구 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:52Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘또 어떤 경우든지’는 אִישׁ(‘남자’)를 ‘경우’로 바꾸므로 원문에 충실하지 않습니다. 또한 תַּעֲבֹר עָלָיו의 직역적 이동 이미지는 각주로 보존하되, 본문에서는 한국어 관용에 맞게 ‘그에게 임하여’로 옮기는 것이 적절합니다. 나머지 주요 관계와 절차의 순서는 유지됩니다.
  naturalness: ‘질투의 영이 한 사람 위에 지나가’와 ‘그 여자에게 이 모든 율법을 행해야 합니다’는 현대 한국어에서 부자연스럽습니다. ‘어떤 남자에게 임하여’ 및 ‘그 여자에게 이 모든 율법을 시행해야 합니다’로 고치면 합쇼체의 법률·제의 문체를 유지하면서 자연스럽습니다.
  terminology: ‘야훼’, ‘질투의 영’, ‘제사장’, ‘율법’은 유지할 수 있습니다. ‘질투의 영’은 내적 충동인지 영적 존재인지에 관한 원문의 모호성을 보존합니다. תּוֹרָה는 이 문맥에서 앞서 규정된 의례적 법규 전체를 가리키므로 ‘이 모든 율법’ 및 설명 각주가 가능합니다.
  issues:
  - severity: high
    issue: ‘또 어떤 경우든지’
    rationale: 히브리어 או איש אשר는 앞 문맥의 대안을 잇는 ‘또는 어떤 남자에게’이지, 비인칭적인 ‘어떤 경우든지’가 아닙니다. אִישׁ의 인물 지시가 사라집니다.
  - severity: medium
    issue: ‘질투의 영이 한 사람 위에 지나가’
    rationale: 원문의 문자적 이미지는 반영하지만 한국어 본문으로는 어색하고 ‘한 사람 위에’는 일반적 표현이 아닙니다. ‘그에게 임하다’로 본문을 자연스럽게 하고 직역은 각주에서 밝혀야 합니다.
  - severity: medium
    issue: ‘그 여자에게 이 모든 율법을 행해야 합니다’
    rationale: 한국어에서 ‘율법을 그 여자에게 행하다’는 결합이 부자연스럽습니다. 원문의 לָהּ와 제의적 수행 의미를 살려 ‘그 여자에게 ... 율법을 시행하다’로 옮길 수 있습니다.
