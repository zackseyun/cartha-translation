  rationale: הָאָדָם의 일반명사적 의미를 살리되, 한국어에서는 자연스럽게 ‘사람’으로 풀어 generic 의미를 전달했습니다.
- source_word: לִמְעֹל מַעַל בַּיהוָה
  english_pob_choice: by acting unfaithfully against Yahweh
  chosen_korean: 여호와께 신실하지 않게 행하면
