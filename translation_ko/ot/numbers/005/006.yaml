translation:
  language: ko
  text: 이스라엘 자손에게 말하십시오. 남자든 여자든, 사람의 어떤 죄라도 지어 여호와께 신실하지 않게 행하면, 그 사람은 죄책을 지게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘사람’은 여기서 남성만이 아니라 사람 일반을 가리키는 일반적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  english_pob_choice: Speak to
  chosen_korean: 말하십시오
  alternatives_korean:
