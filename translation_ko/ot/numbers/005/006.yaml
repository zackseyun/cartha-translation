  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
  footnotes:
  - marker: a
    text: Or 'any of the sins of humankind.' The Hebrew 'man' here is generic, referring to human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하십시오. 남자나 여자가 사람들이 저지르는 어떤 죄[a]라도 지어 여호와를 거슬러 신의를 저버리면, 그 사람은 죄책을 지게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 히브리어 ‘사람’은 남성만이 아니라 사람 일반을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  english_pob_choice: Speak to
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하라
  - 이르십시오
  lexicon: HALOT
  rationale: 직접 명령형의 법적·예언적 어조를 살리면서, 현대 한국어 합쇼체에 맞게 간결하게 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손에게
