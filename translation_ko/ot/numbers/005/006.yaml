  lexicon: HALOT
  rationale: מעל의 언약적 불성실·배신의 뉘앙스를 살리기 위해 ‘신실하지 않게’로 옮겼고, 한국어 조사 ‘께’로 대상이 여호와임을 드러냈습니다.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  english_pob_choice: then that person is guilty
  chosen_korean: 그 사람은 죄책을 지게 됩니다
  alternatives_korean:
  - 그 사람은 죄를 짓게 됩니다
  - 그 영혼은 죄책이 있습니다
  lexicon: HALOT
  rationale: נפש를 인격 전체로 이해해 ‘그 사람’으로 옮겼고, אָשֵׁם의 법적 상태를 한국어 법률어감의 ‘죄책을 지다’로 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 주어진 영어 POB가 Yahweh를 사용하므로, 본문에서는 원문 신명 표기를 드러내는 한국어 음역을 택했습니다. 본 절의 직접 호칭이 아니라 법문 맥락이므로 예배적 완곡어는 피했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: moral breach의 성격
  chosen_reading: 신실하지 않게 행하면
  alternative_readings:
  - 배반하면
  - 언약을 어기면
  rationale: מעל מַעל은 단순한 규정 위반보다 야훼께 대한 불성실·배신을 가리키므로, 법조문의 도덕적·언약적 긴장을 유지하는 번역을 선택했습니다.
  doctrine_reference: 'HALOT: מעל'
