id: NUM.5.29
reference: Numbers 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
  footnotes:
  - marker: a
    text: Or 'jealousy'; the Hebrew is plural, likely functioning as a technical label for this legal procedure.
    reason: lexical_alternative
  - marker: b
    text: Or 'turns aside' or 'strays.' The Hebrew uses a metaphor for marital unfaithfulness.
    reason: lexical_alternative
  - marker: c
    text: Literally 'under her husband,' an idiom for being under the marital bond or authority of her husband.
    reason: cultural_note
translation:
  language: ko
  text: 이것은 질투의 법입니다[a]. 여자가 남편 아래에서 빗나가고 더럽혀질 때[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘질투들’입니다. 히브리어는 복수형으로, 아마 이 법 절차를 가리키는 전문 용어처럼 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘빗나가다’, ‘돌아서다’입니다. 히브리어는 혼인 불충실을 비유하는 표현을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘남편 아래에서’로, 혼인 관계나 남편의 권위 아래 있음을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת / תּוֹרַת
  english_pob_choice: This is the law of
  chosen_korean: 이것은 … 법입니다
  alternatives_korean:
  - 이것은 … 율법입니다
  - 이것은 … 규례입니다
  lexicon: HALOT
  rationale: 서술문 도입을 살리면서 תּוֹרָה의 법적 성격을 분명히 하기 위해 ‘법’으로 옮겼습니다.
- source_word: הַקְּנָאֹת
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 투기
  - 질투들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 이곳은 특정 법 절차의 기술적 표지이므로 한국어에서는 자연스러운 단수 명사 ‘질투’로 처리하되, 본문의 절차적 용법은 유지했습니다.
- source_word: תִּשְׂטֶה
  english_pob_choice: goes astray
  chosen_korean: 빗나가고
  alternatives_korean:
  - 길을 벗어나고
  - 돌아서고
  - 범죄하고
  lexicon: HALOT
  rationale: 직접적으로 ‘간음하다’로 좁히지 않고, 비유적 이탈 의미를 살린 ‘빗나가다’로 번역해 히브리어의 완곡한 표현을 보존했습니다.
- source_word: תַּחַת אִישָׁהּ
  english_pob_choice: under her husband
  chosen_korean: 남편 아래에서
  alternatives_korean:
  - 남편의 권위 아래에서
  - 남편의 보호 아래에서
  lexicon: HALOT
  rationale: 문자적으로 ‘아래’라는 이미지를 살리되, 결혼 언약/권위 관계를 암시하는 관용구임을 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: וְנִטְמָאָה
  english_pob_choice: becomes defiled
  chosen_korean: 더럽혀질 때
  alternatives_korean:
  - 부정하게 될 때
  - 오염될 때
  - 더럽혀지고
  lexicon: HALOT
  rationale: טמא의 결과 상태를 한국어 ‘더럽혀지다’로 옮겨, 단순한 의식적 부정함보다 성적·도덕적 오염의 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: 질투의 법에서 impurity 표현의 범위
  chosen_reading: ‘더럽혀질 때’로 옮겨, 단순한 의식적 부정이 아니라 의심받는 성적 불충실의 함의를 열어 둡니다.
  alternative_readings:
  - 부정하게 될 때
  - 간음할 때
  rationale: 본문은 명시적으로 ‘간음하다’라고 단정하지 않고 טמא를 사용하므로, 원문의 범주를 넘어 더 강한 법적 판정으로 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
