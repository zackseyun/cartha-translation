  verdict: revise
  source_fidelity: 핵심 어휘인 ‘질투의 법’, 빗나감의 비유, 그리고 ‘더럽혀지다’는 대체로 원문을 충실히 반영합니다. 그러나 ‘남편 아래에서’는 현대 한국어에서 부자연스럽고 관계의 의미가 불명확합니다. 또한 현 번역은 각주 표지가 해당 어구와 맞지 않습니다.
  naturalness: ‘여자가 남편 아래에서 빗나가고 더럽혀질 때’는 직역투이며, ‘더럽혀질 때’가 앞 동사와 결합되는 방식도 매끄럽지 않습니다. ‘남편의 아내로 있으면서 빗나가 더럽혀졌을 때’는 혼인 관계를 나타내는 히브리 관용구를 자연스러운 현대 한국어로 전달합니다.
  terminology: ‘질투의 법’은 הַקְּנָאֹת의 법률적·기술적 용법을 무리 없이 반영합니다. טמא는 ‘더럽혀지다’로 유지하여 ‘간음’으로 과도하게 특정하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘남편 아래에서’의 부자연스러움과 의미 불명확성
    rationale: תַּחַת אִישָׁהּ는 문자적으로 ‘그녀의 남편 아래에서’이지만, 여기서는 혼인 관계 안에 있음을 나타내는 관용적 표현입니다. 현대 한국어의 ‘남편 아래에서’는 자연스럽지 않고 원문이 의도하는 혼인 관계를 충분히 전달하지 못합니다.
