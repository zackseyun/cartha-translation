  rationale: 원문의 법적 절차와 조건문의 의미를 유지하면서, 히브리어 관용구를 한국어에서 오해 없이 자연스럽게 옮겼습니다. ‘부정함’과 ‘빗나가다’를 함께 유지하여 성적 불충실을 암시하되 본문보다 더 구체적인 범죄 명칭을 부과하지 않았습니다. 저주를 가져오는 물의 표현도 보존했습니다.
