  source_fidelity: 핵심 동사와 조건문의 구조, 성적 완곡어법, 부정(טֻמְאָה), 그리고 저주와 관련된 쓴 물의 의미는 대체로 보존되었습니다. 다만 ‘남편 아래에서’는 히브리어 관용구를 한국어에서 지나치게 직역하여 자연스럽지 않고, 남편의 권위라는 뜻으로 좁혀 들릴 수 있습니다. 혼인 상태 안에서의 행위라는 관용적 의미를 본문에 반영하고 각주로 설명하는 편이 더 충실합니다.
