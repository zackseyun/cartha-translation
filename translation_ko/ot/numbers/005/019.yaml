- from: 그때 제사장은 그 여인에게 맹세하게 하고 말해야 합니다. 「만일 어떤 남자도 당신과 동침하지 않았고, 또 당신이 남편 아래에서 부정하게 빗나간 적이 없다면, 이 쓰디쓴 저주를 가져오는 이 물에서 벗어나십시오」.[a][b][c]
