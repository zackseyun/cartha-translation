  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
  footnotes:
  - marker: a
    text: Or, 'be innocent of these bitter waters that bring the curse.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'under your husband,' an idiom referring to the woman's married status and obligation within the marriage bond.
    reason: cultural_note
  - marker: c
    text: Literally, 'the bitter waters, the curse-bringing ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고서 제사장은 그 여인에게 맹세시킨 뒤, 그 여인에게 이렇게 말해야 합니다. 「만일 어떤 남자도 당신과 동침한 일이 없고, 당신이 남편과 혼인 관계에 있으면서 부정함에 빠져 빗나간 적이 없다면[a][b], 이 쓰디쓴 물, 곧 저주를 가져오는 이 물에서 벗어나십시오[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부정함에 빠져 빗나간’은 히브리어의 성적·의례적 불충실 가능성을 함께 아우르는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: ‘남편과 혼인 관계에 있으면서’는 히브리어 ‘남편 아래에서’라는 관용구를 옮긴 것으로, 혼인 관계와 그에 따른 책임 안에 있음을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘이 쓰디쓴 물, 곧 저주를 가져오는 이 물’은 히브리어로 직역하면 ‘이 쓴 물들, 저주를 가져오는 것들’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  english_pob_choice: shall make her swear
  chosen_korean: 맹세하게 하고
  alternatives_korean:
  - 맹세시키고
  - 맹세를 시켜
  lexicon: HALOT
  rationale: 히필형 שבע의 사역적 의미를 살려, 제사장이 그 여인에게 직접 맹세를 요구하는 절차적 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: שָׁכַב אִישׁ אֹתָךְ
  english_pob_choice: no man has lain with you
  chosen_korean: 어떤 남자도 당신과 동침하지 않았고
  alternatives_korean:
  - 아무 남자도 당신과 누운 적이 없고
  - 아무 남자도 당신과 잠자리를 같이하지 않았고
  lexicon: HALOT
  rationale: שׁכב의 성적 완곡어법을 그대로 살리되, 한국어에서는 ‘동침하다’가 비교적 직역에 가깝고 문맥상 지나친 노골성을 피합니다.
- source_word: שָׂטִית טֻמְאָה
  english_pob_choice: you have not gone astray in uncleanness
  chosen_korean: 당신이 … 부정하게 빗나간 적이 없다면
  alternatives_korean:
  - 당신이 … 부정함 가운데로 빗나간 적이 없다면
  - 당신이 … 더러움 속에서 벗어난 적이 없다면
  lexicon: HALOT
  rationale: שׂטה의 ‘빗나가다/벗어나다’와 טֻמְאָה의 ‘부정함’을 함께 살려, 단순 도덕판정보다는 의례적·혼인적 불충실 가능성을 아우르도록 했습니다.
- source_word: תַּחַת אִישֵׁךְ
  english_pob_choice: under your husband
  chosen_korean: 남편 아래에서
  alternatives_korean:
  - 남편의 권위 아래에서
  - 남편과의 혼인 관계 아래에서
  lexicon: HALOT
  rationale: 직역적 표현을 유지해 히브리어 관용구의 결을 살리고, 문맥으로 혼인 상태와 책임의 의미가 드러나도록 했습니다.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים
  english_pob_choice: these bitter waters that bring a curse
  chosen_korean: 이 쓰디쓴 저주를 가져오는 이 물에서
  alternatives_korean:
  - 이 쓰디쓴 저주를 가져오는 물에서
  - 이 쓰디쓴 저주를 가져오는 물들에서
  lexicon: HALOT
  rationale: ‘waters’를 한국어 단수 ‘물’로 자연스럽게 처리하되, 원문의 복수적 집합감을 유지하려는 선택입니다. ‘저주를 가져오는’은 참여사 הַמְאָרֲרִים의 작용성을 반영합니다.
theological_decisions:
- issue: ‘부정하게 빗나간’의 범위
  chosen_reading: 혼인 불충실을 암시하되, 본문이 말하는 의례적 혐의의 범위를 넘어서 명시적 ‘간음’으로 단정하지 않았습니다.
  alternative_readings:
  - 간음하지 않았다면
  - 불결해지지 않았다면
  rationale: 히브리어는 ‘동침’ ‘빗나가다’ ‘부정함’의 조합으로 진술하며, 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 민수기 5장 11–31절의 의례적 검증 구조
- issue: 저주 물의 효과
  chosen_reading: 저주를 ‘가져오는’ 물로 옮겨, 작동 방식은 본문이 허용하는 수준에서만 드러냈습니다.
  alternative_readings:
  - 저주를 내리는 물
  - 저주가 되는 물
  rationale: 본문은 물의 메커니즘을 해설하지 않고, 그 물이 저주와 연관된다는 사실만 진술합니다. 그 범위를 넘지 않도록 했습니다.
  doctrine_reference: 문맥적 신학 보존 원칙
