  to: 그런 다음 제사장은 이 저주들[a]을 두루마리에 기록하고, 그렇게 기록한 글을 쓴 물에 씻어 지워야 합니다.[b]
  rationale: 절차적 접속의 순서를 ‘그런 다음’으로 드러내고, 고대 기록 매체는 ‘두루마리’로 바로잡았습니다. 또한 기록된 저주 문구를 물에 닦아 지우는 물리적 행위를 자연스러운 한국어로 명시했습니다. 저주의 맹세 관련 뉘앙스와 ‘닦아 지우다’라는 어휘 대안은 각 해당 본문 요소에 각주를 연결하여 보존했습니다.
