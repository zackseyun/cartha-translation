id: NUM.5.23
reference: Numbers 5:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/כָתַב אֶת הָ/אָלֹ֥ת הָ/אֵ֛לֶּה הַ/כֹּהֵ֖ן בַּ/סֵּ֑פֶר וּ/מָחָ֖ה אֶל מֵ֥י הַ/מָּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
  footnotes:
  - marker: a
    text: Or 'these oath-curses.' The Hebrew term can denote a curse associated with an oath.
    reason: lexical_alternative
  - marker: b
    text: Or 'blot them out' / 'erase them.' The Hebrew verb refers to wiping off or blotting out the written words.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제사장은 이 저주들을 책에 기록하고, 그것들을 쓴 물에 씻어 넣어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 맹세-저주들’. 히브리어는 맹세와 결부된 저주를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지워 없애다’ / ‘지워 버리다’. 히브리어 동사는 기록된 말을 닦아 지우는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  english_pob_choice: Then ... shall write
  chosen_korean: 기록하고
  alternatives_korean:
  - 써야 합니다
  - 적어야 합니다
  lexicon: HALOT
  rationale: 절차 지시문의 연속 동작을 자연스럽게 살리되, 제의 문맥에 맞게 공문서적 뉘앙스가 있는 ‘기록하다’를 택했습니다.
- source_word: הָאָלֹת הָאֵלֶּה
  english_pob_choice: these curses
  chosen_korean: 이 저주들을
  alternatives_korean:
  - 이 맹세-저주들을
  - 이 맹세의 저주들을
  lexicon: HALOT
  rationale: 문맥상 문서에 적히는 것은 선포된 제재이므로 기본 의미인 ‘저주들’을 본문에 두고, 맹세 관련 뉘앙스는 직역 과잉을 피했습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in the scroll
  chosen_korean: 책에
  alternatives_korean:
  - 두루마리에
  - 문서에
  lexicon: HALOT
  rationale: 고대의 기록 매체를 가리키는 말이므로 물질적 형식은 유지하되, 한국어 본문에서는 자연스러운 ‘책에’로 옮겨 읽기 흐름을 살렸습니다.
- source_word: וּמָחָה אֶל
  english_pob_choice: and wash them off into
  chosen_korean: 그것들을 쓴 물에 씻어 넣어야 합니다
  alternatives_korean:
  - 그것들을 쓴 물에 지워 넣어야 합니다
  - 그것들을 쓴 물로 닦아 없애야 합니다
  lexicon: HALOT
  rationale: מחה의 ‘지우다/닦아내다’ 의미를 살리면서, 액체로 옮겨지는 동작을 한국어로는 ‘씻어 넣다’가 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 문서화된 저주를 물에 씻어 넣는 제의 행위의 표현
  chosen_reading: 본문의 물리적·의례적 동작을 그대로 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 완곡하게 표현하기
  - ‘지워 버리다’만 강조하기
  rationale: 이 절은 저주 문구를 실제로 물에 씻어 넣는 절차를 지시하므로, 의미를 약화시키지 않도록 행동의 구체성을 유지했습니다.
  doctrine_reference: 민수기 5장의 시련 의식 문맥
