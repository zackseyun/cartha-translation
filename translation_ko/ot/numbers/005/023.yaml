    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 지워 없애다’ 또는 ‘그것들을 지워 버리다’. 히브리어 동사는 기록된 말을 닦아 지우는 뜻을 가집니다.
    reason: lexical_alternative
