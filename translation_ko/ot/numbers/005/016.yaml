  source_fidelity: 핵심 동작과 대상은 원문에 충실합니다. 다만 접속사 וְ를 ‘그러면’으로 옮기면 조건·결론의 뉘앙스가 생길 수 있으므로, 문맥상 순차를 나타내는 ‘그때’가 더 적절합니다. 또한 וְהֶעֱמִדָהּ의 사역 의미는 ‘세워야 합니다’로 간결하고 정확하게 나타낼 수 있습니다.
  naturalness: ‘그때 제사장은 그 여자를 가까이 데려와 야훼 앞에 세워야 합니다’가 현대 표준 한국어의 합쇼체로 더 자연스럽고, 두 동작의 연결도 매끄럽습니다.
  terminology: הַכֹּהֵן은 ‘제사장’, יהוה는 POB 방침에 따라 ‘야훼’로 유지하는 것이 적절합니다. 각주에서는 본문에 이미 채택한 ‘야훼’를 다시 대안으로 제시하지 말고, 전통적 칭호 번역 관행만 설명하도록 바로잡아야 합니다.
  issues:
