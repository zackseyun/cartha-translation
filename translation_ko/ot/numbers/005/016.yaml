  to: 그때 제사장은 그 여자를 가까이 데려와 야훼[a] 앞에 세워야 합니다.
  rationale: 순차 접속을 자연스럽게 반영하도록 ‘그러면’을 ‘그때’로 고쳤고, 두 히필 동사를 ‘데려와 … 세워야 합니다’로 연결하여 원문의 사역 의미와 한국어 문체를 함께 살렸습니다. 각주는 본문에서 채택한 ‘야훼’를 중복 대안으로 제시하지 않도록 수정했습니다.
