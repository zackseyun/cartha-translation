lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: shall bring her near
  chosen_korean: 가까이 데려오고
  alternatives_korean:
  - 가까이 끌어오고
  - 가까이 인도하고
  - 가까이 데리고 오고
  lexicon: HALOT
  rationale: 히필 형태의 קרב는 ‘가까이 오게 하다/데려오다’의 뜻이므로, 법적·의례적 장면에서 자연스러운 ‘가까이 데려오고’로 옮겨 동작의 방향성을 살렸습니다.
- source_word: וְהֶעֱמִדָהּ
  english_pob_choice: make her stand
  chosen_korean: 서게 해야 합니다
  alternatives_korean:
  - 서 있도록 해야 합니다
  - 세워야 합니다
  - 서게 합니다
  lexicon: HALOT
  rationale: 히필 형태의 עמד가 사역적 의미를 가지므로, 현대 한국어에서 자연스럽고 강한 사역을 지닌 ‘서게 해야 합니다’로 표현했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 여호와 앞에
  - 주 앞에
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 전통적 대체 표현 대신 음역인 ‘야훼’로 옮기고, לִפְנֵי는 간결하게 ‘앞에’로 처리했습니다.
