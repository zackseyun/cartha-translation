  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
  footnotes:
  - marker: a
    text: Or 'the bitter water'; the broader context identifies this water that way, but this verse itself says simply 'the water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 소제에서 기념물로 드릴 부분을 한 움큼 집어다가 제단에서 불살라야 합니다. 그 후에 제사장은 그 여인에게 물을 마시게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓴 물’로 옮길 수 있습니다. 그러나 더 넓은 문맥이 이 물을 그렇게 설명할 뿐, 이 절 자체는 단순히 ‘물’이라고만 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ / shall take a handful
  english_pob_choice: shall take a handful
  chosen_korean: 한 움큼 집어다가
  alternatives_korean:
  - 한 줌을 뜨다가
  - 한 움큼 취하여
  lexicon: HALOT
  rationale: קמץ는 제의 문맥에서 단순히 ‘집다’가 아니라 정해진 분량을 ‘한 움큼’ 취하는 행위를 가리키므로, 한국어도 그 제의적 동작을 살려 옮겼습니다.
- source_word: מִן הַמִּנְחָה / from the grain offering
  english_pob_choice: from the grain offering
  chosen_korean: 소제에서
  alternatives_korean:
  - 곡식제물에서
  - 소제물에서
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 ‘grain offering’에 해당하므로, 한국어 성경 용례에 맞는 ‘소제’를 택하되 의미를 분명히 했습니다.
- source_word: אֶת אַזְכָּרָתָהּ / its memorial portion
  english_pob_choice: its memorial portion
  chosen_korean: 기념물로 드릴 부분을
  alternatives_korean:
  - 기념 몫을
  - 기념 제물 부분을
  lexicon: HALOT
  rationale: אַזְכָּרָה는 제단에서 불살라 올리는 ‘기념 부분’이므로, 단순한 기억이 아니라 제의적 기념 행위가 드러나도록 ‘기념물로 드릴 부분’으로 옮겼습니다.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה / and burn it on the altar
  english_pob_choice: and burn it on the altar
  chosen_korean: 제단에서 불살라야 합니다
  alternatives_korean:
  - 제단 위에서 불살라야 합니다
  - 제단에 향기처럼 올려야 합니다
  lexicon: HALOT
  rationale: הקטיר는 제의적으로 ‘불살라 바치다’는 뜻이므로, 단순한 소각보다 예배적 행위를 드러내는 한국어 표현을 선택했습니다.
- source_word: יַשְׁקֶה / he shall make ... drink
  english_pob_choice: he shall make the woman drink
  chosen_korean: 그 여인에게 물을 마시게 해야 합니다
  alternatives_korean:
  - 그 여인에게 물을 마시게 해야 합니다
  - 그 여인에게 마시게 해야 합니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살려 ‘마시게 하다’로 옮겼고, 목적어인 ‘물’을 분명히 밝혀 문장의 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 이 물을 본문 자체에서 ‘쓴 물’로 특정할지 여부
  chosen_reading: 본문에는 단순히 ‘물’로 두었습니다.
  alternative_readings:
  - 쓴 물
  - 독한 물
  rationale: 이 절의 히브리어는 단지 הַמָּיִם(‘그 물’)이라고만 말하므로, 가까운 문맥의 설명을 본문에 끌어오지 않고 즉시 본문의 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
