revisions:
- from: 그러면 제사장은 소제에서 기념물로 드릴 부분을 한 움큼 집어다가 제단에서 불살라야 합니다. 그 후에 제사장은 그 여인에게 물을 마시게 해야 합니다.[a]
  to: 그때 제사장은 소제에서 그 기념 부분을 한 움큼 떠서 제단 위에서 불사르고, 그 후에 그 여인에게 그 물[a]을 마시게 해야 합니다.
  rationale: 원문의 제의 용어와 문장 순서를 보존하면서, ‘기념 부분’의 지시 대상 및 제단 위에서 행하는 제의적 소각을 더 분명하게 했습니다. 물에 ‘쓴’이라는 수식어는 본문에 없으므로 본문에는 넣지 않고 각주에만 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:49Z'
review_pass:
  verdict: revise
  source_fidelity: ‘기념물로 드릴 부분’은 אַזְכָּרָה가 가리키는 소제의 제의적 ‘기념 부분’을 다소 우회적으로 표현하며, ‘기념물’이라는 별도 물건을 뜻하는 듯하게 들릴 수 있습니다. 이를 ‘그 기념 부분’으로 바로 옮기면 소제에서 취하는 한 움큼과의 관계 및 제의 용어의 의미가 더 정확해집니다. 또한 מִזְבֵּחָה의 방향·장소 표현에는 ‘제단 위에서’가 적절합니다.
  naturalness: ‘그러면’보다 법규적 지시의 순차를 나타내는 ‘그때’가 더 자연스럽고, ‘소제에서 그 기념 부분을 한 움큼 떠서’는 현대 표준어 합쇼체에서 간결하고 명료합니다.
  terminology: מִנְחָה는 ‘소제’, אַזְכָּרָה는 ‘기념 부분’, הקטיר는 ‘제단 위에서 불사르다’로 옮겼습니다. הַמָּיִם은 본문대로 ‘그 물’로 유지했으며, ‘쓴 물’은 각주에서만 문맥상 대안으로 제시합니다.
  issues:
  - severity: medium
    issue: ‘기념물로 드릴 부분’의 의미가 불분명함
    rationale: אַזְכָּרָה는 별도의 ‘기념물’이라기보다 소제 가운데 제단에서 불사르는 기념 부분을 뜻합니다. ‘그 기념 부분’이 원문의 지시 관계와 제의적 의미를 더 직접적으로 전달합니다.
