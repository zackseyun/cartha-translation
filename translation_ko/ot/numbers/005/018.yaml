base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
  footnotes:
  - marker: a
    text: Or 'uncover the woman's head' or 'let the woman's hair hang loose.' The Hebrew idiom literally says 'loosen/unbind the woman's head,' likely referring to unbinding her hair as part of the ritual.
    reason: lexical_alternative
  - marker: b
    text: Or 'the bitter waters that bring the curse.' The Hebrew participle can be understood as describing waters that effect or carry a curse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 여자를 야훼 앞에 세우고, 여자의 머리를 풀어 주며, 기억의 곡식제물을 그녀의 손에 두어야 합니다. 그것은 질투의 곡식제물입니다. 그리고 제사장의 손에는 저주를 가져오는 쓴 물이 있어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여자의 머리를 드러내며’, ‘여자의 머리카락을 풀어 놓으며’. 히브리어 관용구는 문자적으로는 ‘여자의 머리를 풀다’이며, 아마도 의식의 일부로 머리카락을 풀어 헤치는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저주를 내리는 쓴 물’. 히브리어 분사는 저주를 가져오거나 수행하는 물로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  english_pob_choice: shall set
  chosen_korean: 세우고
  alternatives_korean:
  - 서게 하고
  - 가서 세우고
  lexicon: HALOT
  rationale: 히필형 עמד의 사역적 의미를 살려 공식적 의식 장면에서 여자를 ‘세우는’ 동작으로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼의 앞에
  - 주님 앞에
  lexicon: HALOT
  rationale: 본문의 신명칭 יְהוָה를 POB 기준에 따라 ‘야훼’로 옮기고, קדוש한 의식적 위치 관계를 간결하게 ‘앞에’로 표현했습니다.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  english_pob_choice: loosen the woman's hair
  chosen_korean: 여자의 머리를 풀어 주며
  alternatives_korean:
  - 여자의 머리를 드러내며
  - 여자의 머리카락을 풀어 놓으며
  lexicon: HALOT
  rationale: 히브리 관용구를 문자적으로만 옮기기보다, 의식 행위로서 ‘머리를 풀다’는 한국어 표현으로 자연스럽게 재현했습니다.
- source_word: מִנְחַת הַזִּכָּרוֹן
  english_pob_choice: the grain offering of remembrance
  chosen_korean: 기억의 곡식제물
  alternatives_korean:
  - 기념 곡식제물
  - 기억을 위한 곡식제물
  lexicon: HALOT
  rationale: מִנְחָה를 제의 맥락에서 ‘곡식제물’로, זִכָּרוֹן을 ‘기억’으로 옮겨 기억/기념의 기능을 드러냈습니다.
- source_word: מִנְחַת קְנָאֹת
  english_pob_choice: a grain offering of jealousy
  chosen_korean: 질투의 곡식제물
  alternatives_korean:
  - 투기의 곡식제물
  - 질투 제물
  lexicon: HALOT
  rationale: קְנָאָה의 정서적·관계적 뉘앙스를 살려 ‘질투’로 옮기고, 앞의 מִנְחָה와 연결되는 구조를 보존했습니다.
- source_word: מֵי הַמָּרִים הַמְאָרֲרִים
  english_pob_choice: the bitter waters that bring a curse
  chosen_korean: 저주를 가져오는 쓴 물
  alternatives_korean:
  - 저주를 내리는 쓴 물
  - 저주를 부르는 쓴 물
  lexicon: HALOT
  rationale: הַמְאָרֲרִים의 사역적 의미를 ‘저주를 가져오는’으로 살리고, מֵי הַמָּרִים의 감각적 표현은 ‘쓴 물’로 자연스럽게 옮겼습니다.
