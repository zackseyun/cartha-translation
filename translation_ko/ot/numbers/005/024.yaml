  to: 그는 그 여인에게 저주를 가져오는 쓴 물을 마시게 해야 합니다.[a] 그리고 저주를 가져오는 그 물이 그녀 안으로 들어가 쓰라림이 될 것입니다.[b]
  rationale: 마지막 결과절을 ‘쓰라림이 될 것입니다’로 고쳐 לְמָרִים의 결과적 의미를 유지하고, 물 자체가 단지 더 쓰게 된다는 오해를 피했습니다. 또한 ‘쓴 물’의 각주 위치를 해당 표현 뒤로 옮기고, 각주 대안의 한국어 표현을 자연스럽게 다듬었습니다.
