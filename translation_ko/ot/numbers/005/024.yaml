base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
  footnotes:
  - marker: a
    text: Or 'the water of bitterness that brings a curse.' The Hebrew uses 'waters' in the plural form, a common Hebrew expression for water.
    reason: lexical_alternative
  - marker: b
    text: Or 'the accursed water shall enter into her for bitterness.' The Hebrew can be rendered more formally, but the main text reflects the participle as describing the water's curse-bearing effect.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그 여인에게 저주를 가져오는 쓴 물을 마시게 해야 합니다.[a] 그리고 저주를 가져오는 그 물이 그녀 안으로 들어가 쓰라림이 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주를 가져오는 쓰라림의 물’로 옮길 수 있습니다. 히브리어는 ‘물들’이라는 복수형을 쓰는데, 이는 물을 가리키는 흔한 히브리어 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저주받은 물이 그녀 안으로 들어가 쓰라림이 될 것이다’로 옮길 수 있습니다. 히브리어는 더 형식적으로 옮길 수도 있으나, 본문은 분사를 통해 그 물이 저주를 가져오는 기능을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  english_pob_choice: make ... drink
  chosen_korean: 마시게 해야 합니다
  alternatives_korean:
  - 마시게 합니다
  - 마시도록 합니다
  - 마시게 해야 합니다
  lexicon: HALOT
  rationale: 히필형은 사역의 뜻을 가지므로, 한국어에서는 자연스럽게 ‘마시게 하다’로 옮겨 사역성을 살렸습니다.
- source_word: מֵי הַמָּרִים
  english_pob_choice: the bitter water
  chosen_korean: 쓴물
  alternatives_korean:
  - 쓴 물
  - 쓴 물들
  - 비통의 물
  lexicon: HALOT
  rationale: 히브리어의 ‘물들’이라는 복수형 관용을 한국어에서는 자연스러운 단수 개념인 ‘쓴물’로 옮겼습니다.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  english_pob_choice: that brings a curse / curse-bringing
  chosen_korean: 저주를 가져오는
  alternatives_korean:
  - 저주를 부르는
  - 저주를 내리는
  - 저주받은
  lexicon: HALOT
  rationale: 분사형은 물의 내재적 상태보다 저주를 매개하는 기능을 나타내므로, ‘저주를 가져오는’으로 기능적 의미를 살렸습니다.
- source_word: לְמָרִים
  english_pob_choice: into her bitterly / as bitterness
  chosen_korean: 쓴것이 됩니다
  alternatives_korean:
  - 쓴 것이 됩니다
  - 쓰게 됩니다
  - 쓰라움이 됩니다
  lexicon: HALOT
  rationale: 결과를 나타내는 ל를 반영하면서도, 물이 그녀 안에서 어떤 결과를 내는지 직설적으로 드러내기 위해 ‘쓴것이 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 저주 표현의 성격
  chosen_reading: 물을 ‘저주를 가져오는’ 것으로 번역해, 물 자체를 본질적으로 ‘저주받은’ 것으로 규정하지 않았습니다.
  alternative_readings:
  - 저주받은 물
  - 저주가 깃든 물
  rationale: 히브리어 분사는 의식에서 저주를 매개하는 기능을 나타내므로, 본문의 재판-의식적 긴장을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 원문 우선 원칙; 번역은 텍스트의 법적·의례적 기능을 보존해야 합니다.
