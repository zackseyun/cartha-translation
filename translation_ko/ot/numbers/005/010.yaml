  text: וְ/אִ֥ישׁ אֶת קֳדָשָׁ֖י/ו ל֣/וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר יִתֵּ֥ן לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
  footnotes:
  - marker: a
    text: Or, more literally, 'his holy things.' The phrase refers to items consecrated as sacred offerings.
    reason: lexical_alternative
  - marker: b
    text: 'The final ''his'' refers to the priest: whatever a man gives to the priest belongs to the priest.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 각 사람의 거룩한 예물은 그의 것이 되고, 사람이 제사장에게 주는 것은 제사장의 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 거룩한 것들’입니다. כאן의 קדשים은 거룩하게 구별된 제의적 예물들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 ‘그의’는 제사장을 가리킵니다. 곧 사람이 제사장에게 주는 것은 제사장에게 속합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: each man / a man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 사람마다
  lexicon: HALOT
  rationale: 법 조항의 분배적 용법을 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘각 사람’으로 옮겼습니다. 남성형 명사를 그대로 드러내는 번역도 가능하지만, 문맥상 규정의 적용 대상을 넓게 전달하는 것이 핵심입니다.
- source_word: קֳדָשָׁיו
  english_pob_choice: his holy gifts
  chosen_korean: 거룩한 예물
  alternatives_korean:
  - 그의 거룩한 것들
  - 성별된 것들
  - 거룩한 소유물
  lexicon: HALOT
  rationale: קדש의 제의적 의미를 살려 ‘거룩한 예물’로 옮겼습니다. 여기서는 ‘거룩한 것들’보다 제사·헌납 맥락이 분명한 표현이 더 적절합니다.
- source_word: לוֹ יִהְיוּ
  english_pob_choice: shall be his
  chosen_korean: 그의 것이 되고
  alternatives_korean:
  - 그의 것이 될 것입니다
  - 그에게 속할 것입니다
  lexicon: HALOT
  rationale: 소유 관계를 간명하게 나타내는 히브리어 관용을 한국어로 자연스럽게 풀어 ‘그의 것이 되고’로 옮겼습니다.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  english_pob_choice: whatever a man gives to the priest
  chosen_korean: 사람이 제사장에게 주는 것은
  alternatives_korean:
  - 사람이 제사장에게 주는 것이라면
  - 제사장에게 바치는 것은
  lexicon: HALOT
  rationale: 관계절의 일반적·포괄적 힘을 살려 ‘사람이 제사장에게 주는 것은’으로 옮겼습니다. ‘바치는’도 가능하지만, 본문은 헌납 일반과 단순한 ‘줌’ 모두를 포괄합니다.
theological_decisions:
- issue: 제사장에게 주는 예물의 소유 귀속
  chosen_reading: 마지막 ‘그의’는 제사장을 가리키므로, 제사장에게 주는 것은 제사장의 것이 됩니다.
  alternative_readings:
  - 첫 번째 절처럼 기증자에게 귀속되는 것으로 볼 수 있음
  - 지시 대상을 완전히 모호하게 유지함
  rationale: 히브리어는 마지막 절에서 소유 대명사 לוֹ가 제사장을 향하는 문맥을 가지므로, 독자가 오해하지 않도록 결과를 분명히 드러냈습니다.
  doctrine_reference: 제의법 문맥에서 헌납물의 소유권 규정
