base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
  footnotes:
  - marker: a
    text: Or, more literally, 'his holy things.' The phrase refers to items consecrated as sacred offerings.
    reason: lexical_alternative
  - marker: b
    text: 'The final ''his'' refers to the priest: whatever a man gives to the priest belongs to the priest.'
    reason: alternative_reading
translation:
  language: ko
  text: 또한 각 사람의 거룩한 예물들[a]은 그 사람의 것이 될 것입니다. 사람이 제사장에게 주는 것은 그 제사장의 것이 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 거룩한 것들’입니다. 여기서 ‘거룩한 것들’은 거룩하게 구별된 제의적 예물들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 마지막 ‘그에게’는 문맥상 제사장을 가리킵니다. 곧 사람이 제사장에게 주는 것은 제사장에게 속합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: each man / a man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 사람마다
  lexicon: HALOT
  rationale: 법 조항의 분배적 용법을 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘각 사람’으로 옮겼습니다. 남성형 명사를 그대로 드러내는 번역도 가능하지만, 문맥상 규정의 적용 대상을 넓게 전달하는 것이 핵심입니다.
- source_word: קֳדָשָׁיו
