  - severity: low
    issue: 각주 a에 한국어 문맥과 무관한 ‘כאן’가 포함되어 있습니다.
    rationale: 명백한 언어 혼입/편집 오류이므로 ‘여기서’로 고쳐야 합니다.
  - severity: low
