source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
  footnotes:
  - marker: a
    text: Or 'redeemer' or 'next of kin.' The Hebrew גֹּאֵל refers to a family member with legal responsibility in matters of redemption or restitution.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew אָשָׁם here refers to restitution or compensation for guilt, not to the ram itself; the ram is mentioned separately afterward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 사람에게 그 죄에 대한 배상을 돌려줄 친족 구속자가 없으면, 야훼께 돌려지는 그 죄에 대한 배상은, 그를 위하여 속죄하는 데 쓰는 속죄의 숫양 외에, 제사장의 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구속자’, ‘가까운 친족’. 히브리어 גֹּאֵל은 구속이나 배상 문제에서 법적 책임을 지는 가족 구성원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָשָׁם은 여기서 숫양 자체가 아니라 죄에 대한 배상 또는 보상을 가리킵니다. 숫양은 뒤에서 따로 언급됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  english_pob_choice: kinsman-redeemer
  chosen_korean: 친족 구속자
  alternatives_korean:
  - 구속자
  - 친족 상속인
  - 친족
  lexicon: HALOT
  rationale: 가족 관계와 법적 책임을 함께 드러내기 위해 ‘친족’과 ‘구속자’를 결합했습니다. ‘구속자’만으로는 관계성이 약하고, ‘친족’만으로는 법적 책임이 약합니다.
- source_word: הָאָשָׁם הַמּוּשָׁב
  english_pob_choice: the restitution for the guilt that is returned
  chosen_korean: 그 보상은
  alternatives_korean:
  - 그 배상은
  - 그 속건은
  - 그 죄값의 배상은
  lexicon: HALOT
  rationale: 이 절에서 אָשָׁם은 제물 명칭이 아니라 반환되는 배상금을 가리키므로, 문맥에 맞게 간결하게 ‘보상’으로 옮겼습니다. 이어지는 ‘돌려지는’이 반환 행위를 드러냅니다.
- source_word: לַיהוָה לַכֹּהֵן
  english_pob_choice: to Yahweh belongs to the priest
  chosen_korean: 야훼께 돌려지는 그 보상은 제사장의 것이 됩니다
  alternatives_korean:
  - 여호와께 속한 그 보상은 제사장의 것입니다
  - 야훼께 드려진 그 보상은 제사장에게 돌아갑니다
  lexicon: HALOT
  rationale: 히브리어의 소유·귀속 관계를 한국어에서 자연스럽게 풀어, 먼저 야훼께 귀속된 뒤 제사장에게 배정되는 뜻을 살렸습니다.
- source_word: אֵיל הַכִּפֻּרִים
  english_pob_choice: the ram of atonement
  chosen_korean: 속죄의 숫양
  alternatives_korean:
  - 속죄 숫양
  - 속죄를 위한 숫양
  - 속죄제 숫양
  lexicon: HALOT
  rationale: 제의적 기능을 유지하면서도 현대 한국어에서 자연스럽고 간결하게 들리도록 ‘속죄의 숫양’으로 옮겼습니다.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  english_pob_choice: by which atonement is made for him
  chosen_korean: 그것으로 그의 죄를 속합니다
  alternatives_korean:
  - 그것으로 그를 위해 속죄합니다
  - 그것으로 그를 속죄하게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 수동적·의례적 표현을 한국어에서는 제의 행위를 분명히 하되 지나치게 기술적으로 만들지 않도록 옮겼습니다.
theological_decisions:
- issue: '이중 의무: 배상과 속죄 제물의 구분'
  chosen_reading: 배상금과 속죄의 숫양은 서로 다른 항목이며, 둘 다 필요합니다.
  alternative_readings:
  - 배상금 자체가 속죄 제물로 읽힐 수 있습니다
  rationale: 본문의 ‘그 밖에’가 배상과 숫양을 명확히 구별하므로, 세속적 배상과 제의적 속죄를 혼동하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트의 표준에 따라 יהוה는 ‘야훼’로 옮겼습니다. 본문은 야훼께 귀속된 배상이라는 법적·제의적 관계를 보입니다.
  doctrine_reference: 'Contested terms: יהוה YHWH'
