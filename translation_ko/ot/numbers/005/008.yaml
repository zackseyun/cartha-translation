revisions:
- from: 그러나 만일 그 사람에게 그 보상을 그에게 돌려줄 친족 구속자가 없으면, 야훼께 돌려지는 그 보상은 제사장의 것이 됩니다.[a][b] 속죄의 숫양은 그 밖에 덧붙입니다. 그것으로 그의 죄를 속합니다.
  to: 그러나 그 사람에게 그 죄에 대한 배상을 돌려줄 친족 구속자가 없으면, 야훼께 돌려지는 그 죄에 대한 배상은, 그를 위하여 속죄하는 데 쓰는 속죄의 숫양 외에, 제사장의 것입니다.[a][b]
  rationale: 원문의 조건문과 귀속 관계를 유지하면서, 배상금이 야훼께 돌려져 제사장에게 귀속된다는 뜻을 명확히 했습니다. ‘속죄의 숫양 외에’를 배상금과 숫양의 구별을 나타내는 원래의 통사 기능에 맞게 배치하고, 숫양이 그 사람을 위한 속죄에 사용됨을 자연스러운 한국어로 표현했습니다.
