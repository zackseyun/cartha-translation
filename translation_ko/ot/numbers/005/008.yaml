  source_fidelity: 핵심 법적·제의적 구분과 친족 구속자 개념은 대체로 반영했지만, ‘그 밖에 덧붙입니다’는 מִלְּבַד(‘~ 외에/별도로’)의 관계를 잘못 옮겼고, 속죄 행위의 수단인 숫양을 문장상 독립된 추가 진술로 처리하여 원문의 통사 관계를 훼손합니다. 또한 אָשָׁם은 단순한 일반 ‘보상’보다 죄와 관련된 배상임을 본문에서 밝혀 주는 편이 정확합니다.
  naturalness: ‘속죄의 숫양은 그 밖에 덧붙입니다’는 현대 표준 한국어로 부자연스럽고 의미도 불명확합니다. ‘그에게 그 보상을 그에게’는 동일한 대명사의 지시 대상이 혼동될 수 있으므로, 반환받을 대상을 ‘그 사람에게’로 명시하는 것이 자연스럽습니다.
  terminology: ‘친족 구속자’, ‘속죄의 숫양’은 문맥상 수용 가능합니다. YHWH는 제공된 프로젝트 표준 및 초안의 용례에 맞추어 ‘야훼’로 유지합니다. אָשָׁם은 숫양과 구별되는 배상임을 반영하여 ‘죄에 대한 배상’으로 옮깁니다.
