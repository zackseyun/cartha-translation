  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
  footnotes:
  - marker: a
    text: Or 'their camp'; the Hebrew has the plural 'their camps,' possibly referring to the camp's divisions or encampments.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the midst of which I dwell.' The Hebrew may refer either to the camps or to the people associated with them.
    reason: alternative_reading
translation:
  language: ko
  text: 남자에서 여자에 이르기까지, 너희는 그들을 진영 밖으로 내보내야 합니다[a]. 너희는 그들을 내보내어 그들이 자기들의 진영들[b]을 더럽히지 못하게 해야 합니다. 그 진영들 한가운데에 내가 거주하고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 진영’. 히브리어는 복수형 ‘그들의 진영들’을 가지며, 진영의 구획이나 여러 야영지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 한가운데에 내가 거주한다’. 히브리어는 진영들을 가리키는지, 그와 연관된 백성을 가리키는지 둘 다 가능할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  english_pob_choice: From male to female
  chosen_korean: 남자에서 여자에 이르기까지
  alternatives_korean:
  - 남자와 여자 모두
  - 남자부터 여자까지
  lexicon: HALOT
  rationale: 히브리어가 전체 범위를 포괄적으로 표시하므로, 한국어에서는 성별의 양끝을 드러내는 범위 표현으로 옮겼습니다.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  english_pob_choice: you shall send them ... you shall send them out
  chosen_korean: 내보내야 합니다 / 내보내어
  alternatives_korean:
  - 쫓아내야 합니다
  - 보내야 합니다
  lexicon: HALOT
  rationale: 반복된 사역형 שלח의 강조를 살리면서도, 진영 밖으로의 배제를 뜻하는 문맥에 맞게 자연스럽고 과도하지 않게 옮겼습니다.
- source_word: יְטַמְּאוּ
  english_pob_choice: they may not defile
  chosen_korean: 더럽히지 못하게
  alternatives_korean:
  - 부정하게 하지 못하게
  - 오염시키지 못하게
  lexicon: HALOT
  rationale: 제의적 정결 문맥의 טמא는 단순한 오염보다 ‘더럽히다/부정하게 하다’의 의미가 강하므로, 한국어에서 가장 직접적인 표현을 택했습니다.
- source_word: מַחֲנֵיהֶם
  english_pob_choice: their camp[s]
  chosen_korean: 자기들의 진영들
  alternatives_korean:
  - 자기들의 진영
  - 그들의 진영
  lexicon: HALOT
  rationale: 히브리어 복수형과 POB의 ‘their camps’ 취지를 반영하여 복수를 살렸습니다. 단수로 평탄화하면 본문이 암시하는 진영의 분할 가능성이 약해집니다.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  english_pob_choice: in whose midst I dwell
  chosen_korean: 그 진영들 한가운데에 내가 거주하고 있기 때문입니다
  alternatives_korean:
  - 내가 그들 한가운데 거주하기 때문입니다
  - 내가 그들 가운데 거하므로
  lexicon: HALOT
  rationale: שכן은 언약적 임재의 ‘거주하다’라는 뜻을 살리되, 한국어에서는 문장 흐름상 이유절로 자연스럽게 연결했습니다.
theological_decisions:
- issue: ‘진영들’의 복수와 하나님의 임재의 대상
  chosen_reading: 복수형 ‘진영들’을 유지하여, 하나님이 이스라엘의 공동체적 구획들 한가운데 거주하시는 성막-진영 구조를 드러냈습니다.
  alternative_readings:
  - ‘진영’ 단수로 통합
  - ‘그들’ 가운데 내가 거주한다
  rationale: 히브리어 복수형과 POB의 마찰을 지우지 않고 보존하는 쪽이 본문의 제의적·공동체적 긴장을 더 잘 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it
