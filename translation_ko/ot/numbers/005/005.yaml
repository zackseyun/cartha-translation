- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 언약의 신적 이름인 יְהוָה를 한국어 전통 대체어인 '여호와'나 호칭인 '주님'이 아니라, POB의 원칙에 따라 고유명 '야훼'로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
