  - -한테
  lexicon: HALOT
  rationale: 대상 표지 אֶל은 여기서 발화의 수신자를 나타내므로, 현대 표준어의 중립적 조사 '-에게'로 처리했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 말씀하시며
  - 이르기를
  lexicon: HALOT
  rationale: לֵאמֹר는 다음 구절로 이어지는 인용 도입 공식이므로, 한국어에서는 별도의 '말하여 이르시다' 구조 안에 흡수해 중복을 피하면서도 인용 개시 기능을 보존했습니다.
