lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 이르셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: וַיְדַבֵּר는 단순 발화보다 공식적인 신적 발화 서두를 여는 동사이므로, 한국어에서는 '말씀하여 이르셨습니다'로 옮겨 이어지는 직접 계시 공식을 자연스럽게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 언약의 신적 이름인 יְהוָה를 한국어 전통 대체어인 '여호와'나 호칭인 '주님'이 아니라, POB의 원칙에 따라 고유명 '야훼'로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - -께
  - -한테
  lexicon: HALOT
  rationale: 대상 표지 אֶל은 여기서 발화의 수신자를 나타내므로, 현대 표준어의 중립적 조사 '-에게'로 처리했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 말씀하시며
  - 이르기를
  lexicon: HALOT
  rationale: לֵאמֹר는 다음 구절로 이어지는 인용 도입 공식이므로, 한국어에서는 별도의 '말하여 이르시다' 구조 안에 흡수해 중복을 피하면서도 인용 개시 기능을 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 하나님의 고유명 יהוה를 직접 사용하므로, 전통적 대체어보다 계시된 이름 자체를 드러내는 '야훼'를 유지하는 것이 본문 의미와 POB의 신학적 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
