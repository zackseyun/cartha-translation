  source_fidelity: 'יַדַבֵּר ... לֵאמֹר is a conventional divine-speech introduction: Yahweh spoke to Moses, introducing the words that follow. The draft conveys the participants and divine speech, but its paired verbs do not naturally represent the formula in modern Korean.'
  naturalness: “말씀하여 이르셨습니다” is an archaizing, redundant verb sequence and is awkward with a final 합쇼체 sentence ending. “이렇게 말씀하셨습니다” is natural modern formal-polite Korean and clearly introduces the following speech.
  terminology: “야훼” appropriately preserves יהוה as the divine personal name, and “모세” is standard. “말씀하셨습니다” suitably renders the formal divine speech verb.
