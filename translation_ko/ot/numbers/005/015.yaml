id: NUM.5.15
reference: Numbers 5:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
  footnotes:
  - marker: a
    text: Or 'a remembrance offering'; the Hebrew phrase may also be rendered more literally as 'an offering of remembrance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bringing guilt to remembrance'; the Hebrew עָוֹן can denote iniquity, guilt, or the liability arising from wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그 남자는 자기 아내를 제사장에게 데려오고, 그녀를 위한 예물을 드릴 것입니다. 그것은 보리 가루 한 에바의 십분의 일입니다. 그 위에 기름을 붓지 말고, 유향도 놓지 마십시오. 그것은 질투의 곡식 제물이며, 죄악을 기억나게 하는 기억 제물입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기억 제물’. 히브리어 표현은 더 문자적으로 ‘기억의 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄책을 기억나게 하는’. 히브리어 עָוֹן은 죄악, 죄책, 또는 잘못으로 인한 책임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת אִשְׁתּוֹ אֶל הַכֹּהֵן
  english_pob_choice: Then the man shall bring his wife to the priest
  chosen_korean: 그러면 그 남자는 자기 아내를 제사장에게 데려오고
  alternatives_korean:
  - 그 남자는 자기 아내를 제사장에게 데리고 가고
  - 남편은 아내를 제사장에게 데려오고
  lexicon: WLC / HALOT
  rationale: 법률·의례 문맥의 인도형 동사를 한국어로는 ‘데려오고’로 자연스럽게 옮기되, מקור의 ‘그 남자’와 관계를 분명히 유지했습니다.
- source_word: קָרְבָּנָהּ / עָלֶיהָ
  english_pob_choice: her offering for her
  chosen_korean: 그녀를 위한 예물을 드릴 것입니다
  alternatives_korean:
  - 그녀의 예물을 드릴 것입니다
  - 그녀를 위한 제물을 드릴 것입니다
  lexicon: HALOT
  rationale: ‘her offering’과 ‘for her’의 이중 관계를 살리기 위해 소유와 대리의 뉘앙스를 함께 담는 ‘그녀를 위한 예물’로 옮겼습니다.
- source_word: קֶמַח שְׂעֹרִים
  english_pob_choice: barley flour
  chosen_korean: 보리 가루
  alternatives_korean:
  - 보릿가루
  - 보리 밀가루
  lexicon: HALOT
  rationale: 히브리어의 곡물 가루를 현대 한국어로 가장 무리 없이 드러내는 표현은 ‘보리 가루’이며, 제의 재료라는 점도 잘 보존합니다.
- source_word: מִנְחַת קְנָאֹת
  english_pob_choice: a grain offering of jealousy
  chosen_korean: 질투의 곡식 제물
  alternatives_korean:
  - 질투의 소제
  - 질투 제물
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 의미를 ‘곡식 제물’로 살리고, קְנָאֹת의 핵심 감정어를 직역해 의례의 성격을 흐리지 않게 했습니다.
- source_word: מִנְחַת זִכָּרוֹן מַזְכֶּרֶת עָוֺן
  english_pob_choice: a memorial offering that brings iniquity to remembrance
  chosen_korean: 기억 제물입니다 — 죄악을 기억나게 하는
  alternatives_korean:
  - 기념 제물입니다 — 죄악을 떠올리게 하는
  - 기억 제물입니다 — 죄를 기억나게 하는
  lexicon: HALOT
  rationale: זִכָּרוֹן과 participle מַזְכֶּרֶת의 기억/회상 기능을 살려 ‘기억 제물’과 ‘기억나게 하는’으로 대응했고, עָוֹן은 ‘죄악’으로 번역해 책임의 무게를 유지했습니다.
theological_decisions:
- issue: 제물의 기능이 죄를 전제하는지, 혹은 기억만 촉발하는지
  chosen_reading: 번역은 이 의례가 ‘죄악을 기억나게 하는’ 기능을 갖는다는 점만 드러내고, 여성의 유죄 여부는 여기서 단정하지 않습니다.
  alternative_readings:
  - 여성의 유죄를 전제하는 제물로 읽기
  - 단순 상징물로 약화해 읽기
  rationale: 본문은 제물의 구성과 목적을 설명할 뿐 판결을 내리지 않으므로, 해석상의 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
