  rationale: 법률·의례 문맥의 지시적 힘을 현대 한국어 합쇼체의 ‘-아야 합니다/-해서는 안 됩니다’로 일관되게 옮겼습니다. 제물의 양과 재료를 제물 동사에 직접 연결하고, 각주 a가 본문과 중복되지 않도록 ‘기념 제물/기억 제물’을 구별했습니다. 여성의 유죄 여부에 관한 어떠한 판단도 번역에 추가하지 않았습니다.
