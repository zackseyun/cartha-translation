- from: 그러면 그 남자는 자기 아내를 제사장에게 데려오고, 그녀를 위한 예물을 드릴 것입니다. 그것은 보리 가루 한 에바의 십분의 일입니다. 그 위에 기름을 붓지 말고, 유향도 놓지 마십시오. 그것은 질투의 곡식 제물이며, 죄악을 기억나게 하는 기억 제물입니다.[a][b]
