  lexicon: HALOT
  rationale: ‘sons of Israel’을 ‘이스라엘 자손’으로 살리고, 출처·범위를 나타내는 ‘가운데서’로 자연스럽게 옮겼습니다.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  english_pob_choice: from the clan of her father's tribe
  chosen_korean: 자기 아버지의 지파에 속한 가족
  alternatives_korean:
  - 자기 아버지의 지파에 속한 종족
  - 자기 아버지 지파의 가족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파보다 작은 친족 단위를 가리키므로 ‘가족’보다는 ‘가문/씨족’도 가능하지만, 현대 한국어의 이해도를 위해 ‘지파에 속한 가족’으로 풀었습니다.
- source_word: תִּהְיֶה לְאִשָּׁה
  english_pob_choice: shall become the wife
  chosen_korean: 아내가 되어야 합니다
  alternatives_korean:
