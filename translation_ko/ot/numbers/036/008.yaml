  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
  footnotes:
  - marker: a
    text: Or 'inherits an inheritance' / 'is inheriting property'; the Hebrew participle can emphasize the daughter’s status as an heiress.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'family of her father's tribe'; Hebrew mishpachah denotes a clan-level kinship group within the tribe.
    reason: lexical_alternative
  - marker: d
    text: Or 'may inherit, each one, the inheritance of his fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손의 지파들 가운데서 유산을 이어받는[a] 딸은 자기 아버지의 지파에 속한 가족[b] 중 하나의 아내가 되어야 합니다. 그리하여 이스라엘 자손이 각각 조상들의 유산을 물려받게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유산을 상속하는’ / ‘상속 재산을 이어받는’. 히브리어 분사는 딸의 현재적 상속 지위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 아버지의 지파에 속한 씨족’. 히브리어 미슈파하흐는 지파 내부의 더 작은 친족 단위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת
  english_pob_choice: inherits an inheritance / possesses an inheritance
  chosen_korean: 유산을 이어받는
  alternatives_korean:
  - 유산을 소유한
  - 유산을 상속받는
  lexicon: HALOT
  rationale: 분사형이 가리키는 법적 상태를 살리되, 한국어에서는 ‘이어받는’이 소유·상속의 상태를 자연스럽게 드러냅니다.
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 기업
  - 분배지
  lexicon: HALOT
  rationale: 지파 간 토지 상속 문맥이지만, 한국어에서는 반복을 피하면서도 법적 상속 개념을 담는 ‘유산’이 자연스럽습니다.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the tribes of the sons of Israel
  chosen_korean: 이스라엘 자손의 지파들 가운데서
  alternatives_korean:
  - 이스라엘의 지파들 가운데서
  - 이스라엘 자손의 지파들에서
  lexicon: HALOT
  rationale: ‘sons of Israel’을 ‘이스라엘 자손’으로 살리고, 출처·범위를 나타내는 ‘가운데서’로 자연스럽게 옮겼습니다.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  english_pob_choice: from the clan of her father's tribe
  chosen_korean: 자기 아버지의 지파에 속한 가족
  alternatives_korean:
  - 자기 아버지의 지파에 속한 종족
  - 자기 아버지 지파의 가족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파보다 작은 친족 단위를 가리키므로 ‘가족’보다는 ‘가문/씨족’도 가능하지만, 현대 한국어의 이해도를 위해 ‘지파에 속한 가족’으로 풀었습니다.
- source_word: תִּהְיֶה לְאִשָּׁה
  english_pob_choice: shall become the wife
  chosen_korean: 아내가 되어야 합니다
  alternatives_korean:
  - 아내가 될 것입니다
  - 결혼해야 합니다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 법적 의무를 분명히 하기 위해 ‘아내가 되어야 합니다’로 옮겼습니다.
- source_word: יִירְשׁוּ
  english_pob_choice: may each possess / may each inherit
  chosen_korean: 물려받게 하려는 것입니다
  alternatives_korean:
  - 상속받게 하려는 것입니다
  - 이어받게 하려는 것입니다
  lexicon: HALOT
  rationale: 동사의 유산 상속 의미를 살리되, 뒤의 ‘조상들의 유산’과의 중복을 줄이기 위해 ‘물려받게 하다’로 풀었습니다.
theological_decisions:
- issue: 남성형 집단명과 부계 상속 구조의 보존
  chosen_reading: ‘이스라엘 자손’과 ‘조상들의 유산’을 그대로 유지하고, 이를 성별 중립적으로 바꾸지 않았습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 조상의 유산
  rationale: 이 절은 부계 상속과 지파 보전을 다루는 법조문이므로, 원문의 친족·상속 구조를 흐리지 않는 것이 중요합니다.
  doctrine_reference: 'Translation philosophy: source-form sensitivity in legal/covenantal texts'
