  naturalness: ‘자기 아버지의 지파에 속한 씨족 가운데 한 사람의 아내’는 현대 표준 한국어에서 자연스럽고 원문의 친족 단위도 분명히 합니다. 목적절은 ‘저마다 자기 조상들의 유산을 차지하게’로 옮기면 אִישׁ의 분배적 용법과 ירשׁ의 토지 보유 의미를 매끄럽게 살릴 수 있습니다.
  terminology: נַחֲלָה는 ‘유산’으로 일관되게 유지할 수 있습니다. יֹרֶשֶׁת는 법적 상속자 신분을 나타내므로 ‘유산을 상속받는’으로, מִשְׁפָּחָה는 지파보다 작은 친족 단위인 ‘씨족’으로 수정합니다. ‘이스라엘 자손’과 ‘조상들의 유산’은 원문의 법적·부계 친족 언어를 적절히 보존합니다.
