revisions:
- from: 그리고 이스라엘 자손의 지파들 가운데서 유산을 이어받는[a] 딸은 자기 아버지의 지파에 속한 가족[b] 중 하나의 아내가 되어야 합니다. 그리하여 이스라엘 자손이 각각 조상들의 유산을 물려받게 하려는 것입니다.
  to: 이스라엘 자손의 지파들 가운데서 유산을 상속받는[a] 모든 딸은 자기 아버지 지파의 씨족[b] 가운데 한 사람의 아내가 되어야 합니다. 이는 이스라엘 자손이 저마다 자기 조상들의 유산을 차지하게 하려는 것입니다.
  rationale: 배우자 대상이 ‘아버지 지파의 씨족 가운데 한 사람’임을 명확히 하여 히브리어의 수식 관계를 바로잡았습니다. ‘씨족’으로 지파와 하위 친족 단위를 구별하고, 목적절은 분배적 표현과 토지 상속·보유의 법적 의미를 더 자연스럽게 반영하도록 다듬었습니다.
