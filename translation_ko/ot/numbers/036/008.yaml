  - 결혼해야 합니다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 법적 의무를 분명히 하기 위해 ‘아내가 되어야 합니다’로 옮겼습니다.
- source_word: יִירְשׁוּ
  english_pob_choice: may each possess / may each inherit
  chosen_korean: 물려받게 하려는 것입니다
  alternatives_korean:
  - 상속받게 하려는 것입니다
  - 이어받게 하려는 것입니다
  lexicon: HALOT
  rationale: 동사의 유산 상속 의미를 살리되, 뒤의 ‘조상들의 유산’과의 중복을 줄이기 위해 ‘물려받게 하다’로 풀었습니다.
