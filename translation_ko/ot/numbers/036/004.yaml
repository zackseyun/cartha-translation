source:
  edition: WLC
  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
  footnotes:
  - marker: a
    text: Or 'for the Israelites' or traditionally 'for the children of Israel.' The Hebrew reads 'for the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 희년이 이스라엘 자손에게[a] 이르면, 그들의 상속 몫이 그들이 속한 지파의 상속 몫에 더해지고, 그들의 상속 몫은 우리 조상들의 지파 상속 몫에서 감해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들에게’, 전통적으로는 ‘이스라엘 자손에게’라고도 할 수 있습니다. 히브리어는 직역하면 ‘이스라엘의 아들들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם / יִהְיֶה הַיֹּבֵל
  english_pob_choice: And when the Jubilee comes
  chosen_korean: 그리고 희년이 … 이르면
  alternatives_korean:
  - 그리고 희년이 오면
  - 그리고 희년이 생기면
  lexicon: HALOT
  rationale: 조건문의 법적 전망을 살려 직역적 ‘그리고 만일’보다, 실제 도래를 예고하는 ‘이르면’으로 자연스럽게 옮겼습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 사람들에게
  - 이스라엘의 자녀들에게
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 살려 ‘자손’으로 옮기고, 남성복수의 문법을 무리하게 중화하지 않았습니다.
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 상속 몫
  alternatives_korean:
  - 기업
  - 유업
  - 상속
  lexicon: HALOT
  rationale: 이 문맥의 נַחֲלָה는 토지 분배의 몫을 가리키므로, 교회적 어감의 ‘기업’보다 법적·분배적 성격이 드러나는 ‘상속 몫’을 택했습니다.
- source_word: וְנוֹסְפָה ... עַל
  english_pob_choice: will be added to
  chosen_korean: 더해지고
  alternatives_korean:
  - 덧붙여지고
  - 추가되고
  lexicon: HALOT
  rationale: 추가·편입의 뜻을 간결하게 살리되, 한국어 법문체에서 자연스러운 서술형으로 정리했습니다.
- source_word: יִגָּרַע
  english_pob_choice: will be taken away
  chosen_korean: 감해질 것입니다
  alternatives_korean:
  - 빼앗길 것입니다
  - 줄어들 것입니다
  - 제거될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 상실보다 ‘감소/차감’의 의미가 강하므로, 분배 몫의 법적 감소를 드러내는 ‘감해질’로 옮겼습니다.
theological_decisions:
- issue: 희년을 제도적 사건으로 어떻게 처리할지
  chosen_reading: ‘희년이 … 이르면’로 옮겨, 특정 시점에 도래하는 율법적 사건임을 드러냈습니다.
  alternative_readings:
  - 희년이 올 때
  - 희년이 생길 때
  rationale: 본문은 윤리적 원칙이 아니라 토지 상속을 조정하는 율법 조항이므로, 시간적 도래를 분명히 하는 번역이 적절합니다.
  doctrine_reference: 민수기 36장 토지 분배 규례
- issue: 남성복수 ‘sons of Israel’의 처리
  chosen_reading: ‘이스라엘 자손’으로 옮겨, 원문의 계보·언약적 집단 표현을 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 본문의 법적·가문적 맥락에서는 중립화보다 혈통적/언약적 범주를 드러내는 표현이 더 정확합니다.
  doctrine_reference: 언약 공동체와 지파 상속 규례
