  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
  footnotes:
  - marker: a
    text: Or “children of Israel” or “Israelites.” The Hebrew reads “sons of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. 「야훼께서 내 주께 땅을 이스라엘 자손에게 기업으로 제비 뽑아 주라고 명령하셨고, 내 주는 야훼께서 우리 형제 슬로브핫의 기업을 그의 딸들에게 주라고 명령받았습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 「이스라엘의 아들들」입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 내 주인
  - 나의 주인
  lexicon: HALOT
  rationale: 사람에게 대한 정중한 호칭이므로, 권위와 예우를 살리는 「내 주」가 적절하며, 「주인」은 종속 뉘앙스가 강해 문맥보다 거칠게 들릴 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 철자를 직접 반영하기 위해 관례적 대치어 「주」가 아니라 고유명 「야훼」로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 보존하면서도 한국어에서는 관용적인 성경 표현인 「이스라엘 자손」이 가장 자연스럽습니다.
- source_word: בְּגוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비 뽑아
  alternatives_korean:
  - 제비로
  - 제비를 뽑아
  lexicon: HALOT
  rationale: 분배 절차를 나타내는 표현이므로 결과보다 방식을 드러내는 동사구 「제비 뽑아」가 간결하고 분명합니다.
- source_word: נַחֲלַת צְלָפְחָד
  english_pob_choice: the inheritance of Zelophehad
  chosen_korean: 슬로브핫의 기업
  alternatives_korean:
  - 슬로브핫의 상속분
  - 슬로브핫의 유업
  lexicon: HALOT
  rationale: 문맥상 토지 상속분을 가리키므로 「기업」이 법적·언약적 의미를 함께 살리고, 인명 관계도 자연스럽게 드러냅니다.
theological_decisions:
- issue: 신명사와 인간 호칭의 구분
  chosen_reading: 야훼께서 내 주께… / 내 주는 야훼께서…
  alternative_readings:
  - 주께서 내 주께…
  - 여호와께서 내 주께…
  rationale: 본문은 신명사 יְהוָה와 인간 대상 אֲדֹנִי를 함께 사용하므로, 둘을 모두 「주」로 평준화하지 않고 구분해 번역해야 원문의 대조가 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
