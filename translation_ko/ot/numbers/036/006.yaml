  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
  footnotes:
  - marker: a
    text: Or, 'to whomever they think best.' The Hebrew idiom is literally 'to the good in their eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'within the clan of their father's tribe.' The Hebrew combines family/clan and tribe terminology to stress that the inheritance must remain within the paternal tribal line.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 슬로브핫의 딸들에 관하여 명하신 말씀입니다. 곧 「그들이 자기들 보기에 좋은 사람의 아내가 될 수 있습니다[a]. 그러나 오직 그들의 아버지 지파에 속한 씨족 안에서만 아내가 되어야 합니다[b]」라고 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 눈에 좋은 이에게’입니다. 히브리어 관용구로, ‘그들이 좋다고 여기는 사람에게’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 아버지 지파의 가족/씨족’이라는 표현을 사용합니다. 이는 상속 재산이 아버지 쪽 지파 안에 남도록 하는 친족·지파상의 제한을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  english_pob_choice: This is the word
  chosen_korean: 이것은 ... 말씀입니다
  alternatives_korean:
  - 이것은 ... 일입니다
  - 이것은 ... 사건입니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘일’보다 권위 있는 선언·판결의 성격이 강하므로, 합쇼체에서 자연스럽고 엄숙한 ‘말씀’으로 옮겼습니다.
- source_word: צִוָּה יְהוָה
  english_pob_choice: Yahweh has commanded
  chosen_korean: 야훼께서 ... 명하신
  alternatives_korean:
  - 야훼께서 ... 명령하신
  - 주님께서 ... 명하신
  lexicon: HALOT
  rationale: צוה의 명령/지시를 ‘명하다’로 직접 살렸고, יְהוָה는 이 프로젝트 기준에 따라 ‘야훼’로 옮겨 신명 자체를 보존했습니다.
- source_word: לִבְנוֹת צְלָפְחָד
  english_pob_choice: concerning the daughters of Zelophehad
  chosen_korean: 슬로브핫의 딸들에 관하여
  alternatives_korean:
  - 슬로브핫의 딸들에게
  - 슬로브핫의 딸들을 두고
  lexicon: HALOT
  rationale: ל־는 단순 수신자 표지보다 ‘관하여/대하여’의 범위를 나타내므로, 명령의 대상이자 주제가 되는 점을 함께 드러내는 표현을 택했습니다.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  english_pob_choice: to whomever seems good in their eyes
  chosen_korean: 자기들의 눈에 좋은 사람에게
  alternatives_korean:
  - 자기들이 좋다고 여기는 사람에게
  - 자기들 보기에 좋은 사람에게
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 좋다’를 지나치게 해석하지 않고 유지했습니다. 영어 POB의 각주가 제시한 ‘whomever they think best’의 의미는 본문 안에서 자연스럽게 드러나도록 처리했습니다.
- source_word: תִּהְיֶינָה לְנָשִׁים
  english_pob_choice: Let them become wives / they must become wives
  chosen_korean: 아내가 되게 하되
  alternatives_korean:
  - 아내가 되게 하되
  - 아내로 삼되
  - 아내가 되도록 하되
  lexicon: HALOT
  rationale: ‘let them be for wives’의 predicative 힘을 살리면서도 한국어에서는 가장 자연스럽게 규정적 허용을 나타내는 ‘아내가 되게 하다’로 옮겼습니다.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  english_pob_choice: within the family of the tribe of their father
  chosen_korean: 그들의 아버지 지파의 가족 안에서만
  alternatives_korean:
  - 그들의 아버지 지파의 가족 안에서
  - 그 아버지 지파의 가문 안에서만
  - 그들의 아버지 지파의 씨족 안에서만
  lexicon: HALOT
  rationale: מִשְׁפָּחָה와 מַטֶּה의 중첩된 친족·지파 제한을 모두 살리기 위해 ‘가족’과 ‘지파’를 함께 보존했습니다. ‘만’으로 제한성을 명확히 했습니다.
theological_decisions:
- issue: 야훼의 직접 명령을 한국어에서 어떻게 표현할지
  chosen_reading: 서술형 본문 속에서 ‘야훼께서 ... 명하신 말씀’으로 표현해, 원문의 법적·권위적 성격을 유지했습니다.
  alternative_readings:
  - ‘주께서 ... 명하신’
  - ‘하나님께서 ... 명령하신’
  rationale: 이 절은 단순 정보 전달이 아니라 규정 선포입니다. ‘명하다’는 법령적 어조를 보존하면서도 현대 한국어에서 자연스럽습니다.
  doctrine_reference: Numbers 36 context; divine command language
- issue: 히브리어 관용구 ‘눈에 좋다’의 처리
  chosen_reading: 본문에는 직역적 표지를 유지하고, 각주로 관용구 의미를 보충했습니다.
  alternative_readings:
  - 의역하여 ‘마음에 드는 사람’
  - ‘좋다고 생각하는 사람’
  rationale: 관용을 완전히 한국식으로 바꾸면 원문의 표현력이 약해질 수 있으므로, 본문은 원형을 살리고 독자 이해는 각주로 돕는 방식이 가장 균형적입니다.
  doctrine_reference: 'Translation philosophy: source transparency'
