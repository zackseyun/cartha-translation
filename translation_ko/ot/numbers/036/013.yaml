  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel'; this covenant expression refers to the people of Israel collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the Jordan opposite Jericho.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼께서 모세를 통하여 이스라엘 자손에게 모압 평지, 곧 여리고 맞은편 요단강 가에서 명하신 계명과 법규입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 문자적으로 ‘이스라엘의 아들들’이지만, 이스라엘 언약 공동체 전체를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여리고 곁 요단강 가에서’로 옮길 수 있습니다.
    reason: alternative_reading
