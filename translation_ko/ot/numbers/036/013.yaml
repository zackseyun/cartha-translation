  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel'; this covenant expression refers to the people of Israel collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the Jordan opposite Jericho.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것들은 야훼께서 모세의 손을 통해 이스라엘 자손에게 모압 평지, 곧 여리고 맞은편 요단 가에서 명령하신 계명과 규례입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 문자적으로는 ‘이스라엘의 아들들’이지만, 언약 공동체 전체를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여리고 맞은편 요단 건너편’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 계명
  alternatives_korean:
  - 명령
  - 규례
  lexicon: HALOT
  rationale: 법적·언약적 문맥에서 מִצְוֹת은 단순한 지시보다 규범적 명령을 가리키므로, 한국어에서는 익숙하면서도 권위가 살아 있는 ‘계명’으로 옮겼습니다.
- source_word: וְהַמִּשְׁפָּטִים
  english_pob_choice: and the judgments
  chosen_korean: 규례
  alternatives_korean:
