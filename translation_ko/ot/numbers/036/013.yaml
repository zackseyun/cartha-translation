  - 판례
  - 법도
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 여기서 법정 판결보다 공동체를 위한 규범/법규의 뜻이 강하므로, 현대 한국어에서 오해가 적은 ‘규례’로 옮겼습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세를 거쳐
  - 모세의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손을 통해/손으로’의 매개성을 드러내기 위해 직역을 살리되, 한국어 문장 안에서 자연스럽도록 ‘통해’를 덧붙였습니다.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 백성에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 직역의 남성 표지를 보존하면서도, 본문의 언약적 집합체를 한국어로 자연스럽게 드러내는 표준 번역인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: עַרְבֹת מוֹאָב / עַל יַרְדֵּן יְרֵחוֹ
  english_pob_choice: in the plains of Moab ... by the Jordan at Jericho
  chosen_korean: 모압 평지, 곧 여리고 맞은편 요단 가
  alternatives_korean:
  - 모압의 평야, 곧 여리고 맞은편 요단 곁
  - 모압 평지, 곧 여리고 맞은편 요단 건너편
  - 모압 평지, 곧 여리고의 요단 가
  lexicon: HALOT
  rationale: 지리 표지를 간결하게 연결해, ‘모압 평지’와 ‘여리고 맞은편 요단 가’가 같은 위치 설명임을 한국어에서 명확히 했습니다.
