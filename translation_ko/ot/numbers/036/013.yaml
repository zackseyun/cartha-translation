  terminology: ‘야훼’, ‘이스라엘 자손’, ‘계명’은 적절합니다. מִשְׁפָּטִים은 여기서 법적 규범을 가리키므로 ‘법규’가 현대어에서 ‘규례’보다 משפט의 법적 뉘앙스를 더 잘 드러냅니다.
