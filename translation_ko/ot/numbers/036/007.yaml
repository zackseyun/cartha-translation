  to: 이스라엘 자손의 기업은 이 지파에서 저 지파로 옮겨가서는 안 됩니다. 이는 이스라엘 자손이 각자 자기 조상들의 지파에 속한 기업을 굳게 붙들어야 하기 때문입니다.
  rationale: 법률적 금지와 그 근거라는 원문의 두 절 구조를 유지하면서, 현대 표준어 합쇼체로 바꾸었습니다. ‘굳게 붙들어야 합니다’는 דבק의 지속적이고 확고한 유지를 반영하며, ‘자기 조상들의 지파에 속한 기업’은 원문의 소유·소속 관계를 자연스럽게 명시합니다.
