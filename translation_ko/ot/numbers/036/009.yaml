base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
  footnotes:
  - marker: a
    text: 'Or ''the tribes of Israel.'' Hebrew: ''the tribes of the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 어느 지파에서도 다른 지파로 유산이 옮겨지지 않게 하십시오[a]. 이스라엘 자손의 각 지파는 자기 유산을 굳게 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 지파들’. 히브리어는 ‘이스라엘 자손의 지파들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  english_pob_choice: shall pass
  chosen_korean: 옮겨지지 않게 하십시오
  alternatives_korean:
  - 넘어가지 않게 하십시오
  - 전달되지 않게 하십시오
  - 이동되지 않게 하십시오
  lexicon: HALOT
  rationale: 문맥상 물리적 이동이 아니라 지파 간 유산의 법적 이전을 가리키므로, 자연스러운 현대 한국어로 ‘옮겨지다’를 택했습니다.
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속
  - 기업
  - 분깃
  lexicon: HALOT
  rationale: 민수기 36장의 משפט적·토지 분배 맥락에서는 단순한 ‘상속’보다 분배된 몫의 뜻을 살리는 ‘유산’이 더 적절합니다.
- source_word: יִדְבְּקוּ
  english_pob_choice: shall hold fast
  chosen_korean: 굳게 지켜야 합니다
  alternatives_korean:
  - 붙들어야 합니다
  - 달라붙어야 합니다
  - 굳게 붙어 있어야 합니다
  lexicon: HALOT
  rationale: דבק의 핵심은 ‘붙어 있음/충성스럽게 매달림’인데, 법률 조항에서는 그 의미를 ‘굳게 지키다’로 옮기면 공적·규범적 어조를 유지하면서도 자연스럽습니다.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the tribes of the sons of Israel
  chosen_korean: 이스라엘 자손의 각 지파
  alternatives_korean:
  - 이스라엘의 각 지파
  - 이스라엘 자손의 지파들
  - 이스라엘의 지파들
  lexicon: HALOT
  rationale: 히브리어의 ‘이스라엘 자손’ 표현을 보존하되, 분배 규정의 분포적 의미를 드러내기 위해 ‘각 지파’로 풀어 썼습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 남성 복수 표현 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문이 보존한 혈연·언약적 집합 표현을 지우지 않고, 현대 한국어에서는 본문 흐름상 자연스러운 자리에서 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
