translation:
  language: ko
  text: 모세는 야훼의 말씀에 따라 이스라엘 자손에게 명령하여 이렇게 말했습니다. “요셉 자손의 지파가 옳게 말하고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  - 가르쳐
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 뜻하므로, 합쇼체 문맥에서 「명하여」가 자연스럽게 그 강도를 살립니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 혈통적·문학적 표현을 살리기 위해 직역적이면서도 한국어에서 익숙한 「이스라엘 자손」을 택했습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀에 따라
  alternatives_korean:
  - 야훼의 명령대로
  - 야훼의 입에 따라
  lexicon: HALOT
  rationale: 직역의 ‘입에 따라’는 한국어에서 부자연스러우므로, 원문의 권위 부여 기능을 드러내는 「말씀에 따라」로 옮겼습니다.
- source_word: דֹּבְרִים
  english_pob_choice: is speaking rightly
  chosen_korean: 옳게 말하고 있습니다
  alternatives_korean:
  - 옳습니다
  - 바르게 말하고 있습니다
  - 정확하게 말하고 있습니다
  lexicon: HALOT
  rationale: 분사형 ‘말하고’와 평가 의미 ‘옳게’를 함께 살려, 내용의 정당성과 발화 행위를 둘 다 보존했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명사 טetragrammaton을 인명적 신적 이름으로 드러내기 위해 POB 기본값대로 「야훼」를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
