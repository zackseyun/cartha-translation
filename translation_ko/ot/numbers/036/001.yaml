  - 가문의 우두머리들
  - 조상 집안의 우두머리들
  lexicon: HALOT
  rationale: 히브리어 관용구의 혈연·가문 구조를 유지하되, 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  english_pob_choice: clan / clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 족속들
  - 친족 집단들
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּחָה는 단순 가족보다 큰 족벌·혈연 집단을 가리키므로, 구조를 드러내는 ‘씨족’이 적절합니다.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂאִים
  english_pob_choice: before Moses and before the leaders
  chosen_korean: 모세와 지도자들 앞에
  alternatives_korean:
  - 모세와 지도자들 면전에서
  - 모세와 지도자들 앞에서
  - 모세와 지도자들 앞
  lexicon: HALOT
  rationale: לִפְנֵי의 공적·사법적 ‘면전’ 의미를 한국어의 ‘앞에’로 간결하게 살렸습니다.
