source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the heads of the families' / 'the chiefs of the ancestral houses.' The Hebrew idiom refers to recognized kinship-household leaders within Israel's tribal structure.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Israel'' is the formal Hebrew expression; alternatively, ''Israelites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요셉 자손의 씨족들 가운데, 므낫세의 아들 마길의 아들 길르앗 자손 씨족의 조상 가문 우두머리들[a]이 나아와, 모세와 이스라엘 자손[b]의 조상 가문 우두머리들인 지도자들 앞에서 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상 가문의 우두머리들’은 히브리어 관용구로, 이스라엘의 혈연·가문 구조 안에서 인정된 가문 지도자들을 가리킵니다. ‘가문 우두머리들’ 또는 ‘조상 집안의 우두머리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 형식적 표현입니다. 뜻으로는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
