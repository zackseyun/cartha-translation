  source_fidelity: 초안의 ‘가문들에 속한 이들에게’는 혼인한 남성들이 므낫세 자손의 친족 집단에 속했음을 전달하지만, מִן(‘~가운데서/~로부터’)의 범위 표현을 직접적으로 드러내지 못합니다. 또한 בְּנֵי מְנַשֶּׁה는 이 문맥에서 단순히 므낫세 개인의 소유격이 아니라 그의 자손 집단을 가리킵니다.
  naturalness: ‘그들의 아버지의 가문의 지파’는 중첩 소유격 때문에 한국어로 다소 무겁습니다. ‘그들의 아버지의 씨족이 속한 지파’라고 하면 히브리어의 친족 단위와 지파의 관계를 자연스럽고 명료하게 나타냅니다.
  terminology: נַחֲלָה는 민수기의 토지 상속 문맥에서 ‘기업’으로 유지할 수 있습니다. מִשְׁפָּחָה는 현대 한국어의 ‘가문’보다 고대 이스라엘의 중간 친족 단위를 선명히 하는 ‘씨족’이 더 적절합니다. 본문의 공용 아버지는 단수로 유지했습니다.
