  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
  footnotes:
  - marker: a
    text: Or 'from among the families of the sons of Manasseh son of Joseph.' The Hebrew kinship term can be rendered 'families' or 'clans' depending on how specifically the tribal structure is expressed in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요셉의 아들 므낫세의 가문들에 속한 이들에게 아내가 되었고, 그들의 기업은 그들의 아버지의 가문의 지파에 그대로 남았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가문들’은 히브리어 מִשְׁפָּחָה의 번역 선택입니다. 이 문맥에서는 ‘가문’이 지파 내부의 친족 단위를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִֽ/מִּשְׁפְּחֹת
  english_pob_choice: from the clans of
  chosen_korean: 가문들에 속한
  alternatives_korean:
  - 가문들 가운데서
  - 가문들로부터
  lexicon: HALOT
  rationale: מִן + מִשְׁפָּחָה는 문맥상 혼인 상대가 되는 친족 집단을 가리키므로, ‘가문’으로 옮기되 관계를 자연스럽게 드러내기 위해 ‘속한’으로 처리했습니다.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  english_pob_choice: the sons of Manasseh son of Joseph
  chosen_korean: 요셉의 아들 므낫세의
  alternatives_korean:
  - 요셉의 아들 므낫세의 자손들
  - 요셉의 아들 므낫세의 아들들
  lexicon: HALOT
  rationale: 족보적 표현을 유지하되 한국어에서 더 자연스러운 소유격 순서로 재배열해, 지파 계보의 핵심인 ‘요셉의 아들 므낫세’를 분명하게 했습니다.
- source_word: הָיוּ לְנָשִׁים
  english_pob_choice: became wives
  chosen_korean: 아내가 되었고
  alternatives_korean:
  - 아내로 맞이되었고
  - 아내가 되었습니다
  lexicon: HALOT
  rationale: 히브리어의 서술형 ‘~이 되다’를 살려, 혼인 결과를 직접적으로 표현하는 ‘아내가 되다’로 옮겼습니다.
- source_word: נַחֲלָתָן
  english_pob_choice: their inheritance
  chosen_korean: 그들의 기업
  alternatives_korean:
  - 그들의 상속받은 몫
  - 그들의 유산
  lexicon: HALOT
  rationale: 민수기의 토지 분배 문맥에서는 נַחֲלָה가 지파 몫으로 주어진 ‘기업’이 가장 정확하므로, 전통적이면서도 문맥에 맞는 ‘기업’을 택했습니다.
- source_word: וַ/תְּהִי ... עַל מַטֵּה מִשְׁפַּחַת אֲבִי/הֶן
  english_pob_choice: remained with the tribe of the clan of their father
  chosen_korean: 그들의 아버지의 가문의 지파에 그대로 남았습니다
  alternatives_korean:
  - 그들의 아버지의 가문의 지파에 속해 있었습니다
  - 그들의 아버지의 가문의 지파에 남아 있었습니다
  lexicon: HALOT
  rationale: 문장의 요지는 혼인 후에도 기업이 친가 지파 소속으로 유지되었다는 점이므로, 결과 상태를 분명히 하는 ‘그대로 남았습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 지파·가문·기업의 관계를 어떻게 드러낼지
  chosen_reading: 혼인이 일어나도 기업의 소속은 아버지 가문의 지파에 남아 있다는 법적 분배 원리를 전면에 드러냈습니다.
  alternative_readings:
  - 가볍게 ‘재산이 남았다’ 정도로 완화
  - ‘가문’과 ‘지파’를 하나로 평준화
  rationale: 본문은 개인의 결혼 이야기보다 이스라엘의 토지 상속 규정을 가르치므로, 친족 구조와 상속 소속을 구분해 주는 번역이 필요합니다.
  doctrine_reference: Numbers 36의 상속·지파 보전 규정
- issue: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף의 계보 표현
  chosen_reading: ‘요셉의 아들 므낫세’라는 계보를 유지해 문맥상 지파 정체성을 보존했습니다.
  alternative_readings:
  - 므낫세 지파로 단순화
  - 요셉의 후손이라고만 표현
  rationale: 본문은 지파 경계를 다루므로, 계보 연결고리를 약화시키지 않는 것이 해석상 중요합니다.
  doctrine_reference: 이스라엘 열두 지파의 족보/토지 분배 맥락
