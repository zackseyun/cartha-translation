id: NUM.36.3
reference: Numbers 36:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
  footnotes:
  - marker: a
    text: Or 'from the lot of our inheritance.' The Hebrew literally says 'from the lot,' referring to the portion assigned by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인들이 이스라엘 자손의 여러 지파 사람들 가운데 한 사람에게 아내가 되면, 그 여인들의 상속 몫은 우리 조상들의 상속 몫에서 빠져 그 여인들이 속하게 될 지파의 상속 몫에 더해질 것이며, 우리의 상속 몫으로 제비 뽑아 정해진 몫에서 줄어들 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 상속의 제비에서’. 히브리어는 문자적으로 ‘우리 상속의 제비에서’라고 하며, 제비로 정해진 몫을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לְאֶחָד
  english_pob_choice: if they become wives to one
  chosen_korean: 한 사람의 아내가 되면
  alternatives_korean:
  - 한 사람에게 속하게 되면
  - 한 사람의 아내로 들어가면
  lexicon: HALOT
  rationale: 조건문의 흐름을 살려 ‘되면’으로 옮기되, الزواج 맥락을 분명히 하기 위해 ‘아내’로 풀었습니다.
- source_word: מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  english_pob_choice: of the sons of the tribes of the sons of Israel
  chosen_korean: 이스라엘 자손들의 지파들 가운데
  alternatives_korean:
  - 이스라엘의 여러 지파 가운데
  - 이스라엘 자손 지파들 가운데
  lexicon: HALOT
  rationale: 층위가 있는 히브리어 표현을 너무 평탄화하지 않기 위해 ‘자손들의 지파들’ 구조를 최대한 보존했습니다.
- source_word: וְנִגְרְעָה / יִגָּרֵעַ
  english_pob_choice: will be taken away / it will be taken away
  chosen_korean: 빠져 … 빠져나갈
  alternatives_korean:
  - 감해질
  - 제거될
  lexicon: HALOT
  rationale: 같은 어근 반복을 한국어에서도 반복감 있게 살리되, 단순한 ‘감하다’보다 실제 상속분의 상실을 드러내는 ‘빠지다/빠져나가다’를 택했습니다.
- source_word: נַחֲלָה / גּוֹרָל
  english_pob_choice: inheritance / allotted portion
  chosen_korean: 상속 몫 / 제비 몫
  alternatives_korean:
  - 기업 / 제비로 받은 몫
  - 유산 / 할당 몫
  lexicon: HALOT
  rationale: נַחֲלָה는 토지 분배 문맥에서 ‘상속 몫’이 자연스럽고, גוֹרָל은 제비로 정한 분배를 가리키므로 ‘제비 몫’으로 구분해 옮겼습니다.
theological_decisions:
- issue: tribal inheritance continuity in land allotment
  chosen_reading: 이 구절은 지파 간 혼인 자체를 금지하기보다, 혼인으로 인한 상속 몫의 이동과 지파 경계의 훼손 가능성을 강조합니다.
  alternative_readings:
  - 단순한 가족 상속 문제로 축소하는 읽기
  - 혼인 일반에 대한 윤리 규정으로 확대하는 읽기
  rationale: 문맥상 쟁점은 언약 백성 안에서의 토지 분배 질서 유지이며, ‘우리 조상들의 상속 몫’과 ‘제비 몫’이 반복되어 그 초점이 분명합니다.
  doctrine_reference: 민수기 36장 문맥의 지파 유산 보존
