  source_fidelity: 전반적인 조건문과 상속 몫의 이전이라는 의미는 잘 반영했습니다. 다만 מִבְּנֵי의 ‘지파들의 자손/사람들 중 한 사람’이라는 관계는 ‘지파들 가운데 한 사람’보다 분명히 드러낼 필요가 있으며, 마지막 מִגֹּרַל נַחֲלָתֵנוּ는 ‘우리 상속의 제비 몫’보다 ‘우리 상속 몫으로 제비 뽑아 정해진 몫’으로 옮기는 편이 ‘제비’와 그로 정해진 분배 몫의 관계를 정확히 나타냅니다.
  naturalness: ‘이스라엘 자손들의 지파들 가운데 한 사람’ 및 ‘우리 상속의 제비 몫’은 현대 표준어에서 다소 부자연스럽고 구조가 불명확합니다. 지시 대상도 ‘그들’보다 ‘그 여인들’로 밝혀 주면 법적 상황과 문장 흐름이 선명해집니다.
  terminology: נַחֲלָה는 일관되게 ‘상속 몫’으로, גּוֹרָל은 ‘제비 뽑아 정해진 몫’으로 구별하는 것이 적절합니다. ‘조상들’은 אֲבֹתֵינוּ의 문맥상 자연스럽고, ‘지파’는 מַטֶּה에 적합합니다.
