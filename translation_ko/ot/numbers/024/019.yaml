id: NUM.24.19
reference: Numbers 24:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
  footnotes:
  - marker: a
    text: Or 'And he shall have dominion from Jacob.' The Hebrew verb can be rendered 'rule' or 'have dominion.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the remnant' instead of 'the survivor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱에게서 한 이가 다스리고, 그가 성읍에서 남은 자를 멸망시킬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘다스리다’ 또는 ‘통치하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형이지만, 문맥상 ‘남은 자들’이라는 집합적 의미로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  english_pob_choice: And one shall rule
  chosen_korean: 한 이가 다스리고
  alternatives_korean:
  - 그가 다스리고
  - 야곱에게서 다스릴 이가
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘다스리다/통치하다’의 뜻이므로, 영어 POB의 ‘rule’에 맞춰 자연스럽게 ‘다스리다’로 옮겼습니다. 주어가 생략된 구문이어서 문맥상 등장하는 왕적 인물을 살려 ‘한 이가’로 보완했습니다.
- source_word: מִיַּעֲקֹב
  english_pob_choice: from Jacob
  chosen_korean: 야곱에게서
  alternatives_korean:
  - 야곱으로부터
  - 야곱에서
  lexicon: HALOT
  rationale: מן의 출처/기원 용법을 살려, 현대 한국어에서 자연스러운 출처 표현인 ‘-에게서’를 사용했습니다.
- source_word: וְהֶאֱבִיד
  english_pob_choice: and he shall destroy
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 파괴할 것입니다
  - 멸하실 것입니다
  lexicon: HALOT
  rationale: 히필형 אבד의 ‘멸망하게 하다/파괴하다’의 강한 인과적 뜻을 반영했습니다. ‘멸망시키다’가 가장 직접적입니다.
- source_word: שָׂרִיד
  english_pob_choice: the survivor
  chosen_korean: 남은 자
  alternatives_korean:
  - 생존자
  - 남아 있는 자
  - 남은 사람
  lexicon: HALOT
  rationale: 단수형이지만 집합적 의미를 가질 수 있어, 영어 POB의 ‘the survivor’와 문맥상 대응되도록 ‘남은 자’로 옮겼습니다. ‘생존자’보다 성경적·문학적 어감이 살아 있습니다.
- source_word: מֵעִיר
  english_pob_choice: from the city
  chosen_korean: 성읍에서
  alternatives_korean:
  - 도시에서
  - 성에서
  lexicon: HALOT
  rationale: עִיר는 기본적으로 ‘성읍/도시’이지만, 성경 문맥에서는 ‘성읍’이 더 자연스럽고 원문 어감도 잘 살립니다. 전치사는 출처를 나타내므로 ‘-에서’로 처리했습니다.
theological_decisions:
- issue: 왕적 인물의 해석 범위
  chosen_reading: 본문에는 메시아라고 명시하지 않고, 야곱에게서 나와 다스리는 왕적 인물로 일반적으로 번역했습니다.
  alternative_readings:
  - 직접적인 메시아 예언으로 명시
  - 역사적 왕만 가리키는 것으로 한정
  rationale: 이 구절은 왕권을 예고하지만 본문 자체가 그 인물을 메시아로 명시하지는 않습니다. 따라서 신학적 결론을 본문에 앞서 넣지 않고, 해석의 긴장을 보존했습니다.
  doctrine_reference: 본문-정경적 해석의 긴장 보존
