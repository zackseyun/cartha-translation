  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 접미사를 살려 ‘그의’로 옮겼으며, POB의 문맥 판단처럼 문장 내 남성 단수 지시를 보존했습니다.
- source_word: עֹשֶׂה חָיִל
