  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
  footnotes:
  - marker: a
    text: Or 'Seir will become a possession of its enemies.' The Hebrew reads 'his enemies,' with a masculine singular suffix; interpreters differ on whether it points to Seir/Edom or to the ruler described in the surrounding oracle.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'does/acts valor'—an idiom meaning to show strength or act valiantly.
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔은 소유물이 될 것이며, 세일도 그의[a] 원수들의 소유물이 될 것입니다. 이스라엘은 용맹을 떨칠 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수 접미사, 곧 ‘그의’를 사용합니다. 그 지시 대상은 앞 문맥의 통치자일 수도 있고 세일이나 에돔일 수도 있습니다. 후자로 이해하면 ‘세일도 그 원수들의 소유물이 될 것입니다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구로, ‘용맹을 떨치다’, ‘힘을 보이다’라는 뜻입니다.
    reason: lexical_alternative
