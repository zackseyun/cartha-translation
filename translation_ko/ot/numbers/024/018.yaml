  source_fidelity: ‘그의 원수들에게 소유가 될 것입니다’는 히브리어의 소유 관계를 대체로 전달하지만, יְרֵשָׁה는 여기서 ‘소유물’로 명시하는 편이 더 정확하고 자연스럽습니다. עֹשֶׂה חָיִל은 미래 예언의 흐름에 맞추어 미래형으로 옮겨야 합니다. 남성 단수 접미사의 지시 대상은 본문에서 확정하지 않는 것이 적절합니다.
  naturalness: ‘소유가 되다’는 한국어에서 다소 추상적이고 어색하므로 ‘소유물이 되다’가 자연스럽습니다. 앞 절들이 미래형인데 ‘용맹을 떨칩니다’만 현재형인 것은 문체와 시제가 일관되지 않습니다. ‘용맹을 떨칠 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘에돔’, ‘세일’, ‘이스라엘’은 적절합니다. ‘원수’는 אָיֵב의 문맥상 가능한 번역이며, ‘그의’는 히브리어 남성 단수 접미사를 보존합니다. ‘용맹을 떨치다’는 חָיִל의 무력·용맹의 뉘앙스를 잘 살립니다.
