  rationale: 관용구가 단순한 ‘행동’보다 전투적 용기와 힘의 발휘를 뜻하므로, 현대 한국어에서 자연스러운 강한 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘his enemies’의 대명사 지시 대상
  chosen_reading: 히브리어의 남성 단수 접미사를 살려 ‘그의 원수들에게’로 두고, 지시 대상을 본문 안에서 단정하지 않았습니다.
  alternative_readings:
  - 세일/에돔을 가리켜 ‘그 원수들’ 또는 ‘그것의 원수들’로 이해할 수 있습니다.
  rationale: 바로 앞 문맥의 단수 지시와 예언적 인물 지시 가능성을 모두 남겨 두는 것이 본문 긴장을 보존합니다.
  doctrine_reference: 본문의 지시 대상은 해석 여지를 유지
