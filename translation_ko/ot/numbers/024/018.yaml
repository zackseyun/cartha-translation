  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
  footnotes:
  - marker: a
    text: Or 'Seir will become a possession of its enemies.' The Hebrew reads 'his enemies,' with a masculine singular suffix; interpreters differ on whether it points to Seir/Edom or to the ruler described in the surrounding oracle.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'does/acts valor'—an idiom meaning to show strength or act valiantly.
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔은 소유가 될 것이며, 세일도 그의 원수들에게 소유가 될 것입니다. 이스라엘은 용맹을 떨칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세일이 그의 원수들의 소유가 될 것입니다.’ 히브리어는 남성 단수 접미사 ‘그의’를 쓰며, 지시 대상은 세일/에돔일 수도 있고 앞 문맥의 통치자일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구로, ‘용맹을 떨치다’, ‘힘을 보이다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되겠습니다
  lexicon: WLC / HALOT
  rationale: 예언문맥의 결과적·미래적 상태 변화를 자연스럽게 드러내기 위해 ‘될 것입니다’를 선택했습니다.
- source_word: יְרֵשָׁה
  english_pob_choice: a possession
  chosen_korean: 소유
  alternatives_korean:
  - 점유
  - 기업
  lexicon: HALOT
  rationale: 정복 맥락에서 단순한 소유·점유 상태를 드러내는 말로 옮겼고, 신학적 의미가 강한 ‘기업’은 피했습니다.
- source_word: אֹיְבָיו
  english_pob_choice: his enemies
  chosen_korean: 그의 원수들에게
  alternatives_korean:
  - 그 원수들에게
  - 그의 적들에게
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 접미사를 살려 ‘그의’로 옮겼으며, POB의 문맥 판단처럼 문장 내 남성 단수 지시를 보존했습니다.
- source_word: עֹשֶׂה חָיִל
  english_pob_choice: acts valiantly
  chosen_korean: 용맹을 떨칩니다
  alternatives_korean:
  - 용맹하게 행동합니다
  - 힘을 떨칩니다
  lexicon: HALOT
  rationale: 관용구가 단순한 ‘행동’보다 전투적 용기와 힘의 발휘를 뜻하므로, 현대 한국어에서 자연스러운 강한 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘his enemies’의 대명사 지시 대상
  chosen_reading: 히브리어의 남성 단수 접미사를 살려 ‘그의 원수들에게’로 두고, 지시 대상을 본문 안에서 단정하지 않았습니다.
  alternative_readings:
  - 세일/에돔을 가리켜 ‘그 원수들’ 또는 ‘그것의 원수들’로 이해할 수 있습니다.
  rationale: 바로 앞 문맥의 단수 지시와 예언적 인물 지시 가능성을 모두 남겨 두는 것이 본문 긴장을 보존합니다.
  doctrine_reference: 본문의 지시 대상은 해석 여지를 유지
