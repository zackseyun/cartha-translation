  lexicon: HALOT
  rationale: 히브리어 관용구의 미래 지시를 살리되, 이 본문에서 요구되는 종말론적 해석을 과도하게 고정하지 않도록 했습니다.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים의 종말론적 뉘앙스
