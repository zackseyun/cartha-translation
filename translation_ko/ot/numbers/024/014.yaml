  rationale: 대화 상대를 부르는 명령형의 촉구를 살리되, 바로 뒤의 예언적 설명을 들으라는 문맥에 맞게 자연스럽게 만들었습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
