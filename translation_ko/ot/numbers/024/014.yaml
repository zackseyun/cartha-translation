  rationale: 주목을 환기하는 지시적 표현을 현대 한국어의 정중한 감탄·주의 환기형으로 옮겨, 문장의 강조를 유지했습니다.
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 와 보십시오
