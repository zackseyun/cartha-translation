source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
  footnotes:
  - marker: a
    text: Or, 'in days to come.' The Hebrew phrase can refer broadly to the future, though 'in the latter days' preserves its prophetic weight.
    reason: alternative_reading
  - marker: b
    text: Or, 'against your people.' The Hebrew preposition literally reads 'to your people,' but in context it may imply hostile action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 보십시오, 저는 제 백성에게로 갑니다. 와 보십시오. 제가 이 백성이 당신의 백성에게 훗날에 무엇을 할지 당신에게 알려드리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다가올 날들에’. 히브리어 표현은 넓게 미래를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘당신의 백성을 향하여’. 히브리어 전치사는 문자적으로 ‘당신의 백성에게’이지만, 문맥상 적대적 행위를 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
