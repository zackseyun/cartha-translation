  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: ko
  text: 그때 발람은 일어나 떠나 자기 자리로 돌아갔으며, 발락도 자기 길을 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행에서 ‘일어나다’가 Hebrew wayyiqtol의 동작 전개를 가장 자연스럽게 옮깁니다.
- source_word: לִמְקֹמוֹ
  english_pob_choice: to his place
  chosen_korean: 자기의 자리로
  alternatives_korean:
  - 자기의 곳으로
  - 자기 집으로
  lexicon: HALOT
  rationale: מקוֹם은 문자적으로 ‘장소’이므로, ‘집’으로 구체화하지 않고 맥락상 자연스러운 ‘자리’로 옮겼습니다.
- source_word: וְגַם
  english_pob_choice: and ... also
  chosen_korean: 도
  alternatives_korean:
  - 그리고 또한
  - 또
  lexicon: HALOT
  rationale: 발람의 행동과 평행하게 발락도 따로 움직였다는 추가를 한국어 조사 ‘도’로 간결하게 살렸습니다.
- source_word: לְדַרְכּוֹ
  english_pob_choice: on his way
  chosen_korean: 자기 길을
  alternatives_korean:
  - 자기 길로
  - 자기 길을 따라
  lexicon: HALOT
  rationale: דרך의 관용적 의미를 살리되, 한국어에서 서술 동사 ‘가다’와 자연스럽게 결합되는 표현으로 옮겼습니다.
