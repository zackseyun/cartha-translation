  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
  footnotes:
  - marker: a
    text: Or 'the oracle of one who hears the words of God.' The Hebrew נְאֻם is a formal prophetic term for a solemn utterance.
    reason: lexical_alternative
  - marker: b
    text: Or 'with eyes open.' Literally, 'with eyes uncovered,' preserving the imagery of unveiled sight in revelation.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 말씀을 듣고 전능자의 환상을 보며, 엎드리면서도 눈은 열려 있는 이의 선언[a]입니다:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 말씀을 듣고 전능자의 환상을 보며, 엎드리면서도 눈은 열려 있는 이의 말입니다.” 히브리어 נְאֻם은 엄숙한 예언적 선언을 나타내는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “눈이 드러난” 또는 “눈이 가려지지 않은”입니다. 여기서는 계시를 받는 눈의 비유적 표현을 보존합니다.
    reason: lexical_alternative
