    issue: '"전하는 자는" renders נְאֻם as an agent rather than a formal utterance/declaration.'
    rationale: נְאֻם introduces the saying as "the declaration/utterance of," followed by the person characterized as hearing and seeing.
  - severity: high
    issue: '"전능자께서 보시는 환상" makes the Almighty the subject who sees.'
    rationale: מַחֲזֵה שַׁדַּי means "the vision of the Almighty"; Balaam is the one who sees it.
  - severity: medium
    issue: The concessive relation in the final clause is not represented clearly.
    rationale: The English audit trail appropriately recognizes the contrast between falling down and having uncovered eyes; "엎드리면서도" represents this without overdefining the posture.
