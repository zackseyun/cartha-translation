  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
  footnotes:
  - marker: a
    text: Or, 'whose eye is shut/closed.' The Hebrew phrase is difficult and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 자신의 시적 발언을 읊어 말했습니다. “브올의 아들 발람의 선언, 눈이 열린[a] 사람의 선언입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈이 닫힌’ 또는 ‘눈이 감긴’. 히브리어 표현은 해석하기 어렵고 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  english_pob_choice: Then he took up his discourse
  chosen_korean: 그가 자기의 시를 들어
  alternatives_korean:
  - 그가 자기의 노래를 들어
  - 그가 자기의 말을 들어
  lexicon: HALOT
  rationale: מָשָׁל은 여기서 단순한 말이 아니라 발람의 정형화된 시적 발언을 가리키므로, 한국어로는 자연스럽게 ‘시’를 택해 문학적 성격을 살렸습니다. ‘들어’는 נשׂא의 관용적 개시 표현을 비교적 직접적으로 반영합니다.
- source_word: נְאֻם
  english_pob_choice: the declaration of
  chosen_korean: 선언
  alternatives_korean:
  - 말씀
  - 신탁
  - 선포
  lexicon: HALOT
  rationale: נְאֻם은 예언적·권위적 공식을 이루는 말이므로, 평이하지만 격식을 가진 ‘선언’으로 옮겨 두 차례 반복되는 형식을 일관되게 살렸습니다.
- source_word: בְּנוֹ בְעֹר
  english_pob_choice: son of Beor
  chosen_korean: 비느아의 아들
  alternatives_korean:
  - 브올의 아들
  - 베오르의 아들
  lexicon: standard transliteration
  rationale: 한국어 성경에서 이미 굳어진 인명 형태를 따라 ‘비느아’를 사용했습니다. 본문의 친숙한 고유명 표기를 유지하는 것이 가독성과 추적 가능성에 유리합니다.
- source_word: שְׁתֻם הָעָיִן
  english_pob_choice: whose eye is opened
  chosen_korean: 눈이 열린
  alternatives_korean:
  - 눈이 닫힌
  - 눈이 감긴
  lexicon: HALOT
  rationale: 이 표현은 해석이 어려우나, 바로 뒤 문맥과 발람의 계시적 시야를 고려하면 ‘열린’이 가장 자연스럽습니다. 다만 히브리어가 다른 방향으로도 이해되어 왔으므로 대안은 각주로 남깁니다.
theological_decisions:
- issue: שְׁתֻם הָעָיִן의 의미를 계시적 시야로 볼 것인가, 시각 장애로 볼 것인가
  chosen_reading: ‘눈이 열린’으로 번역해 계시를 받는 발람의 문맥적 의미를 드러냈습니다.
  alternative_readings:
  - 눈이 닫힌
  - 눈이 감긴
  rationale: 이 절은 발람이 신적 말씀을 받는 장면의 일부이므로, 문맥상 열린 눈의 통찰을 반영하는 번역이 자연스럽습니다. 그러나 히브리어 표현 자체는 논쟁적이어서 해석의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it; preserve genuine ambiguity in footnotes.'
