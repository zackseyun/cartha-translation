  source_fidelity: 종결절을 ‘하나님께서 이렇게 하실 때’로 옮긴 것은 난해한 히브리어 מִשֻּׂמוֹ אֵל을 하나님의 행위로 이해하는 가능한 해석을 자연스럽게 반영합니다. 다만 וַיִּשָּׂא מְשָׁלוֹ는 ‘말을 들어 올려’라는 한국어의 문자적 표현보다, 발람의 예언적 선언을 가리키는 관용적 의미가 드러나야 합니다.
  naturalness: ‘자기 말을 들어 올려 말했습니다’는 현대 표준 한국어에서 부자연스럽고 ‘말하다’와도 의미가 중복됩니다. ‘자기의 예언을 선포하며 말했습니다’가 문맥과 합쇼체 문체에 자연스럽습니다.
  terminology: מָשָׁל은 이 문맥에서 단순한 일반 발화보다 예언적 선언/신탁에 가깝습니다. 본문에서는 ‘예언’으로 옮기고, 각주에서 ‘말’, ‘신탁’, ‘비유’의 폭을 밝혀 두는 것이 적절합니다. 기존 각주의 ‘마상’은 오기이므로 제거해야 합니다.
