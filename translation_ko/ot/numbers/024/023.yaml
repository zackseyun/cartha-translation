  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
  footnotes:
  - marker: a
    text: Or 'Alas, who can survive when God does this?' The Hebrew of the final clause is difficult and may also be understood as 'when he sets this in place, God.'
    reason: alternative_reading
  - marker: b
    text: '''His discourse'' may also be rendered ''his oracle'' or ''his parable.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 말을 들어 올려 말했습니다[a]. 「아, 하나님이 이렇게 하실 때 누가 살 수 있겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘자기 말/마상’은 ‘자기 발언’, ‘자기 오라클’, ‘자기 비유’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  english_pob_choice: Then he took up his discourse
  chosen_korean: 그가 자기 말을 들어 올려
  alternatives_korean:
  - 그가 자기 오라클을 들어 올려
  - 그가 자기 비유를 들어 올려
  - 그가 말을 시작하여
  lexicon: HALOT
  rationale: נשא + מָשָׁל의 관용구를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘자기 말을 들어 올려’로 옮겼습니다. ‘말/발언’을 택해 ‘discourse’의 넓은 뜻을 반영했습니다.
- source_word: אֹוי
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 슬프다
  - 아아
  - 화가 나도다
  lexicon: HALOT
  rationale: 감탄사적 탄식과 두려움을 간결하게 드러내는 표현으로 처리했습니다. 여기서는 예언적 ‘화로다’보다 탄식의 정조가 더 두드러집니다.
- source_word: מִשֻּׂמוֹ אֵל
  english_pob_choice: when God does this
  chosen_korean: 하나님이 이렇게 하실 때
  alternatives_korean:
  - 하나님이 이것을 정하실 때
  - 하나님이 이것을 두실 때
  - 하나님이 이것을 행하실 때
  lexicon: HALOT
  rationale: 축약된 קשה 구문을 문맥에 맞게 풀어 ‘when God does this’의 의미를 살리되, ‘이렇게’로 본문의 지시성을 유지했습니다. אֵל은 주어로 읽어 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: מִשֻּׂמוֹ אֵל의 난해한 종결절 해석
  chosen_reading: 하나님이 어떤 일을 실제로 행하시는 때를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 하나님이 그것을 정하실 때
  - 그분이 이것을 세워 놓으실 때
  - 문자적으로는 '그가 이것을 두실 때'
  rationale: 히브리어가 생략적이어서 한국어에서는 의미를 보완해야 합니다. 문맥상 발람의 예언적 경고이므로, 과도한 해설 없이 하나님의 주권적 행위를 드러내는 방향이 가장 적절합니다.
  doctrine_reference: 섭리와 하나님의 주권
