id: NUM.24.24
reference: Numbers 24:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
  footnotes:
  - marker: a
    text: Kittim may refer specifically to Cyprus or more broadly to western maritime peoples.
    reason: alternative_reading
  - marker: b
    text: Asshur can also be rendered 'Assyria.'
    reason: lexical_alternative
  - marker: c
    text: Eber may refer to Eber as a people-name, to the Hebrews, or to peoples 'beyond' a boundary such as the Euphrates.
    reason: alternative_reading
  - marker: d
    text: The Hebrew reads 'and he too'; the antecedent is uncertain, and some understand it more collectively as 'it too' or as a ruler representing the power from Kittim.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 깃딤의 해안에서 배들이 오고, 그들이 앗수르를 괴롭히며, 그들이 에벨을 괴롭힐 것입니다. 그도 마침내 멸망에 이를 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 깃딤은 키프로스를 가리키거나 더 넓게는 서방의 해양 민족들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 앗수르는 ‘아시리아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 에벨은 인명 에벨, 히브리인들, 또는 유프라테스 너머의 사람들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 히브리어는 ‘그도’라고 읽으며, 선행사는 분명하지 않습니다. 어떤 이들은 집합적으로 ‘그것도’로 이해하거나, 깃딤에서 나온 권력을 대표하는 통치자로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  english_pob_choice: ships
  chosen_korean: 배들
  alternatives_korean:
  - 배
  - 선박
  - 함선
  lexicon: HALOT
  rationale: 해상 이동체를 가리키는 일반 명사이므로, 문맥에 맞는 자연스러운 한국어로 ‘배들’이 가장 직접적입니다.
- source_word: מִיַּד כִּתִּים
  english_pob_choice: from the coast of Kittim
  chosen_korean: 깃딤의 해안에서
  alternatives_korean:
  - 깃딤의 쪽에서
  - 깃딤의 지역에서
  - 깃딤에서
  lexicon: HALOT
  rationale: מִיַּד는 지리적 표현에서 ‘~의 해안/쪽’의 뜻을 가질 수 있으므로, 배가 오는 이미지에 맞게 ‘해안’으로 옮겼습니다.
- source_word: וְעִנּוּ
  english_pob_choice: they shall afflict
  chosen_korean: 괴롭히며
  alternatives_korean:
  - 학대하며
  - 압제하며
  - 괴롭게 하며
  lexicon: HALOT
  rationale: ענה의 piel은 ‘괴롭히다/억압하다/학대하다’의 폭을 가지므로, 의미를 과도하게 좁히지 않는 ‘괴롭히다’를 택했습니다.
- source_word: אַשּׁוּר
  english_pob_choice: Asshur
  chosen_korean: 앗수르
  alternatives_korean:
  - 앗슈르
  - 아시리아
  lexicon: HALOT
  rationale: 히브리어 고유명사의 음을 살리면서도 한국어 성경에서 널리 익숙한 형태를 반영해 ‘앗수르’로 옮겼습니다.
- source_word: עֵבֶר
  english_pob_choice: Eber
  chosen_korean: 에벨
  alternatives_korean:
  - 헤벨
  - 에베르
  lexicon: HALOT
  rationale: 형태가 고유명사로 제시되므로 음역을 유지해 ‘에벨’로 옮기고, 사람 이름/민족명/지리적 표지 가능성은 본문에서 확정하지 않았습니다.
- source_word: עֲדֵי אֹבֵד
  english_pob_choice: shall come to destruction
  chosen_korean: 멸망에 이를 것입니다
  alternatives_korean:
  - 파멸에 이를 것입니다
  - 멸절될 것입니다
  - 완전히 망할 것입니다
  lexicon: HALOT
  rationale: ‘~에 이르다’로 방향성을 살리면서 אֹבֵד의 결과를 ‘멸망’으로 옮겨, 단정적 종말 어조를 유지했습니다.
theological_decisions:
- issue: 깃딤, 앗수르, 에벨의 역사적 식별과 마지막 대명사 ‘그도’
  chosen_reading: 고유명사는 그대로 보존하고, 마지막 단수 대명사는 ‘그도’로 옮겨 원문의 모호성을 유지했습니다.
  alternative_readings:
  - 깃딤을 키프로스나 서방 해양 세력으로 특정하기
  - 앗수르를 아시리아로 번역하기
  - 에벨을 히브리인들로 해석하기
  - 마지막 대명사를 집합적 ‘그것도’로 풀기
  rationale: 예언문맥의 식별 문제는 본문 자체가 열어 둔 긴장입니다. 번역은 해석을 앞질러 확정하기보다, 독자가 원문의 모호성을 그대로 인식하도록 두는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
