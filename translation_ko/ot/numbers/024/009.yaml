    issue: 현대 합쇼체 및 문장부호 미준수
    rationale: ‘일으키리요’, ‘받으리라’는 고어적 문어체이며, 요청된 현대 formal-polite 합쇼체와 맞지 않습니다. 또한 절과 문장이 구두점 없이 이어져 가독성이 낮습니다.
  - severity: low
    issue: 사자 비유의 한국어 연결이 다소 어색함
    rationale: ‘웅크리고 누워 사자 같고 암사자 같으니’보다 동작을 먼저 완결한 뒤 비유를 이어 주는 방식이 자연스럽고 원문의 병행 이미지도 보존합니다.
  revised_text: 그는 웅크리고 누웠습니다. 사자 같고 암사자 같으니, 누가 그를 일으키겠습니까? 너를 축복하는 자는 복을 받고, 너를 저주하는 자는 저주를 받습니다.
  revised_footnotes:
