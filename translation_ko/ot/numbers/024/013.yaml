id: NUM.24.13
reference: Numbers 24:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
  footnotes:
  - marker: a
    text: Literally, 'go beyond the mouth of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「만일 발락이 그의 집에 가득 찬 은과 금을 내게 준다 해도, 나는 야훼의 말씀을 넘어[a] 내 마음대로 선이나 악을 행할 수 없습니다. 야훼께서 말씀하시는 것은 무엇이든 내가 말하겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입을 넘어서는 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִתֶּן
  english_pob_choice: If ... were to give
  chosen_korean: 만일 ... 준다 해도
  alternatives_korean:
  - 만일 ... 준다면
  - 설령 ... 준다 해도
  lexicon: HALOT
  rationale: 가정적 조건을 나타내므로 한국어에서는 ‘만일 … 준다 해도’가 가장 자연스럽고, 결과적으로 그 조건이 실현되지 않더라도 결론이 변하지 않음을 드러냅니다.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  english_pob_choice: his house full of silver and gold
  chosen_korean: 자기 집에 가득한 은과 금
  alternatives_korean:
  - 은과 금으로 가득 찬 자기 집
  - 자기 집의 은과 금으로 가득함
  lexicon: HALOT
  rationale: ‘집이 가득하다’는 이미지를 살리면서도 한국어로는 ‘자기 집에 가득한 은과 금’이 가장 간결하고 자연스럽습니다.
- source_word: לַעֲבֹר אֶת פִּי יְהוָה
  english_pob_choice: go beyond the word of Yahweh
  chosen_korean: 야훼의 말씀을 넘어
  alternatives_korean:
  - 야훼의 입을 넘어
  - 야훼의 명령을 어기고
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘입’을 유지할 수도 있지만, POB의 аудիտ에서 밝혔듯이 관용적으로는 ‘말씀’이 원문 은유를 살리면서도 한국어에 자연스럽습니다.
- source_word: מִלִּבִּי
  english_pob_choice: from my own heart
  chosen_korean: 스스로의 마음에서
  alternatives_korean:
  - 내 마음에서
  - 내 마음대로
  lexicon: HALOT
  rationale: 발람의 독자적 기원이나 자의성을 강조하기 위해 ‘스스로의 마음에서’로 옮겨, 야훼의 말씀과의 대조를 분명히 했습니다.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹת֥וֹ אֲדַבֵּר
  english_pob_choice: Whatever Yahweh speaks, that I will speak
  chosen_korean: 야훼께서 말씀하시는 것을, 나는 그대로 말하겠습니다
  alternatives_korean:
  - 야훼께서 말씀하시는 바를 나는 말하겠습니다
  - 야훼께서 말씀하시는 것은 무엇이든 말하겠습니다
  lexicon: HALOT
  rationale: 재귀적 호응을 한국어에서 자연스럽게 풀어, ‘말씀하시는 것’을 곧바로 ‘그대로 말하겠습니다’로 대응시켜 원문의 반복 구조와 의도를 보존했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 신적 칭호가 아니라 언약적 고유명사를 사용하므로, POB의 기준에 따라 대체어를 쓰지 않고 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 발람의 발화 제한
  chosen_reading: 발람은 야훼의 말씀이 허락하는 범위를 넘어 자의적으로 선악을 행하거나 말할 수 없다는 진술로 옮겼습니다.
  alternative_readings:
  - 단지 저주를 바꿀 수 없다는 뜻으로 제한
  - 예언자의 통제 불능 상태로 확대
  rationale: 문맥은 저주/축복의 전체 논의를 배경으로 하지만, 본문 자체는 ‘말씀을 넘어감’과 ‘스스로의 마음에서 선이나 악을 행함’의 불가능을 함께 말하므로 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
