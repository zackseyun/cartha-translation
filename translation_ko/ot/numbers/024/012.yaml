  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
  footnotes:
  - marker: a
    text: Or 'your envoys.' The Hebrew word can denote either human messengers or, in other contexts, angels; here the human sense is required by context.
    reason: lexical_alternative
  - marker: b
    text: The quotation introduced by 'saying' continues into the next verse.
    reason: cross_reference
translation:
  language: ko
  text: 발람이 발락에게 말했습니다. “당신이 나에게 보낸 사신들에게도[a] 내가 이렇게 말하지 않았습니까:[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사신들’로 옮긴 히브리어 낱말은 문맥에 따라 천사를 가리킬 수도 있습니다. 그러나 여기서는 발락이 보낸 사람 사절을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이렇게 말하지 않았습니까:’로 도입된 인용 내용은 다음 절까지 이어집니다.
    reason: cross_reference
