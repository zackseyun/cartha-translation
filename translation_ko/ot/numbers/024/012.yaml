  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
  footnotes:
  - marker: a
    text: Or 'your envoys.' The Hebrew word can denote either human messengers or, in other contexts, angels; here the human sense is required by context.
    reason: lexical_alternative
  - marker: b
    text: The quotation introduced by 'saying' continues into the next verse.
    reason: cross_reference
translation:
  language: ko
  text: 발람이 발락에게 말했습니다. 「당신이 나에게 보낸 당신의 사신들에게도 내가 말하지 않았습니까? 이르기를,」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사신들’은 히브리어 מַלְאָכִים의 인간 사절 의미를 따른 번역입니다. 이 낱말은 문맥에 따라 천사를 가리킬 수도 있지만, 여기서는 사람 사절이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이르기를’로 시작된 인용은 다음 절까지 이어집니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술형 과거의 אמר를 현대 한국어 서술체로 자연스럽게 옮겼습니다.
- source_word: אֶל בָּלָק
  english_pob_choice: to Balak
  chosen_korean: 발락에게
  alternatives_korean:
  - 발락을 향해
  - 발락한테
  lexicon: HALOT
  rationale: אֶל의 대상을 한국어 여격 표지로 간결하게 나타냈습니다.
- source_word: מַלְאָכֶיךָ
  english_pob_choice: your messengers
  chosen_korean: 당신의 사신들
  alternatives_korean:
  - 당신의 메신저들
  - 당신의 전령들
  - 당신의 사자들
  lexicon: HALOT
  rationale: 문맥상 사람 사절을 가리키므로 천사적 의미를 배제하면서도 현대 한국어에서 자연스러운 외교적 표현을 택했습니다.
- source_word: דִּבַּרְתִּי לֵאמֹר
  english_pob_choice: I ... saying
  chosen_korean: 내가 말하지 않았습니까? 이르기를,
  alternatives_korean:
  - 내가 말하지 않았습니까? 곧,
  - 내가 말했지 않습니까? 말하기를,
  lexicon: HALOT
  rationale: לֵאמֹר가 다음 절까지 이어지는 발화 도입 표지이므로, 한국어에서도 인용 시작을 열어 두는 형태로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 종결 여부
  chosen_reading: ‘이르기를,’로 끝내어 다음 절로 이어지는 인용을 드러냈습니다.
  alternative_readings:
  - 문장 종결형으로 완결하기
  - 다음 절 내용을 괄호로 함께 묶기
  rationale: 히브리어 לֵאמֹר가 다음 절과 연결되는 발화 표지이므로, 본절에서 인용을 닫지 않는 편이 원문 구조를 더 정확히 반영합니다.
  doctrine_reference: 문맥 연속성/담화 구조
