id: NUM.24.22
reference: Numbers 24:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
  footnotes:
  - marker: a
    text: Kain likely refers here to the Kenites rather than to the individual Cain.
    reason: lexical_alternative
  - marker: b
    text: Asshur can mean 'Assyria' or 'the Assyrian' in context.
    reason: alternative_reading
translation:
  language: ko
  text: “만일 가인이[a] 불태워질 운명이라면, 앗수르가[b] 언제까지 너를 포로로 잡아가겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가인’은 여기서 개인 이름보다 켄족을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앗수르’는 문맥에 따라 앗시리아 또는 앗시리아 사람을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: “만일 …이라면”
  alternatives_korean:
  - “그리고 만일 …이라면”
  - “참으로 만일 …이라면”
  - “그러나 만일 …이라면”
  lexicon: HALOT
  rationale: 이 결합은 앞말을 잇는 조건문으로, 한국어에서는 불필요한 접속부를 줄이고 자연스럽게 조건을 드러내는 “만일 …이라면”이 가장 가깝습니다.
- source_word: לְבָעֵר
  english_pob_choice: for burning
  chosen_korean: “불살라질 것이라면”
  alternatives_korean:
  - “태워질 것이라면”
  - “소멸될 것이라면”
  - “불사름을 당할 것이라면”
  lexicon: HALOT
  rationale: ל + בער의 결과/운명 용법을 살려, 단순한 진행이 아니라 ‘불에 넘겨져 소멸되는’ 뉘앙스를 한국어 수동형으로 옮겼습니다.
- source_word: קָיִן
  english_pob_choice: Kain
  chosen_korean: 가인
  alternatives_korean:
  - 카인
  - 케인
  lexicon: HALOT
  rationale: 히브리어 고유명사의 음가를 따르되 한국어 성경에서 널리 알려진 형태를 사용했습니다. 문맥상 켄족 집단을 가리킬 가능성은 본문이 아닌 주석으로 처리하는 편이 적절합니다.
- source_word: אַשּׁוּר
  english_pob_choice: Asshur
  chosen_korean: 앗수르
  alternatives_korean:
  - 아수르
  - 앗시리아
  - 앗시리아 사람
  lexicon: HALOT
  rationale: 본문은 지명/세력명 자체를 가리키는 고유명사를 쓰므로, 주석적 해석을 본문에 넣지 않고 음역형 ‘앗수르’를 택했습니다.
- source_word: תִּשְׁבֶּךָּ
  english_pob_choice: carries you away captive
  chosen_korean: “너를 사로잡아 갈 것이냐?”
  alternatives_korean:
  - “너를 포로로 잡아갈 것이냐?”
  - “너를 사로잡을 것이냐?”
  - “너를 포로로 끌고 갈 것이냐?”
  lexicon: HALOT
  rationale: שבה의 포로화 의미를 살리면서, 한국어에서 자연스럽게 ‘포로로 삼아 데려감’의 뜻이 드러나도록 했습니다. ‘가다’는 이동과 유배를 함께 암시합니다.
theological_decisions:
- issue: 가인/켄족 집단 가능성
  chosen_reading: 본문의 표면 형태는 단수 고유명사처럼 보이므로 본문에는 ‘가인’을 두고, 집단 지시 가능성은 주석으로 처리합니다.
  alternative_readings:
  - ‘켄족’으로 직접 번역
  - ‘카인’으로 음역 유지
  rationale: 히브리어 형태와 POB의 주석적 경고를 모두 보존하려면, 본문은 원형에 가깝게 두고 해석은 각주로 분리하는 편이 가장 투명합니다.
  doctrine_reference: 본문 비평/역사적 해석 메모
- issue: 앗수르의 의미 범위
  chosen_reading: 본문에는 고유명사 ‘앗수르’를 유지하고, 그 의미가 ‘앗수르/앗수르 사람’ 둘 다 가능함을 주석으로 표시합니다.
  alternative_readings:
  - ‘앗시리아’로 명시
  - ‘앗수르 사람’으로 의역
  rationale: 원문 자체가 나라명과 인물/세력 지시를 모두 열어 두므로, 단정적 해석을 피하는 것이 더 소스-충실합니다.
  doctrine_reference: 본문 비평/역사적 해석 메모
