  rationale: 가인과 앗수르를 본문에서 음역으로 유지하여 원문의 지시 대상에 관한 불확실성을 보존했습니다. 각주 표지를 해당 낱말 바로 뒤에 배치했고, 앗수르 각주는 영어 POB 감사 기록의 의미 대안에 맞추어 바로잡았습니다. 또한 합쇼체 의문문과 포로화 어휘를 자연스럽게 조정했습니다.
