id: NUM.24.11
reference: Numbers 24:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
  footnotes:
  - marker: a
    text: Or, 'I had said, “I would surely honor you.”' The Hebrew construction is emphatic.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the LORD has withheld you from honor' or 'prevented you from honor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제[a] 당신의 자리로 도망치십시오. 내가 ‘반드시 당신에게 영예를 주겠다’고 말했지만, 보십시오[b], 야훼께서 당신이 영예를 받지 못하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 “반드시 당신에게 영예를 주겠다”고 말했었습니다.’ 히브리어 표현은 강조되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘야훼께서 당신에게 영예를 주지 않으셨습니다’ 또는 ‘당신이 영예를 얻지 못하게 하셨습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러니 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 대화의 결론을 여는 전환어로서 원문의 연결성과 시점을 함께 살리면서 한국어 문맥에는 ‘그러니 이제’가 가장 자연스럽습니다.
- source_word: בְּרַח
  english_pob_choice: flee
  chosen_korean: 도망치십시오
  alternatives_korean:
  - 달려가십시오
  - 떠나십시오
  lexicon: HALOT
  rationale: 명령형 ברח의 급박하고 내쫓는 뉘앙스를 살리기 위해, 완곡한 ‘떠나십시오’보다 강한 ‘도망치십시오’를 택했습니다.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  english_pob_choice: I would surely honor you
  chosen_korean: 반드시 당신을 높여 주겠다
  alternatives_korean:
  - 반드시 당신을 존귀하게 하겠다
  - 꼭 당신을 सम्मान하겠다
  lexicon: HALOT
  rationale: כָּבֵד/כַּבֵּד의 기본 의미는 ‘존귀하게 하다, 영예를 주다’이므로, 왕이 약속한 보상과 지위를 드러내는 ‘높여 주다’로 옮겼습니다. 반복어구의 강조는 ‘반드시’로 반영했습니다.
- source_word: מְנָעֲךָ ... מִכָּבוֹד
  english_pob_choice: has kept you back from honor
  chosen_korean: 당신을 존귀함에서 막으셨습니다
  alternatives_korean:
  - 당신을 존귀함에서 가로막으셨습니다
  - 당신이 존귀함을 얻지 못하게 하셨습니다
  lexicon: HALOT
  rationale: מנע는 ‘막다, 제지하다’의 뜻이므로, 결과를 자연스럽게 드러내는 ‘막으셨습니다’로 옮겼습니다. כָּבוֹד는 여기서 추상적 ‘영광’보다 발락이 약속한 지위와 대우를 가리켜 ‘존귀함’이 더 정확합니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절의 יְהוָה는 고유한 하나님의 이름이므로, 본 프로젝트 기준에 따라 ‘야훼’로 옮겨 텍스트가 실제로 지닌 신명 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
