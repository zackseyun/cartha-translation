id: NUM.24.7
reference: Numbers 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
  footnotes:
  - marker: a
    text: Or possibly 'from his branches,' if the noun is taken metaphorically rather than in its usual sense 'buckets.'
    reason: lexical_alternative
  - marker: b
    text: '''His seed'' may also be understood as ''his offspring'' or ''his descendants''; the Hebrew can evoke both progeny and fertility imagery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 물동이에서 물이 흘러나오고, 그의 씨는 많은 물 가운데 있을 것이며, 그의 왕은 아각보다 높아질 것이고, 그의 왕국은 높여질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물동이’는 דָּלִי의 기본적 의미를 따른 번역입니다. 일부는 이를 비유적으로 ‘가지들’로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘씨’는 여기서 ‘자손’ 또는 ‘후손’으로도 이해될 수 있습니다. 히브리어는 농경적 번성과 생식의 이미지를 함께 불러올 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל מַיִם מִדָּלְיוֹ
  english_pob_choice: Water will flow from his buckets
  chosen_korean: 그의 물동이에서 물이 흘러나오고
  alternatives_korean:
  - 그의 양동이에서 물이 흘러내리고
  - 그의 가지에서 물이 흘러나오고
  lexicon: HALOT
  rationale: דָּלִי의 기본 의미를 따라 물을 길어 올리는 그릇인 ‘물동이’로 옮겼고, ‘흘러나오고’로 물의 지속적 흐름을 살렸습니다.
- source_word: וְזַרְעוֹ
  english_pob_choice: and his seed
  chosen_korean: 그의 씨는
  alternatives_korean:
  - 그의 자손은
  - 그의 후손은
  lexicon: HALOT
  rationale: זֶרַע의 농경적·후손적 이중 의미를 살리기 위해 ‘씨’를 유지해, 번성과 자손의 이미지를 함께 열어 두었습니다.
- source_word: בְּמַיִם רַבִּים
  english_pob_choice: in abundant waters
  chosen_korean: 많은 물 가운데
  alternatives_korean:
  - 풍성한 물 속에
  - 많은 물 위에
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ의 공간적 감각을 살려 ‘가운데’로 옮겼고, ‘많은 물’은 풍요와 번성의 배경을 드러냅니다.
- source_word: וְיָרֹם מֵאֲגַג מַלְכּוֹ
  english_pob_choice: his king will be higher than Agag
  chosen_korean: 그의 왕은 아각보다 높아질 것이고
  alternatives_korean:
  - 그의 왕은 아각 위에 있을 것이고
  - 그의 왕은 아각보다 뛰어날 것이고
  lexicon: HALOT
  rationale: רוּם의 높이/우월성 표현을 비교구문으로 살려 ‘보다 높아질 것’으로 옮겼습니다.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  english_pob_choice: and his kingdom will be exalted
  chosen_korean: 그의 왕국은 높여질 것입니다
  alternatives_korean:
  - 그의 나라가 높임을 받을 것입니다
  - 그의 통치가 높여질 것입니다
  lexicon: HALOT
  rationale: מַלְכוּת를 ‘왕국’으로 유지해 정치적·공동체적 범위를 보존했고, נשׂא의 수동적 상승을 ‘높여질 것입니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘his seed’의 의미 범위
  chosen_reading: ‘그의 씨’로 직역해 자손과 번성의 중첩을 보존했습니다.
  alternative_readings:
  - 그의 자손
  - 그의 후손
  rationale: 문맥이 농경적 번성과 혈통적 후손을 함께 암시하므로, 하나로 좁히지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘his king’과 아각의 관계
  chosen_reading: 메시아적 확정이나 특정 역사 인물을 본문에 삽입하지 않고, 단순히 ‘그의 왕’을 높아질 존재로 두었습니다.
  alternative_readings:
  - 이스라엘의 장차 왕정에 대한 예고
  - 메시아적 예표
  rationale: 본문 자체는 왕의 정체를 명시하지 않으므로, 번역은 해석을 미리 단정하지 않고 소스가 허용하는 범위에 머뭅니다.
  doctrine_reference: Translation philosophy §1 and §3
