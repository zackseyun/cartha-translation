id: NUM.24.16
reference: Numbers 24:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
  footnotes:
  - marker: a
    text: Or 'the oracle of one who hears the sayings of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'falling down, with eyes uncovered'; some understand this as a visionary trance state.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 말씀을 듣고 지극히 높으신 이의 지식을 알며 전능자의 환상을 보는 이, 엎드러져 있으면서 눈이 열린 이의 선포입니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 말들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘눈이 열린 채 엎드러져 있는 이’. 일부는 이를 환상을 보는 황홀 상태로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  english_pob_choice: the declaration of
  chosen_korean: 선포이며
  alternatives_korean:
  - 선언이며
  - 신탁이며
  - 말씀이며
  lexicon: HALOT
  rationale: 예언적 첫머리의 격식을 살리되, 현대 한국어에서 자연스럽고 무게가 있는 표현으로 처리했습니다.
- source_word: אִמְרֵי אֵל / אֵל
  english_pob_choice: the words of God / God
  chosen_korean: 하나님의 말씀을
  alternatives_korean:
  - 하나님의 말들을
  - 하나님의 말씀들을
  - 엘의 말씀을
  lexicon: HALOT
  rationale: אֵל은 문맥상 고유명사보다 일반적인 신칭으로 이해되므로 하나님으로 옮겼고, אִמְרֵי는 복수적 뉘앙스를 살리되 한국어에서는 ‘말씀’을 사용했습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: HALOT
  rationale: 직역적 위계를 살리면서도 예배적 호칭으로 자연스럽게 들리도록 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 샤다이
  lexicon: HALOT
  rationale: POB의 제목 번역 원칙에 따라 음역보다 의미를 살렸고, 시적 병행을 위해 간결한 명사형을 택했습니다.
- source_word: נֹפֵל וּגְלוּי עֵינָיִם
  english_pob_choice: falling down, yet with uncovered eyes
  chosen_korean: 엎드러져 있으면서도 눈은 열려 있습니다
  alternatives_korean:
  - 엎드린 채 눈이 열린 상태입니다
  - 쓰러져 있으면서 눈은 열려 있습니다
  - 환상 중에 눈을 뜨고 있습니다
  lexicon: HALOT
  rationale: נֹפֵל의 ‘떨어지다/엎드러지다’와 וּגְלוּי עֵינָיִם의 생생한 이미지를 살리면서, 본문이 허용하는 범위 안에서 한국어로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 신적 칭호의 번역
  chosen_reading: אֵל, עֶלְיוֹן, שַׁדַּי를 각각 하나님의 말씀, 지극히 높으신 이, 전능자로 옮겼습니다.
  alternative_readings:
  - 엘/엘리온/샤다이로 음역
  - 하나님/가장 높으신 분/전능하신 이
  rationale: 프로젝트 원칙에 따라 칭호는 의미를 드러내는 번역을 우선했고, 이 절의 시적 자기소개를 한국어로 즉시 이해되게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
