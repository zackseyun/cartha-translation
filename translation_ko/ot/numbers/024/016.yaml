  source_fidelity: 원문은 נְאֻם(‘…의 선포/신탁’) 아래에 ‘듣는 자, 아는 자, 보는 자, 엎드러진 자이며 눈이 열린 자’라는 묘사를 연속하여 붙입니다. 초안은 ‘선포이며’ 뒤에 새 주어를 두고 마지막을 유한동사로 끝내어 이 수식 구조가 흐려졌습니다. 또한 וְ는 본문에서 명시적인 양보 접속사가 아니므로 ‘그러면서도’보다 단순 병렬로 옮기는 것이 안전합니다.
  naturalness: 수정문은 한국어의 ‘…의 선포입니다’라는 자연스러운 표지 아래 모든 묘사를 같은 인물에게 연결합니다. 현대 문어체 합쇼체를 유지하며, 절의 콜론도 원문의 계속되는 발언을 적절히 나타냅니다.
  terminology: ‘하나님’, ‘지극히 높으신 이’, ‘전능자’는 각각 אֵל, עֶלְיוֹן, שַׁדַּי의 신적 칭호를 뜻으로 옮긴 것으로 적절합니다. ‘환상’은 מַחֲזֵה에 적합합니다. ‘눈이 열린’은 직역적 이미지를 보존하며, ‘황홀 상태’는 본문이 아니라 주석에서만 가능성으로 제시합니다.
