  naturalness: ‘손뼉을 쳤습니다’는 현대 한국어에서 박수의 긍정적 의미가 먼저 떠오를 수 있습니다. 분노의 몸짓임을 자연스럽고 구체적으로 드러내도록 ‘두 손을 마주쳐 쳤습니다’로 고쳤습니다. 불필요하게 대립적으로 들릴 수 있는 ‘당신’은 한국어의 자연스러운 목적어 생략으로 처리했습니다.
  terminology: 발락, 발람, 저주, 축복은 통용되는 성경 인명 및 핵심 용어로 유지했습니다.
