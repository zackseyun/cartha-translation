base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
  footnotes:
  - marker: a
    text: Hebrew literally, 'you have blessed, blessed,' an emphatic construction expressing repeated or intensified blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 발락의 분노가 발람을 향해 타올랐고, 그는 두 손을 마주쳐 쳤습니다. 발락이 발람에게 말했습니다. “내가 내 원수들을 저주하려고 그대를 불렀는데, 보십시오—그들을 세 번이나 거듭 축복했습니다[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘축복했다, 축복하여’라는 동사와 부정사 절대형의 결합이 쓰여, 축복 행위를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: anger burned
  chosen_korean: 크게 화를 내며
  alternatives_korean:
  - 분노가 타올라
  - 화가 치밀어
  lexicon: HALOT
  rationale: 히브리어 관용구의 분노-불탐 이미지를 직접 옮기되, 한국어에서는 자연스러운 서술로 풀어 발락의 격앙된 반응을 살렸습니다.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  english_pob_choice: he struck his hands together
  chosen_korean: 손뼉을 쳤습니다
  alternatives_korean:
  - 두 손바닥을 쳤습니다
  - 손을 마주쳤습니다
  lexicon: HALOT
  rationale: 행위 자체는 ‘치다/박수치다’이지만, 여기서는 칭찬이 아니라 분노의 몸짓이므로 직역보다 기능을 살린 표현을 택했습니다.
- source_word: לָקֹב
  english_pob_choice: to curse
  chosen_korean: 저주하라고
  alternatives_korean:
  - 저주를 내리라고
  - 저주하게 하라고
  lexicon: HALOT
  rationale: 발락이 발람을 부른 목적이 저주임을 분명하게 드러내는 것이 가장 직접적이어서 기본 의미를 유지했습니다.
- source_word: בֵּרַכְתָּ בָרֵךְ
  english_pob_choice: you have indeed blessed them
  chosen_korean: 복을 빌어 주었습니다
  alternatives_korean:
  - 분명히 복 주었습니다
  - 복 주고 또 복 주었습니다
  lexicon: HALOT
  rationale: 히브리어의 강조 구조를 한국어에서 어색하지 않게 반복이 아닌 강조로 옮겼습니다. 여기서는 결과적으로 상대를 ‘복되게 말하다/축복하다’는 뜻을 살렸습니다.
