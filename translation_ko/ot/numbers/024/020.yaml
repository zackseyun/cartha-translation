  lexicon: HALOT
  rationale: ראה의 기본 의미를 살리면서, 히브리어 روایت 흐름을 자연스럽게 이어 주기 위해 ‘보고’로 옮겼습니다.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  english_pob_choice: took up his discourse
  chosen_korean: 자기의 말을 인하여 말하기를 시작하여
