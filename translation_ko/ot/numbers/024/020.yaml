  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
  footnotes:
  - marker: a
    text: Or “foremost among the nations”; the Hebrew phrase may indicate either priority in time or preeminence.
    reason: lexical_alternative
  - marker: b
    text: Or “took up his oracle” or “uttered his proverb”; the Hebrew term can denote a poetic saying, proverb, taunt, or oracle.
    reason: lexical_alternative
  - marker: c
    text: Or “his end is to perish” or “his latter end is destruction”; the Hebrew expression is concise and emphasizes complete ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아말렉을 보고, 자신의 말을 꺼내어 말했습니다.[b] “아말렉은 민족들의 첫째였으나,[a] 그의 끝은 철저한 멸망입니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들의 첫째’는 ‘민족들 가운데 첫째’ 또는 ‘민족들 가운데 으뜸’으로도 옮길 수 있습니다. 히브리어 표현은 시간적으로 먼저였다는 뜻과 탁월하거나 선두였다는 뜻을 모두 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘마샬’(מָשָׁל)은 비유, 속담, 풍자적 말, 시적인 발화, 또는 신탁을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘철저한 멸망’은 ‘멸망’, ‘파멸’, 또는 ‘멸절’로도 옮길 수 있는 압축된 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  english_pob_choice: Then he saw Amalek
  chosen_korean: 그가 아말렉을 보고
  alternatives_korean:
