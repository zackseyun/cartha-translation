  rationale: מָשָׁל은 비유·속담·신탁 등 넓은 범위를 가지므로, 장르를 단정하지 않고 예언적 발화의 시작을 드러내는 표현으로 처리했습니다.
- source_word: רֵאשִׁית גּוֹיִם
  english_pob_choice: the first of the nations
  chosen_korean: 여러 민족의 첫째
  alternatives_korean:
  - 민족들 가운데 첫째
  - 민족들의 으뜸
  lexicon: HALOT
  rationale: רֵאשִׁית의 ‘첫째/첫’과 ‘으뜸’의 양가성을 보존하기 위해, 시간적 우선성과 우월성 중 어느 쪽으로도 과도하게 못 박지 않는 표현을 택했습니다.
- source_word: עֲדֵי אֹבֵד
  english_pob_choice: is utter destruction
  chosen_korean: 철저한 멸망입니다
  alternatives_korean:
  - 완전한 파멸입니다
  - 끝내 멸망입니다
  lexicon: HALOT
  rationale: אָבֵד의 ‘멸망/멸절’ 의미와 עֲדֵי의 종착성을 살리되, 한국어에서 자연스럽고 강한 종결감을 주는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘여러 민족의 첫째’의 의미 범위
  chosen_reading: 시간적 첫째와 탁월성의 가능성을 둘 다 열어 둔 채 번역했습니다.
  alternative_readings:
  - 아말렉은 민족들 가운데 가장 먼저였다
  - 아말렉은 민족들 가운데 으뜸이었다
  rationale: 히브리어 표현이 시간적 우선인지, 위상상 선두인지 본문만으로는 확정되지 않으므로, 해석을 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
