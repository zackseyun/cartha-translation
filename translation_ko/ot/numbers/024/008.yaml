  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
  footnotes:
  - marker: a
    text: Or 'the strength of a wild ox.' The Hebrew phrase כְּתוֹעֲפֹת רְאֵם is difficult; traditional versions often render the image more generally as strength rather than explicitly as horns.
    reason: lexical_alternative
  - marker: b
    text: Or 'will break their bones' or 'will strip their bones bare.' The Hebrew verb יְגָרֵם is rare and its precise nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그를 이집트에서 이끌어 내십니다. 그에게는 들소의 뿔 같은 위력이 있습니다[a]. 그는 그의 대적들인 민족들을 삼킬 것이며, 그들의 뼈를 갉아먹고[b] 그의 화살로 그들을 부술 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들소의 힘’. 히브리어 כְּתוֹעֲפֹת רְאֵם은 해석하기 어려운 표현으로, 전통적으로는 ‘뿔’보다 일반적인 ‘힘’으로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 뼈를 부술 것이다’ 또는 ‘그들의 뼈에서 살을 발라 낼 것이다’. 히브리어 יְגָרֵם은 드물게 쓰여 정확한 뉘앙스가 불확실합니다.
    reason: lexical_alternative
