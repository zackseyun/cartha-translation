revisions:
- from: 하나님은 그들을 애굽에서 이끌어 내시니, 그분은 그들을 위해 들소의 뿔을 가지셨도다. 그분은 그들을 대적하는 민족들을 삼키시며, 그들의 뼈를 갉아먹고 그분의 화살로 그들을 꺾으시리라.
  to: 하나님께서 그를 이집트에서 이끌어 내십니다. 그에게는 들소의 뿔 같은 위력이 있습니다[a]. 그는 그의 대적들인 민족들을 삼킬 것이며, 그들의 뼈를 갉아먹고[b] 그의 화살로 그들을 부술 것입니다.
  rationale: 원문의 단수 대명사를 일관되게 보존하여 그가 집합적 이스라엘인지 대표적 인물인지를 확정하지 않았습니다. 들소의 뿔 이미지는 ‘뿔 같은 위력’으로 자연스럽게 옮기되, 대안 독법을 각주에 남겼습니다. 전투 시의 ‘삼키다/뼈를 갉아먹다/화살로 부수다’라는 시적이고 거친 비유도 완화하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:24Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 모든 대명사는 단수인데 초안은 이를 반복하여 복수(‘그들을’)로 바꾸어, 본문의 의도적으로 열어 둔 지시 대상의 단수성을 훼손합니다. 또한 ‘들소의 뿔’은 하나님이 가지신 것이 아니라 그에게 주어진 위력의 비유이며, 초안의 과거형 ‘가지셨도다’는 히브리어의 현재적 시적 진술과도 맞지 않습니다.
  naturalness: 초안은 합쇼체 문장 안에 ‘가지셨도다’가 섞여 있어 현대적 격식체의 일관성이 약합니다. 수정문은 현대 표준어 합쇼체로, 시적 이미지와 문장 흐름을 유지합니다.
  terminology: ‘애굽’보다 현대 표준 지명인 ‘이집트’를 사용했습니다. רְאֵם은 ‘들소’로 옮기고, 어려운 ‘뿔/힘’ 이미지는 본문과 각주에서 함께 보존했습니다. ‘대적들인 민족들’은 ‘그의 대적들인 나라들’이라는 원문의 관계를 드러냅니다.
  issues:
  - severity: high
    issue: 단수 대명사가 복수로 변경됨
    rationale: מוֹצִיאוֹ, לוֹ, צָרָיו, וְחִצָּיו는 모두 단수 접미사를 지닙니다. 초안의 ‘그들을’은 지시 대상을 이스라엘 백성으로 확정하고 복수화하여 원문의 모호성을 해소해 버립니다.
  - severity: high
    issue: 들소 이미지의 소유자와 시제가 부정확함
    rationale: ‘그분은 그들을 위해 들소의 뿔을 가지셨도다’는 하나님이 뿔을 소유한다는 뜻이 되며 과거형입니다. 원문은 그 단수 지시 대상에게 들소의 뿔 같은 위력이 있음을 말합니다.
  - severity: medium
    issue: 현대 합쇼체 register 혼용
    rationale: ‘가지셨도다’는 현대적 격식체 문장인 ‘내시니/하시리라’와 조화되지 않습니다. 일관되게 ‘-습니다/-것입니다’ 체로 정리하는 것이 목표 변종에 맞습니다.
  - severity: low
    issue: 희귀 동사와 들소 이미지에 각주가 없음
    rationale: יְגָרֵם 및 כְּתוֹעֲפֹת רְאֵם은 의미가 논쟁적이므로, 본문 번역을 단정적으로 과도하게 좁히지 않도록 대안을 각주로 제시해야 합니다.
