  naturalness: 합쇼체는 대체로 적절하나, ‘그것이 … 쳐부수고’는 사람을 가리키는 앞 절과 왕권 표상 사이의 연결을 한국어에서 다소 부자연스럽게 만듭니다. 별과 왕홀을 병렬 주어로 유지하여 후속 동작을 연결하면 더 자연스럽고 원문의 상징성도 보존됩니다.
