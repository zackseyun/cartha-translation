reference: Numbers 24:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
  footnotes:
  - marker: a
    text: Or 'A star rises from Jacob, and a scepter arises from Israel.' The Hebrew uses royal imagery that can be read as referring to a coming ruler.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the corners of Moab,' likely a figurative expression for Moab's extremities or strength.
    reason: cultural_note
  - marker: c
    text: Or 'all the sons of Seth.' The Hebrew שֵׁת may be read as the proper name Seth/Sheth; some understand it more broadly as a poetic designation for humanity or for a hostile people.
    reason: alternative_reading
translation:
  language: ko
  text: “내가 그를 봅니다. 그러나 지금은 아닙니다. 내가 그를 바라봅니다. 그러나 가까이 있지는 않습니다. 한 별이 야곱에게서 나오며, 한 왕홀이 이스라엘에게서 일어나 모압의 모퉁이들을 쳐부수고[b] 셋의 모든 자손을 무너뜨릴 것입니다.”[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별’과 ‘왕홀’은 장차 올 통치자 또는 왕권을 가리키는 상징적 표현으로 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘모압의 모퉁이들’입니다. 이는 모압의 가장자리 또는 힘을 가리키는 비유적 표현일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘셋’은 고유명사 셋으로 읽을 수 있습니다. 히브리어 שֵׁת를 더 넓게 인류를 가리키는 시어 또는 어떤 적대 집단을 가리키는 말로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ / אֲשׁוּרֶנּוּ
  english_pob_choice: I see him / I behold him
  chosen_korean: “내가 그를 봅니다. … 내가 그를 봅니다.”
  alternatives_korean:
  - “내가 그를 봅니다. … 내가 그를 바라봅니다.”
  - “내가 그를 봅니다. … 내가 그를 살핍니다.”
  lexicon: HALOT
  rationale: 두 동사는 모두 1인칭 화자와 남성 단수 대상을 가리키므로, 한국어에서는 같은 동사 ‘보다’를 반복하되 문장 리듬으로 평행법을 살렸습니다. ‘behold’의 격조는 문맥상 예언적 선언의 장중함으로 충분히 드러납니다.
- source_word: עַתָּה / קָרוֹב
  english_pob_choice: now / near
  chosen_korean: “지금은 아닙니다 / 가까이 있지 않습니다”
  alternatives_korean:
  - “지금이 아닙니다 / 가깝지 않습니다”
  - “이때가 아닙니다 / 멀지 않습니다”
  lexicon: HALOT
  rationale: 시간 부사와 형용사를 각각 현대 한국어로 자연스럽게 살리되, ‘가까이’로 거리와 시기의 이중 뉘앙스를 보존했습니다. ‘soon’처럼 좁히지 않고 원문의 열린 의미를 유지했습니다.
- source_word: כּוֹכָב / שֵׁבֶט
  english_pob_choice: A star / a scepter
  chosen_korean: “한 별… 한 홀이”
  alternatives_korean:
  - “한 별… 한 지팡이”
  - “한 별… 한 왕홀”
  lexicon: HALOT
  rationale: כּוֹכָב은 문자 그대로 ‘별’로, 상징을 본문 안에서 보존했습니다. שֵׁבֶט은 왕권 상징으로 쓰였으므로 ‘홀’로 옮겨 통치 표지를 살리되, ‘지팡이’처럼 일반화하지 않았습니다.
- source_word: פַּאֲתֵי מוֹאָב / וְקַרְקַר
  english_pob_choice: the corners of Moab / tear down
  chosen_korean: “모압의 모퉁이들을 쳐부수고 … 무너뜨릴 것입니다”
  alternatives_korean:
  - “모압의 모퉁이들을 무너뜨리고 … 헐어버릴 것입니다”
  - “모압의 가장자리를 쳐부수고 … 파괴할 것입니다”
  lexicon: HALOT
  rationale: ‘모퉁이들’은 פַּאֲתֵי의 공간적 은유를 가장 투명하게 살립니다. 희귀 동사 קַרְקַר는 확정성을 과하게 높이지 않으면서 전쟁 맥락에 맞는 ‘무너뜨리다’로 처리했습니다.
- source_word: בְּנֵי שֵׁת
  english_pob_choice: all the sons of Sheth
  chosen_korean: “셋의 모든 자손”
  alternatives_korean:
  - “셋의 모든 아들들”
  - “셋의 모든 사람들”
  lexicon: HALOT
  rationale: 자음상 고유명사 읽기를 따라 ‘셋’으로 음역하되, 한국어에서는 문어적 자연성을 위해 ‘자손’으로 옮겼습니다. 보편적 인류나 적대 집단으로 확장하는 해석은 본문이 허용하는 범위를 넘어가므로 본문에 남기고 주석으로만 열어 둡니다.
theological_decisions:
- issue: 예언의 메시아적 암시를 본문에서 얼마나 드러낼지
  chosen_reading: 왕권 상징(별, 홀)을 본문에 그대로 유지하고, 메시아를 명시적으로 삽입하지 않았습니다.
  alternative_readings:
  - ‘메시아’를 직접 밝혀 번역하기
  - 다윗 같은 역사적 왕으로만 한정하기
  rationale: 히브리어는 장차 올 통치자를 암시하는 상징적 언어를 쓰지만, 번역문이 해석을 앞질러 특정 인물명을 넣지는 않도록 했습니다. 이렇게 해야 본문이 지닌 예언적 긴장과 다층성이 유지됩니다.
  doctrine_reference: Translation philosophy §3; Affirmations
