  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
  footnotes:
  - marker: a
    text: Or 'aloewood' or 'lign aloes'; the Hebrew refers to fragrant trees, not to tents.
    reason: lexical_alternative
translation:
  language: ko
  text: 계곡들처럼 펼쳐지고, 강가의 동산들처럼, 야훼께서 심으신 침향나무들처럼, 물가의 백향목들처럼.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 천막이 아니라 향기로운 나무/목재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  english_pob_choice: valleys
  chosen_korean: 계곡들
  alternatives_korean:
  - 와디들
  - 급류 골짜기들
  lexicon: HALOT
  rationale: נחל은 물길과 연관된 골짜기, 와디, 계곡을 가리킬 수 있으므로, 시적 비유에서는 자연스러운 ‘계곡들’이 이미지의 넓게 펼쳐짐을 잘 살립니다.
- source_word: נִטָּיוּ
  english_pob_choice: they spread out
  chosen_korean: 펼쳐지고
  alternatives_korean:
  - 늘어지고
  - 확장되고
  lexicon: HALOT
  rationale: נטה의 ‘펴다, 늘이다’의 의미를 한국어로 간결하게 옮기되, 사람/진영이 넓게 전개되는 장면을 살리기 위해 ‘펼쳐지고’로 렌더링했습니다.
- source_word: אֲהָלִים
  english_pob_choice: aloes
  chosen_korean: 침향나무들
  alternatives_korean:
  - 알로에들
  - 침향목들
  lexicon: HALOT
  rationale: 문맥상 ‘천막’이 아니라 향기로운 나무/목재를 가리키므로, 오해를 줄이기 위해 한국어에서 뜻이 드러나는 ‘침향나무들’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 관례적 대체어가 아닌 음역 ‘야훼’로 옮겨, 본문의 언약적 신명성을 보존했습니다.
theological_decisions:
- issue: אֲהָלִים의 식물 의미와 전통적 ‘천막’ 의미의 긴장
  chosen_reading: ‘침향나무들’로 옮겨, 시적 비유가 향기로운 수목의 이미지임을 드러냈습니다.
  alternative_readings:
  - 천막들
  - 알로에들
  - 침향목들
  rationale: 본문의 비유는 천막이 아니라 향기로운 나무의 풍성함을 말하므로, 문맥에 맞는 식물 의미를 살리는 것이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 시적 본문 해석 원칙
