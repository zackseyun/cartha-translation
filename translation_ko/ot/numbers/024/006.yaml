  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
  footnotes:
  - marker: a
    text: Or 'aloewood' or 'lign aloes'; the Hebrew refers to fragrant trees, not to tents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 계곡들처럼 펼쳐져 있고, 강가의 동산들 같고, 야훼께서 심으신 침향나무들[a] 같으며, 물가의 백향목들 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 천막들이 아니라 향기로운 나무 또는 목재를 가리킵니다. ‘알로에목’ 또는 ‘침향목’으로도 옮길 수 있습니다.
    reason: lexical_alternative
