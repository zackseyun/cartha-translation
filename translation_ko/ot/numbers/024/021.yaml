base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
  footnotes:
  - marker: a
    text: Or “he took up his oracle.” The Hebrew מָשָׁל can denote a proverb, taunt, or prophetic utterance; here it refers to Balaam’s poetic oracle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 켄 사람을 보고 자기의 말을 들어 말했습니다. “네 거처는 견고하고, 네 둥지는 바위에 놓여 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기의 신탁을 들어 말했습니다.” 히브리어 מָשָׁל은 격언, 풍자, 예언적 발화를 가리킬 수 있으며, 여기서는 발람의 시적 선언을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  english_pob_choice: the Kenite
  chosen_korean: 켄 사람
  alternatives_korean:
  - 겐 사람
  - 케니 사람
  - 켄족
  lexicon: HALOT
  rationale: 히브리어 단수 정관사형을 집합적 개념으로 읽되, 한국어에서는 고유 종족명보다 설명적인 표현이 자연스러워 ‘켄 사람’으로 옮겼습니다.
- source_word: מְשָׁלוֹ
  english_pob_choice: his discourse
  chosen_korean: 자기의 말
  alternatives_korean:
  - 자기의 신탁
  - 자기의 우화
  - 자기의 격언
  lexicon: HALOT
  rationale: Balaam의 시적 발화라는 점은 살리되, 한국어에서는 ‘말했습니다’와 맞물리도록 과도하게 전문적인 ‘신탁’보다 넓은 ‘말’을 택했습니다.
- source_word: אֵיתָן
  english_pob_choice: enduring
  chosen_korean: 견고하고
  alternatives_korean:
  - 영속적인
  - 튼튼한
  - 변함없는
  lexicon: HALOT
  rationale: 문맥상 거처의 지속성과 안전성을 함께 드러내므로, 물리적 견고함을 포함하는 ‘견고하고’가 적절합니다.
- source_word: וְשִׂים בַּסֶּלַע קִנֶּךָ
  english_pob_choice: your nest is set in the rock
  chosen_korean: 네 둥지는 바위에 놓여 있습니다
  alternatives_korean:
  - 네 둥지는 바위에 있습니다
  - 네 둥지는 바위에 세워져 있습니다
  - 바위에 네 둥지를 두었습니다
  lexicon: HALOT
  rationale: 히브리어의 시적 진술을 한국어 자연어로 풀어, ‘둥지’ 이미지와 바위의 안전한 위치를 그대로 보존했습니다.
theological_decisions:
- issue: 'מָשָׁל의 성격: 단순한 격언인지, 예언적 발화인지'
  chosen_reading: 발람의 시적 예언 발화로 이해하되, 본문에는 중립적으로 ‘자기의 말’로 반영했습니다.
  alternative_readings:
  - 자기의 신탁
  - 자기의 격언
  rationale: 문맥상 발람의 길고 격식 있는 시적 선언이므로 예언적 성격을 지니지만, 한국어 본문에서는 지나치게 해석을 고정하지 않도록 표현을 절제했습니다.
  doctrine_reference: 민수기 22–24장의 발람 예언 서술
