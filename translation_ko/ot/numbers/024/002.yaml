    rationale: 원문은 ‘이스라엘’이라는 집합체가 지파별로 배열되어 있는 모습을 말합니다. 복수 대명사 ‘그들이’와 재귀적 ‘자기’는 한국어에서 선행사를 흐리게 하며, ‘지파별로’가 더 직접적입니다.
