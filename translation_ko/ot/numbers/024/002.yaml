reference: Numbers 24:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
  footnotes:
  - marker: a
    text: Or 'camped by its tribes' or 'tribe by tribe.'
    reason: lexical_alternative
  - marker: b
    text: Or 'God's spirit was upon him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 발람이 눈을 들어 이스라엘이 지파별로 거주하고 있는 것을 보았습니다.[a] 하나님의 영이 그에게 임했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지파별로 진을 치고’ 또는 ‘지파마다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 영이 그에게 있었습니다’라고 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 치켜들고
  - 눈을 들어 올리고
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 단순히 '보다'로 평평하게 만들지 않고 시선의 이동을 살렸습니다.
- source_word: שֹׁכֵן
  english_pob_choice: dwelling
  chosen_korean: 거주하고 있었습니다
  alternatives_korean:
  - 장막을 치고 있었습니다
  - 거하고 있었습니다
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 질서 잡힌 주거/진영 상태를 가리키므로, 전면적으로 '진을 쳤다'고 못 박기보다 현재 진행의 거주 상태를 드러냈습니다.
- source_word: לִשְׁבָטָיו
  english_pob_choice: according to its tribes
  chosen_korean: 자기 지파들에 따라
  alternatives_korean:
  - 지파별로
  - 자기 지파에 따라
  lexicon: HALOT
  rationale: ל의 배치/분포 의미를 살려 질서 있게 배열된 모습을 전달했습니다. 이스라엘을 집합 명사로 보아 복수 '지파들'을 썼습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 바람
  lexicon: HALOT
  rationale: 히브리어 원문은 문맥상 신적 영의 임재를 뜻하지만, 여기서는 기사체 서술이므로 한국어에서 가장 직접적인 '하나님의 영'이 적절합니다. '성령'은 본문이 명시하지 않는 신약적 고정 표현을 덧씌울 수 있어 피했습니다.
- source_word: וַתְּהִי עָלָיו
  english_pob_choice: came upon him
  chosen_korean: 그에게 임했습니다
  alternatives_korean:
  - 그 위에 있었습니다
  - 그에게 내렸습니다
  lexicon: HALOT
  rationale: 예언적 맥락에서 영의 능동적 임재를 나타내는 관용을 한국어로 자연스럽게 살렸습니다. 단순 상태인 '있었습니다'보다 도착·임재의 동태가 드러납니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים의 번역에서 영의 임재를 어떻게 표현할지
  chosen_reading: 하나님의 영이 그에게 임했습니다
  alternative_readings:
  - 그에게 하나님의 영이 있었습니다
  - 하나님의 영이 그 위에 있었습니다
  rationale: 발람의 예언 직전이라는 문맥은 하나님의 영이 예언 능력을 부여하는 장면으로 읽히므로, 상태보다 임재와 작용을 드러내는 표현을 택했습니다. 그러나 본문은 발람의 성품을 미화하지 않으므로 그 긴장은 유지했습니다.
  doctrine_reference: 예언적 영감과 본문의 문맥적 긴장 유지
