revisions:
- from: 그러자 발람이 눈을 들어 이스라엘을 보았는데, 그들이 자기 지파들에 따라 거주하고 있었습니다. 그리고 하나님의 영이 그에게 임했습니다.[a][b]
  to: 그러자 발람이 눈을 들어 이스라엘이 지파별로 거주하고 있는 것을 보았습니다.[a] 하나님의 영이 그에게 임했습니다.[b]
  rationale: 원문의 관용구 ‘눈을 들어’, 이스라엘의 지파별 배치, 그리고 하나님의 영이 발람에게 임하는 예언적 표현을 유지했습니다. ‘그들이 자기 지파들에 따라’를 ‘이스라엘이 지파별로’로 고쳐 집합 명사의 의미와 한국어의 명료성을 함께 살렸으며, 각주 표지를 해당 표현에 배치했습니다.
