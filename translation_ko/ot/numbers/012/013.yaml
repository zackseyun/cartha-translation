  lexicon: HALOT
  rationale: 기도문에서의 직접 호격이므로, 단순 서술이 아니라 부름의 뉘앙스를 반영해 「오 하나님」으로 옮겼습니다.
- source_word: רְפָא
  english_pob_choice: heal
  chosen_korean: 고쳐 주십시오
  alternatives_korean:
