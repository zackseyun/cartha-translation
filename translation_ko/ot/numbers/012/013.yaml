lexical_decisions:
- source_word: וַיִּצְעַק
  english_pob_choice: cried out
  chosen_korean: 부르짖으며
  alternatives_korean:
  - 외치며
  - 크게 부르며
  lexicon: HALOT
  rationale: צעק은 단순히 말한 것이 아니라 절박하게 부르짖는 행동을 뜻하므로, 모세의 간구의 긴급함을 살리는 「부르짖으며」가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 전통적 호칭이 아니라 고유한 신명 표기를 살려 「야훼」로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: O God
  chosen_korean: 오 하나님
  alternatives_korean:
  - 하나님
  - 오 전능하신 하나님
  lexicon: HALOT
  rationale: 기도문에서의 직접 호격이므로, 단순 서술이 아니라 부름의 뉘앙스를 반영해 「오 하나님」으로 옮겼습니다.
- source_word: רְפָא
  english_pob_choice: heal
  chosen_korean: 고쳐 주십시오
  alternatives_korean:
  - 치유해 주십시오
  - 낫게 해 주십시오
  lexicon: HALOT
  rationale: 질병 일반보다 당시 미리암의 상태를 회복시키는 간청이므로, 보다 직접적인 동사로 「고쳐 주십시오」를 택했습니다.
theological_decisions:
