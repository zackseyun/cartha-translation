  source_fidelity: 히브리어 ענו는 여기서 모세의 낮춤·겸손의 성품을 가리키므로 ‘온유했습니다’보다 ‘겸손했습니다’가 더 직접적입니다. 또한 מְאֹד와 ‘모든 사람보다’의 비교를 한 문장 안에서 결합하는 편이 원문의 강조와 비교를 명료하게 전달합니다.
  naturalness: 초안의 ‘그 사람 모세’와 ‘그는 … 그러했습니다’는 현대 한국어에서 지시 대상과 비교 내용이 다소 어색하게 분리됩니다. 이름을 주어로 삼고 비교 구문을 직접 서술하면 표준어 합쇼체로 자연스럽습니다.
