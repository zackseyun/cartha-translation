id: NUM.12.3
reference: Numbers 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: Now the man Moses was very humble[a], more than any man who was on the face of the earth.
  footnotes:
  - marker: a
    text: Or 'more than any person'; Hebrew 'man' here has a generic sense referring to human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람 모세는 매우 온유했습니다. 그는 땅 위의 어느 누구보다도 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어느 누구’는 히브리어의 ‘사람/인간’에 해당하는 포괄적 의미를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/אִישׁ
  english_pob_choice: Now the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 이 사람
  - 그리고 그 사람
  lexicon: HALOT
  rationale: אָנָשׁ/אִישׁ의 정관적 서두를 한국어에서는 서술 흐름을 살려 ‘그 사람’으로 자연스럽게 옮겼습니다. ‘이 사람’은 시점상 어색하고, ‘그리고’는 본문의 서술 도입 효과를 약하게 합니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: 표준 성서 인명 관행
  rationale: 히브리어 인명은 한국어 성서에서 확립된 ‘모세’를 따르는 것이 가장 자연스럽습니다.
- source_word: ענו
  english_pob_choice: humble
  chosen_korean: 온유했습니다
  alternatives_korean:
  - 겸손했습니다
  - 비천했습니다
  - 온화했습니다
  lexicon: HALOT
  rationale: 이 형용사는 문맥상 모세의 성품을 가리키며, 한국어에서 ‘온유하다’는 전통적 ‘meek’보다 부드럽지만 약함만을 뜻하지 않아 본문의 강도를 비교적 잘 살립니다. 다만 ‘겸손하다’도 가능하므로 그 선택지는 주석으로 남길 수 있습니다.
- source_word: מִ/כֹּל הָאָדָם
  english_pob_choice: more than any man
  chosen_korean: 어느 누구보다도
  alternatives_korean:
  - 어떤 사람보다도
  - 모든 사람보다도
  lexicon: HALOT
  rationale: מִן + כֹּל의 비교구문을 한국어에서는 자연스러운 최상급 비교인 ‘어느 누구보다도’로 옮겼습니다. 영어 POB의 남성형 ‘man’이 히브리어에서 일반적 인간을 가리키는 점은 한국어에서 포괄적 대명사로 반영했습니다.
- source_word: עַל פְּנֵי הָאֲדָמָה
  english_pob_choice: on the face of the earth
  chosen_korean: 땅 위의
  alternatives_korean:
  - 지면 위의
  - 세상에 있는
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 직역하면 다소 무거워지므로, 의미를 유지하면서도 자연스러운 ‘땅 위의’로 옮겼습니다.
theological_decisions:
- issue: 모세의 성품 표현인 ענו의 한국어 register
  chosen_reading: ‘온유했습니다’로 옮겨 성품의 덕목을 드러냈습니다.
  alternative_readings:
  - ‘겸손했습니다’
  - ‘온순했습니다’
  rationale: 이 구절은 모세의 인격적 태도를 평가하는 문장이므로, 한국어에서 교회적 덕목 용어인 ‘온유’가 본문의 평가성과 비교급 구조를 함께 전달합니다.
  doctrine_reference: 성품/덕목 표현의 문맥 우선 원칙
