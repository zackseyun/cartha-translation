  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
  footnotes:
  - marker: a
    text: Or 'in all my household.' The Hebrew 'house' can refer to a household or domain, not only a physical structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않습니다. 내 종 모세는 내 온 집에서 신실합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 물리적 건물뿐 아니라 가문이나 소속 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  english_pob_choice: Not so
  chosen_korean: 그렇지 않습니다
  alternatives_korean:
  - 그렇지 않습니다만
  - 그렇지 않습니다.
  lexicon: HALOT
  rationale: 앞의 진술에 대한 강한 반박·대조를 나타내므로, 짧고 단호한 부정으로 옮기는 것이 원문의 뉘앙스를 잘 살립니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 나의 종
  lexicon: HALOT
  rationale: 여기서는 모세가 하나님께 속한 충직한 종이라는 공적·언약적 의미가 중심이므로 기본값인 ‘종’을 사용하고, 봉쇄된 신분을 강조하는 ‘노예’는 피했습니다.
- source_word: בְּכָל בֵּיתִי
  english_pob_choice: in all my house
  chosen_korean: 내 온 집에서
  alternatives_korean:
  - 내 집 안에서
  - 내 온 집안에서
  lexicon: HALOT
  rationale: ‘집’의 문자 이미지를 살리면서도 한국어에서 자연스럽게 영역·가문 전체를 아우르는 뜻이 드러나도록 옮겼습니다.
- source_word: נֶאֱמָן
  english_pob_choice: faithful
  chosen_korean: 신실합니다
  alternatives_korean:
  - 충실합니다
  - 믿을 만합니다
  lexicon: HALOT
  rationale: 문맥상 단순한 신뢰성보다 하나님 앞에서의 충성·성실의 뉘앙스가 살아 있어 ‘신실하다’가 가장 적절합니다.
theological_decisions:
- issue: ‘my house’의 의미를 얼마나 풀어 쓸지
  chosen_reading: 본문의 비유적 표현인 ‘내 집’을 유지하되 한국어에서는 ‘내 온 집에서’로 옮겨 집/가문/영역의 폭을 암시했습니다.
  alternative_readings:
  - 내 집안에서
  - 내 집 전체에서
  - 내 가문에서
  rationale: 원문의 은유를 지우지 않으면서도 독자가 하나님 나라적·언약적 영역을 과도하게 좁게 읽지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
