  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Go out'' or ''Come out''; the verb simply denotes movement out from a place.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the three of you' / 'all three of you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 야훼께서 갑자기 모세와 아론과 미리암에게 말씀하셨습니다. 「너희 셋은 회막으로 나오십시오」 하시니, 그 세 사람이 나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘나가다’ 또는 ‘나오다’의 이동을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 셋이’ / ‘세 사람 모두가’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기는 POB의 영어 선택을 따라 고유명사 ‘야훼’로 옮겨, 단순한 칭호가 아니라 언약의 이름임을 드러냈습니다.
- source_word: פִּתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 돌연
  - 문득
  lexicon: HALOT
  rationale: 말씀이 예고 없이 임한 즉시성과 돌발성을 자연스러운 현대 한국어 부사로 살렸습니다.
- source_word: צְא֥וּ / שְׁלָשְׁתְּכֶם
  english_pob_choice: Come out, you three
  chosen_korean: 너희 셋은 … 나오십시오
  alternatives_korean:
  - 너희 셋은 … 나가십시오
  - 세 분은 … 나오십시오
  lexicon: HALOT
  rationale: 명령형 יצא의 이동 의미를 ‘나오십시오’로 살리고, 셋 모두를 직접 지칭하는 표현은 ‘너희 셋’으로 분명히 했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 출애굽기·민수기 문맥에서 고정된 성막 용어인 ‘회막’을 사용하되, 의미는 본문 그대로의 모임/만남 장소를 가리키게 했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 드러낼지
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 주님의 이름을 직접 사용하는 만큼, 호칭 대체보다 이름 자체를 드러내는 것이 원문과 POB의 신학적 의도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접화법의 높임말 처리
  chosen_reading: 야훼의 명령은 합쇼체 ‘나오십시오’로 옮겼습니다.
  alternative_readings:
  - 나와라
  - 나오라
  rationale: 하나님의 직접 화법이지만 한국어 독자에게는 예의와 위엄을 함께 살리는 합쇼체가 가장 자연스럽고 본문 의도에도 부합합니다.
  doctrine_reference: 'Korean style guide: modern formal-polite narration; direct address to God uses honorific endings'
