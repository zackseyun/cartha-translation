  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
  footnotes:
  - marker: a
    text: Or 'Ethiopian woman.' The Hebrew says 'Cushite woman,' referring to a woman from Cush.
    reason: lexical_alternative
  - marker: b
    text: '''Had taken'' is a Hebrew idiom that can mean ''had married'' or ''had taken as wife.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 미리암과 아론이 모세를 두고 그가 구스 여자를 취한 일 때문에 말했습니다[b][a]. 그는 구스 여자를 취했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘구스 여자’라고 합니다. 전통적 번역의 ‘에티오피아 여자’는 이 표현의 지리·민족적 뜻풀이입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘취하다’는 히브리어 관용으로, 문맥에 따라 ‘아내로 맞아들이다’라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 언급했습니다
  - 말을 꺼냈습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 살려 직접적으로 옮기되, 이 문맥의 비난성은 다음 구절과 연결해 드러내고 과도한 해석어를 피했습니다.
- source_word: בְּמֹשֶׁה
  english_pob_choice: against Moses
  chosen_korean: 모세를 두고
  alternatives_korean:
  - 모세에 대해
  - 모세를 향해
  - 모세를 נגד
  lexicon: HALOT
  rationale: 히브리어 בְּ+인명은 여기서 비난의 대상성을 띠지만, 한국어에서는 ‘모세를 두고’가 본문의 갈등 상황을 자연스럽게 드러내면서도 ‘against’를 지나치게 설명적으로 풀지 않습니다.
- source_word: עַל אֹדוֹת
  english_pob_choice: because of
  chosen_korean: …일 때문에
  alternatives_korean:
  - …에 관하여
  - …을 두고
  - …로 인하여
  lexicon: HALOT
  rationale: עַל אֹדוֹת의 원인·계기 의미를 한국어의 이유 표현으로 옮겼습니다. 본문이 비난의 이유를 제시하므로 ‘때문에’가 가장 자연스럽습니다.
- source_word: הַכֻּשִׁית
  english_pob_choice: Cushite
  chosen_korean: 구스 여자
  alternatives_korean:
  - 구스 사람
  - 에티오피아 여자
  - 구스 여인
  lexicon: HALOT
  rationale: כֻשִׁית을 전통적 ‘에티오피아’로 풀지 않고 ‘구스’로 음역해 원문의 민족/지역 표지를 보존했습니다. 한국어에서는 여성 지시를 분명히 하기 위해 ‘여자’로 옮겼습니다.
- source_word: אֲשֶׁר לָקָח / כִּי אִשָּׁה כֻשִׁית לָקָח
  english_pob_choice: whom he had taken / he had taken a Cushite woman
  chosen_korean: 그가 취한 / 그는 구스 여자를 취했습니다
  alternatives_korean:
  - 그가 맞아들인 / 그는 구스 여자를 아내로 맞아들였습니다
  - 그가 취한 아내 / 그는 구스 여자를 취했습니다
  lexicon: HALOT
  rationale: לקח의 문자적 ‘취하다’를 유지해 히브리어 관용이 가진 직접성을 살렸습니다. 같은 동사를 반복한 원문의 강조도 그대로 보존했습니다.
theological_decisions:
- issue: 구스 여자의 정체를 해석으로 확정할지 여부
  chosen_reading: 본문의 표현대로 ‘구스 여자’로 두고, Zipporah나 Midianite로 조화시키지 않았습니다.
  alternative_readings:
  - ‘에티오피아 여자’로 지리적 풀어쓰기
  - 모세의 아내를 Zipporah로 식별하는 조화적 해석
  rationale: 본문은 여인을 구스인으로 지시할 뿐이며, 번역은 본문이 말하는 정체성을 보존해야 합니다. 조화적 설명은 주석의 몫이지 본문 번역의 몫이 아닙니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
