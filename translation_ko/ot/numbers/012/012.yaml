  lexicon: HALOT
  rationale: בשר를 ‘살점’으로 풀어 신체의 끔찍한 훼손 상태를 드러냈고, 한국어에서는 ‘먹히다’보다 병적 붕괴를 드러내는 ‘썩어 나간’이 이미지에 더 가깝습니다.
