  lexicon: HALOT
  rationale: 출생 장면의 직접성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘뱃속’으로 옮겼습니다.
theological_decisions:
- issue: 문맥상 여성 대명사와 남성형 묘사의 결합
  chosen_reading: ‘그녀’는 미리암을 가리키며, 뒤의 묘사는 일반적 비교구로 처리했습니다.
  alternative_readings:
  - 대명사를 생략해 중립적으로 옮김
  - 남성형을 유지해 직역함
  rationale: 바로 앞 문맥이 미리암에 대한 간청이므로 여성 지시를 분명히 하되, 히브리어의 비교적 표현은 과도하게 설명하지 않고 유지했습니다.
  doctrine_reference: 문맥적 지시어 해석
