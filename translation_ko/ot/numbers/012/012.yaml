  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
  footnotes:
  - marker: a
    text: Or, 'like a stillborn child, whose flesh is half consumed when he comes out of his mother’s womb.' The Hebrew compares her to one dead at birth; some translations make the stillbirth imagery explicit in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 제발 그녀가 어머니의 태에서 나올 때 살의 절반이 이미 상해 버린 죽은 자와 같게 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사산아처럼, 어머니의 태에서 나올 때 살의 절반이 이미 상해 버린 아이처럼’으로 옮길 수 있습니다. 히브리어 본문은 문자적으로 ‘죽은 자’에 비유하며, 뒤의 묘사가 사산의 이미지를 시사한다고 보는 번역들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
