  source_fidelity: ‘구름 기둥 가운데로’는 히브리어 전치사 בְּ의 위치·수단적 뉘앙스에 이동의 목적지 뜻을 더할 수 있으므로 ‘구름 기둥 가운데’로 바로잡는 것이 더 충실합니다. 또한 본문의 הָאֹהֶל은 문자적으로 ‘그 장막’이므로 본문에서는 ‘장막’을 유지하고, 문맥상 회막이라는 점은 각주로 밝히는 편이 원문과 영어 POB의 구분을 가장 잘 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 서술의 연속성과 존대 높임을 유지합니다. ‘그 두 사람이 앞으로 나왔습니다’는 부름에 따른 문맥적 움직임을 자연스럽게 전달하되, 각주에서 문자적 대안을 보존합니다.
  terminology: יְהוָה는 프로젝트 방침과 영어 POB에 맞추어 ‘야훼’로 유지합니다. ‘장막’은 원문의 어휘적 표현을 보존하며, ‘회막’은 문맥 정보로 각주에서만 제시합니다. 인명 ‘아론’, ‘미리암’도 적절합니다.
