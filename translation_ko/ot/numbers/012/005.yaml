  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
  footnotes:
  - marker: a
    text: Or 'the two of them went out' / 'both of them came out.' The Hebrew verb is literally 'went out,' but here it likely means they stepped forward in response to the LORD's call.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the tent'; context refers to the tent of meeting.
    reason: cross_reference
translation:
  language: ko
  text: 그때 야훼께서 구름 기둥 가운데 내려오셔서 장막 문 앞에 서시고, 아론과 미리암을 부르셨습니다. 그 두 사람이 앞으로 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘그 장막’입니다. 문맥상 회막, 곧 만남의 장막을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 문자적으로 ‘그 두 사람이 나갔다’라고 합니다. 문맥상 야훼의 부름에 응하여 앞으로 나왔다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명사와 POB의 일관된 원칙에 따라 인명적 호칭인 야훼를 사용하고, 일반 호칭인 주님으로 바꾸지 않았습니다.
- source_word: בְּעַמּוּד עָנָן
  english_pob_choice: in a pillar of cloud
  chosen_korean: 구름 기둥 가운데로
  alternatives_korean:
  - 구름 기둥 안에
  - 구름 기둥 속으로
  lexicon: HALOT
  rationale: 구름 기둥이라는 가시적 현현 이미지를 살리면서, 내려오심의 동작과 어울리도록 ‘가운데로’로 자연스럽게 옮겼습니다.
- source_word: פֶּתַח הָאֹהֶל
  english_pob_choice: at the entrance of the tent
  chosen_korean: 회막 문 앞에
  alternatives_korean:
  - 장막의 입구에
  - 장막 문 앞에
  lexicon: HALOT
  rationale: 문맥상 단순한 tent가 아니라 회막을 가리키므로, 한국어 독자가 오해하지 않도록 회막 문 앞에로 옮겼습니다.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  english_pob_choice: both of them came forward
  chosen_korean: 그 둘이 앞으로 나왔습니다
  alternatives_korean:
  - 둘 다 나왔습니다
  - 두 사람이 나왔습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘나가다’ 의미를 보존하되, 하나님 앞에 나아오는 맥락을 살려 ‘앞으로 나왔습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 ‘내려오심’ 표현
  chosen_reading: 구체적 공간 이동 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘나타나셨습니다’처럼 완화해 번역
  rationale: 본문은 신현 장면을 위해 ירד의 하강 이미지를 분명히 사용하므로, 이를 희석하지 않고 그대로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
