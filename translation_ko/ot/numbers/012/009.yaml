translation:
  language: ko
  text: 야훼의 분노가 그들에게 타올랐고, 그분은 떠나셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘야훼의 코가 그들에게 타올랐다’라는 뜻이며, 여기서는 ‘야훼의 분노가 그들에게 타올랐다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: burned / anger burned
  chosen_korean: 분노가 ... 타올랐고
  alternatives_korean:
  - 진노가 ... 일었고
  - 노가 ... 타올랐고
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘코/분노가 타다’이므로, 단순히 ‘화내셨다’보다 불의 열기를 살린 ‘타올랐다’가 원문의 비유를 더 직접적으로 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문은 신성 4문자 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 고유명사적 표기인 ‘야훼’를 유지합니다.
- source_word: בָּם
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들을 향하여
  - 그들에 대하여
  lexicon: HALOT
  rationale: 분노 관용구와 결합된 전치사는 대상/방향을 나타내므로, 한국어에서는 자연스럽게 ‘그들에게’로 옮기되 대상을 분명히 했습니다.
- source_word: וַיֵּלַךְ
  english_pob_choice: he departed
  chosen_korean: 떠나셨습니다
  alternatives_korean:
  - 가셨습니다
  - 물러나셨습니다
  lexicon: HALOT
  rationale: 문맥상 말씀하신 뒤 야훼께서 자리를 떠나시는 장면이므로, ‘떠나셨습니다’가 간결하면서도 경외적 어조를 유지합니다.
theological_decisions:
- issue: 야훼의 감정 묘사에서 인격적 분노를 어떻게 전달할지
  chosen_reading: ‘분노가 ... 타올랐고’로 번역해, 하나님의 진노를 추상화하지 않고 본문의 강한 정서적 표현을 살렸습니다.
  alternative_readings:
  - ‘진노하셨고’
  - ‘화를 내셨고’
  rationale: 히브리어 관용구는 실제 열기 이미지를 사용하므로, 이를 약화시키지 않는 표현이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: Numbers 12:9의 서술적 신정 표현
- issue: 신명칭 יְהוָה의 번역
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 호칭으로 대체하지 않고 고유 이름을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
