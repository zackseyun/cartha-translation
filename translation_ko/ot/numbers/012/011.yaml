  to: 아론이 모세에게 말했습니다. “부디, 제 주인님, 우리가 어리석게 행하고 죄를 지었으니 우리에게 죄[a]를 지우지 마십시오.”
  rationale: 인간에게 드리는 אֲדֹנִי를 ‘제 주인님’으로 옮겨 신적 호칭으로 오해될 가능성을 줄였습니다. ‘죄를 ... 위에 두다’는 한국어의 자연스러운 법적·도덕적 책임 부과 표현인 ‘죄를 지우다’로 번역했습니다. 원문의 두 고백 절은 ‘어리석게 행하고 죄를 지었으니’로 보존했으며, 죄/죄책의 어휘적 대안은 ‘죄’에 직접 연결한 각주로 제시했습니다.
