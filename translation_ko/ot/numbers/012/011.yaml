  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
  footnotes:
  - marker: a
    text: Or “do not lay guilt on us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 모세에게 말했습니다. “부디, 내 주님, 우리 위에 죄를 두지 마십시오. 우리가 어리석게 행했고 또 죄를 지었기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 죄책을 두지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  english_pob_choice: Please, my lord
  chosen_korean: 부디, 내 주님
  alternatives_korean:
  - 부디, 나의 주인님
  - 이제, 내 주님
  - 오, 내 주님
  lexicon: HALOT
  rationale: בִּי의 간청 어조는 “부디”로, 아브라함·야곱식의 경어적 호칭 אֲדֹנִי는 인간에게 쓰인 공손한 “내 주님”으로 옮겨 위계와 긴급성을 살렸습니다.
- source_word: אַל נָא תָשֵׁת עָלֵינוּ
  english_pob_choice: do not lay ... on us
  chosen_korean: 우리 위에 ...을 두지 마십시오
  alternatives_korean:
  - 우리에게 ...을 놓지 마십시오
  - 우리 위에 ...을 얹지 마십시오
  - 우리에게 ...을 지우지 마십시오
  lexicon: HALOT
  rationale: שׂים + עַל의 ‘두다/놓다’ 이미지를 유지해 책임이나 죄를 ‘위에 두는’ 표현으로 살렸고, 문맥상 수동적 부담을 분명히 했습니다.
- source_word: חַטָּאת
  english_pob_choice: sin / guilt
  chosen_korean: 죄
  alternatives_korean:
  - 허물
  - 죄책
  - 유죄
  lexicon: HALOT
  rationale: 이 문맥에서는 화목제물 명칭보다 잘못에 대한 책임과 그 결과가 핵심이므로, 한국어에서는 가장 직접적인 “죄”가 본문에 적합합니다.
- source_word: אֲשֶׁר נוֹאַלְנוּ וַאֲשֶׁר חָטָאנוּ
  english_pob_choice: because we have acted foolishly and because we have sinned
  chosen_korean: 우리가 어리석게 행했고 또 죄를 지었기 때문입니다
  alternatives_korean:
  - 우리가 어리석게 굴었고 또 죄를 지었기 때문입니다
  - 우리가 어리석었고 또 죄를 범했기 때문입니다
  - 우리가 어리석게 행한 일과 죄를 지은 일 때문입니다
  lexicon: HALOT
  rationale: 두 개의 אֲשֶׁר 절은 원인의 누적을 이루므로 한국어에서도 ‘때문입니다’로 묶어 간청의 이유를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: מֹשֶׁה와의 관계에서 אֲדֹנִי의 번역
  chosen_reading: 인간 상관에 대한 경어로서 ‘내 주님’
  alternative_readings:
  - 선생님
  - 주인님
  - 주여
  rationale: 모세에게 향한 호칭이므로 신적 호칭으로 오해되지 않게 하면서도, 본문의 복종과 간청의 강도를 유지하는 표현을 선택했습니다.
  doctrine_reference: 인간에게 쓰인 호칭은 신격화하지 않고, 문맥에 따라 번역한다.
