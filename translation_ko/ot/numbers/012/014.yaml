  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
  footnotes:
  - marker: a
    text: Or 'would she not be ashamed for seven days?'
    reason: lexical_alternative
  - marker: b
    text: Or 'afterward she may be gathered in again.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “만일 그녀의 아버지가 그녀의 얼굴에 침을 뱉었다면, 그녀는 칠 일 동안 수치를 당하지 않겠습니까?[a] 그녀를 진영 밖에 칠 일 동안 가두어 두십시오. 그 후에 다시 받아들이십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀는 칠 일 동안 부끄러워하지 않겠습니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 후에 다시 모이게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약 이름인 יהוה를 한국어에서도 인명적 고유명으로 드러내기 위해 ‘야훼’를 택했습니다. 관습적 대체어 ‘주’는 여기서 원문이 가진 고유성을 약화시킵니다.
- source_word: תִכָּלֵם
  english_pob_choice: would she not be disgraced
  chosen_korean: 수치를 당하지 않겠습니까
  alternatives_korean:
  - 부끄러워하지 않겠습니까
  - 모욕을 당하지 않겠습니까
  lexicon: HALOT
  rationale: נִפעל 형태의 כלם은 내면 감정보다 ‘수치를 입다/당하다’는 외적·사회적 결과를 가리키므로, 문맥에 맞게 ‘수치를 당하다’로 옮겼습니다.
- source_word: תִּסָּגֵר
  english_pob_choice: Let her be shut up
  chosen_korean: 가두어 두고
  alternatives_korean:
  - 격리하고
  - 닫아 두고
  lexicon: HALOT
  rationale: 진영 밖에서의 분리 조치를 구체적으로 드러내기 위해 수동적 의미를 한국어 명령형에 맞게 ‘가두어 두고’로 풀었습니다.
- source_word: תֵּאָסֵף
  english_pob_choice: she may be brought back in
  chosen_korean: 다시 불러들이십시오
  alternatives_korean:
  - 다시 받아들이십시오
  - 다시 모이게 하십시오
  lexicon: HALOT
  rationale: אסף의 수동형은 공동체 안으로의 회복·재편입을 뜻하므로, 진영 안으로의 복귀를 자연스럽게 나타내는 ‘다시 불러들이십시오’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 말과 모세에게 주어진 명령문의 호격/어조
  chosen_reading: 내러티브 서술은 평서체로, 직접 인용 안의 명령은 모세에게 주는 명령형으로 유지했습니다.
  alternative_readings:
  - 인용 전체를 간접화하여 완화하는 방식
  - 모든 문장을 설명문으로 바꾸는 방식
  rationale: 원문의 긴박한 법적·공동체적 판정을 보존하려면 직접 인용의 명령문을 유지하는 것이 중요합니다. 한국어에서도 청자에게 주는 명령의 힘이 살아나도록 했습니다.
  doctrine_reference: 민수기 12장의 정결/격리 규정
