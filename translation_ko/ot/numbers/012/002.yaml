id: NUM.12.2
reference: Numbers 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
  footnotes:
  - marker: a
    text: Or, 'Has the LORD indeed spoken only to Moses? Has he not also spoken to us?' The Hebrew preposition can be understood either as marking the recipient or the instrument of divine speech; the main text chooses 'through' because the context concerns prophetic authority.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 말했습니다[a]. 「야훼께서 정말로 모세에게만 말씀하셨습니까? 우리에게도 말씀하시지 않았습니까?」 그리고 야훼께서 들으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「야훼께서 정말로 모세를 통해서만 말씀하셨습니까? 우리를 통해서도 말씀하시지 않았습니까?」. 히브리어 전치사는 말씀의 수신자 또는 매개자를 가리킬 수 있으므로, 본문은 예언적 권위를 고려해 ‘통해’를 택할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말하였습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 직설화법 도입을 분명히 하기 위해 평이한 과거 서술형으로 옮겼습니다.
- source_word: הֲרַק אַךְ
  english_pob_choice: Has ... indeed ... only
  chosen_korean: 정말로 …만
  alternatives_korean:
  - 과연 …만
  - 도대체 …만
  lexicon: HALOT
  rationale: 두 개의 제한·강조 입자를 한국어의 ‘정말로’와 ‘만’으로 반영해, 모세에게만 국한된다는 도전적 뉘앙스를 살렸습니다.
- source_word: בְּמֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세에게만 말씀하셨습니까
  alternatives_korean:
  - 모세를 통해 말씀하셨습니까
  - 모세에게 말씀하셨습니까
  lexicon: HALOT
  rationale: 이 구절의 쟁점이 예언적 매개라 하더라도 한국어에서는 ‘~에게 말씀하다’가 가장 자연스럽게 수신자/매개자 모두를 포괄할 수 있어, 본문 의미를 무리 없이 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그람마톤은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 제목형 호칭으로 바꾸지 않았습니다.
theological_decisions:
- issue: בְּמֹשֶׁה / בָּנוּ의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 수신자-매개자 의미를 과도하게 좁히지 않고, ‘말씀하셨습니까’로 두어 두 번역 가능성을 모두 열어 둠
  alternative_readings:
  - 모세를 통해 말씀하셨습니까?
  - 모세에게 말씀하셨습니까?
  rationale: 히브리어 전치사 ב는 여기서 수신과 매개의 긴장을 함께 가질 수 있습니다. 한국어 본문에서는 한쪽으로 단정하기보다, 문맥상 권위 주장이라는 핵심을 보존하면서도 해석 여지를 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
