  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
  footnotes:
  - marker: a
    text: Or, 'if one of you is a prophet.' The Hebrew expression is literally 'if there is your prophet.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I reveal myself to him.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'I speak to him.' The Hebrew literally has 'I speak in/with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. “이제 내 말을 들으십시오. 너희 가운데 예언자가 있으면[a], 나 야훼가 환상 가운데서 그에게 나를 알리고[b], 꿈 가운데서 그에게 말합니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 가운데 예언자가 있으면’은 히브리어의 문자적 표현 ‘너희 예언자가 있으면’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그에게 나를 알리고’는 ‘내가 그에게 나를 드러낸다/계시한다’는 뜻을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그에게 말합니다’는 히브리어가 가진 ‘그에게/그와 말한다’는 전치사적 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
