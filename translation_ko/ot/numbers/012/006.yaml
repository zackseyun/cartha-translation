- from: 그리고 그가 말씀하셨습니다. 「내 말을 이제 들으십시오. 너희 가운데 예언자가 있으면, 나 야훼가 그에게 환상 가운데서 나를 알려 주고, 꿈 가운데서 그와 말합니다」.[a][b][c]
  to: 그가 말씀하셨습니다. “이제 내 말을 들으십시오. 너희 가운데 예언자가 있으면[a], 나 야훼가 환상 가운데서 그에게 나를 알리고[b], 꿈 가운데서 그에게 말합니다[c].”
  rationale: 원문의 ‘그에게’를 두 절 모두에 명시하고, 자기 계시의 의미가 한국어에서 모호하지 않도록 ‘그에게 나를 알리고’로 고쳤습니다. 각주 표지를 해당 어구에 재배치했으며, 자연스러운 현대 한국어 서술을 위해 불필요한 접속사 ‘그리고’를 생략했습니다. 환상과 꿈이라는 계시 방식의 병렬과, בּוֹ의 ‘그에게/그와’라는 해석상 여지는 각주에 보존했습니다.
