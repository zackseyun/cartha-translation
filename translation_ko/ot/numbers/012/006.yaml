id: NUM.12.6
reference: Numbers 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
  footnotes:
  - marker: a
    text: Or, 'if one of you is a prophet.' The Hebrew expression is literally 'if there is your prophet.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I reveal myself to him.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'I speak to him.' The Hebrew literally has 'I speak in/with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. 「내 말을 이제 들으십시오. 너희 가운데 예언자가 있으면, 나 야훼가 그에게 환상 가운데서 나를 알려 주고, 꿈 가운데서 그와 말합니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 가운데 예언자가 있으면’은 히브리어의 문자적 표현 ‘너희 예언자가 있으면’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 알려 주고’는 ‘내가 그에게 나를 드러낸다/계시한다’는 뜻을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그와 말합니다’는 히브리어가 가진 ‘그에게/그와 말한다’는 전치사적 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그러고 나서 그가 말씀하셨습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 서술 전개의 일반적인 연결을 살리면서, 뒤의 신적 발화 문맥을 고려해 공손한 서술형으로 옮겼습니다.
- source_word: שִׁמְעוּ נָא דְבָרַי
  english_pob_choice: Hear now my words
  chosen_korean: 내 말을 이제 들으십시오
  alternatives_korean:
  - 이제 내 말을 들으십시오
  - 내 말을 들어 주십시오
  lexicon: WLC imperative + particle נָא
  rationale: 복수 명령과 נָא의 간곡한 요청을 한국어 공손 명령으로 자연스럽게 살렸고, 'words'는 '말'로 직접 대응시켰습니다.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  english_pob_choice: if there is a prophet among you
  chosen_korean: 너희 가운데 예언자가 있으면
  alternatives_korean:
  - 너희 가운데 예언자가 있다면
  - 너희의 예언자가 있으면
  lexicon: WLC idiom
  rationale: 히브리어의 직역형 '너희 예언자'라는 관용을 한국어 자연문으로 풀되, 공동체 안의 예언자라는 집단적 의미를 유지했습니다.
- source_word: בַּמַּרְאָה / בַּחֲלוֹם
  english_pob_choice: in a vision / in a dream
  chosen_korean: 환상 가운데서 / 꿈 가운데서
  alternatives_korean:
  - 환상으로 / 꿈으로
  - 환상 안에서 / 꿈 안에서
  lexicon: WLC prepositional phrases
  rationale: 전치사 בְּ의 매개적 의미를 살리기 위해 '가운데서'를 택해, 계시의 매체가 환상과 꿈임을 분명히 했습니다.
- source_word: אֵלָיו אֶתְוַדָּע
  english_pob_choice: I make myself known to him
  chosen_korean: 나를 알려 주고
  alternatives_korean:
  - 내 자신을 그에게 알리고
  - 나 자신을 그에게 드러내고
  lexicon: WLC hitpael nuance
  rationale: 반사적 뉘앙스를 살리면서도 한국어로는 '알려 주다'가 가장 자연스럽고, 하나님이 스스로를 계시하신다는 의미를 전달합니다.
- source_word: אֲדַבֶּר בּוֹ
  english_pob_choice: I speak to him
  chosen_korean: 그와 말합니다
  alternatives_korean:
  - 그에게 말합니다
  - 그와 이야기합니다
  lexicon: WLC preposition nuance
  rationale: בּוֹ의 전치사 감각과 '말하다'의 관계성을 살리기 위해 '그와 말하다'를 택했습니다. 직역의 어색함은 피하면서도 원문의 접촉성을 유지합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥상 언약 이름이 직접 쓰였으므로, POB 원칙에 따라 신적 호칭이 아닌 고유 이름 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 계시 방식의 구분
  chosen_reading: 환상 가운데서 ... 꿈 가운데서
  alternative_readings:
  - 환상으로 ... 꿈으로
  - 환상 속에서 ... 꿈속에서
  rationale: 본절은 예언적 계시가 중개된 방식임을 대비시켜 말하므로, 환상과 꿈을 별개의 매체로 구분해 전달했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
