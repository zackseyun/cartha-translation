  lexicon: WLC imperative + particle נָא
  rationale: 복수 명령과 נָא의 간곡한 요청을 한국어 공손 명령으로 자연스럽게 살렸고, 'words'는 '말'로 직접 대응시켰습니다.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  english_pob_choice: if there is a prophet among you
  chosen_korean: 너희 가운데 예언자가 있으면
  alternatives_korean:
  - 너희 가운데 예언자가 있다면
  - 너희의 예언자가 있으면
  lexicon: WLC idiom
  rationale: 히브리어의 직역형 '너희 예언자'라는 관용을 한국어 자연문으로 풀되, 공동체 안의 예언자라는 집단적 의미를 유지했습니다.
- source_word: בַּמַּרְאָה / בַּחֲלוֹם
  english_pob_choice: in a vision / in a dream
  chosen_korean: 환상 가운데서 / 꿈 가운데서
  alternatives_korean:
  - 환상으로 / 꿈으로
  - 환상 안에서 / 꿈 안에서
  lexicon: WLC prepositional phrases
  rationale: 전치사 בְּ의 매개적 의미를 살리기 위해 '가운데서'를 택해, 계시의 매체가 환상과 꿈임을 분명히 했습니다.
- source_word: אֵלָיו אֶתְוַדָּע
  english_pob_choice: I make myself known to him
  chosen_korean: 나를 알려 주고
  alternatives_korean:
  - 내 자신을 그에게 알리고
  - 나 자신을 그에게 드러내고
  lexicon: WLC hitpael nuance
  rationale: 반사적 뉘앙스를 살리면서도 한국어로는 '알려 주다'가 가장 자연스럽고, 하나님이 스스로를 계시하신다는 의미를 전달합니다.
- source_word: אֲדַבֶּר בּוֹ
  english_pob_choice: I speak to him
  chosen_korean: 그와 말합니다
  alternatives_korean:
  - 그에게 말합니다
  - 그와 이야기합니다
  lexicon: WLC preposition nuance
  rationale: בּוֹ의 전치사 감각과 '말하다'의 관계성을 살리기 위해 '그와 말하다'를 택했습니다. 직역의 어색함은 피하면서도 원문의 접촉성을 유지합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥상 언약 이름이 직접 쓰였으므로, POB 원칙에 따라 신적 호칭이 아닌 고유 이름 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 계시 방식의 구분
  chosen_reading: 환상 가운데서 ... 꿈 가운데서
  alternative_readings:
  - 환상으로 ... 꿈으로
  - 환상 속에서 ... 꿈속에서
  rationale: 본절은 예언적 계시가 중개된 방식임을 대비시켜 말하므로, 환상과 꿈을 별개의 매체로 구분해 전달했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
