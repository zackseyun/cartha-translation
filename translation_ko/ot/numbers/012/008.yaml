  - “수수께끼로 말하지 않습니다”
  - “어두운 말로 하지 않습니다”
  lexicon: HALOT
  rationale: חִידוֹת의 난해한 말·수수께끼라는 뜻을 현대 표준어로 직접 옮겼습니다.
- source_word: וּתְמֻנַת יְהוָה
  english_pob_choice: the form of Yahweh
  chosen_korean: “야훼의 형상”
