- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  english_pob_choice: to speak against my servant, against Moses
  chosen_korean: “내 종 모세를 두고 말하는 것”
  alternatives_korean:
  - “내 종 모세를 거슬러 말하는 것”
  - “내 종 모세에 대하여 말하는 것”
  - “내 종 모세를 향해 말하는 것”
  lexicon: HALOT
  rationale: בְּ + דבר의 문맥상 반대·비방의 뉘앙스를 한국어에서 자연스럽게 ‘두고 말하다’로 처리했습니다. 다만 공격적 방향성은 본문 전체 문맥이 분명히 드러냅니다.
theological_decisions:
- issue: יהוה의 음역
  chosen_reading: ‘야훼’로 음역했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 절은 히브리어 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 모세에게 주어진 계시의 독특성
  chosen_reading: ‘입에서 입으로’, ‘수수께끼로 하지 않습니다’, ‘야훼의 형상’의 병치를 그대로 유지했습니다.
  alternative_readings:
  - 의역하여 ‘직접적으로, 분명하게 보여 주신다’로 통합
  - ‘얼굴과 얼굴로’로 개념화
  rationale: 본문이 말하는 모세의 유일한 계시 방식을 과도하게 설명하지 않고, 직접성·명료성·시각적 표상을 함께 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
