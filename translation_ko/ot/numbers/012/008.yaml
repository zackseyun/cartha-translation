  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
  footnotes:
  - marker: a
    text: Or 'face to face.' The Hebrew is literally 'mouth to mouth,' emphasizing direct speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'the likeness of the LORD' or 'the appearance of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 그와 입에서 입으로, 곧 직접 말합니다[a]. 분명하게 말하고 수수께끼로 말하지 않습니다. 그는 야훼의 형상을 봅니다[b]. 그런데 너희는 어찌 내 종 모세를 거슬러 말하기를 두려워하지 않았습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘입에서 입으로’입니다. 직접적이고 매개되지 않은 말씀을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 모습’, ‘야훼의 형체’로 옮길 수 있습니다.
    reason: lexical_alternative
