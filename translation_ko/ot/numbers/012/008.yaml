  to: “내가 그와 입에서 입으로, 곧 직접 말합니다[a]. 분명하게 말하고 수수께끼로 말하지 않습니다. 그는 야훼의 형상을 봅니다[b]. 그런데 너희는 어찌 내 종 모세를 거슬러 말하기를 두려워하지 않았습니까?”
  rationale: ‘입에서 입으로’라는 원문의 구체적 표현은 유지하되, 한국어 독해를 위해 ‘곧 직접’을 덧붙였습니다. 명료한 말과 수수께끼의 대조를 자연스러운 동사 구조로 정리했고, 모세를 향한 적대적 발화라는 마지막 절의 의미를 ‘거슬러 말하기’로 반영했습니다. 신적 형상의 성격은 설명하거나 교리적으로 한정하지 않았습니다.
