review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַתִּסָּגֵר는 이 문맥에서 단순한 감금보다 진영 밖으로의 격리·배제를 뜻하므로 ‘격리되다’가 더 정확합니다. הֵאָסֵף의 수동성을 반영하여 미리암이 공동체에 다시 받아들여지는 때를 기다렸다는 뜻으로 옮겼습니다.
  naturalness: ‘진영 밖에 … 가두어졌고’는 한국어에서 수감의 뉘앙스가 강합니다. ‘진영 밖에 격리되어’가 정결 규례 및 이동 서사의 문맥에 자연스럽고 현대 표준어로도 명료합니다.
  terminology: ‘진영’, ‘백성’, ‘출발하다’는 광야 이동 문맥에 적절합니다. 각주에서 אסף를 ‘모여들다’로 병기한 것은 이 수동·재편입 문맥에는 부정확하거나 혼동을 줄 수 있어, ‘거두어지다’와 공동체로의 재수용이라는 문맥적 뜻으로 제한했습니다.
  issues:
  - severity: medium
    issue: ‘가두어졌고’는 וַתִּסָּגֵר의 문맥적 의미를 지나치게 수감으로 들리게 합니다.
    rationale: 민수기 12:14–15의 진영 밖 배제 기간을 가리키므로 ‘격리되어’가 물리적 배제와 정결 관련 맥락을 더 정확히 전달합니다.
  - severity: low
    issue: 각주의 ‘모여들다’ 병기는 הֵאָסֵף의 수동형 및 문맥상 의미와 맞지 않습니다.
    rationale: 본문은 미리암이 스스로 모여드는 행위가 아니라, 격리 뒤에 다시 받아들여지는 것을 말합니다.
  revised_text: 그리하여 미리암은 진영 밖에 일곱 날 동안 격리되어 있었고, 백성은 미리암이 다시 받아들여질 때까지 출발하지 않았습니다.[a]
