- from: 그래서 미리암은 진영 밖에 일곱 날 동안 가두어졌고, 백성은 미리암이 다시 들어올 때까지 출발하지 않았습니다.[a]
  to: 그리하여 미리암은 진영 밖에 일곱 날 동안 격리되어 있었고, 백성은 미리암이 다시 받아들여질 때까지 출발하지 않았습니다.[a]
  rationale: ‘격리되어 있었고’로 진영 밖 배제의 상태를 자연스럽고 정확하게 나타냈습니다. 마지막 절은 원문의 수동성을 살려 ‘다시 받아들여질 때까지’로 옮겼으며, 각주에서 ‘거두어지다’라는 어휘적 대안을 제시하고 문맥상 재편입을 설명했습니다.
