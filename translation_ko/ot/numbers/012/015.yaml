  text: וַ/תִּסָּגֵ֥ר מִרְיָ֛ם מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְ/הָ/עָם֙ לֹ֣א נָסַ֔ע עַד הֵאָסֵ֖ף מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
  footnotes:
  - marker: a
    text: Or, more literally, 'until Miriam was gathered in.' The Hebrew uses the verb 'gather,' here referring to her restoration to the camp after her period of exclusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 미리암은 진영 밖에 일곱 날 동안 가두어졌고, 백성은 미리암이 다시 들어올 때까지 출발하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '미리암이 거두어지다/모여들다'는 뜻의 אסף 동사를 사용합니다. 문맥상 진영 안으로의 복귀를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  english_pob_choice: was confined
  chosen_korean: 가두어졌고
  alternatives_korean:
  - 갇혔고
  - 격리되었고
  - 봉쇄되었고
  lexicon: HALOT
  rationale: 니팔형의 수동적 상태를 살리면서, 문맥상 진영 밖으로의 배제·격리를 한국어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진영 밖에
  alternatives_korean:
  - 진 밖에
  - 진영 바깥에
  - 진 밖에서
  lexicon: HALOT
  rationale: 광야 서사의 고정된 장소 표현을 살려 '진영'을 택했고, 위치부사는 간결하게 '밖에'로 처리했습니다.
- source_word: לֹא נָסַע
  english_pob_choice: did not set out
  chosen_korean: 출발하지 않았습니다
  alternatives_korean:
  - 떠나지 않았습니다
  - 길을 떠나지 않았습니다
  - 행진하지 않았습니다
  lexicon: HALOT
  rationale: נסע의 광야 이동 관용법을 반영하되, 한국어에서는 '출발하다'가 진영을 풀고 이동을 시작하는 의미를 가장 자연스럽게 전달합니다.
- source_word: עַד הֵאָסֵף מִרְיָם
  english_pob_choice: until Miriam was brought in
  chosen_korean: 미리암이 다시 들어올 때까지
  alternatives_korean:
  - 미리암이 들어올 때까지
  - 미리암이 거둬들여질 때까지
  - 미리암이 모여 들어올 때까지
  lexicon: HALOT
  rationale: אסף의 '거두어들이다/모으다' 뉘앙스를 문맥상 회복·복귀로 풀어, 진영 안으로의 재편입을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 진영 밖 격리의 의미
  chosen_reading: 미리암의 일시적 배제가 공동체 정결과 질서의 회복을 위한 조치로 읽히도록 옮겼습니다.
  alternative_readings:
  - 단순한 이동 제한으로 약화해 읽는 방식
  - 처벌의 성격만 강조하는 방식
  rationale: 히브리어 본문은 물리적 위치 이동을 넘어 공동체 밖으로의 배제를 말하며, '가두어지다/진영 밖' 표현이 그 긴장을 보존합니다.
  doctrine_reference: 민수기 12장 정결·공동체 질서
