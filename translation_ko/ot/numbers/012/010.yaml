  source_fidelity: ‘눈처럼 나병에 걸려’는 히브리어의 비교 표현을 한국어에서 부자연스럽게 결합하여, 눈과 같은 것이 피부 상태의 외양(문맥상 하얗게 됨)이라는 뜻이 충분히 드러나지 않습니다. 또한 각주 표지가 구름의 떠남에 붙어 있어 ‘나병’ 관련 주석의 지시 대상이 잘못되었습니다.
