id: NUM.12.10
reference: Numbers 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
  footnotes:
  - marker: a
    text: The Hebrew term rendered 'leprous' can refer more broadly to a serious skin disease or ritual skin affliction, not necessarily what modern medicine identifies as leprosy (Hansen's disease).
    reason: lexical_alternative
translation:
  language: ko
  text: 구름이 회막 위에서 떠났습니다. 보십시오, 미리암은 나병[a]에 걸려 눈처럼 하얗게 되었습니다. 그러자 아론이 미리암 쪽으로 몸을 돌렸습니다. 보십시오, 미리암은 나병에 걸려 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나병’으로 번역한 히브리어 낱말은 현대 의학에서 말하는 한센병만을 뜻하지 않으며, 더 넓게는 심각한 피부 질환이나 의례상 부정한 피부 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָנָן
  english_pob_choice: the cloud
  chosen_korean: 구름
  alternatives_korean:
  - 그 구름
  - 그 구름기운
  lexicon: HALOT
  rationale: 문맥상 회막 위에 임한 야훼의 임재를 가리키는 가시적 구름이므로, 가장 자연스럽고 간결한 표준어인 ‘구름’으로 옮겼습니다.
- source_word: סָר מֵעַל הָאֹהֶל
  english_pob_choice: departed from over the tent
  chosen_korean: 회막 위에서 떠났습니다
  alternatives_korean:
  - 장막 위에서 떠났습니다
  - 장막 위에서 물러났습니다
  - 장막 위에서 물러가셨습니다
  lexicon: HALOT
  rationale: מֵעַל은 ‘위에서/위로부터’의 이동을 나타내므로 ‘회막 위에서’로 살렸고, אֹהֶל은 여기서 회막의 기능을 가리키므로 ‘회막’으로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 갑자기
  lexicon: HALOT
  rationale: 장면 전환의 놀라움과 시각적 제시를 살리기 위해 감탄형보다 독자를 직접 끌어들이는 ‘보십시오’를 택했습니다.
- source_word: מְצֹרַעַת כַּשָּׁלֶג
  english_pob_choice: leprous, like snow
  chosen_korean: 눈처럼 나병에 걸려
  alternatives_korean:
  - 나병에 걸려 눈처럼 하얘
  - 문둥병에 걸려 눈처럼 하얘
  lexicon: HALOT
  rationale: מְצֹרַעַת은 전통적으로 ‘나병’으로 옮기되, 현대 의학적 질병명과 완전히 일치하지 않을 수 있는 넓은 의미는 각주로 보완하고, כַּשָּׁלֶג은 직역하여 ‘눈처럼’을 유지했습니다.
- source_word: וַיִּפֶן אֶל מִרְיָם
  english_pob_choice: Then Aaron turned toward Miriam
  chosen_korean: 그러자 아론이 미리암 쪽으로 돌아보니
  alternatives_korean:
  - 그러자 아론이 미리암을 향해 돌아서니
  - 그때 아론이 미리암에게로 돌이켜
  lexicon: HALOT
  rationale: פנה는 방향 전환과 응시를 함께 담을 수 있어, 동작의 흐름을 살리는 ‘쪽으로 돌아보니’로 옮겼습니다.
theological_decisions:
- issue: מְצֹרַעַת의 질병명과 범주
  chosen_reading: ‘나병’으로 번역하되, 현대 의학의 Hansen병과 동일시하지는 않습니다.
  alternative_readings:
  - ‘심한 피부병’
  - ‘피부 질환’
  rationale: 본문의 서술 효과를 보존하려면 간결한 전통 용어가 적절하지만, 히브리어 מצרע는 더 넓은 의례적·피부적 불결 상태를 가리킬 수 있으므로 의미 범주를 좁혀 확정하지 않도록 했습니다.
  doctrine_reference: 레위기 13–14장; 민수기 12장 문맥
