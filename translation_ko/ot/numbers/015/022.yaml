  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
  footnotes:
  - marker: a
    text: Or 'if you err' or 'if you sin unintentionally.' The Hebrew verb conveys going astray or erring, and in this context refers to unintentional failure regarding the commandments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분이 부지중에 잘못하여 야훼께서 모세에게 말씀하신 이 모든 계명을 다 행하지 않으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빗나가다’, ‘실수하다’로 옮길 수 있습니다. 히브리어 동사는 길을 벗어나거나 어긋나는 뜻을 담고 있으며, 여기서는 계명에 대한 부지중의 실패를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 … 않으면
  alternatives_korean:
  - 그리고 만약 … 이면
  - 또 만약 … 이면
  lexicon: HALOT
  rationale: 조건을 여는 표현이면서 앞 절과의 약한 전환도 있어, 한국어에서는 ‘그러나 … 않으면’이 법적 문맥의 흐름을 가장 자연스럽게 살립니다.
- source_word: תִשְׁגּוּ
  english_pob_choice: you unintentionally go astray
  chosen_korean: 부지중에 잘못하여
  alternatives_korean:
  - 의도치 않게 빗나가
  - 실수로 어기면
  - 부지중에 빗나가
  lexicon: HALOT
  rationale: שׁגה의 핵심은 ‘벗어남/잘못함’이며, 여기서는 고의가 아닌 실패라는 법적 뉘앙스가 중요하므로 ‘부지중에 잘못하여’로 간결하게 살렸습니다.
- source_word: הַמִּצְוֺת הָאֵלֶּה
  english_pob_choice: all these commandments
  chosen_korean: 이 모든 계명
  alternatives_korean:
  - 이 모든 명령
  - 이 모든 법도
  lexicon: HALOT
  rationale: מִצְוֺת은 언약-율법 문맥에서 ‘계명’이 가장 직접적이며, ‘이 모든’으로 전체성을 그대로 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어가 아니라 고유명사로 보존해야 하므로, 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향하여
  - 모세에 대하여
  lexicon: HALOT
  rationale: 직접 수여된 계시를 나타내는 전치사구이므로 자연스러운 여격 ‘모세에게’가 적합합니다.
theological_decisions:
- issue: 부지중의 잘못과 고의적 불순종의 구분
  chosen_reading: 이 절은 의도치 않은 율법 위반을 가리키는 법적 진술로 읽었습니다.
  alternative_readings:
  - 일반적인 도덕적 실수
  - 단순한 무지
  rationale: 문맥상 뒤 절들에서 고의적 반역과 구분되므로, 죄책의 정도를 평면화하지 않고 부지중의 실패라는 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
