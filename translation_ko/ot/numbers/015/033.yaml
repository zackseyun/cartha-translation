  source_fidelity: 원문의 목적격 대명사 אֹתוֹ는 ‘그를’인데 초안의 ‘그들을’은 수가 맞지 않습니다. 또한 מְקֹשֵׁשׁ עֵצִים는 나무를 ‘모으다/거두다’라는 뜻이지 나무를 ‘꺾다’라는 뜻은 아닙니다. וַיַּקְרִיבוּ는 이 문맥에서 그를 모세와 아론 및 온 회중 앞으로 데려가 제시한 행위를 가리키므로 ‘데려갔습니다’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘그를 발견한 사람들이’와 ‘나무를 모으고 있던 그 사람’은 관형 구성을 자연스럽게 하면서, 발견 당시 진행 중인 행동이라는 히브리어 분사의 의미를 보존합니다. 현대 표준어 합쇼체 종결로 다듬었습니다.
  terminology: עֵדָה는 오경의 공동체적·공적 맥락을 따라 ‘회중’으로 유지했습니다. עֵצִים의 넓은 뜻을 반영하여 본문은 ‘나무’로 옮기고, ‘막대기들’이라는 가능한 어휘적 의미는 각주로 제시했습니다.
