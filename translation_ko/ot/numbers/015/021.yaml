  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
  footnotes:
  - marker: a
    text: Or 'your kneading bowls'; the Hebrew term can refer to dough or, by association, the kneading vessel.
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering' or traditionally 'a heave offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밀가루 반죽의 첫 부분을 너희는 야훼께 예물로 드려야 합니다. 이것은 너희 대대로 지켜야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀가루 반죽’은 히브리어가 반죽 자체를 가리킬 수도 있고, 빚는 그릇을 가리킬 수도 있다는 점을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예물’은 문자적으로는 ‘들어 올린 헌물’에 해당하며, 전통적으로는 ‘거제물’이라고도 합니다.
    reason: lexical_alternative
