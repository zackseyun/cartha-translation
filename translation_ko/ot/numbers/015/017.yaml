lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여
  alternatives_korean:
  - 말하여
  - 이르시며
  lexicon: HALOT
  rationale: 하나님이 하시는 발화 공식에서 דבר는 단순한 ‘말하다’보다 격식 있는 ‘말씀하다’가 자연스럽고, 뒤의 לֵאמֹר를 받아 이어지는 서술에도 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 텔라그라마톤이 직접 나오므로, 전통적 대체호칭 ‘주님’이 아니라 하나님의 고유명 ‘야훼’를 반영합니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 께
  - 향하여
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 전치사이므로 한국어에서는 조사 ‘에게’가 가장 직접적입니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 이라고 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 상투적 발화 도입구는 한국어에서 자연스럽게 ‘이르셨습니다’로 옮길 수 있으며, 다음 절의 직접 인용을 예고합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
