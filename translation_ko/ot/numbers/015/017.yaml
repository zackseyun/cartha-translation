  rationale: 본문은 하나님의 이름을 사용하므로, 번역에서도 호칭 대체 없이 고유명 자체를 드러내는 것이 소스-직역 원칙에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
