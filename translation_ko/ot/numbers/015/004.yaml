  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a tenth''; in this sacrificial context, this denotes a tenth of an ephah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제물을 바치는 사람이 야훼께 바칠 소제는 고운 가루 한 에바의 십분의 일에 기름 한 힌의 사분의 일을 섞은 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘십분의 일’이지만, 이 제의 문맥에서는 한 에바의 십분의 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב / הַמַּקְרִיב
  english_pob_choice: then ... shall present / the one who presents
  chosen_korean: 그러면 ... 바치는 사람
  alternatives_korean:
  - 그리고 ... 바치는 사람
  - 제물을 드리는 사람
  lexicon: HALOT
  rationale: 절차를 잇는 waw의 흐름은 한국어에서 ‘그러면’으로 자연스럽게 살리고, Hiphil 분사 הַמַּקְרִיב은 행위를 하는 사람을 ‘바치는 사람’으로 풀어 현대적으로 옮겼습니다.
- source_word: קָרְבָּנוֹ / מִנְחָה
  english_pob_choice: his offering / a grain offering
  chosen_korean: 제물 ... 소제
  alternatives_korean:
  - 그의 제물 ... 곡식 제물
  - 그의 예물 ... 곡식 제사
  lexicon: HALOT
  rationale: קָרְבָּן은 일반적인 ‘제물’로, מִנְחָה는 제의 문맥에서 전통적이면서도 의미가 분명한 ‘소제’로 옮겨 제의 용어의 구별을 보존했습니다.
- source_word: סֹלֶת עִשָּׂרוֹן
  english_pob_choice: fine flour ... a tenth of an ephah
  chosen_korean: 고운 가루 한 에바의 십분의 일
  alternatives_korean:
  - 좋은 가루 한 에바의 십분의 일
  - 고운 밀가루 십분의 일
  lexicon: HALOT
  rationale: סֹלֶת은 제의용 고운 가루이므로 ‘고운 가루’로, עִשָּׂרוֹן은 이 문맥의 관용적 분량인 ‘한 에바의 십분의 일’로 보완해 이해 가능하게 했습니다.
- source_word: בִּרְבִעִית הַהִין שָׁמֶן
  english_pob_choice: with a fourth of a hin of oil
  chosen_korean: 기름 한 힌의 사분의 일을 섞은
  alternatives_korean:
  - 기름 한 힌의 사분의 일을 더한
  - 기름 한 힌의 사분의 일을 혼합한
  lexicon: HALOT
  rationale: בָּלוּל은 재료가 함께 섞인 상태를 뜻하므로 ‘섞은’으로 간결하게 살렸고, עת의 분량은 ‘한 힌의 사분의 일’로 원문 단위를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와의 언약명 יהוה를 직접 사용하므로, 프로젝트 기준에 따라 음역인 ‘야훼’를 본문에 두어 고유 이름성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
