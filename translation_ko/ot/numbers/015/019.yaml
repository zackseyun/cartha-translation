review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal clause, the obligation to make a cultic presentation, and dedication to Yahweh. However, ‘그 땅의 빵’ is an overly literal and unnatural Korean expression for לֶחֶם הָאָרֶץ in this context, where ‘양식’ naturally denotes the land’s food/produce. The main rendering’s ‘예물’ is acceptable, but ‘헌물’ more clearly preserves the designated contribution (תְּרוּמָה).
  naturalness: The sentence is generally fluent in modern formal-polite Korean. Replacing ‘그 땅의 빵’ with ‘그 땅의 양식’ and using ‘헌물을 드려야 합니다’ produces more idiomatic Korean without reducing source precision.
  terminology: '‘야훼’ properly reflects יהוה under the project policy. ‘헌물’ is a suitable modern Korean cultic term for תְּרוּמָה. The existing footnote is not a sound alternative rendering: ‘땅의 빵에서’ is awkward, it omits the temporal force, and its description of the Hebrew construction is imprecise.'
  issues:
  - severity: medium
    issue: ‘그 땅의 빵’ is unnatural in Korean.
    rationale: לֶחֶם can mean bread or food; in this land-produce context, ‘그 땅의 양식’ is idiomatic Korean and retains the intended referent.
  - severity: medium
    issue: The footnote’s alternative rendering and explanation are inaccurate or incomplete.
    rationale: It drops ‘when you eat,’ renders the source phrase awkwardly, and treats the offering formula imprecisely. A revised note should preserve the temporal clause and identify the literal ‘lift up a contribution’ expression.
  revised_text: 그리고 여러분이 그 땅의 양식을 먹을 때에는 야훼께 헌물을 드려야 합니다.[a]
