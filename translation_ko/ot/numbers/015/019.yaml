- from: 그리고 여러분이 그 땅의 빵을 먹을 때에는 야훼께 예물로 바쳐야 합니다.[a]
  to: 그리고 여러분이 그 땅의 양식을 먹을 때에는 야훼께 헌물을 드려야 합니다.[a]
  rationale: The revision replaces an unnatural literalism with idiomatic ‘양식,’ renders תְּרוּמָה as ‘헌물’ to retain its sense as a designated offering/contribution, and corrects the footnote so that it accurately reflects both the temporal clause and the Hebrew cultic idiom. ‘야훼’ is retained in accordance with the project’s rendering of the divine name.
