id: NUM.15.19
reference: Numbers 15:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
  footnotes:
  - marker: a
    text: Or 'you shall present an offering to the LORD.' The Hebrew says 'lift up a contribution,' using cultic offering language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분이 그 땅의 빵을 먹을 때에는 야훼께 예물로 바쳐야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 땅의 빵에서 예물을 바쳐야 합니다.’ 히브리어는 제의적 표현으로 ‘거제로 들어 올리다’라는 말을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And when
  chosen_korean: 그리고 … 때에는
  alternatives_korean:
  - 그리고 …하면
  - 그때에
  lexicon: HALOT
  rationale: 히브리어 היה의 미래적·상황적 용법을 한국어의 조건/시간 표현으로 자연스럽게 살렸습니다.
- source_word: בַּאֲכָלְכֶם
  english_pob_choice: you eat
  chosen_korean: 여러분이 … 먹을 때에는
  alternatives_korean:
  - 여러분이 먹을 때
  - 먹는 동안
  lexicon: HALOT
  rationale: 부정사구의 시간 의미를 합쇼체 문맥에 맞게 ‘먹을 때에는’으로 옮겨, 원문의 상황 조건을 분명히 했습니다.
- source_word: תָּרִימוּ תְרוּמָה
  english_pob_choice: you shall present a contribution
  chosen_korean: 예물로 바쳐야 합니다
  alternatives_korean:
  - 기여물을 들어 올려야 합니다
  - 거제로 드려야 합니다
  - 바쳐야 합니다
  lexicon: HALOT
  rationale: תרומה와 רום의 제의적 결합을 한국어 성경 문체에서 자연스러운 ‘예물로 바치다’로 옮기되, POB의 ‘present a contribution’이 가진 바침의 의미를 유지했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יהוה를 ‘야훼’로 일관되게 옮겼고, ל는 헌납의 방향을 나타내는 ‘-께’로 처리했습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 쓰므로, 프로젝트 기준에 따라 언약 이름을 가리는 ‘주님’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
