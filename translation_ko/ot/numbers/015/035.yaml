source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
  footnotes:
  - marker: a
    text: Or, more formally, “shall surely be put to death.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “stone him with stones,” an emphatic judicial expression for execution by stoning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다[a]. 「그 사람은 반드시 죽어야 합니다[b]. 온 회중이 진영 밖에서 돌로 그를 쳐야 합니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 형식적으로, “반드시 죽임을 당해야 합니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “돌로 그를 돌로 치라”는 식의 강조적 법정 표현으로, 사형 집행으로서의 돌맞음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 영어 POB가 전통적 주어 표기를 따르지 않고 고유 신명 'Yahweh'를 택했으므로, 한국어도 프로젝트 기본값인 '야훼'로 직역해 언약적 고유성을 보존했습니다.
- source_word: מֹות יוּמַת
  english_pob_choice: must surely be put to death
  chosen_korean: 반드시 죽어야 합니다
  alternatives_korean:
  - 반드시 사형에 처해야 합니다
  - 반드시 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정확한 완곡화 없이)을 살리면서도 현대 한국어에서 자연스러운 법적·판결적 표현으로 옮겼습니다.
- source_word: רָגוֹם ... בָאֲבָנִים
  english_pob_choice: stone him with stones
  chosen_korean: 돌로 그를 쳐야 합니다
  alternatives_korean:
  - 돌로 그를 쳐야 합니다
  - 돌로 그에게 돌을 던져야 합니다
  lexicon: HALOT
  rationale: 히브리어의 관용적·강조적 표현을 한국어에서 중복 어휘로 그대로 옮기기보다, 실행 행위인 '돌로 치다'로 자연스럽게 재현했습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 회중
  - 온 공동체
  - 모든 회중
  lexicon: HALOT
  rationale: עֵדָה는 광범위한 공동체보다 모인 언약 백성의 총체를 가리키므로, 프로젝트 기본어인 '회중'을 유지해 법적·공동체적 뉘앙스를 보존했습니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진영 밖에서
  alternatives_korean:
  - 진영 밖에서
  - 진 밖에서
  lexicon: HALOT
  rationale: 광야 서술의 군사·공동체적 공간을 반영하는 표준적 표현으로 '진영'을 택했고, 위치 부사구는 간결하게 '밖에서'로 처리했습니다.
theological_decisions:
- issue: 여호와 대신 야훼를 사용할지 여부
  chosen_reading: 본문의 신명 יְהוָה는 '야훼'로 음역했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명은 고유명으로 드러내야 하며, 이 절은 인용문 안이 아니라 서술문이므로 전통적 대체표기보다 '야훼'가 원문 가시성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וַיֹּאמֶר의 서술 진행을 한국어에서 어떻게 살릴지
  chosen_reading: '''그때 … 말씀하셨습니다''로 사건 진행과 서술의 자연스러움을 함께 살렸습니다.'
  alternative_readings:
  - 그리고 … 말씀하셨습니다
  - 또 … 말씀하셨습니다
  rationale: 와우 연속의 순차적 진행을 한국어에서 '그때'로 처리해 문맥 흐름을 유지하면서, 하나님 말씀 서술의 공손한 합쇼체를 보존했습니다.
  doctrine_reference: Narrative discourse rendering
