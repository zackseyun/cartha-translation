review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the divine name, the narrative sequence, the whole congregation, and the location outside the camp. However, "반드시 죽어야 합니다" does not explicitly retain the passive judicial form of מוֹת יוּמַת, and "돌로 그를 쳐야 합니다" can denote merely striking rather than execution by stoning. The revised wording makes both the judicial passive and the execution sense explicit.
  naturalness: The revision remains idiomatic in modern formal-polite Korean. "죽임을 당해야 합니다" is suitably formal for a judicial pronouncement, and "돌로 그를 쳐 죽여야 합니다" is clear and natural in context.
  terminology: '"야훼," "회중," and "진영" are appropriate and consistent with the stated lexical decisions. The footnote anchors in the draft are attached to the wrong clauses relative to their contents; they have been moved so each note follows the expression it explains.'
  issues:
  - severity: medium
    issue: The death formula is rendered as "반드시 죽어야 합니다."
    rationale: מוֹת יוּמַת is an infinitive absolute plus passive finite verb, meaning that the man is certainly to be put to death. "죽임을 당해야 합니다" preserves the passive judicial sense more closely.
  - severity: medium
    issue: The stoning command is rendered as "돌로 그를 쳐야 합니다."
    rationale: In Korean this may mean only that he is to be struck with stones. "돌로 그를 쳐 죽여야 합니다" conveys the judicial execution inherent in רָגוֹם אֹתוֹ בָּאֲבָנִים.
  - severity: high
    issue: Footnote anchors do not correspond to the clauses explained by their footnotes.
    rationale: The note on the death formula is currently anchored after "말씀하셨습니다," while the note on stoning is anchored after the death formula. Moving the anchors resolves the mismatch without altering meaning.
  revised_text: 그때 야훼께서 모세에게 말씀하셨습니다. “그 사람은 반드시 죽임을 당해야 합니다[a]. 온 회중이 진영 밖에서 돌로 그를 쳐 죽여야 합니다[b].”
  revised_footnotes:
