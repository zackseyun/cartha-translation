  source_fidelity: 'The draft inaccurately renders צִיצִת as "끈" (cord/string); in this context it is the garment tassel/fringe. Its final clause also reverses and obscures the Hebrew syntax: the people are warned not to pursue their heart and eyes, after which they are "whoring" (a deliberately sexual-infidelity metaphor).'
  naturalness: The draft's repeated "마음이 음란하여 ... 눈이 음란하여" is unnatural and makes the heart and eyes themselves grammatically "immoral," rather than preserving the warning against pursuing them. The revised wording is modern standard Korean in formal-polite 합쇼체.
  terminology: '"옷술" accurately identifies the garment tassel and is supported by a lexical note. "야훼" consistently renders יהוה. "음행" retains the force of זֹנִים without imposing a specific theological interpretation.'
  issues:
  - severity: high
    issue: '"끈" mistranslates צִיצִת.'
    rationale: The term denotes a tassel/fringe on a garment, not a cord. Although the preceding verse mentions a blue cord, this verse's referent is the tassel/fringe.
  - severity: high
    issue: The final prohibition is syntactically and semantically distorted.
    rationale: The Hebrew prohibits pursuing one's heart and eyes and characterizes that pursuit with the metaphor of whoring. The draft instead says the heart and eyes are immoral and repeats an unnatural "그 뒤를 따르다" construction.
  - severity: medium
    issue: The draft omits the source's pursuit/ranging nuance in תָתוּרוּ.
    rationale: '"따라 찾아다니다" preserves the active pursuit implied by the Hebrew more closely than a bare following expression.'
