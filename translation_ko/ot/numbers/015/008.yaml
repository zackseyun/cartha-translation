    rationale: 히브리어는 ‘서원을 이행하기 위하여 또는 화목제를 드리기 위하여’라는 두 목적을 제시합니다. 초안의 ‘서원이나 화목제를 여호와께 드려 행하고자’는 서원을 제물처럼 ‘드리는’ 대상으로 만들고 화목제를 ‘행하다’와 연결해 의미를 혼합합니다.
  - severity: medium
    issue: 각주 b가 원문 어휘 대안이 아니라 해석적 신학 설명을 제공합니다.
    rationale: שְׁלָמִים의 의미 범위에 관한 선택지를 제시해야 할 자리에서, 본문이 명시하지 않는 ‘하나님과 사람, 그리고 사람 간의 화해와 친교’라는 설명을 덧붙입니다. 이는 번역의 중립성과 영어 감사 기록의 각주 기능에 맞지 않습니다.
