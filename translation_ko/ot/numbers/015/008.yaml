id: NUM.15.8
reference: Numbers 15:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
  footnotes:
  - marker: a
    text: Or 'to perform a vow' or 'to make good on a vow.' The Hebrew idiom refers to carrying out what was vowed.
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 너희가 수송아지를 번제나 제물로 드리며, 서원이나 화목제를 여호와께 드려 행하고자 할 때에[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '행하다'는 서원을 이행하거나 성취함을 의미하는 관용구입니다.
    source: WLC lexical analysis
  - marker: b
    text: 화목제는 하나님과 사람, 그리고 사람 간의 화해와 친교를 상징하는 제물입니다.
    source: WLC theological context
lexical_decisions:
- source_word: בֶן בָּקָר
  english_pob_choice: bull
  chosen_korean: 수송아지
  alternatives_korean: 송아지, 소
  lexicon: WLC
  rationale: '''수송아지''는 번제에 적합한 어린 소를 지칭하는 구체적 용어로, 현대적 형식체에서 적절함.'
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean: 올려드리는 제물
  lexicon: WLC
  rationale: 성경적 용어인 '번제'를 사용하여 신학적 정확성을 유지함.
- source_word: זָבַח
  english_pob_choice: sacrifice
  chosen_korean: 제물
  alternatives_korean: 살생, 희생
  lexicon: WLC
  rationale: 일반적인 제사를 의미하는 '제물'로 번역하여 문맥상 자연스러움.
- source_word: לְ/פַלֵּא נֶ֥דֶר
  english_pob_choice: to fulfill a vow
  chosen_korean: 서원이나
  alternatives_korean: 서원을 행하여
  lexicon: WLC
  rationale: 서원을 이행하는 행위를 포괄적으로 나타내기 위해 '서원'을 명사형으로 처리하고 문장 구조를 간결하게 함.
- source_word: שְׁלָמִ֖ים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean: 평화 제물, 친교 제물
  lexicon: WLC
  rationale: 기존 한국 성경 번역 관례에 따라 '화목제'를 사용함.
theological_decisions:
- decision: Yahweh translation
  rationale: 여호와로 번역하여 구약의 하나님 이름을 명확히 함.
- decision: Formal-polite register
  rationale: 성경의 권위를 유지하기 위해 합쇼체 (하십시오체) 를 사용하되, 현대적 이해를 돕기 위해 간결한 문장을 구성함.
