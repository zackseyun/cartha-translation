  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
  footnotes:
  - marker: a
    text: Or "purification offering." The Hebrew term חַטָּאת can denote the offering that deals with sin/impurity, not only the sin itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 한 사람이 부지중에 죄를 지으면, 일 년 된 암염소를 속죄제물로 바쳐야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「정결제물」. 히브리어 חַטָּאת은 죄나 부정을 다루는 제물을 가리킬 수 있으며, 단지 ‘죄’ 자체만을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 하지만 … 하면
  alternatives_korean:
  - 그리고 … 하면
  - 만일 … 하면
  lexicon: HALOT
  rationale: 앞 절과 이어지는 대비적 조건을 살려 한국어에서는 문두의 「하지만」으로 약한 대조를 드러내는 편이 자연스럽습니다.
- source_word: נֶפֶשׁ אַחַת
  english_pob_choice: one person
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 영혼
  - 한 개인
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 ‘사람’을 뜻하는 것이 가장 자연스러우므로, 오해를 줄이기 위해 「한 사람」으로 옮겼습니다.
- source_word: בִשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 실수로
  - 무심코
  - 의도하지 않게
  lexicon: HALOT
  rationale: 의도적 범죄와 구별되는 ‘부주의/비고의’의 법적 뉘앙스를 담기 위해 「부지중에」를 택했습니다.
- source_word: עֵז בַּת שְׁנָתָהּ
  english_pob_choice: a one-year-old female goat
  chosen_korean: 일 년 된 암염소
  alternatives_korean:
  - 한 살 된 암염소
  - 한 살배기 암염소
  - 일 년 된 암염소 한 마리
  lexicon: HALOT
  rationale: עֵז는 암염소를 가리키며, בַּת שְׁנָתָהּ는 첫해의 동물임을 뜻하므로 두 요소를 모두 드러냈습니다.
- source_word: לְחַטָּאת
  english_pob_choice: as a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 죄를 위한 제물로
  - 죄제물로
  lexicon: HALOT
  rationale: 히브리어 חַטָּאת은 이 문맥에서 제의적 ‘속죄제/죄제’의 기능을 가리키므로, 한국어 성경에서 통용되면서도 제물 성격을 보이는 「속죄제물」을 택했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 본문에는 「속죄제물」을 두어 제의적 기능을 드러냈습니다.
  alternative_readings:
  - 「속죄제」
  - 「죄제물」
  - 「정결제물」
  rationale: 이 절의 חַטָּאת는 단순한 ‘죄’가 아니라 죄/부정에서 다루는 제물 자체를 뜻하므로, 의미를 직접 드러내는 번역이 오독을 줄입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 5
