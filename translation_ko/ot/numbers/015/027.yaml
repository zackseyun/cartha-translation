  source_fidelity: 히브리어의 조건절, 비고의적 범죄, 한 사람, 한 살 된 암염소, 그리고 חַטָּאת 제물을 모두 충실히 반영합니다. 다만 여성형 동사는 여성 명사 נֶפֶשׁ에 대한 문법적 일치일 수 있으므로, 한국어에서 남성 대명사 「그는」을 넣으면 원문의 적용 범위를 불필요하게 성별화하고 문법적 성도 바꾸게 됩니다.
