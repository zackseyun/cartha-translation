translation:
  language: ko
  text: 그리하여 너희가 기억하고 내 모든 계명을 행하여 너희 하나님께 거룩한 자들이 되도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 하나님께 거룩하게 되도록 하십시오.’ 히브리어는 하나님과의 관계 안에서 거룩한 상태가 되는 것을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 그리하여
  - ~하기 위하여
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 ה לְמַעַן의 기능을 살리면서, 현대 한국어에서 자연스러운 목적 연결로 옮겼습니다.
- source_word: תִּזְכְּרוּ
  english_pob_choice: you may remember
  chosen_korean: 너희가 기억하고
  alternatives_korean:
  - 너희가 기억할 수 있고
  - 너희가 상기하고
  lexicon: HALOT
  rationale: 목적절의 모달 뉘앙스를 살리되, 한국어에서는 ‘기억하다’가 언약적 기억의 표준적 표현이므로 이를 선택했습니다.
- source_word: אֶת כָּל מִצְוֺתָי
  english_pob_choice: all my commandments
  chosen_korean: 내 모든 명령
  alternatives_korean:
  - 내 모든 계명
  - 내 모든 계명들
  lexicon: HALOT
  rationale: מִצְוֹת의 법적·언약적 성격은 유지하되, 한국어에서 ‘명령’이 더 직접적으로 하나님의 요구를 드러냅니다. ‘모든’으로 כָּל을 분명히 반영했습니다.
- source_word: קְדֹשִׁים לֵאלֹהֵיכֶם
  english_pob_choice: be holy to your God
  chosen_korean: 너희의 하나님께 대하여 거룩하게 되십시오
  alternatives_korean:
  - 너희의 하나님께 속하여 거룩해지십시오
  - 너희의 하나님께 대하여 구별된 자가 되십시오
  lexicon: HALOT
  rationale: קְדֹשִׁים의 핵심인 ‘거룩함/구별됨’을 유지하되, לֵאלֹהֵיכֶם의 관계 표지를 한국어의 ‘~께 대하여’로 옮겨 출처의 긴장을 과도하게 완화하지 않았습니다.
theological_decisions:
- issue: ‘holy’의 번역 범위
  chosen_reading: ‘거룩하게 되십시오’로 번역해 윤리적 순종과 언약적 구별의 의미를 함께 남겼습니다.
  alternative_readings:
  - 구별된 자가 되십시오
  - 성별되십시오
  rationale: 이 구절은 계명을 기억하고 행하는 것과 거룩함을 직접 연결하므로, ‘거룩하다’를 유지하는 편이 신학적 범위를 가장 온전히 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
