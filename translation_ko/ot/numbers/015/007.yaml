id: NUM.15.7
reference: Numbers 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or “as a libation”; the Hebrew term refers to a poured drink offering accompanying the sacrifice.
    reason: lexical_alternative
  - marker: b
    text: A hin was an ancient liquid measure.
    reason: cultural_note
  - marker: c
    text: Or “a soothing aroma” or “a sweet-smelling aroma.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 전제 드리는 포도주, 곧 한 힌의 삼분의 일을 야훼께 향기로운 냄새로 드리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전제”이며, 히브리어는 희생제사에 곁들여 붓는 마시는 제물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 힌은 고대의 액량 단위입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “기쁘게 받으시는 향”이나 “향기로운 향기”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַ֥יִן
  english_pob_choice: and wine
  chosen_korean: 그리고 전제 드리는 포도주
  alternatives_korean:
  - 그리고 포도주
  - 그리고 술
  lexicon: HALOT
  rationale: יַיִן은 일반적으로 포도주를 뜻하며, 여기서는 앞 절의 제사 규정에 이어지는 전제의 내용이므로 ‘전제 드리는 포도주’로 풀어 원문의 제의적 기능을 드러냈습니다.
- source_word: לַ/נֶּ֖סֶךְ
  english_pob_choice: for the drink offering
  chosen_korean: 전제 드리는
  alternatives_korean:
  - 전제용의
  - 붓는 제물의
  lexicon: HALOT
  rationale: נֶסֶךְ은 붓는 제사, 곧 drink offering을 가리키므로, 한국어 성경에서 익숙한 ‘전제’로 옮기되 동작성을 살리기 위해 앞에 ‘드리는’을 붙였습니다.
- source_word: שְׁלִשִׁ֣ית הַ/הִ֑ין
  english_pob_choice: a third of a hin
  chosen_korean: 한 힌의 삼분의 일
  alternatives_korean:
  - 힌의 삼분의 일
  - 1/3 힌
  lexicon: HALOT
  rationale: 수량 표현은 원문의 고대 계량 단위를 보존하는 것이 중요하므로 ‘힌’을 유지하고, 의미를 분명하게 하기 위해 ‘한 힌의 삼분의 일’로 자연스럽게 풀었습니다.
- source_word: רֵֽיחַ נִיחֹ֖חַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기쁘게 받으시는 향
  - 기분 좋은 냄새
  lexicon: HALOT
  rationale: רֵיחַ נִיחֹחַ는 제사가 야훼께 받아들여짐을 나타내는 관용구이므로, 문자적으로만 좁히지 않되 제의적 수용의 뜻을 지나치게 해석하지 않는 ‘향기로운 냄새’로 옮겼습니다.
- source_word: לַ/יהוָֽה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문이 여호와의 이름 곧 YHWH를 직접 사용하므로, 본 프로젝트의 기본 원칙에 따라 ‘야훼’를 유지하고 여격 표지를 붙여 ‘야훼께’로 번역했습니다.
theological_decisions:
- issue: 제사 언어의 수용성 표현
  chosen_reading: ‘향기로운 냄새’로 옮겨, 제물이 야훼께 받아들여지는 의미를 살렸습니다.
  alternative_readings:
  - ‘기쁘게 받으시는 향’
  - ‘달콤한 향기’
  rationale: 히브리어 관용구는 신적 수용의 의미를 담지만, 한국어 본문에서는 과도한 신학적 확장 없이 원문의 제의적 의미를 읽히게 하는 표현이 적절합니다.
  doctrine_reference: Numbers 제사 규정의 관용구 처리 원칙
