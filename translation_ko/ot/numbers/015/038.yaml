id: NUM.15.38
reference: Numbers 15:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
  footnotes:
  - marker: a
    text: Or 'fringes' for 'tassels' (Hebrew צִיצִת).
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word תְּכֵלֶת refers to a blue or blue-purple dye/color used in Israel's sacred materials.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. 그들이 대대로 자기들의 옷의 귀퉁이마다 술[a]을 만들고, 각 귀퉁이의 술에 청색[b] 끈을 달게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘술장식’ 또는 ‘프린지’. 히브리어 צִיצִת.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תְּכֵלֶת은 이스라엘의 성소 재료에 쓰인 청색 또는 청자색 계열의 염색 색깔을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어 성서 문맥에서 자연스러운 집합 명칭으로 옮겼습니다. ‘자손’은 남성 kinship 표지를 완전히 지우지 않으면서도 전체 집단을 가리키기 적절합니다.
- source_word: צִיצִת
  english_pob_choice: tassels
  chosen_korean: 술
  alternatives_korean:
  - 장식술
  - 술장식
  - 프린지
  lexicon: HALOT
  rationale: POB의 영어 선택은 물리적 매듭 장식에 초점을 둔 ‘tassels’이므로, 한국어 성서 용례에서 널리 쓰이는 ‘술’이 가장 간결하고 원문 대응성이 높습니다.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  english_pob_choice: on the corners of their garments
  chosen_korean: 그들의 옷 자락 네 귀
  alternatives_korean:
  - 그들의 옷 가장자리
  - 그들의 옷 모서리
  lexicon: HALOT
  rationale: כָּנָף의 관용적 의미는 옷의 끝·모퉁이이므로, ‘옷 자락 네 귀’가 원문의 공간적 이미지를 가장 분명하게 전달합니다.
- source_word: פְּתִיל תְּכֵלֶת
  english_pob_choice: a cord of blue
  chosen_korean: 청색 실
  alternatives_korean:
  - 푸른 실
  - 청색 끈
  - 파란 끈
  lexicon: HALOT
  rationale: תְּכֵלֶת은 성소 재료에 쓰인 청색/청자색 계열 염색을 가리키므로, ‘청색’으로 보존하고 פְּתִיל은 장식에 꿰매는 실의 성격을 따라 ‘실’로 옮겼습니다.
theological_decisions:
- issue: תְּכֵלֶת의 색채 뉘앙스
  chosen_reading: ‘청색 실’로 번역하되, 특정한 성소용 염색 색조를 한국어 본문 안에서는 과도하게 규정하지 않았습니다.
  alternative_readings:
  - ‘청자색 실’
  - ‘파란 실’
  rationale: 원문은 성스러운 재료와 관련된 정체성 표지를 주지만, 이 절 자체는 색조의 세부보다 표식의 명령에 초점이 있습니다. 따라서 지나치게 기술적인 색명은 피하고, 주석 없이도 이해되는 ‘청색’을 택했습니다.
  doctrine_reference: 출애굽기·민수기의 성소 색채 전승
