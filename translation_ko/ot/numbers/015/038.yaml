revisions:
- from: 이스라엘 자손에게 말하여 그들에게 이르십시오. 대대로 그들의 옷 자락 네 귀에 술을 만들고, 그 귀의 술에 청색 실을 달게 하십시오.[a][b]
  to: 이스라엘 자손에게 말하여 그들에게 이르십시오. 그들이 대대로 자기들의 옷의 귀퉁이마다 술[a]을 만들고, 각 귀퉁이의 술에 청색[b] 끈을 달게 하십시오.
  rationale: 원문에 명시되지 않은 ‘네’를 삭제하여 수량 첨가를 피하고, 옷의 복수 귀퉁이와 마지막 절의 분배적 단수를 ‘귀퉁이마다/각 귀퉁이’로 반영했습니다. פְּתִיל은 ‘끈’으로 수정했으며, 각주 표지를 해당 어휘 바로 뒤에 배치하고 어휘 대안을 명시했습니다.
