  source_fidelity: 본문은 공동체와 그 가운데 사는 גֵּר에게 용서가 미치며, 그 이유가 온 백성의 부지중의 잘못에 있음을 정확히 나타내야 합니다. 초안의 의미는 대체로 적절하지만, 마지막 절을 ‘범한 일이’라고 한 표현은 생략된 목적어를 보충한 것이므로 더 자연스럽고 명시적인 ‘잘못을 범하였기’로 다듬었습니다.
  naturalness: ‘용서가 베풀어질 것입니다’도 가능하나, 법적·제의적 선언문에서는 ‘용서받을 것입니다’가 더 간결하고 자연스럽습니다. גֵּר는 현대 한국어에서 여행자 의미가 강한 ‘나그네’보다 ‘거류민’이 법적 거주민이라는 문맥을 더 정확히 전달합니다.
  terminology: ‘이스라엘 자손’, ‘회중’, ‘부지중에’는 원문의 언약·법률 문맥과 고의성 없는 잘못이라는 구별을 잘 보존합니다. ‘거류민’은 גֵּר의 사회·법적 지위를 명료하게 드러냅니다.
