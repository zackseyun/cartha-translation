id: NUM.15.26
reference: Numbers 15:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
  footnotes:
  - marker: a
    text: Or 'the whole community of the Israelites.' The Hebrew reads 'the congregation of the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' refers to a resident foreigner living among Israel under the community''s laws and protections.'
    reason: cultural_note
  - marker: c
    text: Or 'for all the people were in error.' The Hebrew final clause is compact and may be rendered more literally that way.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손의 온 회중[a]과 그들 가운데 사는 거류민[b]도 용서받을 것입니다. 온 백성이 부지중에 잘못을 범하였기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손의 온 회중’은 ‘이스라엘의 온 공동체’로도 옮길 수 있습니다. 히브리어는 직역하면 ‘이스라엘 자손의 회중’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거류민’은 이스라엘 공동체 안에 거주하면서 그 법과 보호 아래 있던 외국 출신 거주민을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 마지막 절은 동사가 생략된 압축 표현입니다. ‘온 백성이 부지중에 잘못을 범하였기 때문입니다’ 또는 ‘온 백성이 실수하였기 때문입니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  english_pob_choice: shall be forgiven
  chosen_korean: 용서가 베풀어질 것입니다
  alternatives_korean:
  - 용서될 것입니다
  - 용서를 받게 될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 결과적·수동적 의미를 살려, 행위 주체를 드러내지 않는 공적 선언형으로 옮겼습니다.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘의 온 공동체
  lexicon: HALOT
  rationale: עֵדָה의 예배·언약적 뉘앙스를 살려 ‘회중’을 택했고, בְּנֵי יִשְׂרָאֵל은 직역적이면서도 자연스러운 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  english_pob_choice: along with the sojourner who sojourns among them
  chosen_korean: 그들 가운데 거주하는 나그네에게도
  alternatives_korean:
  - 그들 가운데 머무는 이방 거주자에게도
  - 그들 가운데 사는 거류민에게도
  lexicon: HALOT
  rationale: גֵּר를 ‘나그네’로 옮겨 POB의 ‘sojourner’ 뉘앙스를 살렸고, גור의 반복을 ‘거주하는’으로 표현해 거류 범주를 분명히 했습니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에 범한
  alternatives_korean:
  - 실수로 한
  - 무의식중에 한
  lexicon: HALOT
  rationale: 법정·제의 문맥의 שְׁגָגָה는 고의 없는 잘못을 뜻하므로, 현대 한국어에서 가장 명확한 ‘부지중에’로 옮겼습니다.
theological_decisions:
- issue: 공동체 전체와 나그네의 포함
  chosen_reading: 용서는 이스라엘 회중 전체뿐 아니라 그들 가운데 거주하는 나그네에게도 동일하게 확장됩니다.
  alternative_readings:
  - 문맥상 나그네는 별도 예외가 아니라 공동체의 제의적 책임 안에 포함됩니다.
  rationale: 히브리어는 공동체적 속죄 범위에 나그네를 포함시켜, 언약 공동체 안의 법적·제의적 포괄성을 드러냅니다.
  doctrine_reference: 민수기 15장 제의 규정의 공동체적 적용
