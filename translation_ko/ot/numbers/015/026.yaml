- from: 그리고 이스라엘 자손의 온 회중과 그들 가운데 거주하는 나그네에게도 용서가 베풀어질 것입니다. 이는 온 백성이 부지중에 범한 일이기 때문입니다.[a][b][c]
  to: 이스라엘 자손의 온 회중[a]과 그들 가운데 사는 거류민[b]도 용서받을 것입니다. 온 백성이 부지중에 잘못을 범하였기 때문입니다.[c]
  rationale: 원문의 수동적 용서 선언, 이스라엘 회중과 גֵּר의 병렬적 포함, 그리고 부지중의 공동체적 잘못이라는 법률적 의미를 보존했습니다. 불완전한 각주 c를 완결된 대안 번역 설명으로 고치고, 각주 표지를 해당 어구에 배치했습니다.
