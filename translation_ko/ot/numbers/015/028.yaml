  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: ko
  text: 제사장은 야훼 앞에서, 실수로 죄를 짓는 그 사람을 위해 속죄해야 합니다. 곧 그가 실수로 죄를 지었을 때, 그를 위해 속죄하면 그는 용서받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 שׁגג 어근을 반복해 ‘의도치 않은/실수로’라는 범주를 강조합니다.
    reason: source_note
  - marker: b
    text: יְהוָה는 본문에 나타난 신명 표기이며, 여기서는 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְכִפֶּר
  english_pob_choice: shall make atonement
  chosen_korean: 속죄해야 합니다
  alternatives_korean:
  - 죄를 속해야 합니다
  - 속죄를 행해야 합니다
  lexicon: HALOT
  rationale: 제사장 행위의 제의적 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장은
  alternatives_korean:
  - 그 제사장은
  - 사제는
  lexicon: HALOT
  rationale: 성막·제의 문맥의 공식적 직분을 가리키므로 ‘제사장’이 가장 직접적입니다.
- source_word: הַנֶּפֶשׁ הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  english_pob_choice: the person who sins unintentionally, when he sins unintentionally
  chosen_korean: 실수로 죄를 짓는 그 사람을 위해 ... 곧 그가 실수로 죄를 지었을 때
  alternatives_korean:
  - 부지중에 죄를 짓는 그 사람을 위해 ... 그가 부지중에 죄를 지었을 때
  - 부주의하게 죄를 범한 그 사람을 위해 ... 그가 부주의하게 죄를 범했을 때
  lexicon: HALOT
  rationale: שׁגג의 반복을 살려 ‘실수로 죄를 짓다’로 옮겼고, 본문의 중복 표현을 한국어에서도 반복으로 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명 표기를 직역 전통에 따라 ‘야훼’로 옮겨, 본문이 사용하는 언약명을 보존했습니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: and he shall be forgiven
  chosen_korean: 그는 용서받을 것입니다
  alternatives_korean:
  - 그에게 용서가 주어질 것입니다
  - 그의 죄가 사해질 것입니다
  lexicon: HALOT
  rationale: 수동형 결과를 자연스럽게 나타내면서, 속죄 행위의 결과가 용서임을 분명히 했습니다.
theological_decisions:
- issue: 예배적 속죄 언어의 보존
  chosen_reading: ‘속죄하다’와 ‘용서받다’를 함께 유지해, 제사장적 행위와 그 결과를 분리해서 드러냈습니다.
  alternative_readings:
  - ‘죄를 사하다’로 단순화
  - ‘화해시키다’로 일반화
  rationale: 히브리어 כפר와 סלח의 서로 다른 의미층을 흐리지 않기 위해 제의적 행위와 용서의 결과를 구분했습니다.
  doctrine_reference: Numbers 15 제의 규례의 문맥
- issue: 반복 구조의 유지
  chosen_reading: ‘실수로 죄를 짓는 ... 곧 그가 실수로 죄를 지었을 때’로 반복을 살렸습니다.
  alternative_readings:
  - 중복을 줄여 한 번만 표현
  - ‘부지중에 범한 죄’로 압축
  rationale: 도학적으로도, 본문은 반복을 통해 의도치 않은 범죄의 범주를 강조하므로 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: Source-text repetition of שׁגג
