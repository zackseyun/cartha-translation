revisions:
- from: 제사장은 야훼 앞에서, 실수로 죄를 짓는 그 사람을 위해 속죄해야 합니다. 곧 그가 실수로 죄를 지었을 때, 그를 위해 속죄하면 그는 용서받을 것입니다.[a][b]
  to: 제사장은 야훼 앞에서 실수로 죄를 지은 사람을 위하여 속죄할 것입니다. 곧 그가 실수로 죄를 지었을 때, 그를 위하여 속죄하여 그는 용서받을 것입니다.[a][b]
  rationale: 두 번째 속죄 표현을 조건문이 아닌 연결형 ‘속죄하여’로 고쳐 히브리어 목적 표현의 기능과 용서의 결과를 보존했습니다. ‘실수로’의 반복은 유지했으며, 제의적 ‘속죄’와 수동적 결과인 ‘용서받다’도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 제사장이 의도치 않게 죄를 지은 사람을 위하여 속죄하고 그 결과 그 사람이 용서받는다고 말합니다. 초안은 שׁגג 어근의 반복과 כפר/סלח의 구별을 대체로 잘 보존합니다. 그러나 두 번째 ‘속죄하면’은 לְכַפֵּר עָלָיו의 목적 표현을 조건문으로 바꾸어, 용서가 조건적으로 발생하는 듯한 관계를 만듭니다.
  naturalness: ‘실수로 죄를 짓는 그 사람’은 다소 구어적이고 지시어가 불필요하게 무겁습니다. ‘실수로 죄를 지은 사람’이 현대 표준어 문장에 더 자연스럽습니다. 또한 법규적 문맥의 ‘shall’은 ‘해야 합니다’보다 ‘할 것입니다’가 서술적 규정 문체와 더 잘 맞습니다.
  terminology: ‘제사장’, ‘야훼’, ‘속죄하다’, ‘용서받다’는 적절합니다. ‘야훼 앞에서’의 수식 범위는 히브리어에서 완전히 단정하기 어려우나, 영어 POB 감사본의 배열을 따라 제사장의 속죄 행위와 연결하는 번역은 가능한 범위입니다.
  issues:
  - severity: medium
    issue: ‘그를 위해 속죄하면’이 목적 표현을 조건문으로 전환합니다.
    rationale: לְכַפֵּר עָלָיו는 ‘그를 위하여 속죄하기 위해/속죄하여’라는 목적·기능의 표현이며, ‘~하면’은 본문에 없는 조건 관계를 부가합니다.
  - severity: low
    issue: ‘속죄해야 합니다’와 ‘실수로 죄를 짓는 그 사람’의 문체와 표현이 다소 부자연스럽습니다.
    rationale: 법규적 미래 서술에는 ‘속죄할 것입니다’가 자연스럽고, ‘실수로 죄를 지은 사람’이 간결하면서도 원문의 인칭 일반성을 유지합니다.
  revised_text: 제사장은 야훼 앞에서 실수로 죄를 지은 사람을 위하여 속죄할 것입니다. 곧 그가 실수로 죄를 지었을 때, 그를 위하여 속죄하여 그는 용서받을 것입니다.[a][b]
