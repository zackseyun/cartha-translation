source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
  footnotes:
  - marker: a
    text: Or 'for a purification offering.' The Hebrew חַטָּאת can denote the offering associated with sin and its ritual purification effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그 일이 회중이 알지 못한 채 부지중에 행해졌다면, 온 회중은 야훼께 기쁜 향기가 되도록 수소 한 마리를 번제로 드리고, 그에 딸린 곡식제물과 전제를 규례대로 드리며, 숫염소 한 마리를 속죄제로 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת은 죄와 관련된 제물을 가리킬 수 있으며, 그 제의적 정결 효과를 강조하여 ‘정결제’로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה / escaped the notice of the congregation
  english_pob_choice: escaped the notice of the congregation
  chosen_korean: 회중의 눈에 띄지 않게
  alternatives_korean:
  - 회중의 눈을 피해
  - 회중이 알아채지 못하게
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘회중의 눈에서’이지만, 문맥상 ‘눈에 띄지 않다/알아채지 못하다’의 뜻이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה / it was done unintentionally
  english_pob_choice: it was done unintentionally
  chosen_korean: 부지중에 행해졌으면
  alternatives_korean:
  - 무심코 행해졌으면
  - 실수로 행해졌으면
  lexicon: HALOT
  rationale: שְׁגָגָה는 고의가 아닌 부주의·부지의 행위를 가리키므로, 제의·법률 문맥에 잘 맞는 ‘부지중에’로 풀었습니다.
- source_word: פַּר בֶּן בָּקָר אֶחָד / one bull from the herd
  english_pob_choice: one bull from the herd
  chosen_korean: 소 떼에서 수송아지 한 마리
  alternatives_korean:
  - 한 마리의 수송아지
  - 한 마리의 어린 황소
  lexicon: HALOT
  rationale: פַּר בֶּן בָּקָר은 가축 떼에 속한 수송아지를 뜻하므로, 제물의 종류를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: לְעֹלָה לְרֵיחַ נִיחֹחַ לַיהוָה / for a burnt offering, for a pleasing aroma to Yahweh
  english_pob_choice: for a pleasing aroma to Yahweh
  chosen_korean: 번제물로, 곧 야훼께 향기로운 냄새가 되게 하며
  alternatives_korean:
  - 번제물로, 야훼께 기쁘게 받으실 향이 되게 하며
  - 번제물로, 야훼께 상쾌한 향이 되게 하며
  lexicon: HALOT
  rationale: ‘향기로운 냄새’는 제의적 관용구로서 하나님이 받으시는 स्वीकार/기쁨의 뜻을 담습니다. 또한 יְהוָה는 본문 기준에 따라 야훼로 옮겼습니다.
- source_word: וּמִנְחָתוֹ וְנִסְכּוֹ / with its grain offering and its drink offering
  english_pob_choice: with its grain offering and its drink offering
  chosen_korean: 그 소제와 그 전제도
  alternatives_korean:
  - 그 곡식제물과 그 전제도
  - 그 곁들임 곡식제물과 그 전제도
  lexicon: HALOT
  rationale: מִנְחָה와 נֶסֶךְ는 제의 문맥의 고정 용어이므로, 전통적 한국어 성경 용례와 본문의 제의성을 살려 ‘소제’와 ‘전제’로 옮겼습니다.
- source_word: לְחַטָּאת / for a sin offering
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 죄제물로
  - 정결제물로
  lexicon: HALOT
  rationale: חַטָּאת은 죄와 정결의 효과를 함께 가질 수 있으나, 이 절에서는 제의 용어의 안정성을 살려 ‘속죄제물’로 번역했습니다.
theological_decisions:
- issue: לַיהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 주어진 프로젝트 기본값에 따라 언약적 신명 יְהוָה를 ‘야훼’로 직접 반영했습니다. 이는 본문의 신명 사용을 가리고 통상 번역어로 완화하지 않기 위한 선택입니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
- issue: חַטָּאת의 제의적 뉘앙스
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄제물
  - 정결제물
  rationale: 문맥상 번제와 함께 드리는 규정된 희생제사이므로, 본문 읽기에서 가장 익숙하면서도 제의 기능을 유지하는 ‘속죄제물’을 본문에 두었습니다.
  doctrine_reference: Translation philosophy §3, §5
