revisions:
- from: 그리고 그것이 회중의 눈에 띄지 않게 부지중에 행해졌으면, 온 회중은 소 떼에서 수송아지 한 마리를 번제물로, 곧 야훼께 향기로운 냄새가 되게 하며, 그 소제와 그 전제도 규례에 따라 드리고, 숫염소 한 마리를 속죄제물로 드려야 합니다.[a]
  to: 만일 그 일이 회중이 알지 못한 채 부지중에 행해졌다면, 온 회중은 야훼께 기쁜 향기가 되도록 수소 한 마리를 번제로 드리고, 그에 딸린 곡식제물과 전제를 규례대로 드리며, 숫염소 한 마리를 속죄제로 드려야 합니다.[a]
  rationale: 원문의 조건절에 있는 ‘회중이 알지 못함’과 ‘부지중에 행해짐’을 모두 유지하면서 자연스럽게 연결했습니다. 수소의 연령을 ‘송아지’로 확정하지 않았고, 번제의 ‘기쁜 향기’ 관용구와 부속 곡식제물·전제의 규례 준수를 명료하게 반영했습니다. חַטָּאת의 번역상 논쟁은 본문에서 통용 용어를 사용하고 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:53Z'
