  source_fidelity: 초안은 회중이 알아채지 못한 부지중의 행위, 수소 한 마리의 번제, 이에 딸린 곡식제물과 전제, 숫염소 한 마리의 חַטָּאת이라는 기본 요소를 대체로 보존합니다. 그러나 פַּר בֶּן־בָּקָר을 ‘수송아지’로 한정하는 것은 원문의 ‘수소/황소’보다 좁을 수 있고, לְרֵיחַ נִיחֹחַ의 제의적 표현도 더 정확하고 자연스럽게 다듬을 필요가 있습니다.
  naturalness: ‘회중의 눈에 띄지 않게 부지중에’는 두 관용 표현이 겹쳐 다소 부자연스럽고, ‘번제물로, 곧 야훼께 향기로운 냄새가 되게 하며’는 문장 연결과 ‘향기로운 냄새’가 어색합니다. 조건절과 제물 목록을 현대 한국어의 정중한 문체로 정리했습니다.
