language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
  footnotes:
  - marker: a
    text: Or, more literally, 'upon the burnt offering.' The Hebrew preposition can be rendered more formally, but here likely indicates accompaniment in the sacrificial rite.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for the one lamb'; the translation 'for each lamb' brings out the distributive force in the instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 부으실 소제물로 포도주를 준비하되, 번제와 함께 또는 제물과 함께 각 어린양마다 한 힌의 사분의 일을 드려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘번제 위에’입니다. 그러나 이 문맥에서는 위치보다 함께 바쳐지는 관계를 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 어린양을 위하여’입니다. 문맥상 규정된 분량이 각 어린양마다 적용된다는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  english_pob_choice: And ... wine
  chosen_korean: 그리고 포도주
  alternatives_korean:
  - 그리고
  - 그리고 포도주를
  lexicon: HALOT
  rationale: וְ는 앞 절의 지시를 이어 주는 접속사이고, יַיִן은 일반적인 ‘포도주’이므로 자연스러운 한국어 순서로 옮겼습니다.
- source_word: לַ/נֶּסֶךְ
  english_pob_choice: for the drink offering
  chosen_korean: 부으실 소제물로
  alternatives_korean:
  - 전제물로
  - 부어 드릴 전제물로
  - 전제제로
  lexicon: HALOT
  rationale: 제의적 용례에서 נֶסֶךְ은 ‘붓는 제물’이지만, 한국어에서는 ‘전제물’보다 기능이 드러나는 ‘부으실 소제물’이 소스의 제의 행위를 더 분명히 보여 줍니다.
- source_word: רְבִיעִית הַ/הִין
  english_pob_choice: a quarter of a hin
  chosen_korean: 한 힌의 사분의 일
  alternatives_korean:
  - 힌의 사분의 일
  - 힌 한 사분의 일
  - 사분의 일 힌
  lexicon: HALOT
  rationale: 분량과 고대 단위인 힌을 함께 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: עַל הָ/עֹלָה א֣וֹ לַ/זָּבַח
  english_pob_choice: with the burnt offering or the sacrifice
  chosen_korean: 번제와 함께 또는 제물과 함께
  alternatives_korean:
  - 번제 위에 또는 제물 위에
  - 번제에 곁들여 또는 제물에 곁들여
  - 번제와 또는 제물과 함께
  lexicon: HALOT
  rationale: עַל은 이 제의 문맥에서 ‘위에’보다 동반/병행의 뜻이 강하므로 ‘와 함께’로 풀었습니다. זֶבַח은 특정 제사 종류를 일반적으로 가리키는 말이라 ‘제물’로 넓게 옮겼습니다.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  english_pob_choice: for each lamb
  chosen_korean: 각 어린양마다
  alternatives_korean:
  - 한 어린양마다
  - 각각의 어린양마다
  - 한 마리 어린양마다
  lexicon: HALOT
  rationale: 직역하면 ‘한 어린양을 위하여’이지만, 지시문 맥락에서 분배적 의미를 드러내는 ‘각 어린양마다’가 가장 분명합니다.
theological_decisions:
- issue: 제의 행위 표현에서 נֶסֶךְ과 עָשָׂה의 관계
  chosen_reading: ‘부으실 소제물로 포도주를 준비하되’로 옮겨, 단순 소유가 아니라 제의적 수행과 붓는 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘전제물로 포도주를 드려야 합니다’
  - ‘전제제로 포도주를 준비하되’
  rationale: 본문은 포도주 자체보다 제사 속에서의 준비·수행을 요구하므로, ‘준비하다’와 ‘부으실’의 결합으로 절차성을 살렸습니다.
  doctrine_reference: 제의 규례의 절차적 표현
- issue: עַל의 방향성
  chosen_reading: ‘번제와 함께’로 번역해, 문자적 ‘위에’보다 제의적 동반 관계를 드러냈습니다.
  alternative_readings:
  - ‘번제 위에’
  - ‘번제에’
  rationale: 히브리어 전치사 עַל은 여기서 공간적 위치보다 의례적 결합을 나타내므로, 한국어에서 오해를 줄이는 쪽을 택했습니다.
  doctrine_reference: 제의 문맥의 의미역
