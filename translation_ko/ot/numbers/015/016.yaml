base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
  footnotes:
  - marker: a
    text: Or 'resident foreigner.' The Hebrew גֵּר refers to a non-native living among Israel under its communal order.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희에게나 너희와 함께 거주하는 거류민에게나 한 율법과 한 규례가 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 히브리어 גֵּר를 옮긴 말로, 이스라엘 공동체 안에 거주하는 이스라엘인이 아닌 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 법
  lexicon: HALOT
  rationale: 이 문맥에서 תּוֹרָה는 일반적 가르침이 아니라 공동체를 구속하는 법적 규범이므로, POB의 ‘law’에 맞춰 표준적인 ‘율법’이 가장 직접적입니다.
- source_word: מִשְׁפָּט
  english_pob_choice: ordinance
  chosen_korean: 규례
  alternatives_korean:
  - 판결
  - 규칙
  - 법도
  lexicon: HALOT
  rationale: מִשְׁפָּט은 법적 판결이라기보다 정해진 규범이나 법적 조항의 뜻이 강하므로, ‘규례’가 ‘율법’과 구별되면서도 법정의 의미를 유지합니다.
- source_word: גֵּר / הַגָּר
  english_pob_choice: sojourner / who sojourns
  chosen_korean: 거류민 / 함께 사는
  alternatives_korean:
  - 나그네
  - 외국인 거주자
  - 체류하는
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 공동체 아래에 거주하는 비토착민을 가리키므로, 본문에는 ‘거류민’이 적절하고, הַגָּר는 반복 어근을 살려 ‘함께 사는’으로 옮겨 의미 연결을 드러냈습니다.
theological_decisions:
- issue: 이스라엘과 거류민에게 동일한 법적 기준이 적용되는가
  chosen_reading: ‘한 율법과 한 규례’는 본문 안에서 이스라엘과 그들 가운데 사는 거류민에게 동일한 기준이 적용됨을 분명히 말합니다.
  alternative_readings:
  - 문맥상 이 한 절은 바로 앞뒤의 특정 제의 규정에만 제한될 수 있습니다.
  rationale: 히브리어는 보편적 문구를 사용하지만, 문맥은 특정 법 조항 단락 안에 있으므로 번역은 그 넓이를 유지하되 범위를 과도하게 확장하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 동일성은 살리고, 문맥이 제한하는 범위는 따로 확정하지 않습니다.'
