  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
  footnotes:
  - marker: a
    text: Or 'the stranger' or 'the resident foreigner' for 'the sojourner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an everlasting statute' or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 회중인 너희와 너희 가운데 거류하는 나그네에게는 한 규례가 있어야 합니다. 이것은 너희 대대에 걸친 영속적인 규례입니다. 너희에게 적용되듯 나그네에게도 야훼 앞에서 적용되어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류하는 나그네’는 단순한 여행자가 아니라 공동체 가운데 거주하는 외국인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영속적인 규례’는 ‘영원한 규례’ 또는 ‘영구한 규례’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 집회
  - 모임
  - 총회
  lexicon: HALOT
  rationale: 히브리어 קָהָל은 모여 있는 공동체를 가리키므로, 한국어에서는 문맥상 자연스럽고 공동체성을 살리는 ‘회중’이 적절합니다.
- source_word: חֻקָּה אַחַת
  english_pob_choice: one statute
  chosen_korean: 하나의 규례
  alternatives_korean:
  - 한 규례
  - 하나의 율례
  - 하나의 법도
  lexicon: HALOT
  rationale: חֻקָּה는 제정된 법적 규정을 가리키므로, 현대 한국어에서 이해가 쉬운 ‘규례’로 옮기되 단일성을 ‘하나의’로 분명히 했습니다.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  english_pob_choice: for you and for the sojourner who sojourns with you
  chosen_korean: 너희와 함께 머무는 나그네에게도
  alternatives_korean:
  - 너희와 함께 사는 외국인에게도
  - 너희와 함께 거주하는 이방인에게도
  - 너희와 함께 거류하는 사람에게도
  lexicon: HALOT
  rationale: גֵּר는 단순한 ‘낯선 사람’이 아니라 공동체 안에 거주하는 외국인이므로, ‘나그네’로 옮기되 ‘함께 머무는’으로 정착적 상태를 드러냈습니다.
- source_word: חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם
  english_pob_choice: a permanent statute throughout your generations
  chosen_korean: 대대로 지켜야 할 영속한 규례
  alternatives_korean:
  - 너희 대대로의 영원한 규례
  - 세대를 이어 지켜야 할 영속한 규례
  - 대대로 계속될 규례
  lexicon: HALOT
  rationale: עוֹלָם은 법률문맥에서 끝없는 철학적 영원성보다 지속성을 뜻하므로, ‘영속한’이 문맥을 과장하지 않으면서도 지속적 효력을 잘 드러냅니다.
theological_decisions:
- issue: 이스라엘 공동체와 나그네의 법적 동등성
  chosen_reading: 이 구절은 이 사안에서 본토 회중과 함께 거주하는 나그네에게 동일한 규례가 적용됨을 분명히 말합니다.
  alternative_readings:
  - 즉시 문맥의 특정 제사 규정에만 제한해서 읽을 수 있습니다.
  rationale: 본문의 ‘하나의 규례’와 ‘너희가 그러하듯, 나그네도’라는 평행 구조를 살려, 법적 동등성을 분명히 하되 범위를 본문 이상으로 확장하지 않았습니다.
  doctrine_reference: 본문이 말하는 평등한 적용을 보존하되, 그 신학적 범위를 좁히거나 넓히지 않습니다.
