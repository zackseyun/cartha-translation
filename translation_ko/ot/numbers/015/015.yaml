  rationale: 문장의 병렬 관계를 바로잡아 ‘너희’와 ‘거류하는 나그네’ 모두에게 한 규례가 적용됨을 명확히 했습니다. 마지막 절은 히브리어의 비교·평행 구조가 가리키는 동등한 적용을 드러내되, 즉시 문맥을 넘어선 법적·신학적 범위를 덧붙이지 않았습니다. 두 각주는 각각 גֵּר 및 חֻקַּת עוֹלָם에 계속 연결되므로 앵커를 유지했습니다.
