  source_fidelity: 개정이 필요합니다. 초안은 ‘하나의 규례’와 ‘대대로’ 및 야훼 앞에서의 동등한 적용이라는 중심 뜻을 대체로 반영하지만, 첫 문장은 히브리어의 병렬 대상(‘너희와 거류하는 나그네’)을 한국어에서 불완전하게 연결합니다. 또한 마지막 ‘그러해야 합니다’는 무엇이 동일한지를 지나치게 불분명하게 하여, 한 규례의 동등한 적용이라는 문맥상 의미를 명료하게 드러내는 편이 안전합니다.
  naturalness: ‘너희와 함께 머무는 나그네에게도’는 앞의 ‘회중에게는’과 문법적으로 매끄럽게 병렬되지 않습니다. ‘거류하는 나그네’는 גֵּר의 정착적 체류 상태를 보이면서도 현대 한국어 문장 안에서 자연스럽습니다. ‘영속한’보다 ‘영속적인’이 현대 표준어 산문에서 더 자연스럽습니다.
