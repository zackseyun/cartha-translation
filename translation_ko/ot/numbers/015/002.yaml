  rationale: 문자적으로는 ‘너희 거주들/거주지들’에 가까우므로, “land of your dwellings”의 구조를 살려 ‘너희 거주지의 땅’으로 옮겼습니다. ‘정착지’는 의미는 맞지만 약간 해석적입니다.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  english_pob_choice: which I am giving to you
  chosen_korean: 내가 너희에게 주고 있는
  alternatives_korean:
  - 내가 너희에게 주는
  - 내가 너희에게 줄
  lexicon: HALOT
  rationale: 분사 נֹתֵן의 진행·임박한 현재성을 살려, 단순 현재나 단순 미래보다 ‘주고 있는’으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 수신 대상을 가리키는 표현
  chosen_reading: 이스라엘 자손
  alternative_readings:
