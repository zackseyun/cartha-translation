  rationale: 히브리어의 친족적·언약적 표현을 보존해, 단순한 민족명으로 평면화하지 않았습니다. 이는 원문이 강조하는 공동체적 정체성을 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: source-directed precision'
- issue: 하나님의 주시는 행위의 시상
  chosen_reading: 내가 너희에게 주고 있는
  alternative_readings:
  - 내가 너희에게 준
  - 내가 너희에게 줄
  rationale: 분사형이 나타내는 현재적·확정적 선물을 유지하여, 약속의 땅이 이미 하나님 의지 안에서 주어지고 있는 것으로 표현했습니다.
  doctrine_reference: 'Translation philosophy: aspect-sensitive rendering'
