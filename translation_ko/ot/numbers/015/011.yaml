  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can refer more broadly to a head of small livestock, not only a lamb; the following phrase specifies one from the sheep or from the goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 한 수소, 한 숫양, 또는 양 떼 가운데서나 염소 떼 가운데서 한 어린 양에게도 그렇게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 더 넓게는 양이나 염소를 포함하는 작은 가축 한 마리를 가리킬 수 있습니다. 여기서는 뒤이어 양과 염소 범주가 구체화됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  english_pob_choice: Thus
  chosen_korean: 이와 같이
  alternatives_korean:
