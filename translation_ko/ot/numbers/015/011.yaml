    text: 히브리어 שֶׂה는 어린 양에만 한정되지 않고 양이나 염소에 속한 작은 가축 한 마리를 가리킬 수 있습니다. 뒤의 표현은 그것이 양 또는 염소에 속함을 구체적으로 밝힙니다.
    reason: lexical_alternative
