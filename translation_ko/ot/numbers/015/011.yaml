  source_fidelity: 원문의 כָּכָה는 한 번만 나타나는데, 초안은 문두의 ‘이와 같이’와 문말의 ‘그렇게’로 이를 중복했습니다. 또한 שֶׂה는 뒤의 ‘양/염소’ 분류로 제한되지만 그 자체가 ‘어린 양’만을 뜻하지는 않으므로, 본문에서 더 넓은 뜻을 유지하는 편이 안전합니다.
