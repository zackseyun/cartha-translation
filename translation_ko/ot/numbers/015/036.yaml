  rationale: 원문이 신명기적 서술에서 언약명 자체를 직접 사용하므로, POB 원칙에 따라 전통적 대치어보다 고유명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
