review_pass:
  verdict: revise
  source_fidelity: 히브리어는 회중이 그를 진 밖으로 ‘데리고/끌어내고’, 돌로 치며, 그가 죽었다고 순차적으로 서술합니다. 초안의 ‘끌고 나가’는 강제성을 다소 더하고, ‘돌로 쳐 죽였으며, 그가 죽었습니다’는 רגם의 결과를 먼저 확정하여 뒤의 ‘그가 죽었습니다’를 불필요하게 중복합니다.
  naturalness: ‘온 회중’, ‘진 밖’, ‘야훼께서 모세에게 명령하신 대로’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ‘돌로 쳤고, 그는 죽었습니다’는 원문의 행위와 결과를 명료하고 자연스럽게 보존합니다.
  terminology: עֵדָה는 ‘온 회중’으로, מַחֲנֶה는 ‘진’으로, יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 적절히 옮겼습니다. רגם은 ‘돌로 치다’로 옮겨 명시된 도구도 유지합니다.
  issues:
  - severity: medium
    issue: ‘끌고 나가’가 원문보다 강한 뉘앙스를 더합니다.
    rationale: Hiphil יצא는 ‘데리고/내보내다, 끌어내다’ 정도이며, 본문은 강압적 방식 자체를 특정하지 않습니다.
  - severity: medium
    issue: ‘돌로 쳐 죽였으며, 그가 죽었습니다’가 결과를 중복하고 원문의 서술 순서를 흐립니다.
    rationale: וַיִּרְגְּמוּ는 돌로 친 행위이고, 이어지는 וַיָּמֹת가 그의 죽음을 별도로 진술합니다. 한국어에서도 이를 분리하는 편이 충실합니다.
  revised_text: 그래서 온 회중이 그를 진 밖으로 데리고 나가 돌로 쳤고, 그는 죽었습니다. 야훼께서 모세에게 명령하신 대로였습니다.
