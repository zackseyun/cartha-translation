  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: ko
  text: 그래서 온 회중이 그를 진 밖으로 데리고 나가 돌로 쳤고, 그는 죽었습니다. 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 온 집회
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합체를 가리키므로, 제도적·언약적 뉘앙스를 살리는 '회중'을 택했고 כָּל은 '온'으로 옮겼습니다.
- source_word: וַיֹּצִיאוּ אֹתוֹ אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: brought him outside the camp
  chosen_korean: 그를 진 밖으로 끌고 나가
  alternatives_korean:
  - 그를 밖으로 데리고 나가
  - 그를 진 바깥으로 데리고 나가
  lexicon: HALOT
  rationale: יצא의 사역적 의미를 살려 '끌고 나가'로 옮겼고, מִחוּץ לַמַּחֲנֶה는 한국어에서 자연스러운 '진 밖'으로 간결하게 표현했습니다.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  english_pob_choice: stoned him with stones
  chosen_korean: 돌로 쳐 죽였으며
  alternatives_korean:
  - 돌로 쳤으며
  - 돌로 돌을 던졌으며
  lexicon: HALOT
  rationale: רגם은 돌로 치는 사형 집행을 뜻하므로, 한국어 관용에 맞게 결과까지 드러나는 '돌로 쳐 죽이다'를 택해 행위의 강도를 보존했습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: just as Yahweh had commanded Moses
  chosen_korean: 이는 야훼께서 모세에게 명령하신 그대로였습니다
  alternatives_korean:
  - 야훼께서 모세에게 명령하신 대로였습니다
  - 곧 야훼께서 모세에게 명령하신 바와 같았습니다
  lexicon: HALOT
  rationale: כַּאֲשֶׁר의 대응성을 '그대로'로 살렸고, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 יְהוָה는 '야훼'로 표기합니다.
  alternative_readings:
