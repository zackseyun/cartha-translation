source:
  edition: WLC
  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: For the native among the sons of Israel and for the sojourner who sojourns among them[a], there shall be one law for you[d][c][b], for the one who acts unintentionally.
  footnotes:
  - marker: a
    text: Or 'the native-born among the Israelites.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' refers to a resident foreigner living among Israel.'
    reason: cultural_note
  - marker: c
    text: Or 'one instruction' or 'one statute.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in error,' 'by mistake,' or 'unwittingly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손 가운데 있는 본토인과 그들 가운데서 거류하는 거류민에게는, 부지중에 행하는 자를 위한 법이 하나 있어야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 이스라엘 가운데 정착하여 사는 외국인을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘한 규례’ 또는 ‘한 규정’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부지중에’, ‘실수로’, ‘무심코’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: P OB의 영어 본문은 이 표현을 ‘one law for you’로 옮기고 있습니다.
    reason: source_note
lexical_decisions:
- source_word: הָאֶזְרָח
  english_pob_choice: the native
  chosen_korean: 본토인
  alternatives_korean:
  - 토착민
  - 원주민
  - 토박이
  lexicon: HALOT
  rationale: אֶזְרָח는 이스라엘 공동체의 내부 구성원을 가리키는 법률 용어이므로, 거류민과의 대비를 살리는 ‘본토인’이 가장 자연스럽고 정확합니다.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데 있는
  alternatives_korean:
  - 이스라엘 사람들 가운데 있는
  - 이스라엘의 자손들 가운데 있는
  lexicon: HALOT
  rationale: 직역적 구조를 유지하되 한국어에서는 ‘가운데 있는’으로 풀어 주어 법문장의 자연스러움을 살렸습니다.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  english_pob_choice: and for the sojourner who sojourns among them
  chosen_korean: 그들 가운데서 거류하는 거류민
  alternatives_korean:
  - 그들 가운데 사는 나그네
  - 그들 사이에 거주하는 외국인 거류민
  lexicon: HALOT
  rationale: גֵּר의 법적·사회적 의미를 살리기 위해 교회적 상용어인 ‘나그네’보다 ‘거류민’을 택했고, 반복 구조는 ‘거류하는 거류민’으로 보존했습니다.
- source_word: תּוֹרָה אַחַת
  english_pob_choice: one law
  chosen_korean: 법이 하나
  alternatives_korean:
  - 율법이 하나
  - 한 가지 규례
  lexicon: HALOT
  rationale: 여기서 תּוֹרָה는 일반적 율법 전체보다 적용 규범을 가리키므로, 법문맥을 살린 ‘법’이 가장 적절합니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 무심코
  - 실수로
  - 의도하지 않게
  lexicon: HALOT
  rationale: שְׁגָגָה의 법률적 의미인 ‘의도 없는 과실/오류’를 반영하면서, 죄책 상황에서의 부주의성을 압축적으로 드러내는 표현입니다.
theological_decisions:
- issue: 거류민과 본토인에게 동일한 법 적용
  chosen_reading: 본토인과 거류민 모두에게 같은 법이 적용된다는 법적 평등을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘한 율례’로 옮겨 보다 중립적으로 표현할 수 있습니다.
  - 공동체 내부자와 외부자의 차이를 약화시켜 일반 윤리로 풀 수도 있습니다.
  rationale: 본문은 차이를 지우는 것이 아니라, 부지중에 행한 경우 동일 기준이 적용된다는 법적 일치를 선언하므로 그 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
