translation:
  language: ko
  text: 그가 수송아지 위에 분식 제물을 드리되 고운 가루로 삼분의 일 에바를 기름에 섞어 반 힌을 드리라[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문 '에르론'은 에바의 10분의 1을 의미하며, 여기서는 세 개의 에르론을 합쳐 에바의 3분의 1을 가리킴.
    source: WLC
