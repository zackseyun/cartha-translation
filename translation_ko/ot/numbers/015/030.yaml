revisions:
- from: 그러나 손을 높이 들어[ [a] ] 범하는 자, 곧 토박이든 나그네든, 그는 야훼를 모독하는 사람이니, 그 사람은 자기 백성 가운데에서 끊어질 것입니다.
  to: 그러나 손을 높이 들어 행동하는 사람은[a], 본토 태생이든 나그네든, 야훼를 모독하는 사람이니, 그 사람은 자기 백성 가운데에서 끊어질 것입니다.
  rationale: ‘범하는’이 추가하던 특정한 범죄의 뉘앙스를 제거하여 עשה의 포괄성을 보존했고, 법률적 문체에 맞추어 ‘토박이’를 ‘본토 태생’으로 바꾸었습니다. 잘못된 각주 표지도 [a]로 정정했습니다. ‘손을 높이 들어’와 ‘끊어질 것입니다’는 원문의 관용적·법적 표현 및 그 해석상 모호성을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 대조 접속사, ‘높은 손으로’라는 관용구, 본토 태생과 거류 외부인의 포괄, 야훼에 대한 모독, 그리고 ‘자기 백성 가운데에서 끊어짐’이라는 미해결의 법적 공식을 대체로 충실히 반영합니다. 다만 ‘범하는’은 원문의 넓은 동사 עשה보다 행위의 범죄성을 더 구체화하므로 피하는 편이 안전합니다.
  naturalness: ‘토박이’는 현대 표준어이지만 이 법률적·격식적 문맥에서는 다소 구어적입니다. ‘본토 태생’이 더 적절합니다. 또한 각주 표지는 표준적인 [a] 형식으로 바로잡아야 합니다.
  terminology: ‘야훼’, ‘모독하다’, ‘끊어질 것입니다’, ‘나그네’는 프로젝트 선택 및 원문의 법적·신학적 긴장을 잘 보존합니다. ‘끊어짐’의 형벌 방식을 해석으로 확정하지 않은 점도 적절합니다.
  issues:
  - severity: medium
    issue: ‘범하는 자’가 원문의 עשה보다 행위의 내용을 과도하게 특정합니다.
    rationale: 이 절의 עשה는 ‘하다/행하다’라는 넓은 동사이며, 문맥상 반역적 행위를 뜻하지만 이 절 자체는 특정 범죄를 명시하지 않습니다. ‘행동하는 사람’으로 옮겨 해석적 추가를 줄이는 것이 안전합니다.
  - severity: low
    issue: ‘토박이’의 문체 수준이 법률적 본문과 완전히 조화되지 않습니다.
    rationale: ‘본토 태생’은 הָאֶזְרָח의 ‘native-born’을 더 격식 있게 전달하며 ‘나그네’와의 대조도 분명합니다.
  - severity: medium
    issue: 본문 각주 표지 형식이 ‘[ [a] ]’로 잘못 표기되었습니다.
    rationale: 각주 연결을 위해 표지를 [a]로 정정해야 합니다.
