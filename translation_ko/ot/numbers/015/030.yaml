id: NUM.15.30
reference: Numbers 15:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
  footnotes:
  - marker: a
    text: Or 'presumptuously' or 'defiantly'; literally 'with a high hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 손을 높이 들어 행동하는 사람은[a], 본토 태생이든 나그네든, 야훼를 모독하는 사람이니, 그 사람은 자기 백성 가운데에서 끊어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고의로’, ‘반항적으로’; 문자적으로는 ‘손을 높이 들어’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֶּפֶשׁ
  english_pob_choice: the person
  chosen_korean: 사람
  alternatives_korean:
  - 영혼
  - 개인
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 인간 전체를 가리키므로, 현대 한국어에서는 '사람'이 가장 자연스럽고 판결문의 성격도 잘 살립니다.
- source_word: בְּיָד רָמָה
  english_pob_choice: with a high hand
  chosen_korean: 손을 높이 들어
  alternatives_korean:
  - 고의로
  - 오만하게
  - 반항적으로
  - 손을 높이 들고
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 살려 원문의 생생한 표현을 유지했습니다. 의미는 본문 안에서 '범하다'와 함께 읽히며, 주석으로 해석 가능성을 열어 둡니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 '야훼'로 옮겼습니다.
- source_word: מְגַדֵּף
  english_pob_choice: is reviling / is blaspheming
  chosen_korean: 모독하는
  alternatives_korean:
  - 저주하는
  - 비방하는
  - 욕하는
  lexicon: HALOT
  rationale: גדף의 핵심은 하나님께 대한 공개적 경멸과 모독이므로, 한국어에서는 '모독하다'가 가장 직접적으로 그 중력을 전달합니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 끊어져야 합니다
  - 제거될 것입니다
  - 백성 가운데서 끊어질 것입니다
  lexicon: HALOT
  rationale: כרת의 법정 공식은 단순한 사회적 배제가 아니라 엄중한 언약적 제재를 가리키므로, 전통적 직역인 '끊어지다'를 유지했습니다.
- source_word: מִקֶּרֶב עַמָּהּ
  english_pob_choice: from among his people
  chosen_korean: 자기 백성 가운데에서
  alternatives_korean:
  - 백성 가운데에서
  - 그의 백성 가운데에서
  - 공동체 가운데에서
  lexicon: HALOT
  rationale: 문맥상 언약 공동체로부터의 제거를 뜻하므로, '백성 가운데에서'를 살리되 한국어 흐름에 맞게 정리했습니다.
theological_decisions:
- issue: 손을 높이 든 행위의 해석과 '끊어짐'의 범위
  chosen_reading: 본문은 고의적이고 공공연한 반역을 말하며, '끊어질 것입니다'가 사형, 축출, 혹은 신적 심판 중 무엇인지는 여기서 단정하지 않고 그대로 둡니다.
  alternative_readings:
  - 고의적 죄
  - 모독죄
  - 사형 선고
  - 공동체 추방
  rationale: 히브리어 관용구와 법정 공식의 긴장을 보존하기 위해, 번역에서 범죄의 성격과 형벌의 정확한 집행 방식을 과도하게 특정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
