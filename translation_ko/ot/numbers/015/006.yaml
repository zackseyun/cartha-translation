  to: 또는 수양 한 마리를 위하여 기름 삼분의 일 힌을 섞은 고운 가루 두 십분의 일[a]을 곡식 제물로 준비해야 합니다.
  rationale: 접속사 אֹו는 ‘또는’으로 보존하고, לְאַיִל은 ‘수양 한 마리를 위하여’로 옮겨 원문의 관계를 유지했습니다. ‘준비하다’라는 동사를 유지하여 봉헌 행위를 불필요하게 추가하지 않았으며, 기름과 섞인 고운 가루라는 수식 관계를 자연스러운 한국어 어순으로 표현했습니다. 분수 표현과 각주를 바로잡아 현대 표준어의 자연성과 측정 단위의 정확성을 높였습니다.
