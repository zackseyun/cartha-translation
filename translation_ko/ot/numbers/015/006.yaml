  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
  footnotes:
  - marker: a
    text: Hebrew literally 'two tenths,' with the larger unit understood from the sacrificial measurement system; compare the fuller expression elsewhere as 'two-tenths of an ephah.'
    reason: cultural_note
translation:
  language: ko
  text: 또는 수양 한 마리를 위하여 기름 삼분의 일 힌을 섞은 고운 가루 두 십분의 일[a]을 곡식 제물로 준비해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자 그대로 ‘두 십분의 일’입니다. 제사 측정 체계상 더 큰 단위인 에바의 십분의 일을 가리키며, 다른 곳에서는 ‘에바 십분의 이’로 더 분명히 표현됩니다.
    reason: 원문에 생략된 측정 기준을 설명하되, 본문에는 원문의 간결한 표현을 보존합니다.
