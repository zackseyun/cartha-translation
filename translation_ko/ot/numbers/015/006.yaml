  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
  footnotes:
  - marker: a
    text: Hebrew literally 'two tenths,' with the larger unit understood from the sacrificial measurement system; compare the fuller expression elsewhere as 'two-tenths of an ephah.'
    reason: cultural_note
translation:
  language: ko
  text: 또 수양을 드릴 때에는 고운 가루로 만든 소제물을 이십분의 이를 준비하되, 기름을 세분의 일 힌에 섞어 드릴지니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자 그대로 '두 십분의 일'이며, 제사 측정 체계에서 더 큰 단위인 에바를 전제로 함.
    source: WLC
