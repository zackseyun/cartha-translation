  text: כַּ/מִּסְפָּ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּ֛כָה תַּעֲשׂ֥וּ לָ/אֶחָ֖ד כְּ/מִסְפָּרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/012.yaml
  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
  footnotes:
  - marker: a
    text: Or 'According to the number that you make, thus you shall do for each one according to their number.' The Hebrew verb עשה commonly means 'do' or 'make'; here 'prepare' is used to clarify the sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 준비할 수에 따라, 각각을 위하여[a] 그 수에 맞게 그렇게 준비해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘한 사람/것을 위하여’이지만, 여기서는 ‘각각을 위하여’라는 분배적 뜻입니다. 이 절만으로 그 대상을 사람으로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּ/מִּסְפָּר
  english_pob_choice: According to the number
  chosen_korean: 네가 준비하는 수량에 따라
  alternatives_korean:
  - 수에 따라
  - 계수한 수대로
  lexicon: HALOT
  rationale: מִסְפָּר의 ‘number’는 문맥상 제의적 분량·수량을 가리키므로, 한국어에서는 자연스럽게 ‘수량’으로 풀어 절차적 의미를 살렸습니다.
- source_word: תַּעֲשׂוּ
  english_pob_choice: you prepare
  chosen_korean: 준비하는
  alternatives_korean:
  - 행하는
  - 만드는
  lexicon: HALOT
  rationale: עשה는 일반적으로 ‘하다/만들다’이지만, POB의 영어처럼 제의 문맥에서 필요한 제물을 ‘준비하다’로 옮기는 것이 의미를 더 정확히 전달합니다.
- source_word: לָ/אֶחָד
  english_pob_choice: for each one
  chosen_korean: 각 사람을
  alternatives_korean:
  - 각각을
  - 한 사람에게
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람/한 것에게’이지만, 여기서는 분배적 의미이므로 한국어에서는 자연스럽게 ‘각 사람을’로 처리해 반복되는 대상을 분명히 했습니다.
- source_word: כְ/מִסְפָּרָם
  english_pob_choice: according to their number
  chosen_korean: 그 수량대로
  alternatives_korean:
  - 그 수에 따라
  - 그 수대로
  lexicon: HALOT
  rationale: 복수 접미사는 앞서 헤아린 대상들의 총수를 가리키므로, ‘그 수량대로’가 절차와 분량의 대응을 간결하게 반영합니다.
