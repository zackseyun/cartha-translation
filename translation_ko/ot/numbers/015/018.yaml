  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בְּ/בֹֽאֲ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְ/כֶ֖ם שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 전하십시오. 너희가 내가 너희를 데리고 가는 그 땅에 들어갈 때에[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’ 또는 ‘이스라엘 사람들’입니다. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족·언약적 표현을 살리면서도 한국어에서 자연스러운 성경어로 옮겼습니다. 영어 POB의 문자성을 반영하되 성별을 불필요하게 평탄화하지 않았습니다.
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  english_pob_choice: Speak to ... and say to them
  chosen_korean: 말하여 그들에게 전하십시오
  alternatives_korean:
  - 말하고 그들에게 말하십시오
  - 전하여 그들에게 말하십시오
  lexicon: HALOT
  rationale: 두 동사의 연속 명령 구조를 한국어에서 중복을 줄이면서도 유지했습니다. '전하십시오'는 단순 전달이 아니라 공적·권위적 전달이라는 뉘앙스를 살립니다.
- source_word: בְּבֹאֲכֶם אֶל הָאָרֶץ
  english_pob_choice: When you come into the land
  chosen_korean: 너희가 ... 그 땅에 들어갈 때에
  alternatives_korean:
  - 너희가 ... 그 땅으로 들어올 때에
  - 너희가 ... 그 땅에 이르렀을 때에
  lexicon: HALOT
  rationale: בוא의 प्रवेश(들어감) 의미를 살려 '들어갈 때에'로 옮겼습니다. '그 땅'은 약속된 땅을 가리키는 문맥상 지시를 보존합니다.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  english_pob_choice: to which I am bringing you
  chosen_korean: 내가 너희를 데리고 가는
  alternatives_korean:
  - 내가 너희를 이끌고 가는
  - 내가 너희를 그리로 데리고 가는
  lexicon: HALOT
  rationale: 진행 중인 하나님의 인도 행위를 자연스러운 한국어로 표현했습니다. '데리고 가는'은 신적 주도의 이동을 분명히 하면서도 과도하게 해설하지 않습니다.
theological_decisions:
- issue: 직접 화법에서의 높임법
  chosen_reading: 하나님의 명령을 전달하는 문맥이므로 본문 서술은 합쇼체로 유지하되, 직접 인용 내부는 한국어의 자연스러운 공적 명령형을 사용했습니다.
  alternative_readings:
  - 하나님께 직접 높임을 더 강하게 드러내는 표현
  - 구어적 명령형
  rationale: 모세를 통한 계시 전달 구조를 한국어에서 과장하지 않으면서도, 청중에게 주어지는 권위 있는 명령이라는 성격을 보존하기 위함입니다.
  doctrine_reference: 계시 전달과 언약적 명령의 문체
