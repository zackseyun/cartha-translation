  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
  footnotes:
  - marker: a
    text: Or 'an offering made by fire.'
    reason: lexical_alternative
  - marker: b
    text: Or 'at your appointed festivals.' The Hebrew can refer broadly to appointed times or more specifically to festival occasions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 화제의 제물, 곧 번제나 제물을 드려 서원을 이행하든지[a], 자원제물로 드리든지, 혹은 너희의 정해진 때에 드려서 야훼께 향기로운 향기를 내야 합니다. 그것은 소 떼에서나 양 떼에서나 드려야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화제의 제물’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 정해진 절기 때에’. 히브리어는 넓게는 정해진 때를, 더 구체적으로는 절기 때를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם / אִשֶּׁה
  english_pob_choice: you present an offering by fire
  chosen_korean: 화제의 제물을 드리다
  alternatives_korean:
  - 불로 드리는 제물을 드리다
  - 화제물을 드리다
  lexicon: HALOT
  rationale: 사역적 ‘עשה’와 희생제 문맥의 ‘אִשֶּׁה’를 합쳐 한국어로는 자연스럽게 ‘화제의 제물’을 ‘드리다’로 옮겼습니다. ‘화제’는 제의적 용어를 보존하면서도 현대 한국어에서 통합니다.
- source_word: לְפַלֵּא נֶדֶר
  english_pob_choice: to fulfill a vow
  chosen_korean: 서원을 이행하다
  alternatives_korean:
  - 서원을 갚다
  - 서원을 수행하다
  lexicon: HALOT
  rationale: ‘נדר’는 서원이며, 동사구는 서원으로 약속한 제물을 실제로 이행하는 뜻입니다. ‘이행하다’가 의미를 가장 분명하게 드러냅니다.
- source_word: בִנְדָבָה
  english_pob_choice: as a freewill offering
  chosen_korean: 자원제물로
  alternatives_korean:
  - 자원하여
  - 자원제사로
  lexicon: HALOT
  rationale: 기원적인 ‘자원제물’이라는 제의 용어를 유지해, 서원제와 대비되는 자발적 헌물을 분명히 했습니다.
- source_word: בְּמֹעֲדֵיכֶם
  english_pob_choice: at your appointed times
  chosen_korean: 너희의 정해진 때에
  alternatives_korean:
  - 너희의 지정된 때에
  - 너희의 절기 때에
  lexicon: HALOT
  rationale: מועד의 범위를 축소하지 않기 위해 ‘절기’보다 더 넓은 ‘정해진 때’로 옮겼습니다. 본문이 포괄적인 정기적 시점을 가리킬 수 있기 때문입니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 향기
  alternatives_korean:
  - 기쁘게 하는 향기
  - 흡족한 향기
  lexicon: HALOT
  rationale: 직역을 넘지 않으면서 제의적 관용구를 살리기 위해 ‘향기로운 향기’로 옮겼습니다. 하나님께 상달되는 제사의 기쁨을 표현하지만, 의미를 과도하게 해석하지는 않습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 단락은 언약의 이름 יְהוָה를 반복적으로 사용하므로, 프로젝트 기본값에 따라 고유한 신명 ‘야훼’를 유지했습니다. 관용적 ‘주님’은 호칭의 의미를 약화시킬 수 있습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: רֵיחַ נִיחֹחַ의 신학적 함의
  chosen_reading: 향기로운 향기
  alternative_readings:
  - 기쁘게 하는 향기
  - 진정시키는 향기
  rationale: 제의적 표현을 그대로 유지하여, 본문이 말하는 ‘야훼께 향기롭게 여겨지는’ 제사의 뜻을 드러내되, 신을 달래는 기계적 뉘앙스는 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy: source-direct cultic idiom'
