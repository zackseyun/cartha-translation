revisions:
- from: 그리고 너희는 야훼께 화제의 제물, 곧 번제나 제물을 드려 서원을 이행하든지[a], 자원제물로 드리든지, 혹은 너희의 정해진 때에 드려서 야훼께 향기로운 향기를 내야 합니다. 그것은 소 떼에서나 양 떼에서나 드려야 합니다[b].
  to: 너희는 소 떼에서나 양 떼에서 가져온 화제[a], 곧 번제나 다른 제사를 야훼께 드려, 서원을 이행하거나 자원제물로 드리거나 너희의 정해진 때[b]에 드림으로써 야훼께 기쁨이 되는 향기를 내야 합니다.
  rationale: 화제의 출처인 ‘소 떼나 양 떼’를 원문과 같이 화제에 연결하고, רֵיחַ נִיחֹחַ을 자연스러운 현대 한국어의 제의 관용 표현으로 수정했습니다. 또한 각주 표지를 설명 대상 어휘로 옮겼습니다. ‘정해진 때’는 מוֹעֵד의 폭넓은 의미를 보존하며, 각주에서 절기라는 더 좁은 가능성을 제시합니다.
