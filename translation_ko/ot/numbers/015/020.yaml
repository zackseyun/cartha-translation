source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
  footnotes:
  - marker: a
    text: Or 'the first part of your kneading dough'; the Hebrew term may refer to dough itself or, by extension, the kneading bowl/trough.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'heave offering.' The Hebrew term denotes a contribution set apart and presented.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 첫 반죽에서 떡 하나를 들어 올려 예물로 바치십시오[a]. 타작마당의 예물[b]과 같이, 그것을 들어 올리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 반죽 첫 부분’이며, 히브리어는 반죽 자체나 확장하여 반죽그릇을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘거제물’이라고도 합니다. 히브리어는 따로 구별하여 바치는 헌물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: from the first of
  chosen_korean: 첫
  alternatives_korean:
  - 처음의
  - 첫 부분의
  lexicon: HALOT
  rationale: 반죽의 처음 부분에서 떼어 내는 부분적 의미를 살리기 위해 ‘첫’으로 옮겼습니다. ‘첫 열매’처럼 수확물을 떠올리게 하는 표현은 피했습니다.
- source_word: עֲרִסֹתֵיכֶם
  english_pob_choice: your dough
  chosen_korean: 반죽
  alternatives_korean:
  - 반죽그릇
  - 반죽통
  - 빚은 반죽
  lexicon: HALOT
  rationale: 문맥상 그릇보다 그 안의 재료 자체를 가리키므로 ‘반죽’이 가장 자연스럽습니다.
- source_word: חַלָּה
  english_pob_choice: a loaf
  chosen_korean: 떡 하나
  alternatives_korean:
  - 빵 한 덩이
  - 한 덩이의 떡
  - 빵 한 개
  lexicon: HALOT
  rationale: 현대 한국어에서 제물로 따로 떼는 음식 조각을 가장 무리 없이 드러내기 위해 ‘떡 하나’를 택했습니다. ‘빵’은 서구식 식품 이미지를 강하게 띱니다.
- source_word: תָּרִימוּ
  english_pob_choice: you shall lift up
  chosen_korean: 들어 올려
  alternatives_korean:
  - 바쳐
  - 드려
  - 들어 바쳐
  lexicon: HALOT
  rationale: 히필형의 문자적 동작인 ‘들어 올리다’를 살려, 이어지는 ‘예물’과의 연결을 드러냈습니다.
- source_word: תְרוּמָה
  english_pob_choice: a contribution
  chosen_korean: 예물
  alternatives_korean:
  - 봉헌물
  - 기부물
  - 바침
  lexicon: HALOT
  rationale: 공동체적 기부가 아니라 하나님께 구별해 드리는 제의적 헌물을 가리키므로 ‘예물’이 가장 적절합니다. 전통적 ‘거제물’은 설명력이 낮아 피했습니다.
- source_word: כִּתְרוּמַת גֹּרֶן
  english_pob_choice: like the contribution of the threshing floor
  chosen_korean: 타작마당의 예물
  alternatives_korean:
  - 타작마당에서 드리는 예물
  - 타작마당의 봉헌물
  - 타작마당의 거제물
  lexicon: HALOT
  rationale: 비교 대상은 타작마당에서 떼어 드리는 관습적 제물입니다. 원문의 소유격 관계를 간결하게 살려 ‘타작마당의 예물’로 옮겼습니다.
