source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
  footnotes:
  - marker: a
    text: Or 'For he has despised the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''That person shall surely be cut off'' preserves the Hebrew idiom; the exact form of the judgment is not specified here.'
    reason: cultural_note
  - marker: c
    text: Or 'his iniquity is upon him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼의 말씀을 업신여기고 그의 명령을 어겼기 때문입니다.[a] 그 사람은 반드시 끊어질 것이며,[b] 그 죄악은 그 사람에게 남아 있습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이는 그가 야훼의 말씀을 업신여기고 그의 명령을 어겼기 때문입니다.”
    reason: lexical_alternative
  - marker: b
    text: “반드시 끊어질 것이며”는 히브리어 관용구를 살린 표현으로, 여기서 어떤 형태의 심판인지 구체적으로 말하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그의 죄악이 그에게 있습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  - 여호와의 말씀
  lexicon: HALOT
  rationale: דבר는 여기서 단순한 '말'보다 계시적·언약적 '말씀'이 적절하며, יְהוָה는 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
- source_word: בָּזָה
  english_pob_choice: has despised
  chosen_korean: 업신여기고
  alternatives_korean:
  - 멸시하고
  - 경멸하고
  - 무시하고
  lexicon: HALOT
  rationale: 단순한 무관심보다 적극적 경멸을 나타내므로, 현대 한국어에서 그 강도를 잘 드러내는 '업신여기다'를 택했습니다.
- source_word: מִצְוָתוֹ
  english_pob_choice: his commandment
  chosen_korean: 그의 명령
  alternatives_korean:
  - 그의 계명
  - 그의 명령들
  - 그의 법령
  lexicon: HALOT
  rationale: 히브리어 단수형의 형식을 살리면서도 법정 문맥에 자연스러운 표현으로 '명령'을 사용했습니다.
- source_word: הִכָּרֵת תִּכָּרֵת
  english_pob_choice: shall surely be cut off
  chosen_korean: 반드시 끊어질 것이며
  alternatives_korean:
  - 틀림없이 끊어질 것이며
  - 정녕 끊어질 것이며
  - 끊어져 없어질 것입니다
  lexicon: HALOT
  rationale: 강조용 부정사 절대형을 한국어의 '반드시'로 반영하되, כרת의 법정적 관용구는 구체적 처벌 형태를 특정하지 않고 보존했습니다.
- source_word: עֲוֺנָהּ בָּהּ
  english_pob_choice: his guilt is on him
  chosen_korean: 그의 죄책은 그에게 있습니다
  alternatives_korean:
  - 그의 죄는 그 위에 있습니다
  - 그의 죄책이 그에게 있습니다
  - 그의 죄악이 그에게 있습니다
  lexicon: HALOT
  rationale: ה에 해당하는 소유 관계와 책임 귀속을 살리면서도, 현대 한국어에서 משפט적 부담을 분명히 하는 '죄책이 그에게 있습니다'로 옮겼습니다.
theological_decisions:
- issue: '''cut off''의 법적·언약적 의미를 어디까지 구체화할지'
  chosen_reading: 처벌의 형태를 특정하지 않고 '반드시 끊어질 것이며'로 관용구를 보존했습니다.
  alternative_readings:
  - 죽임을 당할 것이다
  - 공동체에서 끊어질 것이다
  - 제명될 것이다
  rationale: 본문은 결과의 엄중함을 말하지만 방식은 명시하지 않으므로, 해석을 한정하지 않고 본문의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
