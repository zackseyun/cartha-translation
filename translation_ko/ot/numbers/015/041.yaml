  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to be God to you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼, 곧 여러분의 하나님입니다. 여러분의 하나님이 되기 위하여 내가 여러분을 이집트 땅에서 이끌어 내었습니다. 나는 야훼, 곧 여러분의 하나님입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 직역: ‘여러분에게 하나님이 되기 위하여.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB가 고유한 언약적 신명으로 처리한 יְהוָה를 한국어에서도 제목이 아닌 음역 ‘야훼’로 옮겨, 하나님의 이름이라는 점을 보존했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 여러분의 하나님
  alternatives_korean:
  - 너희의 하나님
  - 여러분의 신
  lexicon: HALOT
  rationale: 복수 소유격이 붙은 언약 공식이므로 ‘하나님’으로 옮기되, 현대 합쇼체 문맥에 맞게 ‘여러분의’로 정리했습니다.
- source_word: הוֹצֵאתִי
  english_pob_choice: brought you out
  chosen_korean: 이끌어 내어
  alternatives_korean:
  - 끌어내어
  - 데리고 나오셔서
  lexicon: HALOT
  rationale: 출애굽 공식의 ‘끌어내다/이끌어 내다’ 의미를 살리면서, 원인의 방향성을 자연스러운 서술로 표현했습니다.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  english_pob_choice: to be your God
  chosen_korean: 여러분의 하나님이 되게 하였습니다
  alternatives_korean:
  - 여러분의 하나님이 되기 위하여
  - 여러분에게 하나님이 되려고
  lexicon: HALOT
  rationale: 히브리어의 언약 목적구를 직역하기보다 관계적 의미가 분명하도록 ‘~이 되게 하였습니다’로 풀어, POB의 ‘to be your God’ 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여호와/주 대신 하나님의 이름을 어떻게 처리할지
  chosen_reading: 이 절의 יְהוָה는 반복되는 언약 이름으로서 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 단순 호칭이 아니라 출애굽 언약의 당사자 이름을 강조하므로, 전통적 치환어보다 고유 이름을 보존하는 편이 स्रोत 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים의 관계적·언약적 의미
  chosen_reading: ‘여러분의 하나님이 되게 하였습니다’로 번역해 언약 관계를 분명히 했습니다.
  alternative_readings:
  - 여러분에게 하나님이 되도록
  - 여러분의 하나님이 되기 위하여
  rationale: 이 표현은 단순한 존재 진술이 아니라 출애굽의 목적을 밝히는 언약 공식이므로, 목적과 관계를 함께 드러내는 표현이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve theological weight without archaic phrasing'
