    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 표현을 직접 살리면서도 한국어에서 자연스럽고 성경적인 집단 명칭으로 읽히도록 했습니다. 영어 POB의 gender-accurate 기조를 따르되, ‘자손’이 본문의 집단성에 잘 맞습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에
  alternatives_korean:
  - 들판에
  - 사막에
  lexicon: HALOT
  rationale: מִדְבָּר는 출애굽·광야 여정 맥락에서 ‘광야’가 가장 정확합니다. ‘사막’은 지리적 이미지를 과도하게 좁힙니다.
- source_word: מְקֹשֵׁשׁ עֵצִים
  english_pob_choice: gathering wood
  chosen_korean: 나무를 모으고 있는
  alternatives_korean:
  - 나뭇가지를 줍고 있는
  - 장작을 모으고 있는
  lexicon: HALOT
  rationale: קשש + עצים는 연료가 될 목재를 줍거나 모으는 행동을 가리키므로, 의미를 넓게 살린 ‘나무를 모으고 있는’이 적절합니다. 영어 주석의 ‘sticks’ 가능성도 너무 좁혀서 배제하지 않도록 했습니다.
- source_word: בְּיוֹם הַשַּׁבָּת
  english_pob_choice: on the Sabbath day
  chosen_korean: 안식일에
  alternatives_korean:
  - 안식일 날에
  - 안식일에 그날
  lexicon: HALOT
  rationale: 히브리어는 ‘날’(יוֹם)을 포함하지만, 한국어에서는 ‘안식일에’가 가장 자연스럽고 의미도 충분히 보존합니다. 본문이 행위의 시간 배경을 말할 뿐이므로 장황한 반복은 피했습니다.
theological_decisions:
- issue: 안식일 위반 서술의 절제된 표현
  chosen_reading: 사실 진술로만 옮기고, 판단이나 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘안식일을 범하고 있는’처럼 규정적 표현을 추가하는 방식
  - 법적·신학적 설명을 본문에 삽입하는 방식
  rationale: 본문은 광야에서 안식일에 나무를 모으는 사람을 ‘발견했다’고만 말합니다. 이후 문맥의 판결을 미리 끌어오지 않고, 서술 자체의 사실성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 3
