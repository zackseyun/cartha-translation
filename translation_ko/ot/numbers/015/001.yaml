lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술 전개를 나타내는 동사로, POB의 'spoke'처럼 공식적 신적 발화를 자연스럽게 살리기 위해 '말씀하여 이르셨습니다'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명문자를 직접 반영하기 위해 관습적 대체어인 '여호와'나 칭호 '주님'이 아니라 고유명사 '야훼'를 사용했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게
  - 에
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 방향 전치사로서 한국어에서는 조사 '-에게'가 가장 자연스럽고 정확합니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: HALOT
  rationale: 성서 인명 משה는 한국어 성서에서 확립된 형태 '모세'를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고
  lexicon: HALOT
  rationale: 히브리어의 표준 발화 도입구를 한국어에서는 뒤따르는 직접 화법을 예고하는 관용적 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 언약적 신명문자 יהוה를 사용하므로, 주칭호로 완화하지 않고 신적 고유명을 보존하는 것이 원문의 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
