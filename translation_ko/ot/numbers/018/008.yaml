- from: 그러자 야훼께서 아론에게 말씀하셨습니다. "내가 보라, 내 예물의 책임을 너에게 주었으니, 곧 이스라엘 자손의 모든 거룩한 제물입니다. 내가 그것들을 너에게 너의 기름부음 몫으로 주었고, 너의 아들들에게는 영원한 규례로 주었습니다."[a][b][c]
  to: 그러자 야훼께서 아론에게 말씀하셨습니다. “보십시오, 내가 내게 바쳐진 예물들[a], 곧 이스라엘 자손[c]의 모든 성물을 맡아 관리할 책임을 네게 주었습니다. 내가 그것들을 네 기름부음에 따른 몫[b]으로, 또 네 아들들에게는 영구한 규례로 주었습니다.”
  rationale: 원문의 강조 표현과 제사장에게 맡겨진 관리 책임의 대상-책임 관계를 바로잡았습니다. ‘성물’은 קָדְשֵׁי의 제의적 의미를 보존하고, ‘기름부음에 따른 몫’은 논쟁의 여지를 과도하게 해소하지 않으면서도 한국어 문장으로 자연스럽게 옮긴 표현입니다. 각주 표지도 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
