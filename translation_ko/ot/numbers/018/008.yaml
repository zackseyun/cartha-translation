  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
  footnotes:
  - marker: a
    text: Or “my offerings” or, more technically, “my heave offerings.”
    reason: lexical_alternative
  - marker: b
    text: Or “for anointing”; the Hebrew likely means the portion belonging to Aaron by virtue of his anointed priestly office.
    reason: lexical_alternative
  - marker: c
    text: Hebrew “sons of Israel,” the standard covenantal designation for the people of Israel.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 야훼께서 아론에게 말씀하셨습니다. "내가 보라, 내 예물의 책임을 너에게 주었으니, 곧 이스라엘 자손의 모든 거룩한 제물입니다. 내가 그것들을 너에게 너의 기름부음 몫으로 주었고, 너의 아들들에게는 영원한 규례로 주었습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 헌물들” 혹은 더 기술적으로는 “내 거제물들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “기름부음을 위한”; 히브리어는 아론의 기름부음 받은 제사장 직분 때문에 그에게 속한 몫을 뜻할 가능성이 큽니다.
    reason: theological_note
  - marker: c
    text: 히브리어 “이스라엘 자손”은 이스라엘 백성에 대한 표준 언약적 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: POB가 고유신명 יהוה를 제목이 아니라 고유명으로 처리하므로, 한국어에서도 전통적 대체어인 ‘여호와’ 대신 ‘야훼’를 써서 원문의 신명성을 보존했습니다.
- source_word: מִשְׁמֶרֶת
  english_pob_choice: the charge
  chosen_korean: 책임
  alternatives_korean:
  - 맡은 일
  - 맡은 책임
  - 관리
  lexicon: HALOT
  rationale: 제사장에게 맡겨진 직무적 위탁이라는 뜻을 살리되, 현대 한국어에서 자연스러운 ‘책임’으로 옮겨 의무성과 수탁성을 함께 드러냈습니다.
- source_word: תְּרוּמֹתַי
  english_pob_choice: my contributions
  chosen_korean: 내 예물
  alternatives_korean:
  - 내 헌물
  - 내 거제물
  - 내 헌상물
  lexicon: HALOT
  rationale: 문맥상 야훼께 드려진 성별된 제사 물품이므로, 기술적 용어를 과도하게 풀지 않으면서도 가장 직관적인 ‘예물’로 옮겼습니다.
- source_word: לְמָשְׁחָה
  english_pob_choice: for your anointing portion
  chosen_korean: 너의 기름부음 몫
  alternatives_korean:
  - 기름부음으로
  - 기름부음에 속한 몫
  - 너의 기름부음에 따른 몫
  lexicon: HALOT
  rationale: POB의 수정 취지대로 소유격 ‘너의’를 살려, 아론의 기름부음 받은 제사장 직분에 속한 몫이라는 점을 한국어로 분명히 했습니다.
- source_word: לְחָק עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 영원한 법령
  - 세세한 규례
  lexicon: HALOT
  rationale: 토라적 법 조항의 지속성을 담는 관용적 표현으로 ‘규례’를 택했고, עוֹלָם의 지속성을 ‘영원한’으로 반영했습니다.
theological_decisions:
- issue: 야훼의 직설적 발화에서 제사장 몫을 ‘기름부음 몫’으로 표현하는 방식
  chosen_reading: 아론의 기름부음 받은 제사장 직분에 속한 몫으로 이해되도록 ‘너의 기름부음 몫’이라고 옮겼습니다.
  alternative_readings:
  - 기름부음으로
  - 기름부음에 속한 몫
  - 성별된 몫
  rationale: 히브리어는 단순한 의식 행위보다 아론의 기름부음된 직분을 근거로 한 소유권을 가리키므로, POB의 해설 방향을 따라 그 신학적 배경을 과잉설명 없이 유지했습니다.
  doctrine_reference: 민수기 18장 제사장 몫 규정
- issue: בְנֵי יִשְׂרָאֵל의 처리
  chosen_reading: ‘이스라엘 자손’으로 직역했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 언약 공동체의 공식 명칭이라는 점을 유지하기 위해, 남성 복수 표지를 희석하지 않고 원문 표현을 보존했습니다.
  doctrine_reference: 'POB 번역 원칙: gender-accurate rendering'
