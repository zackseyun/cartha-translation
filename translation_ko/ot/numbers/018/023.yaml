  source_fidelity: 첫 접속사 וְ는 역접을 요구하지 않으므로 ‘그러나’는 삭제해야 합니다. 또한 히브리어의 단수 ‘레위 사람’은 집합적으로 쓰인 뒤 복수 동사와 이어지므로, 한국어에서는 ‘레위 사람들은’으로 일관되게 옮기는 것이 자연스럽습니다. ‘죄책을 지다’는 נשא עון의 법적·제의적 책임이라는 폭을 비교적 잘 보존합니다.
  naturalness: 초안의 ‘레위 사람은 … 그들은’은 한국어 수 일치가 어색합니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 독자의 이해와 각주 연결을 명확히 합니다.
  terminology: ‘만남의 장막’, ‘직무’, ‘영구한 규례’, ‘이스라엘 자손’, ‘기업’은 본문 문체와 제의·법률 문맥에 적절합니다. ‘기업을 상속받지 못하다’는 히브리어의 동족어 반복을 완전히 재현하지는 않지만, 뜻을 자연스럽고 정확하게 전달하며 각주에서 반복을 밝혀야 합니다.
