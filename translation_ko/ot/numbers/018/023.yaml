id: NUM.18.23
reference: Numbers 18:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
  footnotes:
  - marker: a
    text: Or 'bear their guilt.' The Hebrew idiom can denote bearing guilt, iniquity, or the liability/consequences attached to it.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'they shall not inherit an inheritance,' a Hebrew repetition that emphasizes the denial of tribal land allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들은 만남의 장막의 직무를 수행해야 하며, 자신들의 죄책을 져야 합니다.[a] 이것은 너희 대대로 영구한 규례입니다. 이스라엘 자손[b] 가운데서 그들은 기업을 상속받지 못할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘그들의 죄책을 지다’ 또는 ‘그들의 죄의 책임을 지다’로 옮길 수 있습니다. 죄책, 죄악, 또는 그에 따른 책임과 결과를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들 가운데서’. 히브리어는 직역하면 ‘이스라엘 자손 가운데서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘상속하다’와 ‘기업’을 함께 써서 반복을 이룹니다. 이는 레위 지파가 토지 기업을 받지 못함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  english_pob_choice: shall serve
  chosen_korean: 직무를 수행해야 하며
  alternatives_korean:
  - 봉사해야 하며
  - 섬겨야 하며
  - 일해야 하며
  lexicon: HALOT
  rationale: 법규 문맥의 예언적/규범적 미래를 한국어로 자연스럽게 옮기되, עבד의 제의적 의미를 살려 단순한 ‘일하다’보다 ‘직무를 수행하다’로 번역했습니다.
- source_word: הַלֵּוִי הוּא
  english_pob_choice: the Levite himself
  chosen_korean: 레위 사람은
  alternatives_korean:
  - 그 레위 사람은
  - 레위 사람 그 자신은
  lexicon: HALOT
  rationale: 히브리어의 강조 대명사는 문맥상 주어 강조로 충분히 드러나므로, 한국어에서는 과도한 반복을 피하면서도 책임 주체를 분명히 했습니다.
- source_word: עֲוֺנָם
  english_pob_choice: their iniquity
  chosen_korean: 자기의 죄책
  alternatives_korean:
  - 그들의 죄악
  - 그들의 죄책을
  - 그들의 죄책과 책임
  lexicon: HALOT
  rationale: נשא עון의 관용구를 직역에 가깝게 살리면서도, 한국어에서 ‘죄책’이 죄의 책임·부담을 함께 드러내므로 문맥에 맞게 선택했습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영구한 규례
  alternatives_korean:
  - 영원한 규례
  - 항구한 법령
  - 항구한 규례
  lexicon: HALOT
  rationale: 법적 지속성을 나타내는 관용을 현대 한국어의 공적 문체로 옮겨 ‘영구한 규례’로 번역했습니다.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘의 아들들 가운데서
  - 이스라엘 사람들 가운데서
  lexicon: HALOT
  rationale: 원문이 남성 복수 표현을 쓰므로 이를 유지하되, 한국어에서는 관용적으로 ‘이스라엘 자손’으로 옮겨 가독성을 확보했습니다.
- source_word: לֹא יִנְחֲל֖וּ נַחֲלָה
  english_pob_choice: they shall not inherit an inheritance
  chosen_korean: 기업을 상속받지 못할 것입니다
  alternatives_korean:
  - 기업을 차지하지 못할 것입니다
  - 기업을 받지 못할 것입니다
  - 상속 유산을 상속받지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 반복을 완전히 재현하기보다, 레위 지파가 기업 분배에서 제외된다는 뜻을 한국어 법률어휘 ‘기업을 상속받다’로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 레위인의 직무와 죄책 부담을 어떻게 드러낼지
  chosen_reading: ‘그들은 자기의 죄책을 져야 합니다’로 옮겨, 제의적 책임과 그 결과의 부담을 함께 남겼습니다.
  alternative_readings:
  - 그들은 자기의 죄를 져야 합니다
  - 그들은 자기의 죄책을 담당해야 합니다
  - 그들은 자기의 죄의 책임을 질 것입니다
  rationale: נשא עון은 단순한 감정적 죄책감이 아니라 법적·제의적 책임과 그 결과를 포함할 수 있으므로, 의미를 좁히지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘이스라엘 자손’의 성별 표지 유지
  chosen_reading: 남성 복수 표현을 직접 평준화하지 않고 ‘이스라엘 자손’으로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들 가운데서
  - 이스라엘 백성 가운데서
  rationale: 원문의 대표적 언약 공동체 표현을 보존하기 위해, 성별이 지워진 중립어로 완전히 대체하지 않았습니다.
  doctrine_reference: Translation philosophy §4
