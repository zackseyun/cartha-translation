  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or, more formally, 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 소의 첫새끼나 양의 첫새끼나 염소의 첫새끼는 속량하지 마십시오. 그것들은 거룩합니다. 그 피를 제단에 뿌리고, 그 기름을 화제[a]로 불살라 야훼께 향기로운 냄새가 되게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘불로 드리는 제물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 다만
  alternatives_korean:
  - 그러나
  - 오직
  lexicon: HALOT
  rationale: 앞 절의 규정을 제한하는 대조·예외의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: בְּכוֹר שׁוֹר / בְכוֹר כֶּשֶׂב / בְכוֹר עֵז
  english_pob_choice: firstborn of an ox / sheep / goat
  chosen_korean: 소의 첫새끼 / 양의 첫새끼 / 염소의 첫새끼
  alternatives_korean:
  - 수소의 첫새끼 / 어린양의 첫새끼 / 염소 새끼의 첫새끼
  - 소의 맏배 / 양의 맏배 / 염소의 맏배
  lexicon: HALOT
  rationale: 제물 목록의 종별 구분을 유지하면서, 한국어에서 가장 자연스러운 ‘첫새끼’로 공시적·의례적 의미를 살렸습니다.
- source_word: לֹא תִפְדֶּה
  english_pob_choice: you shall not redeem
  chosen_korean: 속량하지 마십시오
  alternatives_korean:
  - 구속하지 마십시오
  - 되사지 마십시오
  lexicon: HALOT
  rationale: ה/פדה의 제의·법적 의미를 살려 ‘속량하다’로 옮기되, 현대 합쇼체 명령으로 정리했습니다.
- source_word: תִּזְרֹק
  english_pob_choice: you shall sprinkle
  chosen_korean: 뿌리고
  alternatives_korean:
  - 뿌리시고
  - 찍어
  lexicon: HALOT
  rationale: 제사 혈례에서의 זרק을 한국어 성경에서 널리 쓰는 ‘뿌리다’로 옮겨, 의식 동작의 반복적·제의적 성격을 유지했습니다.
- source_word: אִשֶּׁה לְרֵיחַ נִיחֹחַ לַיהוָה
  english_pob_choice: a food offering, a pleasing aroma to Yahweh
  chosen_korean: 화제로 불살라 야훼께 향기로운 냄새가 되게 하십시오
  alternatives_korean:
  - 불로 드리는 제물로 삼아 야훼께 향기로운 냄새가 되게 하십시오
  - 화제의 향기로 야훼를 기쁘시게 하십시오
  lexicon: HALOT
  rationale: אִשֶּׁה는 ‘불로 드리는 제물’이라는 제의적 뜻을 분명히 드러내는 ‘화제’로 옮기고, רֵיחַ נִיחֹחַ는 ‘향기로운 냄새’로 직역해 수용의 의미를 보존했습니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 표준 음역 관행 / 프로젝트 용례
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 통일해, 본문의 언약명 사용을 직접 보이게 했습니다.
theological_decisions:
- issue: 제물의 '거룩함'과 속량 금지
  chosen_reading: 그것들은 거룩합니다. 그래서 속량하지 마십시오.
  alternative_readings:
  - 그것들은 성별되었습니다.
  - 그래서 값을 치르고 사지 마십시오.
  rationale: 단순한 금지 규정이 아니라, 첫새끼가 이미 야훼께 구별된 상태이므로 속량 자체가 허용되지 않는다는 제의 신학을 분명히 했습니다.
  doctrine_reference: 민 18:17의 제사 규정 문맥
- issue: אִשֶּׁה의 번역
  chosen_reading: 화제
  alternative_readings:
  - 불로 드리는 제물
  - 불제물
  rationale: 단어의 어원적 의미와 제의 문맥을 함께 살리기 위해 ‘화제’를 사용하고, 필요 시 주석 없이도 이해되도록 ‘불살라’와 결합했습니다.
  doctrine_reference: 레위기·민수기 제사 용어 용례
