reference: Numbers 18:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
  footnotes:
  - marker: a
    text: Or 'its fat' or 'its choicest part.' The Hebrew חֶלֶב literally means 'fat,' but in offering contexts often refers idiomatically to the richest or best portion.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것에서 가장 좋은 몫을 들어 올려 바칠 때에, 그것 때문에 죄책을 지지 않을 것입니다[a]. 이스라엘 자손의 성물들을 속되게 하지 마십시오[b]. 그러면 죽지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것의 기름’ 또는 ‘그것의 가장 좋은 몫’. 히브리어 חֶלֶב은 문자적으로 ‘기름’을 뜻하지만, 봉헌 문맥에서는 관용적으로 가장 좋은 몫을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이스라엘 백성을 가리키는 표준적인 민족 표현인 ‘이스라엘 자손’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹֽא תִשְׂא֤וּ ... חֵ֔טְא
  english_pob_choice: you will bear no sin
  chosen_korean: 죄를 지지 않을 것입니다
  alternatives_korean:
  - 죄를 짊어지지 않을 것입니다
  - 죄책을 지지 않을 것입니다
  lexicon: HALOT
  rationale: נשא + חטא는 죄책을 지거나 책임을 지는 뜻으로 쓰이므로, 한국어에서는 자연스럽고 의미가 분명한 ‘죄를 지다’로 옮겼습니다.
- source_word: בַּ/הֲרִֽימְ/כֶ֥ם
  english_pob_choice: when you lift up
  chosen_korean: 들어 올릴 때입니다
  alternatives_korean:
  - 들어 올릴 때
  - 바쳐 올릴 때
  - 거제물로 들어 올릴 때
  lexicon: HALOT
  rationale: רום의 히필형은 ‘들어 올리다/올려 드리다’의 제사적 동작을 담으므로, 직역을 유지하되 한국어 문장에서는 매끄럽게 ‘들어 올릴 때입니다’로 처리했습니다.
- source_word: חֶלְבּ֖וֹ
  english_pob_choice: its best part
  chosen_korean: 가장 좋은 부분
  alternatives_korean:
  - 기름진 부분
  - 가장 기름진 부분
  - 제일 좋은 몫
  lexicon: HALOT
  rationale: חלב는 문자적으로는 ‘기름’이지만 제물 문맥에서는 가장 좋은/기름진 몫을 가리킬 수 있으므로, 오해를 줄이면서도 제의적 의미를 살리는 ‘가장 좋은 부분’을 택했습니다.
- source_word: קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל
  english_pob_choice: the holy things of the sons of Israel
  chosen_korean: 이스라엘 자손의 거룩한 것들
  alternatives_korean:
  - 이스라엘 자손의 성물
  - 이스라엘 백성의 거룩한 예물들
  - 이스라엘 자손의 거룩한 예물들
  lexicon: HALOT
  rationale: קדשים은 거룩하게 구별된 것들 전체를 가리키므로 ‘거룩한 것들’로 넓게 유지했고, בני ישראל은 본문의 형식을 따라 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וְלֹ֥א תְחַלְּל֖וּ
  english_pob_choice: you shall not profane
  chosen_korean: 더럽히지 마십시오
  alternatives_korean:
  - 속되게 하지 마십시오
  - 모독하지 마십시오
  - 성스럽지 않게 하지 마십시오
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 속되게 만드는 행위이므로, 예배 문맥에서 자연스러우면서도 의미가 분명한 ‘더럽히다’를 사용했습니다.
theological_decisions:
- issue: 마지막 경고문의 한국어 종결 방식
  chosen_reading: 그러면 죽지 않을 것입니다
  alternative_readings:
  - 죽지 않을 것입니다
  - 그리하여 죽지 않을 것입니다
  - 죽지 않게 될 것입니다
  rationale: 히브리어의 단순 병렬 경고를 과도하게 목적화하지 않고, 금지 위반의 결과를 직접 경고하는 형식으로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
