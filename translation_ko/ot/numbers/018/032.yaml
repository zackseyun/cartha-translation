revisions:
- from: 그리고 그로 인해 죄를 지지 않을 것입니다. 곧 그 중에서 가장 좋은 부분을 들어 올릴 때입니다[a]. 이스라엘 자손의 거룩한 것들을 더럽히지 마십시오[b]. 그러면 죽지 않을 것입니다.
  to: 그것에서 가장 좋은 몫을 들어 올려 바칠 때에, 그것 때문에 죄책을 지지 않을 것입니다[a]. 이스라엘 자손의 성물들을 속되게 하지 마십시오[b]. 그러면 죽지 않을 것입니다.
  rationale: 시간절을 ‘... 바칠 때에’로 복원하여 히브리어 문장 구조를 보존했습니다. רום의 봉헌 행위를 반영하여 ‘들어 올려 바치다’로 옮겼고, חֵלֶב의 문맥상 의미는 ‘가장 좋은 몫’으로 유지했습니다. קדשים은 자연스러운 제의 용어인 ‘성물들’로, חלל은 거룩한 것을 보통 것으로 만드는 의미를 담은 ‘속되게 하다’로 다듬었습니다. 마지막 절의 결과적 경고는 원문의 병렬을 과도하게 목적절로 바꾸지 않도록 ‘그러면’으로 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:51Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 חֵלֶב을 ‘가장 좋은 부분’으로, קָדְשֵׁי를 넓은 의미의 거룩한 물건으로 옮긴 점은 대체로 적절합니다. 그러나 ‘곧 그 중에서 가장 좋은 부분을 들어 올릴 때입니다’는 히브리어의 시간절을 독립된 서술문으로 잘못 처리하여 문장 구조와 의미가 훼손됩니다. רום의 제의적 용법은 ‘들어 올려 바치다’로 자연스럽게 나타낼 수 있습니다.
  naturalness: ‘들어 올릴 때입니다’는 앞 문장과 문법적으로 연결되지 않으며 현대 표준 한국어로도 부자연스럽습니다. ‘성물’, ‘속되게 하다’, ‘죄책을 지다’를 사용하면 제의 문맥을 유지하면서도 합쇼체 문장으로 자연스럽습니다.
  terminology: ‘성물’은 קדשים의 제의적·복수적 범주를 자연스럽게 포괄하며, ‘이스라엘 자손’은 בני ישראל의 관용적 민족 명칭을 보존합니다. חֵלֶב은 이 문맥에서 ‘가장 좋은 몫’으로 번역하고, 각주에서 문자적 대안을 밝혀 두는 것이 적절합니다.
