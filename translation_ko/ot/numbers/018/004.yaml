source:
  edition: WLC
  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
  footnotes:
  - marker: a
    text: Or 'no unauthorized person.' Hebrew זָר here refers to someone outside the permitted sanctuary role, not necessarily a foreigner by ethnicity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신에게 합류하여, 회막에서 하는 모든 봉사를 위하여 회막의 맡겨진 직무를 지킬 것입니다. 그러나 허가받지 않은 사람은 아무도 당신들에게 가까이 오지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외부인’. 여기서 히브리어 זָר는 반드시 민족적 외국인을 뜻하지 않고, 성소에 가까이 가거나 그 직무를 수행할 권한이 없는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְוּוּ
  english_pob_choice: They shall join you
  chosen_korean: 당신에게 합류하여
  alternatives_korean:
  - 당신에게 붙어
  - 당신과 함께하게 되어
  - 당신에게 연합하여
  lexicon: HALOT
  rationale: נלוה의 결속·동참 의미를 살려, 단순 동행보다 직무에 참여하는 결합을 드러내는 표현으로 옮겼습니다.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  english_pob_choice: keep the charge
  chosen_korean: 회막의 책임을 지키되
  alternatives_korean:
  - 회막의 직무를 지키되
  - 회막의 맡겨진 책임을 지키되
  - 회막의 경계를 지키되
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 성소 맥락에서 맡겨진 책임/직무를 뜻하므로, ‘책임을 지키다’로 직분성 있는 뉘앙스를 보존했습니다.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  english_pob_choice: for all the service of the tent
  chosen_korean: 회막의 모든 직무를 위해
  alternatives_korean:
  - 회막의 모든 봉사를 위해
  - 회막의 모든 일을 위해
  - 회막의 모든 섬김을 위해
  lexicon: HALOT
  rationale: עֲבֹדָה는 성막 봉사에서 일반적 노동보다 지정된 예배·봉사 업무를 가리키므로 ‘직무’가 가장 간결하고 정확합니다.
- source_word: וְזָר
  english_pob_choice: no outsider
  chosen_korean: 어떤 외인도
  alternatives_korean:
  - 어떤 이방인도
  - 어떤 낯선 사람도
  - 어떤 무자격자도
  lexicon: HALOT
  rationale: זָר는 여기서 혈통상 ‘이방인’이 아니라 접근 권한이 없는 자를 뜻하므로, 문화적 오해를 줄이면서도 배제의 뜻을 살린 ‘외인’을 택했습니다.
theological_decisions:
- issue: 성소 접근 금지의 대상 의미
  chosen_reading: ‘외인’은 민족적 외국인이 아니라 성소 직무에 대한 허가가 없는 자를 가리킵니다.
  alternative_readings:
  - 이방인
  - 낯선 사람
  - 무자격자
  rationale: 문맥이 출입 자격과 성소 질서에 관한 것이므로, 혈통이나 민족이 아니라 허가되지 않은 접근을 강조하는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; cultic context over ethnocentric reading'
