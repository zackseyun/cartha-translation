  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 מִשְׁמֶרֶת는 단순한 ‘책임’보다 성소에서 맡겨진 직무·임무를 뜻하며, זָר는 민족적 외국인이 아니라 성소에 접근할 권한이 없는 사람을 가리킵니다.
  naturalness: ‘회막의 모든 직무를 위해 회막의 책임을 지키되’는 ‘직무’와 ‘책임’의 중복 및 ‘책임을 지키다’의 다소 부자연스러운 결합 때문에 매끄럽지 않습니다. ‘외인’도 현대 표준어 성경 문맥에서는 뜻이 불분명하거나 외국인을 연상시킬 수 있습니다.
  terminology: ‘회막’과 ‘봉사’는 적절합니다. מִשְׁמֶרֶת는 ‘맡겨진 직무’, זָר는 본문에서 ‘허가받지 않은 사람’으로 명시하는 것이 현대 한국어에서 가장 정확합니다.
