revisions:
- from: 그들의 땅에서 가져다가 야훼께 드리는 모든 것의 첫 열매는 당신의 것이 될 것입니다. 당신의 집에 있는 정결한 사람은 누구나 그것을 먹을 수 있습니다.[a]
  to: 그들이 야훼께 가져오는 그들의 땅에서 나는 모든 것의 첫 열매는 당신의 것이 될 것입니다. 당신의 집안에 있는 정결한[a] 사람은 누구나 그것을 먹을 수 있습니다.
  rationale: 수정문은 ‘첫 열매’가 그들의 땅에서 나는 모든 것에 관련된다는 히브리어의 수식 관계를 더 분명히 하고, ‘집’의 문맥상 의미를 ‘집안’으로 밝혔습니다. ‘가져오는’은 יָבִיאוּ의 기본 뜻을 유지하며, ‘먹을 수 있습니다’는 정결한 집안 구성원에게 주어진 섭취 허용을 자연스럽게 나타냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:50Z'
