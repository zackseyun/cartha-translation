  source_fidelity: 첫 문장의 ‘그들의 땅에서 가져다가’는 히브리어의 ‘그들의 땅에 있는 모든 것의 첫 열매’라는 수식 관계를 다소 흐리게 합니다. ‘그들의 땅에서 나는 모든 것의 첫 열매’로 하면 בִּכּוּרֵי כָּל אֲשֶׁר בְּאַרְצָם의 뜻과 자연스러운 한국어를 함께 살릴 수 있습니다. 또한 בְּבֵיתְךָ는 물리적인 집보다 아론의 household를 가리키므로 ‘집안’이 더 정확합니다.
  naturalness: 현 초안은 전반적으로 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘당신의 집에 있는’은 한국어에서 장소에 있는 사람으로도 읽히므로 ‘당신의 집안에 있는’이 문맥상 더 명료합니다. 각주 표지는 ‘정결한’에 직접 붙이는 편이 가리키는 말이 분명합니다.
  terminology: ‘첫 열매’, ‘야훼’, ‘정결한’은 제의 문맥과 원문의 어휘를 적절히 반영합니다. ‘정결한’의 의례적 의미를 밝히는 각주도 적절합니다.
