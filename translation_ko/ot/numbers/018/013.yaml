id: NUM.18.13
reference: Numbers 18:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
  footnotes:
  - marker: a
    text: Or 'everyone in your house who is ceremonially clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼께 가져오는 그들의 땅에서 나는 모든 것의 첫 열매는 당신의 것이 될 것입니다. 당신의 집안에 있는 정결한[a] 사람은 누구나 그것을 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정결한’은 여기서 도덕적 무결점이 아니라 의례적으로 정결한 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  english_pob_choice: the firstfruits
  chosen_korean: 첫 열매
  alternatives_korean:
  - 처음 익은 소산
  - 첫 수확물
  lexicon: HALOT
  rationale: 수확물의 맨 처음 산물을 가리키는 제의적 용어이므로, 한국어에서는 간결하고 성경적인 ‘첫 열매’가 가장 직접적으로 대응합니다.
- source_word: לְךָ יִהְיֶה
  english_pob_choice: shall be yours
  chosen_korean: 당신의 것이 될 것입니다
  alternatives_korean:
  - 당신에게 속할 것입니다
  - 당신의 몫이 될 것입니다
  lexicon: HALOT
  rationale: 아론과 제사장 집안에게 배정되는 소유권을 나타내므로, 단순한 미래형보다 소유 귀속을 드러내는 표현이 적절합니다.
- source_word: כָּל טָהוֹר
  english_pob_choice: everyone ... who is clean
  chosen_korean: 정결한 사람은 누구나
  alternatives_korean:
  - 의식적으로 정결한 사람은 누구나
  - 깨끗한 사람은 누구나
  lexicon: HALOT
  rationale: 제사장 규례의 문맥상 טָהוֹר는 도덕적 순수보다 의례적 정결을 뜻하므로, 본문에는 간결하게 ‘정결한’으로 두고 의미를 살렸습니다.
- source_word: בְּבֵיתְךָ
  english_pob_choice: in your house
  chosen_korean: 당신의 집에 있는
  alternatives_korean:
  - 당신의 집안에 있는
  - 당신의 가정에 있는
  lexicon: HALOT
  rationale: 히브리어는 아론의 집안/가족을 가리키므로, 직역에 가까운 ‘당신의 집에 있는’으로 옮겨 소속감을 유지했습니다.
theological_decisions:
- issue: 야훼께 드린 첫 열매의 귀속과 섭취 허용 범위
  chosen_reading: 이 구절은 야훼께 바쳐진 첫 열매가 제사장 몫이 되며, 그 집안에서도 정결한 사람만 먹을 수 있다고 말합니다.
  alternative_readings:
  - 단순히 일반적인 가족 식사 규정으로 읽는 해석
  - ‘정결한’을 윤리적 흠 없음으로 넓게 이해하는 해석
  rationale: 문맥은 민수기 18장의 제사장 몫과 정결 규례이므로, 제의적 귀속과 의례적 정결의 경계를 분명히 드러내는 것이 본문 의도에 부합합니다.
  doctrine_reference: 제사장직/정결 규례
- issue: ‘야훼’ 표기
  chosen_reading: יהוה는 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 원어 신명 표기를 직접 드러내는 프로젝트 기준을 따르며, 본절의 제의 문맥에서도 그 구분이 중요합니다.
  doctrine_reference: YHWH 표기 원칙
