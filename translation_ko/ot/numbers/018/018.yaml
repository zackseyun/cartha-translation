id: NUM.18.18
reference: Numbers 18:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
  footnotes:
  - marker: a
    text: Or 'their meat.' The Hebrew literally says 'their flesh,' referring to the edible sacrificial portion.
    reason: lexical_alternative
  - marker: b
    text: '''Wave offering'' refers to the portion presented before the LORD in a ritual motion; some render it ''presentation offering.'''
    reason: cultural_note
translation:
  language: ko
  text: 그들의 고기는 여러분의 것이 됩니다. 흔든 제물의 가슴과 오른쪽 넓적다리처럼 여러분의 것이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 식용 고기’. 히브리어는 문자적으로 ‘그들의 살’이라고 말하며, 제사에서 먹을 수 있는 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흔든 제물’은 여호와 앞에서 제물을 흔들어 드리는 제의 행위를 가리킵니다. 일부 번역은 ‘봉헌 제물’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  english_pob_choice: But their flesh
  chosen_korean: 그들의 고기
  alternatives_korean:
  - 그들의 살
  - 그들의 육체
  lexicon: HALOT
  rationale: 제사 규정의 문맥에서 בָּשָׂר는 먹을 수 있는 제사 몫을 가리키므로, 직역의 ‘살’보다 한국어에서 자연스럽고 의미가 분명한 ‘고기’를 택했습니다. 영어 POB의 ‘their flesh’에 대응하되, 실제 식용 몫이라는 주석적 의미를 드러냅니다.
- source_word: יִהְיֶה לָּךְ / לְךָ
  english_pob_choice: shall be yours
  chosen_korean: 여러분의 것이 됩니다
  alternatives_korean:
  - 여러분에게 속합니다
  - 여러분의 몫이 됩니다
  lexicon: HALOT
  rationale: היה + ל의 소유/배정 관용구를 한국어의 소유 표현으로 옮겼습니다. 반복되는 소유 구문을 살려 제사장 몫의 법적 배정을 분명히 했습니다.
- source_word: כַחֲזֵה הַתְּנוּפָה
  english_pob_choice: the breast of the wave offering
  chosen_korean: 흔든 제물의 가슴
  alternatives_korean:
  - 요제를 드린 제물의 가슴
  - 흔든 제물의 흉부
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 ‘흔듦/요제’를 가리키므로, 전통적 교회어보다 동작이 드러나는 ‘흔든 제물’로 옮겼습니다. חָזֶה는 제물의 특정 부위를 말하므로 ‘가슴’으로 자연스럽게 표현했습니다.
- source_word: וּכְשׁוֹק הַיָּמִין
  english_pob_choice: and as the right thigh
  chosen_korean: 오른쪽 넓적다리
  alternatives_korean:
  - 오른쪽 허벅지
  - 오른쪽 다리
  lexicon: HALOT
  rationale: שׁוֹק은 제사 분배 문맥에서 허벅지/넓적다리 부위를 뜻하므로, 한국어로는 부위감을 가장 잘 살리는 ‘넓적다리’를 선택했습니다. ‘오른쪽’은 הַיָּמִין의 직역입니다.
theological_decisions:
- issue: 제사 몫의 비교 구조
  chosen_reading: 두 차례의 ‘여러분의 것이 됩니다’를 그대로 살려, 제사장에게 배정된 몫이 다른 성소 제물의 몫과 같은 법적 성격임을 드러냈습니다.
  alternative_readings:
  - 첫 번째만 반복하고 뒤는 생략하는 방식
  - 더 일반적인 ‘여러분의 몫이 됩니다’로 통일하는 방식
  rationale: 히브리어는 소유 선언을 반복하여 배정의 확정성을 강조합니다. 이를 완화하지 않고 유지하는 편이 원문의 규범적 어조를 더 잘 전달합니다.
  doctrine_reference: 제사장 몫의 규례(민수기 18장 제의 규정)
