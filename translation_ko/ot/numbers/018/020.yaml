  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
  footnotes:
  - marker: a
    text: Or 'among the people of Israel' / 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아론에게 말씀하셨습니다. "그들의 땅에서는 네가 상속받지 못하고, 그들 가운데서는 네 몫이 없을 것이다. 나는 네 몫이요 네 기업이니, 이스라엘 자손 가운데서 그러합니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역입니다. 문맥상 ‘이스라엘 백성’ 또는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB가 고유한 신적 이름을 ‘Yahweh’로 옮긴 점을 따라, 한국어에서도 관용적 대치어 ‘주님’이 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: תִנְחָל
  english_pob_choice: you shall not inherit
  chosen_korean: 상속받지 못하고
  alternatives_korean:
  - 기업을 받지 못하고
  - 상속을 받지 못하고
  lexicon: HALOT
  rationale: 문맥이 토지 기업의 수여를 말하므로 ‘상속받다’로 옮겨 금지의 뜻을 자연스럽게 드러냈습니다.
- source_word: חֵלֶק
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 몫과 분배
  lexicon: HALOT
  rationale: 앞의 ‘inherit’와 뒤의 ‘portion’/‘inheritance’ 연결을 살리되, 한국어에서는 짧고 일상적인 ‘몫’이 분깃 이미지를 가장 직접적으로 전달합니다.
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속
  - 유산
  lexicon: HALOT
  rationale: 성경 한국어에서 נַחֲלָה의 핵심 의미인 언약적 기업을 가장 잘 담는 표준어가 ‘기업’이어서, 앞의 토지 상속과 연결되는 신학적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 본문 말미의 베니 이스라엘 표현
  chosen_reading: ‘이스라엘 자손 가운데서’로 직역해 남성 복수 형태를 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들 가운데서
  - 이스라엘 백성 가운데서
  rationale: 히브리어 בְּנֵי יִשְׂרָאֵל의 형식을 평탄화하지 않고, POB의 성별-정확성 원칙에 따라 족장적/언약적 표현을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4: Gender-accurate over gender-neutral'
