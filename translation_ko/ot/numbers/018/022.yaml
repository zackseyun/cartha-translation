id: NUM.18.22
reference: Numbers 18:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
  footnotes:
  - marker: a
    text: Or 'incur guilt.' The Hebrew literally says 'bear sin,' a priestly/legal expression for bearing liability for wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 더 이상 회막[a]에 가까이 와서 죄를 지고 죽지 않도록 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄책을 지다’. 히브리어는 문자적으로 ‘죄를 지다’라고 하며, 제의·법적 문맥에서는 잘못에 대한 책임을 지는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 표현을 직접 반영하면서도 한국어에서는 관용적으로 통용되는 집합명사로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 문맥상 성소 용어이므로 한국 교회독자에게도 익숙한 ‘회막’을 쓰되, 본절의 제의적 의미를 유지했습니다.
- source_word: לָשֵׂאת חֵטְא
  english_pob_choice: lest they bear sin
  chosen_korean: 죄를 지고
  alternatives_korean:
  - 죄를 짊어지고
  - 죄책을 지고
  lexicon: HALOT
  rationale: 직역하면 ‘죄를 짊어지다/지고 있다’이지만, 한국어에서는 그 결과와 책임을 자연스럽게 드러내는 표현으로 옮겼습니다. 다만 법적 책임의 뉘앙스는 남겨 두었습니다.
- source_word: יִקְרְבוּ ... אֶל
  english_pob_choice: shall ... come near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가와서
  - 접근하여
  lexicon: HALOT
  rationale: 성소에 대한 금지된 접근을 자연스럽고 분명하게 드러내는 현대 한국어 표현을 택했습니다.
theological_decisions:
- issue: לָשֵׂאת חֵטְא의 의미를 단순 도덕적 ‘죄’로 완전히 평탄화할지 여부
  chosen_reading: ‘죄를 지고’로 옮겨, 제의적·법적 책임을 암시하면서도 본문의 경고를 직접 살렸습니다.
  alternative_readings:
  - 죄책을 지고
  - 죄의 책임을 지고
  rationale: 본문은 단순한 감정적 죄의식보다 성소에 부적절하게 접근할 때 발생하는 책임과 죽음의 경고를 말하므로, 이를 너무 추상적으로 바꾸지 않았습니다.
  doctrine_reference: 민수기 18장 제사장/레위인 성소 규례의 문맥
