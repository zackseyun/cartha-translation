  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'shall eat it' or 'are to eat it'; the Hebrew form in this legal context can express instruction or permitted action rather than simple past time.
    reason: lexical_alternative
  - marker: b
    text: '''Household'' refers to the domestic unit, not merely the physical house.'
    reason: cultural_note
  - marker: c
    text: Or 'reward,' 'payment,' or 'compensation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분과 여러분의 집안[c]은 어느 곳에서나 그것을 먹을 수 있습니다.[a] 이는 그것이 회막에서 여러분이 섬긴 일에 대한 여러분의 품삯[b]이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹어야 합니다’ 또는 ‘먹으십시오’. 히브리어 동사형은 이 법률 문맥에서 단순 과거가 아니라 지시 또는 허용을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘품삯’은 ‘보상’, ‘지급’, 또는 ‘대가’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘집안’은 물리적인 집만이 아니라 함께 사는 가구 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַ/אֲכַלְתֶּ֤ם
  english_pob_choice: may eat / shall eat
  chosen_korean: 먹으라
  alternatives_korean: 먹을 수 있다
  lexicon: verb, Qal perfect, 2nd person plural
  rationale: Hebrew form functions as a legal instruction or permission in this context; '먹으라' conveys the authoritative allowance appropriate for the covenant law.
- source_word: בֵּֽיתְ/כֶ֑ם
  english_pob_choice: household
  chosen_korean: 너희 집
  alternatives_korean: 집안
  lexicon: noun, construct state
  rationale: Refers to the domestic unit sharing the privilege, not merely the physical building; '집' captures the familial scope in modern Korean.
- source_word: שָׂכָ֥ר
  english_pob_choice: wages
  chosen_korean: 대가
  alternatives_korean: 임금, 보상
  lexicon: noun
  rationale: Contextualizes the food as compensation for priestly service; '대가' implies a rightful return for labor, fitting the theological weight.
- source_word: עֲבֹֽדַתְ/כֶ֖ם
  english_pob_choice: service
  chosen_korean: 섬김
  alternatives_korean: 일, 봉사
  lexicon: noun, construct state
  rationale: Specifically denotes the priestly duties performed in the sanctuary; '섬김' carries the necessary religious connotation of service to God.
theological_decisions:
- decision: Preservation of Covenantal Privilege
  rationale: The translation emphasizes that the consumption of the holy portion is a divinely granted right ('대가') contingent upon the specific service ('섬김') rendered in the '회막' (Tent of Meeting), maintaining the link between duty and blessing.
