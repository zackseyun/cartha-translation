theological_decisions:
- decision: Preservation of Covenantal Privilege
  rationale: The translation emphasizes that the consumption of the holy portion is a divinely granted right ('대가') contingent upon the specific service ('섬김') rendered in the '회막' (Tent of Meeting), maintaining the link between duty and blessing.
