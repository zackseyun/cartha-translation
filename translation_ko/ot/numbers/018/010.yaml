  source_fidelity: 첫 절의 בְּקֹדֶשׁ הַקֳּדָשִׁים는 제사 규례 문맥에서 섭식 장소를 가리키므로 ‘지극히 거룩한 곳에서’로 옮기는 것이 적절합니다. תֹּאכֲלֶנּוּ는 아론에게 향한 법규적 지시로 ‘먹으십시오’가 무리 없이 반영합니다. כָּל־זָכָר의 성별 제한과 יֹאכַל의 허용 의미도 유지되었습니다. 마지막 קֹדֶשׁ יִהְיֶה לָּךְ는 의무를 새로 부과하기보다 제물의 신성한 지위를 선언하므로 상태 서술로 고쳐야 합니다.
  naturalness: ‘가장 거룩한 곳’도 이해되지만, 제의적 최상급 표현에는 ‘지극히 거룩한 곳’이 더 자연스럽고 정확합니다. 성경의 하나님-아론 발화에서 ‘당신에게 거룩해야 합니다’는 현대 한국어로 다소 부자연스럽고, 원문의 선언적 의미도 흐립니다. ‘당신에게 거룩한 것입니다’가 자연스럽습니다.
  terminology: קֹדֶשׁ 계열은 ‘거룩’으로 일관되게 유지했습니다. ‘지성소’는 성소의 내실로 오해시킬 수 있어 본문에서는 피하고, 각주는 문자적 표현과 문맥상 장소 의미를 밝혀 두었습니다. 각주 표지는 해당 히브리어 표현이 번역된 첫 절에 배치했습니다.
  issues:
