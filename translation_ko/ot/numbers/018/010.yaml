    rationale: קֹדֶשׁ יִהְיֶה לָּךְ는 제물이 아론/제사장에게 거룩한 것으로 속한다는 지위 선언입니다. ‘거룩한 것입니다’로 옮겨 의미를 보존해야 합니다.
  - severity: low
    issue: 각주 표지가 관련 표현이 아니라 절 끝에 배치되어 있습니다.
    rationale: 각주는 בְּקֹדֶשׁ הַקֳּדָשִׁים의 문자적·문맥적 의미를 설명하므로 ‘지극히 거룩한 곳’ 뒤에 붙이는 것이 분명합니다.
  - severity: low
