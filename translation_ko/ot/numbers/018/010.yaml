  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'in the holy of holies.' The phrase here denotes eating it in the designated most holy area.
    reason: lexical_alternative
translation:
  language: ko
  text: 가장 거룩한 곳에서 그것을 먹어야 합니다. 모든 남자는 그것을 먹을 수 있습니다. 그것은 당신에게 거룩해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘거룩들의 거룩 안에서’입니다. 여기서는 가장 거룩한 것으로 분류된 제물을 먹는 지정 구역을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: in a most holy place
  chosen_korean: 가장 거룩한 곳에서
  alternatives_korean:
  - 지성소에서
  - 거룩한 지성소에서
  lexicon: HALOT
  rationale: 직역하면 ‘거룩 중의 거룩’이지만, 이 문맥에서는 제사 규정상 먹는 지정 구역을 가리키므로 장소성을 살린 ‘가장 거룩한 곳에서’가 자연스럽습니다.
- source_word: תֹּאכֲלֶנּוּ
  english_pob_choice: You shall eat it
  chosen_korean: 그것을 먹어야 합니다
  alternatives_korean:
  - 그것을 먹습니다
  - 그것을 먹으십시오
  lexicon: HALOT
  rationale: 법률·지시문 맥락의 חובה를 한국어 합쇼체로 옮기기 위해 의무성 있는 ‘먹어야 합니다’를 택했습니다.
- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 모든 남자는
  alternatives_korean:
  - 모든 남성은
  - 남자마다
  lexicon: HALOT
  rationale: 성별 제한을 분명히 드러내는 표현으로, 영어 POB의 gender-accurate 선택을 반영해 일반화하지 않고 ‘모든 남자’로 옮겼습니다.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  english_pob_choice: It shall be holy to you
  chosen_korean: 그것은 당신에게 거룩해야 합니다
  alternatives_korean:
  - 그것은 당신에게 거룩할 것입니다
  - 그것은 당신에게 성물이 됩니다
  lexicon: HALOT
  rationale: קֹדֶשׁ의 반복을 살려 ‘거룩’으로 통일했고, 상태 진술보다 규범적 선언이므로 ‘거룩해야 합니다’로 번역했습니다.
theological_decisions:
- issue: 아론에게 주는 지시의 범위
  chosen_reading: 히브리어 2인칭 단수는 아론을 대표자로 부르되, 내용은 제사장 공동체 전체의 섭식 규정을 뜻합니다.
  alternative_readings:
  - 아론 개인에게만 주어진 지시로 볼 수 있습니다.
  rationale: 앞뒤 문맥이 아론과 그의 아들들에게 주어지는 제사 규례이므로, 단수형을 유지하면서도 공동체적 적용을 해치지 않도록 옮겼습니다.
  doctrine_reference: Translation philosophy §5 (consistency/documented exception)
