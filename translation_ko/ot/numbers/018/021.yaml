  source_fidelity: 초안은 레위 자손, 십일조, 유산, 봉사에 대한 대가라는 주요 요소를 담고 있으나, חֵלֶף עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים אֶת עֲבֹדַת אֹהֶל מוֹעֵד의 관계를 ‘그들의 봉사를 보상하는 것입니다’로 처리하여, 하나님이 십일조를 주신 행위와 봉사에 대한 대가라는 수식 관계가 불분명해졌습니다. 개정문은 십일조를 ‘회막의 봉사에 대한 대가로’ 주셨다는 원문의 관계를 직접적으로 반영합니다.
