revisions:
- from: 그리고 레위의 아들들에게는, 보십시오, 이스라엘의 모든 십일조를 그들의 유산으로 주었습니다. 곧 그들이 수행하는 일, 곧 회막의 일을 하는 그들의 봉사를 보상하는 것입니다.[a][b][c]
  to: 레위의 아들들에게는, 보십시오, 내가 이스라엘의 모든 십일조[a]를 그들의 유산으로, 곧 그들이 수행하는 회막[c]의 봉사에 대한 대가로[b] 주었습니다.
  rationale: 하나님이 레위 자손에게 이스라엘의 십일조 전체를 유산으로 주셨으며, 그 지급이 회막 봉사에 대한 대가라는 원문의 두 진술을 한 문장 안에서 명확히 연결했습니다. ‘레위의 아들들’이라는 계보적 표현과 ‘회막의 봉사’라는 제의적 표현을 유지하되, 초안의 부자연스러운 중복과 의미 관계의 혼선을 해소했습니다. 각주 표지는 각각 해당 어구 뒤에 배치했습니다.
