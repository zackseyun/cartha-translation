id: NUM.18.21
reference: Numbers 18:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'all the tithe in Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'instead of their service' or 'as compensation for their service.'
    reason: lexical_alternative
  - marker: c
    text: That is, the tabernacle, where the Levites carried out their assigned duties.
    reason: cultural_note
translation:
  language: ko
  text: 레위의 아들들에게는, 보십시오, 내가 이스라엘의 모든 십일조[a]를 그들의 유산으로, 곧 그들이 수행하는 회막[c]의 봉사에 대한 대가로[b] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 안의 온 십일조’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 봉사 대신에’ 혹은 ‘그들의 봉사에 대한 보상으로’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 레위인들이 맡은 의무를 수행하던 성막입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  english_pob_choice: And to the sons of Levi
  chosen_korean: 레위의 아들들에게는
  alternatives_korean:
  - 레위 사람들에게는
  - 레위 자손들에게는
  lexicon: WLC
  rationale: 히브리어의 친족·계보 표현인 ‘레위의 아들들’을 살려, 단순한 집단명보다 원문 구조를 더 투명하게 반영했습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 참으로
  - 이제
  lexicon: HALOT
  rationale: 강조와 주의를 환기하는 담화 표지로서, 현대 한국어에서 자연스러운 직접적 호소인 ‘보십시오’를 택했습니다.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  english_pob_choice: every tithe in Israel
  chosen_korean: 이스라엘의 모든 십일조
  alternatives_korean:
  - 이스라엘의 모든 십 분의 일
  - 이스라엘의 모든 십일조 몫
  lexicon: HALOT
  rationale: מַעֲשֵׂר는 제의적 ‘십일조’이므로 표준 한국어 성경 용례를 따르되, כָּל의 분배적 뜻은 ‘모든’으로 살렸습니다.
- source_word: חֵלֶף עֲבֹדָתָם
  english_pob_choice: in return for their service
  chosen_korean: 그들이 수행하는 일, 곧 회막의 일을 하는 그들의 봉사를 보상하는 것입니다
  alternatives_korean:
  - 그들의 봉사에 대한 보상으로
  - 그들의 섬김 대신으로
  lexicon: HALOT
  rationale: חֵלֶף의 교환·보상 뉘앙스를 드러내기 위해 단순한 ‘대신’보다 ‘보상하는 것’으로 옮겼고, עֲבֹדָה는 제의적 노동이므로 ‘봉사’와 ‘일’을 함께 써 의미를 구체화했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 문맥상 성막을 가리키는 관용구이므로 한국어 성경에서 널리 통용되는 ‘회막’을 사용해 문화적 식별성을 확보했습니다.
theological_decisions:
- issue: 레위인의 몫이 ‘유산’이면서 동시에 ‘보상’으로 주어진다는 이중 진술
  chosen_reading: 십일조는 레위인의 유산으로 주어지되, 그들의 제의적 봉사에 대한 보상이라는 뜻도 함께 유지했습니다.
  alternative_readings:
  - 단순한 생계 지원으로만 읽기
  - 토지 상속의 대체물로만 읽기
  rationale: 본문은 לְנַחֲלָה와 חֵלֶף עֲבֹדָתָם을 함께 두어, 배당과 보상의 두 측면을 모두 말합니다. 번역도 둘 중 하나로 축소하지 않았습니다.
  doctrine_reference: 민수기 18장의 레위인 몫과 제의적 분배
