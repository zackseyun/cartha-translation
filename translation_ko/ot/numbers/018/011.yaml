revisions:
- from: 그리고 이것은 당신의 몫입니다. 곧 그들의 예물의 기여분과, 이스라엘 자손의 모든 요제입니다. 나는 그것들을 당신과 당신과 함께 있는 당신의 아들들과 당신의 딸들에게 영원한 규례로 주었습니다. 당신의 집안에 있는 누구든지 정결한 사람은 그것을 먹을 수 있습니다.[a][b]
  to: 이것은 네 몫입니다. 곧 이스라엘 자손이 드린 예물, 그들의 모든 요제 예물 가운데서 따로 바친 몫입니다.[a] 내가 이것들을 영구한 규례로 네게, 또 너와 함께 있는 네 아들들과 네 딸들에게 주었습니다. 네 집안의 정결한 사람은 누구나 그것을 먹을 수 있습니다.[b]
  rationale: The revision resolves the ambiguous and awkward coordination in the opening clause by relating the designated portion directly to the Israelites' gifts and wave offerings. It streamlines the Korean address while preserving Aaron, his sons, and his daughters as distinct recipients, retains the permission expressed by the imperfect, and places both footnote markers at their relevant terms.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the cultic senses of תְּרוּמָה, תְּנוּפָה, and טָהוֹר. However, its coordination ('예물의 기여분과 ... 모든 요제') makes the first clause sound like two separate entitlements. The Hebrew construction more naturally presents the set-apart portion in relation to the Israelites' gifts/wave offerings. The revision expresses that relationship without deciding more than the syntax warrants.
  naturalness: The repeated '당신과 당신과 함께 있는 당신의' is markedly cumbersome in modern Korean. '예물의 기여분' is also bureaucratic in this cultic context. The revised wording is clearer, natural formal-polite Korean while retaining the technical meaning through a concise footnote.
  terminology: '''요제'' and ''정결한'' are appropriate established terms. ''정결한'' correctly carries ritual, rather than moral or hygienic, force; its note should be anchored directly to that word. ''영구한 규례'' conveys לְחָק עוֹלָם idiomatically without importing an absolute philosophical claim beyond the covenantal legal context.'
  issues:
  - severity: medium
    issue: The opening noun phrase treats the contribution and the wave offerings as simply coordinate items.
    rationale: The construction links the set-apart contribution to the Israelites' gifts and all their wave offerings. Rendering it as a single integrated phrase better reflects the Hebrew relationship and avoids implying an unrelated second category.
  - severity: medium
    issue: The forms of address are repetitive and unnatural.
    rationale: The phrase '당신과 당신과 함께 있는 당신의 아들들과 당신의 딸들에게' repeats the addressee unnecessarily. Korean can retain every recipient and the phrase 'with you' as '너와 함께 있는 네 아들들과 네 딸들에게도.'
  - severity: low
    issue: Footnote anchors are placed at the end of the verse rather than beside their referents.
    rationale: Each note should be attached to the translated expression it explains, especially because one concerns the contribution term and the other ritual purity.
  revised_text: 이것은 네 몫입니다. 곧 이스라엘 자손이 드린 예물, 그들의 모든 요제 예물 가운데서 따로 바친 몫입니다.[a] 내가 이것들을 영구한 규례로 네게, 또 너와 함께 있는 네 아들들과 네 딸들에게 주었습니다. 네 집안의 정결한 사람은 누구나 그것을 먹을 수 있습니다.[b]
