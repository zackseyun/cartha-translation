id: NUM.18.11
reference: Numbers 18:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
  footnotes:
  - marker: a
    text: Or 'heave offering' for 'the contribution'; the Hebrew term refers to a portion set apart for sacred use.
    reason: lexical_alternative
  - marker: b
    text: '''Clean'' here means ritually clean, not merely physically clean or morally upright.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이것은 당신의 몫입니다. 곧 그들의 예물의 기여분과, 이스라엘 자손의 모든 요제입니다. 나는 그것들을 당신과 당신과 함께 있는 당신의 아들들과 당신의 딸들에게 영원한 규례로 주었습니다. 당신의 집안에 있는 누구든지 정결한 사람은 그것을 먹을 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기여분’은 성소 용도로 분리된 몫이라는 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정결한’은 여기서 도덕적 의미가 아니라 제의적으로 정결한 상태를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת
  english_pob_choice: the contribution
  chosen_korean: 기여분
  alternatives_korean:
  - 거제물
  - 봉헌물
  - 드림의 몫
  lexicon: HALOT
  rationale: תְּרוּמָה는 성소 용도로 분리된 몫이라는 점이 핵심이므로, 제의적 의미를 유지하면서도 현대 한국어로 자연스러운 ‘기여분’으로 옮겼습니다.
- source_word: מַתָּנָם
  english_pob_choice: their gifts
  chosen_korean: 그들의 예물
  alternatives_korean:
  - 그들의 선물
  - 그들의 제물
  - 그들의 드림
  lexicon: HALOT
  rationale: 기본 뜻은 ‘gift’이지만 문맥상 제의적 헌물의 성격이 강하므로 ‘예물’이 가장 가까우며, 소유격도 그대로 반영했습니다.
- source_word: תְּנוּפֹת
  english_pob_choice: wave offerings
  chosen_korean: 요제
  alternatives_korean:
  - 흔든 제물
  - 흔들어 바친 제물
  - 요제로 드린 것
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의 용어로서 ‘요제’가 한국어 성경에서 확립된 대응어이므로, 기술적 의미를 보존하기 위해 그대로 사용했습니다.
- source_word: לְחָק עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영원한 규례로
  alternatives_korean:
  - 영속하는 법령으로
  - 항구한 규례로
  - 영원한 율례로
  lexicon: HALOT
  rationale: חֹק은 규정된 법적/제의적 규례를 뜻하므로 ‘규례’가 적절하고, עוֹלָם은 언약 질서 안에서의 지속성을 드러내는 ‘영원한’으로 옮겼습니다.
- source_word: טָהוֹר
  english_pob_choice: clean
  chosen_korean: 정결한
  alternatives_korean:
  - 깨끗한
  - 순결한
  - 의식상 정결한
  lexicon: HALOT
  rationale: 여기서는 도덕적 순결이 아니라 제의적 정결을 가리키므로, 본문에서는 간결하게 ‘정결한’으로 두고 문맥상의 의미를 유지했습니다.
theological_decisions:
- issue: 제의적 정결과 식사 허용
  chosen_reading: ‘정결한’은 도덕적 의미가 아니라 성소 규례에 따른 제의적 정결로 이해했습니다.
  alternative_readings:
  - 깨끗한 사람
  - 의식상 정결한 사람
  - 순결한 사람
  rationale: 문맥은 아론의 집안이 거룩한 몫을 먹을 수 있는 자격을 규정하는 법조항이므로, 정결의 범주는 제의적 기준으로 읽어야 합니다.
  doctrine_reference: 레위기/민수기 제의 규례의 일관된 용례
