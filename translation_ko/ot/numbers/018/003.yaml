id: NUM.18.3
reference: Numbers 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
  footnotes:
  - marker: a
    text: Or 'the holy furnishings' or 'the sacred objects' for 'the vessels of the sanctuary.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'both they and you'; in English, within a negative clause, this is naturally rendered 'neither they nor you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신의 맡은 일을 지키고 회막 전체에 관한 맡은 일도 지켜야 합니다. 그러나 성소의 기물이나 제단에는 가까이 가서는 안 됩니다. 그들도 당신도 죽지 않도록 해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ
  english_pob_choice: They shall keep
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 지켜야 합니다
  lexicon: HALOT
  rationale: שׁמר는 맡겨진 의무를 지키다/보호하다의 뜻이므로, 문맥상 ‘맡은 일을 지키다’로 옮겨 제사장 직무의 책임성을 살렸습니다.
- source_word: מִשְׁמַרְתְּךָ
  english_pob_choice: your charge
  chosen_korean: 당신의 맡은 일
  alternatives_korean:
  - 당신의 책임
  - 당신에게 맡겨진 직무
  lexicon: HALOT
  rationale: 2인칭 단수 접미사는 아론을 직접 가리키므로, 추상적인 ‘책임’보다 ‘맡은 일’이 제의적 위임의 느낌을 더 분명히 드러냅니다.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  english_pob_choice: and the charge of the whole tent
  chosen_korean: 온 회막의 맡은 일
  alternatives_korean:
  - 온 장막의 책임
  - 온 회막의 직무
  lexicon: HALOT
  rationale: הָאֹהֶל은 문자적으로 ‘텐트/장막’이지만, 한국어 성경에서는 이 문맥이 가리키는 성막 개념을 분명히 하도록 ‘회막’으로 옮겼습니다.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  english_pob_choice: the vessels of the sanctuary
  chosen_korean: 거룩한 기물
  alternatives_korean:
  - 성소의 기물
  - 거룩한 기구들
  lexicon: HALOT
  rationale: כְּלִים은 그릇·기물·기구를 아우르며, הַקֹּדֶשׁ은 ‘거룩한’의 수식으로 기능하므로 한국어에서는 간결하게 ‘거룩한 기물’로 옮겼습니다.
- source_word: וְאֶל הַמִּזְבֵּחַ
  english_pob_choice: or the altar
  chosen_korean: 또는 제단
  alternatives_korean:
  - 그리고 제단
  - 제단에도
  lexicon: HALOT
  rationale: 금지된 대상이 두 가지임을 자연스럽게 드러내기 위해 한국어에서도 병렬 금지의 의미를 살려 ‘또는 제단’으로 처리했습니다.
- source_word: גַם הֵם גַּם אַתֶּם
  english_pob_choice: neither they nor you
  chosen_korean: 그들도 당신도
  alternatives_korean:
  - 그들도 당신도
  - 그들뿐 아니라 당신도
  lexicon: HALOT
  rationale: 부정문 속의 גַם...גַם는 ‘둘 다’의 포함을 나타내므로, 한국어에서는 결과절에서 함께 죽을 당사자들을 간명하게 묶어 표현했습니다.
theological_decisions:
- issue: 죽음 경고의 범위
  chosen_reading: 금지된 경계를 넘으면 레위인과 아론 모두에게 죽음의 위험이 있습니다.
  alternative_readings:
  - 죽음 경고는 레위인에게만 해당합니다.
  - 아론은 단지 책임을 지는 대상일 뿐, 직접 경고의 대상은 아닙니다.
  rationale: גַם הֵם גַּם אַתֶּם은 두 집단을 함께 포함하므로, 경고의 보편성을 약화시키지 않고 그대로 반영했습니다.
  doctrine_reference: 제사장-레위인 경계와 성소 거룩성
