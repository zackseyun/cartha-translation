  to: 그들은 당신의 맡은 일을 지키고 회막 전체에 관한 맡은 일도 지켜야 합니다. 그러나 성소의 기물이나 제단에는 가까이 가서는 안 됩니다. 그들도 당신도 죽지 않도록 해야 합니다.
