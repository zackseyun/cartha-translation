review_pass:
  verdict: revise
  source_fidelity: 히브리어의 금지 표현 לֹא יִקְרָבוּ는 능력·가능 여부가 아니라 접근을 금하는 명령입니다. 따라서 ‘가까이 오지 못합니다’보다 ‘가까이 가서는 안 됩니다’가 정확합니다. 마지막 לֹא יָמֻתוּ גַם הֵם גַם אַתֶּם은 레위인과 아론 모두에게 죽음이 미치지 않도록 하는 목적·경고를 나타내므로 이를 명시했습니다.
  naturalness: ‘온 회막의 맡은 일’은 수식 관계가 다소 불분명하므로 ‘회막 전체에 관한 맡은 일’으로 다듬었습니다. ‘그들도 당신도 죽지 않도록 해야 합니다’는 합쇼체를 유지하면서도 히브리어의 목적/경고 관계를 자연스럽게 나타냅니다.
  terminology: הַקֹּדֶשׁ는 여기서 성소의 거룩한 영역을 가리키는 구성 관계로 볼 수 있으므로 ‘거룩한 기물’보다 ‘성소의 기물’이 더 직접적입니다. ‘회막’과 ‘제단’은 한국어 성경 문맥에서 통용되는 적절한 용어입니다.
  issues:
  - severity: medium
    issue: ‘가까이 오지 못합니다’가 금지를 능력 또는 상황상의 불가능처럼 표현합니다.
    rationale: לֹא יִקְרָבוּ는 레위인에게 성소 기물과 제단에 접근하지 말라고 명하는 금지입니다.
  - severity: low
    issue: ‘온 회막의 맡은 일’의 의미 관계가 한국어에서 다소 불명확합니다.
    rationale: מִשְׁמֶרֶת כָּל־הָאֹהֶל은 회막 전체에 관련된 맡은 의무를 뜻하므로 관계를 풀어 쓰는 편이 자연스럽습니다.
  - severity: low
    issue: ‘거룩한 기물’은 가능한 번역이나, 본문의 구성 관계를 ‘성소의 기물’로 나타내는 것이 더 명료합니다.
