  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
  footnotes:
  - marker: a
    text: Or, 'that they may accompany you' or 'be attached to you'; the Hebrew verb also echoes the name Levi.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the tent of the testimony''; many English versions read ''tent of meeting'' here by familiarity with related tabernacle expressions.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 형제들, 곧 네 아버지의 지파인 레위 지파도 네 곁으로 가까이 오게 하여, 그들이 너와 합류하여[a] 너를 섬기게 하라. 너와 네 아들들은 증거의 장막[b] 앞에 있어야 한다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너에게 결속되게 하여’, ‘너와 함께하게 하여’. 히브리어 동사는 레위라는 이름을 연상시키기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘증거의 장막’이라고 합니다. 관련 본문들에서 익숙한 표현인 ‘회막’으로 옮기기도 합니다.
    reason: alternative_reading
