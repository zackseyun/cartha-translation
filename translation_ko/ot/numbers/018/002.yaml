  naturalness: ‘너와 네 아들들이 … 너와 함께’는 한국어로 부자연스럽고 의미상 중복됩니다. ‘네 형제들’ 및 ‘네 아들들은’로 복수 주어를 일관되게 표시하고, 명령·지시의 문체를 유지하도록 다듬는 것이 자연스럽습니다.
  terminology: ‘증거의 장막’은 אֹהֶל הָעֵדוּת의 직역적 의미를 충실히 보존합니다. ‘합류하다’는 לוה의 가능한 뜻이나, 레위라는 이름과의 언어유희 및 ‘결속됨’의 뉘앙스는 각주로 보완하는 것이 적절합니다.
