  lexicon: HALOT
  rationale: 단순한 행위가 아니라 직무와 신분을 함께 가리키므로, ‘직분’으로 풀어 제도적·기능적 의미를 드러냈습니다.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ וּלְמִבֵּית לַפָּרֹכֶת
  english_pob_choice: for everything concerning the altar and for what is within the veil
  chosen_korean: 제단과 관련된 모든 일과 휘장 안쪽의 일
  alternatives_korean:
  - 제단의 모든 일과 휘장 안의 일
  - 제단에 속한 모든 일과 휘장 안쪽의 일
  lexicon: HALOT
  rationale: דָּבָר의 넓은 ‘사안/일’의 뜻과, פָּרֹכֶת가 가리키는 성소 경계 안쪽 공간을 함께 반영했습니다.
- source_word: עֲבֹדַת מַתָּנָה
  english_pob_choice: a gift of service
  chosen_korean: 섬김의 선물
  alternatives_korean:
  - 선물로 주어진 섬김
  - 은사의 섬김
  lexicon: HALOT
  rationale: 직역보다, 제사장 직분이 하나님이 주시는 선물이라는 점을 살리되 ‘섬김’과 ‘선물’의 두 요소를 한국어로 간결하게 유지했습니다.
- source_word: הַזָּר הַקָּרֵב
  english_pob_choice: the outsider who comes near
  chosen_korean: 가까이 오는 외인
  alternatives_korean:
  - 가까이 오는 외부인
  - 가까이 다가오는 자
  lexicon: HALOT
  rationale: זָר를 혈통적 ‘타국인’보다 자격이 없는 자를 가리키는 ‘외인’으로 옮겨, 제의적 자격의 부재를 드러냈습니다.
theological_decisions:
- issue: '제사장 직분의 성격: 권리보다 부여된 섬김'
  chosen_reading: 제사장 직분은 하나님이 주시는 선물이며 섬김의 책임으로 주어진 것입니다.
  alternative_readings:
  - 제사장 직분은 섬길 권한이 아니라 직무입니다.
  - 제사장 직분을 선물로 주셨습니다.
  rationale: עֲבֹדַת מַתָּנָה의 긴장을 살려, 직분이 자의적 소유가 아니라 하나님이 부여하신 봉사의 책임이라는 점을 드러냈습니다.
  doctrine_reference: 민수기 18장의 레위·제사장 직분 규정
- issue: 'זָר의 의미: 민족적 외국인보다 무자격자'
  chosen_reading: ‘외인’은 여기서 제사장 직무를 수행할 권한이 없는 자를 뜻합니다.
  alternative_readings:
  - ‘외국인’
  - ‘낯선 사람’
  - ‘무자격자’
  rationale: 문맥상 민족적 외국인 일반이 아니라 성소 출입과 직무 수행의 권한 밖에 있는 자를 가리키므로, 오해를 줄이는 방향을 택했습니다.
  doctrine_reference: 제의 경계와 성소의 거룩함
