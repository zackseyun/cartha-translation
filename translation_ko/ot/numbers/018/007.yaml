revisions:
- from: 그러나 너와 너와 함께 있는 네 아들들은 제사장 직분을 지켜야 합니다. 곧 제단과 관련된 모든 일과 휘장 안쪽의 일에 대하여 그러해야 하며, 너희는 섬겨야 합니다. 나는 너희 제사장 직분을 섬김의 선물로 줍니다. 그러나 가까이 오는 외인은 반드시 죽임을 당해야 합니다.[a][b]
  to: 그러나 너와 네 곁에 있는 네 아들들은 제단의 모든 일과 휘장 안쪽의 일에 관하여 너희 제사장 직분을 지켜야 하며, 섬겨야 합니다. 나는 너희의 제사장 직분을 섬김의 선물로[b] 줍니다. 그러나 자격 없는 사람이[a] 가까이 오면 죽임을 당할 것입니다.
  rationale: The revision preserves the Hebrew’s syntax and ambiguity while improving modern Korean flow. It corrects the misplaced footnote anchors, places each note at the relevant expression, and replaces ‘외인’ with a non-ethnic contextual rendering for the unauthorized non-priestly person. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft broadly reflects the Hebrew: the priestly charge encompasses altar matters and the area within the veil; the priesthood is a divinely granted gift-service; and an unauthorized person who approaches is subject to death. However, the Korean footnote anchors are attached together at the end of the verse rather than to the expressions they explain. The wording for זָר should also more directly convey lack of authorization rather than the potentially ethnic sense of ‘외인.’'
  naturalness: ‘곧 … 그러해야 하며’ is unnecessarily discontinuous and less natural in modern formal Korean. Integrating the scope of the priestly charge into one sentence produces a clearer, more idiomatic rendering. ‘너와 너와 함께 있는 네 아들들’ is also repetitive; ‘너와 네 곁에 있는 네 아들들’ preserves the sense naturally.
  terminology: ‘제사장 직분’ appropriately renders כְּהֻנָּה. ‘휘장 안쪽’ is a suitable rendering of the restricted sanctuary area. ‘자격 없는 사람’ accurately expresses זָר here as a person unauthorized for priestly service, without suggesting ethnicity. ‘섬김의 선물’ retains the productive ambiguity of עֲבֹדַת מַתָּנָה when supported by the note.
  issues:
  - severity: medium
    issue: Footnote markers [a] and [b] are both placed after the final clause.
    rationale: Footnote a explains the unauthorized person (הַזָּר), while footnote b explains ‘gift of service’ (עֲבֹדַת מַתָּנָה). They must be anchored to their respective Korean expressions.
  - severity: medium
    issue: ‘외인’ can be read as an ethnic foreigner in contemporary Korean.
    rationale: In this priestly context זָר denotes someone unauthorized to perform the restricted sacred duty. ‘자격 없는 사람’ communicates this contextual meaning more directly and naturally.
  - severity: low
    issue: The construction ‘곧 … 그러해야 하며’ is awkward and separates the duty from its scope.
    rationale: The Hebrew scope phrase can be incorporated directly with ‘제사장 직분을 지켜야 하며’ without changing the meaning.
  revised_text: 그러나 너와 네 곁에 있는 네 아들들은 제단의 모든 일과 휘장 안쪽의 일에 관하여 너희 제사장 직분을 지켜야 하며, 섬겨야 합니다. 나는 너희의 제사장 직분을 섬김의 선물로[b] 줍니다. 그러나 자격 없는 사람이[a] 가까이 오면 죽임을 당할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘허가받지 않은 사람’. 히브리어 ‘자격 없는 사람’은 여기서 제사장 직분이 없는 사람, 곧 자격이 없는 사람을 가리키며 민족적 의미의 ‘외국인’에만 한정되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘선물로 주어진 섬김’. 히브리어 구문은 섬김이 선물인지, 혹은 제사장 직분이 섬김을 위한 선물로 주어졌는지 둘 다를 시사할 수 있습니다.
    reason: lexical_alternative
