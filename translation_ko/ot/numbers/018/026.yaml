  naturalness: 초안은 문장 구조가 다소 어색합니다. 현대 표준어 합쇼체로 명령의 대상(모세)과 레위 사람들에게 전할 지시를 분명히 구분하면 자연스럽습니다.
  terminology: ‘레위 사람들’, ‘이스라엘 자손’, ‘십일조’, ‘기업’, ‘야훼’, ‘헌물’은 적절합니다. תְּרוּמַת יְהוָה는 야훼께 바쳐지는 헌물이라는 방향성을 한국어에서 명확히 하는 것이 좋습니다.
  issues:
  - severity: high
