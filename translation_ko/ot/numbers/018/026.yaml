  text: 너는 레위 사람에게 말하여 그들에게 이르기를, 너희가 이스라엘 자손에게서 너희의 기업을 삼아 그들 가운데서 받은 십일조를 취할 때에, 너희는 그 십일조 중에서 야훼의 헌물을, 곧 십일조의 십일조를 드려야 하리라.
