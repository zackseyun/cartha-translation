  source_fidelity: 초안은 יְהוָה를 ‘야훼’로, תְּרוּמָה를 ‘거제물’로, חֵלֶב의 문맥적 의미를 ‘가장 좋은 부분’으로 옮긴 점은 대체로 적절합니다. 그러나 ‘그 가운데서 가장 좋은 부분 가운데서’는 מִכָּל חֶלְבּוֹ의 단일 구문을 중복하여 번역한 것이며, ‘취해야 합니다’는 원문에 별도의 동사가 없는 듯한 인상을 줍니다. 또한 ‘그 거룩한 몫’은 소유 접미사 -וֹ를 한국어에서 충분히 드러내지 못합니다.
  naturalness: ‘모든 예물 가운데서’와 이어지는 ‘그 가운데서 가장 좋은 부분 가운데서’의 반복은 현대 한국어로 부자연스럽습니다. 두 번째 절을 앞선 명령의 내용을 풀어 주는 ‘곧’ 절로 처리하고, ‘그것의 거룩한 몫’으로 지시 관계를 명료하게 하는 편이 자연스럽습니다.
  terminology: ‘야훼’, ‘예물’, ‘거제물’, ‘거룩한 몫’은 이 제의 문맥에서 사용할 수 있는 현대적이고 격식 있는 용어입니다. ‘야훼의 모든 거제물’은 소유 관계가 다소 모호하므로 ‘야훼께 드릴 모든 거제물’로 옮겨 봉헌의 방향을 명확히 했습니다. 각주 a는 חֵלֶב의 문자적 대안을, 각주 b는 מִקְדְּשׁוֹ의 대안을 적절히 보존합니다.
