source:
  edition: WLC
  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
  footnotes:
  - marker: a
    text: Or 'from all its fat,' that is, from all its choicest part.
    reason: lexical_alternative
  - marker: b
    text: Or 'its consecrated part' for 'the holy portion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 모든 예물 가운데서 야훼께 드릴 모든 거제물을 들어 올려야 합니다. 곧 그 가장 좋은 모든 부분에서 그것의 거룩한 몫을 떼어 내야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 가장 기름진 부분’, 곧 ‘가장 좋은 부분’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 거룩하게 구별된 몫’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  english_pob_choice: From all your gifts
  chosen_korean: 너희가 드리는 모든 예물 가운데서
  alternatives_korean:
  - 너희의 모든 선물 가운데서
  - 너희가 바치는 모든 헌물 가운데서
  lexicon: HALOT
  rationale: מַתָּנָה는 일반적인 ‘선물’보다 제의적 ‘예물/헌물’이 더 정확하며, מִן־כֹּל은 전체 중에서 일부를 떼어 내는 뜻이므로 ‘가운데서’로 자연스럽게 살렸습니다.
- source_word: תָּרִימוּ
  english_pob_choice: you shall lift up
  chosen_korean: 들어 올려야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 올려 바쳐야 합니다
  lexicon: HALOT
  rationale: 히필 רוּם의 제의적 관용구를 살려 ‘들어 올리다’를 택했습니다. 단순한 ‘드리다’보다 원문의 동작성과 제의적 뉘앙스가 더 분명합니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: offering of Yahweh
  chosen_korean: 야훼의 모든 거제물
  alternatives_korean:
  - 야훼께 드리는 거제물
  - 야훼의 봉헌물
  lexicon: HALOT
  rationale: תְּרוּמָה는 ‘거제물’로 옮겨 제의 용어를 보존했고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다. ‘모든’은 원문의 כָּל을 반영합니다.
- source_word: מִכָּל חֶלְבּוֹ
  english_pob_choice: from all its best part
  chosen_korean: 그 가운데서 가장 좋은 부분 가운데서
  alternatives_korean:
  - 그 가운데서 가장 기름진 부분 가운데서
  - 그 가운데서 가장 좋은 몫 가운데서
  lexicon: HALOT
  rationale: חֵלֶב의 문자적 의미는 ‘기름’이지만 제의 문맥에서는 ‘가장 좋은/기름진 부분’의 관용적 의미가 있습니다. 한국어에서는 ‘가장 좋은 부분’으로 의미를 드러내되, 원문의 부분성은 유지했습니다.
- source_word: מִקְדְּשׁוֹ
  english_pob_choice: the holy portion
  chosen_korean: 그 거룩한 몫
  alternatives_korean:
  - 그 성별된 몫
  - 그 거룩하게 구별된 몫
  lexicon: HALOT
  rationale: מִקְדָּשׁ의 소유격은 문맥상 제물에서 떼어 낸 ‘거룩한 몫’으로 이해하는 것이 자연스럽습니다. ‘거룩한 몫’은 제의적 구별성과 가독성을 함께 살립니다.
theological_decisions:
- issue: YHWH divine name rendering
