  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
  footnotes:
  - marker: a
    text: Or 'shall bear the guilt of the sanctuary'; the Hebrew idiom can also carry the sense of bearing responsibility for offenses connected with the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall bear the guilt of your priesthood'; the Hebrew idiom may also mean bearing responsibility for offenses connected with your priestly office.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아론에게 말씀하셨습니다. “너와 네 아들들과 네 아버지의 집안 사람들은 너와 함께 성소와 관련된 죄악[a]을 짊어질 것입니다. 또 너와 네 아들들은 너와 함께 너희 제사장 직무와 관련된 죄악[b]을 짊어질 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소와 관련된 죄책’. 히브리어 표현은 성소와 관련된 범죄에 대한 죄책이나 책임을 짊어지는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 제사장 직무와 관련된 죄책’. 히브리어 표현은 제사장 직무와 관련된 범죄에 대한 죄책이나 책임을 짊어지는 뜻도 될 수 있습니다.
    reason: lexical_alternative
