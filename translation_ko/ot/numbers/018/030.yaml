  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
  footnotes:
  - marker: a
    text: Hebrew 'its fat'; here the term refers idiomatically to the richest or best portion of the produce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에게 이렇게 말씀하십시오. ‘그것에서 가장 좋은 부분을 들어 올릴 때, 그것은 타작마당의 소산과 포도즙 틀의 소산처럼 레위인들에게 계산될 것입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그것의 기름’은 여기서 문자적 지방이 아니라 가장 좋은 몫을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  english_pob_choice: And you shall say to them
  chosen_korean: 그들에게 이렇게 말씀하십시오
  alternatives_korean:
