  lexicon: HALOT
  rationale: 모세에게 주어진 직접 명령을 합쇼체 명령형으로 살리면서, 뒤따르는 인용문을 자연스럽게 여는 한국어 표현으로 정리했습니다.
- source_word: בַּהֲרִימְכֶם אֶת חֶלְבּוֹ
  english_pob_choice: When you lift up its best part
  chosen_korean: 그것에서 가장 좋은 부분을 들어 올릴 때
  alternatives_korean:
  - 그것의 기름진 부분을 들어 올릴 때
  - 그것에서 가장 좋은 몫을 거두어 올릴 때
  lexicon: HALOT
  rationale: חֶלְבּוֹ를 문자 그대로의 ‘기름’보다 제물/소산의 가장 좋은 몫이라는 관용적 뜻으로 이해해 POB의 ‘best part’를 반영했습니다.
- source_word: וְנֶחְשַׁב לַלְוִיִּם
  english_pob_choice: it shall be counted to the Levites
  chosen_korean: 그것은 레위인들에게 계산될 것입니다
  alternatives_korean:
  - 그것은 레위인들에게 여겨질 것입니다
  - 그것은 레위인들에게 인정될 것입니다
  lexicon: HALOT
  rationale: חשׁב의 법적·회계적 뉘앙스를 살려 ‘계산되다’로 옮겼고, 대상 표지는 ‘레위인들에게’로 자연스럽게 처리했습니다.
- source_word: כִּתְבוּאַת גֹּרֶן ... וְכִתְבוּאַת יָקֶב
  english_pob_choice: as the produce of the threshing floor and as the produce of the winepress
  chosen_korean: 타작마당의 소산과 포도즙 틀의 소산처럼
  alternatives_korean:
  - 타작마당의 산물과 포도즙 틀의 산물처럼
  - 타작마당의 추수물과 포도즙 틀의 추수물처럼
  lexicon: HALOT
  rationale: תְּבוּאָה는 ‘소산/산출물’로, גֹּרֶן과 יָקֶב의 평행 구조는 농업적 이미지를 유지해 한국어에서도 균형 있게 옮겼습니다.
theological_decisions:
- issue: 레위인 몫의 성격이 ‘best part’로 표현되는 관용의 보존
  chosen_reading: חֶלְבּוֹ를 문자적 ‘기름’이 아니라 소산의 가장 좋은 몫이라는 관용으로 이해해 번역했습니다.
  alternative_readings:
  - ‘그것의 기름’으로 직역
  - ‘그것의 가장 기름진 부분’으로 번역
  rationale: 본문은 제물의 동물 기름이 아니라 바쳐지는 소산의 일부를 다루므로, 문맥상 ‘가장 좋은 부분’이 원문의 관용을 더 정확히 드러냅니다.
  doctrine_reference: 민수기 18장 레위인 몫과 성물의 구분
- issue: וְנֶחְשַׁב의 수동적 선언
  chosen_reading: ‘계산될 것입니다’로 번역해, 하나님이 정하신 인정/귀속의 선언을 살렸습니다.
  alternative_readings:
  - ‘여겨질 것입니다’
  - ‘인정될 것입니다’
  rationale: 이 절은 단순한 평가가 아니라 제의적·법적 귀속을 선언하므로, 결과를 공식적으로 확정하는 어감을 유지했습니다.
  doctrine_reference: 성물과 헌물의 규정
