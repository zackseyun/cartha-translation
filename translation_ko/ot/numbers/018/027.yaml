  source_fidelity: 히브리어의 니팔형 '여겨지다/계산되다'와 두 농업 산물의 비교는 대체로 반영되었습니다. 그러나 תְּרוּמָה를 '기여'로 옮기면 제의적으로 구별하여 드리는 헌물이라는 문맥이 약해지고, מְלֵאָה의 농산물적 뜻을 '충만한 소출'로 표현한 것은 한국어에서 다소 부자연스럽습니다.
  naturalness: '''너희의 기여''는 현대 한국어에서 금전적·사회적 기여를 우선 연상시켜 제의 규정의 문맥에 맞지 않습니다. ''충만한 소출''도 자연스러운 농업 표현이 아니므로 ''가득한 소출''이 더 명료합니다. ''포도주 틀''은 성경 문맥에서 winepress를 자연스럽게 가리킵니다.'
  terminology: תְּרוּמָה는 여기서 레위인이 드리는 성별된 헌물이므로 '헌물'이 현대적이면서도 적절합니다. 전통 용어 '거제물'은 각주 대안으로 유지합니다. יֶקֶב는 '포도주 틀'로, מְלֵאָה는 문맥상 '가득한 소출'로 옮깁니다.
