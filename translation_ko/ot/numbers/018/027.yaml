id: NUM.18.27
reference: Numbers 18:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
  footnotes:
  - marker: a
    text: Or 'will be counted to you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your offering'; traditionally 'your heave offering.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'fullness from the winepress,' that is, the full yield/product of the winepress.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희의 헌물은 너희에게 타작마당의 곡식처럼, 포도주 틀의 가득한 소출처럼 여겨질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '너희에게 계산될 것입니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '너희의 봉헌물'; 전통적으로 '너희의 거제물'입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 '포도주 틀의 충만함'이며, 곧 포도주 틀에서 얻는 가득한 소출을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  english_pob_choice: will be reckoned
  chosen_korean: 여겨질 것입니다
  alternatives_korean:
  - 계산될 것입니다
  - 간주될 것입니다
  - 헤아려질 것입니다
  lexicon: HALOT
  rationale: 니팔형 חשׁב의 핵심은 어떤 것을 다른 것에 상응하는 것으로 인정·평가하는 뜻이므로, 법적·제의적 맥락을 살려 '여겨지다'로 옮겼습니다.
- source_word: תְּרוּמַתְכֶם
  english_pob_choice: your contribution
  chosen_korean: 너희의 기여
  alternatives_korean:
  - 너희의 헌물
  - 너희의 봉헌물
  - 너희의 거제물
  lexicon: HALOT
  rationale: תְּרוּמָה는 구별하여 드리는 몫을 가리키지만, 여기서는 레위인에게서 드려지는 몫이라는 문맥을 살려 현대 독자가 이해하기 쉬운 '기여'로 옮겼습니다.
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  english_pob_choice: like grain from the threshing floor
  chosen_korean: 타작마당의 곡식처럼
  alternatives_korean:
  - 타작마당에서 난 곡식처럼
  - 타작마당의 곡물처럼
  lexicon: HALOT
  rationale: דָּגָן은 곡식/곡물의 일반 표현이므로, מקור지시적 관계를 자연스럽게 살려 '타작마당의 곡식처럼'으로 옮겼습니다.
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  english_pob_choice: and like the fullness from the winepress
  chosen_korean: 포도즙틀의 충만한 소출처럼
  alternatives_korean:
  - 포도즙틀의 충만함처럼
  - 포도즙틀에서 난 가득한 산물처럼
  - 포도즙틀의 가득한 소출처럼
  lexicon: HALOT
  rationale: מְלֵאָה는 문자적으로 '충만함/가득 참'이지만, 여기서는 포도즙틀의 생산물을 가리키는 병행구이므로 '충만한 소출'로 옮겨 의미와 이미지 둘 다 살렸습니다.
theological_decisions:
- issue: 제의적 '기여/헌물' 표현의 선택
  chosen_reading: 여기서는 전통적 '거제물'보다 현대어 '기여'를 사용해, 제의적 몫이 실제로 제시되는 대상을 독자가 바로 이해하도록 했습니다.
  alternative_readings:
  - 거제물
  - 헌물
  - 봉헌물
  rationale: 본문은 레위인의 몫이 야훼께 드려진 후 어떻게 간주되는지를 설명하는 문맥이므로, 용어의 제의성은 유지하되 지나치게 교회용어화된 표현은 피했습니다.
  doctrine_reference: 민수기 18장 레위인의 몫과 성소 기여 규정
