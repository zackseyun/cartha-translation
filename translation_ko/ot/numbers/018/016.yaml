  source_fidelity: 초안의 ‘한 달 된 것부터는’은 히브리어의 속량 대상(וּפְדוּיָו)을 나이 표현 속에 흡수하여, 누가 속량되는지를 충분히 드러내지 못합니다. 또한 ‘성소 세겔로 말하면 스무 게라’는 원문의 단위 기준 설명을 다소 부자연스럽게 연결합니다.
  naturalness: ‘속량해야 할 이는 한 달이 된 때부터’와 ‘성소 세겔로 은 다섯 세겔’은 현대 표준 한국어의 격식 있는 규정 문체로 자연스럽습니다. 마지막 문장을 ‘한 세겔은 스무 게라입니다’로 명시하면 한국어의 지시어 모호성도 제거됩니다.
  terminology: פדה의 제의·법적 의미에는 ‘속량하다’를 유지했습니다. בְּעֶרְכְּךָ는 제사장에게 지시된 산정이므로 ‘네가 정한 값대로’로 옮겼고, ‘성소 세겔’ 및 ‘게라’는 관습적 단위 명칭으로 보존했습니다.
