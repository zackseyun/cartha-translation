  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the shekel is twenty gerahs.' The Hebrew pronoun 'it' refers to the sanctuary shekel as the standard weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 속량해야 할 이는 한 달이 된 때부터 네가 정한 값대로 속량해야 합니다. 곧 성소 세겔로 은 다섯 세겔입니다. 한 세겔은 스무 게라입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְדוּיָו
  english_pob_choice: those to be redeemed
  chosen_korean: 한 달 된 것부터[a]는
  alternatives_korean:
  - 속량될 자들은
  - 속량해야 할 자들은
  - 속량되는 이들은
  lexicon: HALOT
  rationale: 문맥상 처음 난 자의 속량 규정이므로 ‘redeemed’의 대상임을 살리되, 히브리어의 단수·집합적 용법을 한국어에서는 나이 기준을 앞세운 자연스러운 표현으로 옮겼습니다.
- source_word: מִבֶּן חֹדֶשׁ
  english_pob_choice: from a month old
  chosen_korean: 한 달 된 것부터
  alternatives_korean:
  - 한 달부터
  - 한 달 난 것부터
  - 한 달이 된 때부터
  lexicon: HALOT
  rationale: 연령 기준의 시작점을 나타내므로 ‘from a month old’의 의미를 유지하면서 한국어 법령체에 맞게 정리했습니다.
- source_word: בְּעֶרְכְּךָ
  english_pob_choice: according to your valuation
  chosen_korean: 네 평가대로
  alternatives_korean:
  - 네 값매김대로
  - 네 산정대로
  - 네 평가에 따라
  lexicon: HALOT
  rationale: 제사장에게 주어진 평가·산정의 의미를 살려, 추상적이지만 법률적 맥락에 맞는 ‘평가’로 옮겼습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ / עֶשְׂרִים גֵּרָה הוּא
  english_pob_choice: by the sanctuary shekel; it is twenty gerahs
  chosen_korean: 성소 세겔로 말하면 스무 게라입니다
  alternatives_korean:
  - 성소 세겔로는 스무 게라입니다
  - 거룩한 세겔로 말하면 스무 게라입니다
  - 성소 세겔은 스무 게라입니다
  lexicon: HALOT
  rationale: 기준 무게를 뜻하는 관용구이므로 ‘성소 세겔’을 사용했고, 히브리어의 지시대명사 ‘it’을 한국어에서는 설명적 구문으로 풀어 기준 단위를 분명히 했습니다.
theological_decisions:
- issue: 속량 규정의 법적·제의적 성격
  chosen_reading: 본문을 일반적 구원 언어가 아니라 제사장적 속량 규정으로 읽어, ‘속량하다’와 ‘평가’의 법정·제의적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 구속하다
  - 값을 치르고 되사다
  rationale: 출애굽기/민수기의 제의법 문맥에서는 המרה가 아니라 פדה의 제의적 속량이 핵심이므로, 한국어에서도 제도적 규정의 성격이 드러나야 합니다.
  doctrine_reference: 민수기 18장 제사장 수입과 첫태생 속량 규정
