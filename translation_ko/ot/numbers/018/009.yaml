id: NUM.18.9
reference: Numbers 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
  footnotes:
  - marker: a
    text: Or 'from the fire.' The Hebrew is literal; 'reserved from the fire' brings out the sense of portions set apart from offerings presented by fire.
    reason: lexical_alternative
  - marker: b
    text: '''Sin offering'' may also be rendered ''purification offering.'''
    reason: lexical_alternative
  - marker: c
    text: '''Guilt offering'' may also be rendered ''reparation offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가장 거룩한 제물, 곧 불에 바쳐 드리는 제물 가운데서 다음 것은 당신의 몫이 될 것입니다. 곧 그들이 내게 돌려 바치는 모든 예물과 모든 곡식 제물과 모든 속죄 제물[b]과 모든 속건 제물[c]입니다. 이것은 당신과 당신의 아들들에게 지극히 거룩합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불에서’. 히브리어는 문자적으로 ‘불로부터’이며, 불에 바쳐 드린 제물에서 떼어 구별된 몫이라는 뜻을 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속죄 제물’은 ‘정결 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속건 제물’은 ‘배상 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: from the most holy things
  chosen_korean: 가장 거룩한 것들 가운데서
  alternatives_korean:
  - 지성소에서
  - 가장 거룩한 것에서
  lexicon: HALOT
  rationale: 이 구문은 성소 방이 아니라 제의적 분류를 가리키므로, 공간이 아닌 ‘가장 거룩한 것들’이라는 범주로 옮기는 것이 문맥에 맞습니다.
- source_word: מִן הָאֵשׁ
  english_pob_choice: from the fire
  chosen_korean: 불로 드리는 제물 가운데서
  alternatives_korean:
  - 불에서
  - 불 가운데서
  lexicon: HALOT
  rationale: 직역은 ‘불에서’이지만, 문맥상 불에 의해 드려진 제물에서 떼어 구별된 몫이라는 뜻이므로 그 제의적 의미를 드러냈습니다.
- source_word: קָרְבָּנָם
  english_pob_choice: offering of theirs
  chosen_korean: 예물
  alternatives_korean:
  - 그들의 제물
  - 그들의 바침
  lexicon: HALOT
  rationale: קָרְבָּן은 하나님께 가까이 가져오는 일반 제물을 뜻하므로, 한국어에서는 ‘예물’이 가장 자연스럽고 포괄적입니다.
- source_word: מִנְחָתָם
  english_pob_choice: grain offering of theirs
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡물 예물
  lexicon: HALOT
  rationale: 제사 용어를 현대 한국어로 분명하게 하되, 전통 용어 ‘소제’보다 뜻이 더 즉각적으로 드러나는 ‘곡식 제물’을 택했습니다.
- source_word: חַטָּאתָם
  english_pob_choice: sin offering of theirs
  chosen_korean: 속죄 제물
  alternatives_korean:
  - 속죄제
  - 죄 제물
  lexicon: HALOT
  rationale: 이 문맥에서는 죄 자체보다 제의적 속죄에 드려지는 제물을 가리키므로, ‘속죄 제물’이 의미를 더 잘 전달합니다.
- source_word: אֲשָׁמָם
  english_pob_choice: guilt offering of theirs
  chosen_korean: 속건 제물
  alternatives_korean:
  - 속건제
  - 배상 제물
  lexicon: HALOT
  rationale: אָשָׁם은 죄책과 배상을 함께 포함하는 제물로, 한국 교회 전통에 익숙한 ‘속건 제물’을 유지하되 직역적 의미도 살렸습니다.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  english_pob_choice: which they return to me
  chosen_korean: 그들이 내게 돌려주는 것들
  alternatives_korean:
  - 그들이 내게 갚는 것들
  - 그들이 내게 되돌리는 것들
  lexicon: HALOT
  rationale: שוב의 ‘되돌리다/돌려주다’의 동사를 살리면서, 제의·보상 문맥의 반환 감각을 자연스럽게 반영했습니다.
theological_decisions:
- issue: ‘지극히 거룩한 것’의 범주 표현과 제물의 성격 유지
  chosen_reading: 가장 거룩한 것들 / 지극히 거룩합니다
  alternative_readings:
  - 지성소
  - 가장 거룩한
  rationale: 본문은 제물의 성별된 등급을 말하며 성소 방을 뜻하지 않으므로, 공간적 오해를 피하면서도 최고 수준의 거룩함을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 아론의 후손에 대한 성별된 호칭
  chosen_reading: 당신과 당신의 아들들
  alternative_readings:
  - 당신과 당신의 자녀들
  - 당신과 당신의 후손들
  rationale: 히브리어가 분명히 ‘아들들’이라 말하고 있으며, 제사장 직분의 계보를 흐리지 않기 위해 이를 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §4
