revisions:
- from: 태에서 먼저 나오는 모든 것 곧 그들이 야훼께 드리는 모든 생물 가운데 사람이든 짐승이든 처음 난 것은 너희의 것이 될 것입니다. 그러나 사람의 첫태생은 반드시 속여야 하고, 부정한 짐승의 첫태생도 속여야 합니다.[a][b]
  to: 모든 생명체 가운데서 그들이 야훼께 드리는 태를 여는 모든 것은, 사람이든 짐승이든, 모두 당신의 것이 될 것입니다. 그러나 사람의 첫태생은 반드시 속량해야 하며, 부정한 짐승의 첫태생도 속량해야 합니다.[a][b]
  rationale: ‘속여야’를 ‘속량해야’로 바로잡아 פָּדָה의 법적·제의적 의미와 반복형이 나타내는 강조를 보존했습니다. לְךָ의 단수를 ‘당신의 것’으로 반영하고, 첫 절을 재구성하여 ‘모든 생명체’, ‘태를 여는 것’, ‘야훼께 드림’, ‘사람과 짐승’이라는 원문의 범위와 관계를 명료하게 했습니다. 각주 a도 사람과 짐승에 함께 적용되는 관용구임을 드러내도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 야훼 이름, 사람과 짐승의 대조, 사람과 부정한 짐승을 속량한다는 단서는 대체로 반영되었습니다. 그러나 ‘속여야’는 פָּדָה(속량하다)를 ‘속이다’로 잘못 옮긴 명백한 의미 오류이며, ‘너희’는 히브리어 단수 여격 לְךָ를 복수로 바꿉니다. 첫 문장도 ‘모든 것’과 ‘처음 난 것’이 중복되어 원문의 수식 관계가 불명료합니다.
  naturalness: ‘태에서 먼저 나오는 모든 것 곧 그들이 야훼께 드리는 모든 생물 가운데 사람이든 짐승이든 처음 난 것은’은 수식어가 중첩되어 현대 한국어 문장으로 매끄럽지 않습니다. ‘모든 생명체 가운데서 그들이 야훼께 드리는 태를 여는 모든 것은’처럼 범위와 제시 행위를 분명히 하는 편이 자연스럽습니다. ‘속여야’는 문맥상 전혀 성립하지 않습니다.
  terminology: 야훼, 부정한 짐승은 적절합니다. פָּדָה는 이 법·제의 문맥에서 ‘속량하다’로 옮겨야 합니다. בְּכוֹר는 사람과 짐승 모두에 적용되므로 ‘맏아들’보다 ‘첫태생’ 또는 ‘처음 난 것’이 적절합니다.
