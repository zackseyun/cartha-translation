source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
  footnotes:
  - marker: a
    text: Or 'whatever opens the womb.' The Hebrew idiom refers to the first offspring to emerge from the womb.
    reason: lexical_alternative
  - marker: b
    text: Or 'that they offer to the LORD.' The verb can mean 'bring near' or 'present' in offering contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 태에서 먼저 나오는 모든 것 곧 그들이 야훼께 드리는 모든 생물 가운데 사람이든 짐승이든 처음 난 것은 너희의 것이 될 것입니다. 그러나 사람의 첫태생은 반드시 속여야 하고, 부정한 짐승의 첫태생도 속여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘태를 여는 것’. 이 히브리어 관용구는 태에서 가장 먼저 나오는 첫 자식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 야훼께 바치는’. 이 동사는 제의 문맥에서 ‘가까이 가져오다’ 또는 ‘드리다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  english_pob_choice: firstborn that opens the womb
  chosen_korean: 태에서 먼저 나오는 것
  alternatives_korean:
  - 태를 여는 첫태생
  - 태를 처음 여는 것
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 살리되 한국어에서 자연스럽게 읽히도록 ‘태에서 먼저 나오는 것’으로 옮겼습니다.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  english_pob_choice: that they present to Yahweh
  chosen_korean: 그들이 야훼께 드리는
  alternatives_korean:
  - 그들이 야훼께 바치는
  - 그들이 야훼께 가까이 가져오는
  lexicon: HALOT
  rationale: הקריב의 제의적 의미를 살려 단순한 ‘가져오다’보다 헌납·제시의 뜻이 드러나는 ‘드리다’를 택했습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: whether man or beast
  chosen_korean: 사람이든 짐승이든
  alternatives_korean:
  - 사람이든 가축이든
  - 사람이든 동물이든
  lexicon: HALOT
  rationale: 사람과 짐승의 대조를 간결하게 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: פָּדֹה תִפְדֶּה
  english_pob_choice: you must surely redeem
  chosen_korean: 반드시 속여야
  alternatives_korean:
  - 반드시 속량해야
  - 반드시 구속해야
  lexicon: HALOT
  rationale: 중복형(절대부정사+동사)의 강조를 반영해 강한 의무를 나타냈습니다. 여기서는 제의적·법적 맥락의 ‘속이다’가 아니라 ‘속량하다/속죄하다’의 뜻입니다.
- source_word: בְּכוֹר הָאָדָם
  english_pob_choice: the firstborn of man
  chosen_korean: 사람의 첫태생
  alternatives_korean:
  - 사람의 맏아들
  - 인간의 첫태생
  lexicon: HALOT
  rationale: אָדָם과 짐승의 대비를 유지하기 위해 성별 한정이 덜한 ‘첫태생’을 사용했습니다.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  english_pob_choice: the firstborn of the unclean beast
  chosen_korean: 부정한 짐승의 첫태생
  alternatives_korean:
  - 부정한 동물의 첫태생
  - 부정한 가축의 첫태생
  lexicon: HALOT
  rationale: 정결/부정 범주를 법적·의례적 용어인 ‘부정한’으로 보존하고, בהמה는 문맥상 ‘짐승’으로 옮겼습니다.
theological_decisions:
- issue: פָּדֹה תִפְדֶּה의 강조된 의무 표현
  chosen_reading: “반드시 속여야”로 의무와 강한 강조를 함께 반영했습니다.
  alternative_readings:
  - 반드시 속량해야 합니다
  - 반드시 구속해야 합니다
  rationale: 히브리어의 반복 강조를 한국어에서 가장 직접적으로 드러내는 방식으로, 규범적 의무를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1 and §3
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신적 이름을 제목으로 대체하지 않고 고유명으로 보존했습니다.
  doctrine_reference: POB default glossary for יהוה / YHWH
