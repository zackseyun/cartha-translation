  rationale: 사람과 짐승의 대조를 간결하게 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: פָּדֹה תִפְדֶּה
  english_pob_choice: you must surely redeem
  chosen_korean: 반드시 속여야
  alternatives_korean:
  - 반드시 속량해야
  - 반드시 구속해야
  lexicon: HALOT
  rationale: 중복형(절대부정사+동사)의 강조를 반영해 강한 의무를 나타냈습니다. 여기서는 제의적·법적 맥락의 ‘속이다’가 아니라 ‘속량하다/속죄하다’의 뜻입니다.
- source_word: בְּכוֹר הָאָדָם
  english_pob_choice: the firstborn of man
  chosen_korean: 사람의 첫태생
  alternatives_korean:
