  lexicon: HALOT
  rationale: אָדָם과 짐승의 대비를 유지하기 위해 성별 한정이 덜한 ‘첫태생’을 사용했습니다.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  english_pob_choice: the firstborn of the unclean beast
  chosen_korean: 부정한 짐승의 첫태생
  alternatives_korean:
  - 부정한 동물의 첫태생
  - 부정한 가축의 첫태생
  lexicon: HALOT
  rationale: 정결/부정 범주를 법적·의례적 용어인 ‘부정한’으로 보존하고, בהמה는 문맥상 ‘짐승’으로 옮겼습니다.
