  - severity: medium
    issue: ‘너희의 것’
    rationale: יִהְיֶה לָּךְ의 לְךָ는 단수 ‘네게/네 것’입니다. 문맥상 아론에게 하는 말씀으로, 복수 2인칭으로 바꾸지 않는 것이 좋습니다.
