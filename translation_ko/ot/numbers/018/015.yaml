    rationale: פֶּטֶר רֶחֶם은 사람뿐 아니라 짐승에도 적용되므로 ‘첫 자식’은 범위를 사람에게 좁힐 수 있습니다. ‘첫 새끼 또는 첫 아이’ 혹은 포괄적인 ‘처음 난 것’이 더 정확합니다.
