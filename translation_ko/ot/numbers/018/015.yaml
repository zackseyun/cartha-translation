    rationale: פֶּטֶר רֶחֶם과 בָּאָדָם וּבַבְּהֵמָה의 관계를 ‘태를 여는 모든 것’ 및 ‘사람이든 짐승이든’으로 한 번씩 명료하게 표현해야 합니다.
  - severity: low
