translation:
  language: ko
  text: 이스라엘 안에서 온전히 바쳐진 모든 것은 당신의 것이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 안에서 금령 아래 놓인 모든 것’. ‘온전히 바쳐진 것’(히브리어 헤렘)은 하나님께 돌이킬 수 없도록 바쳐진 것을 가리키며, 어떤 문맥에서는 멸절에 바쳐진 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  english_pob_choice: Every
  chosen_korean: 모든
  alternatives_korean:
  - 각각의
  - 온
  lexicon: HALOT
  rationale: 총칭적 범위를 나타내는 რაოდენ사로, 법규 문맥에서는 ‘모든’이 가장 자연스럽고 원문의 전체성을 잘 드러냅니다.
- source_word: חֵרֶם
  english_pob_choice: devoted thing
  chosen_korean: חֵרֶם
  alternatives_korean:
  - 바친 것
  - 저주 아래 둔 것
  - 멸절된 것
  lexicon: HALOT
  rationale: 이 용어는 제의·법률적으로 기술적 의미가 강하고, 문맥에 따라 ‘바쳐진 것’과 ‘멸절된 것’ 사이의 긴장이 있으므로 본문에서는 음역을 유지해 의미의 폭을 보존합니다.
- source_word: לְךָ
  english_pob_choice: yours
  chosen_korean: 당신의 것
  alternatives_korean:
  - 당신의 몫
  - 당신에게 속합니다
  lexicon: HALOT
  rationale: 소유·배정을 나타내는 대명사 구문이므로, 한국어에서는 소유를 직접 드러내는 ‘당신의 것’이 가장 간결하고 법적 권리의 뉘앙스를 살립니다.
- source_word: יִהְיֶה
  english_pob_choice: shall be
  chosen_korean: 됩니다
  alternatives_korean:
  - 될 것입니다
  - 있습니다
  lexicon: HALOT
  rationale: 예언적 미래라기보다 규정·배정의 진술이므로, 현대 법령체에 가까운 ‘됩니다’가 적합합니다.
theological_decisions:
- issue: חֵרֶם의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 음역 ‘חֵרֶם’을 유지하고 각주로 ‘바쳐진 것/멸절된 것’의 의미 범위를 알립니다.
  alternative_readings:
  - ‘바친 것’으로 풀어쓰기
  - ‘멸절된 것’으로 단정하기
  - ‘금령 아래 둔 것’으로 번역하기
  rationale: 이 절은 제의적 배정과 멸절 가능성을 모두 내포하는 기술어를 쓰므로, 의미를 한쪽으로 좁히지 않고 독자가 문맥적 긴장을 보도록 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
