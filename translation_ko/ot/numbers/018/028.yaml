source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Hebrew expression is literally 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 너희도 이스라엘 자손에게서 받는 모든 십일조[a] 가운데서 야훼께 바칠 몫을 드려야 합니다. 그리고 그 가운데서 야훼께 바칠 몫을 아론 제사장에게 주어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’로 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּרִימוּ / תְּרוּמַת
  english_pob_choice: shall present / contribution
  chosen_korean: 거제물로 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 드려야 합니다
  lexicon: HALOT
  rationale: תְרוּמָה는 ‘들어 올린 뒤 구별하여 바치는’ 제의적 몫을 가리키므로, 한국어에서는 전통적이지만 의미를 비교적 잘 보존하는 ‘거제물’로 옮기고 동사도 제의적 헌납을 드러내는 ‘드리다’로 맞췄습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 표기해 언약명 자체를 보존했습니다.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  english_pob_choice: from all your tithes
  chosen_korean: 너희의 모든 십일조 가운데서
  alternatives_korean:
  - 너희 모든 십일조에서
  - 너희의 모든 십일조 중에서
  lexicon: HALOT
  rationale: מִן + כֹּל의 분배적 의미를 살려 ‘가운데서’로 옮기면 ‘십일조 전체 중에서 일부를 다시 구별하여 드림’이라는 구조가 분명해집니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용 표현을 유지하면서도 한국어에서는 자연스럽고 성경적 어감이 있는 ‘이스라엘 자손’으로 옮겼습니다.
theological_decisions:
- issue: 이중의 거제물 명령 구조
  chosen_reading: 레위인들도 받은 십일조 가운데서 다시 야훼께 드릴 몫이 있다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 십일조를 세금처럼 분배하는 행정 지시로 읽는 방식
  - ‘거제물’과 ‘십일조’를 같은 개념으로 평탄화하는 방식
  rationale: 본문은 이스라엘에게서 받은 십일조 전체를 그대로 소유하는 것이 아니라, 그 가운데서 다시 야훼께 속한 몫을 떼어 아론에게 주게 합니다. 이 제의적 위계와 반환 구조를 유지해야 문맥의 뜻이 살아납니다.
  doctrine_reference: 민수기 18장의 성소-레위인-아론 제사장 질서
- issue: ‘제사장’의 직분 표기
  chosen_reading: ‘아론 제사장’으로 직역적 호칭을 유지했습니다.
  alternative_readings:
  - ‘아론 사제’
  - ‘제사장 아론’
  rationale: 본문은 아론 개인과 직분을 함께 지시하므로, 직분을 일반화하지 않고 ‘아론 제사장’으로 유지하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 민수기 18:1-7의 제사장 직분 규정
