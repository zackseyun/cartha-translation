  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
  footnotes:
  - marker: a
    text: Or “be in the presence of the LORD tomorrow.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “you and they and Aaron,” an explicit listing of the parties to appear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 고라에게 말했습니다. “너와 네 온 회중은 내일 야훼 앞에 있으십시오. 곧 너와 그들과 아론입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내일 야훼 앞에 있으십시오”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “너와 그들과 아론”이라고 당사자들을 명시적으로 나열합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל קֹרַח
  english_pob_choice: to Korah
  chosen_korean: 고라에게
  alternatives_korean:
  - 고라를 향하여
  - 고라에게로
  lexicon: HALOT
  rationale: 대상 지시의 אֶל은 한국어에서 자연스러운 여격 조사로 옮기는 것이 가장 직선적이며, 고유명사도 통용되는 성경식 표기 고라를 따랐습니다.
- source_word: עֲדָתְךָ
  english_pob_choice: your congregation
  chosen_korean: 너의 온 회중
  alternatives_korean:
  - 너의 모든 회중
  - 너의 모임
  - 너의 집회
  lexicon: HALOT
  rationale: עֵדָה는 단순한 모임보다 공동체적 결집을 가리키므로, POB의 congregation을 반영하되 현대 한국어에서는 '회중'에 '온'을 붙여 전체성을 살렸습니다.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  english_pob_choice: be before Yahweh
  chosen_korean: 야훼 앞에 서십시오
  alternatives_korean:
  - 야훼 앞에 있으십시오
  - 야훼 앞에 나타나십시오
  - 야훼 앞에 서게 되십시오
  lexicon: HALOT
  rationale: 히브리어 היה의 명령형은 문자적으로 'be'이지만, 문맥상 출두·대면을 뜻하므로 '서십시오'로 옮겨 출석의 뉘앙스를 살렸습니다.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  english_pob_choice: you and they and Aaron
  chosen_korean: 너와 그들과 아론이 말입니다
  alternatives_korean:
  - 너와 그들과 아론
  - 너와 그들 그리고 아론이 말입니다
  lexicon: HALOT
  rationale: 히브리어의 명시적 열거를 유지하기 위해 '너와 그들과 아론'을 보존했고, 문장 끝의 '말입니다'로 원문의 강조적 나열을 한국어에서 자연스럽게 살렸습니다.
theological_decisions:
