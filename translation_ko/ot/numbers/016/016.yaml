  source_fidelity: 본문은 히브리어의 명령형 ‘있으라/머물라’(הֱיוּ)와 야훼 앞에 나아오는 상황을 충실히 반영해야 합니다. ‘서십시오’도 문맥상 가능한 해석이나, 본문에서는 보다 직접적인 ‘있으십시오’를 택하는 것이 안전합니다. 마지막의 반복 열거는 고라, 그의 무리, 아론을 명시하는 구조이므로 한국어에서도 보충 설명으로 자연스럽게 처리했습니다.
  naturalness: 초안의 ‘너와 그들과 아론이 말입니다’는 한국어로 부자연스럽고, 문장 끝의 ‘이’도 통사적으로 매끄럽지 않습니다. ‘곧 너와 그들과 아론입니다’로 고치면 원문의 명시적 재열거를 유지하면서 자연스럽습니다.
