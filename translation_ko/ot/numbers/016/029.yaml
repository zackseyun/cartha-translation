source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
  footnotes:
  - marker: a
    text: Or 'the visitation of all mankind is visited on them'; the Hebrew repeats the root פקד, which can carry the sense of visitation, appointment, or what befalls someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 이 사람들이 모든 사람처럼 죽고, 모든 사람의 운명이 그들에게 임한다면, 야훼께서 나를 보내지 않으신 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 פקד(파카드) 어근을 반복하여 ‘임하다, 방문하다, 정해진 처분이 내려지다’의 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일에
  lexicon: HALOT
  rationale: 조건절의 시작을 자연스러운 현대 한국어로 옮기되, 모세의 시험 선언이라는 긴장을 살리기 위해 약간 더 단호한 「만일」을 택했습니다.
- source_word: כְּמוֹת כָּל הָאָדָם
  english_pob_choice: die the death of all mankind
  chosen_korean: 모든 사람처럼 죽고
  alternatives_korean:
  - 모든 인류처럼 죽고
  - 사람이 죽는 것처럼 죽고
  - 모든 사람의 죽음을 죽고
  lexicon: HALOT
  rationale: 히브리어의 관용적 강세를 한국어에서 직역투로 과도하게 옮기지 않되, ‘모든 사람’이라는 보편적 인간 운명을 분명히 드러내도록 했습니다.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  english_pob_choice: the fate of all mankind is visited on them
  chosen_korean: 모든 사람의 운명이 그들에게 임한다면
  alternatives_korean:
  - 모든 사람의 방문이 그들에게 임한다면
  - 모든 사람에게 임하는 처분이 그들에게 내려진다면
  - 모든 사람에게 있는 점검이 그들에게 임한다면
  lexicon: HALOT
  rationale: פקד의 반복을 한국어에서 ‘운명’과 ‘임하다’로 옮겨, 단순한 죽음이 아니라 보편적 인간에게 돌아오는 처지를 가리키는 중의성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 신명기적 표준에 따라 고유명사를 제목형 표현으로 바꾸지 않고, 하나님의 언약 სახელ을 그대로 음역한 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: פקד의 의미를 ‘형벌’로 단정할지 여부
  chosen_reading: 보편적 인간에게 임하는 ‘운명’으로 두어, 죽음과 그에 따르는 처지를 함께 포괄했습니다.
  alternative_readings:
  - ‘징벌’로 옮김
  - ‘심판’으로 옮김
  rationale: 본문은 פקד의 반복으로 ‘임함/방문됨’의 연결을 강조하므로, 여기서는 특정한 형벌 해석을 앞서 단정하지 않고 문맥이 허용하는 범위를 유지하는 편이 source-grounded합니다.
  doctrine_reference: 'NUM.16:29 lexical-theological tension: פקד as visitation/appointment/result'
