  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
  footnotes:
  - marker: a
    text: Or “Listen, please, you sons of Levi,” or “Listen now, you Levites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 고라에게 말했습니다. 「이제 들으십시오, 레위의 아들들이여。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “들으십시오, 부탁합니다, 레위의 아들들이여,” 또는 “지금 들으십시오, 레위 사람들아.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 이어서 ... 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우 연속형은 앞선 이야기에서 다음 발화를 진행시키므로, 한국어에서는 ‘그때’로 자연스러운 서사 전개를 살리면서 순서를 드러냈습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들으라
  lexicon: HALOT
  rationale: 복수 명령의 직접적 호소를 살리되, 현대 합쇼체에서 공적인 경고나 촉구에 어울리는 ‘들으십시오’로 옮겼습니다.
- source_word: נָא
  english_pob_choice: now
  chosen_korean: 이제
  alternatives_korean:
  - 부디
  - 청컨대
  lexicon: HALOT
  rationale: נָא의 긴박한 요청/촉구를 반영하여, 지나치게 공손한 ‘부디’보다 상황의 즉시성과 촉구감을 살리는 ‘이제’를 택했습니다.
- source_word: בְּנֵי לֵוִי
  english_pob_choice: you sons of Levi
  chosen_korean: 레위의 아들들이여
  alternatives_korean:
  - 레위 사람들아
  - 레위의 자손들이여
  - 레위의 아들들아
  lexicon: HALOT
  rationale: 히브리어 남성 복수인 ‘sons of Levi’를 성별 중화하지 않고 보존하기 위해 ‘레위의 아들들이여’로 옮겼고, 호격을 문맥에 맞게 반영했습니다.
theological_decisions:
- issue: 직접 호격의 한국어 처리
  chosen_reading: 레위의 아들들이여
  alternative_readings:
  - 레위 사람들아
  - 레위인들이여
  rationale: 본문은 집단을 부르는 직접 호격이므로, 내용상 더 익숙한 ‘레위인들’로 일반화하지 않고 원문의 남성 복수 호격을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
