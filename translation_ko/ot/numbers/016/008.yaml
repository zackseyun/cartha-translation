  source_fidelity: 히브리어 원문은 ‘모세가 고라에게 말했다. “들으십시오, 이제/부디, 레위의 아들들[=레위 자손]아.”’라는 복수 호소입니다. 초안은 발화자·수신자·복수 명령·촉구사 נָא를 대체로 충실히 반영합니다. 다만 בְּנֵי לֵוִי는 이 문맥에서 레위 지파 구성원을 가리키는 계보적 집단 호칭이므로, 한국어 ‘레위의 아들들이여’는 문자적으로는 가능해도 실제 아들들을 뜻하는 표현처럼 들려 자연스럽지 않습니다.
  naturalness: ‘레위 자손들이여’는 현대 표준어의 공적·성서적 문체에서 자연스럽고, 합쇼체 명령 ‘들으십시오’와 잘 어울립니다. 호격을 먼저 두고 명령을 뒤에 두면 한국어 문장 흐름도 좋아집니다. ‘그러자’는 와우 연속형이 이끄는 서사 진행을 자연스럽게 나타냅니다.
  terminology: 모세, 고라, 레위는 통용 표기를 유지했습니다. ‘레위 자손’은 집단의 계보적 호칭을 보존하며, 한국어에 문법적 성별 대립이 없는 상황에서 원문의 지시 대상을 부당하게 변경하지 않습니다. 직역 가능성인 ‘레위의 아들들아’는 각주에 남겨 투명성을 확보합니다.
