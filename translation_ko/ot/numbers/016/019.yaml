  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 고라가 회중 전체를 회막 어귀로 그들에 맞서 모아 놓았고, 야훼의 영광이 회중 전체에게 나타났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 전통적 번역은 이를 ‘주’ 또는 ‘여호와’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיַּקְהֵל
  english_pob_choice: assembled
  chosen_korean: 모아 놓았고
  alternatives_korean:
  - 소집했고
  - 모았고
  - 집결시켰고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 고라가 백성을 직접 모이게 했다는 점을 드러내면서, 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들에 맞서
  alternatives_korean:
  - 그들 앞에
  - 그들을 향해
  - 그들에게 대항하여
  lexicon: HALOT
  rationale: 문맥상 모임은 단순한 집합이 아니라 모세와 아론에 대한 적대적 집결이므로, 대립성을 분명히 하는 표현을 선택했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 오경에서 확립된 성막 명칭을 한국어 성경 용례에 맞게 ‘회막’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 신명기적 고유명사 ‘야훼’를 유지하여 히브리어 원문이 가진 인칭성과 언약 명칭을 살렸습니다.
- source_word: כְבוֹד
  english_pob_choice: the glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 임재의 영광
  lexicon: HALOT
  rationale: 가시적·무게감 있는 하나님의 현현을 가리키므로, 설명을 덧붙이지 않고도 원문의 핵심 이미지를 살리는 ‘영광’을 사용했습니다.
theological_decisions:
- issue: 야훼의 영광이 나타난다는 표현의 현현성
  chosen_reading: 하나님의 임재가 가시적으로 드러난 현현으로 읽었습니다.
  alternative_readings:
  - 단순한 상징적 영광
  - 시적 과장
  rationale: 본문의 와예라‘appeared’는 실제적인 나타남을 가리키므로, 추상화하지 않고 현현으로 이해하는 것이 원문에 가깝습니다.
  doctrine_reference: Numbers 16:19의 신현(theophany) 묘사
