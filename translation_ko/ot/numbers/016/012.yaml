id: NUM.16.12
reference: Numbers 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
  footnotes:
  - marker: a
    text: Or “We will not go up.” The Hebrew verb literally means “go up/ascend,” and may refer to going up to Moses' location or appearing before him when summoned.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 엘리압의 아들 다단과 아비람을 불러오게 했습니다. 그러나 그들은 “우리는 올라가지 않겠습니다”라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 올라오지 않겠습니다.” 히브리어 동사는 문자적으로 “올라가다/오르다”를 뜻하며, 모세가 있는 곳으로 올라가는 것 또는 부름을 받아 그 앞에 나아가는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח / לִקְרֹא
  english_pob_choice: sent to summon
  chosen_korean: 불러오게 했습니다
  alternatives_korean:
  - 소집했습니다
  - 부르러 보냈습니다
  - 불러 오게 했습니다
  lexicon: HALOT
  rationale: שלח과 קרא의 결합은 단순한 ‘보냄’보다 공식적인 호출·소환의 뜻이므로, 한국어로는 자연스럽게 ‘불러오게 했다’로 옮겨 모세의 공식적 요구를 드러냈습니다.
- source_word: דָתָן וְלַאֲבִירָם
  english_pob_choice: Dathan and Abiram
  chosen_korean: 다단과 아비람
  alternatives_korean:
  - 닷단과 아비람
  - 다단과 아비람
  lexicon: 고유명사 관례
  rationale: 인명은 현대 한국어 성경 관례에 따라 음역했고, 통용성이 높은 형태를 유지했습니다.
- source_word: בְּנֵי אֱלִיאָב
  english_pob_choice: the sons of Eliab
  chosen_korean: 엘리압의 아들
  alternatives_korean:
  - 엘리압의 아들들
  - 엘리압의 자손
  lexicon: HALOT
  rationale: 직계 관계를 나타내는 בן의 복수 표현이므로, 두 사람을 지칭하는 식별 정보로서 ‘엘리압의 아들’이 가장 간결하고 자연스럽습니다.
- source_word: לֹא נַעֲלֶה
  english_pob_choice: We will not come up
  chosen_korean: 우리는 올라가지 않겠습니다
  alternatives_korean:
  - 우리는 올라오지 않겠습니다
  - 우리는 가지 않겠습니다
  - 우리는 올라가지 않을 것입니다
  lexicon: HALOT
  rationale: עלה의 문자적 ‘올라가다’ 의미를 살리되, 거절의 뉘앙스를 분명히 하기 위해 미래형 거절 표현으로 옮겼습니다.
theological_decisions:
- issue: 모세의 공식 소환에 대한 공적인 거절의 뉘앙스
  chosen_reading: ‘불러오게 했습니다’와 ‘올라가지 않겠습니다’로, 명령에 대한 노골적 불복종과 대립을 그대로 드러냈습니다.
  alternative_readings:
  - ‘보냈습니다’와 ‘오지 않겠습니다’
  - ‘소환했습니다’와 ‘오르지 않겠습니다’
  rationale: 본문은 단순한 이동이 아니라 권위 있는 소환과 그에 대한 공개적 거절을 보여 주므로, 한국어에서도 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 민수기 16장의 반역 서사 및 모세의 지도권
- issue: ‘올라가다’의 방향성 보존
  chosen_reading: ‘올라가지 않겠습니다’로 번역해 히브리어 עלה의 위쪽 방향/출두 의미를 보존했습니다.
  alternative_readings:
  - ‘가지 않겠습니다’
  - ‘나아가지 않겠습니다’
  rationale: POB의 주석처럼 이 동사는 모세에게 나아가 소환에 응하는 행위를 포함할 수 있으므로, ‘올라가다’를 유지해 원문의 공간적·서사적 뉘앙스를 살렸습니다.
  doctrine_reference: 원문 어휘의 방향성 보존
