  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
  footnotes:
  - marker: a
    text: Or 'censer' for 'firepan.' The Hebrew term refers to a vessel for carrying burning coals used in offering incense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 각 사람은 자기 향로[a]를 가져다가 그 안에 불을 담고 그 위에 향을 놓았습니다. 그리고 그들은 모세와 아론과 함께 회막 입구에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향로’로 옮긴 히브리어 מַחְתָּה는 숯불을 담아 나르고 그 위에 향을 피우는 제사용 용기를 가리킵니다. ‘불그릇’ 또는 ‘향로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  english_pob_choice: each man took his firepan
  chosen_korean: 각 사람은 자기 불판을 가져다가
  alternatives_korean:
  - 각 사람이 자기 향로를 가져다가
  - 각 사람이 자기 제사용 그릇을 가져다가
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 살려 ‘각 사람’으로 옮기고, מַחְתָּה는 예배용으로 숯을 나르는 용기라는 점을 반영해 ‘불판’으로 렌더링했습니다. 전통적 ‘향로’도 가능하지만, 본문은 향 자체보다 불과 향을 담는 용기를 먼저 말하므로 도구의 기능이 드러나게 했습니다.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  english_pob_choice: they put fire in them
  chosen_korean: 그 위에 불을 담고
  alternatives_korean:
  - 그 안에 불을 넣고
  - 그 위에 불을 올리고
  lexicon: HALOT
  rationale: 히브리어 전치사는 문자적으로 ‘그들 위에’이지만, 용기에 숯불을 담는 행위이므로 한국어에서는 ‘담고’가 자연스럽고 구체적입니다.
- source_word: וַיָּשִׂימוּ עֲלֵי/הֶם קְטֹרֶת
  english_pob_choice: put incense on them
  chosen_korean: 그 위에 향을 놓았습니다
  alternatives_korean:
  - 그 위에 향을 두었습니다
  - 그 위에 향을 얹었습니다
  lexicon: HALOT
  rationale: 향은 타는 숯 위에 놓이는 대상이므로 ‘놓았습니다’가 의식적 동작을 잘 드러냅니다. 영어 POB의 반복 동사 선택을 따라, 지나치게 장식적 표현은 피했습니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 회막 입구
  alternatives_korean:
  - 회막의 입구
  - 증거의 장막 입구
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 관용적으로 ‘회막’이 정착되어 있으므로 이를 유지했고, פֶּתַח은 간결하게 ‘입구’로 옮겼습니다.
theological_decisions:
- issue: 모세와 아론의 동반 표기
  chosen_reading: 모세와 아론도 함께 있었습니다
  alternative_readings:
  - 모세와 아론과 함께 있었습니다
  - 모세와 아론 곁에 있었습니다
  rationale: 본문의 문장 끝 추가는 두 사람이 해당 장소에 함께 서 있었음을 보충 설명하는 성격이므로, 한국어에서는 ‘도 함께 있었습니다’로 자연스럽게 관계를 드러냈습니다.
  doctrine_reference: 서사적 문맥 보존
- issue: 회막 입구에서의 정황 묘사
  chosen_reading: 그들은 회막 입구에 섰는데
  alternative_readings:
  - 그들은 회막 입구에 서 있었는데
  - 그들은 회막 입구에 섰습니다
  rationale: 히브리어 연속 동작의 서술 흐름을 살리기 위해 ‘섰는데’로 다음 보충 정보와 연결했습니다.
  doctrine_reference: 서사적 연결성
