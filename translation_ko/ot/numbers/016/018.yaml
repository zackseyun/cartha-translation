  source_fidelity: 히브리어는 각 사람이 자기 מַחְתָּה를 취하여 그 용기에 불을 놓고 그 위에 향을 놓은 뒤, 모세와 아론과 함께 회막 입구에 선 것으로 서술합니다. 초안의 ‘그 위에 불을 담고’는 용기의 ‘위’에 불을 ‘담는다’는 표현이 공간적으로 부정확합니다. 또한 מַחְתָּה를 ‘불판’으로 옮기면 현대 한국어에서 조리용 판을 먼저 연상시켜 제의 용기의 뜻을 충분히 전달하지 못합니다.
  naturalness: ‘향로’를 쓰고 불은 ‘그 안에’, 향은 ‘그 위에’ 놓는 것으로 구분하면 자연스럽고 의식 용기의 기능도 명료해집니다. 마지막 절은 ‘모세와 아론과 함께’로 직접 연결하는 편이 원문의 동반 관계와 한국어 문장 흐름을 모두 잘 살립니다.
  terminology: ‘향로’는 한국어 성경 전통과 현대 독자 모두에게 이해되는 제의 용기 명칭입니다. 다만 מַחְתָּה가 숯불을 담아 나르는 용기라는 점은 각주에서 밝혀, ‘향로’가 가능한 번역임을 보완합니다. ‘회막’과 ‘향’은 적절합니다.
