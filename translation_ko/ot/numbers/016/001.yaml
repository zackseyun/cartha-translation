translation:
  language: ko
  text: 그때 코라, 이스할의 아들이요 고핫의 손자요 레위의 증손인 사람과, 엘리압의 아들들이며 다단과 아비람과, 르우벤의 아들인 온이 함께 사람들을 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리고 그가 취했다’입니다. 목적어가 생략되어 있으며, 문맥상 다음 절의 사람들을 가리키므로 한국어에서는 ‘사람들’을 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took men
  chosen_korean: 사람들을 데려갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 데려왔습니다
  - 사람들을 끌어들였습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그리고 그가 취했다’지만 목적어가 생략되어 있습니다. 문맥상 다음 절의 무리와 연결되므로, 영어 POB처럼 한국어에서도 ‘사람들’을 보충해 의미를 분명히 하되, 반란의 주도·모집 느낌을 살려 ‘데려갔습니다’로 옮겼습니다.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  english_pob_choice: son of Izhar, son of Kohath, son of Levi
  chosen_korean: 이스할의 아들이요 고핫의 손자요 레위의 증손
  alternatives_korean:
