translation:
  language: ko
  text: 이스할의 아들이며 고핫의 아들이고 레위의 아들인 고라가, 엘리압의 아들들인 다단과 아비람 및 벨렛의 아들인 온, 곧 르우벤의 아들들과 함께 사람들을 데리고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리고 그가 취했다’입니다. 목적어가 생략되어 있으며, 문맥상 다음 절에 나오는 사람들을 가리키는 것으로 보입니다. 한국어에서는 이를 ‘사람들’로 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took men
  chosen_korean: 사람들을 데려갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 데려왔습니다
  - 사람들을 끌어들였습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그리고 그가 취했다’지만 목적어가 생략되어 있습니다. 문맥상 다음 절의 무리와 연결되므로, 영어 POB처럼 한국어에서도 ‘사람들’을 보충해 의미를 분명히 하되, 반란의 주도·모집 느낌을 살려 ‘데려갔습니다’로 옮겼습니다.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  english_pob_choice: son of Izhar, son of Kohath, son of Levi
  chosen_korean: 이스할의 아들이요 고핫의 손자요 레위의 증손
  alternatives_korean:
  - 이스할의 아들이요 고핫의 아들이요 레위의 아들
  - 이스할의 자손, 고핫의 자손, 레위의 자손
  lexicon: HALOT
  rationale: 반복되는 ‘아들’ 구조를 한국어에서 그대로 유지하면 어색해질 수 있어, 계보의 종속 관계는 보존하되 한국어 친족 표현으로 자연스럽게 ‘손자/증손’을 사용했습니다. 다만 문맥의 족보적 강조는 유지했습니다.
- source_word: וְדָתָן וַאֲבִירָם ... וְאוֹן בֶּן פֶּלֶת
  english_pob_choice: along with Dathan and Abiram ... and On son of Peleth
  chosen_korean: 엘리압의 아들들이며 다단과 아비람과, 르우벤의 아들인 온
  alternatives_korean:
  - 다단과 아비람과 온과 함께
  - 다단과 아비람과 온
  lexicon: HALOT
  rationale: 히브리어는 이 세 인물을 코라와 병렬로 묶어 소개합니다. 한국어에서는 관계를 분명히 하려고 ‘엘리압의 아들들이며’와 ‘르우벤의 아들인’을 덧붙여 족보적 연결을 드러냈습니다.
- source_word: בְּנֵי רְאוּבֵן
  english_pob_choice: sons of Reuben
  chosen_korean: 르우벤의 아들
  alternatives_korean:
  - 르우벤 사람들
  - 르우벤 지파의 사람
  lexicon: HALOT
  rationale: 원문은 ‘르우벤의 아들들’의 계보 표현입니다. 지파명으로 풀지 않고 직접적인 족보 표현을 유지했습니다.
theological_decisions:
- issue: 개방된 목적어의 보충
  chosen_reading: 문맥상 필요한 목적어를 ‘사람들’로 보충해, 반란의 주동을 드러내되 원문 동사를 과도하게 해석하지 않았습니다.
  alternative_readings:
  - ‘그가 취했다’처럼 목적어를 비워 두는 번역
  - ‘반란을 일으켰습니다’처럼 사건을 완전히 해석하는 번역
  rationale: 이 절의 미완결성은 바로 다음 절의 집단 언급으로 설명됩니다. 따라서 해석을 과하게 밀어붙이지 않으면서도 한국어 문장으로는 읽히도록 처리했습니다.
  doctrine_reference: Translation philosophy §1, §5
