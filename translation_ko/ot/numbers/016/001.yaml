base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Now Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
  footnotes:
  - marker: a
    text: 'Hebrew: ''and he took.'' The object is unstated in the Hebrew; ''men'' is supplied from the context of the next verse for clarity.'
