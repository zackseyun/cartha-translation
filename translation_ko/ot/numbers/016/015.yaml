  source_fidelity: ‘그들의 예물에 눈을 돌리지 마십시오’는 한국어에서 시선을 다른 곳으로 돌린다는 뜻으로도 쉽게 읽혀, 히브리어 פנה אל의 ‘호의롭게 돌아보다/유의하다’라는 문맥상 의미를 충분히 전달하지 못합니다. 또한 נָשָׂאתִי는 여기서 ‘가져가다/취하다’이지 ‘빼앗다’라고 단정할 근거는 부족합니다.
  naturalness: ‘야훼께 아뢰었습니다’와 ‘그들의 예물을 돌아보지 마십시오’가 현대 표준어 합쇼체에서 자연스럽고, 하나님께 드리는 모세의 요청에도 적절합니다. ‘그들에게서’는 ‘그들 가운데서’보다 출처를 나타내는 히브리어 מֵהֶם에 더 잘 맞습니다.
  terminology: 야훼, 예물, 나귀는 적절합니다. מִנְחָה를 ‘소제물’로 한정하지 않은 점도 타당합니다. ‘해를 끼치지 않았습니다’는 הֲרֵעֹתִי를 충실하게 옮깁니다.
