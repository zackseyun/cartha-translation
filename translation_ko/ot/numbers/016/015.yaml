  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
  footnotes:
  - marker: a
    text: Or 'Do not regard their offering' or 'Do not accept their offering.' The Hebrew literally says, 'Do not turn toward their offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세는 몹시 분노하여 야훼께 아뢰었습니다. “그들의 예물을 돌아보지 마십시오.”[a] “저는 그들에게서 나귀 한 마리도 가져가지 않았고, 그들 중 누구에게도 해를 끼치지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 예물을 향하여 돌이키지 마십시오’라고 합니다. 문맥상 그들의 예물을 돌아보거나 받아들이지 말라는 뜻일 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  english_pob_choice: Then Moses became very angry
  chosen_korean: 모세는 매우 격분하여
  alternatives_korean:
  - 모세는 매우 화가 나서
  - 모세는 크게 분노하여
  lexicon: HALOT
  rationale: 히브리어 관용구 חרה לְ는 감정이 치밀어 오르는 분노를 뜻하므로, ‘격분하다’가 강한 분노의 정도를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 번역 전통적 대체어가 아니라 고유명사로 처리해, POB의 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  english_pob_choice: Do not turn toward their offering
  chosen_korean: 그들의 예물에 눈을 돌리지 마십시오
  alternatives_korean:
  - 그들의 예물을 돌아보지 마십시오
  - 그들의 예물을 받아 주지 마십시오
  lexicon: HALOT
  rationale: פנה אֶל의 직유적 의미인 ‘~쪽으로 돌리다/향하다’를 살리되, 한국어로는 ‘눈을 돌리다’가 자연스럽고 원문의 비유를 비교적 가깝게 보존합니다.
- source_word: מִנְחָתָם
  english_pob_choice: their offering
  chosen_korean: 그들의 예물
  alternatives_korean:
  - 그들의 제물
  - 그들의 소제물
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 제의적 ‘예물/제물’을 가리키지만, 이 구절만으로 ‘소제물’로 한정할 필요는 없어 더 넓은 ‘예물’을 택했습니다.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  english_pob_choice: I have not taken a single donkey from them
  chosen_korean: 나는 그들 가운데서 나귀 한 마리도 빼앗지 않았고
  alternatives_korean:
  - 나는 그들 가운데서 나귀 한 마리도 취하지 않았고
  - 나는 그들 가운데서 나귀 한 마리도 가져가지 않았고
  lexicon: HALOT
  rationale: נָשָׂאתִי는 단순히 ‘가지다’보다 빼앗아 취득한 뉘앙스를 띨 수 있어, 모세의 무고함과 착취 부인을 더 분명히 드러내는 ‘빼앗지 않았다’를 택했습니다.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  english_pob_choice: nor have I harmed any one of them
  chosen_korean: 그들 가운데 아무에게도 해를 끼치지 않았습니다
  alternatives_korean:
  - 그들 가운데 아무에게도 악을 행하지 않았습니다
  - 그들 가운데 아무에게도 잘못하지 않았습니다
  lexicon: HALOT
  rationale: הֵרֵעַ는 단순한 기분 상함보다 실제적 해악이나 부당한 처사를 뜻하므로, ‘해를 끼치다’가 간결하면서도 뜻을 정확히 살립니다.
theological_decisions:
