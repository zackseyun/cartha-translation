id: NUM.16.5
reference: Numbers 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
  footnotes:
  - marker: a
    text: Or, 'the LORD will know who is his'; the Hebrew verb can be rendered more literally as 'know,' but here it likely carries the sense of making known or publicly showing.
    reason: lexical_alternative
  - marker: b
    text: '''Bring near'' is priestly/cultic language, referring to authorized approach into the LORD''s presence for sacred service.'
    reason: cultural_note
translation:
  language: ko
  text: 모세가 고라와 그 모든 회중에게 말하여 이르되 아침에 여호와께서 자기에게 속한 자와 거룩한 자를 나타내시리니 그가 그에게로 가까이 오게 하실 것이요 그가 택하신 자를 그에게로 가까이 오게 하실 것이니라[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '나타내시리니'는 '알다'의 사동사 형태로, 하나님께서 공개적으로 확인하시거나 선택을 드러내심을 의미합니다.
    source: WLC H3045
  - marker: b
    text: '''가까이 오게 하다''는 제사적 용어로, 하나님께 가까이 나아가 신성한 봉사를 감당할 권한을 얻는 것을 의미합니다.'
    source: Cultural Context
lexical_decisions:
- source_word: יְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말하여
  alternatives_korean: 말씀하시다, 말씀하사
  lexicon: H1696
  rationale: 중립적 서술을 위해 '말하다'의 어미를 사용하되, 문맥상 명령적 어조가 아닌 사실적 서술임을 반영함.
- source_word: יֹדַע
  english_pob_choice: make known
  chosen_korean: 나타내시리니
  alternatives_korean: 아시리니, 알리시리니
  lexicon: H3045
  rationale: 단순한 인지 (알다) 가 아니라 공개적 확인 (알리다/나타내다) 의 의미를 강조하여 '나타내시리니'로 번역.
- source_word: הַקָּדוֹשׁ
  english_pob_choice: holy
  chosen_korean: 거룩한 자
  alternatives_korean: 거룩한 것, 성자
  lexicon: H6918
  rationale: 명사적 용법으로 '거룩한 자'를 지칭하는 인칭 대명사적 해석을 적용하여 명확성 확보.
- source_word: הִקְרִיב
  english_pob_choice: bring near
  chosen_korean: 가까이 오게 하실 것이요
  alternatives_korean: 드리시리니, 가까이 하리니
  lexicon: H7126
  rationale: 제사적 용어이지만 문맥상 '하나님 앞에 서게 함'의 의미를 담아 '가까이 오게 하다'로 풀어냄.
theological_decisions:
- decision: Divine Agency in Selection
  rationale: 여호와께서 직접 선택하고 확인하는 주권적 행위를 강조하기 위해 주어를 명확히 하고 시제를 미래적 확신으로 번역.
- decision: Priestly Access
  rationale: '''가까이 오게 하다''를 통해 제사장적 접근 권한이 하나님께 의해 부여됨을 시사함.'
