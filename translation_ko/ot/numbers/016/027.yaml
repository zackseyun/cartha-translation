  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
  footnotes:
  - marker: a
    text: Or 'went up from around the dwelling of Korah, Dathan, and Abiram.' The Hebrew verb is literally 'went up,' but here likely functions idiomatically for withdrawing from the area.
    reason: lexical_alternative
  - marker: b
    text: '''Dwelling'' renders Hebrew mishkan here as the residence/place of encampment associated with Korah, Dathan, and Abiram, not the tabernacle of the LORD.'
    reason: cultural_note
translation:
  language: ko
  text: 그래서 그들은 고라, 다단, 아비람의 거처 주변에서 물러났습니다. 다단과 아비람은 자기들의 아내들과 아들들, 그리고 어린 자녀들과 함께 자기들의 천막 입구에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 '올라가다'이지만, 여기서는 주변에서 물러나거나 떠나는 관용적 의미로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: '''거처''는 여기서 고라, 다단, 아비람과 관련된 야영/주거 장소를 가리키며, 야훼의 성막을 뜻하지 않습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל
  english_pob_choice: moved away from around
  chosen_korean: 거처 주변에서 물러났습니다
  alternatives_korean:
  - 떠났습니다
  - 올라갔습니다
  - 주변에서 물러섰습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 '올라가다'이지만, כאן에서는 주변에서 떨어져 나오는 이동을 가리키는 관용적 용법이므로 한국어도 공간적 이탈을 자연스럽게 드러내는 '물러났습니다'로 옮겼습니다.
- source_word: מִשְׁכַּן
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 장막
  - 주거지
  - dwelling
  lexicon: HALOT
  rationale: 이 말은 여기서 야훼의 성막이 아니라 고라 일행의 거주/야영 장소를 가리키므로, 교회적 용례가 강한 '성막'을 피하고 중립적인 '거처'로 처리했습니다.
- source_word: נִצָּבִים
  english_pob_choice: standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 자리를 지키고 서 있었습니다
  - 버티고 서 있었습니다
  lexicon: HALOT
  rationale: 분사형은 문 앞의 자세를 묘사하므로 기본 의미인 '서 있다'를 살렸습니다. 문맥상 도전적 태도가 암시될 수 있으나, 단어 자체에 그 뉘앙스를 과도하게 넣지는 않았습니다.
- source_word: וּבְנֵיהֶם
  english_pob_choice: their sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아들들아
  lexicon: HALOT
  rationale: 히브리어 בנים은 다음의 '어린 자녀들'과 구별되므로, 보다 넓은 '자녀들'이 아니라 성별이 명시된 '아들들'을 유지했습니다.
- source_word: וְטַפָּם
  english_pob_choice: their little children
  chosen_korean: 어린 자녀들
  alternatives_korean:
  - 어린아이들
  - 작은 자녀들
  - 의존자들
  lexicon: HALOT
  rationale: טַף는 어린 자녀/동반 가족을 가리키는 말이어서, 장면의 연약함을 드러내는 '어린 자녀들'이 가장 자연스럽고 구체적입니다.
theological_decisions:
- issue: 공동체와 분리된 반역자들의 장면 묘사
  chosen_reading: '''물러났습니다''로 옮겨, 단순한 위치 이동이 아니라 심판 직전의 분리 행위를 드러냈습니다.'
  alternative_readings:
  - '''떠났습니다''로 중립화'
  - '''물러섰습니다''로 완곡화'
  rationale: 본문의 서술은 반역자들의 거처에서 벗어나는 행위를 강조하며, 뒤이어 그들이 문 앞에 서 있는 장면과 대비됩니다. 과도한 해석 없이 긴박한 분리의 흐름을 살리는 것이 적절합니다.
  doctrine_reference: 민수기 16장의 반역과 심판 서술
