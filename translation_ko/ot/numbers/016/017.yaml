  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH.'' Traditionally rendered ''the LORD''; alternatives include ''Yahweh'' and ''Jehovah.'''
    reason: alternative_reading
  - marker: b
    text: Or 'censer(s)' for 'firepan(s),' the vessel used for burning incense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각 사람은 자기 불판을 가져다가 그 위에 향을 놓고, 야훼 앞에 각 사람의 불판을 가져오십시오—불판이 이백오십 개입니다—그리고 당신과 아론도 각자 자기 불판을 가져오십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불판’은 여기서 향을 피우는 제의용 그릇을 가리킵니다. 전통적 번역어 ‘향로’도 가능하지만, 본문 기능을 더 직접적으로 드러내기 위해 이렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתָּת / מַחְתֹּת
  english_pob_choice: firepan / firepans
  chosen_korean: 불판
  alternatives_korean:
  - 향로
  - 향을 피우는 그릇
  lexicon: HALOT
  rationale: 제사 용기를 가리키지만, 현대 한국어에서 바로 이해되는 일반 명사로 옮겨야 하므로 ‘불판’을 택했습니다. ‘향로’는 교회적 전통어로는 익숙하지만, 원문의 기구 기능을 다소 가립니다.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  english_pob_choice: and put incense on them
  chosen_korean: 그 위에 향을 놓고
  alternatives_korean:
  - 그 안에 향을 넣고
  - 그 위에 향을 두고
  lexicon: HALOT
  rationale: 히브리어 전치사 עַל의 기본 감각을 살려 ‘그 위에’로 옮겼습니다. 향을 불판 위의 숯 위에 두는 제의적 동작을 자연스럽게 드러냅니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 주님 앞에
  - 여호와 앞에
  lexicon: HALOT
  rationale: 본문의 신명기적 표기 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘앞에’는 히브리어 관용구를 가장 직접적으로 반영합니다.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  english_pob_choice: two hundred and fifty
  chosen_korean: 이백오십
  alternatives_korean:
  - 두백오십
  - '250'
  lexicon: HALOT
  rationale: 본문의 수량 표시는 서술 흐름 속에서 간결하게 제시하는 것이 자연스러워 한글 수사로 붙여 적었습니다.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  english_pob_choice: and you and Aaron, each his firepan
  chosen_korean: 그리고 당신과 아론도 각자 자기 불판을 가져오십시오
  alternatives_korean:
  - 그리고 당신과 아론도 각자 불판을 가져오십시오
  - 그리고 당신과 아론도 각자 자기 불판을 드리십시오
  lexicon: HALOT
  rationale: 마지막 절은 생략된 명령형을 한국어에서 풀어 주어야 하므로 ‘가져오십시오’로 자연화했습니다. ‘각자 자기’는 히브리어의 분배적 단수 표현을 살립니다.
theological_decisions:
- issue: 여호와 대신 יְהוָה를 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신적 호칭이 아니라 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 대체 호칭 ‘주’를 쓰지 않고 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
