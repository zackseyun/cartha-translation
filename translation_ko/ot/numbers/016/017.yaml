  source_fidelity: 히브리어 מַחְתָּה는 향을 태우는 데 쓰는 제의용 화로/향로를 가리킵니다. ‘불판’은 현대 한국어에서 조리용 판을 우선 뜻하므로 기물의 성격을 잘못 전달합니다. 또한 ‘불판이 이백오십 개입니다’는 원문의 동격적 수량 구문을 다소 어색하게 처리합니다.
  naturalness: 합쇼체 명령문 자체는 대체로 적절하나, ‘야훼 앞에 각 사람의 불판을’은 ‘각 사람’과 ‘자기’의 분배 관계를 약화시키고 자연스럽지 않습니다. ‘각자 자기 향로를’로 일관되게 표현하는 편이 명료합니다.
  terminology: יַהְוֶה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. מַחְתָּה는 이 문맥에서 ‘향로’가 자연스럽고 정확합니다. 이는 특정 교파의 해석을 더하지 않으며, 향을 피우는 제의 기물이라는 문맥상 의미를 보존합니다.
