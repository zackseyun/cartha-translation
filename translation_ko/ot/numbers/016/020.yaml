  rationale: 서술 진행을 보이는 דבר의 서두 공식을 자연스러운 현대 문체로 옮기되, 단순한 ‘말하다’보다 격식 있는 성경체 ‘말씀하여 이르다’를 써서 내러티브 공식성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 번역어 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨 언약 სახელ을 보존했습니다.
- source_word: וְאֶל אַהֲרֹן
  english_pob_choice: and to Aaron
  chosen_korean: 모세와 아론에게
  alternatives_korean:
  - 모세에게 그리고 아론에게
  - 모세와 아론을 향하여
  lexicon: HALOT
  rationale: 히브리어의 이중 목적어 표지를 한국어에서는 자연스럽게 ‘~에게’로 통합하되, 두 수신자를 모두 명시하여 동등한 수신 대상을 유지했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 표기
  chosen_reading: 본문의 언약적 하나님의 이름을 ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 구절은 제목어가 아니라 신명사 자체를 사용하므로, 전통적 대체어보다 고유명사를 드러내는 번역이 원문과 주해 정보를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
