base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
  footnotes:
  - marker: a
    text: Or, “It is too much for you, sons of Levi!”
    reason: lexical_alternative
translation:
  language: ko
  text: 내일 야훼 앞에서 그 안에 불을 넣고 그 위에 향을 얹으십시오. 그러면 야훼께서 택하실 사람, 그 사람이 바로 거룩한 사람입니다. 레위 자손들아, 너희는 너무 지나쳤습니다![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “레위 자손들아, 너희에게는 너무 과하다!”
    reason: רַב לָכֶם의 직역에 가까운 대안적 이해를 제시하며, 문맥상 책망으로 해석한 본문 번역과의 긴장을 보존합니다.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  english_pob_choice: and put fire in them
  chosen_korean: 그 안에 불을 넣고
  alternatives_korean:
  - 그 안에 불을 두고
  - 그 안에 불을 담고
  lexicon: HALOT
  rationale: 불을 ‘넣다’로 옮기면 향을 피우기 위한 제의적 동작을 자연스럽게 드러내면서도, 내용상 불필요한 해석을 덧붙이지 않습니다.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  english_pob_choice: and place incense on them
  chosen_korean: 그 위에 향을 얹어
  alternatives_korean:
  - 그 위에 향을 두고
  - 그 위에 향을 놓아
  lexicon: HALOT
  rationale: עַל의 방향성과 제의 행위를 살려 ‘위에 향을 얹다’로 옮겼고, 현대 한국어에서 자연스럽게 제물 준비의 흐름을 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문이 지닌 언약 이름의 직접성을 보존했습니다.
- source_word: רַב לָכֶם
  english_pob_choice: You have gone too far
  chosen_korean: 너희는 너무 지나쳤습니다
  alternatives_korean:
  - 너희에게는 너무 많습니다
  - 이제 충분합니다
  lexicon: HALOT
  rationale: 직역하면 ‘너희에게는 많다’이지만, 문맥상 모세의 책망은 경계를 넘었다는 의미이므로 한국어로는 ‘너무 지나쳤습니다’가 그 날카로운 뉘앙스를 가장 잘 살립니다.
theological_decisions:
- issue: 야훼 앞에서의 제의적 시험과 선택의 의미
  chosen_reading: 야훼께서 택하시는 사람—그가 거룩한 사람입니다.
  alternative_readings:
  - 야훼께서 선택하시는 사람—그가 거룩합니다.
  - 야훼께서 고르시는 사람—그가 거룩한 사람입니다.
  rationale: הקדוש를 단순한 성품 묘사로만 약화하지 않고, 본문이 요구하는 ‘하나님이 승인하신 자’라는 판정적 의미를 살리기 위해 ‘거룩한 사람’으로 유지했습니다.
  doctrine_reference: Numbers 16:7 context; priestly legitimacy is determined by Yahweh's choice, not human claim
