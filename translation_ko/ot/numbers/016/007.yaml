revisions:
- from: 그리고 그 안에 불을 넣고, 그 위에 향을 얹어 내일 야훼 앞에 두십시오. 그러면 야훼께서 택하시는 사람—그가 거룩한 사람입니다. 너희 레위 자손은 너무 지나쳤습니다![a]
  to: 내일 야훼 앞에서 그 안에 불을 넣고 그 위에 향을 얹으십시오. 그러면 야훼께서 택하실 사람, 그 사람이 바로 거룩한 사람입니다. 레위 자손들아, 너희는 너무 지나쳤습니다![a]
  rationale: 제의 행위의 장소와 시간 관계를 한국어에서 명료하게 하고, 야훼의 미래의 선택이라는 문맥을 반영했습니다. 또한 ‘그 사람이 바로’로 원문의 강조를 살렸으며, 잘못된 대안 각주를 원문의 가능한 어휘적 의미에 맞게 수정했습니다.
