  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: ko
  text: 회중에게 말하여 이르라. ‘고라와 다단과 아비람의 거처 주변에서 올라가십시오.’
  philosophy: formal
lexical_decisions:
- source_word: הָעֵדָה
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 공동체
  - 회합
  lexicon: עֵדָה
  rationale: 출애굽·광야 문맥의 집합된 공동체를 가리키므로, 제도적 뉘앙스보다 직접적인 집합체 의미를 살려 ‘회중’으로 옮겼습니다.
- source_word: הֵעָלוּ
  english_pob_choice: Go up
  chosen_korean: 올라가십시오
  alternatives_korean:
  - 물러가십시오
  - 떠나십시오
  - 가십시오
  lexicon: עלה
  rationale: 동사 עלה의 핵심 의미는 ‘올라가다’이며, 영어 POB의 ‘Go up’을 따라 지리적/공간적 이동의 이미지를 보존했습니다.
- source_word: מִסָּבִיב
  english_pob_choice: from around
  chosen_korean: 주변에서
  alternatives_korean:
  - 둘레에서
  - 주위에서
  - 둘러싼 곳에서
  lexicon: סביב
  rationale: 접두사 מִן과 결합한 둘레·주변의 의미를 자연스러운 한국어로 압축해 전달했습니다.
- source_word: מִשְׁכַּן
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 장막
  - 거주처
  - 거주지
  lexicon: משכן
  rationale: 여기서는 성막 용어보다 ‘거처’가 더 직접적으로 문맥의 ‘머무는 장소’를 드러내므로, 영어 POB의 일반적 표현과 맞춰 옮겼습니다.
theological_decisions:
- issue: 명령형의 공손한 전달
  chosen_reading: 직접 인용 안에서는 ‘올라가십시오’로 현대 공손체를 유지했습니다.
  alternative_readings:
  - 올라가라
  - 올라가시오
  rationale: 본문은 회중에게 주어지는 명령이므로 명령성을 약화하지 않으면서도 합쇼체를 유지하는 것이 한국어 문체에 가장 적절합니다.
  doctrine_reference: 서술체와 직접화법의 문체 일관성
