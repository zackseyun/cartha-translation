base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
  footnotes:
  - marker: a
    text: Or 'the God of the breath of all flesh,' emphasizing God as the giver of life to every living being.
    reason: lexical_alternative
  - marker: b
    text: '''One man'' may function representatively: the plea is that the sin of an individual should not bring wrath on the entire congregation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 얼굴을 땅에 대고 엎드려서 말했습니다. 「하나님, 모든 육체의 영들의 하나님이시여, 한 사람이 죄를 지었다고 해서 온 회중에게 진노하시겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 육체의 숨의 하나님’이라는 뜻으로도 옮길 수 있으며, 모든 살아 있는 존재에게 생명을 주시는 하나님을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한 사람’은 대표적 의미로 기능할 수 있으며, 한 개인의 죄가 온 회중 전체에 진노를 불러와서는 안 된다는 청원일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  english_pob_choice: they fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드려서
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드렸습니다
  - 엎드려 얼굴을 땅에 댔습니다
  - 얼굴을 바닥에 대고 엎드려서
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 몸짓을 살리면서, 현대 한국어에서 자연스럽고 공손한 표현으로 옮겼습니다.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר
