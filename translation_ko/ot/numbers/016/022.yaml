theological_decisions:
- issue: ‘모든 육체의 영들의 하나님’의 의미
  chosen_reading: 하나님이 모든 사람의 내적 생명과 개별적 책임을 아시는 분이라는 호칭으로 읽었습니다.
  alternative_readings:
  - 하나님이 모든 육체에 숨과 생명을 주시는 분이라는 호칭
  - 단순히 피조물 전체의 생명근원에 대한 호칭
  rationale: 문맥상 모세와 아론은 개인의 죄가 공동체 전체를 멸하지 않도록 구하고 있으므로, ‘영들’은 각 사람의 내면과 책임을 아시는 하나님의 주권을 드러내는 방향이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 요구하는 신학적 긴장을 보존하고, 해석을 성급히 평면화하지 말 것.'
- issue: ‘한 사람이 죄를 지었다’의 대표성
  chosen_reading: 개인의 죄가 공동체 전체에 곧바로 동일한 형벌을 가져와서는 안 된다는 대표적 호소로 읽었습니다.
  alternative_readings:
  - 정확히 한 사람만의 죄를 말하는 제한된 진술
  - 모세와 아론 자신을 포함한 특정 개인의 책임 강조
  rationale: 영어 POB의 각주가 지적하듯, ‘한 사람’은 대표적 기능을 가질 수 있으므로 한국어도 그 긴장을 살려 공동체적 진노의 과잉을 막아 달라는 청원을 드러내게 했습니다.
  doctrine_reference: 'DOCTRINE.md: 대표적 표현은 문맥에 따라 보존하되 과도하게 일반화하지 말 것.'
