  chosen_korean: 모든 육체의 영들의 하나님
  alternatives_korean:
  - 모든 육체의 숨의 하나님
  - 모든 사람의 영들의 하나님
  - 모든 육체의 영을 지니신 하나님
  lexicon: HALOT
  rationale: רוּחוֹת를 영어 POB처럼 ‘spirits’로 받아들여, 하나님이 모든 생명의 내적 생기와 사람의 내면을 아시는 분이라는 표현 구조를 유지했습니다.
- source_word: הָאִישׁ אֶחָד
  english_pob_choice: one man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 한 남자가
  - 한 사람
  - 한 인물이
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 표현을 과도하게 중화하지 않으면서도, 한국어 문맥에서는 대표적 의미가 살아나도록 ‘한 사람’으로 옮겼습니다.
- source_word: תִּקְצֹף
  english_pob_choice: will you be angry
  chosen_korean: 진노하시겠습니까
  alternatives_korean:
  - 노하시겠습니까
  - 화내시겠습니까
  - 격노하시겠습니까
  lexicon: HALOT
  rationale: 하나님의 분노를 가볍게 만들지 않으면서도, 한국어 성경 문체에서 자연스럽고 경외적인 동사를 선택했습니다.
theological_decisions:
- issue: ‘모든 육체의 영들의 하나님’의 의미
  chosen_reading: 하나님이 모든 사람의 내적 생명과 개별적 책임을 아시는 분이라는 호칭으로 읽었습니다.
  alternative_readings:
  - 하나님이 모든 육체에 숨과 생명을 주시는 분이라는 호칭
  - 단순히 피조물 전체의 생명근원에 대한 호칭
  rationale: 문맥상 모세와 아론은 개인의 죄가 공동체 전체를 멸하지 않도록 구하고 있으므로, ‘영들’은 각 사람의 내면과 책임을 아시는 하나님의 주권을 드러내는 방향이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 요구하는 신학적 긴장을 보존하고, 해석을 성급히 평면화하지 말 것.'
- issue: ‘한 사람이 죄를 지었다’의 대표성
  chosen_reading: 개인의 죄가 공동체 전체에 곧바로 동일한 형벌을 가져와서는 안 된다는 대표적 호소로 읽었습니다.
  alternative_readings:
  - 정확히 한 사람만의 죄를 말하는 제한된 진술
  - 모세와 아론 자신을 포함한 특정 개인의 책임 강조
  rationale: 영어 POB의 각주가 지적하듯, ‘한 사람’은 대표적 기능을 가질 수 있으므로 한국어도 그 긴장을 살려 공동체적 진노의 과잉을 막아 달라는 청원을 드러내게 했습니다.
  doctrine_reference: 'DOCTRINE.md: 대표적 표현은 문맥에 따라 보존하되 과도하게 일반화하지 말 것.'
