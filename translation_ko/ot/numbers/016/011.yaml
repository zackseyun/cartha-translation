    issue: 복수 청자 표지가 불분명함
    rationale: תְלֹנוּ는 ‘너희가 원망하다’라는 복수형입니다. ‘너희가’를 명시하여 원문의 수를 반영해야 합니다.
  - severity: low
    issue: ‘아론은 누구이기에’가 מַה הוּא의 표현을 다소 바꿈
    rationale: 원문은 문자적으로 ‘아론이 무엇이기에’라는 수사 의문문입니다. 사람의 신분을 묻는 ‘누구’보다 ‘무엇이기에’가 원문의 아론 경시 표현을 더 잘 보존합니다.
  - severity: low
    issue: 첫 절의 진술이 종속 인과절로 처리됨
    rationale: ‘모였으니’는 뒤의 질문에 대한 인과관계를 한국어에서 강화합니다. 원문은 야훼를 대적하여 모인 사실을 진술한 뒤 아론에 관한 수사 질문을 덧붙이므로, 문장을 분리하는 편이 구조에 가깝습니다.
