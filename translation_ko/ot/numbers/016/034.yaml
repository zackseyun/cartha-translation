    text: 히브리어 קוֹל은 ‘소리’, ‘목소리’, 또는 ‘외침’을 뜻할 수 있습니다. 여기서는 문맥상 ‘외침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
