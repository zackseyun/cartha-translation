id: NUM.16.34
reference: Numbers 16:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
  footnotes:
  - marker: a
    text: Or 'at their cry.' The Hebrew qōl can mean 'sound,' 'voice,' or 'cry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 주변에 있던 온 이스라엘은 그들의 소리를 듣고 도망하였습니다. 그들은 말하였습니다. “땅이 우리를 삼킬지도 모른다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קוֹל은 여기서 ‘소리’로 옮길 수 있으며, 문맥상 ‘외침’의 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: And all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 모든 백성
  lexicon: HALOT
  rationale: כָל과 집합명사 יִשְׂרָאֵל의 결합은 공동체 전체를 가리키므로, ‘온 이스라엘’이 자연스럽고 집합적 의미를 잘 살립니다.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  english_pob_choice: who were around them
  chosen_korean: 그들 주변에 있던
  alternatives_korean:
  - 그들 둘레에 있던
  - 사방에 둘러 있던
  lexicon: HALOT
  rationale: 관계절은 심판 사건의 현장 주변에 있던 사람들을 수식하므로, 현대 한국어에서 가장 읽기 자연스러운 ‘그들 주변에 있던’으로 옮겼습니다.
- source_word: נָסוּ לְקֹלָם
  english_pob_choice: fled at their sound
  chosen_korean: 그들의 소리를 듣고 도망하였습니다
  alternatives_korean:
  - 그들의 소리 때문에 도망하였습니다
  - 그들의 외침을 듣고 도망하였습니다
  lexicon: HALOT
  rationale: קוֹלָם은 ‘소리/목소리/외침’을 모두 포함할 수 있으므로, 본문이 청각적 반응을 강조하는 점을 살려 ‘그들의 소리를 듣고’로 풀었습니다. ‘도망하다’는 נוּס의 긴박한 회피를 자연스럽게 드러냅니다.
- source_word: פֶּן תִּבְלָעֵנוּ הָאָרֶץ
  english_pob_choice: Lest the earth swallow us up!
  chosen_korean: 땅이 우리를 삼킬지도 모른다!
  alternatives_korean:
  - 땅이 우리를 삼키지 않도록!
  - 땅이 우리를 삼켜 버릴까 두렵다!
  lexicon: HALOT
  rationale: פֶּן은 ‘~할까 두려워/그렇게 되지 않도록’의 경고적·우려적 뉘앙스를 가지므로, 실제 발화의 두려움을 살려 한국어 구어체 경계 표현으로 옮겼습니다. הָאָרֶץ는 문맥상 열려 사람을 삼키는 ‘땅’이 가장 직접적입니다.
theological_decisions:
- issue: Fear-driven speech in direct quotation
  chosen_reading: 직접 인용문은 두려움의 긴박함을 유지하되, 한국어에서는 자연스러운 경계 표현으로 처리했습니다.
  alternative_readings:
  - '직역형: ‘땅이 우리를 삼킬까 하노라!’'
  - '완화형: ‘땅이 우리를 삼키지 않도록 하자!’'
  rationale: 히브리어 פֶּן은 단순한 명령보다 임박한 재앙을 피하려는 두려움을 나타내므로, 독자가 본문의 공포를 즉시 느끼도록 했습니다.
  doctrine_reference: 서사 본문 번역의 화행 보존
