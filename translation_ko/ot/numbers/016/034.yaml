revisions:
- from: 그리고 그들 주변에 있던 온 이스라엘은 그들의 소리를 듣고 도망하였습니다. 그들은 말하였습니다. “땅이 우리를 삼킬지도 모른다!”[a]
  to: 그들 주변에 있던 온 이스라엘은 그들의 소리[a]에 도망하였습니다. 그들은 “땅이 우리를 삼킬까!” 하고 말하였습니다.
  rationale: The revision moves the lexical footnote anchor to ‘소리,’ avoids making ‘hear’ explicit where the Hebrew says literally ‘at/to their sound,’ and reshapes the speech introduction into natural formal Korean. The terse fearful exclamation ‘땅이 우리를 삼킬까!’ retains the apprehensive force of פֶּן without imposing an interpretation beyond the source.
