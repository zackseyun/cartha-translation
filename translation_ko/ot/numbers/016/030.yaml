  source_fidelity: 개정이 필요합니다. 초안은 וְאִם의 조건 표지인 ‘만일’을 빠뜨렸습니다. 또한 כָּל אֲשֶׁר לָהֶם을 ‘모든 소유’로만 옮기면 소유물에 국한될 수 있으므로, 사람들을 포함할 수 있는 포괄성을 보존하여 ‘그들에게 속한 모든 것’으로 옮기는 것이 더 충실합니다. 스올, 산 채로 내려감, 야훼를 멸시함은 잘 반영되어 있습니다.
  naturalness: ‘땅이 그 입을 열어’도 이해되지만, 현대 한국어에서는 의인화된 표현을 유지하면서 ‘땅이 입을 벌려’가 더 자연스럽습니다. 요청된 현대 합쇼체에 맞추어 결론을 ‘알게 될 것입니다’로 정리했습니다.
  terminology: יַהְוֶה는 ‘야훼’로, שְׁאוֹל은 ‘스올’로 유지했습니다. בְּרִיאָה/יִבְרָא의 동족어 강조는 본문에서 ‘새로운 것을 창조하시고’로 반영하고 각주에서 설명합니다.
