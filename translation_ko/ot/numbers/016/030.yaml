  to: 그러나 만일 야훼께서 새로운 것을 창조하시고[a], 땅이 입을 벌려 그들과 그들에게 속한 모든 것을 삼키고, 그들이 산 채로 스올로[b] 내려가면, 너희는 이 사람들이 야훼를 멸시했다는 것을 알게 될 것입니다.
