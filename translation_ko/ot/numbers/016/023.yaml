lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행과 다음 사건으로의 전환을 자연스럽게 살려 '그때'로 옮기고, דבר의 공적 발화를 '말씀하셨습니다'로 옮겨 격식을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 POB 원칙에 따라 고유명사로서 '야훼'를 사용하여, 칭호인 '주'로 대체하지 않았습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세오
  lexicon: HALOT
  rationale: 인명은 한국어 성경에서 확립된 표기인 '모세'를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시되
  - 말하며
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 여는 공식적 연결구이므로 별도의 '말하여'를 두기보다 한국어 문장 자연성에 맞게 선행 동사 안에 흡수해 번역했습니다.
theological_decisions:
- issue: 여호와의 전통적 대체어 사용 여부
  chosen_reading: 본문의 하나님의 이름을 '야훼'로 직접 표기했습니다.
  alternative_readings:
