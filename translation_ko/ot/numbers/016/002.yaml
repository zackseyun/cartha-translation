  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
  footnotes:
  - marker: a
    text: Or 'from the Israelites.' The Hebrew reads 'from the sons of Israel,' a covenantal designation retained here for source-language transparency.
    reason: lexical_alternative
  - marker: b
    text: Or 'those summoned to the meeting.' The Hebrew phrase may denote men officially called to the community's appointed assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모세 앞에 일어났고, 이스라엘 자손 가운데서 온 이백오십 명—회중의 지도자이며 회의에 소집된 자들이며, 이름난 사람들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  english_pob_choice: rose up
  chosen_korean: 일어났고
  alternatives_korean:
  - 일어섰고
  - 일어났습니다
  lexicon: HALOT
  rationale: 서술 흐름상 행동의 개시를 자연스럽게 나타내며, ‘반역하다’ 같은 해석을 본문 동사 자체에 미리 넣지 않도록 했습니다.
- source_word: לִפְנֵי מֹשֶׁה
  english_pob_choice: before Moses
  chosen_korean: 모세 앞에
  alternatives_korean:
  - 모세 앞에서
  - 모세 면전에
  lexicon: HALOT
  rationale: 히브리어의 공간적·대면적 표현을 보존하면서도 현대 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서 온
  alternatives_korean:
  - 이스라엘 사람들 가운데서 온
  - 이스라엘의 아들들 가운데서 온
  lexicon: HALOT
  rationale: 직역성을 유지하되 한국어에서 부자연스러운 ‘아들들’ 표현은 피하고, 출처가 되는 집단적 범위를 분명히 했습니다.
- source_word: קְרִאֵי מוֹעֵד
  english_pob_choice: called to the assembly
  chosen_korean: 회의에 소집된 자들이며
  alternatives_korean:
  - 모임에 부름받은 자들이며
  - 집회에 소집된 자들이며
  lexicon: HALOT
  rationale: 공식적으로 소집된 사람들을 가리키는 뉘앙스를 살리면서, ‘assembly’의 제도적 의미를 한국어로 풀어냈습니다.
- source_word: אַנְשֵׁי שֵׁם
  english_pob_choice: men of renown
  chosen_korean: 이름난 사람들이었습니다
  alternatives_korean:
  - 명망 있는 사람들이었습니다
  - 유명한 사람들이었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘이름’과 ‘명성’의 뜻을 살리되, 현대 독자가 바로 이해할 수 있는 표현을 택했습니다.
