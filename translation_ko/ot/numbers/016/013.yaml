id: NUM.16.13
reference: Numbers 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
  footnotes:
  - marker: a
    text: The speakers sarcastically describe Egypt as 'a land flowing with milk and honey,' language elsewhere used for the promised land.
    reason: cultural_note
  - marker: b
    text: Or 'lord it over us' for 'make yourself a ruler over us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리에게 적은 일입니까? 당신이 우리를 젖과 꿀이 흐르는 땅에서 데리고 올라와 광야에서 우리를 죽이려 하시고, 또 우리 위에 군림하려 하십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역설적으로, 여기서 ‘젖과 꿀이 흐르는 땅’은 다른 곳에서 약속의 땅에 쓰이는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘우리 위에 군림하려 하십니까?’의 뜻으로, ‘우리 위에 통치자가 되려 하십니까?’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט כִּי
  english_pob_choice: Is it a small thing that
  chosen_korean: 우리에게 적은 일입니까?
  alternatives_korean:
  - 그것이 작은 일입니까?
  - 그 일이 하찮습니까?
  lexicon: HALOT
  rationale: 히브리어 수사적 반문을 자연스러운 한국어 질문으로 옮기되, 불평의 뉘앙스가 드러나도록 ‘적은 일’로 압축했습니다.
- source_word: הֶעֱלִיתָנוּ
  english_pob_choice: you have brought us up
  chosen_korean: 우리를 데리고 올라와
  alternatives_korean:
  - 우리를 끌어올려
  - 우리를 올라가게 하여
  lexicon: HALOT
  rationale: עלה의 ‘올라가게 하다/데리고 올라가다’의 이동 이미지를 살려, 출애굽을 떠올리게 하는 표현으로 옮겼습니다.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: out of a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅에서
  alternatives_korean:
  - 젖과 꿀이 흐르는 나라에서
  - 젖과 꿀이 넘치는 땅에서
  lexicon: HALOT
  rationale: 표준 관용구를 직역에 가깝게 유지해, 본문이 의도적으로 비꼬는 표현이라는 점을 그대로 드러내었습니다.
- source_word: לַהֲמִיתֵנוּ
  english_pob_choice: to kill us
  chosen_korean: 우리를 죽이려 하시고
  alternatives_korean:
  - 우리를 죽이려고
  - 우리를 죽이기 위해
  lexicon: HALOT
  rationale: 목적 부정사의 직접성을 살려 강한 고발조로 옮겼습니다.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  english_pob_choice: make yourself a ruler over us
  chosen_korean: 또 우리 위에 군림하려 하십니까?
  alternatives_korean:
  - 또 우리 위에 통치자가 되려 하십니까?
  - 또 우리를 지배하려 하십니까?
  lexicon: HALOT
  rationale: שׂרר의 통치/군림 의미를 살리되, 한국어에서 비난조로 자연스러운 ‘군림하다’를 선택해 자기 고양의 뉘앙스를 전달했습니다.
theological_decisions:
- issue: 애굽을 ‘젖과 꿀이 흐르는 땅’이라고 부르는 역설
  chosen_reading: 본문의 아이러니를 풀어 설명하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘그들이 아이러니하게 말하는 젖과 꿀이 흐르는 땅’처럼 설명을 덧붙임
  - ‘이른바 젖과 꿀이 흐르는 땅’으로 완화
  rationale: 히브리어 자체가 문맥을 통해 반어를 드러내므로, 설명을 추가하면 본문의 날카로운 고발을 약화시킬 수 있습니다.
  doctrine_reference: '원문 우선 원칙: 해석을 과도하게 앞서지 않고, 본문이 만든 긴장을 보존합니다.'
