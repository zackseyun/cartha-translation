  to: 당신이 우리를 젖과 꿀이 흐르는 땅[a]에서 데리고 올라와 광야에서 죽이려 하신 것이 작은 일입니까? 또 우리 위에 군림하기까지 하시겠습니까?[b]
  rationale: 수사적 반문의 내용절을 복원하여 원문의 문장 구조와 고발의 초점을 보존했습니다. 마지막 절은 히브리어의 반복에 의한 강조와 추가 고발의 뉘앙스를 ‘또 … 하기까지 하시겠습니까?’로 옮겼습니다. 애굽을 ‘젖과 꿀이 흐르는 땅’이라고 부르는 반어는 본문에서 설명하지 않고 각주에서만 밝혔습니다.
