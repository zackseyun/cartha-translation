  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
  footnotes:
  - marker: a
    text: The speakers sarcastically describe Egypt as 'a land flowing with milk and honey,' language elsewhere used for the promised land.
    reason: cultural_note
  - marker: b
    text: Or 'lord it over us' for 'make yourself a ruler over us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 우리를 젖과 꿀이 흐르는 땅[a]에서 데리고 올라와 광야에서 죽이려 하신 것이 작은 일입니까? 또 우리 위에 군림하기까지 하시겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 화자들은 애굽을 반어적으로 ‘젖과 꿀이 흐르는 땅’이라고 부릅니다. 이 표현은 다른 곳에서는 약속의 땅을 가리킬 때 쓰입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘우리 위에 통치자가 되려 하시겠습니까?’ 또는 ‘우리 위에 지배자처럼 군림하려 하시겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט כִּי
  english_pob_choice: Is it a small thing that
  chosen_korean: 우리에게 적은 일입니까?
  alternatives_korean:
  - 그것이 작은 일입니까?
  - 그 일이 하찮습니까?
  lexicon: HALOT
  rationale: 히브리어 수사적 반문을 자연스러운 한국어 질문으로 옮기되, 불평의 뉘앙스가 드러나도록 ‘적은 일’로 압축했습니다.
- source_word: הֶעֱלִיתָנוּ
  english_pob_choice: you have brought us up
  chosen_korean: 우리를 데리고 올라와
