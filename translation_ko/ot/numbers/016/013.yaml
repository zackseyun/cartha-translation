  lexicon: HALOT
  rationale: עלה의 ‘올라가게 하다/데리고 올라가다’의 이동 이미지를 살려, 출애굽을 떠올리게 하는 표현으로 옮겼습니다.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: out of a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅에서
  alternatives_korean:
  - 젖과 꿀이 흐르는 나라에서
  - 젖과 꿀이 넘치는 땅에서
  lexicon: HALOT
  rationale: 표준 관용구를 직역에 가깝게 유지해, 본문이 의도적으로 비꼬는 표현이라는 점을 그대로 드러내었습니다.
- source_word: לַהֲמִיתֵנוּ
  english_pob_choice: to kill us
  chosen_korean: 우리를 죽이려 하시고
  alternatives_korean:
  - 우리를 죽이려고
  - 우리를 죽이기 위해
  lexicon: HALOT
  rationale: 목적 부정사의 직접성을 살려 강한 고발조로 옮겼습니다.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  english_pob_choice: make yourself a ruler over us
  chosen_korean: 또 우리 위에 군림하려 하십니까?
  alternatives_korean:
  - 또 우리 위에 통치자가 되려 하십니까?
  - 또 우리를 지배하려 하십니까?
  lexicon: HALOT
  rationale: שׂרר의 통치/군림 의미를 살리되, 한국어에서 비난조로 자연스러운 ‘군림하다’를 선택해 자기 고양의 뉘앙스를 전달했습니다.
theological_decisions:
- issue: 애굽을 ‘젖과 꿀이 흐르는 땅’이라고 부르는 역설
  chosen_reading: 본문의 아이러니를 풀어 설명하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘그들이 아이러니하게 말하는 젖과 꿀이 흐르는 땅’처럼 설명을 덧붙임
  - ‘이른바 젖과 꿀이 흐르는 땅’으로 완화
  rationale: 히브리어 자체가 문맥을 통해 반어를 드러내므로, 설명을 추가하면 본문의 날카로운 고발을 약화시킬 수 있습니다.
  doctrine_reference: '원문 우선 원칙: 해석을 과도하게 앞서지 않고, 본문이 만든 긴장을 보존합니다.'
