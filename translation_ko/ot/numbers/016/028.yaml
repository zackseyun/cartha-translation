  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
  footnotes:
  - marker: a
    text: Or, “all these acts” or “all these things.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “not from my heart,” an idiom meaning not on my own initiative or authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말했습니다. “이것으로 너희는 야훼께서 나를 보내어 이 모든 일을 하도록 하셨음을, 또 내가 이 모든 일을 내 마음대로 한 것이 아님을 알게 될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “내 마음에서”입니다. 이는 관용적으로 ‘내 스스로의 발상이나 권위로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: And Moses said
  chosen_korean: 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 그때 모세가 말했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 히브리어 이야기체의 진행을 살리되, 한국어에서는 자연스러운 직접화법 도입으로 간결하게 옮겼습니다.
- source_word: בְּזֹאת תֵּדְעוּן
  english_pob_choice: By this you will know
  chosen_korean: 이것으로 너희는 ... 알게 될 것입니다
  alternatives_korean:
  - 이로써 너희는 ... 알게 될 것입니다
  - 이것을 통해 너희는 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: בְּזֹאת의 표지를 ‘이것으로’로 살려, 뒤따르는 표적/증거가 인식의 근거가 된다는 점을 드러냈습니다.
- source_word: כִּי יְהוָה שְׁלָחַנִי
  english_pob_choice: that Yahweh has sent me
  chosen_korean: 야훼께서 나를 보내셔서
  alternatives_korean:
  - 야훼께서 나를 보내셨음을
  - 야훼께서 나를 보내신 것을
  lexicon: HALOT
  rationale: 파송 완료와 그 결과의 확증을 한국어에서 자연스럽게 나타내기 위해 ‘보내셔서’로 처리했습니다.
- source_word: כָּל הַמַּעֲשִׂים הָאֵלֶּה
  english_pob_choice: all these deeds
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 이 모든 행위
  - 이 모든 일들
  lexicon: HALOT
  rationale: מַעֲשִׂים은 구체적 행위들을 가리키지만, 본문에서 자연스러운 총칭으로는 ‘이 모든 일’이 가장 무난합니다.
- source_word: כִּי לֹא מִלִּבִּי
  english_pob_choice: for it was not from my own heart
  chosen_korean: 그것은 내 마음에서 나온 것이 아닙니다
  alternatives_korean:
  - 그것은 내 마음에서 비롯된 것이 아닙니다
  - 그것은 내 뜻에서 나온 것이 아닙니다
  lexicon: HALOT idiom
  rationale: ‘내 마음에서’는 히브리어 관용구를 직역해, 자의적 발상이나 독자적 권위가 아님을 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명은 설명적 치환 없이 음역하여, 본문의 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘내 마음에서 나온 것이 아닙니다’의 관용성
  chosen_reading: 자의적 기원이나 독자적 권위가 아니라는 의미로 읽음
  alternative_readings:
  - 단순한 감정의 문제가 아니라는 의미
  - 내적 확신이 아니라는 의미
  rationale: מִלִּבִּי는 단순 심리 상태가 아니라 ‘내 스스로 시작하거나 권한을 가진 것이 아니다’라는 파송의 정당성을 강조합니다.
  doctrine_reference: WLC idiom / POB lexical note
