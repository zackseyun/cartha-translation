  source_fidelity: 히브리어는 고라 한 사람에게 먼저 ‘당신’을 단수로 말한 뒤, 그와 함께한 레위 자손들을 포함하여 복수로 ‘너희가 제사장직도 구한다’고 말합니다. 개정문은 이 단수-복수 전환과 ‘가까이 오게 하다’의 제의적 접근 허용의 뜻, 그리고 레위인의 봉사와 제사장직의 구별을 유지합니다.
  naturalness: 초안의 ‘당신과 당신의 모든 형제 … 당신과 함께’는 ‘당신’이 반복되어 한국어 문장 구조상 다소 어색하고, ‘당신과 함께’가 누구를 수식하는지도 잠시 불분명합니다. ‘당신과 함께 있는 모든 형제들’로 정리하고 합쇼체 종결을 일관되게 적용했습니다.
  terminology: ‘제사장직’은 כְּהֻנָּה가 가리키는 제사장의 직분·지위를 자연스럽고 간결하게 나타내며, 이 문맥의 레위인과 아론계 제사장 사이의 구별을 보존합니다. ‘레위 자손들’은 בְנֵי לֵוִי의 직역적 표현을 유지합니다.
