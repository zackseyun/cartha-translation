revisions:
- from: 그리고 그는 회중에게 말하여 이르기를, 「이 악한 사람들의 천막들에서 제발 물러나십시오. 그들에게 속한 것은 무엇이든지 만지지 마십시오. 그렇지 않으면 그들의 모든 죄로 말미암아 휩쓸려 갈까 합니다」라고 하였습니다.[a]
  to: 그는 회중에게 말했습니다. 「부디 이 악한 사람들의 장막 곁에서 물러나십시오. 그들에게 속한 것은 무엇이든지 만지지 마십시오. 그들의 모든 죄에 휘말려 함께 휩쓸려 가지 않도록 하십시오.」[a]
  rationale: 수정문은 עֵדָה를 ‘회중’으로, 수르 나를 긴급하면서도 공손한 ‘부디 … 물러나십시오’로 유지했습니다. מֵעַל אָהֳלֵי의 근접 회피를 ‘장막 곁에서’로 드러냈고, 마지막 절은 ‘그들의 모든 죄에 휘말려 함께 휩쓸려 가지 않도록’으로 옮겨 심판에 연루되는 경고를 보존했습니다. 원인적 독해는 본문에 단정하지 않고 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:52Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 충실하나, 마지막 구절의 בְּכָל חַטֹּאתָם를 본문의 ‘…로 말미암아’로 확정하면 원문의 연루·상황적 의미 가능성이 약화됩니다. 또한 מֵעַל אָהֳלֵי는 장막 자체에서뿐 아니라 그 주변으로부터 물러나라는 뜻이므로 ‘장막 곁에서’가 더 정확합니다.
  naturalness: 합쇼체는 대체로 적절하지만, 직접 인용 안의 ‘휩쓸려 갈까 합니다’는 경고 명령문으로 다소 부자연스럽고 화자의 추측처럼 들립니다. ‘…않도록 하십시오’가 자연스럽고 원문의 פֶּן이 나타내는 경고를 잘 전달합니다. ‘부디’는 이 문맥에서 ‘제발’보다 현대의 격식 있는 문체에 더 어울립니다.
  terminology: ‘회중’, ‘악한 사람들’, ‘장막’은 문맥과 성경 서술 문체에 적절합니다. ‘천막들’보다 ‘장막’이 이스라엘 광야 서사의 정착된 용례와 자연스러운 격식에 더 잘 맞습니다.
  issues:
  - severity: medium
    issue: 마지막 절을 ‘그들의 모든 죄로 말미암아’라고 원인으로 확정함
    rationale: בְּכָל חַטֹּאתָם는 원인으로 이해될 수 있으나, 심판에 함께 휩쓸리는 연루·상황의 뉘앙스도 가능합니다. 본문은 그 긴장을 남기고, 원인적 해석은 각주로 제시하는 편이 안전합니다.
  - severity: medium
    issue: ‘휩쓸려 갈까 합니다’의 문장 기능
    rationale: פֶּן 이하의 경고 목적절을 한국어에서 ‘…갈까 합니다’로 옮기면 서술자의 완곡한 의향 또는 추측처럼 들립니다. 금령의 결과를 경고하는 ‘…가지 않도록 하십시오’가 적절합니다.
  - severity: low
    issue: ‘천막들에서’의 공간 표현
    rationale: מֵעַל은 장막의 주변·근처에서 떠나는 뜻입니다. ‘장막 곁에서 물러나십시오’가 금지된 근접성을 더 분명히 합니다.
