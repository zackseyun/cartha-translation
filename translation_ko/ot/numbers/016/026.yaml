source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
  footnotes:
  - marker: a
    text: Or 'lest you be destroyed because of all their sins.' The Hebrew can be understood with a more explicitly causal nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 회중에게 말하여 이르기를, 「이 악한 사람들의 천막들에서 제발 물러나십시오. 그들에게 속한 것은 무엇이든지 만지지 마십시오. 그렇지 않으면 그들의 모든 죄로 말미암아 휩쓸려 갈까 합니다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 모든 죄 때문에 파멸될까 합니다.' 히브리어는 더 분명한 원인적 뉘앙스로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֵדָה
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 공동체
  lexicon: HALOT
  rationale: עֵדָה는 광야 이야기에서 한데 모인 이스라엘 공동체를 가리키므로, POB의 'congregation'에 맞춰 기능적으로는 '회중'이 가장 자연스럽고 집합성을 살립니다.
- source_word: סוּרוּ נָא
  english_pob_choice: Please move away
  chosen_korean: 제발 물러나십시오
  alternatives_korean:
  - 제발 피하십시오
  - 제발 떠나십시오
  - 지금 물러나십시오
  lexicon: HALOT
  rationale: 명령형 סוּר와 정중한 आग्रह נָא를 함께 살려, 한국어에서는 공손한 요청인 '제발 …십시오'로 옮기는 것이 긴급성과 호소를 모두 드러냅니다.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  english_pob_choice: these wicked men
  chosen_korean: 이 악한 사람들
  alternatives_korean:
  - 이 악한 남자들
  - 이 불의한 사람들
  lexicon: HALOT
  rationale: הָאֵלֶּה의 지시성을 살려 '이'를 두고, רְשָׁעִים은 윤리·법정적 비난을 함께 담는 '악한'으로 옮겼습니다.
- source_word: פֶּן תִּסָּפוּ בְּכָל חַטֹּאתָם
  english_pob_choice: lest you be swept away in all their sins
  chosen_korean: 그들의 모든 죄로 말미암아 휩쓸려 갈까 합니다
  alternatives_korean:
  - 그들의 모든 죄 가운데 휩쓸려 갈까 합니다
  - 그들의 모든 죄 때문에 멸망할까 합니다
  lexicon: HALOT
  rationale: ספה의 수동 뉘앙스를 '휩쓸려 가다'로 살려 심판에 휘말리는 이미지를 보존했고, בְּכָל חַטֹּאתָם의 관계를 한국어에서는 원인적 연결로 자연스럽게 풀어 썼습니다.
theological_decisions:
- issue: 마지막 절의 관계를 원인으로만 단정할지, 연루/근접의 긴장을 남길지
  chosen_reading: '''그들의 모든 죄로 말미암아 휩쓸려 갈까 합니다''로 옮겨, 죄와의 연루 속에서 닥치는 심판의 경고를 전달하되 완전히 평면적인 ''원인-결과''로만 좁히지는 않았습니다.'
  alternative_readings:
  - '''그들의 모든 죄 가운데 휩쓸려 갈까 합니다''처럼 더 직역적으로 유지할 수 있습니다.'
  - '''그들의 모든 죄 때문에 멸망할까 합니다''처럼 더 명시적으로 원인화할 수 있습니다.'
  rationale: 히브리어는 근접 회피와 심판 참여의 긴장을 함께 지니므로, 한국어도 그 긴장을 크게 훼손하지 않는 범위에서 읽기 쉬운 표현을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
