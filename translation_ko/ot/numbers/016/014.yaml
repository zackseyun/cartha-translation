  lexicon: HALOT
  rationale: נַחֲלָה를 ‘기업’으로, שָׂדֶה/כָרֶם을 한국어의 병렬 어법에 맞춰 ‘들의 포도밭’으로 옮겨 원문의 상속·분배 의미를 살렸습니다.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  english_pob_choice: Will you gouge out the eyes of these men?
  chosen_korean: 이 사람들의 눈을 빼려 하십니까?
  alternatives_korean:
  - 저 사람들의 눈을 빼려 하십니까?
  - 이 사람들의 눈을 멀게 하려 하십니까?
  lexicon: HALOT
  rationale: תְּנַקֵּר의 생생한 신체적 이미지를 살려 ‘눈을 빼다’로 옮겼고, 완곡한 ‘멀게 하다’는 본문의 공격성을 약화시켜 제외했습니다.
theological_decisions:
- issue: 반어적 항의의 유지
  chosen_reading: 모세의 권위를 거부하는 불신 섞인 항의로 읽어, 한국어도 직설적 비난의 톤을 유지했습니다.
  alternative_readings:
  - 단순한 질문형
  - 과장된 수사적 의문
  rationale: 원문은 실제 정보 요청이 아니라 고발적 수사이므로, ‘주지 않으셨습니다… 하십니까?’의 대구로 항의성을 드러내는 것이 적절합니다.
  doctrine_reference: 본문 문맥상 불순종과 불신의 드러남
- issue: ‘눈을 빼다’의 직설성 유지
  chosen_reading: 문자적 폭력 이미지를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 그들을 눈멀게 하려 하십니까?
  - 그들을 속이려 하십니까?
  rationale: 영어 POB가 비유 가능성을 각주로만 처리한 것처럼, 본문은 먼저 원문의 거친 이미지를 보존하고 해석 가능성은 각주에 두는 편이 source-first 원칙에 맞습니다.
  doctrine_reference: 원문 수사 보존
