  lexicon: HALOT
  rationale: 관용구를 직역에 가깝게 옮기되, 한국어에서도 익숙한 ‘젖과 꿀이 흐르는 땅’ 표현을 유지했습니다.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  english_pob_choice: nor have you given us an inheritance of fields and vineyards
  chosen_korean: 들의 포도밭의 기업도 주지 않으셨습니다
  alternatives_korean:
  - 밭과 포도원의 기업도 주지 않으셨습니다
