id: NUM.16.14
reference: Numbers 16:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
  footnotes:
  - marker: a
    text: Or, 'Will you blind these men?' The Hebrew idiom is literally 'gouge out the eyes,' which may also imply treating them as if they were blind to the truth.
    reason: lexical_alternative
translation:
  language: ko
  text: 정녕코[a] 주님은 우리를 젖과 꿀이 흐르는 땅으로 데려오지 않으셨고, 들과 포도밭의 기업도 주지 않으셨습니다. 이 사람들의 눈을 빼려 하십니까? 우리는 올라가지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사람들의 눈을 멀게 하려 하십니까?’ 히브리어 관용구는 문자적으로는 ‘눈을 빼다’이며, 진실을 보지 못하게 속인다는 뜻도 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  english_pob_choice: Indeed, ... not
  chosen_korean: 정녕코 … 않으셨고
  alternatives_korean:
  - 과연 … 않으셨고
  - 참으로 … 않으셨고
  lexicon: HALOT
  rationale: אַף의 강조를 한국어의 정녕코로 살리고, 뒤의 부정을 연결해 원문의 항의적 어조를 자연스럽게 보존했습니다.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: into a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅으로
  alternatives_korean:
  - 젖과 꿀이 흐르는 땅에
  - 젖과 꿀이 넘치는 땅으로
  lexicon: HALOT
  rationale: 관용구를 직역에 가깝게 옮기되, 한국어에서도 익숙한 ‘젖과 꿀이 흐르는 땅’ 표현을 유지했습니다.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  english_pob_choice: nor have you given us an inheritance of fields and vineyards
  chosen_korean: 들의 포도밭의 기업도 주지 않으셨습니다
  alternatives_korean:
  - 밭과 포도원의 기업도 주지 않으셨습니다
  - 들판과 포도밭의 유산도 주지 않으셨습니다
  lexicon: HALOT
  rationale: נַחֲלָה를 ‘기업’으로, שָׂדֶה/כָרֶם을 한국어의 병렬 어법에 맞춰 ‘들의 포도밭’으로 옮겨 원문의 상속·분배 의미를 살렸습니다.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  english_pob_choice: Will you gouge out the eyes of these men?
  chosen_korean: 이 사람들의 눈을 빼려 하십니까?
  alternatives_korean:
  - 저 사람들의 눈을 빼려 하십니까?
  - 이 사람들의 눈을 멀게 하려 하십니까?
  lexicon: HALOT
  rationale: תְּנַקֵּר의 생생한 신체적 이미지를 살려 ‘눈을 빼다’로 옮겼고, 완곡한 ‘멀게 하다’는 본문의 공격성을 약화시켜 제외했습니다.
theological_decisions:
- issue: 반어적 항의의 유지
  chosen_reading: 모세의 권위를 거부하는 불신 섞인 항의로 읽어, 한국어도 직설적 비난의 톤을 유지했습니다.
  alternative_readings:
  - 단순한 질문형
  - 과장된 수사적 의문
  rationale: 원문은 실제 정보 요청이 아니라 고발적 수사이므로, ‘주지 않으셨습니다… 하십니까?’의 대구로 항의성을 드러내는 것이 적절합니다.
  doctrine_reference: 본문 문맥상 불순종과 불신의 드러남
- issue: ‘눈을 빼다’의 직설성 유지
  chosen_reading: 문자적 폭력 이미지를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 그들을 눈멀게 하려 하십니까?
  - 그들을 속이려 하십니까?
  rationale: 영어 POB가 비유 가능성을 각주로만 처리한 것처럼, 본문은 먼저 원문의 거친 이미지를 보존하고 해석 가능성은 각주에 두는 편이 source-first 원칙에 맞습니다.
  doctrine_reference: 원문 수사 보존
