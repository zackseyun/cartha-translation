  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
  footnotes:
  - marker: a
    text: Or, 'Will you blind these men?' The Hebrew idiom is literally 'gouge out the eyes,' which may also imply treating them as if they were blind to the truth.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로, 당신은 우리를 젖과 꿀이 흐르는 땅으로 데려오지 않으셨고, 밭과 포도원을 유산으로 우리에게 주지도 않으셨습니다. 이 사람들의 눈을 빼려 하십니까?[a] 우리는 올라가지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사람들을 눈멀게 하려 하십니까?’ 히브리어 표현은 문자적으로 ‘눈을 빼다’이며, 이들이 진실을 보지 못하게 한다는 비유적 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  english_pob_choice: Indeed, ... not
  chosen_korean: 정녕코 … 않으셨고
