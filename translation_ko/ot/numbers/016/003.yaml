  naturalness: “회중 위에 스스로 높아집니까”보다 목적어를 명시한 “스스로를 높입니까”가 현대 표준 한국어에서 더 자연스럽습니다. 또한 인용문 안의 절들을 분명히 나누고 “그러니”를 써서 근거에서 결론으로 이어지는 흐름을 자연스럽게 드러냈습니다.
