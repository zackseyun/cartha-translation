id: NUM.16.3
reference: Numbers 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''It is too much for you'' or ''Enough of you.'' The idiom is rendered ''You have gone too far'' for clear modern English.'
    reason: lexical_alternative
  - marker: b
    text: '''the LORD'' renders the divine name YHWH (traditionally vocalized ''Yahweh'').'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 모세와 아론에게로 모여들어 그들에게 말했습니다. “너희는 분수를 넘었습니다! 온 회중, 곧 그들 모두가 거룩하고 야훼께서 그들 가운데 계시는데, 어찌하여 너희가 야훼의 회중 위에 스스로 높아집니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 “너희에게는 충분하다” 또는 “너희는 충분하다”의 뜻이지만, 현대 한국어에서는 “분수를 넘었습니다”가 책망의 힘을 더 자연스럽게 전달합니다.
    reason: lexical_alternative
  - marker: b
    text: YHWH는 편집 지침에 따라 한국어 본문에서 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  english_pob_choice: They assembled
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  - 함께 모였습니다
  lexicon: HALOT
  rationale: קהל의 집합 동사를 자연스러운 현대 한국어로 옮기되, 본문이 모세와 아론을 향한 대립적 집합이라는 점은 다음 전치사로 드러나므로 여기서는 중립적인 ‘모여들어’를 택했습니다.
- source_word: רַב לָכֶם
  english_pob_choice: You have gone too far!
  chosen_korean: 너희는 분수를 넘었습니다!
  alternatives_korean:
  - 너희에게는 너무 많습니다!
  - 그만하면 충분합니다!
  - 너희는 지나쳤습니다!
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설적 책망을 현대 한국어에서 가장 자연스럽게 살리면서, 단순한 양적 표현보다 ‘한계를 넘은’ 비난의 뉘앙스를 전달했습니다.
- source_word: קְדֹשִׁים
  english_pob_choice: holy
  chosen_korean: 거룩하고
  alternatives_korean:
  - 성결하고
  - 구별되고
  - 성스럽고
  lexicon: HALOT
  rationale: קדושׁ의 표준적 종교 어휘를 따르되, 회중 전체의 정체성에 대한 주장이라는 점을 드러내기 위해 ‘거룩하고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 편집 지침에 따라 신성 4문자 YHWH는 한국어 본문에서 ‘야훼’로 일관되게 옮겼습니다.
- source_word: וּמַדּוּעַ
  english_pob_choice: So why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 그러면 왜
  - 그렇다면 왜
  lexicon: HALOT
  rationale: 앞선 진술을 근거로 삼아 던지는 반문이므로, 논리적 연결을 유지하는 ‘어찌하여’가 가장 적절합니다.
- source_word: תִּתְנַשְּׂאוּ
  english_pob_choice: do you exalt yourselves
  chosen_korean: 스스로 높아집니까
  alternatives_korean:
  - 자기를 높입니까
  - 교만해집니까
  - 우쭐해집니까
  lexicon: HALOT
  rationale: Hitpael의 자기 고양 의미를 살리되, 한국어에서 지나치게 해석적인 ‘교만하다’보다 동작성을 유지하는 표현을 택했습니다.
- source_word: עַל קְהַל יְהוָה
  english_pob_choice: above the assembly of Yahweh
  chosen_korean: 야훼의 회중 위에
  alternatives_korean:
  - 야훼의 회중보다
  - 야훼의 회중을 넘어
  - 야훼의 회중 위로
  lexicon: HALOT
  rationale: קהל은 여기서 제도적 ‘교회’가 아니라 집합된 백성을 가리키므로 ‘회중’으로 옮겼고, עַל의 우위 의미는 ‘위에’로 보존했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: YHWH는 본문과 주해 지침에 따라 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 하나님의 이름을 사용하므로 칭호로 대체하지 않고 고유한 신적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 회중의 ‘거룩함’ 진술
  chosen_reading: “온 회중, 곧 그들 모두가 거룩하고”를 화자의 주장으로 직역했습니다.
  alternative_readings:
  - ‘거룩하다고 주장하고’
  - ‘거룩한 사람들인데’
  rationale: 본문의 긴장을 풀어 설명하지 않고, 고라 무리가 실제로 한 주장 자체를 그대로 전달했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
