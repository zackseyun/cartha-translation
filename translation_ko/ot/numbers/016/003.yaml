  to: 그들이 모세와 아론을 대적하여 함께 모여 그들에게 말했습니다. “너희는 분수를 넘었습니다!”[a] “온 회중은 모두 거룩하며, 야훼께서 그들 가운데 계십니다.”[b] “그러니 어찌하여 너희가 야훼의 회중 위에 스스로를 높입니까?”
