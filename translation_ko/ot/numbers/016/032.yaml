id: NUM.16.32
reference: Numbers 16:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
  footnotes:
  - marker: a
    text: Or 'their houses.' The Hebrew can refer either to the physical houses or, by extension, to their households.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the people who belonged to Korah.' The Hebrew reads 'every man who belonged to Korah,' using אָדָם in a collective expression.
    reason: alternative_reading
translation:
  language: ko
  text: 땅이 입을 벌려 그들과 그들의 집안[a], 고라에게 속한 모든 사람[b], 그리고 그들의 모든 소유를 삼켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 집들’. 히브리어는 물리적 집을 가리킬 수도 있고, 확장하여 집안이나 가정을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고라에게 속한 모든 남자’. 히브리어는 אָדָם을 집합적으로 사용하여 문자적으로는 ‘고라에게 속한 모든 남자’라고 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ
  english_pob_choice: the earth opened
  chosen_korean: 땅이 입을 벌려
  alternatives_korean:
  - 땅이 열려
  - 땅이 갈라져
  lexicon: WLC פתח; אֶרֶץ
  rationale: 히브리어는 땅이 ‘입’을 여는 강한 의인화 이미지를 쓰므로, 단순한 ‘열리다’보다 ‘입을 벌려’가 원문의 생생한 형상을 더 직접적으로 살립니다.
- source_word: אֶת פִּיהָ
  english_pob_choice: its mouth
  chosen_korean: 입을
  alternatives_korean:
  - 입을 벌린
  - 그 입을
  lexicon: HALOT פֶּה
  rationale: ‘입’이라는 은유를 유지하되 한국어에서는 소유격을 반복하기보다 자연스럽게 연결해 원문의 영상성을 살렸습니다.
- source_word: בָּתֵּיהֶם
  english_pob_choice: their households
  chosen_korean: 그들의 집안과
  alternatives_korean:
  - 그들의 집들을
  - 그들의 가문과
  lexicon: HALOT בַּיִת
  rationale: 문맥상 단순 건물보다 가족 단위까지 포함하는 의미가 강하므로 ‘집안’이 가장 적절합니다. POB의 ‘households’도 이 넓은 범위를 반영합니다.
- source_word: כָּל הָאָדָם אֲשֶׁר לְקֹרַח
  english_pob_choice: all the people who belonged to Korah
  chosen_korean: 고라에게 속한 모든 사람
  alternatives_korean:
  - 고라에게 속한 모든 남자
  - 고라와 함께한 모든 사람
  lexicon: HALOT אָדָם; לְ
  rationale: 히브리어는 문법적으로는 ‘사람/남자’ 단수 집합 표현이지만, 관계를 나타내는 לְקֹרַח는 소속·연루를 뜻하므로 ‘속한’으로 옮겼습니다. 한국어에서는 집합적 의미를 살려 ‘모든 사람’으로 자연스럽게 표현했습니다.
- source_word: כָּל הָרֲכוּשׁ
  english_pob_choice: all their possessions
  chosen_korean: 그의 모든 소유
  alternatives_korean:
  - 그들의 모든 소유
  - 모든 재산
  lexicon: HALOT רְכוּשׁ
  rationale: ‘소유’는 재산 전반을 포괄하면서도 물건 중심의 의미를 유지합니다. 문장 안에서 이미 집단 전체가 언급되므로 대명사는 한국어 문맥에 맞게 단수 소유격으로 정리했습니다.
theological_decisions:
- issue: כָּל הָאָדָם의 성별화 여부
  chosen_reading: 한국어 본문은 집합적 의미를 따라 ‘모든 사람’으로 옮기되, 히브리어의 형태는 주석으로 보존합니다.
  alternative_readings:
  - ‘모든 남자’로 직역
  - ‘고라에게 속한 모든 사람들’로 완전 중립화
  rationale: 원문은 남성형 단수 집합 표현이지만, 한국어 독자는 문맥상 집단 전체를 자연스럽게 이해해야 합니다. 따라서 본문은 의미를 우선하고, 성별 표지는 주석 없이 과도하게 부각하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested forms for אָדָם
- issue: ‘그들의 집안과’의 범위
  chosen_reading: 가옥 구조와 가구/가족 단위를 함께 포함하는 넓은 의미로 읽습니다.
  alternative_readings:
  - 물리적 집만 가리킨다
  - 가족만 가리킨다
  rationale: POB의 ‘households’는 문자적 집보다 가정 단위를 더 넓게 반영합니다. 재난 서술에서는 사람과 재산이 함께 멸망하는 점이 핵심이므로 한국어도 그 포괄성을 유지해야 합니다.
  doctrine_reference: Numbers 16:32 context; lexical sense of בַּיִת
