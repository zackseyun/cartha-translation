revisions:
- from: 그들이 살아서 스올로—그들과 그들에게 속한 모든 것과 함께—내려갔으며, 땅이 그들 위를 덮었고, 그들은 회중 가운데서 사라졌습니다.[a]
  to: 그들이 살아서 스올로[a]—그들과 그들에게 속한 모든 것과 함께—내려갔으며, 땅이 그들을 덮었고, 그들은 회중 가운데서 멸망했습니다.
  rationale: 스올의 음역과 ‘그들에게 속한 모든 것’의 넓은 지시 범위는 유지했습니다. 다만 한국어 표현을 바로잡아 땅이 그들을 덮었다는 뜻을 명확히 하고, אבד의 멸망 의미를 반영했으며, 각주 표지를 ‘스올’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:49Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그들 위를 덮었고’는 히브리어 עֲלֵיהֶם을 기계적으로 반영하여 한국어로는 부자연스럽고, ‘땅이 그들을 덮었다’가 원문의 사건을 정확히 전달합니다. וַיֹּאבְדוּ는 단순히 보이지 않게 되었다는 뜻보다 ‘멸망했다/망했다’의 판단 의미를 지니므로 이를 명시하는 편이 적절합니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽습니다. 다만 ‘땅이 그들 위를 덮었고’는 현대 표준어에서 어색하므로 ‘땅이 그들을 덮었으며’로 고치는 것이 자연스럽습니다. 각주 표지는 해당 어휘인 ‘스올’ 바로 뒤에 두어야 합니다.
  terminology: ‘스올’ 음역은 שְׁאֹל의 의미 범위를 보존하며 적절합니다. ‘회중’도 קָהָל에 맞는 정착된 성서 용어입니다. ‘멸망했습니다’는 여기서 אבד의 결과적 의미를 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: ‘땅이 그들 위를 덮었고’
    rationale: 한국어에서는 땅이 사람들을 덮는 사건을 ‘그들을 덮었다’라고 표현합니다. ‘그들 위를 덮다’는 무엇인가가 그들 위의 표면을 덮는 듯한 의미가 되어 부자연스럽습니다.
  - severity: medium
    issue: וַיֹּאבְדוּ를 ‘사라졌습니다’로 번역
    rationale: ‘사라지다’는 단순한 소멸·실종으로도 이해될 수 있습니다. 문맥과 동사의 의미상 ‘멸망했습니다’가 더 충실합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 ‘스올’의 어휘 대안을 설명하므로 문장 끝이 아니라 ‘스올’ 직후에 배치해야 참조 대상이 분명합니다.
  revised_text: 그들이 살아서 스올로[a]—그들과 그들에게 속한 모든 것과 함께—내려갔으며, 땅이 그들을 덮었고, 그들은 회중 가운데서 멸망했습니다.
  revised_footnotes:
