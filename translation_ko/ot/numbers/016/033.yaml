    text: 또는 ‘무덤’, ‘죽은 자의 영역’. 히브리어 ‘스올’.
    reason: lexical_alternative
  revision_rationale: 스올의 음역과 ‘그들에게 속한 모든 것’의 넓은 지시 범위는 유지했습니다. 다만 한국어 표현을 바로잡아 땅이 그들을 덮었다는 뜻을 명확히 하고, אבד의 멸망 의미를 반영했으며, 각주 표지를 ‘스올’에 붙였습니다.
