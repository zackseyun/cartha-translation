  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' Hebrew 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 살아서 스올로—그들과 그들에게 속한 모든 것과 함께—내려갔으며, 땅이 그들 위를 덮었고, 그들은 회중 가운데서 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’, ‘죽은 자의 영역’. 히브리어 ‘스올’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려갔으며
  alternatives_korean:
  - 내려갔고
  - 내려왔으며
  lexicon: HALOT
  rationale: ירד의 기본 의미인 ‘내려가다’를 자연스러운 서술체로 살렸습니다.
- source_word: שְׁאֹלָה
  english_pob_choice: into Sheol
  chosen_korean: 스올로
  alternatives_korean:
  - 무덤으로
  - 죽은 자의 세계로
  - 지하세계로
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 무덤보다 넓은 죽은 자의 영역을 가리키므로, 의미를 좁히지 않고 음역했습니다.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  english_pob_choice: the earth covered them
  chosen_korean: 땅이 그들 위를 덮었고
  alternatives_korean:
  - 땅이 그들을 덮었고
  - 땅이 그들 위를 덮어
  lexicon: HALOT
  rationale: 히브리어의 ‘~위에’(עַל) 뉘앙스를 살려 ‘그들 위를’로 옮겼습니다.
- source_word: מִתּוֹךְ הַקָּהָל
  english_pob_choice: from the midst of the assembly
  chosen_korean: 회중 가운데서
  alternatives_korean:
  - 회중 한가운데서
  - 모임 가운데서
  - 회중 가운데로부터
  lexicon: HALOT
  rationale: קָהָל을 ‘회중’으로 옮겨 공동체적 맥락을 유지하고, 관용구 מִתּוֹךְ은 ‘가운데서’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: שְׁאֹל의 번역 범위
  chosen_reading: 스올로
  alternative_readings:
  - 무덤으로
  - 죽은 자의 세계로
  - 지하세계로
  rationale: 본문은 매장 장소보다 죽은 자들의 영역을 말하므로, 전통적 교회어 ‘무덤’으로 좁히지 않고 음역을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
