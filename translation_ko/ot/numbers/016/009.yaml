source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
  footnotes:
  - marker: a
    text: Or 'Is it not enough for you...?' The Hebrew idiom can be rendered either as 'Is it too small a thing' or more dynamically as 'Is it not enough.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 하나님께서 너희를 이스라엘 회중 가운데서 구별하여 자기에게 가까이 나아오게 하시고, 야훼의 성막에서 섬기는 일을 하게 하시며, 회중 앞에 서서 그들을 섬기게 하신 것이 너희에게는 너무 작은 일입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게는 충분하지 않습니까?’ 히브리어 관용구는 ‘너무 작은 일입니까?’ 또는 더 의역하여 ‘충분하지 않습니까?’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  english_pob_choice: Is it too small a thing for you
  chosen_korean: 너희에게는 너무 작은 일입니까?
  alternatives_korean:
  - 그것이 너희에게는 작은 일입니까?
  - 그것으로 너희는 충분하지 않습니까?
  lexicon: HALOT
  rationale: 히브리어 관용적 수사 의문을 한국어로 자연스럽게 살리되, 이미 받은 특권을 하찮게 여기는 뉘앙스를 유지했습니다.
- source_word: הִבְדִּיל
  english_pob_choice: has separated
  chosen_korean: 가르사
  alternatives_korean:
  - 구별하사
  - 떼어 놓으사
  lexicon: HALOT
  rationale: בדל의 인과적 분리 의미를 반영하면서도, 제의적·언약적 분리의 뉘앙스를 전하는 고전적 한국어를 택했습니다.
- source_word: עֲדַת יִשְׂרָאֵל
  english_pob_choice: the congregation of Israel
  chosen_korean: 이스라엘 회중
  alternatives_korean:
  - 이스라엘 공동체
  - 이스라엘 모임
  lexicon: HALOT
  rationale: עֵדָה는 모인 공동체를 가리키므로, 예배·언약 맥락을 유지하는 ‘회중’이 적절합니다.
- source_word: מִשְׁכַּן יְהוָה
  english_pob_choice: the tabernacle of Yahweh
  chosen_korean: 야훼의 성막
  alternatives_korean:
  - 야훼의 장막
  - 주님의 성막
  lexicon: HALOT
  rationale: מִשְׁכָּן의 제의적 의미를 ‘성막’으로 옮기고, 신명은 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לְשָׁרְתָם
  english_pob_choice: to minister to them
  chosen_korean: 그들에게 시중들게
  alternatives_korean:
  - 그들을 섬기게
  - 그들에게 봉사하게
  lexicon: HALOT
  rationale: שרת의 공적 보좌·시중 의미를 살리기 위해, 단순한 ‘섬기다’보다 관계적·직무적 뉘앙스가 있는 표현을 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기적 고유명사가 직접 나타나므로, POB 원칙에 따라 칭호 대체 없이 신명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לְהַקְרִיב אֶתְכֶם אֵלָיו의 관계적·제의적 의미
  chosen_reading: 너희를 자기에게 가까이 오게 하여
  alternative_readings:
  - 너희를 자기 앞에 바쳐
  - 너희를 자기에게 데려와
  rationale: 이 동사는 단순한 이동이 아니라 여호와께 더 가까이 불러 세우는 제의적 근접성을 나타내므로, 자기 지향의 친밀한 접근으로 옮겼습니다.
  doctrine_reference: HALOT קרב usage in cultic contexts
