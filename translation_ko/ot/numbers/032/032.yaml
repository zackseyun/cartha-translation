    rationale: ‘요단 저편’은 어느 쪽을 기준으로 하느냐에 따라 달라질 수 있습니다. 본문 선택의 문맥상 근거와 ‘요단 건너편’ 등의 대안을 각주에 밝혀 모호성을 보존해야 합니다.
