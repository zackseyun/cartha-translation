source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
  footnotes:
  - marker: a
    text: Or 'beyond the Jordan' or 'across the Jordan'; the Hebrew expression is perspective-dependent. Here 'on this side of the Jordan' reflects the speakers' location east of the river.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 스스로 무장하고 야훼 앞에서 가나안 땅으로 건너가겠으며, 우리에게는 요단 저편에 있는 우리 기업의 소유가 함께 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요단 저편’은 화자들의 현재 위치를 기준으로 한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: נַעֲבֹר
  english_pob_choice: will cross over
  chosen_korean: 건너가겠으며
  alternatives_korean:
  - 건너갈 것입니다
  - 지나가겠습니다
  lexicon: HALOT
  rationale: 미래의 결의와 이동을 함께 살리기 위해 ‘건너가겠으며’로 옮겼습니다.
- source_word: חֲלוּצִים
  english_pob_choice: armed
  chosen_korean: 무장하고
  alternatives_korean:
  - 전투 태세를 갖추고
  - 전투 준비를 하고
  lexicon: HALOT
  rationale: 군사적 준비 상태를 간결하게 드러내는 현대어로 ‘무장하고’를 선택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 면전에
  - 야훼의 임재 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי의 관계적·공간적 의미를 살려 ‘앞에서’로 옮기고, 본문 표준 용례에 따라 하나님의 이름은 ‘야훼’로 렌더링했습니다.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: on this side of the Jordan
  chosen_korean: 요단 저편에 있는
  alternatives_korean:
  - 요단 건너편에 있는
  - 요단을 넘어
  lexicon: HALOT
  rationale: 문맥상 화자들의 현재 위치를 전제하는 표현이므로, 그 지시성을 자연스럽게 살려 ‘요단 저편에 있는’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에서는 ‘야훼’로 직역해 언약 სახელ칭을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 יְהוָה를 직접 사용하므로, 서술을 완화하지 않고 고유 신명성을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
