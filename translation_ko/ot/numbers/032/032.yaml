  source_fidelity: 원문의 강조된 1인칭 복수 대명사와 미래의 서약, 전투 준비, ‘야훼 앞에서’, 그리고 요단에 관한 관점 의존적 지시 표현을 대체로 반영합니다. 다만 ‘우리는 스스로 무장하고’는 대명사 강조를 자기 무장 행위로 오해하게 할 수 있고, ‘우리에게는 … 소유가 함께 있을 것입니다’는 원문의 소유·상속 관계를 한국어에서 부자연스럽게 전달합니다.
  naturalness: 현행 문장은 후반부의 ‘우리에게는 … 함께 있을 것입니다’가 현대 표준어 합쇼체에서 어색합니다. ‘우리가 직접’으로 강조를 자연스럽게 처리하고, 상속받을 소유지가 그들에게 귀속됨을 명료하게 표현하는 편이 좋습니다.
  terminology: ‘야훼’, ‘가나안’, ‘요단’은 일관되고 적절합니다. אֲחֻזַּת נַחֲלָתֵנוּ는 단순한 ‘기업의 소유’보다 ‘유산으로 받을 소유지’가 한국어에서 자연스럽고 두 요소를 모두 보존합니다. מֵעֵבֶר לַיַּרְדֵּן은 관점 의존적이므로 본문에서는 화자들의 위치에 따른 ‘요단 이쪽’을 사용하되, 각주에서 대안을 밝혀야 합니다.
