- from: 르우벤 자손과 갓 자손은 매우 많은 가축을 가지고 있었는데, 그들이 야셀의 땅과 길르앗의 땅을 보니, 보라, 그곳은 가축을 기르기에 알맞은 곳이었습니다.[a][b]
  to: 르우벤 자손과 갓 자손[a]에게는 매우 많은 가축이 있었습니다. 그들은 야셀 땅과 길르앗 땅을 보았습니다. 보십시오,[b] 그곳은 가축을 기르기에 알맞은 곳이었습니다.
  rationale: The revision avoids adding a temporal/consequential relation to the narrative verb, updates the attention marker to modern formal-polite Korean, corrects the semantic direction of footnote b’s alternative, and relocates both footnote anchors to their relevant expressions. It retains the source’s emphasis on abundant livestock and its repeated-place construction in natural Korean.
