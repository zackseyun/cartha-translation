base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: Now the sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
  footnotes:
  - marker: a
    text: Or 'the Reubenites and the Gadites.' The Hebrew reads literally 'the sons of Reuben and the sons of Gad.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''the place was suitable for livestock.'' The Hebrew repeats ''place'' for emphasis: ''the place was a place for livestock.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 자손과 갓 자손[a]에게는 매우 많은 가축이 있었습니다. 그들은 야셀 땅과 길르앗 땅을 보았습니다. 보십시오,[b] 그곳은 가축을 기르기에 알맞은 곳이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르우벤 지파 사람들과 갓 지파 사람들’. 히브리어는 문자적으로 ‘르우벤의 아들들과 갓의 아들들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳은 가축을 위한 곳이었습니다’. 히브리어는 강조를 위해 ‘곳’을 반복하여 문자적으로 ‘그곳은 가축을 위한 곳’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב
  english_pob_choice: a very great amount of livestock
  chosen_korean: 매우 많은 가축
  alternatives_korean:
  - 많은 가축
  - 풍부한 가축
  - 매우 큰 가축 떼
  lexicon: HALOT
  rationale: מִקְנֶה는 가축/축산 자산을 가리키며, רַב는 그 양의 많음을 강조하므로 현대 한국어에서는 자연스럽게 ‘매우 많은 가축’으로 옮겼습니다.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  english_pob_choice: the sons of Reuben and the sons of Gad
  chosen_korean: 르우벤 자손과 갓 자손
  alternatives_korean:
  - 르우벤의 아들들과 갓의 아들들
  - 르우벤 사람들과 갓 사람들
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘르우벤의 아들들’과 ‘갓의 아들들’이지만, 여기서는 지파 명칭이므로 한국어 독자에게 자연스러운 ‘자손’ 표현을 사용했습니다.
- source_word: וַיִּרְאוּ
  english_pob_choice: and they saw
  chosen_korean: 그들이 … 보니
  alternatives_korean:
  - 그들이 보고
  - 그리고 그들이 보았고
  lexicon: HALOT
  rationale: 서술 진행을 살리면서도 한국어 문맥상 원인·발견의 흐름이 드러나도록 ‘보니’로 옮겼습니다.
- source_word: וְהִנֵּה הַמָּקוֹם מְקוֹם מִקְנֶה
  english_pob_choice: and behold, the place was a place for livestock
  chosen_korean: 보라, 그곳은 가축을 기르기에 알맞은 곳이었습니다
  alternatives_korean:
  - 보라, 그곳은 가축을 위한 곳이었습니다
  - 보라, 그곳은 가축의 장소였습니다
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘곳/장소’ 구조는 의미상 ‘가축에 적합함’을 드러내므로, 반복을 완전히 무너뜨리지 않으면서도 한국어로는 자연스러운 ‘가축을 기르기에 알맞은 곳’으로 옮겼습니다.
