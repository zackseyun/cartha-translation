  - severity: medium
    issue: ‘양 떼’가 צֹאן의 의미 범위를 좁힙니다.
    rationale: צֹאן은 통상 양과 염소를 포함하는 작은 가축 떼를 가리키므로 ‘가축 떼’가 더 충실합니다.
  - severity: low
    issue: ‘우리들을 짓고’는 한국어에서 다소 어색합니다.
    rationale: 축산용 enclosure는 ‘우리’를 집합적으로 쓸 수 있으며, ‘가축 떼를 위한 우리를 세우고’가 자연스럽습니다.
