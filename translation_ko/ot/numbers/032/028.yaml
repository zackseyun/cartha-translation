id: NUM.32.28
reference: Numbers 32:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
  footnotes:
  - marker: a
    text: Or 'commanded them,' taking 'them' as the leaders named in the verse rather than as the tribes mentioned previously.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heads of the fathers’ houses of the tribes of the sons of Israel,' an administrative expression for Israel’s clan and tribal leaders.
    reason: cultural_note
translation:
  language: ko
  text: 모세는 제사장 엘르아살과 눈의 아들 여호수아와 이스라엘 자손의 지파들에 속한 조상 가문의 우두머리들에게 그들에 관하여[a] 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들에게 명령했습니다.” 히브리어의 ‘그들’은 앞 문맥의 르우벤 자손과 갓 자손을 가리켜 “그들에 관하여”로 이해할 수 있으나, 이 절에 열거된 지도자들을 가리키는 것으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded / gave orders
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 명하셨습니다
  lexicon: HALOT
  rationale: צוה는 권위를 가진 명령을 뜻하므로, 현대 한국어에서는 가장 직접적인 대응인 ‘명령했습니다’가 문맥의 행정적·권위적 성격을 잘 살립니다.
- source_word: לָהֶם
  english_pob_choice: concerning them
  chosen_korean: 그들에 관하여
  alternatives_korean:
  - 그들에게
  - 그들에 대해
  lexicon: HALOT
  rationale: 대명사 ‘그들’은 앞문맥의 르우벤 지파와 갓 지파를 가리키므로, 명령의 대상이 아니라 그들에 대한 지시임을 드러내기 위해 ‘그들에 관하여’로 옮겼습니다.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן / יְהוֹשֻׁעַ בִּן־נוּן / רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  english_pob_choice: Eleazar the priest / Joshua son of Nun / the heads of the fathers’ houses of the tribes
  chosen_korean: 제사장 엘르아살과, 눈의 아들 여호수아와, 이스라엘 자손의 지파들의 조상 가문의 우두머리들
  alternatives_korean:
  - 제사장 엘르아살과, 눈의 아들 여호수아와, 지파들의 조상 가문의 우두머리들
  - 제사장 엘르아살과, 눈의 아들 여호수아와, 지파들의 족장들
  lexicon: HALOT
  rationale: ‘제사장’과 ‘눈의 아들’은 고유한 신분·계보 표지이므로 그대로 살렸고, רָאשֵׁי אֲבוֹת הַמַּטּוֹת는 행정적 표현이라 ‘지파들의 조상 가문의 우두머리들’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 명령의 수신자와 명령의 대상 구분
  chosen_reading: 모세가 엘르아살, 여호수아, 그리고 지파 지도자들에게 명령하여, 그들에 관한 조치를 지시한 것으로 읽었습니다.
  alternative_readings:
  - 모세가 그들에게 직접 명령했다
  - 모세가 그들에 관하여 그 지도자들에게 명령했다
  rationale: 히브리어 문장은 사람들을 먼저 제시한 뒤, 목적어 대명사 ‘그들’이 앞선 지파들을 가리키는 구조이므로, 한국어에서도 수신자와 대상의 구분이 흐려지지 않도록 했습니다.
  doctrine_reference: 문법적·서사적 정확성
