id: NUM.32.17
reference: Numbers 32:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
  footnotes:
  - marker: a
    text: Or 'ahead of the Israelites'; the phrase literally reads 'before the sons of Israel' and likely refers to going in front of them in battle.
    reason: lexical_alternative
  - marker: b
    text: '''Our little ones'' refers broadly to children and dependents.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 우리 자신은 이스라엘 자손[a] 앞에서 재빨리 무장하여, 우리가 그들을 그들의 곳[b]으로 데려오기까지 하겠습니다. 그리고 우리의 어린 것들은 그 땅의 주민들 때문에 견고한 성읍들에 머물 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘인들보다 앞서’. 이 표현은 문자적으로는 ‘이스라엘 자손 앞에서’이며, 전투에서 그들보다 앞장서 간다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들의 곳’은 거주지나 정착지를 넓게 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ חֻשִׁים
  english_pob_choice: will arm ourselves quickly
  chosen_korean: 재빨리 무장하여
  alternatives_korean:
  - 서둘러 무장하여
  - 신속히 무장하여
  lexicon: HALOT
  rationale: נֵחָלֵץ의 자기-준비 뉘앙스와 חֻשִׁים의 신속함을 함께 살리되, 한국어에서는 중복을 피하고 자연스럽게 압축해 옮겼습니다.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: before the sons of Israel
  chosen_korean: 이스라엘 자손 앞에서
  alternatives_korean:
  - 이스라엘 자손보다 앞서
  - 이스라엘 사람들 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 아들들 앞에서’이지만, 한국어 성경 문맥에서는 ‘이스라엘 자손’이 원문 표현을 살리면서도 자연스럽습니다.
- source_word: אֶל מְקוֹמָם
  english_pob_choice: to their place
  chosen_korean: 그들의 곳
  alternatives_korean:
  - 그들의 자리
  - 그들의 거처
  lexicon: HALOT
  rationale: מָקוֹם을 너무 좁게 ‘거처’로 특정하지 않고, POB의 절제된 처리에 맞춰 넓은 의미의 ‘곳’으로 두었습니다.
- source_word: טַפֵּנוּ
  english_pob_choice: our little ones
  chosen_korean: 우리의 어린 것들
  alternatives_korean:
  - 우리 아이들
  - 우리의 자녀들
  - 우리의 어린이들
  lexicon: HALOT
  rationale: טַף는 단순한 ‘아이들’보다 자녀와 부양가족을 아우를 수 있어, POB의 주석 취지를 살려 범위를 넓게 드러내는 ‘어린 것들’로 옮겼습니다.
- source_word: בְּעָרֵי הַמִּבְצָר
  english_pob_choice: in the fortified cities
  chosen_korean: 견고한 성읍들에
  alternatives_korean:
  - 요새화된 성읍들에
  - 견고한 도시들에
  lexicon: HALOT
  rationale: ‘성읍’은 고대 도시 개념을 살리고, ‘fortified’는 한국어에서 관용적인 ‘견고한’으로 옮겨 방어 시설의 의미를 전달했습니다.
theological_decisions:
- issue: 전투 선봉/전방 진행의 의미
  chosen_reading: ‘이스라엘 자손 앞에서’라는 위치 표현을 유지해, 단순한 시간적 선행이 아니라 전투에서 앞장서는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘이스라엘 사람들보다 앞서’
  - ‘이스라엘보다 먼저’
  rationale: 원문 preposition לִפְנֵי는 공간적·전투적 전진을 함께 암시하므로, 의미를 약화시키지 않는 쪽으로 번역했습니다.
  doctrine_reference: 본문 주해상의 위치·행동 의미 보존
- issue: טַף의 범위
  chosen_reading: ‘우리의 어린 것들’로 옮겨 자녀뿐 아니라 부양가족까지 포함될 수 있는 넓은 범위를 남겼습니다.
  alternative_readings:
  - ‘우리 아이들’
  - ‘우리의 자녀들’
  rationale: POB의 주석이 밝히듯 טַף는 좁은 연령 범주보다 의존하는 식구 전체를 가리킬 수 있으므로, 과도한 축소를 피했습니다.
  doctrine_reference: 본문 문화적 의미 보존
