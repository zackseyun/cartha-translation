review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어 טַפֵּנוּ는 ‘어린 것들’이라는 사물화된 표현보다 ‘우리의 어린 자녀들’로 옮기는 것이 자연스럽고 정확합니다. 문맥상 전투에서 앞장서는 의미는 각주로 보존할 수 있습니다.
  naturalness: ‘우리의 어린 것들’은 현대 표준 한국어, 특히 합쇼체 성경 문체에서 부자연스럽고 사람을 지칭하는 말로 부적절하게 들릴 수 있습니다. 또한 ‘견고한 성읍’보다 방어 시설을 뜻하는 ‘요새화된 성읍’이 더 분명합니다.
  terminology: ‘이스라엘 자손’, ‘성읍’은 적절합니다. טַף는 자녀와 일부 부양가족을 포괄할 수 있으나, 본문에서는 자연스러운 ‘어린 자녀들’을 사용하고 그 넓은 범위는 각주에서 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘우리의 어린 것들’이라는 표현
    rationale: טַף는 사람들, 특히 어린 자녀들을 가리킵니다. ‘어린 것들’은 현대 한국어에서 사물화하거나 부자연스럽게 들리므로, 본문의 인물 지시와 격식 있는 문체에 맞지 않습니다.
  - severity: low
    issue: ‘견고한 성읍들’의 의미 명료성
    rationale: הַמִּבְצָר는 방어가 갖추어진 곳을 가리킵니다. ‘견고한’도 가능하지만 물리적 견고함으로 읽힐 수 있어 ‘요새화된’이 방어적 의미를 더 직접적으로 전달합니다.
  revised_text: 그러나 우리는 이스라엘 자손[a] 앞에서 재빨리 무장하여, 그들을 그들의 곳[b]으로 데려갈 때까지 앞장서겠습니다. 그리고 우리의 어린 자녀들은 그 땅 주민들 때문에 요새화된 성읍들에 머물 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손보다 앞서’. 이 표현은 문자적으로 ‘이스라엘 자손 앞에서’이며, 전투에서 그들보다 앞장서 간다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 곳’은 그들이 거주하거나 정착할 곳을 넓게 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘어린 자녀들’에 해당하는 말은 자녀뿐 아니라 부양가족까지 넓게 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 본문의 전투 선봉 의미를 ‘앞장서겠습니다’로 명시하되, 전치사의 문자적 표현과 대안은 각주 a에 보존했습니다. 부자연스럽고 사물화될 수 있는 ‘어린 것들’을 ‘어린 자녀들’로 바로잡고, 히브리어 단어의 더 넓은 포괄 범위는 새 각주 c로 보완했습니다. ‘요새화된 성읍들’은 원문의 방어 시설 의미를 더 명료하게 전달합니다.
