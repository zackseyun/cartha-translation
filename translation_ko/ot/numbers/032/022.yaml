- from: 그리고 그 땅이 야훼 앞에서 정복되면, 그때에는 당신들이 돌아와 야훼와 이스라엘에 대해 책임에서 벗어나게 될 것입니다[a]. 이 땅은 야훼 앞에서 당신들의 소유가 될 것입니다.
  to: 그리고 그 땅이 야훼 앞에서 정복되면, 그 후에 여러분은 돌아와 야훼와 이스라엘에 대하여 책임이 없게 될 것입니다[a]. 그러면 이 땅은 야훼 앞에서 여러분의 소유가 될 것입니다.
  rationale: ‘그 후에’로 원문의 순차성을 분명히 하고, נָקִי와 מן의 법적·관계적 용법을 ‘야훼와 이스라엘에 대하여 책임이 없게 되다’로 옮겼습니다. 이는 군사적 서약을 이행한 뒤 책임에서 면제된다는 문맥을 보존하면서도, 원어가 허용하는 ‘무죄/결백’의 대안은 각주에 남깁니다.
  reviewer_model: gpt-5.6-terra
