source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
  footnotes:
  - marker: a
    text: Or 'guiltless' or 'innocent' before the LORD and before Israel.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 땅이 야훼 앞에서 정복되면, 그 후에 여러분은 돌아와 야훼와 이스라엘에 대하여 책임이 없게 될 것입니다[a]. 그러면 이 땅은 야훼 앞에서 여러분의 소유가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무죄한 사람이 되다’ 또는 ‘결백한 사람이 되다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  english_pob_choice: is subdued
  chosen_korean: 정복되면
  alternatives_korean:
  - 제압되면
  - 굴복되면
  - 통제되면
  lexicon: HALOT
  rationale: נכבשׁ의 피동/결과적 의미를 한국어에서 자연스럽게 옮기면서, 땅이 완전히 장악되는 상태를 드러내기 위해 ‘정복되면’을 선택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 면전에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·법정적 뉘앙스를 살려 ‘앞에서’로 옮겼고, YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
- source_word: וִהְיִיתֶם נְקִיִּים
  english_pob_choice: be free of obligation
  chosen_korean: 책임에서 벗어나게 될 것입니다
  alternatives_korean:
  - 무죄하게 될 것입니다
  - 결백하게 될 것입니다
  - 의무에서 벗어나게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 전쟁 의무를 다한 뒤의 책임 해제이므로, נָקִי의 ‘죄 없음’보다 ‘책임/의무에서 벗어남’의 법적·관계적 의미를 드러내는 표현을 택했습니다.
- source_word: לַאֲחֻזָּה
  english_pob_choice: as a possession
  chosen_korean: 소유가
  alternatives_korean:
  - 소유지로
  - 기업으로
  - 유산으로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 땅의 소유·점유를 가리키므로, 자연스러운 현대 한국어로 ‘소유’라고 옮겼습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사 יְהוָה를 제목어로 바꾸지 않고 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해, 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → 야훼'
- issue: נְקִיִּים의 covenant liability sense
  chosen_reading: 책임에서 벗어나게 될 것입니다
  alternative_readings:
  - 무죄하게 될 것입니다
  - 결백하게 될 것입니다
  - 허물이 없게 될 것입니다
  rationale: 이 절은 도덕적 무죄 선언이 아니라 야훼와 이스라엘 앞에서의 군사적·서약적 책임 해제를 말하므로, 독자가 오해하지 않도록 법적 책임의 해제라는 뜻을 살렸습니다.
  doctrine_reference: Numbers 32:22 covenant obligation context
