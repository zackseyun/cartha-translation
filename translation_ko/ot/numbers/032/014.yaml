id: NUM.32.14
reference: Numbers 32:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
  footnotes:
  - marker: a
    text: Or 'an increase of sinful men' or 'offspring of sinful men.' The Hebrew תַּרְבּוּת can denote increase or progeny; 'a brood' is chosen to convey the rebuking tone in context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the burning of the nose of the LORD,' a Hebrew idiom for intense anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 너희는 너희 조상들의 자리를 이어 일어나, 죄인들의 한 무리가 되어, 이스라엘에 대한 야훼의 타오르는 진노를 또다시 더하려 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄인들의 증가’나 ‘죄인들의 자손’로도 옮길 수 있습니다. 히브리어 תַּרְבּוּת는 증가나 후손을 뜻할 수 있으며, 여기서는 책망의 어조를 살리기 위해 ‘한 무리’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 코의 타오름’이라는 관용구로, 극도의 분노를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 자 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄적 도입어로서, 문맥의 경고성과 긴박감을 살리기 위해 합쇼체의 직접적 호소인 ‘보십시오’를 택했습니다.
- source_word: תַּחַת אֲבֹתֵיכֶם
  english_pob_choice: in your fathers’ place
  chosen_korean: 너희 조상들의 자리를 이어
  alternatives_korean:
  - 너희 조상들 대신
  - 너희 조상들 아래
  - 너희 조상들의 뒤를 이어
  lexicon: HALOT
  rationale: 단순한 물리적 ‘아래’가 아니라 세대적 계승을 가리키므로, 문맥에 맞게 ‘자리를 이어’로 옮겨 ‘대신/뒤를 이어’의 계승 의미를 살렸습니다.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  english_pob_choice: a brood of sinful men
  chosen_korean: 죄인들의 한 무리
  alternatives_korean:
  - 죄 많은 남자들의 한 무리
  - 죄인들의 증가
  - 죄인들의 자손
  lexicon: HALOT
  rationale: תַּרְבּוּת의 ‘증가/자손’ 가능성을 열어 두되, 여기서는 책망의 뉘앙스가 강하므로 ‘한 무리’로 번역해 집단적 파생과 비난의 어조를 함께 살렸습니다. 영어 POB의 ‘brood’에 대응하는 한국어로도 자연스럽습니다.
- source_word: חֲרוֹן אַף יְהוָה
  english_pob_choice: the burning anger of Yahweh
  chosen_korean: 야훼의 타오르는 진노
  alternatives_korean:
  - 야훼의 불타는 분노
  - 야훼의 타오르는 노여움
  - 야훼의 불같은 진노
  lexicon: HALOT
  rationale: 히브리어의 ‘불타는 코’ 관용구를 한국어에서 직역하면 어색하므로, 이미지를 유지하면서도 자연스러운 ‘타오르는 진노’로 옮겼습니다. 신명은 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
theological_decisions:
- issue: 여호와/야훼 번역
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유한 언약 이름을 보존하기 위해 제목형 대체어가 아닌 음역을 사용했습니다. 이는 본문의 신학적 구별성과 직결됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘아들들/남자들’의 성별 표지 보존
  chosen_reading: אֲנָשִׁים חַטָּאִים을 ‘죄인들의 한 무리’로 옮겼습니다.
  alternative_readings:
  - 죄 많은 사람들의 한 무리
  - 죄인들
  - 악한 무리
  rationale: 히브리어 남성 복수의 표지를 한국어에서 꼭 ‘남자들’로 노출하지 않아도, 문맥상 이스라엘 지파 남성들을 향한 책망이라는 점을 훼손하지 않는 범위에서 자연스럽게 재현했습니다. 과도한 성중립화는 피하되, 한국어 가독성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
