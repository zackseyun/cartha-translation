  source_fidelity: 대체로 본문의 세대 계승, 죄 있는 집단, 야훼의 이스라엘을 향한 격렬한 진노라는 뜻을 잘 반영합니다. 그러나 ‘또다시 더하려 합니다’는 히브리어 עוֹד의 ‘더욱/더’의 강화와 לִסְפּוֹת의 결과·목적 관계를 다소 부정확하게 드러내며, 문장 전체도 원문의 책망하는 단정적 어조보다 의향 진술처럼 들립니다.
  naturalness: ‘너희 조상들의 자리를 이어 일어나’는 이해 가능하나 ‘조상들의 뒤를 이어 일어나’가 세대적 계승을 더 자연스럽게 표현합니다. 또한 ‘더욱 더하려는 자들이 되었습니다’로 마무리하면 앞선 ‘일어나 … 한 무리가 되어’와 연결되면서도 책망의 논리가 분명해집니다.
  terminology: ‘보십시오’, ‘야훼’, ‘타오르는 진노’는 현대 합쇼체와 본문의 어조에 적절합니다. ‘죄인들의 한 무리’는 תַּרְבּוּת의 문맥상 비난 어조를 무리 없이 전달합니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 합니다.
