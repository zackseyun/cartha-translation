    rationale: 각주는 네보와 바알므온에 수식적으로 붙는 מוּסַבֹּת שֵׁם을 설명하므로 해당 구절 바로 뒤에 놓아야 합니다.
  - severity: medium
    issue: ‘그 도시들의 이름을 지었습니다’는 다소 어색하고, 이름과 도시의 관계가 불명확합니다.
