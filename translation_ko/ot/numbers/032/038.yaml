  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
  footnotes:
  - marker: a
    text: Or “with changed names” / “whose names were changed.” The Hebrew phrase likely notes that Nebo and Baal-meon bore altered names.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네보와 바알므온—그 이름들이 바뀌었고—그리고 십마입니다. 그들은 자신들이 세운 그 도시들의 이름을 지었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이름이 바뀐 채로” / “그 이름들이 바뀌었다.” 히브리어 표현은 네보와 바알므온의 이름이 변경되었음을 가리키는 것으로 보입니다.
    reason: lexical_alternative
