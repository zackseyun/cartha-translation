translation:
  language: ko
  text: 또 느보와 바알므온[a]—이름이 바뀐 곳들—과 십마를 세웠습니다. 그들은 자신들이 세운 성읍들에 이름을 붙였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이름이 바뀐 채로” 또는 “그 이름들이 바뀌었고.” 히브리어 표현은 느보와 바알므온의 이름이 변경되었음을 가리키는 것으로 보입니다.
    reason: lexical_alternative
