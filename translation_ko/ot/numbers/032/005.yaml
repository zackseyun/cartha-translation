base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
  footnotes:
  - marker: a
    text: Or, 'Do not bring us across the Jordan.' The Hebrew verb is causative and can be rendered with several close English equivalents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “당신께서 저희를 좋게 보아 주신다면, 이 땅을 당신의 종들에게 소유지로 주십시오. 저희를 요단강을 건너게 하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저희를 요단강 건너편으로 데려가지 마십시오.’ 히브리어 동사는 사역형이므로 ‘건너게 하다’, ‘데려가다’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  english_pob_choice: if we have found favor in your sight
  chosen_korean: 우리가 당신의 눈에 은혜를 입었다면
  alternatives_korean:
  - 당신의 눈에 호의를 얻었다면
  - 당신 보기에 은혜를 받았다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리되, POB의 ‘favor’에 해당하는 관계적 호의를 한국어의 ‘은혜를 입다’로 옮겨 청원의 뉘앙스를 유지했습니다.
- source_word: לַעֲבָדֶיךָ
  english_pob_choice: to your servants
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 당신의 시종들에게
  - 당신의 노예들에게
  lexicon: HALOT
  rationale: 여기서는 모세에게 대한 공손한 자기지칭이므로 ‘종들’이 가장 직접적이며, 본문이 노예 상태를 강조하지는 않으므로 ‘노예들’은 피했습니다.
- source_word: לַאֲחֻזָּה
  english_pob_choice: as a possession
  chosen_korean: 소유로
  alternatives_korean:
  - 소유로서
  - 재산으로
  - 영속적인 소유로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지의 ‘소유지/점유지’에 가까우므로, 간결하게 ‘소유로’라고 옮겨 땅의 영구적 보유를 드러냈습니다.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  english_pob_choice: Do not make us cross the Jordan
  chosen_korean: 우리를 요단강 건너로 넘기지 마십시오
  alternatives_korean:
  - 우리를 요단강을 건너게 하지 마십시오
  - 우리를 요단강 건너편으로 데려가지 마십시오
  lexicon: HALOT
  rationale: 히브리어 사역형의 강제성을 살려 단순한 ‘건너게 하다’보다 ‘넘기다’로 옮겼고, 지리명은 한국어 성경에서 익숙한 ‘요단강’으로 처리했습니다.
