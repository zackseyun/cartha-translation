  naturalness: ‘당신의 눈에 은혜를 입었다면’은 히브리어 관용구를 직역한 흔적이 강하고, 여기서의 חֵן은 신학적 의미의 ‘은혜’보다 청원 상대의 호의·좋게 봄을 가리킵니다. ‘당신께서 저희를 좋게 보아 주신다면’이 현대 표준어 합쇼체에서 자연스럽고 의미도 정확합니다.
