  source_fidelity: 개정안은 נִנְחַל의 미래적 의미를 ‘받지 않겠습니다’로, אִתָּם을 ‘그들과 함께’로, בָּאָה의 완료 의미를 ‘돌아왔습니다’로 충실히 반영합니다. 첫 번째 요단강 관련 표현은 서쪽 지역을, 두 번째 표현은 동쪽 지역을 가리키므로, 한국어에서 방향을 명시하여 화자의 동쪽 정착지와 대조가 분명해지도록 했습니다.
  naturalness: 초안의 ‘요단 저편 동쪽에 우리에게 주셨음이라’는 수식 관계가 불분명하고, ‘주셨음이라’는 현대 합쇼체 문체에 맞지 않습니다. 문장을 둘로 나누고 ‘요단강 동쪽에서 우리에게 돌아왔습니다’로 옮기면 자연스럽고 현대적인 공식 문체가 됩니다.
  terminology: נַחֲלָה에 해당하는 ‘기업’은 토지 분배 및 상속이라는 본문의 핵심 용어를 보존하는 적절한 성경 번역어입니다. 하나님을 명시하지 않는 원문에 맞추어 ‘주셨습니다’ 대신 ‘돌아왔습니다’를 사용했습니다.
