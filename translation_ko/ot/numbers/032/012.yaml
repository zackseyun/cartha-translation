  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 뜻을 살리되, 현대 독자가 이해할 수 있도록 완전한 충성을 뜻하는 ‘온전히 따르다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
