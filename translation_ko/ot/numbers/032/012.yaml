  - 오직
  lexicon: HALOT
  rationale: 문맥상 앞선 판결에서 두 사람만 빠지는 뜻이므로, 현대 한국어에서는 ‘제외됩니다’가 가장 자연스럽고 분명합니다.
- source_word: הַקְּנִזִּי
