  rationale: 족속/출신을 가리키는 형용사로서, 한국어에서는 성씨식 표기보다 집단·출신 표시인 ‘그나스 사람’이 문맥을 잘 드러냅니다.
- source_word: מִלְאוּ אַחֲרֵי
  english_pob_choice: fully followed
  chosen_korean: 온전히 따랐습니다
