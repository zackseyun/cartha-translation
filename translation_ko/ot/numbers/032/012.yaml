  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 뜻을 살리되, 현대 독자가 이해할 수 있도록 완전한 충성을 뜻하는 ‘온전히 따르다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: POB terminology
  rationale: 원문 고유명사를 보존하는 POB 용례에 따라, 하나님의 이름 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 두 사람의 예외성과 순종의 성격
  chosen_reading: 갈렙과 여호수아는 일반적 심판에서 제외된 예외로 제시되며, 그 근거는 야훼를 온전히 따른 충성입니다.
  alternative_readings:
  - 단순한 도덕적 모범 진술
  - 명령 준수의 일반적 표현
  rationale: 본문은 단순한 칭찬보다, 이전 세대와 구별되는 언약적 충성을 근거로 예외를 설명합니다. 이를 약화하지 않기 위해 ‘온전히 따르다’를 유지했습니다.
  doctrine_reference: Numbers 32:12의 서술 기능과 언약적 충성 주제
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문의 יְהוָה는 고유명사 ‘야훼’로 유지합니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 주어가 아니라 이름 자체를 사용하므로, 대체 칭호보다 고유명사 표기가 원문 의도를 더 잘 보존합니다.
  doctrine_reference: POB translated divine name policy
