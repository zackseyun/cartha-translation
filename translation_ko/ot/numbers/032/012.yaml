translation:
  language: ko
  text: 갈렙—예분네의 아들 그나스 사람[a]과 눈의 아들 여호수아만 제외됩니다. 그들이 야훼를 온전히 따랐기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 마음을 다해 따랐다.’ 히브리어 관용구는 문자적으로는 ‘야훼 뒤에 채웠다’는 뜻으로, 완전한 충성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  english_pob_choice: except
  chosen_korean: 제외됩니다
  alternatives_korean:
  - 예외입니다
  - 오직
  lexicon: HALOT
  rationale: 문맥상 앞선 판결에서 두 사람만 빠지는 뜻이므로, 현대 한국어에서는 ‘제외됩니다’가 가장 자연스럽고 분명합니다.
- source_word: הַקְּנִזִּי
