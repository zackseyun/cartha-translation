  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
  footnotes:
  - marker: a
    text: Or 'followed the LORD wholeheartedly.' The Hebrew idiom is literally 'filled after the LORD,' expressing complete loyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 갈렙—예분네의 아들 그나스 사람[a]과 눈의 아들 여호수아만 제외됩니다. 그들이 야훼를 온전히 따랐기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 마음을 다해 따랐다.’ 히브리어 관용구는 문자적으로는 ‘야훼 뒤에 채웠다’는 뜻으로, 완전한 충성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  english_pob_choice: except
  chosen_korean: 제외됩니다
  alternatives_korean:
