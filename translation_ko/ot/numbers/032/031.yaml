  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
  footnotes:
  - marker: a
    text: Or “What the LORD has spoken to your servants, that we will do.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 갓 자손과 르우벤 자손이 대답했습니다. 「야훼께서 당신의 종들인 저희에게 말씀하신 대로, 저희는 그대로 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 당신의 종들인 저희에게 말씀하신 것을 저희가 하겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  english_pob_choice: answered
  chosen_korean: 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 문맥상 앞선 말씀에 대한 응답을 뜻하지만, 현대 한국어에서는 ‘대답했습니다’가 구어적으로도 자연스럽고 공손한 서술형에 잘 맞습니다.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  english_pob_choice: the sons of Gad and the sons of Reuben
  chosen_korean: 갓 자손과 르우벤 자손
  alternatives_korean:
  - 갓의 아들들과 르우벤의 아들들
  - 갓 사람들과 르우벤 사람들
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of’ 구조를 그대로 살리되, 한국어 성경에서 자연스러운 종족 표지인 ‘자손’을 사용해 직역성과 가독성을 함께 확보했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서화된 기본 원칙에 따라 신성호칭 יְהוָה는 ‘야훼’로 옮겼습니다. 이는 대체 칭호인 ‘주’보다 원문 고유명을 드러냅니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: to your servants
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 당신의 노예들에게
  - 당신의 하인들에게
  lexicon: HALOT
  rationale: 모세에게 대한 정중한 자기 지칭으로서 문맥상 ‘종’이 가장 적절합니다. ‘노예’는 이 절의 의도된 겸손 표현을 과도하게 강하게 만들 수 있습니다.
- source_word: כֵּן נַעֲשֶׂה
  english_pob_choice: so we will do
  chosen_korean: 그대로, 우리는 그렇게 하겠습니다
  alternatives_korean:
  - 그리하겠습니다
  - 우리는 그렇게 할 것입니다
  lexicon: HALOT
  rationale: ‘As ... so ...’의 대응을 한국어에서 자연스럽게 살리기 위해 ‘그대로’와 ‘그렇게 하겠습니다’를 결합해 원문의 충실성과 유려함을 함께 반영했습니다.
theological_decisions:
- issue: 야훼의 고유명 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮기고, 서술문 안에서도 동일하게 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님의 언약적 발화를 직접 인용하므로, 칭호로 대체하기보다 고유명을 유지하는 것이 원문이 의도한 직접성과 신학적 선명성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
