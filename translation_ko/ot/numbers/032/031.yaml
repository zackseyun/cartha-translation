  to: 그러자 갓 자손과 르우벤 자손이 대답했습니다. 「야훼께서 당신의 종들인 저희에게 말씀하신 대로, 저희는 그대로 하겠습니다.」[a]
  rationale: ‘대답했습니다’로 응답 동사를 정확히 반영했습니다. 또한 ‘당신의 종들인 저희’로 화자들이 모세에게 자신들을 낮추어 가리키는 원문의 표현을 현대 한국어에서 분명하게 했습니다. 각주 대안은 אֵת אֲשֶׁר의 ‘무엇을/그것을’ 해석 가능성을 자연스럽게 제시합니다.
