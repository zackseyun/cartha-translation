source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from after him,' an idiom meaning 'from following him.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads 'leave him in the wilderness,' with a singular pronoun likely used collectively for Israel/the people. Some translations smooth this to 'leave them' or 'leave Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: “이는, 만일 여러분이 그분을 따르는 데서 돌아서면[a], 그분께서 다시 그를 광야에 그대로 두실 것이며[b], 여러분은 이 온 백성을 멸망하게 할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘그분 뒤에서’이며, 그분을 따르던 데서 돌아선다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그를’이라는 단수 대명사를 사용합니다. 여기서는 이스라엘, 곧 백성 전체를 집합적으로 가리키는 것으로 이해하는 것이 자연스럽습니다. 일부 번역은 이를 ‘그들을’ 또는 ‘이스라엘을’로 풀어 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תְשׁוּבֻן מֵאַחֲרָיו
  english_pob_choice: For if you turn back from following him
  chosen_korean: “만일 당신들이 그를 따라 돌아서면”
  alternatives_korean:
  - “만일 당신들이 그 뒤를 따르다가 돌아서면”
  - “만일 당신들이 그를 따르기를 멈추면”
  lexicon: HALOT
  rationale: תשובון with מֵאַחֲרָיו는 단순한 ‘돌아옴’이 아니라 ‘따르던 데서 돌아섬’이라는 관용적 뜻이므로, ‘그를 따라 돌아서면’으로 자연스럽게 옮겼습니다.
- source_word: וְיָסַף עוֹד לְהַנִּיחוֹ בַּמִּדְבָּר
  english_pob_choice: he will again leave him in the wilderness
  chosen_korean: “그는 다시 그를 광야에 버려 두실 것이며”
  alternatives_korean:
  - “그는 다시 그를 광야에 남겨 두실 것이며”
  - “그는 다시 그를 광야에 두실 것이며”
  lexicon: HALOT
  rationale: יָסַף עוֹד는 ‘다시/더욱’의 반복적 뉘앙스를 가지므로 ‘다시’로 살렸고, לְהַנִּיחוֹ는 이 심판 문맥에서 ‘버려 두다/남겨 두다’가 적절하여 ‘버려 두실 것이며’로 옮겼습니다.
- source_word: וְשִׁחַתֶּם לְכָל הָעָם הַזֶּה
  english_pob_choice: and you will bring ruin on all this people
  chosen_korean: “당신들은 이 온 백성을 멸망에 이르게 할 것입니다.”
  alternatives_korean:
  - “당신들은 이 온 백성을 파멸시킬 것입니다.”
  - “당신들은 이 온 백성에게 재앙을 가져올 것입니다.”
  lexicon: HALOT
  rationale: שׁחת는 단순 파괴보다 ‘망하게 하다, 파멸시키다’의 결과를 강조하므로, 공동체 전체에 미칠 심판적 결과를 드러내는 ‘멸망에 이르게 하다’로 번역했습니다.
- source_word: לְכָל הָעָם הַזֶּה
  english_pob_choice: all this people
  chosen_korean: “이 온 백성”
  alternatives_korean:
  - “이 모든 백성”
  - “이 모든 백성들”
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 표현을 한국어에서 자연스럽게 유지하면서도, 공동체 전체를 가리키는 의미를 분명히 하기 위해 ‘이 온 백성’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 단수 대명사 לְהַנִּיחוֹ의 지시 대상
  chosen_reading: 단수 대명사 ‘그를’를 유지해, 광야에 버려지는 대상이 집합적으로 이스라엘 백성 전체를 가리킨다는 점을 본문 형태대로 드러냈습니다.
  alternative_readings:
  - ‘그들을’로 매끈하게 복수화
  - ‘이스라엘을’로 명시
  rationale: 원문은 단수 접미사를 사용하므로, 매끈함보다 원문 형태와 그 집합적 의미를 우선했습니다. 이어지는 ‘이 온 백성’과 함께 읽으면 공동체 전체를 가리키는 단수로 이해됩니다.
  doctrine_reference: Translation philosophy §1, §5
