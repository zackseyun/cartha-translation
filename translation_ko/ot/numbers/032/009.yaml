  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a standard covenantal/national designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'they disheartened' or 'they caused the heart of the sons of Israel to turn away.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 에스골 골짜기까지 올라가서 그 땅을 보았고, 이스라엘 자손의 마음을 흔들어 그들이 야훼께서 그들에게 주신 그 땅으로 들어가지 못하게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에스골 골짜기’는 히브리어 נחל의 지리적 범위를 풀어 옮긴 표현입니다.
    reason: source_note
  - marker: b
    text: ‘마음을 흔들어’는 히브리어 히필 동사의 결과를 드러내는 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 신명 יְהוָה를 옮긴 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיַּעֲלוּ עַד נַחַל אֶשְׁכּוֹל
  english_pob_choice: They went up as far as the Valley of Eshcol
  chosen_korean: 에스골 골짜기까지 올라가서
  alternatives_korean:
  - 에스골 와디까지 올라가서
  - 에스골 시내 골짜기까지 올라가서
  lexicon: HALOT
  rationale: עַד의 도달점을 '까지'로 살리고, נחל은 문맥상 자연스러운 지명 표현으로 '골짜기'를 택해 현대 한국어에서 읽기 쉽게 옮겼습니다.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  english_pob_choice: and saw the land
  chosen_korean: 그 땅을 보았고
  alternatives_korean:
  - 그 땅을 살폈고
  - 그 땅을 보았으며
  lexicon: HALOT
  rationale: ראה의 기본 의미를 따라 '보았다'로 직역성을 유지하되, 서술 흐름을 위해 연결어미 '-고'를 사용했습니다.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  english_pob_choice: they discouraged the heart of the sons of Israel
  chosen_korean: 이스라엘 자손의 마음을 흔들어
  alternatives_korean:
  - 이스라엘 자손의 마음을 낙심하게 하여
  - 이스라엘 자손의 마음을 꺾어
  lexicon: HALOT
  rationale: ניא/נוא의 히필이 단순한 '격려 부족'보다 사람의 내적 결단을 꺾거나 흔드는 뜻을 지니므로, 문맥상 강도를 살려 '마음을 흔들어'로 옮겼습니다.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  english_pob_choice: from going into the land
  chosen_korean: 그들이 … 땅으로 들어가지 못하게 하였습니다
  alternatives_korean:
  - 그들이 … 땅으로 들어오지 못하게 하였습니다
  - 그들이 … 땅에 들어가지 않도록 하였습니다
  lexicon: HALOT
  rationale: לבלתי + 부정사 구문을 결과적으로 나타내는 한국어 표현으로 풀어, 단순한 이동이 아니라 진입 자체가 막힌 뜻을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명은 프로젝트 기본값에 따라 '야훼'로 옮겨, 언약 이름의 직접성을 유지했습니다.
theological_decisions:
- issue: 이스라엘 공동체를 가리키는 בני ישראל의 표현
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 사람들의 마음
  rationale: בְּנֵי יִשְׂרָאֵל의 표준적인 언약적·민족적 호칭을 살려, 공동체 정체성을 약화시키지 않도록 했습니다.
  doctrine_reference: 'POB glossary: בְּנֵי יִשְׂרָאֵל'
- issue: 직역적 병렬을 유지하는 접속
  chosen_reading: '...보았고, ...흔들어 ...하게 하였습니다'
  alternative_readings:
  - '...보았지만, ...흔들어 ...하게 하였습니다'
  rationale: 히브리어는 כאן 대립 접속이 아니라 단순 병렬 진행이므로, 한국어에서도 '하지만'으로 의미를 덧씌우지 않고 순차적 연결을 유지했습니다.
  doctrine_reference: source syntax
