  to: 그러나 주인님의 종들은 모두 전쟁에 나설 무장을 갖추고[a] 야훼 앞에서[b] 전쟁을 위해[c] 건너가겠습니다. 주인님께서 말씀하신 대로입니다.
  rationale: 문장을 두 문장으로 나누어 한국어 합쇼체의 자연스러운 종결을 확보했습니다. ‘모두’로 כָּל의 집합적 범위를, ‘전쟁에 나설 무장을 갖추고’로 חֲלוּץ צָבָא의 군사적 준비 상태를 나타냈습니다. ‘전쟁을 위해 건너가겠습니다’는 이동 동사와 לַמִּלְחָמָה의 목적성을 보존하며, 마지막 문장은 ‘주인님께서 말씀하신 대로’가 앞의 행동을 수식하는 관계를 명확히 합니다.
