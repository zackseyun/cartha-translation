  - 주님
  rationale: 본문의 신명기적 이름 יְהוָה를 한국어 관행어보다 원어 기반 표기인 ‘야훼’로 유지해, 군사 행동이 야훼의 권위 아래 진행된다는 점을 분명히 했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
