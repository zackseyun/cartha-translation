id: NUM.32.27
reference: Numbers 32:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
  footnotes:
  - marker: a
    text: Or 'every one equipped for military service.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'before the LORD,' indicating that their participation in the campaign is undertaken under the LORD's authority and in his presence.
    reason: cultural_note
  - marker: c
    text: Or 'to battle' / 'for the war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주인님의 종들은 모두 전쟁에 나설 무장을 갖추고[a] 야훼 앞에서[b] 전쟁을 위해[c] 건너가겠습니다. 주인님께서 말씀하신 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군사 복무를 위해 갖추어진 사람마다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼 앞에서’는 그들의 전쟁 참여가 야훼의 권위 아래, 그분 앞에서 이루어짐을 나타냅니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘전투를 위해’ 또는 ‘전쟁에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  english_pob_choice: But your servants
  chosen_korean: 그러나 당신의 종들은
  alternatives_korean:
  - 그리고 당신의 종들은
  - 당신의 종들은
  lexicon: HALOT
  rationale: עֶבֶד는 기본적으로 ‘종/노예’의 범위를 가지지만, 여기서는 모세에게 대한 공손한 자기호칭이므로 ‘종들’이 적절하며, 앞절과의 대조를 살려 접속사를 ‘그러나’로 옮겼습니다.
- source_word: יַעַבְרוּ
  english_pob_choice: will cross over
  chosen_korean: 건너가서
  alternatives_korean:
  - 건너갈 것입니다
  - 건너가
  lexicon: HALOT
  rationale: 문맥상 요단을 건너 전투에 참여하는 이동을 가리키므로 ‘건너가서’가 한국어로 자연스럽고 동작의 방향을 살립니다.
- source_word: כָּל חֲלוּץ צָבָא
  english_pob_choice: every man armed for battle
  chosen_korean: 다 전쟁에 대비한 무장한 사람마다
  alternatives_korean:
  - 전쟁에 대비해 무장한 사람마다
  - 전투를 위해 무장한 사람마다
  lexicon: HALOT
  rationale: חֲלוּץ צָבָא는 단순한 ‘군대’가 아니라 전투를 위해 갖추어진 개별 병사를 가리키므로, distributive force를 살려 ‘사람마다’로 옮기고 ‘무장한’과 ‘전쟁에 대비한’으로 의미를 풀어냈습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 하나님 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기며, לִפְנֵי는 단순한 위치가 아니라 야훼의 권위와 임재 아래에서 행해짐을 드러내므로 ‘앞에서’가 적절합니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for the war
  chosen_korean: 전쟁에
  alternatives_korean:
  - 전쟁을 위해
  - 전투를 위해
  lexicon: HALOT
  rationale: לַמִּלְחָמָה는 목적/방향을 나타내므로 한국어에서는 ‘전쟁에’로 간결하게 옮겨 전투 참여의 목적을 드러냈습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 제 주인이
  alternatives_korean:
  - 제 주님이
  - 저의 주인이
  lexicon: HALOT
  rationale: אֲדֹנִי는 여기서 신적 호칭이 아니라 모세에게 대한 존칭이므로, ‘주님’보다 오해가 적은 ‘제 주인’으로 옮겨 대화 상대에 대한 공손함을 살렸습니다.
- source_word: דֹּבֵר
  english_pob_choice: says
  chosen_korean: 말씀하신 대로
  alternatives_korean:
  - 말하는 대로
  - 말씀하시는 대로
  lexicon: HALOT
  rationale: 현재분사는 맥락상 명령/지시의 내용을 가리키는 보고 표현이므로, 한국어에서는 종결적 인용보다 ‘말씀하신 대로’가 가장 자연스럽습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
