  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
  footnotes:
  - marker: a
    text: Havvoth-jair means 'villages of Jair' or 'settlements of Jair.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므낫세의 아들 야일이 가서 그들의 촌락들을 점령하고, 그것들을 하봇-야일이라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하봇-야일’은 ‘야일의 촌락들’ 또는 ‘야일의 정착지들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יָאִ֤יר
  english_pob_choice: Jair
  chosen_korean: 야일
  alternatives_korean:
  - 재어
  - 자일
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리하되, 한국어 성경에서 널리 통용되는 형태인 ‘야일’을 채택했습니다.
- source_word: בֶּן מְנַשֶּׁה
  english_pob_choice: son of Manasseh
  chosen_korean: 므낫세의 아들
  alternatives_korean:
  - 므낫세의 후손
  - 므낫세 자손
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살려 ‘아들’을 본문에 유지했고, 족보적 의미를 덧붙이지 않았습니다.
- source_word: חַוֺּתֵי/הֶם
  english_pob_choice: their villages
  chosen_korean: 그들의 촌락들
  alternatives_korean:
  - 그들의 마을들
  - 그들의 정착지들
  - 그들의 촌락
  lexicon: HALOT
  rationale: חַוּוֹת는 소규모 정주지를 가리키므로 ‘촌락들’이 문맥상 자연스럽고 원문의 의미를 잘 반영합니다.
- source_word: וַיִּקְרָ֥א אֶתְ/הֶ֖ן
  english_pob_choice: he called them
  chosen_korean: 그것들을 …라고 불렀습니다
  alternatives_korean:
  - 그것들을 …라고 이름 지었습니다
  - 그것들을 불렀습니다
  lexicon: HALOT
  rationale: קרא는 여기서 명명 행위를 뜻하므로, 한국어에서는 결과적 이름을 밝히는 ‘…라고 불렀습니다’가 가장 분명합니다.
- source_word: חַוֺּ֥ת יָאִֽיר
  english_pob_choice: Havvoth-jair
  chosen_korean: 야일의 촌락들
  alternatives_korean:
  - 하봇-야일
  - 야일의 마을들
  lexicon: HALOT
  rationale: 본문이 지닌 지명 의미를 살려 번역하고, 고유명사화보다 의미 전달을 우선했습니다.
theological_decisions:
- issue: 지명의 고유명사화와 의미 번역
  chosen_reading: 이곳은 지명 ‘하봇-야일’을 음역하기보다, 본문이 직접 설명하는 뜻을 살려 ‘야일의 촌락들’로 옮겼습니다.
  alternative_readings:
  - 하봇-야일
  - 야일의 마을들
  rationale: 히브리어 본문 자체가 명명 행위를 설명하므로, 독자가 이름의 의미를 즉시 이해하도록 하는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 성경 본문의 수사와 지명 명명의 의미 보존
- issue: ‘점령하다’의 군사적 뉘앙스
  chosen_reading: וַיִּלְכֹּד는 단순히 ‘갔다’ 다음의 이동이 아니라 군사적 장악을 뜻하므로 ‘점령하고’로 옮겼습니다.
  alternative_readings:
  - 사로잡고
  - 빼앗고
  - 차지하고
  rationale: 문맥이 정복 서술이므로, 강제적 획득의 의미가 드러나는 표현을 택해야 합니다.
  doctrine_reference: 정복 서술의 문맥 보존
