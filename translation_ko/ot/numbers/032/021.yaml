  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
  footnotes:
  - marker: a
    text: Or, 'until he has dispossessed his enemies from before him.' The Hebrew verb can mean 'drive out' or 'dispossess.'
    reason: lexical_alternative
  - marker: b
    text: The pronouns in 'he has driven out his enemies from before him' most naturally refer to the LORD, though some understand them with reference to Israel's fighting force.
    reason: alternative_reading
translation:
  language: ko
  text: 너희 가운데 모든 전투원은 야훼 앞에서 요단을 건너가서, 그가 자기의 원수들을 자기 앞에서 쫓아낼 때까지여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쫓아낼’은 여기서 ‘그 땅에서 몰아내어 차지하지 못하게 하다’는 뜻도 담을 수 있습니다. 히브리어 동사는 ‘쫓아내다’와 ‘박탈하다/몰수하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그가 자기의 원수들을 자기 앞에서 쫓아낼 때까지’의 대명사는 가장 자연스럽게 야훼를 가리키지만, 일부는 이 표현을 이스라엘의 전투 집단에 연결해 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חָלוּץ
  english_pob_choice: every armed man
  chosen_korean: 모든 전투원
  alternatives_korean:
  - 모든 무장한 사람
  - 모든 무장병
  - 모든 전사
  lexicon: HALOT
  rationale: חָלוּץ는 단순히 무기를 든 사람보다 전투를 위해 갖추어진 군인을 가리키므로, 문맥에 맞게 ‘전투원’으로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: among you
  chosen_korean: 너희 가운데
  alternatives_korean:
  - 너희를 위하여
  - 너희 중에서
  lexicon: HALOT
  rationale: 대상 집단 내부의 분배를 나타내므로, 한국어에서는 ‘너희 가운데’가 자연스럽고 원문의 관계를 잘 드러냅니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 야훼 면전에서
  lexicon: HALOT
  rationale: 이 절은 야훼의 언약명을 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮기고, לִפְנֵי의 공간적·관계적 의미는 ‘앞에서’로 살렸습니다.
- source_word: הוֹרִישׁוֹ
  english_pob_choice: he has driven out
  chosen_korean: 쫓아낼 때까지
  alternatives_korean:
  - 몰아낼 때까지
  - 축출할 때까지
  - 쫓아내고 나서
  lexicon: HALOT
  rationale: הוֹרִישׁ는 여기서 ‘추방하여 비우다/몰아내다’의 의미이므로, 현대 한국어의 동적 표현인 ‘쫓아내다’가 자연스럽습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 원문은 여호와/주가 아니라 YHWH를 직접 쓰므로, 프로젝트 기본 방침에 따라 언약명 자체를 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 3인칭 단수 대명사의 지시 대상
  chosen_reading: ‘그가 … 자기의 원수들을 … 쫓아낼 때까지’에서 ‘그가’는 야훼를 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 이스라엘의 전투력을 가리킨다
  - 집합적 주어를 가리킨다
  rationale: ‘야훼 앞에서’와 이어지는 단수 대명사 연쇄는 야훼를 가장 자연스러운 선행사로 만들며, 군사적 승리를 하나님이 이루신다는 문맥에도 부합합니다.
  doctrine_reference: Numbers 32:21 문맥상 주어 지시
