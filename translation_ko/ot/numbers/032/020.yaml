source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
  footnotes:
  - marker: a
    text: Or “if you will be equipped,” “if you will go as armed men,” or “if you will muster yourselves.” The Hebrew verb has a military sense of being armed or prepared for battle.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “before the LORD,” indicating that their military action is undertaken in the LORD’s presence and under his authority.
    reason: cultural_note
translation:
  language: ko
  text: 모세가 그들에게 이르시되, “너희가 이 일을 행하며 여호와 앞에서 무장하여 전쟁에 나아가면”,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 חָלַץ는 단순히 준비하는 것이 아니라, 전쟁을 위해 무장을 갖추거나 병력을 동원하는 군사적 의미를 가집니다.
    source: WLC lexical analysis
  - marker: b
    text: 여호와 앞에서'는 그들의 군사적 행위가 여호와의 임재 하에 있으며 그분의 권위 아래 이루어짐을 나타냅니다.
    source: Cultural context note
lexical_decisions:
- source_word: תַּעֲשׂוּן
  english_pob_choice: do this thing
  chosen_korean: 이 일을 행하며
  alternatives_korean: 이 일을 하거나, 이 일을 이루면
  lexicon: עָשָׂה
  rationale: Hebrew verb עָשָׂה in this context implies the completion of a specific action; '행하다' is more formal and precise than '하다' for covenantal actions.
- source_word: תֵּחָלְצוּ
  english_pob_choice: arm yourselves
  chosen_korean: 무장하여
  alternatives_korean: 장비하여, 싸움에 나가
  lexicon: חָלַץ
  rationale: The verb חָלַץ carries a specific military connotation of equipping oneself for battle, distinct from general preparation; '무장하다' captures this military nuance accurately.
- source_word: לִ/פְנֵ֥י יְהוָ֖ה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞에서
  alternatives_korean: 여호와 앞에, 주님 앞에서
  lexicon: לִפְנֵי
  rationale: Maintains the theological concept of acting under divine authority and presence, as indicated in the source notes.
theological_decisions:
- decision: Use of '모세가 이르시되' (Moses said) with honorifics
  rationale: Reflects the authority of the speaker and the formal tone of the covenantal instruction in the WLC text.
- decision: Use of '여호와' for YHWH
  rationale: Preserves the specific divine name used in the source text, maintaining theological continuity with the English POB context.
