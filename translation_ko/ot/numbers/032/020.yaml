  source_fidelity: 핵심 의미는 대체로 충실하나, 본문의 두 조건절(‘이 일을 하면’ / ‘무장하면’)이 ‘행하며 … 나아가면’으로 결합되어 히브리어의 반복 조건을 충분히 드러내지 못합니다. 또한 ‘전쟁에 나아가면’은 원문에 없는 ‘나아감’을 보태며, 무장 행위 자체보다 출전 행위에 조건의 초점을 옮깁니다.
  naturalness: ‘모세가 그들에게 이르시되’와 ‘행하며’는 현대 표준어 합쇼체 번역으로는 다소 고어적입니다. ‘말했습니다’와 ‘한다면’이 자연스럽고, 인용문의 미완결성은 원문의 문장 계속과 일치하므로 쉼표로 보존할 수 있습니다.
