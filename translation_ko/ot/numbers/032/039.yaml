base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
  footnotes:
  - marker: a
    text: Hebrew has a singular verb, 'and he dispossessed,' after the preceding plural verbs. This may treat Machir's line as a collective singular, or it may reflect a textual or stylistic shift. Some translations smooth it to 'they dispossessed.'
    reason: textual_variant
  - marker: b
    text: Hebrew 'the Amorite' uses a singular ethnonym collectively, referring to the Amorite inhabitants.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세의 아들 마길의 자손들이 길르앗으로 가서 그것을 점령하고, 그 안에 있던 아모리 사람을 쫓아냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 복수 동사 뒤에 단수 동사 ‘그가 쫓아냈다’를 두고 있습니다. 이는 마길의 계열을 집합적 단수로 볼 수도 있고, 문체적·본문적 전환일 수도 있습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 ‘아모리’는 형태상 단수이지만, 여기서는 아모리 주민 전체를 가리키는 집합적 민족명으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  english_pob_choice: The sons of Machir son of Manasseh
  chosen_korean: 므낫세의 아들 마길의 자손들
