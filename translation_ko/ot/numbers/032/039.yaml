  - 그것을 함락하고
  lexicon: WLC; HALOT
  rationale: לכד는 성읍이나 땅을 군사적으로 ‘점령하다/함락시키다’의 뜻이 강하므로, 대상이 지역인 점을 살려 ‘점령하다’로 옮겼습니다.
- source_word: וַיּוֹרֶשׁ
  english_pob_choice: he dispossessed
  chosen_korean: 쫓아냈습니다
  alternatives_korean:
  - 내쫓았습니다
  - 그들을 몰아냈습니다
  - 그 땅을 차지했습니다
  lexicon: WLC; HALOT
  rationale: ירש의 히필은 단순 점유보다 기존 주민을 몰아내는 법적·토지적 의미가 있으므로, 이를 한국어 동사로 압축해 ‘쫓아냈습니다’로 번역했습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람
  alternatives_korean:
  - 아모리인들
  - 아모리 사람들
  lexicon: WLC; HALOT
  rationale: 형태는 단수형이지만 집합적 민족명으로 쓰이므로, 한국어에서는 자연스러운 집합 표현인 ‘아모리 사람’으로 처리했습니다.
theological_decisions:
- issue: 히브리어 단수 동사 וַיּוֹרֶשׁ와 앞의 복수 주어의 불일치
  chosen_reading: 본문의 문법적 긴장을 그대로 살려, 한국어에서는 동작 주체를 집단으로 읽되 결과는 하나의 행위로 제시했습니다.
  alternative_readings:
  - ‘그들이 쫓아냈습니다’로 수의 일치를 맞추는 읽기
  - ‘마길이 쫓아냈습니다’로 집합적 단수 읽기
  rationale: 마소라 본문은 복수 서술 뒤에 단수 동사를 두어 집합적 주어 또는 문체적 전환의 가능성을 남기므로, 평탄화하지 않고 의미를 보존하는 쪽을 택했습니다.
  doctrine_reference: 텍스트 비평/문법 주해
