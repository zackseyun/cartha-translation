  lexicon: WLC; HALOT
  rationale: 히브리어 בני는 직역하면 ‘아들들’이지만 문맥상 한 가문/자손 집단을 가리키므로, 한국어에서는 자연스럽게 ‘자손들’로 옮겼습니다.
- source_word: וַיִּלְכְּדֻהָ
