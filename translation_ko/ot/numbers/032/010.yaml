lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: burned / anger
  chosen_korean: 분노가 타올랐고
  alternatives_korean:
  - 진노가 타올랐고
  - 노가 타올랐고
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘노가 뜨거워지다/타오르다’는 뜻이므로, 현대 한국어에서는 ‘분노가 타올랐다’가 직관적이면서도 비유를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어가 아니라 원문 음역인 ‘야훼’로 옮겨, POB의 하나님 이름 정책을 반영했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그때
  lexicon: HALOT
  rationale: 서사 문맥에서는 ‘그날’이 가장 자연스럽고 간결하며, 시간 부사의 지시성을 잘 유지합니다.
- source_word: וַיִּשָּׁבַע לֵאמֹר
  english_pob_choice: and he swore, saying
  chosen_korean: 그분은 맹세하시며 말씀하셨습니다
  alternatives_korean:
  - 그분은 맹세하며 말씀하셨습니다
  - 그분은 맹세하고 말씀하셨습니다
  lexicon: HALOT
  rationale: ‘맹세하다’로 oath 동사를 직접 살리고, 이어지는 인용 도입은 ‘말씀하셨습니다’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 하나님 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문 יְהוָה를 직역적 대체어로 가리지 않고 고유명으로 드러내어, 본문의 언약적·인격적 뉘앙스를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님의 감정적 표현
  chosen_reading: 분노가 타올랐고
  alternative_readings:
  - 진노가 타올랐고
  - 노하셨고
  rationale: אַף의 신체 은유를 약화시키지 않기 위해, 단순한 감정 상태보다 역동적 표현을 택했습니다.
  doctrine_reference: POB style principle — preserve source metaphor when not obscuring meaning
