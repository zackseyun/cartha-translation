translation:
  language: ko
  text: '그날 야훼[a]의 분노가 타올랐고, 그분은 맹세하여 말씀하셨습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’; ‘야훼’ 또는 ‘여호와’로 음역됩니다.'
