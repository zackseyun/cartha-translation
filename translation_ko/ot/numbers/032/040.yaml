    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 모세는 길르앗을 므낫세의 아들 마길에게 주었고, 그는 거기에 정착하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기에 살았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었고
  alternatives_korean:
  - 주고
  - 넘겨주었고
  lexicon: HALOT
  rationale: 서술문의 단순한 נתן를 한국어에서는 가장 직접적인 ‘주다’로 옮기는 것이 자연스럽고, 행정적 뉘앙스를 덧붙이지 않습니다.
- source_word: הַגִּלְעָד
  english_pob_choice: Gilead
  chosen_korean: 길르앗
  alternatives_korean:
  - 길리앗
  - 길르앗 땅
  lexicon: HALOT
  rationale: 고유지명은 통용되는 성서 표기인 ‘길르앗’을 유지하는 것이 가장 분명합니다.
- source_word: בֶּן מְנַשֶּׁה
  english_pob_choice: son of Manasseh
  chosen_korean: 므낫세의 아들
  alternatives_korean:
  - 므낫세의 후손
  - 므낫세의 자손
  lexicon: HALOT
  rationale: 문맥상 족보적 표현인 בן을 그대로 반영해 ‘아들’로 옮기되, 한국어 어순에 맞게 소유격으로 처리했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였습니다
  alternatives_korean:
  - 거주하였습니다
  - 살게 되었습니다
  - 살았습니다
  lexicon: HALOT
  rationale: 분배된 땅에 들어가 자리를 잡는 의미를 ‘정착하다’로 살리면 단순한 거주보다 문맥에 더 정확합니다.
theological_decisions:
- issue: 땅 분배 서술의 번역 강도
  chosen_reading: ‘주었고’와 ‘정착하였습니다’로 담담하게 옮겨, 분배와 정착의 사실 진술을 유지했습니다.
  alternative_readings:
  - ‘할당하였고’
  - ‘거주하였고’
  rationale: 본절은 신학적 해설보다 역사 서술이 중심이므로, 원문의 간결한 진행을 과도하게 해석하지 않는 쪽이 적절합니다.
  doctrine_reference: 해당 없음
