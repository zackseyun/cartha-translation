  lexicon: HALOT
  rationale: 분배된 땅에 들어가 자리를 잡는 의미를 ‘정착하다’로 살리면 단순한 거주보다 문맥에 더 정확합니다.
theological_decisions:
- issue: 땅 분배 서술의 번역 강도
