  lexicon: HALOT
  rationale: 문맥상 족보적 표현인 בן을 그대로 반영해 ‘아들’로 옮기되, 한국어 어순에 맞게 소유격으로 처리했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였습니다
  alternatives_korean:
