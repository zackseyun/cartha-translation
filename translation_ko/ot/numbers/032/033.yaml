base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
  footnotes:
  - marker: a
    text: Or 'and the land, its cities with their territories, the cities of the surrounding land.' The final Hebrew phrase is syntactically compressed, and several closely related renderings are possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 갓의 자손들과 르우벤의 자손들과 요셉의 아들 므낫세 지파의 절반에게 아모리 사람들의 왕 시혼의 왕국과 바산의 왕 옥의 왕국, 곧 그 땅과 그 성읍들, 그 영토 안에 있는 주변 땅의 성읍들을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 히브리어 구절은 문법적으로 압축되어 있습니다. 직역에 가깝게는 ‘그 땅과 그 성읍들, 경계들 안에 있는 주변 땅의 성읍들’이며, ‘그 땅과 그 성읍들, 곧 그 주변 땅의 성읍들’ 등 여러 밀접한 번역이 가능합니다.
    reason: alternative_reading
