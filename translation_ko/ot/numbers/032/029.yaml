base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: ko
  text: 모세가 그들에게 말했습니다. "만일 갓의 아들들과 르우벤의 아들들이 여러분과 함께 요단을 건너, 전쟁을 위해 무장한 모든 사람이 야훼 앞에서 나아가고, 그 땅이 여러분 앞에서 정복되면, 여러분은 길르앗 땅을 그들에게 소유지로 주어야 합니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “전쟁을 위한 모든 무장한 사람”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol을 현대 한국어 자연문장으로 옮기되, 불필요한 접속어를 덧붙이지 않고 담백하게 시작했습니다.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  english_pob_choice: the sons of Gad and the sons of Reuben
  chosen_korean: 갓의 아들들과 르우벤의 아들들
  alternatives_korean:
  - 갓 사람들과 르우벤 사람들
  - 갓의 자손들과 르우벤의 자손들
  lexicon: HALOT
  rationale: 히브리어의 친족·지파 표현을 그대로 살려 지파 정체성을 투명하게 드러냈습니다.
- source_word: חָלוּץ
  english_pob_choice: every armed man
  chosen_korean: 전쟁을 위해 무장한 모든 사람
  alternatives_korean:
  - 모든 무장한 사람
  - 전투에 나설 모든 사람
  lexicon: HALOT
  rationale: 군사적 맥락의 חָלוּץ를 단순한 '병사'로 좁히지 않고, 준비된 전투원을 드러내도록 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주 앞에서
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: 본문의 신학적 표지를 살려 YHWH를 야훼로 옮기고, לפני의 관계적 의미를 직역에 가깝게 반영했습니다.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  english_pob_choice: and the land is subdued
  chosen_korean: 그 땅이 ... 정복되면
  alternatives_korean:
  - 그 땅이 ... 굴복되면
  - 그 땅이 ... 제압되면
  lexicon: HALOT
  rationale: 니팔형의 수동·결과적 의미를 살리되, 한국어에서는 조건절 안에서 자연스러운 종결로 처리했습니다. '정복되다'는 완전한 패배가 아니라 점유·복속의 결과를 전달합니다.
- source_word: לַאֲחֻזָּה
  english_pob_choice: as a possession
  chosen_korean: 소유지로
  alternatives_korean:
  - 소유로
  - 소유분으로
  - 기업으로
  lexicon: HALOT
  rationale: 지파에게 주어지는 토지의 점유 개념을 한국어의 토지 용례에 맞게 구체화하되, '기업'처럼 더 신학화된 표현은 피했습니다.
