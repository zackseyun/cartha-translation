source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
  footnotes:
  - marker: a
    text: 'Hebrew literally uses an oath formula with ''if'': ''if the men ... shall see the land,'' implying a strong negation: ''surely none ... shall see.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'they have not followed after me completely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트에서 올라온 그 남자들—스무 살 이상인 자들—은 내가 아브라함과 이삭과 야곱에게 맹세한 그 땅을 결코 보지 못할 것입니다. 이는 그들이 내 뒤를 온전히 따르지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘만일’ 형태의 맹세 공식이지만, 뜻은 강한 부정입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온전히 따르지 않았다’는 표현은 ‘뒤를 따르다’의 관용을 풀어 쓴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Surely none ... shall
  chosen_korean: 결코 ... 못할 것입니다
  alternatives_korean:
  - 만일 ... 보면
  - 분명히 ... 보지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식에서 אִם은 조건문이 아니라 강한 부정의 맹세로 쓰이므로, 한국어에서도 단순한 ‘만일’이 아니라 결과적으로 강한 금지를 드러내는 표현이 필요합니다.
- source_word: הָאֲנָשִׁים הָעֹלִים מִמִּצְרַיִם
  english_pob_choice: the men who came up from Egypt
  chosen_korean: 이집트에서 올라온 그 남자들
  alternatives_korean:
  - 이집트에서 나온 그 사람들
  - 이집트에서 올라온 그 사람들
  lexicon: HALOT
  rationale: ‘남자들’은 히브리어 복수 남성형을 반영하고, ‘올라온’은 출애굽 문맥의 עלה+מִן 관용을 살립니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살 이상인 자들
  alternatives_korean:
  - 스무 살부터 위인 자들
  - 스무 살 이상
  lexicon: HALOT
  rationale: 연령 기준을 뜻하는 관용구를 한국어에서 자연스럽게 옮기되, 본문의 집단 수식 기능이 드러나도록 ‘자들’을 보탰습니다.
- source_word: לֹא מִלְאוּ אַחֲרַי
  english_pob_choice: they have not fully followed me
  chosen_korean: 내 뒤를 온전히 따르지 않았기 때문입니다
  alternatives_korean:
  - 나를 완전히 따르지 않았기 때문입니다
  - 내 뒤를 완전히 따르지 않았기 때문입니다
  lexicon: HALOT
  rationale: מלא אחרי는 단순한 추종보다 ‘온전히/완전히 따라감’의 관용이므로, ‘내 뒤를’로 관계성을 살리고 ‘온전히’로 강도를 보존했습니다.
- source_word: הָאֲדָמָה
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 땅덩이
  - 그 땅
  lexicon: HALOT
  rationale: 여기서는 토양이 아니라 약속의 땅을 가리키므로 ‘땅’이 적절하며, 정관성을 살려 ‘그 땅’으로 옮겼습니다.
theological_decisions:
- issue: 맹세문의 강한 부정 처리
  chosen_reading: 결코 ... 못할 것입니다
  alternative_readings:
  - 만일 ... 보면
  - 그들은 ... 보지 못할 것입니다
  rationale: 본문은 조건문이 아니라 신적 판결을 담은 맹세이므로, 한국어에서도 그 선포성을 분명히 해야 합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘따르다’ 관용의 관계성 보존
  chosen_reading: 내 뒤를 온전히 따르지 않았기 때문입니다
  alternative_readings:
  - 나를 온전히 따르지 않았기 때문입니다
  - 나를 끝까지 따르지 않았기 때문입니다
  rationale: 히브리어 관용은 단순한 지적 동의보다 언약적 추종을 말하므로, ‘뒤를’이라는 방향성을 유지해 본문의 관계적 의미를 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
