id: NUM.32.7
reference: Numbers 32:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
  footnotes:
  - marker: a
    text: Or 'discourage the courage/resolve of the sons of Israel.' The Hebrew literally says 'discourage the heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 여러분은 이스라엘 자손들이 야훼께서 그들에게 주신 땅으로 건너가지 못하도록 그들의 마음을 꺾으십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 자손들의 마음’을 말합니다. 문맥상 그들의 용기나 결심을 꺾는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손들’은 히브리어의 친족-민족 표현을 가깝게 옮긴 것입니다. 자연스러운 한국어로는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  english_pob_choice: And why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 그리고 어찌하여
  lexicon: HALOT
  rationale: 히브리어의 연결사와 질문의 강한 어조를 살리되, 한국어에서는 자연스러운 수사 의문형인 ‘어찌하여’로 옮겼습니다.
- source_word: תנואו/ן
  english_pob_choice: do you discourage
  chosen_korean: 흔드십니까
  alternatives_korean:
  - 낙심하게 하십니까
  - 방해하십니까
  - 주저하게 하십니까
  lexicon: HALOT
  rationale: ‘마음을 흔들다’는 מקור의 ‘heart’ 관용구와 가장 가깝고, 여기서의 동요·의욕 약화를 자연스럽게 드러냅니다.
- source_word: אֶת לֵב
  english_pob_choice: the hearts
  chosen_korean: 마음
  alternatives_korean:
  - 마음들
  - 용기
  - 결심
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘마음들’을 뜻하지만 한국어에서는 복수표지를 자연스럽게 반복하기보다 집합명사 ‘마음’으로 옮겨 의미를 보존했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 남성 복수 표현을 평탄화하지 않고, 원문의 친족-민족 표현을 살려 ‘이스라엘 자손들’로 옮겼습니다.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  english_pob_choice: from crossing over into the land
  chosen_korean: 그들이 … 땅으로 건너가지 못하게
  alternatives_korean:
  - 그 땅으로 건너가도록
  - 그 땅에 들어가게
  lexicon: HALOT
  rationale: יַעבר의 ‘건너가다’ 이미지를 유지하되, 앞선 부정적 유발을 한국어 목적절로 풀어 ‘건너가지 못하게’로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체 용례 대신 원어 표기 관행을 따라 언약 이름을 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 호칭이 아니라 고유 신명입니다. 따라서 한국어 본문에서도 이름성을 유지하는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 이스라엘 자손들의 마음을 흔드는 행위의 의미
  chosen_reading: 정복 전쟁을 포기하게 만드는 영적·의지적 동요
  alternative_readings:
  - 단순한 실망
  - 심리적 낙담
  rationale: 문맥상 단순 감정 표현이 아니라 약속의 땅 진입을 가로막는 의지 약화이므로, ‘마음을 흔들다’로 행위의 책임성과 결과를 함께 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
