  verdict: revise
  source_fidelity: 히브리어는 ‘이스라엘 자손들의 마음’을 약화시켜 야훼께서 주신 땅으로 건너가는 일을 막는다는 뜻입니다. 초안의 ‘마음을 … 흔들다’는 의미 범위에는 들지만, 삽입된 목적절 때문에 수식 관계가 어색하고 ‘그들이 야훼께서’가 문법적으로 연결되지 않습니다. ‘마음을 꺾다’는 낙심시켜 결심을 꺾는 의미와 원문의 마음 관용 표현을 함께 살립니다.
  naturalness: ‘이스라엘 자손들이 야훼께서 그들에게 주신 땅으로 건너가지 못하도록 그들의 마음을 꺾으십니까?’는 현대 표준 한국어의 합쇼체로 자연스럽고, 행위의 대상과 결과가 분명합니다.
