  - 야훼의 진노가 … 불탔고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘타오르다/불타다’ 이미지를 살리면서, 한국어로도 자연스럽고 강한 분노의 동사를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: POB terminology default
  rationale: 문맥상 언약 이름을 가리키므로 전통적 대체어 ‘주’보다 고유명 ‘야훼’를 유지했습니다.
- source_word: וַיְנִעֵם
  english_pob_choice: he made them wander
  chosen_korean: 그들을 광야에서 사십 년 동안 떠돌게 하셨습니다
  alternatives_korean:
  - 그들이 광야에서 떠돌게 하셨습니다
  - 그들을 광야에서 헤매게 하셨습니다
  lexicon: HALOT
  rationale: 사역형의 강제성을 살리면서, ‘광야에서 떠돌게 하다’로 이스라엘의 방황 상태를 자연스럽게 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈앞에서
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가적 관용구를 직역에 가깝게 옮기되, 한국어로도 이해되는 ‘눈앞에서’로 심판의 시선을 보존했습니다.
theological_decisions:
- issue: 야훼의 분노를 감정 완화 없이 옮길지 여부
  chosen_reading: ‘분노가 … 타올랐고’로 옮겨, 하나님의 진노의 강도를 보존했습니다.
  alternative_readings:
  - ‘야훼께서 이스라엘에게 화를 내셨고’
  - ‘야훼의 노여움이 … 일어났고’
  rationale: 본문의 관용적 이미지(분노가 불타오름)를 약화하지 않고, 심판 선언의 무게를 드러내기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
