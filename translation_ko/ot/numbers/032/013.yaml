base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
  footnotes:
  - marker: a
    text: Or 'the LORD was angry with Israel.' The Hebrew idiom is literally 'the nose/anger of the LORD burned.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he caused them to wander in the wilderness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 분노가 이스라엘을 향해 타올랐고[a], 그분은 야훼 보시기에 악을 행한 온 세대가 다 끝날 때까지 그들을 광야에서 사십 년 동안 떠돌게 하셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 이스라엘에게 진노하셨다.’ 히브리어 관용구를 문자적으로 옮기면 ‘야훼의 코가 타올랐다’이며, 여기서 ‘코’는 분노를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 그들을 광야에서 헤매게 하셨다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  english_pob_choice: the LORD’s anger burned
  chosen_korean: 야훼의 분노가 … 타올랐고
  alternatives_korean:
