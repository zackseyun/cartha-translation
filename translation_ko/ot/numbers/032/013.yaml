  rationale: 단순 서술 연결을 유지하기 위해 ‘그러므로’를 삭제하고, ‘… 끝날 때까지’를 ‘떠돌게 하셨습니다’에 직접 연결하여 히브리어의 기간 한정 구조를 보존했습니다. 평가 관용구는 현대 격식체에 자연스러운 ‘야훼 보시기에’로 옮겼으며, 각주의 히브리어 관용구 설명을 정확히 바로잡았습니다.
