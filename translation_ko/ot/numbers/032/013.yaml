revisions:
- from: 그러므로 야훼의 분노가 이스라엘에게 타올랐고[a], 그가 그들을 광야에서 사십 년 동안 떠돌게 하셨습니다[b]. 이는 야훼의 눈앞에서 악을 행한 그 온 세대가 끝날 때까지였습니다.
