  source_fidelity: 조건절의 핵심 의미는 대체로 충실합니다. 다만 חֲלוּצִים는 ‘무장하고’보다 ‘무장한 채’로 옮길 때 주어인 그들의 전투 준비 상태가 더 분명하며, וְנֹאחֲזוּ는 토지 분배 문맥에서 ‘소유’보다 ‘소유지’를 받는다는 표현이 더 정확합니다.
  naturalness: ‘당신들 가운데서 소유를 받게 될 것입니다’는 현대 한국어에서 다소 부자연스럽고, ‘당신들’은 이 문맥에서 불필요하게 대립적으로 들릴 수 있습니다. ‘여러분 가운데에 소유지를 받게 될 것입니다’가 현대 공식 문체에서 자연스럽습니다.
  terminology: 토지 기업·분배 문맥의 אחז 어근은 일반적 ‘소유’보다 ‘소유지’로 구체화하는 것이 적절합니다. 가나안, 무장, 건너다의 표현은 적절합니다.
