    rationale: נֹאחֲזוּ는 이 문맥에서 가나안 땅 안의 소유지/기업을 배정받아 보유하게 됨을 가리킵니다. ‘소유지’를 사용하면 본문의 토지 분배 의미가 명확해집니다.
