id: NUM.32.30
reference: Numbers 32:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
  footnotes:
  - marker: a
    text: Or 'then they shall be settled among you in the land of Canaan.' The Hebrew verb can denote being established in possession, not merely the act of receiving it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 당신들과 함께 무장하고 건너지 않으면, 가나안 땅에서 당신들 가운데서 소유를 받게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소유를 받게 될 것입니다’는 히브리어 동사의 결과적 의미를 따른 번역입니다. 이 동사는 단순한 ‘받음’뿐 아니라 ‘소유로 확립됨/정착됨’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא
  english_pob_choice: But if they do not
  chosen_korean: 그러나 … 않으면
  alternatives_korean:
  - 그리고 만일 … 않으면
  - 만일 … 않으면
  lexicon: WLC / HALOT
  rationale: 문맥상 앞절과 대비되는 조건이므로 ‘그러나’로 역접을 살리고, 부정 조건은 현대 한국어의 자연스러운 종속절로 처리했습니다.
- source_word: יַעַבְרוּ חֲלוּצִים
  english_pob_choice: cross over armed
  chosen_korean: 무장하고 건너지
  alternatives_korean:
  - 무장한 채 건너지
  - 전투 태세로 건너지
  - 군장하고 건너지
  lexicon: HALOT
  rationale: חֲלוּצִים는 전투를 위해 갖춰 입은 상태를 가리키므로, 간결하면서도 군사적 상태를 드러내는 ‘무장하고’로 옮겼습니다.
- source_word: וְנֹאחֲזוּ
  english_pob_choice: they shall receive property
  chosen_korean: 소유를 받게 될 것입니다
  alternatives_korean:
  - 소유를 차지하게 될 것입니다
  - 소유를 얻게 될 것입니다
  - 정착하게 될 것입니다
  lexicon: HALOT
  rationale: נֹאחֲזוּ는 단순한 수령보다 ‘소유로 붙들림/확보됨’의 결과를 나타내므로, POB의 해석을 따라 수동적 결과를 드러내는 표현을 택했습니다.
- source_word: בְּתֹכְכֶם
  english_pob_choice: among you
  chosen_korean: 당신들 가운데서
  alternatives_korean:
  - 당신들 가운데
  - 당신들 안에서
  lexicon: HALOT
  rationale: 이스라엘 공동체 내부를 가리키는 위치 표현이므로, 공동체 내 포함성을 분명히 하는 ‘가운데서’를 사용했습니다.
theological_decisions:
- issue: 가나안 땅에서의 몫을 받을 조건과 공동체 포함성
  chosen_reading: 요단을 함께 건너 전쟁에 참여하지 않으면, 가나안 땅에서 이스라엘 공동체 안에 소유를 받게 된다는 조건적 약속으로 읽었습니다.
  alternative_readings:
  - 정착하게 된다는 의미로 볼 수 있음
  - 단순히 땅을 ‘받는다’는 법적 분배로 볼 수 있음
  rationale: 히브리어 동사의 결과적·소유적 뉘앙스를 살리되, 문맥상 분배받은 기업을 공동체 안에서 갖게 된다는 뜻이 함께 드러나도록 했습니다.
  doctrine_reference: 민수기 32장의 기업 분배와 공동체 책임
- issue: 화자와 청자의 직접 호칭
  chosen_reading: 직접 대화체를 살려 2인칭 복수 ‘당신들’로 통일했습니다.
  alternative_readings:
  - 너희
  - 당신들께서
  rationale: 본문의 집단적, 법적·서약적 어조를 현대 공식 문체로 유지하기 위한 선택입니다.
  doctrine_reference: 본문 화행의 명령·조건 문맥
