  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
  footnotes:
  - marker: a
    text: Or “go to battle.” The Hebrew says “go to the war,” using a common idiom for entering military conflict.
    reason: lexical_alternative
  - marker: b
    text: “Your brothers” refers to their fellow Israelites from the other tribes.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 모세가 갓 자손과 르우벤 자손에게 말했습니다. "너희 형제들이 전쟁하러 가는데 너희는 여기 앉아 있겠느냐?"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전쟁에 가다.” 히브리어는 군사 충돌에 들어가는 것을 가리키는 흔한 관용구로 “전쟁으로 들어가다”를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: “너희 형제들”은 다른 지파에 속한 이스라엘 동족을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 옮기면서, 이어지는 직접화법을 이끄는 평이한 과거형으로 처리했습니다.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  english_pob_choice: to the sons of Gad and to the sons of Reuben
  chosen_korean: 갓 자손과 르우벤 자손에게
  alternatives_korean:
  - 갓의 아들들과 르우벤의 아들들에게
  - 갓 사람들과 르우벤 사람들에게
  lexicon: HALOT
  rationale: tribal group을 가리키는 בני를 한국어 성경 문맥에 맞게 ‘자손’으로 옮겨, 혈연적·언약적 소속을 유지했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to war
  chosen_korean: 전쟁하러
  alternatives_korean:
  - 전투하러
  - 전쟁에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘전쟁으로/전쟁에 들어가다’의 힘을 살리되, 한국어에서는 ‘전쟁하러 가다’가 가장 자연스럽고 직접적입니다.
- source_word: תֵּשְׁבוּ פֹה
  english_pob_choice: while you sit here
  chosen_korean: 너희는 여기 앉아 있겠느냐
  alternatives_korean:
  - 너희는 여기 머물겠느냐
  - 너희는 여기 남아 있겠느냐
  lexicon: HALOT
  rationale: ישב의 기본 뜻인 ‘앉다/머물다’를 살려, 전쟁에 나가는 형제들과 대비되는 수동적 체류의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 형제들 지칭의 범위
  chosen_reading: ‘너희 형제들’은 다른 지파의 이스라엘 동족을 가리키는 말로 유지했습니다.
  alternative_readings:
  - ‘너희 동족’
  - ‘다른 이스라엘 사람들’
  rationale: 히브리어의 직접적인 친족 호칭을 보존해야 모세의 책망이 갖는 언약 공동체 내부의 긴장과 책임 요구가 드러납니다.
  doctrine_reference: 언약 백성의 상호 책임과 공동체적 연대
