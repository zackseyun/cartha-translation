  lexicon: HALOT
  rationale: 히브리어 관용구 ‘전쟁으로/전쟁에 들어가다’의 힘을 살리되, 한국어에서는 ‘전쟁하러 가다’가 가장 자연스럽고 직접적입니다.
- source_word: תֵּשְׁבוּ פֹה
