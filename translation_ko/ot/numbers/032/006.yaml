base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
  footnotes:
  - marker: a
    text: Or “go to battle.” The Hebrew says “go to the war,” using a common idiom for entering military conflict.
    reason: lexical_alternative
  - marker: b
    text: “Your brothers” refers to their fellow Israelites from the other tribes.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 모세가 갓 자손과 르우벤 자손에게 말했습니다. “너희 형제들[b]은 전쟁에 나가는데[a], 너희는 여기 앉아 있겠느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전쟁에 가다.” 히브리어는 군사 충돌에 참여하는 것을 가리키는 흔한 관용구로 “전쟁에 들어가다”를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: “너희 형제들”은 다른 지파에 속한 이스라엘 동족을 가리킵니다.
    reason: cultural_note
