id: NUM.32.26
reference: Numbers 32:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
  footnotes:
  - marker: a
    text: Or 'our children.' The Hebrew טַף often refers especially to little ones or dependent children.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be there.' The Hebrew verb is simply 'will be,' but in context it implies remaining there while others go on campaign.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 어린 자녀들과 아내들과 가축들과 모든 짐승은 길르앗의 성읍들에 그곳에 머물 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 자녀들’. 히브리어 טַף는 특히 어린아이들이나 부양받는 자녀들을 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에 있을 것입니다’. 히브리어 동사는 단순히 ‘있다’이지만, 문맥상 다른 이들이 출정하는 동안 그곳에 남아 있다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּינוּ
  english_pob_choice: our little children
  chosen_korean: 우리의 어린 자녀들
  alternatives_korean:
  - 우리의 자녀들
  - 우리의 어린이들
  - 우리의 의존하는 자녀들
  lexicon: HALOT
  rationale: טַף는 단순한 ‘자녀’보다 어린아이, 특히 부양이 필요한 어린 자녀를 가리키는 경우가 많아 ‘어린 자녀들’로 옮겨 그 뉘앙스를 살렸습니다.
- source_word: נָשֵׁינוּ
  english_pob_choice: our wives
  chosen_korean: 아내들
  alternatives_korean:
  - 우리의 여자들
  - 우리의 아내들
  lexicon: HALOT
  rationale: 가정과 부족 문맥에서 복수형 ‘아내들’이 가장 자연스럽고, 여성 일반보다 관계가 분명하게 드러납니다.
- source_word: מִקְנֵנוּ
  english_pob_choice: our livestock
  chosen_korean: 가축들
  alternatives_korean:
  - 우리의 가축
  - 우리의 가축 떼
  - 우리의 재산
  lexicon: HALOT
  rationale: מִקְנֶה는 이동 가능한 가축 재산을 가리키므로, 현대 한국어에서는 ‘가축들’이 가장 직접적입니다.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  english_pob_choice: and all our animals
  chosen_korean: 모든 짐승
  alternatives_korean:
  - 모든 동물
  - 모든 가축
  - 모든 짐승들
  lexicon: HALOT
  rationale: 앞의 מִקְנֶה와 구별되는 더 넓은 동물 범주를 살리기 위해 ‘짐승’으로 옮겼습니다. 한국어에서 ‘동물’보다 문맥상 가축성·가산성이 조금 더 분명합니다.
- source_word: בְּעָרֵי הַגִּלְעָד
  english_pob_choice: in the cities of Gilead
  chosen_korean: 길르앗의 성읍들에
  alternatives_korean:
  - 길르앗의 도시들에
  - 길르앗의 마을들에
  - 길르앗 지역의 성읍들에
  lexicon: HALOT
  rationale: עָרִים은 성읍/도시로 옮길 수 있지만, 구약 지명 문맥에서는 전통적으로도 널리 쓰이는 ‘성읍들’이 자연스럽습니다.
theological_decisions:
- issue: יִהְיוּ의 상태 서술을 한국어에서 어떻게 살릴지
  chosen_reading: ‘그곳에 머물 것입니다’로 옮겨, 단순 미래형 ‘될 것입니다’보다 남겨짐/잔류의 상황을 드러냈습니다.
  alternative_readings:
  - 그곳에 있을 것입니다
  - 그곳에 있게 될 것입니다
  rationale: 문맥상 전쟁에 나가는 남성들과 대비되는 잔류를 뜻하므로, 상태 동사를 한국어에서 상황 동사로 풀어 의미를 보존했습니다.
  doctrine_reference: 문맥-기능 대응
