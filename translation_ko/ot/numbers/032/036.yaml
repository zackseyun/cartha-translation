    rationale: 이 절은 앞 절들의 ‘그들이 ...을 지었습니다’에 딸린 목적어 목록입니다. 한국어에서는 문맥상 ‘지었습니다’를 보충해야 건축 목록이라는 의미가 유지됩니다.
