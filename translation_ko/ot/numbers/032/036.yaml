translation:
  language: ko
  text: 또 벧니므라와 벧하란과 요새화된 성읍들과 양 우리들을 지었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  english_pob_choice: Beth-nimrah
  chosen_korean: 벳님라
  alternatives_korean:
  - 벧님라
  - 베스님라
  lexicon: HALOT
  rationale: 고유 지명으로 보고 ‘Beth-’를 한국어 음역으로 옮겼습니다. ‘집’으로 풀지 않고 지명성을 유지하는 것이 본문 의도에 더 가깝습니다.
- source_word: בֵּית הָרָן
  english_pob_choice: Beth-haran
  chosen_korean: 벳하란
  alternatives_korean:
  - 벧하란
  - 베스하란
  lexicon: HALOT
  rationale: 앞의 지명과 같은 방식으로 음역해 연속된 열거의 구조를 살렸습니다. 통상적인 한국어 성경식 표기보다 원문 지명 형태를 드러내는 쪽을 택했습니다.
- source_word: עָרֵי מִבְצָר
  english_pob_choice: fortified cities
  chosen_korean: 견고한 성읍들
  alternatives_korean:
  - 요새 도시들
  - 성채 도시들
  lexicon: HALOT
  rationale: 직역적이되 현대 한국어에서 자연스러운 ‘견고한 성읍들’로 옮겨 방어적 의미를 유지했습니다.
- source_word: גִדְרֹת צֹאן
  english_pob_choice: sheepfolds
  chosen_korean: 양 우리들
  alternatives_korean:
  - 양 우리
  - 양 우리와 축사들
  - 양 떼 우리들
  lexicon: HALOT
  rationale: 가축을 가두는 울타리라는 뜻을 살리면서도 한국어에서 바로 이해되는 ‘양 우리들’로 표현했습니다. 영어 POB의 복수감을 반영해 복수형으로 처리했습니다.
