translation:
  language: ko
  text: 갓의 아들들은 디본과 아다롯과 아로엘을 건설하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘건설하다’를 뜻합니다. 문맥에 따라 ‘재건하다’나 ‘요새화하다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘갓의 아들들’이라고 말하며, 곧 갓 지파 사람들을 뜻합니다.
    reason: lexical_alternative
