base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/003.yaml
  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
  footnotes:
  - marker: a
    text: Hebrew 'Sebam'; elsewhere the related place name appears as 'Sibmah' or 'Shibmah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Beon'; elsewhere the related place name appears in the expanded form 'Baal-meon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아타롯, 디본, 야셀, 님라, 헤스본, 엘르알레, 세밤, 느보, 그리고 브온입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 세밤은 관련 지명에서 시브마 또는 쉽마로도 나타납니다.
    reason: lexical_alternative
  - marker: b
    text: 브온은 관련 본문에서 더 긴 형태인 바알-브온으로도 나옵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  english_pob_choice: Ataroth
  chosen_korean: 아타롯
  alternatives_korean:
  - 아타롯(아타롯)
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 원문 정보 보존에 가장 충실하므로, 한국어 표기는 영어 POB의 표준 음역에 맞춰 아타롯으로 옮겼습니다.
- source_word: יַעְזֵר
  english_pob_choice: Jazer
  chosen_korean: 야셀
  alternatives_korean:
  - 야제르
  - 야자르
  lexicon: HALOT
  rationale: 히브리어 자음과 현행 한국어 성서음역 관행을 고려해 Jazer의 한국어 음역을 야셀로 잡았습니다. 본 절의 고유명사 목록에서는 음가를 살린 음역이 자연합니다.
- source_word: שְׂבָם
  english_pob_choice: Sebam
  chosen_korean: 세밤
  alternatives_korean:
  - 시브마
  - 쉽마
  lexicon: HALOT
  rationale: 본문 형태는 שׂבם이므로, 관련 지명과의 연계 가능성은 남기되 이 절의 표면형을 따라 세밤으로 음역했습니다. 다른 관련형으로 평준화하지 않았습니다.
- source_word: בְּעֹן
  english_pob_choice: Beon
  chosen_korean: 브온
  alternatives_korean:
  - 바알-브온
  lexicon: HALOT
  rationale: 본문에 있는 קצר형 Beon을 그대로 반영해야 하므로, 확대형 바알-브온으로 바꾸지 않고 브온으로 옮겼습니다. 영어 POB가 별도 주석으로 관련형을 인정한 점도 유지했습니다.
theological_decisions:
- issue: 열거문 처리와 문장 종결
  chosen_reading: 이 절은 성읍/지명들의 단순 열거이므로 서술을 덧붙이지 않고 목록형으로 처리했습니다.
  alternative_readings:
  - 문장화하여 '...가 있었습니다'처럼 풀어쓰는 방식
  rationale: 원문은 순수한 명사 열거이며, 의미를 보태면 지리 목록의 압축성과 리듬이 약해집니다. 따라서 한국어도 목록형 구조를 유지했습니다.
  doctrine_reference: 본문 구조 보존 원칙
