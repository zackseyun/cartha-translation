  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
  footnotes:
  - marker: a
    text: Hebrew literally, 'its daughters,' an idiom referring to the smaller settlements dependent on Kenath.
    reason: lexical_alternative
translation:
  language: ko
  text: 노바가 가서 그 도시를 점령하고 그 마을들과 함께 케낫을 빼앗은 뒤, 자기 이름을 따서 그것을 노바라고 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֹבַח
  english_pob_choice: Nobah
  chosen_korean: 노바
  alternatives_korean:
  - 노바흐
  - 노바하
  lexicon: 고유명사 음역
  rationale: 인명과 지명은 음역이 원칙이므로, 영어 POB의 Nobah에 맞추어 한국어에서는 자연스러운 표기인 ‘노바’로 옮겼습니다.
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 붙잡고
  - 사로잡고
  - 차지하고
  lexicon: HALOT לכד
  rationale: 군사적 정복 문맥에서 לכד는 단순 ‘잡다’보다 성읍을 함락·점거하는 뜻이 강하므로, 문맥을 살려 ‘점령하다’로 옮겼습니다.
- source_word: וְאֶת בְּנֹתֶיהָ
  english_pob_choice: and its villages
  chosen_korean: 그 마을들과 함께
  alternatives_korean:
  - 그 딸들과 함께
  - 그 딸 성읍들과 함께
  - 그 속촌들과 함께
  lexicon: HALOT בָּנוֹת
  rationale: 직역하면 ‘그 딸들’이지만, 이는 중심 성읍에 딸린 부속 취락을 뜻하는 관용구이므로 독자가 의미를 바로 이해하도록 ‘그 마을들과 함께’로 풀었습니다.
- source_word: וַיִּקְרָא לָהּ נֹבַח בִּשְׁמוֹ
  english_pob_choice: called it Nobah, after his own name
  chosen_korean: 자기 이름을 따서 그것을 노바라고 불렀습니다
  alternatives_korean:
  - 자기 이름으로 그것을 노바라고 불렀습니다
  - 자기 이름에 따라 그것을 노바라고 불렀습니다
  lexicon: HALOT קרא + בְּשֵׁם
  rationale: 이 표현은 새 이름을 붙인다는 뜻이므로 ‘자기 이름을 따서 …라고 불렀습니다’가 가장 자연스럽고, 영어 POB의 ‘after his own name’도 충실히 반영합니다.
