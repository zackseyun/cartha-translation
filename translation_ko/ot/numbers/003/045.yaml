- from: 레위 사람들을 이스라엘 자손[a]의 모든 첫째 태생[b] 대신에, 그리고 레위 사람들의 가축을 그들의 가축 대신에 취하십시오. 레위 사람들은 내 것이 될 것입니다. 나는 야훼입니다[c].
  to: 레위 사람들을 이스라엘 자손 가운데 있는 모든 맏아들 대신하여[a] 취하시고, 레위 사람들의 가축을 이스라엘 자손의 가축 대신하여[b] 취하십시오. 레위 사람들은 내게 속할 것입니다. 나는 야훼입니다[c].
  rationale: 전치사 בְּ의 범위 의미를 ‘가운데 있는’으로 보완하고, 남성형 בְּכוֹר 및 민수기 3장의 직접 문맥에 맞춰 ‘맏아들’로 수정했습니다. 두 번째 ‘그들의 가축’은 선행사가 혼동되지 않도록 ‘이스라엘 자손의 가축’으로 명시했습니다. 대체 의미를 설명하는 각주 b는 해당 ‘대신하여’에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:54Z'
