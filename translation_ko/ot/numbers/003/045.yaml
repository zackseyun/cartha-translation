  source_fidelity: 히브리어의 반복되는 תַּחַת(대신하여)와 레위 사람 및 그 가축의 대응 대체 관계는 잘 반영되었습니다. 다만 בִּבְנֵי יִשְׂרָאֵל은 ‘이스라엘 자손의’가 아니라 ‘이스라엘 자손 가운데 있는’이라는 범위 표현이므로 이를 본문에서 밝혀야 합니다. 또한 이 문맥의 בְּכוֹר는 남성 단수형이며 민수기 3장의 인구·대속 문맥상 ‘맏아들’이 ‘첫째 태생’보다 정확합니다.
