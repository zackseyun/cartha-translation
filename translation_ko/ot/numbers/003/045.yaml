id: NUM.3.45
reference: Numbers 3:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'instead of.' The Hebrew term expresses substitution.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 레위 사람들을 이스라엘 자손[a]의 모든 첫째 태생[b] 대신에, 그리고 레위 사람들의 가축을 그들의 가축 대신에 취하십시오. 레위 사람들은 내 것이 될 것입니다. 나는 야훼입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 가운데’. 히브리어는 ‘이스라엘 자손’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘대신에’. 히브리어는 대체를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘YHWH’. 전통적으로는 ‘주’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 취하십시오
  alternatives_korean:
  - 가져가십시오
  - 데려가십시오
  lexicon: HALOT
  rationale: 모세에게 주는 직접 명령으로서 행정적·의례적 지시를 자연스럽게 살리기 위해 「취하십시오」를 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 집단 명칭을 현대 한국어에서 자연스럽고 분명하게 전달하면서도, 출신·소속을 드러내는 표현으로 옮겼습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: 대신에
  alternatives_korean:
  - 자리를 대신하여
  - 자리에
  lexicon: HALOT
  rationale: 제의적 대체 관계를 분명히 드러내는 한국어로 옮겼습니다. 이 문맥에서는 단순한 ‘아래에’가 아니라 치환 의미가 핵심입니다.
- source_word: כָּל בְּכוֹר
  english_pob_choice: every firstborn
  chosen_korean: 모든 첫째 태생
  alternatives_korean:
  - 모든 맏아들
  - 각 첫째 태생
  lexicon: HALOT
  rationale: Hebrew בכור의 본문 의미를 성별 한정 없이 살리기 위해 ‘첫째 태생’을 택했습니다. ‘맏아들’은 남성 자녀로 좁혀질 수 있습니다.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손[a]
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구 בני ישראל를 본문 어순에 가깝게 반영하되, 한국어에서는 자연스러운 집단명사로 옮겼습니다. 각주 a로 원문 직역 가능성을 남겼습니다.
- source_word: בֶּהֱמַת הַלְוִיִּם
  english_pob_choice: the livestock of the Levites
  chosen_korean: 레위 사람들의 가축
  alternatives_korean:
  - 레위 사람들의 짐승
  - 레위 사람들의 가축 떼
  lexicon: HALOT
  rationale: בהמה의 집합적 뜻을 현대 한국어에서 가장 자연스럽게 전달하는 기본어를 사용했습니다.
- source_word: בְּהֶמְתָּם
  english_pob_choice: their livestock
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 짐승
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: 대응 평행구조를 살리면서도 소유 대상을 분명히 하기 위해 3인칭 복수 소유를 직설적으로 옮겼습니다.
- source_word: וְהָיוּ לִי
  english_pob_choice: shall be mine
  chosen_korean: 내 것이 될 것입니다
  alternatives_korean:
  - 내 소유가 될 것입니다
  - 내게 속할 것입니다
  lexicon: HALOT
  rationale: 언약적 소유 관계를 자연스러운 미래·귀속 표현으로 옮겼습니다. 영어 POB의 ‘shall be mine’과 같은 선언적 힘을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기를 직접 드러내는 표기를 유지했습니다. 한국어 본문에서도 POB 기본 원칙에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 레위 사람들과 첫째 태생의 대체 관계
  chosen_reading: 레위 사람들을 이스라엘 자손의 모든 첫째 태생 대신에 취하라는 제의적 대체 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 인구 조사 명령으로 읽는 해석
  - ‘대신에’를 약화시켜 단순한 동반 관계로 읽는 해석
  rationale: 본문의 תחת가 반복되어 교환·대체의 의미를 구조적으로 강조하므로, 이를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 민수기 3장의 속량/대속 구조
