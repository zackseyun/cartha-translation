  terminology: ‘레위 사람들’, ‘가축’, ‘야훼’는 일관되고 적절합니다. ‘내 것이 될 것입니다’도 가능하나, לִי의 귀속 의미는 ‘내게 속할 것입니다’로 더 명료하게 드러낼 수 있습니다. 각주 b는 원래 ‘대신에’와 연결되어야 하므로 앵커 위치를 수정합니다.
