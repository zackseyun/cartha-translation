base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'belongs to me' for the repeated phrase 'is mine / to myself / shall be mine.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from man to beast,' a stock expression meaning from humans to animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 첫 새끼는 내 것입니다[a]. 내가 이집트 땅에서 모든 첫 새끼를 치던 날에, 이스라엘의 모든 첫 새끼를 사람에서 짐승에 이르기까지 내게 거룩하게 구별하였습니다. 그들은 내 것이 될 것입니다[b]. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 속합니다’로 옮길 수 있습니다. 반복되는 “내 것입니다 / 내게 / 내 것이 될 것입니다”는 원문의 소유 강조를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람에서 짐승에 이르기까지’라는 관용적 표현으로, 사람과 짐승을 아우르는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
