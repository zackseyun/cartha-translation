  to: 그리고 고핫 자손의 씨족들에 속한 아버지 집의 지도자는 엘리사반, 웃시엘의 아들이었습니다.[a][b]
  rationale: 문장의 핵심 어순과 명사절을 유지하면서, 한국어에서 과도하게 겹친 소유격을 ‘씨족들에 속한 아버지 집’으로 풀었습니다. 이는 בֵּית אָב와 מִשְׁפָּחוֹת가 가리키는 서로 다른 친족 조직 단위를 보존합니다. 인명은 통용 한국어 성경 음역에 맞추어 ‘웃시엘’로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:52Z'
