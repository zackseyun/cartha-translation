id: NUM.3.30
reference: Numbers 3:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
  footnotes:
  - marker: a
    text: Or 'leader' or 'prince' for 'chief' (Heb. נָשִׂיא).
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'father's house,' an idiom for an ancestral or clan household unit.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 고핫 사람들의 가문들의 아버지의 집의 지도자는 엘리사반, 우찌엘의 아들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지도자’는 히브리어 נָשִׂיא의 가능한 번역 가운데 하나입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지의 집’은 혈연 기반의 씨족 단위를 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  english_pob_choice: And the chief
  chosen_korean: 그리고 …의 지도자는
  alternatives_korean:
  - 그리고 …의 수장은
  - 그리고 …의 chief는
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 지파/가문 행정 단위의 책임자를 가리키므로, 왕권을 떠올리기 쉬운 ‘군주’보다 관계적·행정적 의미가 살아 있는 ‘지도자’가 적절합니다. 시작의 ו는 목록을 잇는 연결로 ‘그리고’로 옮겼습니다.
- source_word: בֵּית אָב
  english_pob_choice: the ancestral house
  chosen_korean: 아버지의 집
  alternatives_korean:
  - 조상의 집
  - 가문의 집
  - 아비의 집
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 본문의 족보·씨족 단위를 드러내는 표현으로 유지했습니다. 한국어에서는 ‘아버지의 집’이 다소 직역적이지만, 원문의 친족 구조를 가장 직접적으로 보여 줍니다.
- source_word: לְמִשְׁפְּחֹת
  english_pob_choice: of the families
  chosen_korean: 가문들의
  alternatives_korean:
  - 씨족들의
  - 가족들의
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 핵가족이 아니라 혈연 집단을 뜻하므로, 현대 한국어에서 그 사회적 범위를 비교적 잘 드러내는 ‘가문’으로 옮겼습니다. 복수형은 ‘들의’로 반영했습니다.
- source_word: הַקְּהָתִי
  english_pob_choice: of the Kohathites
  chosen_korean: 고핫 사람들
  alternatives_korean:
  - 고핫 사람들의
  - 고핫 자손들
  lexicon: HALOT
  rationale: 집단 명칭은 관용적으로 ‘~사람들’로 옮겨 씨족 집단임을 자연스럽게 드러냈습니다. ‘고핫’은 음역을 유지했습니다.
- source_word: בֶּן עֻזִּיאֵל
  english_pob_choice: the son of Uzziel
  chosen_korean: 우찌엘의 아들
  alternatives_korean:
  - 우시엘의 아들
  - 웃시엘의 아들
  lexicon: HALOT
  rationale: 족보 공식인 ‘~의 아들’을 그대로 살렸고, 고유명사는 한국어 음역 관습을 따르되 현대 표기에서 비교적 자연스러운 ‘우찌엘’을 택했습니다.
theological_decisions:
- issue: 가문 행정 직함과 족보 표지의 전달
  chosen_reading: ‘지도자’와 ‘아버지의 집/가문’의 결합으로, 본문이 말하는 이스라엘의 씨족 행정 구조를 드러냈습니다.
  alternative_readings:
  - ‘수장’으로 더 강하게 번역
  - ‘조상의 집’으로 관용구를 완화
  rationale: 이 절은 교리적 쟁점보다 이스라엘 공동체의 질서와 족보적 소속을 보여 주는 행정·사회적 진술입니다. 따라서 직함과 친족 구조가 동시에 보이도록 유지하는 것이 가장 충실합니다.
  doctrine_reference: 민수기 1–4장의 레위 지파 조직과 씨족 질서
