base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 레위 사람들을 나를 위하여—나는 야훼다—이스라엘 자손 가운데의 모든 맏아들[a]을 대신하여 취하고, 레위 사람들의 가축을 이스라엘 자손의 가축 가운데의 모든 처음 난 것을 대신하여 취해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손 가운데’는 히브리어의 직역이며, ‘이스라엘 사람들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: And you shall take
  chosen_korean: 그리고 너는 … 취해야 합니다
  alternatives_korean:
