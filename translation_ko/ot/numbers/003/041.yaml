  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 레위 사람들을 나를 위하여—나는 야훼다—이스라엘 자손 가운데의 모든 처음 난 자를 대신하여 취하고, 레위 사람들의 가축을 이스라엘 자손의 가축 가운데의 모든 처음 난 것을 대신하여 취해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손 가운데’는 히브리어의 직역이며, ‘이스라엘 사람들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: And you shall take
  chosen_korean: 그리고 너는 … 취해야 합니다
  alternatives_korean:
  - 그리고 너는 … 데려가야 합니다
  - 그리고 너는 … 받아야 합니다
  lexicon: HALOT
  rationale: 명령형 법률문맥의 지시를 한국어 합쇼체로 옮기되, 단순 이동보다 지정·취임의 의미가 강한 ‘취하다’를 사용해 문맥의 기능을 살렸습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 지파 집단을 가리키는 고유한 인명을 자연스럽게 드러내면서도, 한국어 성경에서 익숙한 ‘레위 사람들’로 옮겼습니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 내게
  - 내 것을 위하여
  lexicon: HALOT
  rationale: 단순 목적지보다 봉헌·귀속의 뜻이 강하므로 ‘나를 위하여’가 더 자연스럽고, 앞뒤의 대체 규정과도 잘 맞습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: …를 대신하여
  alternatives_korean:
  - …의 자리에
  - …을 대신해
  lexicon: HALOT
  rationale: 교환·대체 관계를 분명히 나타내는 표현으로, 첫째 태생과 가축의 대속적 대체 의미를 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명칭을 지시하는 자리이므로 표제를 대체하지 않고 고유명사로 드러냈습니다. 본문 내 자기선언이기도 하므로 ‘나는 야훼다’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 대체 규정의 신학적 뉘앙스
  chosen_reading: 대속/대체 질서를 직접 드러내는 ‘대신하여’
  alternative_readings:
  - 단순히 …의 몫으로
  - …을 대신해
  rationale: 레위인과 그 가축이 이스라엘의 처음 난 것들을 대신하는 구조는 단순 분배가 아니라 대체 질서이므로, 그 긴장을 희석하지 않도록 ‘대신하여’를 반복해 보존했습니다.
  doctrine_reference: Numbers 3:41 substitution logic in census/redemption context
