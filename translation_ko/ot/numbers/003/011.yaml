- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시되
  - 말하며
  lexicon: HALOT
  rationale: 히브리어의 다음 발화 도입 공식은 한국어에서 중복을 피하며 자연스럽게 앞절의 서술 동사에 흡수해 표현할 수 있어, 별도의 ‘말하며’를 두지 않고 문장 흐름으로 처리했습니다.
