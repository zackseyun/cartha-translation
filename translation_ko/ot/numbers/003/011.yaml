lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 말씀하셨습니다'
  - 그때 ... 말씀하셨다
  lexicon: HALOT
  rationale: 와우 연속형이 서술 흐름을 진전시키므로 문맥상 자연스러운 ‘그때’를 두었고, דבר의 격식 있는 동사를 살려 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
