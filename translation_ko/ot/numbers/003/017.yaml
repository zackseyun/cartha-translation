lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: were
  chosen_korean: 이들은 …입니다
  alternatives_korean:
  - 이들이 있었습니다
  - 이들은 되었습니다
  lexicon: HALOT
  rationale: 계보 목록의 도입에서 היה는 상태 진술로 쓰이므로, 변화 의미보다 단순한 존재 진술인 ‘…입니다’가 가장 자연스럽습니다.
- source_word: בְנֵי לֵוִי
  english_pob_choice: the sons of Levi
  chosen_korean: 레위의 아들들
  alternatives_korean:
  - 레위의 자손들
  - 레위의 자녀들
  lexicon: HALOT
  rationale: 문맥상 레위의 직계 아들들을 가리키므로, 관계를 분명히 드러내는 ‘아들들’이 원문에 가장 가깝습니다.
- source_word: בִּשְׁמֹתָם
  english_pob_choice: by their names
  chosen_korean: 그 이름은 이렇습니다
  alternatives_korean:
  - 이름대로
  - 이름으로
  - 그 이름들로
  lexicon: HALOT
  rationale: 직역형 ‘그들의 이름으로’는 한국어에서 부자연스러워, 목록 도입 기능을 살려 ‘그 이름은 이렇습니다’로 옮겼습니다.
- source_word: גֵּרְשׁוֹן / קְהָת / מְרָרִי
  english_pob_choice: Gershon / Kohath / Merari
  chosen_korean: 게르손 / 고핫 / 므라리
  alternatives_korean:
  - 게르숀 / 고핫 / 메라리
  - 게르손 / 케핫 / 메라리
  lexicon: Proper name transliteration
  rationale: 한국어 성경에서 널리 통용되는 인명 표기를 따르되, 음가와 관용을 함께 고려해 게르손, 고핫, 므라리를 사용했습니다.
theological_decisions:
