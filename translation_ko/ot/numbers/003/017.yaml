  alternative_readings:
  - '이들은 레위의 아들들이었습니다:'
  - '레위의 아들들은 이들입니다:'
  rationale: 히브리어와 영어 POB 모두 소개구 뒤에 이름 목록을 두는 형식이므로, 한국어에서도 동일한 정보 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 보존 및 형식 일치
