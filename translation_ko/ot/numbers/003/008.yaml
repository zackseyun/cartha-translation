  rationale: 목적절을 명시하여 לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן의 기능을 보존하고, 각주를 מִשְׁמֶרֶת의 번역어 ‘직무’로 옮겼습니다. ‘이스라엘 자손의 직무’는 히브리어 속격 결합의 간결성과 해석 여지를 유지합니다.
