  verdict: revise
  source_fidelity: 히브리어의 목적 표현 לַעֲבֹד(‘…하기 위하여’)과 ‘회막’(אֹהֶל מוֹעֵד) 및 ‘성막’(הַמִּשְׁכָּן)의 구별은 유지하는 것이 좋습니다. 현 번역은 의미상 대체로 충실하나, ‘지켜, … 수행해야 합니다’의 연결이 목적 관계를 충분히 드러내지 못합니다. 또한 각주 표지는 מִשְׁמֶרֶת에 해당하는 ‘직무’에 붙어야 합니다.
  naturalness: ‘성막의 봉사를 하기 위해 … 지켜야 합니다’로 옮기면 현대 표준 한국어 합쇼체로 자연스럽고, 히브리어의 목적 관계도 분명해집니다. ‘기물’은 제의 문맥에서 적절한 포괄적 표현입니다.
  terminology: ‘회막’과 ‘성막’을 각각 유지하고, בְּנֵי יִשְׂרָאֵל은 전통적이면서도 원문의 집합적 표현을 보존하는 ‘이스라엘 자손’으로 유지합니다. מִשְׁמֶרֶת의 ‘직무’는 문맥상 가능하며, 대안 의미를 각주로 제시합니다.
  issues:
