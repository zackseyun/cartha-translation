    issue: 각주 표지가 ‘회막’ 뒤에 놓여 있으나, 각주의 어휘 대안은 מִשְׁמֶרֶת(‘직무’)에 관한 것입니다.
    rationale: 각주 앵커는 해당 원어 어휘의 번역어인 ‘직무’에 붙어야 독자가 대안의 적용 대상을 정확히 알 수 있습니다.
  - severity: low
