id: NUM.3.8
reference: Numbers 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'the charge' or 'the duty' of the sons of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성막의 봉사를 하기 위해 회막의 모든 기물과 이스라엘 자손의 직무를 지켜야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맡은 일’ 또는 ‘책임’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  english_pob_choice: They shall keep charge of
  chosen_korean: 지켜
  alternatives_korean:
  - 맡아 지켜
  - 관리해야 합니다
  - 보호해야 합니다
  lexicon: HALOT
  rationale: 제사장적·성막 문맥의 שׁמר는 단순한 관찰보다 맡겨진 직무를 지키고 보전하는 뜻이 강하므로, 간결한 ‘지켜’로 옮기되 뒤의 목적어와 결합해 직무적 뉘앙스를 살렸습니다.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  english_pob_choice: all the furnishings of the tent of meeting
  chosen_korean: 회막의 모든 기물
  alternatives_korean:
  - 회막의 모든 기구
  - 회막의 모든 비품
  - 회막의 모든 용기
  lexicon: HALOT
  rationale: כְּלִים은 단순한 그릇보다 성막에 속한 여러 물품 전체를 가리킬 수 있으므로, 현대 한국어에서 가장 포괄적이고 자연스러운 ‘기물’을 택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 집합표현을 그대로 살리면서도 한국어 성서 용례상 자연스러운 전승형인 ‘이스라엘 자손’을 유지했습니다.
- source_word: מִשְׁמֶרֶת
  english_pob_choice: the obligation
  chosen_korean: 직무
  alternatives_korean:
  - 책임
  - 맡은 일
  - 의무
  lexicon: HALOT
  rationale: 이미 앞절에 ‘지키다’가 나오므로, מִשְׁמֶרֶת를 다시 ‘지킴’으로 반복하기보다 맡겨진 제의적 역할을 드러내는 ‘직무’로 옮겼습니다.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  english_pob_choice: the service of the tabernacle
  chosen_korean: 성막의 일
  alternatives_korean:
  - 성막의 봉사
  - 성막의 섬김
  - 성막의 사역
  lexicon: HALOT
  rationale: עֲבֹדָה는 제의적 노동과 봉사를 포함하지만, 여기서는 뒤의 목적부와 함께 기능을 설명하는 표현이므로 현대적이면서도 넓은 뜻을 지닌 ‘일’로 풀었습니다.
theological_decisions:
- issue: 회막/성막의 제의적 직무 표현
  chosen_reading: ‘지키다’와 ‘직무’와 ‘성막의 일’을 함께 써서, 단순 보관이 아니라 하나님께 맡겨진 제의적 책임이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘관리하다’ 중심으로 옮김
  - ‘의무’와 ‘봉사’로만 표현함
  rationale: 본문은 기물 보관만이 아니라 회막과 성막 봉사의 전체 책임을 말하므로, 한국어에서도 보호·책임·수행의 세 층위를 함께 드러내는 것이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: Numbers 3:8의 성막 봉직 문맥
