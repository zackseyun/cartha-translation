  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: 'Hebrew: ''silver of the redeemed ones''; that is, the payment collected for redemption.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼의 명령대로 속전 곧 속량된 사람들의 돈을 아론과 그의 아들들에게 주었습니다. 야훼께서 모세에게 명령하신 대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘속량된 자들의 은’; 곧 속량을 위해 거둔 지불액입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַפְּדֻיִם
  english_pob_choice: the redemption money
  chosen_korean: 속전 곧 속량된 사람들의 돈
  alternatives_korean:
  - 구속 금액
  - 속량 כסף
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘은’이 아니라 속량을 위해 거둔 지불액이므로, ‘속전’으로 기능을 드러내고 뒤에 ‘속량된 사람들의 돈’으로 히브리어의 문자적 의미를 보완했습니다.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  english_pob_choice: to Aaron and to his sons
  chosen_korean: 아론과 그의 아들들에게
  alternatives_korean:
  - 아론과 아들들에게
  - 아론과 그 아들들에게
  lexicon: HALOT
  rationale: 반복되는 전치사를 한국어에서는 자연스럽게 한 번으로 처리하되, 소유 관계는 ‘그의 아들들’로 분명히 나타냈습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령대로
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입에서 나온 대로
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 입에 따라’이지만, 한국어에서는 관용적 의미인 ‘명령대로’가 원문의 권위와 순종의 뉘앙스를 가장 분명하게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 טֵ트라그라마톤을 관행적 대체어가 아닌 음역 ‘야훼’로 옮겨, 본문이 가진 고유한 언약적 이름을 보존했습니다.
theological_decisions:
- issue: ‘속전/속량’의 이중 표현
  chosen_reading: ‘속전 곧 속량된 사람들의 돈’으로 처리해, 제의적 지불과 그 대상이 된 사람들의 상태를 함께 드러냈습니다.
  alternative_readings:
  - ‘속량의 돈’
  - ‘구속금’
  rationale: 히브리어 결합구는 단순한 금전이 아니라 속량 행위와 연결된 지불을 가리키므로, 한국어에서도 기능과 대상을 함께 보이도록 했습니다.
  doctrine_reference: 민수기 3장의 레위인 속량 규정 문맥
