translation:
  language: ko
  text: 한 달 된 남자아이부터 그 이상의 모든 남자의 수를 따라, 팔천육백 명이었고, 그들은 성소의 직무를 지키는 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 직무를 지키는 사람들’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  english_pob_choice: By the number of
  chosen_korean: 수를 따라
  alternatives_korean:
  - 숫자에 따라
  - 계수하여
  - 인원수로
  lexicon: HALOT
  rationale: 인구 조사 공식의 수량 기준을 자연스러운 한국어로 옮기되, 단순한 서술보다 집계 기준이라는 뉘앙스를 살렸습니다.
- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 모든 남자아이
  alternatives_korean:
  - 모든 남자
  - 남자마다
  - 모든 수컷
  lexicon: HALOT
  rationale: 출생 한 달 기준과 결합해 실제 집계 대상이 남성 유아임을 드러내기 위해 ‘남자아이’로 풀었습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 된 …부터 그 이상의
  alternatives_korean:
  - 한 달 이상 된
  - 한 달부터 그 위의
  - 한 달 이상
  lexicon: HALOT
  rationale: 연령 경계 표현을 직역에 가깝게 살리면서, 한국어에서는 ‘한 달 된 …부터 그 이상의’로 자연스럽게 연결했습니다.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  english_pob_choice: keeping charge
  chosen_korean: 직무를 지키는 사람들이었습니다
  alternatives_korean:
  - 책임을 지키는 사람들이었습니다
  - 맡은 직분을 수행하는 사람들이었습니다
  - 보초 서는 사람들이었습니다
  lexicon: HALOT
  rationale: 성막 봉사의 상시적 책임을 나타내는 표현으로, 단순 경비보다 제의적 ‘직무’의 지속성을 더 잘 드러냅니다.
theological_decisions:
- issue: הַקֹּדֶשׁ의 범위
  chosen_reading: ‘성소’로 옮겨, 성막 체계 안의 거룩한 영역을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 거룩한 곳
  - 성물
  - 성전
  rationale: 문맥상 추상적 ‘거룩함’이 아니라 레위인들이 맡은 제의적 관리 구역을 가리키므로, 전통어보다 ‘성소’가 소스 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 민수기 3장 레위인의 성막 봉사 문맥
