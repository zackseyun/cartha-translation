translation:
  language: ko
  text: 므라리 자손이 맡은 직무는 성막의 널판[a]과 그 가로대와 그 기둥과 그 받침[b]과 그 모든 기구와 그 모든 봉사[c]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘널판’은 여기서 성막의 구조 부재를 가리키며, ‘판자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침’은 ‘소켓’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 모든 봉사’는 ‘그와 관련된 모든 일’ 또는 ‘그 모든 작업’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  english_pob_choice: appointed duty
  chosen_korean: 맡은 직무
  alternatives_korean:
