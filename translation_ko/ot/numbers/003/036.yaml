base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
  footnotes:
  - marker: a
    text: Or 'the boards of the tabernacle' for 'the frames of the tabernacle.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its sockets' for 'its bases.'
    reason: lexical_alternative
  - marker: c
    text: Or 'all the work connected with it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므라리의 아들들의 맡은 직무는 성막의 널판과 그 띠와 그 기둥과 그 받침과 그 모든 기구와 그 모든 봉사였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘널판’은 여기서 성막의 구조 부재를 가리키며, ‘판자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침’은 ‘소켓’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기구’는 ‘모든 작업과 관련된 것’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  english_pob_choice: appointed duty
  chosen_korean: 맡은 직무
  alternatives_korean:
  - 임명된 책임
  - 지정된 직무
  - 맡겨진 책임
  lexicon: HALOT
  rationale: 감독·책무의 뉘앙스를 살리면서도 한국어에서 자연스럽고, 뒤의 목록을 이끄는 제의적 ‘직무’의 성격을 드러냅니다.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  english_pob_choice: the frames of the tabernacle
  chosen_korean: 성막의 널판
  alternatives_korean:
  - 성막의 틀
  - 성막의 판자
  - 성막의 골격
  lexicon: HALOT
  rationale: POB의 ‘frames’는 탭나클 구조물의 목재 부재를 가리키므로, 성막 맥락에서 익숙하고 본문 전통에도 맞는 ‘널판’을 택했습니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 소켓
  - 그 기초받침
  - 그 바탕
  lexicon: HALOT
  rationale: 제의용 구조물의 결합부를 가리키는 말이므로, 현대 독자가 이해하기 쉬운 ‘받침’으로 옮겼습니다.
- source_word: כָל כֵּלָיו
  english_pob_choice: all its furnishings
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 장비
  - 그 모든 용구
  lexicon: HALOT
  rationale: 성막과 관련된 넓은 범주의 물품을 가리키므로, 너무 가구화된 ‘furnishings’보다 기능성을 살린 ‘기구’가 문맥에 더 가깝습니다.
- source_word: כֹל עֲבֹדָתוֹ
  english_pob_choice: all its service
  chosen_korean: 그 모든 봉사
  alternatives_korean:
  - 그 모든 일
  - 그 모든 작업
  - 그와 관련된 모든 섬김
  lexicon: HALOT
  rationale: עֲבֹדָה의 예배적·봉사적 뉘앙스를 보존하기 위해, 단순 노동보다 제의적 의미가 살아 있는 ‘봉사’를 선택했습니다.
theological_decisions:
- issue: 성막 관련 용어의 제의적 뉘앙스 보존
  chosen_reading: ‘맡은 직무’와 ‘봉사’로 번역해 단순한 물적 운반이 아니라 야훼 성막 섬김의 지정된 책임임을 드러냈습니다.
  alternative_readings:
  - ‘책임’과 ‘일’로 평이하게 옮기는 방식
  - ‘관리’와 ‘노동’으로 기능 중심으로 옮기는 방식
  rationale: 본문은 레위 자손에게 배당된 성막 섬김을 열거하므로, 일반 업무보다 거룩한 봉사의 성격을 살리는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 민수기 레위 직무 규정, 성막 봉사 개념
