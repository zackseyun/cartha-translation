- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  english_pob_choice: the frames of the tabernacle
  chosen_korean: 성막의 널판
  alternatives_korean:
  - 성막의 틀
  - 성막의 판자
  - 성막의 골격
  lexicon: HALOT
  rationale: POB의 ‘frames’는 탭나클 구조물의 목재 부재를 가리키므로, 성막 맥락에서 익숙하고 본문 전통에도 맞는 ‘널판’을 택했습니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 소켓
  - 그 기초받침
  - 그 바탕
  lexicon: HALOT
  rationale: 제의용 구조물의 결합부를 가리키는 말이므로, 현대 독자가 이해하기 쉬운 ‘받침’으로 옮겼습니다.
- source_word: כָל כֵּלָיו
  english_pob_choice: all its furnishings
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 장비
  - 그 모든 용구
  lexicon: HALOT
  rationale: 성막과 관련된 넓은 범주의 물품을 가리키므로, 너무 가구화된 ‘furnishings’보다 기능성을 살린 ‘기구’가 문맥에 더 가깝습니다.
- source_word: כֹל עֲבֹדָתוֹ
  english_pob_choice: all its service
  chosen_korean: 그 모든 봉사
  alternatives_korean:
  - 그 모든 일
  - 그 모든 작업
  - 그와 관련된 모든 섬김
  lexicon: HALOT
  rationale: עֲבֹדָה의 예배적·봉사적 뉘앙스를 보존하기 위해, 단순 노동보다 제의적 의미가 살아 있는 ‘봉사’를 선택했습니다.
theological_decisions:
- issue: 성막 관련 용어의 제의적 뉘앙스 보존
  chosen_reading: ‘맡은 직무’와 ‘봉사’로 번역해 단순한 물적 운반이 아니라 야훼 성막 섬김의 지정된 책임임을 드러냈습니다.
  alternative_readings:
  - ‘책임’과 ‘일’로 평이하게 옮기는 방식
  - ‘관리’와 ‘노동’으로 기능 중심으로 옮기는 방식
  rationale: 본문은 레위 자손에게 배당된 성막 섬김을 열거하므로, 일반 업무보다 거룩한 봉사의 성격을 살리는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 민수기 레위 직무 규정, 성막 봉사 개념
