base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the descendants of Aaron and Moses.' The Hebrew heading uses 'generations,' a standard formula that can introduce a family line or what proceeds from someone.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the day when,' an idiom meaning 'at the time when' or simply 'when.'
    reason: lexical_alternative
  - marker: c
    text: Or 'spoke to Moses.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 아론과 모세의 계보입니다. 야훼께서 시내산에서 모세에게 말씀하신 때입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘계보’는 후손 목록을 여는 표제이거나, 어떤 인물에게서 비롯되는 내용을 가리키는 정형 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘in the day when’은 여기서 ‘~할 때’라는 뜻의 시간 관용구입니다.
    reason: source_note
  - marker: c
    text: ‘모세에게’는 히브리어의 목적격 표지를 한국어로 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것은
  alternatives_korean:
  - 그리고 이것은
  - 자, 이것은
  lexicon: HALOT
  rationale: 새 단락을 여는 지시어로 보아 한국어에서는 간결한 도입 표현인 ‘이것은’을 사용해 구조를 살렸습니다.
- source_word: תּוֹלְדֹת
  english_pob_choice: the generations
  chosen_korean: 계보
  alternatives_korean:
  - 자손
  - 후손
  - 가계
  lexicon: HALOT
  rationale: 이 절은 뒤이어 아론의 아들들을 열거하는 표제이므로, 한국어에서는 표제 기능을 드러내는 ‘계보’가 가장 자연스럽고도 본문 구조를 잘 보존합니다.
- source_word: בְּיוֹם
  english_pob_choice: at the time when
  chosen_korean: ~하신 때입니다
  alternatives_korean:
  - ~하던 날입니다
  - ~하던 때입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘in the day when’의 시간 의미를 살려, 현대 한국어에서는 자연스러운 ‘~하신 때’로 옮겼습니다.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  english_pob_choice: spoke with Moses
  chosen_korean: 모세에게 말씀하신
  alternatives_korean:
  - 모세와 말씀하신
  - 모세에게 말씀하셨습니다
  lexicon: HALOT
  rationale: דבר + את는 직접 대면한 발화 관계를 나타내므로, 한국어에서는 성경적·자연스러운 ‘~에게 말씀하다’로 옮겨 담았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체 관습보다 원문 고유명을 우선하는 본 프로젝트 기준에 따라, 여호와나 주님 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 아론과 모세를 함께 묶는 표제의 범위
  chosen_reading: ‘아론과 모세의 계보’로 직역에 가깝게 유지하되, 뒤의 아론 계열 전개와의 긴장을 해소하지 않았습니다.
  alternative_readings:
  - ‘아론의 자손들’로 좁혀 번역
  - ‘아론과 모세의 후손들’로 해석
  rationale: 히브리어 표제는 모세까지 함께 적고 있으므로, 문맥상 설명을 덧붙여 범위를 축소하기보다 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
