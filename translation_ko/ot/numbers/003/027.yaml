  source_fidelity: 씨족 및 네 하위 친족 집단의 열거는 히브리어 원문에 충실합니다. 다만 결론의 הַקְּהָתִי는 고핫에 속한 집단을 가리키므로, ‘고핫 사람’이라는 단수 표현보다 ‘고핫 자손’이 원문의 친족·집단 의미를 더 정확히 전달합니다. ‘모두’는 원문에 명시되어 있지는 않으나, 열거한 집단을 묶어 가리키는 문맥상 의미를 크게 바꾸지는 않습니다.
  naturalness: ‘고핫 사람의 씨족들’은 단수 ‘사람’과 복수 ‘씨족들’의 결합이 다소 어색합니다. ‘고핫 자손의 씨족들’이 족보·인구 조사 문맥에 자연스럽고 앞선 ‘암람 자손’ 등의 표현과도 일관됩니다.
