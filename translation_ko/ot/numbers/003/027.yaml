base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: ko
  text: 그리고 고핫에게는 암람 자손의 씨족과 이스할 자손의 씨족과 헤브론 자손의 씨족과 웃시엘 자손의 씨족이 있으니, 이들은 고핫 자손의 씨족들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족
  lexicon: HALOT
  rationale: 인구 조사와 족보 문맥에서 מִשְׁפָּחָה는 혈연 하위 집단을 가리키므로, 현대 한국어에서는 행정·족보적 뉘앙스를 살리는 ‘씨족’이 가장 자연스럽습니다.
- source_word: הַֽ/עַמְרָמִי ... הָֽ/עָזִּיאֵלִי
  english_pob_choice: the Amramites ... the Uzzielites
  chosen_korean: 암람 자손 ... 웃시엘 자손
  alternatives_korean:
  - 암람 사람들 ... 웃시엘 사람들
  - 암람 족속 ... 웃시엘 족속
  lexicon: HALOT
  rationale: 히브리어 친족형 형용사는 이름의 후손 집단을 뜻하므로, 한국어에서는 ‘자손’으로 옮겨 혈연적 파생 관계를 분명히 했습니다.
- source_word: אֵלֶּה הֵם
  english_pob_choice: these are
  chosen_korean: 이들은 모두 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이들이 바로 …입니다
  lexicon: HALOT
  rationale: 뒤에 열거된 집단들을 종합해 식별하는 문장이라, ‘모두’로 합산·요약의 기능을 드러내면서도 원문의 식별 진술을 유지했습니다.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  english_pob_choice: the clans of the Kohathites
  chosen_korean: 고핫 사람의 씨족들
  alternatives_korean:
  - 고핫 자손의 씨족들
  - 고핫 족속의 씨족들
  lexicon: HALOT
  rationale: 문장 전체가 고핫 계열의 하위 씨족 목록을 마무리하므로, ‘고핫 사람’으로 상위 집단 소속을 간결하게 표시하고 복수형 ‘씨족들’로 원문의 복수를 반영했습니다.
