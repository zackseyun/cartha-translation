id: NUM.3.24
reference: Numbers 3:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
  footnotes:
  - marker: a
    text: Hebrew 'father's house,' an Israelite kinship term for an ancestral family or clan unit.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그르손 사람들의 조상 가문의 수장은 엘리아삽이었는데, 그는 라엘의 아들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/נְשִׂיא
  english_pob_choice: And the chief
  chosen_korean: 그리고 … 수장은
  alternatives_korean:
  - 그리고 … 지도자는
  - 그리고 … 방백은
  lexicon: HALOT
  rationale: נָשִׂיא는 이 행정·계보 문맥에서 왕족보다 부족/가문을 대표하는 공식적 우두머리를 가리키므로, 한국어에서는 ‘수장’이 가장 자연스럽고 의미도 정확합니다.
- source_word: בֵית אָב
  english_pob_choice: of the ancestral house
  chosen_korean: 조상 가문의
  alternatives_korean:
  - 아버지의 집의
  - 가문의
  lexicon: HALOT
  rationale: 히브리어의 관용구인 ‘아버지의 집’은 혈통 단위의 가문/씨족을 뜻하므로, 직역보다 사회 구조를 드러내는 ‘조상 가문’이 더 분명합니다.
- source_word: לַ/גֵּרְשֻׁנִּי
  english_pob_choice: of the Gershonites
  chosen_korean: 그르손 사람들의
  alternatives_korean:
  - 게르손 사람들의
  - 그르손 지파의
  lexicon: HALOT
  rationale: 지명형이 아니라 레위의 후손 집단을 가리키므로 집합적 표현인 ‘사람들’로 옮겼고, 고유명은 한국어 음역 관행에 맞춰 ‘그르손’으로 적었습니다.
- source_word: אֶלְיָסָף
  english_pob_choice: Eliasaph
  chosen_korean: 엘리아삽
  alternatives_korean:
  - 엘리야삽
  - 엘리사삽
  lexicon: 표준 음역
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 옮겼습니다.
- source_word: בֶּן לָאֵל
  english_pob_choice: son of Lael
  chosen_korean: 라엘의 아들이었습니다
  alternatives_korean:
  - 라엘의 아들이었습니다
  - 라엘의 아들입니다
  lexicon: HALOT
  rationale: 계보식 서술이므로 소속을 나타내는 ‘~의 아들’로 옮겼고, 서술형 종결은 본문의 진술체를 살려 ‘-었습니다’로 처리했습니다.
