  - 고핫의 후손들
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘고핫의 아들들’이지만, 혈통 집단을 자연스럽게 드러내면서도 원문의 친족 표현을 보존하기 위해 ‘자손들’을 택했습니다.
- source_word: יַחֲנוּ
  english_pob_choice: shall camp
  chosen_korean: 진을 칩니다
  alternatives_korean:
  - 진을 칠 것입니다
