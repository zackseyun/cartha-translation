  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
  footnotes:
  - marker: a
    text: Or 'the descendants of Kohath' or 'the Kohathites.' The Hebrew reads literally 'the sons of Kohath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고핫 자손들의 씨족은 성막 남쪽에 진을 칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘고핫의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족들
  - 지파 아래의 가족 단위
  lexicon: HALOT
  rationale: 전쟁·진영 배치 문맥에서 immediate family보다 큰 친족 단위를 가리키므로, 현대 한국어에서 사회적 단위를 분명히 드러내는 ‘씨족’이 가장 잘 맞습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫 자손들
  alternatives_korean:
  - 고핫의 아들들
  - 고핫인들
  - 고핫의 후손들
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘고핫의 아들들’이지만, 혈통 집단을 자연스럽게 드러내면서도 원문의 친족 표현을 보존하기 위해 ‘자손들’을 택했습니다.
- source_word: יַחֲנוּ
  english_pob_choice: shall camp
  chosen_korean: 진을 칩니다
  alternatives_korean:
  - 진을 칠 것입니다
  - 진을 치게 됩니다
  - 야영합니다
  lexicon: HALOT
  rationale: 명령·배치의 규정 문맥이므로 ‘shall camp’의 지시적 미래를 한국어 현재형 규정문으로 옮기는 것이 가장 자연스럽습니다.
- source_word: עַל יֶרֶךְ
  english_pob_choice: on the south side
  chosen_korean: 남쪽에
  alternatives_korean:
  - 남쪽 편에
  - 남쪽 옆에
  - 남쪽 면에
  lexicon: HALOT
  rationale: ‘side/flank’의 공간 관계를 한국어에서 간결하게 표현하기 위해 ‘남쪽에’로 처리하되, 진영 배치라는 문맥이 이미 방향성을 분명히 합니다.
theological_decisions:
- issue: 성막(הַמִּשְׁכָּן) 번역
  chosen_reading: ‘성막’으로 번역해 야훼의 임재 처소라는 성소적 의미를 분명히 드러냈습니다.
  alternative_readings:
  - 장막
  - 거처
  - 성소
  rationale: 민수기 문맥에서 הַמִּשְׁכָּן은 단순한 천막이 아니라 이스라엘 진영 한가운데 있는 거룩한 임재 공간을 가리키므로, 한국어 성경 용례와 의미를 함께 살린 ‘성막’이 적절합니다.
  doctrine_reference: 출애굽기 25–40장, 민수기 1–4장 성막-진영 배치 문맥
