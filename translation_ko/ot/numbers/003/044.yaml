lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서사 공식에서 דבר는 단순 발화보다 권위 있는 발화를 나타내므로, 현대 한국어에서 자연스럽고 존중을 보이는 「말씀하셨습니다」로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 audit trail을 따라 신성명을 대체 титул로 바꾸지 않고, 원문 고유명사로서 「야훼」를 사용했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 께
  - 에게로
  lexicon: HALOT
  rationale: 발화의 수신자를 표시하는 전치사는 한국어에서 가장 직접적인 목적격 조사 「에게」가 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하며
  lexicon: HALOT
  rationale: 히브리어 서술 공식에서는 뒤따르는 직접화법을 도입하는 기능이므로, 한국어에서는 중복을 피하고 본동사에 흡수해 매끈하게 처리했습니다.
theological_decisions:
- issue: 신성명 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신성명을 사용하므로, 그 의미를 일반 호칭으로 희석하지 않고 POB 기준에 따라 고유한 언약 이름으로 드러냈습니다.
  doctrine_reference: 'POB doctrine: יְהוָה YHWH → Yahweh'
- issue: 직접화법 도입 공식의 중복 처리
  chosen_reading: 말씀하셨습니다[a]
  alternative_readings:
  - 말씀하여 이르셨습니다
  - 말하셨습니다
  rationale: וַיְדַבֵּר ... לֵאמֹר의 표준 서사 공식은 한국어에서 한 번의 자연스러운 서술로 묶는 것이 가장 정확하며, 내용상 추가 의미를 만들지 않습니다.
  doctrine_reference: Hebrew narrative discourse convention
