review_pass:
  verdict: revise
  source_fidelity: 히브리어는 므라리 아래에 속하는 두 씨족을 열거한 뒤 그것들이 ‘므라리의 씨족들’이라고 확인합니다. 초안의 ‘므라리에게는’은 לְ의 분류·표제 기능을 사람에게 향하는 여격처럼 들리게 하므로, 소속 관계를 더 직접적으로 나타내는 표현이 안전합니다. 또한 הַמַּחְלִי는 인명 ‘마흘리’가 아니라 그에게서 나온 씨족명입니다.
  naturalness: ‘므라리의 씨족은 말리 씨족과 무시 씨족입니다’는 족보·인구 조사 목록에 자연스럽고 공식적인 합쇼체입니다. 이어지는 요약문도 원문의 확인 표현을 유지합니다.
  terminology: מִשְׁפָּחָה는 일관되게 ‘씨족’으로 옮겼습니다. 한국어 성경의 통용 표기에 맞춰 Mahli는 ‘말리’, Mushi는 ‘무시’, Merari는 ‘므라리’로 표기했습니다. ‘말리 씨족/무시 씨족’은 히브리어의 씨족명(말리 사람들, 무시 사람들)을 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ‘므라리에게는’
    rationale: 원문의 לְ는 이 목록에서 므라리에게 속한 분파를 제시하는 분류 표지입니다. 한국어의 ‘-에게는’은 수여자·대상 용법을 우선 떠올리게 하므로 ‘므라리의 씨족은’이 소속 관계를 더 정확하고 자연스럽게 나타냅니다.
  - severity: low
    issue: ‘마흘리의 씨족’
    rationale: 이 절의 הַמַּחְלִי는 개인 마흘리를 가리키기보다 말리 계통의 씨족명입니다. 또한 표준 한국어 성경의 통용 인명 표기는 ‘말리’입니다. ‘말리 씨족’이 씨족명임을 분명히 합니다.
  revised_text: 므라리의 씨족은 말리 씨족과 무시 씨족입니다. 이들이 므라리의 씨족들입니다.
