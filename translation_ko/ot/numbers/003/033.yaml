base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: ko
  text: 므라리에게는 마흘리의 씨족과 무시의 씨족이 있습니다. 이것들이 므라리의 씨족들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּחָה는 이 문맥에서 일반적인 ‘가족’보다 더 좁은 친족·하위 집단을 가리켜 ‘씨족’이 적합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְרָרִי
  english_pob_choice: For Merari
  chosen_korean: 므라리에게는
  alternatives_korean:
  - 므라리를 위하여
  - 므라리의
  lexicon: HALOT
  rationale: 문맥이 출신 집단을 열거하는 목록이므로, 서두의 ל는 소유보다 표제 기능을 가지는 것으로 보고 한국어에서는 자연스러운 도입구인 ‘-에게는’으로 옮겼습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: 씨족
  alternatives_korean:
  - 가문의
  - 가족의
  - 부족의
  lexicon: HALOT
  rationale: 가계·인구조사 문맥의 מִשְׁפָּחָה는 ‘family’보다 더 좁은 친족 단위를 가리키므로, 한국어에서는 ‘씨족’이 가장 정확하게 대응합니다.
- source_word: הַמַּחְלִי / הַמּוּשִׁי
  english_pob_choice: the Mahlites / the Mushites
  chosen_korean: 마흘리의 씨족 / 무시의 씨족
  alternatives_korean:
  - 마흘리 사람들 / 무시 사람들
  - 마흘릿 족속 / 무싯 족속
  lexicon: HALOT
  rationale: 여기서는 형용사형 집단명(마흘리계, 무시계)을 한국어 독자가 바로 이해하도록, 인물명 + ‘의 씨족’ 구조로 풀어 옮겼습니다.
theological_decisions:
- issue: 명칭 목록의 문체와 반복 구조
  chosen_reading: 히브리어의 열거 구조를 따라 두 씨족을 병렬로 제시하고, 마지막에 요약 선언을 붙였습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘므라리에게 속한 두 씨족은…’이라고 하기
  - 더 압축해 한 문장으로만 처리하기
  rationale: 이 절은 역사적·족보적 식별이 핵심이므로, 해설적 재구성보다 목록의 공식성을 유지하는 편이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 민수기 족보/인구조사 본문의 문맥 보존
- issue: ‘Merari’s clans’에 해당하는 마무리 표현
  chosen_reading: ‘이것들이 므라리의 씨족들입니다’로 요약 선언을 유지했습니다.
  alternative_readings:
  - ‘이들은 므라리의 씨족입니다’
  - ‘이것들이 므라리의 집단들입니다’
  rationale: 히브리어의 אֵלֶּה הֵם는 단순한 지시가 아니라 앞선 두 항목을 공식적으로 확정하는 표현이므로, 한국어에서도 선언형으로 살렸습니다.
  doctrine_reference: 본문의 확인/집계 표현
