  text: 레위 자손을 그들의 조상 집안별, 씨족별로 계수하십시오. 태어난 지 한 달 이상 된 모든 남자를 계수하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레위 자손’은 히브리어의 문자적 표현인 ‘레위의 아들들’을 살린 번역입니다. 이는 단순히 레위 사람이라는 집단 명칭보다 혈통과 가문 구조를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  english_pob_choice: count / you shall count
  chosen_korean: 조사하십시오 / 조사해야 합니다
