  text: פְּקֹד֙ אֶת בְּנֵ֣י לֵוִ֔י לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָ֛ר מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה תִּפְקְדֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
  footnotes:
  - marker: a
    text: Or 'the Levites' for 'the sons of Levi.' The Hebrew is literally 'sons of Levi,' emphasizing descent and clan structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 자손을 그들의 조상 집안별로, 그들의 종족별로 조사하십시오. 한 달 된 남자 아이 이상은 모두 조사해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레위 자손’은 히브리어의 문자적 표현 ‘레위의 아들들’을 살린 번역입니다. 여기서는 단순한 민족명보다 혈통과 가문 구조를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  english_pob_choice: count / you shall count
  chosen_korean: 조사하십시오 / 조사해야 합니다
  alternatives_korean:
  - 세십시오
  - 계수하십시오
  - 조사하여 등록하십시오
  lexicon: HALOT
  rationale: 행정적 인원 산정이라는 점을 살리면서, 한국어에서는 단순 산술의 ‘세다’보다 인구 조사·등록의 뉘앙스가 있는 ‘조사하다’가 더 자연스럽고 원문의 공적 절차를 잘 드러냅니다.
- source_word: בְּנֵי לֵוִי
  english_pob_choice: the sons of Levi
  chosen_korean: 레위 자손
  alternatives_korean:
  - 레위 사람들
  - 레위의 아들들
  - 레위의 자손들
  lexicon: HALOT
  rationale: ‘sons of Levi’의 혈통·가문 강조를 살리되, 한국어 성경에서 널리 이해되는 ‘레위 자손’을 사용해 직역성과 가독성을 함께 확보했습니다.
- source_word: לְבֵית אֲבֹתָם / לְמִשְׁפְּחֹתָם
  english_pob_choice: by their fathers' houses / by their clans
  chosen_korean: 그들의 조상 집안별로, 그들의 종족별로
  alternatives_korean:
  - 그들의 아버지 집안별로, 그들의 가문별로
  - 그들의 족장 집안별로, 그들의 족속별로
  - 그들의 조상 가문별로, 그들의 가족 단위별로
  lexicon: HALOT
  rationale: 두 표현을 서로 구별되게 옮겨, 첫째는 가계 중심의 ‘조상 집안’, 둘째는 그보다 더 넓은 혈연 집단인 ‘종족’으로 대응시켜 원문의 계보 구조를 드러냈습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 된 ... 이상
  alternatives_korean:
  - 한 달 이상 된
  - 한 달이 지난
  - 한 달 된 때부터
  lexicon: HALOT
  rationale: 히브리어 관용구의 최저 연령 기준을 한국어로 자연스럽게 옮기되, ‘이상’으로 상한 없는 연속성을 분명히 했습니다.
