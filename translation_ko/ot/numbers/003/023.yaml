lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족들
  lexicon: HALOT
  rationale: 민수기의 진 편성·인구 조사 문맥에서는 혈연 기반의 집단 단위를 가리키므로, ‘씨족’이 ‘가족’보다 집단적·계보적 의미를 더 잘 살립니다.
- source_word: הַגֵּרְשֻׁנִּי
  english_pob_choice: the Gershonites
  chosen_korean: 게르손 사람들
  alternatives_korean:
