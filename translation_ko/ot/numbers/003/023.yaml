  rationale: 히브리어 미완료형은 규범적 배치 규정을 나타내므로, 한국어에서는 독자에게 곧바로 이해되는 서술적 현재형이 자연스럽습니다.
  doctrine_reference: 민수기 3장 진영 질서 규정
