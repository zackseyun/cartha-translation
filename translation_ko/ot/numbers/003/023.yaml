  - 게르손 씨족
  lexicon: HALOT
  rationale: 형용사형 집합 명사로서 게르손의 후손 전체를 가리키므로, 한국어에서는 자연스러운 집합 지칭인 ‘사람들’을 택했습니다.
- source_word: אַחֲרֵי
  english_pob_choice: behind
  chosen_korean: 뒤
  alternatives_korean:
  - 뒤쪽
  - 뒤편
  lexicon: HALOT
  rationale: 여기서는 시간의 ‘이후’가 아니라 진영 배치의 공간적 위치를 나타내므로, ‘뒤’가 가장 직접적입니다.
- source_word: יָמָּה
  english_pob_choice: toward the west
  chosen_korean: 서쪽
  alternatives_korean:
  - 서쪽으로
  - 서편
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현은 ‘바다 쪽’이지만 관용적으로 ‘서쪽’을 뜻하므로, 본문 의미를 분명히 드러내는 방향어로 옮겼습니다.
