  text: וְ/נָתַתָּ֣ה הַ/כֶּ֔סֶף לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו פְּדוּיֵ֕י הָ/עֹדְפִ֖ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'for the redeemed of those who are in excess among them.' The Hebrew compresses the idea into a construct chain; the main text unpacks it for clear English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 은을 아론과 그의 아들들에게 주어, 그들 가운데 남아 있는 사람들의 속전으로 삼으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 가운데 남아 있는 사람들’은 히브리어의 압축된 소유·관계 구조를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: And you shall give
  chosen_korean: 그리고 … 주어
  alternatives_korean:
  - 그리고 … 주십시오
  - 그리고 … 주셔야 합니다
  lexicon: HALOT
  rationale: 명령·지시문 맥락이므로 한국어에서는 합쇼체의 연결형으로 처리해 자연스럽게 다음 목적어와 이어지게 했습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 그 은
  alternatives_korean:
  - 그 돈
  - 그 כסף
  lexicon: HALOT
  rationale: כֶּסֶף의 기본값인 ‘은’을 살려 원문과의 밀착성을 유지했습니다. 이 문맥에서는 화폐 가치가 암시되지만, 번역어는 재질/화폐 겹의 원뜻을 보존하는 쪽이 더 직접적입니다.
- source_word: פְּדוּיֵי
  english_pob_choice: as the redemption price for
  chosen_korean: 속전으로
  alternatives_korean:
  - 구속값으로
  - 속량 대가로
  lexicon: HALOT
  rationale: פדה 계열은 ‘속전/속량’의 금전적 대가를 가리키므로, 설명을 늘리기보다 한국어 성경 용례와도 통하는 ‘속전’이 가장 간결하게 원의미를 담습니다.
- source_word: הָעֹדְפִים בָּהֶם
  english_pob_choice: those among them who are in excess
  chosen_korean: 그들 가운데 남아 있는 사람들
  alternatives_korean:
  - 그들 가운데 초과한 사람들
  - 그들 중 남는 사람들
  lexicon: HALOT
  rationale: עֹדֵף/עֹדְפִים의 ‘남아 남는, 초과하는’ 뜻을 반영해 수적 초과를 한국어로 자연스럽게 풀었습니다. ‘among them’은 ‘그들 가운데’로 옮겨 집단 내부의 잔여분임을 드러냈습니다.
theological_decisions:
- issue: 레위인 대신 첫태생 초과분에 대한 금전적 대속 관계를 어떻게 드러낼지
  chosen_reading: ‘속전’으로 번역해 단순한 지불이 아니라 대속적 금전이라는 점을 살렸습니다.
  alternative_readings:
  - ‘대속값’
  - ‘구속금’
  rationale: 문맥상 은은 제의적 교환의 값이지 일반 구매대금이 아니므로, 제의적·법적 의미를 함께 담는 한국어 ‘속전’이 가장 적절합니다.
  doctrine_reference: 민수기 3장의 레위인-첫태생 교환 규정
