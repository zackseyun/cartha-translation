  to: 그리고 그 은을 아론과 그의 아들들에게, 그들 가운데 수가 남는 사람들의 속전으로 주십시오.[a]
  rationale: 수량적 초과를 뜻하는 הָעֹדְפִים을 ‘수가 남는 사람들’로 명확히 하고, 속전의 수령자와 용도를 한 문장 구조 안에서 자연스럽게 연결했습니다. 이는 본문이 전제하는 계수 문맥을 반영할 뿐 특정 교리적 해석을 덧붙이지 않습니다.
