  verdict: revise
  source_fidelity: ‘남아 있는 사람들’은 단순히 살아남거나 잔류한 사람들로도 이해될 수 있어, עֹדְפִים의 수량적 ‘초과/남음’이라는 뜻을 충분히 드러내지 못합니다. ‘그들 가운데 수가 남는 사람들’은 원문의 복수 분사와 בָהֶם의 집단 내 초과라는 관계를 자연스럽게 보존합니다. ‘은’, ‘아론과 그의 아들들에게’, ‘속전’은 본문 및 문맥에 충실합니다.
  naturalness: 원문의 ‘주어, … 삼으십시오’는 하나의 지시를 두 동작처럼 나누어 다소 부자연스럽습니다. ‘… 속전으로 주십시오’로 옮기면 현대 표준어 합쇼체에서 간결하고 자연스럽습니다.
  terminology: ‘속전’은 פְּדוּיֵי가 가리키는 속량·대속을 위한 지불액을 적절히 나타냅니다. 다만 초과 대상을 ‘남아 있는 사람들’로 표현한 것은 수정되어야 합니다.
  issues:
  - severity: medium
    issue: ‘그들 가운데 남아 있는 사람들’이 수량적 초과를 분명히 나타내지 못함
    rationale: הָעֹדְפִים은 앞 절의 계수 문맥에서 대응 수보다 더 남는 이들, 곧 초과 인원을 뜻합니다. ‘남아 있는’은 잔류·생존의 의미로 오해될 수 있습니다.
  - severity: low
    issue: ‘주어, … 속전으로 삼으십시오’의 동작 중복
    rationale: 히브리어는 은을 아론과 그의 아들들에게 해당 사람들의 속전으로 주라는 한 지시입니다. 한국어에서는 ‘속전으로 주십시오’가 더 직접적이고 자연스럽습니다.
  revised_text: 그리고 그 은을 아론과 그의 아들들에게, 그들 가운데 수가 남는 사람들의 속전으로 주십시오.[a]
