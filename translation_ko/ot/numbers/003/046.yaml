  text: וְ/אֵת֙ פְּדוּיֵ֣י הַ/שְּׁלֹשָׁ֔ה וְ/הַ/שִּׁבְעִ֖ים וְ/הַ/מָּאתָ֑יִם הָ/עֹֽדְפִים֙ עַל הַ/לְוִיִּ֔ם מִ/בְּכ֖וֹר בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
  footnotes:
  - marker: a
    text: Or "the redeemed ones of the 273"; the Hebrew form can be taken more literally, but the immediate context concerns the payment required for the surplus firstborn (vv. 47–48), so "redemption price" best conveys the sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손의 첫째 아들 가운데서 레위 사람을 초과한 273명의 속전[a]을 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이백칠십삼명의 속량된 자들”. 히브리어 형태는 더 문자적으로는 이렇게 옮길 수도 있지만, 바로 뒤 문맥이 초과한 첫째 아들을 위해 요구되는 지급을 다루므로 여기서는 “속전”이 뜻을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  english_pob_choice: the redemption price of
  chosen_korean: 속전
  alternatives_korean:
  - 구속값
  - 속량의 값
  - 구속 대금
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘속량된 사람들’이 아니라, 이어지는 47–48절에서 요구되는 지급 금액을 가리키므로 ‘속전’이 간결하고 정확합니다.
- source_word: הָעֹדְפִים עַל הַלוִיִּם
  english_pob_choice: who exceed the Levites
  chosen_korean: 레위 사람을 초과한
  alternatives_korean:
  - 레위 사람들보다 남은
  - 레위 사람들 위에 남은
  - 레위 사람들을 넘는
  lexicon: HALOT
  rationale: 히브리어 분사는 레위 사람 수를 넘어선 초과분을 나타내므로, ‘초과한’이 자연스럽고 원문의 비교 관계를 잘 살립니다.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the firstborn of the sons of Israel
  chosen_korean: 이스라엘 자손의 첫째 아들 가운데서
  alternatives_korean:
  - 이스라엘의 처음 난 아들들 가운데서
  - 이스라엘 사람들의 장자 가운데서
  - 이스라엘의 첫째 태생 가운데서
  lexicon: HALOT
  rationale: ‘בְּכוֹר’의 ‘첫째 아들/장자’ 의미를 살리면서, ‘בְּנֵי יִשְׂרָאֵל’의 집단 표지를 ‘이스라엘 자손’으로 옮겨 형식성을 유지했습니다.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  english_pob_choice: '273'
  chosen_korean: 273명
  alternatives_korean:
  - 이백칠십삼명
  - 삼과 칠십과 이백명의
  lexicon: HALOT
  rationale: 히브리어의 합산식 숫자는 한국어 본문에서는 통상적 아라비아 숫자로 옮겨 의미를 명료하게 했습니다.
