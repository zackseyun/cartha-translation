  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
  footnotes:
  - marker: a
    text: Or "the redeemed ones of the 273"; the Hebrew form can be taken more literally, but the immediate context concerns the payment required for the surplus firstborn (vv. 47–48), so "redemption price" best conveys the sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손의 첫째 아들 가운데서 레위 사람을 초과한 273명의 속전[a]을 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이백칠십삼명의 속량된 자들”. 히브리어 형태는 더 문자적으로는 이렇게 옮길 수도 있지만, 바로 뒤 문맥이 초과한 첫째 아들을 위해 요구되는 지급을 다루므로 여기서는 “속전”이 뜻을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  english_pob_choice: the redemption price of
  chosen_korean: 속전
