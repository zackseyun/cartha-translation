  lexicon: HALOT
  rationale: 히브리어 분사는 레위 사람 수를 넘어선 초과분을 나타내므로, ‘초과한’이 자연스럽고 원문의 비교 관계를 잘 살립니다.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the firstborn of the sons of Israel
  chosen_korean: 이스라엘 자손의 첫째 아들 가운데서
  alternatives_korean:
  - 이스라엘의 처음 난 아들들 가운데서
  - 이스라엘 사람들의 장자 가운데서
  - 이스라엘의 첫째 태생 가운데서
  lexicon: HALOT
  rationale: ‘בְּכוֹר’의 ‘첫째 아들/장자’ 의미를 살리면서, ‘בְּנֵי יִשְׂרָאֵל’의 집단 표지를 ‘이스라엘 자손’으로 옮겨 형식성을 유지했습니다.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  english_pob_choice: '273'
  chosen_korean: 273명
  alternatives_korean:
