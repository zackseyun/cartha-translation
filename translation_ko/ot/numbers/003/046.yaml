  naturalness: ‘레위 사람을 초과한 273명’은 사람 자체가 레위 사람을 초과한다는 뜻으로 다소 어색합니다. ‘레위 사람 수보다 더 많은 273명’이 비교 관계를 자연스럽고 정확하게 나타냅니다. 원문이 다음 절과 문법적으로 이어지므로 한국어에서도 쉼표로 연결을 보존하는 것이 적절합니다.
  terminology: ‘이스라엘 자손’, ‘레위 사람’, ‘속전’은 본문 전통과 문맥에 잘 맞습니다. 다만 ‘첫째 아들’보다 장자 제도를 가리키는 ‘장자’가 בְּכוֹר에 더 관용적이며 간결합니다.
