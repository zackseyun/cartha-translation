  lexicon: HALOT
  rationale: 문맥상 단순히 ‘속량된 사람들’이 아니라, 이어지는 47–48절에서 요구되는 지급 금액을 가리키므로 ‘속전’이 간결하고 정확합니다.
- source_word: הָעֹדְפִים עַל הַלוִיִּם
  english_pob_choice: who exceed the Levites
  chosen_korean: 레위 사람을 초과한
  alternatives_korean:
  - 레위 사람들보다 남은
