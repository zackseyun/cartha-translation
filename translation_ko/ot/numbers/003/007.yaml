  source_fidelity: ‘그의 직무와 온 회중의 직무를 … 지켜’는 히브리어의 반복된 מִשְׁמֶרֶת와 שׁמר를 대체로 충실히 반영합니다. 그러나 עֲבֹדַת הַמִּשְׁכָּן은 단순히 ‘성막의 일’이라기보다 성막과 관련된 제의적 봉사·직무를 가리키므로, ‘성막의 봉사’가 더 정확합니다.
