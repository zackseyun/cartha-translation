source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'guard his duty' / 'observe his charge'; the Hebrew verb and noun pair can emphasize custodial responsibility as well as faithful observance.
    reason: lexical_alternative
  - marker: b
    text: That is, the Levites carry out responsibilities associated with Aaron and with the whole congregation in relation to the sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 그의 직무와 온 회중의 직무를 맡아 지키며[a], 회막 앞에서 성막의 봉사를 수행해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘지키다’와 ‘직무’의 결합은 단순히 지키는 것뿐 아니라, 위탁된 책임을 보존하고 충실히 이행하는 뜻을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 레위인들은 아론의 직무와 온 회중의 직무에 관련된 성막 봉사의 책임을 맡아 수행합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ
  english_pob_choice: they shall keep
  chosen_korean: 지켜
  alternatives_korean:
  - 지키고
  - 보호하고
  - 감당하고
  lexicon: HALOT
  rationale: שׁמר는 문맥에 따라 ‘지키다/보호하다/준수하다’를 아우르며, כאן의 제의적 책임 표현에서는 ‘지키다’가 감독·보관의 뉘앙스를 가장 자연스럽게 담습니다.
- source_word: מִשְׁמַרְתּוֹ
  english_pob_choice: his charge
  chosen_korean: 그의 직무
  alternatives_korean:
  - 그의 책임
  - 그의 맡은 일
  - 그의 경계
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת은 성막 문맥에서 ‘맡겨진 직무/책임’의 뜻이 강하므로, 한국어로는 ‘직무’가 제의적·공적 역할을 잘 전달합니다.
- source_word: מִשְׁמֶרֶת כָּל הָעֵדָה
  english_pob_choice: the charge of the whole congregation
  chosen_korean: 온 회중의 직무
  alternatives_korean:
  - 온 회중의 책임
  - 전체 회중의 맡은 일
  - 모든 회중의 직무
  lexicon: HALOT
  rationale: 두 번째 מִשְׁמֶרֶת의 반복을 살리면서, עֵדָה를 ‘회중’으로 옮겨 광야-제의 맥락의 공동체성을 유지했습니다.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  english_pob_choice: before the tent of meeting
  chosen_korean: 회막 앞에서
  alternatives_korean:
  - 회막 앞에
  - 만남의 장막 앞에서
  - 회막 앞쪽에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 한국어 성경에서 널리 쓰이는 ‘회막’이 자연스럽고, לִפְנֵי는 위치를 나타내는 ‘앞에서’로 간명하게 옮겼습니다.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  english_pob_choice: the service of the tabernacle
  chosen_korean: 성막의 일
  alternatives_korean:
  - 성막의 봉사
  - 성막의 직무
  - 성막 섬김
  lexicon: HALOT
  rationale: עֲבֹדָה는 제의적 ‘봉사/일’이지만, 한국어 합쇼체 문장에서는 ‘성막의 일’이 가장 직접적이고 무리 없는 표현입니다.
theological_decisions:
- issue: מִשְׁמַרְתּוֹ의 3인칭 남성 단수 접미사의 지시 대상
  chosen_reading: 문맥상 아론의 직무를 가리키는 것으로 보고 ‘그의 직무’로 옮겼습니다.
  alternative_readings:
  - 성막 자체의 직무를 가리킬 수 있습니다.
  - 제사장 직분 전체를 집합적으로 가리킬 수 있습니다.
  rationale: 민수기 3장은 레위인들이 아론과 그의 아들들을 위해 지정된 책임을 맡는 맥락이므로, 바로 앞선 인물 아론을 가장 자연스러운 선행사로 봅니다.
  doctrine_reference: Numbers 3:5-10 문맥
