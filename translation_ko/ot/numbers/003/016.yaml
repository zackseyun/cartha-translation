  rationale: 원문이 직접 신명을 사용하므로, 본문에서 그 고유명을 드러내는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
