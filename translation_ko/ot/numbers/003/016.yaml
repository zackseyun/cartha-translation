lexical_decisions:
- source_word: וַיִּפְקֹד
  english_pob_choice: counted
  chosen_korean: 계수하였습니다
  alternatives_korean:
  - 세었습니다
  - 번호를 매겼습니다
  - 인구를 조사하였습니다
  lexicon: HALOT
  rationale: 이 문맥은 레위인 등록/집계를 가리키므로, 단순한 산술적 '세다'보다 행정적·공식적 의미가 드러나는 '계수하다'가 가장 가깝습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입에 따라
  - 야훼의 지시에 따라
  lexicon: HALOT
  rationale: 직역하면 '입에 따라'이지만, 한국어에서는 신적 권위에 의한 지시를 자연스럽게 드러내는 '명령에 따라'가 관용적이면서도 원문의 권위를 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 이 프로젝트의 기준에 따라 신명은 관용적 대체어 '주'가 아니라 음역형 '야훼'로 옮겨 하나님의 고유명을 유지합니다.
- source_word: צֻוָּה
  english_pob_choice: he had been commanded
  chosen_korean: 그에게 명령하신 그대로
  alternatives_korean:
  - 명령받은 대로
  - 명령하신 대로
  - 그가 명령받은 그대로
  lexicon: HALOT
  rationale: 수동형의 '명령을 받다' 의미를 살리면서, 앞의 '야훼의 명령'과 뒤의 준수 사실을 자연스럽게 묶기 위해 '명령하신 그대로'로 옮겼습니다.
theological_decisions:
