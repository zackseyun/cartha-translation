translation:
  language: ko
  text: 계수된 모든 레위인, 곧 모세와 아론이 야훼의 명령에 따라[a] 그들의 종족별로 계수한 생후 한 달 이상 된 모든 남자는 이만 이천 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
