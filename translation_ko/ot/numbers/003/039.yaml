  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to the mouth of the LORD,'' an idiom meaning ''at the command of the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들 가운데서 계수된 모든 사람, 곧 모세와 아론이 야훼의 명령에 따라 그들의 종족별로 계수한 모든 남자, 한 달 이상 된 자는 모두 스물두 천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼의 입에 따라’이며, 여기서는 ‘야훼의 명령에 따라’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  english_pob_choice: those counted / counted
  chosen_korean: 계수된 / 계수한
  alternatives_korean:
  - 세어진 / 센
  - 소집된 / 소집한
  - 등록된 / 등록한
  lexicon: HALOT
  rationale: 이 문맥은 레위인의 인구 계수 결과를 말하므로, 군사적 뉘앙스가 강한 말보다 현대 한국어의 ‘계수하다’가 가장 직접적이고 정확합니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 자손들
  lexicon: HALOT
  rationale: 지파/집단 명칭을 자연스러운 현대 한국어로 옮기되, 본문이 집단 전체를 가리키므로 ‘사람들’이 아니라 ‘레위인들’보다 다소 덜 형식적인 ‘레위 사람들’로 표현했습니다.
- source_word: עַל־פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입에 따라
  - 야훼의 지시에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입에 따라’의 뜻을 한국어에서 자연스럽게 풀면 ‘명령에 따라’가 되며, 영어 POB의 의미 결정도 이를 지지합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 가문별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: 광야 인구 조사 맥락에서는 현대적 ‘가족’보다 혈연 집단 단위인 ‘종족’이 더 정확합니다. ‘클랜’에 해당하는 사회단위를 살리기 위해 ‘종족별로’로 옮겼습니다.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 이상 된 자
  alternatives_korean:
  - 한 달부터 위인
  - 한 달 이상인 자
  - 한 달이 된 지부터 위인
  lexicon: HALOT
  rationale: 연령 기준 공식의 의미를 한국어로 자연스럽게 압축해, ‘from a month old and upward’의 최소 연령 조건을 분명히 했습니다.
