translation:
  language: ko
  text: 그들의 계수된 자들[a], 곧 한 달 이상 된 모든 남자의 수에 따라 계수된 그들의 계수된 자들은 칠천오백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
