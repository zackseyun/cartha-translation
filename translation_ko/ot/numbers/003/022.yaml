base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
  footnotes:
  - marker: a
    text: Or 'those counted among them' for 'their numbered ones'; the Hebrew uses the same census term twice in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 등록된 자들[a], 곧 한 달 된 남자마다의 수를 따라, 그들의 등록된 자들은 모두 칠천오백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데 계수된 자들’로도 옮길 수 있습니다. 히브리어는 이 절에서 같은 인구조사 용어를 두 번 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  english_pob_choice: their numbered ones
  chosen_korean: 그들의 등록된 자들
  alternatives_korean:
  - 그들의 계수된 자들
  - 그들의 شمار된 자들
  - 그들의 등록 인원
  lexicon: HALOT
  rationale: פקד의 인구조사 문맥을 살려 ‘등록된 자들’로 옮겨, 단순한 숫자화가 아니라 명부에 포함된 사람이라는 뜻을 드러냈습니다.
- source_word: בְּמִסְפַּר
  english_pob_choice: according to the number of
  chosen_korean: …의 수를 따라
  alternatives_korean:
  - …의 수에 따라
  - …의 수대로
  - …의 수를 기준으로
  lexicon: HALOT
  rationale: 히브리어 전치사구가 인원 산정의 기준을 나타내므로, 자연스러운 한국어로 ‘수를 따라’라고 옮겼습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 된 남자마다
  alternatives_korean:
  - 한 달 된 남자부터
  - 한 달 이상 된 남자마다
  - 한 달이 지난 남자마다
  lexicon: HALOT
  rationale: 아기 연령 기준을 한국어로 풀어내되, 본문의 남성 한정 census 요건을 분명히 하기 위해 ‘남자마다’를 유지했습니다.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאֽוֹת
  english_pob_choice: seven thousand five hundred
  chosen_korean: 칠천오백 명
  alternatives_korean:
  - 7,500명
  - 일곱천오백 명
  lexicon: HALOT
  rationale: 서술형 본문에 맞게 한자어 수사를 사용하고, 인원임을 분명히 하기 위해 ‘명’을 덧붙였습니다.
theological_decisions:
- issue: 인구 조사 표현의 반복과 명부성 보존
  chosen_reading: ‘등록된 자들’과 ‘등록된 자들’의 반복을 그대로 살려, 히브리어의 동일 어휘 반복이 주는 조사·명부의 강조를 보존했습니다.
  alternative_readings:
  - 첫 번째만 ‘등록된 자들’로 옮기고 뒤는 생략
  - ‘계수된 자들’로 통일
  rationale: 본문은 같은 census 용어를 두 번 사용하므로, 반복을 지우면 원문의 리듬과 강조가 약해집니다.
  doctrine_reference: 민수기 인구조사 본문의 문학적 구조
