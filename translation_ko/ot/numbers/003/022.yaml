theological_decisions:
- issue: 인구 조사 표현의 반복과 명부성 보존
  chosen_reading: ‘등록된 자들’과 ‘등록된 자들’의 반복을 그대로 살려, 히브리어의 동일 어휘 반복이 주는 조사·명부의 강조를 보존했습니다.
  alternative_readings:
  - 첫 번째만 ‘등록된 자들’로 옮기고 뒤는 생략
  - ‘계수된 자들’로 통일
  rationale: 본문은 같은 census 용어를 두 번 사용하므로, 반복을 지우면 원문의 리듬과 강조가 약해집니다.
