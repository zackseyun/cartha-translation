translation:
  language: ko
  text: 회막에서 게르손의 아들들이 맡은 일은 성막과 천막, 그 덮개, 그리고 회막 입구의 휘장이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁמֶרֶת는 ‘맡은 일’ 외에 ‘임무’, ‘책임’으로도 옮길 수 있습니다.
