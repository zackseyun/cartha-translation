  source_fidelity: ‘차양’은 מָסַךְ의 문맥상 뜻과 맞지 않습니다. 이는 햇빛을 가리는 돌출 구조물이 아니라 회막 입구에 드리운 가림막/휘장입니다. 또한 בְּאֹהֶל מוֹעֵד는 게르손 자손의 봉사·책임의 장소를 나타내므로, 한국어에서는 ‘회막에서 ... 맡은 일’로 처리하는 것이 목록과의 관계를 더 분명히 합니다.
  naturalness: ‘회막에서 게르손의 아들들이 맡은 일은’은 현대 표준 한국어의 공식적 문체에서 자연스럽고, 이어지는 관리 대상 목록을 명료하게 이끕니다. ‘문의 차양’은 현대 한국어에서 부적절하므로 ‘회막 입구의 휘장’으로 고쳐야 합니다.
  terminology: ‘성막’, ‘회막’, ‘휘장’은 이 성소 문맥에서 널리 이해되는 적절한 용어입니다. הָאֹהֶל은 앞의 הַמִּשְׁכָּן과 구별하여 ‘천막’으로 유지할 수 있습니다. מִשְׁמֶרֶת는 ‘맡은 일’로 자연스럽게 옮기며, 각주에서 ‘임무’와 ‘책임’의 가능성을 보존합니다.
