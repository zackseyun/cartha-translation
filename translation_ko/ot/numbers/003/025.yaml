  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
  footnotes:
  - marker: a
    text: Or 'charge' or 'responsibility' for מִשְׁמֶרֶת.
    reason: lexical_alternative
  - marker: b
    text: '''Screen'' may also be rendered ''curtain'' for מָסַךְ, the hanging at the entrance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게르손의 아들들의 임무는 회막 안에서 성막과 천막, 그 덮개와 회막 문의 차양이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁמֶרֶת는 ‘임무’ 외에 ‘책임’, ‘맡은 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מָסַךְ는 ‘차양’ 외에 ‘휘장’ 또는 ‘휘문막’처럼 출입구의 가림막으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  english_pob_choice: duty
  chosen_korean: 임무
  alternatives_korean:
  - 책임
  - 맡은 일
  - 직무
  lexicon: HALOT
  rationale: 레위인에게 맡겨진 관리·수행의 책임을 자연스럽게 옮기되, 문맥상 반복되는 목록을 받쳐 주는 공적 표현으로 처리했습니다.
- source_word: בְּנֵי גֵרְשׁוֹן
  english_pob_choice: the sons of Gershon
  chosen_korean: 게르손의 아들들
  alternatives_korean:
  - 게르손 사람들
  - 게르손 자손
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 직접 살려, 집단 명칭으로 뭉뚱그리기보다 혈통적 관계를 드러냈습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 한국어 성서에서 확립된 기술 용어를 사용하되, 이어지는 'the tent'와 구별되도록 첫 항목을 기술적으로 고정했습니다.
- source_word: וְהָאֹהֶל
  english_pob_choice: and the tent
  chosen_korean: 천막
  alternatives_korean:
  - 장막
  - 그리고 그 천막
  lexicon: HALOT
  rationale: 같은 어근 계열의 '성막'과 중복되지 않도록 일반 명사 '천막'으로 옮겨, 원문이 구분하는 두 구조를 한국어에서도 구별했습니다.
- source_word: מָסַךְ פֶּתַח
  english_pob_choice: the screen for the entrance
  chosen_korean: 문의 차양
  alternatives_korean:
  - 출입구의 막
  - 문간의 휘장
  lexicon: HALOT
  rationale: מָסַךְ의 '가림막/가리개' 기능과 פֶּתַח의 출입구 의미를 함께 살려, 단순한 커튼보다 출입구용 차폐물을 드러냈습니다.
theological_decisions:
- issue: 성막과 천막의 병렬
  chosen_reading: 성막과 천막을 구분된 두 항목으로 유지했습니다.
  alternative_readings:
  - 성막만 하나의 총칭으로 묶기
  - 성막, 곧 천막으로 합치기
  rationale: 원문은 두 명사를 병렬로 놓아 관리 대상의 목록성을 강조하므로, 한국어에서도 하나로 합치지 않고 분리해 옮겼습니다.
  doctrine_reference: 본문의 물질적 목록 구조 보존
