  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
  footnotes:
  - marker: a
    text: Or 'minister to him.' The Hebrew verb can denote attendant or liturgical service.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 지파를 가까이 데려오고, 그것을 제사장 아론 앞에 세우십시오. 그러면 그들이 아론을 섬길 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְרֵב
  english_pob_choice: Bring near
  chosen_korean: 가까이 데려오고
  alternatives_korean:
  - 가까이 이끌고
  - 데려오고
  lexicon: HALOT
  rationale: 히필 명령형의 ‘가까이 오게 하다’는 의미를 한국어로 자연스럽게 살리면서도 제의적 배치를 드러내기 위해 ‘가까이 데려오고’로 옮겼습니다.
- source_word: מַטֵּה לֵוִי
  english_pob_choice: the tribe of Levi
  chosen_korean: 레위 지파
  alternatives_korean:
  - 레위의 막대기
  - 레위 가문
  lexicon: HALOT
  rationale: 문맥상 물리적 ‘막대기’가 아니라 지파를 가리키므로, POB의 선택을 따라 ‘레위 지파’로 번역했습니다.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  english_pob_choice: before Aaron the priest
  chosen_korean: 제사장 아론 앞에
  alternatives_korean:
  - 제사장 아론 면전에
  - 아론 제사장 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 직접적 의미인 ‘앞에/면전에’를 유지하되, 한국어 어순을 자연스럽게 하여 ‘제사장 아론 앞에’로 옮겼습니다.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  english_pob_choice: and they shall serve him
  chosen_korean: 그들이 아론을 섬길 것입니다
  alternatives_korean:
  - 그들이 그에게 수종들 것입니다
  - 그들이 그를 봉사할 것입니다
  lexicon: HALOT
  rationale: שרת의 일반적·제의적 ‘섬기다’ 의미를 살리되, 교회 용어인 ‘봉사하다’보다 본문의 종속적 관계가 분명한 ‘섬기다’를 선택했습니다.
theological_decisions:
- issue: 레위인의 역할이 누구를 향하는가
  chosen_reading: 레위 지파는 아론 앞에 세워져 아론의 제사장 직무를 보조하고 섬기는 존재로 제시됩니다.
  alternative_readings:
  - 아론과 함께 섬기는 것으로 볼 수 있습니다.
  rationale: 히브리어 목적어 אֹתוֹ는 아론을 가리키므로, ‘함께’로 완화하지 않고 아론을 직접 목적어로 드러내는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 성막 질서와 레위인의 보조적 직무
