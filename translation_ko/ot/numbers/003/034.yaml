  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
  footnotes:
  - marker: a
    text: Or 'their numbered ones' / 'those registered among them.' The Hebrew refers to the census total for this clan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 가운데서 계수된 이들은, 한 달 된 남자아이부터 그 이상까지의 모든 남자의 수를 따라, 육천이백 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데서 계수된 자들’, ‘그들 가운데 등록된 자들’. 히브리어는 이 씨족의 인구조사 총계를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those counted among them
  chosen_korean: 그들 가운데서 계수된 이들
  alternatives_korean:
  - 그들의 등록된 자들
  - 그들 가운데 شمار된 자들
  - 그들 가운데서 등록된 이들
  lexicon: HALOT
  rationale: פקד의 인구조사적 결과 명사형으로, 집단 안에서 실제로 계수된 사람들을 가리키므로 ‘계수된 이들’로 옮기고, 소속 관계는 ‘그들 가운데서’로 드러냈습니다.
- source_word: בְּמִסְפַּר כָּל זָכָר
  english_pob_choice: by the number of every male
  chosen_korean: 한 달 된 남자아이부터 그 이상까지의 모든 남자의 수를 따라
  alternatives_korean:
  - 모든 남자의 수를 따라
  - 모든 남자마다의 수로
  - 모든 남자의 수에 따라
  lexicon: HALOT
  rationale: 인구조사 공식의 기준을 나타내는 표현이므로 ‘수를 따라’로 옮겼고, כָּל זָכָר는 단수적 총칭으로 ‘모든 남자’로 자연스럽게 처리했습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 된 남자아이부터 그 이상까지
  alternatives_korean:
  - 한 달 이상 된
  - 한 달 된 때부터 그 위로
  - 한 달 된 이부터 그 이상까지
  lexicon: HALOT
  rationale: 출애굽기·민수기의 연령 기준 관용구를 한국어로 자연스럽게 풀어, 하한선과 상승 방향을 함께 살렸습니다.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  english_pob_choice: six thousand two hundred
  chosen_korean: 육천이백 명
  alternatives_korean:
  - 6,200명
  - 육천이백 사람
  lexicon: HALOT
  rationale: 서술형 본문에 맞춰 수사를 풀어 쓰고, 인구조사 문맥이므로 단위를 ‘명’으로 밝혔습니다.
