  text: מֵ/אֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת הַ/כָּ֑סֶף חֲמִשָּׁ֨ה וְ/שִׁשִּׁ֜ים וּ/שְׁלֹ֥שׁ מֵא֛וֹת וָ/אֶ֖לֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
  footnotes:
  - marker: a
    text: Or “the firstborn of the Israelites.” The Hebrew is literally “the firstborn of the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “according to the shekel of the sanctuary.” The phrase specifies the sanctuary standard of weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손의 맏아들들에게서 그는 은[a], 곧 천삼백육십오 세겔[b]을, 성소 세겔에 따라 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들의 맏아들들.” 히브리어는 문자적으로 “이스라엘 자손의 맏아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “성소 세겔에 따라.” 이 표현은 성소에서 사용한 표준 중량을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  english_pob_choice: From
  chosen_korean: ~에게서
  alternatives_korean:
  - ~으로부터
  - ~에서
  lexicon: HALOT
  rationale: 출처를 나타내는 전치사로서 자연스러운 한국어는 ‘~에게서’이며, 본문이 누구에게서 은을 거두었는지를 분명히 합니다.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the firstborn of the sons of Israel
  chosen_korean: 이스라엘 자손의 맏아들들
  alternatives_korean:
  - 이스라엘 사람들의 첫 태생
  - 이스라엘의 첫아들들
  lexicon: HALOT
  rationale: 히브리어의 ‘맏아들’과 속격 구조를 살리되, 집합적 의미가 드러나도록 복수형으로 옮겼습니다.
- source_word: הַכָּסֶף
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 은돈
  - 은 금액
  lexicon: HALOT
  rationale: כסף의 문자적 의미인 ‘은’을 살려, 바로 뒤의 세겔 단위와 함께 금액이 아니라 은의 무게/가치를 나타낸다는 점을 보존했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소 세겔에 따라
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소 표준 세겔로
  lexicon: HALOT
  rationale: 구절의 기능은 화폐/중량의 기준을 제시하는 것이므로, ‘성소 세겔’로 기준 단위를 드러내고 ‘에 따라’로 준거를 표시했습니다.
