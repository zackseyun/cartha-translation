  source_fidelity: 히브리어의 명령 두 개(פְּקֹד, וְשָׂא)와 계수 대상, 한 달이라는 최저 연령, 그리고 이름에 따른 계수라는 요소는 대체로 반영되었습니다. 그러나 ‘장자 남자’는 한국어 어순상 ‘남자인 장자’라는 원문의 의미를 자연스럽고 분명하게 전달하지 못하며, ‘그들의 이름 수를 세어라’는 앞선 ‘세고’와 부자연스럽게 중복됩니다.
  naturalness: ‘한 달 된 때부터 그 이상 된’과 ‘장자 남자’는 현대 표준어로 다소 어색합니다. ‘한 달 이상 된’ 및 ‘남자로 태어난 모든 처음 난 자’로 고치고, 두 번째 명령은 명부에 따른 계수의 뜻을 살려 ‘이름 수를 기록하십시오’로 옮기는 것이 자연스럽습니다. 인용문도 합쇼체 명령형으로 통일했습니다.
  terminology: ‘야훼’, ‘모세’, ‘이스라엘 자손’, ‘계수’는 원문 및 학술적 번역의 용례에 적절합니다. בְּכוֹר זָכָר는 장자성과 남성성을 모두 나타내도록 ‘남자로 태어난 모든 처음 난 자’로 옮겼습니다.
