  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “and count them by name.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “이스라엘 자손 가운데서 한 달 된 때부터 그 이상 된 모든 장자 남자를 세고, 그들의 이름 수를 세어라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 이름 수’는 보다 관용적으로 ‘이름별로’ 또는 ‘이름을 따라’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 하나님의 이름 YHWH는 본문 근거에 따라 학술적 음역인 ‘야훼’로 옮겨, POB의 원문 지시를 보존했습니다.
- source_word: פְּקֹד
  english_pob_choice: Count
  chosen_korean: 세고
  alternatives_korean:
  - 계수하고
  - 조사하고
  lexicon: HALOT
  rationale: 인구/등록 맥락의 명령형이므로 자연스러운 현대 한국어 동사 ‘세다’를 써서 명령을 살렸습니다.
- source_word: כָּל בְּכֹר זָכָר
  english_pob_choice: every firstborn male
  chosen_korean: 모든 장자 남자
  alternatives_korean:
  - 모든 첫태생 남자
  - 모든 맏아들
  lexicon: HALOT
  rationale: בְּכֹר는 ‘장자’, זָכָר는 ‘남자’이므로 둘을 모두 드러내는 표현을 택해 성별과 출생서열을 유지했습니다.
- source_word: מִסְפַּר שְׁמֹתָם
  english_pob_choice: the number of their names
  chosen_korean: 그들의 이름 수
  alternatives_korean:
  - 이름의 수
  - 이름별 수
  lexicon: HALOT
  rationale: 직역하면 ‘이름들의 수’이지만, 한국어에서는 ‘이름 수’가 이름별로 세는 명부성 뉘앙스를 가장 간결하게 보존합니다.
theological_decisions:
- issue: 언약 공동체의 계수 대상 표현
  chosen_reading: ‘이스라엘 자손 가운데서’로 옮겨, 계수의 범위를 언약 백성 내부로 분명히 했습니다.
  alternative_readings:
  - ‘이스라엘 사람들 가운데서’
  - ‘이스라엘 백성 가운데서’
  rationale: 히브리어 לִבְנֵי יִשְׂרָאֵל의 집합적 소속을 살리기 위해 직설적 구조를 유지했습니다.
  doctrine_reference: 민수기 1–4장의 성소/장자 관련 계수 맥락
