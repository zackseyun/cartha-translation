  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַמֻּדֵ֧י הֶ/חָצֵ֛ר סָבִ֖יב וְ/אַדְנֵי/הֶ֑ם וִ/יתֵדֹתָ֖/ם וּ/מֵֽיתְרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
  footnotes:
  - marker: a
    text: Or 'sockets' for 'bases.' The Hebrew term can refer to structural bases, especially in tabernacle descriptions.
    reason: lexical_alternative
  - marker: b
    text: Or 'ropes' for 'cords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 뜰 둘레의 기둥들과 그 기둥들의 받침과 그 말뚝들과 그 줄들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소켓’으로도 옮길 수 있습니다. 이 히브리어는 특히 성막 묘사에서 구조물을 받치는 기초나 받침을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘밧줄들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  english_pob_choice: pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 주들
  - 둥근 기둥들
  - 말뚝들
  lexicon: HALOT
  rationale: 뜰의 구조물을 이루는 수직 지지물이라는 점을 살려, 자연스럽고도 건축 맥락에 맞는 ‘기둥들’로 옮겼습니다.
- source_word: הֶחָצֵר
  english_pob_choice: courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 안뜰
  - 뜰 마당
  lexicon: HALOT
  rationale: 성막 문맥에서 ‘court’에 해당하는 전통적·명확한 한국어로 ‘뜰’을 택했습니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their bases
  chosen_korean: 그 기둥들의 받침
  alternatives_korean:
  - 그 기둥들의 소켓
  - 그 기둥들의 기초
  - 그 기둥들의 밑받침
  lexicon: HALOT
  rationale: 성막 용어에서 구조물을 받치는 기초 부품을 가리키므로, 지나치게 기술적인 ‘소켓’보다 읽기 쉬운 ‘받침’으로 옮겼습니다.
- source_word: יְתֵדֹתָם
  english_pob_choice: their pegs
  chosen_korean: 그 말뚝들
  alternatives_korean:
  - 그 못들
  - 그 말뚝꼴 고정핀들
  - 그 팩들
  lexicon: HALOT
  rationale: 성막/장막 고정용 말뚝을 가리키는 말로서, 기능을 분명히 드러내는 ‘말뚝들’이 한국어 성경 문맥에 가장 자연스럽습니다.
- source_word: מֵיתְרֵיהֶם
  english_pob_choice: their cords
  chosen_korean: 그 줄들
  alternatives_korean:
  - 그 밧줄들
  - 그 끈들
  - 그 로프들
  lexicon: HALOT
  rationale: 말뚝과 짝을 이루는 고정용 cord의 의미를 반영하되, 현대 한국어에서 부담이 적은 ‘줄들’로 번역했습니다.
