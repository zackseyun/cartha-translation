  source_fidelity: 핵심 구조는 대체로 원문을 따르지만, ‘맏배’는 현대 표준어에서 매우 낯설고 פֶּטֶר רֶחֶם의 ‘태를 처음 여는’ 범주와 결합할 때 의미가 불명확합니다. 또한 לָקַחְתִּי는 문맥상 ‘택하다’보다 ‘취하다’가 더 직접적입니다.
  naturalness: ‘그리고 나—보십시오, 나는’은 한국어에서 주어가 중복되고 대시 삽입이 어색합니다. ‘그리고 나는, 보십시오,’로 강조를 유지할 수 있습니다. ‘맏아들’과 ‘취했습니다’가 현대적이고 분명합니다.
  terminology: ‘레위 사람들’과 ‘이스라엘 자손들’은 일관되게 사용할 수 있습니다. ‘내 것이 될 것입니다’는 לִי의 귀속·소유 표현을 무리 없이 전달합니다.
