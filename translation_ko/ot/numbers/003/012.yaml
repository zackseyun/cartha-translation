revisions:
- from: 그리고 나—보십시오, 나는 이스라엘 자손들 가운데서 레위 사람들을, 곧 이스라엘 자손들 가운데서 태를 처음 여는 모든 맏배를 대신하여 택하였으며, 레위 사람들은 내 것이 될 것입니다.[a]
  to: 그리고 나는, 보십시오, 이스라엘 자손들[a] 가운데서 레위 사람들을 취했습니다. 곧 이스라엘 자손들 가운데서 태를 처음 여는 모든 맏아들을 대신하여 취했습니다. 레위 사람들은 내 것이 될 것입니다.
  rationale: 히브리어의 접속사와 명시적 1인칭, הִנֵּה의 주의 환기, 레위인의 대체 관계, 그리고 하나님께 속한다는 미래적 선언을 유지했습니다. ‘맏배’를 현대 표준어인 ‘맏아들’로 고치고, פֶּטֶר רֶחֶם을 ‘태를 처음 여는’으로 명시했습니다. 각주 표지는 해당 표현 바로 뒤로 옮겨 각주 대상이 분명하도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:53Z'
