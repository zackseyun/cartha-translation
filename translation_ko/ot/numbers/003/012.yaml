  rationale: 본문은 하나님이 자신을 선언하시는 직접 발화이므로, 표준어 합쇼체를 유지하면서도 히브리어의 엄정한 선언성을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
