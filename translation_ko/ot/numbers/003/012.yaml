  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
  footnotes:
  - marker: a
    text: Or “the Israelites” for “the sons of Israel.” The Hebrew expression is literally masculine and formulaic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는, 보십시오, 이스라엘 자손들[a] 가운데서 레위 사람들을 취했습니다. 곧 이스라엘 자손들 가운데서 태를 처음 여는 모든 맏아들을 대신하여 취했습니다. 레위 사람들은 내 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’입니다. 히브리어의 남성형 관용·공식 표현이며, ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי / הִנֵּה
  english_pob_choice: And I—behold
  chosen_korean: 그리고 나—보십시오
  alternatives_korean:
  - 그리고 나는 보십시오
  - 그리고 내가 보십시오
  - 내가—보십시오
  lexicon: HALOT
  rationale: 화자는 하나님이시며, אָנִי의 전면화와 הִנֵּה의 지시적·강조적 기능을 한국어에서 자연스럽게 살리기 위해 주어를 앞세우고 ‘보십시오’로 주의를 환기했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 고유 종족명은 표준적인 한국어 성서어법을 살리되, 원문의 집단성을 드러내기 위해 ‘사람들’을 붙였습니다.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the sons of Israel
  chosen_korean: 이스라엘 자손들 가운데서
  alternatives_korean:
  - 이스라엘의 아들들 가운데서
  - 이스라엘 사람들 가운데서
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 공식적·남성형 표현을 그대로 반영하면서, ‘가운데서’로 선발의 의미를 자연스럽게 전달했습니다.
- source_word: תַּחַת כָּל בְּכוֹר פֶּטֶר רֶחֶם
  english_pob_choice: in place of every firstborn that opens the womb
  chosen_korean: 태를 처음 여는 모든 맏배를 대신하여
  alternatives_korean:
  - 태를 여는 모든 처음난 자를 대신하여
  - 모든 첫태를 대신하여
  lexicon: HALOT
  rationale: פֶּטֶר רֶחֶם의 법적·관용적 의미를 직역에 치우치지 않으면서 보존하기 위해 ‘태를 처음 여는’으로 풀었고, בְּכוֹר는 ‘맏배’로 옮겨 첫태의 범주를 분명히 했습니다.
- source_word: וְהָיוּ לִי
  english_pob_choice: the Levites shall be mine
  chosen_korean: 레위 사람들은 내 것이 될 것입니다
  alternatives_korean:
  - 레위 사람들은 내 것입니다
  - 레위 사람들은 내 소유가 될 것입니다
  lexicon: HALOT
  rationale: 소유·귀속을 뜻하는 문맥을 살리되, 언약적 소속을 너무 법률적으로만 들리지 않게 ‘내 것이 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 발화에서 존대와 명령형의 처리
  chosen_reading: 보십시오 / 될 것입니다
  alternative_readings:
