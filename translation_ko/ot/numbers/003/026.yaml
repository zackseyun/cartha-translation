id: NUM.3.26
reference: Numbers 3:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
  footnotes:
  - marker: a
    text: Or 'curtains of the court.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its cords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 휘장과, 회막과 제단을 둘러싼 뜰의 입구를 위한 가리개와, 그 밧줄들은 그 모든 직무를 위해 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '뜰의 휘장들'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 줄들'.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי הֶחָצֵר
  english_pob_choice: the hangings of the court
  chosen_korean: 뜰의 휘장
  alternatives_korean:
  - 뜰의 장막
  - 뜰의 커튼
  lexicon: HALOT
  rationale: 성막 문맥의 enclosure fabric을 자연스럽게 옮기되, 예배 공간의 구조물을 가리키는 용어로는 '휘장'이 가장 안정적입니다.
- source_word: מָסַךְ פֶּתַח הֶחָצֵר
  english_pob_choice: the screen for the entrance of the court
  chosen_korean: 뜰의 입구를 위한 가리개
  alternatives_korean:
  - 뜰의 출입문을 위한 휘장
  - 뜰의 प्रवेश구를 위한 막
  lexicon: HALOT
  rationale: '''מָסַךְ''의 천막식 입구 덮개 기능을 살려 ''가리개''로 옮겼고, ''entrance''는 ''입구''로 자연스럽게 반영했습니다.'
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  english_pob_choice: that is around the tabernacle and the altar
  chosen_korean: 회막과 제단을 둘러싼
  alternatives_korean:
  - 회막과 제단 주변에 있는
  - 회막과 제단 둘레에 있는
  lexicon: HALOT
  rationale: 문맥상 뜰과 입구가 회막과 제단을 둘러싸고 있는 공간 관계를 나타내므로, '둘러싼'으로 압축해 공간적 의미를 살렸습니다.
- source_word: מֵיתָרָיו
  english_pob_choice: its ropes
  chosen_korean: 그 밧줄들
  alternatives_korean:
  - 그 줄들
  - 그 끈들
  lexicon: HALOT
  rationale: 성막 구조물에 쓰이는 로프/코드류를 한국어에서 가장 구체적으로 드러내는 기본어로 '밧줄'을 택했습니다.
- source_word: לְכֹל עֲבֹדָתוֹ
  english_pob_choice: for all its service
  chosen_korean: 그 모든 직무를 위해 있습니다
  alternatives_korean:
  - 그 모든 봉사를 위해 있습니다
  - 그 모든 용도를 위해 있습니다
  lexicon: HALOT
  rationale: '''עֲבֹדָה''의 예배·성막 기능적 수행을 일반적 ''일''보다 더 잘 드러내기 위해 ''직무''를 사용했습니다.'
theological_decisions:
- issue: 성막 공간의 관계를 나타내는 전치사 עַל과 סָבִיב의 처리
  chosen_reading: '''회막과 제단을 둘러싼''으로 통합해 공간적 둘레 관계를 드러냈습니다.'
  alternative_readings:
  - '''회막과 제단 주변에 있는'''
  - '''회막과 제단 둘레에 있는'''
  rationale: 직역적 '위에/곁에'는 한국어에서 부자연스러우므로, 본문이 말하는 경계 설정과 둘레 배치를 명확히 전달하는 쪽을 택했습니다.
  doctrine_reference: 성막의 배치는 거룩한 구역의 질서와 경계를 가시화합니다.
