  source_fidelity: 히브리어는 뜰의 휘장, 뜰 입구의 가리개, 그 밧줄을 열거하고, 이들이 '그 모든 봉사/직무를 위하여' 쓰임을 덧붙입니다. 초안의 공간 관계와 물품 식별은 대체로 충실합니다. 다만 종결 표현은 열거된 물품이 직무를 '위해 있다'는 다소 부자연스럽고 불명확한 관계를 만듭니다.
  naturalness: '''회막과 제단을 둘러싼 뜰''은 자연스럽고, ''가리개''와 ''밧줄''도 현대 표준어에 맞습니다. 그러나 쉼표가 과도하고, ''그 모든 직무를 위해 있습니다''는 한국어 문장으로 어색합니다. ''그 모든 봉사를 위해 쓰이는 것들입니다''로 정리하면 자연스럽고 원문의 기능 관계도 보존됩니다.'
