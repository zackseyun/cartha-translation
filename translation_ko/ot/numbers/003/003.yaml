  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
  footnotes:
  - marker: a
    text: 'Hebrew: ''whose hands he filled,'' an idiom meaning ''whom he ordained'' or ''installed'' for priestly service.'
