theological_decisions:
- issue: 기름부음받은 제사장들의 정체성 표현
  chosen_reading: 제의적 위임과 직분을 함께 드러내는 방향으로 ‘기름부음을 받은 제사장들’과 ‘제사장 직분을 맡게 된 사람들’을 병기했습니다.
  alternative_readings:
  - 단순히 ‘제사장들’로 축약
  - ‘임직된 제사장들’로만 표현
  rationale: 본문은 아론의 아들들 가운데 제사장 직분을 받은 자들을 식별하므로, 기름부음과 직분 위임을 둘 다 보존하는 편이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: Numbers 3:3 priestly ordination idiom
