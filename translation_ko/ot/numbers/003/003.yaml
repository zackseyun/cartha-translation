translation:
  language: ko
  text: 이것은 아론의 아들들의 이름입니다[a]—기름부음을 받은 제사장들로서, 그들의 손을 채워 제사장 직분을 맡게 된 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그들의 손을 채운’이라는 관용구로, ‘임직하다’ 또는 ‘제사장으로 세우다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
