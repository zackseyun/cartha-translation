id: NUM.3.42
reference: Numbers 3:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel''; alternatively, ''the Israelites'' or ''the children of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼께서 그에게 명령하신 대로, 이스라엘 자손 가운데 있는 모든 맏아들을 계수하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’입니다. 문맥상 ‘이스라엘 자손’ 또는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  english_pob_choice: counted
  chosen_korean: 계수하였습니다
  alternatives_korean:
  - 세었습니다
  - 등록하였습니다
  - 조사하였습니다
  lexicon: HALOT
  rationale: 인구나 대상의 수를 공식적으로 세는 문맥이므로, 단순한 일상어보다 행정적·서술적 뉘앙스를 살릴 수 있는 ‘계수하다’를 택했습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  english_pob_choice: just as Yahweh had commanded him
  chosen_korean: 야훼께서 그에게 명령하신 대로
  alternatives_korean:
  - 야훼께서 그에게 명하신 대로
  - 여호와께서 그에게 명령하신 대로
  - 야훼께서 그에게 명령한 그대로
  lexicon: HALOT
  rationale: כַּאֲשֶׁר는 순응·일치의 의미이므로 ‘...대로’가 자연스럽습니다. יְהוָה는 본문 원어의 고유명으로 ‘야훼’로 옮기고, אֹתוֹ는 모세를 가리키므로 ‘그에게’로 분명히 했습니다.
- source_word: אֶת כָּל בְּכֹר
  english_pob_choice: every firstborn
  chosen_korean: 모든 맏아들
  alternatives_korean:
  - 모든 첫태생
  - 모든 첫째
  - 모든 처음 난 아들
  lexicon: HALOT
  rationale: בְּכֹר는 출생 질서의 ‘첫 태생/맏아들’을 가리키므로, 한국어 성경에서 널리 이해되는 ‘맏아들’이 가장 정확하고 간결합니다. 여기서는 distributive force를 살려 ‘모든’으로 처리했습니다.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데 있는
  alternatives_korean:
  - 이스라엘의 아들들 가운데 있는
  - 이스라엘 사람들 가운데 있는
  - 이스라엘 자손 중의
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘이스라엘 자손’이 원문 표현을 보존합니다. 문맥상 계수 대상의 범위를 나타내므로 ‘가운데 있는’으로 ב의 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 야훼의 명령에 대한 모세의 순종을 어떻게 드러낼지
  chosen_reading: ‘야훼께서 그에게 명령하신 대로’로, 모세의 계수가 단순 행정이 아니라 신적 명령에 대한 정확한 이행임을 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 그에게 명하신 대로’
  - ‘야훼의 명령에 따라’
  rationale: 본문은 모세의 행동을 여호와의 명령과 직접 연결하며, כַּאֲשֶׁר는 정확한 일치를 강조합니다. 따라서 순종의 성격이 약해지지 않도록 ‘대로’ 표현을 유지했습니다.
  doctrine_reference: '서술 순종 강조: 민수기 계수 본문 전체의 명령-이행 구조'
