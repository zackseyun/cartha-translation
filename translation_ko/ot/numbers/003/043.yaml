base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
  footnotes:
  - marker: a
    text: Hebrew 'by the number of names' is a census expression meaning they were individually registered or counted by name.
    reason: cultural_note
  - marker: b
    text: Or 'according to their enrollment.' The Hebrew phrase refers to the official counting of the group.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 남자 맏아들로서, 이름의 수대로, 한 달 이상 된 자는 그 등록 수에 따라 모두 이만이천삼백칠십삼 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘이름의 수대로’는 개별적으로 이름을 따라 등록·계수되었다는 인구조사 관용구입니다.
    reason: cultural_note
  - marker: b
    text: ‘등록 수에 따라’로도 옮길 수 있으며, 공식적인 계수나 등록을 가리키는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר זָכָר
  english_pob_choice: the firstborn males
  chosen_korean: 남자 맏아들
  alternatives_korean:
  - 첫째로 난 남자들
  - 남자 첫태생
  lexicon: HALOT
  rationale: 맏아들/첫태생의 의미를 유지하면서 זָכָר의 성별을 분명히 드러내기 위해 ‘남자 맏아들’로 옮겼습니다.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  english_pob_choice: by the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름의 수에 따라
  - 이름대로 기록된
  lexicon: HALOT
  rationale: 인구조사 관용구로서 개별적으로 이름에 따라 집계되었음을 살리기 위해 직역에 가까운 표현을 택했습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 이상 된
  alternatives_korean:
  - 한 달이 된 후부터
  - 한 달부터 그 이상인
  lexicon: HALOT
  rationale: 연령 기준을 현대 한국어로 자연스럽게 풀되, ‘한 달’이라는 하한선을 그대로 보존했습니다.
- source_word: לִפְקֻדֵיהֶם
  english_pob_choice: according to their count
  chosen_korean: 그 등록 수에 따라
  alternatives_korean:
  - 그들의 계수에 따라
  - 그 등록 명수에 따라
  lexicon: HALOT
  rationale: 공식적인 등록·계수의 뜻을 살리기 위해 ‘등록 수’로 옮겼고, 단순한 숫자 반복으로 약화되지 않게 했습니다.
theological_decisions:
- issue: 인구조사 표현의 성격
  chosen_reading: 이 구절은 단순 합계가 아니라 야훼의 명령 아래 이루어진 공식 등록 결과를 보고하는 문장으로 읽었습니다.
  alternative_readings:
  - 단순한 통계 보고
  - 가정 단위의 일반적 집계
  rationale: 히브리어 관용구 ‘이름의 수대로’와 ‘등록 수’는 개별 등록을 전제하므로, 공식적 계수의 성격을 유지했습니다.
  doctrine_reference: Numbers 3 문맥의 레위인 봉사 배치와 장자 계수
