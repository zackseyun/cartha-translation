revisions:
- from: 그리고 너는 아론과 그의 아들들을 임명해야 합니다. 그들은 자기의 제사직을 지켜야 합니다. 그러나 가까이 오는 외인은 죽임을 당해야 합니다.[a]
  to: 아론과 그의 아들들을 임명하고, 그들이 그들의 제사장 직무를 지키게 하십시오. 접근 권한이 없는 사람이 가까이 오면 죽임을 당할 것입니다.[a]
  rationale: הַזָּר를 현대 한국어에서 민족적 의미로 흔히 이해되는 ‘외인’으로 본문에 그대로 두지 않고, 문맥상 권한 없는 접근자를 뜻하는 표현으로 옮겼습니다. 각주에는 직역 가능성을 보존했습니다. 명령형과 ‘제사장 직무’를 사용하여 히브리어의 지시적·제의적 의미를 더 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:49Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘외인’은 현대 한국어에서 주로 민족적 외국인을 뜻하므로 הַזָּר의 제의적·권한적 의미를 본문에서 충분히 전달하지 못합니다. 또한 명령/규정 문맥은 ‘~해야 합니다’보다 직접적인 합쇼체 명령형으로 옮기는 편이 원문의 법규적 어조에 더 가깝습니다.
  naturalness: ‘가까이 오는 외인’은 어색하고 ‘외인’의 일반적 용례도 문맥에 맞지 않습니다. ‘접근 권한이 없는 사람이 가까이 오면’은 자연스럽고, 접근 행위와 자격 제한을 함께 드러냅니다.
  terminology: ‘제사직’은 אפשר하나, 이 문맥의 맡겨진 직무와 경계 보전의 뜻에는 ‘제사장 직무’가 더 분명합니다. הַזָּר는 ‘외인’보다 ‘접근 권한이 없는 사람’으로 번역하는 것이 비민족적 의미를 정확히 반영합니다.
  issues:
  - severity: medium
    issue: ‘외인’의 의미가 민족적 외국인으로 오해될 수 있음
    rationale: הַזָּר는 이 제의 문맥에서 혈통이나 국적상 외국인이 아니라 제사장 직무 및 성소 접근에 권한이 없는 사람을 가리킵니다. 각주만으로 이를 보완하기보다 본문에서 드러내는 것이 안전합니다.
