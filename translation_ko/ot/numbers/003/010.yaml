id: NUM.3.10
reference: Numbers 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
  footnotes:
  - marker: a
    text: Or 'the unauthorized person'; Hebrew 'the outsider' refers here to anyone not authorized for priestly access, not specifically to a foreigner by ethnicity.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들을 임명하고, 그들이 그들의 제사장 직무를 지키게 하십시오. 접근 권한이 없는 사람이 가까이 오면 죽임을 당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외인’. 히브리어 ‘외인’은 여기서 민족적 외국인이 아니라 제사장 직무나 성소 접근에 권한이 없는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  english_pob_choice: you shall appoint
  chosen_korean: 임명해야 합니다
  alternatives_korean:
  - 임명하셔야 합니다
  - 책임을 맡겨야 합니다
  - 지명해야 합니다
  lexicon: HALOT
  rationale: 이 문맥에서는 아론과 그의 아들들을 제사직에 세우는 뜻이므로, 단순한 ‘세다’보다 직분 부여를 드러내는 ‘임명하다’가 가장 자연스럽고 source-direct합니다.
- source_word: וְשָׁמְרוּ
  english_pob_choice: they shall keep
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 보존해야 합니다
  - 감시해야 합니다
  - 준수해야 합니다
  lexicon: HALOT
  rationale: ‘지키다’는 제사직의 경계를 유지하고 맡겨진 직무를 보전한다는 의미를 함께 담을 수 있어, POB의 ‘keep’과 היטב 대응합니다.
- source_word: כְּהֻנָּתָם
  english_pob_choice: their priesthood
  chosen_korean: 자기의 제사직
  alternatives_korean:
  - 그들의 제사직
  - 그들의 제사장 직분
  - 제사직
  lexicon: HALOT
  rationale: 히브리어는 제사 직분 자체를 가리키므로 ‘제사직’이 적절합니다. ‘자기의’는 아론과 아들들에게 귀속된 직분임을 자연스럽게 드러냅니다.
- source_word: הַזָּר הַקָּרֵב
  english_pob_choice: the outsider who comes near
  chosen_korean: 가까이 오는 외인
  alternatives_korean:
  - 다가오는 외인
  - 가까이 나아오는 외인
  - 가까이 오는 무자격자
  lexicon: HALOT
  rationale: הַזָּר는 민족적 ‘이방인’보다 제사 접근 권한이 없는 사람을 뜻하므로, POB의 ‘outsider’를 따라 ‘외인’으로 옮기되 접근 동작을 살려 ‘가까이 오는’을 붙였습니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 죽임을 당해야 합니다
  alternatives_korean:
  - 사형에 처해야 합니다
  - 죽게 됩니다
  - 죽어야 합니다
  lexicon: HALOT
  rationale: 수동/사역적 법률 표현의 강도를 살리기 위해 단순한 미래형 ‘죽다’보다 처벌 결과를 드러내는 ‘죽임을 당하다’를 선택했습니다.
theological_decisions:
- issue: הַזָּר의 범위
  chosen_reading: 여기서 ‘외인’은 혈통상의 타민족이 아니라 제사장 접근 권한이 없는 사람을 뜻합니다.
  alternative_readings:
  - 민족적 외국인으로 읽을 수 있습니다
  - 단순히 낯선 사람으로 읽을 수 있습니다
  rationale: POB의 주석처럼 본문은 제사적 접근의 자격 문제를 말하므로, 한국어도 ‘외인’으로 두되 의미를 권한 부재 쪽으로 안내해야 오해를 줄일 수 있습니다.
  doctrine_reference: 원문의 제의적 경계와 접근 금지를 보존합니다.
