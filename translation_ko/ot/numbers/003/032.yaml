id: NUM.3.32
reference: Numbers 3:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
  footnotes:
  - marker: a
    text: Or 'the holy things.' The Hebrew הַקֹּדֶשׁ can denote either the sanctuary itself or the sacred objects associated with it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위인 지도자들의 우두머리는 제사장 아론의 아들 엘르아살이었습니다. 그는 성소[a]의 직무를 지키는 이들을 감독할 책임을 맡고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것들’. 히브리어 הַקֹּדֶשׁ는 성소 자체를 가리킬 수도 있고, 그것과 관련된 성물들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  english_pob_choice: the chief of the chiefs of the Levites
  chosen_korean: 레위 사람들의 우두머리들 위에 있던 우두머리
  alternatives_korean:
  - 레위 사람들의 지도자들 위에 있던 지도자
  - 레위 사람들의 우두머리
  lexicon: HALOT
  rationale: נָשִׂיא의 기본 의미인 ‘우두머리/지도자’를 살리되, 중첩된 소유·상위 관계를 한국어에서 자연스럽게 풀어 ‘위에 있던’으로 상위 감독 관계를 드러냈습니다.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  english_pob_choice: Eleazar son of Aaron the priest
  chosen_korean: 제사장 아론의 아들 엘르아살
  alternatives_korean:
  - 아론 제사장의 아들 엘르아살
  - 엘르아살, 제사장 아론의 아들
  lexicon: HALOT
  rationale: 히브리어의 친족표현을 그대로 살려 ‘아들’을 유지했고, הַכֹּהֵן은 아론을 수식하는 말로 읽어 ‘제사장 아론’으로 옮겼습니다.
- source_word: פְּקֻדַּת
  english_pob_choice: having oversight of
  chosen_korean: 감독했습니다
  alternatives_korean:
  - 맡아 돌보았습니다
  - 책임지고 있었습니다
  - 감독하는 역할이었습니다
  lexicon: HALOT
  rationale: פְּקֻדָּה는 여기서 행정적·직무적 ‘감독/책임’의 뜻이므로, 문맥에 맞게 동사로 옮겨 엘르아살의 관리 책임을 분명히 했습니다.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַקֹּדֶשׁ
  english_pob_choice: those who kept charge of the sanctuary
  chosen_korean: 성소를 지키는 자들
  alternatives_korean:
  - 거룩한 것을 지키는 자들
  - 성소의 직무를 맡은 자들
  - 성스러운 것들을 지키는 자들
  lexicon: HALOT
  rationale: הַקֹּדֶשׁ는 성소 자체 또는 성물을 가리킬 수 있지만, 이 문맥에서는 제사·성막 관리 영역이므로 본문 의미를 가장 직접적으로 드러내는 ‘성소’로 옮겼습니다.
theological_decisions:
- issue: הַקֹּדֶשׁ의 범위
  chosen_reading: ‘성소’로 본문을 옮기되, 성소와 그 관련 성물의 두 가능성을 해치지 않도록 직역 과잉을 피했습니다.
  alternative_readings:
  - ‘거룩한 것들’
  - ‘성스러운 것들’
  rationale: 히브리어 הַקֹּדֶשׁ는 장소와 물건을 모두 가리킬 수 있으나, 이 절의 행정적·제의적 문맥에서는 성소 중심 이해가 가장 자연스럽습니다.
  doctrine_reference: 민수기 3장 레위 직무 분담
- issue: ‘우두머리들 위에 있던 우두머리’의 계층성
  chosen_reading: 반복 구조를 한국어식으로 풀어 상위 감독 관계를 드러냈습니다.
  alternative_readings:
  - ‘우두머리 중의 우두머리’
  - ‘지도자들의 지도자’
  rationale: 히브리어의 중첩된 명사구를 평이하게 전달하면서도, 단순한 호칭이 아니라 계층적 감독 직분임을 유지했습니다.
  doctrine_reference: 민수기 3장 레위인의 조직과 책임
