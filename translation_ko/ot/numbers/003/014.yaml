  - 말하셨습니다
  lexicon: HALOT
  rationale: 서술 도입의 공식을 살리기 위해 단순 과거형보다 ‘말씀하시며’와 ‘이르셨습니다’를 함께 써서, 뒤따르는 직접 인용을 예고하는 히브리어 관용을 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신적 고유명사이므로 POB의 원칙에 따라 ‘야훼’로 옮겨, 호칭이 아니라 언약적 이름임을 드러냈습니다.
- source_word: בְּמִדְבַּר סִינַי
  english_pob_choice: in the wilderness of Sinai
  chosen_korean: 시내 광야에서
  alternatives_korean:
  - 시내의 광야에서
  - 시내 황무지에서
  lexicon: HALOT
  rationale: ‘מִדְבָּר’는 여기서 지리적·광야적 배경을 가리키므로 ‘광야’로 자연스럽게 옮겼고, ‘시내’와의 결합은 한국어에서도 관용적으로 ‘시내 광야’가 가장 간결합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여 이르시기를
  - 라고
  lexicon: HALOT
  rationale: 히브리어의 발화 도입어로서 단순한 접속사 ‘라고’보다, 한국어 성경문체에서 다음 절의 직접화법을 여는 ‘이르셨습니다’가 원문 기능을 더 잘 드러냅니다.
theological_decisions:
- issue: 야훼의 직접 발화 형식과 한국어 경어
  chosen_reading: 서술문은 합쇼체를 유지하되, 하나님 주어에 맞춰 동사는 존대형 ‘말씀하시며 / 이르셨습니다’를 사용했습니다.
  alternative_readings:
  - 야훼께서 모세에게 말씀하셨습니다
  - 야훼께서 모세에게 이르셨습니다
  rationale: 본문은 하나님의 직접 발화를 여는 공식 서술이므로, 현대 한국어의 공손체를 유지하면서도 신적 주어에 대한 존대 표현으로 경어를 살렸습니다.
  doctrine_reference: Korean style / divine address register
