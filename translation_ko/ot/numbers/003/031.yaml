id: NUM.3.31
reference: Numbers 3:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
  footnotes:
  - marker: a
    text: Or 'their charge was' or 'their responsibility was.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the holy vessels' or 'the utensils of the holy place.'
    reason: lexical_alternative
  - marker: c
    text: That is, the entrance screen or hanging; not the inner veil.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 직무[a]는 언약궤와 상과 등잔대와 제단들과, 그들이 그것들을 사용하여 섬기는 성소의 기물들[b]과 가리개[c]와 그와 관련된 모든 봉사였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 책임은’ 혹은 ‘그들이 맡은 일은’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 기물들’ 혹은 ‘성소의 기구들’.
    reason: lexical_alternative
  - marker: c
    text: 곧 출입구의 가리개 또는 걸개이며, 내부 휘장이 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  english_pob_choice: And their duty was
  chosen_korean: 그들의 직무는
  alternatives_korean:
  - 그들의 맡은 일은
  - 그들의 책임은
  - 그들의 경비는
  lexicon: HALOT
  rationale: 제사장·성막 문맥의 מִשְׁמֶרֶת는 ‘지켜야 할 임무/맡은 직무’의 뜻이므로, 현대 한국어에서는 ‘직무’가 가장 자연스럽고 문맥상 적절합니다.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  english_pob_choice: the vessels of the sanctuary
  chosen_korean: 성소의 기물들
  alternatives_korean:
  - 성소의 그릇들
  - 거룩한 기물들
  - 성소의 기구들
  lexicon: HALOT
  rationale: כֵּלִים은 단순한 그릇보다 넓게 ‘기물/기구/도구’를 가리키므로, 성막 용품 전체를 포괄하는 ‘기물들’이 문맥에 맞습니다.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָּהֶם
  english_pob_choice: with which they minister
  chosen_korean: 그들이 그 안에서 섬기는
  alternatives_korean:
  - 그들이 그것들로 섬기는
  - 그들이 그것을 사용하여 봉사하는
  - 그들이 그 안에서 봉사하는
  lexicon: HALOT
  rationale: שׁרת는 성막·제의 문맥에서 일반적 ‘일하다’보다 예배적 ‘섬기다/봉사하다’가 더 정확하므로, ‘섬기는’으로 옮겼습니다.
- source_word: הַמָּסָךְ
  english_pob_choice: the screen
  chosen_korean: 차폐막
  alternatives_korean:
  - 휘장
  - 막
  - 가림막
  lexicon: HALOT
  rationale: מָסָךְ는 내부 휘장(פָּרֹכֶת)과 구별되는 출입구 가리개를 뜻하므로, ‘차폐막’으로 옮겨 구별성을 살렸습니다.
theological_decisions:
- issue: 제의적 언어의 보존
  chosen_reading: ‘섬기는’과 ‘봉사’로 제의적 직무 성격을 살리되, 교회 제도어인 ‘사역’은 쓰지 않았습니다.
  alternative_readings:
  - ‘일하는’
  - ‘사역하는’
  rationale: 본문은 성막 봉사에 관한 행정적 진술이므로, 제의적 뉘앙스는 유지하되 후대 교회 용어로 옮겨 의미를 이동시키지 않는 것이 좋습니다.
  doctrine_reference: 성막/제의 용어의 문맥적 보존
