  to: 그들의 직무[a]는 언약궤와 상과 등잔대와 제단들과, 그들이 그것들을 사용하여 섬기는 성소의 기물들[b]과 가리개[c]와 그와 관련된 모든 봉사였습니다.
  rationale: 도구를 나타내는 בָהֶם을 ‘그것들을 사용하여’로 바로잡고, 가리개를 성소 기물과 병렬되는 독립 항목으로 복원했습니다. 마지막 ‘그와 관련된’은 원문의 단수 소유 접미사가 가리키는 범위를 지나치게 특정하지 않으면서, 앞선 성소 직무와의 관련성을 자연스럽게 나타냅니다. 용어는 현대적이면서 제의 문맥을 유지하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:53Z'
