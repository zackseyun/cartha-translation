  verdict: revise
  source_fidelity: 수정이 필요합니다. אֲשֶׁר יְשָׁרְתוּ בָהֶם은 성소 기물들을 수단으로 삼아 섬긴다는 뜻인데, 초안의 ‘그들이 그 안에서 섬기는’은 장소적 의미로 바뀝니다. 또한 ‘곧 그 차폐막’은 가리개가 기물들의 동격인 것처럼 보이게 하지만, 히브리어는 기물들과 가리개를 나란히 열거합니다.
  naturalness: ‘차폐막’은 의미는 전달하지만 현대 표준어 성경 문맥에서는 다소 기술적이고 부자연스럽습니다. ‘가리개’가 자연스러우며, 각주로 출입구의 가리개이고 내부 휘장이 아님을 분명히 할 수 있습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 편이 명료합니다.
  terminology: ‘언약궤’, ‘상’, ‘등잔대’, ‘제단들’, ‘성소의 기물들’, ‘봉사’는 적절합니다. מָסָךְ는 내부 ‘휘장’과 구별하여 ‘가리개’로 옮기고, שׁרת의 도구적 용법은 ‘그것들을 사용하여 섬기는’으로 반영했습니다.
