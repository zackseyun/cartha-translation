  - severity: high
    issue: ‘성소의 기물들, 곧 그 차폐막’
    rationale: ‘곧’은 뒤의 가리개를 앞의 기물들의 설명 또는 동격으로 만들지만, 원문은 ‘성소의 기물들’과 ‘가리개’를 পৃথ개의 항목으로 열거합니다.
