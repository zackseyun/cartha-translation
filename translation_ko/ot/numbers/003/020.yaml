  rationale: 이 절은 계보 목록의 결론 진술로, 단수형 형용사적 표지를 한국어에서 자연스러운 복수 집합 표현으로 풀어야 문맥이 살아납니다.
  doctrine_reference: 민수기 3장 계보/성막 봉사 배치 문맥
