revisions:
- from: 므라리의 아들들은 그들의 종족별로 말리와 무시입니다. 이것이 레위 사람들의 종족들이며, 그들의 조상들의 집안에 따른 것입니다.[a]
  to: 므라리의 아들들은 그들의 종족에 따라 말리와 무시입니다. 이들은 그들의 조상 가문에 따른 레위 사람들의 종족들입니다.[a]
