  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
  footnotes:
  - marker: a
    text: Or "the clans of Levi." The Hebrew has the singular gentilic "the Levite," which may function collectively or refer back to Levi as the tribal ancestor.
    reason: alternative_reading
translation:
  language: ko
  text: 므라리의 아들들은 그들의 종족별로 말리와 무시입니다. 이것이 레위 사람들의 종족들이며, 그들의 조상들의 집안에 따른 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 민족명 ‘레위 사람’ 형태를 쓰지만, 문맥상 집합적으로 이해될 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  english_pob_choice: The sons of Merari
  chosen_korean: 므라리의 아들들
  alternatives_korean:
  - 므라리의 자손들
  - 므라리의 아들들입니다
  lexicon: HALOT
  rationale: 계보·명부 문맥에서 בנים은 직계 아들들을 가리키는 표준 표현이므로, 한국어도 가장 직접적인 ‘아들들’로 옮겨 혈통 표지를 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 종족에 따라
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이스라엘 명부에서 하위 집단을 가리키므로 ‘종족’이 ‘가족’보다 부족 내 조직 단위를 더 잘 드러냅니다.
- source_word: מַחְלִי וּמוּשִׁי
  english_pob_choice: Mahli and Mushi
  chosen_korean: 말리와 무시
  alternatives_korean:
  - 마흘리와 무시
  - 말리, 무시
  lexicon: HALOT
  rationale: 인명은 현대 외래어 표기 관행에 맞춰 음역하되, 마흘리의 어간보다 한국어에서 더 읽히기 쉬운 형태로 정리했습니다.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  english_pob_choice: the clans of the Levites
  chosen_korean: 레위 사람들의 종족들
  alternatives_korean:
  - 레위인들의 종족들
  - 레위 지파의 종족들
  lexicon: HALOT
  rationale: 영어 본문이 복수로 정리한 점에 맞추되, 히브리어의 집합적 종족 표지를 살려 ‘레위 사람들’로 옮겼습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상들의 집안에 따른 것입니다
  alternatives_korean:
  - 그들의 아버지의 집안에 따른 것입니다
  - 그들의 조상 집안별입니다
  lexicon: HALOT
  rationale: בית אבות는 혈연·가문 단위의 행정적 표현이므로, 단순한 ‘가정’보다 ‘조상들의 집안’이 원문의 구조를 더 분명히 전달합니다.
theological_decisions:
