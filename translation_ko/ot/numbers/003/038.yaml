    rationale: 히브리어는 ‘성막 앞 동쪽에 진을 친 자들’이 곧 ‘모세와 아론과 그의 아들들’이라고 진술합니다. 초안은 ‘그들은 … 진을 쳤습니다’와 ‘모세와 아론… 맡고 있었습니다’로 나누어 동일시 관계가 약화되었습니다.
  - severity: medium
    issue: ‘회중의 장막’은 אֹהֶל מוֹעֵד의 번역으로 부정확하거나 혼동을 줍니다.
    rationale: אֹהֶל מוֹעֵד는 이 문맥에서 성막과 관련된 정식 명칭 ‘회막’(만남의 장막)이며, 회중의 집회 장소라는 별도 구조물을 뜻하지 않습니다.
  - severity: medium
    issue: ‘이스라엘 자손을 위한 책임’은 대표적·대행적 직무의 관계를 충분히 나타내지 못합니다.
