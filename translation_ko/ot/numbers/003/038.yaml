  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
  footnotes:
  - marker: a
    text: Or 'eastward ... on the east'; the Hebrew uses two related directional expressions for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''The outsider'' means an unauthorized person who is not permitted to approach the sanctuary service, not specifically a foreigner by ethnicity.'
    reason: cultural_note
translation:
  language: ko
  text: 성막 앞 동쪽, 곧 회막 앞 해 뜨는 쪽에 진을 친 사람들은 모세와 아론과 아론의 아들들이었습니다.[a] 그들은 이스라엘 자손을 대신하여 성소를 맡아 지키고 있었습니다. 그러나 허가받지 않은 사람이 가까이 오면[b] 죽임을 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽’과 ‘해 뜨는 쪽’은 히브리어에서 서로 관련된 두 방향 표현으로, 동쪽 방향을 거듭 강조합니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘허가받지 않은 사람’은 민족적 외국인을 특별히 가리키는 말이 아니라, 성소 봉사에 접근하도록 허가받지 않은 사람을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  english_pob_choice: Those who camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 진을 친 사람들이었습니다
  - 진에 머물렀습니다
  lexicon: HALOT
  rationale: 주어를 행위자 집단으로 풀되, 진 배치의 서술 맥락에 맞게 완료형으로 자연스럽게 옮겼습니다.
- source_word: קֵדְמָה ... מִזְרָחָה
  english_pob_choice: on the east ... toward the sunrise
  chosen_korean: 동쪽에 — … 해 뜨는 쪽에
  alternatives_korean:
  - 동쪽으로 ... 해 뜨는 쪽으로
  - 동쪽에 ... 동쪽을 향해
  lexicon: HALOT
  rationale: 서로 관련된 두 방향 표현을 모두 살리되, 같은 뜻을 단순 반복한 것처럼 보이지 않도록 한국어에서 약간 변주해 강조를 반영했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회중의 장막
  alternatives_korean:
  - 만남의 장막
  - 회막
  lexicon: HALOT
  rationale: 직역보다 문맥상 기능을 드러내는 표현을 택했으며, 본문이 성막과 구별되는 회중 집회의 장막을 가리킨다는 점을 반영했습니다.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  english_pob_choice: keeping charge of the sanctuary
  chosen_korean: 성소를 지키며
  alternatives_korean:
  - 성소의 책임을 지키며
  - 성소를 관리하며
  lexicon: HALOT
  rationale: 지키다에 ‘책임/근무’의 뉘앙스를 함께 담아, 성소 보호와 직무 수행을 모두 드러내도록 압축했습니다.
- source_word: וְהַזָּר
  english_pob_choice: the outsider
  chosen_korean: 외인
  alternatives_korean:
  - 비지정자
  - 무자격자
  - 낯선 사람
  lexicon: HALOT
  rationale: 여기서는 혈통상의 이방인보다 성막 접근 권한이 없는 자를 뜻하므로, 의례적 자격 밖에 있는 사람을 가리키는 표현을 택했습니다.
theological_decisions:
- issue: 성막 접근 금지의 대상 의미
  chosen_reading: ‘외인’은 민족적 외국인 자체보다 성소 봉사에 허가받지 않은 사람을 뜻합니다.
  alternative_readings:
  - 이방 민족 사람
  - 일반적인 사회적 낯선 사람
  rationale: 문맥이 출입 자격과 성소 직무에 관한 것이므로, 민족적 의미로 좁히지 않고 제의적 자격 부재를 강조하는 해석이 본문에 가장 잘 맞습니다.
  doctrine_reference: 민수기 3장 성막 경비와 제사장 직무
