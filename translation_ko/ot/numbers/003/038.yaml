revisions:
- from: 그들은 성막 앞, 곧 동쪽에 — 회중의 장막을 향해 해 뜨는 쪽에 진을 쳤습니다. 모세와 아론과 그의 아들들이 성소를 지키며 이스라엘 자손을 위한 책임을 맡고 있었습니다. 그러나 가까이 오는 외인은 반드시 죽임을 당해야 합니다.[a][b]
  to: 성막 앞 동쪽, 곧 회막 앞 해 뜨는 쪽에 진을 친 사람들은 모세와 아론과 아론의 아들들이었습니다.[a] 그들은 이스라엘 자손을 대신하여 성소를 맡아 지키고 있었습니다. 그러나 허가받지 않은 사람이 가까이 오면[b] 죽임을 당할 것입니다.
  rationale: 원문의 통사 구조를 회복하여 진을 친 이들이 모세, 아론, 그리고 아론의 아들들이었음을 명확히 했습니다. ‘회중의 장막’을 ‘회막’으로 바로잡고, 성소 직무가 이스라엘 자손을 대표하여 수행되는 관계를 ‘대신하여’로 드러냈습니다. 방향 표현과 접근 자격의 의미는 각각 적절한 위치의 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:52Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 ‘진을 친 사람들’의 주어가 모세·아론·아론의 아들들이라는 핵심 문장 구조를 분리하여 불명확하게 만들며, ‘회중의 장막’은 אֹהֶל מוֹעֵד의 통상적이고 정확한 명칭인 ‘회막’보다 부정확합니다. 또한 לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל은 이스라엘 자손을 대표하여/대신하여 맡는 직무의 뜻이므로 ‘이스라엘 자손을 위한 책임’은 다소 모호합니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘성막’과 ‘회막’은 원문의 두 명칭을 구별하여 유지하고, 동쪽 방향의 중첩 강조도 각주와 함께 보존했습니다. 법적 선언인 יוּמָת은 ‘죽임을 당할 것입니다’로 옮겨 수동·강제의 뜻을 살렸습니다.
  terminology: מִשְׁכָּן은 ‘성막’, אֹהֶל מוֹעֵד는 ‘회막’, מִקְדָּשׁ는 ‘성소’로 일관되게 옮겼습니다. זָר는 민족적 외국인을 뜻하는 것으로 오해될 수 있는 ‘외인’ 대신, 문맥상 제의적 접근 권한이 없는 사람임을 드러내는 ‘허가받지 않은 사람’으로 옮겼습니다. ‘아론의 아들들’은 히브리어 단수 접미사의 자연스러운 선행사와 문맥을 반영합니다.
  issues:
