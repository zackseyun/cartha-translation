base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
  footnotes:
  - marker: a
    text: Or 'strange fire' or 'foreign fire.' The Hebrew likely refers to fire that was not authorized for the offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'before Aaron their father'; the Hebrew may also carry the sense that Eleazar and Ithamar served during Aaron's lifetime.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나답과 아비후는 시내 광야에서 여호와 앞에 낯선 불을 드리다가 여호와 앞에서 죽었습니다[a]. 그들에게는 아들이 없었으며[b], 엘르아살과 이다말이 아버지 아론의 생전에 제사장 직무를 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '낯선 불', '외래의 불'. 히브리어는 제의적으로 허용되지 않은 불을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '아버지 아론 앞에서'; 히브리어는 엘르아살과 이다말이 아론이 살아 있는 동안 제사장 직무를 맡았다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת ... וַאֲבִיהוּא
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다
  - 숨졌습니다
  lexicon: HALOT
  rationale: מות의 기본 서술을 직접 살려 서사체로 간명하게 옮겼습니다. 한국어에서도 사건의 종결을 분명히 드러내는 평이한 동사를 택했습니다.
- source_word: אֵשׁ זָרָה
  english_pob_choice: strange fire
  chosen_korean: 낯선 불
  alternatives_korean:
  - 이상한 불
  - 금지된 불
  - 부정한 불
  lexicon: HALOT
  rationale: 원어의 זָרָה는 문자 그대로의 '이상한'보다 제의적으로 '낯선/외래의, 본래 허용되지 않은' 뉘앙스를 지닙니다. English POB의 'strange fire'를 따라가되, 한국어에서는 의미를 과도하게 해석하지 않으면서도 낯선 성격을 드러내는 '낯선 불'로 옮겼습니다.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  english_pob_choice: they had no sons
  chosen_korean: 그들에게는 아들이 없었으며
  alternatives_korean:
  - 그들에게는 아들이 없었으며
  - 그들에게는 자녀가 없었으며
  lexicon: HALOT
  rationale: בָּנִים는 일반적 '자녀'보다 구체적으로 '아들들'을 뜻하므로, 제사장 계승 문맥을 보존해 '아들'로 옮겼습니다.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  english_pob_choice: in the presence of Aaron their father
  chosen_korean: 아버지 아론의 생전에
  alternatives_korean:
  - 아버지 아론 앞에서
  - 아버지 아론의 면전에서
  - 아버지 아론의 생전에
  lexicon: HALOT
  rationale: עַל־פְּנֵי는 공간적 '앞에서'와 더불어 때로 '그가 살아 있는 동안'의 의미를 가질 수 있습니다. English POB의 각주 취지를 반영해, 문맥상 가능한 시간적 함의를 살리되 과도한 해석을 피하는 '생전에'를 본문에 넣었습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에서는 한국어 기본 관례를 따르되, 원문 존칭·문맥상 심판 장면의 긴장을 해치지 않도록 '여호와'를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절의 영어 POB는 Yahweh를 택하지만, 현재 한국어 본문 출판 가독성과 일관성을 고려하면 '여호와'가 가장 안정적입니다. 다만 이는 번역상의 관례 선택이며, 본문 의미는 원문 그대로 유지됩니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
