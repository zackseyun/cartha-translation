base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ko
  text: 또 고핫의 아들들은 그들의 씨족에 따라 암람, 이스할, 헤브론, 웃시엘입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 또 …의 아들들은
  lexicon: HALOT
  rationale: 계보 목록의 시작을 살리기 위해 접속사와 소유 관계를 그대로 반영했습니다. 이 구절은 직계 아들만이 아니라 씨족의 시조들을 가리키는 목록이지만, 히브리어 형식을 보존하기 위해 ‘아들들’을 유지했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 씨족대로
  - 그들의 가문대로
  - 그들의 가족대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이스라엘의 사회적 하위 단위를 가리키므로, 현대 한국어에서는 ‘종족’이 목록 문맥에서 가장 제도적·공적 뉘앙스를 잘 살립니다. ‘가족’은 너무 사적이고, ‘가문’은 한국적 혈통 의미가 강해 오해를 낳을 수 있습니다.
- source_word: וְעֻזִּיאֵל
  english_pob_choice: and Uzziel
  chosen_korean: 웃시엘
  alternatives_korean:
  - 그리고 웃시엘
  - 우지엘
  lexicon: HALOT
  rationale: 고유명사는 표준 음역을 따랐고, 목록형 문맥이므로 마지막 접속사는 자연스럽게 생략했습니다.
theological_decisions:
- issue: 가계 목록에서의 호칭 보존
  chosen_reading: 히브리어의 계보 형식을 따라 ‘아들들’과 씨족 표지를 그대로 유지했습니다.
  alternative_readings:
  - ‘자손들’로 풀어 쓰기
  - 의미상 ‘가문들’로 재구성하기
  rationale: 이 절은 신학적 진술보다 족보·지파 구조를 기록하는 문맥이므로, 본문의 사회적 분류를 흐리지 않는 방향이 가장 적절합니다.
  doctrine_reference: 민수기 3장의 레위인 계수와 지파 질서
- issue: 인명 음역
  chosen_reading: 암람, 이스할, 헤브론, 웃시엘로 음역했습니다.
  alternative_readings:
  - 전통 교회 표기 일부를 조정하기
  - 현대 외래어식 재표기
  rationale: 원문 계보를 식별 가능하게 전달하는 것이 목적이므로, 널리 통용되는 성경 인명 표기를 우선했습니다.
  doctrine_reference: 성경 고유명사 표기 원칙
