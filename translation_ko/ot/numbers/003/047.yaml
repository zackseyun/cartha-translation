language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
  footnotes:
  - marker: a
    text: Literally, 'five shekels per head.'
    reason: lexical_alternative
  - marker: b
    text: That is, according to the standard sanctuary weight; one shekel equaled twenty gerahs.
    reason: cultural_note
translation:
  language: ko
  text: 너는 사람 수대로 각각 다섯 세겔을 취해야 합니다[a]. 성소의 세겔로 취해야 하며[b], 한 세겔은 이십 게라입니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘머리마다 다섯 세겔’입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 성소에서 쓰는 표준 세겔을 가리키며, 한 세겔은 이십 게라와 같습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: you shall take
  chosen_korean: 취해야 합니다
  alternatives_korean:
  - 받아야 합니다
  - 가져야 합니다
  - 취하십시오
  lexicon: HALOT
  rationale: 교훈적·법적 지시문으로서의 명령형 미래를 한국어의 공손한 의무 표현으로 옮겨, 단순 서술이나 지나치게 구어적인 명령을 피했습니다.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים לַגֻּלְגֹּלֶת
  english_pob_choice: five shekels apiece
  chosen_korean: 사람 수대로 각각 다섯 세겔
  alternatives_korean:
  - 다섯 세겔씩
  - 한 사람당 다섯 세겔
  - 머리마다 다섯 세겔
  lexicon: HALOT
  rationale: 반복된 ‘다섯’의 분배적 의미를 한국어의 ‘사람 수대로 각각’으로 풀어, 인원당 금액이라는 뜻을 자연스럽게 살렸습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the shekel of the sanctuary
  chosen_korean: 성소의 세겔로
  alternatives_korean:
  - 성막의 세겔로
  - 성소 세겔로
  - 거룩한 세겔로
  lexicon: HALOT
  rationale: 기준이 되는 표준 도량형을 가리키므로 ‘~로’로 처리했고, ‘성소’는 예배적 기준 단위를 드러내는 가장 პირდაპირ적인 표현입니다.
- source_word: עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  english_pob_choice: the shekel is twenty gerahs
  chosen_korean: 한 세겔은 이십 게라입니다
  alternatives_korean:
  - 세겔은 이십 게라입니다
  - 한 세겔은 스무 게라입니다
  - 세겔 한 개는 이십 게라입니다
  lexicon: HALOT
  rationale: 뒤의 설명절을 정의문으로 옮겨, 세겔과 게라의 환산 관계를 분명하게 제시했습니다. ‘게라’는 측량 단위로 음역을 유지했습니다.
theological_decisions:
- issue: 성소 기준의 도량형을 어떻게 드러낼지
  chosen_reading: ‘성소의 세겔’로 옮겨, 일반 상거래 기준이 아니라 거룩한 장소에 근거한 표준을 나타내도록 했습니다.
  alternative_readings:
  - ‘거룩한 세겔’
  - ‘성소 세겔’
  rationale: 본문은 단순 단위 명칭이 아니라 예배 공동체가 쓰는 표준 중량을 전제하므로, 제의적 기준이라는 뉘앙스를 유지하는 것이 중요합니다.
  doctrine_reference: 성소/예배 질서와 표준 측량의 구별
- issue: ‘한 사람당’의 신체직역을 어느 정도 살릴지
  chosen_reading: 본문의 분배적 표현을 한국어의 ‘사람 수대로 각각’으로 완화해, 직역의 거칠음을 줄이되 개별 인원에 대한 징수라는 의미는 유지했습니다.
  alternative_readings:
  - ‘머리마다’
  - ‘한 사람당’
  rationale: ‘ראש/גולגולת’ 계열의 관용구는 직역하면 생경할 수 있으므로, 의미는 보존하되 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 본문의 관용구 해석과 수량 분배
