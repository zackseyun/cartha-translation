  source_fidelity: 개정이 필요합니다. הָעֹדְפִים עַל은 단순히 ‘남아 있던’ 사람들이 아니라 레위인으로 대신 처리된 사람들의 수를 ‘초과한’ 사람들을 가리킵니다. 또한 פְּדוּיֵי הַלְוִיִּם은 레위인들이 장자들을 대신하는 민수기 3장의 대체·속량 계산을 배경으로 하므로, ‘레위인들로 대속된 자들’보다 ‘레위인들이 대신한 사람들’이 한국어에서 더 정확하고 오해가 적습니다.
  naturalness: ‘레위인들로 대속된 자들보다 남아 있던 자들’은 조사 결합이 부자연스럽고, ‘남아 있던’은 수적 초과라는 비교 의미를 약화합니다. ‘레위인들이 대신한 사람들의 수보다 더 많았던 사람들’은 현대 표준어 합쇼체에서 문맥과 비교 관계를 자연스럽게 드러냅니다.
  terminology: כֶּסֶף הַפִּדְיוֹם은 ‘속전으로 낸 은’으로 옮겨 속전의 용도와 כסף의 은/돈 의미를 함께 보존했습니다. ‘속량금’은 적절한 어휘 대안으로 각주에 제시합니다. ‘대속’은 본절에서 레위인들이 실제 행위 주체라는 인상을 줄 수 있어 본문에서는 피했습니다.
