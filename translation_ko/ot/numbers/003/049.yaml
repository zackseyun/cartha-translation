id: NUM.3.49
reference: Numbers 3:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
  footnotes:
  - marker: a
    text: Or "the ransom money." The Hebrew term can denote the payment made for redemption.
    reason: lexical_alternative
  - marker: b
    text: That is, from those Israelites whose number exceeded the number represented by the Levites in the redemption count.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 모세는 레위인들로 대속된 자들보다 남아 있던 자들에게서 속전 은을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '구속/속전 은'입니다. פִּדְיוֹם은 구속을 위해 지불하는 값을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 레위인으로 대표되는 수보다 이스라엘의 장자 수가 더 많았기 때문에, 그 초과분에 대한 속전을 받은 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 받았습니다
  alternatives_korean:
  - 가져갔습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 서사 동사 לקח의 기본 의미는 '취하다/가져가다'이지만, 문맥상 이미 정해진 속전 은을 모세가 수납하는 행위이므로 한국어에서는 자연스럽게 '받았습니다'로 옮겨 결과를 분명히 했습니다.
- source_word: כֶּסֶף הַפִּדְיוֹם
  english_pob_choice: the redemption money
  chosen_korean: 속전 은
  alternatives_korean:
  - 대속 כסף
  - 구속 כסף
  - 속전 돈
  lexicon: HALOT
  rationale: פִּדְיוֹם은 값 주고 풀어내는 대속/속전의 의미가 강하므로, 고정 교회어에 기대지 않되 제의적 의미를 살려 '속전 은'으로 번역했습니다.
- source_word: הָעֹדְפִים עַל
  english_pob_choice: those who were in excess over
  chosen_korean: …보다 남아 있던 자들
  alternatives_korean:
  - …보다 초과한 자들
  - …보다 많은 자들
  lexicon: HALOT
  rationale: 히브리어 분사와 עַל의 비교 용법이 인원 초과를 가리키므로, 숫자 대비의 의미를 살려 '…보다 남아 있던 자들'로 옮겼습니다.
- source_word: פְּדוּיֵי הַלְוִיִּם
  english_pob_choice: those redeemed by the Levites
  chosen_korean: 레위인들로 대속된 자들
  alternatives_korean:
  - 레위인들의 대속을 받은 자들
  - 레위인들에 의해 속량된 자들
  lexicon: HALOT
  rationale: 히브리어의 수동 분사-속격 구조를 따라 '레위인들로 대속된 자들'로 옮겨, 레위인이 대속 계산의 대체물로 기능한다는 점을 드러냈습니다.
theological_decisions:
- issue: 레위인이 실제로 사람을 '대속'하는가, 아니면 대속 계산의 기준 역할을 하는가
  chosen_reading: 본문은 레위인들이 다른 이스라엘의 장자들을 대신하는 속전 계산의 기준이 되었음을 말하며, 문맥상 실제 대속 행위의 주체를 레위인에게 돌리는 뜻은 아닙니다.
  alternative_readings:
  - 레위인들이 다른 이스라엘인을 실제로 속량했다는 읽기
  - 단순한 행정적 초과 정산으로만 보는 읽기
  rationale: 민수기 3장의 수적 대속/대신 원리를 반영해야 하므로, 레위인이 '대속된 자들'이라는 표현을 유지하되 그 기능은 문맥적으로 제한했습니다.
  doctrine_reference: 민수기 3:12-13, 3:45-49의 장자-레위인 대체 원리
