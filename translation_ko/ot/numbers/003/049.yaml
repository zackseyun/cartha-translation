  rationale: 수적 초과를 나타내는 히브리어의 비교 구문을 ‘수보다 더 많았던’으로 명확히 하고, ‘레위인들이 대신한 사람들’로 민수기 3장의 대체 관계를 자연스럽게 반영했습니다. 각주는 속전의 어휘 범위와 이 절의 계수 배경을 각각 설명합니다.
