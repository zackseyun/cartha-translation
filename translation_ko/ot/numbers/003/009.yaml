theological_decisions:
- issue: 레위인을 아론과 그의 아들들에게 ‘주는’ 표현의 제의적 의미
  chosen_reading: 레위인들은 아론 집안에 봉헌되어 그들의 직무를 돕는 자들로 주어집니다.
  alternative_readings:
  - 단순히 행정적으로 배정됩니다.
  - 아론의 소유가 됩니다.
  rationale: 본문의 נתן 반복은 단순 배치보다 헌납/위임의 성격을 강하게 띱니다. 다만 본문 자체에 없는 ‘소유’ 개념은 넣지 않고, 제의적 위임의 의미만 보존했습니다.
  doctrine_reference: 민수기 3장 문맥상 레위인의 성막 봉사 위임
