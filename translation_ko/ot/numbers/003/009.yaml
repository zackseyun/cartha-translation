  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew repeats ''given'' for emphasis: ''given, given'' or ''surely given.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''from the Israelites.'' Hebrew: ''from among the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들을 아론과 그의 아들들에게 주십시오. 그들은 이스라엘 자손 가운데서 그에게 온전히 주어진 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주어진, 주어진’처럼 동사를 반복해 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손 가운데서’는 직역에 가깝고, 자연스러운 의미는 ‘이스라엘 사람들 가운데서’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: You shall give
  chosen_korean: 주십시오
  alternatives_korean:
  - 주셔야 합니다
  - 줄 것입니다
  lexicon: HALOT
  rationale: 문맥상 명령/지시의 힘을 가진 동사이므로, 현대 한국어 합쇼체의 직접 명령형으로 옮겨 전달력을 살렸습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위인들을
  alternatives_korean:
  - 레위 자손들을
  - 레위 지파 사람들을
  lexicon: HALOT
  rationale: 집단명으로 굳어진 명칭이므로 한국어에서도 통용되는 ‘레위인’을 사용했습니다.
- source_word: נְתוּנִם נְתוּנִם
  english_pob_choice: wholly given
  chosen_korean: 온전히 주어진 자들
  alternatives_korean:
  - 거듭 주어진 자들
  - 완전히 주어진 자들
  - 분명히 주어진 자들
  lexicon: HALOT
  rationale: 히브리어의 ‘주어진, 주어진’ 반복으로 강조된 점을 살리되, 한국어에서는 ‘온전히’로 중복 강조의 의미를 자연스럽게 전달했습니다.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘의 자손들 가운데서
  lexicon: HALOT
  rationale: 출처와 선별의 뜻을 함께 살리기 위해 ‘가운데서’를 넣었고, ‘sons of Israel’는 POB의 용례를 따라 ‘이스라엘 자손’으로 옮겼습니다.
theological_decisions:
- issue: 레위인을 아론과 그의 아들들에게 ‘주는’ 표현의 제의적 의미
  chosen_reading: 레위인들은 아론 집안에 봉헌되어 그들의 직무를 돕는 자들로 주어집니다.
  alternative_readings:
  - 단순히 행정적으로 배정됩니다.
  - 아론의 소유가 됩니다.
  rationale: 본문의 נתן 반복은 단순 배치보다 헌납/위임의 성격을 강하게 띱니다. 다만 본문 자체에 없는 ‘소유’ 개념은 넣지 않고, 제의적 위임의 의미만 보존했습니다.
  doctrine_reference: 민수기 3장 문맥상 레위인의 성막 봉사 위임
