  - marker: b
    text: 'Or ''from the Israelites.'' Hebrew: ''from among the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들을 아론과 그의 아들들에게 주십시오. 그들은 이스라엘 자손 가운데서 그에게 온전히 주어진 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 수동분사 ‘주어진’을 반복하여 강조합니다. 곧 ‘주어진, 주어진’ 또는 ‘분명히 주어진’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들에게서.’ 히브리어는 ‘이스라엘 자손 가운데서’입니다.
    reason: lexical_alternative
