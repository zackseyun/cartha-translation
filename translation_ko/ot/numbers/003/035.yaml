id: NUM.3.35
reference: Numbers 3:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'leader' for 'chief'; Hebrew נָשִׂיא can denote a recognized leader or prince.
    reason: lexical_alternative
  - marker: b
    text: Literally 'father's house,' a kinship term for an ancestral household or clan-unit.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 메라리 씨족들의 부계 가문[b] 수장[a]은 아비하일의 아들 수리엘이었습니다. 그들은 성막의 북쪽에 진을 치도록 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָשִׂיא는 ‘수장’ 외에 ‘지도자’ 또는 ‘족장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아버지의 집’입니다. 여기서는 부계를 따라 이루어진 혈연 가문 또는 씨족 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  english_pob_choice: And the chief
  chosen_korean: 그리고 … 수장은
  alternatives_korean:
  - 그리고 … 지도자는
  - 그리고 … 군주는
  lexicon: HALOT
  rationale: נָשִׂיא는 이 행정적·조직적 문맥에서 통치자보다 ‘수장’이나 ‘지도자’에 가깝기 때문에, 공동체의 공인된 우두머리라는 뜻을 살려 ‘수장’으로 옮겼습니다.
- source_word: בֵית אָב
  english_pob_choice: the ancestral house
  chosen_korean: 조상의 집
  alternatives_korean:
  - 아버지의 집
  - 부계 가문
  lexicon: HALOT
  rationale: 직역하면 ‘아버지의 집’이지만, 여기서는 혈통 기반의 가문 단위를 가리키므로 한국어로는 의미를 더 분명히 하는 ‘조상의 집’이 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹת
  english_pob_choice: of the clans of
  chosen_korean: 씨족을 위한
  alternatives_korean:
  - 가문들을 위한
  - 족속들을 위한
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 민수기에서 부족 아래의 하위 혈연 집단을 가리키므로, 현대 한국어 성경 문맥에서는 ‘씨족’이 ‘가족’보다 구조를 더 정확히 드러냅니다.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  english_pob_choice: on the north side of the tabernacle
  chosen_korean: 성막의 북쪽에
  alternatives_korean:
  - 성막의 옆구리에
  - 성막의 북편에
  lexicon: HALOT
  rationale: יֶרֶךְ는 문자적으로 ‘옆면/옆구리’이지만, 진영 배치 설명에서는 방향 표현이 핵심이므로 ‘북쪽에’로 자연스럽게 풀었습니다. ‘성막’은 מִשְׁכָּן의 문맥상 표준적 대응어입니다.
- source_word: יַחֲנוּ
  english_pob_choice: They were to camp
  chosen_korean: 진을 쳐야 했습니다
  alternatives_korean:
  - 진을 칩니다
  - 진을 칠 것이었습니다
  lexicon: HALOT
  rationale: 미완료형은 단순 미래보다 배치 규정의 지시를 나타내므로, 한국어에서는 의무·지시 뉘앙스를 살린 ‘-해야 했습니다’가 가장 적절합니다.
theological_decisions:
- issue: 야훼의 진영 질서가 민수기에서 공동체의 거룩한 질서로 제시됨
  chosen_reading: 이 절은 성막을 중심으로 한 레위 지파의 배치가 단순 행정이 아니라 거룩한 질서의 일부임을 드러냅니다.
  alternative_readings:
  - 단순한 군사적 진영 배치로만 읽기
  - 족보 기록으로만 읽기
  rationale: 문맥상 배치 지시는 성막 중심의 질서와 결부되어 있으므로, 기능적 행정 정보로만 축소하지 않고 그 신학적 맥락을 보존했습니다.
  doctrine_reference: 민수기 3장 성막 중심 진영 배치
