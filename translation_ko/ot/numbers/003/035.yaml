  naturalness: ‘메라리 씨족들의 부계 가문 수장’은 행정·혈연 조직을 설명하는 문맥에서 자연스럽고, ‘조상의 집’보다 현대 한국어에서 의미가 더 분명합니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
