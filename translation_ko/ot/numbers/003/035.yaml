revisions:
- from: 그리고 메라리의 씨족을 위한 조상의 집의 수장은 아비하일의 아들 두리엘이었습니다[b][a]. 그들은 성막의 북쪽에 진을 쳐야 했습니다.
  to: 그리고 메라리 씨족들의 부계 가문[b] 수장[a]은 아비하일의 아들 수리엘이었습니다. 그들은 성막의 북쪽에 진을 치도록 되어 있었습니다.
  rationale: 원문 고유명사 음역을 바로잡고, 메라리 씨족과 조상 가문의 소속 관계를 한국어에서 더 정확히 드러냈습니다. 진영 배치의 지시적 미완료형은 과도한 강제 표현 없이 ‘진을 치도록 되어 있었습니다’로 옮겼습니다. 본문 의미를 바꾸지 않고 각주 표지와 내용을 해당 어휘에 맞게 정리했습니다.
