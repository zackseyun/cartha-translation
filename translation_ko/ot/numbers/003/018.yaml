base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: ko
  text: 그리고 게르손의 아들들의 이름은 그들의 종족에 따라 다음과 같습니다. 립니와 시므이입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것이
  alternatives_korean:
  - 이것이
  - 자, 이것이
  lexicon: HALOT
  rationale: 목록을 여는 וְאֵלֶּה의 연결성과 지시 기능을 살려, 자연스러운 한국어로 ‘그리고 이것이’로 옮겼습니다.
- source_word: שְׁמוֹת
  english_pob_choice: the names of
  chosen_korean: 이름입니다
  alternatives_korean:
  - 이름들입니다
  - 그 이름들은
  lexicon: HALOT
  rationale: 히브리어의 ‘이름들’은 뒤따르는 계보 항목을 소개하는 표지이므로, 한국어에서는 중복을 줄여 서술형으로 자연스럽게 처리했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족은
  alternatives_korean:
  - 그들의 씨족은
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 출애굽기·민수기의 인구조사 문맥에서 단순한 ‘가족’보다 더 큰 혈연 단위를 가리키므로, ‘종족’으로 옮겨 조직적 구분을 살렸습니다.
- source_word: לִבְנִי וְשִׁמְעִי
  english_pob_choice: Libni and Shimei
  chosen_korean: 립니와 시므이
  alternatives_korean:
  - 리브니와 시므이
  - 립니, 시므이
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역했고, 나열 구조는 한국어 관용에 맞게 ‘와’로 연결했습니다.
