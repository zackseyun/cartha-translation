source:
  edition: WLC
  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
  footnotes:
  - marker: a
    text: Or 'wadi of Eshcol' or 'ravine of Eshcol'; Hebrew naḥal can denote a seasonal streambed or the valley associated with it.
    reason: lexical_alternative
  - marker: b
    text: Eshcol sounds like the Hebrew word for 'cluster.' The place was named because of the cluster cut there by the sons of Israel.
    reason: cultural_note
  - marker: c
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳은 이스라엘의 자손들이 그곳에서 잘라 낸 그 송이 때문에 에스골 골짜기[a][b]라고 불렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에스골 와디’ 또는 ‘에스골 골짜기’. 히브리어 나할은 계절성 물길의 바닥이나 그것과 관련된 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에스골’은 히브리어로 ‘송이’와 소리가 비슷합니다. 이곳은 이스라엘의 자손들이 그곳에서 잘라 낸 송이 때문에 이 이름으로 불렸습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 아들들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  english_pob_choice: That place
  chosen_korean: 그곳은
  alternatives_korean:
  - 그 장소는
  - 그곳
  lexicon: HALOT
  rationale: 지시어가 앞선 사건의 장소를 가리키므로, 한국어에서는 간결하게 ‘그곳’으로 되살려 자연스러운 지시성을 유지했습니다.
- source_word: נַחַל
  english_pob_choice: Valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 와디
  - 시내 골짜기
  - 계곡
  lexicon: HALOT
  rationale: 이 명명 구문에서는 지형명으로서의 의미가 핵심이므로, 기술적 음역인 ‘와디’보다 일반 독자가 이해하기 쉬운 ‘골짜기’를 택했습니다.
- source_word: אֶשְׁכּוֹל
  english_pob_choice: Eshcol
  chosen_korean: 에스골
  alternatives_korean:
  - אשכול
  - אשכול 골짜기
  lexicon: HALOT
  rationale: 본문에서 המקום 이름으로 기능하므로 음역하여 고유명사로 유지했습니다.
- source_word: הָאֶשְׁכּוֹל
  english_pob_choice: the cluster
  chosen_korean: 그 송이
  alternatives_korean:
  - 그 덩이
  - 그 포도송이
  lexicon: HALOT
  rationale: 직전 문맥의 포도송이를 가리키는 말이지만, 이 절 자체에는 포도라는 말이 없으므로 의미를 과도하게 좁히지 않고 ‘송이’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 혈연적 표현을 살리면서도 한국어에서 통용되는 성경 문체를 유지하기 위해 ‘이스라엘의 자손들’을 선택했습니다.
theological_decisions:
- issue: 지명의 형성 이유를 나타내는 עַל אֹדוֹת의 처리
  chosen_reading: ‘…때문에’로 원인 관계를 분명히 드러냈습니다.
