  rationale: 본문은 단순 동의 반복이 아니라 요셉 전체와 그 산하 지파인 므낫세를 함께 상기시키는 구조입니다. 이를 보존해야 독자가 본문의 소속 관계를 정확히 이해할 수 있습니다.
  doctrine_reference: 본문 구조 보존과 계보/지파 정체성 전달
