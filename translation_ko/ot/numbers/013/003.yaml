  source_fidelity: ‘사람들’은 אֲנָשִׁים이 이 문맥에서 명시하는 남성 대표자라는 정보를 중화합니다. 또한 ‘지도자들인 사람들이었습니다’는 원문의 병렬적 서술을 다소 중복되고 부자연스럽게 만듭니다. ‘남자들’과 ‘우두머리’를 사용하면 성별 정보와 רָאשֵׁי의 의미를 모두 보존할 수 있습니다.
  naturalness: ‘모세가 … 보냈습니다’와 ‘바란 광야에서’는 자연스럽습니다. 둘째 문장은 ‘이스라엘 자손의 우두머리인 남자들이었습니다’로 하면 현대 표준어 합쇼체에서 자연스럽고 간결합니다.
  terminology: ‘야훼’, ‘바란 광야’, ‘이스라엘 자손’은 적절합니다. רָאשֵׁי는 이 문맥에서 ‘우두머리’가 ‘머리들’보다 자연스러우면서 지도자/수장이라는 뜻을 충실히 전달합니다. 각주 표지는 해당 표현 바로 뒤에 두어야 합니다.
