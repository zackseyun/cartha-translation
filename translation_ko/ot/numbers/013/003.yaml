id: NUM.13.3
reference: Numbers 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'according to the word of the LORD.' The Hebrew idiom is literally 'upon the mouth of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''leaders of the Israelites.'' Hebrew: ''heads of the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼의 명령[a]에 따라 그들을 바란 광야에서 보냈습니다. 그들은 모두 이스라엘 자손의 우두머리[b]인 남자들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘야훼의 입을 따라’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘이스라엘 자손의 머리들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: HALOT
  rationale: 서술 문맥의 완료된 동작을 자연스럽게 살리면서, 지나치게 관료적인 ‘파견하다’보다 본문 흐름에 맞는 간결한 동사를 택했습니다.
- source_word: מִמִּדְבַּר פָּארָן
  english_pob_choice: from the wilderness of Paran
  chosen_korean: 바란 광야에서
  alternatives_korean:
  - 바란의 광야에서
  - 바란 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר는 성경 지리 문맥에서 통상 ‘광야’가 가장 자연스럽고, פָּארָן은 지명으로 음역해 보존했습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 입에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입에 따라/입 위에’의 직접성은 유지하되, 한국어에서는 그 기능을 드러내는 ‘명령에 따라’가 가장 투명합니다.
- source_word: כֻּלָּם אֲנָשִׁים
  english_pob_choice: All of them were men
  chosen_korean: 그들은 모두 … 사람들이었습니다
  alternatives_korean:
  - 그들은 모두 남자들이었습니다
  - 그들 모두는 남자들이었습니다
  lexicon: HALOT
  rationale: 아ֲנָשִׁים의 성별 정보는 본문에 반영하되, 현대 한국어에서 ‘남자들’은 어색하게 중복되거나 지나치게 생물학적일 수 있어 ‘사람들’로 풀어 자연스럽게 처리했습니다.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  english_pob_choice: heads of the sons of Israel
  chosen_korean: 이스라엘 자손의 지도자들
  alternatives_korean:
  - 이스라엘 자손의 우두머리들
  - 이스라엘의 지도자들
  lexicon: HALOT
  rationale: ‘heads’의 직역인 ‘머리들’은 한국어에서 의미가 불분명하므로, 문맥상 대표자/책임자를 가리키는 기능을 살려 ‘지도자들’로 옮겼습니다. ‘이스라엘 자손’은 covenantal 표현을 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 히브리어 יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신명기적 서술 속에서 야훼의 직접적 지시를 강조하므로, титуль적 대체어보다 고유명사 음역을 유지하는 편이 원문 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 아ֲנָשִׁים의 성별 정보와 현대 한국어 표현
  chosen_reading: 성별 정보는 본문 의미상 유지하되 한국어에서는 ‘사람들’로 자연화했습니다.
  alternative_readings:
  - 남자들
  - 사람들
  rationale: 본문의 대표자들이 남성임은 원문이 분명히 말하지만, 한국어 합쇼체 문장에서는 ‘남자들’보다 ‘사람들’이 더 자연스럽고, 직후의 ‘지도자들’이 그 대표성도 충분히 보완합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
