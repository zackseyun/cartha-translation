  terminology: נַחַל은 지형적 폭을 지닌 말이므로 본문의 ‘에스골 골짜기’를 유지하고 각주에서 ‘와디/시내골짜기’ 가능성을 밝혔습니다. זְמוֹרָה는 포도나무의 가지를 뜻하므로 ‘포도나무 가지’가 문맥과 어휘 모두에 충실합니다.
