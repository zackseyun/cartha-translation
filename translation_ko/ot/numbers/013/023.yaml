  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד נַ֣חַל אֶשְׁכֹּ֗ל וַ/יִּכְרְת֨וּ מִ/שָּׁ֤ם זְמוֹרָה֙ וְ/אֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַ/יִּשָּׂאֻ֥/הוּ בַ/מּ֖וֹט בִּ/שְׁנָ֑יִם וּ/מִן הָ/רִמֹּנִ֖ים וּ/מִן הַ/תְּאֵנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
  footnotes:
  - marker: a
    text: Or 'the Wadi of Eshcol' or 'the Brook of Eshcol.' The Hebrew נַחַל can refer to a ravine or seasonal watercourse as well as a valley.
    reason: lexical_alternative
  - marker: b
    text: Or 'a vine branch with one cluster of grapes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 에스골 골짜기에 이르러 거기서 가지 하나를 꺾고, 포도송이 하나를 함께 달아 두 사람이 막대기에 메고 왔습니다. 또 석류와 무화과도 일부 가져왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  english_pob_choice: the Valley of Eshcol
  chosen_korean: 에스골 골짜기
  alternatives_korean:
  - 에스골 와디
  - 에스골 시내
  lexicon: HALOT
  rationale: נַחַל은 지형적으로 골짜기·와디·시내골짜기를 가리킬 수 있어, 한국어에서는 자연스럽고 넓게 통하는 ‘골짜기’로 옮기되 고유 지명은 음역했습니다.
- source_word: זְמוֹרָה
  english_pob_choice: a branch
  chosen_korean: 가지 하나
  alternatives_korean:
  - 포도나무 가지 하나
  - 덩굴 하나
  lexicon: HALOT
  rationale: 문맥상 포도송이를 함께 든 가지이므로, 본문은 과도한 특정 없이 ‘가지’로 두고 뒤의 포도송이 표현이 의미를 분명히 하게 했습니다.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  english_pob_choice: a single cluster of grapes
  chosen_korean: 포도송이 하나
  alternatives_korean:
  - 한 송이 포도
  - 포도 한 송이
  lexicon: HALOT
  rationale: 히브리어의 수량 강조를 한국어의 자연스러운 어순으로 살려 ‘하나’로 명시했습니다.
- source_word: בַמּוֹט בִּשְׁנָיִם
  english_pob_choice: carried it on a pole; two of them
  chosen_korean: 두 사람이 막대기에 메고
  alternatives_korean:
  - 두 사람이 막대에 걸어 메고
  - 둘이 장대에 메고
  lexicon: HALOT
  rationale: מּוֹט는 운반용 막대/장대를 가리키며, 한국어에서는 ‘메고’가 장면을 가장 자연스럽게 전달합니다.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  english_pob_choice: they also took some of the pomegranates and figs
  chosen_korean: 석류와 무화과도 일부 가져왔습니다
  alternatives_korean:
  - 석류와 무화과도 몇 개 가져왔습니다
  - 석류와 무화과도 가져왔습니다
  lexicon: HALOT
  rationale: 히브리어의 분량 불특정을 살려 ‘일부’를 넣고, 추가로 가져온 열매 목록을 간결하게 정리했습니다.
