translation:
  language: ko
  text: 그리고 이들의 이름은 이러합니다. 르우벤 지파에서는 삭굴의 아들 삼무아입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: And these
  chosen_korean: 그리고 이들은
  alternatives_korean:
  - 이들은
  - 이 사람들은
  lexicon: HALOT
  rationale: 접속사 ו의 연결감을 살려 ‘그리고’로 시작하고, אֵלֶּה는 지시대명사로 ‘이들’이라 옮겨 목록 도입의 기능을 자연스럽게 살렸습니다.
- source_word: שְׁמוֹתָם
  english_pob_choice: were their names
  chosen_korean: 이들의 이름은 이러합니다
  alternatives_korean:
  - 그들의 이름은 이렇습니다
  - 이름은 다음과 같습니다
  lexicon: HALOT
  rationale: 히브리어의 직역형보다 목록 머리말 기능을 살려, 이름 소개를 현대 한국어 문장으로 자연스럽게 구성했습니다.
- source_word: לְמַטֵּה
  english_pob_choice: from the tribe of
  chosen_korean: 르우벤 지파에서
  alternatives_korean:
  - 르우벤 지파의
  - 르우벤 지파로부터
  lexicon: HALOT
  rationale: לְ+מַטֶּה의 소속/대표 문맥을 한국어에서는 ‘~지파에서’로 옮겨, 해당 지파에서 나온 대표자라는 뜻을 유지했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 아들
  - 아들
  lexicon: HALOT
  rationale: 족보 공식에서 בן은 친족관계를 표지하므로 한국어 관용에 맞게 ‘아들’로 직역하되, 이름 사이의 연결은 자연스럽게 유지했습니다.
