  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
  footnotes:
  - marker: a
    text: Or 'children of Anak.' The Hebrew expression refers to those descended from Anak.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 땅에 거주하는 백성은 강하고, 성읍들은 요새처럼 튼튼하며 매우 큽니다. 그리고 우리도 거기서 아낙의 자손들을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아낙의 자손들’은 문자적으로는 ‘아낙의 자녀들’이지만, 혈통을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
