base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
  footnotes:
  - marker: a
    text: Or 'children of Anak.' The Hebrew expression refers to those descended from Anak.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 땅에 거주하는 백성은 강하고, 성읍들은 견고하게 요새화되어 있으며 매우 큽니다. 또한 우리는 그곳에서 아낙의 자손들을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아낙의 자손들’은 문자적으로는 ‘아낙의 자녀들’이며, 아낙의 혈통에 속한 사람들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  - 그런데
  lexicon: HALOT
  rationale: 앞선 긍정적 보고를 강하게 꺾는 대조를 한국어 담화에 자연스럽게 옮기되, 원문의 반전 ուժ을 유지하기 위해 단순한 접속어보다 대조적 부사로 처리했습니다.
- source_word: עַז הָעָם
  english_pob_choice: the people ... are strong
  chosen_korean: 백성은 강하고
  alternatives_korean:
  - 백성은 힘세고
  - 백성은 용맹하고
  - 사람들은 강하고
  lexicon: HALOT
  rationale: עַז의 기본적 의미인 강함을 살리면서, 공동체 전체를 가리키는 הָעָם을 ‘백성’으로 옮겨 집단적 뉘앙스를 보존했습니다.
- source_word: בְּצֻרוֹת גְּדֹלֹת מְאֹד
  english_pob_choice: fortified and very large
  chosen_korean: 요새처럼 튼튼하며 매우 큽니다
  alternatives_korean:
  - 견고하게 요새화되어 있으며 매우 큽니다
  - 성벽으로 둘러싸여 있고 매우 큽니다
  - 요새화되어 있고 매우 큽니다
  lexicon: HALOT
  rationale: בְּצֻרוֹת의 방어적 의미를 ‘요새처럼 튼튼하다’로 풀어 한국어에서 자연스럽고 동시에 군사적 긴박감을 드러냈습니다. ‘매우 큽니다’는 גְּדֹלֹת מְאֹד의 크기 강조를 직접 반영합니다.
- source_word: יְלִדֵי הָעֲנָק
  english_pob_choice: the descendants of Anak
  chosen_korean: 아낙의 자손들
  alternatives_korean:
  - 아낙의 후손들
  - 아낙의 자녀들
  - 아낙의 족속
  lexicon: HALOT
  rationale: 족보적 표현인 יְלִדֵי를 한국어 성경에서 자연스러운 계보 표현인 ‘자손들’로 옮겼습니다. POB의 각주 취지를 반영해 혈통적 연계를 분명히 했습니다.
