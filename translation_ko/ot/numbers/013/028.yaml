  rationale: 앞선 긍정적 보고를 강하게 꺾는 대조를 한국어 담화에 자연스럽게 옮기되, 원문의 반전 ուժ을 유지하기 위해 단순한 접속어보다 대조적 부사로 처리했습니다.
