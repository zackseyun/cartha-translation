  text: from the tribe of Issachar, Igal son of Joseph;
translation:
  language: ko
  text: 잇사갈 지파에서는 요셉의 아들 이갈입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  english_pob_choice: from the tribe of
  chosen_korean: 지파에서
  alternatives_korean:
  - 그 지파의
  - 지파에 속한
  lexicon: HALOT
  rationale: 명단 문맥에서 לְ + מַטֶּה는 특정 지파를 대표하는 사람을 가리키므로, 한국어에서는 소속과 출신을 자연스럽게 드러내는 ‘지파에서’가 가장 적절합니다.
- source_word: יִשָּׂשכָר
  english_pob_choice: Issachar
  chosen_korean: 잇사갈
  alternatives_korean:
  - 이스사갈
  - 잇사카르
  lexicon: 표준 음역
  rationale: 지파명은 통용되는 성경 지명 음역을 따르되, 현대 한국어 표기 관례에 맞게 ‘잇사갈’로 옮겼습니다.
- source_word: יִגְאָל
  english_pob_choice: Igal
  chosen_korean: 이갈
  alternatives_korean:
  - 이가알
  - 야갈
  lexicon: 표준 음역
  rationale: 고유명사는 의미화하지 않고 인명 음역으로 처리해야 하므로, 영어 POB의 표준형 ‘Igal’에 대응하는 한국어 음역 ‘이갈’을 사용했습니다.
- source_word: בֶּן יוֹסֵף
  english_pob_choice: son of Joseph
  chosen_korean: 요셉의 아들
  alternatives_korean:
  - 요셉의 후손
  - 요셉의 자손
  lexicon: HALOT
  rationale: 족보적 식별 표현으로서 בֶּן은 여기서 가장 직접적으로 ‘아들’을 뜻하므로, 과도하게 넓히지 않고 ‘요셉의 아들’로 옮겼습니다.
