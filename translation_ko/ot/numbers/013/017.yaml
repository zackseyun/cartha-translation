  text: וַ/יִּשְׁלַ֤ח אֹתָ/ם֙ מֹשֶׁ֔ה לָ/ת֖וּר אֶת אֶ֣רֶץ כְּנָ֑עַן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם עֲל֥וּ זֶה֙ בַּ/נֶּ֔גֶב וַ/עֲלִיתֶ֖ם אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
  footnotes:
  - marker: a
    text: Or “spy out the land of Canaan.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the Negev,” the southern arid region.
    reason: cultural_note
  - marker: c
    text: Or “the mountains.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그들을 가나안 땅을 정탐하게 보내고, 그들에게 말했습니다. “이 길로 네게브로 올라가서, 산지로 올라가십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정탐하게’는 히브리어 לָתוּר의 조사·정찰 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 네게브는 팔레스타인 남부의 건조한 지리적 지역 이름입니다.
    reason: cultural_note
  - marker: c
    text: ‘산지’는 직역의 ‘산들’보다 문맥상 고지대를 더 정확히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내고
  alternatives_korean:
  - 파견하고
  - 보냈고
  lexicon: HALOT
  rationale: 서술적 wayyiqtol의 기본 의미를 자연스러운 현대 한국어로 옮기되, 군사적 뉘앙스를 과도하게 강하게 만들지 않도록 ‘보내고’를 택했습니다.
- source_word: לָתוּר
  english_pob_choice: to scout out
  chosen_korean: 정탐하게
  alternatives_korean:
  - 살펴보게
  - 탐사하게
  lexicon: HALOT
  rationale: 이 동사는 단순한 여행이 아니라 땅의 상황을 조사하는 정찰을 뜻하므로, POB의 ‘scout out’에 맞춰 ‘정탐하게’로 옮겼습니다.
- source_word: בַּנֶּגֶב
  english_pob_choice: the Negev
  chosen_korean: 네게브로
  alternatives_korean:
  - 남방으로
  - 네게브 지역으로
  lexicon: HALOT
  rationale: 여기서는 지리 고유명사로 쓰였으므로 음역을 유지하고, 전치사적 방향을 살려 ‘-로’로 처리했습니다.
- source_word: הָהָר
  english_pob_choice: the hill country
  chosen_korean: 산지
  alternatives_korean:
  - 산악지대
  - 산들
  lexicon: HALOT
  rationale: 문맥상 단일 산이 아니라 고지대 전체를 가리키므로, 한국어에서 자연스럽고 지형적 범위를 잘 드러내는 ‘산지’를 선택했습니다.
theological_decisions:
- issue: 정탐 명령의 성격
  chosen_reading: 모세가 그들을 단순 파견이 아니라 땅을 조사하는 임무로 보냈다는 뜻을 분명히 살렸습니다.
  alternative_readings:
  - 보냈습니다
  - 살펴보게 했습니다
  rationale: לָתוּר의 조사·정찰 의미를 약화하지 않기 위해, 본문이 전달하는 책임 있는 탐색의 성격을 유지했습니다.
  doctrine_reference: 민수기 13장의 정탐 서사
