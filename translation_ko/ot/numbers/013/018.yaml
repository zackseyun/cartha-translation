id: NUM.13.18
reference: Numbers 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
  footnotes:
  - marker: a
    text: Hebrew literally, 'what it is.' The sense is an assessment of the land's character or condition.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'the people dwelling upon it.' English idiom normally says 'in it' for inhabitants of a land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅이 어떤 곳인지, 또 그 땅에 사는 백성이 강한지 약한지, 적은지 많은지를 살펴보십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것이 무엇인지’입니다. 여기서는 땅의 성격이나 상태를 묻는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 위에 거주하는 백성’입니다. 한국어에서는 거주 대상을 자연스럽게 ‘그 땅에 사는 백성’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  english_pob_choice: See
  chosen_korean: 살펴보십시오
  alternatives_korean:
  - 보십시오
  - 관찰하십시오
  lexicon: HALOT
  rationale: 정탐 사명의 맥락에서 단순 시각보다 면밀한 점검의 뜻이 살아야 하므로, 공손한 명령형으로 ‘살펴보십시오’를 택했습니다.
- source_word: הָאָרֶץ מַה הִוא
  english_pob_choice: what the land is like
  chosen_korean: 그 땅이 어떤 곳인지
  alternatives_korean:
  - 그 땅이 무엇인지
  - 그 땅의 상태가 어떤지
  lexicon: HALOT
  rationale: 직역상 ‘무엇인지’에 가깝지만, 여기서는 땅의 성격·상태를 묻는 평가적 질문이므로 한국어로는 ‘어떤 곳인지’가 가장 자연스럽습니다.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  english_pob_choice: the people who dwell in it
  chosen_korean: 그 땅에 사는 백성
  alternatives_korean:
  - 그 땅에 거주하는 백성
  - 그 땅 위에 사는 백성
  lexicon: HALOT
  rationale: ‘עָלֶיהָ’의 문자적 ‘그 위에’보다, 한 나라/땅의 주민을 가리키는 관용을 살려 ‘그 땅에 사는’으로 옮겼습니다.
- source_word: הֶחָזָק ... הֲרָפֶה
  english_pob_choice: strong or weak
  chosen_korean: 강한지 약한지
  alternatives_korean:
  - 힘센지 약한지
  - 강력한지 무력한지
  lexicon: HALOT
  rationale: 사람들의 역량을 평가하는 대조이므로, 가장 직접적인 대응인 ‘강한지 약한지’를 선택했습니다.
- source_word: הַמְעַט ... אִם רָב
  english_pob_choice: whether they are few or many
  chosen_korean: 적은지 많은지
  alternatives_korean:
  - 수가 적은지 많은지
  - 소수인지 다수인지
  lexicon: HALOT
  rationale: 수량 대비를 한국어 질문형으로 간결하게 살리기 위해 ‘적은지 많은지’로 옮겼습니다.
theological_decisions:
- issue: 정탐 명령의 어조
  chosen_reading: 이 구절은 직접적인 조사 명령으로 읽고, 한국어에서도 공손한 명령형을 유지했습니다.
  alternative_readings:
  - 서술형 권고로 완화
  - 단순 설명문으로 처리
  rationale: 히브리어 연속 명령의 기능을 유지해야 하므로, 독자에게 지시하는 어조를 보존하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 본문 문법과 담화 기능에 대한 번역 원칙
