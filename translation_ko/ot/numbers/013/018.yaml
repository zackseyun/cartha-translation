- issue: 정탐 명령의 어조
  chosen_reading: 이 구절은 직접적인 조사 명령으로 읽고, 한국어에서도 공손한 명령형을 유지했습니다.
  alternative_readings:
  - 서술형 권고로 완화
  - 단순 설명문으로 처리
  rationale: 히브리어 연속 명령의 기능을 유지해야 하므로, 독자에게 지시하는 어조를 보존하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 본문 문법과 담화 기능에 대한 번역 원칙
