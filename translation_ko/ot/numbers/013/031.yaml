source:
  edition: WLC
  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'to go up to the people'; in context this means 'to go up against the people' in military confrontation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew has singular, 'the people ... it/he is stronger than we'; English renders the collective sense as plural, 'they are stronger than we are.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그와 함께 올라갔던 사람들은 말했습니다. “우리는 그 백성을 치러 올라갈 수 없습니다[a]. 그들은[b] 우리보다 강합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 백성에게로 올라가다’라고 합니다. 이 문맥에서는 그 백성을 향해 올라가 맞서는, 곧 군사적으로 대적하는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘백성’이라는 집합명사와 그에 받는 단수 표현을 사용합니다. 한국어에서는 그 집합적 의미를 반영하여 복수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  english_pob_choice: But the men
  chosen_korean: 그와 함께 올라갔던 그 남자들은
  alternatives_korean:
  - 그러나 그 남자들은
  - 그 남자들은
  lexicon: HALOT
  rationale: 문맥상 갈렙의 보고와 대비되는 전환이지만, 한국어에서는 접속사보다 서술 구조로 대비를 드러내는 것이 자연스러워 ‘그와 함께 올라갔던 그 남자들’로 식별했습니다.
- source_word: לֹא נוּכַל לַעֲלוֹת אֶל הָעָם
  english_pob_choice: We are not able to go up against the people
  chosen_korean: 우리는 그 백성에게 올라갈 수 없습니다
  alternatives_korean:
  - 우리는 그 백성을 향해 올라갈 수 없습니다
  - 우리는 그 백성에게 대항하여 올라갈 수 없습니다
  lexicon: HALOT
  rationale: עלה의 기본값인 ‘올라가다’를 살리되, 전쟁적 맥락을 한국어 독자가 과도하게 해석하지 않도록 본문에는 직역을 두고 의미는 문맥이 받치게 했습니다.
- source_word: אֶל הָעָם
  english_pob_choice: against the people
  chosen_korean: 그 백성에게
  alternatives_korean:
  - 그 백성을 향해
  - 그 백성에 맞서
  lexicon: HALOT
  rationale: אֶל의 기본 전치사값을 유지하면서도 한국어에서는 ‘올라가다’와 결합해 자연스럽게 읽히도록 ‘에게’로 처리했습니다. 군사적 뉘앙스는 주석 없이도 앞뒤 문맥에서 분명합니다.
- source_word: חָזָק הוּא מִמֶּנּוּ
  english_pob_choice: they are stronger than we are
  chosen_korean: 그들이 우리보다 강합니다
  alternatives_korean:
  - 그것이 우리보다 강합니다
  - 그가 우리보다 강합니다
  - 그들이 우리보다 더 강합니다
  lexicon: HALOT
  rationale: 히브리어는 단수 주어와 집합명사 ‘백성’을 연결하지만, 한국어에서는 집합 전체를 자연스럽게 복수 대명사로 풀어 ‘그들이’로 옮겼습니다. 비교 구문 מִן의 힘은 ‘우리보다 강합니다’로 보존했습니다.
theological_decisions:
- issue: 집합명사 ‘הָעָם’의 인칭 처리
