revisions:
- from: “당신 자신을 위해 사람들을 보내십시오. 그들이 가나안 땅을 정탐하게 하십시오. 그 땅은 내가 이스라엘 자손에게 주고 있는 땅입니다. 각 지파마다, 그 조상들의 지파에서 한 사람씩 보내십시오. 그들 가운데는 모두 지도자가 되어야 합니다.”[a][b][c]
  to: “당신을 위하여 사람들을 보내십시오. 그들이 가나안 땅을 정탐하도록 하십시오.[a] 그 땅은 내가 이스라엘 자손에게[b] 주고 있는 땅입니다. 각자의 조상 지파마다 그들 가운데 지도자인 사람을 한 명씩 보내십시오.[c]”
  rationale: 수정문은 לְךָ를 ‘당신을 위하여’로 남겨 두면서도 한국어의 자연스러움을 확보했습니다. ‘각자의 조상 지파마다 … 한 명씩’은 원문의 분배적 반복과 혈연·지파 관계를 반영합니다. 마지막 절은 지도자됨을 미래 명령으로 바꾸지 않고, 파견 대상의 기존 신분을 나타내도록 바로잡았습니다. 각주도 해당 단어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:14Z'
