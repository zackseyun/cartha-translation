  verdict: revise
  source_fidelity: 히브리어의 분배 구문(‘각 조상 지파마다 한 사람씩’)과 ‘그들 가운데 지도자인 사람’이라는 수식 관계가 초안에서 충분히 보존되지 않았습니다. 특히 ‘그들 가운데는 모두 지도자가 되어야 합니다’는 파견될 사람들이 이미 지도자라는 원문을, 그들이 지도자가 되어야 한다는 뜻으로 바꿉니다.
  naturalness: ‘각 지파마다, 그 조상들의 지파에서’는 같은 지파 개념을 중복하여 한국어로 어색합니다. 또한 ‘당신 자신을 위해’는 지나치게 직역적이므로, לְךָ의 개인적·수여적 뉘앙스를 유지하면서 ‘당신을 위하여’로 다듬는 편이 자연스럽습니다.
