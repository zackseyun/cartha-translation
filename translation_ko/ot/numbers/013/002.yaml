id: NUM.13.2
reference: Numbers 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
  footnotes:
  - marker: a
    text: Or 'spy out' or 'explore' the land.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: cultural_note
  - marker: c
    text: Or 'every one a chief among them'; the Hebrew term can denote a tribal leader or prince.
    reason: lexical_alternative
translation:
  language: ko
  text: “당신 자신을 위해 사람들을 보내십시오. 그들이 가나안 땅을 정탐하게 하십시오. 그 땅은 내가 이스라엘 자손에게 주고 있는 땅입니다. 각 지파마다, 그 조상들의 지파에서 한 사람씩 보내십시오. 그들 가운데는 모두 지도자가 되어야 합니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정탐하다’는 여기서 ‘탐사하다/살펴보다’의 의미도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘이스라엘 자손’은 언약 공동체를 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘지도자’는 부족의 우두머리나 수장을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  english_pob_choice: Send for yourself
  chosen_korean: “당신 자신을 위해 사람들을 보내십시오”
  alternatives_korean:
  - “보내십시오”
  - “당신을 위해 사람들을 보내십시오”
  - “자신을 위해 보내십시오”
  lexicon: HALOT
  rationale: לְךָ를 단순히 생략하지 않고, 모세에게 직접 주어진 명령이라는 점을 살려 ‘당신 자신을 위해’로 투명하게 반영했습니다.
- source_word: וְיָתֻרוּ
  english_pob_choice: let them scout out
  chosen_korean: “그들이 … 정탐하게 하십시오”
  alternatives_korean:
  - “탐사하게 하십시오”
  - “살펴보게 하십시오”
  - “스파이하게 하십시오”
  lexicon: HALOT
  rationale: 문맥상 정찰·탐사 의미를 가지지만, 현대 한국어에서 자연스럽고 군사적 뉘앙스를 과하게 좁히지 않도록 ‘정탐하다’를 선택했습니다.
- source_word: אֶרֶץ כְּנַעַן
  english_pob_choice: the land of Canaan
  chosen_korean: “가나안 땅”
  alternatives_korean:
  - “가나안의 땅”
  - “가나안 땅”
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 직접 살리면서도 한국어에서 가장 자연스러운 지명 표현으로 옮겼습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: “이스라엘 자손에게”
  alternatives_korean:
  - “이스라엘의 아들들에게”
  - “이스라엘 자녀들에게”
  - “이스라엘 사람들에게”
  lexicon: HALOT
  rationale: 영어 POB의 설명처럼 관용적 언약 표현을 유지하되, 한국어에서는 관용적으로 굳어진 ‘이스라엘 자손’이 원문 구조를 가장 투명하게 반영합니다.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  english_pob_choice: one man ... every one
  chosen_korean: “각 지파마다 … 한 사람씩”
  alternatives_korean:
  - “한 사람씩”
  - “한 남자씩”
  - “지파마다 한 사람씩”
  lexicon: HALOT
  rationale: 반복의 분배적 힘을 한국어의 ‘각 지파마다 … 한 사람씩’으로 살려, 원문의 분배 강조를 자연스럽게 드러냈습니다.
- source_word: לְמַטֵּה אֲבֹתָיו
  english_pob_choice: from each tribe of his fathers
  chosen_korean: “그 조상들의 지파에서”
  alternatives_korean:
  - “그 조상의 지파에서”
  - “조상들의 지파별로”
  - “그들의 조상 지파에서”
  lexicon: HALOT
  rationale: מַטֶּה를 ‘지파’로, אֲבֹתָיו를 ‘조상들의’로 옮겨 혈연·가문 구조를 유지했습니다.
theological_decisions:
- issue: 명령형과 허용 뉘앙스의 처리
  chosen_reading: 문장을 직접 명령형으로 옮기되, לְךָ를 살려 개인적 지시의 성격을 드러냈습니다.
  alternative_readings:
  - 단순한 명령문으로 ‘보내십시오’만 옮김
  - ‘스스로 보내십시오’처럼 행위 주체를 재구성함
  rationale: 본문은 단순 지시를 넘어서 모세에게 개인적으로 주어진 명령의 뉘앙스를 포함할 수 있으므로, 이를 과도하게 평탄화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘정탐’의 군사적 함의
  chosen_reading: ‘정탐하다’를 사용해 단순한 관찰이 아니라 임무 수행의 성격을 드러냈습니다.
  alternative_readings:
  - ‘탐사하다’로 완화
  - ‘살펴보다’로 일반화
  rationale: 문맥상 그들은 약속된 땅을 조사하기 위해 파견되므로, 한국어에서 가장 가까운 기능어인 ‘정탐하다’가 원문의 목적을 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §2, §5
