  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
  footnotes:
  - marker: a
    text: Or, traditionally, 'giants' for 'Nephilim.' The Hebrew term is uncertain and is therefore left transliterated in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그곳에서 우리는 네피림[a], 곧 네피림에게서 나온 아낙의 자손들을 보았습니다. 우리 눈에는 우리가 메뚜기 같았고, 그들의 눈에도 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘거인들’로 옮기기도 하지만, 히브리어 נְפִילִים의 의미는 확정적이지 않으므로 본문에서는 음역을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  english_pob_choice: the Nephilim
  chosen_korean: 네피림들
  alternatives_korean:
  - 거인들
  - 타락한 자들
  lexicon: HALOT
  rationale: 히브리어의 뜻이 확정적이지 않으므로 해석어를 단정하지 않고 음역을 유지해, 본문의 모호성과 전승상의 논쟁을 그대로 드러냅니다.
- source_word: בְּנֵי עֲנָק
  english_pob_choice: the sons of Anak
  chosen_korean: 아낙의 자손들
  alternatives_korean:
  - 아낙의 아들들
  - 아낙의 후손들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 자연스럽게 옮기되, 혈통/씨족 관계를 읽을 수 있도록 자손들로 처리했습니다.
- source_word: וַ/נְּהִי בְ/עֵינֵי/נוּ
  english_pob_choice: we seemed in our own eyes
  chosen_korean: 우리는 우리 자신의 눈에
  alternatives_korean:
  - 우리는 우리 눈에
  - 우리는 우리 자신에게
  lexicon: HALOT
  rationale: ‘~의 눈에’라는 관용구를 살려 자기평가의 의미를 유지했고, own의 뉘앙스를 위해 ‘자신의’를 보탰습니다.
- source_word: כַּ/חֲגָבִים
  english_pob_choice: like grasshoppers
  chosen_korean: 메뚜기처럼
  alternatives_korean:
  - 풀무치처럼
  - 황충처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 작고 보잘것없어 보이는 자기인식이므로, 한국어에서 가장 자연스러운 일반 명사인 메뚜기를 사용했습니다.
theological_decisions:
- issue: 네피림의 번역 처리
  chosen_reading: 주번역은 음역 ‘네피림들’을 유지하고, 해석어인 ‘거인들’은 본문에 넣지 않았습니다.
  alternative_readings:
  - 거인들
  - 타락한 자들
  rationale: 본문은 창세기 6:4와 연관되는 논쟁적 용어를 사용하므로, 확정적 해석을 본문에 삽입하지 않고 독자가 원문상의 긴장을 인지하도록 했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
