revisions:
- from: 그들은 그 땅에 대해 이스라엘 자손에게 나쁜 보고를 내놓았습니다. 그들이 살펴본 그 땅에 관해 말하기를, “우리가 지나가며 살펴본 그 땅은 그 주민들을 집어삼키는 땅입니다. 그리고 그 안에서 우리가 본 모든 백성은 키가 아주 큰 사람들입니다.”[a][b][c][d][e]
  to: 그들은 자신들이 살펴본[b] 땅에 관한 나쁜 보고[a]를 이스라엘 자손[c]에게 전하며 이렇게 말했습니다. “우리가 그 땅을 살펴보려고 지나가 본 그 땅은 그 주민들을 집어삼키는[d] 땅입니다. 그 안에서 우리가 본 백성은 모두 체격이 매우 큰[e] 사람들이었습니다.”
  rationale: 각주 표지를 해당 본문 어구에 직접 연결하여 앵커 기능을 바로잡았습니다. 또한 אַנְשֵׁי מִדּוֹת의 신체적 크기라는 뜻을 ‘체격이 매우 큰’으로 옮겨 신장에만 한정되지 않도록 했습니다. 나머지 표현은 원문의 부정적 보고, 탐사, 그리고 땅이 주민을 삼킨다는 비유를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:34Z'
