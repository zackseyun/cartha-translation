  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
  footnotes:
  - marker: a
    text: Or “spread a bad report,” or more strongly, “slandered the land.”
    reason: lexical_alternative
  - marker: b
    text: Or “spied out” / “scouted.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “sons of Israel”; a standard covenantal designation for the people of Israel.
    reason: cultural_note
  - marker: d
    text: Or “a land that consumes its inhabitants.”
    reason: lexical_alternative
  - marker: e
    text: Or “men of stature,” referring here to impressive physical size.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자신들이 살펴본[b] 땅에 관한 나쁜 보고[a]를 이스라엘 자손[c]에게 전하며 이렇게 말했습니다. “우리가 그 땅을 살펴보려고 지나가 본 그 땅은 그 주민들을 집어삼키는[d] 땅입니다. 그 안에서 우리가 본 백성은 모두 체격이 매우 큰[e] 사람들이었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 땅에 대한 나쁜 보고를 퍼뜨렸다” 혹은 더 강하게 “그 땅을 비방했다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “살펴보았다” / “정탐했다.”
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 “이스라엘의 자손”입니다. 이는 이스라엘 백성을 가리키는 표준적 언약 호칭입니다.
    reason: cultural_note
  - marker: d
    text: 또는 “그 주민들을 삼키는 땅.”
    reason: lexical_alternative
  - marker: e
    text: 또는 “큰 체격의 사람들” 또는 “체구가 큰 사람들.” 여기서는 두드러진 신체적 크기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  english_pob_choice: brought out a bad report
  chosen_korean: 나쁜 보고를 내놓았습니다
  alternatives_korean:
  - 악평을 퍼뜨렸습니다
  - 나쁜 소문을 냈습니다
  - 악한 보고를 퍼뜨렸습니다
  lexicon: HALOT
  rationale: דִּבָּה는 부정적·비방적 보고를 뜻하므로, 직역적 이미지인 ‘내놓다’를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 사람들에게
  - 이스라엘의 아들들에게
  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 보존하면서도 한국어에서 관용적인 성경 표현으로 읽히는 ‘이스라엘 자손’을 유지했습니다.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  english_pob_choice: a land that devours its inhabitants
  chosen_korean: 그 주민들을 집어삼키는 땅
  alternatives_korean:
  - 그 주민들을 삼키는 땅
  - 그 주민들을 먹어 치우는 땅
  - 그 주민들을 잡아먹는 땅
  lexicon: HALOT
  rationale: אָכַל의 강한 비유를 살려 ‘집어삼키다’로 옮겨, 단순한 ‘먹다’보다 위협적이고 과장된 보고의 어조를 드러냈습니다.
- source_word: אַנְשֵׁי מִדּוֹת
  english_pob_choice: men of great size
  chosen_korean: 키가 아주 큰 사람들
  alternatives_korean:
  - 체격이 아주 큰 사람들
  - 큰 체구의 사람들
  - 키가 큰 장정들
  lexicon: HALOT
  rationale: 이 표현은 사회적 ‘위상’이 아니라 육체적 크기를 가리키므로, 오해를 줄이기 위해 키 중심의 표현으로 풀었습니다.
theological_decisions:
