source:
  edition: WLC
  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
  footnotes:
  - marker: a
    text: Or 'in encampments ... in strongholds.' The Hebrew contrasts camp-like settlements with fortified places.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사는 땅은 어떠합니까? 좋습니까, 나쁩니까? 또 그들이 사는 성읍들은 어떠합니까? 진영들입니까, 아니면 요새들입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야영지들 … 요새화된 곳들’. 히브리어는 야영지 같은 정착지와 요새화된 곳을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה / הָאָרֶץ
  english_pob_choice: And what is the land like
  chosen_korean: 그 땅은 어떠합니까?
  alternatives_korean:
  - 그 땅은 어떻습니까?
  - 그 땅은 어떤 땅입니까?
  lexicon: HALOT
  rationale: 조사 대상의 상태를 묻는 히브리어 שאלות을 한국어의 ‘어떠합니까’로 자연스럽게 옮겨, 단순 명사문의 물음이 아니라 상태 평가의 뉘앙스를 살렸습니다.
- source_word: הֲטוֹבָה ... אִם רָעָה
  english_pob_choice: Is it good or bad?
  chosen_korean: 좋습니까, 나쁩니까?
  alternatives_korean:
  - 좋은지 나쁜지요?
  - 좋거나 나쁜가요?
  lexicon: HALOT
  rationale: 좋음/나쁨의 양극 대비를 직접 살려, 땅의 품질에 대한 평가라는 폭넓은 의미를 유지했습니다.
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 그 성읍들
  alternatives_korean:
  - 그 도시들
  - 그 마을들
  lexicon: HALOT
  rationale: 문맥상 정탐 대상의 정주지를 가리키므로, 현대어의 ‘도시’보다 성경적 지리 문맥에 더 맞는 ‘성읍들’을 택했습니다.
- source_word: בַּמַּחֲנִים ... בְּמִבְצָרִים
  english_pob_choice: in camps ... in fortifications
  chosen_korean: 진영들 안에 ... 요새들 안에
  alternatives_korean:
  - 진 캠프들 안에 ... 견고한 곳들 안에
  - 진영들에 ... 요새들에
  lexicon: HALOT
  rationale: 히브리어의 대조는 임시적 거주 형태(מחנות)와 방어적 요새(מבצרים) 사이의 대비이므로, ‘진영들’과 ‘요새들’로 직역에 가깝게 살렸습니다. 영어 POB의 주석 취지를 반영해 대조 구조를 보존했습니다.
theological_decisions:
- issue: 정탐 질문의 수사 구조를 한국어에서 어떻게 살릴지
  chosen_reading: 연속된 짧은 질문문으로 옮겨, 평가와 대비의 긴장감을 유지했습니다.
  alternative_readings:
  - 한 문장으로 풀어 서술하는 방식
  - 부드럽게 연결한 설명문 형태
  rationale: 본문은 정보 수집용 질문들의 연쇄이므로, 설명체로 풀기보다 물음표를 유지하는 편이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 본문 해석의 문체/담화 기능
