    reason: lexical_alternative
  revision_rationale: 성읍이 ‘진영들 안에’ 혹은 ‘요새들 안에’ 있다는 공간적 의미를 제거하고, 원문의 질문처럼 성읍의 정착·방어 형태를 ‘진영들/요새들’의 대조로 제시했습니다. 또한 원문의 주민 지시를 한국어 문맥에 맞게 ‘그들이 사는’으로 복원했습니다.
