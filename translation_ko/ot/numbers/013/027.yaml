  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְסַפְּרוּ ל/וֹ֙ וַ/יֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑/נוּ וְ֠/גַם זָבַ֨ת חָלָ֥ב וּ/דְבַ֛שׁ הִ֖וא וְ/זֶה פִּרְיָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
  footnotes:
  - marker: a
    text: Or, 'And indeed it flows with milk and honey.' The Hebrew וְגַם adds emphasis to the statement about the land’s abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게 보고하며 말했습니다. “우리는 당신이 보내신 그 땅에 들어갔습니다. 정말로 젖과 꿀이 흐르는 땅이며, 이것이 바로 그 열매입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 וְגַם은 단순한 ‘그리고’보다 강조를 더해, 그 땅의 풍성함을 확증하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ / וַיֹּאמְרוּ
  english_pob_choice: They reported to him and said
  chosen_korean: 그들은 그에게 보고하며 말했습니다
  alternatives_korean:
  - 그들은 그에게 말하며 알렸습니다
  - 그들은 그에게 전하며 말했습니다
  lexicon: HALOT
  rationale: ספר의 피엘형은 단순 발화보다 ‘보고하다/전하다’의 성격이 강하므로, 정탐꾼들의 공식 보고라는 장면에 맞게 ‘보고하며 말했습니다’로 옮겼습니다.
- source_word: בָּאנוּ אֶל הָאָרֶץ
  english_pob_choice: We came into the land
  chosen_korean: 우리는 ... 그 땅에 들어갔습니다
  alternatives_korean:
  - 우리는 ... 그 땅에 왔습니다
  - 우리는 ... 그 땅으로 들어갔습니다
  lexicon: HALOT
  rationale: בוא는 ‘오다/들어가다’의 의미를 가지므로, 영어 POB의 잠정 수정(come into)을 반영해 ‘들어갔습니다’로 옮겨 진입의 뉘앙스를 살렸습니다.
- source_word: וְגַם זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: It truly flows with milk and honey
  chosen_korean: 정말로 젖과 꿀이 흐르는 땅이며
  alternatives_korean:
  - 참으로 젖과 꿀이 흐르는 땅이며
  - 정녕 젖과 꿀이 흐르는 땅이며
  lexicon: HALOT
  rationale: וְגַם은 단순 연결이 아니라 강조를 더하므로, ‘정말로’로 그 확증의 힘을 살렸고, זָבַת חָלָב וּדְבַשׁ은 관용적으로 ‘젖과 꿀이 흐르는’으로 옮겼습니다.
- source_word: וְזֶה פִּרְיָהּ
  english_pob_choice: and this is its fruit
  chosen_korean: 이것이 바로 그 열매입니다
  alternatives_korean:
  - 이것이 그 열매입니다
  - 그리고 이것이 그 열매입니다
  lexicon: HALOT
  rationale: 지시대명사 וְזֶה는 눈앞의 증거를 가리키는 표현이므로, 한국어에서도 입증의 뉘앙스가 드러나도록 ‘이것이 바로’로 옮겼습니다.
theological_decisions:
- issue: 출애굽기/민수기 맥락의 지시 대상 보존
  chosen_reading: ‘그 땅’과 ‘그 열매’를 유지해 화자의 시점에서 제시되는 실물 확인의 느낌을 살렸습니다.
  alternative_readings:
  - ‘그곳’으로 일반화
  - ‘그 열매가 있었습니다’로 서술화
  rationale: 이 절은 약속의 땅의 실제성을 증언하는 보고이므로, 지시어를 보존해 현장 진술의 성격을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 13장의 정탐 보고 서술
