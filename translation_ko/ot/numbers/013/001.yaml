  - 말하며
  - 말씀하시기를
  lexicon: HALOT
  rationale: 히브리어의 관용적 발화 도입구는 한국어에서 중복을 피하면서도 직접 인용을 예고하는 ‘이르셨습니다’가 가장 간결합니다.
