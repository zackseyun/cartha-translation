  rationale: 서술 진행형의 문맥에서 단순 과거보다 ‘말씀하시며’가 히브리어의 이야기 도입 기능과 직후의 ‘이르다’ 공식을 함께 자연스럽게 살립니다.
- source_word: יְהוָה
