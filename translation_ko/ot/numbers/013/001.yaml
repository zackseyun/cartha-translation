  - -한테
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 전치사는 현대 한국어의 자연스러운 여격 조사 ‘-에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
