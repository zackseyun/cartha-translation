theological_decisions:
- issue: 지명·민족명의 직역 여부
  chosen_reading: 고유 지명과 민족 집단명을 본문이 드러내는 대로 유지하여, 이스라엘이 인식한 토지 분포의 실제성을 보이도록 했습니다.
  alternative_readings:
  - 남쪽 땅/남방
  - 그 지역 주민들
  rationale: 이 절은 신학적 해설보다 정탐 보고의 지리적 정보가 핵심이므로, 특정 지역명과 민족명을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 성경 본문 해석의 역사-지리적 문맥 보존
- issue: 열거의 간결성
  chosen_reading: 한국어 연결을 단순화해 네 개 민족이 각각의 거주 영역에 대비되도록 했습니다.
  alternative_readings:
  - 각 민족을 더 설명적으로 풀어쓰기
  - 문장 재배열
  rationale: 히브리어 병렬 구조를 과도하게 풀지 않고 유지해야 원문의 대조와 리듬이 보존됩니다.
  doctrine_reference: 원문 병렬 구조 보존
