id: NUM.13.21
reference: Numbers 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ וַ/יָּתֻ֣רוּ אֶת הָ/אָ֑רֶץ מִ/מִּדְבַּר צִ֥ן עַד רְחֹ֖ב לְבֹ֥א חֲמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
  footnotes:
  - marker: a
    text: Or, 'toward the entrance of Hamath.' The Hebrew expression may be read descriptively rather than as the place name Lebo-hamath.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 올라가서 신 광야에서부터 하맛 어귀의 르홉까지 그 땅을 정탐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하맛의 입구 쪽으로’. 히브리어 표현은 지명 ‘르홉’이 아니라 설명적 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: they went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 가서
  - 오르다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살리되, 여행 서술에서 자연스러운 연결형 ‘올라가서’로 옮겼습니다.
- source_word: וַיָּתֻרוּ
  english_pob_choice: spied out
  chosen_korean: 정탐했습니다
  alternatives_korean:
  - 탐지했습니다
  - 살펴보았습니다
  lexicon: HALOT
  rationale: 이 문맥의 תור는 단순한 ‘둘러보다’보다 파견된 자들의 정찰 행위를 가리키므로, 한국어에서도 그 뉘앙스가 드러나는 ‘정탐했습니다’를 택했습니다.
- source_word: מִמִּדְבַּר צִן
  english_pob_choice: from the wilderness of Zin
  chosen_korean: 신 광야에서부터
  alternatives_korean:
  - 신 사막에서부터
  - 신 들판에서부터
  lexicon: HALOT
  rationale: מִדְבָּר는 Pentateuch 지리 맥락에서 관용적으로 ‘광야’로 옮기는 것이 적절하며, 지명 צִן은 음역해 ‘신’으로 처리했습니다.
- source_word: לְבֹא חֲמָת
  english_pob_choice: at Lebo-hamath
  chosen_korean: 하맛 어귀의 르홉
  alternatives_korean:
  - 하맛에 이르는 르홉
  - 하맛 입구의 르홉
  lexicon: HALOT
  rationale: English POB의 각주가 지적하듯 이 표현은 지명처럼 읽을 수도 있으므로 본문에서는 ‘하맛 어귀’로 옮겨 기술적 의미를 살리고, רְחֹב는 음역해 ‘르홉’으로 유지했습니다.
theological_decisions:
- issue: 지리 경계 표현의 처리
  chosen_reading: ‘하맛 어귀의 르홉’으로 본문에 두어, 탐지 범위의 종착점을 지명과 설명적 표현이 겹친 형태로 제시했습니다.
  alternative_readings:
  - ‘르홉에서 하맛 어귀까지’
  - ‘하맛으로 들어가는 어귀’
  rationale: 히브리어 표현은 장소명으로 고정될 수도, 방향을 나타내는 서술로 읽힐 수도 있어 둘 중 하나로 과도하게 단정하지 않고 원문의 모호성을 보존했습니다.
  doctrine_reference: 본문의 지리 표지 해석에 관한 주석적 판단
