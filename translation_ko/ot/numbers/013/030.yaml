revisions:
- from: 그때 갈렙이 모세 앞에서 백성을 조용하게 하고 말했습니다. 「우리가 반드시 올라가서 그것을 차지해야 합니다. 우리는 반드시 그렇게 할 수 있습니다.」[a][b][c]
  to: 그때 갈렙이 모세 앞에서 백성을 잠잠하게 하고[a] 말했습니다. “우리가 반드시 올라가서[b] 그 땅을 차지합시다. 우리는 반드시 해낼 수 있습니다.”[c]
  rationale: 청유형 ‘차지합시다’로 원문의 공동 행동 촉구를 보존하고, ‘그 땅’으로 문맥상 지시 대상을 명료하게 했습니다. 또한 각주 표지를 해당 표현에 붙이고, 강조 구조에 대한 설명을 히브리어 문법에 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
