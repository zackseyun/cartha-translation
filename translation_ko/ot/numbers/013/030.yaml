    issue: ‘차지해야 합니다’가 청유를 의무 표현으로 바꿉니다.
    rationale: עָלֹה נַעֲלֶה 및 이어지는 וְיָרַשְׁנוּ는 공동 행동을 촉구하는 발화입니다. ‘-해야 합니다’는 필연·의무의 의미를 추가하므로 ‘-합시다’가 더 충실합니다.
  - severity: low
    issue: 각주 표지가 인용문 전체 뒤에 한꺼번에 놓여 있습니다.
    rationale: 각 표지를 해당 어휘·구문 바로 뒤에 두면 어휘 대안과 강조 구조의 적용 범위가 분명해집니다.
  - severity: low
