  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
  footnotes:
  - marker: a
    text: Or 'silenced the people before Moses.' The Hebrew verb can mean 'quieted,' 'stilled,' or 'silenced.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'go up, we will surely go up'—an emphatic construction.
    reason: lexical_alternative
  - marker: c
    text: Or 'for we are well able to do it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 갈렙이 모세 앞에서 백성을 조용하게 하고 말했습니다. 「우리가 반드시 올라가서 그것을 차지해야 합니다. 우리는 반드시 그렇게 할 수 있습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘조용하게 하다’, ‘가라앉히다’, ‘침묵시키다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘올라가자, 우리가 반드시 올라가자’라는 강조 구조입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리는 그것을 충분히 해낼 수 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  english_pob_choice: quieted
  chosen_korean: 조용하게 하고
  alternatives_korean:
  - 잠잠하게 하고
  - 침묵하게 하고
  - 조용히 시키고
  lexicon: HALOT
  rationale: 이 동사는 군중을 가라앉혀 조용해지게 하는 뜻이어서, 강한 억압 뉘앙스가 덜한 ‘조용하게 하고’가 문맥에 가장 자연스럽습니다.
- source_word: אֶל־מֹשֶׁה
  english_pob_choice: before Moses
  chosen_korean: 모세 앞에서
  alternatives_korean:
  - 모세에게
  - 모세 앞에
  - 모세 면전에서
  lexicon: HALOT
  rationale: 이 표현은 단순한 이동 방향보다 모세가 있는 자리에서, 그 앞에서 말하는 장면을 가리키므로 ‘모세 앞에서’가 자연스럽습니다.
- source_word: עָלֹה נַעֲלֶה
  english_pob_choice: Let us surely go up
  chosen_korean: 우리가 반드시 올라가서
  alternatives_korean:
  - 우리가 꼭 올라가서
  - 우리가 반드시 올라가자
  - 우리가 틀림없이 올라가서
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 살려 ‘반드시’로 중첩된 확신을 표현했습니다.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  english_pob_choice: and take possession of it
  chosen_korean: 그것을 차지해야 합니다
  alternatives_korean:
  - 그것을 점유해야 합니다
  - 그것을 소유해야 합니다
  - 그것을 상속받아야 합니다
  lexicon: HALOT
  rationale: 가나안 땅을 실제로 점유하여 들어간다는 뜻을 살리기 위해, 법적 상속보다 능동적 점유를 드러내는 ‘차지하다’를 택했습니다.
- source_word: כִּי יָכוֹל נוּכַל לָהּ
  english_pob_choice: for we are certainly able to do it
  chosen_korean: 우리는 반드시 그렇게 할 수 있습니다
  alternatives_korean:
  - 우리는 정말 할 수 있습니다
  - 우리는 충분히 해낼 수 있습니다
  - 우리는 그것을 해낼 수 있습니다
  lexicon: HALOT
  rationale: 강조 구조를 반영해 확신을 분명히 하고, 뒤의 대명사 목적어는 한국어에서 자연스럽게 ‘그렇게’로 풀어 주었습니다.
theological_decisions:
- issue: 갈렙의 발화 등록
  chosen_reading: 직접 인용은 명령형·확신형으로 옮기되, 한국어 합쇼체를 유지했습니다.
  alternative_readings:
  - 반말형으로 바꾸는 방식
  - 더 강한 선동적 어조로 옮기는 방식
  rationale: 본문은 백성의 두려움에 맞서는 신뢰의 선언이므로, 현대 문어체의 분명한 확신을 유지하되 본문 장면의 공적 발화를 해치지 않도록 합쇼체로 번역했습니다.
  doctrine_reference: 민수기 13장 문맥의 신실한 믿음과 순종의 대비
