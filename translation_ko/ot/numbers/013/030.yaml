  chosen_korean: 그것을 차지해야 합니다
  alternatives_korean:
  - 그것을 점유해야 합니다
  - 그것을 소유해야 합니다
  - 그것을 상속받아야 합니다
  lexicon: HALOT
  rationale: 가나안 땅을 실제로 점유하여 들어간다는 뜻을 살리기 위해, 법적 상속보다 능동적 점유를 드러내는 ‘차지하다’를 택했습니다.
- source_word: כִּי יָכוֹל נוּכַל לָהּ
  english_pob_choice: for we are certainly able to do it
  chosen_korean: 우리는 반드시 그렇게 할 수 있습니다
