id: NUM.13.20
reference: Numbers 13:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
  footnotes:
  - marker: a
    text: Or possibly, 'whether there is timber in it or not'; the Hebrew word can mean 'tree' or 'wood.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the days were the days of the first-ripe grapes,' that is, the beginning of the grape harvest season.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 땅이 비옥한지 척박한지, 그 안에 나무가 있는지 없는지 보십시오. 그리고 강해지십시오[b], 그리고 그 땅의 열매를 조금 가져오십시오. 이제 때는 첫 포도송이가 익기 시작하는 철이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 '강해지십시오'입니다. 여기서는 정찰 임무를 수행할 준비와 결의를 촉구하는 말로 이해했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה / רָזָה
  english_pob_choice: fertile or lean
  chosen_korean: 비옥한지 척박한지
  alternatives_korean:
  - 기름진지 메마른지
  - 살찐지 마른지
  lexicon: HALOT
  rationale: 땅의 상태를 말하는 관용적 대비를 한국어 농경 문맥에 자연스럽게 옮겼습니다. '척박한'은 land quality의 부족을 분명히 드러냅니다.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  english_pob_choice: whether there are trees in it or not
  chosen_korean: 그 안에 나무가 있는지 없는지
  alternatives_korean:
  - 그 안에 나무가 있는지 없는지
  - 그 안에 수목이 있는지 없는지
  lexicon: HALOT
  rationale: עֵץ의 기본값인 '나무'를 살려 정찰 맥락에 직접적인 표현으로 옮겼습니다. '수목'은 다소 문어적이어서 본문은 더 직접적인 표현을 택했습니다.
- source_word: וְהִתְחַזַּקְתֶּם
  english_pob_choice: be strong
  chosen_korean: 강해지십시오
  alternatives_korean:
  - 힘을 내십시오
  - 굳세어지십시오
  - 용기를 내십시오
  lexicon: HALOT
  rationale: 히트파엘의 자기 강화/분발 뉘앙스를 살리면서 명령형의 힘을 유지했습니다. '용기를 내십시오'보다 원형의 '강함'을 더 직접 반영합니다.
- source_word: בִּכּוּרֵי עֲנָבִים
  english_pob_choice: the first-ripe grapes
  chosen_korean: 첫 포도송이가 익기 시작하는 철
  alternatives_korean:
  - 첫 익은 포도
  - 초익은 포도송이
  - 첫 열매 포도
  lexicon: HALOT
  rationale: 단순히 열매의 명칭이 아니라 계절 표지를 가리키는 주석적 구문이므로, 한국어에서 자연스러운 시기 표현으로 풀었습니다. 포도의 첫 익음이라는 정보는 유지했습니다.
