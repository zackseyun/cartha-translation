  source_fidelity: 원문의 אֵלֶּה שְׁמוֹת הָאֲנָשִׁים은 앞선 명단을 요약하며 ‘이들은/다음은 … 사람들의 이름입니다’라는 뜻입니다. לָתוּר는 땅을 살피고 정찰·탐사하는 행위를 가리키므로, ‘정탐하도록’도 가능한 번역이지만 현대 한국어에서 첩보 활동의 뉘앙스가 다소 강합니다. ‘살피도록’은 원문의 폭을 보존하면서 문맥상 정찰 목적을 자연스럽게 전달합니다. וַיִּקְרָא는 호세아에게 여호수아라는 이름을 부여한 것을 뜻하며, ‘여호수아라고 불렀습니다’가 충실합니다.
  naturalness: 첫 문장은 ‘이들은 … 이름입니다’보다 ‘다음은 … 이름입니다’가 명단을 마무리하여 소개하는 한국어 문맥에서 더 자연스럽습니다. 둘째 문장은 자연스럽고 합쇼체에 맞습니다. 각주 b의 ‘그 이름을 여호수아로 부릅니다’는 서술 시제와 표현이 어색하므로 본문과 일치하게 고쳤습니다.
  terminology: ‘호세아’, ‘눈’, ‘여호수아’는 한국어 성경 전통과 히브리어 본문에 부합합니다. הָאֲנָשִׁים은 이 문맥에서 남성 대표자들을 가리키지만, 한국어의 ‘사람들’은 해당 명단의 인물들을 자연스럽게 지칭하며 의미를 훼손하지 않습니다. ‘살피도록’에 각주로 ‘정탐하다’와 ‘탐사하다’의 가능한 뉘앙스를 밝혀 원문의 정찰적 의미를 보완했습니다.
