id: NUM.13.16
reference: Numbers 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
  footnotes:
  - marker: a
    text: Or “to spy out the land.” The Hebrew verb can denote exploring or reconnaissance; “to scout out” is chosen for clear modern English.
    reason: lexical_alternative
  - marker: b
    text: Hoshea is the earlier form of Joshua’s name; Moses gives him the name Joshua here.
    reason: cultural_note
  - marker: c
    text: Hoshea may also be spelled “Hosea” in English transliteration.
    reason: alternative_reading
translation:
  language: ko
  text: 다음은 모세가 그 땅을 살피도록 보낸 사람들의 이름입니다[a][b][c]. 모세는 눈의 아들 호세아를 여호수아라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 לָתוּר는 이 문맥에서 땅을 살피고 조사하거나 정찰하는 뜻입니다. ‘정탐하다’ 또는 ‘탐사하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 호세아는 여호수아의 이전 이름입니다. 이 구절에서 모세는 호세아를 여호수아라고 불렀습니다.
    reason: cultural_note
  - marker: c
    text: 호세아는 영어 음역에서 ‘Hosea’로도 적을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  english_pob_choice: These are the names of the men
  chosen_korean: 이들은 ... 사람들의 이름입니다
  alternatives_korean:
  - 이들은 ... 남자들의 이름입니다
  - 이들은 ... 남성들의 이름입니다
  lexicon: HALOT
  rationale: ‘사람들’은 여기서 특정 임무를 받은 대표자들을 자연스럽게 가리키며, 현대 한국어에서 ‘남자들’보다 덜 어색하면서도 성별 정보를 해치지 않습니다.
- source_word: לָתוּר אֶת הָאָרֶץ
  english_pob_choice: to scout out the land
  chosen_korean: 그 땅을 정탐하도록
  alternatives_korean:
  - 그 땅을 살피도록
  - 그 땅을 탐사하도록
  lexicon: HALOT
  rationale: תור는 단순한 관찰보다 정찰·탐색의 성격이 있어 ‘정탐하다’가 원문의 조사 목적을 가장 잘 드러냅니다.
- source_word: וַיִּקְרָא ... יְהוֹשֻׁעַ
  english_pob_choice: And Moses called Hoshea son of Nun Joshua
  chosen_korean: 모세는 ... 호세아를 여호수아라고 불렀습니다
  alternatives_korean:
  - 모세는 ... 호세아의 이름을 여호수아로 바꾸었습니다
  - 모세는 ... 호세아를 여호수아로 이름지었습니다
  lexicon: HALOT
  rationale: קרא는 여기서 새 이름 부여를 뜻하지만, 한국어에서는 ‘이름을 바꾸다’보다 ‘...라고 불렀습니다’가 본문에 더 밀착합니다.
- source_word: לְהוֹשֵׁעַ בִּן נוּן
  english_pob_choice: Hoshea son of Nun
  chosen_korean: 눈의 아들 호세아
  alternatives_korean:
  - 눈의 아들 호세아
  - 누눈의 아들 호세아
  lexicon: HALOT
  rationale: 히브리어 친족관계 표현을 한국어 관용구 ‘눈의 아들’로 옮겨 계보 정보를 간결하게 유지했습니다.
theological_decisions:
- issue: 정탐/스파이 뉘앙스
  chosen_reading: ‘정탐하도록’으로 옮겨 조사·정찰의 기능을 분명히 하되, 불필요하게 도덕적 낙인을 추가하지 않았습니다.
  alternative_readings:
  - ‘스파이하러’
  - ‘탐색하도록’
  rationale: 히브리어 לָתוּר는 여기서 군사적 첩보라기보다 땅을 살피는 임무를 가리키므로, 의미는 살리되 현대어의 과도한 추정을 피했습니다.
  doctrine_reference: 본문 주해/어휘 판단
