reference: Numbers 13:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֡וּ וַ/יָּבֹאוּ֩ אֶל מֹשֶׁ֨ה וְ/אֶֽל אַהֲרֹ֜ן וְ/אֶל כָּל עֲדַ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל אֶל מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁ/ה וַ/יָּשִׁ֨יבוּ אוֹתָ֤/ם דָּבָר֙ וְ/אֶת כָּל הָ֣/עֵדָ֔ה וַ/יַּרְא֖וּ/ם אֶת פְּרִ֥י הָ/אָֽרֶץ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
  footnotes:
  - marker: a
    text: Or 'the congregation of the Israelites.' The Hebrew is literally 'the congregation of the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바란 광야의 가데스에 있는 모세와 아론과 이스라엘 자손의 온 회중에게 가서 이르렀습니다. 그들은 그들에게 그리고 온 회중에게 말을 전하고, 그 땅의 열매를 보여 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  english_pob_choice: They went and came
  chosen_korean: 가서 … 돌아와
  alternatives_korean:
  - 갔다가 왔습니다
  - 가서 왔습니다
  lexicon: HALOT
  rationale: 연속된 두 동사를 한국어의 자연스러운 왕복 동작으로 옮겨, 이동과 도착의 순서를 살렸습니다.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 백성의 온 회중
  - 이스라엘 사람들의 온 회중
  lexicon: HALOT
  rationale: עֲדָה의 ‘회중’과 ‘이스라엘 자손’의 문법적 연결을 함께 드러내기 위해 직역에 가까운 표현을 유지했습니다.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  english_pob_choice: They brought back word to them
  chosen_korean: 그들에게 말을 전하고
  alternatives_korean:
  - 그들에게 보고하고
  - 그들에게 소식을 전하고
  lexicon: HALOT
  rationale: דָּבָר를 단순히 ‘말’이 아니라 공식적인 전달 내용으로 이해하여, 보고의 뉘앙스를 과장하지 않으면서 자연스럽게 옮겼습니다.
- source_word: פְּרִי הָאָרֶץ
  english_pob_choice: the fruit of the land
  chosen_korean: 그 땅의 열매
  alternatives_korean:
  - 그 땅의 소산
  - 그 땅의 산물
  lexicon: HALOT
  rationale: 직역인 ‘열매’를 유지해 정탐꾼들이 실제로 보여 준 산출물의 구체성을 살렸습니다.
theological_decisions:
- issue: ‘회중’과 ‘자손’의 병렬 보존
  chosen_reading: ‘이스라엘 자손의 온 회중’으로 옮겨 집합명사와 혈통/계보 표현을 함께 유지했습니다.
  alternative_readings:
  - ‘이스라엘 백성 전체’로 완화
  - ‘이스라엘 사람들의 모임’으로 일반화
  rationale: 본문은 단순한 군중이 아니라 언약 공동체 전체를 가리키므로, 전통적 교회용어로 평탄화하지 않고 원문 구조를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 언약 공동체와 회중 표상
- issue: ‘가데스’의 위치 표현
  chosen_reading: ‘바란 광야의 가데스에서’로 문맥상 귀환 지점이 드러나도록 했습니다.
  alternative_readings:
  - ‘바란 광야, 가데스에’
  - ‘바란 광야의 가데스로’
  rationale: 히브리어의 방향형을 한국어에서는 출발·도착의 결과가 분명한 위치 표현으로 자연화하되, 지명 사이의 관계는 유지했습니다.
  doctrine_reference: 지명·서사 흐름
