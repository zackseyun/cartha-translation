base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
  footnotes:
  - marker: a
    text: Or 'is a festival.' The Hebrew חָג can denote a sacred festival observance as well as a feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이 달 열다섯째 날에는 절기[a]가 있습니다. 칠 일 동안은 무교병을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘축제입니다.’ 히브리어 חָג는 절기 또는 축제를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם
  english_pob_choice: And on the fifteenth day
  chosen_korean: 이 달의 열다섯째 날에는
  alternatives_korean:
  - 열다섯째 날에는
  - 이 달의 열다섯 날에는
  lexicon: HALOT
  rationale: 달력 절기 문맥이므로 ‘열다섯째 날’로 자연스럽게 옮기되, 뒤의 לַחֹדֶשׁ הַזֶּה를 반영해 ‘이 달의’로 분명히 했습니다.
- source_word: לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה
  english_pob_choice: of this month
  chosen_korean: 이 달의
  alternatives_korean:
  - 이 초하루의
  - 이 달의 절기의
  lexicon: HALOT
  rationale: חֹדֶשׁ은 여기서 달력상의 ‘달’이 자연스럽고, ‘이 달의’가 문맥상 가장 간명합니다.
- source_word: חָ֑ג
  english_pob_choice: is a feast
  chosen_korean: 절기가 있습니다
  alternatives_korean:
  - 절기가 있습니다
  - 축제가 있습니다
  - 절기입니다
  lexicon: HALOT
  rationale: חָג는 단순한 음식 잔치보다 거룩한 절기/축제 준수를 가리킬 수 있으므로, 의미 범위를 살려 ‘절기’로 옮겼습니다. 주어-서술 구조를 한국어답게 하기 위해 ‘있습니다’를 보탰습니다.
- source_word: מַצּ֖וֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 떡
  - 무효병
  lexicon: HALOT
  rationale: 절기 명칭으로 굳어진 성경 용어의 전달력을 고려해 ‘무교병’을 선택했습니다. 필요하면 본문 주석에서 ‘누룩 없는 빵’의 뜻을 설명할 수 있습니다.
- source_word: יֵאָכֵֽל
  english_pob_choice: shall be eaten
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹게 될 것입니다
  - 먹어야 합니다
  lexicon: HALOT
  rationale: 히브리어 수동형 명령/규정은 한국어에서 규범적 의무를 드러내는 ‘먹어야 합니다’가 가장 자연스럽고, 절기 규례의 성격도 잘 나타냅니다.
theological_decisions:
- issue: חָג의 의미 범위
  chosen_reading: ‘절기’로 번역해 단순한 식사 행사가 아니라 여호와께 드리는 거룩한 기념일 규례임을 드러냈습니다.
  alternative_readings:
  - ‘잔치’로 좁게 이해
  - ‘축제’로 일반화
  rationale: 문맥은 출애굽기적 절기 규정이며, English POB도 각주로 ‘festival’ 가능성을 인정합니다. 한국어 본문에서는 ‘절기’가 가장 균형 잡힌 대응입니다.
  doctrine_reference: 율법/절기 규례
