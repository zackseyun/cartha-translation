  text: Besides the morning burnt offering[a], which is for the regular burnt offering, you shall offer these.
  footnotes:
  - marker: a
    text: Or 'in addition to the continual burnt offering'; the Hebrew relation between 'the morning burnt offering' and 'the regular burnt offering' can be taken slightly differently, though the overall instruction is that these sacrifices are offered besides the standing daily offering.
