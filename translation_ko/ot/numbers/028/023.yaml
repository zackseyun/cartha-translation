base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: Besides the morning burnt offering[a], which is for the regular burnt offering, you shall offer these.
  footnotes:
  - marker: a
    text: Or 'in addition to the continual burnt offering'; the Hebrew relation between 'the morning burnt offering' and 'the regular burnt offering' can be taken slightly differently, though the overall instruction is that these sacrifices are offered besides the standing daily offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침 번제 외에, 곧 정기 번제를 위한 것이니 너희는 이것들을 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속 드리는 번제에 더하여’로 옮길 수 있습니다. 히브리어는 ‘아침 번제’와 ‘정기 번제’의 관계를 약간 다르게 이해할 여지가 있지만, 전체 뜻은 매일 드리는 상설 번제 외에 이 제물들을 드리라는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  english_pob_choice: Besides
  chosen_korean: 외에
  alternatives_korean:
  - 뿐 아니라
  - 더하여
  - 말고도
  lexicon: HALOT
  rationale: 추가 관계를 간결하게 드러내는 말로, 제의 지시문에 자연스럽고 원문의 배제/추가 뉘앙스를 보존합니다.
- source_word: עֹלַת הַבֹּקֶר
  english_pob_choice: the morning burnt offering
  chosen_korean: 아침 번제
