    text: 또는 ‘계속 드리는 번제에 더하여’로 옮길 수 있습니다. 히브리어는 ‘아침 번제’와 ‘정기 번제’의 관계를 약간 다르게 이해할 여지가 있지만, 전체 뜻은 정기적으로 드리는 번제에 더하여 이 제물들을 드리라는 것입니다.
    reason: lexical_alternative
