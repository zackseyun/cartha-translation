  lexicon: HALOT
  rationale: 번제는 통용되는 제의 용어를 유지하고, הַבֹּקֶר은 한국어에서 자연스러운 ‘아침’으로 옮겨 시간표지를 분명히 했습니다.
- source_word: לְעֹלַת הַתָּמִיד
  english_pob_choice: is for the regular burnt offering
  chosen_korean: 정기 번제를 위한 것이니
  alternatives_korean:
  - 계속 드리는 번제를 위한 것이니
  - 항상 드리는 번제를 위한 것이니
  - 상번제를 위한 것이니
  lexicon: HALOT
  rationale: תָּמִיד의 지속/상례적 의미를 ‘정기’로 풀어, 전통적이지만 덜 투명한 ‘상번제’보다 본문 관계를 더 직접적으로 드러냈습니다.
- source_word: תַּעֲשׂוּ אֶת אֵלֶּה
  english_pob_choice: you shall offer these
  chosen_korean: 너희는 이것들을 드려야 합니다
  alternatives_korean:
  - 너희는 이것들을 행해야 합니다
  - 너희는 이것들을 드려야 하니
  - 너희는 이것들을 해야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 ‘드리다/행하다’로 기능하므로, 한국어에서도 제사 행위를 직접 지시하는 동사로 옮겼습니다.
theological_decisions:
- issue: 번제 용어의 제의적 구체성
  chosen_reading: ‘번제’로 유지해 제의 규례의 특정 희생을 분명히 했습니다.
  alternative_readings:
  - ‘불살라 드리는 제물’로 풀어 쓰기
  - ‘화제’로 번역하기
  rationale: 본문은 일반적 희생이 아니라 규정된 עולה를 말하므로, 성경적 제의 용어를 유지하는 편이 원문의 규범성을 더 잘 보존합니다.
  doctrine_reference: 민수기 28장 제사 규례
