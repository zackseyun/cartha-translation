  lexicon: HALOT
  rationale: סֹלֶת은 제의용으로 곱게 간 밀가루를 가리키므로, 현대 한국어에서 자연스럽고 정확한 ‘고운 가루’로 옮겼습니다.
- source_word: בְּלוּלָה בַשָּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞은
  alternatives_korean:
  - 기름과 섞은
  - 기름에 버무린
  lexicon: HALOT
  rationale: 수동분사 בלולה의 상태를 반영해 ‘기름에 섞은’으로 옮겨, 제물의 준비 상태를 직접적으로 드러냈습니다.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / וּשְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: three-tenths / two-tenths
  chosen_korean: 삼 십분의 일 / 이 십분의 일
  alternatives_korean:
  - 세 십분의 일 / 두 십분의 일
  - 에바의 십분의 셋 / 십분의 둘
  lexicon: HALOT
  rationale: 제의 규정의 관용적 수량 표현을 직역적으로 유지해, 본문의 측정 단위를 독자가 그대로 인지하도록 했습니다.
theological_decisions:
- issue: 제물 규정의 명령형 어조
  chosen_reading: ‘준비해야 합니다’로 의무성을 살리되, 한국어 합쇼체로 제의 지시문의 공적·규범적 어조를 유지했습니다.
  alternative_readings:
  - ‘드려야 합니다’
  - ‘만들어야 합니다’
  rationale: תַּעֲשׂוּ는 단순 제작보다 예배 규정에 따른 준비/구성을 뜻하므로, 제의 문맥에 맞는 ‘준비해야 합니다’가 의미를 가장 잘 전달합니다.
  doctrine_reference: 민수기 28장의 제사 규정
