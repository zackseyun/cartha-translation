  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
  footnotes:
  - marker: a
    text: Hebrew 'three-tenths' and 'two-tenths' abbreviate tenths of an ephah, a dry measure used in sacrificial regulations.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 곡식제물은 기름을 섞은 고운 가루로 하며, 수소에는 십분의 삼[a], 숫양에는 십분의 이를 준비해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘십분의 삼’과 ‘십분의 이’는 제의 규정에서 쓰이는 건량 단위인 에바의 십분의 일을 기준으로 한 분량을 줄여 쓴 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  english_pob_choice: And their grain offering
  chosen_korean: 그들의 곡식제물
  alternatives_korean:
  - 그들의 제물
  - 그들의 소제물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 일반적인 ‘제물’보다 곡물 제사인 ‘곡식제물’이 원문 의미를 더 분명히 드러냅니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 가는 밀가루
