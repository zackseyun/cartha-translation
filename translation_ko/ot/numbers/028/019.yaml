  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
  footnotes:
  - marker: a
    text: Or 'an offering by fire.' The Hebrew term is a technical sacrificial word for an offering consumed in fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 화제[a], 곧 번제를 드려야 합니다. 곧 수송아지 두 마리와 숫양 한 마리와 일 년 된 어린 숫양 일곱 마리입니다. 이들은 너희에게 흠이 없어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
