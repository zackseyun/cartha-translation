  rationale: כְבָשִׂים는 제사용 수컷 어린 양을 가리키므로 ‘숫양새끼’로 옮겨 성별 정보를 유지했습니다. בְּנֵי שָׁנָה는 ‘일 년 된’으로 자연스럽고 명료하게 반영했습니다.
