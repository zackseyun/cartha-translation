base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
  footnotes:
  - marker: a
    text: Or 'an offering by fire.' The Hebrew term is a technical sacrificial word for an offering consumed in fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 번제와 함께 화제물을 드려야 합니다. 곧 소 떼의 수송아지 둘, 숫양 하나, 그리고 일 년 된 숫양새끼 일곱이니, 그것들은 너희에게 흠 없는 것이어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִשֶּׁה는 문자적으로는 ‘불로 드리는 제물’이라는 뜻의 제의 기술어입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 הִקְרִיב은 단순히 가져오는 행위가 아니라 제물로 ‘드리는’ 행위를 뜻하므로, 한국어로도 예배·제사 행위를 분명히 살렸습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불 제물
  lexicon: HALOT
  rationale: 히브리어의 제사 기술어를 살리기 위해 POB의 ‘offering by fire’에 해당하는 뜻을 압축적으로 옮겼습니다. ‘화제물’은 불로 태워 드리는 제물이라는 기술적 의미를 비교적 직접적으로 드러냅니다.
- source_word: לַֽיהוָ֔ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 따라 POB의 Yahweh를 ‘야훼’로 옮겼습니다. 제물의 방향성을 나타내는 לְ는 조사 ‘께’로 자연스럽게 반영했습니다.
- source_word: פָּרִ֧ים בְּנֵי בָקָ֛ר
  english_pob_choice: two bulls
  chosen_korean: 소 떼의 수송아지 둘
  alternatives_korean:
  - 수송아지 둘
  - 소에서 난 수송아지 둘
  - 어린 수소 둘
  lexicon: HALOT
  rationale: 직역하면 ‘소의 아들들’이지만 제사 목록의 관용 표현이므로, POB가 반영한 herd sense를 살려 ‘소 떼의 수송아지’로 옮겼습니다. 이는 단순한 ‘송아지’보다 제사에 드리는 수컷 어린 소를 더 정확히 드러냅니다.
- source_word: וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה
  english_pob_choice: and seven male lambs a year old
  chosen_korean: 그리고 일 년 된 숫양새끼 일곱
  alternatives_korean:
  - 그리고 일 년 된 숫양새끼 일곱 마리
  - 그리고 한 살 된 숫양새끼 일곱
  - 그리고 일 년 된 어린 숫양 일곱
  lexicon: HALOT
  rationale: כְבָשִׂים는 제사용 수컷 어린 양을 가리키므로 ‘숫양새끼’로 옮겨 성별 정보를 유지했습니다. בְּנֵי שָׁנָה는 ‘일 년 된’으로 자연스럽고 명료하게 반영했습니다.
- source_word: תְּמִימִ֖ם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것이어야 합니다
  alternatives_korean:
  - 흠이 없어야 합니다
  - 온전해야 합니다
  lexicon: HALOT
  rationale: 제사 제물의 결격 조건을 나타내는 관용 표현이므로, 표준적인 제의 용어인 ‘흠 없는’으로 옮겼습니다. ‘것이어야 합니다’는 뒤의 복수 제물을 포괄하는 한국어 술어 맞춤을 위한 처리입니다.
