translation:
  language: ko
  text: 첫째 날에는 거룩한 성회가 있어야 하며, 수고하는 노동은 해서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  english_pob_choice: On the first day
  chosen_korean: 첫째 날에는
  alternatives_korean:
  - 첫날에는
  - 첫째 날에
  lexicon: HALOT
  rationale: 절기 문맥을 덧붙이지 않고, 지시된 첫째 날이라는 시간 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 모임
  - 성스러운 회집
  lexicon: HALOT
  rationale: 공적으로 소집된 예배적 집회를 가리키는 고정 표현이므로, 소집의 뉘앙스를 살리면서도 한국어 성경 용례에 익숙한 ‘성회’를 택했습니다.
- source_word: מְלֶאכֶת עֲבֹדָה
  english_pob_choice: laborious work
  chosen_korean: 수고하는 노동
  alternatives_korean:
  - 일상적인 노동
  - 생업 노동
  - 노역성 일
  lexicon: HALOT
  rationale: 단순히 모든 일을 금지하는 뜻이 아니라, 일상적 생업/노무 성격의 일을 가리키므로 그 구분을 드러내는 표현으로 옮겼습니다.
- source_word: לֹא תַעֲשׂוּ
  english_pob_choice: you shall do no
  chosen_korean: 해서는 안 됩니다
  alternatives_korean:
  - 하지 말아야 합니다
  - 해서는 안 됩니다
  lexicon: HALOT
  rationale: 공동체 전체에 대한 금지 명령을 현대 한국어 법령체에 가까운 정중한 금지 표현으로 재현했습니다.
theological_decisions:
- issue: 거룩한 성회의 성격
  chosen_reading: 이 절은 단순한 휴무일이 아니라 야훼 앞에 소집되는 예배적 집회를 말하는 것으로 읽었습니다.
  alternative_readings:
  - 그저 특별한 휴일로만 읽을 수 있습니다.
  - 일반적인 종교 모임으로 약화시킬 수 있습니다.
  rationale: מִקְרָא קֹדֶשׁ의 소집성과 성별성을 함께 보존해야 본문의 제의적 성격이 유지됩니다.
  doctrine_reference: 제의법/예배 공동체의 거룩성
