lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 서술 공식인 ‘and he spoke’를 한국어 성경 문체에 자연스럽게 옮기되, 뒤의 לֵאמֹר와 함께 이어지는 직접화법 도입을 살리기 위해 ‘말씀하여 이르셨습니다’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름(테트라그람마톤)을 호칭이 아닌 고유명으로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 한테
  lexicon: HALOT
  rationale: מֹשֶׁה 앞의 방향·대상을 나타내는 전치사는 현대 한국어에서 가장 자연스러운 조사 ‘에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 인용 도입 관용구를 한국어에서 중복되지 않게 풀어, 앞의 ‘말씀하여’와 합쳐 직접화법을 예고하는 자연스러운 성경 문체로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 고유 이름을 사용하므로, 관용적 대체어 ‘주’보다 이름 자체를 드러내는 ‘야훼’가 원문 의도를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
