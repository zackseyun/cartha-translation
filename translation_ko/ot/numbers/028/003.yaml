  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
  footnotes:
  - marker: a
    text: Or, “the offering by fire” or “the fire offering.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에게 이렇게 말하십시오. ‘이것은 여러분이 야훼께 드려야 할 화제입니다. 곧 흠 없는, 한 살 난 숫양 두 마리를 날마다 드려 번제물로 삼으십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’, 혹은 ‘불제물’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לָהֶם
  english_pob_choice: And you shall say to them
  chosen_korean: 그리고 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그리고 그들에게 말하십시오
  - 그들에게 이렇게 말씀하십시오
  lexicon: BDB / HALOT
  rationale: 직접 명령형의 전달문 구조를 살리면서, 한국어에서는 자연스럽고 공손한 합쇼체로 옮겼습니다.
- source_word: הָאִשֶּׁה
  english_pob_choice: the food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불제물
  - 불로 드리는 제물
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘불로 드리는 제물’의 뜻을 가진 용어이므로, 전통적이면서도 원어의 제의적 의미를 드러내는 ‘화제’를 사용했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: SBLGNT/WLC consistent POB terminology
  rationale: 원문이 여호와 신명을 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 유지해 언약적 고유명을 분명히 했습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה תְמִימִם
  english_pob_choice: two male lambs a year old, without blemish
  chosen_korean: 흠 없는, 한 살 난 숫양 두 마리
  alternatives_korean:
  - 흠 없는 한 살 난 숫양 두 마리
  - 완전한 한 살 난 어린 숫양 두 마리
  lexicon: HALOT
  rationale: כְּבָשִׂים은 숫양이 아니라 ‘어린 양’이지만, 보조 문맥상 제물의 성별과 연령을 분명히 하기 위해 ‘숫양’으로 읽기보다 제사 동물의 일반 명칭인 ‘어린 숫양’ 계열을 고려할 수 있었으나, 원문의 기본 의미를 우선해 ‘숫양’으로는 옮기지 않았습니다. 실제로는 ‘양’보다 제의적 구체성을 살린 ‘어린 숫양’ 대신, 성별은 본문이 암시하는 남성형을 반영하고 ‘한 살 난’과 ‘흠 없는’으로 제의적 조건을 살렸습니다.
- source_word: לַיּוֹם
  english_pob_choice: each day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 각 날마다
  lexicon: HALOT
  rationale: 분배적 의미를 가진 표현이므로, 한국어에서 자연스러운 반복 규정을 나타내는 ‘날마다’로 옮겼습니다.
- source_word: עֹלָה תָמִיד
  english_pob_choice: a regular burnt offering
  chosen_korean: 번제물로 삼으십시오
  alternatives_korean:
  - 지속되는 번제물로 삼으십시오
  - 정규 번제물로 드리십시오
  lexicon: HALOT
  rationale: עֹלָה는 표준 제사 용어인 ‘번제물’로, תָמִיד은 일정한 규례에 따른 계속적 제사를 가리켜 문맥상 명사구를 풀어 ‘번제물로 삼으십시오’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 여호와 신명의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명을 사용하므로, 고유한 언약 이름을 가리는 일반 호칭보다 ‘야훼’를 유지하는 것이 원문 감각에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 화제(הָאִשֶּׁה)의 제의적 의미
  chosen_reading: ‘음식’이 아니라 제사 불로 드리는 제물로 이해하여 ‘화제’로 번역
  alternative_readings:
  - 음식제물
  - 불로 드리는 제물
  rationale: 문맥상 하나님이 먹는 음식이 아니라, 불로 바쳐지는 제사 행위를 뜻하므로 제의적 의미를 해치지 않는 용어를 선택했습니다.
  doctrine_reference: Pentateuch sacrificial terminology consistency
