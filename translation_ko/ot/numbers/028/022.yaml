  source_fidelity: 수정이 필요합니다. 초안은 숫염소, 속죄 제물, 수량, 그리고 수혜자 의미를 대체로 반영하지만, ‘그것은 여러분을 위해 속죄하게 할 것입니다’는 원문의 목적 부정사 לְכַפֵּר를 부자연스러운 미래 서술로 바꾸고, 무엇이 ‘속죄하게’ 하는지 불명확하게 만듭니다. 제의 규정 문맥에 따라 목적 표현으로 옮기는 편이 충실합니다.
  naturalness: ‘속죄를 위한 숫염소 한 마리’도 이해되지만 חַטָּאת가 제물의 종류임을 더 명확히 하려면 ‘숫염소 한 마리를 속죄제물로’가 자연스럽습니다. 또한 ‘속죄하기 위해’로 목적을 직접 표현하면 현대 표준 한국어 합쇼체의 지시 문장으로 매끄럽습니다.
  terminology: שְׂעִיר은 ‘숫염소’, חַטָּאת는 본문에서 ‘속죄제물’, כפר는 ‘속죄하다’로 옮길 수 있습니다. 각주의 ‘히브리어 כאן’은 원어 표기가 아니라 히브리어로 ‘여기’를 뜻하는 말이므로, 논의 대상인 חַטָּאת로 바로잡아야 합니다. ‘정결 제물’이라는 대안은 각주에 유지할 수 있습니다.
