  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
  footnotes:
  - marker: a
    text: Or 'for purification from sin.' The Hebrew term translated 'sin offering' can, in sacrificial contexts, also be understood as 'purification offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 속죄를 위한 숫염소 한 마리를 드리십시오. 그것은 여러분을 위해 속죄하게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결을 위한 제물’로 옮길 수 있습니다. 히브리어 כאן의 제의 용어는 문맥에 따라 ‘속죄 제물’ 또는 ‘정결 제물’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִ֥יר
  english_pob_choice: and one male goat
  chosen_korean: 숫염소 한 마리
  alternatives_korean:
  - 염소 한 마리
  - 수염소 한 마리
  lexicon: HALOT
  rationale: שָׂעִיר은 수염소, 곧 숫염소를 가리키므로 종별을 드러냈습니다. 한국어에서는 ‘한 마리’를 수량 표현으로 자연스럽게 붙였습니다.
- source_word: חַטָּ֖את
  english_pob_choice: sin offering
  chosen_korean: 속죄 제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 죄를 위한 제물
  lexicon: HALOT
  rationale: 제의 문맥에서 חַטָּאת는 단순한 ‘죄’가 아니라 죄를 다루는 제사를 가리킬 수 있어, 본문 기능을 드러내는 ‘속죄 제물’을 택했습니다. 영어 POB의 각주처럼 ‘정결 제물’ 가능성은 남아 있지만, 본문에서는 제의적 표준 의미를 살렸습니다.
- source_word: לְ/כַפֵּ֖ר
  english_pob_choice: to make atonement
  chosen_korean: 속죄하게 할 것입니다
  alternatives_korean:
  - 속죄할 것입니다
  - 속죄를 이루게 할 것입니다
  lexicon: HALOT
  rationale: כפר는 제의적 맥락에서 ‘속죄하다/속죄하게 하다’가 가장 직접적이므로, 문장 전체가 목적을 나타내도록 구성했습니다.
- source_word: עֲלֵי/כֶֽם
  english_pob_choice: for you
  chosen_korean: 여러분을 위해
  alternatives_korean:
  - 여러분을 위하여
  - 여러분 대신
  lexicon: HALOT
  rationale: עַל + 대명사 접미사는 이 문맥에서 수혜자/대상적 의미를 가지므로, 현대 한국어에서 자연스러운 ‘여러분을 위해’로 옮겼습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: ‘속죄 제물’로 번역하되, 본문의 제의적 기능을 그대로 유지했습니다.
  alternative_readings:
  - ‘정결 제물’
  - ‘죄를 위한 제물’
  rationale: 히브리어 용례상 חַטָּאת는 제의 문맥에서 정결과 속죄의 기능을 함께 가리킬 수 있습니다. 본문이 제사의 규정이므로 의미를 과도하게 한쪽으로 고정하지 않으면서도, 독자가 제의 행위의 핵심을 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
