  to: 여러분을 위하여 속죄하기 위해 숫염소 한 마리를 속죄제물[a]로 바치십시오.
  rationale: 원문의 제의 명사구 ‘숫염소 한 마리, 속죄제물’과 목적 부정사 ‘여러분을 위하여 속죄하기 위해’를 한국어 제의 지시 문장으로 재구성했습니다. 이로써 명시되지 않은 동사는 문맥상 필요한 ‘바치십시오’로 보충하되, 속죄의 방식이나 신학적 기제를 추가하지 않았습니다. 각주는 חַטָּאת의 실제 원어 표기와 정결 제물이라는 학술적 대안을 정확히 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:12Z'
