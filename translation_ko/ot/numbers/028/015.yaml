source:
  edition: WLC
  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
  footnotes:
  - marker: a
    text: Or 'for a purification offering.' The Hebrew term חַטָּאת can denote the offering that deals with impurity as well as sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼께 드릴 속죄제의 숫염소 한 마리는 늘 드리는 번제와 그 전제 위에 드려져야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת는 죄를 다루는 제물뿐 아니라 부정을 정결하게 하는 제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  english_pob_choice: male goat
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소 한 마리
  - 수염소
  - 염소 수컷
  lexicon: HALOT
  rationale: 제사 문맥에서 성별이 분명한 염소를 가리키므로, 자연스러우면서도 성별 정보를 보존하는 ‘숫염소’로 옮겼습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제의
  alternatives_korean:
  - 속죄제로 드릴
  - 죄를 위한
  - 정결제의
  lexicon: HALOT
  rationale: 제의 용어로서 חַטָּאת는 문맥상 속죄제/정결제 양면성을 지니지만, 한국어 본문에서는 제사 항목을 분명히 드러내는 ‘속죄제’가 가장 직접적입니다.
- source_word: עַל עֹלַת הַתָּמִיד
  english_pob_choice: besides the regular burnt offering
  chosen_korean: 늘 드리는 번제 위에
  alternatives_korean:
  - 정규 번제 외에
  - 항상 드리는 번제 곁에
  - 상번제 위에
  lexicon: HALOT
  rationale: עַל은 이 문맥에서 단순한 위치가 아니라 제의적 추가를 나타내므로, 기존 번제에 ‘위에/더하여’라는 관계를 살린 표현을 택했습니다.
- source_word: וְנִסְכּוֹ
  english_pob_choice: and its drink offering
  chosen_korean: 그 전제
  alternatives_korean:
  - 그 술제물
  - 그 관제
  - 그 바침주
  lexicon: HALOT
  rationale: נֶסֶךְ는 붓는 제물을 가리키는 표준 제의어이므로, 한국어 성경 전통과 의미를 함께 살리는 ‘전제’를 사용했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기는 고유한 언약 이름이므로, POB 기준에 따라 ‘야훼’로 음역하여 본문에서 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 죄제
  rationale: 이 절은 제사 규례 목록의 한 항목이므로, 의미의 긴장을 보존하되 한국어 독자에게 가장 분명한 기본 용례인 ‘속죄제’를 본문에 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
