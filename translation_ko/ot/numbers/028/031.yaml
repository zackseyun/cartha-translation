source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering' or 'the daily burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'they shall be for you unblemished,' meaning the animals presented are to be without defect.
    reason: lexical_alternative
  - marker: c
    text: Or 'their libations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 상시 드리는 번제와 그 소제 외에도, 너희는 그것들을 드려야 합니다. 그것들은 흠 없는 것이어야 하며, 그 전제도 함께 드려야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상시 드리는 번제’ 혹은 ‘매일 드리는 번제’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그것들은 너희에게 흠 없는 것이 될 것이다’의 뜻으로, 드려지는 동물들이 결함이 없어야 함을 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 전제들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  english_pob_choice: Besides
  chosen_korean: 외에도
  alternatives_korean:
  - 뿐만 아니라
  - 더하여
  - 별도로
  lexicon: HALOT
  rationale: 상시 드리는 제사에 추가되는 항목이라는 뜻을 자연스럽게 살리면서, 제의 문맥의 구분도 유지합니다.
- source_word: עֹלַת הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 상시 드리는 번제
  alternatives_korean:
  - 항상 드리는 번제
  - 계속 드리는 번제
  - 정규 번제
  lexicon: HALOT
  rationale: תָּמִיד의 반복·지속성을 현대 한국어로 옮기기 위해 ‘상시 드리는’으로 처리했고, 제의 용어는 ‘번제’를 유지했습니다.
- source_word: וּמִנְחָתוֹ
  english_pob_choice: and its grain offering
  chosen_korean: 그 소제
  alternatives_korean:
  - 그 곡식제물
  - 그 곡식 예물
  - 그 소제물
  lexicon: HALOT
  rationale: 민하를 제의 맥락에서 표준적으로 ‘소제’로 옮기되, 대명사 ‘그’로 번제에 속한 부속 제물임을 분명히 했습니다.
- source_word: תְּמִמִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 결점 없는
  - 온전한
  - 완전한
  lexicon: HALOT
  rationale: 제사 규정에서 동물의 결함 없음이라는 기술적 의미를 가장 분명하게 드러내는 표현입니다.
- source_word: וְנִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그 전제
  alternatives_korean:
  - 그 술제물
  - 그 부어 드리는 제물
  - 그 제전
  lexicon: HALOT
  rationale: נֶסֶךְ의 ‘붓는 제물’이라는 제의적 성격을 한국어 제의 용어 ‘전제’로 살렸습니다.
theological_decisions:
- issue: 제사 지시문의 명령형 뉘앙스
  chosen_reading: ‘you shall prepare’를 단순한 예비가 아니라 제물 드림의 실행 지시로 이해해 ‘드려야 합니다’로 옮겼습니다.
  alternative_readings:
  - 준비해야 합니다
  - 마련해야 합니다
  - 바쳐야 합니다
  rationale: עשה가 제의 문맥에서 제물을 ‘행하다/드리다’의 의미를 띠므로, 한국어에서는 제사 수행의 명령성을 드러내는 쪽이 원문의 기능을 더 잘 보존합니다.
  doctrine_reference: 민수기 제의 규정의 수행적 명령성
- issue: ‘그것들은 흠 없는 것이어야 하며’의 주어 범위
  chosen_reading: 동물 제물과 전제를 구분해, 흠 없음은 제물의 자격에 해당하는 것으로 읽었습니다.
  alternative_readings:
  - 전제까지 포함해 흠 없다고 읽기
  - 앞의 제사 전체를 가리키는 포괄적 표현으로 읽기
  rationale: 히브리어의 תְּמִמִם은 제의적으로 결함 없는 제물에 적용되는 속성이므로, 대상 범위를 분명히 하는 것이 문맥에 맞습니다.
  doctrine_reference: 제사 예물의 무흠성
