source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering' or 'the daily burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'they shall be for you unblemished,' meaning the animals presented are to be without defect.
    reason: lexical_alternative
  - marker: c
    text: Or 'their libations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 상시 번제[a]와 그 소제 외에, 너희는 그것들을 드려야 합니다. 그것들은 너희가 드릴 흠 없는[b] 것이어야 하며, 그에 딸린 전제들[c]도 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속 드리는 번제’ 또는 ‘매일 드리는 번제’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그것들은 너희에게 흠 없는 것이 될 것이다’입니다. 이는 너희가 드릴 동물 제물들이 결함이 없어야 함을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부어 드리는 제물들’입니다.
    reason: lexical_alternative
