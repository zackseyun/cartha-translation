translation:
  language: ko
  text: 너희는 야훼께 향기로운 냄새가 되게[a] 번제물을 바쳐야 합니다. 곧 소 떼의 수송아지 두 마리와 숫양 한 마리와 한 살 된 수컷 어린양 일곱 마리입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진정시키는 향기가 되게’. 히브리어 제의 관용구 לְרֵיחַ נִיחֹחַ는 ‘기쁘게 받으시는 향기가 되게’ 또는 ‘진정시키는 향기가 되게’로도 옮길 수 있습니다.
    reason: lexical_alternative
