source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
  footnotes:
  - marker: a
    text: Or 'for a soothing aroma.' The Hebrew sacrificial formula לְרֵיחַ נִיחֹחַ can also be rendered 'for a pleasing/soothing aroma.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 향기로운 번제물로 바쳐야 합니다. 곧 소 떼의 수송아지 두 마리와 숫양 한 마리, 그리고 일 년 된 숫양새끼 일곱 마리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진정시키는 향기’로도 옮길 수 있습니다. 히브리어 제의 관용구 לְרֵיחַ נִיחֹחַ는 ‘기쁘게 받으시는/진정시키는 향기’로도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 바쳐야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 제시해야 합니다
  - 가져와야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 ‘가까이 가져와 바치다/드리다’의 의미를 살려, 자연스러운 예배 한국어인 ‘바치다’를 택했습니다.
- source_word: עוֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전번제
  - 올라가는 제물
  lexicon: HALOT
  rationale: 히브리어 제의 용어를 한국어 성경에서 널리 쓰는 ‘번제’ 계열로 옮기되, 문장 흐름상 ‘번제물’이 가장 자연스럽습니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: as a pleasing aroma
  chosen_korean: 향기로운
  alternatives_korean:
  - 기쁘게 받으실
  - 향기로운 냄새의
  - 즐거운 향기를 드리는
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 제물이 하나님께 받아들여지는 관용구임을 드러내기 위해 ‘향기로운’으로 처리했습니다.
- source_word: פָּרִים בְּנֵי בָקָר
  english_pob_choice: two bulls from the herd
  chosen_korean: 소 떼의 수송아지 두 마리
  alternatives_korean:
  - 소 떼의 황소 두 마리
  - 소의 수송아지 두 마리
  - 어린 수소 두 마리
  lexicon: HALOT
  rationale: ‘בְּנֵי בָקָר’의 가축 출신을 반영하면서 제물로서의 연령·성별도 드러내기 위해 ‘수송아지’와 ‘소 떼의’의 결합을 사용했습니다.
- source_word: שִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: seven male lambs a year old
  chosen_korean: 일 년 된 숫양새끼 일곱 마리
  alternatives_korean:
  - 일 년 된 숫양새끼 일곱 마리
  - 한 살 된 숫양새끼 일곱 마리
  - 첫해의 숫양새끼 일곱 마리
  lexicon: HALOT
  rationale: כְבָשִׂים은 어린 양 제물을 가리키므로 ‘숫양새끼’로 성별을 살리고, בְּנֵי שָׁנָה는 제물의 연령 관용구로 ‘일 년 된’으로 옮겼습니다.
