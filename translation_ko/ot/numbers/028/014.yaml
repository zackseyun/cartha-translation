source:
  edition: WLC
  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
  footnotes:
  - marker: a
    text: Or, 'This is the burnt offering of the new moon in its month, for the months of the year.' The Hebrew word חֹדֶשׁ can denote either 'month' or 'new moon'; here the main text renders the recurring monthly sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 전제물은 포도주이며, 소에게는 한 힌의 절반, 숫양에게는 한 힌의 삼분의 일, 어린양에게는 한 힌의 사분의 일입니다. 이것은 해의 여러 달 동안 각 달에 드리는 월별 번제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것은 해의 여러 달을 위하여 그 달에 드리는 새달의 번제입니다.’ 히브리어 חֹדֶשׁ는 ‘달’ 또는 ‘새달’을 뜻할 수 있습니다. 본문은 반복되는 월별 의미를 따라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제물
  alternatives_korean:
  - 그들의 음료제물
  - 그들의 붓는 제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 부어 드리는 제물로, 제사 문맥에서는 전통적 교회어보다 직접적인 ‘전제물’이 स्रोत-투명성을 더 잘 살립니다.
- source_word: חֲצִי הַהִין / שְׁלִישִׁת הַהִין / רְבִיעִת הַהִין
  english_pob_choice: half a hin / a third of a hin / a fourth of a hin
  chosen_korean: 한 힌의 절반 / 한 힌의 삼분의 일 / 한 힌의 사분의 일
  alternatives_korean:
  - 반 힌
  - 힌의 절반
  - 한 힌의 1/3
  - 한 힌의 1/4
  lexicon: HALOT
  rationale: 고대 도량형을 그대로 보존해 원문의 측량 감각을 유지하고, 분수 표현은 한국어에서 가장 자연스러운 ‘~의 절반/삼분의 일/사분의 일’로 옮겼습니다.
- source_word: יָיִן
  english_pob_choice: of wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: 제사 제물의 재료로서 יָיִן은 ‘포도주’가 가장 정확하며, 현대어 ‘와인’보다 성경적 제의 맥락을 분명히 합니다.
- source_word: זֹאת עֹלַת חֹדֶשׁ בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  english_pob_choice: This is the monthly burnt offering for each month throughout the months of the year.
  chosen_korean: 이것은 한 달마다 드리는 번제, 곧 해의 여러 달에 걸쳐 드리는 번제입니다.
  alternatives_korean:
  - 이것은 그 달의 번제입니다
  - 이것은 새달의 번제입니다
  lexicon: HALOT
  rationale: חֹדֶשׁ의 ‘달/초하루’ 가능성을 보존하되, 반복되는 달력적 제사의 의미를 분명히 하기 위해 ‘한 달마다’로 옮겼습니다.
theological_decisions:
- issue: חֹדֶשׁ의 달력적 의미와 ‘새달/초하루’ 가능성
  chosen_reading: 본문은 반복되는 월별 번제를 말하므로 본문에는 ‘한 달마다’라고 두고, 새달/초하루 해석은 직역의 과잉 해석 없이 보류합니다.
  alternative_readings:
  - 새달의 번제
  - 초하루의 번제
  rationale: 영어 POB도 월별 반복을 본문에 두고 새달 의미는 각주로 처리했으므로, 한국어 본문 역시 제사 규례의 반복성을 우선 반영하는 것이 원문에 충실합니다.
  doctrine_reference: 민수기 28장 월별 제사 규례
- issue: ‘번제’의 반복성 표현
  chosen_reading: ‘한 달마다 드리는 번제’와 ‘해의 여러 달에 걸쳐 드리는 번제’를 병기해 원문의 분배적 반복을 드러냅니다.
  alternative_readings:
  - ‘월별 번제’만 사용
  - ‘매달 번제’만 사용
  rationale: 원문은 חודש의 단수와 복수 표현을 함께 써 반복 규례를 강조하므로, 두 표현을 나란히 두어 의미를 압축하지 않도록 했습니다.
  doctrine_reference: 제의 달력과 반복 규례
