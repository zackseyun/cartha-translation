  source_fidelity: 원문의 명령 구조와 제의 용어의 병렬은 대체로 반영되었으나, ‘내 향기로운 향기’는 רֵיחַ נִיחֹחִי의 ‘나를 기쁘게 하는/받아들여지는 향기’라는 관용적 의미를 충분히 전달하지 못합니다. 또한 לְאִשַּׁי는 ‘내 화제물’ 자체라기보다 ‘내 화제물을 위한’이라는 관계를 나타내므로 이를 문장 안에서 밝혀 주는 것이 더 정확합니다.
  naturalness: ‘내 향기로운 향기’는 현대 한국어에서 부자연스럽고 동어 반복처럼 들립니다. ‘나를 기쁘게 하는 향기’는 제의적 관용구를 유지하면서 자연스럽습니다. ‘드리도록 주의해야 합니다’보다 ‘드리도록 잘 지키십시오’가 תִּשְׁמְרוּ의 준수·유의의 의미와 직접화법의 합쇼체에 더 잘 맞습니다.
  terminology: ‘이스라엘 자손’, ‘제물’, ‘화제물’, ‘정해진 때’는 적절합니다. ‘내 음식’은 원문의 구체적 제의 표현을 보존하므로 유지할 수 있습니다. 다만 화제물과 음식의 관계를 ‘내 화제물을 위한 내 음식’으로 명시합니다.
  issues:
