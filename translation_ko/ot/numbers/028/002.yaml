source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
  footnotes:
  - marker: a
    text: Or, 'for my offerings by fire.' The Hebrew term refers to sacrificial offerings consumed on the altar.
    reason: lexical_alternative
  - marker: b
    text: '''Pleasing aroma'' is a stock sacrificial expression for an offering accepted by God.'
    reason: cultural_note
  - marker: c
    text: Or, 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 명령하여 그들에게 말하십시오. ‘내 제물, 내 음식, 내 화제물, 내 향기로운 향기[b][c][a]를 너희는 정해진 때에 내게 드리도록 주의해야 합니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 화제물들을 위한 것’입니다. 히브리어는 제단에서 불살라 드리는 제물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 향기’는 하나님께 받아들여지는 제물을 가리키는 제의적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이스라엘 사람들’입니다. 문자적으로는 ‘이스라엘의 자손들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  english_pob_choice: Command
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 צוה의 강한 명령형을 살려, 단순한 전달보다 분명한 지시 행위를 드러내는 ‘명령하여’를 택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 형태상 남성 복수의 족장-공동체 표현을 보존하면서도 한국어에서 가장 자연스러운 직역형으로 옮겼습니다.
- source_word: קָרְבָּנִי לַחְמִי לְאִשַּׁי
  english_pob_choice: My offering, my food for my food offerings
  chosen_korean: 내 제물, 내 음식, 내 화제물
  alternatives_korean:
  - 내 예물, 내 먹을 것, 내 불로 드리는 제물
  - 내 제사, 내 음식, 내 불 제물
  lexicon: HALOT
  rationale: קרבן의 ‘가까이 가져오는 제물’ 의미를 ‘제물’로, לַחְמִי의 제의적 ‘음식/양식’ 의미를 ‘음식’으로, אִשֶּׁה의 제의적 화제물을 ‘화제물’로 분리해 원문의 병렬을 살렸습니다.
- source_word: רֵיחַ נִיחֹחִי
  english_pob_choice: my pleasing aroma
  chosen_korean: 내 향기로운 향기
  alternatives_korean:
  - 내가 기뻐하는 향기
  - 내 기쁜 향기
  - 내 기분 좋은 향기
  lexicon: HALOT
  rationale: 관용적 제의 표현을 과도하게 풀지 않고, ‘향기로운 향기’로 원문의 수용/기쁨의 뉘앙스를 보존했습니다.
- source_word: בְּמוֹעֲדֽוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 그 정한 때에
  - 그것의 정해진 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/지정된 시기’ 의미를 한국어에서 가장 자연스럽게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 제의적 관용구 ‘내 음식/내 향기로운 향기’의 번역 방식
  chosen_reading: 직역에 가까운 제의어를 유지하되, 한국어에서 의미가 즉시 오해되지 않도록 문장 흐름을 정리했습니다.
  alternative_readings:
  - ‘내가 기뻐하는 제물’처럼 의미를 풀어 쓰는 해석적 번역
  - ‘내 향기로운 제물’로 완전히 의역하는 방식
  rationale: 원문은 하나님이 실제로 먹거나 냄새를 맡는다는 뜻이 아니라, 받아들여지는 제의 언어를 사용합니다. 그 긴장을 지우지 않기 위해 관용적 제의 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 이스라엘 공동체 지칭의 남성형 형태
  chosen_reading: ‘이스라엘 자손’으로 남성형-공동체 표현을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성’
  rationale: 원문의 형식적 투명성을 보존하는 것이 중요하므로, 성별 중립화보다 स्रोत 형태를 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §4
