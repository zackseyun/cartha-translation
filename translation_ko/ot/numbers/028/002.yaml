  lexicon: HALOT
  rationale: קרבן의 ‘가까이 가져오는 제물’ 의미를 ‘제물’로, לַחְמִי의 제의적 ‘음식/양식’ 의미를 ‘음식’으로, אִשֶּׁה의 제의적 화제물을 ‘화제물’로 분리해 원문의 병렬을 살렸습니다.
- source_word: רֵיחַ נִיחֹחִי
  english_pob_choice: my pleasing aroma
  chosen_korean: 내 향기로운 향기
  alternatives_korean:
  - 내가 기뻐하는 향기
  - 내 기쁜 향기
  - 내 기분 좋은 향기
  lexicon: HALOT
  rationale: 관용적 제의 표현을 과도하게 풀지 않고, ‘향기로운 향기’로 원문의 수용/기쁨의 뉘앙스를 보존했습니다.
- source_word: בְּמוֹעֲדֽוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 그 정한 때에
  - 그것의 정해진 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/지정된 시기’ 의미를 한국어에서 가장 자연스럽게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 제의적 관용구 ‘내 음식/내 향기로운 향기’의 번역 방식
  chosen_reading: 직역에 가까운 제의어를 유지하되, 한국어에서 의미가 즉시 오해되지 않도록 문장 흐름을 정리했습니다.
  alternative_readings:
  - ‘내가 기뻐하는 제물’처럼 의미를 풀어 쓰는 해석적 번역
  - ‘내 향기로운 제물’로 완전히 의역하는 방식
  rationale: 원문은 하나님이 실제로 먹거나 냄새를 맡는다는 뜻이 아니라, 받아들여지는 제의 언어를 사용합니다. 그 긴장을 지우지 않기 위해 관용적 제의 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 이스라엘 공동체 지칭의 남성형 형태
  chosen_reading: ‘이스라엘 자손’으로 남성형-공동체 표현을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성’
  rationale: 원문의 형식적 투명성을 보존하는 것이 중요하므로, 성별 중립화보다 स्रोत 형태를 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §4
