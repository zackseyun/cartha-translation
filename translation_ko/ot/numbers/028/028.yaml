- from: 그리고 그들의 소제는 기름에 섞은 고운 가루로 드리되, 한 수송아지에는 세 십분의 일, 한 숫양에는 두 십분의 일씩입니다.[a]
  to: 그리고 그들이 드릴 소제는 기름에 섞은 고운 가루로, 한 황소에는 십분의 일 세 단위, 한 숫양에는 십분의 일 두 단위입니다.[a]
  rationale: פַּר를 ‘황소’로 바로잡아 원문의 동물 명칭을 정확히 반영했습니다. 또한 עֶשְׂרֹנִים의 복수 단위성을 한국어 본문과 각주에서 분명히 하되, 한 에바의 십분의 일이라는 관례적 이해는 각주에만 두었습니다.
