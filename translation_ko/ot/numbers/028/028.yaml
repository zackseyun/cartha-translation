reference: Numbers 28:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
  footnotes:
  - marker: a
    text: Hebrew 'three tenth-measures' and 'two tenth-measures'; in this sacrificial context these are commonly understood as tenths of an ephah.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들이 드릴 소제는 기름에 섞은 고운 가루로, 한 황소에는 십분의 일 세 단위, 한 숫양에는 십분의 일 두 단위입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘십분의 일 세 단위’와 ‘십분의 일 두 단위’라고 되어 있으며, 제사 문맥에서는 보통 한 에바의 십분의 일을 한 단위로 이해합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  english_pob_choice: And their grain offering shall be
  chosen_korean: 그리고 그들의 소제는 … 드리되
  alternatives_korean:
  - 그리고 그들의 예물은 … 드리되
  - 그리고 그들의 헌물은 … 드리되
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 일반적인 ‘예물’보다 제의적 ‘소제’가 원뜻을 더 분명히 드러냅니다. 한국어에서는 자연스러운 제물 규정 문체를 위해 ‘드리되’를 보완했습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 고운 밀가루
  - 좋은 가루
  lexicon: HALOT
  rationale: סֹלֶת은 제사 규정에서 쓰이는 정련된 곡물가루로, 한국어 성경 문맥에서는 ‘고운 가루’가 가장 직접적이고 관용적입니다.
- source_word: בְּלוּלָה בַשָּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞은
  alternatives_korean:
  - 기름과 섞은
  - 기름으로 반죽한
  lexicon: HALOT
  rationale: 수동분사와 전치사는 가루가 기름과 함께 준비되었음을 뜻하므로 ‘기름에 섞은’이 가장 간결하게 공정한 대응입니다.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: three-tenths / two-tenths
  chosen_korean: 세 십분의 일 / 두 십분의 일
  alternatives_korean:
  - 세 열의 분량 / 두 열의 분량
  - 세 오멜의 십분의 일 / 두 오멜의 십분의 일
  lexicon: HALOT
  rationale: עִשָּׂרוֹן은 십분의 일 단위이므로 수치 구조를 그대로 옮겨 ‘세 십분의 일’, ‘두 십분의 일’로 처리했습니다. 주석 없이도 제사 규정의 단위감을 살릴 수 있습니다.
- source_word: לַפָּר הָאֶחָד / לָאַיִל הָאֶחָד
  english_pob_choice: for the one bull / for the one ram
  chosen_korean: 한 수송아지에는 / 한 숫양에는
  alternatives_korean:
  - 그 한 수송아지에는
  - 한 소에는 / 한 숫양에는
  lexicon: HALOT
  rationale: פַּר은 성숙한 ‘황소’보다 제사 제물 문맥에서 ‘수송아지’가 더 정확하며, אַיִל은 ‘숫양’이 표준적입니다. ‘한 …에는’은 히브리어의 정관사+‘하나’ 구조를 자연스럽게 반영합니다.
theological_decisions:
- issue: 제물 규정의 서술 방식
  chosen_reading: 명령형이 아니라 제사 규정의 예고/규정 진술로 읽어 한국어에서도 서술형으로 옮겼습니다.
  alternative_readings:
  - 명령문처럼 번역
  - 미래형으로 강하게 번역
  rationale: 히브리어는 제의 규정을 진술하는 법문체이므로, 한국어에서도 독자가 규정문으로 이해하도록 ‘드리되’와 단정적 서술을 유지했습니다.
  doctrine_reference: 제사법 문체 보존
