  source_fidelity: 초안은 עֹלַת תָּמִיד을 ‘정기적인 번제물’로 대체로 잘 옮기고 야훼라는 신명을 일관되게 사용합니다. 그러나 לְרֵיחַ נִיחֹחַ를 ‘향기로운 제물’로 옮겨, 제물 자체가 아니라 ‘향기로운 냄새를 위하여/향기로운 냄새가 되도록’이라는 구문의 기능이 사라졌습니다. 또한 אִשֶּׁה(화제, 불로 드리는 제물)를 별도로 반영하지 않아 핵심 제의 용어가 누락되었습니다.
  naturalness: ‘이는’으로 절을 자연스럽게 시작하고, ‘시나이 산에서 드린 정기적인 번제’라는 수식은 현대 한국어 문장 안에서 무리 없이 읽힙니다. ‘화제’는 성서 제의 문맥의 정착된 용어이므로 유지하되 각주로 뜻을 밝혀 이해를 돕는 것이 적절합니다.
