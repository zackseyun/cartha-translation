  text: 이는 시나이 산에서 드린 정기적인 번제이며, 야훼께 드리는 화제로서 향기로운 냄새를 위한 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제’는 불로 드리는 제물을 가리키는 제의 용어입니다.
    reason: 아ִשֶּׁה의 제의적 의미를 명확히 함
  - marker: b
    text: ‘향기로운 냄새’는 제사가 야훼께 받아들여짐을 나타내는 제의적 표현입니다. 또는 ‘기쁘게 받으시는 향기’로 옮길 수 있습니다.
    reason: לְרֵיחַ נִיחֹחַ의 관용적 의미와 가능한 번역을 설명함
