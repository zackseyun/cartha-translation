id: NUM.28.8
reference: Numbers 28:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'between the evenings,' a traditional expression often understood as 'at twilight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두 번째 어린양을 해질 무렵에 드리십시오[a]. 아침의 곡식 제물과 그 마실 제물처럼, 그것도 화제[b]로, 야훼께 향기로운 냄새가 되게 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘해질 무렵에’, 전통적으로는 ‘황혼에’로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불로 드리는 제물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  english_pob_choice: the second lamb
  chosen_korean: 두 번째 어린양
  alternatives_korean:
  - 두 번째 양
  lexicon: HALOT
  rationale: 제사 문맥의 כֶּבֶשׂ는 일반적인 ‘양’보다 ‘어린양’이 더 자연스럽고, ‘두 번째’는 아침 제물과의 순서를 분명히 살립니다.
- source_word: בֵּין הָעַרְבָּיִם
  english_pob_choice: between the evenings
  chosen_korean: 해질 무렵
  alternatives_korean:
  - 저녁들 사이에
  - 해질녘
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색하므로, 의미를 드러내는 동시에 해석 여지를 좁히지 않는 표현으로 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 제사
  lexicon: HALOT
  rationale: 제사 용례에서 מִנְחָה는 일반적 ‘선물’이 아니라 곡물로 드리는 제물을 가리키므로, 현대 한국어에서 의미가 분명한 ‘곡식 제물’을 택했습니다.
- source_word: אִשֵּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불살라 드리는 제물
  lexicon: HALOT
  rationale: 원어의 ‘불로 드리는 제물’이라는 핵심을 살리기 위해 제사 용어인 ‘화제’를 본문에 두고, 보다 설명적인 대안은 발화상에서 노출시키지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 하나님의 이름은 관습적 대체어가 아니라 ‘야훼’로 옮겨, 본문의 언약적 호칭을 보존했습니다.
theological_decisions:
- issue: בֵּין הָעַרְבָּיִם의 시간 범위
  chosen_reading: ‘해질 무렵’으로 옮겨, 정확한 시각을 단정하지 않고 관용구의 유동성을 남겼습니다.
  alternative_readings:
  - 정확한 제물 시각을 특정하는 번역
  - 해가 진 뒤
  rationale: 이 표현은 전통적으로 해석이 갈리므로, 본문이 요구하는 것은 시각 확정보다 저녁 제사의 규정임을 드러내는 데 두었습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
