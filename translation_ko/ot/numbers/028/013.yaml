revisions:
- from: 고운 가루 한 십분의 일 에바와 기름에 섞은 곡식 제물을, 각 어린양마다 번제 곧 향기로운 냄새, 야훼께 드리는 불로 드리는 제물로 드리십시오.[a]
  to: 각 어린양마다 기름에 섞은 고운 가루 에바의 십분의 일을 곡식 제물로 드리십시오. 이것은 야훼께 드리는 번제, 곧 향기로운 냄새가 나는 불로 드리는 제물[a]입니다.
  rationale: 도량형을 ‘에바의 십분의 일’로 바로잡아 원문의 관용적 수량 표현을 명확히 했습니다. 제사 규정의 명사 나열은 한국어 문장으로 자연스럽게 재구성하되, עֹלָה, רֵיחַ נִיחֹחַ, אִשֶּׁה의 제의적 성격을 보존했습니다. 각주 표지는 אִשֶּׁה의 번역어 뒤로 옮기고, 그 실제 대안인 ‘화제’를 제시했습니다.
