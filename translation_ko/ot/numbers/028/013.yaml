source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'an offering by fire' (for 'a food offering').
    reason: lexical_alternative
translation:
  language: ko
  text: 각 어린양마다 기름에 섞은 고운 가루 에바의 십분의 일을 곡식 제물로 드리십시오. 이것은 야훼께 드리는 번제, 곧 향기로운 냄새가 나는 불로 드리는 제물[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן
  english_pob_choice: and a tenth of an ephah
  chosen_korean: 한 십분의 일 에바
  alternatives_korean:
  - 에바의 십분의 일
  - 한 에바의 십분의 일
  lexicon: HALOT
  rationale: 제사 문맥의 도량형 관용구를 살려 ‘에바의 십분의 일’로 풀 수 있으나, 한국어에서는 ‘한 십분의 일 에바’가 간결하면서도 분량을 분명히 드러냅니다.
- source_word: סֹ֤לֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 정제한 가루
  - 고운 밀가루
  lexicon: HALOT
  rationale: 성막 제물의 표준어휘로서 ‘고운 가루’가 가장 자연스럽고, 재료의 정제됨을 바로 전달합니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 제사
  lexicon: HALOT
  rationale: 제의적 범주를 드러내되, 전통적 교회 용어인 ‘소제’보다 원문의 제물 성격을 직접 보여 주는 ‘곡식 제물’을 택했습니다.
- source_word: אִשֶּׁ֖ה
  english_pob_choice: a food offering
  chosen_korean: 불로 드리는 제물
  alternatives_korean:
  - 화제
  - 불로 드리는 예물
  lexicon: HALOT
  rationale: 히브리어는 ‘불과 관련된 제물’을 뜻하므로, 문맥상 기능을 살린 ‘불로 드리는 제물’이 가장 투명합니다.
- source_word: לַ/יהוָֽה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명사 표기는 프로젝트 기본값에 따라 ‘야훼’로 옮기며, 여격 조사 ‘-께’로 헌정 방향을 분명히 했습니다.
theological_decisions:
- issue: עֹלָה / רֵיחַ נִיחֹחַ / אִשֶּׁה의 결합을 어떻게 한국어로 유지할지
  chosen_reading: 번제 곧 향기로운 냄새, 야훼께 드리는 불로 드리는 제물
  alternative_readings:
  - 번제로서 향기로운 냄새, 야훼께 드리는 화제
  - 번제, 기쁘시게 하는 향기, 야훼께 드리는 화제
  rationale: 세 용어가 제의적 한 덩어리로 이어져 있어, 쉼표와 ‘곧’으로 병렬·동격 관계를 살리면서도 각 표현의 기능을 남겼습니다. 특히 רֵיחַ נִיחֹחַ는 단순한 후각 표현이 아니라 수용/기쁨의 관용구이므로 직역적 감각을 과도하게 약화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
