  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
  footnotes:
  - marker: a
    text: Or 'According to these you shall do day by day for seven days.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bread/food of a fire offering'; here 'food' refers to the sacrificial provision, not necessarily literal bread alone.
    reason: cultural_note
  - marker: c
    text: Or 'besides the continual burnt offering and its libation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 너희는 이레 동안 날마다 불로 드리는 제물의 음식[a], 곧 야훼께 기쁘게 받으실 향기가 되도록 드려야 합니다[b]. 이 제물은 늘 드리는 번제와 그 전제에 더하여 드려야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘불로 드리는 제물의 음식/빵’입니다. 여기서 ‘음식’은 문자적 빵만이 아니라 제의적 제공을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼께 바치는 향기로운 향기’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘늘 드리는 번제와 그 전제 외에’.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּאֵלֶּה
  english_pob_choice: Thus / Like these
  chosen_korean: 이와 같이
  alternatives_korean:
  - 이것들처럼
  - 이와 같이 하여
  lexicon: HALOT
  rationale: 앞의 제의 규정을 가리키는 비교·준거의 כ를 살려, 단순한 ‘그리하여’보다 ‘이와 같이’가 더 정확하게 대응합니다.
- source_word: לֶחֶם אִשֵּׁה
  english_pob_choice: food, an offering made by fire
  chosen_korean: 불로 드리는 제물의 음식
  alternatives_korean:
  - 화제물의 음식
  - 불 제물의 음식
  lexicon: HALOT
  rationale: לֶחֶם의 ‘음식/먹을거리’와 제의적 ‘불로 드리는 제물’의 결합을 함께 드러내기 위해 직역적이되 한국어로 자연스럽게 옮겼습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 기쁘게 받으시는 향기
  - 즐거운 향
  lexicon: HALOT
  rationale: 성경의 제의 공식구를 한국어로 간명하게 살리되, 하나님이 기뻐 받으시는 뜻을 ‘향기로운 향’으로 보존했습니다.
- source_word: וְנִסְכּוֹ
  english_pob_choice: and its drink offering
  chosen_korean: 그 전제
  alternatives_korean:
  - 그 술제물
  - 그 부어 드리는 제물
  lexicon: HALOT
  rationale: נסך의 제의적 ‘붓는 제물’ 의미를 반영하면서도, 한국어 성경에서 널리 이해되는 ‘전제’를 사용했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
