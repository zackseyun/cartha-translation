revisions:
- from: 이와 같이 너희는 날마다 일곱 날 동안 드리되, 불로 드리는 제물의 음식[a], 곧 야훼께 향기로운 향[b]이 되게 하십시오. 그것은 늘 드리는 번제와 그 전제[c]에 더하여 드려야 합니다.
  to: 이와 같이 너희는 이레 동안 날마다 불로 드리는 제물의 음식[a], 곧 야훼께 기쁘게 받으실 향기가 되도록 드려야 합니다[b]. 이 제물은 늘 드리는 번제와 그 전제에 더하여 드려야 합니다[c].
  rationale: The revision preserves every sacrificial element and the formal-polite register while making the Hebrew formula רֵיחַ נִיחֹחַ natural in Korean. It also clarifies that the added offering, rather than the regular burnt offering, is the item to be made in addition to the continual offering and its drink offering.
