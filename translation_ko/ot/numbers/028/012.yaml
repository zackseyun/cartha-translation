revisions:
- from: 그리고 고운 가루 세 에바의 십분의 일로 된 소제는 기름에 섞어, 그 한 수송아지를 위하여 드리고, 고운 가루 두 에바의 십분의 일로 된 소제도 기름에 섞어, 그 한 숫양을 위하여 드리십시오.[a][b]
  to: 수송아지 한 마리를 위하여는 기름에 섞은 고운 가루, 곧 에바의 십분의 일 세 되를 소제로 드리십시오.[a][b] 숫양 한 마리를 위하여는 기름에 섞은 고운 가루, 곧 에바의 십분의 일 두 되를 소제로 드리십시오.
  rationale: 두 분량을 ‘에바의 십분의 일 세 되’와 ‘에바의 십분의 일 두 되’로 고쳐 히브리어의 단위와 복수 수량을 정확히 반영했습니다. 재료와 소제의 관계를 자연스럽게 재배열하고, 각주 표지를 해당 분량 및 ‘기름에 섞은’ 어구 바로 뒤에 배치했습니다. 원문에 드러난 수송아지와 숫양 각각에 대한 배당 관계를 유지했습니다.
