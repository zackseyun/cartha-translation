  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘세 에바의 십분의 일’과 ‘두 에바의 십분의 일’은 수량의 수식 범위가 불명확하며, 문자 그대로는 각각 ‘세 에바의 10분의 1’과 ‘두 에바의 10분의 1’으로 읽힐 수 있습니다. 히브리어 עֶשְׂרֹנִים은 각각 에바의 10분의 1이라는 단위가 셋 및 둘임을 뜻하므로 ‘에바의 십분의 일 세 되/두 되’로 옮기는 것이 정확합니다. 또한 원문에는 명시 동사가 없지만, 제의 규정의 문맥상 한국어 지시문에서 ‘드리십시오’를 보완하는 것은 안전합니다.
  naturalness: ‘고운 가루 …로 된 소제는’은 제물의 재료·분량과 제물 자체의 관계를 다소 어색하게 만듭니다. ‘고운 가루, 곧 …을 소제로’라고 하면 현대 한국어 규정문으로 자연스럽고 분량의 결속 관계도 분명합니다. ‘그 한 수송아지’보다 ‘수송아지 한 마리’가 자연스럽습니다.
