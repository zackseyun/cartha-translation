  - 에바의 삼분의 일
  lexicon: HALOT
  rationale: עֶשְׂרוֹן은 제의 문맥에서 ‘에바의 십분의 일’로 이해되므로, 영어 POB의 분량 해석을 한국어에서도 풀어 써서 실제 제의 단위를 분명히 했습니다.
- source_word: סֹלֶת
