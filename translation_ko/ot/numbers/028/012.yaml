id: NUM.28.12
reference: Numbers 28:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
  footnotes:
  - marker: a
    text: Hebrew 'three tenths' and 'two tenths'; the measure is understood as tenths of an ephah.
    reason: cultural_note
  - marker: b
    text: Or 'mingled with oil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 고운 가루 세 에바의 십분의 일로 된 소제는 기름에 섞어, 그 한 수송아지를 위하여 드리고, 고운 가루 두 에바의 십분의 일로 된 소제도 기름에 섞어, 그 한 숫양을 위하여 드리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘세 십분의 일’과 ‘두 십분의 일’이라고 되어 있으며, 여기서는 에바의 십분의 일로 이해합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘기름과 섞어’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: three-tenths of an ephah / two-tenths of an ephah
  chosen_korean: 세 에바의 십분의 일 / 두 에바의 십분의 일
  alternatives_korean:
  - 삼 십분의 일
  - 에바의 삼분의 일
  lexicon: HALOT
  rationale: עֶשְׂרוֹן은 제의 문맥에서 ‘에바의 십분의 일’로 이해되므로, 영어 POB의 분량 해석을 한국어에서도 풀어 써서 실제 제의 단위를 분명히 했습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 정한 가루
  - 가는 밀가루
  lexicon: HALOT
  rationale: 제의용 סֹלֶת의 관용적 의미를 살려 ‘고운 가루’로 옮겨, 제물 준비의 재료 성격이 드러나게 했습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식 제물
  - 곡식제
  lexicon: HALOT
  rationale: 레위기/민수기 제의 맥락에서 מִנְחָה는 곡식 제물로서의 소제를 가리키므로, 한국어 제의 용례가 널리 통용되는 ‘소제’를 채택했습니다.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞어
  alternatives_korean:
  - 기름과 섞인
  - 기름으로 반죽하여
  lexicon: HALOT
  rationale: 분사구문을 한국어 동작 흐름에 맞게 ‘기름에 섞어’로 옮겨 준비 과정을 자연스럽게 표현했습니다.
- source_word: לַפָּר הָאֶחָד / לָאַיִל הָאֶחָד
  english_pob_choice: for the one bull / for the one ram
  chosen_korean: 그 한 수송아지를 위하여 / 그 한 숫양을 위하여
  alternatives_korean:
  - 한 수송아지를 위하여
  - 그 수송아지 하나를 위하여
  lexicon: HALOT
  rationale: הָאֶחָד의 개별 지시를 살려 ‘그 한 …’으로 옮겨, 각 제물마다 따로 배당되는 분량이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 제의 용어의 현대 한국어 표준화
  chosen_reading: ‘소제’와 ‘수송아지/숫양’이라는 제의적·동물명칭을 유지했습니다.
  alternative_readings:
  - ‘곡식제물’로 풀어 쓰기
  - ‘황소’로 일반화하기
  rationale: 본문은 제사 규례의 세부 지침이므로, 전통적이지만 여전히 통용되는 제의 용어를 사용해 규정의 정확성을 보존했습니다.
  doctrine_reference: 민수기 28장 제사 규례
- issue: 직역의 어색함보다 규정문의 명확성 우선
  chosen_reading: 반복되는 분량과 대상을 한국어 규정문처럼 또렷하게 배열했습니다.
  alternative_readings:
  - 원문 어순을 더 강하게 따라 어색하게 배열하기
  rationale: 이 절은 제의 지시문이므로, 독자가 각 제물별 분량을 즉시 구분할 수 있도록 명료성을 우선했습니다.
  doctrine_reference: 제의 규례 해석 원칙
