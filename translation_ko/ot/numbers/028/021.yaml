  language: ko
  text: 일곱 마리의 양 각각을 위하여 에바의 십분의 일을 준비하라.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면, “한 양을 위하여 십분의 일을, 일곱 마리의 양을 위하여 [준비하라]”입니다. ‘십분의 일’의 반복은 각 양마다 십분의 일씩이라는 분배적 뜻을 나타냅니다.
    reason: lexical_alternative
