  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''a tenth, a tenth you shall make for the one lamb, for the seven lambs.'' The repetition expresses a distributive sense: one tenth for each lamb.'
    reason: lexical_alternative
  - marker: b
    text: That is, a tenth of an ephah, the standard grain-offering measure in this context.
    reason: cultural_note
