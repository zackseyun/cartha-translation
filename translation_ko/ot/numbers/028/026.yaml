source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
  footnotes:
  - marker: a
    text: Or 'a holy assembly.' The Hebrew phrase is a technical term for a sacred gathering summoned for worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'no laborious work' or 'no occupational work.' The phrase refers to ordinary work associated with daily labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 초실의 날, 곧 너희의 칠칠절에 야훼께 새 곡식제물을 드릴 때에, 너희에게는 거룩한 성회가 있어야 합니다.[a] 너희는 어떤 일상 노동도 해서는 안 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 집회’입니다. 이 히브리어 표현은 예배를 위해 소집된 성스러운 모임을 가리키는 기술적 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘힘든 노동’ 또는 ‘생업 노동’입니다. 이 표현은 절기 동안의 통상적 노동을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  english_pob_choice: And on the day of the firstfruits
  chosen_korean: 그리고 초실의 날
  alternatives_korean:
  - 그리고 첫 열매의 날
  - 그리고 처음 수확의 날
  lexicon: HALOT
  rationale: 절기 맥락의 고정된 표현이므로 직역보다 「초실」을 써서 제의적 날짜를 드러냈습니다.
- source_word: מִנְחָה חֲדָשָׁה
  english_pob_choice: a new grain offering
  chosen_korean: 새 곡식제물
  alternatives_korean:
  - 새 소제
  - 새 곡식 예물
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 일반적 ‘예물’보다 ‘곡식제물/소제’가 더 정확하므로, 현대 한국어에서 뜻이 분명한 「곡식제물」로 옮겼습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 회중 소집
  - 거룩한 집회
  lexicon: HALOT
  rationale: 이 표현은 단순 집회가 아니라 예배를 위해 소집된 공식적 모임이므로, POB의 기술적 용례를 살려 「거룩한 성회」로 옮겼습니다.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: You shall do no ordinary work
  chosen_korean: 어떤 일상 노동도 해서는 안 됩니다
  alternatives_korean:
  - 어떤 통상 노동도 해서는 안 됩니다
  - 어떤 일터 노동도 해서는 안 됩니다
  lexicon: HALOT
  rationale: 문맥상 모든 활동이 아니라 절기 외의 통상적 생업 노동을 금지하므로, 이를 현대어로 분명하게 「일상 노동」으로 표현했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신명기적 언약 სახელ을 음역하여, 전통적 교회어인 ‘여호와’ 대신 「야훼」를 유지했습니다.
theological_decisions:
- issue: 절기 명칭의 제의적 고정어 처리
  chosen_reading: ‘초실’과 ‘칠칠절’을 병기해, 첫 수확의 봉헌과 오순절 계열 절기의 연결을 드러냈습니다.
  alternative_readings:
  - ‘첫 열매’만 사용
  - ‘주간 절기’로만 번역
  rationale: 히브리어 본문은 날짜 표지와 절기 명칭을 함께 제시하므로, 한국어에서도 제의적 기능을 잃지 않으면서 독자가 절기를 식별하도록 했습니다.
  doctrine_reference: Numbers 28 제의 달력 문맥
- issue: ‘성회’의 예배적 성격 보존
  chosen_reading: 단순한 모임이 아니라 예배를 위해 소집된 거룩한 회집으로 이해했습니다.
  alternative_readings:
  - 일반 회의
  - 공동체 모임
  rationale: מִקְרָא קֹדֶשׁ은 성스러운 소집을 뜻하는 기술 용어이므로, 예배성과 공적 소집성을 약화시키지 않도록 ‘성회’를 유지했습니다.
  doctrine_reference: 레위기/민수기 절기 규례의 기술 용어
