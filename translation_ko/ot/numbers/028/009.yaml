id: NUM.28.9
reference: Numbers 28:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
  footnotes:
  - marker: a
    text: Hebrew 'two tenths'; in sacrificial legislation this means two-tenths of an ephah.
    reason: cultural_note
  - marker: b
    text: Or 'and its libation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 안식일에는 흠 없는 한 살 된 수컷 어린 양 두 마리와, 곡식 제물로 드릴 기름을 섞은 고운 가루 에바의 십분의 이[a]와 그에 딸린 부어 드리는 제물을 바칠 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘두 십분의 일’은 제의 규례에서 각각 한 에바의 십분의 일인 두 단위, 곧 한 에바의 십분의 이를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְ/יוֹם הַ/שַּׁבָּת
  english_pob_choice: And on the Sabbath day
  chosen_korean: 그리고 안식일에는
  alternatives_korean:
  - 안식일에
  - 그리고 안식일 날에는
  lexicon: HALOT
  rationale: 문맥상 추가 규례를 여는 시간 표현이므로 접속사 ‘그리고’를 살리고, 자연스러운 현대 한국어로 ‘안식일에는’이라 옮겼습니다.
- source_word: שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם
  english_pob_choice: two male lambs a year old, without blemish
  chosen_korean: 흠 없는 한 살 된 수양 두 마리
  alternatives_korean:
  - 흠 없는 한 살 된 숫양 두 마리
  - 흠 없는 한 살 된 어린 양 두 마리
  lexicon: HALOT
  rationale: כְבָשִׂים은 제의 문맥에서 어린 수양/숫양을 가리키므로 ‘수양’으로 옮기고, ‘한 살 된’으로 연령 조건을, ‘흠 없는’으로 제의적 결함 없음의 의미를 반영했습니다.
- source_word: וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  english_pob_choice: and two-tenths of an ephah of fine flour as a grain offering, mixed with oil
  chosen_korean: 곡식 제물로 섞은 기름과 함께 고운 가루 두 십분의 일
  alternatives_korean:
  - 기름에 섞은 고운 가루 두 십분의 일
  - 곡식 제물인 고운 가루 두 십분의 일, 기름과 섞은
  lexicon: HALOT
  rationale: עֶשְׂרֹן을 제물 규례의 관용법에 따라 ‘십분의 일’로 풀어, 계산 단위를 독자가 이해할 수 있게 했고, סֹלֶת은 제의용 ‘고운 가루’로 옮겼습니다. ‘곡식 제물’은 מִנְחָה의 제의적 기능을 드러냅니다.
- source_word: וְ/נִסְכּֽ/וֹ
  english_pob_choice: and its drink offering
  chosen_korean: 그 붓는 제물
  alternatives_korean:
  - 그 음료 제물
  - 그 전제
  lexicon: HALOT
  rationale: נֶסֶךְ은 ‘붓다’의 행위가 강조된 제의적 부속물이라서, 전통적 교회어 ‘전제’ 대신 의미를 직접 드러내는 ‘붓는 제물’로 옮겼습니다.
theological_decisions:
- issue: 제의 규정의 명료성 대 전통 용어 유지
  chosen_reading: 제의 문맥에 맞는 직접적 용어(안식일, 수양, 곡식 제물, 붓는 제물)를 유지했습니다.
  alternative_readings:
  - 안식일 날
  - 전제
  - 소제
  rationale: 이 절은 제사 규례를 설명하므로, 전통적이지만 현대 독자에게 덜 투명한 용어를 그대로 반복하기보다 원문의 기능을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 제의법/성막 규례
- issue: ‘male lambs’의 성별 정보 반영
  chosen_reading: ‘수양 두 마리’로 옮겨 영어 POB가 드러낸 수컷 표지를 반영했습니다.
  alternative_readings:
  - 어린 양 두 마리
  - 양 두 마리
  rationale: 히브리어 복수형과 제의 규정의 정확성을 고려하면 성별이 암시되므로, 일반적인 ‘양’보다 ‘수양’이 더 source-grounded합니다.
  doctrine_reference: 제의 제물 규정
