source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
  footnotes:
  - marker: a
    text: Or 'for one lamb'; literally 'for the one lamb.'
    reason: lexical_alternative
  - marker: b
    text: Or 'In the sanctuary.'
    reason: lexical_alternative
  - marker: c
    text: '''Strong drink'' refers to an intoxicating beverage other than wine; the exact type is not specified.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 전제물은 어린양 한 마리마다[a] 한 힌의 사분의 일이어야 합니다. 거룩한 곳에서[b] 야훼께 독한 술[c]의 전제물을 부으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 어린양을 위하여’. 문자적으로는 ‘그 한 어린양을 위하여’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소에서’.
    reason: lexical_alternative
  - marker: c
    text: ‘독한 술’은 포도주와 다른 취하게 하는 음료를 가리키며, 정확한 종류는 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  english_pob_choice: And its drink offering shall be
  chosen_korean: 그 전제물은
  alternatives_korean:
  - 그 음료제물은
  - 그 술제물은
  lexicon: HALOT
  rationale: נֶסֶךְ는 제의에서 곡물과 함께 드리는 액체 전제를 가리키므로, 한국어에서는 성경적·문맥적 투명성을 살려 ‘전제물’로 옮겼습니다. 문장 전체에서 ‘그 전제물’로 받아 앞 절의 제물에 연결되도록 했습니다.
- source_word: רְבִיעִת הַהִין
  english_pob_choice: a quarter of a hin
  chosen_korean: 한 힌의 사분의 일
  alternatives_korean:
  - 히인의 사분의 일
  - 힌의 4분의 1
  lexicon: HALOT
  rationale: 고대 도량형을 보존해야 하므로 힌을 음역하고, 수량 관계는 한국어에서 자연스러운 ‘사분의 일’로 표현했습니다.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  english_pob_choice: for each lamb
  chosen_korean: 각 어린양마다
  alternatives_korean:
  - 한 어린양마다
  - 그 한 어린양을 위하여
  lexicon: HALOT
  rationale: 히브리어의 ‘한 마리/한 어린양’이라는 분배적 뜻을 한국어에서는 ‘각 …마다’로 가장 자연스럽게 드러낼 수 있습니다. POB의 의미대로 개별 분량을 분명히 했습니다.
- source_word: בַּקֹּדֶשׁ הַסֵּךְ נֶסֶךְ שֵׁכָר
  english_pob_choice: In the holy place you shall pour out a drink offering of strong drink
  chosen_korean: 거룩한 곳에서 포도주보다 독한 술로 번 제물을 부으십시오
  alternatives_korean:
  - 성소에서 술의 전제물을 부으십시오
  - 거룩한 곳에서 독한 술의 전제물을 쏟아 부으십시오
  lexicon: HALOT
  rationale: בַּקֹּדֶשׁ는 제의적 공간을 가리키므로 ‘거룩한 곳’으로 옮겼고, שֵׁכָר는 와인과 구별되는 발효성 음료이므로 ‘포도주보다 독한 술’로 그 차이를 드러냈습니다. הַסֵּךְ는 실제로 ‘붓다/쏟다’의 행위를 요구하므로 제의적 동사를 살렸습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה는 언약 이름이므로, 프로젝트 표준에 따라 ‘야훼’로 직접 옮겨 원문 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
