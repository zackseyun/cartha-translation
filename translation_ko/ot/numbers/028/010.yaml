  - severity: low
    issue: ‘드려져야 한다’
    rationale: 히브리어는 동사 없는 명사구이며, 제의 규례 문맥을 한국어 문장으로 표현할 필요는 있으나 강한 당위 표현을 명시적으로 보태지 않는 편이 더 절제되고 원문에 가깝습니다.
