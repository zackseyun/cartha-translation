  source_fidelity: 히브리어의 반복·분배적 표현 בְּשַׁבַּתּוֹ는 ‘안식일마다’로 자연스럽게 옮길 수 있습니다. עַל은 배제가 아니라 기존의 상번제에 덧붙여 드림을 뜻하므로 ‘외에’보다 ‘더하여’가 정확합니다. 원문에 명시된 의무 동사는 없으므로, 문맥상 제의 규례를 서술하는 ‘드립니다’로 처리해 불필요한 당위의 추가를 피했습니다.
  naturalness: ‘각 안식일의 번제물은 그 안식일에’는 같은 말을 부자연스럽게 반복합니다. ‘안식일의 번제는 안식일마다’가 현대 표준어에서 간결하고 의미가 분명하며 합쇼체에도 맞습니다.
  terminology: עֹלָה는 ‘번제’, תָּמִיד가 수식하는 번제는 전통적이고 널리 통용되는 ‘상번제’, נֶסֶךְ는 ‘전제’로 옮겼습니다. ‘그 전제’의 접미사는 상번제를 가리키는 것으로 자연스럽게 보존됩니다.
  issues:
