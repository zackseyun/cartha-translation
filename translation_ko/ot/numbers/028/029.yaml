  lexicon: HALOT
  rationale: 여기서는 반복된 수량 표현이 희생 규정의 분배 공식으로 쓰였으므로, 자연스러운 현대 한국어로 ‘십분의 일’이라고 옮겨 분배 의미를 살렸습니다.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  english_pob_choice: for each lamb
  chosen_korean: 한 어린양마다
  alternatives_korean:
  - 그 한 어린양을 위하여
  - 어린양 하나마다
  lexicon: HALOT
  rationale: 히브리어의 단수형과 정관사 조합은 개별 분배를 뜻하므로, ‘마다’를 써서 각 어린양에 동일하게 적용되는 뜻을 분명히 했습니다.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  english_pob_choice: for the seven lambs
  chosen_korean: 그 일곱 어린양을 위하여
  alternatives_korean:
  - 일곱 어린양을 위하여
  - 그 일곱 마리 어린양을 위하여
  lexicon: HALOT
  rationale: ‘그’는 문맥상 이미 정해진 일곱 어린양을 가리키는 정관사 기능을 살리고, 축제 제의 맥락에 맞게 수량 전체를 다시 묶어 줍니다.
