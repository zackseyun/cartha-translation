base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
  footnotes:
  - marker: a
    text: Or “beside it.” The Hebrew preposition can denote position alongside in the camp layout.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 곁에[a] 진을 친 지파는 아셀 지파이며, 아셀 자손의 지도자는 아크란의 아들 파기엘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 옆에”. 히브리어 전치사는 진 배치 문맥에서 나란히 있는 위치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים עָלָיו
  english_pob_choice: Those camping next to it
  chosen_korean: 그 옆에는 … 진을 치고 있으며
  alternatives_korean:
  - 그 곁에 … 진을 치고 있으며
  - 그 주변에 … 진을 치고 있으며
  lexicon: HALOT
  rationale: חנה의 분사형은 ‘진을 치는/진 치고 있는’ 상태를 나타내며, עָלָיו는 진 배치 문맥에서 위치적 근접을 뜻하므로 ‘그 옆에는’으로 자연스럽게 옮겼습니다.
- source_word: מַטֵּה
  english_pob_choice: the tribe
  chosen_korean: 아셀 지파
  alternatives_korean:
  - 아셀의 지파
  - 아셀 부족
  lexicon: HALOT
  rationale: 군대 배치와 계수 문맥에서 מַטֶּה는 표준적으로 ‘지파’를 뜻하므로, 한국어 성경 용례에 맞게 ‘아셀 지파’로 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 족장
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 지파의 공적 대표를 가리키므로, ‘족장’보다 현대 한국어에서 분명한 ‘지도자’가 문맥상 적절합니다.
- source_word: לִבְנֵי אָשֵׁר
  english_pob_choice: of the sons of Asher
  chosen_korean: 아셀 자손의
  alternatives_korean:
  - 아셀의 아들들의
  - 아셀의 후손들의
  lexicon: HALOT
  rationale: 히브리어의 משפחה/씨족 표현을 살려 ‘자손의’로 옮기면, 남성 중심의 혈통-씨족 관용구를 보존하면서도 한국어에서 자연스럽습니다.
