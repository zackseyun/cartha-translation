id: NUM.2.17
reference: Numbers 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
  footnotes:
  - marker: a
    text: Or 'in his position' for 'in his place'; the Hebrew idiom literally involves 'hand/side' and refers to assigned placement in the marching order.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their standards' for 'by their banners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 회막이 움직이고, 레위 사람들의 진영이 진영들 한가운데서 움직입니다. 그들이 진을 치는 것처럼, 그들도 움직일 것이니, 각자 자기 자리에서 자기 깃발들을 따라 움직여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 위치에서’로 옮길 수 있습니다. 히브리어 관용구는 문자적으로는 ‘손/곁’을 뜻하며, 행진 순서에서 배정된 위치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 표준에 따라’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  english_pob_choice: Then ... shall set out
  chosen_korean: 그러면 ... 움직입니다
  alternatives_korean:
  - 그러면 ... 출발합니다
  - 그리고 ... 나아갑니다
  lexicon: HALOT
  rationale: 캠프 이동 문맥에서 נָסַע는 단순한 ‘여행하다’보다 진을 걷고 이동하는 뜻이므로, 현대 한국어에서는 ‘움직입니다’로 자연스럽게 옮겼습니다. 앞선 순서를 잇는 וְ는 ‘그러면’으로 반영했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 오경의 고유한 성막 명칭은 한국어 성경에서 널리 통용되는 ‘회막’이 가장 간결하고 식별력이 있습니다. 다만 본문의 기능상 ‘meeting’의 직역 가능성을 검토했으나, 고유명사성을 우선했습니다.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  english_pob_choice: in the midst of the camps
  chosen_korean: 진영들 한가운데서
  alternatives_korean:
  - 진영들 가운데서
  - 진영들 한복판에서
  lexicon: HALOT
  rationale: בְּתוֹךְ은 중심적 위치를 가리키므로 ‘한가운데서’가 공간적 중앙성을 잘 드러냅니다. 복수 ‘진영들’을 그대로 살려 회중들의 배열 한가운데라는 군사적·행진적 이미지를 유지했습니다.
- source_word: לְדִגְלֵיהֶם
  english_pob_choice: by their banners
  chosen_korean: 자기 깃발들을 따라
  alternatives_korean:
  - 자기 기 아래에서
  - 그들의 깃발에 따라
  lexicon: HALOT
  rationale: דֶּגֶל은 지파의 표지인 깃발/표준을 가리키므로, 현대 한국어에서 직관적인 ‘깃발’로 옮겼습니다. 전치사 לְ는 단순한 수단보다 행진의 기준·배열을 나타내므로 ‘따라’가 문맥에 맞습니다.
- source_word: עַל יָדוֹ
  english_pob_choice: in his place
  chosen_korean: 각자 자기 자리에서
  alternatives_korean:
  - 자기 위치에서
  - 자기 맡은 자리에
  lexicon: HALOT
  rationale: 관용구 עַל יָד는 문자적으로는 ‘손/곁’이지만 여기서는 행진 순서에서 배정된 위치를 뜻하므로, POB의 주해를 따라 ‘자기 자리’로 풀었습니다. 이렇게 하면 오해를 줄이면서도 배치의 의미를 유지할 수 있습니다.
theological_decisions:
- issue: 회막과 레위 진영의 중앙 배치가 지닌 질서성
  chosen_reading: 회막이 레위 사람들의 진영과 함께 진영들 한가운데서 이동하도록 번역했습니다.
  alternative_readings:
  - 회막이 레위 사람들의 진영 가운데서 이동합니다
  - 레위 사람들의 진영이 가운데에 있고 회막이 그 안에 있습니다
  rationale: 본문은 이동 시에도 성소와 레위 진영이 중심에 놓이는 질서를 강조하므로, 공간적 중앙성과 행진 순서를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 민수기 2장의 진영 배열과 거룩한 질서
