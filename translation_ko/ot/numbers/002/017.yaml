  naturalness: ‘움직이고/움직입니다/움직일 것이니/움직여야 합니다’의 반복과 시제 혼용을 ‘출발할 것입니다’로 통일하면 현대 표준 한국어 합쇼체로 더 자연스럽고 명료합니다.
  terminology: ‘회막’, ‘레위 사람들’, ‘진영’, ‘깃발’은 적절합니다. ‘자기 깃발들’보다 집단적·배열적 의미를 살린 ‘자기들의 깃발에 따라’가 자연스럽습니다. 각주 b의 ‘표준’은 한국어에서 의미가 불명확하므로 ‘기(旗)’로 명시합니다.
