revisions:
- from: 그러면 회막이 움직이고, 레위 사람들의 진영이 진영들 한가운데서 움직입니다. 그들이 진을 치는 것처럼, 그들도 움직일 것이니, 각자 자기 자리에서 자기 깃발들을 따라 움직여야 합니다.[a][b]
  to: 그 뒤에 회막이 레위 사람들의 진영과 함께 진영들 한가운데서 출발할 것입니다. 그들이 진을 치는 대로 그들도 출발할 것입니다. 각자는 자기 자리에서[a] 자기들의 깃발에 따라[b] 출발할 것입니다.
  rationale: 회막과 레위 사람들의 진영이 중앙에서 행진한다는 공간적 관계를 유지하면서, 원문의 미래적 행진 지시를 일관되게 ‘출발할 것입니다’로 옮겼습니다. 원문에 없는 의무 양태를 제거하고, 위치와 깃발에 관한 각주 표지를 해당 단어에 연결했습니다.
