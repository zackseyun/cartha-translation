  - 모세와 그리고 아론에게
  lexicon: HALOT
  rationale: 접속사와 반복 전치사는 두 수신자를 병렬로 묶는 구조이므로, 한국어에서는 자연스러운 목적격 병렬 ‘모세와 아론에게’로 살렸습니다.
- source_word: לֵאמֹר
