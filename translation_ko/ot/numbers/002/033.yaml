  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or traditionally 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 레위 사람들은 이스라엘 자손[a] 가운데서 계수되지 않았습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, 혹은 전통적으로 ‘이스라엘 자손들’. 히브리어는 ‘이스라엘의 아들들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  english_pob_choice: But the Levites
  chosen_korean: 그러나 레위 사람들은
  alternatives_korean:
  - 그리고 레위 사람들은
  - 그런데 레위 사람들은
  lexicon: HALOT
  rationale: 문맥상 앞선 지파 계수 보고와 대비를 이루므로 ‘그러나’가 가장 자연스럽게 대응합니다. ‘레위 사람들’은 고유 집단명을 표준적으로 옮긴 표현입니다.
- source_word: הָתְפָּקְדוּ
  english_pob_choice: were not counted
  chosen_korean: 계수되지 않았습니다
  alternatives_korean:
  - 세어지지 않았습니다
  - 등록되지 않았습니다
  - 소집되지 않았습니다
  lexicon: HALOT
  rationale: 히트파엘형 פקד는 이 문맥에서 인구조사/계수에 포함되었는지를 뜻하므로, 한국어에서는 수동형 ‘계수되다’가 가장 직접적이고 문맥에 맞습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성을 비교적 투명하게 반영하면서도 한국어에서 자연스럽게 읽히는 전통적 성구 표현을 살렸습니다. 본문 의미상 ‘이스라엘 사람들’도 가능하지만 원문 구조의 투명성이 약해집니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 고유신명 사두문자를 한국어 학술 전사인 ‘야훼’로 옮겨, 본문이 하나님의 이름 자체를 사용하고 있음을 보존했습니다.
theological_decisions:
- issue: 여호와/주님의 대체어 사용 여부
  chosen_reading: 본문의 יְהוָה를 고유명사 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 문맥은 단순한 호칭이 아니라 모세에게 주어진 명령의 출처를 하나님의 언약 이름으로 표시합니다. 따라서 전통적 대체어보다 이름 자체를 드러내는 번역이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
