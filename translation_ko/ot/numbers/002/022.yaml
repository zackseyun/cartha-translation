translation:
  language: ko
  text: 베냐민 지파와 베냐민 자손의 지도자는 아비단, 곧 기드오니의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 지팡이
  - 막대기
  lexicon: HALOT
  rationale: 진영 배열과 인구 조사 문맥에서는 מַטֵּה가 물건이 아니라 부족 단위를 가리키므로, 한국어 성경에서 자연스러운 ‘지파’로 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 족장
  - 왕자
  lexicon: HALOT
  rationale: 이 단어는 베냐민 지파의 공식 대표를 가리키므로, 왕족 뉘앙스가 있는 ‘왕자’는 피하고 현대 한국어에서 분명한 ‘지도자’를 선택했습니다.
- source_word: לִבְנֵי בִנְיָמִן
  english_pob_choice: of the sons of Benjamin
  chosen_korean: 베냐민 자손의
  alternatives_korean:
  - 베냐민 아들들의
  - 베냐민 사람들의
  lexicon: HALOT
  rationale: 히브리어의 ל + בני는 소속/관계를 나타내므로, 혈연적 부족 표현을 살려 ‘베냐민 자손의’로 옮겼습니다.
- source_word: בֶּן גִּדְעֹנִי
  english_pob_choice: son of Gideoni
  chosen_korean: 기드오니의 아들
  alternatives_korean:
  - 기드오니의 아들인
  - 기드오니의 아들입니다
  lexicon: 표준 음역 관례
  rationale: 고유명사 게재는 현대 한국어 성경에서 통용되는 음역을 따르되, המקור의 족보 관계를 분명히 하기 위해 ‘아들’ 구조를 유지했습니다.
