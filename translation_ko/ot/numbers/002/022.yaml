  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
  footnotes:
  - marker: a
    text: Or 'the leader for the sons of Benjamin.' The Hebrew preposition can be rendered in more than one closely related way here.
