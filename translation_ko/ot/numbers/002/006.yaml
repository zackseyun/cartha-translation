lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그 부대
  alternatives_korean:
  - 그 군대
  - 그 군대 편성
  - 그 진영의 군사 집단
  lexicon: HALOT
  rationale: צָבָא는 기본적으로 군대/부대를 뜻하지만, 민수기 1–2장의 진영 편성 문맥에서는 현대 한국어의 '부대'가 조직된 군사 단위를 자연스럽게 살립니다.
- source_word: וּפְקֻדָיו
  english_pob_choice: and those counted from it
  chosen_korean: 그 안에서 계수된 자들
  alternatives_korean:
  - 그것에서 계수된 자들
  - 그 안에서 센 자들
  - 그것의 인원
  lexicon: HALOT
  rationale: פקד의 계수·점호 의미를 살려, 단순한 총원보다 '계수된 자들'로 번역해 인구조사 결과임을 드러냈습니다.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  english_pob_choice: fifty-four thousand four hundred
  chosen_korean: 오만사천사백 명
  alternatives_korean:
  - 54,400명
  - 사만오천사백 명
  - 오십사만 사천사백 명
  lexicon: HALOT
  rationale: 히브리어 수사를 현대 한국어의 자연스러운 수량 표기로 옮기되, 원문의 정확한 수치를 유지했습니다.
theological_decisions:
- issue: 군사 편성 용어의 직역성과 자연스러움
  chosen_reading: '''division''에 해당하는 צָבָא를 ''부대''로 옮겨, 민수기의 진영·계수 문맥을 살렸습니다.'
  alternative_readings:
  - '''군대''는 의미는 가깝지만 현대 한국어에서 더 일반적·추상적으로 들릴 수 있습니다.'
  - '''진영''은 장소 중심으로 읽힐 위험이 있습니다.'
  rationale: 본문은 단순한 숫자 목록이 아니라 이스라엘의 조직된 군사 편성을 기록하므로, 군사적 구조가 드러나는 용어를 택하는 것이 적절합니다.
  doctrine_reference: 민수기 1–2장의 진영 편성과 계수 기록
