    text: 또는 ‘스불론 자손을 위한’. 히브리어 전치사 ל는 이 지파 행정 공식에서 관련 관계를 여러 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 막대기
  - 지팡이
  - 분파
  lexicon: HALOT
  rationale: 민수기의 진영·인구 조직 문맥에서 מַטֵּה는 문자적 막대기가 아니라 부족 단위를 가리키므로, 한국어에서도 관용적이고 오해가 적은 ‘지파’로 옮겼습니다.
- source_word: וְנָשִׂיא
  english_pob_choice: and the leader
  chosen_korean: 지도자는
  alternatives_korean:
  - 우두머리는
  - 족장은
  - 방백은
  lexicon: HALOT
  rationale: 행정적 문맥의 נָשִׂיא는 군주적 ‘왕자’보다 공동체 대표자라는 뜻이 강하므로, 현대 한국어에 자연스러운 ‘지도자’로 옮겼습니다.
- source_word: לִבְנֵי זְבוּלֻן
  english_pob_choice: of the sons of Zebulun
  chosen_korean: 스불론 자손의
  alternatives_korean:
  - 스불론의 아들들의
  - 스불론 사람들의
  - 스불론을 위한
  lexicon: HALOT
  rationale: ל + בני는 소속/관계를 나타내는 관용구이므로, 직역에 가깝게 ‘~자손의’로 유지해 혈연-지파 표현을 살렸습니다.
- source_word: בֶּן חֵלֹן
  english_pob_choice: son of Helon
  chosen_korean: 헬론의 아들
  alternatives_korean:
  - 헬론의 아들인
  - 헬론의 아들로
  - 헬론의 아들입니다
  lexicon: HALOT
  rationale: 히브리어 족보식 patronymic을 한국어에서도 가장 간결하고 자연스럽게 재현하기 위해 ‘~의 아들’ 구조를 사용했습니다.
theological_decisions:
- issue: tribal-administrative formula in a census setting
  chosen_reading: 문맥을 ‘이스라엘 지파의 행정적 대표 명단’으로 보고, 단순 서술형으로 옮겼습니다.
  alternative_readings:
  - 의례적 호칭으로 과장해 번역
  - 현대 정치 용어로 바꾸어 번역
  rationale: 이 절은 신학적 논평보다 지파 편성의 사실 전달이 중심이므로, 원문의 행정적·목록적 성격을 유지하는 것이 본문 의도에 가장 충실합니다.
  doctrine_reference: 민수기 2장의 진영 편성 및 지파 대표 명단
