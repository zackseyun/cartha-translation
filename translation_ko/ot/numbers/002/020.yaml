  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 종족
  - 막대기
  lexicon: HALOT
  rationale: 인구 조사와 진영 조직 문맥에서는 מַטֵּה가 부족 단위인 ‘지파’를 가리키므로 그렇게 옮겼습니다.
- source_word: וְנָשִׂיא לִבְנֵי מְנַשֶּׁה
  english_pob_choice: and the leader of the sons of Manasseh
  chosen_korean: 므낫세 자손의 지휘관
  alternatives_korean:
  - 므낫세 자손의 지도자
  - 므낫세 자손의 방백
  - 므낫세 자손의 군장
  lexicon: HALOT
  rationale: נָשִׂיא는 이 구절에서 지파를 대표하는 공식 책임자를 가리키므로, 전통적 ‘방백’보다 현대 독자가 이해하기 쉬운 ‘지휘관’을 택했습니다.
- source_word: גַּמְלִיאֵל
  english_pob_choice: Gamaliel
  chosen_korean: 갬리엘
  alternatives_korean:
  - 가말리엘
  - 감랴엘
  - 가밀리엘
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역했습니다.
- source_word: פְּדָהצוּר
