  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
  footnotes:
  - marker: a
    text: Or 'beside him was the tribe of Manasseh.' The Hebrew prepositional phrase denotes adjacent placement in the camp formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 곁에는 므낫세 지파가 있었습니다.[a] 므낫세 자손의 지도자는 브다술의 아들 가말리엘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 옆에는 므낫세 지파가 있었습니다.’ 여기서 히브리어 전치사구는 진영 배치에서 인접한 위치를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  english_pob_choice: And next to him was
  chosen_korean: 그 옆에는
  alternatives_korean:
  - 그 곁에는
  - 그에게 붙어서는
  - 그 위에는
  lexicon: HALOT
  rationale: 진영 배치 문맥에서 עַל + 대명사 접미사는 권위가 아니라 인접한 위치를 뜻하므로, 자연스러운 현대 한국어로 ‘그 옆에는’이라고 옮겼습니다.
- source_word: מַטֵּה
