  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their armies/hosts'; the Hebrew carries an ordered military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 진영의 기는 남쪽에 있을 것이며[a], 그들의 부대대로[b] 배치될 것입니다. 그리고 르우벤 자손의 지도자는 스데울의 아들 엘리추르입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깃발’. דֶּגֶל은 진영을 식별하는 표지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 군대/부대에 따라’. 히브리어는 정돈된 군사적 질서를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 기
  alternatives_korean:
  - 깃발
  - 군기
  - 표준
  lexicon: HALOT
  rationale: 진영을 식별하는 집결 표지라는 점을 살려, 현대 한국어에서 자연스럽고 군사적·집단적 함의를 담는 ‘기’로 옮겼습니다.
- source_word: תֵּימָנָה
  english_pob_choice: on the south
  chosen_korean: 남쪽에 있을 것이며
  alternatives_korean:
  - 남쪽에
  - 남쪽으로
  - 남쪽에 놓일 것이며
  lexicon: HALOT
  rationale: 문맥상 진영 배치의 위치를 나타내므로, 정적인 방향 표현을 한국어 문장 흐름에 맞게 풀어 옮겼습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 부대대로
  alternatives_korean:
  - 그들의 편제대로
  - 그들의 군대로
  - 그들의 분열대로
  lexicon: HALOT
  rationale: צבא의 조직된 군사적 질서를 살리되, 한국어에서 과도하게 전투적이지 않도록 ‘부대대’로 옮겨 배열의 질서를 드러냈습니다.
- source_word: וְנָשִׂיא
  english_pob_choice: and the leader
  chosen_korean: 지도자는
  alternatives_korean:
  - 수장은
  - 족장은
  - 군주는
  lexicon: HALOT
  rationale: נָשִׂיא를 이 문맥의 지파 대표자로 이해하여, 신분적 뉘앙스가 강한 ‘군주’보다 중립적인 ‘지도자’로 번역했습니다.
theological_decisions:
- issue: 지파 진영의 배치와 지도권의 질서 표현
  chosen_reading: 배치와 지도권을 모두 명시하여, 본문이 하나님께서 정하신 진영의 질서라는 점이 드러나게 했습니다.
  alternative_readings:
  - 단순히 위치 정보만 전달하는 번역
  - ‘장막’ 중심으로 완화한 번역
  rationale: 민수기 2장의 핵심은 지파가 임의가 아니라 정해진 질서에 따라 진을 치는 데 있으므로, 군사·공동체적 조직성을 희석하지 않도록 했습니다.
  doctrine_reference: Numbers 2:1-34의 진영 질서와 지파 대표 체계
