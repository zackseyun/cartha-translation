base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their armies/hosts'; the Hebrew carries an ordered military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 진영의 기는 그들의 부대 편제에 따라 남쪽에 있을 것이며[a][b], 르우벤 자손의 지도자는 스데우르의 아들 엘리술입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깃발’. 히브리어 דֶּגֶל은 진영을 식별하는 표지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 군대/부대에 따라’. 히브리어는 정돈된 군사적 조직 질서를 나타냅니다.
    reason: lexical_alternative
