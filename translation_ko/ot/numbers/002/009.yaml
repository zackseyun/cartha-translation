id: NUM.2.9
reference: Numbers 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה יְהוּדָ֗ה מְאַ֨ת אֶ֜לֶף וּ/שְׁמֹנִ֥ים אֶ֛לֶף וְ/שֵֽׁשֶׁת אֲלָפִ֥ים וְ/אַרְבַּע מֵא֖וֹת לְ/צִבְאֹתָ֑/ם רִאשֹׁנָ֖ה יִסָּֽעוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
  footnotes:
  - marker: a
    text: Or 'those numbered' for 'those counted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by their companies' or 'by their hosts' for 'by their divisions.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'They shall set out first'; in camp context this can also be expressed as 'They shall break camp first.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 진영의 계수된 사람은 모두 18만 6,400명으로, 그들의 분대별로[first] 출발합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘출발합니다’는 ‘진을 떠나 출발합니다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּקֻדִים
  english_pob_choice: those counted
  chosen_korean: 계수된 사람
  alternatives_korean:
  - 등록된 사람
  - 번호가 매겨진 사람
  - 계산된 사람
  lexicon: HALOT
  rationale: פקד의 인구조사·집계 의미를 따라 ‘계수된’으로 옮겨, 단순한 수학적 계산이 아니라 전쟁 편제용 집계를 드러냈습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 분대별로
  alternatives_korean:
  - 그들의 진영별로
  - 그들의 부대별로
  - 그들의 군대별로
  lexicon: HALOT
  rationale: 광야 진영 문맥에서 צבא는 군사적 ‘부대/편제’의 질서를 가리키므로, 현대 한국어에서 자연스러운 ‘분대별로’로 처리했습니다.
- source_word: יִסָּעוּ
  english_pob_choice: They shall set out
  chosen_korean: 출발합니다
  alternatives_korean:
  - 진을 칩니다
  - 떠납니다
  - 행진합니다
  lexicon: HALOT
  rationale: 캠프 문맥의 נסע는 ‘진을 떠나 출발하다’의 뜻이므로, 낯설지 않으면서도 행군 순서를 보여 주는 표현을 택했습니다.
- source_word: רִאשֹׁנָה
  english_pob_choice: first
  chosen_korean: 먼저
  alternatives_korean:
  - 첫째로
  - 가장 먼저
  - 제일 먼저
  lexicon: HALOT
  rationale: 유다 진영이 행렬의 선두라는 순서를 분명히 하기 위해 부사적으로 ‘먼저’를 반영했습니다.
