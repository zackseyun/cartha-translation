  source_fidelity: 히브리어는 유다 진영에 속하여 ‘그들의 부대별로’ 계수된 총수를 186,400명으로 제시하고, 이어 그들이 행군 시 ‘먼저’ 출발할 것을 말합니다. 초안은 수치와 출발 동사는 대체로 맞지만, ‘분대별로’는 צְבָאֹת의 규모와 조직성을 지나치게 좁히며, 본문의 ‘먼저’가 번역문에 반영되지 않고 편집 표지로 남아 있습니다.
  naturalness: ‘그들의 분대별로[first] 출발합니다’는 한국어 문장 구조상 ‘분대별로’가 출발을 수식하는 듯하고, 미처리 영어 표지가 포함되어 있어 자연스럽지 않습니다. 두 문장으로 나누어 계수의 기준과 출발 순서를 명료하게 제시하는 것이 자연스럽습니다.
