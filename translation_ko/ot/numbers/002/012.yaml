  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
  footnotes:
  - marker: a
    text: Or “beside it.” The Hebrew preposition can denote proximity in the camp arrangement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 곁에 진을 치는 사람들은 시므온 지파이며, 시므온 자손의 지도자는 수리사대의 아들 셀루미엘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 곁에’. 히브리어 전치사는 진영 배치 문맥에서 근접을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם עָלָיו
  english_pob_choice: Those camping next to him
  chosen_korean: 그 곁에 진을 치는 사람들
  alternatives_korean:
  - 그 곁에 진을 치는 자들
  - 그 옆에 진을 친 사람들
  lexicon: HALOT
  rationale: חנה의 분사형은 진영 배치를 가리키는 집합적 표현이므로, 현대 한국어에서는 자연스럽게 ‘진을 치는 사람들’로 옮기되 עָלָיו의 근접 의미를 ‘그 곁에’로 반영했습니다.
- source_word: מַטֵּה שִׁמְעוֹן
  english_pob_choice: the tribe of Simeon
  chosen_korean: 시므온 지파
  alternatives_korean:
  - 시므온의 지파
  - 시므온 막대기
  lexicon: HALOT
  rationale: 막대기라는 문자적 뜻보다 인구·진영 문맥의 부족 단위를 가리키는 관용적 의미가 분명하므로 ‘지파’로 번역했습니다.
- source_word: וְנָשִׂיא לִבְנֵי שִׁמְעוֹן
  english_pob_choice: and the leader of the sons of Simeon
  chosen_korean: 시므온 자손의 지도자는
  alternatives_korean:
  - 시므온 자손의 우두머리는
  - 시므온 자손의 방백은
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 왕적 ‘왕자’보다 부족의 대표자·수장을 뜻하므로, 현대어로 분명한 ‘지도자’가 문맥을 가장 잘 드러냅니다.
- source_word: בֶּן צוּרִי שַׁדָּי
  english_pob_choice: son of Zurishaddai
  chosen_korean: 수리사대의 아들
  alternatives_korean:
  - 추리사대의 아들
  - 수리샤다이의 아들
  lexicon: standard transliteration
  rationale: 고유명사는 한국어 외래어 표기 관례에 따라 음역하고, 부친 관계는 ‘…의 아들’로 직역해 족보 구조를 보존했습니다.
theological_decisions:
- issue: 지파 배치 문맥에서 עָלָיו의 지시 대상
  chosen_reading: ‘그 곁에’로 처리하여 앞선 진영 배치 대상을 가리키게 했습니다.
  alternative_readings:
  - ‘그 위에’
  - ‘그 옆에’
  rationale: 이 구절의 עַל은 문자적 ‘위에’가 아니라 진영 배열에서의 인접성을 뜻하므로, 독자가 배치 관계를 즉시 이해하도록 공간적 근접 의미를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2 (source-directed meaning)
