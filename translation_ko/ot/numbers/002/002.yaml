  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
  footnotes:
  - marker: a
    text: Or “standard” for “banner.” The Hebrew דֶּגֶל refers to a tribal or military identifying banner.
    reason: lexical_alternative
  - marker: b
    text: Or “The Israelites” for “The sons of Israel.” The more literal wording preserves the familial idiom of the Hebrew.
    reason: lexical_alternative
  - marker: c
    text: Traditional English often has “tabernacle” for “tent of meeting.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[b]은 각 사람이 자기 깃발[a] 곁에서, 자기 조상 집안의 표지에 따라 진을 쳐야 합니다. 그들은 회막[c]에서 조금 떨어져 그 주위에 진을 쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기”로 옮길 수 있습니다. 히브리어 דֶּגֶל은 지파나 군대의 식별 깃발을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이스라엘 사람들”로 옮길 수 있습니다. “이스라엘 자손”은 히브리어의 가족적 관용구를 더 직접적으로 보존합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֹהֶל מוֹעֵד는 직역하면 “만남의 장막”입니다. 전통적인 번역에서는 “회막” 또는 “성막”으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람마다
  alternatives_korean:
  - 각각 한 사람씩
  - 각 남자마다
  lexicon: HALOT
  rationale: 분배적 용법을 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘각 사람마다’로 옮겼습니다. 남성형을 무화하지 않으면서도 성별 중심 표현을 지나치게 강조하지 않습니다.
- source_word: דִּגְלוֹ
  english_pob_choice: his banner
  chosen_korean: 자기 깃발 아래
  alternatives_korean:
  - 자기 기 아래
  - 자기 군기 아래
  lexicon: HALOT
  rationale: דֶּגֶל은 지파 또는 군사적 식별 표지로서의 깃발/기입니다. 한국어에서는 ‘깃발 아래’가 가장 직관적이며, 소속 표지를 드러냅니다.
- source_word: בְאֹתֹת
  english_pob_choice: according to the signs
  chosen_korean: 표지에 따라
  alternatives_korean:
  - 표식에 따라
  - 징표에 따라
  - 기호에 따라
  lexicon: HALOT
  rationale: 여기서 אֹתֹת은 진영 배치의 식별 표지들을 가리키므로, 단순한 ‘기호’보다 집단 구분을 드러내는 ‘표지’가 문맥상 더 적합합니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  - 회중의 장막
  lexicon: HALOT
  rationale: 직역하면 ‘만남의 천막’이지만, 한국어 성경 전통과 문맥상 인식 가능성을 고려해 ‘회막’으로 옮겼습니다. 이는 단어 선택의 투명성을 유지하면서도 자연스러운 표현입니다.
theological_decisions:
- issue: 진영 배치의 규범적 명령형
  chosen_reading: 진을 쳐야 합니다 / 진을 칠 것입니다
  alternative_readings:
  - 진을 칩니다
  - 진을 칠 것입니다
  rationale: 히브리어 미완료형은 여기서 지시·규정의 성격을 띠므로, 한국어에서는 규범적 명령/의무를 나타내는 표현으로 옮겼습니다. 두 번째 절반은 평행을 살려 미래/의무 뉘앙스를 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: 공동체 정체성 표현
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: בְּנֵי יִשְׂרָאֵל의 혈연·언약적 표현을 살려 ‘이스라엘 자손’으로 유지했습니다. 이는 공동체의 계보적 질서를 드러내는 본문 의미에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
