  source_fidelity: 초안의 ‘자기 깃발 아래’는 히브리어 עַל(‘곁에/따라’)보다 ‘아래’라는 공간 관계를 더 구체화합니다. 또한 ‘곧’은 깃발과 조상 집안의 표지를 동격으로 처리하지만, 원문은 두 표지를 병렬적으로 언급합니다. מִנֶּגֶד의 거리·대면 관계도 ‘회막에서 조금 떨어져’로 반영하는 것이 더 충실합니다.
  naturalness: ‘그 둘레 사방으로’는 다소 중복되고 문장 끝에 각주가 한꺼번에 붙어 있어 어느 낱말을 설명하는지 불분명합니다. ‘회막에서 조금 떨어져 그 주위에’가 현대 표준 한국어로 자연스럽고 배치 관계를 분명히 합니다.
  terminology: ‘이스라엘 자손’, ‘깃발’, ‘표지’, ‘회막’은 적절합니다. ‘조상 집안’은 לְבֵית אֲבֹתָם의 가문·가족 단위의 뜻을 보존합니다. ‘회막’ 각주는 이를 ‘장막’보다 더 직접적인 번역이라고 단정하지 않고, 히브리어의 직역과 전통 용례를 정확히 밝혀야 합니다.
