revisions:
- from: 이스라엘 자손은 각 사람마다 자기 깃발 아래, 곧 그들의 조상 집안의 표지에 따라 진을 쳐야 합니다. 그들은 회막을 마주하여, 그 둘레 사방으로 진을 칠 것입니다.[a][b][c]
  to: 이스라엘 자손[b]은 각 사람이 자기 깃발[a] 곁에서, 자기 조상 집안의 표지에 따라 진을 쳐야 합니다. 그들은 회막[c]에서 조금 떨어져 그 주위에 진을 쳐야 합니다.
  rationale: 원문의 병렬 구조와 공간 관계를 보존하도록 ‘아래’와 동격을 암시하는 ‘곧’을 제거했습니다. מִנֶּגֶד를 ‘회막에서 조금 떨어져’로, סָבִיב을 ‘그 주위에’로 옮겼으며, 두 평행 절의 지시적 양태를 ‘쳐야 합니다’로 일관되게 처리했습니다. 각주는 해당 표현 뒤에 배치하고 설명을 정확하게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
