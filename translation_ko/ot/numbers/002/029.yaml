    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֶּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 씨족
  - 막대기
  lexicon: HALOT
  rationale: 진영 배열과 인구 조사 문맥에서는 문자 그대로의 ‘막대기’가 아니라 이스라엘의 부족 단위를 가리키므로, POB의 ‘tribe’에 맞춰 ‘지파’로 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 족장
  - 우두머리
  - 왕자
  lexicon: HALOT
  rationale: 여기서는 왕족보다 행정적 대표를 뜻하므로, 오해가 적은 현대 한국어 ‘지도자’를 선택했습니다.
- source_word: לִבְנֵי
  english_pob_choice: of the sons of
  chosen_korean: 자손의
  alternatives_korean:
  - 아들들의
  - 사람들의
  - 후손의
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 그대로 보존하되, 한국어에서는 ‘납달리 자손’이 자연스럽고 성별 한정도 과도하게 드러나지 않아 ‘자손의’로 처리했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - ~에게서 난
  lexicon: HALOT
  rationale: 고유명사 사이의 전형적인 계보 공식이므로, 직역에 가까운 ‘~의 아들’ 구조를 유지했습니다.
