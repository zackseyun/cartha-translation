    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָא֖וֹ
  english_pob_choice: and his company
  chosen_korean: 그들의 군대
  alternatives_korean:
  - 그들의 부대
  - 그들의 떼
  lexicon: HALOT
  rationale: צָבָא는 전투 부대뿐 아니라 질서 있게 편성된 집단을 가리킬 수 있으므로, 광야 진영의 편제라는 문맥을 살려 ‘군대’로 옮기되, 한국어에서 자연스러운 집합 명사로 처리했습니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: even those numbered from them
  chosen_korean: 그 등록된 사람들
  alternatives_korean:
  - 그들 가운데 계수된 자들
  - 그들 중에 계수된 사람들
  lexicon: HALOT
  rationale: פקד의 계수·등록 의미를 반영해 단순히 숫자만이 아니라 공식적으로 ‘등록된’ 사람들임을 드러냈습니다.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  english_pob_choice: thirty-five thousand four hundred
  chosen_korean: 삼만오천사백 명
  alternatives_korean:
  - 삼만오천사백명
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 현대 한국어의 자연스러운 수사법으로 옮기되, 정확한 총계를 그대로 유지했습니다.
theological_decisions:
- issue: 이스라엘 지파의 인원 표현을 군사적 편제로 번역할지 여부
  chosen_reading: ‘군대’로 옮겨 광야 진영의 질서 있는 편성을 드러냈습니다.
  alternative_readings:
  - ‘부대’로 완화해 번역함
  - 단순히 ‘무리’로 번역함
  rationale: 민수기 2장의 문맥은 단순한 인구 통계가 아니라 행군·진영 편제를 전제하므로, 군사적 조직성을 약화시키지 않는 번역이 적절합니다.
  doctrine_reference: 민수기 2장 진영 배치와 인구 조사 문맥
