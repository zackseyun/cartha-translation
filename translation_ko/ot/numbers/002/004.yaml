translation:
  language: ko
  text: 그의 부대[a], 곧 그 가운데서 계수된 자들[b]은 칠만 사천육백 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 군대’, ‘그의 군세’. 히브리어 צָבָא는 군사적 의미를 가질 수 있지만, 여기서는 진영에 배치된 부족의 편제를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 속하여 계수된 자들’, ‘그들의 등록된 자들’. 히브리어는 인구 조사에서 계수하거나 등록하는 용어를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 군집단
  - 그의 군사
  lexicon: HALOT
  rationale: צָבָא는 군사적 의미를 가지지만, 민수기 2장의 진영 편성 문맥에서는 부족 단위의 조직된 편제를 가리키므로 ‘부대’가 가장 자연스럽고 과도한 전투 뉘앙스를 피합니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그들 가운데서 계수된 자
