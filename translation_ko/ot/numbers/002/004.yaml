base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/004.yaml
  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
  footnotes:
  - marker: a
    text: Or 'and his army' or 'and his host'; the Hebrew צָבָא can carry a military sense, but here likely refers to the tribal division as arranged in the camp.
    reason: lexical_alternative
  - marker: b
    text: Or 'those mustered by them' or 'their numbered men.' The Hebrew reflects census enrollment terminology.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 부대와 그들 가운데서 계수된 자는 칠만사천육백 명입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 군대’, ‘그의 군사’. 히브리어 צָבָא는 군사적 의미를 가질 수 있지만, 여기서는 진영에 배치된 부족 편제를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 가운데서 계수된 자들’, ‘그들에 의해 계수된 자들’. 히브리어는 인구 조사 등록 용어를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 군집단
  - 그의 군사
  lexicon: HALOT
  rationale: צָבָא는 군사적 의미를 가지지만, 민수기 2장의 진영 편성 문맥에서는 부족 단위의 조직된 편제를 가리키므로 ‘부대’가 가장 자연스럽고 과도한 전투 뉘앙스를 피합니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그들 가운데서 계수된 자
  alternatives_korean:
  - 그들 가운데서 센 자
  - 그들 가운데서 등록된 자
  - 그들 가운데서 조사된 자
  lexicon: HALOT
  rationale: פקד의 계수·조사 용법을 살려 census 등록을 뜻하는 말로 옮겼습니다. ‘계수된 자’는 인원 집계를 드러내면서도 원문의 수동적 의미를 비교적 정확히 보존합니다.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  english_pob_choice: seventy-four thousand six hundred
  chosen_korean: 칠만사천육백 명
  alternatives_korean:
  - 사천칠백육만 명
  - 칠만사천육백
  lexicon: HALOT
  rationale: 히브리어 수사 표현의 정확한 총합을 한국어 표준 수사 순서로 자연스럽게 옮겼습니다. 인원 수이므로 ‘명’을 덧붙였습니다.
theological_decisions:
- issue: צבא를 군사적 ‘군대’로 직역할지, 진영 편성의 조직 단위로 볼지
  chosen_reading: 여기서는 실제 전투 집단보다 진영 안에서 정렬된 부족/편제 단위를 가리키는 것으로 읽어 ‘부대’로 옮겼습니다.
  alternative_readings:
  - 군대
  - 군사
  - 군집단
  rationale: 민수기 2장은 출정 서술이 아니라 광야 진영 배치와 계수의 문맥이므로, 군사적 뉘앙스를 완전히 지우지 않되 기능적 조직성을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 2장의 진영 조직과 계수 문맥
