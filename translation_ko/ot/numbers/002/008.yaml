  text: 그의 부대[a], 곧 그 가운데 계수된 사람들은[b] 오만 칠천사백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 여기서 군사적 ‘부대’, ‘군대’, 또는 조직된 편제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 공식적으로 ‘계수된 사람들’을 뜻합니다. 또는 ‘등록된 사람들’이나 ‘소집된 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: And his company
  chosen_korean: 그의 부대
  alternatives_korean:
