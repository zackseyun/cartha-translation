  - 그의 분대
  lexicon: HALOT
  rationale: צָבָא는 여기서 전투군보다 진영 편성 속의 조직된 단위를 가리키므로, 현대 한국어에서 자연스럽고 군사적 조직감을 살리는 ‘부대’로 옮겼습니다.
