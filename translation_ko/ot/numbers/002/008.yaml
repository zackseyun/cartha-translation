base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
  footnotes:
  - marker: a
    text: Or 'his host' or 'his division'; the Hebrew צָבָא can denote a military company or organized contingent in the camp census context.
    reason: lexical_alternative
  - marker: b
    text: Or 'those mustered of it' or 'his enrolled men'; the Hebrew reflects those officially counted in the census.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 부대와 그에게 속한 등록된 사람들은 오만 칠천 사백 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 여기서 군사적 ‘부대’ 또는 조직된 ‘분대/진영’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פקד는 공식적으로 ‘계수된 자들’ 또는 ‘등록된 사람들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: And his company
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 진영
  - 그의 분대
  lexicon: HALOT
  rationale: צָבָא는 여기서 전투군보다 진영 편성 속의 조직된 단위를 가리키므로, 현대 한국어에서 자연스럽고 군사적 조직감을 살리는 ‘부대’로 옮겼습니다.
- source_word: וּפְקֻדָיו
  english_pob_choice: even those numbered of it
  chosen_korean: 그에게 속한 등록된 사람들은
  alternatives_korean:
  - 그것에서 계수된 사람들은
  - 그에게 속한 계수된 자들은
  - 그의 장부에 오른 사람들은
  lexicon: HALOT
  rationale: פקד의 수동적 의미는 공식적으로 계수·등록된 사람들을 가리키므로, ‘등록된 사람들’로 옮겨 공식 조사에 따른 포함 관계를 드러냈습니다.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  english_pob_choice: fifty-seven thousand four hundred
  chosen_korean: 오만 칠천 사백 명
  alternatives_korean:
  - 오십칠만 사백 명
  - 57,400명
  lexicon: HALOT
  rationale: 히브리어 수사는 통상적인 한국어 수사 순서로 자연스럽게 재배열하되, 정확한 수치 57,400명을 보존했습니다.
theological_decisions:
- issue: 민수기 2장의 지파 인원 표기에서 'צבא'의 뉘앙스
  chosen_reading: 여기서는 전쟁 수행보다 진영 안의 조직된 편제라는 의미를 살려 ‘부대’로 번역했습니다.
  alternative_readings:
  - 군대
  - 진영
  - 군사
  rationale: 문맥이 전투 서술이 아니라 광야 진영의 계수이므로, 군사적이되 과도하게 전쟁화하지 않는 표현이 본문의 기능을 더 잘 반영합니다.
  doctrine_reference: 민수기 2장 지파 진영 배열과 계수 본문
