  lexicon: HALOT
  rationale: פקד의 수동적 의미는 공식적으로 계수·등록된 사람들을 가리키므로, ‘등록된 사람들’로 옮겨 공식 조사에 따른 포함 관계를 드러냈습니다.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
