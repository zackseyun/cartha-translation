base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/026.yaml
  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
  footnotes:
  - marker: a
    text: Or 'and his army' / 'and his host'; Hebrew צָבָא can denote a military host or organized company. In this census context, 'division' best reflects the tribal contingent arrangement.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and those numbered of them.' The phrase refers to the census total counted from that tribe/group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 부대의 인원은 육만 이천칠백 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 문맥에 따라 ‘군대’, ‘군대 부대’, ‘편성된 집단’ 등을 뜻할 수 있습니다. 여기서는 계수와 진영 배치의 문맥이므로 ‘부대’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פְקֻדֵיהֶם은 문자적으로는 ‘그들 가운데 계수된 자들’이라는 뜻입니다. 여기서는 총인원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그 부대
  alternatives_korean:
  - 그 군대
  - 그 군집
  - 그 편성된 무리
  lexicon: HALOT
  rationale: 민수기 1–2장의 진영·계수 문맥에서는 צָבָא를 현대 한국어의 조직 단위인 ‘부대’로 옮기면, 군사적 뉘앙스를 지나치게 강하게 만들지 않으면서도 편제된 집단이라는 뜻을 살릴 수 있습니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그 부대의 인원은
  alternatives_korean:
  - 그들 가운데 계수된 자들은
  - 그들에게서 계수된 자들은
  - 그들의 계수된 사람들은
  lexicon: HALOT
  rationale: פקד에서 온 표현은 ‘계수된 사람들’이라는 뜻이지만, 한국어에서는 본문 전체의 수량 진술을 자연스럽게 드러내기 위해 ‘인원은’으로 풀어 옮겼습니다.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  english_pob_choice: sixty-two thousand seven hundred
  chosen_korean: 육만 이천칠백 명
  alternatives_korean:
  - 육십이천칠백 명
  - 62,700명
  lexicon: HALOT
  rationale: 히브리어 수사는 현대 한국어의 통상적인 수량 배열로 옮겨 정확한 총계를 분명하게 했습니다.
theological_decisions:
- issue: 계수 본문의 군사적 표현을 어떻게 처리할지
  chosen_reading: ‘부대’로 번역하되, 실제 전투집단이라기보다 진영 안에서 조직된 계수 단위라는 점을 드러내었습니다.
  alternative_readings:
  - ‘군대’로 직역
  - ‘진영’으로 완화
  - ‘편대’로 번역
  rationale: 민수기 2장의 문맥은 전쟁 서술이 아니라 지파별 배치와 계수이므로, 문맥상 기능을 살리면서도 원문의 조직성을 유지하는 번역이 적절합니다.
  doctrine_reference: 민수기 1–2장 지파 계수와 진영 편제 문맥
