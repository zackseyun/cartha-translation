  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of Issachar.'' The expression is a standard tribal designation and refers to the descendants/members of Issachar, not only male individuals.'
