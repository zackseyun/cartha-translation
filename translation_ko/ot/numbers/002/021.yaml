    text: 히브리어 צָבָא는 ‘군대’나 ‘무리’로도 옮길 수 있습니다. 여기서는 민수기 2장의 진영 및 행군 편성 문맥에서 지파의 군사 편제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 군단
  - 그의 진영
  lexicon: HALOT
  rationale: צָבָא는 여기서 전투군이라기보다 진영 편성 안에서의 지파별 편제이므로, 현대 한국어에서 조직 단위를 자연스럽게 드러내는 ‘부대’로 옮겼습니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그들 가운데서 계수된 자는
  alternatives_korean:
  - 그들 가운데서 شمار된 자는
  - 그들 중 계수된 자는
  - 그들 가운데서 등록된 자는
  lexicon: HALOT
  rationale: פקד의 ‘계수하다/조사하다’ 의미를 살려, 결과 수치를 받는 대상이 ‘그들 가운데서 계수된 자’임을 분명하게 표현했습니다.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  english_pob_choice: thirty-two thousand two hundred
  chosen_korean: 삼만 이천이백 명
  alternatives_korean:
  - 삼십이천이백 명
  - 삼만 이천 이백 명
  lexicon: HALOT
  rationale: 히브리어 수사 구조를 한국어의 일반적인 수량 표현으로 자연스럽게 정리하되, 인원수를 나타내는 ‘명’을 보충했습니다.
theological_decisions:
- issue: צָבָא의 의미 범위
  chosen_reading: ‘부대’로 번역해 군사 조직이면서도 행군·진영 편제라는 문맥을 반영했습니다.
  alternative_readings:
  - 군대
  - 군단
  - 군사 집단
  rationale: 민수기 2장의 맥락은 전투 행위보다 진영 배치와 행군 질서에 있으므로, 과도하게 전투적이거나 제도적인 뉘앙스를 피했습니다.
  doctrine_reference: 민수기 2장 지파 진영 배열 문맥
- issue: 계수의 대상 표기
  chosen_reading: ‘그들 가운데서 계수된 자는’으로 옮겨 수적 결과가 집단 내부에서 산출되었음을 드러냈습니다.
  alternative_readings:
  - 그들 가운데서 شمار된 사람은
  - 그들의 계수는
  rationale: 원문은 단순 총합보다 구성원 전체의 계수 결과를 말하므로, 인물 집합을 보존하는 표현을 택했습니다.
  doctrine_reference: 민수기 1–2장의 인구 계수/편성 문맥
