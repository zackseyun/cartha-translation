theological_decisions:
- issue: צָבָא의 의미 범위
  chosen_reading: ‘부대’로 번역해 군사 조직이면서도 행군·진영 편제라는 문맥을 반영했습니다.
  alternative_readings:
  - 군대
  - 군단
  - 군사 집단
  rationale: 민수기 2장의 맥락은 전투 행위보다 진영 배치와 행군 질서에 있으므로, 과도하게 전투적이거나 제도적인 뉘앙스를 피했습니다.
  doctrine_reference: 민수기 2장 지파 진영 배열 문맥
- issue: 계수의 대상 표기
  chosen_reading: ‘그들 가운데서 계수된 자는’으로 옮겨 수적 결과가 집단 내부에서 산출되었음을 드러냈습니다.
  alternative_readings:
  - 그들 가운데서 شمار된 사람은
  - 그들의 계수는
  rationale: 원문은 단순 총합보다 구성원 전체의 계수 결과를 말하므로, 인물 집합을 보존하는 표현을 택했습니다.
  doctrine_reference: 민수기 1–2장의 인구 계수/편성 문맥
