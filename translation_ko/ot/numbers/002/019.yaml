  lexicon: HALOT
  rationale: פקד는 인구조사 맥락에서 ‘계수되다/조사되다’의 뜻이므로, 군사적 뉘앙스를 유지하면서도 단순한 수량 집계 이상을 드러내는 ‘계수된 자’로 옮겼습니다.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  english_pob_choice: forty thousand and five hundred
