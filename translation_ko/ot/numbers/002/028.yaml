  - 그들 가운데서 소집된 자들은
  lexicon: HALOT
  rationale: פקד의 계수/조사 용법을 따라, 단순한 수량이 아니라 ‘계수된 자들’이라는 수동적 의미를 보존했습니다.
- source_word: אֶחָ֧ד וְאַרְבָּעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת
