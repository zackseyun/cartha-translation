  text: 그리고 그의 부대[a], 곧 그들 가운데서 계수된 이들은[b] 사만 천오백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 여기서 ‘군대’ 또는 ‘진영’으로도 옮길 수 있으며, 계수와 진영 편성의 문맥에서는 조직된 군사 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들에게서 계수된 이들’ 또는 ‘그들의 계수된 이들’입니다.
    reason: lexical_alternative
