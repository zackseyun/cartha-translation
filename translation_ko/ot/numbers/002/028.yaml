translation:
  language: ko
  text: 그리고 그 무리는, 그들 가운데서 계수된 자들이 오만천사백 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 여기서 ‘군대’ 또는 ‘부대’로도 옮길 수 있지만, 계수 문맥에서는 조직된 집단이라는 뜻이 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פקד는 문자적으로는 ‘계수된 것들/사람들’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָא֖וֹ
  english_pob_choice: And his company
  chosen_korean: 그리고 그 무리는
  alternatives_korean:
  - 그리고 그의 군대는
  - 그리고 그의 부대는
  - 그리고 그의 진영은
  lexicon: HALOT
  rationale: צָבָא는 이 절의 계수 문맥에서 전투 자체보다 조직된 단위나 편제를 가리키므로, 군사성을 과하게 드러내지 않으면서도 집단성을 살리는 ‘무리’로 옮겼습니다.
- source_word: וּפְקֻדֵיהֶם
