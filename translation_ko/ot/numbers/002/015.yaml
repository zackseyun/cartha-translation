    reason: lexical_alternative
translation:
  language: ko
  text: 그의 대오와 그들 중에서 계수된 자는 사만오천육백오십 명입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대오’는 כאן의 צָבָא를 군사적 조직 단위로 본 번역입니다. ‘군대’나 ‘부대’도 가능하지만, 이 절의 진영 목록 맥락에서는 ‘대오’가 더 중립적입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 중에서 계수된 자’는 히브리어 פְקֻדֵיהֶם의 계수·호적 의미를 살린 표현입니다. ‘그들로부터 계수된 자들’도 가능합니다.
    reason: lexical_alternative
