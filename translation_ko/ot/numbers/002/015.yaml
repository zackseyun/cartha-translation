  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
  footnotes:
  - marker: a
    text: Or 'and his host' or 'and his army'; the Hebrew term can denote an organized military contingent.
    reason: lexical_alternative
  - marker: b
