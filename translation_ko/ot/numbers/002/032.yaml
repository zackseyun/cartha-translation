revisions:
- from: 이것들은 이스라엘 자손의 조상들의 집에 따른 등록된 사람들입니다[a][b]. 모든 진영의 등록된 사람들은 그들의 분대에 따라 육십만 삼천오백오십 명이었습니다[c].
  to: 이들이 이스라엘 자손 가운데 조상 가문별로 계수된 남자들입니다[a][b]. 모든 진영에서 각 부대별로 계수된 남자들은 모두 육십만 삼천오백오십 명이었습니다[c].
  rationale: 원문의 계수 공식과 부계 가문 및 군사 편제의 의미를 보존하되, 어색한 직역과 지나치게 협소한 현대 군사 용어를 바로잡았습니다. 인구조사의 직접 문맥상 대상이 성인 남성임을 ‘남자들’로 드러냈으며, 이는 별도의 교리적 해석을 더하지 않습니다. 각주 표지는 해당 어휘가 나오는 위치에 유지했습니다.
  reviewer_model: gpt-5.6-terra
