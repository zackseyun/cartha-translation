  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
  footnotes:
  - marker: a
    text: Or 'those counted' or 'registered men' for 'numbered men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by their companies' or 'according to their hosts' for 'by their divisions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들이 이스라엘 자손 가운데 조상 가문별로 계수된 남자들입니다[a][b]. 모든 진영에서 각 부대별로 계수된 남자들은 모두 육십만 삼천오백오십 명이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘등록된 남자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘인들’입니다. 문자적으로는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 부대에 따라’, ‘그들의 군대에 따라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  english_pob_choice: numbered men
  chosen_korean: 등록된 사람들
  alternatives_korean:
  - 계수된 사람들
  - 조사된 사람들
  - 호적에 오른 사람들
  lexicon: HALOT
  rationale: 인구조사·군사편제 문맥에서 פְּקוּדֵי는 단순 숫자화보다 공식적으로 등록·계수된 사람들을 가리키므로, 현대 한국어에서는 ‘등록된 사람들’이 가장 자연스럽고 원문 기능을 잘 드러냅니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 족장적·언약적 관용구를 살리면서도 한국어 성경어법에 맞게 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 조상들의 집에 따른
  alternatives_korean:
  - 그들의 조상들의 집에 따라
  - 가문별로
  - 조상 가문에 따라
  lexicon: HALOT
  rationale: 히브리어의 가부장적 혈통 단위를 그대로 반영하려고 ‘조상들의 집’ 구조를 유지했습니다. ‘가문별로’는 의미는 쉽지만 원문의 관용구가 약해집니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 분대에 따라
  alternatives_korean:
  - 그들의 부대에 따라
  - 그들의 진열대로
  - 그들의 편제로
  lexicon: HALOT
  rationale: צבאות는 여기서 전투 자체보다 조직된 군사 편제를 뜻하므로, 너무 전투적이지 않으면서도 질서 정연함을 보이는 ‘분대’로 옮겼습니다.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  english_pob_choice: six hundred three thousand five hundred fifty
  chosen_korean: 육십만 삼천오백오십 명
  alternatives_korean:
  - 603,550명
  - 육백삼천오십오십 명
  lexicon: HALOT
  rationale: 히브리어 수사는 한국어 성경의 공식 문체에 맞게 한자어 숫자 표기로 풀어 쓰되, 단위를 명시해 인원 수임을 분명히 했습니다.
theological_decisions:
- issue: 인원 표지의 성별 함의
  chosen_reading: ‘등록된 사람들’로 옮기되, 군사 편제 문맥상 성인 남성을 가리키는 집단임을 암시하도록 유지했습니다.
  alternative_readings:
  - 중성화한 ‘등록자들’
  - 직역한 ‘계수된 남자들’
  rationale: 원문과 POB의 census 문맥은 단순 중립적 인구가 아니라 전투 가능한 편제 인원을 가리킵니다. 한국어에서는 ‘사람들’이 가장 자연스럽지만, 문맥상 성별·군사적 함의가 흐려지지 않도록 수량·편제 표현을 보강했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
