  lexicon: HALOT
  rationale: פָּקַד의 수동 분사형은 인구조사에서 ‘계수된/집계된’ 사람들을 가리키므로, 간결하게 ‘계수된 자’로 옮겨 조사 결과의 총합이라는 의미를 살렸습니다.
- source_word: לְמַחֲנֵה דָן
  english_pob_choice: for the camp of Dan
  chosen_korean: દાન 지파 진영에 속한
  alternatives_korean:
