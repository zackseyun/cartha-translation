  lexicon: HALOT
  rationale: נסע는 광야 행진 문맥에서 ‘출발하다/떠나다’가 자연스러우며, לָאַחֲרֹנָה는 행진 순서를 나타내므로 ‘맨 나중에’로 보존했습니다.
- source_word: לְדִגְלֵיהֶם
  english_pob_choice: by their standards
  chosen_korean: 자기들의 표준을 따라
  alternatives_korean:
