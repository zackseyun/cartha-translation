translation:
  language: ko
  text: दान 지파 진영에 속한 모든 계수된 자는 15만 7천 6백 명이었습니다. 그들은 자기들의 표준을 따라 맨 나중에 출발해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 깃발 아래’. 히브리어 용어는 이스라엘 진영 배열에서 사용된 지파의 표준 또는 깃발 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  english_pob_choice: All those counted
  chosen_korean: 모든 계수된 자
  alternatives_korean:
