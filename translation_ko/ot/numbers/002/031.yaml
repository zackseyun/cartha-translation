  lexicon: HALOT
  rationale: 히브리어 수치를 현대 한국어 가독성에 맞게 한글 숫자로 풀어 쓰되, 인구 계수의 인원 수임을 분명히 하기 위해 ‘명’을 붙였습니다.
- source_word: לָאַחֲרֹנָה יִסְעוּ
  english_pob_choice: They shall set out last
  chosen_korean: 맨 나중에 출발해야 합니다
  alternatives_korean:
