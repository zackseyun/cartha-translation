  lexicon: HALOT
  rationale: דֶּגֶל은 지파 진영을 구분하는 표지이므로, 전통적 교회어인 ‘깃발’보다 문맥을 살린 ‘표준’으로 옮겨 진영 질서를 드러냈습니다.
theological_decisions:
- issue: 지파 진영 행진 순서의 규범성
  chosen_reading: 단 지파 진영은 계수 결과가 제시된 뒤, 지정된 질서에 따라 맨 나중에 출발하는 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 역사 정보로만 읽는 번역
  - ‘따라’의 규범성을 약화한 번역
  rationale: 본문은 숫자 보고에 그치지 않고 행진 질서의 준수를 함께 명령하므로, 서술과 규범을 모두 보존하는 표현을 택했습니다.
  doctrine_reference: 민수기 2장의 진영 배열과 광야 행진 질서
