  - દાન 진영을 위한
  lexicon: HALOT
  rationale: לְ는 소속·관계의 뜻을 나타내므로, 단순 소유보다 ‘진영에 속한’으로 옮겨 지파별 진영 구분을 드러냈습니다.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
