  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'under their banners.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by his ancestral house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 이스라엘 자손은 야훼께서 모세에게 명하신 모든 것을 따라 그렇게 했습니다. 곧 그들은 각자 자기 지파의 깃발[a] 아래 진을 쳤고, 각자 자기 씨족[c][b]대로, 곧 자기 조상의 집에 따라 출발했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이스라엘 사람들'입니다. 히브리어는 문자적으로 '이스라엘의 아들들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 깃발 아래'입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그의 조상 집안에 따라'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역 투명성을 살리면서도 한국어 성경체에서 자연스럽고 집단 전체를 가리키는 표현으로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר ... כֵּן ... וְכֵן
  english_pob_choice: according to all that ... so ... and so
  chosen_korean: '...을 따라 그렇게 했습니다. 곧 ... 그렇게 ...'
  alternatives_korean:
  - '...한 대로 ... 그렇게 했습니다'
  - '...대로 ... 또한 ...'
  lexicon: HALOT
  rationale: 명령과 실행의 대응을 보여 주는 반복 구조를 한국어에서도 살려, '그렇게'를 반복해 원문의 대응성을 드러냈습니다.
- source_word: לְדִגְלֵיהֶם
  english_pob_choice: by their standards
  chosen_korean: 자기 지파의 깃발 아래
  alternatives_korean:
  - 자기 표준 아래
  - 자기 깃발들 아래
  lexicon: HALOT
  rationale: דגל은 진영 배열을 표시하는 군기/깃발을 가리키므로, 한국어에서는 '깃발 아래'로 옮겨 군사적·진영적 조직감을 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָיו ... עַל בֵּית אֲבֹתָיו
  english_pob_choice: by his clans ... according to his fathers’ house
  chosen_korean: 각자 자기 씨족대로, 곧 자기 조상의 집에 따라
  alternatives_korean:
  - 각자 자기 가족 단위대로
  - 각자 자기 조상 집안에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 핵가족보다 큰 혈연 단위를 뜻하므로 '씨족'이 적절하고, '조상의 집'은 아버지 집/조상 가문 구조를 비교적 직역적으로 드러냅니다.
