    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임 진영의 모든 계수된 자는 그들의 분대별로 108,100명이었습니다. 그들은 셋째로 출발해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수된 자’는 히브리어 פְּקֻדִים의 인구조사·소집 양쪽 뉘앙스를 함께 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘분대별로’는 צְבָא의 군사적 편성 의미를 현대 한국어로 풀어 옮긴 표현입니다.
    reason: lexical_alternative
