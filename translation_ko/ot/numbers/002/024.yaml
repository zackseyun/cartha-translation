  - 그들은 셋째 순서로 출발합니다
  lexicon: HALOT
  rationale: נסע를 ‘출발하다’로 옮겨 이동의 동작을 분명히 했고, וּשְׁלִשִׁים은 행진 순서의 서수로 자연스럽게 표현했습니다.
