  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
  footnotes:
  - marker: a
    text: Or 'the mustered ones' for 'those counted'; the Hebrew participle can carry both census and military-enrollment nuance.
