  lexicon: HALOT
  rationale: צָבָא의 군사적 편성 의미를 살리되, 현대 한국어에서 읽기 쉬운 ‘분대별로’로 옮겨 행군 편제의 질서를 드러냈습니다.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  english_pob_choice: They shall set out third
  chosen_korean: 그들은 셋째로 출발해야 합니다
  alternatives_korean:
