  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
  footnotes:
  - marker: a
    text: Or 'the mustered ones' for 'those counted'; the Hebrew participle can carry both census and military-enrollment nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'by their hosts' or 'according to their companies' for 'by their divisions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임 진영에 속하여 계수된 모든 사람은[a] 그들의 부대에 따라[b] 모두 108,100명이었습니다. 그들은 셋째로 출발할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수된’은 히브리어 פְּקֻדִים을 옮긴 말입니다. 이 말에는 인구 조사에서 수를 세었다는 뜻과 군사 복무를 위해 등록·소집되었다는 뜻이 함께 담길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부대에 따라’는 히브리어 צִבְאֹתָם을 옮긴 말입니다. 문맥에 따라 ‘군대별로’ 또는 ‘편성별로’라고도 옮길 수 있습니다.
    reason: lexical_alternative
