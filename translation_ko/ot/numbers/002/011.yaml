  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: ko
  text: 그리고 그의 부대, 곧 그 안에서 계수된 자들은 모두 사만육천오백 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''부대''는 여기서 전투 행위 자체보다 지파별로 정렬된 군사적 편제/단위를 가리킵니다.'
    reason: source_note
lexical_decisions:
- source_word: צְבָאוֹ
  english_pob_choice: his company
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 진영
  - 그의 단위
  lexicon: HALOT
  rationale: 수와 진영을 세는 문맥에서 צָבָא는 전투 자체보다 조직된 군사적 편제/부대를 가리키므로, 현대 한국어에서는 '부대'가 가장 자연스럽고 source-direct합니다.
- source_word: וּפְקֻדָיו
  english_pob_choice: those numbered from it
  chosen_korean: 그 안에서 계수된 자들
  alternatives_korean:
  - 그것에서 계수된 자들
  - 그의 계수된 자들
  - 그 안에 등록된 자들
  lexicon: HALOT
  rationale: פקד의 계수·조사 의미를 살려, 총수에 포함된 인원을 밝히는 표현으로 옮겼습니다. '그 안에서'는 대명사의 소속 관계를 자연스럽게 드러냅니다.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  english_pob_choice: forty-six thousand five hundred
  chosen_korean: 사만육천오백 명
  alternatives_korean:
  - 마흔여섯천오백 명
  - 46,500명
  lexicon: HALOT
  rationale: 히브리어 수사의 의미를 표준 한국어 수치 표현으로 옮겼으며, 단위 '명'을 보태 인원 총계를 분명히 했습니다.
theological_decisions:
- issue: 이 절의 계수 표현과 군사적 편제 의미
  chosen_reading: '''부대''와 ''계수된 자들''로 옮겨, 단순 숫자 통계가 아니라 진영·편제 속 인원 집합이라는 뉘앙스를 살렸습니다.'
  alternative_readings:
  - '''군대''로 직역해 전투성을 더 강하게 드러내는 읽기'
  - '''진영''으로 옮겨 더 넓은 캠프 이미지를 주는 읽기'
  rationale: 민수기 2장의 문맥은 전쟁 수행보다 진영 배치와 질서 있는 계수를 보여 주므로, 원문의 조직적·공동체적 성격을 유지하는 번역이 적절합니다.
  doctrine_reference: 민수기 2장 전체의 지파 진영 배치 문맥
- issue: וּפְקֻדָיו의 소속 표시
  chosen_reading: '''그 안에서''를 넣어 계수된 인원이 해당 부대에 속한 총원임을 분명히 했습니다.'
  alternative_readings:
  - 소속을 덜 드러내는 '계수된 자들'
  - 명시적으로 '그의 계수된 자들'이라고 반복하는 읽기
  rationale: 히브리어 대명사 관계를 한국어에서 자연스럽게 풀어 주되, 총수의 귀속 관계가 흐려지지 않게 했습니다.
  doctrine_reference: 본문 의미 전달의 명료성
