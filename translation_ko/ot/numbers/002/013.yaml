  - 그들 가운데서 등록된 자들
  lexicon: HALOT
  rationale: פקד의 계수/조사 의미를 살려, 단순히 숫자만이 아니라 ‘계수된 사람들’이라는 결과를 분명히 드러내기 위해 이렇게 옮겼습니다.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
