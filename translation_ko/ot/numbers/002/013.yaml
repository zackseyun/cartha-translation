  lexicon: HALOT
  rationale: 히브리어 수사는 문자적으로는 ‘아홉과 쉰’의 구조이지만, 현대 한국어의 자연스러운 수사법에 맞춰 정확한 값인 오만구천삼백 명으로 제시했습니다.
