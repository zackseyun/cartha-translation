lexical_decisions:
- source_word: וּצְבָאוֹ
  english_pob_choice: and his division
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 진영
  - 그의 편제
  lexicon: HALOT
  rationale: 이 문맥의 צָבָא는 전투 자체보다 인구조사와 진영 편제 속의 집단 단위를 가리키므로, 현대 한국어에서 가장 자연스럽고 중립적인 ‘부대’로 옮겼습니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그 가운데서 계수된 자들
  alternatives_korean:
  - 그들 가운데서 계수된 자들
  - 그들로부터 계수된 자들
  - 그들 가운데서 등록된 자들
  lexicon: HALOT
  rationale: פקד의 계수/조사 의미를 살려, 단순히 숫자만이 아니라 ‘계수된 사람들’이라는 결과를 분명히 드러내기 위해 이렇게 옮겼습니다.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  english_pob_choice: fifty-nine thousand three hundred
  chosen_korean: 오만구천삼백 명
  alternatives_korean:
  - 구만삼백 명
  - 오십구천삼백 명
  lexicon: HALOT
  rationale: 히브리어 수사는 문자적으로는 ‘아홉과 쉰’의 구조이지만, 현대 한국어의 자연스러운 수사법에 맞춰 정확한 값인 오만구천삼백 명으로 제시했습니다.
theological_decisions:
- issue: 인구조사 문맥에서 צָבָא의 성격
  chosen_reading: 이 항목은 군사적 전투 개념보다 지파별 편제와 계수된 인원을 가리키는 행정적·조직적 표현으로 읽었습니다.
  alternative_readings:
  - 군대
