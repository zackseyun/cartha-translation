id: NUM.2.14
reference: Numbers 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/מַטֵּ֖ה גָּ֑ד וְ/נָשִׂיא֙ לִ/בְנֵ֣י גָ֔ד אֶלְיָסָ֖ף בֶּן רְעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
  footnotes:
  - marker: a
    text: Some manuscripts or parallel passages give the father's name as Deuel (see Num 1:14).
    reason: textual_variant
translation:
  language: ko
  text: 그리고 갓 지파이며, 갓 자손의 지도자는 엘리아삽이니, 르우엘의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/מַטֵּה
  english_pob_choice: And the tribe of
  chosen_korean: 그리고 갓 지파이며
  alternatives_korean:
  - 그리고 갓의 지파이며
  - 그리고 갓 지파가
  lexicon: HALOT
  rationale: 민수기 2장의 진영 배열 문맥에서 מַטֵּה는 물건인 ‘지팡이’가 아니라 지파를 뜻하므로, 자연스러운 한국어로 ‘지파’로 옮겼습니다.
- source_word: וְ/נָשִׂיא
  english_pob_choice: and the leader
  chosen_korean: 지도자는
  alternatives_korean:
  - 두령은
  - 우두머리는
  - 족장은
  lexicon: HALOT
  rationale: 행정적·공적 문맥의 נָשִׂיא는 가문/지파의 대표를 가리키므로, 현대어로 의미가 분명한 ‘지도자’가 적절합니다.
- source_word: לִ/בְנֵי גָד
  english_pob_choice: of the sons of Gad
  chosen_korean: 갓 자손의
  alternatives_korean:
  - 갓의 자손들의
  - 갓 사람들의
  lexicon: HALOT
  rationale: לְ + בְּנֵי의 소속/귀속 관계를 살려 ‘갓 자손의’로 옮겨, 히브리어 문장 구조를 투명하게 반영했습니다.
- source_word: בֶּן רְעוּאֵל
  english_pob_choice: son of Reuel
  chosen_korean: 르우엘의 아들입니다
  alternatives_korean:
  - 르우엘의 아들입니다
  - 르우엘에게서 난 아들입니다
  lexicon: HALOT
  rationale: 표준적인 족보 공식인 ‘아들’로 직역하되, 문장 끝을 합쇼체로 정리했습니다.
theological_decisions:
- issue: 고유명사 רְעוּאֵל의 본문형과 평행본문 변이
  chosen_reading: 본문은 르우엘을 따르되, 다른 본문 전승에서 제시되는 이름형은 각주로 처리하지 않았습니다.
  alternative_readings:
  - 1:14의 평행본문에 따른 드우엘
  - 본문과 평행본문을 조화시킨 절충형
  rationale: 이 절 자체의 MT는 רְעוּאֵל이므로 본문형을 유지하는 것이 우선이며, 별도 각주가 없는 본문 기준 초안에서는 원문형만 반영했습니다.
  doctrine_reference: 본문비평 원칙 / 평행본문 처리
