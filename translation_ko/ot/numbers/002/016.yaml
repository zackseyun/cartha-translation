  text: 르우벤 진영의 등록된 사람은 모두 151,450명이며, 그들의 진영 편제[a]에 따라 행진할 것입니다. 그들은 둘째로 출발합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צבאותם은 이 문맥에서 ‘그들의 회사들/부대들’ 또는 ‘그들의 군대들’의 뜻도 될 수 있습니다.
