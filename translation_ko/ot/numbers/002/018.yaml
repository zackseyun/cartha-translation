  - 그들의 대열에 따라
  - 그들의 군대에 따라
  lexicon: HALOT
  rationale: צָבָא의 조직적·군사적 질서를 살리면서도, 실제 전투보다 편제·배치를 뜻하는 뉘앙스를 반영하기 위해 이렇게 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지휘관
  alternatives_korean:
  - 지도자
  - 우두머리
  - 족장
  lexicon: HALOT
  rationale: 지파 진영의 배치와 연결된 통솔 역할을 나타내므로, 단순한 사회적 ‘지도자’보다 군사·조직적 책임을 드러내는 ‘지휘관’이 더 적절합니다.
- source_word: לִבְנֵי אֶפְרַיִם
  english_pob_choice: of the sons of Ephraim
  chosen_korean: 에브라임 자손의
  alternatives_korean:
