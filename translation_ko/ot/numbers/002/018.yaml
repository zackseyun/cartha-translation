  - 표준
  lexicon: HALOT
  rationale: 군사·진영 배치 맥락에서 דֶּגֶל은 집결과 식별 기능을 가진 표식이므로, 현대 한국어로 가장 자연스럽고 구체적인 ‘깃발’로 옮겼습니다.
