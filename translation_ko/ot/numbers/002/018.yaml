  - 에브라임 지파의
  lexicon: HALOT
  rationale: 직역에 가까운 혈연·지파 언어를 유지해, 단순한 지역명보다 언약 백성의 계보적 표현이라는 점을 보존했습니다.
theological_decisions:
- issue: 지파 진영의 서쪽 배치와 지도자의 병치
  chosen_reading: 본문의 명령형/규정형 성격을 살려, 배치 규정과 지파 지도자 명단을 분리해 전달했습니다.
  alternative_readings:
  - 서술형으로 완화해 '있었습니다'로 옮김
  - 두 절을 하나의 설명문으로 합침
  rationale: 민수기 2장의 진영 배치 규정은 단순한 과거 보고가 아니라 질서 부여의 지시이므로, 한국어에서도 규정의 성격을 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 민수기 2장의 진영 질서와 언약 공동체의 배열
