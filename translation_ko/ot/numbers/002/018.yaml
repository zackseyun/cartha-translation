  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their companies/hosts' for 'by their divisions.' The Hebrew has an ordered military-organizational sense.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of Ephraim,' a tribal designation for the descendants/people of Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임 진영의 깃발은 그들의 부대 편성에 따라 서쪽에 있어야 합니다. 그리고 에브라임 자손의 지휘관은 암미훗의 아들 엘리사마입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘에브라임의 자손’은 지파의 후손/백성을 가리키는 족속 명칭입니다.
    reason: source_note
lexical_decisions:
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
