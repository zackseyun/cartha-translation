source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their companies/hosts' for 'by their divisions.' The Hebrew has an ordered military-organizational sense.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of Ephraim,' a tribal designation for the descendants/people of Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임 진영의 깃발은 그 부대 편성에 따라 서쪽에 배치됩니다. 에브라임 자손[a]의 지도자는 암미훗의 아들 엘리사마입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘에브라임 자손’은 에브라임의 후손, 곧 에브라임 지파의 백성을 가리키는 지파 명칭입니다.
    reason: source_note
lexical_decisions:
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 기치
  - 표준
  lexicon: HALOT
  rationale: 군사·진영 배치 맥락에서 דֶּגֶל은 집결과 식별 기능을 가진 표식이므로, 현대 한국어로 가장 자연스럽고 구체적인 ‘깃발’로 옮겼습니다.
- source_word: מַחֲנֵה
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 진
  - 야영지
  lexicon: HALOT
  rationale: 단순한 야영이 아니라 각 지파가 질서 있게 배치된 집합체를 가리키므로 ‘진영’이 문맥을 더 잘 드러냅니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 부대 편성에 따라
  alternatives_korean:
  - 그들의 부대별로
  - 그들의 대열에 따라
  - 그들의 군대에 따라
  lexicon: HALOT
  rationale: צָבָא의 조직적·군사적 질서를 살리면서도, 실제 전투보다 편제·배치를 뜻하는 뉘앙스를 반영하기 위해 이렇게 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지휘관
  alternatives_korean:
  - 지도자
  - 우두머리
  - 족장
  lexicon: HALOT
  rationale: 지파 진영의 배치와 연결된 통솔 역할을 나타내므로, 단순한 사회적 ‘지도자’보다 군사·조직적 책임을 드러내는 ‘지휘관’이 더 적절합니다.
- source_word: לִבְנֵי אֶפְרַיִם
  english_pob_choice: of the sons of Ephraim
  chosen_korean: 에브라임 자손의
  alternatives_korean:
  - 에브라임 사람들의
  - 에브라임 지파의
  lexicon: HALOT
  rationale: 직역에 가까운 혈연·지파 언어를 유지해, 단순한 지역명보다 언약 백성의 계보적 표현이라는 점을 보존했습니다.
theological_decisions:
- issue: 지파 진영의 서쪽 배치와 지도자의 병치
  chosen_reading: 본문의 명령형/규정형 성격을 살려, 배치 규정과 지파 지도자 명단을 분리해 전달했습니다.
  alternative_readings:
  - 서술형으로 완화해 '있었습니다'로 옮김
  - 두 절을 하나의 설명문으로 합침
  rationale: 민수기 2장의 진영 배치 규정은 단순한 과거 보고가 아니라 질서 부여의 지시이므로, 한국어에서도 규정의 성격을 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 민수기 2장의 진영 질서와 언약 공동체의 배열
