- from: 그러나 남편이 그 말을 들은 날, 그 여자를 제지하고 그녀의 서약과, 곧 그녀가 자기에게 매인 입술의 말까지도 무효로 하면, 야훼께서 그녀를 용서하실 것입니다.[a]
  to: 그러나 만일 남편이 그것을 들은 날에 그녀에게 이의를 제기하고, 그녀에게 효력이 있는 서원과 그녀가 스스로에게 의무를 지운 입술로 한 말을 무효로 하면, 야훼께서 그녀를 용서하실 것입니다.[a]
  rationale: 조건을 명시하는 ‘그러나 만일’을 보완하고, 남편의 행위를 서원에 대한 이의·불허로 자연스럽게 표현했습니다. 이어서 서원과 자기에게 부과한 의무의 발언이라는 두 대상을 모두 ‘무효로 하다’에 연결했습니다. מִבְטָא의 정확한 뉘앙스가 확정적이지 않으므로 본문은 중립적으로 유지하고 각주에서 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:30Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 남편이 듣는 날에 반대하거나 허락하지 않으며, 아내에게 효력이 있는 서원과 그녀가 자신에게 부과한 입술의 발언을 무효로 하는 조건을 말합니다. 초안의 ‘그 여자를 제지하고’는 목적어를 사람 자체로 이해하게 하여, 서원에 대한 법적 불허라는 의미를 충분히 전달하지 못합니다. 또한 ‘자기에게 매인 입술의 말’은 אָסְרָה עַל־נַפְשָׁהּ(스스로에게 의무를 지우다)의 관계를 부정확하고 부자연스럽게 처리합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로, 조건문의 범위와 법적 무효화의 대상을 분명히 합니다. ‘그녀에게 이의를 제기하고’는 원문의 사람 목적어와 불허·반대의 행위를 자연스럽게 보존하며, 뒤의 ‘무효로 하면’이 법적 효력의 취소를 명시합니다.
  terminology: ‘서원’, ‘무효로 하다’, ‘야훼’, ‘용서하시다’는 문맥과 프로젝트의 신명 표기에 적절합니다. מִבְטָא שְׂפָתֶיהָ는 ‘입술로 한 말’로 중립적으로 옮기고, ‘경솔한’ 또는 ‘구속력 있는’이라는 가능한 뉘앙스는 각주에 보존합니다.
