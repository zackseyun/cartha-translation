id: NUM.30.9
reference: Numbers 30:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
  footnotes:
  - marker: a
    text: Or, “the utterance of her lips” or “the binding utterance of her lips.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 남편이 그 말을 들은 날, 그 여자를 제지하고 그녀의 서약과, 곧 그녀가 자기에게 매인 입술의 말까지도 무효로 하면, 야훼께서 그녀를 용서하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘입술의 말’ 또는 ‘입술의 매인 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ... 하면
  alternatives_korean:
  - 그리고 ... 하면
  - 만일 ... 하면
  lexicon: HALOT
  rationale: 앞절과 대조되는 조건을 한국어로 자연스럽게 드러내기 위해 역접 느낌의 ‘그러나’를 살렸습니다.
- source_word: יָנִיא אוֹתָהּ
  english_pob_choice: he forbids her
  chosen_korean: 그 여자를 제지하고
  alternatives_korean:
  - 그녀를 금지하고
  - 그녀를 막고
  - 그녀를 허락하지 않고
  lexicon: HALOT
  rationale: vow 문맥의 נוא는 단순한 ‘반대’보다 효력을 막는 의미가 강하므로, 법적·관계적 강제를 드러내는 ‘제지하다’를 택했습니다.
- source_word: וְהֵפֵר אֶת נִדְרָהּ
  english_pob_choice: and annuls her vow
  chosen_korean: 그녀의 서약과 ... 무효로 하면
  alternatives_korean:
  - 그녀의 서약을 폐기하면
  - 그녀의 서원을 취소하면
  - 그녀의 서약을 무효하게 하면
  lexicon: HALOT
  rationale: הפר는 서원을 ‘깨뜨리다’보다 법적으로 효력을 없애는 뜻이므로, ‘무효로 하다’로 옮겼습니다.
- source_word: מִבְטָא שְׂפָתֶיהָ
  english_pob_choice: the rash utterance of her lips
  chosen_korean: 매인 입술의 말
  alternatives_korean:
  - 입술의 발화
  - 경솔한 입술의 말
  - 입술의 서약
  lexicon: HALOT
  rationale: 이 표현은 확정된 기술어가 아니라 입술로 한 말을 가리키며, 앞뒤의 서원 문맥을 살리면서도 과도한 해석을 피하기 위해 ‘입술의 말’로 두고, 관련성을 ‘매인’으로 반영했습니다.
- source_word: וַיהוָה
  english_pob_choice: the LORD / Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기식 신명 표기를 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 서약을 남편이 무효화할 때의 משפט적 의미
  chosen_reading: 남편이 그 날 들은 뒤 효력을 막고 무효화하는 법적 장면으로 이해했습니다.
  alternative_readings:
  - 단순한 개인적 반대
  - 감정적 질책
  rationale: 본문은 서원의 유효성에 대한 법적 처리에 초점이 있으므로, 관계 갈등보다 효력 상실을 강조하는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: Numbers 30의 서원 규례 문맥
