- from: 그의 아버지가 그녀의 서원이나, 그녀가 자기 몸에 맨 속박을 들었을 때도, 그의 아버지가 그녀에게 아무 말도 하지 않으면, 그녀의 모든 서원은 유효하고, 그녀가 자기 몸에 맨 모든 속박도 유효합니다.[a][b]
  to: 그녀의 아버지가 그녀의 서원이나 그녀가 스스로에게 지운 구속력 있는 의무를[a] 듣고도, 그녀의 아버지가 그녀에게 아무 말도 하지 않으면[b], 그녀의 모든 서원은 유효하며, 그녀가 스스로에게 지운 모든 구속력 있는 의무도 유효합니다.
  rationale: 여성 지시어를 바로잡고, אִסָּר를 ‘서원’과 구별하면서도 현대 한국어에서 자연스러운 ‘구속력 있는 의무’로 수정했습니다. 관용구 ‘자신에게 묶다’는 ‘스스로에게 지운’으로 옮겨 자기 부과성을 보존했으며, 조건절과 각주 앵커를 원문의 논리와 주석 대상에 맞게 정비했습니다.
