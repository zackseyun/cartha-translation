id: NUM.30.5
reference: Numbers 30:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
  footnotes:
  - marker: a
    text: Or 'bond' or 'binding pledge' for 'binding obligation' (Hebrew אִסָּר), a term distinct from 'vow' though closely related.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and her father is silent to her.' The silence signifies non-objection, so the vows remain valid.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 아버지가 그녀의 서원이나 그녀가 스스로에게 지운 구속력 있는 의무를[a] 듣고도, 그녀의 아버지가 그녀에게 아무 말도 하지 않으면[b], 그녀의 모든 서원은 유효하며, 그녀가 스스로에게 지운 모든 구속력 있는 의무도 유효합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִסָּר는 ‘서원’과 구별되는, 스스로에게 지운 구속력 있는 의무를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 아버지가 그녀에게 잠잠하였다’입니다. 이 문맥에서 침묵은 반대하지 않음을 나타내므로, 서원과 의무가 유효하게 남습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  english_pob_choice: vow / vows
  chosen_korean: 서원
  alternatives_korean:
  - 맹세
  - 서약
  lexicon: HALOT
  rationale: נדר는 하나님께 드리는 서원이라는 법적·종교적 의미가 강하므로, 표준 교회어인 ‘서원’을 사용해 원문의 제도적 성격을 살렸습니다.
- source_word: אִסָּר / אִסָּר
  english_pob_choice: binding obligation
  chosen_korean: 속박
  alternatives_korean:
  - 구속
  - 구속된 약정
  - 구속 의무
  lexicon: HALOT
  rationale: אִסָּר은 נדר와 구별되는 자기 부과적 구속을 가리키므로, 둘의 차이를 드러내기 위해 ‘서원’과 다른 표현을 택했습니다. 다만 ‘속박’은 한국어에서 다소 강하게 들릴 수 있어, 법적 구속성을 유지하는 범위 안에서의 선택입니다.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  english_pob_choice: she has bound herself
  chosen_korean: 자기 몸에 맨
  alternatives_korean:
  - 자기 자신에게 묶은
  - 스스로에게 맹세한
  - 자기에게 구속시킨
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘묶다’ 이미지를 살리면서 한국어에서 자연스럽게 읽히도록 ‘자기 몸에 맨’으로 옮겼습니다. 여기서 ‘몸’은 인격 전체를 가리키는 완곡한 표현으로 기능합니다.
- source_word: וְהֶחֱרִישׁ לָהּ
  english_pob_choice: her father says nothing to her
  chosen_korean: 그의 아버지가 그녀에게 아무 말도 하지 않으면
  alternatives_korean:
  - 그의 아버지가 그녀에게 침묵하면
  - 그의 아버지가 그녀를 향해 잠잠하면
  lexicon: HALOT
  rationale: 히브리어의 ‘침묵’은 단순 무반응이 아니라 법적 비동의의 표시이므로, 한국어에서는 판정 효과가 분명한 ‘아무 말도 하지 않으면’으로 풀어 옮겼습니다.
- source_word: וְקָמוּ ... יָקוּם
  english_pob_choice: shall stand
  chosen_korean: 유효하고
  alternatives_korean:
  - 그대로 서 있고
  - 확정되고
  - 유지되고
  lexicon: HALOT
  rationale: 법적 맥락의 קום은 ‘서다’의 물리적 이미지보다 효력의 지속을 뜻하므로, 현대 한국어 법률 감각에 맞는 ‘유효하다’를 사용했습니다.
theological_decisions:
- issue: 서원과 속박의 구별 유지
  chosen_reading: ‘서원’과 ‘속박’을 분리하여 둘 다 효력이 확인되도록 번역했습니다.
  alternative_readings:
  - 둘 다 ‘서원’으로 단일화
  - 둘 다 ‘약속’으로 완화
  rationale: 원문은 נדר와 אִסָּר를 구별하므로, 한국어에서도 같은 단어로 합치면 법적 차이가 사라집니다. POB의 audit trail이 요구하는 구별을 보존했습니다.
  doctrine_reference: 민수기 30장 가정법/서원 규정
