  source_fidelity: 원문의 조건절, 아버지가 듣는 대상(서원과 자신에게 지운 이스사르), 침묵, 그리고 서원과 이스사르의 효력 지속을 모두 유지합니다. 다만 초안의 ‘그의 아버지’는 여성의 아버지를 가리키는 원문과 맞지 않으며, ‘자기 몸에 맨’은 עַל־נַפְשָׁהּ(스스로/자신에게)의 자연스러운 한국어 표현이 아닙니다.
  naturalness: 초안의 ‘들었을 때도’와 뒤따르는 조건절의 연결은 문법적으로 부자연스럽고, ‘속박’ 및 ‘자기 몸에 맨’은 현대 표준 한국어에서 해당 법적·자기부과적 의미를 적절히 전달하지 못합니다. ‘구속력 있는 의무’와 ‘스스로에게 지운’으로 고치면 자연스럽고 의미도 정확해집니다.
  terminology: נֵדֶר는 ‘서원’으로 유지하고, אִסָּר는 서원과 구별하여 ‘구속력 있는 의무’로 옮깁니다. ‘속박’은 외부로부터 받는 억압이나 구금을 주로 뜻하므로 자기 부과적 법적 약정인 אִסָּר의 적절한 대응어가 아닙니다.
