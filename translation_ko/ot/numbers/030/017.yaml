  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה הַֽ/חֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִשְׁתּ֑/וֹ בֵּֽין אָ֣ב לְ/בִתּ֔/וֹ בִּ/נְעֻרֶ֖י/הָ בֵּ֥ית אָבִֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
  footnotes:
  - marker: a
    text: Or, more literally, “between a man and his wife, and between a father and his daughter.”
    reason: lexical_alternative
  - marker: b
    text: “In her youth” refers to the period when the daughter is still living in her father’s household.
    reason: cultural_note
translation:
  language: ko
  text: 이것들은 야훼께서 모세에게 명하신 규례들입니다. 곧 남자와 그의 아내 사이, 그리고 아버지와 그의 딸 사이에 관한 것이며, 딸이 아직 아버지의 집에서 젊은 시절에 있을 때에 관한 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “남자와 그의 아내 사이, 그리고 아버지와 그의 딸 사이”입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은 시절’은 딸이 아직 아버지의 집에 머무는 시기를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה / הַחֻקִּים
  english_pob_choice: These are the statutes
  chosen_korean: 이것들은 … 규례들입니다
  alternatives_korean:
  - 이것들은 … 규정들입니다
  - 이것들은 … 법규들입니다
  lexicon: HALOT
  rationale: 서두의 복수 지시어와 법률 문맥을 살려 ‘이것들’과 ‘규례들’로 옮겼습니다. ‘규례’는 חֻקִּים의 고정된 법적 성격을 비교적 직접적으로 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대치어보다 고유명사 음역인 ‘야훼’로 옮겨, 본문이 직접 가리키는 언약 이름을 보존했습니다.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ / בֵּין אָב לְבִתּוֹ
  english_pob_choice: concerning a man and his wife / and concerning a father and his daughter
  chosen_korean: 남자와 그의 아내 사이, 그리고 아버지와 그의 딸 사이
  alternatives_korean:
  - 남자와 그의 아내에 대하여, 그리고 아버지와 그의 딸에 대하여
  - 남편과 아내 사이, 그리고 아버지와 딸 사이
  lexicon: HALOT
  rationale: בֵּין의 관계 범위를 한국어 법률식으로 자연스럽게 드러내기 위해 ‘사이’로 유지했습니다. EN POB의 ‘concerning’처럼 풀이하지 않고, 원문의 대칭 구조를 살렸습니다.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  english_pob_choice: in her youth ... in her father's house
  chosen_korean: 딸이 아직 아버지의 집에서 젊은 시절에 있을 때
  alternatives_korean:
  - 딸이 아직 젊고 아버지의 집에 있을 때
  - 딸이 아직 아버지의 집에 있는 젊은 시절에
  lexicon: HALOT
  rationale: ‘젊은 시절’은 נְעוּרִים의 시간적 범위를 살리면서도 현대 한국어에서 자연스럽습니다. ‘아버지의 집’은 종속적 거주·권위 관계를 보존합니다.
theological_decisions:
- issue: בֵּין 반복의 법적 기능
  chosen_reading: 두 개의 관계 영역을 가리키는 반복 구조로 보고, 번역에서도 대칭성과 법적 범주화를 유지했습니다.
  alternative_readings:
  - 단순히 두 관계를 나열하는 표현으로 평탄화
  - ‘대하여’ 중심의 해설적 문장으로 변환
  rationale: 이 절은 규례의 적용 범위를 요약하는 결론문이므로, בֵּין의 반복이 지닌 구조적 균형을 살려야 본문의 법적 요지가 분명해집니다.
  doctrine_reference: Translation philosophy §4 — source structure and legal precision
