  source_fidelity: 수정이 필요합니다. אִישָׁהּ는 ‘그 여자의 남편’인데 초안의 ‘그의 남편’은 남성 소유자를 뜻할 수 있어 지시 대상과 성이 어긋납니다. 또한 מִיּוֹם אֶל־יוֹם은 단순한 매일의 반복보다 날이 지나도록 지속되는 침묵을 가리키므로 이를 명확히 했습니다. לָהּ는 법적 비이의의 대상인 여성을 나타내므로 ‘그 여자에게 아무 말도 하지 않다’로 자연스럽게 반영했습니다.
  naturalness: ‘정말로 잠잠하면’과 ‘그녀 위에 있는’은 현대 표준어 법적 문맥에서 다소 직역투입니다. ‘날이 갈수록 계속 아무 말도 하지 않으면’, ‘그 여자에게 있는’ 및 ‘유효하게 하다’가 명료하고 자연스럽습니다.
  terminology: נֶדֶר는 ‘서원’으로 유지했습니다. אֱסָרִים은 일반적 ‘의무’만으로는 자발적으로 자신을 구속하는 약정이라는 특성이 약해지므로 ‘구속력 있는 약정’으로 옮기고 해당 어휘에 각주를 붙였습니다. הֵקִים은 이 문맥의 법적 효력을 살려 ‘유효하게 하다’로 번역했습니다.
