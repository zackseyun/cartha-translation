  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
  footnotes:
  - marker: a
    text: Or 'all her binding pledges' for 'all her obligations.' The Hebrew term refers to commitments that bind the person who makes them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 여자의 남편이 날이 갈수록 계속 그 여자에게 아무 말도 하지 않으면, 그는 그 여자의 모든 서원이나 그 여자에게 있는 모든 구속력 있는 약정[a]을 유효하게 합니다. 그가 그것들을 유효하게 한 것은, 그가 들은 날에 그 여자에게 아무 말도 하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱסָרֶיהָ는 문자적으로 ‘그녀의 결박들’에 가깝습니다. 이 문맥에서는 사람이 스스로에게 지운 구속력 있는 약정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  english_pob_choice: indeed keeps silent
  chosen_korean: 정말로 잠잠하면
  alternatives_korean:
  - 완전히 잠잠하면
  - 계속 잠잠하면
  lexicon: HALOT
  rationale: 부정적 허용이 아니라 법적 묵인이라는 점을 살리면서, 히브리어의 강조를 한국어 자연문으로 옮겼습니다.
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그녀의 남편
  - 그의 사람
  lexicon: HALOT
  rationale: 결혼 관계의 법적 문맥이므로 「남편」이 가장 정확하며, 소유격은 한국어에서 자연스럽게 풀어 옮겼습니다.
- source_word: נְדָרֶיהָ / אֱסָרֶיהָ
  english_pob_choice: all her vows or all her obligations
  chosen_korean: 모든 서원이나 모든 의무
  alternatives_korean:
  - 모든 서원이나 모든 결박된 약속
  - 모든 서원이나 모든 결속 의무
  lexicon: HALOT
  rationale: נדר는 통상 「서원」으로, אֱסָר는 묶어 두는 약정이라는 법적 뉘앙스를 갖지만 문맥상 읽기 쉬운 「의무」로 풀었습니다.
- source_word: וְהֵקִים / הֵקִים אֹתָם
  english_pob_choice: then he confirms / he has confirmed them
  chosen_korean: 확정합니다 / 확정한 것입니다
  alternatives_korean:
  - 세웁니다 / 세운 것입니다
  - 유지합니다 / 유지한 것입니다
  lexicon: HALOT
  rationale: 히필형 קום의 법적 의미인 「서게 하다, 유효하게 하다」를 한국어 법문체에 맞게 「확정하다」로 옮겼습니다.
- source_word: כִּי הֶחֱרִשׁ לָהּ בְּיוֹם שָׁמְעוֹ
  english_pob_choice: because he kept silent on the day he heard
  chosen_korean: 그가 들은 날에 그녀에게 잠잠했기 때문에
  alternatives_korean:
  - 그가 들은 날 그녀에게 아무 말도 하지 않았기 때문에
  - 그가 들은 날에 그녀 앞에서 침묵했기 때문에
  lexicon: HALOT
  rationale: 반복되는 「침묵」 모티프를 살리되, לָהּ를 한국어에서 자연스럽게 「그녀에게」로 처리해 법적 묵인을 드러냈습니다.
theological_decisions:
- issue: 법적 묵인의 효력 표현
  chosen_reading: 남편의 침묵이 서원과 의무를 실제로 유효하게 만드는 것으로 번역했습니다.
  alternative_readings:
  - 남편이 이를 인정한 것으로 번역
  - 남편이 이를 허락한 것으로 번역
  rationale: 본문은 단순한 감정적 동의가 아니라 법적 효력 발생을 말하므로, 성경 본문의 제도적 의미를 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 맥락상 서원 규정의 법적 효력
