  to: 한 남자가 야훼께 서원을 하거나, 맹세하여 자신에게 구속력 있는 의무를 지웠으면[a], 그는 자기 말을 어기지 말아야 합니다[b]. 그는 자기 입에서 나온 모든 대로 행해야 합니다.
