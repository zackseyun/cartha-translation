  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
  footnotes:
  - marker: a
    text: Or, 'to bind himself by an obligation.' The Hebrew expression is literally 'to bind a binding obligation upon himself.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he shall not profane his word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 야훼께 서원을 하거나, 맹세로 자기에게 묶이는 의무를 맺었으면, 그는 자기 말을 어기지 말아야 합니다. 그는 입에서 나온 모든 것을 그대로 행해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘자기 위에 결박 의무를 묶다’라는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘자기 말을 더럽히지(성스럽지 않게 하지) 말라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 남자가
  - 어떤 사람이
  lexicon: HALOT
  rationale: 법률 문맥의 일반적 주어를 한국어로 자연스럽게 옮기되, 성별 표지를 굳이 전면화하지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 원문 하나님의 이름 יהוה를 프로젝트 기본값인 ‘야훼’로 직접 옮겼습니다.
- source_word: לֶאְסֹר אִסָּר
  english_pob_choice: to bind himself by a pledge
  chosen_korean: 자기에게 묶이는 의무를 맺었으면
  alternatives_korean:
  - 자기에게 묶는 서약을 했으면
  - 자기에게 묶이는 맹세를 했으면
  lexicon: HALOT
  rationale: 히브리어의 ‘묶다/결박하다’와 명사 אִסָּר의 자가구속 의미를 살리면서, 한국어에서 법적 효력을 드러내는 표현으로 옮겼습니다.
- source_word: לֹא יַחֵל דְּבָרוֹ
  english_pob_choice: he shall not break his word
  chosen_korean: 자기 말을 어기지 말아야 합니다
  alternatives_korean:
  - 자기 말을 더럽히지 말아야 합니다
  - 자기 말을 깨뜨리지 말아야 합니다
  lexicon: HALOT
  rationale: 직역의 ‘더럽히다’는 주석적 뉘앙스가 강하므로, 본문의 법적 의미인 ‘어기다/깨다’를 현대 한국어로 분명하게 전했습니다.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו
  english_pob_choice: according to all that has gone out from his mouth
  chosen_korean: 입에서 나온 모든 것을 그대로
  alternatives_korean:
  - 입에서 나온 모든 말대로
  - 입으로 낸 모든 것을 따라
  lexicon: HALOT
  rationale: ‘입에서 나온’이라는 구체적 이미지를 보존하되, 한국어 문맥에서는 ‘그대로’가 전체 준수의 요구를 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 하나님의 이름 יהוה의 음역
  chosen_reading: 야훼로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 계약명 יהוה를 직접 사용하므로, 번역 전통어 ‘주님’보다 स्रोत 기반 음역을 택해 신명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
