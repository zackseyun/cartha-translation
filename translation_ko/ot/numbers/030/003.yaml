  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
  footnotes:
  - marker: a
    text: Or, 'to bind himself by an obligation.' The Hebrew expression is literally 'to bind a binding obligation upon himself.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he shall not profane his word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 남자가 야훼께 서원을 하거나, 맹세하여 자신에게 구속력 있는 의무를 지웠으면[a], 그는 자기 말을 어기지 말아야 합니다[b]. 그는 자기 입에서 나온 모든 대로 행해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘자신 위에 결박 의무를 묶다’라는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘자기 말을 속되게 하지 말라’입니다.
    reason: lexical_alternative
