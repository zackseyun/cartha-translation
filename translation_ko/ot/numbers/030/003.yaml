  source_fidelity: 수정이 필요합니다. אִישׁ는 이 법규의 남성 단수 주어이므로 ‘한 남자’로 보존하는 것이 원문에 더 충실합니다. 또한 לֶאְסֹר אִסָּר עַל־נַפְשׁוֹ는 자신에게 구속력 있는 의무를 부과하는 행위를 뜻하는데, 현행 ‘자기에게 묶이는 의무를 맺었으면’은 의무가 주어에게 묶이는 것처럼 읽혀 관계와 의미가 불명확합니다.
  naturalness: ‘맹세로 자기에게 묶이는 의무를 맺었으면’은 현대 한국어에서 어색하고 법적·서원적 의미가 선명하지 않습니다. ‘맹세하여 자신에게 구속력 있는 의무를 지웠으면’은 자연스러우면서도 자기부과의 의미를 보존합니다. 각주 표지는 해당 표현 바로 뒤에 배치하는 것이 독해와 구조 면에서 적절합니다.
  terminology: ‘야훼’, ‘서원’, ‘맹세’, ‘자기 말을 어기지 말아야 합니다’는 적절합니다. יַחֵל의 문자적 의미를 설명하는 각주는 ‘더럽히다’보다 ‘속되게 하다’ 또는 ‘훼손하다’가 더 정확합니다. ‘성스럽지 않게 하지’는 한국어상 부정의 범위가 불명확하므로 피해야 합니다.
