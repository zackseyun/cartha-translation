  - 주
  rationale: 본문은 신명기적 언약명 יְהוָה를 직접 사용하므로, 인격적 고유성을 유지하기 위해 칭호인 ‘주’가 아니라 음역형 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'Project default: יהוה / YHWH → 야훼'
