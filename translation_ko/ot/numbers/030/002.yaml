reference: Numbers 30:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “the Israelites.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “This is what the LORD has commanded.” Hebrew “This is the word that the LORD has commanded.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 이스라엘 자손의 지파의 우두머리들에게 말하여 이르되, "이것이 야훼께서 명령하신 말씀입니다:"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로는 “이스라엘의 아들들”입니다. 더 관용적으로는 “이스라엘 사람들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 “야훼께서 명령하신 말씀”이라는 형식입니다. 더 자연스럽게는 “야훼께서 명령하신 것이 이것입니다”라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말하여 이르되
  alternatives_korean:
  - 그리고 ... 말하여 이르되
  - 말하였다
  lexicon: WLC / HALOT
  rationale: 와우 연속의 서술 진행을 살리면서 한국어에서 자연스럽게 시간적 전개를 드러내기 위해 ‘그때’로 옮겼고, 직접화법 도입은 구어적이되 격식을 지키는 ‘말하여 이르되’로 처리했습니다.
- source_word: רָאשֵׁי הַמַּטּוֹת
  english_pob_choice: the heads of the tribes
  chosen_korean: 지파의 우두머리들
  alternatives_korean:
  - 지파들의 머리들
  - 지파의 지도자들
  lexicon: WLC / HALOT
  rationale: ‘ראשֵׁי’의 직역적 이미지인 ‘머리들’을 한국어에서 자연스럽게 풀어 주되, 통치·대표 기능을 드러내는 ‘우두머리들’을 택해 부족 단위의 대표자라는 구조를 보존했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: of the sons of Israel
  chosen_korean: 이스라엘 자손의
  alternatives_korean:
  - 이스라엘의 자손에게
  - 이스라엘 사람들의
  lexicon: WLC / HALOT
  rationale: 문법적으로 ‘~에게’가 아니라 앞말을 수식하는 속격 구조이므로, POB의 성별-정확성을 따라 관용적 ‘이스라엘 자손의’로 유지했습니다.
- source_word: זֶה הַדָּבָר
  english_pob_choice: This is the word
  chosen_korean: 이것이 ... 말씀입니다
  alternatives_korean:
  - 이것이 ... 말입니다
  - 이것이 ... 일입니다
  lexicon: WLC / HALOT
  rationale: דָּבָר는 여기서 단순한 ‘것’보다 권위 있는 전달된 언어를 가리키므로 ‘말씀’으로 옮겨 하나님의 명령 선포라는 성격을 살렸습니다.
- source_word: צִוָּה יְהוָה
  english_pob_choice: Yahweh has commanded
  chosen_korean: 야훼께서 명령하신
  alternatives_korean:
  - 여호와께서 명령하신
  - 주께서 명령하신
  lexicon: WLC / HALOT
  rationale: 신명기적·언약적 고유명사 יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 옮겼고, 완결된 명령을 나타내는 완료형은 한국어 관용에 맞게 관형사형으로 처리했습니다.
theological_decisions:
- issue: 여호와/주 대신 יהוה를 어떻게 옮길 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신명기적 언약명 יְהוָה를 직접 사용하므로, 인격적 고유성을 유지하기 위해 칭호인 ‘주’가 아니라 음역형 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'Project default: יהוה / YHWH → 야훼'
