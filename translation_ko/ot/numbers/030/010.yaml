  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
  footnotes:
  - marker: a
    text: Or 'shall be binding on her' for 'shall stand against her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 과부나 이혼한 여인의 서원—곧 그녀가 자기 자신에게 매어 놓은 모든 것—은 그녀에게 대하여 유효합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀에게 구속력이 있다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  english_pob_choice: vow
  chosen_korean: 서원
  alternatives_korean:
  - 맹세
  - 서약
  lexicon: HALOT
  rationale: 법적·종교적 맥락의 נדר를 한국어 성경 용례에 맞게 ‘서원’으로 옮겨, 하나님 앞에서의 자발적 의무라는 의미를 살렸습니다.
- source_word: וּ/גְרוּשָׁה
  english_pob_choice: divorced woman
  chosen_korean: 이혼한 여인
  alternatives_korean:
  - 이혼녀
  - 버림받은 여인
  lexicon: HALOT
  rationale: 분사형이 가리키는 상태를 법적·설명적으로 드러내기 위해 ‘이혼한 여인’을 택했습니다.
- source_word: כֹּל אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  english_pob_choice: everything by which she has bound herself
  chosen_korean: 곧 그녀가 자기 자신에게 매어 놓은 모든 것
  alternatives_korean:
  - 그녀가 스스로 묶어 둔 모든 것
  - 그녀가 자기에게 맺은 모든 서원
  lexicon: HALOT
  rationale: ‘묶다/매다’의 본뜻을 살려 자발적으로 자신에게 지운 의무라는 법적 뉘앙스를 보존했습니다.
- source_word: יָקוּם עָלֶיהָ
  english_pob_choice: shall stand against her
  chosen_korean: 그녀에게 대하여 유효합니다
  alternatives_korean:
  - 그녀에게 대하여 서 있습니다
  - 그녀에게 구속력을 가집니다
  lexicon: HALOT
  rationale: 법적 문맥의 יקום을 ‘유효하다’로 옮겨, 서원이 계속 효력을 가진다는 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 여성의 서원에 대한 법적 효력 표현
  chosen_reading: ‘서원’이 ‘그녀에게 대하여 유효합니다’로 남아, 자발적 서약이 취소되지 않고 법적 효력을 유지함을 드러냈습니다.
  alternative_readings:
  - ‘그녀에게 구속력이 있습니다’
  - ‘그녀에게 매여 있습니다’
  rationale: 본문의 초점은 윤리적 평가보다 서원의 지속적 효력에 있으므로, 전통적 신앙어보다 법적 의미를 직접 드러내는 표현을 택했습니다.
  doctrine_reference: 민수기 30장 서원 규례
