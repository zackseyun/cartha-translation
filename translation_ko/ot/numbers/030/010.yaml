revisions:
- from: 그리고 과부나 이혼한 여인의 서원—곧 그녀가 자기 자신에게 매어 놓은 모든 것—은 그녀에게 대하여 유효합니다.[a]
  to: 과부나 이혼한 여인이 한 서원, 곧 그 여인이 자신에게 지운 모든 것은 그 여인에게 구속력이 있습니다.[a]
  rationale: 서원 규정의 법적 효력이 해당 여인에게 계속 적용됨을 분명히 하도록 יָקוּם עָלֶיהָ를 ‘그 여인에게 구속력이 있습니다’로 고쳤습니다. 또한 자기 자신을 ‘매어 놓다’라는 직역을 자신에게 의무를 지운다는 자연스러운 한국어 표현으로 다듬었습니다. 본문의 포괄 표현(‘모든 것’)과 서원의 법적 성격은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:44:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 법적 의미는 대체로 반영했지만, ‘그녀에게 대하여 유효합니다’는 עָלֶיהָ가 나타내는 그 여인에게 부과되는 구속력을 충분히 드러내지 못하며 한국어로도 다소 부자연스럽습니다. אָסְרָה עַל־נַפְשָׁהּ는 자신에게 부과한 의무를 뜻하므로 이를 명시하는 편이 정확합니다.
  naturalness: ‘그녀가 자기 자신에게 매어 놓은 모든 것’과 ‘그녀에게 대하여 유효합니다’는 직역투입니다. ‘자신에게 지운 모든 것’ 및 ‘그 여인에게 구속력이 있습니다’가 현대 표준 한국어의 법적 문맥에서 더 자연스럽고 명료합니다.
  terminology: נֵדֶר의 ‘서원’, אַלְמָנָה의 ‘과부’, גְרוּשָׁה의 ‘이혼한 여인’은 적절합니다. יָקוּם עָלֶיהָ는 ‘구속력이 있다’로 옮겨 해당 서원이 그 여인에게 계속 효력을 가진다는 뜻을 보존합니다.
