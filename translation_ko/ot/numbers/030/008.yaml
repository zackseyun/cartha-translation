id: NUM.30.8
reference: Numbers 30:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
  footnotes:
  - marker: a
    text: Or 'and says nothing to her.' The Hebrew idiom 'is silent toward her' indicates that the husband does not object, so the vow remains valid.
    reason: lexical_alternative
  - marker: b
    text: Or 'her bonds' or 'her obligations.' The Hebrew term refers to binding commitments she has placed upon herself.
    reason: lexical_alternative
translation:
  language: ko
  text: 남편이 그것을 들은 날에 듣고도 그녀에게 잠잠하면, 그녀의 서원은 서고, 그녀가 자기에게 묶어 둔 서약의 의무도 서게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣고도 잠잠하다’는 남편이 반대 의사를 밝히지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서다’는 여기서 법적으로 유효하게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע / בְּיוֹם שָׁמְעוֹ
  english_pob_choice: And if her husband hears ... on the day he hears
  chosen_korean: “남편이 그것을 들은 날에”
  alternatives_korean:
  - 그가 그것을 들을 때
  - 그가 들은 날에
  lexicon: WLC / HALOT
  rationale: 법률 문맥의 조건절과 시간표현을 자연스럽게 살리되, 중복된 ‘듣다’를 한국어에서는 ‘들은 날에’로 압축해 원문의 시간 제한을 보존했습니다.
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 남편
  alternatives_korean:
  - 그 남자
  - 그의 남자
  lexicon: HALOT
  rationale: 문맥이 결혼법이므로 אִישׁ은 일반적인 ‘남자’가 아니라 ‘남편’으로 옮기는 것이 정확합니다.
- source_word: וְהֶחֱרִישׁ לָהּ
  english_pob_choice: and is silent toward her
  chosen_korean: “듣고도 그녀에게 잠잠하면”
  alternatives_korean:
  - 그녀에게 아무 말도 하지 않으면
  - 그녀에게 반대하지 않고 잠잠하면
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞게 옮기되, 단순 무언(無言)이 아니라 이의 제기를 하지 않는 법적 묵인을 드러냈습니다.
- source_word: נְדָרֶיהָ / וֶאֱסָרֶהָ
  english_pob_choice: her vows / her binding obligations
  chosen_korean: “그녀의 서원은 서고, 그녀가 자기에게 묶어 둔 서약의 의무도 서게 됩니다”
  alternatives_korean:
  - 그녀의 서원과 묶인 의무는 유효하게 됩니다
  - 그녀의 서원과 속박의 의무도 유지됩니다
  lexicon: HALOT
  rationale: נדרים은 통상 ‘서원’으로, אסר 계열은 단순 ‘약속’보다 결박의 의미가 살아 있는 ‘묶어 둔 서약의 의무’로 옮겨 법적 구속력을 드러냈습니다.
- source_word: נַפְשָׁהּ
  english_pob_choice: upon herself
  chosen_korean: “자기에게”
  alternatives_korean:
  - 자기 자신에게
  - 그녀의 생명 위에
  lexicon: HALOT
  rationale: נפש는 여기서 영혼이 아니라 자기 자신을 가리키므로, 한국어 반사형으로 처리해 의미를 정확히 살렸습니다.
theological_decisions:
- issue: 서원/서약의 법적 유효성 표현
  chosen_reading: ‘서고’로 반복해 원문의 법적 확정 의미를 유지했습니다.
  alternative_readings:
  - ‘유효하게 됩니다’
  - ‘유지됩니다’
  rationale: קוּם의 반복을 한국어에서도 같은 동사 ‘서다’로 재현해, 남편의 침묵이 곧 서원의 유효성 확인이 된다는 법정적 구조를 보존했습니다.
  doctrine_reference: 민수기 30장의 서원 규례 문맥
