  lexicon: WLC / HALOT
  rationale: 법률 문맥의 조건절과 시간표현을 자연스럽게 살리되, 중복된 ‘듣다’를 한국어에서는 ‘들은 날에’로 압축해 원문의 시간 제한을 보존했습니다.
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 남편
  alternatives_korean:
  - 그 남자
