source:
  edition: WLC
  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
  footnotes:
  - marker: a
    text: Or 'and says nothing to her.' The Hebrew idiom 'is silent toward her' indicates that the husband does not object, so the vow remains valid.
    reason: lexical_alternative
  - marker: b
    text: Or 'her bonds' or 'her obligations.' The Hebrew term refers to binding commitments she has placed upon herself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 남편이 그것을 들은 날에 그 여자에게 아무 말도 하지 않으면,[a] 그 여자의 서원은 유효하고, 그 여자가 자신에게 지운 구속적 의무들도 유효합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 여자에게 잠잠하면’입니다. 이 표현은 남편이 반대하지 않음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구속적 의무들’은 그 여자가 자신에게 지운 결박 또는 의무를 가리킵니다. ‘유효하다’는 원문의 ‘서다’라는 법률적 표현을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע / בְּיוֹם שָׁמְעוֹ
  english_pob_choice: And if her husband hears ... on the day he hears
  chosen_korean: “남편이 그것을 들은 날에”
  alternatives_korean:
