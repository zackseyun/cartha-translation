source:
  edition: WLC
  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
  footnotes:
  - marker: a
    text: Or 'surely annuls them' or 'completely annuls them'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Bear her guilt'' may also be understood as ''bear responsibility for her iniquity'' or ''bear the punishment for her guilt.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그가 그것들을 들은 뒤에 반드시 무효로 한다면,[a] 그는 그 여인의 죄과를 져야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 유한동사를 함께 써서 ‘무효로 하다’라는 행위를 강하게 강조합니다.
    reason: source_note
  - marker: b
    text: ‘그 여인의 죄과를 지다’는 그 여인의 죄에 대한 책임을 지거나, 그 죄과에 따르는 결과를 감당한다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ~하면
  alternatives_korean:
  - 그리고 만일 ~하면
  - 만일 ~하면
  lexicon: HALOT
  rationale: 앞 절과의 조건적 대조를 드러내기 위해 단순 조건문보다 역접 뉘앙스가 있는 ‘그러나’를 살렸습니다.
- source_word: הָפֵר יָפֵר
  english_pob_choice: does indeed nullify
  chosen_korean: 정말로 무효로 하면
  alternatives_korean:
  - 분명히 무효로 하면
  - 완전히 취소하면
  - 깨뜨리면
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+완전동사)을 한국어의 ‘정말로’로 자연스럽게 반영하되, 서원/서약 법맥락에 맞게 ‘무효로 하다’를 택했습니다.
- source_word: אַחֲרֵי שָׁמְעוֹ
  english_pob_choice: after he has heard of them
  chosen_korean: 그것들을 들은 뒤에
  alternatives_korean:
  - 그것들을 들은 후에
  - 그것들에 대해 들은 뒤에
  lexicon: HALOT
  rationale: 문맥상 서약을 들은 뒤의 사후 행위를 말하므로, 한국어에서는 중복 설명을 줄여 ‘들은 뒤에’로 간명하게 옮겼습니다.
- source_word: עֲוֺנָהּ
  english_pob_choice: her guilt
  chosen_korean: 그 여인의 죄책
  alternatives_korean:
  - 그 여인의 죄
  - 그 여인의 죄과
  - 그 여인의 불의
  lexicon: HALOT
  rationale: ‘죄책’은 책임과 죄의 부담을 함께 드러내어, 본문의 법적·도덕적 부담 전가를 비교적 정확히 전달합니다.
theological_decisions:
- issue: “그는 그 여인의 죄책을 져야 합니다”의 책임 전가 의미
  chosen_reading: 서원을 뒤늦게 무효로 만든 남자가 그 결과에 대한 책임을 떠맡는다는 뜻으로 이해했습니다.
  alternative_readings:
  - 그가 그 여인의 죄에 대한 형벌을 받는다는 뜻
  - 그가 그 여인의 서원 파기의 책임을 진다는 뜻
  rationale: נשׂא עון은 책임·유책성·그 결과를 ‘지다’는 관용적 표현으로 넓게 가질 수 있어, 본문이 말하는 법적 책임 전가를 유지했습니다.
  doctrine_reference: 본문의 법적 책임 구조를 지나치게 형벌론으로 좁히지 않고 긴장을 보존합니다.
