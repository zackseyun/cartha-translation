  source_fidelity: 핵심 조건문과 법적 결과는 잘 반영되어 있습니다. 다만 עָוֹן을 ‘죄책’으로 옮기면 현대 한국어에서 주로 주관적인 guilt feeling을 뜻할 수 있어, 법적·도덕적 책임 또는 죄과를 지는 히브리어 관용구의 범위가 다소 좁아집니다. 또한 영어 POB의 ‘bear her guilt’에 관한 해석 가능성을 각주로 보존하는 편이 적절합니다.
  naturalness: ‘정말로’는 강조를 전달하지만 이 법률적·격식적 문맥에서는 ‘반드시’가 더 자연스럽고 절제된 합쇼체 문체에 맞습니다. 반복된 ‘그것들을’은 목적어를 두 번째 동사에서 생략하여 자연스럽게 다듬을 수 있습니다.
  terminology: הָפֵר는 서원 관련 법문에서 ‘무효로 하다’가 적절합니다. עָוֹן은 ‘죄과’로 옮겨 ‘지다’와 자연스럽게 결합시키며, 책임과 그 결과라는 폭넓은 의미를 유지합니다.
