review_pass:
  verdict: revise
  source_fidelity: 히브리어의 조건절, 남편의 무효화, 발화된 서약과 자기 자신에게 부과한 결속 의무의 포괄성, 법적 효력의 상실, 그리고 야훼의 용서라는 흐름은 대체로 반영되었습니다. 그러나 ‘그 소식’은 원문에 없는 목적어를 보태며, ‘무엇이든 … 하나도 서지 못합니다’는 원문의 ‘모든 것’과 법적 유효성 표현을 한국어에서 부자연스럽게 처리합니다.
  naturalness: 현대 격식체로 ‘정말로 무효로 하면’은 다소 구어적이고 어색합니다. ‘무효로 선언하면’과 ‘유효하지 않습니다’가 법률적 문맥에 더 자연스럽고 정확합니다. 각주 표지도 해당 표현 및 신명에 직접 붙이는 편이 독자의 이해에 적절합니다.
  terminology: נדר는 ‘서약’, אִסַּר נַפְשָׁהּ는 ‘자기 자신에게 지운 결속 의무’로 옮겨 자기결속의 의미를 보존했습니다. יהוה는 초안의 프로젝트 관례에 따라 ‘야훼’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그 소식’
    rationale: בְּיוֹם שָׁמְעוֹ는 직역하면 ‘그가 들은 날에’이며, 여기에는 ‘소식’이라는 명시적 목적어가 없습니다. 문맥상 서약을 듣는 일이지만, 이를 본문에 보태지 않는 편이 원문에 충실합니다.
  - severity: medium
    issue: ‘정말로 무효로 하면’
    rationale: 강조 부정사+미완료형의 강조는 살릴 수 있으나 ‘정말로’는 법률·성경 문체에서 구어적입니다. ‘반드시 무효로 선언하면’이 강조와 법적 행위를 더 자연스럽게 드러냅니다.
  - severity: medium
    issue: ‘그녀의 입에서 나온 것이 무엇이든 … 하나도 서지 못합니다’
    rationale: כָּל מוֹצָא שְׂפָתֶיהָ는 그녀의 입술에서 나온 ‘모든 것’을 가리키며, לֹא יָקוּם은 법적 효력이 성립·유지되지 않는다는 뜻입니다. ‘어느 것도 유효하지 않습니다’가 한국어 법적 의미를 명료하게 전달합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주 a, b, c가 모두 문장 끝에 몰려 있어 각각의 대상 표현이 불분명합니다. 해당 본문어와 ‘야훼’ 뒤에 붙여 연결해야 합니다.
  revised_text: 그러나 남편이 그가 들은 날에 그것들을 반드시 무효로 선언하면, 그녀의 입술에서 나온 모든 것, 곧 그녀의 서약들이나 그녀가 자기 자신에게 지운 결속 의무는 어느 것도 유효하지 않습니다.[a] 남편이 그것들을 무효로 하였으며, 야훼께서[c] 그녀를 용서하십니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀의 입술에서 나온 모든 것’입니다. 이는 그녀가 말로 한 모든 약속을 포괄하는 법적 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그녀가 자기 자신에게 맨 의무’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 고유신명 יהוה를 가리킵니다.
    reason: divine_name
  revision_rationale: 원문에 없는 ‘소식’을 제거하고, 히브리어의 법적 표현을 현대 한국어의 격식 있는 문장으로 다듬었습니다. 다만 b 각주가 가리키는 ‘결속 의무’ 뒤에 표지를 배치해야 하므로, 완전한 본문에서는 해당 표지를 직접 붙여야 합니다.
