id: NUM.30.13
reference: Numbers 30:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
  footnotes:
  - marker: a
    text: Or 'whatever proceeded from her lips.' The Hebrew literally says 'all the outgoing of her lips,' a legal expression covering all spoken commitments.
    reason: lexical_alternative
  - marker: b
    text: Or 'the binding obligation by which she bound herself.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, rendered 'the LORD' in keeping with the translation's standard practice.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 남편이 그 소식을 들은 날에 그것들을 정말로 무효로 하면, 그녀의 입에서 나온 것이 무엇이든—곧 그녀의 서약들이나 그녀가 자기에게 지운 의무가—하나도 서지 못합니다. 남편이 그것들을 무효로 했으므로, 야훼께서 그녀를 용서하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀의 입의 나오는 모든 것’입니다. 법적 표현으로서 그녀가 한 모든 발화를 포괄합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그녀가 자기에게 맨 의무’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 고유신명 יהוה를 가리킵니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ... 하면
  alternatives_korean:
  - 그리고 ... 하면
  - 만약 ... 하면
  lexicon: HALOT
  rationale: 이전 규정과 대비되는 조건을 나타내므로, 앞의 규정과 이어지면서도 반전되는 뉘앙스를 살려 ‘그러나’로 옮겼습니다.
- source_word: הָפֵר יָפֵר
  english_pob_choice: indeed annuls
  chosen_korean: 정말로 무효로 하면
  alternatives_korean:
  - 분명히 무효로 하면
  - 완전히 무효로 하면
  - 무효로 하면
  lexicon: HALOT
  rationale: 분사적 강조를 한국어의 반복 없이 자연스럽게 드러내기 위해, 법적 효력을 없애는 뜻을 살린 ‘무효로 하면’을 쓰고 강조는 ‘정말로’로 보완했습니다.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  english_pob_choice: nothing that came from her lips
  chosen_korean: 그녀의 입에서 나온 것이 무엇이든
  alternatives_korean:
  - 그녀의 입에서 나온 모든 것
  - 그녀의 입에서 나온 말들 모두
  - 그녀의 입술에서 나온 모든 말
  lexicon: HALOT
  rationale: 직역하면 ‘입술의 나온 것 모두’이지만, 법률 문맥에서 범위를 포괄하는 표현이므로 POB의 의미를 따라 ‘무엇이든’으로 자연스럽게 옮겼습니다.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  english_pob_choice: her binding obligation upon herself
  chosen_korean: 그녀가 자기에게 지운 의무
  alternatives_korean:
  - 그녀의 자기 결속 의무
  - 자기에게 맨 의무
  - 자기 자신을 묶은 의무
  lexicon: HALOT
  rationale: נפשׁ는 여기서 ‘자기 자신/생명’의 관용적 표지로 보이므로, 지나치게 직역하기보다 ‘자기에게 지운 의무’로 옮겨 결박된 의무성을 살렸습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 고유신명은 ‘야훼’로 옮겼습니다. 이는 본문이 언약적 사법 문맥에서 하나님의 이름을 직접 사용하는 점을 드러냅니다.
theological_decisions:
- issue: 서약이 무효가 된 뒤의 용서 선언
  chosen_reading: 남편이 합법적으로 그것들을 무효로 했으므로, 그 서약은 구속력을 잃고 야훼께서 그녀를 용서하십니다.
  alternative_readings:
  - 단순히 무효 선언의 결과를 말하는 관용구로 볼 수 있음
  - 서약을 한 행위 자체의 경솔함까지 포괄적으로 용서하는 뜻으로 볼 수 있음
  rationale: 본문의 논리 흐름은 무효화–무효 상태–용서의 순서로 전개되므로, 그 법적 결과를 그대로 반영하되 의미를 확장해 단정하지 않았습니다.
  doctrine_reference: 본문의 법적-신학적 긴장을 보존
