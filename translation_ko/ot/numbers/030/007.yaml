  source_fidelity: 초안은 혼인 관계와 자기 구속의 뜻을 대체로 반영하지만, ‘그녀의 서원이나 … 말이 그녀에게 있더라도’는 히브리어의 조건 구조와 ‘서원들이 그녀 위에/그녀에게 남아 있다’는 표현을 흐립니다. 또한 ‘곧’은 원문의 선택 접속사 או(‘또는’)를 설명·동격 관계로 바꾸므로 삭제해야 합니다.
  naturalness: ‘남편에게 속하게 되면’은 한국어에서 사람을 소유물처럼 들리며 현대 표준어로도 부자연스럽습니다. ‘남편의 아내가 되면’이 혼인 관용구를 자연스럽고 정확하게 전달합니다. 조건절 안의 병렬도 ‘… 있거나, 또는 … 있으면’으로 정리하는 편이 명료합니다.
  terminology: ‘서원’과 ‘경솔한 말’을 구별한 점은 적절합니다. 다만 후자는 ‘자기를 속박한 말’이라고 별도 반복하기보다, 원문의 관계절대로 ‘자기 입술의 경솔한 말로 자기를 구속한 것’으로 옮겨야 합니다. נֶפֶשׁ는 이 법률 문맥에서 ‘자기’를 뜻하므로 ‘영혼’으로 번역하지 않는 것이 적절합니다.
