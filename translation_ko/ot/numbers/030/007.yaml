  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
  footnotes:
  - marker: a
    text: Or 'she becomes a man's wife' / 'she is married to a husband.' The Hebrew idiom literally reads 'she is/becomes to a man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an utterance of her lips.' The phrase likely refers to a spoken self-obligation made impulsively, distinct from a formal vow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀가 남편에게 속하게 되면, 그녀의 서원이나 자기 입술의 경솔한 말이 그녀에게 있더라도, 곧 자기를 속박한 말이 있더라도[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘남자에게로’이지만, 결혼 관계에 들어가는 법적·관계적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서의 ‘경솔한 말’은 형식적인 서원과 구별되는, 입술에서 나온 즉흥적 자기 구속을 가리킬 수 있습니다.
    reason: lexical_alternative
