translation:
  language: ko
  text: 그러나 그녀가 남편의 아내가 되면[a], 그녀의 서원들이 그녀에게 남아 있거나, 또는 자기 입술의 경솔한 말로 자기를 구속한 것이 있으면[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 남자에게 있게 되다/한 남자의 것이 되다’라고 말하는 혼인 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 입술의 말’. 이 표현은 정식 서원과 구별되는, 즉흥적으로 한 자기 구속의 말을 가리킬 수 있습니다.
    reason: lexical_alternative
