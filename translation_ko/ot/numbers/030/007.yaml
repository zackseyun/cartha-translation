    rationale: 히브리어의 혼인 관용구는 법적·관계적 의미를 지니지만, 한국어 ‘남편에게 속하다’는 현대 용법에서 소유 관계를 과도하게 전면화합니다. ‘남편의 아내가 되다’가 문맥상 안전한 관용적 대응입니다.
