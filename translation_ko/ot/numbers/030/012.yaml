  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
  footnotes:
  - marker: a
    text: Hebrew literally, 'does not nullify her.' The sense in context is that he does not annul or invalidate her vow or binding obligation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 남편이 그것을 듣고 그에게 아무 말도 하지 않고, 그의 서원을 무효로 하지 않으면, 그의 모든 서원은 유효할 것이며, 그녀가 자기 자신에게 맨 모든 매임도 유효할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그녀를 무효로 하지 않는다’입니다. 문맥상 뜻은 그녀의 서원이나 매임을 무효화하지 않는다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그 남편
  - 남편
  lexicon: HALOT
  rationale: 법률 문맥에서 소유 접미사는 ‘그의’로 자연스럽게 옮겨, 누가 누구의 남편인지 분명히 했습니다.
- source_word: וְהֶחֱרִשׁ לָהּ
  english_pob_choice: says nothing to her
  chosen_korean: 그에게 아무 말도 하지 않고
  alternatives_korean:
  - 그에게 침묵하고
  - 그에게 말없이 있고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 정적이 아니라 응답하지 않는 뜻이므로, 현대 한국어로는 ‘아무 말도 하지 않고’가 가장 자연스럽고 투명합니다.
- source_word: לֹא הֵנִיא אֹתָהּ
  english_pob_choice: does not nullify her vow
  chosen_korean: 그의 서원을 무효로 하지 않으면
  alternatives_korean:
  - 그것을 무효로 하지 않으면
  - 그의 서원을 취소하지 않으면
  - 그의 서원을 폐기하지 않으면
  lexicon: HALOT
  rationale: 문맥상 무효화의 대상은 여인의 서원이며, 한국어에서는 대명사 ‘그것’보다 대상을 명시한 ‘그의 서원’을 넣어 법적 의미를 분명히 했습니다.
- source_word: וְקָמוּ כָּל נְדָרֶי/הָ וְכָל אִסָּר
  english_pob_choice: then all her vows shall stand, and every binding obligation ... shall stand
  chosen_korean: 그의 모든 서원은 유효할 것이며, 그녀가 자기 자신에게 맨 모든 매임도 유효할 것입니다
  alternatives_korean:
  - 그의 모든 서원은 서 있을 것이며, 그녀가 자기 자신에게 맨 모든 매임도 서 있을 것입니다
  - 그의 모든 서원은 확정될 것이며, 그녀가 자기 자신에게 묶은 모든 구속도 확정될 것입니다
  lexicon: HALOT
  rationale: קום의 법률적 용법은 ‘유효하다/효력을 유지하다’로 풀어야 의미가 분명하므로, 반복된 ‘stand’를 한국어 법률 문맥에 맞게 ‘유효할 것입니다’로 옮겼습니다.
- source_word: אִסָּר
  english_pob_choice: binding obligation
  chosen_korean: 매임
  alternatives_korean:
  - 속박
  - 구속
  - 구속 의무
  lexicon: HALOT
  rationale: אִסָּר는 단순한 일반 의무보다 자신에게 매인 법적 구속을 가리키므로, ‘매임’이 본문의 결속성 및 자기부과성을 비교적 직접적으로 드러냅니다.
theological_decisions:
- issue: 서원 무효화와 남편의 침묵의 법적 효력
  chosen_reading: 남편이 말없이 두고 서원을 무효로 하지 않으면, 그 서원은 효력을 유지합니다.
  alternative_readings:
  - 남편의 침묵이 곧 승인입니다
  - 남편이 침묵하면 자동으로 허락한 셈입니다
  rationale: 본문은 침묵 자체를 일반적 승인으로 교리화하기보다, 해당 법조항 안에서 서원의 효력 유지 여부를 규정합니다. 그래서 법적 결과를 직접적으로 표현했습니다.
  doctrine_reference: 민수기 30장의 서원 규례
