  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a standard covenantal designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼께서 모세에게 명하신 모든 것에 따라 이스라엘 자손에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’(בְּנֵי יִשְׂרָאֵל)이라고 되어 있습니다. 이는 언약 공동체를 가리키는 표준 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서술 도입으로서의 발화 동사를 자연스러운 합쇼체로 옮겼습니다. 직접 인용이 없으므로 ‘말했습니다’가 동작과 내용을 함께 가장 무리 없이 전달합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 언약 명칭을 살리되, 한국어 성경에서 널리 쓰이는 ‘이스라엘 자손’을 택해 남성 복수의 표지를 보존했습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all that
  chosen_korean: 모든 것에 따라
  alternatives_korean:
  - 모든 대로
  - 전부에 따라
  lexicon: HALOT
  rationale: כ의 부합·일치 의미를 한국어의 ‘~에 따라’로 자연스럽게 옮겼습니다. ‘모든 것’은 수식어 전체의 범위를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기를 가리키는 고유명사를 제목이나 호칭이 아닌 하나님의 이름으로 직접 옮겼습니다. 프로젝트 기본값에 따라 ‘야훼’를 유지합니다.
theological_decisions:
- issue: 여호와/야훼 대체 문제
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 음역해 하나님의 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 의역
  - ‘여호와’로 번역
  rationale: 본문은 단순 칭호가 아니라 이스라엘에게 계시된 고유한 신명을 사용합니다. 이를 ‘주님’으로 바꾸면 이름의 식별성이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
