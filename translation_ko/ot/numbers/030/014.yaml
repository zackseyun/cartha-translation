id: NUM.30.14
reference: Numbers 30:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
  footnotes:
  - marker: a
    text: Or 'to deny oneself' or 'to humble oneself.' The Hebrew idiom literally reads 'to afflict the soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기를 괴롭게 하는 모든 서원과 모든 구속력 있는 맹세는, 그 여자의 남편이 그것을 유효하게 할 수도 있고 무효로 할 수도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기를 괴롭게 하다’는 히브리어 관용구를 옮긴 것입니다. 직역하면 ‘혼을 괴롭게 하다’이며, ‘자기를 절제하다’ 또는 ‘자기를 낮추다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נֵדֶר
  english_pob_choice: Every vow
  chosen_korean: 어떤 서원
  alternatives_korean:
  - 모든 서원
  - 각 서원
  lexicon: HALOT
  rationale: כָּל의 분배적 힘을 살리되 한국어에서는 법적·종교적 문맥에 자연스러운 ‘어떤’이 반복되는 대상을 넓게 포괄합니다. נֵדֶר는 ‘서원’이 가장 정확하고 관용적인 대응입니다.
- source_word: וְכָל שְׁבֻעַת אִסָּר
  english_pob_choice: and every binding oath
  chosen_korean: 어떤 속박의 맹세
  alternatives_korean:
  - 모든 묶는 맹세
  - 모든 속박하는 맹세
  lexicon: HALOT
  rationale: שְׁבֻעַת אִסָּר는 맹세와 ‘속박/구속’의 결합이므로, 의미를 드러내는 ‘속박의 맹세’로 옮겼습니다. ‘binding oath’의 법적 구속성을 살리면서도 한국어 어감이 과도하게 어색해지지 않도록 했습니다.
- source_word: לְעַנֹּת נָפֶשׁ
  english_pob_choice: to afflict the soul
  chosen_korean: 자기 생명을 괴롭게 하려는 것
  alternatives_korean:
  - 자기 영혼을 괴롭게 하려는 것
  - 자기를 괴롭게 하려는 것
  - 자기 생명을 낮추려는 것
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 노출하면 현대 한국어에서 의미가 불투명하므로, POB의 각주가 밝히는 자의적 절제/겸비의 뜻을 반영해 문맥적 의미를 풀었습니다. נָפֶשׁ은 여기서 ‘생명/자기’의 의미층이 강해 ‘생명’으로 잡았습니다.
- source_word: יְקִימֶנּוּ / יְפֵרֶנּוּ
  english_pob_choice: may confirm it / may annul it
  chosen_korean: 그것을 확증하거나 ... 그것을 무효로 할 수 있습니다
  alternatives_korean:
  - 그것을 세우거나 ... 그것을 폐할 수 있습니다
  - 그것을 인정하거나 ... 그것을 취소할 수 있습니다
  lexicon: HALOT
  rationale: קום의 법적 뉘앙스는 ‘확증하다’로, פרר의 무효화 뉘앙스는 ‘무효로 하다’로 옮겨 서원의 유효/무효를 분명히 드러냈습니다. 이는 ‘confirm/annul’의 법률적 힘을 한국어로 직접 재현합니다.
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그녀의 남편
  - 그 사람의 남편
  lexicon: HALOT
  rationale: 문맥상 3인칭 여성의 소유 대명사로 가리키는 대상은 남편이며, 한국어에서는 주어의 시점을 맞추어 자연스럽게 ‘그의 남편’으로 풀 수 있습니다.
theological_decisions:
- issue: לְעַנֹּת נָפֶשׁ의 관용구 처리
  chosen_reading: 문맥상 금식·자기 절제의 의미를 가진 표현으로 이해하되, 본문에서는 직역보다 의미를 드러내는 번역을 택했습니다.
  alternative_readings:
  - ‘영혼을 괴롭게 하다’로 직역
  - ‘자기를 낮추다’로 해석
  rationale: 이 구절은 서원/맹세의 법문맥 안에서 통상적인 자기 절제 표현을 다루므로, 현대 독자가 실제 법적 기능을 즉시 이해하도록 옮기는 것이 적절합니다.
  doctrine_reference: 민수기 30장 서원 규례의 문맥 해석
- issue: ‘confirm/annul’의 법적 효력
  chosen_reading: 남편의 행위는 서원을 단순히 허용하거나 금지하는 수준이 아니라, 유효하게 세우거나 법적으로 무효화하는 권한을 뜻합니다.
  alternative_readings:
  - ‘인정하다/거절하다’로 완화
  - ‘지키게 하다/깨뜨리다’로 관용화
  rationale: 본문은 가정 내 권위가 서원의 법적 상태를 바꾸는 규례를 말하므로, 효력 변화를 분명히 하는 번역이 필요합니다.
  doctrine_reference: 민수기 30장 14절의 서원 효력 규정
