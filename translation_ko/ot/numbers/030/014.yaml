  source_fidelity: 원문의 반복된 כָּל은 ‘모든’으로 옮기는 것이 가장 직접적입니다. לְעַנֹּת נָפֶשׁ은 자기 절제/자기 괴롭힘을 가리키는 관용구이므로 본문에서는 자연스럽게 옮기고, 직역 및 대안적 이해는 각주에 남겼습니다. אִישָׁהּ은 해당 서원을 한 여성의 남편을 뜻하므로 ‘그 여자의 남편’으로 명시해야 합니다.
  naturalness: 현 초안의 ‘어떤 … 어떤 …든지’와 삽입 대시는 법규 문장으로 다소 부자연스럽고, ‘그가’와 ‘그의 남편’은 지시 대상과 성별이 맞지 않습니다. 수정문은 현대 표준어 합쇼체의 법규적 문장 흐름을 유지합니다.
  terminology: נֵדֶר는 ‘서원’, שְׁבֻעַת אִסָּר는 ‘구속력 있는 맹세’, יְקִימֶנּוּ/יְפֵרֶנּוּ는 각각 ‘유효하게 하다/무효로 하다’로 옮겼습니다. ‘생명’을 נֶפֶשׁ의 대응어로 쓰면 이 관용구에서 한국어 의미가 어긋날 수 있어 피했습니다.
