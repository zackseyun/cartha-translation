  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
  footnotes:
  - marker: a
    text: Hebrew 'vows a vow,' a cognate expression emphasizing the formal act of making a vow.
    reason: lexical_alternative
  - marker: b
    text: Or 'and binds herself with a binding obligation.' The Hebrew uses a verb and related noun to express placing oneself under a binding pledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가 야훼께 서원으로 서원하고, 아버지 집에 있는 동안 젊은 시절에 스스로를 의무로 묶게 되면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘서원으로 서원하다’라는 동족 목적어 표현을 사용하여, 서원의 행위를 형식적으로 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의무로 묶다’는 히브리어의 동사와 관련 명사가 함께 만드는 ‘스스로에게 구속력을 부여하다’는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  english_pob_choice: And if a woman
  chosen_korean: 여자가
  alternatives_korean:
  - 만일 여자가
  - 그리고 여자가
  lexicon: HALOT
  rationale: 법률 문맥의 조건절을 자연스러운 한국어로 옮기기 위해 ‘만일/if’의 의미를 내포하는 조건적 서술로 처리했습니다. 문두의 וְ는 한국어에서 별도의 ‘그리고’를 반드시 요구하지 않아 생략했습니다.
- source_word: תִדֹּר נֶדֶר
  english_pob_choice: vows a vow
  chosen_korean: 서원으로 서원하고
  alternatives_korean:
  - 서원을 서원하고
  - 서원하되
  - 서원을 하고
  lexicon: HALOT
  rationale: 히브리어의 동족 목적어 강조를 살리기 위해 ‘서원으로 서원하다’라는 중첩 구조를 택했습니다. ‘서원하다’ 하나로 평탄화하면 법적·수사적 강조가 약해집니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 이 구절은 여호와 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 여격 조사는 한국어 관용에 맞게 ‘께’를 사용했습니다.
- source_word: וְאָסְרָה אִסָּר
  english_pob_choice: and binds herself by an obligation
  chosen_korean: 스스로를 의무로 묶게 되면
  alternatives_korean:
  - 의무로 자신을 묶게 되면
  - 속박으로 속박하면
  - 서약의 구속을 받게 되면
  lexicon: HALOT
  rationale: אָסַר/אִסָּר의 ‘묶다, 결박하다’는 의미를 유지하면서, 한국어에서 이해 가능한 법적 구속 상태를 ‘의무로 묶다’로 표현했습니다. ‘서원’과 구별되는 별도의 구속 조항이라는 점도 살렸습니다.
- source_word: בְּבֵית אָבִיהָ בִּנְעֻרֶיהָ
  english_pob_choice: in her father's house in her youth
  chosen_korean: 아버지 집에 있는 동안 젊은 시절에
  alternatives_korean:
  - 아버지 집에서 젊은 시절에
  - 아버지 집에 있을 때 젊은 시절에
  - 아버지의 집에서 아직 젊을 때
  lexicon: HALOT
  rationale: ‘아버지 집’은 가문·보호권 아래의 법적 환경을 가리키므로 그대로 살렸고, בִּנְעֻרֶיהָ는 연령보다 소녀기/젊은 시절의 상태를 가리키는 맥락을 반영해 ‘젊은 시절에’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: יַהְוֶה를 한국어 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 언약명 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 본문에서 고유 신명 ‘야훼’를 보존했습니다. 전통적 교회 용어인 ‘여호와’나 일반 호칭 ‘주’는 본문이 가진 고유명성을 약화시킬 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
