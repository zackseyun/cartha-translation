    text: 또는 ‘자신에게 구속력 있는 서약을 하다’. 히브리어는 ‘묶다’라는 동사와 관련 명사를 함께 써서 자신에게 구속적 서약을 부과함을 나타냅니다.
    reason: lexical_alternative
