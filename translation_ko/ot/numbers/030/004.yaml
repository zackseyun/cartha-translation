  lexicon: HALOT
  rationale: ‘아버지 집’은 가문·보호권 아래의 법적 환경을 가리키므로 그대로 살렸고, בִּנְעֻרֶיהָ는 연령보다 소녀기/젊은 시절의 상태를 가리키는 맥락을 반영해 ‘젊은 시절에’로 옮겼습니다.
