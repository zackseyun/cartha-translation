  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
  footnotes:
  - marker: a
    text: Or, more literally, 'bound a binding obligation upon herself with an oath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그녀가 남편의 집에서 서원하거나, 서약으로 자신에게 의무를 지웠다면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서약으로 자신에게 의무를 지우다’는 히브리어의 직역적 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 법률적 조건문이 앞 절과 이어지므로, 연결성을 살린 ‘그리고 만일’이 자연스럽습니다.
- source_word: בֵּית אִישָׁהּ
  english_pob_choice: in her husband's house
  chosen_korean: 남편의 집에서
  alternatives_korean:
  - 남편의 집 안에서
  - 남편의 가정에서
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘남편의 집’은 결혼 관계 안의 거주·소속 상황을 가리키므로, 한국어에서도 그대로 살렸습니다.
- source_word: נָדָרָה
  english_pob_choice: she made a vow
  chosen_korean: 서원하거나
  alternatives_korean:
  - 서원했다면
  - 맹세했다면
  lexicon: HALOT
  rationale: נדר는 ‘서원하다/서원하다’가 가장 직접적이므로, 법적 맥락을 해치지 않는 동사형으로 옮겼습니다.
- source_word: אָסְרָה אִסָּר עַל נַפְשָׁהּ בִּשְׁבֻעָה
  english_pob_choice: bound herself by an obligation with an oath
  chosen_korean: 서약으로 자신에게 의무를 지웠다면
  alternatives_korean:
  - 맹세로 자신을 묶었다면
  - 서약으로 스스로를 구속했다면
  - 맹세와 함께 의무를 지웠다면
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 ‘스스로를 묶는’ 강한 자가구속을 나타내므로, 이를 ‘자신에게 의무를 지우다’로 풀어 법적 강제를 분명하게 했습니다.
theological_decisions:
- issue: ‘서원’과 ‘서약으로 자신에게 의무를 지우다’의 병렬 관계
  chosen_reading: 두 표현을 서로 다른 유사 행위로 유지했습니다.
  alternative_readings:
  - 둘을 하나로 합쳐 ‘서원하거나 서약했다면’로 단순화
  - 둘을 모두 ‘서원했다면’으로 통일
  rationale: 히브리어는 서원(נדר)과 자기구속 서약(אָסַר + אִסָּר)을 구별하므로, 한국어에서도 그 긴장을 지우지 않는 것이 source-grounded합니다.
  doctrine_reference: 본문의 법률적 구분 보존
