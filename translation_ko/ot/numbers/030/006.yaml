reference: Numbers 30:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
  footnotes:
  - marker: a
    text: Or 'binding pledges' or 'bonds.' The Hebrew term refers to obligations that bind a person, especially in vow contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall take effect.' The Hebrew literally says 'shall not stand,' meaning the vows are not upheld as binding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀의 아버지가 그것을 들은 날에 그녀를 제지하면, 그녀의 모든 서원과 그녀가 스스로에게 지운 구속력 있는 의무[a]는 효력을 갖지 못할 것이며[b], 야훼께서 그녀를 용서하실 것입니다. 이는 그녀의 아버지가 그녀를 제지하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀가 스스로에게 묶은 결박들’입니다. 여기서는 서원과 함께 사람이 스스로에게 지우는 구속력 있는 서약이나 의무를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘서지 못할 것이다’입니다. 곧 법적 효력이 유지되지 않는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 금하면
  alternatives_korean:
  - 그리고 만일 … 금하면
  - 만일 … 금하면
  lexicon: HALOT
  rationale: 앞절과의 조건적 대조를 살리기 위해 ‘그러나’로 시작했고, 법률 문맥의 조건절은 자연스러운 한국어 어순으로 처리했습니다.
- source_word: הֵנִיא
  english_pob_choice: forbids
  chosen_korean: 금하다
  alternatives_korean:
  - 막다
  - 무효화하다
  - 허락하지 않다
  lexicon: HALOT
  rationale: 이 동사는 단순한 허용 거부보다 서원에 대한 아버지의 권한 있는 제지를 뜻하므로, 법적 문맥에서 ‘금하다’가 가장 직접적입니다.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  english_pob_choice: none of her vows or her binding obligations
  chosen_korean: 그녀의 모든 서원과 그녀가 자기에게 묶어 둔 모든 결박
  alternatives_korean:
  - 그녀의 모든 서원과 맹세된 의무
  - 그녀의 모든 서원과 속박들
  lexicon: HALOT
  rationale: נדר는 ‘서원’, אסר 파생명사는 단순한 ‘의무’보다 맥락상 사람을 묶는 ‘결박’이 더 원문에 가깝고, POB의 결박/묶임 뉘앙스를 한국어로 드러냈습니다.
- source_word: לֹא יָקוּם
  english_pob_choice: shall not stand
  chosen_korean: 서지 못할 것이며
  alternatives_korean:
  - 유효하지 않을 것이며
  - 성립하지 않을 것이며
  - 효력을 갖지 못할 것이며
  lexicon: HALOT
  rationale: 히브리어의 직역적 법률 표현을 살리되 한국어로는 ‘서다’의 관용적 의미를 자연스럽게 전달하도록 옮겼습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮겨, 본문이 신명기적 법문 속에서 하나님의 이름을 직접 드러내도록 했습니다.
- source_word: יִסְלַח לָהּ
  english_pob_choice: will forgive her
  chosen_korean: 그녀를 용서하실 것입니다
  alternatives_korean:
  - 그녀를 사하실 것입니다
  - 그녀를 용납하실 것입니다
  lexicon: HALOT
  rationale: סלח의 표준 대응인 ‘용서하다’를 사용하되, 서원 무효화의 법적 상황 속에서도 하나님 주권의 개입을 분명히 했습니다.
theological_decisions:
- issue: 야훼의 용서와 서원의 무효화 관계
  chosen_reading: 이 절은 아버지의 적절한 금지가 서원의 구속력을 해제하고, 그 결과 야훼께서 그녀를 용서하신다고 말합니다. 이는 문맥상 법적-제도적 무효화에 대한 진술이지, 여기서 별도의 광범위한 도덕적 죄책을 확장해 말하는 것은 아닙니다.
  alternative_readings:
  - 이 구절을 더 넓은 의미의 죄 사함 선언으로 읽는 해석
  - 서원 미이행 자체를 곧바로 도덕적 죄로 보는 해석
  rationale: 문맥은 서원 규정과 가부장적 권한 구조에 관한 것이므로, 본문이 말하는 용서의 범위를 축소하지도 확대하지도 않도록 유지해야 합니다.
  doctrine_reference: 문맥 우선; 법문 안의 용서 진술을 과잉 신학화하지 않음
