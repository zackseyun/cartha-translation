review_pass:
  verdict: revise
  source_fidelity: 현 초안은 히브리어에 없는 ‘그 백성에게로’를 보충하며, ‘거름을 당하여’는 יֵאָסֵף(‘거두어지다/모여들다’라는 죽음의 관용 표현)를 잘못 옮겼습니다. 수정문은 해당 관용구를 유지하되 ‘그의 백성에게로’를 삽입하지 않고, 장소 부사 ‘거기서’를 보존합니다.
  naturalness: ‘옷을 벗겨 … 입히라’는 명령의 뜻은 전달하지만, 현대 표준어 합쇼체로는 ‘벗기십시오/입히십시오’가 더 자연스럽고 일관됩니다. ‘거두어져’는 직역적 관용 표현이므로 각주로 뜻을 밝혀 독해를 돕습니다.
  terminology: ‘아론’, ‘엘르아살’은 통용되는 성서 인명 표기이며 유지할 수 있습니다. בְּגָדָיו는 본문에서 단순히 ‘옷’으로 옮기고, 제사장 옷이라는 문맥상 보충은 각주에만 둡니다.
  issues:
  - severity: high
    issue: 히브리어에 없는 ‘그 백성에게로’가 본문에 추가됨
    rationale: 이 절은 יֵאָסֵף만 사용하며, 흔한 확장 표현인 ‘그의 백성에게로/그의 백성에게’는 본문에 없습니다. 이를 본문에 넣으면 원문의 표현 범위를 넘어섭니다.
  - severity: high
    issue: ‘거름을 당하여’는 원문의 죽음 관용구를 오역함
    rationale: יֵאָסֵף는 여기서 죽음을 가리키는 ‘거두어지다’의 관용적 용례입니다. ‘거름’은 전혀 다른 한국어 명사로 의미와 문법이 모두 맞지 않습니다.
  - severity: low
    issue: 합쇼체 명령 형식 불일치
    rationale: 요청된 현대 정중체에 맞추어 ‘-십시오’로 명령문을 다듬는 것이 적절합니다.
  revised_text: 아론의 옷을 벗기고, 그것들을 그의 아들 엘르아살에게 입히십시오. 그러면 아론은 거두어져[a] 그곳에서 죽을 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘거두어지다’는 죽음을 가리키는 히브리어 관용 표현입니다. 이 절에는 ‘그의 백성에게로’라는 더 긴 표현이 나오지 않습니다.
    reason: 원문의 죽음 관용구를 설명하고, 본문에 없는 확장을 피하도록 함
  - marker: b
    text: 문맥상 제사장 옷을 가리키지만, 히브리어 본문은 단순히 ‘그의 옷’이라고 합니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 ‘그 백성에게로’를 삭제하고, 잘못된 ‘거름을 당하여’를 원문의 죽음 관용구를 보존하는 ‘거두어져’로 바로잡았습니다. 명령문은 현대 표준어 합쇼체로 통일했습니다. ‘제사장 옷’이라는 문맥 정보는 본문에 추가하지 않고 각주로만 제시했습니다.
