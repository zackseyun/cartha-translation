  terminology: ‘온 회중’은 כָּל הָעֵדָה에 적절하며, ‘이스라엘 온 집안’은 כֹּל בֵּית יִשְׂרָאֵל의 집합적 표현을 보존합니다. ‘죽었음’과 ‘울었습니다’도 각각 גוע와 בכה의 문맥상 의미를 무리 없이 전달합니다.
