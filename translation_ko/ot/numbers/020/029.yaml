  source_fidelity: 히브리어의 두 절(‘온 회중이 아론이 죽었음을 보았다’ / ‘이스라엘 온 집안이 아론을 두고 30일 동안 울었다’)과 공동체적 범위를 충실히 반영합니다. 다만 초안의 ‘보았을 때’는 כִּי가 이끄는 내용절을 시간절로 다소 바꾸므로, ‘보았습니다’로 고치는 것이 더 직접적입니다.
