  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
  footnotes:
  - marker: a
    text: Or 'realized that Aaron had died.' The Hebrew literally says 'saw that Aaron had died,' where 'saw' can include recognition of the fact.
    reason: lexical_alternative
  - marker: b
    text: '''All the house of Israel'' is a corporate expression for the entire people of Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 온 회중은 아론이 죽었음을 보았습니다.[a] 이스라엘 온 집안은 아론을 두고 삼십 일 동안 울었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아론이 죽었음을 보았다’라고 말하며, 여기서 ‘보다’는 그 사실을 인지했다는 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 온 집안’은 이스라엘 전체를 가리키는 공동체적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 알아차렸습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: ראה의 기본 의미인 ‘보다’를 살리되, 문맥상 죽음을 인지했다는 뜻이 함께 드러나도록 자연스럽게 옮겼습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 회중 전체
  - 온 공동체
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합체를 가리키므로, 종교적 뉘앙스를 유지하는 ‘회중’이 적절합니다.
- source_word: גָוַע אַהֲרֹן
  english_pob_choice: had died
  chosen_korean: 아론이 죽었음
  alternatives_korean:
  - 아론이 숨졌음
  - 아론이 숨을 거두었음
  lexicon: HALOT
  rationale: גוע는 정중한 죽음 표현이지만, 한국어에서는 본문을 간명하게 전달하는 ‘죽었음’이 가장 직접적입니다.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  english_pob_choice: all the house of Israel
  chosen_korean: 이스라엘 온 집안
  alternatives_korean:
  - 이스라엘의 온 집안
  - 이스라엘의 모든 집안
  lexicon: HALOT
  rationale: 관용구 בֵּית יִשְׂרָאֵל의 공동체적·언약적 의미를 살리기 위해 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 아론의 죽음을 본 뒤의 공동체적 애도 표현
  chosen_reading: ‘울었습니다’로 פשוט히 애도의 행위를 드러내고, ‘회중’과 ‘이스라엘 온 집안’을 함께 살려 공동체 전체의 반응임을 보이게 했습니다.
  alternative_readings:
  - ‘슬퍼했습니다’
  - ‘애곡했습니다’
  rationale: 히브리어 בכה는 실제로 우는 행위를 가리키므로, 보다 강한 해석어보다 직접적인 표현이 본문에 충실합니다.
  doctrine_reference: 민수기 20장의 공동체 애도와 언약 백성의 집단성
