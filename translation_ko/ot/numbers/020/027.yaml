translation:
  language: ko
  text: 모세는 야훼께서 명하신 대로 행하였고, 그들은 온 회중의 눈앞에서[a] 호르 산에 올랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘온 회중의 눈앞에서’라고 하며, 백성이 모인 가운데 공개적으로라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하였고
  alternatives_korean:
  - 하였고
  - 실행하였고
  lexicon: HALOT
  rationale: 단순한 행위가 아니라 직전 명령에 대한 순종의 수행이므로, 현대 문맥에서 자연스럽고 약간 더 분명한 ‘행하다’를 택했습니다.
- source_word: כַּאֲשֶׁר צִוָּה
  english_pob_choice: as ... commanded
  chosen_korean: 명하신 대로
  alternatives_korean:
  - 명령하신 대로
  - 지시하신 대로
  lexicon: HALOT
  rationale: צוה의 권위적 명령을 살리면서 한국어에서 가장 자연스럽게 순종의 대응을 드러내는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명 표기를 일반 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: לְעֵינֵי כָּל הָעֵדָה
  english_pob_choice: before the eyes of all the congregation
  chosen_korean: 온 회중의 눈앞에서
  alternatives_korean:
  - 모든 회중이 보는 앞에서
  - 온 회중 앞에서
  lexicon: HALOT
  rationale: ‘눈앞에서’는 히브리어의 시각적 공개성을 직접 살리며, ‘온 회중’은 כָּל הָעֵדָה의 집합성을 자연스럽게 반영합니다.
theological_decisions:
- issue: 공개성 강조 표현의 처리
  chosen_reading: 온 회중의 눈앞에서
  alternative_readings:
  - 모든 사람이 보는 앞에서
  - 공개적으로
  rationale: 히브리어는 단순한 장소 정보가 아니라 공동체 전체 앞에서의 가시성을 강조하므로, 서술적 설명보다 원문의 이미지가 드러나는 표현을 유지했습니다.
  doctrine_reference: Numbers 20:27 source wording / English POB footnote a
