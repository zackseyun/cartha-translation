base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the eyes of all the congregation,'' that is, publicly and in full view of the assembled people.'
