  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
  footnotes:
  - marker: a
    text: Or 'turned aside from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 에돔이 이스라엘이 자기 영토를 지나가는 것을 허락하지 않자, 이스라엘은 그에게서 돌아섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 비켜섰습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  english_pob_choice: refused
  chosen_korean: 허락하지 않자
  alternatives_korean:
  - 거절하자
  - 마지않자
  - 불허하자
  lexicon: HALOT
  rationale: 이 동사는 단순한 무관심이 아니라 요청을 거부하는 뜻이므로, 관계적·서사적 문맥에서 ‘허락하지 않자’가 자연스럽고 의미를 정확히 드러냅니다.
- source_word: נְתֹן אֶת יִשְׂרָאֵל עֲבֹר
  english_pob_choice: to let Israel pass through
  chosen_korean: 이스라엘이 … 지나가는 것을 허락하지 않자
  alternatives_korean:
  - 이스라엘이 통과하도록 하지 않자
  - 이스라엘이 지나가게 주지 않자
  lexicon: HALOT
  rationale: ‘주다/허락하다’의 관용적 결합을 한국어에서는 목적절로 풀어, 지나감의 허가를 거부한 의미를 분명하게 살렸습니다.
- source_word: בִּגְבֻלוֹ
  english_pob_choice: through his territory
  chosen_korean: 자기 영토를
  alternatives_korean:
  - 자기 경계를
  - 자기 국경을
  - 자기 영역을
  lexicon: HALOT
  rationale: 문맥상 ‘경계’보다 실제로 통과하려는 땅의 범위인 ‘영토’가 더 정확하며, 한국어 독자에게도 자연스럽습니다.
- source_word: וַיֵּט ... מֵעָלָיו
  english_pob_choice: turned away from him
  chosen_korean: 그에게서 돌아섰습니다
  alternatives_korean:
  - 그에게서 물러났습니다
  - 그를 피해 돌아갔습니다
  - 그에게서 방향을 돌렸습니다
  lexicon: HALOT
  rationale: נטה와 מֵעָלָיו의 결합은 진행 방향을 바꾸어 상대에게서 멀어짐을 뜻하므로, ‘돌아서다’가 간결하게 대응합니다.
