id: NUM.20.13
reference: Numbers 20:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
  footnotes:
  - marker: a
    text: Meribah means 'quarreling' or 'contention.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he was shown holy in them' / 'and he proved himself holy by them.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것들은 므리바의 물이니라. 그곳에서 이스라엘의 아들들이 야훼와 다투었고, 그분은 그들 가운데서 거룩함을 드러내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 므리바는 ‘다툼’ 또는 ‘분쟁’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 안에서 거룩하게 되셨다’ / ‘그들로 말미암아 거룩함이 드러나셨다’.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: These are
  chosen_korean: 이것들은 ...니라
  alternatives_korean:
  - 이것들은 ...입니다
  - 이것들은 ...입니다
  lexicon: WLC/NB
  rationale: 지시어로 물을 식별하는 명명 공식이므로 현대 한국어에서는 자연스러운 현재식 식별문으로 옮겼습니다.
- source_word: מֵי מְרִיבָה
  english_pob_choice: the waters of Meribah
  chosen_korean: 므리바의 물
  alternatives_korean:
  - 메리바의 물
  - 다툼의 물
  lexicon: HALOT
  rationale: מְרִיבָה가 여기서는 지명화된 고유명사이므로 음역을 유지하되, 본문에서의 의미 연결도 보존했습니다.
- source_word: רָבוּ
  english_pob_choice: quarreled
  chosen_korean: 다투었고
  alternatives_korean:
  - 분쟁하였고
  - 논쟁하였고
  lexicon: HALOT
  rationale: ריב의 핵심 의미인 분쟁·다툼을 현대어로 분명하게 드러내는 표현을 택했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 원문의 남성 복수 표현을 살리면서도 한국어에서 문맥상 이해 가능한 형태로 옮겼습니다.
- source_word: וַיִּקָּדֵשׁ בָּם
  english_pob_choice: and he showed himself holy among them
  chosen_korean: 그분은 그들 가운데서 거룩함을 드러내셨습니다
  alternatives_korean:
  - 그분은 그들 가운데서 거룩하게 되셨습니다
  - 그분은 그들 안에서 거룩함을 받으셨습니다
  lexicon: HALOT
  rationale: 니팔형 קדש의 수동·반사 뉘앙스를 한국어에서 오해 없이 전달하기 위해, 하나님이 사건 속에서 거룩함을 드러내셨다는 의미로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 קדש(거룩하게 됨/거룩함이 드러남) 해석
  chosen_reading: 그분은 그들 가운데서 거룩함을 드러내셨습니다
  alternative_readings:
  - 그분은 그들 가운데서 거룩하게 되셨습니다
  - 그분은 그들 가운데서 거룩하게 보이셨습니다
  rationale: 한국어의 ‘거룩하게 되셨습니다’는 하나님이 새로 거룩해지신 듯한 오해를 낳을 수 있으므로, 사건을 통해 이미 계신 거룩함이 প্রকাশ/입증되었다는 뜻을 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유명칭을 제목어로 대체하지 않고, POB 기준에 따라 신명사 실체를 드러내는 음역을 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
