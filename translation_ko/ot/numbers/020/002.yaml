base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: Now there was no water for the congregation[a], and they assembled against Moses and against Aaron.
  footnotes:
  - marker: a
    text: Or 'assembly' or 'community' for 'congregation.' The Hebrew עֵדָה denotes the gathered people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 회중[a]에게는 물이 없었고, 그들은 모세와 아론에게 맞서 모였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공동체’, ‘모임’으로 옮길 수 있습니다. 히브리어 עֵדָה는 함께 모인 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָעֵדָה
  english_pob_choice: for the congregation
  chosen_korean: 그 회중
  alternatives_korean:
  - 그 공동체
  - 그 모임
  lexicon: HALOT
  rationale: עֵדָה는 단순한 집합이 아니라 이스라엘의 모인 백성을 가리키므로, POB의 'congregation'에 맞춰 '회중'으로 옮겼습니다.
- source_word: וַיִּקָּהֲלוּ
  english_pob_choice: they assembled
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 집합했습니다
  - 모였습니다
  lexicon: HALOT
  rationale: קהל의 집합 행위를 자연스러운 서술로 살리되, 단순한 동시적 '모이다'보다 불만을 품고 한곳에 몰려드는 장면을 드러내기 위해 '모여들었습니다'를 택했습니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: 거슬러
  alternatives_korean:
  - 대항하여
  - against
  lexicon: HALOT
  rationale: 이 문맥의 עַל은 위치가 아니라 적대적 반대를 나타내므로, 한국어에서도 행위의 적대성을 분명히 하는 '거슬러'로 옮겼습니다.
- source_word: מֹשֶׁה / אַהֲרֹן
  english_pob_choice: Moses / Aaron
  chosen_korean: 모세 / 아론
  alternatives_korean:
  - 모세 / 아론
  lexicon: 고유명사 표기 관례
  rationale: 성경에서 널리 정착된 한국어 인명 표기를 따랐습니다.
theological_decisions:
- issue: עֵדָה의 집합체 정체성
  chosen_reading: '''회중''으로 번역해 이스라엘의 언약 공동체라는 집합적 의미를 유지했습니다.'
  alternative_readings:
  - 공동체
  - 모임
  rationale: 문맥상 단순 군중이 아니라 야훼 앞에 선 언약 백성 전체를 가리키므로, 전통적 교회 용어보다 본문 자체의 공동체성을 드러내는 표현이 적절합니다.
  doctrine_reference: 언약 공동체 이해
