base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Hebrew idiom is literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Mount Hor,' literally 'Hor the mountain,' functioning as a place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이kadesh에서 떠나 이스라엘 자손 곧 온 회중이 호 산에 이르렀으니라.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: Hebrew 'Kadesh', a place name often associated with the wilderness journey.
    source: WLC
  - marker: b
    text: Hebrew 'sons of Israel' literally translates to 'sons of Israel', emphasizing the covenantal lineage.
    source: WLC
lexical_decisions:
- source_word: וַ/יִּסְע֖וּ
  english_pob_choice: set out
  chosen_korean: 떠나다
  alternatives_korean: 출발하다, 떠나다
  lexicon: WLC
  rationale: Hebrew verb נָסַע (nasah) denotes departure or setting out on a journey. '떠나다' is the standard formal equivalent for this movement in narrative contexts.
- source_word: בְנֵֽי יִשְׂרָאֵ֛ל
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean: 이스라엘 아들들, 이스라엘 백성
  lexicon: WLC
  rationale: Literal translation of 'sons of Israel' is '이스라엘 자손'. This preserves the covenantal identity implied in the source text better than generic '백성' (people).
- source_word: הֹ֥ר הָ/הָֽר
  english_pob_choice: Mount Hor
  chosen_korean: 호 산
  alternatives_korean: 호라산, 호라
  lexicon: WLC
  rationale: The Hebrew phrase 'Hor the mountain' functions as a proper noun. '호 산' is the established traditional translation for Mount Hor in Korean biblical texts, maintaining the specific geographical reference.
theological_decisions:
- decision: Maintain 'sons of Israel' as '이스라엘 자손'
  rationale: Preserves the specific covenantal terminology of the Hebrew text, distinguishing the people of the covenant from a generic population, aligning with the source's theological emphasis on lineage and identity.
