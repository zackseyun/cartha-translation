  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from before the assembly,'' an idiom meaning from the presence of the gathered people.'
    reason: cultural_note
  - marker: b
    text: Or 'the congregation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the LORD’s glory appeared to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세와 아론은 회중[a][b] 앞을 떠나 회막 어귀로 가서 얼굴을 땅에 대고 엎드렸습니다. 그러자 야훼의 영광[c]이 그들에게 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘회중 앞을 떠나’는 모인 백성의 면전 또는 উপস্থিত로부터 물러났다는 뜻의 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘회중’은 ‘집회’ 또는 ‘모인 공동체’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼의 영광이 그들에게 나타났다’를 ‘야훼의 영광이 그들에게 보였다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַקָּהָל
  english_pob_choice: from before the assembly
  chosen_korean: 회중 앞에서부터
  alternatives_korean:
  - 회중 앞에서
  - 회중의 앞에서부터
  - 회중을 떠나
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 위치가 아니라 ‘모인 백성의 앞/면전으로부터 물러남’을 뜻하므로, 자연스러우면서도 출처의 공간적 뉘앙스를 살려 ‘회중 앞에서부터’로 옮겼습니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 회합
  lexicon: HALOT
  rationale: קהל은 예배 기관보다 ‘모인 공동체’의 뜻이 강하므로, POB 기본 용례에 맞춰 ‘회중’으로 번역했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  - 회의 장막
  lexicon: HALOT
  rationale: 성막 용어로 정착된 ‘회막’을 사용해 본문의 성소 맥락을 분명히 했습니다. 다만 뒤에 ‘문’을 덧붙여 히브리어의 구체적 위치감을 유지했습니다.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  english_pob_choice: fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 쓰러졌습니다
  - 얼굴을 땅에 대고 엎드렸습니다
  - 얼굴을 땅에 대고 엎드러졌습니다
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘얼굴 위에 떨어지다’를 한국어에서 자연스럽게 이해되도록 풀되, 몸을 낮추는 절대적 경외의 자세는 유지했습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 광채
  - 야훼의 위엄
  - 주의 영광
  lexicon: HALOT
  rationale: כבוד는 여기서 단순한 ‘영예’가 아니라 하나님 자신의 현현된 영광을 가리키므로 ‘영광’으로 옮겼고, יְהוָה는 도구 지침에 따라 ‘야훼’로 보존했습니다.
theological_decisions:
- issue: 여호와의 현현을 가리키는 כְבוֹד יְהוָה의 번역
  chosen_reading: ‘야훼의 영광’으로 직역해, 단순한 빛의 현상보다 하나님의 현존이 드러나는 사건임을 살렸습니다.
  alternative_readings:
  - ‘야훼의 위엄’
  - ‘주님의 영광’
  rationale: 본문은 하나님의 임재가 가시적으로 나타나는 장면이므로, 전통적 완화 표현보다 स्रोत의 직접성을 우선했습니다.
  doctrine_reference: 출애굽기/민수기 성막 현현 본문에서의 하나님의 영광 개념
- issue: 회막 문에서의 엎드림 동작
  chosen_reading: ‘얼굴을 땅에 대고 엎드렸습니다’로 번역해 완전한 경배와 중보의 자세를 드러냈습니다.
  alternative_readings:
  - ‘엎드렸습니다’
  - ‘얼굴을 땅에 대고 절했습니다’
  rationale: 단순한 몸짓이 아니라 위기 앞에서의 전적인 항복과 간구를 나타내므로, 자세를 분명히 보이되 과도한 해석은 피했습니다.
  doctrine_reference: 성막 앞 경외와 중보의 서사적 맥락
