lexical_decisions:
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 데리고 가십시오
  alternatives_korean:
  - 데려가십시오
  - 가져가십시오
  lexicon: HALOT
  rationale: 모세에게 사람들을 함께 이동시키라는 명령이므로, 한국어에서는 단순한 ‘취하다’보다 인물을 목적지로 이끄는 뜻이 분명한 ‘데리고 가십시오’가 자연스럽습니다.
- source_word: וְהַעַל
  english_pob_choice: bring ... up
  chosen_korean: 올라가십시오
  alternatives_korean:
  - 올려가십시오
  - 데리고 올라가십시오
  - 데리고 오르십시오
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 담되, 산을 목적지로 한 표현에서는 한국어 명령형 ‘올라가십시오’가 가장 자연스럽고 ‘위로 데려가다’의 방향성도 살립니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아론의 아들
  lexicon: HALOT
  rationale: 문맥상 대명사 접미사는 아론을 가리키므로, 소유를 드러내는 ‘그의 아들’로 옮기면 히브리어의 지시관계를 그대로 반영할 수 있습니다.
- source_word: הֹר הָהָר
  english_pob_choice: Mount Hor
  chosen_korean: 호르 산
  alternatives_korean:
  - 호르 산산
  - 호르 그 산
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘호르 그 산’이지만, 관용적 지명인 ‘호르 산’이 한국어 성경 문맥에서 더 자연스럽고 식별 가능합니다.
