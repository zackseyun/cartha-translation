id: NUM.20.17
reference: Numbers 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
  footnotes:
  - marker: a
    text: Or “the king’s highway.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your border”; the phrase means passing beyond the boundary of your territory.
    reason: lexical_alternative
translation:
  language: ko
  text: 청하오니, 당신의 땅[a]을 지나가게 해 주십시오. 우리는 밭이나 포도원을 지나가지 않을 것이며, 우물의 물도 마시지 않을 것입니다. 우리는 왕의 길[b]로 가겠습니다. 오른쪽으로도 왼쪽으로도 치우치지 않고, 당신의 경계를 지나갈 때까지 그렇게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 나라를 지나가게 해 주십시오.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “왕의 길”로, 정해진 도로를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא / בְאַרְצֶךָ
  english_pob_choice: Please let us pass through your land
  chosen_korean: 당신의 땅을 지나가게 해 주십시오
  alternatives_korean:
  - 부디 당신의 땅을 지나가게 해 주십시오
  - 당신의 땅을 통과하게 해 주십시오
  lexicon: HALOT
  rationale: cohortative + נָא의 공손한 요청을 한국어의 정중한 부탁말로 옮겼고, בְאַרְצֶךָ는 מעבר와 결합한 이동 경로로서 '땅을 지나가다'가 가장 직접적입니다.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  english_pob_choice: We will not pass through field or vineyard
  chosen_korean: 밭이나 포도원을 지나가지 않을 것이며
  alternatives_korean:
  - 밭과 포도원을 지나가지 않을 것이며
  - 어느 밭이나 포도원도 지나가지 않을 것이며
  lexicon: HALOT
  rationale: 히브리어의 단수 명사들을 한국어에서는 자연스러운 집합적 표현인 '밭'과 '포도원'으로 옮겨, 경작지를 가로지르지 않겠다는 뜻을 살렸습니다.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  english_pob_choice: and we will not drink water from a well
  chosen_korean: 우물의 물도 마시지 않을 것입니다
  alternatives_korean:
  - 우물 물도 마시지 않을 것입니다
  - 우물에서 나온 물도 마시지 않을 것입니다
  lexicon: HALOT
  rationale: מֵי בְאֵר의 소유·출처 관계를 '우물의 물'로 옮겨, 영어의 'water from a well'보다 원문의 구조를 더 분명히 드러냈습니다.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  english_pob_choice: the king’s road
  chosen_korean: 왕의 길
  alternatives_korean:
  - 왕의 도로
  - 왕의 대로
  lexicon: HALOT
  rationale: 직역에 가까운 '왕의 길'이 דֶּרֶךְ הַמֶּלֶךְ의 고유한 지정 경로를 가장 간결하게 드러내며, 현대 한국어에서도 자연스럽습니다.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  english_pob_choice: we will not turn to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도 치우치지 않고
  alternatives_korean:
  - 오른쪽으로도 왼쪽으로도 돌지 않고
  - 우로나 좌로나 치우치지 않고
  lexicon: HALOT
  rationale: 관용구의 핵심은 경로 이탈 금지이므로, '치우치지 않다'로 자연스럽고도 의미를 보존하는 표현을 택했습니다.
- source_word: גְּבוּלֶךָ
  english_pob_choice: your border
  chosen_korean: 당신의 경계
  alternatives_korean:
  - 당신의 경계선
  - 당신의 영토 경계
  lexicon: HALOT
  rationale: גְּבוּל은 '경계/변경'의 의미가 있으므로, 지리적 경계선을 분명히 드러내는 '경계'가 가장 무난합니다.
theological_decisions:
- issue: 정중한 청원문의 어조
  chosen_reading: '''청하오니… 해 주십시오''로 공손한 요청의 뉘앙스를 살렸습니다.'
  alternative_readings:
  - '''부디… 허락해 주십시오'''
  - '''…하게 하소서'''
  rationale: 이 절은 예의 바른 통과 요청이므로, 한국어에서도 청원문의 존대를 유지하는 것이 원문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 서사 맥락의 화행 보존
