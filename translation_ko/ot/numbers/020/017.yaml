  source_fidelity: 대체로 히브리어의 공손한 통과 요청, 경작지와 우물물의 불사용 약속, 왕의 길을 따르겠다는 약속을 충실히 반영합니다. 다만 마지막 절의 '그렇게 하겠습니다'는 원문에 없는 지시적 내용을 보태며, '당신의 경계를 지나갈 때까지'와의 연결도 불명확합니다. 시간절을 '치우치지 않겠다'는 약속에 직접 연결하는 편이 עַד אֲשֶׁר 절과 더 정확히 대응합니다.
  naturalness: '''청하오니''와 ''해 주십시오''의 결합은 다소 격조가 섞여 있고, 마지막 문장의 ''그렇게 하겠습니다''는 현대 표준어 합쇼체에서 부자연스럽습니다. ''부디''와 일관된 ''-겠습니다/-해 주십시오'' 체계, 그리고 직접적인 문장 연결이 더 자연스럽습니다.'
