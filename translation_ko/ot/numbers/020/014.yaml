review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 어휘인 가데스, 에돔 왕, 이스라엘의 형제 관계, 그리고 이스라엘에게 닥친 고난을 대체로 반영합니다. 그러나 히브리어의 사절 전언 형식인 ‘이렇게 말한다’를 ‘말하기를 … 라고 하라’로 옮겨, 본문에 없는 명령 표현을 덧붙였고 문장 구조도 부정확해졌습니다.
  naturalness: ‘네 형’과 ‘아나니’는 목표로 한 현대 표준어 합쇼체와 맞지 않으며, ‘…라고 하라’는 모세가 사자들에게 내린 별도의 명령처럼 들립니다. 현대적이고 공적인 전언 문체로 다듬었습니다.
  terminology: מַלְאָכִים은 외교 문맥상 ‘사자들’로, תְּלָאָה는 ‘고난’으로 옮겼습니다. אָחִיךָ יִשְׂרָאֵל의 혈연 은유는 ‘당신의 형제 이스라엘’로 보존했습니다. מְצָאָתְנוּ의 ‘우리에게 닥치다’라는 관용적 의미도 유지했습니다.
  issues:
  - severity: medium
    issue: ‘말하기를, …라고 하라’가 본문에 없는 명령을 삽입하고 전언 공식을 왜곡합니다.
    rationale: 히브리어는 모세가 사자들을 보내어 에돔 왕에게 전달한 메시지의 내용을 직접 인용합니다. ‘…라고 하라’는 사자들에게 지시하는 별도 발화를 추가합니다.
  - severity: medium
    issue: ‘네 형’과 ‘아나니’가 현대 합쇼체 공적 خطاب에 부적절합니다.
    rationale: 에돔 왕에게 전달되는 외교적 메시지이므로 ‘당신의 형제’, ‘알고 있습니다’가 현대 표준어 합쇼체에 맞습니다.
  revised_text: 모세는 가데스에서 사자들을 에돔 왕에게 보내어 이렇게 전했습니다. “당신의 형제 이스라엘이 이렇게 말합니다. 당신은 우리에게 닥친 모든 고난을 알고 있습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “당신의 친족 이스라엘.” 히브리어는 “당신의 형제 이스라엘”이라는 가족 관계의 표현을 사용하여 에돔과 이스라엘의 조상 관계를 환기합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “모든 환난” 또는 “모든 고통.”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “우리를 찾아온.” 곧 “우리에게 닥친” 또는 “우리에게 닥쳐온”이라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 본문에 없는 ‘…라고 하라’를 제거하고, 사절을 통한 메시지 전달이라는 원문의 구문과 현재형 전언 공식을 자연스러운 현대 합쇼체로 옮겼습니다. ‘형제’라는 혈연 은유와 ‘닥친’이라는 관용적 의미는 보존했습니다. 각주 내용은 본문에 앵커를 표시하지 않은 메타데이터 형식으로 제공했습니다.
