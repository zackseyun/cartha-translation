  source_fidelity: 초안의 ‘야훼의 앞에서 지팡이를 취하니’는 מִלִּפְנֵי의 ‘야훼 앞에서/앞에 있던 곳으로부터’를 모세가 지팡이를 취한 장소처럼 읽히게 할 수 있습니다. 또한 뒤 절의 주어가 한국어상 모호합니다. ‘야훼 앞에 있던 지팡이’ 및 명시된 주어로 원문의 관계를 분명히 할 수 있습니다.
