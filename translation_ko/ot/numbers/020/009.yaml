  terminology: ‘모세’, ‘야훼’, ‘지팡이’는 적절합니다. מַטֶּה의 대안인 ‘막대기’는 본문에 병기할 필요가 없으며, 문맥상 ‘지팡이’가 자연스럽습니다.
