  to: 야훼께서 모세와 아론에게 말씀하셨습니다. “너희가 나를 믿지 않고[a] 이스라엘 자손[c]이 보는 앞에서 나를 거룩하게 나타내지 않았으므로[b], 너희는 이 회중을 내가 그들에게 준 땅으로 들여보내지 못할 것입니다.”
