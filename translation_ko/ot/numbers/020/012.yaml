  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
  footnotes:
  - marker: a
    text: Or “you did not trust me.” The Hebrew verb can carry the sense of believing or trusting.
    reason: lexical_alternative
  - marker: b
    text: Or “to sanctify me” or “to uphold me as holy.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “the sons of Israel”; traditionally “the children of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세와 아론에게 말씀하셨습니다. "너희가 나를 믿지 않고 이스라엘 자손의 눈앞에서 나를 거룩하게 하지 않았으므로, 너희는 이 회중을 내가 그들에게 준 땅으로 들여보내지 못할 것입니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안: “나를 신뢰하지 않고.” 히브리어 동사는 믿음과 신뢰의 뜻을 모두 가질 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '대안: “나를 거룩하게 하려고” 또는 “나의 거룩함을 드러내려고.”'
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 “이스라엘 자손”입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה를 통상적 호칭으로 바꾸지 않고 고유한 신적 이름으로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: הֶאֱמַנְתֶּם בִּי
  english_pob_choice: you did not believe me
  chosen_korean: 너희가 나를 믿지 않고
  alternatives_korean:
  - 너희가 나를 신뢰하지 않고
  - 너희가 나에게 믿음을 두지 않고
  lexicon: HALOT
  rationale: 히브리어는 대상 앞의 בִּי를 포함한 ‘믿다/신뢰하다’의 의미이므로, 직역성을 유지하면서도 한국어에서 자연스러운 ‘나를 믿지 않고’로 옮겼습니다.
- source_word: לְהַקְדִּישֵׁנִי
  english_pob_choice: to treat me as holy
  chosen_korean: 나를 거룩하게 하지 않았으므로
  alternatives_korean:
  - 나를 거룩하게 구별하지 않았으므로
  - 나를 거룩하다고 드러내지 않았으므로
  lexicon: HALOT
  rationale: 공적으로 하나님을 거룩하게 여기고 드러내는 causative 의미를 한국어에서 가장 सीधे하게 표현했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 형식적으로는 ‘sons of Israel’에 대응하는 표현을 유지하되, 한국어 성경에서 자연스럽고 통용되는 ‘이스라엘 자손’을 사용했습니다.
- source_word: הַקָּהָל
  english_pob_choice: this assembly
  chosen_korean: 이 회중
  alternatives_korean:
  - 이 집회
  - 이 모인 무리
  lexicon: HALOT
  rationale: 광야 공동체를 가리키는 קהל을 제도적 교회가 아니라 모여 있는 공동체라는 뜻으로 살리기 위해 ‘회중’을 택했습니다.
theological_decisions:
- issue: 모세와 아론의 잘못에 대한 진술 유지
  chosen_reading: 본문이 말하는 두 요소—‘나를 믿지 않음’과 ‘백성 앞에서 나를 거룩하게 하지 않음’—를 분리하지 않고 함께 보존했습니다.
  alternative_readings:
  - 하나님을 신뢰하지 못했다
  - 하나님의 거룩을 충분히 드러내지 못했다
  rationale: 본문은 불신앙과 공적 거룩성 결핍을 함께 제시하므로, 해석으로 하나로 합치지 않고 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
