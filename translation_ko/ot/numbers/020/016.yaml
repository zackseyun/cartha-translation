id: NUM.20.16
reference: Numbers 20:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
  footnotes:
  - marker: a
    text: Or 'a messenger.' The Hebrew word can refer to either a human or heavenly messenger, though in this context many understand it as an angelic messenger from God.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 야훼께 부르짖었고, 그분께서는 우리의 소리를 들으시고 천사[a]를 보내셔서 우리를 이집트에서 이끌어 내셨습니다. 보십시오, 우리는 당신의 영토 끝에 있는 성읍 가데스에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전령’. 히브리어 낱말은 인간 전령이나 천사를 가리킬 수 있습니다. 이 문맥에서는 많은 이가 이를 하나님께서 보내신 천사로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  english_pob_choice: we cried out
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 외쳤고
  - 울부짖었고
  lexicon: HALOT
  rationale: צעק은 단순한 말하기보다 도움을 구하는 절박한 외침을 가리키므로, 한국어에서는 ‘부르짖다’가 그 긴박함을 가장 잘 드러냅니다.
- source_word: מַלְאָךְ
  english_pob_choice: an angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 전령
  lexicon: HALOT
  rationale: 원어는 ‘사자/전령’까지 포괄하지만, 출애굽 문맥에서는 하늘의 사자로 이해되는 것이 자연스러워 ‘천사’로 옮기되, 더 좁은 신학적 동일시는 덧붙이지 않았습니다.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  english_pob_choice: he heard our voice
  chosen_korean: 우리의 소리를 들으시고
  alternatives_korean:
  - 우리의 음성을 들으시고
  - 우리의 호소를 들으시고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘우리의 소리’를 들었다고 말하므로, 이를 보존하면서도 한국어답게 자연스럽게 표현했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지로서, 현대 한국어에서 자연스럽고 공손한 감탄/지시 표현인 ‘보십시오’가 적절합니다.
theological_decisions:
- issue: מַלְאָךְ의 정체를 어디까지 특정할 것인가
  chosen_reading: ‘천사’로 옮기되, ‘야훼의 사자’나 특정 현현으로는 확정하지 않았습니다.
  alternative_readings:
  - 전령
  - 야훼의 천사로 특정하기
  rationale: 본문 자체는 야훼께서 어떤 존재를 ‘보내셨다’고만 말하므로, 번역에서 더 구체적인 신학적 동일시를 앞서지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙과 해석적 절제
- issue: 야훼의 호칭을 어떻게 처리할 것인가
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 용례에 따라 신적 고유명을 보존하여, 본문의 인격적 호칭과 원문 가시성을 유지했습니다.
  doctrine_reference: Tetragrammaton transliteration policy
