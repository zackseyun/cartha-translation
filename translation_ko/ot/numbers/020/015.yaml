id: NUM.20.15
reference: Numbers 20:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּרְד֤וּ אֲבֹתֵ֨י/נוּ֙ מִצְרַ֔יְמָ/ה וַ/נֵּ֥שֶׁב בְּ/מִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַ/יָּרֵ֥עוּ לָ֛/נוּ מִצְרַ֖יִם וְ/לַ/אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
  footnotes:
  - marker: a
    text: Or 'our ancestors' for 'our fathers' in both occurrences; the Hebrew is literally 'our fathers.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'many days,' an idiom for a long period.
    reason: lexical_alternative
  - marker: c
    text: Or 'mistreated us and our fathers' or 'did evil to us and our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들이 이집트로 내려갔고, 우리는 이집트에서 오랜 날들을 지냈습니다[a][b]. 그리고 이집트 사람들이 우리와 우리 조상들을 못되게 대했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘많은 날들’이지만, 긴 기간을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리와 우리 조상들을 학대했습니다’, ‘우리와 우리 조상들에게 악을 행했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ ... מִצְרַיְמָה
  english_pob_choice: went down to Egypt
  chosen_korean: 이집트로 내려갔고
  alternatives_korean:
  - 이집트로 갔고
  - 이집트에 내려갔고
  lexicon: HALOT
  rationale: ירד의 기본 의미인 ‘내려가다’를 살리면서, 약속의 땅에서 이집트로 이동한 지리적 하강을 자연스럽게 드러냅니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들이
  alternatives_korean:
  - 우리 아버지들이
  - 우리 선조들이
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현은 ‘우리의 아버지들’이지만, 이 역사 회고 문맥에서는 세대적 선조를 가리키므로 한국어에서는 의미를 분명히 하는 ‘조상들’이 가장 자연스럽습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: many days
  chosen_korean: 오랜 날들을
  alternatives_korean:
  - 많은 날들을
  - 오랫동안
  lexicon: HALOT
  rationale: 직역인 ‘많은 날들’의 어감을 유지하되, 한국어에서 자연스러운 관용으로 긴 기간을 뜻하는 표현을 택했습니다. 본문의 시간감각을 과도하게 구체화하지 않기 위해 ‘오랜 날들’로 옮겼습니다.
- source_word: וַיָּרֵעוּ לָנוּ ... וְלַאֲבֹתֵינוּ
  english_pob_choice: treated us and our fathers badly
  chosen_korean: 못되게 대했습니다
  alternatives_korean:
  - 학대했습니다
  - 우리를 해롭게 했습니다
  - 우리와 우리 조상들에게 악을 행했습니다
  lexicon: HALOT
  rationale: רעע의 ‘해를 끼치다/악하게 대하다’라는 의미를 너무 좁히지 않으면서, 현대 한국어에서 폭넓게 이해될 수 있는 표현을 선택했습니다.
theological_decisions:
- issue: ‘우리 조상들’로 옮길지 ‘우리 아버지들’의 형식을 유지할지
  chosen_reading: 역사적 회고에서 집단적 선조를 가리키는 의미를 드러내기 위해 ‘우리 조상들’을 사용했습니다.
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 본문의 히브리어는 문자적으로는 ‘우리의 아버지들’이지만, 한국어 독자는 이를 친부모로 오해할 수 있어, 원문의 대표적 의미를 명확히 전달하는 쪽이 더 충실합니다.
  doctrine_reference: 출애굽 회고의 언약 공동체 정체성
