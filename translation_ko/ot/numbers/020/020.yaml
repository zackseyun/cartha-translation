id: NUM.20.20
reference: Numbers 20:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לֹ֣א תַעֲבֹ֑ר וַ/יֵּצֵ֤א אֱדוֹם֙ לִ/קְרָאת֔/וֹ בְּ/עַ֥ם כָּבֵ֖ד וּ/בְ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
  footnotes:
  - marker: a
    text: Or “to confront him” for “to meet him”; the Hebrew expression itself is neutral, but the context is clearly hostile.
    reason: lexical_alternative
  - marker: b
    text: Literally, “with a heavy people,” an idiom meaning a large or imposing body of men.
    reason: lexical_alternative
  - marker: c
    text: Or “with a mighty hand,” that is, with strong power or force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 말했습니다. “너는 지나가서는 안 된다.” 에돔은 많은 백성을 거느리고 강한 손으로 그를 맞으러 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “무거운 백성”이지만, 여기서는 크고 위압적인 집단을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 ‘손’은 문자 그대로의 손이 아니라 힘과 권세를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But he said
  chosen_korean: 그러나 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 보이면서도, 바로 앞 요청에 대한 거절이라는 문맥상 대조를 살려 ‘그러나’로 옮겼습니다.
- source_word: לֹא תַעֲבֹר
  english_pob_choice: You shall not pass through
  chosen_korean: 네가 통과하지 못할 것이다
  alternatives_korean:
  - 네가 지나가지 못할 것이다
  - 통과해서는 안 된다
  lexicon: HALOT
  rationale: עבר의 ‘지나가다/통과하다’ 의미를 살리면서, 직접 거절의 강한 금지를 한국어로 자연스럽게 표현했습니다.
- source_word: בְּעַם כָּבֵד
  english_pob_choice: with a large force
  chosen_korean: 큰 무리와
  alternatives_korean:
  - 무거운 백성과
  - 많은 사람들과
  lexicon: HALOT
  rationale: 직역하면 ‘무거운 백성’이지만, 관용구로서 크고 압도적인 집단을 가리키므로 문맥에 맞게 ‘큰 무리’로 옮겼습니다.
- source_word: וּבְיָד חֲזָקָה
  english_pob_choice: and with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 강력한 손으로
  - 굳센 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 보존해 ‘손’의 이미지를 살렸고, כוח/세력을 뜻하는 강함을 ‘강한’으로 간명하게 반영했습니다.
theological_decisions:
- issue: 에돔의 대응 묘사에서 호전성의 함의 처리
  chosen_reading: ‘맞으러 나왔습니다’로 옮겨, 본문의 중립적 동사 ‘만나다’의 기본 뜻을 유지하되 문맥상 적대적 대응임이 드러나게 했습니다.
  alternative_readings:
  - ‘대적하러 나왔습니다’
  - ‘맞서러 나왔습니다’
  rationale: 영문 POB도 ‘to meet him’을 기본값으로 두고 주석에서 적대성을 설명하므로, 본문에는 과잉 해석을 피하고 주석 없이도 문맥이 읽히는 수준으로만 반영했습니다.
  doctrine_reference: 본문 문맥과 어휘 의미 보존
- issue: ‘strong hand’의 관용구 처리
  chosen_reading: ‘강한 손’으로 직유를 유지했습니다.
  alternative_readings:
  - ‘강력한 힘’
  - ‘강한 세력’
  rationale: 히브리어의 신체 이미지가 전달하는 힘의 감각을 보존하는 것이 본문 표현을 더 충실히 드러내므로, 관용적 의미를 완전히 평문화하지 않았습니다.
  doctrine_reference: 관용구 보존과 서술 이미지 유지
