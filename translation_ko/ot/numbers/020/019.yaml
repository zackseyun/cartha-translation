  source_fidelity: 대체로 원문을 충실히 따르지만, ‘발로만’은 רַק(‘오직/그저’)의 제한이 ‘발로’ 자체에 걸리는 것처럼 들릴 수 있습니다. 마지막의 ‘다른 것은 아무것도 없습니다’도 אֵין דָּבָר의 요청 축소 표현으로는 한국어에서 부자연스럽습니다. בַּמְסִלָּה는 이동 경로를 나타내므로 ‘큰길을 따라’가 더 분명합니다.
  naturalness: 직접 인용문에서 ‘그저 제 발로 지나가겠습니다. 그뿐입니다’가 현대 한국어의 격식 있는 말투로 자연스럽고, 원문의 간결한 제한 표현도 살립니다. ‘높이 올린 길, 곧 고속통행로’의 ‘고속통행로’는 현대적·기술적인 표현이므로 피하는 것이 좋습니다.
  terminology: ‘이스라엘 자손’, ‘큰길’, ‘가축’, ‘값을 지불하겠습니다’는 적절합니다. ‘당신의 물’은 본문의 직접 발화 관계에서 허용됩니다. 각주는 본문 선택어 및 원문의 문자적 표현에 맞추어 조정했습니다.
