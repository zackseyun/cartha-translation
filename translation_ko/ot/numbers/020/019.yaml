  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “on the main road.” The Hebrew term refers to a highway or raised roadway.
    reason: lexical_alternative
  - marker: c
    text: Literally “with my feet I will pass through,” an idiom for simple passage through the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 그에게 말했습니다[a]. “우리는 큰길로 올라가겠습니다. 나와 내 가축이 당신의 물을 마시게 되더라도 그 값을 지불하겠습니다. 다만 발로만 지나가게 해 주십시오[c][b], 다른 것은 아무것도 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들.” 히브리어는 “이스라엘 자손”이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “큰길로.” 히브리어 용어는 높이 올린 길, 곧 고속통행로를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “내 발로 내가 지나가겠다”는 뜻으로, 해를 끼치지 않고 단순히 통과하겠다는 관용적 표현입니다.
    reason: lexical_alternative
