  to: 이스라엘 자손이 그에게 말했습니다[a]. “우리는 큰길을 따라 올라가겠습니다[b]. 나와 내 가축이 당신의 물을 마시면 그 값을 지불하겠습니다. 그저 제 발로 지나가겠습니다[c]. 그뿐입니다.”
  rationale: 제한사 רַק을 ‘그저’로 옮겨 전체 요청을 한정하고, אֵין דָּבָר를 ‘그뿐입니다’로 자연스럽게 표현했습니다. ‘큰길을 따라’는 בַּמְסִלָּה의 이동 경로 의미를 한국어에서 명확히 드러냅니다. 각주 표지는 해당 본문 표현 바로 뒤에 배치했으며, 각주의 시대착오적 설명과 불필요하게 강한 해석을 제거했습니다.
