  lexicon: HALOT
  rationale: 서사문의 공식적 발화 도입을 자연스럽게 살리되, 신적 화자의 품격을 유지하기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 관습적 대체어가 아니라 음역으로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: אֶל
