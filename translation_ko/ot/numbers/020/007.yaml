- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 이르시되
  alternatives_korean:
  - 말씀하시며
  - 말하여
  lexicon: HALOT
  rationale: 다음 절의 직접인용을 여는 관용구로서 ‘이르시되’를 사용해 히브리어의 발화 도입 구조를 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어에서 어떻게 드러낼지
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 반영했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’ 사용
  rationale: 본문은 대명사나 칭호가 아니라 언약적 신명 יְהוָה를 직접 사용하므로, 의미를 약화시키는 대체보다 고유 이름을 보존하는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 인용문 도입의 한국어 문체
  chosen_reading: ‘이르시되’로 다음 절의 신탁적 직접화법을 예고했습니다.
  alternative_readings:
  - ‘말씀하셨습니다’만 사용
  - ‘말하여’
  rationale: 히브리어 לֵאמֹר의 관용적 기능은 곧 이어질 직접말씀을 여는 데 있으므로, 한국어에서도 그 기능이 보이도록 했습니다.
  doctrine_reference: 서사-직접화법 전환의 문체적 재현
