  source_fidelity: 본문은 에돔이 국경 통과를 금하고, 불응할 경우 칼로 맞서러 나올 것이라고 위협하는 내용입니다. 초안의 ‘내 안을 통과’는 בִּי의 영토적 용법을 지나치게 문자적으로 옮겨 현대 한국어에서 부자연스럽습니다. 또한 ‘너를 맞으러’는 환영의 뜻으로도 쉽게 읽힐 수 있어 적대적 문맥을 충분히 드러내지 못합니다.
  naturalness: ‘내 영토를 지나가다’와 ‘칼을 들고 너와 맞서러 나가다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 본문의 공적 거절과 위협의 어조를 유지합니다.
  terminology: 고유명사 ‘에돔’을 유지했습니다. ‘칼’은 בַּחֶרֶב의 무장 위협을 충실히 반영합니다. 각주 표지는 해당 표현 바로 뒤에 배치하여 각주의 지시 대상을 분명히 했습니다.
