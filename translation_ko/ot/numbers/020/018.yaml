id: NUM.20.18
reference: Numbers 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
  footnotes:
  - marker: a
    text: Literally, “through me.” Since Edom speaks as a nation/territory, the phrase means passage through Edom’s land.
    reason: lexical_alternative
  - marker: b
    text: 'Or “to meet you.” In this context the phrase carries a hostile sense: to come out in armed opposition.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 에돔이 그에게 말했습니다. “너는 내 영토를 지나가서는 안 됩니다[a]. 그렇지 않으면 내가 칼을 들고 너와 맞서러 나가겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 안에서/나를 통하여’라고 합니다. 에돔이 나라와 영토를 대표하여 말하므로, 여기서는 에돔 영토를 지나는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘너를 만나러’입니다. 그러나 칼이 언급된 이 문맥에서는 무장하여 적대적으로 맞서는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱדוֹם
  english_pob_choice: But Edom said to him
  chosen_korean: 그러나 에돔이 그에게 말했습니다
  alternatives_korean:
  - 에돔이 그에게 말했습니다
  - 그런데 에돔이 그에게 말했습니다
  lexicon: HALOT
  rationale: 서술적 wayyiqtol은 한국어에서 자연스러운 과거 서술로 옮기되, 앞선 요청을 거절하는 전환을 살리기 위해 ‘그러나’를 두었습니다.
- source_word: בִּי
  english_pob_choice: through me
  chosen_korean: 내 안을 통과해서는
  alternatives_korean:
  - 내 땅을 지나서는
  - 나를 통과해서는
  lexicon: HALOT
  rationale: 직역상 ‘나를/내 안을’이지만, 에돔이 영토를 의인화해 말하는 구조를 살리면서도 문맥상 ‘통과하다’의 공간적 의미가 드러나게 했습니다.
- source_word: לֹא תַעֲבֹר
  english_pob_choice: You shall not pass
  chosen_korean: 통과해서는 안 됩니다
  alternatives_korean:
  - 지나가서는 안 됩니다
  - 통과하지 마십시오
  lexicon: HALOT
  rationale: 금지의 선언을 현대 한국어의 공적 문체로 자연스럽게 옮겼습니다. ‘지나가다’도 가능하지만, 출입 허가 거절의 공식성을 위해 ‘통과하다’를 택했습니다.
- source_word: בַּחֶרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼을 들고
  alternatives_korean:
  - 칼로
  - 칼을 가지고
  lexicon: HALOT
  rationale: 히브리어 관용구는 무장한 적대 행위를 뜻하므로, 한국어에서는 동작을 보강해 위협의 실감을 살렸습니다.
- source_word: לִקְרָאתֶךָ
  english_pob_choice: against you
  chosen_korean: 너를 맞으러
  alternatives_korean:
  - 너와 맞서
  - 너를 대항하러
  lexicon: HALOT
  rationale: 직역 ‘만나러’가 가능하지만 이 문맥에서는 적대적 대치를 뜻하므로, 자연스러운 한국어로 위협적 의도를 드러냈습니다.
theological_decisions:
- issue: 에돔의 발화 방식과 강도
  chosen_reading: 에돔이 자기 영토를 의인화하여 국경 통과를 거부하며 무력 충돌을 예고하는 말로 이해했습니다.
  alternative_readings:
  - 단순한 길 안내 거절
  - 개인적 적대 발언
  rationale: 문맥상 민족/영토가 말하는 의인화이며, 칼로 맞서겠다는 위협은 단순한 거절을 넘어선 적대 행위입니다.
  doctrine_reference: 본문 문맥 주해
