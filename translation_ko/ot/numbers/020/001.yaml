  terminology: ‘이스라엘 자손’, ‘온 회중’, ‘신 광야’, ‘가데스’, ‘미리암’은 적절합니다. 각주 b는 ‘온 회중’의 어휘 대안을 설명하므로 가데스가 아니라 ‘온 회중’에 붙여야 합니다.
