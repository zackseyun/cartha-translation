  text: 이스라엘 자손[a], 곧 온 회중[b]이 첫째 달에 신 광야에 이르렀습니다. 백성은 가데스에 머물렀습니다. 미리암은 거기서 죽어 거기에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
