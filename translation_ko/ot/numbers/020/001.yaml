revisions:
- from: 이스라엘 자손[a], 곧 온 회중은 시ן 광야에 첫째 달에 이르렀습니다. 백성은 가데스[b]에 머물렀습니다. 미리암이 거기서 죽었고 거기서 장사되었습니다.
  to: 이스라엘 자손[a], 곧 온 회중[b]이 첫째 달에 신 광야에 이르렀습니다. 백성은 가데스에 머물렀습니다. 미리암은 거기서 죽어 거기에 묻혔습니다.
