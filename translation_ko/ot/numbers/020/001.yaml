  source_fidelity: 히브리어의 주어 구조(‘이스라엘 자손, 곧 온 회중’), 첫째 달, 신 광야, 가데스에서의 체류, 미리암의 죽음과 매장을 충실히 반영합니다. 다만 초안의 ‘시ן’은 한글과 히브리 문자가 혼합된 표기 오류이며, ‘신 광야’로 바로잡아야 합니다.
