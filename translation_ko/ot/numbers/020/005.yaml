id: NUM.20.5
reference: Numbers 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
  footnotes:
  - marker: a
    text: Hebrew 'a place of seed' may mean a place fit for sowing or a place producing grain/crops.
    reason: lexical_alternative
  - marker: b
    text: Or 'this bad place' or 'this miserable place'; 'evil' here describes the place as harmful or undesirable, not necessarily morally evil.
    reason: lexical_alternative
  - marker: c
    text: Or 'fig trees' and 'grapevines.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 당신들은 우리를 이집트에서 올라오게 하여 이 악한 곳으로 데려오셨습니까? 여기는 곡식[a]도 없고, 무화과도, 포도나무도, 석류도 없으며, 마실 물도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘씨의 장소’이지만, 여기서는 파종에 알맞은 땅 또는 곡식/농산물이 나는 땅을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  english_pob_choice: And why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 불평과 항의의 흐름을 살리면서도 현대 합쇼체 문맥에 자연스러운 질문형으로 옮겼습니다.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  english_pob_choice: have you brought us up out of Egypt
  chosen_korean: 우리를 이집트에서 올라오게 하여
  alternatives_korean:
  - 우리를 이집트에서 데려오셔서
  - 우리를 이집트에서 끌어올려
  lexicon: HALOT
  rationale: עלה의 ‘올라오게 하다’라는 출애굽적 관용을 살리되, 한국어 문장 흐름에 맞게 자연스럽게 처리했습니다.
- source_word: הַמָּקוֹם הָרָע הַזֶּה
  english_pob_choice: this evil place
  chosen_korean: 이 악한 곳
  alternatives_korean:
  - 이 나쁜 곳
  - 이 불행한 곳
  lexicon: HALOT
  rationale: רַע의 강한 부정성을 유지하되, 장소에 대한 평가라는 점을 드러내기 위해 ‘악한 곳’으로 옮겼습니다.
- source_word: לֹא מְקוֹם זֶרַע
  english_pob_choice: It is not a place of grain[a]
  chosen_korean: 곡식[a]도 없고
  alternatives_korean:
  - 씨 뿌릴 곳도 없고
  - 파종할 곳도 없고
  lexicon: HALOT
  rationale: 직역하면 ‘씨의 장소’이지만, 열매 목록과 함께 제시되는 농업적 풍요의 부재를 한국어로 가장 분명하게 드러내는 ‘곡식’으로 옮겼습니다.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  english_pob_choice: figs, or vines, or pomegranates
  chosen_korean: 무화과도, 포도나무도, 석류도
  alternatives_korean:
  - 무화과나무도, 포도나무도, 석류나무도
  - 무화과도, 포도덩굴도, 석류도
  lexicon: HALOT
  rationale: 열거된 산물/식물의 이미지를 유지하면서 한국어에서는 익숙한 명사형 표현으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 라멸/도덕적 의미가 아닌 장소 평가로서의 ‘악한’
  chosen_reading: ‘악한 곳’은 도덕적 악이라기보다 그곳이 해롭고 견디기 어렵다는 평가로 이해해 옮겼습니다.
  alternative_readings:
  - ‘나쁜 곳’
  - ‘불행한 곳’
  rationale: 문맥상 백성의 원망은 그 장소의 실제적 열악함을 고발하는 것이므로, 과도하게 신학화하지 않고 강한 평가어를 유지했습니다.
  doctrine_reference: 문맥-의미 우선 원칙
- issue: 여기서의 화자 호칭을 ‘당신들은’로 유지
  chosen_reading: 모세/아론을 향한 집단적 항의로 보아 2인칭 복수의 직접 호소를 살렸습니다.
  alternative_readings:
  - ‘왜 우리를’로 단순화
  - ‘어찌하여 우리를’
  rationale: 히브리어 복수 어미와 불평의 공격성을 반영하려면 직접 호칭을 완전히 지우지 않는 편이 더 충실합니다.
  doctrine_reference: 서사 담화 보존
