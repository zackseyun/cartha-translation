translation:
  language: ko
  text: 그때 모세와 아론은 회중을 바위 앞에 모았습니다. 그가 그들에게 말했습니다. 「이제 들으십시오, 반역자들이여. 우리가 이 바위에서 너희를 위해 물을 끌어내겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 이 바위에서 너희를 위해 물을 내어 놓겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהִלוּ / הַקָּהָל
  english_pob_choice: assembled the assembly
  chosen_korean: 회중을 … 모으고
  alternatives_korean:
  - 회중을 모으고
  - 모임을 모으고
  - 공동체를 모으고
  lexicon: HALOT
  rationale: קהל 계열의 반복을 한국어에서 직접 살리되, 명사형 ‘회중’과 동사 ‘모으다’로 자연스럽게 옮겨 원문의 집합·소집 의미를 드러냈습니다.
- source_word: אֶל פְּנֵי הַסָּלַע
  english_pob_choice: before the rock
  chosen_korean: 바위 앞에
  alternatives_korean:
  - 바위 앞에서
  - 그 바위 앞에
  lexicon: HALOT
  rationale: אֶל־פְּנֵי의 위치 관계를 현대 한국어의 ‘앞에’로 간결하게 반영했습니다.
- source_word: הַמֹּרִים
  english_pob_choice: you rebels
  chosen_korean: 반역자들아
  alternatives_korean:
  - 너희 반역자들아
  - 패역한 자들아
  - 너희 패역한 자들아
  lexicon: HALOT
  rationale: מרה의 강한 반항·불복 종결을 살리기 위해 직설적 호칭을 택했습니다. ‘반역자들’은 출애굽기/민수기 맥락의 책망 강도를 보존합니다.
- source_word: נוֹצִיא
  english_pob_choice: shall we bring out
  chosen_korean: 우리가 너희에게 물을 내겠습니까
  alternatives_korean:
  - 우리가 너희에게 물을 끌어내겠습니까
  - 우리가 너희에게 물을 내놓겠습니까
  - 우리가 너희에게 물을 길어내겠습니까
  lexicon: HALOT
  rationale: 히필의 ‘꺼내다/내다’ 의미를 한국어 동사 ‘내다’로 옮기고, 물의 목적어를 자연스럽게 드러냈습니다. 반문형을 유지해 수사적 질문의 긴장을 보존했습니다.
theological_decisions:
- issue: 모세와 아론의 1인칭 복수 주어와 하나님의 행위 사이의 긴장
  chosen_reading: ‘우리가 … 물을 내겠습니까?’로 직역해 주어를 그대로 유지했습니다.
  alternative_readings:
  - ‘주님께서 물을 내시겠습니까?’처럼 신학적으로 완화
  - ‘물이 나오겠습니까?’처럼 주어를 삭제
  rationale: 히브리어는 ברור한 1인칭 복수 נוֹצִיא를 사용하므로, 번역에서 이를 완화하지 않고 그대로 드러내어 본문이 갖는 책임 귀속과 긴장을 보존했습니다.
  doctrine_reference: 본문의 발화 주체와 하나님의 공급 행위를 구분해 지우지 않기
- issue: 직설적 책망 표현의 register
  chosen_reading: ‘이제 들으십시오, 반역자들아.’
  alternative_readings:
  - ‘자, 들어라’
  - ‘들으세요, 반역자들아’
  rationale: 모세의 질책을 현대 한국어에서도 선명하게 전달하기 위해 명령형과 호격을 유지했습니다. 구약 서사 내 직접화법이므로 합쇼체 서술 속에서도 인용문 내부는 강한 책망 어조를 허용했습니다.
  doctrine_reference: 서사 속 직접화법의 수사적 강도 보존
