  rationale: 문장을 나누어 단수 발화 동사에 대응하는 ‘그가’를 유지하면서 한국어의 주어 전환을 자연스럽게 했습니다. 또한 ‘이 바위에서’와 ‘물을 끌어내다’를 사용하여 원문의 출처 표현과 히필 사역 의미를 분명히 했고, 각주는 동사의 어휘적 대안을 제시하도록 바로잡았습니다.
