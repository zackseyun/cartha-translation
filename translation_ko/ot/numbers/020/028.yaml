  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
  footnotes:
  - marker: a
    text: That is, Aaron's official priestly garments were transferred to Eleazar as part of the succession described in the surrounding context.
    reason: cultural_note
  - marker: b
    text: Or 'on the summit of the mountain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 아론의 옷을 벗겨 아론의 아들 엘르아살에게 입혔습니다[a]. 아론은 그곳, 곧 산 꼭대기에서 죽었고[b], 모세와 엘르아살은 산에서 내려왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 아론의 공적인 제사장 옷이었으며, 앞뒤 문맥에서 묘사된 계승의 일부로 엘르아살에게 넘겨졌습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘산 정상에서’.
    reason: lexical_alternative
