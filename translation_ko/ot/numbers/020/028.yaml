    rationale: Eleazar(אֶלְעָזָר)는 한국어 성경에서 통상 ‘엘르아살’로 표기됩니다. 초안의 ‘엘르아르’는 인명 표기로 부정확합니다.
  - severity: low
    issue: ‘그의 아들’의 선행사가 잠재적으로 모호함
    rationale: 원문의 ‘그의 아들’은 아론을 가리킵니다. 한국어에서는 가까운 주어 및 문맥상 혼동 가능성을 줄이기 위해 ‘아론의 아들’로 밝히는 것이 자연스럽습니다.
