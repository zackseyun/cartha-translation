  naturalness: ‘그의 백성에게로 거두어질 것입니다’는 히브리어 죽음 관용구를 보존하면서 표준 한국어에서도 이해 가능합니다. ‘내 명령을 거역하였기 때문입니다’는 현대 격식체에 자연스럽습니다.
  terminology: ‘아론’, ‘이스라엘 자손’, ‘므리바’, ‘명령’은 적절합니다. 기존 각주는 본문 표지와 내용이 서로 맞지 않고, 영어 ‘spoken command’가 남아 있어 수정이 필요합니다.
