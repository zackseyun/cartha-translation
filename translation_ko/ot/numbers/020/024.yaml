revisions:
- from: 아론은 자기 백성에게로 거두어질 것입니다[a]. 그는 내가 이스라엘 자손에게 준 땅에 들어가지 못할 것입니다[b]. 이는 너희가 므리바의 물에서 내 명령에 반역하였기 때문입니다.
  to: 아론은 그의 백성에게로 거두어질 것입니다. 내가 이스라엘 자손에게[a] 준 땅에 그는 들어가지 못할 것입니다. 이는 너희가 므리바의 물에서 내 명령을[b] 거역하였기 때문입니다.
  rationale: 히브리어의 죽음 관용구인 ‘그의 백성에게로 거두어지다’를 유지했습니다. 이 표현을 단순히 ‘죽다’로 풀어 쓰지 않되, 사후 상태에 관한 특정 해석은 덧붙이지 않았습니다. 또한 각주를 실제로 설명하는 어구에 붙이고, 한국어에 남아 있던 영어를 제거했습니다.
