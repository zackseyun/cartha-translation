  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'to the Israelites.' The Hebrew reads 'to the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'against my mouth,' that is, against my spoken command.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 그의 백성에게로 거두어질 것입니다. 내가 이스라엘 자손에게[a] 준 땅에 그는 들어가지 못할 것입니다. 이는 너희가 므리바의 물에서 내 명령을[b] 거역하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘이스라엘 백성에게’ 또는 ‘이스라엘 사람들에게’라고 옮길 수 있습니다. 히브리어는 직역하면 ‘이스라엘 자손에게’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 입에 맞서’입니다. 곧 내가 말한 명령을 거역하였다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  english_pob_choice: will be gathered
  chosen_korean: 거두어질 것입니다
  alternatives_korean:
  - 모여들 것입니다
  - 데려가질 것입니다
  - 죽을 것입니다
  lexicon: HALOT
  rationale: 죽음을 직접 말하기보다, 히브리어의 관용구가 가진 장중한 완곡성을 살려 ‘거두어지다’로 옮겼습니다.
- source_word: אֶל עַמָּיו
  english_pob_choice: to his people
  chosen_korean: 자기 백성에게로
  alternatives_korean:
  - 자기 ხალხ에게로
  - 자기 친족에게로
  - 이스라엘 백성에게로
  lexicon: HALOT
  rationale: 직역의 구조를 유지하되 한국어로는 ‘에게로’가 이동의 방향과 귀속감을 함께 드러내어 자연스럽습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 백성에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 원문의 남성 복수 표현을 살리면서도, 한국어 성경 문맥에서 자연스럽게 읽히는 관용적 표현을 택했습니다.
- source_word: אֶת פִּי
  english_pob_choice: against my command
  chosen_korean: 내 명령에
  alternatives_korean:
  - 내 입에
  - 내 말에
  - 내 명령을
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 입’이지만, 여기서는 하나님의 발화된 명령을 가리키므로 한국어로는 그 뜻을 드러내어 옮겼습니다.
theological_decisions:
- issue: 죽음의 관용구를 어떻게 살릴 것인가
  chosen_reading: ‘거두어질 것입니다’로 옮겨, 단순한 죽음 통보로 축소하지 않았습니다.
  alternative_readings:
  - ‘죽을 것입니다’
  - ‘데려가질 것입니다’
  rationale: 본문은 단순 사실 보고보다 언약적·조상적 귀속을 암시하는 표현을 사용하므로, 그 신학적 결을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
