translation:
  language: ko
  text: '야훼[a]께서 에돔 땅 경계에 있는 호르 산에서 모세와 아론에게 이렇게 말씀하셨습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: יהוה(YHWH). ‘여호와’로도 음역합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה
  english_pob_choice: And Yahweh spoke
  chosen_korean: 야훼께서 … 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 … 말씀하셨다
  - 야훼께서 … 이르셨습니다
  lexicon: HALOT
  rationale: 서술문에서 신적 발화의 도입은 한국어로 ‘말씀하시다’가 가장 자연스럽고, ‘이르시다’보다 직관적으로 원문의 발화 기능을 드러냅니다.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  english_pob_choice: to Moses and to Aaron
  chosen_korean: 모세와 아론에게
  alternatives_korean:
  - 모세와 아론에게로
  - 모세에게와 아론에게
  lexicon: HALOT
  rationale: 반복된 전치사 אל의 수신자 표지를 한국어에서는 자연스럽게 여격 ‘-에게’로 옮기되, 두 인물을 병렬로 명확히 드러냈습니다.
- source_word: בְּהֹר הָהָר
  english_pob_choice: at Mount Hor
  chosen_korean: 호르 산, 곧 에돔 땅의 경계에 있는 호르 산에서
  alternatives_korean:
  - 호르 산에서
  - 호르 산, 곧 호르 산에서
  lexicon: HALOT
  rationale: 지명 ‘Mount Hor’는 관용적으로 ‘호르 산’으로 옮기고, 이어지는 ‘에돔 땅의 경계’ 구문이 같은 절 안에서 장소를 한정하므로 이를 함께 반영해 중의성을 줄였습니다.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  english_pob_choice: on the border of the land of Edom
  chosen_korean: 에돔 땅의 경계에 있는
  alternatives_korean:
  - 에돔 땅의 경계 위에 있는
  - 에돔 땅의 변두리에 있는
  lexicon: HALOT
  rationale: עַל + גְּבוּל은 경계선 위라는 뜻으로 자연스럽게 ‘경계에 있는’으로 풀어 한국어의 공간 관계를 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: יַהְוֶה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문은 하나님의 개인 이름을 직접 사용하므로, 관례적 대치어 ‘주’보다 이름 자체를 드러내는 ‘야훼’를 유지해 본문의 언약적 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
