  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: ko
  text: 모세는 손을 들어 그의 지팡이로 바위를 두 번 쳤습니다. 그러자 많은 물이 나와서 회중과 그들의 가축이 마셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם / raised
  english_pob_choice: raised
  chosen_korean: 손을 들어
  alternatives_korean:
  - 들어 올렸습니다
  - 손을 높이 들었습니다
  lexicon: HALOT
  rationale: 히브리어 히필형 רוּם은 물리적으로 ‘들다/올리다’의 뜻이므로, 한국어에서는 자연스럽고 장면이 보이는 표현인 ‘손을 들어’로 옮겼습니다.
- source_word: וַיַּךְ / struck
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 내리쳤습니다
  - 때렸습니다
  - 치셨습니다
  lexicon: HALOT
  rationale: נכה는 ‘치다/때리다/치다’의 폭이 있으나, 여기서는 도구로 바위를 두 번 내리친 행위를 담담하게 서술하는 ‘쳤습니다’가 가장 자연스럽습니다.
- source_word: הַסֶּלַע / the rock
  english_pob_choice: the rock
  chosen_korean: 바위
  alternatives_korean:
  - 그 바위
  - 반석
  lexicon: HALOT
  rationale: סֶלַע는 일반적으로 큰 바위나 바위 덩어리를 가리키므로, 전통적 교회 용어인 ‘반석’보다 직접적인 ‘바위’가 원문의 대상물을 더 투명하게 드러냅니다.
- source_word: בְּמַטֵּהוּ / with his staff
  english_pob_choice: with his staff
  chosen_korean: 그의 지팡이로
  alternatives_korean:
  - 그의 막대로
  - 그의 지팡이를 가지고
  lexicon: HALOT
  rationale: מַטֶּה는 ‘지팡이/막대’의 뜻이 있으므로, 모세의 도구를 현대 한국어에서 자연스럽게 드러내는 ‘그의 지팡이로’를 선택했습니다.
- source_word: פַּעֲמָיִם / twice
  english_pob_choice: twice
  chosen_korean: 두 번
  alternatives_korean:
  - 두 차례
  - 한 번 더
  lexicon: HALOT
  rationale: 부사적 이중형은 한국어에서 가장 직역에 가깝고 자연스러운 ‘두 번’이 적절합니다.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים / abundant water came out
  english_pob_choice: abundant water came out
  chosen_korean: 많은 물이 나와서
  alternatives_korean:
  - 풍성한 물이 나와서
  - 물이 넘치도록 나와서
  - 많은 물이 흘러나와
  lexicon: HALOT
  rationale: מַיִם רַבִּים은 물의 양이 많음을 뜻하므로, ‘많은 물이 나와서’가 의미를 과장하지 않으면서도 충분한 공급을 드러냅니다.
- source_word: הָעֵדָה / the congregation
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 회중 전체
  - 공동체
  - 백성
  lexicon: HALOT
  rationale: עֵדָה는 출애굽기·민수기의 집합체를 가리키는 표준적 용례이므로, 프로젝트 용례에 맞춰 ‘회중’을 사용했습니다.
theological_decisions:
- issue: 모세의 행위 묘사를 해석적 판단과 분리할지 여부
  chosen_reading: 본문의 사건 진술을 그대로 살려, 행위와 결과를 서술적으로 제시했습니다.
  alternative_readings:
  - 번역문 안에 불순종이나 책망의 뉘앙스를 덧붙이는 해석적 확장
  rationale: 이 절 자체는 모세가 바위를 치고 물이 나온 사건을 기록할 뿐이므로, 본문 밖의 평가를 번역문에 삽입하지 않는 것이 원문의 서술 의도를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
