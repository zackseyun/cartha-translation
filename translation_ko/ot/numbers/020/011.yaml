  source_fidelity: 히브리어의 순서를 충실히 반영합니다. 모세가 손을 들고 자신의 지팡이로 바위를 두 번 친 행위, 많은 물이 나온 결과, 회중과 그들의 가축이 마신 사실이 모두 보존되어 있습니다. ‘많은 물’은 מַיִם רַבִּים의 풍부한 양을 충분히 나타내며, 본문에 없는 모세의 불순종에 관한 평가도 덧붙이지 않았습니다.
  naturalness: ‘모세는 손을 들어 그의 지팡이로 바위를 두 번 쳤습니다. 그러자 많은 물이 나와서 회중과 그들의 가축이 마셨습니다.’는 표준어 현대 합쇼체로 자연스럽고 명료합니다. ‘그의/그들의’는 다소 명시적인 표현이지만 지시 대상이 분명하며 서사체에서 허용됩니다.
