base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
  footnotes:
  - marker: a
    text: Or 'the rod.'
    reason: lexical_alternative
  - marker: b
    text: Or 'assembly' for 'congregation.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'before their eyes.'
    reason: lexical_alternative
  - marker: d
    text: Or 'their cattle' or 'their beasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 지팡이[a]를 가져가십시오. 너와 네 형 아론은 회중[b]을 모으고, 그들이 보는 앞에서[c] 바위에게 말하십시오. 그러면 바위가 물을 낼 것입니다. 그 뒤에 너는 그들을 위하여 바위에서 물을 끌어내고, 회중과 그들의 가축[d]에게 마시게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지팡이’는 히브리어 מַטֶּה의 문맥상 자연스러운 번역입니다. ‘막대기’ 또는 ‘막대’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회중’은 히브리어 עֵדָה의 번역으로, ‘공동체’ 또는 ‘모임’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 눈앞에서’입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘가축’은 히브리어 בְּעִירָם의 넓은 뜻을 반영합니다. ‘짐승’ 또는 ‘집짐승’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  english_pob_choice: the staff
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 막대
  - 지휘봉
  lexicon: HALOT
  rationale: מַטֶּה는 문맥에 따라 지팡이/막대/막대기 등으로 옮길 수 있는데, 여기서는 모세가 들고 갈 물건을 가리키므로 자연스러운 현대어인 ‘막대기’가 가장 무난합니다.
- source_word: הָעֵדָה
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 공동체
  - 모임
  - 총회
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합체를 가리키므로, 제도적 뉘앙스를 유지하면서도 현대 한국어에서 읽히는 ‘회중’으로 옮겼습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들 앞에서
  - 그들이 보는 앞에서
  - 그들의 눈앞에
  lexicon: HALOT
  rationale: 직역의 ‘눈앞에서’를 살려, 명령이 공개적으로 수행되어야 함을 드러냈습니다.
- source_word: בְּעִירָם
  english_pob_choice: their livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 소떼
  - 집짐승
  lexicon: HALOT
  rationale: בְּעִיר은 가축류를 폭넓게 가리키므로, 현대 독자에게 분명한 ‘가축’이 적절합니다.
theological_decisions:
- issue: 모세와 아론에게 주어진 공개적 명령의 강조
  chosen_reading: ‘그들의 눈앞에서’와 ‘회중을 모으고’로 공개성의 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘그들 앞에서’처럼 더 약하게 옮길 수 있음
  rationale: 본문의 לְעֵינֵיהֶם은 단순한 동반이 아니라, 공동체가 보는 앞에서 이루어지는 행위를 강조하므로 서술의 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 민수기 20장 서술 문맥
