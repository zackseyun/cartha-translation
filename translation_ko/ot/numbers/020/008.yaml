  source_fidelity: 히브리어의 명령 순서와 화자 대상은 대체로 반영되었으나, 초안의 ‘너와 네 형 아론은 … 말하십시오’는 복수 대상 명령과 단수 대상 명령의 구조를 충분히 분명히 하지 못합니다. 또한 마지막 ‘해야 합니다’는 명령을 일반적 의무 진술로 약화합니다. 수정문은 막대기를 가져가는 일과 물을 내어 마시게 하는 일을 모세에게, 회중을 모으고 바위에게 말하는 일을 모세와 아론에게 지시하는 구조를 보존합니다.
