revisions:
- from: 막대기를 가지고, 너와 네 형 아론은 회중을 모으고, 그들의 눈앞에서 바위에게 말하십시오. 그러면 바위가 자기 물을 내놓을 것입니다. 그다음 너는 그들에게 바위에서 물을 끌어내어 회중과 그들의 가축에게 마시게 해야 합니다.[a][b][c][d]
  to: 그 지팡이[a]를 가져가십시오. 너와 네 형 아론은 회중[b]을 모으고, 그들이 보는 앞에서[c] 바위에게 말하십시오. 그러면 바위가 물을 낼 것입니다. 그 뒤에 너는 그들을 위하여 바위에서 물을 끌어내고, 회중과 그들의 가축[d]에게 마시게 하십시오.
  rationale: 명령의 단수·복수 대상과 명령성을 분명히 하고, 현대 표준 한국어 합쇼체에 맞게 문장을 다듬었습니다. 바위가 물을 낸다는 표현은 히브리어의 ‘그 물’을 한국어에서 자연스럽게 표현한 것이며, 뒤의 ‘바위에서 물을 끌어내고’가 물의 출처를 명확히 유지합니다.
