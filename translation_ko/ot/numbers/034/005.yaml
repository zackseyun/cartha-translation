source:
  edition: WLC
  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
  footnotes:
  - marker: a
    text: Or 'to the Wadi of Egypt.' The Hebrew נחל often refers to a seasonal watercourse or wadi; 'Brook of Egypt' is retained in the main text for readability and continuity.
    reason: lexical_alternative
  - marker: b
    text: Or 'its extremities shall be at the sea.' The Hebrew uses a plural form ('its goings out/endings') for the border's terminal point.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 경계는 아스몬에서 나일 강의 시내까지 돌아가고, 그 끝은 바다에 이를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이집트의 와디'입니다. 히브리어 נחל은 흔히 계절성 물길이나 와디를 가리키므로, 본문에서는 읽기와 전승의 연속성을 위해 '나일 강의 시내'를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 끝지점들은 바다에 있을 것입니다.' 히브리어는 경계의 종착점을 나타내는 복수형('그 나감/끝들')을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  english_pob_choice: Then ... shall turn
  chosen_korean: 그러면 ... 돌아가고
  alternatives_korean:
  - 그리고 ... 돌고
  - 그리하여 ... 향하고
  lexicon: HALOT
  rationale: 경계선이 방향을 바꾸는 뜻을 살려 현대 한국어로는 '돌아가다'가 가장 자연스럽습니다. 문맥상 순서를 잇는 연결은 '그러면'으로 옮겼습니다.
- source_word: הַגְּבוּל
  english_pob_choice: the border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 변경
  lexicon: HALOT
  rationale: 토지 분계 문맥이므로 '경계'가 가장 직관적이며, 문장 전체의 지리적 설명과도 잘 맞습니다.
- source_word: נַחְלָה מִצְרָיִם
  english_pob_choice: the Brook of Egypt
  chosen_korean: 나일 강의 시내
  alternatives_korean:
  - 이집트의 와디
  - 애굽 시내
  lexicon: HALOT
  rationale: נחל은 큰 강보다 계절성 물줄기/시내의 성격이 강하므로 '시내'를 살렸습니다. 다만 한국어 독자가 지리 표지를 바로 알아보도록 고유 전승 표현도 고려해 '나일 강의 시내'로 옮겼습니다.
- source_word: תּוֹצְאֹתָיו
  english_pob_choice: its end
  chosen_korean: 그 끝
  alternatives_korean:
  - 그 경계 끝
  - 그 끝지점
  lexicon: HALOT
  rationale: 경계의 종착점을 가리키므로 간결하게 '그 끝'으로 옮기되, 복수형 어감은 한국어에서 자연스럽게 과도하게 드러내지 않았습니다.
theological_decisions:
- issue: 지명 בראָ운(브rook of Egypt) 전승과 מקור(원어)의 지형적 의미 사이의 긴장
  chosen_reading: 전승 친화적이지만 지형 의미를 살린 '나일 강의 시내'를 본문에 두었습니다.
  alternative_readings:
  - 애굽의 시내
  - 애굽의 와디
  - 이집트 강
  rationale: 본문의 נחל은 '강'보다 시내/와디를 뜻하는 경우가 많아, 전승 표현을 유지하더라도 지형적 오해를 줄이는 방향이 필요합니다.
  doctrine_reference: 지리-역사 본문 번역 원칙
