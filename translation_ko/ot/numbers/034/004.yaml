id: NUM.34.4
reference: Numbers 34:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
  footnotes:
  - marker: a
    text: Akrabbim likely means 'scorpions'; the place-name could be rendered 'the ascent of Scorpions' or 'Scorpion Pass.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 경계선은 남쪽에서 악랍빔의 오름을 지나 신으로 돌아가고, 그 끝은 가데스바네아 남쪽에 있으며, 이어 하살아달로 나아가서 아스몬을 지나야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악랍빔’은 ‘전갈들’을 뜻할 가능성이 있는 지명입니다. 따라서 ‘전갈고개’처럼 뜻을 살린 번역도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב / הַגְּבוּל
  english_pob_choice: shall turn / the border
  chosen_korean: 경계선은 … 돌아가고
  alternatives_korean:
  - 경계는 … 돌고
  - 국경은 … 돌아가고
  lexicon: HALOT
  rationale: 경계 묘사에서 נָסַב은 선이 방향을 바꾸는 뜻이므로, 현대 한국어에서는 ‘돌아가다’로 자연스럽게 살렸습니다. ‘경계선’은 지리적 선을 분명히 드러냅니다.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  english_pob_choice: from the south of the Ascent of Akrabbim
  chosen_korean: 남쪽에서 악랍빔의 오름을
  alternatives_korean:
  - 악랍빔의 오름 남쪽에서
  - 전갈고개 남쪽에서
  lexicon: HALOT
  rationale: מִנֶּגֶב은 지명에 대한 남쪽 위치를 나타내므로 ‘남쪽에서’로 옮겼습니다. עַקְרַבִּים은 고유 지명으로 음역을 유지하되, מַעֲלֵה는 지형을 살려 ‘오름’으로 번역했습니다.
- source_word: וְעָבַר צִנָה
  english_pob_choice: and cross to Zin
  chosen_korean: 신으로 돌아가고
  alternatives_korean:
  - 신으로 지나가고
  - 신을 가로질러
  lexicon: HALOT
  rationale: 경계선의 진행을 나타내는 עָבַר은 단순 이동보다 선이 지나감을 뜻하므로 ‘돌아가고’로 자연스럽게 표현했습니다. צִנָה는 지명으로 ‘신’ 음역을 따랐습니다.
- source_word: חֲצַר אַדָּר / עַצְמֹנָה
  english_pob_choice: Hazar-addar / Azmon
  chosen_korean: 하살아달 / 아스몬
  alternatives_korean:
  - 하살아다르 / 아즈몬
  - 하자르아달 / 아스몬
  lexicon: HALOT
  rationale: 둘 다 고유 지명이라 현대 외래어 표기 원칙에 따라 음역했습니다. 하이픈은 한국어에서 보통 생략하되, 복합 지명임은 유지했습니다.
theological_decisions:
- issue: 경계 문장의 반복적 진행 표현
  chosen_reading: ‘돌아가고 … 지나고 … 있으며 … 나아가서 … 지나야 합니다’로 경계의 연속적 전개를 살렸습니다.
  alternative_readings:
  - 단순히 ‘~로 간다’로 평준화하는 번역
  - 한 문장 안에서 모두 ‘~에 이르다’로 통일하는 번역
  rationale: 본절은 땅의 경계가 여러 지점을 따라 연속적으로 전개되는 행정적·서사적 문장입니다. 동작의 방향성과 진행성을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 민수기 34장의 기업 경계 규정
