  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: ko
  text: 그리고 아셀 자손의 지파를 위해서는, 지도자 아히훗, 셀로미의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: 그리고 … 지파를 위해서는
  alternatives_korean:
  - 그리고 … 지파에
  - 그리고 … 지파에게
  lexicon: HALOT
  rationale: 문맥상 מַטֶּה는 ‘막대기/지팡이’가 아니라 지파를 뜻하므로 ‘지파’로 옮기고, 전치사 조합은 분배·배정 문맥에 맞게 ‘-을 위해서는’으로 자연스럽게 처리했습니다.
- source_word: בְנֵי אָשֵׁר
  english_pob_choice: the sons of Asher
  chosen_korean: 아셀 자손
  alternatives_korean:
  - 아셀의 아들들
  - 아셀의 후손
  lexicon: HALOT
  rationale: 히브리어의 직역형인 ‘아셀 자손’을 유지해 부족 명칭의 형식을 살렸고, 한국어 성경 전통에서도 널리 통용되는 표현입니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 지도자
  alternatives_korean:
  - 대표
  - 족장
  - 관리
  lexicon: HALOT
  rationale: 민수기 34장의 문맥에서는 지파를 대표해 땅 분배에 참여하는 공적 인물을 가리키므로, 왕족적 뉘앙스가 있는 ‘왕자’보다 기능을 드러내는 ‘지도자’가 적절합니다.
- source_word: בֶּן שְׁלֹמִי
  english_pob_choice: son of Shelomi
  chosen_korean: 셀로미의 아들
  alternatives_korean:
  - 셀로미의 아들입니다
  - 셀로미의 아들
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 한국어 소유격으로 옮겨 계보 관계를 분명히 했고, 인명은 음역하여 보존했습니다.
