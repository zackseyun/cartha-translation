  source_fidelity: 'The draft preserves the principal referents but mistranslates the land-allotment clause: ''기업을 떨어지는 땅'' is ungrammatical and does not convey that the land will be allotted to Israel as an inheritance. The revision renders the Hebrew land-allotment idiom naturally while retaining its literal sense in a note. It also preserves the final delimiting phrase concerning Canaan''s borders.'
