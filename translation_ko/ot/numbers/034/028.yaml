  source_fidelity: 초안은 지파와 지도자라는 핵심 의미를 대체로 옮겼습니다. 그러나 히브리어의 명단식 구문은 ‘납달리 자손 지파의 지도자’가 페다헬이라는 뜻인데, ‘지파에는 한 지도자 ... 있었습니다’는 단순히 그 지파 안에 지도자가 있었다는 서술처럼 들릴 수 있습니다. 또한 פְּדַהְאֵל의 통용 한국어 음역은 ‘브다헬’이 적절합니다.
