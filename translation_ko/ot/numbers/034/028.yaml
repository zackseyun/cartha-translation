base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Naphtali,' a standard tribal designation meaning the descendants of Naphtali.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 납달리 지파에는 한 지도자, 곧 암미훗의 아들 페다헬이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘납달리의 아들들’은 납달리의 자손들을 뜻하는 지파 명칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: 그리고 ... 지파에는
  alternatives_korean:
  - 그리고 ... 지파에
  - 그리고 ... 지파를 위하여
  lexicon: HALOT
  rationale: 문맥상 מַטֶּה는 문자적 ‘막대기’가 아니라 지파 단위를 뜻하므로 ‘지파’로 옮기고, וּ/לְ를 자연스럽게 연결하여 한국어 문장 흐름을 살렸습니다.
- source_word: בְנֵי נַפְתָּלִי
  english_pob_choice: the sons of Naphtali
  chosen_korean: 납달리 지파
  alternatives_korean:
  - 납달리의 아들들
  - 납달리의 자손들
  lexicon: HALOT
  rationale: 직역 가능한 ‘아들들’보다, 여기서는 혈통 집단을 가리키는 관용적 부족 명칭이므로 독자가 곧바로 이해할 수 있게 ‘지파’로 풀어 썼습니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 한 지도자
  alternatives_korean:
  - 한 수장
  - 한 족장
  - 한 지도자 한 사람
  lexicon: HALOT
  rationale: 행정적 명단에서 נָשִׂיא는 지파의 대표/수장을 뜻하므로, 한국어에서 과도한 왕족 뉘앙스가 없는 ‘지도자’가 적절합니다.
- source_word: פְּדַהְאֵל בֶּן עַמִּיהוּד
  english_pob_choice: Pedahel son of Ammihud
  chosen_korean: 암미훗의 아들 페다헬
  alternatives_korean:
  - 페다헬, 암미훗의 아들
  - 페다헬, 곧 암미훗의 아들
  lexicon: HALOT
  rationale: 히브리어의 표준 부계 공식은 한국어에서도 자연스럽게 ‘A의 아들 B’로 옮기는 것이 가장 직접적입니다.
