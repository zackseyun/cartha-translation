  naturalness: '''그때''는 이 경계 기술의 연결사로는 불필요하게 시간성을 강하게 하며, ''경계선은 … 있을 것이고''는 문장 구조가 어색합니다. ''경계는 … 있는 립라로 내려갈 것입니다'' 및 ''… 기슭에 닿을 것입니다''로 다듬으면 현대 표준어 합쇼체의 행정·지리 서술에 맞습니다.'
  terminology: 스밤, 립라, 아인은 음역으로 유지합니다. יָם כִּנֶּרֶת는 원문 및 영어 POB의 지명 보존 원칙에 따라 '긴네렛 바다'로 옮깁니다. '갈릴리 호수'는 같은 수역의 후대 통용명일 수 있으나 본문 지명을 대체하지 않습니다.
  issues:
