revisions:
- from: 그때 경계선은 스밤에서 립라로 내려가며, 아인의 동쪽에 있을 것이고, 경계선은 내려가서 갈릴리 호수의 동쪽 어깨에 이를 것입니다.
  to: 경계는 스밤에서 아인의 동쪽에 있는 립라로 내려갈 것입니다.[a] 그 경계는 내려가 긴네렛 바다의 동쪽 기슭에 닿을 것입니다.[b]
  rationale: 원문의 두 차례의 '경계가 내려간다'는 진행 묘사와 미래형 경계 규정의 문체를 유지했습니다. 립라와 긴네렛 바다를 원문 지명에 맞게 음역하고, 위치 관계와 지형어는 현대 한국어에서 명료하게 다듬었습니다. 각주는 위치구의 문자적 형태와 כֶּתֶף의 직역을 보존합니다.
