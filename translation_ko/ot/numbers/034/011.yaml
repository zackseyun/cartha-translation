id: NUM.34.11
reference: Numbers 34:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
  footnotes:
  - marker: a
    text: Or 'east of Ain.' The Hebrew phrase can be rendered more literally as a location eastward of Ain.
    reason: lexical_alternative
  - marker: b
    text: Literally 'strike/touch the shoulder of the Sea of Kinnereth'; 'shoulder' here refers to the side or slope of the terrain by the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 경계선은 스밤에서 립라로 내려가며, 아인의 동쪽에 있을 것이고, 경계선은 내려가서 갈릴리 호수의 동쪽 어깨에 이를 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַד הַגְּבֻל
  english_pob_choice: shall go down / the border
  chosen_korean: 경계선은 … 내려가며
  alternatives_korean:
  - 경계는 … 내려가며
  - 경계선이 … 내려갈 것입니다
  lexicon: HALOT
  rationale: ירד의 하강·진행 이미지를 살리면서, 경계 설명 문맥에 자연스러운 ‘경계선’으로 옮겼습니다.
- source_word: מִשְּׁפָם הָרִבְלָה
  english_pob_choice: from Shepham to Riblah
  chosen_korean: 스밤에서 립라로
  alternatives_korean:
  - 세밤에서 립라로
  - 스파암에서 립라로
  lexicon: 고유명사 음역
  rationale: 지명은 현대 한국어 외래어 표기 취지에 따라 음역했고, 방향 관계를 그대로 살려 ‘에서 …로’로 옮겼습니다.
- source_word: מִקֶּדֶם לָעָיִן
  english_pob_choice: east of Ain / on the east side of Ain
  chosen_korean: 아인의 동쪽에 있을 것이고
  alternatives_korean:
  - 아인의 동쪽에
  - 아인의 동쪽 편에 있을 것이고
  lexicon: HALOT
  rationale: מקדם의 위치 관계를 직역하되, 한국어에서는 ‘동쪽에’가 가장 자연스럽게 지리 관계를 드러냅니다.
- source_word: עַל כֶּתֶף יָם כִּנֶּרֶת
  english_pob_choice: the slope/shoulder of the Sea of Kinnereth
  chosen_korean: 갈릴리 호수의 동쪽 어깨에
  alternatives_korean:
  - 긴네렛 바다의 동쪽 어깨에
  - 갈릴리 호수의 동쪽 비탈에
  lexicon: HALOT
  rationale: כֶּתֶף의 지형적 의미를 ‘어깨’로 살려 경계가 지형의 옆면을 ‘닿는다/이른다’는 그림을 보존했습니다. 한국어 독자의 이해를 위해 통용명 ‘갈릴리 호수’를 병기 수준으로 반영했습니다.
- source_word: קֵדְמָה
  english_pob_choice: on the east / eastward
  chosen_korean: 동쪽에
  alternatives_korean:
  - 동쪽으로
  - 동편으로
  lexicon: HALOT
  rationale: 마지막 방향 부사는 앞 절과 중복되지 않도록 자연스러운 한국어로 정리하되, 동쪽 지시를 유지했습니다.
theological_decisions:
- issue: 경계 규정 문장의 법적·지리적 성격 유지
  chosen_reading: 예언적 해석을 덧붙이지 않고, 경계의 진행과 종결을 나타내는 지리·법률 문장으로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 덧붙이는 해석
  - 구약 서술체의 현대적 재구성
  rationale: 본문은 이스라엘 땅의 경계 설명이므로, 원문의 행정·지리적 기능을 보존하는 것이 최우선입니다.
  doctrine_reference: 민수기 34장의 기업 경계 설정 문맥
- issue: 지명 표기의 가독성
  chosen_reading: Kinnereth를 한국 독자에게 널리 알려진 지명으로 직조하지 않고, 본문에서는 의미상 대응 가능한 ‘갈릴리 호수’를 사용했습니다.
  alternative_readings:
  - 긴네렛 바다
  - 갈릴리 바다
  rationale: 히브리어 지명 자체를 그대로 두면 현대 한국어 독자에게 지리적 위치가 즉시 전달되지 않으므로, 본문 가독성을 우선하면서도 원지명의 지리적 실체를 보존했습니다.
  doctrine_reference: 성경 지명 번역의 전달성 원칙
