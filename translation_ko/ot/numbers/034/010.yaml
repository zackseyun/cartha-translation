base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
  footnotes:
  - marker: a
    text: Or 'draw/outline for yourselves the eastern boundary.' The Hebrew verb here is unusual and in this context refers to marking or tracing a border line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 스스로를 위해 동쪽 경계를 Hazar-enan에서 Shepham까지 표시해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로를 위해 경계를 그어/윤곽을 잡아.’ 여기서 히브리어 동사는 이 문맥에서 경계선을 표시하거나 따라 그리는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  english_pob_choice: you shall mark out
  chosen_korean: 표시해야 합니다
  alternatives_korean:
  - 그어야 합니다
  - 표시해 두어야 합니다
  - 윤곽을 그어야 합니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 경계선을 ‘그리다/표시하다’는 뜻으로 쓰이므로, 한국어로는 법적·지리적 문맥에 자연스러운 ‘표시하다’가 적합합니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 스스로를 위해
  alternatives_korean:
  - 너희를 위해
  - 너희 자신을 위해
  lexicon: HALOT
  rationale: 이스라엘이 자기 몫의 경계를 정하는 뉘앙스를 살리기 위해 목적어를 단순한 ‘너희를 위해’보다 반사적 표현으로 옮겼습니다.
- source_word: לִגְבוּל קֵדְמָה
  english_pob_choice: the eastern border
  chosen_korean: 동쪽 경계
  alternatives_korean:
  - 동쪽의 경계
  - 동편 경계
  - 동쪽 경계선
  lexicon: HALOT
  rationale: 지리적 경계 설정 맥락에서 ‘경계’가 가장 직접적이며, ‘동쪽’은 방향성을 명확히 드러냅니다.
- source_word: מֵחֲצַר עֵינָן ... שְׁפָמָה
  english_pob_choice: from Hazar-enan to Shepham
  chosen_korean: Hazar-enan에서 Shepham까지
  alternatives_korean:
  - 하살에난에서 셰밤까지
  - 하자르에난에서 셰팜까지
  lexicon: 고유명사 표기
  rationale: 본문의 두 지명은 경계선의 시작점과 끝점을 표시하는 것이므로, 의미를 보존하기 위해 음역하여 남겼습니다.
theological_decisions:
- issue: 경계 설정 명령의 문체
  chosen_reading: 명령형의 법률·행정적 어조를 유지하되, 한국어에서는 ‘~해야 합니다’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 직설명령형으로 ‘표시하십시오’
  - 예언체처럼 ‘표시하라’
  rationale: 민수기의 경계 규정은 행정적 지시이므로 현대 한국어 합쇼체에서 가장 읽기 자연스러운 형식을 택했습니다.
  doctrine_reference: 민수기 34장 경계 규정
