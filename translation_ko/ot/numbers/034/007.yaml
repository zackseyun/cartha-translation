id: NUM.34.7
reference: Numbers 34:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
  footnotes:
  - marker: a
    text: Or possibly, 'you shall draw the boundary to Mount Hor.' The verb can denote tracing or marking out a border line in this geographic context.
    reason: lexical_alternative
  - marker: b
    text: '''The Great Sea'' refers to the Mediterranean Sea.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이것이 여러분의 북쪽 경계가 될 것입니다. 큰 바다[b]에서 호르 산까지 여러분의 경계선을 그어 정해야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호르 산까지 경계선을 표시해야 합니다’로 옮길 수 있습니다. 이 동사는 이러한 지리적 문맥에서 경계선을 따라 그어 정하거나 표시하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 바다’는 지중해를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבוּל צָפוֹן
  english_pob_choice: your northern border
  chosen_korean: 여러분의 북쪽 경계
  alternatives_korean:
  - 여러분의 북쪽 국경
  - 여러분의 북방 경계
  lexicon: HALOT
  rationale: 경계선 지정 문맥이므로 ‘경계’가 가장 자연스럽고, צָפוֹן은 형용사적으로 ‘북쪽’으로 옮겨 합쇼체 문장 흐름을 살렸습니다.
- source_word: מִן הַיָּם הַגָּדֹל
  english_pob_choice: from the Great Sea
  chosen_korean: 큰 바다에서부터
  alternatives_korean:
  - 대해에서부터
  - 지중해에서부터
  lexicon: HALOT
  rationale: 본문의 지리적 명칭을 ‘큰 바다’로 소스에 가깝게 유지했습니다. 영어 POB의 각주 취지를 반영해 본문에서는 현대 지명 대신 원문 표현을 살렸습니다.
- source_word: תְּתָאוּ
  english_pob_choice: you shall mark out for yourselves
  chosen_korean: 여러분은 스스로 … 경계를 표시해야 합니다
  alternatives_korean:
  - 여러분은 … 경계를 그어야 합니다
  - 여러분은 … 경계를 정해야 합니다
  - 여러분은 … 경계를 측량해야 합니다
  lexicon: HALOT
  rationale: 이 동사는 경계선을 ‘표시하다/그어 정하다’의 의미가 강하므로, 단순한 ‘정하다’보다 시각적·절차적 뉘앙스를 살린 ‘경계를 표시하다’를 택했습니다.
- source_word: הֹר הָהָר
  english_pob_choice: Mount Hor
  chosen_korean: 호르 산
  alternatives_korean:
  - 호르 산맥
  - 호르
  lexicon: HALOT
  rationale: 고유 지명은 현대 한국어 관용에 따라 음역하고, 앞의 ‘산’으로 지리적 성격을 분명히 했습니다.
theological_decisions:
- issue: 지리 경계 명령의 명령형/예언형 뉘앙스
  chosen_reading: ‘해야 합니다’로 번역해 법적 규정의 규범성을 드러냈습니다.
  alternative_readings:
  - ‘할 것입니다’
  - ‘하여야 합니다’
  rationale: 문맥이 서술보다 법규적 지시이므로, 미래형보다 규범적 의무를 분명히 하는 표현을 택했습니다.
  doctrine_reference: 토라의 경계 규정은 공동체 질서에 대한 실제적 지시로 읽는 것이 자연스럽습니다.
