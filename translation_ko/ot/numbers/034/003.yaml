  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
  footnotes:
  - marker: a
    text: Or 'from the edge/extremity of the Salt Sea.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'the Dead Sea'; Hebrew 'the Salt Sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽 변은 신 광야에서 에돔 곁까지가 되며, 남쪽 경계는 소금 바다의 끝에서 동쪽으로가 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소금 바다’는 히브리어 지명의 직역입니다. 전통적으로는 ‘사해’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곁’은 히브리어 관용구 עַל יְדֵי의 지리적 뉘앙스를 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  english_pob_choice: Your southern side
  chosen_korean: 남쪽 변
  alternatives_korean:
  - 남쪽 면
  - 남쪽 가장자리
  - 남쪽 쪽
  lexicon: HALOT
  rationale: 경계 설명에서 פֵּאָה는 기하학적 ‘모서리’보다 영토의 ‘변/가장자리’에 가깝기 때문에, 간결하고 지리적 맥락에 맞는 ‘변’으로 옮겼습니다.
- source_word: מִמִּדְבַּר צִן
  english_pob_choice: from the wilderness of Zin
  chosen_korean: 신 광야에서
  alternatives_korean:
  - 신의 광야에서
  - 시ן 광야에서
  lexicon: HALOT
  rationale: מִדְבָּר는 지리 표지로서 ‘광야’가 자연스럽고, 고유명 צִן은 음역보다 익숙한 성경 지명 ‘신’으로 옮겼습니다.
- source_word: עַל יְדֵי אֱדוֹם
  english_pob_choice: along the side of Edom
  chosen_korean: 에돔 곁까지
  alternatives_korean:
  - 에돔 옆으로
  - 에돔을 따라
  - 에돔 변을 따라
  lexicon: HALOT
  rationale: 직역하면 ‘에돔의 옆/손곁’이라는 지리 관용구이므로, 경계선의 진행 방향을 드러내는 ‘곁까지’로 자연스럽게 풀었습니다.
- source_word: יָם הַמֶּלַח
  english_pob_choice: the Salt Sea
  chosen_korean: 소금 바다
  alternatives_korean:
  - 사해
  - 염해
  lexicon: HALOT
  rationale: POB의 원문 우선 원칙에 따라 전통적 해석명 ‘사해’보다 히브리어 직역인 ‘소금 바다’를 유지했습니다.
- source_word: קֵדְמָה
  english_pob_choice: eastward
  chosen_korean: 동쪽으로
  alternatives_korean:
  - 동쪽으로 향하여
  - 동쪽 방향으로
  lexicon: HALOT
  rationale: 방향 부사로서 경계의 진행 방향을 간단히 나타내므로, 한국어 지리 서술에 자연스러운 ‘동쪽으로’를 택했습니다.
