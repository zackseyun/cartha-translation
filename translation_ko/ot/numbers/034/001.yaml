lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 말씀하셨습니다'
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 진행감을 살려 앞말의 시간 전진을 나타내는 ‘그때’를 두었고, 직설적 ‘말하다’보다 하나님의 발화에 어울리는 공손한 ‘말씀하시다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름(YHWH)을 POB 기준에 따라 고유명사로 음역해 ‘야훼’로 옮겨, 칭호가 아니라 언약 이름이라는 점을 드러냈습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - ~에게로
  - ~에게
  lexicon: HALOT
  rationale: 대상 지시 전치사 אֶל은 한국어 조사 ‘-에게’가 가장 자연스럽고 간결하게 대응합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하면서
  - 이르시되
  lexicon: HALOT
  rationale: 직접 인용 앞의 관용구는 한국어에서 중복을 피하기 위해 별도의 ‘말하여’ 대신 전체를 한 번에 자연스럽게 묶어 표현했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
