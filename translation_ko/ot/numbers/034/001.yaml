  alternatives_korean:
  - ~에게로
  - ~에게
  lexicon: HALOT
  rationale: 대상 지시 전치사 אֶל은 한국어 조사 ‘-에게’가 가장 자연스럽고 간결하게 대응합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하면서
  - 이르시되
  lexicon: HALOT
  rationale: 직접 인용 앞의 관용구는 한국어에서 중복을 피하기 위해 별도의 ‘말하여’ 대신 전체를 한 번에 자연스럽게 묶어 표현했습니다.
theological_decisions:
