  - 주
  rationale: POB의 본문 정책에 따라 tetragrammaton을 고유명사로 유지해, 본문이 가진 언약적·개인적 호칭의 의미를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
