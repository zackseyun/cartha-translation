  chosen_korean: 파르디엘
  alternatives_korean:
  - 팔티엘
  - 팔디엘
  lexicon: 표준 외래어 표기법
  rationale: 인명은 음역하되, 히브리어 פַּלְטִיאֵל의 한국어 표기는 ‘파르디엘’로 처리했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 자손
  - ~의 후손
  lexicon: HALOT
  rationale: 직계 부자 관계를 나타내는 표준 친족표현이므로 ‘아들’을 유지했습니다.
