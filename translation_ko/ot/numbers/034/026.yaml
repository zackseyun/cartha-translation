  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: ~의 지파에는
  alternatives_korean:
  - 그리고 지파에
  - 그리고 지팟줄에
  lexicon: HALOT
  rationale: 문맥상 분배 목록의 항목이므로 מַטֶּה는 ‘지파’로 옮기는 것이 가장 분명하며, 앞의 접속사·전치사는 한국어 어순에 맞게 조사 구조로 반영했습니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 한 지도자
  alternatives_korean:
  - 한 수장
  - 한 통치자
  - 한 지도자
  lexicon: HALOT
  rationale: 민수기 34장의 נָשִׂיא는 지파를 대표하는 임명된 대표자이므로, 현대 한국어에서 역할을 정확히 드러내는 ‘지도자’가 적절합니다.
- source_word: פַּלְטִיאֵל
  english_pob_choice: Paltiel
  chosen_korean: 파르디엘
  alternatives_korean:
  - 팔티엘
  - 팔디엘
  lexicon: 표준 외래어 표기법
  rationale: 인명은 음역하되, 히브리어 פַּלְטִיאֵל의 한국어 표기는 ‘파르디엘’로 처리했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 자손
  - ~의 후손
  lexicon: HALOT
  rationale: 직계 부자 관계를 나타내는 표준 친족표현이므로 ‘아들’을 유지했습니다.
