  - 한 통치자
  - 한 지도자
  lexicon: HALOT
  rationale: 민수기 34장의 נָשִׂיא는 지파를 대표하는 임명된 대표자이므로, 현대 한국어에서 역할을 정확히 드러내는 ‘지도자’가 적절합니다.
- source_word: פַּלְטִיאֵל
