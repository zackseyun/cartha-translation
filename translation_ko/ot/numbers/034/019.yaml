  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: ko
  text: 그리고 이 남자들의 이름은 다음과 같습니다. 유다 지파에서는 여분네의 아들 갈렙입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이들은
  alternatives_korean:
  - 이들은
  - 그리고 이것들은
  lexicon: HALOT
  rationale: 앞 절의 목록을 이어 주는 וְ를 살려 ‘그리고’로, 지시어 אֵלֶּה는 한국어 서술문에 자연스럽게 ‘이들은’으로 옮겼습니다.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  english_pob_choice: the names of the men
  chosen_korean: 남자들의 이름입니다
  alternatives_korean:
  - 사람들의 이름입니다
  - 그 남자들의 이름입니다
  lexicon: HALOT
  rationale: 문맥상 특정 대표자들의 명단이므로 הָאֲנָשִׁים의 성수성을 살려 ‘남자들’로 옮겼고, 히브리어의 명사구를 한국어 서술형으로 자연화했습니다.
- source_word: לְמַטֵּה
  english_pob_choice: for the tribe of
  chosen_korean: 유다 지파에서는
  alternatives_korean:
  - 유다 지파를 위해서는
  - 유다 지파에 속한
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 ‘막대기’가 아니라 ‘지파’를 뜻하며, ל는 대표/배정의 관계를 나타내므로 한국어에서는 ‘-에서는’으로 소속과 배정을 함께 드러냈습니다.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  english_pob_choice: Caleb son of Jephunneh
  chosen_korean: 여분네의 아들 갈렙
  alternatives_korean:
  - 갈렙, 여분네의 아들
  - 갈렙, 여분네의 아들입니다
  lexicon: HALOT
  rationale: 히브리어 친족표현을 평이하게 ‘여분네의 아들’로 옮기고, 고유명사 순서는 한국어 성경에서 익숙한 방식에 맞췄습니다.
