id: NUM.34.12
reference: Numbers 34:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
  footnotes:
  - marker: a
    text: Or 'its extremities shall be at the Salt Sea.' The Hebrew term can denote the border's terminal points or extremities.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Salt Sea'; that is, the body of water commonly called the Dead Sea.
    reason: cultural_note
translation:
  language: ko
  text: 그러면 경계선은 요르단으로 내려가고[a], 그 끝은 소금바다에 이릅니다[b]. 이것이 사방의 그 경계대로 너희의 땅이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 끝지점은’. 히브리어는 경계선의 말단 또는 종점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘소금바다’; 곧 흔히 말하는 사해입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל הַיַּרְדֵּנָה
  english_pob_choice: Then the border shall go down to the Jordan
  chosen_korean: 그러면 경계선은 요르단으로 내려가고
  alternatives_korean:
  - 그런 뒤 경계는 요르단으로 내려가고
  - 그리고 경계선은 요르단으로 내려가며
  lexicon: WLC/HALOT
  rationale: ירד는 문자적으로 ‘내려가다’이며, 경계선이 지형을 따라 하강하는 법률·지리 문맥을 한국어로 자연스럽게 살렸습니다. הַגְּבוּל은 ‘경계선’으로 옮겨 반복되는 영토 경계 문맥을 분명히 했습니다.
- source_word: תוֹצְאֹתָיו
  english_pob_choice: its end shall be
  chosen_korean: 그 끝은
  alternatives_korean:
  - 그 끝부분은
  - 그 종점은
  - 그 끝지점은
  lexicon: HALOT
  rationale: תוֹצָאוֹת은 경계선의 말단 또는 종점을 가리키므로, ‘끝’으로 간결하게 옮기되 경계의 종결 지점을 뜻하게 했습니다.
- source_word: יָם הַמֶּלַח
  english_pob_choice: the Salt Sea
  chosen_korean: 소금바다
  alternatives_korean:
  - 소금바다
  - 염해
  - 소금의 바다
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘Salt Sea’를 따라 ‘소금바다’로 옮겼습니다. 관용명인 ‘사해’는 의미를 드러내지만, 여기서는 원문 표현을 우선했습니다.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ לִגְבֻלֹתֶיהָ סָבִיב
  english_pob_choice: This shall be your land according to its borders all around
  chosen_korean: 이것이 사방의 그 경계대로 너희의 땅이 될 것입니다.
  alternatives_korean:
  - 이것이 사방의 경계에 따른 너희 땅이 될 것입니다
  - 이것이 사면의 경계에 따라 너희에게 주어질 땅입니다
  lexicon: HALOT
  rationale: זֹאת תִּהְיֶה는 선언문체의 미래/규정적 용법이라 ‘될 것입니다’로 옮겼고, לִגְבֻלֹתֶיהָ סָבִיב은 ‘사방의 그 경계대로’로 바꿔 둘러싼 경계의 범위를 살렸습니다.
theological_decisions:
- issue: 지명 ‘יָם הַמֶּלַח’의 한국어 처리
  chosen_reading: 본문은 ‘소금바다’로 두고, 관용명 ‘사해’는 주석에서만 보조적으로 열어 두었습니다.
  alternative_readings:
  - 사해
  - 염해
  rationale: 원문이 실제로 말하는 표현은 ‘소금바다’이므로, 지리적 통용명보다 स्रोत어 형태를 보존하는 쪽이 더 투명합니다.
  doctrine_reference: '번역 원칙: source-direct, lexical transparency'
- issue: 경계 서술의 법령적 톤
  chosen_reading: 지리 묘사를 단순 서술이 아니라 분배 규정의 선언으로 읽어 ‘될 것입니다’를 사용했습니다.
  alternative_readings:
  - 됩니다
  - 될 것입니다
  rationale: 민수기 34장의 문맥은 약속의 땅 경계 확정이므로, 미래형 선언이 규정적 힘을 더 잘 전달합니다.
  doctrine_reference: 문맥-장르 적합성
