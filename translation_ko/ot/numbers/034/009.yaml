  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
  footnotes:
  - marker: a
    text: Or, more formally, 'its outgoings shall be Hazar-enan.' The Hebrew uses a plural expression for the border’s termination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 지프론까지 이르고, 그 끝은 하살에난이 될 것입니다. 이것이 너희의 북쪽 경계가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 경계의 끝을 복수형 표현으로 말하므로, 직역하면 “그의 나감들”에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: shall extend
  chosen_korean: 이르고
  alternatives_korean:
