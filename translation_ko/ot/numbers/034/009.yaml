  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
  footnotes:
  - marker: a
    text: Or, more formally, 'its outgoings shall be Hazar-enan.' The Hebrew uses a plural expression for the border’s termination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경계는 시브론까지 이어지고, 그 끝[a]은 하살에난이 될 것입니다. 이것이 여러분의 북쪽 경계가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 경계의 끝을 복수형으로 표현합니다. 직역하면 “그 끝나는 지점들”입니다.
    reason: source_note
lexical_decisions:
- source_word: וְיָצָא
  english_pob_choice: shall extend
  chosen_korean: 이르고
  alternatives_korean:
  - 나가고
  - 뻗고
  - 확장되어
  lexicon: HALOT
  rationale: 경계의 진행을 나타내는 용법이므로, 문자적 이동보다 경계선이 도달하는 지점을 자연스럽게 드러내는 「이르다」를 택했습니다.
- source_word: הַגְּבֻל
  english_pob_choice: the border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 국경
  lexicon: HALOT
  rationale: 지형 경계의 문맥이므로 「경계」가 가장 자연스럽고, 본문의 토지 분배 맥락에 잘 맞습니다.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  english_pob_choice: and its endpoint shall be
  chosen_korean: 그 끝은
  alternatives_korean:
  - 그 나감들은
  - 그 끝나는 지점은
  - 그 끝점은
  lexicon: HALOT
  rationale: 히브리어는 복수형 표현이지만 경계의 종결을 가리키는 집합적 표현이므로 한국어에서는 단수로 매끄럽게 옮겼습니다.
- source_word: זִפְרֹנָה / חֲצַר עֵינָן
  english_pob_choice: Ziphron / Hazar-enan
  chosen_korean: 지프론 / 하살에난
  alternatives_korean:
  - 지브론 / 하살-에난
  - 지프론 / 하사르에난
  lexicon: 고유명사 표기
  rationale: 본문의 지명은 음역하여 옮겼고, 한국어 성경에서 널리 쓰이지 않는 형태이므로 현대 외래어식 표기를 따랐습니다.
theological_decisions:
- issue: 경계 설명의 문체
  chosen_reading: 명령형이 아니라 미래적 서술로, 주어진 땅의 경계가 실제로 확정되는 장면으로 옮겼습니다.
  alternative_readings:
  - 현재형 서술
  - 명령형 뉘앙스 강화
  rationale: 본문은 땅 분할 규정의 선언문이므로, 한국어에서도 사실 전달 중심의 미래적 서술이 본문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 민수기 34장 토지 분배 규정
