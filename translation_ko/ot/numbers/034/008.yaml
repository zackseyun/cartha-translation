  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to the entrance of Hamath'; likely a fixed place name, Lebo-hamath.
    reason: lexical_alternative
translation:
  language: ko
  text: 호르 산에서 하맛으로 가는 길까지 경계를 표시하고, 그 경계의 끝은 제닷에 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하맛의 입구’이지만, 여기서는 고정된 지명처럼 쓰인 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  english_pob_choice: From Mount Hor
  chosen_korean: 호르 산에서
  alternatives_korean:
  - 호르 산으로부터
  - 호르 산에서부터
  lexicon: HALOT
  rationale: 고유 지명인 ‘Mount Hor’를 한국어 자연어로 간결하게 옮기되, 출발점 의미는 조사 ‘에서’로 충분히 드러냅니다.
- source_word: תְּתָאוּ
  english_pob_choice: you shall mark out
  chosen_korean: 경계를 표시하고
