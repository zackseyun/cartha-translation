  - 경계를 측량하고
  lexicon: HALOT
  rationale: 경계 설정 문맥에서 단순한 이동이 아니라 선을 정해 표시하는 뜻이므로, ‘표시하다’가 가장 직접적입니다.
- source_word: לְבֹא חֲמָת
  english_pob_choice: to Lebo-hamath
  chosen_korean: 하맛으로 가는 길까지
  alternatives_korean:
