  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to the entrance of Hamath'; likely a fixed place name, Lebo-hamath.
    reason: lexical_alternative
translation:
  language: ko
  text: 호르 산에서 르보하맛까지 경계를 표시하십시오. 그 경계의 끝 지점들은 스닷에 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하맛에 들어가는 곳’입니다. 이 표현은 고정된 지명인 ‘르보하맛’을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  english_pob_choice: From Mount Hor
  chosen_korean: 호르 산에서
  alternatives_korean:
  - 호르 산으로부터
  - 호르 산에서부터
  lexicon: HALOT
  rationale: 고유 지명인 ‘Mount Hor’를 한국어 자연어로 간결하게 옮기되, 출발점 의미는 조사 ‘에서’로 충분히 드러냅니다.
- source_word: תְּתָאוּ
  english_pob_choice: you shall mark out
  chosen_korean: 경계를 표시하고
  alternatives_korean:
  - 경계를 그어
  - 경계를 정하고
  - 경계를 측량하고
  lexicon: HALOT
  rationale: 경계 설정 문맥에서 단순한 이동이 아니라 선을 정해 표시하는 뜻이므로, ‘표시하다’가 가장 직접적입니다.
- source_word: לְבֹא חֲמָת
  english_pob_choice: to Lebo-hamath
  chosen_korean: 하맛으로 가는 길까지
  alternatives_korean:
  - 하맛의 입구까지
  - 레보-하맛까지
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘하맛의 입구’이지만, 지명화된 표현의 기능을 살리면서도 한국어에서는 지리적 방향을 드러내는 방식이 자연스럽습니다.
- source_word: תּוֹצְאֹת הַגְּבֻל
  english_pob_choice: the end points of the border
  chosen_korean: 그 경계의 끝
  alternatives_korean:
  - 그 경계의 종점
  - 그 경계의 끝점
  - 경계의 말단
  lexicon: HALOT
  rationale: 경계의 종착점을 가리키는 표현이므로, 현대 한국어에서는 ‘끝’이 가장 명확하고 간결합니다.
