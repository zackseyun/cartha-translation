  source_fidelity: 원문의 인명 및 부자 관계가 초안에서 바뀌었습니다. 히브리어는 ‘스밧단의 아들 그므엘’을 에브라임 지파의 지도자로 제시하지만, 초안은 ‘기브엘의 아들 케무엘’로 되어 있어 아버지 이름이 잘못되었고 인명도 뒤바뀌었습니다.
