id: NUM.34.24
reference: Numbers 34:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן שִׁפְטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Ephraim'; that is, the members or descendants of the tribe of Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 에브라임 자손 지파에서는 스밧단의 아들 그므엘이 지도자입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: 그리고 … 지파에는
  alternatives_korean:
  - 그리고 … 막대기에는
  - 그리고 … 지팡이에는
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 문자적 ‘지팡이/막대기’보다 부족 단위를 뜻하므로 ‘지파’로 옮기는 것이 문맥에 가장 정확합니다. 접속사와 전치사는 목록형 문맥에 맞게 자연스럽게 연결했습니다.
- source_word: בְנֵי אֶפְרַיִם
  english_pob_choice: the sons of Ephraim
  chosen_korean: 에브라임 자손
  alternatives_korean:
  - 에브라임의 아들들
  - 에브라임 사람들
  lexicon: HALOT
  rationale: ‘sons of’의 직역 구조를 살리되, 부족 구성원을 뜻하는 관용을 반영해 ‘자손’으로 옮겼습니다. 이는 남성 중심의 혈연 표현을 과도하게 일반화하지 않으면서도 자연스럽습니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 지도자
  alternatives_korean:
  - 족장
  - 우두머리
  - 통치자
  lexicon: HALOT
  rationale: 이 문맥의 נָשִׂיא는 왕적 ‘왕자’가 아니라 지파 대표를 가리키므로, 현대 한국어에서 행정적 대표성을 잘 드러내는 ‘지도자’가 적절합니다.
- source_word: קְמוּאֵל
  english_pob_choice: Kemuel
  chosen_korean: 케무엘
  alternatives_korean:
  - 크무엘
  - 케므엘
  lexicon: standard transliteration
  rationale: 고유명사는 현대 한국어 외래어 표기 관행에 따라 음역했습니다.
- source_word: שִׁפְטָן
  english_pob_choice: Shiphtan
  chosen_korean: 기브엘의 아들
  alternatives_korean:
  - 시프트안의 아들
  - 십단의 아들
  lexicon: HALOT
  rationale: 본문의 בֶן שִׁפְטָן은 친족 관계를 표시하는 일반적인 부자 관계이므로 ‘…의 아들’로 옮겼습니다. 고유명사 음역은 한국어 관례에 맞춰 처리했습니다.
theological_decisions:
- issue: 지파 명칭과 혈연 표현의 직역성
  chosen_reading: ‘에브라임 자손의 지파’로 번역해 히브리어의 부족-혈연 구조를 유지했습니다.
  alternative_readings:
  - ‘에브라임 지파’
  - ‘에브라임 사람들의 지파’
  rationale: 본문은 행정적 분류와 혈연적 소속을 함께 드러내므로, 둘 중 하나를 지워버리기보다 구조를 살린 표현이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 민수기 34장의 지파 분배 맥락
