    issue: Unsupported imperative '하라'
    rationale: Nothing in the Hebrew commands the hearer to say or declare this; the clause concludes, 'this shall be for you [the] western/seaward boundary.'
  - severity: medium
    issue: '''대바다'' is unnatural in modern standard Korean'
    rationale: '''큰 바다'' is the ordinary modern rendering and more directly reflects the Hebrew expression ''the Great Sea.'''
