translation:
  language: ko
  text: 요셉 자손[a] 가운데, 므낫세 자손 지파의 지도자는 에봇의 아들 한니엘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요셉의 아들들 … 므낫세의 아들들.’ 히브리어는 지파·족보 문맥에서 ‘아들들’이라는 표현을 반복하여 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  english_pob_choice: For the sons of Joseph
  chosen_korean: 요셉의 아들들에게
  alternatives_korean:
  - 요셉의 자손들에게
  - 요셉의 자녀들에게
  lexicon: HALOT
  rationale: 족보·지파 문맥의 בְנֵי는 문자적으로는 ‘아들들’이지만 집단 전체를 가리키므로, 한국어에서는 자연스러운 여격 표현으로 옮기되 혈통 연결을 살리기 위해 ‘요셉의 아들들’ 구조를 유지했습니다.
- source_word: לְמַטֵּה
  english_pob_choice: for the tribe of
  chosen_korean: '...지파를 위하여'
  alternatives_korean:
  - '...지파를 위해'
  - '...지파에 대하여'
  lexicon: HALOT
  rationale: מַטֶּה가 이 문맥에서 ‘지팡이’가 아니라 행정적 단위인 ‘지파’를 뜻하므로, 한국어에서는 목적/배정의 의미를 드러내는 ‘~를 위하여’로 자연스럽게 처리했습니다.
- source_word: בְנֵי מְנַשֶּׁה
  english_pob_choice: the sons of Manasseh
  chosen_korean: 므낫세의 아들들의
  alternatives_korean:
  - 므낫세의 자손들의
  - 므낫세의 자녀들의
  lexicon: HALOT
  rationale: 앞부분과 같은 족보적 반복을 살리기 위해 ‘아들들’ 표현을 유지했습니다. ‘므낫세’는 지파명/인명으로 그대로 음역했습니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 한 지도자
  alternatives_korean:
  - 한 통치자
  - 한 족장
  - 한 우두머리
  lexicon: HALOT
  rationale: 행정 명단에서 נָשִׂיא는 임명된 지파 대표를 가리키므로, 왕권 뉘앙스가 있는 ‘왕자/공자’류보다 현대 한국어의 ‘지도자’가 의미를 가장 분명하게 전달합니다.
- source_word: בֶּן אֵפֹד
  english_pob_choice: son of Ephod
  chosen_korean: 에봇의 아들
  alternatives_korean:
  - 에봇의 자손
  - 에봇의 아들
  lexicon: HALOT
  rationale: 에봇은 여기서 제의복이 아니라 인명으로 보아야 하므로, 고유명사로 음역하여 족보 형식을 그대로 반영했습니다.
theological_decisions:
- issue: 지파 명단에서 ‘아들들/자손들’ 반복을 어떻게 처리할지
  chosen_reading: 히브리어의 족보적·지파적 반복을 살리되, 한국어는 읽기 자연성을 위해 ‘아들들’과 조사·어순을 정리했습니다.
  alternative_readings:
  - 반복을 줄여 ‘자손들’로 통일
  - 더 매끄럽게 의역하여 인명 목록만 제시
  rationale: 이 구절은 행정적 경계 설정 문맥의 공식 명단이므로, 반복 자체가 문체와 구조의 일부입니다. 너무 매끄럽게 만들면 원문의 열거 형식과 지파 정체성이 약해집니다.
  doctrine_reference: 민수기 34장의 지파 배분 명단 구조
