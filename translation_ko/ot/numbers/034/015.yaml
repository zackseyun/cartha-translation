  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁנֵ֥י הַ/מַּטּ֖וֹת וַ/חֲצִ֣י הַ/מַּטֶּ֑ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֛בֶר לְ/יַרְדֵּ֥ן יְרֵח֖וֹ קֵ֥דְמָ/ה מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
  footnotes:
  - marker: a
    text: Or "on the other side of the Jordan."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "eastward, toward the sunrise," a doubled expression emphasizing the eastern side.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 지파와 반 지파는 여리고 너머, 곧 동쪽, 해 뜨는 쪽에서 자기들의 기업을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여리고 너머’는 히브리어의 화자 기준 관용구를 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘동쪽, 해 뜨는 쪽’이라는 중첩 표현으로 동쪽을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  english_pob_choice: the two tribes
  chosen_korean: 두 지파
  alternatives_korean:
  - 두 막대기
  - 두 지팡이
  lexicon: HALOT
  rationale: 지파 분배 문맥에서 מַטֶּה는 문자적 ‘지팡이’보다 ‘지파’의 관용적 의미가 분명하므로, 이를 한국어의 자연스러운 행정·언약 문맥 표현인 ‘지파’로 옮겼습니다.
- source_word: וַ/חֲצִי הַ/מַּטֶּה
  english_pob_choice: and the half-tribe
  chosen_korean: 반 지파
  alternatives_korean:
  - 지파의 절반
  - 반쪽 지파
  lexicon: HALOT
  rationale: 특정 분할 단위로 굳어진 표현이므로 단순한 산술적 ‘절반’보다 ‘반 지파’가 본문의 제도적 의미를 더 잘 드러냅니다.
- source_word: נַחֲלָתָם
  english_pob_choice: their inheritance
  chosen_korean: 자기들의 기업
  alternatives_korean:
  - 그들의 상속
  - 그들의 소유
  lexicon: HALOT
  rationale: נַחֲלָה는 땅 분배 맥락에서 언약적 몫을 가리키므로, 개역 계열의 전통 용어를 그대로 따르기보다 본문 의미를 살리는 ‘기업’을 사용했습니다.
- source_word: מֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  english_pob_choice: beyond the Jordan at Jericho
  chosen_korean: 여리고 너머
  alternatives_korean:
  - 요단 저편
  - 요단 강 건너편
  lexicon: HALOT
  rationale: מֵעֵבֶר לְיַרְדֵּן은 화자 기준의 ‘요단 저편/너머’라는 관용구이므로, 위치 표지를 간결하게 살리는 ‘여리고 너머’로 옮겼습니다.
- source_word: קֵדְמָה מִזְרָחָה
  english_pob_choice: eastward, toward the sunrise
  chosen_korean: 곧 동쪽, 해 뜨는 쪽
  alternatives_korean:
  - 동쪽으로, 해 뜨는 쪽으로
  - 동쪽, 해돋는 쪽
  lexicon: HALOT
  rationale: 두 방향어의 중첩이 강조 효과를 이루므로, 단순히 ‘동쪽’으로만 평면화하지 않고 ‘해 뜨는 쪽’을 덧붙여 반복적 강조를 한국어로 재현했습니다.
theological_decisions:
- issue: 지파들의 땅 분배를 ‘받았다’로 옮길지 ‘가졌다/차지했다’로 옮길지
  chosen_reading: ‘받았습니다’
  alternative_readings:
  - ‘차지했습니다’
  - ‘가지게 되었습니다’
  rationale: 본문의 לָקְחוּ는 완료된 점유를 말하지만, 분배된 몫이라는 문맥상 수동적 수령의 뉘앙스도 강하므로 한국어에서는 ‘받았습니다’가 가장 균형 잡힌 표현입니다.
  doctrine_reference: 언약적 기업 분배와 하나님의 약속 성취
