  - 암미훗의 아들
  lexicon: HALOT
  rationale: 계보 표지 בֶּן은 이 목록에서 가장 직접적으로 ‘아들’로 옮기는 것이 자연스럽고, 고유명사 עַמִּיהוּד는 통용 음역 ‘암미훗’으로 옮겼습니다.
