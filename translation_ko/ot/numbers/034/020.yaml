translation:
  language: ko
  text: 그리고 시므온 자손 지파에서는 암미훗의 아들 스무엘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘스무엘’이며, 전통적으로는 ‘사무엘’로 음역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: 그리고 …의 지파에는
  alternatives_korean:
  - 그리고 …의 지파에
  - 그리고 … 지파에는
  lexicon: HALOT
  rationale: בְּמַטֵּה는 이 행정적 분배 문맥에서 문자적 ‘지팡이’가 아니라 ‘지파’를 뜻하므로, 한국어도 자연스럽게 지파 관계를 드러내도록 옮겼습니다.
- source_word: בְּנֵי שִׁמְעוֹן
  english_pob_choice: the sons of Simeon
  chosen_korean: 시므온 자손
  alternatives_korean:
  - 시므온의 아들들
  - 시므온의 자손들
  lexicon: HALOT
  rationale: 족보·지파 공식에서 ‘자손’이 히브리어의 집합적 표현을 가장 자연스럽게 보존하며, ‘아들들’보다 지파 소속을 더 분명히 드러냅니다.
- source_word: שְׁמוּאֵל
  english_pob_choice: Shemuel
  chosen_korean: 셈우엘
  alternatives_korean:
  - 사무엘
  - 세무엘
  lexicon: 표준 외래어 표기법
  rationale: 이 이름은 본문 표기인 히브리어 자음형에 더 가까운 음역을 따르는 것이 적절하므로, 익숙한 ‘사무엘’보다 ‘셈우엘’을 택했습니다.
- source_word: בֶּן עַמִּיהוּד
  english_pob_choice: son of Ammihud
  chosen_korean: 암미훗의 아들
  alternatives_korean:
  - 암미훗의 자손
  - 암미훗의 아들
  lexicon: HALOT
  rationale: 계보 표지 בֶּן은 이 목록에서 가장 직접적으로 ‘아들’로 옮기는 것이 자연스럽고, 고유명사 עַמִּיהוּד는 통용 음역 ‘암미훗’으로 옮겼습니다.
