  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: ko
  text: 그리고 스불론 자손 지파의 지도자는 바르낙의 아들 엘리사반입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  english_pob_choice: And for the tribe of
  chosen_korean: 그리고 … 지파에는
  alternatives_korean:
  - 그리고 … 지파를 위하여
  - 그리고 … 지파에
  lexicon: HALOT
  rationale: מַטֶּה는 지파 배정 문맥에서 ‘지팡이/막대’가 아니라 ‘지파’로 이해하는 것이 자연스럽습니다. 한국어에서는 목록형 문맥을 살려 ‘… 지파에는’으로 옮겼습니다.
- source_word: בְנֵי זְבוּלֻן
  english_pob_choice: the sons of Zebulun
  chosen_korean: 스불론 자손
  alternatives_korean:
  - 스불론의 아들들
  - 스불론의 후손
  lexicon: HALOT
  rationale: 직역하면 ‘스불론의 아들들’이지만, 족보·지파 표지로는 ‘자손’이 표준적이고 문맥상 더 매끄럽습니다. 동시에 집단적 혈통 표지를 유지합니다.
- source_word: נָשִׂיא
  english_pob_choice: a leader
  chosen_korean: 지도자
  alternatives_korean:
  - 족장
  - 우두머리
  - 통치자
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 행정적·대표적 지위를 가리키므로, 현대 한국어에서 오해가 적은 ‘지도자’를 택했습니다. ‘족장’은 가문장 느낌이 강하고 ‘통치자’는 과합니다.
- source_word: בֶּן פַּרְנָךְ
  english_pob_choice: son of Parnach
  chosen_korean: 파르낙의 아들
  alternatives_korean:
  - 파르낙의 아들인
  - 파르낙의 아들입니다
  lexicon: HALOT
  rationale: בֶּן은 족보 표지이므로 한국어도 소유격으로 간결하게 옮겼습니다. 끝의 이름 설명을 자연스럽게 붙여 인물 식별을 유지합니다.
