revisions:
- from: 이 사람들의 향로[a]—곧 자기들의 생명을 내놓고 죄를 지은 자들의 향로—를 쳐서 얇은 금판[c]으로 만들어 제단을 덮는 재료로 삼으십시오. 그들이 그것들을 야훼 앞에 드렸고, 그것들이 거룩하게 되었기[d] 때문입니다. 그것들은 이스라엘 자손에게 표징이 될 것입니다[e].
  to: 자기 목숨을 대가로 죄를 지은 이 사람들[a][b]의 향로를 두드려 편 금속판[c]으로 만들어 제단을 덮을 판으로 삼게 하십시오. 그들이 그것들을 야훼 앞에 드렸고 그것들이 거룩하게 되었기[d] 때문입니다. 그것들은 이스라엘 자손에게 표징이 될 것입니다[e].
  rationale: 금속을 금으로 특정한 표현을 원문의 비특정성을 보존하는 ‘금속판’으로 고쳤습니다. 생명 관련 관용구는 자발적 희생처럼 들리지 않도록 ‘자기 목숨을 대가로’로 옮기고, 문자적 표현 및 문맥적 의미를 각주로 밝혔습니다. 명령의 수신자는 앞 절의 지시 맥락에 따라 한국어의 자연스러운 사역 명령인 ‘삼게 하십시오’로 유지했습니다. 향로들이 야훼 앞에 드려져 거룩하게 되었다는 인과와 표징의 기능은 보존했습니다.
