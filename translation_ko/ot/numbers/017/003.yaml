id: NUM.17.3
reference: Numbers 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'these sinners' or 'these sinful men.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in/with their lives'; that is, their sin cost them their lives.
    reason: lexical_alternative
  - marker: c
    text: Or 'beaten plates' or 'hammered plates of metal.'
    reason: lexical_alternative
  - marker: d
    text: Or 'they were consecrated.' The subject is most naturally the censers.
    reason: lexical_alternative
  - marker: e
    text: Or 'for the Israelites.' Literally 'to the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람들의 향로[a]—곧 자기들의 생명을 내놓고 죄를 지은 자들의 향로—를 쳐서 얇은 금판[c]으로 만들어 제단을 덮는 재료로 삼으십시오. 그들이 그것들을 야훼 앞에 드렸고, 그것들이 거룩하게 되었기[d] 때문입니다. 그것들은 이스라엘 자손에게 표징이 될 것입니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 죄인들’ 혹은 ‘이 죄악된 사람들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘두드려 만든 판’ 혹은 ‘두드려 편 금속판’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘성별되었다’. 가장 자연스러운 주어는 향로들입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘이스라엘 사람들에게’. 직역하면 ‘이스라엘의 아들들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  english_pob_choice: censers
  chosen_korean: 향로
  alternatives_korean:
  - 불그릇
  - 향그릇
  lexicon: HALOT
  rationale: 제의 문맥에서 불과 향을 담는 기구를 가리키므로, 한국어로는 기능을 드러내는 ‘향로’가 가장 자연스럽고 본문 이해에도 분명합니다.
- source_word: הַחַטָּאִים הָאֵלֶּה
  english_pob_choice: these men who sinned
  chosen_korean: 죄를 지은 자들
  alternatives_korean:
  - 이 죄인들
  - 이런 죄를 지은 사람들
  lexicon: HALOT
  rationale: 분사 표현의 사건성을 살려 단순 명사화보다 ‘죄를 지은 자들’로 옮겼습니다.
- source_word: בְּנַפְשֹׁתָם
  english_pob_choice: at the cost of their lives
  chosen_korean: 자기들의 생명을 내놓고
  alternatives_korean:
  - 자기들의 생명으로
  - 자기들의 목숨을 잃고
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 생명으로/안에서’이지만 문맥상 자기들의 죽음을 불러온 자멸적 죄를 뜻하므로, 결과를 드러내는 한국어로 옮겼습니다.
- source_word: רִקֻּעֵי פַחִים
  english_pob_choice: hammered plates
  chosen_korean: 얇은 금판
  alternatives_korean:
  - 두드려 만든 판
  - 망치로 친 금판
  lexicon: HALOT
  rationale: 두드려 편 금속판이라는 뜻을 살리되, 한국어에서 제단 덮개 재료로 자연스러운 ‘금판’을 택했습니다.
- source_word: וַיִּקְדָּשׁוּ
  english_pob_choice: they became holy
  chosen_korean: 거룩하게 되었기
  alternatives_korean:
  - 성별되었기
  - 거룩해졌기
  lexicon: HALOT
  rationale: 이 동사의 결과를 한국어에서 가장 직접적으로 드러내는 표현은 ‘거룩하게 되다’입니다. 제의적 구별 상태를 자연스럽게 반영합니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성서 문맥에서 익숙하면서도 원문의 집합적 표현을 유지하는 방식으로 옮겼습니다.
theological_decisions:
- issue: 거룩함의 주체와 의미
  chosen_reading: 향로들이 야훼 앞에 드려졌기 때문에 거룩하게 되었고, 그 결과 제단 덮개로 재사용됩니다.
  alternative_readings:
  - 사람들이 부분적으로 거룩해졌다는 뜻
  - 단순히 의식적으로 따로 구별되었다는 뜻
  rationale: 문법상 가장 가까운 주어는 향로들이며, 본문은 죄와 죽음에 관련된 물건이 야훼 앞에 놓였다는 이유로 거룩한 영역에 속하게 되었음을 보여 줍니다. 이 긴장을 완화하지 않고 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 레위기적 성물 개념, 민수기 17장의 표징 기능
- issue: ‘자기들의 생명’ 표현의 해석
  chosen_reading: 죄가 그들의 죽음이라는 결과를 낳았다는 뜻으로 이해합니다.
  alternative_readings:
  - 영혼에 대한 윤리적 범죄
  - 생명/혼의 형이상학적 대비
  rationale: 문맥은 심리학적 ‘영혼’보다 자멸적 반역의 결과를 말합니다. 따라서 생명 상실이라는 결과를 드러내는 번역이 가장 적절합니다.
  doctrine_reference: 죄의 형벌과 심판의 서술
