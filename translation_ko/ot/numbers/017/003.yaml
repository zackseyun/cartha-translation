  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'these sinners' or 'these sinful men.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in/with their lives'; that is, their sin cost them their lives.
    reason: lexical_alternative
  - marker: c
    text: Or 'beaten plates' or 'hammered plates of metal.'
    reason: lexical_alternative
  - marker: d
    text: Or 'they were consecrated.' The subject is most naturally the censers.
    reason: lexical_alternative
  - marker: e
    text: Or 'for the Israelites.' Literally 'to the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 목숨을 대가로 죄를 지은 이 사람들[a][b]의 향로를 두드려 편 금속판[c]으로 만들어 제단을 덮을 판으로 삼게 하십시오. 그들이 그것들을 야훼 앞에 드렸고 그것들이 거룩하게 되었기[d] 때문입니다. 그것들은 이스라엘 자손에게 표징이 될 것입니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 죄인들’ 또는 ‘이 죄악된 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 목숨으로/그들의 생명을 걸고’. 문맥상 그 죄가 그들의 목숨을 대가로 치르게 했다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘두드려 만든 판’ 또는 ‘두드려 편 금속판’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘성별되었다’. 가장 자연스러운 주어는 향로들입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘이스라엘 사람들에게’. 직역하면 ‘이스라엘의 아들들에게’입니다.
    reason: lexical_alternative
