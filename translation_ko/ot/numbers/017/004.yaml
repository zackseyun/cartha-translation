base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
  footnotes:
  - marker: a
    text: Or 'firepans' for 'censers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the burned ones' or 'the ones who were burned,' referring to those consumed by fire in the preceding narrative.
    reason: lexical_alternative
  - marker: c
    text: Or 'plating' or 'overlay' for 'a covering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 엘르아살은 불에 탄 사람들이 바쳤던 놋 향로들을 가져다가, 그것을 두드려 제단을 위한 덮개로 만들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향로’는 제의용 그릇을 가리키는 번역입니다. 문맥상 ‘화로’보다 적합합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불에 탄 사람들’은 히브리어 수동 분사 ‘불에 의해 탄 자들’을 반영합니다. 고라의 무리가 불심판을 받은 사실을 가리킵니다.
    reason: source_note
  - marker: c
    text: 원문은 금속을 두드려 펴는 동작을 말합니다. 주체는 분명하지 않으므로 한국어에서도 수동적으로 풀지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: מַחְתּוֹת
  english_pob_choice: censers
  chosen_korean: 향로
  alternatives_korean:
  - 화로
  - 불집게
  lexicon: HALOT
  rationale: 제의 문맥에서 제사에 쓰는 그릇을 가리키므로, 한국어에서는 통용성과 정확성을 함께 고려해 ‘향로’로 옮겼습니다.
- source_word: הַנְּחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 기물 문맥에서는 한국어 성경에서 관용적으로 ‘놋’이 가장 자연스럽고 의미도 안정적으로 전달합니다.
- source_word: הַשְּׂרֻפִים
  english_pob_choice: the burned men
  chosen_korean: 불에 탄 사람들
  alternatives_korean:
  - 불에 탄 자들
  - 불탄 사람들
  lexicon: HALOT
  rationale: שׂרף의 수동 분사로, 고라 무리가 불에 의해 소멸된 사실을 구체적으로 드러내므로 ‘불에 탄 사람들’이 원문의 ملم한 이미지를 살립니다.
- source_word: וַיְרַקְּעוּם
  english_pob_choice: they were hammered out
  chosen_korean: 두드려
  alternatives_korean:
  - 두드려 펴서
  - 망치질하여
  lexicon: HALOT
  rationale: 원문은 금속을 두드려 펴는 행위를 뜻하므로, 결과를 간결하게 드러내는 동사형으로 처리하고, 주체를 굳이 보태지 않았습니다.
- source_word: צִפּוּי
  english_pob_choice: a covering
  chosen_korean: 덮개
  alternatives_korean:
  - 덧입힘
  - 입힘
  lexicon: HALOT
  rationale: 금속판이 제단을 덮는 기능을 나타내므로, 자연스러운 한국어로 ‘덮개’가 가장 직접적입니다.
theological_decisions:
- issue: 불에 탄 자들을 지칭하는 방식
  chosen_reading: 본문의 수동 분사를 인물 집단 지칭으로 살려, 고라의 무리가 불로 심판받았다는 서술을 직설적으로 반영했습니다.
  alternative_readings:
  - 완곡하게 ‘그들이 불에 탄 뒤’로 풀어 쓰는 방식
  - ‘불에 타 죽은 사람들’처럼 결과를 더 설명하는 방식
  rationale: 서술의 충격과 기념적 성격을 약화시키지 않기 위해, 원문의 구체적 표지를 유지했습니다.
  doctrine_reference: 민수기 16장 사건의 심판 기억
- issue: 반복된 금속 공예 동작의 처리
  chosen_reading: ‘두드려’로 옮겨 제단 덮개 제작의 물리적 행위를 간명하게 살렸습니다.
  alternative_readings:
  - ‘망치질하여’
  - ‘펴서 만들었습니다’
  rationale: 원문은 제의 물품의 변형 과정을 보여 주므로, 가공의 느낌을 살리되 과도한 해설은 피했습니다.
  doctrine_reference: 성막/제단의 거룩한 기물 제작
