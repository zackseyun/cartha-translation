- from: 제사장 엘르아살은 불에 탄 사람들이 바쳤던 놋 향로들을 가져다가, 그것을 두드려 제단을 위한 덮개로 만들었습니다.[a][b][c]
  to: 제사장 엘르아살은 불에 탄 사람들이 바쳤던 놋 향로들[a]을 가져갔으며, 그 향로들은 두드려 펴져[c] 제단을 덮는 판이 되었습니다.[b]
