    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그들이 그것들을 두드려 폈다’라고 합니다. 그 주체가 누구인지는 이 절에서 밝히지 않으므로, 번역에서는 수동 표현으로 그 불확실성을 보존했습니다.
    reason: source_note
  revision_rationale: The revision corrects plural reference, avoids supplying Eleazar as the agent of the metalworking, and renders the altar covering as a metal overlay. Footnotes are retargeted to the relevant Korean expressions and revised to state lexical alternatives and the syntactic ambiguity accurately.
