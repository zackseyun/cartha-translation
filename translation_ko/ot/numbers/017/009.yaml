    reason: alternative_reading
  revision_rationale: The revision uses idiomatic modern formal-polite Korean for the Hebrew formula while retaining Yahweh’s personal name. Korean conventionally expresses the formula’s forward-looking ‘saying’ through the speech-introduction construction, without an unnatural second verb.
