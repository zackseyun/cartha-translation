revisions:
- from: 그리고 그것이 일어났습니다[a]. 회중이 모세와 아론을 향하여 모여들었을 때, 그들이 회막을 향해 돌아섰는데, 보십시오, 구름이 그것을 덮었고 야훼의 영광이 나타났습니다.
  to: 회중이 모세와 아론을 대적하여 모였을 때, 그들은 회막 쪽으로 돌아섰습니다. 보십시오, 구름이 그것을 덮었고 야훼의 영광이 나타났습니다[a].
  rationale: 적대의 의미를 ‘대적하여’로 회복하고, 불명확한 ‘그것이 일어났습니다’를 제거하여 히브리어의 시간적 서사 도입을 자연스러운 현대 한국어로 옮겼습니다. 회막을 가리키는 목적격 대명사와 그 불확정성을 설명하는 각주는 유지했습니다.
