id: NUM.17.7
reference: Numbers 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the cloud covered it''; the pronoun most naturally refers to ''the tent of meeting.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 회중이 모세와 아론을 대적하여 모였을 때, 그들은 회막 쪽으로 돌아섰습니다. 보십시오, 구름이 그것을 덮었고 야훼의 영광이 나타났습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘구름이 그것을 덮었다’이며, 대명사는 가장 자연스럽게 ‘회막’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그것이 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그때 일이 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서사 전환 공식 וַיְהִי의 사건 진행을 자연스러운 현대 한국어로 옮기되, 과도하게 성경투가 되지 않도록 했습니다.
- source_word: בְּהִקָּהֵל הָעֵדָה
  english_pob_choice: when the congregation assembled
  chosen_korean: 회중이 모세와 아론을 향하여 모여들었을 때
  alternatives_korean:
  - 회중이 모였을 때
  - 회중이 모세와 아론에게 모여들었을 때
  lexicon: HALOT
  rationale: עֵדָה는 여기서 집합된 이스라엘 공동체를 가리키므로 ‘회중’이 적절하며, 동사의 상황은 ‘모여들었을 때’로 옮겨 반대와 압박의 뉘앙스를 살렸습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 한국어 성서 용례에서 אֹהֶל מוֹעֵד는 통상 ‘회막’으로 굳어져 있어, 본문의 지시 대상을 명확하게 전달하는 데 가장 적절합니다.
- source_word: כִסָּהוּ
  english_pob_choice: covered it
  chosen_korean: 구름이 그것을 덮었고
  alternatives_korean:
  - 구름이 그 위를 덮었고
  - 구름이 회막을 덮었고
  lexicon: HALOT
  rationale: 대명사 목적어는 가장 자연스러운 선행사인 회막을 가리키므로, 한국어에서는 ‘그것을’로 처리해 POB의 각주가 지적한 지시 대상을 보존했습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
  - 야훼의 광채
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, כבוד는 여기서 신적 임재의 현현을 가리키므로 ‘영광’이 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용하는 신명 טetragrammaton을 제목어로 바꾸지 않고 고유명으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הֶעָנָן과 כְּבוֹד יְהוָה의 병행
  chosen_reading: 구름이 회막을 덮고 야훼의 영광이 나타남
  alternative_readings:
  - 구름이 덮이고 야훼의 영광이 보임
  - 구름과 영광이 함께 나타남
  rationale: 구름의 덮음과 영광의 출현은 성막 위 임재의 표지로 기능하므로, 두 표현을 분리해 기술하되 같은 현현 장면으로 읽히게 했습니다.
  doctrine_reference: 성막 현현 본문에서 구름과 영광은 하나님의 임재를 드러내는 표지
