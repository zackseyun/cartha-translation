base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 택할 사람의 지팡이에는 싹이 날 것이다. 나는 이스라엘 자손[a]이 너희를 거슬러 불평하는 그 불평을 내게서 그치게 하겠다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그리고 그것은
  alternatives_korean:
  - 그러면 그것은
  - 그리고 이는
  lexicon: HALOT
  rationale: 미래 예고의 연결 표현을 한국어 자연문으로 옮기되, 과도하게 경직된 예언체는 피했습니다.
- source_word: מַטֵּהוּ יִפְרָח
  english_pob_choice: the staff ... will bud
  chosen_korean: 그 사람의 지팡이가 싹틀 것이며
