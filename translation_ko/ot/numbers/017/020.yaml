  source_fidelity: 초안은 מֵעָלַי(‘내게서/나에게서’)를 번역에서 빠뜨렸고, 관계절 אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם을 ‘…때문입니다’라는 인과절로 바꾸어 원문의 수식 관계를 변경했습니다. 또한 וְהָיָה의 도입 표현과 뒤따르는 문장 연결이 한국어 문법상 부자연스럽습니다. 수정문은 ‘내게서’와 ‘너희를 거슬러’를 모두 보존하고, 관계절을 관계 수식으로 유지합니다.
  naturalness: ‘그리고 그것은 … 것이며’는 현대 표준 한국어에서 어색하고 문장 구조가 불완전합니다. 두 문장으로 나누고 ‘지팡이에는 싹이 날 것이다’로 옮기면 합쇼체의 현대적이고 격식 있는 문체가 됩니다. ‘너희를 거슬러’는 원문의 적대적 עֲלֵיכֶם을 자연스럽게 나타냅니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 친족적 표현을 보존하는 적절한 성경 번역어이며, ‘불평’은 תְּלֻנּוֹת와 מַלִּינִם의 반복을 무리 없이 반영합니다. 각주 표지는 해당 표현 바로 뒤에 두어야 합니다.
