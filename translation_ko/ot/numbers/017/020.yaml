  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 내가 택하는 그 사람의 지팡이가 싹틀 것이며, 내가 이스라엘 자손의 불평을 그치게 할 것인데, 그들이 여러분을 향해 불평하고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 혹은 ‘이스라엘 백성’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그리고 그것은
  alternatives_korean:
  - 그러면 그것은
  - 그리고 이는
  lexicon: HALOT
  rationale: 미래 예고의 연결 표현을 한국어 자연문으로 옮기되, 과도하게 경직된 예언체는 피했습니다.
- source_word: מַטֵּהוּ יִפְרָח
  english_pob_choice: the staff ... will bud
  chosen_korean: 그 사람의 지팡이가 싹틀 것이며
  alternatives_korean:
  - 그 사람의 지팡이가 꽃필 것이며
  - 그 사람의 지팡이가 발아할 것이며
  lexicon: HALOT
  rationale: מַטֶּה는 여기서 표징이 되는 지팡이이고, יִפְרָח는 ‘싹트다/피다’의 생동 이미지를 가리키므로 ‘싹틀’이 가장 직접적입니다.
- source_word: תְּלֻנּוֹת
  english_pob_choice: complaints
  chosen_korean: 불평을
  alternatives_korean:
  - 원망을
  - 불만을
  lexicon: HALOT
  rationale: 출애굽기·민수기의 반복되는 הסתלק/불평 맥락에서 한국어로는 ‘불평’이 가장 평이하면서도 반복적 불만의 뉘앙스를 잘 살립니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 원문의 친족적·언약적 표현을 유지하면서도 한국어에서 자연스럽고 성경적 어감을 갖는 직역형으로 옮겼습니다.
- source_word: מַלִּינִם עֲלֵיכֶם
  english_pob_choice: are grumbling against you
  chosen_korean: 여러분을 향해 불평하고 있기 때문입니다
  alternatives_korean:
  - 여러분에게 불평하고 있기 때문입니다
  - 여러분을 거슬러 불평하고 있기 때문입니다
  lexicon: HALOT
  rationale: עַל의 적대적 방향성을 살리면서도 ‘against you’를 한국어에서 과도하게 강경하게 만들지 않도록 ‘향해’로 처리했습니다.
theological_decisions:
- issue: 하나님이 불평을 그치게 하신다는 서술의 방향
  chosen_reading: 주어는 하나님이시고, 내용은 이스라엘 자손의 불평을 종결시키시는 주권적 행위로 읽었습니다.
  alternative_readings:
  - 불평을 그냥 잠잠하게 하신다는 일반적 약화
  - 불평의 대상이 아론과 모세라는 점만 강조하는 읽기
  rationale: 히브리어 שׁכך의 사역형은 단순한 진정이 아니라 끝내게 하시는 조치이므로, ‘그치게 하다’로 신학적·서사적 강도를 유지했습니다.
  doctrine_reference: 'Translation philosophy: source transparency and preserved force'
