    rationale: '''각 족장 집의 머리를 위한 지팡이'' can suggest a staff intended for a leader rather than the stated one-staff-per-head arrangement.'
  - severity: low
    issue: The formal-polite register is not consistently realized.
    rationale: The instruction and rationale should use forms such as '적으십시오' and '때문입니다.'
  - severity: low
