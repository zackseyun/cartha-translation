  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: ko
  text: 그는 죽은 자들과 산 자들 사이에 서 있었고, 그 재앙은 멈추었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: And he stood
  chosen_korean: 서 있었고
  alternatives_korean:
  - 서 있었습니다
  - 자리를 지켰습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: עָמַד의 기본 의미인 ‘서다’를 자연스러운 서술형으로 옮겼습니다. 전투적 뉘앙스를 덧붙이기보다 장면의 사실성을 살렸습니다.
- source_word: בֵּין ... וּבֵין
  english_pob_choice: between ... and
  chosen_korean: '... 사이에'
  alternatives_korean:
  - '... 한가운데에'
  - '...과 ... 사이에'
  lexicon: HALOT
  rationale: 두 집단을 가르는 공간적 대조를 한국어의 ‘사이에’로 직접 반영했습니다.
- source_word: הַמֵּתִים / הַחַיִּים
  english_pob_choice: the dead / the living
  chosen_korean: 죽은 자들 / 산 자들
  alternatives_korean:
  - 죽은 이들 / 살아 있는 이들
  - 죽은 사람들 / 살아 있는 사람들
  lexicon: HALOT
  rationale: 서술적 대조를 분명히 하기 위해 명사화된 표현을 택했고, 본문의 날카로운 대비를 유지했습니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 전염병
  - 그 역병
  - 그 재앙
  lexicon: HALOT
  rationale: 이 본문에서는 죽음의 심판이 즉각 멈춘 상황을 가리키므로, 단순한 질병보다 ‘재앙’이 문맥을 더 정확히 반영합니다.
theological_decisions:
- issue: מַגֵּפָה의 성격을 어떻게 드러낼지
  chosen_reading: 그 재앙
  alternative_readings:
  - 그 전염병
  - 그 역병
  rationale: 문맥상 자연재해가 아니라 여호와의 심판으로서의 치명적 재앙이므로, 의미를 약화시키지 않는 ‘재앙’을 택했습니다.
  doctrine_reference: 민수기 17장의 문맥적 심판 이해
