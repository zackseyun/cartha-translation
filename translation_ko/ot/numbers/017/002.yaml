source:
  edition: WLC
  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
  footnotes:
  - marker: a
    text: Or 'firepans' for 'censers.' The Hebrew term refers to vessels used to carry coals/incense.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''for they are holy.'' The Hebrew perfect may emphasize the resulting state: ''they have become holy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 엘르아살 곧 아론의 아들 제사장에게 말하여, 그 향로들을 타오르는 불 가운데서 집어 내고 그 불을 멀리 흩으십시오. 그것들이 거룩해졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향로들’로도 번역할 수 있습니다. 히브리어는 숯과 향을 담아 나르는 그릇을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 거룩합니다.’ 히브리어 완료형은 결과 상태를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Tell
  chosen_korean: 말하여
  alternatives_korean:
  - 말하라고 하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 명령을 전달하는 동사로서 자연스러운 현대 한국어 합쇼체 명령 전달 표현을 택했습니다.
- source_word: הַמַּחְתֹּת
  english_pob_choice: the censers
  chosen_korean: 그 향로들을
  alternatives_korean:
  - 그 화로들을
  - 그 불뎅이 그릇들을
  lexicon: HALOT
  rationale: 문맥상 분향용 그릇을 가리키므로 교회적 전통어인 ‘향로’가 가장 직접적이며, 복수형을 살렸습니다.
- source_word: מִבֵּין הַשְּׂרֵפָה
  english_pob_choice: out from among the burning
  chosen_korean: 타오르는 불 가운데서
  alternatives_korean:
  - 불타는 곳 가운데서
  - 불붙은 것들 가운데서
  lexicon: HALOT
  rationale: שׂרפה는 여기서 ‘불타는 장면/불붙은 상태’를 가리키므로, 한국어에서 즉시 이해되는 현재적 이미지로 옮겼습니다.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  english_pob_choice: and scatter the fire farther away
  chosen_korean: 그 불을 멀리 흩으십시오
  alternatives_korean:
  - 그 불을 더 멀리 흩으십시오
  - 그 불을 저쪽으로 흩으십시오
  lexicon: HALOT
  rationale: זרה의 ‘흩다’와 הָלְאָה의 ‘멀리’라는 방향성을 함께 살려 간결하게 옮겼습니다.
theological_decisions:
- issue: כִּי קָדֵשׁוּ의 상태 표현
  chosen_reading: ‘거룩해졌습니다’로 결과 상태를 나타냈습니다.
  alternative_readings:
  - ‘거룩합니다’
  - ‘거룩하게 되었습니다’
  rationale: 영문 POB의 주석처럼 완료형이 결과 상태를 나타낼 수 있으므로, 단순 현재형보다 변화의 결과를 드러내는 표현을 택했습니다.
  doctrine_reference: 성물의 거룩 상태를 결과적으로 유지하는 성경적 용례
