    issue: 각주 a가 본문과 동일한 낱말을 대안으로 제시합니다.
    rationale: 본문이 이미 ‘향로들’인데 각주가 ‘또는 향로들’이라고 하므로 lexical_alternative 기능을 수행하지 못합니다. 가능한 대안인 ‘화로들’을 제시해야 합니다.
