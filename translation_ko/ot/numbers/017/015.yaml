  to: 그러자 아론은 회막 어귀에 있는 모세에게 돌아왔고, 그 재앙은 그쳤습니다.[a]
  rationale: 원문의 אֹהֶל מוֹעֵד를 정확한 한국어 성서 용어인 ‘회막’으로 바로잡고, 아론이 회막 어귀에 있는 모세에게 돌아왔다는 통사 관계를 명확히 했습니다. 재앙의 중단은 행위자를 명시하지 않는 원문을 따라 ‘그쳤습니다’로 유지했으며, 각주도 해당 술어에 연결하고 부정확한 상(相) 대안을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:49Z'
