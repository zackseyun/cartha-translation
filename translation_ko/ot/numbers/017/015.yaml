  source_fidelity: ‘증거의 장막’은 אֹהֶל הָעֵדוּת(증거의 장막)에 해당하는 표현이지, 본문의 אֹהֶל מוֹעֵד(만남/회합의 장막)에 대한 정확한 번역은 아닙니다. 또한 원문은 아론이 모세에게 돌아오되 두 사람이 회막 어귀에 있음을 말하므로, 한국어에서도 그 장소 관계를 분명히 하는 것이 좋습니다. נֶעֱצָרָה의 행위자 비명시는 보존되었습니다.
  naturalness: ‘회막 어귀에 있는 모세에게 돌아왔고’는 장소와 도착점을 자연스럽고 분명하게 연결합니다. ‘그 재앙은 그쳤습니다’는 현대 표준어 합쇼체로 자연스럽고, 본문의 수동적·비행위자 표지를 과도하게 해석하지 않습니다.
  terminology: אֹהֶל מוֹעֵד는 한국어 성서 용례와 원어 의미에 맞게 ‘회막’으로 고쳤습니다. מַגֵּפָה는 문맥상 ‘재앙’으로 유지할 수 있습니다. 각주 표지는 대안이 적용되는 ‘그쳤습니다’에 붙여야 합니다.
  issues:
