base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
  footnotes:
  - marker: a
    text: Or 'was stopped,' 'was restrained,' or 'was checked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아론은 회막 어귀에 있는 모세에게 돌아왔고, 그 재앙은 그쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멈추었다’, ‘제지되었다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Then Aaron returned
  chosen_korean: 그러자 아론이 … 돌아왔고
  alternatives_korean:
  - 그리고 아론이 돌아왔고
  - 그리하여 아론이 돌아왔고
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어 서사에 자연스럽게 옮기기 위해 ‘그러자’로 순서를 살리고, שׁוּב는 공간적 ‘돌아오다’로 옮겼습니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 증거의 장막 어귀에서
  alternatives_korean:
  - 회막 어귀에서
  - 증거의 장막 입구에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 관용적으로 ‘증거의 장막’으로 옮기고, פֶּתַח는 ‘어귀’로 처리해 장소 표현의 간결함과 성막 용어의 일관성을 살렸습니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 전염병
  - 그 염병
  lexicon: HALOT
  rationale: 문맥상 여호와의 징계로 임한 מאַגֵּפָה는 단순 의학적 질병보다 ‘재앙’이 더 넓고 정확하게 대응하며, 한국어 독자가 즉시 심판적 사건으로 이해하도록 돕습니다.
- source_word: נֶעֱצָרָה
  english_pob_choice: was stopped
  chosen_korean: 멈추었습니다
  alternatives_korean:
  - 중지되었습니다
  - 그쳤습니다
  - 제지되었습니다
  lexicon: HALOT
  rationale: נֶעֱצָרָה는 수동형으로 ‘멈추다/그치다’의 의미를 가지므로, 원문의 직접성을 살려 ‘멈추었습니다’로 옮겼습니다.
theological_decisions:
- issue: 재앙의 중단에서의 행위자 표지
  chosen_reading: 히브리어의 수동형을 따라 행위자를 드러내지 않고 ‘그 재앙은 멈추었습니다’로 옮겼습니다.
  alternative_readings:
  - 여호와께서 그 재앙을 멈추셨습니다
  - 그 재앙이 제지되었습니다
  rationale: 본문은 이 절에서 행위자를 명시하지 않으므로, 문맥상 하나님의 개입이 암시되더라도 번역문은 본문의 절제된 표현을 보존하는 편이 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문이 말하지 않는 주어를 보충하지 않음'
