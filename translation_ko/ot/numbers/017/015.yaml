    rationale: 각주는 נֶעֱצָרָה를 옮긴 술어에 직접 붙여야 합니다. ‘그쳐 있었다’는 완료/상태 해석을 추가하는 표현이므로 어휘 대안 목록에서 제외하는 것이 안전합니다.
  revised_text: 그러자 아론은 회막 어귀에 있는 모세에게 돌아왔고, 그 재앙은 그쳤습니다.[a]
