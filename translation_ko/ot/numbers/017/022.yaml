  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
  footnotes:
  - marker: a
    text: Or 'the rods.' The Hebrew מַטּוֹת refers here to the physical staffs representing the tribes.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the tabernacle of the testimony.' Literally, 'in the tent of the testimony.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼 앞에 증거의 장막 안에 그 막대기들을 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지팡이들’. 히브리어 מַטּוֹת는 여기서 지파를 대표하는 물리적 막대기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘증거의 성막 안에’. 직역하면 ‘증거의 장막 안에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  english_pob_choice: placed
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 내려놓았습니다
  - 두어 놓았습니다
  lexicon: HALOT
  rationale: 서술맥락의 동작을 자연스러운 현대 한국어로 옮기되, 단순한 ‘놓다’보다 의도적으로 자리에 두는 느낌을 살렸습니다.
- source_word: הַמַּטֹּת
  english_pob_choice: the staffs
  chosen_korean: 그 막대기들
  alternatives_korean:
  - 그 지팡이들
  - 그 지팡이 막대들
  - 그 막대들
  lexicon: HALOT
  rationale: 여기서는 지파를 대표하는 물리적 표지물이므로, 본문이 요구하는 구체성을 살려 ‘막대기들’로 옮겼습니다. ‘지팡이들’도 가능하지만 한국어에서는 약간 생활물품처럼 들릴 수 있습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 면전에
  - 앞에서
  lexicon: HALOT
  rationale: ‘before’의 공간적·예배적 의미를 한국어에서 가장 간명하게 드러내는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유신명은 전통적 대체어 ‘주님’이 아니라 음역형 ‘야훼’로 유지해 원문이 드러내는 언약적 고유성을 보존했습니다.
- source_word: בְּאֹהֶל הָעֵדֻת
  english_pob_choice: in the tent of the testimony
  chosen_korean: 증거의 장막 안에
  alternatives_korean:
  - 증거의 성막 안에
  - 증거의 천막 안에
  - 증거막 안에
  lexicon: HALOT
  rationale: ‘tent’의 직역성을 살리되 한국어 표현은 자연스럽게 정리했습니다. ‘증거의 장막’은 원문의 직결어휘를 유지하면서도 충분히 읽힙니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 고유신명은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주’ 또는 ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 본문이 직접 고유신명을 사용하므로, 제목어 대체보다 이름 자체를 보존하는 편이 출처 충실성과 신학적 구분을 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
