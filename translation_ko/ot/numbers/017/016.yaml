lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 이르셨습니다'
  lexicon: HALOT
  rationale: 와우 연속형이 서술의 진행을 이끄는 기능을 살려, 자연스러운 서사 연결어인 ‘그때’로 옮겼습니다. ‘말씀하셨습니다’는 단순한 ‘말하다’보다 하나님 말씀의 공적·권위적 성격을 더 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 대신 쓰는 칭호가 아니라 신명기적 언약명 יְהוָה 자체이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향해
  - 모세에게로
  lexicon: HALOT
  rationale: אֶל의 방향성을 한국어 조사 ‘-에게’로 자연스럽게 반영했습니다. 고유명사 모세는 통용 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: —
  alternatives_korean:
  - 말하여 이르시되
  - 이르시기를
  lexicon: HALOT
  rationale: 직접화법 도입 공식이지만, 한국어에서는 앞의 ‘말씀하셨습니다’가 이미 이를 충분히 담으므로 중복을 피했습니다.
theological_decisions:
- issue: 여호와/주를 대체하는 하나님의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 יְהוָה는 호칭이 아니라 고유한 언약명입니다. 따라서 전통적 대체어 ‘주’보다 음역 ‘야훼’를 유지해 원문이 드러내는 신적 자기계시를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
