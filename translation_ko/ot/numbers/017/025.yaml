  source_fidelity: 개정이 필요합니다. ‘증거물’은 히브리어 הָעֵדוּת(‘그 증거’)를 하나의 일반 물건처럼 가리키게 하며, 본문의 성막 용어를 부정확하게 좁힙니다. 또한 마지막을 ‘하려는 것이다’로 처리하면 야훼의 명령이 해설적 진술로 바뀌고, וּתְכַל의 명령/결과적 힘이 약화됩니다.
  naturalness: ‘반역의 아들들’과 ‘그들의 나에 대한 불평’은 현대 표준 한국어에서 부자연스럽습니다. 각각 ‘반역하는 자들’과 ‘나를 향한 그들의 불평’이 자연스럽고 문맥상 의미를 보존합니다. 명령문의 병렬도 직접적인 합쇼체 명령으로 유지하는 편이 낫습니다.
  terminology: ‘야훼’, ‘아론’, ‘지팡이’, ‘표징’은 적절합니다. הָעֵדוּת는 본문에서는 ‘증거’로 간결하게 옮기고, 성막의 언약 증거와 관련된 표현임을 주석으로 보완합니다. לִבְנֵי מֶרִי는 한국어에서 문자 그대로 ‘아들들’이라 하면 혈통 의미로 오해될 수 있으므로 관용적 의미인 ‘반역하는 자들’로 옮깁니다.
