id: NUM.17.25
reference: Numbers 17:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
  footnotes:
  - marker: a
    text: Or “for the rebels” or “for the rebellious sons.”
    reason: lexical_alternative
  - marker: b
    text: “The testimony” likely refers to the covenant testimony associated with the ark; the Hebrew expression is kept concise here.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. 「아론의 지팡이를 증거물 앞에 다시 가져다 두어라. 그것을 반역의 아들들을 위한 표징으로 보존하여, 그들의 나에 대한 불평을 그치게 하여 그들이 죽지 않게 하려는 것이다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 언약 이름을 일반 명칭으로 완화하지 않고 프로젝트 기본값대로 음역해, מקור의 고유한 신명성을 드러냈습니다.
- source_word: הָשֵׁב אֶת מַטֵּה אַהֲרֹן
  english_pob_choice: Put Aaron’s staff back
  chosen_korean: 아론의 지팡이를 다시 가져다 두어라
  alternatives_korean:
  - 아론의 지팡이를 돌려놓아라
  - 아론의 지팡이를 되돌려 놓아라
  lexicon: HALOT
  rationale: הָשֵׁב의 ‘되돌리다/다시 두다’라는 뜻을 살리되, 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: לִפְנֵי הָעֵדוּת
  english_pob_choice: before the testimony
  chosen_korean: 증거물 앞에
  alternatives_korean:
  - 증거 앞에
  - 증언 앞에
  - 언약 증거 앞에
  lexicon: HALOT
  rationale: 성막 문맥의 עֵדוּת를 직역적으로만 풀지 않고, 본문이 가리키는 성막 안의 증거물/증거판을 가리키는 간결한 표현으로 옮겼습니다.
- source_word: לִבְנֵי מֶרִי
  english_pob_choice: for the sons of rebellion
  chosen_korean: 반역의 아들들을 위한
  alternatives_korean:
  - 반역한 자들을 위한
  - 반역의 자손들을 위한
  - 반역자들을 위한
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’이라는 표지를 유지해 원문의 강한 관용구를 보존했습니다. 보다 자연스러운 의미는 본문 안에서 완전히 평탄화하지 않고 footnote 없이도 읽히도록 최소한으로 다듬었습니다.
- source_word: תְּלוּנֹּתָם מֵעָלַי
  english_pob_choice: their grumblings against me
  chosen_korean: 그들의 나에 대한 불평
  alternatives_korean:
  - 그들의 나를 향한 원망
  - 그들의 나에 대한 원망
  - 그들의 불평
  lexicon: HALOT
  rationale: תְּלוּנֹּת은 반복되는 광야 본문의 ‘불평/원망’의 뉘앙스를 살리면서, מֵעָלַי의 방향성을 한국어 전치사구로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 드러낼지
  chosen_reading: 주님으로 바꾸지 않고 야훼로 직역성 있게 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 예언적/직설적 신명 사용이므로, 언약 이름을 익숙한 대체어로 희석하지 않는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה / YHWH → 야훼
