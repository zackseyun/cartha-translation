    rationale: 원문은 ‘그 조상 집안에 따른 그들의 모든 지도자에게서’ 지팡이 열두 개를 취하라고 합니다. 초안의 두 ‘곧’ 구문은 이를 동격 설명처럼 처리하고 문장을 비문에 가깝게 만듭니다.
  revised_text: 이스라엘 자손에게 말하십시오. 그들에게서, 그 조상 집안마다 지팡이 하나씩, 곧 그 조상 집안에 따른 그들의 모든 지도자에게서 지팡이 열두 개를 가져오십시오. 각 사람의 이름을 각자의 지팡이에 쓰십시오.
