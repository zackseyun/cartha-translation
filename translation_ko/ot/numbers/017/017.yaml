  verdict: revise
  source_fidelity: 현 초안의 ‘가져오게 하십시오’는 히브리어 וְקַח(‘당신이 가져오십시오’)을 ‘그들이 가져오게 하라’로 바꾸므로 행위의 주체가 달라집니다. 또한 ‘곧 그들의 지도자들, 곧 그들의 조상 집안에서 열두 지팡이입니다’는 מֵאֵת כָּל־נְשִׂיאֵיהֶם לְבֵית אֲבֹתָם שְׁנֵים עָשָׂר מַטּוֹת의 ‘그 조상 집안에 따른 그들의 모든 지도자에게서 … 열두 지팡이’를 정확히 재현하지 못합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, 명령의 대상과 지팡이를 내놓는 이들을 명료하게 연결합니다. ‘각자의 지팡이’는 히브리어의 분배적 단수 ‘그의 지팡이’를 자연스러운 한국어로 나타냅니다.
  terminology: ‘이스라엘 자손’, ‘조상 집안’, ‘지도자’, ‘지팡이’는 각각 בְּנֵי יִשְׂרָאֵל, בֵית אָב/בֵית אֲבֹת, נְשִׂיאִים, מַטֶּה에 적절합니다. ‘조상 집안’은 혈연·씨족 기반의 단위를 보존하며, ‘지도자’는 왕족을 뜻할 수 있는 표현을 피합니다.
  issues:
