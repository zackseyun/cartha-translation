id: NUM.17.17
reference: Numbers 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'rod.' The Hebrew מַטֶּה can mean a staff or rod; here a physical staff is intended.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여, 그들의 조상 집안마다 하나씩 지팡이를 가져오게 하십시오. 곧 그들의 지도자들, 곧 그들의 조상 집안에서 열두 지팡이입니다. 각 사람의 이름을 그 지팡이 위에 써야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살리면서도 한국어 성경 문맥에서 자연스러운 표현으로 옮겼습니다. 영어 POB의 남성-직역성을 그대로 따르기보다 한국어에서 이미 굳어진 대응어를 사용했습니다.
- source_word: מַטֶּה
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 막대
  lexicon: HALOT
  rationale: 문맥상 이름이 적히고 뒤에 싹이 나는 실제 물건이므로, 추상적인 ‘지파’가 아니라 물리적 도구를 드러내는 표현이 필요했습니다. 한국어에서는 이 경우 ‘지팡이’가 가장 자연스럽습니다.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  english_pob_choice: one staff for each father's house
  chosen_korean: 조상 집안마다 하나씩 지팡이
  alternatives_korean:
  - 아버지의 집안마다 지팡이 하나씩
  - 각 조상 집안마다 하나의 지팡이
  lexicon: HALOT
  rationale: 반복된 מַטֶּה의 분배적 의미를 한국어의 ‘마다 하나씩’으로 살렸습니다. בֵּית אָב은 혈연·씨족 단위를 가리키므로 ‘조상 집안’이 문맥을 가장 잘 보존합니다.
- source_word: נְשִׂיאֵיהֶם / לְבֵית אֲבֹתָם
  english_pob_choice: their leaders ... according to their fathers' houses
  chosen_korean: 그들의 지도자들, 곧 그들의 조상 집안
  alternatives_korean:
  - 그들의 우두머리들, 곧 그들의 조상 집안
  - 그들의 지도자들, 곧 그들의 족장 집안
  lexicon: HALOT
  rationale: נָשִׂיא는 왕족보다 지파/씨족의 지도자를 뜻하므로 ‘지도자들’이 가장 안전합니다. 뒤의 ‘곧’은 영어 POB의 설명 구조를 따라 동일한 범주를 풀어 주는 역할을 합니다.
- source_word: אִישׁ אֶת שְׁמ֔וֹ תִּכְתֹּב
  english_pob_choice: Each man's name you shall write
  chosen_korean: 각 사람의 이름을 그 지팡이 위에 써야 합니다
  alternatives_korean:
  - 각 사람의 이름을 써야 합니다
  - 각 남자의 이름을 그 지팡이에 써야 합니다
  lexicon: HALOT
  rationale: 분배적 אִישׁ을 ‘각 사람’으로 옮겨 한 사람당 한 이름이라는 구조를 드러냈습니다. 동사는 명령형의 직접성을 살리되, 한국어 문장 자연성을 위해 ‘써야 합니다’로 정리했습니다.
theological_decisions:
- issue: 씨족/가문 구조를 어떻게 드러낼 것인가
  chosen_reading: ‘조상 집안’으로 옮겨 이 본문이 개인이 아니라 혈연적·대표적 단위를 다루고 있음을 드러냈습니다.
  alternative_readings:
  - 가문
  - 족속
  - 아버지 집
  rationale: 이 장면은 지파 사이의 대표성 확인을 위한 표지 선택이므로, ‘조상 집안’이 신학적·사회적 구조를 가장 투명하게 보여 줍니다.
  doctrine_reference: 민수기 17장의 지팡이 시험은 여호와께서 정하신 대표권과 선택을 공적으로 드러내는 서사입니다.
