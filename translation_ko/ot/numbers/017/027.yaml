  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Behold'; an exclamation of alarm.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew uses two different verbs in sequence: ''we are dying'' (גוע) and ''we are perishing'' (אבד), heightening the people''s panic.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 모세에게 말했습니다. 「아, 우리는 죽게 되었습니다! 우리는 망했습니다! 우리 모두가 망했습니다!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어 관용구로, ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֵן은 여기서 주의를 끄는 감탄사로 쓰였습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 서로 다른 두 동사—‘죽다/숨이 끊어지다’(גוע)와 ‘망하다/멸망하다’(אבד)—를 연속으로 써서 절박함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 집단 정체성을 드러내되, 한국어에서는 가장 자연스럽고 성경적인 표현인 ‘자손’으로 옮겨 원문 투명성을 살렸습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 아
  alternatives_korean:
  - 보십시오
  - 보라
  - 이보십시오
  lexicon: HALOT
  rationale: 여기서는 단순한 지시보다 공포가 섞인 탄식에 가깝기 때문에, 현대 한국어에서 즉각적인 비명·탄식의 뉘앙스를 주는 감탄사로 처리했습니다.
- source_word: גָּוַעְנוּ
  english_pob_choice: we are dying
  chosen_korean: 우리는 죽게 되었습니다
  alternatives_korean:
  - 우리는 죽어 가고 있습니다
  - 우리는 숨이 끊어지고 있습니다
  lexicon: HALOT
  rationale: גוע의 종말적 죽음 이미지를 살리면서, 현재 진행형의 위기감과 한국어의 자연스러움을 함께 반영했습니다.
- source_word: אָבַדְנוּ / אָבָדְנוּ־
  english_pob_choice: we are perishing / All of us are perishing
  chosen_korean: 우리는 망했습니다 / 우리 모두가 망했습니다
  alternatives_korean:
  - 우리는 멸망하고 있습니다
  - 우리는 파멸했습니다 / 우리 모두가 파멸했습니다
  lexicon: HALOT
  rationale: אבד의 멸망·파멸 의미를 직설적으로 살리되, 앞뒤 반복을 유지해 히브리어의 절박한 중첩을 드러냈습니다.
theological_decisions:
- issue: 반복된 두 동사(גוע, אבד)를 어떻게 구분할지
  chosen_reading: ‘죽게 되었습니다’와 ‘망했습니다’를 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘죽었습니다’로 평준화
  - 둘 다 ‘멸망했습니다’로 평준화
  rationale: 원문은 서로 다른 동사를 연달아 사용해 공포를 증폭하므로, 한국어에서도 의미 차이를 보존해야 합니다.
  doctrine_reference: 본문의 수사적 강조와 어휘 대비를 보존하는 번역 원칙
