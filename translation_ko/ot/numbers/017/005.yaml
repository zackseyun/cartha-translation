  lexicon: HALOT
  rationale: 제사 규례 문맥에서는 단순한 ‘기억’보다 어떤 경고적 표지를 남기는 ‘기념’이 מקור의 기념/경고 기능을 더 잘 드러냅니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the children of Israel
  chosen_korean: 이스라엘 자손을 위한
  alternatives_korean:
  - 이스라엘 사람들을 위한
  - 이스라엘의 자손을 위한
  lexicon: HALOT
  rationale: 언약적·족속적 표현을 살리면서도 현대 한국어에서 자연스럽게 읽히는 형태로 옮겼습니다.
- source_word: אִישׁ זָר
  english_pob_choice: outsider
  chosen_korean: 다른 사람
  alternatives_korean:
  - 외인
  - 무자격자
  - 낯선 사람
  lexicon: HALOT
  rationale: 문맥상 혈통이 아니라 제사직에 대한 무자격 접근을 가리키므로, 민족적 ‘외국인’ 오해를 피하면서도 제한성을 드러내는 표현을 택했습니다.
- source_word: לְהַקְטִיר קְטֹרֶת
  english_pob_choice: to burn incense
  chosen_korean: 분향하려고
  alternatives_korean:
  - 향을 피우려고
  - 향을 사르려고
  lexicon: HALOT
  rationale: 제의적 행위를 한국어 성경 문체에서 자연스럽게 드러내는 표준 표현입니다.
- source_word: כְקֹרַח וְכַעֲדָתוֹ
  english_pob_choice: like Korah and like his congregation
  chosen_korean: 고라와 그의 무리처럼
  alternatives_korean:
  - 고라와 그의 회중처럼
  - 고라와 그의 집단처럼
  lexicon: HALOT
  rationale: עֲדָה를 여기서는 단순한 교회적 ‘회중’보다 사건 문맥에 맞는 ‘무리’로 옮겨, 고라 사건의 집단적 반역과 심판을 자연스럽게 전달했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개성을 살리되, 한국어에서는 ‘통해’가 가장 자연스럽고 명료하므로 그렇게 옮겼습니다.
