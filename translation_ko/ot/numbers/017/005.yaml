revisions:
- from: 이스라엘 자손을 위한 기념이 되어서, 아론의 씨에서 난 사람이 아닌 다른 사람은 누구도 야훼 앞에서 분향하려고 가까이 오지 못하고, 또 그가 고라와 그의 무리처럼 되지 않게 하려는 것입니다. 이는 야훼께서 모세의 손을 통해 그에게 말씀하신 것입니다.[a][b][c][d]
  to: 이는 이스라엘 자손을 위한 기념물[a]이 되어, 아론의 자손이 아닌 외부인[b]은 아무도 야훼 앞에 향을 피우려고 가까이 오지 못하게 하고, 그가 고라와 그의 무리처럼 되지 못하게 하려는 것이며, 야훼께서 모세를 통하여[c] 그에게[d] 말씀하신 대로입니다.
  rationale: 원문의 목적 구문과 마지막 비교·일치 구문을 보존하도록 문장을 재구성했습니다. 제사 직무상 무자격을 가리키는 זָר의 의미는 본문에서 ‘외부인’으로 간결하게 표현하고, 과도한 해석을 피하면서 각주에서 범위를 명시했습니다. 논쟁 가능한 마지막 대명사의 선행사는 번역문에서 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:54Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘다른 사람’은 אִישׁ זָר의 제사 직무상 배제 의미를 충분히 드러내지 못하며, ‘아론의 씨에서 난 사람’도 현대 표준어에서는 ‘아론의 자손’이 더 자연스럽습니다. 또한 ‘이는 … 말씀하신 것입니다’는 히브리어의 ‘… 말씀하신 대로’라는 비교·일치 구문을 평서적 설명으로 바꿉니다.
  naturalness: ‘기념물이 되어’, ‘아론의 자손이 아닌 외부인’, ‘향을 피우려고 가까이 오다’, ‘모세를 통하여’는 현대 한국어의 격식 있는 성경 번역 문체로 자연스럽습니다. ‘외부인’은 단독으로는 범위가 넓을 수 있으므로 각주에서 제사 직무의 무자격자라는 뜻을 밝혔습니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. זִכָּרוֹן은 물리적 표지의 결과를 가리키므로 ‘기념물’로, עֵדָה는 본문 사건 문맥에 맞게 ‘무리’로 옮겼습니다. 마지막 לֹו의 선행사는 확정되지 않으므로 본문의 ‘그에게’를 유지하고 각주에서 아론을 가리킬 가능성만 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘다른 사람’이 אִישׁ זָר의 직무상 배제 의미를 약하게 전달합니다.
    rationale: 이 단어는 단순히 ‘다른 사람’이라는 대조가 아니라, 아론 계열 제사장에게 허락된 분향에 접근할 권한이 없는 사람을 가리킵니다.
  - severity: medium
    issue: ‘이는 야훼께서 … 말씀하신 것입니다’가 כַּאֲשֶׁר דִּבֶּר의 기능을 바꿉니다.
    rationale: 히브리어는 앞의 조치가 야훼께서 모세를 매개로 그에게 말씀하신 내용과 일치함을 나타내므로 ‘말씀하신 대로입니다’가 더 충실합니다.
