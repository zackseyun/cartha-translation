id: NUM.17.5
reference: Numbers 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
  footnotes:
  - marker: a
    text: Or 'memorial' or 'remembrance.'
    reason: lexical_alternative
  - marker: b
    text: '''Outsider'' here means a person unauthorized for priestly service, not necessarily a foreigner by ethnicity.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'by the hand of Moses,' an idiom meaning 'through Moses.'
    reason: lexical_alternative
  - marker: d
    text: The final 'to him' likely refers to Aaron.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손을 위한 기념이 되어서, 아론의 씨에서 난 사람이 아닌 다른 사람은 누구도 야훼 앞에서 분향하려고 가까이 오지 못하고, 또 그가 고라와 그의 무리처럼 되지 않게 하려는 것입니다. 이는 야훼께서 모세의 손을 통해 그에게 말씀하신 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기념’은 여기서 단순한 기억보다 경고용 표지/기억의 의미를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다른 사람’은 민족적 외국인이 아니라 제사직에 대한 무자격자를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘모세의 손을 통해’는 히브리어 관용구로, ‘모세를 통해’라는 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 ‘그에게’는 문맥상 아론을 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  english_pob_choice: reminder
  chosen_korean: 기념
  alternatives_korean:
  - 기억
  - 회상
  lexicon: HALOT
  rationale: 제사 규례 문맥에서는 단순한 ‘기억’보다 어떤 경고적 표지를 남기는 ‘기념’이 מקור의 기념/경고 기능을 더 잘 드러냅니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the children of Israel
  chosen_korean: 이스라엘 자손을 위한
  alternatives_korean:
  - 이스라엘 사람들을 위한
  - 이스라엘의 자손을 위한
  lexicon: HALOT
  rationale: 언약적·족속적 표현을 살리면서도 현대 한국어에서 자연스럽게 읽히는 형태로 옮겼습니다.
- source_word: אִישׁ זָר
  english_pob_choice: outsider
  chosen_korean: 다른 사람
  alternatives_korean:
  - 외인
  - 무자격자
  - 낯선 사람
  lexicon: HALOT
  rationale: 문맥상 혈통이 아니라 제사직에 대한 무자격 접근을 가리키므로, 민족적 ‘외국인’ 오해를 피하면서도 제한성을 드러내는 표현을 택했습니다.
- source_word: לְהַקְטִיר קְטֹרֶת
  english_pob_choice: to burn incense
  chosen_korean: 분향하려고
  alternatives_korean:
  - 향을 피우려고
  - 향을 사르려고
  lexicon: HALOT
  rationale: 제의적 행위를 한국어 성경 문체에서 자연스럽게 드러내는 표준 표현입니다.
- source_word: כְקֹרַח וְכַעֲדָתוֹ
  english_pob_choice: like Korah and like his congregation
  chosen_korean: 고라와 그의 무리처럼
  alternatives_korean:
  - 고라와 그의 회중처럼
  - 고라와 그의 집단처럼
  lexicon: HALOT
  rationale: עֲדָה를 여기서는 단순한 교회적 ‘회중’보다 사건 문맥에 맞는 ‘무리’로 옮겨, 고라 사건의 집단적 반역과 심판을 자연스럽게 전달했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개성을 살리되, 한국어에서는 ‘통해’가 가장 자연스럽고 명료하므로 그렇게 옮겼습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 언약명 יהוה를 직접 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘다른 사람’의 범위
  chosen_reading: 제사직에 대한 무자격 접근자
  alternative_readings:
  - 민족적 외국인
  - 일반 신분의 사람
  rationale: 본문의 경고는 혈통적 배제가 아니라 아론의 씨에서 나지 않은 자의 제의적 침입을 금하는 데 있으므로, 신학적 초점을 제사 규정에 맞췄습니다.
  doctrine_reference: Translation philosophy §1, §3
