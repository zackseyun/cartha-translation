  rationale: 이 프로젝트의 기본 원칙에 따라 언약명 יהוה를 직접 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘다른 사람’의 범위
  chosen_reading: 제사직에 대한 무자격 접근자
  alternative_readings:
  - 민족적 외국인
  - 일반 신분의 사람
  rationale: 본문의 경고는 혈통적 배제가 아니라 아론의 씨에서 나지 않은 자의 제의적 침입을 금하는 데 있으므로, 신학적 초점을 제사 규정에 맞췄습니다.
  doctrine_reference: Translation philosophy §1, §3
