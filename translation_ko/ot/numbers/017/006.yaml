  source_fidelity: 히브리어 וַיִּלֹּנוּ는 지도자들을 향한 집단적 불평·항의를 뜻하므로, ‘원망하며’보다 ‘불평하며’가 어휘 의미를 더 직접적으로 반영합니다. מִמָּחֳרָת은 ‘이튿날’로 정확히 옮겼고, אַתֶּם הֲמִתֶּם의 복수 고발과 עַם יְהוָה의 관계 표현도 보존했습니다. 히브리어 접속사 וְ 자체에는 역접 의미가 명시되지 않으므로 본문의 ‘그러나’는 삭제하는 것이 안전합니다.
  naturalness: ‘이튿날 이스라엘 자손의 온 회중이 모세와 아론을 향하여 불평하며 이렇게 말했습니다’는 현대 표준 한국어의 격식 있는 서술에 자연스럽습니다. 직접 인용 안의 ‘당신들은’은 원문의 대면적이고 고발적인 복수 2인칭을 적절히 드러냅니다.
  terminology: ‘이스라엘 자손’, ‘회중’, ‘야훼’는 프로젝트의 용어 방침 및 원문의 표현을 충실히 반영합니다. 각주 표지는 해당 어구 바로 뒤에 배치하여 참조 대상을 명확히 했습니다.
