  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of Israel.'' Many English versions render this more idiomatically as ''Israelites'' or ''people of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 다음 날 이스라엘 자손의 온 회중이 모세와 아론을 향하여 원망하며 말했습니다. 「당신들은 야훼의 백성을 죽였습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이스라엘 자손’은 관용적으로 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하나님의 이름 YHWH는 본문에서 야훼로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  english_pob_choice: grumbled
  chosen_korean: 원망하며
  alternatives_korean:
  - 불평하며
  - 투덜거리며
  lexicon: HALOT
  rationale: 광야 본문에서 지도자들을 향한 집단적 불만과 항의의 뉘앙스를 살리기 위해, 일상적이면서도 불만 섞인 항의를 드러내는 ‘원망하다’를 선택했습니다.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘의 모든 회중
  lexicon: HALOT
  rationale: עֲדָה는 공동체적 집합체를 가리키므로 ‘회중’이 적절하고, בְּנֵי יִשְׂרָאֵל은 직역 구조를 살려 ‘이스라엘 자손’으로 유지했습니다.
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 이튿날
  - 그 다음 날
  lexicon: HALOT
  rationale: 시간 표현을 현대 한국어로 자연스럽게 옮기되, 사건 직후의 연속성을 분명히 하기 위해 간결한 ‘다음 날’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 신명기는 전통적 우회어 대신 학술적 음역 ‘야훼’를 사용해 מקור의 고유한 이름을 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 언약적 호칭
  chosen_reading: ‘야훼의 백성’으로 번역해 하나님의 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘주님의 백성’
  - ‘여호와의 백성’
  rationale: 본문은 יְהוָה를 직접 사용하므로, 신명형 호칭을 가리는 일반 칭호보다 고유명을 드러내는 편이 원문 긴장과 언약적 고소를 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 대화문 인용부호의 화자 거리
  chosen_reading: 직접화법을 따옴표로 분리하고, 고발조의 거친 어조는 유지했습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 더 공손한 문장으로 순화
  rationale: 본문은 백성의 강한 आरोप을 그대로 전달하므로, 한국어에서도 직설적 비난의 힘을 약화시키지 않는 것이 원문의 의도에 부합합니다.
  doctrine_reference: 'Translation philosophy: maintain the source''s accusatory force'
