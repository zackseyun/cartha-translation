lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미는 ‘말하다/말씀하다’이며, 문맥상 서술 진행을 자연스럽게 살리되 지나친 구어체를 피해 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 영어 POB의 신학적 선택을 따르되, 한국어 본문에서는 직접 호칭의 자연스러운 경건체로 ‘주님’을 사용했습니다. 본절은 말하는 주체가 이미 분명하므로, 별도 각주 없이 번역했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 께
  - 한테
  lexicon: HALOT
  rationale: 모세를 향한 방향·대상 표지를 현대 한국어 조사 ‘에게’로 옮겨 자연스러운 문장 구조를 유지했습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 다음과 같이 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 관용적 발화 도입구를 한국어에서는 중복 어색함을 피하면서 직접화법을 예고하는 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 야훼의 직접 발화 도입문이므로, 한국어에서는 예배적·문체적으로 안정된 ‘주님’을 택해 문장의 흐름을 살렸습니다. 다만 이 선택은 원문 고유명사의 표기를 본문에 드러내지 않는 점이 있어, 필요 시 주석에서 설명할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
