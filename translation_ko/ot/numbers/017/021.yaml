  rationale: 아론의 지팡이가 다른 지팡이들과 함께 포함되어 있음을 자연스럽게 드러내는 한국어 표현입니다.
theological_decisions:
- issue: 대표 지팡이들의 배열과 아론의 지팡이 위치
  chosen_reading: 아론의 지팡이는 다른 지팡이들과 함께 모여 있는 가운데 있었다고 옮겼습니다.
  alternative_readings:
  - 아론의 지팡이도 그들과 섞여 있었습니다
  - 아론의 지팡이는 그들 가운데 놓여 있었습니다
  rationale: 본문은 아론의 지팡이가 열두 지팡이와 동일한 대표 표본으로 포함되었음을 강조하므로, 이를 약화시키지 않는 쪽으로 번역했습니다.
  doctrine_reference: 민수기 17장의 표징 서술
