  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads literally 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 이스라엘 자손에게 말하니, 그들의 모든 지도자가 각 지도자 한 사람당 지팡이 하나씩, 곧 그들의 조상의 집에 따라 열두 지팡이를 그에게 주었습니다. 그리고 아론의 지팡이는 그들의 지팡이들 가운데 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역형이며, 이 민족 집단을 가리키는 언약적 표지입니다.
    reason: source_note
