reference: Numbers 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
  footnotes:
  - marker: a
    text: Or 'the firepan.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before the LORD,' that is, from his presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 아론에게 말했습니다. “향로를 가져다가 제단 위의 불을 그것에 담고, 그 위에 향을 놓아, 급히 회중에게 가서 그들을 위해 속죄하십시오. 이는 야훼 앞에서 진노가 나왔고, 재앙이 이미 시작되었기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향로’는 제사장용 불판/화로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼 앞에서’입니다. 이는 그분의 임재 앞에서라는 뜻을 포함합니다.
    reason: source_note
lexical_decisions:
- source_word: הַמַּחְתָּה
  english_pob_choice: the censer
  chosen_korean: 향로
  alternatives_korean:
  - 화로
  - 분향기
  lexicon: HALOT
  rationale: 제사장이 숯과 향을 담아 들고 다니는 기구를 가리키므로, 한국어에서는 제사용 맥락이 분명한 ‘향로’가 가장 자연스럽습니다.
- source_word: וְתֶן עָלֶי/הָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  english_pob_choice: put fire from the altar in it
  chosen_korean: 제단 위의 불을 그것에 담고
  alternatives_korean:
  - 제단에서 불을 그것에 넣고
  - 제단의 불을 그것에 담고
  lexicon: HALOT
  rationale: 불의 출처가 제단임을 살리되, 용기 안에 옮겨 담는 동작을 한국어로 자연스럽게 표현했습니다.
- source_word: וְכַפֵּר עֲלֵיהֶם
  english_pob_choice: make atonement for them
  chosen_korean: 그들을 위해 속죄하십시오
  alternatives_korean:
  - 그들을 위해 속죄해 주십시오
  - 그들을 위해 화목제물을 드리십시오
  lexicon: HALOT
  rationale: 제사장적 כפר의 핵심 기능을 ‘속죄’로 옮기되, 모세가 아론에게 직접 명하는 문맥에 맞게 공손한 명령형을 사용했습니다.
- source_word: מִ/לִּ/פְנֵ֥י יְהוָ֖ה
  english_pob_choice: from before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재 앞에서
  - 야훼 앞에서부터
  lexicon: HALOT
  rationale: 직역의 ‘~앞에서’라는 공간적·임재적 이미지를 유지하면서, 본 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: הֵחֵל הַ/נָּגֶף
  english_pob_choice: the plague has begun
  chosen_korean: 재앙이 이미 시작되었기 때문입니다
  alternatives_korean:
  - 전염병이 이미 시작되었기 때문입니다
  - 염병이 이미 시작되었기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 사람들을 치는 심판성 재난을 가리키므로, 보다 포괄적이면서도 강한 ‘재앙’이 적절합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기를 직접 사용하는 자리이므로, 본 프로젝트의 기본 원칙에 따라 언약명 자체를 보존하는 ‘야훼’를 사용했습니다.
  doctrine_reference: Project default for יהוה / YHWH
- issue: 제사장적 כפר의 번역
  chosen_reading: 속죄하십시오
  alternative_readings:
  - 속죄를 행하십시오
  - 속전하십시오
  rationale: 이 행위는 단순한 중재가 아니라 임박한 진노와 재앙을 멈추게 하는 제의적 속죄 행위이므로, 신학적 긴장을 약화시키지 않는 ‘속죄’가 가장 적절합니다.
  doctrine_reference: HALOT priestly כפר usage
