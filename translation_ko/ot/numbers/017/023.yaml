  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
  footnotes:
  - marker: a
    text: Or 'the tent of witness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for the house of Levi,' that is, representing the tribe/clan of Levi.
    reason: cultural_note
translation:
  language: ko
  text: 이튿날 모세가 증거의 성막[a]에 들어갔더니, 보십시오, 레위 집을 위한 아론의 지팡이[b]에 싹이 났고, 꽃망울이 맺히고, 꽃이 피고, 아몬드가 익었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증언의 성막’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘레위 집을 위한’, 곧 레위 지파/가문을 대표하는 지팡이라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 이튿날
  - 다음 날에
  lexicon: HALOT
  rationale: 이 표현은 앞선 사건의 바로 다음 시점을 가리키므로, 현대 한국어에서 자연스러운 ‘다음 날’로 옮겼습니다.
- source_word: אֹהֶל הָעֵדוּת
  english_pob_choice: the tent of the testimony
  chosen_korean: 증거의 성막
  alternatives_korean:
  - 증언의 성막
  - 증거의 천막
  - 증거궤의 성막
  lexicon: HALOT
  rationale: 고정된 성막 명칭으로서 ‘성막’을 쓰고, עֵדוּת는 법적·언약적 뉘앙스를 살려 ‘증거’로 옮겼습니다. 'tent of witness'보다 직접적 대응을 택했습니다.
- source_word: פָּרַח / וַיֹּצֵא פֶרַח / וַיָּצֵץ צִיץ
  english_pob_choice: had budded / brought forth blossoms / produced flowers
  chosen_korean: 싹이 나고, 꽃을 피우고
  alternatives_korean:
  - 눈이 트고, 꽃이 피고
  - 싹이 돋고, 꽃망울을 맺고
  - 꽃봉오리가 맺히고, 꽃이 피고
  lexicon: HALOT
  rationale: 히브리어의 성장 단계를 연속적으로 보여 주므로, 첫 단계는 ‘싹이 나다’, 다음 단계는 ‘꽃을 피우다’로 옮겨 반복되는 생장 이미지를 자연스럽게 살렸습니다.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  english_pob_choice: ripened almonds
  chosen_korean: 아몬드가 익었습니다
  alternatives_korean:
  - 익은 아몬드가 맺혔습니다
  - 아몬드 열매가 익었습니다
  - 아몬드가 열렸습니다
  lexicon: HALOT
  rationale: גמל은 단순 발생이 아니라 성숙·결실의 의미를 담으므로, 최종 단계의 기적을 드러내기 위해 ‘익었습니다’로 옮겼습니다.
- source_word: לְבֵית לֵוִי
  english_pob_choice: for the house of Levi
  chosen_korean: 레위 집을 위한
  alternatives_korean:
  - 레위의 집을 위한
  - 레위 가문을 위한
  - 레위 지파를 대표하는
  lexicon: HALOT
  rationale: 문자적으로는 ‘레위 집을 위한’이지만, 문맥상 아론의 지팡이가 레위 지파를 대표함을 보여 주므로 그 의미를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 기적의 연속적 성장 묘사
  chosen_reading: 지팡이가 싹이 나고, 꽃을 피우고, 아몬드가 익는다는 연쇄를 그대로 살려 하나님의 표징으로 읽히도록 했습니다.
  alternative_readings:
  - 단순히 ‘꽃이 피었습니다’로 축약
  - 자연스럽게 자랐습니다로 완화
  rationale: 본문은 죽은 지팡이의 비상식적 생장을 단계적으로 강조하므로, 그 긴장을 약화하지 않고 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 민수기 17장의 아론 제사장직 확인 표징
- issue: 레위 집의 대표성
  chosen_reading: ‘레위 집을 위한’으로 옮겨, 지팡이가 한 인물을 넘어 레위 지파 전체를 대표하는 표지임을 드러냈습니다.
  alternative_readings:
  - 레위의 집에 속한
  - 레위 가문의
  rationale: 히브리어 전치사 לְ는 단순 소유보다 대표·귀속의 기능을 담을 수 있어, 문맥상 공동체 대표성을 살리는 번역이 필요합니다.
  doctrine_reference: 민수기 17장의 지파 대표 표징
