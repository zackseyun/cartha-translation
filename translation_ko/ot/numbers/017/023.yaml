  naturalness: ‘보십시오’는 וְהִנֵּה의 주목·놀람의 기능을 합쇼체로 자연스럽게 살립니다. 다만 ‘싹이 나고, 꽃을 피우고, 아몬드가 익었습니다’는 세 단계만 제시하므로, ‘꽃망울이 맺히고’와 ‘꽃이 피고’를 구분하여 원문의 점층성을 자연스럽게 드러내는 편이 좋습니다.
