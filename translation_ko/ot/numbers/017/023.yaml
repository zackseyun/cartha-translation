revisions:
- from: 다음 날 모세가 증거의 성막으로 들어갔는데, 보십시오, 아론의 지팡이, 곧 레위 집을 위한 지팡이가 싹이 나고, 꽃을 피우고, 아몬드가 익었습니다.[a][b]
  to: 이튿날 모세가 증거의 성막[a]에 들어갔더니, 보십시오, 레위 집을 위한 아론의 지팡이[b]에 싹이 났고, 꽃망울이 맺히고, 꽃이 피고, 아몬드가 익었습니다.
