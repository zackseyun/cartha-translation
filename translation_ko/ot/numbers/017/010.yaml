translation:
  language: ko
  text: “이 회중[a] 가운데서 떠나십시오. 그러면 내가 그들을 순식간에[b] 멸하겠습니다.” 그들은 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 집회 가운데서 분리되십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘순간에 멸하겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  english_pob_choice: Rise up
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 일어나십시오
  - 분리되십시오
  - 물러나십시오
  lexicon: HALOT
  rationale: 히브리어는 단순한 기립보다 회중 가운데에서의 분리를 요구하는 명령이므로, 한국어로는 관계적·공간적 분리를 직접 드러내는 ‘떠나십시오’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: מִתּוֹךְ הָעֵדָה הַזֹּאת
  english_pob_choice: from the midst of this congregation
  chosen_korean: 이 회중
  alternatives_korean:
  - 이 회중 가운데서
  - 이 모임 가운데서
  - 이 집회 가운데서
  lexicon: HALOT
  rationale: ‘회중’은 העדה의 공동체적 의미를 살리면서도 한국어 성경 문맥에서 자연스럽고, ‘가운데서’는 앞의 동사 ‘떠나십시오’에 포함시켜 중복을 피했습니다.
- source_word: וַאֲכַלֶּה אֹתָם כְּרָגַע
  english_pob_choice: so that I may consume them in a moment
  chosen_korean: 그러면 내가 그들을 순식간에 멸하겠습니다
  alternatives_korean:
  - 그러면 내가 그들을 한순간에 끝내겠습니다
  - 그러면 내가 그들을 즉시 없애겠습니다
  - 그러면 내가 그들을 순식간에 삼키겠습니다
  lexicon: HALOT
  rationale: כלה의 심판적 의미를 한국어로는 ‘멸하다’가 가장 직접적으로 드러내며, כְּרָגַע는 ‘순식간에’로 옮겨 긴박성과 즉시성을 살렸습니다.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  english_pob_choice: And they fell on their faces
  chosen_korean: 그들은 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 그들은 얼굴을 땅에 대었습니다
  - 그들은 엎드렸습니다
  - 그들은 얼굴을 땅에 대고 엎드렸습니다
  lexicon: HALOT
  rationale: ‘얼굴을 땅에 대고 엎드리다’는 성경적 관용구를 한국어로 자연스럽게 풀되, 원문의 prostration 이미지를 유지합니다.
theological_decisions:
- issue: 하나님의 즉각적 심판 경고의 강도
  chosen_reading: 명령과 심판 의도를 완화하지 않고, 즉각적 멸망의 위협을 분명하게 드러냈습니다.
  alternative_readings:
  - ‘물러나십시오’처럼 완곡하게 표현하기
  - ‘없애겠습니다’처럼 덜 심판적인 어휘로 바꾸기
  rationale: 본문은 모세와 아론에게 공동체를 떠나라고 명하고, 곧바로 그들을 짧은 순간에 멸하겠다는 뜻을 말하므로, 경고의 급박성과 엄중함을 보존해야 합니다.
  doctrine_reference: 하나님의 거룩함과 심판의 즉시성
