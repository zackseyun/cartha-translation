id: NUM.17.19
reference: Numbers 17:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
  footnotes:
  - marker: a
    text: Or 'before the covenant witness'; 'the testimony' likely refers to the covenant testimony associated with the tablets in the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'where I make myself known to you' or 'where I appoint to meet with you.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그것들을 회막 안, 증거 앞에 두십시오. 거기서 내가 여러분을 만나겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약의 증거 앞에’로 옮길 수 있습니다. הָעֵדוּת는 성막 안의 언약 증거를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 너희와 만나도록 정하는 곳’ 또는 ‘내가 너희에게 나 자신을 나타내는 곳’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  english_pob_choice: And you shall place them
  chosen_korean: 그것들을 두십시오
  alternatives_korean:
  - 그것들을 놓으십시오
  - 그것들을 배치하십시오
  lexicon: HALOT
  rationale: 히필형의 지시문으로서 물건을 특정 장소에 두게 하는 뜻을 살려, 현대 한국어에서 자연스러운 명령형인 ‘두십시오’를 선택했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막 안
  alternatives_korean:
  - 만남의 장막 안
  - 회막에
  lexicon: HALOT
  rationale: 전통적이면서도 성막을 가리키는 표준 표현인 ‘회막’을 사용해 원문의 제도적 용어를 보존했습니다.
- source_word: לִפְנֵי הָעֵדוּת
  english_pob_choice: before the testimony
  chosen_korean: 증거 앞에
  alternatives_korean:
  - 증언 앞에
  - 증거물 앞에
  lexicon: HALOT
  rationale: הָעֵדוּת를 직역해 ‘증거’로 두어, 원문이 지닌 언약의 증거/증언이라는 중첩된 뉘앙스를 본문에서 과도하게 풀어쓰지 않았습니다.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  english_pob_choice: where I meet with you
  chosen_korean: 거기서 내가 여러분을 만나겠습니다
  alternatives_korean:
  - 거기서 내가 여러분과 만나겠습니다
  - 그곳에서 내가 여러분을 만나겠습니다
  lexicon: HALOT
  rationale: 장소를 가리키는 ‘거기서’와 약속된 만남의 뜻을 살려 자연스럽게 옮겼고, לָכֶם은 한국어에서 ‘~와 함께’보다 직접 목적어/대상을 취하는 표현이 더 자연스러워 ‘여러분을’로 처리했습니다.
theological_decisions:
- issue: הָעֵדוּת의 지시 대상
  chosen_reading: 본문에서는 ‘증거’로 유지하고, 그것이 언약 증거/증언이라는 점은 본문 밖에서 확인하도록 두었습니다.
  alternative_readings:
  - 언약 증거
  - 증언
  rationale: 원문은 지시 대상을 충분히 특정하지 않으므로, 해석을 본문에 미리 주입하지 않고 문맥이 열어 둔 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 말하고, 해석은 주석에서 뒷받침함'
