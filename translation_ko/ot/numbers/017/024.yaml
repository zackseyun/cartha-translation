  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
  footnotes:
  - marker: a
    text: Or 'to all the Israelites.' The Hebrew is literally 'to all the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they saw.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼 앞에서 모든 지팡이를 꺼내어 이스라엘의 모든 자손 앞에 내놓았습니다. 그들이 그것을 보았고, 각 사람이 자기 지팡이를 가져갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא
  english_pob_choice: brought out
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 내어왔습니다
  - 꺼내왔습니다
  lexicon: HALOT
  rationale: 히필형의 사동 의미를 살리면서, 물건을 공적 자리에서 사람들 앞으로 옮겨 오는 흐름을 자연스러운 현대 한국어로 표현했습니다.
- source_word: הַמַּטֹּת
  english_pob_choice: the staffs
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 지팡이들
  lexicon: HALOT
  rationale: 여기서는 제단 앞에 놓였던 실제 막대류를 가리키므로, 문맥상 가장 자연스럽고 이해하기 쉬운 ‘지팡이’를 택했습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from before Yahweh
  chosen_korean: 여호와 앞에서
  alternatives_korean:
  - 여호와의 임재 앞에서
  - 여호와 앞에서부터
  lexicon: HALOT
  rationale: 히브리어의 ‘~앞에서’라는 공간적 관용구를 유지했고, 문맥상 출발점보다 존재 위치를 강조하는 표현으로 옮겼습니다.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손에게로
  alternatives_korean:
  - 이스라엘의 모든 사람들에게
  - 이스라엘 사람들 모두에게
  lexicon: HALOT
  rationale: 직역적인 종족 명칭을 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘에게로’로 도착 방향을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB 본문이 ‘Yahweh’로 읽지만, 이 한국어 초안은 해당 전통적 표기를 그대로 반영해 본문 흐름을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 지팡이/막대의 대상성
  chosen_reading: 지팡이
  alternative_readings:
  - 막대기
  - 막대
  rationale: 이 절은 인물의 표식으로 사용된 물리적 도구를 말하므로, 제도적 ‘지파’ 의미로 오해되지 않도록 사물로 분명히 번역했습니다.
  doctrine_reference: Numbers 17 문맥
