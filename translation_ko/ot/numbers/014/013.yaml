id: NUM.14.13
reference: Numbers 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
  footnotes:
  - marker: a
    text: Or “And the Egyptians have heard, for by your power you brought up this people from among them.” The Hebrew verbal form can be taken as past or as a future/result within Moses’ plea; the main text adopts the forward-looking sense that fits the surrounding argument.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 모세가 야훼께 말씀드렸습니다. “이집트 사람들이 들을 것입니다.[a] 당신께서 당신의 권능으로 이 백성을 그들 가운데서 이끌어 올리셨기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이집트 사람들이 이미 들었습니다.” 히브리어 동사형은 과거로도, 모세의 간구 안에서 미래적 결과를 나타내는 말로도 읽을 수 있습니다. 본문은 이어지는 논증에 맞추어 미래적 결과의 뜻을 택했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל יְהוָה
  english_pob_choice: But Moses said to Yahweh
  chosen_korean: 그러자 모세가 야훼께 말씀드렸습니다
  alternatives_korean:
  - 그리고 모세가 야훼께 말했습니다
  - 하지만 모세가 야훼께 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형은 앞선 하나님의 선언에 대한 모세의 응답을 이어 주므로, 문맥상 전환을 드러내는 ‘그러자’가 가장 자연스럽습니다. 하나님께 드리는 직접 발화이므로 ‘말씀드렸습니다’를 택해 공손한 서술을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 관례적 대체어보다 음역형인 ‘야훼’로 옮겨, 히브리어 מקור의 고유성을 보존했습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 민족을
  alternatives_korean:
  - 이 백성을
  - 이 사람들을
  lexicon: HALOT
  rationale: 히브리어의 단수 집합명사 ‘עם’은 여기서 이스라엘 공동체 전체를 가리키므로, 한국어에서는 집합성과 민족적 범위를 함께 담는 ‘이 민족’을 선택했습니다.
- source_word: בְכֹחֲךָ
  english_pob_choice: by your power
  chosen_korean: 당신의 권능으로
  alternatives_korean:
  - 당신의 힘으로
  - 당신의 능력으로
  lexicon: HALOT
  rationale: 전치사 ב는 수단/근거를 나타내므로 ‘-으로’가 적절합니다. ‘권능’은 하나님의 주권적 능력을 강조하며, 본문의 출애굽적 맥락에 잘 맞습니다.
- source_word: מִקִּרְבּוֹ
  english_pob_choice: from among them
  chosen_korean: 그들 가운데에서
  alternatives_korean:
  - 그들 한가운데에서
  - 그들 속에서
  lexicon: HALOT
  rationale: 지리적 ‘가운데’보다 공동체 내부를 뜻하는 ‘among’을 살리기 위해 ‘그들 가운데에서’로 옮겼습니다. 집합명사 ‘이집트 사람들’과 자연스럽게 대응됩니다.
theological_decisions:
- issue: יהוה를 고유명으로 번역할지, 전통적 호칭으로 바꿀지
  chosen_reading: 본문에는 하나님의 이름을 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 모세가 언약의 이름을 직접 부르는 장면이므로, 대체 호칭보다 고유명 보존이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְשָׁמְעוּ의 시제/상(basis within plea)
  chosen_reading: 미래적 결과를 드러내는 ‘듣게 될 것입니다’로 옮겼습니다.
  alternative_readings:
  - 이집트 사람들이 들었습니다
  - 이집트 사람들이 듣습니다
  rationale: 문맥상 모세의 간구는 뒤이어 올 결과를 논증하는 형태이므로, 한국어에서도 예견된 결과를 드러내는 미래 표현이 적절합니다. 다만 히브리어 형태 자체의 과거/결과적 가능성은 주석 없이 소거하지 않도록 해석의 여지를 유지했습니다.
  doctrine_reference: 문맥상 결과적 미래 읽기(English POB footnote a 반영)
