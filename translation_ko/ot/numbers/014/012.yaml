id: NUM.14.12
reference: Numbers 14:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַכֶּ֥/נּוּ בַ/דֶּ֖בֶר וְ/אוֹרִשֶׁ֑/נּוּ וְ/אֶֽעֱשֶׂה֙ אֹֽתְ/ךָ֔ לְ/גוֹי גָּד֥וֹל וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
  footnotes:
  - marker: a
    text: 'Or: “and disinherit him.” The Hebrew verb can carry inheritance/removal-from-possession overtones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 민족을 전염병으로 치고 그 민족의 소유를 빼앗고[a], 너를 그 민족보다 더 크고 더 강한 민족으로 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ירשׁ는 여기서 ‘소유를 빼앗다’ 외에 ‘상속에서 제외하다’ 또는 ‘상속권을 박탈하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  english_pob_choice: I will strike him
  chosen_korean: 내가 그들을 전염병으로 치고
  alternatives_korean:
  - 내가 그들을 치고
  - 내가 그들을 재앙으로 치고
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/때리다’를 자연스러운 현대 한국어로 풀었고, 다음 구절의 בַּדֶּבֶר을 살려 수단을 함께 드러냈습니다. 영어 POB의 단수 지시를 한국어에서는 공동체를 가리키는 자연스러운 복수로 옮겼습니다.
- source_word: בַּדֶּבֶר
  english_pob_choice: with the plague
  chosen_korean: 전염병으로
  alternatives_korean:
  - 역병으로
  - 재앙으로
  lexicon: HALOT
  rationale: דֶּבֶר는 심판 문맥에서 ‘역병/전염병’을 뜻하므로, 현대 독자가 즉시 이해할 수 있는 ‘전염병’이 적절합니다.
- source_word: וְאוֹרִשֶׁנּוּ
  english_pob_choice: and dispossess him
  chosen_korean: 그들을 차지하던 땅에서 몰아내며
  alternatives_korean:
  - 그들을 그 소유에서 몰아내며
  - 그들을 상속권에서 빼앗으며
  lexicon: HALOT
  rationale: ירשׁ의 히필은 ‘차지한 것을 빼앗다/몰아내다’의 뜻을 가지므로, 문맥의 상속·소유 상실을 한국어로 풀어 ‘차지하던 땅에서 몰아내다’로 옮겼습니다. 이는 단순한 추방보다 소유 상실의 뉘앙스를 더 잘 드러냅니다.
- source_word: לְגוֹי גָּדוֹל וְעָצוּם
  english_pob_choice: into a nation greater and mightier
  chosen_korean: 더 크고 더 강한 한 민족으로
  alternatives_korean:
  - 더 크고 더 ძლ센 한 나라로
  - 더 위대하고 더 강대한 한 민족으로
  lexicon: HALOT
  rationale: גוֹי는 여기서 집단이 아니라 민족적 실체를 가리키므로 ‘민족’이 자연스럽고, גָּדוֹל/עָצוּם의 병렬은 ‘더 크고 더 강한’으로 비교 구조를 살렸습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 3인칭 단수 접미사의 처리
  chosen_reading: 한국어에서는 자연스러운 공동체 지시를 따라 복수 표현(그들을)으로 옮기되, 원문의 집합적 단수 시점을 해치지 않도록 전체 문장을 한 민족에 대한 심판 선언으로 유지했습니다.
  alternative_readings:
  - 원문처럼 단수로 ‘그를/그에게’로 옮김
  - 모두 복수로 평탄화하여 ‘그들을/그들보다’로 처리
  rationale: 히브리어는 이스라엘을 집합적 단수로 보아 단수 접미사를 사용하지만, 한국어에서는 인칭 단수 유지가 부자연스러워 의미 전달을 우선했습니다. 다만 대상이 한 민족이라는 점은 문맥 전체로 보존했습니다.
  doctrine_reference: Translation philosophy §5 and §6
