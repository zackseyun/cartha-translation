id: NUM.14.45
reference: Numbers 14:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
  footnotes:
  - marker: a
    text: Hormah is a place name; the Hebrew name is related to a word for 'destruction' or 'devotion to destruction.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 그 산지에 살던 가나안 사람들과 아말렉인들이 내려와서 그들을 쳤고, 호르마까지 그들을 무찔렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 호르마는 지명입니다. 히브리어 이름은 ‘파괴’ 또는 ‘진멸에 바쳐짐’과 관련된 말과 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: came down
  chosen_korean: 내려와서
  alternatives_korean:
  - 내려갔고
  - 하산하여
  lexicon: HALOT
  rationale: 전쟁 맥락에서 높은 지대에서 아래로 이동하는 방향성을 자연스럽게 살리면서, 뒤의 연속 동작과도 잘 이어지게 합니다.
- source_word: הָעֲמָלֵקִי / וְהַכְּנַעֲנִי
  english_pob_choice: the Amalekites and the Canaanites
  chosen_korean: 아말렉 사람들과 그 가나안 사람들이
  alternatives_korean:
  - 아말렉인과 가나안인
  - 아말렉 사람과 가나안 사람
  lexicon: HALOT
  rationale: 히브리어 단수 형태가 집합적으로 쓰인 점을 반영해 한국어에서도 민족 집단 복수로 옮겼습니다.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  english_pob_choice: who lived in that hill country
  chosen_korean: 곧 그 산지에 살고 있던 사람들이
  alternatives_korean:
  - 그 산에 살던 사람들
  - 그 산지에 거주하던 사람들
  lexicon: HALOT
  rationale: הָר는 여기서 단일 산이라기보다 지리적 구역을 가리키므로 ‘산지’로 옮기고, 분사적 설명을 자연스러운 한국어 관형절로 처리했습니다.
- source_word: וַיַּכּוּם / וַיַּכְּתּוּם
  english_pob_choice: struck them and beat them down
  chosen_korean: 그들을 쳤고, 호르마까지 그들을 무찔렀습니다
  alternatives_korean:
  - 그들을 쳤고, 호르마까지 그들을 무너뜨렸습니다
  - 그들을 공격했고, 호르마까지 그들을 꺾었습니다
  lexicon: HALOT
  rationale: 첫 동사는 구체적 타격을 살려 ‘치다’로, 둘째 동사는 더 강한 압도·분쇄의 뉘앙스를 살려 ‘무찌르다’로 구분해 반복과 강화 효과를 드러냈습니다.
- source_word: עַד הַחָרְמָה
  english_pob_choice: as far as Hormah
  chosen_korean: 호르마까지
  alternatives_korean:
  - 호르마에 이르기까지
  - 호르마 끝까지
  lexicon: HALOT
  rationale: עַד의 도달 한계를 한국어 조사 ‘까지’로 간결하게 나타내면서, 지명은 음역을 유지했습니다.
theological_decisions:
- issue: 지명 חָרְמָה의 의미를 본문에 넣을지 여부
  chosen_reading: 본문에는 지명 호르마를 유지하고, 의미 설명은 본문 밖에서 처리합니다.
  alternative_readings:
  - ‘멸망’으로 번역
  - ‘진멸의 장소’처럼 설명을 본문에 삽입
  rationale: 여기서는 고유 지명으로 기능하므로 본문에서 번역어로 바꾸면 지리적 식별성이 약해집니다. 의미적 배경은 주석에서 충분히 살릴 수 있습니다.
  doctrine_reference: 성경 지명 처리 원칙
