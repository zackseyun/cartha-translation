    text: 호르마는 지명입니다. 히브리어 이름은 ‘파괴’ 또는 ‘진멸에 바쳐짐’과 관련된 말과 연결됩니다.
    reason: cultural_note
  revision_rationale: 가나안 사람만을 수식하는 히브리어 관계절의 범위를 한국어 어순으로 명확히 했습니다. 두 연속 동사는 ‘쳤고’와 ‘무찔렀습니다’로 구별하여 원문의 타격과 강화된 패배 묘사를 보존했으며, 지명과 주석은 유지했습니다.
