  to: 이 악한 회중[a]이 언제까지 나를 거슬러 불평하겠습니까? 이스라엘 자손[b]이 나를 거슬러 하는 불평을 내가 들었습니다.
  rationale: 불평의 대립 대상을 ‘나를 거슬러’로 명시하고, 후반부를 원문의 관계절 구조에 맞추어 ‘이스라엘 자손이 나를 거슬러 하는 불평’으로 고쳤습니다. 이로써 동사와 명사의 반복을 유지하면서도 자연스러운 현대 합쇼체 문장을 이루며, 각주 표지도 해당 어휘에 직접 연결했습니다.
