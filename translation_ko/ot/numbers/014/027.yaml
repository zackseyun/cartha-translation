  verdict: revise
  source_fidelity: 첫 문장은 원문의 책망하는 시간 의문문과 ‘악한 회중’을 잘 반영합니다. 그러나 עָלַי의 대립적 방향은 ‘나에게’보다 ‘나를 거슬러’가 더 정확합니다. 또한 후반부는 히브리어의 관계절, 곧 ‘이스라엘 자손이 나를 거슬러 하는 불평’을 한 문장으로 연결하는 편이 정확하고 자연스럽습니다.
  naturalness: ‘그들이 나에게 불평하는 것을 말입니다’는 앞 문장 뒤에 덧붙는 구어적 해설처럼 들리고 합쇼체 성서 문체에도 다소 어색합니다. 관계절로 통합하면 현대 표준 한국어의 격식 있는 문체가 됩니다.
  terminology: ‘악한’, ‘회중’, ‘이스라엘 자손’, ‘불평’은 원문의 평가, 집단 명칭, 전통적 민족 명칭, 동사·명사의 반복을 적절히 반영합니다. ‘나를 거슬러’는 하나님에 대한 반대의 방향성을 명확히 합니다.
