    rationale: 원문은 ‘이스라엘 자손의 불평’에 이어 그들이 하나님을 거슬러 불평한다는 관계절을 붙입니다. 현 번역은 문장 단절과 ‘말입니다’ 때문에 원문의 수사적 연결 및 격식 있는 문체가 약화됩니다.
