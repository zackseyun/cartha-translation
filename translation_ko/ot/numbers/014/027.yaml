id: NUM.14.27
reference: Numbers 14:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
  footnotes:
  - marker: a
    text: Or 'assembly' or 'community' for 'congregation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the children of Israel' or 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 악한 회중이 언제까지 나에게 불평하겠습니까? 나는 이스라엘 자손의 불평을 들었습니다. 그들이 나에게 불평하는 것을 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 본문의 עֵדָה에 대한 번역이며, 문맥상 ‘공동체’나 ‘집회’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 직역에 가깝고, ‘이스라엘 사람들’이나 ‘이스라엘 백성’으로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָעֵדָה
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 공동체
  - 집회
  lexicon: HALOT
  rationale: עֵדָה는 광야에서 모인 이스라엘의 집합체를 가리키므로, POB의 ‘congregation’에 대응하는 ‘회중’이 가장 직접적이고 문맥에 맞습니다.
- source_word: הָרָעָה הַזֹּאת
  english_pob_choice: this evil
  chosen_korean: 이 악한
  alternatives_korean:
  - 이 악독한
  - 이 나쁜
  lexicon: HALOT
  rationale: 여기서 רָעָה는 단순히 불쾌한 상태가 아니라 도덕적 평가를 담으므로, 강도를 살린 ‘악한’이 적절합니다.
- source_word: מַלִּינִים / תְּלֻנּוֹת
  english_pob_choice: grumble / complaints
  chosen_korean: 불평하다 / 불평
  alternatives_korean:
  - 투덜거리다 / 투덜거림
  - 원망하다 / 원망
  lexicon: HALOT
  rationale: 동사와 명사의 반복을 살리면서도 현대 한국어에서 자연스럽고, 광야 서사의 반항적 불평이라는 뉘앙스를 드러내는 표현입니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 유지하면서도 한국어 성서어법에서 널리 통용되는 직접 대응을 택했습니다.
theological_decisions:
- issue: 하나님의 탄식/책망의 직접성
  chosen_reading: 하나님이 회중의 불평을 단순 보고가 아니라 책망의 근거로 제시하는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 완화하여 ‘걱정하다’나 ‘불만을 품다’로 옮김
  - 더 부드럽게 ‘항의하다’로 옮김
  rationale: 본문은 하나님의 인내의 한계를 드러내는 심판적 수사이므로, ‘언제까지’와 ‘악한 회중’의 강도를 약화시키지 않는 것이 원문 의도에 부합합니다.
  doctrine_reference: 민수기 14장 문맥상 광야 세대에 대한 하나님의 책망
- issue: ‘나에게’의 대립 방향
  chosen_reading: 불평의 방향을 ‘나에게’로 유지했습니다.
  alternative_readings:
  - ‘내 앞에서’
  - ‘내게 대하여’
  rationale: עָלַי는 단순한 언급이 아니라 하나님을 향한 대립성을 담으므로, 한국어에서도 직접적인 대상을 분명히 해야 합니다.
  doctrine_reference: HALOT의 עַל + 인칭대명사 용법
