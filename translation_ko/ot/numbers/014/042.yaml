id: NUM.14.42
reference: Numbers 14:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
  footnotes:
  - marker: a
    text: Or, 'in your midst.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'lest you be defeated before your enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 올라가지 마십시오[a]. 야훼께서 여러분 가운데[b] 계시지 않으므로, 여러분이 원수들 앞에서 쓰러지지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올라가지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 한가운데에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל + תַּעֲל֔וּ
  english_pob_choice: Do not go up
  chosen_korean: 올라가지 마십시오
  alternatives_korean:
  - 올라가지 마세요
  - 올라가면 안 됩니다
  - 진격하지 마십시오
  lexicon: HALOT
  rationale: עלה의 기본 의미를 살리되, 전투·상승 맥락의 관용을 자연스러운 한국어 금지형으로 옮겼습니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: among you
  chosen_korean: 여러분 가운데
  alternatives_korean:
  - 여러분의 한가운데에
  - 여러분 중에
  - 여러분과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘가운데/한가운데’이지만, 공동체 안의 임재를 현대 한국어로 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: תִּנָּגְפוּ
  english_pob_choice: you be struck down
  chosen_korean: 쓰러지지 않게 하려는 것입니다
  alternatives_korean:
  - 패배당하지 않게 하려는 것입니다
  - 쳐부서지지 않게 하려는 것입니다
  - 맞아 쓰러지지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: נגש의 피동형은 군사적 패배와 타격의 뉘앙스를 함께 가지므로, 결과를 자연스럽게 풀어 ‘쓰러지다’로 옮기되 앞선 경고 구조를 유지했습니다.
- source_word: אֹיְבֵיכֶם
  english_pob_choice: your enemies
  chosen_korean: 원수들
  alternatives_korean:
  - 적들
  - 여러분의 원수들
  - 여러분의 적들
  lexicon: HALOT
  rationale: 전쟁 문맥의 אויב은 일반적으로 ‘원수/적’이지만, 본문 흐름상 대상이 분명하므로 한국어에서는 자연스럽게 ‘원수들’로 압축했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 신명기적 관례가 아닌 직접 표기를 쓰므로, 전통적 대체어 대신 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 부재/임재의 표현인 בְּקִרְבְּכֶם
  chosen_reading: 여러분 가운데 계시지 않으므로
  alternative_readings:
  - 여러분 한가운데 계시지 않으므로
  - 여러분과 함께 계시지 않으므로
  rationale: 이 구절의 핵심은 언약적 동행의 부재를 경고하는 것이므로, 공간성과 공동체성을 함께 살리는 ‘가운데’ 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #6'
