translation:
  language: ko
  text: 올라가지 마십시오. 야훼께서 여러분 가운데[a] 계시지 않으시므로, 그렇게 하면 원수들 앞에서 쓰러질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
