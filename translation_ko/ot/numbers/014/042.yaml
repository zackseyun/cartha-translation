  source_fidelity: 초안의 ‘여러분이 원수들 앞에서 쓰러지지 않게 하려는 것입니다’는 히브리어의 경고성 결과절을 화자의 목적 또는 의도로 바꾸어 놓습니다. וְלֹא תִּנָּגְפוּ는 금지 명령 뒤에서 피해야 할 결과, 곧 적들 앞에서 타격을 받아 쓰러지는 일을 경고합니다. 수정문은 이 결과 관계를 한국어의 자연스러운 조건적 경고로 드러냅니다.
  naturalness: ‘…않게 하려는 것입니다’는 문맥상 무엇이 그 목적을 가진다는 것인지 불명확하고 부자연스럽습니다. ‘그렇게 하면 … 쓰러질 것입니다’는 합쇼체의 현대적인 경고 문장으로 자연스럽습니다.
  terminology: ‘야훼’, ‘여러분 가운데’, ‘원수들’은 각각 יהוה, בְּקִרְבְּכֶם, אֹיְבֵיכֶם에 충실하며 문체에도 맞습니다. ‘쓰러질 것입니다’는 נָגַף의 전투 상황에서의 피격·패배 의미를 무리 없이 담습니다.
  issues:
