    rationale: 초안에서 [a]는 ‘올라가지 마십시오’에 붙지만 그 각주는 동어 반복이고, [b]의 대안은 ‘가운데’에 대응합니다. 수정본은 각주를 해당 어구에 직접 연결하고, 쓰러짐의 군사적 의미에 대한 대안을 별도로 제공합니다.
