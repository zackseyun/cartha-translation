    rationale: ‘쓰러지지 않게 하려는 것입니다’는 원문에 없는 목적·의도 주체를 암시합니다. 본문은 올라갈 경우 적들 앞에서 쓰러질 결과를 경고합니다.
  - severity: medium
    issue: 각주 a의 내용이 본문 어구의 대안이 아님
