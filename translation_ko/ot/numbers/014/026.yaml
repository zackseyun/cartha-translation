  - 주님
  rationale: 출애굽 이후 언약적 계시 맥락에서 본문은 신적 호칭이 아니라 신명 자체를 사용하므로, 번역문에서도 이름을 보존하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
