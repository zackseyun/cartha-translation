lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하여 이르셨습니다
  lexicon: HALOT
  rationale: דבר는 단순히 ‘말하다’보다 공식적인 발화 개시를 나타내므로, 하나님의 직접적 말씀 형식을 살려 ‘말씀하여 이르셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 관용적 대체칭호가 아니라 고유한 이름이므로, POB 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל / וְאֶל
  english_pob_choice: to / and to
  chosen_korean: 에게
  alternatives_korean:
  - ~에게로
  - ~께
  lexicon: HALOT
  rationale: 두 수신자를 병렬로 지시하는 전치사 구조를 한국어의 자연스러운 여격 조사로 풀어, 모세와 아론이 모두 말씀의 직접 수신자임을 분명히 했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 라고
  lexicon: HALOT
  rationale: 다음 절의 인용을 여는 표지로 기능하므로, 형식적 연결을 살리면서도 현대 한국어에서 자연스러운 ‘이르셨습니다’로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
