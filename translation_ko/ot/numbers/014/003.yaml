id: NUM.14.3
reference: Numbers 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
  footnotes:
  - marker: a
    text: Or 'will be prey'; the Hebrew can denote being taken as spoil by enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: “어찌하여 야훼께서 우리를 이 땅으로 데려오셔서 칼에 쓰러지게 하십니까? 우리의 아내들과 어린아이들은 노획물이 될 것입니다[a]. 차라리 우리가 이집트로 돌아가는 것이 더 낫지 않겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹잇감이 될 것입니다’; 히브리어는 적에게 빼앗기는 전리품이나 노획물이 되는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  english_pob_choice: And why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 불평이 이어지는 담화 흐름은 한국어에서 접속부사 없이도 자연스럽게 이어질 수 있어, 과도한 직역보다는 원문의 항의적 질문성을 살리는 ‘어찌하여’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사해행간의 전통적 대치어 대신, 본문에 드러난 신적 고유명을 그대로 옮기기 위해 ‘야훼’를 사용했습니다.
- source_word: לִנְפֹּל בַּחֶרֶב
  english_pob_choice: to fall by the sword
  chosen_korean: 칼에 쓰러지게 하십니까
  alternatives_korean:
  - 칼로 죽게 하십니까
  - 칼에 엎드러지게 하십니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 전투로 인한 죽음을 뜻하므로, ‘쓰러지게 하십니까’로 자연스러운 한국어를 유지하면서도 죽음의 결과를 보존했습니다.
- source_word: יִהְיוּ לָבַז
  english_pob_choice: will become plunder
  chosen_korean: 노략물이 될 것입니다
  alternatives_korean:
  - 전리품이 될 것입니다
  - 노획물이 될 것입니다
  lexicon: HALOT
  rationale: בַז는 전쟁에서 빼앗기는 전리품/노획물을 가리키므로, 인명 피해의 위협을 더 직접적으로 드러내는 ‘노략물’이 가장 적절합니다.
- source_word: שׁוּב מִצְרָיְמָה
  english_pob_choice: to return to Egypt
  chosen_korean: 이집트로 돌아가는 것이
  alternatives_korean:
  - 애굽으로 돌아가는 것이
  - 이집트로 되돌아가는 것이
  lexicon: HALOT
  rationale: 히브리어의 ‘돌아가다’ 동사를 살리되, 현대 표준어에서 자연스러운 지명 표기인 ‘이집트’를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 칭호가 아니라 언약적 고유명을 직접 사용하므로, 이를 대체하지 않고 드러내는 번역이 원문 청중의 인식을 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
