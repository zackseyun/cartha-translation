  terminology: ‘야훼’, ‘이집트’, ‘칼에 쓰러지다’는 적절합니다. בַז에 대한 각주는 ‘먹잇감’이라는 가능한 대안을 제시하고, 전리품이 된다는 기본 의미를 설명하는 것이 좋습니다.
