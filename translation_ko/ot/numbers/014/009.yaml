id: NUM.14.9
reference: Numbers 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
  footnotes:
  - marker: a
    text: Or, 'for they are our food.' The Hebrew says literally, 'they are our bread,' a metaphor for easy conquest or being consumed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their shadow has departed from over them.' Here 'shadow' likely refers to protection or shelter.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 야훼를 거역하지 마십시오. 또한 그 땅의 백성을 두려워하지 마십시오. 그들은 우리의 빵이기 때문입니다. 그들을 보호하던 것이 그들에게서 떠났으며, 야훼께서 우리와 함께 계십니다[b]. 그들을 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘그들의 그림자가 그들 위에서 떠났습니다’입니다. 여기서 ‘그림자’는 보호나 그늘을 가리키는 비유로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 단지
  - 오직만
  lexicon: HALOT
  rationale: אַךְ의 제한·강조 기능을 한국어에서 가장 간결하게 살리는 말은 ‘오직’이며, 경고의 강도를 유지합니다.
- source_word: בַּיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼에 대하여
  - 야훼를 거슬러
  - 야훼를 향하여
  lexicon: HALOT
  rationale: מרד와 결합한 ב는 반역의 대상/상대로 이해되는 것이 자연스러워, 한국어에서는 목적어 형태로 풀어 ‘야훼를 거역하지 마십시오’로 옮겼습니다.
- source_word: תִּמְרֹדוּ
  english_pob_choice: do not rebel
  chosen_korean: 거역하지 마십시오
  alternatives_korean:
  - 반역하지 마십시오
  - 반항하지 마십시오
  - 배반하지 마십시오
  lexicon: HALOT
  rationale: 정치적 폭동보다 권위에 대한 불복종과 반역의 뜻이 강하므로, 직설적이면서도 합쇼체 경고에 맞는 ‘거역하다’를 택했습니다.
- source_word: כִּי לַחְמֵנוּ הֵם
  english_pob_choice: for they are our bread
  chosen_korean: 그들은 우리의 빵이기 때문입니다
  alternatives_korean:
  - 그들은 우리의 양식이기 때문입니다
  - 그들은 우리의 먹을거리이기 때문입니다
  - 그들은 우리의 음식이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 비유를 본문에서 그대로 살리기 위해 ‘빵’을 유지했습니다. ‘양식’은 전통적이지만 더 해석적이어서, 직유의 날카로움을 약화할 수 있습니다.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  english_pob_choice: their protection has departed from over them
  chosen_korean: 그들의 보호가 그들 위에서 떠났고
  alternatives_korean:
  - 그들의 그림자가 그들 위에서 떠났고
  - 그들의 그늘이 그들 위에서 떠났고
  - 그들의 보호막이 그들 위에서 떠났고
  lexicon: HALOT
  rationale: צֵל의 문자적 ‘그림자’는 원문 이미지를 보존하지만 한국어에서는 보호의 기능이 분명하도록 ‘보호’로 옮기고, ‘떠났고’로 출발 이미지를 유지했습니다.
- source_word: וַיהוָה אִתָּנוּ
  english_pob_choice: and Yahweh is with us
  chosen_korean: 야훼께서 우리와 함께 계십니다
  alternatives_korean:
  - 야훼는 우리와 함께하십니다
  - 야훼가 우리와 함께 계십니다
  - 야훼께서 우리 편에 계십니다
  lexicon: HALOT
  rationale: אִתָּנוּ는 단순한 동반을 넘어 보호·연대의 임재를 암시하므로, 합쇼체에서 자연스럽고 경건한 ‘우리와 함께 계십니다’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 여호와 대신 야훼를 본문에 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 제공된 POB 기준이 יהוה를 야훼로 옮기므로, 표준 한국어 교회어보다 स्रोत-직결성을 우선해 동일하게 반영했습니다.
  doctrine_reference: POB translation philosophy §1, §3
- issue: 여호와와 함께하심의 표현
  chosen_reading: ‘야훼께서 우리와 함께 계십니다’로 존재/임재를 분명히 했습니다.
  alternative_readings:
  - 야훼는 우리 편이십니다
  - 야훼가 우리와 함께하십니다
  rationale: 본문의 핵심은 전투적 낙관이 아니라 언약적 임재 선언이므로, ‘함께 계십니다’로 신학적 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §6
