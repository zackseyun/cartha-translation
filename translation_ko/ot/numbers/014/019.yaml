id: NUM.14.19
reference: Numbers 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
  footnotes:
  - marker: a
    text: Or, 'just as you have forgiven this people from Egypt until now.' The Hebrew verb can mean 'carry/bear' and, in some contexts, 'forgive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 백성의 죄악을 주의 크신 인애에 따라 용서해 주십시오. 마치 이 백성을 이집트에서부터 지금까지 용서해 오신 것처럼 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סְלַח נָא
  english_pob_choice: Please forgive
  chosen_korean: 용서해 주십시오
  alternatives_korean:
  - 부디 용서하십시오
  - 용서해 주시기를 바랍니다
  lexicon: HALOT
  rationale: סלח의 청원형에 나오는 נָא를 현대 한국어의 공손한 간청으로 자연스럽게 살려, 명령이라기보다 간절한 요청으로 들리게 했습니다.
- source_word: לַעֲוֺן
  english_pob_choice: the iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 죄
  - 불의
  - 허물
  lexicon: HALOT
  rationale: עָוֹן은 단순한 실수보다 도덕적·언약적 책임이 담긴 죄책을 가리키므로, 너무 약한 '죄'보다 무게감이 있는 '죄악'을 택했습니다.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  english_pob_choice: according to the greatness of your steadfast love
  chosen_korean: 주의 크신 인애에 따라
  alternatives_korean:
  - 주의 크신 한결같은 사랑에 따라
  - 주의 크신 자애에 따라
  - 주의 크신 은혜에 따라
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실함을 살리기 위해 '인애'를 사용했고, גֹּדֶל은 '크신'으로 응축해 한국어 문장을 자연스럽게 했습니다.
- source_word: נָשָׂאתָה
  english_pob_choice: you have borne with
  chosen_korean: 용서해 오신 것처럼
  alternatives_korean:
  - 감당해 오신 것처럼
  - 짊어져 오신 것처럼
  - 참아 오신 것처럼
  lexicon: HALOT
  rationale: 이 절에서는 대상이 '이 백성'이므로 단순한 운반보다 하나님이 지금까지 이들을 용납하고 용서해 오신 지속적 행위를 드러내는 표현을 택했습니다.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  english_pob_choice: from Egypt until now
  chosen_korean: 이집트에서부터 지금까지
  alternatives_korean:
  - 이집트에서 지금까지
  - 이집트에서 여기까지
  lexicon: HALOT
  rationale: 출애굽부터 현재까지 이어지는 시간적 연속을 분명히 드러내기 위해 '에서부터 지금까지'로 옮겼습니다.
theological_decisions:
- issue: נָשָׂאתָה의 의미 범위
  chosen_reading: 하나님이 이 백성을 지금까지 '용서해 오신' 지속적 은혜를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 하나님이 이 백성을 '짊어져 오신' 지속적 인내를 가리킨다
  - 하나님이 이 백성을 '참아 오신' 지속적 관용을 가리킨다
  rationale: 문맥상 모세는 지금의 용서를 구하면서, 출애굽 이후 하나님이 이 백성을 계속 다루어 오신 역사적 패턴을 근거로 삼습니다. 한국어에서는 그 패턴을 가장 직접적으로 드러내는 '용서해 오신'이 본문의 청원 의도를 잘 전달합니다.
  doctrine_reference: '번역 원칙: 문맥이 허용하는 범위 안에서 본문의 구체적 청원을 우선적으로 드러냄'
