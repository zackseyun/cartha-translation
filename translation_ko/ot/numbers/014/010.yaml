id: NUM.14.10
reference: Numbers 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to all the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 온 회중은 그들을 돌로 치자고 하였으나, 야훼의 영광이 회막에서 온 이스라엘 자손에게[a] 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘온 이스라엘 사람들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 온 집회
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 모인 공동체를 가리키는 말이므로, 집합적·공적 뉘앙스를 살린 ‘회중’이 가장 자연스럽습니다.
- source_word: לִרְגּוֹם ... בָּאֲבָנִים
  english_pob_choice: to stone them with stones
  chosen_korean: 그들을 돌로 치라고
  alternatives_korean:
  - 그들에게 돌을 던지라고
  - 그들을 돌로 쳐 죽이라고
  lexicon: HALOT
  rationale: רגם은 ‘돌로 치다’가 직접적 대응입니다. 본문에 죽음의 결과가 명시되지 않으므로 ‘쳐 죽이다’는 덧붙이지 않았습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 여호와의 영광
  - 주님의 영광
  lexicon: HALOT
  rationale: יהוה는 POB 기준에 따라 ‘야훼’로 옮기고, כָּבוֹד는 하나님의 임재가 드러나는 ‘영광’으로 옮겼습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 회중의 장막에서
  lexicon: HALOT
  rationale: 이 표현은 성막의 표준 명칭이므로, 한국어 성경에서 널리 쓰이는 ‘회막’으로 간명하게 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 문자적으로는 ‘이스라엘의 아들들’이지만, 한국어에서는 언약적·민족적 고유 표현인 ‘이스라엘 자손’이 원문 구조를 가장 잘 보존합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 신명기적 고유명사 יהוה를 사용하므로, 대체 칭호보다 신적 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님의 현현 표현
  chosen_reading: 영광이 ... 나타났습니다
  alternative_readings:
  - 영광이 ... 보였습니다
  - 임재가 ... 드러났습니다
  rationale: נִרְאָה의 수동형은 단순 시각 인지가 아니라 하나님의 가시적 현현을 가리키므로, ‘나타났습니다’로 옮겨 사건성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy
