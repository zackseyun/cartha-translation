revisions:
- from: 여러분은 그 땅에 들어가지 못할 것입니다. 내가 손을 들어 여러분을 그곳에 살게 하겠다고 맹세한 그 땅에 말입니다[a]. 오직 갈렙, 여분네의 아들, 그리고 눈의 아들 여호수아만 예외입니다.
  to: 여러분은 내가 여러분을 그곳에 살게 하겠다고 손을 들어 맹세한 땅에는 결코 들어가지 못할 것입니다[a]. 다만 여분네의 아들 갈렙과 눈의 아들 여호수아는 예외입니다.
  rationale: 문두의 맹세적 부정은 ‘결코 들어가지 못할 것입니다’로 유지했습니다. 땅을 수식하는 관계절을 본문 안에 직접 연결하여 반복과 단절을 없앴으며, 각주는 원문의 ‘손을 들다’ 관용구와 그 맹세 의미를 구분하여 설명하도록 바로잡았습니다.
