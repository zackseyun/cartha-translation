reference: Numbers 14:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the land in which I raised my hand to settle you in it,' an oath gesture meaning he swore to give them the land.
    reason: cultural_note
translation:
  language: ko
  text: 여러분은 내가 여러분을 그곳에 살게 하겠다고 손을 들어 맹세한 땅에는 결코 들어가지 못할 것입니다[a]. 다만 여분네의 아들 갈렙과 눈의 아들 여호수아는 예외입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 손을 들어 여러분을 그 안에 살게 하려고’라고 합니다. ‘손을 들다’는 맹세의 몸짓을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  english_pob_choice: Surely you shall not come
  chosen_korean: 여러분은 그 땅에 들어가지 못할 것입니다
  alternatives_korean:
  - 여러분이 그 땅에 들어가면
  - 여러분은 그 땅에 들어가지 않을 것입니다
  lexicon: HALOT
  rationale: 문두의 אִם이 조건문이 아니라 강한 부정의 맹세/선언으로 기능하므로, 한국어에서는 명시적 금지·불허의 의미를 살려 자연스럽게 옮겼습니다.
- source_word: אֶל הָאָרֶץ
  english_pob_choice: into the land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 땅으로
  - 그 땅 안으로
  lexicon: HALOT
  rationale: בוא의 이동 의미를 한국어 조사 ‘에’로 간결하게 살려 ‘들어가다’와 결합했습니다.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  english_pob_choice: in which I raised my hand
  chosen_korean: 내가 손을 들어 여러분을 그곳에 살게 하겠다고 맹세한
  alternatives_korean:
  - 내가 손을 들어 맹세한
  - 내가 손을 들어 여러분을 거기 두겠다고 맹세한
  lexicon: HALOT
  rationale: 직역의 손 듦은 유지하되, 한국어에서는 오해를 줄이기 위해 그 몸짓이 맹세 표지임을 드러내어 원문의 관용구를 해설적으로 살렸습니다.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  english_pob_choice: to settle you
  chosen_korean: 여러분을 그곳에 살게 하겠다고
  alternatives_korean:
  - 여러분을 그곳에 정착시키겠다고
  - 여러분을 그곳에 거주하게 하겠다고
  lexicon: HALOT
  rationale: 사역형의 ‘거주하게 하다/정착시키다’ 의미를 살리면서 현대 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: כִּי אִם
  english_pob_choice: except
  chosen_korean: 오직
  alternatives_korean:
  - 예외는
  - 다만
  lexicon: HALOT
  rationale: 부정 뒤의 배제 구조를 한국어 ‘오직’으로 간결하게 드러내어, 뒤에 오는 두 인물만 예외임을 분명히 했습니다.
theological_decisions:
- issue: 하나님이 맹세하신 땅 약속과 심판 선언의 긴장
  chosen_reading: ‘손을 들어… 맹세한’ 표현을 본문에 유지하면서, 전체 문장은 ‘들어가지 못할 것입니다’로 시작해 심판적 선언의 힘을 살렸습니다.
  alternative_readings:
  - 단순히 ‘내가 약속한 땅’으로 풀어 쓰는 방식
  - ‘맹세하셨던 땅’으로 수동화하는 방식
  rationale: 본문은 약속의 확실성과 동시에 불순종에 대한 배제 판결을 함께 전합니다. 몸짓 관용구를 지우면 맹세의 엄중함이 약해지므로, 의미를 풀되 긴장을 보존했습니다.
  doctrine_reference: Numbers 14; divine judgment and oath formula
- issue: 예외 인물의 범위를 좁혀 제시하는 배제 구조
  chosen_reading: ‘오직 갈렙… 그리고 여호수아만 예외입니다’로 두 사람만 남기는 배타적 구조를 그대로 반영했습니다.
  alternative_readings:
  - ‘갈렙과 여호수아 외에는’
  - ‘그들만 들어갈 것입니다’
  rationale: כִּי אִם의 배제 기능은 언약 공동체 심판 문맥에서 핵심이므로, 예외를 명시하는 방식으로만 처리했습니다.
  doctrine_reference: Covenant judgment narrative
