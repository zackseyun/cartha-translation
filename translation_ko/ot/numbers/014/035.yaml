id: NUM.14.35
reference: Numbers 14:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
  footnotes:
  - marker: a
    text: Or 'assembly' or 'community' for 'congregation.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew idiom rendered 'Surely' is literally 'if not,' an oath-like expression of strong certainty.
    reason: lexical_alternative
translation:
  language: ko
  text: 나 야훼가 말했습니다. 내가 반드시 이 악한 회중, 곧 나를 거슬러 함께 모인 이 무리를 이 광야에서 끝내고, 거기서 그들이 죽게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 이스라엘의 모인 공동체를 가리키며, 문맥에 따라 ‘집회’ 또는 ‘공동체’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘אם לא’는 문자적으로는 ‘만일 아니면/그렇지 않으면’이지만, 여기서는 서약적 확언으로 ‘반드시/참으로’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/전통 명칭 대비
  rationale: 원문의 고유명사를 보존하기 위해 POB 영어의 Yahweh에 맞추어 야훼로 옮겼습니다. 이는 호칭인 ‘주님’으로 대체하지 않고 신적 이름 자체를 드러냅니다.
- source_word: דִּבַּרְתִּי
  english_pob_choice: have spoken
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 완료 동사의 확정된 발화를 한국어 현재완료형으로 자연스럽게 살렸고, 하나님의 엄숙한 선언이라는 문맥을 반영했습니다.
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 반드시
  alternatives_korean:
  - 참으로
  - 틀림없이
  lexicon: HALOT
  rationale: 문자적 조건문이 아니라 서약적 확언이므로, POB의 ‘Surely’에 맞춰 강한 확실성을 나타내는 ‘반드시’로 옮겼습니다.
- source_word: הָעֵדָה
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 집회
  - 공동체
  lexicon: HALOT
  rationale: 이스라엘의 모인 공동체를 가리키는 집합 명사로서, 교회 제도 용어보다 원문 의미에 더 직접적인 ‘회중’을 선택했습니다.
theological_decisions:
- issue: ‘이 악한 회중’과 ‘나를 거슬러 함께 모인 이 무리’의 이중 표현
  chosen_reading: ‘회중’으로 공동체성을 유지하면서, 뒤의 분사구를 ‘나를 거슬러 함께 모인 이 무리’로 풀어 적대적 집합을 분명히 했습니다.
  alternative_readings:
  - ‘악한 집회’
  - ‘악한 공동체’
  rationale: 원문은 단순한 숫자 집합이 아니라 야훼를 거슬러 모인 반역 공동체를 심판 대상으로 제시합니다. 공동체성과 적대성을 둘 다 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §5
- issue: אֶעֱשֶׂה / יִתַּמּוּ / יָמֻתוּ의 심판 진행
  chosen_reading: ‘끝내고, 거기서 그들이 죽게 하겠습니다’로 종결과 죽음을 구분했습니다.
  alternative_readings:
  - ‘멸하고, 거기서 죽게 하겠습니다’
  - ‘없애고, 거기서 죽을 것입니다’
  rationale: 첫 동사는 ‘끝내다/종결시키다’의 의미를 살려 뒤의 명시적 죽음과 중첩되지 않게 했습니다. 심판의 진행과 결과를 구별하는 것이 원문의 병렬을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
