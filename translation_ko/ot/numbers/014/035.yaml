revisions:
- from: 나 야훼가 말했습니다. 내가 반드시 이 악한 회중, 곧 나를 거슬러 함께 모인 이 무리를 이 광야에서 끝내고, 거기서 그들이 죽게 하겠습니다.[a][b]
  to: 나 야훼가 말했습니다. 내가 반드시 나를 거슬러 함께 모인 이 악한 회중 전체에게 이렇게 하겠습니다. 그들은 이 광야에서 끝나고, 거기서 죽을 것입니다.[a][b]
  rationale: ‘회중 전체에게 이렇게 하겠다’로 לְכָל הָעֵדָה ... זֹאת אֶעֱשֶׂה의 대상과 지시어를 보존했습니다. 이어지는 두 미래 절은 ‘끝나고, ... 죽을 것입니다’으로 분리하여 종결과 죽음의 병렬을 유지했습니다. 신명 ‘야훼’, 공동체 명칭 ‘회중’, 그리고 서약적 확언 ‘반드시’는 유지했습니다.
