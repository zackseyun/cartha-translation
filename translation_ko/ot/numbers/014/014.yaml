source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
  footnotes:
  - marker: a
    text: Or, 'you appear face to face'; literally, 'eye to eye you are seen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 야훼께서 이 백성 가운데 계시고, 야훼께서 눈과 눈을 마주하여 보이시며[a], 야훼의 구름이 그들 위에 서 있고, 야훼께서 낮에는 구름 기둥으로, 밤에는 불 기둥으로 그들 앞에 가신다는 것을 들은 이 땅의 주민들에게 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 얼굴과 얼굴을 마주하여 나타나신다’. 원문은 문자적으로 ‘눈과 눈으로 보이신다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  english_pob_choice: the inhabitants of this land
  chosen_korean: 이 땅의 주민들
  alternatives_korean:
  - 이 땅에 사는 사람들
  - 이 땅에 거주하는 자들
  lexicon: HALOT
  rationale: 단수 분사지만 집합적 의미이므로 한국어에서는 복수 집합 표현으로 옮기는 것이 자연스럽습니다.
- source_word: בְּקֶרֶב
  english_pob_choice: in the midst of
  chosen_korean: 가운데
  alternatives_korean:
  - 한가운데
  - 중에
  lexicon: HALOT
  rationale: 언약적 임재의 뉘앙스를 살리면서도 현대 한국어로는 ‘가운데’가 가장 직접적입니다.
- source_word: עַיִן בְּעַיִן נִרְאָה
  english_pob_choice: are seen eye to eye
  chosen_korean: 얼굴과 얼굴을 맞대어 보이심
  alternatives_korean:
  - 눈과 눈을 맞대어 보이심
  - 눈과 눈으로 보이심
  lexicon: HALOT
  rationale: 영문 POB의 ‘eye to eye’는 직역하면 어색하므로, 히브리어 관용구의 직접성과 관계적 근접성을 살려 ‘얼굴과 얼굴을 맞대어’로 옮겼습니다.
- source_word: עַמּוּד עָנָן / עַמּוּד אֵשׁ
  english_pob_choice: pillar of cloud / pillar of fire
  chosen_korean: 구름 기둥 / 불 기둥
  alternatives_korean:
  - 구름의 기둥 / 불의 기둥
  - 구름 모양의 기둥 / 불 모양의 기둥
  lexicon: HALOT
  rationale: 출애굽 전승의 고정된 표상을 유지하기 위해 ‘기둥’ 표현을 그대로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 절은 공동체가 하나님을 가리키는 경칭적 직접화법이 강하므로 한국어 본문에서는 ‘주’로 자연스럽게 처리했습니다. 다만 본 절의 신명은 주석 없이 반복되므로, 필요시 야훼 표기를 검토할 수 있습니다.
theological_decisions:
- issue: ‘eye to eye’ 관용구의 처리
  chosen_reading: ‘얼굴과 얼굴을 맞대어 보이심’으로 옮겨, 직접적인 임재와 인지의 긴장을 보존했습니다.
  alternative_readings:
  - ‘면전에서 보이심’
  - ‘분명히 보이심’
  rationale: 히브리어 표현의 생생한 이미지가 단순한 ‘명백함’으로 평면화되지 않도록, 직접성과 근접성을 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 출애굽 구름/불 기둥의 상징성
  chosen_reading: 하나님의 인도와 보호를 나타내는 구체적 표상을 그대로 유지했습니다.
  alternative_readings:
  - 상징적으로 풀어 쓰기
  - ‘인도하시는 임재’로 의역하기
  rationale: 본문은 상징을 설명하기보다 상징 자체를 제시하므로, 독자가 구약의 표지를 인지할 수 있게 직역적 이미지를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1: Keep source imagery where it carries meaning'
