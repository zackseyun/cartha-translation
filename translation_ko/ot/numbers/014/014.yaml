revisions:
- from: 그리고 그들은 이 땅의 주민들에게 말할 것입니다[a]. 그들은 주께서 이 백성 가운데 계신 것과, 주께서 얼굴과 얼굴을 맞대어 보이심과, 주의 구름이 그들 위에 머물고 낮에는 구름 기둥 가운데서, 밤에는 불 기둥 가운데서 그들 앞서 가심을 들었습니다.
  to: 그리고 그들은 야훼께서 이 백성 가운데 계시고, 야훼께서 눈과 눈을 마주하여 보이시며[a], 야훼의 구름이 그들 위에 서 있고, 야훼께서 낮에는 구름 기둥으로, 밤에는 불 기둥으로 그들 앞에 가신다는 것을 들은 이 땅의 주민들에게 말할 것입니다.
  rationale: 신명은 ‘야훼’로 바로 옮기고, ‘눈과 눈’의 원문 영상을 본문에 유지했습니다. 주민들이 이미 들었다는 정보는 관계절로 명확히 했으며, 구름의 위치와 구름/불 기둥으로 앞서 가시는 방식을 히브리어 구문에 맞게 바로잡았습니다.
