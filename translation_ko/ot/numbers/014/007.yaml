lexical_decisions:
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 모든 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘의 온 회중
  lexicon: HALOT
  rationale: עֲדָה는 모인 공동체를 가리키므로 '회중'이 적절하고, בְּנֵי יִשְׂרָאֵל은 원문 구조를 따라 '이스라엘 자손'으로 옮겨 투명성을 살렸습니다.
- source_word: לָתוּר אֹתָהּ
  english_pob_choice: to spy it out
  chosen_korean: 정탐하려고
  alternatives_korean:
  - 탐지하려고
  - 살펴보려고
  lexicon: HALOT
  rationale: 민수기 정탐 이야기의 문맥에서 תור는 단순한 '탐색'보다 정찰·정탐의 의미가 분명하므로, 문맥을 살린 '정탐하다'를 택했습니다.
- source_word: טוֹבָה ... מְאֹד מְאֹד
  english_pob_choice: an exceedingly good land
  chosen_korean: 지극히 좋은 땅
  alternatives_korean:
  - 매우, 매우 좋은 땅
  - 극도로 좋은 땅
  lexicon: HALOT
  rationale: 반복된 מְאֹד מְאֹד의 강한 강조를 한국어에서 자연스럽게 드러내기 위해 '지극히'를 사용했으며, 과도한 직역보다 수사적 힘을 살렸습니다.
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말하였습니다
  lexicon: HALOT
  rationale: 서술의 자연스러운 진행을 위해 단순한 과거형으로 옮겼고, 원문의 연결표현은 한국어 문맥상 별도 접속사 없이도 충분히 전달됩니다.
theological_decisions:
- issue: 정탐 표현의 직역성과 문맥 적합성
  chosen_reading: '''정탐하려고''로 옮겨 출애굽기-민수기의 정찰 서사를 직접 드러냈습니다.'
  alternative_readings:
  - '''탐색하려고'''
  - '''살펴보려고'''
  rationale: 본문의 תור는 이 서사 안에서 정보 수집 이상의 정찰 행위를 뜻하므로, 독자가 사건의 긴장과 목적을 즉시 파악하도록 하는 번역이 더 적절합니다.
  doctrine_reference: 서사 맥락 보존
