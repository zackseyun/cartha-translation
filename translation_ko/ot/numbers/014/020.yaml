lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유명사 יהוה는 POB의 원칙에 따라 호칭이 아니라 신적 이름으로 옮겨야 하므로, 한국어에서도 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: סָלַחְתִּי
  english_pob_choice: I have forgiven
  chosen_korean: 용서하였노라
  alternatives_korean:
  - 용서했습니다
  - 사해 주었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형은 이미 이루어진 용서를 나타내므로, 본문이 지닌 완결성을 살려 ‘용서하였노라’로 옮겼습니다.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 네 말대로
  alternatives_korean:
  - 네가 말한 대로
  - 네 말씀대로
  lexicon: HALOT
  rationale: דבר은 여기서 모세의 중보적 발언을 가리키므로, 직역의 ‘네 말대로’가 원문의 관계를 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 여호와 대신 신적 이름 יְהוָה를 어떻게 표기할지
  chosen_reading: ‘야훼’로 표기하여 하나님 자신의 언약적 이름을 유지했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문은 단순한 호칭이 아니라 Tetragrammaton을 직접 사용하므로, 대체어로 바꾸지 않고 이름 자체를 드러내는 번역이 원문 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
