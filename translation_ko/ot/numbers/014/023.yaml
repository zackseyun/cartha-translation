revisions:
- from: 그들은 결코 그 땅을 보지 못할 것입니다. 내가 그들의 조상들에게 맹세한 땅입니다. 나를 멸시한 사람들 가운데 그 누구도 그것을 보지 못할 것입니다.[a][b]
  to: 그들은 내가 그들의 아버지들에게[b] 맹세한 그 땅을 결코 보지 못할 것입니다.[a] 나를 멸시한 자들은 아무도 그것을 보지 못할 것입니다.
  rationale: 히브리어 맹세 공식의 강한 부정, ‘그 땅’의 반복, 그리고 ‘멸시한 자들’에 대한 전면적 부정을 보존했습니다. ‘아버지들’을 본문에 유지하되 현대 한국어의 자연스러운 대안은 각주로 제시했으며, 각주 표지를 해당 어구에 배치했습니다.
