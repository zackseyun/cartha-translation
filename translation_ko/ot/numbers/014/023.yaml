  - 그들의 ancestors
  rationale: 원문은 분명히 'fathers'이므로, 언약 계보를 흐리지 않도록 한국어에서도 그 문맥을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4
