base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''if they see the land''; in this oath formula, the sense is emphatically negative: ''they certainly shall not see the land.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''their ancestors.'' Hebrew: ''their fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내가 그들의 아버지들에게[b] 맹세한 그 땅을 결코 보지 못할 것입니다.[a] 나를 멸시한 자들은 아무도 그것을 보지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들이 그 땅을 본다면’이지만, 이 맹세 공식에서는 강한 부정의 뜻이므로 ‘결코 … 보지 못할 것입니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 조상들에게.’ 히브리어는 ‘그들의 아버지들에게.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  english_pob_choice: they certainly shall not see
  chosen_korean: 결코 … 보지 못할 것입니다
  alternatives_korean:
  - 반드시 … 보지 못할 것입니다
  - 결코 … 보지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 אִם이 서원·맹세 문맥에서 조건문이 아니라 강한 부정으로 기능하므로, 한국어도 의미를 드러내는 부정으로 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 땅
  lexicon: HALOT
  rationale: 문맥상 일반적 토지가 아니라 약속의 땅을 가리키므로, 관용적이면서도 원문 범위를 보존하는 '그 땅'으로 옮겼습니다.
- source_word: לַאֲבֹתָם
  english_pob_choice: to their fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  lexicon: HALOT
  rationale: 원문은 문자적으로 '그들의 아버지들에게'이지만, 한국어에서는 족장들을 가리키는 관용을 살리기 위해 '조상들'로 옮기되, 성경적 혈연·언약 맥락은 유지했습니다.
- source_word: מְנַאֲצַי
  english_pob_choice: those who despised me
  chosen_korean: 나를 멸시한 사람들
  alternatives_korean:
  - 나를 업신여긴 사람들
  - 나를 경멸한 사람들
  lexicon: HALOT
  rationale: נאץ는 하나님을 향한 경멸·멸시를 뜻하므로, 도덕적 가벼움을 피하면서도 직설적인 '멸시하다'를 선택했습니다.
theological_decisions:
- issue: אָבוֹת의 번역을 성중립화할지 여부
  chosen_reading: '''그들의 조상들''로 번역해 원문의 남성 복수 친족 용어를 역사적·언약적 표현으로 유지합니다.'
  alternative_readings:
