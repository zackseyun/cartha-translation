  source_fidelity: 개역안은 첫 절을 두 문장으로 분리하여 관계절 구조(‘내가 그들의 아버지들에게 맹세한 땅’)를 약화시키고, לַאֲבֹתָם의 남성 친족어를 본문에서 ‘조상들’로 중화합니다. 또한 ‘내가 ... 맹세한 땅’은 한국어에서 무엇을 맹세했는지가 다소 불분명하므로, 목적을 보충하지 않고 원문의 관계를 유지하는 문장으로 다듬는 것이 안전합니다.
  naturalness: ‘그들은 … 보지 못할 것입니다’와 ‘나를 멸시한 자는 아무도 … 못할 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 엄숙한 판결 선언의 어조를 보존합니다.
  terminology: הָאָרֶץ는 ‘그 땅’, מְנַאֲצַי는 ‘나를 멸시한 자들’, 맹세 공식의 אִם은 ‘결코 … 못할 것입니다’로 옮깁니다. אָבוֹת는 본문에서 ‘아버지들’로 유지하고, ‘조상들’은 각주 대안으로 제시합니다.
