source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
  footnotes:
  - marker: a
    text: Or, 'let the power of the Lord be magnified.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 주님의 권능을 크도록 하셔서, 주님께서 말씀하신 대로 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 כֹּחַ는 문맥상 ‘권능’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  lexicon: HALOT
  rationale: 담화 전환을 여는 접속사+부사로서 한국어에서는 간결한 ‘이제’가 자연스럽고, 호소의 흐름도 잘 살립니다.
- source_word: יִגְדַּל
  english_pob_choice: let ... be great
  chosen_korean: 크도록 하셔서
  alternatives_korean:
  - 크게 하셔서
  - 크시게 하셔서
  - 크게 되게 하셔서
  lexicon: HALOT
  rationale: 청원형의 ‘be great’는 한국어에서 주어의 능력을 ‘크도록 하다’로 옮기면 자연스럽고, 단순한 형용사화보다 요청의 뉘앙스를 유지합니다.
- source_word: כֹּחַ
  english_pob_choice: power
  chosen_korean: 권능
  alternatives_korean:
  - 능력
  - 힘
  - 권세
  lexicon: HALOT
  rationale: 하나님의 פעול 능력을 가리키는 문맥이므로 일상적 ‘힘’보다 ‘권능’이 더 정확히 신적 능력의 격을 드러냅니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 기도체에 맞는 ‘주님’을 썼고, 여기서는 야훼 표기보다 호칭 자체의 청원성이 더 앞섭니다.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ לֵאמֹר
  english_pob_choice: just as you have spoken, saying
  chosen_korean: 주님께서 말씀하신 대로
  alternatives_korean:
  - 주님이 말씀하신 것처럼
  - 주님께서 말씀하신 바와 같이
  lexicon: HALOT
  rationale: 뒤따르는 인용 도입까지 포함한 관용구로 보고 한국어에서는 반복을 줄여 ‘말씀하신 대로’로 매끈하게 옮기되, 원문의 인용 연결은 문맥에서 유지했습니다.
theological_decisions:
- issue: 하나님께 드리는 청원문의 문체
  chosen_reading: 합쇼체 명령/청원형 ‘하셔서… 하십시오’로 옮겼습니다.
  alternative_readings:
  - 하십시오보다 덜 직접적인 서술형
  - 기도문식 ‘하옵소서’
  rationale: 본절은 모세의 간구이므로, 현대 한국어에서 자연스럽고 직접적인 청원인 ‘하셔서… 하십시오’가 원문의 간청성을 잘 살립니다.
  doctrine_reference: Prayer discourse register in narrative prose; Translation philosophy §2
