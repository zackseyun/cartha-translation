  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
  footnotes:
  - marker: a
    text: Or 'among those who had spied out the land.' The Hebrew preposition can mark membership within the larger group of scouts.
    reason: lexical_alternative
  - marker: b
    text: Tearing one's clothes was a customary sign of grief, horror, or distress.
    reason: cultural_note
translation:
  language: ko
  text: 그 땅을 정탐했던 사람들 가운데 눈의 아들 여호수아와 여분네의 아들 갈렙은 자기들의 옷을 찢었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 정탐했던 사람들 중에서’. 히브리어 전치사는 여호수아와 갈렙이 더 큰 정탐자 집단에 속했음을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 옷을 찢는 것은 슬픔, 충격, 또는 괴로움을 나타내는 당시의 관습적 행위였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: And Joshua son of Nun
  chosen_korean: 그리하여 눈의 아들 여호수아
  alternatives_korean:
  - 그리고 눈의 아들 여호수아
  - 눈의 아들 여호수아는
  lexicon: HALOT
  rationale: 서사 연결 접속사 וְ/וִ는 문맥상 자연스럽게 ‘그리하여’로 옮기고, ילד-소속 표현은 한국어에서 가장 투명한 ‘~의 아들’ 구조로 유지했습니다.
- source_word: וְ/כָלֵב בֶּן יְפֻנֶּה
  english_pob_choice: and Caleb son of Jephunneh
  chosen_korean: 여분네의 아들 갈렙
  alternatives_korean:
  - 그리고 여분네의 아들 갈렙
  - 갈렙
  lexicon: HALOT
  rationale: 병렬 주어를 동일한 친족 표기로 맞추어 원문의 대칭성을 살렸고, 고유명사는 기존 한국어 성서 관용형을 따랐습니다.
- source_word: מִן הַ/תָּרִים אֶת הָ/אָ֑רֶץ
  english_pob_choice: from those who had spied out the land
  chosen_korean: 그 땅을 정탐하던 자들 가운데서
  alternatives_korean:
  - 그 땅을 정탐하던 자들 중에서
  - 그 땅을 정탐한 자들 가운데서
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 ‘~가운데서’로 처리했고, תרים는 현재분사보다 선행 행위를 드러내는 ‘정탐하던’이 문맥상 자연스럽습니다.
- source_word: קָרְעוּ בִּגְדֵי/הֶם
  english_pob_choice: tore their clothes
  chosen_korean: 자기들의 옷을 찢었습니다
  alternatives_korean:
  - 자기들의 옷을 찢어 버렸습니다
  - 옷을 찢었습니다
  lexicon: HALOT
  rationale: قָרַע는 물리적으로 ‘찢다’가 가장 직접적이며, בִּגְדֵי/הֶם은 현대 한국어에서 자연스러운 ‘옷’으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 옷을 찢는 행위의 의미 표지
  chosen_reading: 문자적 행위로 번역하되, 본문 자체가 드러내는 슬픔·충격의 문화적 신호를 추가 해설 없이 보존했습니다.
  alternative_readings:
  - ‘통곡했습니다’처럼 의미를 풀어쓰는 해석적 번역
  rationale: 히브리어는 실제 행위(옷을 찢음)를 말하므로, 독자에게 문화적 관습을 과도하게 대체하지 않고 원문 의미를 그대로 제시하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 문화적 관습 표지
- issue: ‘그 땅’의 범위
  chosen_reading: 명시된 단서 그대로 ‘그 땅’으로 유지하여 가나안 등 지리적 명칭을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘가나안 땅’으로 구체화
  rationale: 원문은 단지 הָאָרֶץ를 말하므로, 문맥상 이해되더라도 없는 정보를 본문에 추가하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 본문 범위 보존 원칙
