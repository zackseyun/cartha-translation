  lexicon: HALOT
  rationale: מַגֵּפָה는 여기서 야훼의 심판으로 내린 치명적 재앙을 가리키므로, 현대 한국어에서 이해가 분명한 ‘전염병’으로 옮겼습니다.
- source_word: לִ/פְנֵ֥י יְהוָֽה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주님 앞에서
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: די전승적 문맥의 여호와 이름 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, לִפְנֵי는 간결하고 엄숙한 ‘앞에서’가 적절합니다.
