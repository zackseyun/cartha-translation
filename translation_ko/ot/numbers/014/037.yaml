  rationale: מוֹצִאֵי의 ‘내어놓다/퍼뜨리다’ 감각을 살려 ‘퍼뜨린’으로 옮겼고, דִבָּה는 맥락상 해로운 보고이므로 ‘나쁜 보고’가 가장 자연스럽습니다.
- source_word: בַּ/מַּגֵּפָה
  english_pob_choice: by the plague
  chosen_korean: 전염병으로
  alternatives_korean:
