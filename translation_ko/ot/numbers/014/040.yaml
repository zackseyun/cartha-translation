  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
  footnotes:
  - marker: a
    text: Or, 'that the LORD said.' The Hebrew verb is simply 'said/spoke'; 'has spoken of' is chosen for natural English in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아침 일찍 일어나 산꼭대기로 올라가 이렇게 말했습니다. 「우리가 여기 있습니다. 야훼께서 말씀하신 곳으로 올라가겠습니다. 우리가 죄를 지었습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  english_pob_choice: They rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 아침에 일찍 일어나
  - 이른 아침에 일어나
  lexicon: HALOT
  rationale: שׁכם과 בֹּקֶר의 결합은 이른 기상과 출발을 함께 드러내므로, 한국어에서도 자연스럽게 ‘아침 일찍 일어나’로 옮겨 시간적 강조를 살렸습니다.
- source_word: אֶל רֹאשׁ הָהָר
  english_pob_choice: to the top of the mountain
  chosen_korean: 산꼭대기로
  alternatives_korean:
  - 산의 꼭대기로
  - 산 정상으로
  lexicon: HALOT
  rationale: ‘산의 머리’라는 히브리어 관용은 산의 정상/꼭대기를 뜻하므로, 현대 한국어 관용에 맞게 ‘산꼭대기’로 옮겼습니다.
- source_word: הִנֶּנּוּ
  english_pob_choice: Here we are
  chosen_korean: 우리가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 보십시오, 우리가 여기 있습니다
  lexicon: HALOT
  rationale: 자기 제시 공식이므로 단순한 ‘준비됨’보다 존재를 내세우는 말투를 살려 ‘우리가 여기 있습니다’로 번역했습니다.
- source_word: וְעָלִינוּ
  english_pob_choice: we will go up
  chosen_korean: 올라가겠습니다
  alternatives_korean:
  - 올라가겠습니다
  - 올라가자겠습니다
  - 올라가렵니다
  lexicon: HALOT
  rationale: 문맥상 선언적 의지와 미래를 함께 띠므로, 한국어에서는 공손한 의지 표현인 ‘올라가겠습니다’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명은 제목어 ‘주님’이 아니라 음역형 ‘야훼’로 유지하여 원문이 지닌 언약 이름을 드러냈습니다.
- source_word: חָטָאנוּ
  english_pob_choice: we have sinned
  chosen_korean: 우리는 죄를 지었습니다
  alternatives_korean:
  - 우리가 죄를 지었습니다
  - 우리는 죄를 범했습니다
  lexicon: HALOT
  rationale: 히브리어 חטא의 도덕적·신학적 무게를 살리되, 한국어에서 가장 자연스러운 고백 표현인 ‘죄를 지었습니다’를 택했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직역하여 고유한 언약적 이름을 드러냅니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문은 단순한 호칭이 아니라 이스라엘에게 알려진 하나님의 고유 이름을 사용하므로, 대체 호칭보다 음역을 유지하는 것이 원문 의미를 더 분명히 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
