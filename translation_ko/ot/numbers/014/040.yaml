  to: 그들은 아침 일찍 일어나 산꼭대기로 올라가 이렇게 말했습니다. 「우리가 여기 있습니다. 야훼께서 말씀하신 곳으로 올라가겠습니다. 우리가 죄를 지었습니다.」
  rationale: 순차적 행동을 나타내도록 ‘올라가며’를 ‘올라가 이렇게’로 고쳤습니다. 의미상 대안을 제공하지 않는 중복 각주는 삭제했습니다. 그 밖의 어휘와 존대체는 유지했습니다.
