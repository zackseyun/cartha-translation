base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
  footnotes:
  - marker: a
    text: Or 'your corpses will fall.' The Hebrew is vivid and concrete, emphasizing bodily death in the wilderness.
    reason: lexical_alternative
  - marker: b
    text: '''Who were counted'' refers to those enrolled in the census/muster.'
    reason: cultural_note
  - marker: c
    text: Or 'who have murmured against me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 광야에서 너희의 시체가 떨어질 것입니다. 곧, 계수된 너희 모두가, 스무 살부터 그 이상인 자들로서, 나를 원망한 자들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시체’는 히브리어의 육체적·구체적 표현을 살린 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘계수된’은 인구 조사 또는 군적 계수에 포함된 사람들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘원망한’은 단순한 불평보다 반항적 불만의 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  english_pob_choice: In this wilderness
  chosen_korean: 이 광야에서
  alternatives_korean:
  - 이 들판에서
  - 이 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר는 단순한 ‘사막’보다 광야가 출애굽·광야 심판의 문맥을 더 잘 살립니다.
- source_word: פִגְרֵיכֶם
  english_pob_choice: your dead bodies
  chosen_korean: 너희의 시체가
  alternatives_korean:
