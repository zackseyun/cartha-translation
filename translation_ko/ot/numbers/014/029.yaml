revisions:
- from: 이 광야에서 너희의 시체가 떨어질 것입니다. 곧, 계수된 너희 모두가, 스무 살부터 그 이상인 자들로서, 나를 원망한 자들입니다.[a][b][c]
  to: 이 광야에서 너희의 시체들이 쓰러질 것입니다. 곧 너희 가운데 계수된 모든 사람, 너희의 총수에 포함된 스무 살 이상인 사람들 가운데 나를 원망한 모든 사람이 쓰러질 것입니다.[a][b][c]
  rationale: The revision restores the Hebrew sentence’s judgment structure by making every qualified counted person the subject of ‘will fall.’ It uses natural Korean for the vivid corpse/fall imagery and represents both the census enrollment and the comprehensive-total phrase. Footnote anchors are placed after the full sentence and the complete footnote set matches them.
  reviewer_model: gpt-5.6-terra
