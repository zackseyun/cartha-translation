  lexicon: HALOT
  rationale: פגר는 육체적 죽음을 가리키는 말이므로, 한국어에서는 ‘시체’로 직설적으로 옮겨 심판의 구체성을 유지했습니다.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  english_pob_choice: all of you who were counted according to your whole number
  chosen_korean: 계수된 너희 모두가
  alternatives_korean:
  - 계수되어 등록된 너희 모두가
  - 너희 총수대로 계수된 자들 모두가
  lexicon: HALOT
  rationale: פְּקֻדִים과 מִסְפָּר는 인구 조사/계수의 배경을 가리키므로, ‘계수된’으로 간결하게 살려 그 제도적 의미를 보존했습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살부터 그 이상인 자들로서
  alternatives_korean:
  - 스무 살부터 그 위인 자들로서
  - 스무 살부터 나이 든 자들로서
  lexicon: HALOT
  rationale: 연령 기준 공식 표현을 한국어 관용으로 옮기되, 출발점과 포함 범위를 분명히 했습니다.
- source_word: הֲלִינֹתֶם עָלָי
  english_pob_choice: who have grumbled against me
  chosen_korean: 나를 원망한 자들입니다
  alternatives_korean:
  - 나에게 투덜거린 자들입니다
  - 나를 불평한 자들입니다
  lexicon: HALOT
  rationale: לון의 불평·원망 뉘앙스를 살리면서, 광야 본문에서 하나님의 권위에 대한 반항을 드러내는 ‘원망하다’를 택했습니다.
theological_decisions:
- issue: 죽음의 표상 보존
  chosen_reading: ‘너희의 시체가 떨어질 것입니다’로 직역해, 광야에서의 육체적 심판을 흐리지 않았습니다.
  alternative_readings:
  - 너희는 이 광야에서 죽을 것입니다
  - 너희의 주검이 이 광야에 쓰러질 것입니다
  rationale: 본문은 단순한 사망 통지가 아니라 몸이 실제로 광야에 떨어지는 심판을 말하므로, 완화하지 않고 구체성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: source-language primacy and preservation of vivid judgment imagery'
