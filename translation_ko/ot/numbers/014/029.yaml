source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
  footnotes:
  - marker: a
    text: Or 'your corpses will fall.' The Hebrew is vivid and concrete, emphasizing bodily death in the wilderness.
    reason: lexical_alternative
  - marker: b
    text: '''Who were counted'' refers to those enrolled in the census/muster.'
    reason: cultural_note
  - marker: c
    text: Or 'who have murmured against me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 광야에서 너희의 시체들이 쓰러질 것입니다. 곧 너희 가운데 계수된 모든 사람, 너희의 총수에 포함된 스무 살 이상인 사람들 가운데 나를 원망한 모든 사람이 쓰러질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 주검들이 쓰러질 것입니다.’ 히브리어는 광야에서 맞는 육체적 죽음을 구체적으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘계수된’과 ‘총수’는 인구 조사 또는 소집을 위해 등록된 사람들의 수를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나에게 불평한.’ 이 말은 광야 이야기에서 하나님을 향한 불만과 불평을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  english_pob_choice: In this wilderness
  chosen_korean: 이 광야에서
  alternatives_korean:
  - 이 들판에서
  - 이 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר는 단순한 ‘사막’보다 광야가 출애굽·광야 심판의 문맥을 더 잘 살립니다.
- source_word: פִגְרֵיכֶם
  english_pob_choice: your dead bodies
  chosen_korean: 너희의 시체가
  alternatives_korean:
  - 너희의 죽은 몸이
  - 너희의 주검이
  lexicon: HALOT
  rationale: פגר는 육체적 죽음을 가리키는 말이므로, 한국어에서는 ‘시체’로 직설적으로 옮겨 심판의 구체성을 유지했습니다.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  english_pob_choice: all of you who were counted according to your whole number
  chosen_korean: 계수된 너희 모두가
  alternatives_korean:
  - 계수되어 등록된 너희 모두가
  - 너희 총수대로 계수된 자들 모두가
  lexicon: HALOT
  rationale: פְּקֻדִים과 מִסְפָּר는 인구 조사/계수의 배경을 가리키므로, ‘계수된’으로 간결하게 살려 그 제도적 의미를 보존했습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살부터 그 이상인 자들로서
  alternatives_korean:
  - 스무 살부터 그 위인 자들로서
  - 스무 살부터 나이 든 자들로서
  lexicon: HALOT
  rationale: 연령 기준 공식 표현을 한국어 관용으로 옮기되, 출발점과 포함 범위를 분명히 했습니다.
- source_word: הֲלִינֹתֶם עָלָי
  english_pob_choice: who have grumbled against me
  chosen_korean: 나를 원망한 자들입니다
  alternatives_korean:
  - 나에게 투덜거린 자들입니다
  - 나를 불평한 자들입니다
  lexicon: HALOT
  rationale: לון의 불평·원망 뉘앙스를 살리면서, 광야 본문에서 하나님의 권위에 대한 반항을 드러내는 ‘원망하다’를 택했습니다.
theological_decisions:
- issue: 죽음의 표상 보존
  chosen_reading: ‘너희의 시체가 떨어질 것입니다’로 직역해, 광야에서의 육체적 심판을 흐리지 않았습니다.
  alternative_readings:
  - 너희는 이 광야에서 죽을 것입니다
  - 너희의 주검이 이 광야에 쓰러질 것입니다
  rationale: 본문은 단순한 사망 통지가 아니라 몸이 실제로 광야에 떨어지는 심판을 말하므로, 완화하지 않고 구체성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: source-language primacy and preservation of vivid judgment imagery'
