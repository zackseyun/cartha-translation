source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
  footnotes:
  - marker: a
    text: Or, 'For lack of the LORD's ability to bring this people into the land that he swore to give them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이 백성을 그들에게 주기로 맹세하신 그 땅으로 데려갈 수 없으셨기 때문에, 그분은 광야에서 그들을 살육하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 본문의 신적 이름은 호칭이 아니라 고유명으로 처리하는 것이 source-direct 원칙에 맞으므로, 관례적 대체어 대신 음역인 야훼를 사용했습니다.
- source_word: יְכֹלֶת
  english_pob_choice: was not able
  chosen_korean: 데려갈 수 없으셨기 때문에
  alternatives_korean:
  - 데려가실 수 없었기 때문에
  - 데려올 능력이 없으셨기 때문에
  lexicon: HALOT
  rationale: 문맥상 부정된 능력을 자연스럽게 풀어 한국어 원인절로 옮기되, 실제 어휘 의미인 ‘능력/가능성’을 유지하도록 ‘수 없으셨기 때문에’로 렌더링했습니다.
- source_word: לְהָבִיא אֶת הָעָם הַזֶּה אֶל הָאָרֶץ
  english_pob_choice: to bring this people into the land
  chosen_korean: 이 백성을 그 땅으로 데려갈
  alternatives_korean:
  - 이 백성을 그 땅으로 인도할
  - 이 백성을 그 땅 안으로 데려갈
  lexicon: HALOT
  rationale: הביא는 단순 이동보다 ‘어떤 곳으로 이르게 하다/데려가다’의 뜻이 강하므로, 목적어와 목적지를 살려 ‘데려갈’로 옮겼습니다.
- source_word: וַיִּשְׁחָטֵם
  english_pob_choice: he slaughtered them
  chosen_korean: 그분은 ... 그들을 살육하셨습니다
  alternatives_korean:
  - 그분은 ... 그들을 죽이셨습니다
  - 그분은 ... 그들을 도륙하셨습니다
  lexicon: HALOT
  rationale: שׁחט의 강한 폭력성과 ‘도살하다/학살하다’에 가까운 뉘앙스를 보존하기 위해, 완곡한 ‘죽이다’보다 ‘살육하다’를 택했습니다.
theological_decisions:
- issue: 본문이 야훼의 실제 무능을 진술하는지, 아니면 민족들이 그렇게 말할 것이라는 모독적 주장인지
  chosen_reading: 문맥상 민족들의 비난이 내용으로 제시되어 있으므로, 본문이 실제로 하나님의 무능을 확정하는 것이 아니라 그들이 그렇게 해석할 것이라는 수치를 드러냅니다.
  alternative_readings:
  - 하나님이 실제로 능하지 못했다는 진술로 읽기
  - 수사적 인용으로 완화하여 번역하기
  rationale: 히브리어와 POB 영어는 불신앙적 고발의 내용을 그대로 보존하므로, 이를 신학적으로 해소하지 않고 모욕적 주장 자체를 드러내는 방향을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
