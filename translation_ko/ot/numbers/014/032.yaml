lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  english_pob_choice: your dead bodies
  chosen_korean: 너희의 시체
  alternatives_korean:
  - 너희의 죽은 몸
  - 너희의 주검
  - 너희의 사체
  lexicon: HALOT
  rationale: פגר는 죽은 몸을 가리키므로, 문맥의 심판성과 생생함을 살리면서도 현대 한국어로 자연한 ‘시체’를 택했습니다.
- source_word: אַתֶּם
  english_pob_choice: as for you
  chosen_korean: 그러나 너희는
  alternatives_korean:
  - 너희는
  - 너희 자신은
  - 바로 너희는
  lexicon: HALOT
  rationale: 독립 인칭대명사의 대조적 강조를 한국어 접속부사 ‘그러나’와 주어 ‘너희는’으로 살렸습니다.
- source_word: יִפְּל֖וּ
  english_pob_choice: will fall
  chosen_korean: 쓰러질 것입니다
  alternatives_korean:
  - 떨어질 것입니다
  - 엎드러질 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: נפל의 여기서의 죽음-낙하 이미지를 한국어에서 가장 자연스럽고 엄중하게 전달하는 표현으로 ‘쓰러질 것입니다’를 선택했습니다.
- source_word: בַּ/מִּדְבָּ֥ר הַ/זֶּה
  english_pob_choice: in this wilderness
  chosen_korean: 이 광야에서
  alternatives_korean:
  - 이 황야에서
  - 이 광야 안에서
  - 이 광야 가운데서
  lexicon: HALOT
  rationale: מִדְבָּר의 표준적인 성서어역인 ‘광야’를 사용하고, 지시사 ‘this’를 ‘이’로 간명하게 반영했습니다.
theological_decisions:
- issue: 심판 경고의 구체성과 수위
  chosen_reading: ‘너희의 시체가 쓰러질 것입니다’
  alternative_readings:
  - 너희의 주검이 쓰러질 것입니다
  - 너희의 사체가 쓰러질 것입니다
  rationale: 본문은 불신앙 세대에 대한 실제적 심판을 선포하므로, 완곡하게 흐리지 않고 육체적 참상을 분명히 드러내는 표현을 유지했습니다.
  doctrine_reference: 민수기 14장의 불신앙에 대한 하나님의 심판 경고
