  verdict: revise
  source_fidelity: 마지막 절의 ‘살피십니다’는 פֹּקֵד의 사법적·징벌적 용례를 충분히 전달하지 못합니다. 이 문맥에서는 아버지들의 죄악을 자녀들에게 ‘갚으시다’라는 표현이 원문의 심판적 긴장과 ‘visiting ... on children’을 더 충실히 보존합니다. ‘죄 있는 자를 무죄로 돌리지 않으시며’는 נַקֵּה לֹא יְנַקֶּה의 강한 부정 및 사법적 의미를 자연스럽게 반영합니다.
  naturalness: ‘노하기를 더디 하시고’와 ‘인자하심이 풍성하시며’는 현대의 격식 있는 성경 문체에서 자연스럽습니다. 다만 ‘아버지들의 죄악을 자녀들에게, 곧 삼 대와 사 대까지 살피십니다’는 쉼표와 ‘곧’이 어색하고, ‘살피다’가 심판 행위를 약화합니다. ‘아버지들의 죄악을 자녀들에게 갚으시되, 삼 대와 사 대까지 이르게 하십니다’가 자연스럽고 명확합니다.
  terminology: ‘야훼’, ‘인자하심’, ‘죄악’, ‘허물’, ‘무죄로 돌리다’는 고유명과 주요 신학·법정 용어를 적절히 유지합니다. ‘갚으시되’는 פקד의 징벌적 의미를 표현하되 세대 간 작동 방식을 특정 교리로 해석하지 않습니다.
