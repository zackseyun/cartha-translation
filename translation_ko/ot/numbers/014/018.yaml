source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
  footnotes:
  - marker: a
    text: Or 'great in covenant loyalty,' 'rich in mercy,' or 'abounding in lovingkindness' for 'abundant in steadfast love.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'forgiving' is literally 'bearing' or 'carrying' iniquity and transgression.
    reason: lexical_alternative
  - marker: c
    text: Or 'he will certainly not leave unpunished' or 'he will not acquit.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'to the third and to the fourth' refers to generations.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서는 노하기를 더디 하시고, 인자하심이 풍성하시며[a], 죄악과 허물을 용서하시지만[b], 결코 죄 있는 자를 무죄로 돌리지 않으시며[c], 아버지들의 죄악을 자녀들에게 갚으시되, 삼 대와 사 대까지 이르게 하십니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자하심’은 히브리어 חֶסֶד의 언약적·자비적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘지다’ 또는 ‘짊어지다’에 가깝지만, 이 문맥에서는 용서의 의미로 읽힙니다.
    reason: lexical_alternative
  - marker: c
    text: ‘죄 있는 자를 무죄로 돌리지 않으시며’는 히브리어의 강한 부정을 사법적으로 풀어 옮긴 표현입니다. 달리 ‘결코 벌하지 않은 채 두지 않으신다’ 또는 ‘무죄로 선언하지 않으신다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘삼 대와 사 대’는 세대들을 가리키는 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/전통적 신명 표기 관행
  rationale: 고유한 언약 이름을 제목이 아니라 이름으로 드러내기 위해 POB의 'Yahweh'에 맞춰 '야훼'를 사용했습니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: slow to anger
  chosen_korean: 노하기를 더디 하시고
  alternatives_korean:
  - 분노가 느리시고
  - 오래 참으시고
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미를 한국어 관용 표현으로 옮겨, 문자적 이미지보다 지체된 분노라는 뜻을 살렸습니다.
- source_word: רַב חֶסֶד
  english_pob_choice: abundant in steadfast love
  chosen_korean: 인자하심이 풍성하시며
  alternatives_korean:
  - 언약적 신실함이 풍성하시며
  - 은혜가 풍성하시며
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·관계적 뉘앙스를 '인자하심'으로 살리고, רַב의 풍성함을 '풍성하시며'로 대응했습니다.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  english_pob_choice: forgiving iniquity and transgression
  chosen_korean: 죄악과 허물을 용서하시지만
  alternatives_korean:
  - 죄악과 허물을 지니시지만
  - 죄악과 허물을 담당하시지만
  lexicon: HALOT
  rationale: נשא의 문자적 '짊어지다/지다'를 그대로 풀기보다, 이 찬양 공식에서 요구되는 의미인 용서로 자연스럽게 옮겼습니다. '죄악'과 '허물'은 두 죄 용어의 구분을 유지합니다.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  english_pob_choice: clear the guilty
  chosen_korean: 결코 죄 있는 자를 무죄로 돌리지 않으시며
  alternatives_korean:
  - 결코 죄를 없던 일로 하지 않으시며
  - 결코 무죄 판결을 내리지 않으시며
  lexicon: HALOT
  rationale: 히브리어의 강한 부정을 사법적 표현으로 살리되, POB의 'clear the guilty'가 요구하는 판결 의미를 한국어로 분명하게 드러냈습니다.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  english_pob_choice: to the third and to the fourth generation
  chosen_korean: 삼 대와 사 대까지
  alternatives_korean:
  - 삼 대와 사 대에
  - 3대와 4대까지
  lexicon: HALOT
  rationale: 히브리어의 세대 표현을 한국어에서 통용되는 '삼 대, 사 대'로 풀어 세대 범위를 명확히 했습니다.
theological_decisions:
- issue: 하나님의 자비와 न्याय의 긴장
  chosen_reading: 용서하시는 하나님이면서도 죄를 무죄로 돌리지 않으시는 분이라는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 자비 쪽으로만 부드럽게 표현한다
  - 징벌적 의미를 약화시켜 자연적 결과로만 읽는다
  rationale: 본문은 용서와 심판을 함께 말하므로, 둘 사이의 긴장을 해소하지 않고 병렬로 보존하는 것이 원문 충실에 맞습니다.
  doctrine_reference: '번역 원칙: 본문이 드러내는 신학적 긴장을 보존함'
- issue: 세대에 대한 징벌 표현
  chosen_reading: '''삼 대와 사 대''를 역사적·세대적 범위로 읽되, 아버지들의 죄악이 자녀들에게 미친다는 본문의 표상을 그대로 살렸습니다.'
  alternative_readings:
  - 개인의 책임을 강조해 약화한다
  - 단순한 사회적 후과로만 바꾼다
  rationale: 히브리어 관용을 현대적으로 풀되, 본문이 의도하는 세대적 경고를 축소하지 않았습니다.
  doctrine_reference: 본문의 세대적 경고를 보존하는 번역 원칙
