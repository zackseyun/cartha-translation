id: NUM.14.15
reference: Numbers 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
  footnotes:
  - marker: a
    text: Hebrew 'as one man,' an idiom meaning the whole people together or all at once.
    reason: lexical_alternative
  - marker: b
    text: Or 'that have heard the report about you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 이 백성을 한 사람처럼 죽이신다면, 주에 관한 소식을 들은 민족들이 말할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘한 사람처럼’은 온 백성이 함께 또는 한꺼번에 죽는다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주에 대한 보고를 들은 민족들이’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  english_pob_choice: And if you kill
  chosen_korean: 주께서 이 백성을 한 사람처럼 죽이신다면
  alternatives_korean:
  - 주께서 이 백성을 죽이신다면
  - 주께서 이 백성을 한 사람처럼 죽게 하신다면
  lexicon: WLC/HALOT
  rationale: 히필형 מות은 ‘죽이다/죽게 하다’의 원인적 의미이므로 능동적으로 옮겼고, 앞문맥의 조건적 호소를 살려 ‘-신다면’으로 처리했습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 ժողովուրդ
  - 이 민족
  lexicon: WLC/HALOT
  rationale: 여기서는 이스라엘 공동체 전체를 가리키는 עָם이므로, 가장 직접적이고 자연스러운 ‘이 백성’이 적절합니다.
- source_word: כְאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로
  - 한 사람같이
  - 모두 한꺼번에
  lexicon: WLC/HALOT
  rationale: 직역하면 ‘한 사람처럼’이지만, 한국어에서 ‘한 사람’은 단일 인물의 느낌이 강해 군체 전체가 함께 쓰러진다는 관용적 뜻을 자연스럽게 드러내도록 했습니다. 본문의 총체성을 보존하는 방향입니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 열방이
  lexicon: WLC/HALOT
  rationale: 가나안/주변 세계를 가리키는 복수 집단이므로 ‘민족들’이 현대 한국어에서 가장 무리 없이 대응합니다.
- source_word: שִׁמְעֲךָ
  english_pob_choice: your report / your fame
  chosen_korean: 주의 소식
  alternatives_korean:
  - 주에 대한 소문
  - 주의 명성
  - 주에 대한 보고
  lexicon: WLC/HALOT
  rationale: שֵׁמַע는 ‘소식, 보고, 소문, 명성’의 폭이 있으므로, 여기서는 주변 민족들이 들은 내용이라는 점을 살려 ‘소식’으로 옮겼습니다. 영어 POB의 오디트가 지시하는 ‘report’ 의미도 포함됩니다.
theological_decisions:
- issue: 주어 표지와 신명칭의 직접성
  chosen_reading: 모세의 간구이므로 직접 화법의 주어를 ‘주께서’로 처리하고, 야훼의 호칭은 문맥상 ‘주’로 드러내었습니다.
  alternative_readings:
  - 하나님께서
  - 여호와께서
  rationale: 문맥상 이는 하나님께 드리는 탄원문이므로 한국어 합쇼체에서 가장 자연스럽고 존중을 담은 ‘주’가 적절합니다. 본문 자체에는 יהוה가 있으나, 이 절만으로는 단독 표기보다 대화 상대를 살리는 쪽이 읽기 쉽습니다.
  doctrine_reference: POB 한글 용어 기본 원칙
