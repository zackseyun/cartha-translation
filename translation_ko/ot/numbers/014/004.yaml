  lexicon: HALOT
  rationale: ‘머리’를 직역하면 한국어에서 어색하므로, 여기서는 집단 위에 세우는 통치/지휘 인물을 뜻하는 기능적 의미를 살려 ‘지도자’를 택했습니다.
