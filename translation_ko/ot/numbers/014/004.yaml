  lexicon: HALOT
  rationale: 히브리어 공의형(권유형) 흐름을 한국어 청유형으로 자연스럽게 옮겼습니다.
- source_word: מִצְרָיְמָה
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 애굽으로
  - 이집트 땅으로
  lexicon: HALOT
  rationale: 지명은 현대 표준어 외래어 표기를 따르되, 출애굽 서술의 역사적 지명을 자연스럽게 드러냈습니다.
