  rationale: 직역하면 ‘사람이 자기 형제에게’이지만, 문맥상 상호 간의 발화를 뜻하는 관용구이므로 ‘서로’가 의미를 가장 정확하게 전달합니다.
- source_word: נִתְּנָה רֹאשׁ
  english_pob_choice: Let us appoint a leader
  chosen_korean: 한 지도자를 세우고
