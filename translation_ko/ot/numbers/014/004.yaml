base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
  footnotes:
  - marker: a
    text: Literally, 'each man to his brother.' The Hebrew idiom means they spoke reciprocally among themselves.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Let us set a head.' Here 'head' means a person placed over the group, that is, a leader.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로[a] 말했습니다. “한 지도자[b]를 세우고 이집트로 돌아갑시다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘각 사람이 자기 형제에게’이지만, 여기서는 서로 말하는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘머리’는 문자적 신체 부위가 아니라 집단 위에 세우는 우두머리, 즉 지도자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 서로 말했습니다
  alternatives_korean:
  - 그들이 말했습니다
  - 그리고 그들이 말했습니다
