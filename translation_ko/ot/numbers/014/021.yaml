lexical_decisions:
- source_word: וְ/אוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그렇지만
  lexicon: HALOT
  rationale: 강한 대조를 나타내는 접속사로, 문맥상 앞선 진술과 선명하게 대비시키는 현대 한국어 표현으로는 ‘그러나’가 가장 자연스럽습니다.
- source_word: חַי אָ֑נִי
  english_pob_choice: as I live
  chosen_korean: 내가 살아 있는 한
  alternatives_korean:
  - 내가 살기 때문에
