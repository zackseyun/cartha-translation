base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
  footnotes:
  - marker: a
    text: Or 'the whole land,' if taken with a more local sense of Hebrew אֶרֶץ.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 살아 있는 한, 야훼의 영광이 온 땅에 가득 찰 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 땅’은 ‘온 세상’으로도 옮길 수 있습니다. 히브리어 אֶרֶץ가 여기서는 더 보편적인 범위를 가리킬 수 있기 때문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그렇지만
  lexicon: HALOT
  rationale: 강한 대조를 나타내는 접속사로, 문맥상 앞선 진술과 선명하게 대비시키는 현대 한국어 표현으로는 ‘그러나’가 가장 자연스럽습니다.
- source_word: חַי אָ֑נִי
  english_pob_choice: as I live
  chosen_korean: 내가 살아 있는 한
  alternatives_korean:
  - 내가 살기 때문에
  - 내가 살아 있다
  - 내 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 신적 맹세 공식을 한국어에서 지나치게 직역하지 않으면서도, 하나님의 생명을 두고 하시는 엄숙한 선서적 발화를 드러내기 위해 ‘내가 살아 있는 한’으로 옮겼습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
  - 야훼의 위엄
  - 주의 영광
  lexicon: HALOT
  rationale: כָּבוֹד는 여기서 하나님의 임재와 드러남을 가리키는 표준적 의미이므로 ‘영광’이 가장 적절하며, 본문 속 여호와 이름은 프로젝트 기본어인 ‘야훼’로 반영했습니다.
- source_word: אֶת כָּל הָ/אָֽרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅 전체
  - 온 세계
  lexicon: HALOT
  rationale: POB의 주석이 허용하듯 אֶרֶץ는 ‘땅/지면’보다 넓게는 ‘세상’까지 갈 수 있지만, 여기서는 ‘온 땅’이 보편적 범위를 자연스럽고도 원문에 가깝게 전달합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에는 ‘야훼’로 옮겨, 하나님의 이름이 인격적 언약 명칭임을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 규범에 따라 יהוה는 학술적 전사 ‘야훼’를 사용해, 전통적 대체어보다 원문 고유성을 더 직접적으로 보존합니다.
  doctrine_reference: 'translation policy: source-language primacy and auditable divine-name rendering'
