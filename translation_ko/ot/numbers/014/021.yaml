  - 주의 영광
  lexicon: HALOT
  rationale: כָּבוֹד는 여기서 하나님의 임재와 드러남을 가리키는 표준적 의미이므로 ‘영광’이 가장 적절하며, 본문 속 여호와 이름은 프로젝트 기본어인 ‘야훼’로 반영했습니다.
- source_word: אֶת כָּל הָ/אָֽרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅 전체
  - 온 세계
  lexicon: HALOT
  rationale: POB의 주석이 허용하듯 אֶרֶץ는 ‘땅/지면’보다 넓게는 ‘세상’까지 갈 수 있지만, 여기서는 ‘온 땅’이 보편적 범위를 자연스럽고도 원문에 가깝게 전달합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에는 ‘야훼’로 옮겨, 하나님의 이름이 인격적 언약 명칭임을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 규범에 따라 יהוה는 학술적 전사 ‘야훼’를 사용해, 전통적 대체어보다 원문 고유성을 더 직접적으로 보존합니다.
  doctrine_reference: 'translation policy: source-language primacy and auditable divine-name rendering'
