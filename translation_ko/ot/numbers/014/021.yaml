  - 내 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 신적 맹세 공식을 한국어에서 지나치게 직역하지 않으면서도, 하나님의 생명을 두고 하시는 엄숙한 선서적 발화를 드러내기 위해 ‘내가 살아 있는 한’으로 옮겼습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
