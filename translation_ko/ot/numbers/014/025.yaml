  text: Now the Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds.'' Traditionally rendered ''Red Sea.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아말렉 사람들과 가나안 사람들은 골짜기에 살고 있습니다[a]. 내일 너희는 방향을 돌려 홍해 길로 광야를 향해 떠나십시오.
  philosophy: optimal-equivalence
  footnotes:
