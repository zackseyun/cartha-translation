  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: Now the Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds.'' Traditionally rendered ''Red Sea.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아말렉 사람들과 가나안 사람들은 골짜기에 살고 있습니다[a]. 내일은 돌아서서 여러분 자신을 위해 광야로, 홍해로 가는 길로 떠나십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘갈대 바다’입니다. 전통적으로는 ‘홍해’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי
  english_pob_choice: Now the Amalekites
  chosen_korean: 이제 아말렉 사람들
  alternatives_korean:
  - 그리고 아말렉 사람들
  - 아말렉 족속
  lexicon: HALOT
  rationale: 문맥상 새 정보의 전환을 나타내는 וְ를 한국어에서는 ‘이제’로 살렸고, יחיד형 집합명사는 자연스러운 복수 집단명사로 옮겼습니다.
- source_word: וְהַכְּנַעֲנִי
  english_pob_choice: and the Canaanites
  chosen_korean: 가나안 사람들
  alternatives_korean:
  - 그리고 가나안 사람들
  - 가나안 족속
  lexicon: HALOT
  rationale: 아말렉 사람들과 병렬되는 집합명사이므로 한국어에서도 복수 집단 표현을 택해 의미를 분명히 했습니다.
- source_word: יוֹשֵׁב בָּעֵמֶק
  english_pob_choice: are living in the valley
  chosen_korean: 골짜기에 살고 있습니다
  alternatives_korean:
  - 골짜기에 거주하고 있습니다
  - 골짜기에 머물고 있습니다
  lexicon: HALOT
  rationale: משך되는 상태를 나타내는 분사형을 현재 진행/상태로 자연스럽게 옮겼고, עֵמֶק은 이 문맥에서 ‘골짜기’가 가장 직접적입니다.
- source_word: דֶּרֶךְ יַם סוּף
  english_pob_choice: by the way of the Red Sea
  chosen_korean: 홍해로 가는 길로
  alternatives_korean:
  - 홍해의 길로
  - 갈대 바다로 가는 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 경로 의미를 살려 ‘가는 길로’로 옮겼습니다. יַם סוּף은 본문 본역에서는 통용 지명인 ‘홍해’를 따르되, 더 문자적인 대안은 각주로 처리할 수 있습니다.
theological_decisions:
- issue: יַם סוּף의 지명 표기
  chosen_reading: 본문에는 ‘홍해’로 두고, 각주로 ‘갈대 바다’의 문자적 의미를 밝힙니다.
  alternative_readings:
  - 본문을 ‘갈대 바다’로 직접 옮김
  - ‘홍해’만 유지하고 문자적 의미는 생략
  rationale: 한국어 교회권에서 널리 알려진 지명성을 살리면서도, 히브리어의 보다 직접적인 의미가 있음을 숨기지 않기 위해 이중 처리를 택했습니다.
  doctrine_reference: 번역 투명성 및 지명 용례 일관성
