  lexicon: HALOT
  rationale: 아말렉 사람들과 병렬되는 집합명사이므로 한국어에서도 복수 집단 표현을 택해 의미를 분명히 했습니다.
- source_word: יוֹשֵׁב בָּעֵמֶק
  english_pob_choice: are living in the valley
  chosen_korean: 골짜기에 살고 있습니다
  alternatives_korean:
  - 골짜기에 거주하고 있습니다
  - 골짜기에 머물고 있습니다
  lexicon: HALOT
  rationale: משך되는 상태를 나타내는 분사형을 현재 진행/상태로 자연스럽게 옮겼고, עֵמֶק은 이 문맥에서 ‘골짜기’가 가장 직접적입니다.
- source_word: דֶּרֶךְ יַם סוּף
  english_pob_choice: by the way of the Red Sea
  chosen_korean: 홍해로 가는 길로
  alternatives_korean:
  - 홍해의 길로
  - 갈대 바다로 가는 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 경로 의미를 살려 ‘가는 길로’로 옮겼습니다. יַם סוּף은 본문 본역에서는 통용 지명인 ‘홍해’를 따르되, 더 문자적인 대안은 각주로 처리할 수 있습니다.
theological_decisions:
- issue: יַם סוּף의 지명 표기
  chosen_reading: 본문에는 ‘홍해’로 두고, 각주로 ‘갈대 바다’의 문자적 의미를 밝힙니다.
