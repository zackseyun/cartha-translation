  rationale: 한국어 교회권에서 널리 알려진 지명성을 살리면서도, 히브리어의 보다 직접적인 의미가 있음을 숨기지 않기 위해 이중 처리를 택했습니다.
  doctrine_reference: 번역 투명성 및 지명 용례 일관성
