translation:
  language: ko
  text: 그때 모세와 아론은 이스라엘 자손[a] 회중의 온 총회[b] 앞에서 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역적 표현입니다. ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘총회’와 ‘회중’에 해당하는 두 관련 공동체 명사를 함께 사용하여 온 공동체가 공적으로 모인 모습을 강조합니다.
    reason: lexical_alternative
