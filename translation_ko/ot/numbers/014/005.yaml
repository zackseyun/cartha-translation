  to: 그때 모세와 아론은 이스라엘 자손[a] 회중의 온 총회[b] 앞에서 얼굴을 땅에 대고 엎드렸습니다.
  rationale: ‘이스라엘 자손’을 유지하고, קְהַל עֲדַת의 두 공동체 명사를 ‘회중의 온 총회’로 보존했습니다. 동작 표현은 원문의 ‘그들의 얼굴 위에’라는 관용구를 현대 한국어에서 자연스럽게 드러내는 기존 표현을 유지했습니다. 각주 표지는 각각의 관련 어구 바로 뒤로 옮기고, 주석 내용을 한국어 번역에 직접 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:34Z'
