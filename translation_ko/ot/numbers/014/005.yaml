  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression 'assembly of the congregation' preserves two related communal terms for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세와 아론은 온 이스라엘 자손의 회중 앞에서 얼굴을 땅에 대고 엎드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역적 표현입니다. 영어 POB의 note처럼, 이는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회중 앞에서’는 영어 POB가 보존한 ‘assembly of the congregation’의 이중 공동체 표현을 한국어에서 자연스럽게 살린 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  english_pob_choice: fell
  chosen_korean: 엎드렸습니다
  alternatives_korean:
  - 쓰러졌습니다
  - 넘어졌습니다
  lexicon: HALOT
  rationale: 히브리어의 기본 동작인 ‘떨어지다/엎드리다’ 가운데, 이어지는 ‘얼굴을 땅에 대고’와 결합될 때 예배적·간구적 엎드림이 분명해져 한국어에서는 자연스럽게 ‘엎드렸습니다’로 옮겼습니다.
- source_word: עַל פְּנֵיהֶם
  english_pob_choice: on their faces
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 얼굴 위에
  - 얼굴을 바닥에 대고
  lexicon: HALOT
  rationale: 히브리어 관용구가 가리키는 전면적인 엎드림을 드러내기 위해, 직역적이면서도 한국어에서 실제 동작이 선명한 표현을 택했습니다.
- source_word: קְהַל עֲדַת
  english_pob_choice: assembly of the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 총회
  - 공동체
  lexicon: HALOT
  rationale: 영어 POB가 두 관련 공동체 용어를 함께 살린 점을 반영하되, 한국어에서는 중복을 과도하게 늘리지 않고 공적인 집합체를 뜻하는 ‘회중’으로 압축해 의미를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 무리 없이 드러내는 성서적 상투어인 ‘이스라엘 자손’을 사용해, 원문의 민족명과 문체를 보존했습니다.
theological_decisions:
- issue: 공적 굴복 동작의 강도
  chosen_reading: ‘엎드렸습니다’와 ‘얼굴을 땅에 대고’를 함께 써서, 단순한 넘어짐이 아니라 하나님 앞에서의 공적·전면적 굴복을 드러냈습니다.
  alternative_readings:
  - ‘무릎을 꿇었습니다’
  - ‘땅에 엎드렸습니다’
  rationale: 문맥상 지도자들이 공동체 앞에서 깊이 낮아지는 장면이므로, 히브리어 관용구의 강도를 약화하지 않고 시각적으로 분명하게 표현하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
