  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 무리 없이 드러내는 성서적 상투어인 ‘이스라엘 자손’을 사용해, 원문의 민족명과 문체를 보존했습니다.
theological_decisions:
- issue: 공적 굴복 동작의 강도
  chosen_reading: ‘엎드렸습니다’와 ‘얼굴을 땅에 대고’를 함께 써서, 단순한 넘어짐이 아니라 하나님 앞에서의 공적·전면적 굴복을 드러냈습니다.
  alternative_readings:
  - ‘무릎을 꿇었습니다’
  - ‘땅에 엎드렸습니다’
  rationale: 문맥상 지도자들이 공동체 앞에서 깊이 낮아지는 장면이므로, 히브리어 관용구의 강도를 약화하지 않고 시각적으로 분명하게 표현하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
