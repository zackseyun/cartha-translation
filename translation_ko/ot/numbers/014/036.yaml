revisions:
- from: 이제 모세가 그 땅을 정탐하도록 보낸 사람들이 돌아와서, 온 회중이 그를 원망하게 하며 그 땅에 대해 나쁜 소문을 퍼뜨렸습니다[a][b].
  to: 모세가 그 땅을 정탐하도록 보낸 그 사람들이 돌아와, 그 땅에 대한 악평을 퍼뜨려 온 회중이 모세에게 불평하게 했습니다[a][b].
