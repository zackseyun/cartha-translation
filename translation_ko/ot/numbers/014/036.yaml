    rationale: 가능한 번역이나, 여기의 דִבָּה는 단순한 소문보다 땅을 헐뜯는 부정적 보고/악평입니다. 본문에는 ‘악평’을 쓰고 ‘나쁜 소문’을 각주 대안으로 제시하는 것이 적절합니다.
