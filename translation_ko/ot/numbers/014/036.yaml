source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: Now the men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
  footnotes:
  - marker: a
    text: Or 'to spy out the land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'spread a bad report about the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그 땅을 정탐하도록 보낸 그 사람들이 돌아와, 그 땅에 대한 악평을 퍼뜨려 온 회중이 모세에게 불평하게 했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 탐지하다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅에 대한 나쁜 소문을 퍼뜨리다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  english_pob_choice: Now the men
  chosen_korean: 이제 그 사람들이
  alternatives_korean:
  - 그리고 그 사람들은
  - 또 그 사람들은
  lexicon: HALOT
  rationale: 서사 전환을 자연스럽게 살리기 위해 문두를 ‘이제’로 시작했고, 문맥상 특정한 정탐꾼들을 가리키므로 ‘그 사람들’로 옮겼습니다.
- source_word: שָׁלַח ... לָתוּר אֶת־הָאָרֶץ
  english_pob_choice: sent to scout out the land
  chosen_korean: 그 땅을 정탐하도록 보낸
  alternatives_korean:
  - 그 땅을 살피도록 보낸
  - 그 땅을 탐지하도록 보낸
  lexicon: HALOT
  rationale: לָתוּר는 여기서 단순한 탐색이 아니라 정탐/정찰의 성격이 강하므로 ‘정탐하다’가 가장 직접적입니다.
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: returned
  chosen_korean: 돌아와서
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아와
  lexicon: HALOT
  rationale: 다음 절의 결과를 이어 주는 서사적 용법을 살려 연결형으로 처리했습니다.
- source_word: וילונו עָלָיו אֶת כָּל הָעֵדָה
  english_pob_choice: caused the whole congregation to grumble against him
  chosen_korean: 온 회중이 그를 원망하게 하며
  alternatives_korean:
  - 온 회중이 그에게 불평하게 하며
  - 온 회중이 그에게 수군거리게 하며
  lexicon: HALOT
  rationale: 히브리어는 단순한 개인 불평이 아니라 회중 전체의 불만을 일으키는 행위이므로 인과를 드러내어 옮겼습니다. ‘원망하다’가 광야 본문의 집단적 불평 뉘앙스를 잘 살립니다.
- source_word: לְהוֹצִיא דִבָּה
  english_pob_choice: by bringing out a bad report
  chosen_korean: 나쁜 소문을 퍼뜨렸습니다
  alternatives_korean:
  - 악한 소문을 내었습니다
  - 나쁜 보고를 했습니다
  lexicon: HALOT
  rationale: דִבָּה는 단순 정보 전달이 아니라 평판을 해치는 험담/악평의 뉘앙스가 있어 ‘나쁜 소문’으로 옮겼고, הוֹצִיא의 동작성을 한국어 관용에 맞게 ‘퍼뜨리다’로 풀었습니다.
- source_word: אֶת כָּל הָעֵדָה
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 모든 회중
  lexicon: HALOT
  rationale: עֵדָה는 출애굽/광야 문맥의 집합적 이스라엘 공동체를 가리키므로 ‘회중’이 가장 적절합니다.
theological_decisions:
- issue: 회중의 불평을 일으킨 주체와 그 인과 관계
  chosen_reading: 정탐꾼들이 돌아와 회중 전체가 모세를 원망하게 만들고, 이어서 그 땅에 대한 악평을 퍼뜨린 것으로 옮겼습니다.
  alternative_readings:
  - 그들이 직접 모세를 원망했다
  - 회중이 저절로 원망했다
  rationale: 히브리어 동사는 단순 병렬보다 ‘그 결과 회중이 원망하게 됨’이라는 인과를 강하게 드러내므로, 본문의 책임 소재를 흐리지 않도록 했습니다.
  doctrine_reference: 민수기 14장의 공동체 불신과 지도자 반역의 서술 구조
