    issue: 문두의 ‘이제’
    rationale: וְהָאֲנָשִׁים의 וְ는 접속·서사 진행을 나타내지만 명시적인 시간 부사 ‘이제’를 요구하지 않습니다. 영어 감사 기록에서도 같은 이유로 ‘Now’가 제거되었습니다.
