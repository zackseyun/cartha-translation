  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
  footnotes:
  - marker: a
    text: Or 'to explore the land' or 'to scout the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 눈의 아들 여호수아와 여분네의 아들 갈렙은, 그 땅을 정탐하러 갔던 그 사람들 가운데서 살아남았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 탐사하러’ 또는 ‘그 땅을 살피러’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  english_pob_choice: But Joshua
  chosen_korean: 그러나 … 여호수아
  alternatives_korean:
  - 그리고 … 여호수아
  - 또 여호수아
  lexicon: HALOT
  rationale: 문맥상 앞절의 죽음과 대비를 이루는 접속의 뉘앙스를 살려 ‘그러나’로 옮겼고, 인명은 통용되는 한국어 성경형을 따랐습니다.
- source_word: בִּן נוּן
  english_pob_choice: son of Nun
  chosen_korean: 눈의 아들
  alternatives_korean:
  - 누운의 아들
  - 누운의 자
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 자연스러운 한국어 소유격으로 옮겼습니다.
- source_word: חָיוּ
  english_pob_choice: remained alive
  chosen_korean: 살아남았습니다
  alternatives_korean:
  - 살았습니다
  - 생존했습니다
  lexicon: HALOT
  rationale: 단순히 ‘살다’보다 앞선 집단의 죽음과 대비되는 생존 결과를 더 분명히 드러냅니다.
- source_word: לָתוּר אֶת הָאָרֶץ
  english_pob_choice: to spy out the land
  chosen_korean: 그 땅을 정탐하러
  alternatives_korean:
  - 그 땅을 탐지하러
  - 그 땅을 살피러
  lexicon: HALOT
  rationale: POB의 ‘spy out’는 정탐 임무의 의미를 반영하므로, 한국어에서도 군사·정탐적 색채가 있는 ‘정탐하다’를 유지했습니다.
theological_decisions:
- issue: ‘from among those men’의 집합 대비를 어떻게 살릴지
  chosen_reading: ‘그 사람들 가운데서’로 옮겨, 두 사람이 정탐대 전체 가운데 예외적으로 살아남았다는 대비를 드러냈습니다.
  alternative_readings:
  - ‘그 사람들 중에서’
  - ‘그 사람들로부터’
  rationale: 히브리어 מִן은 단순 출처가 아니라 집단 내부에서의 분리를 나타낼 수 있으므로, 생존의 대비를 자연스럽게 표현했습니다.
  doctrine_reference: 본문 서술의 문맥적 강조
