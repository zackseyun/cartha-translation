  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
  footnotes:
  - marker: a
    text: Or, 'they acted presumptuously' or 'they defiantly went up.' The Hebrew verb carries the sense of willful, presumptuous action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the ark of the covenant of the LORD'; alternatively, 'the ark of the LORD's covenant.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 산꼭대기로 올라가려는 분수에 넘친 행동을 했습니다[a]. 그러나 야훼의 언약궤와 모세는 진영 한가운데에서 움직이지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 '분수에 넘치다', '주제넘게 행동하다', '함부로 올라가다'의 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '야훼의 언약궤' 또는 '야훼의 언약의 궤'로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  english_pob_choice: they presumed
  chosen_korean: 분수에 넘친 행동을 했습니다
  alternatives_korean:
  - 함부로 올라갔습니다
  - 분수에 넘쳐 올라갔습니다
  - 거만하게 올라갔습니다
  lexicon: HALOT
  rationale: 히브리어 עפל의 뉘앙스는 단순한 이동이 아니라 하나님의 뜻을 거슬러 무모하고 불손하게 나아가는 행동이어서, 한국어에서는 결과보다 태도를 드러내는 표현으로 옮겼습니다.
- source_word: אֶל רֹאשׁ הָהָר
  english_pob_choice: to the top of the mountain
  chosen_korean: 산꼭대기로
  alternatives_korean:
  - 산의 꼭대기로
  - 산 정상으로
  - 산의 머리로
  lexicon: HALOT
  rationale: רֹאשׁ의 문자적 '머리'를 한국어 관용으로 자연스럽게 풀어 '산꼭대기'로 옮겨, 상승 방향과 목적지를 간명하게 나타냈습니다.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼의 언약의 궤
  - 야훼와 맺은 언약의 궤
  lexicon: HALOT
  rationale: 히브리어의 소유 구조를 자연스럽게 압축해 '야훼의 언약궤'로 옮겼고, יְהוָה는 이 프로젝트 기본 원칙에 따라 '야훼'로 표기했습니다.
- source_word: לֹא מָשׁוּ מִקֶּרֶב הַמַּחֲנֶה
  english_pob_choice: did not move from the midst of the camp
  chosen_korean: 진영 한가운데에서 움직이지 않았습니다
  alternatives_korean:
  - 진영 한복판에서 떠나지 않았습니다
  - 진영 가운데에서 물러서지 않았습니다
  - 진영 한가운데를 떠나지 않았습니다
  lexicon: HALOT
  rationale: מוש의 '움직이다/떠나다' 의미를 살려, 모세와 궤가 백성의 진영 한가운데에 그대로 남아 있었음을 분명히 했습니다.
theological_decisions:
- issue: שׁם יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 사용하는 언약 이름을 보존하기 위해 '야훼'를 택했습니다. 이는 칭호로 바꾸기보다 하나님의 고유한 이름을 드러내려는 프로젝트 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: וַיַּעְפִּלוּ의 책임 있는 뉘앙스
  chosen_reading: 분수에 넘친 행동을 했습니다
  alternative_readings:
  - 무모하게 올라갔습니다
  - 불손하게 올라갔습니다
  - 감히 올라갔습니다
  rationale: 이 동사는 단순한 등반이 아니라 앞선 명령과 현존을 무시한 반역적 추진을 포함하므로, 한국어에서도 도덕적 책임을 드러내는 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
