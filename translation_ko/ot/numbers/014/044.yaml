  - 불손하게 올라갔습니다
  - 감히 올라갔습니다
  rationale: 이 동사는 단순한 등반이 아니라 앞선 명령과 현존을 무시한 반역적 추진을 포함하므로, 한국어에서도 도덕적 책임을 드러내는 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
