- source_word: לֹא מָשׁוּ מִקֶּרֶב הַמַּחֲנֶה
  english_pob_choice: did not move from the midst of the camp
  chosen_korean: 진영 한가운데에서 움직이지 않았습니다
  alternatives_korean:
  - 진영 한복판에서 떠나지 않았습니다
  - 진영 가운데에서 물러서지 않았습니다
  - 진영 한가운데를 떠나지 않았습니다
  lexicon: HALOT
  rationale: מוש의 '움직이다/떠나다' 의미를 살려, 모세와 궤가 백성의 진영 한가운데에 그대로 남아 있었음을 분명히 했습니다.
theological_decisions:
- issue: שׁם יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 사용하는 언약 이름을 보존하기 위해 '야훼'를 택했습니다. 이는 칭호로 바꾸기보다 하나님의 고유한 이름을 드러내려는 프로젝트 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: וַיַּעְפִּלוּ의 책임 있는 뉘앙스
  chosen_reading: 분수에 넘친 행동을 했습니다
  alternative_readings:
