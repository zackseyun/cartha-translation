  lexicon: HALOT
  rationale: רֹאשׁ의 문자적 '머리'를 한국어 관용으로 자연스럽게 풀어 '산꼭대기'로 옮겨, 상승 방향과 목적지를 간명하게 나타냈습니다.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
