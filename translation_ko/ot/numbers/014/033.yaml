id: NUM.14.33
reference: Numbers 14:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
  footnotes:
  - marker: a
    text: Or 'wanderers' for 'shepherds'; the Hebrew word is literally related to shepherding/pasturing, but some take it as emphasizing their nomadic wandering.
    reason: lexical_alternative
  - marker: b
    text: '''Acts of sexual unfaithfulness'' translates a term that can also be rendered ''whoredom'' or more generally ''unfaithfulness,'' using sexual imagery for covenant disloyalty.'
    reason: lexical_alternative
  - marker: c
    text: Or 'until your corpses come to an end in the wilderness.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희 아들들은 광야에서 사십 년 동안 목자들이 될 것이며[a], 너희의 시체가 광야에서 다 없어질 때까지 너희의 음행을 짊어질 것입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유랑하는 자들’로 옮길 수 있습니다. 히브리어는 본래 목양과 관련된 말이지만, 일부는 광야를 떠도는 상태를 강조하는 표현으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 불신실함’으로 옮길 수 있습니다. 이 표현은 음행의 성적 이미지를 사용하여 언약에 대한 불충실을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희의 시체가 광야에서 끝나게 될 때까지’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  english_pob_choice: And your sons
  chosen_korean: 너희 아들들은
  alternatives_korean:
  - 너희 자녀들은
  - 너희 후손들은
  lexicon: HALOT
  rationale: בנים의 기본 의미인 ‘아들들’을 살리고, 문맥상 남성 복수 표지를 보존했습니다.
- source_word: רֹעִים
  english_pob_choice: shepherds
  chosen_korean: 양을 치는 자들
  alternatives_korean:
  - 목자들
  - 양치는 사람들
  - 유랑하는 자들
  lexicon: HALOT
  rationale: 직역상 ‘목자들/양치는 자들’이지만, 한국어에서는 직무보다 상태를 자연스럽게 드러내는 ‘양을 치는 자들’이 본문의 광야 생활 맥락을 더 잘 전달합니다.
- source_word: זְנוּתֵיכֶם
  english_pob_choice: your acts of sexual unfaithfulness
  chosen_korean: 너희의 불신실함
  alternatives_korean:
  - 너희의 음행
  - 너희의 음란함
  - 너희의 간음
  lexicon: HALOT
  rationale: 언약적 배신을 성적 은유로 말한 표현이므로, 과도하게 신체적 의미로 좁히지 않되 도덕적·신학적 배반을 드러내는 ‘불신실함’을 택했습니다.
- source_word: פִּגְרֵיכֶם
  english_pob_choice: your dead bodies
  chosen_korean: 너희의 시체
  alternatives_korean:
  - 너희의 주검
  - 너희의 몸
  lexicon: HALOT
  rationale: פּגר는 ‘시체/주검’의 의미이므로, 현대 한국어에서 자연스럽고 엄중한 ‘시체’를 사용했습니다.
theological_decisions:
- issue: זְנוּתֵיכֶם의 성적 은유를 어떻게 한국어로 보존할 것인지
  chosen_reading: ‘불신실함’으로 번역하되, 언약 파기의 성적 은유를 완전히 지우지 않는 방향을 택했습니다.
  alternative_readings:
  - 음행
  - 음란함
  - 간음
  rationale: 문맥은 여호와께 대한 이스라엘의 반역이므로 단순한 성행위가 아니라 언약적 배신입니다. 동시에 지나치게 직접적인 성적 표현만 남기면 의미가 좁아지므로, 둘 사이를 균형 있게 반영했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: רֹעִים를 ‘목자들’로 직역할지, 결과를 드러내는 동적 표현으로 옮길지
  chosen_reading: ‘양을 치는 자들’로 옮겨, 목축·유목의 장기적 광야 생활을 함께 암시했습니다.
  alternative_readings:
  - 목자들
  - 유랑자들
  rationale: 히브리어는 본래 목양을 가리키는 말이므로 너무 동적으로 풀어 ‘유랑자들’로만 만들면 어근의 의미가 약해집니다. 한국어 문맥상 이해를 돕기 위해 기능적 표현을 보조적으로 사용했습니다.
  doctrine_reference: Translation philosophy §1, §5
