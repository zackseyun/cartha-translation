    rationale: 문맥상 언약적 배신을 가리키지만, 히브리어는 음행의 어휘를 사용합니다. ‘음행’으로 옮기고 각주에서 비유적 언약 의미를 밝혀 두 층위를 보존하는 것이 더 충실합니다.
