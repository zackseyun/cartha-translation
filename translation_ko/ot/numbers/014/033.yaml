revisions:
- from: 그리고 너희 아들들은 광야에서 사십 년 동안 양을 치는 자들이 될 것이며, 너희의 불신실함을 짊어질 것입니다. 너희의 시체가 광야에서 다 소멸될 때까지 그렇게 될 것입니다.[a][b][c]
  to: 너희 아들들은 광야에서 사십 년 동안 목자들이 될 것이며[a], 너희의 시체가 광야에서 다 없어질 때까지 너희의 음행을 짊어질 것입니다.[b][c]
  rationale: 원문의 병렬 구조와 ‘~때까지’의 범위를 한 문장 안에서 회복했습니다. רֹעִים는 직역에 가까운 ‘목자들’로, זְנוּתֵיכֶם는 성적 은유를 보존하는 ‘음행’으로 옮겼으며, 각주에서 가능한 문맥적 번역과 해석상 뉘앙스를 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:30Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 רֹעִים의 목양 의미와 פִּגְרֵיכֶם의 ‘시체’를 대체로 반영합니다. 그러나 히브리어의 한 문장을 두 문장으로 나누면서 ‘그렇게 될 것입니다’라는 불필요한 내용을 보탰고, עַד תֹּם의 시간 한정이 ‘불신실함을 짊어짐’에 직접 연결되지 않습니다. 또한 זְנוּתֵיכֶם의 성적 은유가 본문에서 ‘불신실함’으로만 번역되어 약화됩니다.
  naturalness: ‘양을 치는 자들이 될 것’도 이해되지만, 본문의 명사적 표현에는 ‘목자들이 될 것’이 더 간결하고 자연스럽습니다. 시간 절을 ‘너희의 시체가 광야에서 다 없어질 때까지’로 앞에 두어 한국어 문장 구조와 원문의 수식 관계를 모두 분명히 했습니다.
  terminology: ‘목자들’은 רֹעִים의 기본 의미를 보존하며, ‘음행’은 זְנוּת의 성적 이미지를 유지합니다. 각주에서 이것이 언약적 불충실을 비유적으로 나타낼 수 있음을 설명하여 문맥적 의미도 제공합니다. ‘시체’는 פִּגְרֵיכֶם에 적절합니다.
