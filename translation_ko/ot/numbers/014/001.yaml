id: NUM.14.1
reference: Numbers 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשָּׂא֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יִּתְּנ֖וּ אֶת קוֹלָ֑/ם וַ/יִּבְכּ֥וּ הָ/עָ֖ם בַּ/לַּ֥יְלָה הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
  footnotes:
  - marker: a
    text: Hebrew literally, 'raised [it] up ... and gave their voice,' an idiom for a loud communal outcry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 온 회중이 목소리를 높여 부르짖었고, 백성은 그 밤에 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘(목소리를) 높이고 … 그들의 소리를 내다’에 가까우며, 큰 공동체적 외침을 뜻하는 관용입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 회집
  lexicon: HALOT
  rationale: עֵדָה는 이 문맥에서 이스라엘의 모인 공동체를 가리키므로 '회중'이 자연스럽고, כָּל은 '온'으로 간결하게 살렸습니다.
- source_word: וַתִּשָּׂא ... אֶת קוֹלָם
  english_pob_choice: raised their voices
  chosen_korean: 목소리를 높여
  alternatives_korean:
  - 소리를 높여
  - 목소리를 들어
  lexicon: HALOT
  rationale: '''voice''를 문자적으로 반복하기보다, ''목소리를 높이다''로 공동체적이고 큰 외침이라는 히브리어 관용을 살렸습니다.'
- source_word: וַיִּתְּנוּ אֶת קוֹלָם
  english_pob_choice: cried out
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 외쳤고
  - 큰소리로 울부짖었고
  lexicon: HALOT
  rationale: 직역의 '목소리를 주다'보다, 해당 관용이 뜻하는 강한 통곡·외침을 드러내는 '부르짖다'가 원문의 힘을 보존합니다.
- source_word: וַיִּבְכּוּ
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울었습니다
  lexicon: HALOT
  rationale: בכה는 기본적으로 '울다'이므로, 앞선 부르짖음과 구별되도록 평이한 '울었습니다'를 택했습니다.
theological_decisions:
- issue: 공동체 전체의 반응을 어떻게 드러낼지
  chosen_reading: '''온 회중''과 ''백성''을 함께 유지해, 동일 집단을 서로 다른 관점에서 반복하는 히브리어의 병렬성을 살렸습니다.'
  alternative_readings:
  - '''온 회중''만 사용해 통일'
  - '''백성''만 사용해 단순화'
  rationale: 원문은 כָּל הָעֵדָה와 הָעָם을 나란히 놓아 공동체 전체의 격한 반응을 강조하므로, 두 표현을 모두 살려 서술의 긴장과 반복을 유지했습니다.
  doctrine_reference: 서사적 병행법 보존
- issue: 외침과 울음의 감정 차이
  chosen_reading: '''부르짖었고''와 ''울었습니다''를 구분해 먼저 공동체적 외침, 뒤이어 슬픔의 통곡을 드러냈습니다.'
  alternative_readings:
  - 두 동사를 모두 '울었다'로 완화
  - 두 동사를 모두 '소리쳤다'로 통일
  rationale: 히브리어는 וַיִּתְּנוּ אֶת קוֹלָם과 וַיִּבְכּוּ를 구별해 사용하므로, 감정의 강도와 방향을 흐리지 않도록 서로 다른 한국어 동사를 택했습니다.
  doctrine_reference: 본문 감정선 보존
