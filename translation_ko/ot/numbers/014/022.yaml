- from: 내 영광과 내가 이집트와 광야에서 행한 내 표적을 본 그 모든 남자들, 그리고 나를 열 번이나 시험하고도 내 목소리를 듣지 않은 이들입니다.[a]
  to: 이는 내 영광과 내가 이집트와 광야에서 행한 내 표적을 본 모든 남자들이 이처럼 열 번이나 나를 시험하고 내 목소리를 듣지 않았기 때문입니다—[a]
  rationale: 원문의 근거 제시(כִּי)와 다음 절로 이어지는 대시를 유지하도록 「이는 … 때문입니다—」로 고쳤습니다. 원문에 없는 「이들입니다」를 제거했고, זֶה עֶשֶׂר פְּעָמִים의 강조는 「이처럼 열 번이나」로 반영했습니다. 나머지 핵심 용어와 각주의 대안은 유지했습니다.
