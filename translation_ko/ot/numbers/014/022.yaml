  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
  footnotes:
  - marker: a
    text: Or 'have not obeyed my voice.' The Hebrew idiom 'listen to my voice' can carry the sense of heeding or obeying.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영광과 내가 이집트와 광야에서 행한 내 표적을 본 그 모든 남자들, 그리고 나를 열 번이나 시험하고도 내 목소리를 듣지 않은 이들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 목소리에 순종하지 않은’. 히브리어 관용구 ‘내 목소리를 듣다’는 청종하거나 순종한다는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאֲנָשִׁים
  english_pob_choice: all the men
  chosen_korean: 그 모든 남자들
  alternatives_korean:
  - 그 모든 사람들
  - 그 모든 남자들
  lexicon: HALOT
  rationale: 히브리어 אֲנָשִׁים은 이 문맥에서 심판 대상이 되는 성인 남자들을 가리키므로, 성별 정보를 살려 「남자들」로 옮겼습니다.
- source_word: כְּבֹדִי
  english_pob_choice: my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 나의 영광
  - 내 위엄
  lexicon: HALOT
  rationale: 하나님의 현현과 관련된 כָּבוֹד는 전통적 신학 용어인 「영광」이 가장 직접적이며, 문맥의 무게도 잘 살립니다.
- source_word: אֹתֹתַי
  english_pob_choice: my signs
  chosen_korean: 내 표적
  alternatives_korean:
  - 내 표징
  - 내 기적
  lexicon: HALOT
  rationale: אוֹת는 단순한 기적보다 언약적·증거적 기능을 가진 표지라는 뜻이 강해 「표적」이 의미를 가장 잘 보존합니다.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  english_pob_choice: and have not listened to my voice
  chosen_korean: 내 목소리를 듣지 않은
  alternatives_korean:
  - 내 목소리에 귀 기울이지 않은
  - 내 목소리에 순종하지 않은
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘듣다’가 ‘순종하다’의 뜻을 포함할 수 있으나, 본문은 우선 청종 거부를 드러내므로 「내 목소리를 듣지 않은」을 택하고, 순종의 뉘앙스는 문맥이 전달하도록 두었습니다.
theological_decisions:
- issue: וְלֹא שָׁמְעוּ בְּקוֹלִי의 관용적 의미
  chosen_reading: 본문에는 「듣지 않은」을 두고, 순종의 의미는 주석으로 열어 둡니다.
  alternative_readings:
  - 내 목소리에 순종하지 않은
  - 내 목소리에 귀 기울이지 않은
  rationale: 히브리어 ‘듣다+목소리’는 청종과 순종을 함께 암시하지만, 본문 자체의 표현을 보존하는 것이 우선이므로 직접적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
