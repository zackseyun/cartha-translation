    rationale: 「이처럼 열 번이나」는 ‘these ten times’의 현재 지시·강조를 자연스러운 한국어로 보존합니다.
  revised_text: 이는 내 영광과 내가 이집트와 광야에서 행한 내 표적을 본 모든 남자들이 이처럼 열 번이나 나를 시험하고 내 목소리를 듣지 않았기 때문입니다—[a]
