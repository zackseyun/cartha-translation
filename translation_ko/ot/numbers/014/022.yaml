    rationale: 히브리어 כִּי는 앞선 신적 맹세/판결의 근거를 도입하며, 이 절은 다음 절의 결론으로 이어집니다. ‘이들입니다’는 원문에 없는 계사 서술을 추가하고 문장 관계를 바꿉니다.
