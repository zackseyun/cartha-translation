id: NUM.14.31
reference: Numbers 14:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
  footnotes:
  - marker: a
    text: Or 'would be prey' or 'would become spoil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will experience the land.' The Hebrew 'know' can carry an experiential sense here.
    reason: lexical_alternative
  - marker: c
    text: Or 'that you despised.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희의 어린 자녀들은[a], 곧 너희가 노략물이 될 것이라고 말한 그 아이들은 내가 데리고 들어가겠고[b], 그들은 너희가 버린 그 땅을 알게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '먹이가 될' 혹은 '노획물이 될'의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들을 데리고 들어가겠고'의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '너희가 멸시한'의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  english_pob_choice: your little ones
  chosen_korean: 너희의 어린 자녀들
  alternatives_korean:
  - 너희의 아이들
  - 너희의 어린 것들
  lexicon: HALOT
  rationale: טַף는 단순한 '자녀'보다 나이가 어린 아이들을 가리키므로, '어린 자녀들'로 옮겨 약함과 보호 필요성을 살렸습니다.
- source_word: לָבַז
  english_pob_choice: would become plunder
  chosen_korean: 노략물이 될 것이라고
  alternatives_korean:
  - 전리품이 될 것이라고
  - 약탈당할 것이라고
  - 노획물이 될 것이라고
  lexicon: HALOT
  rationale: בַּז는 적에게 빼앗기는 전리품/노략물을 뜻하므로, 군사적 맥락을 드러내는 '노략물'이 가장 가깝습니다.
- source_word: וְהֵבֵיאתִי אֹתָם
  english_pob_choice: I will bring in
  chosen_korean: 내가 데리고 들어가겠고
  alternatives_korean:
  - 내가 그들을 데려가겠고
  - 내가 그들을 그 안으로 데리고 들어가겠고
  lexicon: HALOT
  rationale: 히필형 בוא는 '들어가게 하다'의 뜻이므로, 앞뒤 문맥에서 목적지가 이미 분명한 점을 살려 자연스럽게 '데리고 들어가다'로 옮겼습니다.
- source_word: וְיָדְעוּ
  english_pob_choice: they will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알게 될 것이고
  - 경험하게 될 것입니다
  lexicon: HALOT
  rationale: יָדַע는 여기서 단순 인지보다 실제로 체득하는 뉘앙스가 있으나, 본문 표현을 유지하기 위해 '알게 될 것입니다'로 옮기고 그 여지를 남겼습니다.
- source_word: מְאַסְתֶּם בָּהּ
  english_pob_choice: that you rejected
  chosen_korean: 너희가 버린
  alternatives_korean:
  - 너희가 거부한
  - 너희가 멸시한
  lexicon: HALOT
  rationale: מָאַס은 '거부하다/버리다/멸시하다'의 뜻이 있으나, 이 문맥에서는 약속의 땅을 단호히 거절한 행위를 드러내는 '버린'이 가장 직접적입니다.
theological_decisions:
- issue: '''그 땅''의 범위를 본문 안에서 추가 설명할지 여부'
  chosen_reading: 본문 그대로 '그 땅'으로 두고 '가나안'이나 '약속의 땅'을 덧붙이지 않았습니다.
  alternative_readings:
  - 약속의 땅
  - 가나안 땅
  rationale: 히브리어는 단순히 '땅'이라고만 말하며, 앞뒤 문맥이 이미 대상 토지를 충분히 식별하므로 설명을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
