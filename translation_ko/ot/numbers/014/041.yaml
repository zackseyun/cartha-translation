translation:
  language: ko
  text: 모세가 말했습니다. "왜 너희가 야훼의 명령을 어기고 있습니까? 그것은 성공하지 못할 것입니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼의 입’입니다. 이는 야훼께서 말씀하신 것, 곧 명령하신 것을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 말씀’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그것은 번성하지 않을 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָה זֶּה
  english_pob_choice: Why is this
  chosen_korean: 왜
  alternatives_korean:
  - 왜 이것입니까
  - 왜 이렇습니까
  - 왜 그러십니까
  lexicon: HALOT
  rationale: 히브리어의 לָמָה זֶּה는 단순한 질문보다 약간의 강조를 담은 관용이어서, 한국어에서는 자연스러운 ‘왜’로 처리하되 문맥의 질책성을 살렸습니다.
- source_word: אַתֶּם עֹבְרִים אֶת פִּי יְהוָה
  english_pob_choice: you are transgressing the command of Yahweh
  chosen_korean: 너희가 야훼의 명령을 어기고 있습니까
  alternatives_korean:
  - 너희가 야훼의 말씀을 넘어서고 있습니까
  - 너희가 야훼의 입을 거스르고 있습니까
  - 너희가 야훼의 명령을 범하고 있습니까
  lexicon: HALOT
  rationale: ‘입’(פִּי)은 직역하면 생경하므로, 본문이 뜻하는 ‘명령/말씀’을 풀어 옮기되, POB의 ‘transgressing’에 맞춰 ‘어기다’로 도덕적 위반의 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신성명은 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: לֹא תִצְלָח
  english_pob_choice: It will not succeed
  chosen_korean: 그것은 성공하지 못할 것입니다
  alternatives_korean:
  - 그것은 잘되지 않을 것입니다
  - 그 일은 번성하지 않을 것입니다
  - 그것은 이루어지지 않을 것입니다
  lexicon: HALOT
  rationale: צָלַח은 계획이나 시도가 ‘잘되다/성공하다’는 뜻으로 쓰이므로, 현대 한국어에서 분명한 ‘성공하지 못할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
