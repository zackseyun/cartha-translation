  - 주님
  rationale: 본문이 여호와(יהוה)의 직접 인용을 포함하므로, POB 표준에 따라 ‘야훼’로 유지해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
