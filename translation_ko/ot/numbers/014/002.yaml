translation:
  language: ko
  text: 이스라엘의 모든 자손[a]이 모세와 아론을 원망하였고[b], 온 회중이 그들에게 말했습니다. 「차라리 우리가 이집트 땅에서 죽었더라면! 아니면 이 광야에서 죽었더라면!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 모든 자손’은 히브리어 ‘이스라엘의 모든 아들들’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘원망했다’는 여기서 ‘불평했다’ 또는 ‘투덜거렸다’로도 옮길 수 있습니다.
    reason: lexical_alternative
