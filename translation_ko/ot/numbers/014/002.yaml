id: NUM.14.2
reference: Numbers 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
  footnotes:
  - marker: a
    text: Or “all the Israelites.” Hebrew “all the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “murmured” or “complained.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘의 모든 자손이 모세와 아론을 향해 불평했고, 온 회중이 그들에게 말했습니다. 「차라리 우리가 이집트 땅에서 죽었더라면! 아니면 이 광야에서 죽었더라면!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 모든 자손’은 히브리어 ‘이스라엘의 모든 아들들’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불평했다’는 여기서 ‘원망했다’ 또는 ‘투덜거렸다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  english_pob_choice: grumbled
  chosen_korean: 불평했고
  alternatives_korean:
  - 원망했고
  - 투덜거렸고
  lexicon: HALOT
  rationale: 광야 문맥의 집단적 불만과 대항의 뉘앙스를 현대 한국어로 자연스럽게 살리면서도, 단순한 감정 표현보다 공동체적 항의의 성격을 드러냅니다.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 아들
  - 이스라엘 사람 모두
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 살리되 한국어에서는 ‘자손’이 관용적으로 집합적 의미를 전달하므로, 성별을 지우지 않으면서도 독자성이 자연스럽습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 온 집회
  lexicon: HALOT
  rationale: 민수기의 עֵדָה는 단순한 사회집단보다 예배·언약적 의미를 지닌 모인 공동체이므로 ‘회중’이 가장 밀착합니다.
- source_word: לוּ מַתְנוּ ... לוּ מָתְנוּ
  english_pob_choice: If only we had died ... If only we had died
  chosen_korean: 차라리 우리가 … 죽었더라면
  alternatives_korean:
  - 만일 우리가 … 죽었더라면
  - 아, 우리가 … 죽었더라면
  lexicon: HALOT
  rationale: לוּ의 반사실적 소망을 한국어의 가정·한탄 표현으로 옮겨, 후회 섞인 비현실적 바람을 분명히 드러냅니다.
- source_word: בְּאֶרֶץ מִצְרַיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 애굽 땅에서
  lexicon: HALOT
  rationale: 원문의 지리적 표현을 유지하되, 현대 표준어에서 자연스러운 ‘이집트 땅’으로 옮겼습니다.
theological_decisions:
- issue: 불평의 대상 표현
  chosen_reading: 모세와 아론을 향해 불평했고
  alternative_readings:
  - 모세와 아론에게 불평했고
  - 모세와 아론을 원망했고
  rationale: עַל은 단순한 화제 표지가 아니라 적대적 방향성을 띠므로 ‘향해’와 ‘불평’ 조합으로 대립성을 살렸습니다.
  doctrine_reference: 본문의 서술적 긴장 보존
- issue: luּ의 반복된 소망 구조
  chosen_reading: 차라리 우리가 … 죽었더라면! 아니면 … 죽었더라면!
  alternative_readings:
  - 만일 우리가 … 죽었더라면! 아니면 … 죽었더라면!
  - 우리가 … 죽었으면! 아니면 … 죽었으면!
  rationale: 두 번의 반사실적 소망을 동일한 구조로 처리해, 백성의 절망과 과장된 회한을 원문처럼 반복적으로 들리게 했습니다.
  doctrine_reference: 서술의 수사적 반복 보존
