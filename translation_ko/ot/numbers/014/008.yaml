  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or 'is pleased with us' or 'favors us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 우리를 기뻐하시면, 우리를 이 땅으로 데려가셔서 우리에게 주실 것입니다. 곧 젖과 꿀이 흐르는 땅입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 기뻐하신다’, ‘우리를 좋게 여기신다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָפֵץ בָּנוּ
  english_pob_choice: delights in us
  chosen_korean: 우리를 기뻐하시면
  alternatives_korean:
  - 우리를 좋아하시면
  - 우리를 만족해하시면
  - 우리를 기뻐하신다면
  lexicon: HALOT
  rationale: חָפֵץ는 단순한 승인보다 호의적 즐거움과 기쁨을 포함하므로, 문맥상 자연스러운 합쇼체로 ‘기뻐하시면’이 가장 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 기록된 신명은 전통적 대체호칭보다 고유명사 음역인 ‘야훼’로 옮겨, 본문의 언약적 이름을 드러냅니다.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  english_pob_choice: he will bring us into this land
  chosen_korean: 우리를 이 땅으로 데려가셔서
  alternatives_korean:
  - 우리를 이 땅으로 인도하셔서
  - 우리를 이 땅에 데려오셔서
  lexicon: HALOT
  rationale: ‘들이다/데려가다’는 가나안 प्रवेश의 이동·진입을 잘 반영하며, 결과를 잇는 접속을 위해 ‘-셔서’로 자연스럽게 연결했습니다.
- source_word: וּנְתָנָהּ לָנוּ
  english_pob_choice: and give it to us
  chosen_korean: 우리에게 주실 것입니다
  alternatives_korean:
  - 우리에게 주시고
  - 우리에게 넘겨주실 것입니다
  lexicon: HALOT
  rationale: 대명사 목적어 ‘그것’은 앞의 ‘땅’을 가리키므로 한국어에서는 자연스럽게 생략하고, 단순하고 직접적인 ‘주실 것입니다’로 옮겼습니다.
- source_word: אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 젖과 꿀이 흐르는
  - 우유와 꿀이 흐르는 땅
  lexicon: HALOT
  rationale: 관용적 풍요 표현을 그대로 살리되, 한국어 성경에서 자연스러운 ‘젖과 꿀’ 표현을 유지하여 본문의 이미지를 보존했습니다.
theological_decisions:
- issue: 여호와 대체호칭과 언약적 이름의 처리
  chosen_reading: 신명은 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יְהוָה를 직접 사용하므로, 신적 호칭으로 순화하지 않고 고유한 언약 이름을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
