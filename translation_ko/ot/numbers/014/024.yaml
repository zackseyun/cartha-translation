  to: 그러나 내 종 갈렙은 그에게 다른 영이 있었고[a] 나를 온전히 따랐으므로,[b] 내가 그를 그가 갔던 땅으로 데려갈 것이며, 그의 후손이 그 땅을 차지할 것입니다.[c]
  rationale: 현대 표준 한국어와 합쇼체 문체에 맞추어 문장 종결을 통일하고, זֶרַע의 집합적 의미를 자연스럽게 전달하도록 ‘그의 씨’를 ‘그의 후손’으로 수정했습니다. רוּחַ를 ‘성령’ 등으로 특정하지 않고 ‘다른 영’으로 남겨 원문의 해석상 개방성을 보존했습니다. 각주 표지는 해당 어휘·관용구에 직접 연결되도록 재배치했습니다.
