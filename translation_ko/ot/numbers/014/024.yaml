  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
  footnotes:
  - marker: a
    text: Or 'another spirit was with him'; possibly referring to a different disposition or attitude from the rest of Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''he filled after me,'' meaning he followed the LORD wholeheartedly or completely.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his offspring will inherit it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 종 갈렙은 그에게 다른 영이 있었고[a] 나를 온전히 따랐으므로,[b] 내가 그를 그가 갔던 땅으로 데려갈 것이며, 그의 후손이 그 땅을 차지할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 성향이나 태도가 그에게 있었다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 직역하면 ‘나를 따라 채웠다’이며 ‘나를 온전히 따랐다’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅을 상속할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종이지만
  - 내 노예
  lexicon: HALOT
  rationale: 하나님께 속한 충성된 종이라는 관계를 살리되, 이 문맥에서 신분적 종속을 강조하는 ‘노예’까지는 나아가지 않았습니다.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  english_pob_choice: a different spirit was with him
  chosen_korean: 다른 영이 그와 함께 있었고
  alternatives_korean:
  - 다른 영이 그에게 있었고
  - 그가 다른 영을 지니고 있었고
  lexicon: HALOT
  rationale: רוּחַ의 의미 범위를 좁히지 않고 POB의 열린 표현을 따라, 내면의 성향인지 영적 실재인지 단정하지 않은 채 ‘다른 영’으로 옮겼습니다.
- source_word: וַיְמַלֵּא אַחֲרָי
  english_pob_choice: and he followed me fully
  chosen_korean: 나를 온전히 따랐으므로
  alternatives_korean:
  - 나를 완전히 따랐으므로
  - 나를 끝까지 따랐으므로
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 자연스러운 한국어로 풀어, 단순한 ‘뒤따름’이 아니라 전적인 충성을 드러내는 ‘온전히’로 옮겼습니다.
- source_word: וְזַרְעוֹ
  english_pob_choice: and his offspring
  chosen_korean: 그의 씨
  alternatives_korean:
  - 그의 후손
  - 그의 자손
  lexicon: HALOT
  rationale: 언약적·집단적 후속 세대를 가리키는 זֶרַע의 표현을 보존하기 위해, 현대 한국어에서 다소 직설적이지만 성경적 용례가 분명한 ‘씨’를 택했습니다.
- source_word: יוֹרִשֶׁנָּה
  english_pob_choice: will possess it
  chosen_korean: 그것을 차지할 것입니다
  alternatives_korean:
  - 그것을 상속할 것입니다
  - 그것을 소유할 것입니다
  lexicon: HALOT
  rationale: 땅 약속의 맥락에서 ירש의 ‘상속/차지’ 의미를 살리되, 현대 독자에게 자연스러운 동사로 ‘차지하다’를 사용했습니다.
theological_decisions:
- issue: ‘다른 영’의 범위
  chosen_reading: 갈렙의 내적 태도와 충성심을 드러내는 표현으로 두되, 성령을 곧바로 특정하지는 않았습니다.
  alternative_readings:
  - 성령의 특별한 역사
  - 다른 성향 또는 태도
  rationale: 히브리어 רוּחַ는 영, 성향, 태도를 모두 가리킬 수 있으므로, 본문이 분명히 말하지 않는 것을 교리적으로 확정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 본문의 의미 범위를 좁히지 않음
