id: NUM.14.11
reference: Numbers 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
  footnotes:
  - marker: a
    text: Or “How long will this people despise me?”
    reason: lexical_alternative
  - marker: b
    text: Or “How long will they not trust me?”
    reason: lexical_alternative
  - marker: c
    text: Literally “in its midst,” referring to the people as a collective.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “이 백성이 언제까지 나를 멸시하겠습니까? 또 내가 그들 가운데에서 행한 모든 표적에도 불구하고, 언제까지 나를 믿지 않겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사(여호와/야훼 표기)
  rationale: 원문의 신명사 יְהוָה를 존칭 대체어가 아닌 고유명사로 드러내기 위해 야훼를 사용했습니다.
- source_word: יְנַאֲצֻנִי
  english_pob_choice: will this people treat me with contempt
  chosen_korean: 나를 멸시하겠습니까
  alternatives_korean:
  - 나를 업신여기겠습니까
  - 나를 경멸하겠습니까
  - 나를 무시하겠습니까
  lexicon: HALOT
  rationale: נאץ의 핵심은 단순 무시보다 모욕적 경멸에 있으므로, 현대 한국어에서 가장 직접적으로 대응하는 멸시를 택했습니다.
- source_word: לֹא יַאֲמִינוּ בִי
  english_pob_choice: will they not believe in me
  chosen_korean: 나를 믿지 않겠습니까
  alternatives_korean:
  - 나를 신뢰하지 않겠습니까
  - 나를 믿지 못하겠습니까
  lexicon: HALOT
  rationale: 본문의 직접적 의미인 믿음을 살리되, 관계적 신뢰의 뉘앙스는 문맥상 함께 전달되므로 주 번역은 믿지 않겠습니까로 두었습니다.
- source_word: בְּ/קִרְבּוֹ
  english_pob_choice: among them
  chosen_korean: 그들 가운데에서
  alternatives_korean:
  - 그들 한가운데에서
  - 그들 가운데
  - 그들 안에
  lexicon: HALOT
  rationale: 집합 명사로서의 백성을 가리키는 문맥을 살려, 자연스러운 한국어인 그들 가운데에서로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 칭호가 아니라 언약적 고유명사를 사용하므로, POB 기준에 따라 대체 번역을 피하고 야훼로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘믿다’와 ‘신뢰하다’의 뉘앙스
  chosen_reading: 나를 믿지 않겠습니까
  alternative_readings:
  - 나를 신뢰하지 않겠습니까
  rationale: 히브리어 אמן + ב는 믿음과 신뢰를 함께 내포할 수 있으나, 본문은 표적을 보고도 응답하지 않는 불신의 문제를 정면으로 제기하므로 주 번역은 믿음을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve tension where genuine ambiguity exists
