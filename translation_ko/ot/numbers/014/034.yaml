  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
  footnotes:
  - marker: a
    text: Or 'my alienation,' 'my hostility,' or 'my displeasure.' Traditional English versions often have 'my breach of promise,' but the Hebrew term likely refers to the LORD's opposition or estrangement toward this rebellious generation rather than any failure on God's part.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그 땅을 정탐한 날수, 곧 사십 일에 따라, 하루를 일 년으로, 하루를 일 년으로 하여, 너희는 사십 년 동안 너희 죄악을 져야 하며, 나의 적대를 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 희귀어입니다. 또는 ‘나의 소외’ 또는 ‘나의 단절’, ‘나의 불쾌’로 옮길 수 있습니다. 전통적으로는 ‘나의 언약 파기’로도 번역되어 왔습니다. 이 표현은 문맥상 반역한 세대에 대한 하나님의 적대적 관계 또는 그들 사이의 단절을 가리킬 수 있으며, 정확한 뉘앙스는 논쟁되어 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  english_pob_choice: According to the number of the days
  chosen_korean: 그 땅을 정탐한 날수에 따라
  alternatives_korean:
  - 그 날수에 따라
  - 그 날들의 수에 따라
  - 정탐한 날수의 비율에 따라
  lexicon: HALOT
  rationale: ב + מִסְפָּר은 단순한 수량 제시보다 대응·비례를 나타내므로, 한국어도 ‘...에 따라’로 자연스럽게 대응 관계를 살렸습니다.
- source_word: תַּרְתֶּם
  english_pob_choice: you spied out
  chosen_korean: 정탐한
  alternatives_korean:
  - 탐사한
  - 살펴본
  - 조사한
  lexicon: HALOT
  rationale: 민수기 문맥의 정찰 행위를 가리키므로, 의미를 약화하지 않는 ‘정탐하다’를 택했습니다.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  english_pob_choice: you shall bear your iniquities
  chosen_korean: 너희는 너희의 죄악을 ... 져야 하며
  alternatives_korean:
  - 너희는 너희의 죄를 감당해야 하며
  - 너희는 너희의 죄책을 져야 하며
  - 너희는 너희의 악을 짊어져야 하며
  lexicon: HALOT
  rationale: נשא עון은 죄의 무게와 그 결과를 ‘짊어지다/지다’는 관용구이므로, 도덕적·형벌적 부담을 함께 드러내는 ‘죄악을 져야 하며’로 옮겼습니다.
- source_word: תְּנוּאָתִי
  english_pob_choice: my opposition
  chosen_korean: 나의 소외
  alternatives_korean:
  - 나의 विरोध?
  - 나의 적대
  - 나의 불쾌
  - 나의 언약 파기
  lexicon: HALOT
  rationale: 이 희귀어는 하나님 쪽의 언약 불성실이 아니라, 반역한 세대에 대한 분리·단절의 상태를 가리키는 것으로 보이므로, 전통적 ‘언약 파기’ 대신 관계적 소외를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: תְּנוּאָתִי의 신학적 함의
  chosen_reading: ‘나의 소외’는 하나님이 약속을 어기셨다는 뜻이 아니라, 반역한 이 세대와의 관계가 단절·철수된 상태를 드러냅니다.
  alternative_readings:
  - 나의 적대
  - 나의 불쾌
  - 나의 언약 파기
  rationale: 문맥은 심판 선언이며, 본문이 하나님의 신실성을 훼손하지 않도록 희귀어의 의미를 관계적 소외로 제시하는 것이 가장 안전합니다.
  doctrine_reference: 민수기 14:34 본문 문맥; 하나님의 신실성
