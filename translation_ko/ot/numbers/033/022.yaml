lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 출발하여
  alternatives_korean:
  - 떠나
  - 여행하여
  - 길을 나서
  lexicon: HALOT
  rationale: 광야 이동 공식에서 נסע는 단순한 이동이 아니라 한 진영에서 다음 진영으로 ‘출발함’을 뜻하므로, 현대 한국어에서 자연스러운 ‘출발하여’로 옮겼습니다.
- source_word: מֵרִסָּה
  english_pob_choice: from Rissah
  chosen_korean: 리사에서
  alternatives_korean:
  - 리사로부터
  - 리사에서부터
  lexicon: 고유명사 표기
  rationale: 앞에 붙은 מִן/מֵ는 출발 지점을 나타내므로 한국어 처소격 ‘-에서’로 자연스럽게 반영하고, 지명은 음역했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 야영을 했습니다
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: 광야 여정 문맥에서 חנה는 실제로 진을 설치하는 행위를 가리키므로, 군사·이동 맥락까지 드러내는 ‘진을 쳤습니다’가 가장 구체적입니다.
- source_word: בִּקְהֵלָתָה
  english_pob_choice: at Kehelathah
  chosen_korean: 게헬라다에
  alternatives_korean:
  - 게헬라다에서
  - 게헬라다 안에
  lexicon: 고유명사 표기
  rationale: 장소명은 음역하고, 정착 지점을 나타내는 בְּ는 한국어에서 위치 표지 ‘-에’로 옮기는 것이 여정 목록의 용법에 맞습니다.
