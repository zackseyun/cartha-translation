  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: ko
  text: 그들은 마라에서 떠나 엘림에 이르렀습니다. 엘림에는 물샘 열두 개와 종려나무 일흔 그루가 있었고, 거기에서 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ מִמָּרָה
  english_pob_choice: They set out from Marah
  chosen_korean: 마라에서 떠났습니다
  alternatives_korean:
  - 마라에서 출발했습니다
  - 마라를 떠나갔습니다
  lexicon: HALOT
  rationale: נסע의 여정 공식으로서 ‘진을 걷고 이동하다’의 의미를 담아, 현대 한국어에서는 자연스러운 ‘떠났습니다’로 옮겼습니다.
- source_word: וַיָּבֹאוּ אֵילִמָה
  english_pob_choice: and came to Elim
  chosen_korean: 엘림에 이르렀습니다
  alternatives_korean:
  - 엘림에 도착했습니다
  - 엘림으로 갔습니다
  lexicon: HALOT
  rationale: בוא는 단순한 이동 완료를 나타내므로, 서술 흐름을 살리면서도 목적지 도달을 분명히 하는 ‘이르렀습니다’를 선택했습니다.
- source_word: עֵינֹת מַיִם
  english_pob_choice: springs of water
  chosen_korean: 물샘
  alternatives_korean:
  - 샘물
  - 물의 샘
  - 샘
  lexicon: HALOT
  rationale: עין이 가리키는 자연 샘의 의미를 살리되, 한국어에서 더 간결하고 구체적인 ‘물샘’으로 옮겼습니다.
- source_word: תְּמָרִים
  english_pob_choice: palm trees
  chosen_korean: 종려나무
  alternatives_korean:
  - 야자나무
  - 팜나무
  - 종려들
  lexicon: HALOT
  rationale: 현대 한국어 성경에서 널리 통용되는 식물명으로, 히브리어 תמרים의 일반적 의미를 자연스럽게 전달합니다.
- source_word: וַיַּחֲנוּ שָׁם
  english_pob_choice: and they camped there
  chosen_korean: 거기에서 진을 쳤습니다
  alternatives_korean:
  - 거기에서 야영했습니다
  - 거기에서 머물렀습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 문맥에서 ‘진을 치다/진영을 세우다’의 뜻이므로, 본문의 군사·공동체적 야영 뉘앙스를 살렸습니다.
