- from: 아론 제사장은 야훼의 명에 따라 호르 산으로 올라갔고, 거기서 죽었습니다. 이스라엘 자손이 이집트 땅에서 나온 지 사십 년째 되는 해, 다섯째 달, 그 달의 첫째 날이었습니다.[a]
  to: 아론 제사장은 야훼의 명령에 따라[a] 호르 산에 올라가 그곳에서 죽었습니다. 때는 이스라엘 자손이 이집트 땅에서 나온 지 사십 년째 되는 해의 다섯째 달 초하루였습니다.
