theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 본 프로젝트의 표준에 따라 인명적·언약적 신적 이름을 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘the command of Yahweh’의 뉘앙스
  chosen_reading: 야훼의 명에 따라
  alternative_readings:
  - 야훼의 명령으로
  - 야훼의 말씀대로
  rationale: 본문의 עַל פִּי는 단순한 조언이 아니라 권위 있는 지시를 가리키므로, 서술문에서 자연스럽게 들리면서도 신적 권위를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: Hebrew idiom עַל פִּי + divine authority
