translation:
  language: ko
  text: 아론 제사장은 야훼의 명에 따라 호르 산으로 올라갔고, 거기서 죽었습니다. 이스라엘 자손이 이집트 땅에서 나온 지 사십 년째 되는 해, 다섯째 달, 그 달의 첫째 날이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 명에 따라’는 직역하면 ‘야훼의 입에 따라’라는 뜻의 관용구를 뜻풀이한 것입니다.
    reason: source_note
