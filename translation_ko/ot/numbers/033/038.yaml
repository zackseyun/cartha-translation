base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
  footnotes:
  - marker: a
    text: Or 'according to the word of the LORD'; literally, 'upon the mouth of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론 제사장은 야훼의 명령에 따라[a] 호르 산에 올라가 그곳에서 죽었습니다. 때는 이스라엘 자손이 이집트 땅에서 나온 지 사십 년째 되는 해의 다섯째 달 초하루였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입을 따라’입니다. 이는 야훼의 말씀이나 명령에 따른다는 뜻의 관용적 표현입니다.
    reason: source_note
