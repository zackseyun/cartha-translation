  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
  footnotes:
  - marker: a
    text: Or 'inherit it.' The Hebrew verb ירשׁ can carry the sense of inheriting as well as taking possession, especially in covenantal land-promise contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그 땅을 차지하고 거기에 살아야 합니다. 이는 내가 그 땅을 너희에게 주어 그것을 차지하게 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “상속하다”. 히브리어 동사 ירשׁ는 언약적 땅 약속 문맥에서 ‘상속하다’와 ‘차지하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  english_pob_choice: you shall take possession of
  chosen_korean: 그 땅을 차지하고
  alternatives_korean:
  - 그 땅을 점령하고
  - 그 땅에서 쫓아내고
  - 그 땅을 상속받고
  lexicon: HALOT
  rationale: 히필 형태의 ירשׁ는 단순히 ‘상속받다’보다 ‘차지하다/소유하게 되다’의 결과를 더 직접적으로 드러내므로, 본문 앞의 목적어인 ‘땅’에 자연스럽게 맞는 ‘차지하다’를 택했습니다.
- source_word: וִישַׁבְתֶּם בָּהּ
  english_pob_choice: and live in it
  chosen_korean: 거기에 살아야 합니다
  alternatives_korean:
  - 거기에 거주해야 합니다
  - 거기에 머물러야 합니다
  - 거기에 살아가야 합니다
  lexicon: HALOT
  rationale: ישׁב는 ‘거주하다/살다’의 넓은 뜻을 가지므로, 현대 한국어에서 자연스럽고 문어체에 맞는 ‘살다’를 사용했습니다.
- source_word: נָתַתִּי
  english_pob_choice: I have given
  chosen_korean: 내가 … 주어
  alternatives_korean:
  - 내가 … 주었습니다
  - 내가 … 주었기 때문입니다
  - 내가 … 주고 있습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 완료된 행위를 근거로 삼는 뉘앙스를 살리되, 한국어에서는 문장 전체의 원인 절 안에서 자연스럽게 이어지도록 ‘주어’로 옮겼습니다.
- source_word: לָרֶשֶׁת אֹתָהּ
  english_pob_choice: to possess it
  chosen_korean: 그것을 차지하게
  alternatives_korean:
  - 그것을 상속받게
  - 그것을 소유하게
  - 그것을 차지하도록
  lexicon: HALOT
  rationale: 문맥상 토지 약속과 실제 점유를 강조하므로, 영어 POB의 ‘possess’에 대응해 목적을 나타내는 ‘차지하게’로 압축했습니다.
theological_decisions:
- issue: ירשׁ의 의미 범위(‘inherit’ vs. ‘possess’)
  chosen_reading: 본문에서는 ‘차지하다/차지하게 하다’로 번역하고, 상속 뉘앙스는 전면에 내세우지 않습니다.
  alternative_readings:
  - 상속받다
  - 유업으로 받다
  rationale: 민수기 33장은 약속된 땅의 실제 점유와 거주를 명령하는 문맥이므로, 상속 언어보다 점유·차지의 의미가 더 직접적입니다. 다만 상속의 함의는 본문의 언약 배경 안에 남아 있습니다.
  doctrine_reference: Translation philosophy §1, §5
