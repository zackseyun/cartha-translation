    rationale: 원문에서 בָּהֶם은 이집트 사람들 가운데서 야훼께서 치신 이들을 가리키며, כָּל־בְּכוֹר는 그 이들의 범위를 밝힙니다. 한국어에서는 관계절 안에 ‘그들 가운데서’를 두고 목적어를 ‘모든 맏아들’로 정리하는 편이 명료합니다.
