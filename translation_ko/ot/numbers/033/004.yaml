- from: 그때 이집트 사람들이 그들 가운데서 야훼께서 치신 사람들, 곧 그들의 모든 처음 난 자들을 장사하고 있었습니다. 또한 그들의 신들에게 야훼께서 심판을 집행하셨습니다.[a]
  to: 그때 이집트 사람들은 야훼께서 그들 가운데서 치신 모든 맏아들을 장사하고 있었습니다. 야훼께서는 그들의 신들에게도[a] 심판을 집행하셨습니다.
  rationale: 원문의 관계절과 뒤따르는 동격적 범위 표현을 자연스러운 한국어 수식 구조로 재배열했습니다. ‘모든 맏아들’은 בְּכוֹר의 남성 집합 표현을 반영하며, ‘그들 가운데서’는 이집트 사람들을 가리키는 원문의 대명사 지시를 보존합니다. 심판 대상에 관한 각주 표지도 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:55Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 이집트 사람들이 야훼께서 그들 가운데서 치신 ‘모든 처음 난 자’를 장사하는 진행 상황과, 야훼께서 그들의 신들에게 심판을 행하신 일을 병렬로 말합니다. 초안의 의미는 대체로 충실하나, ‘그들 가운데서’와 ‘그들의 모든 처음 난 자들’의 배치가 지시 관계를 다소 불명료하게 만듭니다.
  naturalness: ‘그들의 모든 처음 난 자들’은 현대 표준어에서 다소 직역투입니다. ‘그들 가운데서 치신 모든 맏아들’을 사용하면 관계절과 수식 범위가 자연스럽고 분명해집니다. 각주 표지는 대안이 걸리는 ‘신들에게’ 바로 뒤에 두는 것이 적절합니다.
  terminology: 야훼, 이집트, 신들, 심판은 일관되고 적절합니다. בְּכוֹר는 남성 단수 집합 표현이므로 문맥상 ‘모든 맏아들’로 옮겼습니다. ‘심판을 집행하셨습니다’는 עָשָׂה שְׁפָטִים의 실행적 의미를 무리 없이 반영합니다.
