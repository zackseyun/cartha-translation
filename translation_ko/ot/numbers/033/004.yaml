id: NUM.33.4
reference: Numbers 33:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
  footnotes:
  - marker: a
    text: Or 'against their gods the LORD had executed judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이집트 사람들은 야훼께서 그들 가운데서 치신 모든 맏아들을 장사하고 있었습니다. 야훼께서는 그들의 신들에게도[a] 심판을 집행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들에 대해 야훼께서 심판을 집행하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצְרַיִם
  english_pob_choice: while the Egyptians
  chosen_korean: 그때 이집트 사람들이
  alternatives_korean:
  - 그리고 이집트 사람들이
  - 이집트 사람들이
  lexicon: HALOT
  rationale: 문맥상 출애굽의 배경 상황을 나타내는 절로 읽히므로, 한국어에서는 단순 병렬보다 시간적 배경을 드러내는 표현이 더 자연스럽습니다.
- source_word: מְקַבְּרִים
  english_pob_choice: were burying
  chosen_korean: 장사하고 있었습니다
  alternatives_korean:
  - 묻고 있었습니다
  - 매장하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 분사로 지속 중인 과거 동작을 나타내므로, 한국어 과거 진행형으로 살렸습니다.
- source_word: אֵת אֲשֶׁר ... כָּל בְּכוֹר
  english_pob_choice: those whom ... all the firstborn
  chosen_korean: 그들 가운데서 ... 그들의 모든 처음 난 자들을
  alternatives_korean:
  - 그들 중 ... 모든 맏아들을
  - 그들 가운데 ... 모든 첫째 아들들을
  lexicon: HALOT
  rationale: 히브리어의 목적어-관계절 구조를 한국어에서 어색하지 않게 풀어, ‘그들 가운데서’와 ‘그들의 모든 처음 난 자들’을 연결해 원문의 대상 범위를 분명히 했습니다.
- source_word: וּבֵאלֹהֵיהֶם עָשָׂה ... שְׁפָטִים
  english_pob_choice: and on their gods Yahweh had executed judgments
  chosen_korean: 또한 그들의 신들에게 야훼께서 심판을 집행하셨습니다
  alternatives_korean:
  - 또한 그들의 신들에 대해 야훼께서 심판을 행하셨습니다
  - 또한 그들의 신들에게 야훼께서 심판하셨습니다
  lexicon: HALOT
  rationale: ב + 대상에 대한 관용적 결합을 따라 ‘...에게’로 옮기되, שְׁפָטִים의 사법적·공적 뉘앙스를 살리기 위해 ‘심판을 집행하셨습니다’로 번역했습니다.
theological_decisions:
- issue: 야훼의 이집트 신들에 대한 심판을 어떻게 옮길지
  chosen_reading: 원문이 말하는 ‘그들의 신들’에 대한 야훼의 심판을 그대로 유지했습니다.
  alternative_readings:
  - 그들의 우상들로 완화
  - 그들의 통치자들에게 비유적으로 적용
  rationale: 본문은 출애굽 전승의 재앙을 이집트 신들에 대한 실제 심판으로 진술하므로, 의미를 약화하지 않고 원문 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 동사 עָשָׂה שְׁפָטִים의 한국어 뉘앙스
  chosen_reading: ‘심판을 집행하셨습니다’로 번역했습니다.
  alternative_readings:
  - 심판하셨습니다
  - 심판을 행하셨습니다
  rationale: 단순한 판단보다 공적 처분을 실행한다는 느낌을 살려, 재앙의 선언적·집행적 성격을 드러냈습니다.
  doctrine_reference: 히브리어 משפטים의 판결 집행적 용례
