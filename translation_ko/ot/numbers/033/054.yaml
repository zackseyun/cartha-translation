  to: 너희는 그 땅을 제비를 뽑아 너희 씨족들에게 분배해야 합니다. 더 많은 쪽에게는 그 기업을 늘리고, 더 적은 쪽에게는 그 기업을 줄여야 합니다. 제비가 누구에게 나오든[a], 그곳은 그의 것이 될 것입니다. 너희는 너희 조상들의 지파에 따라 기업을 받아야 합니다.
  rationale: 씨족 단위, 인원수에 따른 증감, 제비가 나온 장소의 귀속을 원문에 맞게 명확히 했습니다. '기업'은 토지의 상속·배분이라는 נחל 어군의 문맥적 의미를 간결하게 보존합니다. 각주는 영어 감사 기록의 직역 대안을 한국어로 자연스럽게 제시하고, 해당 절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
