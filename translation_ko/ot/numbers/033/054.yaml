review_pass:
  verdict: revise
  source_fidelity: 첫 절의 '가족별로'는 מִשְׁפָּחֹתֵיכֶם가 가리키는 씨족 단위를 현대적 가족으로 축소합니다. 또한 '큰/작은 집단'은 인원수의 많고 적음을 뜻하는 לָרַב/לַמְעַט보다 집단의 물리적 크기를 연상시킬 수 있습니다. 제비 관련 절은 원문의 장소 지시어 שָׁמָּה('그곳에서/그곳은')를 살리는 편이 정확합니다.
  naturalness: 합쇼체 명령·규정 문체는 유지되어 있습니다. 다만 '제비뽑아'보다 '제비를 뽑아' 또는 '제비로'가 문장 안에서 더 자연스럽고, '상속 몫'보다 본문 문맥의 정착된 토지 분배 용어인 '기업'이 간결하고 자연스럽습니다.
  terminology: מִשְׁפָּחָה는 '씨족', מַטּוֹת는 '지파', נַחֲלָה/נחל은 이 문맥에서 '기업'으로 옮겼습니다. 이는 특정 교리 해석을 더하지 않으면서 토지 상속·배분의 법적 의미를 보존합니다.
