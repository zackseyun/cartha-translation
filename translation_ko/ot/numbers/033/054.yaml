  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
  footnotes:
  - marker: a
    text: Or, more formally, 'Where the lot comes out for him, there it shall be his.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그 땅을 너희 가족별로 제비뽑아 분배해야 합니다. 큰 집단에게는 그들의 몫을 늘리고, 작은 집단에게는 그들의 몫을 줄여야 합니다. 누구에게 제비가 떨어지든, 그것이 그의 것이 될 것입니다. 너희는 너희 조상의 지파들에 따라 너희 상속 몫을 받아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '제비가 그에게 나오면, 거기에서 그것이 그의 것이 될 것입니다'라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  english_pob_choice: You shall apportion
  chosen_korean: 제비뽑아 분배해야 합니다
  alternatives_korean:
  - 분배해야 합니다
  - 상속으로 나누어야 합니다
  - 분깃으로 나누어야 합니다
  lexicon: HALOT
  rationale: 문맥이 개인적 상속이 아니라 이스라엘 공동체 안에서 땅을 나누는 절차이므로, '분배하다'에 제비뽑기 요소를 붙여 분배 행위를 드러냈습니다.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  english_pob_choice: according to your clans
  chosen_korean: 너희 가족별로
  alternatives_korean:
  - 너희 씨족별로
  - 너희 가문별로
  - 너희 가족들에 따라
  lexicon: HALOT
  rationale: 히브리어 מִשְׁפָּחָה는 민수기의 분배 맥락에서 현대적 '가족'보다 더 큰 친족 단위를 가리키지만, 한국어에서 가장 자연스럽고 이해 가능한 대응으로 '가족별로'를 택했습니다.
- source_word: בְּגוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비뽑아
  alternatives_korean:
  - 제비로
  - 운으로
  - 제비를 뽑아
  lexicon: HALOT
  rationale: גורל은 땅 분배의 기술적 표현이므로, 한국어에서도 성경적 관용어인 '제비뽑아'를 사용해 절차성을 살렸습니다.
- source_word: לָרַב ... וְלַמְעַט ... תַּרְבּוּ ... תַּמְעִיט
  english_pob_choice: To the larger group you shall increase ... and to the smaller you shall reduce ...
  chosen_korean: 큰 집단에게는 그들의 몫을 늘리고, 작은 집단에게는 그들의 몫을 줄여야 합니다
  alternatives_korean:
  - 많은 쪽에게는 ... 적은 쪽에게는 ...
  - 큰 자에게는 ... 작은 자에게는 ...
  lexicon: HALOT
  rationale: 대조 구조를 살리면서도 수량 대비를 분명히 하기 위해 '큰 집단/작은 집단'으로 옮겼고, 늘리다/줄이다로 동사 대구를 맞췄습니다.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  english_pob_choice: Wherever the lot falls for anyone
  chosen_korean: 누구에게 제비가 떨어지든
  alternatives_korean:
  - 제비가 누구에게 떨어지든
  - 제비가 나오는 곳마다
  - 제비가 그에게 나오면
  lexicon: HALOT
  rationale: 직역적 '제비가 떨어지다'는 한국어 성경에서도 자연스러운 관용이며, 조건절의 유동성을 간결하게 전달합니다.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  english_pob_choice: according to the tribes of your fathers
  chosen_korean: 너희 조상의 지파들에 따라
  alternatives_korean:
  - 너희 아버지들의 지파에 따라
  - 너희 선조들의 지파에 따라
  - 너희 족속의 지파들에 따라
  lexicon: HALOT
  rationale: מַטּוֹת은 지파를 뜻하므로 '지파들'로 옮기고, אֲבֹתֵיכֶם은 혈통적·조상적 기준을 드러내는 '조상'으로 처리했습니다.
- source_word: תִּתְנֶחָלוּ
  english_pob_choice: You shall receive your inheritances
  chosen_korean: 상속 몫을 받아야 합니다
  alternatives_korean:
  - 상속을 받아야 합니다
  - 분깃을 받아야 합니다
  - 유산을 받아야 합니다
  lexicon: HALOT
  rationale: 끝절의 נחל은 분배된 땅을 받는 의미이므로, '상속 몫'으로 옮겨 약속의 땅 분배라는 법적·언약적 의미를 유지했습니다.
theological_decisions:
- issue: 땅 분배를 '제비뽑기'로 표현할지, 단순한 행정적 '나눔'으로 완화할지
  chosen_reading: 제비뽑아 분배해야 합니다
  alternative_readings:
  - 그 땅을 나누어야 합니다
  - 그 땅을 분배해야 합니다
  rationale: 본문은 גורל을 반복해 분배의 주도권이 인간이 아니라 제비, 곧 야훼께 있다는 점을 강조하므로, 제비뽑기 요소를 본문 전면에 남겼습니다.
  doctrine_reference: 하나님의 주권과 기업 분배
- issue: '''inheritance''를 일반적 ''상속''으로 풀지, 언약적 땅 기업으로 남길지'
  chosen_reading: 상속 몫
  alternative_readings:
  - 기업
  - 유산
  - 상속
  rationale: 한국어 '상속'만 쓰면 사유재산의 뉘앙스가 강해질 수 있어, 분배된 몫이라는 뜻을 보완하는 '상속 몫'으로 언약적 땅 분배를 표현했습니다.
  doctrine_reference: 약속의 땅과 기업 개념
