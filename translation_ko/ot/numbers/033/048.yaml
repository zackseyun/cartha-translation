  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
  footnotes:
  - marker: a
    text: Or 'in the steppes of Moab.' The Hebrew term can denote steppe-land or plains.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the Jordan opposite Jericho.' Some translations take the final phrase more specifically as indicating the area across from Jericho.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아바림 산에서 떠나 모압 평원에 진을 쳤으니, 곧 여리고 맞은편 요단 강가였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲרָבֹת은 평원뿐 아니라 스텝 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 더 구체적으로 ‘여리고 맞은편’이라는 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 나아가
  lexicon: HALOT
  rationale: 이동 단계의 전환을 나타내는 itinerary 동사로서, 한국어에서는 ‘떠나’가 자연스럽고 출발의 의미를 잘 살립니다.
- source_word: מֵהָרֵי הָעֲבָרִים
  english_pob_choice: from the mountains of Abarim
  chosen_korean: 아바림 산에서
  alternatives_korean:
  - 아바림의 산들에서
  - 아바림 산지에서
  lexicon: HALOT
  rationale: 고유 지명 ‘Abarim’을 음역하고, 히브리어 복수형 산 표현은 한국어에서 단수 지명군처럼 묶어 ‘아바림 산’으로 옮겼습니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압 평원에
  alternatives_korean:
  - 모압의 초원에
  - 모압 스텝 지대에
  lexicon: HALOT
  rationale: עַרְבֹת은 steppe/평원 지형을 가리키므로, 현대 독자가 이해하기 쉬운 ‘평원’이 가장 직접적입니다.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  english_pob_choice: by the Jordan at Jericho
  chosen_korean: 여리고 맞은편 요단 강가였습니다
  alternatives_korean:
  - 여리고 맞은편 요단 강변이었습니다
  - 여리고 앞 요단 강가였습니다
  lexicon: HALOT
  rationale: עַל + 강 이름은 ‘강가/강변’의 위치를 자연스럽게 나타내며, English POB의 각주처럼 지리적으로 여리고 맞은편임을 드러내도록 했습니다.
theological_decisions:
- issue: Itinerary 문체와 지리 묘사의 정밀도
  chosen_reading: 서술문을 간결하게 유지하되, 마지막 구절은 위치 관계가 드러나도록 ‘여리고 맞은편 요단 강가’로 옮겼습니다.
  alternative_readings:
  - ‘요단 강가 여리고에서’
  - ‘여리고 건너편 요단 강가’
  rationale: 본문은 출애굽 여정의 정거장 기록이므로 해설을 늘리지 않고, 원문의 지리 정보를 최대한 보존하는 쪽을 택했습니다.
  doctrine_reference: Numbers itinerary literature; geographic-historical reading
