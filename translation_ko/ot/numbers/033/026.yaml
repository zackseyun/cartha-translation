  chosen_korean: 마케롯에서
  alternatives_korean:
  - 마켈롯에서
  - 마크헬롯에서
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하며, מן의 접두 의미는 한국어의 출발점 표지 ‘-에서’로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 진을 쳤습니다
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: 광야 서술에서 חנה는 단순 야영보다 ‘진을 치다’가 집합적 군사/공동체적 정착을 더 정확히 드러냅니다.
- source_word: בְּתָחַת
  english_pob_choice: at Tahath
  chosen_korean: 타하스에
  alternatives_korean:
  - 타하스에서
  - 타하스 안에
  lexicon: HALOT
  rationale: 캠프의 도착 지점을 나타내는 ב는 장소 표지로 자연스럽게 처리했고, 지명은 음역했습니다.
