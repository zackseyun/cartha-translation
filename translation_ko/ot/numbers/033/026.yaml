lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 출발하여
  alternatives_korean:
  - 떠나
  - 여정을 시작하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 이동 공식에서 단순한 이동보다 한 진영에서 다음 진영으로 ‘출발함’의 뉘앙스를 살리기 위해, 현대적이고 자연스러운 ‘출발하여’를 택했습니다.
- source_word: מִמַּקְהֵלֹת
