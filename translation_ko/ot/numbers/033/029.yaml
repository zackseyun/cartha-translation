lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 공식에서 נסע는 한 진영에서 다음 진영으로 ‘출발하다/떠나다’의 뜻이 자연스럽습니다. 현대 한국어에서는 ‘떠나’가 간결하고 이동의 흐름을 잘 살립니다.
- source_word: מִמִּתְקָה
  english_pob_choice: from Mithkah
  chosen_korean: 미드가를
  alternatives_korean:
  - 미트카를
  - 미드카를
  lexicon: HALOT
  rationale: 지명은 음역하는 원칙에 따라 옮겼습니다. 영어 POB의 Mithkah를 기준으로 한국어 음가에 맞춰 ‘미드가’로 적었습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 이곳처럼 광야 여정 문맥에서 ‘진을 치다’가 가장 직접적인 대응입니다. ‘야영했습니다’보다 군사·이동 서술의 공식성이 잘 드러납니다.
- source_word: בְּחַשְׁמֹנָה
  english_pob_choice: at Hashmonah
  chosen_korean: 하스모나에
  alternatives_korean:
  - 하쉬모나에
  - 해시모나에
  lexicon: HALOT
  rationale: 지명은 음역하며, 장소 전치사 בְּ는 여정 기록의 자연스러운 한국어 표현인 ‘-에’로 옮겼습니다.
