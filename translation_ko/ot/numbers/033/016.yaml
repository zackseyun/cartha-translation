lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 여정 공식에서 נסע는 이동의 시작을 뜻하므로, 현대 한국어에서 자연스러운 ‘떠나’로 옮기되 여정의 흐름을 유지했습니다.
- source_word: מִמִּדְבַּר סִינַי
