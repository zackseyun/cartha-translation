- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: 여정 서술에서 חנה의 표준적 의미인 ‘진을 치다’를 사용해 군중/이동 공동체의 정착 행위를 드러냈습니다.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  english_pob_choice: at Kibroth-hattaavah
  chosen_korean: 기브롯핫다아와
  alternatives_korean:
  - 기브롯 하타아와
  - 갈망의 무덤
  lexicon: HALOT
  rationale: 본문이 지명으로 사용하므로 음역을 유지했습니다. 다만 히브리어 어근상 ‘갈망의 무덤’이라는 뜻이어서 주석으로 의미를 남겼습니다.
