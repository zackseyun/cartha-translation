  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Kadesh''; some translations expand this to ''Kadesh-barnea'' based on broader context, but the shorter place name is what appears here.'
