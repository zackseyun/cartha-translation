  - marker: b
    text: Hebrew literally, 'at Hor the mountain,' conventionally rendered 'Mount Hor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 가데스를 떠나 에돔 땅의 가장자리에 있는 호르 산에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 광야 여정 공식에서 נסע는 캠프를 떠나는 이동을 뜻하므로, 한국어에서는 간결하고 자연스러운 ‘떠나’로 옮겨 연속된 여정 흐름을 살렸습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프했습니다
  lexicon: HALOT
  rationale: חנה는 광야 서술에서 ‘진을 치다/야영하다’의 구체적 행위를 가리키며, ‘진을 쳤습니다’가 군사·유랑 맥락을 함께 살립니다.
- source_word: בְּהֹר הָהָר
  english_pob_choice: at Mount Hor
  chosen_korean: 호르 산에
  alternatives_korean:
  - 호르 산에서
  - 호르, 그 산에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘호르 그 산에서/에’에 가까우나, 한국어에서는 통용되는 지명 ‘호르 산’으로 자연스럽게 처리했습니다.
- source_word: בִּקְצֵה אֶרֶץ אֱדוֹם
  english_pob_choice: on the edge of the land of Edom
  chosen_korean: 에돔 땅의 경계였습니다
  alternatives_korean:
  - 에돔 땅의 끝자락이었습니다
  - 에돔 땅의 가장자리에 있었습니다
  lexicon: HALOT
  rationale: קצה는 ‘끝, 가장자리, 경계’의 범위를 가지므로, 장소 설명으로는 ‘경계’가 가장 무난하게 원의미를 반영합니다.
