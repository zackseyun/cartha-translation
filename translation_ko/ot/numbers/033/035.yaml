lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 출발하여
  alternatives_korean:
  - 떠나
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 이동 목록의 관용적 서술로서 단순한 이동보다 ‘출발하다’가 원문의 진전과 절차성을 자연스럽게 살립니다.
- source_word: מֵעַבְרֹנָה
  english_pob_choice: from Abronah
  chosen_korean: 아브로나에서
  alternatives_korean:
  - 아브로나로부터
  - 아브로나에서부터
  lexicon: HALOT
  rationale: 지명 עַבְרֹנָה는 음역하고, מֵ는 장소 출발의 ‘-에서’로 옮겨 한국어 이동 서술을 자연스럽게 맞췄습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: 히브리어 חנה의 광야 여정 공식에서는 ‘진을 치다’가 군사·여정적 정착을 가장 분명하게 드러냅니다.
- source_word: בְּעֶצְיוֹן גָּבֶר
  english_pob_choice: at Ezion-geber
  chosen_korean: 에시온게벨에
  alternatives_korean:
  - 에시온-게벨에
  - 에지온게벨에
  lexicon: HALOT
  rationale: 지명은 표준 음역으로 옮기되, בְּ는 위치를 나타내는 조사 ‘-에’로 번역해 문장 기능을 살렸습니다.
