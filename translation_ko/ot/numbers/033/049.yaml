  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
  footnotes:
  - marker: a
    text: Or 'in the steppes of Moab.' The Hebrew term refers to the flat steppe region in Moab.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요단 강가에, 벧여시못에서부터 아벨싯딤까지, 모압의 평원에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ
  english_pob_choice: And they camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 쳤습니다
  lexicon: HALOT
  rationale: חנה의 서사적 완료를 한국어의 자연스러운 군사·여정 표현인 ‘진을 치다’로 옮겨, 이동 서술의 흐름과 모압 평원 도착의 뉘앙스를 살렸습니다.
- source_word: עַל הַיַּרְדֵּן
  english_pob_choice: by the Jordan
  chosen_korean: 요단 강가에
  alternatives_korean:
  - 요단 곁에
  - 요단 위에
  lexicon: HALOT
  rationale: 하천을 가리키는 עַל은 문자적 ‘위에’보다 위치 관계인 ‘가에/곁에’가 자연스러워, 캠핑 장소를 분명하게 드러내는 표현을 택했습니다.
- source_word: מִבֵּית הַיְשִׁמֹת ... עַד אָבֵל הַשִּׁטִּים
  english_pob_choice: from Beth-jeshimoth ... as far as Abel-shittim
  chosen_korean: 벧여시못에서부터 아벨싯딤까지
  alternatives_korean:
  - 벧여시못으로부터 아벨싯딤까지
  - 벧여시못에서 아벨싯딤까지
  lexicon: HALOT
  rationale: 두 지명은 음역해 보존하고, 시작점과 끝점을 나타내는 מן/עַד의 범위를 ‘에서부터 …까지’로 드러냈습니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압의 평원에
  alternatives_korean:
  - 모압의 광야 평원에
  - 모압의 스텝 지역에
  lexicon: HALOT
  rationale: עֲרָבוֹת의 지리적 의미를 한국어의 통용 표현인 ‘평원’으로 옮겨, 독자가 장소의 성격을 즉시 이해하도록 했습니다.
