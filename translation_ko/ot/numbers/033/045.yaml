    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이임에서 떠나 디본갓에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야영했다’로도 옮길 수 있습니다. 히브리어 동사는 광야 여정의 정형적 표현에서 흔히 ‘진을 치다’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이임’은 ‘이윔’ 또는 ‘이임’으로도 음역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  - 진행했습니다
  lexicon: HALOT
  rationale: 여정 목록의 관용구에서 נסע는 한 지점에서 다음 지점으로 이동하는 뜻이므로, 현대 한국어에서는 자연스러운 ‘떠나다’로 옮기는 것이 적절합니다.
- source_word: מֵעִיִּים
  english_pob_choice: from Iyyim
  chosen_korean: 이윔에서
  alternatives_korean:
  - 이임에서
  - 이얌에서
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하는 것이 원문 지시를 가장 잘 보존하므로, 영어 POB의 Iyyim에 대응해 ‘이윔’으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 쳤습니다
  - 장막을 쳤습니다
  lexicon: HALOT
  rationale: 히브리어 חנה는 광야 여정 문맥에서 ‘천막을 치고 진을 두다’는 뜻이므로, 군사·여정의 정착감을 살리는 ‘진을 치다’가 가장 정확합니다.
- source_word: בְּדִיבֹן גָּד
  english_pob_choice: at Dibon-gad
  chosen_korean: 디본-갓에
  alternatives_korean:
  - 디본-갓에서
  - 디본-갓 안에
  lexicon: HALOT
  rationale: 이동 경로의 도착 지점을 나타내는 בְּ는 한국어에서 자연스럽게 장소 부사격 조사 ‘-에’로 옮기는 것이 맞으며, 지명은 합성형을 그대로 보존했습니다.
theological_decisions:
- issue: 광야 여정 공식의 간결한 지시성과 지명 보존
  chosen_reading: 문장을 꾸미지 않고 이동-도착의 두 동작만 간결하게 제시했습니다.
  alternative_readings:
  - 더 서술적으로 풀어 쓰는 방식
  - 지명을 의미로 분해하는 방식
  rationale: 본 절은 신학적 확장보다 여정 기록의 객관성이 핵심이므로, 원문의 목록형 리듬과 지명 표지를 그대로 살리는 것이 해석적으로 안전합니다.
  doctrine_reference: 민수기 33장의 행진 목록은 이스라엘의 역사적 이동을 증언하는 기록 장르입니다.
