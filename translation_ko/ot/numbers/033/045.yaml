  text: They set out from Iyyim and camped at Dibon-gad[a][b].
  footnotes:
  - marker: a
    text: Or 'encamped.' The Hebrew verb commonly denotes pitching camp in wilderness itinerary formulas.
    reason: lexical_alternative
  - marker: b
