  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
  footnotes:
  - marker: a
    text: Or 'encamped.' The Hebrew verb commonly denotes pitching camp in wilderness itinerary formulas.
    reason: lexical_alternative
  - marker: b
    text: The place name may also be transliterated 'Iyim' or 'Iim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이윔에서 떠나 디본-갓에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 광야 여정 공식에서 흔히 ‘진을 치다’의 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 지명은 영어 POB처럼 음역을 유지할 수 있으며, Iyyim은 이윔/이임 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  - 진행했습니다
  lexicon: HALOT
  rationale: 여정 목록의 관용구에서 נסע는 한 지점에서 다음 지점으로 이동하는 뜻이므로, 현대 한국어에서는 자연스러운 ‘떠나다’로 옮기는 것이 적절합니다.
- source_word: מֵעִיִּים
  english_pob_choice: from Iyyim
  chosen_korean: 이윔에서
  alternatives_korean:
  - 이임에서
  - 이얌에서
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하는 것이 원문 지시를 가장 잘 보존하므로, 영어 POB의 Iyyim에 대응해 ‘이윔’으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 쳤습니다
  - 장막을 쳤습니다
  lexicon: HALOT
  rationale: 히브리어 חנה는 광야 여정 문맥에서 ‘천막을 치고 진을 두다’는 뜻이므로, 군사·여정의 정착감을 살리는 ‘진을 치다’가 가장 정확합니다.
- source_word: בְּדִיבֹן גָּד
  english_pob_choice: at Dibon-gad
  chosen_korean: 디본-갓에
  alternatives_korean:
  - 디본-갓에서
  - 디본-갓 안에
  lexicon: HALOT
  rationale: 이동 경로의 도착 지점을 나타내는 בְּ는 한국어에서 자연스럽게 장소 부사격 조사 ‘-에’로 옮기는 것이 맞으며, 지명은 합성형을 그대로 보존했습니다.
theological_decisions:
