  chosen_reading: 문장을 꾸미지 않고 이동-도착의 두 동작만 간결하게 제시했습니다.
  alternative_readings:
  - 더 서술적으로 풀어 쓰는 방식
  - 지명을 의미로 분해하는 방식
  rationale: 본 절은 신학적 확장보다 여정 기록의 객관성이 핵심이므로, 원문의 목록형 리듬과 지명 표지를 그대로 살리는 것이 해석적으로 안전합니다.
  doctrine_reference: 민수기 33장의 행진 목록은 이스라엘의 역사적 이동을 증언하는 기록 장르입니다.
