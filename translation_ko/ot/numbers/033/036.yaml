  - severity: low
    issue: 식별 구문이 별도 절로 처리되어 다소 장황합니다.
    rationale: 히브리어의 קצר한 동격적 식별(‘신 광야, 그것은 가데스’)은 한국어에서 ‘신 광야, 곧 가데스’로 처리하는 편이 더 자연스럽고 정확합니다.
  revised_text: 그들은 에시온게벨을 떠나 신 광야, 곧 가데스에 진을 쳤습니다.
