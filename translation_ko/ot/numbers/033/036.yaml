  rationale: 여정 동사와 지명은 유지하고, הִוא קָדֵשׁ의 동격적 지리 식별을 ‘곧 가데스’로 옮겼습니다. 이에 따라 문장 전체를 과거 합쇼체로 통일했습니다. 본문에서 식별 관계가 명확하므로, 영어 감사 기록의 대안적 표현을 설명하는 각주는 한국어 본문에 필수적이지 않습니다.
