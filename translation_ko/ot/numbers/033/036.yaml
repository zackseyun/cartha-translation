lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠났습니다
  - 출발했습니다
  - 여정을 시작했습니다
  lexicon: HALOT
  rationale: 이동 서술의 반복 공식에서 נסע는 ‘진을 거두고 이동하다’는 뜻이므로, 현대 한국어에서는 간결한 ‘떠나’가 가장 자연스럽습니다.
- source_word: מֵעֶצְיוֹן גָּבֶר
  english_pob_choice: from Ezion-geber
  chosen_korean: 에시온게벨에서
  alternatives_korean:
  - 에시온 게벨에서
  - 에시온-게벨에서
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 원문에 충실하므로 한국어 외래어 표기식으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 장막을 쳤습니다
  lexicon: HALOT
  rationale: 광야 여정 문맥의 חנה는 단순한 숙박보다 ‘진을 치다’가 더 직접적으로 본래 동작을 드러냅니다.
- source_word: בְמִדְבַּר צִן
  english_pob_choice: in the wilderness of Zin
  chosen_korean: 신 광야에
  alternatives_korean:
  - 신 사막에
  - 신 들판에
  lexicon: HALOT
  rationale: מִדְבָּר는 여기서 지리적·성서적 용례가 강하므로 관용적으로 ‘광야’를 유지하는 것이 가장 적절합니다.
theological_decisions:
- issue: הִוא קָדֵשׁ의 식별 구문 처리
  chosen_reading: ‘거기는 곧 가데스입니다’로 옮겨, 앞선 장소를 가데스와 동일시하는 설명 기능을 살렸습니다.
  alternative_readings:
  - ‘그곳은 가데스입니다’
  - ‘그것이 가데스입니다’
  rationale: 히브리어 대명사 הִוא는 단순한 지시보다 위치 동일시를 드러내는 구문이므로, 설명적 식별을 분명히 해야 합니다.
  doctrine_reference: 본문의 지리적 동일시 표현을 보존하는 번역 원칙
