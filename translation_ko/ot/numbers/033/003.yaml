base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''With a high hand'' is a Hebrew idiom meaning openly and boldly, in full public view.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 첫째 달 열다섯째 날에 라암셋에서 출발했습니다. 유월절 다음 날, 이스라엘 자손[a]은 모든 이집트 사람이 보는 앞에서 높이 든 손으로[b] 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’이며, 이스라엘 백성을 가리키는 관용적 집단 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높이 든 손으로’는 히브리어 관용구로, 공개적이고 담대하게 행동함을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 출발했습니다
  alternatives_korean:
  - 떠났습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 여행 일정 문맥에서 נסע는 ‘진을 걷고 출발하다’의 뜻이므로, 자연스럽고 간결한 ‘출발했습니다’로 옮겼습니다.
- source_word: מֵרַעְמְסֵס
  english_pob_choice: from Rameses
  chosen_korean: 라암셋에서
  alternatives_korean:
  - 람세스에서
  - 라메세스에서
  lexicon: HALOT
  rationale: 고유 지명은 한국어 성경에서 널리 쓰이는 음역을 따르되, 한국어 표기 관습에 맞는 ‘라암셋’을 선택했습니다.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן ... בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: in the first month; on the fifteenth day of the first month
  chosen_korean: 첫째 달, 곧 첫째 달 열닷샛날
  alternatives_korean:
  - 첫째 달, 곧 첫째 달 십오 일
  - 첫째 달 열다섯째 날
  lexicon: HALOT
  rationale: 히브리어 날짜 표현을 한국어의 자연스러운 순서로 재구성하되, ‘열닷샛날’로 원문의 명시적 날짜를 분명히 드러냈습니다.
- source_word: בְּיָד רָמָה
  english_pob_choice: with a high hand
  chosen_korean: 높이 든 손으로
  alternatives_korean:
  - 높은 손으로
  - 당당하게
  lexicon: HALOT
  rationale: 직역에 가까운 ‘높이 든 손’으로 관용구의 형상을 보존해, 공개적이고 대담한 출애굽이라는 뉘앙스를 문맥에 맡겨 드러냈습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 유지하면서도 한국어에서 가장 널리 이해되는 성경적 집합 표현을 사용했습니다.
theological_decisions:
- issue: בְיָד רָמָה 관용구의 의미 범위
  chosen_reading: ‘높이 든 손으로’로 옮겨 공개성·담대함을 암시하되, ‘공공연히’나 ‘거만하게’처럼 의미를 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 공공연히
  - 당당하게
  - 거만하게
  rationale: 원문은 손을 들어 올린 이미지를 가진 관용구이므로, 해석을 과도하게 밀어 넣지 않고 형상을 보존하는 것이 문맥상 안전합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
