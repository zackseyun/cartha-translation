  source_fidelity: 초안은 מִמֶּרֶץ מִצְרַיִם(‘이집트 땅에서’)과 לְצִבְאֹתָם(‘그들의 부대/편제에 따라’)의 관계를 뒤바꾸고, בְּיַד(‘~의 손으로/인도 아래’)를 ‘손에 따라’로 부정확하게 옮겼습니다. 또한 מַסְעֵי는 ‘여정들’로 옮기는 것이 적절하나, 원문의 수식 관계를 따라 이스라엘 자손이 이집트에서 나온 것으로 표현해야 합니다.
  naturalness: ‘모세와 아론의 인도 아래’, ‘그들의 부대별로 나온’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 조직적·군사적 뉘앙스도 유지합니다. ‘이것들은 … 여정들입니다’는 뒤따르는 여정 목록을 소개하는 문맥에 맞습니다.
  terminology: ‘이스라엘 자손’은 בְנֵי יִשְׂרָאֵל의 가족적 표현을 보존합니다. צְבָאֹת는 본문에서 ‘부대별로’로 번역하고 대안적 의미를 각주에 제시합니다. בְּיַד의 히브리어 관용구는 ‘인도 아래’로 자연스럽게 번역하되 각주로 직역과 의미를 밝힙니다.
