  alternative_readings:
  - 기브롯 핫다아와를 ‘갈망의 무덤들’로 번역
  - 본문에 설명적 번역을 직접 삽입
  rationale: 이 절은 여정 목록의 지명 표기가 핵심이므로, 의미 번역이 본문 흐름을 흐리지 않도록 음역을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 성경 지명/본문 장르 보존
