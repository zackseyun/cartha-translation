  rationale: 지명은 본문에서 음역을 유지하고, מִן은 동사의 이동 방향과 함께 한국어 목적격/출발 구문으로 자연스럽게 반영했습니다. 이름의 뜻은 본문이 아니라 각주에서 처리하는 편이 source-direct입니다.
