lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 이동 공식에서 נסע는 진을 걷고 이동하는 뜻이므로, 현대 한국어에서는 자연스럽고 이동의 시작을 분명히 드러내는 ‘떠나’가 적절합니다.
- source_word: מֵחֲצֵרֹת
  english_pob_choice: from Hazeroth
  chosen_korean: 하세롯을
  alternatives_korean:
  - 하세롯에서
  - 하세롯으로부터
  lexicon: HALOT
  rationale: 지명 앞의 מִן은 출발점을 나타내므로 한국어 목적어 표지보다 출발점 부사격이 자연스럽습니다. ‘하세롯을 떠나’는 원문의 이동 방향을 간결하게 살립니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 문맥의 표준 동사로 ‘진을 치다’가 한국어 성경 문체에서도 이동 후 정착 행위를 가장 정확하게 옮깁니다.
- source_word: בְּרִתְמָה
  english_pob_choice: at Rithmah
  chosen_korean: 리드마에
  alternatives_korean:
  - 리드마에서
  - 리드마에 이르러
  lexicon: HALOT
  rationale: بְ는 장소 표시이므로 ‘-에’가 자연스럽고, 지명은 현대 외래어 표기 원칙에 따라 음역했습니다.
