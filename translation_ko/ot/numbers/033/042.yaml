lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 공식에서 ‘set out’는 장막을 거두고 다음 진영으로 이동하는 뜻이므로, 한국어에서는 자연스럽고 간결한 ‘떠나’로 옮겼습니다.
- source_word: מִצַּלְמֹנָה
  english_pob_choice: from Zalmonah
  chosen_korean: 살몬에서
  alternatives_korean:
  - 살모나에서
  - 잘모나에서
  lexicon: HALOT
  rationale: 지명은 음역하는 원칙을 따르되, 한국어 표기에서는 현대 외래어 표기 감각에 맞춰 ‘살몬’으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프했습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 숙박이 아니라 광야에서 진을 이루는 행위를 가리키므로, ‘진을 치다’가 의미를 가장 정확하게 드러냅니다.
- source_word: בְּפוּנֹן
  english_pob_choice: at Punon
  chosen_korean: 푼온에
  alternatives_korean:
  - 푼온에서
  - 푼논에
  lexicon: HALOT
  rationale: 도착 지점을 나타내는 בְּ는 한국어에서 목적지 표지 ‘-에’로 자연스럽게 옮겼고, 지명은 음역했습니다.
