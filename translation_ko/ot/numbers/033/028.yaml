  text: They set out from Terah and camped at Mithkah.
translation:
  language: ko
  text: 그들은 데라흐에서 떠나 미스가에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데라흐와 미스가는 이 절의 여정 목록에 나오는 지명입니다.
