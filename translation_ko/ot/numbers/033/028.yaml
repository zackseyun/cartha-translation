lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 공식에서 נסע는 단순한 이동이 아니라 이전 진영을 떠나는 뜻이므로, 현대 한국어에서는 자연스럽고 간결한 ‘떠나’가 가장 적절합니다.
- source_word: מִתָּרַח
  english_pob_choice: from Terah
  chosen_korean: 데라흐
  alternatives_korean:
  - 테라
  - 테라흐
  lexicon: 고유명사 음역
  rationale: 지명은 음역해 옮기되, 출발 지점을 나타내는 מן의 뜻은 서술 구조상 ‘데라흐에서’로 반영했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 이 여정 문맥에서 ‘캠프를 치다/진을 치다’의 구체적 의미가 있어, 단순한 ‘머물렀습니다’보다 ‘진을 쳤습니다’가 원문상을 더 잘 드러냅니다.
- source_word: בְּמִתְקָה
  english_pob_choice: at Mithkah
  chosen_korean: 미스가에
  alternatives_korean:
  - 미트카에
  - 미스카에
  lexicon: 고유명사 음역
  rationale: 장소명은 음역으로 처리했고, 위치를 나타내는 ב는 한국어 조사 ‘-에’로 옮겨 ‘미스가에’로 자연스럽게 표현했습니다.
