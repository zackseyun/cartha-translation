  - 길을 떠나
  - 출발하여
  lexicon: HALOT
  rationale: 광야 여정 공식에서 נסע는 한 진영에서 다음 진영으로 ‘떠나 이동하다’는 뜻이므로, 현대 한국어에서 자연스러운 ‘떠나’로 옮겼습니다.
- source_word: מִלִּבְנָה
  english_pob_choice: from Libnah
  chosen_korean: 립나에서
  alternatives_korean:
  - 리브나에서
  - 립나로부터
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살려 ‘-에서’로 옮기고, 지명은 음역하여 ‘립나’로 표기했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 천막을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 문맥의 표준 동사로 ‘진을 치다’가 이동 후 정착 행위를 가장 분명하게 드러냅니다.
- source_word: בְּרִסָּה
  english_pob_choice: at Rissah
  chosen_korean: 리사에
  alternatives_korean:
  - 리사에서
  - 리사 안에
  lexicon: HALOT
  rationale: ב의 위치 표지를 살리되, 장소명 앞에서는 한국어에서 자연스러운 목적지·장소 표지인 ‘-에’를 사용했습니다.
