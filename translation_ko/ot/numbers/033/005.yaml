    rationale: 영어 감사 기록은 ‘the Israelites’ 및 전통적 ‘the children of Israel’을 대안으로 구별합니다. 한국어에서는 ‘이스라엘 사람들’과 ‘이스라엘의 자녀들’을 대안으로 제시하면 그 구별이 더 명확합니다.
