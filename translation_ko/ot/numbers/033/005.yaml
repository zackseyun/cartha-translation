    text: 또는 ‘이스라엘 사람들’; 전통적으로 ‘이스라엘의 자녀들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘라암셋’은 ‘라암세스(Raamses)’로도 표기됩니다.
    reason: alternative_reading
