  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
  footnotes:
  - marker: a
    text: Or 'the Israelites' or traditionally 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Rameses is also spelled 'Raamses' in some translations.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손이 라암셋에서 출발하여 숙곳에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, 전통적으로는 ‘이스라엘 자손’이라고도 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘라암셋’은 일부 번역본의 ‘라암세스(Raamses)’와 다른 표기입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
