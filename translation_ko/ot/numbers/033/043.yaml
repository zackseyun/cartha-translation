  lexicon: 고유명사 음역
  rationale: 장소명은 의미 번역보다 음역을 따르는 것이 원문 지시를 보존하므로, 영어 POB의 Punon에 맞춰 ‘푼논’으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
