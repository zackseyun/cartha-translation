lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 여정을 떠나
  lexicon: HALOT
  rationale: 이동과 야영의 순서를 보여 주는 광야 여정 공식에서 נסע는 단순 이동보다 ‘진을 거두고 떠남’의 뉘앙스가 있어, 현대 한국어에서는 자연스러운 ‘떠나’가 가장 잘 맞습니다.
- source_word: מִפּוּנֹן
  english_pob_choice: from Punon
  chosen_korean: 푼논에서
  alternatives_korean:
  - 푸논에서
  - 푼온에서
  lexicon: 고유명사 음역
  rationale: 장소명은 의미 번역보다 음역을 따르는 것이 원문 지시를 보존하므로, 영어 POB의 Punon에 맞춰 ‘푼논’으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 공식에서 ‘진을 치다/야영하다’의 뜻이므로, 군사·유목적 야영을 살리는 ‘진을 쳤습니다’가 적절합니다.
- source_word: בְּאֹבֹת
  english_pob_choice: at Oboth
  chosen_korean: 오봇에
  alternatives_korean:
  - 오봇 안에
  - 오봇에서
  lexicon: 고유명사 음역
  rationale: 여정 문맥의 장소 표시는 한국어에서 자연스럽게 목적지의 위치를 나타내는 조사 ‘-에’로 처리하여, 영어의 at을 반영했습니다.
