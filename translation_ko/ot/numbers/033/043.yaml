  lexicon: HALOT
  rationale: 이동과 야영의 순서를 보여 주는 광야 여정 공식에서 נסע는 단순 이동보다 ‘진을 거두고 떠남’의 뉘앙스가 있어, 현대 한국어에서는 자연스러운 ‘떠나’가 가장 잘 맞습니다.
- source_word: מִפּוּנֹן
  english_pob_choice: from Punon
  chosen_korean: 푼논에서
  alternatives_korean:
  - 푸논에서
