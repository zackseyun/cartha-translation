  lexicon: HALOT
  rationale: 광야 여정 목록의 관용구에서 נסע는 진을 거두고 다음 곳으로 이동하는 뜻이므로, 자연스러운 현대 한국어로 ‘떠났습니다’가 적절합니다.
- source_word: מִתָּחַת
  english_pob_choice: from Tahath
  chosen_korean: 타핫을
  alternatives_korean:
  - 타하트에서
  - 타핫에서
  lexicon: HALOT
  rationale: מִן의 출발점 의미는 한국어 이동 동사와 결합해 목적어식으로도 자연스럽게 드러날 수 있어, 고유명사는 음역 ‘타핫’으로 옮기고 출발 의미는 동사로 처리했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
