lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 출발했습니다
  - 여정을 계속했습니다
  lexicon: HALOT
  rationale: 광야 여정 목록의 관용구에서 נסע는 진을 거두고 다음 곳으로 이동하는 뜻이므로, 자연스러운 현대 한국어로 ‘떠났습니다’가 적절합니다.
- source_word: מִתָּחַת
  english_pob_choice: from Tahath
  chosen_korean: 타핫을
  alternatives_korean:
  - 타하트에서
  - 타핫에서
  lexicon: HALOT
  rationale: מִן의 출발점 의미는 한국어 이동 동사와 결합해 목적어식으로도 자연스럽게 드러날 수 있어, 고유명사는 음역 ‘타핫’으로 옮기고 출발 의미는 동사로 처리했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 이 itinerary 공식에서 ‘진을 치다/야영하다’의 뜻이므로, 군사·광야 맥락을 유지하는 ‘진을 쳤습니다’가 가장 직접적입니다.
- source_word: בְּתָרַח
  english_pob_choice: at Terah
  chosen_korean: 테라흐에
  alternatives_korean:
  - 테라흐에서
  - 테라흐 안에
  lexicon: HALOT
  rationale: בְּ는 이 여정 기록에서 정착 지점을 가리키므로 한국어 위치 표지 ‘-에’로 옮겼고, 지명은 현대 음역 ‘테라흐’로 처리했습니다.
