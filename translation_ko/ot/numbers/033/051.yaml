source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אֶל אֶ֥רֶץ כְּנָֽעַן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you are crossing' / 'you are about to cross.' The Hebrew participle expresses an imminent crossing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. ‘너희가 요단을 건너 가나안 땅으로 들어가게 될 때에,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현은 ‘이스라엘의 아들들’이지만, 한국어 성경에서는 “자손”이 원문의 가족적·집단적 의미를 자연스럽게 살리면서도 읽기 쉽습니다.
- source_word: דַּבֵּר / וְאָמַרְתָּ
  english_pob_choice: Speak ... and say to them
  chosen_korean: 말하여 그들에게 이르십시오
  alternatives_korean:
  - 말하여 그들에게 말하십시오
  - 이르시고 그들에게 말씀하십시오
  lexicon: HALOT
  rationale: 두 동사의 연속을 살리되 한국어에서는 지나친 반복을 피하기 위해 ‘말하여 … 이르십시오’로 옮겼습니다.
- source_word: אַתֶּם עֹבְרִים
  english_pob_choice: you cross
  chosen_korean: 너희가 ... 건너 가게 될 때에
  alternatives_korean:
  - 너희가 건너갈 때에
  - 너희가 건너고 있을 때에
  lexicon: HALOT
  rationale: 히브리어 분사형은 임박한 미래의 crossing을 가리키므로, 한국어에서는 자연스러운 미래 지향 표현으로 옮겼습니다.
- source_word: אֶל אֶרֶץ כְּנָעַן
  english_pob_choice: into the land of Canaan
  chosen_korean: 가나안 땅으로
  alternatives_korean:
  - 가나안 땅 안으로
  - 가나안 땅에
  lexicon: HALOT
  rationale: אֶל의 진입 방향을 드러내기 위해 ‘으로’로 옮기고, אֶרֶץ는 한국어 성경의 자연스러운 관용인 ‘땅’으로 표현했습니다.
