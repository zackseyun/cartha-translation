  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
  footnotes:
  - marker: a
    text: Or 'in the steppes of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 모압 평야, 곧 여리고 맞은편 요단가에서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 스텝 지역에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And ... spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: וַיְדַבֵּר는 단순 발화보다 공식적·계시적 말씀을 가리키므로, 하나님의 직접 발화 맥락에 맞게 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 POB 원칙에 따라 ‘야훼’로 음역해, 익숙한 대치어로 신적 고유명을 지우지 않도록 했습니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압 평야
  alternatives_korean:
  - 모압의 평지
  - 모압 초원
  lexicon: HALOT
  rationale: עֲרָבוֹת은 지형적으로 ‘평야/스텝’ 계열이지만, 한국어 성서 문맥에서는 ‘모압 평야’가 가장 자연스럽고 지리 표현도 분명합니다.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  english_pob_choice: by the Jordan at Jericho
  chosen_korean: 여리고 맞은편 요단가
  alternatives_korean:
  - 요단 강가 여리고 근처
  - 여리고 앞 요단가
  lexicon: HALOT
  rationale: עַל + 요단은 단순 ‘위에’가 아니라 강변/가의 위치를 나타내므로 ‘요단가’로 옮기고, יְרֵחוֹ는 지리적 관계를 살려 ‘여리고 맞은편’으로 풀었습니다.
theological_decisions:
- issue: 여호와 대체 여부와 직접 발화의 경어 처리
  chosen_reading: 하나님의 이름은 ‘야훼’로 유지하고, 직접적인 신적 말씀은 한국어 합쇼체로 처리했습니다.
  alternative_readings:
  - ‘여호와’ 사용
  - 일반 서술체 ‘말했다’ 사용
  rationale: 이 절은 야훼의 직접 발화 도입부이므로, 고유명은 대체하지 않고 계시적 발화의 격식을 살리는 것이 원문 의미에 가장 가깝습니다.
  doctrine_reference: 'POB terminology policy: YHWH → 야훼; Korean style guide for direct divine speech'
