  lexicon: HALOT
  rationale: 어미 ה-가 방향성을 나타내므로, 단순한 도착보다 진입을 보여 주는 ‘들어갔으며’가 적절합니다.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: a three-day journey
  chosen_korean: 사흘 길
