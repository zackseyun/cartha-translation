  lexicon: HALOT
  rationale: בְּתוֹךְ는 ‘가운데/한가운데’라는 뜻이므로, 단순한 ‘바다를 지나’보다 위치감을 드러내는 표현을 택했습니다.
- source_word: הַמִּדְבָּרָה
  english_pob_choice: into the wilderness
  chosen_korean: 광야로 들어갔으며
