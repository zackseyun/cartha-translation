  - 사흘 여정
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 고어적이지만 현대적으로 통용 가능한 ‘사흘 길’로 옮겨, 기간과 거리의 중의성을 유지했습니다.
- source_word: וַיַּחֲנוּ
