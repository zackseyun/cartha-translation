base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from before Hahiroth.'' Exodus more commonly names the site ''Pi-hahiroth''; Numbers 33:8 here lacks the element ''Pi-,'' so the shorter form is retained rather than harmonized.'
    reason: alternative_reading
  - marker: b
    text: Or 'they went three days' journey in the wilderness of Etham.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하히롯[a] 앞에서 떠나 바다 가운데를 지나 광야로 들어갔으며, 에담 광야에서 사흘 길을 갔고[b] 마라에 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘피하히롯’이 아니라 ‘하히롯’으로 되어 있습니다. 출애굽기에 더 익숙한 지명 형태와 조화시키지 않고 본문 형태를 따랐습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘에담 광야에서 사흘 동안 갔습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַחִירֹת
  english_pob_choice: from before Hahiroth
  chosen_korean: 하히롯 앞에서
  alternatives_korean:
  - 하히롯에서
  - 피하히롯 앞에서
  lexicon: HALOT
  rationale: 히브리어는 출애굽기의 익숙한 형태인 ‘피하히롯’이 아니라 ‘하히롯’만을 가지므로, 지명은 그대로 옮기되 מִפְּנֵי의 방향·위치 관계는 ‘앞에서’로 살렸습니다.
- source_word: וַיַּעַבְרוּ בְּתוֹךְ הַיָּם
  english_pob_choice: passed through the midst of the sea
  chosen_korean: 바다 가운데를 지나
  alternatives_korean:
  - 바다를 지나
  - 바다 한가운데를 지나
  lexicon: HALOT
  rationale: בְּתוֹךְ는 ‘가운데/한가운데’라는 뜻이므로, 단순한 ‘바다를 지나’보다 위치감을 드러내는 표현을 택했습니다.
- source_word: הַמִּדְבָּרָה
  english_pob_choice: into the wilderness
  chosen_korean: 광야로 들어갔으며
  alternatives_korean:
  - 광야로
  - 광야 안으로
  lexicon: HALOT
  rationale: 어미 ה-가 방향성을 나타내므로, 단순한 도착보다 진입을 보여 주는 ‘들어갔으며’가 적절합니다.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: a three-day journey
  chosen_korean: 사흘 길
  alternatives_korean:
  - 사흘 동안
  - 사흘 여정
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 고어적이지만 현대적으로 통용 가능한 ‘사흘 길’로 옮겨, 기간과 거리의 중의성을 유지했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 체류가 아니라 야영·정착의 의미가 있어, 군사적/이동 서사에 맞는 ‘진을 쳤습니다’가 가장 정확합니다.
