base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
  footnotes:
  - marker: a
    text: Or 'at the border of the wilderness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 숙곳에서 떠나 에담에 진을 쳤는데, 그곳은 광야의 끝자락에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야의 경계에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 여정을 계속하여
  lexicon: HALOT
  rationale: נסע의 이동 서술을 자연스러운 현대 한국어 동사 ‘떠나다’로 옮겨, 진행되는 여정의 흐름을 살렸습니다.
- source_word: מִסֻּכֹּת
  english_pob_choice: from Sukkoth
  chosen_korean: 숙곳에서
  alternatives_korean:
  - 수곳에서
  - 숙곳으로부터
  lexicon: HALOT
  rationale: 지명은 음역이 원칙이므로, 통용되는 성경 지명 음역 ‘숙곳’을 사용했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤는데
  alternatives_korean:
  - 야영했는데
  - 장막을 쳤는데
  - 진을 쳤고
  lexicon: HALOT
  rationale: חנה는 군사적·여정적 ‘진을 치다’의 의미를 잘 드러내므로, 단순한 숙박보다 문맥에 맞는 표현을 선택했습니다.
- source_word: בִּקְצֵה הַמִּדְבָּר
  english_pob_choice: at the edge of the wilderness
  chosen_korean: 광야의 끝자락에
  alternatives_korean:
  - 광야의 가장자리에
  - 광야의 경계에
  - 광야의 끝에
  lexicon: HALOT
  rationale: קצה를 물리적 경계감이 살아 있는 ‘끝자락’으로 옮겨, POB의 ‘edge of the wilderness’가 주는 지리적 뉘앙스를 자연스럽게 반영했습니다.
