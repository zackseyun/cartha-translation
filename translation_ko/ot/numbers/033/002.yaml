  source_fidelity: 히브리어는 모세가 야훼의 명령에 따라 이스라엘 백성의 מוֹצָאִים(출발지/출발들)을 그들의 מַסָּעִים(여정/행군 단계)에 관련지어 기록했으며, 이어서 두 명사를 역순으로 배열합니다. 초안은 이 기본 관계를 대체로 반영하지만, ‘야훼의 말씀’은 여기의 관용구 עַל־פִּי יְהוָה가 뜻하는 ‘야훼의 명령’을 충분히 정확하게 드러내지 못합니다.
  naturalness: 초안의 ‘기록하였으니’와 ‘행진들이니라’는 현대 표준어 합쇼체에 맞지 않으며, ‘출발점들에 따른 행진들’도 문맥상 여정의 목록을 가리키는 표현으로 다듬을 필요가 있습니다. 다만 원문의 의도적인 교차 배열은 보존해야 합니다.
