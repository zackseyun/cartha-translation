translation:
  language: ko
  text: 모세는 야훼의 명령에 따라[a] 그들의 출발지들[b]을 그들의 여정들에 따라 기록하였습니다. 그리고 이것들은 그들의 출발지들에 따른 그들의 여정들입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘야훼의 입에 따라’이며, ‘야훼의 명령에 따라’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘출발지들’은 ‘떠남들’ 또는 ‘출발들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 ‘그들의 여정들에 따른 그들의 출발지들’과 ‘그들의 출발지들에 따른 그들의 여정들’이라는 표현으로 용어의 순서를 의도적으로 바꿉니다.
