  text: וַ/יִּסְע֖וּ מִ/יַּם ס֑וּף וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּר סִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
  footnotes:
  - marker: a
    text: Or 'from the Sea of Reeds.' The Hebrew name yam suf is traditionally rendered 'Red Sea,' but the more literal rendering is often understood as 'Sea of Reeds.'
    reason: lexical_alternative
  - marker: b
    text: '''Sin'' is the name of a wilderness region, not the moral concept of sin.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 홍해에서 떠나 신 광야에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 yam suf는 전통적으로 '홍해'로 옮기지만, 더 문자적으로는 '갈대 바다'로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신’은 죄의 개념이 아니라 광야 지역의 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 이동 서술형 공식에서 נסע의 기본 의미를 자연스럽게 살리면서도, 한국어에서 군더더기 없이 행진의 출발을 표현합니다.
- source_word: מִיַּם סוּף
  english_pob_choice: from the Red Sea
  chosen_korean: 홍해에서
  alternatives_korean:
  - 갈대 바다에서
  - 갈대의 바다에서
  lexicon: HALOT
  rationale: 본문의 지리명으로 기능하는 용례이므로 통용되는 지명인 홍해를 사용했습니다. 문자적으로는 '갈대 바다'가 가능하지만, 여기서는 지명성 보존이 더 중요합니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: 광야 이스라엘의 이동 기록에서 חנה는 군사적·여정적 뉘앙스가 있는 '진을 치다'가 가장 적절합니다.
- source_word: בְּמִדְבַּר סִין
  english_pob_choice: in the wilderness of Sin
  chosen_korean: 신 광야에
  alternatives_korean:
  - 신의 광야에
  - 시인 광야에
  lexicon: HALOT
  rationale: מִדְבָּר는 '광야'가 표준적이며, סִין은 죄의 개념이 아니라 지명이라서 음역해 '신'으로 두었습니다.
theological_decisions:
- issue: ‘Sin’의 의미 혼동 방지
  chosen_reading: 신 광야는 죄를 뜻하는 'sin'이 아니라 지명입니다.
  alternative_readings:
  - 번역만으로 처리하고 주석을 생략함
  - '''죄의 광야''처럼 오해될 소지를 남김'
  rationale: 독자가 도덕적 죄 개념으로 오독하지 않도록, 본문 자체의 지명성을 분명히 드러내는 것이 필요합니다.
  doctrine_reference: 성경 지명과 일반 명사의 구분
