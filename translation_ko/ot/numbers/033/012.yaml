  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
  footnotes:
  - marker: a
    text: Hebrew 'Sin' is the name of a wilderness region and is unrelated to the English word 'sin.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 신 광야에서 떠나 도브가에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 문맥의 נסע는 단순 이동보다 ‘진을 걷고 떠남’의 흐름을 나타내므로, 현대 한국어에서는 자연스러운 ‘떠나’가 적절합니다.
- source_word: מִמִּדְבַּר סִין
  english_pob_choice: from the wilderness of Sin
  chosen_korean: 신 광야에서
  alternatives_korean:
  - 신 사막에서
  - 시내 광야에서
  lexicon: HALOT
  rationale: מִדְבָּר는 여기서 지리적 명칭이 붙은 ‘광야’이므로 ‘신 광야’로 옮기고, 고유명사 Sin은 음역보다 지명으로 처리했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 출애굽기·민수기 여정 공식에서 ‘진을 치다’가 가장 정확하게 정착된 표현이라, 한국어 성경 문맥에 맞는 이 표현을 택했습니다.
- source_word: בְּדָפְקָה
  english_pob_choice: at Dophkah
  chosen_korean: 도브가에
  alternatives_korean:
  - 도프가에
  - 도브카에
  lexicon: HALOT
  rationale: 고유 지명은 현대 외래어 표기 관행에 따라 음역했고, 위치 부사구는 한국어 여정 서술의 자연스러운 조사 ‘-에’로 처리했습니다.
