lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 공식에서 נסע는 단순 이동보다 장막을 걷고 다음 곳으로 옮겨 가는 흐름을 뜻하므로, 자연스러운 현대 한국어로 ‘떠나’가 적절합니다.
- source_word: מִמֹּסֵרוֹת
  english_pob_choice: from Moseroth
  chosen_korean: 모세롯에서
  alternatives_korean:
  - 모세롯으로부터
  - 모세롯을 떠나
  lexicon: HALOT
  rationale: 지명은 음역하고, מן은 이동의 출발점을 나타내는 조사로 ‘-에서’가 가장 자연스럽습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 이정표식 문맥에서 ‘진을 치다/야영하다’의 뜻이므로, 군사적·광야적 뉘앙스를 살리는 ‘진을 쳤습니다’가 적절합니다.
- source_word: בִּבְנֵי יַעֲקָן
  english_pob_choice: at Bene-jaakan
  chosen_korean: 베네야아간에
  alternatives_korean:
  - 야아간의 아들들에게
  - 베네-야아간에
  lexicon: HALOT
  rationale: 직역하면 ‘야아간의 아들들’이지만, 여기서는 여정 목록의 지명으로 기능하므로 번역하지 않고 음역했습니다.
