    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 여행하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 광야 여정 공식에서 출발 동작을 나타내므로, 현대 한국어에서는 ‘떠나’가 간결하면서도 이동의 시작을 자연스럽게 드러냅니다.
- source_word: מֵאֵילִם
  english_pob_choice: from Elim
  chosen_korean: 엘림에서
  alternatives_korean:
  - 엘림으로부터
  - 엘림에서부터
  lexicon: 고유명사 표기
  rationale: מִן의 출발점 의미를 살려 장소명 엘림에 조사 ‘에서’를 붙였습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 천막을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 여정 서술에서 ‘진을 치다’가 가장 구체적으로 대응하며, 군대/공동체의 임시 정착을 잘 보존합니다.
- source_word: יַם סוּף
  english_pob_choice: the Red Sea
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대바다
  lexicon: HALOT
  rationale: 본문의 지명은 관용적으로 ‘홍해’로 옮기되, 원어상의 대안은 각주로 투명하게 보존합니다.
theological_decisions:
- issue: יַם סוּף의 번역 관례
  chosen_reading: 본문에는 전통적 지명인 ‘홍해’를 쓰고, 각주에서 ‘갈대바다’라는 어휘적 대안을 밝힙니다.
  alternative_readings:
  - 갈대바다
  - 갈대의 바다
  rationale: 이 절은 광야 여정의 지명 표기로 기능하므로, 독자 인지도를 고려한 관용 번역을 유지하되 원어 의미 가능성은 주석으로 남깁니다.
  doctrine_reference: 지리·지명 표기 관례
