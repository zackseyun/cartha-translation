translation:
  language: ko
  text: 너희는 그 땅에 사는 모든 주민을 너희 앞에서 몰아내고, 그들의 형상물들을 모두 멸하고[a], 그들의 부어 만든 형상들을 모두 멸하고, 그들의 모든 높은 곳을 무너뜨리십시오.
  philosophy: optimal-equivalence
  footnotes:
