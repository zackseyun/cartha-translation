lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 여정을 계속하여
  lexicon: HALOT
  rationale: 이동 공식에서 נסע는 진영을 옮겨 떠나는 뜻이므로, 현대 한국어에서는 간결한 동사 ‘떠나’가 ‘set out’의 이동 출발 뉘앙스를 자연스럽게 살립니다.
- source_word: מֵחֲרָדָה
  english_pob_choice: from Haradah
  chosen_korean: 하라다를
  alternatives_korean:
  - 하라다에서
  - 하라다로부터
  lexicon: HALOT
  rationale: מִן/מֵ의 출발점 표지를 한국어 목적격 구문으로 자연스럽게 풀어 ‘하라다를 떠나’로 옮겼고, 지명은 음역했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  - 진쳤습니다
  lexicon: HALOT
  rationale: 광야 이동 기록에서 חנה는 ‘진을 치다/진을 치고 머물다’가 가장 직접적인 대응이므로, 군사·유목적 정착 행위를 드러내는 ‘진을 쳤습니다’를 택했습니다.
- source_word: בְּמַקְהֵלֹת
  english_pob_choice: at Makheloth
  chosen_korean: 막헬롯에
  alternatives_korean:
  - 막헬롯에서
  - 막헬롯 안에
  lexicon: HALOT
  rationale: 장소명 앞의 בְּ는 이 이동 기록에서 도착 지점을 나타내므로 한국어는 위치 표지 ‘-에’로 옮겼고, 지명은 음역했습니다.
