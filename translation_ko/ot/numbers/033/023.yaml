  lexicon: 고유명사 음역
  rationale: 지명은 뜻풀이보다 음역이 적절하므로, 히브리어 자음과 모음을 반영해 한국어식 음역으로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프했습니다
  lexicon: HALOT
  rationale: 이동 목록 문맥에서 חנה는 단순 체류보다 '진을 치다/야영하다'의 의미가 분명하므로, 군사적·유목적 정착 뉘앙스를 살렸습니다.
- source_word: בְּהַר שָׁפֶר
  english_pob_choice: at Mount Shepher
  chosen_korean: 헤벨 산에
  alternatives_korean:
  - 쉐펠 산에
  - 샤페르 산에
  lexicon: 고유명사 음역
  rationale: 산 이름은 관용 번역보다 음역이 원문 추적에 유리합니다. 'Mount'는 한국어에서 통상 '산'으로 옮기되, 고유 지명은 음역으로 처리했습니다.
