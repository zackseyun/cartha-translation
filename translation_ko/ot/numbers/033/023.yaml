lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 이동 경로를 시작하는 यात्रा 공식이므로 단순한 '가다'보다 '떠나다'가 원문의 출발 행위를 자연스럽게 드러냅니다.
- source_word: מִקְּהֵלָתָה
  english_pob_choice: from Kehelathah
  chosen_korean: 기헬라다에서
  alternatives_korean:
