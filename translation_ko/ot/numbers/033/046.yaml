  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: ko
  text: 그들은 디본-갓에서 떠나 알몬-디블라다임에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 광야 여정 공식에서 ‘움직여 다음 진영으로 가다’는 뜻을 자연스럽게 담으면서, 과도하게 문어적인 표현을 피했습니다.
- source_word: מִדִּיבֹ֣ן גָּ֑ד
  english_pob_choice: from Dibon-gad
  chosen_korean: 디본-갓에서
  alternatives_korean:
  - 디본-갓으로부터
  - 갓의 디본에서
  lexicon: HALOT
  rationale: 지명은 음역으로 유지하고, מקור을 나타내는 전치사는 한국어 조사 ‘에서’로 간결하게 옮겼습니다.
- source_word: וַֽיַּחֲנ֖וּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 이 여정 공식에서 ‘야영하다’보다 더 군사적·진영적 뉘앙스가 있는 ‘진을 치다’가 원문 상황을 잘 드러냅니다.
- source_word: בְּעַלְמֹ֥ן דִּבְלָתָיְמָ/ה
  english_pob_choice: at Almon-diblathaim
  chosen_korean: 알몬-디블라다임에
  alternatives_korean:
  - 알몬 디블라다임에
  - 알몬-드블라다임에
  lexicon: HALOT
  rationale: 두 번째 지명도 음역을 유지하고, 위치를 나타내는 ב는 한국어 조사 ‘에’로 옮겼습니다.
theological_decisions:
- issue: 광야 여정 공식의 서술 톤
  chosen_reading: 사건 자체를 간명하게 보고하는 서술로 옮겼습니다.
  alternative_readings:
  - 좀 더 의역적으로 ‘이동했습니다’로 풀기
  - ‘진을 쳤다’를 약화해 ‘머물렀다’로 옮기기
  rationale: 본절은 신학적 해석보다 이동 기록이 핵심이므로, 원문의 반복적 itinerary formula를 최대한 보존했습니다.
  doctrine_reference: 민수기 33장의 광야 여정 기록
