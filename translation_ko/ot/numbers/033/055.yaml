source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
  footnotes:
  - marker: a
    text: Or 'pricks in your eyes' for 'barbs in your eyes.' The Hebrew noun is rare and denotes something sharp that pierces.
    reason: lexical_alternative
  - marker: b
    text: Or 'thorns in your sides' / 'hooks in your sides.' The paired images both describe persistent, painful affliction from the remaining inhabitants.
    reason: lexical_alternative
  - marker: c
    text: Or 'they will trouble you' or 'they will oppress you.' The Hebrew verb can cover a range of hostile affliction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 여러분이 그 땅의 주민들을 여러분 앞에서 쫓아내지 않으면, 여러분이 그들 가운데서 남겨 두는 자들이 여러분의 눈에 가시가 되고 여러분의 옆구리에 가시덤불이 되어, 여러분이 그 땅에서 사는 동안 여러분을 괴롭힐 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈에 가시’는 희귀한 히브리어 명사의 직역에 해당하며, ‘찌르는 것’이라는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가시덤불’은 ‘옆구리의 가시/갈고리’에 해당할 수 있는 병렬 비유를 한국어 관용으로 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘괴롭히다’는 히브리어 동사가 가질 수 있는 ‘괴롭히다/압박하다/학대하다’의 범위를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  english_pob_choice: drive out
  chosen_korean: 쫓아내지 않으면
  alternatives_korean:
  - 몰아내지 않으면
  - 추방하지 않으면
  lexicon: HALOT
  rationale: 히필형 ירשׁ의 핵심은 거주자를 그 땅에서 물러나게 하는 것이므로, 현대 한국어에서 자연스럽고 힘 있는 ‘쫓아내다’가 의미와 문맥을 잘 살립니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 그 땅의 주민들
  alternatives_korean:
  - 그 땅에 거주하는 자들
  - 그 땅의 거민들
  lexicon: HALOT
  rationale: 분사구의 의미를 평이하게 옮기면서도, 출정과 정착 문맥에 맞는 공식적인 표현으로 정리했습니다.
- source_word: לְשִׂכִּים / לִצְנִינִם
  english_pob_choice: barbs ... thorns
  chosen_korean: 가시 ... 가시덤불
  alternatives_korean:
  - 찌르는 가시 ... 가시
  - 촉수 ... 가시
  lexicon: HALOT
  rationale: 영어 POB가 두 이미지를 구분하므로, 첫 항목은 ‘눈에 가시’, 둘째는 옆구리에 닿는 지속적 고통을 살리는 ‘가시덤불’로 옮겨 반복되는 상해 이미지를 보존했습니다.
- source_word: וְצָרֲרוּ
  english_pob_choice: they will harass you
  chosen_korean: 여러분을 괴롭힐 것입니다
  alternatives_korean:
  - 여러분을 괴롭힐 것입니다
  - 여러분을 압박할 것입니다
  - 여러분을 해칠 것입니다
  lexicon: HALOT
  rationale: צרר는 적대적 괴롭힘, 압박, 해침을 포괄하므로, 이어지는 비유들과 어울리는 지속적 괴로움을 드러내는 ‘괴롭히다’를 선택했습니다.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  english_pob_choice: on the land where you are living
  chosen_korean: 그 땅에서 사는 동안
  alternatives_korean:
  - 여러분이 살고 있는 그 땅에서
  - 여러분이 거주하는 땅에서
  lexicon: HALOT
  rationale: 히브리어의 ‘위에/에서’ 감각을 직접 옮기되, 한국어에서는 ‘사는 동안’이 경고의 현재성과 지속성을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 경고문의 강한 명령·위협 어조
  chosen_reading: 완곡화하지 않고, 쫓아내지 않으면/괴롭힐 것입니다처럼 결과를 직접적으로 드러냈습니다.
  alternative_readings:
  - 완만하게 ‘물리치지 않으면’으로 약화
  - 미래 결과를 덜 직접적으로 표현
  rationale: 본문은 가나안 정착을 둘러싼 언약적 경고이므로, 실질적 제거와 그 결과를 분명히 드러내는 것이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 언약 경고와 순종-불순종의 결과 구조
