lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하고
  - 길을 떠나
  lexicon: HALOT
  rationale: 여정 공식에서 נסע는 한 진영에서 다음 진영으로 이동하는 뜻이므로, 현대 한국어에서는 자연스럽고 간결한 ‘떠나’가 가장 잘 맞습니다.
- source_word: מֵהַר שָׁפֶר
  english_pob_choice: from Mount Shepher
  chosen_korean: 샤펠 산에서
  alternatives_korean:
  - 셰페르 산에서
  - 샤펠에서
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 적절하며, 영어 POB의 ‘Shepher’ 대신 자음과 모음값을 반영한 ‘샤펠’로 옮겼습니다. ‘산’은 הַר의 기본 의미를 살렸습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프했습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 맥락에서 ‘진을 치다’가 가장 정확하고, 단순한 야영보다 군사적·이동식 체류의 뉘앙스를 더 잘 드러냅니다.
- source_word: בַּחֲרָדָה
  english_pob_choice: at Haradah
  chosen_korean: 하라다에
  alternatives_korean:
  - 하라다에서
  - 하라다에 있는
  lexicon: HALOT
  rationale: 장소명은 음역하고, 정착·체류 지점의 용법을 따라 ‘에’로 처리했습니다.
