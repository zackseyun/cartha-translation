lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠났습니다
  - 출발했습니다
  - 나아갔습니다
  lexicon: HALOT
  rationale: 이동 서술 공식에서 נסע는 ‘짐을 꾸려 출발하다’의 의미이므로, 현대 한국어에서는 자연스럽게 ‘떠나다’로 옮기는 것이 가장 직접적입니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 치고
  - 야영하고
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 문맥에서 ‘진을 치다/진을 치고 머물다’의 관용적 표현이므로, 단순한 숙박보다 행위성을 살린 ‘진을 치고’가 적절합니다.
- source_word: בְּהָרֵי הָעֲבָרִים
  english_pob_choice: in the mountains of Abarim
  chosen_korean: 아바림 산맥에
  alternatives_korean:
  - 아바림 산들에
  - 아바림의 산들에
  - 아바림 산지에
  lexicon: HALOT
  rationale: 지명으로 굳어진 표현이므로 음역을 유지하되, 복수형 ‘산들’의 의미를 한국어에서는 지형 명칭인 ‘산맥’으로 자연스럽게 반영했습니다.
- source_word: לִפְנֵי נְבוֹ
  english_pob_choice: before Nebo
  chosen_korean: 느보 맞은편에
  alternatives_korean:
  - 느보 앞에
  - 느보 전에
  - 느보를 마주한 곳에
  lexicon: HALOT
  rationale: לִפְנֵי는 단순히 ‘before’가 아니라 공간적 대면/대향을 나타낼 수 있으므로, 영어 주석의 가능성 중 하나를 살려 한국어에서는 ‘맞은편’으로 렌더링했습니다.
theological_decisions:
- issue: 지명 관계를 어떻게 드러낼지
  chosen_reading: ‘느보 맞은편에’로 옮겨, 정확한 방위보다 공간적 상대 위치를 열어 두었습니다.
  alternative_readings:
  - 느보 앞에
  - 느보 동쪽에
  - 느보 반대편에
  rationale: 본문의 전치사 לִפְנֵי는 방향을 특정하지 않으며, 영어 POB도 ‘opposite / in front of’의 가능성을 주석으로 남깁니다. 따라서 해석을 과도하게 고정하지 않는 번역이 더 충실합니다.
  doctrine_reference: 본문 의미 보존과 과잉 추론 방지
