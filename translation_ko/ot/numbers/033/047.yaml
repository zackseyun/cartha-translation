  source_fidelity: 수정이 필요합니다. 히브리어는 ‘알몬디블라다임에서 떠나, 느보 앞의 아바림 산지에 진을 쳤다’라는 한 번의 이동과 한 번의 진침을 서술합니다. 초안의 ‘진을 치고, 느보 맞은편에 머물렀습니다’는 ‘머물렀다’라는 별도의 행위를 추가하고, 느보와의 공간 관계를 진침과 분리합니다.
  naturalness: ‘느보 앞에 있는 아바림 산지에 진을 쳤습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 지명 수식 관계도 분명합니다.
  terminology: 알몬디블라다임, 아바림, 느보는 지명으로 음역했습니다. הָרֵי의 복수 지형 표현은 ‘산맥’보다 지형적 연속성을 과도하게 함축하지 않는 ‘산지’로 옮겼습니다. לִפְנֵי의 정확한 공간 관계는 본문에서 확정되지 않으므로 본문에서는 ‘앞에’로 보존하고 각주에서 대안을 제시합니다.
