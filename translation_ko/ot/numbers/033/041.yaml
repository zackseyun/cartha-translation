lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: HALOT
  rationale: 여정 목록의 נסע는 단순 이동보다 ‘진을 걷고 다음 장소로 이동하다’의 뜻이므로, 자연스러운 현대 한국어로 ‘떠나’가 가장 잘 맞습니다.
- source_word: מֵהֹר הָהָר
  english_pob_choice: from Mount Hor
  chosen_korean: 호르 산에서
  alternatives_korean:
  - 호르 산으로부터
  - 호르 그 산에서
  lexicon: HALOT
  rationale: 지명 הֹר הָהָר는 관용적으로 ‘호르 산’으로 옮기는 것이 자연스럽고, 출발점 표지는 조사 ‘-에서’로 분명히 드러냅니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  lexicon: HALOT
  rationale: חנה는 광야 여정 맥락에서 ‘진을 치다/야영하다’의 뜻이므로, 한국어 성서 문맥에 맞는 ‘진을 쳤습니다’가 가장 직접적입니다.
- source_word: בְּצַלְמֹנָה
  english_pob_choice: at Zalmonah
  chosen_korean: 살몬아에
  alternatives_korean:
  - 살몬아에서
  - 살몬아에 있는
  lexicon: HALOT
  rationale: ב가 붙은 지명은 도착·체류 지점을 나타내므로, 장소 종착을 자연스럽게 나타내는 ‘-에’가 적절합니다.
