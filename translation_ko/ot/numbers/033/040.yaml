id: NUM.33.40
reference: Numbers 33:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Negev'' may also be rendered ''the south'' or ''the southern region.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아라드의 가나안 사람이었는데, 그는 가나안 땅의 네게브에 살고 있었으며, 이스라엘 자손이 오자 들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가나안 사람’은 원문의 정관사 있는 민족/거주자 표지를 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘네게브’는 ‘남쪽’ 또는 ‘남부 지역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘이스라엘 자손’(sons of Israel)이라고 말합니다.
    reason: source_note
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanite
  chosen_korean: 가나안 사람
  alternatives_korean:
  - 가나안인
  - 가나안족
  lexicon: HALOT
  rationale: 정관사가 붙은 민족/거주자 표지를 한국어에서는 자연스럽게 ‘가나안 사람’으로 옮겨, 아라드의 통치 정체를 설명하는 서술성을 살렸습니다.
- source_word: מֶלֶךְ עֲרָד
  english_pob_choice: the king of Arad
  chosen_korean: 아라드의 왕
  alternatives_korean:
  - 아라드 왕
  - 아라드의 임금
  lexicon: HALOT
  rationale: 히브리어는 ‘아라드의 왕’이라는 소유·관계 구문이므로 이를 그대로 반영했습니다. ‘왕’은 현대 표준어에서 자연스럽고, ‘임금’은 고전적 뉘앙스가 강합니다.
- source_word: בַּנֶּגֶב
  english_pob_choice: in the Negev
  chosen_korean: 네게브에
  alternatives_korean:
  - 남쪽에
  - 남부 지역에
  lexicon: HALOT
  rationale: 네게브는 지리적 고유명으로 굳어진 표현이므로 음역을 유지했습니다. 일반어 ‘남쪽’보다 위치 식별력이 높습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 원문이 문자적으로 ‘이스라엘의 아들들’이지만, 한국어 성경 전통과 현대 가독성을 함께 고려하면 ‘이스라엘 자손’이 가장 직접적이고 투명합니다.
theological_decisions:
- issue: 서술 순서와 배경 설명의 처리
  chosen_reading: ‘가나안 사람… 그는 … 살고 있었으며’로 두 개의 배경 정보를 분리해, 원문의 연속적 설명을 유지했습니다.
  alternative_readings:
  - ‘가나안 사람인 아라드의 왕이 네게브에 살고 있었는데’
  - ‘아라드의 가나안 왕이 네게브에 살고 있었는데’
  rationale: 히브리어의 ‘그리고/그리고 그는’ 구조는 단순 병렬이 아니라 인물 식별 뒤 배경 설명을 덧붙이는 방식입니다. 한국어에서도 이 층위를 드러내는 것이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 서술 관찰(문법·담화 구조)
