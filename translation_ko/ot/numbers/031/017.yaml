base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''who has known a man by the lying of a male,'' a Hebrew idiom for sexual relations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제, 아이들 가운데 모든 남자를 죽이고, 남자와 동침하여 남자를 안 여자는 모두 죽이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘남자의 눕는 것으로 남자를 아는’이라는 관용구로, 성관계를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  lexicon: HALOT
  rationale: 전환의 접속사 וְ와 당면한 명령을 여는 עַתָּה의 결합을 한국어로 자연스럽게 살리면서, 앞선 맥락에서 이어지는 긴박성을 드러냅니다.
- source_word: הִרְגוּ / הֲרֹגוּ
  english_pob_choice: kill
  chosen_korean: 죽이십시오
  alternatives_korean:
  - قتل하다?
  - 죽여라
  - 처형하십시오
  lexicon: HALOT
  rationale: 히브리어 imperative הרג의 직접성과 강도를 유지하되, 합쇼체 본문에 맞게 정중 명령형으로 옮겼습니다.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  english_pob_choice: who has known a man by lying with him
  chosen_korean: 남자와 동침하여 남자를 안
  alternatives_korean:
  - 남자와 동침한
  - 남자와 성관계를 가진
  - 남자와 잠자리를 같이한
  lexicon: HALOT
  rationale: יָדַע의 성적 관용구를 직설적으로 드러내면서도, 한국어에서 자연스럽게 이해되도록 ‘동침’과 ‘안’의 병치를 사용했습니다.
- source_word: כָל זָכָר בַּטָּף
  english_pob_choice: every male among the little ones
  chosen_korean: 아이들 가운데 모든 남자
  alternatives_korean:
  - 어린아이들 가운데 모든 남자
  - 어린 것들 가운데 모든 남자
  lexicon: HALOT
  rationale: טַף를 ‘아이들’로 옮겨 어린 연령층을 자연스럽게 드러내고, זָכָר를 ‘남자’로 대응시켜 성별 구분을 분명히 했습니다.
theological_decisions:
- issue: 성적 관용구를 직설적으로 유지할 것인가, 완곡하게 풀어쓸 것인가
  chosen_reading: 본문의 노골성을 유지하되 한국어로 읽히는 관용적 표현을 함께 사용했습니다.
  alternative_readings:
  - '''남자를 알았던 여자'''
  - '''남자와 관계한 여자'''
  rationale: 히브리어는 성관계를 완곡하지만 분명하게 지시하므로, 의미를 희석하지 않으면서도 독자가 이해할 수 있도록 ‘동침’과 ‘안’을 병행했습니다.
  doctrine_reference: 원문 우선과 과도한 완곡화 금지 원칙
