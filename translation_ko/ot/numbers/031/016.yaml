base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
  footnotes:
  - marker: a
    text: Or 'through Balaam’s counsel' or 'on Balaam’s advice.' The Hebrew says literally 'at/by the word of Balaam.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; this refers to the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 바로 이 여자들이 발람의 말로[a] 이스라엘 자손[b]이 브올의 일과 관련하여 야훼를 배신하게 한 자들이며, 그 결과 야훼의 회중 가운데에 전염병이 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘발람의 말로/말에 따라’입니다. 문맥상 발람의 충고나 유도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. 여기서는 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
