id: NUM.31.16
reference: Numbers 31:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
  footnotes:
  - marker: a
    text: Or 'through Balaam’s counsel' or 'on Balaam’s advice.' The Hebrew says literally 'at/by the word of Balaam.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; this refers to the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 바로 이 여자들이 발람의 말로 이스라엘 자손이 야훼께 범죄하게 한 자들이며, 바알브올의 일로 말미암아 야훼의 회중 가운데에 전염병이 일어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘발람의 말/말씀에 의해’입니다. 여기에는 발람의 충고나 유도라는 뜻이 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바알브올’은 본문의 사건을 가리키는 통상적 한국어 표기입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן הֵנָּה
  english_pob_choice: Look, these women were the ones
  chosen_korean: 보십시오, 바로 이 여자들이
  alternatives_korean:
  - 보십시오, 이 여자들이
  - 보라, 바로 이 여자들이
  lexicon: HALOT
  rationale: 감탄·지시를 겸한 반복 표현의 강조를 살리되, 현대 한국어에서 자연스러운 ‘보십시오’와 ‘바로’로 긴박한 지시성을 전달했습니다.
- source_word: בִּדְבַר בִּלְעָם
  english_pob_choice: at Balaam’s word
  chosen_korean: 발람의 말로
  alternatives_korean:
  - 발람의 충고로
  - 발람의 권고로
  - 발람의 말에 따라
  lexicon: HALOT
  rationale: דבר의 기본 의미인 ‘말/말씀’을 유지하면서, 여기서는 발람의 조언·유도라는 기능을 한국어로 간결하게 옮겼습니다.
- source_word: לִמְסָר מַעַל בַּיהוָה
  english_pob_choice: caused the sons of Israel to act unfaithfully against Yahweh
  chosen_korean: 이스라엘 자손이 야훼께 범죄하게 한
  alternatives_korean:
  - 이스라엘 자손이 야훼께 신의를 저버리게 한
  - 이스라엘 자손이 야훼께 배신하게 한
  lexicon: HALOT
  rationale: מעל의 언약적 배신/불성실을 단순 도덕적 과오보다 강하게 드러내기 위해, 한국어에서는 ‘범죄하게 한’으로 옮겨 관계의 위반성을 살렸습니다.
- source_word: עַל דְּבַר פְּעוֹר
  english_pob_choice: in the matter of Peor
  chosen_korean: 바알브올의 일로
  alternatives_korean:
  - 브올의 일로
  - 브올 사건에서
  - 브올의 문제로
  lexicon: HALOT
  rationale: 본문의 사건 지시 표현을 한국어 관용으로 자연스럽게 옮기되, 성경에서 통용되는 사건명 ‘바알브올’을 유지했습니다.
- source_word: בַּעֲדַת יְהוָה
  english_pob_choice: upon the congregation of Yahweh
  chosen_korean: 야훼의 회중 가운데에
  alternatives_korean:
  - 야훼의 회중 위에
  - 야훼의 회중에
  lexicon: HALOT
  rationale: עֵדָה를 제도적 ‘교회’가 아니라 집합체로서의 ‘회중’으로 옮기고, 재앙이 그 가운데 미친다는 공간적 함의를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 야훼의 언약 이름을 직접 사용하므로, 프로젝트 기준에 따라 음역 ‘야훼’를 유지해 고유한 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘범죄하게 한’의 신학적 강도
  chosen_reading: 언약적 불성실을 포함하는 도덕·관계적 위반으로 읽음
  alternative_readings:
  - 단순한 윤리적 죄
  - 배신의 법정적 의미
  rationale: מעל은 단순한 실수보다 신의/충성을 저버리는 언약 위반을 가리키므로, 한국어에서도 그 강도를 약화시키지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (source force)
