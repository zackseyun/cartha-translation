id: NUM.31.48
reference: Numbers 31:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
  footnotes:
  - marker: a
    text: Or 'approached Moses.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'officers' refers to men appointed over military units; the following phrase specifies them as commanders of thousands and of hundreds.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 군대의 천 명 단위 부대와 백 명 단위 부대를 맡은 군사 지휘관들[a], 곧 천부장들과 백부장들[b]이 모세에게 다가왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַפְּקֻדִים는 여기서 군사 부대를 맡도록 임명된 책임자들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘천부장들’과 ‘백부장들’은 각각 천 명 단위와 백 명 단위의 군사 지휘관들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  english_pob_choice: came near
  chosen_korean: 다가왔습니다
  alternatives_korean:
  - 가까이 왔습니다
  - 나아왔습니다
  - 접근했습니다
  lexicon: HALOT
  rationale: 서사 동사의 구체적 이동감을 살리면서도 현대 한국어에서 자연스럽고 공손한 문체를 유지하기 위해 ‘다가왔습니다’를 선택했습니다.
- source_word: הַפְּקֻדִים
  english_pob_choice: the officers
  chosen_korean: 관리들이
  alternatives_korean:
  - 장교들이
  - 임명된 사람들
  - 감독들이
  lexicon: HALOT
  rationale: 본문은 군대 단위 위에 세워진 책임자들을 가리키므로, 현대 한국어에서 직책 기능을 드러내는 ‘관리들’이 가장 무리 없이 의미를 전달합니다.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of thousands and the commanders of hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 수천의 지휘관들과 수백의 지휘관들
  - 천인대장들과 백인대장들
  - 천부들과 백부들
  lexicon: HALOT
  rationale: 히브리어의 군사 계층을 한국어 관용 표현으로 옮기되, ‘천부장/백부장’은 직책과 위계를 분명하게 드러내므로 본문의 군사적 구조에 잘 맞습니다.
theological_decisions:
- issue: 군대의 계층적 호칭을 한국어에서 어떻게 제시할지
  chosen_reading: 본문의 두 겹 표현을 모두 살려 ‘천부장들과 백부장들’과 ‘군대의 수천 명을 맡은 관리들’로 함께 제시했습니다.
  alternative_readings:
  - ‘수천 명의 지휘관들과 수백 명의 지휘관들’로만 옮김
  - ‘천인장들과 백인장들’로만 옮김
  rationale: 히브리어는 단순한 숫자 언급이 아니라 책임 범위를 보여 주므로, 한국어에서도 직책명과 설명적 구문을 함께 써서 계층 구조를 분명히 했습니다.
  doctrine_reference: 본문의 역사 서술과 군사 행정 구조를 반영하는 번역상의 판단
- issue: הַפְּקֻדִים의 의미를 군사적 직책으로 드러낼지
  chosen_reading: 직역적 느낌만 남기지 않고, 이들이 단순한 ‘기록된 사람들’이 아니라 군사 단위의 책임자라는 점을 드러냈습니다.
  alternative_readings:
  - ‘기록된 사람들’
  - ‘소집된 자들’
  rationale: 문맥상 뒤따르는 ‘천부장들 / 백부장들’이 이 단어를 해석해 주므로, 의미를 흐리지 않도록 직무 중심으로 번역했습니다.
  doctrine_reference: 문맥에 따른 어휘 선택 원칙
