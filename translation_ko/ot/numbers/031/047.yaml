revisions:
- from: 이스라엘 자손의 절반에서, 모세는 사람과 가축 가운데서 쉰 개 가운데 하나 몫을 취하여, 야훼의 장막의 책임을 지키는 레위인들에게 주었으니, 야훼께서 모세에게 명령하신 그대로였습니다.[a][b]
  to: 모세는 이스라엘 자손에게 돌아간 절반[a]에서 사람과 가축 가운데 쉰 개마다 하나를[b] 취하여, 야훼의 장막을 맡아 지키는 레위인들에게 주었습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.
  rationale: 이스라엘의 분배 몫임을 ‘이스라엘 자손에게 돌아간 절반’으로 명확히 하고, 오십 분의 일 부과를 자연스러운 한국어인 ‘쉰 개마다 하나를 취하여’로 옮겼습니다. 장막 관련 직무는 ‘맡아 지키는’으로 번역했습니다. 마지막 순응절은 원문의 ‘야훼께서 명령하신 대로’를 보존하면서도 현대 합쇼체 서술에 맞게 독립 문장으로 정리했습니다. 각주 b는 수량 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:44:53Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 주요 요소, 즉 이스라엘 자손에게 속한 절반, 사람과 가축에서 취하는 오십 분의 일, 레위인, 장막의 맡은 직무, 그리고 야훼의 명령에 따른 행위는 대체로 반영되었습니다. 그러나 현 번역의 종결 구조는 서술의 주체와 문법적 연결을 흐리며, 각주 b의 표지가 해당 어구가 아니라 문장 끝의 ‘야훼’에 붙어 있어 원문의 대상 어구를 올바르게 가리키지 못합니다.
  naturalness: ‘쉰 개 가운데 하나 몫’과 ‘장막의 책임을 지키는’은 현대 표준 한국어로 다소 부자연스럽습니다. 또한 ‘주었으니, ... 그대로였습니다’는 모세의 행위를 서술하다가 비인칭 판단문으로 부자연스럽게 전환됩니다. ‘쉰 개마다 하나를’, ‘장막을 맡아 지키는’, ‘주었습니다. 이는 ... 대로였습니다’가 합쇼체 문체에서 명료하고 자연스럽습니다.
  terminology: ‘이스라엘 자손’과 ‘야훼’는 원문 및 프로젝트 용례에 부합합니다. מִשְׁמֶרֶת의 직무·관리 의미는 ‘장막을 맡아 지키는’으로 자연스럽게 보존할 수 있습니다. אָחֻז의 부과·취득된 몫은 ‘쉰 개마다 하나를 취하여’로 문맥상 충분히 드러납니다.
  issues:
  - severity: medium
    issue: 문장 종결과 논리 연결이 부자연스럽습니다.
    rationale: ‘모세는 ... 주었으니, 야훼께서 ... 그대로였습니다’는 모세의 능동 행위와 ‘그대로였습니다’의 비인칭 서술이 문법적으로 매끄럽게 연결되지 않습니다. כַּאֲשֶׁר의 순응 의미는 별문장으로 자연스럽게 옮길 수 있습니다.
  - severity: medium
    issue: 각주 b의 표지 위치가 원어 어구와 맞지 않습니다.
    rationale: 각주 b는 ‘하나를 오십에서 취함’(אֶחָד מִן הַחֲמִשִּׁים)에 관한 대안 표현인데, 현 본문에서는 문장 끝의 ‘야훼’ 뒤에 표기되어 있습니다. 해당 수량 표현 바로 뒤에 붙여야 합니다.
  - severity: low
    issue: ‘쉰 개 가운데 하나 몫’ 및 ‘장막의 책임을 지키는’의 한국어 표현이 어색합니다.
    rationale: 전자는 수량 단위와 ‘몫’의 결합이 매끄럽지 않고, 후자는 ‘책임을 지키다’보다 ‘장막을 맡아 지키다’가 직무를 지키는 뜻을 자연스럽게 전달합니다.
  revised_text: 모세는 이스라엘 자손에게 돌아간 절반[a]에서 사람과 가축 가운데 쉰 개마다 하나를[b] 취하여, 야훼의 장막을 맡아 지키는 레위인들에게 주었습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.
