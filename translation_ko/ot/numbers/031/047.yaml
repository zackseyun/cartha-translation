  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
  - marker: b
    text: Or 'one taken from every fifty.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세는 이스라엘 자손에게 돌아간 절반[a]에서 사람과 가축 가운데 쉰 개마다 하나를[b] 취하여, 야훼의 장막을 맡아 지키는 레위인들에게 주었습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이스라엘의 자손’; 곧 이스라엘 사람들입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쉰 개 가운데 하나를 떼어 낸 몫’.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: From the half belonging to the sons of Israel
  chosen_korean: 이스라엘 자손의 절반에서
  alternatives_korean:
  - 이스라엘 사람들의 절반에서
  - 이스라엘 자손 가운데 절반에서
  lexicon: HALOT
  rationale: מַחֲצִית는 '절반'이며, בְּנֵי יִשְׂרָאֵל은 집합적으로 '이스라엘 자손'으로 옮기는 것이 원문 형식을 잘 드러냅니다.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  english_pob_choice: one portion out of fifty
  chosen_korean: 쉰 개 가운데 하나 몫
  alternatives_korean:
  - 쉰 분의 하나 몫
  - 쉰 개 중 하나의 몫
  lexicon: HALOT
  rationale: הָאָחֻז는 취하여 떼어낸 몫/부과분을 가리키므로, 수학적 비율을 살리면서도 한국어로 자연스러운 '하나 몫'으로 옮겼습니다.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  english_pob_choice: from the people and from the livestock
  chosen_korean: 사람과 가축 가운데서
  alternatives_korean:
  - 백성 가운데서와 가축 가운데서
  - 사람들에게서와 가축에게서
  lexicon: HALOT
  rationale: 여기서 אָדָם은 개별 남성이 아니라 사람들 전체를, בְּהֵמָה는 전리품으로 잡힌 가축을 가리키므로 간결한 집합적 표현이 적절합니다.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  english_pob_choice: who kept charge of the tabernacle of Yahweh
  chosen_korean: 야훼의 장막의 책임을 지키는
  alternatives_korean:
  - 야훼의 장막을 맡아 지키는
  - 야훼의 장막의 직무를 지키는
  lexicon: HALOT
  rationale: שֹׁמְרֵי מִשְׁמֶרֶת은 단순한 경비보다 위임된 책임을 지키는 뜻이므로, '책임을 지키는'으로 custodial sense를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명어 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겨 고유한 언약 이름을 유지합니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집합 명칭 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문이 '아들들/자손'이라는 직설적 표현을 쓰므로, 의미를 완화하지 않고 집합명으로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 야훼의 직접 명령을 언급하므로, 대체 칭호보다 고유 신명을 드러내는 표기가 본문 기능을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
