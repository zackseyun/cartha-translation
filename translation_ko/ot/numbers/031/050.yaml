- from: 그러므로 우리가 야훼의 예물을 가져왔습니다. 곧 각 사람이 찾아낸 것—금 물품[a], 발목장식과 팔찌, 반지, 귀고리[b][c], 그리고 펜던트입니다. 이는 야훼 앞에서 우리 자신을 위해 속죄하기 위함입니다.
  to: 그러므로 우리는 각 사람이 찾아낸 금으로 된 물품, 팔장식[a], 팔찌, 반지, 귀고리, 그리고 펜던트[b]를 야훼께 예물로 가져왔습니다. 이는 야훼 앞에서 우리 자신을 위한 속죄를 하기 위함입니다[c].
  rationale: 본문의 의미를 바꾸지 않고, אֶצְעָדָה의 보수적 기본 번역을 ‘팔장식’으로 바로잡았습니다. 또한 모든 각주 표지를 실제 설명 대상인 팔장식, 펜던트, 속죄 표현에 각각 배치했으며, נַפְשֹׁתֵינוּ의 문자적 각주를 자연스러운 한국어로 정정했습니다. 문장은 예물의 내용과 속죄 목적의 관계가 분명히 드러나도록 다듬었습니다.
