source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
  footnotes:
  - marker: a
    text: Or possibly 'anklets' for 'armlets' (אֶצְעָדָה).
    reason: lexical_alternative
  - marker: b
    text: The exact meaning of 'pendants' (כוּמָז) is uncertain; possible renderings include 'necklaces,' 'ornaments,' or 'nose-rings.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to make atonement for our lives/our persons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 각 사람이 찾아낸 금으로 된 물품, 팔장식[a], 팔찌, 반지, 귀고리, 그리고 펜던트[b]를 야훼께 예물로 가져왔습니다. 이는 야훼 앞에서 우리 자신을 위한 속죄를 하기 위함입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발목장식’일 수 있습니다(אֶצְעָדָה).
    reason: lexical_alternative
  - marker: b
    text: כוּמָז의 정확한 뜻은 불확실하며, ‘목걸이’, ‘장신구’, ‘코고리’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘우리의 생명/우리 자신을 위하여 속죄하기 위하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב / קָרְבַּן
  english_pob_choice: have brought near / offering
  chosen_korean: 가져왔습니다 / 예물
  alternatives_korean:
