- source_word: כְלִי זָהָב
  english_pob_choice: articles of gold
  chosen_korean: 금 물품
  alternatives_korean:
  - 금 장신구
  - 금 기물
  lexicon: WLC; HALOT
  rationale: כְלִי는 특정 보석류보다 넓은 ‘물품/기물’이므로, 뒤따르는 세부 장식품 목록과 어울리도록 ‘금 물품’으로 넓게 렌더링했습니다.
- source_word: אֶצְעָדָה
  english_pob_choice: armlets
  chosen_korean: 발목장식
  alternatives_korean:
  - 팔장식
  - 팔찌
  lexicon: HALOT
  rationale: 이 단어는 사지에 두르는 장식이지만 구체 부위가 확정적이지 않아, POB의 주석처럼 가능한 ‘anklets’까지 염두에 두는 신중한 대응으로 ‘발목장식’을 택했습니다.
- source_word: צָמִיד / טַבַּעַת / עָגִיל
  english_pob_choice: bracelets / rings / earrings
  chosen_korean: 팔찌, 반지, 귀고리
  alternatives_korean:
  - 팔찌, 장식반지, 귀걸이
  lexicon: HALOT
  rationale: 각 항목을 현대 한국어에서 곧바로 알아볼 수 있게 대응하되, טַבַּעַת는 본문과 POB의 수정 이력상 특수한 ‘signet rings’보다 일반적 ‘반지’가 더 안전하므로 그렇게 옮겼습니다.
- source_word: כוּמָז
  english_pob_choice: pendants
  chosen_korean: 펜던트
  alternatives_korean:
  - 목걸이
  - 목장식
  - 코고리
  lexicon: HALOT
  rationale: 이 항목은 정확한 물품이 불확실하므로, POB의 보수적 처리처럼 특정 형태를 단정하지 않는 현대어 ‘펜던트’를 선택했습니다.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵינוּ
  english_pob_choice: to make atonement for ourselves
  chosen_korean: 우리 자신을 위해 속죄하기 위함입니다
  alternatives_korean:
  - 우리 생명을 위해 속죄하기 위함입니다
  - 우리의 목숨을 속죄하기 위함입니다
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 분명히 드러내기 위해 ‘속죄하다’를 사용했고, נֶפֶשׁ의 ‘생명/사람’ 뉘앙스는 이 문맥에서 한국어의 자연스러운 ‘우리 자신’을 택해 과도한 신학적 확대를 피했습니다.
theological_decisions:
- issue: כפר의 제의적·속죄적 성격 보존
  chosen_reading: 이 예물은 단순한 감사 선물이 아니라, 야훼 앞에서 자신들을 위한 속죄와 연결된 제의적 헌물로 읽었습니다.
  alternative_readings:
  - 단순한 전리품 봉헌
  - 재난을 피하기 위한 일반적 헌납
  rationale: 본문이 קָרְבָּן과 לְכַפֵּר을 함께 사용하므로, 속죄 언어를 완화하지 않고 제의적 의미를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: Numbers 31:50의 제의 문맥과 כפר 용례
