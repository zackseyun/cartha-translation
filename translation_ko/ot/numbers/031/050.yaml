id: NUM.31.50
reference: Numbers 31:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
  footnotes:
  - marker: a
    text: Or possibly 'anklets' for 'armlets' (אֶצְעָדָה).
    reason: lexical_alternative
  - marker: b
    text: The exact meaning of 'pendants' (כוּמָז) is uncertain; possible renderings include 'necklaces,' 'ornaments,' or 'nose-rings.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to make atonement for our lives/our persons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리가 야훼의 예물을 가져왔습니다. 곧 각 사람이 찾아낸 것—금 물품[a], 발목장식과 팔찌, 반지, 귀고리[b][c], 그리고 펜던트입니다. 이는 야훼 앞에서 우리 자신을 위해 속죄하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발목장식’일 수 있습니다(אֶצְעָדָה).
    reason: lexical_alternative
  - marker: b
    text: כוּמָז의 정확한 뜻은 불확실하며, ‘목걸이’, ‘장신구’, ‘코고리’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘우리의 생명/우리의 사람들을 위해 속죄하기 위하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב / קָרְבַּן
  english_pob_choice: have brought near / offering
  chosen_korean: 가져왔습니다 / 예물
  alternatives_korean:
  - 바쳤습니다 / 제물
  - 드렸습니다 / 헌물
  lexicon: WLC; HALOT
  rationale: קרב의 ‘가까이 가져오다’와 קָרְבָּן의 제의적 ‘예물/제물’ 뜻을 함께 살리기 위해, 자연스러운 합쇼체로 ‘가져왔습니다’와 ‘예물’을 선택했습니다.
- source_word: כְלִי זָהָב
  english_pob_choice: articles of gold
  chosen_korean: 금 물품
  alternatives_korean:
  - 금 장신구
  - 금 기물
  lexicon: WLC; HALOT
  rationale: כְלִי는 특정 보석류보다 넓은 ‘물품/기물’이므로, 뒤따르는 세부 장식품 목록과 어울리도록 ‘금 물품’으로 넓게 렌더링했습니다.
- source_word: אֶצְעָדָה
  english_pob_choice: armlets
  chosen_korean: 발목장식
  alternatives_korean:
  - 팔장식
  - 팔찌
  lexicon: HALOT
  rationale: 이 단어는 사지에 두르는 장식이지만 구체 부위가 확정적이지 않아, POB의 주석처럼 가능한 ‘anklets’까지 염두에 두는 신중한 대응으로 ‘발목장식’을 택했습니다.
- source_word: צָמִיד / טַבַּעַת / עָגִיל
  english_pob_choice: bracelets / rings / earrings
  chosen_korean: 팔찌, 반지, 귀고리
  alternatives_korean:
  - 팔찌, 장식반지, 귀걸이
  lexicon: HALOT
  rationale: 각 항목을 현대 한국어에서 곧바로 알아볼 수 있게 대응하되, טַבַּעַת는 본문과 POB의 수정 이력상 특수한 ‘signet rings’보다 일반적 ‘반지’가 더 안전하므로 그렇게 옮겼습니다.
- source_word: כוּמָז
  english_pob_choice: pendants
  chosen_korean: 펜던트
  alternatives_korean:
  - 목걸이
  - 목장식
  - 코고리
  lexicon: HALOT
  rationale: 이 항목은 정확한 물품이 불확실하므로, POB의 보수적 처리처럼 특정 형태를 단정하지 않는 현대어 ‘펜던트’를 선택했습니다.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵינוּ
  english_pob_choice: to make atonement for ourselves
  chosen_korean: 우리 자신을 위해 속죄하기 위함입니다
  alternatives_korean:
  - 우리 생명을 위해 속죄하기 위함입니다
  - 우리의 목숨을 속죄하기 위함입니다
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 분명히 드러내기 위해 ‘속죄하다’를 사용했고, נֶפֶשׁ의 ‘생명/사람’ 뉘앙스는 이 문맥에서 한국어의 자연스러운 ‘우리 자신’을 택해 과도한 신학적 확대를 피했습니다.
theological_decisions:
- issue: כפר의 제의적·속죄적 성격 보존
  chosen_reading: 이 예물은 단순한 감사 선물이 아니라, 야훼 앞에서 자신들을 위한 속죄와 연결된 제의적 헌물로 읽었습니다.
  alternative_readings:
  - 단순한 전리품 봉헌
  - 재난을 피하기 위한 일반적 헌납
  rationale: 본문이 קָרְבָּן과 לְכַפֵּר을 함께 사용하므로, 속죄 언어를 완화하지 않고 제의적 의미를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: Numbers 31:50의 제의 문맥과 כפר 용례
