  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
  footnotes:
  - marker: a
    text: Or 'all their cities in their settlements.' The Hebrew phrase may be rendered more formally, but 'where they lived' expresses the sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'their camps' or 'their villages' for 'their encampments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 불로 그들의 성읍들—곧 그들이 거주하던 곳[b][a]—과 그들의 모든 진영을 태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּמוֹשְׁבֹתָם은 문자적으로는 ‘그들의 거주지들/정착지들’입니다. 본문은 자연스러운 한국어를 위해 그 뜻을 풀어 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עָרֵיהֶם은 ‘그들의 성읍들’로 옮길 수 있으며, 경우에 따라 ‘그들의 도시들’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל עָרֵיהֶם בְּמוֹשְׁבֹתָם
  english_pob_choice: all their cities in their dwelling places / where they lived
  chosen_korean: 그들의 성읍들—곧 그들이 거주하던 곳
  alternatives_korean:
  - 그들의 성읍들 안에 있는 거주지들
  - 그들이 살던 성읍들
  lexicon: HALOT
  rationale: עָרִים은 보통 성읍/도시이며, בְּמוֹשְׁבֹתָם은 ‘거주지들’이라는 위치·상태를 더하는 말이므로, 한국어에서는 중복을 줄이면서도 거주 의미를 살려 옮겼습니다.
- source_word: טִירֹתָם
  english_pob_choice: their encampments
  chosen_korean: 그들의 모든 진영
  alternatives_korean:
  - 그들의 진영들
  - 그들의 촌락들
  lexicon: HALOT
  rationale: טִירָה는 진영, 울타리진 거처, 때로는 촌락까지 가리킬 수 있으나, 여기서는 성읍과 구별되는 집단 거주지를 가리키므로 ‘진영’이 가장 무난합니다.
- source_word: שָׂרְפוּ בָּאֵשׁ
  english_pob_choice: burned with fire
  chosen_korean: 불로 ... 태웠습니다
  alternatives_korean:
  - 불에 태웠습니다
  - 불길로 태웠습니다
  lexicon: HALOT
  rationale: שָׂרַף + בָּאֵשׁ의 도구적 표현을 살려, 한국어에서도 ‘불로’라는 수단 표지를 유지했습니다.
- source_word: וְ ... וְאֵת ... וְאֵת
  english_pob_choice: all ... and all
  chosen_korean: 그들의 성읍들 ... 과 그들의 모든 진영
  alternatives_korean:
  - 모든 성읍들과 모든 진영
  - 성읍들과 진영들을 모두
  lexicon: Hebrew syntax
  rationale: 히브리어의 총괄적 병렬 구조를 살리기 위해 ‘...과 ...’의 병렬을 유지하고, 두 범주가 모두 전소되었음을 분명히 했습니다.
