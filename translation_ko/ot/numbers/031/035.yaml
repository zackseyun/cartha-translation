  text: וְ/נֶ֣פֶשׁ אָדָ֔ם מִן הַ֨/נָּשִׁ֔ים אֲשֶׁ֥ר לֹֽא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר כָּל נֶ֕פֶשׁ שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
  footnotes:
  - marker: a
    text: 'Hebrew: ''had not known the bed of a male,'' an idiom meaning they had not had sexual relations with a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여자들 가운데서 남자의 침상을 알지 못한 사람들은, 곧 모든 사람이, 삼만 이천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘남자의 침상을 알다’는 남자와 성관계를 맺었다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶפֶשׁ אָדָם
  english_pob_choice: persons
  chosen_korean: 사람들
  alternatives_korean:
  - 인격들
  - 개인들
  - 인원들
  lexicon: HALOT
  rationale: נֶפֶשׁ은 살아 있는 존재/사람을 가리키며, 여기서는 전투 포로 여성 집단의 수를 세는 문맥이므로 한국어로는 자연스럽게 ‘사람들’로 옮기는 것이 가장 직접적입니다.
- source_word: מִן הַנָּשִׁים
  english_pob_choice: from the women
  chosen_korean: 여자들 가운데서
  alternatives_korean:
  - 여자들로부터
  - 여자들 중에서
  lexicon: HALOT
  rationale: 전치사 מִן은 이 집단이 여성 포로들 가운데서 추려졌음을 나타내므로, ‘가운데서’가 문맥상 자연스럽고 출처 의미를 유지합니다.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  english_pob_choice: who had not known the bed of a male
  chosen_korean: 남자의 침상을 알지 못한
  alternatives_korean:
  - 남자와 성관계를 맺지 않은
  - 남자와 관계하지 않은
  lexicon: HALOT
  rationale: יָדַע + 성적 완곡표현은 히브리어의 관용구이므로, 본문 이미지를 살리기 위해 직역에 가깝게 ‘남자의 침상’을 유지했습니다. 의미는 문맥상 성관계 부재로 분명합니다.
- source_word: כָּל נֶפֶשׁ שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  english_pob_choice: all the persons, were thirty-two thousand
  chosen_korean: 모든 사람이, 삼만 이천 명이었습니다
  alternatives_korean:
  - 총 삼만 이천 명이었습니다
  - 모두 합해 삼만 이천 명이었습니다
  lexicon: HALOT
  rationale: כָּל נֶפֶשׁ은 총계를 다시 확인하는 서술이므로, ‘모든 사람’으로 반복을 살리고 숫자는 한국어 관용 수사로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 전쟁 포로 여성의 성적 상태를 표시하는 관용구의 직역 수준
  chosen_reading: ‘남자의 침상을 알지 못한’이라는 직역을 본문에 유지했습니다.
  alternative_readings:
  - ‘남자와 성관계를 맺지 않은’으로 완전한 의미를 본문에 반영
  - ‘남자와 관계하지 않은’으로 완곡하게 정리
  rationale: 히브리어 원문의 관용구와 반복적 수사 구조를 보존하는 것이 본문의 기록체를 더 잘 드러내며, 의미 설명은 본문 자체와 문맥으로 충분히 회복됩니다.
  doctrine_reference: '번역 원칙: source-direct, 문학적/기록체 보존'
