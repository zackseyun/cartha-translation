  lexicon: HALOT
  rationale: 열거된 금속들 가운데 בְּדִיל의 통상적 대응인 ‘주석’을 사용해 목록의 성격을 분명히 했습니다.
- source_word: הָעֹפָרֶת
  english_pob_choice: the lead
  chosen_korean: 납
  alternatives_korean:
  - 연
  lexicon: HALOT
  rationale: עֹפָרֶת의 표준 금속 대응어는 ‘납’이며, 문맥상 다른 의미를 취할 이유가 없습니다.
