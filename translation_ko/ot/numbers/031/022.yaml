lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그러나
  - 단지
  lexicon: HALOT
  rationale: 앞 문맥의 범위를 제한하는 예외 표지이므로, 한국어에서는 담백하게 ‘오직’으로 옮겨 제한성을 살렸습니다.
- source_word: הַנְּחֹשֶׁת
  english_pob_choice: the bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 이 금속 목록에서는 전통적으로 ‘놋’이 가장 자연스럽고, 구리/청동의 넓은 뜻도 함께 포괄할 수 있습니다.
- source_word: הַבְּדִיל
  english_pob_choice: the tin
  chosen_korean: 주석
  alternatives_korean:
  - 주석 합금
  - 양은
  lexicon: HALOT
  rationale: 열거된 금속들 가운데 בְּדִיל의 통상적 대응인 ‘주석’을 사용해 목록의 성격을 분명히 했습니다.
- source_word: הָעֹפָרֶת
  english_pob_choice: the lead
  chosen_korean: 납
  alternatives_korean:
  - 연
  lexicon: HALOT
  rationale: עֹפָרֶת의 표준 금속 대응어는 ‘납’이며, 문맥상 다른 의미를 취할 이유가 없습니다.
theological_decisions:
- issue: 반복되는 목적격 표지 אֵת의 처리
  chosen_reading: 한국어 본문에서는 따로 옮기지 않고 단순 병렬 열거로 처리했습니다.
  alternative_readings:
  - 각 금속 앞에 ‘을/를’을 반복해 번역하는 방식
  rationale: 히브리어의 반복 목적격 표지는 목록을 구조화하지만 한국어에서는 어색해지므로, 의미 손실 없이 자연스러운 열거로 재현하는 편이 적절합니다.
  doctrine_reference: Hebrew syntax and discourse structure
