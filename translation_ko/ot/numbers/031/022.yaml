lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그러나
  - 단지
  lexicon: HALOT
  rationale: 앞 문맥의 범위를 제한하는 예외 표지이므로, 한국어에서는 담백하게 ‘오직’으로 옮겨 제한성을 살렸습니다.
- source_word: הַנְּחֹשֶׁת
  english_pob_choice: the bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 이 금속 목록에서는 전통적으로 ‘놋’이 가장 자연스럽고, 구리/청동의 넓은 뜻도 함께 포괄할 수 있습니다.
- source_word: הַבְּדִיל
  english_pob_choice: the tin
  chosen_korean: 주석
  alternatives_korean:
