id: NUM.31.42
reference: Numbers 31:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
  footnotes:
  - marker: a
    text: Or 'from the men who were on campaign' / 'from the men who went out to war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손의 반쪽, 곧 모세가 전장에 나간 사람들 가운데서 나눈 몫입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁에 나간 사람들’ / ‘전투에 나간 사람들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִית
  english_pob_choice: And from the half
  chosen_korean: 그리고 ...의 반쪽
  alternatives_korean:
  - 그리고 그 절반에서
  - 그리고 그 반쪽 몫에서
  lexicon: HALOT
  rationale: מַחֲצִית는 단순한 ‘절반’이지만, 전리품 분배 문맥에서 ‘반쪽’이 자연스럽고 앞뒤 구조를 그대로 살릴 수 있습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: belonging to the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 직역하되, 한국어에서는 소유·귀속을 별도 표현으로 과도하게 풀지 않고 문맥상 자연스럽게 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: חָצָה
  english_pob_choice: had separated
  chosen_korean: 나눈
  alternatives_korean:
  - 분리한
  - 가른
  lexicon: HALOT
  rationale: 모세가 전리품을 양분하여 몫을 떼어 놓은 의미이므로, 과거 완료의 기능을 한국어 서술 안에서 ‘나눈’으로 간결하게 반영했습니다.
- source_word: הַצֹּבְאִים
  english_pob_choice: who served in the army
  chosen_korean: 전장에 나간 사람들
  alternatives_korean:
  - 군복무한 사람들
  - 군대에 속해 싸운 사람들
  - 전쟁에 나간 사람들
  lexicon: HALOT
  rationale: צָבָא의 군사적 동작을 살리면서도 현대 한국어에서 자연스럽게 읽히도록, 영어의 ‘served in the army’에 대응하는 과도한 관용어보다 직결된 표현을 선택했습니다.
theological_decisions:
- issue: 전장(군사 참여) 표현의 범위
  chosen_reading: ‘전장에 나간 사람들’로 옮겨 군사 동원의 사실을 분명히 했습니다.
  alternative_readings:
  - ‘군대에서 복무한 사람들’
  - ‘전쟁에 나간 사람들’
  rationale: 본문은 제의적·도덕적 평가가 아니라 전리품 배분의 대상 집단을 가리키므로, 의미를 흐리지 않는 범위에서 군사 참여를 직접적으로 드러냈습니다.
  doctrine_reference: 본문 해석 및 역사서 서술 원칙
