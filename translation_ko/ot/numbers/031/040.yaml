  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
  footnotes:
  - marker: a
    text: Hebrew 'souls of man'; that is, human persons. 'Souls' is a more literal alternative, but here it functions as a counting term for people.
    reason: lexical_alternative
  - marker: b
    text: Or 'their levy.' The Hebrew refers to the assessed portion of the spoil set apart for the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람[a]은 모두 1만 6천 명이었고, 야훼께 바친 그들의 공물[b]은 서른두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사람의 생명’입니다. 여기서 ‘생명’은 사람을 세는 말로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 할당분’. 히브리어는 전리품 가운데 야훼께 바치도록 떼어 낸 몫을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  english_pob_choice: persons of mankind / persons
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 사람들
  - 영혼들
  - 사람의 혼
  lexicon: HALOT
  rationale: נֶפֶשׁ가 여기서는 인간을 세는 단위로 쓰였으므로, ‘생명’으로 직역하되 문맥상 인구/인원 의미가 드러나도록 했습니다. אָדָם은 인간 범주를 표시하므로 ‘사람’으로 옮겼습니다.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  english_pob_choice: sixteen thousand
  chosen_korean: 만육천
  alternatives_korean:
  - 열여섯 천
  - 1만 6천
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 자연스러운 한국어 관용 수로 옮겼습니다.
- source_word: מִכְסָם
  english_pob_choice: their tribute
  chosen_korean: 공물
  alternatives_korean:
  - 조공
  - 할당분
  - 세금
  lexicon: HALOT
  rationale: 이 단어는 전리품 가운데 여호와께 떼어 바치는 할당분을 가리키므로, 문맥상 ‘공물’이 가장 간결하고 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명은 יהוה이므로 기본 원칙에 따라 ‘야훼’로 옮겼고, 여격 조사로 바침의 방향을 드러냈습니다.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  english_pob_choice: thirty-two persons
  chosen_korean: 서른두 사람
  alternatives_korean:
  - 서른두 생명
  - 서른두 혼
  lexicon: HALOT
  rationale: 마지막 נֶפֶשׁ도 인간 개체를 세는 용법이므로, 한국어에서는 자연스럽게 ‘사람’으로 반복해 행정적 집계를 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나타난 신명은 번역 관례보다 원천어 표기를 우선하는 기본 원칙에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: 사람의 생명 / 사람
  alternative_readings:
  - 혼
  - 영혼
  rationale: 여기서 נֶפֶשׁ는 형이상학적 ‘영혼’보다 사람 수를 세는 집계어로 기능하므로, 독자가 전리품 분배 문맥을 오해하지 않도록 했습니다.
  doctrine_reference: Translation philosophy § North-star principle; glossary on נֶפֶשׁ
