  rationale: 총계가 산출되어 제시되는 수량문이므로, 결과 상태를 자연스럽게 나타내는 ‘이었습니다’가 가장 적절합니다.
- source_word: מֶחֱצַת הָעֵדָה
  english_pob_choice: the half belonging to the congregation
  chosen_korean: 회중의 절반
  alternatives_korean:
  - 회중의 반
  - 회중 몫의 절반
  lexicon: HALOT
  rationale: 소유 관계를 과도하게 풀지 않고, 본문의 ‘회중에 속한 절반’이라는 뜻을 간결하게 살리기 위해 ‘회중의 절반’으로 옮겼습니다.
