  lexicon: HALOT
  rationale: צֹאן은 작은 가축 전체를 가리키지만, 바로 앞뒤 문맥에서 한국어 독자가 쉽게 이해하도록 ‘양 떼’로 옮겼습니다. ‘나온’은 수량 집계의 출처를 자연스럽게 드러냅니다.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  english_pob_choice: 337,500
