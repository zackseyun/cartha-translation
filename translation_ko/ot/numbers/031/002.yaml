review_pass:
  verdict: revise
  source_fidelity: The draft adds an introductory clause ('야훼께서 모세에게 말씀하셨다') that is not present in Numbers 31:2, reverses/obscures the Hebrew relationship of Israel and Midian in the vengeance command, and contains the invalid word '거름' where the death idiom requires '거두어지다.' The revision renders the imperative, the beneficiaries of the vengeance, its target, and the subsequent gathering idiom directly.
  naturalness: The revised wording is modern, clear Korean in the requested formal-polite register. '네 백성에게로 거두어질 것이다' retains the Hebrew metaphor while sounding natural enough in a biblical context.
  terminology: '''이스라엘 자손'' reflects בני ישראל; ''미디안 사람들'' accurately identifies the Midianites; and ''보복'' conveys נקמת without softening the command. The footnote explains the conventional death idiom without specifying an afterlife doctrine.'
  issues:
  - severity: high
    issue: Material absent from the verse has been inserted.
    rationale: The source for 31:2 begins directly with the command; '야훼께서 모세에게 말씀하셨다' belongs to the preceding verse's narrative context, not this verse.
  - severity: high
    issue: The command's syntax does not faithfully express vengeance for Israel against Midian.
    rationale: '''미디안 사람들에 대하여 이스라엘 자손을 위하여 보복을 취하여라'' is awkward and leaves the Hebrew beneficiary/target relations unclear. The revision makes Israel the party for whom vengeance is taken and Midian its target.'
  - severity: high
    issue: '''거름을 당하리라'' is a lexical error and fails to render the death idiom.'
    rationale: The Hebrew Niphal of אסף means 'be gathered' in this idiom; '거름' means fertilizer/manure and is not a possible rendering.
  - severity: medium
    issue: The draft does not consistently use the requested 합쇼체.
    rationale: The command ending '-하여라' is 해라체. The revision uses '-하십시오' as specified.
  revised_text: 이스라엘 자손을 위하여 미디안 사람들에게 보복하십시오. 그 후에 너는 네 백성에게로 거두어질 것이다.[a]
