base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
  footnotes:
  - marker: a
    text: Or “the LORD’s offering” or “the contribution for the LORD”; Hebrew תְּרוּמָה refers to a portion set apart for sacred use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 절반에서 그것을 가져다가 제사장 엘르아살에게 야훼께 드릴 헌물로 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 헌물”로 옮길 수 있습니다. 히브리어 תְּרוּמָה는 거룩한 용도로 따로 떼어 놓은 분깃을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  english_pob_choice: From their half
  chosen_korean: 그들의 절반에서
  alternatives_korean:
  - 그들의 반에서
  - 그들의 몫에서
  lexicon: HALOT
  rationale: מִן + מַחֲצִית는 문맥상 ‘~의 절반에서’를 뜻하므로, 한국어에서는 소유 관계를 살린 ‘그들의 절반에서’가 자연스럽고 간결합니다.
- source_word: תִּקָּחוּ
  english_pob_choice: you shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 취하십시오
  - 취하여
  lexicon: HALOT
  rationale: 법적 지시문으로서 ‘take’를 직접적으로 옮기되, 한국어에서는 뒤 동작과 이어지는 ‘가져다가’가 문맥상 자연스럽습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: Yahweh’s contribution
  chosen_korean: 야훼의 헌물
  alternatives_korean:
  - 야훼의 기부물
  - 야훼께 드리는 몫
  - 야훼의 봉헌물
  lexicon: HALOT
  rationale: תְּרוּמָה는 제의적으로 구별된 분깃/바침을 가리키므로, 현대 한국어에서는 ‘헌물’이 ‘성별된 바침’의 의미를 비교적 자연스럽게 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명사를 가리키므로, 본 프로젝트 기본 원칙에 따라 칭호 ‘주’가 아니라 음역형 ‘야훼’를 유지합니다.
theological_decisions:
- issue: 제의적 분깃을 가리키는 תְּרוּמָה의 한국어 톤
  chosen_reading: ‘헌물’로 옮겨 제의적 성격과 구별된 바침의 성격을 함께 드러냅니다.
  alternative_readings:
  - ‘제물’
  - ‘봉헌물’
  - ‘예물’
  rationale: 이 문맥은 단순한 일반 기부가 아니라 전리품 가운데 구별하여 드리는 몫이므로, ‘헌물’이 의미를 가장 무리 없이 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6 (Readable modern Korean, not archaic or ecclesial over-formality)
