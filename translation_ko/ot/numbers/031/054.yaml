  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶת הַ/זָּהָ֔ב מֵ/אֵ֛ת שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/הַ/מֵּא֑וֹת וַ/יָּבִ֤אוּ אֹת/וֹ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִ/בְנֵֽי יִשְׂרָאֵ֖ל לִ/פְנֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
  footnotes:
  - marker: a
    text: Or 'for the Israelites.' The Hebrew reads 'for the sons of Israel,' a conventional covenantal designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 제사장 엘르아살은 천부장들과 백부장들에게서 그 금을 받아 회막으로 가져가, 야훼 앞에서 이스라엘 자손을 위한 기념으로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 관용적으로 ‘이스라엘의 아들들’이라고 되어 있으며, 곧 ‘이스라엘 사람들’을 가리키는 언약적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 받아서
  alternatives_korean:
  - 취해서
  - 가져서
  lexicon: HALOT
  rationale: 문맥상 모세와 엘르아살이 금을 수납하는 동작이므로 ‘받아서’가 자연스럽고, 영어 POB의 took에 해당하는 수용 동작을 무리 없이 살립니다.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: from the commanders of thousands and of hundreds
  chosen_korean: 천부장들과 백부장들로부터
  alternatives_korean:
  - 수천 명과 수백 명의 지휘관들로부터
  - 천부장들과 백부장들로부터
  lexicon: HALOT
  rationale: 군사적 행정 단위의 우두머리를 가리키므로 전통적인 한국어 군사용어인 ‘천부장/백부장’이 원문의 계층적 직책을 가장 직접적으로 드러냅니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막 안으로
  alternatives_korean:
  - 만남의 장막 안으로
  - 회막으로
  lexicon: HALOT
  rationale: 성막 명칭으로 굳어진 ‘회막’을 쓰되, 이동 동사와 결합해 안쪽으로 들여놓는 동작을 분명히 하기 위해 ‘안으로’를 덧붙였습니다.
- source_word: זִכָּרוֹן
  english_pob_choice: as a memorial
  chosen_korean: 기념물로
  alternatives_korean:
  - 기념으로
  - 기억물로
  - 기념표로
  lexicon: HALOT
  rationale: 의례적 보관물로서의 기능을 살려, 단순한 추상어 ‘기념’보다 결과물/표지의 성격이 드러나는 ‘기념물’로 옮겼습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손을 위한
  alternatives_korean:
  - 이스라엘의 아들들을 위한
  - 이스라엘 백성을 위한
  lexicon: HALOT
  rationale: 문자적으로는 ‘이스라엘의 아들들’이지만, 한국어에서는 관용적으로 ‘이스라엘 자손’이 가장 직역에 가깝고 예배문체에도 잘 맞습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명사 יְהוָה는 ‘야훼’로 옮겨, 단순 호칭이 아니라 언약적 고유명을 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 히브리어 고유명 יְהוָה를 직접 쓰므로, 제목어 ‘주님’으로 바꾸지 않고 신명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לִפְנֵי יְהוָה의 예배적 위치감
  chosen_reading: 야훼 앞에서
  alternative_readings:
  - 야훼 앞에
  - 야훼 면전에서
  rationale: ‘before Yahweh’는 단순한 공간표현을 넘어 예배적/언약적 현존 앞에 둔다는 뜻을 가지므로, 한국어도 ‘앞에서’로 그 긴장을 보존했습니다.
  doctrine_reference: Numbers의 성막-임재 문맥에 따른 위치 표현
