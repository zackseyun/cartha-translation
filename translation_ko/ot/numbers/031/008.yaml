base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
  footnotes:
  - marker: a
    text: Or 'among their slain.' The Hebrew phrase is compact and may describe the kings as killed among the rest of Midian's dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미디안의 왕들과 그들의 나머지 죽임당한 자들을 함께 죽였는데 — 에위, 레겜, 츠르, 후르, 그리고 레바, 곧 미디안의 다섯 왕입니다. 그들은 또 브올의 아들 발람도 칼로 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 죽임당한 자들 가운데.” 히브리어 표현은 매우 압축적이어서, 왕들이 나머지 죽은 자들 가운데서 함께 죽임을 당했다는 뜻일 수 있습니다.
    reason: alternative_reading
