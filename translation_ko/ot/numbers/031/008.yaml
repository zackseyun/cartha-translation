  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
  footnotes:
  - marker: a
    text: Or 'among their slain.' The Hebrew phrase is compact and may describe the kings as killed among the rest of Midian's dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미디안의 왕들, 곧 에위와 레겜과 수르와 후르와 레바, 미디안의 다섯 왕도 그들이 죽인 자들과 함께 죽였습니다[a]. 또 브올의 아들 발람도 칼로 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 죽인 자들 가운데서.” 히브리어 표현은 압축적이어서, 왕들이 다른 미디안 사람들과 함께 또는 그들 가운데서 죽임을 당했다는 뜻일 수 있습니다.
    reason: alternative_reading
