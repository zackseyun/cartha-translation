  naturalness: ‘— … 왕입니다’는 서술 중간의 동격을 합쇼체 종결문으로 처리하여 문체와 문장 구조가 어색합니다. 이름 목록을 ‘곧’으로 동격 처리하고, 각주를 해당 히브리어 구절이 번역된 위치에 붙이면 현대 한국어 성서 문체로 자연스럽습니다.
