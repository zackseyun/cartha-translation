  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
  footnotes:
  - marker: a
    text: Literally, 'have lifted up the head of the men of war,' a Hebrew idiom for taking a count or census.
    reason: lexical_alternative
  - marker: b
    text: Or 'who are in our charge.' Literally, 'who are in our hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 모세에게 말했습니다. “당신의 종들이 우리의 지휘 아래 있는[b] 전쟁에 나간 사람들의 수를 세어 보았는데[a], 우리 가운데 한 사람도 빠지지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘전쟁에 나간 사람들의 머리를 들어 올리다’이며, 여기서는 병력의 수를 세거나 점검한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 손 안에 있는’이며, 문맥상 ‘우리의 지휘 아래 있는’ 또는 ‘우리의 책임 아래 있는’이라는 뜻입니다.
    reason: lexical_alternative
