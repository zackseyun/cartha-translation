  lexicon: HALOT
  rationale: 군사적 결원 보고의 의미를 살리면서도 현대 한국어에서 자연스러운 ‘빠진 자가 없습니다’로 번역했습니다.
theological_decisions:
- issue: 군사 점검 보고의 공손한 화법
  chosen_reading: 모세에게 직접 말하는 보고문이므로 서술은 합쇼체를 유지하되, 인용문 안에서도 예의 있는 군사 보고체를 살렸습니다.
  alternative_readings:
  - 인용문 안을 더 경직된 공문체로 바꾸는 방식
