  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
  footnotes:
  - marker: a
    text: Literally, 'have lifted up the head of the men of war,' a Hebrew idiom for taking a count or census.
    reason: lexical_alternative
  - marker: b
    text: Or 'who are in our charge.' Literally, 'who are in our hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 모세에게 말했습니다. “당신의 종들은 우리 손에 있는 전쟁의 남자들을 계수했는데, 우리 중에서 한 사람도 빠진 자가 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘전쟁의 남자들의 머리를 들어올리다’이며, 여기서는 병력 점검 또는 인원 계수를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 손 안에 있는’이며, 문맥상 ‘우리의 지휘 아래 있는’ 또는 ‘우리의 책임 아래 있는’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 주인의 종들
  lexicon: HALOT
  rationale: 군 지휘관들이 모세에게 예를 갖추어 말하는 문맥이므로, 신분적 속박보다 예속·충성을 나타내는 ‘종들’이 자연스럽습니다.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  english_pob_choice: have taken a count
  chosen_korean: 계수했는데
  alternatives_korean:
  - 머리를 들어올렸는데
  - 인원수를 셌는데
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘머리를 들어올리다’이지만, 여기서는 병력 점검/인원 계수의 의미이므로 짧고 분명한 ‘계수하다’로 옮겼습니다.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  english_pob_choice: who are under our command
  chosen_korean: 우리 손에 있는
  alternatives_korean:
  - 우리의 지휘 아래 있는
  - 우리의 책임 아래 있는
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘우리 손에’가 본문의 관할·책임 의미를 그대로 드러내므로, 주석 없이도 이해 가능한 범위에서 유지했습니다.
- source_word: נִפְקַד מִמֶּנּוּ אִישׁ
  english_pob_choice: not one man of us is missing
  chosen_korean: 우리 중에서 한 사람도 빠진 자가 없습니다
  alternatives_korean:
  - 우리 가운데 한 사람도 빠지지 않았습니다
  - 우리에게서 한 사람도 결원되지 않았습니다
  lexicon: HALOT
  rationale: 군사적 결원 보고의 의미를 살리면서도 현대 한국어에서 자연스러운 ‘빠진 자가 없습니다’로 번역했습니다.
theological_decisions:
- issue: 군사 점검 보고의 공손한 화법
  chosen_reading: 모세에게 직접 말하는 보고문이므로 서술은 합쇼체를 유지하되, 인용문 안에서도 예의 있는 군사 보고체를 살렸습니다.
  alternative_readings:
  - 인용문 안을 더 경직된 공문체로 바꾸는 방식
  - 더 구어적인 보고체로 완화하는 방식
  rationale: 원문은 공식적 보고의 성격이 강하므로, 현대 한국어 독자가 이해하기 쉬운 공손한 보고체가 적합합니다.
  doctrine_reference: 문체/담화 관습
