translation:
  language: ko
  text: 이제 그 탈취물, 곧 군대의 백성이 탈취한 전리품의 나머지는 양이 육십칠만 오천 마리였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘탈취물, 전리품의 나머지’로도 옮길 수 있습니다. 히브리어는 서로 가까운 두 전리품 용어(מַלְקוֹחַ와 בָּז)를 함께 사용하여, 문체상 또는 분류상 뉘앙스를 더합니다.
    reason: lexical_alternative
