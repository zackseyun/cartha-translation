  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
  footnotes:
  - marker: a
    text: Or 'were handed over' or 'were mustered'; the Hebrew verb can denote being provided or assigned for service.
    reason: lexical_alternative
  - marker: b
    text: '''Thousands of Israel'' may refer not only to the number but also to Israel''s larger clan or military divisions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘의 천부장들 가운데에서 한 지파마다 천 명씩, 모두 만이 전쟁에 대비한 병사로 지정되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지정되었습니다’는 히브리어 동사의 수동적 의미를 살린 번역이며, 문맥에 따라 ‘넘겨졌습니다’ 또는 ‘소집되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘의 천부장들’은 여기의 ‘천들’이 단순 수치가 아니라 씨족·군사 편제 단위를 가리킬 수 있다는 문맥적 가능성을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  english_pob_choice: were assigned
  chosen_korean: 지정되었습니다
  alternatives_korean:
  - 넘겨졌습니다
  - 인도되었습니다
  - 소집되었습니다
  - 배정되었습니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 뉘앙스와 전투 수행을 위한 선별·배정의 의미를 함께 살리기 위해, 문맥상 자연스러운 ‘지정되었습니다’를 택했습니다.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  english_pob_choice: from the thousands of Israel
  chosen_korean: 이스라엘의 천부장들 가운데에서
  alternatives_korean:
  - 이스라엘의 천 명들 가운데에서
  - 이스라엘의 천 개 편제 가운데에서
  - 이스라엘의 대단위 집단들 가운데에서
  lexicon: HALOT
  rationale: ‘천들/천부들’은 단순 수치라기보다 씨족·군사 편제를 가리킬 수 있으므로, 한국어에서는 의미를 드러내는 ‘천부장들’로 옮겨 조직적 뉘앙스를 살렸습니다.
- source_word: אֶלֶף לַמַּטֶּה
  english_pob_choice: a thousand from each tribe
  chosen_korean: 한 지파마다 천 명씩
  alternatives_korean:
  - 지파마다 천 명씩
  - 각 지파에서 천 명씩
  - 한 지파당 천 명씩
  lexicon: HALOT
  rationale: 분배적 표현이므로 ‘각 지파에서’의 의미를 자연스럽게 살린 ‘한 지파마다 천 명씩’으로 옮겼습니다.
- source_word: חֲלוּצֵי צָבָא
  english_pob_choice: armed for war
  chosen_korean: 전쟁에 대비한 병사로
  alternatives_korean:
  - 전쟁을 위해 무장한
  - 전투 준비가 된
  - 전쟁에 무장한 군인으로
  lexicon: HALOT
  rationale: ‘חֲלוּצֵי’의 준비된/군장한 상태를 한국어에서 부드럽게 풀어, 단순 무장보다 전투 투입을 위한 준비 상태를 드러냈습니다.
theological_decisions:
- issue: 이스라엘의 천 단위 표현(מֵאַלְפֵי יִשְׂרָאֵל)의 범주
  chosen_reading: 단순 인원수보다 씨족·군사 편제의 의미를 내포하는 표현으로 읽었습니다.
  alternative_readings:
  - 이스라엘의 실제 '천 명 단위' 숫자만 가리킨다고 읽기
  - 각 지파에서 뽑힌 전사 집단의 행정 단위로 읽기
  rationale: 뒤이어 ‘한 지파마다 천 명’이 나오므로, 앞의 ‘천들’은 단순 합계보다 이스라엘의 더 큰 조직 단위를 암시하는 것으로 이해하는 편이 문맥에 더 잘 맞습니다.
  doctrine_reference: 주석적·역사적 문맥 해석
- issue: 군사 동원의 성격
  chosen_reading: 이 구절은 자원봉사 묘사보다, 출정 임무를 위한 공식적 선발·배정의 장면으로 이해했습니다.
  alternative_readings:
  - 자발적 지원으로 읽기
  - 단순한 숫자 집계로 읽기
  rationale: 히브리어 수동형과 POB의 'were assigned'를 따라, 이스라엘 내부에서 전쟁 수행을 위해 사람들을 공식적으로 따로 떼어 세운 장면으로 옮겼습니다.
  doctrine_reference: 본문의 서사적·행정적 의미
