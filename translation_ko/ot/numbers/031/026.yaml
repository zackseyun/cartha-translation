source:
  edition: WLC
  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
  footnotes:
  - marker: a
    text: Or 'the captives' / 'the captive spoil.' The Hebrew expression includes what was captured in war, here specified as both humans and animals.
    reason: lexical_alternative
  - marker: b
    text: '''Of man'' uses Hebrew אָדָם in contrast with animals; the sense is human beings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the heads of the ancestral houses' or more dynamically 'the clan leaders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 제사장 엘르아살과 회중의 가문 우두머리들과 함께, 사로잡은 전리품, 곧 사람과 짐승의 수를 세십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로들’ 또는 ‘포획된 노획물’. 히브리어 표현은 전쟁에서 사로잡은 것을 가리키며, 여기서는 사람과 짐승을 모두 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 짐승과 대비되는 히브리어 אָדָם을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘가문 우두머리들’은 문자적으로 ‘회중의 조상들의 집안들의 우두머리들’이며, 가문 단위의 지도자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  english_pob_choice: Take a count
  chosen_korean: 수를 세십시오
  alternatives_korean:
  - 계수하십시오
  - 헤아리십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로 ‘머리를 들다’가 아니라 ‘세다/계수하다’의 뜻이므로, 현대 한국어에서 자연스러운 동작 동사로 옮겼습니다.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  english_pob_choice: the plunder that was taken captive
  chosen_korean: 전리품 가운데, 곧 ...에게서 취한 것
  alternatives_korean:
  - 포로로 잡힌 전리품
  - 붙잡힌 노획물
  lexicon: HALOT
  rationale: 핵심은 전쟁에서 취한 노획물이며, 이어지는 사람·짐승 구분을 살리기 위해 ‘전리품’으로 넓게 잡고 설명적으로 풀었습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: both of man and of beast
  chosen_korean: 사람과 짐승에게서
  alternatives_korean:
  - 사람과 짐승으로부터
  - 인간과 가축에게서
  lexicon: HALOT
  rationale: אָדָם은 짐승과 대비되는 인간을 가리키므로 ‘사람’으로, בְּהֵמָה는 문맥상 동물 일반보다 전리품 범주를 드러내는 ‘짐승’으로 옮겼습니다.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  english_pob_choice: the heads of the fathers’ houses of the congregation
  chosen_korean: 회중의 조상들의 집안의 우두머리들
  alternatives_korean:
  - 회중의 족장들
  - 회중의 가문의 우두머리들
  lexicon: HALOT
  rationale: 관용적 직함 구조를 유지하되, ‘fathers’ houses’를 한국어에서 오해 없이 드러내기 위해 ‘조상들의 집안’으로 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 명령형의 청자 구성
  chosen_reading: 본문의 명령은 모세 개인뿐 아니라 엘르아살과 회중 대표자들에게 함께 주어진 공동 지시로 읽었습니다.
  alternative_readings:
  - 모세에게만 주어진 단독 명령
  - 엘르아살과 장로들은 보조적 동반자
  rationale: 히브리어는 אַתָּה와 더불어 제사장과 회중의 우두머리들을 병렬로 제시해, 공동 참여를 강조합니다.
  doctrine_reference: 민수기 31장 문맥의 공동 책임과 공적 집계
