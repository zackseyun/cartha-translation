lexical_decisions:
- source_word: וְ/נֶפֶשׁ
  english_pob_choice: the persons
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 사람들
  - 영혼들
  - 사람의 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ는 이 전투/분배 문맥에서 개별 인간을 세는 단위로 쓰였으므로, 단순한 ‘영혼’보다 사람 전체를 가리키는 표현이 적절합니다. ‘생명’은 히브리어의 생명-개체성을 살리면서 한국어에서 수량 대상임을 자연스럽게 드러냅니다.
- source_word: אָדָם
  english_pob_choice: of mankind
  chosen_korean: 사람의
  alternatives_korean:
  - 인간의
  - 인류의
  - 사람들의
  lexicon: HALOT
  rationale: אָדָם은 여기서 인간 범주의 개체임을 밝혀 주므로, ‘사람의’로 옮겨 사람/짐승의 구분을 분명하게 했습니다.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  english_pob_choice: sixteen thousand
  chosen_korean: 만육천
  alternatives_korean:
  - 열여섯 천
  - 육천
  - 16,000
  lexicon: HALOT
  rationale: 히브리어 수사는 문자적으로 16,000을 뜻하므로, 한국어 관용 수사 표기인 ‘만육천’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역이 ‘영혼’인지 ‘사람/생명’인지
  chosen_reading: 개체 인간의 수를 세는 집합적 용례로 이해하여 ‘사람의 생명’으로 번역했습니다.
  alternative_readings:
  - ‘영혼’으로 번역
  - ‘사람들’로 단순화
  rationale: 이 구절은 영혼론이 아니라 인구/전리품 집계를 말하므로, 독자가 물질적 소유 목록 속 수량을 즉시 이해하도록 사람-생명 범주를 드러내는 것이 적절합니다.
  doctrine_reference: 민수기 31장의 전리품/포로 집계 문맥
