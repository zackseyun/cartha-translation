revisions:
- from: 모세는 그들을 전쟁[a]으로 보내었는데, 곧 각 지파에서 천 명씩이었고, 그들과 함께 제사장 엘르아살의 아들 비느하스도 전쟁[b]에 나갔습니다. 그 손에는 거룩한 기물들과 전투 함성을 위한 나팔들이 있었습니다.
  to: 모세는 그들, 곧 각 지파에서 천 명씩 된 이들과 제사장 엘르아살의 아들 비느하스를 전쟁에 보냈습니다. 비느하스의 손에는 거룩한 기물[a]과 전투 신호를 위한 나팔[b]들이 있었습니다.
  rationale: 각주 표지를 해당 히브리어 명사구에 바로 붙여 구조 오류를 바로잡았습니다. 히브리어의 반복된 목적어는 ‘그들, 곧 각 지파에서 천 명씩 된 이들’로 보존했고, 비느하스가 그들과 함께 전쟁에 파견되었다는 관계를 유지했습니다. 마지막 단수 소유 표현은 비느하스로 명시했으며, 나팔의 תְּרוּעָה는 본문에서 과도하게 한정하지 않고 각주에 의미 범위를 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:44:53Z'
