base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
  footnotes:
  - marker: a
    text: Or 'the vessels of the sanctuary' or 'the sacred articles.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the trumpets for the signal' or 'the trumpets of alarm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그들을 전쟁[a]으로 보내었는데, 곧 각 지파에서 천 명씩이었고, 그들과 함께 제사장 엘르아살의 아들 비느하스도 전쟁[b]에 나갔습니다. 그 손에는 거룩한 기물들과 전투 함성을 위한 나팔들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 기물들’ 혹은 ‘거룩한 물건들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신호를 위한 나팔들’ 혹은 ‘경보의 나팔들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내었는데
  alternatives_korean:
  - 보냈는데
  - 파견했는데
  lexicon: HALOT
  rationale: 서술문 맥락의 שלח를 자연스럽고 격식 있게 옮기되, 뒤 절의 부연을 여는 연결감을 살렸습니다.
- source_word: אֶלֶף לַמַּטֶּה
  english_pob_choice: a thousand from each tribe
  chosen_korean: 각 지파에서 천 명씩
  alternatives_korean:
  - 지파마다 천 명
  - 각 지파당 천 명
  lexicon: HALOT
  rationale: 분배를 뜻하는 분포적 표현을 한국어로 가장 자연스럽게 드러냈습니다.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  english_pob_choice: the holy vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 성소의 기구들
  - 거룩한 그릇들
  lexicon: HALOT
  rationale: כְּלֵי הַקֹּדֶשׁ의 넓은 물건/기구 의미를 살리면서, 단순한 그릇보다 더 포괄적인 표현을 택했습니다.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  english_pob_choice: the trumpets for the battle cry
  chosen_korean: 전투 함성을 위한 나팔들
  alternatives_korean:
  - 전투 신호를 위한 나팔들
  - 경보 나팔들
  lexicon: HALOT
  rationale: תְּרוּעָה의 전쟁적 울림을 살리되, 의례적 나팔의 기능을 한국어로 분명하게 표현했습니다.
theological_decisions:
- issue: 제사장 비느하스와 거룩한 기물, 나팔의 동행 의미
  chosen_reading: 본문이 말하는 군사 행동과 제의적 요소의 결합을 그대로 유지하되, 후대적 ‘성전 전쟁’ 개념을 덧붙이지 않았습니다.
  alternative_readings:
  - 비느하스를 단순한 수행원으로만 이해
  - 거룩한 기물을 단지 일반 소지품으로 완화
  rationale: 히브리어 본문은 비느하스, 거룩한 기물, 나팔을 전쟁 동원과 함께 묶어 제시하므로, 그 연결을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
