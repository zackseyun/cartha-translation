    reason: lexical_alternative
  - marker: b
    text: Or 'the trumpets for the signal' or 'the trumpets of alarm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그들, 곧 각 지파에서 천 명씩 된 이들과 제사장 엘르아살의 아들 비느하스를 전쟁에 보냈습니다. 비느하스의 손에는 거룩한 기물[a]과 전투 신호를 위한 나팔[b]들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 기물들’ 혹은 ‘거룩한 물건들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신호를 위한 나팔들’ 혹은 ‘경보의 나팔들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내었는데
  alternatives_korean:
  - 보냈는데
