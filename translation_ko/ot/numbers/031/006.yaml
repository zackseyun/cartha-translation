  - 각 지파당 천 명
  lexicon: HALOT
  rationale: 분배를 뜻하는 분포적 표현을 한국어로 가장 자연스럽게 드러냈습니다.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  english_pob_choice: the holy vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 성소의 기구들
  - 거룩한 그릇들
  lexicon: HALOT
  rationale: כְּלֵי הַקֹּדֶשׁ의 넓은 물건/기구 의미를 살리면서, 단순한 그릇보다 더 포괄적인 표현을 택했습니다.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  english_pob_choice: the trumpets for the battle cry
  chosen_korean: 전투 함성을 위한 나팔들
  alternatives_korean:
  - 전투 신호를 위한 나팔들
  - 경보 나팔들
  lexicon: HALOT
  rationale: תְּרוּעָה의 전쟁적 울림을 살리되, 의례적 나팔의 기능을 한국어로 분명하게 표현했습니다.
theological_decisions:
- issue: 제사장 비느하스와 거룩한 기물, 나팔의 동행 의미
  chosen_reading: 본문이 말하는 군사 행동과 제의적 요소의 결합을 그대로 유지하되, 후대적 ‘성전 전쟁’ 개념을 덧붙이지 않았습니다.
  alternative_readings:
  - 비느하스를 단순한 수행원으로만 이해
  - 거룩한 기물을 단지 일반 소지품으로 완화
  rationale: 히브리어 본문은 비느하스, 거룩한 기물, 나팔을 전쟁 동원과 함께 묶어 제시하므로, 그 연결을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
