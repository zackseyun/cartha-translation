  - severity: medium
    issue: ‘전쟁에 나가 싸우러 나간 전쟁인들’이 중복되고 ‘전쟁인들’이 부자연스럽습니다.
    rationale: הַיֹּצְאִים לַצָּבָא는 전쟁에 출전한 전사들을 뜻합니다. ‘전쟁에 나갔던 전사들’이 현대 한국어에서 자연스럽고 의미도 보존합니다.
