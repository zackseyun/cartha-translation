  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
  footnotes:
  - marker: a
    text: Or 'one soul out of five hundred.' The Hebrew uses nephesh as a counting term for an individual living being, whether human or animal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew adam here refers to the human portion of the spoil, in contrast to the animals listed afterward.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너는 야훼를 위하여, 전쟁에 나가 싸우러 나간 전쟁인들 가운데서, 사람 다섯백 명마다 하나를 거두어 바쳐야 합니다. 그것은 사람과 소와 나귀와 양 떼에서 거두는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲרֵמֹתָ / מֶכֶס
  english_pob_choice: you shall levy / tribute
  chosen_korean: 거두어 바쳐야 합니다
  alternatives_korean:
  - 조세를 거둬야 합니다
  - 헌납해야 합니다
  - 할당하여 바쳐야 합니다
  lexicon: HALOT
  rationale: הרים의 ‘들어 올려 떼어 내다’와 מֶכֶס의 ‘부과된 할당분’이라는 뜻을 함께 살려, 이 전쟁 전리품에서 강제로 떼어 야훼께 드리는 몫임을 자연스럽게 나타냈습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위하여
  alternatives_korean:
  - 야훼께
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 원문의 신명기 표기를 보존하기 위해 야훼를 사용했고, ל־의 목적/귀속 관계를 ‘위하여’로 옮겨 바쳐질 대상임을 드러냈습니다.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: from the men of war
  chosen_korean: 전쟁인들 가운데서
  alternatives_korean:
  - 전사들 가운데서
  - 싸우는 남자들 가운데서
  - 전쟁에 나간 사람들 가운데서
  lexicon: HALOT
  rationale: אַנְשֵׁי הַמִּלְחָמָה의 집단성을 살리되 현대 한국어에서 어색한 직역을 피하기 위해 ‘전쟁인들’로 옮겼습니다.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  english_pob_choice: one out of five hundred
  chosen_korean: 사람 다섯백 명마다 하나
  alternatives_korean:
  - 오백 명마다 하나
  - 오백 명 중 하나
  - 오백 중 한 목숨
  lexicon: HALOT
  rationale: נפש가 여기서는 수량을 세는 관용구이므로 ‘한 목숨’보다 대상별 분배라는 뜻이 분명한 ‘사람 다섯백 명마다 하나’로 풀어 자연스럽게 옮겼습니다.
- source_word: מִן הָאָדָם וּמִן הַבָּקָר וּמִן הַחֲמֹרִים וּמִן הַצֹּאן
  english_pob_choice: from the people and from the cattle and from the donkeys and from the flock
  chosen_korean: 사람과 소와 나귀와 양 떼에서
  alternatives_korean:
  - 사람들과 가축과 나귀들과 양 떼에서
  - 사람과 소와 나귀와 작은 가축에서
  lexicon: HALOT
  rationale: 열거된 전리품 범주를 간결하게 유지하면서, בָּקָר·חֲמֹרִים·צֹּאן의 기본 의미를 현대 독자가 바로 이해할 수 있게 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기와 귀속 표현
  chosen_reading: 야훼를 위하여
  alternative_readings:
  - 야훼께
  - 주님께
  - 여호와께
  rationale: 이 절은 성호를 직접 사용하므로, 본문 안에서 하나님의 고유 이름을 보존하는 것이 원문 가시성을 가장 잘 살립니다. 동시에 제물/헌납의 귀속을 분명히 하기 위해 ‘위하여’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
