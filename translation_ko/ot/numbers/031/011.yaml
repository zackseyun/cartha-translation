translation:
  language: ko
  text: 그들은 모든 전리품과 모든 노획물, 곧 사람과 짐승을 모두 가져갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: And they took
  chosen_korean: 그들은 … 가져갔습니다
  alternatives_korean:
  - 그들은 … 취했습니다
  - 그들은 … 가져갔습니다
  lexicon: לקח
  rationale: 전투 문맥에서 단순한 '취하다'보다 전리품을 수거해 옮겨 가는 동작을 드러내기 위해 '가져갔습니다'를 택했습니다.
- source_word: כָּל הַשָּׁלָל / כָּל הַמַּלְקוֹחַ
  english_pob_choice: all the spoil and all the plunder
  chosen_korean: 모든 전리품과 모든 노획물
  alternatives_korean:
  - 모든 약탈물과 모든 노획물
  - 모든 노획물과 모든 전리품
  lexicon: שָׁלָל / מַלְקוֹחַ
  rationale: 두 명사를 모두 살려 반복성을 유지했고, '전리품/노획물'은 전쟁 약탈의 법적·군사적 뉘앙스를 비교적 직접적으로 전달합니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: both man and beast
  chosen_korean: 곧 사람과 짐승을 모두
  alternatives_korean:
  - 곧 사람과 가축을 모두
  - 사람과 짐승을 모두
  lexicon: אָדָם / בְּהֵמָה
  rationale: 영어 POB의 'man and beast'를 따라 대상을 두 범주로 병렬하고, '짐승'은 인간과 대조되는 피조물 범주를 직접 반영합니다.
theological_decisions:
- issue: 전리품이 사람까지 포함된다는 점의 직설성
  chosen_reading: 사람과 짐승을 모두 가져갔습니다
  alternative_readings:
  - 사람과 가축을 모두 데려갔습니다
  - 사람과 짐승을 모두 데려갔습니다
  rationale: 히브리어가 전쟁의 포획 대상을 사람과 동물로 병렬하므로, 이를 완화하지 않고 그대로 드러내는 쪽이 원문 긴장을 보존합니다.
  doctrine_reference: 전쟁 서술의 직설적 기록 유지
