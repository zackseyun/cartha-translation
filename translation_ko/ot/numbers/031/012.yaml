reference: Numbers 31:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
  footnotes:
  - marker: a
    text: Or 'the congregation of the Israelites.' The Hebrew reads 'the congregation of the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the steppes of Moab.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which are on the Jordan opposite Jericho.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 포로들과 노획물과 전리품을 모세와 제사장 엘르아살과 이스라엘 자손의 회중에게[a], 여리고 맞은편 요단 강가에 있는 모압 평지[b][c]의 진영으로 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 번역으로는 ‘이스라엘 사람들의 회중’이 가능합니다. 히브리어는 ‘이스라엘 자손의 회중’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모압의 평지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여리고 맞은편 요단에 있는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  english_pob_choice: And they brought
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 데려왔습니다
  - 옮겨왔습니다
  lexicon: HALOT
  rationale: 히필형 בוא는 단순한 ‘오다’보다 ‘가져오다/데려오다’의 사역적 의미가 분명하므로, 전리품을 수반한 이동을 자연스럽게 드러내는 ‘가져왔습니다’로 옮겼습니다.
- source_word: הַשְּׁבִי
  english_pob_choice: the captives
  chosen_korean: 포로들
  alternatives_korean:
  - 사로잡힌 사람들
  - 포로
  lexicon: HALOT
  rationale: 전쟁 문맥에서 사람을 가리키는 용례이므로 ‘포로들’이 가장 간명하고 정확합니다.
- source_word: הַמַּלְקוֹחַ
  english_pob_choice: the plunder
  chosen_korean: 노획물
  alternatives_korean:
  - 전리품
  - 획득한 물건
  lexicon: HALOT
  rationale: הַמַּלְקוֹחַ는 ‘붙잡아 얻은 것’의 뉘앙스를 가진 별도 항목이어서, 다음의 הַשָּׁלָל과 구별되도록 ‘노획물’로 옮겼습니다.
- source_word: הַשָּׁלָל
  english_pob_choice: the spoil
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 전쟁 노획물
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 취한 전리품을 뜻하는 통상어이므로, 앞 항목과 의미를 겹치지 않게 ‘전리품’으로 옮겼습니다.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 회중
  alternatives_korean:
  - 이스라엘 백성의 회중
  - 이스라엘 사람들의 회중
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 직역성을 살리되, 회집된 공동체를 가리키는 עֵדָה의 의미를 반영해 ‘회중’으로 옮겼습니다.
- source_word: עַרְבֹת מוֹאָב
  english_pob_choice: the plains of Moab
  chosen_korean: 모압 평지
  alternatives_korean:
  - 모압의 평원
  - 모압 광야 평지
  lexicon: HALOT
  rationale: 지명으로 굳은 표현이므로 현대 한국어에서 자연스러운 ‘모압 평지’를 택했습니다.
theological_decisions:
- issue: 지명 구문 אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ의 방향성
  chosen_reading: 여리고 맞은편 요단 강가에 있는
  alternative_readings:
  - 여리고 앞 요단에 있는
  - 여리고 건너편 요단에 있는
  rationale: עַל יַרְדֵּן는 위치를 ‘요단 강가/요단에’로 풀 수 있고, 문맥상 여리고를 기준으로 한 상대적 위치를 드러내는 번역이 가장 자연스럽습니다.
  doctrine_reference: 지리적 서술은 신학적 쟁점이 아니라 문맥 충실성의 문제입니다.
