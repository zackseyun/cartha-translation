  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'levy' or 'tax' for the assessed portion taken from the spoil.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD’s offering'; traditionally, 'heave offering of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼께 드린 소산의 공물[a]을 제사장 엘르아살에게 주었습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징발분’, ‘세금’. 전리품 가운데 책정된 몫이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶכֶס
  english_pob_choice: tribute
  chosen_korean: 공물
  alternatives_korean:
  - 조세
  - 부과금
  - 헌납분
  lexicon: HALOT
  rationale: 전리품 가운데 책정된 몫이라는 의미를 살리면서 현대 한국어에서 행정적 세금처럼 들리지 않도록 ‘공물’을 택했습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: the contribution for Yahweh
  chosen_korean: 야훼께 드린 소산
  alternatives_korean:
  - 야훼의 헌물
  - 야훼께 바친 헌납물
  - 야훼를 위한 예물
  lexicon: HALOT
  rationale: תְּרוּמָה의 ‘들어 올려 구별한 몫’이라는 제의적 성격을 반영하되, 직역투인 ‘거제’나 기술용어 ‘헌제물’은 피하고 자연스러운 문맥어로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명 사전을 따라 하나님의 고유명으로 ‘야훼’를 유지했습니다. 이는 호칭 ‘주’로 바꾸지 않고 원문의 인칭성을 보존합니다.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  english_pob_choice: to Eleazar the priest
  chosen_korean: 제사장 엘르아살에게
  alternatives_korean:
  - 제사장 엘르아살에게
  - 엘르아살 제사장에게
  lexicon: HALOT
  rationale: 히브리어의 명사구 apposition을 자연스럽게 풀어, 한국어 어순에서 가장 분명한 ‘제사장 엘르아살’로 처리했습니다.
theological_decisions:
- issue: 야훼라는 하나님의 이름을 어떻게 처리할 것인가
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 음역해 고유명을 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 명령의 출처를 단순한 칭호가 아니라 언약의 이름으로 표시하므로, 신명 자체를 드러내는 번역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
