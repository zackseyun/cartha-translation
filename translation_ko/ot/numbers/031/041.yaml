  lexicon: HALOT
  rationale: 전리품 가운데 책정된 몫이라는 의미를 살리면서 현대 한국어에서 행정적 세금처럼 들리지 않도록 ‘공물’을 택했습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: the contribution for Yahweh
  chosen_korean: 야훼께 드린 소산
  alternatives_korean:
