  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
  footnotes:
  - marker: a
    text: Or 'you shall be purified.' The Hebrew can denote becoming ritually clean after the prescribed washing.
    reason: lexical_alternative
  - marker: b
    text: Or 'you may enter the camp.' The sense is that reentry is permitted after the cleansing is complete.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 일곱째 날에 너희 옷을 빨아야 합니다[a]. 그러면 깨끗해질 것입니다[b]. 그 후에야 진영으로 들어갈 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결하게 되어야 합니다.’ 히브리어는 규정된 씻음을 거쳐 제의적으로 깨끗해지는 뜻도 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘진영에 들어갈 수 있습니다.’ 정결이 완료된 뒤 재입장이 허용된다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  english_pob_choice: you shall wash
  chosen_korean: 너희는 … 빨아야 합니다
  alternatives_korean:
  - 너희는 … 씻어야 합니다
  - 너희는 … 세탁해야 합니다
  lexicon: HALOT
  rationale: כּבּס는 옷이나 천을 ‘빨다/세탁하다’는 뜻이므로, 현대 한국어에서 자연스럽고 구체적인 ‘빨다’를 택했습니다.
- source_word: בִּגְדֵיכֶם
  english_pob_choice: your clothes
  chosen_korean: 너희 옷
  alternatives_korean:
  - 너희 옷가지
  - 너희 의복
  lexicon: HALOT
  rationale: בגד은 의복을 가리키며, 여기서는 일상적이면서도 원문의 대상을 분명히 하는 ‘옷’이 적절합니다.
- source_word: וּטְהַרְתֶּם
  english_pob_choice: you shall be clean
  chosen_korean: 깨끗해질 것입니다
  alternatives_korean:
  - 정결해질 것입니다
  - 깨끗하게 될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 제의적 상태의 회복을 가리키므로, 능동적 ‘정결하다’보다 결과 상태를 드러내는 ‘깨끗해지다’가 원문에 더 가깝습니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 진중
  - 야영지
  lexicon: HALOT
  rationale: הַמַּחֲנֶה는 이스라엘의 집단 거주·군사적 숙영지를 가리키므로, 출애굽/광야 문맥에 맞는 ‘진영’이 적절합니다.
theological_decisions:
- issue: 제의적 정결을 표현하는 한국어 선택
  chosen_reading: ‘깨끗해질 것입니다’로 옮겨, 도덕적·영적 정화보다 의식적 정결 상태의 회복을 드러냈습니다.
  alternative_readings:
  - 정결해질 것입니다
  - 깨끗하게 될 것입니다
  rationale: 본문은 전쟁 후 부정 상태에서 정결 규례를 마친 뒤 다시 진영에 들어가는 절차를 말하므로, 제의적 상태 변화를 자연스럽게 전달하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
