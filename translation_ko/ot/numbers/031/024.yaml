  to: 너희는 일곱째 날에 너희 옷을 빨아야 합니다. 그러면 정결해질 것입니다[a]. 그 후에 진영으로 들어갈 수 있습니다[b].
  rationale: 히브리어의 순서와 제의적 정결 의미를 보존하면서, ‘정결해질 것입니다’로 טהר의 문맥상 의미를 명료하게 했습니다. ‘그 후에야’를 ‘그 후에’로 조정해 불필요한 강조를 피했고, 두 각주 표지를 해당 원문 어구와 내용에 맞게 바로잡았습니다.
