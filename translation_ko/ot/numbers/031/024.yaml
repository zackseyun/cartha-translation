    rationale: a는 현재 ‘빨아야 합니다’에 붙어 있으나 그 내용은 טהר(정결해짐)의 대안입니다. b는 현재 ‘깨끗해질 것입니다’에 붙어 있으나 그 내용은 진영 입장의 대안입니다. 각각 정결과 진영 입장 어구에 붙여야 합니다.
