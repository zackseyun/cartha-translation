  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
  footnotes:
  - marker: a
    text: Or 'for military service.' The Hebrew לַצָּבָא can denote service in the military force, not merely movement toward a location.
    reason: lexical_alternative
translation:
  language: ko
  text: 지파마다 천 명씩, 지파마다 천 명씩, 곧 이스라엘의 모든 지파에서 너희는 그들을 군대로 보내야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군사 복무를 위해.’ 히브리어 לַצָּבָא는 단순히 어떤 장소로 이동하는 것뿐 아니라 군대에서 복무하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  english_pob_choice: a thousand
  chosen_korean: 천 명씩
  alternatives_korean:
  - 천 명
  - 일천 명
  lexicon: HALOT
  rationale: 수사 אֶלֶף는 인원 단위로 자연스럽게 '천 명'으로 옮기되, 분배의 반복감을 살리기 위해 '-씩'을 붙였습니다.
- source_word: לַמַּטֶּה
  english_pob_choice: from each tribe
  chosen_korean: 각 지파에서
  alternatives_korean:
  - 지파마다
  - 각 지파로부터
  lexicon: HALOT
  rationale: ל + מַטֶּה는 군사·인구 조사 문맥에서 분배적 의미이므로, '각 지파에서'가 출처를 분명히 하면서도 자연스럽습니다.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  english_pob_choice: A thousand from each tribe, a thousand from each tribe
  chosen_korean: 각 지파에서 천 명씩
  alternatives_korean:
  - 지파마다 천 명씩
  - 각 지파에서 천 명, 각 지파에서 천 명
  lexicon: HALOT
  rationale: 히브리어의 의도적 반복을 한국어에서도 완전히 지우지 않도록 뒤의 '이스라엘의 모든 지파에서 천 명씩'과 나란히 배치해 반복 효과를 살렸습니다.
- source_word: לַצָּבָא
  english_pob_choice: to the army
  chosen_korean: 군대로
  alternatives_korean:
  - 전쟁을 위해
  - 군사 복무로
  lexicon: HALOT
  rationale: צָבָא는 이 문맥에서 단순한 이동이 아니라 군사 집단/복무를 가리키므로, 본문 의미를 직선적으로 드러내는 '군대로'를 택했습니다.
theological_decisions:
- issue: 명령형의 한국어 존대 수준
  chosen_reading: 하나님 말씀의 직접 인용이 아닌 서술 명령이므로 '보내야 합니다'로 현대 공적 문체를 유지했습니다.
  alternative_readings:
  - 보내야 하십니다
  - 보내십시오
  rationale: 이 절은 모세에게 주어진 지시문으로, 청중에게 직접 하는 설교체 명령보다 본문 서술의 객관성을 유지하는 편이 적절합니다.
  doctrine_reference: 본문 서술체/직설법의 문체 보존
