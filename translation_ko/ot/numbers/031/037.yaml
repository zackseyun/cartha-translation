lexical_decisions:
- source_word: הַמֶּכֶס
  english_pob_choice: the tribute
  chosen_korean: 징수분
  alternatives_korean:
  - 공물
  - 조세
  - 할당분
  lexicon: HALOT
  rationale: 문맥상 전리품 가운데 여호와께 돌려진 몫이므로, 현대 한국어에서 과도한 세법 뉘앙스를 피하면서 ‘거두어 들인 몫’을 드러내는 ‘징수분’이 가장 근접합니다.
- source_word: לַיהוָה / יהוה
  english_pob_choice: for Yahweh
  chosen_korean: 여호와께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 לַ는 귀속·헌납의 방향을 나타내므로 ‘-께’로 옮겼고, 한국어 교회 전통과 프로젝트 기본어휘에 따라 신명은 ‘여호와’로 표기했습니다.
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 양 떼에서
  alternatives_korean:
  - 가축 떼에서
  - 작은 가축에서
  - 양과 염소 떼에서
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함하는 집합명사지만, 한국어에서는 전리품의 집합 범주를 자연스럽게 살리는 ‘양 떼’가 가장 간결합니다.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  english_pob_choice: six hundred seventy-five
  chosen_korean: 육백칠십오 마리
  alternatives_korean:
  - 675마리
  - 육백칠십오
  - 육백칠십오 수
  lexicon: HALOT
  rationale: 히브리어 수사는 정확히 675를 뜻하므로 그대로 옮겼고, 집합명사 ‘양 떼’에 이어 단위를 보충해 한국어 문장으로 수량을 분명히 했습니다.
theological_decisions:
- issue: 여호와의 몫을 나타내는 헌납/귀속 표현
  chosen_reading: ‘여호와께 드린 징수분’으로 번역해 전리품 가운데 하나님께 구별된 몫임을 드러냈습니다.
  alternative_readings:
  - ‘여호와의 공물’
  - ‘여호와께 바친 세금’
  rationale: מֶכֶס는 단순한 세금보다 전쟁 전리품에서 떼어 낸 요구 몫이라는 점이 중요하므로, 공적 납세보다 헌납·징수의 성격을 함께 보존했습니다.
  doctrine_reference: Numbers 31:28-30의 전리품 헌납 규례
