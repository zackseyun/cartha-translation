review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Israelites’ half, the 1-in-50 levy, the listed human and animal categories, the Levites, and Yahweh’s tabernacle. However, ‘매 오십 명 중 한 명’ incorrectly uses the human counter 명 for a levy that includes livestock, and the wording makes the relation of the ratio to each listed category less clear. ‘장막을 지키는’ also understates the Hebrew custodial-duty expression.
  naturalness: The verse should consistently use modern formal-polite 합쇼체. The imperative ending ‘주라’ is not appropriate for the specified register. ‘쉰 가운데 하나씩’ naturally avoids applying a human counter to animals.
  terminology: ‘야훼’ appropriately renders יהוה. ‘성막’ is the standard Korean biblical term for מִשְׁכָּן, and ‘성막의 직무를 맡아 지키는’ conveys שֹׁמְרֵי מִשְׁמֶרֶת more fully than simply ‘장막을 지키는.’ ‘레위 사람들’ appropriately reflects the plural לַלְוִיִּם.
  issues:
  - severity: medium
    issue: The expression ‘매 오십 명 중 한 명’ applies 명 (‘persons’) to a levy drawn from people and animals.
    rationale: The Hebrew ratio governs the human and livestock categories. Korean should use a counter-neutral expression such as ‘각각 쉰 가운데 하나씩.’
  - severity: medium
    issue: The imperative ‘주라’ does not follow the required modern formal-polite 합쇼체 register.
    rationale: The instruction should be rendered with forms such as ‘취하십시오’ and ‘주십시오.’
  - severity: low
    issue: ‘야훼의 장막을 지키는’ is narrower than the Hebrew expression for Levites who keep the assigned charge of the tabernacle.
    rationale: Adding ‘성막의 직무를 맡아’ preserves the assigned-duty/custodial sense without interpretive expansion.
  revised_text: 이스라엘 자손 몫의 절반에서 사람과 소와 나귀와 양 떼와 모든 가축 가운데서 각각 쉰 가운데 하나씩을 취하여, 야훼의 성막의 직무를 맡아 지키는 레위 사람들에게 주십시오.
