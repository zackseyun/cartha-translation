revisions:
- from: 이스라엘 자손의 절반에서 매 오십 명 중 한 명, 곧 사람과 소와 나귀와 양과 모든 가축에서 하나를 취하여 야훼의 장막을 지키는 레위 사람에게 주라.
  to: 이스라엘 자손 몫의 절반에서 사람과 소와 나귀와 양 떼와 모든 가축 가운데서 각각 쉰 가운데 하나씩을 취하여, 야훼의 성막의 직무를 맡아 지키는 레위 사람들에게 주십시오.
  rationale: The revision preserves the source’s sequence and levy formula while removing the inappropriate human-only counter. It updates the commands to 합쇼체, renders מִשְׁכָּן as ‘성막,’ and more closely represents the Levites’ duty of guarding/keeping charge. No footnote is required because the translation is clear and no unresolved textual ambiguity needs annotation.
