lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하시며 이르셨습니다
  alternatives_korean:
  - 그리고 ... 이르셨습니다
  - 그때 ... 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어 완료-연속형의 서술 진행을 자연스러운 한국어로 옮기기 위해 시간 전환을 나타내는 ‘그때’를 두고, 표준적인 신적 발화 공식을 살리기 위해 ‘말씀하시며 이르셨습니다’로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와의 고유명사 יְהוָה이므로, 프로젝트 기본값에 따라 신적 칭호가 아닌 고유명사로서 ‘야훼’를 사용했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - -께
  - -한테
  lexicon: HALOT
  rationale: 모세를 향한 발화 대상 표지로서 현대 한국어의 자연스러운 여격 조사 ‘-에게’를 썼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 라고
  lexicon: HALOT
  rationale: לֵאמֹר는 이어질 직접 발화를 여는 담화 표지이므로, 한국어에서도 다음 절로 연결되는 말투를 살리기 위해 ‘이르셨습니다’를 유지했습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה를 한국어로 어떻게 처리할지
  chosen_reading: ‘주님’ 대신 고유명사 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 언약 이름 יְהוָה를 직접 사용하므로, 호칭으로 바꾸지 않고 고유명사성을 보존하는 번역이 원문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
