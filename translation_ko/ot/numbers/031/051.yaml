  lexicon: HALOT
  rationale: כְּלִי와 מַעֲשֶׂה의 결합은 단순한 금이 아니라 ‘제작된 물품’이라는 뜻이므로, 금의 원재료성과 대비되는 ‘제작품’으로 압축해 옮겼습니다.
- source_word: מֵאִתָּם
  english_pob_choice: from them
  chosen_korean: 그들로부터
  alternatives_korean:
