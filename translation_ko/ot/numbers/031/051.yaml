  lexicon: HALOT
  rationale: 문맥상 전리품으로서 금을 넘겨받는 동작이므로, 자연스러운 서술로 ‘받았습니다’를 택했습니다.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
