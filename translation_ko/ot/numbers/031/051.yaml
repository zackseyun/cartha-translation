  - 모세와 엘르아살 그 제사장
  lexicon: HALOT
  rationale: 히브리어의 이름+직함 구조를 한국어에서도 자연스럽게 옮겨, 엘르아살의 직분을 앞세우는 전통적 용례를 피하지 않으면서도 현대 문체에 맞게 정리했습니다.
- source_word: כְּלִי מַעֲשֶׂה
  english_pob_choice: every crafted article
  chosen_korean: 모든 제작품
  alternatives_korean:
