  rationale: 히브리어는 개별 항목들의 총합을 가리키는 집합적 표현이므로, ‘모든 제작품’으로 번역해 물건의 종류와 수량감을 함께 살렸습니다.
  doctrine_reference: 본문 의미 보존 및 집합명사 처리 원칙
