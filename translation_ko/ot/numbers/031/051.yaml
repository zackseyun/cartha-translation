  lexicon: HALOT
  rationale: 출처를 나타내는 전치사구를 직역에 가깝게 살리되, 한국어 서술 흐름에 맞게 자연화했습니다.
theological_decisions:
- issue: ‘all crafted article(s)’의 집합성 처리
