lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 따랐습니다
  - 이행했습니다
  lexicon: HALOT
  rationale: 앞 문맥의 명령에 대한 순종을 요약하므로, 단순히 ‘하였다’보다 ‘행했습니다’가 결과와 순종의 뉘앙스를 잘 드러냅니다.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  english_pob_choice: Moses and Eleazar the priest
  chosen_korean: 모세와 제사장 엘르아살
  alternatives_korean:
  - 모세와 엘르아살 제사장
  - 모세와 제사장 엘르아살
  lexicon: HALOT
  rationale: ‘הַכֹּהֵן’은 엘르아살의 직분을 밝히는 호격이 아니라 수식어이므로, 한국어에서도 직함을 이름 앞에 두어 자연스럽게 옮겼습니다.
- source_word: כַּאֲשֶׁר
  english_pob_choice: as
  chosen_korean: …대로
  alternatives_korean:
  - …처럼
  - …에 따라
  - …한 바와 같이
  lexicon: HALOT
  rationale: 단순 비교보다 ‘명령에 부합하여’라는 합치의 의미가 핵심이므로 ‘…대로’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유 신명 표지를 보존하기 위해 전통적 대체 호칭 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호와/주님 대체 여부
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문이 직접 신명기호를 사용하므로, 칭호로 바꾸지 않고 고유 이름을 드러내는 편이 원문의 구체성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
