  - 여호와
  rationale: 히브리어 원문이 직접 신명기호를 사용하므로, 칭호로 바꾸지 않고 고유 이름을 드러내는 편이 원문의 구체성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
