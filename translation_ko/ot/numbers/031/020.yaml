  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
  footnotes:
  - marker: a
    text: Or 'you shall cleanse yourselves.' The Hebrew verb is the reflexive form of a root associated with sin/purification and here refers to ritual purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 옷과 모든 가죽 기구와 모든 염소 털로 만든 일과 모든 나무 기구는 너희가 정결케 하라.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 동사 '타하'의 히틀필 형태는 '정결케 하다' 또는 '정결케 되다'를 의미하며, 여기서는 의례적 정결을 위한 행위를 지칭함.
    source: WLC, Strong's Concordance
lexical_decisions:
- source_word: בֶּ֧גֶד
  english_pob_choice: garment
  chosen_korean: 옷
  alternatives_korean: 의복, 의류
  lexicon: Strong's H899
  rationale: 일반적인 의복을 지칭하는 가장 표준적인 번역어로, 현대 한국어의 자연스러운 표현을 선택함.
- source_word: עִזִּ֖ים
  english_pob_choice: goats' hair
  chosen_korean: 염소 털
  alternatives_korean: 염소, 염소 가죽
  lexicon: Strong's H5795
  rationale: 원문은 염소 털을 의미하므로, 가죽이 아닌 털로 만든 직물을 명확히 구분하기 위해 '염소 털'로 번역함.
- source_word: תִּתְחַטָּֽאוּ
  english_pob_choice: purify
  chosen_korean: 정결케 하라
  alternatives_korean: 정결케 되라, 씻기라
  lexicon: Strong's H2891 (hitpael)
  rationale: 히틀필 형태는 피동적 또는 자기 행위를 의미하며, 여기서는 의례적 정결을 위한 행위를 명령하는 뉘앙스를 담아 '정결케 하라'로 번역함.
theological_decisions:
- decision: 명령법 사용
  rationale: 원문의 히틀필 동사는 명령의 뉘앙스를 가지므로, 현대 한국어의 공손한 명령체 '-하라'를 사용하여 하나님의 명령을 명확히 전달함.
