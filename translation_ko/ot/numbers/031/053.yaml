lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  english_pob_choice: the men of the army
  chosen_korean: 그 군대의 남자들
  alternatives_korean:
  - 그 군대의 사람들
  - 그 군인들
  lexicon: HALOT
  rationale: אנשי는 ‘~의 남자들’이라는 소속 관계를 드러내는 구성형이므로, 한국어에서도 군대에 속한 남자들임을 자연스럽게 살려 옮겼습니다.
- source_word: בָּזְזוּ
  english_pob_choice: had taken plunder
  chosen_korean: 전리품을 취했습니다
  alternatives_korean:
  - 약탈했습니다
  - 노략질했습니다
  - 노획했습니다
  lexicon: HALOT
  rationale: בזז는 ‘약탈하다/노략하다’의 뜻이지만, 문맥상 대상이 생략되어 있어 한국어에서는 ‘전리품을 취하다’로 풀어 의미를 분명히 했습니다.
- source_word: אִישׁ לּוֹ
  english_pob_choice: each ... for himself
  chosen_korean: 각자 자기 몫의
  alternatives_korean:
  - 각 사람마다
  - 저마다 자기 자신을 위해
  lexicon: HALOT
  rationale: איש לוֹ의 분배적 의미를 살려, 각 사람이 따로 자기 몫을 챙겼다는 점을 ‘각자 자기 몫의’로 표현했습니다.
