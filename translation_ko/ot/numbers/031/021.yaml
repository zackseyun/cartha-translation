  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
  footnotes:
  - marker: a
    text: Or 'the ordinance of the law' or 'the statute of instruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제사장 엘르아살이 전쟁에 나간 군인들에게 말했습니다. 「이것은 야훼께서 모세에게 명령하신 율법의 규례[a]입니다:」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법의 규례’ 또는 ‘율법의 규정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 이르렀습니다
  lexicon: HALOT
  rationale: 서사의 진행을 나타내는 와우 연속형을 한국어의 자연스러운 시간 부사로 옮겨 흐름을 살렸습니다.
- source_word: אַנְשֵׁי הַצָּבָא
  english_pob_choice: the men of the army
  chosen_korean: 전쟁에 나간 군인들
  alternatives_korean:
  - 군대의 사람들
  - 군인들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자 그대로 '사람들'이지만, 한국어에서는 군사적 집합을 자연스럽게 드러내는 '군인들'이 가장 직접적입니다.
- source_word: הַבָּאִים לַמִּלְחָמָה
  english_pob_choice: who had come to the battle
  chosen_korean: 전쟁에 나간
  alternatives_korean:
  - 전쟁에 이른
  - 전투에 온
  lexicon: HALOT
  rationale: 히브리어 분사는 전쟁을 향해 나아간 군사 집단을 가리키며, 여기서는 실제 문맥상 전투에 참여한 이들을 뜻하므로 과도한 보충 없이 자연스럽게 옮겼습니다.
- source_word: חֻקַּת הַתּוֹרָה
  english_pob_choice: the statute of the law
  chosen_korean: 율법의 규례
  alternatives_korean:
  - 율법의 규정
  - 율법의 법령
  - 율법의 명령
  lexicon: HALOT
  rationale: חֻקָּה는 고정된 규례/규정을 뜻하고, תּוֹרָה는 여기서 권위 있는 율법을 가리키므로 한국어 성경에서 익숙하면서도 법적 성격을 드러내는 '율법의 규례'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명 표기는 전통적 '여호와'보다 학술적 음역인 '야훼'를 사용해 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: יהוה(야훼)의 번역
  chosen_reading: 본문의 신명은 '야훼'로 유지합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 계약의 고유한 신명 יְהוָה를 직접 사용하므로, 일반 호칭으로 바꾸지 않고 고유명 자체를 살리는 쪽이 원문 의미를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
