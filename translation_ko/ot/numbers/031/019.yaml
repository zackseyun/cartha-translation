revisions:
- from: 너희는 진 밖에서 칠 일 동안 머물라. 사람을 죽인 자와 죽임을 당한 자를 만진 자는 너와 너희 포로가 제 삼 일과 제 칠 일에 스스로 정결케 하라.
  to: 너희는 진영 밖에 칠 일 동안 진을 치십시오. 사람을 죽인 모든 사람과 죽임당한 사람을 만진 모든 사람은, 너희와 너희 포로를 포함하여, 셋째 날과 일곱째 날에 자신을 정결하게 하십시오.
  rationale: The revision retains the Hebrew’s military-camp setting, the seven-day period, the two categories of persons requiring purification, and the specified third and seventh days. It corrects the plural addressees, uses modern formal-polite imperatives, and renders the ritual action plainly without importing a claim about moral forgiveness. The inclusive phrasing makes explicit that ‘you and your captives’ belongs with the purification instruction.
