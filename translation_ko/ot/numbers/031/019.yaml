review_pass:
  verdict: revise
  source_fidelity: The draft generally conveys the command to remain outside the camp, the seven-day duration, killing or contact with one slain, and the required purification on the third and seventh days. However, it renders the final plural phrase אַתֶּם וּשְׁבִיכֶם as singular ‘너와 너희 포로,’ which is inconsistent with the Hebrew and obscures the stated inclusion of the captives.
  naturalness: The draft uses non-합쇼체 imperatives (‘머물라,’ ‘정결케 하라’) and the archaic construction ‘정결케.’ ‘진영 밖에 ... 진을 치십시오’ and ‘자신을 정결하게 하십시오’ are natural modern formal-polite Korean.
  terminology: ‘진영,’ ‘포로,’ and ‘정결하게 하다’ are suitable terms. ‘죽임당한 사람’ preserves the Hebrew’s reference to one slain without unnecessarily replacing it with a doctrinally or lexically narrower expression.
  issues:
  - severity: medium
    issue: The address shifts from plural to singular in ‘너와 너희 포로.’
    rationale: אַתֶּם means ‘you’ plural. The phrase is ‘you [plural] and your captives,’ so singular 너 is inaccurate.
  - severity: medium
    issue: The imperative endings do not follow the requested modern formal-polite 합쇼체 register.
    rationale: ‘머물라’ and ‘정결케 하라’ are plain-style commands, whereas the target specification requires 합쇼체.
  - severity: low
    issue: ‘정결케 하라’ is archaic and less natural in contemporary standard Korean.
    rationale: ‘자신을 정결하게 하십시오’ clearly conveys the ritual-purification action in modern usage.
  revised_text: 너희는 진영 밖에 칠 일 동안 진을 치십시오. 사람을 죽인 모든 사람과 죽임당한 사람을 만진 모든 사람은, 너희와 너희 포로를 포함하여, 셋째 날과 일곱째 날에 자신을 정결하게 하십시오.
  revised_footnotes: []
  revision_rationale: The revision retains the Hebrew’s military-camp setting, the seven-day period, the two categories of persons requiring purification, and the specified third and seventh days. It corrects the plural addressees, uses modern formal-polite imperatives, and renders the ritual action plainly without importing a claim about moral forgiveness. The inclusive phrasing makes explicit that ‘you and your captives’ belongs with the purification instruction.
