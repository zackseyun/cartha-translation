  text: 너희는 진영 밖에 칠 일 동안 진을 치십시오. 사람을 죽인 모든 사람과 죽임당한 사람을 만진 모든 사람은, 너희와 너희 포로를 포함하여, 셋째 날과 일곱째 날에 자신을 정결하게 하십시오.
