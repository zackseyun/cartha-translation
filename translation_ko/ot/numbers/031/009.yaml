id: NUM.31.9
reference: Numbers 31:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
  footnotes:
  - marker: a
    text: Or “The Israelites.”
    reason: lexical_alternative
  - marker: b
    text: Or “their children.”
    reason: lexical_alternative
  - marker: c
    text: Or “all their goods” for “all their wealth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 미디안의 여자들과 그들의 어린아이들을 사로잡았고[a], 그들의 모든 가축과 모든 떼[b][c], 그리고 모든 재물을 약탈했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 자녀들”
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들의 모든 소유”로 “그들의 모든 재물”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  english_pob_choice: took captive
  chosen_korean: 사로잡았고
  alternatives_korean:
  - 포로로 잡았고
  - 붙잡았고
  lexicon: HALOT
  rationale: 사람을 전쟁 포로로 잡는 뜻을 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: The sons of Israel
  chosen_korean: 이스라엘 자손이
  alternatives_korean:
  - 이스라엘 사람들은
  - 이스라엘 자손들은
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 반영하되, 한국어에서는 가장 자연스러운 성서 문체로 정리했습니다.
- source_word: טַפָּם
  english_pob_choice: their little ones
  chosen_korean: 그들의 어린아이들을
  alternatives_korean:
  - 그들의 어린 것들을
  - 그들의 자녀들을
  lexicon: HALOT
  rationale: טַף의 핵심 의미는 어린 자녀들/어린아이들이므로, ‘어린아이들’이 문맥을 가장 분명하게 드러냅니다.
- source_word: בְּהֶמְתָּם / מִקְנֵהֶם
  english_pob_choice: all their livestock, all their herds
  chosen_korean: 그들의 모든 가축과 모든 떼
  alternatives_korean:
  - 그들의 모든 짐승과 모든 가축 떼
  - 그들의 모든 가축과 모든 가축 떼
  lexicon: HALOT
  rationale: 두 히브리어 명사가 모두 가축을 가리키지만 뉘앙스가 달라, 앞은 일반적 ‘가축’, 뒤는 집단적·목축적 뉘앙스의 ‘떼’로 구분했습니다.
- source_word: חֵילָם
  english_pob_choice: their wealth
  chosen_korean: 모든 재물
  alternatives_korean:
  - 그들의 재산
  - 그들의 부
  lexicon: HALOT
  rationale: חֵיל은 전리품 문맥에서 물질적 부와 재산을 포괄하므로, ‘재물’이 가장 무리 없는 대응입니다.
theological_decisions:
- issue: 전리품 서술의 폭력성 표현
  chosen_reading: ‘사로잡았고’, ‘약탈했습니다’처럼 전쟁 포로와 전리품의 성격을 분명히 드러냈습니다.
  alternative_readings:
  - ‘데려갔고’, ‘가져갔습니다’처럼 완화하는 표현
  - ‘노획했습니다’처럼 더 기술적인 표현
  rationale: 본문은 전쟁 행위의 결과를 직접적으로 서술하므로, 의미를 약화시키지 않는 직역성 있는 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md § source-faithfulness and lexical transparency
