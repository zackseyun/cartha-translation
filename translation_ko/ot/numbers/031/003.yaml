  to: 모세가 백성에게 말했습니다. “너희 가운데서 군대를 위해 사람들을 무장시키십시오. 그들이 미디안에 맞서 야훼의 보복[a]을 미디안에 내리게 하십시오.”
  rationale: ‘원수’를 ‘보복’으로 바로잡아 נִקְמַת의 명사 의미와 לָתֵת … בְּ의 ‘보복을 미디안에 가하다’라는 표현을 보존했습니다. ‘미디안에 맞서’는 וְיִהְיוּ עַל מִדְיָן의 적대적 군사 행위를 과도하게 세부화하지 않고 옮깁니다. ‘군대를 위해 사람들을 무장시키십시오’는 군사 동원을 나타내며, 아나쉼의 남성 전투 인원이라는 문맥은 ‘사람들’과 군사 문맥의 결합으로 자연스럽게 드러납니다.
  reviewer_model: gpt-5.6-terra
