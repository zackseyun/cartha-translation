source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
  footnotes:
  - marker: a
    text: Or “vengeance for the LORD.” The Hebrew can denote vengeance belonging to the LORD or carried out on his behalf.
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 백성에게 말했습니다. “너희 가운데서 군대를 위해 사람들을 무장시키십시오. 그들이 미디안에 맞서 야훼의 보복[a]을 미디안에 내리게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼를 위한 보복.” 히브리어는 야훼께 속한 보복 또는 야훼를 위하여 수행되는 보복을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말하여 이르기를
  alternatives_korean:
  - 말했습니다
  - 이르기를
  lexicon: HALOT
  rationale: 서술 동사와 직접화를 여는 표현을 함께 살려, 모세의 발화 도입부를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הֵחָלְצוּ
  english_pob_choice: Arm
  chosen_korean: 준비시키고
  alternatives_korean:
  - 무장시키고
  - 동원하고
  - 전투 태세를 갖추고
  lexicon: HALOT
  rationale: 군사적 동원과 전투 준비의 뜻을 담되, 한국어에서 과도하게 특정 무기 장착으로 좁히지 않도록 했습니다.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  english_pob_choice: men from among you
  chosen_korean: 너희 가운데에서 군대에 나갈 사람들을
  alternatives_korean:
  - 너희 가운데에서 남자들을
  - 너희 중 전사들을
  - 너희 가운데에서 사람들을
  lexicon: HALOT
  rationale: 원문의 ‘너희 가운데에서’라는 선출 의미를 살리고, 군사 문맥의 ‘אֲנָשִׁים’를 한국어에서는 성별보다 전투 인원으로 이해되도록 풀어 옮겼습니다.
- source_word: לַצָּבָא
  english_pob_choice: for the army
  chosen_korean: 군대에 나갈
  alternatives_korean:
  - 군대로
  - 전쟁을 위해
  - 군사 복무를 위해
  lexicon: HALOT
  rationale: צָבָא의 군사 동원 의미를 반영하여, 단순한 소속이 아니라 ‘나갈’이라는 동적 표현으로 처리했습니다.
- source_word: וְיִהְיוּ עַל מִדְיָן
  english_pob_choice: let them go against Midian
  chosen_korean: 그들이 미디안에 맞서 나아가
  alternatives_korean:
  - 그들이 미디안에 대하여 있게 하십시오
  - 그들이 미디안을 향해 가게 하십시오
  lexicon: HALOT
  rationale: 영어 POB의 개정 이력상 추가된 ‘go’는 최종적으로 채택된 읽기와 부합하므로, 한국어도 ‘맞서 나아가’로 적대적 진군을 자연스럽게 반영했습니다.
- source_word: נִקְמַת יְהוָה
  english_pob_choice: Yahweh’s vengeance
  chosen_korean: 야훼의 원수
  alternatives_korean:
  - 야훼의 복수
  - 야훼의 보복
  - 야훼께 속한 원수
  lexicon: HALOT
  rationale: 출력되지 않은 문맥상 ‘원수 갚음’의 행위성과 소유격을 함께 살려, 전통적 완곡어보다 원문의 긴장감을 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 신적 징벌을 가리키는 נִקְמָה의 한국어 처리
  chosen_reading: ‘야훼의 원수’로 직역에 가깝게 두어, 행위의 성격과 소속을 함께 드러냈습니다.
  alternative_readings:
  - 야훼의 보복
  - 야훼의 복수
  - 야훼께서 갚으실 원수
  rationale: 이 구절은 성전(聖戰) 맥락의 거친 표현을 완화하지 말아야 하므로, 의미를 순화하기보다 원문의 충격과 소유관계를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
