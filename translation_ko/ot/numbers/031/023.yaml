    rationale: 히브리어 תַּעֲבִירוּ는 물건을 불/물 가운데로 지나가게 하는 사역 표현입니다. 한국어에서는 ‘불 속을 통과시키다’ 또는 ‘물 속을 통과시키다’가 그 관계를 명확히 합니다.
  - severity: low
    issue: 각주 표지가 ‘정결의 물’이 아니라 문장 끝에 놓여 있습니다.
    rationale: 어휘 대안을 설명하는 각주는 해당 표현 바로 뒤에 배치하는 편이 앵커 기능을 명확히 합니다.
