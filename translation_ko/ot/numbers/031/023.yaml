  revised_text: 불에 넣을 수 있는 모든 물건은 불 속을 통과시키십시오. 그러면 정결해질 것입니다. 다만 부정을 씻는 물로[a] 정결하게 하여야 합니다. 불에 넣을 수 없는 모든 것은 물 속을 통과시키십시오.
