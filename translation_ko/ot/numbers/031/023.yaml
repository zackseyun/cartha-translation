  source_fidelity: 원문의 반복된 사역 동사(‘통과시키다’)와 불로 처리할 수 있는 것/그렇지 않은 것의 대조는 유지되어야 합니다. 초안의 ‘불을 통과시켜야’와 ‘물로 통과시켜야’는 조사 선택 때문에 무엇을 통과시키는지 불명확합니다. 또한 בְּמֵי נִדָּה는 제의적 부정과 관련된 물을 뜻하므로, 본문과 각주에서 그 기능 및 어휘적 대안을 더 분명히 하는 것이 좋습니다.
  naturalness: ‘물로 통과시키다’는 현대 표준 한국어에서 부자연스럽고 의미가 불명확합니다. ‘불 속을/물 속을 통과시키십시오’로 하면 원문의 병행을 살리면서 자연스럽습니다. 법규적 지시는 현대 합쇼체 명령형으로 일관되게 옮겼습니다.
  terminology: 제의적 정결을 가리키는 문맥이므로 ‘정결해질 것입니다’와 ‘정결하게 하여야 합니다’를 사용했습니다. ‘부정을 씻는 물’은 본문에서 기능을 드러내며, 각주에서 직역 및 전통적 표현인 ‘분리의 물’을 제시하여 논쟁의 여지를 보존합니다.
