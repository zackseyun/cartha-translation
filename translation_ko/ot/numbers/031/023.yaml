source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
  footnotes:
  - marker: a
    text: Or, 'with the water of impurity'; traditionally, 'with the water of separation' (cf. Numbers 19).
    reason: lexical_alternative
translation:
  language: ko
  text: 불에 넣을 수 있는 모든 물건은 불 속을 통과시키십시오. 그러면 정결해질 것입니다. 다만 부정을 씻는 물로[a] 정결하게 하여야 합니다. 불에 넣을 수 없는 모든 것은 물 속을 통과시키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘부정의 물’입니다. 이는 민수기 19장의 정결 의식에 쓰이는 특별한 물을 가리킵니다. 전통적으로는 ‘분리의 물’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דָּבָר
  english_pob_choice: Everything
  chosen_korean: 모두
  alternatives_korean:
  - 모든 것
  - 전부
  - 각각의 물건
  lexicon: HALOT
  rationale: 여기서는 전리품으로 취급되는 각 물건을 포괄하는 분배적 의미이므로, 한국어에서는 자연스럽고 포괄적인 ‘모두’로 처리했습니다.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  english_pob_choice: that can go through the fire
  chosen_korean: 불에 들어갈 수 있는
  alternatives_korean:
  - 불을 견딜 수 있는
  - 불을 통과하는
  - 불에 들어가는
  lexicon: HALOT
  rationale: 의미는 실제로 불 속을 지나가는 능력 여부가 아니라, 불로 정결 처리할 수 있는 물건인지의 구분이므로 ‘들어갈 수 있는’이 문맥을 가장 잘 드러냅니다.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  english_pob_choice: you shall pass through the fire
  chosen_korean: 불을 통과시켜야 하며
  alternatives_korean:
  - 불을 지나가게 해야 하며
  - 불에 통과시켜야 하며
  - 불로 지나가게 해야 하며
  lexicon: HALOT
  rationale: 히필형 עבר의 사역적 의미를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘통과시켜야 하며’로 옮겼습니다.
- source_word: בְּמֵי נִדָּה
  english_pob_choice: with the water for impurity
  chosen_korean: 정결의 물로
  alternatives_korean:
  - 부정의 물로
  - 정결을 위한 물로
  - 부정 제거의 물로
  lexicon: HALOT
  rationale: 원어는 민수기 19장의 정결 의식에 쓰이는 특별한 물을 가리키므로, 본문에서는 기능을 드러내는 표현으로 두되 전통적 고정어구를 그대로 옮기지는 않았습니다.
- source_word: יִתְחַטָּא
  english_pob_choice: it must be purified
  chosen_korean: 정결하게 해야 합니다
  alternatives_korean:
  - 깨끗하게 해야 합니다
  - 정결하여야 합니다
  - 정결 의식을 거쳐야 합니다
  lexicon: HALOT
  rationale: 이 동사는 도덕적 씻음이 아니라 제의적 정결을 뜻하므로, ‘정결하게 하다’로 옮겨 의례적 의미를 유지했습니다.
theological_decisions:
- issue: 정결/부정 언어의 범위
  chosen_reading: 도덕적 죄책이 아니라 제의적 정결 상태를 말하는 본문으로 읽었습니다.
  alternative_readings:
  - 일반적인 ‘깨끗함’으로만 번역하기
  - 죄 사함의 의미를 암시하는 표현 쓰기
  rationale: 민수기 31장과 연결된 민수기 19장의 규례는 물건의 의례적 정결 처리에 관한 것이므로, 본문이 말하지 않는 도덕적 의미를 덧입히지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하지 않는 교리적 의미를 덧씌우지 말고, 제의적 문맥을 보존합니다.'
