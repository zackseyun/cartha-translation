  source_fidelity: 히브리어의 명령형 ‘나누십시오’, 전쟁에서 취한 것인 ‘전리품’, 두 분배 대상인 전쟁에 참여하여 출정한 사람들과 온 회중의 구분을 충실히 반영합니다. ‘곧’은 두 분사구가 동일 집단을 수식한다는 관계를 한국어로 자연스럽게 드러냅니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘전쟁에 참여한 사람들, 곧 전장에 나간 사람들’은 다소 설명적이지만 원문의 중첩된 군사 관련 수식을 보존하며 이해하기 쉽습니다.
  terminology: ‘전리품’은 מַלְקוֹחַ의 문맥상 포괄적 의미에 적절하고, ‘온 회중’은 כָּל־הָעֵדָה의 공동체적 의미를 잘 보존합니다. 각주도 해당 표지에 적절히 연결되어 있습니다.
