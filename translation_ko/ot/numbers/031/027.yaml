  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
  footnotes:
  - marker: a
    text: Or 'the booty' or 'the spoil.' The Hebrew term refers to what was taken in war.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''all the congregation''; also possible: ''all the community'' or ''all the assembly.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 전리품을 전쟁에 참여한 사람들[a], 곧 전장에 나간 사람들과 온 회중[b] 사이에 나누십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 전쟁에서 취한 것을 가리키며, ‘전리품’ 외에 ‘노획물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘온 회중’이며, ‘온 공동체’ 또는 ‘온 집회’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  english_pob_choice: And divide
  chosen_korean: 나누십시오
  alternatives_korean:
  - 나눠 주십시오
  - 분배하십시오
  lexicon: HALOT
  rationale: חצה는 ‘나누다, 분할하다’의 뜻이므로, 명령형 맥락을 살려 현대 한국어에서 가장 자연스럽고 직접적인 ‘나누십시오’를 택했습니다.
- source_word: הַמַּלְקוֹחַ
  english_pob_choice: the plunder
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 노획한 것
  - 전쟁에서 취한 것
  lexicon: HALOT
  rationale: 이 단어는 전쟁에서 취한 것을 가리키므로, 포괄적이면서도 문맥에 맞는 ‘전리품’이 가장 적절합니다.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה / הַיֹּצְאִים לַצָּבָא
  english_pob_choice: those who took part in the war / who went out to battle
  chosen_korean: 전쟁에 참여한 사람들, 곧 전장에 나간 사람들
  alternatives_korean:
  - 전쟁을 담당한 사람들
  - 전투에 나간 사람들
  - 군대에 나간 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁을 붙잡은/다룬 자들’과 ‘군대로 나간 자들’인데, 한국어에서는 실제 의미를 드러내는 ‘전쟁에 참여한 사람들, 곧 전장에 나간 사람들’이 가장 근접합니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 온 회합
  - 온 모임
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 모인 공동체를 가리키므로, 문맥상 ‘회중’이 가장 적절하며 공적·언약적 뉘앙스를 살립니다.
theological_decisions:
- issue: 전리품 분배의 대상 구분
  chosen_reading: 전쟁에 참여한 사람들과 온 회중 사이에 전리품을 나누는 것으로 옮겼습니다.
  alternative_readings:
  - 전장에 나간 군사들과 온 공동체 사이에 나누는 것으로 옮길 수 있습니다.
  - 전리품을 모든 사람에게 균등 분배하는 뜻으로도 읽을 수 있습니다.
  rationale: 히브리어는 두 집단 사이의 분배를 분명히 말하며, 본문은 전리품의 공정한 배분 원리를 보여 줍니다.
  doctrine_reference: 민수기 31장 문맥의 전리품 분배 규정
