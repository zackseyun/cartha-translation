    text: 히브리어 관용구는 문자적으로 ‘당신의 백성에게로 거두어지다’입니다. 더 해석적으로는 ‘죽다’ 또는 ‘조상들에게로 모이다’로 옮길 수도 있습니다.
    reason: lexical_alternative
