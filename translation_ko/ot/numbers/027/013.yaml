  text: 그리고 당신이 그것을 본 뒤에, 당신도 당신의 백성에게로 거두어질 것입니다[a]. 당신의 형 아론이 거두어졌던 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
