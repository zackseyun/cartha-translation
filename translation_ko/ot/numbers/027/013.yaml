source:
  edition: WLC
  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'you will die' or 'you will be gathered to your ancestors.' The Hebrew idiom is literally 'be gathered to your people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신이 그것을 보게 되면, 당신도 또한 당신의 백성에게로 모여들게 될 것입니다. 아론 당신의 형이 모여들었던 것처럼 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘당신의 백성에게로 모여들다’입니다. 더 해석적으로는 ‘죽다’ 또는 ‘조상들에게로 모여들다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  english_pob_choice: And when you have seen it
  chosen_korean: 그리고 당신이 그것을 보게 되면
  alternatives_korean:
  - 그리고 당신이 그것을 보면
  - 그리고 당신이 그것을 보게 되고
  lexicon: HALOT
  rationale: ראה의 완료형/연속 문맥을 한국어에서는 결과 선행을 드러내는 조건·시간 표현으로 옮기는 편이 다음 절의 죽음 예고와 자연스럽게 연결됩니다.
- source_word: וְנֶאֱסַפְתָּ אֶל עַמֶּיךָ
  english_pob_choice: you ... will be gathered to your people
  chosen_korean: 당신도 또한 당신의 백성에게로 모여들게 될 것입니다
  alternatives_korean:
  - 당신도 또한 당신의 백성에게로 모이게 될 것입니다
  - 당신도 또한 당신의 백성에게로 거두어질 것입니다
  - 당신도 또한 당신의 백성에게로 모여들 것입니다
  lexicon: HALOT
  rationale: אסף의 관용적 죽음 표현을 ‘모여들다’로 살려 ‘죽다’로 평면화하지 않으면서, 사람에게 일어나는 수동적 귀속의 이미지를 한국어로 전달합니다.
- source_word: אַהֲרֹן אָחִיךָ
  english_pob_choice: Aaron your brother
  chosen_korean: 아론 당신의 형
  alternatives_korean:
  - 아론 당신의 형제
  - 아론, 당신의 형
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘아론’을 따르고, אָחִיךָ는 친족 관계를 직역해 원문의 병치 구조를 유지했습니다.
theological_decisions:
- issue: אסף אל־עמיו의 죽음 완곡어법
  chosen_reading: ‘모여들게 될 것입니다’로 유지해 단순한 ‘죽을 것입니다’로 풀지 않았습니다.
  alternative_readings:
  - 죽게 될 것입니다
  - 조상들에게로 모여들게 될 것입니다
  - 당신의 조상들에게로 거두어질 것입니다
  rationale: 본문은 죽음을 말하면서도 ‘백성에게로 모여듦’이라는 전통적 히브리어 관용구를 사용하므로, 그 상징적·가족적 울림을 보존하는 것이 source-direct합니다.
  doctrine_reference: 원문 관용구 보존; 사후 상태를 과도하게 해석하지 않음
