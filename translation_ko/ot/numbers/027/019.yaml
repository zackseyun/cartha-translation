source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֣ אֹת֗/וֹ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָ֑ה וְ/צִוִּיתָ֥ה אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
  footnotes:
  - marker: a
    text: Or 'charge him' or 'command him.' The Hebrew verb can mean to command; here it likely refers to publicly entrusting Joshua with his charge.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그를 제사장 엘르아살과 온 회중 앞에 세우고, 그들의 눈앞에서 그에게 임무를 맡겨야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘임무를 맡겨야 합니다’는 כאן의 צוה가 이 문맥에서 단순 명령을 넘어 공개적 위임을 뜻할 수 있다는 점을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  english_pob_choice: you shall set
  chosen_korean: 세우고
  alternatives_korean:
  - 세워 두고
  - 내세우고
  - 앞에 두고
  lexicon: HALOT
  rationale: 히필형 עמד의 사역적 의미를 살려, 사람을 공식 자리 앞에 ‘세우다’로 옮기면 의례적 배치와 공개적 설치를 자연스럽게 드러냅니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 앞에서
  - 면전에서
  - 임재 앞에
  lexicon: HALOT
  rationale: 사람이나 공동체의 공식적 면전이라는 뜻을 살리되, 현대 한국어에서는 간결한 ‘앞에’가 가장 직접적입니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 회중 전체
  - 온 공동체
  - 온 모임
  lexicon: HALOT
  rationale: עֵדָה는 단순한 군중이 아니라 언약 백성의 모인 공동체이므로, POB 기본 용례에 맞춰 ‘회중’으로 옮겼습니다.
- source_word: וְצִוִּיתָה
  english_pob_choice: you shall commission
  chosen_korean: 임무를 맡겨야 합니다
  alternatives_korean:
  - 위임해야 합니다
  - 명령해야 합니다
  - 맡겨야 합니다
  lexicon: HALOT
  rationale: 이 문맥은 단순 명령보다 여호수아를 공개적으로 직분에 세우는 장면이므로, ‘위임/임무를 맡기다’의 공적 설치 뉘앙스를 살렸습니다.
theological_decisions:
- issue: צוה의 공적 설치 의미
  chosen_reading: ‘명령하다’보다 ‘임무를 맡기다’로 옮겨, 여호수아의 공개적 위임과 책무 부여를 드러냈습니다.
  alternative_readings:
  - 명령하다
  - 맡기다
  - 위임하다
  rationale: 본문은 엘르아살과 온 회중 앞에서 이루어지는 공식 절차를 묘사하므로, 권위 있는 지시와 함께 직무 수여의 성격을 동시에 반영하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
