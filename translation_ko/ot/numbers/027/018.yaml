  terminology: ‘야훼’, ‘모세’, ‘여호수아’, ‘눈’, ‘영’, ‘손을 얹다’는 일관되고 적절합니다. ‘성령’ 또는 ‘그 영’으로 한정하지 않은 것은 원문의 비한정성을 보존합니다.
