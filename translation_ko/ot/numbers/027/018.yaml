id: NUM.27.18
reference: Numbers 27:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
  footnotes:
  - marker: a
    text: Or “a man in whom is spirit” or “a man who has spirit.” The Hebrew does not include the article.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “눈의 아들 여호수아를, 영이 있는 한 사람을 데려다가 네 손을 그에게 얹으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영이 있는 사람” 혹은 “영을 가진 사람”. 히브리어에는 정관사가 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본값에 따라 언약적 신명은 학술적 음역인 ‘야훼’로 옮겨, 영어 POB의 Yahweh 선택과 대응시켰습니다.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: Joshua son of Nun
  chosen_korean: 눈의 아들 여호수아
  alternatives_korean:
  - 여호수아, 눈의 아들
  - 눈의 아들인 여호수아
  lexicon: WLC
  rationale: 고유명사는 통용형 ‘여호수아’를 쓰고, את בן־구성은 한국어에서 자연스러운 친족 표지인 ‘눈의 아들’로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 사람
  lexicon: WLC
  rationale: 히브리어는 문법상 남성 단수이지만, 한국어에서는 선발·자격을 묘사하는 문맥상 ‘한 사람’이 자연스럽고 성별 정보는 ‘여호수아’ 고유명사가 이미 보완합니다.
- source_word: רוּחַ בּוֹ
  english_pob_choice: in whom is spirit
  chosen_korean: 영이 있는
  alternatives_korean:
  - 그의 안에 영이 있는
  - 영을 가진
  lexicon: WLC
  rationale: 히브리어의 간결한 ‘영이 그 안에 있다’는 구조를 살리되, 한국어로는 수식어처럼 자연스럽게 풀어 ‘영이 있는’으로 옮겼습니다.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  english_pob_choice: and lay your hand on him
  chosen_korean: 네 손을 그에게 얹으십시오
  alternatives_korean:
  - 네 손을 그 위에 얹으십시오
  - 네 손을 그에게 안수하십시오
  lexicon: WLC
  rationale: סמך + 손은 단순한 신체 접촉이 아니라 임직·위임의 상징 행위이므로, 전통 교회어 ‘안수’보다 원문 이미지를 직접 드러내는 ‘손을 얹다’를 택했습니다.
theological_decisions:
- issue: רוּחַ의 의미를 ‘성령’으로 명시할지, 원문의 비한정성을 살릴지
  chosen_reading: ‘영’으로 두어, 하나님의 영인지 사람의 내적 영성인지의 직접 표지를 열어 둡니다.
  alternative_readings:
  - 성령
  - 그 영
  rationale: 히브리어는 관사가 없고 문맥상 하나님의 영을 가리킬 가능성이 크지만, 본문 자체의 압축성과 해석 여지를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 해석의 긴장을 보존하고, 본문이 말하는 범위를 넘어 단정하지 않습니다.
