  text: וַ/יִּסְמֹ֧ךְ אֶת יָדָ֛י/ו עָלָ֖י/ו וַ/יְצַוֵּ֑/הוּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
  footnotes:
  - marker: a
    text: Or 'charged him' or 'commanded him.' The Hebrew verb can denote giving a command, but here it refers to Moses' formal appointment of Joshua.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning through Moses as the LORD''s agent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 손들을 그 위에 얹고, 야훼께서 모세의 손을 통해 말씀하신 대로 그를 임명했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 명령했다’ / ‘그를 위임했다’. 히브리어 동사는 일반적으로 ‘명령하다’를 뜻하지만, 여기서는 여호수아를 공적으로 세우는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘모세의 손을 통해’. 야훼의 대리자로서 모세를 통한 매개 행위를 뜻하는 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת יָדָיו עָלָיו
  english_pob_choice: laid his hands on him
  chosen_korean: 그의 손들을 그 위에 얹고
  alternatives_korean:
  - 그에게 손을 얹고
  - 그의 손을 그에게 대고
  lexicon: HALOT
  rationale: 손을 사람 위에 얹는 안수 동작을 자연스러운 한국어로 옮기되, 복수형 ‘손들’은 히브리어 복수형을 반영합니다.
- source_word: וַיְצַוֵּהוּ
  english_pob_choice: commanded him
  chosen_korean: 그를 임명했습니다
  alternatives_korean:
  - 그에게 명령했습니다
  - 그를 위임했습니다
  lexicon: HALOT
  rationale: 문맥이 단순한 명령이 아니라 여호수아를 지도자로 세우는 공식적 위임이므로, 한국어에서는 ‘임명했습니다’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신적 고유명사는 ‘야훼’로 옮겨, 칭호가 아니라 이름이라는 점을 드러냅니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세의 손으로
  - 모세를 통해
  lexicon: HALOT
  rationale: 히브리어 관용구의 중개적 행위를 살리면서도 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘commanded him’의 번역 범위
  chosen_reading: ‘임명했습니다’로 옮겨 모세의 공적 설치 행위를 드러냅니다.
  alternative_readings:
  - ‘명령했습니다’
  - ‘위임했습니다’
  rationale: 이 절은 야훼의 말씀에 따른 여호수아의 공식적 직무 부여를 묘사하므로, 단순 명령보다 공적 임명의 뉘앙스를 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 문맥상 지도자 세움의 서술을 우선하여, 교회 직분 용어를 기계적으로 이식하지 않습니다.
