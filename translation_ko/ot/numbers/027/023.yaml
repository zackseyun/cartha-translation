base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
  footnotes:
  - marker: a
    text: Or 'charged him' or 'commanded him.' The Hebrew verb can denote giving a command, but here it refers to Moses' formal appointment of Joshua.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning through Moses as the LORD''s agent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 손을 얹고 그에게 명령했습니다.[a] 이는 야훼께서 모세를 통하여 말씀하신 대로였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 책무를 맡겼다’ 또는 ‘그에게 엄히 지시했다’. 히브리어 동사는 기본적으로 ‘명령하다’를 뜻하며, 여기서는 여호수아에게 공적으로 책임을 부과하는 맥락에서 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모세의 손으로’. 히브리어 관용구로서 야훼께서 모세를 매개로 말씀하셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת יָדָיו עָלָיו
  english_pob_choice: laid his hands on him
  chosen_korean: 그의 손들을 그 위에 얹고
  alternatives_korean:
