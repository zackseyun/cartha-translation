  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
  footnotes:
  - marker: a
    text: Or 'be diminished' or 'be removed.' The Hebrew asks why their father's 'name' should be lost from his clan because he had no son.
    reason: lexical_alternative
  - marker: b
    text: '''Possession'' refers to a landed holding or inheritance allotment within the clan.'
    reason: cultural_note
translation:
  language: ko
  text: 왜 아버지의 이름이 그의 씨족 가운데서 없어져야 합니까? 그에게 아들이 없으니 우리에게 아버지의 형제들 가운데서 소유를 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘없어져야’는 히브리어 동사 גרע의 실질적 상실 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘씨족’은 이 문맥의 מִשְׁפָּחָה를 가리키는 말로, 상속 단위를 드러내기 위한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why should
  chosen_korean: 왜 ... 합니까?
  alternatives_korean:
  - 왜 ... 합니까?
  - 무슨 이유로 ... 합니까?
  lexicon: HALOT
  rationale: 수사적 항의가 섞인 질문이므로 단순한 ‘왜’보다 ‘왜 ... 합니까?’가 자연스럽고 원문의 문제 제기 뉘앙스를 살립니다.
- source_word: יִגָּרַע
  english_pob_choice: be taken away
  chosen_korean: 없어져야 합니까
  alternatives_korean:
  - 줄어들어야 합니까
  - 사라져야 합니까
  - 감소해야 합니까
  lexicon: HALOT
  rationale: 이 동사는 이름이 공동체 안에서 상실되는 결과를 가리키므로, 한국어에서는 추상적인 ‘감소’보다 실제적 상실을 드러내는 표현이 적절합니다.
- source_word: מִשְׁפַּחְתּוֹ
  english_pob_choice: clan
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족
  - 친족 집단
  lexicon: HALOT
  rationale: 족장제와 토지 분배 문맥에서 מִשְׁפָּחָה는 현대 핵가족보다 넓은 혈연 단위를 가리키므로 ‘씨족’이 가장 직접적입니다.
- source_word: אֲחֻזָּה
  english_pob_choice: a possession
  chosen_korean: 소유
  alternatives_korean:
  - 소유지
  - 기업
  - 유산
  lexicon: HALOT
  rationale: 토지 상속 맥락의 할당된 몫을 가리키므로, 지나치게 좁히지 않으면서도 소유권을 담는 ‘소유’로 옮겼습니다.
- source_word: אֲחֵי אָבִינוּ
  english_pob_choice: our father's brothers
  chosen_korean: 아버지의 형제들 가운데서
  alternatives_korean:
  - 아버지의 형제들 중에서
  - 아버지의 친족들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 남성 친족 용례를 보존해, 상속 문제의 법적·가계적 대상을 흐리지 않기 위해 그대로 옮겼습니다.
theological_decisions:
- issue: 성별이 표시된 상속 언어의 유지
  chosen_reading: ‘아들이 없으니’와 ‘아버지의 형제들’처럼 남성 친족 용어를 그대로 유지했습니다.
  alternative_readings:
  - ‘자녀가 없으니’
  - ‘친족들 가운데서’
  rationale: 본문은 실제로 아들 부재와 부계 상속의 문제를 다루므로, 성별을 중화하면 법적 쟁점이 약화됩니다.
  doctrine_reference: 'Translation philosophy: source-directed lexical transparency'
