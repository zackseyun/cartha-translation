revisions:
- from: 왜 아버지의 이름이 그의 씨족 가운데서 없어져야 합니까? 그에게 아들이 없으니 우리에게 아버지의 형제들 가운데서 소유를 주십시오.[a][b]
  to: 왜 아버지에게 아들이 없었다는 이유로 아버지의 이름이 그의 씨족 가운데서 없어져야 합니까?[a] 아버지의 형제들 가운데서 우리에게 소유지를 주십시오.[b]
  rationale: 토지 상속 문맥의 핵심 법률 용어 אֲחֻזָּה를 ‘소유지’로 명료화하고, 아들 부재의 인과 관계를 자연스러운 한국어 수사 의문문으로 다듬었습니다. 또한 각주 b를 실제 표지 대상인 ‘소유지’의 문화적 의미에 맞게 바로잡았습니다. ‘씨족’과 ‘아버지의 형제들’은 원문의 친족·상속 용어를 그대로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:26Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 수사 의문, 아들 부재를 이유로 한 아버지의 ‘이름’ 상실, 씨족 안에서의 지위, 그리고 아버지의 형제들 가운데서 받을 토지 보유지의 요청을 대체로 충실히 반영했습니다. 다만 אֲחֻזָּה는 이 문맥에서 일반적 ‘소유’보다 토지로 된 보유지/상속 몫을 가리키므로 ‘소유지’가 더 정확합니다. 서사 상황과 영어 감사 기록에 맞추어 아들 부재는 과거형으로 다듬었습니다.
  naturalness: 원문의 인과 관계를 ‘아버지에게 아들이 없었다는 이유로’로 앞세우면 한국어 수사 의문문으로 자연스럽고 명료합니다. ‘우리에게 … 주십시오’는 합쇼체 청원 표현으로 적절합니다.
  terminology: ‘씨족’은 מִשְׁפָּחָה의 혈연·상속 단위를 잘 나타내며, ‘아버지의 형제들’도 אֲחֵי אָבִינוּ의 남성 친족 표현을 보존합니다. ‘소유’는 추상 명사여서 토지 할당이라는 אֲחֻזָּה의 의미를 충분히 드러내지 못하므로 ‘소유지’로 고칩니다. 각주 b도 현재의 씨족 설명이 아니라 해당 표지의 토지 보유지 설명이 되어야 합니다.
  issues:
  - severity: medium
    issue: ‘소유’는 אֲחֻזָּה의 토지 보유지 의미를 충분히 명시하지 못합니다.
    rationale: 이 절의 상속·토지 분배 문맥에서 אֲחֻזָּה는 일반적인 소유 개념이 아니라 씨족 안에서 배정되는 토지 보유지입니다.
  - severity: medium
    issue: 각주 b의 내용이 표지 위치와 영어 POB 감사 기록의 문화적 주석 대상에 맞지 않습니다.
    rationale: b는 ‘소유/소유지’에 붙어 있으나 현 주석은 ‘씨족’을 설명합니다. b는 אֲחֻזָּה의 토지·상속 할당 의미를 설명해야 합니다.
  - severity: low
    issue: ‘그에게 아들이 없으니’는 문법적으로 가능하지만 서사 속 고인의 상황을 ‘없었다는 이유로’로 표현하는 편이 더 자연스럽습니다.
    rationale: 히브리어의 무동사절은 문맥상 아버지의 아들 부재라는 이미 성립한 법적 상황을 가리키며, 영어 POB도 과거형으로 옮깁니다.
