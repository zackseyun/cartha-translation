base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''The daughters of Zelophehad are speaking rightly.'' The translation ''are right'' renders the idiom in natural English.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text has a masculine plural suffix in 'to them' at one point, but the referent in context is Zelophehad's daughters; the sense is therefore rendered with feminine referent in English.
    reason: textual_variant
translation:
  language: ko
  text: 「슬로브핫의 딸들이 말한 것은 옳습니다.[a] 너는 반드시 그들에게[b] 그들의 아버지의 형제들 가운데서 상속받을 토지를 주고, 그들의 아버지의 상속분을 그들에게 넘겨주어야 합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘슬로브핫의 딸들이 옳게 말하고 있다’입니다. 이는 그들의 주장이 옳다는 법적 승인을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문의 이 ‘그들에게’에는 남성 복수 접미사가 쓰였지만, 문맥상 가리키는 대상은 슬로브핫의 딸들입니다.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן בְּנוֹת צְלָפְחָד דֹּבְרֹת
  english_pob_choice: are right
  chosen_korean: 옳게 말하고 있습니다
  alternatives_korean:
  - 옳습니다
  - 말이 옳습니다
  lexicon: HALOT
  rationale: כֵּן + דֹּבְרֹת는 법정적 판단으로서 ‘그 말이 옳다’는 승인입니다. 한국어에서는 ‘옳게 말하고 있습니다’가 판결의 의미와 발화 행위를 함께 살립니다.
- source_word: נָתֹן תִּתֵּן
  english_pob_choice: must surely give
  chosen_korean: 반드시 … 주어야 합니다
  alternatives_korean:
  - 반드시 … 주십시오
  - 꼭 … 주어야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사의 결합이 강한 의무를 나타내므로, 현대 한국어에서 자연스러운 강한 당위 표현으로 옮겼습니다.
- source_word: אֲחֻזַּת נַחֲלָה
  english_pob_choice: a hereditary possession
  chosen_korean: 유산으로 받을 소유
  alternatives_korean:
  - 상속 소유
  - 대대로 이어질 소유
  lexicon: HALOT
  rationale: 땅 분배 맥락에서 ‘상속’과 ‘소유/소유지’의 의미가 함께 있으므로, 두 요소를 모두 드러내는 표현을 택했습니다.
- source_word: וְהַעֲבַרְתָּ אֶת נַחֲלַת אֲבִיהֶן לָהֶן
  english_pob_choice: you shall transfer their father's inheritance to them
  chosen_korean: 그들의 아버지의 상속분을 그들에게 넘겨주어야 합니다
  alternatives_korean:
  - 그들의 아버지의 유산을 그들에게 옮겨주어야 합니다
  - 그들의 아버지의 몫을 그들에게 넘겨주어야 합니다
  lexicon: HALOT
  rationale: העביר는 여기서 물건 이동이 아니라 법적 이전을 뜻하므로 ‘넘겨주다’로 옮겼습니다. 끝의 대상 대명사는 문맥상 딸들을 가리키므로 한국어에서도 그들에게로 처리했습니다.
theological_decisions:
- issue: 여성 상속권의 법적 승인
  chosen_reading: 본문은 슬로브핫의 딸들의 청원을 하나님이 승인하고, 그들에게 아버지의 몫을 법적으로 이전하라고 명령하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 가족 내 배려로 약화하는 읽기
  - 특수한 예외 규정으로만 보는 읽기
  rationale: 문맥상 이는 감정적 호의가 아니라 상속 질서를 조정하는 공적 판결입니다. 따라서 명령형의 법적 강도를 살렸습니다.
  doctrine_reference: 민수기 27장의 상속 규정과 공의/언약 질서
