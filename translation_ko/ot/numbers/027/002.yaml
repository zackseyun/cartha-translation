  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
  footnotes:
  - marker: a
    text: Or 'all the assembly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the chiefs' or 'the princes' for 'the leaders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 회막 어귀에서 모세와 제사장 엘르아살과 지도자들[b]과 온 회중[a] 앞에 서서 이렇게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 회집’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우두머리들’ 혹은 ‘수령들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  english_pob_choice: and they stood
  chosen_korean: 서서
  alternatives_korean:
  - 서 있었습니다
  - 나아가 서 있었습니다
  lexicon: HALOT
  rationale: 여성 복수 완료형의 서 있는 동작을 자연스러운 서술로 옮기되, 공적 자리에서 ‘자세를 갖추고 섰다’는 의미를 살리기 위해 동사구 ‘서서’를 사용했습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 면전에
  - 앞에서
  lexicon: HALOT
  rationale: 여러 권위자들 앞에 선 공적·법정적 맥락을 한국어의 ‘앞에’로 직역성 있게 유지했습니다.
- source_word: הַנְּשִׂיאִם
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 우두머리들
  - 수령들
  lexicon: HALOT
  rationale: נְשִׂיאִים은 지파/공동체의 공식 대표들을 가리키므로, 현대 한국어에서 가장 분명한 ‘지도자들’로 옮겼습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 회집
  - 모든 회중
  lexicon: HALOT
  rationale: עֵדָה는 단순한 군중보다 언약 공동체의 집합을 뜻하므로, POB의 ‘congregation’을 반영해 ‘회중’으로 번역했습니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 문 앞에
  alternatives_korean:
  - 회막 입구에
  - 만남의 장막 문 앞에
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 오경의 정형적 표현이므로 관용적으로 알려진 ‘회막’을 사용했고, פֶּתַח는 장소 표지로 ‘문 앞에’로 옮겼습니다.
theological_decisions:
- issue: 공적 진술의 장을 어떻게 드러낼 것인가
  chosen_reading: 모세, 제사장 엘르아살, 지도자들, 온 회중 앞에 서서 말했습니다로, 반복되는 ‘앞에’ 구조를 유지했습니다.
  alternative_readings:
  - 문장 전체를 ‘공개적으로 진술했습니다’로 압축하기
  rationale: 이 절은 단순 이동이 아니라 공개적·공동체적 제소 장면을 강조하므로, 권위자와 회중 앞이라는 구조를 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 드러내는 의미와 장면의 무게를 보존하고 과도한 의역을 피함'
