  source_fidelity: 히브리어의 여성 복수 주어, 공개적으로 권위자들과 온 공동체 앞에 선 장면, 회막 입구라는 장소, 다음 절의 직접 발화를 도입하는 לֵאמֹר를 모두 보존합니다. 다만 현 초안의 각주 표지는 해당 어휘에 붙어 있지 않아 수정이 필요합니다.
  naturalness: ‘회막 어귀에서 … 앞에 서서 이렇게 말했습니다’는 장소와 대면의 대상을 자연스럽게 구별하면서도 현대 표준 한국어의 격식 있는 서술체를 유지합니다.
