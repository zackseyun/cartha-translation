id: NUM.27.20
reference: Numbers 27:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
  footnotes:
  - marker: a
    text: Or 'some of your majesty' or 'some of your honor.' The Hebrew word can denote splendor or dignity as well as the authority attached to office.
    reason: lexical_alternative
  - marker: b
    text: Or 'may listen' or 'may hear.' The Hebrew verb often carries the sense of hearing with obedience.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 당신의 위엄 중 일부를 그 위에 두십시오. 그러면 이스라엘 자손의 온 회중이 그에게 순종할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위엄’, ‘존귀’. 이 히브리어는 광채뿐 아니라 직분에 붙는 권위와 품위도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘순종할’, ‘들을’. 이 히브리어 동사는 종종 듣는 것과 순종하는 것을 함께 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘이스라엘의 아들들’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהוֹדְךָ
  english_pob_choice: some of your splendor / some of your majesty / some of your honor
  chosen_korean: 당신의 위엄 중 일부
  alternatives_korean:
  - 당신의 영화 중 일부
  - 당신의 존귀 중 일부
  - 당신의 splendor(음역) 중 일부
  lexicon: HALOT
  rationale: הוֹד는 문맥상 모세에게 속한 권위 있는 위엄·존귀를 가리키며, POB의 audit trail도 splendor/majesty/honor와 더불어 기능적 의미를 허용합니다. 한국어에서는 ‘위엄’이 그 의미를 가장 자연스럽게 살립니다.
- source_word: יִשְׁמְעוּ
  english_pob_choice: may obey
  chosen_korean: 순종할 것입니다
  alternatives_korean:
  - 들을 것입니다
  - 경청할 것입니다
  - 복종할 것입니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 권위에 대한 응답을 뜻할 수 있으며, 이 구절은 여호수아의 공적 권한 부여와 연결되므로 ‘순종하다’가 문맥상 가장 정확합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 그대로 드러내면서도 한국어에서 매우 익숙한 성경적 표현을 유지하기 위해 ‘이스라엘 자손’을 택했습니다.
- source_word: וְנָתַתָּה ... עָלָיו
  english_pob_choice: And you shall put ... on him
  chosen_korean: …그 위에 두십시오
  alternatives_korean:
  - …그에게 얹으십시오
  - …그 위에 놓으십시오
  - …그에게 주십시오
  lexicon: HALOT
  rationale: נתן + עַל은 단순 ‘주다’보다 어떤 것을 ‘위에 두다/얹다’는 전달 이미지를 살리는 것이 자연스럽습니다. 공적 위임의 상징성을 유지하기 위해 ‘두다’를 선택했습니다.
theological_decisions:
- issue: 모세의 ‘위엄’이 무엇을 가리키는가
  chosen_reading: 이 문장은 모세의 직분에 속한 공적 위엄과 권위가 여호수아에게 일부 이전되는 장면으로 읽는 것이 가장 적절합니다.
  alternative_readings:
  - 단지 개인적 명예나 영광을 나누는 것으로 읽을 수 있습니다.
  - 초자연적 광채의 공유로 읽을 수도 있습니다.
  rationale: 문맥은 여호수아의 공적 계승과 회중의 순종을 목표로 하므로, 단순한 미적 광채보다 직분적 권위의 이전을 전면에 두어야 합니다.
  doctrine_reference: 민수기 27:18–23의 지도자 위임 문맥
- issue: ‘순종하다’의 강도
  chosen_reading: 회중은 여호수아의 말을 단순히 듣는 것이 아니라 그 권위에 응답하여 순종해야 합니다.
  alternative_readings:
  - 회중이 그를 잘 들을 것이다
  - 회중이 그의 말을 경청할 것이다
  rationale: 히브리어 שׁמע는 맥락에 따라 ‘듣다’보다 ‘순종하다’의 뜻을 강하게 띠며, 본문 자체가 권한 부여의 목적을 밝히므로 그 의미를 드러내는 것이 필요합니다.
  doctrine_reference: 히브리어 שׁמע의 관용적 용법
