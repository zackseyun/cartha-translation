  source_fidelity: 히브리어 מֵהוֹדְךָ의 부분성은 ‘당신의 위엄 일부’로 잘 반영되며, יִשְׁמְעוּ를 문맥상 ‘순종하다’로 옮긴 것도 가능합니다. 그러나 עָלָיו(‘그 위에/그에게’)를 현재 한국어 문장의 ‘그 위에’로 옮기면 사람을 가리키는 대명사와 결합하여 물리적으로 ‘그의 위쪽에’ 놓는다는 뜻으로 읽히므로, 위임의 뜻이 자연스럽게 드러나도록 고쳐야 합니다.
  naturalness: ‘그 위에 두십시오’는 현대 한국어에서 여호수아에게 권위·위엄을 부여한다는 뜻으로 자연스럽지 않습니다. ‘그에게 부여하십시오’가 공적 위임 문맥에 맞고 현대 합쇼체 문장으로도 자연스럽습니다. 목적절도 ‘순종하도록 하십시오’로 옮기면 לְמַעַן의 목적 관계가 분명해집니다.
  terminology: ‘위엄’은 הוֹד의 유효한 번역이며, 각주에서 ‘존귀’와 직분에 수반되는 권위·품위의 의미를 보완하는 방식이 적절합니다. ‘이스라엘 자손’은 원문의 בְּנֵי יִשְׂרָאֵל을 보존합니다. 각주 b는 본문 선택어인 ‘순종할’을 대안으로 제시하고 있어 이를 ‘들을’, ‘경청할’로 바로잡아야 합니다.
