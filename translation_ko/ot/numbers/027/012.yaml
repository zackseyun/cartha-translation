  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
  footnotes:
  - marker: a
    text: Or 'the mountain of Abarim' or 'Mount Abarim.' The Hebrew phrase is literally 'mountain of the Abarim.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''to the Israelites'' or ''to the people of Israel.'' Hebrew: ''to the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「이 아바림 산으로 올라가서, 내가 이스라엘 자손에게 준 그 땅을 보아라.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아바림 산’ 또는 ‘아바림의 산’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘아바림의 산’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘이스라엘 사람들에게’ 또는 ‘이스라엘 백성에게’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘의 아들들에게’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 프로젝트 기본값에 따라 신적 고유명은 관용적 칭호인 ‘주’가 아니라 음역형 ‘야훼’로 옮겨, 본문의 인격적 이름을 드러냈습니다.
- source_word: עֲלֵה אֶל הַר הָעֲבָרִים הַזֶּה
  english_pob_choice: Go up to this mountain of the Abarim
  chosen_korean: 이 아바림 산으로 올라가서
  alternatives_korean:
  - 이 아바림 산에 올라가서
  - 아바림 산으로 올라가서
  - 이 산지의 아바림으로 올라가서
  lexicon: HALOT
  rationale: 히브리어의 ‘산(הר)’과 지시어 ‘이것’을 살리되, 한국어에서는 자연스러운 방향어 ‘-으로 올라가다’로 옮겨 간결하게 표현했습니다.
- source_word: וּרְאֵה אֶת הָאָרֶץ
  english_pob_choice: and see the land
  chosen_korean: 그 땅을 보아라
  alternatives_korean:
  - 그 땅을 살펴보아라
  - 그 땅을 바라보아라
  lexicon: HALOT
  rationale: 명령형 ראה를 직역에 가까운 ‘보다’로 옮겨, 단순 관찰보다 눈으로 직접 확인하라는 소명을 유지했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 백성에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 한국어 관용에 맞게 ‘자손’으로 옮겨, 영어 본문의 gender-accurate 의도를 무리 없이 반영했습니다.
theological_decisions:
- issue: 야훼의 직접 말씀체와 모세에 대한 명령형의 전달
  chosen_reading: 직접 인용 안에서는 단호한 명령형 ‘보아라’를 유지했습니다.
  alternative_readings:
  - ‘보십시오’처럼 공손화
  - ‘보게 하라’처럼 완화
  rationale: 히브리어 명령형의 직접성과 긴급성을 보존하기 위해, 하나님의 말씀 인용에서는 모세에게 주어지는 직접 명령을 그대로 살렸습니다.
  doctrine_reference: 본문의 화행 보존 원칙
