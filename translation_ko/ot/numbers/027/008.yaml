  rationale: 히브리어의 문자적 남성 복수 표현을 살리되, 한국어에서는 관용적으로 굳은 ‘이스라엘 자손’을 사용해 원문의 혈연·언약 공동체 뉘앙스를 자연스럽게 전달했습니다.
- source_word: תְּדַבֵּר לֵאמֹר
  english_pob_choice: you shall speak, saying
  chosen_korean: 말하여 이르되
  alternatives_korean:
