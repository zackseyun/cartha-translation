  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르되, ‘어떤 사람이 죽고 아들이 없으면, 그의 유산을 그의 딸에게 넘겨 주십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 문자적 남성 복수 표현을 살리되, 한국어에서는 관용적으로 굳은 ‘이스라엘 자손’을 사용해 원문의 혈연·언약 공동체 뉘앙스를 자연스럽게 전달했습니다.
- source_word: תְּדַבֵּר לֵאמֹר
  english_pob_choice: you shall speak, saying
  chosen_korean: 말하여 이르되
  alternatives_korean:
  - 말하십시오, 곧
  - 말하며 이르되
  lexicon: HALOT
  rationale: ‘말하다 + 이르다’의 지시·인용 도입 구조를 한국어 성경체로 간결하게 옮겨, 법적 지시문 특유의 형식을 보존했습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유산
  alternatives_korean:
  - 그의 상속 재산
  - 그의 기업
  lexicon: HALOT
  rationale: 이 절의 נַחֲלָה는 토지와 권리의 상속을 가리키므로 ‘유산’이 현대 한국어에서 가장 자연스럽게 법적 상속 개념을 드러냅니다.
- source_word: וְהַעֲבַרְתֶּם
  english_pob_choice: you shall transfer
  chosen_korean: 넘겨 주십시오
  alternatives_korean:
  - 옮겨 주십시오
  - 이양하십시오
  lexicon: HALOT
  rationale: 히필형 עבר의 법적·행정적 의미를 한국어 동작으로 살려, 단순한 ‘지나가게 하다’보다 권리 이전의 의미가 분명한 표현을 택했습니다.
theological_decisions:
- issue: 성별 표지와 법조문의 직접성
  chosen_reading: אִישׁ를 ‘어떤 사람’으로 풀어, 법조항의 일반 규정을 살리면서도 뒤이은 ‘아들’의 부재라는 문맥을 분명히 했습니다.
  alternative_readings:
  - ‘한 남자가’로 직역
  - ‘사람이’로 완전히 중성화
  rationale: 히브리어 법문은 남성형 사례를 쓰지만, 이 절의 핵심은 상속 절차 규정입니다. 한국어에서는 사례 도입의 법문체를 유지하되, 과도한 남성성 강조는 피했습니다.
  doctrine_reference: 성경 법문 해석의 문맥 우선 원칙
