  - 그의 기업
  lexicon: HALOT
  rationale: 이 절의 נַחֲלָה는 토지와 권리의 상속을 가리키므로 ‘유산’이 현대 한국어에서 가장 자연스럽게 법적 상속 개념을 드러냅니다.
- source_word: וְהַעֲבַרְתֶּם
  english_pob_choice: you shall transfer
  chosen_korean: 넘겨 주십시오
  alternatives_korean:
  - 옮겨 주십시오
  - 이양하십시오
  lexicon: HALOT
  rationale: 히필형 עבר의 법적·행정적 의미를 한국어 동작으로 살려, 단순한 ‘지나가게 하다’보다 권리 이전의 의미가 분명한 표현을 택했습니다.
theological_decisions:
- issue: 성별 표지와 법조문의 직접성
  chosen_reading: אִישׁ를 ‘어떤 사람’으로 풀어, 법조항의 일반 규정을 살리면서도 뒤이은 ‘아들’의 부재라는 문맥을 분명히 했습니다.
  alternative_readings:
  - ‘한 남자가’로 직역
  - ‘사람이’로 완전히 중성화
  rationale: 히브리어 법문은 남성형 사례를 쓰지만, 이 절의 핵심은 상속 절차 규정입니다. 한국어에서는 사례 도입의 법문체를 유지하되, 과도한 남성성 강조는 피했습니다.
  doctrine_reference: 성경 법문 해석의 문맥 우선 원칙
