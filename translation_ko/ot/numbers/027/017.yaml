base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
  footnotes:
  - marker: a
    text: Or 'ahead of them' for 'before them' in both occurrences.
    reason: lexical_alternative
  - marker: b
    text: The sequence 'go out ... come in ... lead them out ... bring them in' is a Hebrew way of describing comprehensive public leadership.
    reason: cultural_note
  - marker: c
    text: Or 'assembly of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 앞에 나가고 그들 앞에 들어오며, 그들을 이끌어 내고 그들을 데려올 사람을 세워 주십시오. 야훼의 회중이 목자 없는 양처럼 되지 않게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 앞에’는 두 번 반복되는 לִפְנֵיהֶם의 관용적 표현이며, ‘그들보다 앞서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가다 / 들어오다 / 이끌어 내다 / 데려오다’의 연속은 백성을 포괄적으로 인도하는 공적 지도자를 가리키는 히브리어 관용입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼의 총회’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא / יָבֹא
