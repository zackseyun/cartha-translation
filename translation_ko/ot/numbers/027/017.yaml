base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
  footnotes:
  - marker: a
    text: Or 'ahead of them' for 'before them' in both occurrences.
    reason: lexical_alternative
  - marker: b
    text: The sequence 'go out ... come in ... lead them out ... bring them in' is a Hebrew way of describing comprehensive public leadership.
    reason: cultural_note
  - marker: c
    text: Or 'assembly of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 앞서 나가고 그들 앞에 들어오며, 그들을 이끌어 내고 그들을 데려오게 하십시오. 그러면 야훼의 회중이 목자 없는 양처럼 되지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞에’ 또는 ‘앞서’는 두 번 반복되는 לִפְנֵיהֶם의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가다 / 들어오다 / 이끌어 내다 / 데려오다’의 연속은 백성을 포괄적으로 인도하는 공적 지도자를 가리키는 히브리어 관용입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼의 회중’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא / יָבֹא
  english_pob_choice: will go out / come in
  chosen_korean: 앞서 나가고 / 들어오며
  alternatives_korean:
  - 나가고 / 들어오며
  - 앞에 나가고 / 앞에 들어오며
  lexicon: HALOT
  rationale: 출입의 관용적 병렬을 한국어로 자연스럽게 살리되, 리더십의 선행·동행 뉘앙스를 담기 위해 ‘앞서 나가고 / 들어오며’로 옮겼습니다.
- source_word: יוֹצִיאֵם / יְבִיאֵם
  english_pob_choice: will lead them out / bring them in
  chosen_korean: 그들을 이끌어 내고 / 그들을 데려오게 하십시오
  alternatives_korean:
  - 그들을 이끌어 내고 / 그들을 이끌어 들이게 하십시오
  - 그들을 끌어내고 / 그들을 끌어들이게 하십시오
  lexicon: HALOT
  rationale: 히필의 사역성을 보존하면서도 지도자의 공적 인도를 드러내기 위해 ‘이끌어’와 ‘데려오게 하십시오’를 사용했습니다.
- source_word: עֲדַת יְהוָה
  english_pob_choice: the congregation of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 총회
  - 야훼의 공동체
  lexicon: HALOT
  rationale: עֵדָה는 모인 언약 백성을 가리키므로, 제도적 뉘앙스보다 집합체를 살리는 ‘회중’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기를 가리키는 고유명사를 관례적 호칭 ‘주’로 대체하지 않고, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כַּצֹּאן ... רֹעֶה
  english_pob_choice: like sheep ... shepherd
  chosen_korean: 목자 없는 양처럼
  alternatives_korean:
  - 목자 없는 양 떼처럼
  - 목자 없는 양과 같이
  lexicon: HALOT
  rationale: ‘양’과 ‘목자’의 비유를 한국어 관용으로 압축해, 공동체가 인도자를 잃은 상태라는 이미지를 선명하게 보존했습니다.
theological_decisions:
- issue: 민수기 27:17의 명령형/청유형 처리
  chosen_reading: 모세의 요청으로서 지도자를 세우라는 청원을 한국어 공손 명령 ‘-게 하십시오’로 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘세워 주십시오’로 옮김
  - 미래형으로 ‘세울 사람을 주십시오’로 옮김
  rationale: 히브리어 연속 절이 미래적 성격을 띠지만, 문맥상 여호와께 드리는 요청이므로 한국어에서는 공손한 요청형이 가장 자연스럽고 본문의 기능을 유지합니다.
