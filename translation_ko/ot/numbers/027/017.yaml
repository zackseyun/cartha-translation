  to: 그들 앞에 나가고 그들 앞에 들어오며, 그들을 이끌어 내고 그들을 데려올 사람을 세워 주십시오. 야훼의 회중이 목자 없는 양처럼 되지 않게 하십시오.[a][b][c]
  rationale: 수정문은 앞 절에 의존하는 관계절을 한국어 청원문으로 자연스럽게 연결하고, 모든 동사의 단수 지도자 지시를 보존했습니다. ‘세워 주십시오’는 16절의 명시된 요청 동사를 한국어에서 보완한 것이며, 17절의 의미를 추가하거나 변경하지 않습니다. 또한 각주 c의 구조적·내용상 오류를 실제 어휘 대안으로 교정했습니다.
