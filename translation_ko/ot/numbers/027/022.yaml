id: NUM.27.22
reference: Numbers 27:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
  footnotes:
  - marker: a
    text: Or 'set him standing before'; the Hebrew verb can also be rendered 'presented him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼께서 그에게 명령하신 대로 행하여, 여호수아를 데려다가 제사장 엘르아살 앞과 온 회중 앞에 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 세워 놓았다’; 히브리어 동사는 ‘그를 제시하였다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms; divine name policy
  rationale: 본문이 여호와의 대역이 아니라 신명기적 언약명 יְהוָה를 직접 사용하므로, 한국어도 관습적 대체어보다 음역인 ‘야훼’를 살렸습니다.
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה
  english_pob_choice: And Moses did as Yahweh had commanded him
  chosen_korean: 모세는 야훼께서 그에게 명령하신 대로 행하여
  alternatives_korean:
  - 모세는 야훼께서 그에게 명령하신 대로 했습니다
  - 모세는 야훼께서 그에게 명령하신 대로 실행했습니다
  lexicon: HALOT
  rationale: עשה+כַּאֲשֶׁר+צִוָּה의 순종 구조를 ‘행하여’로 자연스럽게 옮겨, 단순한 ‘했다’보다 순종의 응답성을 드러냈습니다.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  english_pob_choice: he took Joshua
  chosen_korean: 여호수아를 데려다가
  alternatives_korean:
  - 여호수아를 데리고
  - 여호수아를 붙들어
  lexicon: HALOT
  rationale: לקח은 문자적으로 ‘데려가다/취하다’의 뜻이 있어, 의식적 인도와 함께 이어지는 장면을 드러내는 ‘데려다가’가 가장 자연스럽습니다.
- source_word: וַיַּעֲמִדֵהוּ
  english_pob_choice: set him before
  chosen_korean: 앞에 세웠습니다
  alternatives_korean:
  - 앞에 세워 두었습니다
  - 앞에 प्रस्तुत했습니다
  - 앞에 세우셨습니다
  lexicon: HALOT
  rationale: עמד의 사역형은 ‘서게 하다/세우다’의 의식적 배치를 가리키므로, POB의 주석 가능성을 살리면서도 본문은 간결하게 ‘앞에 세웠습니다’로 옮겼습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 회중 전체
  - 온 집회
  - 온 공동체
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 모인 공동체를 뜻하므로, 본문 맥락에서 ‘회중’이 가장 표준적이며, כָּל은 ‘온’으로 충분히 반영했습니다.
theological_decisions:
- issue: 엘르아살과 온 회중 앞에 세우는 장면의 공적·의례적 성격
  chosen_reading: 단순한 소개가 아니라 여호수아를 후계자로 공적으로 세우는 의례적 장면으로 읽었습니다.
  alternative_readings:
  - 그저 사람들 앞에 소개한 것
  - 행정적 인수인계의 표시
  rationale: ‘앞에 세웠습니다’와 ‘데려다가’는 본문의 의식적 배치를 보존하며, 그 공적 성격을 약화하지 않습니다.
  doctrine_reference: Numbers 27 문맥의 지도자 계승 본문
