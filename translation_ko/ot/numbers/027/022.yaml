  source_fidelity: 히브리어의 순서와 관계를 충실히 반영합니다. 모세가 야훼께서 그에게 명령하신 대로 행한 뒤 여호수아를 데려와 엘르아살 제사장과 온 회중 앞에 세운 사실이 모두 보존되었습니다. וַיַּעֲמִדֵהוּ의 사역적·공적 배치의 의미도 ‘앞에 세웠습니다’로 적절히 전달됩니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽고, 본문의 격식 있는 서술 문체에도 잘 맞습니다. ‘행하여’는 다소 문어적이지만 성경 번역의 격식 있는 문맥에서 무리가 없습니다.
  terminology: ‘야훼’는 제공된 POB 방침에 따른 신명 음역이며, ‘여호수아’, ‘엘르아살’, ‘제사장’, ‘온 회중’도 한국어 성경 문맥에서 통용되고 적절합니다. 각주도 본문의 ‘세우다’에 대한 가능한 번역 대안을 적절히 제시합니다.
