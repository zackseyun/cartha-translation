revisions:
- from: 그것은 너희가 신 광야에서 회중의 다툼 가운데서 내 명령에 거역하고, 그 물가에서 그들 눈앞에서 나를 거룩하게 하지 않았기 때문입니다. 이것이 신 광야의 므리바-가데스 물입니다.[a][b]
  to: 이는 너희가 신 광야에서 회중이 다툴 때에 내 명령을 거역하고, 그 물에서 그들이 보는 앞에서 나를 거룩한 분으로 드러내지 않았기 때문입니다.[a] 이것은 신 광야에 있는 므리바 가데스의 물입니다.[b]
  rationale: 문맥상 내포된 부정을 유지하면서 קדש 히필을 ‘거룩한 분으로 드러내다’로 옮겨 의미를 명료하게 했습니다. 또한 문장을 현대 한국어 합쇼체에 맞게 다듬고, 각주 표지를 설명 대상 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
