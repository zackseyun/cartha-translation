source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
  footnotes:
  - marker: a
    text: Or 'to sanctify me' / 'to show me as holy before their eyes.' The Hebrew infinitive is positive in form, but the context makes clear that Moses and Aaron failed to do this.
    reason: lexical_alternative
  - marker: b
    text: Meribath-kadesh may also be rendered 'Meribah of Kadesh' or more literally 'the strife of Kadesh.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 너희가 신 광야에서 회중이 다툴 때에 내 명령을 거역하고, 그 물에서 그들이 보는 앞에서 나를 거룩한 분으로 드러내지 않았기 때문입니다.[a] 이것은 신 광야에 있는 므리바 가데스의 물입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 부정사는 형태상 ‘나를 거룩하게 하다’라는 긍정형입니다. 그러나 문맥상 모세와 아론이 백성 앞에서 하나님의 거룩함을 드러내지 못했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘므리바 가데스’는 복합 지명입니다. ‘가데스의 므리바’ 또는, 더 직역하면 ‘가데스의 다툼’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר / מְרִיתֶם פִּי
  english_pob_choice: because you rebelled against my command
  chosen_korean: 내 명령에 거역하고
  alternatives_korean:
  - 내 명령을 거슬러
  - 내 입의 말씀에 반역하고
  lexicon: HALOT
  rationale: כַּאֲשֶׁר가 여기서는 이유를 나타내고, פִּי는 문자적으로 ‘내 입’이지만 관용적으로 하나님의 명령을 가리키므로 ‘내 명령에 거역하고’가 자연스럽고 원뜻을 살립니다.
- source_word: בְּמִדְבַּר צִן
  english_pob_choice: in the wilderness of Zin
  chosen_korean: 신 광야
  alternatives_korean:
  - 지ן 광야
  - 신의 광야
  lexicon: HALOT
  rationale: 지명은 한국어 성경에서 널리 쓰이는 ‘신’ 음역을 따르고, מִדְבָּר는 문맥상 ‘광야’가 적절합니다.
- source_word: בִּמְרִיבַת הָעֵדָה
  english_pob_choice: in the strife of the congregation
  chosen_korean: 회중의 다툼 가운데서
  alternatives_korean:
  - 회중의 분쟁 속에서
  - 공동체의 다툼 가운데서
  lexicon: HALOT
  rationale: עֵדָה는 언약 공동체의 모임을 가리키므로 ‘회중’이 적절하고, מְרִיבָה의 갈등·논쟁 뉘앙스를 ‘다툼’으로 옮겼습니다.
- source_word: לְהַקְדִּישֵׁנִי
  english_pob_choice: by not treating me as holy
  chosen_korean: 나를 거룩하게 하지 않았기 때문입니다
  alternatives_korean:
  - 나를 거룩한 분으로 드러내지 않았기 때문입니다
  - 나를 거룩하게 하도록 하지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히필형 קדש는 여기서 하나님의 거룩함을 백성 앞에서 드러내는 뜻이므로, 문맥의 부정적 의미를 반영해 ‘거룩하게 하지 않았다’로 옮겼습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들 눈앞에서
  alternatives_korean:
  - 그들 보기에
  - 그들 앞에서
  lexicon: HALOT
  rationale: ‘눈앞에서’는 공적·가시적 행위를 강조하는 관용을 비교적 직접적으로 살립니다.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  english_pob_choice: the waters of Meribath-kadesh
  chosen_korean: 므리바-가데스 물
  alternatives_korean:
  - 가데스의 므리바 물
  - 므리바-가데스의 물
  lexicon: HALOT
  rationale: 본문이 사건명 겸 지명 표현을 제시하므로 음역을 유지해 고유명으로 처리했고, 뒤의 ‘물’로 사건의 장소 표지를 살렸습니다.
theological_decisions:
- issue: לְהַקְדִּישֵׁנִי의 의미를 긍정형 그대로 둘지, 문맥상 부정으로 풀지
  chosen_reading: 문맥에 따라 ‘나를 거룩하게 하지 않았다’로 풀었습니다.
  alternative_readings:
  - ‘나를 거룩하게 하다’
  - ‘내 거룩함을 드러내다’
  rationale: 히브리어 부정사는 형태상 긍정이지만, 여기서는 모세와 아론이 백성 앞에서 하나님의 거룩함을 드러내지 못한 실패를 말하므로, 한국어에서는 그 함의를 명시하는 것이 가장 정확합니다.
  doctrine_reference: Translation philosophy §1, §3
