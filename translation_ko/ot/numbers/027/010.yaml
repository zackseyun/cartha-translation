  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to his paternal uncles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 형제들이 없으면, 너희는 그의 유산을 그의 아버지의 형제들에게 주어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 관용적으로는 ‘그의 친삼촌들에게’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그에게 형제들이 없으면
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 법적 계승 절차의 다음 경우를 이어 주는 조건문으로 이해하여, 한국어에서는 자연스럽게 ‘…없으면’으로 조건과 전환을 함께 살렸습니다.
- source_word: אֵין לוֹ אַחִים
  english_pob_choice: he has no brothers
  chosen_korean: 그에게 형제들이 없으면
  alternatives_korean:
  - 그에게 형제들이 없으면
  - 그에게 형들이 없으면
  lexicon: HALOT
  rationale: 히브리어 אַחִים은 문자적으로 ‘형제들’이며, 이 상속 규정에서는 남자 형제들을 가리키므로 ‘형제들’이 원문 의미를 가장 직접적으로 반영합니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유산
  alternatives_korean:
  - 그의 상속 재산
  - 그의 기업
  lexicon: HALOT
  rationale: נַחֲלָה는 여기서 분배되는 상속 지분을 뜻하므로, 전통적 교회어인 ‘기업’보다 법적·일상적 의미가 분명한 ‘유산’으로 옮겼습니다.
- source_word: לַאֲחֵי אָבִיו
  english_pob_choice: to his father's brothers
  chosen_korean: 그의 아버지의 형제들에게
  alternatives_korean:
  - 그의 아버지의 형제들에게
  - 그의 사촌 삼촌들에게
  lexicon: HALOT
  rationale: 직역 구조인 ‘아버지의 형제들’을 유지해 친족 관계의 층위를 보존했습니다. 한국어로는 ‘삼촌들’보다 원문 구조가 더 분명합니다.
theological_decisions:
- issue: 상속 규정의 법률 문체
  chosen_reading: 명령형 법조문 어조를 살려 ‘너희는 … 주어야 합니다’로 번역했습니다.
  alternative_readings:
  - ‘너희는 … 주십시오’
  - ‘… 주어야 하리라’
  rationale: 본문은 공동체에 대한 규범 조항이므로, 현대 한국어의 공문체에 가까운 의무 표현이 원문의 법적 성격을 가장 잘 드러냅니다.
  doctrine_reference: 민수기의 상속법 규정
