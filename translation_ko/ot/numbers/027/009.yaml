  text: וְ/אִם אֵ֥ין ל֖/וֹ בַּ֑ת וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/אֶחָי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: ko
  text: 또 그에게 딸이 없으면, 그의 상속 재산을 그의 형제들에게 주어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  english_pob_choice: And if
  chosen_korean: 그리고 …하면
  alternatives_korean:
  - 그런데 …하면
  - 만일 …하면
  lexicon: HALOT
  rationale: 법적 조건문의 연결을 살려 וְ의 접속성을 반영하되, 한국어에서는 ‘그리고 …하면’이 자연스럽습니다.
- source_word: אֵין לוֹ
  english_pob_choice: he has no
  chosen_korean: 그에게 …이 없으면
  alternatives_korean:
  - 그는 …이 없으면
  - 그에게 …이 없다면
  lexicon: HALOT
  rationale: 히브리어의 소유 부정 구문을 한국어 법률문체에 맞게 ‘그에게 …이 없으면’으로 옮기면 의미와 문체를 모두 살릴 수 있습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 상속 재산
  alternatives_korean:
  - 그의 상속
  - 그의 유산
  - 그의 몫
  lexicon: HALOT
  rationale: 이 문맥의 נַחֲלָה는 추상적 유산보다 실제 상속되는 몫/재산을 가리키므로, 현대 한국어 법적 표현인 ‘상속 재산’이 가장 분명합니다.
- source_word: לְאֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 그의 형제들에게
  alternatives_korean:
  - 그의 형들에게
  - 그의 남자 형제들에게
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형이지만 한국어에서는 ‘형제들’이 자연스럽고, 본문이 남성 상속권자를 전제하는 점도 함께 유지됩니다.
