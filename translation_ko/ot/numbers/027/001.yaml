    rationale: 원문은 슬로브핫에서 므낫세까지의 계보를 반복하고, 이어서 ‘요셉의 아들 므낫세의 씨족들에 속한’이라는 소속을 밝힙니다. ‘그는 … 요셉의 후손 가운데 있었습니다’는 이 구조를 충분히 보존하지 못합니다.
