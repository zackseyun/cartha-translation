  source_fidelity: 현 초안은 슬로브핫의 계보와 ‘요셉의 아들 므낫세의 씨족’이라는 소속 관계를 한 문장으로 재구성하면서, 본문의 반복된 계보 구조를 ‘그는 … 후손 가운데 있었습니다’로 바꾸었습니다. 이는 씨족 소속의 대상을 다소 불명확하게 하며, ‘므낫세의 아들’과 ‘요셉의 후손’의 관계도 원문보다 부정확하게 만듭니다. 또한 호글라 이름이 ‘홀라’로 누락되어 있습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, 긴 계보를 쉼표로 구분하여 읽기 쉽게 제시합니다. ‘나아왔습니다’는 공식적인 청원을 앞둔 움직임이라는 원문의 함의를 과도하게 명시하지 않고 보존합니다.
  terminology: 인명은 슬로브핫, 헤벨, 길르앗, 마길, 므낫세, 마흘라, 노아, 호글라, 밀가, 디르사로 통일했습니다. 초안의 본문 ‘셀로브핫’과 각주의 ‘슬로브핫’ 사이의 표기 불일치도 해소했습니다. ‘씨족’은 מִשְׁפָּחוֹת의 사회·혈연 집단 의미를 적절히 반영합니다.
  issues:
