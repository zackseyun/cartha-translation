revisions:
- from: 그때 셀로브핫의 딸들이 나아왔습니다. 그는 헤벨의 아들이요, 길르앗의 아들이요, 마길의 아들이요, 므낫세의 아들로서 요셉의 후손 가운데 있었습니다. 그의 딸들의 이름은 이러합니다. 말라, 노아, 홀라, 밀가, 그리고 디르사입니다.[a][b]
  to: 그때 요셉의 아들 므낫세의 씨족에 속한, 헤벨의 아들 길르앗의 아들 마길의 아들 므낫세의 아들 슬로브핫의 딸들이 나아왔습니다[a]. 그의 딸들의 이름은 마흘라, 노아[b], 호글라, 밀가, 디르사입니다.
  rationale: 계보를 원문의 순서대로 유지하고, 씨족 소속을 ‘요셉의 아들 므낫세의 씨족에 속한’으로 명시했습니다. 인명 오기와 표기 불일치를 바로잡았으며, 각주 표지를 해당 단어·표현에 직접 연결했습니다. 원문이 명시하지 않는 청원의 대상이나 법적 해석은 본문에 덧붙이지 않았습니다.
