source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
  footnotes:
  - marker: a
    text: 'Hebrew ''came near''; also possible: ''approached'' or ''drew near.'' The wording may suggest coming forward for a formal petition, which the following verses narrate.'
    reason: lexical_alternative
  - marker: b
    text: '''Noah'' here is the name of one of Zelophehad''s daughters, not the earlier male figure Noah in Genesis.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 셀로브핫의 딸들이 나아왔습니다. 그는 헤벨의 아들이요, 길르앗의 아들이요, 마길의 아들이요, 므낫세의 아들로서 요셉의 후손 가운데 있었습니다. 그의 딸들의 이름은 이러합니다. 말라, 노아, 홀라, 밀가, 그리고 디르사입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “나아오다”입니다. 이 표현은 단순 이동이 아니라, 뒤에 이어질 공식적 청원 장면을 예고할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘노아’는 창세기의 남성 인물 노아가 아니라, 슬로브핫의 딸 가운데 한 사람의 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  english_pob_choice: came near
  chosen_korean: 나아왔습니다
  alternatives_korean:
  - 가까이 다가왔습니다
  - 나왔습니다
  - 접근했습니다
  lexicon: HALOT
  rationale: 문맥상 권위자 앞에 공식적으로 나아가는 동작을 나타내므로, 단순한 이동보다 청원 맥락을 살리는 '나아오다'를 택했습니다.
- source_word: בְּנוֹת
  english_pob_choice: daughters of
  chosen_korean: 딸들이
  alternatives_korean:
  - 여자 자손들이
  - 여성 후손들이
  lexicon: HALOT
  rationale: 뒤의 명단이 실제 여섯 명의 이름 제시이므로, 자연스럽고 정확한 '딸들'로 옮겼습니다.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  english_pob_choice: son of ... son of ... son of ... son of
  chosen_korean: …의 아들이요, …의 아들이요, …의 아들이요, …의 아들로서
  alternatives_korean:
  - …의 후손이요, …의 후손이요, …의 후손이요, …의 후손으로서
  - …의 아들이며 …의 아들이며 …의 아들이며 …의 아들인
  lexicon: HALOT
  rationale: 반복되는 족보 형식을 압축하지 않고 유지해, 상속 청원의 법적·혈통적 근거를 드러냈습니다.
- source_word: לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף
  english_pob_choice: from the clans of Manasseh son of Joseph
  chosen_korean: 므낫세의 아들로서 요셉의 후손 가운데 있었습니다
  alternatives_korean:
  - 요셉의 아들 므낫세의 씨족에 속해 있었습니다
  - 요셉의 아들 므낫세의 종족 가운데 있었습니다
  lexicon: HALOT
  rationale: לְ미슈파호트는 소속을 나타내므로 '… 가운데 있었습니다'로 풀어 자연스럽게 옮기되, מִשְׁפָּחָה의 씨족/종족 의미를 보존했습니다.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  english_pob_choice: And these were the names of his daughters
  chosen_korean: 그의 딸들의 이름은 이러합니다
  alternatives_korean:
  - 그리고 이것들은 그의 딸들의 이름입니다
  - 이것이 그의 딸들의 이름입니다
  lexicon: HALOT
  rationale: 이름 소개 공식에 맞춰 평서문으로 정리했습니다.
theological_decisions:
- issue: 족보 반복을 통한 상속·정체성의 강조
  chosen_reading: 딸들의 청원이 개인 주장에 그치지 않고, 아버지와 조상 라인에 근거한 정당한 권리 주장으로 읽히도록 족보를 그대로 살렸습니다.
  alternative_readings:
  - 족보를 압축해 간단히 처리하는 읽기
  - 단순 배경 정보로 약화시키는 읽기
  rationale: 본문은 상속 청원의 법적 근거를 족보 구조로 제시하므로, 그 기능이 드러나도록 번역해야 합니다.
  doctrine_reference: 민수기 27:1-11의 상속 규정 문맥
