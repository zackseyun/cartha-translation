  source_fidelity: 현 번역은 광야에서의 죽음, 고라의 집단에 속하지 않음, 자신의 죄와 관련된 죽음, 아들이 없음이라는 핵심 의미를 대체로 보존합니다. 그러나 יְהוָה는 이 프로젝트의 원칙 및 영어 감사 기록에 따라 ‘야훼’로 옮겨야 하며, ‘고라의 무리 가운데서 … 회중 안에’는 히브리어의 수식 관계를 다소 어색하게 만듭니다.
  naturalness: ‘야훼를 거슬러 모인 회중, 곧 고라의 무리 가운데’는 원문의 동격적 집단 지시를 자연스럽고 명료하게 표현합니다. ‘자기 죄 때문에 죽었으며’는 합쇼체 문체에 자연스럽고 בְחֶטְאוֹ의 원인적 의미를 무리 없이 전달합니다.
  terminology: יְהוָה는 ‘주님’이 아니라 ‘야훼’로 통일해야 합니다. עֵדָה는 ‘회중’, עֲדַת קֹרַח은 ‘고라의 무리’로 옮길 수 있습니다. 기존 각주는 본문 표지와 내용이 맞지 않고, b와 c의 내용도 영어 감사 기록의 기능과 서로 뒤바뀌어 있어 바로잡아야 합니다.
