- from: 우리 아버지는 광야에서 죽었습니다[a]. 그는 고라의 무리 가운데서 주님을 거슬러 함께 모인 회중 안에 있지 않았습니다. 오히려 그는 자기 죄로 죽었고[c][b], 아들은 없었습니다.
  to: 우리 아버지는 광야에서 죽었습니다. 그는 야훼를 거슬러 모인 회중[a][b], 곧 고라의 무리 가운데 있지 않았습니다. 오히려 그는 자기 죄 때문에 죽었으며[c], 아들은 없었습니다.
  rationale: ‘야훼’로 신명을 충실히 옮기고, 고라의 무리와 야훼를 거슬러 모인 회중의 관계를 ‘곧’으로 명료하게 표현했습니다. 또한 원문의 원인적/상태적 해석 가능성을 보존하도록 죄 관련 각주를 정비했으며, 모든 각주 표지를 해당 본문 표현에 맞추었습니다.
