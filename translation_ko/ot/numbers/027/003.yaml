id: NUM.27.3
reference: Numbers 27:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
  footnotes:
  - marker: a
    text: Or 'assembly' instead of 'congregation' for the Hebrew עֵדָה.
    reason: lexical_alternative
  - marker: b
    text: Or 'who assembled against the LORD' for 'those who gathered themselves against the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because of his sin' or 'in his sin.' The Hebrew does not specify the particular sin, only that his death was not as part of Korah's rebellion.
    reason: alternative_reading
translation:
  language: ko
  text: 우리 아버지는 광야에서 죽었습니다. 그는 야훼를 거슬러 모인 회중[a][b], 곧 고라의 무리 가운데 있지 않았습니다. 오히려 그는 자기 죄 때문에 죽었으며[c], 아들은 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집회’. 히브리어 עֵדָה의 다른 번역 가능성입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼를 거슬러 모인 자들’. 히브리어는 함께 모이는 행위를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 죄로’ 혹은 ‘그의 죄 안에서’. 히브리어는 어떤 특정한 죄인지는 밝히지 않으며, 그의 죽음이 고라의 반역에 가담한 결과가 아니었음을 구별합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 광야 안에서
  - 사막에서
  lexicon: HALOT
  rationale: 민수기 문맥에서 מִדְבָּר은 이스라엘의 광야 여정을 가리키므로, 표준적이고 성경적인 ‘광야’를 택했습니다.
- source_word: הָעֵדָה
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 공동체
  - 집회
  lexicon: HALOT
  rationale: עֵדָה는 단순한 제도 기관보다 모여 있는 공동체를 가리키므로, 한국어에서는 ‘회중’이 가장 직접적입니다.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  english_pob_choice: those who gathered themselves against Yahweh
  chosen_korean: 주님을 거슬러 함께 모인
  alternatives_korean:
  - 주님을 대적하여 모인
  - 주님께 맞서 모인
  lexicon: HALOT
  rationale: נואד의 집합적·반사적 뉘앙스를 살리기 위해 ‘함께 모인’으로 옮기고, עַל יְהוָה의 적대성을 ‘거슬러’로 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절은 고라 사건을 가리키는 서술 속 인용이므로, 본문 흐름에서 ‘주님’으로 옮기되 직역상의 신명 대체를 의식해 주석 없이 평이한 경어를 유지했습니다.
- source_word: בְחֶטְאוֹ
  english_pob_choice: for his own sin
  chosen_korean: 자기 죄로
  alternatives_korean:
  - 자기 죄 때문에
  - 자기 죄 안에서
  lexicon: HALOT
  rationale: בְ의 원인적 용법을 반영해 ‘-로’로 옮기고, 3인칭 단수 접미사를 살려 ‘자기 죄’로 표현했습니다.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  english_pob_choice: and he had no sons
  chosen_korean: 아들은 없었습니다
  alternatives_korean:
  - 아들이 없었습니다
  - 아들들이 없었습니다
  lexicon: HALOT
  rationale: היה + לְ의 존재표현을 자연스러운 한국어로 풀되, 상속 문제와 직접 연결되는 아들 부재를 분명히 했습니다.
theological_decisions:
- issue: 고라 반역과 개인 죄의 대비
  chosen_reading: 아버지가 고라의 무리에 속하지 않았다는 점과, 그럼에도 자기 죄로 죽었다는 점을 함께 살렸습니다.
  alternative_readings:
  - 그는 자기 죄 안에서 죽었습니다
  - 그는 죄로 인해 죽었습니다
  rationale: 본문은 집단적 반역에 가담하지 않았다는 사실과 개인적 죽음의 원인을 구분하므로, 그 긴장을 완화하지 않도록 대비를 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
