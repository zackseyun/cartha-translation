    text: Or 'by the decision of the Urim.' The phrase refers to priestly inquiry before the LORD by means of the Urim.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
