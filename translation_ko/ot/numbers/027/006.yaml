lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 그리하여 ... 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서사 진행을 한국어의 자연스러운 시간 진행 표현인 ‘그때’로 살리고, 하나님 말씀에는 공손한 ‘말씀하셨습니다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유 신명 ית־יהוה를 전통적 대체어 대신 음역형 ‘야훼’로 옮겨, 본문이 사용하는 하나님의 이름을 직접 드러냈습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세에게로
  - 모세를 향하여
  lexicon: HALOT
  rationale: דֶּרֶךְ/전달 대상 표시의 전치사 אֶל은 이 발화 도입 공식에서 한국어 여격 ‘-에게’가 가장 자연스럽습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: לֵאמֹר은 뒤따르는 직접 화법을 여는 관용적 표지이므로, 한국어에서는 중복을 줄이면서도 그 기능을 살려 본문 전체를 ‘... 말씀하셨습니다’로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 한국어로 어떻게 드러낼지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 인격적 언약 이름을 직접 사용하므로, 대체 칭호 ‘주’보다 고유 이름을 드러내는 번역이 원문 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
