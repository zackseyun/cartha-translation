id: NUM.27.11
reference: Numbers 27:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
  footnotes:
  - marker: a
    text: Or 'his kinsman who is closest to him.' The Hebrew combines 'his blood relative' with 'the one nearest to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he shall inherit it.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: cultural_note
  - marker: d
    text: Or 'a legal statute' or 'an ordinance of judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그의 아버지에게 형제들이 없으면, 너희는 그의 기업을 그의 가장 가까운 친족, 곧 그의 씨족 가운데서 가장 가까운 자에게 주어야 합니다. 그러면 그가 그것을 차지할 것입니다. 이것은 이스라엘 자손을 위한 판결의 규례가 될 것입니다. 야훼께서 모세에게 명령하신 그대로입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 가장 가까운 친족’이다. 히브리어는 ‘그의 혈족’과 ‘그와 가장 가까운 자’를 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 상속할 것이다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘이스라엘의 아들들’은 이스라엘 백성을 가리키는 표준 언약 표현입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘법적 규례’ 또는 ‘판결의 법령’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין אַחִים לְאָבִיו
  english_pob_choice: his father has no brothers
  chosen_korean: 그의 아버지에게 형제들이 없으면
  alternatives_korean:
  - 그의 아버지에게 형제들이 없을 경우
  - 그의 아버지의 형제들이 없으면
  lexicon: HALOT
  rationale: 아버지의 형제들라는 법적 문맥을 한국어로 자연스럽게 옮기되, 원문의 친족 부재 조건을 그대로 드러냈습니다.
- source_word: נַחֲלָתוֹ / וְיָרַשׁ אֹתָהּ
  english_pob_choice: his inheritance / and he shall possess it
  chosen_korean: 그의 기업 / 그것을 차지할 것입니다
  alternatives_korean:
  - 그의 상속 유산 / 그것을 상속할 것입니다
  - 그의 유업 / 그것을 소유할 것입니다
  lexicon: HALOT
  rationale: נַחֲלָה의 법적 의미를 살리기 위해 기업을 택했고, וְיָרַשׁ는 앞절의 ‘주다’와 중복을 피하면서 결과를 드러내는 ‘차지하다’로 옮겼습니다.
- source_word: שְׁאֵרוֹ הַקָּרֹב אֵלָיו מִמִּשְׁפַּחְתּוֹ
  english_pob_choice: his nearest relative from his clan
  chosen_korean: 그의 가장 가까운 친족, 곧 그의 씨족 가운데서 가장 가까운 자
  alternatives_korean:
  - 그의 가장 가까운 친족, 곧 그의 가족 가운데서 가장 가까운 자
  - 그의 혈족 가운데 가장 가까운 자
  lexicon: HALOT
  rationale: שְׁאֵר와 ‘가장 가까운’의 이중 강조를 살리면서, מִשְׁפָּחָה를 한국어 성경 맥락에 맞는 씨족으로 옮겨 법적·족속적 뉘앙스를 보존했습니다.
- source_word: לְחֻקַּת מִשְׁפָּט
  english_pob_choice: a statute of judgment
  chosen_korean: 판결의 규례
  alternatives_korean:
  - 법적 규례
  - 재판의 규례
  - 판결 규례
  lexicon: HALOT
  rationale: חֻקַּת מִשְׁפָּט는 단순한 규칙보다 판결이 수반되는 법규의 성격을 가지므로, 전통적 교회어보다 법정적 긴장을 살린 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약명 יְהוָה를 별칭으로 바꾸지 않고 고유명으로 드러내기 위해 야훼를 사용했습니다.
theological_decisions:
- issue: 이스라엘 공동체 칭호 לִבְנֵי יִשְׂרָאֵל의 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  rationale: 원문의 남성 복수 표지를 유지하면서도 한국어에서 관용적인 언약 공동체 명칭으로 읽히게 하기 위해 이스라엘 자손을 택했습니다.
  doctrine_reference: Translation philosophy §4
- issue: 야훼의 명령을 직접 인용하는 종결부의 어조
  chosen_reading: 야훼께서 모세에게 명령하신 그대로입니다
  alternative_readings:
  - 야훼께서 모세에게 명령하신 대로입니다
  - 야훼께서 모세에게 명령하신 바와 같습니다
  rationale: 원문의 권위적 결말을 유지하기 위해 평이한 서술체로 마무리하되, 명령의 완결성을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
