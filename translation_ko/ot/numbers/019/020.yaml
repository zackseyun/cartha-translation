revisions:
- from: 그러나 부정하게 된 사람으로서 자신을 정결하게 하지 않는 자는—그 사람은 회중의 한가운데서 끊어질 것입니다. 그는 야훼의 성소를 더럽혔기 때문입니다. 부정의 물을 그에게 뿌리지 않았으니, 그는 부정한 사람입니다.[a][b]
  to: 그러나 부정하게 된 사람이 자신을 정결하게 하지 않으면, 그 사람은 회중 가운데서 끊어질 것입니다.[a] 이는 그가 야훼의 성소를 더럽혔기 때문입니다. 부정의 물[b]이 그에게 뿌려지지 않았으므로, 그는 부정한 상태입니다.
  rationale: 조건문의 구조를 자연스러운 현대 한국어로 정리하고, 물이 뿌려지는 행위는 원문처럼 주체를 특정하지 않는 수동 표현으로 고쳤습니다. ‘끊어짐’의 집행 방식은 해석적으로 한정하지 않았으며, מֵי נִדָּה의 어휘적 불확실성도 본문과 각주에서 보존했습니다. 각주 표지는 대응 어구에 각각 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:51Z'
