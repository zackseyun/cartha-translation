id: NUM.19.20
reference: Numbers 19:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
  footnotes:
  - marker: a
    text: Or 'that soul shall be cut off.' The Hebrew legal formula can refer to the person as a whole, not only the immaterial soul.
    reason: lexical_alternative
  - marker: b
    text: Or 'the water of impurity'; traditionally, 'the water of separation.' The phrase refers to the purification water prepared in this chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 부정하게 된 사람으로서 자신을 정결하게 하지 않는 자는—그 사람은 회중의 한가운데서 끊어질 것입니다. 그는 야훼의 성소를 더럽혔기 때문입니다. 부정의 물을 그에게 뿌리지 않았으니, 그는 부정한 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 영혼은 끊어질 것입니다.’ 히브리 법정식은 영혼만이 아니라 그 사람 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부정의 물’; 전통적으로는 ‘분리의 물’로도 옮깁니다. 이 표현은 이 장에서 마련된 정결용 물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 그 사람
  lexicon: HALOT
  rationale: 여기서는 성별 표지보다 규정 위반자의 일반적 개인을 가리키는 기능이 중요하므로, 문장 흐름에 맞는 중립적 ‘사람’으로 옮겼습니다.
- source_word: יִטְמָא
  english_pob_choice: becomes unclean
  chosen_korean: 부정하게 된
  alternatives_korean:
  - 부정해지는
  - 부정한
  lexicon: HALOT
  rationale: 진행형 상태보다 진입 결과를 나타내는 용법이므로, ‘부정하게 된’으로 ingressive 의미를 살렸습니다.
- source_word: יִתְחַטָּא
  english_pob_choice: purify himself
  chosen_korean: 자신을 정결하게 하지 않는
  alternatives_korean:
  - 자신을 깨끗하게 하지 않는
  - 자신을 정화하지 않는
  lexicon: HALOT
  rationale: 정결 예식 문맥에서의 hitpael을 반영해, 내적 자기정화가 아니라 의례적 정결 행위를 분명히 하도록 ‘정결하게 하다’를 택했습니다.
- source_word: מִקְדַּשׁ יְהוָה
  english_pob_choice: the sanctuary of Yahweh
  chosen_korean: 야훼의 성소
  alternatives_korean:
  - 야훼의 성막
  - 야훼의 성전
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 성소/성역을 뜻하므로, 본문 시대에 더 일반적인 ‘성소’가 적절합니다. 고유신명은 POB 원칙대로 ‘야훼’로 옮겼습니다.
- source_word: מֵי נִדָּה
  english_pob_choice: the water for impurity
  chosen_korean: 부정의 물
  alternatives_korean:
  - 부정정결의 물
  - 부정을 위한 물
  - 분리의 물
  lexicon: HALOT
  rationale: 문맥상 부정 제거를 위한 특별한 물을 가리키므로, 기능을 드러내는 ‘부정의 물’이 가장 간결하고 본문에 충실합니다.
theological_decisions:
- issue: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא의 형벌 표현
  chosen_reading: ‘끊어질 것입니다’로 직역해, 제재의 구체적 방식은 명시하지 않았습니다.
  alternative_readings:
  - 회중에서 추방될 것입니다
  - 죽임을 당할 것입니다
  rationale: 히브리어 언약 법정식은 여기서 형벌의 집행 방식 자체를 규정하지 않으므로, 전통적 해석을 단정하지 않고 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: 형벌의 구체적 형태는 본문이 열어 둔 신학적 긴장으로 남겨 둡니다.
