id: NUM.19.13
reference: Numbers 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
  footnotes:
  - marker: a
    text: Or 'the water of purification.' The Hebrew is literally 'water of impurity,' referring to the water used to remove corpse-impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 사람의 시체에 닿는 모든 사람은 자신을 정결하게 하지 않으면 야훼의 성막을 더럽힌 것이며, 그 사람은 이스라엘에서 끊어질 것입니다. 부정의 물[a]이 그에게 뿌려지지 않았으므로 그는 부정할 것이며, 그의 부정함이 아직 그에게 남아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결의 물’. 히브리어는 문자적으로 ‘부정의 물’이며, 시체로 말미암은 부정을 제거하는 데 쓰이는 물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֹּגֵעַ
  english_pob_choice: Everyone who touches
  chosen_korean: 사람의 시체에 닿는 모든 사람
  alternatives_korean:
  - 모든 사람이 닿는
  - 접촉하는 모든 사람
  lexicon: HALOT
  rationale: נגע의 핵심은 실제 접촉이므로 ‘닿는’으로 직역성을 살렸고, 문장 전체는 법규 문맥에 맞게 ‘모든 사람’으로 자연화했습니다.
- source_word: בְּמֵת בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  english_pob_choice: a dead person, the body of a man who has died
  chosen_korean: 사람의 시체 곧 죽은 사람의 몸
  alternatives_korean:
  - 죽은 사람
  - 죽은 인간의 몸
  lexicon: HALOT
  rationale: נֶפֶשׁ הָאָדָם는 이 정결 문맥에서 단순한 ‘생명’이 아니라 실제 시체를 가리키므로, ‘사람의 시체’와 ‘죽은 사람의 몸’으로 그 구체성을 드러냈습니다.
- source_word: יִתְחַטָּא
  english_pob_choice: purify himself
  chosen_korean: 정결하게 하지
  alternatives_korean:
  - 스스로 깨끗하게 하지
  - 자신을 정결하게 하지
  lexicon: HALOT
  rationale: 히트파엘 동사는 도덕적 회개가 아니라 의례적 정결을 뜻하므로, ‘정결하게 하다’로 번역해 제의적 의미를 보존했습니다.
- source_word: מִשְׁכַּן יְהוָה
  english_pob_choice: the tabernacle of Yahweh
  chosen_korean: 야훼의 성막
  alternatives_korean:
  - 야훼의 장막
  - 주님의 성막
  lexicon: HALOT
  rationale: מִשְׁכָּן은 성막/거처의 표준 용어이므로 ‘성막’을 택했고, יְהוָה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  english_pob_choice: that person shall be cut off from Israel
  chosen_korean: 그 사람은 이스라엘에서 끊어질 것입니다
  alternatives_korean:
  - 그 영혼은 이스라엘에서 끊어질 것입니다
  - 이스라엘 공동체에서 제거될 것입니다
  lexicon: HALOT
  rationale: נכרת의 언약적 제재를 전통적 법률어인 ‘끊어지다’로 유지해, 형벌의 정확한 범위를 임의로 좁히지 않았습니다.
- source_word: מֵי נִדָּה
  english_pob_choice: the water for impurity
  chosen_korean: 부정의 물
  alternatives_korean:
  - 정결의 물
  - 부정을 위한 물
  lexicon: HALOT
  rationale: 직역상 ‘부정의 물’이지만, 이는 시체 부정을 제거하는 데 쓰이는 물을 가리키므로 본문 의미를 해치지 않는 범위에서 간결하게 옮겼습니다.
theological_decisions:
- issue: “cut off” 형벌의 구체적 성격
  chosen_reading: ‘끊어질 것입니다’로 유지하고, 죽음·추방·무자녀 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 공동체에서 추방될 것입니다
  rationale: 히브리어 관용구는 중대한 언약적 제재를 말하지만, 이 절만으로 집행 방식이 확정되지는 않으므로 해석을 열어 두는 것이 본문에 충실합니다.
  doctrine_reference: 법적·신학적 긴장을 해소하지 않고 보존함
- issue: 야훼의 고유명사 표기
  chosen_reading: 주어가 여호와가 아니라 야훼로 드러나도록 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 YHWH를 직접 사용하므로, 프로젝트 기본 표기에 따라 학술적 음역인 ‘야훼’를 채택해 원문 지시를 보존했습니다.
  doctrine_reference: יהוה의 소스 직접 대응 원칙
