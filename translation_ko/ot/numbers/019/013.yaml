revisions:
- from: 사람의 시체[a] 곧 죽은 사람의 몸에 닿는 모든 사람은, 정결하게 하지 않으면 야훼의 성막을 더럽힌 것이며, 그 사람은 이스라엘에서 끊어질 것입니다. 부정의 물이 그에게 뿌려지지 않았으므로 그는 부정하게 될 것이며, 그의 부정함이 아직 그에게 남아 있습니다.
  to: 죽은 사람의 시체에 닿는 모든 사람은 자신을 정결하게 하지 않으면 야훼의 성막을 더럽힌 것이며, 그 사람은 이스라엘에서 끊어질 것입니다. 부정의 물[a]이 그에게 뿌려지지 않았으므로 그는 부정할 것이며, 그의 부정함이 아직 그에게 남아 있습니다.
  rationale: 시체를 가리키는 히브리어 표현을 한국어에서 하나의 자연스러운 명사구로 정리하고, 의례적 정결 행위의 재귀성을 명시했습니다. 부정 상태의 선언은 미래의 변화로 오해되지 않도록 조정했습니다. 제재 공식과 ‘부정의 물’의 직역적 표현 및 각주는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 의례적 정결·부정 문맥과 ‘끊어지다’라는 제재 공식은 잘 보존했습니다. 그러나 בְּמֵת와 뒤따르는 בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת는 ‘사람의 시체, 곧 죽은 사람의 몸’처럼 두 대상이 아니라, ‘죽은 사람의 시체’라는 한 대상을 가리키는 표현입니다. 또한 יִתְחַטָּא는 재귀적 정결 행위를 나타내므로 ‘정결하게 하지 않으면’보다 ‘자신을 정결하게 하지 않으면’이 정확합니다. טָמֵא יִהְיֶה는 지속 상태를 선언하므로 ‘부정하게 될 것입니다’보다 ‘부정할 것입니다’가 적절합니다.
  naturalness: 합쇼체와 법규 문체는 대체로 자연스럽습니다. 다만 첫 구절의 ‘사람의 시체 곧 죽은 사람의 몸’은 중복적이고, 쉼표 뒤의 ‘정결하게 하지 않으면’은 주체가 불명확합니다. 이를 간결하게 정리하면 현대 표준어에서 더 자연스럽고 원문의 관계도 분명해집니다.
  terminology: ‘야훼의 성막’, ‘부정’, ‘정결’, ‘이스라엘에서 끊어질 것입니다’는 일관되고 적절합니다. מֵי נִדָּה의 ‘부정의 물’은 직역적 긴장을 보존하며, 대안 ‘정결의 물’은 각주로 제시하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘사람의 시체 곧 죽은 사람의 몸’이 원문의 한 대상을 불필요하게 중복·분리하여 표현합니다.
    rationale: בְּמֵת בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת는 시체 부정의 문맥에서 죽은 인간의 시체를 지시합니다. ‘죽은 사람의 시체’로 옮기면 자연스럽고 충실합니다.
  - severity: medium
    issue: ‘정결하게 하지 않으면’에 재귀 목적어가 드러나지 않습니다.
    rationale: יִתְחַטָּא는 자신이 의례적으로 정결하게 되는/자신을 정결하게 하는 행위를 뜻합니다. ‘자신을 정결하게 하지 않으면’이 주체와 의미를 분명히 합니다.
  - severity: low
    issue: ‘그는 부정하게 될 것이며’는 지속되는 현재의 부정 상태보다 미래 변화로 읽힐 수 있습니다.
    rationale: טָמֵא יִהְיֶה는 그가 부정한 상태에 있음을 선언하며, 이어지는 ‘그의 부정함이 아직 그에게 남아 있다’가 그 지속을 설명합니다. ‘부정할 것입니다’가 더 가깝습니다.
  revised_text: 죽은 사람의 시체에 닿는 모든 사람은 자신을 정결하게 하지 않으면 야훼의 성막을 더럽힌 것이며, 그 사람은 이스라엘에서 끊어질 것입니다. 부정의 물[a]이 그에게 뿌려지지 않았으므로 그는 부정할 것이며, 그의 부정함이 아직 그에게 남아 있습니다.
