  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
  footnotes:
  - marker: a
    text: Or 'a fastened lid' or 'a sealed cover'; the Hebrew expression refers to a covering secured on the vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 입구가 열려 있는 모든 그릇은 그 위에 묶어 둔 덮개가 없으면 부정합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי
  english_pob_choice: vessel
  chosen_korean: 그릇
  alternatives_korean:
  - 용기
  - 기물
  - 용기류
  lexicon: HALOT
  rationale: 정결 규례의 문맥에서 담는 용기를 가리키므로, 현대 한국어에서는 가장 자연스럽고 구체적인 ‘그릇’으로 옮겼습니다.
- source_word: פָתוּחַ
  english_pob_choice: open
  chosen_korean: 입구가 열려 있는
  alternatives_korean:
  - 열린
  - 덮개가 없는
  - 개방된
  lexicon: HALOT
  rationale: 단순히 ‘열린’보다 용기 자체의 상태를 분명히 드러내기 위해 ‘입구가 열려 있는’으로 풀어 번역했습니다.
- source_word: צָמִיד פָּתִיל
  english_pob_choice: a tied cover
  chosen_korean: 묶어 둔 덮개
  alternatives_korean:
  - 묶인 덮개
  - 단단히 고정한 뚜껑
  - 봉한 덮개
  lexicon: HALOT
  rationale: 히브리어 표현은 묶어서 고정한 덮개를 가리키므로, 정확한 결속의 이미지를 살리되 기계적으로 ‘끈으로 묶인’처럼 좁히지 않기 위해 ‘묶어 둔 덮개’로 옮겼습니다.
- source_word: טָמֵא
  english_pob_choice: unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정합니다
  - 부정한 것입니다
  - 부정합니다
  lexicon: HALOT
  rationale: 본문은 성결 상태를 서술하므로, 전통적 교회어인 ‘부정하다’를 사용해 원문의 규례 용법을 직접 반영했습니다.
theological_decisions:
- issue: 부정/정결 용어의 직역 여부
  chosen_reading: ‘unclean’을 설명어 없이 ‘부정합니다’로 옮겼습니다.
  alternative_readings:
  - 정결하지 않습니다
  - 의식적으로 부정합니다
  rationale: 히브리어는 단순히 상태를 선언할 뿐이므로, 본문에 없는 설명을 덧붙이지 않고 규례 언어 자체를 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve source-level cultic categories without expansion.'
