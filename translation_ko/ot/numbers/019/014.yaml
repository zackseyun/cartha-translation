  source_fidelity: 히브리어의 사례법 도입(“이것이 율법입니다”), 일반적 단수 אָדָם(“사람이”), 첫 번째 부정형 ‘장막’과 뒤의 지시적 ‘그 장막’의 관계, 그리고 칠 일간의 의례적 부정 규정을 충실히 옮겼습니다. ‘장막에 있는 모든 사람’은 문맥상 가능한 해석이며, 넓은 지시 범위의 가능성은 각주로 보완했습니다.
  naturalness: 현대 표준 한국어의 합쇼체 법문으로 자연스럽습니다. “사람이 장막에서 죽으면”과 “부정합니다”는 간결하면서도 규정문에 알맞습니다.
  terminology: ‘율법’, ‘장막’, ‘부정’은 민수기 정결 규례의 어휘와 문체에 적절합니다. ‘부정’은 도덕적 비난이 아니라 의례적 상태를 가리키는 문맥에서 안정적으로 사용되었습니다.
