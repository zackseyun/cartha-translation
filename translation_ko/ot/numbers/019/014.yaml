id: NUM.19.14
reference: Numbers 19:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
  footnotes:
  - marker: a
    text: Or 'everyone/everything that is in the tent.' The Hebrew expression can be broader, but the context and singular verb here favor reference to persons present; vessels are addressed explicitly in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 율법입니다. 사람이 장막에서 죽으면, 장막으로 들어가는 모든 사람과 장막에 있는 모든 사람은 칠 일 동안 부정합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자 그대로 ‘장막 안에 있는 모든 것’을 넓게 가리킬 수 있지만, 여기서는 사람을 가리키는 뜻이 더 자연스럽고, 다음 절에서 그릇들을 따로 다룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  english_pob_choice: This is the law
  chosen_korean: 이것이 율법입니다
  alternatives_korean:
  - 이것이 법입니다
  - 이것이 규례입니다
  - 이것이 지침입니다
  lexicon: WLC / HALOT
  rationale: תּוֹרָה는 여기서 시신 접촉에 관한 규정 서두로 쓰이므로, 한국어에서는 법적·의례적 구속력을 드러내는 '율법'이 가장 자연스럽습니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 남자가
  - 어떤 사람이
  - 인간이
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם은 여기서 일반적인 사람을 가리키므로, 성별을 과도하게 강조하지 않는 '사람'으로 옮기되 보편적 상황법의 성격을 살렸습니다.
- source_word: בְּאֹהֶל / הָאֹהֶל
  english_pob_choice: in a tent / the tent
  chosen_korean: 장막에서 / 장막으로
  alternatives_korean:
  - 천막에서 / 그 천막으로
  - 텐트에서 / 텐트 안으로
  lexicon: HALOT
  rationale: 성막 맥락이 아닌 일반 장례·거주 공간의 표현이므로, 성경적이면서도 한국어에서 자연스러운 '장막'을 사용했습니다. 첫 번째는 부정, 뒤의 두 항목은 앞의 장막을 가리키는 정관적 표현으로 처리했습니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정하다고 여겨집니다
  - 부정됩니다
  lexicon: HALOT
  rationale: 의례적 불결 상태를 나타내는 법문맥이므로 '부정하다' 계열을 유지했고, 합쇼체 법령 문체에 맞게 서술형 현재로 옮겼습니다.
theological_decisions:
- issue: 정결/부정 규정의 법문체를 어떻게 한국어에서 드러낼 것인가
  chosen_reading: ‘율법입니다’와 ‘부정합니다’로 옮겨, 규정의 권위와 의례적 상태를 함께 분명히 했습니다.
  alternative_readings:
  - ‘지침입니다’로 완화하기
  - ‘부정하게 됩니다’로 상태 변화를 강조하기
  rationale: 본문은 사례법 형태의 규정이므로, 단순한 설명보다 구속력 있는 법문으로 들리도록 번역하는 편이 원문 기능에 가깝습니다.
  doctrine_reference: 민수기 19장의 정결법맥락, 레위기/민수기의 의례적 부정 개념
