base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
  footnotes:
  - marker: a
    text: Or 'before the tent of meeting.' The Hebrew phrase indicates orientation toward the front of the tent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 엘르아살 제사장은 그 피의 일부를 자기 손가락으로 받아, 회막 앞쪽을 향해 그 피의 일부를 일곱 번 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회막 앞에서’. 히브리어 표현은 회막 앞쪽을 향하는 방향을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: Then ... shall take
  chosen_korean: 그때 ... 해야 합니다
  alternatives_korean:
  - 그리고 ... shall take
  - 그리고 ... 취해야 합니다
  lexicon: HALOT
  rationale: 의례 지시문의 연속 동작을 한국어에서는 자연스럽게 절차적 미래/명령형으로 옮기는 것이 적절합니다.
- source_word: בְּאֶצְבָּעוֹ
  english_pob_choice: with his finger
  chosen_korean: 손가락에 찍어
  alternatives_korean:
  - 손가락으로
  - 손가락에
  lexicon: HALOT
  rationale: 히브리어는 제사장이 피를 손가락에 묻혀 사용하는 동작을 가리키므로, 한국어에서는 ‘찍어’가 실제 의례 동작을 가장 분명하게 드러냅니다.
- source_word: וְהִזָּה
  english_pob_choice: and sprinkle
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 뿌려야 합니다
  - 뿌리게 됩니다
  lexicon: HALOT
  rationale: 제사장적 정결 의례의 기술어로서 ‘sprinkle’에 해당하는 ‘뿌리다’가 가장 직접적입니다.
- source_word: אֶל נֹכַח פְּנֵי אֹהֶל מוֹעֵד
  english_pob_choice: toward the front of the tent of meeting
  chosen_korean: 회막 앞을 향하여
  alternatives_korean:
  - 회막 앞쪽을 향하여
  - 회막 맞은편을 향하여
  lexicon: HALOT
  rationale: 문구는 회막 내부가 아니라 그 앞면을 향한 방향성을 나타내므로, ‘앞을 향하여’가 공간적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 제의적 방향성의 표현
  chosen_reading: ‘회막 앞을 향하여’로 번역해, 행위가 회막 앞면 방향으로 수행됨을 드러냈습니다.
  alternative_readings:
  - ‘회막 앞에서’
  - ‘회막 앞에’
  rationale: 히브리어는 단순한 위치보다 방향성을 강조하므로, 전통적 ‘앞에서’보다 ‘앞을 향하여’가 원문의 의미를 더 정확히 반영합니다.
  doctrine_reference: 제사 의례의 정확한 수행을 중시하는 본문 문맥
- issue: 피의 반복 강조
  chosen_reading: 원문 반복에 따라 ‘그 피’를 두 번 유지했습니다.
  alternative_readings:
  - 뒤의 중복을 생략함
  rationale: 혈액이 이 의례의 핵심 매개이므로, 반복을 줄이지 않고 유지해 의례적 초점을 보존했습니다.
  doctrine_reference: 민수기 19장의 정결 예식 문맥
