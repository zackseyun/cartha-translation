    issue: ‘부정하여 더러운 자’라는 중복·비문적 표현
    rationale: 원문은 단순히 ‘부정한 사람’이며, ‘더러운’을 덧붙이면 의례적 부정의 범주를 불필요하게 물리적 또는 도덕적 더러움으로 오해하게 할 수 있습니다.
