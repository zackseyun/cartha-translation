  source_fidelity: 초안은 접촉으로 인한 의례적 부정의 전파와 ‘저녁까지’라는 시간 한계를 대체로 반영합니다. 그러나 ‘누군가 부정하여 더러운 자’는 히브리어 הַטָּמֵא(의례적으로 부정한 사람)를 부자연스럽고 중복되게 풀어 의미를 흐립니다. ‘더러운’은 도덕적·위생적 뉘앙스를 더할 수 있으므로 피하는 것이 적절합니다.
  naturalness: ‘누군가 부정하여 더러운 자가 만진 것은 다’는 현대 표준 한국어 문장으로 매우 어색합니다. 관계절을 ‘부정한 사람이 만지는 모든 것’으로 정리하고, 합쇼체의 법규적 미래 표현을 사용하면 자연스럽습니다.
  terminology: טמא 계열은 도덕적 잘못을 뜻하지 않는 의례적 상태이므로, 한국어 성서 용례에도 맞는 ‘부정한/부정하게 되다’를 일관되게 사용합니다. נֶפֶשׁ는 여기서 ‘사람’으로 옮기는 것이 적절합니다.
  issues:
