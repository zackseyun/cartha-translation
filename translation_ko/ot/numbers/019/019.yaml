  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
  footnotes:
  - marker: a
    text: Or 'and he shall cleanse him'; the Hebrew verb here is the same root often associated with sin/purification language, but in this context it refers to ritual purification from impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 깨끗한 사람이 셋째 날과 일곱째 날에 그 물을 부정한 사람에게 뿌려야 합니다. 그렇게 하여 그는 일곱째 날에 그를 깨끗하게 해야 합니다[a]. 그런 다음 그는 자기 옷을 빨고 물에 몸을 씻어야 하며, 저녁이 되면 깨끗해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 정결하게 해야 합니다’; 히브리어 동사는 죄/정결과 관련된 같은 어근이지만, 여기서는 부정에서의 의례적 정결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  english_pob_choice: shall sprinkle
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 뿌려야 합니다
  - 살포해야 합니다
  - 뿌립니다
  lexicon: HALOT
  rationale: 의례적 정결 예식에서 액체를 적용하는 동작이므로, 현대 한국어로는 ‘뿌리다’가 가장 직접적이고 자연스럽습니다.
- source_word: הַטָּהֹר / הַטָּמֵא
  english_pob_choice: the clean person / the unclean person
  chosen_korean: 그 깨끗한 사람 / 부정한 사람
  alternatives_korean:
  - 정결한 사람 / 부정한 사람
  - 깨끗한 사람 / 더러운 사람
  lexicon: HALOT
  rationale: 본문은 의식적 정결/부정을 말하므로 ‘깨끗한/부정한’으로 옮겨 독자가 법문 맥락을 바로 이해하게 했습니다.
- source_word: וְחִטְּאֹו
  english_pob_choice: thus he shall purify him
  chosen_korean: 그를 깨끗하게 해야 합니다
  alternatives_korean:
  - 그를 정결하게 해야 합니다
  - 그를 정화해야 합니다
  - 그를 죄에서 깨끗하게 해야 합니다
  lexicon: HALOT
  rationale: חטא의 여기서의 용법은 죄 사함이 아니라 의례적 정결이므로, MORAL/atonement 뉘앙스를 피하고 결과 상태를 드러내는 표현으로 옮겼습니다.
- source_word: בָּעָרֶב
  english_pob_choice: at evening
  chosen_korean: 저녁이 되면
  alternatives_korean:
  - 저녁에
  - 해 질 무렵에는
  lexicon: HALOT
  rationale: 법문에서 정결 회복 시점을 자연스러운 현대어로 표시하되, 시간 경계를 분명히 하기 위해 ‘되면’을 사용했습니다.
theological_decisions:
- issue: וְחִטְּאֹו의 의미를 죄/속죄로 볼지 정결로 볼지
  chosen_reading: 의례적 정결로 읽고 ‘깨끗하게 하다’로 옮김
  alternative_readings:
  - 죄를 씻다
  - 속죄하다
  rationale: 문맥이 시체 부정과 정결수 예식이므로, 본문이 말하는 것은 도덕적 죄책의 제거가 아니라 예식적 정결 회복입니다.
  doctrine_reference: 본문 문맥 우선 원칙; 의례 정결과 속죄를 구분하는 번역 방침
