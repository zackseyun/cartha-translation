  source_fidelity: 전반적으로 히브리어의 의례적 정결 문맥과 셋째 날·일곱째 날의 순서를 충실히 반영합니다. 그러나 마지막 세 동작(옷을 빨고, 물로 몸을 씻고, 저녁에 정결하게 됨)은 문맥상 정결 예식을 받는 부정한 사람에게 귀속됨을 한국어에서 밝혀야 합니다. 현재의 연속된 ‘그는’은 이를 앞의 정결한 사람으로 읽게 할 수 있습니다.
  naturalness: ‘깨끗한 사람’은 일상적 청결을 뜻하기 쉬우므로, 의례 법문에서는 ‘정결한 사람’이 ‘부정한 사람’과 짝을 이루며 더 자연스럽고 정확합니다. 또한 ‘그 물’은 선행사가 없는 단독 절에서 다소 불분명하므로 ‘그 물’을 유지하되 의례 맥락을 반영한 용어 선택으로 문장을 정돈했습니다.
  terminology: טָהוֹר/טָמֵא에는 ‘정결한/부정한’을 사용하고, חִטְּאוֹ에는 도덕적 죄 사함이 아닌 의례적 정결을 나타내는 ‘정결하게 해야 합니다’를 사용했습니다. 각주도 이 구별을 명확히 하도록 다듬었습니다.
