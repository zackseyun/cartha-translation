base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
  footnotes:
  - marker: a
    text: Or 'and he shall cleanse him'; the Hebrew verb here is the same root often associated with sin/purification language, but in this context it refers to ritual purification from impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 정결한 사람이 셋째 날과 일곱째 날에 그 물을 부정한 사람에게 뿌려야 합니다. 이렇게 하여 그는 일곱째 날에 그를 정결하게 해야 합니다[a]. 그 부정한 사람은 자기 옷을 빨고 물로 몸을 씻어야 하며, 저녁이 되면 정결하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 깨끗하게 해야 합니다’. 히브리어 동사는 죄와 관련된 어근에서 왔지만, 여기서는 도덕적 죄가 아니라 부정에서 벗어나게 하는 의례적 정결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
