revisions:
- from: 그 깨끗한 사람이 셋째 날과 일곱째 날에 그 물을 부정한 사람에게 뿌려야 합니다. 그렇게 하여 그는 일곱째 날에 그를 깨끗하게 해야 합니다[a]. 그런 다음 그는 자기 옷을 빨고 물에 몸을 씻어야 하며, 저녁이 되면 깨끗해집니다.
  to: 정결한 사람이 셋째 날과 일곱째 날에 그 물을 부정한 사람에게 뿌려야 합니다. 이렇게 하여 그는 일곱째 날에 그를 정결하게 해야 합니다[a]. 그 부정한 사람은 자기 옷을 빨고 물로 몸을 씻어야 하며, 저녁이 되면 정결하게 됩니다.
  rationale: 의례적 정결 용어를 ‘정결한/부정한’으로 통일하고, 마지막 절의 행위와 정결 회복이 부정했던 사람에게 해당함을 명시했습니다. 이는 히브리어의 문맥상 주어 전환을 한국어에서 자연스럽게 드러내는 것이며, 의미를 추가하거나 교리적으로 해석하지 않습니다. ‘그 물’은 앞 문맥에서 정결 예식에 쓰이는 물을 가리키는 생략된 목적어를 보충한 기존 번역 방침을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:54Z'
