revisions:
- from: 부정한 사람을 위하여는 불태운 속죄제물의 재에서 얼마를 가져다가, 생수를 그 위에 한 그릇에 담아 두어야 합니다.[a][b]
  to: 부정한 사람을 위해, 그들은 불태운 정결 제물의 가루를 조금 가져다가 그 가루 위에 살아 있는 물을 그릇에 부어야 합니다.[a][b]
  rationale: 원문의 가루(עָפָר), 정결 제물(חטאת), 살아 있는 물(מַיִם חַיִּים)을 본문에서 최대한 보존했습니다. ‘그 가루 위에 … 그릇에 부어야 합니다’는 물이 가루 위에 놓이고 그릇 안에 담기는 원문의 절차를 한국어로 자연스럽게 나타냅니다. 단수 동사는 한국어 법규적 지시문에서 자연스러운 복수 주어로 처리했으며, 행위자의 신원은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:52Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘재’는 히브리어 עָפָר(먼지·가루)를 좁혀 옮긴 표현이고, ‘한 그릇에 담아 두어야 합니다’는 물을 재 위에 두는 동작과 그릇 안으로 넣는 방향을 어색하게 결합합니다. 또한 חטאת는 이 정결 규례의 기능을 따라 ‘정결 제물’로 옮기는 것이 영어 POB의 ‘purification offering’ 및 원문 문맥에 더 가깝습니다.
  naturalness: ‘부정한 사람을 위하여는’과 ‘생수를 그 위에 한 그릇에 담아 두어야 합니다’는 현대 표준어 합쇼체로 매끄럽지 않습니다. ‘부정한 사람을 위해’ 및 ‘그 가루 위에 생수를 그릇에 부어야 합니다’로 하면 절차와 문장 구조가 자연스럽습니다.
  terminology: ‘부정한 사람’은 의례적 부정 상태를 적절히 나타냅니다. מַיִם חַיִּים은 문자성을 보존하여 ‘살아 있는 물’로 옮기고, 그 의미를 각주에서 신선하거나 흐르는 물이라고 설명합니다. עָפָר는 본문에서 ‘가루’로 옮기며 ‘재’라는 전통적 해석은 각주에 남깁니다.
  issues:
  - severity: medium
    issue: עָפָר를 본문에서 ‘재’로 단정함
    rationale: 원문은 통상적인 ‘재’ 어휘가 아니라 먼지·가루를 뜻합니다. 제의 문맥상 재로 이해될 수 있으나, 본문은 ‘가루’로 보존하고 전통적 ‘재’는 각주로 처리하는 편이 안전합니다.
  - severity: medium
    issue: חטאת를 ‘속죄제물’로 번역함
    rationale: 이 구절의 의례적 기능은 죄책의 속죄보다 부정의 정결에 있으므로 ‘정결 제물’이 원문의 문맥적 의미와 영어 POB의 선택을 더 잘 반영합니다.
  - severity: medium
    issue: 물과 그릇의 동작 표현이 부자연스럽고 관계가 불명확함
    rationale: 원문은 가루 위에 살아 있는 물을, 그릇 안으로 두는 절차를 말합니다. ‘그 가루 위에 생수를 그릇에 담아 두다’는 한국어에서 수식 관계와 동작이 불분명합니다.
