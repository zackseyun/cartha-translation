id: NUM.19.17
reference: Numbers 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the ashes from the burning of the sin offering.' The Hebrew uses 'dust' and the noun חטאת, which in priestly contexts can mean either 'sin offering' or, functionally, 'purification offering.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'living water'; that is, fresh or flowing water.
    reason: lexical_alternative
translation:
  language: ko
  text: 부정한 사람을 위하여는 불태운 속죄제물의 재에서 얼마를 가져다가, 생수를 그 위에 한 그릇에 담아 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘먼지’(또는 가루状 물질)입니다. 전통적으로는 ‘재’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘살아 있는 물’입니다. 곧 신선하거나 흐르는 물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַטָּמֵא
  english_pob_choice: for the unclean person
  chosen_korean: 부정한 사람을 위하여
  alternatives_korean:
  - 불결한 사람을 위하여
  - 정결하지 않은 사람을 위하여
  lexicon: HALOT
  rationale: 정결 규례 문맥에서는 ritual uncleanness를 뜻하므로 ‘부정한 사람’이 가장 직접적이고 표준적인 대응입니다.
- source_word: מֵעֲפַר
  english_pob_choice: some of the dust
  chosen_korean: …재에서 얼마를
  alternatives_korean:
  - …먼지에서 얼마를
  - …재가루에서 얼마를
  lexicon: HALOT
  rationale: 히브리어는 ‘재’가 아니라 ‘먼지/가루状 물질’에 가까운 어휘지만, 바로 뒤의 ‘불태운…’과 결합된 제의적 맥락에서는 한국어로 ‘재’가 자연스럽고 의미를 잘 전달합니다.
- source_word: הַחַטָּאת
  english_pob_choice: the purification offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 정결제물
  - 속죄제
  lexicon: HALOT
  rationale: POB 영어는 기능상 ‘purification offering’을 택했지만, 한국어에서는 이 제의가 정결 회복과 관련됨을 드러내면서도 제의적 용어를 살리기 위해 ‘속죄제물’로 옮겼습니다.
- source_word: מַיִם חַיִּים
  english_pob_choice: living water
  chosen_korean: 생수
  alternatives_korean:
  - 살아 있는 물
  - 흐르는 물
  lexicon: HALOT
  rationale: 직역하면 ‘살아 있는 물’이지만, 한국어 제의 문맥에서는 ‘생수’가 간결하면서도 ‘살아 있고 흐르는 물’이라는 관용적 뜻을 전달합니다.
- source_word: אֶל כֶּלִי
  english_pob_choice: in a vessel
  chosen_korean: 한 그릇에 담아 두어야 합니다
  alternatives_korean:
  - 한 그릇 안에
  - 그릇에 넣어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 ‘~로/안에’는 결과 상태를 나타내므로, 한국어에서는 ‘담아 두어야 합니다’로 풀어 제의 절차를 자연스럽게 표현했습니다.
theological_decisions:
- issue: חטאת의 번역을 ‘속죄제물’로 할지 ‘정결제물’로 할지
  chosen_reading: 속죄제물
  alternative_readings:
  - 정결제물
  - 속죄제
  rationale: 이 제의는 실제로 부정에서의 정화 기능을 가지지만, 한국어 성경 독자에게는 ‘속죄제물’이 제의적 연속성을 가장 잘 전달합니다. 다만 본문의 기능적 초점은 정결 회복에 있습니다.
  doctrine_reference: 민수기 19장 정결 규례, 제의 용어의 기능적 번역 원칙
- issue: מַיִם חַיִּים의 표현을 ‘생수’로 압축할지 ‘살아 있는 물’로 풀지
  chosen_reading: 생수
  alternative_readings:
  - 살아 있는 물
  - 흐르는 물
  rationale: 문자적 이미지보다 규례상 요구되는 물의 성격을 자연스럽게 전달하는 쪽을 택했습니다. 다만 물의 ‘살아 있음/흐름’이라는 원뜻은 한국어 관용 ‘생수’가 상당 부분 보존합니다.
  doctrine_reference: 번역 철학 §6, 제의 절차 문맥
