review_pass:
  verdict: revise
  source_fidelity: 초안은 הַכֹּהֵן을 ‘제사’로, 절차적 서술을 명령형 ‘던지라’로 옮겨 주어와 문법적 기능이 달라졌습니다. 또한 עֵץ אֶרֶז, אֵזוֹב, שְׁנִי תוֹלָעַת, שְׂרֵפַת הַפָּרָה의 번역이 원문의 의미를 충분히 반영하지 못합니다. 개정문은 제사장이 백향목 나무, 우슬초, 주홍색 실을 암소를 태우는 불의 한가운데에 던지는 절차를 충실히 반영합니다.
  naturalness: ‘제사장은 … 던져야 합니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 의례 규정의 순차적·규범적 성격을 잘 드러냅니다. ‘암소를 태우는 불 가운데에’는 ‘소의 불사른 것 가운데’보다 명료하면서도 שְׂרֵפָה가 단순한 재가 아니라 태우는 과정임을 보존합니다.
  terminology: כֹּהֵן은 의례 문맥에서 ‘제사장’, עֵץ אֶרֶז은 ‘백향목 나무’, אֵזוֹב은 통용 성서 용어인 ‘우슬초’, שְׁנִי תוֹלָעַת은 ‘주홍색 실’로 옮겼습니다. פָּרָה는 본문에서 포괄적인 ‘암소’로 번역하고, 전통적 ‘암송아지’는 각주로 제시하여 어휘상 가능성을 보존합니다.
  issues:
  - severity: high
    issue: ‘제사’는 הַכֹּהֵן(그 제사장)의 잘못된 번역입니다.
    rationale: 행위 주체는 제의 자체가 아니라 제사장입니다.
  - severity: high
    issue: ‘던지라’는 명령형이며 합쇼체도 아닙니다.
    rationale: 히브리어 waw+qatal은 이 의례 규정의 순차적 절차를 나타내므로, 현대 한국어에서는 ‘던져야 합니다’가 적절합니다.
  - severity: medium
    issue: ‘방풍초’는 אֵזוֹב의 통용 성서 번역을 벗어납니다.
    rationale: 식물의 정확한 동정에는 논란이 있으나, 한국어 성서 용례와 영어 감사본의 ‘hyssop’에 맞추어 ‘우슬초’를 사용하는 것이 안전합니다.
  - severity: medium
    issue: ‘소의 불사른 것’은 שְׂרֵפַת הַפָּרָה를 부자연스럽고 불명확하게 처리합니다.
    rationale: 원문은 암소를 태우는 과정/불 속 한가운데를 가리킵니다.
  revised_text: 그때 제사장은 백향목 나무와 우슬초와 주홍색 실을 가져다가 그 암소를 태우는 불 가운데에 던져야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘암송아지’.
    reason: alternative_reading
  revision_rationale: 주어, 동사 형식, 의례 물품 및 태우는 행위의 표현을 원문에 맞게 바로잡고, 현대 표준 한국어 합쇼체로 다듬었습니다. פָּרָה의 전통적 번역 가능성은 본문의 ‘암소’를 유지한 채 각주로 보존했습니다.
