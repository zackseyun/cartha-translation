revisions:
- from: '이것은 여호와께서 명령하신 율법의 규례입니다. 말씀하십시오: 이스라엘 자손에게 말하여, 흠이 없고, 몸에 흠결이 없으며, 아직 멍에를 메어 본 적이 없는 붉은 암송아지를 당신에게로 가져오게 하십시오.[a][b]'
  to: 이것은 여호와께서 명령하여 말씀하신 율법의 규례입니다.[a] 이스라엘 자손에게 말하여, 그들이 온전하고 아무 결함도 없으며 멍에를 메어 본 적이 없는 붉은 암송아지를 당신에게 가져오게 하십시오.[b]
  rationale: 인용 도입부를 원문의 문법과 한국어 합쇼체에 맞게 바로잡고, 암송아지의 제의적 적격성을 나타내는 두 병렬 표현을 의미상 구별하여 보존했습니다. 멍에가 ‘올라간’ 적 없다는 뜻은 자연스러운 한국어로 ‘멍에를 메어 본 적이 없는’으로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:51Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. לֵאמֹר는 여호와의 명령을 도입하는 ‘이르시되/말씀하시되’이지 독립된 ‘말씀하십시오’ 명령이 아닙니다. 또한 תְּמִימָה와 אֵין בָּהּ מוּם은 관련된 제의적 적격성을 중첩하여 말하지만, 전자는 ‘온전한’, 후자는 ‘아무 결함도 없는’으로 구별해 보존하는 편이 원문에 더 충실합니다.
  naturalness: '초안의 ‘말씀하십시오: 이스라엘 자손에게 말하여’는 인용 도입과 명령이 혼동되어 현대 한국어 문장으로도 어색합니다. ‘여호와께서 명령하여 말씀하셨습니다: …’로 고치면 합쇼체를 유지하면서 명령 연쇄가 자연스럽습니다.'
  terminology: ‘율법의 규례’, ‘여호와’, ‘붉은 암송아지’, ‘멍에’는 유지할 수 있습니다. תְּמִימָה는 ‘온전한’으로, מוּם은 ‘아무 결함도 없는’으로 옮겨 두 표현의 어휘적 구별과 병렬을 살렸습니다.
  issues:
  - severity: high
    issue: לֵאמֹר의 번역 오류
    rationale: ‘말씀하십시오’는 하나님께 드리는 새로운 명령처럼 읽히나, 원문은 앞선 ‘명령하셨다’를 이어 주며 뒤의 직접 인용을 도입하는 분사입니다.
  - severity: medium
    issue: 제의적 적격성의 두 표현이 불명확하게 중복됨
    rationale: ‘흠이 없고, 몸에 흠결이 없으며’는 한국어에서 거의 동의 반복으로 들립니다. תְּמִימָה의 ‘온전함’과 מוּם의 ‘결함 없음’을 구별하면 원문의 중첩을 보존하면서도 더 명료합니다.
  - severity: low
    issue: ‘아직’의 추가
    rationale: ‘아직 멍에를 메어 본 적이 없는’의 ‘아직’은 원문에 없는 시간적 뉘앙스를 더합니다. 단순히 멍에가 올라간 적이 없다고 하는 편이 정확합니다.
