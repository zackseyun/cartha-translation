source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: ko
  text: 이것은 여호와께서 명령하여 말씀하신 율법의 규례입니다.[a] 이스라엘 자손에게 말하여, 그들이 온전하고 아무 결함도 없으며 멍에를 메어 본 적이 없는 붉은 암송아지를 당신에게 가져오게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יהוה는 이스라엘의 하나님을 가리키는 고유한 언약 이름입니다.
    reason: source_note
  - marker: b
    text: ‘온전하고 아무 결함도 없는’은 원문의 두 표현을 옮긴 것입니다. 앞말은 제물의 온전함을, 뒷말은 신체적 결함이 없음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  english_pob_choice: statute of the law
  chosen_korean: 율법의 규례
  alternatives_korean:
  - 법의 규례
  - 율법의 법규
  lexicon: חֻקָּה / תּוֹרָה
  rationale: תּוֹרָה를 일반적 '법'보다 프로젝트 기본값인 '율법'으로, חֻקַּת은 관례적 법조문 느낌을 살려 '규례'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: יהוה
  rationale: 본문의 사전적 대화음성보다 한국 교회 독자에게 더 즉시 인지되는 표기를 택했으며, 이 절은 직접적인 야훼 명칭보다 규정문의 도입이어서 전통 표기를 허용했습니다.
- source_word: תְּמִימָה
  english_pob_choice: whole
  chosen_korean: 흠이 없는
  alternatives_korean:
  - 온전한
  - 완전한
  - 결함 없는
  lexicon: תָּמִים
  rationale: POB가 'without blemish'를 'whole'로 되돌린 것은 제의적 온전함을 뜻하므로, 제물 문맥에 맞게 '흠이 없는'으로 풀어 자연스럽게 처리했습니다.
- source_word: אֵין בָּהּ מוּם
  english_pob_choice: in which there is no defect
  chosen_korean: 몸에 흠결이 없으며
  alternatives_korean:
  - 결함이 없으며
  - 흠이 없으며
  - 아무 흠도 없으며
  lexicon: מוּם
  rationale: 동일 대목의 중복 표현을 한국어에서 과도한 반복 없이 살리기 위해 제의적 결함 금지를 '몸에 흠결이 없다'로 구체화했습니다.
- source_word: עֹל
  english_pob_choice: yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 족쇄
  - 짐틀
  - 멍에
  lexicon: עֹל
  rationale: 짐을 메는 도구로서의 문자적 의미를 그대로 살리는 표준어 '멍에'를 유지했습니다.
theological_decisions:
- issue: 제의적 적격성의 표현
  chosen_reading: 붉은 암송아지를 의례적으로 온전하고 아무 사용도 하지 않은 제물로 제시합니다.
  alternative_readings:
  - 단순히 외형상 예쁜 암송아지로 읽는 해석
  - 도덕적 완전성으로 확대하는 읽기
  rationale: 본문의 관심은 윤리적 성격이 아니라 희생 제물의 제의적 자격이므로, '흠이 없음'과 '멍에를 메어 본 적 없음'을 함께 유지했습니다.
  doctrine_reference: 민수기 19장의 정결례 문맥
- issue: 명령문 연쇄의 화자
  chosen_reading: '''말씀하십시오''와 뒤따르는 명령형을 그대로 살려, 규정 전달의 권위 구조를 드러냈습니다.'
  alternative_readings:
  - 완곡한 전달문으로 바꾸는 것
  - 서술형으로 풀어 쓰는 것
  rationale: 히브리어의 명령 연쇄가 규정 전달의 긴박함과 공적 권위를 가지므로 이를 약화하지 않았습니다.
  doctrine_reference: 언약 백성에게 주어지는 제의 규정
