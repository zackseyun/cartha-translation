id: NUM.19.3
reference: Numbers 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
  footnotes:
  - marker: a
    text: Or, 'and he shall slaughter it before him,' if the implicit subject is taken to remain Eleazar throughout the clause.
    reason: alternative_reading
  - marker: b
    text: The Hebrew feminine pronoun refers to the red heifer; English uses 'it' idiomatically for the animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그것을 제사장 엘르아살에게 주고, 그는 그것을 진영 밖으로 끌어내어, 그의 앞에서 그것을 도살해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엘르아살이 직접 도살하는 것으로 볼 수도 있습니다. 히브리어는 이 절에서 도살 행위자의 주어를 명시하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘진영 밖으로’는 정결 규례에서 제의적 격리를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְתַתֶּם
  english_pob_choice: You shall give
  chosen_korean: 너희는 그것을 ... 주고
  alternatives_korean:
  - 너희는 그것을 ... 드리고
  - 너희는 그것을 ... 넘기고
  lexicon: WLC/HALOT
  rationale: 법규 문맥의 명령형 미래를 한국어 합쇼체 지시문으로 옮기되, 단순 전달의 의미를 살려 ‘주고’로 렌더링했습니다.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  english_pob_choice: to Eleazar the priest
  chosen_korean: 제사장 엘르아살에게
  alternatives_korean:
  - 엘르아살 제사장에게
  - 엘르아살을 제사장에게
  lexicon: WLC/HALOT
  rationale: 인명은 음역하고, 직함은 ‘제사장’으로 옮겨 원문의 신분 표지를 자연스럽게 반영했습니다.
- source_word: וְהוֹצִיא ... אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: and he shall bring it outside the camp
  chosen_korean: 그는 그것을 진영 밖으로 끌어내어
  alternatives_korean:
  - 그는 그것을 진영 밖으로 데리고 나가
  - 그는 그것을 진영 밖으로 끌고 나가
  lexicon: WLC/HALOT
  rationale: הוציא의 사역적 의미를 ‘끌어내어’로 살려, 제의적 이동과 분리의 강한 동작을 드러냈습니다.
- source_word: וְשָׁחַט
  english_pob_choice: and it shall be slaughtered before him
  chosen_korean: 그의 앞에서 그것을 도살해야 합니다
  alternatives_korean:
  - 그 앞에서 그것이 도살되어야 합니다
  - 그의 앞에서 그것을 잡아야 합니다
  lexicon: WLC/HALOT
  rationale: 히브리어가 주어를 분명히 밝히지 않으므로, 영어 POB의 문서화된 긴장을 따라 행위자를 특정하지 않고 수동적 성격을 드러냈습니다. 제의 문맥상 ‘도살하다’가 ‘잡다’보다 정확합니다.
theological_decisions:
- issue: 도살 행위자의 불확정성
  chosen_reading: 본문은 엘르아살의 감독 아래 도살이 이루어지지만, 엘르아살이 직접 도살하는지까지는 단정하지 않았습니다.
  alternative_readings:
  - 엘르아살이 그것을 그의 앞에서 도살해야 합니다
  rationale: 히브리어의 생략된 3인칭 단수 주어는 문맥상 엘르아살로 이어질 수 있으나, ‘그의 앞에서’는 감독 위치를 더 자연스럽게 드러냅니다. 따라서 행위자 불확정성을 보존했습니다.
  doctrine_reference: 원문이 허용하는 해석의 폭을 유지하고, 불필요한 확정 해석을 피함
