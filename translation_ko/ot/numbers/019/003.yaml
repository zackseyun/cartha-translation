  lexicon: WLC/HALOT
  rationale: 히브리어가 주어를 분명히 밝히지 않으므로, 영어 POB의 문서화된 긴장을 따라 행위자를 특정하지 않고 수동적 성격을 드러냈습니다. 제의 문맥상 ‘도살하다’가 ‘잡다’보다 정확합니다.
theological_decisions:
- issue: 도살 행위자의 불확정성
  chosen_reading: 본문은 엘르아살의 감독 아래 도살이 이루어지지만, 엘르아살이 직접 도살하는지까지는 단정하지 않았습니다.
  alternative_readings:
  - 엘르아살이 그것을 그의 앞에서 도살해야 합니다
  rationale: 히브리어의 생략된 3인칭 단수 주어는 문맥상 엘르아살로 이어질 수 있으나, ‘그의 앞에서’는 감독 위치를 더 자연스럽게 드러냅니다. 따라서 행위자 불확정성을 보존했습니다.
  doctrine_reference: 원문이 허용하는 해석의 폭을 유지하고, 불필요한 확정 해석을 피함
