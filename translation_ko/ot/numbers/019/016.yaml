id: NUM.19.16
reference: Numbers 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
  footnotes:
  - marker: a
    text: Hebrew literally, 'upon the face of the field,' an idiom meaning out in the open field.
    reason: lexical_alternative
  - marker: b
    text: Or 'a corpse' for 'a dead body.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a bone of a human/man'; here the sense is generic human remains, not specifically male.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 들판의 겉면에서 칼에 죽임을 당한 자나, 죽은 시체나, 사람의 뼈나, 무덤에 닿는 모든 사람은 이레 동안 부정하게 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  english_pob_choice: And everyone who touches
  chosen_korean: 그리고 … 닿는 모든 사람은
  alternatives_korean:
  - 그리고 … 만지는 사람은
  - 그리고 … 접촉하는 사람은
  lexicon: HALOT
  rationale: 조건을 보편적으로 적용하는 법 문체를 살리되, 한국어에서는 ‘닿다’가 부정 규정의 접촉 의미를 자연스럽게 전달합니다.
- source_word: עַל פְּנֵ֣י הַשָּׂדֶה
  english_pob_choice: in the open field
  chosen_korean: 들판의 겉면에서
  alternatives_korean:
  - 들판에서
  - 들판 한가운데서
  - 벌판에서
  lexicon: HALOT
  rationale: 직역하면 ‘들판의 얼굴 위’이지만, 관용적으로 ‘노천/야외’의 뜻이므로 ‘들판의 겉면에서’로 옮겨 원뜻을 드러냈습니다.
- source_word: בַּחֲלַל חֶרֶב
  english_pob_choice: one slain by the sword
  chosen_korean: 칼에 죽임을 당한 자
  alternatives_korean:
  - 칼에 죽은 자
  - 칼에 찔려 죽은 자
  - 칼에 쓰러진 자
  lexicon: HALOT
  rationale: חָלָל은 ‘죽임을 당한 자/전사한 자’의 뜻이 강해 단순히 ‘죽은’보다 폭력적 죽임을 분명히 했습니다.
- source_word: בְ/מֵת
  english_pob_choice: a dead body
  chosen_korean: 죽은 시체
  alternatives_korean:
  - 죽은 몸
  - 시체
  - 죽은 사람
  lexicon: HALOT
  rationale: 본문의 부정 규정 맥락에서 ‘죽은 시체’가 가장 직접적이며, POB의 ‘dead body’ 선택을 자연스러운 한국어로 반영했습니다.
- source_word: בְ/עֶצֶם אָדָם
  english_pob_choice: a human bone
  chosen_korean: 사람의 뼈
  alternatives_korean:
  - 인간의 뼈
  - 사람 뼈
  - 인자의 뼈
  lexicon: HALOT
  rationale: אָדָם을 남성 한정의 ‘남자’로 두지 않고, 유해 일반을 가리키는 문맥에 맞게 ‘사람의’로 옮겼습니다.
- source_word: בְ/קָבֶר
  english_pob_choice: a grave
  chosen_korean: 무덤
  alternatives_korean:
  - 무덤자리
  - 묘
  - 묘지
  lexicon: HALOT
  rationale: קֶבֶר는 장묘 장소를 가리키므로 가장 표준적인 한국어 ‘무덤’을 택했습니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정하게 됩니다
  alternatives_korean:
  - 부정하게 될 것입니다
  - 부정해집니다
  - 부정합니다
  lexicon: HALOT
  rationale: 율법 문맥의 의례적 불결을 한국어 성경체로 분명히 하되, 현대 독자가 이해하기 쉬운 현재형으로 옮겼습니다.
theological_decisions:
- issue: 의례적 부정의 성격
  chosen_reading: ‘부정하게 됩니다’로 의례적 불결을 표현하고, 도덕적 죄책으로 오해되지 않게 했습니다.
  alternative_readings:
  - 더럽혀집니다
  - 부정합니다
  - 불결해집니다
  rationale: 민수기 19장은 정결/부정의 제의적 범주를 다루므로, 도덕적 평가가 아니라 성막 공동체 참여를 제한하는 상태임을 유지해야 합니다.
  doctrine_reference: 민수기 19장 정결 규례의 문맥
