  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
  footnotes:
  - marker: a
    text: 'Or ''the water for cleansing from impurity''; traditionally, ''the water of separation.'' Hebrew: ''the waters of impurity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 그들에게 영원한 규례가 됩니다. 물을 뿌리는 사람은 자기 옷을 빨아야 하고[a], 부정의 물에 닿는 사람은 저녁까지 부정하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정에서 깨끗하게 하는 물’; 전통적으로는 ‘분리의 물’이라고 합니다. 히브리어는 ‘부정의 물들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - 영원한 법규
  lexicon: HALOT
  rationale: חֻקָּה는 정해진 규정, עוֹלָם은 지속성을 가리키므로, 법적·예식적 지속성을 살리면서도 현대 한국어에서 자연스러운 ‘영원한 규례’로 옮겼습니다.
- source_word: וּמַזֵּה
  english_pob_choice: the one who sprinkles
  chosen_korean: 물을 뿌리는 사람
  alternatives_korean:
  - 뿌리는 자
  - 물을 뿌리는 자
  - 뿌리는 이
  lexicon: HALOT
  rationale: 분사형이 사람을 가리키는 명사처럼 쓰였으므로, 예식 행위를 수행하는 사람으로 풀어 ‘물을 뿌리는 사람’으로 자연스럽게 옮겼습니다.
- source_word: מֵי הַנִּדָּה
  english_pob_choice: the water for impurity
  chosen_korean: 부정의 물
  alternatives_korean:
  - 부정하게 하는 물
  - 부정을 위한 물
  - 정결을 위한 물
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리면서도 의례적 부정의 범주를 드러내기 위해 ‘부정의 물’로 옮겼습니다. 전통 번역인 ‘물 떠나게 하는 물’은 주석적이며 본문 투명성이 떨어집니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정하게 됩니다
  alternatives_korean:
  - 부정해집니다
  - 부정한 사람이 됩니다
  - 부정하게 됩니다
  lexicon: HALOT
  rationale: 의례적 정결/부정 범주를 유지해야 하므로 ‘부정하다’ 계열을 사용했고, 미래·규정의 효력을 자연스럽게 나타내기 위해 ‘됩니다’로 옮겼습니다.
theological_decisions:
- issue: 례식적 부정의 범주를 어떻게 표현할 것인가
  chosen_reading: ‘부정’과 ‘부정하게 됩니다’로 일관되게 옮겨, 도덕적 죄책이 아니라 의례적 부정 상태를 가리키도록 했습니다.
  alternative_readings:
  - ‘더러워집니다’
  - ‘불결하게 됩니다’
  - ‘부정한 상태가 됩니다’
  rationale: 민수기 19장의 문맥은 죽음과 관련된 예식적 정결 규례이므로, 도덕적 의미로 오해될 수 있는 표현은 피하고 의례적 범주를 유지해야 합니다.
  doctrine_reference: Numbers 19 ritual purity legislation
