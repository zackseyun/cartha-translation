  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
  footnotes:
  - marker: a
    text: That is, with the water for impurity prepared earlier in the chapter.
    reason: cross_reference
  - marker: b
    text: Or 'cleanse himself.' The Hebrew verb here refers to undergoing ritual purification from impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제삼일과 제칠일에 그것으로[a] 자신을 정결하게 해야 하며, 그러면 정결하게 될 것입니다. 그러나 그가 제삼일과 제칠일에 자신을 정결하게 하지 않으면[b] 정결하게 되지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 이 장 앞부분에서 마련한 부정을 제거하는 물을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘자신을 깨끗하게 하다’. 히브리어 동사는 여기서 죄를 뜻하는 것이 아니라 부정에서 벗어나는 의례적 정결 과정을 가리킵니다.
    reason: lexical_alternative
