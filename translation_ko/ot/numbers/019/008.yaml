review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘그것을 태우는 자’가 옷을 물로 빨고 몸을 물로 씻으며 저녁까지 의례적으로 부정한 상태임을 말합니다. 초안은 이 의미와 의복 세탁(כבס) 및 몸 씻기(רחץ)의 구별을 대체로 충실히 반영합니다. 다만 두 의무형 동사를 한국어 합쇼체 법문으로 병렬되게 명시하는 편이 더 정확합니다.
  naturalness: ‘저녁까지 부정합니다’는 이해되지만, 규례 문맥에서는 ‘저녁까지 부정한 상태에 있습니다’가 현대 한국어에서 상태 진술로 더 자연스럽고 분명합니다. 또한 문화 주석 표지는 ‘부정’ 바로 뒤에 두어야 주석 대상이 명확합니다.
  terminology: ‘부정’은 정결 규례의 טָמֵא에 적절한 용어입니다. 주석에서 이것이 도덕적 죄책이 아닌 의례적 부정임을 밝히는 방식도 적절합니다. ‘물로’는 한국어에서 자연스러운 번역이지만, 각주에는 히브리어의 직역상 표현과 번역상의 자연스러움을 정확히 구분해야 합니다.
  issues:
  - severity: medium
    issue: 의례적 부정을 설명하는 각주 b의 표지가 본문에서 ‘몸을 물로 씻어야 합니다’ 뒤에 놓여 있습니다.
    rationale: 각주 내용은 씻는 행위가 아니라 ‘부정’의 의미를 설명합니다. 표지를 ‘부정’ 바로 뒤로 옮겨 주석의 지시 대상을 명확히 해야 합니다.
  - severity: low
    issue: 첫 번째 의무 동사 ‘빨고’가 두 번째 ‘씻어야 합니다’에만 의존하는 연결형입니다.
    rationale: 원문은 옷을 씻는 것과 몸을 씻는 것을 각각 규정합니다. ‘빨아야 하며 … 씻어야 합니다’로 병렬하면 법규적 양태가 더 명확합니다.
  - severity: low
    issue: 각주 a가 ‘물 안에서’를 단순히 자연스럽게 옮긴 것이라고만 설명합니다.
    rationale: 히브리어 בַּמַּיִם은 문자적으로 ‘그 물 안에서/물 속에서’에 가까우나, 세정 문맥에서는 한국어 ‘물로’가 자연스럽게 기능합니다. 이 차이를 밝혀야 어휘 대안 주석으로 정확합니다.
  revised_text: 그것을 태우는 자는 자기 옷을 물로 빨아야 하며, 자기 몸을 물로 씻어야 합니다[a]. 그는 저녁까지 부정한 상태에 있습니다[b].
