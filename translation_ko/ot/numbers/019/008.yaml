revisions:
- from: 그것을 태우는 자는 자기 옷을 물로 빨고, 자기 몸을 물로 씻어야 합니다[b][a]. 그리고 그는 저녁까지 부정합니다.
  to: 그것을 태우는 자는 자기 옷을 물로 빨아야 하며, 자기 몸을 물로 씻어야 합니다[a]. 그는 저녁까지 부정한 상태에 있습니다[b].
  rationale: 본문의 의미는 유지하면서, 두 세정 행위를 각각 의무형으로 명시했습니다. 의례적 부정은 상태를 나타내도록 자연스럽게 다듬었고, 각주 b를 해당 용어 뒤로 옮겼습니다. 각주 a는 히브리어의 문자적 표현과 한국어의 자연스러운 번역을 구별하여 수정했습니다.
  reviewer_model: gpt-5.6-terra
