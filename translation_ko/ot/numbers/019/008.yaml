id: NUM.19.8
reference: Numbers 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'with water' for both instances of 'in the water.' The Hebrew literally reads 'in the water.'
    reason: lexical_alternative
  - marker: b
    text: '''Unclean'' here refers to ritual impurity, not necessarily moral guilt.'
    reason: cultural_note
translation:
  language: ko
  text: 그것을 태우는 자는 자기 옷을 물로 빨고, 자기 몸을 물로 씻어야 합니다[b][a]. 그리고 그는 저녁까지 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물로’는 히브리어의 ‘물 안에서’를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘부정’은 도덕적 죄책이 아니라 의례적 부정을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף
  english_pob_choice: the one who burns
  chosen_korean: 그것을 태우는 자
  alternatives_korean:
  - 그것을 태우는 사람
  - 태우는 자
  - 불사르는 자
  lexicon: HALOT
  rationale: 분사에 정관사가 붙은 행위자를 가리키므로, 기능을 드러내면서도 법문에 어울리는 ‘~는 자’로 옮겼습니다.
- source_word: יְכַבֵּס בְּגָדָיו בַּמַּיִם
  english_pob_choice: shall wash his clothes in water
  chosen_korean: 자기 옷을 물로 빨고
  alternatives_korean:
  - 자기 옷을 물 안에서 빨고
  - 자기 옷을 물로 씻고
  - 자기 옷을 물에 빨고
  lexicon: HALOT
  rationale: כבס는 의복 세탁이므로 ‘빨다’가 가장 직접적입니다. בַּמַּיִם는 영어 POB의 ‘in water’처럼 직역하면 ‘물로/물 안에서’가 가능하지만, 한국어 법문에서는 ‘물로’가 자연스럽고 간결합니다.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמָּיִם
  english_pob_choice: and bathe his body in water
  chosen_korean: 자기 몸을 물로 씻어야 합니다
  alternatives_korean:
  - 자기 몸을 물 안에서 씻어야 합니다
  - 자기 살을 물로 씻어야 합니다
  - 몸을 물에 씻어야 합니다
  lexicon: HALOT
  rationale: רחץ는 옷을 세탁하는 כבס와 구별되는 ‘몸 씻기’이므로 ‘씻다’로 옮겼습니다. בשר는 문자적으로 ‘살’이지만 여기서는 사람의 몸을 가리키므로 ‘몸’이 더 분명합니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and he shall be unclean until the evening
  chosen_korean: 그리고 그는 저녁까지 부정합니다
  alternatives_korean:
  - 그리고 그는 저녁까지 부정합니다
  - 그리고 그는 저녁까지 부정하게 됩니다
  - 그리고 그는 저녁까지 깨끗하지 못합니다
  lexicon: HALOT
  rationale: טמא는 제사장적 정결 문맥의 의례적 부정을 가리키므로 ‘부정하다’로 직역했습니다. 현재 시제의 상태 진술을 살려 간결하게 유지했습니다.
theological_decisions:
- issue: טמא의 의미 범위
  chosen_reading: ‘부정합니다’는 도덕적 악이 아니라 의례적 부정을 뜻한다고 보았습니다.
  alternative_readings:
  - ‘부정하게 됩니다’
  - ‘더럽혀집니다’
  rationale: 문맥이 제의 규례이므로 moral guilt가 아니라 ritual impurity를 표현해야 합니다. 한국어 본문은 짧게 두되, 의미는 의례적 부정으로 이해되어야 합니다.
  doctrine_reference: 제사법/정결 규례
