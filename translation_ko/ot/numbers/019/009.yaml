revisions:
- from: 그런 다음 깨끗한 사람이 암송아지의 재를 거두어, 진영 밖의 깨끗한 곳에 두어야 합니다. 그것은 이스라엘 자손의 회중을 위해 간직해 두는 부정의 물이며, 속죄제입니다.[a][b]
  to: 그런 다음 정결한 사람이 암송아지의 재를 거두어 진영 밖의 정결한 곳에 두어야 합니다. 그 재는 이스라엘 자손의 회중을 위하여 보관하여 부정의 물[a]에 쓰게 해야 합니다. 그것은 속죄제입니다.[b]
