  source_fidelity: 수정이 필요합니다. טָהוֹר는 이 제의 문맥에서 단순한 위생적 ‘깨끗함’보다 ‘정결함’을 뜻하므로 ‘정결한’이 더 정확합니다. 또한 재 자체를 ‘부정의 물’과 동일시하지 않고, 보관된 재가 ‘부정의 물’을 위한 것이라는 לְמִשְׁמֶרֶת לְמֵי נִדָּה의 관계를 드러내야 합니다.
  naturalness: ‘정결한 사람’, ‘진영 밖의 정결한 곳’, ‘보관하여 … 쓰게 해야 합니다’는 현대 표준 한국어의 격식 있는 성경 문체에서 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두어 참조 범위를 분명히 했습니다.
  terminology: ‘이스라엘 자손의 회중’, ‘정결한’, ‘부정의 물’, ‘속죄제’를 유지했습니다. חַטָּאת의 정결/속죄 기능에 관한 대안은 각주에서 보존하며, 본문에서 교리적으로 해소하지 않았습니다.
