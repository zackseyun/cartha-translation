id: NUM.19.9
reference: Numbers 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'for purification water' or 'for water of impurity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it is a purification offering.' The Hebrew חַטָּאת can denote a sin offering and, in priestly contexts, an offering for purification.
    reason: alternative_reading
translation:
  language: ko
  text: 그런 다음 깨끗한 사람이 암송아지의 재를 거두어, 진영 밖의 깨끗한 곳에 두어야 합니다. 그것은 이스라엘 자손의 회중을 위해 간직해 두는 부정의 물이며, 속죄제입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게는 ‘정결을 위한 물’ 또는 ‘부정의 물’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 정결제물입니다.’ 히브리어 חַטָּאת는 속죄제를 뜻할 수도 있고, 제의 문맥에서는 정결을 위한 제물일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  english_pob_choice: a clean man
  chosen_korean: 깨끗한 사람
  alternatives_korean:
  - 의례적으로 깨끗한 사람
  - 정결한 사람
  lexicon: HALOT
  rationale: טָהוֹר는 이 정결 규례 문맥에서 의례적 정결을 가리키지만, 한국어에서는 ‘깨끗한 사람’이 간결하고 자연스러워 본문 흐름을 살립니다.
- source_word: אֵפֶר הַפָּרָה
  english_pob_choice: the ashes of the heifer
  chosen_korean: 암송아지의 재
  alternatives_korean:
  - 암송아지의 재들
  - 암소의 재
  lexicon: HALOT
  rationale: אֵפֶר은 집합적으로 ‘재’로 옮길 수 있고, פָּרָה는 일반 ‘소’보다 제의적 특수성을 살리는 ‘암송아지’가 적절합니다.
- source_word: לְמֵי נִדָּה
  english_pob_choice: for water for impurity
  chosen_korean: 부정의 물
  alternatives_korean:
  - 부정을 위한 물
  - 정결을 위한 물
  lexicon: HALOT
  rationale: 직역하면 ‘부정의 물’이지만, 제의적 용도를 드러내는 동시에 원문의 긴장도 보존합니다. 더 매끈한 풀이 가능성은 본문 각주로 남길 수 있습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제물
  - 속죄제물
  rationale: 본문은 희생 제의의 기능을 분명히 말하지만, חַטָּאת는 문맥에 따라 ‘속죄제’와 ‘정결제물’의 긴장을 가질 수 있습니다. 본문에는 전통적이면서도 사전적으로 가능한 ‘속죄제’를 두고, 의미의 폭은 각주로 보존합니다.
  doctrine_reference: 제의 용어의 다의성을 본문에서 무리하게 해소하지 않음
- issue: 진영 밖 / 깨끗한 곳의 배치
  chosen_reading: 진영 밖의 깨끗한 곳에 두어야 합니다
  alternative_readings:
  - 진영 밖에 있는 깨끗한 곳에 두어야 합니다
  - 진 밖의 정결한 곳에 놓아야 합니다
  rationale: מִחוּץ לַמַּחֲנֶה와 בְּמָקוֹם טָהוֹר의 위치 관계를 분명히 드러내기 위해 ‘...의 ...에 두어야 합니다’로 옮겼습니다.
  doctrine_reference: 의례적 위치 지시를 명확하게 보존
