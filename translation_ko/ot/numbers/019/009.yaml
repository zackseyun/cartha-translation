    rationale: 기존 각주가 본문과 동일한 ‘부정의 물’을 대안으로 다시 제시합니다. 본문을 ‘부정의 물’로 유지할 경우, 실질적 대안인 ‘정결을 위한 물’만 제시하는 편이 명료합니다.
