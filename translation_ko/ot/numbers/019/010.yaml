id: NUM.19.10
reference: Numbers 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
  footnotes:
  - marker: a
    text: Or 'for the Israelites' / 'for the people of Israel.' The Hebrew reads 'for the sons of Israel,' a corporate covenantal expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'as a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 암송제를 위한 암송물의 재를 거두는 사람은 자기 옷을 빨아야 하며[a], 저녁까지 부정한 상태에 있어야 합니다[b]. 이것은 이스라엘 자손과 그들 가운데 거류하는 거류민을 위한 영원한 규례가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들을 위한’. 히브리어는 ‘이스라엘의 아들들’이라고 되어 있으며, 언약 공동체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저녁까지 부정하게 됩니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  english_pob_choice: the one who gathers
  chosen_korean: 거두는 사람
  alternatives_korean:
  - 모으는 사람
  - 거두는 자
  lexicon: HALOT
  rationale: 분사형이면서 정관사로 사람을 가리키므로, 현대 한국어에서는 ‘거두는 사람’이 가장 자연스럽고 행위자성을 잘 드러냅니다.
- source_word: אֵפֶר הַפָּרָה
  english_pob_choice: the ashes of the heifer
  chosen_korean: 암송제를 위한 암송물의 재
  alternatives_korean:
  - 암송아지의 재
  - 암송암소의 재
  lexicon: HALOT
  rationale: פָּרָה는 제의 문맥에서 특정한 암송물로 이해되므로, 단순히 ‘소’로 풀기보다 문맥을 반영한 ‘암송제’를 유지해 제의적 대상을 분명히 했습니다.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨아야 하며
  alternatives_korean:
  - 자기 옷을 씻어야 하며
  - 자기 의복을 빨아야 하며
  lexicon: HALOT
  rationale: 의례 정결 규정에서 옷을 씻는 행위를 가리키므로, 법문체에 맞는 ‘빨아야 하며’로 옮겼습니다.
- source_word: וְטָמֵא
  english_pob_choice: and he shall be unclean
  chosen_korean: 부정한 상태에 있어야 합니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정합니다
  lexicon: HALOT
  rationale: טָמֵא는 도덕적 타락이 아니라 의례적 부정 상태를 뜻하므로, 한국어에서 상태성을 살리는 ‘부정한 상태에 있어야 합니다’가 가장 오해가 적습니다.
- source_word: לְחֻקַּת עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영속한 규례
  - 항구한 규례
  lexicon: HALOT
  rationale: 법문 공식어로서 חֻקָּה는 ‘규례’가 적절하고, עוֹלָם은 언약적 지속성을 나타내므로 전통적이되 직접적인 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל의 집단 표지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 직설적 집단 표현을 보존해 언약 공동체의 범위를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: וְטָמֵא의 의미 범위
  chosen_reading: 의례적 부정 상태
  alternative_readings:
  - 부정함
  - 불결함
  rationale: 이 문맥은 죄책이 아니라 정결 법의 상태 규정이므로, 신학적으로도 의례적 불정을 분명히 해야 합니다.
  doctrine_reference: 레위기·민수기 정결법
