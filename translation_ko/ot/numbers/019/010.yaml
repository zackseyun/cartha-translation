  source_fidelity: ‘암송제를 위한 암송물’은 히브리어 אֵפֶר הַפָּרָה(‘암송아지/암소의 재’)에 근거가 없는 표현이며, 제의의 명칭을 본문에 덧붙이고 대상 자체도 불명료하게 만듭니다. הָאֹסֵף, 의복 세탁, 저녁까지의 의례적 부정, 이스라엘 자손 및 그들 가운데 거주하는 거류민, 지속적인 규례라는 법문 구조는 모두 보존해야 합니다.
  naturalness: ‘암송제를 위한 암송물’은 현대 표준 한국어에서 자연스럽지 않고 의미가 전달되지 않습니다. ‘저녁까지 부정한 상태에 있어야 합니다’도 원문의 상태 규정에 비해 의무를 중복해 들리므로 ‘저녁까지 부정한 상태에 있게 됩니다’가 더 자연스럽습니다. ‘거주하는 거류민’은 히브리어의 반복을 유지하면서도 이해 가능합니다.
  terminology: פָּרָה는 여기서 문맥상 붉은 암송아지 의식의 동물을 가리키며, 본 절의 명사는 ‘암송아지’로 옮기는 것이 영어 POB의 ‘heifer’ 및 한국어 성서 관용에 부합합니다. טָמֵא는 도덕적 비난이 아닌 의례적 부정이므로 ‘부정한 상태’로 명시합니다. גֵּר는 ‘거류민’으로, חֻקַּת עוֹלָם은 ‘영원한 규례’로 옮깁니다.
