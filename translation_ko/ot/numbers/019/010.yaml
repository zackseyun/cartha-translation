  rationale: 원문 פָּרָה를 ‘암송아지’로 바로 옮겨 대상의 의미를 회복했습니다. 의례적 부정은 상태 규정으로 다듬었고, גֵּר의 반복은 ‘그들 가운데 거주하는 거류민’으로 보존했습니다. 각주는 실제로 설명하거나 대안을 제시하는 본문 표현에 맞추어 재배치했습니다.
