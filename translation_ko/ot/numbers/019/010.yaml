- from: 그리고 암송제를 위한 암송물의 재를 거두는 사람은 자기 옷을 빨아야 하며[a], 저녁까지 부정한 상태에 있어야 합니다[b]. 이것은 이스라엘 자손과 그들 가운데 거류하는 거류민을 위한 영원한 규례가 될 것입니다.
