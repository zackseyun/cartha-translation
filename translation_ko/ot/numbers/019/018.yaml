base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
  footnotes:
  - marker: a
    text: Or 'a man who is clean.' The Hebrew is singular masculine.
    reason: lexical_alternative
  - marker: b
    text: Or 'the slain' or 'a slain body.' The Hebrew term refers specifically to one killed violently, distinguishing it from the more general 'dead person' in the next phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 정결한 남자[a]가 우슬초를 가져다가 그 물에 담그고, 장막과 모든 기구와 거기에 있던 사람들과 뼈나 죽임당한 시체[b]나 죽은 사람이나 무덤에 접촉한 사람에게 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 남성형 ‘남자’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חָלָל은 다음의 일반적인 ‘죽은 사람’과 달리, 폭력적으로 죽임당한 사람 또는 그 시체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  english_pob_choice: hyssop
  chosen_korean: 우슬초
  alternatives_korean:
  - 히솝
  - 우슬초 가지
  lexicon: HALOT
  rationale: 정결 의식에서 쓰이는 식물명으로, 한국어 성경에서 정착된 ‘우슬초’를 사용해 의례적 맥락을 살렸습니다.
- source_word: אִישׁ טָהוֹר
  english_pob_choice: a clean man
  chosen_korean: 깨끗한 사람
  alternatives_korean:
  - 정결한 사람
  - 깨끗한 남자
  lexicon: HALOT
  rationale: 이 문맥은 도덕적 순결이 아니라 시체 접촉에 대한 의례적 정결을 말하므로, ‘깨끗한’으로 자연스럽게 옮겼습니다.
- source_word: בַּמַּיִם
  english_pob_choice: in the water
  chosen_korean: 물에
  alternatives_korean:
  - 그 물에
  - 물속에
  lexicon: HALOT
  rationale: 히브리어 정관사를 살려 ‘그 물에’라고 할 수도 있으나, 한국어에서는 문맥상 자연스러운 ‘물에’로 옮겨도 의미가 유지됩니다.
- source_word: וְהִזָּה
  english_pob_choice: sprinkle
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 뿌려야 합니다
  - 뿌릴 것입니다
  - 뿌립니다
  lexicon: HALOT
  rationale: 정결 예식의 동작을 나타내는 동사로서 ‘뿌리다’가 가장 자연스럽고, 명령적/규범적 뉘앙스를 살리기 위해 ‘-아야 합니다’를 사용했습니다.
- source_word: הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 천막
  lexicon: HALOT
  rationale: 레위기·민수기 정결 문맥에서 익숙한 성경어인 ‘장막’이 여기서는 ‘텐트’보다 본문 분위기와 더 잘 맞습니다.
- source_word: הַכֵּלִים
  english_pob_choice: the vessels
  chosen_korean: 모든 기구
  alternatives_korean:
  - 모든 그릇
  - 모든 용기
  - 모든 기물
  lexicon: HALOT
  rationale: 의례적 도구와 용기를 포괄하는 넓은 의미를 살려 ‘기구’로 옮겼고, 히브리어의 총괄성을 반영해 ‘모든’을 앞에 두었습니다.
- source_word: הַנְּפָשׁוֹת
  english_pob_choice: the persons
  chosen_korean: 거기에 있던 사람들
  alternatives_korean:
  - 그 사람들
  - 그 영혼들
  - 거기에 있던 생명들
  lexicon: HALOT
  rationale: 직역하면 ‘사람들/생명들’이지만, 이 문맥에서는 장막 안에 있던 사람들을 가리키므로 한국어에서는 의미가 분명한 표현으로 옮겼습니다.
- source_word: בֶחָלָל
  english_pob_choice: the slain body
  chosen_korean: 살해된 시체
  alternatives_korean:
  - 살해된 몸
  - 전사한 시체
  - 죽임당한 시체
  lexicon: HALOT
  rationale: חָלָל은 단순한 ‘죽은 사람’보다 폭력적으로 죽임을 당한 경우를 가리키므로, 다음의 일반어 ‘죽은 사람’과 구별되도록 ‘살해된 시체’로 옮겼습니다.
- source_word: בַמֵּת
  english_pob_choice: the dead person
  chosen_korean: 죽은 사람
  alternatives_korean:
  - 시체
  - 죽은 몸
  - 사망한 사람
  lexicon: HALOT
  rationale: 앞의 ‘살해된 시체’와 구별되는 더 일반적인 मृत 개념을 살려, 문자적으로도 자연스러운 ‘죽은 사람’을 선택했습니다.
- source_word: בַקָּבֶר
  english_pob_choice: the grave
  chosen_korean: 무덤
  alternatives_korean:
  - 무덤에
  - 묘지
  lexicon: HALOT
  rationale: 매장 장소를 가리키는 평이한 명사로, 한국어 성경에서 익숙하고 문맥상 자연스러운 ‘무덤’을 사용했습니다.
theological_decisions:
- issue: 의례적 정결의 표현
  chosen_reading: ‘깨끗한 사람’과 ‘뿌려야 합니다’로 정결 예식을 규범적으로 표현했습니다.
  alternative_readings:
  - ‘정결한 사람’
  - ‘뿌리게 해야 합니다’
  rationale: 이 절은 도덕적 정결이 아니라 시체 접촉으로 인한 의례적 정결을 다루며, 서술형보다 규범적 표현이 제사법 맥락을 더 분명히 드러냅니다.
  doctrine_reference: 민수기 19장 정결 규례
