  to: 정결한 남자[a]가 우슬초를 가져다가 그 물에 담그고, 장막과 모든 기구와 거기에 있던 사람들과 뼈나 죽임당한 시체[b]나 죽은 사람이나 무덤에 접촉한 사람에게 뿌려야 합니다.
  rationale: 원문의 의례적 정결 의미와 단수 남성 표현을 함께 살려 ‘정결한 남자’로 고쳤습니다. 정관사가 있는 물은 문맥상 앞서 준비된 물을 가리키므로 ‘그 물’로 옮겼고, 우슬초를 물에 넣는 동작은 ‘담그고’로 명료하게 했습니다. חָלָל과 מֵת의 어휘적 구별은 ‘죽임당한 시체’와 ‘죽은 사람’ 및 관련 주석으로 보존했습니다.
