translation:
  language: ko
  text: 야훼께서 그의 얼굴을 당신에게 비추시고 당신에게 평강을 주시기를 바랍니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘평강’(shalom)은 평화뿐 아니라 온전함과 복리의 의미도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא / יְהוָה פָּנָיו
  english_pob_choice: lift up his face
  chosen_korean: 그의 얼굴을 당신에게 비추시고
  alternatives_korean:
  - 그의 얼굴을 당신 쪽으로 드시고
  - 그의 얼굴을 당신에게 향하시고
  - 당신에게 은혜로운 눈길을 보내시고
  lexicon: HALOT
  rationale: ‘얼굴을 드다/향하다’의 직역형을 살리면서, 축복문맥에서의 호의와 주목을 한국어로 자연스럽게 드러내기 위해 ‘비추시고’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 있는 신적 고유명사를 보존하기 위해 제목이 아니라 이름으로 옮겼습니다.
- source_word: וְיָשֵׂם לְךָ שָׁלוֹם
  english_pob_choice: and give you peace
  chosen_korean: 당신에게 평강을 주시기를 바랍니다
  alternatives_korean:
  - 당신에게 평화를 주시기를 바랍니다
  - 당신에게 평안과 온전함을 주시기를 바랍니다
  - 당신에게 평강을 두시기를 바랍니다
  lexicon: HALOT
  rationale: שָׁלוֹם의 기본값은 ‘평강’으로 두되, 축복 공식의 자연스러운 한국어를 위해 ‘주시다’로 의미를 풀었습니다.
theological_decisions:
- issue: Numbers 6:26의 축복 종결형을 한국어에서 어떻게 처리할지
  chosen_reading: ‘~하시기를 바랍니다’로 옮겨, 제사장 축복의 간구적·선언적 성격을 유지했습니다.
  alternative_readings:
  - ‘~하시옵소서’
  - 직설형 ‘~하십니다’
  rationale: 이 절은 하나님께 대한 축복 청원으로 끝나므로, 합쇼체의 간구형이 원문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: preserve original-language primacy; blessing formulas as performative prayer'
