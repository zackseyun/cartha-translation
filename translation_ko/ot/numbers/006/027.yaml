id: NUM.6.27
reference: Numbers 6:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: The expression 'put my name on' likely signifies invoking the LORD's covenant name over them and marking them as belonging to him.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 이스라엘 자손 위에 내 이름을 두어야 합니다. 그러면 나 자신이 그들을 축복하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역입니다. 보다 자연스럽게는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름을 두다’는 야훼의 언약 이름을 그들 위에 선포하고, 그들이 그분께 속함을 표시하는 뜻을 담을 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  english_pob_choice: So they shall put
  chosen_korean: 그들은 … 두어야 합니다
  alternatives_korean:
  - 그들은 … 놓아야 합니다
  - 그들은 … 둘 것입니다
  lexicon: WLC / HALOT
  rationale: שׂוּם의 기본 의미인 ‘두다/놓다’를 살리되, 앞절의 제사장 축복 명령에 이어지는 결과·지시의 흐름을 한국어로 자연스럽게 옮겼습니다.
- source_word: אֶת שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 명칭
  - 내 이름 곧 야훼의 이름
  lexicon: WLC / HALOT
  rationale: ‘이름’이라는 직접 표현을 유지해야 언약적·대표적 의미를 보존할 수 있으므로, 해석어를 덧붙이지 않고 직역했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: WLC / HALOT
  rationale: 히브리어의 관용적 표현을 그대로 살리면서도, 현대 한국어에서 자연스럽고 성별 비중립적 의미를 과도하게 바꾸지 않는 형태로 옮겼습니다.
- source_word: וַאֲנִי
  english_pob_choice: and I myself
  chosen_korean: 나 자신이
  alternatives_korean:
  - 내가
  - 그리고 나도
  lexicon: WLC / HALOT
  rationale: 독립대명사의 강조를 살려, 단순한 ‘내가’보다 ‘나 자신이’로 옮겨 하나님 쪽의 강조를 드러냈습니다.
theological_decisions:
- issue: ‘내 이름을 두다’라는 언약적 표현의 처리
  chosen_reading: 직접적인 표현을 유지해, 이름을 백성 위에 두는 행위가 하나님의 소유 표시와 축복 선포를 함께 암시하도록 했습니다.
  alternative_readings:
  - 내 이름을 그들 위에 부르다
  - 내 이름으로 그들을 표하다
  rationale: 본문은 해석을 풀어 쓰기보다 상징적 행위를 그대로 말합니다. 따라서 의미를 한 가지로 축소하지 않고 원문의 언약적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
