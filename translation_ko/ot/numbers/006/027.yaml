  to: 그들은 이스라엘 자손[a] 위에 내 이름을 둘 것이며[b], 나는 친히 그들을 축복하겠습니다.
  rationale: 의무를 뜻하는 표현을 미래적 진술로 고쳐 히브리어 동사의 문맥상 기능을 보존했습니다. 접속 관계는 ‘-것이며’로 유지하고, 명시적 대명사의 강조는 자연스러운 합쇼체 표현인 ‘나는 친히’로 옮겼습니다. 각주 내용은 원문의 관용구를 단정적으로 풀어쓰지 않고 ‘가능성이 큽니다’라는 한정을 유지했으며, 표지를 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:55Z'
