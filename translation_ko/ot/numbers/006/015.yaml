source:
  edition: WLC
  text: וְ/סַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וּ/מִנְחָתָ֖/ם וְ/נִסְכֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
  footnotes:
  - marker: a
    text: Or 'unleavened cakes' for the first occurrence of מַצּוֹת; the Hebrew term is broad, and the verse then specifies cakes and wafers within that category.
    reason: lexical_alternative
  - marker: b
    text: Or 'spread with oil' for 'anointed with oil'; the Hebrew verb is the usual word for anointing, but here it describes the preparation of the wafers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무교병 광주리, 곧 고운 가루로 만든 반죽을 기름에 섞은 과자들과 기름을 바른 무교병 전병들과 그들의 곡식 제물과 그들의 전제들도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 번째 מַצּוֹת는 넓게 ‘무교병들’로도 옮길 수 있습니다. 여기서는 뒤에 이어지는 ‘과자들’과 ‘전병들’이 그 범주를 풀어 설명하므로, 보다 범주적인 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름을 바른’은 문자적으로는 ‘기름으로 도유한’에 가깝습니다. 다만 음식 제물의 준비를 가리키는 표현이므로, 현대어에서는 ‘바른’으로 풀어 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  english_pob_choice: basket
  chosen_korean: 광주리
  alternatives_korean:
  - 바구니
  - 바스켓
  lexicon: HALOT
  rationale: 제의 문맥에서 담는 용기를 자연스럽게 가리키는 표준어로 ‘광주리’가 적절합니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교빵
  lexicon: HALOT
  rationale: 제의 용어로서는 ‘무교병’이 가장 간결하고, 바로 뒤에 나오는 ‘과자들’과 ‘전병들’이 그 범주 안의 세부 항목임을 살릴 수 있습니다.
- source_word: חַלֹּת
  english_pob_choice: cakes
  chosen_korean: 과자들
  alternatives_korean:
  - 떡들
  - 빵조각들
  lexicon: HALOT
  rationale: 제사 음식의 형태를 드러내면서도 현대 한국어에서 너무 일상적 의미로 흐르지 않도록 ‘과자들’로 옮겼습니다.
- source_word: רְקִיקֵי מַצּוֹת
  english_pob_choice: unleavened wafers
  chosen_korean: 무교병 전병들
  alternatives_korean:
  - 무교병 얇은 떡들
  - 무교병 웨이퍼들
  lexicon: HALOT
  rationale: 얇고 납작한 제물의 모양을 살리기 위해 ‘전병들’을 택했고, 앞의 무교병과 연결해 제의 범주를 분명히 했습니다.
- source_word: מִנְחָתָם
  english_pob_choice: their grain offering
  chosen_korean: 그들의 곡식 제물
  alternatives_korean:
  - 그들의 소제
  - 그들의 곡식 예물
  lexicon: HALOT
  rationale: 포의의 ‘grain offering’을 한국어 성경에서 지나치게 전통화하지 않으면서도 제의 의미가 분명하도록 ‘곡식 제물’로 옮겼습니다.
theological_decisions:
- issue: 제의 용어의 현대 가독성과 원문의 구분 유지
  chosen_reading: ‘무교병’이라는 큰 범주 아래 ‘과자들’과 ‘전병들’을 구분해, 같은 항목의 반복이 아니라 세부 형태의 나열임을 드러냈습니다.
  alternative_readings:
  - 모두를 일괄해 ‘무교병들’로 처리하는 방식
  - 전통 교회 용어인 ‘소제’로 바꾸는 방식
  rationale: 히브리어 원문은 먼저 범주를 제시하고 그 안의 구체 형태를 나열하므로, 한국어도 그 구조를 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: 민수기 6장 서원 규례의 제사 실무 묘사
