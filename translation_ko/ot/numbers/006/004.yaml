  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the seeds to the skin,' a way of saying every part of the grape.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 나실인 서원 기간 내내, 그는 포도나무에서 나는 것은 무엇이든지, 씨에서 껍질에 이르기까지 먹어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘씨에서 껍질에 이르기까지’라는 말로 포도의 모든 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְרוֹ
  english_pob_choice: his Nazirite vow
  chosen_korean: 그의 나실인 서원
  alternatives_korean:
  - 그의 나실인 구별
  - 그의 구별됨
  lexicon: HALOT
  rationale: 문맥상 נֵזֶר의 일반적 의미인 ‘구별/헌신’보다 민수기 6장의 제도적 의미인 나실인 서원을 가리키므로, 한국어도 기술어로 풀어야 합니다.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  english_pob_choice: anything that is made
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 만들어진 것은 무엇이든지
  - 생산된 것은 무엇이든지
  lexicon: HALOT
  rationale: 히브리어는 금지 대상의 범주를 넓게 잡는 표현이며, 한국어에서는 뒤의 부정 ‘먹어서는 안 됩니다’와 함께 자연스럽게 ‘무엇이든지’로 옮기는 것이 문법과 의미를 가장 잘 살립니다.
- source_word: מִגֶּפֶן הַיַּיִן
  english_pob_choice: from the grapevine
  chosen_korean: 포도나무로 된 것
  alternatives_korean:
  - 포도나무에서 난 것
  - 포도덩굴로 된 것
  lexicon: HALOT
  rationale: 직역의 ‘포도주의 나무’는 한국어에서 어색하므로, 관용적으로 포도나무를 뜻하는 표현으로 풀되 문맥상 포도 관련 전부를 가리키는 범위를 살렸습니다.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  english_pob_choice: from the seeds to the skin
  chosen_korean: 씨에서 껍질에 이르기까지
  alternatives_korean:
  - 씨부터 껍질까지
  - 씨에서 겉껍질에 이르기까지
  lexicon: HALOT
  rationale: 이 표현은 포도 전체를 포괄하는 머리숱법적 범위이므로, POB의 축어적 의미를 유지하면서 한국어에서는 자연스러운 범위 표현인 ‘~에 이르기까지’로 옮겼습니다.
- source_word: לֹא יֹאכֵל
  english_pob_choice: he shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 말아야 합니다
  - 먹으면 안 됩니다
  lexicon: HALOT
  rationale: 법조문체의 금지문으로서 명령적 금지의 힘을 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 표현했습니다.
theological_decisions:
- issue: 나실인 제도의 용어 선택
  chosen_reading: ‘나실인 서원’으로 옮겨, 단순한 개인적 헌신이 아니라 민수기 6장의 특정한 성별 규정을 드러냈습니다.
  alternative_readings:
  - 나실인 구별
  - 나실인 헌신
  rationale: 본문은 일반적인 종교적 헌신이 아니라 기간과 금지사항이 규정된 제도적 서원을 말하므로, 전통 교회어보다 본문 고유의 제도성을 살리는 번역이 필요합니다.
  doctrine_reference: 민수기 6장 나실인 규례
