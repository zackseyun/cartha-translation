  edition: WLC
  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
  footnotes:
  - marker: a
    text: Or 'He shall not become unclean for them when they die.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew nezer; in the Nazirite context this denotes the sign/state of consecration or separation to God, symbolized by the hair on his head.
    reason: cultural_note
translation:
  language: ko
  text: 그의 아버지나 어머니, 형제나 자매가 죽을 때에도, 그는 그들 때문에 자신을 부정하게 해서는 안 됩니다. 그의 하나님께 대한 구별이 그의 머리 위에 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֵזֶר는 나실인 문맥에서 하나님께 구별된 상태와, 머리카락으로 나타나는 그 표지를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: לֹא יִטַּמָּא
  english_pob_choice: He shall not make himself unclean
  chosen_korean: 자신을 부정하게 해서는 안 됩니다
  alternatives_korean:
  - 자신을 더럽혀서는 안 됩니다
  - 부정해져서는 안 됩니다
  - 스스로를 부정하게 해서는 안 됩니다
  lexicon: HALOT
  rationale: טמא의 히트파엘은 여기서 의식적/의례적 부정을 입히는 행위를 가리키므로, 한국어도 도덕적 비난보다 의례적 부정을 드러내는 표현을 택했습니다.
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  english_pob_choice: not even for his father or his mother, for his brother or his sister
  chosen_korean: 그의 아버지나 어머니, 형제나 자매를 위해서도
  alternatives_korean:
  - 아버지나 어머니, 형제나 자매를 위해서도
  - 그 아버지와 어머니, 형제와 자매를 위해서도
  - 아버지든 어머니든 형제든 자매든
  lexicon: HALOT
  rationale: 전치사구가 앞에 나와 강조되므로, 한국어에서는 '…를 위해서도'로 뒤에 배치해 금지의 강조를 살렸습니다. 친족 호칭은 히브리어의 단수형과 성구분을 유지했습니다.
- source_word: בְּמֹתָם
  english_pob_choice: at their death
  chosen_korean: 그들의 죽음으로
  alternatives_korean:
  - 그들이 죽을 때
  - 그들의 죽음에
  - 그들이 죽었을 때
  lexicon: HALOT
  rationale: 명사구의 상황적 의미를 살리면서도 한국어에서 자연스럽게 읽히도록 처리했습니다. 여기서는 죽음 자체가 부정을 유발하는 계기라는 점이 핵심입니다.
- source_word: נֵזֶר
  english_pob_choice: the consecration
  chosen_korean: 구별됨
  alternatives_korean:
  - 봉헌됨
  - 나실인의 구별
  - 성별
  lexicon: HALOT
  rationale: 나실인 문맥에서 נֵזֶר은 단순한 물건이 아니라 하나님께 속하게 된 상태/표지를 가리키므로, 문자적 '관'보다 상태를 드러내는 '구별됨'을 택했습니다.
- source_word: עַל רֹאשׁוֹ
  english_pob_choice: is on his head
  chosen_korean: 그의 머리 위에
  alternatives_korean:
  - 그의 머리 위에 있습니다
  - 그의 머리에 있습니다
  - 머리 위에 있습니다
  lexicon: HALOT
  rationale: 구체적 이미지인 '머리 위'를 보존해, 나실인의 머리카락/서약 표지가 드러나는 효과를 유지했습니다.
theological_decisions:
- issue: 시체 접촉으로 인한 부정의 성격
  chosen_reading: 의례적·제의적 부정으로 번역하고, 도덕적 죄책을 직접 암시하지 않았습니다.
  alternative_readings:
  - 더럽혀서는 안 됩니다처럼 보다 일반적/도덕적으로 들리는 표현
  - 부정해져서는 안 됩니다처럼 상태 변화만 강조하는 표현
  rationale: 문맥은 나실인의 정결 규례이며, 본문은 죽음과 관련된 의례적 부정을 말합니다. 본문이 말하지 않는 도덕적 의미를 덧씌우지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 교리적 의미를 추가하지 말 것.'
