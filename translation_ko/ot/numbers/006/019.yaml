source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
  footnotes:
  - marker: a
    text: Hebrew literally, 'after he has shaved his consecration.' In context this refers to the hair/head that marked his Nazirite consecration.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 숫양의 삶은 어깨와 광주리에서 무교병 한 개와 무교 전병 한 개를 가져다가, 나실인이 자기의 구별된 머리를 민 뒤에 그의 손바닥 위에 올려놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 구별을 민 뒤에’입니다. 문맥상 이 구별은 나실인의 구별을 표시하던 머리털 또는 머리와 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 성직자
  - 사제
  lexicon: HALOT
  rationale: 제의적 문맥에서 הַכֹּהֵן은 한국어 성경에서 가장 자연스럽고 정확한 ‘제사장’으로 옮기는 것이 적절합니다.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  english_pob_choice: the boiled shoulder
  chosen_korean: 삶은 어깨
  alternatives_korean:
  - 삶은 앞다리
  - 익힌 어깨
  lexicon: HALOT
  rationale: 제사 음식의 부위를 현대 한국어로는 ‘어깨’가 가장 직관적이며, בְּשֵׁלָה의 조리 상태는 ‘삶은’으로 분명하게 드러냅니다.
- source_word: חַלַּת מַצָּה אַחַת
  english_pob_choice: one unleavened loaf
  chosen_korean: 무교병 한 개
  alternatives_korean:
  - 무교빵 한 개
  - 무교떡 한 개
  lexicon: HALOT
  rationale: חלה는 빵 덩어리/빵 한 개를 가리키므로, 한국어에서는 제의적 자연성을 살려 ‘무교병 한 개’로 옮겼습니다.
- source_word: וּרְקִיק מַצָּה אֶחָד
  english_pob_choice: one unleavened wafer
  chosen_korean: 무교전병 한 개
  alternatives_korean:
  - 무교얇은빵 한 개
  - 무교웨이퍼 한 개
  lexicon: HALOT
  rationale: רקיק은 얇게 구운 제의용 빵이므로, ‘전병’이 얇고 납작한 형태를 가장 잘 전달합니다.
- source_word: כַּפֵּי הַנָּזִיר
  english_pob_choice: the palms of the Nazirite
  chosen_korean: 나실인의 손바닥 위
  alternatives_korean:
  - 나실인의 손 위
  - 나실인의 두 손바닥 위
  lexicon: HALOT
  rationale: כף의 구체적 이미지를 살려 ‘손바닥’으로 옮기되, 전치 관계는 한국어 자연성에 맞게 ‘위’로 처리했습니다.
- source_word: אֶת נִזְרוֹ
  english_pob_choice: his consecrated head
  chosen_korean: 머리를 민
  alternatives_korean:
  - 그의 나실 서원을
  - 그의 나실한 머리를
  lexicon: HALOT
  rationale: 문맥상 נזר는 추상적 ‘헌신’보다 실제로 깎인 머리/머리털을 가리키므로, 동작을 직접 드러내는 ‘머리를 민’으로 풀어야 제의 절차가 분명해집니다.
theological_decisions:
- issue: 나실인의 نזר를 어떻게 드러낼지
  chosen_reading: ‘머리를 민 나실인’으로 옮겨, 서원으로 구별된 상태가 머리 깎기 행위와 연결됨을 드러냅니다.
  alternative_readings:
  - ‘그의 나실 서원’
  - ‘그의 헌신’
  rationale: 히브리어는 짧은 표현으로 나실의 구별된 상태를 머리/머리털의 절차와 연결합니다. 한국어에서도 추상화하기보다 의식의 실제 행위를 보이게 하는 것이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
