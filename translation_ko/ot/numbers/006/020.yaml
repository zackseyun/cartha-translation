  lexicon: HALOT
  rationale: 형용사 קֹדֶשׁ의 기본 의미를 살려 '거룩합니다'로 옮겼고, 단순한 소유보다 제의적 구별 상태를 강조했습니다.
- source_word: חֲזֵה הַתְּנוּפָה / שׁוֹק הַתְּרוּמָה
  english_pob_choice: the breast of the wave offering / the thigh of the contribution offering
  chosen_korean: 요제로 흔든 가슴과 거제로 받은 넓적다리
  alternatives_korean:
  - 흔든 제물의 가슴과 거제로 드린 넓적다리
