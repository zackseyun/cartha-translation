  source_fidelity: 제의 동작, 야훼 앞에서 행함, 제사장에게 돌아가는 거룩한 몫, 그리고 나실인의 포도주 허용이라는 핵심 의미는 대체로 반영되어 있습니다. 그러나 עַל의 추가·별도 수여 관계가 현 번역의 “함께 그렇습니다”에서 불명확하며, 제사장 몫이라는 법적 의미도 더 분명히 해야 합니다.
  naturalness: “곧 요제로 흔든 가슴과 거제로 받은 넓적다리와 함께 그렇습니다”는 현대 표준 한국어로 부자연스럽고 문장 구조가 불완전합니다. 또한 “나실인”이 한국어 성경 및 현대 신학 용례에서 더 통용되는 명칭입니다.
  terminology: תְּנוּפָה/תְּרוּמָה의 구별은 ‘요제’와 ‘공헌 제물’로 드러내고, 전통 용어 ‘거제’는 각주 대안으로 제시하는 것이 명료합니다. 기존 a 각주는 본문의 ‘거제로 받은 넓적다리’와 실질적으로 같은 표현을 대안으로 제시해 기능하지 못하므로 수정이 필요합니다. 각주 표지도 해당 어구와 최종 동사절에 각각 붙여야 합니다.
