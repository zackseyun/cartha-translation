  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
  footnotes:
  - marker: a
    text: Or, 'the thigh of the heave offering.' The traditional term 'heave offering' renders תְּרוּמָה, but 'contribution offering' is clearer in contemporary English while preserving the sense of a portion set apart and presented.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the Nazirite shall drink wine.' The Hebrew form can be rendered more literally this way, but the context indicates restored permission after the vow's completion.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장은 그것들을 야훼 앞에서 요제로 흔들어 바쳐야 합니다. 그것은 제사장에게 거룩합니다. 곧 요제로 흔든 가슴과 거제로 받은 넓적다리와 함께 그렇습니다. 그 후에 나지르는 포도주를 마실 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거제의 넓적다리”. 히브리어 תְּרוּמָה는 문자적으로는 ‘들어 올린 것’이지만, 여기서는 제사장 몫으로 구별된 제의적 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나지르는 포도주를 마실 것입니다”. 히브리어 동사형은 더 직역하면 이렇게 옮길 수 있지만, 문맥상 서원 완료 후 허용의 회복을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף / תְּנוּפָה
  english_pob_choice: shall wave them as a wave offering
  chosen_korean: 요제로 흔들어 바쳐야 합니다
  alternatives_korean:
  - 흔들어 바쳐야 합니다
  - 흔들어 드려야 합니다
  - 요제로 흔들어야 합니다
  lexicon: HALOT
  rationale: נוּף의 제의적 동작을 한국어로는 '흔들어 바치다'로 옮기되, תְּנוּפָה의 제의적 성격을 살리기 위해 '요제'를 함께 밝혔습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 본문의 신명는 יְהוָה이므로 POB 원칙에 따라 '야훼'를 사용해 언약 이름을 드러냈습니다.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  english_pob_choice: It is holy for the priest
  chosen_korean: 그것은 제사장에게 거룩합니다
  alternatives_korean:
  - 그것은 제사장에게 성스럽습니다
  - 그것은 제사장 몫으로 거룩합니다
  lexicon: HALOT
  rationale: 형용사 קֹדֶשׁ의 기본 의미를 살려 '거룩합니다'로 옮겼고, 단순한 소유보다 제의적 구별 상태를 강조했습니다.
- source_word: חֲזֵה הַתְּנוּפָה / שׁוֹק הַתְּרוּמָה
  english_pob_choice: the breast of the wave offering / the thigh of the contribution offering
  chosen_korean: 요제로 흔든 가슴과 거제로 받은 넓적다리
  alternatives_korean:
  - 흔든 제물의 가슴과 거제로 드린 넓적다리
  - 요제의 가슴과 거제의 넓적다리
  lexicon: HALOT
  rationale: 전문 제의 용어를 유지하되, 현대 한국어에서 이해 가능하도록 신체 부위와 제의 방식을 병기했습니다. תְּרוּמָה는 전통적 '거제'를 유지했습니다.
- source_word: הַנָּזִיר יָיִן
  english_pob_choice: the Nazirite may drink wine
  chosen_korean: 나지르는 포도주를 마실 수 있습니다
  alternatives_korean:
  - 나지르는 포도주를 마셔도 됩니다
  - 나지르는 이제 포도주를 마실 수 있습니다
  lexicon: HALOT
  rationale: יִשְׁתֶּה는 이 맥락에서 허용 회복을 나타내므로, 의무가 아니라 허가를 뜻하는 '마실 수 있습니다'로 옮겼습니다.
theological_decisions:
- issue: תְּרוּמָה의 한국어 제의 용어
  chosen_reading: 거제
  alternative_readings:
  - heave offering을 풀어쓴 '들어 올린 제물'
  - 공헌 제물
  rationale: 본문의 대조적 제의 용어를 보존하기 위해 한국어 교회 전통에서 이미 굳은 '거제'를 유지했습니다. 이는 '요제'와 짝을 이루어 구조를 분명히 합니다.
  doctrine_reference: Numbers 6 제의 용어 일관성
- issue: יִשְׁתֶּה의 의미
  chosen_reading: 허용의 회복으로서 '마실 수 있습니다'
  alternative_readings:
  - 마실 것입니다
  - 마셔야 합니다
  rationale: 나지르 서원의 종료 뒤 금지가 풀린다는 문맥이므로, 명령이 아니라 허가 회복으로 이해해야 합니다.
  doctrine_reference: Numbers 6:1-21 나지르 규례
