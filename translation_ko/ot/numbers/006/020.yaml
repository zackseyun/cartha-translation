revisions:
- from: 제사장은 그것들을 야훼 앞에서 요제로 흔들어 바쳐야 합니다. 그것은 제사장에게 거룩합니다. 곧 요제로 흔든 가슴과 거제로 받은 넓적다리와 함께 그렇습니다. 그 후에 나지르는 포도주를 마실 수 있습니다.[a][b]
  to: 제사장은 그것들을 야훼 앞에서 요제로 흔들어 바쳐야 합니다. 이것은 요제의 가슴과 공헌 제물의 넓적다리[a] 외에 제사장에게 돌아가는 거룩한 몫입니다. 그 후에 나실인은 포도주를 마실 수 있습니다.[b]
  rationale: 개정문은 ‘요제’와 תְּרוּמָה의 공헌·거제 개념을 구별하면서, 해당 제물이 기존의 요제 가슴과 거제 넓적다리에 더하여 제사장에게 귀속되는 거룩한 몫이라는 법적 관계를 명확히 했습니다. 불완전한 한국어 구문을 자연스러운 합쇼체 문장으로 고치고, 각주를 실제 해당 어구와 최종 절에 각각 연결했습니다. יִשְׁתֶּה의 허용적 이해는 유지하되, 직역 가능성은 각주에서 보존했습니다.
