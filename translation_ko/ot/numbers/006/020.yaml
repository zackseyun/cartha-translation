  lexicon: HALOT
  rationale: 본문의 신명는 יְהוָה이므로 POB 원칙에 따라 '야훼'를 사용해 언약 이름을 드러냈습니다.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  english_pob_choice: It is holy for the priest
  chosen_korean: 그것은 제사장에게 거룩합니다
  alternatives_korean:
