  lexicon: HALOT
  rationale: 전문 제의 용어를 유지하되, 현대 한국어에서 이해 가능하도록 신체 부위와 제의 방식을 병기했습니다. תְּרוּמָה는 전통적 '거제'를 유지했습니다.
- source_word: הַנָּזִיר יָיִן
  english_pob_choice: the Nazirite may drink wine
  chosen_korean: 나지르는 포도주를 마실 수 있습니다
