  - 여호와
  rationale: 공개 번역 원칙상 신명기적 언약 이름을 가리고 일반 호칭으로 평준화하지 않고, 원문이 가진 고유성을 드러내기 위함입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
