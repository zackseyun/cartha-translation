  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
  footnotes:
  - marker: a
    text: Or 'a sacrifice of fellowship offerings.' The Hebrew שְׁלָמִים can be rendered 'peace offerings' or 'fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 숫양을 야훼께 평화제의 제물로 드리고, 무교병이 담긴 광주와 함께 드려야 합니다. 제사장은 또 그것의 곡식 제물과 그것의 전제물을 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화제의 제물’ 대신 ‘화목제의 제물’로도 옮길 수 있습니다. 히브리어 שְׁלָמִים는 ‘평화제물’ 또는 ‘화목제물’로 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  english_pob_choice: a sacrifice of peace offerings
  chosen_korean: 평화제의 제물
  alternatives_korean:
  - 화목제의 제물
  - 평화제물
  - 화목제물
  lexicon: HALOT
  rationale: שְׁלָמִים는 제사 범주를 가리키므로, ‘평화제’로 옮기되 זֶבַח의 제의적 성격을 살려 ‘제물’을 덧붙였습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격을 ‘-께’로 나타냈습니다.
- source_word: עַל סַל הַמַּצּוֹת
  english_pob_choice: with the basket of unleavened bread
  chosen_korean: 무교병이 담긴 광주와 함께
  alternatives_korean:
  - 무교병 광주와 함께
  - 무교병이 든 광주와 함께
  - 무교병 광주와 더불어
  lexicon: HALOT
  rationale: עַל은 여기서 단순한 위치보다 동반 관계를 나타내므로 ‘~와 함께’로 풀고, מַצּוֹת는 제의 문맥에 맞게 ‘무교병’으로 옮겼습니다.
- source_word: מִנְחָתוֹ / נִסְכּוֹ
  english_pob_choice: its grain offering / its drink offering
  chosen_korean: 그것의 곡식 제물 / 그것의 전제물
  alternatives_korean:
  - 그것의 소제 / 그것의 전제
  - 그것의 곡식 예물 / 그것의 술제물
  lexicon: HALOT
  rationale: מִנְחָה와 נֶסֶךְ 계열은 각각 곡식 제물과 전제물을 가리키므로, 제의적 용례를 살려 ‘곡식 제물’과 ‘전제물’로 옮겼습니다.
theological_decisions:
