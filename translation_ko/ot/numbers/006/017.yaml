  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
  footnotes:
  - marker: a
    text: Or 'a sacrifice of fellowship offerings.' The Hebrew שְׁלָמִים can be rendered 'peace offerings' or 'fellowship offerings.'
