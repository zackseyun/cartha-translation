id: NUM.6.5
reference: Numbers 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
  footnotes:
  - marker: a
    text: Or 'his vow of separation.' The Hebrew wording behind 'Nazirite' is built on the idea of separation/consecration.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'no razor shall pass over his head,' an idiom meaning he must not shave it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 나실인 서원의 모든 날 동안에는 면도칼이 그의 머리 위를 지나가서는 안 됩니다. 그가 야훼께 자신을 구별하는 날들이 다 끝날 때까지 그는 거룩해야 하며, 그의 머리의 긴 머리칼을 길러야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나실인 서원’은 문자적으로는 ‘구별의 서원’이라는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘면도칼이 그의 머리 위를 지나가다’는 그가 머리를 깎지 말아야 한다는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  english_pob_choice: his Nazirite vow
  chosen_korean: 그의 나실인 서원
  alternatives_korean:
  - 그의 구별의 서원
  - 그의 나실인됨의 서원
  lexicon: HALOT
  rationale: נֶדֶר(서원)과 나실인 상태를 함께 가리키는 기술 용어이므로, 한국어에서도 의미를 압축해 ‘나실인 서원’으로 옮겨 법적·전문적 뉘앙스를 살렸습니다.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  english_pob_choice: no razor shall pass over his head
  chosen_korean: 면도칼이 그의 머리 위를 지나가서는 안 됩니다
  alternatives_korean:
  - 면도칼이 그의 머리에 닿아서는 안 됩니다
  - 그는 머리를 깎아서는 안 됩니다
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 유지해 ‘면도칼이 지나가다’라는 금지의 형식을 살렸고, 한국어에서는 자연성을 위해 ‘안 됩니다’로 풀었습니다.
- source_word: קָדֹשׁ יִהְיֶה
  english_pob_choice: he shall be holy
  chosen_korean: 그는 거룩해야 하며
  alternatives_korean:
  - 그는 성별되어야 하며
  - 그는 구별되어야 하며
  lexicon: HALOT
  rationale: 본문의 핵심 신학어인 קָדֹשׁ를 ‘거룩하다’로 보존해, 단순한 의식적 구분보다 더 강한 종교적 상태를 드러냈습니다.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  english_pob_choice: he shall let the hair of his head grow long
  chosen_korean: 그의 머리의 긴 머리칼을 길러야 합니다
  alternatives_korean:
  - 그의 머리의 머리칼을 길게 자라게 해야 합니다
  - 그의 머리의 흩어진 머리칼을 길러야 합니다
  lexicon: HALOT
  rationale: פֶּרַע의 ‘풀어 헤친/다듬지 않은 긴 머리’ 뉘앙스를 반영하되, 한국어 독자에게 자연스럽게 들리도록 ‘긴 머리칼을 기르다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신명기적 서원 조항 안에서 여호와 이름을 직접 사용하므로, 프로젝트 기본값에 따라 언약명 자체를 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יהוה YHWH → 야훼
- issue: ‘거룩하다’와 ‘구별되다’의 선택
  chosen_reading: 거룩해야 하며
  alternative_readings:
  - 구별되어야 하며
  - 성별되어야 하며
  rationale: 문맥상 나실인의 분리 상태가 배경이지만, 히브리어는 실제로 קדֹשׁ를 사용하므로 본문이 가진 신학적 표지를 그대로 유지하는 편이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #5'
