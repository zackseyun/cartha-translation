id: NUM.6.14
reference: Numbers 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
  footnotes:
  - marker: a
    text: Or "purification offering" for "sin offering." The Hebrew term חַטָּאת can denote both sin and the sacrifice associated with purification from impurity or offense.
    reason: alternative_reading
  - marker: b
    text: Or "offerings of well-being" or "fellowship offerings" for "peace offerings."
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 예물을 야훼께 드려야 합니다. 첫째로 흠 없는 한 살짜리 수컷 어린양을 번제물로, 둘째로 흠 없는 한 살짜리 암양을 속죄제물로, 셋째로 흠 없는 한 숫양을 화목제물로 드려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄제물’ 대신 ‘정화제물’로 옮길 수 있습니다. 히브리어 חַטָּאת은 죄와 더불어 부정함이나 잘못에서 정결하게 하는 제물을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘평화제물’이나 ‘교제제물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: and he shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 가져와야 합니다
  - 바쳐야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 הִקְרִיב은 단순한 이동보다 예물을 예식적으로 ‘드리는’ 행위를 뜻하므로, 현대 한국어에서 가장 자연스럽고 직관적인 동사로 옮겼습니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 자신의 예물
  alternatives_korean:
  - 자신의 제물
  - 그의 헌물
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적으로 하나님께 가까이 드리는 ‘예물’의 뜻이 핵심이므로, 본문 흐름을 살리면서도 제사 맥락을 분명히 하는 ‘예물’을 택했습니다.
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  english_pob_choice: one year-old male lamb
  chosen_korean: 한 살짜리 수컷 어린양
  alternatives_korean:
  - 한 해 된 수컷 어린양
  - 한 살 된 숫양 새끼
  lexicon: HALOT
  rationale: 연령 표현과 성별 구분을 함께 살리기 위해 ‘한 살짜리 수컷 어린양’으로 옮겼습니다. 뒤의 암양과 대조되므로 ‘수컷’ 정보를 분명히 하는 것이 중요합니다.
- source_word: תָּמִים
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 결함 없는
  lexicon: HALOT
  rationale: 제의 규정에서 תָּמִים은 결격 사유가 없는 제물이라는 의미이므로, 관용적으로 확립된 ‘흠 없는’을 사용했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 죄제물로
  lexicon: HALOT
  rationale: חַטָּאת은 죄 자체와 속죄 제사를 함께 가리킬 수 있지만, 제사 목록 문맥에서는 기능상 제물로 보는 것이 자연스럽습니다. 한국어에서는 ‘속죄제물’이 의미를 간결하게 드러냅니다.
- source_word: לִשְׁלָמִים
  english_pob_choice: for peace offerings
  chosen_korean: 화목제물로
  alternatives_korean:
  - 평화제물로
  - 교제제물로
  lexicon: HALOT
  rationale: שְׁלָמִים은 ‘peace offerings’의 전통적 대응을 따르되, 한국어 성경에서 널리 통용되는 ‘화목제물’로 옮겨 제의 범주를 유지했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה는 신명기적 제의 문맥에서 언약 이름으로 제시되므로, 프로젝트 기본어인 ‘야훼’를 유지해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
