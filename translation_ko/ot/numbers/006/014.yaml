- from: 그는 자신의 예물을 야훼께 드려야 합니다. 첫째로 흠 없는 한 살짜리 수컷 어린양을 번제물로, 둘째로 흠 없는 한 살짜리 암양을 속죄제물로, 셋째로 흠 없는 한 숫양을 화목제물로 드려야 합니다.[a][b]
  to: 그는 자신의 예물을 야훼께 드려야 합니다. 곧 흠 없는 한 살 된 수컷 어린양 한 마리를 번제물로, 흠 없는 한 살 된 암컷 어린양 한 마리를 속죄제물[a]로, 흠 없는 숫양 한 마리를 화목제물[b]로 드려야 합니다.
