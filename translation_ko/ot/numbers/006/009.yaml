revisions:
- from: 사람이 그 곁에서 갑자기 죽어 그의 나실인 머리를 더럽히게 되면, 그는 정결하게 되는 날에 자기 머리를 밀고, 일곱째 날에 그것을 밀어야 합니다.[a][b]
  to: 어떤 사람이 나실인 곁에서 갑자기[b] 죽어 나실인의 구별된 머리를 더럽히면, 그는 정결하게 되는 날에 자기 머리를 밀어야 합니다. 곧 일곱째 날에 그 머리를 밀어야 합니다.[a]
  rationale: 나실인과 죽은 사람의 지시 대상을 명시하여 원문의 법규 상황을 분명히 했습니다. נזר의 의례적 의미는 ‘구별된 머리’와 각주로 보존했습니다. 마지막 두 시간 표현은 동일한 날을 가리키므로 ‘곧’으로 연결하되, 원문의 동사 반복은 ‘그 머리를 밀어야 합니다’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:58Z'
review_pass:
  verdict: revise
  source_fidelity: 조건의 주체와 나실인의 지시 대상이 한국어 초안에서 혼동될 수 있습니다. 또한 ‘그것’은 머리를 가리키지만 한국어 법규 문맥에서는 부자연스럽고, 두 발을 순차적인 두 차례의 삭발처럼 오해하게 할 수 있습니다. 개정문은 히브리어의 반복을 보존하면서도 일곱째 날이 정결하게 되는 날임을 ‘곧’으로 밝혔습니다.
  naturalness: ‘나실인 머리’는 현대 한국어에서 명사 결합이 부자연스럽고 의미도 불분명합니다. ‘나실인의 구별된 머리’와 ‘그 머리’를 사용하면 의례적 의미와 지시 대상이 분명해집니다.
  terminology: נֵזֶר의 의례적 구별/봉헌 의미는 ‘구별된 머리’로 옮겼습니다. 이는 특정 교파의 용어를 강요하지 않으면서, 단순히 나실인이라는 신분을 수식하는 표현보다 원문의 결속을 더 잘 드러냅니다.
  issues:
  - severity: medium
    issue: ‘그의 나실인 머리’의 의미와 소유 관계가 불분명합니다.
    rationale: ‘나실인’은 사람을 가리키는 명사이므로 ‘나실인 머리’는 자연스럽지 않으며, ‘그의’가 죽은 사람인지 나실인인지도 문맥상 잠시 모호해집니다.
  - severity: medium
    issue: ‘일곱째 날에 그것을 밀어야 합니다’가 두 번째 별도의 삭발처럼 들리고 ‘그것’의 지시가 부자연스럽습니다.
    rationale: 히브리어는 정결의 날을 일곱째 날로 재진술하며 동사를 반복합니다. 한국어에서는 ‘곧’을 써서 같은 날임을 명확히 하고 ‘그 머리’로 지시 대상을 밝혀야 합니다.
  - severity: low
    issue: 각주 표지가 해당 어구에 직접 붙어 있지 않습니다.
    rationale: a는 ‘구별된 머리’에, b는 ‘갑자기’에 붙여야 각주의 어휘적 범위가 명확합니다.
