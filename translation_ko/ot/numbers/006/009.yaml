id: NUM.6.9
reference: Numbers 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
  footnotes:
  - marker: a
    text: Or 'his head of consecration.' The Hebrew expression literally links the head with his Nazirite consecration.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says literally, 'if a dead person dies beside him, suddenly suddenly,' an idiom expressing an abrupt, unexpected death in his immediate presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 나실인 곁에서 갑자기[b] 죽어 나실인의 구별된 머리를 더럽히면, 그는 정결하게 되는 날에 자기 머리를 밀어야 합니다. 곧 일곱째 날에 그 머리를 밀어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 머리를 그의 나실인으로서의 구별됨과 연결하여 표현합니다. 직역하면 ‘그의 구별됨의 머리’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘갑자기 갑자기’에 해당하는 관용적 반복을 사용하여, 나실인 곁에서 예기치 않게 일어난 죽음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 사람이 … 되면
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 조건문으로 이어지는 משפט이므로 한국어에서도 자연스러운 조건형으로 시작하되, 법규 문맥을 살려 과도한 서술 접속사는 피했습니다.
- source_word: עָלָיו
  english_pob_choice: beside him
  chosen_korean: 그 곁에서
  alternatives_korean:
  - 그 옆에서
  - 그 가까이에
  lexicon: HALOT
  rationale: 접촉 자체보다 즉각적 근접을 가리키므로, 죽음이 나실인과 가까운 자리에서 일어났음을 드러내는 표현으로 옮겼습니다.
- source_word: רֹאשׁ נִזְרוֹ
  english_pob_choice: his consecrated head
  chosen_korean: 나실인 머리
  alternatives_korean:
  - 그의 거룩히 구별된 머리
  - 나실인의 머리
  lexicon: HALOT
  rationale: 직역적 어순을 유지하면 어색해지므로, נזר의 서원/구별 상태를 머리와 결부한 의례적 표현으로 간명하게 옮겼습니다.
- source_word: וְגִלַּח רֹאשׁוֹ
  english_pob_choice: then he shall shave his head
  chosen_korean: 자기 머리를 밀고
  alternatives_korean:
  - 자기 머리를 깎고
  - 머리를 면도하고
  lexicon: HALOT
  rationale: 히브리어 가르라ח은 머리카락을 밀어 제거하는 동작이므로, 제의적 정결 행위를 나타내는 한국어 ‘밀다’를 사용했습니다.
- source_word: יְגַלְּחֶנּוּ
  english_pob_choice: he shall shave it
  chosen_korean: 그것을 밀어야 합니다
  alternatives_korean:
  - 다시 밀어야 합니다
  - 그 머리를 밀어야 합니다
  lexicon: HALOT
  rationale: 대명사 지시 대상을 앞의 ‘머리’로 받되, 반복을 줄이기 위해 ‘그것’을 사용해 히브리어의 지시 관계를 살렸습니다.
theological_decisions:
- issue: 나실인의 머리/서원 표현
  chosen_reading: ‘나실인 머리’로 옮겨, 머리와 구별 서원이 연결된 의례적 의미를 드러냈습니다.
  alternative_readings:
  - 서원의 머리
  - 구별의 머리
  rationale: 본문은 단순한 신체 부위를 말하는 것이 아니라, 나실인의 구별됨이 머리카락에 표지되는 정결 규정을 말하므로 그 제의적 의미를 유지하는 것이 중요합니다.
  doctrine_reference: 민수기 6장 나실인 규례
