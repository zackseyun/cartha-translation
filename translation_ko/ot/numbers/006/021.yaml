  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
  footnotes:
  - marker: a
    text: Or 'besides what he can afford'; literally, 'besides what his hand can reach.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 나실 사람의 율법입니다. 그는 야훼께 그의 나실 서원에 따른 예물을 — 자기 손이 미칠 수 있는 것 외에 — 드려야 합니다. 그가 서원한 대로, 곧 그 나실 서원에 관한 율법에 따라 그대로 행해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 형편이 미치는 것 외에’; 문자적으로는 ‘그의 손이 미칠 수 있는 것 외에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת / עַל תּוֹרַת
  english_pob_choice: the law of / according to the law of
  chosen_korean: 율법 / 그 나실 서원에 관한 율법
  alternatives_korean:
  - 규정
  - 지침
  - 나실인의 규정
  lexicon: HALOT
  rationale: 법적 절차를 제시하는 문맥이므로 ‘율법’이 가장 직접적이며, 반복되는 결말도 ‘그 나실 서원에 관한 율법’으로 살려 구조를 드러냈습니다.
- source_word: הַנָּזִיר
  english_pob_choice: the Nazirite
  chosen_korean: 나실 사람
  alternatives_korean:
  - 나실인
  - 나실자
  - 서원한 사람
  lexicon: HALOT
  rationale: 기술적 호칭이지만 한국어에서 가장 자연스럽고 본문 기능을 살릴 수 있는 표현으로 ‘나실 사람’을 택했습니다.
- source_word: קָרְבָּנוֹ לַיהוָה
  english_pob_choice: his offering to Yahweh
  chosen_korean: 야훼께 그의 … 예물을 드려야 합니다
  alternatives_korean:
  - 야훼께 그의 … 제물을 드려야 합니다
  - 야훼께 바치는 그의 … 예물
  lexicon: HALOT
  rationale: קָרְבָּן은 예배용 ‘예물/제물’의 일반 용어이므로, 여기서는 공물의 성격을 살려 ‘예물’로 옮겼고, לַיהוָה는 본문 원칙에 따라 ‘야훼께’로 렌더링했습니다.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  english_pob_choice: besides what his hand can afford
  chosen_korean: 자기 손이 미칠 수 있는 것 외에
  alternatives_korean:
  - 자기 형편이 미치는 것 외에
  - 자기 손이 닿는 것 외에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손이 미치다’는 능력/형편을 뜻하므로, 물질적 한계를 암시하는 이미지를 유지하면서도 자연스럽게 옮겼습니다.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  english_pob_choice: According to the vow that he vows
  chosen_korean: 그가 서원한 대로
  alternatives_korean:
  - 그가 서원한 바에 따라
  - 그가 맹세한 대로
  lexicon: HALOT
  rationale: 반복되는 ‘서원’ 표현을 한국어에서 과도하게 누적하지 않으면서도, 원문의 의무적 반복을 보존할 수 있게 간결하게 옮겼습니다.
theological_decisions:
