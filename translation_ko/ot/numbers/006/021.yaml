revisions:
- from: 이것은 나실 사람의 율법입니다. 그는 야훼께 그의 나실 서원에 따른 예물을 — 자기 손이 미칠 수 있는 것 외에 — 드려야 합니다. 그가 서원한 대로, 곧 그 나실 서원에 관한 율법에 따라 그대로 행해야 합니다.[a]
  to: 이것은 자기 나실 서원을 위하여 야훼께 드릴 예물을, 그가 마련할 수 있는 것 외에[a], 서원한 나실인에 관한 율법입니다. 그가 서원한 바에 따라, 그는 자기 나실 서원에 관한 율법대로 행해야 합니다.
  rationale: 원문의 수식 구조를 한국어에서 가능한 한 보존하여, ‘예물을 서원한 나실인’이 율법의 대상임을 분명히 했습니다. מִלְּבַד 구문은 ‘예물’에 인접시켜 수식 범위를 드러냈고, 각주 표지도 해당 어구 뒤로 옮겼습니다. 반복되는 서원 및 율법 표현은 법문체의 강조를 살려 유지했습니다.
