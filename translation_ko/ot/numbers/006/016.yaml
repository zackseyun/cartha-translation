id: NUM.6.16
reference: Numbers 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
  footnotes:
  - marker: a
    text: Or 'bring them near before the LORD.' The Hebrew verb can emphasize presentation before God prior to the actual offering.
    reason: lexical_alternative
  - marker: b
    text: '''Sin offering'' may also be understood as ''purification offering'' in priestly sacrificial language.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것들을 야훼 앞으로 가져와, 자신의 속죄제와 번제를 드려야 합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 야훼 앞으로 가까이 가져오다’로도 옮길 수 있습니다. 히브리어 동사는 실제 제사를 드리기 전에 하나님 앞에 제물을 제시하는 뉘앙스를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속죄제’는 제의 문맥에서 ‘정결제’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: shall present
  chosen_korean: 가져다 바치고
  alternatives_korean:
  - 드리고
  - 가까이 가져가고
  lexicon: HALOT
  rationale: 제의 문맥에서 קרב의 히필은 단순한 ‘드리다’보다 먼저 하나님 앞에 ‘가까이 가져오다/제시하다’는 뜻이 살아 있으므로, POB의 ‘present’를 살려 준비 단계와 실제 제사를 구분했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 주님 앞에
  - 야훼 면전에
  lexicon: HALOT
  rationale: לִפְנֵי는 위치적·관계적으로 ‘앞에/면전에’의 뜻이므로 자연스러운 현대어로 옮겼고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 표기했습니다.
- source_word: חַטָּאת
  english_pob_choice: his sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 문맥상 제의 용어이므로 일반적 의미의 ‘죄’보다 제사 명칭을 살렸습니다. POB의 ‘sin offering’에 해당하는 전통적 제사 용어를 유지하되, 주석에서 번역상 대안을 반영했습니다.
- source_word: עֹלָה
  english_pob_choice: his burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태우는 제물
  - 전소제
  lexicon: HALOT
  rationale: עֹלָה는 제의적으로 확립된 ‘번제’이므로, 현대 한국어 성경에서도 통용되는 표준 용어를 사용했습니다.
theological_decisions:
- issue: 이름인 יְהוָה의 번역
  chosen_reading: ‘야훼’로 표기하여 언약적 고유명을 보존했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문은 단순한 칭호가 아니라 여호와/야훼의 고유 이름을 직접 사용하므로, 본 프로젝트 기준에 따라 대체어를 쓰지 않고 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 제물 명칭 ‘sin offering’의 처리
  chosen_reading: ‘속죄제’로 옮겨 제의적 제사 명칭을 유지했습니다.
  alternative_readings:
  - ‘죄를 위한 제물’
  - ‘정결제’
  rationale: 히브리어 חַטָּאת은 문맥에 따라 ‘죄’와 ‘속죄제’를 모두 가리킬 수 있지만, 여기서는 제사 규정이므로 제의 명칭을 보존하는 편이 본문의 기능을 더 정확히 드러냅니다.
  doctrine_reference: Levitical sacrificial terminology
