  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
  footnotes:
  - marker: a
    text: Or 'the sacrifice of fellowship offerings' or 'the sacrifice of well-being offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 나실인은 회막 어귀에서 나실인으로 구별되어 기른 머리카락을 밀고, 그 머리카락을 화목제 희생제물[a] 아래의 불 위에 놓아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제 제물’ 또는 ‘평안 제물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָּזִיר
  english_pob_choice: Nazirite
  chosen_korean: 나실인
  alternatives_korean:
  - 나실 사람
  - 서원한 사람
  lexicon: HALOT
  rationale: 특정한 나실인 서원을 가리키는 기술 용어이므로, 일반적 표현보다 한국어 성경에서 통용되는 음역형 ‘나실인’이 원문의 제의적 의미를 가장 잘 보존합니다.
- source_word: רֹאשׁ נִזְרוֹ
  english_pob_choice: the head of his consecration
  chosen_korean: 자기의 구별의 머리
  alternatives_korean:
  - 자기의 구별된 머리
  - 자기의 나실인 서원의 머리
  lexicon: HALOT
  rationale: 히브리어의 ‘머리-구별’ 결합을 드러내기 위해 직역 구조를 살리되, 한국어에서 자연스럽게 읽히도록 ‘구별’로 옮겼습니다.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  english_pob_choice: the hair of the head of his consecration
  chosen_korean: 자기의 구별의 머리카락
  alternatives_korean:
  - 자기의 구별된 머리의 머리카락
  - 자기의 나실인 서원의 머리카락
  lexicon: HALOT
  rationale: 반복된 원문 구조를 유지하면서, 제의적으로 구별된 상태와 그 표지인 머리카락의 연결을 한국어로 드러냈습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제 희생
  alternatives_korean:
  - 화목제물
  - 평안제 희생
  lexicon: HALOT
  rationale: POB가 ‘peace offerings’로 둔 제사 용어를 한국어 제의 용어인 ‘화목제’로 옮기고, 원문의 ‘희생’을 함께 살려 제사 행위를 분명히 했습니다.
theological_decisions:
- issue: 나실인의 머리카락 처리 방식과 제의적 상징
  chosen_reading: 머리를 밀고 머리카락을 제물 아래 불에 놓는 행위로 옮겼습니다.
  alternative_readings:
  - 머리를 깎고
  - 머리카락을 태워 바친다
  rationale: 본문은 정결/서원의 종료를 알리는 구체적 제의 절차를 명령하므로, 완곡하게 풀기보다 행위 순서를 직접적으로 제시하는 것이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §5 (ritual and technical-term consistency)
