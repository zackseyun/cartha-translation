  - severity: low
    issue: ‘화목제 희생’ 및 각주 대안의 어색한 표현
    rationale: ‘화목제 희생’은 제사 범주와 희생을 중복해 들리게 하며, ‘잘됨의 희생’은 현대 한국어 용례로 자연스럽지 않습니다. 본문의 제의 범주를 유지하면서 더 통용되는 명사구와 각주 대안을 사용합니다.
