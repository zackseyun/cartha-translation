revisions:
- from: 그 나실인은 회막 어귀에서 자기의 구별의 머리를 밀고, 자기의 구별의 머리카락을 가져다가 화목제 희생 아래 있는 불 위에 놓아야 합니다.[a]
  to: 그 나실인은 회막 어귀에서 나실인으로 구별되어 기른 머리카락을 밀고, 그 머리카락을 화목제 희생제물[a] 아래의 불 위에 놓아야 합니다.
  rationale: 나실인의 ‘구별’과 머리카락의 연결을 원문에 맞게 보존하되, 한국어에서 이해되지 않는 ‘구별의 머리’라는 직역을 피했습니다. 또한 각주 표지를 해당 제의 용어에 붙이고, 대안 번역을 자연스러운 현대 한국어로 다듬었습니다. 본문은 불이 화목제 희생제물 ‘아래’에 있다는 공간 관계를 그대로 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:51Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 행위 순서(회막 어귀에서 머리카락을 밀고, 그것을 화목제 희생제물 아래의 불에 놓음)는 보존되어 있습니다. 다만 ‘자기의 구별의 머리/머리카락’은 히브리어의 נִזְרוֹ를 기계적으로 재현하여 한국어 의미가 불명확해집니다. 이 문맥에서 이는 나실인으로 구별된 기간에 기른 머리카락을 가리키므로, 그 관계를 자연스럽고 정확하게 밝혀야 합니다.
  naturalness: ‘자기의 구별의 머리’를 미는 표현은 현대 표준 한국어에서 부자연스럽고, 무엇을 민다는 것인지도 즉시 파악하기 어렵습니다. ‘나실인으로 구별되어 기른 머리카락을 밀고, 그 머리카락을’이라고 하면 반복되는 지시 대상과 제의적 연관성을 자연스럽게 유지합니다. ‘화목제 희생’도 한국어에서는 다소 중복적이므로 ‘화목제 희생제물’로 정리했습니다.
  terminology: ‘나실인’과 ‘화목제’는 적절한 통용 제의 용어입니다. שְׁלָמִים의 대안은 ‘교제제’보다 ‘교제 제물’, ‘잘됨의 희생’보다 현대 한국어에서 이해 가능한 ‘평안 제물’ 또는 ‘온전함의 제물’로 제시하는 편이 낫습니다. 원문의 זֶבַח는 ‘희생제물’로 반영했습니다.
  issues:
  - severity: medium
    issue: ‘자기의 구별의 머리’ 및 ‘자기의 구별의 머리카락’
