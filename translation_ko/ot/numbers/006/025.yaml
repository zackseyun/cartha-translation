    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그의 얼굴을 당신에게 비추시고 당신에게 은혜를 베푸시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 그의 얼굴을 당신에게 비추시고 당신에게 호의를 보이시기를 바랍니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: יָאֵר
  english_pob_choice: may ... make ... shine
  chosen_korean: 비추시기를 바랍니다
  alternatives_korean:
  - 비추소서
  - 빛나게 하시기를 바랍니다
  lexicon: HALOT
  rationale: 히필 청유형의 축복 표현으로, 단순한 ‘빛나다’보다 ‘비추다’가 원문의 사역적 뉘앙스를 살리면서 한국어 축복문으로도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신적 이름을 고유명사로 드러내기 위해 전통적 대치어보다 ‘야훼’를 사용합니다.
- source_word: פָּנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그의 임재
  - 그의 낯
  lexicon: HALOT
  rationale: 축복문의 구체적 이미지를 보존하기 위해 관용적 해석어보다 직역에 가까운 ‘얼굴’을 유지했습니다.
- source_word: וִיחֻנֶּךָּ
  english_pob_choice: and be gracious to you
  chosen_korean: 당신에게 은혜를 베푸시고
  alternatives_korean:
  - 당신에게 호의를 보이시고
  - 당신을 불쌍히 여기시고
  lexicon: HALOT
  rationale: חנן의 핵심 의미를 한국어 성서어법에 맞게 ‘은혜를 베풀다’로 옮겨, 자비보다 호의/은혜의 축복적 성격을 살렸습니다.
theological_decisions:
- issue: 야훼의 얼굴이 비추는 은혜의 축복을 어떻게 보존할 것인가
  chosen_reading: 얼굴 이미지와 은혜 요청을 분리하지 않고, 한 문장 안에서 축복의 가시적 은유를 유지했습니다.
  alternative_readings:
  - 그의 임재가 당신에게 비치기를 바랍니다
  - 당신을 호의로 돌보시기를 바랍니다
  rationale: 히브리어 축복문은 신적 호의의 구체적 이미지를 의도하므로, 해석적으로 추상화하기보다 원문의 시적·신학적 긴장을 보존하는 편이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense; do not paraphrase beyond what the source warrants'
