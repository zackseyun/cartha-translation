  source_fidelity: 원문의 야훼 이름, 청유/축복의 양태, ‘얼굴’의 은유, 그리고 חנן의 은혜·호의 의미를 보존합니다. 다만 ‘그의 얼굴을 당신에게 비추다’는 한국어에서 얼굴 자체가 빛을 받는다는 뜻으로도 읽혀, יָאֵר ... פָּנָיו의 ‘그 얼굴빛을 비추다’라는 이미지를 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘자신의 얼굴빛을 당신에게 비추시고’는 한국어 축복문에서 자연스럽고, 원문의 얼굴과 빛의 이미지를 함께 드러냅니다. ‘바랍니다’는 현대 합쇼체의 축원 표현으로 적절합니다.
