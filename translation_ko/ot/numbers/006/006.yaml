  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
  footnotes:
  - marker: a
    text: Or "his Nazirite vow" or "his consecration." The Hebrew term refers to the state or period of being set apart as a Nazirite.
    reason: lexical_alternative
  - marker: b
    text: Literally, "a dead nephesh"; that is, a human corpse or dead body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여호와께 구별되어 있는 모든 날 동안, 그는 어떤 시체에도 가까이 가서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 나실인 서원”, “그의 헌신”. 히브리어 용어는 나실인으로 구별된 상태나 기간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “죽은 네페쉬”입니다. 곧 사람의 시체를 뜻합니다.
    reason: lexical_alternative
