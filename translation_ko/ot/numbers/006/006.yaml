id: NUM.6.6
reference: Numbers 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
  footnotes:
  - marker: a
    text: Or "his Nazirite vow" or "his consecration." The Hebrew term refers to the state or period of being set apart as a Nazirite.
    reason: lexical_alternative
  - marker: b
    text: Literally, "a dead nephesh"; that is, a human corpse or dead body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 구별의 모든 날 동안, 그는 죽은 시체에 가까이 가지 말아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 나실인 서원”, “그의 성별”. 히브리어 용어는 나실인으로 구별된 상태나 기간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “죽은 네페쉬”입니다. 즉, 사람의 시체 또는 죽은 몸을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  english_pob_choice: All the days of
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 그 모든 날 동안
  - 날마다
  lexicon: HALOT
  rationale: 히브리어가 맹세 기간 전체를 가리키므로, 한국어에서는 시간 전체를 자연스럽게 묶는 ‘모든 날 동안’이 가장 직역성과 가독성의 균형이 좋습니다.
- source_word: הַזִּירוֹ
  english_pob_choice: his separation
  chosen_korean: 그의 구별
  alternatives_korean:
  - 그의 분리
  - 그의 나실인 서원
  - 그의 성별
  lexicon: HALOT
  rationale: POB의 ‘his separation’을 따라 나실인 제도의 핵심 의미인 ‘구별됨’을 살렸습니다. ‘서원’은 본문에 없는 해석 요소를 앞세울 수 있어 본문에는 두지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 여호와께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: 현행 한국어 성경 전통과 공적 가독성을 고려해 ‘여호와께’로 옮겼습니다. 원문의 지시 대상은 야훼이지만, 본문 자체는 헌신의 방향을 나타냅니다.
- source_word: נֶפֶשׁ מֵת
  english_pob_choice: a dead body
  chosen_korean: 죽은 시체
  alternatives_korean:
  - 죽은 사람
  - 시체
  - 죽은 몸
  lexicon: HALOT
  rationale: 이 관용구는 정결법 문맥에서 인간의 시체를 뜻하므로, 한국어에서는 직접적이고 오해가 적은 ‘죽은 시체’로 옮겼습니다.
- source_word: לֹא יָבֹא
  english_pob_choice: he shall not go near
  chosen_korean: 가까이 가지 말아야 합니다
  alternatives_korean:
  - 들어가지 말아야 합니다
  - 다가가지 말아야 합니다
  - 가면 안 됩니다
  lexicon: HALOT
  rationale: ‘오다’의 법적 금지 용법을 한국어에서는 접촉 금지의 의미가 분명한 ‘가까이 가지 말아야 합니다’로 풀어 옮겼습니다.
theological_decisions:
- issue: 나실인 용어의 명시성
  chosen_reading: ‘그의 구별’로 본문의 상태를 직역하되, 나실인 제도 해석은 본문 맥락에 맡깁니다.
  alternative_readings:
  - 그의 나실인 서원
  - 그의 성별
  rationale: 원문 명사 자체는 ‘구별/분리’의 상태를 직접 가리키며, POB도 ‘his separation’을 택했습니다. 따라서 본문에는 제도명보다 상태를 우선 반영했습니다.
  doctrine_reference: Numbers 6 문맥 및 POB lexical decision
- issue: 여호와 표기
  chosen_reading: 여호와께
  alternative_readings:
  - 야훼께
  - 주님께
  rationale: POB 영어 주석은 YHWH를 ‘the LORD’로 번역하지만, 한국어 교회 독자에게는 전통적 표기인 ‘여호와’가 가장 즉각적으로 식별됩니다. 본문은 경칭 조사 ‘께’를 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
