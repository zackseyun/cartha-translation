lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 히브리어 고유명사 יְהוָה를 제목어가 아닌 고유 이름으로 드러내기 위해 '야훼'를 사용했습니다. 이는 POB의 영어 선택 'Yahweh'에 대응하며, 전통적 대치어 '주님'보다 원문 식별성을 더 잘 보존합니다.
- source_word: יְבָרֶכְךָ
  english_pob_choice: May ... bless you
  chosen_korean: 복 주시고
  alternatives_korean:
  - 복하시고
  - 복을 주시고
  - 복 주십시오
  lexicon: HALOT
  rationale: 피엘 미완료/권유형의 축복 발화로서, 한국어에서는 문장 전체를 명령형이 아닌 축복 선언형으로 살려 '복 주시고'로 옮겼습니다. '주시고'는 뒤의 평행구와도 자연스럽게 이어집니다.
- source_word: וְיִשְׁמְרֶךָ
  english_pob_choice: and keep you
  chosen_korean: 지키십니다
  alternatives_korean:
  - 지켜 주십니다
  - 보호하십니다
  - 지키고
  lexicon: HALOT
  rationale: שׁמר의 보호·보전 의미를 반영해 '지키십니다'로 옮겼습니다. 축복문맥의 평행성을 살리면서도 한국어에서 가장 간결하고 자연스러운 보호 의미를 전달합니다.
theological_decisions:
- issue: יהוה의 번역 처리
  chosen_reading: 본문에는 '야훼'를 직접 표기하고, 각주로 원어의 신명성과 영어 전통 번역 관행을 알립니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 언약적 축복의 중심에 하나님의 고유 이름이 직접 나오므로, 직함으로 대치하지 않고 이름을 보존하는 것이 원문의 신학적 긴장을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
