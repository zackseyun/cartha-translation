  source_fidelity: 원문의 두 동사는 모두 3인칭 남성 단수 권유법(축복·기원)이며, 초안의 직설 평서형 ‘복 주시고 지키십니다’는 이 기원적 힘을 충분히 드러내지 못합니다. ‘복을 주시고 … 지켜 주시기를 바랍니다’는 한국어 축복문으로 그 용법을 자연스럽게 보존합니다.
  naturalness: ‘복을 주시고’가 ‘복 주시고’보다 현대 표준 한국어 문장에서는 목적어가 명시되어 더 자연스럽습니다. 또한 ‘당신을 지켜 주시기를 바랍니다’는 합쇼체의 공적·예전적 문체에 맞습니다.
  terminology: יְהוָה는 POB 방침 및 영어 본문의 ‘Yahweh’에 맞추어 ‘야훼’로 유지합니다. 각주의 전통적 대치는 영어의 ‘the LORD’에 상응하도록 한국어에서 ‘주’로 제시하는 편이 ‘주님’보다 정확합니다.
