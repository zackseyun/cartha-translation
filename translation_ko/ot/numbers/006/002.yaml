  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
  footnotes:
  - marker: a
    text: Or 'if a man or a woman sets himself or herself apart by vowing a Nazirite vow.'
    reason: lexical_alternative
  - marker: b
    text: '''Nazirite'' refers to a person specially set apart to the LORD under a vow.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. 남자나 여자가 나실인 서원, 곧 특별한 서원을 하여 야훼께 자신을 구별하여 드리려 할 때에는[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘특별한 서원’은 히브리어의 ‘비범하게/특별히 서원하다’라는 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나실인’은 서원 아래에서 특별히 구별된 사람을 가리키는 기술적 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리면서도 한국어 성경에서 자연스럽고 익숙한 표현으로 옮겼습니다.
- source_word: אִישׁ אוֹ אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자가
  alternatives_korean:
  - 누구든지
  - 사람이
  lexicon: HALOT
  rationale: 남자와 여자를 둘 다 명시하는 원문을 유지해 성별 포괄을 지웠다가 일반화하지 않았습니다.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  english_pob_choice: makes a special vow
  chosen_korean: 특별한 서원을 하여
  alternatives_korean:
  - 특이한 서원을 하여
  - 서원을 하기로 특별히 작정하여
  lexicon: HALOT
  rationale: פלא 계열의 ‘특별함/비범함’과 서원 동사의 연계를 한국어에서 자연스럽게 표현했습니다.
- source_word: נֶדֶר נָזִיר
  english_pob_choice: the vow of a Nazirite
  chosen_korean: 나실인 서원
  alternatives_korean:
  - 나실 서원
  - 나실인의 서원
  lexicon: HALOT
  rationale: 기술적 용어인 נָזִיר를 관용적으로 ‘나실인’으로 옮기고, 서원과의 관계는 한국어에서 간결한 관형 결합으로 드러냈습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 원문의 여호와/야훼 신명은 이 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격은 ‘-께’로 살렸습니다.
theological_decisions:
- issue: 나실인 서원의 성격
  chosen_reading: ‘특별한 서원’과 ‘나실인 서원’을 함께 두어, 단순한 서원 일반이 아니라 구별된 봉헌의 의미를 드러냈습니다.
  alternative_readings:
  - ‘나실인 맹세’
  - ‘나실인 서약’
  rationale: 원문은 서원의 일반어와 나실인 제도를 병렬적으로 보여 주므로, 한국어도 두 층위를 모두 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: 민수기 6장 나실인 규례
- issue: 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יהוה는 일반 호칭이 아니라 언약적 고유명으로 쓰였으므로, 프로젝트 기준에 따라 ‘야훼’로 직역성 있게 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
