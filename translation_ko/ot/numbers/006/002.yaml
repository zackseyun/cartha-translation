  rationale: פלא 계열의 ‘특별함/비범함’과 서원 동사의 연계를 한국어에서 자연스럽게 표현했습니다.
- source_word: נֶדֶר נָזִיר
  english_pob_choice: the vow of a Nazirite
  chosen_korean: 나실인 서원
