  rationale: 남자와 여자를 둘 다 명시하는 원문을 유지해 성별 포괄을 지웠다가 일반화하지 않았습니다.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  english_pob_choice: makes a special vow
  chosen_korean: 특별한 서원을 하여
