  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
  footnotes:
  - marker: a
    text: Or 'if a man or a woman sets himself or herself apart by vowing a Nazirite vow.'
    reason: lexical_alternative
  - marker: b
    text: '''Nazirite'' refers to a person specially set apart to the LORD under a vow.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. 남자나 여자가 야훼께 자신을 구별하려고 특별한 서원[a], 곧 나실인의 서원[b]을 하려 할 때에는
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘특별한 서원’은 히브리어 표현이 지닌 ‘비범하게/특별히 서원하다’라는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나실인’은 서원 아래에서 특별히 구별된 사람을 가리키는 기술적 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
