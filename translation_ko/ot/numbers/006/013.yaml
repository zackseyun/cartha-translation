  rationale: נֵזֶר/נִזְרוֹ의 핵심은 하나님께 구별되어 떨어져 있는 상태이므로, '분리'로 옮겨 언어적 뿌리를 살렸습니다. '서원'은 해석을 더 덧붙일 수 있어 본문에는 덜 직접적입니다.
- source_word: יָבִיא אֹתֹו
  english_pob_choice: he shall be brought
  chosen_korean: 그는 회막의 입구로 데려와져야 합니다
  alternatives_korean:
