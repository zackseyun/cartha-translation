  - 규정
  - 지침
  lexicon: HALOT
  rationale: 제의·법률 문맥의 תּוֹרָה는 여기서 특정 의식 규정을 가리키므로, 표준적인 '율법'으로 옮겼습니다.
- source_word: הַנָּזִיר
  english_pob_choice: the Nazirite
  chosen_korean: 나지르
  alternatives_korean:
  - 나실인
  - 나실인 사람
  - 서원으로 구별된 사람
  lexicon: HALOT
  rationale: 기술 용어 נָזִיר은 제도명 자체를 보존하는 것이 중요하므로 음역형을 택했습니다. 전통적 '나실인'도 가능하지만, 본문 전체의 기술적 범주를 더 직접적으로 드러내는 형태를 우선했습니다.
- source_word: יְמֵי נִזְרוֹ
  english_pob_choice: the days of his separation
  chosen_korean: 분리의 날들
  alternatives_korean:
  - 그의 나지르 서원의 날들
  - 그의 구별의 기간
  - 서원의 기간
  lexicon: HALOT
  rationale: נֵזֶר/נִזְרוֹ의 핵심은 하나님께 구별되어 떨어져 있는 상태이므로, '분리'로 옮겨 언어적 뿌리를 살렸습니다. '서원'은 해석을 더 덧붙일 수 있어 본문에는 덜 직접적입니다.
- source_word: יָבִיא אֹתֹו
  english_pob_choice: he shall be brought
  chosen_korean: 그는 회막의 입구로 데려와져야 합니다
  alternatives_korean:
  - 그는 회막의 입구로 데려가야 합니다
  - 그를 회막의 입구로 데려와야 합니다
  - 누군가 그를 회막의 입구로 데려가야 합니다
  lexicon: HALOT
  rationale: 히브리어는 형식상 능동이지만 주어가 명시되지 않아, 절차적 의미를 살리되 한국어에서는 피동적 표현이 자연스럽습니다. 다만 주어의 अस्प명성을 숨기지 않도록 '데려와져야 합니다'로 옮겼습니다.
theological_decisions:
- issue: 나지르 제도와 '분리'의 의미
  chosen_reading: 전문 용어 '나지르'는 보존하고, נִזְרוֹ는 '분리'로 옮겨 구별된 헌신의 의미를 드러냅니다.
  alternative_readings:
  - '''나지르 서원''으로 일괄 번역'
  - '''구별''이나 ''성별''로 번역'
  rationale: 본문은 특정 제도명을 말하면서도 그 신학적 핵심은 '구별됨'에 있으므로, 용어 보존과 의미 전달을 함께 살리는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
