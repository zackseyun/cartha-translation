  source_fidelity: 히브리어의 יָבִיא אֹתוֹ는 능동형이며 목적어는 나실인입니다. 초안의 피동형 ‘데려와져야 합니다’는 원문의 능동형과 주어 미표시라는 모호성을 충분히 보존하지 못합니다. 또한 ‘그가 분리의 날들이 끝나는 날’은 한국어 문법상 부자연스럽습니다.
  naturalness: ‘나지르’, ‘분리의 날들’, ‘데려와져야 합니다’는 현대 표준 한국어의 성서적 법규 문맥에서 다소 낯설거나 어색합니다. ‘나실인’, ‘구별 기간’, ‘데려와야 합니다’가 자연스럽고 의미도 보존합니다.
  terminology: נָזִיר는 한국어 성서 용례에 맞추어 ‘나실인’으로 통일하는 것이 적절합니다. נִזְרוֹ는 기술 용어 자체를 반복하기보다 ‘그의 구별 기간’으로 옮기고, 가능한 대안을 각주에 제시합니다. תּוֹרַת는 특정 의례 규정이라는 문맥에 맞게 ‘율례’로 옮깁니다.
  issues:
