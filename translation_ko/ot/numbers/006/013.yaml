    rationale: 히브리어는 능동형 ‘그를 데려올 것이다/데려와야 한다’이며 주어만 명시되지 않았습니다. 한국어에서도 ‘그를 … 데려와야 합니다’로 옮기면 주어의 미표시를 유지하면서 원문의 능동성을 보존할 수 있습니다.
