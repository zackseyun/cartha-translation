source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
  footnotes:
  - marker: a
    text: Or, more formally, 'he shall bring him to the entrance of the tent of meeting.' The Hebrew verb is active ('bring'), but the subject is not explicit in the verse.
    reason: lexical_alternative
  - marker: b
    text: '''The days of his separation'' may also be rendered ''the days of his Nazirite vow'' or ''the period of his consecration.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 나실인에 관한 율례입니다. 그의 구별 기간이 차는 날에, 그를 회막 어귀로 데려와야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘그를 회막 어귀로 데려올 것입니다.’ 히브리어 동사는 능동형이지만, 이 절에서는 그 주어가 명시되어 있지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 구별 기간’은 ‘그의 나실인 서원의 날들’ 또는 ‘그의 성별 기간’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/זֹאת
  english_pob_choice: And this is
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 이것은
  - 이제 이것은
  lexicon: HALOT
  rationale: 법규를 도입하는 연결어 ו와 지시어를 살려, 규정 문맥의 형식을 자연스럽게 유지했습니다.
- source_word: תּוֹרַת
  english_pob_choice: the law of
  chosen_korean: 율법
  alternatives_korean:
