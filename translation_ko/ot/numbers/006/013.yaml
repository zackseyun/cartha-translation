  - 누군가 그를 회막의 입구로 데려가야 합니다
  lexicon: HALOT
  rationale: 히브리어는 형식상 능동이지만 주어가 명시되지 않아, 절차적 의미를 살리되 한국어에서는 피동적 표현이 자연스럽습니다. 다만 주어의 अस्प명성을 숨기지 않도록 '데려와져야 합니다'로 옮겼습니다.
theological_decisions:
- issue: 나지르 제도와 '분리'의 의미
  chosen_reading: 전문 용어 '나지르'는 보존하고, נִזְרוֹ는 '분리'로 옮겨 구별된 헌신의 의미를 드러냅니다.
  alternative_readings:
  - '''나지르 서원''으로 일괄 번역'
  - '''구별''이나 ''성별''로 번역'
  rationale: 본문은 특정 제도명을 말하면서도 그 신학적 핵심은 '구별됨'에 있으므로, 용어 보존과 의미 전달을 함께 살리는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
