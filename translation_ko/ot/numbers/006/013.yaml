revisions:
- from: 그리고 이것은 나지르에 관한 율법입니다. 그가 분리의 날들이 끝나는 날, 그는 회막의 입구로 데려와져야 합니다.[a][b]
  to: 그리고 이것은 나실인에 관한 율례입니다. 그의 구별 기간이 차는 날에, 그를 회막 어귀로 데려와야 합니다.[a][b]
  rationale: 수정문은 법규를 도입하는 접속 표현을 ‘그리고 이것은’으로 보존하고, נָזִיר는 통용 한국어 성서 용어인 ‘나실인’으로 옮겼습니다. מְלֹאת יְמֵי נִזְרוֹ는 ‘그의 구별 기간이 차는 날’로 자연스럽게 표현했습니다. 마지막 절은 원문의 능동형과 미표시 주어를 보존하도록 ‘그를 … 데려와야 합니다’로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:53Z'
