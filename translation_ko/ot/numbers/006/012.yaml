id: NUM.6.12
reference: Numbers 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
  footnotes:
  - marker: a
    text: Or 'the days of his separation' or 'the days of his consecration.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the first days shall fall'; that is, the earlier days of the vow no longer count.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 나실인 서약의 날들[a]을 야훼께 다시 바쳐야 하며, 일 년 된 수컷 어린양을 속건제물로 가져와야 합니다. 그러나 이전의 날들[b]은 무효가 됩니다. 그의 나실인 서약이 더러워졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 구별의 날들’, ‘그의 봉헌의 날들’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 첫날들이 떨어질 것이다’라는 뜻으로, 앞선 날들이 더 이상 유효하지 않다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  english_pob_choice: he shall rededicate
  chosen_korean: 야훼께 다시 바쳐야 하며
  alternatives_korean:
  - 야훼께 다시 구별해야 하며
  - 야훼께 다시 성별해야 하며
  lexicon: HALOT
  rationale: 히필형 נזר는 나실인 규례에서 이미 중단된 구별 기간을 다시 시작하게 하는 뜻이므로, ‘다시 바치다’로 재헌신의 뉘앙스를 살렸습니다.
- source_word: יְמֵי נִזְרוֹ
  english_pob_choice: the days of his Nazirite vow
  chosen_korean: 자신의 나실인 서약의 날들
  alternatives_korean:
  - 자신의 구별의 날들
  - 자신의 봉헌의 날들
  lexicon: HALOT
  rationale: 문맥상 기술적 용어인 나실인 제도를 가리키므로, ‘서약’과 ‘나실인’을 함께 써 제도적 의미를 분명히 했습니다.
- source_word: לְאָשָׁם
  english_pob_choice: as a guilt offering
  chosen_korean: 속건제물로
  alternatives_korean:
  - 속죄제물로
  - 배상제물로
  lexicon: HALOT
  rationale: אָשָׁם의 표준 제사 명칭을 따르되, 한국어 성경 용례와 제사 범주를 고려해 ‘속건제물’로 옮겼습니다.
- source_word: יִפְּלוּ
  english_pob_choice: shall be void
  chosen_korean: 무효가 되는데
  alternatives_korean:
  - 헛되게 되는데
  - 사라지는데
  lexicon: HALOT
  rationale: 직역하면 ‘떨어지다’이지만, 앞선 날들이 더 이상 계산되지 않는 법적 효과를 나타내므로 ‘무효가 되다’가 가장 분명합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 학술적 전사인 ‘야훼’로 옮겨, 본문의 직접적 신명성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 나실인 규례의 기술어 처리
  chosen_reading: 나실인 서약
  alternative_readings:
  - 나실인 구별
  - 나실인 봉헌
  rationale: נזר 계열 어휘는 여기서 일반적 ‘구별’보다 제도명으로 기능하므로, 독자가 율법 조항의 기술적 성격을 바로 인식하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
