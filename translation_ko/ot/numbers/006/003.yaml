source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
  footnotes:
  - marker: a
    text: Or 'any steeped liquid of grapes' or 'any grape juice'; the Hebrew term may refer broadly to liquid derived from soaked or processed grapes.
    reason: lexical_alternative
  - marker: b
    text: Or 'grapes, fresh or raisins.' The Hebrew literally says 'grapes, fresh and dried.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 포도주와 독주를 삼가야 합니다. 포도주로 만든 식초나 독주로 만든 식초를 마시지 말아야 하며, 어떤 포도즙도 마시지 말고 신선한 포도나 말린 포도도 먹지 말아야 합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도에서 우린 액체’ 또는 ‘포도즙’입니다. 히브리어 단어는 포도를 담가 우려낸 액체를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포도, 신선한 것과 말린 것’입니다. 히브리어는 문자적으로 ‘포도, 신선한 것과 마른 것’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  english_pob_choice: he shall abstain from wine and strong drink
  chosen_korean: 그는 포도주와 독주를 멀리해야 합니다
  alternatives_korean:
  - 그는 포도주와 독주를 삼가야 합니다
  - 그는 포도주와 독주를 끊어야 합니다
  lexicon: HALOT
  rationale: יַזִּיר은 나실인 규정에서 특정 음료를 ‘떼어 놓고 abstain’하는 뜻이므로, 현대 한국어에서는 ‘멀리해야 합니다’가 금지와 분리의 의미를 자연스럽게 살립니다.
- source_word: וְשֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 도수 높은 술
  - 강한 술
  lexicon: HALOT
  rationale: שֵׁכָר는 포도주와 구별되는 취하게 하는 음료를 가리키므로, 전통적 교회어 ‘독주’가 구별성과 금주 맥락을 가장 간결하게 전달합니다.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  english_pob_choice: vinegar made from wine / vinegar made from strong drink
  chosen_korean: 포도주 식초나 독주 식초
  alternatives_korean:
  - 포도주로 만든 식초나 독주로 만든 식초
  - 포도주의 식초나 독주의 식초
  lexicon: HALOT
  rationale: חֹמֶץ는 식초/신 포도주를 뜻하며, 영어 주석처럼 현대의 조미료 ‘식초’로 오해하지 않도록 원료를 붙여 ‘포도주 식초’, ‘독주 식초’로 옮겼습니다.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  english_pob_choice: any juice of grapes
  chosen_korean: 포도즙
  alternatives_korean:
  - 포도의 우린 즙
  - 포도를 우린 액체
  lexicon: HALOT
  rationale: מִשְׁרָה는 담가 우린 액체까지 포함할 수 있지만, 포도 관련 음료 금지의 폭을 자연스럽게 드러내는 현대어로는 ‘포도즙’이 가장 읽기 쉽습니다.
- source_word: לַחִים וִיבֵשִׁים
  english_pob_choice: fresh or dried
  chosen_korean: 포도도 먹지 말아야 합니다
  alternatives_korean:
  - 생포도나 말린 포도도 먹지 말아야 합니다
  - 포도, 생것이나 말린 것까지도 먹지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘신선한 것과 마른 것’을 병렬로 두어 포도 전체를 금지하므로, 본문 의미를 간명하게 살려 포도 자체를 금지하는 문장으로 정리했습니다.
theological_decisions:
- issue: 나실인 서원의 금지 범위 표현
  chosen_reading: 음료뿐 아니라 발효 부산물과 포도 관련 모든 형태를 포함하는 금지로 읽었습니다.
  alternative_readings:
  - 단순히 술만 금하는 제한으로 읽을 수 있음
  - 식초와 포도즙은 제외되는 것으로 볼 수 있음
  rationale: 본문이 포도주, 독주, 그 식초, 포도에서 우린 액체, 생포도와 말린 포도까지 차례로 확장하므로, 절제의 범위가 매우 넓다는 점을 드러내는 번역이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 민수기 6장 나실인 규례
- issue: register
  chosen_reading: 직설적 규정문으로 번역해 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘그는…’을 더 엄격한 법문체로 옮길 수 있음
  - 서원 문맥을 살려 더 의례적 어조를 사용할 수 있음
  rationale: 본문은 제의 규정의 명령형 설명문이므로, 현대 표준어 합쇼체로 간결하고 법규적 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 민수기 6:1-21
