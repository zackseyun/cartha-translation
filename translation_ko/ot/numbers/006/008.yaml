  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'his Nazirite vow' or 'his consecration.' The Hebrew term refers to the state of being set apart as a Nazirite.
