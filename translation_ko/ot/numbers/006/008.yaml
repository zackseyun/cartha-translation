translation:
  language: ko
  text: 그가 나실인으로 구별되어 있는 모든 날 동안, 그는 야훼께 거룩합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִזְרוֹ는 ‘그의 나실인 서원’, ‘그의 나실인으로서의 구별된 상태’, 또는 ‘그의 헌신’으로도 옮길 수 있습니다. 여기서는 나실인으로 구별된 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  english_pob_choice: All the days of
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 그 모든 날 동안
  - 그의 구별의 기간 내내
  lexicon: HALOT
  rationale: יכל/ימים의 전체 기간을 가리키는 포괄성을 한국어의 자연스러운 시간 표현으로 옮겼습니다.
- source_word: נִזְרוֹ
  english_pob_choice: his separation
  chosen_korean: 구별
  alternatives_korean:
  - 나실인 서원
  - 헌신
  lexicon: HALOT
  rationale: 문맥상 서원 행위 자체보다 나실인의 분리된 상태를 가리키므로, 상태를 드러내는 ‘구별’로 옮겼습니다.
- source_word: קָדֹשׁ
  english_pob_choice: holy
  chosen_korean: 거룩합니다
  alternatives_korean:
  - 성별됩니다
  - 구별됩니다
  lexicon: HALOT
  rationale: 단순한 기능적 분리보다 야훼께 속한 성결의 진술이므로, 신학적 무게를 보존하는 ‘거룩합니다’를 선택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: יהוה의 고유명을 본문 차원에서 드러내기 위해 ‘야훼께’로 옮겼습니다.
theological_decisions:
- issue: 나실인의 상태와 야훼께 대한 소속을 구분하는 표현
  chosen_reading: ‘구별의 모든 날’과 ‘야훼께 거룩합니다’로 나누어, 기간의 구별 상태와 결과적 거룩성을 함께 살렸습니다.
  alternative_readings:
  - ‘나실인의 서원 기간 내내 그는 야훼께 거룩합니다’
  - ‘그의 나실인 서원 동안 그는 성별됩니다’
  rationale: 히브리어는 상태(נזר)와 결과(קדוש) 를 병렬로 말하므로, 둘을 합치거나 약화시키지 않고 구분해 번역했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 나실인 규례의 상태/결과 구분
