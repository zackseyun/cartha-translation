  language: ko
  text: 야훼께서 모세에게 말씀하여 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 영어 역본에서 ‘the LORD’로 옮기기도 합니다.
