lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And ... spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol 동사와 뒤따르는 לֵאמֹר 공식은 단순한 ‘말하다’보다 격식을 갖춘 발화 도입을 나타내므로, ‘말씀하여 이르셨습니다’로 자연스럽고도 형식 있게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 관용적 대체어가 아니라 고유명으로 처리해야 하므로, POB의 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게
  - 을/를 향해
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 전치사는 한국어에서 자연스럽게 조사 ‘-에게’로 대응시켰습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 발화 도입구는 한국어에서 ‘...에게 이르시되’ 계열이 가장 직접적으로 대응되므로, 뒤의 내용 도입을 예고하는 기능을 살려 정리했습니다.
theological_decisions:
- issue: YHWH 신명 처리
  chosen_reading: ‘the LORD’ 대신 고유명 ‘야훼’를 본문에 사용합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 계약의 고유한 신명 יְהוָה를 직접 사용하므로, 직함으로 치환하지 않고 음역을 유지해 원문이 주는 인칭성과 언약성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
