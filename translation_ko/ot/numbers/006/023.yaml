translation:
  language: ko
  text: 아론과 그의 아들들에게 말하십시오. ‘너희는 이렇게 이스라엘 자손[a]을 축복해야 합니다. 그들에게 말하십시오.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘의 아들들”입니다. 문맥상 관용적으로는 “이스라엘 사람들” 또는 “이스라엘 백성”이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르십시오
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 명령형 דבר을 한국어 지시문답게 옮기되, 이어지는 인용문 도입을 자연스럽게 보여 주기 위해 ‘말하여 이르십시오’를 택했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 후손들
  lexicon: HALOT
  rationale: 문맥상 아론의 남성 제사장 후손을 가리키므로, 보다 넓은 ‘자녀들’보다 직역에 가까운 ‘아들들’이 원문 구조를 더 잘 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살리되 한국어에서 자연스럽고 관용적인 성경 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: תְבָרֲכוּ
  english_pob_choice: you shall bless
  chosen_korean: 축복해야 합니다
  alternatives_korean:
  - 축복해야 하십시오
  - 축복할 것입니다
  lexicon: HALOT
  rationale: 제사장에게 주어진 규정적 지시이므로 단순 미래보다 의무·규범의 힘이 살아 있는 표현을 택했습니다.
- source_word: אָמֹור לָהֶם
  english_pob_choice: say to them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
  - 그들에게 이르십시오
  - 그들에게 말씀하십시오
  lexicon: HALOT
  rationale: 반복되는 전언 지시를 한국어에서 자연스럽게 처리하면서도, 뒤따를 축복문을 직접 전달하라는 명령을 분명히 보존했습니다.
theological_decisions:
- issue: 성경적 축복 공식의 명령형 톤
  chosen_reading: ‘너희는 이렇게 … 축복해야 합니다’
  alternative_readings:
  - ‘너희는 이렇게 … 축복할 것입니다’
  - ‘이와 같이 … 축복하십시오’
  rationale: 본문은 제사장적 축복의 규정적 절차를 제시하므로, 단순 예언적 미래보다 명령·규범의 성격을 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy, optimal equivalence
