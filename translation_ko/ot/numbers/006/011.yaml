  to: 제사장은 하나는 속죄제물로, 하나는 번제물로 드리고[a], 그 사람이 죽은 사람과 관련하여 죄를 지은 일에 대하여 그를 위하여 속죄해야 합니다[b]. 그리고 그날 그 사람의 머리를 거룩하게 구별해야 합니다.
