    rationale: נֶפֶשׁ는 이 문맥에서 죽은 사람을 가리키며, ‘영혼/생명’만을 제시하면 본문 용법을 흐립니다. 전치사 עַל을 포함한 ‘그 사람 위에’라는 형태를 제시한 뒤 문맥상 의미를 설명하는 편이 낫습니다.
