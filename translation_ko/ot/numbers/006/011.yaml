id: NUM.6.11
reference: Numbers 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
  footnotes:
  - marker: a
    text: Or 'one for a purification offering.' The Hebrew term חַטָּאת can denote the sin/purification offering, especially in ritual-impurity contexts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the נפשׁ'; here, in context, it refers to a dead person, that is, a corpse that caused defilement.
    reason: cultural_note
translation:
  language: ko
  text: 제사장은 하나를 속죄제물로, 하나를 번제물로 드리고[a], 그가 시체와 관련하여 죄를 지었기 때문에[b] 그를 위하여 속죄해야 합니다. 그리고 그날 그의 머리를 거룩하게 구별해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물’. 히브리어 חַטָּאת는 죄를 다루는 제물뿐 아니라 부정에서 정결하게 하는 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 영혼/생명 위에’이지만, 이 문맥에서는 정결을 더럽히게 한 죽은 사람, 곧 시체를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְעָשָׂה
  english_pob_choice: shall offer
  chosen_korean: 드리고
  alternatives_korean:
  - 바치고
  - 드리고 바치고
  lexicon: HALOT
  rationale: 제의 문맥에서 ‘하다/만들다’의 관용적 의미는 제물을 ‘드리다’로 자연스럽게 옮기는 것이 가장 직접적입니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 정결제물
  lexicon: HALOT
  rationale: 히브리어 חַטָּאת는 문맥상 죄와 정결을 다루는 제물을 가리키므로, 표준 교회어인 ‘속죄제물’을 쓰되, 단순한 ‘죄’가 아니라 제의적 속죄를 드러내도록 했습니다.
- source_word: עַל הַנָּפֶשׁ
  english_pob_choice: in regard to the dead person
  chosen_korean: 시체와 관련하여
  alternatives_korean:
  - 죽은 사람과 관련하여
  - 시체 때문에
  - 죽은 몸 때문에
  lexicon: HALOT
  rationale: 나실인 규례의 문맥에서 הַנֶּפֶשׁ는 정결을 더럽히는 죽은 몸을 가리키는 관용구이므로, 의미를 분명히 하는 방향으로 옮겼습니다.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  english_pob_choice: and he shall consecrate his head
  chosen_korean: 그의 머리를 거룩하게 구별해야 합니다
  alternatives_korean:
  - 그의 머리를 구별해야 합니다
  - 그의 머리를 성별해야 합니다
  - 그의 머리를 다시 거룩하게 해야 합니다
  lexicon: HALOT
  rationale: 나실인의 머리는 서원으로 구별된 상태를 상징하므로, 단순히 ‘성별하다’보다 ‘거룩하게 구별하다’가 의미와 한국어 자연성을 함께 살립니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제물
  alternative_readings:
  - 정결제물
  rationale: 이 절은 죽음으로 인한 부정의 정화 맥락을 지니지만, 한국어 성경 전통에서 널리 통용되는 제의 용어를 유지하되, ‘제물’로 풀어 제의적 기능을 분명히 했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 나실인 머리의 ‘거룩하게 구별함’
  chosen_reading: 서원으로 다시 구별된 상태를 회복하는 제의 행위
  alternative_readings:
  - 단순 정결 예식
  - 재헌납
  rationale: 본문의 동사는 단순한 정결이 아니라 나실인의 서원 표지를 다시 성별하는 행위이므로, ‘거룩하게 구별하다’로 제의적·서원적 의미를 함께 보존했습니다.
  doctrine_reference: 민수기 6장 나실인 규례
