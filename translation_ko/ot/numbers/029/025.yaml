  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 속죄제물로 숫염소 한 마리를, 정기 번제와 그 소제와 그 전제 외에 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정기 번제’는 ‘늘 드리는 번제’ 또는 ‘계속 드리는 번제’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  english_pob_choice: and one male goat
  chosen_korean: 숫염소 한 마리
  alternatives_korean:
  - 염소 한 마리
  - 수염소 한 마리
  lexicon: HALOT
  rationale: 제사 문맥의 שׂעיר עזים은 수컷 염소를 가리키므로, 현대 한국어에서 자연스럽고 분명한 ‘숫염소 한 마리’로 옮겼습니다.
- source_word: חַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 죄제를 위한
  lexicon: HALOT
  rationale: 이 단어는 כאן 추상적 죄가 아니라 제의적 속죄제물을 가리키므로, 제사 항목으로서의 기능을 드러내는 ‘속죄제물로’가 적절합니다.
- source_word: עֹלַת הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 매일 드리는 번제
  alternatives_korean:
  - 늘 드리는 번제
  - 계속 드리는 번제
  lexicon: HALOT
  rationale: תמיד는 여기서 반복되는 정규 제사를 뜻하므로, 한국어에서 의미가 분명한 ‘매일 드리는 번제’로 옮겼습니다.
- source_word: מִנְחָתָהּ וְנִסְכָּהּ
  english_pob_choice: its grain offering, and its drink offering
  chosen_korean: 그 소제와 그 전제
  alternatives_korean:
  - 그 곡식제물과 그 전제제물
  - 그 곡식예물과 그 술제물
  lexicon: HALOT
  rationale: 제의 용례를 따라 מִנְחָה는 ‘소제’, נֶסֶךְ은 ‘전제’로 옮겨, 제사 항목의 관용적 대응을 유지했습니다.
theological_decisions:
- issue: 문장의 제의적 추가 관계
  chosen_reading: 이 희생은 정규 번제에 더해 드리는 추가 제물로 표현했습니다.
  alternative_readings:
  - 정규 번제의 일부로 볼 수 있음
  - 번제 자체를 다시 설명하는 것으로 볼 수 있음
  rationale: מִלְּבַד는 ‘~외에/별도로’라는 추가 관계를 분명히 하므로, 본문 구조대로 독립된 추가 제물임을 살렸습니다.
  doctrine_reference: 민수기 28–29장의 절기 제물 배열
- issue: ‘전제’의 전통적 제의어 유지
  chosen_reading: 현대어의 직관성보다 제의 문맥의 연속성을 위해 ‘전제’를 유지했습니다.
  alternative_readings:
  - 술제물
  - 부어 드리는 제물
  rationale: 본문은 소제와 전제가 나란히 오는 정형 표현이므로, 제의 용어의 대응성을 보존하는 쪽이 본문 이해에 유리합니다.
  doctrine_reference: 제사 제도 용어의 일관성
