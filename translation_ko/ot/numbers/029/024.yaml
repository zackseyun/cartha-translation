  - 그 수대로, 정해진 절차에 따라
  lexicon: HALOT
  rationale: מִסְפָּר은 단순한 수량이고, מִשְׁפָּט은 제의법의 정해진 규례/절차를 뜻하므로 두 표현을 구분해 살렸습니다.
theological_decisions:
- issue: מִשְׁפָּט의 제의적 의미
  chosen_reading: 규례에 따라
  alternative_readings:
