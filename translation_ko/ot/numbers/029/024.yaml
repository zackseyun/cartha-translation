translation:
  language: ko
  text: 그리고 그들의 곡식제물과 그들의 전제는 수소들을 위하여, 숫양들을 위하여, 그리고 어린양들을 위하여, 그 수에 따라, 규례에 따라 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
