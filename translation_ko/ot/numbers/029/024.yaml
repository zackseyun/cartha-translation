  - 법도에 따라
  rationale: 이 문맥의 מִשְׁפָּט은 일반적 '판결'이 아니라 이미 확립된 제의 규범을 가리키므로, 현대 한국어에서 그 의미를 가장 간결하게 드러내는 '규례'를 택했습니다.
