    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  english_pob_choice: their grain offerings
  chosen_korean: 그들의 곡식제물
  alternatives_korean:
  - 그들의 소제물
  - 그들의 제물
  lexicon: HALOT
  rationale: 제의 문맥에서 מִנְחָה는 일반적 '제물'보다 곡식제물을 가리키므로, POB의 의미를 따라 곡식제물로 옮겼습니다.
- source_word: וְנִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제
  alternatives_korean:
  - 그들의 마시는 제물
  - 그들의 술제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 붓는 제의 행위와 관련된 전제를 뜻하므로, 전통적이면서도 원어의 제의적 성격을 살려 전제로 번역했습니다.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  english_pob_choice: for the bulls, for the rams, and for the lambs
  chosen_korean: 수소들을 위하여, 숫양들을 위하여, 그리고 어린양들을 위하여
  alternatives_korean:
  - 황소들을 위하여, 숫양들을 위하여, 그리고 어린양들을 위하여
  - 수송아지들을 위하여, 숫양들을 위하여, 그리고 어린양들을 위하여
  lexicon: HALOT
  rationale: 각 제물에 대한 분배 관계를 나타내는 ל를 '...을 위하여'로 자연스럽게 풀었고, פָּרִים는 제의 맥락상 수소들로 옮겼습니다.
- source_word: בְּמִסְפָּרָם כַּמִּשְׁפָּט
  english_pob_choice: according to their number, according to the ordinance
  chosen_korean: 그 수에 따라, 규례에 따라
  alternatives_korean:
  - 그 숫자에 따라, 정해진 규정에 따라
  - 그 수대로, 정해진 절차에 따라
  lexicon: HALOT
  rationale: מִסְפָּר은 단순한 수량이고, מִשְׁפָּט은 제의법의 정해진 규례/절차를 뜻하므로 두 표현을 구분해 살렸습니다.
theological_decisions:
- issue: מִשְׁפָּט의 제의적 의미
  chosen_reading: 규례에 따라
  alternative_readings:
  - 정해진 절차에 따라
  - 법도에 따라
  rationale: 이 문맥의 מִשְׁפָּט은 일반적 '판결'이 아니라 이미 확립된 제의 규범을 가리키므로, 현대 한국어에서 그 의미를 가장 간결하게 드러내는 '규례'를 택했습니다.
  doctrine_reference: 제의 율법의 정당성과 질서
