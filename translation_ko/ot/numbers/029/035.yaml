translation:
  language: ko
  text: 여덟째 날에는 너희에게 거룩한 집회가 있어야 하며, 너희는 일상 노동을 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종결 집회’. 히브리어 עֲצֶרֶת은 절기 마지막을 맺는 집회를 가리킬 수 있습니다.
    reason: lexical_alternative
