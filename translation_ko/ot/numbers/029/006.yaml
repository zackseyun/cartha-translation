theological_decisions:
- issue: 아로마 공식의 의미
  chosen_reading: ‘향기로운 냄새’로 옮겨, 제사가 하나님께 받아들여지는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘기쁘게 하는 향기’
  - ‘달콤한 향기’
  rationale: לְרֵיחַ נִיחֹחַ는 단순한 냄새 묘사가 아니라 받아들여짐을 나타내는 제의적 공식이므로, 한국어에서 익숙하면서도 의미를 덜 약화시키는 표현을 택했습니다.
  doctrine_reference: 제의 용어 일관성 및 수용성 원칙
- issue: אִשֶּׁה의 한국어 전통 번역 처리
  chosen_reading: ‘화제’로 두어 제물의 불살라 드림이라는 제의적 성격을 유지했습니다.
  alternative_readings:
  - ‘불로 드리는 제물’
  - ‘불살라 드리는 제물’
  rationale: 영어 POB의 ‘food offering’은 현대적 풀이지만, 한국어에서는 오해 소지가 있어 원어의 제의적 고정구를 더 직접적으로 반영하는 표현이 적절합니다.
  doctrine_reference: 원어-직역 우선 및 제의어 보존 원칙
