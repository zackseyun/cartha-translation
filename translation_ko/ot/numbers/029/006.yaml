    issue: ‘외에’의 수식 범위가 전제들로 한정되어 보입니다.
    rationale: מִלְּבַד은 뒤따르는 ‘달의 번제와 그 소제, 늘 드리는 번제와 그 소제와 그 전제들’ 전체를 추가·제외 기준으로 삼습니다. ‘그 전제들 외에’는 한국어상 바로 앞 명사만 수식하는 것으로 읽히기 쉽습니다.
  - severity: medium
    issue: ‘향기로운 냄새가 되는’은 לְרֵיחַ נִיחֹחַ의 제의 공식과 한국어 문법을 충분히 반영하지 못합니다.
    rationale: 이 구는 제물이 야훼께 받아들여짐을 나타내는 ‘향기로운 냄새를 위한’이라는 목적적 제의 공식입니다. 수정문은 이를 과도한 신학적 해석 없이 자연스럽게 처리합니다.
  - severity: medium
    issue: 신명 표기가 영어 POB 감사 기록의 ‘Yahweh’와 불일치합니다.
    rationale: 원문은 יְהוָה를 사용하며, 제공된 영어 POB의 최신 결정은 Yahweh입니다. 한국어 음역 ‘야훼’가 이를 직접적으로 반영합니다.
  - severity: low
