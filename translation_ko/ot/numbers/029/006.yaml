base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'an offering by fire' or 'a fire offering.'
    reason: lexical_alternative
  - marker: b
    text: '''The burnt offering of the month'' likely refers to the offering for the new moon; the Hebrew wording is literally ''of the month.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 달의 번제와 그 소제와, 정규 번제와 그 소제와, 그 전제들 외에, 규례대로, 향기로운 냄새가 되는 여호와께 드리는 화제입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달의 번제’는 문자적으로는 ‘달의’이지만, 문맥상 월삭 제사를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화제’는 전통적 표현으로, 문자적으로는 ‘불로 드리는 제물’입니다.
    reason: lexical_alternative
