  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their drink offerings'; the plural likely refers to the drink offerings belonging to the set of prescribed offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 속죄제물로 숫염소 한 마리와, 상번제와 그 소제와 그 전제는 별도로 드립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 전제들’로 되어 있는데, 아마도 정해진 제사들에 딸린 전제들을 가리키는 복수 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘늘 드리는 번제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  english_pob_choice: and one male goat
  chosen_korean: 숫염소 한 마리
  alternatives_korean:
  - 수염소 한 마리
  - 염소 수컷 한 마리
  lexicon: HALOT
  rationale: 제사 문맥의 표준 표현인 ‘male goat’를 한국어 제사 용어에 맞게 자연스럽게 옮겼습니다. ‘숫염소’는 간결하면서도 성별이 분명합니다.
- source_word: חַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제로
  - 죄를 위한 제물로
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘죄’보다 제사 명칭인 속죄제를 가리키므로, 기능을 드러내는 ‘속죄제물’이 적절합니다.
- source_word: מִלְּבַד
  english_pob_choice: besides
  chosen_korean: 별도로
  alternatives_korean:
  - 이외에
  - 외에
  lexicon: HALOT
  rationale: 이 제사가 상번제와 그 부속 제사들에 덧붙는다는 점을 분명히 하면서도 현대 한국어에서 자연스럽게 들리는 표현입니다.
- source_word: עֹלַת הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 상번제
  alternatives_korean:
  - 항상 드리는 번제
  - 늘 드리는 번제
  lexicon: HALOT
  rationale: 제사 맥락에서 관용적으로 쓰이는 ‘tamid’의 의미를 살려, 지속적으로 드리는 번제를 가리키는 전통적이면서도 이해 가능한 용어를 사용했습니다.
- source_word: וּמִנְחָתָהּ וְנִסְכֵּיהֶם
  english_pob_choice: and its grain offering and their drink offerings
  chosen_korean: 그 소제와 그 전제
  alternatives_korean:
  - 그 곡식 제물과 그 전제
  - 그 소제와 그 붓는 제물
  lexicon: HALOT
  rationale: מנחה는 제사 문맥에서 ‘소제’가 적절하고, נסכים는 제의적 ‘전제’를 뜻하므로 전통적 제사 용어를 유지했습니다. 복수형 ‘their’는 한국어에서 자연스럽게 집합적 표현으로 처리했습니다.
theological_decisions:
- issue: 상번제의 번역
  chosen_reading: ‘상번제’로 옮겨, 지속적·정기적 제사의 의미를 유지했습니다.
  alternative_readings:
  - ‘항상 드리는 번제’
  - ‘계속 드리는 번제’
  rationale: 본문의 הַתָּמִיד는 단순히 한 번의 번제가 아니라 정기적으로 반복되는 제의 전체를 가리키므로, 한국어 성경에서 널리 통용되는 ‘상번제’가 의미를 가장 압축적으로 보존합니다.
  doctrine_reference: 민수기 제사 규례 문맥
