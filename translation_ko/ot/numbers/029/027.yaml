translation:
  language: ko
  text: 또한 그들의 곡식 제물과 전제는 수소들과 숫양들과 어린양들을 위하여, 그 수에 따라 규례대로[a] 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
