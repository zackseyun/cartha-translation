source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
  footnotes:
  - marker: a
    text: Or 'according to the prescribed manner.' The Hebrew כַּמִּשְׁפָּט refers to the established rule or procedure for these offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 곡식제물과 그들의 전제는 수소들을 위하여, 숫양들을 위하여, 그리고 어린 양들을 위하여, 그 수효대로, 규례에 따라 함께 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 방식에 따라’입니다. 히브리어 כַּמִּשְׁפָּט는 이 제물들에 대해 확립된 규범이나 절차를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  english_pob_choice: their grain offering
  chosen_korean: 그들의 곡식제물
  alternatives_korean:
  - 그들의 제물
  - 그들의 소제물
  lexicon: HALOT
  rationale: 제의 문맥에서 מִנְחָה는 일반적 ‘제물’보다 곡물로 드리는 제물을 가리키므로, 의미를 살려 ‘곡식제물’로 옮겼습니다.
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제
  alternatives_korean:
  - 그들의 술제물
  - 그들의 마실 제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 부어 드리는 제물로, 한국어 성경 전통에서 제의적 의미가 분명한 ‘전제’를 사용했습니다.
- source_word: בְּמִסְפָּרָם
  english_pob_choice: according to their number
  chosen_korean: 그 수효대로
  alternatives_korean:
  - 그들의 수에 따라
  - 수에 따라
  lexicon: HALOT
  rationale: 동물 수에 맞추어 제물의 분량이 정해진다는 뜻을 간결하고 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례에 따라
  alternatives_korean:
  - 법도에 따라
  - 정한 규정에 따라
  - 명령대로
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט는 재판이 아니라 제의 절차상의 정해진 규범을 가리키므로, 문맥상 ‘규례’가 가장 적절합니다.
theological_decisions:
- issue: 제의 언어의 형식성 유지
  chosen_reading: ‘곡식제물’, ‘전제’, ‘규례’처럼 제의적 용어를 유지해 본문의 예배 규정을 분명히 드러냈습니다.
  alternative_readings:
  - 일반화하여 ‘제물’로 통일
  - 현대어로 풀어 ‘마실 제물’과 같은 설명적 표현 사용
  rationale: 민수기 29장은 제의 규정의 반복적 서술이므로, 의미를 평탄화하기보다 제의적 어휘를 보존하는 편이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 제의 규정 본문 해석 원칙
