  rationale: 반복된 명사 עִשָּׂרוֹן의 분배적 의미를 한국어에서 자연스럽게 드러내기 위해 수량 표현으로 옮겼습니다. 원문의 반복성은 ‘…씩’으로 살렸습니다.
