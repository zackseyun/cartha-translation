revisions:
- from: 그리고 속죄제용 숫염소 한 마리, 곧 정기 번제와 그것의 곡식 제물과 그것의 전제물 외에 드려야 합니다.
  to: 또한 정기 번제와 그 곡식 제물과 전제물 외에, 속죄제물로 숫염소 한 마리를 드려야 합니다.
  rationale: The revision removes the misleading appositional ‘곧,’ expresses the additional-offering relationship directly through ‘외에,’ and uses idiomatic Korean possessive reference. It retains the explicit numeral, the male-goat specification, the sin-offering function, and every component of the regular offering complex.
  reviewer_model: gpt-5.6-terra
