  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
  footnotes:
  - marker: a
    text: Or 'besides the continual burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: '''Drink offering'' may also be rendered ''libation.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 속죄제용 숫염소 한 마리, 곧 정기 번제와 그것의 곡식 제물과 그것의 전제물 외에 드려야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  english_pob_choice: and one male goat
  chosen_korean: 속죄제용 숫염소 한 마리
  alternatives_korean:
  - 속죄제용 염소 한 마리
  - 한 숫염소
  lexicon: HALOT
  rationale: שָׂעִיר은 단순한 염소가 아니라 수컷 염소를 가리키므로 ‘숫염소’로 구체화했습니다. חַטָּאת과 결합해 제의적 용도를 분명히 하도록 ‘속죄제용’을 붙였습니다.
- source_word: חַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제용
  alternatives_korean:
  - 속죄제를 위한
  - 죄를 위한
  lexicon: HALOT
  rationale: 이 문맥에서 חַטָּאת은 추상적 ‘죄’가 아니라 제의적 ‘속죄제’를 뜻하므로, 한국어에서도 명사적 표현보다 용도 표시인 ‘-용’이 자연스럽고 정확합니다.
- source_word: מִ/לְּ/בַד
  english_pob_choice: besides
  chosen_korean: 외에
  alternatives_korean:
  - 뿐 아니라
  - 별도로
  lexicon: HALOT
  rationale: 정기 번제와 그 부속 제물에 더하여 추가로 드리는 뜻이므로, 간결하게 ‘외에’로 옮겼습니다.
- source_word: הַ/תָּמִיד
  english_pob_choice: the regular
  chosen_korean: 정기 번제
  alternatives_korean:
  - 항상 드리는 번제
  - 늘 드리는 번제
  - 상번제
  lexicon: HALOT
  rationale: תָּמִיד은 ‘항상/정기적으로 계속되는’ 제물을 가리키므로, 전통 용어 ‘상번제’보다 의미를 바로 드러내는 ‘정기 번제’를 택했습니다.
- source_word: וּ/מִנְחָתָ/הּ
  english_pob_choice: and its grain offering
  chosen_korean: 그것의 곡식 제물
  alternatives_korean:
  - 그것의 소제물
  - 그것의 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה는 제의 맥락에서 곡식 제물을 가리키며, ‘곡식 제물’은 현대 한국어에서 의미가 직접적입니다. 대명사 ‘그것의’는 번제를 가리키도록 유지했습니다.
- source_word: וְ/נִסְכָּ/הּ
  english_pob_choice: and its drink offering
  chosen_korean: 그것의 전제물
  alternatives_korean:
  - 그것의 술 제물
  - 그것의 부어 드리는 제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 ‘붓는 제물’, 곧 전제를 뜻하므로, 한국어 성경의 제의어법을 살려 ‘전제물’로 옮겼습니다. ‘그것의’는 앞의 번제를 받습니다.
