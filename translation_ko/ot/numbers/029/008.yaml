source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
  footnotes:
  - marker: a
    text: Or 'a soothing aroma.' The Hebrew phrase is a fixed sacrificial expression for an offering acceptable to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 향기로운 냄새가 되게 하는 번제를 드리십시오. 곧 소 떼에서 난 수소 한 마리와 숫양 한 마리와 일 년 된 수컷 어린양 일곱 마리를 드리십시오. 너희가 드릴 이 동물들은 흠이 없어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향기로운 냄새’는 히브리어의 고정된 제사 표현입니다. 또는 ‘달래는 향기’로 옮길 수 있으며, 야훼께 받아들여지는 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: You shall present
  chosen_korean: 바칠지니
  alternatives_korean:
  - 드릴지니
  - 제시할지니
  lexicon: HALOT
  rationale: 제사 문맥의 הִקְרִיב은 단순히 ‘가져오다’보다 제의적으로 ‘바치다/드리다’가 자연스럽고, 명령형 예고를 합쇼체로 살렸습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태움 제물
  - 번제물
  lexicon: HALOT
  rationale: 제의 용어로 굳어진 표준어인 ‘번제’를 사용해 희생제의의 정체를 분명히 했습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 제물
  alternatives_korean:
  - 기쁘게 받으실 향기
  - 기분 좋으신 향
  lexicon: HALOT
  rationale: 이 고정 표현은 하나님께 받아들여지는 제사를 가리키므로, 한국어에서 지나치게 감각적으로 들릴 수 있는 직역을 피하고 제물의 수납성을 드러내는 방향으로 옮겼습니다.
- source_word: פַּר בֶּן בָּקָר אֶחָד ... כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  english_pob_choice: one bull from the herd, one ram, and seven male lambs a year old
  chosen_korean: 소 떼의 수소 한 마리와 숫양 한 마리와 일 년 된 숫양 새끼 일곱 마리
  alternatives_korean:
  - 한 마리의 수소와 한 마리의 숫양과 일 년 된 숫양 새끼 일곱 마리
  - 한 마리의 황소와 한 마리의 숫양과 일 년 된 어린 숫양 일곱 마리
  lexicon: HALOT
  rationale: פַּר בֶּן בָּקָר은 관용적으로 ‘소 떼의 수소’로 풀 수 있고, כְּבָשִׂים은 성별이 드러나는 복수이므로 ‘숫양 새끼’로 구체화했습니다. 다만 한국어에서 중복처럼 보일 수 있어 문장 흐름은 간결하게 정리했습니다.
- source_word: תְּמִימִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것으로
  alternatives_korean:
  - 온전한 것으로
  - 결점 없는 것으로
  lexicon: HALOT
  rationale: 제사 동물의 결격이 없음을 뜻하는 표준 의미를 살려 ‘흠 없는’으로 옮겼습니다.
