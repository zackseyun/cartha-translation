- from: 그리고 일곱째 달, 그달의 첫째 날에 너희에게 거룩한 회집이 있어야 합니다. 너희는 노동하는 일을 해서는 안 됩니다. 그것은 너희를 위한 나팔 소리의 날이어야 합니다.[a]
