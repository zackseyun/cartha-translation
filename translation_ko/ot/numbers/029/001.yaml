  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
  footnotes:
  - marker: a
    text: Or, “a day of shouting/acclamation.” The Hebrew teruah refers to a loud raised sound and can denote a trumpet signal, a shout, or acclamation depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 달, 그달의 첫째 날에 너희에게 거룩한 회집이 있어야 합니다. 너희는 노동하는 일을 해서는 안 됩니다. 그것은 너희를 위한 나팔 소리의 날이어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함성/환호의 날’. 히브리어 teruah는 큰 소리로 외치는 것, 나팔 신호, 환호를 상황에 따라 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 회집
  alternatives_korean:
  - 거룩한 소집
  - 거룩한 모임
  lexicon: HALOT
  rationale: 제의적으로 정해진 공식 집회를 가리키므로, 단순한 모임보다 ‘회집’이 소집된 예배 모임의 성격을 더 잘 드러냅니다.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: laborious work
  chosen_korean: 노동하는 일
  alternatives_korean:
  - 일체의 노동
  - 수고하는 일
  - 일상 노동
  lexicon: HALOT
  rationale: 절대적 ‘모든 일’이 아니라 절기 동안 금지되는 일반적 노동·일꾼의 일을 가리키므로, ‘노동하는 일’로 비교적 직역에 가깝게 옮겼습니다.
- source_word: יוֹם תְּרוּעָה
  english_pob_choice: a day of trumpet-blast
  chosen_korean: 나팔 소리의 날
  alternatives_korean:
  - 나팔 부는 날
  - 함성의 날
  - 외침의 날
  lexicon: HALOT
  rationale: תרועה는 본문상 제의적 나팔 신호를 가리키는 맥락이 강하지만, 어휘 자체는 ‘큰 소리/외침’의 넓은 뜻도 지니므로, 기구를 보충하지 않고 소리 중심으로 옮겼습니다.
- source_word: יִהְיֶה לָכֶם
  english_pob_choice: It shall be ... for you
  chosen_korean: 너희를 위한 ...이어야 합니다
  alternatives_korean:
  - 너희에게 ...가 될 것입니다
  - 너희에게 ...이어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 규정·지정 용법을 살려, 이 날이 백성에게 정해진 날임을 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: יוֹם תְּרוּעָה의 해석을 특정 절기명으로 고정할지 여부
  chosen_reading: 본문은 후대의 전승명칭을 본문에 이식하지 않고, ‘나팔 소리의 날’로 기술적으로 옮겼습니다.
  alternative_readings:
  - 유대 전통의 명칭을 반영한 ‘나팔절’
  - ‘함성의 날’로 더 일반화한 번역
  rationale: 히브리어 본문은 절기의 성격을 소리로 기술할 뿐, 본문 자체에서 후대 명칭을 부르지는 않으므로 설명적 번역을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
