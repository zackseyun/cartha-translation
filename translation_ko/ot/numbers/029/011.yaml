base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
  footnotes:
  - marker: a
    text: Or 'purification offering' in both occurrences of 'sin offering.'
