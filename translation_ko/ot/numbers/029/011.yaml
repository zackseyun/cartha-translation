id: NUM.29.11
reference: Numbers 29:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
  footnotes:
  - marker: a
    text: Or 'purification offering' in both occurrences of 'sin offering.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the continual burnt offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 숫염소 한 마리를 속죄제[a]로, 곧 속죄의 속죄제[b]와 상번제 및 그 소제와 그 전제들 외에 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘항상 드리는 번제’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  english_pob_choice: one male goat
  chosen_korean: 숫염소 한 마리
  alternatives_korean:
  - 염소 한 마리
  - 숫염소 하나
  lexicon: HALOT
  rationale: 제사 문맥의 שְׂעִיר עִזִּים은 성별이 분명한 염소를 가리키므로, 현대 한국어에서 자연스러운 ‘숫염소’로 옮겨 수컷 표지를 살렸습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 이 절은 제사 목록이므로 기능을 드러내는 제의 용어 ‘속죄제’를 사용했습니다. POB의 ‘sin offering’에 대응하면서도 한국어 성경에서 널리 통용되는 제사 명칭을 유지합니다.
- source_word: מִלְּבַד חַטַּאת הַכִּפֻּרִים
  english_pob_choice: besides the sin offering of atonement
  chosen_korean: 곧 속죄의 속죄제 외에
  alternatives_korean:
  - 속죄를 위한 속죄제 외에
  - 속죄제 외에
  lexicon: HALOT
  rationale: מִלְּבַד는 ‘~외에/곁들여’의 대비를 나타내므로 ‘외에’로 처리했고, חַטַּאת הַכִּפֻּרִים는 구조를 따라 ‘속죄의 속죄제’로 옮겨 제의적 관계를 드러냈습니다.
- source_word: עֹלַת הַתָּמִיד וּמִנְחָתָהּ וְנִסְכֵּיהֶם
  english_pob_choice: the regular burnt offering with its grain offering and their drink offerings
  chosen_korean: 상번제 및 그 소제와 그 전제들
  alternatives_korean:
  - 항상 드리는 번제와 그 곡식제물 및 그 전제들
  - 정규 번제와 그 소제 및 그 전제들
  lexicon: HALOT
  rationale: עֹלַת הַתָּמִיד는 반복적·정기적 제사를 가리키므로 ‘상번제’로 옮겼고, מִנְחָה와 נֶסֶךְ은 제의 문맥에 맞게 ‘소제’와 ‘전제’로 대응시켜 목록의 제사 용어를 일관되게 살렸습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: ‘속죄제’로 일관되게 옮기되, 두 번째 חַטָּאת도 같은 제사 용어로 유지했습니다.
  alternative_readings:
  - ‘정결제’
  - ‘죄를 위한 제물’
  rationale: 이 절은 절차적 제물 목록이므로, 과도한 해석을 더하지 않고 제의 명칭을 안정적으로 전달하는 쪽이 본문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 레위기/민수기 제의 용어의 문맥적 사용
