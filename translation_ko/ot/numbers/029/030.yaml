  source_fidelity: 초안은 מִנְחָה와 נֶסֶך를 각각 ‘곡식 제물’과 ‘전제물’로 옮기고, 제물의 분량이 수송아지·수양·어린 양의 수 및 정해진 규례에 따른다는 핵심을 대체로 반영합니다. 다만 ‘그들의 곡식 제물’은 한국어에서 소유 관계가 불분명하고, 원문의 제의적 수반 관계를 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘…규례대로 하라’는 목적어가 앞에 놓인 명령문으로 가능하나 현대 표준 한국어에서는 다소 경직되고, 무엇을 하라는지 문장 끝에서야 처리되어 흐름이 매끄럽지 않습니다. ‘각각에 딸린 …을 바치십시오’가 자연스럽습니다.
  terminology: ‘곡식 제물’, ‘전제물’, ‘수송아지’, ‘수양’, ‘어린 양’, ‘규례’는 모두 제의 문맥과 현대 한국어에 적절합니다. כַּמִּשְׁפָּט은 여기서 정해진 제의 절차를 뜻하므로 ‘규례대로’가 적절합니다.
