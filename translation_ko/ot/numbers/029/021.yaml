translation:
  language: ko
  text: 그리고 그 수에 맞추어, 정해진 규례대로[a] 수소와 숫양과 어린양을 위한 소제물과 전제물을 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미쉬파트는 여기서 일반적인 ‘판결’이 아니라, 정해진 제의 규정 또는 절차를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  english_pob_choice: their grain offerings
  chosen_korean: 그들의 소제물
  alternatives_korean:
  - 그들의 곡식제물
  - 그들의 제물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 표준적으로 곡물 제물을 가리키므로, 한국어 성경에서 익숙하고 문맥에 맞는 ‘소제물’을 택했습니다.
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제물
  alternatives_korean:
  - 그들의 술제물
  - 그들의 부어 드리는 제물
  lexicon: HALOT
  rationale: פָּכַר/נסך 계열의 제의적 ‘붓는 제물’은 전통적으로 ‘전제물’로 옮길 수 있어, 제사 용어의 정확성을 살렸습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례에 따라
  alternatives_korean:
  - 율례에 따라
  - 정해진 절차에 따라
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט은 일반 판결이 아니라 정해진 제의 규정을 뜻하므로, 예배 문맥에 자연스러운 ‘규례’로 옮겼습니다.
theological_decisions:
- issue: 제물 목록의 문체와 명령형 처리
  chosen_reading: 제의 지시문으로서 한국어에서는 자연스럽게 명령형 ‘드리십시오’를 사용했습니다.
  alternative_readings:
  - ‘드려야 합니다’
