  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
  footnotes:
  - marker: a
    text: Or 'according to the prescribed procedure.' The Hebrew term refers to the established ritual rule for these offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 소제물과 그들의 전제물은 수소들, 숫양들, 그리고 어린양들에 대하여, 그 수에 따라, 규례에 따라 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט은 여기서 일반적인 ‘판결’이 아니라, 정해진 제의 규정 또는 절차를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  english_pob_choice: their grain offerings
  chosen_korean: 그들의 소제물
  alternatives_korean:
  - 그들의 곡식제물
  - 그들의 제물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 표준적으로 곡물 제물을 가리키므로, 한국어 성경에서 익숙하고 문맥에 맞는 ‘소제물’을 택했습니다.
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제물
  alternatives_korean:
  - 그들의 술제물
  - 그들의 부어 드리는 제물
  lexicon: HALOT
  rationale: פָּכַר/נסך 계열의 제의적 ‘붓는 제물’은 전통적으로 ‘전제물’로 옮길 수 있어, 제사 용어의 정확성을 살렸습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례에 따라
  alternatives_korean:
  - 율례에 따라
  - 정해진 절차에 따라
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט은 일반 판결이 아니라 정해진 제의 규정을 뜻하므로, 예배 문맥에 자연스러운 ‘규례’로 옮겼습니다.
theological_decisions:
- issue: 제물 목록의 문체와 명령형 처리
  chosen_reading: 제의 지시문으로서 한국어에서는 자연스럽게 명령형 ‘드리십시오’를 사용했습니다.
  alternative_readings:
  - ‘드려야 합니다’
  - ‘드려라’
  rationale: 히브리어는 절차 지시문이므로, 합쇼체 명령형이 본문의 규범적·실행적 성격을 가장 직접적으로 전달합니다.
  doctrine_reference: 민수기 28–29장의 제사 규정 맥락
