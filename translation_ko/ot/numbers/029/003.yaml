id: NUM.29.3
reference: Numbers 29:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
  footnotes:
  - marker: a
    text: Hebrew 'three tenths' and 'two tenths' refer to tenth-parts of an ephah, a dry measure used in Israel's sacrificial system.
    reason: cultural_note
translation:
  language: ko
  text: 또한 그들의 곡식 제물은 기름을 섞은 고운 가루여야 합니다. 수소 한 마리에는 에바의 10분의 3[a], 숫양 한 마리에는 에바의 10분의 2여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에바의 10분의 3’과 ‘에바의 10분의 2’는 각각 에바의 10분의 1 단위가 세 개와 두 개라는 뜻입니다. 에바는 고대 이스라엘에서 곡물 등을 재는 부피 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  english_pob_choice: And their grain offering shall be
  chosen_korean: 그리고 그들의 곡식제물은 ... 여야 합니다
  alternatives_korean:
  - 그리고 그들의 제물은 ... 여야 합니다
  - 그리고 그들의 소제물은 ... 여야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 מִנְחָה는 일반적인 ‘제물’보다 곡물제의 성격을 드러내는 ‘곡식제물’이 원문의 뜻을 더 분명히 살립니다. 서술형 요구를 한국어에서는 ‘-여야 합니다’로 자연스럽게 옮겼습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 좋은 밀가루
  - 고운 밀가루
  lexicon: HALOT
  rationale: סֹלֶת은 제의용으로 곱게 간 가루를 가리키므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘고운 가루’로 옮겼습니다.
- source_word: בְּלוּלָה בַשָּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞은
  alternatives_korean:
  - 기름과 섞은
  - 기름에 혼합한
  lexicon: HALOT
  rationale: 분사형의 조리/준비 상태를 살려 ‘기름에 섞은’으로 옮겼습니다. 일상적이면서도 제의 절차의 준비성을 유지합니다.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  english_pob_choice: three-tenths
  chosen_korean: 삼십분의 일
  alternatives_korean:
  - 세 십분의 부분
  - 에바의 삼십분의 일
  lexicon: HALOT
  rationale: עִשָּׂרוֹן은 성소 제도에서 에바의 십분의 일을 뜻하는 단위이므로, 한국어에서는 ‘삼십분의 일’로 간단히 표기하되 수량 단위의 정확한 감각을 보존했습니다.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: two-tenths
  chosen_korean: 이십분의 일
  alternatives_korean:
  - 두 십분의 부분
  - 에바의 이십분의 일
  lexicon: HALOT
  rationale: 앞의 수량과 같은 방식으로 대응시켜, 반복되는 제의 단위 계산을 간결하고 일관되게 드러냈습니다.
theological_decisions:
- issue: 제의 규정의 수량 단위 표기
  chosen_reading: 본문의 제물 배분 수량을 한국어로 직접 제시하되, 통용되는 교회식 풀어쓰기를 피했습니다.
  alternative_readings:
  - 에바의 삼십분의 일로 풀어쓰기
  - 전통적 번역어로만 처리하기
  rationale: 원문은 제의적 계량을 정확히 전달하는 데 초점이 있으므로, 의미를 흐리는 일반화보다 계량값 자체를 보존하는 것이 본문 의도에 충실합니다.
  doctrine_reference: 제사 규례의 정확성 보존
- issue: מִנְחָה의 번역
  chosen_reading: ‘곡식제물’로 번역해 곡물 제의의 성격을 드러냈습니다.
  alternative_readings:
  - 소제물
  - 헌물
  rationale: 한국 교회 전통의 ‘소제물’은 익숙하지만, 현대 독자가 제의 항목을 즉시 이해하도록 의미를 풀어주는 편이 원문 기능에 더 가깝습니다.
  doctrine_reference: 제의 용어의 명료성
