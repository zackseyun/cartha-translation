id: NUM.29.39
reference: Numbers 29:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
  footnotes:
  - marker: a
    text: Or “fellowship offerings.” The Hebrew term refers to a category of well-being/peace offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 너희가 정해진 절기마다 야훼께 드릴 것이니, 너희의 서원제물과 자원제물 외에 드리는 너희의 번제물과 곡식제물과 전제물과 화목제물[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “교제제물”. 히브리어 용어는 평안 또는 온전함과 관련된 제물의 범주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These
  chosen_korean: 이것들은
  alternatives_korean:
  - 이것들은 이런 것들은
  - 이들은
  lexicon: HALOT
  rationale: 앞 문맥의 절기 제물을 가리키는 지시대명사이므로, 불필요한 설명 없이 자연스러운 복수 지시로 옮겼습니다.
- source_word: תַּעֲשׂוּ
  english_pob_choice: you shall offer
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 드릴 것입니다
  - 바쳐야 합니다
  lexicon: HALOT
  rationale: 직역상 ‘하다’이지만 제의 문맥에서는 제물을 ‘드리다’가 가장 직접적이며, 의무적 뉘앙스를 살리기 위해 조동사 없이 의무형으로 옮겼습니다.
- source_word: בְּמוֹעֲדֵיכֶם
  english_pob_choice: at your appointed times
  chosen_korean: 너희의 정해진 때에
  alternatives_korean:
  - 너희의 정한 절기에
  - 너희의 정해진 절기 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 핵심은 ‘정해진 때/시기’이므로, 절기만으로 좁히지 않고 일정이 정해진 예배 시점을 살렸습니다.
- source_word: לְבַד
  english_pob_choice: besides
  chosen_korean: 외에
  alternatives_korean:
  - 말고
  - 따로
  lexicon: HALOT
  rationale: 앞의 정규 제의와 추가적으로 더해지는 관계를 한국어로 간결하게 표시합니다.
- source_word: מִנִּדְרֵיכֶם וְנִדְבֹתֵיכֶם
  english_pob_choice: your vow offerings and your freewill offerings
  chosen_korean: 너희의 서원제물과 자원제물
  alternatives_korean:
  - 너희의 서원 예물과 자원 예물
  - 너희의 서원 제물과 자원하여 드리는 제물
  lexicon: HALOT
  rationale: 서원과 자발적 헌납이 제물로 구체화된 표현이므로, ‘제물’을 붙여 제의적 의미를 분명히 했습니다.
- source_word: וּלְמִנְחֹתֵיכֶם
  english_pob_choice: and for your grain offerings
  chosen_korean: 너희의 곡식제물
  alternatives_korean:
  - 너희의 소제물
  - 너희의 곡식 예물
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 고정어를 현대 독자가 이해하기 쉽도록 ‘곡식제물’로 풀어, 전통 용어 ‘소제’의 अस्प명성을 피했습니다.
- source_word: וּלְנִסְכֵּיכֶם
  english_pob_choice: and for your drink offerings
  chosen_korean: 너희의 붓는 제물
  alternatives_korean:
  - 너희의 전제
  - 너희의 붓는 예물
  lexicon: HALOT
  rationale: נֶסֶךְ의 핵심은 액체를 ‘붓는’ 행위이므로, 제의 행위를 드러내는 표현을 택했습니다.
- source_word: וּלְשַׁלְמֵיכֶם
  english_pob_choice: and for your peace offerings
  chosen_korean: 너희의 화목제물
  alternatives_korean:
  - 너희의 평화제물
  - 너희의 화평제물
  lexicon: HALOT
  rationale: 전통적 범주를 유지하면서도 한국어에서 제의 명칭으로 널리 이해되는 ‘화목제물’을 사용했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יהוה가 직접 나타나므로 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שְׁלָמִים sacrificial category
  chosen_reading: 화목제물
  alternative_readings:
  - 평화제물
  - 교제제물
  rationale: ‘peace offerings’의 범주를 한국어 제의어로 안정적으로 옮기되, ‘평화/교제’의 의미는 제물 범주 자체에 내포되므로 본문에서는 표준적인 제의 명칭을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
