  to: 이것들은 너희가 정해진 절기마다 야훼께 드릴 것이니, 너희의 서원제물과 자원제물 외에 드리는 너희의 번제물과 곡식제물과 전제물과 화목제물[a]입니다.
  rationale: 원문의 순서와 ‘외에’의 추가 관계를 유지하되, 한국어에서 중복된 종결 동사 없이 자연스럽게 읽히도록 문장을 정리했습니다. ‘전제물’은 נֶסֶךְ의 표준적이고 정확한 제의어이며, 화목제물의 대안은 해당 단어에 직접 연결한 각주로 제시했습니다.
