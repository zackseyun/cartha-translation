  - severity: medium
    issue: 각주가 כְּבָשִׂים의 성별을 지나치게 불확정적으로 설명합니다.
    rationale: 이 문맥의 כְּבָשִׂים은 암양을 뜻하는 별도 여성형과 구별되며, ‘어린 숫양’은 안전한 번역입니다. 해당 각주는 본문 이해에 필요하지 않습니다.
