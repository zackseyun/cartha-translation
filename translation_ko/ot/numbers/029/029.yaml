  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: ko
  text: 그리고 여섯째 날에는 수송아지 여덟 마리, 숫양 두 마리, 그리고 일 년 된 숫양 새끼 열네 마리로서 흠 없는 것들을 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּבָשִׂים은 문자적으로 ‘어린 양들’이지만, 이 절의 제사 문맥에서는 수컷을 분명히 한 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַשִּׁשִּׁי
  english_pob_choice: And on the sixth day
  chosen_korean: 그리고 여섯째 날에는
  alternatives_korean:
  - 그리고 여섯째 날에
  - 여섯째 날에는
  lexicon: HALOT
  rationale: 히브리어의 순차적 연결을 살리되, 한국어에서는 제사 목록의 진행을 자연스럽게 이어 주는 ‘그리고’와 시간 부사격 조사 ‘-에는’으로 처리했습니다.
- source_word: פָּרִים
  english_pob_choice: bulls
  chosen_korean: 수송아지
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 제사 규정의 동물 목록에서 פָּרִים는 성숙한 수컷 소를 가리키므로, 한국어 성경에서 통용되는 제사 동물어인 ‘수송아지’로 옮겼습니다.
- source_word: אֵילִם
  english_pob_choice: rams
  chosen_korean: 숫양
  alternatives_korean:
  - 양수컷
  - 양
  lexicon: HALOT
  rationale: أֵילִם는 제물 문맥에서 수컷 양을 뜻하므로, 의미를 분명히 하는 ‘숫양’이 적절합니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: male lambs a year old
  chosen_korean: 일 년 된 숫양 새끼
  alternatives_korean:
  - 한 살 된 어린 수양
  - 일 년 된 어린 양
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 어린 양을 가리키며, בְּנֵי שָׁנָה는 연령을 분명히 하므로 ‘일 년 된’으로 풀어 썼습니다. 다만 ‘숫양 새끼’는 제사 맥락에서 수컷을 드러내려는 선택입니다.
- source_word: תְּמִימִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것들
  alternatives_korean:
  - 흠 없는 짐승들
  - 온전한 것들
  lexicon: HALOT
  rationale: 제사용 동물이 결함 없이 온전해야 한다는 뜻을 한국어 제의 문맥에 맞게 ‘흠 없는 것들’로 옮겼습니다.
theological_decisions:
- issue: 제사 목록의 명령형 뉘앙스
  chosen_reading: 본문은 단순한 수량 보고가 아니라 절기 제물 규정을 제시하는 명령형 연속으로 읽어 ‘드리십시오’로 옮겼습니다.
  alternative_readings:
  - 드립니다
  - 바칩니다
  rationale: 히브리어 문맥상 절차 지시가 이어지므로 한국어에서도 행위 지시의 성격을 드러내는 것이 자연스럽습니다.
  doctrine_reference: 민수기 28–29장의 절기 제사 규정
