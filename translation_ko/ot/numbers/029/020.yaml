id: NUM.29.20
reference: Numbers 29:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י פָּרִ֥ים עַשְׁתֵּי עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
  footnotes:
  - marker: a
    text: Or 'unblemished.' The Hebrew term refers to sacrificial animals being free from defect.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셋째 날에는 수소 열한 마리, 숫양 두 마리, 한 살 된 흠 없는 어린 양 열네 마리.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흠 없는’은 제물로 바치는 동물에 신체적 결함이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: And on the third day
  chosen_korean: 그리고 셋째 날에는
  alternatives_korean:
  - 셋째 날에
  - 그리고 세 번째 날에는
  lexicon: HALOT
  rationale: 열거되는 제의 일정의 연결을 살리기 위해 ‘그리고’를 두고, ordinal은 자연스러운 ‘셋째 날’로 옮겼습니다.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  english_pob_choice: eleven bulls
  chosen_korean: 수소 열한 마리
  alternatives_korean:
  - 황소 열한 마리
  - 소 열한 마리
  lexicon: HALOT
  rationale: 제의 맥락의 פָּרִים는 ‘bulls’에 해당하므로 ‘수소’가 가장 직접적이며, 단순한 ‘소’보다 제의 동물을 더 분명히 드러냅니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  english_pob_choice: fourteen one-year-old lambs
  chosen_korean: 일 년 된 어린 양 열네 마리
  alternatives_korean:
  - 한 살 된 어린 양 열네 마리
  - 일 년짜리 어린 양 열네 마리
  lexicon: HALOT
  rationale: ‘בְּנֵי שָׁנָה’의 관용적 뜻을 살려 ‘일 년 된’으로 자연스럽게 옮기고, כְּבָשִׂים은 제의용 ‘어린 양’으로 번역했습니다.
- source_word: תְּמִימִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것으로
  alternatives_korean:
  - 흠이 없는 것으로
  - 완전한 것으로
  lexicon: HALOT
  rationale: 제의 동물이 결함 없이 온전해야 한다는 뜻을 살려 POB의 ‘without blemish’에 맞게 ‘흠 없는’으로 옮겼습니다.
theological_decisions:
- issue: 제물의 상태 표현
  chosen_reading: ‘흠 없는 것으로’는 도덕적 완전성보다 제의적 결함 없음에 초점을 둔 표현으로 유지했습니다.
  alternative_readings:
  - ‘완전한 것으로’
  - ‘온전한 것으로’
  rationale: 히브리어 תְּמִימִם은 여기서 제물의 신체적 결함이 없음을 가리키므로, 현대 독자가 도덕적 의미로 오해하지 않도록 제의적 의미를 분명히 했습니다.
  doctrine_reference: 레위기 제사 규례의 제물 무흠성
- issue: 숫 표현의 배열
  chosen_reading: ‘수소 열한 마리, 숫양 두 마리, 일 년 된 어린 양 열네 마리’로 원문의 항목 순서를 그대로 따랐습니다.
  alternative_readings:
  - ‘열한 마리 수소, 두 마리 숫양, 열네 마리 일 년 된 어린 양’
  rationale: 열거형 제의 규정에서는 항목 순서 자체가 정보 구조이므로, 원문의 배열을 유지하는 것이 의미 전달에 유리합니다.
  doctrine_reference: 민수기 29장의 절기 제물 규정
