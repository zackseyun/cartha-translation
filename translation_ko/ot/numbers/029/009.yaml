id: NUM.29.9
reference: Numbers 29:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
  footnotes:
  - marker: a
    text: Hebrew 'three-tenths' and 'two-tenths' refer to tenth-measures, traditionally understood as tenths of an ephah.
    reason: cultural_note
translation:
  language: ko
  text: 그 짐승들을 위한 곡식 제물은 기름을 섞은 고운 가루로, 수소 한 마리에는 십분의 삼[a], 그 한 숫양에는 십분의 이입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘십분의 삼’과 ‘십분의 이’는 각각 십분의 일 단위 세 개와 두 개를 가리키며, 이 단위는 전통적으로 에바의 십분의 일로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  english_pob_choice: and their grain offering
  chosen_korean: 그것의 곡식 제물
  alternatives_korean:
  - 그들의 곡식 제물
  - 그들의 제물
  - 곡식 제물과
  lexicon: HALOT
  rationale: 민חה는 제의 문맥에서 곡식 제물을 가리키므로, 의미를 분명히 드러내기 위해 곡식 제물로 옮겼습니다. 지시대명사 '그것의'는 앞절의 짐승들을 가리키는 집합적 소유를 자연스럽게 받습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 고운 밀가루
  - 정선한 가루
  lexicon: HALOT
  rationale: סֹלֶת은 제사에 쓰는 곱게 간 고급 가루이므로, 현대 한국어에서 가장 자연스럽고 직접적인 고운 가루로 옮겼습니다.
- source_word: בְּלוּלָה בַשָּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞은
  alternatives_korean:
  - 기름과 섞인
  - 기름으로 반죽한
  lexicon: HALOT
  rationale: 수동 분사구는 가루가 기름과 결합된 상태를 뜻하므로, 제의 절차를 살리면서도 자연스러운 기름에 섞은으로 번역했습니다.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: three-tenths / two-tenths
  chosen_korean: 삼분의 십 / 이분의 십
  alternatives_korean:
  - 십의 셋 / 십의 둘
  - 한 에바의 삼분의 십 / 한 에바의 이분의 십
  lexicon: HALOT
  rationale: עִשָּׂרוֹן은 전통적으로 에바의 십분의 일인 척도이므로, 영어 POB의 절약된 표기를 따라 한국어에서도 제의적 수량 표시를 유지했습니다.
- source_word: לַפָּר / לָאַיִל הָאֶחָד
  english_pob_choice: for the bull / for the one ram
  chosen_korean: 수소를 위해서는 / 그 한 숫양을 위해서는
  alternatives_korean:
  - 수소에게는 / 한 숫양에게는
  - 수소를 위한 / 한 숫양을 위한
  lexicon: HALOT
  rationale: 제물 배분의 용도를 드러내기 위해 '위해서는'을 사용했고, הָאֶחָד는 '그 한'으로 옮겨 특정된 숫양임을 보존했습니다.
theological_decisions:
- issue: 제의 수량 단위의 현대화와 보존
  chosen_reading: 본문의 수량은 한국어로도 절약된 수사 표현을 유지하되, 전통적 설명이 필요한 곳은 각주로 처리합니다.
  alternative_readings:
  - 삼분의 십과 이분의 십을 풀어쓴 설명형 번역
  - 한 에바의 십분의 삼과 십분의 이
  rationale: 이 절은 제의 규례를 나열하는 문맥이므로, 본문은 간결하게 두고 단위 해설은 각주로 제공하는 편이 원문과 독자 이해를 함께 살립니다.
  doctrine_reference: 제사 규례의 정확한 전달과 가독성의 균형
