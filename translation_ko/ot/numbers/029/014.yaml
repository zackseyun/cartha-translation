revisions:
- from: 그들의 곡식 제물은 기름에 섞은 고운 가루로 드리되, 수소 하나마다 삼십분의 삼, 곧 열세 수소를 위하여 드리고, 숫양 하나마다 이십분의 이, 곧 두 숫양을 위하여 드려야 합니다.[a]
  to: 그들의 곡식 제물은 기름에 섞은 고운 가루로, 열세 마리의 수소를 위하여 수소 한 마리마다 십분의 삼씩, 두 마리의 숫양을 위하여 숫양 한 마리마다 십분의 이씩 드려야 합니다.[a]
  rationale: 수량 단위의 분수 표기를 원문의 ‘십분량’ 구조에 맞게 바로잡았습니다. 또한 열세 마리의 수소와 두 마리의 숫양이 각각의 동물당 분량이 적용되는 대상임을 문장 구조로 분명히 하되, 원문의 제의적 열거와 분배 의미를 보존했습니다.
