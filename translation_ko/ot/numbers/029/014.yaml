id: NUM.29.14
reference: Numbers 29:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
  footnotes:
  - marker: a
    text: Hebrew 'three tenths' and 'two tenths' refer to tenth-measures, traditionally understood as tenths of an ephah.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 곡식 제물은 기름에 섞은 고운 가루로 드리되, 수소 하나마다 삼십분의 삼, 곧 열세 수소를 위하여 드리고, 숫양 하나마다 이십분의 이, 곧 두 숫양을 위하여 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘십분의 삼’과 ‘십분의 이’는 십분량 단위(전통적으로 에바의 십분의 일)로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  english_pob_choice: their grain offering
  chosen_korean: 그들의 곡식 제물
  alternatives_korean:
  - 그들의 제물
  - 그들의 소제
  lexicon: מִנְחָה
  rationale: 제사 문맥의 מִנְחָה는 일반적 ‘제물’보다 곡식 제물을 가리키므로, 의미를 분명히 드러내는 ‘곡식 제물’로 옮겼습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 곱게 간 가루
  - 고운 밀가루
  lexicon: סֹלֶת
  rationale: 제의용으로 쓰는 정밀하게 빻은 가루를 가리키므로, 현대 한국어에서 자연스러운 ‘고운 가루’로 처리했습니다.
- source_word: בְּלוּלָה בַשָּׁמֶן
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞은
  alternatives_korean:
  - 기름과 섞은
  - 기름으로 반죽한
  lexicon: בלל
  rationale: 히브리어 수동 분사구는 가루가 기름과 혼합된 상태를 뜻하므로, 직역에 가까우면서도 자연스러운 ‘기름에 섞은’으로 옮겼습니다.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: three-tenths / two-tenths
  chosen_korean: 삼십분의 삼 / 이십분의 이
  alternatives_korean:
  - 세 십분의 세 / 두 십분의 두
  - 에바의 십분의 삼 / 에바의 십분의 이
  lexicon: עִשָּׂרוֹן
  rationale: 본문의 분량 단위는 ‘십분의 몇’이라는 제의적 척도이므로, 한국어에서는 의미를 보존하면서도 수량 구조를 분명히 하는 ‘삼십분의 삼, 이십분의 이’로 옮겼습니다.
- source_word: לַפָּר הָאֶחָד / לִשְׁלֹשָׁה עָשָׂר פָּרִים / לָאַיִל הָאֶחָד / לִשְׁנֵי הָאֵילִם
  english_pob_choice: for each bull ... for the thirteen bulls ... for each ram ... for the two rams
  chosen_korean: 수소 하나마다 ... 열세 수소를 위하여 ... 숫양 하나마다 ... 두 숫양을 위하여
  alternatives_korean:
  - 각 수소마다 ... 열세 수소를 위하여 ... 각 숫양마다 ... 두 숫양을 위하여
  - 수소 한 마리마다 ... 열세 마리를 위하여 ... 숫양 한 마리마다 ... 두 마리를 위하여
  lexicon: לְ + distributive singular
  rationale: 히브리어는 단수 형태를 분배적으로 써서 각 동물의 제물 분량을 지시하므로, ‘하나마다’로 분배 의미를 살리고 총수를 병기했습니다.
theological_decisions:
- issue: 제의 용어 ‘מִנְחָה’의 한국어 대응
  chosen_reading: ‘소제’ 같은 교회 전통 용어보다 본문 의미를 직접 드러내는 ‘곡식 제물’을 사용했습니다.
  alternative_readings:
  - 소제
  - 곡식 제사
  rationale: 이 절은 동물 제사와 병렬되는 곡식 제물의 분량을 규정하므로, 독자가 제의 종류를 즉시 이해하도록 source-direct하게 옮기는 편이 본문의 기능에 더 가깝습니다.
  doctrine_reference: 레위기 2장, 민수기 28–29장의 제물 규정
