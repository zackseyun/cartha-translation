lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  english_pob_choice: and one male goat
  chosen_korean: 그리고 숫염소 한 마리
  alternatives_korean:
  - 그리고 염소 한 마리
  - 그리고 숫염소 하나
  lexicon: HALOT
  rationale: שְׂעִיר עִזִּים은 제의 맥락에서 ‘숫염소/염소 수컷’에 해당하므로, 성별을 드러내는 숫염소로 옮겼습니다. 수량은 한국어에서 자연스러운 ‘한 마리’로 처리했습니다.
- source_word: חַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 속죄제물로 드려
  lexicon: HALOT
  rationale: 제의적 חַטָּאת는 추상적 ‘죄’가 아니라 ‘속죄제물’이므로, 제의 범주를 분명히 드러내는 표현을 택했습니다.
- source_word: לְ/כַפֵּר
  english_pob_choice: to make atonement
  chosen_korean: 속죄하기 위함입니다
  alternatives_korean:
  - 속죄하기 위해서입니다
  - 속죄를 행하기 위함입니다
  lexicon: HALOT
  rationale: כפר의 제사 문맥을 살려 ‘속죄하다’로 옮겼고, 목적을 나타내는 자연스러운 종결형으로 다듬었습니다.
- source_word: עֲלֵי/כֶם
  english_pob_choice: for you
  chosen_korean: 너희를 위해
  alternatives_korean:
  - 너희를 위하여
  - 너희를 대신하여
  lexicon: HALOT
  rationale: עַל + כפר는 속죄가 누구를 향해/대신 이루어지는지를 나타내므로, 대표성을 살리는 ‘너희를 위해’가 가장 자연스럽습니다.
theological_decisions:
- issue: חַטָּאת와 כפר의 제의적 의미
  chosen_reading: 속죄제물로 … 속죄하기 위함입니다
  alternative_readings:
  - 죄를 위한 제물로 … 속죄하기 위함입니다
  - 속죄를 위해 …
  rationale: 본문은 죄 일반이 아니라 제사 제도의 범주를 말하므로, ‘속죄제물’과 ‘속죄하다’를 유지해 제의적·신학적 의미를 보존했습니다.
  doctrine_reference: 제사/속죄 용례의 문맥 우선 원칙
