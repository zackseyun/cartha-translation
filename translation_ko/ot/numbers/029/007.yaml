  source_fidelity: 개정이 필요합니다. 초안의 ‘이것은 … 날로서’는 원문의 시간 표지 ‘이 일곱째 달 열째 날에’를 설명문처럼 바꾸고, ‘거룩한 모임’은 מִקְרָא קֹדֶשׁ의 공식적으로 소집된 집회라는 성격을 다소 약화합니다. 또한 각주 표지가 자기 괴롭힘 표현이 아니라 문장 끝에 붙어 있어 해당 관용구와의 연결이 불분명합니다.
  naturalness: ‘이 일곱째 달 열째 날에는’과 ‘거룩한 집회가 있을 것이며’가 현대 표준어 합쇼체에서 자연스럽고 원문의 문장 진행을 잘 반영합니다. ‘아무 일도 해서는 안 됩니다’는 포괄적 금지를 자연스럽게 전달합니다.
  terminology: מִקְרָא קֹדֶשׁ은 ‘거룩한 집회’로 옮겨 공적·예전적 소집의 성격을 보존했습니다. וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם은 해석을 금식으로 한정하지 않도록 ‘스스로를 괴롭게 해야 합니다’로 유지하고, 각주에서 가능한 관용적 이해를 밝혔습니다.
