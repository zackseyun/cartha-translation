revisions:
- from: 이것은 일곱째 달의 열째 날로서, 너희를 위한 거룩한 모임이 될 것이며, 너희는 자신을 괴롭게 해야 합니다. 어떤 일도 해서는 안 됩니다.[a]
  to: 이 일곱째 달 열째 날에는 너희를 위한 거룩한 집회가 있을 것이며, 너희는 스스로를 괴롭게 해야 합니다.[a] 아무 일도 해서는 안 됩니다.
