id: NUM.29.7
reference: Numbers 29:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
  footnotes:
  - marker: a
    text: Or 'you shall humble yourselves' or 'you shall deny yourselves.' The Hebrew idiom literally says 'you shall afflict your souls,' a ritual expression associated with self-denial, especially fasting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일곱째 달 열째 날에는 너희를 위한 거룩한 집회가 있을 것이며, 너희는 스스로를 괴롭게 해야 합니다.[a] 아무 일도 해서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘너희 영혼들을 괴롭게 하라’입니다. ‘자신을 낮추라’ 또는 ‘자신을 절제하라’로도 옮길 수 있으며, 의례적 자기 절제를 가리키는 표현으로 특히 금식과 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶ/עָשׂוֹר
  english_pob_choice: On the tenth day
  chosen_korean: 열째 날로서
  alternatives_korean:
  - 열째에
  - 열 번째 날
  lexicon: HALOT
  rationale: 달력 날짜를 가리키는 관용구이므로, 한국어에서도 날짜 의미가 분명하게 드러나도록 ‘열째 날’로 옮겼습니다.
- source_word: לַ/חֹדֶשׁ הַ/שְּׁבִיעִי הַ/זֶּה
  english_pob_choice: of this seventh month
  chosen_korean: 이 일곱째 달의
  alternatives_korean:
  - 이 일곱째 달에 속한
  - 일곱째 달의
  lexicon: HALOT
  rationale: הַזֶּה의 지시성을 살리기 위해 ‘이’를 넣고, חודש을 달력의 달로 자연스럽게 반영했습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 모임
  alternatives_korean:
  - 거룩한 집회
  - 거룩한 소집
  lexicon: HALOT
  rationale: 공적으로 소집된 성격을 유지하면서도, 현대 한국어에서 이해 가능한 예배적 집합을 나타내기 위해 ‘모임’을 택했습니다.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  english_pob_choice: you shall afflict yourselves
  chosen_korean: 자신을 괴롭게 해야 합니다
  alternatives_korean:
  - 자신을 낮추어야 합니다
  - 자신을 금식하며 괴롭게 해야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 자기 억제·금식 관련 힘을 보존하되, ‘영혼’의 직역보다 한국어에서 행위 중심으로 드러나게 했습니다.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  english_pob_choice: you shall do no work at all
  chosen_korean: 어떤 일도 해서는 안 됩니다
  alternatives_korean:
  - 일을 전혀 해서는 안 됩니다
  - 아무 일도 하지 마십시오
  lexicon: HALOT
  rationale: מְלָאכָה의 포괄적 금지를 한국어의 일반적 ‘일’로 옮겨, 완전한 금지의 강도를 자연스럽게 전달했습니다.
theological_decisions:
- issue: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם의 의례적 자기억제 표현
  chosen_reading: ‘자신을 괴롭게 해야 합니다’로 유지해, 금식과 자제의 의례적 무게를 드러냈습니다.
  alternative_readings:
  - ‘자신을 낮추어야 합니다’
  - ‘자신을 부인해야 합니다’
  rationale: 이 표현은 단순한 내적 겸손이 아니라 속죄일 맥락의 실제적 자기 절제 행위를 가리키므로, 의미를 약화시키지 않는 직설적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
