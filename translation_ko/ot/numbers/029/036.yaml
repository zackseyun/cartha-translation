  source_fidelity: 수송아지 한 마리와 숫양 한 마리, 일 년 된 어린 양 일곱 마리라는 제물 목록 및 ‘흠 없는’ 조건은 대체로 원문에 맞습니다. 그러나 כְּבָשִׂים에 원문에 명시되지 않은 성별을 더하여 ‘숫양 새끼’로 옮긴 것은 피해야 합니다. 또한 עֹלָה와 אִשֵּׁה רֵיחַ נִיחֹחַ의 관계를 더 명료하게 드러낼 필요가 있습니다.
