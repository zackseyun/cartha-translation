  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
  footnotes:
  - marker: a
    text: Or 'a soothing aroma.' The Hebrew phrase is a fixed sacrificial expression for an offering acceptable to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 향기로운 냄새가 되는 화제, 곧 번제를 바쳐야 합니다[a]. 수송아지 한 마리와 숫양 한 마리와 일 년 된 흠 없는 어린 양 일곱 마리를 바쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향기로운 냄새’는 히브리어의 고정된 제의 표현입니다. 문자적으로는 ‘안식의 냄새’로 이해될 수 있으며, 문맥에서는 야훼께 받아들여지는 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 바쳐야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 הִקְרִיב은 단순 ‘가져오다’보다 제물로 ‘바치다/드리다’가 자연스럽고, 한국어 합쇼체에서도 제의 행위를 분명하게 드러냅니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태움 제물
  - 전번제
  lexicon: HALOT
  rationale: 고정된 제의 용어이므로 한국어 성경 용례와도 맞는 ‘번제’를 유지하는 것이 가장 정확합니다.
- source_word: אִשֵּׁה רֵיחַ נִיחֹחַ
  english_pob_choice: an offering by fire, a pleasing aroma
  chosen_korean: 화제의 향기로운 제물
  alternatives_korean:
  - 불로 드리는 향기로운 제물
  - 불의 제물, 기쁨이 되는 향기
  lexicon: HALOT
  rationale: אִשֵּׁה는 ‘불로 드리는 제물’의 의미를 살리고, רֵיחַ נִיחֹחַ는 하나님께 받아들여지는 고정된 제의 표현이므로 ‘향기로운’으로 간결하게 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 ‘야훼’를 사용해 신명기의 언약명을 직접 드러냈습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה תְּמִימִם
  english_pob_choice: seven one-year-old lambs without blemish
  chosen_korean: 흠 없는 일 년 된 숫양 새끼 일곱 마리
  alternatives_korean:
  - 흠 없는 한 살 된 어린 양 일곱 마리
  - 흠 없는 일 년 된 어린 양 일곱 마리
  lexicon: HALOT
  rationale: כְּבָשִׂים은 제의 문맥에서 양 새끼를 가리키지만, 영어 POB의 ‘lambs’에 맞춰 ‘숫양 새끼’로 구체화해 제물의 성별을 드러냈습니다. ‘일 년 된’은 בני שנה를 자연스럽게 옮긴 표현입니다.
theological_decisions:
- issue: 여호와(개역계열) 대신 야훼 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 예외 없이 יְהוָה가 직접 나타나므로, 프로젝트 기본 원칙에 따라 언약명을 가린 대체어 대신 음역형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: rֵיחַ נִיחֹחַ의 의미를 단순 ‘향’이 아니라 제의적 수납성으로 반영
  chosen_reading: 향기로운 제물
  alternative_readings:
  - 기분 좋은 향
  - 기쁨이 되는 향
  rationale: 이 표현은 감각적 묘사만이 아니라 하나님께 받아들여지는 제사의 공식어이므로, 의미를 약화하지 않도록 제물 전체를 수식하는 방식으로 옮겼습니다.
  doctrine_reference: Levitical sacrificial formula
