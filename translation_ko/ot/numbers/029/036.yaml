  terminology: ‘번제’, ‘화제’, ‘야훼’, ‘수송아지’, ‘숫양’, ‘흠 없는’은 적절합니다. כְּבָשִׂים은 이 절에서 성별을 별도로 표지하지 않으므로 ‘어린 양’으로 유지해야 합니다. רֵיחַ נִיחֹחַ의 각주도 문자적 의미와 관용적 기능을 구별하여 표현하는 편이 정확합니다.
