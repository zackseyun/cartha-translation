  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
  footnotes:
  - marker: a
    text: Or 'a soothing aroma' or 'a sweet aroma.' The Hebrew expression is a fixed sacrificial formula indicating that the offering is acceptable to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 야훼께 향기로운 번제물로 드려야 합니다. 곧 수소 한 마리, 숫양 한 마리, 그리고 흠 없는 일 년 된 숫양 새끼 일곱 마리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘안식/진정의 향기’에 가깝지만 여기서는 제물이 야훼께 받아들여진다는 뜻의 제의적 공식입니다.
    reason: source_note
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  english_pob_choice: you shall offer
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 올려야 합니다
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘עשה’는 일반적 ‘하다’보다 제물을 하나님께 바치는 행위를 가리키므로, 자연스러운 합쇼체로 ‘드리다’가 가장 직접적입니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 올라가는 제물
  lexicon: HALOT
  rationale: 히브리어 제사 용어 עֹלָה의 표준 대응을 유지하되, 한국어 성경 문맥에서 읽히는 자연스러운 명사형으로 ‘번제물’을 택했습니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운
  alternatives_korean:
  - 기쁘게 받으실
  - 기분 좋은 냄새의
  lexicon: HALOT
  rationale: 직역하면 ‘향기로운 냄새’이지만, 이 고정 제의 공식은 제물이 받아들여짐을 뜻하므로 한국어에서는 ‘향기로운’으로 압축해 제의적 뉘앙스를 살렸습니다.
- source_word: פַּר בֶּן בָּקָר אֶחָד ... כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  english_pob_choice: one bull from the herd ... seven male lambs a year old
  chosen_korean: 수소 한 마리, 숫양 한 마리, 그리고 흠 없는 일 년 된 숫양 새끼 일곱 마리
  alternatives_korean:
  - 어린 수소 한 마리, 숫양 한 마리, 그리고 일 년 된 숫양 새끼 일곱 마리
  - 송아지 한 마리, 숫양 한 마리, 그리고 한 살 된 어린양 일곱 마리
  lexicon: HALOT
  rationale: פַּר בֶּן בָּקָר은 제사 용례에서 ‘수소/황소’ 계열의 수컷 소를 가리키므로 ‘수소’가 가장 안정적이며, בְּנֵי שָׁנָה는 ‘일 년 된’으로 옮겼습니다. ‘숫양 새끼’는 כבשים의 제사 동물 성격을 드러내기 위한 선택입니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 히브리어 본문에 יהוה가 직접 나오므로, 프로젝트 기본값에 따라 언약명 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제의 공식 לְרֵיחַ נִיחֹחַ의 의미
  chosen_reading: 제물이 야훼께 기쁘게 받아들여진다는 제의적 표현으로 이해하고, 문자적 후각 묘사로 풀지 않았습니다.
  alternative_readings:
  - 향기로운 냄새
  - 기분 좋은 냄새
  rationale: 이 표현은 반복되는 고정 공식으로, 하나님이 냄새를 즐기신다는 뜻보다 제물의 수용성과 적합성을 나타냅니다. 따라서 한국어에서도 그 기능을 드러내는 번역을 택했습니다.
  doctrine_reference: sacrificial formula usage in Pentateuch
