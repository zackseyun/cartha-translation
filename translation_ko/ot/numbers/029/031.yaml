base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: '''Drink offerings'' may also be rendered ''libations.'''
