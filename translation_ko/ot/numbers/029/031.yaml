translation:
  language: ko
  text: 상번제와 그 소제와 그 전제 외에, 죄를 위한 숫염소 한 마리를 드리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂעִיר חַטָּאת אֶחָד
  english_pob_choice: one goat for a sin offering
  chosen_korean: 죄를 위한 숫염소 한 마리
  alternatives_korean:
  - 속죄제 숫염소 한 마리
  - 죄의 제물로 드리는 숫염소 한 마리
  lexicon: HALOT
  rationale: חַטָּאת는 제의 문맥에서 ‘죄’ 자체보다 ‘죄를 위한 제물/속죄제’를 가리키므로, 한국어에서는 제물의 성격을 분명히 하되 간결하게 ‘죄를 위한 숫염소’로 옮겼습니다.
- source_word: מִלְּבַד
  english_pob_choice: besides
  chosen_korean: 외에
  alternatives_korean:
  - 뿐 아니라
  - 더하여
  lexicon: HALOT
  rationale: 기존의 상번제에 추가되는 항목임을 자연스럽게 드러내는 한국어 부사구로 ‘외에’를 택했습니다.
- source_word: עֹלַת הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 상번제의 번제
  alternatives_korean:
  - 항상 드리는 번제
  - 일상 번제
  lexicon: HALOT
  rationale: הַתָּמִיד은 끊임없는 반복성보다 ‘항상 정기적으로 드리는’ 제사를 가리키므로, 공예배용으로 통용되는 ‘상번제’를 유지해 원문의 제의적 관용을 살렸습니다.
- source_word: מִנְחָתָהּ וּנְסָכֶיהָ
  english_pob_choice: with its grain offering and its drink offerings
  chosen_korean: 그 소제와 그 전제
  alternatives_korean:
  - 그 곡식제물과 그 술제물
  - 그 곡식 예물과 그 붓는 제물
  lexicon: HALOT
  rationale: מִנְחָה와 נֶסֶךְ은 제의 항목명으로 한국어 성경에서 널리 쓰이는 ‘소제’와 ‘전제’로 옮겨, 제사 목록의 형식을 보존했습니다.
theological_decisions:
- issue: 제사 항목의 누적 관계
  chosen_reading: 이 구절은 죄를 위한 숫염소가 상번제와 그 부속 제물에 덧붙여 드려짐을 말합니다.
  alternative_readings:
  - 숫염소가 상번제 자체를 설명한다는 읽기
  - 독립된 제사 하나로만 읽는 해석
  rationale: מִלְּבַד가 ‘~외에’의 보충 관계를 명시하므로, 본문은 추가 제사를 열거하는 구조로 이해하는 것이 가장 직접적입니다.
  doctrine_reference: 민 29장 절기 제사의 순서와 구성
