base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ko
  text: 넷째 날에는 수소 열 마리, 숫양 두 마리, 일 년 된 어린 숫양 열네 마리, 흠 없는 것으로 바칩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִ֛י
  english_pob_choice: And on the fourth day
  chosen_korean: 넷째 날에는
  alternatives_korean:
  - 그리고 넷째 날에는
  - 넷째 날에
  lexicon: HALOT
  rationale: 절차적 제사 목록의 시간 표지를 자연스럽게 옮기되, 연결과 순서를 살리기 위해 ‘-에는’을 사용했습니다.
- source_word: פָּרִ֥ים
  english_pob_choice: bulls
  chosen_korean: 수소 열 마리
  alternatives_korean:
  - 황소 열 마리
  - 소 열 마리
  lexicon: HALOT
  rationale: 제사 목록의 짐승을 구체적으로 드러내기 위해 ‘수소’를 택했으며, 일반적인 ‘소’보다 제의적 대상이 분명합니다.
- source_word: אֵילִ֣ם
  english_pob_choice: rams
  chosen_korean: 숫양 두 마리
  alternatives_korean:
  - 양 두 마리
  - 수양 두 마리
  lexicon: HALOT
  rationale: 히브리어의 수컷 양을 반영해 ‘숫양’으로 옮겼습니다.
- source_word: כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה
  english_pob_choice: fourteen one-year-old lambs
  chosen_korean: 일 년 된 어린 숫양 열네 마리
  alternatives_korean:
  - 일 년 된 어린 양 열네 마리
  - 한 살 된 어린 숫양 열네 마리
  lexicon: HALOT
  rationale: בְּנֵי שָׁנָה는 ‘첫해의/일 년 된’이라는 연령 표현이므로 이를 살리고, 제의적 맥락에서 수컷 어린 양임을 분명히 하기 위해 ‘어린 숫양’으로 옮겼습니다.
- source_word: תְּמִימִֽם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것으로
  alternatives_korean:
  - 흠 없이
  - 온전한 것으로
  lexicon: HALOT
  rationale: 제사 규정의 기술어로서 ‘흠 없는’이 가장 직접적이며, 제물의 자격을 분명히 나타냅니다.
theological_decisions:
- issue: 제사 목록의 간결한 명령/진술 형식
