  alternative_readings:
  - 바쳐야 합니다
  - 드립니다
  rationale: 히브리어 명사열을 한국어에서 자연스러운 제의 진술로 풀어, 규정문 특유의 목록성을 보존했습니다.
  doctrine_reference: 제사 규정의 서술체를 과도하게 명령문으로 바꾸지 않음
