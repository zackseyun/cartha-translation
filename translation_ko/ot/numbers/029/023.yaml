  lexicon: HALOT
  rationale: 절차적 제사 목록의 시간 표지를 자연스럽게 옮기되, 연결과 순서를 살리기 위해 ‘-에는’을 사용했습니다.
- source_word: פָּרִ֥ים
  english_pob_choice: bulls
  chosen_korean: 수소 열 마리
  alternatives_korean:
  - 황소 열 마리
