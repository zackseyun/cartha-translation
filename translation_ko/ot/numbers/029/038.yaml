  terminology: ‘상번제’는 עֹלַת הַתָּמִיד의 정례적·계속적 성격을 간결하게 살리는 한국어 성서 용어입니다. חַטָּאת는 여기서 추상적 죄가 아니라 제사 명칭이므로 ‘죄제물’로 옮깁니다. שׂעיר의 남성성을 ‘수염소’로 명시한 것은 안전합니다.
