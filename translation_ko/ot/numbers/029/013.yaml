id: NUM.29.13
reference: Numbers 29:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
  footnotes:
  - marker: a
    text: Or 'a soothing aroma' or 'a sweet aroma.' The Hebrew idiom רֵיחַ נִיחֹחַ expresses that the offering is acceptable to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 너희는 번제, 곧 야훼께 드리는 화제, 곧 향기로운 향내를 드려야 합니다: 소 떼의 수소 열셋, 숫양 둘, 그리고 일 년 된 숫양 새끼 열넷이니, 그것들은 흠이 없어야 합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진정시키는 향내’, 혹은 ‘달콤한 향내’로도 옮길 수 있습니다. 히브리어 관용구 רֵיחַ נִיחֹחַ는 제물이 주께 받아들여진다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 קרב는 단순한 ‘가져오다’보다 제의적으로 ‘드리다/바치다’가 자연스럽고, 현대 한국어 합쇼체에서도 읽기 쉽습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 전소제
  lexicon: HALOT
  rationale: 한국어 성경에서 정착된 제의 용어인 번제가 가장 정확하고 간결합니다.
- source_word: אִשֵּׁה
  english_pob_choice: an offering by fire
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 제의 용어로 압축해 옮기되, ‘불로 드리는’ 의미가 살아 있도록 화제를 택했습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 향내
  alternatives_korean:
  - 기쁘게 받으실 향기
  - 향긋한 향내
  lexicon: HALOT
  rationale: 문자적 후각 표현을 유지하되, 제물이 야훼께 받아들여진다는 관용적 의미를 과도하게 풀이하지 않기 위해 비교적 직설적인 표현을 사용했습니다.
- source_word: פָּרִים בְּנֵי בָקָר
  english_pob_choice: thirteen bulls from the herd
  chosen_korean: 소 떼의 수소 열셋
  alternatives_korean:
  - 소 떼에서 난 수소 열셋
  - 어린 수소 열셋
  lexicon: HALOT
  rationale: ‘bulls from the herd’의 집단 소속을 살리면서도 한국어로 자연스럽게 표현했습니다. ‘수소’는 성별 정보를 보존합니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: male lambs a year old
  chosen_korean: 일 년 된 숫양 새끼 열넷
  alternatives_korean:
  - 일 년 된 숫양들 열넷
  - 한 살 난 숫양 새끼 열넷
  lexicon: HALOT
  rationale: כְּבָשִׂים는 암수 구분이 있는 어린 양을 가리키므로 성별을 드러내기 위해 숫양 새끼로 옮겼습니다. 연령 표지도 보존했습니다.
