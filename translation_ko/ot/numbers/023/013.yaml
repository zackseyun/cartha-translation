  revised_text: 발락이 그에게 말했습니다. “부디 나와 함께 다른 곳으로 가십시오. 거기에서는 그를 볼 수 있을 것입니다. 다만 그의 끝부분만 보고, 그의 전부는 보지 못할 것입니다. 그곳에서 나를 위하여 그를 저주하십시오.”
  revised_footnotes:
