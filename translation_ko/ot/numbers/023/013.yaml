    issue: 마지막 목적어가 ‘저를’로 되어 있습니다.
    rationale: וְקָבְנוֹ לִי는 ‘나를 위하여 그를 저주하십시오’라는 뜻입니다. ‘저를’은 발락 자신을 저주하라는 의미가 되어 원문과 정반대입니다.
  - severity: medium
    issue: 부분적 시야와 전체를 보지 못함이 명령·금지로 번역되었습니다.
    rationale: תִרְאֶה / לֹא תִרְאֶה는 이 문맥에서 새 장소에서 보게 될 범위에 대한 진술이며, ‘보시고 … 보지 마시며’는 의미를 바꿉니다.
  - severity: medium
    issue: 인용문 닫는 따옴표가 누락되었습니다.
