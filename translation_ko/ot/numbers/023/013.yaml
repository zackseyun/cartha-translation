    text: 히브리어는 이스라엘 백성을 집합적으로 가리켜 남성 단수 대명사(‘그’, ‘그의’)를 사용합니다. 따라서 ‘그의 끝부분’은 이스라엘의 일부, 곧 진영의 끝부분만 보게 된다는 뜻입니다.
