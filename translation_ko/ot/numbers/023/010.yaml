revisions:
- from: 누가 야곱의 티끌을 헤아리며, 이스라엘의 사분의 일을 셀 수 있겠습니까? 내 영혼이 의인들의 죽음으로 죽고, 내 마지막이 그의 것과 같기를 바랍니다.[a][b][c]
  to: 누가 야곱의 티끌을 헤아리며 이스라엘의 사분의 일을[a] 셀 수 있겠습니까? 내 영혼이 올바른 이들의 죽음[b]을 맞게 하시고, 내 마지막도 그와 같게[c] 하소서.
  rationale: 원문의 수사적 질문, ‘야곱/이스라엘’의 병행, רֹבַע의 문자적 ‘사분의 일’, נַפְשִׁי의 ‘내 영혼’, 그리고 כָּמֹהוּ의 단수성을 보존했습니다. 다만 한국어에 맞지 않는 동족목적어적 직역은 ‘죽음을 맞게 하시고’로 조정했으며, יְשָׁרִים에는 해석적·교리적 협소화를 피한 ‘올바른 이들’을 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: ‘의인들’은 יְשָׁרִים(올바른/정직한 이들)의 어휘적 범위보다 ‘의로운 자들’ 쪽으로 다소 좁혀집니다. 또한 ‘그의 것’은 한국어에서 가리키는 바가 불분명합니다. 히브리어의 단수 남성 대명사와 집합 명사의 긴장을 보존하면서 ‘그와 같게’로 옮기는 것이 더 충실합니다.
  naturalness: 현행 ‘내 영혼이 의인들의 죽음으로 죽고’는 직역의 흔적이 강해 현대 표준 한국어로는 부자연스럽습니다. ‘내 영혼이 … 죽음을 맞게 하시고’는 원문의 소망법과 시적 어조를 자연스럽게 전달합니다.
  terminology: יְשָׁרִים은 교리적으로 더 구체화된 ‘의인들’ 대신 ‘올바른 이들’로 옮깁니다. ‘마지막’은 אַחֲרִיתִי에 적절합니다. 각 주석 표지는 해당 표현 바로 뒤에 배치합니다.
  issues:
  - severity: medium
