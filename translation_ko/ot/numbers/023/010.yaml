id: NUM.23.10
reference: Numbers 23:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
  footnotes:
  - marker: a
    text: Or 'number the quarters of Israel,' or more interpretively, 'count even one fourth of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the death of the righteous.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'like his'; the singular may refer to the representative upright person, though 'the upright' is a collective.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 야곱의 티끌을 헤아리며 이스라엘의 사분의 일을[a] 셀 수 있겠습니까? 내 영혼이 올바른 이들의 죽음[b]을 맞게 하시고, 내 마지막도 그와 같게[c] 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 네 구역’으로 옮길 수 있습니다. 더 해석적으로는 ‘이스라엘의 한 사분의 일이라도’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의로운 이들의 죽음’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수 남성형 ‘그와 같이’입니다. 앞의 ‘올바른 이들’은 집합적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה / וּמִסְפָּר
  english_pob_choice: Who can count / or number
  chosen_korean: 누가 … 헤아리며 … 셀 수 있겠습니까
  alternatives_korean:
  - 누가 … 셀 수 있겠습니까
  - 누가 … 헤아릴 수 있겠습니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문과 평행법을 살려, 불가능성을 묻는 표현으로 자연스럽게 옮겼습니다.
- source_word: עֲפַר יַעֲקֹב
  english_pob_choice: the dust of Jacob
  chosen_korean: 야곱의 티끌
  alternatives_korean:
  - 야곱의 먼지
  - 야곱의 흙먼지
  lexicon: HALOT
  rationale: ‘티끌’은 무수한 후손을 가리키는 시적 이미지를 한국어에서 가장 간결하게 보존합니다.
- source_word: רֹבַע יִשְׂרָאֵל
  english_pob_choice: the fourth part of Israel
  chosen_korean: 이스라엘의 사분의 일
  alternatives_korean:
  - 이스라엘의 네 몫
  - 이스라엘의 사분의 사
  lexicon: HALOT
  rationale: 문자적 의미인 ‘사분의 일’을 유지해 원문의 수사적 과장을 본문에서 임의로 풀지 않았습니다.
- source_word: תָּמֹת נַפְשִׁי מוֹת יְשָׁרִים
  english_pob_choice: Let my soul die the death of the upright
  chosen_korean: 내 영혼이 의인들의 죽음으로 죽고
  alternatives_korean:
  - 내가 의인들의 죽음을 죽고
  - 내 영혼이 정직한 자들의 죽음으로 죽고
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘영혼’으로 살리고, מוֹת יְשָׁרִים는 ‘의인들의 죽음’으로 옮겨 POB의 ‘upright’보다 한국어에서는 의미가 분명한 표현을 택했습니다.
- source_word: אַחֲרִיתִי
  english_pob_choice: my end
  chosen_korean: 내 마지막
  alternatives_korean:
  - 내 끝
  - 내 종말
  lexicon: HALOT
  rationale: 시적 문맥에서 ‘마지막’이 가장 자연스러우며, 최종 운명이라는 뜻도 충분히 담습니다.
theological_decisions:
- issue: יְשָׁרִים의 한국어 선택
  chosen_reading: 의인들
  alternative_readings:
  - 정직한 이들
  - 바른 이들
  rationale: 히브리어의 직선성·올곧음의 뜻을 살리면서, 발람이 바라는 죽음이 단순한 도덕적 성품이 아니라 언약 백성의 복된 죽음이라는 맥락을 한국어 독자가 이해하기 쉽도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘like his’의 지시 대상
  chosen_reading: 그의 것과 같기를 바랍니다
  alternative_readings:
  - 그와 같기를 바랍니다
  - 그들의 것과 같기를 바랍니다
  rationale: 히브리어 단수형을 본문에서 억지로 해소하지 않고, 한국어에서는 자연스럽게 ‘그의 것’을 유지해 대표적 의인 한 사람을 가리킬 수 있는 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3
