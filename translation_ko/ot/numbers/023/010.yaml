    rationale: יִשְׁרִים은 기본적으로 ‘올바른, 정직한 이들’을 뜻합니다. ‘의인’도 가능한 해석이지만 본문에서는 더 직접적인 어휘 대응을 유지하는 편이 안전합니다.
  - severity: medium
    issue: ‘내 영혼이 의인들의 죽음으로 죽고’가 현대 한국어에서 부자연스럽습니다.
    rationale: 히브리어의 동족목적어적 표현을 그대로 재현하면 한국어 문장이 어색해집니다. ‘죽음을 맞다’로 자연스럽게 옮기되, ‘내 영혼’을 유지할 수 있습니다.
  - severity: low
    issue: 주석 표지가 모두 문장 끝에 모여 있어 각 주석의 대상이 불명확합니다.
