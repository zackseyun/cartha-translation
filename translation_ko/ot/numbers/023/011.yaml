  rationale: ‘복을 빌기만 했습니다’를 ‘그들을 거듭 축복했습니다’로 바꾸어 히브리어 ברך의 직접적 의미와 반복 강조를 보존했습니다. 또한 각주를 히브리어의 유한동사와 부정사 절대형이 이루는 강조를 한국어 독자가 이해할 수 있도록 수정했습니다. 나머지 대조와 놀람의 어조는 유지했습니다.
