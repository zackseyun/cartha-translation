source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
  footnotes:
  - marker: a
    text: 'Hebrew: ''you have surely blessed'' or ''you have indeed blessed''; the Hebrew uses a finite verb with an infinitive absolute for emphasis.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 발락이 발람에게 말했습니다. “당신이 나에게 무엇을 했습니까? 내가 당신을 데려온 것은 내 원수들을 저주하게 하려는 것이었는데, 보십시오, 당신은 그들에게 복을 빌기만 했습니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 반복 구조로 축복의 강세를 나타냅니다. 직역하면 ‘복을 빌어 복을 빌었다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런데 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속은 서술의 진행을 나타내므로, 현대 한국어에서는 자연스러운 시간 전환 표현인 “그때”로 옮겼습니다.
- source_word: מֶה עָשִׂיתָ לִי
  english_pob_choice: What have you done to me?
  chosen_korean: 당신이 나에게 무엇을 했습니까?
  alternatives_korean:
  - 나에게 무엇을 했습니까?
  - 당신은 나에게 무슨 짓을 했습니까?
  lexicon: HALOT
  rationale: 직접적인 질문 구조를 살리되, 합쇼체에 맞는 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: לָקֹב ... בֵּרַכְתָּ בָרֵךְ
  english_pob_choice: to curse ... you have done nothing but bless them
  chosen_korean: 저주하게 하려는 것이었는데 ... 복을 빌기만 했습니다
  alternatives_korean:
  - 저주하게 하려는 것이었는데 ... 복을 빌었습니다
  - 저주하게 하려는 것이었는데 ... 확실히 복을 빌었습니다
  lexicon: HALOT
  rationale: לָקֹב는 이 문맥에서 ‘저주하다’로, בֵּרַכְתָּ בָרֵךְ의 강조는 한국어에서 ‘-기만 했다’로 옮겨 반복의 강조를 자연스럽게 드러냈습니다.
- source_word: וְהִנֵּה
  english_pob_choice: but look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 그런데
  lexicon: HALOT
  rationale: 발락의 놀람과 반전을 드러내는 감탄·지시 표현으로, 문어체에서 자연스럽고 대화체의 긴박감도 살리는 “보십시오”를 선택했습니다.
theological_decisions:
- issue: 발락의 인식이 실패와 반전으로 드러나는 문장 톤
  chosen_reading: 발락의 의도는 ‘저주’였으나 실제 결과는 ‘복’이었음을 강하게 대조해 옮겼습니다.
  alternative_readings:
  - 더 중립적으로 옮겨 감정적 대조를 약화할 수 있음
  - ‘당신은 분명히 복을 빌었습니다’처럼 단순 사실 진술로 처리할 수 있음
  rationale: 본문은 단순 보고가 아니라 계획의 전복을 강조하므로, 대조를 분명히 드러내는 번역이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 민수기 23:11의 문맥상 축복/저주의 전도
