id: NUM.23.29
reference: Numbers 23:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ko
  text: 그때 발람이 발락에게 말했습니다. "내게 이곳에 일곱 제단을 쌓고, 이곳에 일곱 수송아지와 일곱 숫양을 준비하십시오."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 진행성을 한국어 서술 흐름으로 자연스럽게 살리면서, 단순한 접속사보다 사건 전개를 분명히 나타냅니다.
- source_word: בְּנֵה לִי
  english_pob_choice: Build for me
  chosen_korean: 내게 ... 쌓고
  alternatives_korean:
  - 나를 위해 ... 쌓고
  - 내게 ... 건축하고
  lexicon: HALOT
  rationale: 제단을 짓는 맥락에서는 '쌓다'가 한국어로 가장 자연스럽고 구체적이며, לִי는 발람의 요청이 자기 용도를 위한 것임을 나타내므로 '내게'로 옮겼습니다.
- source_word: שִׁבְעָה מִזְבְּחֹת
  english_pob_choice: seven altars
  chosen_korean: 일곱 제단
  alternatives_korean:
  - 일곱 제단들
  - 일곱 제단을
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 제의적 제단을 뜻하므로 표준적인 '제단'을 사용했고, 수사에는 한국어에서 자연스러운 무표지 복수 표현을 택했습니다.
- source_word: וְהָכֵן
  english_pob_choice: and prepare
  chosen_korean: 그리고 ... 준비하십시오
  alternatives_korean:
  - 그리고 ... 마련하십시오
  - 그리고 ... 갖추십시오
  lexicon: HALOT
  rationale: כון의 히필은 여기서 제물 동물을 예비하라는 뜻이므로, 문맥상 가장 직관적인 동사인 '준비하다'를 선택했습니다.
- source_word: פָרִים וְשִׁבְעָה אֵילִים
  english_pob_choice: seven bulls and seven rams
  chosen_korean: 일곱 수송아지와 일곱 숫양
  alternatives_korean:
  - 일곱 황소와 일곱 숫양
  - 일곱 송아지와 일곱 숫양
  lexicon: HALOT
  rationale: פָרִים는 제의 문맥에서 성숙한 수소보다 '수송아지'가 더 일반적이고 한국어 성경어로도 안정적이며, אֵילִים은 제의적 수컷 양을 뜻하므로 '숫양'이 적절합니다.
theological_decisions:
- issue: 제의 명령문의 직접화법 톤
  chosen_reading: 발람의 명령을 직접화법으로 유지하고, 한국어에서는 공손한 명령형 '...하십시오'를 사용했습니다.
  alternative_readings:
  - 평서형으로 완화하여 서술
  - 더 구어적인 명령형 사용
  rationale: 원문은 발람이 발락에게 실제 지시를 내리는 장면이므로 명령의 강도를 보존해야 하며, 현대 합쇼체에서 직접화법의 자연스러운 공손 형식이 가장 적절합니다.
  doctrine_reference: 본문 서술의 화행 보존
