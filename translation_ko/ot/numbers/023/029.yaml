  naturalness: 초안의 ‘내게 이곳에’는 현대 한국어 어순으로 다소 부자연스럽습니다. ‘이곳에 나를 위하여’로 배열하면 자연스럽고, 직접화법의 합쇼체 명령도 유지됩니다.
  terminology: מִזְבְּחֹת는 ‘제단’, אֵילִים은 ‘숫양’이 적절합니다. פָּרִים은 이 절에서 ‘수소’가 가장 안전하며, ‘수송아지’로 특정하지 않습니다.
