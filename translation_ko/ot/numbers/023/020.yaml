id: NUM.23.20
reference: Numbers 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
  footnotes:
  - marker: a
    text: Or, more literally, 'I have received to bless'; the Hebrew leaves the object of 'received' implicit.
    reason: lexical_alternative
  - marker: b
    text: The subject of 'he has blessed' is implicit in Hebrew; context indicates God.
    reason: alternative_reading
  - marker: c
    text: Or 'I cannot revoke it' or 'I cannot turn it back.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 축복할 것을 받았습니다.[a] 그가 복을 주셨으니,[b] 나는 그것을 되돌릴 수 없습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘축복할 것을 받았다’에 가깝습니다. 히브리어는 ‘받다’의 목적어를 명시하지 않습니다.
    reason: source_note
  - marker: b
    text: 히브리어에서 이 동사의 주어는 명시되지 않습니다. 문맥상 하나님을 가리킵니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘돌이킬 수 없다’, ‘취소할 수 없다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 주의를 끌어 문장을 시작하는 감탄사로, 현대 합쇼체에서는 「보십시오」가 자연스럽고 공손한 호소력을 유지합니다.
- source_word: בָרֵךְ לָקָחְתִּי
  english_pob_choice: I have received to bless / I have received a command to bless
  chosen_korean: 내가 축복하려고 받았으니
  alternatives_korean:
  - 축복하라는 명령을 받았으니
  - 복을 주라는 것을 받았으니
  lexicon: HALOT
  rationale: 히브리어는 ‘받다’의 목적어가 암시되어 있어, 문맥상 ‘축복하기 위한 부르심/지시를 받다’는 뜻을 한국어에서는 과잉해설 없이 ‘축복하려고 받았으니’로 옮겼습니다.
- source_word: וּבֵרֵךְ
  english_pob_choice: he has blessed
  chosen_korean: 그가 복을 내리셨으니
  alternatives_korean:
  - 그가 축복하셨으니
  - 그가 복 주셨으니
  lexicon: HALOT
  rationale: 주어가 히브리어에서 생략되어 있으나 문맥상 하나님을 가리키므로, 한국어에서도 그 지시를 살리되 동사 ‘복을 내리다’를 써서 선언의 결과를 분명히 했습니다.
- source_word: אֲשִׁיבֶנָּה
  english_pob_choice: I cannot reverse it
  chosen_korean: 그것을 되돌릴 수 없습니다
  alternatives_korean:
  - 그것을 되돌려 놓을 수 없습니다
  - 그것을 취소할 수 없습니다
  lexicon: HALOT
  rationale: שוב의 사역형은 이미 내려진 복을 ‘돌이켜 원상복구하다/되돌리다’는 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘되돌릴 수 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 생략된 주어의 지시
  chosen_reading: ‘그가’는 문맥상 하나님을 가리키는 것으로 읽되, 본문에는 명시하지 않았습니다.
  alternative_readings:
  - ‘누군가가’ 복을 내리셨으니
  - 주어를 명시해 ‘하나님이’ 복을 내리셨으니
  rationale: 히브리어는 주어를 생략하지만, 앞뒤 문맥상 발람이 하나님이 복하신 것을 거스를 수 없다는 의미가 분명합니다. 한국어 본문에서는 원문의 간결함을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 원문에 없는 명시를 덧붙이지 않고, 문맥으로 보충되는 지시를 보존합니다.
