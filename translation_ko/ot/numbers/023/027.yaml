reference: Numbers 23:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
  footnotes:
  - marker: a
    text: Or 'it will be pleasing in the eyes of God.' The Hebrew idiom means 'be right' or 'be pleasing' in someone's sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 발락이 발람에게 말했습니다. 「부디 오십시오. 제가 당신을 다른 곳으로 데려가겠습니다. 혹시 하나님 보시기에 좋을지도 모르니[a], 거기서 나를 위하여 그 백성을 저주해 주십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘하나님의 눈에 옳을지도 모르니’입니다. 히브리어 관용구 ישר בעיני는 ‘옳다’ 또는 ‘마음에 들다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  english_pob_choice: Please come
  chosen_korean: 부디 오십시오
  alternatives_korean:
  - 오십시오, 부디
  - 부디 와 주십시오
  lexicon: HALOT
  rationale: לְכָה는 단순 명령보다 정중한 초청/요청으로 쓰이고, נָּא가 그 완곡함을 더하므로 현대 한국어에서는 「부디 오십시오」가 가장 자연스럽습니다.
- source_word: אֶקָּחֲךָ
  english_pob_choice: let me take you
  chosen_korean: 제가 당신을 … 데려가 보겠습니다
  alternatives_korean:
  - 제가 당신을 데려가겠습니다
  - 제가 당신을 데리고 가겠습니다
  lexicon: HALOT
  rationale: 직역형 미래보다, 이어지는 제안의 뉘앙스를 살려 화자가 스스로 주도하여 옮기겠다는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  english_pob_choice: it will be right in the eyes of God
  chosen_korean: 하나님의 눈에 옳게 보일 것입니다
  alternatives_korean:
  - 하나님 보시기에 옳을 것입니다
  - 하나님의 눈에 좋게 보일 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ישר בעיני를 보존하면서도 한국어에서 통하는 「눈에 옳게 보이다」로 옮겨, 본문의 판단 기준이 하나님께 있음을 드러냈습니다.
- source_word: וְקַבֹּתוֹ לִי
  english_pob_choice: and you shall curse him for me
  chosen_korean: 그러면 거기서 저를 위해 그를 저주해 주십시오
  alternatives_korean:
  - 그리고 저를 위해 그를 저주하십시오
  - 그곳에서 그를 저주해 주시기 바랍니다
  lexicon: HALOT
  rationale: 공손한 요청의 흐름을 유지하기 위해 한국어에서는 부탁형으로 처리했고, 목적어 대명사 「그를」은 발람이 저주 대상으로 삼는 이스라엘을 단수 대명사로 가리키는 원문 용법을 따랐습니다.
theological_decisions:
- issue: הָאֱלֹהִים의 지시 대상
  chosen_reading: 여기서는 이스라엘의 참 하나님을 가리키는 것으로 이해하여 「하나님」으로 옮겼습니다.
  alternative_readings:
  - 신들
  - 그 신
  rationale: 문맥상 발락은 장소를 바꾸면 발람이 받는 하나님의 응답이 달라질 수 있다고 기대하고 있으므로, 다신론적 모호성을 살리지 않고 서술 대상에 맞게 번역했습니다.
  doctrine_reference: 민수기 22–24장의 서사 문맥
