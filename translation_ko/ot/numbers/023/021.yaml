id: NUM.23.21
reference: Numbers 23:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
  footnotes:
  - marker: a
    text: Or, 'He has not seen iniquity in Jacob, nor has he seen trouble/perversity in Israel.' The Hebrew terms can be read in a moral sense ('iniquity') or in the sense of trouble or affliction.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'in him'; Israel is spoken of as a collective singular earlier in the verse.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'the shout of a king' may refer to royal acclamation in Israel's midst, possibly alluding to the LORD's kingly presence.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야곱 가운데서 재앙을 보지 않으셨고, 이스라엘 가운데서 고난을 보지 않으셨습니다.[a] 야훼, 곧 그의 하나님께서 그와 함께 계시며, 왕의 함성이 그들 가운데 있습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 야곱 가운데서 죄악을 보지 않으셨고, 이스라엘 가운데서 불의를 보지 않으셨습니다.’ 히브리어 어휘들은 도덕적 악을 가리키는 뜻으로도, 재앙이나 고난을 가리키는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그 안에’입니다. 앞부분에서 이스라엘은 집합적 단수로 말해지므로, 한국어에서는 집단을 가리키는 복수 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕의 함성’은 이스라엘 가운데 울리는 왕권적 환호를 가리킬 수 있으며, 야훼의 왕 같은 임재를 암시할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא הִבִּיט / לֹא רָאָה
  english_pob_choice: has not looked on / has not seen
  chosen_korean: 보지 못하였습니다 / 보지 못하였습니다
  alternatives_korean:
  - 살펴보지 못하였습니다
  - 주시하지 않으셨습니다
  lexicon: HALOT
  rationale: 두 동사의 평행을 한국어에서도 직접적으로 살려, ‘보다’ 계열로 간결하게 대응했습니다.
- source_word: אָוֶן
  english_pob_choice: trouble
  chosen_korean: 악
  alternatives_korean:
  - 고난
  - 죄악
  - 불의
  lexicon: HALOT
  rationale: 문맥상 민수기 23장의 축복 선언에서는 도덕적 ‘죄’보다 ‘악/해악’의 부재를 말하는 쪽이 자연스러워, 본문에는 ‘악’을 두고 여지는 각주로 남겼습니다.
- source_word: עָמָל
  english_pob_choice: misery
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 비참
  - 수고
  lexicon: HALOT
  rationale: אָוֶן과 구별되는 고통·압박의 뉘앙스를 한국어에서 가장 무난하게 살릴 수 있는 말로 ‘고난’을 택했습니다.
- source_word: תְרוּעַת מֶלֶךְ
  english_pob_choice: the shout of a king
  chosen_korean: 왕의 함성
  alternatives_korean:
  - 왕의 외침
  - 왕을 향한 환호
  - 왕의 선포
  lexicon: HALOT
  rationale: תְּרוּעָה의 함성·환호·나팔 소리까지 아우르는 폭을 고려해, 왕권적 환호의 성격을 살리면서도 특정 의미로 지나치게 좁히지 않는 ‘함성’을 사용했습니다.
- source_word: בּוֹ
  english_pob_choice: is among them
  chosen_korean: 그들 가운데 있습니다
  alternatives_korean:
  - 그 안에 있습니다
  - 그 안에 계십니다
  lexicon: HALOT
  rationale: 히브리어 형태는 단수 ‘그 안에’이지만, 이스라엘 전체를 집합적으로 가리키는 문맥이므로 한국어에서는 자연스럽게 복수 집합 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘악/고난이 보이지 않는다’는 표현을 무흠·무죄 선언으로 읽을지 여부
  chosen_reading: 본문은 이스라엘이 전혀 죄가 없다고 선언하기보다, 하나님께서 야곱/이스라엘 안의 해악과 고난을 보지 않으시는 축복의 진술로 옮겼습니다.
  alternative_readings:
  - 야곱에게서 죄악을 보지 못하셨고, 이스라엘에게서 불의를 보지 못하셨습니다
  rationale: אָוֶן과 עָמָל의 의미역이 넓고, 오경 전체에서 이스라엘의 죄는 분명히 드러나므로, 신학적으로 과도한 무죄 선언으로 굳히지 않고 어휘적 긴장을 보존했습니다.
  doctrine_reference: original-language primacy over translation tradition
- issue: ‘왕’의 정체를 명시할지 여부
  chosen_reading: ‘왕의 함성’으로 두고, 그 왕을 직접 규정하지 않았습니다.
  alternative_readings:
  - 그들의 왕의 함성
  - 하나님 왕의 환호
  rationale: 히브리어는 왕의 정체를 명시하지 않으므로, 야훼의 왕권을 시사할 수 있더라도 번역문에서 해석을 선행하지 않고 여백을 남겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
