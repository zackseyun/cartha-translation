base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''in this [place]'' twice; rendered ''here'' in both instances for natural English while preserving the repeated location emphasis.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 발람이 발락에게 말했습니다. 「이곳에 나를 위해 제단 일곱 개를 쌓고, 이곳에 나를 위해 수소 일곱 마리와 숫양 일곱 마리를 준비하십시오」[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 지시어 ‘이곳에/이 장소에’를 두 번 반복하여 위치를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: WLC
  rationale: 와우 연속의 서사 진행을 자연스러운 한국어로 옮기되, 단순한 병렬보다 시간적 전환을 살려 표현했습니다.
- source_word: בְּנֵה
  english_pob_choice: Build
  chosen_korean: 쌓고
  alternatives_korean:
  - 세우고
  - 짓고
  lexicon: WLC
  rationale: 제단을 짓는 행위는 한국어 성경 문맥에서 ‘쌓다’가 가장 직접적이며, 돌로 쌓는 제단의 이미지도 잘 살립니다.
- source_word: בָּזֶה
  english_pob_choice: here
  chosen_korean: 이곳에
  alternatives_korean:
  - 여기
  - 이 자리에서
  lexicon: WLC
  rationale: 두 번 반복되는 지시 표현을 살리기 위해 같은 위치 지시를 일관되게 ‘이곳에’로 옮겼습니다.
- source_word: פָרִים
  english_pob_choice: bulls
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 젊은 수소
  lexicon: WLC
  rationale: 제의적 제물 문맥에서 פָּרִים은 성별이 분명한 수소를 가리키므로, 일반적이면서도 제사 용례에 맞는 ‘수소’로 옮겼습니다.
theological_decisions:
- issue: 제물 지시문의 명령형과 공손한 직설
  chosen_reading: 발람의 지시를 직접 인용문 안에서 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 명령을 덜 직접적으로 표현
  rationale: 본문은 제의 준비를 분명히 요구하는 직접 명령이므로, 한국어에서도 그 압박감과 즉시성을 유지하는 것이 적절합니다.
  doctrine_reference: 본문-기반 서사 전달
