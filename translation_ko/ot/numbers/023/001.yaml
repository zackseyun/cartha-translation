translation:
  language: ko
  text: 그때 발람이 발락에게 말했습니다. 「이곳에 나를 위해 제단 일곱 개를 쌓고, 이곳에 나를 위해 수소 일곱 마리와 숫양 일곱 마리를 준비하십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 지시어 ‘이곳에/이 장소에’를 두 번 반복하여 위치를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: WLC
  rationale: 와우 연속의 서사 진행을 자연스러운 한국어로 옮기되, 단순한 병렬보다 시간적 전환을 살려 표현했습니다.
