  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Must I not keep/carefully observe to speak what the LORD puts in my mouth?'' The verb can emphasize careful adherence in speaking.'
