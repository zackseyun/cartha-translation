translation:
  language: ko
  text: 그가 대답하여 말했습니다. 「야훼께서 내 입에 넣으시는 것을 내가 말하지 않을 수 있겠습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  english_pob_choice: He answered and said
  chosen_korean: 그가 대답하여 말했습니다
  alternatives_korean:
  - 그가 대답하며 말했습니다
  - 그가 대답하고 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 서술쌍을 자연스러운 현대 문어로 옮기되, 응답 뒤 발화가 이어지는 구조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 용례에 따라 신명기를 포함한 구약의 신명사표기를 야훼로 옮겨, 고유한 신명을 그대로 드러냈습니다.
- source_word: אֲשֶׁר יָשִׂים ... בְּפִי
  english_pob_choice: what Yahweh puts in my mouth
  chosen_korean: 내 입에 넣으시는 것을
  alternatives_korean:
  - 내 입에 두시는 것을
  - 내 입에 주시는 것을
  lexicon: HALOT
  rationale: ‘입에 두다/넣다’는 히브리어 관용구로, 말할 내용을 하나님이 주시는 이미지를 살리기 위해 ‘넣으시는 것’을 택했습니다.
- source_word: אֶשְׁמֹר לְדַבֵּר
  english_pob_choice: speak
  chosen_korean: 말하지 않을 수 있겠습니까
  alternatives_korean:
  - 말하도록 지키지 않겠습니까
  - 말하는 것을 지키지 않겠습니까
  lexicon: HALOT
  rationale: שׁמר + 부정사구가 단순 발화보다 ‘엄격히 지켜 말함/말하지 않을 수 없음’의 의무감을 나타내므로, 반문형으로 그 강제를 한국어 자연어로 옮겼습니다.
theological_decisions:
- issue: 발화의 강제성 표현
  chosen_reading: 반문형으로 ‘말하지 않을 수 있겠습니까?’라고 옮겨, 발람이 자기 의지가 아니라 야훼의 말씀에 묶여 있음을 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 내 입에 넣으시는 것을 내가 말해야 하지 않겠습니까?’
  - ‘야훼께서 내 입에 넣으시는 것을 내가 반드시 말하겠습니다.’
  rationale: 히브리어는 단순 미래보다 의무와 제약의 뉘앙스가 강하므로, 현대 한국어에서 동일한 압박감을 주는 반문형이 가장 직접적입니다.
  doctrine_reference: 민수기 23:12의 예언 발화 제약
