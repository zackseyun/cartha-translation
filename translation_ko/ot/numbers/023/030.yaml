  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: ko
  text: 그래서 발락은 발람이 말한 대로 행하고, 제단 위에 수송아지 한 마리와 숫양 한 마리를 바쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하고
  alternatives_korean:
  - 하였고
  - 그대로 했고
  lexicon: HALOT
  rationale: כַּאֲשֶׁר אָמַר과 결합된 관용적 용법이므로, 단순한 '했다'보다 지시한 바에 맞춰 실행했다는 뜻을 살려 '행하고'로 옮겼습니다.
- source_word: כַּאֲשֶׁר אָמַר
  english_pob_choice: as Balaam had said
  chosen_korean: 발람이 말한 대로
  alternatives_korean:
  - 발람이 말한 것처럼
  - 발람이 지시한 대로
  lexicon: HALOT
  rationale: 비교·부합 관계를 자연스러운 한국어 관용구로 표현했습니다. 여기서는 '말한 대로'가 선행한 발람의 발화를 따랐다는 의미를 가장 직접적으로 전달합니다.
- source_word: פָּר וָאַיִל
  english_pob_choice: a bull and a ram
  chosen_korean: 수송아지 한 마리와 숫양 한 마리
  alternatives_korean:
  - 황소 한 마리와 숫양 한 마리
  - 수소 한 마리와 숫양 한 마리
  lexicon: HALOT
  rationale: 제사 동물로서 פָּר은 성숙한 소라기보다 제물 맥락에 맞는 '수송아지'가 더 분명하며, אַיִל은 표준적으로 '숫양'입니다.
- source_word: וַיַּעַל ... בַּמִּזְבֵּחַ
  english_pob_choice: he offered up ... on the altar
  chosen_korean: 제단 위에 ... 바쳤습니다
  alternatives_korean:
  - 제단 위에 ... 제물로 드렸습니다
  - 제단에서 ... 올렸습니다
  lexicon: HALOT
  rationale: עלה의 제사 문맥상 '올리다/바치다'가 가능하지만, 현대 한국어에서는 '바쳤습니다'가 제의적 의미를 유지하면서도 자연스럽습니다. '위에'는 בַּ의 공간적 관계를 반영합니다.
theological_decisions:
- issue: 서술 연결을 나타내는 וַ의 처리
  chosen_reading: 앞절의 명령·지시 흐름을 이어 주는 결과적 서술로 '그래서'를 사용했습니다.
  alternative_readings:
  - 그리고
  - 그리하여
  rationale: 이 절은 앞선 발람의 지시에 대한 발락의 응답을 이어 주므로, 단순 병렬보다 서술적 인과를 드러내는 연결이 문맥에 더 맞습니다.
  doctrine_reference: Narrative discourse continuity
