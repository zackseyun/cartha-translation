  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
  footnotes:
  - marker: a
    text: Or 'to a barren height' / 'to a bare hill.' The Hebrew term denotes an exposed, bare high place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 발람이 발락에게 말했습니다. 「당신의 번제 곁에 서십시오. 그리고 제가 가겠습니다. 아마 야훼께서 저를 만나러 오실지 모릅니다. 그분이 저에게 보여 주시는 것은 무엇이든지 제가 당신에게 말하겠습니다.」 그러고 나서 그는 드러난 높은 곳으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 나무가 없이 드러난 높은 곳, 곧 민둥한 언덕이나 산마루를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  english_pob_choice: Stand beside your burnt offering
  chosen_korean: 네 번제 곁에 서십시오
  alternatives_korean:
  - 번제 옆에 서십시오
  - 번제 곁에 자리를 잡으십시오
  lexicon: HALOT
  rationale: הִתְיַצֵּב는 ‘자리를 잡고 서다’의 뉘앙스이고, עַל은 여기서 제물 ‘위’가 아니라 곁/옆의 공간 관계로 이해하는 것이 문맥에 맞습니다.
- source_word: וְאֵלְכָה
  english_pob_choice: and I will go
  chosen_korean: 그러면 제가 가겠습니다
  alternatives_korean:
  - 그리고 제가 가겠습니다
  - 제가 가 보겠습니다
  lexicon: HALOT
  rationale: 코호르타티브는 발람의 의도와 결심을 나타내므로, 한국어에서는 자연스러운 의지 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 여호와 대체어가 아니라 신명기적 고유명으로서의 하나님의 이름을 보존해야 하므로, 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  english_pob_choice: and whatever he shows me
  chosen_korean: 그분이 저에게 보여 주시는 것은 무엇이든지
  alternatives_korean:
  - 그가 저에게 보여 주는 것이 무엇이든지
  - 그분이 제게 보여 주실 것은 무엇이든지
  lexicon: HALOT
  rationale: ‘무엇이든지’로 히브리어의 불특정한 내용성을 살리고, ‘보여 주다’로 הראה의 사역적 의미를 자연스럽게 반영했습니다.
- source_word: שֶׁפִי
  english_pob_choice: a bare height
  chosen_korean: 메마른 언덕
  alternatives_korean:
  - 벌거벗은 언덕
  - 메마른 산마루
  - 황량한 높은 곳
  lexicon: HALOT
  rationale: שֶׁפִי는 수목이 없는 노출된 고지를 가리키므로, 한국어로는 지형감이 살아 있는 ‘메마른 언덕’이 가장 간결합니다.
theological_decisions:
- issue: 발람의 발화 속 야훼의 이름 표기
  chosen_reading: 직접 신명 ‘야훼’를 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 처리
  - ‘여호와’로 교회 전통어 사용
  rationale: 본절은 발람의 불확실한 예언 행위 안에서도 야훼의 주권적 만남을 전면에 두므로, 고유명 자체를 유지하는 편이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
