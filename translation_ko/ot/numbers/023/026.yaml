translation:
  language: ko
  text: 발람이 발락에게 대답하여 말했습니다. “내가 당신에게 ‘야훼께서 무엇을 말씀하시든지, 나는 그대로 하겠습니다’라고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: “야훼께서 말씀하시는 모든 것을, 내가 하겠습니다.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하고
  lexicon: HALOT
  rationale: 서사 속 응답 공식을 살리되, 한국어에서 자연스러운 연결형인 ‘대답하여’로 옮겼습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고
  - 이르렀습니다
  lexicon: HALOT
  rationale: 대화 서술의 기본 동사로서 간결하고 현대적인 합쇼체 표현을 사용했습니다.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  english_pob_choice: All that Yahweh speaks
  chosen_korean: 야훼께서 무엇을 말씀하시든지
  alternatives_korean:
  - 야훼께서 말씀하시는 모든 것
  - 야훼께서 하시는 말씀은 모두
  lexicon: HALOT
  rationale: 전부성을 가진 כל אשר를 ‘무엇을 말씀하시든지’로 옮겨, 발람의 조건 없는 순종 선언을 한국어에서 자연스럽게 드러냈습니다.
- source_word: אֹת֥וֹ אֶעֱשֶׂה
  english_pob_choice: that I will do
  chosen_korean: 나는 그대로 하겠습니다
  alternatives_korean:
  - 나는 그것을 하겠습니다
  - 나는 그 말씀대로 하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 대명사적 되받아침을 한국어에서는 ‘그대로’로 기능적으로 살려, 앞선 말씀 전체를 실행 대상으로 가리키게 했습니다.
