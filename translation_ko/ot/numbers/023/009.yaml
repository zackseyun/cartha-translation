id: NUM.23.9
reference: Numbers 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
  footnotes:
  - marker: a
    text: Or, 'and shall not be reckoned among the nations.' The Hebrew verb can be understood passively as well as reflexively/middle.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 바위 꼭대기에서 그를 보고, 언덕들에서 그를 바라보기 때문입니다. 보십시오, 한 백성이 홀로 거주하며, 자신을 민족들 가운데 하나로 여기지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그리고 민족들 가운데 하나로 여겨지지 않을 것입니다.’ 히브리어 동사는 수동으로도 반사적/중간적으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹאשׁ צֻרִים
  english_pob_choice: from the top of the rocks
  chosen_korean: 바위 꼭대기에서
  alternatives_korean:
  - 바위들의 꼭대기에서
  - 암석의 정상에서
  lexicon: HALOT
  rationale: 지형적 관점에서 ‘top of the rocks’는 자연스럽게 ‘바위 꼭대기’로 옮길 수 있으며, 시적 대비를 살리면서도 현대 한국어로 읽히게 합니다.
- source_word: אֶרְאֶנּוּ / אֲשׁוּרֶנּוּ
  english_pob_choice: I see him / I behold him
  chosen_korean: 그를 보고 / 그를 바라봅니다
  alternatives_korean:
  - 그를 봅니다 / 그를 주목합니다
  - 그를 봅니다 / 그를 응시합니다
  lexicon: HALOT
  rationale: 두 동사가 평행을 이루므로 둘 다 ‘보다’ 계열로 유지하되, 첫째는 सामान्य한 ‘보고’, 둘째는 더 응시적인 ‘바라봅니다’로 차이를 살렸습니다.
- source_word: הֶן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여보십시오
  lexicon: HALOT
  rationale: 주목을 끄는 감탄적 지시어로서, 현대 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 문맥의 힘을 잘 드러냅니다.
- source_word: לְבָדָד
  english_pob_choice: dwelling alone
  chosen_korean: 홀로 거주하며
  alternatives_korean:
  - 홀로 살며
  - 따로 거주하며
  lexicon: HALOT
  rationale: 분리·독립의 의미를 살리면서도, 시적 현재상과 연결되도록 ‘거주하며’로 옮겼습니다.
- source_word: לֹא יִתְחַשָּׁב
  english_pob_choice: not reckoning itself among the nations
  chosen_korean: 민족들 가운데서 자기를 헤아리지 않습니다
  alternatives_korean:
  - 민족들 가운데서 자기를 셈하지 않습니다
  - 민족들 가운데 끼어들지 않습니다
  - 민족들 가운데서 자신을 셈하지 않습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사/중간적 뉘앙스를 반영해, 단순 수동 ‘여겨지지 않는다’보다 ‘자기를 헤아리지 않습니다’로 옮겨 주체적 구분감을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 히트파엘 동사를 수동으로 읽을지, 반사/중간으로 읽을지
  chosen_reading: ‘민족들 가운데서 자기를 헤아리지 않습니다’로 반사/중간 의미를 살립니다.
  alternative_readings:
  - ‘민족들 가운데서 헤아려지지 않습니다’
  - ‘민족들 가운데서 여겨지지 않습니다’
  rationale: 히브리어 동사형은 두 읽기를 허용하지만, 문맥은 이스라엘의 구별된 정체성을 강조합니다. 한국어에서는 그 긴장을 풀어버리지 않도록 반사적 표현을 택했습니다.
  doctrine_reference: 원문이 허용하는 의미 긴장을 보존하고, 전통 번역의 단일화보다 원어의 문법 가능성을 우선합니다.
