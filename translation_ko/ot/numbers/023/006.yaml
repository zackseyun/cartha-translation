  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣שָׁב אֵלָ֔י/ו וְ/הִנֵּ֥ה נִצָּ֖ב עַל עֹלָת֑/וֹ ה֖וּא וְ/כָל שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: ko
  text: 그러고는 그에게 돌아왔습니다. 보십시오, 그는 자기 번제물 곁에 서 있었고—그와 모압의 모든 방백들이 그와 함께 있었습니다.
  philosophy: formal
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  english_pob_choice: Then he returned to him
  chosen_korean: 그에게 돌아왔습니다
  alternatives_korean:
  - 그에게 되돌아갔습니다
  - 그에게 돌아왔습니다
  lexicon: שׁוּב
  rationale: 동작의 재개를 자연스럽게 드러내면서도 원문의 ‘되돌아오다/돌아가다’ 의미를 유지했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: הִנֵּה
  rationale: 서술 전환의 주의를 환기하는 감탄구로서, 현대 한국어에서는 ‘보십시오’가 문맥상 가장 자연스럽습니다.
- source_word: נִצָּב עַל עֹלָתוֹ
  english_pob_choice: he was standing beside his burnt offering
  chosen_korean: 자기 번제물 곁에 서 있었고
  alternatives_korean:
  - 자기 번제물 위에 서 있었고
  - 자기 번제물 옆에 서 있었고
  lexicon: נִצָּב + עַל
  rationale: POB의 기존 선택인 ‘beside’를 반영해 עַל을 여기서는 위치적 ‘곁에’로 처리했습니다. 제의적 맥락에서 ‘위에’보다 ‘곁에’가 문맥상 타당합니다.
- source_word: הוּא וְכָל שָׂרֵי מוֹאָב
  english_pob_choice: he and all the princes of Moab
  chosen_korean: 그와 모압의 모든 방백들이
  alternatives_korean:
  - 그와 모압의 모든 고관들이
  - 그와 모압의 모든 방백들이
  lexicon: שָׂרֵי מוֹאָב
  rationale: שָׂרִים은 지위 있는 통치층을 가리키므로, 본문 분위기와 관습적 한국어를 함께 살릴 수 있는 ‘방백들’을 택했습니다.
theological_decisions:
- issue: 번제물 앞의 위치 표현
  chosen_reading: ‘곁에’로 옮겨, 제물 위에 물리적으로 올라선 모습보다 그 옆/곁에 자리한 상태를 드러냈습니다.
  alternative_readings:
  - ‘위에’로 직역하는 읽기
  - ‘옆에’로 완화하는 읽기
  rationale: 이 절은 발람과 발락의 제의적 장면을 묘사하므로, 한국어에서 오해를 줄이면서도 원문의 현장감을 보존하는 표현이 적절합니다.
  doctrine_reference: 서술 맥락 보존
