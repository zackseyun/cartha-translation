translation:
  language: ko
  text: 하나님께서 저주하지 않으신 이를 내가 어찌 저주하겠습니까? 야훼께서 진노하지 않으신 이를 내가 어찌 규탄하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 진노하지 않으신 이를 내가 어찌 진노하겠습니까?’ 둘째 행의 히브리어 동사는 ‘규탄하다’로 옮길 수도 있지만, 기본적으로 ‘진노하다, 격분하다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  english_pob_choice: How can
  chosen_korean: 내가 누구를 …할 수 있겠습니까?
  alternatives_korean:
  - 어찌 내가 …하겠습니까?
  - 내가 어떻게 …할 수 있겠습니까?
  lexicon: HALOT
  rationale: 반문형의 불가능·도전의 힘을 한국어 합쇼체에서 가장 자연스럽게 살리기 위해 ‘누구를 …할 수 있겠습니까?’로 옮겼습니다.
- source_word: אֶקֹּב
  english_pob_choice: I curse
  chosen_korean: 저주할 수 있겠습니까
  alternatives_korean:
  - 저주하겠습니까
  - 저주를 선포할 수 있겠습니까
  lexicon: HALOT
  rationale: 발람의 말에서 נקב/קבב는 실제로 ‘저주하다’의 뜻이므로, 간결하게 ‘저주하다’로 옮겨 첫 행의 동사력을 살렸습니다.
- source_word: זָעַם / אֶזְעֹם
  english_pob_choice: denounce / has not denounced
  chosen_korean: 정죄할 수 있겠습니까 / 정죄하지 않으신
  alternatives_korean:
  - 분노를 표할 수 있겠습니까 / 분노하지 않으신
  - 저주할 수 있겠습니까 / 저주하지 않으신
  lexicon: HALOT
  rationale: 두 번째 동사는 단순한 저주보다 ‘격한 책망·배척’의 성격이 있어, POB의 ‘denounce’에 맞춰 ‘정죄하다’로 구별해 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 1행의 אֵל(하나님)과 2행의 언약 이름 יְהוָה를 구별해야 하므로, 본문에는 프로젝트 기본값인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: אֵל과 יְהוָה의 병행에서 하나님의 일반 호칭과 고유 이름을 구별할지 여부
  chosen_reading: אֵל은 ‘하나님’, יְהוָה는 ‘야훼’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘하나님’으로 번역
  - 둘 다 ‘주님’으로 번역
  rationale: 히브리어 시구의 병행을 보존하면서, 발람이 일반 호칭과 언약 անուն을 의도적으로 나란히 사용한 차이를 한국어에서도 드러내는 것이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
