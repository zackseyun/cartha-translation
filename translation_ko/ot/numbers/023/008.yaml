  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
  footnotes:
  - marker: a
    text: Or 'How shall I be indignant with one with whom the LORD has not been indignant?' The Hebrew verb in the second line can emphasize indignation or denunciation.
