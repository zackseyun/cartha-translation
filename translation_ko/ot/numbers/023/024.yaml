source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
  footnotes:
  - marker: a
    text: Or 'like a lion.' The Hebrew לָבִיא may be rendered more generally as 'lion,' but 'lioness' preserves the lexical distinction from the following אֲרִי ('lion').
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 한 백성이 암사자처럼 일어나고 사자처럼 몸을 일으킬 것입니다. 그 백성은 먹잇감을 먹고 죽임당한 자들의 피를 마시기까지 눕지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자처럼’. 히브리어 לָבִיא는 일반적으로 ‘사자’로도 옮길 수 있습니다. 여기서는 뒤따르는 אֲרִי(‘사자’)와의 어휘적 구별을 살리기 위해 ‘암사자’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 감탄사적 주의를 끄는 표현으로, 현대 합쇼체에서 자연스럽고 단호한 도입부를 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: כְּלָבִיא
  english_pob_choice: like a lioness
  chosen_korean: 암사자처럼
  alternatives_korean:
  - 사자처럼
  - 암컷 사자처럼
  lexicon: HALOT
  rationale: 히브리어 לָבִיא의 성별 뉘앙스를 살려 다음의 אֲרִי(사자)와 구별되는 이미지를 유지했습니다.
- source_word: יִתְנַשָּׂא
  english_pob_choice: lifts itself up
  chosen_korean: 스스로 높아집니다
  alternatives_korean:
  - 스스로 일어섭니다
  - 몸을 일으킵니다
  lexicon: HALOT
  rationale: 동물의 위엄 있는 몸짓과 돌출된 자세를 자연스럽게 전달하되, 과도하게 추상적인 ‘자기 높임’은 피했습니다.
- source_word: עַד יֹאכַל טֶרֶף
  english_pob_choice: until it eats the prey
  chosen_korean: 먹잇감을 먹고
  alternatives_korean:
  - 먹잇감을 삼키고
  - 먹이를 먹고
  lexicon: HALOT
  rationale: POB의 최종 선택을 따라 동사 ‘먹다’를 보존하면서, טֶרֶף를 ‘먹잇감’으로 옮겨 포식 이미지의 직접성을 살렸습니다.
- source_word: וְדַם חֲלָלִים
  english_pob_choice: and drinks the blood of the slain
  chosen_korean: 죽은 자들의 피를 마시기까지
  alternatives_korean:
  - 죽임당한 자들의 피를 마시기까지
  - 전사한 자들의 피를 마시기까지
  lexicon: HALOT
  rationale: חֲלָלִים은 전투/폭력 문맥에서 ‘죽은 자들, 전사자들’로 이해되므로 직설성을 유지해 ‘죽은 자들’로 옮겼습니다.
theological_decisions:
- issue: 사자-피-먹이 이미지의 거친 표현
  chosen_reading: 상징적 전쟁 승리와 압도적 힘을 드러내는 은유로 유지했습니다.
  alternative_readings:
  - 일반적인 승리 언어로 완화한다
  - 피 흘림 이미지를 삭제한다
  rationale: 히브리어 시적 예언의 강한 동물/혈흔 이미지를 약화하지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
