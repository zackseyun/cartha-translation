  naturalness: ‘한 백성’을 ‘그것은’으로 받는 것은 한국어에서 부자연스럽고 사람 집단을 사물화합니다. 또한 ‘스스로 높아집니다’는 현대 한국어에서 동물의 자세보다 자기 고양을 연상시킵니다. ‘그 백성은’과 ‘몸을 일으킬 것입니다’가 문맥과 합쇼체에 자연스럽습니다.
