revisions:
- from: 보십시오, 한 백성이 암사자처럼 일어나고 사자처럼 스스로 높아집니다. 그것은 먹잇감을 먹고 죽은 자들의 피를 마시기까지 눕지 않을 것입니다.[a]
  to: 보십시오, 한 백성이 암사자처럼 일어나고 사자처럼 몸을 일으킬 것입니다. 그 백성은 먹잇감을 먹고 죽임당한 자들의 피를 마시기까지 눕지 않을 것입니다.[a]
  rationale: 원문의 동물적 자세와 전쟁 맥락의 어휘를 더 정확하고 자연스러운 현대 한국어로 반영했습니다. ‘암사자/사자’의 구별은 유지하되, 그 성별 구분이 가능한 번역 선택임을 각주에서 분명히 했습니다.
