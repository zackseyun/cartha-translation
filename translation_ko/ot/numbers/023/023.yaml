  - marker: b
    text: 'Traditional English: ''What God has wrought!'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱을 대적하는 점술도 없고 이스라엘을 대적하는 복술도 없습니다[a]. 이제 야곱과 이스라엘에 대하여 이렇게 말할 것입니다[b]. ‘하나님께서 하신 일이 얼마나 놀라운가!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사는 ‘야곱 안에’와 ‘이스라엘 안에’로도 이해할 수 있습니다. 그러나 문맥상 야곱과 이스라엘을 대적하는 점술과 복술을 가리키는 뜻이 더 적절합니다.
    reason: alternative_reading
  - marker: b
    text: ‘이제’는 ‘이때’ 또는 ‘때가 되면’으로도 옮길 수 있습니다. 인용문의 히브리어는 직역하면 ‘하나님께서 무엇을 하셨는가!’이며, 여기서는 하나님의 행위를 찬양하는 감탄으로 이해했습니다.
    reason: lexical_alternative
