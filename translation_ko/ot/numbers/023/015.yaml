translation:
  language: ko
  text: 그가 발락에게 말했습니다. “여기, 당신의 번제 곁에 서 있으십시오. 나는 저기로 가서 그를 만나겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 만남의 대상을 직접 밝히지 않습니다. 문맥상 야훼를 가리킬 가능성이 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  english_pob_choice: And he said to Balak
  chosen_korean: 그리고 그가 발락에게 말했습니다
  alternatives_korean:
  - 그가 발락에게 말하였습니다
  - 그리고 발락에게 말했습니다
  lexicon: WLC
  rationale: 서사적 wayyiqtol은 한국어에서 자연스럽게 이어지는 ‘그리고 … 말했습니다’로 옮기되, 원문의 발락 지시를 분명히 유지했습니다.
- source_word: הִתְיַצֵּב
  english_pob_choice: Stand
  chosen_korean: 서 있으십시오
  alternatives_korean:
  - 서십시오
  - 자리를 지키십시오
  lexicon: WLC
  rationale: 명령형의 ‘자세를 잡고 그 자리에 머무르라’는 뜻을 합쇼체로 자연스럽게 드러내기 위해 ‘서 있으십시오’를 택했습니다.
- source_word: עַל עֹלָתֶךָ
  english_pob_choice: beside your burnt offering
  chosen_korean: 당신의 번제 곁에
  alternatives_korean:
  - 당신의 번제 옆에
  - 당신의 번제 위에
  lexicon: WLC
  rationale: עַל은 여기서 단순한 ‘위에’가 아니라 제물의 곁/가까이에 있는 위치를 뜻하므로, 희생제의 문맥을 살려 ‘곁에’로 옮겼습니다.
- source_word: אִקָּרֶה כֹּה־־
  english_pob_choice: I will go to meet him over there
  chosen_korean: 나는 저기에서 그를 만나러 가겠습니다
  alternatives_korean:
  - 나는 저기에서 그를 만나겠습니다
  - 나는 저기에서 그와 마주치겠습니다
  lexicon: WLC
  rationale: 동사 אִקָּרֶה의 ‘만남을 향해 가다’라는 움직임을 살리기 위해 ‘만나러 가겠습니다’로 옮기고, שני כֹּה의 대조를 ‘여기/저기’로 재현했습니다.
theological_decisions:
- issue: 암시된 만남의 대상
  chosen_reading: 본문이 직접 이름을 밝히지 않으므로, 한국어 본문에서는 ‘그를’로 두어 암시를 유지했습니다.
  alternative_readings:
  - ‘주님을’로 구체화하기
  - 목적어 없이 ‘만나러 가겠습니다’로 번역하기
  rationale: 발락 이야기 전체 맥락상 야훼와의 조우가 예상되지만, 이 절 자체는 대상을 명시하지 않으므로 과잉구체화를 피하고 원문의 간명함을 유지했습니다.
  doctrine_reference: 원문 명시성 보존 및 문맥상 암시 유지
- issue: 두 번 나오는 כֹּה의 공간 대조
  chosen_reading: 첫 번째는 ‘여기’, 두 번째는 ‘저기’로 번역해 화자의 위치와 이동 방향의 대비를 살렸습니다.
  alternative_readings:
  - 둘 다 ‘그곳’으로 완화하기
  - ‘이리/저리’로 번역하기
  rationale: 히브리어의 지시어 반복이 만드는 공간적 대비가 핵심이므로, 한국어에서도 같은 대비를 선명하게 드러내는 것이 적절합니다.
  doctrine_reference: 지시어의 수사적 대비 보존
