    rationale: ‘여기서 당신의 번제 곁에’도 이해되지만, 원문의 위치 지시와 명령의 결합에는 ‘여기, 당신의 번제 곁에’가 더 간결하고 자연스럽습니다.
  revised_text: 그가 발락에게 말했습니다. “여기, 당신의 번제 곁에 서 있으십시오. 나는 저기로 가서 그를 만나겠습니다.”[a]
