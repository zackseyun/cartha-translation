  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
  footnotes:
  - marker: a
    text: Or 'came upon Balaam' or 'encountered Balaam.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 발람을 만나시고 그의 입에 말씀을 두시며 말씀하셨습니다. “발락에게 돌아가서, 이렇게 말하라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발람에게 닥치셨다’, ‘발람을 만났다/조우했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר יְהוָה אֶל בִּלְעָם
  english_pob_choice: Yahweh met Balaam
  chosen_korean: 야훼께서 발람을 만나시고
  alternatives_korean:
  - 야훼께서 발람에게 찾아오시고
  - 야훼께서 발람을 만나 주시고
  lexicon: HALOT
  rationale: וַיִּקָּר는 단순 접촉보다 ‘만남/조우’의 뜻이어서, 능동적·직접적 접촉을 살리되 과도한 현현 해석은 피하도록 ‘만나시고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 여호와 이름을 대체 칭호로 바꾸지 않고, POB 기준에 따라 고유명 ‘야훼’를 사용했습니다.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  english_pob_choice: put a word in his mouth
  chosen_korean: 그의 입에 말씀을 두시며
  alternatives_korean:
  - 그의 입에 한 말씀을 넣으시며
  - 그의 입에 말을 넣으시며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 한국어에서 자연스러운 예언적 발화 표현이 되도록 ‘말씀을 두시며’로 옮겼습니다.
- source_word: וְכֹה תְדַבֵּר
  english_pob_choice: and thus you shall speak
  chosen_korean: 이렇게 말하라
  alternatives_korean:
  - 그리 말하라
  - 그렇게 말해야 한다
  lexicon: HALOT
  rationale: 명령형의 직접성을 살리되 현대 한국어에서 자연스러운 예언적 전달문으로 ‘이렇게 말하라’를 선택했습니다.
theological_decisions:
- issue: 야훼의 말씀을 입에 두시는 표현의 직역성
  chosen_reading: 하나님이 발람의 입에 구체적인 말씀을 두어 그가 전할 내용을 직접 규정하시는 것으로 옮겼습니다.
  alternative_readings:
  - 의미만 전달하도록 완화하여 번역
  - 예언 능력 일반을 가리키는 표현으로 번역
  rationale: 본문은 발람의 발화 내용을 하나님이 직접 주시는 장면이므로, 예언의 통제성과 권위를 흐리지 않도록 관용구를 유지했습니다.
  doctrine_reference: Numbers 23의 예언 통제와 신적 발화 개념
- issue: 직접화법 내부의 명령 어조
  chosen_reading: 직접 인용 안에서는 단순 명령형 ‘이렇게 말하라’를 사용했습니다.
  alternative_readings:
  - 더 완곡한 서술형
  - 의례적 높임말
  rationale: 야훼의 발화는 권위 있는 명령이므로, 본문이 요구하는 직접성을 유지했습니다.
  doctrine_reference: 서술체와 직접 인용의 화행 보존
