base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
  footnotes:
  - marker: a
    text: Literally, 'caused to ascend'; in sacrificial context this means 'offered' or 'offered up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발락은 발람이 말한 대로 하였습니다. 발락과 발람은 제단 위에 황소 한 마리와 숫양 한 마리를 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘올라가게 하다’라는 뜻이지만, 제사 문맥에서는 ‘바치다’ 또는 ‘올려 드리다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 했습니다
  alternatives_korean:
  - 행하였습니다
  - 하였습니다
  lexicon: HALOT
  rationale: ‘עשה כאשר דבר’의 관용구는 ‘말한 대로 행하다’는 뜻이므로, 현대 한국어에서는 간결한 ‘했습니다’가 가장 자연스럽습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר
  english_pob_choice: as ... had spoken
  chosen_korean: 말한 대로
  alternatives_korean:
  - 말한 대로였습니다
  - 말한 것처럼
  lexicon: HALOT
  rationale: 발람의 말에 발락이 일치하게 행동했다는 뜻을 살려, 시간관계를 과도하게 드러내지 않는 ‘말한 대로’를 택했습니다.
- source_word: וַיַּעַל ... בַּמִּזְבֵּחַ
  english_pob_choice: offered ... on the altar
  chosen_korean: 올려 드렸습니다
  alternatives_korean:
  - 드렸습니다
  - 제단에 바쳤습니다
  lexicon: HALOT
  rationale: 제사 맥락의 עלה 히필은 단순한 ‘올라가게 하다’가 아니라 제물을 제의적으로 바치는 뜻이므로, POB의 ‘offered’에 맞춰 ‘올려 드리다’로 옮겼습니다.
- source_word: פָּר וָאַיִל
  english_pob_choice: a bull and a ram
  chosen_korean: 수송아지 한 마리와 숫양 한 마리
  alternatives_korean:
  - 황소 한 마리와 숫양 한 마리
  - 소 한 마리와 숫양 한 마리
  lexicon: HALOT
  rationale: פָּר는 제사 용례에서 보통 ‘수송아지/황소’ 범주이지만, 여기서는 제물 맥락을 분명히 하면서도 일반적 의미를 살려 ‘수송아지’로 옮겼습니다. אַיִל은 표준적으로 ‘숫양’입니다.
theological_decisions:
- issue: 희생 제사의 동사 표현
  chosen_reading: ‘올려 드렸습니다’로 제의적 헌납을 드러냈습니다.
  alternative_readings:
  - ‘바쳤습니다’
  - ‘드렸습니다’
  rationale: עלה가 제사 문맥에서 단순 이동이 아니라 제물 봉헌을 뜻하므로, 예배적 행위를 분명히 드러내되 과도하게 의역하지 않는 표현을 택했습니다.
  doctrine_reference: 구약 제사 용어의 제의적 의미 보존
