  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽ/שֲׁמָ֔ע הַאֲזִ֥ינָ/ה עָדַ֖/י בְּנ֥/וֹ צִפֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
  footnotes:
  - marker: a
    text: Or “his oracle” or “his proverb” for “his discourse.” The Hebrew מָשָׁל can denote a proverb-like saying or a formal poetic utterance; here it introduces Balaam’s elevated pronouncement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기의 말을 들어 올려 말했습니다. 「발락이여, 일어나 들으십시오. 내 말을 들으시오, 십볼의 아들아。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מָשָׁל은 잠언, 비유, 풍자, 또는 격조 높은 시적 발화를 가리킬 수 있습니다. 여기서는 발람의 엄숙한 선포를 여는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  english_pob_choice: he took up his discourse
  chosen_korean: 자기의 말을 들어 올려
  alternatives_korean:
  - 자기의 담화를 시작하여
  - 자기의 예언을 전하며
  lexicon: HALOT
  rationale: מָשָׁל을 여기서는 고정된 ‘예언’으로 좁히기보다, 앞선 영어 POB처럼 격조 높은 발화를 가리키는 표현으로 살려 ‘말을 들어 올리다’로 옮겨 히브리어 관용을 보존했습니다.
- source_word: קוּם
  english_pob_choice: Rise
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나십시오
  - 일어서십시오
  lexicon: HALOT
  rationale: 발락에게 주는 명령형으로, 한국어에서는 짧고 직접적인 ‘일어나’가 원문의 호흡과 병렬성을 가장 잘 살립니다.
- source_word: וּשֲׁמָע / הַאֲזִינָה
  english_pob_choice: hear; listen to me
  chosen_korean: 들으십시오. 내 말을 들으시오
  alternatives_korean:
  - 들으십시오. 내게 귀를 기울이십시오
  - 들으십시오. 주의해서 들으시오
  lexicon: HALOT
  rationale: שׁמע와 אזן의 병렬을 ‘들으십시오’와 ‘내 말을 들으시오’로 나누어, 첫 동사는 일반 청취, 둘째는 더 강한 집중 청취의 뉘앙스를 구분했습니다.
- source_word: בְּנוֹ צִפֹּר
  english_pob_choice: son of Zippor
  chosen_korean: 십볼의 아들
  alternatives_korean:
  - 십볼의 아들이여
  - 지포르의 아들
  lexicon: HALOT
  rationale: 세대 표시의 관용구를 직역해 원문의 장중한 호칭을 보존했고, 고유명사는 한국어 성경에서 익숙한 음역보다 원음에 가까운 ‘십볼’을 택했습니다.
theological_decisions:
- issue: 발락에 대한 발화의 높임말 처리
  chosen_reading: 서술문은 합쇼체로 유지하되, 직접 호칭과 명령은 원문의 긴급성과 격조를 살려 ‘발락이여’, ‘십볼의 아들아’처럼 호격을 사용했습니다.
  alternative_readings:
  - 완전히 평서체로 완화
  - 현대 구어체로 낮춤
  rationale: 이 구절은 선포적·의례적 어조가 강하므로, 한국어에서도 너무 일상화하지 않고 본문의 장중함을 유지하는 것이 적절합니다.
  doctrine_reference: 시적/예언적 담화의 수사적 장중함
- issue: מָשָׁל의 성격
  chosen_reading: ‘말을 들어 올려’로 처리해 본문의 형식적 발화임을 살리되, ‘예언’으로 단정하지는 않았습니다.
  alternative_readings:
  - 예언을 말하다
  - 잠언을 말하다
  rationale: 문맥상 매우 격조 높은 발화이지만, 어휘 자체가 반드시 ‘예언’만을 뜻하지 않으므로 의미 범위를 과도하게 좁히지 않았습니다.
  doctrine_reference: 본문의 장르적 중립성
