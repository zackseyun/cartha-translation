id: NUM.23.17
reference: Numbers 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
  footnotes:
  - marker: a
    text: Or 'the officials of Moab' for 'the princes of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 나아오니 보라 그가 번제물 곁에 섰고 모압의 방백들이 그와 함께 있더라. 발락이 그에게 말하여 이르되 여호와께서 무엇을 말씀하셨나이까?[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문 '그'는 발락을 지칭하며, 문맥상 '그'는 발락을 가리킴.
    source: WLC
lexical_decisions:
- source_word: וַ/יָּבֹ֣א
  english_pob_choice: He came
  chosen_korean: 나아오니
  alternatives_korean: 오니, 왔으니
  lexicon: WLC
  rationale: וַיָּבֹא는 연속된 서술어로, 과거의 단순 동작보다는 상황의 진행을 나타내는 '-오니' 어미를 사용하여 서술의 흐름을 유지함.
- source_word: נִצָּב
  english_pob_choice: standing
  chosen_korean: 섰고
  alternatives_korean: 서서, 서 있는
  lexicon: WLC
  rationale: נִצָּב는 '서 있다'는 상태의 동사로, 제사 의식에서 제물이 있는 자리에 서 있는 상태를 명확히 표현하기 위해 '섰고'로 번역.
- source_word: שָׂרֵ֥י
  english_pob_choice: princes
  chosen_korean: 방백들이
  alternatives_korean: 장관들이, 지도자들이
  lexicon: WLC
  rationale: שָׂרֵי는 고대 근동 문맥에서 왕의 고위 관리나 지도자를 지칭하므로, 현대 한국어의 '방백'이 적절하나 '장관'도 가능한 대안.
- source_word: דִּבֶּ֖ר
  english_pob_choice: spoken
  chosen_korean: 말씀하셨
  alternatives_korean: 말씀하셨다, 말씀하셨는지
  lexicon: WLC
  rationale: 여호와 (YHWH) 의 말씀임을 명시하기 위해 존칭 어미 '-셨'을 사용하여 신성함을 반영.
theological_decisions:
- decision: Divine Name Rendering
  rationale: YHWH를 '여호와'로 표기하여 전통적인 한국어 성경 번역 관례를 따르며, 신의 주권을 강조함.
- decision: Narrative Perspective
  rationale: Balaam의 시점에서 서술되므로, '그가 내게'와 같은 1인칭 관찰자 시점을 유지하여 원문의 서술 구조를 보존함.
