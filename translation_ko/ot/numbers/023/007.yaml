  source_fidelity: 개정이 필요합니다. מָשָׁל을 음역한 ‘마솰’과 ‘들고’의 결합은 한국어 본문으로 자연스럽지 않으며, 두 번째 명령 לְכָה는 ‘참으로’가 아니라 접속사 וְ가 붙은 ‘그리고 와서’입니다. 또한 אָרָה와 זֹעֲמָה의 어휘적 구별을 본문에서 유지하는 편이 원문에 더 충실합니다.
  naturalness: ‘자신의 마솰을 들고 말했습니다’는 음역어와 직역적 동사 결합 때문에 현대 표준 한국어에서 부자연스럽습니다. ‘시적 선언을 읊어 말했습니다’는 이 관용구가 도입하는 격식 있는 시적 발화를 자연스럽게 나타냅니다. ‘동쪽 산들에서’는 위치를 나타내는 각주 표지와 함께 ‘동쪽의 산들에서’로 다듬었습니다.
  terminology: 아람, 모압, 발락, 야곱, 이스라엘은 유지했습니다. מָשָׁל은 여기서 단순한 ‘비유’가 아니므로 ‘시적 선언’으로 옮겼고, אָרָה는 ‘저주하라’, זֹעֲמָה는 ‘규탄하라’로 옮겨 서로 다른 동사의 병렬을 보존했습니다.
