source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר מִן אֲ֠רָם יַנְחֵ֨/נִי בָלָ֤ק מֶֽלֶךְ מוֹאָב֙ מֵֽ/הַרְרֵי קֶ֔דֶם לְכָ/ה֙ אָֽרָ/ה לִּ֣/י יַעֲקֹ֔ב וּ/לְכָ֖/ה זֹעֲמָ֥/ה יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
  footnotes:
  - marker: a
    text: Or “oracle” for “discourse”; the Hebrew idiom is literally “he took up his mashal,” a formal poetic utterance.
    reason: lexical_alternative
  - marker: b
    text: Or “from the eastern mountains”; “the mountains of the east” renders a Hebrew expression that likely refers geographically to the region eastward from Moab.
    reason: lexical_alternative
  - marker: c
    text: The second verb differs from “curse.” It can also be rendered “execrate,” but “denounce” is used here for readable modern English while preserving the distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자신의 시적 선언을 읊어 말했습니다. “모압 왕 발락이 아람에서 나를 데려왔습니다[a], 동쪽의 산들에서[b] 말입니다. ‘와서 나를 위하여 야곱을 저주하라. 그리고 와서 이스라엘을 규탄하라[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 자신의 신탁을 선포하며 말했습니다.” 히브리어 관용구는 문자적으로 “그의 마솰을 들었다”이며, 격식 있는 시적 발화를 도입합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “동쪽 산들에서.” 이 히브리어 표현은 모압 동쪽 지역을 가리키는 지리적 표현으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 앞의 “저주하라”와 다른 동사입니다. “규탄하라”는 두 동사의 구별을 보존하면서 적대적인 발화의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  english_pob_choice: he took up his discourse
  chosen_korean: 자신의 마솰을 들고
  alternatives_korean:
  - 자신의 말씀을 전하고
  - 자신의 신탁을 들고
  lexicon: HALOT
  rationale: 히브리어 관용구는 격식 있는 시적 발화를 여는 표현이므로, 본래 단어를 살린 ‘마솰’을 두고 동사구는 직역보다 자연스러운 한국어로 옮겼습니다.
- source_word: מִן אֲרָם
  english_pob_choice: From Aram
  chosen_korean: 아람에서
  alternatives_korean:
  - 아람으로부터
  - 시리아에서
  lexicon: HALOT
  rationale: 지명 아람을 유지해 본문이 말하는 출처를 그대로 드러내고, 후대의 지리명 ‘시리아’로 바꾸지 않았습니다.
- source_word: יַנְחֵנִי
  english_pob_choice: has led me
  chosen_korean: 나를 데려왔습니다
  alternatives_korean:
  - 나를 이끌었습니다
  - 나를 인도했습니다
  lexicon: HALOT
  rationale: 발락이 발람을 불러 데려온 맥락이므로, ‘데려오다’가 방향성과 행위의 결과를 한국어로 가장 분명하게 전달합니다.
- source_word: זֹעֲמָה
  english_pob_choice: denounce
  chosen_korean: 저주하라
  alternatives_korean:
  - 규탄하라
  - 선포된 저주를 내리라
  lexicon: HALOT
  rationale: 이 동사는 앞의 אָרָה와 구별되지만, 한국어에서는 둘 다 적대적 저주 요청으로 자연스럽게 읽히므로 기본 의미를 살리되 본문의 반복 대비를 유지했습니다.
theological_decisions:
- issue: ‘마솰’의 한국어 처리
  chosen_reading: 전통 교회어의 ‘비유’로 환원하지 않고 음역 ‘마솰’을 유지했습니다.
  alternative_readings:
  - 신탁
  - 격언
  - 비유
  rationale: 이 표현은 단순한 속담도, 일반적인 비유도 아니라 격식 있는 시적 발화입니다. 음역을 통해 문학적 형식을 보존하면서, 본문이 가진 특수한 장르감을 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 두 개의 ‘저주’ 동사
  chosen_reading: 두 동사를 모두 ‘저주하다’로 처리하되, 문맥상 반복과 병렬을 살렸습니다.
  alternative_readings:
  - 첫째는 ‘저주하다’, 둘째는 ‘저주를 선포하다’
  - 첫째는 ‘저주하다’, 둘째는 ‘저주하다/규탄하다’
  rationale: 히브리어는 서로 다른 두 동사를 사용하지만, 발락의 요청 핵심은 동일한 적대적 저주입니다. 한국어에서는 과도한 어휘 분화보다 요청의 강도를 보존하는 것이 더 명료합니다.
  doctrine_reference: Translation philosophy §§1, 5
