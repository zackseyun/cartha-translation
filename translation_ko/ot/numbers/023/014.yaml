  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
  footnotes:
  - marker: a
    text: Or 'the field of Zophim.' The Hebrew phrase can be understood either as a translated place description ('Field of Watchers/Lookouts') or as a preserved place name.
    reason: alternative_reading
translation:
  language: ko
  text: 발락은 발람을 소빔 들[a], 곧 비스가 산꼭대기로 데리고 가서 제단 일곱 개를 세우고, 각 제단 위에 수소 한 마리와 숫양 한 마리를 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파수꾼들의 들’. 히브리어 구문은 ‘파수꾼들/망보는 자들의 들’이라는 뜻으로도, 고유한 지명으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂדֵה צֹפִים
  english_pob_choice: the Field of Zophim
  chosen_korean: 지켜보는 들판
  alternatives_korean:
  - 초핌의 들판
  - 망보는 들판
  - 초지망의 들판
  lexicon: HALOT
  rationale: צֹפִים은 ‘지켜보는 자들/망보는 자들’이라는 뜻을 가질 수 있으므로, 본문 의미를 살리되 장소명 가능성은 각주로 남겼습니다.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  english_pob_choice: to the top of Pisgah
  chosen_korean: 비스가 산꼭대기
  alternatives_korean:
  - 비스가의 정상
  - 비스가 꼭대기
  - 비스가 산의 꼭대기
  lexicon: HALOT
  rationale: רֹאשׁ은 지리적 맥락에서 ‘꼭대기/정상’이 자연스럽고, הַפִּסְגָּה는 고유지명 비스가로 옮기는 것이 문맥에 가장 잘 맞습니다.
- source_word: וַיַּעַל פָּר וָאַיִל
  english_pob_choice: offered a bull and a ram
  chosen_korean: 수소 한 마리와 숫양 한 마리를 바쳤습니다
  alternatives_korean:
  - 황소 한 마리와 숫양 한 마리를 바쳤습니다
  - 수송아지 한 마리와 숫양 한 마리를 바쳤습니다
  - 수소 한 마리와 숫양 한 마리를 제물로 드렸습니다
  lexicon: HALOT
  rationale: 제의적 עולה는 여기서 ‘바치다’가 자연스럽고, פָּר וָאַיִל은 각 한 마리씩의 희생 동물을 가리키므로 수량을 분명히 했습니다.
