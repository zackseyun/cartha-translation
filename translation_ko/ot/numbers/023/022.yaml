theological_decisions:
- issue: רְאֵם의 전통 번역과 현대 의미
  chosen_reading: ‘들소’로 옮겨 오래된 ‘외뿔소/유니콘’ 전통을 따르지 않았습니다.
  alternative_readings:
  - 외뿔소
  - 유니콘
  rationale: 본문은 신화적 존재가 아니라 강력한 야생 들짐승의 힘을 비유합니다. 현대 독자가 오해하지 않도록, 원어의 동물 이미지를 우선했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 전통 번역보다 어휘 증거를 우선함.
