base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
  footnotes:
  - marker: a
    text: Or 'he has the strength of a wild ox.' The Hebrew phrase is difficult; the translation preserves the animal imagery rather than reducing it to an abstract quality.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'unicorn'; more likely a wild ox or aurochs.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그들을 이집트에서 이끌어 내십니다. 그에게는 야생 황소의 뿔 같은 위력이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 표현은 해석이 어렵습니다. 문자적으로는 ‘야생 황소의 뿔들/높은 위력과 같이’라는 비유이며, 여기서는 동물의 뿔이 나타내는 위력의 이미지를 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야생 황소’에 해당하는 히브리어 레엠(rēʾēm)은 전통적으로 ‘유니콘’ 또는 ‘외뿔소’로 번역되기도 했습니다. 그러나 오늘날에는 대체로 야생 황소, 특히 오록스와 같은 강한 야생 소과 동물로 이해합니다.
    reason: lexical_alternative
