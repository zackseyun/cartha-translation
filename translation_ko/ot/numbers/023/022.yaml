  - 그들을 데리고 나오십니다
  lexicon: HALOT
  rationale: 히필 분사의 현재적·지속적 뉘앙스를 살리면서 출애굽 이미지를 자연스럽게 드러내기 위해 ‘데리고 나오시니’로 옮겼습니다.
- source_word: כְּתוֹעֲפֹת רְאֵם
  english_pob_choice: has for him the horns of a wild ox
  chosen_korean: 그를 위해 들소의 뿔들을 가지고 계십니다
  alternatives_korean:
  - 그를 위해 들소의 뿔 같은 힘을 가지고 계십니다
  - 그를 위해 들소의 뿔을 지니고 계십니다
  lexicon: HALOT
  rationale: 영어 POB가 보존한 동물 이미지에 맞추어 추상화된 ‘힘’보다 ‘들소의 뿔들’을 택해 상징적 힘을 그대로 살렸습니다.
- source_word: לוֹ
  english_pob_choice: for him
  chosen_korean: 그를 위해
  alternatives_korean:
  - 그를 위하여
  - 그에게
  lexicon: HALOT
  rationale: 3인칭 남성 단수 목적격/여격의 형태를 그대로 드러내어, 본문의 문법적 긴장을 평탄화하지 않았습니다.
theological_decisions:
- issue: רְאֵם의 전통 번역과 현대 의미
  chosen_reading: ‘들소’로 옮겨 오래된 ‘외뿔소/유니콘’ 전통을 따르지 않았습니다.
  alternative_readings:
  - 외뿔소
  - 유니콘
  rationale: 본문은 신화적 존재가 아니라 강력한 야생 들짐승의 힘을 비유합니다. 현대 독자가 오해하지 않도록, 원어의 동물 이미지를 우선했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 전통 번역보다 어휘 증거를 우선함.
