  - 전능하신 하나님
  lexicon: HALOT
  rationale: 여기서는 호칭이 아니라 문장의 주어이므로, 본문 흐름에 맞게 단순히 ‘하나님’으로 옮겼습니다.
- source_word: מוֹצִיאָם
  english_pob_choice: brings them out
  chosen_korean: 그들을 데리고 나오시니
  alternatives_korean:
