source:
  edition: WLC
  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
  footnotes:
  - marker: a
    text: Or 'he has the strength of a wild ox.' The Hebrew phrase is difficult; the translation preserves the animal imagery rather than reducing it to an abstract quality.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'unicorn'; more likely a wild ox or aurochs.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그들을 이집트에서 데리고 나오시니, 그는 그를 위해 들소의 뿔들을 가지고 계십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 위해 들소의 뿔들’이라는 이미지를 사용합니다. 여기서는 추상적인 ‘힘’으로 풀어 쓰지 않고 동물적 힘의 비유를 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 레엠(rēʾēm)은 전통적으로 ‘유니콘’으로도 번역되었지만, 현재는 들소/야생 황소로 이해하는 것이 더 타당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
