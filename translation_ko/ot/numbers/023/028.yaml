  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
  footnotes:
  - marker: a
    text: Or 'overlooks the desert'; Hebrew 'the Jeshimon' may be understood either as a descriptive term ('the wasteland/desert') or as a place-name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 발락이 발람을 페오르 꼭대기로 데리고 갔습니다. 그곳은 황무지를 내려다보고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야를 내려다보고 있었습니다’. 히브리어 ‘예시몬’은 설명적 표현(황무지/광야)으로도, 고유 지명으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: Then ... took
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 끌고 갔습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 이어 주면서, 발락이 발람을 목적지로 이동시키는 행위를 한국어로 매끄럽게 표현했습니다.
- source_word: רֹאשׁ הַפְּעוֹר
  english_pob_choice: the top of Peor
  chosen_korean: 페오르 꼭대기
  alternatives_korean:
  - 페오르의 꼭대기
  - 페오르 정상
  lexicon: HALOT
  rationale: רֹאשׁ는 지형 문맥에서 ‘꼭대기/정상’의 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘꼭대기’를 택했습니다.
- source_word: הַנִּשְׁקָף
  english_pob_choice: which overlooks
  chosen_korean: 내려다보고 있었습니다
  alternatives_korean:
  - 굽어보고 있었습니다
  - 내려다보는 곳이었습니다
  lexicon: HALOT
  rationale: 분사형이 지닌 지형적 ‘내려다봄/조망함’을 한국어 진행형으로 풀어, 장소의 상태를 자연스럽게 나타냈습니다.
- source_word: הַיְשִׁימֹן
  english_pob_choice: the wasteland
  chosen_korean: 황무지
  alternatives_korean:
  - 광야
  - 황야
  lexicon: HALOT
  rationale: 여기서는 지명보다 ‘황량한 땅’이라는 어휘적 의미가 핵심이므로, 영어 POB의 ‘wasteland’에 맞춰 ‘황무지’로 옮겼습니다.
