source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
  footnotes:
  - marker: a
    text: Or 'God encountered Balaam'; the Hebrew verb can denote an encounter and in some contexts carries a nuance of happening upon.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 발람을 만나셨습니다[a]. 발람이 하나님께 말했습니다. “나는 일곱 제단을 마련했고 제단 위에 수송아지 한 마리와 숫양 한 마리를 바쳤습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님이 발람을 마주치셨다’; 히브리어 동사는 만남을 뜻할 수 있으며, 어떤 문맥에서는 ‘우연히 마주침’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר אֱלֹהִים אֶל בִּלְעָם
  english_pob_choice: God met with Balaam
  chosen_korean: 하나님이 발람을 만나셨습니다
  alternatives_korean:
  - 하나님이 발람에게 나타나셨습니다
  - 하나님이 발람을 만났습니다
  - 하나님이 발람에게 우연히 마주치셨습니다
  lexicon: WLC/문맥
  rationale: וַיִּקָּר는 단순한 우연보다 실제적인 신적 만남을 가리킬 수 있으므로, ‘만나셨습니다’로 자연스럽게 옮기되 우연성을 덧씌우지 않았습니다.
- source_word: וַיֹּאמֶר אֵלָיו
  english_pob_choice: and he said to him
  chosen_korean: 그가 발람에게 말했습니다
  alternatives_korean:
  - 그리고 그에게 말했습니다
  - 발람이 그에게 말했습니다
  lexicon: 문맥
  rationale: 이어지는 1인칭 발화가 발람의 말임을 보여 주므로, 주어를 명시해 한국어에서 발화 주체가 분명하게 드러나게 했습니다.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  english_pob_choice: the seven altars
  chosen_korean: 일곱 제단을
  alternatives_korean:
  - 그 일곱 제단을
  - 일곱 제단들
  lexicon: WLC
  rationale: 직접목적 표지와 정관사는 이미 문맥상 특정된 일곱 제단을 가리키므로, 한국어에서는 자연스럽게 ‘일곱 제단을’로 옮겼습니다.
- source_word: וָאַעַל פָּר וָאַיִל
  english_pob_choice: offered a bull and a ram
  chosen_korean: 수송아지 한 마리와 숫양 한 마리를 바쳤습니다
  alternatives_korean:
  - 수송아지와 숫양을 바쳤습니다
  - 황소 한 마리와 숫양 한 마리를 바쳤습니다
  - 수송아지 한 마리와 숫양 한 마리를 제물로 드렸습니다
  lexicon: WLC/문맥
  rationale: עלה는 제의 문맥에서 ‘바치다/올리다’가 자연스럽고, פָּר는 여기서 제의적 동물로서 ‘수송아지’가 정확하며, איל은 ‘숫양’이 표준적입니다.
- source_word: בַּמִּזְבֵּחַ
  english_pob_choice: on the altar
  chosen_korean: 제단 위에
  alternatives_korean:
  - 각 제단 위에
  - 그 제단 위에
  - 제단에서
  lexicon: WLC/문맥
  rationale: 히브리어는 단수형이므로 본문에 없는 분배적 ‘각’은 넣지 않고, 제의 행위를 한국어로 자연스럽게 보여 주는 ‘제단 위에’로 옮겼습니다.
theological_decisions:
- issue: וַיִּקָּר의 신적 만남 뉘앙스
  chosen_reading: 우연한 마주침이 아니라 하나님이 주도하시는 실제 만남으로 옮겼습니다.
  alternative_readings:
  - 우연히 마주치셨습니다
  - 발람에게 들이닥치셨습니다
  rationale: 문맥상 하나님의 의도적 개입이 핵심이므로, 우연성을 강화하는 번역은 본문의 신학적 긴장을 왜곡할 수 있습니다.
  doctrine_reference: 본문 문맥의 신적 주도성
