translation:
  language: ko
  text: 발락이 발람에게 말했습니다. 「그를 전혀 저주하지도 말고, 전혀 축복하지도 마십시오!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 절에서 ‘저주하다/축복하다’를 부정과 함께 반복하여 강한 금지를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
