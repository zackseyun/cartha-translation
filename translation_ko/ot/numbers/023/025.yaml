  rationale: 서술 내러티브의 진행을 자연스러운 현대 한국어로 옮기되, 원문의 단순 서술 동사를 유지했습니다.
- source_word: קֹב ... לֹא תִקֳּבֶנּוּ
  english_pob_choice: Neither curse him at all
  chosen_korean: 그를 전혀 저주하지도
