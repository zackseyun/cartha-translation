    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 대접
  alternatives_korean:
  - 접시
  - 그릇
  - 사발
  lexicon: HALOT
  rationale: 제의적 제물 목록에서 כַּף는 손바닥이 아니라 담는 용기이므로, 현대 한국어에서 자연스럽고 구체적인 ‘대접’으로 옮겼습니다.
- source_word: עֲשָׂרָה
  english_pob_choice: ten shekels
  chosen_korean: 열 세겔
  alternatives_korean:
