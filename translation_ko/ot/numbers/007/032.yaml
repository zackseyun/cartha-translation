  rationale: 제의 문맥에서 קְטֹרֶת는 통상 향을 가리키므로, 한국어 성경 문체에서 자연스러운 ‘향’을 사용했습니다.
theological_decisions:
- issue: 제물 목록의 축약된 계량 표현 보충
  chosen_reading: ‘열 세겔’을 본문 의미에 맞게 보충해 읽었습니다.
  alternative_readings:
  - 히브리어의 축약을 따라 ‘열’만 옮길 수 있음
  rationale: 바로 앞뒤의 반복되는 봉헌 목록이 동일한 무게 공식을 공유하므로, 독자가 제물의 규격을 바로 이해하도록 생략된 단위를 보충하는 것이 타당합니다.
  doctrine_reference: 민수기 7장의 성막 봉헌 규례 문맥
