  lexicon: HALOT
  rationale: 본문의 히브리어는 단순히 ‘열’이지만, 주변 반복 공식에서 무게 단위가 생략된 것으로 보이므로 한국어에서는 이해를 위해 ‘세겔’을 보충했습니다.
- source_word: זָהָב
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
