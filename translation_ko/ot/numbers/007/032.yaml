  rationale: 그릇의 재질을 나타내므로 형용사형보다 명사형 ‘금’이 더 직접적이고 문맥에도 맞습니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향기로운 향
