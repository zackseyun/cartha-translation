lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  english_pob_choice: male goat
  chosen_korean: 암염소
  alternatives_korean:
  - 수염소
  - 염소
  lexicon: HALOT
  rationale: 히브리어 표현은 염소 가운데 성숙한 개체를 가리키며, 제의 문맥에서는 ‘염소’보다 성별이 드러나는 번역이 더 정확합니다. 한국어에서는 제물 목록에서 자연스럽고 명확한 표현으로 ‘암염소’가 적절합니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 한 마리
  alternatives_korean:
  - 하나
  - 한
  lexicon: HALOT
  rationale: 수량을 분명히 드러내기 위해 한국어 제물 표현에 맞는 동물 계수법 ‘한 마리’를 사용했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 속죄제물로서
  - 속죄제물로 바쳐
  lexicon: HALOT
  rationale: 제의 문맥의 חַטָּאת는 추상적 ‘죄’가 아니라 ‘속죄제물’을 가리키므로, 한국어 성경에서 통용되는 제의적 의미를 살려 ‘속죄제물’로 옮겼습니다. לְ는 제물의 용도를 나타내는 ‘-로’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 제의 용어 חַטָּאת의 범주
  chosen_reading: ‘죄’가 아니라 ‘속죄제물’로 이해하여 번역했습니다.
  alternative_readings:
  - ‘죄를 위한’
  - ‘속죄제사’
  rationale: 민수기 7장의 봉헌 목록에서는 제물 종류를 열거하는 형식이므로, 독자가 제의 항목을 바로 이해하도록 ‘속죄제물’이 가장 직접적입니다.
  doctrine_reference: 레위기 제의 용례 전반
