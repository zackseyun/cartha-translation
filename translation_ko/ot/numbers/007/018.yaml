translation:
  language: ko
  text: 둘째 날에 잇사갈의 지도자인 수알의 아들 느다넬이 제물을 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단지 ‘바쳤다’고만 말합니다. ‘제물’은 민수기 7장의 반복 문맥에서 보충한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: בַּ/יּוֹם֙ הַ/שֵּׁנִ֔י
  english_pob_choice: On the second day
  chosen_korean: 둘째 날에
  alternatives_korean:
  - 두 번째 날에
  - 둘째 날
  lexicon: HALOT
  rationale: בְּ+יוֹם+서수 표현은 시간 부사구이므로, 한국어에서는 자연스럽게 ‘둘째 날에’로 옮기는 것이 가장 간결하고 정확합니다.
- source_word: הִקְרִ֖יב
  english_pob_choice: presented
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 드렸습니다
  - 제시했습니다
  - 가져왔습니다
  lexicon: HALOT
  rationale: 이 동사는 제의적 맥락에서 ‘가까이 가져오다/바치다’의 의미를 가지며, 이 절은 반복되는 봉헌 문맥 안에 있으므로 한국어에서는 제의 행위를 드러내는 ‘바쳤습니다’가 적절합니다.
- source_word: נְשִׂ֖יא
  english_pob_choice: the leader
  chosen_korean: 지도자
  alternatives_korean:
  - 수장
  - 족장
  - 우두머리
  lexicon: HALOT
  rationale: 지파 문맥의 נָשִׂיא는 왕족의 ‘왕자’보다 공동체를 대표하는 ‘지도자/수장’의 의미가 분명하므로, 현대 한국어에서는 ‘지도자’가 오해가 적습니다.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  english_pob_choice: Nethanel son of Zuar
  chosen_korean: 느다넬—수알의 아들—
  alternatives_korean:
  - 느다넬, 수알의 아들
  - 느다넬, 수알의 아들
  lexicon: BDB
  rationale: 고유명사는 통용 음역을 따르되, 히브리어의 동격·삽입 구조를 한국어에서도 대시로 살려 인물 표지를 분명히 했습니다.
