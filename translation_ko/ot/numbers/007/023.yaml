  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for the Hebrew term שְׁלָמִים.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린 숫양 다섯 마리였습니다. 이것이 수알의 아들 느다넬의 예물이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or ‘fellowship offerings’ or ‘offerings of well-being’ for the Hebrew term שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 화목제의 제물로는
  alternatives_korean:
  - 평안제의 제물로는
  - 교제제의 제물로는
  - 화목제물로는
  lexicon: HALOT
  rationale: שְׁלָמִים의 제의적 용례를 한국어 성경에서 널리 이해되는 ‘화목제’로 옮기되, ‘제물로는’으로 הבא오는 다음 항목의 목록 구조를 자연스럽게 드러냈습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 소 두 마리
  - 두 마리의 소
  - 두 마리의 가축
  lexicon: HALOT
  rationale: בָּקָר은 집합적 소 가축을 가리키므로, 영어 POB의 ‘two cattle’ 취지를 살려 성별을 덧붙이지 않고 ‘소 두 마리’로 옮겼습니다.
- source_word: אֵילִם חֲמִשָּׁה / עַתּוּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams, five male goats, and five male lambs a year old
  chosen_korean: 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린 숫양 다섯 마리
  alternatives_korean:
  - 수양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린 숫양 다섯 마리
  - 숫양 다섯 마리, 염소 수컷 다섯 마리, 그리고 일 년 된 어린 숫양 다섯 마리
  lexicon: HALOT
  rationale: אֵילִם과 עַתּוּדִים의 수컷 표지를 분명히 하기 위해 ‘숫양’, ‘숫염소’를 사용했고, כְּבָשִׂים בְּנֵי שָׁנָה는 연령 정보를 살려 ‘일 년 된 어린 숫양’으로 옮겼습니다.
- source_word: זֶה קָרְבַּן נְתַנְאֵל בֶּן צוּעָר
  english_pob_choice: This was the offering of Nethanel son of Zuar
  chosen_korean: 이것이 수알의 아들 느다넬의 예물이었습니다
  alternatives_korean:
  - 이것이 수알의 아들 느다넬의 예물이었습니다
  - 이것이 수알의 아들 느다넬이 드린 예물이었습니다
  lexicon: HALOT
  rationale: 결말 공식의 זֶה קָרְבַּן은 단순한 ‘헌물’보다 제의 맥락을 살리는 ‘예물’이 적절하며, 인명은 현대 음역 관행에 맞춰 옮겼습니다.
theological_decisions:
- issue: שְׁלָמִים의 제의적 범주를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘화목제’로 번역하여 제사 체계 안의 정식 범주로 유지했습니다.
  alternative_readings:
  - 평안제
  - 교제제
  - 화평제
  rationale: 문맥상 특정 제사 종류의 목록이므로, 의미를 풀어쓴 표현보다 전통적으로 통용되며 범주성이 분명한 용어를 택했습니다.
  doctrine_reference: 제의 용어의 표준화와 문맥 일관성
- issue: כְּבָשִׂים의 성별과 연령을 함께 보존할지
  chosen_reading: ‘어린 숫양’으로 옮겨 성별(수컷)과 연령(일 년 됨)을 함께 드러냈습니다.
  alternative_readings:
  - 어린 양
  - 일 년 된 양
  - 일 년 된 숫양
  rationale: 영어 POB가 ‘male lambs a year old’로 성별과 나이를 모두 보존하므로, 한국어에서도 제물의 규격성을 약화시키지 않도록 두 정보를 함께 유지했습니다.
  doctrine_reference: 제물 규정의 세부성 보존
