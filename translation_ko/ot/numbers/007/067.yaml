revisions:
- from: 그의 예물은 은 접시 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 성소의 세겔에 따른 것이었습니다[a][b]. 두 그릇은 모두 고운 가루로 채워져 있었고, 기름에 섞어 바치는 곡식제물[d][c]이었습니다.
  to: 그의 예물은 은 접시 하나[a], 곧 성소의 세겔을 기준으로 무게가 백삼십 세겔인 것과, 은 대접 하나[b], 곧 칠십 세겔인 것이었습니다. 두 그릇은 모두 곡식제물로 드릴, 기름을 섞은 고운 가루로 가득 차 있었습니다[c].
  rationale: 원문의 수식 관계를 보존하도록 중량의 표준을 두 용기의 중량에 연결하고, ‘곡식제물로 드릴’이 기름을 섞은 고운 가루를 수식하도록 고쳤습니다. 또한 모든 각주 표지를 해당 어휘 또는 표현 바로 뒤에 배치하고, 근거가 약한 구조 설명 각주는 삭제했습니다.
