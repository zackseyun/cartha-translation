id: NUM.7.67
reference: Numbers 7:67
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), a shallow vessel used in the offering inventory.
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק), a ritual vessel.
    reason: lexical_alternative
  - marker: c
    text: That is, according to the sanctuary standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 은 접시 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 성소의 세겔에 따른 것이었습니다[a][b]. 두 그릇은 모두 고운 가루로 채워져 있었고, 기름에 섞어 바치는 곡식제물[d][c]이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘접시’가 아니라 ‘그릇’으로 볼 수 있습니다(קַעֲרָה). 얕은 제의용 용기입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 성소의 표준 중량에 따른 것입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘대접’이 아니라 ‘분무용 그릇’으로 볼 수 있습니다(מִזְרָק). 제의에 쓰이는 용기입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 본문에서 ‘두 그릇’은 곡식제물과 연결되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 헌물은
  lexicon: HALOT
  rationale: 제의적 헌납이라는 문맥을 살리면서도 한국어에서 자연스러운 ‘예물’을 택했습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 쟁반 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 얕은 용기라는 점을 살려 ‘접시’로 옮겼고, 제의 목록의 물건으로도 무리 없습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 분무대야 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의용 용기이므로 일상적 ‘그릇’보다 제의성을 드러내는 ‘대접’이 더 적절합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔에 따른 것이었습니다
  alternatives_korean:
  - 성소의 세겔대로였습니다
  - 성소 표준 세겔에 따른 것이었습니다
  lexicon: HALOT
  rationale: 표준 중량을 뜻하는 문구이므로 문자성을 유지하면서도 한국어로 자연스럽게 ‘따른 것’으로 처리했습니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식 제사
  lexicon: HALOT
  rationale: POB의 ‘grain offering’을 제의 기능이 드러나는 ‘곡식제물’로 옮겨, 고어적 교회 용어보다 원문 의미를 직접 드러냈습니다.
theological_decisions:
- issue: 제의 용어의 현대 한국어화
  chosen_reading: ‘예물’, ‘대접’, ‘곡식제물’처럼 기능이 드러나는 현대어를 사용했습니다.
  alternative_readings:
  - ‘제물’, ‘그릇’, ‘소제’
  rationale: 이 구절은 제의 목록을 나열하는 본문이므로, 전통 교회용어보다 사물과 용례를 직접 보여 주는 번역이 원문 이해에 더 유리합니다.
  doctrine_reference: 민수기 7장 성막 봉헌 헌납 목록
- issue: ‘성소의 세겔’의 처리
  chosen_reading: 중량 기준을 가리키는 표현으로 보아 ‘성소의 세겔에 따른 것’으로 옮겼습니다.
  alternative_readings:
  - ‘성소 세겔대로’
  - ‘성소 표준 세겔에 따라’
  rationale: 문맥상 신학적 강조점은 단위의 표준성이지 별도의 교리 진술이 아니므로, 측정 기준임을 분명히 하는 번역이 적절합니다.
  doctrine_reference: 민수기 7장 제의 헌납의 규격성
