  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/015.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ko
  text: 한 수소, 한 숫양, 한 일년 된 숫양을 번제물로 드립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 수소
  alternatives_korean:
  - 한 황소
  - 한 어린 수소
  - 한 소 한 마리
  lexicon: WLC; HALOT
  rationale: פַּר은 제의 문맥에서 수소/황소를 가리키며, בֶּן בָּקָר가 이미 가축성·소과 동물을 분명히 하므로 한국어에서는 중복을 피하고 자연스럽게 ‘수소’로 옮겼습니다.
- source_word: אַיִל אֶחָד
  english_pob_choice: one ram
  chosen_korean: 한 숫양
  alternatives_korean:
  - 한 양
  - 한 수양
  lexicon: WLC; HALOT
  rationale: אַיִל은 제의 목록에서 성체 숫양을 가리키므로, 일반 ‘양’보다 성별이 드러나는 ‘숫양’이 원문 정보를 더 정확히 반영합니다.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 일년 된 숫양
  alternatives_korean:
  - 한 한 살 된 어린 양
  - 한 일 년 된 어린 숫양
  - 한 숫양 한 마리, 일 년 된
  lexicon: WLC; HALOT
  rationale: כֶּבֶשׂ은 제의용 어린 양을 가리키며 בֶּן שְׁנָתוֹ는 ‘한 살’이라는 연령 표현입니다. 한국어에서는 자연스러운 제물 목록 형식을 살리기 위해 ‘일년 된’으로 옮겼습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제물로서
  - 번제로
  - 번제의 제물로
  lexicon: WLC; HALOT
  rationale: עֹלָה는 ‘번제’를 뜻하는 정식 제의 용어이므로, 문맥상 목록의 목적격 기능을 살려 ‘번제물로’가 가장 간결하고 분명합니다.
theological_decisions:
- issue: 제의 목록의 문체
  chosen_reading: 서술문형으로 자연스럽게 옮기되, 제물의 수와 종류를 그대로 드러냈습니다.
  alternative_readings:
  - 명령형에 가깝게 옮김
  - 직역식 나열문을 그대로 유지
  rationale: 본문은 봉헌 목록의 항목 진술이므로, 한국어에서는 읽기 쉬운 합쇼체 서술문으로 정리하면서도 원문의 항목성은 유지했습니다.
  doctrine_reference: 민수기 7장의 봉헌 제물 목록
