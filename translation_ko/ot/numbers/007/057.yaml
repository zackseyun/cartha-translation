  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
  footnotes:
  - marker: a
    text: Hebrew literally, 'one bull, a son of the herd.' The phrase is an idiom for a bull from the cattle herd, often rendered 'one young bull.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 마리의 수소와 한 마리의 숫양과 한 살 된 숫양 새끼 한 마리를 번제물로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 한 마리의 젊은 수소
  - 한 마리의 소
  lexicon: HALOT
  rationale: פַּר은 제물 목록에서 수소/황소를 가리키는 말로, b e n b a qār의 ‘from the herd’는 한국어에서 별도 꼬리표로 늘이지 않고 수소로 자연스럽게 옮겼습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 양 숫컷
  - 수양
  lexicon: HALOT
  rationale: אַיִל은 희생제 목록에서 표준적으로 ‘숫양’으로 옮기는 것이 가장 자연스럽고 정확합니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: male lamb
  chosen_korean: 숫양 새끼
  alternatives_korean:
  - 어린 숫양
  - 어린 양
  - 수양 새끼
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 제사 맥락에서 어린 양, 곧 어린 수컷을 뜻하므로 성별을 분명히 드러내는 ‘숫양 새끼’로 옮겼습니다.
- source_word: בֶּן שְׁנָתוֹ
  english_pob_choice: a year old
  chosen_korean: 한 살 된
  alternatives_korean:
  - 한 해 된
  - 첫해의
  - 한 살짜리
  lexicon: HALOT
  rationale: 연령 요건을 한국어 관용에 맞게 간단히 ‘한 살 된’으로 옮겼습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제 드림으로
  lexicon: HALOT
  rationale: עֹלָה는 번제이므로, 제물 목록 문맥에 맞게 ‘번제물로’라고 목적/용도를 표시했습니다.
