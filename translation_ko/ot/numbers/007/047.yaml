  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것이 엘리아삽, 드우엘의 아들의 제물이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 הַשְּׁלָמִים의 전통적 번역입니다. 영어 POB의 각주처럼 ‘교제 제물’ 또는 ‘평안 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  english_pob_choice: and for the sacrifice of
  chosen_korean: 그리고 …의 제물로는
  alternatives_korean:
  - 그리고 …을 위해
  - 그리고 …의 희생 제물로는
  lexicon: HALOT
  rationale: 연결사와 전치사의 누적 기능을 살리되, 제사 목록 문맥에 맞게 ‘제물로는’으로 자연스럽게 옮겼습니다.
- source_word: הַשְּׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화 제물
  - 교제 제물
  lexicon: HALOT
  rationale: 히브리어 שלמים의 제의적 관용어는 한국어 성경에서 널리 쓰이는 ‘화목제’가 가장 간명하고 문맥상 분명합니다.
- source_word: בָּקָר
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 두 마리의 소
  - 소 두 마리의 가축
  lexicon: HALOT
  rationale: 히브리어는 집합명사로 소과 가축을 가리키므로, 제물 목록의 한국어 표현으로 ‘소 두 마리’가 가장 자연스럽습니다.
- source_word: זֶה קָרְבַּן
  english_pob_choice: This was the offering of
  chosen_korean: 이것이 …의 제물이었습니다
  alternatives_korean:
  - 이것이 …의 예물이었습니다
  - 이것이 …의 제사였습니다
  lexicon: HALOT
  rationale: 결론 공식의 חוזר 구조를 살리면서, קָרְבָּן의 제의적 의미를 ‘제물’로 옮겼습니다.
theological_decisions:
- issue: הַשְּׁלָמִים의 제의적 명칭을 어떻게 살릴 것인가
  chosen_reading: ‘화목제’로 번역해 제의적 용례를 유지했습니다.
  alternative_readings:
  - ‘평화 제물’
  - ‘교제 제물’
  rationale: 이 문맥은 제사 목록의 규정 서술이므로, 전통적이면서도 의미가 분명한 제의 명칭을 유지하는 것이 독자가 본문 기능을 이해하는 데 유리합니다.
  doctrine_reference: 레위기 3장; 민수기 7장의 제물 목록
- issue: 숫자·단위 표현을 현대 한국어로 어떻게 전달할 것인가
  chosen_reading: ‘소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리’로 수량과 종류를 분명히 했습니다.
  alternative_readings:
  - ‘두 소, 다섯 숫양…’
  - ‘두 마리의 소…’
  rationale: 히브리어 열거의 제의적 정확성을 유지하면서도 현대 독자가 오해 없이 읽도록 수량과 성별·연령 조건을 명시했습니다.
  doctrine_reference: 민수기 7장 제물 봉헌 서술
