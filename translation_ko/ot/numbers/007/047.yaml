base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다.[a] 이것이 드우엘의 아들 엘리아삽의 제물이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 히브리어 הַשְּׁלָמִים의 전통적 번역입니다. ‘교제 제물’ 또는 ‘평안 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  english_pob_choice: and for the sacrifice of
  chosen_korean: 그리고 …의 제물로는
  alternatives_korean:
  - 그리고 …을 위해
