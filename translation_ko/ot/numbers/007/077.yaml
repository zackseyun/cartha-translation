  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for the Hebrew term traditionally rendered 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'two cattle'; many translations render this more specifically as 'two oxen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 희생으로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 한 살 된 숫양 다섯 마리였습니다. 이것이 악란의 아들 파기엘의 예물이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּקָר은 집합명사로, 많은 번역본이 더 구체적으로 ‘황소’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 화목제의 희생으로는
  alternatives_korean:
  - 평화제의 희생으로는
  - 화목제물로는
  lexicon: WLC; HALOT
  rationale: שְׁלָמִים은 제의 용어로서 전통적으로 ‘화목제’에 해당하므로 그 범주를 살리되, לְזֶבַח의 전치사 결합은 한국어에서 자연스러운 ‘~의 희생으로는’으로 옮겼습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 가축 두 마리
  - 소 두 마리의 짐승
  lexicon: WLC; HALOT
  rationale: בָּקָר은 집합명사로서 ‘소’가 가장 자연스럽고, 영어 POB의 주석처럼 보다 구체적인 ‘황소’로 제한하지는 않았습니다.
- source_word: אֵילִם חֲמִשָּׁה
  english_pob_choice: five rams
  chosen_korean: 숫양 다섯 마리
  alternatives_korean:
  - 양 다섯 마리
  - 수양 다섯 마리
  lexicon: WLC; HALOT
  rationale: אֵילִם은 일반 양이 아니라 숫양을 가리키므로 종별 구분을 유지했습니다.
- source_word: עַתֻּדִים חֲמִשָּׁה
  english_pob_choice: five male goats
  chosen_korean: 숫염소 다섯 마리
  alternatives_korean:
  - 염소 다섯 마리
  - 수염소 다섯 마리
  lexicon: WLC; HALOT
  rationale: עַתֻּדִים은 수컷 염소를 뜻하므로, 한국어에서 제의 맥락의 ‘숫염소’가 가장 직접적입니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: five male lambs a year old
  chosen_korean: 한 살 된 숫양 다섯 마리
  alternatives_korean:
  - 한 살 된 어린 숫양 다섯 마리
  - 한 살 된 양 다섯 마리
  lexicon: WLC; HALOT
  rationale: בְּנֵי שָׁנָה는 ‘한 살 된’의 연령 정보를 보존했고, כְּבָשִׂים은 제의 목록상 어린 숫양으로 이해하는 것이 자연스럽습니다.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  english_pob_choice: Pagiel son of Ocran
  chosen_korean: 악란의 아들 파기엘
  alternatives_korean:
  - 오크란의 아들 파기엘
  - 악란의 아들 파기엘
  lexicon: WLC; established biblical names
  rationale: פַּגְעִיאֵל은 음역했고, בֶּן עָכְרָן은 혈통 표지를 한국어의 표준적인 ‘~의 아들’ 구조로 옮겼습니다. 영어 POB의 Ocran은 한국어 음역으로는 ‘악란’이 자연스럽습니다.
