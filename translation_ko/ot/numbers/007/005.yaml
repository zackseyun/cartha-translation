base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
  footnotes:
  - marker: a
    text: Or, more formally, 'and they shall be for serving the service of the tent of meeting.' The main text renders the Hebrew idiom in natural English, since the objects in view are inanimate and are meant to be used in the sanctuary service.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each according to his service,' referring to distribution in keeping with each Levite's assigned duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 그들에게서 받으십시오. 그것들이 회막 봉사를 위해 쓰이게 하시고[a], 그것들을 레위인들에게 각자의 맡은 일에 따라 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그것들이 회막의 봉사를 섬기도록’이라는 용도 표현입니다. 여기서는 물품이 회막 봉사를 위해 사용됨을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘각 사람의 그의 봉사에 따라’입니다. 각 레위인의 맡은 직무에 맞추어 주라는 뜻입니다.
    reason: lexical_alternative
