source:
  edition: WLC
  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
  footnotes:
  - marker: a
    text: Or, more formally, 'and they shall be for serving the service of the tent of meeting.' The main text renders the Hebrew idiom in natural English, since the objects in view are inanimate and are meant to be used in the sanctuary service.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each according to his service,' referring to distribution in keeping with each Levite's assigned duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 그들에게서 가져다가 회막의 일을 하도록 하십시오. 그리고 그것들을 레위인들에게 주되, 각 사람의 일에 따라 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그것들이 회막의 일을 하도록’이라는 목적/용도 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘각 사람의 일에 따라’로, 레위인의 맡은 직무에 맞추어 배분한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  english_pob_choice: Take them from them
  chosen_korean: 그것들을 그들에게서 가져다가
  alternatives_korean:
  - 그것들을 그들에게서 받으십시오
  - 그것들을 그들 가운데서 취하십시오
  lexicon: HALOT
  rationale: קשיח한 명령형 לקח과 מקור구조 מֵאִתָּם를 자연스럽게 옮기되, 제물로 바쳐진 물품의 맥락을 살려 ‘가져다가’로 처리했습니다.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  english_pob_choice: let them be for doing the service of
  chosen_korean: 회막의 일을 하도록 하십시오
  alternatives_korean:
  - 회막의 봉사를 위하여 쓰이게 하십시오
  - 회막의 섬김을 위한 것이 되게 하십시오
  lexicon: HALOT
  rationale: מִשְׁתַּמֵּשׁ? 아니라 כאן의 목적/용도 표현 וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת를 한국어로는 물건이 ‘일을 하도록’ 쓰인다는 뜻이 가장 자연스럽고, 본문 맥락상 수레와 소를 말하므로 능동적 ‘섬기다’보다 용도 중심으로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 성막 맥락의 표준 명칭이므로 한국어 성경에서 널리 쓰이는 ‘회막’을 채택했습니다.
- source_word: אֶל הַלוִיִּם אִישׁ כְּפִי עֲבֹדָתוֹ
  english_pob_choice: to the Levites, each according to his service
  chosen_korean: 레위인들에게 주되, 각 사람의 일에 따라
  alternatives_korean:
  - 레위인들에게 주되, 각자의 직무에 따라
  - 레위인들에게 주되, 각 사람의 맡은 일에 따라
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법과 כְּפִי עֲבֹדָתוֹ의 ‘각기 맡은 일의 분량/성격에 따라’를 살려, 직무를 분배하는 뜻이 드러나도록 옮겼습니다.
theological_decisions:
- issue: 회막 물품의 용도 표현
  chosen_reading: 수레와 소는 사람처럼 ‘봉사’하는 주체가 아니라, 회막의 일을 수행하는 데 쓰이는 도구로 이해했습니다.
  alternative_readings:
  - ‘회막의 봉사를 위하여’처럼 더 직역적으로 옮길 수 있습니다.
  - ‘회막의 섬김을 위해’라고 추상화할 수도 있습니다.
  rationale: 히브리어의 목적/용도 표현을 한국어에서 어색하지 않게 풀되, 본문이 말하는 것은 물건의 기능적 사용이지 의인화된 봉사가 아님을 분명히 했습니다.
  doctrine_reference: 민수기 7장 문맥상의 제의적 배치와 운반 규정
- issue: 레위인에게의 분배 원칙
  chosen_reading: 각 사람의 맡은 일에 따라 물품을 배분하는 질서를 분명히 드러냈습니다.
  alternative_readings:
  - ‘각 사람의 봉사에 따라’로 더 문어적으로 옮길 수 있습니다.
  rationale: 본문은 무작위 분배가 아니라, 레위인의 배정된 직무에 맞춘 질서 있는 배치를 강조합니다.
  doctrine_reference: 민수기 3–4장의 레위 직무 분담
