  source_fidelity: The third animal, כֶּבֶשׂ בֶּן־שְׁנָתוֹ, is a one-year-old lamb (in this sacrificial context, a male lamb), not a ram. The draft's ‘한 살 된 숫양’ therefore duplicates אַיִל (‘숫양’) and loses the lamb/young-animal distinction. The rendering of פַּר בֶּן־בָּקָר as ‘수송아지’ is a defensible conventional rendering in a sacrificial inventory.
  naturalness: The compact inventory can naturally be retained in Korean. Adding ‘어린’ to the final animal clearly distinguishes it from the preceding adult ram while preserving the formal list style.
  terminology: ‘숫양’ accurately renders אַיִל; ‘어린 숫양’ accurately distinguishes כֶּבֶשׂ. ‘번제물로’ is suitable for לְעֹלָה in this elliptical sacrificial list.
