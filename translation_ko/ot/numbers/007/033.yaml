source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
  footnotes:
  - marker: a
    text: Hebrew literally, 'one bull, son of the herd'—an idiom for a bull from the cattle herd, often understood as a young bull.
    reason: lexical_alternative
  - marker: b
    text: Or 'one lamb in its first year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 수송아지[a], 한 숫양, 한 살 된 숫양 한 마리[b], 번제물로.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 수소, 소 떼의 아들’로, 소 떼에서 나온 수소를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘첫해의 숫양 한 마리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר / בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 수송아지
  alternatives_korean:
  - 한 황소
  - 한 송아지
  - 한 소 한 마리
  lexicon: HALOT
  rationale: 제사 목록 문맥에서 פַּר + בֶּן בָּקָר는 성체 소 가운데 제사용 수컷 소를 가리키므로, ‘수송아지’가 자연스럽고도 원문 의미를 과도하게 풀지 않습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  - 양 수컷
  lexicon: HALOT
  rationale: אַיִל은 제사 용어로 성숙한 수컷 양이므로, 표준적이고 간결한 ‘숫양’으로 옮겼습니다.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 살 된 숫양 한 마리
  alternatives_korean:
  - 한 살 된 어린 숫양 한 마리
  - 한 살짜리 숫양 한 마리
  - 첫해의 숫양 한 마리
  lexicon: HALOT
  rationale: כֶּבֶשׂ은 어린 양/새끼 양이지만 제사 목록에서는 성별이 있는 어린 수컷 양으로 이해되므로, 한국어에서는 ‘한 살 된 숫양’으로 풀어 나이와 성별을 함께 드러냈습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제 제물로
  lexicon: HALOT
  rationale: עֹלָה의 제사 명칭을 표준적으로 나타내면서, 목록의 서술형 어법에 맞게 ‘번제물로’라고 옮겼습니다.
theological_decisions:
- issue: 제물 목록의 압축된 숫자-명사 구조를 한국어에서 얼마나 풀어 쓸지
  chosen_reading: 원문 순서를 따라 각 제물을 ‘한 …’ 구조로 병렬 배치하되, 의미상 필요한 최소한의 설명만 보탰습니다.
  alternative_readings:
  - 수송아지 한 마리, 숫양 한 마리, 한 살 된 숫양 한 마리, 번제물로
  - 한 수송아지, 한 숫양, 한 살 된 어린 수컷 양, 번제물로
  rationale: 이 절은 서사보다 제사 목록의 정확성이 핵심이므로, 지나친 의역보다 원문의 열거 구조를 보존하는 쪽이 독자 이해와 감수에 유리합니다.
  doctrine_reference: 제사의 제물 규정은 레위기/민수기의 제의 언어를 일관되게 보존해야 합니다.
