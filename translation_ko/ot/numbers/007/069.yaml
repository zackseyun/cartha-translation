  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
  footnotes:
  - marker: a
    text: Hebrew literally, 'one bull, son of the herd.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one lamb'; the Hebrew term here is often used for a male lamb in sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 마리의 수소, 한 마리의 숫양, 한 마리의 한 살 된 숫양 새끼를 번제물로 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 마리의 수소, 곧 가축의 아들’입니다.
    reason: source_note
  - marker: b
    text: 히브리어 כֶּבֶשׂ은 문맥에 따라 ‘어린 양’ 또는 제사용 ‘숫양 새끼’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר / בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 한 마리의 소
  lexicon: HALOT
  rationale: פַּר는 제사용 맥락에서 수소를 가리키며, בֶּן בָּקָר의 분류적 기능을 한국어에서는 ‘수소’로 간결하게 살렸습니다.
- source_word: אַיִל
  english_pob_choice: one ram
  chosen_korean: 한 마리의 숫양
  alternatives_korean:
  - 한 마리의 양
  - 한 마리의 수양
  lexicon: HALOT
  rationale: אַיִל은 성숙한 수컷 양이므로, 제사용 동물 목록의 정확성을 위해 ‘숫양’으로 옮겼습니다.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 마리의 한 살 된 숫양 새끼
  alternatives_korean:
  - 한 마리의 한 살 된 어린 양
  - 한 마리의 일 년 된 숫양
  lexicon: HALOT
  rationale: כֶּבֶשׂ은 문맥상 제사용 어린 수양을 가리키며, בֶּן שְׁנָתוֹ의 연령 정보를 자연스럽게 드러내기 위해 ‘한 살 된’으로 옮겼습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 불태움 제물로
  lexicon: HALOT
  rationale: עֹלָה는 표준 제의 용어인 번제이므로, 목록형 구문에 맞게 ‘번제물로’로 간결하게 처리했습니다.
theological_decisions:
- issue: 제물 목록의 서술 방식
  chosen_reading: 제사 규정의 열거문답게 동물 수량과 종류를 직설적으로 제시하는 번역을 유지했습니다.
  alternative_readings:
  - 의역하여 ‘한 마리씩 바쳤습니다’처럼 동작을 보충하는 읽기
  - 제의적 문맥을 약화시켜 일반 동물 목록처럼 보이게 하는 읽기
  rationale: 원문은 제물의 구체적 항목을 나열하는 형식이므로, 서술적 보충보다 목록의 제의적 성격을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 7장 봉헌 제사 맥락
- issue: ‘כֶּבֶשׂ’의 성별/연령 표현
  chosen_reading: 문맥상 제사용 어린 수컷을 드러내기 위해 ‘숫양 새끼’와 ‘한 살 된’을 함께 살렸습니다.
  alternative_readings:
  - 단순히 ‘어린 양’으로 완화하는 읽기
  - 성별을 명시하지 않는 읽기
  rationale: 영어 POB가 sacrificial contexts에서 성별을 드러내는 방향을 취한 만큼, 한국어도 제의 목록의 구별성을 유지하는 쪽이 더 투명합니다.
  doctrine_reference: 제의 동물 규정의 구별성
