lexical_decisions:
- source_word: פַּר
  english_pob_choice: bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 제사 문맥의 פַּר는 성숙한 수소를 가리키므로, 현대 한국어로는 ‘수소’가 가장 자연스럽고 정확합니다.
- source_word: בֶּן בָּקָר
  english_pob_choice: from the herd
  chosen_korean: —
  alternatives_korean:
  - 가축에서 난
  - 소떼의
  lexicon: HALOT
  rationale: 이 구는 פַּר를 ‘들짐승’이 아니라 가축, 곧 소 계열임을 분명히 하는 수식이므로 한국어에서는 이미 뜻이 담긴 ‘수소’로 옮겨 별도 노출을 두지 않았습니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: male lamb
  chosen_korean: 수컷 어린양
  alternatives_korean:
  - 어린 숫양
  - 어린양
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 제사용 어린 수컷 양을 가리키므로, ‘수컷’과 ‘어린양’을 함께 써서 영어 POB의 성별 정보를 분명히 했습니다.
- source_word: בֶּן שְׁנָתוֹ
  english_pob_choice: a year old
  chosen_korean: 한 살 된
  alternatives_korean:
  - 일 년 된
  - 첫해의
  lexicon: HALOT
  rationale: 연령 조건을 현대 한국어에서 가장 자연스럽고 분명하게 드러내는 표현입니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제 드리려고
  lexicon: HALOT
  rationale: עֹלָה는 표준 제의 용어인 ‘번제’이므로, 문맥상 목적격을 살려 ‘번제물로’라고 옮겼습니다.
