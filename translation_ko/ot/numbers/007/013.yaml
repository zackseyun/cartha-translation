  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), a shallow vessel.
    reason: lexical_alternative
  - marker: b
    text: Or 'basin' for 'bowl' (מִזְרָק), a ritual vessel term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 예물은 무게가 백삼십 세겔인 은 접시 하나[a]와, 성소의 세겔을 기준으로 칠십 세겔인 은 대접 하나[b]였습니다. 둘 다 소제를 위한 기름 섞은 고운 가루로 가득 들어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접시’는 קַעֲרָה의 넓고 얕은 용기를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대접’은 מִזְרָק의 제의용 용기 성격을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  english_pob_choice: And his offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그리고 그의 예물은
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적 맥락의 ‘예물/제물’인데, 여기서는 목록 서술이라 간결한 ‘예물’이 자연스럽고, 소유격 ‘그의’를 살려 원문의 대응을 유지했습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 접시 한 개
  - 은 그릇 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 얕은 용기이므로 ‘접시’가 POB의 ‘plate’에 가장 가깝고, 현대 한국어에서 읽기 자연스럽습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver bowl
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 바닥이 깊은 그릇 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의용 그릇이지만 이 절에서는 기능보다 재고 목록의 항목성이 중요하므로, POB의 ‘bowl’에 맞춰 ‘대접’으로 옮겼습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소 세겔 기준으로
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소의 세겔대로
  lexicon: HALOT
  rationale: 계량 기준을 나타내는 표현으로, 직역적이면서도 현대 한국어에서 이해되는 ‘기준으로’를 사용해 성소의 공인 중량 표준임을 드러냈습니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식제물
  - 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה는 제의 맥락에서 정형화된 ‘소제’가 가장 정확하며, 한국 교회 전통 용어보다 원문 제의 범주를 더 분명히 보존합니다.
theological_decisions:
- issue: 제의 목록에서 קָרְבָּן과 מִנְחָה의 범주를 어떻게 구분할지
  chosen_reading: 첫 항목은 전체 ‘예물’로, 마지막은 특정 제의 항목인 ‘소제’로 구분했습니다.
  alternative_readings:
  - 모두 ‘제물’로 통일
  - 모두 ‘예물’로 통일
  rationale: 본문은 일반적인 봉헌물 명칭과 구체적 제의 항목을 함께 나열하므로, 용어를 구분해 제의 구조를 더 정확히 드러내는 것이 원문에 충실합니다.
