  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), and 'bowl' for 'basin' (מִזְרָק).
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 예물은 은 접시[a] 하나로, 그 무게는 성소 세겔로 백삼십 세겔이었습니다. 또 은 대접 하나로, 그 무게는 칠십 세겔이었습니다. 그 두 그릇은 모두 기름을 섞은 고운 가루로 가득 차 있었으며, 소제를 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접시’(קַעֲרָה)는 ‘그릇’으로, ‘대접’(מִזְרָק)은 ‘사발’ 또는 ‘그릇’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 헌물은
  - 그의 드림물은
  lexicon: HALOT
  rationale: 제의적 맥락의 קָרְבָּן은 ‘예물/제물’이 가능하지만, 이 절의 물품 목록에는 ‘예물’이 자연스럽고 종교적 의미도 유지합니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 쟁반 하나
  - 은 접시 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 넓은 얕은 용기라서, 한국어에서는 ‘접시’가 POB의 ‘plate’에 가장 가깝고 현대 독자에게도 분명합니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 물동이 하나
  - 은 대접 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의용 그릇을 가리키므로, 일반 ‘그릇’보다 기능이 드러나는 ‘대접’이 더 적절합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소의 세겔 기준에 따른 것이었습니다
  alternatives_korean:
  - 성소 세겔에 따른 것이었습니다
  - 성소의 세겔로 재면
  lexicon: HALOT
  rationale: 무게 표준을 뜻하므로 ‘기준’으로 풀어 주어, 단순한 화폐 단위가 아니라 성소에서 통용되는 측정 표준임을 살렸습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제용이었습니다
  alternatives_korean:
  - 곡식제사용이었습니다
  - 곡식제물용이었습니다
  - 소제용이었습니다
  lexicon: HALOT
  rationale: 제의 문맥의 מִנְחָה는 전통적이면서도 의미가 분명한 ‘소제’가 가장 정확하며, 문장 말미에서 용도를 간결하게 드러냅니다.
theological_decisions:
- issue: 제의 목록의 정체성
  chosen_reading: 이 절은 제단 예물의 물품·중량·용도를 건조하게 기록하는 목록문으로 처리했습니다.
  alternative_readings:
  - 서술을 더 매끈하게 풀어 감동적 문장으로 만들기
  - ‘예물’을 단순 선물처럼 완화하기
  rationale: 원문은 예배 감정보다 제의 규격을 전달하므로, 목록형 문체와 제의 용어를 유지하는 것이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: 민수기 7장의 성막 봉헌 예물 규정
