  - 사발
  - 숟가락
  lexicon: HALOT
  rationale: 제사 용기의 작은 얕은 그릇이라는 맥락을 살려, 오늘 한국어에서 기능이 분명한 ‘접시’로 옮겼습니다. ‘숟가락’은 현대어에서 식사용 도구로 오해되기 쉽습니다.
