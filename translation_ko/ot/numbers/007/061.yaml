revisions:
- from: 그의 예물은 은 접시 하나였는데, 무게는 백삼십 세겔이었습니다. 또 은 대야 하나는 칠십 세겔이었으며, 두 그릇 모두 기름에 섞은 고운 가루로 채워져 있어 소제용이었습니다.[a][b][c]
  to: 그의 예물은 은 접시 하나[a]로 무게는 백삼십 세겔이었고, 은 대야 하나[b]로 무게는 칠십 세겔이었는데, 모두 성소의 세겔에 따른 것이었습니다.[c] 두 그릇 모두 소제를 위한 기름에 섞인 고운 가루로 가득 차 있었습니다.
  rationale: 원문에 명시된 성소 세겔의 표준 중량을 본문에 복원하고, 두 용기 각각의 무게를 분명히 했습니다. 또한 기름에 섞인 고운 가루가 두 그릇에 가득 차 있으며 소제를 위한 것이라는 문장 관계를 자연스럽게 다듬었습니다.
