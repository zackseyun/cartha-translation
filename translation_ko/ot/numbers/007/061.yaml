  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק), a vessel used in sanctuary service.
    reason: lexical_alternative
  - marker: c
    text: '''By the shekel of the sanctuary'' means according to the sanctuary''s standard weight.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 은 접시 하나[a]로 무게는 백삼십 세겔이었고, 은 대야 하나[b]로 무게는 칠십 세겔이었는데, 모두 성소의 세겔에 따른 것이었습니다.[c] 두 그릇 모두 소제를 위한 기름에 섞인 고운 가루로 가득 차 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접시’(קַעֲרָה)는 ‘그릇’ 또는 ‘대접’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대야’(מִזְרָק)는 성소 봉사에 쓰인 용기이며, ‘그릇’ 또는 ‘바리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성소의 세겔에 따른 것’은 성소에서 사용하는 표준 중량에 따른 것이라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
