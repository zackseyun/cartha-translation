id: NUM.7.61
reference: Numbers 7:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק), a vessel used in sanctuary service.
    reason: lexical_alternative
  - marker: c
    text: '''By the shekel of the sanctuary'' means according to the sanctuary''s standard weight.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 은 접시 하나였는데, 무게는 백삼십 세겔이었습니다. 또 은 대야 하나는 칠십 세겔이었으며, 두 그릇 모두 기름에 섞은 고운 가루로 채워져 있어 소제용이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접시’는 קַעֲרָה의 가능한 번역으로, 더 직역하면 ‘그릇’ 또는 ‘대접’이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대야’는 מִזְרָק의 가능한 번역으로, 성소 봉사에 쓰이는 용기라는 점을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성소의 세겔 기준으로’는 ‘성소의 세겔’이 표준 중량을 뜻한다는 의미를 풀어 적은 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 드림은
  lexicon: HALOT
  rationale: קדש 문맥의 קָרְבָּן은 성소에 드리는 예물/제물을 가리키므로, 문장 흐름에 맞게 ‘예물’로 옮겼습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 접시 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 얕은 용기이므로, 현대 한국어에서 자연스러운 ‘접시’로 옮기되 은 재질을 유지했습니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 무게는 백삼십 세겔이었습니다
  alternatives_korean:
  - 무게가 백삼십 세겔이었습니다
  - 백삼십 세겔의 무게였습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘무게’ 명사를 살려, 헌물 목록의 계량 정보를 분명하게 드러냈습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대야 하나
  alternatives_korean:
  - 은 바리 하나
  - 은 그릇 하나
  lexicon: HALOT
  rationale: מִזְרָק은 성소 봉사에 쓰이는 용기이므로, 일상적 ‘그릇’보다 기능을 살린 ‘대야’를 선택했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔 기준으로
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소의 세겔대로
  lexicon: HALOT
  rationale: 표준 중량을 뜻하는 관용구이므로, ‘기준으로’라고 풀어 현대어에서 의미를 분명히 했습니다.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  english_pob_choice: fine flour mixed with oil
  chosen_korean: 기름에 섞은 고운 가루
  alternatives_korean:
  - 기름에 섞인 고운 가루
  - 기름으로 반죽한 고운 가루
  lexicon: HALOT
  rationale: 소제 재료인 סֹלֶת과 ‘섞다/혼합하다’의 뜻을 살려, 제물의 상태를 간결하게 표현했습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 의미
  chosen_reading: ‘소제’로 번역해 곡식 예물이라는 제의적 용례를 드러냈습니다.
  alternative_readings:
  - 예물
  - 곡식제물
  rationale: 이 문맥의 מִנְחָה는 일반적 ‘예물’이 아니라 제의 규정 속 곡식 제사를 가리키므로, 제의적 기능을 분명히 해야 합니다.
  doctrine_reference: 레위기 제사 규정 / 제의 용어 일관성
