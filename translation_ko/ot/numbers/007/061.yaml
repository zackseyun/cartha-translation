  - 은 접시 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 얕은 용기이므로, 현대 한국어에서 자연스러운 ‘접시’로 옮기되 은 재질을 유지했습니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 무게는 백삼십 세겔이었습니다
  alternatives_korean:
  - 무게가 백삼십 세겔이었습니다
