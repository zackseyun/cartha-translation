  source_fidelity: 히브리어는 두 용기의 무게가 모두 ‘성소의 세겔’이라는 표준에 따른 것임을 명시합니다. 초안은 이 핵심 계량 기준을 본문에 넣지 않고 각주에서만 언급하여 원문의 정보를 누락했습니다. 또한 מִזְרָק의 칠십 세겔은 그 용기의 무게이므로 이를 명시하는 편이 정확합니다.
  naturalness: 초안의 ‘기름에 섞은 고운 가루’는 수식 관계가 다소 어색하고, ‘소제용이었습니다’는 무엇이 소제용인지 불분명합니다. ‘소제를 위한 … 가루로 가득 차 있었습니다’라고 하면 현대 표준어 합쇼체로 자연스럽고 원문의 관계도 분명합니다.
  terminology: קָרְבָּן은 ‘예물’, סֹלֶת는 ‘고운 가루’, מִנְחָה는 제의 용어인 ‘소제’로 옮길 수 있습니다. קַעֲרָה와 מִזְרָק은 각각 ‘접시’와 ‘대야’로 유지하되 가능한 대안을 각주에 제시합니다.
