id: NUM.7.59
reference: Numbers 7:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'two cattle'; traditionally, 'two oxen.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'This is the offering of'; the English past tense reflects the narrative listing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것은 가믈리엘, 곧 페다수르의 아들의 제물이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘소 두 마리’입니다. 전통적으로는 ‘두 수소’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: שְׁלָמִים은 보통 ‘화목제’로 옮기는 제의 용어입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이것은 ...의 제물’이라는 직설 구문입니다. 한국어는 문맥상 과거형으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  english_pob_choice: And for the sacrifice of peace offerings
  chosen_korean: 화목제의 제물로는
  alternatives_korean:
  - 평화제의 제물로는
  - 화목제 희생으로는
  - 화목제물로는
  lexicon: HALOT
  rationale: שְׁלָמִים은 전통적으로 화목제로 옮기는 제의 용어이므로, POB의 peace offerings에 대응해 자연스럽게 화목제를 택했습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 두 마리의 소
  - 소 두 마리(전통적으로는 두 마리의 수소)
  - 두 마리의 가축
  lexicon: HALOT
  rationale: בָּקָר은 넓게는 소를 가리키는 집합명사이므로, POB의 ‘two cattle’ 취지를 살려 소 두 마리로 옮겼습니다.
- source_word: עַתֻּדִים חֲמִשָּׁה
  english_pob_choice: five male goats
  chosen_korean: 숫염소 다섯 마리
  alternatives_korean:
  - 염소 수컷 다섯 마리
  - 숫염소 다섯 마리(숫염소들)
  - 염소 다섯 마리
  lexicon: HALOT
  rationale: עַתּוּדִים은 수컷 염소를 뜻하므로, 성별 정보를 분명히 드러내는 숫염소를 선택했습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: five one-year-old lambs
  chosen_korean: 일 년 된 어린양 다섯 마리
  alternatives_korean:
  - 한 살 된 어린양 다섯 마리
  - 일 년 된 양 새끼 다섯 마리
  - 한 해 된 어린양 다섯 마리
  lexicon: HALOT
  rationale: ‘sons of a year’라는 연령 규정을 한국어 제의 문맥에서 자연스럽게 드러내기 위해 일 년 된 어린양으로 옮겼습니다.
- source_word: זֶה קָרְבַּן
  english_pob_choice: This was the offering of
  chosen_korean: 이것은 ...의 제물이었습니다
  alternatives_korean:
  - 이것이 ...의 제물이었습니다
  - 이것은 ...의 예물이었습니다
  - 이것은 ...의 드림물이었습니다
  lexicon: HALOT
  rationale: קָרְבָּן은 하나님께 드리는 제물/예물의 뜻이므로, 문맥상 제물이 가장 직접적입니다.
- source_word: גַּמְלִיאֵל
  english_pob_choice: Gamliel
  chosen_korean: 가믈리엘
  alternatives_korean:
  - 감리엘
  - 가말리엘
  lexicon: BDB/modern transliteration
  rationale: 히브리어 철자에 더 가까운 음역을 따랐고, 본문 인물명은 POB의 음역 원칙에 맞춰 처리했습니다.
- source_word: פְּדָה צוּר
  english_pob_choice: Pedahzur
  chosen_korean: 페다수르
  alternatives_korean:
  - 페다추르
  - 페다즈르
  lexicon: BDB/modern transliteration
  rationale: פְּדָה־צוּר의 합성 이름을 한국어 음역으로 옮겨, 원형의 고유명사성을 보존했습니다.
theological_decisions:
- issue: sacrificial term שְׁלָמִים의 번역 범위
  chosen_reading: 화목제
  alternative_readings:
  - 평화제
  - 친교제
  - 평강제
  rationale: 한국어 성경에서 확립된 제의 용어를 따르되, ‘peace offerings’의 관계적 의미를 과도하게 해석하지 않도록 가장 안정적인 대응어를 택했습니다.
  doctrine_reference: 구약 제의 용어의 표준적 한국어 대응
- issue: 인명 표기에서 전통 음역과 원어 근접 음역의 선택
  chosen_reading: 가믈리엘 / 페다수르
  alternative_readings:
  - 감리엘 / 가말리엘
  - 가말리엘 / 페다수르
  rationale: 원어 형태를 더 직접 반영하는 음역을 채택해, 본문 고유명사의 히브리어 음성형을 보존했습니다.
  doctrine_reference: 본문 고유명사 음역 원칙
