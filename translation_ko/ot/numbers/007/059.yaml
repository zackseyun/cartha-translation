base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'two cattle'; traditionally, 'two oxen.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'This is the offering of'; the English past tense reflects the narrative listing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제[b]의 제물로는 소 두 마리[a], 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것은 페다수르의 아들 가믈리엘의 제물이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘소 두 마리’입니다. 전통적으로는 ‘두 수소’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: שְׁלָמִים은 보통 ‘화목제’로 옮기는 제의 용어입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이것은 …의 제물’이라는 직설 구문입니다. 한국어는 문맥상 과거형으로 옮겼습니다.
    reason: source_note
