id: NUM.7.29
reference: Numbers 7:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린 숫양 다섯 마리였습니다. 이것이 헬론의 아들 엘리아브의 예물이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 그리고 화목제의 제물로는
  alternatives_korean:
  - 그리고 평화제의 제물로는
  - 그리고 화목제물을 위한 것으로는
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의 문맥에서 한국어 성경의 관용에 따라 ‘화목제’로 옮기되, 앞의 전치사 구조는 자연스러운 조사 표현으로 풀었습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 수소 둘
  alternatives_korean:
  - 소 두 마리
  - 가축 두 마리
  lexicon: HALOT
  rationale: בָּקָר는 집합명사지만 여기서는 제물 목록이므로 한국어에서는 더 자연스럽고 구체적인 ‘수소’로 옮겼습니다.
- source_word: אֵילִם חֲמִשָּׁה / עַתֻּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams, five male goats, and five male lambs a year old
  chosen_korean: 숫양 다섯, 숫염소 다섯, 그리고 일 년 된 숫양 다섯
  alternatives_korean:
  - 숫양 다섯, 숫염소 다섯, 그리고 한 살 된 어린양 다섯
  - 숫양 다섯, 숫염소 다섯, 그리고 한 해 된 새끼양 다섯
  lexicon: HALOT
  rationale: אֵילִם와 עַתֻּדִים는 각각 숫양과 숫염소로 분명하므로 성별을 살렸고, כְּבָשִׂים בְּנֵי שָׁנָה는 직역보다 한국어 제물 표현에 맞게 ‘일 년 된’으로 자연스럽게 풀었습니다.
- source_word: זֶה קָרְבַּן אֱלִיאָב בֶּן חֵלֹן
  english_pob_choice: This was the offering of Eliab son of Helon
  chosen_korean: 이것이 헬론의 아들 엘리아브의 예물이었습니다
  alternatives_korean:
  - 이것이 헬론의 아들 엘리아브의 제물이었습니다
  - 이것이 엘리아브, 헬론의 아들의 예물이었습니다
  lexicon: HALOT
  rationale: קָרְבָּן은 일반적 ‘예물/제물’ 가운데 문맥상 자연스러운 ‘예물’로 두었고, 반복적 결론 공식의 בעבר 시제는 한국어 서술에 맞춰 과거로 옮겼습니다.
theological_decisions:
- issue: 공식 제물 목록에서 שְׁלָמִים의 한국어 표준 대응
  chosen_reading: ‘화목제’로 번역했습니다.
  alternative_readings:
  - 평화제
  - 교제제물
  - 온전함의 제물
  rationale: 제의 목록을 한국어 독자가 즉시 알아볼 수 있게 하면서도, 본문이 가리키는 희생 제사의 범주를 유지하기 위해 전통적이지만 의미가 분명한 ‘화목제’를 택했습니다.
  doctrine_reference: Leviticus sacrificial system terminology; Numbers 7 offering lists
- issue: בָּקָר의 구체화
  chosen_reading: 집합명사 ‘가축’보다 제물 맥락에 맞는 ‘수소’로 구체화했습니다.
  alternative_readings:
  - 소 둘
  - 가축 두 마리
  rationale: 원문은 성별을 명시하지 않지만, 동일한 제의 목록에서 한국어는 통상 제물 단위를 분명히 하는 표현을 쓰므로, 독자가 제물의 종류를 즉시 이해하도록 ‘수소’로 옮겼습니다.
  doctrine_reference: Source-sensitive sacrificial inventory translation
