  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
  footnotes:
  - marker: a
    text: Or 'six covered wagons.' The Hebrew phrase עֶגְלֹת צָב is traditionally understood to refer to covered transport carts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 여호와 앞에 자기들의 헌물을 가져왔습니다. 곧 덮개를 씌운 수레 여섯 대와 소 열두 마리[a]였으니, 두 지휘관마다 수레 하나씩, 그리고 각 사람마다 소 한 마리씩이었습니다. 그들은 그것들을 성막 앞에 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덮개를 씌운 마차’로 옮길 수 있습니다. 히브리어 עֶגְלֹת צָב은 전통적으로 덮개가 있는 운반용 수레를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  english_pob_choice: their offering
  chosen_korean: 자기들의 헌물
  alternatives_korean:
  - 자기들의 제물
  - 자기들의 예물
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적 맥락에서 ‘가까이 드리는 것’으로, 여기서는 예배용 헌물을 자연스럽게 드러내는 ‘헌물’이 한국어에서 가장 무난합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 기록의 영어 본문은 본문 내 표기는 Yahweh를 취하지만, 한국어 성경 독자에게는 여호와가 가장 널리 인식되는 고유명사이므로 본문 읽기성을 위해 여호와를 사용했습니다.
- source_word: עֶגְלֹת צָב
  english_pob_choice: covered carts
  chosen_korean: 덮개를 씌운 수레
  alternatives_korean:
  - 덮개를 씌운 마차
  - 덮개가 있는 수레
  lexicon: HALOT
  rationale: עֶגְלֹת은 수레/마차 계열이고, צָב은 덮개가 있는 운반용 차량으로 이해되므로 ‘덮개를 씌운 수레’가 직역과 관용 사이에서 균형을 이룹니다.
- source_word: הַנְּשִׂאִים
  english_pob_choice: leaders
  chosen_korean: 지휘관
  alternatives_korean:
  - 지도자
  - 족장
  lexicon: HALOT
  rationale: 민수기 7장의 נשיאים은 지파 대표를 가리키므로 ‘지도자’도 가능하지만, 문맥상 각 지파를 이끄는 공식 대표라는 점을 더 분명히 보여 주는 ‘지휘관’을 택했습니다.
theological_decisions:
- issue: 여호와의 표기
  chosen_reading: 한국어 본문에서는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 יְהוָה를 직접 사용하지만, 이 한국어 초안은 교회권 독자에게 익숙한 고유명사 표기를 유지해 가독성을 확보했습니다. 다만 이 선택은 번역 원칙상 예외적이며, 개정본에서는 야훼 표기로 되돌릴 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 수레와 소의 배분 구조
  chosen_reading: ‘두 지휘관마다 수레 하나씩, 그리고 각 사람마다 소 한 마리씩’으로 분배 의미를 살렸습니다.
  alternative_readings:
  - 두 지도자마다 수레 하나씩, 소 한 마리씩
  - 두 수장마다 수레 하나씩, 각자 소 한 마리씩
  rationale: 히브리어는 수레와 소를 지파 지도자들 사이에 분배하는 구조를 분명히 하므로, 한국어에서도 분배 관계가 흐려지지 않도록 문장 안에 대응시켰습니다.
  doctrine_reference: Numbers 7:3 narrative distribution pattern
