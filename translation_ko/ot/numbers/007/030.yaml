  text: בַּ/יּוֹם֙ הָ/רְבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י רְאוּבֵ֑ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
  footnotes:
  - marker: a
    text: Or 'chief' or traditionally 'prince' for נָשִׂיא; the Hebrew denotes an official tribal head.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the sons of Reuben'; the Hebrew preposition can mark relation or representation in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 넷째 날에[a][b] 르우벤 자손의 지도자는 엘리추르, 셰데우리의 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족장’, 전통적으로는 ‘왕자’로도 옮길 수 있습니다. 히브리어 נָשִׂיא는 지파의 공식적 수장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘르우벤 자손을 위한’으로도 옮길 수 있습니다. 여기서 히브리어 전치사는 소속이나 대표를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 족장
  - 왕자
  lexicon: HALOT
  rationale: 지파의 공식적 수장을 가리키므로, 왕족 뉘앙스를 띠는 ‘왕자’보다 현대 한국어에서 기능을 더 분명히 드러내는 ‘지도자’가 원문의 직분적 의미를 잘 살립니다.
- source_word: לִבְנֵי רְאוּבֵן
  english_pob_choice: of the sons of Reuben
  chosen_korean: 르우벤 자손의
  alternatives_korean:
  - 르우벤의 아들들의
  - 르우벤 사람들의
  lexicon: HALOT
  rationale: לְ의 소속/대표 관계를 자연스럽게 드러내기 위해 ‘...의’ 구조를 쓰되, 성경적 족장 표현을 유지하는 ‘자손’을 택했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: '...의 아들'
  alternatives_korean:
  - '...의 아들인'
  - '...의 자녀'
  lexicon: HALOT
  rationale: 히브리어 족보·신원 표지로서의 부자 관계를 직접적으로 옮기기 위해 관용적인 ‘...의 아들’로 번역했습니다.
theological_decisions:
- issue: 나시(נָשִׂיא)의 직분 번역
  chosen_reading: ‘지도자’로 번역해 지파 대표의 공식적 지위를 드러냅니다.
  alternative_readings:
  - 족장
  - 왕자
  - 우두머리
  rationale: 민수기 문맥에서 이 শব্দ은 왕족이 아니라 지파의 공인된 우두머리를 뜻하므로, 오해를 줄이는 쪽을 택했습니다.
  doctrine_reference: 민수기 7장의 지파 대표 제도
- issue: 날짜 표현의 전치사 בְּ
  chosen_reading: ‘넷째 날에’로 옮겨 시간 부사를 자연스럽게 처리합니다.
  alternative_readings:
  - 넷째 날에
  - 넷째 날에 있어서
  rationale: 열거 문맥에서 בְּ + יום은 단순한 시점을 나타내므로, 한국어 시간 부사 ‘-에’가 가장 자연스럽습니다.
  doctrine_reference: 서술 문맥의 시간 표현
