  naturalness: ‘한 금 대접 하나’ is awkward in modern Korean. ‘금 대접 하나’ is concise and natural. Explicitly stating ‘무게는’ clearly conveys the elliptical weight formula without altering its sense.
  terminology: ‘대접’ is an acceptable contextual rendering of כַּף as a small ritual vessel, with a lexical-alternative note. ‘금,’ ‘세겔,’ and ‘향’ are appropriate standard terms.
  issues:
  - severity: medium
    issue: Redundant numeral in ‘한 금 대접 하나’
    rationale: אַחַת means ‘one’ only once. In Korean, both initial ‘한’ and final ‘하나’ express the same numeral; retaining both is unnatural and gives an impression of duplication rather than faithful emphasis.
  - severity: low
    issue: Footnote anchors are placed only at the sentence end
    rationale: The notes concern ‘세겔’ and ‘대접’ respectively, so placing each anchor directly after its relevant term improves clarity and preserves the intended lexical linkage.
