  yaml_path: translation/ot/numbers/007/038.yaml
  text: one gold dish[a], ten shekels[b], full of incense.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one gold dish, ten [of] gold, full of incense'; 'shekels' is supplied in English because the phrase is an abbreviated weight formula in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'pan,' 'bowl,' or traditionally 'spoon' for the vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 금 대접 하나[b]이며, 무게는 금 열 세겔[a]이고 향이 가득 담긴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘금 대접 하나, 금 열’이라고 하며, 이 문맥에서는 무게를 나타내는 생략형입니다. 문맥에 따라 ‘세겔’을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כַּף는 여기서 손바닥이 아니라 제의용 용기를 뜻합니다. ‘접시’, ‘그릇’, 또는 전통적으로 ‘숟가락’으로도 옮길 수 있습니다.
    reason: lexical_alternative
