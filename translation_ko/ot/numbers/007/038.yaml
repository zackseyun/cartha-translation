  - 금으로 된
  - 금빛의
  lexicon: HALOT
  rationale: 재질을 나타내는 말이므로 ‘금’으로 간결하게 옮겼고, 앞의 ‘한’과 결합해 ‘한 금 대접’이 되도록 했습니다.
- source_word: עֲשָׂרָה זָהָב
  english_pob_choice: ten shekels
  chosen_korean: 열 세겔의 금
  alternatives_korean:
  - 열 금 세겔
  - 열 세겔 무게의 금
  - 금 열 세겔
  lexicon: HALOT
  rationale: 히브리어는 이 문맥에서 생략된 무게 공식으로, 바로 앞뒤 평행절을 따라 ‘세겔’을 보충해야 의미가 분명해지므로 한국어에서도 이를 드러냈습니다.
- source_word: קְטֹרֶת
