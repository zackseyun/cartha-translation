  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/038.yaml
  text: one gold dish[a], ten shekels[b], full of incense.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one gold dish, ten [of] gold, full of incense'; 'shekels' is supplied in English because the phrase is an abbreviated weight formula in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'pan,' 'bowl,' or traditionally 'spoon' for the vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 금 대접 하나, 곧 열 세겔의 금으로 된 것이며, 향으로 가득 찬 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘금 한 대접, 곧 금 열 [세겔]’이라는 무게 생략형이며, 여기서는 문맥에 따라 ‘세겔’을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: כַּף는 여기서 손바닥이 아니라 제의용 용기를 뜻하며, 전통 번역의 ‘숟가락’보다는 문맥상 ‘대접’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 대접
  alternatives_korean:
  - 접시
  - 그릇
  - 숟가락
  lexicon: HALOT
  rationale: 제의 용기 목록 문맥에서는 손바닥이 아니라 작은 용기를 가리키므로, 현대 한국어에서 자연스럽고 의례적 용기를 떠올리게 하는 ‘대접’을 택했습니다.
- source_word: זָהָב
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
