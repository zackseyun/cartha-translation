  chosen_korean: 향
  alternatives_korean:
  - 향품
  - 분향
  lexicon: HALOT
  rationale: 성막 봉헌 목록의 제의적 물질을 가리키므로 현대 한국어에서 이해하기 쉬운 ‘향’을 사용했습니다.
