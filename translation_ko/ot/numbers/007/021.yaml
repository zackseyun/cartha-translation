  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
  footnotes:
  - marker: a
    text: Literally, 'one bull, son of the herd.' The Hebrew idiom means a bovine animal from the herd.
    reason: lexical_alternative
  - marker: b
    text: Or 'one lamb in its first year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 마리의 수소와 한 마리의 숫양과 한 마리의 일 년 된 숫양 새끼를 번제물로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 한 마리의 어린 소
  lexicon: HALOT
  rationale: 제사 목록의 동물명으로는 자연스럽고 간명하게 ‘수소’가 מתאים하며, 영어 POB가 풀어 준 ‘from the herd’의 중복 설명은 한국어에서 문맥상 이미 충분히 드러납니다.
- source_word: אַיִל אֶחָד
  english_pob_choice: one ram
  chosen_korean: 한 마리의 숫양
  alternatives_korean:
  - 한 마리의 양
  - 한 마리의 수양
  lexicon: HALOT
  rationale: אַיִל은 제의 맥락에서 성숙한 수컷 양이므로, 표준적이고 정확한 ‘숫양’이 가장 분명합니다.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתֹו
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 마리의 일 년 된 숫양 새끼
  alternatives_korean:
  - 한 마리의 한 살 된 숫양 새끼
  - 한 마리의 첫해 숫양 새끼
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 ‘어린 양’이지만, 뒤의 나이 표지를 살려 제의용 수컷 어린 양으로 분명하게 ‘숫양 새끼’로 옮겼습니다. ‘일 년 된’은 בן שנותו의 연령 조건을 자연스럽게 전달합니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제용으로
  lexicon: HALOT
  rationale: עֹלָה는 표준 제의 용어인 ‘번제’이며, 여기의 ל는 목적·용도를 나타내므로 ‘-로’가 가장 자연스럽습니다.
