  text: one golden dish of ten shekels[a], full of incense[b];
  footnotes:
  - marker: a
    text: Hebrew literally, 'one gold dish, ten [of] gold, full of incense'; 'shekels' is understood from the offering inventory formula in this chapter.
    reason: lexical_alternative
  - marker: b
    text: Traditional translations often render כַּף here as 'spoon'; the term refers to a small vessel or dish used for incense.
    reason: lexical_alternative
translation:
  language: ko
  text: 금으로 만든 한 개의 접시 곧 십 세겔이며, 향으로 가득 찬 것이라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘금 접시 하나, 금 십 [세겔]’에 가깝습니다. 이 장의 봉헌 목록 관용구상 ‘세겔’이 생략되어 있지만 의미상 보충됩니다.
    reason: source_note
  - marker: b
    text: כַּף는 전통 번역의 ‘숟가락’보다, 향을 담는 작은 제의용 용기라는 뜻을 살려 ‘접시’로 옮겼습니다.
    reason: lexical_alternative
