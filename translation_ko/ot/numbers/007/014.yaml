  lexicon: HALOT
  rationale: 재질을 나타내는 형용적 용법이므로 ‘금 그릇’이 간결하고 자연스럽습니다.
- source_word: עֲשָׂרָה
  english_pob_choice: ten shekels
  chosen_korean: 십 세겔
  alternatives_korean:
  - 열 세겔
  - 십 개
  lexicon: HALOT
  rationale: 이 절 자체에는 단위 명사가 생략되어 있지만, 바로 앞뒤의 봉헌 공식에서 중량 단위가 반복되므로 한국어에서도 그 보충을 드러내는 것이 source-grounded합니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향료
  - 분향
  lexicon: HALOT
  rationale: 여기서는 제의적 향 재료를 가리키므로 ‘향’이 가장 간명합니다. ‘분향’은 행위로 읽힐 수 있어 내용물 표시에 덜 적합합니다.
