lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 그릇
  alternatives_korean:
  - 접시
  - 사발
  - 숟가락
  lexicon: HALOT
  rationale: 제의 목록의 문맥에서는 손바닥이 아니라 봉헌용 용기를 가리키므로, 현대 한국어에서는 의미를 과도하게 좁히지 않는 ‘그릇’이 가장 자연스럽습니다. ‘숟가락’은 전통 번역의 영향은 있으나 오늘날 독자에게 용도 오해를 일으킬 수 있습니다.
