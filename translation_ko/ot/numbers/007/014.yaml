  rationale: 이 절 자체에는 단위 명사가 생략되어 있지만, 바로 앞뒤의 봉헌 공식에서 중량 단위가 반복되므로 한국어에서도 그 보충을 드러내는 것이 source-grounded합니다.
- source_word: קְטֹרֶת
