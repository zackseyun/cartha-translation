translation:
  language: ko
  text: 향으로 가득 찬 금 접시 하나, 무게는 십 세겔이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 무게 단위를 직접 적지 않지만, 이 반복되는 봉헌 공식에서는 ‘십 세겔’이라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 접시
  alternatives_korean:
  - 그릇
  - 사발
  - 숟가락
  lexicon: HALOT
  rationale: 성막 헌물 목록의 문맥에서 כַּף는 손바닥이 아니라 담는 용기의 의미이므로, 현대 한국어에서 자연스럽고 기능을 잘 드러내는 ‘접시’를 택했습니다. ‘숟가락’은 전통 번역과 이어지지만 현대 독자에게는 오해를 부를 수 있습니다.
- source_word: עֲשָׂרָה
  english_pob_choice: ten
  chosen_korean: 십
  alternatives_korean:
  - 열
  lexicon: HALOT
  rationale: 이 반복 공식에서 무게값을 나타내는 수량이므로, 관용적으로 숫자 표기 ‘십’으로 옮겨 문맥상 세겔 수를 바로 드러내도록 했습니다.
- source_word: זָהָב
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
  - 황금
  - 금으로 된
  lexicon: HALOT
  rationale: 물질 재료를 간단히 드러내는 표현으로 ‘금’이 가장 직접적입니다. 문맥상 ‘금 접시’가 자연스럽습니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향로용 향
  - 유향
  - 향료
  lexicon: HALOT
  rationale: 제의적 향물질을 가리키므로 ‘향’이 가장 간결하고 표준적입니다. ‘유향’은 더 좁은 물질명으로 오독될 수 있습니다.
theological_decisions:
- issue: 본문의 생략된 무게 단위
  chosen_reading: 히브리어 본문은 ‘십’ 뒤의 무게 단위를 생략하지만, 한국어 본문은 문맥상 ‘십 세겔’로 자연스럽게 보충했습니다.
  alternative_readings:
  - ‘금 접시 하나, 열, 향으로 가득 찼습니다.’처럼 단위를 드러내지 않는 직역
  rationale: 숫자만 남기면 한국어 독자가 헌물의 규격을 즉시 파악하기 어렵습니다. 반복되는 봉헌 공식의 관용적 의미를 살려, 본문이 암시하는 세겔을 드러냈습니다.
  doctrine_reference: 본문 이해를 돕는 문맥 보충이며 의미를 바꾸지 않습니다.
