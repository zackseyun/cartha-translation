  text: one gold dish weighing ten shekels[a], full of incense;
  footnotes:
  - marker: a
    text: Literally, 'one gold dish, ten [shekels], full of incense.' The Hebrew leaves the weight unit implicit here, but in this repeated offering formula the sense is ten shekels.
