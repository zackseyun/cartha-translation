    rationale: שְׁנֵיהֶם מְלֵאִים은 두 용기가 기름 섞인 고운 가루로 가득하다는 뜻입니다. ‘두 그릇에는 모두 … 소제였습니다’는 용기와 내용물의 관계를 어색하게 만들고 ‘가득’이라는 의미를 누락합니다.
  - severity: medium
    issue: מִזְרָק을 ‘대야’로 번역
    rationale: 제의용 그릇을 가리키는 말이나, ‘대야’는 현대 표준어에서 주로 일상적인 큰 물그릇을 연상시킵니다. ‘대접’이 의례용 금속 용기의 문맥에 더 적합합니다.
