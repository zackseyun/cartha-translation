id: NUM.7.43
reference: Numbers 7:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק), a ritual vessel.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'by the shekel of the sanctuary,' referring to the sanctuary's standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 그가 드린 예물은 은 쟁반 하나로, 그 무게는 백삼십 세겔이었고, 은 대접 하나로, 그 무게는 칠십 세겔이었으며, 모두 성소 세겔에 따른 것이었습니다[a]. 두 그릇은 소제를 위하여 기름 섞은 고운 가루로 가득 차 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘성소의 세겔에 따라’라는 뜻이며, 성소에서 사용하는 표준 중량을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 드린 예물은
  lexicon: HALOT
  rationale: 제사 문맥의 קָרְבָּן은 단순한 선물보다 하나님께 드린 예물을 가리키므로, 한국어에서는 ‘예물’로 간결하게 살렸습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 쟁반 하나
  - 은 그릇 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 접시/그릇 계열의 용기인데, 제사 용기 목록의 맥락에서는 ‘접시’가 가장 자연스럽고 구체적입니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 무게가 백삼십 세겔이었고
  alternatives_korean:
  - 무게는 백삼십 세겔이었고
  - 그 무게는 백삼십 세겔이었고
  lexicon: HALOT
  rationale: 히브리어의 ‘무게’(מִשְׁקָל)를 드러내면서 한국어 어순에 맞게 자연스럽게 옮겼습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף ... שִׁבְעִים שֶׁקֶל
  english_pob_choice: one silver basin of seventy shekels
  chosen_korean: 은 대야 하나는 칠십 세겔이었으며
  alternatives_korean:
  - 은 대접 하나는 칠십 세겔이었으며
  - 은 받침대 하나는 칠십 세겔이었으며
  lexicon: HALOT
  rationale: מִזְרָק은 제의적 액체 용기로, 한국어에서는 ‘대야’가 넓은 용례를 살리면서도 의식용 용기라는 점을 유지합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔 기준에 따른 것이었습니다
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소의 세겔대로
  lexicon: HALOT
  rationale: 이 관용구는 성소의 표준 중량을 뜻하므로, ‘기준에 따른’으로 풀어 원문의 제도적 의미를 분명히 했습니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 번제물에 드리는 소제였습니다
  alternatives_korean:
  - 소제였습니다
  - 곡식 제물로 드리는 것이었습니다
  lexicon: HALOT
  rationale: מִנְחָה는 여기서 제의적 ‘소제’를 가리키므로, 독자가 제사 용어를 알아볼 수 있게 하되 문맥상 헌물의 용도를 덧붙였습니다.
theological_decisions:
- issue: מִנְחָה의 제사 용어 처리
  chosen_reading: ‘소제’로 번역하되, 문맥상 번제물에 드리는 제의용 예물임을 덧붙였습니다.
  alternative_readings:
  - ‘곡식 제물’
  - ‘헌물’
  rationale: 이 절은 제의 목록 문맥이므로 일반적인 ‘예물’보다 제사 제도에 특유한 용어를 유지하는 편이 원문의 전문성을 더 잘 드러냅니다.
  doctrine_reference: 민수기 7장 제사 헌물 목록의 문맥
