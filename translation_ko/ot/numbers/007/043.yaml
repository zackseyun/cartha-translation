  to: 그가 드린 예물은 은 쟁반 하나로, 그 무게는 백삼십 세겔이었고, 은 대접 하나로, 그 무게는 칠십 세겔이었으며, 모두 성소 세겔에 따른 것이었습니다[a]. 두 그릇은 소제를 위하여 기름 섞은 고운 가루로 가득 차 있었습니다.
  rationale: 원문이 말하는 두 은 용기와 각각의 중량을 분명히 하고, ‘성소 세겔’이 두 중량 모두에 적용됨을 ‘모두’로 드러냈습니다. 또한 두 용기가 기름 섞은 고운 가루로 가득 차 있었고 그것이 소제를 위한 것이었다는 구문을 보존했습니다. 원문에 없는 번제와의 연관은 삭제했습니다.
