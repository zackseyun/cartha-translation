  language: ko
  text: 각 은 접시는 백삼십 세겔의 무게였고, 각 대접은 칠십 세겔이었으며, 기구들의 모든 은은 성소의 세겔로 이천사백 세겔이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
