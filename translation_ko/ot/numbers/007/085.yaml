translation:
  language: ko
  text: 각 은 접시의 무게는 백삼십 세겔이고, 각 대접의 무게는 칠십 세겔이며, 그 기구들의 은의 총량은 성소 세겔 기준으로[a] 이천사백 세겔이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성소의 세겔에 따라.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  english_pob_choice: one hundred thirty
  chosen_korean: 백삼십
  alternatives_korean:
  - 일백삼십
  - 백 서른
  lexicon: HALOT
  rationale: 히브리어의 합성 수량을 현대 한국어 수사 순서에 맞게 자연스럽게 옮겼습니다.
- source_word: הַקְּעָרָה הָאַחַת
