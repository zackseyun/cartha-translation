id: NUM.7.9
reference: Numbers 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
  footnotes:
  - marker: a
    text: Or, more formally, 'For the service of the sanctuary was upon them; they were to carry it on the shoulder.' The Hebrew likely refers specifically to the holy objects entrusted to the Kohathites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그핫의 아들들에게는 아무것도 주지 않으셨습니다. 거룩한 것들을 맡아 섬기는 일이 그들에게 있었으므로, 그들은 그것들을 어깨에 메고 운반해야 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘성소의 봉사가 그들에게 있었으므로, 그들은 그것을 어깨에 메고 운반해야 했습니다.’ 히브리어는 여기서 고핫 자손에게 맡겨진 거룩한 기물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  english_pob_choice: But to the sons of Kohath
  chosen_korean: 그러나 그핫의 아들들에게는
  alternatives_korean:
  - 그리고 그핫의 자손들에게는
  - 그핫의 후손들에게는
  lexicon: HALOT
  rationale: 대조를 나타내는 וְ를 앞선 분배와의 대비로 ‘그러나’로 옮기고, לִבְנֵי는 소유격보다 여격에 가까운 ‘-들에게는’으로 반영했습니다.
- source_word: לֹא נָתָן
  english_pob_choice: he gave none
  chosen_korean: 주지 않으셨습니다
  alternatives_korean:
  - 주지 않았습니다
  - 아무것도 주지 않으셨습니다
  lexicon: HALOT
  rationale: 문맥상 이전 절의 수레와 소를 가리키므로, 간결하게 ‘주지 않으셨습니다’로 옮겨 암시된 목적어를 자연스럽게 드러냈습니다.
- source_word: עֲבֹדַת הַ/קֹּדֶשׁ
  english_pob_choice: the service of the holy things
  chosen_korean: 거룩한 물건들의 봉사
  alternatives_korean:
  - 성소의 봉사
  - 거룩한 것들의 일
  lexicon: HALOT
  rationale: 문맥이 성소 전체보다 고핫 자손에게 맡겨진 거룩한 기물 운반을 가리키므로, POB의 해석을 따라 ‘거룩한 물건들’로 구체화했습니다.
- source_word: בַּ/כָּתֵף
  english_pob_choice: on the shoulder
  chosen_korean: 어깨에 메고
  alternatives_korean:
  - 어깨에
  - 어깨로
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘어깨에’에 운반 동작을 자연스럽게 보태어, 대상이 기물임을 분명히 하는 한국어로 옮겼습니다.
theological_decisions:
- issue: 고핫 자손에게 운반 수단이 주어지지 않은 이유
  chosen_reading: 거룩한 물건들을 직접 어깨에 메고 운반해야 하는 성별된 책임이 그들에게 있음을 강조했습니다.
  alternative_readings:
  - 단순히 수레가 부족했다는 실무적 진술로만 읽기
  - 성소 봉사의 신성함을 약화해 일반 노동처럼 읽기
  rationale: 본문은 운반 방식의 규정만이 아니라 거룩한 것에 대한 직접적 책임을 강조하므로, 이를 분명히 드러내는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 민수기 4장; 민수기 7장 문맥의 레위 직무 규정
