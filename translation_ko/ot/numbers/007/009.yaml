  to: 그러나 그핫의 아들들에게는 아무것도 주지 않으셨습니다. 거룩한 것들을 맡아 섬기는 일이 그들에게 있었으므로, 그들은 그것들을 어깨에 메고 운반해야 했습니다.[a]
  rationale: ‘아무것도’는 앞 문맥의 수레와 소를 가리키는 생략된 목적어를 자연스럽게 보완합니다. ‘거룩한 것들을 맡아 섬기는 일’은 עֲבֹדַת הַקֹּדֶשׁ의 직무성과 대상성을 살리면서 부자연스러운 속격 표현을 피합니다. 각주에서는 ‘성소의 봉사’라는 전통적·형식적 대안을 보존하되, 본문 문맥상 거룩한 기물을 가리킬 가능성을 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:55Z'
