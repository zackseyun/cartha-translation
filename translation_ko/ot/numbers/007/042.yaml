base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Gad'; that is, the tribe/descendants of Gad. Some English versions render this more idiomatically as 'Gadites.'
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Deuel' here in the Hebrew text; compare passages where the name appears as 'Reuel.'
    reason: alternative_reading
translation:
  language: ko
  text: 여섯째 날에는 갓 자손의 지도자는 엘리아삽이었는데, 그는 드우엘의 아들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갓 자손’은 히브리어의 직설적 표현으로, 일부 번역은 이를 더 관용적으로 ‘갓 사람들’ 또는 ‘갓 지파’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 마소라 본문은 여기서 이름을 ‘드우엘’로 표기하며, 관련 본문들에서는 ‘르우엘’로 나타나는 경우가 있습니다.
    reason: alternative_reading
