  rationale: 고유명사는 음역하고, בֶּן의 친족 표지는 ‘아들’로 직역해 족보적 관계를 분명히 했습니다. 'Deuel'의 음가를 따라 ‘드우엘’로 옮겼습니다.
theological_decisions:
- issue: 지파 대표 명칭의 직역 범위
  chosen_reading: ‘נָשִׂיא’를 ‘지도자’로 옮겨, 지파의 대표자라는 기능을 드러냈습니다.
  alternative_readings:
  - 족장
  - 우두머리
  - 군주적 뉘앙스의 ‘왕자’
  rationale: 민수기 7장의 문맥은 각 지파의 봉헌 대표를 열거하는 자리이므로, 정치적 왕권을 암시하는 번역은 본문 의미를 왜곡할 수 있습니다.
  doctrine_reference: 민수기 7장 문맥적 역할 번역
