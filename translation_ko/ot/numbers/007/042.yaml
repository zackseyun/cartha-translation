  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Gad'; that is, the tribe/descendants of Gad. Some English versions render this more idiomatically as 'Gadites.'
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Deuel' here in the Hebrew text; compare passages where the name appears as 'Reuel.'
    reason: alternative_reading
translation:
  language: ko
  text: 여섯째 날에는 갓 자손[a]의 지도자는 드우엘[b]의 아들 엘리아삽이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갓 자손’은 히브리어의 직설적 표현으로, 곧 갓의 지파 또는 후손을 뜻합니다. 일부 번역은 이를 더 관용적으로 ‘갓 사람들’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 마소라 본문은 여기서 이름을 ‘드우엘’로 표기합니다. 관련 본문들에서는 ‘르우엘’이라는 형태가 나타나는 경우가 있습니다.
    reason: alternative_reading
