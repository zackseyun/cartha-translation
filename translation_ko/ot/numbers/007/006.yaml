id: NUM.7.6
reference: Numbers 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֶת הָ/עֲגָלֹ֖ת וְ/אֶת הַ/בָּקָ֑ר וַ/יִּתֵּ֥ן אוֹתָ֖/ם אֶל הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
  footnotes:
  - marker: a
    text: Or 'wagons' for 'carts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'cattle'; context elsewhere in the chapter specifies oxen.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 수레와 소들을 가져다가 레위인들에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져가다
  alternatives_korean:
  - 취하다
  - 받다
  lexicon: HALOT
  rationale: 문맥상 모세가 막 넘겨받은 물품들을 실제로 수령해 처리하는 동작이므로, 자연스러운 현대 한국어로는 ‘가져다가’가 ‘took’의 직접적 대응입니다.
- source_word: הָעֲגָלֹת
  english_pob_choice: the carts
  chosen_korean: 수레
  alternatives_korean:
  - 카트
  - 마차
  lexicon: HALOT
  rationale: עגלה는 운반용 탈것을 가리키며, 한국어 성경 문맥에서는 ‘수레’가 가장 자연스럽고 기능도 잘 드러냅니다.
- source_word: הַבָּקָר
  english_pob_choice: the cattle
  chosen_korean: 소들
  alternatives_korean:
  - 가축
  - 황소들
  lexicon: HALOT
  rationale: 히브리어는 집합명사로 더 넓은 뜻의 ‘가축’도 가능하지만, 이 장의 다른 절들이 짐수송용 ‘소’를 전제로 하므로 여기서는 문맥에 맞게 ‘소들’로 옮겼습니다.
- source_word: אֶל־הַלְוִיִּם
  english_pob_choice: to the Levites
  chosen_korean: 레위인들에게
  alternatives_korean:
  - 레위인들을 위해
  - 레위인에게
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~에게/~로’의 방향과 수여를 나타내므로, 소유 이전의 전달을 드러내는 ‘레위인들에게’가 가장 직접적입니다.
theological_decisions:
- issue: 본절의 전달 동사와 수여 관계
  chosen_reading: 모세가 물품을 레위인들에게 넘겨주는 행위로 이해했습니다.
  alternative_readings:
  - 단순한 이동 설명
  - 레위인들의 용도를 위한 제공
  rationale: 히브리어 동사들과 전치사 조합은 단순 이동보다 공식적 인도/수여를 가리키며, 영어 POB의 ‘gave them to the Levites’도 이를 반영합니다.
  doctrine_reference: 본문 서술의 역사적-제의적 맥락
