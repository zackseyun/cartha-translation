  source_fidelity: 히브리어는 제물 목록의 명사구로, ‘드렸습니다’에 해당하는 동사가 없습니다. 초안의 동사는 문맥상 예상되는 행위를 보충하지만, 이 절 자체의 열거식 형식과 직역 충실도를 넘습니다. 수량, 수컷 염소, חַטָּאת의 제의적 용법은 유지되어야 합니다.
