    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  english_pob_choice: male goat
  chosen_korean: 수컷 염소
  alternatives_korean:
  - 염소 한 마리
  - 염소 수컷
  - 숫염소
  lexicon: HALOT
  rationale: 제사 희생의 구체성을 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다. '숫염소'도 가능하지만 다소 사전적이어서 본문 흐름에는 '수컷 염소'가 더 분명합니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 한 마리
  alternatives_korean:
  - 하나
  - 한 개
  lexicon: HALOT
  rationale: 동물 제물의 수량을 분명히 하기 위해 한국어에서는 '한 마리'로 옮기는 것이 가장 자연스럽고, 열거형 제사 목록의 형식도 유지합니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제를 위하여
  alternatives_korean:
  - 속죄제로
  - 죄제물로
  - 정결제를 위하여
  lexicon: HALOT
  rationale: י/חַטָּאת의 제의적 용법을 한국어 성경 용례에 맞게 '속죄제'로 옮겼습니다. 여기서는 목적격 전치사 לְ를 살려 '위하여'를 붙여 제사 항목의 기능을 드러냅니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미를 '속죄제'로 둘지 '정결제'로 둘지
  chosen_reading: 본 절의 제물 목록에서는 '속죄제'를 본문 표기로 사용했습니다.
  alternative_readings:
  - 정결제
  - 죄를 위한 제물
  rationale: 히브리어 חַטָּאת는 죄와 부정결례를 함께 포괄할 수 있으나, 이 절은 반복되는 봉헌 목록의 정식 표현이므로 가장 널리 인식되는 제의 용어를 유지하는 것이 적절합니다. 다만 의미 범위의 긴장은 영어 주석의 취지를 따라 노출해 두었습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve lexical tension where the source allows it.'
