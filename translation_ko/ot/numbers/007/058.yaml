  terminology: שְׂעִיר עִזִּים은 ‘수컷 염소’, אֶחָד은 ‘한 마리’, לְחַטָּאת는 관례적 제의어인 ‘속죄제물로’로 옮겼습니다. חַטָּאת가 죄뿐 아니라 의례적 부정과 관련된 정결의 기능도 지닌다는 대안적 뉘앙스는 각주에 보존합니다.
