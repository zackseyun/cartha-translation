id: NUM.7.19
reference: Numbers 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
  footnotes:
  - marker: a
    text: Or 'silver dish' for 'silver plate' (קַעֲרַת כֶּסֶף).
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק).
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'by the shekel of the sanctuary,' indicating the standard sacred weight.
    reason: cultural_note
translation:
  language: ko
  text: 그는 자신의 제물을 바쳤습니다. 은 접시 하나는 무게가 은 백삼십 세겔이었고, 은 대접 하나는 은 칠십 세겔이었는데, 성소의 세겔로 잰 것입니다. 두 그릇에는 모두 고운 가루에 기름을 섞은 소제물이 가득했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은 접시’는 קַעֲרַת כֶּסֶף의 자연스러운 번역이며, ‘은 그릇/은 쟁반’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대접’은 מִזְרָק의 기능을 살린 번역이며, ‘분지/사발’도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성소의 세겔’은 히브리어의 ‘by the shekel of the sanctuary’를 따라, 성소에서 쓰는 표준 중량을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  english_pob_choice: presented
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 드렸습니다
  - 제시했습니다
  lexicon: HALOT
  rationale: 제의적 목록 문맥에서 단순한 ‘가져오다’보다 예물을 예식에 맞게 올려 드리는 동작을 자연스럽게 드러내며, 현대 한국어에서도 읽기 매끄럽습니다.
- source_word: קַעֲרַת כֶּסֶף
  english_pob_choice: silver plate
  chosen_korean: 은 접시
  alternatives_korean:
  - 은 쟁반
  - 은 그릇
  lexicon: HALOT
  rationale: 의례용 얕은 용기를 가리키므로 ‘접시’가 POB의 ‘plate’에 가장 가까운 자연스러운 대응입니다.
- source_word: מִזְרָק
  english_pob_choice: basin
  chosen_korean: 대접
  alternatives_korean:
  - 분지
  - 사발
  lexicon: HALOT
  rationale: 제의용 그릇의 기능을 살리면서 한국어에서 지나치게 현대적이거나 일상적인 느낌을 피하기 위해 ‘대접’을 택했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the shekel of the sanctuary
  chosen_korean: 성소의 세겔로 잰 것입니다
  alternatives_korean:
  - 성소 세겔로
  - 성전의 세겔로 잰 것입니다
  lexicon: HALOT
  rationale: 기준이 되는 성소의 표준 중량을 한국어에서 분명히 드러내기 위해 ‘~로 잰 것입니다’로 풀어, 단순 단위 표시보다 의미를 분명하게 했습니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식 제물
  - 곡물 제물
  lexicon: HALOT
  rationale: 여기서 מִנְחָה는 일반적 ‘예물’이 아니라 제의적 ‘소제’에 해당하므로, 본문 끝의 용도를 한 단어로 응축해 ‘소제물’로 옮겼습니다.
theological_decisions:
- issue: 제의적 용어의 현대 한국어 처리
  chosen_reading: 형식은 현대적이되, 제의적 전문어(소제물, 성소의 세겔)를 유지해 성막 헌납 목록의 제의성을 살렸습니다.
  alternative_readings:
  - 일상어 중심으로 완화해 ‘곡식 제물’처럼 풀어쓰기
  - 전통 교회어에 맞춰 ‘소제’로만 압축
  rationale: 민수기 7장의 문맥은 예물 목록이므로, 독자가 의례적 성격과 측정 기준을 동시에 파악하도록 하는 것이 본문의 의도를 가장 잘 보존합니다.
  doctrine_reference: 민수기 7장 봉헌 목록의 제의적 맥락
- issue: ‘세겔의 성소’ 표현의 해석
  chosen_reading: ‘성소의 세겔’로 옮겨 표준 중량 규격을 나타내는 표현으로 읽히게 했습니다.
  alternative_readings:
  - ‘거룩한 세겔’
  - ‘성전 세겔’
  rationale: 히브리어는 단위의 표준을 말하며, 도덕적 ‘거룩함’보다 측정 규격의 출처를 가리키므로 그 기능을 드러내는 번역이 적절합니다.
  doctrine_reference: 출 30:13과 민 7장 관련 성소 중량 규정
