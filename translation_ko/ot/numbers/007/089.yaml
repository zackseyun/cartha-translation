id: NUM.7.89
reference: Numbers 7:89
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
  footnotes:
  - marker: a
    text: Or 'the voice being spoken to him'; the Hebrew participle may be understood in a slightly different nuance, though 'the voice speaking to him' is the most straightforward reading.
    reason: lexical_alternative
  - marker: b
    text: '''Mercy seat'' refers to the cover of the ark, the place from which the LORD spoke between the cherubim.'
    reason: cultural_note
  - marker: c
    text: The final clause could also be rendered more explicitly, 'and the LORD spoke to him,' or more formally, 'and it spoke to him,' with 'the voice' as the subject.
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 회막에 들어가 그분과 말하려고 하면, 그는 속죄소 위에 있는, 곧 증거궤 위에서 두 그룹 사이에서 자신에게 말씀하시는 소리를 들었습니다. 그러고 나서 그분이 그에게 말씀하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사구는 ‘그에게 말하는 소리’로도 이해할 수 있으며, 본 번역은 가장 직접적인 읽기를 따른 것입니다.
    reason: alternative_reading
  - marker: b
    text: ‘속죄소’는 언약궤의 덮개를 가리키며, 야훼께서 그룹들 사이에서 말씀하시는 자리입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 절은 보다 명시적으로 ‘그분이 그에게 말씀하셨습니다’로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  english_pob_choice: When Moses went into
  chosen_korean: 모세가 회막에 들어가
  alternatives_korean:
  - 모세가 회막 안으로 들어갈 때
  - 모세가 회막에 들어갈 때
  lexicon: HALOT
  rationale: בוא의 시간절 용법을 한국어로 자연스럽게 옮기되, 본문의 서술 흐름을 살려 ‘들어가’로 직역성을 유지했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이는 전통적 용례를 따르되, 본문이 지시하는 성소 명칭을 간결하게 전달했습니다.
- source_word: מִדַּבֵּר אֵלָיו
  english_pob_choice: speaking to him
  chosen_korean: 자신에게 말씀하시는
  alternatives_korean:
  - 그에게 말씀하시는
  - 말하고 계시는
  lexicon: HALOT
  rationale: 영어 POB의 ‘the voice speaking to him’을 반영하여, 소리가 단순 음성이 아니라 인격적 발화임을 살렸습니다. 한국어에서는 반복되는 대명사를 줄이면서도 발화의 주체성을 보존했습니다.
- source_word: מֵעַל הַכַּפֹּרֶת
  english_pob_choice: from above the mercy seat
  chosen_korean: 속죄소 위에 있는
  alternatives_korean:
  - 자비의 덮개 위에 있는
  - 은혜시트 위에 있는
  lexicon: HALOT
  rationale: כפרת는 언약궤의 덮개라는 성소 용어이므로, 본문 기능을 드러내는 ‘속죄소’를 채택했습니다. ‘위에 있는’은 위치 관계를 한국어로 자연스럽게 풀어 준 표현입니다.
- source_word: אֲרֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 오랫동안 정착된 성경 용어를 사용해 언약적·법정적 뉘앙스를 유지했습니다.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  english_pob_choice: from between the two cherubim
  chosen_korean: 두 그룹 사이에서
  alternatives_korean:
  - 두 그룹 사이로부터
  - 두 그룹 가운데서
  lexicon: HALOT
  rationale: כְּרֻבִים을 한국어 음역 관용에 따라 ‘그룹’으로 옮겨, 성소 기구의 특수한 존재를 드러냈습니다. ‘사이에서’는 출발점의 위치를 자연스럽게 전달합니다.
theological_decisions:
- issue: 발화의 주체와 마지막 동사의 지시 대상
  chosen_reading: 마지막 절은 회막에서 모세에게 말씀하시는 야훼의 음성을 다시 가리키는 것으로 번역했습니다.
  alternative_readings:
  - 마지막 절을 ‘그 소리가 그에게 말씀하셨습니다’처럼 더 무인칭으로 옮길 수 있습니다.
  - 모세가 하나님께 말한 것으로 읽어 ‘그가 그에게 말했습니다’로 정리할 수 있습니다.
  rationale: 문맥상 말씀의 근원은 속죄소 위, 그룹들 사이에서 나는 하나님의 음성이며, 본문은 그 인격적 발화를 유지합니다. 한국어에서는 주어를 과도하게 명시하지 않으면서도 신적 발화의 방향을 분명히 했습니다.
  doctrine_reference: 문맥에 따른 신적 계시의 발화 주체 보존
