translation:
  language: ko
  text: 한 금 접시[a] 곧 무게가 열 세겔이며, 향으로 가득 찼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּף는 여기서 사람의 손바닥이 아니라 작은 예식용 용기를 가리키므로, ‘접시’로 옮겼습니다. 전통 번역의 ‘숟가락’은 현대 한국어에서 오해를 낳을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 접시
  alternatives_korean:
  - 그릇
  - 쟁반
  - 숟가락
  lexicon: HALOT
  rationale: 제사 장비 목록 문맥에서 כַּף는 사람의 ‘손바닥’이 아니라 작은 예식용 용기를 가리키므로, 현대 한국어에서는 ‘접시’가 가장 무난하게 그 용도의 용기를 드러냅니다.
- source_word: אַחַת
