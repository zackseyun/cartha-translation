  chosen_korean: 한
  alternatives_korean:
  - 하나의
  - 한 개의
  lexicon: HALOT
  rationale: 여성형 명사 כַּף에 수적으로 호응하는 단순 수사이므로 자연스러운 수량 표현인 ‘한’으로 옮겼습니다.
- source_word: עֲשָׂרָה
  english_pob_choice: ten shekels, weighing
  chosen_korean: 무게가 열 세겔이며
  alternatives_korean:
  - 열 세겔이며
  - 열 세겔 무게이며
  lexicon: HALOT
  rationale: 본문의 수사는 앞뒤 문맥상 무게 단위를 생략한 약식 표현이므로, 한국어에서는 ‘무게가’와 함께 풀어 주어 의미를 분명히 했습니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향
  alternatives_korean:
  - 향기로운 향
  - 분향
  lexicon: HALOT
  rationale: 예배용 향료를 가리키는 표준어로 ‘향’이 가장 직접적이며, 제의 문맥도 충분히 유지합니다.
theological_decisions:
- issue: 제의 물건 번역에서 전통 교회어와 직역성의 균형
  chosen_reading: 제단/성막 목록의 물건을 현대 독자가 바로 이해할 수 있도록 ‘접시’와 ‘향’으로 직역했습니다.
  alternative_readings:
  - ‘숟가락’처럼 전통역에 가까운 표현
  - ‘그릇’처럼 더 일반적인 표현
  rationale: 히브리어 כַּף는 이 문맥에서 작은 예식용 용기를 뜻하므로, 오해를 줄이기 위해 전통적이지만 좁은 의미의 ‘숟가락’은 피했습니다.
  doctrine_reference: 성막 봉헌 목록의 물품 명칭을 문맥상 정확히 전달하는 문제
