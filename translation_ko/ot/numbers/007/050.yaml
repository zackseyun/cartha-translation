    reason: lexical_alternative
  revision_rationale: 재료와 수량을 자연스러운 한국어 명사구로 고치고, 용기가 향으로 가득하다는 원문의 관계를 명확히 했습니다. 문맥상 생략된 무게 단위 ‘세겔’의 보충은 유지했습니다. 각주는 כַּף의 형태에 관한 어휘적 불확실성을 보존하도록 다듬었습니다.
