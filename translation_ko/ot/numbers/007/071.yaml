  rationale: 이 절은 제의 목록의 반복 공식으로, 한국어 성경 전통과 소스의 제의적 의미를 함께 살릴 수 있는 표준 대응은 화목제입니다. ‘peace offerings’의 의미 범위를 해치지 않으면서도 독자가 제물 종류를 즉시 पहचान할 수 있습니다.
