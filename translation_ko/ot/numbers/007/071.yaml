translation:
  language: ko
  text: 그리고 화목제의 제물은 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린 양 다섯 마리입니다. 이것은 암미삿대의 아들 아히에셀의 제물입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 화목제의 제물
  alternatives_korean:
  - 평화제의 제물
  - 평안제의 제물
  - 교제제의 제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의적 관용구로서 한국어 성경에서 가장 자연스럽고 소스에 가까운 대응은 화목제입니다. 문맥상 ‘그리고 ~의 제물은’으로 이어지게 하여 제물 목록의 도입을 살렸습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 두 마리의 소
  - 가축 두 마리
  - 두 마리의 소 떼
  lexicon: HALOT
  rationale: בָּקָר은 집합명사로서 우두류를 가리키므로, 한국어에서는 ‘소 두 마리’가 가장 자연스럽고 과도한 특정화 없이 수량을 전달합니다.
- source_word: אֵילִם חֲמִשָּׁה / עַתֻּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams / five male goats / five one-year-old lambs
  chosen_korean: 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린 양 다섯 마리
  alternatives_korean:
  - 다섯 숫양, 다섯 숫염소, 그리고 한 살 된 어린 양 다섯 마리
  - 수양 다섯 마리, 숫염소 다섯 마리, 그리고 한 살 된 어린 양 다섯 마리
  lexicon: HALOT
  rationale: 제물 목록의 동물 종류와 성별, 나이를 모두 반영하기 위해 ‘숫양’, ‘숫염소’, ‘일 년 된 어린 양’을 사용했습니다. ‘일 년 된’은 בְּנֵי שָׁנָה의 연령 기준을 직역보다 자연스럽게 보여 줍니다.
- source_word: זֶה קָרְבַּן אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  english_pob_choice: This was the offering of Ahiezer son of Ammishaddai
  chosen_korean: 이것은 암미삿대의 아들 아히에셀의 제물입니다
  alternatives_korean:
  - 이것은 암미삿대의 아들 아히에셀의 예물입니다
  - 이것은 암미삿대의 아들 아히에셀의 봉헌물입니다
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적 ‘예물/제물’이 가능하지만, 앞의 화목제 문맥과 반복 공식에 맞추어 ‘제물’을 택했습니다. 고유명사는 통용되는 음역을 따르되, בֶּן은 ‘의 아들’로 직접 옮겼습니다.
