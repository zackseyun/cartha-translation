translation:
  language: ko
  text: 그리고 화목제의 제물[a]로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것이 암미나답의 아들 나손의 제물입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친교제’, ‘평화제’로 옮길 수 있습니다. 이는 제의적 식사와 교제를 수반하는 히브리어 제의 용어입니다.
    reason: lexical_alternative
