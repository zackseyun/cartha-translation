source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for the Hebrew term often used of a sacrificial meal shared in communion and peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제물의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것이 암미나답의 아들 나손의 제물입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친교제물’, ‘평화제물’로도 옮길 수 있습니다. 이는 제의적 식사와 교제를 함께 가리키는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 그리고 화목제물의 제물로는
  alternatives_korean:
  - 그리고 평화제물의 제물로는
  - 그리고 친교제물의 제물로는
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의적 전문용어로, 한국어 성경 전통에서 의미를 가장 잘 드러내는 말은 ‘화목제물’입니다. '제물로는'은 לְזֶבַח의 용법을 자연스럽게 반영합니다.
- source_word: בָּקָר
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 소 두 마리
  - 두 마리의 소
  - 두 마리의 가축
  lexicon: HALOT
  rationale: בָּקָר은 집합명사로서 제의 목록에서는 자연스럽게 ‘소’로 옮기는 것이 가장 분명합니다. 영어의 'cattle'보다 한국어에서는 수량 표현과 함께 ‘소 두 마리’가 자연스럽습니다.
- source_word: אֵילִם חֲמִשָּׁה / עַתּוּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams, five male goats, and five lambs a year old
  chosen_korean: 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리
  alternatives_korean:
  - 수양 다섯 마리, 수염소 다섯 마리, 한 살 된 어린양 다섯 마리
  - 숫양 다섯 마리, 숫염소 다섯 마리, 한 살 된 어린양 다섯 마리
  lexicon: HALOT
  rationale: אֵילִם과 עַתּוּדִים은 각각 숫양과 숫염소로 분명하며, כְּבָשִׂים בְּנֵי שָׁנָה는 ‘일 년 된 어린양’이 나이 정보를 정확히 반영합니다. 성별이 명시되지 않은 마지막 항목은 영어 POB의 수정 취지를 따라 ‘어린양’으로 두었습니다.
- source_word: זֶה קָרְבַּן
  english_pob_choice: This was the offering of
  chosen_korean: 이것이 …의 제물입니다
  alternatives_korean:
  - 이것이 …의 제물입니다
  - 이것이 …의 예물입니다
  - 이것이 …의 바침입니다
  lexicon: HALOT
  rationale: קָרְבָּן은 단순한 ‘예물’보다 제의적 ‘제물’이 더 정확합니다. 서술형 결론으로는 한국어에서 ‘이것이 …의 제물입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 화목제물의 의미 범위
  chosen_reading: 전통적 용어를 유지하되, 본문 자체가 제의적 식사와 교제를 암시하는 전문용어임을 보존했습니다.
  alternative_readings:
  - 평화제물
  - 친교제물
  rationale: שְׁלָמִים은 단순한 감정적 평화가 아니라 하나님과의 관계 회복 및 공동 식사의 제의를 가리키므로, 한국어 교회 전통의 '화목제물'을 쓰되 의미를 약화하지 않았습니다.
  doctrine_reference: 레위기 3장, 7장 제의 규정
- issue: 리스트의 수량과 품목을 그대로 보존
  chosen_reading: 각 동물의 종류와 수를 순서대로 그대로 옮겼습니다.
  alternative_readings:
  - 의역하여 묶어 표현
  - 문장형으로 간략화
  rationale: 이 구절은 나손의 헌납 목록을 정확히 기록하는 본문이므로, 수량과 품목의 배열을 유지하는 것이 의미와 리듬을 보존합니다.
  doctrine_reference: 민수기 7장 봉헌 목록
