  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
  footnotes:
  - marker: a
    text: Or 'the sacrifice of fellowship offerings' or 'the sacrifice of well-being offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제[a] 제물로 바친 소는 모두 수소 스물네 마리, 숫양 예순 마리, 숫염소 예순 마리, 한 살 된 어린 양 예순 마리였습니다. 이것은 제단이 기름부음을 받은 뒤에 드린 제단 봉헌 제물이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화제의 제물’, ‘평안제의 제물’, ‘교제제의 제물’.
    reason: שְׁלָמִים의 제의 범주에 대한 가능한 한국어 번역을 제시합니다.
lexical_decisions:
- source_word: בְּקַר
  english_pob_choice: the cattle
  chosen_korean: 가축
  alternatives_korean:
  - 소떼
  - 소
  lexicon: HALOT
  rationale: 여기서는 제물에 쓰인 소속 가축 전체를 가리키는 집합명사이므로, 개별 수소를 뒤에서 밝히는 구조를 살려 '가축'이 가장 자연스럽습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제의 제물
  alternatives_korean:
  - 평화제물
  - 교제제물
  - 화평제의 제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 전통적 제의 용어인 '화목제'로 옮기되, 문맥상 실제 바쳐진 제물의 총량을 말하므로 '제물'을 붙여 자연스럽게 했습니다.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  english_pob_choice: the dedication offering of the altar
  chosen_korean: 제단 봉헌
  alternatives_korean:
  - 제단의 봉헌
  - 제단 봉헌 제물
  - 제단 헌당
  lexicon: HALOT
  rationale: 명사구의 핵심은 '제단의 봉헌'이므로, 제의적 문맥에서 통용되는 '봉헌'을 살려 간결하게 옮겼습니다.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  english_pob_choice: after it had been anointed
  chosen_korean: 기름부은 뒤의
  alternatives_korean:
  - 기름부은 후의
  - 기름부음을 받은 뒤의
  lexicon: HALOT
  rationale: 히브리어는 '그것이 기름부음을 받은 후'의 시간 관계를 나타내므로, 수동의 뜻을 유지하면서도 한국어에서 자연스러운 '기름부은 뒤의'로 옮겼습니다.
theological_decisions:
- issue: שְׁלָמִים의 제의적 뉘앙스
  chosen_reading: '''화목제''를 기본으로 하되 문맥상 ''화목제의 제물''로 표현'
  alternative_readings:
  - 평화제
  - 교제제
  - 평안제
  rationale: 이 용어는 교리적 쟁점이 아니라 제의 범주이므로, 한국어 성경에서 익숙하면서도 원문의 제의적 성격을 드러내는 '화목제'를 유지했습니다.
  doctrine_reference: Translation philosophy §5
