revisions:
- from: 그리고 화목제의 제물에 쓰인 모든 가축은 수소 스물네 마리, 숫양 예순 마리, 숫염소 예순 마리, 그리고 한 살 된 어린 양 예순 마리였습니다. 이것은 제단을 기름부은 뒤의 제단 봉헌이었습니다.
  to: 그리고 화목제[a] 제물로 바친 소는 모두 수소 스물네 마리, 숫양 예순 마리, 숫염소 예순 마리, 한 살 된 어린 양 예순 마리였습니다. 이것은 제단이 기름부음을 받은 뒤에 드린 제단 봉헌 제물이었습니다.
  rationale: 수소만을 가리키는 בְּקַר를 '소'로 명확히 하고, 제단이 기름부음을 받은 뒤라는 수동적 시간 관계를 자연스러운 한국어 절로 수정했습니다. 결론 문장은 열거된 희생 제물의 총계를 가리키는 문맥을 반영하여 '제단 봉헌 제물'로 표현했습니다.
  reviewer_model: gpt-5.6-terra
