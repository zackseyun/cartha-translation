base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제[a]의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 한 살 된 수컷 어린양 다섯 마리였습니다. 이것이 기드오니의 아들 아비단의 예물이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제 제물’, ‘평안 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  english_pob_choice: and for the sacrifice of
  chosen_korean: 그리고 …의 제물로는
  alternatives_korean:
  - 그리고 …의 제사로는
  - 그리고 …의 희생 제물로는
  lexicon: HALOT
  rationale: 접속사와 전치사의 결합을 한국어에서 자연스럽게 풀어, 앞선 목록에 이어지는 항목임을 살리면서 제의적 용례의 זֶבַח를 ‘제물’로 옮겼습니다.
- source_word: הַשְּׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화 제물
  - 교제 제물
  - 평안 제물
  lexicon: HALOT
  rationale: 이 제의 용어는 한국어 성경 전통에서 널리 알려진 ‘화목제’가 원문의 제사 범주를 가장 간결하게 드러내며, POB의 주석적 대안도 각주로 보완할 수 있습니다.
- source_word: בָּקָר
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 두 마리의 가축
  - 황소 두 마리
  - 소 두 마리
  lexicon: HALOT
  rationale: בָּקָר는 넓게는 소 종류의 가축을 가리키므로, 성별을 특정하지 않는 ‘소’가 POB의 ‘two cattle’에 가장 가깝습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: five male lambs a year old
  chosen_korean: 일 년 된 숫양 어린양 다섯 마리
  alternatives_korean:
  - 일 년 된 어린양 다섯 마리
  - 일 년 된 숫양 다섯 마리
  - 한 살 된 숫양 다섯 마리
  lexicon: HALOT
  rationale: כְּבָשִׂים는 제의 문맥에서 양 새끼를 가리키며, POB의 ‘male lambs’와 בְּנֵי שָׁנָה의 ‘a year old’를 함께 살리기 위해 ‘일 년 된 숫양 어린양’으로 옮겼습니다.
theological_decisions:
- issue: 제의 용어 'peace offerings'의 한국어 정착 표현
  chosen_reading: ‘화목제’로 번역하되, 본문은 간명하게 유지합니다.
  alternative_readings:
  - 평화 제물
  - 교제 제물
  - 평안 제물
  rationale: 이 절은 열두 지파 예물 목록의 하나로서 제의 범주를 제시하므로, 한국어 성경에서 통용되는 전문 용어를 쓰는 것이 독자의 즉시 이해에 유리합니다.
  doctrine_reference: 제의/제사 용어의 일관성
