  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/027.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
  footnotes:
  - marker: a
    text: Literally, 'one bull, son of the herd.' The Hebrew idiom refers to a bull from the cattle herd, often understood as a young bull.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'one male lamb, son of its year,' that is, a male lamb a year old or in its first year.
    reason: lexical_alternative
translation:
  language: ko
  text: 수송아지 한 마리, 숫양 한 마리, 한 살 된 숫양 새끼 한 마리를 번제로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר / בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 마리 수송아지
  alternatives_korean:
  - 한 마리 황소
  - 한 마리 소떼의 아들
  - 한 마리 젊은 수소
  lexicon: HALOT
  rationale: פַּר은 제물 목록에서 보통 수송아지/황소로 옮길 수 있는데, בֶּן בָּקָר까지 합친 관용 표현은 번제에 바치는 어린 수소의 뜻이므로 현대 한국어에서 가장 자연스러운 '수송아지'를 택했습니다.
- source_word: אַיִל
  english_pob_choice: one ram
  chosen_korean: 한 마리 숫양
  alternatives_korean:
  - 한 마리 양
  - 한 마리 수양
  lexicon: HALOT
  rationale: אַיִל은 제사 맥락의 표준어가 숫양이므로, 일반적인 '양'보다 성별이 드러나는 '숫양'이 원문의 정확성을 더 잘 살립니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: one male lamb
  chosen_korean: 한 마리 한 살 된 숫양 새끼
  alternatives_korean:
  - 한 마리 숫양 새끼
  - 한 마리 어린 양
  - 한 마리 수양 새끼
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 수컷 새끼양을 가리키므로 '숫양 새끼'를 기본으로 하되, בֶּן שְׁנָתוֹ의 연령 관용구를 반영해 '한 살 된'을 덧붙여 제물 규정을 분명히 했습니다.
- source_word: בֶּן שְׁנָתוֹ
  english_pob_choice: a year old
  chosen_korean: 한 살 된
  alternatives_korean:
  - 첫 해의
  - 한 해 된
  lexicon: HALOT
  rationale: '''그 해의 아들''이라는 직역보다 한국어에서 자연스러운 연령 표현인 ''한 살 된''이 원문의 연령 제한을 정확하고 간결하게 전달합니다.'
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제용으로
  lexicon: HALOT
  rationale: עֹלָה는 전번제를 뜻하므로, 목록의 종결 용법에 맞게 '번제물로'라고 옮겨 제물의 용도를 분명히 했습니다.
