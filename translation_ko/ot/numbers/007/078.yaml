  lexicon: WLC temporal formula; English POB ordinal rendering
  rationale: 히브리어의 날짜 공식은 관용적으로 서술되므로, 한국어에서도 자연스러운 서수 표현인 ‘열두째 날’로 옮기고 조사 ‘-에는’으로 시간 배경을 드러냈습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자는
