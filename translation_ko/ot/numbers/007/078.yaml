  - 아히라였습니다
  lexicon: BDB / standard proper-name transliteration
  rationale: 고유명사는 음역하고, 이어지는 친족 표지를 포함해 문장 내 인물 식별을 분명히 했습니다.
- source_word: בֶּן עֵינָן
  english_pob_choice: son of Enan
  chosen_korean: 에난의 아들
  alternatives_korean:
  - 에난의 아들인
  - 에난의 아들 아히라
  lexicon: HALOT
  rationale: 히브리어의 표준 족보 구문을 한국어 소유격으로 자연스럽게 옮겼습니다.
theological_decisions:
