  lexicon: HALOT
  rationale: 부족 맥락의 נָשִׂיא는 왕족의 ‘왕자’보다 대표적 우두머리의 뜻이 강하므로, 현대 한국어의 명확한 ‘지도자’로 옮겼습니다.
- source_word: לִבְנֵי נַפְתָּלִי
  english_pob_choice: of the sons of Naphtali
  chosen_korean: 납달리 자손의
  alternatives_korean:
  - 납달리의 아들들의
  - 납달리의 자녀들의
  lexicon: HALOT
  rationale: 족속을 가리키는 표준 히브리어 표현을 살려 ‘자손’으로 옮겼고, 원문의 남성 복수 부족 용례를 유지했습니다.
- source_word: אֲחִירַע
  english_pob_choice: Ahira
  chosen_korean: 에난의 아들 아히라
  alternatives_korean:
