lexical_decisions:
- source_word: כַּף אַחַת
  english_pob_choice: one dish
  chosen_korean: 한 개의 금 대접
  alternatives_korean:
  - 금 그릇 하나
  - 금 접시 하나
  - 한 개의 금 접시
  lexicon: HALOT
  rationale: כַּף는 제의 문맥에서 손바닥보다 작은 용기이므로, 현대 한국어에서는 자연스럽고 오해가 적은 ‘대접’으로 옮겼습니다. 수량 표현은 ‘한 개의’로 처리했습니다.
- source_word: עֲשָׂרָה זָהָב
  english_pob_choice: of ten shekels
  chosen_korean: 곧 십 세겔이며
  alternatives_korean:
  - 십 세겔의
  - 무게가 십 세겔이며
  - 열 세겔의
  lexicon: HALOT
  rationale: 본문에 ‘세겔’이 생략되어 있지만, 주변 문맥의 반복 공식상 무게 단위가 암시되므로 이를 한국어에서 보충했습니다. ‘곧’은 앞의 대접이 어떤 분량인지 설명하는 동격을 살립니다.
- source_word: מְלֵאָה קְטֹרֶת
  english_pob_choice: full of incense
  chosen_korean: 향을 가득 담은
  alternatives_korean:
  - 향으로 가득 찬
  - 향으로 가득한
  - 향으로 가득 담은
  lexicon: HALOT
  rationale: מְלֵאָה는 단순한 상태 묘사이므로 ‘가득 담은’으로 자연스럽게 옮겼고, קְטֹרֶת는 제의용 향을 가리키므로 ‘향’으로 번역했습니다.
