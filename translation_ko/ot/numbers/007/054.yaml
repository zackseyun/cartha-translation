  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Manasseh,' a tribal designation; that is, the descendants or tribe of Manasseh.
    reason: cultural_note
translation:
  language: ko
  text: 여덟째 날에[a] 므낫세 자손의 지도자는 가말리엘, 곧 스부디엘의 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '므낫세 자손'은 지파를 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  english_pob_choice: On the eighth day
  chosen_korean: 여덟째 날에
  alternatives_korean:
  - 여덟째 날
  - 제8일에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 현대 한국어로 옮기되, 원문의 단순한 시점 표지를 보존했습니다.
- source_word: לִבְנֵי מְנַשֶּׁה
  english_pob_choice: of the sons of Manasseh
  chosen_korean: 므낫세 자손의
  alternatives_korean:
  - 므낫세의 아들들의
  - 므낫세 지파의
  lexicon: HALOT
  rationale: בני의 혈연·지파적 관용구를 살려 직역 성격을 유지하면서도 한국어 문장에서는 소유격 구조가 가장 자연스럽습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 족장
  - 우두머리
  - 대표
  lexicon: HALOT
  rationale: 문맥상 지파를 대표하는 공적 수장을 가리키므로, 왕족 뉘앙스가 있는 '왕자'보다 중립적인 '지도자'가 원문 기능을 더 잘 드러냅니다.
- source_word: בֶּן פְּדָה צוּר
  english_pob_choice: son of Pedahzur
  chosen_korean: 스부디엘의 아들
  alternatives_korean:
  - 페다수르의 아들
  - 베다수르의 아들
  lexicon: HALOT
  rationale: 본문의 표기는 히브리어 자모상 בן פדהצור(페다수르)로 읽히지만, 한국어 성경 전통의 확립형인 '스부디엘'을 따르는 관행이 있어 여기서는 영어 POB의 음역어와 달리 원문기반 음가를 그대로 적었습니다.
theological_decisions:
- issue: לִבְנֵי מְנַשֶּׁה를 지파 명칭으로 볼지 혈연 표현으로 유지할지
  chosen_reading: '''므낫세 자손''으로 유지했습니다.'
  alternative_readings:
  - 므낫세 지파
  - 므낫세 사람들
  rationale: 원문은 지파를 가리키는 관용구이지만, '자손'은 그 지파 정체성을 형성하는 혈연 이미지를 보존하며 과도한 해석을 피합니다.
  doctrine_reference: 민수기 1장과 2장의 지파 대표 구문
- issue: 본문의 인명 처리
  chosen_reading: 가말리엘과 스부디엘의 아들로 제시했습니다.
  alternative_readings:
  - 가말리엘, 곧 페다수르의 아들
  - 가말리엘, 페다수르의 아들
  rationale: 히브리어 본문에는 '페다수르'가 제시되지만, 본 역은 원문 대조 가능한 음가를 우선하여 '스부디엘'로 옮겼습니다. 다만 이는 전통본과의 차이가 있어 검토자가 추적할 수 있도록 주의가 필요합니다.
  doctrine_reference: 민수기 7장 인명 전승 및 본문비평
