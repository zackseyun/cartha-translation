  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/063.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
  footnotes:
  - marker: a
    text: Or 'one young bull, one ram, one male lamb in its first year, for a burnt offering.' The Hebrew phrase 'son of the herd' is an idiom for a bovine animal from the herd, and 'son of its year' is an idiom for an animal in its first year.
    reason: lexical_alternative
translation:
  language: ko
  text: 소 떼 가운데서 잡은 수송아지 하나, 숫양 하나, 일 년 된 숫양 새끼 하나를 번제물로 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘소 떼의 아들’은 소 떼에서 난 동물을 가리키는 관용입니다.
    reason: source_note
lexical_decisions:
- source_word: פַּר + בֶּן־בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 소 떼 가운데서 잡은 수송아지 하나
  alternatives_korean:
  - 소 떼에서 온 수소 하나
  - 소 떼의 소 한 마리
  - 어린 수소 하나
  lexicon: HALOT
  rationale: פַּר는 제사 맥락에서 수송아지/황소 계열을 가리키고, בֶּן־בָּקָר은 ‘소 떼의 것’이라는 관용으로 읽히므로, 한국어에서는 어색한 직역보다 제사용 동물의 출처를 자연스럽게 드러냈습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  - 양
  lexicon: HALOT
  rationale: אַיִל은 제사용 맥락에서 성체 수양을 뜻하므로, 성별과 종류를 분명히 하는 ‘숫양’이 가장 정확합니다.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 일 년 된 숫양 새끼 하나
  alternatives_korean:
  - 일 년 된 숫양 한 마리
  - 첫해의 숫양 새끼 하나
  - 일 년 된 어린 양 하나
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 어린 양을 가리키며, בֶּן־שְׁנָתוֹ는 ‘일 년 된/첫해의’라는 관용이므로, 한국어에서는 제사 목록의 항목성을 살리면서 나이를 분명히 했습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 불살라 드리는 제물로
  lexicon: HALOT
  rationale: עֹלָה는 ‘번제’의 표준 제의 용어이므로, 현대 한국어 성경 문체에 맞게 ‘번제물로’로 옮겼습니다.
theological_decisions:
- issue: 제물 목록의 제의적 명시성 유지
  chosen_reading: 동물의 종류와 나이를 모두 밝혀, 본문이 제사 규정의 정확한 목록임을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘어린 수소 하나’로 완화하는 읽기
  - 종류 구분을 약화한 일반적 ‘짐승’ 번역
  rationale: 이 절은 서술이 아니라 헌물 목록이므로, מקור의 구체성을 유지하는 것이 제사의 질서와 수량을 정확히 전달합니다.
  doctrine_reference: 민수기 7장의 봉헌 제의 맥락
