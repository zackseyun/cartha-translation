  naturalness: ‘번제물로는 …였습니다’는 한국어 제물 목록 문맥에서 자연스럽고, 합쇼체의 현대적 정중 서술 문체에도 맞습니다. ‘일 년 된 어린 숫양’은 ‘숫양 새끼’보다 자연스럽고 연령 및 성별을 명확히 합니다.
