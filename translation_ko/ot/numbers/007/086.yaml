base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
  footnotes:
  - marker: a
    text: Or 'pans,' 'bowls,' or traditionally 'spoons' for the incense vessels.
    reason: lexical_alternative
translation:
  language: ko
  text: 향이 가득 담긴 금 접시 열둘이었습니다[a]. 각 접시는 성소의 세겔로 열 세겔이었으며, 그 접시들의 금은 모두 백이십 세겔이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얕은 그릇들’ 또는 ‘그릇들’; 전통적으로는 향을 담는 기물을 ‘숟가락들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
