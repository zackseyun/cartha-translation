  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
  footnotes:
  - marker: a
    text: Or 'pans,' 'bowls,' or traditionally 'spoons' for the incense vessels.
    reason: lexical_alternative
translation:
  language: ko
  text: 금 접시 열둘 곧 향으로 가득 찬 것들이었으며[a], 각 접시는 성소의 세겔로 열 세겔이었습니다. 그 접시들의 금의 총합은 백이십 세겔이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘팬들’, ‘그릇들’, 전통적으로는 향 기물을 가리켜 ‘숟가락들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  english_pob_choice: dishes
  chosen_korean: 접시
  alternatives_korean:
  - 그릇
  - 숟가락
  - 팬
  lexicon: HALOT
  rationale: 제의 맥락에서 כַּף 계열은 향을 담는 작은 용기이므로, 현대 독자가 이해하기 쉬운 ‘접시’로 옮기되 전통적 ‘숟가락’은 피했습니다.
- source_word: מְלֵאֹת קְטֹרֶת
  english_pob_choice: full of incense
  chosen_korean: 향으로 가득 찬 것들이었으며
  alternatives_korean:
  - 향으로 가득한
  - 향이 가득 담긴
  lexicon: HALOT
  rationale: 형용사+명사 결합은 실제로 향이 가득 채워진 상태를 뜻하므로, 상태를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: עֲשָׂרָה עֲשָׂרָה
  english_pob_choice: each ... ten
  chosen_korean: 각 접시는 … 열 세겔이었습니다
  alternatives_korean:
  - 각각 열 세겔이었습니다
  - 열 세겔씩이었습니다
  lexicon: HALOT
  rationale: 반복형 분배 표현이므로 개별 접시마다의 중량을 드러내는 ‘각 … 열 세겔’로 처리했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the sanctuary shekel
  chosen_korean: 성소의 세겔로
  alternatives_korean:
  - 성소 세겔로
  - 성소의 표준 세겔로
  - 성소의 세겔에 따라
  lexicon: HALOT
  rationale: 공적 제의 중량 기준을 가리키는 관용구이므로, ‘성소의 세겔’이라는 기술적 의미를 유지했습니다.
theological_decisions:
- issue: 제의용 향 기물의 번역
  chosen_reading: 향으로 가득 찬 금 접시
  alternative_readings:
  - 향을 담은 금 그릇
  - 향을 넣은 금 숟가락
  rationale: 본문은 성막 봉헌 제물 목록의 실제 기물을 말하므로, 과도한 상징화 없이 물질적·제의적 의미를 그대로 드러내는 번역을 택했습니다.
  doctrine_reference: 민수기 7장 성막 봉헌 서술
