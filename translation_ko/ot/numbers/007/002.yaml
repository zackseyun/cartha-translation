id: NUM.7.2
reference: Numbers 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
  footnotes:
  - marker: a
    text: Or 'presented' instead of 'brought offerings'; the Hebrew verb literally means 'brought near' and in this context refers to presenting dedication gifts.
    reason: lexical_alternative
  - marker: b
    text: '''Fathers’ houses'' refers to ancestral family units or clans within Israel.'
    reason: cultural_note
  - marker: c
    text: Or 'they were those in charge of the counted men' / 'the mustered men.' The Hebrew expression refers to those overseeing the census-registered group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 지도자들[a], 곧 각 조상 가문의 우두머리들이 예물을 드렸습니다. 그들은 지파들의 지도자들이며, 계수된 사람들을 맡아 감독하던 이들이었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가까이 가져왔습니다’ 또는 ‘제시했습니다’. 히브리어 동사는 문자적으로 ‘가까이 가져오다’를 뜻하며, 이 문맥에서는 봉헌을 위해 예물을 드리는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상 가문’은 이스라엘 안의 씨족 또는 친족 집단을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들은 계수된 사람들 위에 서 있던 이들이었습니다’. 히브리어 표현은 인구 조사에서 계수된 집단을 맡아 감독하거나 책임진 이들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  english_pob_choice: brought offerings
  chosen_korean: 나아왔습니다
  alternatives_korean:
  - 가까이 가져왔습니다
  - 드렸습니다
  - 제물을 가져왔습니다
  lexicon: HALOT
  rationale: קרב의 핵심은 '가까이 오게 하다/나아오게 하다'이며, 이 절 자체에는 '제물'이 명시되지 않으므로 문맥을 보존하면서도 과잉 보충을 피해 '나아왔습니다'로 옮겼습니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 우두머리들
  - 이스라엘의 귀족들
  - 이스라엘의 수장들
  lexicon: HALOT
  rationale: נָשִׂיא는 지파/공동체의 지도자·수장을 뜻하므로, 현대 한국어에서 자연스럽고 오해가 적은 '지도자들'을 택했습니다.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  english_pob_choice: the heads of their fathers’ houses
  chosen_korean: 그들의 조상의 집들의 우두머리들
  alternatives_korean:
  - 그들의 조상 가문의 우두머리들
  - 그들의 아버지 집들의 우두머리들
  - 그들의 족장들
  lexicon: HALOT
  rationale: '''fathers’ houses''의 씨족/가문 구조를 살리기 위해 직역에 가깝게 옮겼고, ''우두머리들''로 head의 의미를 분명히 했습니다.'
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  english_pob_choice: They were the leaders of the tribes
  chosen_korean: 그들은 지파들의 지도자들이었습니다
  alternatives_korean:
  - 그들은 지파들의 수장들이었습니다
  - 그들은 지파의 우두머리들이었습니다
  - 그들은 지파들의 장들이었습니다
  lexicon: HALOT
  rationale: מַטּוֹת는 여기서 '지팡이'가 아니라 '지파'를 가리키므로, 사회적 기능을 분명히 하는 '지파들의 지도자들'로 옮겼습니다.
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  english_pob_choice: they were the ones standing over those who were counted
  chosen_korean: 그들은 그 등록된 사람들 위에 서 있는 자들이었습니다
  alternatives_korean:
  - 그들은 그 등록된 사람들을 감독하는 자들이었습니다
  - 그들은 그 계수된 사람들 위에 서 있는 자들이었습니다
  - 그들은 그들을 맡고 있는 자들이었습니다
  lexicon: HALOT
  rationale: עֹמֵד עַל의 '위에 서 있다'는 감시·책임의 이미지를 유지하려고 직역을 살렸고, פְּקוּדִים은 인구조사로 '등록된 사람들'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 권위 표현인 'standing over'의 처리
  chosen_reading: 직역적 이미지인 '위에 서 있는 자들'을 유지했습니다.
  alternative_readings:
  - '''감독하는 자들'''
  - '''책임지는 자들'''
  rationale: 본문은 단순한 행정 직책보다 '위에 서 있다'는 위계적·책임적 이미지를 주므로, 이를 완화하지 않고 보존하는 것이 원문의 힘을 잘 전달합니다.
  doctrine_reference: 공동체 질서와 대표성에 대한 서술적 본문
- issue: וַיַּקְרִיבוּ의 제의적 뉘앙스
  chosen_reading: '''나아왔습니다''로 옮겨, 제물이라는 명사를 보태지 않았습니다.'
  alternative_readings:
  - '''제물을 드렸습니다'''
  - '''가까이 가져왔습니다'''
  rationale: 이 절 자체는 무엇을 가져왔는지 명시하지 않으므로, 제물 보충은 문맥상 가능하더라도 본문 수준에서는 과잉해석이 될 수 있습니다. 앞뒤 문맥이 봉헌 맥락임은 유지되지만, 한국어 본문은 절제했습니다.
  doctrine_reference: 봉헌 서술의 문맥적 암시
