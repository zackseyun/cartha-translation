  rationale: 문맥상 봉헌·제시의 뜻을 지닌 동사를 ‘예물을 드렸습니다’로 바로잡았습니다. 목적어는 이 절에 명시되어 있지 않지만, 동사의 제의적·봉헌적 용법과 바로 뒤 절에서 구체화되는 헌납 물품의 문맥을 따라 한국어에서 자연스럽게 보충한 것입니다. 마지막 구절은 직역적 공간 이미지가 아닌 감독·관할의 기능을 본문 의미에 맞게 옮겼습니다. 각주 표지는 기존 배치를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:10:58Z'
