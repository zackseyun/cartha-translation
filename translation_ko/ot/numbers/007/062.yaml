lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 접시
  alternatives_korean:
  - 그릇
  - 사발
  - 숟가락
  lexicon: HALOT
  rationale: 성막 봉헌물 목록의 문맥에서 כַּף는 향을 담는 작은 용기이므로, 현대 한국어로는 기능을 살린 ‘접시’가 가장 자연스럽고 ‘숟가락’처럼 오해될 표현은 피하는 것이 좋습니다.
- source_word: עֲשָׂרָה זָהָב
  english_pob_choice: ten shekels
  chosen_korean: 금 십 세겔
  alternatives_korean:
  - 열 세겔의 금
  - 금으로 된 십 세겔
  lexicon: HALOT
  rationale: 본문에는 ‘세겔’이 생략되어 있지만, 민수기 7장의 반복 공식을 따라 무게 단위를 보충해야 의미가 완성되므로, POB의 취지를 살려 ‘금 십 세겔’로 옮겼습니다.
- source_word: מְלֵאָה קְטֹרֶת
  english_pob_choice: full of incense
  chosen_korean: 향으로 가득 차 있었습니다
  alternatives_korean:
  - 향으로 가득했습니다
  - 향을 가득 담고 있었습니다
  lexicon: HALOT
  rationale: 형용사 מְלֵאָה는 용기가 내용물로 충만한 상태를 가리키므로, 완료된 봉헌물의 상태를 드러내는 ‘가득 차 있었습니다’가 문맥에 잘 맞습니다.
theological_decisions:
- issue: 무게 단위 ‘세겔’의 생략 보완
  chosen_reading: 본문에는 직접 쓰이지 않지만, 반복되는 봉헌 공식에 근거해 ‘세겔’을 보충해 의미를 드러냈습니다.
  alternative_readings:
  - ‘금 열’로 직역하기
  - ‘금 십의 무게’처럼 모호하게 옮기기
  rationale: 히브리어의 축약된 재고 목록을 그대로 두면 현대 한국어에서 무게 표현이 불완전해지므로, 본문의 관용적 의미를 보존하는 보충이 필요합니다.
  doctrine_reference: 민수기 7장의 봉헌물 목록의 서술 관례
