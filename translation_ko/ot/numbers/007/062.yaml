  lexicon: HALOT
  rationale: 성막 봉헌물 목록의 문맥에서 כַּף는 향을 담는 작은 용기이므로, 현대 한국어로는 기능을 살린 ‘접시’가 가장 자연스럽고 ‘숟가락’처럼 오해될 표현은 피하는 것이 좋습니다.
- source_word: עֲשָׂרָה זָהָב
