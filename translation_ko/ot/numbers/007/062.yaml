  lexicon: HALOT
  rationale: 본문에는 ‘세겔’이 생략되어 있지만, 민수기 7장의 반복 공식을 따라 무게 단위를 보충해야 의미가 완성되므로, POB의 취지를 살려 ‘금 십 세겔’로 옮겼습니다.
- source_word: מְלֵאָה קְטֹרֶת
  english_pob_choice: full of incense
  chosen_korean: 향으로 가득 차 있었습니다
  alternatives_korean:
