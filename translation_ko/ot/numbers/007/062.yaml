  - 향을 가득 담고 있었습니다
  lexicon: HALOT
  rationale: 형용사 מְלֵאָה는 용기가 내용물로 충만한 상태를 가리키므로, 완료된 봉헌물의 상태를 드러내는 ‘가득 차 있었습니다’가 문맥에 잘 맞습니다.
theological_decisions:
