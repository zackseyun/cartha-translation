source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'one silver bowl' for 'one silver plate' (קַעֲרָה), since the Hebrew term denotes a vessel and its exact shape is not fully certain.
    reason: lexical_alternative
  - marker: b
    text: Or 'one silver sprinkling bowl' for 'one silver basin' (מִזְרָק), highlighting the vessel's ritual function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바친 예물은 은 접시 하나[a]로, 그 무게는 백삼십 세겔이었고, 은 대접 하나[b]로, 그 무게는 칠십 세겔이었습니다. 모두 성소의 세겔을 기준으로 한 것이었습니다. 두 그릇에는 곡식제물로 드릴, 기름을 섞은 고운 가루가 가득 담겨 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '은 사발 하나'로 옮길 수 있습니다. 히브리어 קַעֲרָה는 제의에 쓰인 용기를 가리키지만, 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '은 뿌림 그릇 하나'로 옮길 수 있습니다. 히브리어 מִזְרָק은 제의적 뿌림과 관련된 용기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 그의 예물
  alternatives_korean:
  - 그의 제물
