  rationale: קדבָּן은 하나님께 가져오는 제의적 바침을 가리키므로, 문맥상 자연스러운 '예물'을 택해 제의적 성격을 살렸습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은접시 하나
  alternatives_korean:
