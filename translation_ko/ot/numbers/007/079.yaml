  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'one silver bowl' for 'one silver plate' (קַעֲרָה), since the Hebrew term denotes a vessel and its exact shape is not fully certain.
    reason: lexical_alternative
  - marker: b
    text: Or 'one silver sprinkling bowl' for 'one silver basin' (מִזְרָק), highlighting the vessel's ritual function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 예물은 은접시 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 둘 다 고운 가루에 기름을 섞은 소제물이 가득하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '은 사발 하나'로도 옮길 수 있습니다. 히브리어 קַעֲרָה는 용기의 정확한 형태가 완전히 확정되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '은 뿌리는 대접 하나'로도 옮길 수 있습니다. 히브리어 מִזְרָק은 제의적 뿌림에 쓰이는 용기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 그의 예물
  alternatives_korean:
  - 그의 제물
  - 그의 헌물
  lexicon: HALOT
  rationale: קדבָּן은 하나님께 가져오는 제의적 바침을 가리키므로, 문맥상 자연스러운 '예물'을 택해 제의적 성격을 살렸습니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은접시 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 사발 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 정확한 형태가 완전히 확정되지 않은 제의용 용기이므로, POB의 'plate'에 맞춰 '접시'로 옮기되 재질을 앞에 두어 간결하게 했습니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 그 무게는 백삼십 세겔이었고
  alternatives_korean:
  - 무게가 백삼십 세겔이었고
  - 백삼십 세겔의 무게였고
  lexicon: HALOT
  rationale: 히브리어는 수량과 함께 '무게'를 명시하므로, 이를 그대로 드러내어 측정 정보가 분명히 보이도록 했습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 바리 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의적 기능을 가진 용기이지만 정확한 형태는 넓게 남겨 두는 것이 좋으므로, POB의 'basin'에 대응하는 '대접'을 선택했습니다.
- source_word: שֶׁבְעִים שֶׁקֶל בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: of seventy shekels, according to the sanctuary shekel
  chosen_korean: 칠십 세겔이었으며
  alternatives_korean:
  - 성소 세겔로 칠십 세겔이었으며
  - 거룩한 세겔로 칠십 세겔이었으며
  lexicon: HALOT
  rationale: '''성소 세겔''은 도량 표준을 뜻하는 기술적 표현이지만, 한국어에서는 본절의 흐름상 간결하게 무게만 본문에 두고 기술적 설명은 주석 없이 본문에 과잉하지 않았습니다.'
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식제물
  - 곡물제물
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 곡물 제사를 가리키므로, 전통적으로 널리 쓰이는 '소제물'을 택해 제사 범주를 분명히 했습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 범주
  chosen_reading: '''grain offering''에 해당하는 제의 항목으로 이해했습니다.'
  alternative_readings:
  - 일반적인 예물로 완화
  - 공물로 넓게 처리
  rationale: 문맥이 성막 봉헌 목록이므로, 단순한 일반 헌물보다 제의적 전문용어를 유지하는 것이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 민수기 7장의 성막 봉헌 서술
- issue: 수량과 측량 단위의 보존
  chosen_reading: 세겔과 무게 정보를 본문 안에서 그대로 보존했습니다.
  alternative_readings:
  - 현대 단위로 환산
  - 숫자만 제시
  rationale: 성막 봉헌의 기록체는 정확한 계수와 규격을 강조하므로, 현대화보다 원문 측정 체계를 유지하는 편이 더 충실합니다.
  doctrine_reference: 성경 본문의 제의적 기록성
