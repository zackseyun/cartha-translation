revisions:
- from: 그의 예물은 은 접시 하나였는데, 그 무게는 백삼십 세겔이었습니다. 은 대야 하나는 칠십 세겔이었으며, 성소의 세겔 기준으로 계산한 것입니다[c][b]. 두 그릇에는 모두 고운 가루가 기름에 섞여 있었고, 소제물로 드리는 것이었습니다.
  to: 그의 예물은 은 접시 하나[a]로, 그 무게는 백삼십 세겔이었으며, 은 대접 하나[b]로, 그 무게는 칠십 세겔이었습니다. 이는 성소의 세겔 기준이었습니다[c]. 두 그릇은 모두 소제물을 위한, 기름을 섞은 고운 가루로 가득 차 있었습니다.
  rationale: 계량 기준을 독립 문장으로 처리해 앞선 두 무게에 자연스럽게 연결하되, 원문의 표준 기준이라는 뜻을 유지했습니다. 두 용기가 기름 섞은 고운 가루로 ‘가득’했다는 서술을 복원했고, לְמִנְחָה는 ‘소제물을 위한’으로 목적 관계를 보존했습니다. 어휘 대안 각주 [a]를 추가하고 기존 각주의 앵커 순서를 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:07Z'
