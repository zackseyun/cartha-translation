id: NUM.7.55
reference: Numbers 7:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), a shallow silver vessel.
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (מִזְרָק), a ritual vessel used in sanctuary service.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'by the shekel of the sanctuary,' that is, according to the sanctuary standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 은 접시 하나였는데, 그 무게는 백삼십 세겔이었습니다. 은 대야 하나는 칠십 세겔이었으며, 성소의 세겔 기준으로 계산한 것입니다[c][b]. 두 그릇에는 모두 고운 가루가 기름에 섞여 있었고, 소제물로 드리는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그릇’으로도 옮길 수 있는 מִזְרָק입니다. 제의 때 사용된 용기입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘성소의 세겔로’라는 뜻으로, 성소에서 쓰던 표준 무게를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 헌물은
  lexicon: HALOT
  rationale: 제의 문맥에서 קָרְבָּן은 하나님께 가까이 드리는 예물/헌물을 뜻하므로, ‘예물’이 자연스럽고 원뜻을 잘 살립니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 대접 하나
  - 은 쟁반 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 성막 예물 목록에서 얕은 그릇을 가리키므로, 일상어로는 ‘접시’가 가장 간결하고 적절합니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대야 하나
  alternatives_korean:
  - 은 bowl 하나
  - 은 바가지 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의용 그릇이므로, 기능을 과도하게 좁히지 않으면서도 예식용 그릇임을 드러내는 ‘대야’가 무난합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔 기준으로 계산한 것입니다
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소의 세겔로
  lexicon: HALOT
  rationale: 이 구는 무게의 표준 단위를 밝히는 설명이므로, 단순한 전치사보다 ‘기준으로 계산한 것입니다’가 뜻을 분명하게 전합니다.
- source_word: מְלֵאִים סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  english_pob_choice: were full of fine flour mixed with oil
  chosen_korean: 고운 가루가 기름에 섞여 있었고
  alternatives_korean:
  - 고운 가루와 기름이 섞여 있었고
  - 고운 가루를 기름에 버무린
  lexicon: HALOT
  rationale: 소제의 준비 상태를 나타내는 표현이므로, ‘고운 가루’와 ‘기름에 섞여’로 제의적 이미지를 유지했습니다.
theological_decisions:
- issue: לְמִנְחָה의 제의 용어 처리
  chosen_reading: ‘소제물로 드리는 것이었습니다’로 옮겨, 단순한 일반 헌물보다 성막 제의의 ‘grain offering’임을 드러냈습니다.
  alternative_readings:
  - ‘곡식제물로’
  - ‘헌물로’
  rationale: 민수기의 제사 목록에서는 מִנְחָה가 특정한 제의 항목이므로, 용어를 일반화하지 않고 제의적 기능을 살리는 번역이 필요합니다.
  doctrine_reference: 제의/제사 용어의 문맥적 구별
- issue: 문장 끝의 계량 설명 처리
  chosen_reading: ‘성소의 세겔 기준으로 계산한 것입니다’로 풀어, 표준 무게 단위를 독자가 즉시 이해하도록 했습니다.
  alternative_readings:
  - ‘성소의 세겔에 따라’
  - ‘성소의 세겔로’
  rationale: 본문의 핵심은 성소 표준을 따른 무게 규정이므로, 설명형 번역이 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 성소 규격의 표준성
