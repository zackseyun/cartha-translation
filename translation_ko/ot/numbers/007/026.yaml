lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 그릇
  alternatives_korean:
  - 접시
  - 사발
  - 숟가락
  lexicon: HALOT
  rationale: 성막 봉헌 물품 목록의 문맥에서 כַּף는 손바닥이 아니라 작은 용기를 가리키므로, 향을 담는 기물로 자연스러운 ‘그릇’을 택했습니다.
