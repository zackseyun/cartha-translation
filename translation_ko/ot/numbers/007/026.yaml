  rationale: 본문에는 ‘세겔’이 생략되어 있지만, 바로 앞뒤 문맥의 봉헌 공식이 무게 단위를 전제하므로 이를 보충해 ‘열 세겔의 무게로’라고 풀었습니다.
- source_word: מְלֵאָה קְטֹרֶת
