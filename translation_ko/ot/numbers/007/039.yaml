base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
  footnotes:
  - marker: a
    text: Hebrew literally, 'one bull, son of the herd,' an idiom for a bull from the cattle/herd.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'one lamb'; the Hebrew term here is commonly used in sacrificial contexts for a male lamb.
    reason: lexical_alternative
translation:
  language: ko
  text: 수소 한 마리, 숫양 한 마리, 한 살 된 어린 숫양 한 마리를 번제물로 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘소 떼의 아들인 수소 한 마리’입니다. 이는 소 떼에 속한 수소를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘케베스’는 제의 문맥에서 흔히 어린 수컷 양을 가리킵니다. 문맥에 따라 단순히 ‘양’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 한 마리의 소
  lexicon: HALOT
  rationale: ‘פַּר’는 제의 문맥에서 수소/황소를 가리키며, ‘בֶּן בָּקָר’의 관용적 설명은 한국어에서 군더더기 없이 ‘수소’로 풀어 옮길 수 있습니다.
- source_word: אַיִל אֶחָד
  english_pob_choice: one ram
  chosen_korean: 한 마리의 숫양
  alternatives_korean:
  - 한 마리의 양
  - 한 마리의 큰 양
  lexicon: HALOT
  rationale: ‘אַיִל’은 제의 용어로 성숙한 수컷 양이므로, 일반적인 ‘양’보다 ‘숫양’이 원문의 구별을 더 분명히 드러냅니다.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 살 된 숫양 한 마리
  alternatives_korean:
  - 한 살 된 어린 숫양 한 마리
  - 한 살 된 양 한 마리
  lexicon: HALOT
  rationale: 영어 POB의 ‘male lamb’ 취지를 살리면서, ‘בֶּן שְׁנָתוֹ’는 한국어로 자연스럽게 ‘한 살 된’으로 옮겼습니다. 다만 ‘כֶּבֶשׂ’는 실제로는 어린 수컷 양을 가리키므로 ‘숫양’으로 통일해 제의 목록의 성별 대비를 드러냈습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제 제물로
  - 번제로
  lexicon: HALOT
  rationale: ‘עֹלָה’는 온전히 태워 드리는 번제를 뜻하므로, 한국어 제의어인 ‘번제물’이 가장 직접적입니다.
theological_decisions:
- issue: 제의 목록의 반복 형식
  chosen_reading: 각 제물의 수량을 ‘한 마리’씩 반복해, 개별 항목의 대칭성과 정확한 헌물 구조를 보존했습니다.
  alternative_readings:
  - 수량을 묶어 자연스럽게 풀어 쓰는 방식
  - ‘각각 한 마리씩’으로 요약하는 방식
  rationale: 히브리어 원문은 숫자와 명사를 항목별로 병렬 제시하므로, 반복을 유지하는 것이 제의 규정을 더 선명하게 전달합니다.
  doctrine_reference: 민수기 7장의 봉헌 제의 서술
