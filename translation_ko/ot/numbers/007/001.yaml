  rationale: 시간 표현은 원문의 완료된 사건과 ‘날’의 설정을 유지하되, 목적어 ‘성막’을 명시했습니다. 성막의 기구와 제단의 기구를 각각 그 소유 관계에 따라 표현했으며, 마지막 복수 목적어에는 자연스러운 한국어 격조사를 사용하여 기름 바름과 성별의 반복을 보존했습니다.
