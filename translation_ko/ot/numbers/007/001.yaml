reference: Numbers 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
  footnotes:
  - marker: a
    text: Or 'when Moses had finished setting up the tabernacle.' The Hebrew temporal expression can be rendered more idiomatically this way.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 성막 세우기를 마친 날에, 그가 그것에 기름을 붓고 성별하였으며, 그 안의 모든 기구와 제단과 그 안의 모든 기구에도 그렇게 하여, 그것들을 기름 붓고 성별하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성막 세우기를 마친 날에’는 히브리어 시간 표현을 한국어답게 옮긴 것입니다. 직역하면 ‘모세가 성막을 세우기를 마친 날에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם כַּלּוֹת ... לְהָקִים
  english_pob_choice: on the day Moses finished setting up
  chosen_korean: 모세가 성막 세우기를 마친 날에
  alternatives_korean:
  - 모세가 성막을 세우는 일을 마친 때에
  - 모세가 성막 세우기를 끝낸 날에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 한국어로 옮기되, ‘날에’로 사건의 시점을 살리고 ‘마친’으로 완료 의미를 반영했습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 회막
  lexicon: HALOT
  rationale: 광야 성소 문맥에서 가장 직접적이고 널리 통용되는 대응어는 ‘성막’입니다.
- source_word: וַיִּמְשַׁח
  english_pob_choice: he anointed
  chosen_korean: 기름을 붓고
  alternatives_korean:
  - 기름을 발라
  - 기름으로 부어
  lexicon: HALOT
  rationale: 성별 예식의 관용적 표현으로서 ‘기름을 붓다’가 자연스럽고, 단순한 도포보다 의례적 의미를 더 분명히 드러냅니다.
- source_word: וַיְקַדֵּשׁ
  english_pob_choice: consecrated
  chosen_korean: 성별하였으며
  alternatives_korean:
  - 거룩하게 하였으며
  - 봉헌하였으며
  lexicon: HALOT
  rationale: 이 동사는 도덕적 변화보다 예식적 구별과 헌납을 뜻하므로, ‘성별하다’가 제의적 의미를 가장 잘 보존합니다.
- source_word: כָּל כֵּלָי/ו
  english_pob_choice: all its furnishings / all its utensils
  chosen_korean: 그 안의 모든 기구와 제단과 그 안의 모든 기구
  alternatives_korean:
  - 모든 기물과 제단과 제단의 모든 기구
  - 모든 기구들과 제단과 그 기구들
  lexicon: HALOT
  rationale: 첫 번째 כֵּלִים은 성막의 구성물 전체를, 두 번째는 제단의 부속 기구를 가리키므로 문맥 차이를 살려 반복적으로 구분했습니다.
theological_decisions:
- issue: קדש의 제의적 의미를 한국어로 어떻게 유지할지
  chosen_reading: ‘성별하다’로 옮겨, 물건을 도덕적으로 ‘거룩하게 만들다’는 뉘앙스보다 예식적으로 ‘구별하여 바치다’는 의미를 살렸습니다.
  alternative_readings:
  - 거룩하게 하다
  - 성화하다
  rationale: 문맥은 성막과 그 기구의 헌정 절차이므로, 성별이 핵심입니다. 이는 기독교의 내적 성화 교리보다 성소의 제의적 헌납을 가리킵니다.
  doctrine_reference: 성소 봉헌 및 제의적 거룩ness의 번역 원칙
