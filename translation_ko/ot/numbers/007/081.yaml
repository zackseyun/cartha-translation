translation:
  language: ko
  text: 번제물로 바친 것은 소 떼에서 나온 수소 한 마리, 숫양 한 마리, 한 살 된 수컷 어린양 한 마리입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 들판의 소 하나
  alternatives_korean:
  - 소 한 마리
  - 소 한 마리, 소떼에서
  lexicon: HALOT
  rationale: פַּר과 בֶּן בָּקָר의 조합은 제물 목록에서 소 계열의 짐승을 가리키므로, 자연스러운 한국어로는 ‘들판의 소’보다 ‘소’가 더 간결하지만, 원문의 종류 구분을 살리기 위해 간명하게 ‘소 하나’로 옮겼습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양 하나
  alternatives_korean:
  - 수양 하나
  - 숫양
  lexicon: HALOT
  rationale: אַיִל은 제의 문맥에서 성숙한 수양을 뜻하므로, 표준적이고 분명한 ‘숫양’을 선택했습니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: male lamb
  chosen_korean: 숫양새끼 하나
  alternatives_korean:
  - 수양새끼 하나
  - 어린 숫양 하나
  - 어린 양 하나
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 단순히 ‘양’이 아니라 수컷 새끼 양을 가리키므로, 성별 구분을 유지하는 ‘숫양새끼’로 옮겼습니다.
- source_word: בֶּן שְׁנָתוֹ
  english_pob_choice: a year old
  chosen_korean: 하나를
  alternatives_korean:
  - 한 살짜리
  - 한 해 된
  lexicon: HALOT
  rationale: 연령 표시는 한국어에서 제물 목록의 반복 구조 안에 자연스럽게 흡수되도록 하였으며, 본문은 간결성을 위해 ‘숫양새끼 하나’에 포함해 읽히게 했습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제물로 드립니다
  - 번제물로서
  lexicon: HALOT
  rationale: עֹלָה는 정형적인 제의 용어이므로 관습적이되 직설적인 ‘번제물’로 옮겼고, לְ는 목적·용도를 나타내어 ‘-로’로 처리했습니다.
theological_decisions:
- issue: 제물 목록의 축약 여부
  chosen_reading: 히브리어의 항목 나열 구조를 보존하되 한국어에서는 문장 종결을 자연스럽게 처리했습니다.
  alternative_readings:
  - 직역식 명사열 유지
  - 완전한 서술문으로 재구성
  rationale: 이 구절은 제물의 수량과 종류를 열거하는 목록이므로, 의미를 더하지 않고 한국어 독자가 읽기 쉬운 목록형 표현을 택했습니다.
  doctrine_reference: 민수기 7장의 봉헌 예물 목록 구조
