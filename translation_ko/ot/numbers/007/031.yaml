id: NUM.7.31
reference: Numbers 7:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (Hebrew קַעֲרָה), a ritual vessel.
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' for 'basin' (Hebrew מִזְרָק), a vessel associated with sacrificial use.
    reason: lexical_alternative
  - marker: c
    text: That is, according to the standard sanctuary weight.
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 무게가 백삼십 세겔인 은 접시[a] 하나와, 무게가 칠십 세겔인 은 대접[b] 하나였습니다. 이 두 그릇의 무게는 성소 세겔[c]에 따른 것이며, 두 그릇은 곡식 제물을 위해 기름과 섞은 고운 가루로 가득 차 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접시’는 히브리어 קַעֲרָה를 옮긴 말이며, 제의에 쓰인 얕은 그릇을 가리킬 수 있습니다. ‘쟁반’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대접’은 히브리어 מִזְרָק를 옮긴 말이며, 제의에 쓰인 그릇을 가리킬 수 있습니다. ‘대야’ 또는 ‘사발’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 성소에서 사용하는 표준 무게 기준에 따른다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 드림물은
  lexicon: HALOT
  rationale: 제의 문맥에서 קָרְבָּן은 바치는 예물/제물을 뜻하므로, 한국어로는 가장 직접적인 ‘예물’이 자연스럽고 स्रोत의 공적 제의성을 살립니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 쟁반 하나
  alternatives_korean:
  - 은 접시 하나
  - 은 대접 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 제의용 얕은 용기를 가리키므로, 일상적 식기 느낌이 강한 ‘접시’보다 ‘쟁반’이 기능상 더 잘 맞습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 바리 하나
  - 은 그릇 하나
  lexicon: HALOT
  rationale: מִזְרָק은 뿌리거나 제의용 액체를 담는 용기이므로, 기능을 드러내는 ‘대접’이 ‘bowl’보다 덜 일상적이고 더 의례적입니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 거룩한 곳의 세겔로 계산한 것입니다
  alternatives_korean:
  - 성소의 세겔로
  - 성막의 세겔로
  lexicon: HALOT
  rationale: 관용구를 직역하되, 무게 기준이라는 의미를 분명히 하기 위해 ‘계산한 것입니다’를 덧붙였습니다. ‘거룩한 곳’은 sanctuary의 직역입니다.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן לְמִנְחָה
  english_pob_choice: fine flour mixed with oil for a grain offering
  chosen_korean: 기름에 섞은 고운 가루로 가득 차서 곡식 제물로
  alternatives_korean:
  - 기름에 섞은 고운 가루로
  - 기름과 섞인 고운 가루로
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 곡식 제물로 이해하는 것이 적절하며, בְּלוּלָה는 ‘섞은’으로 간명하게 옮겼습니다. ‘가득 차서’는 두 용기가 그 내용물로 채워졌다는 מצב을 반영합니다.
theological_decisions:
- issue: 제의 용기와 내용물의 기능적 표현
  chosen_reading: 예물과 제의용 용기를 드러내되, 일상용기처럼 평범하게 만들지 않았습니다.
  alternative_readings:
  - 쟁반/대접을 단순한 식기로 완화하는 번역
  - 제의성을 약화한 일반적 '그릇' 번역
  rationale: 문맥은 성막 예물의 규격을 열거하는 제의 규정이므로, 용기 명칭이 의례적 기능을 유지하도록 옮겨야 합니다.
  doctrine_reference: 제의 규례의 문맥 보존
- issue: מִנְחָה의 번역
  chosen_reading: ‘곡식 제물’로 옮겨, 피 없는 곡물 제사를 분명히 했습니다.
  alternative_readings:
  - ‘제물’로 일반화
  - ‘소제’로 전통 용어 사용
  rationale: 한국 교회 용어 ‘소제’는 의미는 맞지만 현대 독자가 즉시 이해하기 어렵고, 단순한 ‘제물’은 제의 종류를 흐립니다. 따라서 기능을 드러내는 ‘곡식 제물’을 택했습니다.
  doctrine_reference: 레위기 제사 용어의 구체성
