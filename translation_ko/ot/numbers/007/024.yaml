  - 스불론의 자손들의
  lexicon: HALOT
  rationale: ל의 소속·대표 관계를 살려 ‘~의’로 옮겼고, 지파 계보 표현은 한국어 성경 문체에 맞게 ‘자손’으로 처리했습니다.
- source_word: בֶּן חֵלֹן
  english_pob_choice: son of Helon
  chosen_korean: 헬론의 아들
  alternatives_korean:
  - 헬론의 아들
  - 헬론의 아들인
  lexicon: HALOT
  rationale: 히브리어의 표준 부자 관계를 직역하여 인물 식별 정보를 분명하게 유지했습니다.
