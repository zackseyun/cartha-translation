  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
  footnotes:
  - marker: a
    text: Or 'the leader for the sons of Zebulun.' The Hebrew preposition can be understood as marking representation or affiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 날에[a] 스불론 자손의 지도자는 헬론의 아들 엘리압이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스불론 자손을 대표하는 지도자’. 히브리어 전치사 ל는 소속뿐 아니라 대표 관계도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: On the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세 번째 날에
  - 그 셋째 날에
  lexicon: BDB/HALOT
  rationale: 히브리어 관용 표현을 자연스러운 시간 부사로 옮기되, 서술형 목록 문맥에 맞게 간결하게 처리했습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
