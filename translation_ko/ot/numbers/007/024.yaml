  - 족장
  lexicon: HALOT
  rationale: 문맥상 지파의 공식 대표를 가리키므로, 현대 한국어에서 왕족 뉘앙스가 없는 ‘지도자’가 가장 분명합니다.
- source_word: לִבְנֵי זְבוּלֻן
  english_pob_choice: of the sons of Zebulun
  chosen_korean: 스불론 자손의
  alternatives_korean:
