  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
  footnotes:
  - marker: a
    text: Or, 'the one who offered his offering ... of the tribe of Judah.' The Hebrew participle and the phrase 'for/of the tribe of Judah' can be rendered slightly differently in English without changing the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 첫째 날에 그의 제물을 바친 사람은 암미나답의 아들 나손이었으며, 유다 지파의 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 현재분사와 지파 관계 표현은 영어처럼 ‘제물을 바친 사람 … 유다 지파의 사람’ 또는 비슷하게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  english_pob_choice: the one presenting
  chosen_korean: 제물을 바친 사람
  alternatives_korean:
  - 제물을 드리는 사람
  - 제물을 가져온 사람
  - 드린 사람
  lexicon: HALOT
  rationale: 현재분사형을 자연스러운 서술로 옮기되, 단순한 ‘가져옴’보다 제의적 행위를 분명히 드러내기 위해 ‘제물을 바친 사람’으로 렌더링했습니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 그의 제물
  alternatives_korean:
  - 그의 예물
  - 그의 헌물
  - 그의 제사
  lexicon: HALOT
  rationale: קָרְבָּן의 제의적 의미를 살리기 위해 ‘제물’을 택했고, 소유격 ‘his’를 그대로 반영했습니다.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  english_pob_choice: on the first day
  chosen_korean: 첫째 날에
  alternatives_korean:
  - 첫날에
  - 첫째 날에
  - 첫날
  lexicon: HALOT
  rationale: 시간 부사구로서 자연스럽고 현대적인 한국어 표현인 ‘첫째 날에’를 사용했습니다.
- source_word: לְמַטֵּה יְהוּדָה
  english_pob_choice: of the tribe of Judah / for the tribe of Judah
  chosen_korean: 유다 지파의 사람
  alternatives_korean:
  - 유다 지파에 속한 사람
  - 유다 지파를 대표하는 사람
  - 유다 지파의
  lexicon: HALOT
  rationale: לְ가 소속/대표성을 함께 띨 수 있어, 문맥상 나손이 유다 지파를 대표해 바치는 인물임을 한국어 관용으로 가장 자연스럽게 드러내는 방식으로 옮겼습니다.
theological_decisions:
- issue: 지파 소속과 대표성의 표현
  chosen_reading: ‘유다 지파의 사람’으로 옮겨, 소속을 드러내면서도 제물 봉헌의 대표자라는 뉘앙스를 과도하게 해석하지 않도록 했습니다.
  alternative_readings:
  - ‘유다 지파를 대표하는 사람’
  - ‘유다 지파를 위한 사람’
  rationale: 히브리어 לְ마침표는 문맥상 소속과 대표 가능성을 모두 열어 두므로, 본문이 말하는 범위 안에서 가장 절제된 표현을 택했습니다.
  doctrine_reference: 원문 문법과 서술 기능에 대한 번역 판단
