id: NUM.7.8
reference: Numbers 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
  footnotes:
  - marker: a
    text: Or 'wagons' for 'carts.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by the hand of Ithamar,' an idiom indicating agency or supervision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 대의 수레[a]와 여덟 마리의 소를 므라리의 아들들에게 그들의 직무에 따라, 제사장 아론의 아들 이다말의 감독 아래[b] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲגָלָה는 바퀴 달린 운반 수단으로, 문맥상 ‘수레’ 또는 ‘마차’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이다말의 손으로’이지만, 여기서는 행정적 감독이나 대리 수행을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  english_pob_choice: carts
  chosen_korean: 수레
  alternatives_korean:
  - 카트
  - 마차
  - 짐수레
  lexicon: HALOT
  rationale: עֲגָלָה는 물자를 나르는 바퀴 달린 운반 수단이므로, 문맥에 맞는 현대 한국어로는 '수레'가 가장 자연스럽습니다. 영어 POB의 'carts'에 대응하되 성막 운반이라는 상황도 살렸습니다.
- source_word: הַבָּקָר
  english_pob_choice: oxen
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 가축
  lexicon: HALOT
  rationale: 수레를 끄는 짐승으로 문맥상 '소'가 충분히 분명하며, 지나치게 좁은 '황소'보다 자연스럽습니다. 영어 POB의 구체적 의미를 유지하면서 한국어 가독성을 확보했습니다.
- source_word: לִבְנֵי מְרָרִי
  english_pob_choice: to the sons of Merari
  chosen_korean: 므라리의 아들들에게
  alternatives_korean:
  - 므라리 사람들에게
  - 므라리 자손에게
  lexicon: HALOT
  rationale: 히브리어 직역 구조인 '므라리의 아들들'을 살려 혈연-씨족 표현을 유지했습니다. '므라리 자손'도 가능하지만 원문의 표현을 더 직접적으로 반영했습니다.
- source_word: כְּפִי עֲבֹדָתָם
  english_pob_choice: according to their service
  chosen_korean: 그들의 직무에 따라
  alternatives_korean:
  - 그들의 봉사에 따라
  - 그들의 일에 따라
  - 그들의 사역에 따라
  lexicon: HALOT
  rationale: עֲבֹדָה는 성막 봉사의 맥락에서 단순한 일이 아니라 지정된 직무를 뜻하므로 '직무'가 가장 정확합니다. 'according to'의 규범적 배분 의미를 '에 따라'로 자연스럽게 옮겼습니다.
- source_word: בְּיַד אִיתָמָר
  english_pob_choice: under the direction of Ithamar
  chosen_korean: 이다말의 지휘 아래
  alternatives_korean:
  - 이다말의 손 아래
  - 이다말의 감독 아래
  - 이다말을 통해
  lexicon: HALOT
  rationale: 직역인 '손으로'는 한국어에서 어색하므로, 행정적·감독적 의미를 드러내는 '지휘 아래'로 옮겼습니다. 영어 POB의 설명과 일치하게 이 구문이 단순한 물리적 '손'이 아니라 관리권을 가리킨다는 점을 반영했습니다.
theological_decisions:
- issue: 제사장 호칭과 중간 관리 표현의 톤
  chosen_reading: '''제사장 아론의 아들 이다말의 지휘 아래''로 옮겨, 성막 봉사 배분이 아론의 제사장 권위 아래 질서 있게 이루어졌다는 점을 드러냈습니다.'
  alternative_readings:
  - '''제사장 아론의 아들 이다말의 손에 의해'''
  - '''제사장 아론의 아들 이다말의 감독 아래'''
  rationale: 본문은 단순 전달이 아니라 공식적 배분과 감독을 말하므로, 한국어에서도 행정적 질서를 분명히 보이게 하는 표현이 필요합니다. 이는 원문의 'בְּיַד' 관용구를 의미 중심으로 살린 것입니다.
  doctrine_reference: 민수기 7장의 성막 봉사 분담
