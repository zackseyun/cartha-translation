  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ko
  text: 한 수송아지, 한 숫양, 한 살 된 숫양 새끼 한 마리로 번제물을 삼았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  english_pob_choice: bull
  chosen_korean: 수송아지
  alternatives_korean:
  - 황소
  - 수소
  lexicon: HALOT
  rationale: 제물 목록의 동물명으로는 성숙한 ‘황소’보다 제사용 소를 자연스럽게 가리키는 ‘수송아지’가 한국어 성경체에 더 잘 맞습니다.
- source_word: בֶּן בָּקָר
  english_pob_choice: from the herd
  chosen_korean: 한 수송아지
  alternatives_korean:
  - 소떼에서 나온
  - 가축에서 나온
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘소떼에 속한 짐승’임을 밝히므로, 한국어에서는 바로 이해되는 제사 동물 표현인 ‘수송아지’로 옮겨 의미를 드러냈습니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: male lamb
  chosen_korean: 숫양 새끼
  alternatives_korean:
  - 어린 숫양
  - 어린 양
  lexicon: HALOT
  rationale: 문맥상 번제 제물의 표준 표현을 살리기 위해 ‘양’보다 성별이 드러나는 ‘숫양 새끼’를 택했습니다.
- source_word: בֶּן שְׁנָתֹו
  english_pob_choice: a year old
  chosen_korean: 한 살 된
  alternatives_korean:
  - 일 년 된
  - 첫해의
  lexicon: HALOT
  rationale: 연령을 나타내는 관용구를 현대 한국어로 자연스럽고 명확하게 풀어, 제물의 연령 조건을 분명히 했습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로 삼았습니다
  alternatives_korean:
  - 번제물로
  - 번제드리기 위하여
  lexicon: HALOT
  rationale: עֹלָה는 완전히 불살라 드리는 번제를 가리키므로, 단순한 목적어 표지보다 제사 행위의 용도를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 제물 목록의 누적 구조를 한국어에서 어떻게 보존할 것인가
  chosen_reading: 각 항목을 ‘한 …, 한 …, 한 …’으로 대응시켜 수량과 배열을 그대로 드러냈습니다.
  alternative_readings:
  - 세 동물로 된 번제물
  - 수송아지와 숫양과 숫양 새끼를 번제물로 삼았습니다
  rationale: 본문은 세 제물의 종류와 수를 병렬로 제시하므로, 반복되는 ‘한’을 유지해야 제사의 구체성과 서술 리듬이 보존됩니다.
  doctrine_reference: 민수기 7장 서원 예물 목록의 서술 구조
- issue: כֶּבֶשׂ의 성별과 연령을 어떻게 처리할 것인가
  chosen_reading: ‘숫양 새끼’로 성별을 드러내되, 연령 표현은 뒤의 ‘한 살 된’으로 분리했습니다.
  alternative_readings:
  - 어린 양
  - 어린 숫양
  rationale: ‘어린 양’은 성별 정보가 약화될 수 있어, 제사 규정의 세부를 보존하는 쪽을 택했습니다.
  doctrine_reference: 레위기 제사 규례의 동물 요건
