- source_word: אֵילִם חֲמִשָּׁה / עַתֻּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams, five male goats, and five lambs a year old
  chosen_korean: 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 어린양 다섯 마리
