  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for the Hebrew term often used for a shared sacrificial meal expressing peace or wholeness.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'two cattle'; some translations render more specifically 'two oxen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제[a]의 제물은 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리입니다. 이것은 암미훗의 아들 엘리사마의 예물입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 히브리어 שְׁלָמִים의 관용 번역입니다. 이 말은 평안, 온전함, 교제의 의미를 함께 담는 제물입니다.
    reason: lexical_alternative
