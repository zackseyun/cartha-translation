  lexicon: HALOT
  rationale: 각 동물의 제의적 구분을 보존해야 하므로 숫양/숫염소를 분명히 하고, בְּנֵי שָׁנָה는 ‘일 년 된’으로 자연스럽게 옮겼습니다.
- source_word: זֶה קָרְבַּן
  english_pob_choice: This was the offering of
  chosen_korean: 이것은 …의 예물입니다
  alternatives_korean:
  - 이것은 …의 제물입니다
  - 이것이 …의 예물입니다
  - 이것은 …의 헌물입니다
  lexicon: HALOT
  rationale: קָרְבָּן은 단순한 일반 헌금보다 제의적 ‘예물/제물’의 성격이 강하므로, 목록 마무리 문맥에 맞게 ‘예물’로 옮겼습니다.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  english_pob_choice: Elishama son of Ammihud
  chosen_korean: 암미훗의 아들 엘리사마
  alternatives_korean:
