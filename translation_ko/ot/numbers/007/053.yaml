  - 암미훗의 아들 엘리샤마
  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 음역을 따르되, בן은 한국어 친족 관계 관용구인 ‘~의 아들’로 처리했습니다.
theological_decisions:
- issue: 제의 목록의 누적적 열거와 마무리 선언
  chosen_reading: 각 제물 항목을 쉼표로 나열하고 마지막에 ‘이것은 …의 예물입니다’로 정리해, 본문의 목록적·기록적 성격을 보존했습니다.
  alternative_readings:
  - 항목마다 문장을 분리하는 방식
  - 더 해설적인 문장으로 풀어 쓰는 방식
  rationale: 민수기의 헌물 목록은 서술보다 기록에 가깝기 때문에, 의미를 확대하지 않고 제물 구성과 봉헌 귀속을 분명히 하는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 민수기 7장의 성소 봉헌 헌물 목록
