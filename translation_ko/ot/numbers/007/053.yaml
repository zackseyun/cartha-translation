  lexicon: HALOT
  rationale: שְׁלָמִים은 제의적 고유 용어이므로 관용적인 ‘화목제’로 옮기되, זֶבַח의 제물 성격을 살려 구조를 압축했습니다.
- source_word: בָּקָר שְׁנַיִם
