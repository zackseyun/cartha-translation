  rationale: 각 동물의 제의적 구분을 보존해야 하므로 숫양/숫염소를 분명히 하고, בְּנֵי שָׁנָה는 ‘일 년 된’으로 자연스럽게 옮겼습니다.
- source_word: זֶה קָרְבַּן
