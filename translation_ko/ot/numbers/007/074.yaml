  - 금 열 세겔의
  lexicon: HALOT
  rationale: 히브리어는 단위 '세겔'을 생략하지만, 반복되는 봉헌 공식과 English POB의 audit trail에 따라 무게 단위를 보충해 의미를 분명히 했습니다.
