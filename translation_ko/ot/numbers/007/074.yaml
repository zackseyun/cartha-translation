  lexicon: HALOT
  rationale: מְלֵאָה는 상태를 나타내는 분사로, 내용물이 가득 차 있음을 자연스럽게 표현했습니다. קְטֹרֶת는 성막 제의 문맥의 '향'으로 옮겼습니다.
