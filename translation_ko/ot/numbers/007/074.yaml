    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  english_pob_choice: dish
  chosen_korean: 대접
  alternatives_korean:
  - 그릇
  - 접시
  - 숟가락
  lexicon: HALOT
  rationale: 성막 봉헌 목록 문맥에서 כַּף는 손이나 숟가락보다 작은 용기/그릇을 가리키므로, 현대 한국어에서 가장 자연스러운 제의 용기인 '대접'을 택했습니다.
