  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew בָּקָר is a broad term for cattle; some translations render it 'oxen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제의 희생으로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 그리고 일 년 된 숫양 새끼 다섯 마리였습니다. 이것이 수리삿대의 아들 슬루미엘의 예물이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 히브리어 שְׁלָמִים의 전통적 대응어입니다. 문맥에 따라 ‘교제제물’ 또는 ‘평화제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בָּקָר은 엄밀히는 ‘가축/소’의 넓은 범주를 가리키며, 일부 번역은 ‘황소’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 화목제의 희생으로는
  alternatives_korean:
  - 평화제의 희생으로는
  - 화목제 예물로는
  - 평강제의 희생으로는
  lexicon: HALOT
  rationale: שְׁלָמִים의 제의적 관용어는 한국어 성경에서 의미가 가장 안정적으로 전달되는 ‘화목제’로 옮겼고, לְזֶבַח은 목록 항목을 이끄는 기능을 반영해 ‘희생으로는’으로 처리했습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 가축 두 마리
  - 소 두 마리
  - 황소 두 마리
  lexicon: HALOT
  rationale: בָּקָר은 특정한 황소보다 넓은 ‘가축/소’ 범주이므로, 제사 목록의 자연스러운 한국어로 ‘소 두 마리’를 택해 과도한 특정화를 피했습니다.
- source_word: עַתֻּדִים חֲמִשָּׁה
  english_pob_choice: five male goats
  chosen_korean: 숫염소 다섯 마리
  alternatives_korean:
  - 염소 다섯 마리
  - 숫염소 다섯 마리
  - 수염소 다섯 마리
  lexicon: HALOT
  rationale: עַתּוּדִים의 수컷 표지를 살려 단순한 ‘염소’보다 ‘숫염소’로 옮겼습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five male lambs a year old
  chosen_korean: 일 년 된 숫양 새끼 다섯 마리
  alternatives_korean:
  - 일 년 된 어린 숫양 다섯 마리
  - 한 살 된 숫양 새끼 다섯 마리
  - 일 년 된 양 새끼 다섯 마리
  lexicon: HALOT
  rationale: בְּנֵי שָׁנָה는 ‘일 년 된’이라는 나이 표현을 그대로 반영했고, כְּבָשִׂים을 성별이 드러나는 제물 항목으로 이해해 ‘숫양 새끼’로 옮겼습니다.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  english_pob_choice: Shelumiel son of Zurishaddai
  chosen_korean: 수리삿대의 아들 슬루미엘
  alternatives_korean:
  - 슬루미엘의 아들 수리삿대
  - 슬루미엘, 수리삿대의 아들
  - 셀루미엘의 아들 츠리샤다이
  lexicon: HALOT
  rationale: 인명은 현대 한국어 음역 관행에 따라 옮겼고, בֶּן은 족보식 식별구문이므로 ‘아들’로 직역했습니다.
theological_decisions:
- issue: 제의적 용어 שְׁלָמִים의 한국어 표준화
  chosen_reading: ‘화목제’로 옮겨 제사 체계 안에서의 전문 용어를 유지했습니다.
  alternative_readings:
  - 평화제
  - 교제제물
  - 평강제물
  rationale: 이 구절은 단순한 일반적 평화가 아니라 지정된 제의 항목이므로, 전통적이되 의미 범위가 넓은 ‘화목제’가 원문 기능을 가장 잘 드러냅니다.
  doctrine_reference: 민수기 7장 제사 목록의 제의 문맥
- issue: כְּבָשִׂים의 수컷성 반영
  chosen_reading: ‘숫양 새끼’로 수컷 표지를 드러냈습니다.
  alternative_readings:
  - 양 새끼
  - 어린 양
  - 어린 숫양
  rationale: 영어 POB가 성별을 드러내는 해석을 유지하므로, 제물 목록의 종별 구분이 흐려지지 않도록 수컷 표지를 보존했습니다.
  doctrine_reference: 제사 제물의 규정적 분류
