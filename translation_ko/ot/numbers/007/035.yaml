id: NUM.7.35
reference: Numbers 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제물의 제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 어린양 다섯 마리였습니다. 이것이 스데울의 아들 엘리술의 예물이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  english_pob_choice: and for the sacrifice of peace offerings
  chosen_korean: 그리고 화목제물의 제물로는
  alternatives_korean:
  - 그리고 화목제물로는
  - 그리고 화목제의 제물로는
  - 그리고 평화제물의 제물로는
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의 용어로서 ‘peace offerings’에 대응하는 표준적인 의미가 있어, 한국어 성경 전통과 원문의 제의적 성격을 살려 ‘화목제물’로 옮겼습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 두 마리의 소
  - 두 마리의 가축
  - 두 마리의 황소
  lexicon: HALOT
  rationale: בָּקָר는 집합명사로서 소과 가축을 가리키지만, 제물 목록에서는 자연스럽고 구체적인 한국어로 ‘소 두 마리’가 가장 적절합니다.
- source_word: עַתֻּדִים חֲמִשָּׁה
  english_pob_choice: five male goats
  chosen_korean: 숫염소 다섯 마리
  alternatives_korean:
  - 수염소 다섯 마리
  - 염소 수컷 다섯 마리
  - 숫염소 다섯 마리
  lexicon: HALOT
  rationale: עַתּוּדִים은 단순한 염소가 아니라 번제·속죄 제의에서 쓰이는 수컷 염소를 가리키므로, 성별을 분명히 드러내는 ‘숫염소’를 택했습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five lambs a year old
  chosen_korean: 일 년 된 어린양 다섯 마리
  alternatives_korean:
  - 한 살 된 어린양 다섯 마리
  - 일 년 된 새끼양 다섯 마리
  - 일 년 된 양새끼 다섯 마리
  lexicon: HALOT
  rationale: בְּנֵי שָׁנָה는 ‘한 해 된/일 년 된’이라는 나이 표지이므로 이를 살리고, כְּבָשִׂים은 제물 문맥에 맞게 ‘어린양’으로 자연스럽게 옮겼습니다.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  english_pob_choice: Elizur son of Shedeur
  chosen_korean: 스데울의 아들 엘리술
  alternatives_korean:
  - 쉐데울의 아들 엘리술
  - 엘리술, 스데울의 아들
  - 스데울의 아들 엘리주르
  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 음역을 따르되, בן은 관형적 소유 관계를 드러내는 ‘의 아들’로 옮겨 족보 관계를 분명히 했습니다.
theological_decisions:
- issue: 제의 목록의 반복적 서술을 한국어에서 어떻게 처리할지
  chosen_reading: 간결한 서술문으로 정리하되, 제물 항목과 소유 관계를 그대로 보존했습니다.
  alternative_readings:
  - 직역에 가까운 도치형 표현
  - ‘이는 …의 예물입니다’의 더 장황한 문장
  rationale: 이 절은 서술 내용 자체보다 봉헌 항목의 정확한 열거가 핵심이므로, 한국어 문장성은 확보하되 목록의 수량과 제물 종류가 흐려지지 않도록 했습니다.
  doctrine_reference: 민수기 7장의 봉헌 제물 기록
- issue: peace offerings의 신학적·제의적 용어 선택
  chosen_reading: ‘화목제물’로 옮겨 제사 용어의 전통성과 원문의 제의적 의미를 함께 유지했습니다.
  alternative_readings:
  - 평화제물
  - 교제제물
  - 화평제물
  rationale: ‘peace offerings’는 단순한 정서적 평화가 아니라 하나님과의 관계 회복 및 교제를 포함한 제의이므로, 한국어 성경에서 널리 쓰이는 ‘화목제물’이 가장 적합합니다.
  doctrine_reference: 레위기 제사 체계
