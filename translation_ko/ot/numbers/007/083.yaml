id: NUM.7.83
reference: Numbers 7:83
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 화목제물로는 소 두 마리, 숫양 다섯 마리, 숫염소 다섯 마리, 한 살 된 숫양 새끼 다섯 마리였습니다. 이것은 에난의 아들 아히라의 예물이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  english_pob_choice: And for the sacrifice of peace offerings
  chosen_korean: 화목제물의 제물로는
  alternatives_korean:
  - 평화 제물의 제물로는
  - 화목 제물로는
  - 화목제물로
  lexicon: HALOT
  rationale: זֶבַח הַשְּׁלָמִים는 제의적 범주를 가리키는 표현이므로, 전통적이면서도 의미를 비교적 직접 드러내는 ‘화목제물’을 택했습니다. 앞의 전치사구는 한국어에서 조사 ‘-로는’으로 자연스럽게 풀어 옮겼습니다.
- source_word: בָּקָר שְׁנַיִם
  english_pob_choice: two cattle
  chosen_korean: 수소 두 마리
  alternatives_korean:
  - 소 두 마리
  - 가축 두 마리
  - 큰 가축 두 마리
  lexicon: HALOT
  rationale: בָּקָר는 집합명사로 ‘소/소떼’의 범주를 가리키지만, 제물 목록에서는 구체성을 살려 ‘수소’로 옮겼습니다. POB의 ‘cattle’보다 한국어에서는 성별을 드러내는 것이 더 자연스럽습니다.
- source_word: אֵילִם חֲמִשָּׁה / עַתֻּדִים חֲמִשָּׁה / כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  english_pob_choice: five rams, five male goats, and five male lambs a year old
  chosen_korean: 숫양 다섯 마리, 숫염소 다섯 마리, 일 년 된 숫양 새끼 다섯 마리
  alternatives_korean:
  - 수양 다섯 마리, 숫염소 다섯 마리, 일 년 된 양 새끼 다섯 마리
  - 수양 다섯 마리, 숫염소 다섯 마리, 한 살 된 어린 숫양 다섯 마리
  lexicon: HALOT
  rationale: אֵילִים, עַתֻּדִים, כְּבָשִׂים는 각각 숫양, 숫염소, 양 새끼를 가리키므로, 제물 목록의 동물 구분이 흐려지지 않도록 성별과 연령을 함께 살렸습니다. ‘일 년 된’은 בְּנֵי שָׁנָה의 직역에 가까워 원문의 연령 정보를 보존합니다.
- source_word: זֶה קָרְבַּן
  english_pob_choice: This was the offering of
  chosen_korean: 이것은 …의 제물이었습니다
  alternatives_korean:
  - 이것은 …의 예물이었습니다
  - 이것이 …의 제물이었습니다
  - 이것은 …의 제사였습니다
  lexicon: HALOT
  rationale: 결론 공식의 기능을 살리기 위해 ‘이것은’과 과거형 ‘제물이었습니다’를 사용했습니다. קָרְבָּן은 여기서 헌물/제물의 총칭이므로 ‘제물’이 가장 직접적입니다.
