  chosen_korean: 지휘자
  alternatives_korean:
  - 지도자
  - 우두머리
  - 족장
  lexicon: HALOT
  rationale: 민수기의 נָשִׂיא는 지파를 대표하는 공식적 인물을 가리키므로, 단순한 ‘지도자’보다 행사·행렬 맥락이 드러나는 ‘지휘자’로 옮겼습니다.
- source_word: לִבְנֵי דָן
