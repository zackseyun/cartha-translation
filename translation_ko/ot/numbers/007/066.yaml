  - 단 사람들의
  lexicon: HALOT
  rationale: ‘sons of Dan’의 족속 표현을 그대로 살리되 한국어에서는 소유격으로 자연스럽게 연결했습니다.
- source_word: אֲחִיעֶזֶר
  english_pob_choice: Ahiezer
  chosen_korean: 아히에셀
  alternatives_korean:
