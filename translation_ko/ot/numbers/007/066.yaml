  lexicon: 표준 외래어 표기
  rationale: 고유명사는 현대 한국어 음역으로 옮겼습니다.
- source_word: עַמִּישַׁדָּי
  english_pob_choice: Ammishaddai
  chosen_korean: 암미삿대
  alternatives_korean:
