revisions:
- from: 그의 제물은 은 쟁반 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 두 그릇 모두 기름에 섞은 고운 가루로 채워져 있었으니, 그것은 소제였습니다.
  to: 그의 제물은 은 쟁반[a] 하나로, 무게는 성소의 세겔[c] 기준으로 백삼십 세겔이었습니다. 또 은 대접[b] 하나는 칠십 세겔이었습니다. 두 그릇은 기름에 섞은 고운 가루로 가득 차 있었으며, 소제를 위한 것이었습니다.
  rationale: 성소의 표준 세겔이라는 필수 중량 규정을 본문에 복원하고, לְמִנְחָה의 목적 용법을 ‘소제를 위한’으로 반영했습니다. 용기 명칭의 어휘적 불확실성은 본문을 과도하게 넓히지 않고 각주로 보존했습니다.
