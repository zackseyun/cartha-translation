id: NUM.7.37
reference: Numbers 7:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (Hebrew קַעֲרָה), a vessel term that may refer more broadly to a shallow bowl or dish.
    reason: lexical_alternative
  - marker: b
    text: Or 'sprinkling bowl' for 'basin' (Hebrew מִזְרָק), reflecting the vessel's cultic use in other contexts.
    reason: lexical_alternative
  - marker: c
    text: '''By the shekel of the sanctuary'' means according to the sanctuary''s standard weight.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 제물은 은 쟁반 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 두 그릇 모두 기름에 섞은 고운 가루로 채워져 있었으니, 그것은 소제였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 그의 제물
  alternatives_korean:
  - 그의 헌물
  - 그의 예물
  lexicon: HALOT
  rationale: 제사 문맥에서 קָרְבָּן은 하나님께 드리는 제물을 뜻하므로, 문맥을 살린 ‘제물’이 가장 직접적입니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 쟁반 하나
  alternatives_korean:
  - 은 접시 하나
  - 은 그릇 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 넓고 얕은 용기를 가리킬 수 있어, 제사 용기 맥락에서 ‘쟁반’이 형태를 비교적 잘 드러냅니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 분향 대접 하나
  - 은 물대야 하나
  lexicon: HALOT
  rationale: מִזְרָק은 제의용 그릇이지만 여기서는 무게가 제시된 물품 목록이므로, 기능을 과도하게 특정하지 않는 ‘대접’이 무난합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the shekel of the sanctuary
  chosen_korean: 성소의 세겔로
  alternatives_korean:
  - 성전 세겔로
  - 성소 기준의 세겔로
  lexicon: HALOT
  rationale: 직역하면 ‘성소의 세겔로’이며, 기준 추를 가리키는 표현이므로 중량 표준을 자연스럽게 드러냈습니다.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  english_pob_choice: fine flour mixed with oil
  chosen_korean: 기름에 섞은 고운 가루
  alternatives_korean:
  - 기름과 섞은 고운 가루
  - 기름에 버무린 고운 가루
  lexicon: HALOT
  rationale: 소제 재료인 סֹלֶת은 제의용 ‘고운 가루’이고, בְּלוּלָה는 ‘섞인’ 상태를 나타내므로 자연스러운 한국어로 옮겼습니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제였습니다
  alternatives_korean:
  - 곡식 제사였습니다
  - 곡식 제물이었습니다
  lexicon: HALOT
  rationale: מִנְחָה는 제사 문맥에서 통상 ‘소제’로 알려진 곡식 제물을 가리키므로, 제의 용어를 살려 번역했습니다.
theological_decisions:
- issue: 제사 용어의 번역
  chosen_reading: מִנְחָה를 ‘소제’로 옮겨 제의적 기능과 전통적 용례를 함께 보존했습니다.
  alternative_readings:
  - 곡식 제물
  - 곡식 제사
  rationale: 이 구절은 단순한 음식 재료가 아니라 성막 봉헌의 제의 항목이므로, 용어의 제의성을 분명히 하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성막 봉헌과 제사 규례(민수기 7장)
