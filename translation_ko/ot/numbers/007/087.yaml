id: NUM.7.87
reference: Numbers 7:87
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
  footnotes:
  - marker: a
    text: Or "for a purification offering." The Hebrew term חַטָּאת can emphasize purification from impurity as well as sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 번제를 위한 가축의 총수는 수송아지 열둘, 숫양 열둘, 한 살 된 어린양 열둘이었고, 그에 딸린 소제가 있었으며, 속죄제를 위한[a] 숫염소는 열둘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정결제를 위한”이라고 옮길 수 있습니다. 히브리어 חַטָּאת은 죄와 관련된 속죄뿐 아니라 부정으로부터의 정결을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  english_pob_choice: All the cattle
  chosen_korean: 모든 가축
  alternatives_korean:
  - 모든 소
  - 모든 큰짐승
  lexicon: HALOT
  rationale: 제사 목록의 총합을 가리키는 집합적 표현이므로, 문맥상 자연스러운 현대 한국어로 ‘가축’을 택했습니다. 이어지는 פָּרִים이 구체적으로 수송아지를 밝히므로 의미가 겹치지 않습니다.
- source_word: לָעֹלָה
  english_pob_choice: for the burnt offering
  chosen_korean: 번제에 쓸
  alternatives_korean:
  - 번제를 위한
  - 번제로 드릴
  lexicon: HALOT
  rationale: לְ/לָ의 목적 용법을 살려 제의 목록체에 맞게 ‘-에 쓸’로 옮겼습니다.
- source_word: פָּרִים
  english_pob_choice: bulls
  chosen_korean: 수송아지
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 제사 규정의 제물 목록에서는 פָּרִים을 연령이 드러나는 제의적 맥락에 맞게 ‘수송아지’로 옮기는 편이 더 분명합니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: one-year-old lambs
  chosen_korean: 일 년 된 어린양
  alternatives_korean:
  - 한 살 된 어린양
  - 한 해 된 양
  lexicon: HALOT
  rationale: 나이를 표시하는 בְּנֵי שָׁנָה를 자연스러운 한국어로 풀어, 제물의 연령 조건이 드러나도록 했습니다.
- source_word: וּמִנְחָתָם
  english_pob_choice: and their grain offering
  chosen_korean: 그 소제와 함께하고
  alternatives_korean:
  - 그 곡식제와 함께하고
  - 그 소제도
  lexicon: HALOT
  rationale: 성막 제사 문맥의 מִנְחָה는 관용적으로 ‘소제’가 적확하며, 3인칭 복수 소유격은 앞의 번제 제물 전체를 가리키는 것으로 이해했습니다.
- source_word: וּשְׂעִירֵי עִזִּים
  english_pob_choice: and male goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 수염소
  - 염소 수컷
  lexicon: HALOT
  rationale: שְׂעִירֵי עִזִּים은 수컷 염소를 뜻하므로, 한국어 제의 용어로 가장 간결한 ‘숫염소’를 사용했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제에 쓸
  alternatives_korean:
  - 속죄제용
  - 죄를 위한
  lexicon: HALOT
  rationale: 제사제도에서 חַטָּאת은 단순히 ‘죄’보다 제의적 기능이 핵심이므로, 의미를 넓게 드러내는 ‘속죄제’를 채택했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 뉘앙스
  chosen_reading: ‘속죄제’로 번역해 죄 문제와 정결/정화 기능을 함께 염두에 두었습니다.
  alternative_readings:
  - ‘죄제’
  - ‘정결제’
  rationale: 이 절은 제물의 수량을 열거하는 제의 목록이므로, 한국어 독자에게 가장 익숙하면서도 기능을 충분히 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
