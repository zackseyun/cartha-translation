revisions:
- from: 번제에 쓸 모든 가축은 열두 수송아지, 열두 숫양, 열두 일 년 된 어린양이며, 그 소제와 함께하고, 속죄제에 쓸 숫염소도 열둘이었습니다.[a]
  to: 번제를 위한 가축의 총수는 수송아지 열둘, 숫양 열둘, 한 살 된 어린양 열둘이었고, 그에 딸린 소제가 있었으며, 속죄제를 위한[a] 숫염소는 열둘이었습니다.
  rationale: 번제용 가축의 총계를 먼저 밝힌 뒤, 그에 수반되는 소제와 별도의 속죄제용 숫염소를 히브리어의 열거 구조에 따라 분명히 구분했습니다. 소제의 복수 소유 접미사는 ‘그에 딸린’으로 반영했으며, חַטָּאת의 해석상 대안은 해당 번역어에 직접 연결된 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:07Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 총계 서술은 번제용 가축(수송아지·숫양·일 년 된 어린양)과 그에 딸린 소제, 그리고 속죄제용 숫염소를 구분해 열거합니다. 초안은 동물 수량과 소제를 ‘이며/함께하고’로 연결하여 소제가 동물 목록의 일부인 것처럼 보이거나 문장 구조가 불완전하게 들립니다.
  naturalness: ‘그 소제와 함께하고’는 현대 표준 한국어 문장으로 자연스럽지 않으며, 무엇이 무엇과 함께하는지 불명확합니다. ‘그에 딸린 소제’로 소유·수반 관계를 드러내고 절을 나누면 자연스럽습니다.
  terminology: ‘번제’, ‘소제’, ‘속죄제’, ‘수송아지’, ‘숫양’, ‘숫염소’는 제의 문맥에 적절합니다. חַטָּאת의 정결 기능은 각주에서 대안으로 보존하는 것이 적절합니다.
  issues:
