id: NUM.7.84
reference: Numbers 7:84
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
  footnotes:
  - marker: a
    text: Or 'This is the dedication of the altar'; the Hebrew can be rendered more formally, but the context favors a retrospective summary of the offerings presented.
    reason: lexical_alternative
  - marker: b
    text: Or 'chiefs' or 'princes of Israel.' The Hebrew term refers to the recognized tribal leaders.
    reason: lexical_alternative
  - marker: c
    text: The vessel names may also be rendered 'silver plates,' 'silver basins,' and 'gold dishes/ladles,' depending on how one construes the specific cultic utensils.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 제단에 기름을 부은 날 이스라엘의 지도자들이 드린 제단 봉헌 예물입니다.[a] 은 접시 열둘, 은 대접 열둘, 금 국자 열둘입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제단 봉헌 예물’은 히브리어 ‘제단의 봉헌’을 이 문맥의 헌물 목록에 맞추어 옮긴 것입니다. 직역하면 ‘제단의 봉헌’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지도자들’은 히브리어 נְשִׂיאֵי יִשְׂרָאֵל을 옮긴 말입니다. 문맥상 이스라엘 각 지파의 공인된 대표자들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 기물 이름은 ‘은 접시, 은 대접, 금 국자’ 외에 ‘은 쟁반, 은 대야(또는 그릇), 금 접시·숟가락·국자’ 등으로도 옮길 수 있습니다. 히브리어 명칭의 정확한 형태는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  english_pob_choice: This was the dedication offering of the altar
  chosen_korean: 이것은 제단의 봉헌물입니다
  alternatives_korean:
  - 이것은 제단의 봉헌입니다
  - 이것은 제단의 봉헌 예물입니다
  lexicon: HALOT
  rationale: חֲנֻכַּת은 단순한 ‘봉헌’보다 봉헌 행위의 결과물/헌물까지 드러내므로, 문맥상 ‘봉헌물’이 헌납된 물품 목록을 예고하는 한국어로 가장 자연스럽습니다.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  english_pob_choice: on the day it was anointed
  chosen_korean: 그것이 기름부음을 받은 날에
  alternatives_korean:
  - 그것이 기름부음을 받을 때에
  - 그것이 기름부음된 날에
  lexicon: HALOT
  rationale: 제단을 가리키는 대명사를 살리면서, בְּיוֹם + 수동형의 시간 표현을 ‘...받은 날에’로 옮겨 사건 요약의 뉘앙스를 보존했습니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 족장들
  - 이스라엘의 군왕들
  lexicon: HALOT
  rationale: נָשִׂיא는 민수기에서 지파를 대표하는 공식 지도자를 가리키므로, 시대착오적 뉘앙스가 있는 ‘왕자들’보다 ‘지도자들’이 더 정확합니다.
- source_word: קַעֲרֹת כֶּסֶף / מִזְרְקֵי כֶסֶף / כַּפּוֹת זָהָב
  english_pob_choice: twelve silver dishes, twelve silver bowls, and twelve gold pans
  chosen_korean: 은 접시 열둘, 은 대접 열둘, 금 받침 열둘
  alternatives_korean:
  - 은 쟁반 열둘, 은 그릇 열둘, 금 숟가락 열둘
  - 은 접시 열둘, 은 대야 열둘, 금 주걱 열둘
  lexicon: HALOT
  rationale: 각 그릇 이름은 제의용 기물을 가리키므로, 현대 한국어에서 가장 무난한 ‘접시/대접/받침’으로 대응하되, 세 항목의 구별이 흐려지지 않게 번역했습니다.
theological_decisions:
- issue: 봉헌과 기름부음의 관계를 어떻게 정리할지
  chosen_reading: 제단의 봉헌을 설명하면서, 그 봉헌 시점이 ‘기름부음을 받은 날’임을 그대로 연결했습니다.
  alternative_readings:
  - 봉헌일을 따로 강조하는 읽기
  - 기름부음 자체를 봉헌으로 환원하는 읽기
  rationale: 본문은 제단 봉헌물의 목록을 제시하면서 그 시간표를 덧붙이므로, 봉헌과 기름부음의 관계를 분리하지 않고 문장 안에서 함께 보존하는 것이 가장 충실합니다.
  doctrine_reference: 제의적 봉헌과 성별의 서술을 구분해 보존하는 원문 존중 원칙
