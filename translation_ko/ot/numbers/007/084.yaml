  to: 이것은 제단에 기름을 부은 날 이스라엘의 지도자들이 드린 제단 봉헌 예물입니다.[a] 은 접시 열둘, 은 대접 열둘, 금 국자 열둘입니다.[b][c]
  rationale: 원문의 요약 문장과 수량 목록을 유지하면서, 지도자들이 예물을 드린 주체임을 명확히 했습니다. ‘금 받침’은 원문의 기물 의미와 어긋날 가능성이 커 ‘금 국자’로 고쳤으며, 형태상 남는 불확실성은 각주에서 보존했습니다. ‘봉헌 예물’은 문맥적 번역임을 각주에 밝혀 원문의 추상명사 ‘봉헌’과의 거리를 투명하게 처리했습니다.
