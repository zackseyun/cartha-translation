    rationale: ‘이스라엘의 지도자들에게서 나온 것이니’는 ‘나온 것’이 무엇인지 문법적으로 흐리며, 원문의 מֵאֵת가 나타내는 지도자들의 기증을 자연스럽게 전달하지 못합니다.
