  - 군주
  - 왕자
  rationale: נָשִׂיא는 왕권이 아니라 지파 대표 역할을 가리키므로, 한국어에서 오해를 부르는 전통적 귀족어휘는 피했습니다.
  doctrine_reference: 민수기 7장 문맥의 지파 대표 헌물 봉헌
