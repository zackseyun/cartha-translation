translation:
  language: ko
  text: 이렛날에는 에브라임 자손의 지도자[a]는 암미훗의 아들 엘리사마였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「에브라임 자손을 위한 지도자」. 히브리어 전치사 ל는 관계 또는 대표를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י
  english_pob_choice: On the seventh day
  chosen_korean: 이렛날에는
  alternatives_korean:
  - 일곱째 날에는
  - 제칠일에는
  lexicon: HALOT
  rationale: היום with 서수는 시간 부사구이므로, 현대 한국어에서 자연스럽고 정확한 「이렛날」을 택했습니다.
- source_word: נָשִׂ֖יא
  english_pob_choice: leader
  chosen_korean: 지도자는
  alternatives_korean:
  - 두목은
  - 족장은
  - 지파의 대표는
  lexicon: HALOT
  rationale: 민수기 7장의 נָשִׂיא는 제의적 헌물을 대표해 나아오는 지파 수장을 가리키므로, 직역적이면서도 현대적인 「지도자」가 가장 무난합니다.
- source_word: לִ/בְנֵ֣י אֶפְרָ֑יִם
  english_pob_choice: of the sons of Ephraim
  chosen_korean: 에브라임 자손의
  alternatives_korean:
  - 에브라임의
  - 에브라임 사람들의
  - 에브라임 자손을 위한
  lexicon: HALOT
  rationale: ל은 כאן에서 소유가 아니라 관계/대표를 나타내므로, 히브리어의 혈통 표현을 살려 「에브라임 자손의」로 옮겼습니다.
- source_word: אֱלִישָׁמָע
  english_pob_choice: Elishama
  chosen_korean: 엘리사마
  alternatives_korean:
  - 엘리샤마
  - 엘리쉬마
  lexicon: 표준 외래어 표기법
  rationale: 고유명사는 통용되는 성경 인명 표기를 따랐습니다.
- source_word: בֶּן עַמִּיהוּד
  english_pob_choice: son of Ammihud
  chosen_korean: 암미훗의 아들
  alternatives_korean:
  - 암미훗의 아들인
  - 암미훗의 아들
  lexicon: HALOT
  rationale: 히브리어 족보식 בֶּן 구조를 한국어의 일반적인 속격 표현으로 옮겨 계보 정보를 분명히 했습니다.
theological_decisions:
- issue: 지파 대표 명칭의 위상
  chosen_reading: 「지도자」로 번역해 신분을 과장하지 않고, 동시에 공식적 대표성을 드러냈습니다.
  alternative_readings:
  - 족장
  - 군주
  - 왕자
  rationale: נָשִׂיא는 왕권이 아니라 지파 대표 역할을 가리키므로, 한국어에서 오해를 부르는 전통적 귀족어휘는 피했습니다.
  doctrine_reference: 민수기 7장 문맥의 지파 대표 헌물 봉헌
