base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
  footnotes:
  - marker: a
    text: Or 'the two wagons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the four oxen.' The Hebrew uses a collective term for bovine animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그르손 자손들에게 두 수레와 네 마리의 소를 그들의 직무에 따라 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 마차들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 황소들’. 히브리어는 소류를 가리키는 집합 명사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  english_pob_choice: carts
  chosen_korean: 수레
  alternatives_korean:
  - 마차
  - 왜건
  lexicon: HALOT
  rationale: עֲגָלָה는 운송용 수레/마차를 가리키므로, 자연스러운 현대어인 ‘수레’로 옮겼습니다. 영어 POB의 ‘carts’와도 잘 맞습니다.
- source_word: הַבָּקָר
  english_pob_choice: cattle
  chosen_korean: 네 마리의 소
  alternatives_korean:
  - 네 마리의 가축
  - 네 마리의 황소
  - 네 마리의 소떼
  lexicon: HALOT
  rationale: בָּקָר은 집합적으로 소류를 가리키지만, 이 문맥에서는 수레에 연결된 역축을 뜻하므로 한국어에서는 자연스럽게 ‘소’로 풀어 썼습니다. 개수 표현을 위해 ‘네 마리의’도 함께 반영했습니다.
- source_word: לִבְנֵי גֵרְשׁוֹן
  english_pob_choice: to the sons of Gershon
  chosen_korean: 그르손 자손들에게
  alternatives_korean:
  - 게르손의 아들들에게
  - 그르손 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘그르손 자손들’을 유지하되, 한국어 성경 문맥에서 자연스럽게 여격으로 처리했습니다. ‘자손들’은 족속 표지를 보존합니다.
- source_word: כְּפִי עֲבֹדָתָם
  english_pob_choice: according to their service
  chosen_korean: 그들의 직무에 따라
  alternatives_korean:
  - 그들의 섬김에 따라
  - 그들의 일에 따라
  lexicon: HALOT
  rationale: עֲבֹדָה는 단순한 일반 노동보다 성막 봉사로 배정된 직무의 뉘앙스가 강하므로, ‘직무’로 옮겨 문맥을 살렸습니다.
theological_decisions:
- issue: 레위인 조편에 대한 분배 표현
  chosen_reading: ‘주었습니다’로 번역해 물품이 배정되었음을 평이하게 드러내고, 본문의 분배 질서를 유지했습니다.
  alternative_readings:
  - ‘할당했습니다’
  - ‘맡겼습니다’
  rationale: נָתַן의 기본 의미는 ‘주다’이므로, 과도한 행정 용어보다 본문이 말하는 단순한 수여를 직접적으로 반영하는 것이 더 적절합니다.
  doctrine_reference: 본문의 서술적 배분 표현
