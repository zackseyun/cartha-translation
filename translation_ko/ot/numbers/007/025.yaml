reference: Numbers 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'one silver dish' for 'one silver plate.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one silver bowl' for 'one silver basin.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'by the shekel of the sanctuary,' that is, according to the sanctuary standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 그의 예물은 은 접시 하나였는데, 그 무게는 백삼십 세겔이었고, 은 대접 하나는 칠십 세겔이었으며, 성소의 세겔 기준에 따른 것이었습니다. 두 그릇에는 모두 고운 가루를 기름에 섞은 소제물이 가득 들어 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은 접시’ 대신 ‘은 그릇’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘은 대접’ 대신 ‘은 그릇’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘성소의 세겔에 따라’라는 뜻으로, 성소 표준 무게를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 헌물은
  lexicon: HALOT
  rationale: 제사 문맥의 קָרְבָּן은 하나님께 드리는 예물을 가리키므로, 자연스러운 문장 흐름을 살리면서도 제의적 의미를 보존하는 ‘예물’이 적절합니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 쟁반 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 얕은 제의용 용기를 가리키므로, POB의 ‘plate’에 맞추어 ‘접시’로 옮기되 제물 담는 그릇의 성격을 유지했습니다.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  english_pob_choice: one silver basin
  chosen_korean: 은 대접 하나
  alternatives_korean:
  - 은 그릇 하나
  - 은 바리 하나
  lexicon: HALOT
  rationale: מִזְרָק은 뿌리거나 제의에 쓰는 용기이므로, 일상적 ‘그릇’보다 예배 맥락이 드러나는 ‘대접’이 적합합니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔 기준에 따른 것이었습니다
  alternatives_korean:
  - 성소의 세겔에 따른 것이었습니다
  - 성소 세겔 기준으로 재었습니다
  lexicon: HALOT
  rationale: 이 표현은 무게 단위의 표준을 뜻하므로, 단순히 ‘세겔’로 끝내기보다 기준/규격 의미를 드러내는 문장으로 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식 제물
  - 곡식 소제
  lexicon: HALOT
  rationale: 민수기 제의 목록의 맥락에서는 מִנְחָה가 곡물로 드리는 제사를 가리키므로, 한국어 성서 전통에서 널리 쓰이는 ‘소제물’을 사용했습니다.
theological_decisions:
- issue: 제의 목록의 건조한 열거를 한국어에서 어떻게 살릴 것인가
  chosen_reading: 제물의 종류와 무게, 그리고 성소 기준을 차례대로 나열하는 회계식 문장 구조를 유지했습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘그는 은 접시와 대접을 드렸습니다’처럼 정리하는 방식
  rationale: 본문은 찬양이나 해설이 아니라 성물 목록을 기록하는 문맥이므로, 정보의 순서를 바꾸지 않고 제의적 정확성을 유지하는 것이 더 충실합니다.
  doctrine_reference: 제의 본문 일반 원칙
- issue: מִנְחָה의 번역을 일반 ‘제물’로 뭉개지 않을 것인가
  chosen_reading: ‘소제물’로 옮겨 곡물 제사의 특수성을 분명히 했습니다.
  alternative_readings:
  - 일반적인 ‘제물’
  - ‘곡식 제물’
  rationale: 이 단어는 단순한 헌물보다 곡물 제사의 전문용어이므로, 문맥적·제의적 구별을 보존하는 번역이 필요합니다.
  doctrine_reference: 레위기·민수기 제사 용어의 구별
