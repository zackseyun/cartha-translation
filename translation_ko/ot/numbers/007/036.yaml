  lexicon: BDB/HALOT
  rationale: 히브리어의 시간 부사구를 자연스러운 현대 한국어로 옮기되, 본문에 없는 추가어를 넣지 않기 위해 간결하게 처리했습니다.
- source_word: נָשִׂ֖יא
