  lexicon: SBL transliteration policy / established Korean transliteration
  rationale: 인명은 음역 원칙에 따라 표기했고, 한국어 외래어 표기에서 자연스러운 형태를 택했습니다.
- source_word: בֶּן צוּרִישַׁדָּי
  english_pob_choice: son of Zurishaddai
