  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the leader of the sons of Asher.'' This refers to the tribal chief representing Asher.'
    reason: lexical_alternative
translation:
  language: ko
  text: 열한째 날에, 아셀 자손의 지도자[a]는 오그란의 아들 바기엘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아셀 자손의 지도자’는 아셀 지파를 대표하는 지도자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם / עַשְׁתֵּי עָשָׂר
  english_pob_choice: On the eleventh day
  chosen_korean: 열한째 날에
  alternatives_korean:
  - 열한째 날
  - 열하루째에
  lexicon: HALOT
  rationale: 히브리어의 절기·헌납 서술 공식에서 수사와 ‘날’의 결합을 한국어 자연어에 맞게 순서수로 옮겼습니다. 영어 POB의 ‘eleventh day’와 같은 기능을 유지하면서도 현대 한국어 문장 흐름에 맞춥니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 지도자
  - 족장
  - 우두머리
  lexicon: HALOT
  rationale: 지파를 대표하는 נָשִׂיא의 기능을 드러내기 위해 ‘지도자’를 택했습니다. ‘족장’은 전통적이지만 현대 독자에게는 혈통적·가부장적 뉘앙스가 강할 수 있어 피했습니다.
- source_word: לִ/בְנֵ֣י אָשֵׁ֑ר
  english_pob_choice: of the sons of Asher
  chosen_korean: 아셀 자손의
  alternatives_korean:
  - 아셀의 자손인
  - 아셀 지파의
  lexicon: HALOT
  rationale: ‘sons of Asher’라는 히브리어 친족·지파 표현을 한국어 성경 관용에 가깝게 ‘아셀 자손’으로 살렸습니다. 단순히 ‘아셀의’로 줄이면 지파 대표성의 표시가 약해집니다.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  english_pob_choice: Pagiel son of Ocran
  chosen_korean: 오그란의 아들 파기엘
  alternatives_korean:
  - 파기엘, 오그란의 아들
  - 오크란의 아들 파기엘
  lexicon: HALOT
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역하되, בן은 한국어 서술에서 자연스러운 ‘~의 아들’로 옮겼습니다. ‘Ocran’은 오그란으로 표기해 현행 음가에 맞췄습니다.
theological_decisions:
- issue: 지파 대표를 가리키는 נָשִׂיא의 지위 표현
  chosen_reading: ‘지도자’로 번역해 왕족처럼 오해될 수 있는 의미를 피하고, 지파 대표라는 서술 기능을 살렸습니다.
  alternative_readings:
  - 족장
  - 왕자
  rationale: 민수기 7장의 문맥은 왕권이 아니라 제의적 헌납을 위해 각 지파가 대표를 내세우는 상황입니다. 따라서 위계는 유지하되 군주적 뉘앙스는 배제하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 7장 지파 대표 제도
