    rationale: נָשִׂיא 자체는 ‘지도자’로 번역하는 것이 적절하지만, 이 장면에서는 부족의 지도자라는 문맥적 이해도 가능하므로 대안을 각주에 보존하는 편이 감사 기록과 부합합니다.
