base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
  footnotes:
  - marker: a
    text: Or 'one tribal leader per day.' The Hebrew repeats 'one leader, one day' for emphasis on the ordered sequence of offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “지도자 한 명이 하루씩, 지도자 한 명이 하루씩 제단 봉헌을 위해 그들의 예물을 바칠 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하루에 부족 지도자 한 명씩’. 히브리어는 ‘한 지도자, 하루에’를 반복하여, 예물이 정해진 순서에 따라 드려짐을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HOLY_NAME/YHWH
  rationale: 영어 POB가 신명기 이름을 ‘Yahweh’로 옮긴 점을 따라, 한국어 본문도 경칭 тит틀이 아니라 고유한 신명으로서 ‘야훼’를 사용했습니다.
- source_word: נָשִׂיא אֶחָד לַיּוֹם נָשִׂיא אֶחָד לַיּוֹם
  english_pob_choice: One leader each day, one leader each day
  chosen_korean: 한 지도자씩, 하루에 한 지도자씩
  alternatives_korean:
  - 하루에 한 지도자씩
  - 한 부족 지도자씩, 하루에 한 명씩
  lexicon: HALOT
  rationale: 반복 구조를 그대로 살리면서도 한국어에서 자연스럽게 들리도록 ‘한 지도자씩’과 ‘하루에 한 지도자씩’으로 옮겨, 순차성과 강조를 모두 드러냈습니다.
- source_word: יַקְרִיבוּ אֶת קָרְבָּנָם
  english_pob_choice: they shall present their offering
  chosen_korean: 그들이 제단의 봉헌을 위한 자기의 예물을 드릴 것입니다
  alternatives_korean:
  - 그들이 자기의 예물을 드릴 것입니다
  - 그들이 예물을 바칠 것입니다
  lexicon: HALOT
  rationale: קרב의 제의적 용법을 따라 단순한 ‘주다’보다 예물을 하나님께 가까이 드리는 뜻을 살렸고, ‘자기의 예물’로 소유격을 분명히 했습니다.
- source_word: לַחֲנֻכַּת הַמִּזְבֵּחַ
  english_pob_choice: for the dedication of the altar
  chosen_korean: 제단의 봉헌을 위한
  alternatives_korean:
  - 제단의 헌납을 위한
  - 제단 봉헌을 위하여
  lexicon: HALOT
  rationale: חנכה를 예식적 맥락에 맞게 ‘봉헌’으로 옮겨 제단을 하나님께 구별하여 바치는 헌정의 의미를 보존했습니다.
theological_decisions:
- issue: 반복 표현의 기능
  chosen_reading: ‘한 지도자씩, 하루에 한 지도자씩’으로 반복을 그대로 반영해, 순서가 정해진 분배와 강조의 효과를 드러냈습니다.
  alternative_readings:
  - ‘하루에 한 지도자씩’처럼 한 번만 옮김
  - ‘각 부족 지도자 한 명씩’으로 의미만 요약
  rationale: 히브리어는 동일한 표현을 두 번 반복해 질서 정연한 순차 배정을 강조하므로, 이를 축약하지 않고 본문 효과를 보존하는 것이 적절합니다.
  doctrine_reference: Narrative emphasis in Hebrew repetition
