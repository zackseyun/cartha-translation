id: NUM.7.10
reference: Numbers 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
  footnotes:
  - marker: a
    text: Or, more literally, 'the dedication of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제단이 기름 부음을 받은 날, 지도자들은 제단의 봉헌물을 바쳤고[a], 지도자들은 자기들의 예물을 제단 앞에 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘제단의 봉헌’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  english_pob_choice: presented
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 드렸습니다
  - 가져왔습니다
  - 제시했습니다
  lexicon: HALOT
  rationale: 제의적 문맥에서 קרב의 사역형은 헌물을 하나님 앞에 가져와 드리는 뜻이므로, 현대 한국어에서는 자연스럽고 예배적 뉘앙스를 살리는 ‘바치다’가 적절합니다.
- source_word: הַנְּשִׂאִים
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 수령들
  - 족장들
  - 우두머리들
  lexicon: HALOT
  rationale: 민수기의 지파 대표들을 가리키므로 현대 독자가 즉시 이해할 수 있는 ‘지도자들’이 가장 분명합니다.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  english_pob_choice: the dedication offering for the altar
  chosen_korean: 제단의 봉헌물
  alternatives_korean:
  - 제단의 봉헌
  - 제단 봉헌 예물
  - 제단의 헌납물
  lexicon: HALOT
  rationale: חֲנֻכָּה는 ‘봉헌/헌당’의 뜻이지만, 여기서는 지도자들이 가져온 실제 예물을 가리키므로 ‘봉헌물’로 옮겨 제의적 기능을 드러냈습니다.
- source_word: הִמָּשַׁח
  english_pob_choice: on the day it was anointed
  chosen_korean: 기름 부음을 받던 날에
  alternatives_korean:
  - 기름 부음을 받은 날에
  - 그것이 기름 부음 받은 날에
  - 그가 그것에 기름을 부은 날에
  lexicon: HALOT
  rationale: מָשַׁח의 수동적 시간 표현을 살려 제단이 성별되는 사건을 자연스럽게 드러내되, 제의적 ‘기름 부음’ 표현을 유지했습니다.
- source_word: קָרְבָּנָם
  english_pob_choice: their offering
  chosen_korean: 자기들의 예물
  alternatives_korean:
  - 자기들의 제물
  - 자기들의 헌물
  - 그들의 제사
  lexicon: HALOT
  rationale: 앞절과 병행되는 일반적 헌물 표현으로, 제의적 뉘앙스를 유지하면서도 한국어에서 반복이 어색하지 않은 ‘예물’을 선택했습니다.
theological_decisions:
- issue: 제단 봉헌과 기름 부음의 관계를 어떻게 표현할지
  chosen_reading: 봉헌물과 기름 부음이 같은 성별 의식의 두 측면임을 드러내되, 번역에서 이를 과도하게 해설하지는 않았습니다.
  alternative_readings:
  - ‘제단의 봉헌’을 중심으로 더 직역
  - ‘제단의 헌당식’처럼 사건 중심으로 의역
  rationale: 원문은 헌물과 기름 부음을 병렬로 제시하므로, 본문에는 이를 그대로 두고 의미를 과장하지 않는 것이 가장 충실합니다.
  doctrine_reference: 민수기 7장의 성막 봉헌 서술
- issue: 앞뒤의 반복된 ‘바쳤다’ 동사 처리
  chosen_reading: 두 번의 וַיַּקְרִיבוּ를 모두 ‘바쳤습니다’로 유지했습니다.
  alternative_readings:
  - 첫 번째만 ‘바쳤습니다’, 두 번째는 ‘드렸습니다’
  - 둘째 동사를 ‘제시했습니다’로 완화
  rationale: 히브리어 반복을 통해 강조되는 제의적 행위를 한국어에서도 그대로 보존하는 편이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: 서술 반복을 통한 강조라는 히브리어 수사
