  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), a shallow silver vessel used in the sanctuary inventory.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the sanctuary shekel.' The Hebrew specifies the sacred standard of weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 예물은 은 접시 하나[a], 곧 무게가 백삼십 세겔인 것과 은 대야 하나, 곧 무게가 칠십 세겔인 것이었습니다. 이 둘은 성소의 세겔에 따른 것이며[b], 둘 다 소제를 위한, 기름을 섞은 고운 가루로 가득 차 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얕은 그릇’. 히브리어 קַעֲרָה는 성소 기물 목록에서 얕은 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소 세겔 기준으로’. 히브리어는 성소의 표준 중량을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 봉헌물은
  lexicon: HALOT
  rationale: קָרְבָּן은 성막 문맥의 예물/제물로, 한국어에서는 문맥의 제의성을 살리되 자연스러운 ‘예물’이 가장 무난합니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
