revisions:
- from: 그의 예물은 은 접시 하나였는데, 무게는 백삼십 세겔이었고, 은 대야 하나는 칠십 세겔이었으며, 둘 다 성소의 세겔에 따라 정한 무게였습니다. 둘 다 고운 가루에 기름을 섞은 소제였습니다.[a][b]
  to: 그의 예물은 은 접시 하나[a], 곧 무게가 백삼십 세겔인 것과 은 대야 하나, 곧 무게가 칠십 세겔인 것이었습니다. 이 둘은 성소의 세겔에 따른 것이며[b], 둘 다 소제를 위한, 기름을 섞은 고운 가루로 가득 차 있었습니다.
  rationale: 두 용기의 중량과 성소 세겔이라는 측정 기준을 원문의 목록식 구조에 맞춰 연결했습니다. 특히 ‘가득 차 있었습니다’를 복원하여 두 그릇의 내용물을 정확히 표현하고, ‘소제’를 그 내용물의 제의적 용도와 연결했습니다. 각주 표지는 각각 קַעֲרָה와 성소 세겔 구절에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:03Z'
