  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
  footnotes:
  - marker: a
    text: Or 'dish' for 'plate' (קַעֲרָה), a shallow silver vessel used in the sanctuary inventory.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the sanctuary shekel.' The Hebrew specifies the sacred standard of weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 예물은 은 접시 하나였는데, 무게는 백삼십 세겔이었고, 은 대야 하나는 칠십 세겔이었으며, 둘 다 성소의 세겔에 따라 정한 무게였습니다. 둘 다 고운 가루에 기름을 섞은 소제였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘접시’가 아니라 ‘얕은 그릇’으로 볼 수 있습니다. 히브리어 קַעֲרָה는 성소 기물 목록에서 얕은 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소의 세겔에 따라’로 옮길 수 있습니다. 히브리어는 성소의 표준 중량을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  english_pob_choice: His offering was
  chosen_korean: 그의 예물은
  alternatives_korean:
  - 그의 제물은
  - 그의 봉헌물은
  lexicon: HALOT
  rationale: קָרְבָּן은 성막 문맥의 예물/제물로, 한국어에서는 문맥의 제의성을 살리되 자연스러운 ‘예물’이 가장 무난합니다.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  english_pob_choice: one silver plate
  chosen_korean: 은 접시 하나
  alternatives_korean:
  - 은 쟁반 하나
  - 은 그릇 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 성소 기물 목록에서 얕은 용기를 가리키므로, ‘접시’가 POB의 ‘plate’와 가장 가깝고 문맥에도 맞습니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 무게는 백삼십 세겔이었고
  alternatives_korean:
  - 무게가 백삼십 세겔이었고
  - 그 무게는 백삼십 세겔이었고
  lexicon: HALOT
  rationale: 히브리어의 명사구식 표기를 한국어에서는 ‘무게는 …이었고’로 풀어 주어 목록형 서술을 유지했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔에 따라 정한 무게
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소 세겔 기준으로
  lexicon: HALOT
  rationale: 기준 중량을 뜻하므로 단순한 소속표현보다 ‘…에 따라 정한 무게’가 의미를 더 분명히 드러냅니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식 제물
  - 곡식 제사
  lexicon: HALOT
  rationale: 레위기·민수기 제의 용어로는 전통적으로 ‘소제’가 가장 정확하여, POB의 ‘grain offering’을 한국어 성경 관습과 연결해 옮겼습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 성격 보존
  chosen_reading: ‘소제’로 번역해 성막 봉헌물의 제의적 용어를 유지했습니다.
  alternative_readings:
  - 일반적인 ‘예물’로 완화
  - ‘곡식 제물’로 설명적으로 번역
  rationale: 이 절은 단순한 선물이 아니라 제단 봉헌 목록이므로, 제의적 범주를 흐리지 않는 것이 본문의 기능을 더 잘 반영합니다.
  doctrine_reference: 민수기 7장 봉헌 목록의 제사 규정 맥락
