  - 은 그릇 하나
  lexicon: HALOT
  rationale: קַעֲרָה는 성소 기물 목록에서 얕은 용기를 가리키므로, ‘접시’가 POB의 ‘plate’와 가장 가깝고 문맥에도 맞습니다.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  english_pob_choice: its weight one hundred thirty shekels
  chosen_korean: 무게는 백삼십 세겔이었고
  alternatives_korean:
  - 무게가 백삼십 세겔이었고
  - 그 무게는 백삼십 세겔이었고
  lexicon: HALOT
  rationale: 히브리어의 명사구식 표기를 한국어에서는 ‘무게는 …이었고’로 풀어 주어 목록형 서술을 유지했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the shekel of the sanctuary
  chosen_korean: 성소의 세겔에 따라 정한 무게
  alternatives_korean:
  - 성소의 세겔에 따라
  - 성소 세겔 기준으로
  lexicon: HALOT
  rationale: 기준 중량을 뜻하므로 단순한 소속표현보다 ‘…에 따라 정한 무게’가 의미를 더 분명히 드러냅니다.
- source_word: לְמִנְחָה
  english_pob_choice: for a grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식 제물
  - 곡식 제사
  lexicon: HALOT
  rationale: 레위기·민수기 제의 용어로는 전통적으로 ‘소제’가 가장 정확하여, POB의 ‘grain offering’을 한국어 성경 관습과 연결해 옮겼습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 성격 보존
  chosen_reading: ‘소제’로 번역해 성막 봉헌물의 제의적 용어를 유지했습니다.
  alternative_readings:
  - 일반적인 ‘예물’로 완화
  - ‘곡식 제물’로 설명적으로 번역
  rationale: 이 절은 단순한 선물이 아니라 제단 봉헌 목록이므로, 제의적 범주를 흐리지 않는 것이 본문의 기능을 더 잘 반영합니다.
  doctrine_reference: 민수기 7장 봉헌 목록의 제사 규정 맥락
