base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beside the Jordan opposite Jericho.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 모세와 제사장 엘르아살이 계수한 자들이니, 그들이 모압 평지에서 여리고 맞은편 요단 가에서 이스라엘의 아들들을 계수하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘여리고 맞은편 요단 강가에서’.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּקוּדֵי
  english_pob_choice: those counted
  chosen_korean: 계수한 자들
  alternatives_korean:
  - 등록된 자들
  - 번호가 매겨진 자들
  - 인구조사의 대상
  lexicon: HALOT
  rationale: 인구조사 문맥의 פְּקוּדֵי를 사람을 가리키는 표현으로 살리면서도, 한국어에서 자연스러운 ‘계수한 자들’로 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 대제사장
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘제사장’이라고 하므로, 문맥상 중요해 보이더라도 ‘대제사장’을 덧붙이지 않았습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 성별이 드러나는 복합어를 평탄화하지 않고 직역 성격을 살려 ‘이스라엘의 아들들’로 옮겼습니다.
- source_word: בְּעַרְבֹת מוֹאָב עַל יַרְדֵּן יְרֵחוֹ
  english_pob_choice: in the plains of Moab by the Jordan at Jericho
  chosen_korean: 모압 평지에서 여리고 맞은편 요단 가
  alternatives_korean:
  - 모압의 평지에서 여리고 맞은편 요단 강가
  - 모압 평원에서 여리고 건너편 요단가
  lexicon: HALOT
  rationale: 지리 표현을 간결하게 살리되, ‘עַל יַרְדֵּן יְרֵחוֹ’의 위치 관계는 ‘여리고 맞은편 요단 가’로 드러냈습니다.
theological_decisions:
- issue: 이스라엘 집합체를 가리키는 בְּנֵי יִשְׂרָאֵל의 성별 표지
  chosen_reading: 이스라엘의 아들들
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 자손
  - 이스라엘 백성
  rationale: 문법적 형태와 족보적 표현을 유지해 본문이 가진 남성 복수 표지를 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: 엘르아살의 직함
  chosen_reading: 제사장
  alternative_readings:
  - 대제사장
  rationale: 본문이 실제로 말하는 직함을 넘어서지 않기 위해, 기능상 추정되는 상위 직함을 추가하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
