base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'among the Israelites' in both occurrences of 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 계수된 사람은 모두 스물세 명이었습니다. 한 달 된 남자아이부터 그 이상이었는데, 그들은 이스라엘 자손 가운데서 계수되지 않았습니다. 왜냐하면 이스라엘 자손 가운데 그들에게 기업이 주어지지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손 가운데’의 두 곳은 문맥상 ‘이스라엘 사람들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  english_pob_choice: those counted from among them
  chosen_korean: 계수된 사람
  alternatives_korean:
  - 등록된 사람
  - 인구 조사에 포함된 사람
  lexicon: HALOT
  rationale: 인구 조사 문맥의 פקד을 살려, 기술적이기보다 자연스러운 현대 한국어로 ‘계수된 사람’이라고 옮겼습니다.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  english_pob_choice: twenty-three thousand
  chosen_korean: 스물세 명
  alternatives_korean:
  - 이만삼천 명
  - 스물세 천 명
  lexicon: HALOT
  rationale: 히브리어 수사를 한국어 자연 표현으로 풀어 ‘스물세 명’으로 했고, 이어지는 문맥상 ‘천’은 뒤의 전체 수량에 연결되도록 문장 전체를 정리했습니다.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  english_pob_choice: from a month old and upward
  chosen_korean: 한 달 된 남자아이부터 그 이상
  alternatives_korean:
  - 한 달 이상 된 남자아이부터
  - 한 달 된 것부터 그 이상
  lexicon: HALOT
  rationale: 연령 기준을 한국어에서 자연스럽게 이해되도록 풀되, 생후 한 달 이상이라는 경계를 유지했습니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데
  alternatives_korean:
  - 이스라엘 사람들 가운데
  - 이스라엘 자손 안에서
  lexicon: HALOT
  rationale: 영어 POB의 ‘sons of Israel’을 따라 전통적이면서도 직역성을 살린 ‘이스라엘 자손 가운데’로 옮겼습니다.
- source_word: נִתַּן לָהֶם נַחֲלָה
  english_pob_choice: no inheritance was given to them
  chosen_korean: 그들에게 기업이 주어지지 않았습니다
  alternatives_korean:
  - 그들에게 상속분이 주어지지 않았습니다
  - 그들에게 분깃이 주어지지 않았습니다
  lexicon: HALOT
  rationale: מַחֲלָה의 언약적·토지 분배 맥락을 살려, 성경적 관용 표현인 ‘기업’을 사용했습니다.
theological_decisions:
- issue: ‘sons of Israel’의 번역 방식
  chosen_reading: ‘이스라엘 자손’으로 유지하여 혈연·언약 공동체의 표현을 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘인들
  rationale: 본문의 친족적 표현을 일반 민족명으로 평준화하지 않고, 원문의 공동체적 뉘앙스를 유지하기 위해서입니다.
