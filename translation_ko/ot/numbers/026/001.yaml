    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 여호와 대신 하나님의 고유명사인 야훼를 사용하여, 단순 호칭이 아니라 언약 이름이라는 점을 드러냈습니다.
