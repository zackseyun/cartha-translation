translation:
  language: ko
  text: 야훼께서 모세와 제사장 아론의 아들 엘르아살에게 말씀하여 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 '말했다'이지만, 뒤의 לֵאמֹר까지 자연스럽게 살리기 위해 '말씀하여 이르셨습니다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 여호와 대신 하나님의 고유명사인 야훼를 사용하여, 단순 호칭이 아니라 언약 이름이라는 점을 드러냈습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어의 발화 도입과 뒤따르는 לֵאמֹר을 함께 살리기 위해, 자연스러운 한국어로 '말씀하여 이르셨습니다'를 택했습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  - 사제
  lexicon: HALOT
  rationale: 아론을 수식하는 직함으로서의 의미를 그대로 살려, 한국어 성경 관용에 맞는 '제사장'을 사용했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 대체 칭호가 아니라 고유명사를 보존하는 것이 स्रोत의 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 발화 도입 공식의 한국어화
  chosen_reading: 말씀하여 이르셨습니다
  alternative_readings:
  - 말했습니다
  - 이르셨습니다
  rationale: 단순 서술보다 발화 개시 공식의 장엄함과 반복 구조를 함께 전달하기 위해 두 동작을 결합한 표현을 택했습니다.
  doctrine_reference: Korean style and source-form preservation
