  lexicon: HALOT
  rationale: פקד의 ‘계수하다/조사하다’ 뜻을 따라, 추상적인 ‘계수’가 아니라 이전 인구조사에 포함된 사람들을 가리키도록 ‘계수된 사람들 가운데’로 풀어 썼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
