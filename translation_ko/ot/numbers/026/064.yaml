  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
  footnotes:
  - marker: a
    text: Or 'And among these'; the conjunction can be rendered simply as 'and,' but here it likely carries a contrast with the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a traditional familial designation for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이들 가운데에는 모세와 제사장 아론이 시내 광야에서 이스라엘 자손을 계수할 때 계수된 사람들 가운데 한 사람도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이스라엘 자손’은 이스라엘을 가리키는 전통적인 가족적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그러나’는 앞절과의 대비를 드러내는 해석적 연결어입니다. 히브리어 접속사는 단순히 ‘그리고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
