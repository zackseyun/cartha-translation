  lexicon: HALOT
  rationale: 히브리어 관용구의 부정 존재를 자연스러운 합쇼체로 옮기되, 본문이 가리키는 ‘아무도 없음’의 힘을 살리기 위해 ‘한 사람도 없었습니다’로 표현했습니다.
- source_word: מִפְּקוּדֵי
  english_pob_choice: from those counted by
  chosen_korean: 계수된 사람들 가운데
  alternatives_korean:
  - 모세와 아론이 계수한 사람들 중
