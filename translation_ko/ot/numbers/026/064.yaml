  lexicon: HALOT
  rationale: 접속사와 전치사의 결합이 단순한 열거가 아니라 앞절과의 대비를 드러내므로, 한국어에서는 ‘그러나’로 그 대비를 분명히 했습니다.
- source_word: לֹא הָיָה אִישׁ
