  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
  footnotes:
  - marker: a
    text: Or, 'who were chosen men of the congregation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 엘리압의 아들들은 느무엘[a], 다단, 아비람입니다. 이들은 바로 그 다단과 아비람으로서, 회중에서 부름받은 자들인데, 고라의 무리 가운데서 모세와 아론에게 맞섰고, 그들이 야훼를 거슬러 맞설 때 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중에서 택함받은 사람들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  english_pob_choice: And the sons of Eliab
  chosen_korean: 그리고 엘리압의 아들들은
  alternatives_korean:
  - 그리고 엘리압의 자녀들은
  - 엘리압의 아들들은
  lexicon: WLC; genealogical listing convention
  rationale: 계보 목록에서는 בנים을 한국어의 ‘아들들’로 옮기는 것이 가장 직접적이며, 남성 후손을 특정하는 문맥도 잘 살립니다.
- source_word: קרואי הָעֵדָה
  english_pob_choice: the called ones of the congregation
  chosen_korean: 회중에서 부름받은 자들
  alternatives_korean:
  - 회중의 부름을 받은 자들
  - 회중의 택함을 받은 자들
  - 회중에서 불려진 자들
  lexicon: HALOT
  rationale: קרואי는 ‘불린/호명된’의 수동 분사이므로, 의미를 과도하게 해석하지 않으면서도 한국어로 자연스러운 ‘부름받은 자들’로 옮겼습니다.
- source_word: בַּעֲדַת קֹרַח
  english_pob_choice: in the company of Korah
  chosen_korean: 고라의 무리 가운데서
  alternatives_korean:
  - 고라의 회중 가운데서
  - 고라의 편에 서서
  - 고라의 무리에 속하여
  lexicon: HALOT
  rationale: ‘company’에 해당하는 문맥적 관계를 살리되, 한국어에서 ‘무리 가운데서’가 지나치게 제도적이거나 교회적 뉘앙스로 굳지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT; POB doctrinal default
  rationale: 본문의 신명사형 יְהוָה는 POB 기본 원칙에 따라 고유명사 ‘야훼’로 옮겨, 호칭으로 대체하지 않았습니다.
theological_decisions:
- issue: 고라 반역 서술에서 ‘야훼를 거슬러 맞섰다’의 강도
  chosen_reading: 모세와 아론에 대한 반항이 곧 야훼를 거슬러 맞선 행위로 귀결된다는 서술 구조를 그대로 살렸습니다.
  alternative_readings:
  - 야훼를 대적했다
  - 야훼께 반역했다
  rationale: 히브리어는 같은 동사를 반복해 인간 지도자에 대한 대항과 야훼에 대한 대항을 연결합니다. 이를 약화시키지 않기 위해 두 번째 절도 같은 동사군의 힘을 유지했습니다.
  doctrine_reference: POB translation philosophy §1, §3; source syntax in WLC
