revisions:
- from: 그리고 엘리압의 아들들은 느무엘[a], 다단, 아비람입니다. 이들은 바로 그 다단과 아비람으로서, 회중에서 부름받은 자들인데, 고라의 무리 가운데서 모세와 아론에게 맞섰고, 그들이 야훼를 거슬러 맞설 때 그러했습니다.
  to: 그리고 엘리압의 아들들은 느무엘, 다단, 아비람입니다. 이들이 곧 회중의 부름을 받은 그 다단과 아비람[a]인데, 고라의 무리 가운데서 야훼를 거슬러 다툴 때 모세와 아론을 거슬러 다툰 사람들입니다.
  rationale: 불명확한 종결 표현을 원문의 관계절 구조에 맞추어 재구성했습니다. ‘회중의 부름을 받은’으로 직역적 의미를 유지하고, ‘택함을 받은’이라는 해석적 대안은 각주에 남겼습니다. 또한 각주 표지를 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:44:30Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 הוּא는 앞서 열거된 다단과 아비람을 재지시하므로 ‘이들이 곧 그 다단과 아비람’으로 옮기는 것이 적절합니다. קרואי הָעֵדָה는 ‘회중의 부름을 받은 자들’로 직역적 여지를 유지해야 하며, בְּהַצֹּתָם עַל־יְהוָה는 ‘야훼를 거슬러 다툴 때’로 시간적 상황을 드러내는 편이 충실합니다.
  naturalness: 초안의 ‘그들이 야훼를 거슬러 맞설 때 그러했습니다’는 ‘그러했습니다’의 지시 대상이 불명확하고 현대 한국어 문장으로도 부자연스럽습니다. 관계절을 풀어 두 문장으로 정리하면 합쇼체의 현대적이고 명료한 문장이 됩니다.
  terminology: ‘아들들’, ‘회중’, ‘고라’, ‘야훼’는 적절합니다. ‘부름받은’은 띄어쓰기를 적용해 ‘부름을 받은’으로 고치고, 각주 표지는 해당 어구에 붙여야 합니다. ‘다투다’를 반복하여 히브리어 נצה의 반복을 반영했습니다.
  issues:
  - severity: medium
    issue: 마지막 절의 ‘그들이 야훼를 거슬러 맞설 때 그러했습니다’가 문법·의미상 불명확함
    rationale: ‘그러했습니다’가 무엇을 받는지 분명하지 않아, 야훼를 거슬러 다툰 사실과 모세·아론을 거슬러 다툰 사실의 원문상 연결이 흐려집니다.
  - severity: medium
    issue: 각주 표지 [a]가 느무엘에 붙어 있음
    rationale: 각주 내용은 קרואי הָעֵדָה, 즉 ‘회중의 부름을 받은 자들’의 번역 대안이므로 해당 표현에 표지를 두어야 합니다.
  - severity: low
    issue: ‘회중에서 부름받은 자들’의 격 관계와 띄어쓰기
    rationale: 원문은 ‘회중의 불린 자들’이라는 구성 관계이므로 ‘회중의 부름을 받은 자들’이 원문의 표현을 더 잘 보존하며, ‘부름을 받은’이 표준 띄어쓰기입니다.
  revised_text: 그리고 엘리압의 아들들은 느무엘, 다단, 아비람입니다. 이들이 곧 회중의 부름을 받은 그 다단과 아비람[a]인데, 고라의 무리 가운데서 야훼를 거슬러 다툴 때 모세와 아론을 거슬러 다툰 사람들입니다.
