    rationale: 한국어 번역문 안에서 표기가 일관되지 않고, ‘토랏’은 원문의 돌라 및 그 파생 씨족명과의 관계를 흐립니다.
  - severity: medium
    issue: ‘~의 종족은 ~ 사람들의 종족’이라는 표현이 원문의 계보적 씨족 공식보다 부자연스럽고 불분명합니다.
    rationale: לְ X 및 מִשְׁפַּחַת הַXִי는 조상과 그에게서 나온 씨족을 연결합니다. ‘X에게서 난 X 씨족’은 이 관계를 자연스럽고 충실하게 나타냅니다.
  - severity: low
