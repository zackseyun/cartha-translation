revisions:
- from: 잇사갈의 아들들은 그들의 종족별로 이러합니다. Tola의 종족은 토랏 사람들의 종족이고, Puvah의 종족은 푸니 사람들의 종족입니다.[a]
  to: 잇사갈의 아들들은 그 씨족별로 이러합니다. 돌라에게서 난 돌라 씨족과 부와에게서 난 부니 씨족입니다.[a]
  rationale: 원문의 두 항목으로 된 씨족 열거와 ‘조상—그에게서 나온 씨족’ 관계를 보존하되, 영문 고유명 혼용과 어색한 중복 표현을 바로잡았습니다. 각주는 본문 히브리어의 부와 표기와 관련 본문의 부아 이형을 명확히 설명합니다.
