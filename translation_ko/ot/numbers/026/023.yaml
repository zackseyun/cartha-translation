id: NUM.26.23
reference: Numbers 26:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
  footnotes:
  - marker: a
    text: Puvah is spelled 'Puah' in some related passages and translations.
    reason: alternative_reading
translation:
  language: ko
  text: 잇사갈의 아들들은 그 씨족별로 이러합니다. 돌라에게서 난 돌라 씨족과 부와에게서 난 부니 씨족입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어 표기는 ‘부와’입니다. 관련 본문에서는 이 이름이 ‘부아’로도 표기됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 아들
  lexicon: HALOT
  rationale: 족보·인구 조사 문맥에서 בני는 직계 후손을 가리키므로, 문장 구조를 살리면서도 자연스러운 한국어로 ‘아들들은’이라고 옮겼습니다.
- source_word: יִשָּׂשכָר
  english_pob_choice: Issachar
  chosen_korean: 잇사갈
  alternatives_korean:
  - 이스사갈
  - 이스라카르
  lexicon: HALOT
  rationale: 지명/지파명은 현대 외래어 표기 관행에 따라 ‘잇사갈’로 음역했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 지파별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 지파 내부의 씨족 단위를 뜻하므로, ‘종족별로’가 문맥상 가장 정확하고 자연스럽습니다.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  english_pob_choice: the clan of the Tolaites
  chosen_korean: 토랏 사람들의 종족
  alternatives_korean:
  - 토라 사람들의 종족
  - 토라 족속의 종족
  lexicon: HALOT
  rationale: הַתּוֹלָעִי는 Tola에서 파생된 씨족을 가리키므로, 영어의 clan-name 관용을 한국어로 풀어 ‘토랏 사람들의 종족’이라고 옮겼습니다.
- source_word: לְפֻוָה / מִשְׁפַּחַת הַפּוּנִי
  english_pob_choice: of Puvah / the clan of the Punites
  chosen_korean: Puvah의 종족은 푸니 사람들의 종족
  alternatives_korean:
  - 푸바의 종족은 푸니 사람들의 종족
  - 푸아의 종족은 푸니 사람들의 종족
  lexicon: HALOT
  rationale: 본문 철자 פֻוָה를 반영해 고유명은 Puvah로 두었고, 파생 씨족명 הַפּוּנִי는 의미를 살려 ‘푸니 사람들’로 옮겼습니다.
theological_decisions:
- issue: 족보 목록의 반복 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 각 항목의 소속 관계를 ‘~의 종족’과 ‘~ 사람들의 종족’으로 병렬해, 원문의 분류 표지를 유지했습니다.
  alternative_readings:
  - 좀 더 의역하여 ‘그들은 Tola 계열과 Puvah 계열입니다’
  - ‘~ 가문’으로 일괄 단순화
  rationale: 민수기의 인구 조사 목록은 혈통-씨족 구조를 드러내는 것이 핵심이므로, 반복적인 형식을 보존하는 쪽이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 민수기 26장의 지파·씨족 계수 문맥
