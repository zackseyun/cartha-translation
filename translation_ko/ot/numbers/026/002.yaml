  - severity: high
    issue: The draft says '일곱 살 이상' ('seven years and older').
    rationale: The Hebrew explicitly says 'from twenty years old and upward' (מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה).
  - severity: high
    issue: The draft renders the command as dividing the congregation and lacks the military-eligibility clause.
