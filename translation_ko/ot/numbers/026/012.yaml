source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Simeon' can also be rendered 'descendants of Simeon,' but the text specifically uses the male-line genealogical expression 'sons of.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their families.' Here 'clans' reflects the census sense of Hebrew mishpachot.
    reason: lexical_alternative
  - marker: c
    text: Jachin may also be transliterated 'Yachin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온의 아들들은 그들의 종족별로 이러합니다. 네무엘에게서는 네무엘 사람들의 종족이요, 야민에게서는 야민 사람들의 종족이요, 야긴에게서는 야긴 사람들의 종족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  english_pob_choice: The sons of Simeon
  chosen_korean: 시므온의 아들들
  alternatives_korean:
  - 시므온의 후손들
  - 시므온 자손들
  lexicon: HALOT
  rationale: 족보·인구조사 공식을 살려 직역에 가깝게 옮기되, 한국어에서도 자연스러운 소유격 구조로 표현했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가문별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: mishpachot는 여기서 지파 내부의 씨족 단위를 가리키므로, 한국어에서는 ‘종족’으로 옮겨 인구조사 목록의 집단성을 살렸습니다.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  english_pob_choice: the clan of the Nemuelites / Jaminites / Jachinites
  chosen_korean: 네무엘 사람들의 종족 / 야민 사람들의 종족 / 야긴 사람들의 종족
  alternatives_korean:
  - 네무엘 족속의 종족
  - 네무엘 가문의 종족
  lexicon: HALOT
  rationale: 히브리어 gentilic 형식을 한국어에서는 ‘사람들’로 옮겨, 해당 조상 이름에서 파생된 씨족 명칭임을 분명히 했습니다.
- source_word: לְנְמוּאֵל / לְיָמִין / לְיָכִין
  english_pob_choice: of Nemuel / of Jamin / of Jachin
  chosen_korean: 네무엘에게서는 / 야민에게서는 / 야긴에게서는
  alternatives_korean:
  - 네무엘에게서 / 야민에게서 / 야긴에게서
  - 네무엘의 / 야민의 / 야긴의
  lexicon: HALOT
  rationale: 열거형 계보 공식의 ל를 단순 소속이 아니라 각 시조 항목을 도입하는 표지로 보아, 한국어에서는 반복되는 ‘에게서는’으로 대응했습니다.
