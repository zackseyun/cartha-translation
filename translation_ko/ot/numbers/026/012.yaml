revisions:
- from: 시므온의 아들들은 그들의 종족별로 이러합니다. 네무엘에게서는 네무엘 사람들의 종족이요, 야민에게서는 야민 사람들의 종족이요, 야긴에게서는 야긴 사람들의 종족입니다.
  to: 시므온의 아들들[a]은 그들의 씨족[b]에 따라 이렇습니다. 느무엘에게서 난 느무엘 씨족, 야민에게서 난 야민 씨족, 야긴[c]에게서 난 야긴 씨족입니다.
  rationale: 씨족 단위를 정확히 나타내기 위해 ‘종족’을 ‘씨족’으로 고치고, 파생 집단 명칭을 한국어에서 자연스러운 ‘시조에게서 난 ○○ 씨족’ 구조로 옮겼습니다. 또한 한국어 성경 표기 관례에 따라 ‘네무엘’을 ‘느무엘’로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:36Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 세 병렬 항목은 각 시조 이름에서 나온 씨족을 열거합니다. 초안의 ‘에게서는’은 이를 대체로 전달하지만, ‘종족’은 מִשְׁפָּחָה가 가리키는 지파 내부의 씨족 단위보다 지나치게 넓고, ‘네무엘 사람들의 종족’은 같은 뜻을 중복합니다. ‘씨족’으로 통일하고, 조상-씨족 관계를 자연스럽게 드러내도록 고쳤습니다.
  naturalness: ‘그들의 종족별로 이러합니다’와 ‘…사람들의 종족’은 현대 한국어에서 다소 부자연스럽고 중복적입니다. ‘그들의 씨족에 따라 이렇습니다’ 및 ‘…에게서 난 … 씨족’은 목록 문체를 유지하면서 더 자연스럽습니다.
  terminology: מִשְׁפָּחָה는 여기서 ‘종족’보다 ‘씨족’이 정확합니다. 히브리어 느무엘(נְמוּאֵל)은 한국어 성경 표기 관례에 맞추어 ‘느무엘’로 표기했습니다. 야민과 야긴은 유지했습니다.
  issues:
