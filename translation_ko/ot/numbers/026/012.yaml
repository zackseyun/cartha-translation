    issue: מִשְׁפָּחָה를 ‘종족’으로 번역함
    rationale: 인구 조사 문맥에서 이는 지파 안의 clan, 즉 ‘씨족’입니다. ‘종족’은 더 큰 민족·종족 집단을 뜻할 수 있습니다.
  - severity: medium
    issue: ‘네무엘 사람들의 종족’ 등의 중복적 표현
    rationale: 히브리어 gentilic은 시조에게서 나온 씨족명인데, ‘사람들의 종족’은 한국어에서 부자연스럽고 계층을 중복합니다.
  - severity: low
    issue: ‘네무엘’ 표기
    rationale: 한국어 성경의 통용 표기는 ‘느무엘’입니다.
