- from: 땅이 그 입을 열어 그들을, 곧 고라를 삼켰습니다[a]. 회중이 죽고 불이 이백오십 명을 삼킬 때에 그리하였으며, 그들은 경고의 표적이 되었습니다[b][c].
  to: 땅[a]이 그 입을 열어 그들과 고라를 삼켰습니다[c]. 그 회중이 죽고 불이 이백오십 명을 삼킬 때에 그렇게 되었으며, 그들은 경고의 표적이 되었습니다[b].
  rationale: 히브리어의 등위 목적어를 ‘그들과 고라’로 바로 옮겨 고라를 동격으로 한정하는 해석을 제거했습니다. 시간절과 최종 복수 대명사는 원문의 관계와 남아 있는 지시 대상의 모호성을 유지했습니다. 각주 a는 실제 어휘 대안을 설명하도록 바로잡고, 각주 b와 c는 각각 נֵס의 번역 범위와 고라를 포함하는 원문 병렬을 명료하게 설명하도록 정비했습니다.
