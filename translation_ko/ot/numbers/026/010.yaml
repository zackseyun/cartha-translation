source:
  edition: WLC
  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
  footnotes:
  - marker: a
    text: Or 'the land opened its mouth.'
    reason: lexical_alternative
  - marker: b
    text: Or simply 'they became a sign.' The Hebrew נֵס can denote a sign, signal, or standard; 'warning sign' makes the function explicit in context.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'them and Korah.' This verse states the judgment in that form; compare the broader narrative in Numbers 16 for the surrounding details.
    reason: cross_reference
translation:
  language: ko
  text: 땅[a]이 그 입을 열어 그들과 고라를 삼켰습니다[c]. 그 회중이 죽고 불이 이백오십 명을 삼킬 때에 그렇게 되었으며, 그들은 경고의 표적이 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ은 ‘땅’ 또는 ‘토지’로 옮길 수 있습니다. 여기서는 땅이 입을 여는 이미지에 따라 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֵס은 ‘표적’, ‘신호’, 또는 ‘기’를 뜻할 수 있습니다. ‘경고의 표적’은 이 심판 문맥에서의 기능을 드러낸 번역이며, 단순히 ‘표적’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그들과 고라를’이라고 병렬로 말합니다. 본문은 고라를 ‘그들’과 함께 언급하며, 이 구절의 표현을 다른 본문에 맞추어 조화시키지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  english_pob_choice: the earth opened its mouth
  chosen_korean: 땅이 그 입을 열어
  alternatives_korean:
  - 땅이 입을 열어
  - 땅이 그 입을 열었습니다
  lexicon: HALOT
  rationale: אֶרֶץ의 구체적 이미지와 ‘입’을 그대로 살리되, 한국어에서는 주어-목적격 구조를 자연스럽게 옮겨 personification을 유지했습니다.
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  english_pob_choice: and swallowed them and Korah
  chosen_korean: 그들을, 곧 고라를 삼켰습니다
  alternatives_korean:
  - 그들과 고라를 삼켰습니다
  - 그들과 더불어 고라도 삼켰습니다
  lexicon: HALOT
  rationale: 히브리어의 병렬구문을 따라 ‘그들’과 ‘고라’를 모두 드러내되, 한국어에서는 의미 관계를 분명하게 하려고 ‘곧’를 사용했습니다.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  english_pob_choice: two hundred fifty men
  chosen_korean: 이백오십 명
  alternatives_korean:
  - 이백오십 인
  - 이백오십 남자
  lexicon: HALOT
  rationale: 직역에 가까운 수사 표현을 유지하되, 현대 한국어 성경문체에 맞게 ‘명’을 사용했습니다. 히브리어 אִישׁ의 남성 집단 표지도 담겼습니다.
- source_word: וַיִּהְיוּ לְנֵס
  english_pob_choice: they became a warning sign
  chosen_korean: 그들은 경고의 표적이 되었습니다
  alternatives_korean:
  - 그들은 표적이 되었습니다
  - 그들은 경고의 징표가 되었습니다
  lexicon: HALOT
  rationale: נֵס의 기본 뜻인 ‘표적/기호’에서 출발하되, 문맥상 심판의 기능이 분명하므로 ‘경고의 표적’으로 옮겨 소스의 기능을 드러냈습니다.
theological_decisions:
- issue: ‘그들을, 곧 고라를’의 포함 범위
  chosen_reading: 본문의 병렬 형태를 유지하여, 고라가 문장상 함께 언급된다는 점을 그대로 드러냈습니다.
  alternative_readings:
  - 고라를 따로 분리해 해석적으로 완화하는 번역
  - 고라를 생략하고 ‘그들’만 옮기는 번역
  rationale: 수용자가 본문 자체의 긴장을 보게 하려는 원칙에 따라, 다른 본문과의 조화를 위해 이 구절의 문장을 재구성하지 않았습니다.
  doctrine_reference: 원문 우선, 조화보다 본문 투명성 유지
- issue: לְנֵס의 기능 해석
  chosen_reading: ‘표적’에 ‘경고의’를 붙여, 단순한 표시가 아니라 심판을 경고하는 표지라는 문맥 기능을 반영했습니다.
  alternative_readings:
  - 단순히 ‘표적’으로만 옮김
  - ‘기호’ 또는 ‘기준’으로 옮김
  rationale: 히브리어 נֵס은 넓게는 표적/신호를 뜻하지만, 이 장면에서는 경고와 기억을 남기는 심판 표지의 역할이 핵심이므로 그 기능을 드러냈습니다.
  doctrine_reference: 문맥상 기능을 살리는 최적 대응
