  source_fidelity: 초안은 제비에 의한 분배와 조상 지파에 따른 상속이라는 기본 뜻을 담고 있습니다. 그러나 히브리어의 수동형 ‘땅이 나뉠 것이다’와 복수 주어 ‘그들이 상속할 것이다’가 한국어에서 충분히 드러나지 않으며, ‘그 조상들’도 지시 대상이 불명확합니다.
  naturalness: ‘상속하리라’는 현대 표준 한국어 합쇼체 문체와 맞지 않습니다. ‘제비를 뽑아’와 ‘상속받을 것입니다’를 사용하면 자연스럽고 지정된 문체에도 맞습니다.
  terminology: נחלוּ는 여기서 토지를 유산으로 받는다는 뜻이므로 ‘상속받다’가 적절합니다. אבותם은 부계 조상 계보를 가리키므로, 본문에서는 이를 명시하되 용어의 직역적 폭을 보완하는 각주를 둘 수 있습니다.
  issues:
  - severity: medium
    issue: ‘땅을 나누되’가 히브리어 수동형 יֵחָלֵק(‘땅이 나뉠 것이다’)을 능동적으로 바꾸고, 분배 방식도 다소 덜 분명하게 표현합니다.
    rationale: 원문은 땅 자체가 제비에 의해 분배될 것임을 말합니다. ‘제비를 뽑아 그 땅을 나눌 것이며’는 한국어에서 자연스럽게 그 의미를 전달합니다.
  - severity: medium
    issue: ‘그 조상들의’는 선행 대상이 불명확하고, ‘상속하리라’는 합쇼체가 아닙니다.
    rationale: 원문의 3인칭 복수 주어를 ‘그들은/그들이’로 밝혀야 하며, 지정 문체에는 ‘상속받을 것입니다’가 적합합니다.
  - severity: low
    issue: 조상 용어에서 부계 계보라는 원문의 맥락이 드러나지 않습니다.
    rationale: אָבוֹת은 문자적으로 ‘아버지들’이지만 여기서는 지파의 부계 조상을 가리킵니다. ‘부계 조상’과 각주가 의미를 정확하면서도 자연스럽게 전달합니다.
  revised_text: 오직 제비를 뽑아 그 땅을 나눌 것이며, 그들은 자기 부계 조상들의 지파 이름에 따라 그 땅을 상속받을 것입니다.
  revised_footnotes:
