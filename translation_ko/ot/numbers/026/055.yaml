    text: 히브리어는 문자적으로 ‘그들의 아버지들’입니다. 여기서는 지파 안의 부계 조상 계보를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 수동 분배의 의미, 상속하는 복수 주어, 그리고 현대 표준 합쇼체를 분명히 했습니다. ‘부계 조상’은 지파 상속 문맥에서 אָבוֹת의 남성 계보 지시를 반영하며, 각주로 문자적 표현을 밝혔습니다.
