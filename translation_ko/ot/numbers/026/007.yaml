  lexicon: HALOT
  rationale: 민수기의 인구조사·지파 문맥에서 מִשְׁפָּחָה는 핵가족보다 지파 내부의 친족 단위를 가리키므로, 현대 한국어에서는 '씨족'이 가장 자연스럽고 의미도 가깝습니다.
- source_word: הָרֻאוּבֵנִי
  english_pob_choice: the Reubenites
  chosen_korean: 르우벤 사람들
  alternatives_korean:
  - 르우벤 족속
  - 르우벤 지파 사람들
  lexicon: HALOT
  rationale: 지파 구성원을 가리키는 Gentilic 표현이므로, 한국어에서는 표준적인 인명 음역과 결합한 '르우벤 사람들'로 옮겨 자연스러운 집합 의미를 살렸습니다.
- source_word: פְקֻדֵי
  english_pob_choice: those numbered from them
  chosen_korean: 그들 가운데서 계수된 사람들
  alternatives_korean:
  - 그들 가운데서 조사된 사람들
  - 그들 가운데서 점호된 사람들
  lexicon: HALOT
  rationale: פקד의 인구조사 용법을 따라 '계수된'으로 옮겨, 단순한 숫자 산출이 아니라 조사·등록의 의미를 드러냈습니다.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  english_pob_choice: forty-three thousand seven hundred thirty
