  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
  footnotes:
  - marker: a
    text: Or “their numbered men” / “those mustered from them.” The Hebrew term refers to those counted in the census.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 르우벤 사람들의 씨족들이며, 그들 가운데서 계수된 사람들은 사만삼천칠백삼십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수된 사람들’은 인구조사에서 집계된 이들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
