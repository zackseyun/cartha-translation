  - … 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술 전개의 wayyiqtol을 한국어 서술문에서는 시간적 전환을 드러내는 '그때'로 옮겨, 공식을 유지하면서도 자연스러운 합쇼체 문장으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 전통적 대체어가 아니라 고유명사로 드러내기 위해 '야훼'를 사용했습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
