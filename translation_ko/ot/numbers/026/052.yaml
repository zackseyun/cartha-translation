  source_fidelity: 히브리어의 와우 연속형은 문맥 전환으로 ‘그때’로 옮길 수 있으며, ‘야훼께서 모세에게 말씀하셨습니다’는 וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה를 충실하고 자연스럽게 반영합니다. 다만 לֵאמֹר는 뒤따르는 발화 내용을 도입하고, 마소라 본문의 연결 표지도 다음 구절로 이어짐을 보이므로 마침표로 문장을 닫아서는 안 됩니다.
  naturalness: ‘야훼께서 모세에게 말씀하셨습니다:’는 현대 표준어의 격식 있는 성경 문체로 자연스럽습니다. 콜론은 다음 절에 이어질 직접 발화를 명확히 예고합니다.
  terminology: 신명사 יְהוָה를 ‘야훼’로 음역한 것은 영문 POB의 Yahweh 선택과 일치합니다. 각주에서 전통적 한국어 성경 번역의 관례는 ‘주님’보다 ‘여호와’로 밝혀야 정확합니다.
  issues:
  - severity: medium
    issue: 본문 끝의 마침표가 לֵאמֹר가 도입하는 다음 발화와의 연결을 끊습니다.
    rationale: 이 절은 독립적으로 완결된 발화가 아니라 다음 절의 인용 내용을 도입합니다. 한국어에서는 콜론으로 이를 나타내는 것이 안전합니다.
  - severity: low
    issue: 각주의 전통적 번역 표현이 ‘주님’으로 되어 있습니다.
    rationale: YHWH의 전통적 한국어 성경 번역 표기는 일반적으로 ‘여호와’입니다. 영문 각주의 ‘the LORD’에 해당하는 번역 관례를 한국어 독자에게 정확히 설명하려면 이를 사용해야 합니다.
