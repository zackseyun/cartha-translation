  - 말하여
  lexicon: HALOT
  rationale: 히브리어 말씀 도입 공식은 한국어에서 굳이 '말하며'를 덧붙이지 않고도 종결형으로 자연스럽게 반영할 수 있어, 이어질 직접화법을 예고하는 기능을 살렸습니다.
theological_decisions:
- issue: 야훼의 직접 발화 공식의 문체
  chosen_reading: 서술문은 합쇼체로 유지하되, 하나님의 직접 발화가 시작되기 전의 도입 문구도 동일한 존대 종결로 정리했습니다.
  alternative_readings:
  - '''야훼께서 모세에게 이르셨습니다'''
