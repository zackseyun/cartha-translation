id: NUM.26.20
reference: Numbers 26:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Judah'; in this census context the phrase denotes Judah's male-line descendants grouped into clans.
    reason: lexical_alternative
  - marker: b
    text: Older English tradition sometimes has 'Pharez' for Perez.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 자손[a]은 그들의 씨족별로 다음과 같았습니다. 셀라에게서 난 이들은 셀라 씨족이었고, 베레스[b]에게서 난 이들은 베레스 씨족이었으며, 세라에게서 난 이들은 세라 씨족이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘유다의 아들들’은 이 인구조사 문맥에서 유다의 남계 후손들, 곧 씨족으로 구분된 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베레스’는 히브리어 פֶּרֶץ를 직접 반영한 표기입니다. 오래된 영어 전통에서는 ‘Pharez’라는 표기가 나타나기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יְהוּדָה
  english_pob_choice: The sons of Judah
  chosen_korean: 유다 자손은
  alternatives_korean:
  - 유다의 아들들은
  - 유다의 자손들은
  lexicon: HALOT
  rationale: 족보·인구조사 문맥에서 בני는 직계 ‘아들들’보다 집단적 후손을 가리키므로, POB의 ‘sons’에 대응하되 한국어에서는 자연스럽게 ‘자손’으로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: Numbers 26의 מִשְׁפָּחָה는 단순한 가족보다 하위 부족 단위인 ‘clan’에 해당하므로, 교회 전통어 ‘가족’보다 ‘종족’이 본문의 분류 기능을 더 정확히 드러냅니다.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי / הַפַּרְצִי / הַזַּרְחִי
  english_pob_choice: the clan of the Shelanites / Perezites / Zerahites
  chosen_korean: 셀라 족속이요, 베레스 족속이요, 세라 족속이었습니다
  alternatives_korean:
  - 셀라인 족속이요, 페레스 족속이요, 제라 족속이었습니다
  - 셀라 사람들 / 베레스 사람들 / 세라 사람들
  lexicon: HALOT
  rationale: 반복되는 gentilic형은 한국어에서 ‘-족속’이 족보적·집단적 표지를 가장 잘 살립니다. ‘베레스’는 히브리어 פֶּרֶץ를 직접 반영한 표기이며, POB의 Perez를 따르되 한국어 성서 관용을 고려해 음역을 조정했습니다.
theological_decisions:
- issue: 족보/인구조사 공식에서 בני의 범위
  chosen_reading: ‘자손’으로 옮겨 성별적 직역보다 집단적 후손 의미를 드러냈습니다.
  alternative_readings:
  - ‘아들들’로 직역
  - ‘후손들’로 일반화
  rationale: 이 구절은 부족 등록의 공식 문구로, 실제 의미는 한 개인의 아들들보다 유다 계통의 남계 후손 집단입니다. 따라서 문맥상 의미를 살리되 과도한 일반화는 피했습니다.
  doctrine_reference: 민수기 26장의 지파/족속 등록 문맥
