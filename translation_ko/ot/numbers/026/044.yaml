source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
  footnotes:
  - marker: a
    text: Hebrew 'families'; in this census context the term refers to clan divisions within the tribe.
    reason: lexical_alternative
  - marker: b
    text: Or 'Beriahites' for 'Beriites'; the Hebrew gentilic is derived from Beriah.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀의 아들들은 그들의 씨족별로 이러합니다. 임나에게서 난 임나 씨족, 이스위에게서 난 이스위 씨족, 브리아에게서 난 브리아 씨족입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘가족들’은 이 인구 조사 문맥에서 지파 안의 씨족 단위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  english_pob_choice: The sons of Asher
  chosen_korean: 아셀의 아들들
  alternatives_korean:
  - 아셀의 자손들
  - 아셀의 자녀들
  lexicon: HALOT
  rationale: 족보·인구조사 문맥에서 בְּנֵי는 문자 그대로의 '아들들'이라기보다 부족의 남계 후손을 가리키므로, POB의 직역성을 살리면서도 한국어에서 자연스러운 '아셀의 아들들'을 택했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 가문대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 인구조사 문맥에서 부족 아래의 종족/씨족 단위를 가리키므로, 단순한 현대적 '가족'보다 '종족'이 문맥을 더 정확히 드러냅니다.
- source_word: מִשְׁפַּחַת הַיִּמְנָה / הַיִּשְׁוִי / הַבְּרִיעִי
  english_pob_choice: the clan of the Imnites / Ishvites / Beriites
  chosen_korean: 임나인들의 종족 / 이스위인들의 종족 / 브리아인들의 종족
  alternatives_korean:
  - 임나의 종족 / 이스위의 종족 / 브리아의 종족
  - 임나 족속 / 이스위 족속 / 브리아 족속
  lexicon: HALOT
  rationale: 히브리어의 민족명 형용사형을 한국어로 옮길 때 '-인들'을 써서 혈연·귀속 관계를 드러냈고, POB의 clan 표지를 반영해 '종족'을 반복했습니다.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  english_pob_choice: of Imnah / of Ishvi / of Beriah
  chosen_korean: 임나 / 이스위 / 브리아
  alternatives_korean:
  - 임나의
  - 이스위의
  - 브리아의
  lexicon: HALOT
  rationale: 반복되는 ל는 족보 목록에서 출신·계보를 표시하므로, 한국어에서는 별도 조사 없이 이름만 두고 뒤의 종족명으로 관계를 풀어 주었습니다.
theological_decisions:
- issue: 족보 항목의 번역에서 'clan'과 'family'의 구분
  chosen_reading: '''종족''으로 통일해 이스라엘 부족 내부의 씨족 단위를 드러냈습니다.'
  alternative_readings:
  - '''가족'''
  - '''씨족'''
  rationale: 본문은 가정 단위가 아니라 인구조사 표의 부족 하위 단위를 나열하므로, 오해를 줄이기 위해 '종족'을 선택했습니다.
  doctrine_reference: 민수기 26장의 인구조사·족보 문맥
- issue: 열거 구조의 재현
  chosen_reading: 각 항목을 'X의 종족, 곧 X인들의 종족'으로 풀어 같은 어미 구조를 유지했습니다.
  alternative_readings:
  - 단순 나열
  - 괄호를 사용한 축약
  rationale: 히브리어의 반복적 명명 구조를 한국어에서 보존하여, 독자가 각 씨족 항목의 대응 관계를 명확히 보도록 했습니다.
  doctrine_reference: 본문의 족보/명부 체계
