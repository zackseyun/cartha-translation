revisions:
- from: 아셀의 아들들은 그들의 종족대로 이러합니다. 임나의 종족, 곧 임나인들의 종족이며, 이스위의 종족, 곧 이스위인들의 종족이며, 브리아의 종족, 곧 브리아인들의 종족입니다.[a][b]
  to: 아셀의 아들들은 그들의 씨족별로 이러합니다. 임나에게서 난 임나 씨족, 이스위에게서 난 이스위 씨족, 브리아에게서 난 브리아 씨족입니다.[a]
  rationale: 명부 공식의 두 구성 요소, 곧 조상 이름과 그에게서 비롯된 씨족명을 ‘…에게서 난 … 씨족’으로 구별하여 재현했습니다. ‘씨족’은 인구 조사에서 지파 아래의 단위를 자연스럽게 나타냅니다. 브리아의 파생 씨족명에 관한 영어식 음역 대안은 한국어 번역에 적용되지 않으므로 해당 각주는 삭제하고, 남은 어휘 주석은 문장 전체의 씨족 분류를 설명하도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:40:07Z'
review_pass:
