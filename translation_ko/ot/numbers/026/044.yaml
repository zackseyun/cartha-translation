  source_fidelity: 수정이 필요합니다. 히브리어는 각 항목에서 조상 이름(‘임나에게서’)과 그에게서 파생된 씨족명(‘임나 씨족’)을 구별합니다. 초안의 ‘임나의 종족, 곧 임나인들의 종족’은 이 두 요소를 같은 뜻으로 중복시키며, ‘곧’은 원문에 없는 동격 관계를 만듭니다.
  naturalness: ‘종족’은 현대 한국어에서 민족·인종 집단을 가리키기 쉬우므로, 이스라엘 지파 내부의 하위 단위인 מִשְׁפָּחָה에는 ‘씨족’이 더 자연스럽고 정확합니다. 반복 명부는 ‘…에게서 난 … 씨족’으로 간결하게 옮길 수 있습니다.
  terminology: 고유명사는 마소라 본문의 형태를 따라 ‘임나, 이스위, 브리아’로 유지합니다. 파생 씨족명은 한국어에서 별도의 불투명한 음역형을 만들기보다 ‘임나 씨족’처럼 조상 이름과 씨족 단위를 결합하여 나타내는 것이 명확합니다.
