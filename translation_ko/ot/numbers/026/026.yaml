revisions:
- from: 스불론의 자손들은 그들의 종족별로 이러합니다. 세렛에게서 난 자들은 세렛 사람들의 종족이요, 엘론에게서 난 자들은 엘론 사람들의 종족이요, 야흘르엘에게서 난 자들은 야흘르엘 사람들의 종족입니다.[a][b]
  to: 스불론의 자손들[b]은 그들의 씨족대로[a] 이러합니다. 세렛에게서는 사르딧 씨족, 엘론에게서는 엘론 씨족, 야흘르엘에게서는 야흘르엘 씨족입니다.
  rationale: 원문의 계수 목록 형식을 유지하도록 불필요한 ‘난 자들’과 ‘사람들’을 제거하고, 조상명 세렛과 그 파생 씨족명 사르딧을 구별했습니다. ‘씨족’은 이 문맥의 מִשְׁפָּחָה에 더 알맞으며, 각주 표지는 설명 대상 표현 바로 뒤에 배치했습니다.
