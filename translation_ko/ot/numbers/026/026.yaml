  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
  footnotes:
  - marker: a
    text: Or 'according to their clans.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Zebulun'; in this census context, this refers to Zebulun's tribal descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 스불론의 자손들은 그들의 종족별로 이러합니다. 세렛에게서 난 자들은 세렛 사람들의 종족이요, 엘론에게서 난 자들은 엘론 사람들의 종족이요, 야흘르엘에게서 난 자들은 야흘르엘 사람들의 종족입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종족별로’는 히브리어 לְמִשְׁפְּחֹתָם의 분배적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 ‘자손들’은 문자적으로는 ‘아들들’이지만, 계수 문맥에서는 스불론 지파의 혈통적 후예를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  english_pob_choice: The sons of Zebulun
  chosen_korean: 스불론의 자손들
  alternatives_korean:
  - 스불론의 아들들
  - 스불론의 후손들
  lexicon: HALOT
  rationale: 족보·인구조사 문맥에서 בְּנֵי는 혈통적 후예를 가리키므로 ‘자손들’이 자연스럽고, 부족 이름은 현대 음역인 ‘스불론’으로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족별로
  - 그들의 족속대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 계수 본문에서 부족 내부의 하위 집단을 뜻하므로, 의미를 살리면서도 현대 한국어에서 자연스러운 ‘종족별로’로 옮겼습니다.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי / הָאֵלֹנִי / הַיַּחְלְאֵלִי
  english_pob_choice: the clan of the Sardites / Elonites / Jahleelites
  chosen_korean: 세렛 사람들의 종족 / 엘론 사람들의 종족 / 야흘르엘 사람들의 종족
  alternatives_korean:
  - 사르딧 사람들의 종족
  - 엘로네 사람들의 종족
  - 야흘엘 사람들의 종족
  lexicon: HALOT
  rationale: 히브리어 gentilics를 한국어에서 어색하지 않게 풀어 ‘사람들의 종족’으로 옮겨, 반복되는 족보 공식과 출신 관계를 분명히 했습니다.
- source_word: לְסֶרֶד / לְאֵלֹן / לְיַחְלְאֵל
  english_pob_choice: of Sered / of Elon / of Jahleel
  chosen_korean: 세렛에게서 난 / 엘론에게서 난 / 야흘르엘에게서 난
  alternatives_korean:
  - 세렛의
  - 엘론의
  - 야흘르엘의
  lexicon: HALOT
  rationale: לְ가 여기서는 종족 명칭의 기원·소속을 표시하므로 단순 소유격보다 ‘에게서 난’이 출생·파생 관계를 더 분명히 드러냅니다.
theological_decisions:
- issue: 본문의 반복되는 족보/인구조사 공식에서 ‘아들들’과 ‘종족’ 사이의 관계를 어떻게 드러낼지
  chosen_reading: 개인의 아들 목록이 아니라 지파 내부의 혈통 집단을 가리키는 공식으로 읽어, ‘자손들’과 ‘종족별로’를 함께 사용했습니다.
  alternative_readings:
  - 직역해 ‘스불론의 아들들’이라고만 번역
  - 의미를 넓혀 ‘스불론의 후손들’로만 번역
  rationale: 이 절은 가계 표기가 아니라 계수 장부의 집단 분류이므로, 원문의 족보적·행정적 기능을 함께 보이도록 했습니다.
  doctrine_reference: 민수기 1–4장 및 26장의 지파 계수 문맥
