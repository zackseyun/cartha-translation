  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: ko
  text: '므낫세의 아들들은 이러합니다: 마길에게서 나온 마길 사람의 씨족이며, 마길은 길르앗을 낳았습니다. 길르앗에게서 나온 길르앗 사람의 씨족입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  english_pob_choice: The sons of Manasseh
  chosen_korean: 므낫세의 아들들은
  alternatives_korean:
  - 므낫세의 자손들은
  - 므낫세의 아들들
  lexicon: HALOT
  rationale: 족보·지파 목록의 서두 공식으로서 ‘아들들’의 직역을 살리되, 한국어에서는 자연스럽게 서술형으로 맞췄습니다.
- source_word: לְמָכִיר / לְגִלְעָד
  english_pob_choice: of Machir / of Gilead
  chosen_korean: 마길에게서 나온 / 길르앗에게서 나온
  alternatives_korean:
  - 마길의 / 길르앗의
  - 마길에게 속한 / 길르앗에게 속한
  lexicon: HALOT
  rationale: 앞의 לְ는 단순 소유격보다 계통·가지 표지를 나타내므로, 씨족이 ‘어느 조상에게서 나온 분파인지’를 드러내는 표현으로 옮겼습니다.
- source_word: מִשְׁפַּחַת הַמָּכִירִי / מִשְׁפַּחַת הַגִּלְעָדִי
  english_pob_choice: the clan of the Machirites / the clan of the Gileadites
  chosen_korean: 마길 사람의 씨족 / 길르앗 사람의 씨족
  alternatives_korean:
  - 마길 가문의 씨족
  - 마길족의 씨족 / 길르앗족의 씨족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 문맥에서 ‘씨족’이 가장 정확하며, הגנטिल릭은 ‘사람’으로 풀어 혈연 분파를 분명히 했습니다.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  english_pob_choice: and Machir fathered Gilead
  chosen_korean: 마길은 길르앗을 낳았습니다
  alternatives_korean:
  - 그리고 마길은 길르앗의 아버지가 되었습니다
  - 마길이 길르앗을 낳았습니다
  lexicon: HALOT
  rationale: הוֹלִיד의 족보 동사 기능을 한국어의 표준적 족보 표현인 ‘낳았습니다’로 옮겼습니다.
