lexical_decisions:
- source_word: לְ/זֶ֕רַח
  english_pob_choice: of Zerah
  chosen_korean: 즈라흐의
  alternatives_korean: 즈라흐에게
  lexicon: WLC
  rationale: Hebrew preposition 'לְ' here indicates possession or lineage ('of'), not direction. '즈라흐' is the standard transliteration for 'זֶרַח'.
- source_word: מִשְׁפַּ֖חַת
  english_pob_choice: clan
  chosen_korean: 가족
  alternatives_korean: 부족, 가문
  lexicon: WLC
  rationale: '''מִשְׁפָּחָה'' refers to a family unit or clan within a tribe. ''가족'' is the modern formal term for family/clan in this genealogical context.'
- source_word: הַ/זַּרְחִ֑י
  english_pob_choice: Zerahites
  chosen_korean: 즈라히
  alternatives_korean: 즈라흐의 자손
  lexicon: WLC
  rationale: Hebrew construct state 'הַ/זַּרְחִי' denotes the collective group descending from Zerah. '즈라히' is the standard adjectival form.
- source_word: לְ/שָׁא֕וּל
  english_pob_choice: of Shaul
  chosen_korean: 사울의
  alternatives_korean: 사울에게
  lexicon: WLC
  rationale: Proper name 'שָׁאוּל' transliterated as '사울'. Preposition 'לְ' indicates possession.
- source_word: הַ/שָּׁאוּלִֽי
  english_pob_choice: Shaulites
  chosen_korean: 사울리
  alternatives_korean: 사울의 자손
  lexicon: WLC
  rationale: Hebrew construct state 'הַ/שָּׁאוּלִי' denotes the collective group descending from Shaul. '사울리' is the standard adjectival form.
theological_decisions:
- decision: Genealogical Neutrality
