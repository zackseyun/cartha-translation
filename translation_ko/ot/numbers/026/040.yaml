  source_fidelity: 첫 문장은 베라의 아들로 아르드와 나아만을 정확히 제시합니다. 그러나 뒤의 두 מִשְׁפָּחָה 절은 각각 해당 인명에서 유래한 씨족을 가리키는데, 초안의 ‘…에게서 난 자손’과 ‘…사람들의 clan’은 원문의 씨족 명칭 구조를 불필요하게 우회하고 영어 단어를 남깁니다. 수정문은 두 씨족의 계통 관계를 자연스럽고 직접적으로 반영합니다.
  naturalness: ‘clan’은 표준 한국어 성경 번역문에 부자연스럽습니다. ‘씨족’은 민수기의 인구조사·계보 문맥에서 현대 표준어로 자연스럽고 적절합니다. 병렬 구조를 사용하여 원문의 목록체도 유지했습니다.
  terminology: מִשְׁפָּחָה는 ‘씨족’으로, 인명에서 파생된 הָאַרְדִּי와 הַנַּעֲמִי는 ‘아르드 씨족’과 ‘나아만 씨족’으로 옮겼습니다. 이는 한국어에서 가능한 가장 자연스러운 씨족명 형식입니다. 각주에서는 나아만에서 파생된 히브리어 씨족명이라는 어휘적 정보를 보존합니다.
