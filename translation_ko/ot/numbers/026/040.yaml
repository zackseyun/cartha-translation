translation:
  language: ko
  text: 베라의 아들들은 아르드와 나아만이었습니다. 아르드에게서는 아르드 씨족이, 나아만에게서는 나아만 씨족이 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나아만 씨족’은 나아만이라는 인명에서 파생된 씨족명입니다. ‘나아만 족속’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: And ... were
  chosen_korean: …이었습니다
  alternatives_korean:
  - …였습니다
  - …이었고
  lexicon: HALOT
  rationale: 계보 진술의 단순한 존재/소속을 자연스럽게 살리되, 불필요한 강조를 덜어 원문의 목록체를 유지했습니다.
- source_word: בְנֵי בֶלַע
  english_pob_choice: the sons of Bela
  chosen_korean: 베라의 아들들
  alternatives_korean:
  - 베라의 자손들
  - 베라에게 속한 아들들
  lexicon: HALOT
  rationale: 직계 계보를 가리키는 בְנֵי를 기본적으로 ‘아들들’로 옮겨 혈통 관계를 분명히 했습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: …사람들의 clan
  alternatives_korean:
  - …가문의
  - …족속의
  lexicon: HALOT
  rationale: Numbers의 족보·인구조사 문맥에서 מִשְׁפָּחָה는 ‘가정’보다 ‘씨족/부족 단위’를 가리키므로, POB의 ‘clan’을 그대로 살려 계보 단위를 드러냈습니다.
- source_word: הָאַרְדִּי / הַנַּעֲמִי
  english_pob_choice: the Ardite / the Naamite
  chosen_korean: 아르드 사람들의 / 나아만 사람들의
  alternatives_korean:
  - 아르드인의 / 나아만인의
  - 아르드족의 / 나아만족의
  lexicon: HALOT
  rationale: 히브리어의 gentilicial 형식을 한국어에서 자연스럽게 풀어, 씨족 명칭이 인명에서 파생되었음을 보이면서도 과도한 민족어 느낌은 피했습니다.
