  - 베라에게 속한 아들들
  lexicon: HALOT
  rationale: 직계 계보를 가리키는 בְנֵי를 기본적으로 ‘아들들’로 옮겨 혈통 관계를 분명히 했습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: …사람들의 clan
  alternatives_korean:
  - …가문의
  - …족속의
  lexicon: HALOT
  rationale: Numbers의 족보·인구조사 문맥에서 מִשְׁפָּחָה는 ‘가정’보다 ‘씨족/부족 단위’를 가리키므로, POB의 ‘clan’을 그대로 살려 계보 단위를 드러냈습니다.
- source_word: הָאַרְדִּי / הַנַּעֲמִי
  english_pob_choice: the Ardite / the Naamite
  chosen_korean: 아르드 사람들의 / 나아만 사람들의
  alternatives_korean:
  - 아르드인의 / 나아만인의
  - 아르드족의 / 나아만족의
  lexicon: HALOT
  rationale: 히브리어의 gentilicial 형식을 한국어에서 자연스럽게 풀어, 씨족 명칭이 인명에서 파생되었음을 보이면서도 과도한 민족어 느낌은 피했습니다.
