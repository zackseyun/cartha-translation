  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
  footnotes:
  - marker: a
    text: Hebrew 'the Naamite' is the gentilicial form derived from Naaman; alternatively, it could be rendered more transparently as 'the Naamanite.'
