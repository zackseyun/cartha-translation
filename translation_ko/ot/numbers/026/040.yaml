  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
  footnotes:
  - marker: a
    text: Hebrew 'the Naamite' is the gentilicial form derived from Naaman; alternatively, it could be rendered more transparently as 'the Naamanite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 베라의 아들들은 아르드와 나아만이었습니다. 아르드에게서 난 자손은 아르드 사람들의 clan이었고, 나아만에게서 난 자손은 나아만 사람들의 clan이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문맥의 gentilicial 형식은 ‘나아만 사람들’로도 옮길 수 있으나, 원문의 파생형을 더 투명하게 드러내면 ‘나아만인’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: And ... were
  chosen_korean: …이었습니다
  alternatives_korean:
  - …였습니다
  - …이었고
  lexicon: HALOT
  rationale: 계보 진술의 단순한 존재/소속을 자연스럽게 살리되, 불필요한 강조를 덜어 원문의 목록체를 유지했습니다.
- source_word: בְנֵי בֶלַע
  english_pob_choice: the sons of Bela
  chosen_korean: 베라의 아들들
  alternatives_korean:
