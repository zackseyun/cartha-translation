  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
  footnotes:
  - marker: a
    text: Or "their numbered men" or "their mustered ones." The Hebrew census formula uses a form of פקד, referring to those counted or enrolled.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 므낫세의 씨족들이며, 그들 가운데 계수된 이들은 5만 2천 7백 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 족속들
  - 가족들
  lexicon: HALOT
  rationale: 민수기 인구 조사 문맥에서 מִשְׁפָּחָה는 단순한 가정보다 부족 내 하위 친족 단위를 가리키므로, 현대 한국어에서는 '씨족'이 가장 구조를 잘 드러냅니다.
- source_word: מְנַשֶּׁה
  english_pob_choice: Manasseh
  chosen_korean: 므낫세
  alternatives_korean:
  - 만세
  - 마나세
  lexicon: 고유명사 표기 관행
  rationale: 이미 널리 정착된 성서 인명 표기인 '므낫세'를 사용해 독자의 인지 가능성과 일관성을 유지합니다.
- source_word: וּפְקֻדֵיהֶם
  english_pob_choice: those numbered from them
  chosen_korean: 그들로부터 계수된 자들
  alternatives_korean:
  - 그들 가운데 계수된 자들
  - 그들에서 계수된 자들
  - 그들의 계수된 자들
  lexicon: HALOT
  rationale: פקד의 인구조사적 의미를 살려 '계수된 자들'로 옮기되, 관계를 분명히 하기 위해 '그들로부터'를 붙여 영어 POB의 audit 의미를 반영했습니다.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  english_pob_choice: fifty-two thousand seven hundred
  chosen_korean: 오만이천칠백 명
  alternatives_korean:
  - 오십이천칠백 명
  - 5만 2천 7백 명
  lexicon: 히브리어 수사 체계
  rationale: 히브리어 수치를 한국어의 자연스러운 수사 체계로 풀어 '오만이천칠백 명'으로 옮기면서 정확한 총계를 유지했습니다.
