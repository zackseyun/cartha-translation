base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Now Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'there were not to him sons, except daughters.'
    reason: lexical_alternative
  - marker: b
    text: '''Noah'' here is the name of one of Zelophehad’s daughters, not Noah of the flood narrative.'
    reason: cultural_note
translation:
  language: ko
  text: 헤벨의 아들 슬로브핫에게는 아들이 없었고[a] 딸들만 있었습니다. 슬로브핫의 딸들의 이름은 말라, 노아[b], 호글라, 밀가, 디르사였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그에게는 아들이 없고 딸들밖에 없었다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노아’는 홍수 이야기의 노아가 아니라 슬로브핫의 딸 가운데 한 사람의 이름입니다.
    reason: cultural_note
