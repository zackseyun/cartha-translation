translation:
  language: ko
  text: 이것들은 이스라엘 자손의 계수된 자들입니다. 육십만 일천 칠백삼십 명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקוּדֵי
  english_pob_choice: the numbered men
  chosen_korean: 계수된 자들
  alternatives_korean:
  - 계수된 남자들
  - 등록된 자들
  - 세어 넣은 자들
  lexicon: HALOT
  rationale: 인구조사 문맥에서 פקד의 결과 상태를 살리면서, 총계만이 아니라 ‘세어진 사람들’이라는 인적 의미를 분명히 드러내기 위해 ‘계수된 자들’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: of the sons of Israel
  chosen_korean: 이스라엘 자손의
  alternatives_korean:
  - 이스라엘 사람들의
  - 이스라엘의 자손의
  - 이스라엘 백성의
  lexicon: HALOT
  rationale: 히브리어의 직역적 가족 표현을 유지하면서도 한국어 문장 안에서 자연스럽게 들리도록 ‘이스라엘 자손의’로 구성했습니다.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  english_pob_choice: six hundred one thousand seven hundred thirty
  chosen_korean: 육십만 일천 칠백삼십 명
  alternatives_korean:
  - 육백만 천 칠백삼십 명
  - 육십만 천칠백삼십 명
  - 60만 1천 730명
  lexicon: HALOT
  rationale: 히브리어 합산 수치를 한국어에서 가장 분명하게 전달하도록 십만 단위 표현으로 풀어 적었고, ‘명’을 보충해 계수된 사람들임을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 인구조사 결과를 나타내는 פְּקוּדֵי의 의미
  chosen_reading: ‘계수된 자들’로 사람을 지칭하여 총계가 아니라 계수 대상 인원이 보고된 것으로 읽습니다.
  alternative_readings:
  - ‘총계’로 처리하기
  - ‘등록된 자들’로 옮기기
  rationale: 민수기의 문맥은 군사적 인구조사의 집계 결과이므로, 추상적 숫자보다 계수된 사람들을 가리키는 표현이 원문의 의도를 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
