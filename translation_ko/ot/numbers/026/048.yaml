  text: 납달리 자손은 그들의 씨족에 따라 이러합니다. 야스엘에게서는 야스엘 씨족, 구니에게서는 구니 씨족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
