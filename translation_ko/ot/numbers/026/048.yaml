- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 씨족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이 장의 계수 목록에서 집단 하위 단위를 가리키므로 ‘종족’으로 옮기고, לְ의 분배적 용법은 ‘-별로’로 자연스럽게 살렸습니다.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי / מִשְׁפַּחַת הַגּוּנִי
  english_pob_choice: the clan of the Jahzeelites / the clan of the Gunites
  chosen_korean: 야흐스엘 족속 / 구니 족속
  alternatives_korean:
  - 야흐스엘 가문
  - 구니 가문
  lexicon: HALOT
  rationale: גנ/족속에 해당하는 집단명을 한국어 성경 문체에 맞게 ‘족속’으로 옮겨, 개인 이름에서 파생된 집단임을 드러냈습니다.
- source_word: יַחְצְאֵל / גוּנִי
  english_pob_choice: Jahzeel / Guni
  chosen_korean: 야흐스엘 / 구니
  alternatives_korean:
  - 야헤셀 / 구니
  - 야흐사엘 / 구니
  lexicon: 고유명사 표기
  rationale: 현대 외래어 표기법을 기본으로 하되, 히브리어 자음군과 장모음의 대략적 대응을 고려해 읽기 쉬운 음역을 택했습니다.
