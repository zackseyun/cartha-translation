  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: ko
  text: 베레스의 아들들은 이러합니다. 헤스론에게서는 헤스론 씨족이, 하물에게서는 하물 씨족이 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: were
  chosen_korean: 이러하니라
  alternatives_korean:
  - 있었습니다
  - 되었습니다
  lexicon: HALOT
  rationale: 족보·계수 공식에서 단순한 존재 진술로 쓰인 היה를 한국어에서 자연스럽게 도입하는 표현으로 옮겼습니다.
- source_word: בְנֵי פֶרֶץ
  english_pob_choice: The sons of Perez
  chosen_korean: 베레스의 아들들
  alternatives_korean:
  - 베레스의 자손들
  - 베레스의 후손들
  lexicon: HALOT
  rationale: בני를 족보 문맥의 직접적 친자 관계를 살려 ‘아들들’로 옮기고, פֶרֶץ는 현대 표기 관행에 따라 베레스로 옮겼습니다.
- source_word: לְחֶצְרֹן / לְחָמוּל
  english_pob_choice: of Hezron / of Hamul
  chosen_korean: 헤스론에게서 난 / 하물에게서 난
  alternatives_korean:
  - 헤스론의 / 하물의
  - 헤스론으로부터의 / 하물로부터의
  lexicon: HALOT
  rationale: 여기서 ל는 단순 소유보다 계보적 귀속을 나타내므로, 한국어에서는 ‘~에게서 난’으로 혈통 유래를 분명히 했습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: 씨족
  alternatives_korean:
  - 가문의
  - 족속의
  lexicon: HALOT
  rationale: 민수기 계수 문맥의 מִשְׁפָּחָה는 부족 아래의 친족 단위를 가리키므로, 현대 한국어에서 그 사회적 단위를 가장 잘 드러내는 ‘씨족’을 사용했습니다.
- source_word: הַחֶצְרֹנִי / הֶחָמוּלִי
  english_pob_choice: the Hezronites / the Hamulites
  chosen_korean: 헤스론 사람들 / 하물 사람들
  alternatives_korean:
  - 헤스론 씨족 / 하물 씨족
  - 헤스론 사람들 씨족 / 하물 사람들 씨족
  lexicon: HALOT
  rationale: 히브리어 gentilicial 형태를 한국어에서는 집단 명칭으로 자연스럽게 풀어 ‘사람들’로 옮겼습니다. 다만 본문 중복을 피하면서도 계보 소속을 살리기 위해 ‘씨족’과 병치했습니다.
