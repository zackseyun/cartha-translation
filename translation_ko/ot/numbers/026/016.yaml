translation:
  language: ko
  text: 오즈니의 씨족은 오즈니 사람들의 씨족이며, 에리의 씨족은 에리 사람들의 씨족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָזְנִי
  english_pob_choice: of Ozni
  chosen_korean: 오즈니의
  alternatives_korean:
  - 오즈니에게
  - 오즈니를 위한
  lexicon: HALOT
  rationale: 족보·씨족 목록에서 לְ는 소속 계보를 나타내므로, 한국어에서는 소유·귀속을 드러내는 조사 ‘의’로 자연스럽게 옮겼습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족
  lexicon: HALOT
  rationale: 민수기 족보·인구조사 문맥의 מִשְׁפָּחָה는 혈연 단위를 가리키므로, 좁은 의미의 ‘가족’보다 행정·족보적 뉘앙스를 살리는 ‘씨족’이 적절합니다.
- source_word: הָ/אָזְנִי
  english_pob_choice: the Oznites
  chosen_korean: 오즈니 사람들
  alternatives_korean:
  - 오즈니족
  - 오즈니 씨족
  lexicon: HALOT
  rationale: 히브리어 친족형·지명형 집단을 한국어에서는 복수 민족명처럼 ‘~ 사람들’로 풀어, 독자가 집단 표지를 쉽게 이해하도록 했습니다.
- source_word: הָ/עֵרִי
  english_pob_choice: the Erites
  chosen_korean: 에리 사람들
  alternatives_korean:
  - 에리족
  - 에리 씨족
  lexicon: HALOT
  rationale: 앞절과 같은 친족형을 일관되게 처리하여, 에리에서 나온 집단이라는 점을 자연스러운 한국어 집단명으로 드러냈습니다.
