base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
  footnotes:
  - marker: a
    text: Or 'And Er and Onan died in the land of Canaan.' The Hebrew conjunction can be rendered simply as 'and'; 'but' is used in the main text to reflect the contrastive sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 아들은 에르와 오난[a]이었습니다. 그러나 에르와 오난은 가나안 땅에서 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에르와 오난은 가나안 땅에서 죽었습니다.” 히브리어 접속사는 단순히 “그리고”로도 옮길 수 있습니다. 본문에서는 문맥상의 대조를 나타내기 위해 “그러나”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 남계 계보를 가리키므로, 의미를 넓히는 ‘자녀들’이나 ‘후손들’보다 ‘아들들’이 원문의 범위를 더 정확히 반영합니다.
- source_word: וַיָּמָת
  english_pob_choice: But ... died
  chosen_korean: 그러나 ... 죽었습니다
  alternatives_korean:
  - 그리고 ... 죽었습니다
  - 그런데 ... 죽었습니다
  lexicon: HALOT
  rationale: 서술 연결은 단순한 병렬보다 앞의 명단 진술과 뒤의 죽음 진술 사이의 대비를 드러내는 편이 자연스러워 ‘그러나’로 옮겼습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅에서
  alternatives_korean:
  - 가나안 בארץ에서
  - 가나안 땅 안에서
  lexicon: HALOT
  rationale: 히브리어의 בְּ + אֶרֶץ는 지리적 관용구로 ‘~땅에서’가 가장 자연스럽고, ‘가나안 땅’이 원문의 지명 표현을 보존합니다.
