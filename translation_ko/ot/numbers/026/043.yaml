lexical_decisions:
- source_word: כָּל
  english_pob_choice: All
  chosen_korean: 모든
  alternatives_korean:
  - 전체의
  - 온
  lexicon: HALOT
  rationale: 전체 합계를 가리키는 총칭이므로, 한국어에서는 자연스럽고 간결한 ‘모든’으로 살렸습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: families
  chosen_korean: 가족은
  alternatives_korean:
  - 씨족은
  - 가문은
  - 클랜은
  lexicon: HALOT
  rationale: 계수 문맥에서 친족 단위를 가리키지만, 본문이 이미 집계된 공동체를 말하므로 문맥상 ‘가족’이 가장 무난합니다.
- source_word: הַשּׁוּחָמִי
  english_pob_choice: the Shuhamites
  chosen_korean: 수하미 사람들의
  alternatives_korean:
  - 수하미 사람들의 집단의
  - 수하미 자손들의
  lexicon: HALOT
  rationale: 지명/인명에서 파생된 집단명은 한국어에서 ‘~사람들’로 옮겨 집단성을 드러내는 것이 가장 자연스럽습니다.
- source_word: לִפְקֻדֵיהֶם
  english_pob_choice: according to those numbered among them
  chosen_korean: 그들 가운데서 계수된 자들에 따라
  alternatives_korean:
  - 그들의 등록된 수에 따라
  - 그들 가운데 계수된 자들에 따라
  lexicon: HALOT
  rationale: פקד는 단순한 숫자보다 ‘계수되다/등록되다’의 census 의미가 핵심이므로, 총계의 근거를 드러내는 ‘계수된 자들에 따라’로 옮겼습니다.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  english_pob_choice: sixty-four thousand four hundred
  chosen_korean: 육만사천사백 명
  alternatives_korean:
  - 64,400명
  - 육십사만 사천사백 명
  lexicon: HALOT
  rationale: 히브리어 수사 구조의 최종 총액을 현대 한국어 숫자 읽기로 정확하게 제시하되, 인명 집단의 계수임을 ‘명’으로 분명히 했습니다.
