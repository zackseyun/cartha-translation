  lexicon: HALOT
  rationale: 전체 합계를 가리키는 총칭이므로, 한국어에서는 자연스럽고 간결한 ‘모든’으로 살렸습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: families
  chosen_korean: 가족은
