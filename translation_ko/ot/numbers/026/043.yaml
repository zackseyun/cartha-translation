  rationale: 계수 문맥에서 친족 단위를 가리키지만, 본문이 이미 집계된 공동체를 말하므로 문맥상 ‘가족’이 가장 무난합니다.
- source_word: הַשּׁוּחָמִי
  english_pob_choice: the Shuhamites
  chosen_korean: 수하미 사람들의
  alternatives_korean:
