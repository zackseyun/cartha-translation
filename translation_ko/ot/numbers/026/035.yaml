revisions:
- from: 이들은 에브라임의 자손들이며 그들의 족보대로는 수델라 족속 곧 수델라 족속의 자손이요, 베게르 족속 곧 베게르 족속의 자손이요, 다한 족속 곧 다한 족속의 자손이니라.
  to: 에브라임의 자손은 그들의 씨족에 따라 이러합니다. 수델라에게서는 수델라 씨족, 베겔에게서는 베겔 씨족, 다한에게서는 다한 씨족입니다.
  rationale: 씨족별 인구 조사 목록이라는 히브리어의 정형적 구조를 보존하면서, ‘족보’와 중복된 ‘자손’ 표현을 제거했습니다. 각 ל־구문은 ‘에게서는’으로, 이어지는 씨족명은 ‘… 씨족’으로 옮겨 조상과 그 후손 씨족의 관계를 자연스럽게 드러냈습니다.
