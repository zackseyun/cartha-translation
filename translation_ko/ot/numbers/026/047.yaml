base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
  footnotes:
  - marker: a
    text: Or, more formally, 'according to their numbered ones.' The Hebrew reflects census terminology from the verb פקד, referring to those enrolled or counted.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 아셀 자손의 씨족들이며, 그들 가운데 계수된 자들은[a] 오만삼천사백 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '그들의 계수된 자들에 따라'. 히브리어는 פקד에서 파생된 인구 조사 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 족속들
  - 가족들
  lexicon: HALOT
  rationale: 민수기의 지파 계수 문맥에서 מִשְׁפָּחָה는 핵가족보다 더 큰 친족 단위를 가리키므로, 한국어로는 '씨족'이 가장 자연스럽고 정확합니다.
- source_word: בְּנֵי אָשֵׁר
  english_pob_choice: the sons of Asher
  chosen_korean: 아셀 자손
  alternatives_korean:
  - 아셀의 아들들
  - 아셀의 후손들
  lexicon: HALOT
  rationale: 족보·지파 문맥의 관용구이므로 '아셀 자손'으로 옮겨 혈통과 지파 소속을 함께 드러냈습니다.
- source_word: לִפְקֻדֵיהֶם
  english_pob_choice: according to those numbered of them
  chosen_korean: 그 계수된 자에 따른
  alternatives_korean:
  - 그들의 계수에 따른
  - 그들의 계수된 자들에 따른
  - 계수된 그들에 따라
  lexicon: HALOT
  rationale: פקד의 계수·소집 용법을 반영해 단순한 총수가 아니라 공식적으로 '계수된 자'를 가리키도록 했습니다.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  english_pob_choice: fifty-three thousand four hundred
  chosen_korean: 삼만삼천사백 명
  alternatives_korean:
  - 오만삼천사백 명
  - 5만 3천 4백 명
  lexicon: HALOT
  rationale: 히브리어 수사 표현의 실제 합계는 53,400이므로 한국어 숫자 표기는 '오만삼천사백 명'이 맞습니다.
theological_decisions:
- issue: 민수기 인구조사 표현의 의미
  chosen_reading: 단순 인원 총계가 아니라 야훼의 명령 아래 공식적으로 '계수된 자'를 기록한 표현으로 유지했습니다.
  alternative_readings:
  - 그들의 수에 따라
  - 인구 조사 결과에 따라
  rationale: 본문의 פקד 계수 용법은 이스라엘이 하나님의 질서 속에서 조직된 공동체임을 드러내므로, 이를 평이한 '수'보다 더 구체적으로 보존하는 것이 좋습니다.
  doctrine_reference: 민수기 1장, 26장 인구조사 문맥
- issue: 수치 표기 오류 방지
  chosen_reading: 히브리어 수사 합계를 정확히 반영해 오만삼천사백 명으로 옮겼습니다.
  alternative_readings:
  - 삼만삼천사백 명
  rationale: 원문의 שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת은 53,400이므로, 이를 잘못 낮춰 옮기면 본문의 사실 정보가 훼손됩니다.
  doctrine_reference: 본문 충실성 원칙
