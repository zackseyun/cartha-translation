  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
  footnotes:
  - marker: a
    text: Or, more formally, 'according to their numbered ones.' The Hebrew reflects census terminology from the verb פקד, referring to those enrolled or counted.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 아셀 자손의 씨족들이며, 그 계수된 자에 따른 수는 삼만삼천사백 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '그들의 계수된 자들에 따라'. 히브리어는 פקד의 계수 용법을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
