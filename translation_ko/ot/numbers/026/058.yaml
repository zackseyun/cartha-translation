base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
  footnotes:
  - marker: a
    text: Or "families" or "family groups"; Hebrew מִשְׁפָּחָה denotes a kinship subdivision within the tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 레위의 씨족들입니다. 곧 립니 씨족, 헤브론 씨족, 말리 씨족, 무시 씨족, 고라 씨족입니다. 그리고 고핫은 아므람을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  english_pob_choice: clans / the clan of
  chosen_korean: 씨족
  alternatives_korean:
  - 가문
  - 가족들
  - 가족 단위
  lexicon: HALOT
  rationale: 족보와 지파 조사 문맥에서 מִשְׁפָּחָה는 현대적 핵가족보다 더 넓은 친족 하위 집단을 가리키므로, 그 기능을 가장 자연스럽게 드러내는 한국어로 ‘씨족’을 택했습니다.
- source_word: הַלִּבְנִי
  english_pob_choice: the Libnite
  chosen_korean: 르브니
  alternatives_korean:
  - 르브나 사람
  - 르브니 족속
  - 르브니인
  lexicon: HALOT
  rationale: 영어 POB의 gentilicial 표지를 한국어에서는 ‘-인/족속’보다 이름형으로 압축해, 뒤의 ‘씨족’과 중복되지 않도록 간결하게 옮겼습니다.
- source_word: הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  english_pob_choice: the Hebronite / the Mahlite / the Mushite / the Korahite
  chosen_korean: 헤브론 / 말리 / 무시 / 고라
  alternatives_korean:
  - 헤브론 사람들
  - 헤브론 족속
  - 말리 족속
  - 무시 족속
  - 고라 족속
  lexicon: HALOT
  rationale: 나열 구조를 살리기 위해 각 항목을 동일한 이름형으로 두고, 공통 표지 ‘씨족’을 반복하여 히브리어의 병렬적 계보 목록을 한국어에서도 보이게 했습니다.
- source_word: וּקְהָת הוֹלִד אֶת עַמְרָם
  english_pob_choice: And Kohath fathered Amram.
  chosen_korean: 그리고 고핫은 아므람을 낳았습니다.
  alternatives_korean:
  - 그리고 고핫은 아므람의 아버지가 되었습니다.
  - 그리고 고핫이 아므람을 낳았습니다.
  - 그리고 고핫은 아므람을 낳았습니다
  lexicon: HALOT
  rationale: genealogical formula의 ילד Hiphil을 현대 한국어에서 가장 자연스럽고 직접적으로 드러내는 동사로 ‘낳았습니다’를 택했습니다.
