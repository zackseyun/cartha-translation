base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
  footnotes:
  - marker: a
    text: Or "families" or "family groups"; Hebrew מִשְׁפָּחָה denotes a kinship subdivision within the tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 레위의 씨족들입니다. 곧 르브니 씨족, 헤브론 씨족, 말리 씨족, 무시 씨족, 고라 씨족입니다. 그리고 고핫은 아므람을 낳았습니다.
  philosophy: optimal-equivalence
