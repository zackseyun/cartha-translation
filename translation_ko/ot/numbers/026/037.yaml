base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
  footnotes:
  - marker: a
    text: Or 'according to their enrollment,' 'by their number,' or more idiomatically 'as numbered.' The Hebrew reflects census registration language.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 에브라임의 아들들의 종족들이며, 그들이 계수된 대로는 삼만 이천오백 명입니다. 이것들은 요셉의 아들들이며, 그들의 종족들에 따른 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 등록에 따라’, ‘그들의 수대로’, 더 자연스럽게는 ‘계수된 대로’. 히브리어는 인구 조사 등록 언어를 반영합니다.
    reason: lexical_alternative
