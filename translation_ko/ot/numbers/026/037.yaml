- from: 이것들은 에브라임의 아들들의 종족들이며, 그들이 계수된 대로는 삼만 이천오백 명입니다. 이것들은 요셉의 아들들이며, 그들의 종족들에 따른 것입니다.[a]
  to: 이들은 에브라임 자손의 씨족들입니다. 이들의 계수된 수는[a] 삼만 이천오백 명입니다. 이들은 씨족별로 구분한 요셉 자손입니다.
  rationale: 씨족 단위를 ‘씨족’으로 바로잡고, 인구 조사 문구를 ‘이들의 계수된 수’로 자연스럽고 정확하게 표현했습니다. 마지막 문장은 요셉 자손을 씨족별로 요약하는 히브리어의 결론 공식을 보존하되 현대 표준 한국어로 명료하게 다듬었습니다. 각주 표지도 해당 어휘에 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:38Z'
