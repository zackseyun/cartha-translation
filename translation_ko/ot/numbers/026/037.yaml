translation:
  language: ko
  text: 이들은 에브라임 자손의 씨족들입니다. 이들의 계수된 수는[a] 삼만 이천오백 명입니다. 이들은 씨족별로 구분한 요셉 자손입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 등록에 따라’, ‘그 수대로’, 또는 더 자연스럽게 ‘계수된 대로’. 히브리어는 인구 조사에서 등록·계수하는 용어를 사용합니다.
    reason: lexical_alternative
