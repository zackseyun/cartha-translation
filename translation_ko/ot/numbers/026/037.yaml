  source_fidelity: 원문의 두 요약 표지(‘이들은’)와 에브라임-요셉의 족보적 연결, 그리고 계수된 총수 32,500명은 유지되어야 합니다. לִפְקֻדֵיהֶם은 인구 조사에서 계수·등록된 수를 가리키므로 ‘계수된 수’가 한국어로 정확하고 분명합니다.
  naturalness: 초안의 ‘그들이 계수된 대로는’과 ‘그들의 종족들에 따른 것입니다’는 현대 한국어 문장으로 부자연스럽습니다. 또한 ‘종족’은 보통 민족·ethnic group의 뜻으로 이해되기 쉬워 지파 내부 친족 단위에는 ‘씨족’이 더 적절합니다.
