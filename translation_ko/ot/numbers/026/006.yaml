translation:
  language: ko
  text: 헤스론에게서는 헤스론 씨족이, 카르미에게서는 카르미 씨족이 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘헤스론에게는 헤스론 사람들의 씨족, 카르미에게는 카르미 사람들의 씨족’입니다. 히브리어의 앞붙은 לְ는 이 족보·인구조사 문맥에서 계통적 유래나 분류를 나타냅니다.
    reason: lexical_alternative
