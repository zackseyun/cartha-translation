  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
  footnotes:
  - marker: a
    text: Hebrew literally, “a daughter of Levi.” In genealogical contexts, “daughter” can sometimes function more broadly for a female descendant.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “whom she bore to Levi in Egypt,” with the mother left implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 암람의 아내의 이름은 요게벳[a]이니, 레위의 딸이며, 레위에게서 이집트에서 난 여자입니다. 그녀는 암람에게 아론과 모세[b]를 낳았고, 그들의 누이 미리암도 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘레위의 딸’입니다. 족보 문맥에서는 ‘딸’이 더 넓게 여자 후손을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그녀가 레위에게서 이집트에서 낳은 자들’에 가깝고, 모친은 암시되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  english_pob_choice: The name of Amram’s wife
  chosen_korean: 암람의 아내의 이름은
  alternatives_korean:
  - 그리고 암람의 아내의 이름은
  - 암람의 아내 이름은
  lexicon: HALOT
  rationale: 히브리어의 도입 공식 וְשֵׁם을 자연스러운 한국어 서술문으로 옮기되, 소유 관계는 분명히 유지했습니다.
- source_word: בַּת לֵוִי
  english_pob_choice: a daughter of Levi
  chosen_korean: 레위의 딸
  alternatives_korean:
  - 레위의 여자 후손
  - 레위에게 속한 딸
  lexicon: HALOT
  rationale: 본문의 직역적 표현을 살려 genealogical tension을 평탄화하지 않았고, 영어 POB의 어휘 선택도 반영했습니다.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  english_pob_choice: who was born to Levi in Egypt
  chosen_korean: 레위에게서 이집트에서 난 여자입니다
  alternatives_korean:
  - 레위에게서 이집트에서 태어난 여자입니다
  - 레위에게서 이집트에서 그를 낳은 여자입니다
  lexicon: HALOT
  rationale: 히브리어는 모친을 명시하지 않은 채 ‘레위에게 …’라는 관계를 드러내므로, 한국어도 무리하게 주어를 보충하지 않고 자연스러운 수동 표현으로 옮겼습니다.
- source_word: וַתֵּלֶד לְעַמְרָם אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  english_pob_choice: She bore to Amram Aaron and Moses, and Miriam their sister
  chosen_korean: 그녀는 암람에게 아론과 모세를 낳았고, 그들의 누이 미리암도 낳았습니다
  alternatives_korean:
  - 그녀는 암람에게 아론과 모세를 낳았고, 미리암 그들의 누이도 낳았습니다
  - 그녀는 암람에게 아론과 모세를 낳았고, 그들의 누이 미리암을 낳았습니다
  lexicon: HALOT
  rationale: לְעַמְרָם의 부정확한 직역보다 한국어 자연성을 살려 ‘암람에게’를 택했고, אֲחֹתָם은 관계를 명시하는 ‘그들의 누이’로 보존했습니다.
theological_decisions:
- issue: 레위의 딸이라는 족보 표현의 처리
  chosen_reading: 본문의 직설적 족보 표현을 유지해 ‘레위의 딸’로 옮겼습니다.
  alternative_readings:
  - 레위의 후손
  - 레위 계통의 여자
  rationale: 본문이 제기하는 족보적 긴장을 해소하려고 의미를 확장하지 않고, 독자가 본문 자체를 마주하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 여성 대명사와 출산 동사의 처리
  chosen_reading: 모친을 덧붙여 해석하지 않고, ‘그녀는 … 낳았고’로 단정하게 옮겼습니다.
  alternative_readings:
  - 그 여인이 … 낳았습니다
  - 그녀가 … 낳았습니다
  rationale: 히브리어의 간결한 서술을 따라가되 한국어에서 주어와 행위를 분명히 하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3
