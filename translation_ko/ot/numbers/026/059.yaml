base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
  footnotes:
  - marker: a
    text: Hebrew literally, “a daughter of Levi.” In genealogical contexts, “daughter” can sometimes function more broadly for a female descendant.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “whom she bore to Levi in Egypt,” with the mother left implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 암람의 아내의 이름은 요게벳[a]이었습니다. 그는 레위의 딸로서, 이집트에서 레위에게서 태어났습니다[b]. 요게벳은 암람에게 아론과 모세와 그들의 누이 미리암을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘레위의 딸’입니다. 족보 문맥에서 ‘딸’은 더 넓게 여자 후손을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그녀를 이집트에서 레위에게 낳은’이라고 하며, 낳은 어머니는 명시하지 않습니다.
    reason: lexical_alternative
