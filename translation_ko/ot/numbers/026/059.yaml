theological_decisions:
- issue: 레위의 딸이라는 족보 표현의 처리
  chosen_reading: 본문의 직설적 족보 표현을 유지해 ‘레위의 딸’로 옮겼습니다.
  alternative_readings:
  - 레위의 후손
  - 레위 계통의 여자
  rationale: 본문이 제기하는 족보적 긴장을 해소하려고 의미를 확장하지 않고, 독자가 본문 자체를 마주하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 여성 대명사와 출산 동사의 처리
  chosen_reading: 모친을 덧붙여 해석하지 않고, ‘그녀는 … 낳았고’로 단정하게 옮겼습니다.
  alternative_readings:
  - 그 여인이 … 낳았습니다
  - 그녀가 … 낳았습니다
  rationale: 히브리어의 간결한 서술을 따라가되 한국어에서 주어와 행위를 분명히 하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3
