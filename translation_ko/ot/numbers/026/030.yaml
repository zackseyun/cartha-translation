  - 길르앗의 후손들
  lexicon: HALOT
  rationale: 히브리어 친족·계보 용어를 직역해 보존했습니다. 이 문맥에서는 개별 아들들뿐 아니라 씨족의 시조들을 가리킬 수 있습니다.
- source_word: מִשְׁפַּחַת הָאִיעֶזְרִי / הַחֶלְקִי
  english_pob_choice: the clan of the Iezerites / the Helekites
  chosen_korean: 이에셀 사람들의 씨족 / 헬렉 사람들의 씨족
  alternatives_korean:
  - 이에셀 씨족 / 헬렉 씨족
