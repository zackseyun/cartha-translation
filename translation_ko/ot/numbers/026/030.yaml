  rationale: מִשְׁפָּחָה를 '씨족'으로 옮겨 민족 내부의 하위 단위를 드러냈고, gentilicial 형식은 '사람들'로 풀어 한국어의 계보 표현을 자연스럽게 만들었습니다.
- source_word: אִיעֶזֶר / חֵלֶק
  english_pob_choice: Iezer / Helek
  chosen_korean: 이에셀 / 헬렉
  alternatives_korean:
