  naturalness: ‘이들은 길르앗의 아들들입니다’ 자체는 이해 가능하나, 뒤의 ‘~에게는 씨족이 있고’는 현대 한국어에서 부자연스럽고 명칭과 씨족의 관계도 모호합니다. ‘길르앗의 아들들은 … 이러합니다’ 및 병행되는 ‘~에게서 난 ~ 씨족’은 족보 문맥에서 자연스럽고 격식 있는 표현입니다.
