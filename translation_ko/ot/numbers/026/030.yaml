  - 이에저 / 헬렉
  lexicon: BDB
  rationale: 고유명사는 현행 음역 관행과 표준 한국어 외래어 표기 원칙을 따라 옮겼습니다. 첫 이름은 영어 POB의 Iezer를 참고하되 히브리어 자음값을 고려해 '이에셀'로 정했습니다.
theological_decisions:
- issue: בְּנֵי גִלְעָד의 범위
  chosen_reading: '''길르앗의 아들들''은 직계 아들에만 한정하지 않고, 이 절의 씨족 창시자들을 가리키는 족보적 표현으로 이해했습니다.'
  alternative_readings:
  - '''길르앗의 자손들''로 완화'
  - 직계 남성 자녀로만 한정
  rationale: 민수기 26장의 인구조사는 씨족·종족 단위를 열거하는 문맥이므로, 번역도 그 집합적 의미를 보존하는 것이 본문 기능에 맞습니다.
  doctrine_reference: 민수기 26장 족보/인구조사 문맥
