  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Gilead' can denote male-line descendants or constituent clans, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 길르앗의 아들들입니다. 이에셀에게는 이에셀 사람들의 씨족이 있고, 헬렉에게는 헬렉 사람들의 씨족이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '길르앗의 아들들'은 직계 아들만이 아니라 남계 후손이나 구성 씨족들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이들은 …입니다
  alternatives_korean:
  - 이들은 …였습니다
  - 이는 …입니다
  lexicon: BDB
  rationale: 족보·인구조사 문맥의 지시어를 자연스러운 현대 한국어로 옮기되, 목록의 확인 진술이라는 기능을 살려 현재형 서술로 처리했습니다.
- source_word: בְּנֵי גִלְעָד
