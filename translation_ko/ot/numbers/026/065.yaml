  source_fidelity: 히브리어 לָהֶם은 이 문맥에서 ‘그들에게’라고 옮기는 것이 가장 직접적입니다. 또한 מוֹת יָמֻתוּ의 강조는 ‘반드시 죽을 것입니다’로 적절히 보존할 수 있으나, 현 각주 a의 ‘죽는다면’은 조건 의미를 부가하여 수정이 필요합니다.
  naturalness: 합쇼체 서술은 자연스럽습니다. 다만 인용문을 먼저 제시한 뒤 ‘그들에게 말씀하셨기 때문입니다’라고 하는 편이 한국어 문장 구성과 히브리어의 여격을 모두 더 잘 반영합니다. 예외 구문은 ‘예외였습니다’보다 ‘…만 남았습니다’가 원문의 ‘남았다’와 직접 대응합니다.
  terminology: ‘야훼’, ‘광야’, ‘여분네’, ‘갈렙’, ‘여호수아’, ‘눈’은 일관되고 적절합니다. ‘한 사람도’는 אִישׁ의 분배적 부정 의미를 자연스럽게 전달합니다.
