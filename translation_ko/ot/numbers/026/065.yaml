revisions:
- from: 야훼께서 그들에 대해 말씀하셨기 때문입니다. 「그들은 반드시 광야에서 죽을 것입니다」라고 하셨고, 그들 가운데는 한 사람도 남지 않았습니다. 다만 여분네의 아들 갈렙과 눈의 아들 여호수아는 예외였습니다.[a][b]
  to: 야훼께서 그들에게 “그들은 반드시 광야에서 죽을 것입니다”라고 말씀하셨기 때문입니다.[a] 그들 가운데 한 사람도 남지 않았습니다.[b] 다만 여분네의 아들 갈렙과 눈의 아들 여호수아만 남았습니다.
  rationale: 원문의 여격 ‘그들에게’를 회복하고, 강조형 각주에서 조건 의미를 제거했습니다. 또한 예외 구문을 ‘…만 남았습니다’로 다듬어 원문의 ‘남다’와 예외 표지를 직접 반영했습니다. 각주 표지는 해당 본문 구절에 각각 연결했습니다.
