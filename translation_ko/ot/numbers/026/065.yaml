source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
  footnotes:
  - marker: a
    text: 'Hebrew: ''dying they shall die,'' an emphatic form meaning ''they shall surely die.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and no one remained of them'; Hebrew literally, 'and not a man was left from them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그들에 대해 말씀하셨기 때문입니다. 「그들은 반드시 광야에서 죽을 것입니다」라고 하셨고, 그들 가운데는 한 사람도 남지 않았습니다. 다만 여분네의 아들 갈렙과 눈의 아들 여호수아는 예외였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조형으로 직역하면 ‘죽는다면 그들은 죽을 것이다’이며, 뜻은 ‘반드시 죽을 것이다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그들로부터 한 사람이 남지 않았다’이며, 뜻은 ‘한 사람도 남지 않았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와/주 대치가 아니라 고유한 신명(神名) 자체이므로, 기존 POB의 원칙에 따라 음역형 ‘야훼’를 사용합니다.
- source_word: אָמַר יְהוָה לָהֶם
  english_pob_choice: had said of them
  chosen_korean: 그들에 대해 말씀하셨기 때문입니다
  alternatives_korean:
  - 그들에 관하여 말씀하셨기 때문입니다
  - 그들에게 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: לָהֶם은 여기서 대상/관련 대상을 표시하므로, 한국어에서는 ‘~에 대해’가 자연스럽고 본문의 설명적 연결을 잘 살립니다.
- source_word: מוֹת יָמֻתוּ
  english_pob_choice: They shall surely die
  chosen_korean: 반드시 … 죽을 것입니다
  alternatives_korean:
  - 정녕 죽을 것입니다
  - 틀림없이 죽을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+동사형이 주는 강한 강조를 한국어의 ‘반드시’로 옮겨, 단순 미래보다 확정성과 강조를 드러냅니다.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  english_pob_choice: and not a man was left from them
  chosen_korean: 그들 가운데는 한 사람도 남지 않았습니다
  alternatives_korean:
  - 그들 가운데 남은 사람이 없었습니다
  - 그들 가운데는 사람 하나도 남지 않았습니다
  lexicon: HALOT
  rationale: 직역의 ‘한 남자도 남지 않았다’는 한국어에서 다소 부자연스러워, 분배적 의미를 유지하면서도 자연스러운 ‘한 사람도 남지 않았습니다’로 옮겼습니다.
- source_word: כִּי אִם
  english_pob_choice: except
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 예외로
  lexicon: HALOT
  rationale: 부정문 뒤의 예외를 나타내는 관용구이므로, 한국어에서는 간결한 예외 표지 ‘다만’이 가장 자연스럽습니다.
theological_decisions:
- issue: 여호와/주 대치와 하나님의 이름 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 출애굽기-민수기 전승의 언약적 신명 사용을 그대로 드러내므로, 전통적 대치어보다 이름 자체를 보존하는 번역이 소스 친화적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
