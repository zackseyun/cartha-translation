  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: ko
  text: 예셀에게서 나온 족속은 예셀 사람의 종족이고, 실렘에게서 나온 족속은 실렘 사람의 종족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  english_pob_choice: of Iezer
  chosen_korean: 예셀에게서 나온
  alternatives_korean:
  - 예셀의
  - 예셀에게 속한
  lexicon: BDB
  rationale: 계보·족보 문맥의 ל는 소속을 자연스럽게 나타내므로, 한국어에서는 ‘~에게서 나온’으로 옮겨 두 집단의 기원을 분명히 했습니다.
- source_word: מִשְׁפַּחַת
  english_pob_choice: the clan of
  chosen_korean: 족속
  alternatives_korean:
  - 가문
  - 씨족
  lexicon: HALOT
  rationale: 민수기의 지파·인구 조사 문맥에서 מִשְׁפָּחָה는 현대적 ‘가족’보다 넓은 친족 단위를 가리키므로, ‘족속’이 그 사회적 범위를 비교적 정확히 반영합니다.
- source_word: הַ/יִּצְרִי
  english_pob_choice: the Iezerites
  chosen_korean: 예셀 사람의
  alternatives_korean:
  - 예셀 족속의
  - 예셀 가문의
  lexicon: HALOT
  rationale: 히브리어의 친족형 형용사는 출신자/후손 집단을 뜻하므로, ‘예셀 사람’으로 처리해 원문의 파생 관계를 드러냈습니다.
- source_word: לְ/שִׁלֵּם
  english_pob_choice: of Shillem
  chosen_korean: 실렘에게서 나온
  alternatives_korean:
  - 실렘의
  - 실렘에게 속한
  lexicon: BDB
  rationale: 첫 절과 같은 계보 표지 ל를 반복 구조에 맞게 동일하게 옮겨, 나열 형식을 살렸습니다.
- source_word: הַשִּׁלֵּמִי
  english_pob_choice: the Shillemites
  chosen_korean: 실렘 사람의
  alternatives_korean:
  - 실렘 족속의
  - 실렘 가문의
  lexicon: HALOT
  rationale: 두 번째 친족형 표현도 동일하게 ‘~사람’으로 옮겨, 앞 절과 대칭을 이루도록 했습니다.
