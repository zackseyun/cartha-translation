    issue: ‘족속은 … 사람의 종족’이라는 중복 표현
    rationale: 각 절의 מִשְׁפַּחַת הַיִּצְרִי/הַשִּׁלֵמִי는 ‘예셀/실렘 씨족’이라는 하나의 친족 집단을 가리킵니다. 초안은 이를 두 겹의 집단 명사로 풀어 의미 관계가 부자연스럽고 불필요하게 장황해집니다.
  revised_text: 예셀에게서는 예셀 씨족이, 실렘에게서는 실렘 씨족이 나왔습니다.
