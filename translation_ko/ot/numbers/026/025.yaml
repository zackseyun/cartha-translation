translation:
  language: ko
  text: 이것들은 잇사갈의 씨족들입니다. 곧 그들로부터 계수된 자들에 따라서는 육만사천삼백 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 수대로’, 혹은 ‘그들의 등록에 따라’로 옮길 수 있습니다. 히브리어 표현은 이 씨족들에서 계수된 사람들의 인구조사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
