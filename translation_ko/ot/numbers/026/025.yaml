  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
  footnotes:
  - marker: a
    text: Or, 'according to their number' or 'by their enrollment.' The Hebrew expression refers to the census count of those registered from these clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 잇사갈의 씨족들이며, 그들 가운데 계수된 자들은 육만 사천삼백 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 수대로’ 혹은 ‘그들의 등록에 따라’로 옮길 수 있습니다. 히브리어 표현은 이 씨족들에 속하여 계수된 사람들, 곧 인구 조사에서 등록된 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것은 …입니다
  lexicon: HALOT
  rationale: 서술적 총괄 도입 표현으로 자연스럽게 옮기되, 족보/계수 문맥의 복수 지시를 유지했습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 족속들
  - 가족들
  lexicon: HALOT
  rationale: 지파 안의 확장 친족 단위를 가리키므로, 일반적인 ‘가족들’보다 집단적·족보적 성격이 드러나는 ‘씨족들’이 적절합니다.
- source_word: לִפְקֻדֵיהֶם
  english_pob_choice: according to those numbered from them
  chosen_korean: 그들로부터 계수된 자들에 따라
  alternatives_korean:
  - 그들의 계수에 따라
  - 그들 가운데 등록된 자들에 따라
  - 그들로부터 조사된 자들에 따라
  lexicon: HALOT
  rationale: פקד의 계수/등록 의미를 살리면서, 단순한 수량이 아니라 ‘계수된 사람들’을 가리키는 관계를 분명히 했습니다.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  english_pob_choice: sixty-four thousand and three hundred
  chosen_korean: 육만사천삼백 명
  alternatives_korean:
  - 64,300명
  - 육십사만 삼백 명
  lexicon: HALOT
  rationale: 히브리어 수량을 현대 한국어의 자연스러운 수사 순서로 옮기되, 총계를 정확히 보존했습니다.
