revisions:
- from: 이것은 납달리의 종족들이요, 그들의 분류에 따른 자들이며, 그들 가운데 계수된 자는 사만오천사백 명이었습니다.[a][b]
  to: 이들은 그들의 종족에 따른 납달리의 종족들입니다.[a] 그 가운데 계수된 사람은 사만 오천사백 명이었습니다.[b]
  rationale: 종족을 가리키는 첫 절과 계수된 사람들을 가리키는 둘째 절을 분명히 구분했습니다. 원문의 반복적 계수 공식은 유지하되, 초안의 ‘분류에 따른 자들’이 낳는 지시 대상의 혼동을 제거했습니다. 각주 표지는 해당 본문 어구 뒤로 옮기고, b 각주는 본문 복제가 아닌 유효한 대안으로 고쳤습니다.
