theological_decisions:
- issue: 족보/계수 공식에서 ‘clans’와 ‘numbered’의 반복을 어떻게 처리할지
  chosen_reading: 반복되는 분류·계수 어휘를 그대로 살려, 지파의 행정적 계수 기록이라는 성격을 드러냈습니다.
  alternative_readings:
  - 더 매끄럽게 의역하여 단순한 인원 보고로 만들기
  - ‘가족’처럼 더 친숙한 표현으로 완화하기
  rationale: 본문은 서정문이 아니라 호적/계수 공식이므로, 구조적 반복과 행정적 톤을 유지하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 1–4장과 26장의 지파 계수 서술
