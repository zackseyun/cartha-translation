id: NUM.26.54
reference: Numbers 26:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
  footnotes:
  - marker: a
    text: Hebrew 'each man' uses a masculine singular distributively; the sense is that each tribal group receives its inheritance in proportion to its census count.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to his numbered ones' / 'according to his census count.' The Hebrew phrase is concise and ties the allotment directly to the number counted.
    reason: lexical_alternative
translation:
  language: ko
  text: 수효가 많은 집단에는 그 기업을 더 크게 배정하고, 수효가 적은 집단에는 그 기업을 더 작게 배정하십시오[a]. 각 집단의 기업은 그 집단에서 계수된 사람들의 수에 따라 주어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수효가 많은 집단’과 ‘수효가 적은 집단’은 각각 인구가 더 많고 더 적은 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 직역하면 ‘각자의 계수된 자들에 따라’입니다. 곧 각 집단의 기업은 그 집단에 속하여 계수된 사람들의 수에 비례하여 주어진다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב / תַּרְבֶּה
  english_pob_choice: to the larger group / you shall increase
  chosen_korean: 큰 무리에게는 … 늘리시고
  alternatives_korean:
  - 많은 자들에게는 … 더하게 하시고
  - 더 큰 수에게는 … 증가시키시고
  lexicon: HALOT
  rationale: רַב은 여기서 단순한 수량형용사가 아니라 인구가 더 많은 집단을 가리키므로, 한국어에서는 ‘큰 무리’가 가장 자연스럽고 분배 맥락도 잘 드러냅니다.
- source_word: וְלַמְעַט / תַּמְעִיט
  english_pob_choice: and to the smaller group / you shall diminish
  chosen_korean: 작은 무리에게는 … 줄이십시오
  alternatives_korean:
  - 적은 자들에게는 … 줄이십시오
  - 더 작은 수에게는 … 감하시고
  lexicon: HALOT
  rationale: מְעַט도 동일하게 집단의 상대적 크기를 가리키므로 ‘작은 무리’로 옮기고, 상속 분량을 실제로 줄이는 뜻은 ‘줄이십시오’로 자연스럽게 풀었습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: its inheritance
  chosen_korean: 그들의 기업
  alternatives_korean:
  - 그들의 상속분
  - 그들의 몫
  lexicon: HALOT
  rationale: נַחֲלָה는 토지 분배 문맥의 ‘기업/상속된 몫’이므로, 본문 전체의 언약적 토지 배분을 살리기 위해 ‘기업’을 유지했습니다.
- source_word: אִישׁ לְפִי פְקֻדָיו
  english_pob_choice: each man's inheritance shall be given according to those numbered from him
  chosen_korean: 각 사람의 기업은 그가 등록된 수에 따라 주어질 것입니다
  alternatives_korean:
  - 각 남자의 기업은 그가 계수된 수에 따라 주어질 것입니다
  - 각 사람의 기업은 그의 인구조사 수에 따라 주어질 것입니다
  lexicon: HALOT
  rationale: אִישׁ은 여기서 분배 규칙을 일반화하는 분리적 용법이므로 ‘각 사람’이 합쇼체 문맥에 더 적절합니다. פְקֻדָיו는 ‘등록/계수된 수’를 뜻하므로, ‘그가 등록된 수’로 옮겨 인구조사와의 직접 연결을 유지했습니다.
- source_word: יֻתַּן
  english_pob_choice: shall be given
  chosen_korean: 주어질 것입니다
  alternatives_korean:
  - 배정될 것입니다
  - 나누어질 것입니다
  lexicon: HALOT
  rationale: 수동형 נתן의 기본 의미를 살리면서도 토지 분배 문맥에서 자연스럽게 읽히도록 ‘주어질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 지파/가문별 기업 배분의 기준이 ‘인구 수’와 직접 연결됨
  chosen_reading: 기업의 증감은 단순한 추첨이 아니라 계수된 수에 비례해 정해집니다.
  alternative_readings:
  - 기업은 임의로 더하거나 덜하는 것으로만 이해할 수 있음
  - ‘등록된 수’의 의미를 약화시켜 일반적 분배 원칙으로만 읽을 수 있음
  rationale: 본문은 문법적으로도 분배의 척도를 명시하므로, 인구조사 결과가 기업 배분의 기준이라는 긴장을 분명히 드러내야 합니다.
  doctrine_reference: 민수기 26장의 토지 분배와 언약 백성의 질서
