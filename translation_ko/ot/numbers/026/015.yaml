id: NUM.26.15
reference: Numbers 26:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
  footnotes:
  - marker: a
    text: Some English traditions read 'Ziphon' / 'Ziphionites' here (compare Genesis 46:16), but the Masoretic Text in this verse reads 'Zephon' (צפון), so 'Zephon' is retained in the main text.
    reason: textual_variant
translation:
  language: ko
  text: 갓의 아들들은 그들의 씨족별로 이러합니다. 제폰에게서 나온 제포니 씨족, 학기에게서 나온 학기 씨족, 수니에게서 나온 수니 씨족입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 영어 번역 전통은 여기서 ‘Ziphon’ / ‘Ziphionites’를 쓰지만, 이 절의 마소라 본문 히브리어는 ‘Zephon’(צפון)을 읽으므로 본문형을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  english_pob_choice: The sons of Gad
  chosen_korean: 갓의 아들들
  alternatives_korean:
  - 갓의 자손들
  - 갓의 후손들
  lexicon: HALOT
  rationale: 족보·지파 목록의 상투적 도입구를 살려 직계 계승을 드러내면서도 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 종족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 지파 내부의 하위 단위인 clan을 가리키므로, '씨족'이 가장 정확하고 목록형 표현인 '...별로'가 대응됩니다.
- source_word: לִצְפוֹן / מִשְׁפַּחַת הַצְּפוֹנִי
  english_pob_choice: of Zephon, the clan of the Zephonites
  chosen_korean: 제폰의 씨족, 곧 제포니인들의 씨족
  alternatives_korean:
  - 지폰의 씨족, 곧 지포니인들의 씨족
  - 제폰의 씨족, 곧 제폰 사람들의 씨족
  lexicon: HALOT
  rationale: 본문의 히브리어는 צפון(제폰/Zephon)이며, 이에 따른 씨족명은 gentillic 형태로 '제포니인들'이 가장 직접적입니다. 영어 전통의 Ziphon 계열은 본문 대신 전승 차이이므로 본문형을 따랐습니다.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  english_pob_choice: of Haggi, the clan of the Haggites
  chosen_korean: 학기의 씨족, 곧 학기인들의 씨족
  alternatives_korean:
  - 학기의 씨족, 곧 학기 사람들의 씨족
  - 학기의 가족, 곧 학기인들의 가족
  lexicon: HALOT
  rationale: 동일한 족보 공식에서 개인명과 파생 씨족명을 평행하게 살리기 위해 같은 구조를 반복했습니다.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  english_pob_choice: of Shuni, the clan of the Shunites
  chosen_korean: 수니의 씨족, 곧 수니인들의 씨족
  alternatives_korean:
  - 수니의 씨족, 곧 수니 사람들의 씨족
  - 수니의 가족, 곧 수니인들의 가족
  lexicon: HALOT
  rationale: 마지막 항목도 앞선 두 항목과 같은 족보 문형을 유지하여, 명칭과 씨족 파생형의 대응을 분명히 했습니다.
