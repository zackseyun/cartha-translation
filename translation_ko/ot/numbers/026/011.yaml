translation:
  language: ko
  text: 그러나 고라의 아들들은 죽지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 고라의 아들들은 죽지 않았습니다.” 히브리어 접속사 ו는 단순한 연결로도 옮길 수 있으나, 여기서는 앞선 죽음과의 대조를 나타내는 것으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: But the sons of
  chosen_korean: 고라의 아들들은
  alternatives_korean:
  - 그리고 고라의 아들들은
  - 그러나 고라의 아들들은
  lexicon: HALOT
  rationale: בְנֵי는 족보·서사 문맥에서 ‘아들들/자손들’로 옮기는 것이 자연스럽고, 영어 POB의 대비적 뉘앙스는 본문 흐름으로 드러나므로 한국어에서는 과도한 접속부사보다 평서형 주어로 간결하게 처리했습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라
  alternatives_korean:
  - 고락
  - 코라
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역 형태를 따랐습니다.
- source_word: לֹא מֵתוּ
  english_pob_choice: did not die
  chosen_korean: 죽지 않았습니다
  alternatives_korean:
  - 죽지 않았습니다
  - 죽은 것이 아니었습니다
  - 죽지 않았습니다
  lexicon: HALOT
  rationale: לֹא + 동사 מות은 단순한 부정 생존 진술이므로, 한국어에서는 자연스럽고 직접적인 ‘죽지 않았습니다’로 옮겼습니다.
theological_decisions:
- issue: 고라의 아들들에 대한 서술의 대비성
  chosen_reading: 앞절에서 고라의 집안에 임한 심판과 대비되는 생존 사실을 드러내도록, 본문 의미를 해치지 않는 범위에서 평서문으로 간명하게 옮겼습니다.
  alternative_readings:
  - 그러나 고라의 아들들은 죽지 않았습니다
  - 그리고 고라의 아들들은 죽지 않았습니다
  rationale: 히브리어 접속사 ו는 단순 연결도 가능하지만, 문맥상 앞선 죽음들과의 대비가 강하므로 한국어에서는 별도 접속어 없이도 그 대비가 읽히도록 했습니다.
  doctrine_reference: 민수기 16장 문맥의 심판-보존 대비
