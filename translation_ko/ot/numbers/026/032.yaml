  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: ko
  text: 스미다에게서 스미다 사람의 씨족이요, 헤벨에게서 헤벨 사람의 씨족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  english_pob_choice: from Shemida
  chosen_korean: 스미다에게서
  alternatives_korean:
  - 스미다로부터
  - 그리고 스미다
  lexicon: HALOT
  rationale: 족장 이름 앞의 וּ는 이 명단에서 반복되는 분배 표지를 이루므로, 한국어에서는 관계 출발점을 나타내는 ‘-에게서’로 자연스럽게 풀었습니다.
- source_word: מִשְׁפַּ֖חַת
  english_pob_choice: the clan of
  chosen_korean: 씨족의
  alternatives_korean:
  - 가문의
  - 가족의
  lexicon: HALOT
  rationale: 민수기의 인구조사 문맥에서 מִשְׁפָּחָה는 단순한 가족보다 부족 아래의 하위 혈연 단위를 가리키므로 ‘씨족’이 가장 정확합니다.
- source_word: הַ/שְּׁמִידָעִי
  english_pob_choice: the Shemidaites
  chosen_korean: 스미다 사람의
  alternatives_korean:
  - 스미다이트의
  - 스미다 족속의
  lexicon: HALOT
  rationale: 지칭 형용사는 해당 조상에게 속한 집단을 뜻하므로, 한국어에서는 이해가 쉬운 ‘사람’ 표현으로 혈통 소속을 드러냈습니다.
- source_word: וְ/חֵפֶר
  english_pob_choice: and from Hepher
  chosen_korean: 헤벨에게서
  alternatives_korean:
  - 그리고 헤벨
  - 헤벨로부터
  lexicon: HALOT
  rationale: 앞 항목과 같은 열거 구조이므로, 연결사 וְ를 단순한 ‘그리고’보다 분배를 나타내는 ‘-에게서’로 옮겨 목록의 패턴을 살렸습니다.
- source_word: הַֽ/חֶפְרִֽי
  english_pob_choice: the Hepherites
  chosen_korean: 헤벨 사람의
  alternatives_korean:
  - 헤벨족의
  - 헤벨 사람들의
  lexicon: HALOT
  rationale: 지시 형용사의 집단 표지를 한국어 속성 표현으로 옮겨, 앞 구문과 대칭을 이루게 했습니다.
theological_decisions:
- issue: 족보·씨족 목록에서의 반복 공식 표현
  chosen_reading: 서술을 평서형으로 유지하되, 히브리어의 명사구 병렬 구조를 한국어에서 ‘A에게서 B의 씨족’으로 살렸습니다.
  alternative_readings:
  - ‘스미다의 씨족, 헤벨의 씨족’처럼 더 압축하는 방식
  - ‘스미다에게서 나온 씨족’처럼 동사화하는 방식
  rationale: 원문은 동사적 서술보다 명사구 열거를 통해 출신 집단을 기록하므로, 한국어도 그 공식성을 유지하는 쪽이 소스 충실도가 높습니다.
  doctrine_reference: 민수기 26장의 지파·씨족 인구조사 문맥
