revisions:
- from: '이것들은 단의 자손들입니다. 그들의 종족에 따라: 수함의 자손, 곧 수함 사람들의 종족입니다. 이것들은 단의 종족들입니다. 그들의 가문에 따라.[a]'
  to: 단의 자손들은[a] 그들의 씨족에 따라 이러합니다. 수함에게서 수함 씨족이 나왔습니다. 이들은 그들의 씨족에 따른 단의 씨족들입니다.
  rationale: 부족 내부의 계보 단위를 뜻하는 מִשְׁפָּחָה를 ‘씨족’으로 일관되게 번역하고, 반복되는 לְמִשְׁפְּחֹתָם도 동일하게 반영했습니다. 수함을 씨족의 조상으로 제시하는 לְשׁוּחָם은 ‘수함에게서’로 자연스럽게 옮겼습니다. 각주는 설명 대상인 ‘자손들’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:14Z'
