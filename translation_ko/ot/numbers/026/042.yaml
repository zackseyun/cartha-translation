    rationale: 두 곳 모두 לְמִשְׁפְּחֹתָם이며, 본문은 의도적으로 공식을 반복합니다.
  - severity: medium
    issue: 각주 표지가 ‘단의 자손들’이 아니라 구절 끝에 놓임
    rationale: 각주의 설명 대상은 בְנֵי דָן이므로 해당 번역어 바로 뒤에 표지를 두어야 합니다.
