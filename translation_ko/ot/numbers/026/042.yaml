translation:
  language: ko
  text: '이것들은 단의 자손들입니다. 그들의 종족에 따라: 수함의 자손, 곧 수함 사람들의 종족입니다. 이것들은 단의 종족들입니다. 그들의 가문에 따라.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘단의 자손들’. 이 족보·인구조사 공식에서는 ‘아들들’이 지파의 후손 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단의 자손들
  alternatives_korean:
  - 단의 아들들
  - 단의 후손들
  lexicon: HALOT
  rationale: 족보·인구조사 공식에서 בְנֵי는 혈연 후손을 가리키는 집합 표현이므로, 영어 POB의 ‘sons of Dan’을 반영하되 한국어에서는 자연스럽고 성별 과잉을 피하지 않는 ‘자손들’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans / by their families
  chosen_korean: 그들의 종족에 따라
  alternatives_korean:
  - 그들의 가문에 따라
  - 그들의 씨족에 따라
  lexicon: HALOT
  rationale: 민수기 인구조사 문맥의 מִשְׁפָּחָה는 단순한 핵가족보다 부족 내 하위 집단을 뜻하므로, POB의 clan/families를 한국어로는 문맥상 ‘종족’이 가장 가까운 집단 개념으로 옮겼습니다.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  english_pob_choice: the clan of the Shuhamites
  chosen_korean: 수함 사람들의 종족
  alternatives_korean:
  - 수함 사람들의 가문
  - 수함 족속
  lexicon: HALOT
  rationale: שורש과 gentilic 형식을 살려 ‘수함 사람들’로 집단성을 드러내고, 이어지는 מִשְׁפַּחַת를 같은 어휘군인 ‘종족’으로 반복해 계보적 연결을 분명하게 했습니다.
- source_word: מִשְׁפְּחֹת דָּן
  english_pob_choice: the clans of Dan
  chosen_korean: 단의 종족들
  alternatives_korean:
  - 단의 가문들
  - 단의 씨족들
  lexicon: HALOT
  rationale: 마지막 요약구는 앞의 종족 용어를 되풀이하는 결론부이므로, POB의 ‘the clans of Dan’에 맞춰 ‘단의 종족들’로 일관되게 처리했습니다.
theological_decisions:
- issue: 족보 공식에서 ‘sons of Dan’의 성별 표지 유지 여부
  chosen_reading: 남성형 직역을 기계적으로 고집하지 않고, 계보·부족 단위의 집합 표현으로 이해되도록 ‘단의 자손들’로 옮겼습니다.
  alternative_readings:
  - 단의 아들들
  - 단의 후손들
  rationale: 본문은 개인 남자들을 열거하는 것이 아니라 지파 구성원 전체를 세는 족보·인구조사 공식이므로, 독자가 계보적 범주로 이해하도록 하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 족보/인구조사 문맥
