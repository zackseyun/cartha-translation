  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
  footnotes:
  - marker: a
    text: Ahiram in the Masoretic Text corresponds to 'Ahiam' in some textual traditions and English versions; the main text follows the Hebrew reading here.
    reason: textual_variant
translation:
  language: ko
  text: 베냐민의 아들들은 그들의 가문별로 이러합니다. 벨라의 가문은 벨라인 가문이고, 아스벨의 가문은 아스벨인 가문이며, 아히람의 가문은 아히람인 가문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마소라 본문은 ‘아히람’으로 읽지만, 일부 본문 전승과 영어판에서는 ‘아히암’이 나타납니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: The sons of Benjamin
  chosen_korean: 베냐민의 아들들
  alternatives_korean:
  - 베냐민의 자손들
  - 베냐민의 자녀들
  lexicon: WLC
  rationale: 족보·인구 조사 공식에서 בְּנֵי는 문자적으로 ‘아들들’이지만, 한국어에서는 속격 구조로 옮기면 계통 소속을 자연스럽게 드러낼 수 있습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 가문별로
  alternatives_korean:
  - 그들의 지파별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 개인 가족보다 씨족·가문 단위를 가리키므로, ‘가문별로’가 가장 정확하고 한국어 조사형식도 자연스럽습니다.
- source_word: מִשְׁפַּחַת הַבַּלְעִי / הָאַשְׁבֵּלִי / הָאֲחִירָמִי
  english_pob_choice: the clan of the Belaites / Ashbelites / Ahiramites
  chosen_korean: 벨라인 가문 / 아스벨인 가문 / 아히람인 가문
  alternatives_korean:
  - 벨라 사람들의 가문 / 아스벨 사람들의 가문 / 아히람 사람들의 가문
  - 벨라인 족속 / 아스벨인 족속 / 아히람인 족속
  lexicon: HALOT
  rationale: 히브리어 종족형 형용사를 한국어에서는 ‘-인’으로 옮겨 혈연적 소속을 드러냈습니다. ‘가문’과 결합하면 רשימה의 반복 구조를 유지하면서도 현대 한국어에서 과도하게 생소하지 않습니다.
- source_word: לְבֶלַע / לְאַשְׁבֵּל / לַאֲחִירָם
  english_pob_choice: of Bela / of Ashbel / of Ahiram
  chosen_korean: 벨라의 / 아스벨의 / 아히람의
  alternatives_korean:
  - 벨라에게 속한 / 아스벨에게 속한 / 아히람에게 속한
  - 벨라의 후손인 / 아스벨의 후손인 / 아히람의 후손인
  lexicon: HALOT
  rationale: 열거문에서 ל는 해당 가문의 선조를 표시하므로, 관계를 직접 드러내는 속격 ‘-의’가 가장 간결하고 원문 구조를 보존합니다.
theological_decisions:
- issue: 족보 열거의 반복 구조를 한국어에서 어떻게 보존할지
  chosen_reading: 반복되는 ‘가문’과 속격 구조를 유지해, 본문의 행정적·계보적 열거 성격이 드러나게 했습니다.
  alternative_readings:
  - 문장을 더 유려하게 재배열하여 자연스럽게 풀어쓰기
  - 모든 항목을 같은 조사 없이 하나의 문장으로 압축
  rationale: 이 절은 서사보다 공식 목록의 성격이 강하므로, 의미를 희석하는 재구성보다 원문의 열거 리듬을 보존하는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 민수기 족보/인구조사 문맥의 계보적 정확성
