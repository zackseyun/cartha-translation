  terminology: מִשְׁפָּחָה는 이 문맥에서 지파 안의 친족 집단이므로 ‘족속’이 적절합니다. 이름은 한국어 성경 관례와 음역에 따라 ‘브리아’, ‘헤벨’, ‘말기엘’로 통일했습니다.
