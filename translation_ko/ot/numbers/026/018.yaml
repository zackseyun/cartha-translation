  - 그들 가운데서 شمار된 자들에 따라
  lexicon: פָּקַד / פְּקוּדִים
  rationale: 히브리어의 ‘계수하다/등록하다’ 의미를 살려, 인구 조사 결과를 반영하는 표현으로 옮겼습니다. 영어 본문의 ‘according to those numbered from them’ 취지를 유지했습니다.
