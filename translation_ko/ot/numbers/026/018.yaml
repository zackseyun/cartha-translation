  source_fidelity: 히브리어의 결구는 ‘갓 자손의 씨족들’과 ‘그들 가운데서 계수된 자들’ 및 총수 40,500명을 명료하게 제시합니다. 초안도 수치와 계수의 뜻은 보존하지만, ‘종족들’과 ‘갓의 아들들’은 이 문맥의 지파 내부 계보 단위를 한국어로 정확히 드러내기에 다소 부정확하거나 어색합니다.
