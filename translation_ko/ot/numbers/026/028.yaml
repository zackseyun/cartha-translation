lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 자녀들
  lexicon: HALOT
  rationale: 족보·계수 문맥에서 בְּנֵי는 직계 후손을 가리키므로, 영어 POB의 “sons of”에 맞추어 한국어도 “아들들”로 직역적 투명성을 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족대로
  alternatives_korean:
  - 그들의 가족대로
  - 그들의 종족대로
  - 씨족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 현대적 ‘가족’보다 부족·계통 단위인 ‘씨족’이 더 정확하며, לְ는 분류 기준을 나타내므로 ‘-대로’로 자연스럽게 옮겼습니다.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  english_pob_choice: Manasseh and Ephraim
  chosen_korean: 므낫세와 에브라임
  alternatives_korean:
  - 므낫세와 에브라임 지파
  - 므낫세와 에브랴임
  lexicon: modern Korean biblical proper nouns
  rationale: 문맥상 요셉의 두 아들/지파 이름이므로 표준 음역을 유지했고, 영어 본문처럼 부가 설명을 덧붙이지 않아 원문의 간결한 병렬을 보존했습니다.
theological_decisions:
- issue: 족보·계수 문맥에서의 집단 단위 표현
  chosen_reading: 개인 이름의 단순 열거가 아니라 요셉의 두 계통이 씨족 단위로 계수되는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 가계 소개로 읽는 것
  - 지파 명칭만 나열하는 것
  rationale: 본절은 민수기의 계수 표제 맥락 안에서 조상-후손 관계를 행정적으로 분류하는 구절이므로, ‘씨족대로’로 그 조직적 의미를 드러냈습니다.
  doctrine_reference: 민수기 26장의 이스라엘 계수와 족속 구조
