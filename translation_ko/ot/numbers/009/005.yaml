  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
  footnotes:
  - marker: a
    text: 'Hebrew: ''between the evenings,'' an idiom referring to the twilight period.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 첫째 달, 곧 그 달의 열나흗날 해질 무렵에 시내 광야에서 유월절을 지켰습니다. 야훼께서 모세에게 명령하신 모든 것대로 이스라엘 자손이 그렇게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “저녁들 사이에”이며, 해질 무렵을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפֶּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 유월절 제사
  lexicon: HALOT
  rationale: פֶּסַח은 여기서 제사 행위만이 아니라 절기 전체의 준행을 가리키므로, 한국어 성경 전통과 source 의미를 함께 살려 '유월절'로 옮겼습니다.
- source_word: בָּרִאשׁוֹן
  english_pob_choice: in the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫 달
  - 첫째 달의
  lexicon: HALOT
  rationale: 달력 표현으로 자연스러운 한국어를 위해 'month'를 보충하지 않고도 뜻이 드러나는 '첫째 달'로 옮겼습니다.
- source_word: בֵּין הָעַרְבַּיִם
  english_pob_choice: at twilight
  chosen_korean: 해질 무렵
  alternatives_korean:
  - 황혼에
  - 저녁 사이에
  lexicon: HALOT
  rationale: 직역의 관용구성보다 시간 의미를 분명히 드러내는 표현이 필요하므로, 영어 audit의 'twilight'에 맞춰 '해질 무렵'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 고유 신명 표기인 '야훼'를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 남성형 집합 표현을 무성별화하지 않고 한국어 성경에서 통용되는 직역형인 '이스라엘 자손'을 유지했습니다.
theological_decisions:
- issue: 유월절 준행의 서술 방식
  chosen_reading: '''지켰습니다''로 옮겨 예식의 준수와 행위를 함께 드러냈습니다.'
  alternative_readings:
  - 드렸습니다
  - 행하였습니다
  rationale: עשה는 단순히 '하다'이지만 פֶּסַח과 결합할 때는 절기를 준수한다는 뜻이 되므로, 영어 POB의 'kept'에 상응하는 한국어로 이해를 명확히 했습니다.
  doctrine_reference: Numbers 9:5 source-context rendering of ritual observance
- issue: 남성 복수 집합 표현 유지
  chosen_reading: '''이스라엘 자손''을 유지했습니다.'
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문은 문법적으로 남성 복수의 집합 표현이므로, 이를 평탄화하지 않고 source의 형태를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
