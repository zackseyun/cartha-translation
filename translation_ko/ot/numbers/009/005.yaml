  source_fidelity: 전반적으로 원문의 날짜, 장소, 유월절 준행, 야훼의 명령에 대한 전적 순종을 충실히 옮겼습니다. 다만 בֵּין הָעַרְבַּיִם에 관한 각주는 해당 표현 바로 뒤에 붙여야 그 지시 대상이 분명합니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. “첫째 달, 곧 그 달의 열나흗날”의 ‘곧’은 첫째 달과 그 달의 열나흗날이 동격인 듯한 불필요한 인상을 줄 수 있으므로, 일반적인 성경식 날짜 표현인 “첫째 달 열나흗날”로 다듬는 것이 더 정확하고 자연스럽습니다.
  terminology: ‘유월절’, ‘야훼’, ‘이스라엘 자손’, ‘지켰습니다’는 원문 및 영어 POB의 선택에 잘 부합합니다. ‘해질 무렵’은 בֵּין הָעַרְבַּיִם의 의미를 자연스럽게 전달하며, 직역 관용구는 각주로 보존하는 것이 적절합니다.
