  verdict: revise
  source_fidelity: 첫 절의 ‘아무것도’는 문맥상 파스카 제물/식사를 가리키지만, 히브리어 מִמֶּנּוּ(‘그것에서/그것의’)가 지닌 한정된 지시 대상을 한국어 본문에서 명시하는 편이 더 정확합니다. 또한 בּוֹ는 ‘그것의 뼈’를 뜻하므로 이를 드러내는 것이 안전합니다. 나머지 규례에 따른 파스카 준수의 의미는 적절합니다.
  naturalness: ‘그것을 아침까지 조금도 남겨 두지 말아야 하며, 그것의 뼈는 하나도 꺾어서는 안 됩니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 금지 규정의 병렬 구조도 잘 보존합니다.
  terminology: ‘파스카’, ‘규례’, ‘지키다’는 본문 및 제공된 용어 방침과 잘 맞습니다. ‘뼈를 꺾다’도 자연스럽습니다.
  issues:
