id: NUM.9.12
reference: Numbers 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
  footnotes:
  - marker: a
    text: Or, 'they shall not break any of its bones.'
    reason: lexical_alternative
  - marker: b
    text: The unbroken-bone requirement echoes the Passover instructions in Exodus 12:46.
    reason: cross_reference
translation:
  language: ko
  text: 아침까지는 아무것도 남겨 두지 말아야 하며, 뼈도 하나도 꺾어서는 안 됩니다. 파스카의 모든 규례대로 그것을 지켜야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뼈도 하나도 꺾어서는 안 됩니다’는 히브리어의 단수형 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 뼈를 꺾지 말라는 규정은 출애굽기 12:46의 파스카 지침을 반향합니다.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  english_pob_choice: They shall leave none of it until morning
  chosen_korean: 아침까지는 아무것도 남겨 두지 말아야 하며
  alternatives_korean:
  - 아침까지는 그것을 남기지 말아야 하며
  - 새벽까지는 아무것도 남겨 두지 말아야 하며
  lexicon: WLC / HALOT
  rationale: 부정형 히필 יַשְׁאִירוּ의 ‘남겨 두다/남기다’ 뜻과 עד בֹּקֶר의 시간 제한을 살려, 자연스러운 합쇼체로 옮겼습니다.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  english_pob_choice: and they shall not break a bone of it
  chosen_korean: 뼈도 하나도 꺾어서는 안 됩니다
  alternatives_korean:
  - 뼈를 하나도 부러뜨려서는 안 됩니다
  - 뼈 하나도 꺾지 말아야 합니다
  lexicon: WLC / HALOT
  rationale: עֶצֶם의 단수형을 분배적으로 살리되, 한국어에서는 ‘뼈를 꺾다/부러뜨리다’가 자연스러워 ‘꺾어서는 안 됩니다’로 옮겼습니다.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  english_pob_choice: according to all the statute of the Passover
  chosen_korean: 파스카의 모든 규례대로
  alternatives_korean:
  - 파스카의 온갖 규례대로
  - 파스카에 관한 모든 규정대로
  lexicon: WLC / HALOT
  rationale: חֻקָּה를 ‘규례’로, פֶּסַח를 출애굽기 용례에 맞춰 ‘파스카’로 옮겨 절기 규정의 성격을 분명히 했습니다.
- source_word: יַעֲשׂוּ אֹתוֹ
  english_pob_choice: they shall keep it
  chosen_korean: 그것을 지켜야 합니다
  alternatives_korean:
  - 그것을 행해야 합니다
  - 그것을 준행해야 합니다
  lexicon: WLC / HALOT
  rationale: 절기·규례에 대한 עשה는 단순 ‘행하다’보다 ‘지키다/준행하다’가 더 정확하므로, 관례적이면서도 원문 의미를 살렸습니다.
theological_decisions:
- issue: 파스카 용어 선택
  chosen_reading: 교회 전통의 ‘유월절’ 대신 원어 음역에 가까운 ‘파스카’를 본문에 사용했습니다.
  alternative_readings:
  - 유월절
  rationale: פֶּסַח는 출애굽 사건과 제의적 절기를 가리키는 핵심 용어이므로, 본 프로젝트의 원문 직결성과 용어 일관성을 위해 ‘파스카’를 채택했습니다.
  doctrine_reference: 용어 집행 원칙 / glossary default
