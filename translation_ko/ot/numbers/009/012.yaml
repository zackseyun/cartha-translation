source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
  footnotes:
  - marker: a
    text: Or, 'they shall not break any of its bones.'
    reason: lexical_alternative
  - marker: b
    text: The unbroken-bone requirement echoes the Passover instructions in Exodus 12:46.
    reason: cross_reference
translation:
  language: ko
  text: 그것을 아침까지 조금도 남겨 두지 말아야 하며, 그것의 뼈는 하나도 꺾어서는 안 됩니다.[a][b] 파스카의 모든 규례대로 그것을 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그것의 뼈 하나도 꺾지 말아야 합니다’입니다. 히브리어는 ‘뼈’를 단수형으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 뼈를 꺾지 말라는 규정은 출애굽기 12:46의 파스카 지침과 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  english_pob_choice: They shall leave none of it until morning
  chosen_korean: 아침까지는 아무것도 남겨 두지 말아야 하며
  alternatives_korean:
