    rationale: מִמֶּנּוּ는 단순한 절대적 ‘아무것도’가 아니라 파스카 제물/식사와 관련된 ‘그것에서 아무것도’를 뜻합니다. 한국어에서 ‘그것을 조금도’로 보완하면 의미 범위를 정확히 제한할 수 있습니다.
  - severity: low
