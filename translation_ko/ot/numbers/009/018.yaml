  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
  footnotes:
  - marker: a
    text: 'Hebrew: ''upon the mouth of the LORD,'' an idiom meaning ''at the command of the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 명령에 따라[a] 이스라엘 자손은 떠났고, 야훼의 명령에 따라 진을 쳤습니다. 구름이 성막 위에 머무는 모든 날 동안 그들은 진을 친 채로 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼의 입에 따라’라는 관용구를 사용하며, 여기서는 ‘야훼의 명령에 따라’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 입에 따라
  - 야훼의 말씀에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 עַל־פִּי는 문자적으로는 ‘입에 따라’이지만, 문맥상 권위 있는 지시를 뜻하므로 한국어에서는 자연스럽게 ‘명령에 따라’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 혈연적 표현을 그대로 살리되, 한국어 성경에서 널리 쓰이는 ‘이스라엘 자손’을 유지해 원문 형식을 드러냈습니다.
- source_word: יִסְעוּ / יַחֲנוּ
  english_pob_choice: set out / they camped
  chosen_korean: 출발하고 / 진을 쳤습니다
  alternatives_korean:
  - 떠나고 / 진을 쳤습니다
  - 길을 떠나고 / 머물렀습니다
  lexicon: HALOT
  rationale: נסע는 광야 맥락에서 ‘진을 거두고 떠남’의 뜻이므로 ‘출발하다’로, חנה는 군사적·광야적 정황을 살려 ‘진을 치다’로 옮겼습니다.
- source_word: יִשְׁכֹּן הֶעָנָן
  english_pob_choice: the cloud remained
  chosen_korean: 구름이 … 머무는
  alternatives_korean:
  - 구름이 … 거하는
  - 구름이 … 머무르는
  lexicon: HALOT
  rationale: שכן은 거주하다/머물다의 뜻이지만, 여기서는 성막 위에 잠시 드리운 구름의 지속 상태를 나타내므로 ‘머무는’이 가장 자연스럽습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 회막
  lexicon: HALOT
  rationale: מִשְׁכָּן은 야훼의 거처인 성막을 가리키므로, 본절에서는 한국어에서 곧바로 이해되는 ‘성막’을 택했습니다.
theological_decisions:
- issue: 야훼(YHWH) 인명 표기
  chosen_reading: 고유명사로서 ‘야훼’를 본문에 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문은 יְהוָה를 직접 사용하므로, 대체 호칭인 ‘주님’보다 신명 자체를 드러내는 ‘야훼’가 원문 대응에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
