id: NUM.9.14
reference: Numbers 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
  footnotes:
  - marker: a
    text: Or 'a stranger resides with you' or 'a foreigner lives among you.' The Hebrew ger refers to a resident foreigner living among Israel, not merely a traveler.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'does/makes the Passover,' an idiom meaning 'keeps' or 'observes' the Passover.
    reason: lexical_alternative
  - marker: c
    text: Or 'native-born of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희와 함께 사는 거류민[a]이 야훼께 유월절을 지키려[b] 하면, 그는 유월절의 규례와 그 법도대로 지켜야 합니다. 너희에게나 거류민에게나 그 땅의 본토인[c]에게나 한 가지 규례가 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희와 함께 거주하는 외국인’ 또는 ‘너희 가운데 사는 외국인’. 히브리어 ger는 단순한 여행자가 아니라 이스라엘 가운데 거주하는 외국인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유월절을 한다/만든다’라는 관용구로, ‘유월절을 지키다’ 또는 ‘유월절을 준수하다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅에서 난 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  english_pob_choice: a sojourner is staying with you
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인 거주자
  - 객
  lexicon: HALOT
  rationale: גֵּר는 단순한 여행자가 아니라 이스라엘 가운데 거주하는 외국인/거류자를 가리키므로, 한국어에서는 성경적·법률적 뉘앙스를 살리는 ‘나그네’가 가장 적절합니다.
- source_word: וְעָשָׂה פֶסַח
  english_pob_choice: would keep the Passover
  chosen_korean: 유월절을 지키려 하거든
  alternatives_korean:
  - 유월절을 행하려 하거든
  - 유월절을 지키고자 하거든
  - 유월절을 드리려 하거든
  lexicon: HALOT
  rationale: ‘עשה פסח’는 관용적으로 유월절을 ‘행하다/지키다’는 뜻이므로, 한국어에서도 예식·절기를 자연스럽게 나타내는 ‘지키다’를 택했습니다.
- source_word: כְּחֻקַּת הַפֶּסַח וּכְמִשְׁפָּטוֹ
  english_pob_choice: according to the statute of the Passover and according to its ordinance
  chosen_korean: 유월절의 규례와 그 법도에 따라
  alternatives_korean:
  - 유월절의 율례와 그 규례에 따라
  - 유월절의 규정과 그 절차에 따라
  - 유월절의 법규와 그 판례에 따라
  lexicon: HALOT
  rationale: חֻקָּה와 מִשְׁפָּט는 서로 겹치지만 구별되는 법적 용어이므로, 일반적이면서도 구분이 가능한 ‘규례’와 ‘법도’로 옮겼습니다.
- source_word: חֻקָּה אַחַת יִהְיֶה לָכֶם וְלַגֵּר וּלְאֶזְרַח הָאָרֶץ
  english_pob_choice: One statute shall be for you, for the sojourner, and for the native of the land.
  chosen_korean: 너희와 나그네와 그 땅의 본토인에게는 한 가지 규례가 있어야 합니다.
  alternatives_korean:
  - 너희와 나그네와 그 땅의 본토인에게는 하나의 규례가 있을 것입니다.
  - 너희와 나그네와 그 땅의 본토인에게는 같은 규례가 있어야 합니다.
  lexicon: HALOT
  rationale: הָאָרֶץ의 대조점은 ‘그 땅의 본토인’이므로, 지리적 소속과 출생의 대비를 드러내는 표현을 택했습니다. ‘한 가지 규례’는 단일 적용의 법적 동일성을 살립니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 언약명 יהוה가 직접 나오므로, 프로젝트 기본값에 따라 고유한 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 이방 거류민과 이스라엘 본토인에 대한 동일한 율례 적용
  chosen_reading: ‘한 가지 규례’로 동일 적용을 분명히 했습니다.
  alternative_readings:
  - 단순히 유월절 참여 허용만 말하는 읽기
  - 의례 절차만 가리키는 읽기
  rationale: 본문은 ‘너희’, ‘나그네’, ‘그 땅의 본토인’에게 ‘한 가지 규례’가 있다고 명시하므로, 유월절 준수의 법적 동등성을 현재 문맥 안에서 분명히 드러내야 합니다.
  doctrine_reference: 본문 문맥의 언약 공동체 내 법적 동일성
