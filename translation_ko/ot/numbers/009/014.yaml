revisions:
- from: 너희와 함께 거류하는 나그네가 야훼를 위해 유월절을 지키려 하거든, 그는 유월절의 규례와 그 법도에 따라 그것을 해야 합니다. 곧 그가 그대로 해야 합니다. 너희와 나그네와 그 땅의 본토인에게는 한 가지 규례가 있어야 합니다.[a][b][c]
  to: 너희와 함께 사는 거류민[a]이 야훼께 유월절을 지키려[b] 하면, 그는 유월절의 규례와 그 법도대로 지켜야 합니다. 너희에게나 거류민에게나 그 땅의 본토인[c]에게나 한 가지 규례가 있어야 합니다.
  rationale: 거류 외국인을 뜻하는 גֵּר를 ‘거류민’으로 바로잡아 원문의 정착성과 법적 대비를 보존했습니다. 유월절 준수의 방식과 의무를 한 문장으로 자연스럽게 표현하되, ‘규례’와 ‘법도’의 병렬 및 모두에게 적용되는 ‘한 가지 규례’를 유지했습니다. 각주 표지를 해당 낱말·관용구에 연결하고, 대안 각주를 실질적인 번역 대안으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
