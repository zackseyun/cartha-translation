  - 야훼께 드리는 제물
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적 ‘제물/예물’인데, 제사장적 문맥에서 가장 직접적인 표현인 ‘제물’을 선택했습니다.
- source_word: בְּמֹעֲדוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 그 정해진 때에
  alternatives_korean:
