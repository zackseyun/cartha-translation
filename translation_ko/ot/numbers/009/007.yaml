  lexicon: HALOT
  rationale: מוֹעֵד의 핵심은 정해진 예식 시점이므로, 자연스러운 한국어로 ‘정해진 때’로 옮겼습니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
