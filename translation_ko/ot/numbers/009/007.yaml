base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
  footnotes:
  - marker: a
    text: Hebrew literally, “unclean for the soul of a man,” an idiom meaning unclean through contact with a human corpse.
    reason: lexical_alternative
  - marker: b
    text: Or “Why should we be excluded from bringing the offering of the LORD...?”
    reason: alternative_reading
  - marker: c
    text: “Sons of Israel” is the Hebrew expression; many English versions render it “Israelites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들은 그에게 말했습니다. 「우리는 사람의 시신으로 인해 부정합니다[a]. 왜 우리가 야훼의 제물을 그 정해진 때에 이스라엘 자손 가운데서 드리는 일에서 제외되어야 합니까?」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사람의 영혼/생명 때문에 부정하다”이지만, 여기서는 사람의 시신과 접촉한 부정을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “왜 우리가 야훼의 제물을 가져오지 못하게 되어야 합니까?”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And those men said to him
  chosen_korean: 그 사람들은 그에게 말했습니다
  alternatives_korean:
  - 그리고 그 사람들은 그에게 말했습니다
  - 그 남자들은 그에게 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서 직접 화법을 도입하는 기본 동사로 ‘말했습니다’를 택했습니다.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  english_pob_choice: unclean by a human corpse
  chosen_korean: 사람의 시신으로 인해 부정합니다
  alternatives_korean:
  - 사람의 죽은 몸으로 인해 부정합니다
  - 죽은 사람으로 인해 부정합니다
  lexicon: HALOT
  rationale: 문맥상 의식적 부정은 시신 접촉을 가리키므로, 직역적이지만 의미를 분명히 하는 ‘시신’으로 옮겼습니다.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  english_pob_choice: should we be kept from presenting
  chosen_korean: 우리가 ... 드리는 일에서 제외되어야 합니까
  alternatives_korean:
  - 우리가 ... 드리지 못하게 되어야 합니까
  - 우리가 ... 바치는 것을 막아야 합니까
  lexicon: HALOT
  rationale: 니팔형 נגרע의 수동적 의미를 ‘제외되다’로 살리고, 제의 문맥의 הקריב은 ‘드리다’로 자연스럽게 옮겼습니다.
- source_word: קָרְבַּן יְהוָה
  english_pob_choice: the offering of Yahweh
  chosen_korean: 야훼의 제물
  alternatives_korean:
  - 야훼의 예물
  - 야훼께 드리는 제물
  lexicon: HALOT
  rationale: קָרְבָּן은 제의적 ‘제물/예물’인데, 제사장적 문맥에서 가장 직접적인 표현인 ‘제물’을 선택했습니다.
- source_word: בְּמֹעֲדוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 그 정해진 때에
  alternatives_korean:
  - 정해진 때에
  - 그 지정된 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 핵심은 정해진 예식 시점이므로, 자연스러운 한국어로 ‘정해진 때’로 옮겼습니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘의 아들들 가운데서
  - 이스라엘 사람들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 집단 표지를 그대로 살려, 관용적이면서도 원문 구조를 유지하는 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 대체 칭호가 아니라 고유명으로 드러나므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 부정/시신 접촉의 제의적 의미
  chosen_reading: 사람의 시신으로 인해 부정합니다
  alternative_readings:
  - 죽은 사람 때문에 부정합니다
  - 시체로 인해 부정합니다
  rationale: 단순한 죽음의 언급이 아니라 율법적 부정 상태를 말하므로, 제의적 긴장을 유지하는 ‘시신’ 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Levitical purity terminology
