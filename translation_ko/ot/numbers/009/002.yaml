translation:
  language: ko
  text: 그리고 이스라엘 자손은 유월절을 정해진 때에 지키십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  english_pob_choice: Let ... keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 행하십시오
  - 지키게 하십시오
  - 드리십시오
  lexicon: HALOT
  rationale: פֶּסַח을 목적어로 둔 עשה는 단순히 ‘하다’보다 절기를 ‘지키다/준수하다’는 관용적 의미가 자연스럽습니다. 문맥상 명령의 힘이 있으므로 합쇼체 명령형으로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 히브리어를 문자적으로 따르면 ‘이스라엘의 아들들’이지만, 한국어 성경에서는 혈연-언약 공동체를 가리키는 정착 표현인 ‘이스라엘 자손’이 원문의 형식과 호응을 가장 잘 보존합니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 그 유월절
  - 유월절 제사
  - 유월절 절기
  lexicon: HALOT
  rationale: 이 절에서는 פסח가 제의적 사건이자 절기 전체를 가리키므로, 한국어의 표준 성경 용례인 ‘유월절’이 가장 직접적입니다.
- source_word: בְּמוֹעֲדוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 그 정한 때에
  alternatives_korean:
  - 그 정해진 때에
  - 지정된 때에
  - 정한 시기에
  lexicon: HALOT
  rationale: מוֹעֵד는 정해진 시점/절기 때를 뜻하며, 여기서는 유월절의 시기를 가리킵니다. 소유격을 드러내는 ‘그’와 ‘정한 때’로 달력적·의례적 특정성을 살렸습니다.
