id: NUM.9.15
reference: Numbers 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: Now on the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
  footnotes:
  - marker: a
    text: Or 'the tent of witness.' The Hebrew phrase can be rendered either way; 'testimony' is retained here as the more established cultic term.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 성막을 세운 날에 구름이 증거의 장막인 성막을 덮었고, 저녁에는 아침까지 성막 위에 불의 모습같이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거’는 여기서 언약 증거판이 들어 있는 장막을 가리키는 예배 용어로 이해한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם / Now on the day
  english_pob_choice: Now on the day
  chosen_korean: 이제 ... 날에
  alternatives_korean:
  - 그날에
  - 그리고 그날에
  - 성막을 세운 날에
  lexicon: HALOT
  rationale: 서두의 시간 부사와 연결감을 자연스럽게 살리면서, 현대 한국어에서 서술 도입에 맞는 ‘이제’를 사용했습니다.
- source_word: הָקִים / was set up
  english_pob_choice: was set up
  chosen_korean: 세운
  alternatives_korean:
  - 설치한
  - 세워진
  - 일으킨
  lexicon: HALOT
  rationale: מִשְׁכָּן의 설치 완료를 나타내는 표현으로 ‘세운’이 가장 직접적이고 자연스럽습니다.
- source_word: לְאֹהֶל הָעֵדֻת / the tent of the testimony
  english_pob_choice: the tent of the testimony
  chosen_korean: 증거의 장막인
  alternatives_korean:
  - 증거의 장막
  - 증언의 장막
  - 증거의 회막
  lexicon: HALOT
  rationale: 장막의 기능을 설명하는 동격적 구문으로 처리해, POB의 cultic term ‘testimony’를 ‘증거’로 유지하면서 한국어 문장 안에서 자연스럽게 연결했습니다.
- source_word: כְּמַרְאֵה אֵשׁ / like the appearance of fire
  english_pob_choice: like the appearance of fire
  chosen_korean: 불의 모습같이
  alternatives_korean:
  - 불처럼
  - 불의 모양같이
  - 불의 나타남처럼
  lexicon: HALOT
  rationale: 비유 표지를 유지하되, 외형적 관찰을 나타내는 ‘모습’으로 번역해 ‘불 그 자체’와의 동일시를 피했습니다.
theological_decisions:
- issue: וּבָעֶרֶב יִהְיֶה ... עַד בֹּקֶר의 시간상 지속상
  chosen_reading: 저녁부터 아침까지 성막 위에 지속적으로 머물렀다는 묘사로 읽었습니다.
  alternative_readings:
  - 저녁에 성막 위에 나타났다
  - 저녁에는 성막 위에 있었다
  rationale: 히브리어 미완료형을 서술적 지속 상태로 이해하면, 낮의 구름 덮음과 밤의 불 같은 현상이 하나의 지속적 표지로 연결됩니다.
  doctrine_reference: 민수기 9장 구름/불 기둥의 인도 표지
