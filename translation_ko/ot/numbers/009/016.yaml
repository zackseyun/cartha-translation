    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 늘 그러했습니다. 구름이 그것을 덮었고, 밤에는 불처럼 보이는 것이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불의 모습’ 또는 ‘불의 광경’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그리하여
  - 그렇게
  lexicon: HALOT
  rationale: 앞절의 반복적 상황을 요약하는 연결어로서, 한국어에서는 ‘이와 같이’가 원문의 지시적·요약적 기능을 자연스럽게 살립니다.
- source_word: יִהְיֶה תָמִיד
  english_pob_choice: it was continually
  chosen_korean: 늘 그러했습니다
  alternatives_korean:
  - 계속 그러했습니다
  - 항상 그러했습니다
  lexicon: HALOT
  rationale: 미완료형의 관습적 반복을 한국어 과거 서술로 옮기되, ‘늘’로 지속성을 드러내고 ‘그러했습니다’로 앞선 묘사의 상태가 계속되었음을 간결하게 전합니다.
- source_word: הֶעָנָן
  english_pob_choice: the cloud
  chosen_korean: 구름
  alternatives_korean:
  - 그 구름
  - 구름이
  lexicon: HALOT
  rationale: 문맥상 성막을 덮는 익숙한 구름을 가리키므로, 불필요한 해설 없이 기본어 ‘구름’을 사용했습니다.
- source_word: יְכַסֶּנּוּ
  english_pob_choice: would cover it
  chosen_korean: 그것을 덮고
  alternatives_korean:
  - 그것을 덮었습니다
  - 그를 덮고
  lexicon: HALOT
  rationale: 3인칭 목적어는 문맥상 성막/거처를 가리키므로 ‘그것을’로 옮겼고, 반복되는 장면의 병렬성을 위해 현재형적 서술인 ‘덮고’를 택했습니다.
- source_word: מַרְאֵה אֵשׁ
  english_pob_choice: the appearance of fire
  chosen_korean: 불의 모습
  alternatives_korean:
  - 불처럼 보이는 모습
  - 불의 형체
  lexicon: HALOT
  rationale: מַרְאֶה는 ‘보이는 모습/광경’을 뜻하므로, 실제 불인지 불처럼 보이는 것인지 단정하지 않도록 ‘불의 모습’으로 보존했습니다.
theological_decisions:
- issue: 불의 현상에 대한 묘사의 범위
  chosen_reading: ‘불의 모습’으로 옮겨, 실제 불인지 불처럼 보이는 현상인지 단정하지 않았습니다.
  alternative_readings:
  - ‘불’로 단순화하기
  - ‘불처럼 보이는 것’으로 풀어쓰기
  rationale: 원문은 מַרְאֵה(보이는 모습)를 사용하므로, 현상의 외관을 말하는 표현 자체를 유지하는 것이 가장 안전합니다.
  doctrine_reference: 성막 현현 묘사에 대한 서술 보존
