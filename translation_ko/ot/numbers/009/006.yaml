  source_fidelity: 원문의 אֲנָשִׁים은 남성 복수이므로 ‘사람들’보다 ‘남자들’이 더 직접적입니다. 또한 בַּיּוֹם הַהוּא는 원문에서 유월절을 지킬 수 없었던 때와 모세와 아론 앞에 나아온 때에 각각 붙어 있으므로, 이를 두 차례 보존하는 편이 정확합니다.
  naturalness: ‘그 날에’가 문두와 뒤의 두 절에 모두 반복된 현행 문장은 한국어에서 다소 중복되며, 문두의 시간 표현은 원문의 첫 절에 없는 수식을 추가합니다. ‘그 날’로 간결하게 두 번 배치하고 두 문장으로 나누면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘부정하게 된’은 טְמֵאִים의 의례적 부정 상태를 자연스럽게 나타내며, 각주에서 이것이 도덕적 죄책이 아니라 시체와 관련된 의례적 부정이라는 관용적 의미를 밝혀야 합니다. ‘유월절을 지키다’, ‘모세’, ‘아론’은 적절합니다.
