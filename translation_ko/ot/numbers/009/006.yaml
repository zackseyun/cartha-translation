  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: Now there were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
  footnotes:
  - marker: a
    text: Hebrew literally, 'unclean for the נפש of a man,' an idiom for impurity caused by a human corpse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 사람의 시체로 인해 부정한 사람들이 있어서, 그들은 그 날에 유월절을 지킬 수 없었습니다. 그들은 그 날에 모세와 아론 앞에 나아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 사람의 נפש(네페쉬)’이지만, 여기서는 사람의 시체로 인한 의례적 부정을 뜻하는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 몇몇 사람들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수이지만, 이 문맥에서는 성별보다 상황이 중요한 집단 지칭이므로 자연스러운 한국어로 ‘사람들’이라 옮겼습니다.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  english_pob_choice: unclean because of a human corpse
  chosen_korean: 사람의 시체로 인해 부정한
  alternatives_korean:
  - 사람의 시체 때문에 부정한
  - 한 사람의 죽은 몸으로 부정한
  - 사람의 혼 때문에 부정한
  lexicon: HALOT
  rationale: 이 관용구는 시체 접촉으로 인한 의례적 부정을 가리키므로, 영혼이 아니라 ‘시체’로 인해 생긴 부정이라는 점이 드러나게 했습니다.
- source_word: לַעֲשֹׂת הַפֶּסַח
  english_pob_choice: keep the Passover
  chosen_korean: 유월절을 지킬 수 없었습니다
  alternatives_korean:
  - 유월절을 행할 수 없었습니다
  - 유월절을 지킬 수 없었습니다
  - 유월절을 지키지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘유월절을 행하다’는 관용을 한국어 성경 표현에 맞게 ‘유월절을 지키다’로 옮겼고, 불가능성도 분명히 했습니다.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  english_pob_choice: and they came near before
  chosen_korean: 모세와 아론 앞에 나아왔습니다
  alternatives_korean:
  - 모세와 아론 앞에 가까이 왔습니다
  - 모세와 아론 앞에 나아가서는
  - 모세와 아론 앞에 나아왔습니다
  lexicon: HALOT
  rationale: קרב와 לִפְנֵי의 결합을 살려 단순한 이동이 아니라 권위 앞에 ‘나아오는’ 공적 접근을 드러냈습니다.
theological_decisions:
- issue: 례법적 부정의 의미
  chosen_reading: 도덕적 죄책이 아니라 시체 접촉으로 인한 의례적 부정을 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 죄로 더러워진 것으로 읽기
  - 일반적인 불결 상태로 완화해 읽기
  rationale: 민수기 정결법의 문맥상 이 표현은 윤리적 타락이 아니라 예배 참여를 제한하는 의례적 상태를 가리키므로, 그 구분을 한국어에서도 보존했습니다.
  doctrine_reference: '민수기 19장 정결 규례, 번역 원리: 원문 문맥 우선'
- issue: 사람의 시체로 인해의 직역 정도
  chosen_reading: 관용구를 너무 직역하지 않고 ‘시체로 인해’로 풀어 의미를 분명히 했습니다.
  alternative_readings:
  - ‘한 사람의 נפש 때문에’처럼 더 직역하기
  - ‘죽은 자로 인해’로 더 일반화하기
  rationale: נפש אדם는 문자적으로는 ‘사람의 נפש’이지만, 여기서는 관용적으로 시체 부정을 뜻하므로, 오해 없이 읽히는 방향이 필요했습니다.
  doctrine_reference: 원어 의미와 현대 한국어 가독성의 균형
