theological_decisions:
- issue: 구름이 이동 신호로 ‘들어 올려짐’의 수동 표현을 유지할지 여부
  chosen_reading: ‘그것이 들어 올려지면’으로 옮겨, 주체 없이 구름이 위로 들려지는 표지를 그대로 살렸습니다.
  alternative_readings:
  - ‘구름이 올라가면’
  - ‘구름이 떠오르면’
  rationale: 본문은 구름의 움직임을 단순한 자연 현상보다 야훼의 인도 표지로 제시하므로, 주어의 수동성을 유지하는 편이 문맥상 더 적절합니다.
  doctrine_reference: 민수기 9장 광야 인도 모티프
