  source_fidelity: 히브리어의 반복·상황 제시 관용구 וְיֵשׁ אֲשֶׁר는 ‘어떤 때는’으로 자연스럽게 반영되었습니다. 구름이 성막 위에 일정 기간 계속 있는 뜻, ‘여러 날’이라는 비특정 기간, 그리고 야훼의 지시에 따라 진을 치고 출발하는 순서가 충실합니다. 두 차례의 עַל־פִּי יְהוָה도 모두 ‘야훼의 명령을 따라’로 일관되게 옮겼습니다.
  naturalness: ‘어떤 때는’, ‘성막 위에 여러 날 동안 머물렀습니다’, ‘진을 쳤고 … 출발했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 읽기 쉽습니다. ‘여러 날’은 원문의 제한되지만 특정되지 않은 기간을 과도하게 좁히지 않습니다.
  terminology: ‘성막’, ‘진을 치다’, ‘야훼’는 광야 여정 문맥과 프로젝트의 명칭 원칙에 적절합니다. ‘야훼의 명령을 따라’는 עַל־פִּי יְהוָה의 관용적 의미를 정확하게 전달하며, 각주도 문자적 표현과 관용적 의미의 관계를 충분히 설명합니다.
