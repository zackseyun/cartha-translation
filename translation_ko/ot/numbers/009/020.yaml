  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to the mouth of the LORD''—that is, by the LORD''s command.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 때는 구름이 성막 위에 여러 날 동안 머물렀습니다. 야훼의 명령을 따라 그들은 진을 쳤고, 야훼의 명령을 따라 출발했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼의 입에 따라’라는 말로, 곧 야훼의 명령에 따라라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  english_pob_choice: Sometimes
  chosen_korean: 어떤 때는
  alternatives_korean:
  - 때때로
  - 어느 때는
  lexicon: HALOT
  rationale: 상황의 반복적 변화를 여는 관용구로, 문맥상 자연스러운 한국어는 ‘어떤 때는’입니다.
- source_word: יִהְיֶה הֶעָנָן
  english_pob_choice: the cloud would remain
  chosen_korean: 구름이 … 머물렀습니다
  alternatives_korean:
  - 구름이 … 있었습니다
  - 구름이 … 머물러 있었습니다
  lexicon: HALOT
  rationale: 여기서는 단순 존재가 아니라 성막 위에 계속 머무는 지속성을 말하므로 ‘머물다’가 가장 직접적입니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령을 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 명령대로
  lexicon: HALOT
  rationale: ‘입에 따라’라는 직역보다 권위 있는 지시를 뜻하는 관용구이므로, 본문 의미를 살려 ‘명령을 따라’로 옮겼습니다.
- source_word: יַחֲנוּ / יִסָּעוּ
  english_pob_choice: they would camp / they would set out
  chosen_korean: 진을 쳤고 / 출발했습니다
  alternatives_korean:
  - 캠프를 쳤고 / 떠났습니다
  - 진을 쳤고 / 떠났습니다
  lexicon: HALOT
  rationale: 광야 이동 맥락에서 יַחֲנוּ는 ‘진을 치다’, יִסָּעוּ는 ‘출발하다’가 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 언약적 고유명사인 יהוה를 직접 사용하므로, 제목어 ‘주’로 바꾸지 않고 학술적 음역인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
