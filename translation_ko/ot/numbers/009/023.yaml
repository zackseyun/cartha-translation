translation:
  language: ko
  text: 여호와의 명령에 따라 그들은 진을 쳤고, 여호와의 명령에 따라 출발하였으며, 여호와의 명령에 따라 모세를 통해 여호와의 명령을 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘모세의 손으로’이며 ‘모세를 통해’ 또는 ‘모세를 매개로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 여호와의 명령에 따라
