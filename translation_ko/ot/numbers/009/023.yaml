  text: 그들은 야훼의 명령에 따라 진을 쳤고, 야훼의 명령에 따라 출발했습니다. 그들은 모세를 통하여[a] 야훼의 명령에 따라 야훼께서 맡기신 책무를 지켰습니다.
  philosophy: optimal-equivalence
  footnotes:
