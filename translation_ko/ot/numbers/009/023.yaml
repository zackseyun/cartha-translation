  lexicon: HALOT
  rationale: עַל פִּי는 직역하면 ‘입에 따라’이지만 여기서는 권위 있는 지시를 뜻하므로, 한국어에서는 자연스럽고 분명한 ‘명령에 따라’로 옮겼습니다.
- source_word: יַחֲנוּ
