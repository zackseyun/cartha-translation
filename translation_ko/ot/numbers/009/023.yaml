  - 행진하였으며
  lexicon: HALOT
  rationale: 문맥상 야영지에서 떠나는 동작이므로 ‘출발하다’가 가장 간결하고 현대적인 대응입니다.
- source_word: בְּיַד מֹשֶׁה
