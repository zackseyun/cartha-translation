  source_fidelity: 대체로 충실하나, עִמְדוּ는 이 문맥에서 ‘기다리십시오’가 자연스럽고 정확합니다. ‘멈추고 있으십시오’는 진행 중인 행동을 중단하라는 뜻으로도 들릴 수 있습니다. לָכֶם은 이 문맥에서 명령의 수령자라기보다 그들을 둘러싼 사안이라는 의미가 강하므로 ‘여러분에 관하여’가 더 적절합니다.
  naturalness: 합쇼체와 ‘야훼’ 표기는 적절합니다. 다만 ‘멈추고 있으십시오’는 현대 표준어에서 다소 부자연스럽고 문맥상 ‘기다리십시오’보다 덜 명료합니다. 각주 표지도 해당 낱말 바로 뒤에 두는 편이 독자에게 분명합니다.
  terminology: 모세와 야훼는 일관되고 적절합니다. ‘명령하실지’는 히브리어 미완료형이 문맥상 가리키는 앞으로 주어질 지시를 자연스럽게 나타내며, 특정 신학적 해석을 더하지 않습니다.
