  lexicon: WLC; HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 히브리어 waw 연속의 단순한 사건 연결을 한국어에서 과도하게 표지하지 않기 위해 평서형으로 옮겼습니다.
- source_word: עִמְדוּ
  english_pob_choice: Wait
  chosen_korean: 멈추고 있으십시오
  alternatives_korean:
  - 기다리십시오
  - 서 있으십시오
  - 대기하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만, 이 문맥에서는 모세가 다음 지시를 기다리게 하는 뜻이므로 한국어에서는 명령의 동작성을 살린 ‘멈추고 있으십시오’가 가장 가깝습니다.
- source_word: וְאֶשְׁמְעָה
  english_pob_choice: and I will hear
  chosen_korean: 그러면 … 내가 듣겠습니다
  alternatives_korean:
  - 그리고 내가 듣겠습니다
  - 그리고 내가 들으렵니다
  - 내가 들어보겠습니다
  lexicon: HALOT
  rationale: 1인칭 의도형은 모세가 야훼의 응답을 수령하겠다는 뜻이므로, 한국어에서는 ‘듣겠습니다’로 자연스럽게 표현하되 앞뒤 인과를 ‘그러면’으로 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신적 고유명사는 관례적 대체어가 아니라 음역형 ‘야훼’로 유지해 언약 이름을 드러냈습니다.
- source_word: מַה יְצַוֶּה ... לָכֶם
  english_pob_choice: what Yahweh commands concerning you
  chosen_korean: 여러분에게 무엇을 명령하시는지
  alternatives_korean:
  - 여러분에 관해 무엇을 명령하시는지
  - 여러분을 두고 무엇을 명령하시는지
  - 여러분에게 무엇을 명하시는지
  lexicon: HALOT
  rationale: לָכֶם은 단순한 방향보다 ‘여러분과 관련하여’의 의미가 더 자연스러워, 명령의 대상/관련성을 살려 ‘여러분에게 무엇을 명령하시는지’로 옮겼습니다.
theological_decisions:
