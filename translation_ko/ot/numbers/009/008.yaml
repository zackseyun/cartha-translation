  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
  footnotes:
  - marker: a
    text: Or “Stand by,” preserving the more literal sense of the Hebrew imperative.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그들에게 말했습니다. 「멈추고 있으십시오. 그러면 야훼께서 여러분에게 무엇을 명령하시는지 내가 듣겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “서 있으십시오”로 옮길 수 있습니다. 히브리어 명령형의 더 문자적인 뜻을 보존한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  english_pob_choice: And Moses said to them
  chosen_korean: 모세가 그들에게 말했습니다
  alternatives_korean:
  - 모세가 그들에게 말하였습니다
  - 그리고 모세가 그들에게 말했습니다
  lexicon: WLC; HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 히브리어 waw 연속의 단순한 사건 연결을 한국어에서 과도하게 표지하지 않기 위해 평서형으로 옮겼습니다.
- source_word: עִמְדוּ
  english_pob_choice: Wait
  chosen_korean: 멈추고 있으십시오
  alternatives_korean:
  - 기다리십시오
  - 서 있으십시오
  - 대기하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만, 이 문맥에서는 모세가 다음 지시를 기다리게 하는 뜻이므로 한국어에서는 명령의 동작성을 살린 ‘멈추고 있으십시오’가 가장 가깝습니다.
- source_word: וְאֶשְׁמְעָה
  english_pob_choice: and I will hear
  chosen_korean: 그러면 … 내가 듣겠습니다
  alternatives_korean:
  - 그리고 내가 듣겠습니다
  - 그리고 내가 들으렵니다
  - 내가 들어보겠습니다
  lexicon: HALOT
  rationale: 1인칭 의도형은 모세가 야훼의 응답을 수령하겠다는 뜻이므로, 한국어에서는 ‘듣겠습니다’로 자연스럽게 표현하되 앞뒤 인과를 ‘그러면’으로 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신적 고유명사는 관례적 대체어가 아니라 음역형 ‘야훼’로 유지해 언약 이름을 드러냈습니다.
- source_word: מַה יְצַוֶּה ... לָכֶם
  english_pob_choice: what Yahweh commands concerning you
  chosen_korean: 여러분에게 무엇을 명령하시는지
  alternatives_korean:
  - 여러분에 관해 무엇을 명령하시는지
  - 여러분을 두고 무엇을 명령하시는지
  - 여러분에게 무엇을 명하시는지
  lexicon: HALOT
  rationale: לָכֶם은 단순한 방향보다 ‘여러분과 관련하여’의 의미가 더 자연스러워, 명령의 대상/관련성을 살려 ‘여러분에게 무엇을 명령하시는지’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 인격적 언약 이름을 제목어로 대치하지 않고 ‘야훼’로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
