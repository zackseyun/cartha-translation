revisions:
- from: 그리고 때로는 구름이 저녁부터 아침까지 있었습니다. 아침에 구름이 들리면[a] 그들은 떠났습니다. 혹은 하루와 밤 동안 있더라도, 구름이 들리면 그들은 떠났습니다.
  to: 그리고 때로는 구름이 저녁부터 아침까지 머물렀습니다. 아침에 구름이 올라가면[a] 그들은 떠났습니다. 혹은 구름이 낮과 밤 동안 머물렀다가, 구름이 올라가면 그들은 떠났습니다.
  rationale: 양보 조건을 제거하여 원문의 두 대안적 체류 상황을 보존했습니다. ‘머물렀습니다’로 지속 의미를 분명히 했고, 구름의 동작은 히브리어 능동형에 따라 ‘올라가면’으로 옮겼습니다. 각주는 본문 표현의 자연스러운 대안을 제시하면서 원문의 동사 형태와 문맥 기능을 정확히 설명하도록 고쳤습니다.
