id: NUM.9.21
reference: Numbers 9:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
  footnotes:
  - marker: a
    text: Or, 'when the cloud rose.' The Hebrew verb can be rendered more literally this way, but 'was taken up' better reflects the cloud's lifting as the signal for Israel to depart in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 때로는 구름이 저녁부터 아침까지 머물렀습니다. 아침에 구름이 올라가면[a] 그들은 떠났습니다. 혹은 구름이 낮과 밤 동안 머물렀다가, 구름이 올라가면 그들은 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구름이 들리면’입니다. 히브리어 동사는 문자적으로 ‘올라가다’라는 뜻이며, 이 문맥에서는 구름이 들려 올라가는 것이 이스라엘이 출발하는 신호가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  english_pob_choice: And sometimes
  chosen_korean: 그리고 때로는
  alternatives_korean:
  - 그리고 어떤 때는
  - 그리고 때때로
  lexicon: HALOT
  rationale: 특정한 경우를 도입하는 관용 표현으로, 자연스러운 현대 한국어에서 반복적 상황을 간결하게 나타냅니다.
- source_word: יִהְיֶה הֶעָנָן
  english_pob_choice: the cloud would remain
  chosen_korean: 구름이 … 있었습니다
  alternatives_korean:
  - 구름이 머물렀습니다
  - 구름이 있었습니다
  lexicon: HALOT
  rationale: היה의 지속적 존재를 한국어의 ‘있다’로 옮겨, 구름이 한동안 머무는 상태를 과장 없이 드러냈습니다.
- source_word: וְנַעֲלָה הֶעָנָן
  english_pob_choice: when the cloud was taken up
  chosen_korean: 구름이 들리면
  alternatives_korean:
  - 구름이 올려지면
  - 구름이 올라가면
  lexicon: HALOT
  rationale: 이 본문에서 עלה는 광야 여정의 신호로서 구름이 위로 들려 떠나는 동작을 가리키므로, 수동적이고 사건적인 뉘앙스를 살려 ‘들리다’로 옮겼습니다.
- source_word: וְנָסָעוּ
  english_pob_choice: they would set out
  chosen_korean: 그들은 떠났습니다
  alternatives_korean:
  - 그들은 출발했습니다
  - 그들은 길을 떠났습니다
  lexicon: HALOT
  rationale: נסע의 광야 이동 맥락을 따라, 진을 걷고 이동하는 의미를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: יוֹמָם וָלַיְלָה
  english_pob_choice: for a day and a night
  chosen_korean: 하루와 밤 동안
  alternatives_korean:
  - 낮과 밤 동안
  - 하루 밤낮 동안
  lexicon: HALOT
  rationale: 시간의 지속을 나타내는 구문으로 이해하여, 직역을 유지하면서도 한국어로는 기간 표현이 되도록 처리했습니다.
theological_decisions:
- issue: 구름의 ‘들림’이 출발 신호라는 서술 방식
  chosen_reading: 구름이 들리면 그들은 떠났습니다
  alternative_readings:
  - 구름이 올라가면 그들은 떠났습니다
  - 구름이 옮겨지면 그들은 떠났습니다
  rationale: 본문의 반복 공식은 단순한 자연 현상 묘사가 아니라 야훼의 인도하심에 따른 이동 신호를 뜻하므로, 출발과 연결되는 사건성을 유지했습니다.
  doctrine_reference: 민수기 9장의 광야 인도 모티프
- issue: יוֹמָם וָלַיְלָה의 의미
  chosen_reading: 하루와 밤 동안
  alternative_readings:
  - 낮과 밤 동안
  - 하루 밤낮 동안
  rationale: 본문이 말하는 것은 구름이 머문 지속 시간이지, 별도의 신학적 의미를 덧붙이는 표현이 아니므로 시간 지속의 사실성을 간단히 살렸습니다.
  doctrine_reference: 문맥상의 서술적 지속 표현
