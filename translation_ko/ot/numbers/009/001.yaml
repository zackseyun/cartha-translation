id: NUM.9.1
reference: Numbers 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
  footnotes:
  - marker: a
    text: Or 'in the desert of Sinai.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 시내 광야[a]에서, 이스라엘 자손이 이집트 땅에서 나온 지 둘째 해 첫째 달에 모세에게 말씀하여 이르셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내 광야’의 뜻으로, 문자적으로는 ‘시내의 광야’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And ... spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하여 이르셨습니다
  lexicon: HALOT
  rationale: 하나님의 발화 서두를 격식 있게 살리면서도, 히브리어의 서술 진행을 반영해 단순한 인용 표지보다 ‘말씀하여 이르셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 원칙에 따라 여호와 대신 고유신명사를 음역한 ‘야훼’를 사용하여, 본문의 개인적 언약 이름을 보존했습니다.
- source_word: בְ/מִדְבַּר סִינַי
  english_pob_choice: in the wilderness of Sinai
  chosen_korean: 시내 광야
  alternatives_korean:
  - 시내의 광야
  - 시내 산 광야
  lexicon: HALOT
  rationale: בְּ + מִדְבָּר의 장소 표지를 자연스러운 한국어로 옮기되, ‘광야’로 사막적 지형을 유지하고 ‘시내’의 소속 관계를 간결하게 반영했습니다.
- source_word: לְ/צֵאתָם מֵ/אֶרֶץ מִצְרַיִם
  english_pob_choice: after they came out of the land of Egypt
  chosen_korean: 이스라엘 자손이 이집트 땅에서 나온 지
  alternatives_korean:
  - 그들이 이집트 땅에서 나온 후
  - 이집트 땅을 나온 뒤
  lexicon: HALOT
  rationale: 출애굽을 기준으로 한 시간표현을 한국어 관용에 맞게 ‘-ㄴ 지’로 풀어, 사건 이후의 경과를 분명히 했습니다. ‘땅’은 אֶרֶץ를 반영합니다.
- source_word: בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  english_pob_choice: in the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫 달
  - 첫째 달에
  lexicon: HALOT
  rationale: 달력 표현은 간명하게 ‘첫째 달’로 옮겨 히브리어의 순서형을 보존했습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 인용 시작 방식
  chosen_reading: 본문의 서술형 종결 없이, 하나님의 말씀 시작을 ‘말씀하여 이르셨습니다’로 표시했습니다.
  alternative_readings:
  - ‘…말씀하셨습니다:’처럼 단순화
  - ‘…말하여’처럼 더 직설적으로 처리
  rationale: 본절은 다음 절의 명령문을 여는 공식적 신탁 도입부이므로, 한국어에서도 신적 발화의 장중함과 연속성을 유지하는 것이 적절합니다.
  doctrine_reference: 서술/신탁 도입의 문체 보존
