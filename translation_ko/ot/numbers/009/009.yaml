  lexicon: HALOT
  rationale: לֵאמֹר는 곧 이어질 직접 화법을 여는 관용구이므로, 한국어에서는 자연스럽게 간접 인용 형태로 풀어 '말하라'고 하셨습니다'로 옮겼습니다.
