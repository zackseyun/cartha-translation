  rationale: 와우-연속의 서술 진행을 자연스러운 한국어로 옮기되, דבר의 말하기 행위를 존중하여 '말씀하셨습니다'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명사יהוה를 전통적 대체어가 아닌 고유명사 음역 '야훼'로 옮겼습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모쉐
  lexicon: HALOT
  rationale: 한국어에서 확립된 성서 인명 표기 '모세'를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 「말하라」고 하셨습니다
  alternatives_korean:
  - 말씀하시며
  - 라고 말씀하셨습니다
  lexicon: HALOT
  rationale: לֵאמֹר는 곧 이어질 직접 화법을 여는 관용구이므로, 한국어에서는 자연스럽게 간접 인용 형태로 풀어 '말하라'고 하셨습니다'로 옮겼습니다.
theological_decisions:
