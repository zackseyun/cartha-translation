id: NUM.9.13
reference: Numbers 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
  footnotes:
  - marker: a
    text: Or, 'that soul shall be cut off.' The Hebrew idiom can denote severe covenantal judgment without specifying here exactly how it is carried out.
    reason: lexical_alternative
  - marker: b
    text: Or, 'shall bear his guilt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 정결하고 여행 중이 아닌 사람이 유월절을 지키지 않으면, 그 사람은 자기 백성에게서 끊어질 것입니다[a]. 이는 그가 정해진 때에 야훼의 제물을 드리지 않았기 때문입니다. 그 사람은 자기 죄를 져야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 사람은 끊어질 것입니다’. 히브리어의 이 관용구는 중대한 언약적 심판을 가리키지만, 그 집행 방식이 정확히 무엇인지는 여기서 특정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 죄책을 져야 합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  english_pob_choice: clean
  chosen_korean: 깨끗하고
  alternatives_korean:
  - 정결하고
  - 깨끗한
  lexicon: HALOT
  rationale: 의례적 문맥에서 טָהוֹר는 도덕적 ‘순결’보다 의식적 ‘깨끗함’을 뜻하므로, 현대 한국어에서 자연스러운 ‘깨끗하고’로 옮겼습니다.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  english_pob_choice: is not on a journey
  chosen_korean: 길 위에 있지도 않은
  alternatives_korean:
  - 여행 중이 아닌
  - 길을 떠나 있지 않은
  lexicon: HALOT
  rationale: 문맥상 부재 사유인 ‘여행/이동 중’의 관용구이므로, 직역보다 한국어에서 자연스러운 ‘길 위에 있지도 않은’으로 재현했습니다.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  english_pob_choice: fails to keep the Passover
  chosen_korean: 유월절을 지키기를 마치지 않으면
  alternatives_korean:
  - 유월절을 지키기를 거부하면
  - 유월절을 행하기를 그만두면
  lexicon: HALOT
  rationale: חָדַל은 ‘그만두다/중단하다/게을리하다’의 뜻이 있어, 의무 불이행을 드러내는 ‘지키기를 마치지 않으면’으로 옮겼습니다.
- source_word: קָרְבַּן יְהוָה
  english_pob_choice: Yahweh’s offering
  chosen_korean: 야훼의 예물
  alternatives_korean:
  - 야훼의 제물
  - 야훼께 드리는 예물
  lexicon: HALOT
  rationale: קָרְבָּן은 하나님께 가까이 가져오는 ‘예물/제물’의 넓은 범주이므로, 제사 용어를 과도하게 좁히지 않는 ‘예물’로 옮겼습니다.
- source_word: בְּמֹעֲדוֹ
  english_pob_choice: at its appointed time
  chosen_korean: 그 정해진 때에
  alternatives_korean:
  - 그 지정된 때에
  - 정해진 시기에
  lexicon: HALOT
  rationale: מוֹעֵד의 핵심은 임의가 아닌 ‘정해진 때’이므로, 절차적 의미를 살린 ‘그 정해진 때에’로 표현했습니다.
- source_word: חֶטְאוֹ יִשָּׂא
  english_pob_choice: shall bear his sin
  chosen_korean: 자기 죄를 져야 합니다
  alternatives_korean:
  - 자기 죄를 짊어져야 합니다
  - 자기 죄를 감당해야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 무게감 있게 살리되, ‘bear’의 법적 책임을 드러내는 ‘져야 합니다’로 옮겼습니다.
theological_decisions:
- issue: ‘cut off’의 제재를 어떻게 드러낼지
  chosen_reading: ‘자기 백성 가운데에서 끊어질 것입니다’로 옮겨, 제재의 정확한 방식은 확정하지 않았습니다.
  alternative_readings:
  - 공동체에서 제외될 것입니다
  - 죽임을 당할 것입니다
  rationale: 히브리어 관용구의 법적·언약적 무게를 유지해야 하므로, 본문이 명시하지 않는 형벌 유형을 특정하지 않고 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
