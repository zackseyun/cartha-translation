  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘유월절을 지키기를 마치지 않으면’은 חָדַל לַעֲשׂוֹת의 의무 불이행/행하지 않음을 ‘끝마치지 못함’으로 바꾸어 의미를 흐립니다. 또한 ‘길 위에 있지도 않은’보다 문맥상 여행으로 인한 부재를 나타내는 ‘여행 중이 아닌’이 정확합니다. 제재 관용구는 특정 형벌로 해석하지 않고 ‘끊어질 것입니다’로 보존할 수 있습니다.
  naturalness: ‘정결하고 여행 중이 아닌 사람’ 및 ‘유월절을 지키지 않으면’이 현대 표준 한국어의 격식 있는 성경 문체에서 더 자연스럽고 분명합니다. ‘자기 백성 가운데에서’는 가능하지만 ‘자기 백성에게서’가 간결합니다.
  terminology: 의례 상태인 טָהוֹר에는 ‘정결하고’를 사용했습니다. קָרְבַּן יְהוָה는 문맥의 제의적 성격을 살려 ‘야훼의 제물’로 옮겼습니다. ‘야훼’ 표기는 제공된 영어 POB의 신명 선택과 일치합니다.
