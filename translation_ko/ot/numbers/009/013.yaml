revisions:
- from: 그러나 깨끗하고 길 위에 있지도 않은 사람이 유월절을 지키기를 마치지 않으면, 그 사람은 자기 백성 가운데에서 끊어질 것입니다. 이는 그가 야훼의 예물을 그 정해진 때에 드리지 않았기 때문입니다[b]. 그 사람은 자기 죄를 져야 합니다.[a]
  to: 그러나 정결하고 여행 중이 아닌 사람이 유월절을 지키지 않으면, 그 사람은 자기 백성에게서 끊어질 것입니다[a]. 이는 그가 정해진 때에 야훼의 제물을 드리지 않았기 때문입니다. 그 사람은 자기 죄를 져야 합니다[b].
  rationale: 의무 불이행을 뜻하는 חָדַל을 ‘지키지 않으면’으로 바로잡고, 여행 중 부재를 뜻하는 표현을 자연스럽게 옮겼습니다. ‘끊어질 것입니다’는 형벌의 방식을 단정하지 않아 원문의 모호성을 보존합니다. 각주 표지를 해당 설명 및 대안 번역에 맞게 재배치하고, 내용과 연결되지 않던 여행 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:01Z'
