  yaml_path: translation/ot/numbers/009/004.yaml
  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: ko
  text: 모세는 이스라엘 자손에게 유월절을 지키라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 전했습니다
  - 지시했습니다
  lexicon: דבר
  rationale: 히브리어 동사 דִּבֵּר는 단순 발화보다 전달·지시의 기능까지 포함할 수 있으므로, English POB의 told에 맞춰 모세가 백성에게 요구를 전달한 의미를 자연스럽게 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: בני ישראל
  rationale: 성경 문맥의 관용 표현을 유지하되, 현대 한국어에서 가장 직접적이고 널리 통용되는 대응인 '이스라엘 자손'을 선택했습니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 넘어감
  - 과월절
  lexicon: פסח
  rationale: 절기 명칭으로 굳어진 표준 번역인 '유월절'을 사용해 독자가 즉시 절기 자체를 인식하도록 했습니다.
theological_decisions:
- issue: 출애굽 전승의 절기 명칭과 행위 의미
  chosen_reading: '''유월절을 지키다''로 옮겨, 단순한 행사 참석이 아니라 야훼께서 정하신 절기를 준수하는 의미를 드러냈습니다.'
  alternative_readings:
  - 유월절을 행하다
  - 유월절을 지내다
  rationale: 히브리어 לַעֲשֹׂת는 절기/예식 문맥에서 '지키다, 준수하다'의 기능을 하므로, 한국어에서도 규범적 순종의 뉘앙스를 살렸습니다.
  doctrine_reference: 절기 준수의 언약적 순종
