id: NUM.9.3
reference: Numbers 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
  footnotes:
  - marker: a
    text: Hebrew 'between the evenings,' a traditional expression for the period around twilight.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 달 열넷째 날, 두 저녁 사이에[a] 그것을 그 정해진 때에 지키십시오. 그 모든 규례와 모든 법도에 따라 그것을 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 기술적 시간 표현으로, 전통적으로 해질 무렵의 시간을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  english_pob_choice: On the fourteenth day
  chosen_korean: 열넷째 날
  alternatives_korean:
  - 열네째 날
  - 십사일
  lexicon: HALOT
  rationale: 히브리어의 날짜 표현을 한국어 자연어로 풀되, 달력상의 특정성을 분명히 드러내기 위해 ‘열넷째 날’로 옮겼습니다.
- source_word: בַּחֹדֶשׁ הַזֶּה
  english_pob_choice: of this month
  chosen_korean: 이 달
  alternatives_korean:
  - 이 월
  - 이 달 안에
  lexicon: HALOT
  rationale: 직전 날짜 표현과 결합된 관용적 의미를 반영하여 ‘이 달’로 간결하게 처리했습니다.
- source_word: בֵּין הָעַרְבַּיִם
  english_pob_choice: between the evenings
  chosen_korean: 저녁 사이에
  alternatives_korean:
  - 해질 무렵에
  - 황혼 무렵에
  - 저녁 무렵에
  lexicon: HALOT
  rationale: 문자적으로는 ‘두 저녁 사이’이지만, 한국어에서는 그 관용성을 살리면서도 지나치게 해석을 고정하지 않기 위해 ‘저녁 사이에’로 옮겼습니다.
- source_word: תַּעֲשׂוּ אֹתוֹ
  english_pob_choice: you shall keep it
  chosen_korean: 그것을 지키십시오
  alternatives_korean:
  - 그것을 행하십시오
  - 그것을 준수하십시오
  - 그것을 지켜 행하십시오
  lexicon: HALOT
  rationale: 절기/의례를 대상으로 한 עשה는 ‘행하다’보다 ‘지키다/준수하다’가 의미를 더 정확히 드러내므로, 예식 준수의 뜻을 살려 번역했습니다.
- source_word: חֻקֹּתָיו / מִשְׁפָּטָיו
  english_pob_choice: all its statutes / all its ordinances
  chosen_korean: 그 모든 규례와 그 모든 법규
  alternatives_korean:
  - 그 모든 율례와 그 모든 규례
  - 그 모든 규정과 그 모든 판례
  lexicon: HALOT
  rationale: חֻקּוֹת는 제정된 규례, מִשְׁפָּטִים는 판정된 법규/판결 규정을 가리키므로, 두 항목의 구분을 살리기 위해 ‘규례’와 ‘법규’로 나누어 옮겼습니다.
theological_decisions:
- issue: 절기 준수 명령의 어조
  chosen_reading: 명령형 ‘지키십시오’로 옮겨, 단순한 정보 전달이 아니라 규정된 언약적 준수 의무를 드러냈습니다.
  alternative_readings:
  - ‘준수하십시오’
  - ‘지켜 행하십시오’
  rationale: 문맥상 유월절 규례를 ‘하는 것’이 아니라 정해진 때와 규례에 따라 ‘지키는 것’이 핵심이므로, 예식적·언약적 의무를 분명히 하는 한국어 명령형을 택했습니다.
  doctrine_reference: 민수기 9장의 유월절 규례 문맥
- issue: ‘저녁 사이에’의 표현 유지
  chosen_reading: 전통적 해석을 단정하지 않고 원문 시간표현의 긴장을 보존하는 방향으로 ‘저녁 사이에’를 유지했습니다.
  alternative_readings:
  - ‘해질 무렵에’
  - ‘황혼 무렵에’
  rationale: 원문은 기술적 시간표현으로서 여유를 남기므로, 한국어에서 너무 일찍 의미를 확정하지 않고 원문의 특수성을 살렸습니다.
  doctrine_reference: 출애굽기 12장/민수기 9장의 유월절 시각 규정
