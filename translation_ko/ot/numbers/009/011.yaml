translation:
  language: ko
  text: 둘째 달[ [a] ] 열나흗날 해질 무렵에 그들은 그것을 지켜야 합니다. 무교병과 쓴 나물과 함께 그것을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
