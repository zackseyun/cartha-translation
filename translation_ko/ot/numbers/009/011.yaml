  rationale: יַעֲשׂוּ אֹתוֹ는 유월절 문맥에서 ‘행하다’보다 ‘지키다/준수하다’가 의례적·언약적 의미를 더 분명히 드러냅니다.
  doctrine_reference: 출애굽기 12장 유월절 규례, 민수기 9장 전체 문맥
