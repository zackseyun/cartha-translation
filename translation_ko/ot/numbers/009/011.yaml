    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: In the second month
  chosen_korean: 둘째 달
  alternatives_korean:
  - 두 번째 달
  - 둘째 달에
  lexicon: HALOT
  rationale: 달력 문맥의 חֹדֶשׁ은 ‘달’이 자연스럽고, ‘둘째’는 영어 POB의 ‘second month’와 같은 간결한 시간 표지를 살립니다.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  english_pob_choice: on the fourteenth day
  chosen_korean: 열나흗날
  alternatives_korean:
  - 열네째 날
  - 열나흗날에
  lexicon: HALOT
  rationale: 히브리어 수사+יוֹם의 날짜 표현을 한국어 관용 날짜형으로 옮겨, 법령 문맥의 날짜 지정성을 분명히 했습니다.
- source_word: בֵּין הָעַרְבַּיִם
  english_pob_choice: at twilight
  chosen_korean: 해질 무렵
  alternatives_korean:
  - 황혼에
  - 저녁 무렵
  lexicon: HALOT
  rationale: 직역하면 ‘두 저녁 사이’이지만, 영어 POB처럼 이 관용구의 실제 시간을 현대 한국어로 분명하게 드러냈습니다.
- source_word: עַל מַצּוֹת וּמְרֹרִים
  english_pob_choice: with unleavened bread and bitter herbs
  chosen_korean: 무교병과 쓴 나물과 함께
  alternatives_korean:
  - 무교병과 쓴 나물로
  - 무교병과 쓴 채소와 함께
  lexicon: HALOT
  rationale: עַל은 이 식사 문맥에서 동반을 뜻하며, מַצּוֹת은 무교병, מְרֹרִים은 유월절 식탁의 ‘쓴 나물’로 옮기는 것이 가장 구체적입니다.
theological_decisions:
- issue: 유월절 규례의 반복 명령을 한국어에서 어떻게 표현할지
  chosen_reading: ‘그들은 그것을 지켜야 합니다’로 옮겨, 단순한 행위가 아니라 규례 준수의 의미를 살렸습니다.
  alternative_readings:
  - 그것을 해야 합니다
  - 그것을 행해야 합니다
  rationale: יַעֲשׂוּ אֹתוֹ는 유월절 문맥에서 ‘행하다’보다 ‘지키다/준수하다’가 의례적·언약적 의미를 더 분명히 드러냅니다.
  doctrine_reference: 출애굽기 12장 유월절 규례, 민수기 9장 전체 문맥
