  lexicon: HALOT
  rationale: 직역하면 ‘두 저녁 사이’이지만, 영어 POB처럼 이 관용구의 실제 시간을 현대 한국어로 분명하게 드러냈습니다.
- source_word: עַל מַצּוֹת וּמְרֹרִים
  english_pob_choice: with unleavened bread and bitter herbs
  chosen_korean: 무교병과 쓴 나물과 함께
  alternatives_korean:
  - 무교병과 쓴 나물로
  - 무교병과 쓴 채소와 함께
  lexicon: HALOT
  rationale: עַל은 이 식사 문맥에서 동반을 뜻하며, מַצּוֹת은 무교병, מְרֹרִים은 유월절 식탁의 ‘쓴 나물’로 옮기는 것이 가장 구체적입니다.
