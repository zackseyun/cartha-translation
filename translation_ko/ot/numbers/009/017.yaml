  source_fidelity: 핵심 사건 순서와 반복적 의미는 대체로 반영했으나, 두 동사의 시제가 한 문장 안에서 현재형(‘출발하고’, ‘머무는’)과 과거형(‘진을 쳤습니다’)으로 혼재되어 있습니다. 히브리어의 반복적 절차를 한국어 역사 서술에서 자연스럽게 나타내도록 두 절을 일관된 과거 서술로 고쳤습니다. 또한 מֵעַל הָאֹהֶל은 ‘천막 위에서’로 충분히 옮길 수 있으며, הֵעָלֹת의 ‘위로 들려/떠오름’ 사건도 유지됩니다.
  naturalness: ‘구름이 머무는 곳에서는 그곳에서’는 조사와 지시어가 겹쳐 다소 부자연스럽습니다. ‘구름이 머무는 곳에서 … 그곳에’로 정리하면 히브리어의 שָׁם 반복도 보존하면서 자연스럽습니다. ‘출발하다’보다 광야 행진 문맥에는 ‘떠나다’가 조금 더 자연스럽습니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל에 충실하며 유지할 수 있습니다. ‘진을 치다’는 יַחֲנוּ에 적절합니다. 각주 a는 본문 표현과 동일한 ‘천막 위에서’를 대안으로 제시하여 기능하지 않았고, 각주 b는 ‘구름이 머무는’에 붙어 있어 실제 설명 대상인 ‘이스라엘 자손’과 앵커가 일치하지 않았습니다.
