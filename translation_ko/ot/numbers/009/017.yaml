reference: Numbers 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
  footnotes:
  - marker: a
    text: Or 'from over the tabernacle,' since 'the tent' here refers to the tabernacle tent.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구름이 천막 위에서 떠오를 때마다[a] 이스라엘 자손은 그 뒤에 출발하고, 구름이 머무는[b] 곳에서는 그곳에서 이스라엘 자손이 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '천막 위에서'입니다. 여기서 '천막'은 성막 천막을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '이스라엘 사람들'입니다. 히브리어는 문자적으로 '이스라엘의 아들들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  english_pob_choice: Whenever the cloud was lifted
  chosen_korean: 구름이 천막 위에서 떠오를 때마다
  alternatives_korean:
  - 구름이 천막 위에서 들려 올려질 때마다
  - 구름이 천막 위에서 올라갈 때마다
  lexicon: WLC; HALOT
  rationale: 반복적 절차를 나타내는 용법을 살려 '때마다'로 옮겼고, הֵעָלֹת의 수동적 사건성을 '떠오를'로 자연스럽게 반영했습니다.
- source_word: מֵעַל הָאֹהֶל
  english_pob_choice: from over the tent
  chosen_korean: 천막 위에서
  alternatives_korean:
  - 천막 위로부터
  - 장막 위에서
  lexicon: WLC; HALOT
  rationale: 히브리어의 공간 관계인 'over/upon'을 한국어의 자연스러운 위치 표현인 '위에서'로 옮겼고, אָהֶל의 직역인 '천막'을 본문에 유지했습니다.
- source_word: וְאַחֲרֵי כֵן יִסְעוּ
  english_pob_choice: after that ... would set out
  chosen_korean: 그 뒤에 출발하고
  alternatives_korean:
  - 그 후에 떠나고
  - 그 뒤에 길을 떠나고
  lexicon: WLC; HALOT
  rationale: הב의 순차성과 반복적 습관을 살리면서 한국어에서 자연스러운 행진 표현인 '출발하다'를 택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: WLC; HALOT
  rationale: 본문의 남성-가계 표현을 그대로 살리기 위해 POB의 직역 방향을 따라 '이스라엘 자손'을 유지했습니다.
- source_word: יִשְׁכָּן ... יַחֲנוּ
  english_pob_choice: the cloud settled ... would camp
  chosen_korean: 구름이 머무는 곳에서는 그곳에서 ... 진을 쳤습니다
  alternatives_korean:
  - 구름이 머무는 곳에서는 그곳에서 ... 진쳤습니다
  - 구름이 자리 잡는 곳에서는 그곳에서 ... 진을 쳤습니다
  lexicon: WLC; HALOT
  rationale: שכן의 거주/정착 뉘앙스를 구름에 맞게 '머무는'으로 풀어, 장막의 이동과 정지를 안내하는 문맥을 살렸습니다.
theological_decisions:
- issue: 하나님의 임재를 나타내는 구름의 이동과 정지
  chosen_reading: 구름의 떠오름과 머묾이 이스라엘의 이동과 진 치기를 직접 규정하는 표지로 읽었습니다.
  alternative_readings:
  - 단순한 자연현상 묘사로 읽기
  - 행정적 캠프 규칙으로만 읽기
  rationale: 문맥상 구름은 광야에서 하나님의 인도와 임재를 가시적으로 드러내는 표지이므로, 서술의 기능을 약화시키지 않고 그대로 반영했습니다.
  doctrine_reference: 민수기 9장 광야 인도 본문; 출애굽기 40:36-38과의 연관
