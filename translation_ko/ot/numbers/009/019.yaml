base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'kept the LORD’s requirement' or 'kept the LORD’s charge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구름이 성막 위에 여러 날 오래 머물러 있을 때, 이스라엘 자손은[a] 야훼께서 맡기신 의무를 지키고[b] 출발하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 아들들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 요구를 지키고’, ‘야훼의 명령을 지키고’, 또는 ‘야훼의 책무를 지키고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  english_pob_choice: When the cloud remained
  chosen_korean: 구름이 … 머무르면
  alternatives_korean:
  - 구름이 오래 머물면
  - 구름이 오래 머무르면
  - 구름이 머무는 동안
  lexicon: HALOT
  rationale: ב + 부정사구가 시간 부사절을 이루므로, ‘머무르면’으로 자연스럽게 풀어 원문의 지속 의미를 살렸습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 여러 날
  alternatives_korean:
  - 많은 날 동안
  - 오랜 날 동안
  - 오랫동안
  lexicon: HALOT
  rationale: 지속 기간을 간결하게 나타내는 표현으로 ‘여러 날’이 현대 한국어에서 가장 자연스럽습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 반영해, POB의 성별-정확성 원칙에 따라 직역성을 유지했습니다.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  english_pob_choice: the charge of Yahweh
  chosen_korean: 야훼의 명을
  alternatives_korean:
  - 야훼의 책임을
  - 야훼의 부여된 임무를
  - 야훼의 계명을
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 지켜야 할 맡겨진 책무/명령의 뉘앙스가 있어, ‘명을 지키다’로 옮겨 원문의 언약적 책임감을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아니라 언약 անուն으로 쓰인 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְלֹא יִסָּעוּ
  english_pob_choice: and did not set out
  chosen_korean: 떠나지 않았습니다
  alternatives_korean:
  - 출발하지 않았습니다
  - 진군하지 않았습니다
  - 길을 나서지 않았습니다
  lexicon: HALOT
  rationale: 광야 이동 문맥에서 נסע는 진영을 걷고 떠나는 의미이므로, 현대 한국어의 ‘떠나다’가 가장 간결하고 분명합니다.
theological_decisions:
- issue: 야훼의 명령을 따르는 언약적 순종의 표현
  chosen_reading: ‘야훼의 명을 지키고’로, 단순한 규정 준수보다 맡겨진 언약적 의무를 강조했습니다.
  alternative_readings:
  - ‘야훼의 명령을 지키고’
  - ‘야훼의 요구를 지키고’
  rationale: מִשְׁמֶרֶת는 단순 규칙보다 ‘지켜야 할 맡김/책무’의 의미를 가지므로, 본문이 묘사하는 이스라엘의 순종을 언약적 관점에서 드러냈습니다.
  doctrine_reference: 'POB translation philosophy: source-direct covenantal nuance'
- issue: 고유명사 יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 하나님의 언약명을 직접 사용하므로, 대체 칭호로 바꾸지 않고 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
