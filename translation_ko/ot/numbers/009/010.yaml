  naturalness: ‘너희 대대로 있든지’는 현대 한국어에서 자연스럽지 않습니다. ‘너희 가운데 있든지 너희 후손 대대 가운데 있든지’로 고치면 현재 공동체와 후대에 대한 법규의 적용을 명료하게 나타냅니다. ‘사체’보다 일반 독자가 이해하기 쉬운 ‘시체’를 사용하되, 의례적 부정이라는 뜻은 유지했습니다.
