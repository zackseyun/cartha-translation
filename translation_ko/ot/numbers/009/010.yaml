id: NUM.9.10
reference: Numbers 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel'; the phrase refers to the Israelite community as a whole.
    reason: lexical_alternative
  - marker: b
    text: Or 'unclean because of a corpse.' The Hebrew idiom literally says 'unclean for a person/soul' and in this legal context refers to corpse impurity.
    reason: lexical_alternative
  - marker: c
    text: Or 'throughout your generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. “사체로 인해 부정해진 사람이나, 먼 길을 가는 사람은, 너희 가운데 있든지 너희 대대로 있든지, 야훼를 위한 유월절을 지켜야 합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르십시오
  alternatives_korean:
  - 말하십시오
  - 말하라
  lexicon: WLC/표준 용례
  rationale: 모세에게 주어지는 신탁 도입의 명령형을 자연스러운 공적 문체로 옮기되, 뒤따르는 직접 인용을 예고하는 표현을 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 남성형 집합 명칭을 본문에서 유지해 원문 형식을 보존했고, 공동체 전체를 가리키는 기능은 문맥으로 드러나게 했습니다.
- source_word: טָמֵא לָנֶפֶשׁ
  english_pob_choice: unclean by a dead body
  chosen_korean: 사체로 인해 부정해진
  alternatives_korean:
  - 시체로 인해 부정해진
  - 죽은 사람으로 인해 부정해진
  lexicon: HALOT
  rationale: 법적 관용구를 한국어로 풀어, 문자적으로는 '영혼/생명'이지만 실제 의미가 사체 접촉으로 인한 의례적 부정임을 분명히 했습니다.
- source_word: בְדֶרֶךְ רְחֹקָה
  english_pob_choice: on a distant journey
  chosen_korean: 먼 길을 가는
  alternatives_korean:
  - 먼 여행 중인
  - 먼 곳에 있는
  lexicon: HALOT
  rationale: 장소적 거리보다 이동 중인 상태를 자연스럽게 드러내어, 성소 예식 참여에 방해가 되는 상황을 한국어로 전달했습니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: among your generations
  chosen_korean: 너희 대대로
  alternatives_korean:
  - 너희 세대에 걸쳐
  - 너희 모든 세대에
  lexicon: HALOT
  rationale: 규정이 현재 공동체를 넘어 후대까지 이어진다는 점을 간결하게 살리되, 원문의 반복 구조와 어울리도록 옮겼습니다.
- source_word: וְעָשָׂה פֶסַח
  english_pob_choice: he shall keep the Passover
  chosen_korean: 유월절을 지켜야 합니다
  alternatives_korean:
  - 유월절을 행해야 합니다
  - 유월절을 지켜야 합니다
  lexicon: HALOT
  rationale: עשה + פסח의 관용적 의미를 '지키다'로 옮겨 예식 준수의 뜻을 자연스럽게 표현했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께 드리는
  - 야훼를 향한
  lexicon: WLC/프로젝트 용례
  rationale: 여호와가 아닌 '야훼'를 사용해 신명기적 언약명 자체를 보존했고, 유월절의 목적지향성을 한국어 조사로 드러냈습니다.
theological_decisions:
- issue: 예식 규정의 강제성 표현
  chosen_reading: '''유월절을 지켜야 합니다'''
  alternative_readings:
  - '''유월절을 지킬 수 있습니다'''
  - '''유월절을 지키게 됩니다'''
  rationale: 원문은 예외 상황에서도 유월절 준수를 규정하는 법문이므로, 허용의 의미로 약화하지 않고 의무형으로 옮겼습니다.
  doctrine_reference: Numbers 9:10 문맥상 율법 규정
