base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
  footnotes:
  - marker: a
    text: Or 'appoint' or 'set apart' cities for yourselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the manslayer who strikes down a person unintentionally'; that is, one guilty of unintentional homicide, not deliberate murder.
