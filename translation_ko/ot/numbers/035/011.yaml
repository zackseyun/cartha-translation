  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
  footnotes:
  - marker: a
    text: Or 'appoint' or 'set apart' cities for yourselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the manslayer who strikes down a person unintentionally'; that is, one guilty of unintentional homicide, not deliberate murder.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 너희는 너희를 위해 도시들을 지정해야 합니다. 그것들은 너희를 위한 도피성들이 되어야 합니다. 그리고 사람을 죽인 자, 곧 부지중에 사람을 죽인 자가 그리로 도망해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임명하다’ 또는 ‘따로 세우다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람을 죽인 자, 곧 부지중에 사람을 죽인 자’를 뜻합니다. 즉 고의적 살인이 아니라 비고의적 살해를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  english_pob_choice: you shall designate
  chosen_korean: 지정해야 합니다
  alternatives_korean:
  - 임명해야 합니다
  - 정해야 합니다
  - 따로 세워야 합니다
  lexicon: HALOT
  rationale: 법적·제도적 맥락에서 특정 도시를 공식적으로 배정하는 뜻을 살려 ‘지정하다’로 옮겼습니다.
- source_word: עָרִים ... עָרֵי מִקְלָט
  english_pob_choice: cities ... cities of refuge
  chosen_korean: 도시들 ... 도피성들
  alternatives_korean:
  - 성읍들 ... 피난 성읍들
  - 도시들 ... 피난처 도시들
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 살리면서, מִקְלָט의 법적 보호처 의미를 ‘도피성’으로 간결하게 반영했습니다.
- source_word: רֹצֵחַ מַכֵּה נֶפֶשׁ
  english_pob_choice: the manslayer who strikes down a person
  chosen_korean: 사람을 죽인 자, 곧 부지중에 사람을 죽인 자
  alternatives_korean:
  - 사람을 친 자, 곧 부지중에 사람을 친 자
  - 살인자, 곧 부지중에 사람을 죽인 자
  lexicon: HALOT
  rationale: רֹצֵחַ을 곧바로 ‘살인자’로 단정하지 않고, 뒤의 수식구를 따라 ‘사람을 죽인 자’로 풀어 번역해 의도적 살인과 구별했습니다. ‘부지중에’는 בִּשְׁגָגָה의 비고의성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 의도적 살인과 비고의적 살인의 구별
  chosen_reading: ‘사람을 죽인 자’ 뒤에 ‘곧 부지중에 사람을 죽인 자’라고 덧붙여, רֹצֵחַ가 여기서 곧바로 ‘살인자’라는 도덕적 판정을 뜻하지 않음을 드러냈습니다.
  alternative_readings:
  - 살인자
  - 살해한 자
  rationale: 율법 본문의 분류를 보존하여, 고의적 살인과 과실치사를 본문이 구별하는 긴장을 그대로 유지합니다.
  doctrine_reference: '원문 우선 번역 원칙: 본문이 구별하는 법적 범주를 번역에서 미리 평탄화하지 않습니다.'
