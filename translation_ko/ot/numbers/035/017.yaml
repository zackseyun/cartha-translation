  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
  footnotes:
  - marker: a
    text: Hebrew literally, 'with a stone of hand,' that is, a stone held in the hand or suitable for use by hand as a weapon.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 만일 사람이 죽을 수 있는 손에 쥘 만한 돌로 그를 쳐서 그가 죽으면, 그는 살인자입니다. 그 살인자는 반드시 죽임을 당해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손의 돌’이며, 손에 쥐고 사용할 수 있는 돌을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: Or if
  chosen_korean: 또 만일
  alternatives_korean:
  - 그리고 만일
  - 그러나 만일
  lexicon: HALOT
  rationale: 법률 조항의 분기 표지로서 새 사례를 도입하므로, 한국어에서는 자연스러운 조건 연결인 ‘또 만일’을 택했습니다.
- source_word: בְּאֶבֶן יָד
  english_pob_choice: with a stone in the hand
  chosen_korean: 손에 든 돌로
  alternatives_korean:
  - 손에 있는 돌로
  - 손에 쥔 돌로
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어에서 어색한 ‘손의 돌’류 표현을 피하고, 손에 들고 사용할 수 있는 도구라는 구체성을 살렸습니다.
- source_word: רֹצֵחַ
  english_pob_choice: murderer
  chosen_korean: 살인자
  alternatives_korean:
  - 살해자
  - 사람을 죽인 자
  lexicon: HALOT
  rationale: 이 문맥은 단순한 죽임이 아니라 법적·윤리적으로 책임 있는 살인을 가리키므로, 중립적인 ‘죽인 자’보다 ‘살인자’가 더 정확합니다.
- source_word: מוֹת יוּמַת
  english_pob_choice: must surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽여야 합니다
  - 반드시 사형을 받아야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조형 표현을 한국어의 ‘반드시’로 살리고, 판결의 수동적 집행을 드러내는 ‘죽임을 당해야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 살인 판정의 법적 성격
  chosen_reading: רֹצֵחַ를 ‘살인자’로 옮겨, 고의적이고 책임 있는 살인을 법적으로 규정하는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 죽인 자
  - 살해자
  rationale: 문맥상 의도적 살인을 가리키므로, 완곡한 표현보다 판결의 도덕적·법적 무게를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
