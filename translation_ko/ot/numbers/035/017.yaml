  to: 또 만일 사람이 죽을 수 있는 손에 쥘 만한 돌로 그를 쳐서 그가 죽으면, 그는 살인자입니다. 그 살인자는 반드시 죽임을 당해야 합니다.[a]
  rationale: 살상 가능성을 나타내는 히브리어 관계절의 의미를 한국어에서 분명히 하고, ‘손의 돌’에 관한 각주가 본문이 확정하지 않는 용법을 덧붙이지 않도록 조정했습니다. 살인자 판정과 사형 집행이라는 법적 표현 및 원문의 강조는 유지했습니다.
