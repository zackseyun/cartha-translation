revisions:
- from: 그리고 너희가 레위인들에게 줄 성읍들은, 도피성 여섯 성읍[a]이어야 합니다. 너희는 거기로 살인자가 피하여 갈 수 있게 하여야 하며, 그 밖에 또 마흔두 성읍을 더 주어야 합니다.
  to: 너희가 레위인들에게 줄 성읍들은, 사람을 죽인 자가 그리로 피하여 갈 수 있도록 줄 도피성으로 정할 여섯 성읍이어야 합니다[a]. 그 밖에 마흔두 성읍을 더 주어야 합니다.
  rationale: The revision removes the unintended implication of intentional murder, clarifies the Korean construction for the six cities designated as cities of refuge, and retains the formal legal-register terminology and the numerical/additive relationship of the Hebrew.
  reviewer_model: gpt-5.6-terra
