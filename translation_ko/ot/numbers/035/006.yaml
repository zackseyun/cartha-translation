id: NUM.35.6
reference: Numbers 35:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
  footnotes:
  - marker: a
    text: Or 'the slayer' or 'the killer.' The Hebrew term here is used in the legal context of the cities of refuge and does not by itself specify whether the killing was intentional or accidental; 'manslayer' preserves that nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 레위인들에게 줄 성읍들은, 도피성 여섯 성읍[a]이어야 합니다. 너희는 거기로 살인자가 피하여 갈 수 있게 하여야 하며, 그 밖에 또 마흔두 성읍을 더 주어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘피난 성읍들’에 가깝습니다. 이 표현은 살인 행위의 의도 여부를 이 구절만으로 규정하지 않는 법적 용례를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים / עִיר
  english_pob_choice: the cities / cities
  chosen_korean: 성읍들 / 성읍
  alternatives_korean:
  - 도시들 / 도시
  - 읍들 / 읍
  lexicon: HALOT
  rationale: 레위인에게 분배되는 지파별 거주지 문맥에서는 현대어 ‘도시’보다 성경적 법조문에 어울리는 ‘성읍’이 더 정확하고 자연스럽습니다.
- source_word: לַלוִיִּם
  english_pob_choice: to the Levites
  chosen_korean: 레위인들에게
  alternatives_korean:
  - 레위 사람들에게
  - 레위 지파에게
  lexicon: HALOT
  rationale: 수여 대상이 분명한 여격이므로 ‘레위인들에게’로 옮겼습니다.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  english_pob_choice: the six cities of refuge
  chosen_korean: 도피성 여섯 성읍
  alternatives_korean:
  - 피난 성읍 여섯 성읍
  - 피할 성읍 여섯 성읍
  lexicon: HALOT
  rationale: מִקְלָט는 법적 보호를 위한 ‘피난처/도피처’의 뜻이므로, 한국어 관용 표현인 ‘도피성’을 유지하되 수량·명사를 맞춰 ‘도피성 여섯 성읍’으로 구성했습니다.
- source_word: לָנוּס שָׁמָּה הָרֹצֵחַ
  english_pob_choice: for the manslayer to flee there
  chosen_korean: 거기로 살인자가 피하여 갈 수 있게
  alternatives_korean:
  - 거기로 살인자가 도망가게
  - 거기로 피살자가 피하게
  lexicon: HALOT
  rationale: נוּס의 핵심은 ‘피하다/도망하다’이므로 ‘피하여 가다’로 살리고, 문맥상 법적 용어인 רֹצֵחַ는 POB의 선택을 따라 ‘살인자’로 옮겼습니다.
- source_word: וַעֲלֵיהֶם תִּתְּנוּ
  english_pob_choice: and besides them you shall give
  chosen_korean: 그 밖에 또 … 더 주어야 합니다
  alternatives_korean:
  - 그들 위에 더 주어야 합니다
  - 그 외에 또 … 주어야 합니다
  lexicon: HALOT
  rationale: עַל + 인칭대명사의 여기서는 공간적 ‘위에’가 아니라 수량 추가를 나타내므로, 현대 한국어로는 ‘그 밖에 또 … 더’가 가장 분명합니다.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  english_pob_choice: forty-two cities
  chosen_korean: 마흔두 성읍
  alternatives_korean:
  - 마흔두 도시
  - 사십이 성읍
  lexicon: HALOT
  rationale: 히브리어의 수사+단수 명사 관용은 한국어에서 복수 의미로 옮겨 ‘마흔두 성읍’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 도피성의 기능을 현대어로 어떻게 드러낼지
  chosen_reading: ‘도피성’이라는 전통적 법적 용어를 유지해, 살인자에게 제공되는 보호·피난의 제도를 분명히 했습니다.
  alternative_readings:
  - ‘피난 성읍’으로 순화
  - ‘피할 성읍’으로 설명적 번역
  rationale: 본문은 단순한 지리 정보가 아니라 율법적 보호 제도를 가리키므로, 관용어 ‘도피성’이 의미와 전통을 함께 가장 잘 보존합니다.
  doctrine_reference: 민수기 35장 도시 분배와 살인 사건의 법적 보호 규정
