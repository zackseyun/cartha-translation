base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
  footnotes:
  - marker: a
    text: Or 'common lands' or 'open land' for the area surrounding the cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 레위인들에게 줄 성읍들은 모두 마흔여덟 성읍이며, 그것들과 그 목초지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘목초지’는 성읍 둘레의 개방지, 곧 공지나 주변 들판을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  english_pob_choice: All the cities
  chosen_korean: 여러분이 … 줄 성읍들은 모두
  alternatives_korean:
  - 모든 성읍들은
  - 성읍마다 모두
  lexicon: HALOT
  rationale: הֶעָרִים의 집합 전체를 가리키는 수량 표현이므로 ‘모두’를 살리고, עִיר는 법문 맥락에서 ‘성읍’이 자연스럽습니다.
- source_word: אֲשֶׁר תִּתְּנוּ לַלוִיִּם
  english_pob_choice: that you give to the Levites
  chosen_korean: 여러분이 레위인들에게 줄
  alternatives_korean:
  - 여러분이 레위인들에게 주는
  - 여러분이 레위인들에게 주어야 할
  lexicon: HALOT
  rationale: 직접적인 2인칭 복수 지시문이므로 ‘여러분이’로 옮기고, 법률적 명령의 현재형 감각을 살려 ‘줄’로 표현했습니다.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  english_pob_choice: forty-eight cities
  chosen_korean: 마흔여덟 성읍
  alternatives_korean:
  - 사십팔 성읍
  - 마흔여덟 개의 성읍
  lexicon: HALOT
  rationale: 히브리어 수사 표현을 한국어 관용에 맞게 붙여 쓰되, 수량 단위를 명확히 하기 위해 ‘성읍’을 유지했습니다.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  english_pob_choice: together with their pasturelands
  chosen_korean: 그것들과 그 목초지입니다
  alternatives_korean:
  - 그것들과 그 주변 들판입니다
  - 그것들과 그 공지입니다
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍을 둘러싼 개방지/목초지로 이해되며, 여기서는 기능적 의미를 반영해 ‘목초지’로 옮겼습니다.
theological_decisions:
- issue: 레위인 몫의 성읍과 그 주변지의 범주
  chosen_reading: 성읍들뿐 아니라 그 성읍에 딸린 개방지까지 포함하는 분배 규정으로 읽었습니다.
  alternative_readings:
  - 성읍만을 말하는 것으로 좁게 읽기
  - 토지 소유 일반 원칙으로 확장해 읽기
  rationale: 문맥상 מִגְרְשֵׁיהֶן이 성읍과 분리되지 않은 부속 토지를 가리키므로, 분배 범위를 본문이 직접 말하는 만큼만 유지했습니다.
  doctrine_reference: 민수기 35장 레위인 성읍 규례
