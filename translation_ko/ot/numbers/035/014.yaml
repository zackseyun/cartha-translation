source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
  footnotes:
  - marker: a
    text: Or 'you shall give'; the Hebrew verb is literally 'give,' here in the sense of assigning or designating the cities for this purpose.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan' or 'on the other side of the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요단 건너편에 있는 성읍들 가운데 셋과 가나안 땅에 있는 성읍들 가운데 셋을 지정하십시오. 그것들은 도피 성읍들이 되어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  english_pob_choice: you shall appoint
  chosen_korean: 지정하십시오
  alternatives_korean:
  - 정하십시오
  - 주십시오
  lexicon: HALOT
  rationale: 히브리어 נתן은 문자적으로 ‘주다’이지만, 여기서는 성읍들을 특정 목적을 위해 할당·설정하는 법적 행위이므로 한국어로는 ‘지정하십시오’가 가장 자연스럽고 정확합니다.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 건너편에 있는
  alternatives_korean:
  - 요단 저편의
  - 요단을 건너
  - 요단 강 건너편에 있는
  lexicon: HALOT
  rationale: 지리적 관계를 간결하게 살리면서도 본문의 관점이 지나치게 특정되지 않도록 ‘요단 건너편에 있는’으로 옮겼습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅에 있는
  alternatives_korean:
  - 가나안 땅에
  - 가나안에 있는
  lexicon: HALOT
  rationale: 히브리어가 ‘땅’을 분명히 말하므로 한국어도 토지·영역의 강조를 살려 ‘가나안 땅에 있는’으로 옮겼습니다.
- source_word: עָרֵי מִקְלָט
  english_pob_choice: cities of refuge
  chosen_korean: 도피 성읍들
  alternatives_korean:
  - 피난 성읍들
  - 피난처 성읍들
  lexicon: HALOT
  rationale: 이 법정 용어는 단순한 일반 피난처가 아니라 살인 사건과 관련된 보호 성읍을 가리키므로, 전통적이면서도 기능을 드러내는 ‘도피 성읍들’을 택했습니다.
