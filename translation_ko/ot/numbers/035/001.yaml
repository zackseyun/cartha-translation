base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: ko
  text: 야훼께서 모세에게 모압 평지, 곧 여리고 맞은편 요단가에서 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약적 고유명칭을 제목어로 바꾸지 않고 음역하여, 영어 POB의 Yahweh 결정을 한국어로 그대로 반영했습니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압 평지
  alternatives_korean:
  - 모압의 들판
  - 모압의 광야 평지
  lexicon: HALOT
  rationale: 지명 관용구로 굳어진 표현을 살리면서, עֲרָבוֹת의 지형 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  english_pob_choice: by the Jordan at Jericho
  chosen_korean: 여리고 맞은편 요단가
  alternatives_korean:
  - 여리고 곁의 요단
  - 여리고 앞 요단강가
  lexicon: HALOT
  rationale: עַל의 위치 관계를 직역적이되 자연스럽게 풀어, 지리적 배치를 분명히 드러냈습니다. '요단가'는 강변 근처를 간결하게 나타냅니다.
- source_word: וַיְדַבֵּר ... לֵאמֹר
  english_pob_choice: spoke ... saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 한국어 서술에서는 '말씀하다'가 이어지는 인용문 도입과 가장 자연스럽고, 하나님의 발화를 경건하게 드러냅니다.
theological_decisions:
- issue: 하나님의 이름을 한국어로 어떻게 처리할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 יְהוָה를 직접 사용하므로, 제목어 대체보다 고유명칭 음역을 택해 본문이 가진 언약적 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
