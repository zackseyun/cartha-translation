  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희가 요단을 건너 가나안 땅으로 들어갈 때”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현을 살린 것으로, 관용적으로는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 직역상 ‘sons of Israel’이지만, 한국어 성경에서는 집합적 호칭인 ‘이스라엘 자손’이 자연스럽고 성별 정보를 불필요하게 바꾸지 않습니다.
- source_word: דַּבֵּר … וְאָמַרְתָּ
  english_pob_choice: Speak … and say
  chosen_korean: 말하여 … 이르십시오
  alternatives_korean:
  - 말하고 … 말하십시오
  - 말하여 … 말씀하십시오
  lexicon: HALOT
  rationale: 두 개의 동사를 모두 살려 명령-진술의 반복 구조를 유지하되, 수신자에게 직접 하는 공적 명령으로 ‘이르십시오’를 선택했습니다.
- source_word: כִּי אַתֶּם עֹבְרִים
  english_pob_choice: When you cross
  chosen_korean: 너희가 … 건너
  alternatives_korean:
  - 너희가 … 건널 때
  - 너희가 … 건너갈 때
  - 너희가 … 건너고 있을 때
  lexicon: HALOT
  rationale: 시간절의 כִּי를 한국어 ‘-ㄹ 때’로 옮겨, 임박한 미래 상황을 법적 지시문답게 자연스럽게 표현했습니다.
- source_word: הַיַּרְדֵּן
  english_pob_choice: the Jordan
  chosen_korean: 요단
  alternatives_korean:
  - 요단강
  - 요르단
  lexicon: HALOT
  rationale: 성경 지명으로 굳어진 ‘요단’을 사용해 본문 호칭을 간결하게 유지했습니다.
- source_word: אַרְצָה כְּנָעַן
  english_pob_choice: into the land of Canaan
  chosen_korean: 가나안 땅으로 들어갈 때
  alternatives_korean:
  - 가나안 땅에
  - 가나안 땅으로
  lexicon: HALOT
  rationale: 방향접미사 아를 한국어 이동 표현 ‘들어가다’로 반영하여 단순한 도착이 아니라 진입을 나타냈습니다.
