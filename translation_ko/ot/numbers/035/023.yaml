id: NUM.35.23
reference: Numbers 35:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ בְ/כָל אֶ֜בֶן אֲשֶׁר יָמ֥וּת בָּ/הּ֙ בְּ/לֹ֣א רְא֔וֹת וַ/יַּפֵּ֥ל עָלָ֖י/ו וַ/יָּמֹ֑ת וְ/הוּא֙ לֹא אוֹיֵ֣ב ל֔/וֹ וְ/לֹ֥א מְבַקֵּ֖שׁ רָעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
  footnotes:
  - marker: a
    text: Literally, 'without seeing.' The phrase indicates lack of awareness rather than necessarily denying all physical sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 죽일 수 있는 어떤 돌로, 보지 못한 채 그에게 그것을 던져 그가 죽게 하였으나, 그는 그의 원수가 아니었고 그의 해를 찾고 있지 않았습니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보지 못한 채’입니다. 이 표현은 반드시 육안의 부재만을 뜻한다기보다, 상황을 인지하지 못한 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל אֶבֶן
  english_pob_choice: with any stone
  chosen_korean: 어떤 돌로
  alternatives_korean:
  - 어느 돌로
  - 아무 돌로나
  lexicon: HALOT
  rationale: בְּ plus 수단 표시는 한국어에서 도구격 ‘-로’가 자연스럽고, כָּל의 포괄성을 ‘어떤’으로 간결하게 살렸습니다.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  english_pob_choice: by which one could die
  chosen_korean: 죽일 수 있는
  alternatives_korean:
  - 사람이 죽을 수 있는
  - 죽을 만한
  lexicon: HALOT
  rationale: 법문 맥락에서 האבן의 치사 가능성을 말하므로 ‘죽일 수 있는’이 가능성을 분명히 드러내면서도 과도한 의역을 피합니다.
- source_word: בְּלֹא רְאוֹת
  english_pob_choice: without seeing
  chosen_korean: 보지 못한 채
  alternatives_korean:
  - 보지 않고
  - 알지 못한 채
  - 인지하지 못한 채
  lexicon: HALOT
  rationale: 직역하면 ‘보지 않음’이지만 한국어 법률체에서는 상태를 나타내는 ‘-한 채’가 자연스럽고, 인지 부재의 뉘앙스를 유지합니다.
- source_word: וַיַּפֵּל עָלָיו
  english_pob_choice: he dropped it on him
  chosen_korean: 그에게 그것을 던져
  alternatives_korean:
  - 그 위에 그것을 떨어뜨려
  - 그에게 그것을 떨어뜨려
  lexicon: HALOT
  rationale: 히필의 사역성을 살려 행위자의 의도적 작용을 드러내야 하므로, 한국어에서는 ‘던져’가 가장 직접적으로 가해 행위를 표현합니다.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  english_pob_choice: and was not seeking his harm
  chosen_korean: 그의 해를 찾고 있지 않았고
  alternatives_korean:
  - 그에게 해를 구하고 있지 않았고
  - 그를 해치려 하고 있지 않았고
  - 그에게 해를 끼칠 생각이 없었고
  lexicon: HALOT
  rationale: רָעָה를 관계적 법문에서 ‘해/해를 끼침’으로 옮겨 구체적 손상을 드러냈고, ‘찾고 있지 않았고’는 שָׁקַשׁ/בקש의 의도 추구를 반영합니다.
theological_decisions:
- issue: 우발적 과실과 고의적 적대의 구분
  chosen_reading: ‘보지 못한 채’와 ‘그의 원수가 아니었고’의 병치를 살려, 행위의 결과는 치명적이지만 적의와 악의 추구는 없었던 경우로 읽게 했습니다.
  alternative_readings:
  - ‘실수로’
  - ‘고의 없이’
  - ‘우연히’
  rationale: 본문은 결과만이 아니라 인식 부재와 적대 부재를 함께 제시하므로, 한국어도 두 차원을 모두 남겨 법적 책임 판단의 근거를 보존해야 합니다.
  doctrine_reference: 민수기 35장의 도피성/과실살인 규정
