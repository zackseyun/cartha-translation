  source_fidelity: 현 번역은 הָרֹצֵחַ을 ‘살인자’로, גֹּאֵל הַדָּם을 ‘피살자의 대변자’로 옮겨 본문의 법적·의미적 범위를 바꿉니다. 전자는 과실 치사 가능성을 포함하는 ‘살해한 사람’이며, 후자는 법적으로 피의 보복을 맡은 자입니다. 마지막 관계절은 히브리어에서 능동형이지만 행위 주어가 명시되지 않은 난해한 구문이므로, 한국어 본문에서는 자연스러운 피동형으로 옮기고 각주에서 원문의 형태를 밝혀야 합니다.
