  to: 회중은 살해한 사람을 피의 보복자의 손에서 구해 내고, 회중은 그를 그가 도망해 들어간 그의 피난성으로 돌려보내야 합니다. 그는 거룩한 기름으로 기름 부음을 받은 대제사장이 죽을 때까지 그 성에 머물러야 합니다[a].
  rationale: 법적 판단을 앞당기는 ‘살인자’를 ‘살해한 사람’으로 바꾸고, גֹּאֵל הַדָּם의 확립된 법적 의미를 ‘피의 보복자’로 회복했습니다. 피난성으로의 도피 방향은 ‘도망해 들어간’으로 명확히 했습니다. 마지막 절은 한국어에서 능동형의 무명 주어를 그대로 유지하면 오해를 낳으므로 피동형으로 번역하되, 원문의 능동형과 주어 미표시를 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:01Z'
