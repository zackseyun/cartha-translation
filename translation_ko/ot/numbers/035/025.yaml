  language: ko
  text: 회중은 살인자를 피살자의 대변자 손에서 구원하여, 그가 도망갔던 피난 도시로 돌려보내야 하리니, 그가 그 도시에 거하여 거룩한 기름으로 기름 부음을 받은 대제사장이 죽을 때까지 거기서 살리라.
