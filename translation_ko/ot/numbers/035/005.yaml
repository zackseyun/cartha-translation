id: NUM.35.5
reference: Numbers 35:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
  footnotes:
  - marker: a
    text: Hebrew literally 'sea' for the western side, using the common directional idiom based on the Mediterranean Sea.
    reason: lexical_alternative
  - marker: b
    text: Or 'common land' or 'open land' of the cities; the Hebrew term refers to the land surrounding a city, often used for grazing.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 성읍 밖에서 동쪽 편을 이천 규빗, 남쪽 편을 이천 규빗, 서쪽 편[a]을 이천 규빗, 북쪽 편을 이천 규빗으로 측량하십시오. 성읍은 그 가운데에 있고, 이것이 그들에게 성읍들의 목초지[b]가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다’라고 하며, 지중해를 기준으로 한 일반적인 방향 관용어로 서쪽을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성읍들의 공용지’ 또는 ‘성읍들 주변의 열린 땅’. 히브리어는 성읍 주변에 속한 열린 땅을 가리키며, 흔히 방목에 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  english_pob_choice: You shall measure
  chosen_korean: 측량하되
  alternatives_korean:
  - 재어 보되
  - 재야 합니다
  - 측정하되
  lexicon: HALOT
  rationale: 법률 문맥의 지시형을 살려 공적·공간적 경계 설정의 뉘앙스를 반영했습니다. 단순한 '재다'보다 '측량하다'가 토지 경계 문맥에 더 정확합니다.
- source_word: פְּאַת
  english_pob_choice: side
  chosen_korean: 편
  alternatives_korean:
  - 면
  - 쪽
  - 변
  lexicon: HALOT
  rationale: 네 방향을 열거하는 구조에서 '편'이 한국어 성경체로 가장 자연스럽고, 단순한 기하학적 '변'보다 방향성을 잘 드러냅니다.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  english_pob_choice: east / south / west / north
  chosen_korean: 동쪽 / 남쪽 / 서쪽 / 북쪽
  alternatives_korean:
  - 동편 / 남편 / 서편 / 북편
  - 동쪽 면 / 남쪽 면 / 서쪽 면 / 북쪽 면
  lexicon: HALOT
  rationale: 지시어는 현대 한국어의 기본 방위어로 옮겨 반복 구조를 분명하게 했습니다. יָם은 문자적으로는 '바다'지만 여기서는 관용적 방위어 '서쪽'을 따라야 합니다.
- source_word: אַלְפַּיִם בָּאַמָּה
  english_pob_choice: two thousand cubits
  chosen_korean: 이천 규빗
  alternatives_korean:
  - 이천 자
  - 이천 규
  lexicon: HALOT
  rationale: 고대 길이 단위를 보존해 본문의 구체성을 유지했습니다. 한국어 성경에서 통용되는 '규빗'을 사용했습니다.
- source_word: מִגְרְשֵׁי הֶעָרִים
  english_pob_choice: the pasture lands of the cities
  chosen_korean: 성읍들의 목초지
  alternatives_korean:
  - 성읍들의 공터
  - 성읍들의 빈터
  - 성읍 둘레의 열린 땅
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍 주변의 개방지이면서 목축에 쓰이는 땅을 가리키므로, 본문과 POB의 해석을 따라 '목초지'로 옮겼습니다. '성읍들의'은 히브리어 복수를 반영합니다.
theological_decisions:
- issue: 성읍을 가운데 두는 공간 배치의 법적 의미
  chosen_reading: '''성읍은 그 가운데에 두어야 합니다''로 옮겨, 단순한 위치 설명이 아니라 규정된 경계 설정임을 드러냈습니다.'
  alternative_readings:
  - '''성읍은 가운데 있습니다'''
  - '''성읍이 한가운데 있게 하십시오'''
  rationale: 문맥은 레위 성읍의 주변 구역을 법적으로 지정하는 명령입니다. 그래서 상태 진술보다 규정/명령의 성격이 살아나도록 했습니다.
  doctrine_reference: 민수기 35장 레위 성읍과 그 주변 목초지 규정
- issue: 서쪽을 '바다'로 직역할지 여부
  chosen_reading: 본문에는 '서쪽'으로 옮기고, 히브리어의 '바다' 관용은 본문 각주 없이도 문맥상 명확하므로 본문 가독성을 우선했습니다.
  alternative_readings:
  - '''바다 편'''
  - '''바다 쪽'''
  rationale: 영문 POB도 각주로 관용성을 설명할 뿐 본문은 방향어 'west'로 처리합니다. 한국어 본문도 동일한 원칙을 따르는 것이 가장 투명합니다.
  doctrine_reference: 민수기 35:5 방향 관용어 해석
