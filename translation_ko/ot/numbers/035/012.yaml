    text: Or 'from the blood avenger' or 'from the kinsman-avenger'; Hebrew go'el, a kinship term used here for the one who would avenge bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 도시들은 너희에게 보복자[a]에게서 피할 피난처가 되어, 사람을 죽인 자가 회중 앞에 서서 재판을 받기까지 죽임을 당하지 않도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피의 보복자’ 또는 ‘친족 보복자’. 히브리어 고엘은 친족 관계를 전제하는 용어이며, 여기서는 피 흘림에 대하여 보복할 사람을 가리킵니다.
    reason: גֹאֵל의 친족적·법률적 의미와 가능한 번역을 보존합니다.
