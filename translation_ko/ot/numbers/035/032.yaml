- from: 그리고 너희는 그를 위해서도 속전을 취하지 말아야 하니, 그가 도피성으로 도망하여 그 땅에 돌아와 거주하기까지는 제사장의 죽음 전에는 그렇게 할 수 없습니다.[a][b]
  to: 또한 도피성으로 피신한 사람이 제사장이 죽기 전에 그 땅으로 돌아가 살도록 하기 위하여 그에게서 속전을 받지 마십시오.[a][b]
  rationale: 본문을 속전 수령 금지라는 명령형으로 복원하고, 속전의 목적을 제사장의 죽음 전 조기 귀환으로 연결했습니다. 이는 영어 POB의 주된 독법과 문맥에 부합합니다. 히브리어의 압축된 수식 범위는 본문에서 과도하게 해설하지 않고 주석에서 대안 독법으로 남겼습니다.
