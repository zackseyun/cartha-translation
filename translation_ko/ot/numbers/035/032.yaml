id: NUM.35.32
reference: Numbers 35:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
  footnotes:
  - marker: a
    text: Or 'compensation' or 'payment'; Hebrew כֹּפֶר refers to a ransom-price or compensatory payment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew syntax is compact and may also be understood as forbidding payment connected with his remaining in or returning from the city of refuge before the priest dies.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 도피성으로 피신한 사람이 제사장이 죽기 전에 그 땅으로 돌아가 살도록 하기 위하여 그에게서 속전을 받지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보상’이나 ‘지불’. 히브리어 כֹּפֶר는 속전, 곧 몸값이나 보상으로 치르는 대가를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 구문은 압축적입니다. 도피성에 피신하는 일과 관련하여 속전을 받는 것을 금하는 뜻으로도, 제사장이 죽기 전에 그 성읍에서 나오거나 그 땅으로 돌아가는 것과 관련하여 속전을 받는 것을 금하는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  english_pob_choice: ransom
  chosen_korean: 속전
  alternatives_korean:
  - 몸값
  - 대속금
  - 보상금
  lexicon: HALOT
  rationale: 법적 맥락에서 כֹּפֶר는 단순한 보상보다 대가를 치르고 의무를 면하게 하는 '속전'의 성격이 강하므로, 전통적이지만 의미를 정확히 드러내는 표현을 택했습니다.
- source_word: לָנוּס
  english_pob_choice: for him who has fled
  chosen_korean: 그를 위해서도
  alternatives_korean:
  - 도피하기 위해
  - 그가 도망하도록
  - 그가 피신하도록
  lexicon: HALOT
  rationale: 히브리어는 도피성 문맥 속에서 이미 도망한 자를 가리키는 압축된 구문이므로, 한국어에서는 문맥을 따라 대상자를 드러내되 '도망/피신'의 법적 상황이 보이도록 옮겼습니다.
- source_word: עִיר מִקְלָטוֹ
  english_pob_choice: his city of refuge
  chosen_korean: 도피성
  alternatives_korean:
  - 그의 피난 성읍
  - 피난처 성읍
  - 그의 도피 성읍
  lexicon: HALOT
  rationale: ישראל의 법적 용어인 'city of refuge'는 한국어 성경 전통에서도 '도피성'이 가장 직접적으로 대응하므로 이를 사용했습니다.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  english_pob_choice: to return to live in the land
  chosen_korean: 그 땅에 돌아와 거주하기까지는
  alternatives_korean:
  - 그 땅에 돌아와 살기까지는
  - 그 땅으로 돌아가 거주하기까지는
  - 그 땅에 돌아와 머물기까지는
  lexicon: HALOT
  rationale: 연속된 부정사 표현은 '돌아가 다시 거주하다'는 의미이므로, 법률 문맥에 어울리는 '거주하다'를 살려서 번역했습니다.
- source_word: עַד מוֹת הַכֹּהֵן
  english_pob_choice: before the death of the priest
  chosen_korean: 제사장의 죽음 전에는
  alternatives_korean:
  - 제사장이 죽기 전에는
  - 제사장의 죽음까지는
  - 대제사장이 죽기 전에는
  lexicon: HALOT
  rationale: 히브리어의 시간 제한을 분명히 드러내기 위해 '전에는'으로 옮겼고, 원문에 없는 '대'는 넣지 않았습니다.
theological_decisions:
- issue: 도피성 규정에서 속전의 효력
  chosen_reading: 이 구절은 도피성에 피신한 살인자의 법적 처지를 돈으로 바꾸어 주거나, 제사장의 죽음 전에 조기 귀환을 허용하는 어떤 속전도 허락하지 않는다고 읽었습니다.
  alternative_readings:
  - 속전은 단지 도피성에 들어가는 것과 관련된 금지일 수 있다.
  - 속전은 조기 귀환이 아니라 도피성 체류 자체와 관련될 수 있다.
  rationale: 히브리어의 압축된 구문과 영어 POB의 주석이 모두 범위를 넓게 열어 두므로, 특정한 좁은 해석으로 정리하지 않고 금지의 효력을 보존했습니다.
  doctrine_reference: 법적 텍스트의 해석 범위를 과도하게 확정하지 않음
- issue: 문장 구조의 압축성
  chosen_reading: 한국어에서는 원문의 목적·결과 관계를 자연스럽게 드러내기 위해 '…하기까지는' 구조로 풀었습니다.
  alternative_readings:
  - 원문처럼 더 직역하여 불완전한 절 구조를 유지할 수 있다.
  - 문맥상 결과절을 명시적으로 덧붙일 수 있다.
  rationale: 원문 의미를 훼손하지 않으면서 현대 한국어 문장으로 읽히게 하기 위한 최소한의 문법적 정리입니다.
  doctrine_reference: 가독성보다 의미 보존을 우선
