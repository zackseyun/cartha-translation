source:
  edition: WLC
  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
  footnotes:
  - marker: a
    text: Or 'the blood avenger.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he has no blood,' that is, he incurs no bloodguilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 피의 복수자가 그의 도피성의 경계 밖에서 그를 만나, 피의 복수자가 사람을 죽인 자를 죽이면, 피의 복수자에게는 피의 죄가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혈복수자’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그에게 피가 없다’, 곧 피의 복수자에게는 이 죽임에 대한 피의 죄책이 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 혈복수자
  alternatives_korean:
  - 피의 복수자
  - 살인의 복수자
  - 피의 원수
  lexicon: HALOT
  rationale: 법률 문맥에서 ‘gō’ēl ha-dām’은 피값을 갚는 책임을 지닌 친족 집행자를 가리키므로, 의미를 압축하면서도 제도적 기능을 드러내는 ‘혈복수자’로 옮겼습니다.
- source_word: מִחוּץ לִגְבוּל
  english_pob_choice: outside the boundary
  chosen_korean: 경계 밖에서
  alternatives_korean:
  - 경계 밖에
  - 경계 바깥에서
  - 경계 밖으로
  lexicon: HALOT
  rationale: 도피성의 보호 범위를 벗어난 물리적·법적 위치를 간결하게 드러내기 위해 ‘경계 밖에서’로 번역했습니다.
- source_word: עִיר מִקְלָטוֹ
  english_pob_choice: his city of refuge
  chosen_korean: 자기의 도피성
  alternatives_korean:
  - 그의 도피성
  - 피난성
  - 피신 성읍
  lexicon: HALOT
  rationale: 공적 제도명인 ‘city of refuge’를 한국어 성경 용례에 맞게 ‘도피성’으로 고정하고, 소유격은 문맥상 자연스러운 ‘자기의’로 풀었습니다.
- source_word: וְרָצַח
  english_pob_choice: kills
  chosen_korean: 죽이면
  alternatives_korean:
  - 죽여도
  - 살해하면
  - 살인하면
  lexicon: HALOT
  rationale: 이 절은 허용된 추적 살해를 말하므로, 한국어 ‘살인하다’의 범죄 뉘앙스를 피하고 중립적인 ‘죽이다’를 택했습니다.
- source_word: אֵין לוֹ דָּם
  english_pob_choice: he is not guilty of blood
  chosen_korean: 피에 대하여 죄가 없습니다
  alternatives_korean:
  - 그에게 피의 죄가 없습니다
  - 피흘림의 죄가 없습니다
  - 피값이 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 법적 무죄 선언을 살리기 위해 ‘피에 대하여 죄가 없다’는 식으로 옮겨, 혈죄 면책의 뜻을 분명히 했습니다.
theological_decisions:
- issue: רצח의 법적 의미와 한국어 동사 선택
  chosen_reading: ‘죽이면’으로 옮겨, 본문의 합법적 추적 살해가 범죄적 ‘살인’으로 오해되지 않게 했습니다.
  alternative_readings:
  - ‘살인하면’으로 번역하여 רצח의 통상적 어감을 유지함
  - ‘살해하면’으로 더 강한 폭력성을 드러냄
  rationale: 바로 뒤의 ‘피에 대하여 죄가 없습니다’가 이 행위의 법적 무죄를 전제하므로, 한국어에서도 범죄 판단을 미리 덧씌우지 않는 번역이 본문의 뜻에 더 정확합니다.
  doctrine_reference: Translation philosophy §5 (일관성의 예외, 법적 문맥 우선)
