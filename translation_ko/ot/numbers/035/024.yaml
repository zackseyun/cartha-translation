  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
  footnotes:
  - marker: a
    text: Or 'the blood avenger.' The Hebrew phrase denotes the person charged with avenging a relative's blood.
    reason: lexical_alternative
  - marker: b
