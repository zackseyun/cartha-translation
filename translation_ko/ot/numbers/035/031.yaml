review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘살인자의 생명을 속이기 위해’는 히브리어 לְנֶפֶשׁ רֹצֵחַ를 잘못 처리하여 ‘생명을 속이다’라는 전혀 다른 의미가 됩니다. 이는 살인자의 생명을 보전하도록 지불하는 כֹּפֶר를 가리킵니다. 또한 원문의 복수 명령을 현대 한국어의 공적 법률 문체에 맞게 ‘-마십시오’로 옮기고, 사형 책임과 강조된 처형 의무를 보존해야 합니다.
  naturalness: ‘사형에 해당하는 살인자’, ‘그의 목숨을 위해 속전을 받지 마십시오’는 현대 표준어의 격식 있는 법률·서사 문맥에서 자연스럽습니다. ‘반드시 죽임을 당해야 합니다’는 수동·강조 구문을 유지합니다.
  terminology: כֹּפֶר는 여기서 형벌 또는 처형을 면하게 하려는 금전 지급이므로 ‘속전’으로 옮겼습니다. רָשָׁע לָמוּת은 도덕적 비난보다 법적 사형 책임을 나타내므로 ‘사형에 해당하는’으로 번역했습니다.
  issues:
  - severity: high
    issue: ‘살인자의 생명을 속이기 위해’
    rationale: ‘속이기 위해’는 히브리어에 없는 ‘기만하다’의 뜻이며, 속전이 살인자의 목숨을 보전하기 위해 제공된다는 법적 의미를 훼손합니다.
  - severity: medium
    issue: 명령 대상의 수와 문체
    rationale: 원문은 복수형 금지 명령입니다. ‘너는 … 말라’보다 공적 명령문인 ‘… 받지 마십시오’가 목표 합쇼체 및 법률 문맥에 알맞습니다.
  revised_text: 사형에 해당하는 살인자의 목숨을 위해 속전[a]을 받지 마십시오. 그는 반드시 죽임을 당해야 합니다[c].
  revised_footnotes:
  - marker: a
    text: 또는 ‘보상금’이나 ‘속량금’. 히브리어 코페르(כֹּפֶר)는 형벌을 피하거나 석방을 얻기 위해 지불하는 금전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘살인자의 목숨/사람을 위해’. 그 살인자의 목숨을 살려 주기 위한 대가라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그는 반드시 죽임을 당할 것이다’. 히브리어의 강조 구문입니다.
    reason: lexical_alternative
  revision_rationale: 핵심 법률 용어와 문장 관계를 바로잡았습니다. 금지의 대상은 살인자의 목숨을 구하기 위한 속전이며, 사형 책임이 있는 살인자는 반드시 처형되어야 한다는 원문의 강한 법적 요구를 유지합니다.
