revisions:
- from: 그리고 너희가 이스라엘 자손의 소유에서 줄 성읍들은 많은 지파에게서는 늘리고 적은 지파에게서는 줄이되, 각 사람은 자기가 상속받는 기업에 따라 자기 성읍들 가운데서 얼마를 레위 사람들에게 줄 것입니다.
  to: 너희가 이스라엘 자손의 소유에서 줄 성읍들은, 기업이 큰 지파에는 더 많이 주고 기업이 작은 지파에는 더 적게 주십시오. 각 지파는 그들이 상속받은 기업의 분량에 따라 자기 성읍들 가운데 일부를 레위 사람들에게 주어야 합니다.
  rationale: 원문의 비례 배분 명령을 한국어에서 분명히 드러내기 위해, 문맥상 함축된 상속 기업의 크기와 지파 단위를 보충했습니다. 이는 새로운 정보를 더한 것이 아니라 앞뒤의 지파별 기업 분배와 복수 관계절을 한국어 문장에 자연스럽게 반영한 것입니다. ‘기업’, ‘성읍’, ‘레위 사람들’은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:45:49Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 레위 사람들에게 성읍 일부를 비례하여 주라는 핵심 뜻을 대체로 전달합니다. 그러나 מֵאֵת הָרַב/הַמְעַט은 단순히 ‘많은 지파/적은 지파’라기보다 큰·작은 상속 기업(문맥상 지파의 배정분)에 따른 비례를 가리킵니다. 또한 יִנְחָלוּ는 복수이므로 ‘자기가 상속받는’은 수 일치와 문맥상 집단적 수여 주체를 충분히 반영하지 못합니다.
  naturalness: ‘많은 지파에게서는 늘리고 적은 지파에게서는 줄이되’는 무엇을 늘리고 줄이는지 불분명하고, ‘많은 지파’는 지파의 수가 많다는 뜻으로도 읽힐 수 있습니다. 현대 한국어 합쇼체에서는 ‘기업이 큰 지파에는 더 많이 ... 주고’와 같이 비례의 대상과 행위를 밝혀 쓰는 편이 자연스럽습니다.
  terminology: ‘성읍’, ‘이스라엘 자손’, ‘기업’, ‘레위 사람들’은 이 법률·토지 분배 문맥에 적절합니다. 다만 אִישׁ은 여기서 개인 남성을 특정한다기보다 분배적·집단적 용법이므로, 문맥상 ‘각 지파’로 명시하는 것이 자연스럽고 히브리어 복수 동사와도 잘 맞습니다.
  issues:
  - severity: medium
    issue: ‘많은 지파/적은 지파’ 및 ‘늘리고/줄이되’ 표현
    rationale: 원문의 형용사는 생략된 기준을 문맥상 큰·작은 상속 기업으로 대비합니다. 현 표현은 지파의 수를 뜻할 수 있고, 성읍 수를 더 많이 또는 더 적게 주는 행위도 명확히 드러나지 않습니다.
  - severity: medium
    issue: ‘자기가 상속받는 기업’
    rationale: 관계절 동사 יִנְחָלוּ는 복수입니다. 이 구절의 분배적 אִישׁ은 각 개인보다 각 지파/집단을 가리키는 문맥이므로, ‘각 지파가 상속받은 기업’으로 옮기는 것이 수와 의미를 더 정확히 반영합니다.
  revised_text: 너희가 이스라엘 자손의 소유에서 줄 성읍들은, 기업이 큰 지파에는 더 많이 주고 기업이 작은 지파에는 더 적게 주십시오. 각 지파는 그들이 상속받은 기업의 분량에 따라 자기 성읍들 가운데 일부를 레위 사람들에게 주어야 합니다.
