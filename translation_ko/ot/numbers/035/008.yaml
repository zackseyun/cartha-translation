id: NUM.35.8
reference: Numbers 35:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the much you shall increase, and from the little you shall reduce'; the sense is proportional allocation from larger and smaller tribal inheritances.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.' The main text preserves the formally masculine Hebrew expression while conveying the covenant people as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 이스라엘 자손의 소유에서 줄 성읍들은 많은 지파에게서는 늘리고 적은 지파에게서는 줄이되, 각 사람은 자기가 상속받는 기업에 따라 자기 성읍들 가운데서 얼마를 레위 사람들에게 줄 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעָרִים / הָעָרִים
  english_pob_choice: the cities
  chosen_korean: 성읍들은
  alternatives_korean:
  - 도시들은
  - 읍들은
  lexicon: HALOT
  rationale: 레위 성읍 배정 문맥에서는 עִיר를 한국어 성경의 관용에 맞게 ‘성읍’으로 옮기는 것이 가장 직접적이고 문맥에 잘 맞습니다.
- source_word: מֵאֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the possession of the sons of Israel
  chosen_korean: 이스라엘 자손의 소유에서
  alternatives_korean:
  - 이스라엘 자손의 소유 가운데서
  - 이스라엘 자손의 기업에서
  lexicon: HALOT
  rationale: אֲחֻזָּה는 단순한 재산보다 언약적 토지 소유를 가리키므로 ‘소유’로 옮겨 원뜻을 유지했습니다.
- source_word: מֵאֵת הָרַב ... וּמֵאֵת הַמְעַט
  english_pob_choice: from the many ... from the few
  chosen_korean: 많은 지파에게서는 ... 적은 지파에게서는
  alternatives_korean:
  - 많은 데에서는 ... 적은 데에서는
  - 많은 몫에서는 ... 적은 몫에서는
  lexicon: HALOT
  rationale: 히브리어는 수의 많고 적음을 대비하는 관용이므로, 직역적 ‘많은/적은’에 문맥상 대상인 지파를 보충해 비례 배분의 뜻을 드러냈습니다.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  english_pob_choice: Each one, according to his inheritance that they inherit
  chosen_korean: 각 사람은 자기가 상속받는 기업에 따라
  alternatives_korean:
  - 각 사람은 자기 기업의 분량에 따라
  - 각 사람은 자기가 물려받을 분깃에 따라
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미는 ‘각 사람’으로 자연스럽게 살리고, כְּפִי와 נַחֲלָה는 ‘상속받는 기업’으로 옮겨 배분 기준을 분명히 했습니다.
- source_word: מֵעָרָיו לַלְוִיִּם
  english_pob_choice: some of his cities to the Levites
  chosen_korean: 자기 성읍들 가운데서 얼마를 레위 사람들에게 줄 것입니다
  alternatives_korean:
  - 자기 성읍들에서 일부를 레위 사람들에게 줄 것입니다
  - 자기 성읍들 중 얼마를 레위 사람들에게 줄 것입니다
  lexicon: HALOT
  rationale: מן의 부분적 용법을 ‘가운데서 얼마를’로 옮겨, 각 지파가 자기 성읍들 중 일부를 레위 사람들에게 내어주는 뜻을 살렸습니다.
