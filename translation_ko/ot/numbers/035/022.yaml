id: NUM.35.22
reference: Numbers 35:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
  footnotes:
  - marker: a
    text: Or 'without enmity.' The Hebrew term denotes personal hostility or animosity.
    reason: lexical_alternative
  - marker: b
    text: Or 'without ambush' or 'without premeditation.' Literally, 'without lying in wait.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그를 갑자기, 적의 없이 밀쳤거나, 또는 매복하지 않고 어떤 물건이라도 그에게 던졌다면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘적의 없이’입니다. אֵיבָה는 개인 간의 적대감이나 원한을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매복하지 않고’입니다. צְדִיָּה는 ‘엎드려 기다림’ 또는 ‘매복’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …라면
  alternatives_korean:
  - 그리고 …라면
  - 만일 …라면
  lexicon: HALOT
  rationale: 앞절과 대비되는 조건문이므로 ‘그러나’로 역접을 살리고, 법조문 문체에 맞게 조건을 유지했습니다.
- source_word: בְּפֶתַע
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 뜻밖에
  - 불시에
  lexicon: HALOT
  rationale: 돌발성을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּלֹא אֵיבָה
  english_pob_choice: without hostility
  chosen_korean: 적의 없이
  alternatives_korean:
  - 원한 없이
  - 증오 없이
  lexicon: HALOT
  rationale: אֵיבָה는 단순한 감정 이상의 대인적 적대/원한을 가리키므로, 법적 맥락에서 간결한 ‘적의 없이’가 어울립니다.
- source_word: הֲדָפוֹ
  english_pob_choice: pushed him
  chosen_korean: 밀쳤거나
  alternatives_korean:
  - 밀어붙였거나
  - 떠밀었거나
  lexicon: HALOT
  rationale: 신체 접촉으로 인한 우발성을 드러내는 동사로 ‘밀치다’가 가장 자연스럽고, 분기 구조를 살리기 위해 과거형 연결로 처리했습니다.
- source_word: הִשְׁלִיךְ עָלָיו כָּל כְּלִי
  english_pob_choice: threw any object at him
  chosen_korean: 어떤 물건이라도 그에게 던졌다면
  alternatives_korean:
  - 어떤 도구라도 그에게 던졌다면
  - 아무 물건이나 그에게 던졌다면
  lexicon: HALOT
  rationale: כָּל כְּלִי의 포괄성을 살려 ‘어떤 물건이라도’로 옮겼고, עָלָיו는 방향성을 살려 ‘그에게’로 처리했습니다.
- source_word: בְּלֹא צְדִיָּה
  english_pob_choice: without lying in wait
  chosen_korean: 매복하지 않고
  alternatives_korean:
  - 기습하지 않고
  - 미리 노리고 있지 않고
  lexicon: HALOT
  rationale: צְדִיָּה는 ‘엎드려 기다림/매복’의 구체적 이미지를 가지므로, 법적 대비를 살리는 ‘매복하지 않고’가 적절합니다.
theological_decisions:
- issue: 이 절의 법적 대비는 우발성과 고의성을 구별하는 데 있습니다.
  chosen_reading: 갑작스러운 충돌이나 투척이 있었더라도, 적의와 매복이 없으면 고의 살해가 아니라는 점을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘사전 계획 없이’
  - ‘미리 마음먹지 않고’
  rationale: 본문은 심리적 범주를 추상화하기보다, 적의·매복이라는 구체적 법적 기준으로 책임을 구분합니다.
  doctrine_reference: 민수기 35장 피난처/과실치사 규례
