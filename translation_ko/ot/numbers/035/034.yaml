translation:
  language: ko
  text: 너희는 너희가 거주하고 있는 땅, 내가 그 한가운데에 거주하는 그 땅을 더럽혀서는 안 됩니다. 이는 나 야훼가 이스라엘 자손 가운데에 거주하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְטַמֵּא
  english_pob_choice: defile
  chosen_korean: 더럽혀서는 안 됩니다
  alternatives_korean:
  - 부정하게 해서는 안 됩니다
  - 오염시켜서는 안 됩니다
  lexicon: HALOT
  rationale: טמא의 제의적·도덕적 오염 의미를 함께 살리기 위해 단순한 ‘오염’보다 ‘더럽히다’를 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 토지
  - 나라
  lexicon: HALOT
  rationale: 문맥상 이스라엘이 거주하는 언약적·지리적 대상이므로, 한국어에서는 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수형을 직접 반영하면서도 한국어 성서 관용에 맞는 표현으로 ‘이스라엘 자손’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Project default glossary
  rationale: 주어진 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 표기하여 본문에서 고유명사성을 보존했습니다.
theological_decisions:
- issue: 거룩한 임재와 땅의 부정함
  chosen_reading: 땅을 더럽히는 행위가 야훼의 임재가 있는 땅에 대한 언약적 위반으로 제시되도록 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 땅을 부정하게 만들지 말아야 합니다
  - 땅을 모독해서는 안 됩니다
  rationale: 본문은 단순한 위생 문제가 아니라 하나님이 거주하시는 땅의 거룩함을 보존하라는 요구이므로, 제의적·언약적 무게를 흐리지 않도록 했습니다.
  doctrine_reference: Numbers 35:34; holiness of the land in covenant presence
