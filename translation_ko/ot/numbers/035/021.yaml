id: NUM.35.21
reference: Numbers 35:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
  footnotes:
  - marker: a
    text: Or 'with hatred' or 'out of hostility' for 'in enmity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the blood-avenger'; more explicitly, 'the kinsman-avenger of blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 그가 원한으로[a] 자기 손으로 그를 쳐서 그가 죽으면, 그 친 자는 반드시 죽임을 당해야 합니다. 그는 살인자입니다. 피의 보복자[b]는 그 살인자를 만날 때에 그를 죽일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적대하여’, ‘미움으로’라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘피의 복수자’라고 할 수 있습니다. 더 풀어 말하면, ‘피의 친족 보복자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְאֵיבָה
  english_pob_choice: in enmity
  chosen_korean: 원한으로
  alternatives_korean:
  - 적대 속에서
  - 미움 가운데
  - 원한 가운데
  lexicon: HALOT
  rationale: אֵיבָה는 적대와 원한을 가리키므로, 법문맥의 hostile intent를 살리면서도 자연스러운 한국어로 ‘원한으로’라고 옮겼습니다.
- source_word: הִכָּהוּ בְיָדוֹ
  english_pob_choice: struck him with his hand
  chosen_korean: 자기 손으로 쳐서
  alternatives_korean:
  - 손으로 쳐서
  - 자기 손으로 때려
  - 손으로 때려
  lexicon: HALOT
  rationale: ‘손’이 폭행의 수단이라는 점을 유지하되, 현대 한국어에서 자연스러운 법문체로 ‘자기 손으로 쳐서’라고 옮겼습니다.
- source_word: רֹצֵחַ הוּא
  english_pob_choice: he is a murderer
  chosen_korean: 그는 살인자입니다
  alternatives_korean:
  - 그는 살인범입니다
  - 그는 사람을 죽인 자입니다
  lexicon: HALOT
  rationale: 의도적 살인을 가리키는 법적 판정이므로, 단순한 ‘사람 죽인 자’보다 책임을 분명히 드러내는 ‘살인자’가 적절합니다.
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 그 친 사람
  alternatives_korean:
  - 피의 보복자
  - 피의 원수 갚는 자
  - 피를 갚는 자
  lexicon: HALOT
  rationale: 문맥상 혈족이 맡는 법적 보복 수행자를 가리키므로, ‘그 친 사람’으로 옮겨 가족-보복 기능을 드러냈습니다. 이는 전통 교회어보다 원문의 법제도성을 더 직접적으로 반영합니다.
- source_word: יָמִית
  english_pob_choice: shall put the murderer to death
  chosen_korean: 그를 죽일 것입니다
  alternatives_korean:
  - 그를 죽일 것입니다
  - 그 살인자를 사형에 처할 것입니다
  lexicon: HALOT
  rationale: 법적 선언의 동사로서 ‘죽일 것입니다’가 간결하며, 뒤의 ‘반드시 죽임을 당해야 합니다’와 함께 사형 선고의 강도를 유지합니다.
theological_decisions:
- issue: ‘גֹּאֵל הַדָּם’의 법적·가족적 성격
  chosen_reading: ‘그 친 사람’으로 본문에서 혈족의 책임을 암시하되, 본문에 없는 추가 설명은 넣지 않았습니다.
  alternative_readings:
  - 피의 보복자
  - 피의 친족 보복자
  - 가까운 친족이 피를 갚는 자
  rationale: 이 표현은 단순한 복수심이 아니라 이스라엘 법 안에서 혈족이 수행하는 책임을 뜻하므로, 현대 한국어에서 직관적이면서도 과도한 해설을 피하는 방향을 택했습니다.
  doctrine_reference: 민수기 35장 전체의 도피성/피의 복수 규정
