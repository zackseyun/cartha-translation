id: NUM.35.20
reference: Numbers 35:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
  footnotes:
  - marker: a
    text: Or 'threw something at him with malice' or 'while lying in wait'; the Hebrew term carries a nuance of deliberate hostile intent, possibly including ambush.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그를 미워하여 밀쳐 죽게 하였거나, 일부러 무엇인가를 던져 그를 죽게 하였으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일부러’는 히브리어 בִּצְדִיָּה의 핵심인 고의성을 반영한 것이며, 이 표현에는 ‘매복하여’, ‘숨어서 기다리며’라는 뉘앙스도 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 또 만일
  lexicon: HALOT
  rationale: 앞 문맥의 경우와 대비되는 법률적 조건을 드러내기 위해 역접을 살린 ‘그러나’와 조건문 ‘만일’을 함께 썼습니다.
- source_word: בְּשִׂנְאָה
  english_pob_choice: in hatred
  chosen_korean: 그를 미워하여
  alternatives_korean:
  - 미움 가운데
  - 증오 가운데
  - 미워하는 마음으로
  lexicon: HALOT
  rationale: 히브리어 전치사구는 원인을 나타내는 목적·동기 표현이므로, 한국어에서는 자연스러운 원인절로 풀어 ‘미워하여’로 옮겼습니다.
- source_word: יֶהְדָּפֶנּוּ
  english_pob_choice: he pushed him
  chosen_korean: 밀쳐
  alternatives_korean:
  - 밀어
  - 떠밀어
  - 밀어 넘어뜨려
  lexicon: HALOT
  rationale: 동사의 핵심 의미는 ‘밀다/떠밀다’이므로, 살해 문맥에서 과도하게 해석하지 않으면서도 물리적 가해를 드러내는 ‘밀쳐’를 선택했습니다.
- source_word: בִּצְדִיָּה
  english_pob_choice: intentionally
  chosen_korean: 일부러
  alternatives_korean:
  - 고의로
  - 의도적으로
  - 매복하여
  lexicon: HALOT
  rationale: 법적 맥락에서의 고의성을 분명히 하되, EN POB 주석이 보존한 ‘매복/은밀한 적대 의도’의 뉘앙스는 본문이 아니라 주석에서 다루도록 했습니다.
theological_decisions:
- issue: 동기와 고의성의 법적 강조
  chosen_reading: ‘그를 미워하여’와 ‘일부러’로 번역해, 단순 사고가 아니라 적대적 의도와 고의적 행위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘미움으로’
  - ‘악의를 품고’
  - ‘계획적으로’
  rationale: 본문은 살인 규정에서 행위의 외형보다 내적 동기와 고의성을 구분하므로, 이를 약화하지 않고 전달하는 것이 중요합니다.
  doctrine_reference: 민수기 35:16-21의 고의 살인 규정
