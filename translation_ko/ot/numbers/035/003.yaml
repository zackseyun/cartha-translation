  rationale: מִגְרָשׁ는 성읍 둘레의 빈터/열린 땅을 가리키며 여기서는 방목에 적합한 용도를 드러내므로, 현대 독자가 기능을 바로 이해할 수 있게 ‘목초지’로 옮겼습니다.
