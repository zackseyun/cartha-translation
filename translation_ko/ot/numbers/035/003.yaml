base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
  footnotes:
  - marker: a
    text: Or 'their common-land' or 'their open land' for 'their pasturelands.' The Hebrew term refers to the open area around the cities, here especially suited for grazing use.
    reason: lexical_alternative
  - marker: b
    text: Or 'for their possessions' for 'for their property.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍들은 그들이 거주할 곳이 되며[a], 그들의 목초지는 그들의 가축과 그들의 재산[b]과 그들의 모든 동물을 위한 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 공동지’나 ‘그들의 열린 땅’으로도 옮길 수 있습니다. 히브리어 용어는 성읍 주변의 열린 구역을 가리키며, 여기서는 특히 방목에 적합한 용도입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 소유물’로도 옮길 수 있습니다.
    reason: lexical_alternative
