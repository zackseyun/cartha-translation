base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
  footnotes:
  - marker: a
    text: Or 'their common-land' or 'their open land' for 'their pasturelands.' The Hebrew term refers to the open area around the cities, here especially suited for grazing use.
    reason: lexical_alternative
  - marker: b
    text: Or 'for their possessions' for 'for their property.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍들은 그들이 거주할 곳이 되며, 그들의 목초지[a]는 그들의 가축과 그들의 재산[b]과 그들의 모든 동물을 위한 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 공동지’나 ‘그들의 열린 땅’으로도 옮길 수 있습니다. 히브리어 용어는 성읍 주변의 열린 구역을 가리키며, 여기서는 특히 방목에 적합한 용도입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 소유물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 그 성읍들은
  alternatives_korean:
  - 그 도시들은
  - 그 읍들은
  lexicon: HALOT
  rationale: 법적 분배 문맥에서 עִיר는 단순한 ‘마을’보다 성읍/도시가 자연스럽고, 연속되는 조항의 행정적 어조를 살리기 위해 ‘성읍들’로 옮겼습니다.
- source_word: לָשָׁבֶת
  english_pob_choice: to live in
  chosen_korean: 거주할 곳이 되며
  alternatives_korean:
  - 살 곳이 되며
  - 거주하기 위해
  lexicon: HALOT
  rationale: ‘살다/거주하다’의 목적 의미를 살리되 한국어 법문체에 자연스럽게 맞추어 ‘거주할 곳이 되며’로 풀었습니다.
- source_word: מִגְרְשֵׁיהֶם
  english_pob_choice: their pasturelands
  chosen_korean: 그들의 목초지
  alternatives_korean:
  - 그들의 공동지
  - 그들의 열린 땅
  - 그들의 방목지
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍 둘레의 빈터/열린 땅을 가리키며 여기서는 방목에 적합한 용도를 드러내므로, 현대 독자가 기능을 바로 이해할 수 있게 ‘목초지’로 옮겼습니다.
- source_word: לִרְכֻשָׁם
  english_pob_choice: for their property
  chosen_korean: 그들의 재산
  alternatives_korean:
  - 그들의 소유물
  - 그들의 소유
  lexicon: HALOT
  rationale: רְכוּשׁ는 재산·소유물을 뜻하므로, 가축과 대비되는 비생물적 소유를 자연스럽게 드러내는 ‘재산’을 택했습니다.
