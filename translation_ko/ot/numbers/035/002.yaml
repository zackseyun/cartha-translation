language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / traditional 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Pasturelands'' translates a term for the open land surrounding a city, used especially for grazing and related communal use.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손[a]에게 명령하여, 그들이 자기 소유의 기업에서 레위인들에게 거주할 도시들을 주게 하십시오. 또 너희는 레위인들에게 그 도시들 둘레의 목초지[b]를 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. 여기서는 공동체를 가리키는 표현으로 ‘이스라엘 자손’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목초지’는 도시 주변의 열린 땅을 가리키며, 특히 방목과 공동 사용에 쓰이는 구역을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘sons of Israel’이지만, 한국어에서는 남성 표지를 굳이 드러내지 않으면서도 혈연·언약 공동체의 뜻을 자연스럽게 살리는 ‘이스라엘 자손’이 가장 투명합니다.
- source_word: וְנָתְנוּ ... תִּתְּנוּ
  english_pob_choice: that they give ... you shall give
  chosen_korean: 그들이 ... 주게 하십시오 / ... 주십시오
  alternatives_korean:
  - 그들이 ... 주도록 하십시오 / ... 주어야 합니다
  - 그들이 ... 주게 하시고 / ... 주십시오
  lexicon: HALOT
  rationale: 앞부분의 3인칭 복수 명령적 용법과 뒤의 2인칭 복수 전환을 한국어에서도 구별되게 살리기 위해, 앞은 ‘주게 하십시오’, 뒤는 직접 명령형 ‘주십시오’로 옮겼습니다.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  english_pob_choice: from the inheritance of their possession
  chosen_korean: 자기 소유의 기업에서
  alternatives_korean:
  - 그들의 상속된 소유에서
  - 그들의 기업의 유산에서
  lexicon: HALOT
  rationale: נַחֲלָה와 אֲחֻזָּה의 이중 표현을 한국어로 둘 다 분리해 두면 어색해지므로, 법적 분배 맥락을 살려 ‘소유의 기업’으로 압축해 두 어휘의 소유·상속 의미를 함께 보존했습니다.
- source_word: מִגְרָשׁ
  english_pob_choice: pasturelands
  chosen_korean: 목초지
  alternatives_korean:
  - 빈터
  - 공용지
  - 방목지
  lexicon: HALOT
  rationale: 성 주변의 빈 열린 땅을 가리키는 문화적 의미를 한국어로 가장 직접적으로 드러내는 말이 ‘목초지’이며, 실제 방목·공동 사용 가능성도 함께 전달합니다.
theological_decisions:
- issue: 레위인에게 주는 도시와 주변 땅의 성격
  chosen_reading: 레위인의 거주 도시와 그 둘레의 목초지는 이스라엘 공동체가 분배해야 할 언약적 몫으로 제시됩니다.
  alternative_readings:
  - 단순한 행정적 토지 배분으로만 읽기
  - 성직자 특권으로 읽기
  rationale: 본문은 레위인의 생계와 거주를 위한 구체적 분배를 명령하지만, 단순 행정문서보다 언약 공동체 내 질서와 거룩한 분리의 의미를 함께 지닙니다.
  doctrine_reference: 민수기 35장 레위인의 성읍 규례
