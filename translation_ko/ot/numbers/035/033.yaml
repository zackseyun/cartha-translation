    rationale: a는 ‘더럽히지 말아야 합니다’에, b는 ‘속죄될 수 없으며’에 붙여야 각주가 가리키는 번역 선택을 독자가 정확히 알 수 있습니다.
  - severity: low
    issue: ‘속죄할 수 없고’는 누가 속죄하는지 문법상 다소 열려 있습니다.
    rationale: 원문 יְכֻפַּר는 땅이 속죄되는 대상임을 나타내는 수동태이므로 ‘그 땅은 … 속죄될 수 없으며’가 더 직접적입니다.
