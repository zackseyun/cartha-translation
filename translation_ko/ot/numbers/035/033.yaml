    issue: 히브리어 הוּא의 강조가 본문에서 드러나지 않습니다.
    rationale: ‘피가 바로 그 땅을 더럽히기 때문입니다’라고 하면 명사 주어 뒤의 강조를 자연스럽게 반영할 수 있습니다.
  - severity: medium
