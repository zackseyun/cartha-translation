  source_fidelity: 전반적으로 히브리어의 논리와 어휘를 충실히 옮겼습니다. 다만 הוּא의 강조는 ‘피가 바로’로 드러내는 편이 좋고, יְכֻפַּר의 수동 표현은 땅이 속죄의 대상임을 더 분명히 나타낼 수 있습니다.
  naturalness: 합쇼체는 적절합니다. ‘그 땅은 … 속죄될 수 없으며’는 원문의 수동 구문과 인과 관계를 자연스럽고 명료하게 전달합니다.
  terminology: חנף는 문맥상 ‘더럽히다’가 적절하며, כפר는 ‘속죄되다/속죄하다’로 유지할 수 있습니다. ‘오염’은 각주상의 유효한 대안입니다.
  issues:
