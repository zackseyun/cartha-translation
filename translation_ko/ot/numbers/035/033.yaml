id: NUM.35.33
reference: Numbers 35:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
  footnotes:
  - marker: a
    text: Or 'pollute the land.' The Hebrew verb carries the sense of making the land morally unclean or contaminated.
    reason: lexical_alternative
  - marker: b
    text: Or 'no expiation can be made for the land concerning the blood shed in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 있는 땅을 더럽히지 말아야 합니다.[a] 피가 바로 그 땅을 더럽히기 때문입니다. 그 땅은 그 안에 흘린 피 때문에 속죄될 수 없으며,[b] 오직 그 피를 흘린 자의 피로만 속죄될 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 오염시키다.’ 히브리어 동사는 땅을 도덕적으로 부정하고 오염된 상태로 만든다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅에 흘린 피에 관하여는 그 땅을 속죄할 수 없다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  english_pob_choice: defile / pollute
  chosen_korean: 더럽히지 말아야 합니다
  alternatives_korean:
  - 오염시키지 말아야 합니다
  - 속되게 하지 말아야 합니다
  lexicon: HALOT
  rationale: 이 동사는 이 절에서 피흘림으로 인한 도덕적·예식적 오염을 뜻하므로, 한국어에서는 자연스럽고 본문 성격을 드러내는 ‘더럽히다’로 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 나라
  lexicon: HALOT
  rationale: 민수기 문맥상 단순한 지구가 아니라 이스라엘이 거주하는 특정한 땅을 가리키므로 ‘그 땅’이 가장 적절합니다.
- source_word: יְכֻפַּר
  english_pob_choice: atonement can be made
  chosen_korean: 속죄할 수 없고
  alternatives_korean:
  - 속죄할 수 없으며
  - 속량할 수 없고
  - 덮을 수 없고
  lexicon: HALOT
  rationale: כפר의 여기서의 의미는 피흘림으로 인한 죄책을 제거하는 것이므로, 현대 한국어에서 이해 가능한 예식·법정적 의미를 살려 ‘속죄하다’로 표현했습니다.
- source_word: בְּדַם שֹׁפְכוֹ
  english_pob_choice: by the blood of the one who shed it
  chosen_korean: 그 피를 흘린 자의 피로만
  alternatives_korean:
  - 그것을 흘린 자의 피로만
  - 그 피를 쏟은 자의 피로만
  lexicon: HALOT
  rationale: 마지막 구는 살인자의 자기 피가 유일한 속죄 수단임을 뜻하므로, 대상이 되는 피와 주체의 피를 분명히 드러내는 방식으로 옮겼습니다.
theological_decisions:
- issue: 피흘림이 땅에 가져오는 오염과 속죄의 관계
  chosen_reading: 이 절은 불법적 피흘림이 땅을 실제로 더럽히며, 그 죄책은 살인자의 죽음으로만 제거된다고 말합니다.
  alternative_readings:
  - 단순히 사회 질서의 붕괴를 비유한 표현으로 볼 수 있습니다
  - 예식적 의미 없이 시민 형벌만 말하는 것으로 볼 수 있습니다
  rationale: 동일 동사와 속죄 어휘가 반복되므로, 본문은 사회적 혼란을 넘어 땅에 대한 도덕적·예식적 오염과 그 제거를 함께 말합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
