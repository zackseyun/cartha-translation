  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' and ''resident'' render two distinct Hebrew terms (גֵּר and תּוֹשָׁב) for non-native persons living within Israelite society.'
    reason: cultural_note
  - marker: c
    text: Or 'any manslayer' for 'anyone who kills a person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 여섯 성읍은 이스라엘 자손과 그들 가운데 있는 거류민과 주민을 위한 피난처가 되도록 하여, 누구든지 사람을 우연히 죽인 자가 거기로 도피할 수 있어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’과 ‘주민’은 각각 גֵּר와 תּוֹשָׁב을 옮긴 것으로, 이스라엘 공동체 안에 거주하지만 동일한 법적 지위를 지니지 않는 두 범주를 구분합니다.
    reason: cultural_note
  - marker: b
    text: ‘우연히’는 고의가 없는 우발적 살인을 가리키는 בִּשְׁגָגָה를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사람을 우연히 죽인 자’는 문자적으로 ‘생명을 친 자’에 해당하며, 문맥상 살인자를 가리키는 법률 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 관용적 민족·언약 공동체 명칭을 자연스러운 현대 한국어로 옮기되, ‘자손’으로 원문의 형식을 비교적 가깝게 보존했습니다.
- source_word: וְלַגֵּר וְלַתּוֹשָׁב
  english_pob_choice: and for the sojourner and for the resident
  chosen_korean: 거류민과 주민
  alternatives_korean:
  - 나그네와 거주민
  - 거류자와 상주민
  lexicon: HALOT
  rationale: גֵּר와 תּוֹשָׁב의 두 서로 다른 비이스라엘 거주 범주를 구분해야 하므로, ‘거류민’과 ‘주민’을 병기해 POB의 구분을 반영했습니다.
- source_word: לְמִקְלָט
  english_pob_choice: for refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 도피처
  - 피할 곳
  lexicon: HALOT
  rationale: 문맥상 ‘도피를 위한 장소’이므로, 성읍의 제도적 기능을 드러내는 ‘피난처’가 가장 자연스럽고 정확합니다.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  english_pob_choice: anyone who kills a person
  chosen_korean: 누구든지 사람을 우연히 죽인 자
  alternatives_korean:
  - 사람을 죽인 자
  - 사람의 목숨을 친 자
  lexicon: HALOT
  rationale: 직역하면 ‘생명을 친 자’이지만, 뒤의 בִּשְׁגָגָה가 과실·우발성을 규정하므로 한국어에서는 결과와 법적 맥락이 드러나도록 풀어 옮겼습니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 우연히
  alternatives_korean:
  - 실수로
  - 부지중에
  - 의도하지 않게
  lexicon: HALOT
  rationale: 법적 대비점은 고의가 아닌 우발성입니다. ‘우연히’는 다소 구어적이지만, 본절의 규정 취지를 간명하게 전달합니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 번역에서 성별 표지 보존 여부
  chosen_reading: ‘이스라엘 자손’으로 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 문맥상 민족적·언약적 표지인 남성 복수형을 평탄화하지 않고, 원문의 형식을 드러내는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
