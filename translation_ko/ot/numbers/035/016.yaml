source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
  footnotes:
  - marker: a
    text: Or 'with an iron implement' or 'with an iron object.' The Hebrew term is broad and does not itself specify a weapon by name.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 철제 기구[a]로 어떤 사람을 쳐서 그 사람이 죽으면, 그는 살인자입니다. 그 살인자는 반드시 죽임을 당해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘철제 도구’ 또는 ‘철제 물건’. 히브리어는 폭넓은 말이며, 그 자체로 특정 무기의 이름을 가리키지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞선 법 조항과 대비되는 조건문이므로 단순한 ‘만일’보다 역전·전환의 뉘앙스를 살린 ‘그러나 만일’이 적절합니다.
- source_word: בִּכְלִי בַרְזֶל
  english_pob_choice: with an iron tool
  chosen_korean: 철제 도구로
  alternatives_korean:
  - 철제 기구로
  - 철제 도구로
  - 철제 물건으로
  lexicon: HALOT
  rationale: כְּלִי는 특정 무기명이 아니라 넓은 범주의 ‘도구/기구/물건’을 가리키므로, 살상 도구로 과도하게 좁히지 않는 ‘철제 도구’가 원문 범위를 잘 반영합니다.
- source_word: הִכָּהוּ
  english_pob_choice: he struck him
  chosen_korean: 그를 쳐서
  alternatives_korean:
  - 그를 때려서
  - 그를 쳤고
  - 그를 내리쳐서
  lexicon: HALOT
  rationale: 법률 문맥의 נכה는 폭력적 타격을 뜻하므로, 현대 한국어에서 자연스럽고 행위성을 유지하는 ‘그를 쳐서’로 옮겼습니다.
- source_word: רֹצֵחַ הוּא
  english_pob_choice: he is a murderer
  chosen_korean: 그는 살인자입니다
  alternatives_korean:
  - 그는 살인범입니다
  - 그는 살인자입니다
  - 그는 사람을 죽인 자입니다
  lexicon: HALOT
  rationale: 이 조항은 단순한 사망 결과가 아니라 법적·도덕적 책임을 진 자로 규정하므로, 한국어에서도 ‘살인자’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: מוֹת יוּמַת의 형벌 강도
  chosen_reading: 반드시 죽임을 당해야 합니다
  alternative_readings:
  - 반드시 사형을 받아야 합니다
  - 반드시 죽임을 당합니다
  rationale: 히브리어의 부정할 수 없는 법적 강세를 살리면서도, 원문이 명시한 형벌을 완곡하게 약화하지 않도록 ‘반드시 죽임을 당해야 합니다’로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
