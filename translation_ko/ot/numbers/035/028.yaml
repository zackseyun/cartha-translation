  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
  footnotes:
  - marker: a
    text: Or 'the killer.' The Hebrew term here is a legal category in the cities-of-refuge laws and should not automatically be read as 'murderer.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to his own landholding' or 'to the land of his property.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 대제사장이 죽을 때까지 자기 도피성에 머물러야 하며, 대제사장이 죽은 뒤에는 그 사람을 죽인 자[a]가 자기 소유의 땅으로[b] 돌아갈 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 살해자’입니다. 여기서의 히브리어 용어는 도피성 법규 안의 법적 범주이므로, 자동으로 ‘살인자’라는 도덕적 판결로 읽어서는 안 됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 소유지로’ 또는 ‘자기 토지로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְעִיר מִקְלָטוֹ
  english_pob_choice: in his city of refuge
  chosen_korean: 자기 도피성에서
  alternatives_korean:
  - 자기 피난성에서
  - 자기 도피의 성읍에서
  lexicon: HALOT
  rationale: מִקְלָט은 이 법맥에서 ‘도피성’으로 옮기는 것이 가장 자연스럽고, 여격적 소유격을 살려 ‘자기’로 처리했습니다.
- source_word: יֵשֵׁב
  english_pob_choice: he must remain
  chosen_korean: 머물러야 하며
  alternatives_korean:
  - 거주해야 하며
  - 살아야 하며
  - 머물러야 합니다
  lexicon: HALOT
  rationale: 법적 구속을 가진 거주를 뜻하므로, 현대 한국어에서 자연스럽고 제한 상태를 드러내는 ‘머물러야 하며’가 적절합니다.
- source_word: הָרֹצֵחַ
  english_pob_choice: the manslayer
  chosen_korean: 그 살인자가
  alternatives_korean:
  - 그 사람을 죽인 자가
  - 그 살해자가
  - 그 살인자
  lexicon: HALOT
  rationale: 이 절의 법적 범주는 단순한 ‘murderer’보다 넓은 ‘살해한 자’에 가깝지만, 한국어에서는 ‘살인자’가 해당 법적 행위자를 가장 직접적으로 드러냅니다.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  english_pob_choice: to the land of his possession
  chosen_korean: 자기 소유의 땅으로
  alternatives_korean:
  - 자기 소유지로
  - 자기 소유의 땅으로
  - 자기 기업의 땅으로
  lexicon: HALOT
  rationale: אֲחֻזָּה의 토지·소유 의미를 살리되, ‘기업’처럼 신학적으로 굳은 표현은 피하고 법적 소유를 분명히 하는 ‘소유의 땅’으로 옮겼습니다.
theological_decisions:
- issue: הָרֹצֵחַ의 법적 범주를 한국어에서 ‘살인자’로 둘지, 더 중립적으로 둘지
  chosen_reading: ‘살인자’로 옮기되, 이 절의 문맥은 도피성 법규이며 자동으로 도덕적 판결을 확정하는 표현은 아니라는 점을 유지했습니다.
  alternative_readings:
  - 그 사람을 죽인 자
  - 살해자
  - 살인자
  rationale: 도피성 규정의 핵심은 고의 살인과 과실 치사의 법적 구분이므로, 본문이 부여하는 범주를 과장하지 않으면서도 한국어 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
