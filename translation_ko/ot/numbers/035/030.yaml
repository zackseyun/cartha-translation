- from: 누구든지 사람을 치면, 목수의 증언에 따라 살인자를 죽여야 하되, 한 사람만으로는 사람을 죽이게 할 증언을 하지 못한다.
  to: 누구든지 사람을 죽인 경우에는 여러 증인의 증언에 따라 그 살인자를 사형에 처해야 합니다. 그러나 한 증인은 어떤 사람을 죽음에 이르게 할 증언을 해서는 안 됩니다.
