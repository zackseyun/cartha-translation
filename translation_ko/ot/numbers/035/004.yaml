  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
  footnotes:
  - marker: a
    text: Or 'common lands' or 'open land' for the land surrounding the cities.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the wall of the city'; some understand this more generally as 'from the city boundary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 레위인들에게 줄 도시들의 목초지는 도시의 성벽에서 바깥쪽으로 사방 천 규빗입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공동지’, ‘빈터’, 곧 성읍을 둘러싼 열린 땅.
    reason: lexical_alternative
  - marker: b
    text: ‘도시의 성벽에서’는 ‘도시 경계에서’로 더 넓게 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  english_pob_choice: pasture lands
  chosen_korean: 목초지
  alternatives_korean:
  - 공동지
  - 빈터
  - 열린 땅
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍을 둘러싼 열린 구역으로, 레위인 성읍 주변의 용도를 반영해 ‘목초지’로 옮기면 기능과 자연스러움을 함께 살릴 수 있습니다.
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 도시들의
  alternatives_korean:
  - 성읍들의
  - 마을들의
  lexicon: HALOT
  rationale: 문맥이 레위인에게 주는 성읍 규정이므로, 일관성과 현대 독자를 고려해 ‘도시들’로 옮겼습니다.
- source_word: מִקִּיר הָעִיר וָחוּצָה
  english_pob_choice: from the wall of the city outward
  chosen_korean: 도시의 성벽에서 바깥쪽으로
  alternatives_korean:
  - 도시 성벽에서 바깥으로
  - 도시 경계에서 바깥쪽으로
  lexicon: HALOT
  rationale: קִיר의 기본 의미는 ‘벽’이므로 ‘성벽’을 살리되, 일부는 경계로 이해할 수 있어 주석 없이 본문에서는 가장 직접적인 표현을 택했습니다.
- source_word: אֶלֶף אַמָּה סָבִיב
  english_pob_choice: a thousand cubits all around
  chosen_korean: 사방 천 규빗
  alternatives_korean:
  - 둘레로 천 규빗
  - 주위로 천 규빗
  lexicon: HALOT
  rationale: סָבִיב의 둘러싼 범위를 한국어로 간결하게 드러내기 위해 ‘사방’으로 옮겼고, 고대 단위는 ‘규빗’을 유지했습니다.
theological_decisions:
- issue: 레위인 성읍 주변의 토지 범위 규정
  chosen_reading: 본문은 레위인에게 주는 도시 주변의 분리된 구역을 측량 규정으로 제시합니다.
  alternative_readings:
  - 단순한 거주지 주변의 일반 토지로 읽는 해석
  - 공동 목초지의 제도적 구획으로 읽는 해석
  rationale: 히브리어 מִגְרָשׁ과 거리 측정 표현을 함께 반영해, 제의적·공동체적 구획이라는 본문의 기능을 흐리지 않도록 했습니다.
  doctrine_reference: 민수기 35장의 레위인 도성 규정
