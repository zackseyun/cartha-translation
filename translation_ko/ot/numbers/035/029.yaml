  text: 이것들은 너희에게 대대로, 너희가 사는 모든 곳에서 준수해야 할 재판의 규례가 되어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט는 여기서 ‘재판’, ‘사법 절차’, 또는 넓게는 ‘법적 규정’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מוֹשְׁבֹתֵיכֶם은 ‘너희의 거주지들’ 또는 ‘너희가 사는 곳들’로도 옮길 수 있습니다.
    reason: lexical_alternative
