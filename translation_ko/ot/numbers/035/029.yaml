  text: 이것들은 너희에게 너희 모든 거주지에서 대대로 재판의 규례가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט는 여기서 ‘재판’, ‘사법 절차’, 또는 넓게는 ‘법적 규정’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מוֹשְׁבֹתֵיכֶם은 ‘너희의 거주지들’, ‘너희의 정착지들’, 또는 ‘너희가 사는 곳들’로도 옮길 수 있습니다.
