  naturalness: ‘피를 대신 갚는 자’는 한국어에서 보상이나 대리의 뉘앙스를 낼 수 있어 법률 용어로 다소 부자연스럽습니다. ‘피의 보복자’는 간결하며 성경의 살인 규례 문맥에서 자연스럽게 기능합니다. 반복되는 대명사는 원문의 강조를 보존하기 위해 유지하되 ‘그 자신이’로 처리했습니다.
  terminology: ‘피의 보복자’는 혈연 관계에 기반한 고대 이스라엘의 법적 역할을 가리키며, ‘구속자’의 신학적 연상이나 ‘대신 갚다’의 보상 의미를 피합니다. הָרֹצֵחַ는 이 절의 문맥상 ‘살인자’로 유지할 수 있습니다.
