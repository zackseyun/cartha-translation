base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
  footnotes:
  - marker: a
    text: Or 'the blood avenger.' The Hebrew phrase is a fixed legal term for the family member responsible to avenge unlawful bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 피의 보복자가 그 살인자를 죽일 것입니다. 그가 그를 만나면, 그 자신이 그를 죽일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피의 보복자’는 히브리어의 고정 법률 용어입니다. 불법적인 피 흘림에 대하여 책임을 묻는 고인의 친족을 가리킵니다. 또는 ‘피를 갚는 친족’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 피를 대신 갚는 자
  alternatives_korean:
  - 피의 원수 갚는 자
  - 피의 보복자
  - 피의 친족 구속자
  lexicon: HALOT
  rationale: 원문의 고정 법률 용어를 한국어로 옮기되, ‘구속’ 의미를 불필요하게 불러오는 ‘속량자/구속자’ 계열은 피하고, 혈연 집행 기능이 드러나는 표현을 택했습니다.
- source_word: הוּא
  english_pob_choice: himself
  chosen_korean: 그가
  alternatives_korean:
  - 자신이
  - 그 자신이
  - 그도
  lexicon: HALOT
  rationale: 히브리어 독립 인칭대명사의 강조를 살리기 위해 주어를 반복했고, 한국어에서는 첫 절의 ‘피를 대신 갚는 자’와 두 번째 절의 ‘그가’를 대응시켜 법적 강조를 유지했습니다.
- source_word: יָמִית / יְמִיתֶנּוּ
  english_pob_choice: shall put ... to death
  chosen_korean: 반드시 죽여야 합니다
  alternatives_korean:
  - 죽여야 합니다
  - 사형에 처해야 합니다
  - 죽입니다
  lexicon: HALOT
  rationale: 법률 문맥의 사역형·명령적 확정을 한국어의 의무 표현으로 옮겼습니다. ‘사형에 처하다’보다 직역성이 높고, ‘죽이다’보다 판결 집행의 성격이 분명합니다.
- source_word: בְּפִגְעוֹ בוֹ
  english_pob_choice: when he meets him
  chosen_korean: 그가 그를 만나면
  alternatives_korean:
  - 그를 마주치면
  - 그를 우연히 만나면
  - 그를 만나게 되면
  lexicon: HALOT
  rationale: 접촉·조우의 시간적 의미를 자연스럽게 옮겼습니다. ‘우연히’는 원문에 없는 뉘앙스를 더하므로 제외했습니다.
theological_decisions:
- issue: גֹּאֵל הַדָּם의 제도적 성격
  chosen_reading: 혈연 기반의 법적 집행자를 가리키는 말로 이해하고, ‘구속자’ 계열의 신학적 연상을 피했습니다.
  alternative_readings:
  - 피를 속량하는 자
  - 피의 구속자
  rationale: 이 절은 속죄나 구속 교리가 아니라 살인 사건에 대한 이스라엘의 살인 규례를 말하므로, 문맥이 요구하는 법률적 기능을 우선해야 합니다.
  doctrine_reference: 민수기 35장 살인 규례
