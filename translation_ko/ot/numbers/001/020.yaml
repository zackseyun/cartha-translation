language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
  footnotes:
  - marker: a
    text: Hebrew literally, 'by their skulls/heads,' an idiom meaning each individual was counted separately.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤의 아들들[a]—이스라엘의 맏아들—을 그들의 세대별로, 그들의 종족별로, 그들의 조상들의 집안별로, 이름의 수대로, 머리수대로 세었습니다. 곧 스무 살부터 그 이상인 모든 남자, 전쟁에 나갈 수 있는 모든 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 머리들/두개골들에 따라’라는 관용구로, 각 개인을 따로 세었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי רְאוּבֵן
  english_pob_choice: The sons of Reuben
  chosen_korean: 르우벤의 아들들
  alternatives_korean:
  - 르우벤의 자손들
  lexicon: HALOT
  rationale: 족장/지파 문맥에서 בנים은 직역하면 ‘아들들’이지만, 한국어에서는 소속 집단을 자연스럽게 나타내는 ‘르우벤의 아들들’이 원문 구조를 가장 투명하게 드러냅니다.
- source_word: בְּכֹר יִשְׂרָאֵל
  english_pob_choice: the firstborn of Israel
  chosen_korean: 이스라엘의 맏아들
  alternatives_korean:
  - 이스라엘의 첫째 아들
  lexicon: HALOT
  rationale: בכור는 단순한 순서뿐 아니라 지위도 포함하므로, 교회 전통어보다 직접적인 ‘맏아들’로 옮겨 르우벤에 대한 수식적 apposition을 살렸습니다.
- source_word: תּוֹלְדֹתָם לְמִשְׁפְּחֹתָם לְבֵית אֲבֹתָם
  english_pob_choice: by their generations, by their clans, by their fathers’ houses
  chosen_korean: 그들의 세대별로, 그들의 종족별로, 그들의 조상들의 집안별로
  alternatives_korean:
  - 그들의 نسل별로, 그들의 가족별로, 그들의 아버지의 집안별로
  - 그들의 계보별로, 그들의 씨족별로, 그들의 조상 집안별로
  lexicon: HALOT
  rationale: 인구조사 공식의 계층 구조를 살리기 위해 תולדות/משפחות/בית אבות을 순서대로 대응시켰고, ‘종족/조상들의 집안’으로 번역해 혈통·가문 단위를 구분했습니다.
- source_word: לְגֻלְגְּלֹתָם
  english_pob_choice: head by head
  chosen_korean: 머리수대로
  alternatives_korean:
  - 한 사람씩
  - 머리마다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 두개골들/머리들로’라는 관용구이므로, 한국어 관용으로는 의미를 분명히 하면서도 계수의 개별성을 보존하는 ‘머리수대로’가 적절합니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: everyone going out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 사람
  alternatives_korean:
  - 전쟁에 나가는 모든 사람
  - 군대에 나가는 모든 사람
  lexicon: HALOT
  rationale: 문자적으로는 ‘군대/전쟁으로 나가는 모든 이’지만, 이 구절이 징집 가능 연령의 남자를 가리키는 census formula이므로 한국어에서는 기능적 의미를 분명히 했습니다.
theological_decisions:
- issue: 인구조사 공식의 군사적 함의
  chosen_reading: ‘전쟁에 나갈 수 있는 모든 사람’으로 옮겨, 단순 연령 표기가 아니라 군역 가능자를 셈하는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘전쟁에 나가는 모든 사람’
  - ‘군복무 가능한 모든 사람’
  rationale: 히브리어 צבא는 여기서 군사 동원 맥락을 가지므로, 독자가 이 조사가 전투 가능 인원의 산정임을 이해하도록 했습니다.
  doctrine_reference: 민수기 1장의 인구조사/군역 문맥
