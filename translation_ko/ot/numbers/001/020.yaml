revisions:
- from: 르우벤의 아들들[a]—이스라엘의 맏아들—을 그들의 세대별로, 그들의 종족별로, 그들의 조상들의 집안별로, 이름의 수대로, 머리수대로 세었습니다. 곧 스무 살부터 그 이상인 모든 남자, 전쟁에 나갈 수 있는 모든 사람입니다.
  to: 르우벤, 곧 이스라엘의 맏아들의 자손은 그들의 계보에 따라, 그들의 씨족에 따라, 그들의 조상 집안에 따라, 이름의 수대로 한 사람씩[a] 등록되었습니다. 곧 스무 살 이상으로 군대에 나가는 모든 남자입니다.
  rationale: 문맥상 함축된 인구조사 행위는 ‘등록되었습니다’로 최소한으로 보완하되, 군사 참여의 능력·적격성을 명시적으로 덧붙이지 않았습니다. 친족 단위 용어를 자연스러운 현대 한국어로 다듬고, ‘머리/두개골’ 관용구의 각주 표지를 올바른 본문 표현으로 옮겼습니다.
