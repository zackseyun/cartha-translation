  rationale: 문맥상 인구 조사에서 ‘계수된’ 사람들을 가리키므로, 의미를 직접 반영하되 한국어에서 자연스러운 명사구로 옮겼습니다.
- source_word: לְמַטֵּה גָד
  english_pob_choice: from the tribe of Gad
  chosen_korean: 갓 지파에서
  alternatives_korean:
