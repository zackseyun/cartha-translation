  - 갓의 지파에서
  - 갓 지파 소속의
  lexicon: מַטֶּה
  rationale: 히브리어 ‘지파’를 그대로 살려 소속을 명시했고, ‘from’은 한국어 조사로 간결하게 처리했습니다.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
