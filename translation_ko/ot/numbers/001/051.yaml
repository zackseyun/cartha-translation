id: NUM.1.51
reference: Numbers 1:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
  footnotes:
  - marker: a
    text: Or 'the stranger' or 'the unauthorized person'; the Hebrew refers to one not authorized to approach the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 회막이 옮겨질 때에는 레위 사람들이 그것을 해체하고, 회막이 진을 칠 때에는 레위 사람들이 그것을 세워야 합니다. 그리고 가까이 오는 외인은 죽임을 당해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외인’은 여기서 민족적 외국인이 아니라 성소에 접근하도록 허가받지 않은 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  english_pob_choice: When the tabernacle is to set out
  chosen_korean: 회막이 옮겨질 때에는
  alternatives_korean:
  - 회막이 출발할 때에는
  - 회막이 떠날 때에는
  lexicon: HALOT
  rationale: ב+부정사구는 시점을 나타내므로, 이동 시작의 의미를 살려 자연스럽게 ‘옮겨질 때’로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 회막
  alternatives_korean:
  - 장막
  - 성막
  lexicon: HALOT
  rationale: 성막 용어로는 ‘회막’이 한국어 성경에서 널리 쓰이며, 이동 가능한 성소라는 문맥에도 잘 맞습니다.
- source_word: הַזָּר הַקָּרֵב
  english_pob_choice: the outsider who comes near
  chosen_korean: 가까이 오는 외인
  alternatives_korean:
  - 가까이 오는 이방인
  - 가까이 오는 자
  - 가까이 오는 비레위인
  lexicon: HALOT
  rationale: זָר는 단순한 민족적 ‘낯선 사람’보다 성소 봉사에 대한 무자격자를 가리키므로, ‘외인’으로 옮겨 자격 밖의 사람임을 드러냈습니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 죽임을 당해야 합니다
  alternatives_korean:
  - 죽어야 합니다
  - 사형을 당해야 합니다
  lexicon: HALOT
  rationale: Hophal 형식의 강제·수동적 형벌을 살려, 단순한 결과 진술보다 ‘죽임을 당하다’로 옮겼습니다.
theological_decisions:
- issue: זָר의 범위
  chosen_reading: 성소 봉사에 허가받지 않은 자를 가리키는 제의적 ‘외인’으로 이해했습니다.
  alternative_readings:
  - 민족적으로 이방인을 가리킴
  - 단순히 레위인이 아닌 모든 사람
  rationale: 문맥이 성막 취급 규정이므로, 혈통보다 접근 권한의 문제를 드러내는 해석이 본문 기능을 가장 잘 보존합니다.
  doctrine_reference: 민수기 1:51 제의적 경계 규정
