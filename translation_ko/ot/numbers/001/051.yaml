review_pass:
  verdict: revise
  source_fidelity: 첫 시간절의 ‘회막이 옮겨질 때’는 이동 중이라는 뜻으로도 읽혀, 해체 행위가 이루어지는 시점과 다소 어긋날 수 있습니다. 히브리어의 이동·진침 상황을 한국어에서 자연스럽게 드러내도록 조정하는 것이 안전합니다. 또한 וְהַזָּר הַקָּרֵב은 민족적 외국인이 아니라 성소에 접근할 권한이 없는 사람을 뜻하므로, 본문과 주석에서 그 점을 더 분명히 하는 것이 좋습니다. יוּמָת의 강제 수동형은 ‘죽임을 당해야 합니다’로 유지할 수 있습니다.
  naturalness: ‘회막이 진을 칠 때’는 회막 자체가 진을 친다는 표현이라 한국어로 다소 어색합니다. ‘진을 칠 때’와 ‘회막을 옮길 때’가 현대 표준어 문맥에서 더 자연스럽습니다. ‘가까이 오는 외인’도 어순이 다소 부자연스러워 ‘가까이 오는 외부인’으로 고쳤습니다.
  terminology: ‘회막’과 ‘레위 사람들’은 일관되고 적절합니다. 다만 현대 한국어의 ‘외인’은 고어적이거나 민족적 외부인을 연상시킬 수 있어, 본문의 제의적 의미를 보존하는 ‘외부인’과 제한적 주석이 더 적절합니다.
  issues:
  - severity: medium
    issue: ‘회막이 옮겨질 때’는 수동적 이동 과정으로 읽힐 수 있습니다.
    rationale: 본문은 성막을 출발시키기 위해 레위인들이 해체하는 상황을 말합니다. ‘회막을 옮길 때’가 한국어에서 행위 순서와 시간 관계를 더 자연스럽게 전달합니다.
  - severity: low
    issue: ‘회막이 진을 칠 때’는 한국어 표현으로 어색합니다.
    rationale: 진을 치는 주체는 통상 사람이나 집단으로 표현됩니다. ‘진을 칠 때’라고 하면 원문의 야영 상황을 자연스럽게 전달하면서 레위인들이 회막을 세우는 행위와도 잘 연결됩니다.
  - severity: low
    issue: ‘외인’은 현대어에서 의미 범위가 불명확하거나 고어적으로 들릴 수 있습니다.
    rationale: זָר의 제의적 무자격 의미를 민족적 이방인으로 오해하지 않도록 ‘외부인’ 및 주석으로 명시하는 편이 낫습니다.
