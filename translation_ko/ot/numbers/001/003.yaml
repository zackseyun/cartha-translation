  lexicon: HALOT
  rationale: 연령 기준의 하한선을 한국어로 자연스럽게 옮기되, ‘이상’으로 원문의 경계 설정을 보존했습니다.
- source_word: כָּל יֹצֵא צָבָא
  english_pob_choice: every man going out to war
  chosen_korean: 모든 남자—이스라엘에서 전쟁에 나갈 수 있는 자들
  alternatives_korean:
  - 전쟁에 나가는 모든 남자
  - 군 복무에 나갈 수 있는 모든 남자
  lexicon: HALOT
  rationale: יֹצֵא צָבָא의 군사 관용구를 직역하기보다, 문맥상 징집/복무 자격을 드러내는 한국어로 풀어 의미를 보존했습니다.
- source_word: תִּפְקְדוּ אֹתָם
  english_pob_choice: you and Aaron shall count them
  chosen_korean: 너와 아론이 ... 계수하십시오
  alternatives_korean:
  - 너와 아론이 ... 세십시오
  - 너와 아론이 ... 등록하십시오
  lexicon: HALOT
  rationale: פקד는 인구조사 맥락에서 ‘계수하다/등록하다’의 뜻이므로, 단순한 산술적 ‘세다’보다 공식적 조사 행위를 드러내는 ‘계수하다’를 택했습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their companies
  chosen_korean: 그들의 부대별로
  alternatives_korean:
  - 그들의 편제별로
  - 그들의 군대 단위별로
  lexicon: HALOT
  rationale: צבאות의 군사적 조직 단위를 한국어 군사 용어에 가깝게 옮겨, ‘companies’가 지시하는 편제 구분을 살렸습니다.
theological_decisions:
- issue: 전쟁/군사 자격을 드러내는 남성 표지
  chosen_reading: ‘모든 남자—이스라엘에서 전쟁에 나갈 수 있는 자들’로 옮겨, 본문의 군사 징집 대상이 성인 남성임을 분명히 했습니다.
  alternative_readings:
  - 모든 사람
  - 전쟁에 나갈 수 있는 모든 이
  rationale: 민수기 1장의 계수는 본문 자체가 남성 군역 대상을 전제하므로, 성별 표지를 완화하지 않고 원문의 역사적·문맥적 의미를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
