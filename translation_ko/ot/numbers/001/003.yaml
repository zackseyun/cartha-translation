base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
  footnotes:
  - marker: a
    text: Or 'every one going out to war.' The Hebrew expression is a military idiom for those eligible for service; the context in this chapter specifies males.
    reason: lexical_alternative
  - marker: b
    text: Or 'by their companies' or 'by their military units.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스무 살 이상인 모든 남자—이스라엘에서 전쟁에 나갈 수 있는 자들—을 너와 아론이 그들의 부대별로 계수하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁에 나갈 수 있는 모든 사람.’ 히브리어 표현은 군 복무 자격자를 가리키는 군사 관용구이며, 이 장의 문맥은 남성을 전제로 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 부대에 따라’ ‘그들의 군사 단위에 따라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  english_pob_choice: From twenty years old and upward
  chosen_korean: 스무 살 이상인
  alternatives_korean:
