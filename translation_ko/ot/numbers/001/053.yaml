source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
  footnotes:
  - marker: a
    text: Or, “against the congregation of the Israelites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 레위 사람들은 증거의 성막 주위에 진을 쳐야 하며, 이스라엘 자손의 회중 위에 진노가 내리지 않게 해야 합니다. 레위 사람들은 증거의 성막을 맡은 책임을 지켜야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이스라엘 사람들의 회중을 향해.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: But the Levites
  chosen_korean: 그러나 레위 사람들은
  alternatives_korean:
  - 그리고 레위 사람들은
  - 이제 레위 사람들은
  lexicon: HALOT
  rationale: 문맥상 앞선 진 배치 지시와 대비를 이루는 연결이므로, 한국어에서도 ‘그러나’로 역접을 살려 문맥 흐름을 자연스럽게 반영했습니다.
- source_word: יַחֲנוּ סָבִיב
  english_pob_choice: shall camp around
  chosen_korean: 주위에 진을 쳐야 하며
  alternatives_korean:
  - 주위에 진을 쳐야 하며
  - 둘레에 진을 쳐야 하며
  - 사방에 진을 쳐야 하며
  lexicon: HALOT
  rationale: יַחֲנוּ의 지시적 미래와 סָבִיב의 공간적 의미를 살려, 회막 주위를 둘러 진을 치는 군사적·공동체적 배치를 자연스럽게 표현했습니다.
- source_word: לְמִשְׁכַּן הָעֵדֻת
  english_pob_choice: the tabernacle of the testimony
  chosen_korean: 증거의 성막
  alternatives_korean:
  - 증언의 성막
  - 증거 성막
  - 언약 증거의 성막
  lexicon: HALOT
  rationale: מִשְׁכָּן은 통상 ‘성막’으로 옮기고, הָעֵדוּת는 해석을 좁히지 않기 위해 ‘증거’를 유지했습니다. 전통적 ‘증거의 성막’은 간결하면서도 본문의 법궤/증거 언어를 보존합니다.
- source_word: קֶצֶף
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 노여움
  - 격분
  lexicon: HALOT
  rationale: 이 문맥의 קֶצֶף는 단순 감정이 아니라 성소 침범 시 발생할 수 있는 언약적·심판적 진노를 가리키므로, 신학적 무게가 있는 ‘진노’로 옮겼습니다.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: on the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 회중 위에
  alternatives_korean:
  - 이스라엘 자손의 회중에
  - 이스라엘 회중 위에
  - 이스라엘 자손의 공동체 위에
  lexicon: HALOT
  rationale: עֲדָה는 ‘회중’이 가장 직접적이며, בְּנֵי יִשְׂרָאֵל은 원문의 친족·계보적 표현을 유지해 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: מִשְׁמֶרֶת
  english_pob_choice: charge
  chosen_korean: 맡은 책임
  alternatives_korean:
  - 책임
  - 맡은 직무
  - 감당할 임무
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת은 단순한 의무보다 위탁된 관리 책임의 뉘앙스가 강하므로, ‘맡은 책임’을 사용해 보존성과 자연스러움을 함께 살렸습니다.
theological_decisions:
- issue: קֶצֶף의 성격
  chosen_reading: 레위 사람들의 성막 수비는 이스라엘 위에 임할 수 있는 성소적 심판적 진노를 막는 역할을 합니다.
  alternative_readings:
  - 일반적 화남
  - 사람의 분노
  rationale: 민수기의 성막 질서 문맥에서는 קֶצֶף가 단순 감정이 아니라 거룩한 경계 위반에 대한 심판적 반응을 가리키므로, 이를 약화시키지 않고 ‘진노’로 유지했습니다.
  doctrine_reference: 성소의 거룩함과 경계 침범에 대한 언약적 심판을 보존합니다.
