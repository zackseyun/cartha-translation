  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
  footnotes:
  - marker: a
    text: Or 'the numbered men' or 'those mustered.' The Hebrew refers to those registered in the census.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 등록된 모든 사람의 수는 육십만 삼천오백오십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘등록된 사람들’, ‘소집된 사람들’로도 옮길 수 있습니다. 히브리어는 이 인구조사에 등록된 자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: So ... were
  chosen_korean: 그러므로 ...이었습니다
  alternatives_korean:
  - 그리고 ...이었습니다
  - 그리하여 ...이었습니다
  lexicon: HALOT
  rationale: 결과를 요약하는 완료 서술로 이해하여, 연결과 결론을 함께 드러내는 「그러므로」와 평서 종결 「이었습니다」로 자연스럽게 옮겼습니다.
- source_word: הַפְּקֻדִים
  english_pob_choice: those who were counted
  chosen_korean: 등록된 모든 사람
  alternatives_korean:
  - 계수된 사람들
  - 조사된 자들
  - 소집된 사람들
  lexicon: HALOT
  rationale: פקד의 수적 조사·등록 의미를 따라, 인위적인 ‘남자들’ 보충 없이 이 문맥의 인구조사 등록자라는 뜻을 살렸습니다.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  english_pob_choice: six hundred three thousand five hundred and fifty
  chosen_korean: 육십만 삼천오백오십 명
  alternatives_korean:
  - 육백삼천오백오십 명
  - 60만 3천 550명
  lexicon: HALOT
  rationale: 히브리어 수사 표현을 현대 한국어 숫자 관용에 맞게 통합하되, 합산된 총계를 그대로 전달하도록 하였습니다.
