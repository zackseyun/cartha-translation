  text: לְ/שִׁמְע֕וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/006.yaml
  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: ko
  text: 스불론 지파를 위해서는 셀루미엘, 수리삿대의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעֹון
  english_pob_choice: for Simeon
  chosen_korean: 스불론 지파를 위해서는
  alternatives_korean:
  - 시므온을 위해서는
  - 시므온 지파를 위해서는
  lexicon: HALOT
  rationale: 이 절의 לְ는 명단 안에서 각 지파의 대표를 소개하는 표지이므로, 한국어에서는 자연스럽게 ‘~을 위해서는’으로 처리해 목록 구조를 살렸습니다. 다만 본문 히브리어와 영어 주석의 지파명에 따라 정확히는 ‘시므온’이어야 하므로, 해당 항목의 지파명은 원문에 맞춰 재검토가 필요합니다.
- source_word: שְׁלֻמִיאֵל
  english_pob_choice: Shelumiel
  chosen_korean: 셀루미엘
  alternatives_korean:
  - 셀루미엘
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 표준 표기 Shelumiel을 한국어 외래어 표기식으로 옮겨 ‘셀루미엘’로 처리했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들입니다
  alternatives_korean:
  - 아들입니다
  - 아들
  lexicon: HALOT
  rationale: 족보/명칭 공식에서 בֶּן은 한국어로 ‘아들’이 가장 직접적이므로, 문장형으로는 ‘~의 아들입니다’로 자연스럽게 옮겼습니다.
- source_word: צוּרִישַׁדָּי
  english_pob_choice: Zurishaddai
  chosen_korean: 수리삿대
  alternatives_korean:
  - 주리삿대
  - 수리샷다이
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 영어 POB의 Zurishaddai를 한국어 표기 관례에 맞춰 ‘수리삿대’로 옮겼습니다.
