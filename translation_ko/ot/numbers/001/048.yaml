  text: 야훼께서 모세에게 말씀하여 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 신명기적 언약 이름 ‘YHWH’를 사용합니다. 전통적 번역에서는 ‘주’로 옮기기도 합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 이르셨습니다
  - 말씀하셨습니다, 곧
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 완료형 동사로서, 한국어에서는 자연스러운 성경 문체의 ‘말씀하여 이르셨습니다’가 직접 화행과 인용 도입을 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 제목어 ‘주’로 바꾸지 않고, POB의 기준에 따라 신명기적 언약 이름을 한국어 음역 ‘야훼’로 옮겼습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세한테
  - 모세에게로
  lexicon: HALOT
  rationale: הת형의 방향을 나타내는 אֶל은 한국어 여격 ‘-에게’가 가장 직접적이고 간결합니다. 고유명사 모세는 표준적인 성서 인명 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고 말씀하시며
  lexicon: HALOT
  rationale: 히브리어의 담화 표지인 לֵאמֹר는 한국어에서 종종 별도 절 없이 ‘이르시다/말씀하시다’로 자연스럽게 처리할 수 있어, 중복을 피하면서도 직접 인용 도입을 분명히 했습니다.
theological_decisions:
- issue: 야훼의 직접 발화 도입 방식
  chosen_reading: 서사체에서 하나님 주어를 드러내고, ‘말씀하여 이르셨습니다’로 이어지는 직설적 발화를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 모세에게 말씀하셨습니다.’
  - ‘야훼께서 모세에게 말씀하여 말씀하셨습니다.’
  rationale: 이 절은 단순 서술이 아니라 계시의 시작을 알리는 공식 문구이므로, 한국어에서도 원문의 장중함과 직접성을 살리는 표현이 적절합니다.
  doctrine_reference: 출애굽기-민수기 서사에서의 계시 공식문
