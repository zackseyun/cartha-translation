source:
  edition: WLC
  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
  footnotes:
  - marker: a
    text: Or “every one going out to war.” The Hebrew expression refers to those eligible for military duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세의 아들들로는, 그들의 세대별로, 그들의 종족별로, 그들의 조상 가문별로, 이름의 수를 따라, 곧 스무 살 이상으로 군 복무에 나갈 만한 모든 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전쟁에 나갈 모든 사람”으로도 옮길 수 있습니다. 히브리어 표현은 군역 의무가 있는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  english_pob_choice: From the sons of Manasseh
  chosen_korean: 므낫세의 아들들로는
  alternatives_korean:
  - 므낫세의 자손들로는
  - 므낫세 자손 가운데
  lexicon: WLC / HALOT
  rationale: 여기서 לְ + בני는 인구조사 항목의 표제를 이루는 소속 표지로 보아, 한국어에서는 ‘-로는’으로 자연스럽게 풀었습니다. בנים은 단순한 ‘사람들’이 아니라 족보적 단위를 가리키므로 ‘아들들’로 두었습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대별로
  alternatives_korean:
  - 그들의 نسل(세대)대로
  - 그들의 계보별로
  lexicon: HALOT
  rationale: 인구조사 문맥의 תולדות는 단순한 ‘출생’이 아니라 혈통·세대 단위를 뜻하므로, 형식은 유지하되 현대 한국어로는 ‘세대별로’가 가장 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 씨족별로
  - 그들의 가문별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 이스라엘 지파 구조 안의 하위 친족 단위를 가리키므로, 교회적 ‘가족’보다 사회·혈연 단위가 드러나는 ‘종족’ 또는 ‘씨족’이 더 적절합니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 아버지 집별로
  - 그들의 부계 가문별로
  lexicon: HALOT
  rationale: 직역하면 ‘아버지들의 집’이지만, 한국어에서는 이 관용구가 낯설기 때문에 부계 중심의 친족 단위를 드러내는 ‘조상 가문’으로 옮겼습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man going out for military service
  chosen_korean: 군 복무에 나갈 만한 모든 사람이었습니다
  alternatives_korean:
  - 전쟁에 나갈 모든 사람이었습니다
  - 군사로 나갈 모든 사람이었습니다
  lexicon: HALOT
  rationale: צָבָא는 여기서 전투 그 자체보다 ‘군역/군복무’의 자격 범주를 가리키므로, POB의 설명을 따라 ‘군 복무’로 옮겼습니다. ‘나갈 만한’은 자격·대상자라는 의미를 살려 줍니다.
theological_decisions:
- issue: 남성 군역 대상자의 성별 표지
  chosen_reading: 모든 사람이었습니다
  alternative_readings:
  - 모든 남자가 대상이었습니다
  - 모든 사람이었습니다(성별 중립)
  rationale: 히브리어 문맥과 POB의 주석은 이 표현이 실제로는 군역 가능 연령의 남성을 가리킨다고 밝힙니다. 한국어 본문에서는 장황한 성별 표지를 피하되, ‘군 복무’로 범위를 제한해 남성 군사 징집 문맥을 보존했습니다.
  doctrine_reference: 'POB translation principle: gender-accurate source rendering'
