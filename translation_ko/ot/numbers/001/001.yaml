    rationale: 원문은 ‘시내 광야에서’와 ‘회막에서’를 연속된 장소구로 제시합니다. ‘곧’은 회막이 시내 광야 자체와 동격인 듯한 인상을 주므로 삭제하는 편이 정확하고 자연스럽습니다.
