id: NUM.1.1
reference: Numbers 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the tent of meeting''; traditionally ''the tabernacle.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 시내 광야[a], 곧 회막에서, 둘째 해 둘째 달 첫째 날에 모세에게 말씀하시기를, 이스라엘 자손이 이집트 땅에서 나온 뒤에 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘회막’입니다. 전통적으로는 ‘성막’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB의 이름형 번역을 따라 יְהוָה의 고유한 신명은 한국어에서도 제목어가 아니라 고유명사로 드러나게 ‘야훼’로 옮겼습니다.
- source_word: בְּמִדְבַּר סִינַי
  english_pob_choice: in the wilderness of Sinai
  chosen_korean: 시내 광야
  alternatives_korean:
  - 시내의 광야
  - 시나이 광야
  lexicon: HALOT
  rationale: מִדְבָּר의 기본 의미를 살려 ‘광야’로 옮기고, 지명은 한국어 성서 용례에 맞는 ‘시내’로 처리했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 장막에서
  lexicon: HALOT
  rationale: 영어 POB가 전통적 ‘tabernacle’ 대신 히브리어 표현의 투명성을 살리므로, 한국어도 관용적 교회용어 ‘회막’을 사용하되 ‘장막’으로 완전히 평준화하지 않았습니다.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: on the first day of the second month
  chosen_korean: 둘째 달 첫째 날
  alternatives_korean:
  - 둘째 달의 첫날
  - 둘째 달 첫째 날에
  lexicon: HALOT
  rationale: 히브리어 날짜 관용구를 현대 한국어의 자연스러운 날짜 표지로 풀어, 달·날 순서를 명확히 했습니다.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: after they had come out of the land of Egypt
  chosen_korean: 이스라엘 자손이 이집트 땅에서 나온 뒤에
  alternatives_korean:
  - 그들이 이집트 땅에서 나온 후에
  - 이집트 땅을 떠난 뒤에
  lexicon: HALOT
  rationale: 출애굽의 시간 배경을 살리면서도, 출발점이 ‘땅’(אֶרֶץ)임을 보존해 ‘이집트 땅’으로 옮겼습니다.
theological_decisions:
- issue: 회막(אֹהֶל מוֹעֵד)의 한국어 표기
  chosen_reading: ‘회막’으로 옮기되, 영어 POB의 각주 취지를 반영해 ‘장막’으로 환원하지 않았습니다.
  alternative_readings:
  - 장막
  - 만남의 장막
  rationale: 본문의 장소명은 단순한 구조물이 아니라 여호와와 모세의 만남이 이루어지는 언약적 장소를 가리키므로, 전통적으로 통용되는 ‘회막’을 유지하는 것이 의미를 더 잘 드러냅니다.
  doctrine_reference: 성막/회막 용어의 문맥적 구분
