revisions:
- from: 야훼께서 시내 광야[a], 곧 회막에서, 둘째 해 둘째 달 첫째 날에 모세에게 말씀하시기를, 이스라엘 자손이 이집트 땅에서 나온 뒤에 하셨습니다.
  to: 야훼께서 이스라엘 자손이 이집트 땅에서 나온 지 둘째 해 둘째 달 첫째 날에 시내 광야에 있는 회막[a]에서 모세에게 말씀하여 이르셨습니다.
