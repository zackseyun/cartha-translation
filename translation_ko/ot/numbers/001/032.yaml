review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 원문은 인구 조사의 수치를 이어 주는 명사구/표제 형식이며, 이 절 자체에는 ‘입니다’에 해당하는 동사가 없습니다. 또한 כֹּל יֹצֵא צָבָא는 문자적으로 ‘전쟁에 나가는 모든 남자’를 뜻하는 군사 소집 공식이므로, ‘나갈 수 있는’처럼 능력·자격을 명시하는 표현은 원문보다 해석을 더합니다.
  naturalness: 초안의 반복된 ‘그들의’와 ‘세대별로’는 다소 부자연스럽고, ‘종족’은 민족 집단으로 이해될 여지가 있습니다. ‘계보에 따라, 씨족에 따라, 조상들의 가문에 따라’가 친족·등록 단위의 병렬을 더 자연스럽고 분명하게 전달합니다. 원문의 미완결 열거 형식은 콜론으로 보존할 수 있습니다.
  terminology: ‘에브라임’, ‘요셉’은 적절합니다. תּוֹלְדֹתָם에는 ‘계보’, מִשְׁפְּחֹתָם에는 ‘씨족’, בֵית אֲבֹתָם에는 ‘조상들의 가문’이 적합합니다. 성별이 특정된 군사 인구조사 공식이므로 ‘모든 남자’를 유지합니다. 각주 대안도 본문의 성별 지시와 일치하게 고쳐야 합니다.
  issues:
  - severity: medium
    issue: ‘모든 남자입니다’가 원문에 없는 계사문을 만듭니다.
    rationale: 히브리어는 다음 절의 계수 결과로 이어지는 열거/표제 구조입니다. 한국어 번역도 문장 종결을 피하여 이 구조를 보존하는 편이 충실합니다.
  - severity: medium
    issue: ‘전쟁에 나갈 수 있는’이 가능·자격의 의미를 추가합니다.
    rationale: יֹצֵא צָבָא는 직역하면 ‘전쟁에 나가는’이며, 문맥상 군사 소집 대상을 가리키지만 ‘할 수 있는’이라는 양태를 본문에 명시하지 않습니다.
  - severity: low
    issue: ‘세대별로’와 ‘종족별로’의 용어 선택이 친족·계보 행정 공식에 덜 정확합니다.
    rationale: תּוֹלְדֹתָם은 여기서 계보/혈통 계열을, מִשְׁפְּחֹתָם은 민족 일반보다 작은 씨족 단위를 가리킵니다.
  - severity: medium
    issue: 각주의 ‘모든 사람’은 본문의 남성 지시와 불일치합니다.
    rationale: 영어 감사 기록의 대안은 군사 복무 관용구의 번역 대안일 뿐 성별 중립화를 요구하지 않습니다. 한국어 각주도 ‘모든 남자’를 유지해야 합니다.
  revised_text: '요셉의 아들들, 곧 에브라임의 아들들: 그들의 계보에 따라, 그들의 씨족에 따라, 그들의 조상들의 가문에 따라, 이름 수에 따라, 스무 살 이상으로 전쟁에 나가는 모든 남자.[a]'
