id: NUM.1.32
reference: Numbers 1:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
  footnotes:
  - marker: a
    text: Or 'all who go out for military service.' The Hebrew idiom literally speaks of going out to war.
    reason: lexical_alternative
translation:
  language: ko
  text: '요셉의 아들들, 곧 에브라임의 아들들: 그들의 계보에 따라, 그들의 씨족에 따라, 그들의 조상들의 가문에 따라, 이름 수에 따라, 스무 살 이상으로 전쟁에 나가는 모든 남자.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군 복무를 위해 나가는 모든 남자’. 히브리어 관용구는 문자적으로 ‘전쟁에 나가다’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף / לִבְנֵי אֶפְרַיִם
  english_pob_choice: For the sons of Joseph / for the sons of Ephraim
  chosen_korean: 요셉의 아들들, 곧 에브라임의 아들들
  alternatives_korean:
  - 요셉의 자손들, 곧 에브라임의 자손들
  - 요셉의 아들들, 에브라임의 아들들
  lexicon: HALOT
  rationale: 족보적·지파적 공식에서 בנים은 직역상 ‘아들들’이지만, 한국어에서는 ‘자손들’도 가능하나 본문이 지파 편제를 말하므로 직계 후손을 드러내는 ‘아들들’을 유지했습니다. ‘곧’은 요셉 지파 안에서 에브라임 지파를 특정하는 구조를 분명히 합니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대별로
  alternatives_korean:
  - 그들의 نسل별로
  - 그들의 계보별로
  - 그들의 대대로
  lexicon: HALOT
  rationale: 이 항목은 단순한 ‘세대’보다 출생·혈통의 계열을 가리키는 공식이므로, 한국어에서 행정적 배열을 살리면서도 혈통적 의미를 담는 ‘세대별로’를 택했습니다.
- source_word: לְמִשְׁפְּחֹתָם / לְבֵית אֲבֹתָם
  english_pob_choice: by their clans / by their fathers’ houses
  chosen_korean: 그들의 종족별로, 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 가문별로, 그들의 아비 집별로
  - 그들의 가족별로, 그들의 조상 집안별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 현대 핵가족보다 큰 친족 단위를 가리키므로 ‘종족’이 더 가깝고, בֵית־אָבוֹת는 기술적 친족 용어이므로 직역에 가까운 ‘조상 가문’으로 옮겼습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: by the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름의 수에 따라
  - 이름 수대로
  lexicon: HALOT
  rationale: 이 표현은 개별 인원 계수를 뜻하는 관용구이므로, ‘이름의 수대로’로 짧고 직접적으로 옮겨 인명 단위의 계수라는 점을 살렸습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man going out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 남자
  alternatives_korean:
  - 전쟁에 나가는 모든 남자
  - 군 복무를 위해 나가는 모든 남자
  lexicon: HALOT
  rationale: 히브리어 관용구는 군사적 소집 가능자를 뜻하며, EN POB의 주석처럼 문자적으로는 ‘전쟁에 나가다’입니다. 한국어에서는 소집 자격을 드러내기 위해 ‘나갈 수 있는’을 보탰고, 남성 표지를 ‘모든 남자’로 유지했습니다.
theological_decisions:
- issue: 남성 중심의 군사 소집 공식
  chosen_reading: ‘모든 남자’로 남성 표지를 유지했습니다.
  alternative_readings:
  - 모든 사람
  - 모두
  rationale: 본문은 군사 동원 대상의 성별을 분명히 하는 인구조사 공식이므로, 중성화하지 않고 남성 지시를 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
