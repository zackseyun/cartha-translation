revisions:
- from: 요셉의 아들들, 곧 에브라임의 아들들은 그들의 세대별로, 그들의 종족별로, 그들의 조상 가문별로, 이름의 수대로, 곧 스무 살 이상으로 전쟁에 나갈 수 있는 모든 남자입니다.[a]
  to: '요셉의 아들들, 곧 에브라임의 아들들: 그들의 계보에 따라, 그들의 씨족에 따라, 그들의 조상들의 가문에 따라, 이름 수에 따라, 스무 살 이상으로 전쟁에 나가는 모든 남자.[a]'
  rationale: 원문의 열거형·미완결 구조를 콜론으로 보존하고, 불필요한 계사와 가능 표현을 제거했습니다. 친족 단위는 ‘계보–씨족–조상들의 가문’으로 구별했으며, 군사 소집 대상의 남성 지시와 각주를 일치시켰습니다.
