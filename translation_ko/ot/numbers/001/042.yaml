review_pass:
  verdict: revise
  source_fidelity: 히브리어는 민수기 1장의 인구 조사 공식으로, 납달리 지파의 남성들을 계보·씨족·조상 가문별로, 이름 수에 따라 기록하며 스무 살 이상으로 군대에 나갈 자들을 가리킵니다. 초안의 ‘전쟁에 나갈 수 있는’은 자격의 의미를 다소 풀어쓴 표현이고, 절 끝의 ‘입니다’는 원문에 없는 서술을 보태며 다음 절의 수치와 이어지는 문장 구조를 흐립니다.
  naturalness: ‘그들의 세대에 따라’는 혈통·등록 단위라는 문맥에서 다소 부자연스럽고, ‘스무 살 이상으로서’도 어색합니다. ‘그들의 계보와 씨족과 조상 가문에 따라’, ‘스무 살 이상으로’가 현대 표준 한국어 성경 문체에 더 자연스럽습니다. 원문의 미완결 열거 구조는 콜론으로 보존하는 것이 적절합니다.
  terminology: ‘씨족’은 מִשְׁפָּחָה에, ‘조상 가문’은 בֵּית אָבוֹת에 적합합니다. ‘군대에 나갈 모든 남자’는 כָּל־יֹצֵא צָבָא의 군사 소집 문맥을 충실히 반영하면서 ‘전쟁에 나갈 수 있는’보다 원문의 참여형 표현에 가깝습니다. 납달리는 통용 성경 표기입니다.
  issues:
  - severity: medium
    issue: 절 끝의 ‘입니다’와 마침표
    rationale: 원문은 다음 절의 계수 결과로 이어지는 명사구/열거 구조이며 독립 서술문으로 끝나지 않습니다. ‘입니다’는 원문에 없는 계사적 종결을 추가합니다.
  - severity: medium
    issue: ‘그들의 세대에 따라’
    rationale: תּוֹלְדֹתָם은 이 인구 조사 공식에서 단순한 시간상의 세대보다 계보·출생 계통에 따른 분류를 뜻합니다. ‘계보’가 문맥을 더 정확히 전달합니다.
  - severity: low
    issue: ‘스무 살 이상으로서’ 및 ‘전쟁에 나갈 수 있는’
    rationale: ‘이상으로서’는 부자연스럽고, ‘나갈 수 있는’은 가능·능력을 명시합니다. 원문은 ‘군대에 나가는’이라는 군사 소집/복무 범주의 표현입니다.
  revised_text: '납달리의 아들들은 그들의 계보와 씨족과 조상 가문에 따라, 이름 수에 따라, 스무 살 이상으로 군대에 나갈 모든 남자들입니다:'
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘군대에 나가는 모든 자들’입니다. 이 히브리어 관용구는 이 문맥에서 군복무 대상자를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문에 맞추어 혈통적 분류를 ‘계보’로 명확히 하고, 군사 소집 표현을 ‘군대에 나갈’로 옮겼습니다. 다만 이 구절이 다음 절의 계수 결과로 이어지는 구조이므로, 종결을 ‘입니다:’로 두어 원문의 연결성을 보존했습니다. 초안에 있던 각주 표지는 수정문 본문에서 ‘남자들입니다[a]:’처럼 ‘군대에 나갈 모든 남자들’ 뒤에 유지되어야 합니다.
