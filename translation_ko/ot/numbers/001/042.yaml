id: NUM.1.42
reference: Numbers 1:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
  footnotes:
  - marker: a
    text: Or, more formally, 'all going out to war' or 'every one going out to the host/army.' The Hebrew idiom refers to those eligible for military service.
    reason: lexical_alternative
translation:
  language: ko
  text: 납달리의 아들들은, 그들의 세대에 따라, 그들의 종족에 따라, 그들의 조상 가문에 따라, 이름의 수를 기준으로, 스무 살 이상으로서, 전쟁에 나갈 수 있는 모든 남자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘전쟁에 나가는 자들’ 또는 더 형식적으로는 ‘군대로 나가는 자들’이라는 뜻입니다. 이 히브리어 관용구는 군복무 자격자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  english_pob_choice: The sons of Naphtali
  chosen_korean: 납달리의 아들들
  alternatives_korean:
  - 납달리의 자손들
  - 납달리의 자녀들
  lexicon: HALOT
  rationale: 족보·지파 목록의 공식 표현이므로 직역에 가깝게 ‘아들들’로 옮겨 남성 중심의 지파 구성과 계보성을 살렸습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대에 따라
  alternatives_korean:
  - 그들의 نسل에 따라
  - 그들의 계보에 따라
  lexicon: HALOT
  rationale: 여기서는 단순 연대가 아니라 혈통적 파생을 가리키므로, 공식적이고 자연스러운 한국어로 ‘세대’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם / לְבֵית אֲבֹתָם
  english_pob_choice: by their clans / by their fathers’ houses
  chosen_korean: 그들의 종족에 따라, 그들의 조상 가문에 따라
  alternatives_korean:
  - 그들의 씨족에 따라, 그들의 아버지들의 집에 따라
  - 그들의 가족별로, 그들의 아버지 집안별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 핵가족보다 큰 친족 집단이므로 ‘종족’으로, ‘아버지의 집’은 한국어로 이해되도록 ‘조상 가문’으로 옮겼습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every male able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 남자들
  alternatives_korean:
  - 전쟁에 나갈 수 있는 모든 사람들
  - 군역에 나갈 수 있는 모든 남자들
  - 군대로 나가는 모든 남자들
  lexicon: HALOT
  rationale: 직역하면 ‘군대/전쟁으로 나가는 자’이지만, 문맥상 병역 자격자를 뜻하므로 군사적 의미를 유지하면서도 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 인구 조사 명부의 성별 표현
  chosen_reading: ‘모든 남자들’로 옮겨 이 구절이 전쟁 동원 가능한 남성 인구를 세는 문맥임을 분명히 했습니다.
  alternative_readings:
  - ‘모든 사람들’
  - ‘모든 남성들’
  rationale: 히브리어 표현과 POB의 ‘every male’ 해석에 맞추어, 군사 징집 대상이 남성임을 흐리지 않도록 했습니다.
  doctrine_reference: 민수기 1장의 지파별 군사 인구 조사 문맥
