id: NUM.1.49
reference: Numbers 1:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 레위 지파만은 계수하지 마십시오. 이스라엘 자손[a] 가운데서 그들의 인원수를 세지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로 옮길 수 있습니다. 히브리어는 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  - 하지만
  lexicon: HALOT
  rationale: 앞선 인구 조사 명령에 대한 예외를 나타내므로, 제한적·배제적 뉘앙스를 살리는 ‘다만’이 가장 자연스럽습니다.
- source_word: מַטֵּה לֵוִי
  english_pob_choice: the tribe of Levi
  chosen_korean: 레위 지파
  alternatives_korean:
  - 레위의 지팡이
  - 레위의 막대기
  lexicon: HALOT
  rationale: 이 문맥의 מַטֵּה는 ‘지팡이’가 아니라 지파를 뜻하므로, 문맥상의 의미를 따라 ‘레위 지파’로 옮겼습니다.
- source_word: תִפְקֹד / תִשָּׂא
  english_pob_choice: count / take their number
  chosen_korean: 조사하지 마십시오 / 그들의 수를 세지 마십시오
  alternatives_korean:
  - 계수하지 마십시오 / 그들의 머릿수를 들지 마십시오
  - 인원수를 세지 마십시오
  lexicon: HALOT
  rationale: פקד와 נשׂא의 호응은 인구 조사 표현이므로, 앞절과의 금지를 살려 ‘조사하다’와 ‘수를 세다’로 자연스럽게 대응시켰습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표지를 보존할 수 있는 관용적 표현으로 ‘이스라엘 자손’을 사용했습니다.
theological_decisions:
- issue: 레위 지파를 인구 조사에서 제외하는 명령의 표현 강도
  chosen_reading: ‘조사하지 마십시오’와 ‘그들의 수를 세지 마십시오’로 중복해 금지의 강도를 분명히 했습니다.
  alternative_readings:
  - ‘세지 마십시오’ 하나로 단순화
  - ‘계수하지 마십시오’로 기술적 표현 사용
  rationale: 본문은 두 동사를 병렬로 써 레위 지파가 일반적인 군사/행정 인구 조사 대상이 아님을 분명히 하므로, 한국어도 두 표현을 모두 살려 예외성을 드러냈습니다.
  doctrine_reference: Numbers 1장 인구조사 맥락에 따른 본문 의미 보존
- issue: 이스라엘 집단 명칭의 성별 표지
  chosen_reading: ‘이스라엘 자손’으로 옮겨 히브리어의 관용적 남성 복수를 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성’
  rationale: 원문은 בְּנֵי יִשְׂרָאֵל을 사용하며, 본문 형식을 따라 해당 표지를 지우지 않는 것이 더 투명합니다.
  doctrine_reference: 번역 원칙의 원문 투명성
