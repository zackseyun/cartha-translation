id: NUM.1.28
reference: Numbers 1:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
  footnotes:
  - marker: a
    text: Or 'every one who goes out to war.' The Hebrew expression is literally 'every going-out of army/war' and refers here to military-eligible men.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스사갈의 아들들은, 그들의 세대에 따라, 그들의 씨족에 따라, 그들의 조상들의 가문에 따라, 이름의 수대로, 스무 살 이상으로서 전쟁에 나갈 수 있는 모든 사람입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  english_pob_choice: For the sons of Issachar
  chosen_korean: 이스사갈의 아들들은
  alternatives_korean:
  - 이스사갈의 자손들은
  - 이스사갈의 아들들에게
  lexicon: HALOT
  rationale: 지파 명단의 도입부로서 לְ를 문맥상 ‘~에게/에 대하여’보다는 주제 표지로 풀어 자연스럽게 옮겼고, בְּנֵי는 족보적 남계 구성원의 의미를 살려 ‘아들들’로 렌더링했습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대에 따라
  alternatives_korean:
  - 그들의 نسل에 따라
  - 그들의 계보에 따라
  lexicon: HALOT
  rationale: 반복되는 인구조사 공식의 문맥에서 תּוֹלְדוֹת는 단순한 ‘기록’보다 세대별 분류를 가리키므로, 형식은 유지하되 한국어에서 자연한 ‘세대에 따라’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 족속에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 현대의 ‘가족’보다 더 큰 친족 단위를 가리키므로, 지파 내부의 하위 친족집단을 드러내는 ‘씨족’을 선택했습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상들의 가문에 따라
  alternatives_korean:
  - 그들의 아버지들의 집에 따라
  - 그들의 조상 가문에 따라
  lexicon: HALOT
  rationale: 직역형인 ‘아버지들의 집’은 한국어에서 어색하므로, 혈연-가문 구조를 유지하면서도 읽기 자연한 ‘조상들의 가문’으로 옮겼습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: by the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름의 수에 따라
  - 이름의 수를 따라
  lexicon: HALOT
  rationale: 인구조사에서 개체를 이름과 결부해 계수하는 관용을 살리기 위해, 원문의 간명함을 유지하는 ‘이름의 수대로’를 택했습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 사람입니다
  alternatives_korean:
  - 전쟁에 나가는 모든 사람입니다
  - 군대에 나갈 수 있는 모든 사람입니다
  lexicon: HALOT
  rationale: יֹצֵא צָבָא는 문자적으로 ‘군대/전쟁으로 나가는 자’이므로, 전투 동원을 분명히 드러내는 ‘전쟁에 나갈 수 있는’으로 옮겼습니다. 문장 종결은 목록형 진술에 맞춰 평서형으로 정리했습니다.
theological_decisions:
- issue: 성별이 특정된 군역 대상의 표현
  chosen_reading: 전쟁에 나갈 수 있는 모든 사람
  alternative_readings:
  - 전쟁에 나갈 수 있는 모든 남자
  - 군 복무가 가능한 모든 사람
  rationale: 히브리어 인구조사 공식은 문법적으로 남성 표지와 군역 가능성을 함께 갖고 있으므로, 본문 기능을 살리면서도 한국어에서 과도하게 현대화하지 않기 위해 중립적인 ‘모든 사람’으로 옮기되 군역 문맥을 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
