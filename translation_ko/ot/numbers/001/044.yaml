id: NUM.1.44
reference: Numbers 1:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
  footnotes:
  - marker: a
    text: Or “those who were numbered.” The Hebrew can emphasize either the counted persons or the census enrollment itself.
    reason: lexical_alternative
  - marker: b
    text: “Fathers’ house” refers to the ancestral household or clan unit in Israel’s tribal structure.
    reason: cultural_note
translation:
  language: ko
  text: 이들은 계수된 자들입니다. 곧 모세와 아론과 이스라엘의 지도자들—열두 명, 곧 조상들의 집마다 한 사람씩—이 함께 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “계수된 자들”의 뜻입니다. 히브리어는 사람 자체를 가리키거나, 인구조사에 올려진 명단/결과를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “조상들의 집”은 이스라엘 지파 구조 안의 조상 가문 또는 족속 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים / פָּקַד
  english_pob_choice: the ones counted / counted
  chosen_korean: 계수된 자들 / 계수된
  alternatives_korean:
  - 세어 놓은 자들 / 세어
  lexicon: HALOT
  rationale: 인구조사 문맥에서 פקד는 단순한 숫자 계산보다 ‘조사하여 인원으로 잡다’는 뜻이므로, 사람을 가리키는 명사구는 ‘계수된 자들’로, 동사는 ‘계수된’으로 옮겼습니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 수장들
  - 이스라엘의 족장들
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 왕족이 아니라 지파 대표를 뜻하므로, 현대 독자가 오해하지 않도록 ‘지도자들’로 옮겼습니다.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  english_pob_choice: twelve men
  chosen_korean: 열두 명
  alternatives_korean:
  - 열두 남자
  - 열두 사람
  lexicon: HALOT
  rationale: 히브리어는 남성형 איש을 쓰지만, 한국어에서는 ‘남자’보다 ‘명’이 자연스럽고 인원 수를 명확히 드러내므로 이를 택했습니다.
- source_word: לְבֵית אֲבֹתָיו
  english_pob_choice: for his fathers’ house
  chosen_korean: 조상들의 집마다 한 사람씩
  alternatives_korean:
  - 조상들의 집을 위하여 한 사람씩
  - 아버지들의 집마다 한 사람씩
  lexicon: HALOT
  rationale: ‘아버지들의 집’이라는 관용구를 직역해도 되지만, 여기서는 각 대표가 족장 가문 단위를 대표한다는 기능이 핵심이므로 의미를 살려 ‘조상들의 집마다’로 옮겼습니다.
theological_decisions:
- issue: 대표자들이 인구조사에 참여한 관계를 어떻게 문장으로 표현할지
  chosen_reading: 모세와 아론과 이스라엘의 지도자들이 함께 그 계수에 참여한 것으로 읽었습니다.
  alternative_readings:
  - 모세와 아론이 이스라엘의 지도자들과 함께 계수했다
  - 모세와 아론 및 이스라엘의 지도자들—열두 명—이 함께 있었다
  rationale: 히브리어는 계수의 수행 주체와 대표자들의 동시 존재를 함께 말하므로, 한국어에서도 ‘함께 있었습니다’로 마무리해 대표성의 공적 성격을 드러냈습니다.
  doctrine_reference: 민수기 1장의 지파 대표성 및 공동 증언 구조
- issue: ‘fathers’ house’를 한국어 교회 전통 용어로 고정할지 여부
  chosen_reading: 전통적 ‘가문’보다 족장 단위를 드러내는 ‘조상들의 집’을 유지했습니다.
  alternative_readings:
  - 가문마다
  - 부계 집안마다
  rationale: 본문의 사회구조는 혈연 일반이 아니라 이스라엘의 족속/가문 체계이므로, 평이하되 구조가 보이도록 표현했습니다.
  doctrine_reference: 이스라엘의 족속/가문 질서
