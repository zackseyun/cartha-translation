id: NUM.1.4
reference: Numbers 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
  footnotes:
  - marker: a
    text: Or 'the chief of his ancestral house.' The Hebrew literally says 'the head of his fathers’ house,' referring to the leading male representative of a patrilineal household or clan.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들과 함께 한 지파에서 한 사람, 곧 그의 조상들의 집의 우두머리인 각 사람이 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아버지들의 집의 머리’라고 되어 있으며, 부계적 가문 또는 씨족을 대표하는 우두머리를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְאִתְּכֶם
  english_pob_choice: And with you
  chosen_korean: 당신들과 함께
  alternatives_korean:
  - 당신들과 더불어
  - 당신들과 함께하여
  lexicon: HALOT
  rationale: 모세와 아론 곁에 함께해야 할 사람들을 가리키므로, 관계와 동반의 뜻을 자연스러운 현대 한국어로 살렸습니다.
- source_word: אִישׁ אִישׁ לַמַּטֶּה
  english_pob_choice: a man from each tribe
  chosen_korean: 한 지파에서 한 사람
  alternatives_korean:
  - 각 지파마다 한 사람
  - 지파마다 한 사람씩
  lexicon: HALOT
  rationale: 반복된 אִישׁ는 분배적 의미이므로, ‘각 지파마다’의 뜻을 살리되 원문 구조를 너무 풀지 않도록 ‘한 지파에서 한 사람’으로 옮겼습니다.
- source_word: רֹאשׁ לְבֵית אֲבֹתָיו
  english_pob_choice: the head of his fathers’ house
  chosen_korean: 그의 조상들의 집의 우두머리
  alternatives_korean:
  - 그의 조상들의 집의 머리
  - 그의 아버지들의 집안의 우두머리
  - 그의 족장
  lexicon: HALOT
  rationale: ‘아버지들의 집’이라는 히브리어의 친족·씨족 구조를 드러내기 위해, 관용적이지만 구조를 유지하는 ‘조상들의 집’을 택했습니다.
theological_decisions:
- issue: 족장/대표직을 나타내는 רֹאשׁ의 처리
  chosen_reading: 직함을 일반화하지 않고 ‘우두머리’로 직역해, 지파 내 대표자라는 원문의 사회적 구조를 드러냈습니다.
  alternative_readings:
  - 족장
  - 지도자
  - 우두머리
  rationale: 이 절은 제도명보다 가문 대표의 신분을 설명하므로, 후대 교회적 직분 용어로 고정하지 않는 편이 원문에 더 가깝습니다.
  doctrine_reference: 민수기 1장의 인구 조사와 지파 질서
- issue: אֲבֹתָיו를 ‘아버지들’로 직역할지의 문제
  chosen_reading: 한국어에서는 관계가 잘 드러나도록 ‘조상들의 집’으로 풀어, 단순한 생물학적 아버지들의 집이 아니라 부계 씨족 단위를 나타내게 했습니다.
  alternative_readings:
  - 그의 아버지들의 집
  - 그의 선조들의 집
  - 그의 가문
  rationale: 원문은 부계 혈통을 전제한 가문 단위를 뜻하므로, 의미를 유지하면서도 독자가 이해하기 쉬운 표현을 선택했습니다.
  doctrine_reference: 이스라엘의 가문/씨족 구조
