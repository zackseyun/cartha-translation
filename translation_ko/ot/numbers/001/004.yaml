  source_fidelity: 원문의 분배적 표현(각 지파에서 한 사람)과 그 사람이 부계 가문 단위의 우두머리라는 설명은 대체로 반영되었습니다. 그러나 ‘한 지파에서 한 사람, 곧 … 각 사람’은 한국어에서 분배 관계와 수식 범위가 어색하고 모호합니다. 또한 ‘당신들’은 성경의 복수 청자에게 쓰기에 부자연스럽고 불필요하게 거리감이 있습니다.
  naturalness: ‘너희와 함께 각 지파에서 한 사람씩 있어야 하며, 그는 … 우두머리여야 합니다’는 현대 표준 한국어의 합쇼체에서 자연스럽고, 원문의 지시적 미래 용법도 잘 드러냅니다.
  terminology: ‘조상의 집안’은 בֵּית־אֲבֹתָיו가 가리키는 부계 친족·가문 단위를 자연스럽게 전달합니다. 각주에서는 문자적 표현인 ‘아버지들의 집’과 남성 대표자라는 문맥을 밝혀 의미 범위를 보완합니다.
  issues:
