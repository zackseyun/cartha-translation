translation:
  language: ko
  text: 갓 지파에서는 엘리아삽, 드우엘의 아들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 병행 구절은 이름을 르우엘로 전합니다(민 2:14 참조).
    reason: textual_variant
lexical_decisions:
- source_word: לְ/גָד
  english_pob_choice: from Gad
  chosen_korean: 갓 지파에서는
  alternatives_korean:
  - 갓에게
  - 갓을 위하여
  lexicon: HALOT
  rationale: 여기서 לְ는 지파 소속을 나타내므로, 명단 문맥에 맞게 ‘갓 지파에서는’로 풀어 대표성과 소속을 함께 드러냈습니다.
- source_word: אֶלְיָסָף
  english_pob_choice: Eliasaph
  chosen_korean: 엘리아삽
  alternatives_korean:
  - 엘리야삽
  - 엘리아사프
  lexicon: 고유명사 음역
  rationale: 인명은 음역하는 원칙에 따라 표준적인 한국어 음역으로 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 아들
  - 아들이었습니다
  lexicon: HALOT
  rationale: 족보·명부 문맥의 בן은 소속 관계를 간결하게 나타내므로, 서술형 종결과 결합해 자연스럽게 ‘드우엘의 아들이었습니다’로 옮겼습니다.
- source_word: דְּעוּאֵל
  english_pob_choice: Deuel
  chosen_korean: 드우엘
  alternatives_korean:
  - 데우엘
  - 르우엘
  lexicon: 고유명사 음역
  rationale: 이 절의 히브리어 본문 형태 דְּעוּאֵל을 그대로 반영해 ‘드우엘’로 음역했습니다.
theological_decisions:
- issue: 병행구와의 인명 차이
  chosen_reading: 본문은 드우엘을 따르되, 병행본문에 나타나는 르우엘 변이를 본문 밖에서 추적할 수 있게 두었습니다.
  alternative_readings:
  - 르우엘로 본문 통일
  - 변이 언급 생략
  rationale: 이 절의 WLC 형태를 우선 반영하면서도, 병행구의 이름 형태 차이를 숨기지 않고 검토 가능하게 두는 것이 본문 충실성에 더 부합합니다.
  doctrine_reference: 본문비평/병행본문 주석 원칙
