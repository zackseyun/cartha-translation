    rationale: 원문의 לְ는 명단에서 소속·항목을 표지하지만, 한국어 여격 ‘-들에게는’은 수여·대상 의미를 강하게 띱니다. ‘가운데’로 바꾸면 두 아들 계열 아래의 병렬 명단이라는 기능을 자연스럽게 전달합니다.
