  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: ko
  text: 요셉의 아들들에게는 — 에브라임에는 아미훗의 아들 엘리사마가, 므낫세에는 브다술의 아들 가말리엘이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  english_pob_choice: For the sons of Joseph
  chosen_korean: 요셉의 아들들에게는
  alternatives_korean:
  - 요셉의 아들들을 위해
  - 요셉의 자손들에게는
  lexicon: HALOT
  rationale: 인구 조사 명단의 항목 표지를 자연스럽게 드러내기 위해 한국어에서는 부드러운 주제 표지로 옮기되, בְנֵי의 직역인 ‘아들들’은 유지했습니다.
- source_word: לְ/אֶפְרַיִם
  english_pob_choice: for Ephraim
  chosen_korean: 에브라임에는
  alternatives_korean:
