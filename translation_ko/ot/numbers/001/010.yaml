  - 에브라임에게는
  lexicon: HALOT
  rationale: 앞절의 병렬 구조를 살리기 위해 각 분파를 소개하는 표지로 처리했고, שבט 문맥이 이미 분명하므로 ‘지파’는 덧붙이지 않았습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 아들인
  - 의 아들
  lexicon: HALOT
  rationale: 족보·명단 형식에서 한국어의 간결한 소유 구조를 살리기 위해 ‘아들’로 옮겼습니다.
- source_word: פְּדָהצוּר
  english_pob_choice: Pedahzur
  chosen_korean: 브다술
  alternatives_korean:
