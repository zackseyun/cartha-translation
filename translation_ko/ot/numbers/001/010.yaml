  source_fidelity: 히브리어는 요셉의 두 아들 계열(에브라임과 므낫세)에 속한 대표자의 이름과 부친명을 병렬로 제시합니다. 초안은 이 구조를 대체로 반영하지만, עַמִּיהוּד(Ammihud)를 ‘아미훗’으로 적어 이름의 첫 자음군을 빠뜨렸습니다.
  naturalness: ‘요셉의 아들들에게는’은 사람에게 무엇을 주거나 말하는 듯한 여격으로 들려 명단 표지로는 다소 부자연스럽습니다. ‘요셉의 아들들 가운데’가 한국어에서 두 분파 아래의 명단을 더 자연스럽고 명료하게 연결합니다.
