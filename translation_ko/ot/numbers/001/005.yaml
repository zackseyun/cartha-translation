  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
  footnotes:
  - marker: a
    text: Or 'from Reuben, Elizur son of Shedeur.' The Hebrew preposition can be understood as marking tribal affiliation or representation.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 이들은 여러분과 함께 설 사람들의 이름입니다: 르우벤[a], 스데우르의 아들 엘리수르입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르우벤으로부터, 스데우르의 아들 엘리수르.’ 히브리어 전치사 는 지파 소속이나 대표를 나타내는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה שְׁמוֹת
  english_pob_choice: And these are the names of
  chosen_korean: 그리고 이들은 … 이름입니다
  alternatives_korean:
  - 이들은 … 이름입니다
  - 그리고 이것들은 … 이름입니다
  lexicon: HALOT
  rationale: 목록 도입의 연결어 וְ와 παρουσία식 표현 אֵלֶּה를 살려 ‘그리고 이들은’으로 옮기고, 명시적 명사 ‘이름들’은 한국어에서 자연스럽게 목적어 자리에 두었습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 사람들의
  alternatives_korean:
  - 남자들의
  - 사람들의
  lexicon: HALOT
  rationale: 본문의 אֲנָשִׁים는 특정 대표자들을 가리키는 일반적 ‘남자들’이지만, 한국어에서는 앞의 ‘이들은’에 이어 소속 관계를 자연스럽게 드러내는 표현으로 처리했습니다.
- source_word: יַעַמְדוּ אִתְּכֶם
  english_pob_choice: who shall stand with you
  chosen_korean: 여러분과 함께 설
  alternatives_korean:
  - 여러분 곁에 설
  - 여러분과 함께 서야 할
  lexicon: HALOT
  rationale: ‘서다’의 대표·보좌 의미를 살리되 과도한 의역을 피했고, 2인칭 복수는 한국어에서 자연스러운 ‘여러분’으로 옮겼습니다.
- source_word: לִרְאוּבֵן
  english_pob_choice: for Reuben
  chosen_korean: 르우벤
  alternatives_korean:
  - 르우벤을 위하여
  - 르우벤에게 속한
  lexicon: HALOT
  rationale: 여기서 ל는 지파 대표 자격을 표시하므로, 영어 POB의 주석처럼 한국어 본문에서는 별도 전치사로 풀기보다 이름만 두고 각주로 대표/소속 가능성을 밝혔습니다.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  english_pob_choice: Elizur son of Shedeur
  chosen_korean: 스데우르의 아들 엘리수르
  alternatives_korean:
  - 엘리수르, 스데우르의 아들
  - 스데우르의 아들 엘리수르
  lexicon: HALOT
  rationale: 족보 공식 בן은 관용적으로 ‘…의 아들’로 옮겼고, 인명은 현대 음역에 맞춰 엘리수르/스데우르로 처리했습니다.
theological_decisions:
- issue: ל preposition in לִרְאוּבֵן as tribal affiliation or representation
  chosen_reading: 본문에는 ‘르우벤’만 두고, 각주로 ‘르우벤으로부터/르우벤을 대표하는’ 가능성을 제시했습니다.
  alternative_readings:
  - 르우벤을 위하여
  - 르우벤에게 속한
  - 르우벤으로부터
  rationale: 히브리어 전치사 ל의 의미가 지파 소속과 대표성을 모두 가질 수 있으므로, 본문에서 한쪽으로 단정하지 않고 POB 주석 전통에 맞춰 열어 두었습니다.
  doctrine_reference: textual precision / translation transparency
