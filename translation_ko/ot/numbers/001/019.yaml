translation:
  language: ko
  text: 야훼께서 모세에게 명령하신 대로, 모세는 시나이 광야에서 그들을 계수하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수하였습니다’는 이 문맥의 פקד를 반영한 번역입니다. 이 동사는 ‘등록하다’, ‘소집하다’, 또는 ‘번호를 매기다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
