  - 주
  lexicon: HALOT
  rationale: 원문의 신적 이름을 대체하지 않고 음역하는 POB 원칙을 따랐습니다. ‘주’로 옮기면 고유명칭성이 약화됩니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
