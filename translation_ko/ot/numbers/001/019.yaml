  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
  footnotes:
  - marker: a
    text: Or 'he mustered them' or 'he numbered them.' The Hebrew verb can refer to enrolling or taking a census.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 명령하신 대로, 그들은 시나이 광야에서 계수하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수하였습니다’는 이 문맥의 פקד를 반영한 번역입니다. 동사는 ‘조사하다’, ‘소집하다’, ‘번호를 매기다’의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: just as
  chosen_korean: ~하신 대로
  alternatives_korean:
  - ~하듯이
  - ~한 것처럼
  lexicon: HALOT
  rationale: 앞선 명령과의 합치를 자연스럽게 나타내는 표현으로, 단순한 비교보다 순응·일치의 뜻을 분명하게 드러냅니다.
- source_word: צִוָּה
  english_pob_choice: had commanded
  chosen_korean: 명령하신
  alternatives_korean:
  - 명령하셨던
  - 지시하신
  lexicon: HALOT
  rationale: 하나님의 말씀을 단순한 안내가 아니라 권위 있는 명령으로 받는 원문 뉘앙스를 살렸습니다.
- source_word: וַיִּפְקְדֵם
  english_pob_choice: he counted them
  chosen_korean: 계수하였습니다
  alternatives_korean:
  - 조사하였습니다
  - 센서스하였습니다
  - 헤아렸습니다
  lexicon: HALOT
  rationale: פקד는 이 인구조사 문맥에서 단순 계산보다 공식적 ‘계수/조사’를 뜻하므로, 현대 한국어에서 문맥을 가장 분명히 드러내는 ‘계수하다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
