    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  english_pob_choice: those counted
  chosen_korean: 계수된 사람
  alternatives_korean:
  - 등록된 사람
  - 조사된 사람
  lexicon: HALOT
  rationale: 인구 조사 문맥에서 פקד의 수동 분사형은 ‘계수되다/등록되다’의 뜻이므로, 자연스러운 한국어로 ‘계수된 사람’이라 옮겨 수량 집계를 분명히 했습니다.
- source_word: לְמַטֵּה
  english_pob_choice: from the tribe of
  chosen_korean: 유다 지파에서
  alternatives_korean:
  - 유다 지파에 속한
  - 유다 지파로부터
  lexicon: HALOT
  rationale: ל + מַטֶּה는 이 명단에서 지파 소속을 나타내므로, 반복 공식에 맞는 한국어로 ‘지파에서’라고 처리했습니다.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  english_pob_choice: seventy-four thousand six hundred
  chosen_korean: 칠만사천육백 명
  alternatives_korean:
  - 사십사천육백 명
  - 일흔넷천육백 명
  lexicon: HALOT
  rationale: 히브리어의 ‘네와 칠십 천과 육백’이라는 어순을 현대 한국어 수 표현으로 자연스럽게 풀어 ‘칠만사천육백 명’으로 옮겼습니다.
