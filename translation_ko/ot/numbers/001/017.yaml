  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
  footnotes:
  - marker: a
    text: Or 'who had been named by name,' that is, 'who had been specifically identified.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론은 이름으로 지정된 이 사람들[a]을 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이름으로 불린’, 곧 ‘특별히 특정된’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데려갔습니다
  alternatives_korean:
  - 받아들였습니다
  - 취했습니다
  - 데리고 갔습니다
  lexicon: HALOT
  rationale: 문맥상 이미 지명된 사람들을 모세와 아론이 데리고 가는 행위를 자연스럽게 드러내면서, 단순한 ‘취하다’보다 현대 한국어로 더 분명하게 전달합니다.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: these men
  chosen_korean: 이 사람들
  alternatives_korean:
  - 이 남자들
  - 이들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형이지만, 앞뒤 문맥에서 특정 대표자들을 가리키는 집합적 표현이므로 한국어에서는 덜 성별을 강조하는 ‘이 사람들’이 자연스럽습니다.
- source_word: נִקְּבוּ בְּשֵׁמוֹת
  english_pob_choice: had been designated by name
  chosen_korean: 이름으로 지정된
  alternatives_korean:
  - 이름으로 불린
  - 이름으로 지명된
  - 이름으로 명시된
  lexicon: HALOT
  rationale: נִקְּבוּ בְּשֵׁמוֹת은 단순히 ‘이름이 있었다’가 아니라 공식적으로 특정되어 지목된 뜻을 가지므로, ‘지정된’이 행정적·선정적 뉘앙스를 가장 잘 살립니다.
theological_decisions:
- issue: 지명/선정 표현의 뉘앙스
  chosen_reading: ‘이름으로 지정된’으로 옮겨, 단순 호명보다 앞선 맥락에서 공식적으로 특정된 사람들임을 드러냈습니다.
  alternative_readings:
  - ‘이름으로 불린’으로 완화하는 읽기
  - ‘지명된’으로 더 행정적으로 읽는 방식
  rationale: 본문은 출애굽기 이후의 인구조사·대표자 선발 문맥 안에서 특정 인물을 공적으로 식별하는 장면이므로, 선택과 식별의 의미를 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 민수기 1장 인구조사 및 지파 대표 선출 문맥
