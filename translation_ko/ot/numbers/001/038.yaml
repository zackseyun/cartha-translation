id: NUM.1.38
reference: Numbers 1:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
  footnotes:
  - marker: a
    text: Or 'every one fit for military service.' The Hebrew idiom literally speaks of going out to war.
    reason: lexical_alternative
translation:
  language: ko
  text: 단 지파의 아들들은 그들의 세대에 따라, 그들의 씨족에 따라, 그들의 조상의 집안에 따라, 이름의 수를 따라, 곧 스무 살 이상으로 전쟁에 나갈 수 있는 모든 남자였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי דָן
  english_pob_choice: For the sons of Dan
  chosen_korean: 단 지파의 아들들은
  alternatives_korean:
  - 단의 아들들을 위하여
  - 단의 자손들은
  lexicon: HALOT
  rationale: 문맥상 지파 목록의 머리말이므로, '아들들'을 유지하되 한국어에서는 소속을 자연스럽게 드러내기 위해 '단 지파의 아들들'로 옮겼습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대에 따라
  alternatives_korean:
  - 그들의 계보에 따라
  - 그들의 نسل에 따라
  lexicon: HALOT
  rationale: 이 표현은 단순한 출생 연대가 아니라 혈통/계보 구분을 가리키므로, 공문체에 맞게 '세대'로 처리하되 분류의 기능을 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가문에 따라
  - 그들의 종족별로
  lexicon: HALOT
  rationale: 이스라엘의 지파 조직에서 מִשְׁפָּחָה는 단순한 가족보다 큰 친족 단위를 가리키므로, 구별성을 살려 '씨족'으로 옮겼습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상의 집안에 따라
  alternatives_korean:
  - 그들의 아버지들의 집안에 따라
  - 그들의 부계 집안에 따라
  lexicon: HALOT
  rationale: 기술적 친족 용어를 한국어에서 이해 가능한 형태로 옮기되, 혈통 중심 구조를 드러내기 위해 '조상의 집안'을 택했습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: according to the number of names
  chosen_korean: 이름의 수를 따라
  alternatives_korean:
  - 이름의 수에 따라
  - 기록된 이름의 수를 따라
  lexicon: HALOT
  rationale: 히브리어의 관용적 계수 표현을 너무 풀지 않고, 인명 단위의 계수를 보여 주도록 직역에 가깝게 처리했습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every male able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 남자였습니다
  alternatives_korean:
  - 군역에 나설 수 있는 모든 남자였습니다
  - 전투에 나갈 수 있는 모든 남자였습니다
  lexicon: HALOT
  rationale: יוֹצֵא צָבָא의 직역인 '전쟁에 나가다'를 유지해 군사적 선발 기준을 분명히 했고, 문맥상 남성 대상이므로 '남자'로 분명히 했습니다.
theological_decisions:
- issue: 지파 계수의 기술적·군사적 언어
  chosen_reading: 전쟁에 나갈 수 있는 모든 남자
  alternative_readings:
  - 군역에 나설 수 있는 모든 남자
  - 전투에 나갈 수 있는 모든 사람
  rationale: 본문은 단순 인구조사가 아니라 군사 동원 가능한 남성의 계수라는 점을 드러내므로, 완곡하게 중화하지 않고 원문의 기능을 유지했습니다.
  doctrine_reference: Numbers 1장의 계수 문맥 및 POB 번역 원칙 §4
