base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
  footnotes:
  - marker: a
    text: Or 'every one fit for military service.' The Hebrew idiom literally speaks of going out to war.
    reason: lexical_alternative
translation:
  language: ko
  text: '단의 아들들에 대해서는, 그들의 계보와 씨족과 조상의 집안에 따라, 이름의 수에 따라, 스무 살 이상인 전쟁에 나갈 수 있는[a] 모든 남자:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군역에 적합한 모든 남자’. 히브리어 관용구는 직역하면 ‘전쟁에 나가는 모든 남자’입니다.
    reason: כָּל יֹצֵא צָבָא는 군사 복무 대상자를 가리키는 관용적 표현이며, 본문의 직역적 표현과 기능적 의미를 함께 제시합니다.
