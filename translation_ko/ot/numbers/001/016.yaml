reference: Numbers 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
  footnotes:
  - marker: a
    text: Or “those summoned from the assembly.” The Hebrew participle can denote those called, summoned, or designated.
    reason: lexical_alternative
  - marker: b
    text: “Thousands of Israel” may refer literally to groups of a thousand, or more broadly to clan or military subdivisions within Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 회중에서 부름받은 이들이며[a], 그들 조상의 지파 지도자들이고, 이스라엘의 천인 단위들의 우두머리들이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 ‘부름받은 이들’, ‘소집된 이들’, 또는 ‘지정된 이들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘천인 단위들’은 문자적으로 천 명으로 이루어진 집단을 가리킬 수도 있고, 이스라엘 안의 씨족이나 군사적 하위 단위를 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קריאי הָעֵדָה
  english_pob_choice: the ones called from the congregation
  chosen_korean: 회중에서 불린 자들
  alternatives_korean:
  - 회중에서 소집된 자들
  - 회중에서 부름받은 자들
  - 회중의 불린 자들
  lexicon: HALOT
  rationale: קרא의 수동 분사 의미를 살려 ‘불린 자들’로 옮기되, 출애굽기·민수기 문맥의 회중을 ‘회중’으로 유지했습니다.
- source_word: נְשִׂיאֵי
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 수장들
  - 두목들
  - 지도자
  lexicon: HALOT
  rationale: 지파/행정 문맥의 נָשִׂיא는 권위를 지닌 대표자들이므로, 현대 한국어에서 자연스럽고 격식 있는 ‘지도자들’로 옮겼습니다.
- source_word: מַטּוֹת אֲבוֹתָם
  english_pob_choice: their fathers’ tribes
  chosen_korean: 그들의 조상의 지파들
  alternatives_korean:
  - 그들의 아버지들의 지파들
  - 조상들의 지파들
  - 그 조상들의 지파들
  lexicon: HALOT
  rationale: ‘아버지들’의 직역보다 혈통·조상 계열을 드러내는 ‘조상의 지파들’이 한국어에서 더 자연스럽고, 소유 관계도 보존합니다.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  english_pob_choice: the heads of the thousands of Israel
  chosen_korean: 이스라엘의 천 명 단위들의 수장들
  alternatives_korean:
  - 이스라엘의 수천의 수장들
  - 이스라엘의 천 부대들의 수장들
  - 이스라엘의 천인 단위들의 수장들
  lexicon: HALOT
  rationale: אֶלֶף의 ‘천’과 ‘군집/단위’의 폭넓은 가능성을 보존하기 위해, 확정 해석 대신 ‘천 명 단위들’로 남겨 범주적 의미를 열어 두었습니다.
theological_decisions:
- issue: 민수기의 민간/군사 행정 단위 해석
  chosen_reading: ‘천 명 단위들’로 옮겨, 문자적 ‘천’과 지파-군사적 하위 단위 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - ‘천 사람들’로 직역
  - ‘천 부대들’로 해석
  rationale: 본문의 אֶלֶף는 실제 인원수일 수도, 더 넓은 집단 단위일 수도 있어, 한 가지 제도로 단정하지 않는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: Numbers 1:16 census/tribal organization context
- issue: ‘불린 자들’의 수동적 호칭
  chosen_reading: ‘회중에서 불린 자들’로 수동성을 유지해, 이들이 스스로 자천한 사람이 아니라 부름받아 지정된 대표자임을 드러냈습니다.
  alternative_readings:
  - ‘선택된 자들’
  - ‘소집된 자들’
  rationale: 히브리어 분사 קריאי의 핵심은 부름받은 상태이므로, 선출의 신학을 과도하게 덧씌우지 않으면서 지정/소집의 의미를 살렸습니다.
  doctrine_reference: Lexical-theological caution on קרא passive participle
