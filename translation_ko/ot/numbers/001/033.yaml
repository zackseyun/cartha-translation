  chosen_korean: 사만오천 명
  alternatives_korean:
  - 4만 5백 명
  - 사십만 오천 명
  lexicon: HALOT
  rationale: 히브리어 수사는 그대로 합산해 ‘사만오천’으로 옮기고, 인구 계수 문맥이므로 단위를 ‘명’으로 밝혔습니다.
