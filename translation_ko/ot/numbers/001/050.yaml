  verdict: revise
  source_fidelity: 원문의 הַפְקֵד는 레위인들에게 성막과 그 부속물을 맡겨 책임지게 하라는 명령입니다. ‘…위에 임명하십시오’는 עַל의 책임 범위를 직역적으로 따르려 하나 한국어에서는 부자연스럽고, 마치 성막보다 상위의 직위에 임명한다는 뜻으로 들릴 수 있습니다. ‘레위인들에게 … 맡기십시오’가 위임·관리 책임의 뜻을 정확히 전달합니다. יִשְׂאוּ는 이동 시 성막과 기구들을 지는/운반하는 일을 가리키므로 ‘운반해야’가 분명합니다. יְשָׁרְתֻהוּ는 성막에 관련하여 수행하는 제의적 봉사이며, 자연스러운 한국어로는 ‘성막에서 봉사해야’가 적절합니다.
  naturalness: 합쇼체 명령문과 레위인들의 의무를 나타내는 ‘-해야 합니다’가 조화됩니다. 각주 표지는 해당 어구 바로 뒤에 두어 참조 범위를 분명히 해야 합니다. ‘성막 위에 임명하다’와 ‘성막을 섬기다’는 현대 표준 한국어에서 어색하므로 수정이 필요합니다.
  terminology: ‘레위인’, ‘증거의 성막’, ‘기구’, ‘진을 치다’는 본문과 성막 문맥에 적합합니다. ‘증거의 성막’은 유지하되, מִשְׁכָּן의 가능한 대안인 ‘증거의 장막’을 각주에 제시합니다. שרת의 성소 봉사 의미는 ‘성막에서 봉사하다’ 및 각주로 보존합니다.
  issues:
