revisions:
- from: 그러나 당신은 레위인들을 증거의 성막과 그 모든 기구와 그에 속한 모든 것 위에 임명하십시오. 그들은 성막과 그 모든 기구를 메어야 하고, 그것을 섬겨야 하며, 성막 주위에 진을 쳐야 합니다.[a][b]
  to: 그러나 당신은 레위인들에게 증거의 성막[a]과 그 모든 기구와 그에 속한 모든 것을 맡기십시오. 그들은 성막과 그 모든 기구를 운반해야 하고, 성막에서 봉사해야 하며[b], 성막 주위에 진을 쳐야 합니다.
  rationale: 책임 위임을 나타내는 히브리어 구문을 한국어의 자연스러운 ‘맡기십시오’로 옮겼고, 성막과 기구의 이동 임무는 ‘운반하다’로 명확히 했습니다. 성소 관련 봉사의 의미는 보존하면서 한국어에서 어색한 무생물 직접목적어 구문을 피하기 위해 ‘성막에서 봉사하다’로 조정했습니다. 각주 표지는 설명하는 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:09:02Z'
