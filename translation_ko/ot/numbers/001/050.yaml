    rationale: 히브리어 עַל은 책임의 대상을 표시하지만, 한국어 ‘A를 B 위에 임명하다’는 자연스럽지 않고 의미 관계도 불명확합니다. ‘레위인들에게 B를 맡기십시오’가 위임과 책임의 뜻을 정확하고 자연스럽게 표현합니다.
