  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
  footnotes:
  - marker: a
    text: Or 'tent of the testimony.' The Hebrew מִשְׁכַּן can denote a dwelling/tabernacle, and some English versions render the phrase more explicitly as 'tent of meeting/testimony' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'serve it' or 'attend to it.' The verb carries the sense of ministering in a sacred-service context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 레위인들을 증거의 성막과 그 모든 기구와 그에 속한 모든 것 위에 임명하십시오. 그들은 성막과 그 모든 기구를 메어야 하고, 그것을 섬겨야 하며, 성막 주위에 진을 쳐야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거의 성막’은 히브리어 מִשְׁכַּן הָעֵדֻת의 직역입니다. 문맥에 따라 ‘증거의 장막’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것을 섬겨야 하며’는 히브리어 동사의 제의적 봉사 의미를 살린 번역입니다. ‘그것을 봉사해야 하며’ 또는 ‘그것을 돌봐야 하며’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְקֵד
  english_pob_choice: appoint
  chosen_korean: 임명하십시오
  alternatives_korean:
  - 맡기십시오
  - 지정하십시오
  - 배치하십시오
  lexicon: HALOT
  rationale: 히필 명령형은 단순한 배치보다 책임을 부여하는 위임의 뉘앙스를 지니므로, 공적·행정적 명령을 살리는 ‘임명하십시오’가 적절합니다.
- source_word: מִשְׁכַּן הָעֵדֻת
  english_pob_choice: the tabernacle of the testimony
  chosen_korean: 증거의 성막
  alternatives_korean:
  - 증거의 장막
  - 증언의 성막
  - 증거의 회막
  lexicon: HALOT
  rationale: מִשְׁכַּן은 이 문맥에서 성막의 기술 용어이고, הָעֵדֻת는 그 성막이 지닌 ‘증거’와의 결합을 가리키므로 직역적이면서도 자연스러운 ‘증거의 성막’으로 옮겼습니다.
- source_word: כֵּלָיו
  english_pob_choice: its furnishings
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 furnishings
  - 그 모든 용구
  - 그 모든 집기
  lexicon: HALOT
  rationale: 광야 성막의 예배 도구들을 포괄하는 말이므로, 현대 한국어에서 넓은 범위를 담는 ‘기구’를 쓰고 ‘그 모든’으로 총체성을 살렸습니다.
- source_word: יְשָׁרְתֻהוּ
  english_pob_choice: minister to it
  chosen_korean: 그것을 섬겨야 하며
  alternatives_korean:
  - 그것을 시중들어야 하며
  - 그것을 봉사해야 하며
  - 그것을 돌봐야 하며
  lexicon: HALOT
  rationale: 성막 봉사라는 제의적 의미를 살리되, 한국어에서 자연스럽고 교회적 오해를 덜 불러오는 동사로 ‘섬기다’를 선택했습니다.
- source_word: יַחֲנוּ
  english_pob_choice: they are to camp
  chosen_korean: 진을 쳐야 합니다
  alternatives_korean:
  - 장막을 쳐야 합니다
  - 캠프해야 합니다
  - 머물러야 합니다
  lexicon: HALOT
  rationale: 군사적·공동체적 배치까지 포함하는 광야 진영 표현이므로, 성서적이면서도 현대 문체에 맞는 ‘진을 치다’로 옮겼습니다.
theological_decisions:
- issue: 레위인의 배치와 성막 봉사에 대한 명령문 톤
  chosen_reading: 명령형을 살린 직접 지시로 번역했습니다.
  alternative_readings:
  - 완곡한 서술형으로 바꾸기
  - 권고형으로 약화하기
  rationale: 본문은 모세에게 주는 직접 명령이므로, 한국어에서도 지시의 힘을 유지하는 것이 원문의 의미와 긴장을 가장 잘 보존합니다.
  doctrine_reference: 출애굽기-민수기의 성막 질서와 레위인의 위임 구조
- issue: ‘섬기다’의 제의적 의미
  chosen_reading: 성막 봉사라는 제의적 맥락을 드러내는 ‘섬기다’를 선택했습니다.
  alternative_readings:
  - ‘봉사하다’
  - ‘시중들다’
  - ‘돌보다’
  rationale: 본문의 שרת는 단순한 일반 봉사가 아니라 성소 안팎의 제의적 섬김을 가리키므로, 한국어에서도 그 종교적 뉘앙스를 유지해야 합니다.
  doctrine_reference: 성소 봉사의 언어는 일반 노동보다 거룩한 임무를 가리킴
