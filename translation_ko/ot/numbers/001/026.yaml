    issue: ‘그들의 대에 따라’
    rationale: ‘대’는 한국어에서 세대 또는 시대를 주로 뜻하여, 여기서의 계보적 분류를 충분히 전달하지 못합니다.
  - severity: medium
    issue: ‘그들의 종족에 따라’
    rationale: ‘종족’은 보통 민족·인종 또는 더 큰 집단을 뜻합니다. 지파 내부 하위 단위인 מִשְׁפָּחָה에는 ‘씨족’이 더 정확합니다.
  - severity: medium
    issue: ‘그들의 조상들의 집에 따라’
    rationale: 원문의 ‘아버지들의 집’은 부계 가문 단위라는 기술 용어입니다. 직역적 ‘조상들의 집’은 한국어에서 의미가 불명확하고 주거 의미로 오해될 수 있습니다.
  - severity: medium
    issue: ‘전쟁에 나갈 수 있는’ 및 각주의 ‘모든 사람’
    rationale: ‘나갈 수 있는’은 원문에 명시되지 않은 가능·자격을 본문에 추가합니다. 또한 각주의 ‘모든 사람’은 이 군사 인구조사의 남성 지시를 흐립니다.
