  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
  footnotes:
  - marker: a
    text: Or 'all who go out to war.' The Hebrew idiom refers to those eligible for military service.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 자손들에게, 그들의 대에 따라, 그들의 종족에 따라, 그들의 조상들의 집에 따라, 이름의 수대로, 스무 살 이상인 곧 전쟁에 나갈 수 있는 모든 남자를[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁에 나가는 모든 사람’. 히브리어 관용구는 군복무 자격이 있는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  english_pob_choice: For the sons of Judah
  chosen_korean: 유다 자손들에게
  alternatives_korean:
  - 유다의 아들들에게
  - 유다의 후손들에게
  lexicon: HALOT
  rationale: בני의 직역인 ‘아들들’보다는 족속 전체를 가리키는 문맥이어서 ‘자손들’이 자연스럽고, 출발점인 목록형 문장 구조를 한국어 조사로 살렸습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 대에 따라
  alternatives_korean:
  - 그들의 نسل에 따라
  - 그들의 계보에 따라
  lexicon: HALOT
  rationale: תולדות는 이 문맥에서 출생 계보라기보다 세대적 계승을 가리키므로, 직설적이면서도 한국어에서 이해되는 ‘대’로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 씨족에 따라
  lexicon: HALOT
  rationale: משפחה는 지파 내부의 하위 집단을 뜻하므로 ‘가족’보다 규모가 큰 ‘종족’이 더 가깝고, ‘씨족’은 현대 한국어에서 다소 낯설어 피했습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상들의 집에 따라
  alternatives_korean:
  - 그들의 아버지들의 집에 따라
  - 그들의 아버지 집안에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서 이해 가능하도록 ‘조상들의 집’으로 옮겨 부계 가문 단위를 드러냈습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: according to the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름들의 수에 따라
  - 이름의 숫자대로
  lexicon: HALOT
  rationale: 명단에 적힌 개인들을 이름별로 계수하는 표현이므로, 직역성을 유지하면서도 간결한 한국어 관용에 맞게 ‘이름의 수대로’로 옮겼습니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 남자를
  alternatives_korean:
  - 전쟁에 나가는 모든 남자를
  - 전투에 동원될 수 있는 모든 남자를
  lexicon: HALOT
  rationale: 관용구의 실제 뜻은 군역 가능자이므로 ‘전쟁에 나갈 수 있는’으로 명시했고, 문맥상 성인 남성 대상이라는 점을 반영해 ‘모든 남자’로 유지했습니다.
theological_decisions:
- issue: 군역 자격을 나타내는 관용구의 처리
  chosen_reading: 전쟁에 나갈 수 있는
  alternative_readings:
  - 전쟁에 나가는
  - 군대에 나가는
  rationale: 히브리어는 단순한 이동이 아니라 군복무 가능 자격을 가리키므로, 의미를 분명히 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
