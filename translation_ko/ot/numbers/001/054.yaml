translation:
  language: ko
  text: 이스라엘 자손[a]은 야훼께서 모세에게 명령하신 모든 것을 행하였습니다. 그들은 그대로 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자녀들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  english_pob_choice: did / they did
  chosen_korean: 행하였습니다 / 그대로 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 실행하였습니다
  - 행했습니다
  lexicon: HALOT
  rationale: עשה는 ‘하다’의 넓은 의미이므로, 결과적 순종을 드러내는 ‘행하다’로 옮겼고, 마지막 반복은 ‘그대로 행하였습니다’로 살려 강조를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  - 이스라엘 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 직역하면 ‘이스라엘 자손’이므로, POB의 성중립화 대신 원문 형식을 살렸습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all that
  chosen_korean: 모든 것대로
  alternatives_korean:
  - 모든 것에 따라
  - 전부를 따라
  - 모든 말씀대로
  lexicon: HALOT
  rationale: 명령의 범위를 포괄하는 표현이므로 ‘모든 것대로’로 간결하게 옮겨, 순종의 전면성을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 문맥의 신명사 יְהוָה는 칭호가 아니라 고유한 언약 이름이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 반복되는 결말 표현의 보존
  chosen_reading: ‘그대로 행하였습니다’로 마지막 կրկ를 살려, 단순 종결이 아니라 명령과 실행의 정확한 일치를 강조했습니다.
  alternative_readings:
  - 마침내 행하였습니다
  - 그리 행하였습니다
  - 그렇게 하였습니다
  rationale: 히브리어는 같은 동사를 반복해 순종의 확정성을 강조하므로, 이를 평평하게 만들지 않고 한국어에서도 반복으로 재현했습니다.
  doctrine_reference: 'POB translation philosophy: Maintain what the author meant for the audience to understand'
