id: NUM.1.18
reference: Numbers 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
  footnotes:
  - marker: a
    text: Or 'declared their ancestry' / 'enrolled themselves by genealogy'; the Hebrew verb is a rare genealogical expression indicating registration on the basis of descent.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by their heads' or 'by their skulls,' an idiom meaning each individual was counted one by one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 둘째 달 첫째 날에 온 회중을 모았고, 계보에 따라, 곧 그 조상의 집안별로, 이름의 수에 따라, 스무 살 이상인 자들을 머리수대로 등록하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계보에 따라’는 히브리어의 희귀한 족보적 표현을 반영한 것으로, 단순한 등록보다 혈통을 근거로 한 등재의 의미를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리수대로’는 문자적으로는 ‘머리/두개골대로’에 해당하는 관용구로, 각 사람을 하나씩 세었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  english_pob_choice: assembled
  chosen_korean: 모았고
  alternatives_korean:
  - 소집하였고
  - 집합시켰고
  lexicon: HALOT
  rationale: הִקְהִילוּ는 회중을 한데 모으는 동작이므로, 행정적이고 자연스러운 한국어인 ‘모았고’로 옮겼습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 공동체
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합체를 가리키므로, ‘회중’을 기본으로 하고 כָּל의 포괄성을 ‘온’으로 살렸습니다.
- source_word: וַיִּתְיַלְדוּ
  english_pob_choice: registered themselves
  chosen_korean: 계보에 따라
  alternatives_korean:
  - 자기 조상을 등록하였고
  - 족보를 따라 등록하였고
  lexicon: HALOT
  rationale: 이 동사는 단순 등록이 아니라 혈통/계보에 근거한 등재를 뜻하므로, 영어 POB의 주석 취지를 반영해 뒤의 표현과 함께 ‘계보에 따라’로 드러냈습니다.
- source_word: לְגֻלְגְּלֹתָם
  english_pob_choice: head by head
  chosen_korean: 머리수대로
  alternatives_korean:
  - 한 사람씩
  - 두상대로
  lexicon: HALOT
  rationale: 직역하면 ‘머리들/두개골들에 따라’이지만, 관용적 의미는 개인별 계수이므로 한국어 관용구 ‘머리수대로’로 의미와 이미지의 균형을 맞췄습니다.
theological_decisions:
- issue: 이스라엘 인구조사의 법적·언약적 성격
  chosen_reading: 이 구절은 단순 통계가 아니라 언약 공동체를 계보와 가문 단위로 정렬해 계수하는 장면으로 읽었습니다.
  alternative_readings:
  - 행정 절차 중심의 단순 인구조사
  - 군사 동원용 인원 파악
  rationale: 문맥상 ‘회중’, ‘조상의 집안’, ‘이름의 수’, ‘머리수대로’가 함께 나와 혈통과 공동체 질서를 드러내므로, 단순한 숫자 파악보다 언약적 조직화의 의미를 보존했습니다.
  doctrine_reference: 민수기 1장의 계수는 야훼의 백성을 질서 있게 세우는 언약적 행위로 이해됩니다.
