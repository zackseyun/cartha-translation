base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
  footnotes:
  - marker: a
    text: Hebrew literally, “every one going out to war,” an idiom for those eligible for military service.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 자손들에게는 그들의 세대별로, 그들의 씨족별로, 그들의 조상 가문별로, 이름 수대로, 스무 살 이상인 사람, 곧 군대에 나갈 수 있는 모든 남자가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘전쟁에 나가는 각 사람’이며, 군 복무 자격자를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  english_pob_choice: For the sons of Benjamin
  chosen_korean: 베냐민 자손들에게는
  alternatives_korean:
  - 베냐민의 아들들에게는
  - 베냐민의 자손들에게는
  lexicon: HALOT
  rationale: 지파 명단의 표제문 구조를 살리면서, 한국어에서는 조사 ‘-에게는’으로 도입해 열거문임을 자연스럽게 드러냈습니다. ‘자손’은 혈통·지파 소속을 모두 포괄합니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대별로
  alternatives_korean:
  - 그들의 نسل(세대)대로
  - 그들의 계보별로
  - 그들의 대대로
  lexicon: HALOT
  rationale: 이 용례는 출생·계보를 가리키는 족보적 분류이므로, 행정적 느낌의 ‘계보별로’보다 원문의 형식을 유지하는 ‘세대별로’를 택했습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 가문별로
  lexicon: HALOT
  rationale: 이 절의 מִשְׁפָּחָה는 단순 가족보다 큰 부족 내부 단위이므로, 한국어에서 혈연 집단을 드러내는 ‘씨족’이 가장 대응력이 높습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 아버지 집안별로
  - 그들의 부친 가문별로
  lexicon: HALOT
  rationale: 직역하면 ‘아버지들의 집’이지만 한국어에서는 불투명하므로, 가문·가계의 구조를 드러내는 ‘조상 가문’으로 옮겨 계층적 친족 단위를 보존했습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: according to the number of names
  chosen_korean: 이름 수대로
  alternatives_korean:
  - 이름의 수대로
  - 세어진 이름의 수에 따라
  - 이름의 개수에 따라
  lexicon: HALOT
  rationale: 인원 계수의 관용구를 간결하게 살려, ‘이름 수대로’로 옮겼습니다. 이는 명부에 오른 사람들을 하나씩 شمار하는 의미를 드러냅니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man able to go out to war
  chosen_korean: 군대에 나갈 수 있는 모든 남자가 있습니다
  alternatives_korean:
  - 전쟁에 나갈 수 있는 모든 남자가 있습니다
  - 군복무에 나갈 수 있는 모든 남자가 있습니다
  - 전쟁에 출정할 수 있는 모든 남자가 있습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘전쟁에 나가는 자’이지만, 이 문맥에서는 군사 징집 대상자라는 뜻이므로 ‘군대에 나갈 수 있는’으로 기능을 풀었습니다. ‘모든 남자’는 히브리어 남성 단수 집합을 반영합니다.
