translation:
  language: ko
  text: 그러나 레위인들은 그들의 조상 지파에 따라[a] 그들 가운데 계수되지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 아버지들의 지파에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 계수 문맥에서는 ‘등록되지 않았습니다’ 또는 ‘소집되지 않았습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: But the Levites
  chosen_korean: 그러나 레위인들은
  alternatives_korean:
  - 그리고 레위인들은
  - 또 레위인들은
  lexicon: HALOT
  rationale: 문맥상 앞선 열두 지파의 계수와 대비되므로 접속사 וְ를 역접으로 살려 ‘그러나’로 옮겼고, 지파 이름은 표준 음역인 ‘레위인’으로 유지했습니다.
- source_word: לְמַטֵּה אֲבֹתָם
  english_pob_choice: by their ancestral tribe
  chosen_korean: 그들의 아버지들의 지파에 따라
  alternatives_korean:
  - 그들의 조상들의 지파에 따라
  - 그들의 아버지 집의 지파에 따라
  lexicon: HALOT
  rationale: מַטֶּה는 인구조사 문맥에서 ‘지파’가 적절하고, אֲבֹתָם은 직역하면 ‘그들의 아버지들’이므로 혈통·조상 계통을 드러내는 표현으로 옮겼습니다.
- source_word: לֹא הָתְפָּקְדוּ
  english_pob_choice: were not counted
  chosen_korean: 계수되지 않았습니다
  alternatives_korean:
  - 등록되지 않았습니다
  - 소집되지 않았습니다
  lexicon: HALOT
  rationale: פעל의 반사형이 이 장의 인구조사 맥락에서 공식적인 계수/등록을 뜻하므로, 문맥에 가장 직접적인 ‘계수되다’를 사용했습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 사이에
  - 그들 안에
  lexicon: HALOT
  rationale: 포함 여부를 나타내는 בְּתוֹךְ의 뜻을 자연스러운 한국어로 살려, 다른 지파들과 함께 계수된 집단 속에 포함되지 않았음을 분명히 했습니다.
theological_decisions:
- issue: 레위인의 계수 예외를 어떻게 드러낼지
  chosen_reading: 레위인들은 다른 지파들과 동일한 인구조사 범주에 포함되지 않았다는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 레위인들은 따로 세었습니다.
  - 레위인들은 제외되었습니다.
  rationale: 원문은 단순한 누락이 아니라 지파 계수 체계에서 레위인이 별도 취급되었음을 말하므로, ‘계수되지 않았습니다’로 중립적이면서도 분명하게 표현했습니다.
  doctrine_reference: 민수기 1장의 성소 봉사 지파 구분
