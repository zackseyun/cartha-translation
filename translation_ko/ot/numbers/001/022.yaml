source:
  edition: WLC
  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
  footnotes:
  - marker: a
    text: Or “those mustered from them” for “those numbered of them”; the Hebrew participle from פקד can carry census or muster nuance in this military-count context.
    reason: lexical_alternative
  - marker: b
    text: Literally “by their skulls/heads,” an idiom meaning individual counting, rendered here as “head by head.”
    reason: cultural_note
  - marker: c
    text: Or “everyone fit for military service”; the Hebrew reads more literally, “everyone going out to war.”
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온 자손의 경우에는, 그들의 계보와 그들의 씨족과 그들의 조상의 집을 따라, 이름 수대로 머리마다 계수된 자들, 곧 스무 살 이상 된 모든 남자, 곧 전쟁에 나갈 수 있는 모든 사람입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פקד는 이 군사적 계수 문맥에서 ‘계수된 자들’ 또는 ‘소집된 자들’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리마다’는 문자적으로는 ‘머리/두개골에 따라’라는 관용으로, 개별 단위로 셈함을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘전쟁에 나가는 모든 사람’이며, 문맥상 군사 복무 가능자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  english_pob_choice: For the sons of Simeon
  chosen_korean: 시므온 자손의 경우에는
  alternatives_korean:
  - 시므온의 아들들에게
  - 시므온의 후손들에게
  lexicon: HALOT
  rationale: 지파 명부의 공식 문맥에서 ‘sons’는 개인 아들보다 시조 시므온에 속한 지파 구성원을 가리키므로 ‘자손’이 자연스럽고 정확합니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 계보와
  alternatives_korean:
  - 그들의 세대에 따라
  - 그들의 족보에 따라
  lexicon: HALOT
  rationale: 족보·인구조사 맥락에서 תולדות는 ‘세대/계보’의 줄기를 뜻하므로, 행정적 의미를 살려 ‘계보’로 옮겼습니다.
- source_word: פְּקֻדָיו בְּמִסְפַּר שֵׁמוֹת לְגֻלְגְּלֹתָם
  english_pob_choice: those numbered of them, by the number of names, head by head
  chosen_korean: 이름 수대로 머리마다 계수된 자들
  alternatives_korean:
  - 이름의 수에 따라 머리마다 셈된 자들
  - 이름 수대로 각각 계수된 자들
  lexicon: HALOT
  rationale: פקד의 계수/소집 의미와 ‘머리마다’의 관용을 함께 살려, 단순 인원 집계를 넘는 명단형 조사를 한국어로 드러냈습니다.
- source_word: כָּל יֹצֵא צָבָא
  english_pob_choice: everyone going out to war
  chosen_korean: 전쟁에 나갈 수 있는 모든 사람입니다
  alternatives_korean:
  - 전쟁에 나가는 모든 사람입니다
  - 군복무에 나갈 수 있는 모든 사람입니다
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁에 나가는’이지만, 한국어에서는 자격/동원 가능성을 자연스럽게 드러내는 ‘나갈 수 있는’이 문맥에 맞습니다.
theological_decisions:
- issue: 민수기 인구조사의 군사적 성격
  chosen_reading: ‘전쟁에 나갈 수 있는’으로 옮겨, 단순한 연령 집계가 아니라 군사 동원 가능한 남자를 세는 본문임을 드러냈습니다.
  alternative_readings:
  - ‘군복무에 적합한’
  - ‘전쟁에 나가는’
  rationale: 히브리어 יֹצֵא צָבָא는 문자적으로 ‘군대로 나가는’이지만, 이 장 전체의 계수 목적상 군사적 자격을 함께 보이게 하는 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 민수기 1장의 지파별 군사 계수 맥락
