id: NUM.1.24
reference: Numbers 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Gad.' The expression refers to the male tribal members being counted in the census.
    reason: cultural_note
  - marker: b
    text: Or 'according to their families' for 'by their clans.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'every one going out to war' or 'every one going out to military service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갓의 아들들은, 그들의 세대별로, 그들의 종족별로, 그들의 조상 가문별로, 이름의 수대로, 곧 스무 살 이상인 모든 전쟁에 나갈 수 있는 자들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘갓의 아들들’입니다. 인구조사에서는 지파의 남성 구성원을 가리킵니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그들의 가족별로’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘전쟁에 나가는 자들’ 또는 ‘군역에 나가는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  english_pob_choice: For the sons of Gad
  chosen_korean: 갓의 아들들은
  alternatives_korean:
  - 갓의 자손들은
  - 갓 사람들은
  lexicon: HALOT
  rationale: 지파 명단의 표제 공식이므로 소속을 드러내되, 히브리어 관용구를 살려 ‘아들들’로 옮겼습니다. 인구조사 문맥에서 남성 구성원을 가리키는 점은 주석 없이도 자연스럽게 읽히게 했습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대별로
  alternatives_korean:
  - 그들의 نسل별로
  - 그들의 계보별로
  lexicon: HALOT
  rationale: 여기서는 혈통/세대 구분의 공식 표현이므로, ‘계보’보다 덜 과도하게 문서화된 느낌의 ‘세대별로’를 택해 문맥의 분류 기준을 살렸습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 씨족별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: 히브리어의 친족 하위 단위를 가리키므로, 현대 한국어에서 오해를 줄이기 위해 ‘가족’보다 큰 단위의 ‘종족’으로 옮겼습니다. 다만 혈연 집단이라는 점은 유지했습니다.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  english_pob_choice: according to the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름의 수에 따라
  - 이름의 숫자대로
  lexicon: HALOT
  rationale: 개별 이름을 따라 계수했다는 뜻을 간명하게 드러내기 위해 직역에 가까운 표현을 선택했습니다. ‘숫자’보다 ‘수’가 더 성경 문체에 맞습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살 이상인
  alternatives_korean:
  - 스무 살부터 그 이상인
  - 스무 살이 넘은
  lexicon: HALOT
  rationale: 연령 기준을 자연스러운 한국어로 옮기되, census formula의 공식성을 유지했습니다. ‘이상인’이 가장 중립적입니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man able to go out to war
  chosen_korean: 모든 전쟁에 나갈 수 있는 자들이었습니다
  alternatives_korean:
  - 모든 전쟁에 나가는 자들이었습니다
  - 군역에 나갈 수 있는 모든 자들이었습니다
  lexicon: HALOT
  rationale: 단순 이동이 아니라 군사 복무 가능자를 뜻하므로, POB의 해설을 반영해 ‘전쟁에 나갈 수 있는’으로 풀었습니다. ‘자들’은 집합적 명단 어조를 살립니다.
theological_decisions:
- issue: 인구조사 표제의 남성 지칭을 어떻게 드러낼지
  chosen_reading: 지파의 남성 구성원을 지칭하는 공식 문구로 읽되, 본문에서는 과도한 성별 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘갓의 자손들’로 넓게 번역해 성중립적으로 만들기
  - 주석으로만 남성 지칭을 설명하기
  rationale: 원문과 POB는 인구조사 대상이 군역 가능 남성임을 전제합니다. 한국어 본문은 그 사실을 자연스럽게 드러내면서도, 본문 내부에서 해설을 과잉 추가하지 않는 쪽이 원문 정보량에 충실합니다.
  doctrine_reference: 민수기 1장 인구조사 문맥
- issue: כֹּל יֹצֵא צָבָא의 의미 범위를 어떻게 처리할지
  chosen_reading: 군사 복무 가능성을 뜻하는 표현으로 번역했습니다.
  alternative_readings:
  - ‘전쟁에 나가는 모든 사람’으로 문자적으로 옮기기
  - ‘군역에 합당한 모든 사람’으로 제도적 의미를 강조하기
  rationale: 히브리어 관용구는 단순한 ‘출정’이 아니라 군사 동원 가능자 범주를 가리킵니다. 따라서 전쟁/군역 의미를 분명히 하되, 한국어 문장 흐름을 해치지 않게 했습니다.
  doctrine_reference: 민수기 1:24의 군역 연령 기준
