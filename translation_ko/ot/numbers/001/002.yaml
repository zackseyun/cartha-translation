id: NUM.1.2
reference: Numbers 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
  footnotes:
  - marker: a
    text: Literally, 'lift up the head of'; that is, count or enroll for a census.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Literally, ''head by head.'' Hebrew: ''by their skulls/heads,'' an idiom for counting individuals one at a time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손의 온 회중을[a] 그들의 가문별로, 조상 집안별로, 이름의 수에 따라, 모든 남자를 한 사람씩 계수하십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘머리를 들어 올리다’이며 여기서는 계수하거나 등록하라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘그들의 머리들에 따라’입니다. 곧 사람을 하나씩 세는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  english_pob_choice: Take a census
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 인구 조사를 하십시오
  - 머리를 세십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘머리를 들어 올리다’이지만, 행정적 문맥에서는 공식적인 조사·등록을 뜻하므로 한국어에서는 간결하고 정확한 ‘계수하십시오’가 가장 잘 맞습니다.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the whole congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 자손의 온 공동체
  - 이스라엘의 모든 자손
  lexicon: HALOT
  rationale: עֵדָה는 단순한 집합이 아니라 함께 모인 공동체를 가리키므로 ‘회중’을 유지했습니다. בְּנֵי יִשְׂרָאֵל은 직역성을 살려 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָם לְבֵית אֲבֹתָם
  english_pob_choice: by their clans, by their fathers’ houses
  chosen_korean: 그들의 가문별로, 그들의 조상 집별로
  alternatives_korean:
  - 그들의 종족별로, 그들의 아버지의 집별로
  - 그들의 가족별로, 그들의 조상 집안별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 부족 내부의 친족 단위를 가리켜 ‘가문’이 적절하고, בֵּית אֲבֹת은 부계 중심의 하우스 구조를 드러내므로 ‘조상 집’으로 옮겨 원문의 사회 구조를 보존했습니다.
- source_word: בְּמִסְפַּר שֵׁמוֹת כָּל זָכָר
  english_pob_choice: according to the number of names, every male
  chosen_korean: 이름의 수대로, 모든 남자를
  alternatives_korean:
  - 이름 수대로, 모든 남자를
  - 이름의 수에 따라, 모든 남자를
  lexicon: HALOT
  rationale: שֵׁמוֹת은 등록된 이름들의 수를 가리키므로 ‘이름의 수대로’가 행정적 표현을 잘 살립니다. זָכָר는 성별을 나타내는 말이므로 ‘남자’로 옮겼습니다.
- source_word: לְגֻלְגְּלֹתָם
  english_pob_choice: head by head
  chosen_korean: 머리 수대로
  alternatives_korean:
  - 한 사람씩
  - 머리마다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 두개골/머리로’라는 관용구이므로, 개별 인원 단위 계수를 드러내는 동시에 한국어로 자연스러운 ‘머리 수대로’를 선택했습니다.
theological_decisions:
- issue: 인구조사 명령의 어조
  chosen_reading: 명령형으로 직접 옮겨, 공동체 전체를 행정적으로 계수하라는 하나님의 지시임을 분명히 했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘조사를 하게 됩니다’로 옮기기
  - 부드러운 요청형으로 바꾸기
  rationale: 본문은 단순 정보 전달이 아니라 모세에게 주어진 직접 명령이므로, 명령의 힘을 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 민수기 1장의 언약 공동체 조직과 인원 계수
- issue: ‘회중’과 ‘가문/조상 집’의 사회적 구조
  chosen_reading: 이스라엘을 추상적 집단이 아니라 회중-가문-조상 집이라는 실제 공동체 단위로 제시했습니다.
  alternative_readings:
  - ‘교회’ 같은 후대적 용어 사용
  - ‘가족’으로 평탄화
  rationale: 본문은 출애굽 후 이스라엘의 질서와 소속 구조를 보여 주므로, 후대 교회 용어나 지나친 평준화를 피해야 합니다.
  doctrine_reference: 구약의 언약 공동체와 족장적 혈통 구조
