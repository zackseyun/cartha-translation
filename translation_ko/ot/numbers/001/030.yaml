  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
  footnotes:
  - marker: a
    text: Or 'fit for military service.' The Hebrew idiom is literally 'going out to war.'
    reason: lexical_alternative
translation:
  language: ko
  text: '스불론 자손은 그들의 계보대로, 그들의 종족대로, 그들의 조상 가문대로, 이름의 수에 따라, 스무 살 이상으로 전쟁에 나갈 수 있는[a] 모든 남자입니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 “전쟁에 나가는”입니다. 문맥상 군역에 나갈 수 있는 사람을 가리킵니다.
    reason: lexical_alternative
