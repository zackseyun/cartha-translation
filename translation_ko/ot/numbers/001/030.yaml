  - 스무 살 이상인 모든 남성
  rationale: 히브리어 문맥은 명시적으로 군역 대상 남성을 가리키므로, 성별 표지를 지우지 않고 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy 4
