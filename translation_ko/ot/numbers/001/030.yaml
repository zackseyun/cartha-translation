base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
  footnotes:
  - marker: a
    text: Or 'fit for military service.' The Hebrew idiom is literally 'going out to war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스불론의 아들들에게는 그들의 세대와 그들의 종족과 그들의 조상들의 집을 따라, 이름의 수대로, 스무 살 이상인 모든 남자, 곧 전쟁에 나갈 수 있는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “전쟁에 나가는”이라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  english_pob_choice: For the sons of
  chosen_korean: 스불론의 아들들에게는
  alternatives_korean:
  - 스불론의 자손들에게는
  - 스불론 자손에게는
  lexicon: WLC context / census formula
  rationale: 지파 목록의 표제문이므로 소속 관계를 자연스럽게 드러내는 조사형으로 옮겼습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대
  alternatives_korean:
  - 그들의 نسل
  - 그들의 نسل대로
  - 그들의 계보
  lexicon: HALOT
  rationale: 문맥상 혈통적 분류를 가리키지만, 한국어에서는 '세대'가 가장 자연스럽게 계보적 의미를 전달합니다.
- source_word: מִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족
  alternatives_korean:
  - 그들의 가족들
  - 그들의 씨족
  - 그들의 가문들
  lexicon: HALOT
  rationale: 지파 내부의 하위 친족 단위를 가리키므로, 단순한 '가족'보다 넓고 공식적인 '종족'이 적절합니다.
- source_word: בֵּית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상들의 집
  alternatives_korean:
  - 그들의 아버지들의 집
  - 그들의 족장 집안
  - 그들의 조상 집안
  lexicon: HALOT
  rationale: 인구 조사와 족보 문맥의 기술적 표현을 살리기 위해 직역에 가까운 형태를 유지했습니다.
- source_word: בְּמִסְפַּר שֵׁמֹת
  english_pob_choice: according to the number of names
  chosen_korean: 이름의 수대로
  alternatives_korean:
  - 이름 수대로
  - 이름의 개수대로
  - 명수대로
  lexicon: HALOT
  rationale: 개인을 명단으로 계수하는 관용구이므로, 행정적·명부적 뉘앙스를 살려 간결하게 옮겼습니다.
- source_word: יֹצֵא צָבָא
  english_pob_choice: every man able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 자들
  alternatives_korean:
  - 전쟁에 나가는 자들
  - 군무에 적합한 자들
  - 군사 복무에 합당한 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 본뜻은 군복무 자격자이지만, 직역성도 유지하기 위해 '전쟁에 나갈 수 있는'으로 풀었습니다.
theological_decisions:
- issue: 남성 군사 인구조사의 성별 표지
  chosen_reading: 스무 살 이상인 모든 남자
  alternative_readings:
