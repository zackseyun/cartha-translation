  source_fidelity: ‘군대에 나갈 수 있는’은 원문의 분사구 ‘전쟁에/군대에 나가는’을 해설적으로 바꾸며, 본문의 ‘곧’도 원문에 없는 동격 관계를 덧붙입니다. 또한 이 절은 민수기 인구조사 공식의 일부이므로, 원문의 군사적 관용구는 본문에서 보존하고 적격성의 함의는 각주에서 설명하는 편이 적절합니다.
  naturalness: 현재 문장의 ‘…모든 사람입니다’는 앞선 ‘아셀의 아들들은’과 결합할 때 다소 부자연스럽고, ‘세대별로’는 כאן의 계보적·혈통적 분류를 충분히 드러내지 못합니다. ‘계통대로’와 ‘조상들의 집안대로’가 현대 한국어에서 자연스럽고 원문의 반복 구조도 유지합니다.
