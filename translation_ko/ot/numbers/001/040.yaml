  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
  footnotes:
  - marker: a
    text: Hebrew literally, 'every going out to war,' an idiom for those eligible for military service.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀 자손은 그들의 계통대로, 씨족대로, 조상들의 집안대로, 이름의 수에 따라, 스무 살 이상으로서 전쟁에 나갈 모든 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘전쟁에 나가는 모든 사람’이며, 이 인구 조사 문맥에서는 병역 대상자를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  english_pob_choice: For the sons of Asher
  chosen_korean: 아셀의 아들들은
  alternatives_korean:
  - 아셀의 자손들은
  - 아셀의 아들들에게
  lexicon: HALOT
  rationale: 지파 표지 공식으로서 ‘아들들’의 혈통적·지파적 표현을 살리되, 한국어에서는 소유격 구조로 자연스럽게 옮겼습니다.
- source_word: תּוֹלְדֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 세대별로
  alternatives_korean:
  - 그들의 نسل별로
  - 그들의 계보대로
  lexicon: HALOT
  rationale: 문맥상 출생 계통의 구분을 가리키므로, 지나치게 설명적인 ‘계보’보다 반복되는 행정 공식성을 보존하는 ‘세대별로’를 택했습니다.
- source_word: לְמִשְׁפְּחֹתָם לְבֵית אֲבֹתָם
  english_pob_choice: by their clans, by their fathers’ houses
  chosen_korean: 그들의 씨족별로, 그들의 조상 가문별로
  alternatives_korean:
  - 그들의 가족별로, 그들의 아버지의 집별로
  - 그들의 부족 단위별로, 그들의 조상 집안별로
  lexicon: HALOT
  rationale: ‘clans’는 한국어 ‘씨족’이 가장 정확하고, ‘fathers’ houses’는 직역보다 의미가 분명한 ‘조상 가문’이 한국어 독자에게 구조를 잘 드러냅니다.
- source_word: כֹּל יֹצֵא צָבָא
  english_pob_choice: every man going out to war
  chosen_korean: 곧 군대에 나갈 수 있는 모든 사람입니다
  alternatives_korean:
  - 전쟁에 나가는 모든 사람입니다
  - 군복무에 나갈 수 있는 모든 사람입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 풀어 뜻을 분명히 하되, 단순한 전투 참가만이 아니라 병역 적격자를 가리키는 행정적 의미를 살렸습니다.
theological_decisions:
- issue: צָבָא를 전투 자체로 볼지, 군역 적격자 공식으로 볼지
  chosen_reading: 민수기 인구 조사 공식의 병역 대상자 표지로 읽어 ‘군대에 나갈 수 있는’으로 옮겼습니다.
  alternative_readings:
  - ‘전쟁에 나가는’으로 직역
  - ‘전투에 출정하는’으로 번역
  rationale: 문맥상 실제 전투 서술이 아니라 계수 대상의 자격 기준을 제시하는 문구이므로, 관용구의 기능을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 민수기 1장의 계수/병역 편성 문맥
- issue: ‘sons/children’ 계열을 지파 문구로 어떻게 처리할지
  chosen_reading: 지파 공식의 관용을 따라 ‘아셀의 아들들’로 유지했습니다.
  alternative_readings:
  - ‘아셀의 자손들’
  - ‘아셀 지파 사람들’
  rationale: 원문은 혈통 언어를 행정 단위로 사용하므로, 의미를 일반화한 ‘지파 사람들’보다 원형을 보존하는 표현이 더 적절합니다.
  doctrine_reference: 이스라엘 열두 지파 계수 공식
