  text: 'For Zebulun: Eliab son of Helon.'
translation:
  language: ko
  text: 스불론에는 헬론의 아들 엘리압입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  english_pob_choice: For Zebulun
  chosen_korean: 납달리에는
  alternatives_korean:
  - 스불론에는
  - 스불론에게
  lexicon: HALOT
  rationale: 열거문에서 ל는 각 지파 항목의 표지를 나타내므로, 한국어에서는 “~에는”으로 자연스럽게 항목을 구분했습니다. 지파 이름은 표준 음역보다 관용적 성경형을 우선해 납달리로 옮겼습니다.
- source_word: אֱלִיאָב
  english_pob_choice: Eliab
  chosen_korean: 엘리아브
  alternatives_korean:
  - 엘리압
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 이름은 음역하되, 성경 인명으로 널리 쓰이는 형태를 따라 엘리아브로 적었습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 아들
  - 아들인
  lexicon: HALOT
  rationale: 계보 공식에서 בֶּן은 소유보다 친족관계를 표시하므로, 한국어에서는 “~의 아들”보다 간결한 “아들” 구조로 자연스럽게 옮겼습니다.
- source_word: חֵלֹן
  english_pob_choice: Helon
  chosen_korean: 헬론
  alternatives_korean:
  - 헤론
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 고유명사는 음역을 유지했고, 동일 인명은 일관되게 헬론으로 처리했습니다.
theological_decisions:
- issue: 지파 표지 ל의 기능
  chosen_reading: 문장 첫머리를 소속 표지로 처리해, 각 지파 대표를 나열하는 목록 형식을 살렸습니다.
  alternative_readings:
  - 스불론의 엘리아브
  - 스불론 지파의 엘리아브
  rationale: 이 절은 설명문이 아니라 명단 항목이므로, 소속을 한국어 조사로 간단히 표시하는 편이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 민수기 1장 인구조사/지파 대표 명단 문맥
