id: NUM.1.45
reference: Numbers 1:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' which is retained here because the census is explicitly organized in male, military terms.
    reason: lexical_alternative
  - marker: b
    text: Or 'everyone fit for military service.' Literally, 'every one going out to war/army.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손[a]의 모든 계수된 사람은 그들의 조상들의 집안별로, 스무 살 이상으로, 곧 이스라엘에서 군대에 나갈 수 있는[b] 사람 모두였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 ‘이스라엘 자손’이라고 되어 있는데, 이곳은 계수가 남성적·군사적 용어로 조직되어 있으므로 이를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군 복무에 적합한 사람’. 문자적으로는 ‘전쟁/군대에 나가는 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 영어 POB가 남성적·군사적 표지를 살려 ‘the sons of Israel’을 유지하므로, 한국어도 이를 평이하게 옮겨 계수 대상이 남성 집단임을 드러냈습니다.
- source_word: פְּקוּדֵי
  english_pob_choice: those counted
  chosen_korean: 계수된 사람
  alternatives_korean:
  - 계수된 자들
  - 장부에 오른 사람들
  - 소집된 사람들
  lexicon: HALOT
  rationale: 인구조사 맥락의 פקד 수동형을 반영하면서도, 현대 한국어에서 자연스러운 결과 상태 표현으로 옮겼습니다.
- source_word: לְבֵית אֲבֹתָם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상들의 집안별로
  alternatives_korean:
  - 조상들의 집안에 따라
  - 아버지들의 집안별로
  - 족장 가문별로
  lexicon: HALOT
  rationale: 히브리어의 가부장적·씨족적 조직을 직접 반영하되, 한국어 문맥에서 ‘집안별로’로 읽히게 해 계수의 분류 기준을 살렸습니다.
- source_word: כָּל יֹצֵא צָבָא
  english_pob_choice: every one able to go out to war
  chosen_korean: 군대에 나갈 수 있는
  alternatives_korean:
  - 전쟁에 나갈 수 있는
  - 군역에 나설 수 있는
  - 군복무에 적합한
  lexicon: HALOT
  rationale: 관용구 יצא צבא의 군사적 의미를 살리면서, ‘나갈 수 있는’으로 자격/적격성을 표현해 단순 연령만이 아니라 동원 가능성을 나타냈습니다.
theological_decisions:
- issue: ‘sons of Israel’의 성별 표지와 군사적 계수의 보존
  chosen_reading: ‘이스라엘 자손’과 ‘군대에 나갈 수 있는’으로 옮겨, 본문이 남성 군사 계수라는 점을 흐리지 않았습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 전쟁에 나갈 수 있는 사람들
  rationale: 민족 전체를 중립화하면 본문이 가진 계수/징집의 성격이 약해지므로, 원문의 사회적·군사적 구조를 드러내는 번역을 택했습니다.
  doctrine_reference: 민수기 1장의 인구조사와 군역 준비라는 본문 맥락
