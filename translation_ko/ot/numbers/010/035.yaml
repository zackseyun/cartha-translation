id: NUM.10.35
reference: Numbers 10:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
  footnotes:
  - marker: a
    text: Or 'And it happened when the ark set out'; the Hebrew idiom can be rendered more formally, but here likely has the sense 'whenever the ark set out.'
    reason: lexical_alternative
  - marker: b
    text: '''Rise up'' is an appeal for the LORD to act in power, not a suggestion that God was literally inactive.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 언약궤가 떠날 때마다 모세는 이렇게 말했습니다. “야훼여, 일어나십시오. 주의 원수들이 흩어지고, 주를 미워하는 자들이 주 앞에서 달아나게 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘궤가 떠날 때마다’라는 반복적 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일어나십시오’는 하나님이 실제로 잠든 상태에서 일어나신다는 뜻이 아니라, 능력으로 개입해 달라는 호소입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  english_pob_choice: And whenever ... set out
  chosen_korean: 그리고 ... 떠날 때마다
  alternatives_korean:
  - 그리고 ... 떠날 때
  - 그리고 ... 출발할 때마다
  lexicon: HALOT
  rationale: 반복되는 상황을 나타내는 관용적 용법이므로 ‘때마다’로 재현해, 단회 사건보다 반복성을 살렸습니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 증거궤
  lexicon: HALOT
  rationale: 히브리어 본문은 단순히 ‘궤’이지만, 한국어 독자가 이 구절의 대상이 무엇인지 즉시 알 수 있도록 성경적 맥락에 따라 ‘언약궤’로 옮겼습니다.
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나소서
  - 떨쳐 일어나십시오
  lexicon: HALOT
  rationale: 야훼께 드리는 호소의 명령형으로, 문자적 ‘일어나라’보다 현대 한국어에서 자연스러운 ‘일어나십시오’가 하나님의 능동적 개입을 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문자 그대로 신성표기 יהוה를 옮겨, 전통적 대치어가 아니라 고유 이름을 보존했습니다.
- source_word: יָפֻצוּ / יָנֻסוּ
  english_pob_choice: let ... be scattered / let ... flee
  chosen_korean: 흩어지고 ... 달아나게 하십시오
  alternatives_korean:
  - 흩어지게 하십시오 / 도망하게 하십시오
  - 흩어지며 / 달아나며
  lexicon: HALOT
  rationale: 모세의 기도문에서 뒤따르는 미완료형의 권유·소원 의미를 살려, 원수의 해체와 도피를 요청하는 형태로 옮겼습니다.
theological_decisions:
- issue: 야훼를 향한 ‘일어나십시오’의 의미
  chosen_reading: 하나님이 실제로 잠든 상태에서 일어난다는 뜻이 아니라, 능력으로 개입해 행동해 달라는 기도적 호소로 읽었습니다.
  alternative_readings:
  - 문자적으로 자리에서 일어나는 묘사
  - 단순한 시적 장식
  rationale: 본문의 명령형은 신적 무활동을 전제하지 않고, 야훼의 전투적 개입을 청원하는 관용구입니다.
  doctrine_reference: Numbers 10:35의 기도적 전승과 신적 현현 언어
