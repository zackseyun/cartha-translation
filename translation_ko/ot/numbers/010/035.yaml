revisions:
- from: 그리고 언약궤가 떠날 때마다 모세는 이렇게 말했습니다. “야훼여, 일어나십시오. 주의 원수들이 흩어지고, 주를 미워하는 자들이 주 앞에서 달아나게 하십시오.”[a][b]
  to: 궤가 떠날 때마다[a] 모세는 말했습니다. “야훼여, 일어나십시오.[b] 야훼의 원수들이 흩어지게 하시고, 야훼를 미워하는 자들이 야훼 앞에서 달아나게 하십시오.”
  rationale: 원문에 없는 ‘언약’이라는 수식어를 제거하여 הָאָרֹן의 표현 범위를 보존했습니다. 반복적 시간 표현, 야훼라는 신명, 그리고 청원적 병렬 구조는 유지했으며, 각주 표지를 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:07Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복적 시간 표현은 ‘떠날 때마다’로 잘 반영되었고, 야훼께 드리는 호소 및 뒤따르는 소원적 동사들도 대체로 적절합니다. 그러나 הָאָרֹן은 본절에서 단순히 ‘궤’이므로, 문맥상의 정보를 보태어 ‘언약궤’로 확정하지 않는 편이 원문 충실성에 맞습니다.
  naturalness: 합쇼체의 기도 인용문은 자연스럽습니다. 다만 두 소원 표현을 ‘흩어지게 하시고 … 달아나게 하십시오’로 병렬하면 한국어 기도문으로 더 매끄럽고, 두 요청의 구조도 분명해집니다.
  terminology: יהוה는 정책과 원문에 따라 ‘야훼’로 유지했습니다. 2인칭 소유·목적 표현은 한국어에서 ‘야훼의 원수들’, ‘야훼를 미워하는 자들’, ‘야훼 앞에서’로 반복하여 지시 대상을 명료하게 했습니다. ‘언약궤’는 원문에 없는 확장이므로 ‘궤’로 고쳤습니다.
  issues:
  - severity: medium
    issue: הָאָרֹן을 ‘언약궤’로 확장함
    rationale: 히브리어 본문은 ‘그 궤’가 아니라 관사 붙은 ‘궤’를 사용할 뿐 ‘언약’이라는 수식어를 포함하지 않습니다. 영어 POB 감사 기록도 문맥적 확장을 피하도록 명시하므로 ‘궤’로 옮겨야 합니다.
  - severity: low
    issue: 두 소원절의 한국어 병렬성이 다소 약함
    rationale: ‘원수들이 흩어지고’는 연결 서술처럼 읽힐 수 있습니다. 두 동사 모두 청원/소원적 힘을 가지므로 ‘흩어지게 하시고 … 달아나게 하십시오’로 병렬하는 것이 뜻과 문장 기능을 더 선명히 드러냅니다.
  - severity: low
    issue: 각주 표지가 인용문 끝에 함께 배치됨
    rationale: 반복성에 관한 각주와 ‘일어나십시오’의 관용적 의미에 관한 각주는 각각 해당 표현 바로 뒤에 두는 편이 참조 대상이 명확합니다.
