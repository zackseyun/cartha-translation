  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
  footnotes:
  - marker: a
    text: Or 'was upon them by day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼의 구름이 그들 위에 낮에 있었으며, 그들이 진영에서 출발할 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 위에 낮에 있었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲנַן / עֲנַן
  english_pob_choice: And the cloud
  chosen_korean: 그리고 … 구름이
  alternatives_korean:
  - 그 구름이
  - 또 구름이
  lexicon: HALOT
  rationale: עָנָן은 ‘구름’이며, 서두의 וְ는 앞 절과의 서술 연결을 살려 ‘그리고’로 옮겼습니다. 한국어에서도 자연스러운 이야기 흐름을 유지하기 위해 문두에 배치했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 전통적 대치어가 아니라 하나님의 이름으로 표기해야 하므로, POB 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: was over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위에 있었다
  - 그들 위에 있었으며
  lexicon: HALOT
  rationale: עַל + 대명사 접미사는 위치상 ‘~위에’의 뜻을 가지므로, 구름의 위치를 분명히 드러내는 ‘그들 위에’를 선택했습니다.
- source_word: יוֹמָם
  english_pob_choice: by day
  chosen_korean: 낮에
  alternatives_korean:
  - 날 동안
  - 낮 동안
  lexicon: HALOT
  rationale: יוֹמָם은 ‘낮에/낮 동안’의 뜻이므로, 간결하고 현대적인 ‘낮에’로 옮겼습니다.
- source_word: בְּנָסְעָם
  english_pob_choice: when they set out
  chosen_korean: 그들이 … 출발할 때
  alternatives_korean:
  - 그들이 떠날 때
  - 그들의 출발 중에
  lexicon: HALOT
  rationale: בְּ + 부정사구는 시간 부사절로 기능하므로 ‘~할 때’로 옮겼고, נסע는 진영을 옮겨 움직이는 맥락에서 ‘출발하다’가 가장 자연스럽습니다.
- source_word: מִן הַמַּחֲנֶה
  english_pob_choice: from the camp
  chosen_korean: 진영에서
  alternatives_korean:
  - 진영으로부터
  - 캠프에서
  lexicon: HALOT
  rationale: מַחֲנֶה는 광야 행군 문맥에서 이스라엘의 ‘진영’을 가리키므로, 군사·광야 맥락을 살려 ‘진영’으로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명 대역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님의 언약 이름을 직접 사용하므로, 호칭으로 바꾸지 않고 고유명을 보존하는 것이 מקור 텍스트의 의미를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
