id: NUM.10.7
reference: Numbers 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
  footnotes:
  - marker: a
    text: Or 'blow an alarm blast.' The Hebrew contrasts ordinary blowing with the distinctive alarm signal used for setting out in the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 회중을 모을 때에는 너희는 불고, 경보는 울리지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경보’는 히브리어의 구별된 신호를 살린 번역입니다. 본문은 단순한 울림과 출정 경보를 대비합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַקְהִיל
  english_pob_choice: But when assembling
  chosen_korean: 그러나 회중을 모을 때에는
  alternatives_korean:
  - 그리고 모을 때에는
  - 회중을 모으는 때에는
  lexicon: HALOT
  rationale: 전후 문맥의 대조를 살려 ‘그러나’를 두고, Hiphil의 ‘모으다/집합시키다’는 의미를 한국어 자연 문맥에 맞게 동사구로 옮겼습니다.
- source_word: הַקָּהָל
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean:
  - 총회
  - 백성
  lexicon: HALOT
  rationale: 공동체가 모인 상태를 가리키는 말로서, ‘회중’이 제의적·공동체적 상황을 가장 직접적으로 반영합니다.
- source_word: תִּתְקְעוּ
  english_pob_choice: you shall blow
  chosen_korean: 너희는 불고
  alternatives_korean:
  - 너희는 소리내고
  - 너희는 나팔을 불고
  lexicon: HALOT
  rationale: 히브리어는 이 절에서 악기를 명시하지 않으므로, 본문에 없는 ‘나팔’을 덧붙이지 않고 간결하게 ‘불다’로 옮겼습니다.
- source_word: תָרִיעוּ
  english_pob_choice: sound an alarm
  chosen_korean: 경보는 울리지 마십시오
  alternatives_korean:
  - 함성을 지르지 마십시오
  - 알람을 울리지 마십시오
  - 신호를 울리지 마십시오
  lexicon: HALOT
  rationale: 이 동사는 단순한 소음이 아니라 문맥상 구별되는 경보 신호를 뜻하므로, ‘경보’로 기술적 대비를 살렸습니다.
theological_decisions:
- issue: 집회 신호와 출정 신호의 구분
  chosen_reading: 여기서는 평상시의 소집에는 단순한 불기만 허용되고, 경보성 신호는 금지된다는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 두 동작 모두 단순한 ‘불기’로 평준화하는 읽기
  - ‘외침’을 중심으로 이해하는 읽기
  rationale: 앞절과의 대비는 제의적 집회와 출정의 신호를 구분하는 규정이므로, 한국어에서도 그 기능 차이를 드러내는 것이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 민수기 10:1-10의 나팔 규례
