id: NUM.10.9
reference: Numbers 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
  footnotes:
  - marker: a
    text: Or, 'And if you go to war in your land.' The Hebrew conjunction can introduce either a conditional or a situational clause.
    reason: alternative_reading
  - marker: b
    text: Or, 'you shall be brought to remembrance before the LORD your God,' or more interpretively, 'the LORD your God will remember you.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희 땅에서 너희를 압박하는 대적을 맞아 전쟁에 나갈 때에는[a], 나팔을 불어 경보를 울리십시오. 그러면 너희는 야훼[c] 너희 하나님 앞에서 기억될 것이며[b], 너희 원수들에게서 구원받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 땅에서 전쟁에 나가게 되면’이라고 할 수 있습니다. 히브리어 접속사는 조건절이나 상황절을 이끌 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘너희가 너희 하나님 야훼 앞에서 기억나게 될 것이며’라고 할 수 있습니다. 더 해석적으로는 ‘너희 하나님 야훼께서 너희를 기억하실 것입니다’라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 하나님의 이름 YHWH를 ‘야훼’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ מִלְחָמָה
  english_pob_choice: And when you go to war
  chosen_korean: 그리고 너희의 땅에서 너희를 압박하는 원수와 싸우게 될 때에는
  alternatives_korean:
  - 그리고 너희 땅에서 전쟁에 나가게 될 때에는
  - 그리고 너희의 땅에서 전쟁에 들어가게 될 때에는
  lexicon: HALOT
  rationale: 조건·상황을 여는 וְכִי를 자연스러운 한국어 조건절로 옮기고, 전쟁 관용구는 한국어에서 이해하기 쉬운 ‘싸우게 될 때’로 풀어 뜻을 살렸습니다.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  english_pob_choice: against the enemy who oppresses you
  chosen_korean: 너희를 압박하는 원수와
  alternatives_korean:
  - 너희를 괴롭히는 적과
  - 너희를 압제하는 대적과
  lexicon: HALOT
  rationale: 명사 צַר와 분사 צֹרֵר의 적대·압박의 중첩을 살려, 단순한 ‘적’보다 ‘너희를 압박하는 원수’로 번역했습니다.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  english_pob_choice: you shall sound an alarm with the trumpets
  chosen_korean: 나팔을 불어 경보를 울려야 합니다
  alternatives_korean:
  - 나팔을 불어 알람을 내야 합니다
  - 나팔로 신호를 울려야 합니다
  lexicon: HALOT
  rationale: חֲצֹצְרֹת는 제의적 나팔이지만 이 문맥에서는 군사적 신호 기능이 핵심이므로, ‘경보를 울리다’로 기능을 드러냈습니다.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  english_pob_choice: you shall be saved from your enemies
  chosen_korean: 너희는 원수들에게서 구원을 받을 것입니다
  alternatives_korean:
  - 너희는 원수들에게서 구출될 것입니다
  - 너희는 원수들로부터 구원받을 것입니다
  lexicon: HALOT
  rationale: נושׁע의 피동 의미를 살리면서, 군사적 구출을 넘어서는 언약적 구원 뉘앙스를 유지하기 위해 ‘구원을 받다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유신명 יְהוָה를 제목이 아닌 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם의 시제·태
  chosen_reading: 너희는 너희의 하나님 야훼 앞에서 기억될 것이며
  alternative_readings:
  - 너희는 너희의 하나님 야훼 앞에서 기억나게 될 것이며
  - 너희의 하나님 야훼께서 너희를 기억하실 것이며
  rationale: 히브리어 수동/반사형을 그대로 살려, 하나님을 주어로 명시적으로 바꾸지 않고 ‘기억될 것’이라는 문법적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
