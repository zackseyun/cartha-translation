  to: 또 너희 땅에서 너희를 압박하는 대적을 맞아 전쟁에 나갈 때에는[a], 나팔을 불어 경보를 울리십시오. 그러면 너희는 야훼[c] 너희 하나님 앞에서 기억될 것이며[b], 너희 원수들에게서 구원받을 것입니다.
