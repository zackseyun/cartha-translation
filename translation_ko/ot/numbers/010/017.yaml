id: NUM.10.17
reference: Numbers 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּרַ֖ד הַ/מִּשְׁכָּ֑ן וְ/נָסְע֤וּ בְנֵֽי גֵרְשׁוֹן֙ וּ/בְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַ/מִּשְׁכָּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
  footnotes:
  - marker: a
    text: Or 'the Gershonites and the Merarites.' The Hebrew reads 'the sons of Gershon and the sons of Merari.'
    reason: lexical_alternative
  - marker: b
    text: That is, they carried the tabernacle after it had been taken down; the Hebrew repeats 'the tabernacle' rather than explicitly saying 'its parts.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 성막이 내려졌고, 게르손의 아들들과 므라리의 아들들이 성막을 메고 출발했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  english_pob_choice: was taken down
  chosen_korean: 내려졌고
  alternatives_korean:
  - 해체되었고
  - 분해되었고
  lexicon: HALOT
  rationale: Hophal형은 성막이 세워진 상태에서 내려지는 수동적 사건을 가리키므로, 한국어에서는 자연스럽고도 장막의 축성 상태를 해치지 않는 ‘내려졌고’로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 회막
  lexicon: HALOT
  rationale: 민수기의 제의적 문맥에서 מִשְׁכָּן은 ישראל의 sanctuary tent를 가리키므로, 한국어 전통 용례와 정확성을 함께 살려 ‘성막’으로 번역했습니다.
- source_word: בְנֵי גֵרְשׁוֹן / וּבְנֵי מְרָרִי
  english_pob_choice: the sons of Gershon / the sons of Merari
  chosen_korean: 게르손의 아들들 / 므라리의 아들들
  alternatives_korean:
  - 게르손 사람들 / 므라리 사람들
  - 게르손 자손 / 므라리 자손
  lexicon: HALOT
  rationale: 히브리어가 집단명보다 직역형인 ‘~의 아들들’을 반복하므로, 본문의 족속-가문 구조를 보존하기 위해 그대로 살렸습니다.
- source_word: נֹשְׂאֵי
  english_pob_choice: carrying
  chosen_korean: 메고
  alternatives_korean:
  - 나르며
  - 들고
  lexicon: HALOT
  rationale: 분사 נֹשְׂאֵי는 이동 중의 운반 행위를 나타내므로, 성막의 무게와 행진 맥락을 자연스럽게 드러내는 ‘메고’를 택했습니다.
