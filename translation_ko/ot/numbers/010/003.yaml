source:
  edition: WLC
  text: וְ/תָקְע֖וּ בָּ/הֵ֑ן וְ/נֽוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or, more formally, 'And they shall blow them, and all the congregation shall gather to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그것들을 불면, 온 회중은 회막 입구에서 당신 앞에 모일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 불면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  english_pob_choice: When they blow
  chosen_korean: 그들이 ... 불면
  alternatives_korean:
  - 그들이 ... 불고
  - 그들이 ... 불 때
  lexicon: HALOT
  rationale: 나팔을 ‘불다’는 뜻을 자연스럽게 살리면서, 절차 문맥의 시간적 조건을 한국어 ‘-면’으로 옮겼습니다.
- source_word: בָּהֵן
  english_pob_choice: them
  chosen_korean: 그것들
  alternatives_korean:
  - 그것을
  - 그 나팔들을
  lexicon: HALOT
  rationale: 앞절의 두 은나팔을 가리키므로 복수 대명사로 분명히 드러냈습니다.
- source_word: וְנוֹעֲדוּ אֵלֶיךָ
  english_pob_choice: shall assemble before you
  chosen_korean: 당신 앞에 모일 것입니다
  alternatives_korean:
  - 당신에게 모일 것입니다
  - 당신께 모여들 것입니다
  lexicon: HALOT
  rationale: יעד의 집합/소집 의미를 살려 ‘모이다’로 옮기고, אֵלֶיךָ는 장소적·면전적 의미를 반영해 ‘앞에’로 처리했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: Pentateuchal established rendering
  rationale: 오경에서 굳어진 용례를 따라 ‘회막’으로 옮기되, 문장 안에서는 현대 문맥에 맞게 ‘입구’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 공동체 집합의 방향과 기준
  chosen_reading: 나팔 신호에 따라 온 회중이 모세 앞, 곧 회막 입구로 모인다는 집합 명령으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘만나러 간다’는 일반적 만남
  - 의례적 소집의 뉘앙스를 약화한 읽기
  rationale: 문맥상 이것은 우연한 만남이 아니라 하나님이 정하신 신호에 따른 공적 소집이므로, ‘모일 것입니다’와 ‘회막 입구’로 질서를 분명히 드러냈습니다.
  doctrine_reference: 공동체 소집과 예배 질서에 관한 민수기 문맥
