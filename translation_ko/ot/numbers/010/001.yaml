  - 주
  rationale: 본문은 신적 칭호가 아니라 언약적 고유명사를 사용하므로, POB의 원칙대로 ‘야훼’를 유지해 이름의 계시성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
