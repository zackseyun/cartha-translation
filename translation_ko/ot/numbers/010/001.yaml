lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: דיבר는 단순 발화보다 권위 있는 말씀을 가리키므로, 현대 합쇼체에서 ‘말씀하여 이르셨습니다’로 옮겨 신적 발화의 격식을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원문 직결 방침에 따라 신명기적 이름 יְהוָה는 대체 칭호가 아니라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향하여
  - 모세에게로
  lexicon: HALOT
  rationale: אֶל은 발화의 대상 표지를 이루므로 한국어에서는 여격 ‘-에게’가 가장 자연스럽고 원문의 문법 관계를 분명히 드러냅니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 이르시며
  lexicon: HALOT
  rationale: לֵאמֹר은 직접화법을 도입하는 공식이어서, 한국어에서는 별도의 ‘말하여’ 반복보다 ‘이르셨습니다’로 처리해 자연스러운 화행 구문을 만들었습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
