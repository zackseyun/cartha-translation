translation:
  language: ko
  text: 그리고 아셀 자손 지파의 부대[a]를 이끈 이는 오그란의 아들 바기엘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군대’, ‘사단’, 또는 ‘무리’로 옮길 수 있습니다. 히브리어는 이스라엘 진영의 질서 안에 편성된 조직적 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - 그리고 … 위에 있었습니다
  lexicon: HALOT
  rationale: 접속사와 전치사의 결합이 앞선 열거를 이어 가면서 특정 부대를 맡은 책임 위치를 나타내므로, 한국어에서는 자연스러운 연결인 ‘그리고’와 지위·관할을 드러내는 ‘위에는’으로 옮겼습니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 군대
  - 조직된 무리
  - 대오
  lexicon: HALOT
  rationale: 민수기 10장의 진영 질서 문맥에서는 단순한 군사 집단보다 정렬된 편제를 가리키므로, ‘부대’가 현대 한국어에서 가장 간결하게 그 조직성을 살립니다.
- source_word: בְּנֵי אָשֵׁר
  english_pob_choice: the sons of Asher
  chosen_korean: 아셀 자손의
  alternatives_korean:
  - 아셀의 아들들의
  - 아셀의 자손의
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘아셀의 아들들’이지만, 지파 명칭으로 굳어진 표현을 유지하기 위해 ‘아셀 자손의’로 옮겨 자연스러운 소유격 구조를 만들었습니다.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  english_pob_choice: Pagiel son of Ocran
  chosen_korean: 오크란의 아들 파기엘
  alternatives_korean:
  - 오크란의 아들 바기엘
  - 파기엘, 오크란의 아들
  lexicon: HALOT
  rationale: 인명은 통용되는 음역을 따르되, 히브리어의 부자 관계 표지 ‘בן’을 한국어 친족관계 표현인 ‘아들’로 옮겨 계보 관계를 분명히 했습니다.
theological_decisions:
- issue: 지파 진영 명칭의 군사성
  chosen_reading: ‘צְבָא’를 ‘부대’로 번역해 조직된 진영 질서를 드러냈습니다.
  alternative_readings:
  - ‘군대’로 옮겨 더 강한 군사적 이미지를 살리는 읽기
  - ‘무리’로 옮겨 중립적으로 처리하는 읽기
  rationale: 본문은 이스라엘 진영의 행정적·질서적 배치를 기록하므로, 실제 전투를 뜻하는 과도한 군사화나 지나치게 느슨한 집단어보다 ‘부대’가 문맥에 가장 적합합니다.
  doctrine_reference: 민수기 2장과 10장의 진영 편성 문맥
