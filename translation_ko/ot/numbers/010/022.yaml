  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.' The Hebrew term refers to the tribal ensign under which the camp marched.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their companies/hosts.' The Hebrew reflects organized military-style groupings within the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에브라임 자손의 진영 깃발이 그들의 부대대로 출발하였고, 그 부대의 지휘관은 암미훗의 아들 엘리사마였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃발’은 원문의 דֶּגֶל을 따른 번역입니다. 이 말은 진영이 행진할 때 사용한 지파 깃발/기치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부대대로’는 원문의 לְצִבְאֹתָם을 반영합니다. 여기서는 전투만이 아니라 정해진 편성에 따른 행진 단위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  english_pob_choice: Then ... set out
  chosen_korean: 출발하였고
  alternatives_korean:
  - 나아갔고
  - 떠났고
  lexicon: HALOT
  rationale: 문맥이 광야 행진의 순서를 말하므로, 시간 연결어는 ‘그때’로, 동작은 군사적 행진의 느낌을 살리면서도 자연스러운 ‘출발하였고’로 옮겼습니다.
- source_word: דֶּגֶל מַחֲנֵה בְנֵי אֶפְרַיִם
  english_pob_choice: the banner of the camp of the sons of Ephraim
  chosen_korean: 에브라임 자손의 진영 깃발
  alternatives_korean:
  - 에브라임 자손의 진영의 깃발
  - 에브라임 자손 진영의 기
  lexicon: HALOT
  rationale: דֶּגֶל은 POB의 ‘banner’를 따라 ‘깃발’로 옮겼고, מַחֲנֵה는 광야 진영 맥락에서 ‘진영’이 가장 직접적입니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 부대대로
  alternatives_korean:
  - 그들의 분대대로
  - 그들의 대열대로
  - 그들의 군대로
  lexicon: HALOT
  rationale: צָבָא의 조직된 행진 단위를 한국어로는 ‘부대’가 가장 무리 없이 전달하며, לְ는 배열·편성의 의미를 살려 ‘-대로’로 표현했습니다.
- source_word: וְעַל צְבָאוֹ
  english_pob_choice: and over its division was
  chosen_korean: 그 부대의 지휘관은
  alternatives_korean:
  - 그 부대 위에는
  - 그 부대의 우두머리는
  - 그 부대 위를 맡은 자는
  lexicon: HALOT
  rationale: 직역의 ‘위에’보다, 문맥상 배치된 책임자를 가리키는 관계를 한국어에서 자연스럽게 드러내는 ‘지휘관’이 더 정확합니다.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  english_pob_choice: Elishama son of Ammihud
  chosen_korean: 암미훗의 아들 엘리사마
  alternatives_korean:
  - 엘리사마, 암미훗의 아들
  - 암미훗의 아들인 엘리사마
  lexicon: HALOT
  rationale: 고유명사는 통용되는 음역을 따르고, 족보 관계는 한국어 성경 관용에 맞게 ‘~의 아들’로 유지했습니다.
theological_decisions:
- issue: 이스라엘 진영의 질서와 지도권 표현
  chosen_reading: 각 지파 진영이 정해진 순서와 부대 편성 아래 움직이며, 그 위에 지정된 책임자가 있음을 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 ‘행진하였다’로 일반화하는 읽기
  - ‘군대’로만 환원하는 읽기
  rationale: 본문은 단순 이동이 아니라 질서 있는 광야 행진을 묘사하므로, 편성된 공동체와 지도 체계를 함께 보이도록 번역했습니다.
  doctrine_reference: 민수기 10장의 광야 행진 질서
