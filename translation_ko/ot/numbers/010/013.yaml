  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning through Moses as mediator or agent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 명령에 따라 모세를 통해 처음으로 출발했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모세의 손으로’는 관용적으로 ‘모세를 통해’, 곧 중개자 또는 대리자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: they set out
  chosen_korean: 출발했습니다
  alternatives_korean:
  - 떠났습니다
  - 길을 떠났습니다
  - 행진했습니다
  lexicon: HALOT
  rationale: 여행 서술에서 נסע는 단순한 이동보다 진영을 걷고 나아가는 출발의 뉘앙스를 지니므로, 현대 한국어의 자연스러운 동사 ‘출발하다’가 가장 잘 대응합니다.
- source_word: בָּרִאשֹׁנָה
  english_pob_choice: for the first time
  chosen_korean: 처음으로
  alternatives_korean:
  - 맨 처음으로
  - 첫 번째로
  - 처음에
  lexicon: HALOT
  rationale: 문맥상 시내 산에서의 첫 출발을 가리키므로, 시간 부사의 ‘처음으로’가 inaugural sense를 가장 간결하게 드러냅니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령에 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 지시에 따라
  - 야훼의 명령으로
  lexicon: HALOT
  rationale: עַל פִּי는 직역하면 ‘입에 따라’이지만 기능적으로 권위 있는 지시를 뜻하므로, POB의 해석을 따라 ‘명령에 따라’로 옮겼습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세를 통해
  alternatives_korean:
  - 모세의 손으로
  - 모세를 매개로
  - 모세를 거쳐
  lexicon: HALOT
  rationale: ‘손으로’라는 직역보다, 모세가 야훼의 명령을 전달하고 집행하는 중개자라는 의미를 한국어로 분명히 하는 ‘모세를 통해’가 더 적절합니다.
theological_decisions:
- issue: 야훼(יְהוָה) 고유명사 표기
  chosen_reading: ‘여호와’ 대신 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 언약적 고유명사를 직접 사용하므로, 대체 титул이 아니라 음역형 ‘야훼’가 원문 식별성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
