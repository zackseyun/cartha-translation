  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
  footnotes:
  - marker: a
    text: Or 'army,' 'host,' or 'division' for 'company.' The Hebrew צְבָא refers to an organized tribal contingent in the camp-and-march arrangement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 납달리 자손의 부대 위에는 아히라, 에난의 아들이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צְבָא는 ‘군대’, ‘군단’, ‘부대’처럼 조직된 단위를 뜻할 수 있으며, 여기서는 진영과 행진 체계 안의 지파 편제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 군대
  - 군단
  - 분대
  lexicon: HALOT
  rationale: 광야 진영과 행진 질서 안에서 조직된 지파 단위를 가리키므로, 정규 군대보다 덜 과장되면서도 편제를 드러내는 ‘부대’가 가장 자연스럽습니다.
- source_word: מַטֵּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 지팡이
  - 막대
  - 종족
  lexicon: HALOT
  rationale: 문맥상 물건인 ‘지팡이’가 아니라 이스라엘의 부족 단위를 뜻하므로, 관용적으로 정착된 ‘지파’로 옮겼습니다.
- source_word: בְּנֵי נַפְתָּלִי
  english_pob_choice: the sons of Naphtali
  chosen_korean: 납달리 자손
  alternatives_korean:
  - 납달리의 사람들
  - 납달리의 후손
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 표현을 그대로 살리되, 한국어에서는 부족명칭으로 굳어진 ‘자손’을 사용해 혈연-지파적 의미를 유지했습니다.
- source_word: אֲחִירַע
  english_pob_choice: Ahira
  chosen_korean: 아히라
  alternatives_korean:
  - 아히라
  - 아히랴
  lexicon: standard transliteration
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 음역했습니다.
- source_word: בֶּן עֵינָן
  english_pob_choice: son of Enan
  chosen_korean: 에난의 아들
  alternatives_korean:
  - 에난의 아들이
  - 에난의 자손
  lexicon: HALOT
  rationale: 히브리어 친족관계 표지를 한국어 소유격으로 자연스럽게 옮기되, 족보식 연결을 분명히 하도록 ‘에난의 아들’로 처리했습니다.
theological_decisions:
- issue: צְבָא의 의미를 어떻게 드러낼지
  chosen_reading: ‘부대’로 옮겨 조직된 행진/진영 단위를 보여 주었습니다.
  alternative_readings:
  - 군대
  - 군단
  - 분대
  rationale: 이 구절은 전투 서술이 아니라 진영 질서의 반복 공식이므로, 군사성을 과도하게 강화하지 않으면서도 질서 있는 편제를 드러내는 번역이 적절합니다.
  doctrine_reference: 민수기 10장의 진영·행진 질서
