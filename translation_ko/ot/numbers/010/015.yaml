  text: 그리고 잇사갈 자손 지파의 부대[a]를 지휘한 이는 수알의 아들 느다넬이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군대’ 또는 ‘사단’. 히브리어 צְבָא는 여기서 행진 질서에 따라 조직된 지파 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - 또 … 위에는
  lexicon: HALOT
  rationale: 연결 접속사와 감독의 뜻을 함께 살려, 앞절의 열거를 잇는 ‘그리고’와 지휘 관계를 나타내는 ‘위에는’으로 옮겼습니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 군대
  alternatives_korean:
  - 부대
  - 대열
  - 군단
  lexicon: HALOT
  rationale: 민수기 10장의 행진 질서에서는 조직된 집단을 가리키므로, 현대 한국어에서 자연스럽고 집합적 성격을 드러내는 ‘군대’를 택했습니다.
- source_word: מַטֵּה בְּנֵי יִשָׂשכָר
  english_pob_choice: the tribe of the sons of Issachar
  chosen_korean: 잇사갈 자손의 지파
  alternatives_korean:
  - 잇사갈의 지파
  - 잇사갈 사람들의 지파
  lexicon: HALOT
  rationale: מַטֵּה는 여기서 ‘지팡이’가 아니라 지파를 뜻하므로 ‘지파’로 옮기고, בְּנֵי יִשָׂשכָר의 직역 구조를 유지했습니다.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  english_pob_choice: Nethanel the son of Zuar
  chosen_korean: 넷나엘, 즈아르의 아들
  alternatives_korean:
  - 느다넬, 즈아르의 아들
  - 넷나엘, 즈아르의 아들
  lexicon: HALOT
  rationale: 인명은 표준 음역을 따르되, בן의 친자 관계는 한국어에서 가장 자연스러운 속격 구조로 풀어 ‘즈아르의 아들’로 옮겼습니다.
