source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'your new moons.' The Hebrew is literally 'the beginnings of your months.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sacrifices of your fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기쁨의 날과 여러분의 정해진 때와 여러분의 초하루들에 나팔을 불어 여러분의 번제물 위와 여러분의 화목제물의 희생 위에 두십시오. 그것들이 여러분에게 하나님 앞에서 기념이 될 것입니다. 나는 야훼, 여러분의 하나님입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여러분의 달들의 시작들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 친교제물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  english_pob_choice: your gladness
  chosen_korean: 기쁨의 날
  alternatives_korean:
  - 여러분의 기쁨
  - 여러분의 즐거움
  lexicon: HALOT
  rationale: 명사형 ‘기쁨’을 자연스럽게 풀어 행사의 성격을 살렸고, 목록 구조에 맞게 간결하게 처리했습니다.
- source_word: מוֹעֲדֵיכֶם
  english_pob_choice: your appointed times
  chosen_korean: 여러분의 정해진 때
  alternatives_korean:
  - 여러분의 정해진 절기
  - 여러분의 축제 때
  lexicon: HALOT
  rationale: מוֹעֵד의 기본 의미인 ‘정해진 때/기한’을 살려, 절기로만 좁히지 않고 원문의 폭을 유지했습니다.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  english_pob_choice: the beginnings of your months
  chosen_korean: 여러분의 초하루들
  alternatives_korean:
  - 여러분의 달의 시작들
  - 여러분의 새달들
  lexicon: HALOT
  rationale: 히브리어의 달력 표현을 한국어 관용인 ‘초하루’로 옮기되, 복수형을 반영해 절기 목록의 평행성을 살렸습니다.
- source_word: חֲצֹצְרֹת
  english_pob_choice: the trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 트럼펫
  - 은 나팔
  lexicon: HALOT
  rationale: 문맥상 제의용 나팔이지만, 본문 자체가 ‘은’이나 재질을 여기서 직접 말하지 않으므로 단순히 ‘나팔’로 옮겼습니다.
- source_word: שַׁלְמֵיכֶם
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 친교제물
  lexicon: HALOT
  rationale: 한국 교회 언어의 제사 용어 중에서도 원문의 제의적 함의를 유지할 수 있는 ‘화목제물’을 사용했습니다.
- source_word: לְזִכָּרוֹן
  english_pob_choice: as a memorial
  chosen_korean: 기념
  alternatives_korean:
  - 기억
  - 추모
  lexicon: HALOT
  rationale: 제의적 맥락에서 하나님 앞에 ‘기억나게 함’이라는 기능을 살려 ‘기념’으로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: DOCTRINE.md Contested terms
  rationale: 언약적 고유명사를 제목어로 대체하지 않고 음역하여, 본문이 직접 사용하는 신적 이름을 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 마지막 선언은 단순 칭호가 아니라 언약의 고유한 신적 이름을 사용하므로, 이를 ‘야훼’로 유지해 원문 구별을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לְזִכָּרוֹן의 제의적 기능
  chosen_reading: 기념
  alternative_readings:
  - 기억
  - 기념물
  rationale: 이 표현은 단순한 심리적 회상이 아니라 하나님 앞에서 제의 행위가 갖는 ‘기억나게 함’의 기능을 가리키므로, 그 의례적 뉘앙스를 살렸습니다.
  doctrine_reference: Numbers 10:10 제의 문맥
