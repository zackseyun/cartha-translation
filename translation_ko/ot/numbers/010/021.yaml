  source_fidelity: 핵심 의미와 행진 순서는 대체로 충실합니다. 다만 ‘나섰는데’는 히브리어의 단순 서술 접속을 부자연스러운 대조·배경 연결로 바꾸며, ‘거룩한 것들’은 문맥상 운반되는 성물을 가리키지만 한국어로는 지나치게 추상적입니다.
  naturalness: ‘그때 고핫 자손들이 나섰는데, … 메고 있었고’는 현대 표준 한국어 성경 문체로 다소 어색하고 미완결적인 연결입니다. 두 개의 간결한 서술문으로 옮기면 합쇼체의 공식적 문체와 행진 서술에 더 자연스럽습니다.
  terminology: הַקְּהָתִים의 ‘고핫 자손들’과 הַמִּשְׁכָּן의 ‘성막’은 적절합니다. נֹשְׂאֵי הַמִּקְדָּשׁ은 성막 구조물과 구별되는 운반 성물을 뜻하므로 ‘성물들’이 더 명료하고 자연스럽습니다. 각주에서는 직역적 대안인 ‘성소를 메는 사람들’을 보존합니다.
