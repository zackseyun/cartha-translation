source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
  footnotes:
  - marker: a
    text: Or, more formally, 'carrying the sanctuary' or 'bearers of the sanctuary'; here the phrase refers to the sacred furnishings carried by the Kohathites, distinguished from the tabernacle structure mentioned next.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 고핫 자손들이 나섰는데, 거룩한 것들을 메고 있었고, 그들이 도착하기 전에 성막은 세워져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면 ‘성막의 것들을 메고’ 또는 ‘성소의 운반자들’입니다. 여기서는 고핫 자손이 옮기는 성스러운 기물들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  english_pob_choice: Then ... set out
  chosen_korean: 그때 ... 나섰는데
  alternatives_korean:
  - 그리고 ... 출발했는데
  - 그때 ... 떠났는데
  lexicon: HALOT
  rationale: 여행 서사의 순차성을 살리면서, 군중·진군 문맥에 자연스러운 합쇼체 표현으로 옮겼습니다.
- source_word: הַקְּהָתִים
  english_pob_choice: the Kohathites
  chosen_korean: 고핫 자손들
  alternatives_korean:
  - 고핫 사람들
  - 고핫 사람들(고핫 족속)
  lexicon: HALOT
  rationale: 히브리어의 집단 명칭을 한국어 성경에서 널리 통용되는 족속 표현으로 옮겼습니다.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  english_pob_choice: carrying the holy things
  chosen_korean: 거룩한 것들을 메고
  alternatives_korean:
  - 성막의 물건들을 메고
  - 성소의 것들을 메고
  lexicon: HALOT
  rationale: 문맥상 성막 구조물 자체가 아니라 거룩한 기물들을 가리키는 메타닉 용법이므로, 오해를 줄이기 위해 ‘거룩한 것들’로 옮겼습니다.
- source_word: וְהֵקִימוּ אֶת הַמִּשְׁכָּן
  english_pob_choice: and the tabernacle was set up
  chosen_korean: 성막은 세워져 있었습니다
  alternatives_korean:
  - 성막이 세워졌습니다
  - 성막을 세웠습니다
  lexicon: HALOT
  rationale: 히브리어의 주어 없는 완료형을 바탕으로, 고핫 자손에게 세움의 주체를 돌리지 않도록 수동적 결과 상태로 옮겼습니다.
theological_decisions:
- issue: 성막과 거룩한 기물의 구분
  chosen_reading: ‘거룩한 것들’과 ‘성막’을 구별하여 번역했습니다.
  alternative_readings:
  - ‘성막’으로 통일해서 번역
  - ‘성소의 물건들’로 번역
  rationale: 본문은 고핫 자손이 운반한 거룩한 기물들과, 먼저 세워진 성막 구조물을 구별합니다. 이 구분을 흐리면 본문 의미가 손상됩니다.
  doctrine_reference: 민수기 4장 운반 규정과 성막 봉사 질서
- issue: 성막 세움의 주체
  chosen_reading: 성막은 세워져 있었습니다
  alternative_readings:
  - 그들이 성막을 세웠습니다
  - 성막이 세워졌습니다
  rationale: 본문의 동사 형태와 바로 앞뒤 문맥을 고려하면, 고핫 자손이 성막을 세운 것으로 읽지 않아야 합니다. 수동적 표현이 이 긴장을 가장 안전하게 보존합니다.
  doctrine_reference: 민수기 10:17-21의 행진·설치 순서
