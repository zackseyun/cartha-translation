  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
  footnotes:
  - marker: a
    text: Or, more literally, 'that good which the LORD will do with us, we will do for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 당신이 우리와 함께 가면, 야훼께서 우리에게 하시는 모든 선을 우리도 당신에게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘야훼께서 우리와 함께 하실 그 선을 우리가 당신에게 하겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 그리고 만약
  - 그리고 ~라면
  lexicon: HALOT
  rationale: 조건문을 자연스러운 한국어로 풀어, 결과를 여는 연결어로서의 기능을 살렸습니다.
- source_word: תֵלֵךְ עִמָּנוּ
  english_pob_choice: you go with us
  chosen_korean: 우리와 함께 가면
  alternatives_korean:
  - 우리와 함께 가면
  - 우리와 동행하면
  - 우리와 같이 가면
  lexicon: HALOT
  rationale: הלך + עִם의 동행 의미를 현대 한국어의 ‘함께 가다’로 직접 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 공개 프로젝트 기본값에 따라 신명은 호칭이 아니라 고유명으로서 ‘야훼’로 옮겼습니다.
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב
  english_pob_choice: whatever good Yahweh does for us
  chosen_korean: 야훼께서 우리에게 하시는 모든 선
  alternatives_korean:
  - 야훼께서 우리에게 베푸시는 선
  - 야훼께서 우리에게 하시는 그 선
  lexicon: HALOT
  rationale: ‘good’의 개념을 구체적 혜택이 아니라 야훼의 선한 행위로 이해하여, 반복되는 טוב/ייטיב의 대응을 한국어로 유지했습니다.
- source_word: וְהֵטַבְנוּ לָךְ
  english_pob_choice: we will do good to you
  chosen_korean: 우리도 당신에게 하겠습니다
  alternatives_korean:
  - 우리도 당신에게 선을 베풀겠습니다
  - 우리도 당신을 잘 대하겠습니다
  lexicon: HALOT
  rationale: 앞절의 ‘하시는’과 맞물리는 동사 반복을 살려, 행위의 상호성을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 여호와/주 대신 신명 יְהוָה의 표기
  chosen_reading: 본문의 신명은 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님이 언약적으로 ‘좋은 것’을 행하시는 주체를 고유명으로 지칭하므로, тит틀 대체를 피하고 신명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
