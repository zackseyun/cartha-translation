    rationale: 문법적으로 가능하지만 현대 한국어에서는 자기 이익을 위한 제작이라는 인상을 주기 쉽습니다. 이 절에서는 명령을 받는 모세가 이 나팔을 사용하도록 주어진다는 용도/수령자 의미이므로, 한국어에서는 대명사를 생략하는 편이 자연스럽습니다.
