  text: 은 나팔 두 개를 만드십시오. 그것들은 두드려 만든 것이어야 하며, 회중을 소집하는 데[a] 그리고 진영들을 출발시키는 데 쓰일 것입니다.[b]
  philosophy: optimal-equivalence
