lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  english_pob_choice: Make for yourself
  chosen_korean: 자신을 위하여
  alternatives_korean:
  - 스스로
  - 당신을 위하여
  - 네 자신을 위해
  lexicon: HALOT
  rationale: 명령형과 여격 לְךָ의 반사적 뉘앙스를 살리되, 현대 한국어에서는 ‘자신을 위하여’가 가장 자연스럽고 직역 티가 덜 납니다.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  english_pob_choice: two silver trumpets
  chosen_korean: 은 나팔 두 개
  alternatives_korean:
  - 두 개의 은 나팔
  - 은으로 된 두 나팔
  lexicon: HALOT
  rationale: חֲצֹצְרָה는 일반적인 ‘나팔’로 옮기고, כֶּסֶף의 재료 의미는 ‘은’으로 간결하게 살렸습니다.
- source_word: מִקְשָׁה
  english_pob_choice: of hammered work
  chosen_korean: 두드려 만든 것으로
  alternatives_korean:
  - 망치로 두드려 만든 것으로
