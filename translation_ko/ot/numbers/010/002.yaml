source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
  footnotes:
  - marker: a
    text: Or 'for calling the congregation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and for the departure of the camps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자신을 위하여 은 나팔 두 개를 만드십시오. 그것들을 두드려 만든 것으로 만들어야 하며, 그것들은 회중을 소집하고 진영들이 출발하도록 하기 위한 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “회중을 부르기 위한”이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “진영들의 출발을 알리기 위한”이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  english_pob_choice: Make for yourself
  chosen_korean: 자신을 위하여
  alternatives_korean:
  - 스스로
  - 당신을 위하여
  - 네 자신을 위해
  lexicon: HALOT
  rationale: 명령형과 여격 לְךָ의 반사적 뉘앙스를 살리되, 현대 한국어에서는 ‘자신을 위하여’가 가장 자연스럽고 직역 티가 덜 납니다.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  english_pob_choice: two silver trumpets
  chosen_korean: 은 나팔 두 개
  alternatives_korean:
  - 두 개의 은 나팔
  - 은으로 된 두 나팔
  lexicon: HALOT
  rationale: חֲצֹצְרָה는 일반적인 ‘나팔’로 옮기고, כֶּסֶף의 재료 의미는 ‘은’으로 간결하게 살렸습니다.
- source_word: מִקְשָׁה
  english_pob_choice: of hammered work
  chosen_korean: 두드려 만든 것으로
  alternatives_korean:
  - 망치로 두드려 만든 것으로
  - 단조한 것으로
  - 두드린 공예로
  lexicon: HALOT
  rationale: 금속을 두드려 만든 제작 방식을 드러내는 표현으로 옮겼고, 결과물의 모양을 과도하게 해석하는 ‘한 덩어리로’는 피했습니다.
- source_word: לְמִקְרָא הָעֵדָה
  english_pob_choice: for summoning the congregation
  chosen_korean: 회중을 소집하고
  alternatives_korean:
  - 회중을 부르고
  - 회중을 모으고
  lexicon: HALOT
  rationale: מִקְרָא는 단순 호출보다 공적 소집의 뜻이 강하므로, 공동체를 공식적으로 불러 모으는 의미를 살렸습니다.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  english_pob_choice: and for setting out the camps
  chosen_korean: 진영들이 출발하도록 하기 위한 것이 될 것입니다
  alternatives_korean:
  - 진영들을 출발시키기 위한 것이 될 것입니다
  - 진영들이 떠나도록 하기 위한 것이 될 것입니다
  - 진영들의 출발을 위한 것이 될 것입니다
  lexicon: HALOT
  rationale: מַסַּע는 여기서 진영의 이동/출발 신호를 가리키므로, ‘출발하도록 하기 위한 것’으로 목적과 기능을 분명히 했습니다.
theological_decisions:
- issue: 명령문과 목적문을 한국어에서 어떻게 자연스럽게 연결할지
  chosen_reading: 앞의 명령을 그대로 살리면서, 뒤의 용도를 ‘~하기 위한 것이 될 것입니다’로 풀어 기능을 분명히 했습니다.
  alternative_readings:
  - '...그리고 진영들이 출발하게 할 것입니다'
  - '...그리고 진영들의 출발에 쓸 것입니다'
  rationale: 이 절은 제작 명령과 용도를 함께 주기 때문에, 과도한 의역 없이 명령-목적 구조를 한국어에서 읽히도록 옮기는 것이 중요합니다.
  doctrine_reference: 본문의 서술 기능을 보존하는 번역 원칙
