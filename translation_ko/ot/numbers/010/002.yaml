    rationale: מִקְשָׁה는 두드려 만든 금속 세공품이라는 제작 방식을 뜻합니다. ‘만든 것으로 만들어야’는 같은 동작을 중복하므로 ‘두드려 만든 것이어야 하며’로 바로 표현하는 것이 정확하고 자연스럽습니다.
