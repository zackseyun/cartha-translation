  text: וּ/תְקַעְתֶּ֖ם תְּרוּעָ֑ה וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים קֵֽדְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
  footnotes:
  - marker: a
    text: Or 'a signal blast.' The Hebrew term refers here to the distinctive trumpet sounding that signaled movement of the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 경보 신호를 울리면[a], 동쪽에 진을 친 진영들이 출발해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신호 나팔 소리’. 여기서 히브리어는 진영의 이동을 알리는 구별된 나팔 신호를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  english_pob_choice: When you blow
  chosen_korean: 당신들이 ... 불면
  alternatives_korean:
  - 당신들이 ... 불 때
  - 나팔을 불면
  - 불어 알리면
  lexicon: HALOT
  rationale: תקע는 이 문맥에서 나팔을 ‘불다/울리다’는 뜻이므로, 조건·시점의 의미를 자연스럽게 살려 합쇼체로 옮겼습니다.
- source_word: תְּרוּעָה
  english_pob_choice: an alarm blast
  chosen_korean: 알람 나팔
  alternatives_korean:
  - 신호 나팔
  - 경보 나팔
  - 알람 소리
  lexicon: HALOT
  rationale: Numbers 10의 신호 체계에서 תְּרוּעָה는 단순한 소리보다 이동을 알리는 특수한 나팔 신호이므로, 한국어로도 그 기능이 드러나게 옮겼습니다.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  english_pob_choice: the camps that are camped
  chosen_korean: 진 친 진영들
  alternatives_korean:
  - 진을 친 진영들
  - 주둔한 진영들
  - 캠프들
  lexicon: HALOT
  rationale: 복수 ‘진영들’과 현재분사 ‘진 친/진을 친’의 상태를 함께 살려, 이스라엘 각 진영의 배치 상황을 드러내는 표현으로 옮겼습니다.
- source_word: קֵדְמָה
  english_pob_choice: on the east side
  chosen_korean: 동쪽에
  alternatives_korean:
  - 동쪽으로
  - 동편에
  - 동쪽 편에
  lexicon: HALOT
  rationale: 방향 부사 קֵדְמָה는 진영 배치의 위치를 가리키므로, 자연스럽고 분명한 위치 표현인 ‘동쪽에’로 옮겼습니다.
theological_decisions:
- issue: 나팔 신호의 성격
  chosen_reading: 여기서 תְּרוּעָה를 일반적 ‘소리’가 아니라, 야훼의 진영 이동을 지시하는 기능적 경보 신호로 이해했습니다.
  alternative_readings:
  - 단순한 나팔 소리
  - 군사적 함성
  - 일반적인 신호
  rationale: 문맥상 이 표현은 회중 이동을 개시하는 규정된 신호이므로, 기능을 살리는 번역이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 민수기 10장 나팔 규례
