  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어 성경 독자에게 익숙한 준전통 표현을 사용했습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 부대별
