  rationale: צבאות의 조직된 무리/편제를 드러내기 위해 '부대'를 사용했고, 전치 의미는 한국어 어순상 '-별'로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여행 목록의 종결 진술을 한국어로 어떻게 표지할지
  chosen_reading: '''이것들은 …이었고, 그들은 출발했습니다''로 요약적 종결을 살렸습니다.'
  alternative_readings:
  - '''이것들은 …이었다'''
  - '''이것들은 …이었습니다'''
  rationale: 히브리어의 목록 종료 선언과 이어지는 서술을 현대 한국어에서 과도한 의역 없이 읽히게 하기 위해 접속형 종결을 사용했습니다.
  doctrine_reference: 서사문 번역의 충실성
