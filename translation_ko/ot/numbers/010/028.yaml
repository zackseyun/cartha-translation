  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
  footnotes:
  - marker: a
    text: Or 'the journeys' or 'the departures' for 'the stages.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites'; literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'according to their hosts' or 'by their companies.' The Hebrew suggests organized groupings for travel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 이스라엘 자손의 그들의 부대별 이동이었고, 그들은 출발했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַסְעֵי는 문맥상 '이동들', '여정들', '출발들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '이스라엘의 아들들'입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 לְצִבְאֹתָם는 '그들의 부대별로', '그들의 진영별로', 또는 '그들의 무리대로'의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
