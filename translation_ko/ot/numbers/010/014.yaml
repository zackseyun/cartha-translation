  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
  footnotes:
  - marker: a
    text: Or 'banner' for 'standard.' The Hebrew term denotes the tribal ensign under which the camp unit marched.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their companies/hosts.' The Hebrew has a military-organizational term for the ordered tribal units.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 자손의 진의 기가 먼저 출발하였습니다[a], 그들의 대열대로였으며[b] 그 진의 지휘관은 암미나답의 아들 나손이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깃발’. כאן의 דֶּגֶל은 진이 행진할 때 사용한 부족 표식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 군대/부대대로’. 히브리어는 질서 있게 편성된 집단을 가리키는 군사적 조직 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  english_pob_choice: set out
  chosen_korean: 출발하였습니다
  alternatives_korean:
  - 떠났습니다
  - 진군하였습니다
  - 길을 떠났습니다
  lexicon: WLC / BDB
  rationale: 광야 이동 문맥에서 진을 걷어 이동하는 뜻을 자연스럽게 살려, 단순한 ‘떠나다’보다 행진·이동의 상황을 함께 담았습니다.
- source_word: דֶּגֶל
  english_pob_choice: standard
  chosen_korean: 기
  alternatives_korean:
  - 표준
  - 깃발
  - 군기
  lexicon: WLC / HALOT
  rationale: 부족 진영을 이끄는 표식이라는 의미를 살려 군사적·진영적 뉘앙스가 있는 ‘기’를 택했습니다. 한국어 교회용어의 과도한 전통화보다 원문의 기능을 우선했습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 대열대로
  alternatives_korean:
  - 그들의 분대대로
  - 그들의 부대대로
  - 그들의 군대대로
  lexicon: WLC / HALOT
  rationale: צָבָא 계열의 조직된 집단을 가리키므로, 군사적 조직성을 보이되 현대 독자가 이해하기 쉬운 ‘대열’로 옮겼습니다.
- source_word: וְעַל צְבָאוֹ
  english_pob_choice: and over its division was
  chosen_korean: 그 진의 지휘관은
  alternatives_korean:
  - 그 대열의 우두머리는
  - 그 부대의 책임자는
  - 그 진영의 상관은
  lexicon: WLC / HALOT
  rationale: 히브리어의 ‘~ 위에 있다’는 표현을 한국어로는 담당자·책임자 의미가 분명한 ‘지휘관’으로 풀어, 구조와 의미를 함께 살렸습니다.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  english_pob_choice: Nahshon son of Amminadab
  chosen_korean: 암미나답의 아들 나손
  alternatives_korean:
  - 나손, 암미나답의 아들
  - 암미나답 아들 나손
  lexicon: WLC / transliteration
  rationale: 고유명사는 한국어 관용 표기를 따르되, 족보 관계는 원문처럼 보존했습니다.
theological_decisions:
- issue: 이 구절의 군사적 조직 표현(‘기/대열/지휘관’)을 얼마나 직역할지
  chosen_reading: 이스라엘 진영의 질서 있는 행진 구조를 드러내기 위해 군사·행렬 이미지를 유지했습니다.
  alternative_readings:
  - 부족의 깃발이 먼저 떠났습니다
  - 유다 진영이 먼저 움직였습니다
  rationale: 원문은 단순 이동이 아니라 정해진 순서와 책임 체계를 가진 행진을 말하므로, 이를 흐리지 않도록 조직적 표현을 살렸습니다.
  doctrine_reference: 민수기 2–10장의 진 편성과 행진 질서
