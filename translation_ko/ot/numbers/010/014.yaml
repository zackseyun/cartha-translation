    issue: ‘그들의 대열대로였으며’의 의미 및 문장 연결이 불명료합니다.
    rationale: לְצִבְאֹתָם은 행진하는 집단의 편성 단위를 가리킵니다. ‘그들의 부대별로’가 ‘각 부대의 편성에 따라’라는 뜻을 더 분명히 전달하며, 앞뒤 문장도 자연스럽게 연결합니다.
