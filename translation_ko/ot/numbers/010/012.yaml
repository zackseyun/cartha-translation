    text: 또는 ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 친족 표현을 살리되 한국어에서는 자연스러운 성경적 관용구인 ‘자손’을 사용해 원문의 투명성을 유지했습니다.
- source_word: לְמַסְעֵיהֶם
  english_pob_choice: by stages
  chosen_korean: 그들의 행진 순서대로
  alternatives_korean:
  - 단계적으로
  - 그들의 여정대로
  lexicon: HALOT
  rationale: 명사 מַסָּע의 ‘행진/이동 단계’라는 분배적 의미를 살리면서, 현대 한국어에서 의미가 분명한 표현으로 옮겼습니다.
- source_word: וַיִּשְׁכֹּן
  english_pob_choice: settled
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 자리잡았습니다
  - 거하였습니다
  lexicon: HALOT
  rationale: 구름이 특정 장소에 멈추어 있는 장면이므로, 정지와 지속을 함께 드러내는 ‘머물렀습니다’가 가장 자연스럽습니다.
- source_word: מִדְבַּר פָּארָן
  english_pob_choice: the wilderness of Paran
  chosen_korean: 바란 광야
  alternatives_korean:
  - 바란의 광야
  - 파란 광야
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 맞춰 ‘바란’으로 음역하고, מִדְבָּר는 광야로 옮겨 본문의 지리적 배경을 유지했습니다.
theological_decisions:
- issue: 이스라엘 자손의 성별-표시를 어떻게 반영할 것인가
  chosen_reading: ‘이스라엘 자손’으로 원문의 남성 복수 친족 표현을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 이 구절은 단순한 집합명사가 아니라 히브리어의 명시적 가족/계보 표현을 사용하므로, 본문이 실제로 말하는 형태를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
