  source_fidelity: ‘그러면’은 조건·귀결의 뉘앙스를 내므로 히브리어 와우 연속형의 단순 서술 진행에 맞지 않습니다. 또한 ‘분열대’는 현대 한국어에서 행진 편제의 뜻으로 자연스럽지 않고, ‘움직였고’는 원문의 ‘출발하였다’와 후위 역할의 관계를 다소 흐립니다. 수정문은 단 지파 진영의 깃발이 출발하고 전체 진영의 후위를 맡았다는 구조와, 그 편성 및 지휘관을 충실히 보존합니다.
  naturalness: ‘그들의 부대 편성에 따라 모든 진영의 후위를 맡아 출발했습니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 행진 질서의 문맥도 명료합니다. ‘그 부대의 지휘자는’은 על צבאו의 지휘 관계를 한국어 관용에 맞게 드러냅니다.
  terminology: דגל은 ‘깃발’, מְאַסֵּף는 ‘후위를 맡아’, צבאות는 이 문맥에서 ‘부대 편성’으로 옮겼습니다. 아히에셀과 암미삿대는 통용되는 한글 음역을 유지했습니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
  issues:
