id: NUM.10.25
reference: Numbers 10:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bringing up the rear' for 'serving as the rear guard.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term can also be rendered 'hosts' or 'companies'; here it refers to the organized tribal divisions in the marching order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 단 지파 진의 깃발이 출발하여, 모든 진의 후위가 되어 그들의 분열대로 움직였고, 그 군대의 지휘자는 암미삿대의 아들 아히에셀이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃발’은 여기서 행진을 이끄는 지파 표지를 뜻하며, 경우에 따라 ‘표준기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘후위’는 ‘뒤를 지키는 부대’ 또는 ‘뒤를 따라가며 보호하는 역할’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 צבאות는 여기서 전투군이라기보다 행진 질서 속의 조직된 편제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  english_pob_choice: Then ... set out
  chosen_korean: 그러면 ... 출발하여
  alternatives_korean:
  - 그리고 ... 출발하여
  - 그때 ... 떠나
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 살리면서, 이동 맥락에서 자연스러운 현대식 표현으로 ‘출발하다’를 택했습니다.
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 배너
  - 표준기
  lexicon: HALOT
  rationale: 지파의 행진 표지를 가리키므로 한국어로 가장 직관적인 ‘깃발’로 옮겼습니다.
- source_word: מְאַסֵּף
  english_pob_choice: serving as the rear guard
  chosen_korean: 후위가 되어
  alternatives_korean:
  - 후위를 맡아
  - 뒤를 지키며
  lexicon: HALOT
  rationale: 행군 질서에서 뒤를 맡는 기능을 간결하게 드러내는 표현으로, 단순히 ‘뒤따르다’보다 방어적 역할을 살렸습니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 분열대로
  alternatives_korean:
  - 그들의 대오대로
  - 그들의 부대별로
  lexicon: HALOT
  rationale: צבאות을 ‘군대’의 일반 의미로만 좁히지 않고, 본문 문맥의 조직된 행진 단위를 살려 ‘분열’로 옮겼습니다.
- source_word: וְעַל צְבָאוֹ
  english_pob_choice: and over its company was
  chosen_korean: 그 군대의 지휘자는
  alternatives_korean:
  - 그 분열의 지휘자는
  - 그 대오를 맡은 사람은
  lexicon: HALOT
  rationale: ‘~ 위에 있다’는 히브리어 관용을 한국어에서 자연스럽게 풀어 ‘지휘자’로 표현해, 해당 편제의 책임자를 분명히 했습니다.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  english_pob_choice: Ahiezer the son of Ammishaddai
  chosen_korean: 암미삿대의 아들 아히에셀이었습니다
  alternatives_korean:
  - 아히에셀
  - 아히에셀, 암미삿대의 아들
  lexicon: HALOT
  rationale: 고유명사는 현대 한글 음역을 따랐고, 히브리어 친족 표지 ‘בן’을 자연스럽게 ‘~의 아들’로 옮겼습니다.
theological_decisions:
- issue: 행군 질서와 군사적 이미지의 보존
  chosen_reading: 단 지파의 깃발과 후위, 지휘자를 모두 살려 이 본문이 단순 이동 설명이 아니라 질서 정연한 공동체 행진을 묘사한다는 점을 드러냈습니다.
  alternative_readings:
  - 부드럽게 순서만 강조하는 표현
  - 군사적 뉘앙스를 약화한 번역
  rationale: 본문의 핵심은 각 지파가 정해진 편제와 책임 아래 움직이는 질서이므로, 이를 희석하지 않고 전달하는 것이 원문 의도에 부합합니다.
  doctrine_reference: 민수기 2–10장의 진영/행군 질서
