    text: 히브리어는 “이스라엘의 수만의 수천”이라고 하며, 매우 큰 수를 강조하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여호와의 고유 이름 יְהוָה를 직접 사용합니다.
    reason: ot_citation
