  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
  footnotes:
  - marker: a
    text: Or 'standard' for 'banner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their companies/hosts'; the Hebrew term can carry an organized, military-style sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 르우벤 진영의 깃발[a]이 그들의 부대 편성대로[b] 출발하였으며, 그 부대를 지휘한 이는 스데우르의 아들 엘리술이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 부대들’, ‘그들의 군대들’. 히브리어는 조직된 행군 단위들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  english_pob_choice: Then ... set out
  chosen_korean: 그때 ... 출발하였고
  alternatives_korean:
  - 그리고 ... 나아갔고
  - 그때 ... 떠났고
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 살려 시간적 연속을 나타내면서, 진영 이동 문맥에 자연스러운 ‘출발하였고’를 택했습니다.
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 기
  - 표준
  lexicon: HALOT
  rationale: 진영이 움직일 때 앞서는 가시적 표지라는 점을 살려 현대 한국어의 ‘깃발’로 옮겼습니다. ‘기’도 가능하지만 더 문어적이고, ‘표준’은 의미가 추상적으로 흐릅니다.
- source_word: לְצִבְאֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 그들의 분대대로
  alternatives_korean:
  - 그들의 부대대로
  - 그들의 무리대로
  - 그들의 군대로
  lexicon: HALOT
  rationale: צָבָא의 조직된 행군 단위라는 점을 살려 ‘분대’ 계열로 옮겼고, 복수 표지를 보이기 위해 ‘-대로’를 붙였습니다. 군사적 뉘앙스는 있으나 전투보다 질서 정연한 편성에 초점을 맞춘 표현입니다.
- source_word: וְעַל צְבָאוֹ
  english_pob_choice: and over its company was
  chosen_korean: 그 군대[b] 위에는
  alternatives_korean:
  - 그 부대 위에는
  - 그 편성 위에는
  - 그 분대 위에는
  lexicon: HALOT
  rationale: עַל의 감독·책임 관계를 한국어의 ‘~위에는’으로 자연스럽게 드러냈습니다. כאן의 singular צְבָאֹו는 앞선 복수와 달리 그 깃발에 속한 단일 편성/집단을 가리키므로 ‘군대’로 유지했습니다.
- source_word: אֱלִיצוּר
  english_pob_choice: Elizur
  chosen_korean: 엘리술
  alternatives_korean:
  - 엘리주르
  - 엘리추르
  lexicon: Standard transliteration
  rationale: 고유명사는 현대 음역 관행에 따라 옮겼습니다.
