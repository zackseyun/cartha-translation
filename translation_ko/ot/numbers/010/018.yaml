  source_fidelity: 초안은 행군 순서와 엘리술의 지휘 관계를 대체로 반영하지만, לְצִבְאֹתָם의 복수 조직 단위를 ‘분대’로 특정한 것은 지나치게 좁습니다. 또한 וְעַל־צְבָאוֹ의 권위 관계는 ‘군대 위에는’보다 ‘부대를 지휘한 이’로 옮기는 편이 한국어에서 정확하고 자연스럽습니다.
  naturalness: ‘그들의 분대대로’와 ‘그 군대 위에는’은 현대 표준 한국어 문장으로 부자연스럽거나 의미가 불명확합니다. ‘부대 편성대로’ 및 ‘그 부대를 지휘한 이는’으로 고치면 행군·지휘 문맥이 분명해집니다.
  terminology: דֶּגֶל은 ‘깃발’로 유지할 수 있으며, 각주에서 ‘기’를 대안으로 제시합니다. צָבָא는 본문에서 ‘부대 편성’/‘부대’로 일관되게 옮겨 군사적 조직성과 행군 문맥을 함께 보존합니다. 인명은 한국어 성경 음역 관행에 맞춰 ‘엘리술’, ‘스데우르’로 표기합니다.
