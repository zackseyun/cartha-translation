id: NUM.10.33
reference: Numbers 10:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
  footnotes:
  - marker: a
    text: Or 'three days' journey' in both occurrences of the phrase.
    reason: lexical_alternative
  - marker: b
    text: Or 'to scout out' or 'to search out' a place of rest for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 산에서 삼 일 길을 떠났습니다. 그리고 야훼의 언약궤가 그들 앞에서 삼 일 길을 가며 그들을 위한 안식처를 찾아 나섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삼 일 길’은 히브리어의 관용적 표현으로, ‘삼 일 여정’ 또는 ‘삼 일 동안의 길’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘찾아 나서’는 ‘정탐하다’나 ‘탐색하다’의 가능성을 덜 군사적이고 더 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton (YHWH)
  rationale: 원문은 고유명사 יְהוָה를 직접 사용하므로, POB의 기본 원칙에 따라 신적 호칭이 아니라 신명 자체를 한국어로 옮겨 야훼를 택했습니다.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: for a journey of three days
  chosen_korean: 삼 일 길을
  alternatives_korean:
  - 삼 일 여정으로
  - 삼 일 동안
  lexicon: HALOT
  rationale: 여기서 דֶּרֶךְ은 단순한 시간 지속이 아니라 이동의 거리·코스를 가리키므로, 한국어에서도 ‘삼 일 길’로 옮겨 여행의 범위를 살렸습니다.
- source_word: נֹסֵעַ
  english_pob_choice: set out
  chosen_korean: 가며
  alternatives_korean:
  - 떠나며
  - 가고
  lexicon: HALOT
  rationale: 분사형의 진행성을 살리되, 문장 전체의 흐름 안에서 ‘가며’로 처리해 언약궤의 선행 이동을 자연스럽게 드러냈습니다.
- source_word: לָתוּר
  english_pob_choice: to seek out
  chosen_korean: 찾아 나서
  alternatives_korean:
  - 탐색하다
  - 수색하다
  - 정탐하다
  lexicon: HALOT
  rationale: 대상이 전투 정보가 아니라 머물 곳이므로 군사적 뉘앙스의 ‘정탐하다’보다, 목적지를 찾아 적극적으로 나선다는 뜻의 ‘찾아 나서’가 원문의 의미를 더 잘 살립니다.
- source_word: מְנוּחָה
  english_pob_choice: a resting place
  chosen_korean: 안식처
  alternatives_korean:
  - 쉼터
  - 쉼
  - 휴식처
  lexicon: HALOT
  rationale: 추상적 ‘쉼’보다 이동 맥락에서의 구체적 목적지를 가리키므로, 도착 가능한 장소성을 드러내는 ‘안식처’로 옮겼습니다.
theological_decisions:
- issue: 여호와/주님의 관용적 대체 여부
  chosen_reading: 원문 고유명사 יְהוָה를 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 야훼의 산과 야훼의 언약궤를 병렬로 제시하여 신적 주권과 임재를 강조하므로, 전통적 대체어보다 신명 자체를 드러내는 번역이 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
