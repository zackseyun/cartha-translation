source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
  footnotes:
  - marker: a
    text: Hebrew חֹתֵן can refer more broadly to a relation by marriage; some understand this as 'Moses’ brother-in-law' or 'relative by marriage' rather than 'father-in-law.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 미디안 사람 르우엘의 아들 호밥—모세의 장인[a]—에게 말했습니다. “우리는 야훼께서 ‘내가 그것을 너희에게 주겠다’고 말씀하신 곳으로 떠납니다. 우리와 함께 가십시오. 그러면 우리가 당신을 잘 대하겠습니다. 야훼께서 이스라엘에 관하여 좋은 말씀을 하셨기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹתֵן은 ‘장인’뿐 아니라 혼인으로 맺어진 친족을 더 넓게 가리킬 수도 있습니다. 따라서 일부는 이를 ‘모세의 처남’ 또는 ‘혼인 친족’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  english_pob_choice: Hobab
  chosen_korean: 호밥
  alternatives_korean:
  - 호바브
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 성경에서 널리 통용되는 형태인 ‘호밥’을 택했습니다.
- source_word: הַמִּדְיָנִי
  english_pob_choice: the Midianite
  chosen_korean: 미디안 사람
  alternatives_korean:
  - 미디안인
  - 미디안 족속 사람
  lexicon: HALOT
  rationale: 지명/민족 형용사를 한국어 관용에 맞게 ‘미디안 사람’으로 옮겨 소속을 분명히 했습니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses’ father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 사돈
  - 모세의 혼인 친족
  lexicon: HALOT
  rationale: 문맥상 가장 자연스러운 1차 뜻을 살려 ‘장인’으로 옮겼고, 한국어 독자가 인척관계 표현으로 바로 이해할 수 있게 했습니다.
- source_word: נֹסְעִים אֲנַחְנוּ
  english_pob_choice: We are setting out
  chosen_korean: 우리는 … 향해 떠납니다
  alternatives_korean:
  - 우리는 가고 있습니다
  - 우리는 출발합니다
  lexicon: HALOT
  rationale: 진행/임박의 뉘앙스를 살리면서 한국어로는 자연스러운 이동 시작 표현인 ‘떠납니다’를 사용했습니다.
- source_word: וְהֵטַבְנוּ לָךְ
  english_pob_choice: and we will do you good
  chosen_korean: 우리가 당신에게 선을 베풀겠습니다
  alternatives_korean:
  - 우리가 당신을 잘 대하겠습니다
  - 우리가 당신에게 잘해 주겠습니다
  lexicon: HALOT
  rationale: 히필의 ‘유익하게 하다’ 의미를 직역에 가깝게 유지하되, 한국어에서 자연스럽고 공손하게 들리는 ‘선을 베풀겠습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공용 번역 관행 대신 문서의 기본 원칙에 따라 언약명 YHWH를 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 야훼의 언약명 보존
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨, 단순한 호칭이 아니라 고유한 신적 이름이 드러나게 했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 직접 발언을 인용하므로, 이름을 직함으로 바꾸기보다 본문이 드러내는 언약적 신원성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘모세의 장인’의 관계 범위
  chosen_reading: 주본문은 가장 일반적인 친족관계 뜻인 ‘장인’을 채택하고, 더 넓은 혼인 친족 가능성은 본문 안에서 과도하게 풀지 않았습니다.
  alternative_readings:
  - 혼인 친족
  - 사돈
  - 매형
  rationale: 히브리어 חֹתֵן은 넓은 친족 범위를 가질 수 있지만, 본절의 주요 기능은 인물 식별이지 족보 논쟁 해결이 아니므로, 본문은 자연스러운 1차 의미를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: lexical ambiguity should be preserved when unresolved by context'
