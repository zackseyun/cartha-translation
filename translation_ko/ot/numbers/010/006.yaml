id: NUM.10.6
reference: Numbers 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/תְקַעְתֶּ֤ם תְּרוּעָה֙ שֵׁנִ֔ית וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים תֵּימָ֑נָ/ה תְּרוּעָ֥ה יִתְקְע֖וּ לְ/מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
  footnotes:
  - marker: a
    text: Or 'blast' or 'signal' for 'alarm' (Hebrew תְּרוּעָה), a distinctive trumpet call used to direct the camps.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 번째 신호를 불면, 남쪽에 진을 친 진영들이 출발해야 합니다. 그들의 출발을 위해 신호를 불 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּתְקַעְתֶּם תְּרוּעָה שֵׁנִית
  english_pob_choice: When you blow a second alarm
  chosen_korean: 두 번째 신호를 불면
  alternatives_korean:
  - 두 번째 경보를 울리면
  - 두 번째 나팔 신호를 불면
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 소리보다 지시용 나팔 신호이므로, 한국어에서는 자연스럽고 기능이 드러나는 ‘신호’로 옮기고, 동작의 조건절을 살려 전체 지시문 흐름을 유지했습니다.
- source_word: הַמַּחֲנוֹת הַחֹנִים תֵּימָנָה
  english_pob_choice: the camps that are encamped on the south side
  chosen_korean: 남쪽에 진을 친 진영들이
  alternatives_korean:
  - 남쪽에 주둔한 진영들이
  - 남쪽에 진을 친 진들
  lexicon: HALOT
  rationale: מַחֲנוֹת와 חֹנִים의 중첩을 반영해 단순한 ‘진영’이 아니라 현재 위치를 설명하는 ‘진을 친’으로 옮겼고, תֵימָנָה는 방향을 분명히 하는 ‘남쪽에’로 처리했습니다.
- source_word: תְּרוּעָ֥ה יִתְקְע֖וּ לְמַסְעֵיהֶם
  english_pob_choice: an alarm shall be blown for their departures
  chosen_korean: 그들의 출발을 위해 신호를 불 것입니다
  alternatives_korean:
  - 그들의 떠남을 위해 신호를 불 것입니다
  - 그들의 출발 시 신호를 불 것입니다
  lexicon: HALOT
  rationale: 마지막 절은 히브리어 수동적/지시적 표현으로 출발 때의 규정된 신호를 말하므로, 한국어에서는 목적어를 살려 ‘그들의 출발을 위해’와 자연스러운 수동 표현을 결합했습니다.
