    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - …을 맡은
  - …을 관할하는
  lexicon: HALOT
  rationale: 캠프 질서 문맥에서 ‘~위에는’이 원문의 위임·배치 관계를 가장 자연스럽게 드러내며, 반복 공식의 형식도 유지합니다.
- source_word: צְבָא
