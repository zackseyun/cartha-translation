  - 므낫세의 후손들
  lexicon: HALOT
  rationale: 지파 명칭으로 굳어진 족속 표현이므로, 현대 한국어에서 가장 자연스럽고 성별 함의를 과도하게 확장하지 않는 ‘자손’으로 옮겼습니다.
- source_word: פְּדָה צוּר
  english_pob_choice: Pedahzur
  chosen_korean: 브다수르
  alternatives_korean:
  - 페다수르
