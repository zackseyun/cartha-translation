  rationale: 여기서는 전투군보다 광야 행진 질서 속의 편제된 집단을 가리키므로, 행정적·조직적 뉘앙스를 살린 ‘부대’가 적절합니다.
- source_word: בְּנֵי מְנַשֶּׁה
  english_pob_choice: the sons of Manasseh
  chosen_korean: 므낫세 자손
  alternatives_korean:
