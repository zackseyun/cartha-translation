base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
  footnotes:
  - marker: a
    text: Or 'host' or 'division' for 'company'; the Hebrew צְבָא often has military overtones, but here it refers to the ordered tribal marching group.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 갓 자손 지파의 부대[a]를 맡은 이는 드우엘의 아들 엘리아삽이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 차바(צָבָא)는 ‘군대’, ‘부대’, 또는 질서 있게 편성된 집단을 뜻할 수 있습니다. 여기서는 갓 지파의 행진 편성 단위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - 그리고 …을/를 맡은
  - 그리고 …에 대하여
  lexicon: HALOT
  rationale: 반복되는 진영 질서 목록에서 עַל의 감독·책임 관계를 한국어의 ‘위에는’으로 옮겨, 단순한 위치가 아니라 상위 책임을 드러냈습니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 군대
  alternatives_korean:
  - 부대
  - 무리
  - 진영
  lexicon: HALOT
  rationale: 여기서는 각 지파의 정렬된 행진 집단을 가리키므로, POB의 ‘company’보다 군사적 뉘앙스를 유지하는 ‘군대’가 מקור의 질서성과 집합성을 더 직접적으로 반영합니다.
- source_word: מַטֵּה בְנֵי גָד
  english_pob_choice: the tribe of the sons of Gad
  chosen_korean: 갓 자손의 지파
  alternatives_korean:
  - 갓의 자손 지파
  - 갓 사람들의 지파
  - 갓 지파
  lexicon: HALOT
  rationale: מַטֵּה가 여기서는 ‘지팡이’가 아니라 지파를 뜻하므로 ‘지파’로 옮기고, בְנֵי גָד의 직역 구조를 살려 ‘갓 자손’으로 표현했습니다.
- source_word: אֶלְיָסָף
  english_pob_choice: Eliasaph
  chosen_korean: 엘리사밥
  alternatives_korean:
  - 엘리야삽
  - 엘리아삽
  lexicon: 표준 외래어 표기 관행
  rationale: 고유명사는 한국어 성서에서 널리 통용되는 음역인 ‘엘리사밥’을 사용했습니다.
- source_word: בֶּן דְּעוּאֵל
  english_pob_choice: son of Deuel
  chosen_korean: 드에울의 아들
  alternatives_korean:
  - 드우엘의 아들
  - 데우엘의 아들
  lexicon: HALOT
  rationale: 부자 관계의 족보 공식은 직역해 ‘의 아들’로 유지하고, שם דְּעוּאֵל은 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: 지파 행진 질서의 군사적 성격
  chosen_reading: ‘군대’로 옮겨, 각 지파가 무질서한 무리가 아니라 정렬된 행진 단위였다는 점을 드러냈습니다.
  alternative_readings:
  - ‘부대’로 완화해 군사성을 낮추는 읽기
  - ‘진영’으로 공간적 배치를 강조하는 읽기
  rationale: 문맥의 צְבָא에는 실제 전투 부대라기보다 질서정연한 행군 집단의 의미가 있지만, 한국어에서는 그 질서와 조직성을 함께 보여 주는 표현이 필요했습니다.
  doctrine_reference: 민수기 10장의 광야 진영 질서와 지파 편성
