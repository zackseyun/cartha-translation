translation:
  language: ko
  text: 그리고 베냐민 자손의 지파 부대 위에는 아비단, 기드오니의 아들이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - … 위에는
  lexicon: HALOT
  rationale: 연결 접속사와 감독적 위치를 함께 살리기 위해, 앞 구절과 이어 주는 ‘그리고’와 ‘위에는’을 함께 사용했습니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 진영
  - 무리
  - 군대
  lexicon: HALOT
  rationale: 이 문맥에서는 전투군보다 질서 있게 편성된 행진 단위를 가리키므로, 현대 한국어에서 조직성과 편제 감각이 살아 있는 ‘부대’가 가장 가깝습니다.
- source_word: מַטֶּה
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 종족
  - 지파의 깃대
  - 부족
  lexicon: HALOT
  rationale: 민수기의 반복 공식에서 מַטֶּה는 혈연·행정 단위인 ‘지파’를 뜻하므로, 문자적 ‘지팡이’류 의미를 피하고 표준적인 성경 용어를 사용했습니다.
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민의 아들들
  - 베냐민 사람들
  - 베냐민 족속
  lexicon: HALOT
  rationale: 히브리어의 관용적 족보 표현을 살리기 위해 ‘베냐민 자손’을 택했습니다. 반복되는 지파 공식에도 잘 맞습니다.
