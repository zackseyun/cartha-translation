    issue: The appositional expression lacks a connective form or punctuation.
    rationale: In Korean, '아론의 아들들인 제사장들은' naturally expresses the Hebrew apposition ('the sons of Aaron, the priests') and reads more smoothly.
  - severity: low
    issue: The footnote marker follows the sentence-ending punctuation rather than the term it annotates.
    rationale: The note gives lexical alternatives for '영구한 규례,' so its anchor should immediately follow that expression.
