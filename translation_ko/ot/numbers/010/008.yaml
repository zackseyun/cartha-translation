lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  english_pob_choice: And the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 아들들 곧
  - 아론의 아들들인
  lexicon: HALOT
  rationale: בן의 기본 의미를 살려 친족 관계를 직접 드러내되, 한국어에서는 소유격 구문이 가장 자연스럽습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 곧 제사장들은
  alternatives_korean:
  - 제사장들은
  - 제사장들
  lexicon: HALOT
  rationale: 앞 구절의 ‘아론의 아들들’을 제사장으로 동격 설명하는 구조를 살리기 위해 ‘곧’를 넣었습니다.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  english_pob_choice: shall blow the trumpets
  chosen_korean: 나팔을 불어야 합니다
  alternatives_korean:
  - 나팔을 불 것입니다
  - 나팔을 불게 됩니다
  lexicon: HALOT
  rationale: תקע는 나팔을 ‘불다’가 가장 직접적이며, 법규 맥락의 미래·규정적 용법을 한국어에서 ‘-아/어야 합니다’로 자연스럽게 반영했습니다.
- source_word: לְחֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영구한 규례
  alternatives_korean:
  - 영원한 규례
  - 항구한 규례
  lexicon: HALOT
  rationale: חקת עולם의 지속성을 살리되, 본문이 요구하는 법적 규정성을 ‘규례’로 옮기고 ‘영구한’으로 장기적 효력을 드러냈습니다.
theological_decisions:
- issue: לְדֹרֹתֵיכֶם의 시간 범위
