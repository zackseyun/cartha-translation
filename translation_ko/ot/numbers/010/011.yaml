  rationale: מִשְׁכָּן은 이 문맥에서 '성막'이 가장 안정적인 대응어이며, הָעֵדֻת는 성막과 결합된 관용적 표현으로 '증거'를 유지해 성막의 명칭을 보존했습니다.
theological_decisions:
