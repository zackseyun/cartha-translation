  text: 그렇게 된 것은 둘째 해 둘째 달 스무째 날에 구름이 증거의 성막 위에서 떠올랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נַעֲלָה는 여기서 '떠올랐다' 외에도 '올라갔다', '솟아올랐다'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מִשְׁכַּן הָעֵדֻת는 직역하면 '증거의 성막'이며, 문맥에 따라 '증거의 장막'으로도 옮길 수 있습니다.
    reason: alternative_reading
