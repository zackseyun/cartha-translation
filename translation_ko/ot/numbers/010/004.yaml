translation:
  language: ko
  text: 그들이 하나만 불면, 이스라엘의 천 명 단위의 우두머리들인 지도자들이 당신에게 모여들 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 천 명 단위의 우두머리들’은 이스라엘의 천인 편제를 맡은 지도자들을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַחַת
  english_pob_choice: only one
  chosen_korean: 하나만
  alternatives_korean:
  - 한 개만
  - 한 번만
  lexicon: אַחַת
  rationale: 여기서는 나팔을 한 번만/하나만 부는 대비를 나타내므로, 간결하고 자연스러운 ‘하나만’이 원문의 대비를 잘 살립니다.
- source_word: יִתָּקְעוּ
  english_pob_choice: blow
  chosen_korean: 불면
  alternatives_korean:
  - 불 때
  - 분다면
  lexicon: תקע
  rationale: 나팔을 부는 행위를 한국어로 자연스럽게 옮기되, 조건문 안에서 동작을 직접 드러내는 ‘불면’을 택했습니다.
- source_word: וְנוֹעֲדוּ אֵלֶיךָ
  english_pob_choice: shall gather to you
  chosen_korean: 당신에게 모여들 것입니다
  alternatives_korean:
  - 당신에게 모일 것입니다
  - 당신에게 모여들게 될 것입니다
  lexicon: יעד
  rationale: 동사의 뉘앙스는 ‘모이다/소집되다’이므로, 지도자들이 모여 오는 움직임을 분명히 드러내는 표현을 사용했습니다.
- source_word: הַנְּשִׂיאִים רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  english_pob_choice: the leaders, the heads of the thousands of Israel
  chosen_korean: 이스라엘의 천 명 단위의 우두머리들인 지도자들
  alternatives_korean:
  - 이스라엘의 천 명 단위의 우두머리들인 고관들
  - 이스라엘의 천 명 단위의 우두머리들
  lexicon: נשיא / ראש / אלף
  rationale: 원문은 지도자들과 ‘이스라엘의 천 명 단위의 우두머리들’을 동격으로 제시하므로, 계층 구조를 유지하면서도 문자적 의미를 드러내는 방식으로 옮겼습니다.
