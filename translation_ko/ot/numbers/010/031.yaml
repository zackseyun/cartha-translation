  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
  footnotes:
  - marker: a
    text: Or, more literally, “you will be eyes for us,” that is, a guide because of your knowledge of the wilderness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. "부디 우리를 떠나지 마십시오. 당신은 우리가 광야에서 어디에 진을 쳐야 하는지 알고 있으니, 우리에게 눈이 되어 주실 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “우리에게 눈이 되어 주실 것입니다”로, 곧 광야에 대한 지식 때문에 안내자가 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  english_pob_choice: Please do not leave us
  chosen_korean: 부디 우리를 떠나지 마십시오
  alternatives_korean:
  - 우리에게서 떠나지 마십시오
  - 제발 우리를 버리지 마십시오
  lexicon: HALOT
  rationale: אַל + נָא의 간청을 표준적인 공손한 금지로 옮기되, עזב의 기본값인 ‘떠나다’를 살려 지나치게 신학적으로 무거운 ‘버리다’를 피했습니다.
- source_word: כִּי עַל כֵּן
  english_pob_choice: for/because
  chosen_korean: 당신은 … 알고 있으니
  alternatives_korean:
  - 그러므로
  - 왜냐하면
  lexicon: HALOT
  rationale: 이 구문은 요청의 이유를 제시하므로, 한국어에서는 종속절로 자연스럽게 풀어 ‘알고 있으니’로 인과를 드러냈습니다.
- source_word: חֲנֹתֵנוּ בַּמִּדְבָּר
  english_pob_choice: where we should camp in the wilderness
  chosen_korean: 우리가 광야에서 어디에 진을 쳐야 하는지
  alternatives_korean:
  - 우리의 진칠 곳을
  - 광야에서 우리가 어떻게 진을 쳐야 하는지
  lexicon: HALOT
  rationale: חנה의 군사·유목적 ‘진을 치다’ 의미를 살려 ‘진을 치다’로 옮기고, מִדְבָּר는 이스라엘 광야 문맥에 맞는 ‘광야’로 번역했습니다.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  english_pob_choice: and you will be eyes for us
  chosen_korean: 우리에게 눈이 되어 주실 것입니다
  alternatives_korean:
  - 우리의 눈이 되어 주실 것입니다
  - 우리에게 눈 구실을 하실 것입니다
  lexicon: HALOT
  rationale: 직역적 은유를 유지하되 한국어에서 자연스럽게 이해되도록 ‘눈이 되어 주다’로 옮겼습니다. POB의 보존 의도를 따라 ‘안내자’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 은유 ‘eyes for us’의 처리
  chosen_reading: 의역으로 ‘안내자’라 하지 않고, 은유를 살려 ‘우리에게 눈이 되어 주실 것입니다’로 옮겼습니다.
  alternative_readings:
  - 우리의 안내자가 되어 주실 것입니다
  - 우리를 인도해 주실 것입니다
  rationale: 본문은 단순한 길안내보다 광야 지형에 대한 지식으로 보는 기능적 은유를 유지합니다. 한국어에서도 그 이미지를 남겨 독자가 원문의 표현력을 느끼게 했습니다.
  doctrine_reference: 원문 은유 보존 원칙
- issue: 공손한 간청의 어조
  chosen_reading: 명령형의 직설성을 완화하지 않으면서 합쇼체로 ‘부디 … 마십시오’를 사용했습니다.
  alternative_readings:
  - 제발 … 하지 마십시오
  - … 하지 마소서
  rationale: 히브리어의 간청 뉘앙스 נָא를 현대 한국어의 정중한 요청으로 옮기되, 고어체 기도문식 표현은 피했습니다.
  doctrine_reference: 문체 일관성 원칙
