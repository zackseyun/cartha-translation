  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
  footnotes:
  - marker: a
    text: Or 'division' or 'host' for 'company' (Hebrew צְבָא), referring to the organized tribal contingent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시므온 자손의 부대 위에는 수리사닷의 아들 셀루미엘이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - 그리고 … 위에
  - 그리고 …을 맡은
  lexicon: HALOT
  rationale: 진행 순서 속에서 ‘위에’는 배치된 책임자/상위 위치를 자연스럽게 드러내면서, 반복되는 구문도 살립니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 무리
  - 진영
  - 군대
  lexicon: HALOT
  rationale: 이 문맥의 צְבָא 는 전투군이라기보다 질서 있게 편성된 지파 단위이므로, 조직된 집단을 드러내는 ‘부대’가 가장 간결합니다.
- source_word: בְּנֵי שִׁמְעוֹן
  english_pob_choice: the sons of Simeon
  chosen_korean: 시므온 자손
  alternatives_korean:
  - 시므온의 아들들
  - 시므온의 후손
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하되, 한국어에서는 부족/지파 명칭으로 굳어진 관용 표현인 ‘자손’이 자연스럽습니다.
- source_word: שְׁלֻמִיאֵל ... בֶּן צוּרִי שַׁדָּי
  english_pob_choice: Shelumiel son of Zurishaddai
  chosen_korean: 셀루미엘 … 수리사닷의 아들
  alternatives_korean:
  - 셀루미엘 … 수리사닷의 아들인
  - 셀루미엘 … 수리사닷의 아들 셀루미엘
  lexicon: HALOT
  rationale: 고유명사는 음역하고 בֶּן 은 혈연 관계를 분명히 하는 기본형 ‘아들’로 옮겨, 인명 표지를 그대로 보존했습니다.
