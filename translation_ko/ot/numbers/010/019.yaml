  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하되, 한국어에서는 부족/지파 명칭으로 굳어진 관용 표현인 ‘자손’이 자연스럽습니다.
- source_word: שְׁלֻמִיאֵל ... בֶּן צוּרִי שַׁדָּי
  english_pob_choice: Shelumiel son of Zurishaddai
  chosen_korean: 셀루미엘 … 수리사닷의 아들
  alternatives_korean:
