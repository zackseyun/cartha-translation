  source_fidelity: 히브리어 עַל은 이 행군 대형 문맥에서 해당 지파의 조직된 부대 위에 세워진 책임자를 나타냅니다. 초안의 ‘부대 위에는 … 있었습니다’는 기본 의미는 전달하지만, 한국어에서는 위치 관계처럼 들려 책임자 관계가 충분히 드러나지 않습니다. ‘부대를 맡은 이’로 옮기면 원문의 관계와 생략된 서술을 자연스럽게 재현합니다.
