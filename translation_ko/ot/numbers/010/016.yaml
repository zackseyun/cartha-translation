    issue: ‘부대 위에는’이 지휘 관계를 공간적 위치처럼 들리게 합니다.
    rationale: עַל은 이 문맥의 지휘관 공식에서 해당 지파의 부대를 맡거나 지휘한다는 관계를 나타냅니다. 한국어에서는 ‘부대를 지휘한 이’가 의미를 명확히 전달합니다.
