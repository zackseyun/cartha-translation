base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
  footnotes:
  - marker: a
    text: Or 'host' or 'division' for 'company'; the Hebrew צְבָא denotes an organized tribal contingent in marching order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 스불론 자손의 지파의 부대 위에는 헬론의 아들 엘리아브가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무리’, ‘대열’로도 옮길 수 있습니다. 히브리어 צְבָא는 행군 순서에 맞춘 조직된 지파 집단을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 위에는
  alternatives_korean:
  - … 위에는
  - 그리고 … 위에 있었습니다
  lexicon: HALOT
  rationale: 반복되는 진영 행렬 공식에서 접속과 감독의 의미를 함께 살리기 위해 ‘그리고 … 위에는’으로 옮겼습니다.
- source_word: צְבָא
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 부대
  - 무리
  - 대열
  lexicon: HALOT
  rationale: 여기서는 조직된 지파 행렬을 가리키므로, 군사적 뉘앙스를 지나치게 살리지 않으면서도 편제된 집단을 드러내는 ‘부대’가 적절합니다.
- source_word: מַטֵּה בְּנֵי זְבוּלֻן
  english_pob_choice: the tribe of the sons of Zebulun
  chosen_korean: 스불론 자손의 지파
  alternatives_korean:
  - 스불론 자손의 지파
  - 스불론 지파
  - 스불론의 자손의 지파
  lexicon: HALOT
  rationale: 히브리어의 ‘지파’ 구조를 그대로 반영하되, ‘sons of Zebulun’은 종족적 구성원을 뜻하므로 한국어에서도 ‘스불론 자손’으로 살렸습니다.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  english_pob_choice: Eliab son of Helon
  chosen_korean: 헬론의 아들 엘리아브
  alternatives_korean:
  - 헬론의 아들 엘리아브
  - 엘리아브, 헬론의 아들
  lexicon: HALOT
  rationale: 히브리어의 부자 관계를 자연스러운 한국어 속격으로 옮겼고, 인명은 표준 음역을 따랐습니다.
theological_decisions:
- issue: Num 10의 진영 편제 표현을 어떻게 한국어에서 드러낼 것인지
  chosen_reading: ‘부대’와 ‘위에는’으로 번역해, 지파별 질서와 지휘 관계를 함께 보이게 했습니다.
  alternative_readings:
  - ‘대열’로 중립화
  - ‘감독하다’ 같은 동사로 명시화
  rationale: 본문은 단순한 위치 설명이 아니라 이동하는 공동체의 질서 있는 편제를 말하므로, 조직성과 감독의 뉘앙스를 유지하는 것이 본문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 민수기 10장 행진 질서와 지파 편제
