  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
  footnotes:
  - marker: a
    text: Or 'becomes repulsive to you' / 'becomes a disgust to you.' The Hebrew expression conveys strong revulsion.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 달 동안, 그것이 여러분의 콧구멍에서 나와 여러분에게 역겨운 것이 될 때까지입니다. 이는 여러분이 여러분 가운데 계시는 야훼를 버리고, 그의 앞에서 울며 ‘우리가 왜 이집트에서 나왔습니까?’라고 말하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역겨운 것’은 히브리어의 강한 혐오감을 반영한 번역입니다. ‘혐오스러운 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  english_pob_choice: for a whole month
  chosen_korean: 한 달 동안
  alternatives_korean:
  - 한 달의 기간 동안
  - 하루하루 한 달 동안
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘한 달 전체’의 기간을 뜻하므로, 자연스러운 현대 한국어로 ‘한 달 동안’이 가장 직접적입니다.
- source_word: מֵאַפְכֶם
  english_pob_choice: it comes out of your nostrils
  chosen_korean: 여러분의 콧구멍에서 나와
  alternatives_korean:
  - 여러분의 코에서 나와
  - 여러분의 코구멍에서 나와
  lexicon: HALOT
  rationale: אַף의 구체적 신체 이미지를 살려 ‘콧구멍’으로 옮기되, 한국어에서 과도하게 낯설지 않게 했습니다.
- source_word: וְהָיָה לָכֶם לְזָרָא
  english_pob_choice: and becomes loathsome to you
  chosen_korean: 여러분에게 역겨운 것이 될 때까지
  alternatives_korean:
  - 여러분에게 혐오스러운 것이 될 때까지
  - 여러분에게 끔찍한 것이 될 때까지
  lexicon: HALOT
  rationale: זָרָא의 강한 혐오·구역질의 뉘앙스를 한국어의 ‘역겨운’으로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭으로 대체하지 않았습니다.
theological_decisions:
- issue: 야훼의 임재를 나타내는 표현
  chosen_reading: ‘여러분 가운데 계시는 야훼’로 옮겨 공동체 한가운데 계신 임재를 드러냈습니다.
  alternative_readings:
  - ‘여러분 안에 계시는 야훼’
  - ‘여러분 가운데 있는 야훼’
  rationale: בְּקִרְבְּכֶם은 내면보다 공동체적 임재를 가리키므로, 개인 내주처럼 읽히는 표현은 피했습니다.
  doctrine_reference: Numbers 11:20 source-context reading
- issue: 마지막 질문문의 감정 강도
  chosen_reading: ‘우리가 왜 이집트에서 나왔습니까?’
  alternative_readings:
  - ‘우리가 왜 이집트에서 나왔습니까?’로 완전 직역
  - ‘우리가 왜 굳이 이집트에서 나왔습니까?’
  rationale: 원문에는 ‘ever’에 해당하는 추가 강조가 없으므로, 과장된 재강조를 넣지 않고 단순한 원문의 불평을 살렸습니다.
  doctrine_reference: latest_revision_pass / source alignment
