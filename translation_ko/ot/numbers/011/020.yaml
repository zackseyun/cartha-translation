  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘한 달 전체’의 기간을 뜻하므로, 자연스러운 현대 한국어로 ‘한 달 동안’이 가장 직접적입니다.
- source_word: מֵאַפְכֶם
