source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
  footnotes:
  - marker: a
    text: Or 'freely' or 'without cost.' The speakers are recalling Egypt from the perspective of their complaint, despite their actual slavery there.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 이집트에서 공짜로 먹던 물고기와—오이, 참외, 부추, 양파, 마늘을 기억합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 대가 없이’, ‘값 없이’. 이 말은 실제 노예 상태였던 이집트를 불평하는 화자의 시점에서 회상한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  english_pob_choice: We remember
  chosen_korean: 우리는 … 기억합니다
  alternatives_korean:
  - 우리는 … 기억했습니다
  - 우리는 … 떠올립니다
  lexicon: HALOT
  rationale: 1인칭 복수 완료형이 불평의 직접 화법 안에서 현재적 회상으로 들리므로, 한국어는 현재형으로 자연스럽게 살렸습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: 공짜로
  alternatives_korean:
  - 아무 대가 없이
  - 값 없이
  lexicon: HALOT
  rationale: ‘값 없이/대가 없이’의 의미를 담되, 불평조의 구어적 뉘앙스를 살리기 위해 현대 한국어의 ‘공짜로’를 택했습니다.
- source_word: הַקִּשֻּׁאִים / הָאֲבַטִּחִים / הֶחָצִיר / הַבְּצָלִים / הַשּׁוּמִים
  english_pob_choice: the cucumbers, the melons, the leeks, the onions, and the garlic
  chosen_korean: 오이, 참외, 부추, 양파, 마늘
  alternatives_korean:
  - 오이, 멜론, 부추, 양파, 마늘
  - 오이, 수박, 부추, 양파, 마늘
  lexicon: HALOT
  rationale: 각 식물명은 문맥상 식품 목록으로 이해되므로 일반 한국어 식품명으로 옮겼습니다. הָאֲבַטִּחִים는 특정 종을 단정하기보다 한국어에서 가장 무난한 과실류 명칭인 ‘참외’로 처리했습니다.
theological_decisions:
- issue: 이집트에서 ‘공짜로’ 먹었다는 표현과 실제 노예 상태의 긴장
  chosen_reading: 본문의 불평 화법을 그대로 따라, 객관적 역사평가로 바로잡지 않고 그들의 회상과 과장을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 아무 대가 없이
  - 자유롭게
  rationale: 히브리어 חִנָּם과 영어 POB 주석이 모두 발화자의 시점과 실제 현실 사이의 긴장을 보존합니다. 번역에서 이를 평탄화하지 않는 것이 서술 의도에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
