    rationale: 사람을 대상으로 한 하나님께의 항의 문맥에서는 ‘괴롭게 하셨습니까’ 또는 ‘나쁘게 대하셨습니까’가 더 자연스럽고 원문의 고난·불이익의 의미를 잘 전달합니다.
