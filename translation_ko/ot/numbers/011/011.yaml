  source_fidelity: 원문의 두 항의문, ‘당신의 종’, ‘은혜를 얻다’ 관용구, 그리고 모든 백성의 짐을 모세에게 지운다는 비유를 대체로 잘 반영했습니다. 다만 ‘이렇게’는 히브리어 본문에 없는 강조이므로 삭제하는 것이 안전하며, ‘해롭게 하다’는 כאן의 항의 맥락에서는 다소 부자연스럽습니다.
  naturalness: ‘주의 눈에 은혜를 얻지 못하여’는 직역적이지만 현대 표준어에서는 다소 어색합니다. ‘주께 은혜를 입지 못했기에’로 풀면 자연스러우나 원문의 수사적 연결을 인과로 과도하게 확정할 수 있으므로, ‘제가 주께 은혜를 입지 못했다고’라는 항의의 문맥으로 옮기는 편이 자연스럽고 의미를 보존합니다.
  terminology: 야훼 음역은 제시된 명칭 정책과 일치합니다. ‘주의 종’은 하나님 앞에서의 겸손한 자기 지칭으로 적절합니다. ‘백성’의 집합 단수에 관한 주석도 적절합니다.
