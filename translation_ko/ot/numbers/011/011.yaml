source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
  footnotes:
  - marker: a
    text: Or “have you done evil to your servant?” The Hebrew verb is more literally “done bad/evil,” expressing Moses’ complaint.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “found favor in your eyes,” a common idiom for receiving favor from someone.
    reason: cultural_note
  - marker: c
    text: Hebrew “all this people,” with “people” singular as a collective noun.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼께 말했습니다. "왜 주의 종을 이렇게 해롭게 하셨습니까? 어찌하여 제가 주의 눈에 은혜를 얻지 못하여, 이 모든 백성의 짐을 제게 지우셨습니까?"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘눈에 은혜를 얻다’는 누군가에게 호의를 받는다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘이 모든 백성’이라고 하며, ‘백성’은 집합적 단수로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל יְהוָה
  english_pob_choice: And Moses said to Yahweh
  chosen_korean: 모세가 야훼께 말했습니다
  alternatives_korean:
  - 모세가 야훼께 말하였습니다
  - 모세가 야훼께 이르렀습니다
  lexicon: WLC; divine name policy
  rationale: יהוה는 관례적 대체어 대신 고유명사 음역인 야훼로 옮기고, 서사 진행은 자연스러운 서술형으로 처리했습니다.
- source_word: הֲרֵעֹתָ
  english_pob_choice: have you treated your servant badly
  chosen_korean: 주의 종을 이렇게 해롭게 하셨습니까
  alternatives_korean:
  - 주의 종에게 악을 행하셨습니까
  - 주의 종을 나쁘게 대하셨습니까
  - 주의 종을 괴롭게 하셨습니까
  lexicon: HALOT
  rationale: 히필형 רעע의 ‘나쁘게/해롭게 하다’ 의미를 살리되, 하나님께 ‘악을 행하다’라고 직역해 생길 수 있는 과도한 오해를 피하면서도 모세의 항의조를 유지했습니다.
- source_word: לְעַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 일꾼
  lexicon: HALOT
  rationale: 하나님께 대한 겸손한 자기호칭으로서 이 절에서는 관계적 표현인 ‘종’이 자연스럽고, 본문의 신분적 강조를 굳이 ‘노예’로 바꿀 근거는 약합니다.
- source_word: מָצָתִי חֵן בְּעֵינֶי/ךָ
  english_pob_choice: have I not found favor in your eyes
  chosen_korean: 제가 주의 눈에 은혜를 얻지 못하여
  alternatives_korean:
  - 제가 주의 눈에 호의를 얻지 못하여
  - 제가 주께 은혜를 입지 못하여
  - 제가 주의 눈에 은총을 얻지 못하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 풀어 ‘눈에 은혜를 얻다’로 옮겨, 관계적 호의의 의미를 드러내되 표현의 관용성도 유지했습니다.
- source_word: מַשָּׂא
  english_pob_choice: the burden
  chosen_korean: 짐
  alternatives_korean:
  - 부담
  - 무거운 짐
  - 책임
  lexicon: HALOT
  rationale: 형상적으로는 ‘짐’이 가장 직접적이며, 모세의 하소연 성격과도 잘 맞습니다. ‘책임’은 의미를 너무 해석적으로 좁힙니다.
theological_decisions:
- issue: 하나님을 향한 모세의 항의 어조
  chosen_reading: 직설적 질문과 항의가 드러나도록 유지했습니다
  alternative_readings:
  - 더 완곡한 탄원으로 순화
  - 경건한 기도체로 재구성
  rationale: 본문은 모세의 격앙된 호소를 담고 있으므로, 현대 한국어에서도 그 긴장을 약화시키지 않는 쪽이 원문에 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 드러내는 정서와 수사학을 보존'
