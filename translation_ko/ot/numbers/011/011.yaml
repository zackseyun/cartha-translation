  to: 모세가 야훼께 말했습니다. “왜 주의 종을 괴롭게 하셨습니까? 어찌하여 제가 주께 은혜를 입지 못했다고 이 모든 백성의 짐을 제게 지우셨습니까?”[a][b]
  rationale: 원문에 없는 ‘이렇게’를 삭제하고, הֲרֵעֹתָ를 현대 한국어에서 자연스러운 ‘괴롭게 하셨습니까’로 옮겼습니다. 또한 ‘주께 은혜를 입지 못했다고’로 히브리어 관용구의 의미와 모세의 항의적 수사 연결을 보존했습니다. 기존 각주 표지는 본문 말미의 [a][b]와 정확히 연결됩니다.
