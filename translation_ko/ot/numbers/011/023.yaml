id: NUM.11.23
reference: Numbers 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Has the LORD’s hand become short?''—an idiom meaning ''Has the LORD’s power become limited?'''
    reason: cultural_note
  - marker: b
    text: Or 'whether what I have said will happen to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. 「야훼의 손이 짧아졌느냐? 이제 내 말이 너에게 이루어지는지 그렇지 않은지 네가 보게 될 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼의 손이 짧아졌느냐?’입니다. 이는 ‘야훼의 능력이 제한되었느냐?’라는 관용적 의미를 담습니다.
    reason: cultural_note
  - marker: b
    text: 문맥상 ‘내 말’은 ‘내가 한 말’ 혹은 ‘내가 말한 일이’ 이루어지는지를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 원문의 신명사יהוה를 고유명사로 보존하기 위해, POB의 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הֲיָד יְהוָה תִּקְצָר
  english_pob_choice: Has Yahweh’s hand become short?
  chosen_korean: 야훼의 손이 짧아졌느냐
  alternatives_korean:
  - 야훼의 손이 제한되었느냐
  - 야훼의 손이 너무 짧으냐
  lexicon: HALOT
  rationale: ‘손’을 능력의 은유로 유지하고, קצר의 직유를 살리기 위해 ‘짧아졌느냐’로 직역에 가깝게 옮겼습니다.
- source_word: תִרְאֶה הֲיִקְרְךָ דְבָרִי אִם לֹא
  english_pob_choice: you will see whether my word will happen for you or not
  chosen_korean: 이제 내 말이 너에게 이루어지는지 그렇지 않은지 네가 보게 될 것이다
  alternatives_korean:
  - 이제 내 말이 너에게 일어나는지 그렇지 않은지 네가 보게 될 것이다
  - 이제 내 말이 너에게 이루어질지 네가 보게 될 것이다
  lexicon: HALOT
  rationale: דברי를 하나님의 선포로 이해하여 ‘내 말’로 옮기고, הקרה의 성취/발생 의미를 한국어의 자연스러운 ‘이루어지다’로 표현했습니다.
theological_decisions:
- issue: 신적 능력에 대한 수사적 도전문의 보존
  chosen_reading: ‘야훼의 손이 짧아졌느냐?’를 그대로 살려, 하나님의 능력이 줄어들 수 있느냐는 반문으로 읽히게 했습니다.
  alternative_readings:
  - 하나님의 능력이 제한되었느냐?
  - 무엇이 야훼께 불가능하겠느냐?
  rationale: 원문은 신체 은유를 통해 의심을 책망하는 수사적 질문이므로, 의미를 풀어쓰지 않고 은유를 보존하는 편이 소스의 힘을 더 잘 전달합니다.
  doctrine_reference: translation philosophy §1, §6
