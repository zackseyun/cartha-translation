base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
  footnotes:
  - marker: a
    text: Hebrew 'and be found for them' is an idiom meaning 'and be enough for them' or 'and suffice for them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 양 떼와 소 떼를 그들을 위해 잡아도 그들에게 충분하겠습니까? 아니면 바다의 모든 고기가 그들을 위해 모여도 그들에게 충분하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들에게 발견되다/있다’는 관용적으로 ‘그들에게 충분하다’ 또는 ‘그들에게 족하다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  english_pob_choice: Would
  chosen_korean: …하겠습니까?
  alternatives_korean:
  - …입니까?
  - …겠습니까?
  lexicon: HALOT
  rationale: 희화적 반문이므로 단순 서술형 질문보다 가능·가정의 뉘앙스를 살리는 종결을 택했습니다.
- source_word: צֹאן וּבָקָר
  english_pob_choice: sheep and cattle
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양과 소
  - 가축과 소 떼
  lexicon: HALOT
  rationale: 목축 자원의 두 범주를 구체적으로 살리되, 한국어에서는 집합적 표현인 ‘떼’를 붙여 자연스럽게 옮겼습니다.
- source_word: וּמָצָא לָהֶם
  english_pob_choice: and be enough for them
  chosen_korean: 그들에게 충분하겠습니까
  alternatives_korean:
  - 그들에게 넉넉하겠습니까
  - 그들에게 족하겠습니까
  lexicon: HALOT
  rationale: 직역하면 ‘찾다’이지만 관용적으로 ‘충분하다/족하다’의 뜻이므로 의미를 드러내는 표현으로 옮겼습니다.
- source_word: אֶת כָּל דְּגֵי הַיָּם
  english_pob_choice: all the fish of the sea
  chosen_korean: 바다의 모든 고기
  alternatives_korean:
  - 바다의 모든 물고기
  - 바다의 모든 물고기들
  lexicon: HALOT
  rationale: 히브리어 דָּג는 일반적으로 물고기를 가리키므로, 현대 한국어에서 자연스러운 ‘고기’로 옮겼습니다.
- source_word: יֵאָסֵף
  english_pob_choice: were gathered
  chosen_korean: 모여도
  alternatives_korean:
  - 모집되어도
  - 거두어져도
  lexicon: HALOT
  rationale: 피동형 ‘모이다’가 맥락상 가장 자연스럽고, 대량의 식량 공급 가능성을 묻는 흐름을 살렸습니다.
theological_decisions:
- issue: 모세의 반문이 강조하는 불신의 문제를 어떻게 전달할지
  chosen_reading: 하나님의 공급 능력에 대한 인간적 계산의 한계를 드러내는 반문으로 유지했습니다.
  alternative_readings:
  - 단순한 정보 질문처럼 완화할 수 있음
  - ‘족하겠습니까’만으로 압축할 수 있음
  rationale: 본문은 사실 확인이 아니라 광야 공동체에 대한 하나님의 공급이 불가능하다고 여기는 모세의 반문이므로, 반문성을 분명히 유지해야 합니다.
  doctrine_reference: 민수기 11장 문맥상 하나님의 공급과 인간 불신의 대비
