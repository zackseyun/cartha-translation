revisions:
- from: 그러나 두 사람이 진영에 남아 있었으니, 한 사람의 이름은 엘닷이고 다른 사람의 이름은 메닷이었습니다. 그들 위에 영이 임하였고, 그들은 기록된 자들 가운데 있었지만 회막으로 나가지 않았으며, 진영에서 예언하였습니다.[a][b]
  to: 그러나 두 남자가 진영에 남아 있었습니다. 한 사람의 이름은 엘닷이고, 다른 한 사람의 이름은 메닷이었습니다. 영이 그들 위에 머물렀습니다. 그들은 기록된 자들 가운데 있었으나[b], 그 장막으로 나아가지 않았고[a], 진영에서 예언하였습니다.
  rationale: 남성 복수 표지, ‘장막’의 비특정성, 영이 ‘머무르는’ 동작을 원문에 맞게 바로잡았습니다. 또한 각주 표지를 각각의 해당 표현 뒤로 옮겼습니다. ‘기록된 자들’은 명부에 포함되었다는 문맥적 의미를 전달하면서도 히브리어 표현의 여지를 보존합니다.
