  - severity: low
    issue: 각주 표지가 내용이 가리키는 구절에 붙어 있지 않습니다.
    rationale: 장막 식별 각주는 ‘그 장막’ 뒤에, ‘기록된 자들’의 어휘 대안 각주는 해당 표현 뒤에 두어야 독자가 각주의 적용 대상을 명확히 알 수 있습니다.
  - severity: low
