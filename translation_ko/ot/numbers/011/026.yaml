  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
  footnotes:
  - marker: a
    text: That is, likely the tent of meeting in the context of this episode.
    reason: cross_reference
  - marker: b
    text: Or 'they were among the registered.' The Hebrew literally says they were 'among the written/recorded ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 두 사람이 진영에 남아 있었으니, 한 사람의 이름은 엘닷이고 다른 사람의 이름은 메닷이었습니다. 그들 위에 영이 임하였고, 그들은 기록된 자들 가운데 있었지만 회막으로 나가지 않았으며, 진영에서 예언하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 곧 회막을 가리키는 것으로 보입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그들은 기록된 자들 가운데 있었습니다.’ 히브리어는 문자적으로 ‘쓰인/기록된 자들 가운데’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ שְׁנֵי אֲנָשִׁים
  english_pob_choice: But two men remained
  chosen_korean: 그러나 두 사람이 진영에 남아 있었으니
  alternatives_korean:
  - 두 남자가 진영에 남아 있었습니다
  - 그러나 두 사람은 진영에 남아 있었습니다
  lexicon: HALOT
  rationale: שׁאר의 핵심은 ‘남아 있다/남겨지다’이므로 이를 자연스럽게 풀어 ‘남아 있었으니’로 옮겼고, שְׁנֵי אֲנָשִׁים는 성별 정보를 살려 ‘두 사람’보다 더 직접적인 ‘두 사람이’로 처리했습니다.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  english_pob_choice: And the Spirit rested on them
  chosen_korean: 그들 위에 영이 임하였고
  alternatives_korean:
  - 그들 위에 영이 머물렀고
  - 그들 위에 성령이 임하였고
  lexicon: HALOT
  rationale: 본문의 רוּחַ는 문맥상 예언을 가능하게 하는 하나님의 영을 가리키지만, 여기서는 ‘성령’보다 더 직접적인 표지인 ‘영’이 원문 결을 잘 살립니다. נוח는 단순한 정착보다 ‘임하다/머물다’의 뉘앙스가 있어 ‘임하였고’로 옮겼습니다.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  english_pob_choice: they were among those recorded
  chosen_korean: 그들은 기록된 자들 가운데 있었지만
  alternatives_korean:
  - 그들은 등록된 자들 가운데 있었지만
  - 그들은 기록된 이들 가운데 있었지만
  lexicon: HALOT
  rationale: כְּתֻבִים는 문자적으로 ‘기록된/쓰인 자들’이므로, 행정적 느낌이 강한 ‘등록된’보다 원문의 직접성을 살린 ‘기록된 자들’이 적절합니다.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  english_pob_choice: they had not gone out to the tent
  chosen_korean: 회막으로 나가지 않았으며
  alternatives_korean:
  - 그 tent로 나가지 않았으며
  - 장막으로 나가지 않았으며
  lexicon: HALOT
  rationale: 영어 POB의 각주처럼 문맥상 회막이므로 한국어 독자가 즉시 알아볼 수 있도록 ‘회막’으로 구체화했습니다. 다만 이는 문맥적 명시로서 원문의 ‘tent’ 이해를 반영한 것입니다.
- source_word: וַיִּתְנַבְּאוּ
  english_pob_choice: they prophesied
  chosen_korean: 예언하였습니다
  alternatives_korean:
  - 예언했습니다
  - 예언하였고
  lexicon: HALOT
  rationale: נבא의 기본 의미를 직접 살려 ‘예언하다’로 옮겼고, 구약 서술체에 맞는 합쇼체 과거형을 사용했습니다.
theological_decisions:
- issue: הָרוּחַ의 한국어 표지
  chosen_reading: 영
  alternative_readings:
  - 성령
  - 바람
  rationale: 이 장면의 רוח은 예언 능력을 부여하는 하나님의 영이지만, 본문이 명시적으로 ‘성령’ 어휘를 쓰지 않으므로 원문 긴장을 유지하기 위해 ‘영’으로 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: הָאֹהֱלָה의 문맥적 특정
  chosen_reading: 회막
  alternative_readings:
  - 장막
  - 그 tent
  rationale: 영어 POB가 각주로 지적하듯 여기의 ‘tent’는 이야기 문맥상 회막을 가리키므로, 본문 이해를 돕기 위해 한국어 본문에는 ‘회막’으로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
