  to: 그러자 야훼에게서 바람이 일어나 바다에서 메추라기들을 몰아와 진영 곁에 떨어뜨렸습니다. 메추라기들은 진영 둘레에 이쪽으로는 하루 길이쯤, 저쪽으로도 하루 길이쯤 퍼져 있었고, 땅 표면 위로 약 두 규빗이었습니다.[a][b]
