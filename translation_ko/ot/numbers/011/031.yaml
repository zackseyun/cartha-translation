source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
  footnotes:
  - marker: a
    text: Or 'a spirit went out from the LORD'; here the context strongly favors 'wind' because it carries the quail from the sea.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'about two cubits above the face of the ground.' The clause may describe the height at which the quail were spread or flew, rather than their depth on the ground.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 야훼에게서 한 바람이 불어 나와 바다에서 메추라기들을 몰아왔고, 그것들을 진영 곁에 내려놓으셨습니다. 곧 이쪽으로는 하루 길이쯤, 저쪽으로는 하루 길이쯤, 진영 둘레에 두루 있었고, 그것들은 땅 위로 약 두 규빗 높이까지 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영’으로도 번역될 수 있으나, 이 문맥은 메추라기를 바다에서 옮기는 바람을 가리키므로 ‘바람’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘땅의 얼굴 위로 약 두 규빗’입니다. 이 구절은 메추라기가 땅 위에 쌓였다는 뜻일 수도 있고, 날아오른 높이를 말할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְר֜וּחַ
  english_pob_choice: a wind
  chosen_korean: 한 바람
  alternatives_korean:
  - 영
  - 바람
  lexicon: HALOT
  rationale: 문맥상 메추라기를 바다에서 옮기는 물리적 매개이므로 ‘영’보다 ‘바람’이 원문의 기능을 더 분명히 살립니다.
- source_word: נָסַע מֵאֵת יְהוָה
  english_pob_choice: went out from the LORD
  chosen_korean: 야훼에게서 … 불어 나와
  alternatives_korean:
  - 야훼에게서 … 나와
  - 야훼로부터 … 불어와
  lexicon: HALOT
  rationale: ‘~에게서’는 출처를 보존하고, 바람과 결합된 동작으로는 ‘불어 나와’가 자연스럽고 원문의 발화 출처를 해치지 않습니다.
- source_word: וַיָּגָז שַׂלְוִים
  english_pob_choice: drove quail in
  chosen_korean: 메추라기들을 몰아왔고
  alternatives_korean:
  - 메추라기들을 몰아넣었고
  - 메추라기들을 가져왔고
  lexicon: HALOT
  rationale: 희귀 동사의 강한 추진력을 살리기 위해 단순한 ‘가져왔다’보다 ‘몰아왔다’가 바람의 작용과 결과를 함께 드러냅니다.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  english_pob_choice: and let them fall beside the camp
  chosen_korean: 그것들을 진영 곁에 내려놓으셨습니다
  alternatives_korean:
  - 그것들을 진영 곁에 떨어뜨리셨습니다
  - 그것들을 진영 위에 펴놓으셨습니다
  lexicon: HALOT
  rationale: ‘נטשׁ’의 확산/투하의 결과를 한국어로 자연스럽게 옮기되, 진영 ‘위’가 아니라 ‘곁에’로 하여 지리적 배치를 보존했습니다.
- source_word: וּכְאַמָּתַיִם עַל פְּנֵי הָאָרֶץ
  english_pob_choice: about two cubits above the surface of the ground
  chosen_korean: 땅 위로 약 두 규빗 높이까지
  alternatives_korean:
  - 땅 표면에서 약 두 규빗
  - 땅 위 약 두 규빗 깊이
  lexicon: HALOT
  rationale: 영문 주석이 시사하듯 높이/두께의 가능성을 열어 두면서, 한국어로는 가장 자연스럽게 ‘높이까지’로 옮겨 원문의 모호성을 과도하게 해소하지 않았습니다.
theological_decisions:
- issue: 바람과 야훼의 직접성
  chosen_reading: 본문은 야훼에게서 나온 바람을 수단으로 메추라기가 오게 된 것으로 제시합니다.
  alternative_readings:
  - 야훼가 직접 메추라기를 보내신 것으로 풀어 쓸 수도 있음
  rationale: 원문은 자연적 매개(바람)와 신적 기원(야훼)을 함께 유지하므로, 번역도 둘을 구분해 남겨야 합니다.
  doctrine_reference: Translation philosophy §3 (theological tension preserved)
