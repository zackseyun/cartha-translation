id: NUM.11.28
reference: Numbers 11:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
  footnotes:
  - marker: a
    text: Or “one of his young men,” or possibly “from his chosen men.” The Hebrew phrase is compact and somewhat ambiguous.
    reason: lexical_alternative
  - marker: b
    text: Or “forbid them.” The Hebrew verb can mean to restrain, hold back, or prohibit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 눈의 아들 여호수아, 곧 젊은 시절부터 모세를 섬기던 자가 대답하여 말했습니다. “내 주 모세님, 그들을 막으십시오!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축적이어서 “그의 젊은 사람들 가운데서”, “그가 뽑은 사람들 가운데서”처럼도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: כְּלָאֵם은 “막으십시오”, “금지하십시오”, “제지하십시오”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: Then ... answered
  chosen_korean: 그때 ... 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 וַ-접속을 반영해 ‘그때’를 두고, ענה의 담화 기능을 살려 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: מְשָׁרֵת מֹשֶׁה
  english_pob_choice: Moses’ attendant
  chosen_korean: 모세를 섬기던 자
  alternatives_korean:
  - 모세의 시종
  - 모세의 종
  lexicon: HALOT
  rationale: מְשָׁרֵת은 여기서 노예 신분이 아니라 보조·수행의 의미가 강하므로, 현대 한국어에서 자연스러운 ‘섬기던 자’로 옮겼습니다.
- source_word: מִבְּחֻרָיו
  english_pob_choice: from his young men
  chosen_korean: 젊은 시절부터
  alternatives_korean:
  - 그의 젊은 사람들 가운데서
  - 그가 뽑은 사람들 가운데서
  lexicon: HALOT
  rationale: 이 구절은 히브리어상 압축적이고 모호하여, POB의 해석을 따라 ‘젊은 시절부터’로 풀어 Joshua의 오랜 보좌 경력을 드러냈습니다.
- source_word: אֲדֹנִי מֹשֶׁה
  english_pob_choice: My lord Moses
  chosen_korean: 내 주 모세님
  alternatives_korean:
  - 내 주인 모세
  - 내 주 모세
  lexicon: HALOT
  rationale: 인간 상전에게 드리는 공손한 호격을 살리되, 한국어에서 자연스럽고 존중을 담는 ‘내 주 모세님’을 택했습니다.
- source_word: כְּלָאֵם
  english_pob_choice: restrain them
  chosen_korean: 그들을 막으십시오
  alternatives_korean:
  - 그들을 금지하십시오
  - 그들을 제지하십시오
  lexicon: HALOT
  rationale: כלא의 의미 범위(막다, 억제하다, 금하다)를 고려해, 예언을 멈추게 하려는 요청을 자연스럽게 전달하는 ‘막으십시오’로 옮겼습니다.
theological_decisions:
- issue: Joshua의 발언에 나타난 공손한 호칭과 명령형의 긴장
  chosen_reading: ‘내 주 모세님’으로 극존대를 유지하되, 직접 명령은 ‘막으십시오’로 옮겨 Joshua의 간절한 요청을 드러냈습니다.
  alternative_readings:
  - ‘내 주여, 그들을 금지하십시오’
  - ‘모세님, 그들을 제지하십시오’
  rationale: 히브리어는 존대 호칭과 강한 금지 요청을 함께 담고 있으므로, 둘 사이의 긴장을 약화시키지 않도록 한국어에서도 공손함과 급박함을 함께 보존했습니다.
  doctrine_reference: 본문의 서사적 화행 보존
