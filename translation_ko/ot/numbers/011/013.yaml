language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/אַ֤יִן לִ/י֙ בָּשָׂ֔ר לָ/תֵ֖ת לְ/כָל הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי יִבְכּ֤וּ עָלַ/י֙ לֵ/אמֹ֔ר תְּנָ/ה לָּ֥/נוּ בָשָׂ֖ר וְ/נֹאכֵֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
  footnotes:
  - marker: a
    text: Or 'they are weeping to me' or 'they are pressing me with their weeping.' The Hebrew idiom literally says 'they weep upon me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 모든 백성에게 줄 고기를 어디에서 구하겠습니까? 그들이 내게 울부짖으며, 「고기를 주십시오. 그래서 우리가 먹게 하십시오」라고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에서 울고 있다’나 ‘울부짖음으로 나를 압박하고 있다’라는 뜻일 수 있습니다. 히브리어 관용구는 문자적으로 ‘내 위에 운다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן לִי
  english_pob_choice: Where am I to get
  chosen_korean: 내가 … 어디에서 구하겠습니까?
  alternatives_korean:
  - 내가 … 어디서 얻겠습니까?
  - 저는 … 어디에서 구해야 합니까?
  lexicon: HALOT
  rationale: 원문의 מקור/출처를 묻는 표현을 한국어의 자연스러운 궁색한 질문으로 옮겼으며, 모세의 절박함을 살렸습니다.
- source_word: בָּשָׂר
  english_pob_choice: meat
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 육류
  lexicon: HALOT
  rationale: 이 문맥에서는 먹을 동물성 식량을 가리키므로 ‘고기’가 가장 자연스럽고 직접적입니다.
- source_word: לְכָל הָעָם הַזֶּה
  english_pob_choice: to all this people
  chosen_korean: 이 모든 백성에게
  alternatives_korean:
  - 이 모든 사람들에게
  - 이 모든 백성에게
  lexicon: HALOT
  rationale: עם의 집합적 단수를 살려 ‘백성’으로 옮겼고, 지시대명사 ‘הַזֶּה’는 ‘이’로 반영했습니다.
- source_word: יִבְכּוּ עָלַי
  english_pob_choice: they are weeping before me
  chosen_korean: 그들이 내게 울부짖으며
  alternatives_korean:
  - 그들이 내 앞에서 울며
  - 그들이 내게 애원하며
  lexicon: HALOT
  rationale: עָלַי의 ‘나를 향해/내게 미치는 압박’이라는 뉘앙스를 한국어의 ‘내게 울부짖으며’로 옮겨, 단순한 위치 표현보다 청원과 압박감을 함께 드러냈습니다.
- source_word: וְנֹאכֵלָה
  english_pob_choice: so that we may eat
  chosen_korean: 그래서 우리가 먹게 하십시오
  alternatives_korean:
  - 그래야 우리가 먹을 수 있습니다
  - 먹게 해주십시오
  lexicon: HALOT
  rationale: 코호르타티브의 목적·희망을 자연스러운 한국어 종결 구조로 반영했습니다.
theological_decisions:
- issue: 요청 인용문의 화행과 반말/합쇼체 처리
  chosen_reading: 모세의 서술은 합쇼체로 유지하고, 인용된 백성의 직접 발화도 공손한 요청형인 「고기를 주십시오」로 옮겼습니다.
  alternative_readings:
  - 「고기를 주세요」
  - 「고기를 주어 우리가 먹게 하십시오」
  rationale: 원문이 지시하는 직접 인용의 요청성을 살리되, 현대 표준어에서 자연스러운 공손한 청원으로 표현했습니다.
  doctrine_reference: 문체/화행 일치 원칙
- issue: עָלַי의 방향성
  chosen_reading: ‘내게’로 옮겨 백성의 울부짖음이 모세를 향한 압박이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘내 앞에서’
  - ‘나에게’
  rationale: 영어 POB의 ‘weeping before me’가 지닌 해석을 참고하되, 원문의 방향성을 더 직접적으로 드러내는 한국어로 처리했습니다.
  doctrine_reference: 원문 방향성 보존
