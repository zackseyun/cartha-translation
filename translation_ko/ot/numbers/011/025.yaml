id: NUM.11.25
reference: Numbers 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
  footnotes:
  - marker: a
    text: Or, 'they did not cease.' The Hebrew expression is terse and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 구름 가운데서 내려오셔서 모세에게 말씀하셨습니다. 그분은 모세 위에 있던 영에서 일부를 취하여 장로들인 일흔 사람에게 주셨습니다. 그 영이 그들 위에 머물자, 그들은 예언했지만 계속 예언하지는 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 멈추지 않았다’. 히브리어 표현이 매우 간결하여 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문의 신명기적 고유명사를 살려, 제목이 아닌 하나님의 이름으로 직접 옮겼습니다.
- source_word: בֶּעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 가운데로
  alternatives_korean:
  - 구름 속에
  - 구름 안에서
  lexicon: HALOT
  rationale: 출애굽-광야 문맥의 현현 구름을 자연스럽게 드러내면서도, 단순한 배경 구름이 아니라는 점을 살렸습니다.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  english_pob_choice: he took some of the Spirit that was on him
  chosen_korean: 그에게 있던 영에서 일부를 취하여
  alternatives_korean:
  - 그에게 있던 영을 조금 덜어내어
  - 그에게 있던 영의 일부를 가져다가
  lexicon: HALOT
  rationale: אצל의 ‘일부를 떼어 취하다’는 뉘앙스를 살리되, 영의 충만이 감소했다는 오해는 피했습니다.
- source_word: רוּחַ
  english_pob_choice: Spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 바람
  lexicon: HALOT
  rationale: 여기서는 하나님의 능력 주시는 영을 가리키지만, 한국어 본문에서는 문맥상 ‘영’이 가장 직접적이며 과도한 교회어법을 피했습니다.
- source_word: וְלֹא יָסָפוּ
  english_pob_choice: they did not continue
  chosen_korean: 다시는 그러지 않았습니다
  alternatives_korean:
  - 그들은 계속하지 않았습니다
  - 그들은 다시 예언하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 예언 행위가 이 일회적 현상으로 나타났음을 자연스럽게 전달했습니다. 동시에 히브리어의 압축된 표현이 다의적이라는 점을 본문에서 과도하게 풀지 않았습니다.
theological_decisions:
- issue: רוּחַ를 ‘영’으로 둘지 ‘성령’으로 둘지
  chosen_reading: ‘영’
  alternative_readings:
  - ‘성령’
  rationale: 문맥은 하나님의 임재와 예언 능력을 분명히 가리키지만, 히브리어 원문 자체는 일반 명사 רוּחַ를 사용합니다. 따라서 본문은 ‘영’으로 두고, 신학적 해석을 과잉 표시하지 않았습니다.
  doctrine_reference: 원문-문맥 우선 원칙
- issue: וְלֹא יָסָפוּ의 의미를 ‘다시는 그러지 않았습니다’로 둘지 ‘그들이 멈추지 않았습니다’로 둘지
  chosen_reading: 예언이 반복되지 않았다는 뜻으로 처리
  alternative_readings:
  - 그들이 계속 예언하지 않았습니다
  - 그들이 멈추지 않았습니다
  rationale: 히브리어의 짧은 표현은 번역사에서 두 방향으로 이해되어 왔습니다. 본문은 가장 자연스러운 문맥 의미를 택하되, 대안 해석을 숨기지 않았습니다.
  doctrine_reference: 해석적 긴장 보존
