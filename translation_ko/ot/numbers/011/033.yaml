  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
  footnotes:
  - marker: a
    text: Or, more literally, 'before it was cut off'—that is, before the meat was finished or consumed.
    reason: lexical_alternative
translation:
  language: ko
  text: 고기가 아직 그들의 이 사이에, 곧 씹어 삼키기도 전에, 야훼의 분노가 백성을 향해 타올랐고, 야훼께서 백성에게 매우 심한 재앙을 내리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘끊기기 전에’로, 곧 그 고기가 다 먹히거나 소모되기 전이라는 뜻입니다.
    reason: lexical_alternative
