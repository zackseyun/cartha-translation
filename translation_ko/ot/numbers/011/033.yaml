  rationale: 음식으로 먹는 문맥이므로 동물의 살코기를 뜻하는 ‘고기’가 가장 자연스럽고, ‘육체’로 옮기면 의미가 빗나갑니다.
- source_word: בֵּין שִׁנֵּיהֶם
