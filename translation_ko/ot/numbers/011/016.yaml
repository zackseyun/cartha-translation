  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 고유한 언약 이름을 보존하기 위해 관용적 대체어가 아니라 음역형 야훼를 사용했습니다.
- source_word: אֶסְפָה לִּי
  english_pob_choice: Gather for me
  chosen_korean: 내게로 ... 모아 오너라
  alternatives_korean:
  - 내게로 ... 모으라
  - 내게로 ... 집합시키라
  lexicon: HALOT
  rationale: אָסַף의 모으는 동작과 לִּי의 ‘나를 위하여/내게로’라는 뉘앙스를 함께 살리기 위해 자연스러운 명령형으로 옮겼습니다.
- source_word: שִׁבְעִים אִישׁ
  english_pob_choice: seventy men
  chosen_korean: 칠십 명의 남자
  alternatives_korean:
  - 칠십 사람
  - 칠십 인
  lexicon: HALOT
  rationale: 수사 뒤의 אִישׁ을 이 문맥의 성인 남성으로 이해해, 지도자 선정의 성격을 분명히 했습니다.
- source_word: וְשֹׁטְרָיו
  english_pob_choice: and its officers
  chosen_korean: 그 관원들
  alternatives_korean:
