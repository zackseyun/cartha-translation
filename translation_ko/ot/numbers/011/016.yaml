base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
  footnotes:
  - marker: a
    text: Or “Assemble for me.”
    reason: lexical_alternative
  - marker: b
    text: Or “officials”; the Hebrew term refers to administrative officers under the elders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “나를 위하여[a] 이스라엘의 장로들 가운데서 남자 일흔 명을 모으십시오. 당신이 그들이 백성의 장로들이며 그 백성의 관리들[b]임을 아는 사람들로 하십시오. 그들을 회막으로 데려가서, 그들이 այնտեղ 당신과 함께 서 있게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내게로 모으십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “관원들”; 이 히브리어는 장로들 아래에서 일하는 행정 관리들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
