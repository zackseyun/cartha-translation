  source_fidelity: ‘לִי’는 ‘내게로’라는 이동의 방향보다 ‘나를 위하여/나를 위해’라는 여격을 나타냅니다. 또한 직접 인용문의 명령형은 요청된 합쇼체 문체에 맞게 조정하는 것이 적절합니다.
  naturalness: ‘칠십 명의 남자’보다 ‘남자 일흔 명’이 현대 한국어에서 더 자연스럽고, ‘그 백성의 관리들’은 소유 관계를 분명히 합니다.
  terminology: ‘야훼’, ‘장로들’, ‘회막’, ‘관리들’은 원문의 명칭과 행정적 의미를 적절히 전달합니다. שֹׁטְרִים은 장로와 동일시하지 않고 병렬되는 행정 관리로 유지했습니다.
  issues:
