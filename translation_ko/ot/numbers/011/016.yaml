  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
  footnotes:
  - marker: a
    text: Or “Assemble for me.”
    reason: lexical_alternative
  - marker: b
    text: Or “officials”; the Hebrew term refers to administrative officers under the elders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. "내게로 이스라엘의 장로들 가운데서 칠십 명의 남자를 모아 오너라. 너는 그들이 백성의 장로이며 그 관원들임을 알고 있다. 그들을 회막으로 데려가서 너와 함께 거기 서게 하여라."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내게로 모으라.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “관원들”; 이 히브리어는 장로들 아래의 행정 관리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 고유한 언약 이름을 보존하기 위해 관용적 대체어가 아니라 음역형 야훼를 사용했습니다.
- source_word: אֶסְפָה לִּי
  english_pob_choice: Gather for me
  chosen_korean: 내게로 ... 모아 오너라
  alternatives_korean:
  - 내게로 ... 모으라
  - 내게로 ... 집합시키라
  lexicon: HALOT
  rationale: אָסַף의 모으는 동작과 לִּי의 ‘나를 위하여/내게로’라는 뉘앙스를 함께 살리기 위해 자연스러운 명령형으로 옮겼습니다.
- source_word: שִׁבְעִים אִישׁ
  english_pob_choice: seventy men
  chosen_korean: 칠십 명의 남자
  alternatives_korean:
  - 칠십 사람
  - 칠십 인
  lexicon: HALOT
  rationale: 수사 뒤의 אִישׁ을 이 문맥의 성인 남성으로 이해해, 지도자 선정의 성격을 분명히 했습니다.
- source_word: וְשֹׁטְרָיו
  english_pob_choice: and its officers
  chosen_korean: 그 관원들
  alternatives_korean:
  - 그들의 관원들
  - 관리들
  lexicon: HALOT
  rationale: שֹׁטְרִים은 행정적 감독자들을 가리키므로, 장로들과 병렬되는 공적 직무를 드러내는 관원들이 적절합니다.
