- from: 그 백성은 야훼의 귀에 거슬리게 불평하는 자들처럼 있었고, 야훼께서 그것을 들으시자 그의 분노가 타올랐으며, 야훼의 불이 그들 가운데에서 타올라 진영의 끝부분에 있는 일부를 삼켰습니다.[a]
  to: 그 백성은 고난을 두고 불평하는 사람들처럼 야훼께 들리게 불평하였고, 야훼께서 그것을 들으시자 그의 분노가 타올랐습니다. 야훼의 불이 그들 가운데에서 타올라 진영의 끝부분을 불태웠습니다.[a]
  rationale: 난해한 כְּמִתְאֹנְנִים רַע를 ‘귀에 거슬리게’라는 청자의 반응으로 해석하지 않고, 영어 POB의 ‘hardship’ 선택을 본문에 반영하되 주요 대안을 각주에 남겼습니다. 또한 불이 ‘진영의 끝부분’을 소비했다는 원문의 표현을 유지하여 명시되지 않은 피해자 ‘일부’를 추가하지 않았습니다. 문장 종결은 현대 표준 한국어 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:12:09Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 야훼의 이름과 분노 및 불의 심판이라는 본문의 핵심을 충실히 보존합니다. 그러나 ‘야훼의 귀에 거슬리게’는 רַע를 야훼를 불쾌하게 하는 방식으로 확정하여, 고난/재난에 관한 불평 또는 ‘악하게’라는 어려운 원문의 여지를 좁힙니다. 또한 ‘진영의 끝부분에 있는 일부’는 원문에 명시되지 않은 사람들을 보충합니다.
  naturalness: ‘그 백성은 … 자들처럼 있었고’는 현대 한국어에서 다소 부자연스럽습니다. ‘… 사람들처럼 되었고’가 서술 흐름에 더 자연스럽습니다. ‘진영의 끝부분을 불태웠습니다’는 불이 장소를 삼켰다는 히브리어 표현을 자연한 한국어로 옮깁니다.
  terminology: ‘야훼’, ‘분노가 타올랐습니다’, ‘야훼의 불’은 일관되고 적절합니다. כְּמִתְאֹנְנִים רַע의 희귀하고 난해한 용법은 본문에서 한 가지 해석으로 과도하게 확정하지 않도록 각주로 대안을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘야훼의 귀에 거슬리게’가 רַע의 의미를 ‘야훼를 거슬리게’로 확정합니다.
    rationale: רַע는 불평의 내용인 고난·재난, 불평의 부정적 성격, 또는 다른 분석 가능성과 관련된 난해한 요소입니다. ‘귀에 거슬리게’는 이 말을 청취자의 불쾌감으로 옮겨 원문의 모호성을 보존하지 못합니다.
  - severity: medium
    issue: ‘진영의 끝부분에 있는 일부’를 삼켰다고 하여 사람들을 명시적으로 보충합니다.
    rationale: וַתֹּאכַל 뒤에는 명시적 목적어가 없고, 이어지는 ‘진영의 끝부분’은 불이 소비한 영역으로 이해될 수 있습니다. 사람들 ‘일부’를 본문에 넣지 않는 편이 더 안전합니다.
  - severity: low
    issue: ‘불평하는 자들처럼 있었고’가 자연스럽지 않습니다.
    rationale: 비교 표현과 서사 도입을 유지하면서 ‘… 사람들처럼 되었고’로 다듬을 수 있습니다.
