  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: Now the people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
  footnotes:
  - marker: a
    text: Or 'as complainers,' 'as those complaining,' or possibly 'as if complaining.' The Hebrew form is rare and somewhat difficult.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the ears of the LORD,' an idiom meaning that their complaint came to the LORD's attention.
    reason: lexical_alternative
  - marker: c
    text: Or 'a fire from the LORD burned among them.'
    reason: alternative_reading
  - marker: d
    text: Hebrew 'at the edge/outskirts of the camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 백성은 야훼의 귀에 거슬리게 불평하는 자들처럼 있었고, 야훼께서 그것을 들으시자 그의 분노가 타올랐으며, 야훼의 불이 그들 가운데에서 타올라 진영의 끝부분에 있는 일부를 삼켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀에 거슬리게’는 히브리어 관용구를 한국어로 풀어 옮긴 것으로, 불평이 야훼의 주목과 청취에 이르렀다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: כְּ/מִתְאֹנְנִים רַע
  english_pob_choice: like those who complain of hardship
  chosen_korean: 불평하는 자들처럼
  alternatives_korean:
  - 괴로움을 호소하는 자들처럼
  - 고난을 불평하는 자들처럼
  - 원망하는 자들처럼
  lexicon: HALOT
  rationale: 히브리어의 드문 비교표현을 자연스러운 한국어로 옮기되, 단순 사실 진술보다 ‘~처럼’의 비교 뉘앙스를 살렸습니다.
- source_word: בְּ/אָזְנֵ֣י יְהוָ֑ה
  english_pob_choice: in the hearing of Yahweh
  chosen_korean: 야훼의 귀에 거슬리게
  alternatives_korean:
  - 야훼께 들리게
  - 야훼의 귀에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 직역적인 ‘귀에’ 이미지를 유지하면서, 관용적으로 ‘불평이 하나님께 닿아 들리다’는 뜻이 드러나도록 다듬었습니다.
- source_word: וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה
  english_pob_choice: the fire of Yahweh burned among them
  chosen_korean: 야훼의 불이 그들 가운데에서 타올라
  alternatives_korean:
  - 야훼의 불이 그들 사이에서 타올라
  - 야훼로부터 난 불이 그들 가운데에서 타올라
  lexicon: HALOT
  rationale: ‘불’의 주어를 그대로 살려 하나님의 직접적 심판 이미지를 유지했고, בָּם의 공간감을 ‘그들 가운데에서’로 옮겼습니다.
- source_word: וַ/תֹּ֖אכַל
  english_pob_choice: consumed
  chosen_korean: 삼켰습니다
  alternatives_korean:
  - 먹어 버렸습니다
  - 소멸시켰습니다
  - 불태워 삼켰습니다
  lexicon: HALOT
  rationale: 불이 대상을 파괴하는 힘을 자연스럽게 드러내는 동사로, 단순한 소멸보다 더 강한 파괴 감각을 유지합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기 이름을 존칭 대체어로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’로 직접 표기해 원문 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 야훼의 분노와 불의 심판
  chosen_reading: 그의 분노가 타올랐으며, 야훼의 불이 ... 삼켰습니다
  alternative_readings:
  - 그의 진노가 일어났으며
  - 야훼의 불이 ... 파괴했습니다
  rationale: 히브리어의 감정-불 심판 연쇄를 완화하지 않고, 신적 진노와 실제적 심판을 함께 드러내도록 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
