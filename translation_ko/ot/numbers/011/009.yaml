base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
  footnotes:
  - marker: a
    text: Or 'and when the dew descended on the camp by night, the manna descended on it.' The Hebrew uses the same verb ('came down/descended') for both dew and manna, emphasizing the parallel.
    reason: lexical_alternative
translation:
  language: ko
  text: 밤에 이슬이 진영 위에 내릴 때, 만나가 그 위에 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이슬과 만나에 같은 동사 ‘내리다’를 사용하여 두 표현의 병렬을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְרֶדֶת / יֵרֵד
  english_pob_choice: came down / descended
  chosen_korean: 내릴 때 / 내렸습니다
  alternatives_korean:
  - 내릴 때 / 내려왔습니다
  - 강림할 때 / 강림했습니다
  lexicon: HALOT
  rationale: 히브리어는 이슬과 만나에 같은 동사 ירד를 사용해 병렬을 이루므로, 한국어도 같은 동사 ‘내리다’를 반복해 대응했습니다.
- source_word: הַטַּל
  english_pob_choice: the dew
  chosen_korean: 이슬
  alternatives_korean:
  - 그 이슬
  - 이슬비
  lexicon: HALOT
  rationale: 정관사는 문맥상 특정된 이슬을 가리키지만, 한국어에서는 자연스럽게 ‘이슬’로 옮기는 것이 가장 정확합니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 진캠프
  - 캠프
  lexicon: HALOT
  rationale: 광야 본문에서 הַמַּחֲנֶה는 이스라엘의 야영 진을 가리키므로, 현대 표준어이면서도 군중/야영의 이미지를 살리는 ‘진영’이 적절합니다.
- source_word: עָלָיו
  english_pob_choice: on it
  chosen_korean: 그 위에
  alternatives_korean:
  - 그것 위에
  - 그 위로
  lexicon: HALOT
  rationale: 히브리어 대명사는 진영을 가리키며, 한국어에서는 중복을 피하면서도 위치 관계를 분명히 하는 ‘그 위에’가 자연스럽습니다.
theological_decisions:
- issue: 이슬과 만나의 동사 반복이 주는 강조
  chosen_reading: ‘내리다’를 둘 다에 반복해, 하늘의 공급이 같은 방식으로 연속적으로 주어졌다는 점을 드러냈습니다.
  alternative_readings:
  - 이슬은 ‘내리고’, 만나는 ‘내려왔다’처럼 달리 표현할 수 있습니다.
  - 만나를 ‘왔다’로 완화할 수 있습니다.
  rationale: 본문의 수사적 평행은 의미상 부차적이지 않으므로, 한국어에서도 동일 어근 반복을 유지해 원문의 강조를 보존했습니다.
  doctrine_reference: 본문의 문학적 평행성 보존
- issue: ‘밤에’의 시간 부사 처리
  chosen_reading: 히브리어의 시간 표현 לָיְלָה를 ‘밤에’로 옮겨, 사건이 반복적 광야 공급의 한 장면임을 자연스럽게 나타냈습니다.
  alternative_readings:
  - ‘밤중에’
  - ‘밤 동안에’
  rationale: 직역형인 ‘그 밤에/밤에’도 가능하지만, 한국어 본문 흐름에서는 간결한 ‘밤에’가 서술의 리듬을 가장 잘 살립니다.
  doctrine_reference: 서사적 시간 표현
