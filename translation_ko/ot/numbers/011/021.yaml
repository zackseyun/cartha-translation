language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
  footnotes:
  - marker: a
    text: Hebrew literally, 'a month of days,' an idiom meaning a full month.
    reason: lexical_alternative
  - marker: b
    text: Or 'six hundred thousand men on foot.' The Hebrew expression can denote those counted as foot-travelers or foot soldiers.
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 말했습니다. 「내가 그 가운데 있는 이 백성은 보행자만 해도 육십만 명인데, 당신께서 ‘내가 그들에게 고기를 주겠고, 그들이 한 달 동안 먹을 것이다’라고 말씀하셨습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘날들의 한 달’이라는 관용구로, ‘한 달 동안’ 곧 온전한 한 달을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보행자’는 히브리어 표현이 사람들을 ‘걸어서 다니는 자들’ 또는 ‘도보로 이동하는 자들’로 가리킬 수 있음을 반영한 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: But Moses said
  chosen_korean: 모세가 말했습니다
  alternatives_korean:
  - 그러나 모세가 말했습니다
  - 그리고 모세가 말했습니다
  lexicon: WLC
  rationale: 히브리어 서술 접속을 한국어에서는 자연스러운 대화 도입으로 풀어, 모세의 응답이라는 문맥적 대비는 뒤의 내용으로 드러나게 했습니다.
- source_word: רַגְלִי הָעָם
  english_pob_choice: the people ... are six hundred thousand on foot
  chosen_korean: 이 백성은 보행자만 해도 육십만 명인데
  alternatives_korean:
  - 이 백성은 육십만 명이 걸어서 다니는데
  - 이 백성은 육십만 명의 보행자만 있는데
  lexicon: HALOT
  rationale: רַגְלִי는 문자적으로 ‘발/걸음’과 관련되어 ‘걸어서 다니는 자들’의 뜻이므로, 본문이 사람 전체를 지칭하면서도 이동 방식에 초점을 둔 점을 살려 ‘보행자’로 옮겼습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: among whom I am
  chosen_korean: 내가 그 가운데 있는
  alternatives_korean:
  - 내가 그들 가운데 있는
  - 내가 그들 한가운데 있는
  lexicon: HALOT
  rationale: בְּקֶרֶב은 단순한 ‘함께 있음’보다 ‘가운데/한가운데 있음’의 공간적 뉘앙스가 있어, 모세가 백성 한가운데에 있음을 드러내는 표현으로 옮겼습니다.
- source_word: חֹדֶשׁ יָמִים
  english_pob_choice: for a month of days
  chosen_korean: 한 달 동안
  alternatives_korean:
  - 한 달의 날들 동안
  - 한 달 길이로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로는 자연스럽게 ‘한 달 동안’으로 옮기되, 의미는 ‘온전한 한 달’이라는 점을 유지했습니다.
theological_decisions:
- issue: 모세의 발언 안에 다시 인용문이 중첩되는 구조
  chosen_reading: 모세의 말 속에서 하나님의 직접 발화가 다시 인용되는 중첩 인용 구조를 그대로 살려, 독자가 약속의 주체와 모세의 반응을 분명히 구별하도록 했습니다.
  alternative_readings:
  - 모세의 말과 하나님의 말씀을 하나의 평서문으로 합치는 방식
  - 중첩 인용을 간접화법으로 완화하는 방식
  rationale: 본문은 응답-인용-응답의 구조를 통해 모세의 의문과 하나님의 약속을 대비시키므로, 이를 평탄화하면 본문의 긴장과 수사 효과가 약해집니다.
  doctrine_reference: 서사 문맥 보존 원칙
