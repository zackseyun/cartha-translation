- from: 모세가 말했습니다. 「내가 그 가운데 있는 이 백성은 보행자만 해도 육십만 명인데, 당신께서 ‘내가 그들에게 고기를 주겠고, 그들이 한 달 동안 먹을 것이다’라고 말씀하셨습니다」.[a][b]
  to: 그러나 모세가 말했습니다. “제가 그 가운데 있는 이 백성은 도보로 이동하는 사람이 육십만 명인데[b], 그런데도 주님께서는 ‘내가 그들에게 고기를 주겠다. 그들은 한 달 동안[a] 먹을 것이다’라고 말씀하셨습니다.”
  rationale: 원문의 수량 표현, 모세가 백성 가운데 있다는 관계절, 하나님 말씀의 중첩 인용, 미래형 약속을 보존했습니다. רַגְלִי의 해석상 열려 있는 범위는 본문에서 비군사적으로 번역하고 각주에서 ‘보병’ 가능성을 제시하여 보존했습니다. 각주 표지를 해당 표현으로 옮기고, 불필요한 ‘만 해도’를 제거했으며, 현대 합쇼체에 맞게 하나님을 가리키는 표현을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:11:11Z'
