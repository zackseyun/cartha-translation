    issue: ‘제가 주님의 눈에 은혜를 얻었거든요’
    rationale: 조건 접속사 אִם을 이유·설명처럼 처리하고 해요체 종결을 사용합니다. ‘제가 주님 보시기에 은혜를 입었다면’으로 조건성과 합쇼체를 회복해야 합니다.
