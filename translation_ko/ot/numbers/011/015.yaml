review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 두 번째 אִם 절은 ‘은혜를 얻었거든요’처럼 이유를 덧붙이는 말이 아니라, 죽여 달라는 청원에 연결되는 조건절이므로 ‘은혜를 입었다면’으로 옮겨야 합니다. רָעָתִי는 도덕적 악보다 개인에게 닥친 불행·재난을 가리키는 것으로 번역한 점이 적절합니다.
  naturalness: 초안의 ‘거든요’는 합쇼체 문맥에 맞지 않고 문장 종결도 앞뒤의 ‘주십시오’와 불균형합니다. 또한 ‘저로 하여금’은 현대 표준어에서는 다소 문어적이므로 ‘제가 … 않게 해 주십시오’가 자연스럽습니다.
  terminology: ‘주님 보시기에 은혜를 입다’는 חן בעיני의 관용적 의미를 자연스럽고 존중하는 합쇼체로 전달합니다. ‘제 불행’은 רָעָה의 재난·곤경 의미를 분명히 하면서 ‘고난’보다 원문의 재앙/불운 가능성을 더 넓게 보존합니다.
  issues:
