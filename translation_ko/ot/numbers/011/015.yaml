id: NUM.11.15
reference: Numbers 11:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
  footnotes:
  - marker: a
    text: Or 'do not let me see my calamity' or 'my trouble.' The Hebrew can denote adversity or disaster, not only moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 주님께서 저를 이렇게 대하신다면, 부디 저를 당장 죽여 주십시오. 제가 주님의 눈에 은혜를 얻었거든요. 저로 하여금 제 고난을 보지 않게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 고난’은 כאן의 רָעָה가 여기서 도덕적 악이 아니라 재난·곤경·불행의 의미로 쓰인 것을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה אַתְּ עֹשֶׂה לִּי
  english_pob_choice: If this is how you are going to deal with me
  chosen_korean: 만일 주님께서 저를 이렇게 대하신다면
  alternatives_korean:
  - 그리고 만일 이렇게 저를 대하신다면
  - 이런 식으로 저를 다루신다면
  lexicon: HALOT
  rationale: 히브리어의 조건문과 관계적 표현을 자연스러운 합쇼체로 옮기되, עשה + לִּי의 대상을 단순한 ‘행하다’보다 ‘대하다’로 풀어 원문의 관계적 뉘앙스를 살렸습니다.
- source_word: הָרְגֵנִי נָא הָרֹג
  english_pob_choice: please kill me at once
  chosen_korean: 부디 저를 당장 죽여 주십시오
  alternatives_korean:
  - 부디 저를 바로 죽여 주십시오
  - 제발 저를 단번에 죽여 주십시오
  lexicon: HALOT
  rationale: 명령형 + 부정사절대의 강조를 한국어에서는 ‘당장’으로, נָא의 간청은 ‘부디’로 옮겨 간청의 강도를 살렸습니다.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: if I have found favor in your eyes
  chosen_korean: 제가 주님의 눈에 은혜를 얻었거든요
  alternatives_korean:
  - 제가 주님의 눈에 은혜를 얻었다면
  - 제가 주님의 눈에 호의를 얻었다면
  lexicon: HALOT
  rationale: 관용구를 직역하되, Hebrew idiom의 ‘favor’는 한국어 성경 문맥에서 ‘은혜를 얻다’가 가장 자연스럽고 전통적으로도 잘 이해되는 표현입니다.
- source_word: בְּרָעָתִי
  english_pob_choice: my misery
  chosen_korean: 제 고난
  alternatives_korean:
  - 제 불행
  - 제 재난
  - 제 곤경
  lexicon: HALOT
  rationale: רָעָה가 도덕적 ‘악’이 아니라 처참한 처지와 재난을 가리키는 문맥이므로, 현대 한국어에서 가장 직접적으로 고통의 상태를 드러내는 ‘고난’으로 옮겼습니다.
theological_decisions:
- issue: אָנָה/간청의 어조와 하나님께 드리는 직접 화법
  chosen_reading: ‘부디… 주십시오’로 간청을 분명히 드러내고, 하나님께 대한 직접 호칭은 ‘주님’으로 유지했습니다.
  alternative_readings:
  - ‘제발… 해 주십시오’
  - ‘원하건대…’
  rationale: 모세의 절박한 탄원을 약화하지 않으면서도, 한국어 합쇼체 안에서 하나님께 드리는 정중한 직접 청원을 자연스럽게 표현하기 위함입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
