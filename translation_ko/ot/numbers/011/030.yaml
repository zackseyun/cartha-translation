translation:
  language: ko
  text: 그때 모세는 이스라엘의 장로들과 함께 진영으로 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘모여졌다’ 또는 ‘거두어졌다’로 옮길 수 있지만, 문맥상 여기서는 모세가 진영으로 돌아왔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 돌아갔습니다
  - 모여졌습니다
  - 거두어졌습니다
  lexicon: HALOT
  rationale: 문맥상 수동적 ‘모여졌다’보다 사건의 흐름에 맞는 ‘돌아오다’가 자연스럽고, POB의 ‘returned’를 한국어로 직접 살렸습니다.
- source_word: אֶל הַמַּחֲנֶה
  english_pob_choice: to the camp
  chosen_korean: 진영으로
  alternatives_korean:
  - 진영에
  - 진영 안으로
  - 진영으로 돌아
  lexicon: HALOT
  rationale: מַחֲנֶה는 이스라엘의 진영을 가리키므로, 이동 방향을 드러내는 ‘진영으로’가 가장 간결하고 자연스럽습니다.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  english_pob_choice: he and the elders of Israel
  chosen_korean: 그와 함께 이스라엘의 장로들과 함께
  alternatives_korean:
  - 그와 이스라엘의 장로들이
  - 그와 더불어 이스라엘의 장로들
  - 그와 이스라엘의 장로들과
  lexicon: HALOT
  rationale: 히브리어의 הוּא가 강조·부연 기능을 가지므로 이를 ‘그와 함께’로 드러내어, 모세가 장로들과 동행해 돌아왔다는 구조를 살렸습니다.
