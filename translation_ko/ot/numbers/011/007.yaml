  text: Now the manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
  footnotes:
  - marker: a
    text: Bdellium is a fragrant resin or gum; the exact identification of the Hebrew term is uncertain, and some understand it as a gemstone-like substance such as pearl or crystal.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 만나의 모양은 고수 씨 같고, 그 빛깔은 브델리움의 빛깔과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브델리움은 향이 있는 수지나 검(gum)일 수 있으며, 정확한 식별은 확실하지 않습니다. 일부는 진주나 수정 같은 보석성 물질로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  english_pob_choice: the manna
  chosen_korean: 이 만나
  alternatives_korean:
  - 만나
  lexicon: HALOT
  rationale: 문맥상 이미 알려진 광야의 양식이므로 정관성은 지시사 ‘이’로 자연스럽게 살리고, 고유명사처럼 통용되는 ‘만나’를 유지했습니다.
- source_word: כִּזְרַע גַּד
  english_pob_choice: like coriander seed
  chosen_korean: 고수 씨 같고
  alternatives_korean:
  - 고수씨 같고
  - 고수의 씨앗 같고
  - 고라드 씨 같고
  lexicon: HALOT
  rationale: גַּד를 식물명으로 읽는 영어 POB의 판단을 따라, 현대 독자가 알아보기 쉬운 ‘고수’로 옮겼고, 비교 표현은 ‘같고’로 자연스럽게 처리했습니다.
- source_word: וְעֵינֹו כְּעֵין
  english_pob_choice: and its appearance was like the appearance of
  chosen_korean: 그 빛깔은 … 빛깔과 같았습니다
  alternatives_korean:
  - 그 모습은 … 모습과 같았습니다
  - 그 눈은 … 눈과 같았습니다
  - 그 생김새는 … 생김새와 같았습니다
  lexicon: HALOT
  rationale: עַיִן의 관용적 의미인 외형·보이는 모습은 한국어에서 물체의 ‘빛깔’이 반복된 시각 비교와 잘 맞아, 중복된 ‘눈/외모’ 직역보다 문맥상 자연스러운 시각 묘사로 옮겼습니다.
- source_word: הַבְּדֹלַח
  english_pob_choice: bdellium
  chosen_korean: 브델리움
  alternatives_korean:
  - 베델리움
  - 향수 수지
  - 진주
  lexicon: HALOT
  rationale: 정확한 실체가 불확실한 용어이므로 해석어로 바꾸지 않고 음역 ‘브델리움’을 유지해, 영어 POB가 주석으로 남긴 불확실성을 보존했습니다.
theological_decisions:
- issue: 비교 대상의 불확실한 식별을 본문과 주석 중 어디에 둘 것인가
  chosen_reading: 본문은 단순한 외형 비교만 말하고, ‘브델리움’의 정체는 주석에서 불확실성으로 처리했습니다.
  alternative_readings:
  - 본문에서 ‘진주’나 ‘수정’으로 의미를 확정하는 읽기
  - 본문 자체에 설명을 덧붙이는 읽기
  rationale: 히브리어와 영어 POB 모두 정확한 식별을 확정하지 않으므로, 본문은 간결하게 유지하고 독자 안내는 각주로 옮기는 편이 원문 충실성에 부합합니다.
  doctrine_reference: 텍스트 비평/어휘 불확실성 보존
- issue: 히브리어의 반복된 ‘눈/모양’ 관용구를 한국어에서 어떻게 재현할지
  chosen_reading: 시각적 유사성을 드러내는 ‘빛깔’ 중심 표현으로 옮겼습니다.
  alternative_readings:
  - ‘모습’ 중심 번역
  - ‘눈’의 직역
  rationale: 문맥은 만나의 외형을 묘사하는 시각 비교이므로, 한국어 독자가 즉시 이해할 수 있는 감각적 표현을 쓰되 의미 범위를 벗어나지 않도록 조심했습니다.
  doctrine_reference: 문체/의미 보존
