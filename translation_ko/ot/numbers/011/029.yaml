  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
  footnotes:
  - marker: a
    text: Or, “Would that all the LORD’s people were prophets.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “give his Spirit upon them”; the expression means the LORD would place his Spirit on them for prophetic empowerment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모세가 그에게 말했습니다. “당신이 나를 위하여 질투합니까?[a] 야훼의 모든 백성이 예언자가 되고, 야훼께서 그들 위에 자신의 영을 두시면[b] 얼마나 좋겠습니까!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 위하여 질투합니까?’는 모세의 이익을 위해 질투하거나 보호하려는 열심을 내는지를 묻는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 위에 그의 영을 두시다’입니다. 이는 예언적 능력을 주시는 것을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  english_pob_choice: Are you jealous for my sake?
  chosen_korean: 너는 나를 위해 질투하느냐?
  alternatives_korean:
  - 너는 나를 위해 열심을 내느냐?
  - 너는 나를 위해 시기하느냐?
  lexicon: HALOT
  rationale: 문맥은 여호수아의 태도를 묻는 말이므로 한국어로는 ‘질투하다’가 가장 직접적입니다. ‘열심’은 긍정적으로 들릴 수 있고, ‘시기’는 다소 감정적·부정적으로 치우칠 수 있어 균형상 보완 번역으로 남겨 두었습니다.
- source_word: כָּל עַם יְהוָה
  english_pob_choice: all Yahweh’s people
  chosen_korean: 야훼의 모든 백성
  alternatives_korean:
  - 야훼께 속한 모든 백성
  - 모든 야훼의 백성
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 현대 한국어로 옮기되, 언약적 소속 관계를 분명히 하기 위해 ‘야훼의 모든 백성’으로 번역했습니다.
- source_word: נְבִיאִים
  english_pob_choice: prophets
  chosen_korean: 선지자들이
  alternatives_korean:
  - 예언자들이
  - 예언하는 사람들이
  lexicon: HALOT
  rationale: 히브리어 명사 נְבִיאִים는 직역상 ‘예언자들/선지자들’인데, 한국어 성경 수용사에서 널리 이해되는 용례를 고려해 ‘선지자들’을 택했습니다.
- source_word: רוּחוֹ
  english_pob_choice: his Spirit
  chosen_korean: 자신의 영
  alternatives_korean:
  - 그의 영
  - 그의 성령
  lexicon: HALOT
  rationale: 이 구절은 예언적 능력을 주시는 하나님의 영을 가리키므로 ‘영’으로 옮기되, 문맥상 야훼의 소유를 분명히 하려고 ‘자신의’로 풀었습니다. ‘성령’은 본문이 요구하는 명시적 신약식 용어를 넘어서므로 보류했습니다.
- source_word: וּמִי יִתֵּן
  english_pob_choice: If only
  chosen_korean: 얼마나 좋겠느냐
  alternatives_korean:
  - 오, 그렇게 되면 좋겠구나
  - 만일 … 이라면
  lexicon: HALOT
  rationale: 히브리어 관용구의 소망·바람을 한국어 감탄형으로 살렸습니다. 직역 질문형보다 문맥의 염원과 정서를 더 잘 드러냅니다.
theological_decisions:
