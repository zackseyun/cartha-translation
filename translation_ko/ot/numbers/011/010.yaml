  - 주
  rationale: 본문의 신명기적·계약적 고유명을 가리키는 직접 표기이므로, 제목어 대치보다 고유명 보존이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וּבְעֵינֵי מֹשֶׁה רָע의 관용구 처리
  chosen_reading: 악하게 보였습니다
  alternative_readings:
  - 불쾌하게 보였습니다
  - 나쁘게 보였습니다
  rationale: 히브리어가 드러내는 평가의 강도를 약화시키지 않기 위해, 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy §2: Maintain source tension'
