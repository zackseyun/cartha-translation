source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
  footnotes:
  - marker: a
    text: Or 'by their families.' The Hebrew term can denote family groups or clans.
    reason: lexical_alternative
  - marker: b
    text: Or 'it was displeasing to Moses.' Literally, 'it was evil in the eyes of Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 백성이 각기 자기의 씨족별로 — 곧 각 사람이 자기 장막 문에서 — 울고 있는 것을 들었습니다. 그러자 야훼의 분노가 크게 타올랐고, 그것은 모세의 눈에는 악하게 보였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 가족별로’입니다. 히브리어 용어는 가족 집단이나 씨족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모세에게 불쾌하게 보였습니다’입니다. 문자적으로는 ‘모세의 눈에는 악했습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들은
  - 듣게 되었습니다
  lexicon: HALOT
  rationale: 사건 진행의 서술로서 ‘듣다’의 완료형을 자연스럽게 살려, 단순한 인지 발생을 분명히 나타냅니다.
- source_word: לְמִשְׁפְּחֹתָיו
  english_pob_choice: by their clans
  chosen_korean: 각기 자기의 씨족별로
  alternatives_korean:
  - 각기 자기의 가족별로
  - 각 가문별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 문맥상 가족보다 더 큰 친족 집단을 가리킬 수 있어, 한국어에서는 ‘씨족’이 집단적 규모를 더 정확히 드러냅니다.
- source_word: לְפֶתַח אָהֳלוֹ
  english_pob_choice: at the entrance of his tent
  chosen_korean: 자기 장막 문에서
  alternatives_korean:
  - 자기 천막 입구에서
  - 자기 장막 입구에서
  lexicon: HALOT
  rationale: פֶּתַח의 공간 이미지를 살리되, 한국어 관용에 맞게 ‘문’으로 옮겨 장막 앞에서 우는 장면을 간결하게 전달합니다.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  english_pob_choice: the anger of Yahweh burned greatly
  chosen_korean: 야훼의 분노가 크게 타올랐고
  alternatives_korean:
  - 야훼의 진노가 크게 타올랐고
  - 야훼께서 크게 진노하셨고
  lexicon: HALOT
  rationale: חרה אף의 불타는 분노 이미지를 유지하기 위해 ‘타올랐고’를 택했고, יהוה는 본문 관례에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  english_pob_choice: it was evil in the eyes of Moses
  chosen_korean: 그것은 모세의 눈에는 악하게 보였습니다
  alternatives_korean:
  - 그것은 모세에게 불쾌하게 보였습니다
  - 그것은 모세에게 나쁘게 보였습니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 유지해 ‘악하게 보이다’로 옮기되, 한국어 문장으로 읽히도록 서술형으로 정리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
