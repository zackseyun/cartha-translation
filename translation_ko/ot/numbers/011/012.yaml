id: NUM.11.12
reference: Numbers 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
  footnotes:
  - marker: a
    text: Or 'as a nurse carries the suckling.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew has singular 'him' and 'his fathers,' treating 'people' as a collective singular; English could also render 'them' and 'their fathers.'
    reason: alternative_reading
translation:
  language: ko
  text: 제가 이 모든 백성을 잉태했습니까?[a] 제가 이 백성을 낳았습니까? 어찌하여 당신께서는 저에게 ‘양육자가 젖먹이를 품에 안고 가듯이 이 백성을 품에 안고, 그 조상들에게 맹세하신 땅으로 데려가라’고 말씀하십니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘백성’을 집합적 단수로 다루며, 이어지는 ‘그’와 ‘그 조상들’도 이에 맞추어 단수형으로 사용합니다. 한국어에서는 집합적 의미를 살리기 위해 ‘이 백성’을 반복했습니다.
    reason: alternative_reading
  - marker: b
    text: ‘양육자’에 해당하는 히브리어 הָאֹמֵן은 문맥에 따라 보호자, 돌보는 이, 유모 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  english_pob_choice: Did I conceive
  chosen_korean: 제가 이 모든 백성을 배었습니까?
  alternatives_korean:
  - 제가 이 백성을 잉태했습니까?
  - 제가 이 백성을 가졌습니까?
  lexicon: HALOT
  rationale: 히브리어의 출산/임신 은유를 살리면서, 현대 한국어에서 자연스럽고 직접적인 표현인 ‘배다’를 택했습니다. 질문형으로 처리해 모세의 격한 수사적 항의를 유지했습니다.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  english_pob_choice: Did I give birth to him
  chosen_korean: 제가 그들을 낳았습니까?
  alternatives_korean:
  - 제가 그를 낳았습니까?
  - 제가 그 백성을 낳았습니까?
  lexicon: HALOT
  rationale: 히브리어는 집합명사 ‘백성’에 대해 단수 대명사 어미를 쓰지만, 한국어에서는 ‘그들’이 집합 전체를 더 자연스럽게 가리킵니다. 산고의 은유를 유지하기 위해 ‘낳다’를 사용했습니다.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  english_pob_choice: Carry him in your bosom
  chosen_korean: 그들을 품에 안아
  alternatives_korean:
  - 그들을 품에 넣어
  - 그들을 가슴에 안아
  lexicon: HALOT
  rationale: בְחֵיקֶךָ를 직역해도 되지만, 현대 한국어에서 ‘품에 안다’가 동일한 신체적 보호 이미지를 가장 자연스럽게 전달합니다. 수여적·보호적 의미를 살리기 위해 ‘안아’로 옮겼습니다.
- source_word: הָאֹמֵן אֶת הַיֹּנֵק
  english_pob_choice: as a guardian carries a nursing child
  chosen_korean: 젖먹이를 안아 가듯이
  alternatives_korean:
  - 보호자가 젖먹이를 안아 가듯이
  - 유모가 젖먹이를 안아 가듯이
  lexicon: HALOT
  rationale: הָאֹמֵן은 돌보고 안는 사람을 가리키며, 한국어에서는 성별을 고정하지 않는 표현이 적절합니다. ‘젖먹이’는 הַיֹּנֵק의 수유 중인 유아를 간결하게 살립니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: to the land
  chosen_korean: 당신이 그들의 조상들에게 맹세하신 땅으로
  alternatives_korean:
  - 그 땅으로
  - 그 땅 위로
  lexicon: HALOT
  rationale: 문맥상 목적지 방향을 나타내므로 ‘~으로’가 자연스럽습니다. ‘땅’은 약속의 땅이라는 언약적 배경을 유지합니다.
- source_word: לַאֲבֹתָיו
  english_pob_choice: to his fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그의 조상들에게
  - 그 조상들에게
  lexicon: HALOT
  rationale: 히브리어는 집합명사에 맞춘 단수 소유격이지만, 한국어에서는 ‘그들의 조상들’이 집합 전체에 대한 관계를 더 분명히 드러냅니다. 수사적 자연스러움 때문에 복수화했습니다.
theological_decisions:
- issue: 집합명사 עָם의 한국어 처리
  chosen_reading: ‘백성’을 집합 전체로 이해하되, 한국어에서는 복수 대명사와 복수 목적어로 자연화했습니다.
  alternative_readings:
  - 단수형을 끝까지 유지해 ‘그’를 사용함
  - ‘백성’ 자체를 주어로 반복함
  rationale: 히브리어의 집합적 단수는 원문의 관찰이지만, 한국어에서는 단수 대명사 반복이 어색해질 수 있습니다. 이 절의 논지는 모세가 이스라엘 전체를 한 어린아이처럼 떠맡는 불가능성을 말하는 것이므로, 자연스러운 집합 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §5, §6
- issue: 보호/양육 이미지의 보존
  chosen_reading: ‘품에 안아, 젖먹이를 안아 가듯이’로 양육과 보호의 이미지를 살렸습니다.
  alternative_readings:
  - ‘보호하다’로 요약함
  - ‘안고 돌보다’로 완화함
  rationale: 본문은 단순한 운반이 아니라, 어린아이를 품고 돌보는 양육의 부담을 강조합니다. 이미지의 강도를 약화하지 않도록 구체적 동작을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
