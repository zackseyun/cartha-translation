base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
  footnotes:
  - marker: a
    text: Or 'set them' or 'made them stand.' The Hebrew verb is literally 'caused them to stand.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the tent'; context likely refers to the tent of meeting.
    reason: cross_reference
translation:
  language: ko
  text: 모세는 나가서 백성에게 야훼의 말씀을 전했습니다. 그는 백성의 장로들 가운데서 일흔 명을 모아 회막 둘레에 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 tent’입니다. 문맥상 회막을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 밖으로 나가서
  - 나와서
  lexicon: HALOT
  rationale: 이동 동사를 자연스러운 현대 한국어로 옮기되, 서술의 흐름을 살려 ‘나가서’로 간결하게 표현했습니다.
- source_word: אֵת דִּבְרֵי יְהוָה
  english_pob_choice: the words of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말들
  - 야훼의 메시지
  lexicon: HALOT
  rationale: דִּבְרֵי는 직역하면 ‘말씀들’이지만 한국어 성서체에서는 단수 ‘말씀’이 원문의 고정된 표현을 가장 자연스럽게 보존합니다.
- source_word: שִׁבְעִים אִישׁ
  english_pob_choice: seventy men
  chosen_korean: 일흔 명
  alternatives_korean:
  - 일흔 사람
  - 일흔 남자
  lexicon: HALOT
  rationale: 문맥상 장로들의 수를 세는 표현이므로 한국어에서는 자연스러운 수량 표현 ‘일흔 명’으로 옮기되, 남성성은 이미 ‘장로들’에서 드러납니다.
- source_word: סְבִיבֹת הָאֹהֶל
  english_pob_choice: around the tent
  chosen_korean: 회막 둘레에
  alternatives_korean:
  - 천막 둘레에
  - 장막 둘레에
  - 회막 주위에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 tent’이지만 문맥상 회막을 가리키므로, 본문이 암시하는 예배 장소를 분명히 하되 과도한 확장을 피해서 ‘회막’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신명기적 전승의 고유한 하나님의 이름을 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וַיַּעֲמֵד אֹתָם의 동작상
  chosen_reading: 세웠습니다
  alternative_readings:
  - 그들로 서게 했습니다
  - 배치했습니다
  - 세워 두었습니다
  rationale: 히필형은 직역하면 ‘서게 하다’이지만, 한국어에서는 사람을 일정한 위치에 두는 완료된 배치로 자연스럽게 드러나는 ‘세웠습니다’가 가장 무난합니다.
  doctrine_reference: HALOT; English audit note on lexical alternative
