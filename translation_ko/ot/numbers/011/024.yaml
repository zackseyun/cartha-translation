  to: 모세는 나가서 백성에게 야훼의 말씀을 전했습니다. 그는 백성의 장로들 가운데서 일흔 명을 모아 그들을 장막 둘레에 세웠습니다.[a]
  rationale: 원문이 사용하는 일반 명사 ‘그 장막’을 본문에서 유지하고, 회막이라는 문맥적 이해는 각주로 옮겼습니다. 그 밖의 표현은 원문의 동작 순서, 야훼의 이름, 장로들 중 일흔 명을 선택한 의미를 자연스럽게 보존하므로 유지했습니다.
