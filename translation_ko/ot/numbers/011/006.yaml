id: NUM.11.6
reference: Numbers 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
  footnotes:
  - marker: a
    text: Or 'our soul is dried up'; Hebrew נֶפֶשׁ (nephesh) can mean 'soul,' 'life,' or, in food-related contexts, 'appetite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이제 우리의 식욕은 말라버렸습니다[a]; 우리 눈앞에는 이 만나밖에 아무것도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 영혼이 말랐다’ — 히브리어 נֶפֶשׁ(nephesh)는 ‘영혼’, ‘생명’, 음식 관련 문맥에서는 ‘식욕’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그런데 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  lexicon: HALOT
  rationale: 이 문맥은 직전 상황과의 대비가 분명하므로, 단순한 시간표현보다 역접을 드러내는 ‘그런데 이제’가 자연스럽고 원문의 전환감을 살립니다.
- source_word: נַפְשֵׁנוּ
  english_pob_choice: our appetite
  chosen_korean: 우리의 식욕
  alternatives_korean:
  - 우리의 영혼
  - 우리의 생명
  - 우리 자신
  lexicon: HALOT
  rationale: 음식에 대한 불평이라는 문맥에서 נֶפֶשׁ는 문자적 ‘영혼’보다 갈망/식욕의 뜻이 더 적절하므로, 한국어도 ‘식욕’으로 옮겨 본문의 의미를 분명히 했습니다.
- source_word: יְבֵשָׁה
  english_pob_choice: is dried up
  chosen_korean: 말라버렸습니다
  alternatives_korean:
  - 말랐습니다
  - 메말랐습니다
  lexicon: HALOT
  rationale: 건조함과 소진의 상태를 담으면서도, 불평의 거친 어조를 살리기 위해 ‘말라버렸습니다’로 옮겼습니다.
- source_word: אֵין כֹּל בִּלְתִּי אֶל הַמָּן
  english_pob_choice: there is nothing at all except the manna
  chosen_korean: 이 만나밖에 아무것도 없습니다
  alternatives_korean:
  - 만나 외에는 아무것도 없습니다
  - 오직 만나만 있습니다
  lexicon: HALOT
  rationale: 부정의 강조와 배제 구조를 한국어의 ‘-밖에 ... 아무것도 없습니다’로 자연스럽게 재현해, 원문의 강한 불만 표지를 유지했습니다.
theological_decisions:
- issue: 이스라엘의 불평을 완화하지 않고 직설적으로 재현할지 여부
  chosen_reading: 불평의 과장을 그대로 살려 ‘말라버렸습니다’와 ‘아무것도 없습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 표현하기
  - 감정 강도를 낮추기
  rationale: 본문은 광야에서의 불만과 혐오를 드러내므로, 완화하지 않고 원문이 지닌 불평의 정서를 보존하는 것이 해석상 더 충실합니다.
  doctrine_reference: 본문 해석 원칙과 서술 어조 보존
