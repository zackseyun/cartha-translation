language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
  footnotes:
  - marker: a
    text: Or 'the fire subsided' or 'the fire sank down.' The Hebrew verb suggests the fire abated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성이 모세에게 부르짖었고, 모세는 야훼께 기도하였으며, 불은 가라앉았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불이 잦아들었습니다’, ‘불이 가라앉았습니다’로 옮길 수 있습니다. 히브리어 동사는 불이 누그러졌음을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  english_pob_choice: cried out
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 외쳤고
  - 소리쳤고
  lexicon: HALOT
  rationale: צעק은 단순한 발화보다 절박한 호소의 외침을 가리키므로, 문맥에 맞게 ‘부르짖다’가 가장 자연스럽고 강합니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향해
  - 모세 쪽으로
  lexicon: HALOT
  rationale: אֶל은 인물에게 향하는 방향을 나타내므로 한국어에서는 목적어 표지 ‘-에게’가 가장 간결하고 정확합니다.
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하였으며
  alternatives_korean:
  - 간구하였으며
  - 중보하였으며
  lexicon: HALOT
  rationale: 플 형의 פִּלֵּל 계열은 기본적으로 ‘기도하다’로 옮길 수 있으며, ‘중보하다’는 여기서 직접 드러나지 않는 해석을 덧붙일 수 있어 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 번역어 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨 하나님의 언약적 이름을 보존했습니다.
- source_word: וַתִּשְׁקַע הָאֵשׁ
  english_pob_choice: the fire died down
  chosen_korean: 불은 가라앉았습니다
  alternatives_korean:
  - 불은 잦아들었습니다
  - 불은 사그라졌습니다
  - 불은 진정되었습니다
  lexicon: HALOT
  rationale: שקע는 ‘가라앉다/잠잠해지다’의 의미이므로, 불이 완전히 꺼졌다고 단정하지 않으면서도 사그라드는 모습을 잘 살리는 ‘가라앉다’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 직설적으로 신명 יְהוָה를 사용하므로, 주어가 아닌 하나님의 고유한 언약 이름을 유지하는 것이 본문 의미를 더 충실하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
