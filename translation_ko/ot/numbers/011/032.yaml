source:
  edition: WLC
  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
  footnotes:
  - marker: a
    text: A homer was a large dry measure. The exact modern equivalent is uncertain; the point is that even the person who gathered the least collected a very large amount.
    reason: cultural_note
  - marker: b
    text: Or 'ten donkey-loads,' if חֳמָרִים is taken by its etymological association rather than as the standard dry measure 'homers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 백성이 그날 종일과 그 밤새, 그리고 다음 날까지 일어나 메추라기를 모았습니다. 가장 적게 모은 사람도 열 호멜을 모았고, 그들은 그것을 자기들을 위해 진영 사방에 펼쳐 놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 호멜은 큰 건조량 단위입니다. 정확한 현대 환산은 분명하지 않지만, 여기서는 가장 적게 모은 사람도 매우 많은 양을 모았다는 점이 강조됩니다.
    reason: cultural_note
  - marker: b
    text: 또는 어원적 연관을 따라 ‘열 나귀짐’으로 이해할 수 있습니다. 다만 כאן의 표준적인 건조량 단위 ‘호멜’로 보는 것이 더 일반적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  english_pob_choice: the people rose up
  chosen_korean: 그 백성이 … 일어나
  alternatives_korean:
  - 그 백성이 … 일어났습니다
  - 백성이 … 들고일어났습니다
  lexicon: HALOT
  rationale: קום의 역동성을 살리되 한국어에서는 자연스러운 서술로 풀어 ‘일어나’로 옮겼습니다. ‘들고일어나다’는 여기서 과도하게 강합니다.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  english_pob_choice: all that day and all the night and all the next day
  chosen_korean: 그날 종일과 그 밤새, 그리고 다음 날까지
  alternatives_korean:
  - 그날 하루 종일과 그 밤, 그리고 다음 날
  - 그날 종일과 밤새 그리고 이튿날 종일
  lexicon: HALOT
  rationale: 끊기지 않는 시간의 길이를 한국어 흐름으로 유지했습니다. ‘다음 날까지’는 מָחֳרָת의 연속성을 드러내면서도 과잉 해석을 피합니다.
- source_word: הַשְּׂלָו
  english_pob_choice: the quail
  chosen_korean: 메추라기
  alternatives_korean:
  - 메추라기들
  lexicon: HALOT
  rationale: 이미 앞 문맥에서 주어진 새를 가리키므로 표준적인 한국어 이름인 ‘메추라기’로 옮겼습니다. 복수 표지는 한국어에서 보통 생략합니다.
- source_word: הַמַּמְעִיט אָסַף עֲשָׂרָה חֳמָרִים
  english_pob_choice: the one who gathered the least gathered ten homers
  chosen_korean: 가장 적게 모은 사람도 열 호멜을 모았고
  alternatives_korean:
  - 가장 적게 모은 사람도 열 고멜을 모았고
  - 적게 모은 사람도 열 호멜이나 모았고
  lexicon: HALOT
  rationale: ממעט의 상대적 표현을 자연스럽게 풀어 ‘가장 적게 모은 사람도’로 옮겼습니다. חֹמֶר는 측정 단위를 드러내기 위해 음역 ‘호멜’을 유지했습니다.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ סְבִיבוֹת הַמַּחֲנֶה
  english_pob_choice: and they spread them out for themselves all around the camp
  chosen_korean: 그들은 그것을 자기들을 위해 진영 사방에 펼쳐 놓았습니다
  alternatives_korean:
  - 그들은 그것을 자기들을 위해 진영 주위에 펼쳐 놓았습니다
  - 그들은 그것을 자기들을 위해 진영 둘레에 널어 놓았습니다
  lexicon: HALOT
  rationale: שׁטח의 반복 구조는 실제로 펴서 놓는 동작을 강조하므로 ‘펼쳐 놓았습니다’로 살렸습니다. ‘진영 사방’은 סְבִיבוֹת의 둘레·주변 의미를 간결하게 반영합니다.
