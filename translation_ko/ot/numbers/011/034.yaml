base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
  footnotes:
  - marker: a
    text: Kibroth-hattaavah likely means “Graves of Craving” or “Graves of Greedy Desire.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳의 이름을 키브롯-핫다아와[a]라고 불렀습니다. 그곳에서 갈망하던 백성을 그들이 묻었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 키브롯-핫다아와는 문자적으로 “갈망의 무덤들” 또는 “탐욕의 무덤들”이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  english_pob_choice: the name of that place was called
  chosen_korean: 그곳의 이름은 …라 불렸습니다
  alternatives_korean:
