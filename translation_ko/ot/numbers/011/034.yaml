base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
  footnotes:
  - marker: a
    text: Kibroth-hattaavah likely means “Graves of Craving” or “Graves of Greedy Desire.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳의 이름은 키브롯-핫다아와[a]라 불렸습니다. 그곳에서 탐욕을 품었던 백성을 그들이 묻었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 키브롯-핫다아와는 문자적으로 “갈망의 무덤들” 또는 “탐욕의 무덤들”이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  english_pob_choice: the name of that place was called
  chosen_korean: 그곳의 이름은 …라 불렸습니다
  alternatives_korean:
  - 그 장소의 이름은 …라 불렸습니다
  - 그곳의 이름을 …라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 붙이기 관용구를 자연스러운 수동형으로 옮기되, 특정 주체를 임의로 보태지 않았습니다.
- source_word: קִבְרוֹת הַתַּאֲוָה
  english_pob_choice: Kibroth-hattaavah
  chosen_korean: 키브롯-핫다아와
  alternatives_korean:
  - 키브롯-핫타아와
  - ‘갈망의 무덤들’
  lexicon: HALOT
  rationale: 지명은 본문에서 음역으로 유지하고, 어근 뜻은 각주로 처리해 본문의 고유 지명을 보존했습니다.
- source_word: הַמִּתְאַוִּים
  english_pob_choice: who had craved
  chosen_korean: 탐욕을 품었던
  alternatives_korean:
  - 갈망했던
  - 욕망을 품었던
  - 탐하던
  lexicon: HALOT
  rationale: 이 분사형은 단순한 ‘원하다’보다 강한 갈망/탐욕의 뉘앙스를 가지므로, 한국어로도 그 긴장을 살렸습니다.
- source_word: קָבְרוּ אֶת הָעָם
  english_pob_choice: they buried the people
  chosen_korean: 그들이 묻었기 때문입니다
  alternatives_korean:
  - 그들이 백성을 묻었기 때문입니다
  - 사람들을 묻었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 주어는 문맥상 복수형 ‘그들’로 이해되며, 대상인 ‘백성’을 앞절에서 이미 제시했으므로 한국어에서는 반복을 줄여도 의미가 유지됩니다.
