review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the place name and causal relation, but it omits the explicit object of ''buried'': Hebrew says ''they buried the people who craved,'' not merely ''they buried [them].'' The active naming clause can be rendered naturally in Korean without supplying a specific subject.'
  naturalness: The passive '그곳의 이름은 …라 불렸습니다' is understandable, but '그곳의 이름을 …라고 불렀습니다' more directly reflects the Hebrew naming formula while remaining idiomatic in modern formal-polite Korean. Repeating '백성' in the second sentence avoids an ambiguous omitted object.
  terminology: '''탐욕을 품었던'' is interpretively stronger than the participle המתאוים, which denotes those craving/desiring. ''갈망하던'' preserves the contextual force without unnecessarily defining the craving as greed. The footnote appropriately supplies the semantic sense of the transliterated place name.'
  issues:
  - severity: medium
    issue: The object '백성' is omitted from the burial clause.
    rationale: The source explicitly has אֶת הָעָם, 'the people.' Korean can omit recoverable objects, but here the preceding sentence's subject is the place name, so omission weakens clarity and does not fully represent the source.
  - severity: low
    issue: '''탐욕을 품었던'' over-specifies the sense of המתאוים.'
    rationale: The term denotes people characterized by craving/desire. In context it is blameworthy, but '갈망하던' retains the lexical sense and leaves the precise evaluative nuance less overdetermined.
  revised_text: 그곳의 이름을 키브롯-핫다아와[a]라고 불렀습니다. 그곳에서 갈망하던 백성을 그들이 묻었기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 키브롯-핫다아와는 문자적으로 “갈망의 무덤들” 또는 “탐욕의 무덤들”이라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 명명 관용구를 능동형으로 자연스럽게 옮기고, 매장된 대상인 ‘백성’을 명시했습니다. 또한 ‘갈망하던’으로 원문의 참여형이 지닌 의미를 보존하면서 과도한 해석을 피했습니다. 지명 음역과 그 어원 각주는 유지했습니다.
