translation:
  language: ko
  text: 그는 그곳의 이름을 다베라[a]라고 불렀습니다. 이는 야훼의 불이 그들 가운데서 타올랐기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다베라’는 ‘타오름’과 관련된 이름입니다.
