  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
  footnotes:
  - marker: a
    text: Taberah sounds like 'burning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 곳의 이름을 다베라라 불렀습니다. 이는 야훼의 불이 그들 가운데서 타올랐기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다베라’는 ‘불타는 것’과 비슷한 소리를 냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름을 지었습니다
  - 명명했습니다
  lexicon: HALOT
  rationale: 히브리어 קרא는 이름을 ‘부르다/짓다’의 서술 관용을 가지며, ‘불렀습니다’가 이를 자연스럽게 살리면서 다음 구절의 이름 선포를 드러냅니다.
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  english_pob_choice: the name of that place
  chosen_korean: 그 곳의 이름을
  alternatives_korean:
  - 그 곳을
  - 그 곳의 이름
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’ 구문을 그대로 드러내어, 단순히 장소를 지칭하는 것보다 명명 행위를 분명히 보존합니다.
- source_word: תַּבְעֵרָה
  english_pob_choice: Taberah
  chosen_korean: 다베라
  alternatives_korean:
  - 타브에라
  - 타베라
  lexicon: HALOT
  rationale: 지명은 음역하되, 한국어 표기 관습상 발음에 가깝게 ‘다베라’로 옮겼습니다. 의미는 이어지는 설명절이 풀어 줍니다.
- source_word: בָעֲרָה
  english_pob_choice: burned
  chosen_korean: 타올랐기
  alternatives_korean:
  - 불탔기
  - 탔기
  lexicon: HALOT
  rationale: 불의 급격하고 생생한 작용을 나타내는 בער의 뉘앙스를 살리되, 한국어에서는 ‘타올랐기’가 자연스럽고 힘 있게 들립니다.
- source_word: בָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 안에서
  - 그들 속에서
  lexicon: HALOT
  rationale: 심판 상황에서 불이 공동체 한가운데 임했음을 분명히 하기 위해 ‘가운데서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문이 여호와의 이름을 직접 쓰므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 보존합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: ‘야훼의 불’로 직접 옮겨 신적 기원의 분명함을 유지했습니다.
  alternative_readings:
  - ‘주님의 불’
  - ‘여호와의 불’
  rationale: 본문은 하나님의 이름을 직접 사용하므로, 익숙한 교회 용어로 일반화하기보다 고유명을 유지하는 편이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
