revisions:
- from: 내가 내려가서 거기서 당신과 말하겠습니다. 그리고 당신에게 있는 영의 일부를 덜어 그들 위에 두겠습니다. 그러면 그들이 당신과 함께 백성의 짐을 질 것이니, 당신은 혼자서만 그것을 지지 않게 될 것입니다.[a]
  to: 내가 내려가 그곳에서 당신과 말하겠습니다. 내가 당신 위에 있는 영[a] 가운데 얼마를 가져다가 그들 위에도 두겠습니다. 그러면 그들이 당신과 함께 백성의 짐을 질 것이니, 당신은 혼자 그 짐을 지지 않게 될 것입니다.
  rationale: The revision preserves the Hebrew’s spatial and partitive imagery (‘당신 위에 있는 영 가운데 얼마를 … 그들 위에도 두겠습니다’), removes unnecessary redundancy, improves clause clarity, and relocates and strengthens the lexical footnote without resolving the term beyond its immediate context.
