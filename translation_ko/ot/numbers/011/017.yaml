id: NUM.11.17
reference: Numbers 11:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
  footnotes:
  - marker: a
    text: Or 'of the spirit that is on you.' The Hebrew רוּחַ can denote spirit, wind, or breath; here it refers to the empowering spirit given to Moses for leadership.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내려가 그곳에서 당신과 말하겠습니다. 내가 당신 위에 있는 영[a] 가운데 얼마를 가져다가 그들 위에도 두겠습니다. 그러면 그들이 당신과 함께 백성의 짐을 질 것이니, 당신은 혼자 그 짐을 지지 않게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 루아흐는 ‘영’, ‘바람’, 또는 ‘숨’을 뜻할 수 있습니다. 여기서는 모세에게 지도력을 위해 주어진 하나님의 영을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  english_pob_choice: I will come down
  chosen_korean: 내가 내려가서
  alternatives_korean:
  - 내가 내려오고
  - 내가 내려가겠습니다
  lexicon: HALOT
  rationale: ירד는 문자적으로 ‘내려가다’이므로, 신적 현현의 맥락을 살리면서도 한국어로 자연스럽게 옮겨 ‘내려가서’로 렌더링했습니다.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  english_pob_choice: and speak with you there
  chosen_korean: 거기서 당신과 말하겠습니다
  alternatives_korean:
  - 거기서 당신과 말씀하겠습니다
  - 거기서 당신에게 말하겠습니다
  lexicon: HALOT
  rationale: דבר עִם은 ‘~와 말하다/말씀하다’의 뜻이므로, 하나님의 직접 화법이라는 점을 반영하되 현대 한국어에서 자연스러운 ‘당신과 말하겠습니다’로 옮겼습니다.
- source_word: וְאָצַלְתִּי מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  english_pob_choice: I will take some of the Spirit that is on you
  chosen_korean: 당신에게 있는 영의 일부를 덜어
  alternatives_korean:
  - 당신 위에 있는 영의 일부를 덜어
  - 당신에게 있는 영에서 일부를 취해
  lexicon: HALOT
  rationale: אצל은 여기서 ‘일부를 떼어 내어 옮기다/덜어 주다’의 뉘앙스가 강하므로, 단순한 취득보다 분배·이양의 뜻을 살려 ‘덜어’로 표현했습니다. רוּחַ는 문맥상 지도력을 위한 하나님의 영이지만, 히브리어의 넓은 의미를 보존해 ‘영’으로 두었습니다.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  english_pob_choice: and put it on them
  chosen_korean: 그들 위에 두겠습니다
  alternatives_korean:
  - 그들 위에 놓겠습니다
  - 그들 위에 두고
  lexicon: HALOT
  rationale: שׂים은 ‘두다/놓다/세우다’의 기본 동사이므로, 영의 임재가 그들 위에 ‘놓이는’ 이미지를 살려 ‘그들 위에 두겠습니다’로 옮겼습니다.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  english_pob_choice: they will bear the burden of the people with you
  chosen_korean: 그들이 당신과 함께 백성의 짐을 질 것이니
  alternatives_korean:
  - 그들이 당신과 함께 백성의 부담을 질 것이니
  - 그들이 당신과 함께 백성의 부담을 맡을 것이니
  lexicon: HALOT
  rationale: נשא와 מַשָּׂא의 결합은 단순한 ‘짐’이 아니라 지도 책임의 분담을 가리키므로, 한국어에서도 ‘짐을 지다’로 책임의 무게를 살렸습니다.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  english_pob_choice: so that you will not bear it by yourself alone
  chosen_korean: 당신은 혼자서만 그것을 지지 않게 될 것입니다
  alternatives_korean:
  - 당신은 홀로 그것을 지지 않게 될 것입니다
  - 당신은 혼자 그것을 지지 않게 될 것입니다
  lexicon: HALOT
  rationale: לְבַדֶּךָ의 강조를 ‘혼자서만’으로 반영해, 모세가 홀로 책임을 지지 않게 되는 결과를 분명히 했습니다.
theological_decisions:
- issue: רוּחַ를 ‘성령’으로 특정할지 ‘영’으로 둘지
  chosen_reading: 영
  alternative_readings:
  - 성령
  - 하나님의 영
  rationale: 문맥상 지도력을 위한 하나님의 임재와 능력을 가리키지만, 히브리어 רוּחַ의 범위를 그대로 살려 ‘영’으로 두어 해석을 과도하게 특정하지 않았습니다. 이는 이후 문맥(민 11:25)과 함께 읽을 때 의미가 분명해집니다.
  doctrine_reference: 문맥적 의미는 분명히 하되, 번역어에서 신학적 결론을 미리 확정하지 않음
