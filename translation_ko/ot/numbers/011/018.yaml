id: NUM.11.18
reference: Numbers 11:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
  footnotes:
  - marker: a
    text: Or, 'Sanctify yourselves for tomorrow.' The Hebrew verb carries the sense of setting yourselves apart in preparation for the LORD's action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성에게는 이렇게 말하십시오. ‘내일을 위하여 자신을 거룩하게 하십시오. 그러면 여러분은 고기를 먹게 될 것입니다. 여러분이 “누가 우리에게 고기를 먹게 해 줄까? 이집트에서는 우리에게 좋았는데”라고 하며 야훼의 귀에 대고 울었기 때문입니다. 야훼께서 여러분에게 고기를 주실 것이며, 여러분은 먹게 될 것입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 הִתְקַדְּשׁוּ는 ‘거룩하게 하다’ 외에 ‘성별하다, 자신을 따로 구별하다’는 뜻도 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקַדְּשׁוּ
  english_pob_choice: Consecrate yourselves
  chosen_korean: 자신을 거룩하게 하십시오
  alternatives_korean:
  - 자신을 성별하십시오
  - 자신을 성결하게 하십시오
  - 자신을 거룩히 구별하십시오
  lexicon: HALOT
  rationale: 히트파엘 명령형은 단순 준비보다 하나님이 행하실 일을 앞두고 자신을 구별하여 거룩하게 하는 뉘앙스가 있어, 교회 전통어를 그대로 따르기보다 의미를 드러내는 표현을 택했습니다.
- source_word: לְמָחָר
  english_pob_choice: for tomorrow
  chosen_korean: 내일을 위하여
  alternatives_korean:
  - 내일
  - 내일을 위해
  - 내일까지
  lexicon: HALOT
  rationale: 준비의 목적을 나타내는 전치사의 힘을 살려, 단순한 시간 부사보다 목적성을 가진 표현으로 옮겼습니다.
- source_word: בָּשָׂר
  english_pob_choice: meat
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 살
  - 육
  lexicon: HALOT
  rationale: 문맥상 먹을 수 있는 고기를 가리키므로, 신체 부위를 연상시키는 ‘육체/살’보다 자연스러운 식재료 표현인 ‘고기’를 사용했습니다.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  english_pob_choice: Who will feed us meat?
  chosen_korean: 누가 우리에게 고기를 먹게 해 줄까?
  alternatives_korean:
  - 누가 우리에게 고기를 주어 먹게 할까?
  - 누가 우리에게 고기를 먹여 줄까?
  lexicon: HALOT
  rationale: הִפְעִיל의 사역적 의미를 살리되 한국어에서는 ‘먹게 해 주다’가 가장 자연스럽게 원문의 ‘먹게 하다/먹도록 하다’를 전달합니다.
- source_word: בְּאָזְנֵי יְהוָה
  english_pob_choice: in the hearing of Yahweh
  chosen_korean: 야훼의 귀에 대고
  alternatives_korean:
  - 야훼께 들리도록
  - 야훼의 들으심 안에서
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지인 ‘귀에’라는 표현을 살려, 단순히 ‘앞에서’로 완화하지 않고 하나님이 들으셨다는 생생한 뉘앙스를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문이 여호와 이름 יהוה를 직접 사용하므로, 인명 대신 칭호로 바꾸지 않고 프로젝트 기본값인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: ‘거룩하게 하다’의 명령 성격
  chosen_reading: 백성이 하나님의 다음 행위를 맞이하도록 자신을 거룩하게 구별해야 한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 몸과 마음을 준비하라는 뜻
  - 의식적 정결 예식을 하라는 뜻
  rationale: 동사 קדשׁ의 히트파엘은 의식적 준비만이 아니라 하나님께 속하도록 자신을 구별하는 의미를 포함하므로, 그 긴장을 약화시키지 않도록 번역했습니다.
  doctrine_reference: 성결/구별의 성격에 대한 일반적 구약 사용
- issue: 야훼의 응답과 원인-결과 관계
  chosen_reading: 백성의 불평이 야훼의 응답을 불러오는 구조를 살려 ‘그러면’으로 연결했습니다.
  alternative_readings:
  - 그리고 야훼께서 여러분에게 고기를 주실 것이며
  - 그러므로 야훼께서 여러분에게 고기를 주실 것이며
  rationale: 히브리어는 단순 연결이지만 문맥상 앞선 불평과 뒤이은 응답이 분명한 인과 구도를 이루므로, 한국어에서는 자연스러운 결과 연결을 드러냈습니다.
  doctrine_reference: 문맥상 신적 심판/응답의 서술 구조
