  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: Now the rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
  footnotes:
  - marker: a
    text: Or “the mixed multitude.” The Hebrew term is rare and pejorative, referring to a non-core crowd within Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “craved a craving,” an emphatic cognate expression for intense desire.
    reason: lexical_alternative
  - marker: c
    text: Or “the Israelites also.” Hebrew “the sons of Israel.”
    reason: lexical_alternative
  - marker: d
    text: Or “Who will give us meat to eat?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 있던 잡류[a]가 몹시 갈망했고[b], 이스라엘 자손[c]도 다시 울며 말했습니다. “누가 우리에게 고기를 먹여 주겠습니까?”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 섞인 무리’. 히브리어는 희귀하고 경멸적인 표현으로, 이스라엘 가운데 있던 비핵심 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘갈망을 갈망하였다’라는 동족어근 반복 표현으로, 강렬한 갈망을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들도’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘누가 우리에게 먹을 고기를 주겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  english_pob_choice: the rabble
  chosen_korean: 그 잡다한 무리
  alternatives_korean:
  - 그 섞인 무리
  - 그 떼거리
  - 잡류
  lexicon: HALOT
  rationale: אַסַפְסֻף는 희귀하고 경멸적인 집합명사이므로, 긍정적이지 않은 집단감을 살리기 위해 ‘잡다한 무리’로 옮겼습니다.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  english_pob_choice: among them
  chosen_korean: 그들 가운데 있던
  alternatives_korean:
  - 그들 한복판에 있던
  - 그들 가운데
  lexicon: HALOT
  rationale: 직역의 ‘그의/그들 가운데’보다 문맥상 자연스럽게 자리한 위치를 드러내는 표현으로 옮겼습니다.
- source_word: הִתְאַוּוּ תַּאֲוָה
  english_pob_choice: had a strong craving
  chosen_korean: 강한 욕구를 품었고
  alternatives_korean:
  - 몹시 탐냈고
  - 강하게 갈망했고
  - 간절히 원했고
  lexicon: HALOT
  rationale: 히브리어의 반복 강조는 강한 내적 갈망을 나타내므로, ‘욕구를 품다’에 ‘강한’을 더해 의미와 힘을 살렸습니다.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  english_pob_choice: Who will feed us meat?
  chosen_korean: 누가 우리에게 고기를 먹게 해 주겠습니까?
  alternatives_korean:
  - 누가 우리에게 고기를 주어 먹게 하겠습니까?
  - 누가 우리에게 고기를 먹여 주겠습니까?
  lexicon: HALOT
  rationale: 하필사의 동사 אכל의 사역형은 ‘먹게 하다’이므로, 자연스러운 한국어로 ‘먹게 해 주다’라고 옮겼습니다. ‘בָּשָׂר’는 여기서 음식으로서의 고기입니다.
theological_decisions:
- issue: 이스라엘 내부의 부정적 집단 묘사
  chosen_reading: ‘그 잡다한 무리’로 옮겨, 공동체 안의 비핵심·부정적 집단이라는 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘그 섞인 무리’
  - ‘혼합 무리’
  rationale: 본문은 단순한 인원 집합이 아니라 불평과 불만을 촉발하는 경멸적 집단을 가리키므로, 완화하지 않고 부정적 평가를 보존했습니다.
  doctrine_reference: 민수기 11장의 문맥적 경고와 공동체 거룩성
