  source_fidelity: 현 번역의 ‘먹지 않게 될 것입니다’는 히브리어의 반복 부정을 ‘먹지 못함’으로 해석하여 문맥상 의미를 반대로 만듭니다. 이 구절은 먹지 않을 기간들을 열거하는 말이 아니라, 먹는 기간이 하루·이틀·닷새·열흘·스무 날에 그치지 않을 것이라는 선언입니다.
