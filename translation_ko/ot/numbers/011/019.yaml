translation:
  language: ko
  text: 너희는 하루 동안만 먹을 것이 아니고, 이틀 동안만도 아니며, 닷새 동안만도 아니고, 열흘 동안만도 아니며, 스무 날 동안만도 아닐 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 기간 앞에 부정을 반복하여, ‘하루도 아니고, 이틀도 아니고, 닷새도 아니고, 열흘도 아니고, 스무 날도 아니다’라고 열거합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא ... תֹּאכְלוּ/ן
  english_pob_choice: You will eat not
  chosen_korean: 먹지 않게 될 것입니다
  alternatives_korean:
  - 먹지 않을 것입니다
  - 먹게 되지 않을 것입니다
  lexicon: HALOT
  rationale: 부정이 반복되는 경고문맥을 한국어에서 자연스럽게 풀어, 단순 미래보다 결과 상태를 보이는 표현으로 옮겼습니다.
- source_word: יוֹם אֶחָד / יוֹמָיִם / חֲמִשָּׁה יָמִים / עֲשָׂרָה יָמִים / עֶשְׂרִים יוֹם
  english_pob_choice: one day / two days / five days / ten days / twenty days
  chosen_korean: 하루만이 아니라 이틀도, 닷새도, 열흘도, 스무 날도
  alternatives_korean:
  - 한 날도, 두 날도, 다섯 날도, 열 날도, 스무 날도
  - 하루도, 이틀도, 닷새도, 열흘도, 스무 날도
  lexicon: HALOT
  rationale: 히브리어의 누적적 부정 열거를 살리기 위해 ‘~만이 아니라 …도’ 구조를 사용했고, 관용적 수사로서 ‘닷새/열흘/스무 날’을 택했습니다.
- source_word: וְ/לֹא
  english_pob_choice: or
  chosen_korean: 이 아니라
  alternatives_korean:
  - 또는
  - 그리고
  lexicon: HALOT
  rationale: 영어 POB가 반복 부정을 ‘or’로 풀어낸 것처럼, 한국어에서는 병렬접속사보다 ‘~이 아니라’가 부정의 연쇄를 더 자연스럽게 전달합니다.
