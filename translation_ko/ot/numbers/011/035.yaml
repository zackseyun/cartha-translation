base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
  footnotes:
  - marker: a
    text: Kibroth-hattaavah means 'graves of craving' or 'graves of lust.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 민망성이 있는 광야에서 하세롯으로 떠났고, 하세롯에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민망성’에 해당하는 히브리어 이름은 문자적으로 ‘갈망의 무덤들’ 또는 ‘욕망의 무덤들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  english_pob_choice: From Kibroth-hattaavah
  chosen_korean: 민망성이 있는 광야에서
  alternatives_korean:
  - 기브롯핫타아와에서
  - 갈망의 무덤에서
  - 욕망의 무덤에서
  lexicon: HALOT
  rationale: 이 지명은 본래 뜻이 ‘갈망/욕망의 무덤들’이라는 투명한 합성어이지만, 내러티브에서는 고유 지명으로 기능하므로 본문에는 음역 대신 의미를 드러내어 옮기고, 앞선 영어 POB의 각주에 대응하는 설명을 각주로 처리하는 편이 더 직접적입니다.
- source_word: נָסְע֥וּ
  english_pob_choice: set out
  chosen_korean: 떠났고
  alternatives_korean:
  - 출발했고
  - 길을 떠났고
  - 이동했고
  lexicon: HALOT
  rationale: נסע는 진영을 거두고 이동하는 뉘앙스를 가지므로, 현대 한국어에서는 단순한 ‘가다’보다 ‘떠나다’가 서술의 흐름을 가장 자연스럽게 살립니다.
- source_word: חֲצֵר֑וֹת
  english_pob_choice: Hazeroth
  chosen_korean: 하세롯
  alternatives_korean:
  - 하제롯
  - 헤세롯
  lexicon: HALOT
  rationale: 고유 지명은 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  english_pob_choice: and they stayed at Hazeroth
  chosen_korean: 하세롯에 머물렀습니다
  alternatives_korean:
  - 하세롯에 있었습니다
  - 하세롯에 머물러 있었습니다
  - 하세롯에 있었습니다
  lexicon: HALOT
  rationale: 이 절의 היה + ב는 단순 존재보다 일정 기간 체류한 의미로 읽히므로, ‘머물렀습니다’가 영어 POB의 ‘stayed’와 함께 서술적 의미를 가장 잘 반영합니다.
theological_decisions:
- issue: 지명 ‘Kibroth-hattaavah’의 의미를 본문에 노출할지 여부
  chosen_reading: 본문에서는 의미 번역을 택하고, 지명 고유성은 각주로 보완합니다.
  alternative_readings:
  - 지명을 그대로 음역해 ‘기브롯핫타아와’로 둔다
  - 의미만 번역해 ‘갈망의 무덤들’로 둔다
  rationale: 본문의 서술 기능과 지명 의미의 투명성을 함께 살리기 위해, 이해는 쉽게 하되 원문의 어원 정보는 각주로 보존합니다.
  doctrine_reference: '번역 원칙: 지명/어휘의 투명성 보존과 가독성의 균형'
