  alternative_readings:
  - 지명을 그대로 음역해 ‘기브롯핫타아와’로 둔다
  - 의미만 번역해 ‘갈망의 무덤들’로 둔다
  rationale: 본문의 서술 기능과 지명 의미의 투명성을 함께 살리기 위해, 이해는 쉽게 하되 원문의 어원 정보는 각주로 보존합니다.
