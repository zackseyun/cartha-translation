id: NUM.11.8
reference: Numbers 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁטוּ֩ הָ/עָ֨ם וְ/לָֽקְט֜וּ וְ/טָחֲנ֣וּ בָ/רֵחַ֗יִם א֤וֹ דָכוּ֙ בַּ/מְּדֹכָ֔ה וּ/בִשְּׁלוּ֙ בַּ/פָּר֔וּר וְ/עָשׂ֥וּ אֹת֖/וֹ עֻג֑וֹת וְ/הָיָ֣ה טַעְמ֔/וֹ כְּ/טַ֖עַם לְשַׁ֥ד הַ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
  footnotes:
  - marker: a
    text: Or, 'the taste of fresh oil.' The Hebrew phrase לְשַׁד הַשָּׁמֶן is difficult; it likely refers to the rich or fresh essence of oil.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성은 두루 다니며 그것을 거두어 들이고, 맷돌에 갈거나 절구에 찧거나 솥에 삶아 떡으로 만들었으며, 그 맛은 기름의 진한 맛 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름의 신선한 맛’. 히브리어 לְשַׁד הַשָּׁמֶן은 해석이 어려운 표현으로, 기름의 진하거나 신선한 정수를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ הָעָם
  english_pob_choice: The people would roam about
  chosen_korean: 백성은 두루 다니며
  alternatives_korean:
  - 백성은 이리저리 돌아다니며
  - 백성은 두루 돌아다니며
  lexicon: HALOT
  rationale: שָׁטוּ는 여기서 여기저기 움직이며 찾는 반복적 행동을 뜻하므로, 맨땅의 단순 이동보다 채집 상황을 살리는 ‘두루 다니며’가 자연스럽습니다.
- source_word: וְלָקְטוּ
  english_pob_choice: gather
  chosen_korean: 거두어 들이고
  alternatives_korean:
  - 거두고
  - 주워 모으고
  lexicon: HALOT
  rationale: 만나를 수확하듯 모으는 동작이므로, 단순한 ‘줍다’보다 ‘거두어 들이다’가 원문의 수집·채집 뉘앙스를 더 잘 드러냅니다.
- source_word: טָחֲנוּ בָרֵחַיִם / דָכוּ בַּמְּדֹכָה
  english_pob_choice: grind it in the millstones or crush it in the mortar
  chosen_korean: 맷돌에 갈거나 절구에 찧거나
  alternatives_korean:
  - 맷돌로 갈거나 절구로 찧거나
  - 맷돌에 갈거나 절구에 빻거나
  lexicon: HALOT
  rationale: בָּרֵחַיִם과 בַּמְּדֹכָה는 각각 구체적 도구를 가리키므로, 도구성을 살려 ‘맷돌’과 ‘절구’를 대응시켰습니다. ‘갈다/찧다’는 각각 원문의 분쇄 동작을 자연스럽게 전달합니다.
- source_word: לְשַׁד הַשָּׁמֶן
  english_pob_choice: rich oil
  chosen_korean: 기름의 진한 맛
  alternatives_korean:
  - 기름의 진한 기운
  - 신선한 기름의 맛
  - 기름의 풍성한 맛
  lexicon: HALOT
  rationale: לְשַׁד הַשָּׁמֶן은 의미가 어려운 표현이어서, 본문 뜻을 과하게 단정하지 않으면서도 음식의 농후하고 기름진 맛을 드러내는 ‘기름의 진한 맛’으로 옮겼습니다.
theological_decisions:
- issue: 만나의 맛을 어떻게 표현할지
  chosen_reading: 맛을 음식의 ‘진한’ 성격으로 풀어, ‘기름의 진한 맛’이라고 옮겼습니다.
  alternative_readings:
  - ‘진한 기름의 맛’
  - ‘신선한 기름의 맛’
  - ‘기름의 풍성한 맛’
  rationale: 히브리어가 난해한 관용구이므로, 본문의 확실한 의미를 과도하게 특정하지 않으면서도 풍미의 풍성함을 보존하는 번역을 택했습니다.
  doctrine_reference: '번역 원칙: 난해한 어휘는 해석을 최소화하고 문맥상 가능한 의미 범위 안에서 보존'
