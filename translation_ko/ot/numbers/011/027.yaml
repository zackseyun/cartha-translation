  terminology: ‘모세’, ‘엘닷’, ‘메닷’, ‘진영’, ‘예언하다’는 성서 문맥과 한국어 성서 용례에 잘 맞습니다. ‘예언하고 있습니다’는 원문의 분사형이 나타내는 진행 중인 상황을 적절히 드러냅니다.
