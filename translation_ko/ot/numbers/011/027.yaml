  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
  footnotes:
  - marker: a
    text: Or 'the young man ran and reported to Moses.' The Hebrew article on 'young man' may be rendered more formally as 'the young man,' and the reporting verb can also be translated 'reported' or 'informed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 한 젊은이가 달려가서 모세에게 알리고 말했습니다. "엘닷과 메닷이 진영에서 예언하고 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 젊은이’는 히브리어의 정관사를 문맥상 한국어의 부정 표현으로 자연스럽게 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּרָץ הַנַּעַר
  english_pob_choice: Then a young man ran
  chosen_korean: 그러자 한 젊은이가 달려가서
  alternatives_korean:
  - 젊은이가 달려가서
  - 한 젊은이가 뛰어가서
  - 젊은이가 달려서
  lexicon: HALOT
  rationale: וַיָּרָץ는 단순한 ‘달리다’의 서술이므로 ‘달려가서’가 자연스럽고, הַנַּעַר는 문맥상 특정되지 않은 인물을 가리키므로 ‘한 젊은이’로 옮겼습니다.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  english_pob_choice: and told Moses
  chosen_korean: 모세에게 알리고
  alternatives_korean:
  - 모세에게 말하고
  - 모세에게 보고하고
  - 모세에게 전하고
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다/보고하다’의 뜻을 가지므로, 단순 대화보다 사실 전달의 뉘앙스를 살린 ‘알리고’가 적절합니다.
- source_word: מִתְנַבְּאִים
  english_pob_choice: are prophesying
  chosen_korean: 예언하고 있습니다
  alternatives_korean:
  - 예언자처럼 말하고 있습니다
  - 예언하고 있습니다
  - 예언자 노릇을 하고 있습니다
  lexicon: HALOT
  rationale: 히트파엘 분사로 된 지속적 행위를 반영해 진행형으로 옮겼고, נבא의 핵심 의미를 직접 살려 ‘예언하고 있습니다’로 번역했습니다.
- source_word: בַּמַּחֲנֶה
  english_pob_choice: in the camp
  chosen_korean: 진영에서
  alternatives_korean:
  - 진영 안에서
  - 진영 가운데
  - 캠프에서
  lexicon: HALOT
  rationale: 광야 이스라엘의 מַחֲנֶה는 군사·공동체적 ‘진영’이 자연스러우므로, 현대 한국어에서 압축적으로 읽히는 ‘진영에서’를 택했습니다.
theological_decisions:
- issue: 예언 동사의 현재진행형 처리
  chosen_reading: 엘닷과 메닷이 지금 진영에서 예언하고 있다는 계속된 상태를 드러냈습니다.
  alternative_readings:
  - 예언합니다
  - 예언자처럼 말합니다
  rationale: 히브리어 분사 מִתְנַבְּאִים는 일시적 발화보다 지속 중인 행위를 가리키므로, 한국어에서도 진행상을 드러내는 것이 문맥상 더 정확합니다.
  doctrine_reference: 본문 서술의 시제/상(aspect) 반영
