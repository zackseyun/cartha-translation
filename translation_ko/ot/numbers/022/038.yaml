base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
  footnotes:
  - marker: a
    text: Or, “Can I indeed say anything?” The Hebrew uses an emphatic construction for ability.
    reason: lexical_alternative
translation:
  language: ko
  text: 발람이 발락에게 말했습니다. 「보십시오, 이제 당신에게 왔습니다. 제가 정말 아무것이나 말할 수 있겠습니까? 하나님께서 제 입에 넣어 주시는 바로 그 말만 제가 말하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무것이나 말할 수 있겠습니까’는 히브리어의 강조된 능력 표현을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이보십시오
  lexicon: HALOT
  rationale: 발람의 강조된 응답을 현대 한국어의 직접적 호칭으로 살려, 고어적인 뉘앙스가 강한 ‘보라’보다 합쇼체에 맞는 ‘보십시오’를 택했습니다.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  english_pob_choice: I have come to you now
  chosen_korean: 이제 당신에게 왔습니다
  alternatives_korean:
  - 이제 당신에게 왔습니다
  - 당신에게 지금 왔습니다
  - 지금 당신에게 왔습니다
  lexicon: HALOT
  rationale: ‘עַתָּה’의 즉시성을 살리되 한국어 어순은 자연스럽게 정리하여, 도착의 사실과 시점을 함께 드러냈습니다.
- source_word: הֲיָכוֹל אוּכַל ... דַּבֵּר מְאוּמָה
  english_pob_choice: Am I really able to speak anything at all
  chosen_korean: 제가 정말 아무것이나 말할 수 있겠습니까
  alternatives_korean:
  - 제가 정말 아무 말이나 할 수 있겠습니까
  - 제가 정말 아무것도 말할 수 있겠습니까
  lexicon: HALOT
  rationale: 능력의 강조를 담는 이중형 표현을 한국어의 수사적 질문으로 옮겼습니다. ‘아무것이나’는 여기서 부정적 극성의 ‘아무것이나/무엇이든’ 의미를 반영합니다.
- source_word: הַדָּבָר אֲשֶׁר יָשִׂים אֱלֹהִים בְּפִי
  english_pob_choice: the word that God puts in my mouth
  chosen_korean: 하나님께서 제 입에 넣어 주시는 바로 그 말
  alternatives_korean:
  - 하나님께서 제 입에 넣으시는 그 말씀
  - 하나님께서 제 입에 두시는 그 말
  lexicon: HALOT
  rationale: ‘입에 넣다’는 히브리어 관용구를 자연스러운 한국어로 살리면서, 인간이 아닌 하나님이 말을 주시는 이미지를 분명히 했습니다. ‘그 말’은 원문의 단수성을 유지합니다.
- source_word: אֹתוֹ אֲדַבֵּר
  english_pob_choice: I will speak only the word
  chosen_korean: 바로 그 말만 제가 말하겠습니다
  alternatives_korean:
  - 오직 그 말만 제가 말하겠습니다
  - 그것만 제가 말하겠습니다
  lexicon: HALOT
  rationale: 전면에 나온 목적어가 배타성을 강조하므로 ‘만’으로 한정성을 드러냈습니다. ‘바로’는 앞서 받은 그 단일한 말씀을 가리키는 뉘앙스를 보강합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신들
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 하나님이 발람의 발화 내용을 정하시는 분이므로 한국어 표준 신학 용례에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 발람의 발화 제한과 신적 통제
  chosen_reading: 발람은 자신이 원하는 말을 하는 것이 아니라, 하나님이 입에 넣어 주시는 말만 말할 수 있다고 말합니다.
  alternative_readings:
  - 발람이 자발적으로 자신을 제한하겠다고 말하는 정도로 볼 수 있습니다
  - 단지 말솜씨가 부족하다고 말하는 표현으로 완화할 수 있습니다
  rationale: 히브리어의 강한 능력 부정과 단수 ‘그 말’이 결합되어, 단순한 의지 표명이 아니라 발화의 범위가 하나님께 의해 제한됨을 드러냅니다. 번역은 이 긴장을 해소하지 않고 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
