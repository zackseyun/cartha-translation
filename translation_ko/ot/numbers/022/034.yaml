    rationale: לִקְרָאתִי는 기본적으로 ‘마주하여/맞아’라는 방향성을 지니지만, 본 단락에서는 천사가 칼을 들고 발람을 저지하는 상황이므로 적대적 대면의 의미가 분명합니다.
