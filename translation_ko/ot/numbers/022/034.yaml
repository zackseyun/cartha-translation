id: NUM.22.34
reference: Numbers 22:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'if it is evil in your eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 발람이 야훼의 천사[a]에게 말했습니다. 「제가 죄를 지었습니다. 당신이 길에서 나와 맞서려고 서 계신 줄을 알지 못했습니다. 이제 만일 당신 보시기에 그것이 악하다면[b], 제가 돌아가겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 눈에 악하다면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 문맥에서 초자연적 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 프로젝트 기본에 따라 ‘야훼’로 옮겼습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었습니다
  alternatives_korean:
  - 내가 죄를 범했습니다
  - 내가 죄를 지었습니다
  lexicon: HALOT
  rationale: 발람의 고백으로서 בעבר의 행위를 현재 관련성 있게 인정하는 말이므로, 합쇼체에서 자연스러운 ‘죄를 지었습니다’로 옮겼습니다.
- source_word: נִצָּב לִקְרָאתִי
  english_pob_choice: standing to confront me
  chosen_korean: 길에서 나를 맞으려고 서 계신
  alternatives_korean:
  - 나를 대적하려고 서 계신
  - 나를 맞으러 길에 서 계신
  lexicon: HALOT
  rationale: לִקְרָאתִי의 기본 의미는 ‘마주 나오다/맞으러 오다’이지만, 바로 앞의 칼 든 천사라는 정황 때문에 영어 POB처럼 대립적 뉘앙스를 살리되, 한국어에서는 ‘맞으려고 서 계신’으로 소스의 방향성과 긴장을 함께 반영했습니다.
- source_word: אִם רַע בְּעֵינֶיךָ
  english_pob_choice: if it is evil in your eyes
  chosen_korean: 당신의 눈에 그것이 악하다면
  alternatives_korean:
  - 당신 보시기에 그것이 악하다면
  - 당신 눈에 그것이 나쁘다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘눈에…악하다’의 도덕적 강도를 보존했습니다. ‘나쁘다’보다 ‘악하다’가 더 원문에 가깝습니다.
theological_decisions:
- issue: 신적 호칭 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 고유명 יְהוָה를 사용하므로, 전통적 대체 칭호인 ‘주’ 대신 프로젝트 기본에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접화법의 공손체 유지
  chosen_reading: 발람의 발화는 공손체로 유지하되, 하나님/천사에 대한 직접 호칭에서 존칭을 사용했습니다.
  alternative_readings:
  - 더 평이한 서술체
  - 전통적 성경체
  rationale: 서술은 현대 합쇼체로, 그러나 발람이 천사에게 말하는 장면은 한국어에서 자연스러운 존대 표현을 써서 장면의 긴장과 공손한 대면을 함께 살렸습니다.
  doctrine_reference: 'Korean style guide: standard modern formal-polite register'
