  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
  footnotes:
  - marker: a
    text: Or 'continued on' or 'passed on.' The Hebrew idiom literally has the sense of adding/continuing to go onward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 천사가 다시 앞으로 나아가 좁은 곳에 섰는데, 그곳에서는 오른쪽으로도 왼쪽으로도 돌 수 있는 길이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속 나아가다’, ‘지나가다’의 뜻일 수 있습니다. 히브리어 관용구는 문자적으로는 ‘더하다/계속하다’의 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  english_pob_choice: Then ... went farther
  chosen_korean: 다시 앞으로 나아가
  alternatives_korean:
  - 계속 지나가
  - 더 나아가
  - 계속 앞으로 가
  lexicon: HALOT
  rationale: יסף+עבור의 반복·진행 뉘앙스를 살려, 단순한 재개보다 ‘다시 앞으로 나아가’로 자연스럽게 옮겼습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: 수호적·초월적 존재를 가리키는 מַלְאַךְ는 이 문맥에서 ‘천사’가 가장 직접적이며, 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּמָקוֹם צָר
  english_pob_choice: in a narrow place
  chosen_korean: 좁은 곳에
  alternatives_korean:
  - 비좁은 곳에
  - 좁은 자리에서
  lexicon: HALOT
  rationale: 공간이 협소해 진행이 막히는 장면이므로, 관용화하지 않고 공간적 이미지를 살린 ‘좁은 곳’이 적절합니다.
- source_word: לִנְטוֹת יָמִין וּשְׂמֹאול
  english_pob_choice: to turn to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도 돌 수 있는 길
  alternatives_korean:
  - 오른쪽이나 왼쪽으로 돌 길
  - 좌우로 비켜갈 길
  lexicon: HALOT
  rationale: ‘돌다/돌 수 있는 길’로 방향 전환 가능성의 부재를 드러내어, 단순히 ‘길이 없다’보다 원문의 제약을 더 분명히 표현했습니다.
theological_decisions:
- issue: יהוה(YHWH) 고유명 처리
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명문자 자체를 드러내는 것이 원문 충실성과 감사 가능성을 높이며, 프로젝트 기본 용례에 맞춥니다.
  doctrine_reference: POB default terminology for יהוה / YHWH
- issue: 천사의 이동 동작 표현
  chosen_reading: ‘다시 앞으로 나아가’로 옮겼습니다.
  alternative_readings:
  - 다시 지나가
  - 계속 가다
  rationale: 히브리어의 진행·반복 동사를 단순 재서술보다 사건의 긴장감을 유지하는 방향으로 살렸습니다.
  doctrine_reference: Narrative aspect and motion in Hebrew prose
