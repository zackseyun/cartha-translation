  source_fidelity: 금지 명령과 ‘백성’의 지시는 정확하게 전달합니다. 다만 원문의 단수 집합명사 הָעָם 및 단수 서술 בָרוּךְ הוּא에 비추어, 이유절의 주어를 ‘그들은’으로 복수화하기보다 ‘그 백성은’으로 명시하는 편이 한국어에서도 원문의 집합적 단수 지시를 더 잘 보존합니다.
  naturalness: ‘가지 마십시오 / 저주하지 마십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 하나님이 발람에게 직접 하시는 금지 명령의 격식에도 알맞습니다. ‘그 백성은 복을 받았기 때문입니다’도 반복처럼 느껴질 수 있으나, 짧은 문맥에서 지시 대상을 분명히 하며 자연스럽습니다.
