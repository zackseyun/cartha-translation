id: NUM.22.12
reference: Numbers 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''because they are blessed.'' The Hebrew is singular: ''because it/he is blessed,'' referring to the people as a collective.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 발람에게 말씀하셨습니다. “그들과 함께 가지 마십시오. 그 백성을 저주하지 마십시오. 그 백성은 복을 받았기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘복을 받았다’라는 서술어와 대명사를 단수형으로 쓰며, 앞의 ‘그 백성’을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  lexicon: HALOT
  rationale: 직접 발화 주체로서 표준적인 신칭을 유지하되, 한국어 문장에서는 주어 표지를 자연스럽게 생략할 수 있어 간결하게 옮겼습니다.
- source_word: לֹא תֵלֵךְ / לֹא תָאֹר
  english_pob_choice: You must not go / You must not curse
  chosen_korean: 가지 마십시오 / 저주하지 마십시오
  alternatives_korean:
  - 가시면 안 됩니다 / 저주하면 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 금지형을 한국어 명령·금지 표현으로 옮기되, 하나님이 발람에게 직접 말씀하시는 장면이므로 높임말 종결을 사용했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 그 백성
  alternatives_korean:
  - 그 사람들
  - 그 ժողովուրդ
  lexicon: HALOT
  rationale: 이스라엘을 집합적 백성으로 가리키므로, 단순한 복수보다 집합성을 드러내는 ‘백성’이 원문에 더 가깝습니다.
- source_word: בָרוּךְ הוּא
  english_pob_choice: it is blessed
  chosen_korean: 그들은 복을 받았기 때문입니다
  alternatives_korean:
  - 그는 복을 받았기 때문입니다
  - 그 백성은 복을 받았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 집합명사 ‘백성’을 가리키는 집합-단수 용법이므로, 한국어에서는 자연스러운 집합적 표현으로 풀되 원문의 이유절 기능을 유지했습니다.
theological_decisions:
- issue: 금지 명령의 한국어 강도
  chosen_reading: 하나님이 발람에게 직접 내리시는 금지로 이해하여 ‘가지 마십시오 / 저주하지 마십시오’로 옮겼습니다.
  alternative_readings:
  - 가지 말라 / 저주하지 말라
  - 가면 안 됩니다 / 저주하면 안 됩니다
  rationale: 히브리어 לֹא + 미완료형의 금지력을 현대 한국어의 직접 금지 표현으로 전달하되, 합쇼체를 사용해 서술의 격식을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: ‘복을 받았기 때문입니다’의 집합-단수 처리
  chosen_reading: 히브리어의 단수 서술을 한국어에서 집합적 주어 ‘그들은’으로 자연화하되, 대상은 여전히 ‘그 백성’으로 이해했습니다.
  alternative_readings:
  - 그는 복을 받았기 때문입니다
  - 그 백성은 복을 받았기 때문입니다
  rationale: 원문의 의미는 개인이 아니라 이스라엘 공동체 전체의 축복 상태이므로, 한국어에서 오해를 줄이는 집합적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
