source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
  footnotes:
  - marker: a
    text: Hebrew 'this people' uses a singular collective; English could also be rendered 'these people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'strike it' / 'drive it out'; the Hebrew refers to the people as a singular collective, though English commonly uses the plural 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디 오셔서 이 백성을 나를 위해 저주하십시오. 그들은 나보다 너무 강합니다. 아마 내가 그들을 치고 그 땅에서 몰아낼 수 있을 것입니다. 내가 아는데, 당신이 축복하는 자는 복을 받고, 당신이 저주하는 자는 저주를 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이 백성’은 단수 집합명사로 쓰였으나, 한국어에서는 자연스럽게 복수 집단으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제
  alternatives_korean:
  - 그러니 지금
  - 그런즉 이제
  lexicon: HALOT
  rationale: 대화의 급박한 전환을 자연스럽게 살리면서, 한국어에서 과도한 문어색 없이 즉시성을 전달합니다.
- source_word: לְכָה נָּא
  english_pob_choice: please come
  chosen_korean: 부디 오셔서
  alternatives_korean:
  - 와 주십시오
  - 오십시오, 부디
  lexicon: HALOT
  rationale: 명령과 간청이 함께 있는 표현이어서, 공손한 요청의 뉘앙스를 살려 ‘부디’와 존대 동사를 함께 사용했습니다.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  english_pob_choice: curse this people for me
  chosen_korean: 이 백성을 나를 위해 저주하십시오
  alternatives_korean:
  - 이 백성에게 저주를 내리십시오
  - 이 백성에게 저주를 내려 주십시오
  lexicon: HALOT
  rationale: אָרָה의 직접적 의미를 ‘저주하다’로 살리고, לִּי는 요청의 수혜 방향을 드러내는 ‘나를 위해’로 옮겼습니다.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  english_pob_choice: because they are too mighty for me
  chosen_korean: 그들은 나보다 너무 강합니다
  alternatives_korean:
  - 그들은 나보다 강대합니다
  - 그들은 나보다 너무 막강합니다
  lexicon: HALOT
  rationale: 집단을 가리키는 단수 집합명사를 한국어의 자연스러운 복수 주어로 옮기고, 전투적 위협을 ‘강합니다’로 간결하게 전달했습니다.
- source_word: נַכֶּה בּוֹ וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  english_pob_choice: strike them and drive them out of the land
  chosen_korean: 그들을 치고 그 땅에서 몰아낼 수 있을 것입니다
  alternatives_korean:
  - 그들을 쳐서 그 땅에서 쫓아낼 수 있을 것입니다
  - 그들을 공격하고 그 땅에서 내쫓을 수 있을 것입니다
  lexicon: HALOT
  rationale: נכה와 גרש의 기본 동사를 그대로 살려, 해석을 과도하게 좁히지 않고 ‘치고 / 몰아내다’로 병렬했습니다.
- source_word: תְּבָרֵךְ מְבֹרָךְ ... תָּאֹר יוּאָר
  english_pob_choice: whoever you bless is blessed ... whoever you curse is cursed
  chosen_korean: 당신이 축복하는 자는 복을 받고, 당신이 저주하는 자는 저주를 받습니다
  alternatives_korean:
  - 당신이 복 주는 자는 복을 받고, 당신이 저주하는 자는 저주를 받습니다
  - 당신이 축복하는 이는 복되며, 당신이 저주하는 이는 저주받습니다
  lexicon: HALOT
  rationale: 축복/저주의 대응 구조를 유지하되, 결과 상태를 한국어에서 자연스럽게 나타내기 위해 수동적 결과 표현 ‘복을 받다 / 저주를 받다’를 사용했습니다.
theological_decisions:
- issue: 발람에게 보내는 발락의 간청에서 존대 체계
  chosen_reading: 발락의 요청을 현대 공손체로 옮기되, 본문의 간청성과 긴박성을 살리기 위해 ‘부디’와 존대 명령형을 함께 사용했습니다.
  alternative_readings:
  - 중립적 명령형으로 ‘오십시오’만 사용
  - 더 직접적으로 ‘오셔서… 하십시오’로만 처리
  rationale: 대상이 예언자/점술가에게 정중히 청하는 문맥이므로, 한국어에서 자연스러운 공손체가 본문의 화용론을 잘 반영합니다.
  doctrine_reference: 담화·화용론
