  naturalness: 현대 표준어 합쇼체는 전반적으로 유지되었습니다. ‘어쩌면 내가 그들을 쳐서 그 땅에서 몰아낼 수 있을지도 모릅니다’와 ‘내가 알기로는’이 발락의 조심스러운 기대와 근거 제시를 더 자연스럽게 전달합니다. 각주 표지는 설명 대상인 ‘이 백성’에 붙여야 합니다.
  terminology: ‘저주하다’, ‘축복하다’, ‘복을 받다’, ‘그 땅에서 몰아내다’는 본문의 어휘와 문맥에 적합합니다. ‘복을 받다/저주를 받다’는 히브리어의 수동적 결과 표현과 병렬을 자연스럽게 보존합니다.
