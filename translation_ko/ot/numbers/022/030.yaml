review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘평생’은 수식 범위가 다소 불명확하고, ‘타고 다닌 나귀 말이다’는 원문의 관계절을 독립된 구어적 덧말로 처리하여 문체와 구문 대응이 약해집니다. 반복 강조된 습관성은 ‘한 번이라도 ... 한 적이 있습니까?’로 자연스럽게 보존할 수 있습니다.
  naturalness: 초안의 ‘당신의 나귀’, ‘나귀 말이다’는 현대 한국어 직접화법에서 다소 부자연스럽고, 합쇼체 안에 ‘말이다’가 섞여 register가 흔들립니다. 문장을 한 개의 수사 의문문으로 정리하면 더 자연스럽고 현대적인 합쇼체가 됩니다.
  terminology: אָתוֹן의 성별 특정성은 본문에서 자연스러운 ‘나귀’로 처리할 수 있으나, 원어의 암컷 의미는 각주로 보존하는 것이 적절합니다. 발람, 나귀는 통용 표기이며, 신학 용어상의 문제는 없습니다.
  issues:
  - severity: medium
    issue: ‘당신이 오늘에 이르기까지 평생 타고 다닌 나귀 말이다’의 문체와 구문
    rationale: ‘나귀 말이다’는 합쇼체 직접화법과 조화되지 않으며, 원문의 ‘당신이 ... 타고 탄 당신의 나귀’라는 관계절의 연결도 느슨해집니다.
  - severity: low
    issue: ‘평생’의 지시 대상이 다소 불명확함
    rationale: 히브리어는 상대방의 처음부터 오늘까지라는 시간 범위를 가리킵니다. ‘예전부터 오늘까지 줄곧’은 한국어에서 자연스럽게 지속성을 나타내면서 불필요한 모호성을 줄입니다.
  - severity: low
    issue: 암나귀라는 어휘적 성별 정보가 본문과 각주 모두에서 누락됨
    rationale: 본문의 자연스러움을 위해 ‘나귀’를 유지할 수 있지만, אָתוֹן의 구체적 성별 의미는 각주에서 밝혀 두는 것이 영어 POB의 어휘 결정 및 원문 정보에 부합합니다.
  revised_text: 그러자 나귀가 발람에게 말했습니다. “제가 당신의 나귀, 곧 당신이 예전부터 오늘까지 줄곧 타고 다닌 나귀가 아닙니까? 제가 한 번이라도 이렇게 당신에게 한 적이 있습니까?” 그러자 그가 말했습니다. “아니오.”
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘나귀’는 특별히 암나귀를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 수사 의문문 구조와 ‘예전부터 오늘까지’의 지속성을 유지하면서, 초안의 구어적 덧말을 제거하여 현대 한국어 합쇼체로 다듬었습니다. ‘한 번이라도 ... 한 적이 있습니까?’는 반복된 동사의 습관성 강조와 부정적 답을 기대하는 질문의 뜻을 자연스럽게 전달합니다. 암나귀라는 원어의 구체적 의미는 본문의 자연성을 해치지 않도록 각주로 보존했습니다.
