base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
  footnotes:
  - marker: a
    text: Hebrew 'your she-donkey' / 'the she-donkey'; the noun specifically refers to a female donkey.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나귀가 발람에게 말했습니다. "내가 당신의 나귀가 아니냐? 당신이 오늘에 이르기까지 평생 타고 다닌 나귀 말이다. 내가 언제 한 번이나 이렇게 당신에게 해 본 적이 있느냐?" 그러자 그가 말했습니다. "아니요."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  english_pob_choice: the donkey / your donkey
  chosen_korean: 나귀 / 당신의 나귀
  alternatives_korean:
  - 암나귀
  - 당신의 암나귀
  lexicon: HALOT
  rationale: 히브리어 אָתוֹן은 암컷 나귀를 가리키지만, 한국어 본문에서는 자연스러운 서사체를 위해 기본형 ‘나귀’를 쓰고, 소유 관계는 ‘당신의’로 살렸습니다.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  english_pob_choice: all your life to this day
  chosen_korean: 오늘에 이르기까지 평생
  alternatives_korean:
  - 당신이 존재한 때부터 오늘까지
  - 태초부터 오늘까지
  lexicon: HALOT
  rationale: 관용적으로 ‘오래전부터 지금까지’라는 뜻이므로, 현대 한국어에서 가장 분명한 ‘오늘에 이르기까지 평생’으로 옮겼습니다.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  english_pob_choice: Have I ever been accustomed
  chosen_korean: 내가 언제 한 번이나 이렇게 당신에게 해 본 적이 있느냐
  alternatives_korean:
  - 내가 그런 식으로 한 적이 있느냐
  - 내가 그런 일에 익숙했던 적이 있느냐
  lexicon: HALOT
  rationale: סכן의 반복형이 ‘습관적으로 하다/익숙하다’는 뜻을 강조하므로, 단순한 능력이 아니라 ‘평소 그런 적이 있는가’라는 수사적 질문으로 살렸습니다.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  english_pob_choice: to do this to you
  chosen_korean: 이렇게 당신에게 해 본
  alternatives_korean:
  - 이렇게 당신에게 행동한
  - 이런 식으로 당신을 대했던
  lexicon: HALOT
  rationale: כֹה는 바로 앞에서 벌어진 이례적인 행동을 가리키므로, 한국어에서는 ‘이렇게’로 자연스럽게 대응했습니다.
