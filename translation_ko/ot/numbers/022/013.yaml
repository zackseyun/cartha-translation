  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
  footnotes:
  - marker: a
    text: Or “Balak’s princes” or “Balak’s leaders.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 발람이 아침에 일어나 발락의 관리들에게 말했습니다. 「당신들의 땅으로 돌아가십시오. 야훼께서 당신들과 함께 가도록 저를 허락하지 않으셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관리들’은 여기서 שָׂרִים의 의미를 문맥에 따라 풀어 옮긴 것입니다. 다른 가능성으로는 ‘방백들’ 또는 ‘지도자들’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי בָלָק
  english_pob_choice: Balak’s officials
  chosen_korean: 발락의 관리들
  alternatives_korean:
  - 발락의 방백들
  - 발락의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥에 따라 관원·지도자·방백을 뜻하지만, 여기서는 왕의 사절단이라는 점을 살려 현대 한국어의 ‘관리들’로 옮겼습니다.
- source_word: לְכוּ אֶל אַרְצְכֶם
  english_pob_choice: Go to your land
  chosen_korean: 당신들의 땅으로 돌아가십시오
  alternatives_korean:
  - 당신들의 땅으로 가십시오
  - 당신들의 고향으로 돌아가십시오
  lexicon: HALOT
  rationale: לְכוּ는 단순한 ‘가다’이지만, 앞선 방문 요청의 철회이므로 귀환의 뉘앙스를 살려 ‘돌아가십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 본문의 신명기형 고유명사를 관형적 대체어가 아닌 고유명 ‘야훼’로 유지해, 원문이 드러내는 하나님의 개인 이름을 보존했습니다.
- source_word: לְתִתִּי לַהֲלֹךְ עִמָּכֶם
  english_pob_choice: to let me go with you
  chosen_korean: 저를 허락하지 않으셨기 때문입니다
  alternatives_korean:
  - 제가 당신들과 함께 가도록 허락하지 않으셨기 때문입니다
  - 제가 당신들과 함께 가는 것을 허락하지 않으셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘가도록 주다/허락하다’의 관용구이므로, 한국어에서는 자연스럽게 ‘허락하지 않으셨다’로 풀어 원문의 의미를 그대로 전달했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 거절이 단지 일반적 ‘주’가 아니라 언약의 고유 이름을 지닌 분의 결정임을 드러내므로, POB 기준에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
