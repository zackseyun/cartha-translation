  source_fidelity: 핵심 의미는 대체로 충실하나, 현행 문장의 ‘야훼께서 당신들과 함께 가도록 저를 허락하지 않으셨기’는 ‘저를 허락하다’라는 문법·의미상 결함이 있어, 원문의 ‘내가 너희와 함께 가는 것을 허락하지 않으셨다’를 명시해야 합니다. 또한 לְכוּ는 단순히 ‘가십시오’이므로 ‘돌아가십시오’가 덧붙이는 귀환의 의미는 피하는 것이 안전합니다.
  naturalness: 합쇼체와 서술 흐름은 자연스럽습니다. 다만 허락의 대상과 행위를 분명히 한 ‘제가 당신들과 함께 가는 것을 허락하지 않으셨기 때문입니다’가 현대 표준 한국어로 자연스럽고 정확합니다.
  terminology: ‘발람’, ‘발락’, ‘야훼’, ‘관리들’은 적절합니다. שָׂרֵי의 대안에 관한 각주는 유지하되, 해당 어휘 바로 뒤에 앵커를 두는 편이 명확합니다.
