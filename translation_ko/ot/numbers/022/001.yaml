id: NUM.22.1
reference: Numbers 22:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel,' a standard national designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan' or 'on the other side of the Jordan.' The phrase is geographically relative to the narrator's perspective.
    reason: lexical_alternative
  - marker: c
    text: Jericho is the landmark indicating the location of the plains of Moab on the east side of the Jordan.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손[a]은 길을 떠나 여리고 맞은편[c], 요단강 건너편[b]의 모압 평지에 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어를 직역한 표현이며, 이스라엘 민족 전체를 가리키는 통상적인 명칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단강 너머’. 이 표현은 서술자의 관점에 따른 상대적 위치를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 여리고는 모압 평지의 위치를 나타내는 지리적 표지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 문자적 형식은 '이스라엘의 아들들'이지만, 한국어 성경에서는 이 집단 명칭을 자연스럽고 널리 통용되는 '이스라엘 자손'으로 옮기면 공동체 지칭을 살리면서도 어색함을 줄일 수 있습니다.
- source_word: וַיִּסְעוּ
  english_pob_choice: set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  lexicon: HALOT
  rationale: 광야 이동 서술에서 נסע는 진을 걷고 이동하는 뜻이므로, 현대 한국어에서는 간결한 '떠나'가 그 의미를 자연스럽게 전달합니다.
- source_word: בְּעַרְבֹת מוֹאָב
  english_pob_choice: in the plains of Moab
  chosen_korean: 모압 평지에
  alternatives_korean:
  - 모압의 광야 평원에
  - 모압의 스텝지대에
  lexicon: HALOT
  rationale: עֲרָבוֹת은 평야/초원 지형을 가리키므로, 관용적으로 굳어진 지명 표현인 '모압 평지'가 가장 명료합니다.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단강 건너
  alternatives_korean:
  - 요단강 너머
  - 요단강 건너편
  lexicon: HALOT
  rationale: 메시지의 핵심은 요단강을 기준으로 한 지리적 위치 관계이므로, 한국어에서는 '건너'가 가장 간결하고 자연스럽습니다.
- source_word: יְרֵחוֹ
  english_pob_choice: at Jericho
  chosen_korean: 여리고 맞은편
  alternatives_korean:
  - 여리고 앞
  - 여리고 옆
  lexicon: HALOT
  rationale: 히브리어는 여리고를 위치 표지로 사용하므로, 단순히 '여리고에'보다 '여리고 맞은편'이 요단 동편이라는 공간 관계를 더 정확히 드러냅니다.
theological_decisions:
- issue: 지리적 서술의 시점 보존
  chosen_reading: '''요단강 건너, 여리고 맞은편''으로 옮겨 서술자의 기준점을 드러냈습니다.'
  alternative_readings:
  - '''요단강 건너편 여리고에서''처럼 단순화'
  - '''요단강 동쪽 여리고 근처''처럼 명시화'
  rationale: 본문은 모압 평지의 위치를 서술자의 관점에서 상대적으로 제시하므로, 지나친 해설을 넣지 않고도 방향성을 유지하는 번역이 적절합니다.
  doctrine_reference: 성경 지리 서술의 서술자 관점 보존
