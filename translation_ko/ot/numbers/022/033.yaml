  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
  footnotes:
  - marker: a
    text: Hebrew literally, 'perhaps she turned aside from before me'; the clause is commonly understood as a counterfactual, 'if she had not turned aside from before me,' which fits the context and the following statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 나귀가 저를 보고 제 앞에서 세 번이나 비켜섰습니다. 만일 저가 내 앞에서 비켜서지 않았다면[a], 내가 지금 곧 당신을 죽이고 그 여인은 살려 두었을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘아마 저가 내 앞에서 비켜섰다’에 가깝지만, 문맥상 반사실적 조건문으로 이해하는 것이 일반적이어서 ‘만일 … 않았다면’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן / וַתִּרְאַנִי
  english_pob_choice: the donkey saw me
  chosen_korean: 나귀가 저를 보고
  alternatives_korean:
  - 그 암나귀가 저를 보고
  - 그 나귀가 저를 알아보고
  lexicon: HALOT
  rationale: אָתוֹן은 암나귀를 가리키지만, 한국어에서는 기본형 '나귀'가 가장 자연스럽고 문맥상 성별 정보는 뒤의 지시 대상과 동사로 충분히 드러납니다.
- source_word: וַתֵּט לְפָנַי
  english_pob_choice: turned aside before me
  chosen_korean: 제 앞에서 비켜섰습니다
  alternatives_korean:
  - 제 앞에서 비켜갔습니다
  - 제 앞에서 돌아섰습니다
  lexicon: HALOT
  rationale: נטה는 여기서 방향을 틀어 피하는 동작이므로 '비켜서다'가 자연스럽고, לְפָנַי의 공간 관계도 '제 앞에서'로 보존됩니다.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  english_pob_choice: these three times
  chosen_korean: 세 번이나
  alternatives_korean:
  - 이렇게 세 번
  - 이 세 차례
  lexicon: HALOT
  rationale: 직역하면 관용적으로 '세 번'의 뜻이므로, 반복의 빈도와 화자의 짜증 섞인 강조를 살려 '세 번이나'로 옮겼습니다.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  english_pob_choice: If she had not turned aside from before me
  chosen_korean: 만일 저가 내 앞에서 비켜서지 않았다면[a]
  alternatives_korean:
  - 아마 저가 내 앞에서 비켜섰다면
  - 혹시 저가 내 앞에서 비켜서지 않았다면
  lexicon: HALOT
  rationale: 히브리어 표면형은 אוּלַי로 '아마/어쩌면'의 가능성을 띠지만, 문맥상 다음 결과절과 함께 반사실적 조건문으로 이해해야 하므로 한국어도 그 의미를 분명히 드러냈습니다.
- source_word: וְאוֹתָהּ הֶחֱיֵיתִי
  english_pob_choice: and let her live
  chosen_korean: 그 여인은 살려 두었을 것입니다
  alternatives_korean:
  - 그 여인은 살렸을 것입니다
  - 그 여인은 살려 주었을 것입니다
  lexicon: HALOT
  rationale: חיה의 히필은 '살리다/살려 두다'의 뜻이므로, 앞의 '죽이고'와 대조되는 결과를 살리면서 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: אוּלַי의 표면형과 문맥상 반사실적 의미의 긴장
  chosen_reading: 문맥에 따라 '만일 … 않았다면'으로 옮겨, 본문이 의도하는 반사실적 의미를 드러냈습니다.
  alternative_readings:
  - '''아마 저가 내 앞에서 비켜섰을 것입니다''처럼 표면형을 따라 옮김'
  - '''혹시 …''처럼 가능성 표현을 유지함'
  rationale: 이 절은 나귀의 회피가 발람의 죽음을 막았다는 서술 논리 안에서 읽혀야 하므로, 원문의 잠정성 표현을 그대로 살리기보다 문맥상 분명한 반사실적 조건을 한국어로 재현하는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 'translation philosophy: optimal-equivalence; source sense and narrative coherence are primary.'
