  to: 나귀가 나를 보고 내 앞에서 이렇게 세 번 비켜섰습니다. 만일 그 나귀가 내 앞에서 비켜서지 않았더라면[a], 나는 벌써 당신을 죽이고 그 나귀는 살려 두었을 것입니다.
