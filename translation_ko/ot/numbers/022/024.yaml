source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'messenger' or 'angel,' but here the supernatural sense fits the narrative context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 포도원들 사이의 좁은 길에 섰습니다. 그 길 이쪽에도 담이 있고 저쪽에도 담이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재이므로 ‘천사’로 옮기되, יְהוָה는 본 프로젝트 기본에 따라 ‘야훼’로 직접 옮겼습니다.
- source_word: בְּמִשְׁעוֹל
  english_pob_choice: in a narrow path
  chosen_korean: 좁은 길
  alternatives_korean:
  - 좁은 오솔길
  - 좁은 통로
  lexicon: HALOT
  rationale: mishʻol은 좁고 제한된 길을 가리키므로, 서술의 긴박함을 살리면서도 자연스러운 ‘좁은 길’이 적절합니다.
- source_word: הַכְּרָמִים
  english_pob_choice: between the vineyards
  chosen_korean: 포도원들 사이
  alternatives_korean:
  - 포도원들 가운데
  - 포도원들 사이에
  lexicon: HALOT
  rationale: 복수형 ‘포도원들’을 살리고, 이어지는 양쪽의 담 묘사와 맞게 공간 관계를 ‘사이’로 표현했습니다.
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  english_pob_choice: with a wall on this side and a wall on that side
  chosen_korean: 이쪽에는 담이 있고 저쪽에도 담이 있었습니다
  alternatives_korean:
  - 이쪽에는 담이 있고 저쪽에도 담이 있었습니다
  - 한쪽에는 담이 있고 다른 쪽에도 담이 있었습니다
  lexicon: HALOT
  rationale: gader는 재료를 특정하지 않는 둘레담/울타리 의미가 있어 ‘담’으로 옮겼고, 반복 구조를 한국어에서 가장 분명하게 드러냈습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문에 직접 있는 여호와 이름을 제목어 ‘주’로 치환하지 않고, 프로젝트 기본에 따라 고유명 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
