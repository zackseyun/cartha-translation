revisions:
- from: 나귀가 야훼의 천사가 길에 서 있는 것을 보았는데, 그의 손에는 칼이 뽑혀 있었습니다[a]. 나귀는 길에서 벗어나 들판으로 갔고, 발람은 나귀를 길로 돌이키려고 그녀를 쳤습니다.
  to: 나귀가 야훼의 천사가 길에 서서 손에 칼을 뽑아 들고 있는 것을 보았습니다[a]. 나귀는 길에서 벗어나 들판으로 갔습니다. 그러자 발람은 나귀가 길로 돌아가게 하려고 나귀를 쳤습니다.
  rationale: 천사가 ‘손에 칼을 뽑아 들고’ 있다는 표현으로 칼과 천사의 관계 및 칼이 뽑힌 상태를 자연스럽게 드러냈습니다. 나귀의 문법적 여성성을 한국어 인칭대명사로 옮기지 않고 명사를 반복하여 자연스러운 문체를 유지했으며, 발람이 나귀를 길로 돌아가게 하려 했다는 목적을 명확히 했습니다.
