  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나귀가 야훼의 천사가 길에 서서 손에 칼을 뽑아 들고 있는 것을 보았습니다[a]. 나귀는 길에서 벗어나 들판으로 갔습니다. 그러자 발람은 나귀가 길로 돌아가게 하려고 나귀를 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 메신저
  - 야훼의 사자
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 문맥에서 초자연적 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  english_pob_choice: with his sword drawn in his hand
  chosen_korean: 그의 손에는 칼이 뽑혀 있었습니다
  alternatives_korean:
  - 그의 손에는 칼이 쥐여 있었고 뽑혀 있었습니다
  - 손에 뽑은 칼을 들고 있었습니다
  lexicon: HALOT
  rationale: ‘뽑혀 있는’은 שְׁלוּפָה의 ‘뽑힌/맨’ 상태를 직접 살리며, ‘손에’로 בְּיָדוֹ의 위치를 자연스럽게 드러냅니다.
- source_word: וַתֵּט ... וַתֵּלֶךְ בַּשָּׂדֶה
  english_pob_choice: turned aside ... went into the field
  chosen_korean: 길에서 벗어나 들판으로 갔고
  alternatives_korean:
  - 길을 비켜 들판으로 갔고
  - 길을 떠나 들판으로 갔고
  lexicon: HALOT
  rationale: נָטָה와 ‘들판’(שָׂדֶה)의 이동을 간결하게 묶어, 단순한 방향 전환이 아니라 실제로 길을 이탈했음을 보여 줍니다.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  english_pob_choice: to turn her back to the road
  chosen_korean: 길로 돌이키려고
  alternatives_korean:
  - 길로 되돌리려고
  - 길로 다시 돌려놓으려고
  lexicon: HALOT
  rationale: 하나나가 이미 길에서 벗어난 뒤이므로, ‘돌이키다’가 방향을 다시 길 쪽으로 되돌리는 의미를 잘 드러냅니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 인격적 이름이므로, 본 프로젝트 기본원칙에 따라 제목화된 대체어 ‘주’보다 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
