id: NUM.22.37
reference: Numbers 22:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
  footnotes:
  - marker: a
    text: Or 'Did I not certainly send to you,' with the Hebrew using an infinitive absolute plus finite verb for emphasis; some understand the emphasis contextually as repeated or urgent sending.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Why did you not go to me?'
    reason: lexical_alternative
  - marker: c
    text: '''Honor you'' may include the sense of bestowing reward or high status, not merely showing respect.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발락이 발람에게 말했습니다. 「내가 정말 너에게 사람을 보내어 너를 부르지 않았느냐? 어찌하여 네가 내게 오지 않았느냐? 내가 정말 너를 높여 줄 수 없다는 말이냐?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol을 한국어 합쇼체의 자연스러운 서술로 옮기되, 직접화법 도입을 분명하게 유지했습니다.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  english_pob_choice: Did I not indeed send to you
  chosen_korean: 내가 정말 너에게 사람을 보내어 너를 부르지 않았느냐
  alternatives_korean:
  - 내가 정말 너에게 보냈지 않느냐
  - 내가 분명히 너에게 사람을 보냈지 않느냐
  lexicon: HALOT
  rationale: 부정의 수사의문과 강조용 부정사 절대형+동사형의 힘을 살려, 단순한 과거보다 ‘사람을 보내어 부르다’로 구체화해 자연스럽게 옮겼습니다.
- source_word: לִקְרֹא לָךְ
  english_pob_choice: to call you
  chosen_korean: 너를 부르
  alternatives_korean:
  - 너를 소환하
  - 너를 초청하
  lexicon: HALOT
  rationale: 이 문맥의 קרא는 단순한 ‘부르다’보다 ‘불러 오게 하다’의 뜻이므로, 앞뒤 문맥과 맞는 한국어 ‘부르다’를 택했습니다.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  english_pob_choice: Why did you not come to me?
  chosen_korean: 어찌하여 네가 내게 오지 않았느냐
  alternatives_korean:
  - 왜 내게 오지 않았느냐
  - 어찌하여 내게 가지 않았느냐
  lexicon: HALOT
  rationale: הלך의 직역인 ‘가다’보다 발락의 관점에서 자연스러운 ‘오다’가 원문의 방향성을 더 정확히 드러냅니다.
- source_word: כַּבְּדֶךָ
  english_pob_choice: honor you
  chosen_korean: 너를 높여 줄 수 없다는 말이냐
  alternatives_korean:
  - 너를 존귀하게 할 수 없다는 말이냐
  - 너를 존중해 줄 수 없다는 말이냐
  - 너를 영화롭게 할 수 없다는 말이냐
  lexicon: HALOT
  rationale: כבד의 핵심은 단순 예의가 아니라 지위나 보상까지 포함한 ‘영예를 주다’이므로, 문맥상 보다 넓은 의미를 살려 ‘높여 주다’로 옮겼습니다.
theological_decisions:
- issue: 발락의 마지막 질문인 ‘honor you’의 범위
  chosen_reading: ‘너를 높여 줄 수 없다는 말이냐’로 옮겨, 예우뿐 아니라 보상과 지위 부여의 뉘앙스를 함께 담았습니다.
  alternative_readings:
  - ‘너를 존중해 줄 수 없다는 말이냐’
  - ‘너를 보상해 줄 수 없다는 말이냐’
  rationale: 본문의 כּבד는 단순한 존중보다 더 강한 사회적·물질적 영예 부여를 포함할 수 있으므로, 의미를 좁히지 않는 표현이 적절합니다.
  doctrine_reference: 발람 서사의 문맥상 예언자에 대한 왕의 회유와 보상 약속을 반영하는 어휘 선택
