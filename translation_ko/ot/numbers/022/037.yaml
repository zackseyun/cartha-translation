  to: 발락이 발람에게 말했습니다. “내가 너를 부르려고 네게 분명히[a] 보내지 않았습니까? 왜 내게 오지[b] 않았습니까? 내가 정말 너를 높여 줄 수 없겠습니까[c]?”
  rationale: 첫 질문에서 본문에 명시되지 않은 ‘사람’을 제거하고, 강조형의 의미는 ‘분명히’로 옮겼습니다. 또한 현대 합쇼체에 맞추어 인용문 의문형을 통일했습니다. 마지막 질문의 ‘높여 주다’는 원문의 영예·보상 함의를 넓게 보존하므로 유지했습니다. 각 영어 감사 주석에 대응하는 한국어 주석을 해당 어구에 앵커로 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:39Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 질문의 히브리어는 강조형(부정사 절대형+완료형)으로 ‘분명히/참으로 보냈다’라는 뜻입니다. 초안의 ‘사람을’은 본문에 명시되지 않은 목적어이므로, 문맥상 가능한 보충이지만 본문 번역에서는 피하는 것이 더 충실합니다. 마지막 כַּבְּדֶךָ는 ‘존귀하게 대하다/영예를 베풀다’ 및 문맥상 보상의 함의를 가질 수 있는데, ‘높여 주다’는 대체로 이를 보존합니다.
  naturalness: ‘내가 정말 너에게 사람을 보내어 너를 부르지 않았느냐’는 한국어에서 목적어 보충과 연결이 다소 부자연스럽습니다. ‘너를 부르려고 네게 분명히 보내지 않았습니까?’는 원문의 생략된 목적어를 유지하면서 자연스럽습니다. 합쇼체 표기 기준에 맞추어 직접화법의 의문문도 ‘-습니까?’로 통일했습니다.
  terminology: 발락, 발람은 통용되는 표준 표기입니다. ‘높여 주다’는 כבד의 넓은 의미를 과도하게 ‘보상하다’로 한정하지 않으면서도, 존경만을 뜻하는 표현보다 문맥에 잘 맞습니다.
  issues:
  - severity: medium
    issue: ‘사람을’이 히브리어 본문에 없는 목적어를 명시합니다.
    rationale: שָׁלֹחַ שָׁלַחְתִּי אֵלֶיךָ는 문자적으로 ‘내가 네게 분명히 보냈다’이며, 무엇을/누구를 보냈는지는 문법적으로 명시하지 않습니다. 앞 문맥의 사절 파견과 조화되지만, 본문 번역에서는 이를 단정적으로 삽입하지 않는 편이 안전합니다.
