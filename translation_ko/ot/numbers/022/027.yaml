source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the female donkey''; the main text uses ''the donkey'' for natural English, with the feminine reflected by ''she.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the messenger of the LORD.' Here 'angel' is preferred because the context indicates a supernatural messenger.
    reason: lexical_alternative
translation:
  language: ko
  text: 암나귀가 야훼의 천사를 보고, 발람 아래에 엎드렸습니다. 그러자 발람이 화가 나서 막대기로 암나귀를 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암나귀’를 뜻합니다. 본문에서는 자연스러운 한국어를 위해 ‘암나귀’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사자’/‘전달자’일 수 있으나, 이 문맥에서는 초자연적 존재를 가리키므로 ‘천사’가 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  english_pob_choice: the donkey
  chosen_korean: 암나귀
  alternatives_korean:
  - 나귀
  - 당나귀
  lexicon: HALOT
  rationale: 히브리어 אָתוֹן은 암컷 나귀를 가리키므로, 자연스러운 본문에는 ‘암나귀’가 가장 직접적입니다. 영어 POB처럼 본문을 읽기 쉽게 하되, 성별 정보도 유지했습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: 이 문맥에서는 초자연적 존재를 가리키므로 ‘천사’가 מתאים합니다. יְהוָה는 POB의 원어-직접 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַתִּרְבַּץ תַּחַת בִּלְעָם
  english_pob_choice: she lay down under Balaam
  chosen_korean: 발람 아래에 엎드렸습니다
  alternatives_korean:
  - 발람 아래에 누웠습니다
  - 발람 밑에 주저앉았습니다
  lexicon: HALOT
  rationale: רבץ는 단순한 ‘눕다’보다 몸을 낮추어 엎드리거나 웅크리는 동작을 포함할 수 있어, 상황상 ‘엎드렸습니다’가 가장 자연스럽고 충실합니다.
- source_word: בַּמַּקֵּל
  english_pob_choice: with his staff
  chosen_korean: 막대기로
  alternatives_korean:
  - 지팡이로
  - 막대기로 쳤습니다
  lexicon: HALOT
  rationale: מַקֵּל은 지팡이/막대기 모두 가능하지만, 여기서는 타격 도구라는 기능이 분명하므로 ‘막대기’가 더 직접적입니다. 소유격은 히브리어에 없으므로 본문에는 넣지 않았습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 신명어 원문 가시화 원칙을 따르며, 본문 내에서 하나님의 개인 이름을 제목어로 치환하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
