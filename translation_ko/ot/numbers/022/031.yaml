  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
  footnotes:
  - marker: a
    text: Or 'opened Balaam’s eyes.' The Hebrew verb literally means 'uncovered.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'fell on his face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 발람의 눈을 열어 주셨습니다.[a] 발람은 야훼의 천사가 길에 서서 손에 칼을 빼 들고 있는 것을 보았습니다.[b] 그는 몸을 굽히고 얼굴을 땅에 대고 엎드렸습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘드러내다, 벗기다’라는 뜻입니다. 또는 ‘발람의 눈을 드러내셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 천사’는 ‘야훼의 사자’ 또는 ‘야훼의 메신저’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 문자적으로 ‘그의 얼굴로’이며, 얼굴을 땅에 대는 자세를 가리킵니다. 또는 ‘얼굴을 땅에 대고 쓰러졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל יְהוָה אֶת עֵינֵי בִלְעָם
  english_pob_choice: Then Yahweh uncovered Balaam’s eyes
  chosen_korean: 그때 야훼께서 발람의 눈을 드러내셨습니다
  alternatives_korean:
  - 발람의 눈을 여셨습니다
  - 발람의 눈을 밝히셨습니다
  lexicon: HALOT
  rationale: גלה의 핵심은 단순한 ‘열다’보다 ‘드러내다/벗기다’에 가깝기 때문에, 눈을 ‘드러내셨습니다’로 옮겨 야훼께서 시야를 막고 있던 것을 제거하신 뉘앙스를 살렸습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאָךְ는 본래 ‘사자/전령’이지만 이 문맥에서는 초자연적 존재를 가리키므로, 한국어 독자가 즉시 이해할 수 있는 ‘천사’를 택했습니다.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְּיָדוֹ
  english_pob_choice: with his sword drawn in his hand
  chosen_korean: 그의 손에 칼이 뽑혀 있는 것을
  alternatives_korean:
  - 그의 손에 칼을 빼 들고 있는 것을
  - 그의 손에 칼이 벗겨져 있는 것을
  lexicon: HALOT
  rationale: שָׁלַף는 ‘뽑다/빼다’의 뜻이므로, 무기가 이미 칼집에서 나온 상태를 분명히 하되 한국어에서는 자연스럽게 ‘칼이 뽑혀 있는’으로 표현했습니다.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  english_pob_choice: and he bowed down and prostrated himself with his face to the ground
  chosen_korean: 그는 몸을 굽혀 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 그는 몸을 굽혀 엎드렸습니다
  - 그는 절하며 얼굴을 땅에 댔습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 살리되, וַיִּשְׁתַּחוּ를 곧바로 ‘예배하다’로 풀지 않고 실제 자세를 드러내는 ‘엎드렸습니다’로 옮겨, 본문의 물리적 동작을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 대치어 ‘주님’보다 고유명사성을 드러내는 ‘야훼’가 원문을 더 직접적으로 반영하므로 이를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וַיִּשְׁתַּחוּ의 의미 범위
  chosen_reading: 몸을 굽혀 얼굴을 땅에 대고 엎드림
  alternative_readings:
  - 예배함
  - 절함
  rationale: 문맥은 발람의 즉각적인 신체 반응을 묘사하므로, 여기서는 예배 행위로 신학적으로 단정하기보다 자세를 먼저 드러내는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
