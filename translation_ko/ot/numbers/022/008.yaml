base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
  footnotes:
  - marker: a
    text: Or, 'I will return an answer to you' or 'I will bring back a message to you.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Or, 'the officials of Moab' or 'the leaders of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “오늘 밤 여기서 묵으십시오. 그러면 야훼께서 내게 말씀하시는 대로 제가 당신들에게 말을 가져오겠습니다.” 그래서 모압의 고관들은 발람과 함께 머물렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신들에게 대답을 돌려드리겠습니다’ 또는 ‘당신들에게 메시지를 가져오겠습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 신명사철자는 YHWH로, 전통적으로 ‘주’로 번역되기도 하지만 여기서는 ‘야훼’로 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘모압의 관리들’ 또는 ‘모압의 지도자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  english_pob_choice: Lodge here tonight
  chosen_korean: 오늘 밤 여기서 묵으십시오
  alternatives_korean:
