  lexicon: HALOT
  rationale: לִינוּ는 하룻밤 묵도록 권하는 명령이므로, 현대 한국어에서는 ‘묵으십시오’가 가장 자연스럽고 의미도 정확합니다.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  english_pob_choice: I will bring back word to you
  chosen_korean: 제가 당신들에게 말을 가져오겠습니다
  alternatives_korean:
  - 제가 당신들에게 대답을 가져오겠습니다
  - 제가 당신들에게 소식을 가져오겠습니다
  lexicon: HALOT
  rationale: ‘돌려주다/가져오다’의 관용구적 의미를 살리되, 한국어에서는 ‘말을 가져오겠습니다’가 보고의 뉘앙스를 가장 간명하게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사철자는 인격신명인 야훼로 옮겨, 일반 호칭 ‘주’와 구별했습니다.
- source_word: שָׂרֵי מוֹאָב
  english_pob_choice: the princes of Moab
  chosen_korean: 모압의 고관들
  alternatives_korean:
