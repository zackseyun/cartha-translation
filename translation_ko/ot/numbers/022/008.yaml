  source_fidelity: 히브리어 לִינוּ פֹה הַלַּיְלָה를 ‘오늘 밤 여기서 묵으십시오’로, שָׂרֵי מוֹאָב를 ‘모압의 고관들’로 옮긴 것은 문맥과 어휘에 충실합니다. 그러나 וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר의 ‘말을 가져오겠습니다’는 한국어 관용상 부자연스럽고, ‘답변을 전해 드리겠습니다’가 원문의 ‘말/답을 가지고 돌아오다’라는 뜻을 더 정확히 전달합니다.
  naturalness: ‘당신들에게 말을 가져오겠습니다’는 현대 표준 한국어에서 어색합니다. 직접 발화의 복수 청자에게는 ‘여러분에게’가 자연스럽고, ‘답변을 전해 드리겠습니다’가 합쇼체에도 맞습니다. 각주 표지는 해당 본문 어구 바로 뒤에 두어야 합니다.
  terminology: ‘야훼’와 ‘발람’은 일관되고 적절합니다. 다만 각주의 ‘신명사철자’는 부정확하거나 비문에 가까우므로 ‘히브리어 하나님의 이름 YHWH’ 또는 ‘네 글자로 된 하나님의 이름 YHWH’로 고쳐야 합니다.
