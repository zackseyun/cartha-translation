id: NUM.22.7
reference: Numbers 22:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
  footnotes:
  - marker: a
    text: Or 'with divinations in their hands'; the Hebrew expression may refer either to divinatory implements/omens or, more likely in context, to the payment brought for divination.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압의 장로들과 미디안의 장로들은 점술의 대가를 손에 들고 발람에게 가서, 발락의 말을 그에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘점술들’을 뜻하여 점술 행위나 점술 도구를 가리킬 수도 있습니다. 그러나 이 문맥에서는 발람에게 점을 치게 하려고 가져간 대가나 사례금을 가리키는 것으로 보는 해석이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  english_pob_choice: elders of
  chosen_korean: 장로들
  alternatives_korean:
  - 지도자들
  - 원로들
  lexicon: HALOT
  rationale: 지파나 집단의 זָקֵן은 통상 그 집단의 공식적 원로·대표자를 가리키므로, '장로들'이 사회적 직분을 가장 직접적으로 살립니다.
- source_word: וּקְסָמִים בְּיָדָם
  english_pob_choice: with divination fees in their hands
  chosen_korean: 점술 비용을 손에 들고
  alternatives_korean:
  - 점술품을 손에 들고
  - 점술의 대가를 손에 들고
  - 점술료를 손에 들고
  lexicon: HALOT
  rationale: 문맥상 קסמים는 발람의 점술 행위를 위한 보상, 곧 비용으로 이해하는 것이 가장 자연스러워 '점술 비용'으로 옮겼습니다. '손에 들고'는 소지 상태를 그대로 반영합니다.
- source_word: וַיָּבֹאוּ אֶל בִּלְעָם
  english_pob_choice: they came to Balaam
  chosen_korean: 발람에게 가서
  alternatives_korean:
  - 발람에게 도착하여
  - 발람 앞에 이르러
  lexicon: HALOT
  rationale: בוא + אֶל의 기본 의미를 살려 도착 동작을 자연스럽게 표현했습니다. 앞 절의 '일어나'와도 서술 흐름이 맞습니다.
- source_word: דִּבְרֵי בָלָק
  english_pob_choice: the words of Balak
  chosen_korean: 발락의 말을
  alternatives_korean:
  - 발락의 말씀을
  - 발락의 메시지를
  lexicon: HALOT
  rationale: 히브리어의 문자적 구조를 따라 '발락의 말'로 옮겨, 내용이 직접 인용인지 위임받은 전달인지 열어 두었습니다.
theological_decisions:
- issue: קְסָמִים의 의미가 점술 행위인지 비용인지
  chosen_reading: 이 문맥에서는 발람의 점술 서비스를 사려고 가져온 '점술 비용'으로 읽었습니다.
  alternative_readings:
  - 점술 도구
  - 점괘/점술 행위 자체
  rationale: 이전 절의 요청-응답 흐름과 함께 읽으면, 실제로 들고 간 것은 점술을 위한 대가로 보는 것이 가장 문맥적입니다. 다만 히브리어 표현이 다의적이므로 그 가능성을 번역과 주석에서 드러냈습니다.
  doctrine_reference: 문맥 우선의 번역 원칙
- issue: 발락의 말을 직접 인용이 아닌 전달로 처리할지 여부
  chosen_reading: 직접 인용부호를 두지 않고 '발락의 말을 그에게 전했습니다'로 처리했습니다.
  alternative_readings:
  - '''발락의 말''을 따옴표로 직접 인용 처리'
  - '''발락이 한 말''로 의역'
  rationale: 원문은 내용 전달을 서술할 뿐 직접 발화문을 제시하지 않으므로, 한국어에서도 보고형 표현을 유지하는 것이 가장 정확합니다.
  doctrine_reference: 서술 구조 보존
