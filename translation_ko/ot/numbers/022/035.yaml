  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''the word''; also possible: ''the message'' or ''the matter.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'the princes of Balak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사[a]가 발람에게 말했습니다. “그 사람들과 함께 가십시오. 그러나 내가 당신에게 말할 그 말[b]만 말하십시오.” 그래서 발람은 발락의 고관들[c]과 함께 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 말’이며, ‘말씀’ 또는 ‘메시지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘발락의 관리들’ 또는 ‘발락의 통치자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 문맥에서 초자연적 존재를 가리키므로 ‘천사’가 적절하며, יהוה는 프로젝트 기본에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  english_pob_choice: Go with the men
  chosen_korean: 그 사람들과 함께 가십시오
  alternatives_korean:
  - 그 남자들과 함께 가십시오
  - 그 사람들과 가십시오
  lexicon: HALOT
  rationale: הָאֲנָשִׁים는 특정한 남성 집단을 가리키지만, 한국어에서는 대화체가 아니라 명령의 의미를 자연스럽게 살리기 위해 ‘그 사람들’로 옮겼습니다.
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ אֹת֣וֹ תְדַבֵּר
  english_pob_choice: only the word that I speak to you, that you shall speak
  chosen_korean: 내가 당신에게 말하는 그 말만, 당신은 그것을 말해야 합니다
  alternatives_korean:
  - 내가 당신에게 말하는 그 말만, 당신은 말하십시오
  - 내가 당신에게 말하는 그 말만, 그것만 말하십시오
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘말/말씀’의 의미가 자연스럽고, 전면에 놓인 대명사 אֹתוֹ는 ‘그것을’로 살려 제한 명령을 분명히 했습니다.
- source_word: שָׂרֵי בָלָק
  english_pob_choice: the officials of Balak
  chosen_korean: 발락의 고관들
  alternatives_korean:
  - 발락의 관리들
  - 발락의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים는 ‘고관/통치자/관리’의 폭이 있어, 문맥상 외교적 수행원에 가까운 느낌을 살려 ‘고관들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 화법에서 명령체의 강도 유지
  chosen_reading: '"그 사람들과 함께 가십시오. 그러나 내가 당신에게 말하는 그 말만, 당신은 그것을 말해야 합니다."'
  alternative_readings:
  - '"그 사람들과 함께 가십시오. 그러나 내가 당신에게 말하는 그 말만 말하십시오."'
  - '"그 사람들과 함께 가십시오. 그러나 내가 당신에게 말하는 그 말만, 당신이 말해야 합니다."'
  rationale: 원문의 제한은 단순 허용이 아니라 발람의 발화 내용을 엄격히 묶는 명령이므로, 한국어에서도 분명한 의무성을 유지했습니다.
  doctrine_reference: Numbers 22:35 — 예언자 발화의 종속성과 하나님의 말씀의 절대성
