base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
  footnotes:
  - marker: a
    text: Or 'more distinguished' or 'more honorable than these.' The Hebrew emphasizes higher status or greater prestige.
    reason: lexical_alternative
translation:
  language: ko
  text: 발락은 다시 이들보다 수가 더 많고 더 존귀한 관리들을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이들보다 더 뛰어나거나 더 명예로운.” 히브리어는 더 높은 신분이나 위신을 강조합니다.
    reason: נִכְבָּדִים의 가능한 어휘적 의미와 위신·지위의 뉘앙스를 제시합니다.
lexical_decisions:
- source_word: וַ/יֹּ֥סֶף
  english_pob_choice: again sent
  chosen_korean: 다시 보내었다
  alternatives_korean: 또 보냈다, 계속 보냈다
  lexicon: yosaf
  rationale: Hebrew verb indicating repetition of action; 'again' captures the iterative nature better than simple past tense.
- source_word: שָׂרִ֔ים רַבִּ֥ים
  english_pob_choice: more numerous
  chosen_korean: 더 많고
  alternatives_korean: 많은 관리들, 다수의 관리들
  lexicon: sarim rabbim
  rationale: Literal meaning is 'chiefs many'; combined with context, 'more numerous' conveys the comparative quantity relative to previous envoys.
- source_word: נִכְבָּדִ֖ים
  english_pob_choice: more honored
  chosen_korean: 더 존귀한
  alternatives_korean: 더 높은, 더 공경받는
  lexicon: nikbadim
  rationale: Adjective meaning 'honored' or 'distinguished'; '존귀한' fits the formal-polite register and denotes high status.
theological_decisions:
- decision: Maintain comparative structure
  rationale: The Hebrew text explicitly contrasts the new envoys with previous ones ('than these'); preserving this comparison highlights Balak's escalating desperation and strategy.
