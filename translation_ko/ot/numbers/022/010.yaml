source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
  footnotes:
  - marker: a
    text: Or 'sent for me.' The Hebrew more literally reads 'has sent to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발람이 하나님께 말했습니다. “모압 왕 십볼의 아들 발락이 저에게 사람을 보냈습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저에게 불러오셨습니다.” 히브리어는 더 문자적으로 “저에게 보냈습니다”라고 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도, 발화 동사를 현대 표준어 합쇼체로 간결하게 옮겼습니다.
- source_word: אֶל הָאֱלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 신에게
  lexicon: HALOT
  rationale: 문맥상 앞절의 신현에 응답하는 참하나님을 가리키므로, 한국어 관용과 경어를 살려 하나님께로 옮겼습니다.
- source_word: בָּלַק ... שָׁלַח אֵלַי
  english_pob_choice: has sent to me
  chosen_korean: 저에게 사람을 보냈습니다
  alternatives_korean:
  - 저에게 보냈습니다
  - 저를 불러왔습니다
  lexicon: HALOT
  rationale: אֶלַי의 기본 방향성은 ‘나에게/저에게’이므로 유지하되, 한국어에서 자연스러운 완결 표현을 위해 ‘사람을’을 보충해 보냈다는 행위를 분명히 했습니다.
- source_word: בֶּן צִפֹּר
  english_pob_choice: son of Zippor
  chosen_korean: 십볼의 아들
  alternatives_korean:
  - 십볼의 자손
  - 십볼의 아들인
  lexicon: HALOT
  rationale: 히브리어 족보식 소유구문을 한국어의 통상적 속격 구조로 옮겼습니다.
theological_decisions:
- issue: 하나님 지칭의 번역
  chosen_reading: 아래 대화 상대를 ‘하나님께’로 번역해, 문맥상 야훼와의 직접 대화를 드러냈습니다.
  alternative_readings:
  - 하나님에게
  - 신에게
  rationale: 본문의 הָאֱלֹהִים은 앞선 서술 맥락에서 참하나님을 가리키므로, 일반적 신격 표현보다 문맥적 특정성을 드러내는 것이 source-faithful합니다.
  doctrine_reference: Translation philosophy §1, §3
