review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘사람을’은 히브리어 동사의 생략된 목적어를 문맥에 따라 보충한 것으로 이해할 수 있으나, 본문 자체에는 명시되어 있지 않습니다. 문맥상 보충은 한국어의 자연스러움을 위해 허용될 수 있습니다. 다만 히브리어의 콜론은 뒤 절로 이어지는 발화임을 나타내므로 마침표가 아니라 콜론으로 유지해야 합니다.
  naturalness: ‘모압 왕 십볼의 아들 발락’은 자연스럽고 격식 있는 한국어입니다. ‘저에게 사람을 보냈습니다’도 문맥상 자연스럽습니다. 현 각주 ‘저에게 불러오셨습니다’는 문법적으로 부자연스럽고, 발락에게 존대 선어말어미를 사용하며, 대안 의미도 정확히 전달하지 못합니다.
  terminology: ‘발람’, ‘발락’, ‘십볼’, ‘모압’, ‘하나님’은 표준적인 성경 인명·지명 및 신명 표기와 잘 맞습니다. ‘하나님께’는 문맥상 הָאֱלֹהִים의 지시 대상을 적절히 반영합니다.
  issues:
  - severity: medium
    issue: 인용문의 종결 부호가 마침표로 되어 있습니다.
    rationale: 히브리어 본문의 콜론과 문맥은 발람의 인용 발화가 다음 절에서 계속됨을 보입니다. 마침표는 발화를 이 절에서 종결시키므로 콜론으로 고쳐야 합니다.
  - severity: high
    issue: 각주의 대안 번역 ‘저에게 불러오셨습니다’가 부정확하고 부자연스럽습니다.
    rationale: ‘sent for me’는 발락이 발람을 부르기 위해 사람을 보냈다는 뜻이지 ‘저에게 불러오셨습니다’가 아닙니다. 또한 발락을 가리키는 데 ‘-셨-’을 쓰는 것은 부적절합니다.
  revised_text: 발람이 하나님께 말했습니다. “모압 왕 십볼의 아들 발락이 저에게 사람을 보냈습니다:”
  revised_footnotes:
  - marker: a
    text: 또는 “저를 부르려고 사람을 보냈습니다.” 히브리어는 더 문자적으로 “저에게 보냈습니다”라고 읽힙니다.
    reason: lexical_alternative
  revision_rationale: 본문의 서사·인용 구조를 보존하기 위해 인용문의 끝을 콜론으로 바로잡았습니다. 한국어에서 목적어가 없는 ‘저에게 보냈습니다’가 부자연스러워, 앞 절의 사절들(22:9)과 현재 문맥에 맞게 ‘사람을’을 유지했습니다. 각주는 ‘sent for me’의 문맥적 대안을 정확하고 현대적인 한국어로 고쳤습니다.
