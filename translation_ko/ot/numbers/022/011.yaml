  source_fidelity: 원문의 집합명사 ‘백성’, 출애굽을 나타내는 수식절, 땅을 덮었다는 진술, 저주 요청, 그리고 전쟁과 축출의 가능성을 전반적으로 잘 반영합니다. 다만 ‘그러면’은 히브리어에 명시되지 않은 조건·결과 연결을 다소 강화하며, לִי는 ‘제게’보다 ‘나를 위해’로 옮기는 편이 자연스럽고 정확합니다.
  naturalness: 합쇼체 문체는 대체로 적절하나, ‘제게 그들을 저주해 주십시오’는 한국어 결합이 다소 어색합니다. ‘나를 위해 그들을 저주하십시오’가 직접적이면서도 자연스럽습니다. 가능성 표현은 두 행위에 함께 걸리도록 한 문장으로 처리하는 것이 좋습니다.
  terminology: ‘백성’, ‘저주’, ‘싸우다’, ‘몰아내다’는 문맥과 현대 표준어에 적절합니다. עֵין הָאָרֶץ의 관용적 의미를 ‘땅의 표면’으로 번역하고 각주에서 직역을 설명하는 처리도 타당합니다.
