  to: 보십시오, 이집트에서 나온 그 백성이 땅의 표면[a]을 덮었습니다. 이제 오셔서 나를 위해 그들을 저주하십시오. 아마도 내가 그들과 싸워 그들을 몰아낼 수 있을지도 모릅니다.
