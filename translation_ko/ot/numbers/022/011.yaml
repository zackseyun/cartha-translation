id: NUM.22.11
reference: Numbers 22:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
  footnotes:
  - marker: a
    text: Hebrew literally, 'covered the eye of the land,' an idiom for covering the visible surface or face of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이집트에서 나온 그 백성이 땅의 표면[a]을 덮었습니다. 이제 오셔서 나를 위해 그들을 저주하십시오. 아마도 내가 그들과 싸워 그들을 몰아낼 수 있을지도 모릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅의 눈’은 땅의 보이는 표면을 가리키는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 지시 표현으로, 현대 문어체 합쇼체에서 자연스럽고 공손한 호소를 살립니다.
- source_word: הָעָם הַיֹּצֵא מִמִּצְרַיִם
  english_pob_choice: the people who came out of Egypt
  chosen_korean: 이집트에서 나온 그 백성
  alternatives_korean:
  - 이집트에서 나와 있는 백성
  - 이집트에서 나온 사람들
  lexicon: HALOT
  rationale: 출애굽으로 규정되는 집합명사이므로 ‘백성’이 적절하며, 관계절을 압축해도 원문의 식별 기능을 유지합니다.
- source_word: עֵין הָאָרֶץ
  english_pob_choice: the face of the land
  chosen_korean: 땅의 표면
  alternatives_korean:
  - 땅의 얼굴
  - 땅의 눈
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘eye’를 직역하기보다, POB의 설명을 따라 보이는 지면 전체를 가리키는 뜻을 한국어로 투명하게 옮겼습니다.
- source_word: קָבָה
  english_pob_choice: curse
  chosen_korean: 저주해 주십시오
  alternatives_korean:
  - 저주하십시오
  - 저주를 내리십시오
  lexicon: HALOT
  rationale: 발람에게 요구하는 행위의 직접성을 살리면서, 간접청탁의 뉘앙스를 반영하기 위해 ‘주다’를 덧붙였습니다.
- source_word: וְגֵרַשְׁתִּיו
  english_pob_choice: and drive them out
  chosen_korean: 그들을 쫓아낼 수 있을지도 모릅니다
  alternatives_korean:
  - 그들을 내쫓을 수 있을지도 모릅니다
  - 그들을 몰아낼 수 있을지도 모릅니다
  lexicon: HALOT
  rationale: 군사적·영토적 축출의 의미를 살리되, 한국어에서 자연스러운 결과 가능성 표현으로 옮겼습니다.
theological_decisions:
- issue: 본문의 발락 발화가 직접 인용문 안에서 드러내는 요청의 어조
  chosen_reading: 명령형과 가능성 표현을 함께 살려, 발락이 발람의 저주와 자기 전쟁 계획을 연동해 말하는 긴박한 요청으로 읽었습니다.
  alternative_readings:
  - 보다 중립적인 서술형으로 완화
  - 단순한 부탁으로만 처리
  rationale: 본문은 단순 정보 전달이 아니라 정치적·군사적 의도를 가진 청탁이므로, 명령형과 ‘아마도’의 불확실성을 함께 보존해야 합니다.
  doctrine_reference: 서술문맥 보존과 본문의 화행 기능 유지
