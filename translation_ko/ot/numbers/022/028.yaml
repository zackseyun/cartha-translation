  rationale: 원문 고유명사 יְהוָה를 제목형 표현인 ‘주님’으로 바꾸지 않고, 학술적 음역인 ‘야훼’로 옮겨 하나님의 이름을 보존했습니다.
- source_word: פִּי הָאָתוֹן
  english_pob_choice: the mouth of the donkey
  chosen_korean: 나귀의 입
  alternatives_korean:
  - 나귀 입
  - 암나귀의 입
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘나귀의 입’이므로 이를 자연스러운 현대 한국어로 옮겼습니다. 암컷임은 뒤의 동사로 드러나므로 본문에는 굳이 ‘암-’을 덧붙이지 않았습니다.
- source_word: וַתֹּאמֶר
  english_pob_choice: and she said
  chosen_korean: 나귀가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 말했습니다
  lexicon: HALOT
  rationale: 동사의 여성형이 나귀가 화자임을 밝히므로, 한국어에서는 주어를 분명히 하되 매끄럽게 ‘나귀가’로 옮겼습니다.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  english_pob_choice: these three times
  chosen_korean: 벌써 세 번이나
  alternatives_korean:
  - 이 세 번
  - 이런 세 차례
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘이것 세 발/차례’이지만, POB의 의미를 따라 ‘세 번’으로 풀어 옮겼습니다. ‘벌써’는 항의의 뉘앙스를 살려 줍니다.
theological_decisions:
- issue: 여호와의 직접적 개입이 나귀의 발화를 가능케 함
  chosen_reading: 야훼께서 나귀의 입을 여셔서, 나귀가 실제로 발람에게 말한 것으로 옮겼습니다.
  alternative_readings:
  - 비유적 표현으로 완화
  - 환상적 체험으로 재해석
  rationale: 원문은 야훼의 직접 행위를 서술하므로, 초자연적 개입을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: 본문 서술의 문자적 서술성 유지
