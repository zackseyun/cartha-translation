base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
  footnotes:
  - marker: a
    text: Or 'sent portions to Balaam and to the officials who were with him.' The Hebrew says simply 'sent,' but the context of sacrificed animals suggests food or sacrificial portions were sent.
    reason: lexical_alternative
  - marker: b
    text: '''Sheep'' may also be understood more broadly as ''flock'' or ''small livestock,'' since the Hebrew term can include goats as well.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발락은 소와 양[b]을 제물로 바치고, 발람과 그와 함께 있던 관리들에게 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘보내다’이지만, 제물을 바친 직후의 문맥상 제물의 일부나 음식이 보내졌을 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양’에 해당하는 히브리어 צאן은 문맥에 따라 양뿐 아니라 염소를 포함한 작은 가축이나 양 떼를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  english_pob_choice: sacrificed
  chosen_korean: 제물로 바치고
  alternatives_korean:
  - 희생 제사를 드리고
  - 바치고
  lexicon: HALOT
  rationale: זבח는 단순 도살보다 제의적 희생의 뜻이 분명하므로, 문맥을 살려 ‘제물로 바치다’로 옮겼습니다.
- source_word: בָּקָר
  english_pob_choice: cattle
  chosen_korean: 소
  alternatives_korean:
  - 가축
  - 황소
  lexicon: HALOT
  rationale: בקר은 소 떼를 가리키는 집합명사이므로, 자연스러운 한국어로는 ‘소’가 가장 간결하고 정확합니다.
- source_word: צֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양 떼
  - 작은 가축
  lexicon: HALOT
  rationale: צאן은 양과 염소를 포함할 수 있는 집합어이지만, 여기서는 짝구조에 맞춰 통상적인 ‘양’으로 옮겼습니다.
- source_word: לַשָּׂרִים
  english_pob_choice: to the officials
  chosen_korean: 관리들에게
  alternatives_korean:
  - 지도자들에게
  - 고관들에게
  lexicon: HALOT
  rationale: שׂרים는 신분적 ‘왕자들’보다 행정적·고위 인사 의미가 강해, 문맥상 ‘관리들’이 가장 무난합니다.
