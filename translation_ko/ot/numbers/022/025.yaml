id: NUM.22.25
reference: Numbers 22:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' In this context the being is clearly supernatural, so 'angel' is used in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 나귀가 야훼의 천사를 보자, 벽 쪽으로 바짝 붙어 비비고 들어가서 발람의 발을 벽에 밀어붙였습니다. 그러자 그는 그녀를 다시 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재를 가리키므로 ‘천사’가 자연스럽고, 예배적 관습어인 ‘사자’보다 원문 의미를 더 직접적으로 드러냅니다. יְהוָה는 본 프로젝트 기본어에 따라 ‘야훼’로 옮겼습니다.
- source_word: הָאָתוֹן
  english_pob_choice: the donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 암나귀
  - 암컷 나귀
  lexicon: HALOT
  rationale: אָתוֹן은 암나귀를 뜻하지만, 한국어에서는 성별을 반복하지 않아도 뒤의 여성형 동사 흐름과 문맥으로 충분히 드러나므로 자연스러운 ‘나귀’를 택했습니다.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר / וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  english_pob_choice: she pressed herself against the wall and pressed Balaam’s foot against the wall
  chosen_korean: 벽 쪽으로 바짝 붙어 비비고 들어가서 발람의 발을 벽에 밀어붙였습니다
  alternatives_korean:
  - 벽에 바짝 붙었습니다
  - 벽 쪽으로 밀착해 발람의 발을 벽에 눌렀습니다
  lexicon: HALOT
  rationale: 같은 לחץ를 두 번 반복하는 힘을 살리되, 첫 절은 나귀의 몸이 스스로 압박되는 장면을, 둘째 절은 그 결과 발람의 발이 벽에 눌리는 장면을 한국어 동사 연쇄로 구분했습니다.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  english_pob_choice: so he struck her again
  chosen_korean: 그러자 그는 그녀를 다시 쳤습니다
  alternatives_korean:
  - 그러자 그는 그녀를 다시 때렸습니다
  - 그러자 그는 그녀를 계속 쳤습니다
  lexicon: HALOT
  rationale: יָסַף + infinitive는 반복 동작을 나타내므로, 직전 행위가 재개되었음을 간결하게 보이는 ‘다시 쳤습니다’로 옮겼습니다.
- source_word: רֶגֶל
  english_pob_choice: foot
  chosen_korean: 발
  alternatives_korean:
  - 다리
  lexicon: HALOT
  rationale: 여기서는 벽에 눌린 신체 부위가 ‘발’이므로, 한국어에서도 가장 구체적이고 자연스러운 부위를 선택했습니다.
theological_decisions:
- issue: 야훼의 천사 표현과 주석 처리 여부
  chosen_reading: 본문에는 ‘야훼의 천사’를 두고, 별도 각주 없이 직역성을 유지했습니다.
  alternative_readings:
  - ‘야훼의 사자’
  - ‘여호와의 천사’
  rationale: 문맥상 존재가 초자연적이므로 ‘천사’가 본문의 1차 의미를 가장 잘 드러내며, 본 프로젝트의 YHWH 기본어에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: POB terminology default for YHWH; מַלְאַךְ in narrative supernatural context
