  - severity: medium
    issue: ‘내가 네게 말하는 것만, 그것을 해야 한다’가 한국어로 어색하며 목적어가 중복됩니다.
    rationale: 히브리어의 목적어 전치는 강조이지만, 이를 ‘것만, 그것을’으로 그대로 재현하면 부자연스럽습니다. ‘내가 당신에게 말하는 것만 행하십시오’가 제한과 명령을 모두 보존합니다.
