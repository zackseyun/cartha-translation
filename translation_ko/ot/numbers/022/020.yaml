  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
  footnotes:
  - marker: a
    text: Or “If the men came to summon you.”
    reason: lexical_alternative
  - marker: b
    text: Or “but only the matter that I speak to you, that you shall do.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 밤에 발람에게 오셔서 그에게 말씀하셨습니다. 「만일 그 사람들이 너를 부르러 왔으면, 일어나 그들과 함께 가라. 그러나 내가 네게 말하는 것만, 그것을 해야 한다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르러 왔으면’은 ‘부르다/소환하다’의 문맥상 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말하는 것’은 직역적으로는 ‘말’이지만, 발화 행위와 내용 모두를 아우르는 히브리어 דָּבָר의 문맥적 용법을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이신 분
  - 신
  lexicon: HALOT
  rationale: 원문은 이 절에서 신적 존재를 가리키는 אֱלֹהִים이므로, 한국어에서는 통상적이면서도 원문 구분을 유지하는 ‘하나님’으로 옮겼습니다.
- source_word: לַיְלָה
  english_pob_choice: at night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤 동안에
  lexicon: HALOT
  rationale: 시간 부사를 자연스러운 현대 한국어로 옮겨 밤이라는 배경을 분명히 했습니다.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  english_pob_choice: If the men have come to call for you
  chosen_korean: 만일 그 사람들이 너를 부르러 왔으면
  alternatives_korean:
  - 만일 그 사람들이 너를 부르려고 왔으면
  - 만일 그 사람들이 너를 소환하러 왔으면
  lexicon: HALOT
  rationale: לקרוא לך의 ‘부르다/호출하다’ 의미를 살리되, 문맥상 바발람을 데리러 온 상황이므로 ‘부르러 왔으면’으로 자연스럽고 직접적으로 옮겼습니다.
- source_word: וְאַךְ אֶת הַדָּבָר ... אֹתוֹ תַעֲשֶׂה
  english_pob_choice: but only the word that I speak to you, that you shall do
  chosen_korean: 그러나 내가 네게 말하는 것만, 그것을 해야 한다
  alternatives_korean:
  - 그러나 내가 네게 말하는 말만, 그것을 해야 한다
  - 다만 내가 네게 말하는 것만 해야 한다
  lexicon: HALOT
  rationale: אַךְ의 제한 의미를 ‘오직/그저’보다 덜 문어적이면서도 강하게 나타내는 ‘~만’으로 반영했고, דָּבָר는 이 발화 맥락에서 ‘말하는 것’으로 번역해 ‘말하다’와의 연결을 유지했습니다.
theological_decisions:
- issue: 명령의 절대적 제한
  chosen_reading: 발람은 동행할 수 있지만, 그가 행할 것은 하나님이 직접 말씀하시는 것에 한정됩니다.
  alternative_readings:
  - 일반적인 허락과 이후의 추가 지시로 완화해 읽을 수 있음
  rationale: אַךְ와 ‘그것을 해야 한다’는 조합은 단순 허용이 아니라 발람의 행위를 철저히 제한하는 신적 통제를 드러내므로, 그 긴장을 약화시키지 않도록 직역 성향을 유지했습니다.
  doctrine_reference: Numbers 22 문맥의 예언자적 순종과 신적 주권
