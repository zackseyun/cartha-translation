source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''go beyond the mouth of the LORD my God,'' an idiom meaning to exceed or violate what he has said.'
    reason: lexical_alternative
  - marker: b
    text: Or 'transgress the command of the LORD my God.'
    reason: alternative_reading
translation:
  language: ko
  text: 발람이 대답하여 발락의 종들에게 말했습니다. 「발락이 자기 집에 가득한 은과 금을 내게 준다 하더라도, 나는 야훼 내 하나님의 말씀을 넘어, 작은 일이든 큰 일이든 행할 수 없습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼 내 하나님의 입을 넘어가다’이며, 곧 그분이 말씀하신 것을 벗어나거나 어기는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼 내 하나님의 명령을 어기다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 ... 말했습니다
  alternatives_korean:
  - 대답하며 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 관용구를 한국어 대화 서술로 자연스럽게 옮기되, 발화 시작을 분명히 드러내는 쪽을 택했습니다.
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종사들
  - 신하들
  - 종
  lexicon: HALOT
  rationale: 여기서는 발락의 심부름꾼/수행원을 가리키므로, 지위가 불분명한 '종들'이 문맥에 가장 무난합니다.
- source_word: לַעֲבֹר אֶת פִּי יְהוָה
  english_pob_choice: go beyond the word of Yahweh
  chosen_korean: 야훼 내 하나님이 말씀하신 것을 ... 넘어 할 수 없습니다
  alternatives_korean:
  - 야훼 내 하나님의 말씀을 어길 수 없습니다
  - 야훼 내 하나님의 입을 넘어설 수 없습니다
  lexicon: HALOT
  rationale: '''입/말씀을 넘어가다''라는 히브리어 관용을 살리면서도 한국어에서 이해 가능한 표현으로 풀었습니다. ''어기다''는 의미는 맞지만 원문의 비유를 다소 평평하게 만들 수 있어 보류했습니다.'
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  english_pob_choice: to do anything small or great
  chosen_korean: 조금이라도 크게라도
  alternatives_korean:
  - 작은 일이든 큰 일이든
  - 작은 것이든 큰 것이든
  lexicon: HALOT
  rationale: 히브리어의 대구적 총칭을 한국어에서는 '조금이라도... 크게라도'로 압축해, 아무 것도 임의로 하지 못한다는 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 표준에 따라 신명기를 직역하는 본문은 야훼를 사용했습니다.
theological_decisions:
- issue: 발람의 진술이 단순한 거절인지, 능력의 한계 진술인지
  chosen_reading: 발람은 야훼의 말씀을 넘어서는 행위를 스스로 할 수 없다고 말합니다.
  alternative_readings:
  - 단순히 불복종하지 않겠다는 뜻
  - 외교적 거절 표현
  rationale: 히브리어는 능력 동사 '할 수 없다'와 '넘어가다' 관용구를 함께 사용하므로, 단순한 의지 표명보다 실제 불가능성 진술을 살리는 것이 본문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: 직접 화법 안의 신명사 처리
  chosen_reading: 직접 화법에서도 '야훼 내 하나님'을 유지합니다.
  alternative_readings:
  - 주님 내 하나님
  - 여호와 내 하나님
  rationale: 직접 인용된 발람의 발화 속에서도 원문이 지시하는 신명사와 소유 관계를 그대로 보존해, 본문의 언어적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
