  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. שָׂטָן은 고유명 ‘사탄’이 아니라 일반명사 ‘대적자’로 옮기고 주석으로 명시했습니다. אֲתוֹן의 암나귀 의미도 자연스러운 본문과 주석으로 보존했습니다.
