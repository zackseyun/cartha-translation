revisions:
- from: 하나님의 노가 그로 말미암아 타올랐으니 이는 그가 가는 것이라 야훼의 천사가 길에 서서 그에게 대적하매 그가 나귀를 타고 있고 그의 두 소년들이 그와 함께 있었더라.
  to: 하나님께서는 그가 가고 있었기 때문에 진노하셨습니다. 야훼의 천사가 그에게 대적자로[a] 길에 섰습니다. 그는 자기 나귀[b]를 타고 있었고, 그의 두 젊은이가 그와 함께 있었습니다.
  rationale: 이유를 나타내는 분사 구문을 ‘그가 가고 있었기 때문에’로 명료하게 옮기고, 천사의 의도적인 대치와 שָׂטָן의 일반명사 의미를 ‘그에게 대적자로’와 주석으로 보존했습니다. 또한 전체 문체를 현대 표준어 합쇼체로 고쳤습니다. נְעָרָיו는 문맥상 종/수행원도 될 수 있으나, 본문에서는 해석을 과도하게 확정하지 않고 ‘두 젊은이’로 직역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:39:00Z'
review_pass:
