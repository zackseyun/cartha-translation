  source_fidelity: 초안은 하나님의 진노, 야훼의 천사가 길에 의도적으로 맞서 선 일, 발람의 나귀와 동행자들을 대체로 담고 있습니다. 그러나 ‘그로 말미암아’는 히브리어의 주어와 이유절을 불필요하게 모호하게 하며, ‘대적하매’는 대적자로 서 있었다는 명사적 기능을 충분히 드러내지 못합니다.
