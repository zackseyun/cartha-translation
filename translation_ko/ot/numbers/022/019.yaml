source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
  footnotes:
  - marker: a
    text: Or 'what else the LORD will speak to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이곳에서 당신들도 오늘 밤 머무르십시오. 그래야 야훼께서 저에게 더 무엇을 말씀하실지 알 수 있겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 저에게 무엇을 더 말씀하실지.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבוּ נָא
  english_pob_choice: please stay
  chosen_korean: 밤을 보내십시오
  alternatives_korean:
  - 여기 머무르십시오
  - 여기 계십시오
  - 잠시 머무르십시오
  lexicon: HALOT
  rationale: ישב의 문맥상 의미는 단순히 ‘앉다’가 아니라 ‘머무르다/묵다’이며, 밤을 함께 보내라는 뜻이므로 한국어에서는 자연스럽게 ‘밤을 보내십시오’로 옮겼습니다.
- source_word: בָזֶה ... הַלָּיְלָה
  english_pob_choice: here tonight
  chosen_korean: 지금 여기에서 ... 밤을
  alternatives_korean:
  - 여기에서 오늘 밤
  - 이곳에서 오늘 밤
  lexicon: HALOT
  rationale: 장소 부사 בָזֶה와 시간 표현 הַלָּיְלָה를 한국어 어순에 맞게 풀어, 메시지의 즉시성과 체류 요청을 분명히 했습니다.
- source_word: וְאֵדְעָה מַה יֹּסֵף
  english_pob_choice: so that I may know what more
  chosen_korean: 그러면 ... 더 무엇을 ... 알게 되겠습니다
  alternatives_korean:
  - 그래서 ... 무엇을 더 ... 알게 되겠습니다
  - 그리하여 ... 더 무슨 말을 ... 듣게 되겠습니다
  lexicon: HALOT
  rationale: cohortative의 목적/결과 뉘앙스를 살려 ‘알게 되겠습니다’로 표현했고, יֹסֵף의 ‘더/추가로’라는 의미를 앞에 배치해 ‘더 무엇을’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 통상적 대체어 ‘주님’이 아니라 고유명사로 드러나야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 발람의 말투와 요청의 공손성
  chosen_reading: 다음 지시를 받기 위해 정중한 요청형으로 옮기되, 한국어에서는 명령형보다 청유·요청형의 공손함을 살렸습니다.
  alternative_readings:
  - 머물러 있으시오
  - 여기서 기다리십시오
  rationale: 히브리어 נָא가 담는 간청/정중함을 한국어 현대 문체로 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 공손한 대화체와 본문의 화행 보존
