translation:
  language: ko
  text: 지금 여기에서 당신들도 밤을 보내십시오. 그러면 야훼께서 제게 더 무엇을 말씀하실지 알게 되겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
