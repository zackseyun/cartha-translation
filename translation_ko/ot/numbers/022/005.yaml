revisions:
- from: 그래서 그는 사절들을 브올의 아들 발람에게, 강가에 있는 브돌로, 곧 그의 민족의 땅에 보내어 그를 불러 이렇게 말하게 했습니다. “보십시오, 한 백성이 이집트에서 나왔습니다. 보십시오, 그들이 땅의 얼굴을 덮었고, 나와 마주 보고 거주하고 있습니다.”[a][b][c]
  to: 그래서 그는 그 강가에 있는, 그의 백성의 자손들의 땅 브돌에 있는 브올의 아들 발람에게 사절들을 보내어 그를 부르게 하며 말했습니다. “보십시오, 한 백성이 이집트에서 나왔습니다. 보십시오, 그 백성이 땅의 표면을 덮었으며,[c] 나의 맞은편에 자리 잡고 있습니다.”[a][b]
  rationale: 브돌에 있는 발람에게 사절들을 보냈다는 원문의 수식 관계를 분명히 했습니다. ‘그의 백성의 자손들의 땅’이라는 난해한 표현은 본문에서 보존하고, 해석상 불확실성은 각주로 처리했습니다. 또한 ‘한 백성’을 단수로 이어 원문의 동사 호응을 더 충실히 반영했으며, ‘땅의 표면’은 한국어에서 자연스럽게 관용 의미를 전달하도록 하되 직역적 이미지는 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:59Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ‘사절들’, 발람의 계보, ‘그 강’, 그리고 땅을 덮는 표현을 대체로 보존합니다. 그러나 발송 목적지를 나타내는 구문이 ‘발람에게, … 브돌로’로 겹쳐 문장 관계가 불명확하며, אֶרֶץ בְּנֵי עַמּוֹ의 ‘그의 백성의 자손들’이라는 구성 요소가 본문에서 빠졌습니다. 또한 집합명사 עַם을 뒤에서 복수 대명사 ‘그들이’로 받는 것은 가능하나, 원문의 단수 동사와 호응을 보존하는 편이 낫습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로, 발람의 소재지와 사절 파견의 목적지를 자연스럽고 분명하게 연결합니다. ‘그 강가’는 본문의 정관사 표현을 반영하며, ‘맞은편에 자리 잡고 있습니다’는 מִמֻּלִי와 יֹשֵׁב의 위치·정착 상태를 자연스럽게 전달합니다.
  terminology: ‘브올의 아들 발람’, ‘사절들’, ‘한 백성’, ‘이집트’를 유지했습니다. 지명 ‘브돌’은 한국어 성경 전통에 맞는 표기입니다. 난해한 ‘그의 백성의 자손들의 땅’은 본문에서 보존하고, 각주에서 소유격 지시 대상의 불확실성을 밝혔습니다.
  issues:
  - severity: medium
    issue: 발람과 브돌의 문장 관계가 불명확합니다.
    rationale: ‘브올의 아들 발람에게, 강가에 있는 브돌로’는 사절을 사람에게 보냈는지 장소로 보냈는지 문법적으로 겹쳐 보입니다. 히브리어는 브돌에 있는 발람에게 사절들을 보냈다는 뜻입니다.
  - severity: medium
    issue: ‘그의 민족의 땅’이 בְּנֵי(자손들/아들들)를 본문에서 생략합니다.
    rationale: 해석상 다소 어색하더라도 원문의 난해한 구성과 복수 명사 요소를 보존해야 합니다. 소유격 ‘그의’가 누구를 가리키는지는 본문과 각주 모두에서 단정하지 않아야 합니다.
  - severity: low
    issue: 집합명사 ‘한 백성’을 복수 대명사 ‘그들이’로 받습니다.
    rationale: 한국어에서는 가능하지만, 히브리어의 단수 동사 כִסָּה 및 יֹשֵׁב에 맞춰 ‘그 백성이’로 받으면 원문 호응을 더 잘 보존합니다.
