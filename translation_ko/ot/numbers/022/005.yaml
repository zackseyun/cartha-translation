  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
  footnotes:
  - marker: a
    text: Hebrew 'the River'; likely the Euphrates.
    reason: cross_reference
  - marker: b
    text: Or 'in the land of his people.' The Hebrew phrase 'the land of the sons of his people' is difficult, and the pronoun 'his' may be understood in different ways.
    reason: alternative_reading
  - marker: c
    text: Literally 'has covered the face of the land'; compare the more literal but less clear 'eye of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 사절들을 브올의 아들 발람에게, 강가에 있는 브돌로, 곧 그의 민족의 땅에 보내어 그를 불러 이렇게 말하게 했습니다. “보십시오, 한 백성이 이집트에서 나왔습니다. 보십시오, 그들이 땅의 얼굴을 덮었고, 나와 마주 보고 거주하고 있습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 강’을 반영했습니다. 보통 유프라테스를 가리키는 것으로 이해됩니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 직역하면 ‘그의 민족의 땅’이지만, 소유격의 지시 대상은 다소 모호합니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘땅의 눈을 덮었다’입니다. 여기서는 더 분명한 관용 표현을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사절들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 인간 외교 맥락이므로 천사가 아니라 사람을 뜻하는 점을 살려, 격식 있는 현대 한국어로 ‘사절들’을 택했습니다.
- source_word: אֲשֶׁר עַל הַנָּהָר
  english_pob_choice: which is by the River
  chosen_korean: 강가에 있는
  alternatives_korean:
  - 강에 있는
  - 유프라테스 강에 있는
  lexicon: HALOT
  rationale: 히브리어의 ‘그 강’은 본문상 특정 강을 가리키지만, 본문 자체의 표현을 살려 우선 ‘강가에 있는’으로 옮겼습니다.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  english_pob_choice: in the land of the sons of his people
  chosen_korean: 그의 민족의 땅
  alternatives_korean:
  - 그의 백성의 땅
  - 그의 민족 자손들의 땅
  lexicon: HALOT
  rationale: 직역의 어색함을 줄이되, 소유격 해석의 모호성은 과도하게 정리하지 않기 위해 ‘그의 민족의 땅’으로 옮겼습니다.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  english_pob_choice: has covered the face of the land
  chosen_korean: 땅의 얼굴을 덮었고
  alternatives_korean:
  - 땅의 표면을 덮었고
  - 땅의 눈을 덮었고
  lexicon: HALOT
  rationale: 히브리어의 관용적 이미지를 살리기 위해 ‘얼굴’을 유지하되, 한국어 문맥에서는 ‘땅의 얼굴’을 자연스럽게 연결했습니다.
- source_word: מִמֻּלִי
  english_pob_choice: opposite me
  chosen_korean: 나와 마주 보고
  alternatives_korean:
  - 내 앞에
  - 나를 향해
  lexicon: HALOT
  rationale: 단순 위치보다 상호 대면의 뉘앙스를 살려, 집합적 거주 상태를 나타내는 뒤 문장과 함께 자연스럽게 표현했습니다.
theological_decisions:
- issue: 이름과 칭호의 직역 수준
  chosen_reading: ‘브올의 아들 발람’처럼 인명 계보를 그대로 유지하고, 본문에 없는 종교적 완화 표현은 넣지 않았습니다.
  alternative_readings:
  - 발람
  - 점쟁이 발람
  rationale: 히브리어 본문은 인물 식별을 위해 계보를 제시하므로 이를 보존하는 것이 가장 직접적입니다.
  doctrine_reference: 본문 충실성, 서술적 인물 식별
