  to: 그들이 발람에게 와서 그에게 말했습니다. “십볼의 아들 발락이 이렇게 말합니다. 부디 내게 오시기를 사양하지 마십시오.”
  rationale: 원문의 사절 전달 공식(‘이렇게 말합니다’)과 발락의 정중한 요청을 유지하면서, 이동 동사에 첨가된 의미를 제거하고 현대 표준어 합쇼체로 다듬었습니다. 「내게 오시기를」은 목적지인 발락의 관점에서 자연스러운 번역이며 원문의 의미를 보존합니다.
