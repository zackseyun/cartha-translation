  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
  footnotes:
  - marker: a
    text: Or “the serpent.” The Hebrew noun is singular and may represent the snake plague collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 때 백성이 모세에게 와서 말했습니다. “우리가 죄를 지었습니다. 우리가 야훼와 당신에게 말하여 거슬렀습니다. 야훼께 기도하여, 그분이 우리에게서 그 뱀을 거두어 주시게 하십시오.” 그러자 모세가 백성을 위해 기도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘뱀’은 단수형이며, 재앙 전체를 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  english_pob_choice: Then the people came
  chosen_korean: 그 때 백성이 와서
  alternatives_korean:
  - 그리하여 백성이 와서
  - 그리고 백성이 와서
  lexicon: HALOT
  rationale: waw-연속의 서사 진행을 한국어로 자연스럽게 옮기되, 집합명사 הָעָם은 ‘백성’으로 처리해 공동체 전체의 움직임을 드러냈습니다.
- source_word: חָטָאנוּ
  english_pob_choice: We have sinned
  chosen_korean: 우리가 죄를 지었습니다
  alternatives_korean:
  - 우리가 죄를 지었습니다
  - 우리가 죄를 지었습니다
  lexicon: HALOT
  rationale: 회개의 고백으로서 완료형의 결과성을 살리면서도, 한국어로는 과거 완료형보다 평서적 고백 표현이 더 자연스럽습니다.
- source_word: דִבַּרְנוּ בַּיהוָה וָבָךְ
  english_pob_choice: we have spoken against the LORD and against you
  chosen_korean: 우리가 야훼와 당신에게 말하여 거슬렀습니다
  alternatives_korean:
  - 우리가 야훼와 당신을 거슬러 말했습니다
  - 우리가 야훼와 당신에게 대항하여 말했습니다
  lexicon: HALOT
  rationale: בְּ + 동사 דִבֵּר의 반대/적대적 발화 의미를 살려 ‘거슬렀습니다’로 옮겼습니다. 직역적 ‘~을/를 반대하여 말했다’보다 한국어에서 더 분명합니다.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  english_pob_choice: Pray to the LORD
  chosen_korean: 야훼께 기도하여
  alternatives_korean:
  - 야훼께 간구하여
  - 야훼께 중보하여
  lexicon: HALOT
  rationale: hitpael פלל의 기본 의미를 살려 ‘기도하다’로 옮기고, אל의 방향성을 ‘~께’로 표현했습니다.
- source_word: וְיָסֵר מֵעָלֵינוּ אֶת הַנָּחָשׁ
  english_pob_choice: that he may take away the serpent from us
  chosen_korean: 그분이 우리에게서 그 뱀을 거두어 주시게 하십시오
  alternatives_korean:
  - 그분이 우리에게서 그 뱀을 제거해 주시게 하십시오
  - 그분이 우리에게서 그 뱀을 없애 주시게 하십시오
  lexicon: HALOT
  rationale: הסר의 ‘제거/걷어냄’ 의미를 한국어 동사 ‘거두어 주시다’로 옮겨, 원문의 제거 요청과 간구의 뉘앙스를 함께 살렸습니다. הנָּחָשׁ는 문맥상 단수형이지만 재앙 전체를 가리킬 수 있어 본문 형식을 유지했습니다.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  english_pob_choice: So Moses prayed for the people
  chosen_korean: 모세가 백성을 위해 기도했습니다
  alternatives_korean:
  - 모세가 백성을 위하여 기도했습니다
  - 모세가 백성을 대신하여 기도했습니다
  lexicon: HALOT
  rationale: בְּעַד의 대리/중보 의미를 한국어 ‘위해’로 자연스럽게 표현했습니다.
