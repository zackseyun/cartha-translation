  lexicon: HALOT
  rationale: hitpael פלל의 기본 의미를 살려 ‘기도하다’로 옮기고, אל의 방향성을 ‘~께’로 표현했습니다.
- source_word: וְיָסֵר מֵעָלֵינוּ אֶת הַנָּחָשׁ
  english_pob_choice: that he may take away the serpent from us
  chosen_korean: 그분이 우리에게서 그 뱀을 거두어 주시게 하십시오
  alternatives_korean:
  - 그분이 우리에게서 그 뱀을 제거해 주시게 하십시오
  - 그분이 우리에게서 그 뱀을 없애 주시게 하십시오
  lexicon: HALOT
  rationale: הסר의 ‘제거/걷어냄’ 의미를 한국어 동사 ‘거두어 주시다’로 옮겨, 원문의 제거 요청과 간구의 뉘앙스를 함께 살렸습니다. הנָּחָשׁ는 문맥상 단수형이지만 재앙 전체를 가리킬 수 있어 본문 형식을 유지했습니다.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  english_pob_choice: So Moses prayed for the people
  chosen_korean: 모세가 백성을 위해 기도했습니다
  alternatives_korean:
  - 모세가 백성을 위하여 기도했습니다
  - 모세가 백성을 대신하여 기도했습니다
  lexicon: HALOT
  rationale: בְּעַד의 대리/중보 의미를 한국어 ‘위해’로 자연스럽게 표현했습니다.
