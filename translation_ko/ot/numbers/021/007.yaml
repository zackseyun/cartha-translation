- source_word: דִבַּרְנוּ בַּיהוָה וָבָךְ
  english_pob_choice: we have spoken against the LORD and against you
  chosen_korean: 우리가 야훼와 당신에게 말하여 거슬렀습니다
  alternatives_korean:
  - 우리가 야훼와 당신을 거슬러 말했습니다
