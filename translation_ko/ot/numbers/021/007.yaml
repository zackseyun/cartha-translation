  lexicon: HALOT
  rationale: בְּ + 동사 דִבֵּר의 반대/적대적 발화 의미를 살려 ‘거슬렀습니다’로 옮겼습니다. 직역적 ‘~을/를 반대하여 말했다’보다 한국어에서 더 분명합니다.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  english_pob_choice: Pray to the LORD
  chosen_korean: 야훼께 기도하여
  alternatives_korean:
  - 야훼께 간구하여
