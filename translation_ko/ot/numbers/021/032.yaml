  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
  footnotes:
  - marker: a
    text: Literally, 'its daughters,' a Hebrew idiom for a city's dependent settlements or villages.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 야셀을 정탐하려고 사람들을 보냈습니다. 그들은 그 성에 딸린 마을들을[a] 점령하고, այնտեղ 있던 아모리 사람들을 몰아냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘그 성의 딸들’이며, 도시의 종속 정착지나 마을들을 가리키는 관용구입니다.
    reason: lexical_alternative
