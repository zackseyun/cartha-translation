  text: 그때 모세가 야셀을 정탐하도록 사람들을 보냈고, 그들이 그곳의 마을들을 점령하고 그곳에 있던 아모리 사람들을 몰아냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의/그것의 딸들’이지만, 도시의 종속 정착지나 마을들을 가리키는 관용구입니다.
