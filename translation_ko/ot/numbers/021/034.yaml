  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
  footnotes:
  - marker: a
    text: Or, 'Do not be afraid of him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'I have given him into your hand,' an idiom meaning 'I have delivered him into your power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “그를 두려워하지 마십시오. 내가 그와 그의 모든 백성과 그의 땅을 네 손에 넘겨주었습니다. 네가 그에게, 헤스본에 살던 아모리 사람의 왕 시혼에게 행한 것처럼 해야 합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그를 두려워하지 마십시오”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내가 그를 네 손에 주었다’는 관용구로, ‘네 권세 아래 넘겨주었다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms / project default
  rationale: 본문의 언약적 신명 표현을 표준적으로 음역해 하나님의 고유 이름을 드러내고, 일반 호칭인 '주'로 희석하지 않았습니다.
- source_word: אַל תִּירָא אֹתוֹ
  english_pob_choice: Do not fear him
  chosen_korean: 그를 두려워하지 마십시오
  alternatives_korean:
  - 그를 무서워하지 마십시오
  - 그를 두려워하지 말아라
  lexicon: HALOT
  rationale: ירא의 기본 의미를 살려 ‘두려워하다’로 옮겼고, 현대 합쇼체 금지형으로 자연스럽게 표현했습니다.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  english_pob_choice: I have given him into your hand
  chosen_korean: 내가 그를 네 손에 넘겨주었습니다
  alternatives_korean:
  - 내가 그를 네 손에 주었습니다
  - 내가 그를 네 권세 아래 두었습니다
  lexicon: HALOT
  rationale: ‘손에 주다’라는 히브리 관용을 한국어에서 가장 자연스럽게 드러내기 위해 ‘넘겨주다’를 택했으며, 지배/처분의 의미를 보존했습니다.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  english_pob_choice: You shall do to him as you did
  chosen_korean: 네가 그에게 … 행한 것처럼 해야 합니다
  alternatives_korean:
  - 네가 그에게 … 한 것처럼 해야 합니다
  - 그에게 너의 행위를 그대로 해야 합니다
  lexicon: HALOT
  rationale: עשה의 포괄적 의미를 따라 직역적이되 한국어에서 어색하지 않도록 ‘행하다’로 옮겼습니다.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  english_pob_choice: to Sihon king of the Amorites
  chosen_korean: 아모리 사람의 왕 시혼
  alternatives_korean:
  - 아모리족 왕 시혼
  - 아모리인의 왕 시혼
  lexicon: HALOT
  rationale: סיחון의 직함을 자연스러운 한국어 관용에 맞춰 ‘아모리 사람의 왕’으로 옮기되, 소유격 구조를 유지했습니다.
theological_decisions:
- issue: “in your hand” idiom and divine sovereignty
  chosen_reading: ‘네 손에 넘겨주었습니다’로 번역해, 단순한 위치 이동이 아니라 하나님이 적을 확실히 이스라엘의 처분 아래 두셨다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘네 손에 주었습니다’
  - ‘네 권세 아래 두었습니다’
  rationale: 문맥상 전쟁 승리를 보장하는 선언이므로, 관용구의 힘을 약화시키지 않으면서도 한국어에서 이해 가능한 표현을 선택했습니다.
  doctrine_reference: Divine sovereignty in conquest narratives
