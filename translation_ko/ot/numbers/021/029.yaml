  source_fidelity: 히브리어의 직접 호격, 모압의 파멸, 그모스와 연결된 3인칭 남성 단수 접미사, 그리고 아들들의 도피와 딸들의 포로됨이라는 대구를 유지해야 합니다. 초안의 '넘겨주었구나'는 נָתַן의 문맥상 의미를 대체로 전달하지만, '화 있으라'는 자연스럽지 않고 현대 표준어/합쇼체에도 맞지 않습니다.
  naturalness: '''화 있으라''는 현대 한국어에서 부자연스럽고 명령처럼 들립니다. 또한 ''그가 그의''의 반복과 ''도망자들로 ... 포로로 ... 넘겨주다''의 결합은 다소 어색합니다. 직접 호격에서는 주어를 생략하고, 자연스러운 현대 문장으로 정리하는 편이 좋습니다.'
  terminology: כְּמוֹשׁ은 통상 '그모스'로, סִיחוֹן은 '시혼'으로 음역할 수 있습니다. '포로'는 בַּשְּׁבִית에 적절합니다. '도망자'는 פְּלֵיטִם의 도피·탈출 의미를 보존합니다.
  issues:
