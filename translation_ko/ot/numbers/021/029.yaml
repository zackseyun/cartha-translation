- from: 「화 있으라, 모압아! 너는 무너졌구나, 그모스의 백성아! 그가 그의 아들들을 도망자들로, 그의 딸들을 포로로 사신, 아모리 왕 시혼에게 넘겨주었구나.」[a]
  to: 「모압아, 네게 화가 있습니다! 그모스의 백성아, 망했습니다! 그가 자기 아들들을 도망자로 내보내고, 자기 딸들을 포로로 아모리 왕 시혼에게 넘겼습니다.」[a]
  rationale: 현대 표준어 합쇼체에 맞게 감탄사를 '네게 화가 있습니다'로 고치고 종결을 '-습니다'로 통일했습니다. 3인칭 접미사의 기본 지시 대상은 직전의 그모스로 유지하여 '자기 아들들/자기 딸들'로 옮겼습니다. '도망자로 내보내고 ... 포로로 ... 넘겼습니다'는 히브리어의 대구와 패배·포로 상황을 자연스럽게 재현하며, 각주에는 모압을 지시 대상으로 보는 가능성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:58Z'
