source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
  footnotes:
  - marker: a
    text: Or 'its sons fugitives and its daughters into captivity,' taking the suffixes as referring to Moab rather than Chemosh.
    reason: alternative_reading
translation:
  language: ko
  text: 「화 있으라, 모압아! 너는 무너졌구나, 그모스의 백성아! 그가 그의 아들들을 도망자들로, 그의 딸들을 포로로 사신, 아모리 왕 시혼에게 넘겨주었구나.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모압의 아들들을 도망자들로, 모압의 딸들을 포로로'로 번역할 수 있습니다. 이 경우 접미사는 그모스가 아니라 모압을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있으라
  alternatives_korean:
  - 슬프다
  - 아, 재앙이여
  lexicon: HALOT
  rationale: 예언적 탄식과 재앙 선언의 힘을 살리기 위해, 현대 한국어에서 가장 직접적인 경고·통렬성 있는 표현으로 옮겼습니다.
- source_word: אָבַדְתָּ
  english_pob_choice: You are ruined
  chosen_korean: 너는 무너졌구나
  alternatives_korean:
  - 너는 멸망했구나
  - 너는 파멸했구나
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 자연스럽게 드러내면서도, 탄식조의 직설성을 유지하는 표현으로 잡았습니다.
- source_word: נָתַן
  english_pob_choice: He has made
  chosen_korean: 넘겨주었구나
  alternatives_korean:
  - 주었구나
  - 보내었구나
  lexicon: HALOT
  rationale: 단순한 '주다'보다, 패배한 자들을 적에게 넘기는 결과를 한국어로 더 분명하게 드러냅니다.
- source_word: פְּלֵיטִם / בַּשְּׁבִית
  english_pob_choice: fugitives / captives
  chosen_korean: 도망자들로, 그의 딸들을 포로로
  alternatives_korean:
  - 피난민들로, 그의 딸들을 포로로
  - 살아남은 자들로, 그의 딸들을 사로잡혀
  lexicon: HALOT
  rationale: 남자는 도망해 흩어진 상태, 여자는 포로가 된 상태라는 대구를 살리기 위해 각각 분명히 구분해 옮겼습니다.
theological_decisions:
- issue: 3인칭 남성 단수 접미사의 지시 대상
  chosen_reading: 접미사는 그모스를 가리키는 것으로 보고, '그의 아들들/그의 딸들'로 옮겼습니다.
  alternative_readings:
  - 모압을 가리켜 '그 나라의 아들들/딸들'로 옮길 수 있습니다.
  rationale: 히브리어의 직전 선행사는 그모스이며, POB의 해설도 이 인격화된 신적 소유 관계를 본문 의미의 핵심으로 봅니다.
  doctrine_reference: poetic personification / source-based antecedent reading
