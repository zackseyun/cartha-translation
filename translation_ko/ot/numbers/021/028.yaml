base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
  footnotes:
  - marker: a
    text: Or 'the heights of the Arnon.' The Hebrew phrase may refer either to the high places associated with the Arnon region or, more generally, to its heights.
    reason: lexical_alternative
  - marker: b
    text: Or 'the masters/possessors of the high places of the Arnon.' The expression 'lords of' reflects the Hebrew בַּעֲלֵי more directly.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 불이 헤스본에서 나왔고, 불길이 시혼의 성읍에서 나와 모압의 아르와 아르논의 높은 곳들의 주인들을 삼켜 버렸기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아르논의 높은 곳들’입니다. 히브리어 표현은 아르논 지역과 관련된 높은 곳들이거나, 더 일반적으로는 그 고지대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아르논의 높은 곳들의 주인들/소유자들’입니다. ‘주인들’은 히브리어 בַּעֲלֵי를 더 직접적으로 반영합니다.
    reason: alternative_reading
