id: NUM.21.27
reference: Numbers 21:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֛ן יֹאמְר֥וּ הַ/מֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְ/תִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
  footnotes:
  - marker: a
    text: Or “those who speak in proverbs,” “the bards”; traditionally, “the rulers.” The Hebrew participle likely refers here to composers or reciters of a proverbial song, not political rulers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 시인들이 말합니다. “헤스본아, 와라. 시혼의 성읍이 세워지고 견고하게 되게 하라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 이러므로
  lexicon: HALOT
  rationale: 앞뒤 문맥의 결론을 이끄는 접속으로 자연스러운 현대 한국어 연결어인 ‘그러므로’가 적절합니다.
- source_word: הַמֹּשְׁלִים
  english_pob_choice: the poets
  chosen_korean: 시인들이
  alternatives_korean:
  - 잠언을 말하는 이들이
  - 속담을 읊는 이들이
  - 풍자시를 읊는 이들이
  lexicon: HALOT
  rationale: 어근 משל은 ‘잠언/속담/풍자적 말’과 연관되지만, 이 절에서는 인용구를 여는 노래의 화자들이므로 POB의 ‘the poets’에 맞춰 기능 중심으로 ‘시인들’로 옮겼습니다.
- source_word: תִּבָּנֶה וְתִכּוֹנֵן
  english_pob_choice: let ... be built and established
  chosen_korean: 세워지고 견고하게 되게 하라
  alternatives_korean:
  - 건축되고 확립되게 하라
  - 지어지고 굳게 서게 하라
  lexicon: HALOT
  rationale: 두 동사는 병렬로 도시의 재건과 안정성을 나타내므로, 수동적 소망/명령 뉘앙스를 살려 ‘세워지고 견고하게 되게 하라’로 옮겼습니다.
- source_word: עִיר סִיחוֹן
  english_pob_choice: the city of Sihon
  chosen_korean: 시혼의 성읍
  alternatives_korean:
  - 시혼의 도시
  - 시혼에게 속한 성읍
  lexicon: HALOT
  rationale: 연결구문은 소유 관계를 나타내므로 ‘시혼의 성읍’이 가장 직접적이며, 한국어 성서 문체에서도 ‘성읍’이 자연스럽습니다.
theological_decisions:
- issue: 문학적 칭호인 הַמֹּשְׁלִים의 처리
  chosen_reading: 정치적 통치자가 아니라, 속담·조롱가를 읊는 시적 화자로 이해하여 ‘시인들’로 번역했습니다.
  alternative_readings:
  - 통치자들
  - 잠언을 말하는 사람들
  rationale: 문맥상 전쟁 승리를 노래하는 인용문을 도입하는 표현이므로, 독자가 권력자들로 오해하지 않도록 문학적 기능을 우선했습니다.
  doctrine_reference: 시적 인용구의 화자 식별
