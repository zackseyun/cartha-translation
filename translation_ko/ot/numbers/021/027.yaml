base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
  footnotes:
  - marker: a
    text: Or “those who speak in proverbs,” “the bards”; traditionally, “the rulers.” The Hebrew participle likely refers here to composers or reciters of a proverbial song, not political rulers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 시인들은[a] 말합니다. “헤스본으로 오라. 시혼의 성읍이 세워지고 굳게 서기를!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잠언이나 비유를 말하는 이들”, “음유시인들”. 전통적으로는 “통치자들”로도 옮겼습니다. 여기서는 잠언적·풍자적 노래를 짓거나 읊는 이들을 가리키는 것으로 보입니다.
    reason: הַמֹּשְׁלִים의 어휘적 대안과 문맥상 문학적 기능을 밝혀, ‘시인들’이라는 해석적 번역의 범위를 투명하게 합니다.
