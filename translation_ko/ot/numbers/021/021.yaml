id: NUM.21.21
reference: Numbers 21:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
  footnotes:
  - marker: a
    text: Or 'the Amorite king.' The Hebrew construct can be rendered either way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘은 아모리 족속의 왕 시혼에게 사신들을 보내며 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַ֤ח
  english_pob_choice: sent
  chosen_korean: 보내며
  alternatives_korean:
  - 보냈습니다
  - 보내었습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서사 전진을 자연스럽게 살리면서, 뒤의 직접 화법을 예비하는 동사로 한국어에서는 ‘보내며’가 가장 매끄럽습니다.
- source_word: מַלְאָכִ֔ים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 외교적 문맥에서 사람 사자들을 가리키므로 천사로 오해되지 않게 하면서도, 공적인 파견을 드러내는 ‘사신들’이 적절합니다.
- source_word: מֶֽלֶךְ הָ/אֱמֹרִ֖י
  english_pob_choice: king of the Amorites
  chosen_korean: 아모리 족속의 왕
  alternatives_korean:
  - 아모리의 왕
  - 아모리 왕
  lexicon: HALOT
  rationale: 히브리어 구문은 ‘아모리/아모리 족속의 왕’을 뜻하므로, 집단 명칭을 분명히 드러내는 ‘아모리 족속의 왕’이 의미를 가장 분명하게 전달합니다.
- source_word: לֵ/אמֹֽר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르며
  lexicon: HALOT
  rationale: 다음 절의 직접 인용을 여는 관용적 기능을 한국어에서는 ‘말했습니다’로 자연스럽게 옮기되, 서술 흐름은 앞의 ‘보내며’가 이어받습니다.
