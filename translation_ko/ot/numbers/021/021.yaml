review_pass:
  verdict: revise
  source_fidelity: ‘보내며 말했습니다’는 히브리어의 연속 서술과 לֵאמֹר가 이끄는 다음 절의 발화를 한 문장 안에서 동시 행위처럼 연결하여, ‘사신을 보내면서 말하였다’로 읽힐 수 있습니다. 사신을 보낸 뒤 그들이 전한 말을 다음 절에서 제시하는 구조를 분명히 해야 합니다.
  naturalness: ‘사신들을 보내어 이렇게 말했습니다:’는 현대 표준어 합쇼체에서 다음 절의 직접 인용을 자연스럽게 예고합니다. ‘아모리 족속’보다 ‘아모리 사람들’이 더 현대적이고 자연스럽습니다.
  terminology: ‘이스라엘’, ‘시혼’, ‘사신’은 적절합니다. מֶלֶךְ הָאֱמֹרִי는 ‘아모리 사람들의 왕’으로 옮기고, 원문의 ‘아모리 왕’이라는 가능한 구문적 표현은 각주로 보존합니다.
  issues:
  - severity: medium
    issue: ‘보내며 말했습니다’가 발화 도입의 문법적 관계를 흐립니다.
    rationale: וַיִּשְׁלַח의 주동사는 ‘보냈다’이며, לֵאמֹר는 사신들이 다음 절에서 전할 발화를 도입합니다. ‘보내어 이렇게 말했습니다’가 이를 더 충실하고 명료하게 전달합니다.
  - severity: low
    issue: 원문의 ‘아모리 왕’이라는 대안적 표현에 대한 각주가 없습니다.
    rationale: 영어 POB 감사 기록이 보존한 construct 구문의 번역 대안을 한국어에서도 간결히 제시하는 것이 적절합니다.
  revised_text: '그때 이스라엘이 아모리 사람들의 왕 시혼에게 사신들을 보내어 이렇게 말했습니다:'
  revised_footnotes:
  - marker: a
    text: 또는 “아모리 왕”.
    reason: 히브리어 연계구문은 ‘아모리 사람들의 왕’ 또는 ‘아모리 왕’으로 표현할 수 있습니다.
  revision_rationale: 서사 동사와 다음 절 직접 화법의 관계를 명확히 하기 위해 ‘보내며 말했습니다’를 ‘보내어 이렇게 말했습니다:’로 고쳤습니다. 민족명은 현대적인 ‘아모리 사람들’로 다듬었고, 영어 감사 기록에 있는 구문 대안을 각주로 보존했습니다.
