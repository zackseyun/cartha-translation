  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
  footnotes:
  - marker: a
    text: Or possibly, “Waheb in the storm,” if Suphah is taken as a common noun rather than a place-name.
    reason: alternative_reading
  - marker: b
    text: The Hebrew of this quoted line is obscure; some understand “Waheb” differently, even as part of a verbal clause rather than a place-name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼의 전쟁기에는 이렇게 기록되어 있습니다. “수바[a]에 있는 와헙[b]과 아르논의 와디들.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수바’는 지명일 수 있습니다. 일반 명사로 보면 ‘폭풍 속에서’라는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 인용문의 히브리어는 난해합니다. ‘와헙’은 지명으로 이해할 수 있으나, 일부는 이를 동사구의 일부로 이해합니다.
