base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
  footnotes:
  - marker: a
    text: Or, more traditionally, “the king’s highway.”
    reason: lexical_alternative
translation:
  language: ko
  text: “당신의 땅을 지나가게 해주십시오. 우리는 밭이나 포도원으로 빗돌지 않을 것이며, 우물 물도 마시지 않을 것입니다. 우리는 왕의 길로 가다가 당신의 경계를 지나갈 때까지 가겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 길’은 전통적으로 ‘왕의 대로’ 또는 ‘왕의 고속도로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  english_pob_choice: Let me pass through
  chosen_korean: 지나가게 해주십시오
  alternatives_korean:
  - 지나가도록 허락해주십시오
  - 지나가게 해주십시오
  lexicon: HALOT
  rationale: כהhortative 1인칭 청유는 정중한 요청이므로, 자연스러운 합쇼체 청원형으로 옮겼습니다.
- source_word: בְאַרְצְךָ
  english_pob_choice: your land
  chosen_korean: 당신의 땅
  alternatives_korean:
  - 당신의 땅
  - 당신의 나라
  - 당신의 영토
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미인 ‘땅/영역’을 살려, 정치적·지리적 요청 상황에서 가장 직접적인 표현으로 옮겼습니다.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  english_pob_choice: into field or vineyard
  chosen_korean: 밭이나 포도원으로
  alternatives_korean:
  - 밭이나 포도원으로
  - 밭이나 포도밭으로
  - 한 밭이나 한 포도원으로
  lexicon: HALOT
  rationale: 전치사가 붙은 단수 명사는 일반적 범주를 가리키므로, 한국어에서는 ‘~으로 빗돌다’로 방향 이탈을 자연스럽게 표현했습니다.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  english_pob_choice: by the king’s road
  chosen_korean: 왕의 길로
  alternatives_korean:
  - 왕의 길로
  - 왕의 대로로
  - 왕의 큰길로
  lexicon: HALOT
  rationale: 직역인 ‘왕의 길’이 본문의 공적 통행로라는 의미를 잘 보존하며, 전통적이지만 다소 낡은 ‘고속도로/큰길’보다 원문 이미지에 충실합니다.
- source_word: גְּבֻלֶךָ
  english_pob_choice: your territory
  chosen_korean: 당신의 경계
  alternatives_korean:
  - 당신의 경계
  - 당신의 영토
  - 당신의 국경
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계/경계선’의 구체성을 가지므로, 요청의 종착점을 드러내는 ‘경계’를 택했습니다.
theological_decisions:
- issue: 정중한 외교적 요청의 문체
  chosen_reading: 전체를 공적인 협상 발화로 보고, 직접 인용부 안에서도 공손한 청원형을 유지했습니다.
  alternative_readings:
  - 더 평이한 서술형
  - 명령형에 가까운 직설 표현
  rationale: 모압 왕에게 보내는 요청의 성격상, 청유·요청의 공손함을 한국어 합쇼체로 살리는 것이 원문의 화행을 가장 잘 반영합니다.
  doctrine_reference: 서사문맥의 담화 기능 보존
