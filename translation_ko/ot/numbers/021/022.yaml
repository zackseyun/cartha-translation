  chosen_korean: 당신의 경계
  alternatives_korean:
  - 당신의 경계
  - 당신의 영토
  - 당신의 국경
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계/경계선’의 구체성을 가지므로, 요청의 종착점을 드러내는 ‘경계’를 택했습니다.
theological_decisions:
- issue: 정중한 외교적 요청의 문체
  chosen_reading: 전체를 공적인 협상 발화로 보고, 직접 인용부 안에서도 공손한 청원형을 유지했습니다.
  alternative_readings:
  - 더 평이한 서술형
  - 명령형에 가까운 직설 표현
  rationale: 모압 왕에게 보내는 요청의 성격상, 청유·요청의 공손함을 한국어 합쇼체로 살리는 것이 원문의 화행을 가장 잘 반영합니다.
  doctrine_reference: 서사문맥의 담화 기능 보존
