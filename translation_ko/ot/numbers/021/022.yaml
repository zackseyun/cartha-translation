revisions:
- from: “당신의 땅을 지나가게 해주십시오. 우리는 밭이나 포도원으로 빗돌지 않을 것이며, 우물 물도 마시지 않을 것입니다. 우리는 왕의 길로 가다가 당신의 경계를 지나갈 때까지 가겠습니다.”[a]
  to: “당신의 땅을 지나가게 해주십시오. 우리는 밭이나 포도원으로 들어가지 않겠으며, 우물 물도 마시지 않겠습니다. 우리는 왕의 길[a]을 따라 당신의 경계를 벗어날 때까지 가겠습니다.”
  rationale: 표준어로 어색한 ‘빗돌지’를 원문의 여행·우회 의미를 보존하는 ‘들어가지 않겠으며’로 고쳤습니다. 종결부는 왕의 길을 따라 상대 지역의 경계를 넘어갈 때까지 이동한다는 뜻을 간결하게 드러내도록 다듬었습니다. 각주는 해당 어구에 붙이고, 시대착오적인 ‘고속도로’ 대안을 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:57Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 נָטָה의 ‘길에서 벗어나다’라는 이동 표현은 ‘빗돌다’보다 표준적이고 자연스러운 말로 고쳐야 하며, 마지막 절은 ‘경계를 벗어날 때까지’로 옮겨 통과의 종점을 분명히 하는 편이 좋습니다.
  naturalness: ‘빗돌지’는 현대 표준어 문장으로 부자연스럽고 오기로도 보입니다. 또한 ‘가다가 … 때까지 가겠습니다’는 동사가 중복되어 어색합니다. ‘왕의 길을 따라 … 가겠습니다’가 간결하고 자연스럽습니다.
  terminology: ‘왕의 길’은 원문의 왕의 공로(公路)라는 표현을 보존하는 적절한 번역입니다. 그러나 각주의 ‘왕의 고속도로’는 고대 교통로에 부적절하게 현대적이며, 전통적 대안도 아닙니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다. 번역 주석의 ‘모압 왕’이라는 문맥 설명은 본절의 수신자가 아모리 왕 시혼이라는 서사 문맥과 맞지 않습니다.
  issues:
  - severity: medium
    issue: ‘빗돌지’라는 표현
    rationale: 원문의 ‘돌이켜 벗어나다’를 나타내려는 의도는 알 수 있으나, 현대 표준어 합쇼체에서 부자연스럽습니다. ‘밭이나 포도원으로 들어가지 않겠습니다’가 의미와 문체를 자연스럽게 전달합니다.
  - severity: low
    issue: 마지막 절의 동사 중복
    rationale: ‘왕의 길로 가다가 … 때까지 가겠습니다’는 ‘가다’가 불필요하게 겹칩니다. ‘왕의 길을 따라 … 가겠습니다’로 다듬는 것이 자연스럽습니다.
  - severity: medium
    issue: 각주의 ‘왕의 고속도로’ 및 표지 위치
    rationale: ‘고속도로’는 시대착오적인 현대 기반시설 용어입니다. 또한 어휘 대안 각주 표지는 ‘왕의 길’에 직접 붙여 참조 대상을 명확히 해야 합니다.
  - severity: medium
    issue: 번역 주석의 ‘모압 왕’ 언급
    rationale: 민수기 21:22의 요청은 모압 왕이 아니라 아모리 왕 시혼에게 전달됩니다. 이는 번역문 자체에는 반영되지 않았지만 관련 주석 자료에서 바로잡아야 합니다.
  revised_text: “당신의 땅을 지나가게 해주십시오. 우리는 밭이나 포도원으로 들어가지 않겠으며, 우물 물도 마시지 않겠습니다. 우리는 왕의 길[a]을 따라 당신의 경계를 벗어날 때까지 가겠습니다.”
