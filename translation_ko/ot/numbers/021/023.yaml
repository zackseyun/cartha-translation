id: NUM.21.23
reference: Numbers 21:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
  footnotes:
  - marker: a
    text: Or 'did not permit Israel to pass through his border.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all his people'; the text does not explicitly say 'army,' though the military context implies an armed force.
    reason: lexical_alternative
  - marker: c
    text: Jahaz is also spelled 'Jahzah' in some English renderings.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 시혼은 이스라엘이 자기 영토[a]를 지나가도록 허락하지 않았습니다. 그래서 시혼은 자기 모든 백성을 모아 광야에서 이스라엘을 맞으러 나가서[c][b] 야하스에 이르러 이스라엘과 싸웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 국경을 지나가도록 허락하지 않았다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘자기 모든 백성’이라고 말하며, 본문이 직접 ‘군대’라고 하지는 않지만 전투 문맥상 무장한 무리를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야하스’는 일부 영어 번역에서 ‘야합’처럼 표기되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא נָתַן
  english_pob_choice: did not allow
  chosen_korean: 허락하지 않았습니다
  alternatives_korean:
  - 허용하지 않았습니다
  - 지나가게 하지 않았습니다
  lexicon: HALOT
  rationale: 직역의 ‘주지 않았다’보다 문맥상 통행 허가를 가리키는 의미가 분명하므로, 자연스러운 현대어로 ‘허락하지 않았다’가 적절합니다.
- source_word: בִּגְבֻלוֹ
  english_pob_choice: through his territory
  chosen_korean: 자기 영토
  alternatives_korean:
  - 자기 경계
  - 자기 국경
  lexicon: HALOT
  rationale: 지형의 경계선보다 그가 지배하는 땅 전체를 가리키는 문맥이므로 ‘영토’가 더 분명합니다.
- source_word: אֶת כָּל עַמּוֹ
  english_pob_choice: all his people
  chosen_korean: 자기 모든 백성
  alternatives_korean:
  - 자기 모든 사람들
  - 자기 군대
  lexicon: HALOT
  rationale: 히브리어는 ‘군대’가 아니라 ‘모든 백성’이라고 말하므로, 군사적 함의를 유지하되 본문 표현을 보존했습니다.
- source_word: לִקְרַאת יִשְׂרָאֵל הַמִּדְבָּרָה
  english_pob_choice: went out to meet Israel in the wilderness
  chosen_korean: 광야에서 이스라엘을 맞으러 나가서
  alternatives_korean:
  - 광야로 이스라엘을 만나러 나가서
  - 광야에서 이스라엘과 대면하러 나가서
  lexicon: HALOT
  rationale: לִקְרַאת은 ‘맞으러/대면하러’의 중립적 만남을 뜻하고, 뒤의 전쟁 동사에서 적대성이 드러나므로 여기서는 과도하게 ‘대항하여’로 옮기지 않았습니다.
- source_word: יָהְצָה
  english_pob_choice: Jahaz
  chosen_korean: 야하스
  alternatives_korean:
  - 야합
  - 자하스
  lexicon: HALOT
  rationale: 지명 יָהְצָה의 한국어 음역으로, 본문 표기와 영어 전통의 Jahaz에 대응하는 현대적 표기를 사용했습니다.
theological_decisions:
- issue: ‘면전/맞으러’의 중립성과 뒤이은 전투 진술의 관계
  chosen_reading: ‘광야에서 이스라엘을 맞으러 나가서’로 옮겨, 먼저 만남의 방향을 말하고 뒤의 ‘싸웠습니다’에서 적대성을 확정했습니다.
  alternative_readings:
  - ‘광야로 이스라엘을 대적하러 나가서’
  - ‘이스라엘과 맞서기 위해 광야로 나가서’
  rationale: 히브리어 본문은 첫 동작에서 아직 전투를 명시하지 않고, 마지막 절에서 싸움을 분명히 말합니다. 이 구분을 보존하는 것이 서술의 힘을 살립니다.
  doctrine_reference: 서사 문맥의 단계적 진술 보존
- issue: ‘백성’과 군사적 함의
  chosen_reading: ‘자기 모든 백성’을 유지해 본문이 직접 말하는 범위를 지키면서, 군사적 집결의 뉘앙스는 서술 전체로 전달했습니다.
  alternative_readings:
  - ‘자기 모든 군대’
  - ‘모든 전사’
  rationale: 원문은 전투 상황이더라도 ‘군대’라고 명시하지 않으므로, 본문 표현을 넘어선 명시화는 피했습니다.
  doctrine_reference: 본문 명시성 보존
