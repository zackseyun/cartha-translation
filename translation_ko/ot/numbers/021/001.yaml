id: NUM.21.1
reference: Numbers 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the way of Atharim.'' The term ''Atharim'' is uncertain; some understand it as a place name, while others, influenced by ancient versions, take it to mean ''the spies'' or ''the scouts.'''
    reason: alternative_reading
translation:
  language: ko
  text: 가나안 사람, 곧 아랏 왕은 네게브에 살고 있었는데, 이스라엘이 아타림 길로 온다는 소식을 듣고 이스라엘과 싸워 그들 가운데서 몇 사람을 포로로 사로잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아타림의 길’. ‘아타림’은 뜻이 분명하지 않아 지명으로 보기도 하고, 옛 번역본들의 영향을 따라 ‘정탐꾼들’ 또는 ‘정탐꾼들의 길’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  english_pob_choice: the Canaanite king of Arad
  chosen_korean: 가나안 사람, 곧 아랏 왕
  alternatives_korean:
  - 아랏의 가나안 사람 왕
  - 가나안 사람인 아랏 왕
  lexicon: HALOT
  rationale: 히브리어는 관사 있는 ‘가나안 사람’과 ‘아랏 왕’의 동격 구조이므로, 한국어에서는 ‘곧’으로 풀어 같은 인물을 설명하는 방식이 가장 자연스럽습니다.
- source_word: יֹשֵׁב הַנֶּגֶב
  english_pob_choice: who lived in the Negev
  chosen_korean: 네게브에 살고 있었는데
  alternatives_korean:
  - 네게브에 거주하고 있었는데
  - 네게브에 살던
  lexicon: HALOT
  rationale: 분사 יֹשֵׁב는 지속적 거주를 나타내므로 ‘살고 있었는데’가 서술 흐름과 잘 맞고, 지명은 ‘네게브’로 그대로 살렸습니다.
- source_word: דֶּרֶךְ הָאֲתָרִים
  english_pob_choice: by the way of Atharim
  chosen_korean: 아타림 길
  alternatives_korean:
  - 아타림의 길
  - 아타림 경로
  - 정탐꾼들의 길
  lexicon: HALOT
  rationale: 히브리어 본문은 애매하지만 보수적으로 지명처럼 음역한 영어 POB를 따르되, 한국어도 ‘길’로 옮겨 원문의 경로 표현을 보존했습니다.
- source_word: וַיִּשְׁבְּ ... שֶׁבִי
  english_pob_choice: took some of them captive
  chosen_korean: 그들 가운데서 몇 사람을 포로로 사로잡았습니다
  alternatives_korean:
  - 그들 가운데서 몇 사람을 사로잡았습니다
  - 그들 가운데서 몇 사람을 포로로 잡았습니다
  lexicon: HALOT
  rationale: 동사 שׁבה와 명사 שֶׁבִי의 결합은 전쟁 포로를 가리키므로, ‘포로로 사로잡았습니다’로 결과 상태를 분명히 했습니다.
theological_decisions:
- issue: 전쟁 서술의 직설성
  chosen_reading: 본문의 폭력적 행위를 완화하지 않고, ‘싸워’와 ‘포로로 사로잡았습니다’로 직접 옮겼습니다.
  alternative_readings:
  - ‘공격해 일부를 데려갔습니다’처럼 완화하는 번역
  - ‘전쟁을 일으켜’처럼 일반화하는 번역
  rationale: 이 절은 이스라엘의 이동 소식에 대한 적대적 군사 행동을 기록하므로, 서술의 긴장과 결과를 그대로 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 내 역사 서술의 사실성 보존
- issue: 아타림의 의미 불확실성
  chosen_reading: 본문에는 ‘아타림 길’로 두고, 의미 불확실성은 각주로 처리하지 않았습니다.
  alternative_readings:
  - ‘정탐꾼들의 길’로 해석하는 번역
  - 주석 없이도 전통 지명으로 확정하는 번역
  rationale: 히브리어 자음 본문만으로는 지명 여부가 불확실하지만, 한국어 본문에서는 POB의 보수적 선택을 따라 중립적으로 처리하는 것이 가장 안전합니다.
  doctrine_reference: 본문 비평/어휘 불확실성 처리 원칙
