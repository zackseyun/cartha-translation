  to: 네게브에 살던 가나안 사람인 아랏 왕은 이스라엘이 아타림 길[a]로 오고 있다는 소식을 듣고, 이스라엘과 싸워 그들 가운데 몇 사람을 포로로 사로잡았습니다.
