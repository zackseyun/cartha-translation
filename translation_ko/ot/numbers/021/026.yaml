  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
  footnotes:
  - marker: a
    text: Or 'from his power'; the Hebrew idiom is literally 'out of his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 헤스본은 아모리 사람들의 왕 시혼의 성읍이며, 그는 모압의 이전 왕과 싸워 그의 손에서 그의 온 땅을 아르논까지 빼앗았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘그의 손에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - 곧
  lexicon: HALOT
  rationale: 앞절의 설명을 여는 כִּי의 인과·설명 기능을 한국어에서 가장 자연스럽게 드러냅니다.
- source_word: חֶשְׁבּוֹן עִיר
  english_pob_choice: Heshbon was the city
  chosen_korean: 헤스본은 … 성읍이며
  alternatives_korean:
  - 헤스본은 … 도시이며
  - 헤스본은 … 성읍이었습니다
  lexicon: HALOT
  rationale: עִיר은 여기서 정치적 중심지인 ‘성읍’이 더 적절하며, 현재형 계열의 관계절로 뒤의 설명을 자연스럽게 잇습니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손으로부터
  - 그의 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서는 ‘손’이 통제와 소유를 뜻하는 이미지를 유지하도록 했습니다.
- source_word: עַד אַרְנֹן
  english_pob_choice: as far as the Arnon
  chosen_korean: 아르논까지
  alternatives_korean:
  - 아르논에 이르기까지
  - 아르논까지 이르러
  lexicon: HALOT
  rationale: 영역의 경계를 나타내는 종결 표현을 간결하게 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술의 시제와 설명적 연결
  chosen_reading: 역사적 회상 속 설명문으로 읽어, 과거 사건을 현재 진술 안에 풀어 적었습니다.
  alternative_readings:
  - 단순 과거 서술로 평행하게 번역
  - 더 강한 과거완료로 처리
  rationale: 본문은 전후 문맥을 설명하는 보충 진술이므로, 한국어에서도 설명적 연결이 분명하도록 했습니다.
  doctrine_reference: 본문 서사 구조
