  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר הָ/עָ֗ם בֵּֽ/אלֹהִים֮ וּ/בְ/מֹשֶׁה֒ לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לָ/מ֖וּת בַּ/מִּדְבָּ֑ר כִּ֣י אֵ֥ין לֶ֨חֶם֙ וְ/אֵ֣ין מַ֔יִם וְ/נַפְשֵׁ֣/נוּ קָ֔צָה בַּ/לֶּ֖חֶם הַ/קְּלֹקֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
  footnotes:
  - marker: a
    text: Or “this contemptible bread” or “this worthless bread.” The Hebrew adjective is rare and expresses disdain for the food God provided.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성이 하나님과 모세를 향해 말했습니다. “어찌하여 우리를 이집트에서 데리고 올라와 광야에서 죽게 하셨습니까? 여기에는 빵도 없고 물도 없으며, 우리는 이 하찮은 빵을 혐오합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하찮은’은 히브리어의 드문 형용사 קְלֹקֵל이 담는 경멸과 하찮음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בֵּאלֹהִים וּבְמֹשֶׁה
  english_pob_choice: spoke against God and against Moses
  chosen_korean: 하나님과 모세를 향해 말했습니다
  alternatives_korean:
  - 하나님과 모세를 거슬러 말했습니다
  - 하나님과 모세에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 דבר + ב는 여기서 적대적 항의의 뉘앙스를 가지지만, 한국어에서는 ‘~를 향해 말하다’가 가장 자연스럽게 불평·항의의 방향성을 살립니다.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  english_pob_choice: have you brought us up out of Egypt
  chosen_korean: 우리를 이집트에서 데리고 올라와
  alternatives_korean:
  - 우리를 이집트에서 올라오게 하여
  - 우리를 이집트에서 이끌어내어
  lexicon: HALOT
  rationale: עלה의 출애굽 관용을 살리되, 현대 한국어에서는 ‘데리고 올라오다’가 이동성과 인도 행위를 함께 자연스럽게 드러냅니다.
- source_word: וְנַפְשֵׁנוּ קָצָה
  english_pob_choice: we loathe
  chosen_korean: 우리는 … 혐오합니다
  alternatives_korean:
  - 우리는 … 싫증이 납니다
  - 우리는 … 역겨워합니다
  lexicon: HALOT
  rationale: נפשׁ קצה는 직역보다 강한 혐오·진저리의 감정을 나타내므로, 문어체 합쇼체에서 ‘혐오합니다’가 의미 강도를 잘 보존합니다.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  english_pob_choice: this miserable bread
  chosen_korean: 이 하찮은 빵
  alternatives_korean:
  - 이 비천한 빵
  - 이 천한 빵
  - 이 무가치한 빵
  lexicon: HALOT
  rationale: קְלֹקֵל은 드물고 경멸적인 형용사이므로, 한국어에서 음식에 대한 멸시를 드러내는 ‘하찮은’이 가장 무난하게 대응합니다. ‘빵’은 앞의 לֶחֶם 반복을 살리기 위해 유지했습니다.
theological_decisions:
- issue: 백성의 발화가 단순 서술이 아니라 하나님에 대한 반항적 항의라는 점
  chosen_reading: 중립적 ‘말했습니다’가 아니라, 문맥상 불평과 반항이 드러나도록 ‘하나님과 모세를 향해 말했습니다’로 옮겼습니다.
  alternative_readings:
  - 하나님과 모세에게 말했습니다
  - 하나님과 모세를 거슬러 말했습니다
  rationale: 본문의 직접 인용이 출애굽 인도 자체를 문제 삼는 항의이므로, 해석을 약화시키지 않으면서도 과도한 신학적 확대는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
