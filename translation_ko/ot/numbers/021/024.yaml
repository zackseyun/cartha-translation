  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'as far as the Ammonites' ... 'for the border of the Ammonites was strong.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 칼날로 그를 쳤고, 아르논에서 얍복까지, 암몬 자손에 이르기까지 그의 땅을 차지하였습니다. 이는 암몬 자손의 경계가 견고하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘암몬 사람들에 이르기까지’로 옮길 수 있습니다. 뒤의 ‘암몬 자손의 경계’도 ‘암몬 사람들의 경계’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him
  chosen_korean: 쳐서 무찔렀고
  alternatives_korean:
  - 쳤고
  - 쳐서 쳤고
  - 쳐서 격파하였고
  lexicon: HALOT
  rationale: נכה의 기본 뜻은 '치다/때리다'이므로 '쳤다'를 살리고, 전쟁 문맥에서 결과를 분명히 하되 본문이 말하는 것 이상으로 죽음까지 단정하지 않기 위해 '무찔렀다'를 덧붙였습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 검의 날로
  - 칼의 날로
  - 칼로
  lexicon: HALOT
  rationale: 히브리어의 직역상 '칼의 입/날'이라는 이미지를 반영하여, 한국어에서도 간결하게 보이는 '칼날로'를 택해 원문의 비유를 보존했습니다.
- source_word: וַיִּירַשׁ אֶת אַרְצוֹ
  english_pob_choice: took possession of his land
  chosen_korean: 그의 땅을 차지하였습니다
  alternatives_korean:
  - 그의 땅을 점유하였습니다
  - 그의 땅을 소유하였습니다
  - 그의 땅을 상속받았습니다
  lexicon: HALOT
  rationale: ירש는 군사적 맥락에서 '차지하다/점유하다'의 의미가 자연스러워, 영토 획득을 현대 한국어로 분명하게 드러내는 '차지하다'를 선택했습니다.
- source_word: עַד בְּנֵי עַמּוֹן
  english_pob_choice: as far as the sons of Ammon
  chosen_korean: 암몬 자손까지
  alternatives_korean:
  - 암몬 족속까지
  - 암몬 사람들까지
  - 암몬 사람들
  lexicon: HALOT
  rationale: 히브리어의 'sons of Ammon'을 본문에서는 직역에 가깝게 '암몬 자손'으로 살리고, 한국어에서 자연스럽게 경계의 종착점을 나타내기 위해 '까지'를 붙였습니다.
- source_word: כִּי עַז גְּבוּל בְּנֵי עַמּוֹן
  english_pob_choice: for the border of the sons of Ammon was strong
  chosen_korean: 이는 암몬 자손의 경계가 강하였기 때문입니다
  alternatives_korean:
  - 이는 암몬 자손의 경계가 견고하였기 때문입니다
  - 이는 암몬 사람들의 경계가 강하였기 때문입니다
  - 왜냐하면 암몬 자손의 경계가 강하였기 때문입니다
  lexicon: HALOT
  rationale: עַז의 기본 의미인 '강하다'를 살려 '강하였기 때문입니다'로 옮겼고, 문맥상 이유절을 한국어로 자연스럽게 연결했습니다.
theological_decisions:
- issue: בְּנֵי עַמּוֹן의 민족명 표현
  chosen_reading: 암몬 자손
  alternative_readings:
  - 암몬 사람들
  - 암몬 족속
  - 암몬인들
  rationale: 본문의 친족형 표현을 투명하게 보존하면서도, 한국어 독자가 민족 집단을 이해하도록 '암몬 자손'을 유지했습니다. 이는 원문 형식을 드러내는 쪽을 우선한 선택입니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
