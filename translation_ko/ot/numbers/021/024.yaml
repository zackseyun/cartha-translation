  source_fidelity: ‘쳐서 무찔렀고’는 וַיַּכֵּהוּ(그를 쳤다)에 ‘패배시켰다’라는 결과를 덧붙입니다. 히브리어는 그가 죽거나 패배했다는 결과를 이 동사 자체로 명시하지 않으므로, ‘쳤습니다’로 제한하는 편이 충실합니다. 지리적 범위와 암몬 관련 표현은 원문의 반복과 다소 거친 지리적 연결을 보존할 수 있습니다.
  naturalness: ‘암몬 자손에 이르기까지’는 민족을 가리키는 히브리어 친족 표현을 보존하면서도 ‘암몬 자손까지’보다 자연스럽습니다. 경계에 ‘강하다’를 그대로 쓰면 현대 한국어에서 다소 부자연스러우므로, 원문의 강함/견고함의 뜻을 유지하는 ‘견고하였습니다’가 적절합니다.
  terminology: ‘칼날’, ‘차지하였습니다’, ‘암몬 자손’, ‘경계’는 각각 원문의 표현과 문맥에 잘 맞습니다. ‘암몬 자손’은 민족 집단을 가리키는 표현임을 각주에서 관용적 대안으로 밝혀 주는 것이 좋습니다.
