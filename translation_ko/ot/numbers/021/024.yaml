revisions:
- from: 이스라엘은 그를 칼날로 쳐서 무찔렀고, 아르논에서 얍복까지, 곧 암몬 자손까지 그의 땅을 차지하였습니다. 이는 암몬 자손의 경계가 강하였기 때문입니다.[a]
  to: 이스라엘은 칼날로 그를 쳤고, 아르논에서 얍복까지, 암몬 자손에 이르기까지 그의 땅을 차지하였습니다. 이는 암몬 자손의 경계가 견고하였기 때문입니다.[a]
  rationale: 전쟁 문맥에서 가능한 ‘무찌르다’를 हट내고, 원문의 직접적 동작인 ‘치다’를 유지하였습니다. 또한 경계의 ‘강함’을 현대 한국어에서 자연스러운 ‘견고함’으로 표현하되, 원문의 의미 범위를 넘는 구체적 군사 시설 묘사는 피하였습니다. 각주 표지는 이유절 뒤에 유지하여 암몬 자손이라는 민족 표현의 두 용례 모두를 설명하게 하였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:54Z'
