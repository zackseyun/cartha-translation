id: NUM.21.16
reference: Numbers 21:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
  footnotes:
  - marker: a
    text: Beer is the name of the place; the Hebrew name sounds like the word for 'well.'
    reason: cultural_note
  - marker: b
    text: Or 'the well concerning which the LORD said to Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그곳에서 그들은 브엘[a]로 갔습니다. 그곳은 야훼께서 모세에게 말씀하신 그 우물[b]입니다. “백성을 모으십시오. 내가 그들에게 물을 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브엘은 장소 이름이며, 히브리어 이름은 ‘우물’을 뜻하는 말과 비슷하게 들립니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼께서 모세에게 말씀하신 우물.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  english_pob_choice: And from there
  chosen_korean: 그리고 그곳에서
  alternatives_korean:
  - 그곳에서
  - 거기서
  lexicon: HALOT
  rationale: 이동 경로를 이어 주는 접속을 살려 ‘그리고’로 시작하고, המקום 감각은 ‘그곳에서’로 자연스럽게 옮겼습니다.
- source_word: בְּאֵרָה
  english_pob_choice: Beer
  chosen_korean: 브엘
  alternatives_korean:
  - 브에라
  - 베에르
  lexicon: HALOT
  rationale: 지명으로 처리해 현대 외래어 표기법에 따라 음역했으며, 히브리어 지명-발음과의 연결을 유지했습니다.
- source_word: הִוא הַבְּאֵר אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  english_pob_choice: That is the well about which Yahweh said to Moses
  chosen_korean: 거기는 야훼께서 모세에게 말씀하신 그 우물입니다
  alternatives_korean:
  - 그것은 야훼께서 모세에게 말씀하신 우물입니다
  - 야훼께서 모세에게 말씀하신 바로 그 우물입니다
  lexicon: HALOT
  rationale: 지시문은 한국어에서 ‘그 우물’로 자연스럽게 살렸고, יחס절의 핵심은 ‘모세에게 말씀하신’으로 직접 연결했습니다. '야훼'는 본문의 יְהוָה를 이름으로 유지한 렌더링입니다.
- source_word: אֱסֹף אֶת הָעָם
  english_pob_choice: Gather the people
  chosen_korean: 백성을 모으십시오
  alternatives_korean:
  - 그 백성을 모으십시오
  - 사람들을 모으십시오
  lexicon: HALOT
  rationale: 명령형을 공손한 직접화법으로 옮기되, 공동체 전체를 가리키는 עָם의 뉘앙스를 반영해 ‘백성’으로 렌더링했습니다.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  english_pob_choice: and I will give them water
  chosen_korean: 그러면 내가 그들에게 물을 주겠습니다
  alternatives_korean:
  - 그리고 내가 그들에게 물을 주겠습니다
  - 내가 그들에게 물을 주리라
  lexicon: HALOT
  rationale: cohortative의 결과/의도 뉘앙스를 한국어에서 ‘그러면’으로 자연스럽게 드러냈고, 약속의 톤은 ‘주겠습니다’로 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적/계시적 고유명을 제목어가 아닌 이름으로 보존해, POB의 원문 직결 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
