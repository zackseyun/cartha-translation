  terminology: ‘지도자들’, ‘백성의 귀족들’, ‘통치자의 지팡이’, ‘마다나’를 사용합니다. ‘통치자의 지팡이’는 선택한 문맥적 해석이며, ‘입법자에 의해’라는 인물 해석을 각주에서 보존합니다.
