  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
  footnotes:
  - marker: a
    text: Or 'with the lawgiver,' if מְחֹקֵק is taken as a person rather than the ruler’s staff/scepter.
    reason: alternative_reading
  - marker: b
    text: Hebrew simply 'and from the wilderness Mattanah'; the sense is likely an itinerary transition, 'and from the wilderness to Mattanah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 우물은 지도자들이 팠고, 백성의 귀족들이 통치자의 지팡이[a]와 그들의 지팡이로 파낸 것입니다. 그들은 광야에서 마다나로 갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘입법자에 의해’. 히브리어 메호케크는 통치자 또는 입법자를 가리킬 수도 있으나, 뒤의 ‘그들의 지팡이’와의 병행 때문에 여기서는 통치자의 지팡이로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그리고 광야에서 마다나’입니다. 문맥상 여정의 다음 단계로 이해하여 ‘그들은 … 갔습니다’를 보충했습니다.
    reason: lexical_alternative
