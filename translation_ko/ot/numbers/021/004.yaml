translation:
  language: ko
  text: 그들은 호르 산을 떠나 홍해 길을 따라[a] 에돔 땅을 돌아가려고 하였습니다. 백성은 길에서 조급해졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘갈대 바다 길을 따라’. 히브리어: yam suph.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성이 길에서 낙심했습니다’ 또는 ‘길에서 기운을 잃었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: they set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 나아갔습니다
  lexicon: HALOT
  rationale: נסע는 광야 여정 공식에서 ‘진행하다’보다 ‘이동을 시작하다, 떠나다’의 의미가 강하므로, 현대 한국어에서는 간결한 ‘떠나’가 가장 자연스럽습니다.
- source_word: דֶּרֶךְ יַם סוּף
  english_pob_choice: by the way of the Red Sea
  chosen_korean: 홍해의 길을 따라
  alternatives_korean:
  - 붉은 바다의 길을 따라
  - 갈대 바다의 길을 따라
  - 홍해 쪽 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ은 단순한 ‘길/노선’이므로 이를 살렸고, יַם סוּף은 전통적 지명인 ‘홍해’를 본문에 유지하되, 직역 가능성은 영어 주석으로 충분히 추적됩니다.
- source_word: לִסְבֹב אֶת אֶרֶץ אֱדוֹם
  english_pob_choice: to go around the land of Edom
  chosen_korean: 에돔 땅을 돌아가려고
  alternatives_korean:
  - 에돔 땅을 우회하려고
  - 에돔 땅을 빙 돌아가려고
  - 에돔 땅을 피해 돌아가려고
  lexicon: HALOT
  rationale: לִסְבֹב은 목적 부정사로서 ‘우회하다, 돌아가다’의 뜻이므로, 목적을 드러내는 ‘-려고’ 구조로 옮기되 지명과 동작을 직선적으로 연결했습니다.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם בַּדָּרֶךְ
  english_pob_choice: the people became impatient on the way
  chosen_korean: 백성은 그 길에서 조급해졌습니다
  alternatives_korean:
  - 백성은 그 길에서 낙심했습니다
  - 백성은 그 길에서 기운이 빠졌습니다
  - 백성은 그 길에서 마음이 짧아졌습니다
  lexicon: HALOT
  rationale: קצר נפש은 ‘조급해지다/낙심하다/마음이 짧아지다’의 폭이 있으나, 문맥상 광야 여정의 압박 아래 생긴 내적 조급함이 핵심이어서 ‘조급해졌습니다’가 가장 압축적으로 그 의미를 전달합니다.
theological_decisions:
- issue: 여정 서술에서 감정 상태의 번역 범위
  chosen_reading: ‘조급해졌습니다’로 번역해 원문의 정서적 압박을 유지했습니다.
  alternative_readings:
  - ‘낙심했습니다’
  - ‘마음이 꺾였습니다’
  rationale: 본문은 단순한 불평이 아니라 길 위에서의 내적 한계와 초조함을 묘사하므로, 지나치게 약화시키지 않으면서도 현대 독자가 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 광야 서술의 인내/불신 맥락(민수기 여정 본문 전반)
