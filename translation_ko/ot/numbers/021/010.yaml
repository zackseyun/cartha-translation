translation:
  language: ko
  text: 그때 이스라엘 자손이 떠나 오봇에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 자손들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 여정을 이어
  lexicon: HALOT
  rationale: 광야 여정 문맥에서 ‘캠프를 풀고 다음 곳으로 이동하다’는 뜻을 자연스럽게 살리기 위해 ‘떠나’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘이스라엘의 아들들’이지만, 한국어 성경에서 이 집단명은 ‘이스라엘 자손’이 가장 투명하게 대응합니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 진을 쳤습니다
  - 장막을 쳤습니다
  lexicon: HALOT
  rationale: 광야 이동 공식에서 חנה는 단순 야영보다 ‘진을 치다’가 군집적·서사적 의미를 더 정확히 드러냅니다.
- source_word: בְּאֹבֹת
  english_pob_choice: at Oboth
  chosen_korean: 오봇에
  alternatives_korean:
  - 오봇에서
  - 오봇에
  lexicon: HALOT
  rationale: 지명은 음역하고, 장소 부사구는 한국어에서 자연스러운 ‘-에’로 처리했습니다.
theological_decisions:
- issue: 광야 여정 공식의 서술 톤
  chosen_reading: 기록체에 맞게 단순한 이동과 주둔을 건조하게 진술했습니다.
  alternative_readings:
  - 조금 더 서술적으로 풀어 쓰는 방식
  - ‘여행하다/행군하다’로 해석을 강조하는 방식
  rationale: 이 절은 신학적 해석보다 이스라엘의 이동 기록 자체를 전하는 문장이라, 원문의 간결한 연쇄를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 민수기 광야 여정 기록의 서술적 성격
