  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
  footnotes:
  - marker: a
    text: Or 'to meet them'; the Hebrew expression can be neutral in itself, but here the following phrase 'for battle' shows a hostile encounter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 방향을 돌려 바산의 길로 올라갔습니다. 그러자 바산 왕 옥이 그의 모든 백성과 함께 에드레이에서 전투하려고 그들을 만나러[a] 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 그 자체로는 ‘만나다’라는 중립적 의미일 수 있으나, 여기서는 뒤따르는 ‘전투하려고’라는 말이 적대적인 만남임을 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  english_pob_choice: they turned
  chosen_korean: 방향을 돌려
  alternatives_korean:
  - 돌아서
  - 전환하여
  - 방향을 바꾸고
  lexicon: HALOT
  rationale: הלך 동사의 연속 서술에서 פנה는 이동 방향의 전환을 가리키므로, 자연스러운 현대 한국어로 ‘방향을 돌려’가 가장 직접적입니다.
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올랐습니다
  - 올라갔습니다
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살려 지형적·경로적 상승을 표현했습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them / against them
  chosen_korean: 그들과 맞서 나왔는데
  alternatives_korean:
  - 그들을 만나려고
  - 그들과 마주하려고
  - 그들 앞에 나왔는데
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들을 맞으러’이지만, 뒤의 ‘전투’가 적대적 만남임을 분명히 하므로 전투 맥락을 살린 ‘맞서 나왔는데’로 옮겼습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 전투를 벌이려고
  alternatives_korean:
  - 전쟁하러
  - 싸우려고
  - 전투를 위해
  lexicon: HALOT
  rationale: 목적을 나타내는 לַ를 살리되, 현대어에서 자연스러운 ‘전투를 벌이려고’로 옮겨 의도된 공격성을 분명하게 했습니다.
theological_decisions:
- issue: 적대적 만남의 표현
  chosen_reading: ‘그들과 맞서 나왔는데’와 ‘전투를 벌이려고’로 לִקְרָאתָם의 중립성을 문맥상 적대성으로 풀었습니다.
  alternative_readings:
  - ‘그들을 만나려고’
  - ‘그들과 마주하려고’
  rationale: 히브리어 표현 자체는 중립적일 수 있지만, 바로 뒤의 목적절이 전투임을 밝히므로 독자가 전투 상황으로 이해하도록 문맥을 우선했습니다.
  doctrine_reference: 서사 문맥의 의미 우선 원칙
- issue: 지명·고유명사 음역
  chosen_reading: ‘바산’, ‘옥’, ‘에드레이’를 표준 음역으로 유지했습니다.
  alternative_readings:
  - 바산 땅
  - 오그
  - 에드라에
  rationale: 이 절은 지명과 인명 자체가 서사의 핵심 표지이므로, 익숙한 교회식 풀어쓰기를 피하고 고유명사를 보존했습니다.
  doctrine_reference: 본문 충실성과 고유명사 보존
