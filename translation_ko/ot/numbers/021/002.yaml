  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
  footnotes:
  - marker: a
    text: 'Or, “If you will surely give this people into my hand.” The Hebrew intensifies the verb: “giving, you give.”'
    reason: lexical_alternative
  - marker: b
    text: Or, “put their cities under the ban.” The Hebrew refers to devoting something irrevocably to destruction as an act of ḥerem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘이 야훼께 서원을 하고 말했습니다. “야훼께서 이 백성을 반드시[a] 제 손에 넘겨주신다면, 그들의 성읍들을 멸망에 바치겠습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “야훼께서 이 백성을 제 손에 반드시 넘겨주신다면.” 히브리어는 부정사 절대형과 유한동사를 결합하여 ‘넘겨주다’를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “그들의 성읍들을 헤렘으로 바치겠습니다.” 히브리어는 어떤 것을 돌이킬 수 없도록 멸망에 바치는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  english_pob_choice: made a vow
  chosen_korean: 서원을 하다
  alternatives_korean:
  - 맹세를 하다
