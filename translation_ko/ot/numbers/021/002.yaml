  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
  footnotes:
  - marker: a
    text: 'Or, “If you will surely give this people into my hand.” The Hebrew intensifies the verb: “giving, you give.”'
    reason: lexical_alternative
  - marker: b
    text: Or, “put their cities under the ban.” The Hebrew refers to devoting something irrevocably to destruction as an act of ḥerem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘이 야훼께 서원을 하고 말했습니다. “당신께서 이 백성을 반드시 내 손에 넘겨주신다면, 그들의 도시들을 멸망에 바치겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신께서 이 백성을 내 손에 반드시 넘겨주신다면.” 히브리어는 ‘주고, 주다’의 반복으로 동사를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “그들의 도시들을 헤렘 아래 두다.” 히브리어는 무언가를 돌이킬 수 없이 멸망에 바치는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  english_pob_choice: made a vow
  chosen_korean: 서원을 하다
  alternatives_korean:
  - 맹세를 하다
  - 서약을 하다
  lexicon: HALOT
  rationale: 히브리어의 관용적 결합인 ‘서원을 하다’를 자연스럽게 살리되, 단순한 약속보다 엄숙한 종교적 맥락을 분명히 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 יהוה를 ‘야훼’로 옮겨 원문 고유명을 직접 보존했습니다.
- source_word: נָתֹן תִּתֵּן
  english_pob_choice: If you indeed give
  chosen_korean: 당신께서 반드시 넘겨주신다면
  alternatives_korean:
  - 당신께서 정말 주신다면
  - 당신께서 꼭 넘겨주신다면
  lexicon: HALOT
  rationale: 부정사 절대형과 동사 결합의 강조를 ‘반드시’로 반영해, 단순 조건이 아니라 강한 확신과 요청을 나타내게 했습니다.
- source_word: בְּיָדִי
  english_pob_choice: into my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 권세 아래
  - 내 통제 아래
  lexicon: HALOT
  rationale: 성서적 관용구를 그대로 살려 ‘손’ 이미지를 유지했고, ‘넘겨주다’와 결합해 실제 지배권을 뜻하는 표현임을 드러냈습니다.
- source_word: וְהַחֲרַמְתִּי
  english_pob_choice: devote their cities to destruction
  chosen_korean: 멸망에 바치겠습니다
  alternatives_korean:
  - 진멸하겠습니다
  - 멸절에 바치겠습니다
  - 바쳐 멸망시키겠습니다
  lexicon: HALOT
  rationale: חרם의 제의적·전쟁적 성격을 함께 살리기 위해 ‘멸망에 바치다’를 택해, 단순 파괴보다 ‘바침’의 개념을 보존했습니다.
theological_decisions:
- issue: חרם(헤렘) 서원의 번역 방식
  chosen_reading: 멸망에 바치겠습니다
  alternative_readings:
  - 진멸하겠습니다
  - 저주 아래 두겠습니다
  - 멸망시키겠습니다
  rationale: 본문은 전쟁의 결과를 단순한 살육이 아니라, 정복 대상 도시를 야훼께 돌려놓는 서원-헤렘 행위로 제시합니다. ‘멸망에 바치다’는 그 제의적 긴장을 유지하면서도 과도한 해설을 덧붙이지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
