  lexicon: HALOT
  rationale: 히브리어의 관용적 결합인 ‘서원을 하다’를 자연스럽게 살리되, 단순한 약속보다 엄숙한 종교적 맥락을 분명히 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 יהוה를 ‘야훼’로 옮겨 원문 고유명을 직접 보존했습니다.
- source_word: נָתֹן תִּתֵּן
  english_pob_choice: If you indeed give
  chosen_korean: 당신께서 반드시 넘겨주신다면
  alternatives_korean:
  - 당신께서 정말 주신다면
  - 당신께서 꼭 넘겨주신다면
  lexicon: HALOT
  rationale: 부정사 절대형과 동사 결합의 강조를 ‘반드시’로 반영해, 단순 조건이 아니라 강한 확신과 요청을 나타내게 했습니다.
- source_word: בְּיָדִי
  english_pob_choice: into my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 권세 아래
  - 내 통제 아래
  lexicon: HALOT
  rationale: 성서적 관용구를 그대로 살려 ‘손’ 이미지를 유지했고, ‘넘겨주다’와 결합해 실제 지배권을 뜻하는 표현임을 드러냈습니다.
- source_word: וְהַחֲרַמְתִּי
  english_pob_choice: devote their cities to destruction
  chosen_korean: 멸망에 바치겠습니다
  alternatives_korean:
  - 진멸하겠습니다
  - 멸절에 바치겠습니다
  - 바쳐 멸망시키겠습니다
  lexicon: HALOT
  rationale: חרם의 제의적·전쟁적 성격을 함께 살리기 위해 ‘멸망에 바치다’를 택해, 단순 파괴보다 ‘바침’의 개념을 보존했습니다.
theological_decisions:
- issue: חרם(헤렘) 서원의 번역 방식
  chosen_reading: 멸망에 바치겠습니다
  alternative_readings:
  - 진멸하겠습니다
  - 저주 아래 두겠습니다
  - 멸망시키겠습니다
  rationale: 본문은 전쟁의 결과를 단순한 살육이 아니라, 정복 대상 도시를 야훼께 돌려놓는 서원-헤렘 행위로 제시합니다. ‘멸망에 바치다’는 그 제의적 긴장을 유지하면서도 과도한 해설을 덧붙이지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
