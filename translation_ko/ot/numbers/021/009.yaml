  rationale: 본문은 히브리어의 서술 순서와 조건 관계를 유지하면서, 현대 표준 한국어에 맞추어 ‘청동 뱀’과 ‘장대’를 사용했습니다. ‘어떤 사람’과 ‘그가’를 통해 אִישׁ의 단수 대표 용법 및 뒤따르는 단수 동사를 보존했습니다. 각주는 금속과 장대의 어휘적 대안을 각각 한 번씩만 제시하고, 후대 본문과의 연결은 본문 의미를 확장하지 않는 상호참조로 정리했습니다.
