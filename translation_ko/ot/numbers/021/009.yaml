id: NUM.21.9
reference: Numbers 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
  footnotes:
  - marker: a
    text: Or 'copper serpent.' The Hebrew term for the metal can refer to copper or bronze.
    reason: lexical_alternative
  - marker: b
    text: Or 'standard' or 'banner' for 'pole.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a man,' used here in a representative sense for any bitten person.
    reason: lexical_alternative
  - marker: d
    text: This event is later echoed typologically in John 3:14–15.
    reason: cross_reference
translation:
  language: ko
  text: 모세는 놋뱀을 만들어 기둥 위에 달아 놓았습니다[a]. 그리고 뱀에게 물린 사람이 그 놋뱀을 바라보면 살아났습니다[c][b][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘표준’이나 ‘깃발’로도 옮길 수 있습니다. כאן의 הַנֵּס는 이 문맥에서 뱀을 매단 세운 구조물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기둥’은 문맥상 뱀을 올려 둔 세운 막대/장대를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘사람’은 여기서 물린 누구나를 가리키는 대표적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 이 사건은 후에 요한복음 3:14–15에서 예표적으로 메아리칩니다.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ / נְחֹשֶׁת
  english_pob_choice: serpent / bronze
  chosen_korean: 놋뱀
  alternatives_korean:
  - 구리뱀
  - 청동뱀
  lexicon: HALOT
  rationale: 히브리어의 말장난과 재료 묘사를 함께 살리기 위해 한국어 성경에서 익숙한 ‘놋뱀’을 사용했습니다. ‘놋’은 전통적이지만 본문 의미를 잘 전달하고, 재료의 금속성도 유지합니다.
- source_word: הַנֵּס
  english_pob_choice: the pole
  chosen_korean: 기둥 위에 달아 놓았습니다
  alternatives_korean:
  - 장대에 달아 놓았습니다
  - 깃발대에 달아 놓았습니다
  lexicon: HALOT
  rationale: 이 문맥에서 הַנֵּס는 상징적 ‘깃발’보다 뱀을 매다는 세워진 구조물을 가리키므로, 자연스럽고 구체적인 ‘기둥 위에 달아 놓다’로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 어떤 사람이
  lexicon: HALOT
  rationale: 히브리어 단수형을 한국어에서는 대표적·일반적 의미로 자연스럽게 풀어 ‘사람이’로 옮겼습니다. 성별을 과도하게 드러내지 않으면서도 본문의 보편적 뜻을 유지합니다.
- source_word: וְהִבִּיט אֶל
  english_pob_choice: and he looked at
  chosen_korean: 바라보면
  alternatives_korean:
  - 쳐다보면
  - 올려다보면
  lexicon: HALOT
  rationale: 단순한 시선의 방향을 가리키는 동사를 문맥에 맞게 자연스럽게 옮겼습니다. ‘바라보다’가 본문의 직접적인 응시 행위를 가장 무리 없이 전달합니다.
theological_decisions:
- issue: 치유 결과를 나타내는 서술 방식
  chosen_reading: 살아났습니다
  alternative_readings:
  - 살았습니다
  - 살게 되었습니다
  rationale: 히브리어 וָחָי의 결과를 서술하는 간명한 과거 표현으로 옮겨, 본문이 말하는 실제 생명 회복을 분명하게 전달했습니다. 미래적 가능성보다 사건의 결과성을 살렸습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 3
- issue: 후속 본문과의 예표적 연결을 본문에 암시할지 여부
  chosen_reading: 본문에는 직접 암시를 두지 않음
  alternative_readings:
  - ‘올려다보면’처럼 신학적 뉘앙스를 강화하는 번역
  rationale: 요한복음 3:14–15의 후대적 연결은 중요하지만, 여기서는 민수기 본문의 직접 의미를 보존하는 것이 우선입니다. 본문 자체에 없는 예표 의미를 번역어로 앞당겨 넣지 않았습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 3
