  naturalness: ‘청동 뱀’과 ‘장대에 달아 놓았습니다’가 현대 합쇼체 문장으로 더 자연스럽고 명료합니다. 기존 각주의 히브리어 ‘כאן’은 한국어 각주에 부적절하며, a와 b 각주는 같은 내용을 중복합니다.
  terminology: נְחֹשֶׁת는 본문에서 ‘청동’으로 옮기고 ‘구리’ 가능성은 각주로 보존합니다. הַנֵּס는 ‘장대’로 옮기되 ‘표준/깃발’의 어휘적 가능성을 각주에서 제시합니다. 요한복음 연결은 본문에 넣지 않고, 교파적 함의가 없는 상호참조 각주로 제한합니다.
