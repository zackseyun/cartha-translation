id: NUM.21.20
reference: Numbers 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
  footnotes:
  - marker: a
    text: Or 'the Jeshimon,' treating the Hebrew term as a regional name rather than a descriptive common noun.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the face of the wasteland,' an idiom meaning the area facing or overlooking the wasteland.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 바못에서 모압 들에 있는 골짜기, 곧 황무지를 내려다보는 피스가 산꼭대기까지 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바못’은 일반 명사로는 ‘높은 곳들’을 뜻할 수 있으나, 여기서는 이동 경로에 나오는 지명으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘황무지의 פני’(עַל־פְּנֵי הַיְשִׁימֹן)는 문자적으로는 ‘황무지의 표면 위로’를 뜻하며, 여기서는 황무지 쪽을 마주하거나 내려다본다는 지리적 표현입니다. ‘예시몬’이라는 지역명으로 이해할 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  english_pob_choice: and from Bamoth
  chosen_korean: 그리고 바못에서
  alternatives_korean:
  - 그리고 바모트에서
  - 그리고 높은 곳에서
  lexicon: HALOT
  rationale: בָּמוֹת은 여기서 지명으로 기능하므로 일반명사인 ‘높은 곳들’로 풀지 않고 음역했습니다. 앞의 접속사와 전치사는 자연스럽게 ‘그리고 …에서’로 옮겼습니다.
- source_word: הַגַּיְא
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 협곡
  lexicon: HALOT
  rationale: גַּיְא는 지형상 골짜기나 계곡을 뜻하므로, 이 구간의 지리적 흐름에 맞는 ‘골짜기’를 택했습니다.
- source_word: בִּשְׂדֵה מוֹאָב
  english_pob_choice: in the field of Moab
  chosen_korean: 모압의 들에 있는
  alternatives_korean:
  - 모압의 땅에 있는
  - 모압 평원에 있는
  lexicon: HALOT
  rationale: שָׂדֶה는 문자적으로 ‘들, 밭’이지만 지리 맥락에서는 열린 평지나 지역을 가리킬 수 있습니다. 히브리어의 이미지를 살리면서도 한국어로 자연스럽게 ‘모압의 들에 있는’으로 옮겼습니다.
- source_word: רֹאשׁ הַפִּסְגָּה
  english_pob_choice: to the top of Pisgah
  chosen_korean: 피스가의 꼭대기까지
  alternatives_korean:
  - 피스가의 정상까지
  - 피스가의 머리까지
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리’이지만 산지 표현에서는 ‘꼭대기/정상’이 자연스럽습니다. פִּסְגָּה는 고유명사로 음역했습니다.
- source_word: וְנִשְׁקָפָה עַל פְּנֵי הַיְשִׁימֹן
  english_pob_choice: which overlooks the face of the wasteland
  chosen_korean: 그곳은 황무지를 내려다보는 곳입니다
  alternatives_korean:
  - 그곳은 황무지의 פני를 마주하는 곳입니다
  - 그곳은 황무지 맞은편을 내려다보는 곳입니다
  lexicon: HALOT
  rationale: נִשְׁקָפָה는 ‘내려다보다/바라보다’의 의미를 지니며, עַל פְּנֵי는 직역하면 ‘~의 פני 위에’지만 관용적으로 ‘마주하여, 내려다보아’의 뜻을 가집니다. 한국어에서는 이 관용을 풀어 ‘황무지를 내려다보는 곳’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 지명으로서의 바못과 피스가를 어떻게 처리할 것인가
  chosen_reading: 지형 일반명사로 풀지 않고 지명으로 음역했습니다.
  alternative_readings:
  - ‘높은 곳들’로 번역
  - ‘언덕’으로 의역
  rationale: 이 절은 이동 경로를 기록하는 목록이므로, מקור의 지명성을 보존하는 것이 본문의 역사·지리적 정보 전달에 더 충실합니다.
  doctrine_reference: 본문의 지리·서술적 정확성 보존
