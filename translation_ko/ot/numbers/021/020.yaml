  rationale: 피스가 산꼭대기가 황무지를 내려다본다는 원문의 문법적 연결을 수식절로 명확히 하고, 불필요한 ‘그곳은 … 곳입니다’ 표현을 제거했습니다. 이동 경로의 문맥에 맞추어 한국어 서술을 과거형으로 정리했으며, 각주 b의 원어 표기와 설명을 바로잡았습니다.
