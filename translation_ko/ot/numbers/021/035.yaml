id: NUM.21.35
reference: Numbers 21:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
  footnotes:
  - marker: a
    text: Or, 'until no survivor was left to him.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they possessed his land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들이 그와 그의 아들들과 그의 모든 백성을 쳐 죽여서, 그에게 남은 생존자가 없게 될 때까지 했고[a], 그의 땅을 차지했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 남겨진 생존자가 없을 때까지’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 땅을 소유했습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: struck ... down
  chosen_korean: 쳐 죽여서
  alternatives_korean:
  - 쳤습니다
  - 무찔렀습니다
  - 쳐서 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 군사적 문맥에서 단순한 ‘치다’보다 실제로 치명적 타격을 포함하는 뜻이므로, 결과를 드러내되 과잉 일반화하지 않도록 ‘쳐 죽여서’로 옮겼습니다.
- source_word: בָּנָיו / כָּל עַמּוֹ
  english_pob_choice: his sons / all his people
  chosen_korean: 그의 아들들과 그의 모든 백성
  alternatives_korean:
  - 그의 자녀들과 그의 모든 사람들
  - 그의 아들들과 그의 모든 백성들
  lexicon: HALOT
  rationale: בנים은 남성 복수형이므로 ‘아들들’로 유지했고, עם은 군대만이 아니라 그 아래에 속한 전체 백성을 가리키므로 ‘모든 백성’이 가장 넓고 충실합니다.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  english_pob_choice: until he had no survivor left
  chosen_korean: 그에게 남은 생존자가 없게 될 때까지
  alternatives_korean:
  - 그에게 아무 생존자도 남지 않을 때까지
  - 그에게 남은 자가 없게 될 때까지
  lexicon: HALOT
  rationale: 히브리어의 직역감(‘그에게 남기지 않다’)을 유지하면서도 한국어로는 자연스럽게 ‘남은 생존자’로 풀어, 전멸의 의미를 분명히 했습니다.
- source_word: וַיִּירְשׁוּ אֶת אַרְצֽוֹ
  english_pob_choice: took possession of his land
  chosen_korean: 그의 땅을 차지했습니다
  alternatives_korean:
  - 그의 땅을 소유했습니다
  - 그의 땅을 점유했습니다
  - 그의 땅을 상속받았습니다
  lexicon: HALOT
  rationale: ירשׁ는 여기서 평화적 상속이 아니라 정복 후 점유를 뜻하므로, 전투 결과를 자연스럽게 드러내는 ‘차지하다’가 적절합니다.
theological_decisions:
- issue: 정복 서술의 강도 표현
  chosen_reading: ‘쳐 죽여서’와 ‘남은 생존자가 없게 될 때까지’로 전멸성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘무찔러서’
  - ‘패배시켜서’
  rationale: 본문은 단순한 패배가 아니라 대상과 그 공동체의 전멸을 말하므로, 완화된 표현보다 결과가 분명한 번역이 필요합니다.
  doctrine_reference: 본문의 역사서술적 전쟁 진술
