revisions:
- from: 그때 야훼께서 모세에게 말씀하셨습니다. “너를 위해 불뱀 하나를 만들고 그것을 기둥에 매달아 두어라. 그러면 물린 사람마다 그것을 보면 살 것이다.”[a][b]
  to: 그때 야훼께서 모세에게 말씀하셨습니다. “너를 위하여 불뱀을[a] 만들어 그것을 장대[b] 위에 세워라. 그러면 물린 사람은 누구나 그것을 바라보면 살 것이다.”
  rationale: ‘매달아 두다’를 원문의 비특정적 동작인 ‘위에 세우다’로 고쳐, 설치 방식을 덧붙이지 않았습니다. 또한 각주 표지를 해당 어휘에 직접 연결하고, שָׂרָף에 대한 각주를 문맥적 번역이라는 점에 맞게 바로잡았습니다. ‘장대’는 נֵס의 물리적 기능을 드러내면서도 각주에서 표지·신호의 의미 가능성을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:38:51Z'
review_pass:
  verdict: revise
  source_fidelity: ‘불뱀’과 ‘보면 살 것이다’는 שָׂרָף 및 조건-결과 구문을 대체로 충실히 반영합니다. 그러나 שִׂים אֹתוֹ עַל־נֵס는 뱀을 장대/표지 위에 ‘두다, 세우다’라는 뜻이지 ‘매달아 두다’라고 명시하지 않습니다. 또한 לְךָ는 ‘너를 위해’보다 ‘네가 직접/너를 위하여’의 명령 뉘앙스로 자연스럽게 처리하는 편이 좋습니다.
  naturalness: 현대 표준 한국어로 대체로 자연스럽지만, ‘너를 위해 불뱀 하나를 만들고’는 직접 명령에서 다소 어색합니다. ‘너를 위하여 불뱀을 만들어’와 ‘장대 위에 세워라’가 더 자연스럽고 원문의 행위를 과도하게 구체화하지 않습니다.
  terminology: ‘야훼’, ‘모세’, ‘불뱀’은 일관되고 적절합니다. נֵס는 이 문맥에서 물리적 받침을 가리키므로 ‘장대’가 적절하되, 표지·신호의 의미 가능성은 각주에 남겨 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘기둥에 매달아 두어라’가 שִׂים אֹתוֹ עַל־נֵס를 과도하게 특정합니다.
