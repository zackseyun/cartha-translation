id: NUM.21.8
reference: Numbers 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
  footnotes:
  - marker: a
    text: Or 'seraph'; the Hebrew term can mean 'burning one' and in this context refers to the deadly serpent.
    reason: lexical_alternative
  - marker: b
    text: Or 'standard' or 'signal pole.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “너를 위하여 불뱀을[a] 만들어 그것을 장대[b] 위에 세워라. 그러면 물린 사람은 누구나 그것을 바라보면 살 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘불타는 것’ 또는 ‘타는 것’을 뜻할 수 있습니다. 이 문맥에서는 치명적인 뱀을 가리킵니다. 또는 ‘세라프’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘표지’, ‘깃발’, ‘신호 장대’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 프로젝트 기본 용례
  rationale: 원문 고유명사 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 본문이 지시하는 하나님의 이름을 보존했습니다.
- source_word: שָׂרָף
  english_pob_choice: fiery serpent
  chosen_korean: 불뱀
  alternatives_korean:
  - 불타는 뱀
  - 세라프
  lexicon: HALOT
  rationale: 문맥상 독을 품은 뱀 재앙과 연결되는 ‘불뱀’이 가장 자연스럽고, 천상 존재 ‘세라프’로 오해되지 않게 합니다.
- source_word: נֵס
  english_pob_choice: pole
  chosen_korean: 기둥
  alternatives_korean:
  - 깃발대
  - 표지 기둥
  - 장대
  lexicon: HALOT
  rationale: 표준이나 신호기보다, 이 절에서 뱀을 실제로 매다는 대상이라는 점을 살려 물리적 기능이 드러나는 ‘기둥’으로 옮겼습니다.
- source_word: וְרָאָה אֹתֹו
  english_pob_choice: when he looks at it
  chosen_korean: 그것을 보면
  alternatives_korean:
  - 그것을 바라보면
  - 그것을 쳐다보면
  lexicon: HALOT
  rationale: 히브리어의 조건-결과 구조를 한국어에서 자연스럽게 풀어, 단순한 시각 인지가 아니라 치유 조건으로서의 ‘보다’의 의미를 살렸습니다.
theological_decisions:
- issue: 불뱀의 이미지와 치유의 조건
  chosen_reading: 모세가 만든 뱀 형상을 ‘기둥’에 두고, 물린 사람이 그것을 ‘보면’ 살게 된다는 직접적 명령으로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 덧붙인 번역
  - ‘쳐다보다’로 치유의 의식성을 강화한 번역
  rationale: 본문은 상징을 해설하기보다 야훼의 명령과 그에 따른 생명의 결과를 서술하므로, 해석을 과도하게 덧붙이지 않고 원문 구조를 따라갔습니다.
  doctrine_reference: 민수기 21:8의 서사적 치유 표지
- issue: נֵס의 의미
  chosen_reading: 문맥상 ‘기둥’으로 번역하되, 깃발/표지의 뉘앙스는 본문 밖에서 유지하도록 했습니다.
  alternative_readings:
  - 표지
  - 신호기
  - 장대
  rationale: 이 절에서는 העמדה(세우기)된 대상보다 뱀을 올려놓는 받침의 기능이 더 중요하므로, 독자가 즉시 장면을 그릴 수 있는 표현을 택했습니다.
  doctrine_reference: 문맥 우선의 서사 번역 원칙
