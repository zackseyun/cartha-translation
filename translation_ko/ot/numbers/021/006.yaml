id: NUM.21.6
reference: Numbers 21:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
  footnotes:
  - marker: a
    text: Or 'venomous snakes' or 'burning serpents.' The Hebrew literally reads 'the serpents, the fiery ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 백성 가운데에 불뱀들을 보내시니, 그것들이 백성을 물었고 이스라엘에서 많은 사람이 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 불같은 뱀들’입니다. 영어 POB는 이를 ‘fiery serpents’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 신격 호칭으로 바꾸지 않고 고유명사로 살리기 위해 ‘야훼’를 사용했습니다.
- source_word: בָּעָם
  english_pob_choice: among the people
  chosen_korean: 백성 가운데에
  alternatives_korean:
  - 백성에게
  - 백성 속에
  lexicon: HALOT
  rationale: 전치사 ב와 ‘백성’의 결합은 위치적 의미가 두드러지므로, 사건이 일어난 범위를 자연스럽게 드러내는 ‘가운데에’로 옮겼습니다.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  english_pob_choice: the fiery serpents
  chosen_korean: 불뱀들
  alternatives_korean:
  - 불타는 뱀들
  - 불뱀
  lexicon: HALOT
  rationale: ‘뱀’의 기본 의미를 유지하면서 שׂרפים의 불의 이미지를 압축적으로 살렸습니다. 다만 문맥의 이미지 손실을 막기 위해 복수형을 유지했습니다.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  english_pob_choice: many from Israel
  chosen_korean: 이스라엘에서 많은 사람
  alternatives_korean:
  - 이스라엘 백성 가운데 많은 사람
  - 이스라엘에서 많은 이들
  lexicon: HALOT
  rationale: 히브리어의 ‘많은 백성/무리’와 מן의 출처 의미를 함께 살리기 위해 ‘이스라엘에서 많은 사람’으로 옮겼습니다.
theological_decisions:
- issue: 재앙의 주체를 나타내는 야훼의 행위 서술
  chosen_reading: ‘야훼께서 … 보내시니’로 직접적 행위를 유지했습니다.
  alternative_readings:
  - ‘주님께서 … 허락하시니’
  - ‘야훼께서 … 내리시니’
  rationale: 본문은 재앙의 발생을 우회적으로 완화하지 않고 야훼의 주권적 행위로 서술합니다. 따라서 해석적 완화 표현보다 직접적 동사를 유지하는 것이 본문 긴장에 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
