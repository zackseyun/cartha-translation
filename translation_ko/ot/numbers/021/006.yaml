  terminology: ‘야훼’는 신명을 보존하며 적절합니다. ‘불뱀’은 שְׂרָפִים의 전통적이고 간결한 번역으로 유지할 수 있으나, 그 의미가 ‘불타는/불을 일으키는’ 이미지인지 독성과 관련된 것인지는 논의가 있으므로 각주에서 이를 보완해야 합니다.
