  source_fidelity: 히브리어 וַיֵּשֶׁב은 문맥상 ‘살다/거주하다’이며, ‘살았습니다’는 이를 정확하고 자연스럽게 옮깁니다. בְּאֶרֶץ הָאֱמֹרִי는 아모리 집단의 영토를 가리키며, ‘아모리 사람들의 땅에’는 집합적 민족명을 자연스러운 한국어로 잘 반영합니다.
  naturalness: ‘그리하여 이스라엘은 아모리 사람들의 땅에 살았습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽습니다. 문맥상 결과를 잇는 ‘그리하여’도 영어 POB의 ‘So’ 및 히브리어 서사 연결에 부합합니다.
  terminology: ‘이스라엘’은 고유명사 표기가 적절하며, ‘아모리 사람들’은 הָאֱמֹרִי의 집합적 민족 지시를 명확하게 전달합니다. 신학적으로 해석을 덧붙이는 표현도 없습니다.
