lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 살아 있었습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: ישׁב는 ‘앉다, 거주하다, 살다’의 뜻을 가지며, 여기서는 서술 요약문이므로 현대 한국어에서 자연스러운 ‘살았습니다’가 POB의 ‘lived’를 잘 반영합니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 야곱 자손
  lexicon: 고유명사 표기
  rationale: 언약 공동체의 이름이므로 음역형 고유명사 ‘이스라엘’을 유지하는 것이 원문과 POB의 처리를 가장 잘 따릅니다.
- source_word: בְּאֶרֶץ
  english_pob_choice: in the land
  chosen_korean: 땅에
  alternatives_korean:
  - 땅에서
  - 지역에
  - 영토에
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 특정한 정착 공간을 가리키므로, 한국어에서는 ‘땅에’가 가장 간결하고 원문 의미에 충실합니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람들의
  alternatives_korean:
  - 아모리의
  - 아모리 족속의
  lexicon: HALOT
  rationale: 히브리어 형태는 단수형이지만 집단명으로 쓰였으므로, 한국어에서는 자연스러운 집합 표현인 ‘아모리 사람들’로 옮겼습니다.
