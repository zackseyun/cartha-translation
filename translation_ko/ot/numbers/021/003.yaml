    issue: ‘그들이 그들과 그 성읍을 멸망하게 하니’
    rationale: 이 표현은 한국어에서 ‘멸망하게 하다’라는 사역 구문으로 들려 חָרַם의 직접적이고 기술적인 ‘진멸에 바치다’ 의미를 충분히 드러내지 못합니다. 또한 ‘그 성읍’은 소유 관계를 명시한 ‘그들의 성읍’이 더 정확합니다.
  - severity: medium
    issue: ‘그 곳 이름을 호르마라 하였더라’
    rationale: ‘하였더라’는 요청된 현대 합쇼체 서술이 아니라 고전적 성경체입니다. 히브리어의 불특정 단수 주어도 한국어 수동 표현으로 보존할 수 있습니다.
