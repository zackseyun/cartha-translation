translation:
  language: ko
  text: 야훼께서 이스라엘의 부르짖음을 들으시고 가나안 사람들을 그들에게 넘겨 주셨습니다. 그래서 그들은 그들과 그들의 성읍을 진멸에 바쳤습니다. 그리하여 그 곳은 호르마[a]라고 불리게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호르마’는 히브리어로 ‘진멸에 바침’ 또는 ‘파멸에 바쳐짐’을 뜻하는 말과 소리가 비슷합니다.
    reason: 지명 호르마(חָרְמָה)와 본문의 동사 ‘진멸에 바치다’(חרם) 사이의 어원적 말놀이를 보존합니다.
