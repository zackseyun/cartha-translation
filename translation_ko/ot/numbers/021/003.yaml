  to: 야훼께서 이스라엘의 부르짖음을 들으시고 가나안 사람들을 그들에게 넘겨 주셨습니다. 그래서 그들은 그들과 그들의 성읍을 진멸에 바쳤습니다. 그리하여 그 곳은 호르마[a]라고 불리게 되었습니다.
