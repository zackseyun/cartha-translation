base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
  footnotes:
  - marker: a
    text: The Hebrew of the opening clause is difficult and has been understood in several ways, including 'we overthrew them' or 'their dominion perished.'
    reason: textual_variant
  - marker: b
    text: The clause rendered 'we laid waste' is also uncertain; some take the form differently, but the context favors a verb of devastation in this victory song.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 우리는 그들을 쏘았습니다[a]. 헤스본은 디본까지 멸망하였고, 우리는 노바까지 황폐하게 만들었으며[b], 노바는 메데바까지 이릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 첫 절은 난해하며, ‘우리가 그들을 넘어뜨렸다’나 ‘그들의 세력이 사라졌다’ 등으로도 이해될 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘우리가 황폐하게 만들었다’로 옮긴 동사 형태도 확실하지 않으며, 일부는 이를 다르게 이해합니다. 그러나 이 승전 노래의 문맥에서는 파괴를 뜻하는 동사로 이해하는 것이 가장 자연스럽습니다.
    reason: textual_variant
