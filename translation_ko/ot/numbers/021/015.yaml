  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶ֨שֶׁד֙ הַ/נְּחָלִ֔ים אֲשֶׁ֥ר נָטָ֖ה לְ/שֶׁ֣בֶת עָ֑ר וְ/נִשְׁעַ֖ן לִ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
  footnotes:
  - marker: a
    text: Or 'the valleys' or 'the ravines'; Hebrew נְחָלִים often refers to seasonal streambeds (wadis).
    reason: lexical_alternative
  - marker: b
    text: Or 'to the dwelling/seat of Ar.' The Hebrew phrase is difficult and may refer to the location or settlement of Ar.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 아르의 거처에 미치고 모압의 경계에 닿은 시내들의 경사지.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 נְחָלִים은 종종 계절성 하천 (와디) 을 의미합니다.
    source: WLC Lexicon
  - marker: b
    text: 히브리어 שֶׁבֶת은 '거주' 또는 '자리'를 의미하며, 아르의 위치나 정착지를 가리킬 수 있습니다.
    source: WLC Lexicon
lexical_decisions:
- source_word: נְחָלִים
  english_pob_choice: wadis
  chosen_korean: 시내들
  alternatives_korean: 계곡들, 골짜기들
  lexicon: WLC
  rationale: Hebrew נְחָלִים (nehalim) refers to seasonal streambeds or wadis common in the region, distinct from permanent rivers. '시내' captures the seasonal nature better than '강'.
- source_word: שֶׁבֶת
  english_pob_choice: site of Ar
  chosen_korean: 거처
  alternatives_korean: 자리, 거주지
  lexicon: WLC
  rationale: שֶׁבֶת (shevet) literally means 'sitting' or 'dwelling'. In this context, it refers to the location or settlement of Ar. '거처' conveys the sense of a dwelling place.
- source_word: נָטָה
  english_pob_choice: extends
  chosen_korean: 미치고
  alternatives_korean: 뻗치다, 기울다
  lexicon: WLC
  rationale: נָטָה (natah) implies stretching out or inclining. '미치다' effectively conveys the spatial extension of the wadi's slope.
theological_decisions:
- decision: Geographical Specificity
  rationale: Maintaining the specific reference to 'Ar' and 'Moab' preserves the historical and geographical context of the Israelites' journey, which is central to the narrative of Numbers.
