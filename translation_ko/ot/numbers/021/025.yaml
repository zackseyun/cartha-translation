id: NUM.21.25
reference: Numbers 21:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
  footnotes:
  - marker: a
    text: Literally, 'and in all its daughters,' an idiom for the smaller dependent settlements belonging to a larger city.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 이 모든 성읍을 차지하였고, 이스라엘은 헤스본과 그에 딸린 모든 성읍[a]을 비롯한 아모리 사람들의 모든 성읍에 정착하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘그 딸들’입니다. 이는 큰 성읍에 딸린 더 작은 부속 정착지들을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 차지하였고
  alternatives_korean:
  - 가졌고
  - 취하였고
  - 빼앗았고
  lexicon: HALOT
  rationale: 정복 문맥에서 לקח의 기본 의미인 ‘take’를 살리면서, 한국어에서는 점령·확보의 결과를 자연스럽게 드러내는 ‘차지하다’가 가장 적절합니다.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  english_pob_choice: all these cities
  chosen_korean: 이 모든 성읍들
  alternatives_korean:
  - 이 모든 도시들
  - 이 모든 도시와 성읍들
  lexicon: HALOT
  rationale: עִיר는 성읍/도시 범위를 가지지만, 고대 이스라엘 지리·정복 문맥에서는 ‘성읍’이 더 자연스럽고 문맥상 정확합니다.
- source_word: בְּכָל בְּנֹתֶיהָ
  english_pob_choice: and in all its daughter towns
  chosen_korean: 그 모든 딸 성읍들을 포함하여
  alternatives_korean:
  - 그 모든 딸 성읍들에서
  - 그 모든 딸 마을들을 포함하여
  - 그 모든 종속 성읍들을 포함하여
  lexicon: HALOT
  rationale: ‘딸들’이라는 히브리어 관용구를 한국어로 직역하면 모호하므로, 의존 정착지를 뜻하는 관계를 살려 ‘딸 성읍들’로 옮겼습니다.
theological_decisions:
- issue: 정복 동사의 뉘앙스
  chosen_reading: ‘차지하다’로 번역해 단순 점유가 아니라 정복 결과로서의 소유·통치를 드러냈습니다.
  alternative_readings:
  - ‘가졌다’로 완화
  - ‘빼앗았다’로 강화
  rationale: 히브리어 본문은 전쟁 서사의 결과를 진술하므로, 지나치게 중립적이거나 과도하게 폭력성을 부각하는 번역보다 정복의 성격을 균형 있게 반영하는 표현이 적절합니다.
  doctrine_reference: 서사 본문의 역사적 진술을 과잉 신학화하지 않되, 본문의 정복 현실은 약화하지 않는 번역 원칙
- issue: ‘daughter towns’의 처리
  chosen_reading: ‘딸 성읍들’로 직역적 이미지를 보존하되, 한국어에서는 문맥상 이해되도록 자연스럽게 배치했습니다.
  alternative_readings:
  - ‘부속 마을들’
  - ‘종속 성읍들’
  rationale: 히브리어 관용구의 은유를 지우지 않으면서도 독자가 의존 정착지라는 의미를 파악할 수 있게 하기 위함입니다.
  doctrine_reference: 고대 지리·행정 관용구 보존 원칙
