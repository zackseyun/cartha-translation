id: LEV.18.28
reference: Leviticus 18:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
  footnotes:
  - marker: a
    text: Or 'spew you out' / 'spewed out.' The Hebrew uses a vivid image of the land expelling its inhabitants because of defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그 땅을 더럽힐 때에, 그 땅이 너희 앞에 있던 그 민족을 토해 낸 것처럼 너희를 토해 내지 않도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뱉어 내다’ / ‘뱉어 냈다’. 히브리어는 더러움 때문에 땅이 거주민을 내쫓는 생생한 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  english_pob_choice: vomit ... out / vomited out
  chosen_korean: 토해 내다
  alternatives_korean:
  - 내쫓다
  - 쫓아내다
  - 뱉어 내다
  lexicon: HALOT
  rationale: 히브리어의 생생한 배출 이미지를 살리기 위해 완곡한 표현보다 ‘토해 내다’를 택했습니다. 이는 땅이 거주민을 거부하여 밖으로 밀어내는 비유를 가장 직접적으로 전달합니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 이 땅
  - 나라
  lexicon: HALOT
  rationale: 문맥상 광범위한 ‘땅’이 아니라 가나안의 언약적 거주 공간을 가리키므로, 관형사 ‘그’로 특정된 ‘그 땅’이 자연스럽고 정확합니다.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  english_pob_choice: when you defile it
  chosen_korean: 너희가 그 땅을 더럽힐 때에
  alternatives_korean:
  - 너희가 그 땅을 부정하게 할 때에
  - 너희의 더러움으로 그 땅을 더럽힐 때에
  lexicon: HALOT
  rationale: ב + 동명사구의 시간적 용법을 한국어의 ‘-할 때에’로 자연스럽게 옮겼고, טמא의 결과를 ‘더럽히다’로 직접 드러냈습니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 그 민족
  alternatives_korean:
  - 그 나라
  - 그 백성
  - 그 이방 민족
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사 גוי의 집단성을 살리면서도 한국어 성경에서 자연스러운 ‘민족’을 사용했습니다. ‘이방’은 본문에 없는 해석을 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: 땅의 의인화와 심판 주체성
  chosen_reading: 땅을 문법적 주어로 유지하여, 더러움 때문에 거주민을 ‘토해 내는’ 이미지 자체를 보존했습니다.
  alternative_readings:
  - 하나님이 땅을 통해 쫓아내신다고 추상화하기
  - 땅의 반응을 약화시켜 단순한 추방으로 옮기기
  rationale: 레위기 본문은 땅이 부정함에 반응해 주민을 내쫓는다는 의인화를 통해 죄와 땅의 오염, 그리고 언약 심판의 연관을 드러냅니다. 이 긴장을 약화시키지 않는 것이 원문의 신학을 살립니다.
  doctrine_reference: 레위기 18장 문맥의 정결/부정 관념, 언약적 심판
- issue: 부정확한 완곡화 방지
  chosen_reading: ‘토해 내다’를 반복해 원문의 강한 혐오·배출 이미지를 유지했습니다.
  alternative_readings:
  - ‘쫓아내다’로 순화하기
  - ‘내버리다’로 일반화하기
  rationale: 영어 POB도 ‘vomit ... out’를 택해 이미지를 투명하게 드러내고 있으므로, 한국어에서도 그 충격을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 원문 이미지 보존 원칙
