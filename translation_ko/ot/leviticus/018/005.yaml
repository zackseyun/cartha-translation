id: LEV.18.5
reference: Leviticus 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, 'which if anyone does them, he shall live by them.' Hebrew 'man' here is a singular representative expression.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he shall live in them.' The Hebrew preposition can be understood instrumentally ('by') or as sphere/realm ('in').
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 너희는 내 규례들과 내 법규들을 지키십시오. 사람이 그것들을 행하면 그것들로[a] 살 것입니다. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들 안에서 살 것입니다.’ 히브리어 전치사는 ‘그것들로’라는 수단의 뜻이나 ‘그것들 안에서’라는 영역의 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: So you shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 지켜야 합니다
  - 지키라
  lexicon: HALOT
  rationale: 법적·언약적 권면으로서 명령형 의미를 살리되, 현대 합쇼체에 맞게 정중한 명령으로 옮겼습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 법도들
  lexicon: HALOT
  rationale: חקּוֹת은 제정된 규정·규례의 성격이 강하므로, 한국어에서는 교회 전통어보다 직접적인 ‘규례들’이 원문의 법적 성격을 잘 드러냅니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 규정들
  lexicon: HALOT
  rationale: משפט는 이 문맥에서 법적 판결/규범의 뜻이므로, ‘법규’로 옮겨 חֻקֹּת과 구별되는 제도적 뉘앙스를 살렸습니다.
- source_word: הָאָדָם
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 그 사람이
  - 사람은
  lexicon: HALOT
  rationale: 히브리어 단수 남성형의 대표적 일반화를 한국어에서는 자연스러운 보편명사 ‘사람’으로 옮겨, 성별을 강조하지 않으면서도 일반 진술의 힘을 유지했습니다.
- source_word: בָּהֶם
  english_pob_choice: by them
  chosen_korean: 그것들로 말미암아
  alternatives_korean:
  - 그것들로
  - 그것들 안에서
  - 그것들을 통해
  lexicon: HALOT
  rationale: ב는 수단적·영역적 여지를 함께 지니므로, ‘말미암아’는 ‘by/in them’의 중첩된 의미를 한국어로 가장 무리 없이 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 신명기의 고유명사 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: אָדָם의 대표성
  chosen_reading: ‘사람이’로 옮겨 대표적 단수 일반화로 읽히게 했습니다.
  alternative_readings:
  - 한 사람이
  - 누구든지
  - 인간이
  rationale: 본문은 특정 남성을 말하기보다 언약 규례를 행하는 일반 사람을 가리키므로, 현대 한국어에서는 자연스러운 일반명사로 표현하되 원문의 단수 대표성을 유지했습니다.
  doctrine_reference: Contested terms table for אָדָם; Translation philosophy §4
- issue: ‘살 것입니다’의 범위
  chosen_reading: 삶의 범위를 특정하지 않고 ‘살 것입니다’로 유지했습니다.
  alternative_readings:
  - 복을 누릴 것입니다
  - 그 땅에서 살 것입니다
  - 생명을 얻을 것입니다
  rationale: 히브리어는 이 생명의 성격을 구체적으로 한정하지 않으므로, 본문이 열어 둔 언약적 생명의 폭을 번역에서 미리 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
