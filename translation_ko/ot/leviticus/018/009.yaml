revisions:
- from: 당신은 친자매의 알몸을 드러내서는 안 됩니다. 곧 아버지의 딸이든 어머니의 딸이든, 집안에서 난 사람이든 밖에서 난 사람이든 그렇습니다.[a]
  to: 자매의 알몸을 드러내서는 안 됩니다. 아버지의 딸이든 어머니의 딸이든, 집안에서 태어났든 밖에서 태어났든 그렇게 해서는 안 됩니다.[a]
  rationale: ‘친자매’를 포괄적 친족어인 ‘자매’로 고쳐 아버지 쪽과 어머니 쪽 자매를 포함하는 원문의 범위를 보존했습니다. 출생 수식어는 ‘사람’으로 명사화하지 않고 앞선 자매를 받는 조건절로 옮겼습니다. 반복되는 금지의 대상을 한국어에서 명료하게 하려고 ‘그렇게 해서는 안 됩니다’로 마무리했으며, 이는 히브리어의 ‘그들의 알몸을 드러내지 말라’라는 재개를 반영합니다.
  reviewer_model: gpt-5.6-terra
