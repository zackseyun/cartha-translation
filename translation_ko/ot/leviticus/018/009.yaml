  lexicon: HALOT
  rationale: 법조문 금지형을 현대 한국어의 합쇼체로 자연스럽게 표현하되, עֶרְוָה와 연결되는 ‘드러내다’의 관용성을 유지했습니다.
theological_decisions:
- issue: 마지막 수식절의 범위
  chosen_reading: 이 절은 ‘당신의 자매’라는 범주를 아버지 쪽과 어머니 쪽, 그리고 집안 출생과 밖의 출생까지 모두 포함하는 방식으로 확장합니다.
  alternative_readings:
  - 이 표현이 완전한 자매와 이복자매를 구분하는 기술일 수 있으나, 본문 자체는 그 차이를 명시하지 않습니다.
  rationale: 히브리어 법문은 금지 대상을 축소하기보다 분류를 덧붙여 범위를 분명히 하는 구조이므로, 본문이 말하는 포괄성을 유지했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
