  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
  footnotes:
  - marker: a
    text: Or 'born at home or born outside.' The Hebrew contrasts birth 'in the house/household' with birth 'outside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 친자매의 알몸을 드러내서는 안 됩니다. 곧 아버지의 딸이든 어머니의 딸이든, 집안에서 난 사람이든 밖에서 난 사람이든 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집에서 난 사람’ / ‘밖에서 난 사람’입니다. 히브리어는 ‘집/가정 안에서’와 ‘밖에서’의 대비를 세웁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  english_pob_choice: the nakedness of ... / their nakedness
  chosen_korean: 알몸
  alternatives_korean:
  - 수치
  - 벌거벗은 모습
  - 몸
  lexicon: HALOT
  rationale: 레위기 18장에서는 עֶרְוָה가 성적 관계 금지의 관용구로 쓰이므로, 한국어로도 노골적이되 과도하게 완곡하지 않은 ‘알몸을 드러내다’로 옮겨 관용구의 금지력을 유지했습니다.
- source_word: אֲחוֹתְךָ
  english_pob_choice: your sister
  chosen_korean: 친자매
  alternatives_korean:
  - 당신의 자매
  - 당신의 누이
  lexicon: HALOT
  rationale: 직역만 하면 어색할 수 있어, 남성 수신자에게 적용되는 친족 범주를 분명히 하는 ‘친자매’로 처리했습니다.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  english_pob_choice: your father's daughter / your mother's daughter
  chosen_korean: 아버지의 딸 / 어머니의 딸
  alternatives_korean:
  - 아버지에게서 난 딸 / 어머니에게서 난 딸
  - 아버지의 자녀 / 어머니의 자녀
  lexicon: HALOT
  rationale: 히브리어의 병렬 법문 구조를 살리기 위해 친자 관계를 그대로 보존한 직설적 표현을 택했습니다.
- source_word: מוֹלֶדֶת בַּיִת / מוֹלֶדֶת חוּץ
  english_pob_choice: born in the household / born outside it
  chosen_korean: 집안에서 난 사람 / 밖에서 난 사람
  alternatives_korean:
  - 가정에서 난 사람 / 바깥에서 난 사람
  - 집에서 난 사람 / 밖에서 난 사람
  lexicon: HALOT
  rationale: בַּיִת과 חוּץ의 대조를 한국어에서도 자연스럽게 드러내기 위해 ‘집안/밖’의 사회적·가족적 대비로 옮겼습니다. ‘집안’은 단순한 건물보다 가정·가문 범주를 더 잘 전달합니다.
- source_word: לֹא תְגַלֶּה
  english_pob_choice: You shall not uncover
  chosen_korean: 드러내서는 안 됩니다
  alternatives_korean:
  - 드러내지 마십시오
  - 벗겨서는 안 됩니다
  lexicon: HALOT
  rationale: 법조문 금지형을 현대 한국어의 합쇼체로 자연스럽게 표현하되, עֶרְוָה와 연결되는 ‘드러내다’의 관용성을 유지했습니다.
theological_decisions:
- issue: 마지막 수식절의 범위
  chosen_reading: 이 절은 ‘당신의 자매’라는 범주를 아버지 쪽과 어머니 쪽, 그리고 집안 출생과 밖의 출생까지 모두 포함하는 방식으로 확장합니다.
  alternative_readings:
  - 이 표현이 완전한 자매와 이복자매를 구분하는 기술일 수 있으나, 본문 자체는 그 차이를 명시하지 않습니다.
  rationale: 히브리어 법문은 금지 대상을 축소하기보다 분류를 덧붙여 범위를 분명히 하는 구조이므로, 본문이 말하는 포괄성을 유지했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
