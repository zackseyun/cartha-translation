  alternatives_korean:
  - 가정에서 난 사람 / 바깥에서 난 사람
  - 집에서 난 사람 / 밖에서 난 사람
  lexicon: HALOT
  rationale: בַּיִת과 חוּץ의 대조를 한국어에서도 자연스럽게 드러내기 위해 ‘집안/밖’의 사회적·가족적 대비로 옮겼습니다. ‘집안’은 단순한 건물보다 가정·가문 범주를 더 잘 전달합니다.
- source_word: לֹא תְגַלֶּה
  english_pob_choice: You shall not uncover
  chosen_korean: 드러내서는 안 됩니다
