  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
  footnotes:
  - marker: a
    text: Hebrew 'approach'; in this context the verb carries sexual force within the incest-law formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 아버지의 형제의 벌거벗음을 드러내서는 안 됩니다. 그의 아내에게 가까이해서도 안 됩니다[a]. 그녀는 너의 고모입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘가까이하다’는 이 문맥에서 근친상간 금지의 성적 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / תְגַלֵּה
  english_pob_choice: the nakedness of / uncover
  chosen_korean: 벌거벗음 / 드러내다
  alternatives_korean:
  - 수치를 / 드러내다
  - 벌거벗음을 / 벗기다
  lexicon: HALOT
  rationale: 레위기 18장의 고정된 법률 표현인 ‘uncover nakedness’를 한국어로도 문맥을 지우지 않게 옮겨, 성적 금지를 완곡하지만 직접적으로 드러내도록 했습니다.
- source_word: אֲחִי אָבִיךָ
  english_pob_choice: your father's brother
  chosen_korean: 네 아버지의 형제
  alternatives_korean:
  - 네 친삼촌
  - 아버지의 형제
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘아버지의 형제’로 옮겼습니다. ‘친삼촌’은 뜻은 분명하지만 원문 구조를 덜 보입니다.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  english_pob_choice: you shall not approach his wife
  chosen_korean: 그의 아내에게 가까이해서도 안 됩니다
  alternatives_korean:
  - 그의 아내에게 접근해서도 안 됩니다
  - 그의 아내와 성적으로 가까워져서는 안 됩니다
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이하다/다가가다’를 유지하면서, 레위기의 성적 금지 관용구임을 문맥이 분명히 하도록 옮겼습니다. ‘접근하다’는 다소 딱딱하여 자연스러운 한국어로 조정했습니다.
- source_word: דֹּדָתְךָ
  english_pob_choice: She is your aunt
  chosen_korean: 너의 고모입니다
  alternatives_korean:
  - 너의 아주머니입니다
  - 너의 숙모입니다
  lexicon: HALOT
  rationale: 여기서는 앞 절의 관계 설명을 바탕으로 한국어 친족어를 써야 하므로, 아버지 쪽 형제의 아내를 가리키는 관계를 ‘고모’로 옮겼습니다. 앞 절이 이미 정확한 친족 관계를 밝혀 주므로, 마지막 절은 간결하게 마무리했습니다.
theological_decisions:
- issue: 성적 금기 법문의 완곡한 표현을 얼마나 직접적으로 옮길지
  chosen_reading: ‘벌거벗음’과 ‘가까이하다’를 유지해 법문 특유의 완곡한 성적 금기를 드러내었습니다.
  alternative_readings:
  - ‘성관계를 해서는 안 됩니다’처럼 해설적으로 풀어쓰기
  - ‘몸을 드러내다’처럼 더 완곡하게 처리하기
  rationale: 히브리어는 노골적 서술보다 법률적 관용구를 사용하므로, 이를 과도하게 풀어쓰지 않고 한국어도 비슷한 긴장감을 유지하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 친족 명칭의 한국어 대응
  chosen_reading: 마지막 문장을 ‘너의 고모입니다’로 옮겼습니다.
  alternative_readings:
  - ‘너의 친고모입니다’
  - ‘너의 숙모입니다’
  rationale: 앞선 문맥이 아버지의 형제와 그 아내를 분명히 설명하므로, 한국어 친족어로는 아버지 쪽 형제의 아내를 가리키는 ‘고모’가 가장 자연스럽고 간결합니다.
  doctrine_reference: Translation philosophy §§1, 6
