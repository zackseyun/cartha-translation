id: LEV.18.21
reference: Leviticus 18:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'any of your children.' The Hebrew literally says 'from your seed.'
    reason: lexical_alternative
  - marker: b
    text: That is, to a rite associated with Molech; many understand this as child sacrifice, often described elsewhere as making children 'pass through the fire.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 네 자손[a] 가운데 누구도 몰렉에게 넘겨주어 지나가게 해서는 안 되며[b], 네 하나님의 이름을 욕되게 해서도 안 됩니다. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 씨 가운데’라고 말합니다. ‘자녀’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 몰렉과 관련된 의례를 가리킵니다. 많은 이들은 이를 자녀 희생으로 이해하며, 다른 본문들은 흔히 자녀를 ‘불 가운데로 지나가게 하는’ 행위로 묘사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  english_pob_choice: any of your offspring
  chosen_korean: 네 자손 가운데 누구도
  alternatives_korean:
  - 네 씨 가운데 누구도
  - 네 자녀 가운데 누구도
  - 네 후손 가운데 누구도
  lexicon: HALOT
  rationale: זֶרַע의 문자값은 '씨'이지만, 법문맥에서는 자손/후손을 가리키므로 자연스러운 현대 한국어로 넓게 살려 옮겼습니다. partitive מִן의 뜻도 '가운데 누구도'로 반영했습니다.
- source_word: תִתֵּן לְהַעֲבִיר
  english_pob_choice: to make them pass over
  chosen_korean: 넘겨 주어 그들에게 지나가게 해서는 안 되며
  alternatives_korean:
  - 넘겨 주어 통과하게 해서는 안 되며
  - 지나가게 하려고 넘겨 주어서는 안 되며
  - 몰렉에게 바쳐서는 안 되며
  lexicon: HALOT
  rationale: תִתֵּן + לְהַעֲבִיר의 결합을 직역적으로 풀어, '주다/넘겨 주다'와 '지나가게 하다'의 이중 동작을 드러냈습니다. 이렇게 해야 몰렉 의례의 함의를 유지하면서도 본문이 말하는 이상을 과잉 해석하지 않습니다.
- source_word: לַמֹּלֶךְ
  english_pob_choice: to Molech
  chosen_korean: 몰렉
  alternatives_korean:
  - 몰렉에게
  - 몰렉 신에게
  - 몰렉에게로
  lexicon: HALOT
  rationale: 전승된 고유명사로 처리하는 것이 가장 분명하므로 음역어 '몰렉'을 사용했습니다. 한국어 조사로 방향/대상을 이미 드러내므로 본문은 간결하게 유지했습니다.
- source_word: תְחַלֵּל אֶת שֵׁם אֱלֹהֶיךָ
  english_pob_choice: you shall not profane the name of your God
  chosen_korean: 네 하나님의 이름을 더럽혀서도 안 됩니다
  alternatives_korean:
  - 네 하나님의 이름을 욕되게 해서도 안 됩니다
  - 네 하나님의 이름을 모독해서도 안 됩니다
  - 네 하나님의 이름을 속되게 해서도 안 됩니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 속되게 만드는 것이므로, 법문맥에서 가장 직접적인 '더럽히다'를 택했습니다. '이름'은 단순 명칭이 아니라 하나님의 명예와 계시된 존재를 가리키므로 그대로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 야훼를 사용하여 하나님의 고유 이름을 드러냈습니다.
theological_decisions:
- issue: 몰렉 금지의 범위와 구체성
  chosen_reading: 본문의 표현은 그대로 유지하고, '지나가게 해서는 안 되며'로 옮겨 몰렉 의례의 구체적 방식은 본문이 직접 말하는 만큼만 드러냈습니다.
  alternative_readings:
  - '''몰렉에게 자녀를 바쳐서는 안 되며'''
  - '''몰렉에게 불로 지나가게 해서는 안 되며'''
  rationale: 이 구절은 뒤의 전승 전체와 연결되더라도 여기서는 '불'을 명시하지 않으므로, 해석을 본문 안으로 과도하게 끌어오지 않는 것이 더 충실합니다.
  doctrine_reference: original-language primacy; preserve theological tension rather than resolve it
- issue: '''네 자손''의 번역 폭'
  chosen_reading: '''자손 가운데 누구도''로 넓게 두어, 특정 연령 범주로만 좁히지 않았습니다.'
  alternative_readings:
  - '''자녀 가운데 누구도'''
  - '''후손 가운데 누구도'''
  - '''씨 가운데 누구도'''
  rationale: זֶרַע는 문자적으로는 '씨'이지만, 법조항에서는 후손 전체를 가리킬 수 있으므로 한국어에서도 포괄성을 유지했습니다.
  doctrine_reference: consistency of key terms, or documented exception
