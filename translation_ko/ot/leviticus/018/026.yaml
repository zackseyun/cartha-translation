  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
  footnotes:
  - marker: a
    text: Or 'the resident foreigner who resides among you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 규례들과 내 법규를 지키고, 이 모든 가증한 일들 가운데 어떤 것도 행하지 마십시오. 본토인이든 너희 가운데 머무는 거류민이든 마찬가지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 여기서 공동체 안에 머무는 이주 거주자를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: shall keep
  chosen_korean: 지키고
  alternatives_korean:
  - 준수하고
  - 지켜야 하고
  - 지켜야 합니다
  lexicon: HALOT
  rationale: שׁמר는 언약/율법 문맥에서 ‘지키다, 준수하다’의 뜻이므로, 현대 한국어에서는 명령 흐름에 맞게 ‘지키고’로 자연스럽게 옮겼습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 법도들
  - 내 규정들
  lexicon: HALOT
  rationale: חֻקִּים은 고정된 규정들을 가리키므로, 전통 교회어보다 의미가 또렷한 ‘규례들’을 택했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 규례들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 법적 판단과 판결의 성격이 있어, 문맥상 ‘법규’가 한국어에서 법적 권위를 비교적 잘 살립니다.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  english_pob_choice: these abominations
  chosen_korean: 이 모든 가증한 일들
  alternatives_korean:
  - 이 모든 혐오스러운 일들
  - 이 모든 역겨운 일들
  - 이런 가증한 것들
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 강한 도덕적 혐오와 금지의 무게를 살리기 위해 ‘가증한 일들’로 옮겼고, ‘모든’은 מִכֹּל의 포괄성을 반영합니다.
- source_word: הָאֶזְרָח / הַגֵּר הַגָּר בְּתוֹכְכֶם
  english_pob_choice: the native-born / the sojourner who sojourns among you
  chosen_korean: 본토인이든 너희 가운데 머무는 거류민이든 마찬가지입니다
  alternatives_korean:
  - 자국민이든 너희 가운데 거주하는 이방인이든 마찬가지입니다
  - 토박이든 너희 가운데 거류하는 나그네이든 마찬가지입니다
  lexicon: HALOT
  rationale: אֶזְרָח와 גֵּר의 대비를 살리면서도, 독자가 곧바로 이해할 수 있게 ‘본토인/거류민’으로 처리했습니다. 반복 어근은 한국어에서 자연스럽게 풀어 ‘머무는’으로 반영했습니다.
theological_decisions:
- issue: 언약 명령의 적용 범위
  chosen_reading: 이 금지는 이스라엘 본토인과 그들 가운데 머무는 거류민 모두에게 동일하게 적용됩니다.
  alternative_readings:
  - 마지막 구절은 단순히 대상의 범주를 덧붙이는 것으로 읽을 수 있습니다.
  - 거류민은 부차적 예외 집단이 아니라 동일한 도덕적 요구 아래 놓입니다.
  rationale: 히브리어 문장은 본토인과 거류민을 함께 묶어 동일한 금지 아래 놓습니다. 따라서 한국어에서도 적용 범위의 포괄성을 분명히 드러냈습니다.
  doctrine_reference: 토라의 공동체 윤리와 이방 거류민의 언약적 책임
- issue: 용어 선택 '거류민'
  chosen_reading: gēr를 단순한 ‘외국인’보다 공동체 안에 머무는 보호받는 거주자 의미를 살린 ‘거류민’으로 옮겼습니다.
  alternative_readings:
  - 외국인
  - 나그네
  - 이방인
  rationale: גֵּר는 단순 국적 표지가 아니라 이스라엘 공동체 안에 정착해 사는 사람을 가리키므로, 법문맥의 정확도를 위해 ‘거류민’을 택했습니다.
  doctrine_reference: 구약 율법의 사회적·법적 범주
