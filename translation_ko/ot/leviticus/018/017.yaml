id: LEV.18.17
reference: Leviticus 18:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
  footnotes:
  - marker: a
    text: Or 'her near kin' or more literally 'her flesh.'
    reason: lexical_alternative
  - marker: b
    text: '''Uncover the nakedness'' is a Hebrew idiom for prohibited sexual relations.'
    reason: cultural_note
  - marker: c
    text: Or 'wickedness,' 'lewdness,' or 'an outrageous act.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 한 여자와 그녀의 딸의 벌거벗음을 드러내서는 안 됩니다[a]. 그녀의 아들의 딸이나 그녀의 딸의 딸을 데려다가 그녀의 벌거벗음을 드러내려고 해서도 안 됩니다[b]. 그들은 가까운 친족입니다. 그것은 음행입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로서 금지된 성적 관계를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 본문의 '벌거벗음을 드러내다'는 히브리어 관용구를 그대로 살린 표현입니다.
    reason: source_note
  - marker: c
    text: 히브리어 זִמָּה는 악행, 음란한 짓, 극악한 일을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  english_pob_choice: uncover the nakedness of
  chosen_korean: 벌거벗음을 드러내다
  alternatives_korean:
  - 알몸을 드러내다
  - 성적 관계를 맺다
  - 벌거벗음을 벗기다
  lexicon: HALOT
  rationale: 레위기의 금지법에서 반복되는 관용구를 살리되, 한국어에서도 노골적 신체 노출이 아니라 성적 금지를 뜻한다는 점이 드러나도록 옮겼습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 한 여자
  alternatives_korean:
  - 한 아내
  - 한 여자 사람
  lexicon: HALOT
  rationale: 문맥상 특정 혼인관계보다 여성 인물 자체를 가리키므로, 더 좁은 '아내'보다 '여자'가 안전합니다.
- source_word: בַּת בְּנָהּ / בַּת בִּתָּהּ
  english_pob_choice: her son's daughter / her daughter's daughter
  chosen_korean: 그녀의 아들의 딸 / 그녀의 딸의 딸
  alternatives_korean:
  - 그녀의 손녀
  - 아들을 통해 난 손녀 / 딸을 통해 난 손녀
  lexicon: HALOT
  rationale: 히브리어의 친족 구조를 그대로 드러내어, 법문의 구체적인 혈연 금지를 보존했습니다.
- source_word: שַׁאֲרָה הֵנָּה
  english_pob_choice: they are close relatives
  chosen_korean: 그들은 가까운 친족입니다
  alternatives_korean:
  - 그들은 그녀의 혈육입니다
  - 그들은 가까운 혈족입니다
  lexicon: HALOT
  rationale: שְׁאֵר/שְׁאֵרָה는 혈연·친족 관계를 뜻하므로, 현대 한국어에서 자연스럽고 명확한 '가까운 친족'으로 옮겼습니다.
- source_word: זִמָּה
  english_pob_choice: depravity
  chosen_korean: 음행
  alternatives_korean:
  - 패륜
  - 악행
  - 음란한 짓
  lexicon: HALOT
  rationale: 이 단어는 단순한 도덕적 나쁨보다 성적 일탈을 강하게 뜻하므로, 한국어 성서 문맥에서 그 강도를 살릴 수 있는 '음행'을 택했습니다.
theological_decisions:
- issue: '''벌거벗음을 드러내다''라는 관용구의 직역 유지 여부'
  chosen_reading: 직역을 유지하되 문맥상 성적 금지임이 드러나도록 했습니다.
  alternative_readings:
  - '''성관계를 맺다''로 의미를 풀어 쓰기'
  - '''성적인 수치를 범하다''로 의역하기'
  rationale: 레위기의 법문에서 반복되는 표현을 유지해야 상호본문성과 금지의 강도가 보존됩니다. 동시에 한국어 독자가 의미를 놓치지 않도록 자연스러운 어순으로 다듬었습니다.
  doctrine_reference: 레위기 18장의 정결/성윤리 법문
- issue: זִמָּה의 어조
  chosen_reading: '''음행''으로 옮겨 성적·법적 비난의 강도를 유지했습니다.'
  alternative_readings:
  - '''패륜'''
  - '''음란'''
  - '''극악한 일'''
  rationale: 이 절의 결론은 단순한 비난이 아니라 공동체적 금지와 규탄입니다. '음행'은 한국어 성서 문맥에서 성적 부정의 무게를 비교적 직접적으로 전달합니다.
  doctrine_reference: 레위기 18장 금지 조항의 윤리적 판정
