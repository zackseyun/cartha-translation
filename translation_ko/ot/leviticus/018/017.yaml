revisions:
- from: 당신은 한 여자와 그녀의 딸의 벌거벗음을 드러내서는 안 됩니다[a]. 그녀의 아들의 딸이나 그녀의 딸의 딸을 데려다가 그녀의 벌거벗음을 드러내려고 해서도 안 됩니다[b]. 그들은 가까운 친족입니다. 그것은 음행입니다[c].
  to: 한 여자와 그 딸의 벌거벗음을 드러내서는 안 됩니다[a]. 그 여자의 아들의 딸이나 딸의 딸을 취해서 그 여자의 벌거벗음을 드러내서는 안 됩니다[b]. 그들은 그 여자의 가까운 친족입니다. 그것은 악행입니다[c].
  rationale: The revision removes the unnatural addressee pronoun, clarifies that both descendant terms and the kinship statement refer to the original woman, and replaces the narrower ‘음행’ with ‘악행’ for זִמָּה. It retains the Hebrew idiom ‘벌거벗음을 드러내다’ and the broader verb ‘취하다,’ so that the source’s legal idiom and its ambiguity are not narrowed to marriage alone.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft broadly retains the Hebrew legal structure and the repeated idiom for prohibited sexual relations. However, it omits the possessive sense of שַׁאֲרָה ('her close relatives') and renders זִמָּה as '음행,' a Korean term that can too specifically suggest sexual immorality such as fornication/adultery rather than the broader, emphatic condemnation in the Hebrew.
  naturalness: ‘당신은’ is not idiomatic for a general biblical legal addressee in modern Korean and can sound confrontational. The revision uses an impersonal legal prohibition with formal-polite endings. It also makes the woman who is the kinship reference explicit, avoiding ambiguity in the repeated possessives.
  terminology: ‘벌거벗음을 드러내다’ is retained as a deliberate, consistent rendering of the Hebrew idiom, with explanatory notes. ‘가까운 친족’ appropriately conveys kinship, while ‘악행’ is a safer non-denominational rendering of זִמָּה than ‘음행.’
  issues:
  - severity: medium
    issue: The possessive relationship in ‘그들은 가까운 친족입니다’ is not expressed.
    rationale: 'שַׁאֲרָה contains a third-feminine-singular suffix: literally, ‘they are her flesh/close kin.’ The woman is the relevant kinship reference, so Korean should state this.'
  - severity: medium
    issue: ‘음행’ is overly narrow for זִמָּה.
    rationale: Although זִמָּה often occurs in sexual-prohibition contexts, it denotes a heinous or depraved act and is not limited to the Korean semantic range of ‘음행.’ ‘악행’ preserves the broader legal-moral condemnation.
  - severity: low
    issue: ‘당신은’ is unsuitable in this formal legal Korean context.
    rationale: Modern Korean ‘당신’ can sound confrontational or be restricted to particular interpersonal contexts. An impersonal prohibition is natural and preserves the Hebrew command’s legal force.
  revised_text: 한 여자와 그 딸의 벌거벗음을 드러내서는 안 됩니다[a]. 그 여자의 아들의 딸이나 딸의 딸을 취해서 그 여자의 벌거벗음을 드러내서는 안 됩니다[b]. 그들은 그 여자의 가까운 친족입니다. 그것은 악행입니다[c].
