  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. ‘나는 너희 하나님 야훼입니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다. 언약적 가족 표현으로서 “이스라엘 자손”으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה를 가리키며, 전통적으로는 “주”로 번역됩니다. 이 번역은 신명 자체를 드러내기 위해 “야훼”를 사용합니다.
    reason: alternative_reading
