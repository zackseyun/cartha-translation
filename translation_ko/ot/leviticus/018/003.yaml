revisions:
- from: 너희는 이집트 땅에서 하던 대로 해서는 안 됩니다. 거기에서 너희가 살았던 곳입니다. 또한 내가 너희를 이끌어 가는 가나안 땅에서 하던 대로도 해서는 안 됩니다. 그들의 규례를 따라 다녀서는 안 됩니다.[a][b]
  to: 너희가 살았던 이집트 땅의 관행대로 행해서는 안 됩니다[a]. 내가 너희를 그리로 인도하여 들어가는 가나안 땅의 관행대로도 행해서는 안 됩니다. 그들의 규례를 따라 살아서는 안 됩니다[b].
  rationale: 관계절을 각각 이집트와 가나안 땅을 수식하도록 복원하고, 반복되는 히브리어 비교 구문을 ‘땅의 관행대로’로 일관되게 번역했습니다. ‘인도하여 들어가는’은 מֵבִיא의 진행·목적지 뉘앙스를 드러냅니다. 마지막 명령은 ‘걷다’의 윤리적 삶의 비유를 현대 합쇼체 한국어에서 자연스러운 ‘따라 살아서는 안 됩니다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:19Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 이집트와 가나안의 관행을 본받지 말라는 반복 금지와 그들의 규례를 따르지 말라는 명령을 대체로 반영합니다. 그러나 “거기에서 너희가 살았던 곳입니다”는 히브리어 관계절을 독립된 서술문으로 잘못 처리하여 문법적으로도 부자연스럽고, 문장의 통사 관계를 훼손합니다. 또한 “규례를 따라 다니다”는 히브리어의 삶의 방식에 관한 ‘걷다’ 비유를 한국어에서 부자연스럽게 옮긴 표현입니다.
  naturalness: ‘너희가 살았던 이집트 땅의 관행대로’로 관계절을 명사구 안에 결합하면 현대 표준 한국어로 자연스럽습니다. ‘그들의 규례를 따라 살아서는 안 됩니다’는 삶의 행로라는 비유적 의미를 자연스럽고 격식 있게 전달합니다.
  terminology: ‘이집트 땅’, ‘가나안 땅’, ‘규례’는 적절합니다. מַעֲשֶׂה의 관용적 용법에는 ‘관행’을 사용하되, 각주에서 문자적 ‘행위/관행’ 및 가능한 직역적 표현을 밝혔습니다. 각주 표지는 실제로 해당 어구에 붙여, 규례에 관한 대안이 가나안 도착 구절에 잘못 연결되지 않도록 했습니다.
  issues:
  - severity: high
    issue: “거기에서 너희가 살았던 곳입니다”가 관계절을 독립 문장으로 처리함
    rationale: אֲשֶׁר יְשַׁבְתֶּם בָּהּ는 ‘너희가 그곳에서 살았던’이라는 관계절로서 ‘이집트 땅’을 수식합니다. 초안 문장은 ‘너희가 살았던 곳’이라는 서술이 되어 문법과 원문의 통사 관계가 모두 부정확합니다.
  - severity: medium
    issue: “그들의 규례를 따라 다녀서는 안 됩니다”가 부자연스러움
    rationale: 한국어 ‘따라 다니다’는 대체로 사람을 뒤따라 이동한다는 뜻으로 이해됩니다. לֹא תֵלֵכוּ의 행위 방식/삶의 길이라는 비유는 ‘따라 살아서는 안 됩니다’로 자연스럽게 옮길 수 있습니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 놓여 있어 적용 대상이 불명확함
    rationale: a는 ‘관행/행위’ 표현에, b는 ‘규례를 따라 살다’에 각각 붙여야 각주의 어휘적 대안이 올바른 본문 요소와 연결됩니다.
