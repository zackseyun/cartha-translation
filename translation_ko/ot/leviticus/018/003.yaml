source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
  footnotes:
  - marker: a
    text: Or 'according to the practices of the land of Egypt ... and according to the practices of the land of Canaan.' The Hebrew idiom literally speaks of the 'deeds' or 'practices' of the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'You shall not follow their customs/ordinances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 살았던 이집트 땅의 관행대로 행해서는 안 됩니다[a]. 내가 너희를 그리로 인도하여 들어가는 가나안 땅의 관행대로도 행해서는 안 됩니다. 그들의 규례를 따라 살아서는 안 됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 땅의 행위대로 … 가나안 땅의 행위대로’. 히브리어 관용구는 문자적으로 ‘땅의 행위’ 또는 ‘땅의 관행’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 관습/규례를 따르지 마십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  english_pob_choice: as they do
  chosen_korean: 하던 대로
  alternatives_korean:
  - 그들이 하는 대로
  - 그들의 행실처럼
  - 그들의 행위에 따라
  lexicon: HALOT
  rationale: 히브리어의 비교적 관용적 표현을 한국어에서는 자연스러운 행위 표지인 ‘하던 대로’로 옮겨, 반복되는 금지의 행위를 분명히 드러냈습니다.
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  english_pob_choice: the land of Egypt / the land of Canaan
  chosen_korean: 이집트 땅 / 가나안 땅
  alternatives_korean:
  - 애굽 땅 / 가나안 땅
  - 이집트 지역 / 가나안 지역
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(ארץ)을 보존하면서, 현대 한국어 독자에게 바로 이해되는 지리명으로 옮겼습니다.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  english_pob_choice: where you lived
  chosen_korean: 거기에서 너희가 살았던 곳입니다
  alternatives_korean:
  - 그곳에서 너희가 거주했던 곳입니다
  - 너희가 거기에서 살던 곳입니다
  lexicon: HALOT
  rationale: 과거 거주 사실을 분명히 하면서도 한국어 문맥에서 자연스럽게 들리도록 풀어 옮겼습니다.
- source_word: וּבְחֻקֹּתֵיהֶם
  english_pob_choice: in their statutes
  chosen_korean: 그들의 규례를 따라
  alternatives_korean:
  - 그들의 규례 안에서
  - 그들의 규정을 따라
  - 그들의 법도를 따라
  lexicon: HALOT
  rationale: 문맥상 단순한 관습보다 규범적 금지를 가리키므로 ‘규례’를 택했고, ‘따라’로 행위 양식을 드러냈습니다.
theological_decisions:
- issue: ‘walk in their statutes’의 비유적 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘그들의 규례를 따라 다녀서는 안 됩니다’로, 도덕적 삶의 방향성을 나타내는 ‘걷다’의 이미지를 살렸습니다.
  alternative_readings:
  - ‘그들의 규례 안에서 행하지 마십시오’
  - ‘그들의 규례를 따르지 마십시오’
  rationale: 히브리어의 ‘걷다’는 삶의 방식 전체를 가리키는 비유이므로, 한국어에서도 단순한 금지보다 삶의 행로를 드러내는 표현을 유지하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §1, §6
