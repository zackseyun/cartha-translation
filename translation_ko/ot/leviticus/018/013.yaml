  lexicon: WLC; HALOT
  rationale: 금지의 근거를 제시하는 이유절로 자연스럽게 받아들여지도록 종결형 ‘기 때문입니다’로 풀었습니다.
theological_decisions:
- issue: 레위기 18장의 법문체와 성적 금기 표현을 얼마나 직접적으로 보존할지
  chosen_reading: ‘벌거벗음’을 유지해 원문의 법적 완곡어법을 드러냈습니다.
  alternative_readings:
  - 의역하여 ‘성관계를 가져서는 안 됩니다’로 옮김
  rationale: 본문은 단순한 일반 금지가 아니라 반복되는 성적 금기 법문이므로, 완곡어법을 보존해야 구조와 어조가 유지됩니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; consistency of legal idiom'
