source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחֽוֹת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי שְׁאֵ֥ר אִמְּ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'You shall not have sexual relations with your mother's sister.' The Hebrew reads literally, 'You shall not uncover the nakedness of your mother's sister.'
    reason: lexical_alternative
  - marker: b
    text: '''Close relative'' translates Hebrew שְׁאֵר, a kinship term meaning near flesh-kin.'
    reason: cultural_note
translation:
  language: ko
  text: 어머니의 누이의 벌거벗음[a][b]을 드러내어서는 안 됩니다. 그것은 어머니의 가까운 친족이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어머니의 누이의 벌거벗음’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까운 친족’은 히브리어 שְׁאֵר의 친족법적 의미를 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / תְגַלֵּה
  english_pob_choice: the nakedness of / you shall not uncover
  chosen_korean: 벌거벗음…을 드러내어서는 안 됩니다
  alternatives_korean:
  - 벗은 몸을 드러내어서는 안 됩니다
  - 성관계를 가져서는 안 됩니다
  lexicon: WLC; HALOT
  rationale: 레위기 18장의 반복되는 금지 관용구를 살리기 위해 ‘벌거벗음’을 유지하되, 현대 한국어에서는 동사 ‘드러내다’로 법문체의 금지 표현을 자연스럽게 옮겼습니다.
- source_word: אֲחוֹת אִמְּךָ
  english_pob_choice: your mother's sister
  chosen_korean: 어머니의 누이
  alternatives_korean:
  - 어머니의 자매
  - 외숙모
  lexicon: WLC; HALOT
  rationale: 히브리어 친족구조를 직접 반영해 ‘어머니의 누이’로 옮겼고, ‘외숙모’는 한국 친족 호칭 체계와 맞지 않아 배제했습니다.
- source_word: שְׁאֵר
  english_pob_choice: close relative
  chosen_korean: 가까운 친족
  alternatives_korean:
  - 살붙이
  - 혈족
  lexicon: HALOT
  rationale: שְׁאֵר의 친족법적 의미인 ‘가까운 살붙이/근친’을 현대 한국어로 가장 분명하게 전달하는 표현을 택했습니다.
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: 기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: WLC; HALOT
  rationale: 금지의 근거를 제시하는 이유절로 자연스럽게 받아들여지도록 종결형 ‘기 때문입니다’로 풀었습니다.
theological_decisions:
- issue: 레위기 18장의 법문체와 성적 금기 표현을 얼마나 직접적으로 보존할지
  chosen_reading: ‘벌거벗음’을 유지해 원문의 법적 완곡어법을 드러냈습니다.
  alternative_readings:
  - 의역하여 ‘성관계를 가져서는 안 됩니다’로 옮김
  rationale: 본문은 단순한 일반 금지가 아니라 반복되는 성적 금기 법문이므로, 완곡어법을 보존해야 구조와 어조가 유지됩니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; consistency of legal idiom'
