  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'You shall not have sexual relations with your mother's sister.' The Hebrew reads literally, 'You shall not uncover the nakedness of your mother's sister.'
    reason: lexical_alternative
  - marker: b
    text: '''Close relative'' translates Hebrew שְׁאֵר, a kinship term meaning near flesh-kin.'
    reason: cultural_note
translation:
  language: ko
  text: 어머니의 누이의 벌거벗음[a][b]을 드러내어서는 안 됩니다. 그 여자는 어머니의 가까운 친족이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘벌거벗음을 드러내다’는 이 문맥에서 금지된 성적 관계를 가리키는 법률적 완곡 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까운 친족’은 히브리어 שְׁאֵר의 친족법적 의미를 옮긴 것으로, 가까운 살붙이를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / תְגַלֵּה
  english_pob_choice: the nakedness of / you shall not uncover
  chosen_korean: 벌거벗음…을 드러내어서는 안 됩니다
  alternatives_korean:
  - 벗은 몸을 드러내어서는 안 됩니다
  - 성관계를 가져서는 안 됩니다
  lexicon: WLC; HALOT
  rationale: 레위기 18장의 반복되는 금지 관용구를 살리기 위해 ‘벌거벗음’을 유지하되, 현대 한국어에서는 동사 ‘드러내다’로 법문체의 금지 표현을 자연스럽게 옮겼습니다.
- source_word: אֲחוֹת אִמְּךָ
  english_pob_choice: your mother's sister
  chosen_korean: 어머니의 누이
  alternatives_korean:
