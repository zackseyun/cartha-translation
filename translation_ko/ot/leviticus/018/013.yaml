  lexicon: HALOT
  rationale: שְׁאֵר의 친족법적 의미인 ‘가까운 살붙이/근친’을 현대 한국어로 가장 분명하게 전달하는 표현을 택했습니다.
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: 기 때문입니다
  alternatives_korean:
  - 왜냐하면
