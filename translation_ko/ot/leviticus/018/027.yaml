translation:
  language: ko
  text: 이는 여러분보다 먼저 그 땅에 살던 사람들이 이 모든 가증한 일들을 행하였고, 그 땅이 더러워졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 땅이 더럽혀졌다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞 절의 금지에 대한 설명을 도입하는 연결어로 읽되, 한국어에서는 문두에 자연스럽게 풀어 쓰기보다 뒤 문장과 함께 원인 설명의 흐름을 살렸습니다.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  english_pob_choice: all these abominations
  chosen_korean: 이 모든 가증한 일들
  alternatives_korean:
  - 이 모든 혐오스러운 것들
  - 이 모든 역겨운 일들
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 강한 도덕·언약적 혐오감을 살리면서도, 한국어 성경 문맥에서 자연스럽게 읽히는 ‘가증한 일들’을 택했습니다.
- source_word: אַנְשֵׁי הָאָרֶץ
  english_pob_choice: the men of the land
  chosen_korean: 그 땅의 사람들은
  alternatives_korean:
  - 그 땅의 남자들은
  - 그 땅의 주민들은
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘땅의 사람들/남자들’이지만, 여기서는 이전 거주민 전체를 가리키는 집합적 표현으로 기능하므로 한국어에서는 의미를 드러내는 ‘사람들’로 옮겼습니다.
- source_word: וַתִּטְמָא הָאָרֶץ
  english_pob_choice: and the land became unclean
  chosen_korean: 그 땅이 더러워졌습니다
  alternatives_korean:
  - 그 땅이 부정하게 되었습니다
  - 그 땅이 오염되었습니다
  lexicon: HALOT
  rationale: טמא의 결과 상태를 한국어에서 가장 직관적으로 전달하는 표현으로 ‘더러워졌습니다’를 사용하되, 의례적·도덕적 불결의 중첩 가능성은 유지했습니다.
theological_decisions:
- issue: 땅의 부정함을 어떻게 표현할지
  chosen_reading: 그 땅이 더러워졌습니다
  alternative_readings:
  - 그 땅이 부정하게 되었습니다
  - 그 땅이 오염되었습니다
  rationale: 본문은 인간의 행위가 땅에 실제적 불결 상태를 가져왔다는 인과를 말하므로, 이를 지나치게 비유화하지 않고 ‘더러워지다’로 직역성과 가독성을 함께 확보했습니다.
  doctrine_reference: 인간의 죄와 땅의 부정함 사이의 성경적 연관성을 보존합니다.
