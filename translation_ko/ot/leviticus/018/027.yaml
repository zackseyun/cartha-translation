  rationale: The revision corrects the temporal reference to the prior inhabitants, removes the awkward repetition and spatial ambiguity, and explicitly represents the explanatory force of כִּי. It otherwise preserves the draft’s faithful renderings of “all these abominations” and the land’s becoming unclean.
