id: LEV.18.30
reference: Leviticus 18:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'detestable statutes' / 'detestable customs.' The Hebrew terms can denote prescribed practices or customs, not only formal statutes.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 명령을 지키십시오. 너희보다 앞서 행해진 가증한 규례들 가운데 어느 것도 행하지 말고, 그것들로 스스로를 더럽히지 마십시오. 나는 야훼, 너희 하나님입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמַרְתִּי
  english_pob_choice: you shall keep my charge
  chosen_korean: 내 명령을 지켜
  alternatives_korean:
  - 내 직무를 지켜
  - 내 맡기신 것을 지켜
  - 내 계명을 지켜
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 ‘지켜야 할 맡은 바/책임’의 뜻이 있어 문맥상 ‘명령’보다 넓지만, 한국어에서는 ‘명령을 지키다’가 가장 자연스럽고 규범적 의무를 잘 드러냅니다.
- source_word: מֵ/חֻקּוֹת הַ/תּֽוֹעֵבֹת
  english_pob_choice: any of the abominable statutes
  chosen_korean: 가증한 규례들 가운데 어떤 것도
  alternatives_korean:
  - 가증한 율례들 가운데 어떤 것도
  - 혐오스러운 규례들 가운데 어떤 것도
  - 가증한 관습들 가운데 어떤 것도
  lexicon: HALOT
  rationale: חֻקּוֹת는 ‘규례/정해진 관행’의 폭이 있고, 한국어 성경 어감상 ‘규례’가 문맥의 제도적·관행적 성격을 잘 살립니다. תּוֹעֵבֹת는 강한 도덕·예배적 혐오를 나타내므로 ‘가증한’이 적절합니다.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵי/כֶם
  english_pob_choice: that were practiced before you
  chosen_korean: 너희 앞에서 행해진
  alternatives_korean:
  - 너희 전에 행해진
  - 너희보다 앞서 행해진
  - 너희 앞에서 행해졌던
  lexicon: HALOT
  rationale: לִפְנֵיכֶם은 단순한 공간적 ‘앞에’가 아니라 이스라엘 이전에, 곧 그 땅에서 קודם에 행해졌다는 뜻이므로 ‘너희 앞에서 행해진’으로 시간적·문화적 선행을 드러냈습니다.
- source_word: וְ/לֹא תִֽטַּמְּא֖וּ בָּ/הֶם
  english_pob_choice: and you shall not make yourselves unclean by them
  chosen_korean: 그것들로 스스로 더럽혀서도 안 됩니다
  alternatives_korean:
  - 그것들로 스스로 부정해져서도 안 됩니다
  - 그것들로 너희를 더럽혀서는 안 됩니다
  - 그것들로 부정하게 되어서는 안 됩니다
  lexicon: HALOT
  rationale: טמא의 재귀적 뉘앙스를 살려 ‘스스로 더럽히다’로 옮겼습니다. ‘by them’의 수단·원인을 한국어 조사 ‘-로’로 자연스럽게 반영했습니다.
- source_word: אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם
  english_pob_choice: I am Yahweh your God
  chosen_korean: 나는 야훼, 너희 하나님입니다
  alternatives_korean:
  - 나는 야훼 너희 하나님입니다
  - 나는 야훼, 너희의 하나님입니다
  - 나는 주, 너희 하나님입니다
  lexicon: HALOT
  rationale: יהוה는 본문 그대로 고유명 ‘야훼’로 옮겨 언약적 자기계시를 보존했습니다. ‘너희 하나님’은 소유격을 자연스럽게 살리되 한국어에서 지나친 직역을 피했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본절은 신명기적/레위기적 언약 공식의 결어로서 Tetragrammaton이 직접 나타나므로, 프로젝트 기본어 ‘야훼’를 사용해 신적 이름의 고유성을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘가증한’의 강도 유지
  chosen_reading: 가증한
  alternative_readings:
  - 혐오스러운
  - 끔찍한
  rationale: 본문의 תּוֹעֵבָה는 단순한 불쾌감이 아니라 언약적·도덕적 혐오를 담으므로, 완화하지 않고 강한 평가어를 유지했습니다.
  doctrine_reference: Leviticus holiness-code moral impurity framing
