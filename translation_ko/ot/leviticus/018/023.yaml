id: LEV.18.23
reference: Leviticus 18:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
  footnotes:
  - marker: a
    text: Or 'for uncleanness with it' or 'thereby defiling yourself with it.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to lie down/mount'; the phrase refers to sexual intercourse with an animal.
    reason: lexical_alternative
  - marker: c
    text: Or 'confusion' or 'outrage'; the Hebrew term denotes a violation of proper order, especially in a sexual context.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 짐승과도 성관계를 맺어 자신을 더럽혀서는 안 됩니다.[a] 또한 여자는 짐승이 자신과 교미하도록 그 앞에 서서는 안 됩니다.[b] 그것은 질서를 어지럽히는 일입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “네 눕는 것을 주어”입니다. 히브리어 관용구로 성적 결합을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여자가 짐승 앞에 서서 그 짐승이 그녀와 교미하게 하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “혼돈” 또는 “질서의 심한 위반”으로 옮길 수 있습니다. 히브리어는 특히 성적 맥락에서 마땅한 질서의 위반을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  english_pob_choice: And with any animal
  chosen_korean: 어떤 짐승과도
  alternatives_korean:
  - 어떤 동물과도
  - 어떤 가축과도
  lexicon: HALOT
  rationale: בְּהֵמָה는 문맥상 넓게 짐승/동물을 가리키므로, 한국어에서는 포괄성을 살리면서도 자연스러운 “짐승”을 택했습니다.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  english_pob_choice: you shall not give your lying
  chosen_korean: 너는 네 눕는 것을 주어
  alternatives_korean:
  - 너는 네 잠자리를 주어
  - 너는 성적 관계를 맺어
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구인 “주다 + 눕는 것”을 가능한 한 투명하게 살리되, 한국어 문장으로 읽히도록 약간만 다듬었습니다.
- source_word: לְטָמְאָה בָהּ
  english_pob_choice: to become unclean with it
  chosen_korean: 그것으로 더럽혀지게 해서는 안 됩니다
  alternatives_korean:
  - 그것으로 부정하게 되어서는 안 됩니다
  - 그것과 함께 부정함에 이르도록 해서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 정결/부정 범주를 “더럽혀지다”로 옮겨, 단순한 위생적 오염이 아니라 성적·의례적 부정의 함의를 함께 드러냈습니다.
- source_word: לְרִבְעָהּ
  english_pob_choice: to mate with it
  chosen_korean: 그것과 짝짓기해서는 안 됩니다
  alternatives_korean:
  - 그것과 교합해서는 안 됩니다
  - 그것과 교미해서는 안 됩니다
  lexicon: HALOT
  rationale: 동물과의 성행위를 직접 가리키는 표현이므로, 뜻은 분명하되 과도하게 노골적이지 않은 “짝짓기”를 선택했습니다.
- source_word: תֶּבֶל
  english_pob_choice: it is a perversion
  chosen_korean: 그것은 패륜입니다
  alternatives_korean:
  - 그것은 혼돈입니다
  - 그것은 비정상입니다
  - 그것은 타락입니다
  lexicon: HALOT
  rationale: תֶּבֶל의 질서 위반과 도덕적 뒤틀림을 한국어에서 가장 강하게 전달하는 표현으로 “패륜”을 택했습니다.
theological_decisions:
- issue: 부정/더러움 언어를 제의적 범주로만 좁히지 않기
  chosen_reading: 그것으로 더럽혀지게 해서는 안 됩니다
  alternative_readings:
  - 그것으로 부정하게 되어서는 안 됩니다
  - 그것으로 자신을 더럽혀서는 안 됩니다
  rationale: 본문은 행위를 단순 규례 위반이 아니라 인간과 짐승의 경계를 어지럽히는 더러움으로 규정하므로, 정결 범주를 유지하면서도 윤리적 무게가 살아 있는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: תֶּבֶל의 평가어를 약화시키지 않기
  chosen_reading: 패륜입니다
  alternative_readings:
  - 혼돈입니다
  - 수치입니다
  - 타락입니다
  rationale: 이 단어는 질서의 파괴와 성적 일탈을 함께 함축하므로, 현대 한국어에서 그 강도를 분명히 전달하는 판단적 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 6
