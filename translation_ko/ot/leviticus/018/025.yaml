id: LEV.18.25
reference: Leviticus 18:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
  footnotes:
  - marker: a
    text: Or 'was defiled.' The Hebrew verb can be rendered either 'became unclean' or 'was defiled.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'I visited its iniquity upon it,' an idiom for calling guilt to account in judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'spewed out.' The Hebrew keeps the graphic image of vomiting to portray the land's expulsion of its inhabitants because of defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 땅이 부정해졌고[a], 내가 그 땅의 죄악을 그 땅에 물었으며[b], 그 땅이 그곳에 사는 주민들을 토해 냈습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀졌다.’ 히브리어 동사는 ‘부정해졌다’ 또는 ‘더럽혀졌다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 그 땅의 죄악을 그 땅 위에 찾아 물었다’입니다. 이는 심판으로 죄의 책임을 묻는다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내뱉었습니다.’ 히브리어는 부정 때문에 주민들을 내보내는 모습을 ‘토하다’라는 강한 이미지로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא / וַתָּקִא
  english_pob_choice: became unclean / vomited out
  chosen_korean: 부정하게 되었고 / 토해 냈습니다
  alternatives_korean:
  - 더럽혀졌고 / 내쫓았습니다
  - 부정해졌고 / 뱉어 냈습니다
  lexicon: WLC; HALOT
  rationale: טמא의 결과 상태는 제의적·도덕적 오염을 함께 담는 한국어 성경 문맥의 ‘부정하다’로 옮기고, קיא의 강한 비유는 완화하지 않고 ‘토해 냈습니다’로 살렸습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 땅덩이
  - 그 나라
  lexicon: HALOT
  rationale: 레위기 18장의 ארץ는 일반적 ‘땅’이 아니라 언약적·지리적 맥락의 특정 땅을 가리키므로 ‘그 땅’이 가장 정확합니다.
- source_word: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  english_pob_choice: I punished its iniquity upon it
  chosen_korean: 내가 그 땅의 죄악을 그것 위에 벌하였으며
  alternatives_korean:
  - 내가 그 땅의 죄를 그것 위에 방문하였으며
  - 내가 그 땅의 죄책을 그것 위에 물으셨으며
  lexicon: HALOT
  rationale: פקד + עון은 문자적으로는 ‘방문하다/기억하다’보다 심판적 ‘문책·벌함’의 관용구이므로, 신학적 책임 추궁의 뜻이 분명한 ‘벌하였으며’로 풀었습니다. ‘그것 위에’는 히브리어의 עָלֶיהָ를 따라 심판이 그 대상 위에 임함을 보존합니다.
- source_word: יֹשְׁבֶיהָ
  english_pob_choice: its inhabitants
  chosen_korean: 그 안에 사는 자들
  alternatives_korean:
  - 그 주민들
  - 거기 거주하는 자들
  lexicon: HALOT
  rationale: ישב의 분사형은 단순한 인구가 아니라 ‘거주하는 자들’을 가리키므로, 한국어에서는 자연스럽게 읽히는 ‘그 안에 사는 자들’로 옮겼습니다.
theological_decisions:
- issue: 땅의 인격화와 추방 이미지
  chosen_reading: ‘그 땅이 … 토해 냈습니다’라는 강한 의인화를 그대로 유지했습니다.
  alternative_readings:
  - ‘그 땅이 … 내쫓았습니다’로 완화함
  - ‘그 땅이 … 밖으로 몰아냈습니다’로 순화함
  rationale: 본문은 죄와 부정이 땅을 더럽히고, 땅이 거주민을 배출하는 생생한 이미지를 통해 심판과 추방을 연결합니다. 비유를 완화하면 레위기의 언약적 경고가 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §6
