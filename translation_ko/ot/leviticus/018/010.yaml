revisions:
- from: 너는 네 아들의 딸이나 네 딸의 딸의 알몸을 드러내어서는 안 됩니다. 그들의 알몸은 네 알몸이기 때문입니다.[a][b]
  to: 아들의 딸이나 딸의 딸의 알몸을 드러내서는 안 됩니다. 그들의 알몸은 당신의 알몸이기 때문입니다.[a][b]
  rationale: 합쇼체에 맞지 않는 ‘너는/네’의 혼합을 피하기 위해, 한국어에서 자연스러운 법규적 주어·소유어 생략을 적용했습니다. 결론절에는 ‘당신의’를 남겨 히브리어 2인칭 소유 표현을 보존했습니다. 각주 b는 원문의 친족 관계 배경을 설명하므로 문화 주석으로 조정했고, 본문과 각주 모두 원문의 완곡한 법률 관용구와 결론절의 긴장을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:22Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 친족 관계와 반복되는 히브리어 관용구를 충실히 옮겼습니다. 다만 합쇼체 공적 문체에서 ‘너는/네’와 ‘안 됩니다’의 결합은 말투가 섞이므로, 직접 지시의 의미는 유지하되 주어와 소유 대명사를 자연스럽게 생략하고 결론절에는 ‘당신’을 사용해 지시 대상을 분명히 하는 것이 좋습니다. 결론절의 ‘그들의 알몸은 당신의 알몸’은 히브리어의 의도적인 친족 동일시 표현을 보존합니다.
  naturalness: ‘아들의 딸이나 딸의 딸의 알몸을 드러내서는 안 됩니다’는 한국어 법규적 문맥에서 자연스럽고, 원문의 직접적인 금지를 유지합니다. 기존의 ‘너는 네 … 안 됩니다’는 비격식 2인칭 대명사와 합쇼체 종결이 혼합되어 있어 수정이 필요합니다.
  terminology: ‘알몸을 드러내다’는 גלה ערוה의 반복적 법률 관용구를 비교적 직역적으로 보존하는 선택으로 유지할 수 있습니다. 각주에서는 이것이 성관계 금지를 가리키는 관용구임을 밝혀 오해 가능성을 줄입니다. 문화적 설명에 해당하는 각주 b의 분류는 theological_note보다 cultural_note가 적절합니다.
  issues:
  - severity: medium
    issue: 본문의 인칭·높임말 혼합
    rationale: ‘너는 네’는 비격식 직접 호칭인데 종결이 합쇼체 ‘안 됩니다’이므로, 목표 문체인 현대 공적 합쇼체 안에서 어색합니다.
  - severity: low
    issue: 각주 b의 성격 분류
    rationale: 가까운 후손을 자기 가족의 연장으로 여기는 배경을 설명하는 내용이므로 교리적 주석이라기보다 문화·친족 관계 주석으로 분류하는 편이 정확합니다.
  revised_text: 아들의 딸이나 딸의 딸의 알몸을 드러내서는 안 됩니다. 그들의 알몸은 당신의 알몸이기 때문입니다.[a][b]
