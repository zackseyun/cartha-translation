  lexicon: HALOT
  rationale: 레위기 18장의 גלה ערוה 관용구를 한국어로 직역할 때, 성관계라는 뜻을 과하게 풀지 않으면서도 금지 규정의 반복된 법적 어감을 살리기 위해 ‘알몸’을 택했습니다.
- source_word: בַּת בִּנְךָ
