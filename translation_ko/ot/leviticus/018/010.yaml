  lexicon: HALOT
  rationale: 히브리어의 친족 연결 구조를 그대로 드러내기 위해 ‘네 아들의 딸’로 옮겨, 법조문의 정확한 계보 관계를 유지했습니다.
- source_word: בַת בִּתְּךָ
  english_pob_choice: your daughter's daughter
  chosen_korean: 네 딸의 딸
  alternatives_korean:
  - 네 외손녀
  - 네 딸의 여자아이
  lexicon: HALOT
  rationale: 앞 구와 평행하게 대응시키기 위해 직접적인 친족 표현을 유지했습니다.
- source_word: לֹא תְגַלֶּה
  english_pob_choice: You shall not uncover
  chosen_korean: 드러내어서는 안 됩니다
  alternatives_korean:
  - 벗겨서는 안 됩니다
  - 열어서는 안 됩니다
  lexicon: HALOT
  rationale: ‘uncover’의 직역을 살리되 한국어 법률문체에 맞게 자연스럽고 공적인 금지 표현으로 정리했습니다.
theological_decisions:
- issue: 마지막 절의 친족 근거 표현, 'for their nakedness is your own'
  chosen_reading: ‘그들의 알몸은 네 알몸이기 때문입니다’로 유지했습니다.
  alternative_readings:
  - 그들의 알몸은 네 것과 같습니다
  - 그들은 네 알몸이기 때문입니다
  rationale: 히브리어는 단순한 설명보다 친족의 연속성과 근친상간 금지의 내적 근거를 제시하므로, 그 긴장을 약화시키지 않고 비교적 문자적으로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
