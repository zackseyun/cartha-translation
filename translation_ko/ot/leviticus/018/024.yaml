  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
  footnotes:
  - marker: a
    text: Or 'Do not defile yourselves by any of these things ... the nations ... were defiled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 것들 가운데 어느 것으로도 자신을 더럽히지 마십시오[a]. 그것들 가운데 모든 것으로 그 내가 여러분 앞에서 쫓아내는 민족들이 더러워졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이런 것들 가운데 어느 것으로도 자신을 더럽히지 말라 … 민족들이 … 더럽혀졌다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  english_pob_choice: Do not make yourselves unclean
  chosen_korean: 자신을 더럽히지 마십시오
  alternatives_korean:
  - 자신을 부정하게 하지 마십시오
  - 자신을 부정한 상태로 만들지 마십시오
  lexicon: HALOT
  rationale: 히트파엘의 자기 관련성을 살리면서도 현대 한국어에서 자연스러운 금지형으로 옮겼습니다. '더럽히다'는 레위기 성결 문맥의 오염 의미를 비교적 직접적으로 전달합니다.
- source_word: בְּכָל אֵלֶּה
  english_pob_choice: by any of these things
  chosen_korean: 이런 것들 가운데 어느 것으로도
  alternatives_korean:
  - 이런 것들로
  - 이런 것들 가운데 어떤 것으로도
  lexicon: HALOT
  rationale: ב + 'all these'의 수단/범위 의미를 반영해, 금지의 적용 범위를 분명하게 드러냈습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: HALOT
  rationale: 이 문맥에서는 가나안의 토착 집단을 가리키므로 '민족들'이 가장 자연스럽고, '이방'은 한국어 교회어감이 강해 보류했습니다.
- source_word: אֲנִי מְשַׁלֵּחַ מִפְּנֵיכֶם
  english_pob_choice: I am driving out before you
  chosen_korean: 내가 여러분 앞에서 쫓아내는
  alternatives_korean:
  - 내가 여러분 앞에서 내쫓는
  - 내가 여러분 앞에서 몰아내는
  lexicon: HALOT
  rationale: שׁלח가 심판-정복 문맥에서 '몰아내다/쫓아내다'의 뜻을 가지므로, 단순히 '보내다'보다 '쫓아내다'가 원문 힘을 더 잘 드러냅니다.
theological_decisions:
- issue: טמא 동사의 번역을 '부정하게 되다'로 완곡하게 할지, '더럽히다/더러워지다'로 직접 옮길지
  chosen_reading: '''더럽히다''를 사용해 의례적 오염의 실재성을 드러냈습니다.'
  alternative_readings:
  - 부정하게 하다 / 부정하게 되다
  - 더러워지다
  rationale: 레위기 18장은 금지된 행위가 실제로 공동체를 오염시키는 것으로 서술하므로, 의미를 약화시키지 않으면서도 현대어로 직역에 가까운 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: כִּי의 인과 관계
  chosen_reading: '''...때문입니다''로 앞 금지의 근거를 분명히 했습니다.'
  alternative_readings:
  - 왜냐하면
  - '...이므로'
  rationale: כִּי가 제시하는 이유를 한국어의 자연스러운 인과 종결로 옮겨, 경고와 근거의 연결을 명확히 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
