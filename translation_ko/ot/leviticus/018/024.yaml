  source_fidelity: 히브리어의 금지, 오염의 근거, 그리고 하나님께서 이스라엘 앞에서 내쫓고 계시는 민족이라는 관계를 대체로 반영했습니다. 그러나 현 문안의 둘째 문장에 있는 “그 내가”와 “그것들 가운데 모든 것으로”는 원문에 없는 요소이거나 한국어 문장 구조상 성립하지 않아 수정이 필요합니다. נִטְמְאוּ의 결과 상태는 “더러워졌습니다”로 자연스럽게 옮길 수 있습니다.
  naturalness: 첫 문장의 “이런 것들 가운데 어느 것으로도”는 가능하지만, 둘째 문장은 비문입니다. “이 모든 것으로”를 사용하고 주어절을 바로 연결하면 현대 표준 한국어 합쇼체로 명료하고 자연스럽습니다.
  terminology: טמא 계열을 “더럽히다/더러워지다”로 일관되게 번역한 것은 레위기의 오염 어휘를 보존하는 적절한 선택입니다. הַגּוֹיִם은 이 문맥에서 “민족들”이 적절하며, מְשַׁלֵּחַ מִפְּנֵיכֶם은 “여러분 앞에서 쫓아내는”으로 무리 없이 반영됩니다.
