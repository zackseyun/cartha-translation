    text: 또는 ‘죽임을 당할 것입니다’ 혹은 ‘공동체에서 제외될 것입니다’로 이해할 수도 있습니다. 히브리어는 ‘끊어질 것입니다’라고만 하며, 처벌 방식은 특정하지 않습니다.
    reason: alternative_reading
