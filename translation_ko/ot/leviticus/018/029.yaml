  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
  footnotes:
  - marker: a
    text: Or, 'shall be put to death' or 'shall be excluded from the community'; the Hebrew says 'shall be cut off,' without specifying the exact mode of judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 이 모든 가증한 일들 가운데 하나라도 행하는 사람들은 자기 백성 가운데서 끊어질 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽임을 당할 것입니다’ 혹은 ‘공동체에서 제외될 것입니다’로 이해할 수도 있습니다. 히브리어는 ‘끊어질 것입니다’라고만 하며, 처벌 방식은 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 금지 조항에 이어지는 결과·근거를 자연스럽게 잇는 말로, 문맥상 이유보다 결론을 드러내는 한국어 연결이 더 적절합니다.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה
  english_pob_choice: whoever does
  chosen_korean: 하나라도 행하는 자
  alternatives_korean:
  - 누구든지 행하는 자
  - 모두 행하는 자
  lexicon: HALOT
  rationale: עָשָׂה의 기본 의미를 살리면서, 보편적 조건절을 한국어로 자연스럽게 옮기기 위해 ‘하나라도’와 ‘행하는 자’를 사용했습니다.
- source_word: מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה
  english_pob_choice: any of all these abominations
  chosen_korean: 이 모든 가증한 일들 가운데 하나라도
  alternatives_korean:
  - 이 모든 가증한 것들 가운데 하나라도
  - 이 모든 혐오스러운 일들 가운데 하나라도
  lexicon: HALOT
  rationale: תּוֹעֵבוֹת는 의례적·도덕적으로 강한 혐오 표현이므로 ‘가증한 일들’로 옮기고, מִן과 כֹּל의 중첩된 포괄성을 ‘가운데 하나라도’로 살렸습니다.
- source_word: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  english_pob_choice: shall be cut off from among their people
  chosen_korean: 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 자기 백성 가운데서 끊어질 것입니다
  - 자기 백성 가운데서 제거될 것입니다
  - 자기 백성 가운데서 끊어져 나갈 것입니다
  lexicon: HALOT
  rationale: כרת의 법적 관용구를 직역에 가깝게 보존해, 구체적 집행 방식이 본문에 명시되지 않은 긴장을 유지했습니다.
- source_word: הַנְּפָשׁוֹת
  english_pob_choice: the persons
  chosen_korean: 그 사람들은
  alternatives_korean:
  - 그 사람들은
  - 그 영혼들은
  - 그 생명들은
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 ‘사람들/개인들’로 읽는 것이 자연스럽고, 한국어에서는 ‘영혼들’보다 책임 주체를 분명히 드러내는 표현이 적절합니다.
theological_decisions:
- issue: 절단형 제재의 정확한 성격
  chosen_reading: ‘끊어질 것입니다’로 직역적 관용구를 유지해, 죽음·추방·공동체 배제 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 공동체에서 제외될 것입니다
  rationale: 히브리어 משפט적 관용구 וְנִכְרְתוּ는 제재의 방식 자체를 명시하지 않으므로, 본문이 가진 해석의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
