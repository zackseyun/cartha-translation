  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
  footnotes:
  - marker: a
    text: Or, 'shall be put to death' or 'shall be excluded from the community'; the Hebrew says 'shall be cut off,' without specifying the exact mode of judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 이 모든 가증한 일들 가운데 하나라도 행하는 자는, 그를 행하는 그 사람들은 자기 백성 가운데서 끊어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽임을 당할 것입니다’ 혹은 ‘공동체에서 제외될 것입니다’로도 옮길 수 있습니다. 히브리어는 ‘끊어질 것입니다’라고만 하며, 처벌 방식은 특정하지 않습니다.
    reason: alternative_reading
