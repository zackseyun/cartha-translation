revisions:
- from: 그러므로 이 모든 가증한 일들 가운데 하나라도 행하는 자는, 그를 행하는 그 사람들은 자기 백성 가운데서 끊어질 것입니다.[a]
  to: 이는 이 모든 가증한 일들 가운데 하나라도 행하는 사람들은 자기 백성 가운데서 끊어질 것이기 때문입니다.[a]
  rationale: The revision corrects the defective Korean reference and repetition, retains the universal scope (‘이 모든 ... 가운데 하나라도’), renders the explanatory כִּי with ‘이는 ... 때문입니다,’ and continues to preserve the ambiguity of the Hebrew cut-off formula in both text and note.
