id: LEV.18.20
reference: Leviticus 18:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: And you shall not give your emission to the wife of your fellow man[a], to become unclean with her.
  footnotes:
  - marker: a
    text: Hebrew literally, 'you shall not give your lying/emission for seed to the wife of your fellow.' The expression is an idiom for sexual intercourse involving seminal emission.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너는 네 이웃의 아내와 성관계를 가져, 그 아내와 함께 자신을 부정하게 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 누움을 씨를 위하여 주어’라고 합니다. 이 표현은 이 문맥에서 정액의 배출을 수반하는 성관계를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  english_pob_choice: the wife of your fellow man
  chosen_korean: 네 이웃의 아내
  alternatives_korean:
  - 네 동료의 아내
  - 네 동네 사람의 아내
  - 네 이웃의 아내
  lexicon: HALOT
  rationale: עֲמִית는 공동체 안의 '동료/이웃'에 가까우며, 이 법문맥에서는 관계적·윤리적 뉘앙스를 살려 '이웃'으로 옮기는 것이 자연스럽습니다.
- source_word: לֹא תִתֵּן
  english_pob_choice: you shall not give
  chosen_korean: 네 ... 주어서는 안 됩니다
  alternatives_korean:
  - 주면 안 됩니다
  - 주어서는 안 됩니다
  - 주지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어의 금지형을 한국어 법문체로 살리기 위해 '주어서는 안 됩니다'를 택했고, 본문의 동사 נתן의 '주다'를 유지했습니다.
- source_word: שְׁכָבְתְּךָ לְזָרַע
  english_pob_choice: your emission
  chosen_korean: 네 잠자리
  alternatives_korean:
  - 네 배출
  - 네 정액
  - 네 성교
  lexicon: HALOT
  rationale: 직역하면 '잠자리에 듦/누움'이지만, 앞뒤의 '주다'와 '씨앗을 위해'라는 결합은 성관계와 정액의 배출을 가리키는 관용구이므로, 과도하게 해부학적이지 않으면서도 행위를 드러내는 '잠자리'로 옮겼습니다.
- source_word: לְטָמְאָה בָהּ
  english_pob_choice: to become unclean with her
  chosen_korean: 그와 함께 부정해져서는 안 됩니다
  alternatives_korean:
  - 그와 함께 더러워져서는 안 됩니다
  - 그녀로 인해 부정해져서는 안 됩니다
  - 그와 함께 부정하게 되어서는 안 됩니다
  lexicon: HALOT
  rationale: טמא의 법적·의례적 의미를 살려 전통적인 '부정하다'를 사용했고, בָּהּ는 관계를 나타내는 '그와 함께'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 성관계 금지와 의례적 부정의 결합
  chosen_reading: 이 구절은 단순한 혼외 정조 규범이 아니라, 다른 남자의 아내와의 성관계를 금지하면서 그 결과를 '부정'으로 제시합니다.
  alternative_readings:
  - '''네 이웃의 아내와 성관계를 갖지 말아야 합니다''로 의역하여 행위 자체만 강조할 수 있습니다.'
  - '''더럽혀져서는 안 됩니다''로 일반 윤리어로 풀 수 있습니다.'
  rationale: 본문은 행위와 결과를 함께 말하므로, 성행위의 관용구와 부정 언어를 모두 보존해야 합니다.
  doctrine_reference: Leviticus 18의 정결/부정 규정과 혼인 경계 유지
