lexical_decisions:
- source_word: זָכָר
  english_pob_choice: a male
  chosen_korean: 남자
  alternatives_korean:
  - 수컷
  - 남성
  lexicon: HALOT
  rationale: 이 구절의 법문맥에서는 성별이 있는 남성을 가리키므로, 현대 한국어에서 자연스럽고 이해하기 쉬운 ‘남자’로 옮겼습니다. ‘수컷’은 지나치게 동물적이고, ‘남성’은 법적·생물학적 성별보다 추상적입니다.
- source_word: תִשְׁכַּב
  english_pob_choice: you shall not lie
  chosen_korean: 동침하듯이 누우면 안 됩니다
  alternatives_korean:
  - 누우면 안 됩니다
  - 성관계를 가지면 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 성적 완곡법을 살리면서도 한국어 독자가 의미를 알아듣도록 ‘동침하듯이’로 성격을 드러냈습니다. ‘성관계’는 의미는 분명하지만 원문의 완곡성과 법문체를 약화시킵니다.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  english_pob_choice: as one lies with a woman
  chosen_korean: 여자와 동침하듯이
  alternatives_korean:
  - 여자와 누우는 것처럼
  - 여자와 관계하듯이
  lexicon: HALOT
  rationale: 문법적으로는 ‘여자의 동침들’에 해당하는 관용구이므로, 그 의미를 한국어의 자연한 표현으로 풀어 ‘여자와 동침하듯이’로 옮겼습니다. POB의 주석이 지적하듯이 이는 단순한 수면이 아니라 성적 결합을 가리킵니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 혐오스러운 일
  - 역겨운 일
  lexicon: HALOT
  rationale: 레위기 성결법에서 תּוֹעֵבָה의 강한 도덕·종교적 혐오를 보존하려고, 한국어 성경에서 익숙하면서도 강한 ‘가증한 일’을 택했습니다. ‘혐오스러운’은 의미는 맞지만 법문체의 무게가 약합니다.
theological_decisions:
- issue: 절의 범위와 해석을 지나치게 좁히지 않음
  chosen_reading: 히브리어가 직접 말하는 대로, 남자와 여자처럼 동침하는 행위를 금하는 문장으로 옮기고 특정한 남용 유형으로 제한하지 않았습니다.
  alternative_readings:
  - 착취적 관계나 의례적 행위로만 좁혀 번역하기
  - 현대 윤리 논쟁을 반영해 해석을 확장하기
  rationale: 본문에는 금지의 대상과 비교 표현, 그리고 ‘가증한 일’이라는 판정만 있으며, 추가적 제한 범주는 제시되지 않습니다. 번역은 본문이 말하는 만큼만 말해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; do not import limiting qualifiers not stated in the Hebrew.'
