id: LEV.18.19
reference: Leviticus 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
  footnotes:
  - marker: a
    text: Or, 'during her menstrual impurity.' The Hebrew uses ritual-purity language.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 여자의 월경 부정결 기간에 가까이하여 그녀의 하체를 드러내지 말아야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 월경 부정결 중에’. 히브리어는 제의적 정결 언어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל + לֹא תִקְרַב
  english_pob_choice: You shall not approach
  chosen_korean: 가까이하여 … 말아야 합니다
  alternatives_korean:
  - 다가가서는 안 됩니다
  - 접근해서는 안 됩니다
  lexicon: HALOT
  rationale: קָרַב과 אֶל의 결합은 단순 이동보다 성적 금지 맥락의 ‘가까이함’으로 읽히므로, 법조문체를 유지하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 여자
  alternatives_korean:
  - 여인
  - 아내
  lexicon: HALOT
  rationale: 여기서는 소유 관계가 없는 일반적 대상이므로 ‘아내’보다 ‘여자’가 범위를 더 정확히 반영합니다.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  english_pob_choice: during her menstrual uncleanness
  chosen_korean: 월경 부정결 기간에
  alternatives_korean:
  - 월경 부정 기간에
  - 월경의 부정결 중에
  lexicon: HALOT
  rationale: נִדָּה와 טֻמְאָה는 레위기적 정결 범주의 언어이므로, 의료적 표현으로 바꾸지 않고 ‘부정결’로 그 제의적 성격을 살렸습니다.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  english_pob_choice: to uncover her nakedness
  chosen_korean: 그녀의 하체를 드러내지
  alternatives_korean:
  - 그녀의 벌거벗음을 드러내지
  - 그녀의 은밀한 곳을 드러내지
  lexicon: HALOT
  rationale: ‘uncover nakedness’는 레위기 18장의 관용적 성적 완곡어법이므로, 직역적이면서도 한국어에서 과도하게 노골적이지 않은 ‘하체를 드러내다’로 옮겼습니다.
theological_decisions:
- issue: 정결 언어를 도덕적/위생적 표현으로 완화할지 여부
  chosen_reading: 제의적·정결적 부정결로 유지합니다.
  alternative_readings:
  - 월경 기간
  - 위생상 부정함
  rationale: 히브리어 טֻמְאָה는 레위기 문맥에서 제의적 부정결을 가리키므로, 현대적 위생 개념으로 바꾸지 않고 본문의 범주를 보존했습니다.
  doctrine_reference: 원어 우선 번역; 레위기 정결 규례의 문맥 유지
