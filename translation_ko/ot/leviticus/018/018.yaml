revisions:
- from: 너는 어떤 여자를 그 여자의 자매에 더하여 아내로 취해서는 안 됩니다. 그렇게 하여 그 여자의 벌거벗음을 드러내는 일이, 그 자매가 아직 살아 있는 동안에 일어나게 해서는 안 됩니다.[a]
  to: 너는 어떤 여자의 자매를 그 여자에게 더하여 아내로 맞아들여, 그들이 서로 경쟁하게 하려고 그 여자가 살아 있는 동안 그 자매의 벌거벗음을 드러내서는 안 됩니다.[a]
  rationale: 수정은 원문의 핵심 어휘와 구문을 모두 반영합니다. ‘어떤 여자의 자매를 그 여자에게 더하여’는 אִשָּׁה אֶל־אֲחֹתָהּ의 관계를 한국어로 명료하게 풀고, ‘그들이 서로 경쟁하게 하려고’는 לִצְרֹר를 보존합니다. ‘그 여자가 살아 있는 동안 그 자매의 벌거벗음을 드러내다’는 עָלֶיהָ בְּחַיֶּיהָ의 생존 제한 및 לְגַלּוֹת עֶרְוָתָהּ의 관용구를 반영합니다. 두 여성의 대명사 지시를 명시하여 한국어에서 생길 수 있는 혼동을 줄였으며, 원문이 첫 자매의 사후 혼인 여부까지 명시적으로 판단하지 않는 점도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:22Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 לִצְרֹר(경쟁 관계가 되게 하려고)의 뜻을 누락하고, ‘그 여자의 자매에 더하여’라는 표현으로 두 자매의 관계 및 지시 대상을 불명확하게 만들었습니다. 또한 ‘벌거벗음을 드러내는 일이 … 일어나게 해서는 안 됩니다’는 원문의 직접적인 법적 금지와 부정확하게 대응합니다. 수정문은 한 여자의 자매를 그 여자에게 더하여 아내로 맞아들이는 행위, 곧 두 자매가 경쟁 관계가 되게 하는 행위를 금하며, 첫 여자가 생존한 동안 둘째 자매의 ‘벌거벗음’을 드러내지 말라는 구조를 반영합니다.
  naturalness: ‘어떤 여자의 자매를 그 여자에게 더하여’는 법문으로 자연스럽고, 뒤의 ‘그들이 서로 경쟁하게 하려고’가 לִצְרֹר의 목적을 분명히 합니다. ‘벌거벗음을 드러내다’는 레위기의 관용적 표현을 보존하면서도 현대 표준 한국어에서 이해 가능합니다.
  terminology: ‘아내로 맞아들이다’는 תִקָּח의 혼인 문맥을 자연스럽게 드러내며, ‘벌거벗음을 드러내다’는 גלה ערוה의 관용구를 일관되게 옮깁니다. ‘경쟁하게 하다’는 צרר의 이 문맥상 경쟁·대립 관계를 무리 없이 반영합니다.
  issues:
  - severity: high
    issue: לִצְרֹר의 의미가 본문에서 빠져 있습니다.
    rationale: 초안은 이를 ‘벌거벗음을 드러내는 일이’로 배정했으나, 이는 뒤의 לְגַלּוֹת עֶרְוָתָהּ에 해당합니다. 두 자매를 경쟁 관계에 놓는 목적을 본문에 반영해야 합니다.
  - severity: high
    issue: 지시 대상과 관계가 불명확합니다.
    rationale: ‘어떤 여자를 그 여자의 자매에 더하여’는 어느 여자를 누구에게 더하는지 명료하지 않고, 원문이 금하는 ‘한 여자의 자매를 그 여자에게 더하여 취함’을 자연스럽게 전달하지 못합니다.
  - severity: medium
    issue: 금지문의 문법적 연결이 원문보다 우회적입니다.
    rationale: ‘일이 일어나게 해서는 안 됩니다’는 성적 관용구를 비인칭 사건으로 바꾸며, 원문의 ‘취해서는 안 된다 … 드러내려고’라는 직접적 법문 구조를 약화합니다.
  - severity: low
    issue: 각주가 본문의 관계를 충분히 명확히 하지 못합니다.
    rationale: 대안 번역은 유지할 수 있으나, ‘첫 자매’와 ‘그 자매’의 지시가 혼동될 수 있으므로 두 자매의 관계와 생존 시간 제한을 명료하게 밝혀야 합니다.
