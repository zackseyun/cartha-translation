source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
  footnotes:
  - marker: a
    text: Or, 'And you shall not take a woman in addition to her sister, to make her a rival.' The Hebrew is compact and may be rendered more literally, but the sense is a prohibition against taking one sister as an additional wife during the other sister's lifetime.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 어떤 여자의 자매를 그 여자에게 더하여 아내로 맞아들여, 그들이 서로 경쟁하게 하려고 그 여자가 살아 있는 동안 그 자매의 벌거벗음을 드러내서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘너는 어떤 여자의 자매를 그 여자에게 더하여, 경쟁하게 하려고 맞아들이며 그 자매의 벌거벗음을 드러내서는 안 됩니다.’ 히브리어 표현은 압축적입니다. 뜻은 한 여자가 살아 있는 동안 그 여자의 자매를 추가 아내로 맞아들여 두 자매가 경쟁 관계가 되게 하는 것을 금한다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 어떤 여자를
  alternatives_korean:
  - 한 여자를
  - 아내를
  lexicon: HALOT
  rationale: 이 법 조항은 결혼 관계를 전제하지만, מקור의 אִשָּׁה 자체는 ‘여자/아내’ 모두 가능하므로 한국어에서는 ‘여자’를 기본으로 두고 뒤의 ‘아내로 취해서는’로 혼인 의미를 살렸습니다.
- source_word: אֶל אֲחֹתָהּ
  english_pob_choice: in addition to her sister
  chosen_korean: 그 여자의 자매에 더하여
  alternatives_korean:
  - 그 자매 곁에
  - 그 자매와 함께
  lexicon: HALOT
  rationale: 직역하면 ‘그 자매에게/쪽으로’이지만, 문맥상 한 여인에 더해 그 자매를 취하는 추가 결합을 가리키므로 한국어에서는 관계를 드러내는 ‘더하여’로 옮겼습니다.
- source_word: לִצְרֹר
  english_pob_choice: as a rival
  chosen_korean: 벌거벗음을 드러내는 일이
  alternatives_korean:
  - 원수로 삼는 일이
  - 경쟁자로 만드는 일이
  lexicon: HALOT
  rationale: 영어 POB는 이 항목을 rivalry로 풀었지만, 히브리어 핵심 금지는 뒤의 성적 금기 표현과 결합된 법적 금지이므로 한국어 본문에서는 문장 구조를 따라 결과를 자연스럽게 연결하고, 경쟁/대립의 뉘앙스는 전체 문장으로 유지했습니다.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  english_pob_choice: to uncover her nakedness
  chosen_korean: 벌거벗음을 드러내는
  alternatives_korean:
  - 하체를 드러내는
  - 알몸을 드러내는
  lexicon: HALOT
  rationale: 레위기의 관용구를 한국어에서도 투명하게 보존하되, 성적 행위를 직접 풀어쓰지 않고 ‘벌거벗음’을 유지해 원문 표현과 법적 격식을 살렸습니다.
- source_word: בְּחַיֶּיהָ
  english_pob_choice: while her sister is still alive
  chosen_korean: 그 자매가 아직 살아 있는 동안에
  alternatives_korean:
  - 그 자매의 생전에
  - 그 자매가 살아 있는 동안
  lexicon: HALOT
  rationale: 마지막 시간 제한은 ‘생전/살아 있는 동안’의 의미이므로, 앞의 친족 지시어가 분명하도록 ‘그 자매’로 구체화했습니다.
theological_decisions:
- issue: 이 절의 금지가 사촌혼/중복혼의 범위를 어디까지 가지는가
  chosen_reading: 한 여인을 그녀의 자매가 아직 살아 있는 동안 추가 아내로 취하는 행위를 금지하는 조항으로 읽었습니다.
  alternative_readings:
  - 자매 사이의 적대만을 금지하는 일반 원리로 읽는 견해
  - 첫 아내가 죽은 뒤의 혼인까지 포괄해 두 자매와의 혼인을 전면 금지하는 견해
  rationale: 히브리어의 간결한 법문과 마지막 시간절이 함께 작동해, 살아 있는 첫 자매에게 추가되는 혼인 관계를 직접 금하는 의미가 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
