translation:
  language: ko
  text: 당신은 형제의 아내의 벌거벗음을 드러내어서는 안 됩니다. 그것은 당신의 형제의 벌거벗음입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '당신은 형제의 아내의 벌거벗음을 드러내어서는 안 됩니다'입니다. 히브리어는 여기서 '벌거벗음을 드러내다'라는 관용구를 사용하며, 뜻은 성관계 금지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  english_pob_choice: the nakedness of
  chosen_korean: 벌거벗음
  alternatives_korean:
  - 수치
  - 음부
  - 나체
  lexicon: HALOT
  rationale: 레위기 18장의 관용구 גלה ערוה는 금지된 성적 노출/관계를 가리키는 법률적 완곡어법이므로, 본문 구조를 살려 '벌거벗음'으로 옮겼습니다.
- source_word: אֵשֶׁת
  english_pob_choice: wife of
  chosen_korean: 아내
  alternatives_korean:
  - 여자
  - 부인
  lexicon: HALOT
  rationale: 문맥상 'your brother’s wife'이므로 단순한 '여자'보다 결혼 관계를 분명히 드러내는 '아내'가 더 정확합니다.
- source_word: לֹא תְגַלֶּה
  english_pob_choice: you shall not uncover
  chosen_korean: 드러내어서는 안 됩니다
  alternatives_korean:
  - 벌거벗음을 보아서는 안 됩니다
  - 드러내지 마십시오
  lexicon: HALOT
  rationale: 법문 맥락의 금지형을 한국어의 정중한 금지 표현으로 옮기되, 'uncover'의 동작성을 보존하기 위해 '드러내다'를 선택했습니다.
- source_word: עֶרְוַת אָחִיךָ הִוא
  english_pob_choice: it is your brother’s nakedness
  chosen_korean: 그것은 당신의 형제의 벌거벗음입니다
  alternatives_korean:
  - 그것은 당신의 형제에게 속한 벌거벗음입니다
  - 그것은 형제의 수치입니다
  lexicon: HALOT
  rationale: 반복된 '벌거벗음'을 그대로 살려 법적 논리를 유지했습니다. '그것은…입니다'는 히브리어 절의 판정문 구조를 자연스럽게 반영합니다.
theological_decisions:
- issue: 레위기의 성적 금지 관용구를 직설적으로 풀어쓸지, 본문의 완곡어법을 유지할지
  chosen_reading: 주본문에서는 '벌거벗음' 관용구를 유지했습니다.
  alternative_readings:
  - 형제의 아내와 성관계를 가져서는 안 됩니다
  rationale: 히브리어가 법률적 완곡어법을 사용하므로, 주본문에서 이를 풀어버리기보다 반복어를 보존하는 편이 원문 구조와 레위기 18장 전체의 어휘 일관성에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-driven legal euphemism'
