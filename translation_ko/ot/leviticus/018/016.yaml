  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'You shall not have sexual relations with your brother’s wife.' The Hebrew uses the idiom 'uncover the nakedness.'
