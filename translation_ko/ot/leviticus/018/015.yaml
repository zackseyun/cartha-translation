  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유 접미사는 직접적인 친족 관계를 가리키므로 표준 한국어 친족어인 ‘며느리’로 옮겼습니다.
- source_word: אֵשֶׁת בִּנְךָ
  english_pob_choice: your son's wife
  chosen_korean: 네 아들의 아내
  alternatives_korean:
  - 네 아들의 처
  - 아들의 아내
  lexicon: HALOT
  rationale: 앞 문장의 ‘며느리’를 설명하는 동격 구문이므로, 관계를 풀어 ‘네 아들의 아내’라고 옮겨 의미를 분명히 했습니다.
- source_word: תְגַלֵּה / תְגַלֶּה
  english_pob_choice: you shall not uncover
  chosen_korean: 드러내서는 안 됩니다
  alternatives_korean:
  - 벗겨서는 안 됩니다
  - 노출해서는 안 됩니다
  - 범해서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 법률적 관용구를 너무 노골적으로 풀지 않으면서도 현대 한국어 독자에게 자연스럽게 전달하기 위해 ‘드러내다’를 사용했습니다.
theological_decisions:
- issue: ‘알몸을 드러내다’라는 레위기 18장의 성적 금지 관용구 보존
  chosen_reading: 직접적인 성행위 설명으로 바꾸지 않고, 금지 관용구를 최대한 보존했습니다.
  alternative_readings:
  - 성관계를 가져서는 안 됩니다
  - 성적으로 가까이해서는 안 됩니다
  rationale: 본문은 근친상간 금지의 법률적 표현을 사용하므로, 의미는 분명하되 관용구 자체를 유지하는 것이 원문의 형식과 반복 구조를 살립니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
