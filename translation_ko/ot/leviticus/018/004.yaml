  naturalness: A modern formal-polite rendering requires -십시오/-입니다 endings. ‘그 가운데로 행하다’ is especially awkward; ‘그것들을 따라 살아가다’ naturally conveys the Hebrew conduct idiom, with a note preserving the literal metaphor.
  terminology: ‘법규’ for מִשְׁפָּטַי and ‘규례’ for חֻקֹּתַי maintain a useful distinction. ‘야훼’ appropriately renders יהוה, and ‘하나님’ appropriately renders אֱלֹהֵיכֶם in this Korean Bible register.
