lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여
  alternatives_korean:
  - 말하여
  - 이르시며
  lexicon: HALOT
  rationale: 서술적 진행을 나타내는 דבר의 서술형을 한국어에서는 ‘말씀하다’로 옮기되, 이어지는 לֵּאמֹר와 함께 자연스럽게 연결되도록 ‘말씀하여’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사인 신명은 전통적 대체어 ‘주’가 아니라 학술 전사에 따른 ‘야훼’로 옮겨 이름 자체를 보존했습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향하여
  - 모세에게로
  lexicon: HALOT
  rationale: אֶל은 발화의 수신자를 표시하므로 한국어에서는 자연스러운 여격 조사 ‘-에게’를 사용했습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하며
  - 이르시기를
  lexicon: HALOT
  rationale: 히브리어 서술 공식의 종결 표지인 לֵּאמֹר를 단순 반복하지 않고, 한국어 성경체에 맞게 발화 개시를 드러내는 연결 표현으로 반영했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 직접 음역했습니다.
  alternative_readings:
  - ‘주’로 치환
  - ‘여호와’ 사용
  rationale: 본문은 야훼의 직접 발화를 시작하는 서두이므로, 이름 자체를 보존하는 POB 원칙을 따라 고유명사로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
