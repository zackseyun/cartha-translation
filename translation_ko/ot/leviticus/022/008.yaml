- from: 그는 자연사한 짐승이나 들짐승에게 찢긴 짐승을 먹어서는 안 됩니다. 그것으로 자신을 부정하게 할 것이기 때문입니다. 나는 야훼입니다.[a]
  to: 그는 저절로 죽은 짐승이나 들짐승에게 찢긴 짐승[a]을 먹어서, 그것으로 자신을 부정하게 해서는 안 됩니다. 나는 야훼입니다.
  rationale: The revision removes the unstated causal ‘because,’ expresses ritual impurity as the consequence bound to the prohibited eating, and replaces the potentially narrow ‘자연사한’ with ‘저절로 죽은.’ It also moves the lexical footnote to its proper anchor and gives a nonduplicative alternative. The formal-polite legal register and the project rendering ‘야훼’ are retained.
