id: LEV.22.8
reference: Leviticus 22:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, 'He shall not eat what dies naturally or is torn by beasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자연사한 짐승이나 들짐승에게 찢긴 짐승을 먹어서는 안 됩니다. 그것으로 자신을 부정하게 할 것이기 때문입니다. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자연적으로 죽은 짐승이나 들짐승에게 찢긴 짐승’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  english_pob_choice: an animal found dead
  chosen_korean: 자연사한 짐승
  alternatives_korean:
  - 죽은 짐승
  - 시체가 된 짐승
  - 사체
  lexicon: HALOT
  rationale: 희생 규정 문맥에서 נְבֵלָה는 정당하게 도살되지 않고 죽은 짐승을 가리키므로, 현대 한국어에서는 의미를 분명히 하는 ‘자연사한 짐승’이 가장 자연스럽습니다.
- source_word: וּטְרֵפָה
  english_pob_choice: or torn by beasts
  chosen_korean: 들짐승에게 찢긴 짐승
  alternatives_korean:
  - 찢긴 짐승
  - 짐승에게 찢긴 짐승
  lexicon: HALOT
  rationale: טְרֵפָה는 포식자에게 찢겨 죽은 짐승을 뜻하므로, 가해 주체를 드러내는 ‘들짐승에게 찢긴 짐승’으로 옮겨 금지의 대상을 분명히 했습니다.
- source_word: לֹא יֹאכַל
  english_pob_choice: He shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 말아야 합니다
  - 먹어서는 안 됩니다
  - 먹으면 안 됩니다
  lexicon: HALOT
  rationale: 법문체의 금지를 현대 한국어 합쇼체로 옮기기 위해 ‘먹어서는 안 됩니다’를 택해, 규정의 명령성을 유지했습니다.
- source_word: לְטָמְאָה בָהּ
  english_pob_choice: making himself unclean by it
  chosen_korean: 그것으로 자신을 부정하게 할 것이기 때문입니다
  alternatives_korean:
  - 그것으로 자신을 더럽히기 때문입니다
  - 그것으로 부정해지기 때문입니다
  - 그것으로 자신을 부정하게 하므로
  lexicon: HALOT
  rationale: טָמֵא의 제의적 의미를 살리기 위해 도덕적 ‘더럽히다’보다 ‘부정하게 하다/부정하다’를 사용했고, 결과절의 힘을 ‘—기 때문입니다’로 자연스럽게 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HB/לקסיקון 기본 용례
  rationale: 본문 끝의 언약명은 본 프로젝트 기본값에 따라 ‘야훼’로 표기하여 고유명과 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: 제의적 부정함의 번역
  chosen_reading: ‘부정하게 하다’로 옮겨 제의적 상태 변화를 드러냈습니다.
  alternative_readings:
  - ‘더럽히다’로 완화할 수 있습니다
  - ‘부정해지다’로 수동적으로 옮길 수 있습니다
  rationale: 본문의 초점은 윤리적 오염이 아니라 성소 규정에 따른 정결/부정 상태의 전환이므로, 제의적 뉘앙스를 유지하는 번역이 필요합니다.
  doctrine_reference: Leviticus purity-law context; טמא terminology
- issue: 하나님 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 표준에 따라 יְהוָה는 음역형 ‘야훼’로 옮겨, 본문이 지닌 언약 이름의 직접성을 보존합니다.
  doctrine_reference: Project glossary — יְהוָה / YHWH
