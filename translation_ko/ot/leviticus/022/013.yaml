  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
  footnotes:
  - marker: a
    text: Literally, 'her father’s bread.' Here 'bread' likely refers more broadly to the food provisions of the priestly household.
    reason: lexical_alternative
  - marker: b
    text: Or 'no unauthorized person.' The Hebrew term refers to someone outside the permitted priestly circle, not necessarily a foreigner by ethnicity.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 제사장의 딸이 과부가 되거나 이혼당하여 자식이 없게 되고, 자기 젊은 시절과 같이 아버지의 집으로 돌아오면, 아버지의 음식을 먹을 수 있습니다. 그러나 아무 외인은 그것을 먹을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 아버지의 빵’입니다. 여기서는 제사장 가문의 식량/배급을 더 넓게 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘외인’은 반드시 민족적 이방인을 뜻하기보다, 허용된 제사장 범위 밖의 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  english_pob_choice: a priest’s daughter
  chosen_korean: 제사장의 딸
  alternatives_korean:
  - 제사장 딸
  lexicon: WLC/HALOT
  rationale: 소유격 관계를 자연스러운 한국어로 옮기되, 제사장 가문의 딸이라는 소속 관계를 분명히 드러냈습니다.
- source_word: אַלְמָנָה וּ/גְרוּשָׁה
  english_pob_choice: a widow or divorced
  chosen_korean: 과부가 되거나 이혼당하여
  alternatives_korean:
  - 과부이거나 이혼당하여
  - 과부가 되거나 이혼된
  lexicon: HALOT
  rationale: 두 상태의 대안을 나타내므로 ‘또는’의 뜻을 살렸고, 한국어 법문체에서 자연스러운 피동 표현으로 옮겼습니다.
- source_word: וְ/זֶרַע אֵין לָהּ
  english_pob_choice: and has no offspring
  chosen_korean: 자식이 없게 되고
  alternatives_korean:
  - 자손이 없게 되고
  - 후손이 없게 되고
  lexicon: HALOT
  rationale: זֶרַע의 문맥상 의미를 가족·상속 맥락에 맞게 ‘자식’으로 풀어, 단순한 생물학적 ‘씨’보다 법적·가정적 의미를 드러냈습니다.
- source_word: מִ/לֶּחֶם אָבִי/הָ
  english_pob_choice: from her father’s food
  chosen_korean: 아버지의 음식
  alternatives_korean:
  - 아버지의 빵
  - 아버지의 양식
  lexicon: HALOT
  rationale: ‘빵’의 직역은 가능하지만, 제사장 가문의 식량/배급을 뜻하는 넓은 의미를 살리기 위해 ‘음식’으로 옮겼습니다.
- source_word: וְ/כָל זָר
  english_pob_choice: no outsider
  chosen_korean: 아무 외인
  alternatives_korean:
  - 아무 낯선 사람
  - 어떤 외부인도
  lexicon: HALOT
  rationale: זָר는 민족적 외국인보다 허용된 범위 밖의 사람을 가리키므로, ‘외인’으로 옮겨 자격 밖의 사람이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 제사장 가문의 음식 접근권
  chosen_reading: ‘아버지의 음식’은 제사장 가문에 속한 사람에게 허용된 식량/배급 전체를 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - ‘아버지의 빵’으로 직역
  - ‘아버지의 양식’으로 완곡화
  rationale: 본문은 단순한 빵 조각이 아니라 제사장 가문에 배정된 먹거리를 말하므로, 현대 독자가 법규의 범위를 오해하지 않도록 넓은 표현을 택했습니다.
  doctrine_reference: 레위기 22장의 성물 접근 규정
