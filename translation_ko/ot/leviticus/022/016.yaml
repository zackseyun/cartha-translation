id: LEV.22.16
reference: Leviticus 22:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
  footnotes:
  - marker: a
    text: Or 'and bring upon them guilt'; the Hebrew expression is difficult and may emphasize liability for a guilt-offense.
    reason: lexical_alternative
  - marker: b
    text: '''Their holy things'' refers to consecrated portions or offerings.'
    reason: cultural_note
  - marker: c
    text: Or 'who makes them holy' or 'who consecrates them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들의 거룩한 것들을 먹음으로써 그들에게 속죄 의무가 따르는 죄책을 지게 할 것이니, 나는 그들을 거룩하게 하는 야훼이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 죄책을 지우게 할 것이니’; 히브리어 표현은 어렵고, 속건에 해당하는 책임을 강조하는 것으로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘자기들의 거룩한 것들’은 성별된 몫이나 제물을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들을 거룩하게 하시는’ 혹은 ‘그들을 성별하시는’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  english_pob_choice: and so cause
  chosen_korean: 지게 할 것이니
  alternatives_korean:
  - 가져오게 할 것이니
  - 지우게 할 것이니
  - 불러일으킬 것이니
  lexicon: HALOT
  rationale: 히필형의 인과적 의미를 살려 ‘지게 하다’로 옮기되, 앞절과 이어지는 결과를 나타내는 연결감은 서술형으로 자연스럽게 풀었습니다.
- source_word: עֲוֺן אַשְׁמָה
  english_pob_choice: guilt requiring restitution
  chosen_korean: 속죄 의무가 따르는 죄책
  alternatives_korean:
  - 배상해야 할 죄책
  - 속건 책임이 있는 죄책
  - 보상해야 할 죄과
  lexicon: HALOT
  rationale: 두 명사 결합이 단순한 ‘죄’보다 제의·법적 책임을 동반하는 상태를 가리키므로, 본문이 요구하는 책임성을 드러내는 표현으로 옮겼습니다.
- source_word: קָדְשֵׁיהֶם
  english_pob_choice: their holy things
  chosen_korean: 자기들의 거룩한 것들
  alternatives_korean:
  - 자기들의 성물
  - 자기들의 거룩한 제물
  - 자기들의 성별된 몫
  lexicon: HALOT
  rationale: 직역성을 유지하되 한국어에서 이해되도록 ‘거룩한 것들’로 옮겨, 제의적으로 구별된 몫이라는 뜻을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하는 프로젝트 기본값을 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ‘그들’이 가리키는 대상
  chosen_reading: 문맥상 제사장과 그들이 먹는 거룩한 것에 연루된 사람들을 가리키는 복수 대명사로 두고, 본문이 허용하는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 거룩한 것 자체를 거룩하게 하시는 의미로 좁혀 읽기
  - 대상을 제물로 한정해 풀어 쓰기
  rationale: 히브리어 목적어·접미사의 지시 대상을 단정적으로 제한하면 본문의 문법적 여지를 지워 버리므로, POB의 해석 신중성을 따라 열린 채로 번역했습니다.
  doctrine_reference: 본문의 문법적 모호성 보존
- issue: ‘그들을 거룩하게 하는’의 동사 처리
  chosen_reading: ‘거룩하게 하는’으로 옮겨 제의적 성별/성화의 양쪽 뉘앙스를 모두 살렸습니다.
  alternative_readings:
  - ‘거룩하게 하시는’
  - ‘구별하시는’
  rationale: קדש의 제의적 의미를 살리면서도 한국어 독자가 이해하기 쉬운 표준적 표현을 선택했습니다.
  doctrine_reference: 성결/성화 어휘의 제의적 의미
