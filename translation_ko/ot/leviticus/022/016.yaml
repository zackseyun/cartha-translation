  source_fidelity: 수정이 필요합니다. וְהִשִּׂיאוּ는 앞 절의 부정 명령/금지와 연결되어, 제사장들이 성물을 속되게 하여 다른 이들이 죄책을 지게 만드는 결과를 허용하지 말라는 뜻입니다. 현 번역의 ‘지게 할 것이니’는 이를 긍정적인 미래 진술처럼 만들며, ‘속죄 의무’도 אָשָׁם의 배상·속건 관련 책임을 ‘속죄’로 좁혀 부정확합니다.
  naturalness: ‘자기들의 거룩한 것들’은 다소 직역투입니다. ‘그들의 성물’은 제의 문맥에서 자연스럽고 충분히 넓은 표현입니다. 부정의 범위가 드러나도록 ‘지게 해서는 안 됩니다’로 옮기는 것이 한국어 문장과 문맥 모두에 적절합니다.
  terminology: יהוה는 프로젝트 방침대로 ‘야훼’로 유지합니다. קָדְשֵׁיהֶם은 ‘성물’로, עֲוֹן אַשְׁמָה는 속죄가 아니라 배상 또는 속건 책임을 수반하는 죄책으로 옮겨야 합니다. מְקַדְּשָׁם은 ‘그들을 거룩하게 하시는’이 현대 한국어의 경건한 문체와 합쇼체에 더 잘 맞습니다.
