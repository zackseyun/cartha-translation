  rationale: 앞 절에서 이어지는 금지의 의미를 본문에 드러내어, 성물을 부당하게 먹게 함으로써 죄책을 지게 만드는 일을 금합니다. ‘배상이 요구되는 죄책’은 עֲוֹן אַשְׁמָה의 법적·제의적 책임을 보존하면서 ‘속죄 의무’라는 과도한 한정을 피합니다. 두 ‘그들’의 정확한 지시 대상은 본문에서 좁혀 정하지 않고 유지했습니다.
