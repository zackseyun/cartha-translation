- from: 너희를 이집트 땅에서 이끌어 내셔서 너희의 하나님이 되게 하신 분, 나는 야훼입니다.[a]
  to: 너희의 하나님이 되기 위해 너희를 이집트 땅에서 이끌어 내신 나는 야훼입니다.[a]
  rationale: 목적을 나타내는 לִהְיוֹת לָכֶם לֵאלֹהִים를 ‘너희의 하나님이 되기 위해’로 옮겨 야훼 자신이 그 목적의 주체임을 보존했습니다. 이어지는 분사구는 ‘너희를 이집트 땅에서 이끌어 내신’으로 유지하고, 전체를 원문의 1인칭 자기선언에 맞추어 ‘나는 야훼입니다’로 자연스럽게 결합했습니다. 각주 사유도 신명 음역에 관한 대안 표기 주석에 맞게 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:45Z'
