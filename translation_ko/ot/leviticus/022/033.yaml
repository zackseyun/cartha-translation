  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (traditionally rendered ''the LORD''; alternatively transliterated ''Yahweh'').'
    reason: alternative_reading
translation:
  language: ko
  text: 너희를 이집트 땅에서 이끌어 내셔서 너희의 하나님이 되게 하신 분, 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(전통적으로는 ‘the LORD’로 옮김)를 음역한 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: הַמּוֹצִיא
  english_pob_choice: who brought you out
  chosen_korean: 이끌어 내셔서
  alternatives_korean:
  - 이끌어 내신
  - 밖으로 데려내신
  lexicon: HALOT
  rationale: 히필 분사로서 출애굽 행위를 지속적으로 규정하는 표현이므로, 한국어에서는 관계절로 자연스럽게 풀어 ‘이끌어 내셔서’로 옮겼습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: out of the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 애굽 땅에서
  lexicon: HALOT
  rationale: 언약적 출애굽 공식을 살리기 위해 ‘땅’까지 반영했으며, 현대 표준어 기준으로는 고유명사 ‘이집트’를 사용했습니다.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  english_pob_choice: to be your God
  chosen_korean: 너희의 하나님이 되게 하신
  alternatives_korean:
  - 너희의 하나님이 되기 위해
  - 너희에게 하나님이 되도록
  lexicon: HALOT
  rationale: ‘~이 되다’의 관계적·언약적 의미를 살리되, 한국어 문장에서는 결과/목적을 함께 드러내는 ‘되게 하신’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: POB의 원칙에 따라 신성호칭 יְהוָה는 전통적 ‘여호와’ 대신 음역 ‘야훼’로 옮겨, 본문의 언약명 자체를 드러냈습니다.
theological_decisions:
- issue: 언약 공식 ‘너희의 하나님’의 관계성
  chosen_reading: ‘너희의 하나님이 되게 하신’으로 출애굽과 언약 체결의 목적을 함께 드러냈습니다.
  alternative_readings:
  - ‘너희의 하나님이 되기 위해’
  - ‘너희에게 하나님이 되신’
  rationale: 본문의 לִהְיוֹת לָכֶם לֵאלֹהִים는 단순 정보가 아니라 출애굽 사건의 목적을 밝히는 언약 공식이므로, 목적성과 관계성을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: 언약 신학 / 신명기·출애굽기 반복 공식
