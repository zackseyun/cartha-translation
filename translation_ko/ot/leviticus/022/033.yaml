  source_fidelity: 원문의 히필 분사 הַמּוֹצִיא는 야훼를 수식하는 ‘너희를 이끌어 내신’이라는 관계적 서술이며, לִהְיוֹת לָכֶם לֵאלֹהִים는 그 출애굽 행위의 목적, 곧 ‘너희의 하나님이 되기 위해’를 나타냅니다. 초안의 ‘너희의 하나님이 되게 하신’은 하나님이 다른 누군가를 하나님이 되게 하셨다는 인상을 줄 수 있어 목적구문의 주체를 정확히 보존하지 못합니다.
  naturalness: 초안은 ‘…되게 하신 분, 나는 야훼입니다’라는 동격 구성이 다소 부자연스럽고, ‘분’과 ‘나는’의 연결도 한국어 문장으로 매끄럽지 않습니다. 목적절을 앞에 두고 1인칭 관계절로 구성하면 현대 표준어 합쇼체에서 자연스럽습니다.
