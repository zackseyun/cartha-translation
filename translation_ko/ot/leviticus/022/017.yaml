  rationale: אֶל은 발화의 직접 수신자를 나타내므로 한국어 조사 ‘-에게’로 자연스럽게 옮겼고, 고유명사는 표준 음역 ‘모세’를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
