  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 직접 화법을 여는 관용구이므로, 한국어에서는 중복을 줄이면서도 화법 도입 기능을 유지하는 표현으로 처리했습니다.
theological_decisions:
