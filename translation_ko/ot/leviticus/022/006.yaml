id: LEV.22.6
reference: Leviticus 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
  footnotes:
  - marker: a
    text: Or 'the sacred offerings' / 'the consecrated things' for 'the holy things.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'washed his flesh in water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 만진 사람은 저녁까지 부정하게 되며, 물로 몸을 씻기 전에는 거룩한 것들 가운데 아무것도 먹어서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘거룩한 것들’은 ‘성물’ 또는 ‘봉헌된 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 살을 물로 씻은’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 자
  - 어떤 사람
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 영혼이 아니라 개인을 가리키므로, 한국어에서는 자연스럽고 중립적인 ‘사람’으로 옮겼습니다.
- source_word: תִּגַּע בּוֹ
  english_pob_choice: who touches it
  chosen_korean: 그것을 만진
  alternatives_korean:
  - 그것에 닿는
  - 그를 만진
  lexicon: HALOT
  rationale: 접촉 대상은 앞문맥의 부정 원인에 해당하므로 ‘그것을’로 받아, 남성 인칭처럼 들릴 수 있는 ‘그를’은 피했습니다.
- source_word: וְטָמְאָה עַד הָעָרֶב
  english_pob_choice: shall be unclean until the evening
  chosen_korean: 저녁까지 부정하게 되며
  alternatives_korean:
  - 저녁까지 부정하며
  - 저녁때까지 부정하게 되며
  lexicon: HALOT
  rationale: 의례적 상태 변화를 나타내는 משפט적 표현이므로 결과 상태를 드러내는 ‘부정하게 되며’를 택했고, ‘저녁까지’로 기간을 자연스럽게 살렸습니다.
- source_word: מִן הַקֳּדָשִׁים
  english_pob_choice: any of the holy things
  chosen_korean: 거룩한 것들 가운데 아무것도
  alternatives_korean:
  - 거룩한 것들에서 아무것도
  - 성물 가운데 아무것도
  lexicon: HALOT
  rationale: מִן의 부분격과 קדשים의 복수성을 살리기 위해 ‘거룩한 것들 가운데’로 옮겼습니다. ‘성물’도 가능하지만, 본문 뜻을 더 투명하게 드러내기 위해 풀어 썼습니다.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  english_pob_choice: he has washed his body with water
  chosen_korean: 물로 몸을 씻기 전에는
  alternatives_korean:
  - 물에 몸을 씻기 전에는
  - 물로 그의 살을 씻기 전에는
  lexicon: HALOT
  rationale: בשר는 문자적으로 ‘살’이지만 정결 규례에서는 몸 전체를 가리키는 관용이므로, 현대 한국어에서 자연스러운 ‘몸을 씻다’로 옮겼습니다.
theological_decisions:
- issue: 부정함의 성격
  chosen_reading: 의례적 부정
  alternative_readings:
  - 도덕적 부정
  - 죄책
  rationale: 이 절은 거룩한 것의 섭취 자격과 접촉-정결 규례를 말하므로, 본문에 없는 도덕적 죄책 의미를 덧입히지 않고 의례적 부정으로 유지했습니다.
  doctrine_reference: 정결법/레위기 문맥
