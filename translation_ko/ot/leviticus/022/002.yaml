id: LEV.22.2
reference: Leviticus 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'separate themselves from' or 'abstain from' the holy things of the sons of Israel.
    reason: lexical_alternative
  - marker: b
    text: '''The sons of Israel'' is the formal Hebrew expression; alternatively, ''the people of Israel'' or ''the Israelites.'''
    reason: lexical_alternative
  - marker: c
    text: That is, the holy things that the Israelites consecrate to the LORD.
    reason: cross_reference
translation:
  language: ko
  text: 아론과 그의 아들들에게 말하십시오. 그들이 이스라엘 자손[a]이 내게 구별하여 바친 거룩한 것들[b]에서 스스로 물러나, 내 거룩한 이름을 더럽히지 않게 하십시오. 나는 야훼[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 정형화된 언약 표현입니다. 문맥에 따라 ‘이스라엘 백성’ 또는 ‘이스라엘 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘거룩한 것들’은 이스라엘 자손이 야훼께 구별하여 바친 제의적 예물과 성물을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: ‘야훼’는 히브리어 고유명 יְהוָה의 음역입니다.
    reason: source_note
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 전하여 말하십시오
  lexicon: HALOT
  rationale: 피엘 명령형의 직접적 지시를 살리면서, 이어지는 종속절과 자연스럽게 이어지는 표준어 표현으로 옮겼습니다.
- source_word: וְיִנָּזְרוּ
  english_pob_choice: keep themselves from
  chosen_korean: 자신을 떼어 놓고
  alternatives_korean:
  - 스스로 분리하고
  - 삼가고
  lexicon: HALOT
  rationale: 반신적 뉘앙스를 살려 단순한 금지보다 ‘거리 두기/분리’의 감각을 드러냈습니다.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  english_pob_choice: from the holy things of the sons of Israel
  chosen_korean: 이스라엘 자손의 거룩한 것들
  alternatives_korean:
  - 이스라엘 자손의 성물들
  - 이스라엘 백성의 거룩한 제물들
  lexicon: HALOT
  rationale: קָדְשֵׁי의 넓은 성소적 범위를 유지하기 위해 ‘성물’보다 더 포괄적인 ‘거룩한 것들’을 선택했습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 성스러운 이름
  - 내 거룩한 명
  lexicon: HALOT
  rationale: 언약적 표현을 직역에 가깝게 유지하면서도 한국어에서 자연스러운 결합으로 옮겼습니다.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  english_pob_choice: which they sanctify for me
  chosen_korean: 그것은 그들이 내게 바치는 것입니다
  alternatives_korean:
  - 그것은 그들이 내게 거룩하게 하는 것입니다
  - 그것은 그들이 내게 봉헌하는 것입니다
  lexicon: HALOT
  rationale: 직전의 ‘거룩한 것들’을 가리키는 절로 이해하여, קדש 어근의 제의적 헌납성을 한국어 ‘바치다’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘이름’과 ‘거룩한 것들’의 관계
  chosen_reading: ‘그것은 그들이 내게 바치는 것입니다’는 앞선 ‘이스라엘 자손의 거룩한 것들’을 받는 것으로 처리했습니다.
  alternative_readings:
  - 문맥상 ‘내 거룩한 이름’에 느슨하게 연결할 수 있습니다.
  rationale: 복수형과 제의적 동사가 ‘거룩한 것들’에 더 잘 맞으므로, 하나님의 이름을 더럽히는 결과와 그 제물을 동일시하지 않고 문법적 연결을 보존했습니다.
  doctrine_reference: 구문 결정을 신학으로 과도하게 단순화하지 않고, 성물의 취급이 하나님의 이름을 더럽힐 수 있다는 긴장을 유지합니다.
