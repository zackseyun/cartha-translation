  - severity: medium
    issue: ‘그 어떤 것도’
    rationale: מֵהֶם은 열거된 결함 있는 짐승들 ‘중에서/그것들 중 어느 것도’를 가리키므로 대상을 밝혀 주는 편이 정확합니다.
