  source_fidelity: 개정이 필요합니다. חָרוּץ는 ‘껍질이 벗겨지다’보다는 베이거나 훼손된 신체적 결함을 가리키므로 ‘상처가 났거나’가 더 안전합니다. 두 번째 금지는 앞서 열거한 짐승들 가운데 어느 것도 제단 위에 올리지 말라는 뜻이므로 이를 명시했습니다.
  naturalness: 초안의 문장 자체는 이해되지만, ‘그 어떤 것도’는 선행하는 결함 있는 짐승들과의 지시 관계를 약화시킵니다. 또한 지정된 현대 합쇼체에 맞추어 ‘드리지 마십시오/올려놓지 마십시오’로 고쳤습니다.
  terminology: אִשֶּׁה는 전통적으로 ‘화제/불로 드리는 제물’로 옮기는 것이 자연스럽고, ‘음식 제물’은 한국어에서 오해될 수 있습니다. 피부 질환 명칭들은 불확실성을 보존하여 일반적으로 옮겼습니다.
  issues:
