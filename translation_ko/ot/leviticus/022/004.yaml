  terminology: ‘나병’은 현대 한센병과의 동일시를 쉽게 유발하므로 본문에서는 ‘피부 질환’으로 수정하고, 전통 번역어는 각주에서만 언급했습니다. ‘성물’, ‘정결’은 레위기의 제의 문맥에 알맞은 정착된 용어입니다.
  issues:
