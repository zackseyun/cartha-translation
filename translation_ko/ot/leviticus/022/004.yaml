  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
  footnotes:
  - marker: a
    text: Traditionally, 'leprous.' The Hebrew term refers broadly to a ritually defiling skin condition, not necessarily to modern leprosy (Hansen's disease).
    reason: lexical_alternative
  - marker: b
    text: Or 'any person made unclean by a dead body.' The Hebrew expression is idiomatic for corpse-related impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 자손 중 누구든지 나병[a]이나 유출병이 있으면, 그가 깨끗해질 때까지 거룩한 것들 가운데서 먹지 못합니다. 그리고 죽은 사람으로 말미암아 부정해진 어떤 것에 닿는 사람이나, 자기에게서 씨가 나오는 사람[b]은
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 ‘문둥병’으로 옮기기도 하나, 히브리어는 현대의 한센병과 꼭 일치하지 않는 제의적 피부 부정 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽은 몸으로 인해 부정해진 사람’, 히브리어 표현은 사체 관련 부정을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  english_pob_choice: Any man
  chosen_korean: 누구든지
  alternatives_korean:
  - 어떤 사람이라도
  - 아무 남자나
  lexicon: HALOT
  rationale: 중복된 אִישׁ은 분배적 표현이므로 한국어에서는 법조문 톤의 ‘누구든지’로 옮겨 대표성을 살렸습니다.
- source_word: מִזֶּרַע אַהֲרֹן
  english_pob_choice: from the offspring of Aaron
  chosen_korean: 아론의 자손 중
  alternatives_korean:
  - 아론의 후손 가운데
  - 아론의 씨에서
  lexicon: HALOT
  rationale: זֶרַע는 문자적 ‘씨’보다 혈통/후손을 뜻하므로, 자연스러운 한국어인 ‘자손’으로 옮겼습니다.
- source_word: צָרוּעַ
  english_pob_choice: afflicted with a skin disease
  chosen_korean: 나병
  alternatives_korean:
  - 피부 질환에 걸린
  - 문둥병에 걸린
  lexicon: HALOT
  rationale: 공적 가독성을 위해 통용 번역어를 썼지만, 주석의 취지를 반영해 현대 의학명으로 한정되지 않는 정결 규정의 불순물 상태를 가리킵니다.
- source_word: בַּקֳּדָשִׁים
  english_pob_choice: from the holy things
  chosen_korean: 거룩한 것들 가운데서
  alternatives_korean:
  - 거룩한 제물 가운데서
  - 성물 가운데서
  lexicon: HALOT
  rationale: קדשים는 제사장 몫의 거룩히 구별된 음식/제물을 가리키므로, 직역성을 유지하면서도 한국어로 자연스럽게 들리도록 처리했습니다.
- source_word: טְמֵא נֶפֶשׁ
  english_pob_choice: anything unclean by a dead person
  chosen_korean: 죽은 사람으로 말미암아 부정해진 것
  alternatives_korean:
  - 시체로 인해 부정해진 것
  - 죽은 자와 접촉하여 부정해진 것
  lexicon: HALOT
  rationale: 관용구적 표현이므로 ‘죽은 사람으로 말미암아’로 원인 관계를 드러내어, 사체 관련 부정을 명시했습니다.
- source_word: שִׁכְבַת זָרַע
  english_pob_choice: an emission of semen
  chosen_korean: 씨가 나오는
  alternatives_korean:
  - 정액이 나오는
  - 사정하는
  lexicon: HALOT
  rationale: 직설적이지만 완곡하지 않은 원문 감각을 살리기 위해, 성경적·공적 문체에서 가능한 ‘씨’ 표현을 유지했습니다.
theological_decisions:
- issue: צָרוּעַ의 현대 의학명 과잉해석 방지
  chosen_reading: ‘나병’으로 번역하되, 정결/부정 규정의 제의적 범주를 드러내는 문맥을 유지했습니다.
  alternative_readings:
  - 문둥병
  - 피부 질환
  rationale: 본문의 초점은 진단명이 아니라 제사장 출입 및 성물 섭취 자격이므로, 용어를 지나치게 의료화하지 않도록 했습니다.
  doctrine_reference: Leviticus purity legislation; Translation philosophy §§1, 3, 6
- issue: 죽음 관련 부정의 범위
  chosen_reading: ‘죽은 사람으로 말미암아 부정해진 것’으로 옮겨, 시체 접촉으로 인한 정결 부정을 포괄적으로 드러냈습니다.
  alternative_readings:
  - 시체로 부정해진 것
  - 죽은 사람의 부정
  rationale: 히브리어 관용구는 ‘죽음과 관련된 부정’을 뜻하므로, 너무 기술적으로 좁히지 않되 의미는 분명히 했습니다.
  doctrine_reference: Numbers 19 purity background; Translation philosophy §§1, 3
