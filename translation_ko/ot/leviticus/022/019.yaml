lexical_decisions:
- source_word: לִרְצֹנְכֶם
  english_pob_choice: for your acceptance
  chosen_korean: 여러분이 받아들일 만한 것으로 하려면
  alternatives_korean:
  - 여러분의 받아들임을 위해
