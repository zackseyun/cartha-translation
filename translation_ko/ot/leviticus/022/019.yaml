translation:
  language: ko
  text: 여러분이 받아들일 만한 것으로 하려면, 소나 소 떼, 양, 또는 염소에서 온 흠 없는 수컷이어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לִרְצֹנְכֶם은 ‘여러분이 기쁘게 받을 수 있도록/여러분의 호감을 얻도록’이라는 수용성의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  english_pob_choice: for your acceptance
  chosen_korean: 여러분이 받아들일 만한 것으로 하려면
  alternatives_korean:
  - 여러분의 받아들임을 위해
  - 여러분이 기쁘게 받을 수 있도록
  - 여러분에게 받아들여지려면
  lexicon: רָצוֹן
  rationale: 수용/호감을 뜻하는 원문의 목적어적 표현을 살려, 제물의 적합성이라는 문맥을 드러내기 위해 ‘받아들일 만한 것’으로 옮겼습니다.
- source_word: תָּמִים
  english_pob_choice: sound
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 완전한
  - 결함 없는
  lexicon: תָּמִים
  rationale: POB의 ‘sound’는 단순한 육체적 건강보다 제물의 결함 없음과 적합성을 가리키므로, 제사 용례에 익숙한 ‘흠 없는’이 가장 직접적입니다.
- source_word: זָכָר
  english_pob_choice: male
  chosen_korean: 수컷
  alternatives_korean:
  - 수컷
  - 수
  - 남컷
  lexicon: זָכָר
  rationale: 동물 제물 문맥이므로 사람을 가리키는 ‘남성’보다 동물 성별을 분명히 하는 ‘수컷’이 원문 범위를 더 정확히 반영합니다.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  english_pob_choice: from the cattle, the sheep, or the goats
  chosen_korean: 소나 소 떼, 양, 또는 염소에서 온
  alternatives_korean:
  - 소, 양, 또는 염소 가운데서 온
  - 소 떼, 양 떼, 또는 염소 떼에서 온
  - 소, 양, 염소에서 온
  lexicon: בָּקָר / כְּשָׂבִים / עִזִּים
  rationale: 세 범주는 가축의 종류를 병렬로 제시하므로, ‘from’의 제물 출처를 살리면서도 한국어 자연성을 위해 ‘에서 온’으로 옮겼습니다. ‘בָּקָר’은 집합명사적 뉘앙스를 살려 ‘소’와 보완적으로 ‘소 떼’로 풀었습니다.
theological_decisions:
- issue: 제물의 적합성 기준
  chosen_reading: ‘흠 없는 수컷’과 ‘받아들일 만한’을 함께 유지해, 제물이 여호와께 드려지기 위한 의례적 적합성을 분명히 했습니다.
  alternative_readings:
  - ‘완전한 수컷’으로 단순화
  - ‘받아들여질 만한’만 강조
  rationale: 본문은 단순한 외형 묘사가 아니라 예배용 제물의 합당성과 결함 없음이라는 두 요소를 함께 제시합니다. 둘 중 하나를 약화하면 제사 규정의 강도가 흐려집니다.
  doctrine_reference: 레 22:19의 제사 규례, 제물의 온전성
- issue: 성별 표지의 명확화
  chosen_reading: זָכָר를 동물 맥락에 맞게 ‘수컷’으로 옮겨, 인간 성별 용어로 오해되지 않게 했습니다.
  alternative_readings:
  - ‘남성’
  - ‘수컷 짐승’
  rationale: 한국어에서 ‘male’의 흔한 번역인 ‘남성’은 사람 중심으로 들릴 수 있으므로, 제물 규정의 대상이 동물임을 즉시 드러내는 표현이 더 적절합니다.
  doctrine_reference: 레위기 제사 규정의 문자적·의례적 맥락
