theological_decisions:
- issue: זָר의 범위
  chosen_reading: ‘외인’은 이 본문에서 제사장 가문/자격 밖에 있는 사람을 뜻하며, 단순한 민족적 외국인을 뜻하지는 않습니다.
  alternative_readings:
  - 낯선 사람
  - 외국인
  - 비제사장
  rationale: 레위기 22장의 초점은 성물 접근 자격에 있으므로, 배제의 범위를 제사장 집안 밖으로 한정해 읽는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve source sense over traditional inertia.'
