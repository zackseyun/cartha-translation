  - 비제사장에게 시집가게 되면
  lexicon: HALOT
  rationale: 문맥상 혈연적 외국인보다 제사장 가문 밖의 사람을 가리키므로 ‘외인’으로 옮겨 배제의 의미를 살렸고, 혼인 관계는 한국어 관용에 맞게 ‘시집가게 되면’으로 표현했습니다.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  english_pob_choice: from the contribution of the holy things
  chosen_korean: 거룩한 것들의 기여분으로는
  alternatives_korean:
