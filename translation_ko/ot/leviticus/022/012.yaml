  lexicon: HALOT
  rationale: 소유격 관계를 자연스럽게 살려 ‘제사장의 딸’로 옮겼습니다.
- source_word: לְ/אִישׁ זָר
  english_pob_choice: the wife of an outsider
  chosen_korean: 외인에게 시집가게 되면
  alternatives_korean:
