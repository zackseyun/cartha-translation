base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
  footnotes:
  - marker: a
    text: Or 'married to a non-priest'; literally 'to a strange/foreign man.' The term here refers to someone outside the priestly household.
    reason: lexical_alternative
  - marker: b
    text: Or 'holy offerings' or 'sacred gifts' for 'the contribution of the holy things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장의 딸이 외인[b][a]에게 시집가게 되면, 그 여자는 거룩한 것들의 기여분으로는 먹지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘제사장 집안 밖의 사람과 결혼한’이라는 뜻입니다. 여기의 말은 단순한 민족적 외국인을 가리키기보다 제사장 가문 밖에 있는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 제물’ 또는 ‘성별된 예물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  english_pob_choice: a priest’s daughter
  chosen_korean: 제사장의 딸
  alternatives_korean:
