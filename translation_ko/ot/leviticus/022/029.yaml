  lexicon: HALOT
  rationale: 법조문식 조건·시점 도입을 한국어로 자연스럽게 옮기기 위해 ‘그리고 ... 때에는’을 사용해 명령의 흐름을 살렸습니다.
- source_word: זֶבַח תּוֹדָה
  english_pob_choice: a thank offering
