  lexicon: HALOT
  rationale: רָצוֹן은 여기서 예물의 주관적 ‘뜻’이 아니라 수납 가능성/받아들여짐의 뜻이므로, 제사 규정의 결과를 드러내는 표현으로 옮겼습니다.
