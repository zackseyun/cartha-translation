translation:
  language: ko
  text: 그들은 내가 맡긴 의무[a]를 지켜야 합니다. 그들이 그것을 속되게 하여[c] 그것 때문에 죄를 짊어지고[b] 죽는 일이 없도록 해야 합니다. 나는 그들을 거룩하게 하는[d] 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 명령’ 또는 ‘내 규례’. 히브리어는 맡겨져 지켜야 할 의무나 책임을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것 때문에 죄책을 지고’ 또는 ‘그것 때문에 죽는’. 히브리어의 ‘죄를 짊어지다’는 죄책을 지게 됨을 뜻할 수 있으며, ‘그것 때문에’의 정확한 선행사는 문맥상 열어 둡니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘더럽혀’ 또는 ‘일반적인 것으로 취급하여’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들을 거룩하게 만나는’.
    reason: lexical_alternative
