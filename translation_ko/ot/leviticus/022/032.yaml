source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
  footnotes:
  - marker: a
    text: Or 'I will be shown holy' or 'I will be treated as holy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 거룩한 이름을 더럽히지 마십시오. 나는 이스라엘 자손 가운데서 거룩한 분으로 여김을 받을 것입니다[a]. 나는 너희를 거룩하게 하시는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 분으로 드러날 것입니다’ 또는 ‘거룩하게 여김을 받을 것입니다.’ 히브리어 동사는 하나님께서 거룩한 분으로 인정되고 드러나심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  english_pob_choice: profane
  chosen_korean: 더럽히지 말아야 합니다
  alternatives_korean:
  - 속되게 하지 말아야 합니다
  - 모독하지 말아야 합니다
  - 범속하게 여기지 말아야 합니다
  lexicon: HALOT
  rationale: 제사적·성결 문맥에서 חלל의 핵심은 거룩한 것을 일반적인 것으로 떨어뜨리는 행위이므로, 한국어에서는 자연스럽지만 의미 강도가 분명한 ‘더럽히다’를 택했습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 성스러운 이름
  - 내 거룩한 명칭
  lexicon: HALOT
  rationale: ‘이름’과 ‘거룩함’의 결합을 그대로 살리되, 현대 한국어에서 가장 투명한 표현인 ‘거룩한 이름’을 사용했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 문법적 형식과 기존 성경 용례를 함께 반영하는 표현으로, 영어 주석이 지적한 대표적 집합 의미를 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사본의 신명사יהוה를 제목어로 대체하지 않고, 프로젝트 기본어인 ‘야훼’로 옮겨 언약 이름 자체를 드러냈습니다.
theological_decisions:
- issue: ‘I will be sanctified’의 수동/상호 의미 처리
  chosen_reading: ‘거룩하게 되어야 합니다’로 옮겨, 하나님이 공동체 가운데서 거룩한 분으로 드러나고 인정받으셔야 한다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘거룩하게 되겠습니다’
  - ‘거룩하게 여김을 받아야 합니다’
  - ‘거룩한 분으로 나타나야 합니다’
  rationale: 히브리어 니팔은 단순 수동만이 아니라 ‘거룩하게 여김을 받다/드러나다’의 뉘앙스를 가질 수 있으므로, 한국어에서는 결론적·규범적 표현을 택해 신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: קדשׁ / holiness language'
- issue: 거룩하게 하시는 주체의 호칭
  chosen_reading: ‘너희를 거룩하게 하시는 야훼’로, 현재적·지속적 행위를 나타내는 분사성을 살렸습니다.
  alternative_readings:
  - ‘너희를 거룩하게 만드는 야훼’
  - ‘너희를 성결하게 하시는 야훼’
  rationale: מְקַדִּשְׁכֶם의 현재적 분사 의미를 유지하면서, 앞의 ‘거룩하게’와 어휘 연결을 지켜 본문의 반복 구조를 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
