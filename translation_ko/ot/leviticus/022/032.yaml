  rationale: 사본의 신명사יהוה를 제목어로 대체하지 않고, 프로젝트 기본어인 ‘야훼’로 옮겨 언약 이름 자체를 드러냈습니다.
theological_decisions:
- issue: ‘I will be sanctified’의 수동/상호 의미 처리
  chosen_reading: ‘거룩하게 되어야 합니다’로 옮겨, 하나님이 공동체 가운데서 거룩한 분으로 드러나고 인정받으셔야 한다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘거룩하게 되겠습니다’
  - ‘거룩하게 여김을 받아야 합니다’
  - ‘거룩한 분으로 나타나야 합니다’
  rationale: 히브리어 니팔은 단순 수동만이 아니라 ‘거룩하게 여김을 받다/드러나다’의 뉘앙스를 가질 수 있으므로, 한국어에서는 결론적·규범적 표현을 택해 신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: קדשׁ / holiness language'
- issue: 거룩하게 하시는 주체의 호칭
  chosen_reading: ‘너희를 거룩하게 하시는 야훼’로, 현재적·지속적 행위를 나타내는 분사성을 살렸습니다.
  alternative_readings:
  - ‘너희를 거룩하게 만드는 야훼’
  - ‘너희를 성결하게 하시는 야훼’
  rationale: מְקַדִּשְׁכֶם의 현재적 분사 의미를 유지하면서, 앞의 ‘거룩하게’와 어휘 연결을 지켜 본문의 반복 구조를 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
