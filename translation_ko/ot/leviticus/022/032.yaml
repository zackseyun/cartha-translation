review_pass:
  verdict: revise
  source_fidelity: The prohibition and the divine name are broadly represented faithfully. However, וְנִקְדַּשְׁתִּי is an imperfect declaration ('I will be sanctified / regarded as holy'), not a Korean deontic statement meaning 'I must be made holy.'
  naturalness: ‘거룩하게 되어야 합니다’ is grammatically understandable but is unnatural for this context and assigns an unwarranted obligation to God. ‘거룩한 분으로 여김을 받을 것입니다’ is idiomatic formal Korean and preserves the passive/resultative force.
  terminology: ‘야훼,’ ‘거룩한 이름,’ ‘이스라엘 자손,’ and ‘너희를 거룩하게 하시는’ appropriately preserve the source terminology. ‘더럽히지 마십시오’ is acceptable in Korean for desecrating a holy name.
  issues:
  - severity: high
    issue: The rendering ‘나는 이스라엘 자손 가운데서 거룩하게 되어야 합니다’ changes the force of וְנִקְדַּשְׁתִּי.
    rationale: The Hebrew Niphal imperfect is a divine declaration that Yahweh will be sanctified, that is, acknowledged or shown to be holy. ‘되어야 합니다’ expresses necessity/obligation (‘must become/be made’) and is not supported by the verbal form.
  - severity: medium
    issue: Footnote marker [a] is attached to ‘더럽히지 말아야 합니다,’ while its English-audit counterpart concerns וְנִקְדַּשְׁתִּי.
    rationale: The Korean note currently explains the prohibition, but the relevant lexical ambiguity requiring explanation is the Niphal ‘I will be sanctified.’ Moving the marker and revising the note gives it a correct anchor.
  revised_text: 너희는 내 거룩한 이름을 더럽히지 마십시오. 나는 이스라엘 자손 가운데서 거룩한 분으로 여김을 받을 것입니다[a]. 나는 너희를 거룩하게 하시는 야훼입니다.
