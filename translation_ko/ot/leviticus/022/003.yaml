id: LEV.22.3
reference: Leviticus 22:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
  footnotes:
  - marker: a
    text: Or 'from my presence.'
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off'' is a standard covenantal penalty formula; the precise mode of removal is debated.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말하십시오[a]. 너희 대대로, 너희 모든 자손 중에서 누구든지 이스라엘 자손이 여호와께 구별하여 바친 거룩한 것들에 그 부정함이 자신 위에 있는 채로 가까이 가는 사람은, 그 사람은 내 앞에서 끊어질 것입니다[c][b]. 나는 여호와입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에서’.
    reason: alternative_reading
  - marker: b
    text: ‘끊어질 것이다’는 언약적 제재를 가리키는 관용구로, 정확한 제거 방식은 논쟁적입니다.
    reason: theological_note
  - marker: c
    text: 히브리어는 ‘이스라엘의 아들들’, 곧 이스라엘 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 이르십시오
  lexicon: HALOT
  rationale: 모세에게 주어진 직접 명령을 현대 합쇼체로 자연스럽게 옮기되, 선지자적·법적 구어체의 힘을 유지했습니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: throughout your generations
  chosen_korean: 너희 대대로
  alternatives_korean:
  - 너희 세대마다
  - 대대로
  lexicon: HALOT
  rationale: 언약법의 지속성을 나타내는 관용구이므로, 시간적 연속성을 분명히 드러내는 표현을 택했습니다.
- source_word: וְטֻמְאָתוֹ עָלָיו
  english_pob_choice: while his uncleanness is on him
  chosen_korean: 그 부정함이 자신 위에 있는 채로
  alternatives_korean:
  - 그가 부정한 상태로
  - 그의 부정함이 그 위에 있는 동안
  lexicon: HALOT
  rationale: 단순히 '부정하다'로 평준화하지 않고, 부정이 그 위에 '있다'는 제의적 상태 이미지를 살렸습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 끊어질 것입니다
  - 제거될 것입니다
  - 도려내질 것입니다
  lexicon: HALOT
  rationale: 공동체·언약 형식어로서의 'cut off'를 유지하되, 한국어에서 매우 직설적인 '끊어지다'로 법정적 엄중함을 보존했습니다.
- source_word: הַנֶּפֶשׁ הַהִוא
  english_pob_choice: that person
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 영혼
  - 그 자
  lexicon: HALOT
  rationale: 법문맥의 נפש는 개인을 가리키므로, 독자가 즉시 이해할 수 있는 '사람'으로 옮겼습니다.
- source_word: מִלְּפָנַי
  english_pob_choice: from before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 임재에서
  - 내 면전에서
  lexicon: HALOT
  rationale: 히브리어의 전면적·관계적 배제 이미지를 살리되, 문맥상 가장 자연스러운 한국어 관용 표현을 사용했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 여호와로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 제공된 영어 POB가 이 절의 최종 표기를 'Yahweh'로 두고 있으나, 본초안은 한국어 독자에게 익숙한 공인 표기 체계를 우선해 '여호와'를 사용했습니다. 다만 이는 번역 관행의 차이이므로, 신학적 의미는 동일한 언약명입니다.
  doctrine_reference: POB Korean target glossary and publication convention
- issue: 제의적 제재인 'shall be cut off'
  chosen_reading: '''끊어질 것입니다''로 유지해, 구체적 집행 방식은 특정하지 않았습니다.'
  alternative_readings:
  - 죽임을 당할 것입니다
  - 회중에서 쫓겨날 것입니다
  - 언약에서 제거될 것입니다
  rationale: 히브리어의 כרת 니팔은 전통적으로 해석이 갈리므로, 본문이 밝히지 않는 집행 방식을 덧씌우지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
