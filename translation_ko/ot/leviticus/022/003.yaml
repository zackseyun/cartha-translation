  to: 그들에게 이렇게 말하십시오. 너희 대대로, 너희 자손 가운데 누구든지 이스라엘 자손이 야훼께 거룩하게 구별하여 바친 것들에, 자기의 부정함이 그에게 있는 채로 가까이 가는 사람은 그 사람은 내 앞에서 끊어질 것입니다[b]. 나는 야훼입니다.
  rationale: 잘못된 각주 앵커와 그에 따른 무관한 각주를 제거했습니다. 신명을 ‘야훼’로 바로잡아 원어 및 최신 POB 결정과 일치시켰습니다. 또한 제의적 부정이 ‘그에게 있다’는 원문의 상태 이미지를 보존하되, 현대 합쇼체 한국어에 맞게 문장을 다듬었습니다. כרת의 구체적 집행 방식은 본문과 각주 모두에서 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:25Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 법적·제의적 의미는 대체로 충실합니다. 그러나 신명은 원어와 최신 POB 결정에 따라 ‘야훼’로 통일해야 하며, 각주 a는 본문에서 ‘그들에게 말하십시오’에 붙어 있으면서 전혀 다른 구절 요소인 ‘내 앞에서’의 대안을 제시하므로 잘못 연결되어 있습니다.
  naturalness: ‘그 부정함이 자신 위에 있는 채로’는 히브리어의 형상을 보존하려는 의도는 좋지만 현대 한국어로는 다소 부자연스럽습니다. ‘자기의 부정함이 그에게 있는 채로’는 제의적 상태의 지속을 유지하면서 더 자연스럽습니다.
  terminology: הַקֳּדָשִׁים은 ‘거룩한 것들’, כרת의 제재 공식은 ‘끊어질 것입니다’로 유지하는 것이 적절합니다. יְהוָה는 제공된 최신 신명 결정에 맞춰 ‘야훼’로 옮겨야 합니다. ‘이스라엘 자손’은 원문의 표현을 잘 보존합니다.
  issues:
  - severity: high
    issue: 신명 ‘여호와’ 사용
    rationale: 원어의 יְהוָה 및 제공된 최신 POB 신명 결정은 ‘Yahweh’를 채택합니다. 한국어 본문도 이에 맞춰 ‘야훼’로 통일해야 합니다.
  - severity: high
    issue: 각주 a의 내용 및 앵커가 불일치함
    rationale: 각주 a는 ‘또는 내 앞에서’라고 하나 본문에서는 ‘말하십시오’ 뒤에 붙어 있습니다. 이는 독자를 오도하므로 삭제하고, 해당 대안이 필요하다면 ‘내 앞에서’에 직접 연결해야 합니다. 여기서는 본문 자체가 충분하므로 각주를 두지 않습니다.
  - severity: low
    issue: ‘자신 위에 있는 채로’의 비자연스러움
    rationale: 재귀 대명사와 ‘위에’의 결합이 현대 표준 한국어에서 어색합니다. ‘자기의 부정함이 그에게 있는 채로’가 원문의 상태 표현을 보존하면서 자연스럽습니다.
