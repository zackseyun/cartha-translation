lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: So you shall keep
  chosen_korean: 그러므로 너희는 … 지켜야 합니다
  alternatives_korean:
  - 그리고 너희는 … 지켜야 합니다
  - 너희는 … 지켜야 합니다
