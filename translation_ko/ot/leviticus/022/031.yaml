  lexicon: HALOT
  rationale: שׁמר는 계명이나 언약 의무를 ‘지키다/준수하다’는 뜻이므로, 문맥 연결을 살린 ‘그러므로’와 함께 ‘지키다’로 옮겼습니다.
- source_word: מִצְוֺתַי
  english_pob_choice: my commandments
  chosen_korean: 내 명령
  alternatives_korean:
  - 내 계명
  - 내 명령들
  - 내 계명들
  lexicon: HALOT
  rationale: מִצְוָה는 명령/계명을 가리키며, 한국어에서는 문맥상 간결한 ‘명령’이 본문의 법적·언약적 압력을 잘 드러냅니다.
- source_word: וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם
  english_pob_choice: and do them
  chosen_korean: 그것을 행해야 합니다
  alternatives_korean:
  - 그것들을 해야 합니다
  - 그것들을 실천해야 합니다
  - 그것들을 실행해야 합니다
  lexicon: HALOT
  rationale: עשה는 여기서 계명을 ‘행하다’는 구체적 표현이므로, 앞의 ‘지키다’와 구분되도록 ‘행하다’로 살렸습니다.
- source_word: אֲנִ֖י יְהוָֽה
  english_pob_choice: I am Yahweh
  chosen_korean: 나는 야훼입니다
  alternatives_korean:
  - 나는 주님입니다
  - 나는 여호와입니다
  lexicon: HALOT
  rationale: 이름 יְהוָה는 본 프로젝트 기본 용례에 따라 ‘야훼’로 음역해, 언약적 자기선언의 고유성을 보존했습니다.
theological_decisions:
- issue: 계명 준수의 이중 표현(지키다/행하다)
  chosen_reading: ‘지키고 … 행해야 합니다’로 두 동사를 모두 유지했습니다.
  alternative_readings:
  - ‘지켜야 합니다’만으로 압축
  - ‘준수해야 합니다’로 통합
  rationale: 히브리어는 ‘지키다’와 ‘행하다’를 병렬로 써 단순 순종이 아니라 실제 실행을 강조하므로, 두 동사를 모두 반영했습니다.
  doctrine_reference: Torah obedience in Leviticus
