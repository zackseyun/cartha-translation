base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
  footnotes:
  - marker: a
    text: Or 'the bread of your God.' Here 'bread' is a Hebrew sacrificial idiom for food presented to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'blemish.' The Hebrew term refers to a disqualifying defect in a sacrificial animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 외국인의 손에서 나온 것은 너희 하나님의 양식[a]으로 하나도 바치지 말아야 합니다. 그것들에는 그들의 부패가 있고, 그들 안에는 흠[b]이 있습니다. 그것들은 너희에게 받아들여지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 하나님의 빵.’ 여기서 ‘빵’은 하나님께 드리는 제의적 ‘음식’을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘결점.’ 히브리어는 희생제물의 자격을 박탈하는 결함을 가리킵니다.
    reason: lexical_alternative
