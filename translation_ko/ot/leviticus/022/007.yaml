  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
  footnotes:
  - marker: a
    text: Literally, 'for it is his bread.' Here 'bread' means his allotted food from the sacred portions.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the sacred offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 져야 그는 깨끗해집니다. 그 후에는 거룩한 것들 가운데서 먹을 수 있습니다. 그것은 그의 음식이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘해가 들어오다’이지만, 여기서는 해 질 때를 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어 קדשים는 여기서 성물, 곧 거룩하게 구별된 제의 몫을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  english_pob_choice: When the sun has set
  chosen_korean: 해가 져야
  alternatives_korean:
  - 해가 지면
  - 해가 질 때
  - 해가 저문 뒤에
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로 ‘해가 들어오다’이지만, 문맥상 해 질 때를 가리키므로 한국어에서는 법령체에 맞는 조건 표현인 ‘해가 져야’로 옮겼습니다.
- source_word: וְטָהֵר
  english_pob_choice: he will be clean
  chosen_korean: 그는 깨끗해집니다
  alternatives_korean:
  - 그는 깨끗합니다
  - 그는 정결해집니다
  - 그는 깨끗하게 됩니다
  lexicon: HALOT
  rationale: 여기서의 טהר는 도덕적 순결보다 의례적 정결 회복을 뜻하므로, 한국어 ‘깨끗해집니다’로 자연스럽게 표현하되 문맥이 의례 규정임을 유지했습니다.
- source_word: מִן הַקֳּדָשִׁים
  english_pob_choice: from the holy things
  chosen_korean: 거룩한 것들 가운데서
  alternatives_korean:
  - 거룩한 것들에서
  - 성물들 가운데서
  - 거룩한 제물들 가운데서
  lexicon: HALOT
  rationale: קדשים는 제의적 ‘거룩한 몫/성물들’을 가리키므로, POB의 ‘holy things’를 따라 직역성을 살리면서 한국어에서는 섭취 가능한 대상임을 드러내는 ‘가운데서’로 처리했습니다.
- source_word: לַחְמ֖וֹ הוּא
  english_pob_choice: because they are his food
  chosen_korean: 그것은 그의 음식이기 때문입니다
  alternatives_korean:
  - 그것은 그의 빵이기 때문입니다
  - 그것은 그의 먹을거리이기 때문입니다
  - 그것들은 그의 음식이기 때문입니다
  lexicon: HALOT
  rationale: לֶחֶם의 기본 뜻은 ‘빵’이지만 여기서는 성물 몫이 그의 할당된 양식이라는 의미이므로, 한국어에서는 ‘음식’으로 옮겨 제의적 배분의 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 정결의 성격
  chosen_reading: 의례적 정결 회복으로 읽었습니다.
  alternative_readings:
  - 도덕적 정결
  - 영적 정결
  rationale: 레위기 22장은 제사장에게 허용되는 성물 섭취 시점을 규정하므로, 본문의 ‘깨끗해집니다’는 윤리적 평가가 아니라 출석 가능 상태의 회복을 뜻합니다.
  doctrine_reference: Leviticus purity regulations
