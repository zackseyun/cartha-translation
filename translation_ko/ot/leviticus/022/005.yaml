review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘어떤 무리는 것’은 히브리어 שֶׁרֶץ의 의미를 자연스럽게 전달하지 못하며 문법적으로도 성립하지 않습니다. 또한 마지막 ‘그의 어떤 부정함’은 누구의 부정함인지 불분명합니다. 히브리어의 수식 구조를 따라, 접촉 대상인 사람이 지닌 어떤 종류의 의식적 부정함이든 그로 인해 접촉자가 부정하게 되는 뜻을 명시하는 것이 안전합니다.
  naturalness: ‘부정하게 만드는 어떤 무리는 것’은 비문이며, ‘어떤 사람에 의해 그가 부정하게 되거나’는 접촉(יגע)의 의미가 탈락하고 피동 표현이 부자연스럽습니다. ‘…에 닿는 경우입니다’라는 병렬 구조로 고치면 현대 표준어 합쇼체로 자연스럽고 법규 문맥에도 맞습니다.
  terminology: טמא / טֻמְאָה는 도덕적 죄악을 뜻하지 않는 의식적 상태이므로 ‘부정하게 하다 / 부정함’으로 일관되게 유지합니다. שֶׁרֶץ는 분류를 과도하게 특정하지 않고 ‘기어 다니는 생물’로 옮깁니다. אדם은 법률적 일반성을 살려 ‘사람’으로 번역합니다.
  issues:
  - severity: high
    issue: ‘어떤 무리는 것’은 비문이며 שֶׁרֶץ의 번역으로 부정확합니다.
    rationale: ‘무리다’는 이 문맥에서 생물의 종류를 나타내지 못합니다. שֶׁרֶץ의 넓은 범주성과 지면 가까이 움직이는 특성을 반영하는 ‘기어 다니는 생물’이 자연스럽습니다.
  - severity: high
    issue: 두 번째 접촉 절에서 ‘닿다’의 의미가 빠지고, ‘그의 어떤 부정함’의 소유자가 불명확합니다.
    rationale: יגע는 두 경우 모두 접촉을 말합니다. לְכָל טֻמְאָתוֹ는 접촉 대상인 사람이 지닌 부정함의 종류를 포괄하는 표현으로 볼 수 있으므로, 이를 한국어에서 명시해 의미를 보존합니다.
  - severity: medium
    issue: 초안은 절 끝을 ‘곧’으로 연결하여 원문의 선택적 병렬 구조를 흐립니다.
    rationale: או … או의 대등한 선택 구조를 ‘…하거나, 또는 …하는 경우’로 유지하는 편이 충실합니다.
  revised_text: 또는 어떤 사람이 자기를 부정하게 하는 어떤 기어 다니는 생물에 닿거나, 어떤 부정함을 지녔든 그로 말미암아 자기를 부정하게 하는 사람에게 닿는 경우입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘어떤 기는 생물.’ 히브리어는 땅에 가까이 기어 다니거나 무리 지어 움직이는 작은 생물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람 … 그가 지닌 어떤 부정함이든지.’ 히브리어는 남성 단수형을 법률적 일반 용법으로 사용합니다.
    reason: lexical_alternative
  revision_rationale: 문법적으로 잘못된 ‘무리는 것’을 ‘기어 다니는 생물’로 바로잡고, 두 접촉 절 모두에 ‘닿다’를 반영했습니다. 마지막 구절은 히브리어의 간결한 수식 관계를 지나치게 해석하지 않으면서도, 부정함이 접촉 대상인 사람에게 속한다는 문맥상 의미를 한국어에서 자연스럽게 드러냈습니다. 의식적 부정이라는 용어 선택은 유지했습니다.
