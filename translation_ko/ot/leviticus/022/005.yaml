id: LEV.22.5
reference: Leviticus 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
  footnotes:
  - marker: a
    text: Or 'any creeping thing.' The Hebrew term refers to small creatures that swarm or move close to the ground.
    reason: lexical_alternative
  - marker: b
    text: Or 'a person ... whatever his impurity.' The Hebrew uses masculine singular terms in a generic legal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 어떤 사람이 부정하게 만드는 어떤 무리는 것[a]에 닿아 그가 부정하게 되거나, 어떤 사람[b]에 의해 그가 부정하게 되거나, 곧 그의 어떤 부정함이든지.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 기는 것.’ 히브리어는 땅에 가까이 기어 다니거나 무리지어 움직이는 작은 생물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람 … 그의 어떤 부정함이든지.’ 히브리어는 남성 단수형을 법률적 일반 용법으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל שֶׁרֶץ
  english_pob_choice: any swarming thing
  chosen_korean: 어떤 무리는 것
  alternatives_korean:
  - 어떤 기는 것
  - 어떤 작은 기는 생물
  lexicon: HALOT
  rationale: שֶׁרֶץ는 레위기 정결법에서 땅에 가까이 기어 다니는 작은 생물을 가리키므로, 의미를 살리되 지나치게 zoology화하지 않도록 ‘무리는 것’으로 옮겼습니다.
- source_word: יִגַּע
  english_pob_choice: touches
  chosen_korean: 닿아
  alternatives_korean:
  - 만져
  - 접촉하여
  lexicon: HALOT
  rationale: 법적·의식적 접촉을 자연스럽게 드러내는 동사로 ‘닿아’를 택했고, 단순한 물리적 만짐보다 넓은 접촉 가능성을 유지했습니다.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  english_pob_choice: by which he becomes unclean
  chosen_korean: 그가 부정하게 되거나
  alternatives_korean:
  - 그것으로 그가 부정하게 되거나
  - 그로 말미암아 그가 부정하게 되거나
  lexicon: HALOT
  rationale: 이 절의 핵심은 접촉의 결과로 생기는 의식적 부정함이므로, 반복되는 טמא를 ‘부정하게 되다’로 일관되게 살렸습니다.
- source_word: בְאָדָם
  english_pob_choice: a person
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 한 사람
  - 어떤 인간
  lexicon: HALOT
  rationale: 아담은 여기서 일반적인 인간을 가리키는 법률적 용법이므로, 성별 고정감을 줄이면서도 원문의 일반성을 반영하는 ‘어떤 사람’을 택했습니다.
- source_word: טֻמְאָתוֹ
  english_pob_choice: whatever his uncleanness
  chosen_korean: 그의 어떤 부정함이든지
  alternatives_korean:
  - 그의 부정함이 무엇이든지
  - 어떤 부정함이든
  lexicon: HALOT
  rationale: טֻמְאָה를 ‘부정함’으로 옮겨 동사 טמא와 어근 연결을 유지했고, לְכֹל의 포괄성을 ‘어떤 …이든지’로 드러냈습니다.
theological_decisions:
- issue: 정결/부정의 언어를 도덕화하지 않기
  chosen_reading: טמא / טֻמְאָה를 의식적·예전적 ‘부정/부정하게 되다’로 일관되게 번역했습니다.
  alternative_readings:
  - 더럽다 / 더러움
  - 불결하다 / 불결함
  rationale: 문맥은 제사장적 정결 규례이므로 죄책이나 도덕적 타락을 암시하지 않도록, 그러나 현대 한국어에서 의미가 분명한 표현을 선택했습니다.
  doctrine_reference: 레위기 11–15장의 정결 규례
- issue: 성별 일반성 보존
  chosen_reading: 첫 번째 אִישׁ은 ‘어떤 사람’으로, 뒤의 בְאָדָם도 ‘어떤 사람’으로 처리해 법률 문맥의 일반성을 살렸습니다.
  alternative_readings:
  - 한 남자
  - 사람
  rationale: 히브리어는 남성 단수 형태를 쓰지만 이 절은 전체적으로 일반 법률 진술이므로, 한국어에서는 남성 한정처럼 읽히지 않도록 했습니다.
  doctrine_reference: 성경 번역의 문법성/의미성 균형
