id: LEV.22.14
reference: Leviticus 22:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
  footnotes:
  - marker: a
    text: Or 'anyone' / 'a person'; Hebrew 'a man' (אִישׁ), a masculine singular legal formulation that may function generically.
    reason: lexical_alternative
  - marker: b
    text: '''A holy thing'' refers to consecrated holy food or property reserved for priestly use.'
    reason: cultural_note
  - marker: c
    text: Or 'by mistake' / 'in error.'
    reason: lexical_alternative
  - marker: d
    text: Or 'add a fifth of it to it'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 어떤 사람이 부지중에 거룩한 것을 먹으면, 그 거룩한 것에 그 값의 오분의 일을 더하여 제사장에게 그 거룩한 것을 드려야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람’(אִישׁ)은 남성형 단수이지만, 이 법문에서는 일반적 사례로 기능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 것’은 제사장용으로 구별된 거룩한 대상이나 그 일부를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘실수로’, ‘잘못하여’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그것에 오분의 일을 더하여’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אִישׁ
  english_pob_choice: a man
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 한 남자
  - 사람
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 남성형을 유지할지, 한국어 법문체에서 자연스럽게 일반화할지의 문제입니다. 한국어에서는 성별 표지를 굳이 드러내지 않는 ‘어떤 사람’이 문맥상 일반적 사례를 전달하면서도 과도한 남성화를 피합니다.
- source_word: קֹדֶשׁ
  english_pob_choice: a holy thing
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 거룩한 제물
  - 성물
  - 거룩한 음식
  lexicon: HALOT
  rationale: קֹדֶשׁ는 여기서 제사장용으로 구별된 거룩한 대상을 가리키므로, 본문 범위를 좁히지 않는 ‘거룩한 것’이 가장 안전합니다. ‘제물’이나 ‘음식’은 의미를 지나치게 특정할 수 있습니다.
- source_word: בִּ/שְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 실수로
  - 무심코
  - 부주의하게
  lexicon: HALOT
  rationale: שְׁגָגָה는 고의가 아닌 부지와 과실의 범주를 가리키므로, 법문 맥락에서 ‘부지중에’가 가장 절제된 표현입니다. ‘실수로’는 다소 구어적이고, ‘부주의하게’는 책임 뉘앙스가 더 강합니다.
- source_word: חֲמִשִׁיתוֹ
  english_pob_choice: a fifth to it
  chosen_korean: 오분의 일
  alternatives_korean:
  - 5분의 1
  - 그것의 오분의 일
  - 그 값의 오분의 일
  lexicon: HALOT
  rationale: 히브리어는 ‘그것의 오분의 일’에 해당하지만, 한국어에서는 반복을 줄인 ‘오분의 일’이 자연스럽습니다. 앞절의 대상이 분명하므로 문맥상 보완이 가능합니다.
theological_decisions:
- issue: 제의적 ‘거룩한 것’의 범위
  chosen_reading: 본문의 קֹדֶשׁ를 특정한 ‘제물’로 좁히지 않고 ‘거룩한 것’으로 유지했습니다.
  alternative_readings:
  - 거룩한 음식
  - 성물
  rationale: 이 절 자체는 먹어서는 안 될 구별된 거룩한 대상을 말하지만, 히브리어는 범주를 넓게 둡니다. 번역이 대상을 과잉특정하면 본문의 법적 범위를 축소할 수 있으므로, 원문과 같이 포괄적으로 유지하는 편이 좋습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
