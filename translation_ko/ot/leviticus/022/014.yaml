revisions:
- from: 만일 어떤 사람이 부지중에 거룩한 것을 먹으면, 그 거룩한 것에 그 값의 오분의 일을 더하여 제사장에게 그 거룩한 것을 드려야 합니다.[a][b][c][d]
  to: 만일 어떤 사람이 부지중에 거룩한 것을 먹으면, 그것에 오분의 일을 더하고 제사장에게 그 거룩한 것을 주어야 합니다.[a][b][c][d]
  rationale: ‘값’이라는 해석적 보충을 본문에서 제거하여 히브리어의 포괄성을 보존했습니다. 또한 ‘주어야 합니다’로 נתן의 기본 뜻을 직접 반영하고, 직역상 다소 어색한 대명사 반복은 각주에서 밝혔습니다.
  reviewer_model: gpt-5.6-terra
