  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
  footnotes:
  - marker: a
    text: Literally, 'bruised, crushed, torn, or cut'; the Hebrew lists four forms of damage and implies the male sexual organs of the animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 고환이 눌리거나 으스러지거나 찢어지거나 잘린 짐승은 야훼께 드리지 마십시오. 또 여러분의 땅에서는 그런 일을 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘눌린 것, 으스러진 것, 찢어진 것, 잘린 것’입니다. 히브리어는 네 가지 손상 형태를 나열하며, 문맥상 수컷 제물의 고환 손상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוּךְ
  english_pob_choice: bruised
  chosen_korean: 부은 것
  alternatives_korean:
  - 멍든 것
  - 눌린 것
  lexicon: HALOT
  rationale: 첫 항목은 압력으로 손상된 상태를 가리키므로, 한국어에서는 자연스럽고 뒤의 항목들과 구별되는 ‘부은 것’으로 옮겨 손상 상태를 드러냈습니다.
- source_word: כָתוּת
  english_pob_choice: crushed
  chosen_korean: 으스러진 것
  alternatives_korean:
  - 부서진 것
  - 찧인 것
  lexicon: HALOT
  rationale: 이 단어는 부서지거나 으깨진 상태를 나타내므로, 물리적 훼손을 직접 드러내는 ‘으스러진 것’으로 옮겼습니다.
- source_word: נָתוּק / כָרוּת
  english_pob_choice: torn / cut
  chosen_korean: 찢어진 것 / 잘린 것
  alternatives_korean:
  - 떼어진 것 / 절단된 것
  - 떨어져 나간 것 / 절단된 것
  lexicon: HALOT
  rationale: 두 번째와 세 번째 손상은 당겨 찢김과 절단을 구분해 주므로, 순서를 살려 ‘찢어진 것’과 ‘잘린 것’으로 대응했습니다.
- source_word: תַקְרִיבוּ / לַיהוָה
  english_pob_choice: present to Yahweh
  chosen_korean: 야훼께 드리지 마십시오
  alternatives_korean:
  - 야훼께 바치지 마십시오
  - 야훼께 가져가지 마십시오
  lexicon: HALOT
  rationale: 제사 맥락의 히필은 예물을 ‘드리다/바치다’의 뜻이므로, 한국어 제의 문맥에 자연스러운 ‘드리지 마십시오’를 택했습니다. 신명칭은 본문 원어 표기 관례에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  english_pob_choice: in your land you shall not do this
  chosen_korean: 여러분의 땅에서는 이런 일을 하지 마십시오
  alternatives_korean:
  - 여러분의 땅에서는 그렇게 하지 마십시오
  - 여러분의 땅에서는 이것을 하지 마십시오
  lexicon: HALOT
  rationale: 끝구의 ‘하다’는 앞선 훼손 행위를 가리키는 생략 표현이므로, 범위를 유지하면서도 자연스러운 한국어로 ‘이런 일’을 보충했습니다.
theological_decisions:
- issue: The final prohibition’s scope
  chosen_reading: 가나안 땅 안에서 그러한 생식기 훼손 행위를 일반적으로 금지하는 표현으로 읽었습니다.
  alternative_readings:
  - 그런 동물을 제물로 바치는 행위만 금지하는 것으로 읽을 수 있습니다.
  - 오직 제사에 드리는 경우만 제한하는 뜻으로 좁힐 수 있습니다.
  rationale: 히브리어 동사 ‘하다’는 앞선 훼손 행위를 가리키는 생략적 표현으로 넓게 쓰이며, 영어 POB도 그 폭을 유지합니다. 따라서 본문이 허용하는 범위를 좁히지 않고 일반적 금지로 반영했습니다.
  doctrine_reference: 본문 문맥과 히브리어 용례에 따른 범위 결정
- issue: Implicit anatomical reference
  chosen_reading: 네 개의 손상 표현이 암수 구분이 아니라 수컷 제물의 생식기 손상을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 단순한 외형적 흠결 목록으로 볼 수 있습니다.
  - 일반적 신체 손상으로만 볼 수 있습니다.
  rationale: 원문은 네 개의 수동 분사형을 절대적으로 두지만 문맥상 제물 동물의 생식기 손상을 지시합니다. 한국어 본문에서는 과도한 완곡어법보다 원문의 강한 금지 의도를 살리는 쪽이 더 충실합니다.
  doctrine_reference: 제의 정결 규정의 문맥
