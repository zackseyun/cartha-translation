  naturalness: 초안은 대체로 자연스럽고 합쇼체도 적절합니다. 다만 ‘그의 집에서 난 사람들’보다 ‘그의 집에서 태어난 이들’이 현대 표준어에서 더 매끄럽습니다. 각주는 해당 표현 바로 뒤에 두어 지시 대상을 분명히 하는 편이 좋습니다.
