id: LEV.22.11
reference: Leviticus 22:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
  footnotes:
  - marker: a
    text: Literally, 'a person, an acquisition of his money'—that is, someone purchased with his money.
    reason: lexical_alternative
  - marker: b
    text: Or 'of his bread'; here 'bread' likely refers more broadly to the priestly food allotted to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장이 자기 돈으로 어떤 사람을 사면 그 사람은 그것을 먹을 수 있고, 그의 집에서 난 사람들도 그의 음식을 먹을 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 사람, 그의 돈의 취득물’입니다. 즉 자기 돈으로 산 사람이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 빵을’. 여기서는 ‘빵’이 제사장에게 할당된 음식 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֵן
  english_pob_choice: a priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 제사
  lexicon: HALOT
  rationale: 제사장 제도 문맥에서 כהן은 성전/제의 담당자를 가리키므로 표준적인 ‘제사장’이 가장 직접적입니다.
- source_word: יִקְנֶה נֶפֶשׁ קִנְיַן כַּסְפּוֹ
  english_pob_choice: buys a person as his property with his money
  chosen_korean: 자기 돈으로 어떤 사람을 사면
  alternatives_korean:
  - 자기 돈으로 어떤 사람을 매입하면
  - 자기 돈으로 한 사람을 소유물로 사면
  lexicon: HALOT
  rationale: 히브리어는 ‘사람을, 자기 돈의 취득물로’라는 소유·매입 상태를 말하지만, 한국어 본문에서는 노골적 소유 표현을 본문에 과도하게 덧붙이지 않고 ‘자기 돈으로 … 사면’으로 옮기고, 소유/거래의 긴장은 각주 없이도 문맥에서 드러나게 했습니다.
- source_word: הוּא יֹאכַל בּוֹ
  english_pob_choice: he may eat of it
  chosen_korean: 그 사람은 그것을 먹을 수 있고
  alternatives_korean:
  - 그는 그것을 먹을 수 있고
  - 그 사람은 그 음식에서 먹을 수 있고
  lexicon: HALOT
  rationale: 대명사 הוּא를 문맥상 구매된 사람으로 분명하게 가리키도록 ‘그 사람’으로 풀었고, בּוֹ는 제사장에게 허락된 음식 전체를 가리키므로 ‘그것을’이 가장 자연스럽습니다.
- source_word: בְלַחְמוֹ
  english_pob_choice: of his food
  chosen_korean: 그의 음식을
  alternatives_korean:
  - 그의 빵을
  - 그의 먹을 것을
  lexicon: HALOT
  rationale: לֶחֶם의 기본값은 ‘빵’이지만 여기서는 제사장에게 할당된 제의적 음식 전체를 가리키므로, POB의 해석을 따라 ‘음식’으로 넓혀 옮겼습니다.
theological_decisions:
- issue: 구매된 사람을 나타내는 소유·종속 언어의 처리
  chosen_reading: 본문의 거래·소유 긴장을 그대로 유지하되, 한국어에서는 과도한 해설 없이 중립적으로 표현했습니다.
  alternative_readings:
  - 노예로 사면
  - 소유물로 사면
  - 종으로 사면
  rationale: 히브리어와 영어 POB 모두 구매와 소유의 법적 실재를 숨기지 않지만, 본 절은 제의적 허용 범위를 말하는 법조문이므로 번역문에서는 용어를 더 확장하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1
