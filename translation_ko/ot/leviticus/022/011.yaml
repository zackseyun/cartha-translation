  to: 그러나 제사장이 자기 돈으로 사람을 사들여 자기 소유로 삼으면[a], 그 사람은 그것을 먹을 수 있으며, 그의 집에서 태어난 이들도 그의 음식[b]을 먹을 수 있습니다.
