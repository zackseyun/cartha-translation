- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전 규정에 따라 하나님의 고유명사 יהוה는 칭호 ‘주님’이 아니라 음역 ‘야훼’로 옮겨, 본문의 인격적 이름을 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
