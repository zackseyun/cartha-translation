lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어 דבר의 서술 공식은 단순 발화보다 공식적인 계시/선포의 시작을 나타내므로, 한국어에서도 ‘말씀하여 이르시다’로 speech-introduction의 무게를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전 규정에 따라 하나님의 고유명사 יהוה는 칭호 ‘주님’이 아니라 음역 ‘야훼’로 옮겨, 본문의 인격적 이름을 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게로
  - 께
  lexicon: HALOT
  rationale: 하나님이 모세에게 말을 건네는 방향성을 한국어 조사 ‘-에게’로 자연스럽게 반영했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고
  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 직접화법을 여는 공식이므로, 한국어에서는 중복되지 않게 종결부를 정리하는 ‘이르셨습니다’로 처리해 문장 흐름을 매끈하게 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 야훼가 모세에게 직접 말씀하시는 장면이므로, 본문이 가진 언약적·개인적 이름을 드러내기 위해 제목화된 ‘주’ 대신 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
