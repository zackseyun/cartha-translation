id: LEV.22.18
reference: Leviticus 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
  footnotes:
  - marker: a
    text: Or 'the resident foreigner in Israel.' The Hebrew גֵּר refers to a non-Israelite living among Israel under its communal order.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the sons of Israel'; many English versions render this idiomatically as 'all the Israelites.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for all their vow offerings and all their freewill offerings.' The Hebrew may be understood as referring more specifically to offerings associated with vows.
    reason: alternative_reading
translation:
  language: ko
  text: 아론과 그의 아들들과 이스라엘의 모든 자손에게 말하여 그들에게 이르십시오. 이스라엘 집에서 나오는 사람이나 이스라엘 가운데 거류하는 외국인 가운데서 누구든지 자기의 서원이나 자발적인 예물 중 하나로 드리는 예물을 야훼께 번제물로 드릴 경우—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류하는 외국인’은 히브리어 גֵּר의 뜻을 반영한 표현으로, 이스라엘 가운데 살며 그 공동체 질서 아래 있는 비이스라엘인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: Speak ... and say to them
  chosen_korean: 말하여 그들에게 이르십시오
  alternatives_korean:
  - 말하십시오
  - 이르십시오
  lexicon: HALOT
  rationale: 법적 지시문의 직접 명령을 살리되, 한국어에서는 ‘말하여 … 이르십시오’가 가장 자연스럽고 공문체에 맞습니다.
- source_word: אֶל אַהֲרֹן וְאֶל בָּנָיו וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to Aaron and to his sons and to all the sons of Israel
  chosen_korean: 아론과 그의 아들들과 이스라엘의 모든 자손
  alternatives_korean:
  - 아론과 그의 아들들과 이스라엘의 모든 아들들
  - 아론과 그의 아들들과 모든 이스라엘 사람들
  lexicon: HALOT
  rationale: ‘בְּנֵי יִשְׂרָאֵל’의 혈연-언약적 표현을 살리면서도, 한국어에서는 ‘이스라엘의 모든 자손’이 가장 투명합니다.
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמִן הַגֵּר בְּיִשְׂרָאֵל
  english_pob_choice: Any man from the house of Israel, or from the sojourners in Israel
  chosen_korean: 이스라엘 집에서 나오는 사람이나 이스라엘 가운데 거류하는 외국인 가운데서 누구든지
  alternatives_korean:
  - 이스라엘 집 출신 남자나 이스라엘 가운데 거류하는 외국인 누구든지
  - 이스라엘 집에서 나오는 자나 이스라엘 가운데 거류하는 나그네 가운데 누구든지
  lexicon: HALOT
  rationale: 반복된 ‘אִישׁ אִישׁ’의 분배 의미를 ‘누구든지’로 풀되, ‘הַגֵּר’는 단순한 ‘나그네’보다 거주 외국인이라는 법적 뉘앙스가 있어 ‘거류하는 외국인’으로 옮겼습니다.
- source_word: לְכָל נִדְרֵיהֶם וּלְכָל נִדְבוֹתָם
  english_pob_choice: for any of their vows or any of their freewill offerings
  chosen_korean: 자기의 서원이나 자발적인 예물 중 하나로
  alternatives_korean:
  - 그들의 모든 서원과 그들의 모든 자원 예물로
  - 서원에 따른 예물이나 자원 예물로
  lexicon: HALOT
  rationale: 여기서는 서원에 관련된 예물과 자발적 예물이라는 두 범주를 한국어로 자연스럽게 압축해, 문장의 흐름을 해치지 않으면서 의미를 보존했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 언약명 יְהוָה는 ‘야훼’로 일관되게 옮겼습니다.
- source_word: לְעֹלָה
  english_pob_choice: as a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 불살라 드리는 제물로
  lexicon: HALOT
  rationale: ‘עֹלָה’는 제의 기술어이므로, 한국어 성경에서 통용되면서도 원어의 제물 범주를 유지하는 ‘번제물’이 적절합니다.
theological_decisions:
- issue: 거류민 גֵּר의 번역
  chosen_reading: 거류하는 외국인
  alternative_readings:
  - 거류민
  - 나그네
  - 체류 외국인
  rationale: 문맥상 제의 공동체 안에서 함께 사는 비이스라엘인을 가리키므로, 단순한 여행자보다 공동체 내 거주 지위를 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: גֵּר'
- issue: 예배 대상의 언약명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 한국어 본문에서 가리거나 일반 호칭으로 평준화하지 않고, 계시된 언약명으로 드러내기 위해 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
