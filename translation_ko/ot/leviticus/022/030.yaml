translation:
  language: ko
  text: 그것은 바로 그날에 먹어야 합니다[a]. 그것을 아침까지 조금도 남겨 두어서는 안 됩니다. 나는 야훼입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날에’.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘나는 야훼입니다.’'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that same day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 같은 날에
  - 그날 바로
  lexicon: HALOT
  rationale: 히브리어는 ‘그날’이라는 즉시성을 강조하며, 한국어에서는 간결하게 ‘그날에’로 옮기면 제의 규정의 시간 제약이 자연스럽게 드러납니다.
- source_word: יֵאָכֵל
  english_pob_choice: It shall be eaten
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹히게 됩니다
  - 먹을 것입니다
  lexicon: HALOT
  rationale: 수동/비인칭적 법규 문맥을 살리면서도 현대 한국어의 법령체 표현에 맞게 의무성을 드러냈습니다.
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  english_pob_choice: you shall leave none of it
  chosen_korean: 아무것도 남겨 두어서는 안 됩니다
  alternatives_korean:
  - 그것을 조금도 남겨 두어서는 안 됩니다
  - 그것의 일부도 남기지 마십시오
  lexicon: HALOT
  rationale: ‘남기다/남겨 두다’가 יתר(남겨 두다, 남기다)의 의미를 자연스럽게 반영하며, 부정 명령의 강도를 분명히 했습니다.
- source_word: עַד בֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 새벽까지
  - 아침이 올 때까지
  lexicon: HALOT
  rationale: overnight 보관 금지를 한국어로 가장 간명하게 전달하는 표현입니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I am Yahweh
  chosen_korean: 나는 야훼입니다
  alternatives_korean:
  - 나는 주님입니다
  - 나는 여호와입니다
  lexicon: HALOT
  rationale: 본문의 신적 자기선언을 그대로 살려 ‘야훼’로 옮겼으며, 서술형 첫인칭은 한국어에서 자연스러운 평서형으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 신명 자체를 음역한 ‘야훼’를 유지했습니다. 제의 규례의 권위를 부르는 자기선언이므로 일반 호칭으로 완화하지 않았습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
