  source_fidelity: ‘그날에’는 히브리어 בַּיּוֹם הַהוּא의 기본 의미를 전달하지만, 본문의 당일 섭취 제한을 더 분명히 드러내려면 ‘바로 그날에’가 적절합니다. ‘아무것도 남겨 두어서는 안 됩니다’도 대체로 충실하나, מִמֶּנּוּ(‘그것 중에서/그것을’)의 지시 대상을 명시하는 편이 더 정확합니다.
