  - severity: medium
    issue: 마지막 무흠 규정이 수동적 결과 진술로 바뀜
    rationale: כָּל־מוּם לֹא יִהְיֶה בּוֹ는 제물에 어떤 흠도 있어서는 안 된다는 직접적인 규정입니다. ‘받아들여지지 않을 것입니다’는 앞 절의 수납성 의미를 반복하면서 원문의 병행 규정을 약화합니다.
