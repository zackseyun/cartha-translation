- source_word: לֹא תַקְרִיבוּ
  english_pob_choice: You shall not present
  chosen_korean: 바치지 마십시오
  alternatives_korean:
  - 드리지 마십시오
  - 제공하지 마십시오
  - 올리지 마십시오
  lexicon: HALOT
  rationale: 제사 맥락에서 ‘קרב’는 제물을 하나님께 가져와 드리는 행위를 뜻하므로, 일상적이면서도 예배 맥락에 맞는 ‘바치다’로 옮겼습니다.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  english_pob_choice: it will not be accepted for you
  chosen_korean: 여러분에게 받지 않으실 것입니다
  alternatives_korean:
  - 여러분에게 받아들여지지 않을 것입니다
  - 여러분을 위해 받아들여지지 않을 것입니다
  - 여러분에게 합당하지 않을 것입니다
  lexicon: HALOT
  rationale: ‘לְרָצוֹן’의 제의적 수용 가능성을 살리되, 한국어에서는 하나님의 수용 여부를 능동적으로 풀어 ‘받지 않으실 것입니다’로 옮겨 관계적 의미를 드러냈습니다.
theological_decisions:
- issue: 제사 수용성의 표현 방식
  chosen_reading: 제물 자체가 하나님께 받아들여지지 않는다는 뜻을 분명히 하되, 추상적 ‘적합성’보다 언약적 수용 여부를 드러내는 표현을 택했습니다.
  alternative_readings:
  - 받아들여지지 않을 것입니다
  - 여러분의 몫으로 받아들여지지 않을 것입니다
  - 여러분에게 합당하지 않을 것입니다
  rationale: 본문의 초점은 제물의 외형적 흠이 제의적 수용을 무효화한다는 데 있으므로, 신학적 의미를 흐리지 않으면서도 법문체의 직접성을 살렸습니다.
  doctrine_reference: 레위기 제사 규정의 수용성/정결성
