  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
  footnotes:
  - marker: a
    text: Or 'anything that has a defect.' The Hebrew sacrificial term often denotes a physical flaw that disqualifies an offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'it will not be acceptable on your behalf.'
    reason: alternative_reading
translation:
  language: ko
  text: 흠[a]이 있는 것은 무엇이든지 바치지 마십시오. 그것은 여러분을 위해 받아들여지지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흠’은 제사 규정에서 사용되는 표현으로, 제물로 드릴 수 없게 하는 신체적 결함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 여러분에게 받아들여질 만한 것이 되지 않을 것입니다.’ 원문은 ‘여러분을 위해’라는 관계 표현을 사용하여, 제물이 하나님께 받아들여지는지의 문제를 말합니다.
    reason: alternative_reading
lexical_decisions:
