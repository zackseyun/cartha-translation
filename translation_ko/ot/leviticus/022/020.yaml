  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
  footnotes:
  - marker: a
    text: Or 'anything that has a defect.' The Hebrew sacrificial term often denotes a physical flaw that disqualifies an offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'it will not be acceptable on your behalf.'
    reason: alternative_reading
translation:
  language: ko
  text: 무릇 몸에 흠이 있는 것은 무엇이든지 바치지 마십시오. 그것은 여러분에게 받지 않으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흠’은 제사 규정에서 사용되는 기술적 표현으로, 단순한 미용상의 결점보다 제의적 자격을 떨어뜨리는 신체적 결함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘여러분에게’라는 관계 표현을 사용하여, 제물이 하나님께 받아들여지는지의 문제를 말합니다. 따라서 ‘받지 않으실 것입니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  english_pob_choice: anything that has a blemish
  chosen_korean: 몸에 흠이 있는 것은 무엇이든지
