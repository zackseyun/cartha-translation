  lexicon: HALOT
  rationale: 포괄적 금지 표현을 자연스러운 한국어로 옮기되, 제사 규정의 전문 용어인 ‘흠’을 유지하여 제의적 뉘앙스를 살렸습니다.
- source_word: מוּם
  english_pob_choice: blemish
  chosen_korean: 흠
