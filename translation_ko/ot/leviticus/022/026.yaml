  - 말하여
  lexicon: HALOT
  rationale: 서술형 신탁 도입 공식에서 דבר의 새 발화 시작을 자연스럽게 드러내기 위해, 단순한 ‘말하다’보다 격식 있는 ‘말씀하여 이르셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 사본-기반 원칙에 따라 신성호칭을 대체 титул이 아닌 고유명사로 옮겨, 야훼를 유지했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 향하여
  lexicon: HALOT
  rationale: 말씀의 수신자를 나타내는 방향성 전치사이므로 현대 한국어에서는 ‘모세에게’가 가장 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 전형적인 발화 도입구를 한국어에서는 반복을 줄여 한 문장으로 묶되, 다음 절의 직접 화법을 예고하는 기능을 살리기 위해 ‘이르셨습니다’로 마무리했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼로 음역하여 하나님의 개인적 언약 이름을 드러냅니다.
  alternative_readings:
