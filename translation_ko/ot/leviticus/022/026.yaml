  rationale: 본문은 단순한 칭호가 아니라 언약 이름 יְהוָה를 사용하므로, 전통적 대치어보다 이름 자체를 보존하는 번역이 원문 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
