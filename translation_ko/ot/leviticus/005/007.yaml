reference: Leviticus 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
  footnotes:
  - marker: a
    text: Or 'for a purification offering.' The Hebrew חַטָּאת can denote either 'sin' or the offering associated with removing impurity/sin in sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 재산이 양 한 마리까지 미치지 못하면, 그가 범한 죄로 말미암아 속건제로 야훼께 산비둘기 두 마리나 어린 집비둘기 두 마리를 가져오되, 하나는 속죄제물로, 다른 하나는 번제물로 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물로’. 히브리어 חַטָּאת는 제의 문맥에서 ‘죄’ 자체뿐 아니라 부정/죄를 제거하는 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תַגִּיע יָדוֹ דֵּי שֶׂה
  english_pob_choice: But if his means do not suffice for a sheep
  chosen_korean: 그러나 그의 재산이 양 한 마리까지 미치지 못하면
  alternatives_korean:
  - 그러나 그의 손이 양에 이를 만큼 미치지 못하면
  - 그러나 그는 양 한 마리를 감당할 형편이 되지 못하면
  lexicon: HALOT
  rationale: 히브리어 관용구는 경제적 여력을 뜻하므로, ‘재산’과 ‘미치지 못하면’으로 자연스럽게 옮겨 원문의 뜻을 드러냈습니다.
- source_word: אֲשָׁמוֹ
  english_pob_choice: his guilt offering
  chosen_korean: 속건제로
  alternatives_korean:
  - 그의 속건제로
  - 그의 죄책 제물로
  lexicon: HALOT
  rationale: 문맥상 가져오는 제의 행위를 가리키므로, 한국어에서는 제의명 ‘속건제’로 간결하게 살렸습니다.
- source_word: שְׁתֵּי תֹרִים / שְׁנֵי בְנֵי יוֹנָה
  english_pob_choice: two turtledoves or two young pigeons
  chosen_korean: 산비둘기 두 마리나 어린 집비둘기 두 마리
  alternatives_korean:
  - 산비둘기 두 마리나 어린 비둘기 두 마리
  - 두 마리의 산비둘기 또는 두 마리의 어린 집비둘기
  lexicon: HALOT
  rationale: 제사 규정의 새 종류를 구체적으로 드러내기 위해 ‘산비둘기’와 ‘어린 집비둘기’를 사용했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제로
  - 죄를 위한 제물로
  lexicon: HALOT
  rationale: 하나의 새를 가리키는 기능적 표현이므로, 제물임을 분명히 하는 ‘속죄제물’이 가장 자연스럽습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 불살라 드리는 제물로
  lexicon: HALOT
  rationale: 의례명과 제물의 성격을 함께 살리기 위해 ‘번제물’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 신명기적 사본 전통의 하나님의 이름을 ‘야훼’로 직역해, 제의 문맥에서 고유명을 보존했습니다.
  doctrine_reference: '프로젝트 표준: יהוה / YHWH = 야훼'
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제물
  alternative_readings:
  - 속죄제
  - 정결제물
  rationale: 이 절에서는 번제와 짝을 이루는 제의 항목으로 기능하므로, 전통적 번역인 ‘속죄제물’을 본문에 두되 제물성을 분명히 했습니다.
  doctrine_reference: 제의 용어의 기능적 등가 유지, 문맥상 제사 항목의 명시
