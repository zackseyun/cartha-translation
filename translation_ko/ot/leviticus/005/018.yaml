revisions:
- from: 그는 떼에서 흠 없는 숫양을, 곧 너의 평가한 값에 따라 속건제물로 제사장에게 가져와야 합니다. 제사장은 그가 모르고 저지른 그의 잘못을 두고 그를 위해 속죄할 것이며, 그는 용서를 받을 것입니다.[a][b]
  to: 그는 떼에서 흠 없는 숫양을, 당신이 정한 값에 따라 속건제물로 제사장에게 가져와야 합니다. 제사장은 그가 알지 못한 채 저지른 잘못에 대하여 그를 위해 속죄할 것이며, 그는 용서를 받을 것입니다.[a][b]
  rationale: ‘너의 평가한 값’을 ‘당신이 정한 값에 따라’로 고쳐 히브리어의 평가·산정 표현을 자연스러운 현대 한국어로 옮겼습니다. 무지와 비의도성을 나타내는 구절은 중복된 소유 표현을 제거하되 두 의미 요소를 모두 유지하도록 다듬었습니다. 평가의 주체는 원문이 문맥상 전제하는 범위를 넘어 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:09Z'
