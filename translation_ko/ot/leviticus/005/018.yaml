  terminology: ‘속건제물’은 אָשָׁם의 정착된 제의 범주를 적절히 나타내며, ‘속죄하다’와 ‘용서를 받다’도 כפר 및 ונסלח לו의 연결을 잘 보존합니다. ‘당신이 정한 값’의 ‘당신’은 히브리어 2인칭 단수 소유접미사를 보존하되 그 평가자가 누구인지는 본문보다 더 특정하지 않습니다.
