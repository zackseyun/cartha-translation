id: LEV.5.18
reference: Leviticus 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
  footnotes:
  - marker: a
    text: Or 'as a guilt offering'; alternatively, 'for a reparation offering.' The Hebrew אָשָׁם names a specific sacrificial category.
    reason: lexical_alternative
  - marker: b
    text: Or 'for his unintentional sin.' The Hebrew emphasizes an error committed inadvertently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 떼에서 흠 없는 숫양을, 곧 너의 평가한 값에 따라 속건제물로 제사장에게 가져와야 합니다. 제사장은 그가 모르고 저지른 그의 잘못을 두고 그를 위해 속죄할 것이며, 그는 용서를 받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속건제물’은 אָשָׁם이 가리키는 특정 제의 범주를 따른 번역입니다.
    reason: source_note
  - marker: b
    text: ‘모르고’는 히브리어가 강조하는 우발적·비의도적 잘못을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהֵבִיא
  english_pob_choice: He shall bring
  chosen_korean: 가져와야 합니다
  alternatives_korean:
  - 가져와야 합니다
  - 드려야 합니다
  lexicon: HALOT
  rationale: 법적 규정의 의무를 나타내므로 미래·의무형으로 옮겼고, 제사 문맥에서 자연스러운 ‘가져오다’를 택했습니다.
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 떼에서
  alternatives_korean:
  - 양 떼에서
  - 가축 떼에서
  lexicon: HALOT
  rationale: צֹאן은 작은 가축 무리를 가리키며, 앞의 ‘숫양’과 함께 두 번 ‘양’이라고 반복하지 않고도 원문의 범주를 살리기 위해 ‘떼’로 옮겼습니다.
- source_word: לְאָשָׁם
  english_pob_choice: for a guilt offering
  chosen_korean: 속건제물로
  alternatives_korean:
  - 속건제물로
  - 유죄제물로
  - 배상제물로
  lexicon: HALOT
  rationale: אָשָׁם은 레위기의 고정된 제의 범주이므로 전통적으로도 널리 쓰이는 ‘속건제물’을 택해 제의적 성격을 분명히 했습니다.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג וְהוּא לֹא יָדַע
  english_pob_choice: concerning the error that he committed unintentionally, though he did not know it
  chosen_korean: 그가 모르고 저지른 그의 잘못을 두고
  alternatives_korean:
  - 그가 부지중에 범한 그의 잘못을 두고
  - 그가 알지 못한 채 저지른 그의 잘못을 두고
  lexicon: HALOT
  rationale: שׁגגה와 שׁגג, 그리고 ‘알지 못함’이 함께 오므로 단순한 ‘죄’보다 ‘잘못’과 ‘모르고 저지르다’로 옮겨 우발성과 무지의 중첩을 살렸습니다.
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  english_pob_choice: the priest shall make atonement for him
  chosen_korean: 제사장은 그를 위해 속죄할 것이며
  alternatives_korean:
  - 제사장은 그를 위해 속죄할 것이며
  - 제사장은 그를 위하여 속죄를 행할 것이며
  lexicon: HALOT
  rationale: כפר의 제의적 뜻을 ‘속죄하다’로 옮겨 제사장 행위의 종교적 무게를 살렸고, ‘그를 위해’로 עָלָיו의 방향성을 자연스럽게 반영했습니다.
theological_decisions:
- issue: אָשָׁם의 제의 범주를 어떻게 한국어로 표기할지
  chosen_reading: 속건제물
  alternative_readings:
  - 배상제물
  - 유죄제물
  rationale: 본문은 특정 제사 범주를 가리키므로 의미를 풀어쓴 표현보다 한국어 성경 전통에서 인지 가능한 용어를 쓰되, 제의적 범주성을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: כפר의 결과를 어떻게 표현할지
  chosen_reading: 속죄할 것이며
  alternative_readings:
  - 속죄를 행할 것이며
  - 속죄제를 드릴 것이며
  rationale: 본문은 제사장의 제의 행위와 그 결과인 용서를 연결하므로, ‘속죄하다’가 제의적·신학적 연결을 가장 직접적으로 드러냅니다.
  doctrine_reference: Translation philosophy §6 (readable modern English, not archaic or academic)
