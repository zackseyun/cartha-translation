revisions:
- from: 그리고 그는 자신의 죄 때문에 여호와께 자기의 속건제를 가져와야 합니다. 곧 양 떼 가운데서 수컷이 아닌 암컷, 어린 양이나 암염소를 속죄제로 드려야 합니다. 제사장이 그의 죄를 위하여 그를 위하여 속죄할 것입니다.[a][b]
  to: 그리고 그는 자신이 지은 죄 때문에 여호와께 자신의 속건제[a]를 바쳐야 합니다. 곧 양 떼에서 암컷 한 마리, 곧 암양이나 암염소를 속죄제로 바쳐야 합니다. 제사장은 그의 죄에 대하여[b] 그를 위하여 속죄할 것입니다.
  rationale: 원문의 동물 성별과 종류를 정확히 드러내도록 ‘암양이나 암염소’로 고쳤습니다. 아샴과 하타트의 용어 구별은 유지했습니다. 마지막 절은 한국어의 불필요한 반복을 제거하되, 제사장이 그 사람을 위하여 속죄한다는 의미와 מִן의 가능한 제거 뉘앙스를 본문 및 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:09Z'
review_pass:
  verdict: revise
  source_fidelity: ‘속건제’(אשם)와 ‘속죄제’(חטאת)의 구별 및 여호와께 제물을 가져오는 의무는 대체로 잘 반영되었습니다. 그러나 ‘수컷이 아닌 암컷’은 원문의 간결한 성별 표지를 불필요하게 우회하며, ‘어린 양’은 여기서 요구되는 암양을 충분히 특정하지 못합니다. 또한 마지막 문장의 ‘그의 죄를 위하여 그를 위하여’는 한국어로 중복되고, מֵחַטָּאתוֹ가 지닌 죄로부터의/죄에 관한 관계를 자연스럽게 반영하지 못합니다.
  naturalness: 현대 합쇼체의 법규·제의 문맥에는 ‘바쳐야 합니다’, ‘암컷 한 마리, 곧 암양이나 암염소’, ‘그의 죄에 대하여 그를 위하여 속죄할 것입니다’가 더 자연스럽고 명료합니다. ‘수컷이 아닌 암컷’과 목적어구의 기계적 반복은 피하는 것이 좋습니다.
  terminology: ‘속건제’와 ‘속죄제’는 원문의 어휘상 긴장을 보존하는 적절한 전통적 제의 용어입니다. יהוה는 한국어 성경의 통용 표기인 ‘여호와’로 유지할 수 있습니다. כִּשְׂבָּה는 앞선 נְקֵבָה와 함께 암양을 뜻하므로 ‘암양’으로 명시하는 것이 안전합니다.
