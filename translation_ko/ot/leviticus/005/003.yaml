  rationale: 문맥은 접촉으로 생기는 부정 상태를 다루므로, 본문의 제의적 범주를 보존하는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
- issue: אָדָם의 번역
  chosen_reading: ‘사람’으로 번역해 일반적 인간을 가리키게 했습니다.
  alternative_readings:
  - 인간
  - 인자
  rationale: 여기서는 남성성보다 일반 인간을 가리키는 용법이므로, 자연스러운 현대 한국어로 처리했습니다.
  doctrine_reference: 'Contested terms: אָדָם is context-sensitive; render generically when the context is non-gender-specific.'
