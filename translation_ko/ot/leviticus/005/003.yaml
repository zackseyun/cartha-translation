source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
  footnotes:
  - marker: a
    text: Or 'human impurity.' The Hebrew term refers to ritual uncleanness in this legal context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it is hidden from him'; that is, he was unaware of it at the time.
    reason: lexical_alternative
translation:
  language: ko
  text: 혹시 사람이 접촉한 부정함—곧 부정하게 되는 모든 부정함—에 닿았는데 그것이 그에게서 감추어져 있다가, 그가 그것을 알게 되면 그는 죄책이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 부정함’입니다. 이 히브리어 표현은 이 법적 문맥에서 의식적 부정함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그에게서 감추어졌다’입니다. 곧 그가 그때는 그것을 알지 못했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  english_pob_choice: touches
  chosen_korean: 닿았는데
  alternatives_korean:
  - 접촉하면
  - 만지면
  lexicon: HALOT
  rationale: נגע + בְּ의 직접적 물리적 접촉을 자연스럽게 살리되, 레위기 법문체의 문맥을 고려해 ‘닿다’로 옮겼습니다.
- source_word: טֻמְאַת אָדָם
  english_pob_choice: human uncleanness
  chosen_korean: 사람이 접촉한 부정함
  alternatives_korean:
  - 인간의 부정함
  - 사람의 더러움
  lexicon: HALOT
  rationale: טֻמְאָה는 여기서 도덕적 죄가 아니라 의식적/제의적 부정함을 가리키므로 ‘부정함’으로 두었고, אָדָם은 일반적 인간을 가리키므로 ‘사람’으로 처리했습니다.
- source_word: לְכֹל טֻמְאָתוֹ אֲשֶׁר יִטְמָא בָּהּ
  english_pob_choice: any uncleanness by which one becomes unclean
  chosen_korean: 곧 부정하게 되는 모든 부정함
  alternatives_korean:
  - 그것으로 인해 부정하게 되는 모든 부정함
  - 부정하게 만드는 어떤 부정함
  lexicon: HALOT
  rationale: 반복되는 טֻמְאָה를 한국어에서 너무 어색하지 않게 압축하되, ‘부정하게 되는’으로 결과를 분명히 하여 법문이 말하는 범위를 유지했습니다.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  english_pob_choice: and it is hidden from him
  chosen_korean: 그것이 그에게서 감추어져 있다가
  alternatives_korean:
  - 그가 그것을 알지 못하다가
  - 그의 눈에 띄지 않다가
  lexicon: HALOT
  rationale: נעלם의 수동적 뉘앙스를 살려 ‘감추어져 있다가’로 옮겼고, POB의 법률적 문체를 반영했습니다.
- source_word: וְהוּא יָדַע
  english_pob_choice: and then he comes to know it
  chosen_korean: 그가 그것을 알게 되면
  alternatives_korean:
  - 그가 그것을 알면
  - 그가 그것을 깨닫게 되면
  lexicon: HALOT
  rationale: 이 절은 뒤늦은 인지를 나타내므로, 시간적 전개를 분명히 하는 조건문 형태로 옮겼습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: he is guilty
  chosen_korean: 그는 죄책이 있습니다
  alternatives_korean:
  - 그는 유죄입니다
  - 그는 죄를 집니다
  lexicon: HALOT
  rationale: אָשֵׁם은 단순한 도덕 판단보다 법적 책임/죄책을 뜻하므로, 제의-법정적 뉘앙스를 살린 ‘죄책이 있습니다’로 옮겼습니다.
theological_decisions:
- issue: טֻמְאָה의 성격
  chosen_reading: 의식적·제의적 부정함으로 유지하고, 도덕적 ‘죄악’으로 바꾸지 않았습니다.
  alternative_readings:
