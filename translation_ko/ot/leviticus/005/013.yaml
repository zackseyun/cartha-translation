revisions:
- from: 이렇게 제사장이 그가 이 가운데 어떤 한 가지를 범하여 지은 죄에 대해 그를 속죄하면, 그는 용서받을 것입니다. 그리고 그것은 곡식 제물처럼 제사장에게 속할 것입니다.[a]
  to: 제사장은 그가 이 가운데 하나를 범하여 지은 죄를 위하여 그를 속죄할 것이며, 그는 용서받을 것입니다. 그 제물은 곡식 제물처럼 제사장에게 속할 것입니다.[a]
  rationale: The revision expresses the beneficiary relationship of כפר על with ‘그를 위하여,’ restores the source’s coordinated future sequence, and streamlines the reference to one of the listed offenses. It preserves the passive, agent-unspecified forgiveness formula and the contextual rendering of מִנְחָה as ‘곡식 제물.’
