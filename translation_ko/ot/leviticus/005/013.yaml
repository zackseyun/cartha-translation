  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
  footnotes:
  - marker: a
    text: Or, 'and it shall be forgiven him.' The Hebrew is passive and does not explicitly name the forgiver.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장은 그가 이 가운데 하나를 범하여 지은 죄를 위하여 그를 속죄할 것이며, 그는 용서받을 것입니다. 그 제물은 곡식 제물처럼 제사장에게 속할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 용서가 주어질 것입니다.’ 히브리어는 수동형이며, 용서하시는 분을 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  english_pob_choice: the priest shall make atonement for him
  chosen_korean: 제사장이 ... 그를 속죄하면
  alternatives_korean:
  - 제사장이 ... 그를 속죄하여
  - 제사장이 ... 그를 속죄할 것입니다
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 살려 ‘속죄하다’로 옮기되, 결과를 나타내는 문맥에 맞게 한국어에서는 조건·결과 흐름의 문장으로 자연스럽게 처리했습니다.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  english_pob_choice: for his sin that he committed
  chosen_korean: 그가 ... 지은 죄에 대해
  alternatives_korean:
  - 그의 죄에 대해
  - 그가 범한 죄에 대해
  lexicon: HALOT
  rationale: חטאת가 여기서는 속죄 제물보다 ‘죄’ 자체를 가리키는 문맥이므로, ‘지은 죄’로 옮겨 행위의 책임을 분명히 했습니다.
- source_word: מֵאַחַת מֵאֵלֶּה
  english_pob_choice: in any one of these matters
  chosen_korean: 이 가운데 어떤 한 가지를
  alternatives_korean:
  - 이것들 가운데 하나를
  - 이러한 일들 가운데 하나를
  lexicon: HALOT
  rationale: 앞서 열거된 사례들을 가리키는 부분이므로, ‘어떤 한 가지’로 간결하게 옮겨 범위의 개별성을 살렸습니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: and he shall be forgiven
  chosen_korean: 그는 용서받을 것입니다
  alternatives_korean:
  - 그에게 용서가 주어질 것입니다
  - 그가 용서받게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 수동형으로 용서의 결과를 말하므로, 용서하시는 분을 따로 밝히지 않는 수동적 표현을 유지했습니다.
- source_word: וְהָיְתָה לַכֹּהֵן כַּמִּנְחָה
  english_pob_choice: And it shall belong to the priest, like the grain offering
  chosen_korean: 그리고 그것은 곡식 제물처럼 제사장에게 속할 것입니다
  alternatives_korean:
  - 그리고 그것은 제사장에게 속할 것입니다, 곡식 제물처럼
  - 그리고 그것은 소제처럼 제사장에게 돌아갈 것입니다
  lexicon: HALOT
  rationale: מִנְחָה는 본문 맥락상 ‘곡식 제물’이 가장 분명하며, לַכֹּהֵן의 소유·권리 의미는 ‘속하다’로 옮기는 것이 자연스럽습니다.
theological_decisions:
- issue: 용서의 행위자를 드러내지 않는 수동형 유지
  chosen_reading: 그는 용서받을 것입니다
  alternative_readings:
  - 하나님이 그를 용서하실 것입니다
  - 그에게 용서가 주어질 것입니다
  rationale: 본문은 용서의 결과를 말하면서 용서의 주체를 명시하지 않으므로, 제의적 절차의 효력을 드러내되 신학적 주체를 문장 안에서 과도하게 보강하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
