id: LEV.5.12
reference: Leviticus 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
  footnotes:
  - marker: a
    text: Or, 'It is a purification offering.' The Hebrew term can denote the offering that deals with sin by purification.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'offerings by fire of the LORD'; rendered 'food offerings of the LORD' for clear modern English in this sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 제사장에게 가져와야 합니다. 제사장은 그것 가운데서 한 움큼을 그 기념물로 집어 제단 위에서 야훼의 화제물들[b] 위에 불살라야 합니다. 그것은 속죄제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’로 옮길 수 있습니다. 히브리어 용어는 죄를 다루는 희생제의 정결 기능을 함께 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘야훼의 불로 드리는 제물들’이라는 뜻입니다. 제의 문맥에서 현대 한국어로는 ‘화제물들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  english_pob_choice: Then he shall bring it
  chosen_korean: 그는 그것을 가져와야 합니다
  alternatives_korean:
  - 그는 그것을 데려와야 합니다
  - 그는 그것을 바쳐야 합니다
  lexicon: HALOT
  rationale: 제물 문맥에서 목적지인 제사장에게 '가져오다'가 가장 자연스럽고, 순서를 나타내는 뉘앙스는 앞뒤 문맥으로 충분히 드러납니다.
- source_word: וְקָמַץ
  english_pob_choice: shall take ... a handful
  chosen_korean: 한 움큼을 집어
  alternatives_korean:
  - 한 줌을 집어
  - 손에 가득 찬 만큼을 집어
  lexicon: HALOT
  rationale: 제의적 기술 동작을 한국어로는 '한 움큼'이 가장 분명하게 살리며, 동작은 '집다'로 옮겨 제사장의 행위를 직접적으로 보여 줍니다.
- source_word: אַזְכָּרָתָהּ
  english_pob_choice: as its memorial portion
  chosen_korean: 그것의 기념 몫
  alternatives_korean:
  - 그것의 기억 몫
  - 그것의 기념 부분
  lexicon: HALOT
  rationale: אַזכָּרָה는 제단에 태워 하나님 앞에 올리는 기술용어이므로, '기념'을 살리되 제의적 분량임을 드러내는 '몫'으로 옮겼습니다.
- source_word: עַל אִשֵּׁי יְהוָה
  english_pob_choice: in addition to the food offerings of Yahweh
  chosen_korean: 야훼의 화제물들에 더하여
  alternatives_korean:
  - 야훼의 불로 드리는 제물들 위에
  - 야훼의 화제물들 위에
  lexicon: HALOT
  rationale: אִשֵּׁי는 문자적으로 '불로 드리는 것들'로, 한국어 성경의 제의 문맥에서는 '화제물'이 의미를 가장 직접적으로 보존합니다. עַל은 이 문맥에서 단순한 '위에'보다 '더하여/함께'의 관계를 더 잘 드러냅니다.
- source_word: חַטָּאת הִוא
  english_pob_choice: It is a sin offering
  chosen_korean: 그것은 속죄제입니다
  alternatives_korean:
  - 그것은 속죄제물입니다
  - 그것은 죄를 위한 제물입니다
  lexicon: HALOT
  rationale: POB가 본문에서 유지한 제의적 분류를 한국어 관용에 맞게 '속죄제'로 옮겼습니다. '속죄제물'도 가능하지만, 희생제의 항목명으로는 '속죄제'가 더 간결합니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미 범위
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 속죄제물
  rationale: 이 절은 제사 규정의 분류문으로 읽히므로, 행위의 정결 기능을 인정하되 본문 표제는 전통적 제의 항목명인 '속죄제'로 유지했습니다. 다만 단어의 의미 범위에는 정결의 뉘앙스가 남아 있습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
