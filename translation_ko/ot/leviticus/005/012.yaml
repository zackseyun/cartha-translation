  to: 그는 그것을 제사장에게 가져와야 합니다. 제사장은 그것 가운데서 한 움큼을 그 기념물로 집어 제단 위에서 야훼의 화제물들[b] 위에 불살라야 합니다. 그것은 속죄제입니다.[a]
