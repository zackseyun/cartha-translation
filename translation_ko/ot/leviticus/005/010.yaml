  source_fidelity: 원문은 ‘두 번째 것’을 번제로 정해진 규례에 따라 행하고, 제사장이 그 사람이 범한 죄와 관련하여 그를 위하여 속죄하며, 그가 용서받는다는 순서를 말합니다. 초안은 ‘그 죄를 위하여’가 중복되어 원문의 관계를 흐리고, ‘속죄하게 하리니’는 제사장의 직접 행위를 다소 부정확하게 나타냅니다.
  naturalness: ‘두 번째 것’, ‘규례대로’, ‘그를 위하여 속죄할 것입니다’는 제의 문맥에서 자연스럽고 현대 표준 한국어의 격식 있는 합쇼체에 맞습니다. 반복된 구절을 제거하여 문장이 명료해집니다.
  terminology: עֹלָה는 전통적이고 정확한 용어인 ‘번제’로, כפר는 후대 교리적 의미를 덧붙이지 않는 ‘속죄하다’로 옮겼습니다. נִסְלַח의 수동 표현은 용서의 주체를 명시하지 않고 ‘사함을 받을 것입니다’로 보존했습니다.
  issues:
  - severity: high
    issue: ‘그가 범한 죄를 위하여 그 죄를 위하여’라는 중복
    rationale: 원문에는 ‘그가 범한 죄’가 한 번만 나오며, 중복은 문법적으로도 부자연스럽고 속죄의 대상/근거 관계를 불명료하게 합니다.
  - severity: medium
    issue: ‘속죄하게 하리니’의 사역 표현
    rationale: וְכִפֶּר의 주어는 제사장이며 직접 ‘속죄할’ 행위입니다. 사역형은 원문에 없는 별도 행위자를 암시할 수 있습니다.
  revised_text: 그는 두 번째 것을 규례대로 번제로 드릴 것입니다. 제사장은 그가 범한 죄 때문에 그를 위하여 속죄할 것이며, 그는 사함을 받을 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “정해진 절차대로.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “그에게 용서될 것이다”라는 수동 표현이며, 용서하시는 분을 명시하지 않습니다.
    reason: lexical_alternative
  revision_rationale: 중복된 ‘그 죄를 위하여’를 삭제하고, 제사장이 직접 속죄한다는 원문의 문법을 반영했습니다. ‘두 번째 것’은 앞 절의 두 번째 새를 가리키되 본문의 생략을 유지합니다. 수동 용서 공식의 신적 행위자 비명시는 유지했습니다.
