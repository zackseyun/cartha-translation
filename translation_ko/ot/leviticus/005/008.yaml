    rationale: מִמּוּל(맞은편/앞)과 עָרֶף(목덜미/목 뒤)의 결합은 난해합니다. ‘목덜미 맞은편’으로 더 가깝게 옮기고 가능한 이해를 각주에 밝혀야 합니다.
