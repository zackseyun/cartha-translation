revisions:
- from: 그리고 그것들을 제사장에게 가져가야 합니다. 그러면 그는 먼저 속죄제의 제물을 드리고, 그 머리를 목 앞쪽에서 집어 떼어야 하지만, 완전히 끊어서는 안 됩니다.[a][b]
  to: 그것들을 제사장에게 가져가야 합니다. 제사장은 먼저 속죄제로 바칠 것을 드리고, 그 머리를 목덜미 맞은편에서 집어 떼되[a][b], 완전히 분리해서는 안 됩니다.[c]
  rationale: 행위 주체를 ‘제사장’으로 명시하여 한국어 지시 관계를 바로잡았습니다. 난해한 מִמּוּל עָרְפּוֹ는 ‘목 앞쪽’으로 확정하지 않고 ‘목덜미 맞은편’으로 더 문자적으로 옮겼으며, 해석의 여지는 각주에 보존했습니다. 또한 מָלַק의 기술적 의미와 ‘완전히 분리하지 말라’는 금지의 관계를 각주로 명료하게 했습니다.
