id: LEV.5.8
reference: Leviticus 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
  footnotes:
  - marker: a
    text: Or, 'sin offering'; the Hebrew term חַטָּאת can also be understood more specifically as a 'purification offering' in Levitical sacrificial contexts.
    reason: lexical_alternative
  - marker: b
    text: The verb describes the priest's ritual handling of a bird sacrifice; traditional English versions often render it 'wring off' the head.
    reason: lexical_alternative
  - marker: c
    text: That is, the head was not to be fully detached from the body.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그것들을 제사장에게 가져가야 합니다. 그러면 그는 먼저 속죄제의 제물을 드리고, 그 머리를 목 앞쪽에서 집어 떼어야 하지만, 완전히 끊어서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄제’는 여기서 신학적으로 ‘정결제물’로도 이해될 수 있는 חַטָּאת의 일반적인 제의적 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 머리를 몸에서 완전히 떼어내지 말라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם
  english_pob_choice: he shall bring them
  chosen_korean: 그것들을 가져가야 합니다
  alternatives_korean:
  - 그것들을 데려가야 합니다
  - 그것들을 바쳐야 합니다
  lexicon: HALOT
  rationale: 앞 문맥의 두 새를 가리키므로 복수 대명사를 유지했고, 제의적 문맥에서 자연스러운 ‘가져가다’로 옮겼습니다.
- source_word: אֶל הַכֹּהֵן
  english_pob_choice: to the priest
  chosen_korean: 제사장에게
  alternatives_korean:
  - 담당 제사장에게
  - 제사장 앞으로
  lexicon: HALOT
  rationale: 히브리어 전치사구를 직접 반영해, 불필요한 수식을 더하지 않고 간명하게 옮겼습니다.
- source_word: וְהִקְרִיב אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  english_pob_choice: he shall present first the one for the sin offering
  chosen_korean: 먼저 속죄제의 제물을 드리고
  alternatives_korean:
  - 먼저 죄제의 제물을 드리고
  - 먼저 정결제물을 드리고
  lexicon: HALOT
  rationale: ראשׁונה의 선행 의미를 ‘먼저’로 살리고, חטאת는 이 제의 문맥에서 표준적인 ‘속죄제’로 옮겼습니다. POB의 ‘sin offering’에 대응하되 한국어 교회어를 유지했습니다.
- source_word: וּמָלַק אֶת רֹאשׁוֹ מִמּוּל עָרְפּוֹ
  english_pob_choice: he shall pinch off its head from the front of its neck
  chosen_korean: 그 머리를 목 앞쪽에서 집어 떼어야 하지만
  alternatives_korean:
  - 그 머리를 목 앞쪽에서 비틀어 떼어야 하지만
  - 그 머리를 목 앞쪽에서 잘라 내야 하지만
  lexicon: HALOT
  rationale: מלק는 새 제사에서의 기술적 동작을 가리키므로, POB의 ‘pinch off’ 취지를 따라 ‘집어 떼다’로 옮겨 동작의 직접성을 살렸습니다. מִמּוּל עָרְפּוֹ는 해부학적 세부를 과도하게 단정하지 않으면서 방향성을 드러내는 ‘목 앞쪽에서’가 가장 안전합니다.
- source_word: וְלֹא יַבְדִּיל
  english_pob_choice: but he shall not sever it
  chosen_korean: 완전히 끊어서는 안 됩니다
  alternatives_korean:
  - 나누어서는 안 됩니다
  - 분리해서는 안 됩니다
  lexicon: HALOT
  rationale: בדל은 ‘분리하다/나누다’의 뜻이지만, 문맥상 머리를 몸에서 완전히 떼어내지 말라는 금지이므로 자연스러운 한국어로 ‘완전히 끊다’로 구체화했습니다.
theological_decisions:
- issue: חטאת의 한국어 전통 용어와 의미 범위
  chosen_reading: ‘속죄제’로 번역하되, 제의 문맥의 대체 가능 의미를 과도하게 확장하지 않았습니다.
  alternative_readings:
  - ‘정결제물’
  - ‘죄제’
  rationale: 레위기의 제의 규정에서는 חטאת가 ‘sin offering’으로 굳어진 제의 용어이므로, 한국어 독자에게 즉시 인식되는 ‘속죄제’를 택했습니다. 이는 POB의 기본 선택과도 부합합니다.
  doctrine_reference: 레위기 제의법의 용어 일관성
- issue: מלק 동작의 표현
  chosen_reading: ‘집어 떼다’로 옮겨 새 제사의 특수한 동작을 드러냈습니다.
  alternative_readings:
  - ‘비틀어 떼다’
  - ‘목을 꺾다’
  rationale: 본문은 목을 완전히 끊는 것이 아니라 특정 위치에서 머리 부분을 떼는 절차를 말합니다. 너무 강한 표현은 제의 절차의 세밀함을 흐릴 수 있어, 동작은 드러내되 해부학적 과잉 해석은 피했습니다.
  doctrine_reference: 제의 절차의 정확한 재현
