revisions:
- from: 그러나 그의 손이 두 산비둘기나 두 어린 집비둘기를 마련할 수 없으면, 자기가 지은 죄를 위한 예물로 고운 가루 십분의 일 에바를 속죄제물로 가져와야 합니다. 그는 그것에 기름을 붓지 말고, 향도 올리지 말아야 합니다. 그것은 속죄제물이기 때문입니다.[a]
  to: 그러나 그가 두 산비둘기나 어린 비둘기 두 마리를 마련할 형편이 되지 않으면, 자기가 지은 죄를 위한 예물로 고운 가루 십분의 일 에바를 속죄제물로 가져와야 합니다. 그는 그 위에 기름을 붓거나 유향을 얹어서는 안 됩니다. 그것은 속죄제물이기 때문입니다.[a]
  rationale: 유향이라는 정확한 제의 용어를 복원하고, 어린 비둘기를 ‘집비둘기’로 과도하게 특정한 부분을 수정했습니다. 또한 빈곤을 나타내는 히브리어 관용구를 현대 한국어의 자연스러운 법규적 조건문으로 옮겼습니다. 속죄제물, 에바, 고운 가루 등 원문의 제의적·측량적 표현은 유지했습니다.
