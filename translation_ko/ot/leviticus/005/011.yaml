  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. 다만 ‘그의 손이 … 마련할 수 없으면’은 한국어에서 다소 부자연스럽고 관용구의 경제적 의미도 불분명해질 수 있으므로 ‘마련할 형편이 되지 않으면’이 더 자연스럽습니다. ‘향을 올리다’도 제물 위에 유향을 두는 행위를 정확히 나타내지 못합니다.
  terminology: ‘속죄제물’은 חַטָּאת의 제의적 의미를 적절히 반영합니다. ‘유향’은 לְבֹנָה의 정착된 정확한 용어이므로 반드시 사용해야 합니다. תֹרִים은 ‘산비둘기’, בְנֵי יוֹנָה는 ‘어린 비둘기’로 구별하되 후자를 ‘집비둘기’로 확정하지 않는 것이 안전합니다.
