source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
  footnotes:
  - marker: a
    text: Literally, 'if his hand does not reach'—a Hebrew idiom meaning he lacks sufficient means.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 손이 두 산비둘기나 두 어린 집비둘기를 마련할 수 없으면, 자기가 지은 죄를 위한 예물로 고운 가루 십분의 일 에바를 속죄제물로 가져와야 합니다. 그는 그것에 기름을 붓지 말고, 향도 올리지 말아야 합니다. 그것은 속죄제물이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손이 미치지 못하면’이라는 뜻으로, 충분한 재정적 형편이 없음을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  english_pob_choice: his means are not sufficient
  chosen_korean: 그의 손이 …을 마련할 수 없으면
  alternatives_korean:
  - 그의 손이 …에 미치지 못하면
  - 그가 감당할 수 없으면
  - 그의 형편이 충분하지 않으면
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘손이 미치다’는 살리되, 제의 문맥에서의 경제적 부족을 드러내기 위해 ‘마련할 수 없으면’으로 자연스럽게 옮겼습니다.
- source_word: תֹרִים / בְנֵי יוֹנָה
  english_pob_choice: turtledoves / young pigeons
  chosen_korean: 산비둘기 / 어린 집비둘기
  alternatives_korean:
  - 비둘기 / 어린 비둘기
  - 멧비둘기 / 어린 비둘기
  lexicon: HALOT
  rationale: 제물 규정의 구체적 조류를 살리기 위해 영어 POB의 종 구분에 맞춰 두 종류를 각각 구별해 옮겼습니다.
- source_word: קָרְבָּנוֹ … לְחַטָּאת
  english_pob_choice: his offering … for a sin offering
  chosen_korean: 자기가 지은 죄를 위한 예물로 … 속죄제물로
  alternatives_korean:
  - 그의 예물로 … 속죄제물로
  - 그가 범한 죄를 위한 예물로 … 속죄제물로
  lexicon: HALOT
  rationale: קָרְבָּן은 일반적 ‘예물’로, לְחַטָּאת는 제의적 용법의 ‘속죄제물’로 옮겨 죄와 제물의 관계를 분명히 했습니다.
- source_word: עֲשִׂירִת הָאֵפָה סֹלֶת
  english_pob_choice: a tenth of an ephah of fine flour
  chosen_korean: 고운 가루 십분의 일 에바
  alternatives_korean:
  - 에바 십분의 일의 고운 가루
  - 고운 밀가루 십분의 일 에바
  lexicon: HALOT
  rationale: 고대 부피 단위 에바를 유지하고, סֹלֶת은 제물용 ‘고운 가루’로 옮겨 제의적 성격을 보존했습니다.
- source_word: שֶׁמֶן / לְבֹנָה
  english_pob_choice: oil / frankincense
  chosen_korean: 기름 / 향
  alternatives_korean:
  - 올리브기름 / 유향
  - 기름 / 유향
  lexicon: HALOT
  rationale: שֶׁמֶן은 일반적인 ‘기름’, לְבֹנָה는 제의 문맥상 ‘향’으로 옮길 수 있으나, 본문에서 향료의 금지를 직접 살리기 위해 간명하게 처리했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄
  - 속죄제
  rationale: 이 문맥은 죄의 개념보다 가져오는 제물 자체를 규정하므로, ‘속죄제물’이 제의적 기능을 가장 분명하게 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 부족한 형편을 나타내는 관용구의 처리
  chosen_reading: 그의 손이 …을 마련할 수 없으면
  alternative_readings:
  - 그의 손이 …에 미치지 못하면
  - 그가 가난하면
  rationale: 히브리어 관용구를 직역적 이미지와 경제적 의미를 함께 살려, 예외 규정의 법적 조건을 유지했습니다.
  doctrine_reference: Translation philosophy §6
