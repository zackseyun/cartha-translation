  text: 누구든지 이 일들 가운데 하나에 대하여 죄책을 지게 되면[a], 그 일에 관하여 자신이 지은 죄를 고백해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유죄가 되면’ 또는 ‘죄책을 입게 되면.’ 히브리어 동사는 단지 내면적으로 잘못을 깨닫는 것보다 법적 죄책 또는 책임 아래 놓이는 것을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 그 일에 관하여 죄지은 것을.’ ‘그 일’은 바로 앞에 열거된 사례들 가운데 해당 사례를 가리킵니다.
    reason: lexical_alternative
