id: LEV.5.21
reference: Leviticus 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
  footnotes:
  - marker: a
    text: Or 'a pledge' or 'something placed in his hand' for 'a security entrusted to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 죄를 지어 야훼께 신의를 저버리는 행위를 하며, 이웃이 맡긴 물건이나 담보물[a], 또는 강탈한 일에 관하여 그 이웃에게 거짓을 말하거나 그 이웃을 억압했을 때,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘손에 맡겨진 것’이며, ‘담보물’ 또는 ‘위탁물’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: a person
  chosen_korean: 사람이
  alternatives_korean:
  - 어떤 사람이
  - 한 사람이
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 ‘영혼’이 아니라 한 사람을 가리키므로, 자연스러운 현대 한국어 법조문 톤인 ‘사람이’로 옮겼습니다.
- source_word: וּמָעֲלָה מַעַל
  english_pob_choice: commits a breach of faith
  chosen_korean: 신의를 저버리는 잘못을 범하여
  alternatives_korean:
  - 신의를 저버리고
  - 부정을 저지르고
  - 신실하지 않게 행하고
  lexicon: HALOT
  rationale: 중첩 어형이 관계적·언약적 불신실함을 강조하므로, 단순한 ‘범죄’보다 ‘신의를 저버리는 잘못’이 의미를 더 정확히 드러냅니다.
- source_word: בַּיהוָה
  english_pob_choice: against the LORD
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼께 대하여
  - 주님께 대하여
  - 여호와께 대하여
  lexicon: HALOT
  rationale: 이 구절은 이웃에 대한 속임수를 야훼에 대한 배신으로 규정하므로, 직접적인 대적 관계를 드러내는 ‘야훼 앞에서’가 적절합니다. 본 프로젝트의 YHWH 기본형인 ‘야훼’를 따랐습니다.
- source_word: בְּפִקָּדוֹן / בִתְשׂוּמֶת יָד
  english_pob_choice: a security entrusted to him / a pledge
  chosen_korean: 맡겨진 것[a]이나 저당물
  alternatives_korean:
  - 위탁된 물건
  - 맡아 둔 물건
  - 담보물
  lexicon: HALOT
  rationale: בְּפִקָּדוֹן은 맡겨 보관한 재산을, בִתְשׂוּמֶת יָד은 ‘손에 맡겨진/넘겨진 것’에 가까운 모호한 법률 표현을 가리키므로, 본문과 각주를 함께 살려 ‘맡겨진 것’과 ‘저당물’로 처리했습니다.
- source_word: בְגָזֵל
  english_pob_choice: through robbery
  chosen_korean: 강탈한 것
  alternatives_korean:
  - 약탈한 것
  - 빼앗은 것
  - 강도질한 것
  lexicon: HALOT
  rationale: 연속된 소유·재산 침해 항목의 하나로서, 결과물 명사처럼 자연스럽게 읽히는 ‘강탈한 것’이 간결합니다.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  english_pob_choice: if he has oppressed his neighbor
  chosen_korean: 자기 이웃을 억압했을 때
  alternatives_korean:
  - 자기 이웃을 착취했을 때
  - 자기 이웃을 학대했을 때
  - 자기 이웃을 압제했을 때
  lexicon: HALOT
  rationale: עָשַׁק은 경제적 착취와 압제를 아우르므로, 법적·윤리적 무게를 함께 담는 ‘억압하다’가 가장 넓고 균형 잡힌 대응입니다.
theological_decisions:
- issue: 이웃에 대한 경제적/재산적 죄를 야훼에 대한 위반으로 함께 표현할지 여부
  chosen_reading: ‘야훼 앞에서 신의를 저버리는 잘못’으로 직역하여 수직적 위반을 드러냄
  alternative_readings:
  - 이웃에게 거짓을 행한 것으로만 옮김
  - 야훼와의 언약을 어긴 것으로 설명적으로 확대
  rationale: 히브리어는 이웃에 대한 속임수를 곧바로 야훼께 대한 faithlessness로 규정하므로, 그 신학적 긴장을 약화시키지 않기 위해 설명을 덧붙이지 않고 본문이 가진 양면성을 보존했습니다.
  doctrine_reference: 'Affirmations; Translation philosophy #3'
