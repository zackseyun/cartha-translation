base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
  footnotes:
  - marker: a
    text: Or 'It is a guilt offering; he is certainly guilty against the LORD.' The Hebrew repeats the root אשם ('guilt'/'be guilty') for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 속건제입니다. 그는 참으로 야훼께 죄를 지었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘속건제’와 ‘죄를 짓다’에 같은 어근 אשם을 반복하여 그의 죄책을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  english_pob_choice: guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제
  - 배상제
  - 허물제
  lexicon: HALOT
  rationale: 제의 문맥에서 אָשָׁם은 특정 희생제사인 ‘guilt offering’에 해당하므로, 한국어에서는 제사 용어로 굳어진 ‘속건제’를 채택하는 것이 가장 직접적입니다.
- source_word: הוּא
  english_pob_choice: It is
  chosen_korean: 그것은
  alternatives_korean:
  - 이것은
  - 이는
  lexicon: HALOT
  rationale: 대상 제물을 지시하는 계사적 표현이므로 자연스러운 한국어 문장으로 ‘그것은’이라고 옮겼습니다.
- source_word: אָשֹׁם אָשַׁם
  english_pob_choice: has indeed incurred guilt
  chosen_korean: 실제로 … 범죄하였습니다
  alternatives_korean:
  - 분명히 … 죄를 지었습니다
  - 반드시 … 유죄가 되었습니다
  - 참으로 … 죄책을 지었습니다
  lexicon: HALOT
  rationale: 같은 어근의 반복은 강조를 나타내므로, 단순한 ‘죄가 있다’보다 실재적 책임과 확정성을 드러내는 ‘실제로 범죄하였습니다’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 향해
  - 야훼에 대하여
  - 주님께
  lexicon: HALOT
  rationale: 히브리어 לַיהוָה는 이 문맥에서 야훼와의 관계 안에서의 책임을 표시하므로, 제의·법정적 책임을 간결하게 드러내는 ‘야훼께’로 옮겼습니다.
theological_decisions:
- issue: ἁ마르/אשם 계열의 반복이 제사와 죄책의 연결을 어떻게 드러내는가
  chosen_reading: 제물의 이름과 ‘범죄하다’의 반복을 함께 살려, 속건제가 실제 죄책에 근거한 제사임을 드러냈습니다.
  alternative_readings:
  - ‘그는 참으로 야훼 앞에 죄가 있습니다’
  - ‘그는 야훼를 향해 분명히 죄를 지었습니다’
  rationale: 이 절은 제사의 명칭과 죄책 진술을 결합해 속건제의 필요를 설명하므로, 의미상 연결을 유지하는 것이 중요합니다.
  doctrine_reference: 레위기 5:19 속건제 규정
