  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문은 여호와의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 신적 호칭이 아닌 고유명사 ‘야훼’로 옮깁니다.
- source_word: אֶל
