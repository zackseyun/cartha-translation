  - 께
  lexicon: HALOT
  rationale: 발화의 수신자를 표시하는 전치사는 현대 한국어에서 ‘-에게’가 가장 자연스럽고 문맥상 중립적입니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 확립된 관용형 ‘모세’를 사용합니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 표기하여 하나님의 고유한 언약 이름을 보존합니다.
  alternative_readings:
