  - ‘여호와’로 표기
  rationale: 본문이 제목이 아니라 고유명사 יְהוָה를 사용하므로, 의미를 약화시키지 않도록 대체 호칭 대신 이름 자체를 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
