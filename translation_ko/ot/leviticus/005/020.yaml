- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 확립된 관용형 ‘모세’를 사용합니다.
