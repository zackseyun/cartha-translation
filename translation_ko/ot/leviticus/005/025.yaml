revisions:
- from: 그는 자신의 속건제물을 야훼께 가져와야 합니다. 곧 양 떼에서 나온 흠 없는 숫양을, 당신의 값에 따라, 속건제물로 제사장에게 가져와야 합니다.[a][b]
  to: 그는 자신의 속건제물[a], 곧 양 떼에서 나온 흠 없는[b] 숫양을 당신이 정한 값에 따라 속건제물로 야훼께, 제사장에게 가져와야 합니다.
  rationale: 속건제물과 숫양의 동격 관계를 한 문장으로 반영하여 원문의 단일 동사를 보존했습니다. 평가액은 ‘당신이 정한 값’으로 명확히 했으며, ‘야훼께’와 ‘제사장에게’라는 두 방향 표현은 원문의 어순과 두 전치사구를 보존하기 위해 유지했습니다. 각주 표지는 해당 어휘 바로 뒤로 옮겼습니다.
