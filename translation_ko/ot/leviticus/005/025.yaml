id: LEV.5.25
reference: Leviticus 5:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
  footnotes:
  - marker: a
    text: Or 'his guilt offering.' The Hebrew term אָשָׁם can refer both to guilt/reparation and to the specific guilt offering.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'without blemish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 속건제물[a], 곧 양 떼에서 나온 흠 없는[b] 숫양을 당신이 정한 값에 따라 속건제물로 야훼께, 제사장에게 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 속건제물’. 히브리어 אָשָׁם은 죄책이나 배상을 가리킬 수도 있고, 특정한 속건제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘흠 없이’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת אֲשָׁמ֥/וֹ
  english_pob_choice: his guilt offering
  chosen_korean: 자신의 속건제물
  alternatives_korean:
  - 자신의 죄책제물
  - 자신의 속죄제물
  - 자신의 죄값 제물
  lexicon: HALOT
  rationale: אָשָׁם은 문맥상 죄책 상태와 그에 대한 배상/속건 제물을 함께 가리킬 수 있으므로, 제사 명칭으로 통용되면서도 배상 성격을 담는 '속건제물'을 택했습니다.
- source_word: לַ/יהוָ֑ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: Source text יהוה / POB audit trail
  rationale: 원문이 여호와 신명기 이름을 직접 사용하므로, 프로젝트 기본값에 따라 '야훼'를 유지해 본문에서 언약적 고유성을 드러냈습니다.
- source_word: אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן
  english_pob_choice: a flawless ram from the flock
  chosen_korean: 양 떼에서 나온 흠 없는 숫양
  alternatives_korean:
  - 흠 없는 숫양
  - 양 떼 가운데서 나온 흠 없는 숫양
  - 전혀 흠 없는 숫양
  lexicon: HALOT
  rationale: אַיִל은 '숫양'으로, תָּמִים은 제사 적합성의 결함 없음이라는 의미를 살려 '흠 없는'으로 옮겼고, מִן הַצֹּאן은 출처를 자연스럽게 드러내는 '양 떼에서 나온'으로 처리했습니다.
- source_word: בְּ/עֶרְכְּ/ךָ֥
  english_pob_choice: according to your valuation
  chosen_korean: 당신의 값에 따라
  alternatives_korean:
  - 당신의 평가에 따라
  - 당신이 정한 값대로
  - 당신의 산정에 따라
  lexicon: HALOT
  rationale: 여기서 ערך는 제의적·법적 평가액을 가리키므로, 한국어에서는 직설적이면서도 법정적 뉘앙스를 살리는 '값'을 택했습니다.
theological_decisions:
- issue: אָשָׁם의 이중 뉘앙스 유지
  chosen_reading: 본문의 첫 항목은 '속건제물'로, 뒤의 לְאָשָׁם도 같은 제사 범주를 가리키는 것으로 번역해 의미의 중첩을 드러냈습니다.
  alternative_readings:
  - 첫 항목만 '배상제물'로 따로 구분하기
  - 두 항목 모두 '속건제물'로 동일화하기
  rationale: 이 절은 배상과 제사 범주가 겹쳐 있으므로, 한국어에서도 전통적 제사 용어를 유지하되 동일어 반복으로 법적·제의적 연결을 보존했습니다.
  doctrine_reference: Leviticus sacrificial terminology; POB glossary on אָשָׁם
