  source_fidelity: 원문은 속건제물을 가져오되, 그것이 양 떼에서 나온 흠 없는 숫양임을 동격으로 설명합니다. 초안은 이를 두 번의 독립된 ‘가져와야 합니다’로 풀어 원문의 단일 행위를 반복했습니다. 또한 בְּעֶרְכְּךָ는 단순한 물건의 ‘값’보다 제사장이 정한 평가액을 뜻합니다.
  naturalness: ‘당신의 값에 따라’는 현대 한국어에서 부자연스럽고 의미가 불명확합니다. ‘당신이 정한 값에 따라’가 자연스럽고 법적·제의적 평가의 의미를 보존합니다. 각주 표지도 해당 낱말 뒤에 배치하는 것이 명확합니다.
  terminology: אָשָׁם은 두 곳 모두 제사의 범주를 가리키므로 ‘속건제물’로 일관되게 옮긴 것은 적절합니다. יְהוָה는 프로젝트 방침 및 감사 기록에 따라 ‘야훼’로 유지합니다. תָּמִים은 ‘흠 없는’이 자연스럽고 정확합니다.
