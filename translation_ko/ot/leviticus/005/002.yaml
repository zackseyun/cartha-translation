id: LEV.5.2
reference: Leviticus 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
  footnotes:
  - marker: a
    text: Or, 'he is unaware of it'; literally, 'it is hidden from him.'
    reason: lexical_alternative
  - marker: b
    text: That is, he incurs guilt for the impurity once the matter applies to him, not that touching a carcass is itself necessarily a moral evil in the same sense as intentional sin.
    reason: cultural_note
translation:
  language: ko
  text: 또 어떤 사람이 어떤 부정한 것에 닿거나—부정한 들짐승의 사체이거나, 부정한 가축의 사체이거나, 부정한 기는 짐승의 사체이거나—그것을 알지 못한 채 지나가서 그가 부정하게 되고 죄책을 지게 되면[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 즉, 사체를 만진 행위가 그 자체로 곧바로 도덕적 악이라는 뜻이 아니라, 부정이 그에게 적용된 뒤 그 책임을 지게 된다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 어떤 사람
  - 한 사람
  - 영혼
  lexicon: HALOT
  rationale: 법률 문맥에서 נֶפֶשׁ는 개체로서의 사람을 가리키므로, 현대 한국어에서는 ‘사람’이 가장 자연스럽고 본문의 적용 범위를 잘 살립니다.
- source_word: תִּגַּע בְּ
  english_pob_choice: touches
  chosen_korean: 닿거나
  alternatives_korean:
  - 접촉하거나
  - 만지거나
  lexicon: HALOT
  rationale: נגע + ב는 실제 접촉을 뜻하므로, 법 조항의 직접성을 유지하면서도 ‘닿다’가 가장 간결하게 물리적 접촉을 표현합니다.
- source_word: נִבְלַת
  english_pob_choice: the carcass of
  chosen_korean: 사체
  alternatives_korean:
  - 시체
  - 죽은 몸
  - 주검
  lexicon: HALOT
  rationale: 레위기 정결 규정의 נְבֵלָה는 동물의 죽은 몸을 가리키는 법률용어이므로, ‘사체’가 가장 중립적이고 정확합니다.
- source_word: חַיָּה / בְּהֵמָה / שֶׁרֶץ
  english_pob_choice: unclean wild animal / unclean livestock / unclean swarming creature
  chosen_korean: 들짐승 / 가축 / 기는 짐승
  alternatives_korean:
  - 야생 동물 / 집짐승 / 기어다니는 것
  - 들짐승 / 가축 / 땅에 기는 것
  lexicon: HALOT
  rationale: 히브리어의 세 범주는 야생짐승, 가축, 작은 기는 생물을 구별하므로, 전통적이면서도 구분이 분명한 ‘들짐승 / 가축 / 기는 짐승’으로 옮겼습니다.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  english_pob_choice: it is hidden from him
  chosen_korean: 그것을 알지 못한 채 지나가서
  alternatives_korean:
  - 그에게서 숨겨져
  - 그가 그것을 알아채지 못하여
  - 그것이 그에게서 감추어져
  lexicon: HALOT
  rationale: 문자적으로는 ‘그에게서 숨겨졌다’이지만, 한국어에서는 결과적으로 인지하지 못한 상태를 드러내는 표현이 자연스럽기 때문에, 그 의미를 살려 옮겼습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: and becomes guilty
  chosen_korean: 죄책을 지게 되면
  alternatives_korean:
  - 죄가 있게 되면
  - 유죄가 되면
  - 죄책을 지면
  lexicon: HALOT
  rationale: אָשֵׁם은 단순한 도덕적 악보다 책임/책무의 발생을 뜻하므로, ‘죄책을 지다’로 옮겨 정결 규정에서의 법적 책임감을 살렸습니다.
theological_decisions:
- issue: 정결 부정과 도덕적 죄의 구분
  chosen_reading: ‘부정한’과 ‘죄책을 지게 되면’을 구분하여, 사체 접촉 자체가 곧바로 도덕적 악이라는 인상을 피했습니다.
  alternative_readings:
  - ‘더럽혀지면’으로 통일
  - ‘죄를 짓게 되면’으로 의역
  rationale: 본문은 의식적/정결상의 부정과 그에 따른 책임을 말하므로, ‘부정한’과 ‘죄책’의 구분을 유지하는 것이 स्रोत의 신학적 긴장을 보존합니다.
  doctrine_reference: 레위기 정결법의 문맥 구분
- issue: 반복 어휘의 한국어 자연성
  chosen_reading: 히브리어의 반복 구조를 유지하되, 문장 안에서는 한국어 법률문체에 맞게 매끈하게 연결했습니다.
  alternative_readings:
  - 모든 접속을 직역
  - 더 강한 문학적 재배열
  rationale: 원문의 조항식 나열을 보존하면서도 현대 한국어 합쇼체로 읽히도록 정돈하는 것이 본문의 공적·법적 성격을 가장 잘 전달합니다.
  doctrine_reference: 번역 철학 §1, §3
