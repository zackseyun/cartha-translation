id: LEV.5.4
reference: Leviticus 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
  footnotes:
  - marker: a
    text: Hebrew 'whatever a man may utter in an oath'; 'man' here is a representative singular for any person.
    reason: lexical_alternative
  - marker: b
    text: Or 'utters with his lips'; the Hebrew expression can emphasize verbal utterance itself, though the context suggests a rash or thoughtless oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 사람이 입술로 경솔하게 맹세하여 악하게 하거나 선하게 하려고—곧 사람이 맹세로 입밖에 낼 수 있는 어떤 것이든—그것이 그에게서 가려져 있다가, 그가 나중에 그것을 알게 되어 이런 일들 가운데 하나에 대하여 죄를 짓게 되면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '사람이 맹세로 말할 수 있는 어떤 것'이라는 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 영혼
  - 인간
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ는 비물질적 영혼보다 한 사람/개인을 가리키므로, 자연스러운 현대 한국어로 '사람'이 가장 적절합니다.
- source_word: תִשָּׁבַע
  english_pob_choice: swears
  chosen_korean: 맹세하여
  alternatives_korean:
  - 맹세합니다
  - 맹세할 때
  lexicon: HALOT
  rationale: 동사의 행위를 간결하게 살리되, 뒤따르는 '맹세' 명사와 결합되는 법률 문맥을 유지하기 위해 '맹세하여'로 옮겼습니다.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  english_pob_choice: rashly with his lips
  chosen_korean: 입술로 경솔하게
  alternatives_korean:
  - 입술로 분별 없이
  - 입술로 함부로
  lexicon: HALOT
  rationale: '''입술로''라는 신체 표현을 살리면서, 문맥상 부주의하고 성급한 맹세의 뉘앙스를 ''경솔하게''로 전달했습니다.'
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  english_pob_choice: whatever a man may utter in an oath
  chosen_korean: 곧 사람이 맹세로 입밖에 낼 수 있는 어떤 것이든
  alternatives_korean:
  - 곧 사람이 맹세 가운데 말할 수 있는 어떤 것이든
  - 곧 사람이 맹세로 발화할 수 있는 어떤 것이든
  lexicon: HALOT
  rationale: 대표적 단수인 הָאָדָם을 한국어 '사람'으로 옮기고, '입밖에 내다'로 발화 행위 자체를 드러내어 본문이 넓게 적용되는 범위를 살렸습니다.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  english_pob_choice: it is hidden from him
  chosen_korean: 그것이 그에게서 가려져 있다가
  alternatives_korean:
  - 그가 그것을 알지 못하다가
  - 그의 눈에 띄지 않다가
  lexicon: HALOT
  rationale: 수동형의 느낌을 살려, 당사자가 그 사실을 인지하지 못한 상태를 '가려져 있다가'로 표현했습니다.
- source_word: וְהוּא יָדַע
  english_pob_choice: then he comes to know it
  chosen_korean: 그가 나중에 그것을 알게 되어
  alternatives_korean:
  - 그가 그것을 알게 되고
  - 그가 그것을 깨닫게 되어
  lexicon: HALOT
  rationale: 이 동사는 이전의 무지 이후에 생긴 인식을 가리키므로, 시간의 경과를 분명히 하는 '나중에 … 알게 되어'로 옮겼습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: becomes guilty
  chosen_korean: 죄를 짓게 되면
  alternatives_korean:
  - 유죄가 되면
  - 죄책을 지게 되면
  lexicon: HALOT
  rationale: 의미상 책임/유죄 상태를 가리키지만, 문맥상 결과를 자연스럽게 드러내기 위해 '죄를 짓게 되면'으로 옮겼습니다.
theological_decisions:
- issue: 대표적 단수 표현 הָאָדָם의 한국어 처리
  chosen_reading: '''사람''으로 옮기되, 본문의 적용 범위가 특정 성별에 제한되지 않음을 문맥으로 유지했습니다.'
  alternative_readings:
  - '''한 남자'''
  - '''어떤 사람'''
  rationale: 히브리어의 대표적 단수는 법조문에서 일반성을 띠므로, 현대 한국어에서는 성중립적 '사람'이 가장 자연스럽습니다. 다만 본문이 말하는 행위 주체의 일반성을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; 대표적 단수 처리 원칙
