revisions:
- from: 또 사람이 입술로 경솔하게 맹세하여 악하게 하거나 선하게 하려고—곧 사람이 맹세로 입밖에 낼 수 있는 어떤 것이든—그것이 그에게서 가려져 있다가, 그가 나중에 그것을 알게 되어 이런 일들 가운데 하나에 대하여 죄를 짓게 되면[a]
  to: 또 어떤 사람이 입술로 함부로 맹세하여 악을 행하거나 선을 행하겠다고 하고—사람이 맹세하면서 입으로 내뱉는 모든 것에 관하여—그 일이 그에게 숨겨져 있다가, 뒤에 그가 그것을 알게 되어 이들 가운데 하나에 대하여 죄책을 지게 되면,
  rationale: 법조문의 조건문 구조와 ‘악 또는 선’이라는 넓은 대조를 유지하되, 경솔한 언표를 자연스러운 현대 한국어로 다듬었습니다. ‘숨겨져 있다가’는 וְנֶעְלַם의 수동성을, ‘뒤에 알게 되어’는 뒤늦은 인식을, ‘죄책을 지게 되면’은 וְאָשֵׁם의 법적 책임을 반영합니다. 기존 각주는 본문과 중복되어 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:39Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 법적 조건과 시간 순서는 대체로 보존되어 있습니다. 그러나 וְאָשֵׁם은 새로 죄를 ‘짓는’ 행위라기보다 그 일에 관하여 죄책/책임이 있게 되는 상태를 뜻하므로, ‘죄를 짓게 되면’은 부정확합니다. 또한 לְכֹל אֲשֶׁר의 포괄성은 ‘어떤 것이든’보다 ‘모든 것’으로 드러내는 편이 가깝습니다.
  naturalness: 초안의 ‘악하게 하거나 선하게 하려고’와 ‘맹세로 입밖에 낼 수 있는 어떤 것이든’은 현대 한국어 법률적 서술로 다소 어색합니다. ‘악을 행하거나 선을 행하겠다고’ 및 ‘맹세하면서 입으로 내뱉는 모든 것’이 자연스럽습니다. 수동적 미인지를 ‘그 일이 그에게 숨겨져 있다가’로 유지했습니다.
  terminology: נֶפֶשׁ의 ‘어떤 사람’, הָאָדָם의 일반적 ‘사람’, 그리고 לְבַטֵּא בִשְׂפָתַיִם의 발화·경솔함은 각각 ‘어떤 사람’, ‘사람’, ‘입술로 함부로’로 적절히 반영했습니다. אָשֵׁם은 ‘죄책을 지다’로 옮겨 법적 책임의 의미를 보존했습니다.
  issues:
  - severity: medium
    issue: וְאָשֵׁם을 ‘죄를 짓게 되면’으로 번역함
    rationale: 히브리어는 앞서 진술한 경우에 관하여 죄책 또는 법적 책임이 있게 됨을 말합니다. ‘죄를 짓다’는 별도의 죄 행위를 저지르는 뜻으로 읽힐 수 있습니다.
  - severity: low
    issue: 포괄 표현과 문장 연결의 어색함
    rationale: לְכֹל אֲשֶׁר는 ‘모든 것’의 범위를 나타내며, 초안의 삽입구는 한국어에서 다소 부자연스럽습니다.
  - severity: low
    issue: 각주가 본문 의미를 실질적으로 보충하지 못함
    rationale: 각주는 본문에 이미 번역된 표현을 반복할 뿐이며, 원문의 모호성이나 번역 선택을 설명하지 않습니다. 삭제하는 것이 낫습니다.
  revised_text: 또 어떤 사람이 입술로 함부로 맹세하여 악을 행하거나 선을 행하겠다고 하고—사람이 맹세하면서 입으로 내뱉는 모든 것에 관하여—그 일이 그에게 숨겨져 있다가, 뒤에 그가 그것을 알게 되어 이들 가운데 하나에 대하여 죄책을 지게 되면,
