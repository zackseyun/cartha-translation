id: LEV.5.9
reference: Leviticus 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
  footnotes:
  - marker: a
    text: Or 'purification offering' in both occurrences of 'sin offering.' The Hebrew term חַטָּאת can denote the offering for sin with emphasis on its purifying function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 속죄제의 피 일부를 제단의 옆면에 뿌려야 하고, 남은 피는 제단 밑바닥에 쏟아내야 합니다. 그것은 속죄제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물’. 히브리어 חַטָּאת은 ‘죄’에 대한 제물인 동시에 정결 기능을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה / מִדַּם
  english_pob_choice: he shall sprinkle some of the blood
  chosen_korean: 피 일부를 … 뿌려야 하고
  alternatives_korean:
  - 피를 … 뿌려야 하고
  - 피를 … 뿌리며
  lexicon: HALOT
  rationale: נזה는 제의 문맥에서 피를 제의적으로 ‘뿌리다’로 옮기는 것이 자연스럽고, מִן의 부분적 의미는 ‘일부를’로 드러내는 것이 가장 분명합니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제물
  - 정결제물
  lexicon: HALOT
  rationale: 레위기 제의 문맥에서는 제물을 가리키므로, 한국어 제의 용어인 ‘속죄제’를 사용하되, POB의 ‘sin offering’과 대응되도록 했습니다.
- source_word: קִיר הַמִּזְבֵּחַ
  english_pob_choice: the side of the altar
  chosen_korean: 제단의 옆면
  alternatives_korean:
  - 제단의 벽
  - 제단의 측면
  lexicon: HALOT
  rationale: קִיר의 문자적 ‘벽’보다 제단에 대한 자연스러운 한국어는 ‘옆면/측면’이며, 실제 피를 바르는 면을 잘 드러냅니다.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  english_pob_choice: the rest of the blood
  chosen_korean: 남은 피
  alternatives_korean:
  - 피의 나머지
  - 피로 남은 것
  lexicon: HALOT
  rationale: 분사적 표현의 명사화 의미를 살리면서도 한국어로는 간결하게 ‘남은 피’가 가장 자연스럽고, 제의 절차의 잔여분을 분명히 보여 줍니다.
- source_word: יִמָּצֵה
  english_pob_choice: shall be drained out
  chosen_korean: 쏟아내야 합니다
  alternatives_korean:
  - 짜내야 합니다
  - 배출해야 합니다
  lexicon: HALOT
  rationale: 이 동사는 남은 피를 제단 밑으로 처리하는 제의적 동작을 가리키므로, ‘쏟아내다’가 가장 자연스럽고 절차적 의미를 잘 전달합니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제물
  rationale: 이 절에서는 제물의 범주를 식별하는 문맥이 강하므로, 한국어 독자에게 익숙하면서도 제의 절차를 분명히 하는 ‘속죄제’를 본문에 두었습니다. 다만 히브리어는 정결 기능을 함께 띨 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
