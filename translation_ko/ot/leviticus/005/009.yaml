review_pass:
  verdict: revise
  source_fidelity: 히브리어의 제의 동작과 순서는 대체로 충실합니다. מִדַּם의 부분성은 ‘피 일부’로, קִיר의 물리적 면은 ‘제단의 옆면’으로 적절히 드러냈습니다. 다만 אֶל־יְסוֹד הַמִּזְבֵּחַ는 제단의 ‘밑바닥’(제단 자체의 바닥면)이 아니라 제단의 밑/기초 부분을 가리키므로, ‘제단 밑에’가 정확하고 자연스럽습니다. יִמָּצֶה의 짜내어 배출하는 뉘앙스는 ‘쏟아내다’로 충분히 전달될 수 있습니다.
  naturalness: 현대 표준어 합쇼체 문장으로 전반적으로 자연스럽습니다. 그러나 ‘제단 밑바닥에’는 한국어에서 제단의 아래쪽 표면 또는 바닥 자체처럼 들려 위치 표현으로 부정확하고 다소 어색합니다. ‘제단 밑에’로 고치면 자연스럽습니다.
  terminology: ‘속죄제’는 חַטָּאת에 대한 확립된 한국어 성경 용어이며, 본문의 두 용례에서 일관되게 사용된 점이 좋습니다. ‘정결제물’이라는 대안은 교파적 해석을 강요하지 않고 어휘적·기능적 뉘앙스를 알립니다. 다만 각주가 이 절의 두 용례 모두에 적용됨을 명시하는 편이 앵커 범위를 분명히 합니다.
  issues:
  - severity: medium
    issue: ‘제단 밑바닥에’
    rationale: יְסוֹד는 제단의 기초·밑부분을 뜻합니다. ‘밑바닥’은 제단의 바닥면이라는 다른 공간적 의미를 유발할 수 있으므로 ‘제단 밑에’로 수정해야 합니다.
  - severity: low
    issue: 각주의 적용 범위가 명시되지 않음
    rationale: 본문에는 ‘속죄제’가 두 번 나오지만 각주 표지는 문장 끝에 한 번만 있습니다. 각주에서 이 절의 두 용례에 대한 대안임을 밝혀 독자가 범위를 정확히 알도록 하는 것이 좋습니다.
  revised_text: 그는 그 속죄제의 피 일부를 제단의 옆면에 뿌려야 하고, 남은 피는 제단 밑에 쏟아내야 합니다. 그것은 속죄제입니다.[a]
