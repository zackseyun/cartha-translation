- from: 그는 그 속죄제의 피 일부를 제단의 옆면에 뿌려야 하고, 남은 피는 제단 밑바닥에 쏟아내야 합니다. 그것은 속죄제입니다.[a]
  to: 그는 그 속죄제의 피 일부를 제단의 옆면에 뿌려야 하고, 남은 피는 제단 밑에 쏟아내야 합니다. 그것은 속죄제입니다.[a]
