  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
  footnotes:
  - marker: a
    text: Or 'he hears the voice of an oath,' that is, a solemn sworn adjuration calling for testimony.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall bear his iniquity.' The Hebrew idiom means he remains liable for the guilt of withholding testimony.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 증인으로서 어떤 일을 보았거나 알고 있으면서, 증언을 요구하는 엄숙한 맹세의 선포를 듣고도 그것을 알리지 않으면, 그는 죄를 지어 자신의 죄책을 져야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘맹세의 소리’입니다. 이는 증언을 요구하는 엄숙한 맹세 또는 선서적 요구를 가리킬 수 있습니다. ‘자신의 죄책을 져야 합니다’는 그의 잘못과 그에 따른 책임을 진다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
