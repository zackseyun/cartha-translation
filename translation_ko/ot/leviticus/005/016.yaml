  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
  footnotes:
  - marker: a
    text: Or, 'for what he wrongfully withheld from the holy thing.' The Hebrew refers to restitution for an offense involving something holy or sacred.
    reason: lexical_alternative
  - marker: b
    text: Or, 'with the ram for a guilt offering'; alternatively, 'for a reparation offering.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 성물[a]에 대하여 범한 잘못을 배상하고, 그 배상액에 오분의 일을 더하여 제사장에게 주어야 합니다. 그러면 제사장은 속건제 숫양[b]으로 그를 위하여 속죄하고, 그는 용서를 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성물에서 부당하게 취한 것에 대하여.’ 히브리어는 거룩하거나 성스러운 것과 관련된 침해에 대한 배상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속건제를 위한 숫양으로’; 달리 ‘배상제의 숫양으로.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵת אֲשֶׁר חָטָא מִן הַקֹּדֶשׁ
  english_pob_choice: for what he sinned against from the holy thing
  chosen_korean: 거룩한 것에 대해 죄를 지은 것에 대한 보상
  alternatives_korean:
  - 거룩한 것에서 범한 죄에 대한 보상
  - 거룩한 것에서 부당하게 취한 것에 대한 보상
  lexicon: HALOT
  rationale: 문맥상 성물과 관련된 침해에 대한 배상 의무를 뜻하므로, 한국어에서는 법적·제의적 의미가 드러나도록 ‘보상’으로 옮기고 대상을 ‘거룩한 것’으로 유지했습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: make restitution
  chosen_korean: 보상을 해야 합니다
  alternatives_korean:
  - 배상해야 합니다
  - 갚아야 합니다
  lexicon: HALOT
  rationale: 이 동사는 단순 지불이 아니라 손해 회복과 배상을 뜻하므로, 법적 의미가 분명한 ‘보상’을 선택했습니다.
- source_word: חֲמִישִׁתוֹ
  english_pob_choice: a fifth of it
  chosen_korean: 그 다섯째 몫
  alternatives_korean:
  - 오분의 일
  - 한 몫의 다섯째 부분
  lexicon: HALOT
  rationale: 히브리어의 ‘다섯째 몫’을 자연스러운 한국어 법률 문맥으로 풀어, 계산된 추가분이라는 뜻을 살렸습니다.
- source_word: בְּאֵיל הָאָשָׁם
  english_pob_choice: with the ram of the guilt offering
  chosen_korean: 속건제의 숫양
  alternatives_korean:
  - 속건제의 숫양과 함께
  - 속건제 숫양
  lexicon: HALOT
  rationale: אָשָׁם은 이 제의 문맥에서 관용적인 제사 명칭이므로, POB의 일관성을 따라 ‘속건제’로 옮겼습니다.
theological_decisions:
- issue: אָשָׁם의 제사 명칭 표기
  chosen_reading: 속건제
  alternative_readings:
  - 속죄제
  - 배상제
  rationale: 본절은 성물에 대한 침해를 배상한 뒤 제사장이 속죄하는 구조이므로, אָשָׁם은 전통적이며 문맥에 맞는 ‘속건제’로 두는 것이 가장 분명합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
