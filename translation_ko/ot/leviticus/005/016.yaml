  source_fidelity: 히브리어는 성물(הַקֹּדֶשׁ)과 관련하여 범한 잘못에 대한 배상, 원금에 오분의 일을 더한 지급, 속건제 숫양을 통한 제사장의 속죄, 그리고 용서를 순서대로 진술합니다. 초안의 ‘거룩한 것에 대해 죄를 지은 것에 대한 보상’은 중첩되고 한국어 문장으로 부자연스러우며, ‘그 다섯째 몫을 더하여’는 오분의 일이라는 법정 비율을 명료하게 전달하지 못합니다.
  naturalness: ‘성물’, ‘배상액’, ‘오분의 일’, ‘속건제 숫양’, ‘그를 위하여 속죄하고’는 현대 표준어 합쇼체에서 자연스럽고 제의·법률 문맥에도 적절합니다. 각주 표지는 해당 표현 바로 뒤에 배치하는 편이 독자의 이해와 표지 연결에 적합합니다.
  terminology: הַקֹּדֶשׁ는 ‘성물’로, יְשַׁלֵּם은 법적 의미를 살려 ‘배상하다’로, חֲמִישִׁתוֹ는 ‘오분의 일’로, אָשָׁם은 일관된 제사 명칭인 ‘속건제’로 옮깁니다. ‘속죄하다’와 ‘용서를 받다’는 כפר 및 נסלח의 관계를 무리 없이 반영합니다.
