revisions:
- from: 그가 거룩한 것에 대해 죄를 지은 것에 대한 보상을 해야 합니다. 그는 그것에 그 다섯째 몫을 더하여 제사장에게 주어야 합니다. 그러면 제사장은 속건제의 숫양으로 그를 위해 속죄하고, 그는 용서받을 것입니다.[a][b]
  to: 그는 성물[a]에 대하여 범한 잘못을 배상하고, 그 배상액에 오분의 일을 더하여 제사장에게 주어야 합니다. 그러면 제사장은 속건제 숫양[b]으로 그를 위하여 속죄하고, 그는 용서를 받을 것입니다.
  rationale: 수정문은 성물 관련 위반이라는 원문의 표현 범위를 유지하면서, 한국어에서 자연스러운 ‘범한 잘못을 배상하다’로 법적·제의적 의미를 드러냅니다. ‘그 배상액에 오분의 일을 더하여’는 원금에 추가되는 오분의 일을 명확히 하되, 원문이 명시하지 않는 세부 산정 방식은 덧붙이지 않습니다. 각주도 본문의 해당 어구에 직접 연결했습니다.
