base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
  footnotes:
  - marker: a
    text: Or, more literally, 'for one of all that he may do to incur guilt by it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 야훼 앞에서 그를 위해 속죄하면, 그는 자기가 저지른 모든 것 가운데 어느 하나로 말미암아 생긴 죄책에서 용서받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘그가 그것으로 죄책을 지게 되도록 행할 수 있는 모든 것 가운데 하나를 위하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  english_pob_choice: shall make atonement
  chosen_korean: 속죄하면
  alternatives_korean:
  - 속죄할 것입니다
  - 속죄를 행하면
  lexicon: HALOT
  rationale: 제사장의 제의적 행위를 분명히 드러내면서, 속죄의 결과와 기능을 자연스럽게 한국어로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: for him
  chosen_korean: 그를 위해
  alternatives_korean:
  - 그를 위하여
  - 그에게
  lexicon: HALOT
  rationale: כפר와 함께 쓰일 때 대상자를 가리키므로, 현대 한국어에서는 ‘그를 위해’가 가장 자연스럽고 의미도 분명합니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: and he will be forgiven
  chosen_korean: 그는 … 용서받을 것입니다
  alternatives_korean:
  - 그에게 용서가 주어질 것입니다
  - 그는 용서될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살리되, 한국어에서는 ‘용서받다’가 가장 직접적으로 결과를 전달합니다.
- source_word: עַל אַחַת מִכֹּל אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  english_pob_choice: for any one of all the things by which one may incur guilt
  chosen_korean: 자기가 저지른 모든 것 가운데 어느 하나로 말미암아 생긴 죄책
  alternatives_korean:
  - 자기가 행한 모든 것 가운데 하나로 인해 생긴 죄책
  - 그가 한 모든 일 중 어느 하나로 인한 죄
  lexicon: HALOT
  rationale: 직역만 하면 어색해지므로, ‘어느 하나’와 ‘죄책’으로 분포적 의미와 결과 상태를 함께 드러냈습니다.
