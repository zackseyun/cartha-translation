  text: 제사장은 야훼 앞에서 그를 위하여 속죄할 것이며, 그는 죄책을 지게 되는 모든 행위 가운데 어느 하나에 대하여 용서받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는, ‘그가 그것으로 죄책을 지게 되는 모든 것 가운데 하나에 대하여’입니다.
    reason: lexical_alternative
