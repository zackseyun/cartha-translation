revisions:
- from: 또는 거짓으로 맹세한 그 어떤 것에 대해서든지—그것을 온전히 갚고, 또 그 위에 그 일부분의 다섯째를 더하여야 합니다. 그는 그것이 속한 사람에게 그의 속건제의 날에 그것을 줄 것입니다.[a]
  to: 또는 그가 거짓으로 맹세한 어떤 것이든지, 그는 그것을 원금대로 갚고 거기에 오분의 일을 더하여야 합니다. 그는 그것의 소유자에게 자기 속건제의 날에 그것을 주어야 합니다.[a]
  rationale: ‘오분의 일’로 법정 비율을 정확히 밝혔고, 원금 배상과 추가 배상의 관계를 자연스러운 한국어로 정리했습니다. 소유 귀속 표현을 법률 문맥에 맞게 다듬었으며, אַשְׁמָתוֹ의 해석상 모호성은 본문의 제의적 번역과 각주의 대안 독법으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:34Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 법률적 구조와 배상 규정은 대체로 반영되었으나, ‘그 일부분의 다섯째’는 חֲמִשִׁיתָיו(그것의 오분의 일)를 부정확하고 부자연스럽게 옮긴 표현입니다. 또한 ‘또는 거짓으로 맹세한 그 어떤 것에 대해서든지’는 맹세의 대상 관계가 다소 불분명합니다.
  naturalness: 현대 표준어 합쇼체로 ‘그 위에 그 일부분의 다섯째’와 ‘그것이 속한 사람’은 어색합니다. ‘거기에 오분의 일을 더하고’, ‘그것의 소유자에게’가 자연스럽고 법률 문맥에도 적절합니다.
  terminology: בְּרֹאשׁוֹ는 ‘원금대로’로, חֲמִשִׁיתָיו는 ‘오분의 일’로 옮기는 것이 배상 용어를 명확히 합니다. אַשְׁמָתוֹ는 문맥상 ‘속건제’로 본문에 두되, ‘죄책’이라는 가능한 대안을 각주로 유지하는 것이 적절합니다.
