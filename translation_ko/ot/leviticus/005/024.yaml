id: LEV.5.24
reference: Leviticus 5:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
  footnotes:
  - marker: a
    text: Or, 'on the day of his guilt.' The Hebrew term can refer either to guilt itself or to the guilt offering; here the main text follows the sacrificial context.
    reason: alternative_reading
translation:
  language: ko
  text: 또는 거짓으로 맹세한 그 어떤 것에 대해서든지—그것을 온전히 갚고, 또 그 위에 그 일부분의 다섯째를 더하여야 합니다. 그는 그것이 속한 사람에게 그의 속건제의 날에 그것을 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 속건의 날에’. 히브리어 용어는 죄책 자체를 가리키기도 하고 속건제물을 가리키기도 합니다. 여기서는 제의적 문맥을 따라 본문을 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ / מִכֹּל אֲשֶׁר
  english_pob_choice: or anything about which
  chosen_korean: 또는 거짓으로 맹세한 그 어떤 것에 대해서든지
  alternatives_korean:
  - 또는 그가 거짓으로 맹세한 모든 것에 대하여
  - 또는 그가 거짓 맹세한 어떤 일에 관하여
  lexicon: HALOT
  rationale: 법률 문맥의 포괄적 범위를 살리면서, 'anything about which'의 의미를 한국어 자연문으로 풀어 옮겼습니다.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  english_pob_choice: he swore falsely
  chosen_korean: 거짓으로 맹세한
  alternatives_korean:
  - 그것에 대하여 거짓 맹세한
  - 거짓 맹세를 한
  lexicon: HALOT
  rationale: 행위의 핵심은 ‘거짓 맹세’이므로, 대상어를 앞에 두고 분사형으로 처리해 법적 진술의 간결함을 유지했습니다.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  english_pob_choice: he shall repay it in full
  chosen_korean: 그것을 온전히 갚고
  alternatives_korean:
  - 그것을 원금대로 갚고
  - 그것을 완전히 배상하고
  lexicon: HALOT
  rationale: בְּרֹאשׁוֹ는 원금, 곧 본액을 가리키는 관용구이므로 ‘온전히’로 본액 배상의 뜻을 자연스럽게 살렸습니다.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  english_pob_choice: and shall add a fifth to it
  chosen_korean: 그 위에 그 일부분의 다섯째를 더하여야 합니다
  alternatives_korean:
  - 그 위에 오분의 일을 더하여야 합니다
  - 그 위에 한 다섯째를 더하여야 합니다
  lexicon: HALOT
  rationale: 히브리어의 비율 표현을 그대로 살리되, 현대 한국어에서 덜 어색한 방식으로 ‘다섯째’의 비율 추가를 드러냈습니다.
- source_word: לַאֲשֶׁר הוּא לוֹ / יִתְּנֶנּוּ
  english_pob_choice: to the one to whom it belongs / He shall give it
  chosen_korean: 그것이 속한 사람에게 … 그것을 줄 것입니다
  alternatives_korean:
  - 그 소유자에게 … 그것을 줄 것입니다
  - 그에게 속한 사람에게 … 그것을 줄 것입니다
  lexicon: HALOT
  rationale: 'ידד? no: 소유 관계를 드러내는 관용구를 ‘속한 사람’으로 옮겨 법적 귀속을 분명히 했습니다.'
theological_decisions:
- issue: 'אַשְׁמָתוֹ의 의미: ''guilt'' vs ''guilt offering'''
  chosen_reading: 그의 속건제의 날
  alternative_readings:
  - 그의 죄책의 날
  - 그의 속건물의 날
  rationale: 본문의 제의적 문맥에서 אַשְׁמָה/אָשָׁם은 단순한 내적 죄책보다 속건제와 연결되는 제물을 가리킬 수 있으므로, 제의적 연계를 살려 ‘속건제’로 옮겼습니다.
  doctrine_reference: 레위기 5장 제의 문맥; translation philosophy §3, §6
- issue: ‘on the day of his guilt offering’의 시간 부사 처리
  chosen_reading: 속건제를 드리는 때에 해당하는 날로 이해되는 구절을 한국어에서 자연스럽게 압축
  alternative_readings:
  - 그의 죄의 날에
  - 속건제의 날에
  rationale: 영어 주석의 대안 독법을 반영하되, 본문은 법정-제의 절차상의 시점을 뜻하므로 한국어에서는 ‘속건제의 날’로 간결하게 제시했습니다.
  doctrine_reference: translation philosophy §1, §3
