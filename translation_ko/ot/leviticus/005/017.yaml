id: LEV.5.17
reference: Leviticus 5:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
  footnotes:
  - marker: a
    text: Or 'is guilty' / 'incurs guilt'; the Hebrew term can denote becoming liable for guilt as a result of the offense.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall bear his guilt.' The Hebrew idiom 'bear his iniquity' can refer to carrying the liability or consequence of wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 죄를 지어 야훼께서 하지 말라고 명하신 모든 일 가운데 하나를 행하였으나, 그것을 알지 못했더라도 그는 죄책이 있으며[a] 자기 죄악을 져야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유죄이다’ 또는 ‘죄책을 지게 된다’. 히브리어는 그 행위로 말미암아 죄책이나 법적 책임이 있게 되는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 죄책을 져야 한다’. 히브리어 관용구 ‘죄악을 지다’는 잘못에 따른 책임이나 결과를 짊어지는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: a person
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 혼
  - 영혼
  lexicon: HALOT
  rationale: 제사장법 문맥에서 נֶפֶשׁ은 개별 인간을 가리키므로, 영혼보다 ‘사람’이 의미를 가장 자연스럽고 정확하게 전달합니다.
- source_word: מִצְוֺת יְהוָה
  english_pob_choice: the LORD’s commandments
  chosen_korean: 야훼의 모든 계명
  alternatives_korean:
  - 야훼의 계명
  - 주님의 계명
  - 여호와의 계명
  lexicon: HALOT
  rationale: 언약적 법문맥의 מִצְוֺת는 ‘계명’이 적절하며, יְהוָה는 본 지침에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְנָשָׂא עֲוֺנֽוֹ
  english_pob_choice: shall bear his iniquity
  chosen_korean: 자기의 죄책을 져야 합니다
  alternatives_korean:
  - 자기의 죄를 져야 합니다
  - 자기의 죄악을 져야 합니다
  - 자기의 죄책을 지게 됩니다
  lexicon: HALOT
  rationale: נָשָׂא עָוֹן은 단순한 감정적 ‘책임’보다 법적·언약적 ‘죄책/책임을 짊어짐’의 뉘앙스가 강해, 문맥상 ‘죄책을 지다’로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 YHWH가 직접 나오므로, 본 프로젝트 기준에 따라 언약명을 ‘야훼’로 드러내어 본문의 신학적 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 알지 못했더라도의 책임성
  chosen_reading: 그는 유죄가 되며 자기의 죄책을 져야 합니다
  alternative_readings:
  - 그는 죄를 지은 것이 됩니다
  - 그는 책임을 져야 합니다
  rationale: 본문은 무지 자체를 면책 사유로 삼지 않고, 행위로 인해 발생한 법적 책임을 말하므로 ‘유죄’와 ‘죄책을 지다’로 그 긴장을 유지했습니다.
  doctrine_reference: Leviticus legal guilt / liability frame
