language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
  footnotes:
  - marker: a
    text: Or 'bring out' or 'take out' the ashes.
    reason: lexical_alternative
  - marker: b
    text: '''Clean'' here refers to ritual cleanness in the Levitical sense.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 자기 옷을 벗고 다른 옷을 입은 뒤, 재를 진영 밖의 깨끗한 곳으로 가져가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘깨끗한’은 레위기적 의미의 제의적 정결을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘재를 가져가다’는 ‘재를 밖으로 내다’ 또는 ‘재를 옮기다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָשַׁט
  english_pob_choice: Then he shall take off
  chosen_korean: 옷을 벗고
  alternatives_korean:
  - 옷을 벗겨 내고
  - 벗어 버리고
  lexicon: HALOT
  rationale: 의복을 벗는 동작을 자연스럽고 직접적으로 나타내며, 절차적 순서를 앞뒤 문맥으로 충분히 살릴 수 있습니다.
- source_word: בְּגָדָיו / בְּגָדִים אֲחֵרִים
  english_pob_choice: his garments / other garments
  chosen_korean: 자기 옷 / 다른 옷
  alternatives_korean:
  - 그의 의복 / 다른 의복
  - 옷가지 / 다른 옷가지
  lexicon: HALOT
  rationale: 제의 문맥이지만 한국어에서는 ‘옷’이 가장 자연스럽고, 반복되는 대조(입고 있는 옷 vs. 다른 옷)를 분명하게 드러냅니다.
- source_word: וְהוֹצִיא אֶת הַדֶּשֶׁן
  english_pob_choice: and carry the ashes
  chosen_korean: 재를 … 가져가야 합니다
  alternatives_korean:
  - 재를 … 밖으로 내가야 합니다
  - 재를 … 옮겨야 합니다
  lexicon: HALOT
  rationale: הוֹצִיא는 ‘밖으로 내다/가져가다’의 뜻이므로, 제의 잔여물을 실제로 이동시키는 행위를 한국어로 가장 분명하게 표현했습니다.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה אֶל מָקוֹם טָהוֹר
  english_pob_choice: outside the camp ... to a clean place
  chosen_korean: 진영 밖의 깨끗한 곳
  alternatives_korean:
  - 진영 밖의 정결한 곳
  - 진영 바깥의 깨끗한 곳
  lexicon: HALOT
  rationale: ‘진영 밖’은 위치를, ‘깨끗한 곳’은 טָהוֹר의 제의적 정결 개념을 과잉설명 없이 살립니다. 한국어 본문에서는 반복을 줄여 한 덩어리로 자연스럽게 처리했습니다.
theological_decisions:
- issue: טָהוֹר의 제의적 정결성
  chosen_reading: ‘깨끗한 곳’으로 번역하되, 레위기의 제의적 맥락이 그 의미를 규정하도록 둡니다.
  alternative_readings:
  - ‘정결한 곳’
  - ‘의식적으로 깨끗한 곳’
  rationale: 본문은 예식 절차를 말하므로, 본문 자체가 전제하는 정결 범주를 유지하면서도 현대 한국어 독자가 읽기 쉬운 표현을 택했습니다.
  doctrine_reference: Translation philosophy §6
