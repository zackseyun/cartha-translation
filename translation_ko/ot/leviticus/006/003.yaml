review_pass:
  verdict: revise
  source_fidelity: ‘베옷’과 ‘베 바지’는 제사장의 베 의복과 하의를 대체로 잘 옮기며, ‘치워 … 제단 곁에 두어야 한다’도 וְהֵרִים 및 אֵצֶל הַמִּזְבֵּחַ를 충실히 반영합니다. 다만 ‘그 몸 위에’는 한국어로 부자연스럽고, ‘제단 위에서 불에 타서 재가 된 번제물의 재’는 원문의 관계절을 중복되고 다소 부정확하게 처리합니다. 재는 번제물이 ‘재가 된 것’이라기보다 제단 위의 불이 번제물을 태운 뒤 남긴 재입니다.
  naturalness: 현행 문장은 한 문장으로도 이해되지만 ‘몸 위에’, ‘재가 된 번제물의 재’가 어색하고 반복적입니다. ‘몸에 베로 만든 속바지를 입고’ 및 ‘불이 번제물을 태우고 남긴 재’로 고치면 현대 표준어 합쇼체의 법규적 문체로 자연스럽습니다.
  terminology: בַד는 ‘베’로, מִכְנְסֵי בַד는 기능을 드러내는 ‘베로 만든 속바지’로 옮겼습니다. עֹלָה는 관례적이고 정확한 ‘번제물’, דֶּשֶׁן은 문맥상 ‘재’, מִזְבֵּחַ는 ‘제단’으로 유지했습니다. ‘베 옷’은 מִדּוֹ의 정확한 재단을 과도하게 특정하지 않는 표현입니다.
  issues:
  - severity: medium
    issue: ‘그 몸 위에’
    rationale: עַל בְּשָׂרוֹ는 직역하면 ‘그의 살 위에’이나, 한국어에서 ‘몸 위에 옷을 입다’는 부자연스럽습니다. ‘몸에’가 자연스럽고 의복을 몸에 직접 입는 의미를 충분히 전달합니다.
  - severity: medium
    issue: ‘불에 타서 재가 된 번제물의 재’
    rationale: 원문은 제단의 불이 번제물을 태운 결과인 재를 가리킵니다. 현행 표현은 ‘번제물의 재’를 반복하고, 번제물 자체가 재가 된다는 방식으로 관계를 불명확하게 만듭니다.
