language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
  footnotes:
  - marker: a
    text: Or, 'Whatever touches them shall be consecrated.' The Hebrew may denote becoming holy through contact; some understand it more restrictively as implying that only what is holy may touch them.
    reason: alternative_reading
translation:
  language: ko
  text: 아론의 아들들 가운데 남자는 모두 그것을[a] 먹을 수 있습니다. 이것은 너희 대대로 영원한 규례입니다. 그것은 야훼의 화제물 가운데서 나온 것입니다. 그것들에 닿는 것은 무엇이든 거룩해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들에 닿는 것은 무엇이든 성별될 것입니다.’ 히브리어는 접촉을 통해 거룩해지는 뜻일 수 있으며, 어떤 해석은 더 좁게는 거룩한 것만이 그것들에 닿을 수 있다는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  english_pob_choice: Every male
  chosen_korean: 모든 남자
  alternatives_korean:
  - 모든 남성
  - 남자마다
  lexicon: HALOT
  rationale: 제사장 자격 문맥에서 성별을 분명히 드러내면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: בִּבְנֵי אַהֲרֹן
  english_pob_choice: among the sons of Aaron
  chosen_korean: 아론의 아들들 가운데
  alternatives_korean:
  - 아론의 아들들 중
  - 아론의 자손들 가운데
  lexicon: HALOT
  rationale: 아론 계열의 제사장 집단을 가리키는 표준적 표현을 유지했습니다.
- source_word: חָק עוֹלָם לְדֹרֹתֵיכֶם
  english_pob_choice: a permanent statute throughout your generations
  chosen_korean: 너희 대대로 영원한 규례
  alternatives_korean:
  - 너희 대대로 항구한 규례
  - 너희 세대마다 영속하는 규례
  lexicon: HALOT
  rationale: 법적 효력을 지닌 지속성을 '규례'와 '대대로'로 살리되, 현대 독자에게 자연스러운 어법으로 다듬었습니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼께 드리는 화제물 가운데서 나온 것
  alternatives_korean:
  - 야훼의 화제물 가운데서 나온 것
  - 야훼께 드리는 제물 가운데서 나온 것
  lexicon: HALOT
  rationale: אִשֵּׁי를 본문 맥락에 맞게 제의적 '화제물'로 살리고, 'from'의 기원을 '가운데서 나온 것'으로 풀어 자연스럽게 표현했습니다.
- source_word: יִקְדָּשׁ
  english_pob_choice: shall become holy
  chosen_korean: 거룩해질 것입니다
  alternatives_korean:
  - 성별될 것입니다
  - 거룩하게 될 것입니다
  lexicon: HALOT
  rationale: 접촉으로 인해 거룩한 상태가 되는 결과를 드러내기 위해 상태 변화형으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 접촉에 따른 거룩함의 전이
  chosen_reading: 닿는 대상은 이미 거룩해야 한다고 좁히지 않고, 거룩한 제물과의 접촉으로 거룩해지는 결과를 그대로 살렸습니다.
  alternative_readings:
  - 오직 거룩한 것만 그들에게 닿을 수 있다는 제한적 의미
  - 접촉한 자가 거룩한 상태와 그에 따른 책임 아래 놓인다는 의미
  rationale: 히브리어의 직설적 결과 표현을 보존해 제의적 거룩함의 역학을 본문이 가진 긴장 그대로 드러내기 위해서입니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
