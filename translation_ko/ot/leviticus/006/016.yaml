  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
  footnotes:
  - marker: a
    text: Or 'shall be wholly burned.' The Hebrew adjective can denote that the offering is entire or complete, with the practical sense here that it is not eaten but wholly given over on the altar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장의 곡식제물은 온전히 불살라야 합니다[a]; 그것을 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히 불살라야 합니다’. 히브리어 형용사는 제물이 온전함/전체임을 가리킬 수 있으며, 여기서는 실제로는 먹지 않고 제단에 온전히 바쳐지는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחַת
  english_pob_choice: grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식헌물
