  lexicon: HALOT
  rationale: כָּלִיל은 ‘전체/온전함’과 더불어 제단 위에서 전부 바쳐지는 뜻을 가지므로, 먹지 않고 전부 불사르는 실제 규정을 드러내는 표현을 택했습니다.
