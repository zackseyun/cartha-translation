  - 그것은 먹어서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어 수동형 금지를 한국어에서는 자연스러운 금지문으로 옮기되, 제의 규정의 금지성을 분명히 하기 위해 직접적인 금지 표현을 사용했습니다.
theological_decisions:
- issue: כָּלִיל의 제의적 의미
  chosen_reading: ‘온전히 불살라야 합니다’로 옮겨, 제사장 몫으로 남겨 두지 않고 전적으로 하나님께 드려지는 제물이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘온전한 제물이어야 합니다’
  - ‘완전히 불살라야 합니다’
  rationale: 본문은 단순한 상태 서술이 아니라 실제 제의 행위를 포함한 금지 규정이므로, ‘불사름’의 실제를 살리는 번역이 문맥에 가장 충실합니다.
  doctrine_reference: 레위기 제사 규례의 제의적 구별성과 제단 헌납 원리
