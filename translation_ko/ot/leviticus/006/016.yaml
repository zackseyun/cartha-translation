  lexicon: HALOT
  rationale: 레위기 제의 문맥의 기술용어로서 מִנְחָה를 단순한 ‘예물’보다 구체적인 곡물/곡식 제사로 드러내기 위해 ‘곡식제물’로 옮겼습니다.
- source_word: כֹהֵן
