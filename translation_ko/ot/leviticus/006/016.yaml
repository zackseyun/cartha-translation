  lexicon: HALOT
  rationale: 히브리어 소유격 연결구를 자연스러운 관형어로 처리해 ‘제사장의 곡식제물’이라는 제의적 소속을 분명히 했습니다.
- source_word: כָּלִיל
  english_pob_choice: shall be wholly burned
  chosen_korean: 온전히 불살라야 합니다
  alternatives_korean:
  - 완전히 불살라야 합니다
  - 전부 불살라야 합니다
  - 온전한 제물이어야 합니다
  lexicon: HALOT
  rationale: כָּלִיל은 ‘전체/온전함’과 더불어 제단 위에서 전부 바쳐지는 뜻을 가지므로, 먹지 않고 전부 불사르는 실제 규정을 드러내는 표현을 택했습니다.
