review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the priestly grain offering, its complete disposition by burning, and the prohibition against eating it. However, it does not explicitly represent the distributive כָּל (“every”). Rendering כָּלִיל as “온전히 불살라야 합니다” is contextually sound in this sacrificial regulation, while the note should distinguish the lexical sense from the contextual implication rather than offering a near-synonymous alternative.
  naturalness: The formal-polite legal register is natural. “또” provides a smooth Korean continuation of the Hebrew conjunction, and “제사장의 모든 곡식제물” is idiomatic and clearly distributive.
  terminology: “곡식제물” is an appropriate clear modern rendering of מִנְחָה. “제사장” and “불살라야 합니다” are suitable for the cultic and legal context. The revised footnote avoids treating “온전히” and “완전히” as a meaningful lexical alternative.
  issues:
  - severity: medium
    issue: The explicit distributive force of כָּל is absent.
    rationale: “제사장의 곡식제물은” can read generically, whereas the Hebrew states that every grain offering belonging to a priest is subject to this rule. “제사장의 모든 곡식제물은” retains this force.
  - severity: low
    issue: The footnote's proposed alternative is not materially distinct from the main rendering.
    rationale: “완전히 불살라야 합니다” merely restates “온전히 불살라야 합니다.” A useful note should instead identify the adjective’s basic sense, ‘whole/entire,’ and explain its cultic implication in context.
  revised_text: 또 제사장의 모든 곡식제물은 온전히 불살라야 합니다[a]. 그것은 먹어서는 안 됩니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘온전한 제물이어야 합니다’. 히브리어 형용사는 ‘전체의, 온전한’을 뜻하며, 여기서는 아무것도 먹지 않고 전부 제단에 바치는 것, 곧 온전히 불사르는 것을 가리킵니다.
    reason: lexical_alternative
