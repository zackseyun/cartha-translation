review_pass:
  verdict: revise
  source_fidelity: The draft generally conveys the command, the sacrificial regulation, the overnight duration, and the obligation to maintain the altar fire. However, the final ‘그 위에서’ is needlessly ambiguous in Korean, whereas the masculine Hebrew suffix in בּוֹ refers to the masculine ‘altar,’ not to the feminine ‘burning place.’
  naturalness: ‘명령하여 말하십시오’ is understandable but less idiomatic than ‘명령하여 이렇게 말하십시오.’ ‘제단 위의 그 불태우는 자리에서’ is also awkward and does not clearly retain the offering’s position on the altar’s burning place. ‘제단 위의 불붙는 자리 위에’ is more precise while remaining natural in this formal legislative register.
  terminology: ‘번제’ and ‘율법’ are suitable in this cultic legal context. ‘불붙는 자리’ adequately renders מוֹקְדָה without importing a more specific architectural interpretation such as ‘화덕.’ The footnote anchors should be attached to the expressions they explain, rather than both appearing at the end of the quotation.
  issues:
  - severity: medium
    issue: The referent of ‘그 위에서’ is ambiguous.
    rationale: Hebrew בּוֹ is masculine and refers grammatically to הַמִּזְבֵּחַ (‘the altar’), while מוֹקְדָה (‘burning place’) is feminine. Korean should make ‘제단 위에서’ explicit.
  - severity: low
    issue: The Korean command formula and spatial wording are awkward.
    rationale: ‘명령하여 이렇게 말하십시오’ is idiomatic formal Korean. Rendering the location as ‘제단 위의 불붙는 자리 위에’ preserves both the burning-place term and its location on the altar.
  - severity: low
    issue: Footnote markers are not anchored to their respective terms.
    rationale: Marker a concerns תּוֹרַת (‘율법’), and marker b concerns מוֹקְדָה (‘불붙는 자리’); placing both at the end weakens their linkage.
  revised_text: 아론과 그의 아들들에게 명령하여 이렇게 말하십시오. 「이것은 번제에 관한 율법입니다[a]. 번제물은 제단 위의 불붙는 자리 위에[b] 밤새도록 아침까지 있어야 하며, 제단의 불은 제단 위에서 계속 타오르게 해야 합니다.」
  revised_footnotes:
