id: LEV.6.2
reference: Leviticus 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
  footnotes:
  - marker: a
    text: Or, 'This is the instruction for the burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the burnt offering shall be on the place of burning on the altar.' The Hebrew term refers to the burning place or hearth of the altar.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들에게 명령하여 말하십시오. 「이것은 번제에 관한 율법입니다. 번제 자체는 제단 위의 그 불태우는 자리에서 밤새도록 아침까지 있어야 하며, 제단의 불은 그 위에서 계속 타오르게 해야 합니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이것은 번제에 대한 규례입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘번제가 제단 위의 그 불태우는 자리에 있어야 합니다.’ 히브리어 용어는 제단의 불붙는 자리 또는 화로 자리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  english_pob_choice: Command
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: צוה의 강한 명령형을 살리기 위해, 완곡한 ‘지시하다’보다 직접적인 ‘명령하다’를 택했습니다.
- source_word: תּוֹרַת הָעֹלָה
  english_pob_choice: This is the law of the burnt offering
  chosen_korean: 이것은 번제에 관한 율법입니다
  alternatives_korean:
  - 이것은 번제의 법입니다
  - 이것은 번제에 대한 규례입니다
  lexicon: HALOT
  rationale: 제의적 규범 문맥에서 תּוֹרָה의 법규성을 살리되, 한국어에서는 자연스러운 ‘~에 관한 율법’으로 옮겼습니다.
- source_word: עַל מוֹקְדָה
  english_pob_choice: shall remain on its hearth
  chosen_korean: 그 불태우는 자리에서
  alternatives_korean:
  - 그 화덕에서
  - 그 화로 위에서
  - 그 재우는 자리에서
  lexicon: HALOT
  rationale: מוֹקְדָה는 제단의 불이 놓이는 ‘불태우는 자리/화로 자리’이므로, 전통적 제의 용어를 그대로 일반화하지 않고 기능을 드러내는 표현을 택했습니다.
- source_word: תּוּקַד
  english_pob_choice: shall be kept burning
  chosen_korean: 계속 타오르게 해야 합니다
  alternatives_korean:
  - 계속 불붙여 두어야 합니다
  - 계속 타게 해야 합니다
  lexicon: HALOT
  rationale: 단순 상태 서술이 아니라 유지·관리의 의무를 나타내므로, ‘계속 타오르게 해야 합니다’로 보존했습니다.
theological_decisions:
- issue: 제단 불의 지속성 표현
  chosen_reading: 계속 타오르게 해야 합니다
  alternative_readings:
  - 타야 합니다
  - 불이 있어야 합니다
  rationale: 히브리어는 제단 불을 단순히 묘사하는 것이 아니라 유지하라는 규례를 말하므로, 의무성과 지속성을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1
- issue: 율법(תּוֹרָה)의 번역
  chosen_reading: 율법
  alternative_readings:
  - instruction
  - 규례
  rationale: 여기서는 제의적 법규의 공식 문구이므로 ‘율법’이 가장 간결하고 본문 기능을 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5
