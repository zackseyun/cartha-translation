    text: 또는, ‘이것은 번제에 대한 규례입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘번제물은 제단 위의 불타는 자리에 있어야 합니다.’ 히브리어 용어는 제단의 불붙는 자리 또는 화로 자리를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision clarifies the Hebrew syntax and referents, improves formal-modern Korean flow, and relocates each footnote marker to the expression it documents. It preserves the legal force of the command and the prescribed maintenance of the altar fire.
