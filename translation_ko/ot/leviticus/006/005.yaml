- from: 그리고 제단 위의 불은 그 위에서 계속 타고 있어야 합니다. 그것은 꺼져서는 안 됩니다. 제사장은 아침마다 그 위에 나무를 태워야 하며, 그 위에 번제를 배열하고 그 위에 화목제물의 기름을 불살라야 합니다.[a][b]
  to: 그리고 제단 위의 불은 그 위에서 계속 타고 있어야 합니다. 그것은 꺼져서는 안 됩니다. 제사장은 아침마다[a] 나무를 그 위에 올려 불을 지펴야 하며, 그 위에 번제물을 차려 놓고 그 위에 화목제물[b]의 기름 부분을 불살라야 합니다.
