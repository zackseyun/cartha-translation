  source_fidelity: 제단 불이 지속되어야 한다는 명령, 꺼짐 금지, 아침마다의 반복성, 번제와 화목제 관련 기름 부분을 전반적으로 잘 전달합니다. 다만 וּבִעֵר עָלֶיהָ עֵצִים는 단순히 나무 자체를 ‘태우는’ 행위라기보다 제단 위에 나무를 더하여 불을 지피고 유지하는 행위를 뜻하므로, 이를 더 분명히 옮기는 것이 좋습니다. חֶלְבֵי는 일반적 기름이 아니라 제단에 바치는 지정된 지방 부분이므로 ‘기름 부분’으로 명시하는 편이 정확합니다.
