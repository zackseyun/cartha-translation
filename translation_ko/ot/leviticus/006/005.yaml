id: LEV.6.5
reference: Leviticus 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
  footnotes:
  - marker: a
    text: Or 'morning by morning.' The Hebrew repeats 'morning' for a distributive sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the offerings of well-being' or 'the fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제단 위의 불은 그 위에서 계속 타고 있어야 합니다. 그것은 꺼져서는 안 됩니다. 제사장은 아침마다 그 위에 나무를 태워야 하며, 그 위에 번제를 배열하고 그 위에 화목제물의 기름을 불살라야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침마다 아침마다’입니다. 히브리어는 분배적 의미를 위해 ‘아침’을 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화목제물’은 ‘평안제물’ 또는 ‘교제제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  english_pob_choice: shall be kept burning
  chosen_korean: 계속 타고 있어야 합니다
  alternatives_korean:
  - 타야 합니다
  - 불이 계속 유지되어야 합니다
  lexicon: HALOT
  rationale: 히필 수동형의 지속적 상태를 살려, 단순히 한 번 ‘탄다’가 아니라 제단 불이 계속 유지되어야 함을 표현했습니다.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  english_pob_choice: every morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매일 아침
  - 아침마다 아침마다
  lexicon: HALOT
  rationale: 반복을 통한 분배적 의미를 한국어의 자연스러운 반복 부사구로 옮겼습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 올라가는 제사
  lexicon: HALOT
  rationale: 제의 문맥에서 표준적인 희생제사 용어인 ‘번제’를 사용해 범주를 분명히 했습니다.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  english_pob_choice: the fat portions of the peace offerings
  chosen_korean: 화목제물의 기름
  alternatives_korean:
  - 화목제물의 기름진 부분
  - 평화제물의 지방
  lexicon: HALOT
  rationale: חֵלֶב은 일반적 ‘지방’보다 제단에 불살라야 하는 제의적 ‘기름/지방 부분’을 가리키므로, 한국어 성경에서 익숙한 ‘기름’을 택했습니다.
theological_decisions:
- issue: הַשְּׁלָמִים의 제의 용어
  chosen_reading: ‘화목제물’로 옮겨 제사 범주를 유지했습니다.
  alternative_readings:
  - ‘평화제물’
  - ‘교제제물’
  rationale: ‘peace offerings’의 표준적 한국어 대응은 문맥상 제의 범주를 가장 안정적으로 전달하며, 본절의 제단 규례와도 잘 맞습니다.
  doctrine_reference: 제의 용어 일관성
- issue: 제단 불의 지속성 명령
  chosen_reading: ‘계속 타고 있어야 합니다’와 ‘꺼져서는 안 됩니다’로 이중 강조를 살렸습니다.
  alternative_readings:
  - ‘타야 합니다’
  - ‘꺼지지 않아야 합니다’
  rationale: 히브리어의 지속성과 금지를 각각 살려, 제단 불 관리의 엄격한 규례를 약화시키지 않도록 했습니다.
  doctrine_reference: 본문 의미 보존
