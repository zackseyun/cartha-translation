    rationale: מרק와 שטף는 모두 명령적 규정으로 병렬되어 있으므로 ‘문질러 닦고 물로 헹구어야 합니다’가 두 정화 동작을 더 직접적으로 반영합니다.
  - severity: medium
    issue: 각주의 ‘כאן’은 잘못 혼입된 표현이며, 각주 표지도 해당 어휘에 직접 붙지 않았습니다.
