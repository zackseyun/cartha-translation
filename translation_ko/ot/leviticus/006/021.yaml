translation:
  language: ko
  text: 토기 그릇에 삶은 경우에는 그 그릇을 깨뜨려야 합니다. 그러나 청동 그릇[a]에 삶은 경우에는 그 그릇을 문질러 닦고 물로 헹구어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구리 그릇’. 히브리어 נְחֹשֶׁת는 문맥에 따라 구리나 청동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  english_pob_choice: earthenware vessel
  chosen_korean: 토기 그릇
  alternatives_korean:
  - 질그릇
  - 흙그릇
  lexicon: HALOT
  rationale: כְלִי는 일반적인 ‘그릇/용기’이고 חֶרֶשׂ는 흙으로 만든 도기를 가리키므로, 현대 한국어에서는 ‘토기 그릇’이 재질 구분을 가장 자연스럽게 살립니다.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  english_pob_choice: is boiled
  chosen_korean: 삶았으면
  alternatives_korean:
  - 끓였으면
  - 조리했으면
  lexicon: HALOT
  rationale: 의식적 규정에서 בשׁל은 ‘삶다/끓이다’의 의미가 분명하므로, 보다 일반적인 ‘조리하다’보다 ‘삶다’가 원문을 더 정확히 반영합니다.
- source_word: כְלִי נְחֹשֶׁת
  english_pob_choice: bronze vessel
  chosen_korean: 놋그릇
  alternatives_korean:
  - 청동 그릇
  - 구리 그릇
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 문맥상 청동 또는 구리를 가리킬 수 있지만, 한국어 성경 전통에서 금속 제의용 그릇을 ‘놋그릇’으로 옮기는 관용이 널리 정착되어 있어 문맥상 가장 읽히기 쉽습니다.
- source_word: וּמֹרַק וְשֻׁטַּף בַּמָּיִם
  english_pob_choice: it must be scoured and rinsed with water
  chosen_korean: 그것을 닦아낸 뒤 물로 씻어야 합니다
  alternatives_korean:
  - 그것을 문질러 깨끗이 하고 물로 헹궈야 합니다
  - 그것을 박박 문질러 씻고 물로 헹궈야 합니다
  lexicon: HALOT
  rationale: מרק과 שטף는 각각 철저히 문지르는 정화와 물로 씻는 동작을 가리키므로, ‘닦아낸 뒤’와 ‘물로 씻다’로 두 단계의 세정을 구분해 옮겼습니다.
theological_decisions:
- issue: 금속 그릇의 정화 절차와 언어 톤
  chosen_reading: ‘닦아낸 뒤 물로 씻어야 합니다’로 두 단계의 처리를 분명히 하되, 과장된 종교어 대신 절차적 법문체를 유지했습니다.
  alternative_readings:
  - ‘문질러 깨끗이 하고 헹궈야 합니다’
  - ‘닦고 물로 헹궈야 합니다’
  rationale: 본문은 단순 세척이 아니라 의식적 정결 절차를 말하므로, 두 동작을 분리해 독자가 절차의 엄격함을 이해하도록 했습니다.
  doctrine_reference: 레위기 정결 규례
