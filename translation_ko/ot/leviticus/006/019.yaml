  source_fidelity: 개정이 필요합니다. 초안의 ‘그것을 속죄하게 하는’은 히브리어 הַמְחַטֵּא אֹתָהּ의 제의적 용법을 한국어에서 부자연스럽고 의미가 불분명하게 만들며, 제물이 스스로 속죄하게 된다는 뜻으로도 읽힐 수 있습니다. ‘그것으로 속죄 제사를 집례하는’은 해당 제물로 수행하는 제사장 직무를 자연스럽게 나타냅니다. 두 번의 여성 단수 대명사는 제물을 가리키므로 한국어 ‘그것’으로 옮기는 것이 적절합니다. ‘거룩한 곳’ 및 ‘회막 뜰’은 원문의 무관사 표현과 장소 규정을 충실히 반영합니다.
  naturalness: ‘먹되’와 뒤의 ‘먹어야 한다’의 결합은 현대 표준 한국어 합쇼체에도 맞지 않고 문장 구조가 다소 어색합니다. 두 규정을 각각 ‘먹어야 합니다’로 명료하게 제시하면 법규적 문맥과 현대적인 격식을 함께 살릴 수 있습니다.
  terminology: ‘회막’은 אֹהֶל מוֹעֵד의 통상적이고 적절한 번역입니다. ‘성스러운 곳’보다 제의 용어로 일관된 ‘거룩한 곳’을 권합니다. חטא 피엘의 전문적 제의 의미는 ‘속죄 제사를 집례하는’으로 처리하고, 가능한 대안은 각주에서 보존합니다.
