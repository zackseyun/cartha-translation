translation:
  language: ko
  text: 제단 위의 불은 계속 타도록 해야 하며, 꺼져서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단 위에서는 끊임없이 불이 타야 하며, 그 불은 꺼지지 않아야 한다.’
