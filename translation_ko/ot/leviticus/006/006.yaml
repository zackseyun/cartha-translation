source:
  edition: WLC
  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
  footnotes:
  - marker: a
    text: Or 'A perpetual fire shall burn on the altar; it shall not be quenched.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제단 위에는 계속 타는 불이 있어야 하며, 꺼져서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단 위에서 꺼지지 않는 영원한 불이 있어야 한다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 불꽃
  - 화염
  lexicon: HALOT
  rationale: 기본적이고 직접적인 의미를 살려 제의 문맥에서 자연스러운 ‘불’로 옮겼습니다.
- source_word: תָּמִיד
  english_pob_choice: continual
  chosen_korean: 계속 타는
  alternatives_korean:
  - 끊임없이 타는
  - 항상 타는
  - 영구적인
  lexicon: HALOT
  rationale: ‘지속성’을 나타내는 말로, 제단의 불이 멈추지 않고 이어져야 한다는 뜻을 한국어에서 가장 자연스럽게 드러냈습니다.
- source_word: תּוּקַד
  english_pob_choice: shall be kept burning
  chosen_korean: 있어야 하며
  alternatives_korean:
  - 계속 타야 하며
  - 타고 있어야 하며
  - 붙어 있어야 하며
  lexicon: HALOT
  rationale: Hophal의 수동·사역적 뉘앙스를 살려, 단순히 한 번 타는 것이 아니라 유지되어야 하는 의무를 한국어로 풀어냈습니다.
- source_word: תִכְבֶּה
  english_pob_choice: shall not go out
  chosen_korean: 꺼져서는 안 됩니다
  alternatives_korean:
  - 꺼지지 않아야 합니다
  - 불이 꺼져서는 안 됩니다
  - 소멸되어서는 안 됩니다
  lexicon: HALOT
  rationale: ‘불이 꺼지다’의 일상적이고 명확한 표현을 택해, 금지의 뜻을 직접적으로 전달했습니다.
theological_decisions:
- issue: 성막 제의 규례의 명령형 어조
  chosen_reading: 규범적 명령을 현대 한국어의 의무 표현(‘해야 합니다’/‘안 됩니다’)으로 옮겼습니다.
  alternative_readings:
  - 직설적 미래형(‘있을 것입니다’)
  - 명령형(‘있게 하십시오’)
  rationale: 율법 규정의 지속적 의무를 청중이 즉시 이해하도록, 예언적 선언보다 규범적 지시의 뉘앙스를 유지했습니다.
  doctrine_reference: 제의 규례의 지속성과 언약 순종
- issue: ‘제단 위’의 공간 관계
  chosen_reading: ‘제단 위’로 옮겨 제의적 위치를 그대로 드러냈습니다.
  alternative_readings:
  - ‘제단에’
  - ‘제단 위에서’
  rationale: עַל의 기본 공간 관계를 보존하면서도 한국어에서 자연스러운 표현을 택했습니다.
  doctrine_reference: 성막/제단 제의의 구체성
