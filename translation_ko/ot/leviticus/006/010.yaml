revisions:
- from: 그것은 누룩과 함께 구워서는 안 됩니다. 내가 그것을 나의 화제물들 가운데서 그들의 몫으로 그들에게 주었습니다. 그것은 가장 거룩한 것이니, 속죄제와 속건제와 같습니다.[a][b]
  to: 그것은 누룩을 넣어 구워서는 안 됩니다. 내가 그것을 내 화제물[a]에서 그들의 몫으로 주었습니다. 그것은 속죄제와 속건제[b]처럼 지극히 거룩한 것입니다.
