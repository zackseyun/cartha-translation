id: LEV.6.10
reference: Leviticus 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
  footnotes:
  - marker: a
    text: Or “from my offerings made by fire.”
    reason: lexical_alternative
  - marker: b
    text: Or “and the reparation offering” or traditional “and the trespass offering.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 누룩과 함께 구워서는 안 됩니다. 내가 그것을 나의 화제물들 가운데서 그들의 몫으로 그들에게 주었습니다. 그것은 가장 거룩한 것이니, 속죄제와 속건제와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불로 드리는 나의 제물들 가운데서”
    reason: lexical_alternative
  - marker: b
    text: 또는 “속건제”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵאָפֶה חָמֵץ
  english_pob_choice: It shall not be baked with leaven
  chosen_korean: 그것은 누룩과 함께 구워서는 안 됩니다
  alternatives_korean:
  - 그것은 누룩을 넣어 구워서는 안 됩니다
  - 그것은 누룩과 함께 빵으로 구워서는 안 됩니다
  lexicon: HALOT
  rationale: תֵאָפֶה의 수동적 금지와 חָמֵץ의 ‘누룩/누룩이 든 것’ 의미를 살려, 제사 규례의 금지문답게 자연스러운 합쇼체로 옮겼습니다.
- source_word: מֵאִשַּׁי
  english_pob_choice: from my food offerings
  chosen_korean: 나의 화제물들 가운데서
  alternatives_korean:
  - 나의 화제제물들 가운데서
  - 나의 불로 드리는 제물들 가운데서
  lexicon: HALOT
  rationale: אִשֶּׁה는 전통적으로 ‘화제물/불로 드리는 제물’을 가리키므로, POB의 ‘food offerings’보다 원어의 제의적 성격이 드러나는 ‘화제물들’로 번역했습니다.
- source_word: חֶלְקָם נָתַתִּי אֹתָהּ
  english_pob_choice: I have given it as their portion
  chosen_korean: 그들의 몫으로 그들에게 주었습니다
  alternatives_korean:
  - 그들의 몫으로 주었습니다
  - 그들의 분깃으로 그들에게 주었습니다
  lexicon: HALOT
  rationale: חֵלֶק의 분배된 몫이라는 뜻을 살리되, 현대 한국어에서 가장 분명한 ‘몫’으로 옮겨 제사장 몫의 배분을 드러냈습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 가장 거룩한 것
  alternatives_korean:
  - 지극히 거룩한 것
  - 지성소에 속한 것
  lexicon: HALOT
  rationale: 중첩 표현이 나타내는 최상급 성격을 한국어의 ‘가장 거룩한 것’으로 직역에 가깝게 반영했습니다.
- source_word: כַּחַטָּאת וְכָאָשָׁם
  english_pob_choice: like the sin offering and the guilt offering
  chosen_korean: 속죄제와 속건제와 같습니다
  alternatives_korean:
  - 속죄제와 죄값제와 같습니다
  - 속죄제와 보상제와 같습니다
  lexicon: HALOT
  rationale: 제의 용례상 한국 교회 독자에게 익숙하면서도 본문의 제사 범주를 유지하는 표준 용어를 사용했습니다.
theological_decisions:
- issue: 오셈(אָשָׁם) 제사의 한국어 대응
  chosen_reading: 속건제
  alternative_readings:
  - 속죄제
  - 배상제
  rationale: 이 절은 속죄제와 별도로 אָשָׁם을 병렬하므로, ‘속건제’로 구별해 번역해야 두 제사의 범주 차이를 보존할 수 있습니다.
  doctrine_reference: 레위기 제의 규례의 구분 보존
- issue: אִשֶּׁה의 현대적 처리
  chosen_reading: 화제물
  alternative_readings:
  - 불제물
  - 불로 드리는 제물
  rationale: 원어의 ‘불로 드려지는 제사’라는 기능을 유지하면서도, POB의 ‘food offerings’보다 더 직접적으로 제의적 의미를 드러내는 번역을 택했습니다.
  doctrine_reference: 원어 우선 원칙 및 제의 용어의 가시성
