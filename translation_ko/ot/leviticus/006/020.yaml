revisions:
- from: 무엇이든지 그 고기[ᵃ]에 닿는 것은 거룩하게 될 것입니다. 그리고 그 피의 일부가 옷에 튀면, 그 피가 튄 것을 거룩한 곳에서 빨아야 합니다.[a]
  to: 그 고기에 닿는 모든 것은 거룩하게 될 것입니다. 그 피의 일부가 옷에 튀면,[a] 피가 튄 그 옷은 거룩한 곳에서 빨아야 합니다.
  rationale: 원문의 제의적 거룩함과 ‘거룩한 곳’의 비특정성을 유지했습니다. 다만 피가 튄 대상이 옷이라는 히브리어 관계절의 선행사를 한국어에서 명시하여 세탁 명령의 대상을 분명히 했습니다. 각주 앵커와 문법 형태도 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:34Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 의미는 대체로 충실합니다. 그러나 후반의 히브리어 관계절은 ‘피가 튄 그 옷’을 가리키는데, 초안의 ‘그 피가 튄 것을’은 무엇을 빨아야 하는지(피인지 옷인지)를 문법상 불분명하게 만듭니다. 이를 옷을 선행사로 분명히 하여야 합니다.
  naturalness: ‘그 고기에 닿는 모든 것은’이 ‘무엇이든지 그 고기에 닿는 것은’보다 현대 한국어 법규적 문맥에서 자연스럽습니다. 또한 옷을 대상으로 하는 כבס는 ‘빨다’가 적절합니다.
  terminology: ‘고기’, ‘거룩하게 될 것입니다’, ‘거룩한 곳’은 제의 문맥과 원문의 비특정성을 무리 없이 반영합니다. 각주 표지는 본문의 [a]와 일치시켰고, 각주 문구도 조건절의 활용형에 맞게 고쳤습니다.
  issues:
  - severity: medium
    issue: 후반 관계절의 목적어가 불명확함
    rationale: ‘그 피가 튄 것을’은 한국어에서 피가 튄 ‘것’이 무엇인지 분명하지 않으며, 히브리어는 피가 뿌려진/튄 ‘옷’을 씻으라고 합니다. ‘피가 튄 그 옷’을 써서 선행사를 명시해야 합니다.
  - severity: low
    issue: 각주 표지 불일치
    rationale: 본문 첫 표지는 [ᵃ]인데 제공된 각주 표지는 [a]입니다. 구조적 연결을 위해 표기를 통일해야 합니다.
  - severity: low
    issue: 각주 대안의 활용형 부정확
    rationale: 각주는 본문의 ‘튀면’에 붙으므로 대안도 ‘뿌려지면’처럼 조건절 형태로 제시하는 것이 자연스럽습니다.
