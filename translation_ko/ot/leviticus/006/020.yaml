  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
  footnotes:
  - marker: a
    text: Or 'is sprinkled.' The Hebrew verb can denote ritual sprinkling, but here 'spattered' was chosen because the blood lands on a garment and the context concerns washing it afterward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 고기에 닿는 모든 것은 거룩하게 될 것입니다. 그 피의 일부가 옷에 튀면,[a] 피가 튄 그 옷은 거룩한 곳에서 빨아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뿌려지면’입니다. 히브리어 동사는 예식적 뿌림을 뜻할 수도 있지만, 여기서는 피가 옷에 묻고 그 옷을 뒤이어 빨아야 한다는 문맥 때문에 ‘튀면’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  english_pob_choice: Anything that
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 무엇이든지
  - 아무것이나
  - 모든 것이
  lexicon: HALOT
  rationale: 대상과 사람을 특정하지 않는 포괄적 조건문이므로, 현대 한국어에서는 ‘무엇이든지’가 가장 자연스럽고 법조문 같은 문체에도 잘 맞습니다.
- source_word: בִּבְשָׂרָהּ
  english_pob_choice: its flesh
  chosen_korean: 그 고기
  alternatives_korean:
  - 그 살
  - 그 육체
  - 그 고기
  lexicon: HALOT
  rationale: 희생제물의 살코기를 가리키는 제의적 용례이므로 ‘고기’가 가장 구체적입니다. ‘살’은 더 직역적이지만 한국어에서 제물의 제의적 조항에는 다소 어색할 수 있습니다.
- source_word: יִקְדָּשׁ
  english_pob_choice: shall become holy
  chosen_korean: 거룩하게 될 것입니다
  alternatives_korean:
  - 거룩하게 될 것입니다
  - 거룩해질 것입니다
  - 거룩한 것으로 여겨질 것입니다
  lexicon: HALOT
  rationale: 접촉으로 인해 상태가 변하는 뉘앙스를 살려 ‘거룩하게 될 것입니다’로 옮겼습니다. 이는 단순한 속성 진술보다 결과 상태의 변화를 드러냅니다.
- source_word: יִזֶּה מִדָּמָהּ
  english_pob_choice: is spattered
  chosen_korean: 피의 일부가 ... 튀면
  alternatives_korean:
  - 피가 ... 뿌려지면
  - 피가 ... 튀면
  - 피의 일부가 ... 뿌려지면
  lexicon: HALOT
  rationale: 영문 POB의 ‘spattered’ 선택을 반영해, 의도적 예식 동작보다 옷에 묻는 결과를 드러내는 ‘튀면’을 택했습니다. ‘피의 일부’는 원문의 חלק적 표현을 무리 없이 살립니다.
- source_word: תְּכַבֵּס בְּמָקוֹם קָדֹשׁ
  english_pob_choice: you shall wash ... in a holy place
  chosen_korean: 거룩한 곳에서 빨아야 합니다
  alternatives_korean:
  - 거룩한 곳에서 빨아야 합니다
  - 성소에서 빨아야 합니다
  - 거룩한 장소에서 씻어야 합니다
  lexicon: HALOT
  rationale: ‘성소’는 지나치게 특정한 내부 공간으로 좁힐 수 있어, 문맥상 허용되는 더 넓은 ‘거룩한 곳’을 택했습니다. ‘빨다’는 옷을 세탁하는 제의적 지시를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 접촉에 의해 거룩함이 전이되는 의미
  chosen_reading: 제물의 고기와 접촉한 것은 의식적 의미에서 거룩한 상태가 됩니다.
  alternative_readings:
  - 도덕적으로 성결해진다는 뜻으로 읽는 해석
  - 단지 성물 전용으로 구별된다는 뜻으로 읽는 해석
  rationale: 본문은 도덕적 변화보다 제의적 상태 변화를 말합니다. 따라서 ‘거룩하게 될 것입니다’를 유지하되, 그 거룩함은 의식적 맥락의 것으로 이해해야 합니다.
  doctrine_reference: 레위기 6:20의 제의적 거룩성
