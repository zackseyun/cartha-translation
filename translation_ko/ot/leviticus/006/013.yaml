revisions:
- from: 이것은 아론과 그의 아들들의 예물입니다[a]. 그들이 야훼께 바칠 것은 그가 기름부음을 받는 날에 드릴 정한 곡식제물로서, 고운 가루로 된 에바 십분의 일입니다. 그 절반은 아침에, 그 절반은 저녁에 드려야 합니다.
  to: 이것은 아론과 그의 아들들이 여호와께 드릴 예물입니다. 곧 그가 기름부음을 받는 날에[a] 드릴, 고운 가루 한 에바의 십분의 일로 된 정기적인 곡식제물입니다. 그 절반은 아침에, 나머지 절반은 저녁에 드려야 합니다.
  rationale: 원문의 문장 구조를 한국어에 맞게 두 문장으로 정리하되, 아론과 그의 아들들이 드리는 예물이라는 관계, 기름부음의 날이라는 시간 표현, 그리고 히브리어 단수 대명사가 만드는 긴장을 보존했습니다. תָּמִיד는 ‘정기적인’으로 명시했으며, 각주 표지를 실제로 단수 대명사가 나타나는 구절에 옮기고 유효한 대안 표현을 제공했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:39Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 제의 용어와 분량·시간 구분은 대체로 반영했으나, 초안은 ‘정한’이 תָּמִיד의 ‘정기적/계속적’ 의미를 충분히 드러내지 못합니다. 또한 각주가 본문과 동일한 표현을 ‘또는’으로 제시하여 대안 독법 기능을 하지 못합니다.
  naturalness: 초안의 ‘그들이 야훼께 바칠 것은 … 드릴 …입니다’는 관형절이 겹쳐 다소 부자연스럽고, ‘그’의 선행사도 문장상 불분명합니다. 문장을 재구성하여 현대 표준어 합쇼체의 흐름을 개선할 수 있습니다.
  terminology: קָרְבַּן은 포괄적 제의 용어인 ‘예물’로 유지할 수 있고, מִנְחָה는 ‘곡식제물’, סֹלֶת는 ‘고운 가루’, תָּמִיד는 ‘정기적인’으로 옮기는 것이 적절합니다. יהוה는 한국어 성경의 일반적 관례에 따라 ‘여호와’로 표기했습니다.
  issues:
  - severity: medium
    issue: תָּמִיד를 ‘정한’으로 번역함
    rationale: ‘정한’은 규정되었다는 뜻에 치우치며, 본문의 지속적·정기적 제의 시행이라는 의미를 명확히 전달하지 못합니다. ‘정기적인’이 더 직접적입니다.
  - severity: medium
