source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
  footnotes:
  - marker: a
    text: Or, 'on the day of his anointing.' The Hebrew has a singular pronoun ('him'), though the verse names 'Aaron and his sons.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 아론과 그의 아들들의 예물입니다[a]. 그들이 야훼께 바칠 것은 그가 기름부음을 받는 날에 드릴 정한 곡식제물로서, 고운 가루로 된 에바 십분의 일입니다. 그 절반은 아침에, 그 절반은 저녁에 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 기름부음을 받는 날에’. 히브리어는 단수 대명사(‘그’)를 쓰지만, 앞에서는 ‘아론과 그의 아들들’을 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  english_pob_choice: offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 드림물
  lexicon: HALOT
  rationale: 제사 문맥의 넓은 sacrificial term을 살리되, 한국어에서 가장 자연스럽고 포괄적인 대응으로 옮겼습니다.
- source_word: יַקְרִיבוּ
  english_pob_choice: shall present
  chosen_korean: 바칠
  alternatives_korean:
  - 드릴
  - 제시할
  - 드러낼
  lexicon: HALOT
  rationale: 제사적으로 하나님 앞에 가져다 드리는 행위를 자연스럽게 나타내며, ‘present’의 공식성을 유지합니다.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  english_pob_choice: on the day he is anointed
  chosen_korean: 그가 기름부음을 받는 날
  alternatives_korean:
  - 그의 기름부음 받는 날
  - 그를 기름부을 날
  lexicon: HALOT
  rationale: 히브리어의 단수 대명사를 그대로 반영하여, 아론과 그의 아들들이 언급되더라도 단수 표현을 유지했습니다.
- source_word: עֲשִׂירִת הָאֵפָה
  english_pob_choice: a tenth of an ephah
  chosen_korean: 에바 십분의 일
  alternatives_korean:
  - 한 에바의 십분의 일
  - 에바의 10분의 1
  lexicon: HALOT
  rationale: 측량 단위를 한국어로 간결하게 옮기면서도 수량 관계를 분명히 드러냈습니다.
- source_word: סֹלֶת מִנְחָה תָּמִיד
  english_pob_choice: fine flour as a regular grain offering
  chosen_korean: 고운 가루로 된 정한 곡식제물
  alternatives_korean:
  - 고운 가루의 규례대로 드리는 곡식제물
  - 고운 가루로 된 계속되는 곡식제물
  lexicon: HALOT
  rationale: סֹלֶת는 ‘고운 가루’, מִנְחָה는 제의적 용례에 맞는 ‘곡식제물’로 옮기고, תָּמִיד는 ‘정한’으로 규례적·상시적 성격을 함께 살렸습니다.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  english_pob_choice: half of it ... and half of it
  chosen_korean: 그 절반은 ... 그 절반은
  alternatives_korean:
  - 반은 ... 반은
  - 한쪽 절반은 ... 다른 절반은
  lexicon: HALOT
  rationale: 두 몫으로 나누어 드리는 구조를 직접적으로 반영했습니다.
theological_decisions:
- issue: בְּיוֹם הִמָּשַׁח אֹתוֹ의 단수 대명사와 아론/아들들 복수 언급의 긴장
  chosen_reading: 단수 표현을 유지해 ‘그가 기름부음을 받는 날’로 옮겼습니다.
  alternative_readings:
  - ‘그들이 기름부음을 받는 날’로 복수화
  - ‘그의 기름부음 받는 날’로 소유격화해 긴장 완화
  rationale: 본문의 마소라 본문이 가진 문법적 긴장을 매끈하게 해소하지 않고, 대표적 제사장 직분을 가리키는 단수 표현을 보존했습니다.
  doctrine_reference: 원문 우선과 본문 긴장 보존
