    rationale: 본문도 ‘그가 기름부음을 받는 날에’인데 각주도 동일하게 ‘또는 ‘그가 기름부음을 받는 날에’’라고 되어 있어 대안 독법을 제공하지 못합니다. 히브리어의 단수 목적대명사를 설명하면서 ‘그에게 기름을 부을 날’이라는 직접적 대안을 제시해야 합니다.
