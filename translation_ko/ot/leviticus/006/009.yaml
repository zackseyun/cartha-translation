    issue: ‘누룩 없는 것으로’의 의미와 문체가 불명료함
    rationale: מַצּוֹת는 누룩 없는 먹을거리/무교병을 가리키며, תֵּאָכֵל과 결합하여 그것을 누룩 없이 먹도록 규정합니다. ‘누룩 없는 것으로’는 한국어에서 수단·변화의 의미가 두드러져 원문의 규정을 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: 각주 c의 대안 표현 ‘누룩 없는 떡들로’가 비문에 가까움
    rationale: ‘-로’는 이 문맥에서 자연스럽지 않으며, 명사형 대안은 ‘무교병으로’가 적절합니다.
  - severity: low
    issue: 각주 b의 ‘다음 절구’ 표현
    rationale: ‘절구’는 이 문맥에서 부자연스러우므로 ‘뒤의 구절’로 고칩니다.
  revised_text: 남은 것은 아론과 그의 아들들이 먹어야 합니다[a]. 그것은 누룩 없이 거룩한 곳에서[b] 먹어야 하며, 곧 회막의 뜰에서 그들이 그것을 먹어야 합니다.
