language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'the remainder' or 'what remains.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in a holy place,' not 'in the holy place'; the next clause specifies that place as the court of the tent of meeting.
    reason: lexical_alternative
  - marker: c
    text: Or 'unleavened cakes.' The Hebrew refers to the offering being eaten in an unleavened form.
    reason: lexical_alternative
translation:
  language: ko
  text: 남은 것은 아론과 그의 아들들이 먹어야 합니다[a]. 그것은 누룩 없는 것으로[b][c] 거룩한 곳에서 먹어야 하며, 곧 회막의 뜰에서 그들이 그것을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남은 부분’ 또는 ‘남아 있는 것’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 거룩한 곳’이 아니라 ‘거룩한 곳’이라고 말하며, 다음 절구가 그 장소를 회막의 뜰로 특정합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘누룩 없는 떡들로’. 히브리어는 제물을 누룩 없는 상태로 먹게 함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  english_pob_choice: What is left of it
  chosen_korean: 남은 것은
  alternatives_korean:
  - 그것의 나머지는
  - 남아 있는 것은
  lexicon: HALOT
  rationale: 문맥상 제물의 남은 부분을 가리키므로, 한국어에서는 간결하게 ‘남은 것’으로 substantival한 뉘앙스를 살렸습니다.
- source_word: יֹאכְלוּ אַהֲרֹן וּבָנָיו
  english_pob_choice: Aaron and his sons shall eat
  chosen_korean: 아론과 그의 아들들이 먹어야 합니다
  alternatives_korean:
  - 아론과 그의 아들들이 먹을 것입니다
  - 아론과 그의 아들들이 먹습니다
  lexicon: HALOT
  rationale: 법문체의 명령/규정 기능을 살려 ‘먹어야 합니다’로 옮겼고, ‘아들들’은 제사장 직무의 남성 후손을 가리키는 표현을 반영했습니다.
- source_word: מַצּוֹת תֵּאָכֵל
  english_pob_choice: It shall be eaten unleavened
  chosen_korean: 누룩 없는 것으로
  alternatives_korean:
  - 누룩 없이
  - 무교병으로
  lexicon: HALOT
  rationale: 히브리어는 ‘무교병’이라는 명사보다 누룩이 없는 상태로 먹는다는 점을 강조하므로, 본문 흐름에 맞게 ‘누룩 없는 것으로’로 자연스럽게 처리했습니다.
- source_word: בְּמָקוֹם קָדֹשׁ
  english_pob_choice: in a holy place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩한 장소에서
  lexicon: HALOT
  rationale: 관사가 없는 מקום을 반영해 ‘그 거룩한 곳’이 아니라 ‘거룩한 곳’으로 옮겼고, 이어지는 절구가 그 장소를 더 구체화합니다.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  english_pob_choice: in the court of the tent of meeting
  chosen_korean: 회막의 뜰에서
  alternatives_korean:
  - 만남의 장막 뜰에서
  - 회막 뜰에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 전통적으로 ‘회막’이 가장 안정적이며, חצר는 예배 구역의 ‘뜰’로 옮기는 것이 정확합니다.
theological_decisions:
- issue: 거룩한 곳의 범위와 구체화
  chosen_reading: ‘거룩한 곳에서’로 먼저 말하고, 뒤에서 ‘회막의 뜰’로 그 장소를 특정했습니다.
  alternative_readings:
  - ‘성소에서’
  - ‘그 거룩한 곳에서’
  rationale: 히브리어는 관사 없이 מקום קָדֹשׁ을 말하고 이어서 뜰을 지정하므로, 두 절구의 관계를 유지하면서 과도하게 특정하지 않았습니다.
  doctrine_reference: 성막 규례의 공간 구분
