  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
  footnotes:
  - marker: a
    text: Or 'purification offering' for 'sin offering'; the Hebrew term חַטָּאת can denote both sin and the offering associated with purification from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들에게 이렇게 말하십시오. ‘이것은 죄제사[a]에 관한 규례입니다. 번제물을 잡는 곳에서 죄제사도 야훼 앞에서 잡아야 합니다. 그것은 지극히 거룩한 제물입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄제사’는 정결을 위한 제사로도 옮길 수 있습니다. 히브리어 하타트(חַטָּאת)는 죄 자체와 그 죄로 인한 부정을 정결하게 하는 제사를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
