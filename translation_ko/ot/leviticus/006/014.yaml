  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'in oil.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'baked pieces' is rare and may denote baked portions prepared on the griddle.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a pleasing aroma,' a standard sacrificial expression for an offering acceptable to the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 기름을 두른 철판에 잘 섞어 만들고, 구운 조각들로 가져와서, 잘게 부순 소제[a][b]를 야훼께 향기로운 제물로 드려야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름 안에.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 희귀한 제의·조리 용어로, 철판 위에서 구워 만든 조각들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘향기로운 냄새’는 제물이 야훼께 받아들여진다는 표준 제사 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  english_pob_choice: griddle
  chosen_korean: 철판
  alternatives_korean:
  - 번철
  - 프라이팬
  - 평평한 팬
  lexicon: HALOT
  rationale: 제사 문맥의 평평한 조리판을 현대 한국어로 자연스럽게 옮기되, 일상적 ‘팬’보다 제의적 도구로 읽히는 ‘철판’이 더 직접적입니다.
- source_word: בַּשֶּׁמֶן
  english_pob_choice: with oil
  chosen_korean: 기름을 두른
  alternatives_korean:
  - 기름과 함께
  - 기름에
  - 기름으로
  lexicon: HALOT
  rationale: 전치사의 준비 수단을 한국어 제법으로 자연스럽게 풀어, ‘기름을 두른 철판’으로 조리 상태를 분명하게 했습니다.
- source_word: תֻּפִינֵי מִנְחַת פִּתִּים
  english_pob_choice: baked pieces, a grain offering broken into pieces
  chosen_korean: 구운 조각들로 가져와서, 잘게 부순 소제
  alternatives_korean:
  - 구운 조각들로 된 소제
  - 구운 조각으로 만든 소제
  - 조각난 소제
  lexicon: HALOT
  rationale: 희귀어 תֻּפִינֵי와 פִּתִּים의 반복적 ‘조각/부분’ 감각을 살려, 단순히 ‘구운 것’이 아니라 ‘구운 조각들’과 ‘잘게 부순’ 상태를 함께 드러냈습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식 제물
  - 곡물 제물
  - 곡식 제사
  lexicon: HALOT
  rationale: 레위기 제의 용어의 기술적 일관성을 위해, 곡물제의 관용 번역인 ‘소제’를 사용했습니다.
- source_word: רֵיחַ נִיחֹחַ לַיהוָה
  english_pob_choice: a pleasing aroma to Yahweh
  chosen_korean: 야훼께 향기로운 제물
  alternatives_korean:
  - 야훼께 기쁜 향기
  - 야훼께 향기로운 냄새
  - 야훼께 기쁘시게 하는 향기
  lexicon: HALOT
  rationale: ‘향기로운 제물’로 제의적 수용성의 관용구를 살리되, 하나님이 실제 냄새를 즐긴다는 오해를 피하도록 한국어에서 제물 중심으로 다듬었습니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  - 주님
  rationale: 본문이 사탄문자 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 언약 이름을 ‘야훼’로 음역해 원문 표지를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: רֵיחַ נִיחֹחַ의 제의적 의미
  chosen_reading: 향기로운 제물
  alternative_readings:
  - 향기로운 냄새
  - 기쁘신 향기
  - 기쁜 향기
  rationale: 이 표현은 신적 후각 묘사가 아니라 ‘받아들여지는 제사’라는 관용적 제의 표현이므로, 한국어에서도 수용성의 의미가 드러나도록 옮겼습니다.
  doctrine_reference: POB translation philosophy §6
