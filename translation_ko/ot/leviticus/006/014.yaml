  lexicon: HALOT
  rationale: ‘향기로운 제물’로 제의적 수용성의 관용구를 살리되, 하나님이 실제 냄새를 즐긴다는 오해를 피하도록 한국어에서 제물 중심으로 다듬었습니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  - 주님
  rationale: 본문이 사탄문자 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 언약 이름을 ‘야훼’로 음역해 원문 표지를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: רֵיחַ נִיחֹחַ의 제의적 의미
  chosen_reading: 향기로운 제물
  alternative_readings:
  - 향기로운 냄새
  - 기쁘신 향기
  - 기쁜 향기
  rationale: 이 표현은 신적 후각 묘사가 아니라 ‘받아들여지는 제사’라는 관용적 제의 표현이므로, 한국어에서도 수용성의 의미가 드러나도록 옮겼습니다.
  doctrine_reference: POB translation philosophy §6
