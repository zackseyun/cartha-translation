source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'in oil.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'baked pieces' is rare and may denote baked portions prepared on the griddle.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a pleasing aroma,' a standard sacrificial expression for an offering acceptable to the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 기름을 넣어 철판 위에서 그것을 만들어야 합니다. 잘 섞어 그것을 가져오고, 조각으로 구운 소제를 드려 야훼께 향기로운 냄새가 되게 해야 합니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름에.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 희귀한 조리 용어는 조각으로 구운 것을 가리키는 듯하나, 정확한 조리 방식은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘향기로운 냄새’는 제물이 야훼께 받아들여짐을 나타내는 표준 제사 표현입니다.
    reason: cultural_note
