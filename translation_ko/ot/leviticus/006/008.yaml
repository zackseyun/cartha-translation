    rationale: מִמֶּנּוּ는 논의 중인 소제물을 가리키므로, ‘그 소제물에서’라고 밝혀야 자연스럽고 정확합니다.
  - severity: low
    issue: 각주 b의 표지가 유향 뒤에 있으나 각주 내용은 ‘기념 부분/몫’을 설명합니다.
