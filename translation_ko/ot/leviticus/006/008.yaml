    issue: ‘고운 가루’가 ‘소제물의 고운 가루’라는 소유·수식 관계를 잃었습니다.
    rationale: סֹלֶת הַמִּנְחָה는 소제물에 속한 고운 가루를 가리킵니다. 뒤 절의 ‘그 소제물’만으로는 이 관계를 충분히 보완하지 못합니다.
  - severity: medium
