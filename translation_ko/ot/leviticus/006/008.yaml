revisions:
- from: 그는 그것에서 고운 가루 한 줌과 그 기름 일부[a], 곧 그 소제물 위에 있는 모든 유향[b]을 집어 올리고, 그 기념 부분을 제단 위에서 야훼께 향기로운 냄새로 태워야 합니다.
  to: 그는 그 소제물에서 소제물의 고운 가루를 한 줌[a]과 그 기름 일부를, 또 그 소제물 위에 있는 모든 유향을 집어 내어, 그 기념 몫[b]을 야훼께 향기로운 향기가 되게 제단 위에 태워야 합니다.
  rationale: 소제물과 고운 가루의 관계 및 대명사의 선행사를 명확히 하고, 일부만 취하는 가루·기름과 전부 취하는 유향의 대조를 보존했습니다. 또한 각주 b를 실제 설명 대상인 ‘기념 몫’에 붙였으며, 제의 전문용어와 야훼라는 신명 표기는 유지했습니다.
  reviewer_model: gpt-5.6-terra
