id: LEV.6.8
reference: Leviticus 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'he shall lift up from it with his handful.' The Hebrew verb and noun together emphasize taking up the designated handful from the offering.
    reason: lexical_alternative
  - marker: b
    text: '''Memorial portion'' translates a technical sacrificial term for the representative part of the grain offering burned on the altar.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 소제물에서 소제물의 고운 가루를 한 줌[a]과 그 기름 일부를, 또 그 소제물 위에 있는 모든 유향을 집어 내어, 그 기념 몫[b]을 야훼께 향기로운 향기가 되게 제단 위에 태워야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 한 줌으로 그것에서 들어 올리고’로 옮길 수 있습니다. 히브리어 동사와 ‘한 줌’이라는 명사는 소제물에서 지정된 한 줌의 몫을 취하는 행위를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기념 몫’은 소제물 가운데 제단 위에서 태워 바치는 대표 몫을 가리키는 제의 전문용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים
  english_pob_choice: he shall take up
  chosen_korean: 집어 올리고
  alternatives_korean:
  - 들어 올리고
  - 꺼내고
  lexicon: HALOT
  rationale: 헌물에서 지정된 몫을 ‘위로 들어 올려 취한다’는 동작을 자연스러운 한국어로 살리면서, 단순한 ‘취하다’보다 제의적 분배의 뉘앙스를 반영했습니다.
- source_word: מִמֶּנּוּ / בְּקֻמְצוֹ
  english_pob_choice: from it ... a handful
  chosen_korean: 그것에서 ... 한 줌
  alternatives_korean:
  - 그것에서 ... 손에 움켜진 만큼
  - 그것에서 ... 손아귀 한 줌
  lexicon: HALOT
  rationale: 두 요소가 함께 ‘지정된 한 줌을 떼어 취함’을 강조하므로, 한국어에서는 간결하게 ‘한 줌’으로 살리고 대상을 ‘그것’으로 받았습니다.
- source_word: סֹלֶת הַמִּנְחָה
  english_pob_choice: the fine flour of the grain offering
  chosen_korean: 고운 가루
  alternatives_korean:
  - 고운 곡식가루
  - 정선한 가루
  lexicon: HALOT
  rationale: 소제물의 տեխնიკური 재료인 סֹלֶת은 문맥상 단순한 ‘가루’보다 ‘고운 가루’가 적절하며, ‘소제물’은 제의적 맥락을 유지합니다.
- source_word: וּמִשַּׁמְנָהּ
  english_pob_choice: and some of its oil
  chosen_korean: 그 기름 일부
  alternatives_korean:
  - 그 기름에서 일부
  - 그 기름의 몫
  lexicon: HALOT
  rationale: 부분취를 나타내는 전치사의 의미를 살려 전체가 아니라 ‘일부’를 취한다는 점을 분명히 했습니다.
- source_word: כָּל הַלְּבֹנָה ... עַל הַמִּנְחָה
  english_pob_choice: all the frankincense that is on the grain offering
  chosen_korean: 그 소제물 위에 있는 모든 유향
  alternatives_korean:
  - 그 소제물 위의 모든 유향
  - 그 소제물에 놓인 모든 유향
  lexicon: HALOT
  rationale: לְבֹנָה는 일반적 향이 아니라 ‘유향’이며, ‘위에 있는’은 제물 위에 놓인 위치 관계를 그대로 반영합니다.
- source_word: אַזְכָּרָתָהּ
  english_pob_choice: its memorial portion
  chosen_korean: 기념 부분
  alternatives_korean:
  - 기억 제물
  - 기념 몫
  lexicon: HALOT
  rationale: यह 기술용어는 제단 위에 태우는 대표 몫을 가리키므로, 문맥상 ‘부분’과 결합한 ‘기념 부분’으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 음역하고, 여격 조사 ‘께’를 붙여 제의적 방향성을 살렸습니다.
theological_decisions:
- issue: רֵיחַ נִיחֹחַ의 제의적 의미
  chosen_reading: 향기로운 냄새
  alternative_readings:
  - 기쁘게 받으실 향기
  - 즐거운 향기
  rationale: 직역에 치우치기보다 하나님께 받아들여지는 제물의 관용구라는 점을 살리되, 한국어에서 과도하게 감각화되지 않도록 ‘향기로운 냄새’로 옮겼습니다.
  doctrine_reference: POB translation philosophy §6
- issue: 제의명사 מִנְחָה / אַזְכָּרָה의 기술어 유지
  chosen_reading: 소제물 / 기념 부분
  alternative_readings:
  - 곡식제물 / 기억 몫
  - 헌물 / 기념 제물
  rationale: 전통교회 용어를 무비판적으로 대체하지 않고, 레위기의 제의 체계를 드러내는 기술어를 유지했습니다.
  doctrine_reference: POB glossary and cultic-terminology policy
