revisions:
- from: 그러나 속죄제 중 그 피가 회막으로 가져와 성소에서 속죄를 하는 것은 다 먹지 말고 불에 태우라.
  to: 그러나 그 피의 일부를 성소에서 속죄하기 위하여 회막 안으로 가져가는 모든 속죄제[a]는 먹어서는 안 됩니다. 그것은 불에 태워야 합니다.
  rationale: 상반절의 접속은 문맥상 제한·대조를 자연스럽게 드러내는 ‘그러나’로 유지했습니다. ‘그 피의 일부’를 명시하여 히브리어의 부분성을 반영했고, 피를 회막 안으로 가져가는 목적과 성소에서 속죄하는 행위를 자연스러운 한국어 어순으로 표현했습니다. 금지와 명령은 합쇼체 법규 문체로 옮겼습니다.
