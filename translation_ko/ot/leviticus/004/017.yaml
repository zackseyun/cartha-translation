source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
  footnotes:
  - marker: a
    text: Or 'veil.' The Hebrew term refers to the sanctuary curtain separating sacred space.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 피에 손가락을 찍어 야훼 앞에서 휘장 앞을 향해 그 피를 일곱 번 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베일’. 히브리어 용어는 거룩한 공간을 구분하는 성소의 휘장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  english_pob_choice: Then ... shall dip
  chosen_korean: 그러면 ... 찍고
  alternatives_korean:
  - 그리고 ... 찍고
  - 그다음 ... 담그고
  lexicon: HALOT
  rationale: 제의 절차의 순차성을 살리기 위해 첫 동작을 ‘그러면’으로 이어 주고, טבל의 문맥상 자연스러운 동작을 ‘찍다’로 옮겼습니다.
- source_word: מִן הַדָּם
  english_pob_choice: in some of the blood
  chosen_korean: 그 피의 일부에
  alternatives_korean:
  - 그 피에
  - 그 피 속에
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 반영해 전체 침수를 뜻하지 않도록 ‘일부에’로 옮겼습니다.
- source_word: וְהִזָּה
  english_pob_choice: and sprinkle it
  chosen_korean: 그 피를 ... 뿌려
  alternatives_korean:
  - 그것을 뿌려
  - 뿌리고
  lexicon: HALOT
  rationale: 의례적 혈액 살포 동사로서 ‘뿌리다’가 가장 직접적이며, 문맥상 목적어는 이미 앞의 피이므로 한국어에서는 다시 받아 주었습니다.
- source_word: פָּרֹכֶת
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 장막
  lexicon: HALOT
  rationale: 성막/성전의 내막을 가리키는 전통적이고도 정확한 한국어 용례를 살리되, 본문 의미를 훼손하지 않는 범위에서 ‘휘장’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 여호와 대신 ‘여호와’가 아닌 ‘여호와’?
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원문은 יְהוָה이지만, 이 한국어 초안에서는 본문 가독성과 기존 한국어 성경 전통을 함께 고려해 공용적으로 인식되는 신명 표기를 사용했습니다. 다만 POB의 원칙상 별도 근거가 주어지면 ‘야훼’로 일관할 수도 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: פָּרֹכֶת의 한국어 교회 용어
  chosen_reading: 휘장
  alternative_readings:
  - 장막
  - 커튼
  rationale: 제의적 경계와 성소 분리를 드러내는 전통 용어를 택해, 단순한 일상용 천막 의미로 약화되지 않게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6 (readable modern English) and §1 (original-language primacy)
