revisions:
- from: 그러면 제사장은 손가락을 그 피의 일부에 찍고, 그 피를 여호와 앞에서 일곱 번 뿌려, 휘장 앞에 뿌려야 합니다.[a]
  to: 그러면 제사장은 피에 손가락을 찍어 야훼 앞에서 휘장 앞을 향해 그 피를 일곱 번 뿌려야 합니다.[a]
  rationale: 중복된 ‘뿌리다’를 삭제하고, 한 번의 살포 행위에 ‘야훼 앞에서’와 ‘휘장 앞을 향해’가 함께 걸리도록 문장을 재구성했습니다. 신명은 POB의 원어 우선 및 영어 감사 기록에 따라 ‘야훼’로 통일했으며, ‘휘장’과 그 어휘 대안 각주는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:01:50Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 제사장이 피에 손가락을 찍고 일곱 번 뿌린다는 핵심 동작을 대체로 반영합니다. 그러나 히브리어의 장소·방향 구문(‘야훼 앞에서, 휘장 앞을 향하여’)을 ‘휘장 앞에 뿌려’로 별도의 중복 동작처럼 처리하여, 뿌리는 행위가 두 번인 것처럼 읽히게 합니다. 또한 원문의 신명 יהוה는 POB 방침 및 영어 감사 기록에 맞추어 ‘야훼’로 옮겨야 합니다.
  naturalness: ‘그 피의 일부에 찍고’는 문법적으로 가능하지만 현대 한국어에서는 ‘피에 손가락을 찍어’가 더 자연스럽고, 손가락만 담그는 행위를 충분히 나타냅니다. ‘야훼 앞에서 휘장 앞을 향해’는 원문의 제의적 장소와 방향을 자연스럽게 연결합니다.
  terminology: פָּרֹכֶת에는 ‘휘장’이 정확하고 자연스럽습니다. יהוה는 ‘여호와’가 아니라 프로젝트의 정해진 표기인 ‘야훼’로 통일해야 합니다. ‘뿌리다’는 הִזָּה의 제의 문맥에 적절합니다.
  issues:
  - severity: high
    issue: ‘뿌려, 휘장 앞에 뿌려야 합니다’가 뿌리는 행위를 중복하여 번역합니다.
    rationale: 원문에는 וְהִזָּה라는 살포 동사가 한 번만 있으며, ‘야훼 앞에서’와 ‘휘장 앞을 향하여’는 그 한 행위의 장소 및 방향을 한정합니다.
  - severity: medium
    issue: יהוה를 ‘여호와’로 표기했습니다.
    rationale: 제시된 POB 영어 본문 및 신명 표기 방침은 יהוה를 고유명 ‘Yahweh’로 옮깁니다. 표준 한국어에서는 이에 대응하는 ‘야훼’가 적절합니다.
  - severity: low
    issue: ‘그 피의 일부에’는 다소 부자연스럽습니다.
    rationale: מִן־הַדָּם은 손가락이 피 전체가 아니라 피에 접촉하여 찍히는 동작임을 나타내며, 한국어에서는 ‘피에 손가락을 찍어’가 자연스럽고 의미를 과장하지 않습니다.
  revised_text: 그러면 제사장은 피에 손가락을 찍어 야훼 앞에서 휘장 앞을 향해 그 피를 일곱 번 뿌려야 합니다.[a]
