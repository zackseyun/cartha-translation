base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
  footnotes:
  - marker: a
    text: Or, 'before the curtain of the Holy Place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 손가락을 피에 적신 다음, 그 피를 야훼 앞, 곧 성소 휘장 앞에 일곱 번 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성소 휘장 앞’은 본문의 휘장을 가리키는 동시에, 그 너머의 거룩한 공간과 관련된 위치를 나타낼 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְטָבַל
  english_pob_choice: shall dip
  chosen_korean: 적신 다음
  alternatives_korean:
  - 피에 담가야 합니다
  - 피에 적셔야 합니다
  lexicon: HALOT
  rationale: 의식 절차의 연속성을 살리기 위해 미래/명령형의 규범적 문맥으로 처리했고, טבל의 기본 의미는 ‘적시다’로 자연스럽게 옮겼습니다.
- source_word: אֶצְבָּעוֹ בַּדָּם
  english_pob_choice: his finger in the blood
  chosen_korean: 손가락을 피에
  alternatives_korean:
  - 손가락을 피 속에
  - 손가락을 피 안에
  lexicon: HALOT
  rationale: ב의 도구·접촉 의미를 한국어에서는 ‘피에’로 간결하게 살렸고, 3인칭 남성 소유는 문맥상 제사장으로 분명하여 반복을 피했습니다.
- source_word: וְהִזָּה ... שֶׁבַע פְּעָמִים
  english_pob_choice: sprinkle ... seven times
  chosen_korean: 일곱 번 뿌려야 합니다
  alternatives_korean:
  - 일곱 번 뿌려야 합니다
  - 일곱 차례 뿌려야 합니다
  lexicon: HALOT
  rationale: 제의적 נזה는 일반 ‘뿌리다’보다 ‘뿌려야 합니다’가 한국어에서 가장 직접적으로 대응하며, ‘일곱 번’은 반복 횟수를 그대로 보존했습니다.
- source_word: אֶת פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  english_pob_choice: in front of the curtain of the sanctuary
  chosen_korean: 성소 휘장 앞
  alternatives_korean:
  - 성소의 휘장 앞
  - 거룩한 곳의 휘장 앞
  lexicon: HALOT
  rationale: פְּנֵי는 ‘앞’으로, פָּרֹכֶת는 성막/성전 문맥의 ‘휘장’으로 옮겼으며, הַקֹּדֶשׁ는 이 구절에서 휘장이 속한 거룩한 공간을 가리키므로 ‘성소’가 가장 간결하고 자연합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 표기인 신명사 transliteration을 따라 ‘야훼’로 옮겨, 본문의 언약적 신명 사용을 유지했습니다.
theological_decisions:
- issue: פָּרֹכֶת הַקֹּדֶשׁ의 한국어 범주화
  chosen_reading: ‘성소 휘장’으로 처리하여 휘장과 성소를 한 문구로 연결했습니다.
  alternative_readings:
  - ‘거룩한 곳의 휘장’
  - ‘지성소 휘장’
  rationale: 본문은 휘장과 그 너머의 거룩한 공간을 연관시키지만, כאן(이 구절)만으로 건축학적 세부 구분을 과도하게 단정할 필요는 없으므로, 영어 POB의 절제된 처리에 맞춰 ‘성소 휘장’으로 옮겼습니다.
  doctrine_reference: 'POB translation principle: preserve cultic referent without over-specifying beyond the source'
- issue: 야훼 앞에서의 제의 행위
  chosen_reading: ‘야훼 앞’과 ‘성소 휘장 앞’을 병기해 의례의 방향성과 대상 모두를 드러냈습니다.
  alternative_readings:
  - ‘야훼 앞에’만 사용
  - ‘주님 앞에’로 순화
  rationale: לִפְנֵי יְהוָה의 직접적 신명 언급과 ‘휘장 앞’의 공간 표지를 함께 살려, 속죄 의식의 거룩한 방향성을 분명히 했습니다.
  doctrine_reference: Leviticus cultic precision and YHWH-name policy
