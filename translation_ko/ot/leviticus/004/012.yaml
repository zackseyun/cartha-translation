revisions:
- from: 그는 그 모든 수소를 진 밖에 있는 깨끗한 곳, 곧 재 버리는 곳으로 가져다가 나무 위에서 불로 태워야 합니다. 그것은 재 버리는 곳에서 태워져야 합니다.[a][b]
  to: 그는 그 수소 전체를 진 밖의 정결한 곳[a], 곧 재를 쏟아 버리는 곳[b]으로 가져가서, 나무 위에 놓고 불에 태워야 합니다. 그 수소는 재를 쏟아 버리는 곳에서 태워져야 합니다.
  rationale: The revision improves modern formal Korean, keeps the whole bull, the location outside the camp, the clean/ritually pure place, the designated ash-disposal location, the burning on wood in fire, and the final repetition. It also places each footnote marker directly after the expression it elucidates.
