id: LEV.4.12
reference: Leviticus 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹצִ֣יא אֶת כָּל הַ֠/פָּר אֶל מִ/ח֨וּץ לַֽ/מַּחֲנֶ֜ה אֶל מָק֤וֹם טָהוֹר֙ אֶל שֶׁ֣פֶךְ הַ/דֶּ֔שֶׁן וְ/שָׂרַ֥ף אֹת֛/וֹ עַל עֵצִ֖ים בָּ/אֵ֑שׁ עַל שֶׁ֥פֶךְ הַ/דֶּ֖שֶׁן יִשָּׂרֵֽף־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'a ceremonially clean place.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the place where the ashes are poured out'; that is, a designated place for disposing of the altar ashes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 수소 전체를 진 밖의 정결한 곳[a], 곧 재를 쏟아 버리는 곳[b]으로 가져가서, 나무 위에 놓고 불에 태워야 합니다. 그 수소는 재를 쏟아 버리는 곳에서 태워져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 의식적으로 정결한 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘재를 쏟아 버리는 곳’이라는 뜻이며, 제단의 재를 처리하도록 정해진 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  english_pob_choice: He shall bring out
  chosen_korean: 가져다가
  alternatives_korean:
  - 데리고 나가야 합니다
  - 밖으로 가져와야 합니다
  lexicon: HALOT
  rationale: 히필의 사역적 방향성을 살리면서 제의 절차 문맥에 자연스러운 동사로 옮겼습니다.
- source_word: כָּל הַפָּר
  english_pob_choice: the whole bull
  chosen_korean: 그 모든 수소
  alternatives_korean:
  - 온 수소를
  - 그 전체 수소를
  lexicon: HALOT
  rationale: כָּל의 전체성은 살리되, 제사용 짐승을 가리키는 문맥에서 한국어로는 ‘그 모든 수소’가 가장 직접적입니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진 밖에 있는
  alternatives_korean:
  - 진 바깥에 있는
  - 진영 밖에 있는
  lexicon: HALOT
  rationale: 군집한 진의 경계를 뜻하는 표현이므로 표준적이고 이해하기 쉬운 ‘진 밖에 있는’으로 옮겼습니다.
- source_word: מָקוֹם טָהוֹר
  english_pob_choice: a clean place
  chosen_korean: 깨끗한 곳
  alternatives_korean:
  - 정결한 곳
  - 의식적으로 깨끗한 곳
  lexicon: HALOT
  rationale: 본문의 기본 의미는 ‘깨끗한/순수한’ 장소이지만, 레위기 제의 맥락의 정결 뉘앙스는 문맥상 유지되므로 본문은 간결하게 두고 더 분명한 설명은 각주로 처리했습니다.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  english_pob_choice: the ash dump
  chosen_korean: 재 버리는 곳
  alternatives_korean:
  - 재를 쏟는 곳
  - 재 치우는 곳
  lexicon: HALOT
  rationale: 단순한 재더미가 아니라 제단 재를 처리하도록 지정된 장소라는 점을 드러내기 위해 기능을 나타내는 표현으로 옮겼습니다.
- source_word: עַל עֵצִים בָּאֵשׁ
  english_pob_choice: on wood in the fire
  chosen_korean: 나무 위에서 불로
  alternatives_korean:
  - 나무 위에 불로
  - 나무에 불을 붙여
  lexicon: HALOT
  rationale: 목재와 불의 두 요소를 모두 보존하되, 한국어에서 자연스러운 도구·수단 표현으로 처리했습니다.
theological_decisions:
- issue: מָקוֹם טָהוֹר의 정결 뉘앙스
  chosen_reading: 본문에는 ‘깨끗한 곳’으로 두고, 정결의 제의적 의미는 각주로 보완합니다.
  alternative_readings:
  - 정결한 곳
  - 의식적으로 깨끗한 곳
  rationale: 레위기의 제의 언어상 정결 의미가 중요하지만, 본문 가독성을 위해 가장 기본적인 의미를 채택하고 전문적 뉘앙스는 주해층에서 보완하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §5-6
- issue: שֶׁפֶךְ הַדֶּשֶׁן의 장소성
  chosen_reading: ‘재 버리는 곳’은 지정된 제의적 폐기 장소를 뜻합니다.
  alternative_readings:
  - 재더미
  - 재를 쏟는 곳
  rationale: 문맥은 아무 재무더기가 아니라 제단 재를 처리하는 규정된 장소이므로, 한국어에서도 그 기능이 드러나야 합니다.
  doctrine_reference: Translation philosophy §1; §6
