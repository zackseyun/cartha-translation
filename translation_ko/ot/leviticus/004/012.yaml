    text: 히브리어는 ‘재를 쏟아 버리는 곳’이라는 뜻이며, 제단의 재를 처리하도록 정해진 장소를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision improves modern formal Korean, keeps the whole bull, the location outside the camp, the clean/ritually pure place, the designated ash-disposal location, the burning on wood in fire, and the final repetition. It also places each footnote marker directly after the expression it elucidates.
