review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal actions and the repeated reference to the ash-disposal location. However, the Korean construction '진 밖에 있는 깨끗한 곳, 곧 재 버리는 곳' can make 'outside the camp' modify only the clean place rather than the destination sequence, and '나무 위에서 불로' is not idiomatic Korean for the Hebrew 'on wood in the fire.'
  naturalness: ‘그 모든 수소’ and especially ‘나무 위에서 불로 태워야 합니다’ are awkward in modern formal Korean. ‘그 수소 전체’ and ‘나무 위에 놓고 불에 태워야 합니다’ are clearer while retaining the procedural sense.
  terminology: ‘정결한 곳’ is the established and suitably precise Korean rendering in this Levitical ritual setting. ‘재를 쏟아 버리는 곳’ reflects the literal disposal-site sense of שֶׁפֶךְ הַדֶּשֶׁן more transparently than the colloquial ‘재 버리는 곳.’ Footnote markers must be placed at the terms they explain, rather than both after the final sentence.
  issues:
  - severity: medium
    issue: Footnote markers [a] and [b] are both placed after the final sentence.
    rationale: Marker [a] explains ‘깨끗한 곳’ and marker [b] explains the ash-disposal site. Their current placement obscures their anchors.
  - severity: medium
    issue: ‘나무 위에서 불로 태워야 합니다’ is syntactically and idiomatically unnatural.
    rationale: It does not naturally express the spatial/fuel phrase עַל עֵצִים בָּאֵשׁ. ‘나무 위에 놓고 불에 태워야 합니다’ renders the procedure plainly without losing either element.
  - severity: low
    issue: ‘그 모든 수소’ is unnatural Korean.
    rationale: ‘그 수소 전체’ conveys the emphatic totality of כָּל הַפָּר more idiomatically.
  - severity: low
    issue: ‘깨끗한 곳’ underrepresents the ritual-purity nuance in this cultic context.
    rationale: ‘정결한 곳’ is natural standard Korean biblical terminology and directly conveys טָהוֹר without adding doctrinal interpretation.
  revised_text: 그는 그 수소 전체를 진 밖의 정결한 곳[a], 곧 재를 쏟아 버리는 곳[b]으로 가져가서, 나무 위에 놓고 불에 태워야 합니다. 그 수소는 재를 쏟아 버리는 곳에서 태워져야 합니다.
  revised_footnotes:
