base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
  footnotes:
  - marker: a
    text: Or, 'it becomes known to him' or 'he is informed of his sin.' The Hebrew passive can describe either personal realization or the sin being reported to him.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall bring as his offering a female goat without blemish'.
    reason: previous_rendering
translation:
  language: ko
  text: 또는 그가 지은 죄가 그에게 알려지면, 그는 자신이 지은 죄를 위하여 흠 없는 암염소 한 마리를 그의 예물로 가져와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에게 알려지면’은 본문의 수동형이 개인의 깨달음과 타인에 의한 고지를 모두 포함할 수 있다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א
  english_pob_choice: Or if the sin that he has committed is made known to him
  chosen_korean: 그가 지은 죄가 그에게 알려지면
  alternatives_korean:
  - 그가 지은 죄를 그가 깨닫게 되면
  - 그가 지은 죄를 보고받게 되면
  lexicon: HALOT
  rationale: 호펄형의 수동/사역수동 의미를 살려, 죄가 ‘그에게 알려지다’로 옮겨 개인의 자각과 전달 가능성을 모두 열어 둡니다.
- source_word: וְהֵבִ֨יא קָרְבָּנ֜/וֹ
  english_pob_choice: then he shall bring ... as his offering
  chosen_korean: 그는 ...를 예물로 가져와야 합니다
  alternatives_korean:
  - 그는 ...를 바쳐야 합니다
  - 그는 ...를 드려야 합니다
  lexicon: HALOT
  rationale: קָרְבָּן을 제의적 ‘예물/제물’로 보되, כאן의 동작 동사 ‘bring’과 자연스럽게 맞는 ‘가져와야 합니다’를 택했습니다.
- source_word: שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה
  english_pob_choice: a female goat without blemish
  chosen_korean: 흠 없는 암컷 염소
  alternatives_korean:
  - 흠 없는 숫염소가 아닌 암컷 염소
  - 온전한 암염소가 아닌 암컷 염소
  lexicon: HALOT
  rationale: ‘염소’와 ‘암컷’으로 품종과 성별을 분명히 하고, תְּמִימָה는 제사 동물의 관용구인 ‘흠 없는’으로 옮겼습니다.
- source_word: עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא
  english_pob_choice: for the sin that he has committed
  chosen_korean: 그가 지은 죄를 위한
  alternatives_korean:
  - 그가 지은 죄에 대한
  - 그가 지은 죄 때문에
  lexicon: HALOT
  rationale: עַל은 제사 동물의 용도를 나타내므로, ‘~을 위한’으로 옮겨 희생제의적 관계를 유지했습니다.
theological_decisions:
- issue: חַטָּאת의 의미를 이 절에서 어떻게 구분할지
  chosen_reading: 두 번 모두 ‘죄’로 옮기고, 제물 자체를 뜻하는 ‘속죄제’로는 옮기지 않았습니다.
  alternative_readings:
  - 마지막 구절을 ‘그의 속죄제’로 번역하기
  rationale: 문맥상 제물은 이미 קָרְבָּן(예물)과 구체적 동물로 식별되므로, חַטָּאת은 여기서 죄행 자체를 가리킨다고 보아 의미 혼선을 피했습니다.
  doctrine_reference: 제의 문맥에서의 חטאת 용례 구분
