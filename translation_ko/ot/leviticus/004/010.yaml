  verdict: revise
  source_fidelity: 히브리어의 비교 구문과 제사장이 제단에서 해당 부분들을 불사르는 동작은 대체로 반영되어 있습니다. 그러나 ‘평화제의 수소에게서 거두어지는’은 ‘수소에게서’라는 조사 결합이 부자연스럽고, יוּרַם의 ‘떼어 내다/들어 올리다’라는 제의적 동작을 충분히 명료하게 드러내지 못합니다.
  naturalness: ‘평화제의 수소에게서 거두어지는 것처럼’은 현대 표준 한국어 제의 문맥에서 어색합니다. ‘평화제물로 드리는 수소에서 떼어 내는 것처럼’이 자연스럽고 문맥상 지시 대상인 제물의 지방 부분도 더 잘 암시합니다.
  terminology: ‘평화제’와 ‘번제단’은 사용할 수 있는 용어입니다. קטר의 제의적 의미는 단순한 소각보다 ‘불살라 바치다’로 옮길 때 더 분명합니다. 영어 감사 기록의 יוּרַם 관련 각주가 한국어 본문에는 반영되지 않았으므로, 해당 위치에 선택적 직역 각주를 보완합니다.
