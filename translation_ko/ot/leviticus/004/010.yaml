id: LEV.4.10
reference: Leviticus 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יוּרַ֔ם מִ/שּׁ֖וֹר זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/הִקְטִירָ/ם֙ הַ/כֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
  footnotes:
  - marker: a
    text: Or, more literally, 'it is lifted up from the ox of the sacrifice of peace offerings.' The Hebrew verb evokes the removal/elevation of the portions to be offered.
    reason: lexical_alternative
translation:
  language: ko
  text: 평화제물로 드리는 수소에서 떼어 내는 것처럼[a], 제사장은 그것들을 번제단 위에서 불살라 바쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하여, ‘평화제물로 드리는 수소에서 들어 올려지는 것처럼.’ 히브리어 동사는 들어 올림과 떼어 냄의 어감을 함께 지니며, 여기서는 바칠 부분들을 수소에서 따로 떼어 내는 제의 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: just as
  chosen_korean: ~처럼
  alternatives_korean:
  - ~같이
  - ~한 것처럼
  lexicon: HALOT
  rationale: 앞절의 절차와의 비교를 자연스럽게 드러내는 접속 표현으로 옮겼습니다.
- source_word: יוּרַם
  english_pob_choice: it is removed
  chosen_korean: 거두어지는 것
  alternatives_korean:
  - 들려 올라가는 것
  - 떼어 내는 것
  lexicon: HALOT
  rationale: 제의 문맥에서 ‘들어 올림’의 어감을 살리되, 실제로는 제물의 일부가 따로 떼어져 제단에 바쳐지는 동작이므로 ‘거두어지다’로 옮겼습니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 수소
  alternatives_korean:
  - 소
  - 황소
  lexicon: HALOT
  rationale: 히브리어 שׁוֹר의 가축-제의적 용례를 반영하여, 일반적인 ‘소’보다 제의 맥락이 분명한 ‘수소’를 선택했습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 평화제
  alternatives_korean:
  - 화목제
  - 화목제의 제물
  lexicon: HALOT
  rationale: 전통적 교회 용어인 ‘화목제’도 가능하지만, 본문이 가리키는 제의 범주를 간결하게 드러내기 위해 ‘평화제’로 옮겼습니다.
- source_word: וְהִקְטִירָם
  english_pob_choice: and the priest shall burn them
  chosen_korean: 제사장은 그것들을 불살라야 합니다
  alternatives_korean:
  - 제사장은 그것들을 연기로 올려야 합니다
  - 제사장은 그것들을 불태워야 합니다
  lexicon: HALOT
  rationale: 히필형 קטר의 제의적 의미를 한국어로는 제단 위에서의 ‘불사름’으로 옮겨 제물로 바치는 행위를 분명히 했습니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제물이 바쳐지는 제단
  lexicon: HALOT
  rationale: 고정된 제의 용어이므로 간결하고 널리 통용되는 ‘번제단’을 사용했습니다.
theological_decisions:
- issue: 평화제의 번역어 선택
  chosen_reading: ‘평화제’로 옮겨 제의 범주를 직접적으로 드러냈습니다.
  alternative_readings:
  - 전통 교회 용어인 ‘화목제’
  - 설명적 표현인 ‘화목 제물’
  rationale: 본문의 제의 절차를 빠르게 파악할 수 있게 하면서도, Hebrew의 שְׁלָמִים과의 대응을 잃지 않도록 했습니다.
  doctrine_reference: 레위기 제의 문맥의 표준 용어 대응
