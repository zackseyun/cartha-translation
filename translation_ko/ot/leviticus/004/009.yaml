id: LEV.4.9
reference: Leviticus 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
  footnotes:
  - marker: a
    text: Or 'the lobe of the liver.' The Hebrew term for this anatomical feature is uncertain; 'appendage' is a cautious rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 두 신장과 그 위에 있는 기름, 곧 허리 부분에 있는 기름을 떼어 내고, 간 위에 있는 부위[a]도 두 신장과 함께 떼어 내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간의 엽’입니다. 이 해부학적 부위를 가리키는 히브리어 용어의 정확한 뜻은 확실하지 않으므로, ‘간 위에 있는 부위’로 신중하게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  english_pob_choice: the two kidneys
  chosen_korean: 두 신장
  alternatives_korean:
  - 두 콩팥
  - 두 신장들
  lexicon: HALOT
  rationale: 동물 제사 규례의 해부학적 표현을 현대 한국어로 직접 옮기되, 수사적/의례적 구체성을 살리기 위해 단순화했습니다.
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  lexicon: HALOT
  rationale: 제사 문맥의 חֵלֶב는 단순한 살코기와 구별되는 제의적 지방을 가리키므로, 한국어 성경 문맥에서 자연스럽고도 제의적 뉘앙스가 있는 '기름'을 택했습니다.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  english_pob_choice: the appendage on the liver
  chosen_korean: 간 위에 있는 부위
  alternatives_korean:
  - 간에 붙은 돌출부
  - 간의 덧붙은 부분
  lexicon: HALOT
  rationale: יוֹתֶרֶת의 정확한 해부학적 대응이 불확실하므로, POB의 신중한 처리에 맞춰 과도한 특정화를 피하고 기능적으로 옮겼습니다.
- source_word: עַל הַכְּלָיוֹת
  english_pob_choice: along with the kidneys
  chosen_korean: 신장들과 함께
  alternatives_korean:
  - 신장과 함께
  - 신장 위에서
  lexicon: HALOT
  rationale: 이 표현은 간의 부위가 신장들과 더불어 제거되는 제의적 묶음을 나타내므로, 병렬적 결합을 드러내는 '함께'로 옮겼습니다.
- source_word: יְסִירֶנָּה
  english_pob_choice: he shall remove it
  chosen_korean: 제거해야 합니다
  alternatives_korean:
  - 치워야 합니다
  - 벗겨내야 합니다
  lexicon: HALOT
  rationale: 법규적 절차 문체를 살리면서도 현대 한국어의 자연스러운 규범 문장으로 옮겼습니다.
theological_decisions:
- issue: 제사 해부 절차의 기술적 표현
  chosen_reading: 본문의 의미를 해치지 않도록, 정확한 해부학 용어를 과도하게 단정하지 않고 제의적 절차 중심으로 번역했습니다.
  alternative_readings:
  - 간의 엽
  - 간의 lobe
  rationale: 원문은 제사 규정의 실행 지시이므로, 독자에게 실제 제거 순서를 분명히 전달하는 것이 우선이며, 정확한 장기 세부는 불확실성을 남겨 두는 편이 본문에 충실합니다.
  doctrine_reference: 레위기 4:9의 제사 규례 문맥
- issue: ‘기름’의 제의적 의미
  chosen_reading: 단순한 지방이 아니라 제물로 구별되는 기름을 뜻하도록 번역했습니다.
  alternative_readings:
  - 지방
  - 수지
  rationale: 레위기의 제의 문맥에서 חֵלֶב은 일반 음식의 지방보다 예배에 속한 부분을 가리키는 경우가 많아, 한국어로도 그 제의적 구별을 드러내야 합니다.
  doctrine_reference: 레위기 제사 규정의 성물 구별
