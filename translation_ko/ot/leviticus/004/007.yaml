  text: 제사장은 그 피를 일부 취하여 야훼 앞에 있는 회막 안의 향단 뿔에 바르고, 또 소의 피를 다 회막 입구에 있는 번제단 밑에 쏟을지니라.
  philosophy: optimal-equivalence
