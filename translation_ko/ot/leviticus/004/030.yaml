id: LEV.4.30
reference: Leviticus 4:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
  footnotes:
  - marker: a
    text: 'Or ''from its blood.'' The Hebrew expression is literally ''from its blood'' and here likely has a partitive sense: the priest takes a portion for application to the altar.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the horns of the altar of burnt offering'—the horn-like projections at the altar's corners.
    reason: cultural_note
  - marker: c
    text: Although the text says 'all its blood,' the sequence implies that the remaining blood is poured out after some has been applied with the finger.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 손가락으로 그 피 일부를 찍어 번제단의 뿔들에 바르고, 그 피 전부를 제단 밑에 쏟아야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  english_pob_choice: And the priest shall take
  chosen_korean: 제사장은 ... 찍어
  alternatives_korean:
  - 제사장은 ... 가져야 합니다
  - 제사장은 ... 취해야 합니다
  lexicon: HALOT
  rationale: 제사장과 의례적 동작을 분명히 하되, 이어지는 '피에서 일부를'과 자연스럽게 결합되도록 한국어에서는 '찍어'를 사용해 일부를 취하는 동작을 살렸습니다.
- source_word: מִדָּמָהּ
  english_pob_choice: some of its blood
  chosen_korean: 그 피에서 일부를
  alternatives_korean:
  - 그 피로부터
  - 그 피의 일부를
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 드러내기 위해 '에서 일부를'로 옮겼고, 본문이 전체 혈액이 아니라 일부를 취하는 절차임을 유지했습니다.
- source_word: בְּאֶצְבָּעוֹ
  english_pob_choice: with his finger
  chosen_korean: 손가락으로
  alternatives_korean:
  - 그의 손가락으로
  - 손가락을 써서
  lexicon: HALOT
  rationale: 도구적 בְּ를 한국어 조사 '으로'로 자연스럽게 옮겨, 제의적 적용 방식이 드러나게 했습니다.
- source_word: קַרְנֹת מִזְבַּח הָעֹלָה
  english_pob_choice: the horns of the altar of burnt offering
  chosen_korean: 번제단의 뿔들
  alternatives_korean:
  - 번제단의 뿔
  - 번제 제단의 뿔들
  lexicon: HALOT
  rationale: 문자적 제의 용어인 'horns'를 '뿔들'로 유지해 상징을 보존했고, POB의 직설적 표현을 따라 '번제단'으로 특정했습니다.
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד הַמִּזְבֵּחַ
  english_pob_choice: he shall pour out ... at the base of the altar
  chosen_korean: 그 피는 모두 제단의 밑바닥에 쏟아야 합니다
  alternatives_korean:
  - 그 피는 모두 제단의 기초에 쏟아야 합니다
  - 그 피는 모두 제단 밑에 쏟아야 합니다
  lexicon: HALOT
  rationale: יְסוֹד는 문자적으로 '기초/밑바닥'이지만 제단 문맥에서는 '밑바닥'이 가장 자연스럽고 의례 동작도 선명하게 전달합니다.
theological_decisions:
- issue: 제의 지시문의 시제와 양식
  chosen_reading: 서술형 과거가 아니라 규범적 지시로 번역했습니다.
  alternative_readings:
  - ~했다의 서술형
  - 과거 진행형에 가까운 표현
  rationale: 본문은 제의 절차를 제시하는 율례 문맥이므로 한국어에서도 '해야 합니다'로 옮겨 절차적 규범성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 제단의 '뿔들' 보존
  chosen_reading: 상징을 완화하지 않고 '뿔들'을 그대로 유지했습니다.
  alternative_readings:
  - 모서리
  - 돌출부
  rationale: 문자적 제의 표상을 유지하는 편이 본문의 상징성과 희생 제의의 구체성을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
