  naturalness: 현 초안은 절이 다음 절로 이어지는 목록이라는 점을 대시로 드러낸 것은 적절합니다. 그러나 ‘모든 살, 곧 머리와 다리…’는 ‘곧’이 머리와 다리가 ‘살’의 동격인 것처럼 들릴 수 있습니다. 각 부분을 병렬로 나열하면 더 자연스럽고 정확합니다.
