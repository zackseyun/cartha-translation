lexical_decisions:
- source_word: עוֹר
  english_pob_choice: hide
  chosen_korean: 가죽
  alternatives_korean:
  - 피부
  - 껍질
  lexicon: HALOT
  rationale: 희생제물의 도살된 짐승에 대한 문맥이므로, 자연스럽고 구체적인 ‘가죽’이 원문 의미를 잘 드러냅니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 젊은 수소
  lexicon: HALOT
  rationale: פָּר은 제의 문맥에서 수소/황소를 가리킬 수 있으나, 레위기 제사 규정의 맥락에서는 짐승의 성별과 제의적 성격을 함께 살리는 ‘수소’가 무난합니다.
- source_word: כָּל בְּשָׂרוֹ
  english_pob_choice: all its flesh
  chosen_korean: 모든 살
  alternatives_korean:
  - 모든 육체
  - 온몸
  lexicon: HALOT
  rationale: בָּשָׂר의 구체적인 신체적 의미를 살리되, 한국어에서는 ‘살’이 제의적 도살 문맥에서 가장 सीधे하고 자연스럽습니다.
- source_word: קִרְבּוֹ
  english_pob_choice: its entrails
  chosen_korean: 내장
  alternatives_korean:
  - 창자
  - 속살
  lexicon: HALOT
  rationale: 제의적 해부 항목으로서 내부 장기를 가리키므로, 현대 한국어에서 가장 분명한 ‘내장’을 택했습니다.
- source_word: פִּרְשׁוֹ
  english_pob_choice: its dung
  chosen_korean: 똥
  alternatives_korean:
  - 배설물
  - 분뇨
  lexicon: HALOT
  rationale: פֶּרֶשׁ은 제의적 폐기물 문맥에서 배설물을 가리키므로, 원문의 노골성을 약화하지 않는 ‘똥’이 가장 직접적입니다.
