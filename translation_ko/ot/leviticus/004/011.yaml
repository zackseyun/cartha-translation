  text: 그 수소의 가죽과 그 모든 살과 머리와 다리와 내장과 배설물은—[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가죽’은 도살된 짐승의 가죽을 뜻하며, ‘피부’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수소’는 ‘젊은 수소’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내장’은 ‘속부분’ 또는 ‘내부 기관’으로도 옮길 수 있습니다.
