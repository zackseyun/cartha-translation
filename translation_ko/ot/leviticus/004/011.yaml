  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
  footnotes:
  - marker: a
    text: Or 'skin' for 'hide.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the young bull.'
    reason: lexical_alternative
  - marker: c
    text: '''Entrails'' may also be rendered ''inward parts'' or ''inner parts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 수소의 가죽과 모든 살, 곧 머리와 다리와 내장과 똥은[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가죽’은 여기서 영어 POB의 ‘hide’에 해당하며, 짐승의 ‘skin’보다 도살·제의 문맥에 더 구체적입니다.
    reason: lexical_alternative
  - marker: b
    text: פָּר는 문맥에 따라 ‘젊은 수소’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내장’은 ‘속(inner parts)’ 또는 ‘창자(inward parts)’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  english_pob_choice: hide
  chosen_korean: 가죽
  alternatives_korean:
  - 피부
  - 껍질
  lexicon: HALOT
  rationale: 희생제물의 도살된 짐승에 대한 문맥이므로, 자연스럽고 구체적인 ‘가죽’이 원문 의미를 잘 드러냅니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 젊은 수소
  lexicon: HALOT
  rationale: פָּר은 제의 문맥에서 수소/황소를 가리킬 수 있으나, 레위기 제사 규정의 맥락에서는 짐승의 성별과 제의적 성격을 함께 살리는 ‘수소’가 무난합니다.
- source_word: כָּל בְּשָׂרוֹ
  english_pob_choice: all its flesh
  chosen_korean: 모든 살
  alternatives_korean:
  - 모든 육체
  - 온몸
  lexicon: HALOT
  rationale: בָּשָׂר의 구체적인 신체적 의미를 살리되, 한국어에서는 ‘살’이 제의적 도살 문맥에서 가장 सीधे하고 자연스럽습니다.
- source_word: קִרְבּוֹ
  english_pob_choice: its entrails
  chosen_korean: 내장
  alternatives_korean:
  - 창자
  - 속살
  lexicon: HALOT
  rationale: 제의적 해부 항목으로서 내부 장기를 가리키므로, 현대 한국어에서 가장 분명한 ‘내장’을 택했습니다.
- source_word: פִּרְשׁוֹ
  english_pob_choice: its dung
  chosen_korean: 똥
  alternatives_korean:
  - 배설물
  - 분뇨
  lexicon: HALOT
  rationale: פֶּרֶשׁ은 제의적 폐기물 문맥에서 배설물을 가리키므로, 원문의 노골성을 약화하지 않는 ‘똥’이 가장 직접적입니다.
