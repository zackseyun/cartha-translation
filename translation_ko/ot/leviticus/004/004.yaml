revisions:
- from: 그는 회막의 입구, 곧 야훼 앞에 수송아지를 가져오고, 그 수송아지의 머리 위에 손을 얹은 뒤 야훼 앞에서 그 수송아지를 잡아야 합니다.[a][b]
  to: 그는 수송아지를 야훼 앞, 곧 회막 어귀로 가져와야 합니다.[a] 그 수송아지의 머리에 자기 손을 얹고, 야훼 앞에서 그 수송아지를 도살해야 합니다.[b]
  rationale: 장소구를 ‘야훼 앞, 곧 회막 어귀로’로 재구성하여, 제물을 회막 어귀로 가져오되 그곳이 야훼 앞이라는 원문의 제의적 공간 지정을 명확히 했습니다. 지시문의 법적·절차적 성격은 ‘가져와야 합니다’와 ‘도살해야 합니다’로 유지했습니다. 안수의 의미는 해설하지 않고 행위만 번역했습니다. 각주는 해당 단어 바로 뒤에 배치하고, 오류가 있는 히브리어 삽입을 제거했습니다.
