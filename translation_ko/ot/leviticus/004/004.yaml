id: LEV.4.4
reference: Leviticus 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
  footnotes:
  - marker: a
    text: Or 'the doorway of the tent of meeting.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'before the LORD,' a cultic expression meaning in the LORD's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 수송아지를 야훼 앞, 곧 회막 어귀로 가져와야 합니다.[a] 그 수송아지의 머리에 자기 손을 얹고, 야훼 앞에서 그 수송아지를 도살해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회막 어귀’는 ‘회막의 입구’ 또는 ‘회막의 문간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘도살하다’는 제물로 바치는 짐승을 죽이는 행위를 가리킵니다. ‘잡다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  english_pob_choice: He shall bring
  chosen_korean: 가져오고
  alternatives_korean:
  - 데리고 오고
  - 바치고
  lexicon: HALOT
  rationale: 제사 절차의 지시문으로서 ‘bring’의 동작성을 살리되, 한국어에서는 제물에 자연스럽게 붙는 ‘가져오고’가 가장 간결합니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 회막의 입구
  alternatives_korean:
  - 회막의 문
  - 회막의 문앞
  lexicon: HALOT
  rationale: פֶּתַח는 ‘입구/문’이지만, 제의 공간을 가리키는 אֹהֶל מוֹעֵד를 한국어 성경 관용에 맞춰 ‘회막’으로 옮기고, 장소를 압축해 ‘회막의 입구’로 표현했습니다.
- source_word: וְסָמַךְ אֶת יָדוֹ
  english_pob_choice: he shall lay his hand
  chosen_korean: 손을 얹은 뒤
  alternatives_korean:
  - 손을 얹고
  - 손을 내리누르고
  lexicon: HALOT
  rationale: סמך는 제의 문맥에서 손을 ‘대다/얹다’는 동작을 가리키므로, 상징을 과도하게 해설하지 않고 물리적 행위를 드러내는 ‘손을 얹은 뒤’로 옮겼습니다.
- source_word: וְשָׁחַט
  english_pob_choice: and slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: שׁחט는 제의적 희생 동물의 ‘도살/잡음’을 뜻하지만, 한국어에서는 제사 맥락에서 너무 일상적이거나 잔혹하게 들리지 않도록 ‘잡다’로 옮겨 제의적 기술성을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명성은 소유격·호칭이 아니라 고유명사이므로, 프로젝트 기준에 따라 ‘야훼’로 직접 옮겨 제의문 안의 신적 임재를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘before Yahweh’의 제의적 의미
  chosen_reading: ‘야훼 앞에서’로 직역해 현존의 의미를 유지
  alternative_readings:
  - ‘야훼께 드려’
  - ‘야훼를 향하여’
  rationale: לִפְנֵי יְהוָה는 단순한 방향 표현이 아니라 예배적·제의적 현존을 뜻하므로, 한국어에서도 설명을 덧붙이지 않고 ‘야훼 앞에서’로 유지해 의미의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
