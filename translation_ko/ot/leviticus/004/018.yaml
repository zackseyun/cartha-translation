id: LEV.4.18
reference: Leviticus 4:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the blood he shall put''; the English ''some'' makes the partitive sense explicit in contrast to ''all the blood'' later in the verse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 피에서 일부를 야훼[a] 앞, 곧 회막 안에 있는 제단의 뿔들에 바르십시오. 그리고 그 모든 피는 회막 어귀에 있는 번제단의 밑부분에 쏟아 부으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 직접 사용합니다.
    reason: ot_citation
lexical_decisions:
- source_word: וּמִן הַדָּם
  english_pob_choice: And from the blood ... some
  chosen_korean: 그 피에서 일부를
  alternatives_korean:
  - 그 피에서
  - 그 피의 일부를
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘피에서’로 시작하지만, 뒤의 ‘그 모든 피’와 대조되므로 부분성을 한국어에서 분명히 하도록 ‘일부를’로 옮겼습니다.
- source_word: יִתֵּן
  english_pob_choice: he shall put
  chosen_korean: 바르되
  alternatives_korean:
  - 두되
  - 놓되
  - 적용하되
  lexicon: HALOT
  rationale: 제의 문맥에서 단순한 ‘주다/놓다’보다 피를 제단에 ‘바르다’가 한국어로 더 자연스럽고, 실제 동작도 잘 드러냅니다.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  english_pob_choice: the horns of the altar
  chosen_korean: 제단의 뿔들
  alternatives_korean:
  - 제단의 뿔
  - 제단의 돌출부들
  lexicon: HALOT
  rationale: קרנות는 문자적으로 ‘뿔들’이므로 표준적인 제의 용어를 유지했습니다. 복수형도 한국어에서 살려 ‘뿔들’로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 오헬 모에드는 한국어 성경에서 널리 알려진 ‘회막’을 사용하되, 앞뒤 문맥에서 필요할 때는 ‘회막 안/어귀’로 위치를 분명히 했습니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제 드리는 제단
  lexicon: HALOT
  rationale: הָעֹלָה는 번제를 가리키므로, 간결하고 관용적인 제의 اصطلاح인 ‘번제단’을 택했습니다.
- source_word: אֶל יְסוֹד
  english_pob_choice: at the base
  chosen_korean: 기슭에
  alternatives_korean:
  - 바닥에
  - 아랫부분에
  - 기초에
  lexicon: HALOT
  rationale: 제단의 नीचे 부분을 가리키는 표현으로 ‘기슭’이 자연스럽고, 건축적·제의적 ‘base’의 이미지를 잘 전달합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 야훼를 사용하므로, POB의 본문 원칙에 따라 지칭적 대체어가 아니라 고유 이름 ‘야훼’로 옮겼습니다. ‘주님’은 의미를 약화시키므로 본문에는 두지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
