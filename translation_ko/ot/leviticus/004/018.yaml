revisions:
- from: 그리고 그 피에서 일부를 제단의 뿔들에 바르되, 그 제단은 야훼[a] 앞, 곧 회막 안에 있는 제단이며, 그 모든 피는 번제단의 기슭에 쏟아 부으십시오. 그 제단은 회막 어귀에 있습니다.
  to: 그 피에서 일부를 야훼[a] 앞, 곧 회막 안에 있는 제단의 뿔들에 바르십시오. 그리고 그 모든 피는 회막 어귀에 있는 번제단의 밑부분에 쏟아 부으십시오.
  rationale: 연결 어미를 합쇼체 명령형으로 바로잡고, 두 제단의 위치를 원문의 관계절에 따라 각각 직접 수식하도록 재구성했습니다. ‘일부’와 ‘모든 피’의 대조, 제단의 뿔들, 번제단의 밑부분이라는 핵심 표현은 유지했습니다.
