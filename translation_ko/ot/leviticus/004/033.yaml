  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
  footnotes:
  - marker: a
    text: Or 'purification offering' for both occurrences of 'sin offering'; the Hebrew term can denote the offering that deals with sin and ritual impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 손을 속죄제의 머리에 얹고, 번제가 잡히는 곳에서 그것을 속죄제로 잡아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’; 여기서 ‘속죄제’라고 옮긴 히브리어는 죄를 다루는 제물과 의례적 부정을 다루는 제물을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ
  english_pob_choice: and he shall lay his hand on the head
  chosen_korean: 자신의 손을 … 머리에 얹고
  alternatives_korean:
  - 손을 … 위에 두고
  - 손을 … 머리에 놓고
  lexicon: HALOT
  rationale: 사르기 제의 문맥의 סמך는 단순 접촉보다 제물 위에 손을 올리는 의례 행위를 가리키므로, 현대 한국어에서 자연스러운 ‘얹다’로 옮겼습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 이 절의 제의 규정에서는 חטאת를 한국 교회 전통의 ‘속죄제’로 옮기는 것이 가장 직접적이며, POB 각주의 ‘purification offering’ 가능성도 유지됩니다.
- source_word: וְשָׁחַט אֹתָהּ לְחַטָּאת
  english_pob_choice: and slaughter it for a sin offering
  chosen_korean: 그것을 속죄제로 잡아야 합니다
  alternatives_korean:
  - 그것을 속죄제물로 잡아야 합니다
  - 그것을 속죄제용으로 잡아야 합니다
  lexicon: HALOT
  rationale: שׁחט는 제사 동물의 도살을 뜻하는 전문 동사이므로 ‘잡다’보다 ‘잡아야 합니다’로 자연스럽게 옮기되, 목적 표지 לְחַטָּאת는 ‘속죄제로’로 처리해 제의적 지정성을 살렸습니다.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  english_pob_choice: in the place where the burnt offering is slaughtered
  chosen_korean: 번제가 잡히는 곳에서
  alternatives_korean:
  - 번제를 잡는 곳에서
  - 번제가 도살되는 곳에서
  lexicon: HALOT
  rationale: 정해진 제의 장소를 나타내는 구문이므로 간결하게 ‘…이 잡히는 곳’으로 옮겼고, עֹלָה는 한국어 성경에서 널리 쓰이는 ‘번제’를 유지했습니다.
theological_decisions:
- issue: חטאת의 한국어 제의 명칭 유지
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 죄를 위한 제물
  rationale: 이 절의 직접적 제의 용례에서는 전통적으로 익숙한 ‘속죄제’가 기능과 의례 절차를 가장 분명하게 전달합니다. 다만 POB의 주석처럼 이 용어가 죄와 부정결례를 함께 포괄할 수 있다는 긴장은 각주로 보존합니다.
  doctrine_reference: Translation philosophy §5; lexical tension preserved in footnote
