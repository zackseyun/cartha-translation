  terminology: חטאת는 문맥상 전통적이고 널리 통용되는 ‘죄제물’로 옮기고, 학술적으로 가능한 ‘정결제물’을 각주로 제시했습니다. כפר는 레위기의 일관된 제의 용어인 ‘속죄하다’로, נסלח은 ‘용서받다’로 번역했습니다.
