  source_fidelity: 원문의 비교·반복 구조(‘그 수송아지에게 … 한 것처럼 … 그렇게’)와 제사장의 속죄 및 공동체의 용서라는 의미를 보존하도록 바로잡았습니다. 초안의 ‘죄송아지’, ‘그에게 할 것이요’는 히브리어의 제의적 표현과 지시 대상을 부정확하고 부자연스럽게 처리했습니다.
