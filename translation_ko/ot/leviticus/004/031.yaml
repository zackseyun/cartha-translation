  naturalness: ‘화목제 희생’은 한국어에서 다소 부자연스럽고, ‘그것은 … 것과 같습니다’는 비교 대상과 지시 대상이 불명확합니다. ‘화목제물에서 기름을 제거하는 것처럼’ 및 ‘향기로운 냄새가 되도록’이 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘기름’, ‘화목제물’, ‘불사르다’, ‘속죄하다’, ‘용서받다’, ‘야훼’는 이 문맥에서 적절합니다. ‘제단 위에’는 히브리어의 제단을 향한/제단 위에서의 소각을 자연스럽게 반영합니다.
  issues:
