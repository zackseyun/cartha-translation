revisions:
- from: 그리고 그 기름을 모두 제거해야 합니다. 그것은 화목제 희생의 기름이 제거되는 것과 같습니다. 그리고 제사장은 그것을 제단 위에서 야훼께 향기로운 제물로 불살라야 합니다. 그리고 제사장은 그를 위하여 속죄해야 하며, 그는 용서받을 것입니다.[a][b]
  to: 그리고 그 제물의 모든 기름을 화목제물[a]에서 기름을 제거하는 것처럼 제거해야 합니다. 제사장은 그것을 제단 위에 야훼께 향기로운 냄새가 되도록[b] 불살라야 합니다. 그리고 제사장은 그를 위하여 속죄해야 하며, 그는 용서받을 것입니다.
  rationale: 원문의 절차적 비교와 제의적 ‘향기로운 냄새’ 표현을 보존하고, 한국어에서 자연스러운 ‘화목제물’로 다듬었습니다. 각주 표지를 실제 주석 대상 표현으로 옮겼습니다. 속죄와 용서의 관계는 원문과 같이 설명을 덧붙이지 않고 유지했습니다.
