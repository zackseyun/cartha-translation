id: LEV.4.31
reference: Leviticus 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
  footnotes:
  - marker: a
    text: Or 'the sacrifice of fellowship offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a pleasing aroma,' a stock sacrificial expression for an offering accepted by the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 기름을 모두 제거해야 합니다. 그것은 화목제 희생의 기름이 제거되는 것과 같습니다. 그리고 제사장은 그것을 제단 위에서 야훼께 향기로운 제물로 불살라야 합니다. 그리고 제사장은 그를 위하여 속죄해야 하며, 그는 용서받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 히브리어 שְׁלָמִים의 관용적 대응으로, 영어 POB의 ‘peace offerings’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘향기로운 향’은 제사가 하나님께 받아들여지는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름기
  - 지방 부분
  lexicon: HALOT
  rationale: 제사 규례 문맥에서 חֵלֶב은 제물로 제거·소각되는 기름 부분을 가리키므로, 한국어에서는 의미를 자연스럽게 드러내는 ‘기름’으로 옮겼습니다.
- source_word: יָסִיר
  english_pob_choice: shall remove
  chosen_korean: 제거해야 합니다
  alternatives_korean:
  - 없애야 합니다
  - 떼어 내야 합니다
  - 빼야 합니다
  lexicon: HALOT
  rationale: 법규적 지시문이므로 명령적 예측인 ‘-해야 합니다’가 מתאים하고, 동작의 절차성을 살려 ‘제거해야 합니다’로 옮겼습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제 희생
  alternatives_korean:
  - 화평제 희생
  - 화목제 제물
  - 평화제 희생
  lexicon: HALOT
  rationale: POB의 ‘peace offerings’에 대응하면서도 제사 용어로 널리 통용되는 ‘화목제’를 유지했고, Hebrew의 זֶבַח가 ‘희생/제사 희생’임을 드러내기 위해 ‘희생’을 덧붙였습니다.
- source_word: וְהִקְטִיר
  english_pob_choice: shall burn it
  chosen_korean: 불살라야 합니다
  alternatives_korean:
  - 태워야 합니다
  - 연기로 올려야 합니다
  - 향으로 피워야 합니다
  lexicon: HALOT
  rationale: 제단 제사 맥락에서 단순 소각이 아니라 제물로 올려지는 소각을 가리키므로, 그 제의적 함의를 살리는 ‘불살라야 합니다’를 택했습니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: as a pleasing aroma
  chosen_korean: 향기로운 제물로
  alternatives_korean:
  - 기쁘게 받으시는 향기로
  - 향기로운 향으로
  - 기분 좋으신 향으로
  lexicon: HALOT
  rationale: 히브리어의 관용구는 하나님께 받아들여지는 제사를 뜻하므로, 의미를 풀어 ‘향기로운 제물로’라고 옮겨 수용 가능성을 드러냈습니다.
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: the priest shall make atonement for him
  chosen_korean: 제사장은 그를 위하여 속죄해야 하며
  alternatives_korean:
  - 제사장은 그를 위해 속죄해야 하며
  - 제사장은 그를 위해 속죄해 주어야 하며
  - 제사장은 그를 위하여 화목하게 해야 하며
  lexicon: HALOT
  rationale: כפר의 제사장 직무를 한국어 제사 용어로 가장 직접적으로 드러내는 표준 대응은 ‘속죄하다’이므로 이를 유지했습니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: and he will be forgiven
  chosen_korean: 그는 용서받을 것입니다
  alternatives_korean:
  - 그에게 용서가 주어질 것입니다
  - 그에게 죄 사함이 있을 것입니다
  - 그가 용서될 것입니다
  lexicon: HALOT
  rationale: 결과 상태를 자연스럽게 나타내기 위해 수동 의미를 살린 ‘용서받을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: לַיהוָה의 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 프로젝트 기본값에 따라 יְהוָה는 학술적 전사인 ‘야훼’로 직접 표기하여 원문 고유명성을 유지했습니다.
  doctrine_reference: POB default divine name policy
- issue: לְרֵיחַ נִיחֹחַ의 제의적 의미
  chosen_reading: 향기로운 제물로
  alternative_readings:
  - 기쁘시게 하는 향기로
  - 받으시는 향기로
  rationale: ‘향기로운’만으로는 관용구의 수용성 의미가 약해질 수 있어, 문맥상 제물이 하나님께 받아들여진다는 점을 한국어로 분명히 했습니다.
  doctrine_reference: Preserve sacrificial idiom without flattening cultic meaning
