  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
  footnotes:
  - marker: a
    text: 'Or, more literally, ''from the blood of the bull.'' The Hebrew likely has a partitive sense: only some of the blood is brought in.'
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'tabernacle' for 'tent of meeting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기름부음받은 제사장은 수소의 피를 회막 안으로 가져와야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '수소의 피에서'. 히브리어는 일부를 취하는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역에서는 '회막' 대신 '성막'을 쓰기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  english_pob_choice: Then ... shall bring
  chosen_korean: 가져와야 합니다
  alternatives_korean:
  - 가져옵니다
  - 가져와야 한다
  lexicon: HALOT
  rationale: 법규 문맥의 연속 동작을 한국어로 자연스럽게 나타내되, 의무·절차의 힘을 살리기 위해 '-아야 합니다'로 옮겼습니다.
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  english_pob_choice: the anointed priest
  chosen_korean: 그 기름부음받은 제사장
  alternatives_korean:
  - 기름부음받은 제사장
  - 메시아 제사장
  lexicon: HALOT
  rationale: 여기서 הַמָּשִׁיחַ는 직분상 기름부음받은 제사를 가리키므로, 메시아 칭호가 아니라 직역에 가까운 '기름부음받은'을 유지했습니다.
- source_word: מִ/דַּם הַ/פָּר
  english_pob_choice: some of the bull's blood
  chosen_korean: 수소의 피
  alternatives_korean:
  - 수소의 피 중 일부
  - 그 수소의 피
  lexicon: HALOT
  rationale: 히브리어 מִן의 부분적 의미는 문맥상 분명하지만, 한국어 본문은 간결하게 두고 그 부분성은 주석 없이도 자연스럽게 읽히도록 했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 전통적 교회용어인 동시에 원어 대응성이 높은 '회막'을 채택해, 예배소의 고유 명칭을 분명히 했습니다.
theological_decisions:
- issue: הַמָּשִׁיחַ의 제목성 여부
  chosen_reading: 직분상 기름부음받은 제사장으로 이해해 '기름부음받은 제사장'으로 번역했습니다.
  alternative_readings:
  - 메시아로 번역
  - 그리스도로 번역
  rationale: 레위기 문맥에서는 구원사적 메시아 칭호가 아니라 제사장 직분의 취임 표지이므로, 본문 기능을 오해하지 않도록 직분적 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §2; contingent title usage in cultic law
