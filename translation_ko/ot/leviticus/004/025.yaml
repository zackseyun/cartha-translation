  text: 제사장은 속죄 제물[ㄱ]의 피 얼마를 손가락으로 가져다가 번제 제단의 뿔들에 바르고, 그 피는 번제 제단 밑동에 쏟아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘정결 제물’. 히브리어 하타트는 죄와 관련된 제물을 가리키며, 부정을 제거하는 의례적 기능에 주목하여 ‘정결 제물’로 옮기기도 합니다.
