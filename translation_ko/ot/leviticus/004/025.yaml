    rationale: יְסוֹד denotes the base or foundation of the altar, not a pillar. This changes the specified location for pouring out the blood.
  - severity: medium
    issue: The partitive sense of מִדַּם is not represented.
    rationale: The priest takes only some of the blood for application to the horns. '피 얼마를' communicates this explicit Hebrew detail naturally.
  - severity: low
    issue: The sacrificial term lacks a note for its lexical range.
    rationale: חַטָּאת conventionally denotes a sin offering, but in scholarly discussion it may be termed a purification offering because of its ritual function.
