  terminology: ‘기름부음 받은 제사장’, ‘야훼’, ‘속죄제물’, ‘흠 없는’은 일관되고 적절합니다. ‘속죄제물’은 חַטָּאת의 제의적 의미를 잘 드러냅니다. ‘대제사장’은 본문 자체보다 해석을 더하는 표현이므로 각주의 대안으로만 남기는 것이 적절합니다.
