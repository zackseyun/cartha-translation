language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
  footnotes:
  - marker: a
    text: Or, 'the anointed high priest.' The Hebrew reads literally 'the anointed priest.'
    reason: alternative_reading
  - marker: b
    text: Or, 'to the guilt of the people.' The Hebrew phrase is compact and may emphasize that the priest's sin results in guilt affecting the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 기름부음 받은 제사장이 죄를 지어 백성에게 죄책을 끼치면, 그는 자기가 범한 그 죄를 위하여 흠 없는 수송아지, 곧 가축 떼의 수컷을 야훼께 속죄제물로 드려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름부음 받은 대제사장’일 수 있습니다. 히브리어는 문자적으로 ‘기름부음 받은 제사장’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘백성의 죄책을 위한’ 뉘앙스일 수 있습니다. 히브리어 표현은 압축되어 있어, 제사장의 죄가 백성에게 미치는 책임을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  english_pob_choice: the anointed priest
  chosen_korean: 기름부음 받은 제사장
  alternatives_korean:
  - 기름부음 받은 대제사장
  - 기름부음 받은 제사장
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘기름부음 받은 제사장’이라고 말하며, 별도의 ‘대제사장’ 표현은 본문 밖의 해석을 더합니다.
- source_word: לְאַשְׁמַת הָעָם
  english_pob_choice: bringing guilt on the people
  chosen_korean: 백성에게 죄책을 끼치면
  alternatives_korean:
  - 백성의 죄책이 되면
  - 백성에게 죄를 가져오면
  - 백성에게 죄책을 가져오면
  lexicon: HALOT
  rationale: לְ + אַשְׁמָה는 결과적 책임/죄책을 나타내므로, ‘죄책을 끼치다’가 문맥의 공동체적 결과를 자연스럽게 드러냅니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: a bull, a son of the herd
  chosen_korean: 수송아지, 곧 가축 떼의 수컷
  alternatives_korean:
  - 황소 한 마리
  - 소 떼의 새끼 수소
  - 가축 떼의 수컷인 수송아지
  lexicon: HALOT
  rationale: POB의 선택처럼 ‘bull, a son of the herd’의 직역성을 살리되, 한국어에서는 ‘수송아지’와 설명구를 병기해 의미를 분명히 했습니다.
- source_word: תָּמִים
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 완전한
  - 흠이 없는
  - 온전한
  lexicon: HALOT
  rationale: 제의적 합격 조건을 가리키는 관용구이므로, 한국어 성경체에서 자연스러운 ‘흠 없는’을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 יהוה는 학술적 전사인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ를 직함으로 풀지, 직역적으로 유지할지
  chosen_reading: 기름부음 받은 제사장
  alternative_readings:
  - 기름부음 받은 대제사장
  rationale: 히브리어 본문이 직접 쓰는 표현을 유지해, 본문이 요구하지 않는 직함 확장을 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 제사장의 죄가 백성에게 미치는 공동체적 결과를 어떻게 보존할지
  chosen_reading: 백성에게 죄책을 끼치면
  alternative_readings:
  - 백성의 죄책이 되면
  - 백성에게 죄를 가져오면
  rationale: 본문은 개인적 범죄를 넘어 공동체적 죄책을 암시하므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
