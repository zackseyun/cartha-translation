id: LEV.4.29
reference: Leviticus 4:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
  footnotes:
  - marker: a
    text: Or 'the purification offering.' The Hebrew term חטאת can refer to the offering associated with sin and purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람은 속죄제물의 머리에 손을 얹고, 번제를 드리는 곳에서 그 속죄제물을 잡아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חטאת는 전통적으로 ‘속죄제물’로 옮깁니다. 이 제의 정결 기능을 강조하여 ‘정결제물’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ
  english_pob_choice: he shall lay his hand on the head of
  chosen_korean: 자기 손을 얹고
  alternatives_korean:
  - 손을 두고
  - 손을 놓고
  lexicon: HALOT
  rationale: סמך는 제의 문맥에서 제물 위에 손을 두거나 얹는 행위를 가리키므로, 한국어에서는 자연스럽고 의례적 의미를 살리는 ‘손을 얹고’가 가장 적절합니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 죄를 위한 제물
  lexicon: HALOT
  rationale: חטאת는 레위기 제의 문맥에서 단순한 ‘죄’보다 특정 제의 제물을 가리키므로, 의미를 드러내는 ‘속죄제물’로 옮겼습니다. 이는 영어 POB의 'sin offering'에 대한 한국어 대응이지만, 제물의 기능을 더 분명히 합니다.
- source_word: וְשָׁחַט
  english_pob_choice: and slaughter
  chosen_korean: 잡아
  alternatives_korean:
  - 도살하고
  - 죽이고
  lexicon: HALOT
  rationale: שחט는 희생제의 동물에 대한 기술적 용어이지만, 한국어에서는 현대 독자가 바로 이해할 수 있는 제의적 동사 ‘잡다’가 가장 무난합니다. 다만 단순한 ‘죽이다’보다 제의 행위를 드러내기 위해 ‘잡아야 합니다’로 정리했습니다.
- source_word: בִּמְקוֹם הָעֹלָה
  english_pob_choice: in the place of the burnt offering
  chosen_korean: 번제물을 잡는 장소에서
  alternatives_korean:
  - 번제물의 자리에서
  - 번제 드리는 곳에서
  lexicon: HALOT
  rationale: מקום은 지정된 위치를 뜻하므로, 문맥상 번제물이 처리되던 제의적 장소를 풀어 ‘번제물을 잡는 장소’로 옮겼습니다. 이는 장소의 기능을 드러내면서도 원문의 대응관계를 유지합니다.
theological_decisions:
- issue: חטאת의 한국어 제의 용어 선택
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄제물
  - 속죄제
  rationale: 이 절은 죄의 개념을 설명하기보다 특정 제의 절차를 지시하므로, 제물 자체를 분명히 하는 표현을 택했습니다. 전통적 ‘속죄제’보다 ‘속죄제물’이 이 문맥의 구체성을 더 잘 드러냅니다.
  doctrine_reference: Leviticus sacrificial terminology
- issue: סָמַךְ와 שָׁחַט의 절차적 표현
  chosen_reading: 손을 얹고 … 잡아야 합니다
  alternative_readings:
  - 손을 놓고 … 도살해야 합니다
  - 손을 두고 … 죽여야 합니다
  rationale: 히브리어 완료/서술형태가 제의 규례 문맥에서는 지시문 기능을 하므로, 한국어에서는 명령형이 아닌 규범적 서술인 ‘해야 합니다’로 옮겨 법규의 성격을 살렸습니다.
  doctrine_reference: Legal-ritual discourse in Torah
