  verdict: revise
  source_fidelity: 원문의 제의 절차와 핵심 용어는 대체로 반영되어 있습니다. 그러나 עַל אִשֵּׁי יְהוָה는 제단과 동격인 ‘야훼의 화제 위’가 아니라, 제단에서 ‘야훼께 드리는 화제물 위에’ 놓고 불사르는 관계를 나타냅니다. 또한 וְכִפֶּר עָלָיו는 한국어에서 ‘그를 속죄하다’보다 ‘그를 위하여 속죄하다’가 원문의 전치사 관계와 제의적 의미를 정확히 드러냅니다.
  naturalness: 현 번역의 ‘제단 위, 곧 야훼의 화제 위에’는 ‘제단’과 ‘화제’를 동격처럼 연결하여 의미가 부정확하고 어색합니다. ‘그를 속죄하다’도 현대 표준 한국어의 성경 문체에서는 부자연스럽습니다. 이를 바로잡아 합쇼체의 자연스러운 절차 서술로 정리했습니다.
  terminology: ‘기름’, ‘화목제’, ‘화제물’, ‘속죄’, ‘용서받다’, ‘야훼’는 모두 적절합니다. 다만 각주가 실제로 설명하는 אִשֵּׁי יְהוָה에 붙도록 ‘화제물’에 각주 표지를 옮기고, 대안 표현에도 야훼와 제의적 의미를 보존했습니다.
