source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
  footnotes:
  - marker: a
    text: Or 'offerings by fire to the LORD.' The Hebrew expression is a technical sacrificial term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 모든 기름[a]을 제거해야 합니다. 곧 화목제의 제물에서 양의 기름을 제거하듯이 해야 합니다. 제사장은 그것들을 제단 위, 곧 야훼의 화제 위에 불살라야 합니다. 이렇게 제사장은 그가 지은 죄에 관하여 그를 속죄할 것이며, 그는 용서받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화제로 드리는 제물’입니다. 히브리어 표현은 제의적 전문용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  lexicon: HALOT
  rationale: 제의 문맥에서 제물에서 떼어내어 바치는 동물의 지방을 가리키므로, 한국어 성경 전통과 제의 기능을 함께 살릴 수 있는 ‘기름’이 가장 자연스럽습니다.
- source_word: יָסִיר / יוּסַר
  english_pob_choice: shall remove / is removed
  chosen_korean: 제거해야 합니다 / 제거하듯이
  alternatives_korean:
  - 떼어내야 합니다 / 떼어내듯이
  - 없애야 합니다 / 없애듯이
  lexicon: HALOT
  rationale: 의식 절차상 분리·제거의 동작을 나타내므로, 제의적 뉘앙스를 살리는 ‘제거하다’로 옮겼습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제의 제물
  alternatives_korean:
  - 화목제 제물
  - 평안제의 제물
  lexicon: HALOT
  rationale: 전승된 제의 명칭을 유지하되, ‘제물’로 구문을 정리해 한국어 문장을 자연스럽게 했습니다.
- source_word: אִשֵּׁי יְהוָה
  english_pob_choice: the food offerings of Yahweh
  chosen_korean: 야훼의 화제
  alternatives_korean:
  - 야훼께 드리는 화제
  - 야훼의 불로 드리는 제물
  lexicon: HALOT
  rationale: 히브리어의 기술적 제의 표현을 가능한 한 직접적으로 살리기 위해 ‘화제’를 유지했고, POB의 야훼 표기도 반영했습니다.
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: shall make atonement for him
  chosen_korean: 그를 속죄할 것이며
  alternatives_korean:
  - 그를 속죄할 것이고
  - 그를 대속할 것이며
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 한국어 성경의 핵심 용어인 ‘속죄하다’로 옮겨, 단순한 용서 선언이 아니라 제사장 행위의 결과를 드러냈습니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: he shall be forgiven
  chosen_korean: 그는 용서받을 것입니다
  alternatives_korean:
  - 그에게 용서가 있을 것입니다
  - 그의 죄가 용서될 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 결과를 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: אִשֵּׁי יְהוָה의 제의적 표현 유지
  chosen_reading: 야훼의 화제
  alternative_readings:
  - 야훼께 드리는 화제
  - 불로 드리는 예물
  rationale: 본문은 제단 위에서의 소각과 연관된 전문 용어를 사용하므로, 이를 완화해 풀어쓰기보다 ‘화제’라는 제의 용어를 유지하는 편이 원문 구조와 신학적 밀도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: כפר와 סלח의 관계
  chosen_reading: 그를 속죄할 것이며, 그는 용서받을 것입니다
  alternative_readings:
  - 그를 정결하게 할 것이며, 그는 용서받을 것입니다
  - 그를 위해 속죄가 이루어질 것이며, 그는 용서받을 것입니다
  rationale: 본문은 제사장의 속죄 행위와 그 결과인 용서를 함께 말하므로, 둘을 분리하지 않고 순차적으로 제시해 제의-용서의 연결을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
