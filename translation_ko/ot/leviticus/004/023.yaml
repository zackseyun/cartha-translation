id: LEV.4.23
reference: Leviticus 4:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
  footnotes:
  - marker: a
    text: Or, more formally, 'if his sin which he has committed is made known to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 죄가 그에게 알려지면, 그는 흠 없는 수염소 한 마리를 자신의 예물로 가져와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그가 범한 죄가 그에게 알려지면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדַע אֵלָיו
  english_pob_choice: is made known to him
  chosen_korean: 그에게 알려지면
  alternatives_korean:
  - 그에게 드러나면
  - 그가 알게 되면
  lexicon: HALOT
  rationale: 수동적/사역수동적 의미를 살려, 죄에 대한 인식이 그에게 ‘도달하는’ 상황을 자연스러운 한국어 수동 표현으로 옮겼습니다.
- source_word: חַטָּאתוֹ אֲשֶׁר חָטָא בָּהּ
  english_pob_choice: the sin that he has committed
  chosen_korean: 그 죄
  alternatives_korean:
  - 그가 저지른 죄
  - 그가 범한 죄
  lexicon: HALOT
  rationale: 문맥상 מדובר 하는 것은 제물이 아니라 그가 저지른 죄이므로, 과도한 반복을 피하면서도 지시 대상을 분명히 했습니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: as his offering
  chosen_korean: 자신의 예물로
  alternatives_korean:
  - 자기 예물로
  - 자기 제물로
  lexicon: HALOT
  rationale: קרבן은 하나님께 ‘가까이 가져오는’ 예물을 가리키므로, 문맥에 맞게 ‘예물’로 옮기고 목적격 구성을 자연스럽게 살렸습니다.
- source_word: שְׂעִיר עִזִּים זָכָר תָּמִים
  english_pob_choice: a male goat without blemish
  chosen_korean: 흠 없는 수염소 한 마리
  alternatives_korean:
  - 흠 없는 숫염소 한 마리
  - 결함 없는 수염소 한 마리
  lexicon: HALOT
  rationale: 수컷과 흠 없음의 제의적 조건을 모두 보존했습니다. ‘수염소’는 표준어이면서도 제의 동물로 충분히 명확합니다.
theological_decisions:
- issue: חַטָּאת의 의미
  chosen_reading: 여기서는 ‘죄’로 읽고, 속죄제 자체로 읽지 않습니다.
  alternative_readings:
  - 속죄제
  - 죄책
  rationale: 바로 뒤의 관계절 ‘그가 범한’이 행위 자체를 가리키므로, 제물 명칭이 아니라 죄/오류를 뜻하는 것으로 이해하는 것이 본문 구조에 가장 잘 맞습니다.
  doctrine_reference: 레위기 4장 문맥상 죄와 그에 대한 제물의 구분
