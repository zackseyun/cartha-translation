revisions:
- from: 그는 염소의 머리에 손을 얹고, 야훼 앞에서 번제를 잡는 곳에서 그것을 잡아야 합니다. 그것은 속죄제입니다.[a]
  to: 그는 숫염소의 머리에 손을 얹고, 야훼 앞에서 번제를 잡는 곳에서 그 숫염소를 잡아야 합니다. 그것은 속죄제입니다.[a]
