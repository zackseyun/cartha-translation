  source_fidelity: 히브리어 שָׂעִיר는 일반적인 ‘염소’보다 수컷 염소, 즉 ‘숫염소’를 가리킵니다. 또한 두 동사는 규정적 미완료형이므로 ‘…얹고 …잡아야 합니다’라는 합쇼체 표현은 적절합니다. ‘야훼 앞에서 번제를 잡는 곳’도 לִפְנֵי יְהוָה의 제의적 장소 수식을 자연스럽게 보존합니다.
