  rationale: 이 구절은 제물의 종류를 판정하는 문장으로 읽히므로, 한국어 교회 전통에서 널리 통용되는 제의 용어를 본문에 유지하되, 용어가 죄와 정결의 긴장을 완전히 풀어내지는 않도록 했습니다.
