id: LEV.4.24
reference: Leviticus 4:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
  footnotes:
  - marker: a
    text: Or, 'It is a purification offering.' The Hebrew term חַטָּאת can denote both 'sin' and the offering associated with removing impurity/sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 염소의 머리에 손을 얹고, 야훼 앞에서 번제를 잡는 곳에서 그것을 잡아야 합니다. 그것은 속죄제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것은 정결제입니다.’ 히브리어 חַטָּאת은 ‘죄’와 ‘죄/부정함을 제거하는 제물’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  english_pob_choice: shall lay his hand
  chosen_korean: 손을 얹고
  alternatives_korean:
  - 손을 놓고
  - 손을 대고
  lexicon: HALOT
  rationale: 제사 문맥의 סמך יד는 제물 위에 손을 얹는 예식 행위를 가리키므로, 한국어에서는 ‘손을 얹다’가 가장 직접적이고 자연스럽습니다.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  english_pob_choice: on the head of the goat
  chosen_korean: 염소의 머리에
  alternatives_korean:
  - 염소의 머리 위에
  - 염소 머리에
  lexicon: HALOT
  rationale: 히브리어의 신체 부위와 소유 관계를 그대로 살려, 희생 제물인 숫염소의 머리를 분명하게 드러내었습니다.
- source_word: וְשָׁחַט אֹתוֹ
  english_pob_choice: and slaughter it
  chosen_korean: 그것을 잡아야 합니다
  alternatives_korean:
  - 그것을 죽여야 합니다
  - 그것을 도살해야 합니다
  lexicon: HALOT
  rationale: שחט은 제의적 도살을 뜻하므로 ‘잡다’는 한국어 성경에서 흔히 쓰는 제사 동사로서 문맥을 살리되, 단순한 살해가 아님을 유지합니다.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  english_pob_choice: in the place where they slaughter the burnt offering
  chosen_korean: 번제를 잡는 곳에서
  alternatives_korean:
  - 번제를 도살하는 곳에서
  - 번제가 잡히는 곳에서
  lexicon: HALOT
  rationale: 반복을 줄이면서도 지정된 제의 장소라는 의미를 유지했습니다. 영어 POB의 능동적 재구성을 반영하되, 한국어에서는 간결한 관용 표현을 택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 원문의 신명 표기를 그대로 반영하여 ‘야훼’로 옮겼습니다. 이는 본문에 직접 나타난 언약명을 보존하기 위한 선택입니다.
- source_word: חַטָּאת הוּא
  english_pob_choice: It is a sin offering
  chosen_korean: 그것은 속죄제입니다
  alternatives_korean:
  - 그것은 죄제입니다
  - 그것은 정결제입니다
  lexicon: HALOT
  rationale: 제사법 문맥에서 חטאת은 전통적으로 ‘속죄제’로 알려진 제물 유형을 가리키므로, 문맥상 가장 식별 가능한 한국어 용어를 사용했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 나타난 언약명 자체를 드러내기 위해 음역형을 유지했습니다. 이는 단순한 직함이 아니라 고유한 신명이라는 점을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 죄제
  - 정결제
  - 죄/속죄의 제물
  rationale: 이 구절은 제물의 종류를 판정하는 문장으로 읽히므로, 한국어 교회 전통에서 널리 통용되는 제의 용어를 본문에 유지하되, 용어가 죄와 정결의 긴장을 완전히 풀어내지는 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms, or documented exception
