source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
  footnotes:
  - marker: a
    text: 'Or, more literally, ''from the blood of the bull.'' The Hebrew likely has a partitive sense: the priest takes a portion of the blood.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the tent of meeting'; 'into' reflects the ritual context, since the subsequent actions occur inside the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 기름부음 받은 제사장은 그 수송아지의 피 일부를 취하여 회막 안으로 가져가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘그 수송아지의 피에서’. 히브리어는 부분적 의미를 가질 가능성이 있어, 제사장이 피의 일부를 취하는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘회막으로’이지만, 뒤따르는 제의 행위가 회막 내부에서 이루어지므로 문맥상 ‘회막 안으로’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: And ... shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 취해야 합니다
  - 가져야 합니다
  lexicon: HALOT
  rationale: 제사장에게 지시되는 제의 절차이므로 미래·의무적 뉘앙스를 살리되, 한국어에서는 연결 동작을 자연스럽게 나타내는 ‘가져다가’가 가장 적절합니다.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  english_pob_choice: the anointed priest
  chosen_korean: 제사장
  alternatives_korean:
  - 기름부음 받은 제사장
  - 기름부음 받은 제사장님
  lexicon: HALOT
  rationale: 레위기 문맥의 직분명은 한국어에서 자연스럽게 ‘제사장’으로 옮기되, ‘기름부음 받은’이라는 형용사는 생략하지 않고 후행 절의 제의 절차 전체가 해당 직분에 귀속됨을 전제로 합니다.
- source_word: מִדַּם
  english_pob_choice: some of ... blood
  chosen_korean: 피에서 일부를
  alternatives_korean:
  - 피의 일부를
  - 그 피에서
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 피 전체가 아니라 일부를 취한다는 점을 드러내기 위해 ‘에서 일부를’로 옮겼습니다.
- source_word: אֶל אֹהֶל מוֹעֵד
  english_pob_choice: into the tent of meeting
  chosen_korean: 회막 안으로
  alternatives_korean:
  - 회막으로
  - 회막 안으로 들어가
  lexicon: HALOT
  rationale: 문맥상 제사장이 성소 공간 내부로 들어가는 동작이므로 ‘안으로’가 POB의 ‘into’를 가장 자연스럽게 반영합니다. ‘회막’은 אֹהֶל מוֹעֵד의 표준 번역입니다.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ의 한국어 처리
  chosen_reading: 직분명은 ‘제사장’으로 간결히 두고, 본문 전체의 제의 문맥으로 ‘기름부음 받은’ 의미를 함축했습니다.
  alternative_readings:
  - 기름부음 받은 제사장
  - 대제사장
  rationale: 원문은 메시아적 호칭이 아니라 레위 제사직의 기술적 표현이므로, 후대 교회 용어인 ‘대제사장’보다 원문 의미를 덜 왜곡하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 2, 5
