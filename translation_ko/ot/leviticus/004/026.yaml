  source_fidelity: 수정안은 חֶלְבּוֹ를 앞 절의 제물인 ‘그 짐승’에 연결하여 사람의 지방으로 오해될 수 있는 표현을 피하고, יַקְטִיר의 제의적 행위를 ‘불살라 연기로 올리다’로 반영합니다. כִּפֶּר עָלָיו מֵחַטָּאתוֹ는 제사장이 그 사람을 위하여 그의 죄에 관해 속죄를 행한다는 관계를 보존했으며, וְנִסְלַח לוֹ는 수동형 ‘그는 용서를 받을 것입니다’로 옮겼습니다.
  naturalness: 기존 문장은 ‘하되’의 반복, ‘속죄하게 하매’의 비자연스러운 연결, 그리고 합쇼체와 맞지 않는 종결 때문에 읽기가 어렵습니다. 수정안은 현대 표준어 합쇼체로 문장을 분명히 연결합니다.
  terminology: ‘제단’, ‘기름’, ‘화목제사’, ‘속죄’, ‘용서’는 레위기의 제의 문맥에서 일관되고 널리 이해되는 용어입니다. 화목제사와 חַטָּאת의 어휘 범위는 해당 단어에 맞춘 각주로 보존합니다.
