    issue: ‘그의 모든 기름’의 선행사가 불명확합니다.
    rationale: 히브리어 접미사 -וֹ는 속죄제 제물의 기름을 가리킵니다. 한국어 ‘그의’는 바로 뒤에 나오는 남성 당사자의 지방으로 읽힐 수 있으므로 ‘그 짐승의’로 밝혀야 합니다.
  - severity: medium
    issue: ‘제사장이 그 죄를 위하여 속죄하게 하매’는 통사와 의미 관계가 불분명합니다.
    rationale: 원문은 제사장이 그 사람을 위하여 그의 죄에 관해 속죄를 행하고, 이어 그 사람이 용서를 받는다는 두 절을 연결합니다. 수정안은 이 관계를 자연스럽고 명료하게 나타냅니다.
  - severity: low
    issue: 초안의 종결 표현이 요청된 현대 합쇼체에 맞지 않습니다.
    rationale: ‘태우되… 하되… 하매… 받으리라’는 문체가 혼재되어 있습니다. ‘-할 것입니다’와 ‘-받을 것입니다’로 통일합니다.
