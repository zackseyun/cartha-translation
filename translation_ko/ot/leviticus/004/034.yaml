revisions:
- from: 그러고 나서 제사장은 속죄제의 피에서 얼마를 손가락으로 가져다가 번제단의 뿔들 위에 바르고, 그 피의 모든 것을 제단 밑바닥에 쏟아야 합니다.[a]
  to: 그러고 나서 제사장은 속죄제의 피 일부를 손가락으로 찍어 번제단의 뿔들에 바르고, 그 피를 모두 제단 밑에 쏟아야 합니다.[a]
  rationale: ‘피 일부를 손가락으로 찍어’는 מִדַּם 및 בְּאֶצְבָּעוֹ의 부분성과 도구적 의미를 자연스러운 한국어로 옮깁니다. ‘그 피를 모두’는 כָּל דָּמָהּ의 총체성을 유지하며, ‘제단 밑에’는 יְסוֹד의 기초·밑부분 의미를 과도한 공간적 해석 없이 전달합니다. 각주는 חַטָּאת의 정결 관련 의미를 보존하되 본문의 주 번역을 바꾸지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:53Z'
review_pass:
  verdict: revise
  source_fidelity: 절차의 순서, 피의 부분적 채취, 번제단의 뿔들에 피를 바르는 행위, 그리고 피 전부를 제단의 기초 부분에 쏟는다는 내용은 대체로 충실합니다. 다만 ‘제단 밑바닥’은 히브리어 יְסוֹד(기초, 밑부분)를 ‘제단의 아래쪽 면’처럼 들리게 할 수 있어 수정이 필요합니다.
  naturalness: ‘그 피의 모든 것’은 현대 표준 한국어에서 부자연스럽습니다. ‘그 피를 모두’가 כָּל의 총체성을 자연스럽고 충분히 전달합니다. 또한 ‘피 일부를 손가락으로 찍어’는 제사장의 손가락으로 피를 취한다는 도구적 의미를 자연스럽게 표현합니다.
  terminology: ‘속죄제’와 ‘번제단’, ‘뿔들’은 제의 문맥과 한국어 성서 용례에 잘 맞습니다. 각주 대안은 영어 감사 기록의 ‘purification offering’에 더 직접 대응하도록 ‘정결제’로 다듬는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘제단 밑바닥’
    rationale: יְסוֹד는 제단의 기초 또는 밑부분을 뜻합니다. ‘밑바닥’은 제단의 바닥면 또는 아래쪽을 연상시켜 위치를 부정확하게 만들 수 있습니다. ‘제단 밑에’가 자연스럽고 본문의 공간적 의미를 보존합니다.
  - severity: low
    issue: ‘그 피의 모든 것’
    rationale: 히브리어 ‘그 피 전부’를 직역하려는 표현이지만 한국어로는 어색합니다. ‘그 피를 모두’가 의미 손실 없이 자연스럽습니다.
  - severity: low
    issue: 각주의 ‘정결 예물’
    rationale: חַטָּאת는 여기서 특정 제사를 가리키므로 일반적인 ‘예물’보다 ‘정결제’ 또는 ‘정결을 위한 제사’가 영어 감사 기록 및 제의 문맥에 더 잘 맞습니다.
