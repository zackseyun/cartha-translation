  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
  footnotes:
  - marker: a
    text: Or "purification offering." The Hebrew term can denote the sacrifice offered in relation to sin and ritual purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 제사장은 속죄제의 피에서 얼마를 손가락으로 가져다가 번제단의 뿔들 위에 바르고, 그 피의 모든 것을 제단 밑바닥에 쏟아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정결 예물.” 히브리어 이 용어는 죄를 위한 제사이면서 의례적 정결과 관련된 제사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם הַחַטָּאת
  english_pob_choice: some of the blood of the sin offering
  chosen_korean: 속죄제의 피에서 얼마를
  alternatives_korean:
  - 속죄제의 피 중 얼마를
  - 그 속죄제의 피에서 일부를
  lexicon: HALOT
  rationale: מִן은 이 문맥에서 부분적 의미를 가지므로, 피 전체가 아니라 ‘얼마’를 취한다는 점을 드러내는 것이 자연스럽습니다. חַטָּאת은 제의 문맥에서 제물로서의 뜻이 분명하여 ‘속죄제’로 옮겼습니다.
- source_word: בְּאֶצְבָּעוֹ
  english_pob_choice: with his finger
  chosen_korean: 손가락으로
  alternatives_korean:
  - 그의 손가락으로
  - 손가락을 사용하여
  lexicon: HALOT
  rationale: בְּ는 도구·수단을 나타내므로, 제사장이 손가락을 사용해 바른다는 의미를 간결하게 살렸습니다.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  english_pob_choice: on the horns of the altar of burnt offering
  chosen_korean: 번제단의 뿔들 위에
  alternatives_korean:
  - 번제단의 뿔들에
  - 번제단의 뿔 위에
  lexicon: HALOT
  rationale: קַרְנֹת은 제단의 돌출부인 ‘뿔들’을 뜻하므로 복수형을 살렸습니다. הָעֹלָה는 이 제단을 번제와 관련된 제단으로 특정하므로 ‘번제단’으로 옮겼습니다.
- source_word: וְאֶת כָּל דָּמָהּ יִשְׁפֹּךְ
  english_pob_choice: and he shall pour out all its blood
  chosen_korean: 그 피의 모든 것을 제단 밑바닥에 쏟아야 합니다
  alternatives_korean:
  - 그 피를 모두 제단 밑바닥에 쏟아야 합니다
  - 남은 피를 모두 제단 밑바닥에 쏟아야 합니다
  lexicon: HALOT
  rationale: כָּל דָּמָהּ의 총체성을 살려 ‘모든 것’을 유지했고, 제의적 처리 동작인 שׁפך는 ‘쏟다’로 옮겼습니다. ‘남은’은 본문에 없는 해석을 덧붙이므로 본문 수준에 맞게 피했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 정결 예물
  rationale: 이 절에서는 죄와 정결의 신학적 범주가 겹치지만, 제물의 명칭으로서 가장 널리 통용되고 본문 문맥에도 맞는 ‘속죄제’를 택했습니다. 다만 본문의 제의가 정결 기능도 가진다는 점은 번역을 통해 과도하게 단순화하지 않았습니다.
  doctrine_reference: 레위기 제의법 / 속죄와 정결의 관계
- issue: 제단의 ‘뿔들’ 복수 표기
  chosen_reading: 뿔들
  alternative_readings:
  - 뿔
  - 제단 뿔
  rationale: 히브리어 복수형 קַרְנוֹת를 한국어에서도 드러내어, 실제 제의 구조의 다수성을 보존했습니다.
  doctrine_reference: 성막·제단 제의 묘사
