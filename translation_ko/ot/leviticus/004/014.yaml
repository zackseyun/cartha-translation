  source_fidelity: 첫 번째 חַטָּאת는 ‘죄’로, 두 번째는 제의적 ‘속죄제’로 구별한 것은 히브리어 문맥에 충실합니다. 다만 פַּר בֶּן־בָּקָר를 ‘수송아지, 곧 소 떼의 수컷’이라고 한 것은 같은 대상을 중복·해설하여 한국어가 부자연스럽고, ‘소 떼의 수컷’은 원문의 관용적 축산 표현을 정확히 살리지 못합니다. ‘수송아지 한 마리’가 이 제의 용어를 자연스럽고 충분히 정확하게 옮깁니다.
  naturalness: ‘그리고’는 한국어 절 시작에서 불필요하게 구어적 연결감을 주므로 생략하는 편이 현대 문어체에 자연스럽습니다. ‘죄로 인한 속죄제물’은 원문의 간결한 제의 분류를 장황하게 만들므로 ‘속죄제로’로 정리했습니다. 각주는 두 용례를 설명하므로 첫 번째 해당어 ‘죄’에 직접 붙여 참조 범위를 분명히 했습니다.
  terminology: ‘회중’, ‘회막’, ‘속죄제’는 레위기 제의 문맥에서 통용되며 현대 표준어 성경 문체에도 적합합니다. ‘속죄제’는 חַטָּאת의 제의 명칭을 일관되게 나타내며, 첫 번째 ‘죄’와의 어휘적 연관은 각주에서 설명합니다.
