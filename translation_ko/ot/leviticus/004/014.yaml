id: LEV.4.14
reference: Leviticus 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
  footnotes:
  - marker: a
    text: 'Hebrew חַטָּאת (ḥaṭṭa''t) is used twice in this verse: first meaning ''sin,'' then meaning ''sin offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 범한 죄가 알려지면, 회중은 수송아지, 곧 소 떼의 수컷을 죄로 인한 속죄제물로 바치고 그것을 회막 앞에 가져와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַטָּאת(ḥaṭṭa't)은 이 절에서 두 번 나오며, 첫째는 ‘죄’, 둘째는 ‘속죄제물’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה הַחַטָּאת
  english_pob_choice: the sin ... becomes known
  chosen_korean: 그들이 범한 죄가 알려지면
  alternatives_korean:
  - 그들이 범한 죄가 드러나면
  - 그들이 범한 죄가 밝혀지면
  lexicon: HALOT
  rationale: נודע의 피동·상태적 뉘앙스를 살려, 죄가 인지 가능한 상태가 되었음을 자연스럽게 표현했습니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 집회
  - 공동체
  lexicon: HALOT
  rationale: 성경적 공적-예배적 맥락에서 קהל은 ‘회중’이 가장 직접적이며, ‘교회’처럼 제도화된 뉘앙스를 피할 수 있습니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: a bull, a son of the herd
  chosen_korean: 수송아지, 곧 소 떼의 수컷
  alternatives_korean:
  - 수송아지, 곧 소 떼의 아들
  - 소 떼에서 난 수송아지
  lexicon: HALOT
  rationale: בן בקר의 직역적 관계를 보이되 한국어에서 자연스럽게 읽히도록 ‘수송아지’와 설명구를 병기했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: as a sin offering
  chosen_korean: 죄로 인한 속죄제물로
  alternatives_korean:
  - 속죄제물로
  - 죄제물로
  lexicon: HALOT
  rationale: 두 번째 חטאת는 제의적 제물의 의미이므로 기능을 드러내는 ‘속죄제물’로 옮겼습니다. 다만 죄와 제물의 연결을 분명히 하기 위해 ‘죄로 인한’을 덧붙였습니다.
theological_decisions:
- issue: חטאת의 이중 의미를 한국어에서 어떻게 구분할지
  chosen_reading: 첫 번째는 ‘죄’, 두 번째는 ‘속죄제물’로 구분했습니다.
  alternative_readings:
  - 두 곳 모두 ‘죄’로 통일
  - 두 곳 모두 ‘속죄제물’로 통일
  rationale: 문맥상 첫 번째는 드러난 범죄, 두 번째는 그에 대한 제의적 제물입니다. 같은 히브리어 단어의 의미 전환을 보존해야 본문의 논리가 선명해집니다.
  doctrine_reference: 번역 원칙 §§1, 5
- issue: 제의 동사 הִקְרִיבוּ를 한국어로 어떻게 살릴지
  chosen_reading: ‘바치고’로 옮겨 제의적 헌납성을 드러냈습니다.
  alternative_readings:
  - 드리고
  - 제시하고
  rationale: 이 동사는 단순한 이동보다 제단 앞에 제물을 ‘가져다 바치는’ 제의 행위를 가리키므로, 예배적 맥락을 살리는 표현이 필요합니다.
  doctrine_reference: 제의 언어 일관성
