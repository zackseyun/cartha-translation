id: LEV.4.15
reference: Leviticus 4:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
  footnotes:
  - marker: a
    text: Or, 'and one shall slaughter the bull before the LORD.' The Hebrew shifts from the plural 'elders' to a singular verb here.
    reason: alternative_reading
translation:
  language: ko
  text: 회중의 장로들은 야훼[a] 앞에서 수소의 머리에 그들의 손을 얹고, 그가 야훼 앞에서 그 수소를 잡아 죽여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누군가가 야훼 앞에서 그 수소를 잡아 죽여야 합니다.’ 히브리어는 복수 ‘장로들’ 뒤에 주어를 명시하지 않은 단수 동사를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  english_pob_choice: the elders of the congregation
  chosen_korean: 회중의 장로들
  alternatives_korean:
  - 회중의 노인들
  - 모임의 장로들
  - 공동체의 장로들
  lexicon: HALOT
  rationale: זִקְנֵי는 ‘장로들’이고, הָעֵדָה는 레위기에서 제의적·언약적 집합체를 가리키므로 ‘회중’이 가장 직접적입니다.
- source_word: וְסָמְכוּ אֶת יְדֵיהֶם
  english_pob_choice: shall lay their hands
  chosen_korean: 그 손을 ... 얹고
  alternatives_korean:
  - 그 손을 ... 놓고
  - 그 손을 ... 대고
  - 그 손을 ... 누르고
  lexicon: HALOT
  rationale: סמך는 제의 문맥에서 제물 위에 손을 ‘얹는’ 의례적 행위를 뜻하므로, 한국어에서도 동작을 분명하게 드러내는 ‘얹고’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 제목이 아닌 이름으로 보존하기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 젊은 수소
  - 소
  lexicon: HALOT
  rationale: פָּר는 제의 제물로 드려지는 수소/황소를 가리키며, 문맥상 제물의 성격을 살리는 ‘수소’가 가장 자연스럽습니다.
- source_word: וְשָׁחַט
  english_pob_choice: and the bull shall be slaughtered
  chosen_korean: 잡아 죽여야 합니다
  alternatives_korean:
  - 잡아야 합니다
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: שָׁחַט은 일반적 ‘죽이다’보다 제의적 ‘도살하다’에 가깝지만, 한국어에서 제물 처리의 실제 행위를 분명히 보여 주는 표현으로 ‘잡아 죽이다’를 택했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - the LORD
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 경칭 대체어보다 신명 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְשָׁחַט의 주어를 분명히 하지 않는 문제
  chosen_reading: 주어를 보충하지 않고 수동적 결과를 한국어로 자연스럽게 표현함
  alternative_readings:
  - 그가 잡아 죽여야 합니다
  - 누군가가 잡아 죽여야 합니다
  rationale: 히브리어는 장로들 다음에 단수 동사를 사용해 주어의 전환을 남겨 두므로, 한국어에서도 행위 주체를 특정하지 않고 제의 절차만 드러내는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
