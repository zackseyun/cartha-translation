id: LEV.4.2
reference: Leviticus 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites'; Hebrew literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by mistake' or 'in error'; the Hebrew refers to sin committed inadvertently rather than defiantly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. 어떤 사람이 야훼의 모든 계명 가운데 해서는 안 되는 일들에 대하여 부지중에 죄를 범하고 그 가운데 하나를 행하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부지중에’는 고의가 아니라는 뜻이며, ‘실수로’ 또는 ‘알지 못하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르십시오
  alternatives_korean:
  - 말하십시오
  - 말하라고 하십시오
  lexicon: HALOT
  rationale: 모세에게 주어지는 직접 명령을 한국어 법문체로 자연스럽게 옮기기 위해 ‘말하여 이르십시오’를 선택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성을 살리되, 한국어 성경에서 널리 쓰이는 ‘이스라엘 자손’을 사용해 의미와 관용을 함께 반영했습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: a person
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 한 사람
  - 한 영혼
  lexicon: HALOT
  rationale: 법률 문맥에서 נֶפֶשׁ을 개인을 가리키는 말로 보아, 실체를 흐리지 않는 ‘어떤 사람’으로 옮겼습니다.
- source_word: בִשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 실수로
  - 알지 못하고
  - 의도치 않게
  lexicon: HALOT
  rationale: 고의가 아닌 범죄라는 법적 대비를 살리기 위해 ‘부지중에’를 사용했습니다. 이는 단순한 실수보다 무지·비고의성을 함께 담을 수 있습니다.
- source_word: מִצְוֺת יְהוָה
  english_pob_choice: the commandments of Yahweh
  chosen_korean: 야훼의 모든 계명
  alternatives_korean:
  - 야훼의 계명들
  - 주님의 계명
  lexicon: HALOT
  rationale: 신명기·제의 문맥의 언약 이름을 보존하기 위해 ‘야훼’를 사용했고, מִכֹּל의 포괄성을 살려 ‘모든 계명’으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  english_pob_choice: concerning things that should not be done
  chosen_korean: 해서는 안 되는 일들
  alternatives_korean:
  - 행해서는 안 되는 것들
  - 하지 말아야 할 일들
  lexicon: HALOT
  rationale: 명령의 금지 성격을 현대 한국어로 자연스럽게 드러내기 위해 ‘해서는 안 되는 일들’로 정리했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 야훼의 언약명이 직접 나오므로, 전통적 대체어 ‘주님’보다 원문 대응어 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
