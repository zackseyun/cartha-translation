base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites'; Hebrew literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by mistake' or 'in error'; the Hebrew refers to sin committed inadvertently rather than defiantly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[a]에게 이렇게 말하십시오. 어떤 사람이 야훼의 모든 계명, 곧 해서는 안 되는 것들 가운데 하나에 대하여 부지중에[b] 죄를 범하여 그 가운데 하나를 행하면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부지중에’는 고의가 아니라는 뜻이며, ‘실수로’ 또는 ‘알지 못하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
