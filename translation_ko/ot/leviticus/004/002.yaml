- source_word: בִשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 실수로
  - 알지 못하고
  - 의도치 않게
  lexicon: HALOT
  rationale: 고의가 아닌 범죄라는 법적 대비를 살리기 위해 ‘부지중에’를 사용했습니다. 이는 단순한 실수보다 무지·비고의성을 함께 담을 수 있습니다.
- source_word: מִצְוֺת יְהוָה
  english_pob_choice: the commandments of Yahweh
  chosen_korean: 야훼의 모든 계명
  alternatives_korean:
  - 야훼의 계명들
  - 주님의 계명
  lexicon: HALOT
  rationale: 신명기·제의 문맥의 언약 이름을 보존하기 위해 ‘야훼’를 사용했고, מִכֹּל의 포괄성을 살려 ‘모든 계명’으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  english_pob_choice: concerning things that should not be done
  chosen_korean: 해서는 안 되는 일들
  alternatives_korean:
  - 행해서는 안 되는 것들
  - 하지 말아야 할 일들
  lexicon: HALOT
  rationale: 명령의 금지 성격을 현대 한국어로 자연스럽게 드러내기 위해 ‘해서는 안 되는 일들’로 정리했습니다.
