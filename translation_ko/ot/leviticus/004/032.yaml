    rationale: לְחַטָּאת는 제물의 용도/제사 범주를 나타내므로 ‘속죄제물로’라고 직접 표현하면 한국어 문장 구조가 명료해집니다. 히브리어의 소유 접미사는 한국어에서 문맥상 자연스럽게 생략할 수 있습니다.
  - severity: low
