  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
  footnotes:
  - marker: a
    text: Or 'purification offering.' The Hebrew term חַטָּאת can denote the sacrifice that deals with sin and ritual impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그가 속죄제[a]를 위한 자기의 제물로 어린 양을 드리려거든, 흠 없는 암컷을 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제.’ 히브리어 חַטָּאת은 죄를 다루는 제사와 의례적 부정을 정결하게 하는 제사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문의 연결을 살리면서 한국어 문장 흐름을 자연스럽게 유지하기 위해 ‘그리고 만일’을 택했습니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: a lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양
  - 새끼 양
  lexicon: HALOT
  rationale: 제사 규정의 희생 동물로서 문맥상 자연스럽고 구체적인 표현이어서 ‘어린 양’으로 옮겼습니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 자기의 제물
  alternatives_korean:
  - 자기의 헌물
  - 자기의 예물
  lexicon: HALOT
  rationale: קרבן은 하나님께 가까이 드리는 제물을 가리키므로, 관례적이지만 너무 교회식으로 굳지 않은 ‘제물’을 사용했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 속죄제물을 위한
  - 죄를 위한 제물
  lexicon: HALOT
  rationale: 히브리어 חַטָּאת은 여기서 제사 명칭으로 쓰이므로, 한국어 성경에서 널리 쓰는 ‘속죄제’를 본문에 두고 각주로 대안 의미를 밝혔습니다.
- source_word: נְקֵבָה
  english_pob_choice: a female
  chosen_korean: 암컷
  alternatives_korean:
  - 암놈
  - 암컷 짐승
  lexicon: HALOT
  rationale: 제물의 성별을 분명히 하는 표현이므로, 제의적·자연스러운 한국어인 ‘암컷’으로 옮겼습니다.
- source_word: תְמִימָה
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 흠이 없는
  - 완전한
  lexicon: HALOT
  rationale: 제사 동물의 결함 없음이라는 뜻을 가장 간결하고 표준적으로 전달하는 표현이 ‘흠 없는’입니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 본문에는 ‘속죄제’로 두고, 각주에서 ‘정결제/정화제’ 가능성을 열어 둡니다.
  alternative_readings:
  - 정결제
  - 정화제
  rationale: 레위기 제사 문맥에서는 전통적 명칭 ‘속죄제’가 가장 식별 가능하지만, 히브리어가 죄와 부정결의 제거를 함께 가리킬 수 있으므로 대안 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
