  source_fidelity: 히브리어는 ‘그가 속죄제물로 어린 양을 자기의 제물로 가져오면/드리려거든, 흠 없는 암컷을 가져와야 한다’는 조건과 요구를 담고 있습니다. 초안의 뜻은 대체로 맞지만, ‘속죄제를 위한 자기의 제물로’는 제사 명칭과 제물의 관계를 다소 무겁고 부자연스럽게 겹쳐 표현합니다.
  naturalness: ‘그리고 만일’은 절 시작에서 다소 번역투입니다. ‘만일’로 조건을 자연스럽게 시작하고, ‘속죄제물로 어린 양을 드리려거든’으로 정리하면 현대 표준 한국어 합쇼체로 더 매끄럽습니다.
  terminology: ‘속죄제’, ‘어린 양’, ‘흠 없는’, ‘암컷’은 제의 문맥에서 적절합니다. חַטָּאת의 대안적 ‘정결제’ 이해는 각주로 유지하는 것이 타당합니다.
  issues:
