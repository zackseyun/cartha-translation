    rationale: וְאִם의 연결 기능은 문맥상 ‘만일’만으로도 충분히 유지되며, 더 자연스러운 법규 문체가 됩니다.
  revised_text: 만일 그가 속죄제물로 어린 양을 드리려거든, 흠 없는 암컷을 드려야 합니다.
