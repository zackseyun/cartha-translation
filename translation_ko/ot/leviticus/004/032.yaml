translation:
  language: ko
  text: 그리고 만일 그가 속죄제[a]를 위한 자기의 제물로 어린 양을 드리려거든, 흠 없는 암컷을 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제.’ 히브리어 חַטָּאת은 죄를 다루는 제사와 의례적 부정을 정결하게 하는 제사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문의 연결을 살리면서 한국어 문장 흐름을 자연스럽게 유지하기 위해 ‘그리고 만일’을 택했습니다.
- source_word: כֶּבֶשׂ
  english_pob_choice: a lamb
  chosen_korean: 어린 양
