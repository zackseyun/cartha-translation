source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
  footnotes:
  - marker: a
    text: Or 'prince' or 'ruler'; Hebrew נָשִׂיא denotes a recognized leader or chief.
    reason: lexical_alternative
  - marker: b
    text: Or 'in error' or 'by mistake'; the Hebrew refers to an unintentional offense.
    reason: lexical_alternative
translation:
  language: ko
  text: 지도자가 죄를 짓고, 야훼 그의 하나님이 하지 말라고 명령하신 모든 것 가운데 하나를 부지중에 행하여 죄책을 지게 되면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지도자’는 히브리어 נָשִׂיא의 넓은 의미를 따른 번역입니다. 문맥에 따라 ‘왕자’, ‘통치자’, ‘족장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부지중에’는 히브리어 בִּשְׁגָגָה의 의미를 따른 번역입니다. ‘실수로’, ‘의도치 않게’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 통치자
  - 왕자
  lexicon: HALOT
  rationale: נָשִׂיא는 문맥상 제의법 안에서의 인정된 지도자를 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘지도자’로 옮겼습니다.
- source_word: יֶחֱטָא
  english_pob_choice: sins
  chosen_korean: 죄를 짓고
  alternatives_korean:
  - 죄를 범하고
  - 범죄하고
  lexicon: HALOT
  rationale: 히브리어 חטא의 기본적 의미를 직접 살려, 단순하고 분명한 ‘죄를 짓고’로 옮겼습니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 부지중에
  alternatives_korean:
  - 무심코
  - 실수로
  - 의도치 않게
  lexicon: HALOT
  rationale: 본문의 שְׁגָגָה는 고의가 아닌 범과를 뜻하므로, 법적·제의적 맥락을 살리는 ‘부지중에’를 선택했습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: and becomes guilty
  chosen_korean: 죄책을 지게 되면
  alternatives_korean:
  - 유죄가 되면
  - 죄가 있게 되면
  - 죄책을 지고
  lexicon: HALOT
  rationale: אָשֵׁם은 단순 감정이 아니라 죄책의 상태에 들어감을 나타내므로, 결과 상태를 드러내는 ‘죄책을 지게 되면’으로 옮겼습니다.
