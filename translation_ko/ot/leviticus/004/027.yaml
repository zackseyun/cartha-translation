id: LEV.4.27
reference: Leviticus 4:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
  footnotes:
  - marker: a
    text: Or 'from the people of the land.' Here the phrase refers to an ordinary member of the community, in contrast to a priest or leader in the surrounding laws.
    reason: lexical_alternative
  - marker: b
    text: Or 'and incurs guilt' / 'and is guilty.' The Hebrew verb can express entering a state of guilt or bearing guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 일반 백성 가운데서[a] 한 사람이 의도하지 않고 야훼께서 하지 말라고 명하신 것들 가운데 하나를 행하여 죄책을 지게 되면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 백성 가운데서’. 여기서는 주변 법들에서 제사장이나 지도자와 대비되는 일반 공동체 구성원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유죄가 되면’ 또는 ‘죄를 지으면’. 히브리어 동사는 죄책이 있는 상태가 되거나 죄책을 지는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  english_pob_choice: one person
  chosen_korean: 한 사람이
  alternatives_korean:
  - 한 영혼이
  - 누군가가
  lexicon: HALOT
  rationale: 법률 문맥에서 נֶפֶשׁ는 개별 인간을 가리키므로, 현대 한국어에서는 ‘한 사람이’가 가장 자연스럽고 원문의 단수 주체를 분명히 드러냅니다.
- source_word: בִּשְׁגָגָה
  english_pob_choice: unintentionally
  chosen_korean: 실수로
  alternatives_korean:
  - 부지중에
  - 의도하지 않게
  lexicon: HALOT
  rationale: 제의·법률 문맥의 ‘부주의/비고의성’을 살리면서도, 현대 독자가 바로 이해할 수 있는 표현으로 옮겼습니다.
- source_word: מֵעַם הָאָרֶץ
  english_pob_choice: from the common people
  chosen_korean: 평민 가운데
  alternatives_korean:
  - 그 땅의 백성 가운데
  - 일반 백성 가운데
  lexicon: HALOT
  rationale: 이 표현은 제사장이나 지도자와 대비되는 일반 민중의 사회적 범주를 가리키므로, 오해를 줄이기 위해 ‘평민 가운데’로 옮겼습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: and becomes guilty
  chosen_korean: 죄책을 지게 되면
  alternatives_korean:
  - 유죄가 되면
  - 죄를 지으면
  lexicon: HALOT
  rationale: אָשֵׁם은 단순한 감정적 죄책감보다 법적 책임 상태의 진입을 뜻할 수 있으므로, ‘죄책을 지게 되면’으로 책임의 발생을 드러냈습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기준에 따라 신명 사전적 고유명을 제목화하지 않고 직접 음역해, 이스라엘에게 계시된 하나님의 이름을 보존했습니다.
  doctrine_reference: Translation philosophy §1, divine-name convention
- issue: ‘실수로’의 윤리적 뉘앙스
  chosen_reading: ‘실수로’는 고의 범죄를 배제하는 제의적 비고의성을 나타내도록 유지했습니다.
  alternative_readings:
  - 우연히
  - 무심코
  rationale: 문맥상 단순 사고가 아니라 율법상 비의도적 위반을 가리키므로, 죄의 고의성과 구별되는 법적 의미를 보존했습니다.
  doctrine_reference: Leviticus sacrificial-law context
