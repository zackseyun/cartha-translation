  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
  footnotes:
  - marker: a
    text: Or 'and for a scaly eruption,' traditionally 'and for scall.' The Hebrew term refers to a specific skin condition, especially of the scalp or beard, but its exact medical equivalent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 나병성 피부 질환과 딱지진 환부에 관한 모든 경우를 위한 율법입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비늘진 발진’으로도 옮길 수 있습니다. 전통적으로는 ‘scall’이라 하였으나, 히브리어는 특히 머리나 수염 부위의 특정 피부 병변을 가리키며 정확한 의학적 대응어는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  english_pob_choice: This is the law
  chosen_korean: 이것은 … 율법입니다
  alternatives_korean:
  - 이것은 … 법입니다
  - 이것은 … 규례입니다
  lexicon: HALOT
  rationale: 결론적 공식문이므로 한국어에서는 계사와 서술어를 자연스럽게 살려 ‘이것은 … 율법입니다’로 옮겼습니다. ‘율법’은 כאן תּוֹרָה의 법적·규정적 성격을 반영합니다.
- source_word: לְכָל נֶגַע
  english_pob_choice: for every case
  chosen_korean: 모든 경우를 위한
  alternatives_korean:
  - 모든 사례에 대한
  - 모든 환부에 대한
  lexicon: HALOT
  rationale: נֶגַע는 여기서 개별 병변 자체보다 판정 대상이 되는 ‘경우’의 의미가 강하므로, 절차적 의미를 살려 ‘모든 경우’를 택했습니다.
- source_word: הַצָּרַעַת
  english_pob_choice: leprous disease
  chosen_korean: 나병성 피부 질환
  alternatives_korean:
  - 문둥병
  - 피부병
  - 나병
  lexicon: HALOT
  rationale: 전통적 ‘나병’은 현대 질병명과 어긋날 수 있으므로, 레위기 문맥의 부정한 피부 질환 범주를 드러내는 ‘나병성 피부 질환’으로 옮겼습니다.
- source_word: וְלַנָּתֶק
  english_pob_choice: for an itch
  chosen_korean: 딱지진 환부
  alternatives_korean:
  - 가려움증
  - 비듬진 발진
  - 두피의 비늘진 병변
  lexicon: HALOT
  rationale: נָתֶק은 머리나 수염 부위의 특정 피부 병변을 가리키므로, 영어 본문의 주석이 인정한 불확실성을 반영해 지나치게 특정하지 않는 ‘딱지진 환부’로 옮겼습니다.
theological_decisions:
- issue: 부정한 피부 질환 범주의 번역어 선택
  chosen_reading: ‘나병성 피부 질환’과 ‘딱지진 환부’로 번역하여, 레위기 13–14장의 의례적·진단적 범주임을 드러냈습니다.
  alternative_readings:
  - 전통적 ‘나병’으로 단순화
  - 현대 의학 병명으로 환원
  rationale: 이 본문은 의학적 진단이 아니라 정결/부정 판정 규례의 요약이므로, 본문의 제의적 성격을 유지하는 번역이 필요합니다.
  doctrine_reference: 레위기 13–14장 정결 규례
