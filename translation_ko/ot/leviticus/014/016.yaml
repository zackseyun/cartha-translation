  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before Yahweh.'' The main text follows the project''s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 제사장은 오른손 손가락을 왼쪽 손바닥에 있는 기름에 찍고, 그 손가락으로 그 기름을 야훼 앞에서 일곱 번 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “야훼 앞에서”라고 되어 있습니다.
    reason: ot_citation
lexical_decisions:
- source_word: טָבַל
  english_pob_choice: dip
  chosen_korean: 찍고
  alternatives_korean:
  - 담그고
  - 넣고
  lexicon: HALOT
  rationale: 손가락 하나를 기름에 넣는 제의 동작이므로, 한국어에서는 가장 자연스럽고 짧은 ‘찍고’가 원문의 침지 행위를 잘 드러냅니다.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  english_pob_choice: his right finger
  chosen_korean: 오른손 손가락
  alternatives_korean:
  - 그의 오른쪽 손가락
  - 오른손의 손가락
  lexicon: HALOT
  rationale: 히브리어의 신체 부위를 한국어로 명확히 풀어, 제의적 동작의 구체성을 살리면서도 문장을 어색하지 않게 했습니다.
- source_word: כַּפּוֹ הַשְּׂמָאלִית
  english_pob_choice: that is on his left palm
  chosen_korean: 왼쪽 손바닥에 있는
  alternatives_korean:
  - 왼손바닥 위에 있는
  - 왼손의 손바닥에 있는
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥’을 뜻하므로 전체 손보다 ‘손바닥’으로 좁혀 번역했고, ‘에 있는’으로 위치 관계를 자연스럽게 표현했습니다.
- source_word: הִזָּה
  english_pob_choice: sprinkle
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 뿌려야 합니다
  - 뿌려야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 הִזָּה는 정해진 방식의 살포를 뜻하므로, 한국어 제의어로 가장 분명한 ‘뿌리다’를 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 야훼의 계약명 יהוה를 직접 쓰므로, 프로젝트 기본값에 따라 ‘야훼’를 본문에 유지해 성호를 가리지 않았습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
