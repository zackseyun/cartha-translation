    rationale: 본문 자체가 כבר ‘야훼 앞에서’라고 정확히 번역하므로, ‘히브리어는 “야훼 앞에서”라고 되어 있습니다’라는 각주는 중복이며 ot_citation이라는 사유에도 해당하지 않습니다.
