  source_fidelity: 히브리어의 히필형 יַקְצִיעַ는 제사장이 직접 긁기보다 긁어 내게 하는 사역을 나타내므로 ‘긁어 내게 해야 합니다’가 적절합니다. מִבַּיִת סָבִיב은 집 내부의 사방/둘레를 가리키며, 먼지의 처분 장소는 ‘성 밖의 부정한 곳’입니다.
