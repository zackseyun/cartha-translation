  terminology: טָמֵא는 레위기의 의례적 정결 범주이므로 ‘부정한’이 적절합니다. עָפָר는 문자적으로 먼지/흙가루이므로 본문에서는 ‘먼지’를 유지하고, 각주에서 벽에서 긁어 낸 물질이라는 문맥적 지시 대상을 설명합니다.
