  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
  footnotes:
  - marker: a
    text: Or simply, 'the dust.' The Hebrew term is literally 'dust,' here referring to the material scraped from the house walls.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집 안의 안쪽을 사방으로 긁어내게 해야 합니다. 그리고 그들이 긁어낸 먼지를 성 밖으로, 곧 부정한 곳으로 쏟아내야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘먼지’를 뜻하지만, 여기서는 집 벽에서 긁어낸 재료를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַקְצִעַ
  english_pob_choice: shall have ... scraped
  chosen_korean: 긁어내게 해야 합니다
  alternatives_korean:
  - 긁게 해야 합니다
  - 긁어내야 합니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 집주인/관리자가 작업을 시키는 뉘앙스를 자연스럽게 반영했습니다.
- source_word: מִבַּיִת סָבִיב
