    reason: lexical_alternative
  - marker: b
    text: Hebrew 'living water,' that is, fresh or flowing water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 백향목 나무와 우슬초와 붉은 실[a]과 살아 있는 새를 가져다가, 그것들을 잡은 새의 피와 흐르는 물[b]에 찍고, 그 집에 일곱 번 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘벌레의 붉은 것’이며, 전통적으로 붉게 물들인 실 또는 실꾸러미를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘살아 있는 물’, 곧 신선한 물 또는 흐르는 물입니다.
