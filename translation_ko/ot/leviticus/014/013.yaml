id: LEV.14.13
reference: Leviticus 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
  footnotes:
  - marker: a
    text: Or 'purification offering' for 'sin offering' (Hebrew חַטָּאת), emphasizing the rite's cleansing function in priestly law.
    reason: lexical_alternative
  - marker: b
    text: Or 'reparation offering' for 'guilt offering' (Hebrew אָשָׁם), highlighting the offering's restitution aspect.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 속죄제와 번제[a]를 잡는 곳, 곧 거룩한 곳에서 어린 양을 잡아야 합니다. 속건제도 속죄제와 같으므로 제사장의 몫입니다[b]. 그것은 지극히 거룩합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄제’를 ‘정결제’로 옮길 수 있는데, 히브리어 חַטָּאת의 정결 기능을 강조한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속건제’를 ‘배상제’로 옮길 수 있는데, 히브리어 אָשָׁם의 배상·보상 측면을 강조한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  english_pob_choice: And he shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 죽여야 합니다
  - 도살해야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 שָׁחַט은 단순한 살해보다 제의적 도살을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘잡다’를 택했습니다.
- source_word: הַכֶּבֶשׂ
  english_pob_choice: the lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양
  - 수양
  lexicon: HALOT
  rationale: 희생 제물의 맥락에서 כֶּבֶשׂ는 ‘어린 양’이 가장 자연스럽고, 제의 동물을 분명히 드러냅니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 유죄 제물
  - 배상 제물
  lexicon: HALOT
  rationale: 한국 교회·학술 번역에서 אָשָׁם의 관용적 대응은 ‘속건제’이므로, 제사 종류를 일관되게 보이게 했습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: it is most holy
  chosen_korean: 지극히 거룩합니다
  alternatives_korean:
  - 가장 거룩합니다
  - 지성소급입니다
  lexicon: HALOT
  rationale: 히브리어의 최상급 관용구를 한국어의 자연스러운 최상 표현으로 옮겼습니다.
theological_decisions:
- issue: חַטָּאת와 אָשָׁם의 제의적 분류를 어떻게 보일지
  chosen_reading: 본문의 제사 명칭을 표준적인 한국어 제의 용어인 ‘속죄제’와 ‘속건제’로 유지했습니다.
  alternative_readings:
  - ‘정결제’/‘배상제’로 설명적으로 옮김
  - 주석에서만 의미를 풀어 줌
  rationale: 이 절은 제사장법의 문맥에서 기존 제의 범주를 전제하므로, 독자가 제도적 구분을 바로 알아보도록 표준 용어를 유지하는 편이 가장 투명합니다.
  doctrine_reference: Translation philosophy §3, §5
