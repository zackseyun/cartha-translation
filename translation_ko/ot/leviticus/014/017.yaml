  text: 그 손바닥에 남은 기름 중 일부를 정결케 한 자의 오른쪽 귀 이랑과 오른쪽 손 엄지와 오른쪽 발 엄지 위에, 곧 속건 제물의 피 위에 제사장이 바를지니라.
  philosophy: optimal-equivalence
