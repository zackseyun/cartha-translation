source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
  footnotes:
  - marker: a
    text: Or, 'the lamb of the guilt offering'; traditionally, 'the trespass-offering lamb.'
    reason: lexical_alternative
  - marker: b
    text: A 'log' was a small unit of liquid measure used in Israel's ritual system.
    reason: cultural_note
translation:
  language: ko
  text: 그 제사장은 속건제 어린양과 기름 한 로그를 가져와, 여호와 앞에서 그것들을 흔들어 요제로 드려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속건제 어린양’이라고도 옮길 수 있습니다. 전통적으로는 ‘허물제 어린양’이라고 했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘로그’는 이스라엘 제의 체계에서 사용된 작은 액량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֶּבֶשׂ הָאָשָׁם
  english_pob_choice: the guilt-offering lamb
  chosen_korean: 속건제 어린양
  alternatives_korean:
  - 속건제 양
  - 속죄제 어린양
  - 허물제 어린양
  lexicon: HALOT
  rationale: אָשָׁם은 제의 문맥에서 전통적으로 ‘속건제’로 옮기는 것이 가장 직접적이며, כֶּבֶשׂ는 제물의 어린 양을 가리키므로 ‘어린양’으로 구체화했습니다. 영어 POB의 ‘guilt-offering’ 취지를 한국어 제의 용어로 반영했습니다.
- source_word: לֹג הַשָּׁמֶן
  english_pob_choice: the log of oil
  chosen_korean: 기름 한 로그
  alternatives_korean:
  - 기름 한 측량
  - 기름 한 용량
  - 기름 한 로그의 분량
  lexicon: HALOT
  rationale: לֹג는 이스라엘 제의 체계에서 쓰인 특정 액량 단위이므로, 영어 POB처럼 단위를 보존해 ‘로그’로 옮겼습니다. 수량감은 ‘한’으로 자연스럽게 드러냈습니다.
- source_word: וְהֵנִיף ... תְּנוּפָה
  english_pob_choice: shall wave ... as a wave offering
  chosen_korean: 흔들어 요제로 드려야 합니다
  alternatives_korean:
  - 들어 올려 요제로 드려야 합니다
  - 흔들어 제물로 바쳐야 합니다
  - 흔들어 흔듦제물로 드려야 합니다
  lexicon: HALOT
  rationale: הֵנִיף와 תְּנוּפָה는 제의적 ‘흔듦/흔듦제’의 한 동작과 범주를 이루므로, 한국어 성경에서 널리 쓰이는 ‘요제’를 사용하되 동작은 ‘흔들어’로 풀어 둘 다 보존했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞에서
  alternatives_korean:
  - 야훼 앞에서
  - 주님 앞에서
  lexicon: HALOT
  rationale: 본문의 לִפְנֵי יְהוָה는 제의 행위를 하나님의 임재 앞에 두는 정형구이므로, 영어 POB의 ‘Yahweh’에 맞춰 한국어 전통 표기를 그대로 반영했습니다.
theological_decisions:
- issue: 제의 용어 אָשָׁם의 한국어 대응
  chosen_reading: 속건제
  alternative_readings:
  - 속죄제
  - 허물제
  - 배상제
  rationale: 본문은 속건제 절차 안에서 어린양과 기름을 다루는 조항이므로, אָשָׁם을 ‘속건제’로 두는 것이 문맥과 제의 분류를 가장 분명하게 드러냅니다.
  doctrine_reference: Leviticus sacrificial terminology consistency
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 본문은 영어 POB가 ‘Yahweh’를 쓰고 있으나, 한국어 초안에서는 제의 문맥의 가독성과 기존 한국어 성경 관행을 고려해 ‘여호와’를 채택했습니다. 다만 이는 번역 관행상의 선택이며 본문의 신학적 기능인 언약 하나님의 임재를 약화시키지 않습니다.
  doctrine_reference: POB Korean naming convention decision
