  text: to instruct about the day of uncleanness and the day of cleanness[a]. This is the law of the skin disease.
  footnotes:
  - marker: a
    text: Or, traditionally, 'leprosy.' The Hebrew term refers more broadly to a range of skin-related impurity conditions, not necessarily modern leprosy.
    reason: lexical_alternative
translation:
  language: ko
  text: 부정한 날과 정결한 날에 관해 가르치기 위한 것입니다. 이것이 피부 질환에 관한 율법입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘나병’으로도 옮기지만, 히브리어 용어는 현대 의학의 나병보다 더 넓은 피부 관련 부정 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הוֹרֹת
  english_pob_choice: to instruct about
  chosen_korean: 가르치기 위한 것입니다
  alternatives_korean:
  - 가르치려고 하는 것입니다
  - 지시하기 위한 것입니다
  - 가르쳐 주기 위한 것입니다
  lexicon: HALOT
  rationale: 히필 부정사 לְהוֹרֹת는 앞선 규례의 목적을 나타내므로, 한국어에서는 법규의 기능을 살려 '가르치기 위한'으로 옮겼습니다.
- source_word: בְּ/י֥וֹם הַ/טָּמֵ֖א וּ/בְ/י֣וֹם הַ/טָּהֹ֑ר
  english_pob_choice: about the day of uncleanness and the day of cleanness
  chosen_korean: 부정한 날과 정결한 날에
  alternatives_korean:
  - 부정의 날과 정결의 날에
  - 부정한 날과 깨끗한 날에
  - 부정함의 날과 정결함의 날에
  lexicon: HALOT
  rationale: בְּ + '날'은 여기서 시간표현이라기보다 정결 규례의 적용 범위를 가리키므로, 자연스러운 한국어로 '...날에 관해' 구조를 사용했습니다. טָמֵא/טָהֹר는 성경의 정결 용어를 살려 '부정한/정결한'으로 대응했습니다.
- source_word: תּוֹרַת
  english_pob_choice: the law of
  chosen_korean: 율법
  alternatives_korean:
  - 규례
  - 교훈
  - 법
  lexicon: HALOT
  rationale: 제사장 문맥의 תּוֹרָה는 단순한 '교훈'보다 규범적 권위를 가진 율법/규례를 뜻하므로, POB의 법률적 어조를 살려 '율법'으로 옮겼습니다.
- source_word: הַ/צָּרָעַת
  english_pob_choice: the skin disease
  chosen_korean: 피부질환
  alternatives_korean:
  - 나병
  - 문드러진 병
  - 피부병
  lexicon: HALOT
  rationale: צָרַעַת는 현대 의학의 나병과 일치하지 않으므로, 오해를 피하면서도 포괄성을 유지하는 '피부질환'을 택했습니다.
theological_decisions:
- issue: צָרָעַת의 번역이 전통적 '나병'인지, 더 넓은 정결 질환 범주인지
  chosen_reading: 피부질환
  alternative_readings:
  - 나병
  - 부정한 피부질환
  rationale: 레위기 13–14장의 צָרָעַת는 현대 질병명보다 정결/부정 판정과 연결된 범주이므로, 의학적 오해를 피하는 번역을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 정결법의 범주적 용례
