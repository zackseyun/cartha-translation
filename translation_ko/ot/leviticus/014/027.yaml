  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: ko
  text: 그러면 제사장은 오른손의 손가락으로 자기 왼쪽 손바닥에 있는 기름의 일부를 야훼 앞에서 일곱 번 뿌려야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  english_pob_choice: Then ... shall sprinkle
  chosen_korean: 일곱 번 뿌려야 합니다
  alternatives_korean:
  - 뿌려야 합니다
  - 뿌립니다
  lexicon: HALOT
  rationale: 의례 절차의 연속성을 살리기 위해 연결어는 앞선 문맥에 기대는 방식으로 처리하고, נזה의 제의적 용법은 한국어에서 자연스러운 ‘뿌리다’로 옮겼습니다.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  english_pob_choice: with his right finger
  chosen_korean: 오른손의 손가락으로
  alternatives_korean:
  - 오른손의 손가락으로
  - 오른손 엄지손가락으로
  lexicon: HALOT
  rationale: אֶצְבַּע는 ‘손가락’이며, 오른쪽임을 분명히 하면서도 한국어 관용상 자연스럽게 ‘오른손의 손가락으로’라고 옮겼습니다.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  english_pob_choice: some of the oil that is on his left palm
  chosen_korean: 자기 왼쪽 손바닥에 있는 기름의 일부
  alternatives_korean:
  - 자기 왼쪽 손바닥에 있는 기름 중 일부
  - 왼쪽 손바닥 위에 있는 기름의 일부
  lexicon: HALOT
  rationale: מִן은 부분을 가리키므로 ‘기름의 일부’로 살렸고, כַּף는 손 전체보다 ‘손바닥’이 더 정확합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 신명 이름이므로 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제의 문맥에서의 절차적 명령형 어조
  chosen_reading: 제사장에게 주어지는 규정형 명령을 한국어 법규 문체로 옮기되, 직접 명령이 아니라 절차 지시처럼 읽히도록 처리했습니다.
  alternative_readings:
  - 직설적 미래형으로 옮김
  - 더 강한 명령형으로 옮김
  rationale: 레위기의 제의 규례는 서술보다 규정의 성격이 강하므로, 합쇼체의 규범적 어조가 원문의 기능을 가장 잘 반영합니다.
  doctrine_reference: Leviticus cultic law register
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 영어 POB의 audited choice가 Yahweh이며, 본문도 직접 이름을 사용하므로 이를 한국어 본문에 그대로 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
