source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
  footnotes:
  - marker: a
    text: Or 'other mortar' or, more literally, 'other dust/earth.' The Hebrew refers to the material used to recoat the house after the infected stones are replaced.
    reason: lexical_alternative
  - marker: b
    text: Literally 'under the stones,' an idiom here meaning 'in place of the stones' or 'to replace the stones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 다른 돌들을 가져다가 돌들[b][a] 대신에 들여놓고, 또 다른 진흙을 가져다가 집에 바릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 모르타르’, 더 문자적으로는 ‘다른 흙/땅’입니다. 히브리어는 오염된 돌들을 바꾼 뒤 집을 다시 바르는 데 쓰는 재료를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘돌들 아래에’이지만, 여기서는 ‘돌들 대신에/돌들을 교체하여’라는 관용적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  english_pob_choice: Then they shall take
  chosen_korean: 그러면 그들은 가져다가
  alternatives_korean:
  - 그리고 그들은 가져다가
  - 그들은 가져다가
  lexicon: HALOT
  rationale: 절차적 율법 문맥의 연속 동작을 한국어에서 자연스럽게 살리되, 명령형이 아니라 지시적 서술로 옮겼습니다.
- source_word: אֲבָנִים אֲחֵרוֹת
  english_pob_choice: other stones
  chosen_korean: 다른 돌들
  alternatives_korean:
  - 새 돌들
  - 별도의 돌들
  lexicon: HALOT
  rationale: 교체를 위한 돌이라는 의미를 그대로 살려 ‘다른 돌들’로 옮겼습니다.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  english_pob_choice: and bring them in place of the stones
  chosen_korean: 돌들 대신에 들여놓고
  alternatives_korean:
  - 돌들 아래에 들여놓고
  - 돌들을 대체하여 들여놓고
  lexicon: HALOT
  rationale: תַּחַת가 여기서는 위치가 아니라 대체를 뜻하므로, 영어 주석과 맞게 ‘대신에’로 옮겼습니다.
- source_word: וְעָפָר אַחֵר
  english_pob_choice: other mortar
  chosen_korean: 또 다른 진흙
  alternatives_korean:
  - 또 다른 모르타르
  - 또 다른 재료
  lexicon: HALOT
  rationale: 문맥상 벽을 다시 바르는 흙/재료를 가리키므로, 한국어에서 기능적으로 이해되는 ‘진흙’으로 옮겼습니다. 영어 POB의 ‘mortar’는 용례상 주석적 선택이므로 직역보다 자연성을 우선했습니다.
theological_decisions:
- issue: סתם 작업 지시문의 문체와 행위 주체
  chosen_reading: 3인칭 복수/단수의 전환을 그대로 반영해, 절차 지시 문장으로 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - 모두를 ‘그들은’으로 평준화
  - 무인칭으로 ‘사람은’으로 처리
  rationale: 히브리어는 복수 동작 뒤에 단수 동작이 이어지므로, 이를 평준화하지 않고 문장 흐름만 한국어에 맞게 정리했습니다.
  doctrine_reference: 본문 문법 관찰
