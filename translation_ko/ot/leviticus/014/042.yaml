  naturalness: ‘그런 다음’은 절차 규정의 순차성을 자연스럽게 나타냅니다. ‘그 돌들 대신에 놓고’는 현대 표준어에서 자연스럽고, ‘집을 바릅니다’는 טָח의 도포 행위를 간결하게 전달합니다.
  terminology: ‘다른 흙’은 עָפָר의 기본 의미를 보존합니다. ‘모르타르’는 가능한 문맥적 대안으로 각주에 남기되, 현대 건축 재료를 지나치게 특정하지 않도록 본문에는 채택하지 않았습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
