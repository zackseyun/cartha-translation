id: LEV.14.14
reference: Leviticus 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
  footnotes:
  - marker: a
    text: Or 'the tip of the right ear.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the blood of the guilt offering'; the sense is that the priest takes some of it for the rite.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 제사장은 속건제의 피[a]를 조금 가져다가, 정결하게 되는 사람의 오른쪽 귀 귓불과 그의 오른손 엄지와 그의 오른발 엄지발가락에 바를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오른쪽 귀의 끝부분’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם הָאָשָׁם
  english_pob_choice: some of the blood of the guilt offering
  chosen_korean: 속건제의 피[a]를 조금
  alternatives_korean:
  - 속건제의 피를
  - 속건제의 피에서
  lexicon: HALOT
  rationale: מִן+דם은 분량을 덜어 취하는 뜻이므로, 한국어에서는 ‘피를 조금’으로 부분적 취함을 자연스럽게 드러냈습니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제
  - 배상제
  lexicon: HALOT
  rationale: 레위기 제의 문맥에서 אָשָׁם은 표준적으로 속건제를 가리키므로, 한국어도 그 제의명칭을 그대로 살렸습니다.
- source_word: תְּנוּךְ אֹזֶן
  english_pob_choice: the lobe of the right ear
  chosen_korean: 오른쪽 귀 귓불
  alternatives_korean:
  - 오른쪽 귀 끝
  - 오른쪽 귀의 끝부분
  lexicon: HALOT
  rationale: תְּנוּךְ은 귀의 끝부분/귓불을 가리키므로, 현대 한국어에서 가장 분명한 해부학적 표현인 ‘귓불’을 택했습니다.
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  english_pob_choice: the thumb of his right hand / the big toe of his right foot
  chosen_korean: 오른손 엄지와 그의 오른발 엄지발가락
  alternatives_korean:
  - 오른손 엄지와 오른발 큰발가락
  - 오른손 엄지와 오른발 큰엄지발가락
  lexicon: HALOT
  rationale: בֹּהֶן은 손에서는 엄지, 발에서는 엄지발가락을 뜻하므로, 한국어에서도 각각의 자연스러운 해부학 용어로 옮겼습니다.
theological_decisions:
- issue: 정결의 주체 표현
  chosen_reading: ‘정결하게 되는 사람’으로 번역하여, 그가 스스로 정결하게 하는 것이 아니라 제사장의 정결 예식을 받는 대상임을 드러냈습니다.
  alternative_readings:
  - 정결하게 하려는 사람
  - 정결한 사람
  rationale: 히브리어 분사 הַמִּטַּהֵר는 문맥상 능동적 자기정결이 아니라 정결 예식의 대상자를 가리키므로, 그 수동적 과정을 한국어로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
