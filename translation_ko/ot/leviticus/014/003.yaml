id: LEV.14.3
reference: Leviticus 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
  footnotes:
  - marker: a
    text: Traditionally, 'the leprosy disease has been healed in the leprous person.' The Hebrew terms refer more broadly to a skin disease/affliction than specifically to modern leprosy.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장은 진영 밖으로 나가서 그를 살펴보아야 합니다. 그 환자에게서 피부 질환의 병변[a]이 나은 것이 확인되면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת와 צָרוּעַ는 전통적으로 각각 ‘나병’과 ‘나병 환자’로 옮겼습니다. 그러나 이 말들은 현대 의학의 나병으로만 한정되지 않는 더 넓은 피부 질환 또는 피부의 병변을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְיָצָא / הַכֹּהֵן
  english_pob_choice: shall go out / the priest
  chosen_korean: 제사장은 나가야 합니다
  alternatives_korean:
  - 제사장은 밖으로 나가야 합니다
  - 제사장은 나갈 것입니다
  lexicon: HALOT
  rationale: 법률·의례 문맥의 명령형 미래를 한국어에서는 ‘-아/어야 합니다’로 옮겨 규정된 절차의 의무를 분명히 했습니다.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: to a place outside the camp
  chosen_korean: 진영 밖의 한 곳으로
  alternatives_korean:
  - 진영 밖으로
  - 진영 바깥의 장소로
  lexicon: HALOT
  rationale: 방향성(אֶל)과 위치 표현(מִחוּץ)을 함께 살려, 단순한 ‘밖으로’보다 ‘한 곳으로’가 있는 이동 목적을 드러내도록 했습니다.
- source_word: וְרָאָה
  english_pob_choice: shall examine him
  chosen_korean: 그를 살펴보고
  alternatives_korean:
  - 그를 검사하고
  - 그를 보며
  lexicon: HALOT
  rationale: 여기서 ראה는 단순 시각이 아니라 제의적 판정에 앞선 점검이므로, 한국어 ‘살펴보다’로 그 심사적 뉘앙스를 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 직접 화법의 감탄·주의 환기를 살리되 현대 합쇼체 문맥에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: נִרְפָּא נֶגַע הַצָּרַעַת מִן הַצָּרוּעַ
  english_pob_choice: the disease of leprosy has been healed in the one with the skin disease
  chosen_korean: 나병 질병이 피부병 환자에게서 나았습니다
  alternatives_korean:
  - 나병의 병환이 그 환자에게서 나았습니다
  - 피부병 질환이 그에게서 나았습니다
  lexicon: HALOT
  rationale: POB의 영어 본문이 전통적 ‘leprosy’와 설명적 표현 사이의 긴장을 보존하고 있으므로, 핵심 용어를 그대로 반영하되 한국어에서는 ‘~에게서 나았습니다’로 분리·이탈의 결과를 나타냈습니다.
theological_decisions:
- issue: צָרַעַת / צָרוּעַ의 병명 범주
  chosen_reading: ‘나병 질병 / 피부병 환자’라는 표현을 본문에 두되, 현대 의학적 한정은 피합니다.
  alternative_readings:
  - 문둥병 / 문둥이
  - 피부병 / 피부병 환자
  rationale: 히브리어가 가리키는 것은 현대의 나병(Hansen's disease)보다 더 넓은 의례적 피부 질환이므로, 전통어를 무비판적으로 확정하지 않으면서도 독자가 본문의 익숙한 어감을 놓치지 않게 했습니다.
  doctrine_reference: '번역 원칙: 원어 우선과 역사적 의미 보존, 동시에 오독을 낳는 의학적 단정은 회피'
