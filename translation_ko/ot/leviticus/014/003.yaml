  - severity: medium
    issue: ‘보십시오’의 문체 및 문장 연결
    rationale: וְהִנֵּה는 검사 결과의 발견을 표시하지만, 해당 위치의 ‘보십시오’는 현대 한국어 법규·절차 문장에 부자연스럽습니다. ‘…나은 것이 확인되면’이 발견된 상태를 자연스럽게 전달합니다.
  - severity: low
