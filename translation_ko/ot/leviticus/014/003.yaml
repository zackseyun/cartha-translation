  verdict: revise
  source_fidelity: 히브리어는 제사장이 진영 밖으로 나가 환자를 살펴본 뒤, 그 환자에게서 צָרַעַת의 병변이 나은 사실을 확인하는 절차를 묘사합니다. 초안의 ‘나병 질병’은 נֶגַע הַצָּרַעַת의 관계를 부자연스럽게 중복시키며, ‘보십시오’는 한국어 절차 규정 문맥에서 어색합니다. ‘피부 질환의 병변’은 원문의 병변/환부(נֶגַע)와 질환 범주(צָרַעַת)를 구별하면서 현대 나병으로 단정하지 않습니다.
  naturalness: ‘진영 밖의 한 곳으로’와 ‘나병 질병’은 현대 표준 한국어에서 부자연스럽습니다. 또한 ‘그를 살펴보고, 보십시오’는 히브리어의 발견·확인 구문을 한국어에 기계적으로 옮긴 표현입니다. 조건적 확인 구문으로 자연스럽게 연결하는 것이 합쇼체 법규 문체에 맞습니다.
  terminology: כֹּהֵן은 ‘제사장’, מַחֲנֶה는 ‘진영’, נֶגַע는 ‘병변’, צָרַעַת 및 צָרוּעַ는 각각 ‘피부 질환’과 ‘그 환자’로 옮겼습니다. 각주에서 전통적 ‘나병’ 번역을 밝혀 독자의 관습적 용례를 안내하되, 본문에서는 현대 의학적 병명으로 한정하지 않았습니다.
  issues:
