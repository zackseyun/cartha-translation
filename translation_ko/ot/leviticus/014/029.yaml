  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
  footnotes:
  - marker: a
    text: Or 'what remains of the oil that is on the priest’s palm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장의 손바닥에 남은 기름은 그가 정결하게 되는 사람의 머리에 바르되, 그를 위해 야훼 앞에서 속죄를 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사장의 손바닥에 있는 기름의 남은 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  english_pob_choice: And the rest of the oil
  chosen_korean: 제사장의 손바닥에 남은 기름
  alternatives_korean:
  - 기름의 남은 것
  - 남은 기름
  lexicon: HALOT
  rationale: הַנּוֹתָר는 ‘남은 것’이고, מִן은 부분을 나타내므로 ‘남은 기름’의 뜻을 살리되, 이어지는 위치 표현과 함께 제사장의 손에 실제로 남아 있는 기름이라는 장면을 자연스럽게 드러냈습니다.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  english_pob_choice: that is in the priest’s palm
  chosen_korean: 제사장의 손바닥에
  alternatives_korean:
  - 제사장의 손바닥 안에
  - 제사장의 손에
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥/손의 오목한 부분’이므로, ritual image를 살려 ‘손바닥에’로 옮겼습니다. 영어 POB의 ‘in the priest’s palm’도 같은 의도를 반영합니다.
- source_word: הַמִּטַּהֵר
  english_pob_choice: the one being cleansed
  chosen_korean: 정결하게 되는 사람
  alternatives_korean:
  - 정결하게 되는 자
  - 정결함을 받는 사람
  lexicon: HALOT
  rationale: Hitpael 분사로서 진행 중인 정결 절차의 대상임을 나타내므로, 상태를 단정하기보다 과정성을 드러내는 ‘정결하게 되는 사람’이 가장 가깝습니다.
- source_word: לְכַפֵּר עָלָיו
  english_pob_choice: to make atonement for him
  chosen_korean: 그를 위해 속죄를 해야 합니다
  alternatives_korean:
  - 그를 위해 속죄해야 합니다
  - 그에게 속죄해야 합니다
  lexicon: HALOT
  rationale: כפר는 제의적 핵심 용어라서 ‘속죄하다’보다 목적적 구조를 살린 ‘속죄를 해야 합니다’로 옮겨, 행위의 제의적 무게를 유지했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에
  - 야훼의 앞에서
  lexicon: HALOT
  rationale: יְהוָה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮기고, לִפְנֵי는 예배·제의 맥락의 ‘~앞에서’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 전통적 대체어보다 स्रोत-직결 표기인 ‘야훼’를 유지해 제의 문맥의 신적 호칭을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
