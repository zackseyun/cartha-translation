  terminology: ‘야훼’, ‘속죄’, ‘정결하게 되는 사람’은 각각 יהוה, כפר, הַמִּטַּהֵר의 제의적 문맥과 과정성을 잘 반영합니다. ‘위하여’는 עָלָיו의 수혜/대상 관계를 자연스럽게 나타냅니다.
