  source_fidelity: 히브리어는 제사장이 손바닥에 남아 있는 기름을 정결 의식을 받는 사람의 머리에 바르고, 그를 위하여 야훼 앞에서 속죄하는 동작을 말합니다. 초안은 핵심 의미를 대체로 보존하지만, ‘그가’의 선행사가 한국어 문장 안에서 명시되지 않아 제사장을 가리키는지 불분명하며, ‘해야 합니다’는 본문의 의례적 미래/지시 서술보다 규범적 의무를 다소 강하게 드러냅니다.
