  lexicon: HALOT
  rationale: צָרָעַת의 범위를 현대 의학명으로 좁히지 않되, 한국어 관용 표현인 ‘나병’을 보조적으로 쓰고 ‘환부’로 נגַע의 병변성을 살렸습니다.
