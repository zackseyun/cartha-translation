theological_decisions:
- issue: צָרָעַת의 한국어 표기 범위
  chosen_reading: 전통적 ‘나병’ 표현을 쓰되, 문맥상 의학적 한정이 아니라 의례적 피부 질환 범주로 읽히도록 다른 요소에서 보완했습니다.
  alternative_readings:
  - 피부병
  - 문둥병
  - 피부 질환
  rationale: 본 절은 정결 규정 문맥이므로, 현대 의학명으로 오해시키기보다 전통 용어를 사용하되 범주를 지나치게 좁히지 않는 쪽이 본문의 기능을 잘 드러냅니다.
  doctrine_reference: 레위기 13–14장의 정결 규례
