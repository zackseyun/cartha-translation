  edition: WLC
  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
  footnotes:
  - marker: a
    text: Hebrew צָרָעַת traditionally rendered 'leprosy,' but in Leviticus it refers more broadly to a range of serious skin conditions and related ritual impurity.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'whose hand does not reach in his cleansing,' an idiom meaning he lacks sufficient means for the purification offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 그 몸에 나병의 환부가 있는 사람, 곧 정결 예물에 필요한 비용을 감당할 수 없는 사람을 위한 율법입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרָעַת는 전통적으로 ‘나병’으로 옮겨졌지만, 레위기에서는 더 넓은 범위의 심한 피부 질환과 그에 따른 의례적 부정을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 정결에서 그의 손이 미치지 못하는 사람’으로, 필요한 정결 예물을 마련할 형편이 되지 못한다는 관용구입니다.
    reason: lexical_alternative
