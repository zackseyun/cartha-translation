base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
  footnotes:
  - marker: a
    text: Or 'scarlet thread.' The Hebrew expression שְׁנִי תוֹלַעַת refers to scarlet-dyed material, and the exact form of the material may be rendered in different ways.
    reason: lexical_alternative
  - marker: b
    text: The exact plant denoted by 'hyssop' is uncertain; the traditional rendering is retained.
    reason: cultural_note
translation:
  language: ko
  text: 제사장은 한센 사람을 위해 두 마리의 살아 있는 깨끗한 새와 백향목, 붉은 실과 우슬초를 가져오라고 명령해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘깨끗한’은 도덕적 의미가 아니라 제의적으로 적합한 상태를 가리킵니다.
    reason: theological_note
  - marker: b
    text: 히브리어 שְׁנִי תוֹלַעַת은 붉게 물든 재료를 가리키며, 구체적 형태는 ‘실’, ‘실타래’, ‘실감개’ 등으로 다르게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  english_pob_choice: Then the priest shall command
  chosen_korean: 제사장은 ... 명령해야 합니다
  alternatives_korean:
  - 그리고 제사장은 ... 명령해야 합니다
  - 그 제사장은 ... 명령해야 합니다
  lexicon: HALOT
  rationale: 법적·의식 절차에서 וְ는 순서를 잇는 접속으로 기능하므로 한국어에서는 자연스럽게 생략하고, 주어를 앞세운 평서형 명령 진술로 옮겼습니다.
- source_word: לַמִּטַּהֵר
  english_pob_choice: for the one being cleansed
  chosen_korean: 한센 사람을 위해
  alternatives_korean:
  - 정결함을 받는 사람을 위해
  - 정결하게 되는 사람을 위해
  - 정결 예식을 받는 사람을 위해
  lexicon: HALOT
  rationale: 이 표현은 정결 예식의 대상자를 가리키므로, 본문 의미를 한국어 독자에게 자연스럽게 전달하는 용례를 택했습니다. 레위기 13–14장의 문맥상 한센병 관련 정결 예식 대상자라는 점을 분명히 했습니다.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  english_pob_choice: two live clean birds
  chosen_korean: 두 마리의 살아 있는 깨끗한 새
  alternatives_korean:
  - 두 마리의 살아 있는 정결한 새
  - 두 마리의 살아 있고 깨끗한 새
  lexicon: HALOT
  rationale: צִפּוֹר는 특정 종이 아니라 일반적인 ‘새’이므로 과도한 특정화 없이 옮겼고, חַיּוֹת과 טְהֹרוֹת는 의식적 구분을 살려 ‘살아 있는’, ‘깨끗한’으로 번역했습니다.
- source_word: שְׁנִי תוֹלַעַת
  english_pob_choice: scarlet yarn
  chosen_korean: 붉은 실
  alternatives_korean:
  - 진홍 실
  - 주홍 실
  - 붉은 실타래
  lexicon: HALOT
  rationale: 이 표현은 특정 재질보다 붉게 물든 실재를 가리키므로, 직역보다 한국어에서 가장 자연스럽고 폭넓게 이해되는 ‘붉은 실’을 택했습니다. POB의 ‘scarlet yarn/thread’ 범위를 반영했습니다.
- source_word: אֵזֹב
  english_pob_choice: hyssop
  chosen_korean: 우슬초
  alternatives_korean:
  - 히솝
  - 우슬초 식물
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 אֵזוֹב은 통상 ‘우슬초’로 알려져 있으므로, 식물 명칭의 표준적 대응을 유지했습니다.
theological_decisions:
- issue: 정결 예식 대상자 표현
  chosen_reading: ‘한센 사람’으로 옮겨, 레위기 13–14장의 부정/정결 규례 대상임을 직접 드러냈습니다.
  alternative_readings:
  - ‘정결하게 되는 사람’
  - ‘정결함을 받는 사람’
  rationale: 본문의 대상은 일반적인 도덕적 정화가 아니라 부정에서 정결로의 의례적 회복이므로, 문맥을 분명히 드러내는 표현을 선택했습니다.
  doctrine_reference: 레위기 13–14장 정결 규례
- issue: ‘깨끗한’의 의식적 의미
  chosen_reading: ‘깨끗한’은 도덕적 청결이 아니라 의식적으로 적합한 상태를 뜻하는 것으로 유지했습니다.
  alternative_readings:
  - ‘정결한’
  - ‘의식적으로 깨끗한’
  rationale: 본문의 טְהֹרוֹת는 레위기 제의 맥락에서 의례적 적합성을 가리키므로, 과도한 설명 없이도 기능하는 한국어로 옮기되 그 의미는 제의적입니다.
  doctrine_reference: 레위기 제의 정결 개념
