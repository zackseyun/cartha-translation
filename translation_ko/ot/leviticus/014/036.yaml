  to: 그때 제사장은 그 병변[a]을 살피러 들어가기 전에 집을 비우라고 명령해야 합니다. 이는 집 안에 있는 모든 것이 부정하게 되지 않도록 하기 위함입니다. 그 후에 제사장은 그 집을 살피러 들어가야 합니다.
  rationale: 제사장의 명령과 그에 따른 집 비우기의 관계를 명확히 하고, 원문의 절차적 법규 양태를 현대 합쇼체로 자연스럽게 옮겼습니다. ‘병변’에는 원어의 의미 범위를 보존하는 역주를 달았으며, 의례적 부정의 의미를 유지했습니다.
