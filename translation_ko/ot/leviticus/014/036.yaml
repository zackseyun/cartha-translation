  text: 그때 제사장은 그 병변[a]을 살피러 들어가기 전에 집을 비우라고 명령해야 합니다. 이는 집 안에 있는 모든 것이 부정하게 되지 않도록 하기 위함입니다. 그 후에 제사장은 그 집을 살피러 들어가야 합니다.
