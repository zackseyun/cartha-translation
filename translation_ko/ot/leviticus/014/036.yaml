review_pass:
  verdict: revise
  source_fidelity: 초안은 제사장이 집을 비우게 한 뒤 들어가 살핀다는 절차와, 집 안의 물건들이 부정하게 되는 것을 막는 목적을 대체로 전달합니다. 그러나 '제사장이 명하여 제사장이'라는 중복 때문에 명령의 내용과 주체가 불명료하며, 법규적 서술의 양태도 다듬을 필요가 있습니다.
  naturalness: '''그 때에'', ''이는 … 함이요'', ''들어갈 것이니라''는 현대 표준 한국어 합쇼체에서 다소 고어적이고 문장 연결이 부자연스럽습니다. 명령 내용은 ''-라고 명령해야 합니다''로 명료하게 표현하는 것이 자연스럽습니다.'
  terminology: '''병변''은 נגע의 가시적·진단 대상이라는 문맥에 맞지만 현대 의학적 진단으로 지나치게 한정될 수 있으므로, 역주에서 ''표지/감염/재앙'' 등의 가능성을 밝혀 의미 범위를 보존합니다. טמא는 도덕적 죄책이 아니라 의례적 상태를 가리키므로 ''부정하게 되다''로 옮겼습니다.'
  issues:
  - severity: medium
    issue: 명령 구문의 주체 중복 및 불명료성
    rationale: 초안의 '제사장이 명하여 제사장이 … 집을 비우게 하라'는 제사장이 누구에게 무엇을 명하는지 불명확합니다. 히브리어는 제사장이 집을 비우도록 명령한다는 뜻입니다.
  - severity: low
    issue: 현대 합쇼체에 맞지 않는 문체
    rationale: '''함이요'', ''것이니라'' 대신 현대적이고 정중한 법규 문체인 ''-해야 합니다'', ''-도록 하기 위함입니다''를 사용합니다.'
  - severity: low
    issue: 병변에 대한 역주 앵커 누락
    rationale: נגע는 반드시 현대 의학적 의미의 질병만을 뜻하지 않으므로, 번역어의 의미 범위를 보완하는 역주 앵커를 본문에 둡니다.
