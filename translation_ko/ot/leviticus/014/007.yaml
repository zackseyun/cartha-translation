id: LEV.14.7
reference: Leviticus 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
  footnotes:
  - marker: a
    text: Traditionally 'leprosy.' The Hebrew term refers more broadly to a range of skin-related conditions in Leviticus, not necessarily modern leprosy.
    reason: lexical_alternative
  - marker: b
    text: Or 'declare him clean.' The priest's action is ritual/judicial, not merely medical.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 나병 환자[a]에게 그 피를 일곱 번 뿌리고, 그를 깨끗하다고 선언하며[b], 살아 있는 새를 들판 위로 날려 보내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘나병’으로 번역되지만, 레위기의 히브리어는 현대 의학의 나병에만 국한되지 않는 더 넓은 피부 관련 증상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 깨끗하다고 판정하며’. 제사장의 행위는 단순한 의학적 확인이 아니라 제의적·법적 선언입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  english_pob_choice: He shall sprinkle it
  chosen_korean: 그는 … 그 피를 일곱 번 뿌리고
  alternatives_korean:
  - 그는 그것을 뿌리고
  - 그는 … 뿌리고
  lexicon: HALOT
  rationale: 제의 문맥에서 נזה는 액체를 ‘뿌리다’로 옮기는 것이 자연스럽고, 앞 절의 제의적 액체를 가리키는 말은 한국어에서 ‘그 피’를 보충해 주는 것이 문맥을 가장 분명하게 드러냅니다.
- source_word: הַמִּטַּהֵר מִן הַצָּרַעַת
  english_pob_choice: the one being cleansed from the skin disease
  chosen_korean: 그 나병 환자[a]
  alternatives_korean:
  - 정결하게 되는 사람
  - 그 피부 질환에서 깨끗하게 되는 사람
  lexicon: HALOT
  rationale: 레위기의 צָרַעַת은 현대 의학적 ‘나병’과 일치하지 않지만, 한국어 독자를 위한 가독성과 전승된 성경 어휘를 함께 고려해 본문에는 ‘나병 환자’를 두고, 각주로 범주가 더 넓다는 점을 보완합니다.
- source_word: וְטִהֲרוֹ
  english_pob_choice: and he shall pronounce him clean
  chosen_korean: 그를 깨끗하다고 선언하며[b]
  alternatives_korean:
  - 그를 깨끗하게 하며
  - 그를 정결하다고 선포하며
  lexicon: HALOT
  rationale: 이 동사는 단순한 위생적 정화보다 제의적·법적 판정의 성격이 강하므로, POB의 취지를 따라 ‘선언하다’로 옮겨 제사장의 공식 판정임을 드러냈습니다.
- source_word: הַצִּפֹּר הַחַיָּה עַל פְּנֵי הַשָּׂדֶה
  english_pob_choice: the living bird go free over the open field
  chosen_korean: 살아 있는 새를 들판 위로 날려 보내야 합니다
  alternatives_korean:
  - 살아 있는 새를 열린 들판으로 놓아야 합니다
  - 살아 있는 새를 들판 밖으로 풀어주어야 합니다
  lexicon: HALOT
  rationale: שׁלח는 제의 맥락에서 ‘보내다/풀어주다’의 의미를 가지며, עַל־פְּנֵי הַשָּׂדֶה는 ‘들판 위로/들판의 열린 공간으로’라는 시각적 이미지를 담고 있어 이를 간결하게 반영했습니다.
theological_decisions:
- issue: צָרַעַת의 번역 범위
  chosen_reading: 본문에는 전통적이고 이해하기 쉬운 ‘나병’을 사용하되, 각주로 현대적 의미의 나병과는 다른 더 넓은 피부 질환 범주임을 밝혔습니다.
  alternative_readings:
  - 피부 질환
  - 피부병
  rationale: 레위기의 제의적 범주는 현대 의학 진단과 정확히 겹치지 않으므로, 본문 가독성을 해치지 않으면서도 의미의 오해를 줄이기 위해 번역과 주석을 병행했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition.'
