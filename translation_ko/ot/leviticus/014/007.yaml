  source_fidelity: 수정이 필요합니다. צָרַעַת는 현대 의학적 ‘나병’과 동일시할 수 없고, הַמִּטַּהֵר는 단순히 ‘환자’가 아니라 정결 예식을 받고 있는 사람입니다. 또한 이 절에서 뿌리는 대상은 히브리어에 명시되지 않았으므로 ‘그 피’로 한정하지 않는 편이 안전합니다.
  naturalness: 합쇼체의 법규적 문체는 자연스럽지만, ‘나병 환자’와 ‘들판 위로 날려 보내야 합니다’는 각각 원문의 제의적·어휘적 범위 및 שׁלח의 ‘풀어 주다’라는 뜻을 충분히 반영하지 못합니다. ‘정결하게 되는 사람’, ‘들판으로 풀어 주어야 합니다’가 더 자연스럽고 정확합니다.
  terminology: צָרַעַת는 ‘피부 질환’으로, טהר의 제의적 판정은 ‘정결하다고 선언하다’로 옮기는 것이 적절합니다. הַצִּפּוֹר הַחַיָּה는 ‘살아 있는 새’로 유지합니다.
