  to: 그러나 만일 제사장이 들어가 살펴보았을 때, 그 집에 회반죽을 바른 뒤에도 그 병변[a]이 집 안에서 더 번지지 않았다면, 제사장은 그 집을 정결하다고 선언해야 합니다.[b] 그 병변이 나았기 때문입니다.
