  naturalness: 초안의 '그 집에 회칠한 후에', '깨끗하게 하라 하리니', '그 병이 낫음이라'는 현대 표준어 합쇼체로는 부자연스럽거나 고어적입니다. 조건문과 이유절을 현대적 문장으로 정리했습니다.
