id: LEV.14.18
reference: Leviticus 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
  footnotes:
  - marker: a
    text: Or 'what is left of the oil that is on the priest’s palm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장의 손바닥에 있는 기름 가운데 남은 것은[a] 정결하게 되는 사람의 머리에 바르고, 제사장은 야훼 앞에서 그를 위해 속죄해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남아 있는 것은’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  english_pob_choice: what remains
  chosen_korean: 남은 것은
  alternatives_korean:
  - 남은 것
  - 나머지는
  - 남아 있는 것은
  lexicon: HALOT
  rationale: 남은 것은은 남아 있는 양을 자연스럽게 살리면서, 제의 문맥에서 남은 몫이라는 의미를 분명하게 전달합니다.
- source_word: בַּשֶּׁמֶן אֲשֶׁר עַל כַּף הַכֹּהֵן
  english_pob_choice: of the oil that is on the priest’s palm
  chosen_korean: 제사장의 손바닥에 있는 기름 가운데
  alternatives_korean:
  - 제사장의 손바닥 위에 있는 기름 가운데
  - 제사장의 손바닥에 있는 기름 가운데
  - 제사장의 손에 있는 기름 가운데
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥’이 가장 정확하며, עַל은 한국어에서는 자연스럽게 ‘-에 있는’으로 옮겨 손바닥 위에 놓인 기름의 상태를 살렸습니다.
- source_word: הַמִּטַּהֵר
  english_pob_choice: the one being cleansed
  chosen_korean: 정결하게 되는 사람
  alternatives_korean:
  - 정결하게 되는 이
  - 정결함을 받는 사람
  - 깨끗하게 되는 사람
  lexicon: HALOT
  rationale: 히트파엘 분사로서 진행 중인 정결 의식을 받는 사람을 가리키므로, ‘정결하게 되는 사람’이 가장 직접적입니다.
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: and the priest shall make atonement for him
  chosen_korean: 제사장은 야훼 앞에서 그를 위해 속죄해야 합니다
  alternatives_korean:
  - 제사장은 그를 위해 속죄해야 합니다
  - 제사장은 그를 위하여 속죄해야 합니다
  - 제사장은 그를 위해 속죄를 해야 합니다
  lexicon: HALOT
  rationale: כפר는 제의 문맥에서 한국어 성경 전통상 ‘속죄하다’가 가장 넓고 안정적인 대응이며, עָלָיו는 ‘그를 위해’로 자연스럽게 풀었습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에
  - 주 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 이 역본의 기본 원칙에 따라 신명기적 언약명은 ‘야훼’로 옮기고, לִפְנֵי는 문맥상 ‘앞에서’가 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 본문에 유지해 언약 სახელ을 가립니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
- issue: 속죄 용어의 유지
  chosen_reading: 속죄해야 합니다
  alternative_readings:
  - 제물로 덮어야 합니다
  - 화해시켜야 합니다
  - 정결하게 해야 합니다
  rationale: 레위기의 제의 규범에서는 כפר의 제의적·신학적 의미를 보존하는 것이 중요하므로, 일반화된 표현보다 ‘속죄’가 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
