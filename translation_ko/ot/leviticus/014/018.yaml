  source_fidelity: 본문 번역은 히브리어의 순서와 핵심 의미를 대체로 충실히 반영합니다. ‘제사장의 손바닥에 있는 기름 가운데 남은 것’, ‘정결하게 되는 사람’, ‘그를 위해 속죄하다’, ‘야훼 앞에서’는 각각 וְהַנּוֹתָר בַּשֶּׁמֶן אֲשֶׁר עַל כַּף הַכֹּהֵן, הַמִּטַּהֵר, וְכִפֶּר עָלָיו, לִפְנֵי יְהוָה에 잘 대응합니다. ‘바르고’는 이 의례 문맥의 יִתֵּן(두다/바르다)을 자연스럽게 드러냅니다.
  naturalness: 합쇼체 문장으로 자연스럽고, ‘기름 가운데 남은 것은’도 이해 가능합니다. 다만 각주 표지가 문장 끝에 있어 앞부분의 어휘 대안인지 분명하지 않으며, 해당 각주 내용은 본문 표현과 사실상 동일하여 독자에게 유효한 대안을 제공하지 못합니다.
  terminology: ‘제사장’, ‘손바닥’, ‘정결하게 되는 사람’, ‘속죄’, ‘야훼’는 일관되고 적절합니다. כפר를 ‘속죄하다’로 옮긴 것은 제의 문맥을 보존하며 특정 속죄 이론을 덧붙이지 않습니다.
  issues:
