  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
  footnotes:
  - marker: a
    text: Literally, 'living water'; also rendered 'running water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 살아 있는 새와 백향목 나무와 홍색 실과 우슬초를 가져다가, 그것들과 살아 있는 새를 흐르는 물[a] 위에서 잡은 새의 피에 담그십시오.
  philosophy: optimal-equivalence
  footnotes:
