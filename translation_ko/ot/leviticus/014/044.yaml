  text: וּ/בָא֙ הַ/כֹּהֵ֔ן וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בַּ/בָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּ/בַּ֖יִת טָמֵ֥א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
  footnotes:
  - marker: a
    text: Or 'leprosy.' The Hebrew term צָרַעַת refers to a broader category of ritual impurity than modern leprosy and is even used of houses here.
    reason: lexical_alternative
  - marker: b
    text: Or 'malignant' or 'corrosive' for 'destructive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장이 와서 살펴보아, 그 오염이 집 안에 퍼져 있으면, 그것은 집 안에 있는 악성 곰팡이[a][b]입니다. 그 집은 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나병’. 히브리어 צָרַעַת은 현대의 나병보다 더 넓은 제의적 부정 범주를 가리키며, 여기서는 집에 대해서도 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악성’은 ‘파괴적인’ 또는 ‘부식성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
