id: LEV.14.44
reference: Leviticus 14:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָא֙ הַ/כֹּהֵ֔ן וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בַּ/בָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּ/בַּ֖יִת טָמֵ֥א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
  footnotes:
  - marker: a
    text: Or 'leprosy.' The Hebrew term צָרַעַת refers to a broader category of ritual impurity than modern leprosy and is even used of houses here.
    reason: lexical_alternative
  - marker: b
    text: Or 'malignant' or 'corrosive' for 'destructive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 들어와서 살펴보아야 합니다. 그런데 보시다시피 그 불길이 집 안에서 퍼져 있다면, 그것은 집 안의 파괴적인 피부병입니다[a][b]. 그것은 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나병.’ 히브리어 צָרַעַת은 현대의 나병보다 더 넓은 제의적 부정 범주를 가리키며, 여기서는 집에 대해서도 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악성’ 또는 ‘부식성’의 뜻으로 ‘파괴적인.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא ... וְרָאָה
  english_pob_choice: then ... shall come and inspect
  chosen_korean: 들어와서 살펴보아야 합니다
  alternatives_korean:
  - 와서 보아야 합니다
  - 들어와서 검사해야 합니다
  lexicon: HALOT
  rationale: 제사장 절차 문맥이므로 단순 서술이 아니라 조사·판정의 뉘앙스를 살려 ‘살펴보다’로 옮겼습니다.
- source_word: פָּשָׂה
  english_pob_choice: has spread
  chosen_korean: 퍼져 있다
  alternatives_korean:
  - 퍼졌습니다
  - 확산되어 있습니다
  lexicon: HALOT
  rationale: 이미 진행 중인 상태를 드러내기 위해 현재완료적 결과상으로 표현했습니다.
- source_word: הַנֶּגַע
  english_pob_choice: the infection
  chosen_korean: 그 불길
  alternatives_korean:
  - 그 감염
  - 그 재앙
  - 그 병변
  lexicon: HALOT
  rationale: 집에 생긴 מצורע성 오염을 한국어로 자연스럽게 드러내기 위해, 문자적 의학 용어보다 ‘불길’로 옮겨 확산성과 해로운 침범을 살렸습니다.
- source_word: צָרַעַת מַמְאֶרֶת
  english_pob_choice: a destructive mildew
  chosen_korean: 파괴적인 피부병
  alternatives_korean:
  - 파괴적인 문드러짐
  - 해로운 피부병
  - 악성 피부병
  lexicon: HALOT
  rationale: צָרַעַת은 현대 의학적 나병이 아니라 더 넓은 정결 불결 범주이므로, 기존 POB의 설명적 범주를 따라 ‘피부병’으로 옮기되 집에 적용된다는 점을 감안해 ‘파괴적인’으로 수식했습니다.
- source_word: טָמֵא הוּא
  english_pob_choice: it is unclean
  chosen_korean: 그것은 부정합니다
  alternatives_korean:
  - 그것은 부정합니다
  - 그것은 더럽습니다
  - 그것은 정결하지 않습니다
  lexicon: HALOT
  rationale: 레위기 정결 규정의 기술어이므로 ‘부정하다’로 옮겨 의례적 상태를 분명히 했습니다.
theological_decisions:
- issue: 집에 발생한 צָרַעַת의 성격
  chosen_reading: 의학적 질병으로 단정하지 않고 정결-부정의 범주를 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - 나병
  - 악성 질병
  - 곰팡이
  rationale: 본문은 인간 피부의 질환 진단이 아니라 집에 대한 제의적 판정이므로, 현대 의학적 명칭으로 환원하지 않되 오염의 확산성과 파괴성을 드러내야 합니다.
  doctrine_reference: 레위기 14장 정결 규례
