    rationale: 히브리어의 남성 단수 대명사는 집(בַּיִת)의 상태 판정으로 이해하는 것이 자연스럽습니다. 한국어에서는 ‘그 집은 부정합니다’가 지시 대상과 제의적 판정을 분명히 합니다.
