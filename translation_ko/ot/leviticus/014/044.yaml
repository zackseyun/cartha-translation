review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. וְהִנֵּה는 독자에게 직접 말하는 ‘보시다시피’가 아니라 제사장이 살핀 결과를 제시하는 표현이므로 조건절로 처리해야 합니다. נֶגַע는 ‘불길’이 아니라 집에 나타난 오염/병변을 가리키며, 집에 적용된 צָרַעַת을 ‘피부병’으로 번역하는 것은 문맥상 부정확합니다. 절 끝의 טָמֵא הוּא는 집의 제의적 상태를 판정합니다.
  naturalness: ‘제사장이 와서 살펴보아’와 ‘그 집은 부정합니다’는 현대 표준어 합쇼체의 절차 규정 문맥에 자연스럽습니다. ‘악성 곰팡이’는 집의 문제를 가리키는 한국어 표현으로 자연스럽지만, 각주에서 히브리어 범주가 현대의 의학적·물질적 분류와 정확히 일치하지 않음을 밝혀야 합니다.
  terminology: 제의적 상태인 טָמֵא는 ‘부정하다’로 유지합니다. צָרַעַת은 본문에서 집의 ‘곰팡이’로 문맥화하되, ‘나병’이라는 전통적 번역 및 이 용어의 넓은 제의적 범주는 각주로 설명합니다. מַמְאֶרֶת는 ‘악성’으로 옮기고 대안은 각주에 둡니다.
  issues:
  - severity: high
    issue: ‘그 불길’
    rationale: נֶגַע는 여기서 집에 나타난 감염성 표지/오염을 뜻하며, 화재를 연상시키는 ‘불길’은 원문에 없는 의미를 도입합니다.
  - severity: high
    issue: ‘집 안의 파괴적인 피부병’
    rationale: צָרַעַת이 집에 적용되는 본문의 특성을 ‘피부병’이 훼손합니다. 집의 현상으로 이해되는 ‘곰팡이’가 영어 POB의 mildew 및 문맥에 더 부합합니다.
  - severity: medium
    issue: ‘보시다시피’
    rationale: וְהִנֵּה는 독자를 향한 호소가 아니라 निरी察 결과를 제시하는 담화 표지입니다. 절차적 조건문으로 옮겨야 합니다.
  - severity: medium
