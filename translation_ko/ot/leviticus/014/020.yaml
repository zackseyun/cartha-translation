  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
  footnotes:
  - marker: a
    text: 'Or ''and he shall be purified.'' The Hebrew more literally states the resulting condition: ''and he shall be clean.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 번제와 곡식 제물을 제단 위에 드리고, 제사장은 그를 위해 속죄하여 그가 깨끗하게 될 것입니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 그가 정결하게 될 것입니다.” 히브리어는 결과 상태를 더 문자적으로 ‘그가 깨끗하게 될 것입니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  english_pob_choice: shall offer up
  chosen_korean: 드리고
  alternatives_korean:
  - 바치고
  - 올려 드리고
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘offer up’은 단순한 이동이 아니라 제물을 제의적으로 드리는 행위를 가리키므로, 한국어에서도 자연스럽고 예배적 의미를 살리는 ‘드리다’를 택했습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 번제로 드리는 제물
  lexicon: HALOT
  rationale: 레위기 제의 용어로 표준화된 ‘번제’가 מקור의 제사 종류를 가장 직접적으로 드러냅니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 제사
  lexicon: HALOT
  rationale: POB의 영어 선택이 제의적 의미를 분명히 하듯, 한국어에서도 현대어로 이해되도록 ‘곡식 제물’이라 하되 전통적 용어인 ‘소제’는 사용하지 않았습니다.
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: shall make atonement for him
  chosen_korean: 그를 위해 속죄하여
  alternatives_korean:
  - 그를 대신하여 속죄하여
  - 그에게 속죄를 행하여
  lexicon: HALOT
  rationale: כפר는 제의적 속죄 행위이므로 ‘속죄하다’로 옮기되, עָלָיו는 benefactive 의미를 살려 ‘그를 위해’로 표현했습니다.
- source_word: וְטָהֵר
  english_pob_choice: and he shall be clean
  chosen_korean: 그가 깨끗하게 될 것입니다
  alternatives_korean:
  - 그가 정결하게 될 것입니다
  - 그가 깨끗해질 것입니다
  lexicon: HALOT
  rationale: POB가 지적하듯 결과 상태를 말하는 표현이므로, 과도하게 과정화된 ‘정결하게 되다’보다 상태를 직접 드러내는 ‘깨끗하게 되다’를 택했습니다.
theological_decisions:
- issue: 레위기 14장의 ‘clean’의 의미
  chosen_reading: 의례적 깨끗함을 뜻하는 상태
  alternative_readings:
  - 도덕적 순결
  - 일반 위생적 청결
  rationale: 문맥은 피부병 정결 규례의 회복이므로, 본문이 말하는 것은 도덕 평가가 아니라 제의적 상태의 회복입니다. 따라서 본문에는 추가 설명을 넣지 않고 ‘깨끗하게 될 것입니다’로 간결하게 유지했습니다.
  doctrine_reference: 'Translation philosophy: source text의 평이한 의미를 보존하고, 본문에 없는 신학적 확장을 덧붙이지 않음.'
