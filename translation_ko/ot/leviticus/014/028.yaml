  source_fidelity: 수정이 필요합니다. 초안의 ‘속건제의 피가 있는 자리’는 히브리어 עַל מְקוֹם דַּם הָאָשָׁם 및 앞 절의 의례 문맥이 가리키는 ‘속건제의 피를 바른 자리’를 단순히 피가 존재하는 장소로 바꾸어, 피와 기름이 같은 신체 부위에 적용된다는 의미를 약화합니다. ‘각각’과 ‘피를 바른 자리’를 사용하면 원문의 관계를 자연스럽게 보존합니다.
