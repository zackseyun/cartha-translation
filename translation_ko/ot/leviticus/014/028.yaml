  rationale: 레위기 제의 문맥에서 אָשָׁם은 한국 교회 독자에게도 익숙하고 본문의 제사 항목을 분명히 드러내는 ‘속건제’가 가장 적절합니다.
  doctrine_reference: 레위기 제사 용어의 일관성 유지
