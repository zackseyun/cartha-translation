  terminology: ‘제사장’, ‘속건제’, ‘정결하게 되는 사람’은 레위기 의례 문맥과 한국어 성경 용례에 적합합니다. ‘속건제의 피가 있는 자리’만 ‘속건제의 피를 바른 자리’로 고쳐야 합니다.
