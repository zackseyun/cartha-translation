source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
  footnotes:
  - marker: a
    text: Or, 'on the spot where the blood of the guilt offering was applied.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 자기 손바닥에 있는 기름에서 조금을 취하여, 정결하게 되는 사람의 오른쪽 귓불과 오른손 엄지손가락과 오른발 엄지발가락에, 각각 속건제의 피를 바른 자리에 바릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속건제의 피가 적용된 곳’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: shall put
  chosen_korean: 바릅니다
  alternatives_korean:
  - 놓습니다
  - 붙입니다
  - 적용합니다
  lexicon: HALOT
  rationale: 의례 맥락에서 נתן은 단순한 ‘주다’보다 몸의 특정 부위에 기름을 ‘바르다’가 자연스럽고, 절차적 동작을 분명히 드러냅니다.
- source_word: מִן הַשֶּׁמֶן
  english_pob_choice: some of the oil
  chosen_korean: 기름에서 조금을
  alternatives_korean:
  - 기름의 일부를
  - 그 기름에서 일부를
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려, 기름 전체가 아니라 일부를 취한다는 점을 한국어로 간결하게 드러냈습니다.
- source_word: תְּנוּךְ אֹזֶן
  english_pob_choice: the lobe of the right ear
  chosen_korean: 오른쪽 귓불
  alternatives_korean:
  - 오른쪽 귀의 끝
  - 오른쪽 귀의 연골
  lexicon: HALOT
  rationale: תנוך은 제의 문맥에서 ‘귓불’이 가장 정확하고 현대적인 해부학적 대응어입니다.
- source_word: הַמִּטַּהֵר
  english_pob_choice: the one being cleansed
  chosen_korean: 정결하게 되는 사람
  alternatives_korean:
  - 정결함을 받는 사람
  - 정결하게 된 사람
  lexicon: HALOT
  rationale: 히트파엘 분사는 완료 상태보다 진행 중인 정결 절차를 나타내므로, ‘되는’으로 과정을 살렸습니다.
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  english_pob_choice: the thumb of his right hand / the big toe of his right foot
  chosen_korean: 오른손 엄지와 오른발 엄지
  alternatives_korean:
  - 오른손 엄지손가락과 오른발 엄지발가락
  - 오른손 엄지와 오른발 엄지발가락
  lexicon: HALOT
  rationale: בֹהֶן은 손과 발에서 각각 끝마디를 가리키며, 한국어에서는 간결하게 ‘엄지’로 대응하되 해부학적 의미가 유지되도록 했습니다.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  english_pob_choice: on the place of the guilt-offering blood
  chosen_korean: 속건제의 피가 있는 자리
  alternatives_korean:
  - 속건제의 피가 놓인 자리
  - 속건제 피의 자리
  lexicon: HALOT
  rationale: מקום은 단순한 ‘장소’보다 의례적으로 표시된 ‘자리’가 자연스럽고, POB의 ‘place’에 대응하면서 한국어 가독성을 높였습니다.
theological_decisions:
- issue: אָשָׁם의 제의 명칭
  chosen_reading: 속건제
  alternative_readings:
