  source_fidelity: 히브리어의 법규 도입 표현(זאת תהיה תורת), 대상(המצרע), 시간 표현(ביום טהרתו), 그리고 수동 절차(והובא)를 대체로 반영했습니다. 그러나 ‘나병 환자’는 현대 의학의 나병을 직접 가리킬 수 있어, צָרַעַת 관련 상태가 현대 나병과 반드시 일치하지 않는다는 원문의 어휘적 불확실성을 본문에서 충분히 보존하지 못합니다. 또한 ‘데려와져야 합니다’보다 ‘그 사람을 … 데려가야 합니다’가 히브리어 수동 절차를 자연스러운 한국어로 더 정확히 나타냅니다.
