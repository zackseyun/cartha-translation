  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
  footnotes:
  - marker: a
    text: Hebrew 'the leprous person' translates a term traditionally rendered 'leper,' referring to someone affected by a condition associated with צָרַעַת, not necessarily modern leprosy.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 나병 환자의 정결해지는 날에 대한 율법입니다. 그는 제사장에게로 데려와져야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '나병 환자'는 전통적으로 '문둥이'로 번역되던 용어를 반영하지만, 여기서는 현대 의학의 나병을 곧바로 뜻하는 것은 아니며, צָרַעַת과 관련된 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  english_pob_choice: the law for
  chosen_korean: 율법
  alternatives_korean:
  - 규례
  - 정결 규정
  - 지침
  lexicon: HALOT
  rationale: 레위기의 제의적 절차를 가리키는 용례이므로, POB의 'the law for'에 대응해 간명하게 '율법'으로 옮겼습니다.
- source_word: הַמְּצֹרָע
  english_pob_choice: the leprous person
  chosen_korean: 나병 환자
  alternatives_korean:
  - 문둥병 환자
  - 피부병 환자
  - 부정한 피부 질환을 가진 사람
  lexicon: HALOT
  rationale: 히브리어 מְצֹרָע는 현대 의학적 나병과 일치하지 않을 수 있지만, 한국어에서는 전통적으로 통용되는 표현을 유지하되, 본문의 정결 절차 맥락을 해치지 않도록 사용했습니다.
- source_word: טָהֳרָתוֹ
  english_pob_choice: his cleansing
  chosen_korean: 정결해지는
  alternatives_korean:
  - 정결함을 얻는
  - 깨끗해지는
  - 정화되는
  lexicon: HALOT
  rationale: 제의적 회복의 과정을 드러내기 위해 단순한 위생적 '깨끗해짐'보다 '정결해지는'을 택했습니다.
- source_word: וְהוּבָא
  english_pob_choice: he shall be brought
  chosen_korean: 데려와져야 합니다
  alternatives_korean:
  - 가져와져야 합니다
  - 인도되어야 합니다
  - 제사장에게로 끌려와야 합니다
  lexicon: HALOT
  rationale: 수동태의 피동성을 살리면서도 한국어에서 자연스러운 법령 문체로 표현했습니다. 다만 '인도되어야 합니다'보다 주체적 뉘앙스가 약해질 수 있어 문맥상 가장 무난한 '데려와져야 합니다'를 채택했습니다.
- source_word: אֶל הַכֹּהֵן
  english_pob_choice: to the priest
  chosen_korean: 제사장에게
  alternatives_korean:
  - 제사장에게로
  - 그 제사장에게
  - 한 제사장에게
  lexicon: HALOT
  rationale: 정관사 있는 특정 제사장을 가리키므로 '그'를 덧붙이지 않고도 한국어에서 목적지 표시가 분명한 '제사장에게'로 옮겼습니다.
theological_decisions:
- issue: מְצֹרָע의 한국어 전통 용어와 현대 의학적 오해
  chosen_reading: 나병 환자
  alternative_readings:
  - 문둥병 환자
  - 피부병 환자
  - 부정한 피부 질환을 가진 사람
  rationale: POB가 'leprous person'을 택해 현대 의학적 단정은 피하면서도 전통적 연속성을 유지하므로, 한국어도 가장 널리 알려진 용어를 사용하되 본문 이해를 제의적 정결 규정에 고정했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean; consistency of key terms, or documented exception.'
