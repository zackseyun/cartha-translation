  terminology: תּוֹרַת는 이 문맥에서 ‘규례’로, טָהֳרָתוֹ는 제의적 상태 변화를 나타내는 ‘정결하게 되는’으로 옮깁니다. הַמְּצֹרָע는 본문에서 ‘피부 질환이 있는 사람’으로 번역하고, 각주에서 전통적인 ‘나병’ 번역 및 현대 의학적 나병과의 비등치성을 설명합니다. 이는 영어 POB의 ‘leprous person’과 그 주석의 신중한 범위를 유지합니다.
