  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
  footnotes:
  - marker: a
    text: Or 'all the dust of the house' or 'all the mortar/plaster of the house.' The Hebrew is literally 'all the dust of the house,' but in this building context it likely refers to the scraped wall material.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 집을 헐고, 그 집의 돌들과 목재들과 집의 모든 흙[a]을 성 밖의 부정한 곳으로 내보내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘집의 모든 흙’입니다. 그러나 이 건축 문맥에서는 벽에서 긁어 낸 재료, 곧 회반죽이나 모르타르를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  english_pob_choice: Then he shall tear down
  chosen_korean: 헐어야 합니다
  alternatives_korean:
  - 무너뜨려야 합니다
  - 허물어야 합니다
  - 뜯어내야 합니다
  lexicon: HALOT
  rationale: 문맥상 오염된 집을 해체·철거하는 행위를 가리키므로, 현대 한국어에서 자연스럽고 강한 물리적 파괴를 나타내는 ‘헐다’를 선택했습니다. 의무형으로 옮겨 절차 규정의 성격도 살렸습니다.
- source_word: אֲבָנָיו / עֵצָיו
  english_pob_choice: its stones / its timbers
  chosen_korean: 그 집의 돌들과 그 나무들
  alternatives_korean:
  - 그 집의 돌들 / 그 집의 들보들
  - 그 집의 석재 / 그 집의 목재
  lexicon: HALOT
  rationale: 히브리어의 구체적 물질 이미지를 살리기 위해 돌과 목재를 직접 옮겼습니다. ‘timbers’의 건축적 뉘앙스는 한국어에서 가장 무리 없이 ‘나무들’로 전달하되, 구조재라는 점은 문맥이 보완합니다.
- source_word: כָּל עֲפַר הַבָּיִת
  english_pob_choice: all the plaster of the house
  chosen_korean: 그 집의 모든 흙
  alternatives_korean:
  - 그 집의 모든 먼지
  - 그 집의 모든 회반죽
  - 그 집의 모든 몰탈
  lexicon: HALOT
  rationale: 직역하면 ‘집의 모든 흙/먼지’이지만, 건축·정결 절차 문맥에서 POB처럼 벽을 긁어낸 재료를 가리키는 중의성이 있습니다. 한국어 본문에서는 원문의 물질성을 살려 ‘흙’으로 두고, 영어 POB의 해석적 선택은 과도하게 고정하지 않았습니다.
- source_word: אֶל מָקוֹם טָמֵא
  english_pob_choice: to an unclean place
  chosen_korean: 부정한 곳
  alternatives_korean:
  - 더러운 곳
  - 부정한 장소
  - 정결하지 않은 곳
  lexicon: HALOT
  rationale: 레위기의 טמא는 도덕적 오염보다 의례적·법적 부정 상태를 가리키므로, 전통적이면서도 문맥에 맞는 ‘부정한’을 사용했습니다. ‘장소’보다 간결한 ‘곳’이 이동 지시와 잘 맞습니다.
theological_decisions:
- issue: 정결/부정어휘의 유지
  chosen_reading: ‘부정한 곳’으로 옮겨 레위기의 의례적 정결 체계를 유지했습니다.
  alternative_readings:
  - 정결하지 않은 곳
  - 더러운 곳
  rationale: טמא는 본문 전체의 제의적 규정 체계에 속하는 용어이므로, 일상적 도덕 판단처럼 들리는 표현은 피했습니다. 이렇게 해야 오염된 집을 처리하는 법적·예전적 의미가 유지됩니다.
  doctrine_reference: 레위기 정결 규례의 용례 일관성
- issue: ‘돌들, 나무들, 모든 흙’의 물질성 유지
  chosen_reading: 해체된 건축 자재를 구체적으로 나열했습니다.
  alternative_readings:
  - 집을 완전히 부숴 없애라
  - 집을 철거하라
  rationale: 원문은 집 전체가 아니라 구성 요소를 분해해 बाहर 내보내는 절차를 말하므로, 추상적 요약보다 구체적 나열이 स्रोत의 강도를 더 잘 보존합니다.
  doctrine_reference: 본문의 절차적·법률적 서술 보존
