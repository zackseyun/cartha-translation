    rationale: 원문은 תֹּרִים와 בְּנֵי הַיּוֹנָה를 구별하여 제시합니다. 둘 다 ‘비둘기’로만 하면 첫 항의 구별이 사라집니다.
  - severity: medium
    issue: ‘자기 손이 미치는데로’의 직역 및 표기 오류
    rationale: 이는 재정적 능력을 뜻하는 히브리어 관용구이며, ‘데로’는 ‘대로’로 써야 합니다. ‘형편이 허락하는 대로’가 의미와 현대성을 함께 살립니다.
  - severity: low
