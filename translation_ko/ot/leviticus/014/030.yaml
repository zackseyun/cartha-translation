  terminology: תֹּרִים은 ‘산비둘기’, בְּנֵי הַיּוֹנָה는 ‘집비둘기 새끼’로 구별하여 레위기 제의 용어의 대조를 보존했습니다. ‘드리다’ 대신 제물에 통상 쓰이는 ‘바치다’를 사용했습니다.
  issues:
