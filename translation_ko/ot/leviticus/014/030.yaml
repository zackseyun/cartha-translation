  source_fidelity: 초안은 תֹּרִים(산비둘기/멧비둘기)를 일반적인 ‘비둘기’로 옮겨 종의 구별을 약화시키며, ‘자기 손이 미치는데로’는 히브리어 관용구를 지나치게 직역했고 표기도 ‘대로’가 맞습니다. מֵאֲשֶׁר תַּשִּׂיג יָדוֹ는 경제적 능력 또는 형편을 가리킵니다.
