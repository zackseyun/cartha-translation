  to: 그는 살아 있는 새를 성 밖의 들판으로 놓아주어야 합니다. 이렇게 하여 그는 그 집을 위하여 속죄해야 하며[a], 그 집은 정결해질 것입니다.
  rationale: ‘놓아주어야 합니다’는 의례적으로 새를 자유롭게 보내는 행위를 자연스럽게 나타냅니다. ‘성 밖의 들판’은 두 공간 표현을 분명히 하며, ‘이렇게 하여’는 순차적 연결을 살립니다. כפר는 ‘속죄’로 보존하되, 각주에서 정결/속죄 의례라는 가능한 번역 범위를 제시했습니다. 마지막 상태는 의례적 정결을 나타내도록 ‘정결해질 것입니다’로 수정했습니다.
