  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
  footnotes:
  - marker: a
    text: Or 'he shall purge the house' or 'he shall make expiation for the house.' The Hebrew uses priestly atonement language here in a ritual cleansing context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 살아 있는 새를 성 밖 들판으로 내보내야 합니다. 그렇게 그는 그 집을 위해 속죄하며, 그 집은 깨끗해질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 제의적 정결 문맥에서 ‘집을 위해 속죄하다’라는 히브리어 표현을 사용합니다. 따라서 ‘속죄’는 단순한 청소나 제거가 아니라 제사장적 속죄 언어를 반영합니다.
    reason: theological_note
lexical_decisions:
- source_word: וְשִׁלַּח
  english_pob_choice: Then he shall release
  chosen_korean: 내보내야 합니다
  alternatives_korean:
  - 놓아야 합니다
  - 풀어야 합니다
  - 보내야 합니다
  lexicon: HALOT
  rationale: 의례적 상황에서 새를 의도적으로 놓아주는 동작을 자연스럽게 살리면서, 단순한 ‘보내다’보다 해방·방출의 의미를 드러냅니다.
- source_word: הַצִּפֹּר הַחַיָּה
  english_pob_choice: the live bird
  chosen_korean: 살아 있는 새
  alternatives_korean:
  - 산 새
  - 생존한 새
  lexicon: HALOT
  rationale: 앞서 죽인 새와 대비되는 상태를 분명히 하면서 현대 한국어에서 가장 자연스럽게 읽히는 표현을 택했습니다.
- source_word: אֶל מִחוּץ לָעִיר אֶל פְּנֵי הַשָּׂדֶה
  english_pob_choice: outside the city into the open field
  chosen_korean: 성 밖 들판으로
  alternatives_korean:
  - 도시 밖 들판으로
  - 성 밖의 열린 들판으로
  - 성 밖 넓은 들판으로
  lexicon: HALOT
  rationale: 두 전치사구를 한국어에서 한 번에 묶어, 도시/성의 경계를 넘어 열린 들판으로 보내는 공간 이동을 간결하게 반영했습니다.
- source_word: וְכִפֶּר עַל הַבַּיִת
  english_pob_choice: he shall make atonement for the house
  chosen_korean: 그 집을 위해 속죄하며
  alternatives_korean:
  - 그 집을 위해 속죄하고
  - 그 집을 위해 속죄제사를 드리며
  - 그 집에 대해 속죄하며
  lexicon: HALOT
  rationale: 이 구절의 제의적 כפר를 단순한 정결만으로 풀지 않고, 원문과 POB의 ‘atonement’ 범주를 살려 ‘속죄’로 옮겼습니다. ‘집을 위해’는 עַל의 제의적 방향성을 반영합니다.
theological_decisions:
- issue: 제의적 정결 문맥에서 כפר를 어떻게 보존할지
  chosen_reading: ‘속죄’로 유지하여 집에 대한 제의적 속죄/정화의 긴장을 함께 드러냈습니다.
  alternative_readings:
  - ‘정결하게 하다’로 완화
  - ‘죄를 없애다’로 구체화
  rationale: 레위기의 본문은 집이라는 대상에도 제의적 속죄 언어를 사용하므로, 이를 단순 위생적 정화로 축소하지 않고 원문이 가진 제의적 범주를 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
- issue: 마지막 상태 진술 וְטָהֵר의 처리
  chosen_reading: ‘깨끗해질 것입니다’로 결과 상태를 표현했습니다.
  alternative_readings:
  - ‘정결해질 것입니다’
  - ‘깨끗하게 될 것입니다’
  rationale: 원문의 결과 상태를 자연스러운 한국어로 옮기되, 의례적 문맥에서의 순결/정결 의미를 과도하게 신학화하지 않았습니다.
  doctrine_reference: Readable modern Korean, ritual-purity context
