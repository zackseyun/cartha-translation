  naturalness: 현행 ‘그렇게 그는 그 집을 위해 속죄하며’는 합쇼체 문장에서 서술 종결과 양태가 불균형하여 다소 어색합니다. ‘이렇게 하여 그는 … 속죄해야 하며’는 자연스럽고 현대적인 격식체입니다.
  terminology: ‘속죄’는 제의적 כפר의 긴장을 보존하는 적절한 선택입니다. 마지막 טהר는 일반적 청결보다 의례적 상태를 가리키므로 ‘정결해질 것입니다’가 적합합니다. 각주는 대안 번역과 제의적 문맥을 중립적으로 밝혀야 하며, ‘단순한 청소나 제거가 아니다’라는 대조적 해설은 본문 번역에 불필요한 의미를 덧붙일 수 있습니다.
