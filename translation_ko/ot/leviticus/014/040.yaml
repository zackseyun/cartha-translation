  source_fidelity: 초안은 제사장이 돌을 제거하고 버리도록 지시한다는 기본 의미와 장소·정결 범주를 대체로 보존합니다. 그러나 ‘명하여 … 하라’는 명령의 수신자와 법규적 서술의 양태를 어색하게 처리합니다. 히브리어의 נֶגַע는 현대 의학적 ‘병’으로 특정되지 않은 집의 돌에 있는 병변/감염 표지이므로, 이를 더 중립적으로 옮기는 편이 적절합니다.
  naturalness: ‘그때’와 ‘명령해야 합니다’를 사용하면 현대 표준어 합쇼체의 절차 규정 문장으로 자연스럽습니다. ‘빼내어 … 던지라고 명령해야 합니다’는 제사장이 직접 행하는 것이 아니라 다른 이들에게 행하도록 명하는 구문을 분명히 합니다.
  terminology: ‘제사장’, ‘성읍’, ‘부정한’은 레위기의 제의적·정결 관련 용례에 적합합니다. נֶגַע는 의미를 과도하게 현대 질병으로 확정하지 않도록 ‘병변’으로 번역하고, 각주에서 문자적 표현과 가능한 대안을 제시합니다.
  issues:
  - severity: medium
    issue: ‘명하여 … 던지게 하라’가 법규적 진술과 제사장이 내리는 명령의 구조를 부자연스럽게 처리함
    rationale: וְצִוָּה는 제사장이 다른 사람들에게 돌을 제거하고 버리도록 명하는 행위입니다. 한국어에서는 ‘…하라고 명령해야 합니다’가 이를 명확하고 자연스럽게 나타냅니다.
  - severity: low
    issue: ‘그 병이 있는 돌들’은 돌에 적용되는 נֶגַע를 지나치게 질병처럼 들리게 하며 어색함
    rationale: נֶגַע는 집의 돌에 나타난 특정되지 않은 환부·표지입니다. ‘병변이 있는’은 현대 질병 진단을 단정하지 않으면서 문맥상 자연스럽습니다.
  revised_text: 그때 제사장은 그 병변이 있는 돌들을 빼내어 성읍 밖의 부정한 곳에 던지라고 명령해야 합니다.
