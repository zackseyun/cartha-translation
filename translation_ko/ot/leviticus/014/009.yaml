  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
  footnotes:
  - marker: a
    text: Or 'wash his flesh in water.' The Hebrew says 'his flesh,' a common idiom here for the person's body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제칠째 날에는 자기의 모든 털을 밀어야 합니다. 곧 그의 머리와 수염과 눈썹을 밀고, 그의 모든 털을 다시 밀어야 합니다. 또 자기 옷을 빨고, 물로 자기 몸을 씻어야 하며, 그러면 깨끗해집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  english_pob_choice: And on the seventh day
  chosen_korean: 그리고 제칠째 날에는
  alternatives_korean:
  - 제칠째 날에
  - 그리고 일곱째 날에는
  lexicon: HALOT
  rationale: 절차를 잇는 시간표현이므로 한국어에서는 자연스럽게 날짜를 앞세워 순서를 드러냈습니다.
- source_word: יְגַלַּח / וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  english_pob_choice: he shall shave off all his hair / He shall shave off all his hair
  chosen_korean: 자기의 모든 털을 밀어야 합니다… 그의 모든 털을 다시 밀어야 합니다
  alternatives_korean:
  - 자기 모든 털을 깎아야 합니다
  - 온몸의 털을 모두 밀어야 합니다
  lexicon: HALOT
  rationale: גלח는 단순한 정리가 아니라 털을 제거하는 뜻이므로 ‘밀다’로 옮겼고, 반복을 살려 총체적 제거를 강조했습니다.
- source_word: רֹאשׁוֹ… זְקָנוֹ… גַּבֹּת עֵינָיו
  english_pob_choice: his head… his beard, and his eyebrows
  chosen_korean: 그의 머리와 수염과 눈썹
  alternatives_korean:
  - 머리털과 수염과 눈썹
  - 머리와 턱수염과 눈썹
  lexicon: HALOT
  rationale: 히브리어의 부위 나열을 그대로 반영하되 한국어에서 자연스러운 신체 부위 표현으로 옮겼습니다.
- source_word: וְכִבֶּס אֶת בְּגָדָיו / וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  english_pob_choice: wash his clothes / bathe his body in water
  chosen_korean: 자기 옷을 빨고, 물로 자기 몸을 씻어야 하며
  alternatives_korean:
  - 자기 옷을 씻고, 물로 자기 몸을 씻어야 하며
  - 자기 옷을 빨고, 물에 몸을 씻어야 하며
  lexicon: HALOT
  rationale: כִּבֵּס는 의복 세탁이므로 ‘빨다’가 자연스럽고, בָּשָׂר는 이 문맥에서 ‘몸’이 가장 직접적입니다.
theological_decisions:
- issue: טָהֵר의 상태표현
  chosen_reading: 그러면 깨끗해집니다
  alternative_readings:
  - 그러면 정결해집니다
  - 그러면 깨끗한 상태가 됩니다
  rationale: 본문은 도덕적 무죄가 아니라 레위기 정결 상태를 말하므로, 상태의 전환을 간명하게 드러내는 ‘깨끗해집니다’를 택했습니다.
  doctrine_reference: 레위기 정결 규정의 상태 표지
