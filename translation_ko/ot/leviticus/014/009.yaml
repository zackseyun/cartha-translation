base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
  footnotes:
  - marker: a
    text: Or 'wash his flesh in water.' The Hebrew says 'his flesh,' a common idiom here for the person's body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 날에는 그의 모든 털을 밀어야 합니다. 곧 그의 머리털과 수염과 눈썹을 밀고, 그의 모든 털을 다시 밀어야 합니다. 또 그의 옷을 빨고, 물에 그의 몸[a]을 씻어야 합니다. 그러면 그는 정결해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 살을 물에 씻고’입니다. 여기서 ‘살’은 사람의 몸을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
