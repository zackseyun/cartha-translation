  source_fidelity: 초안은 제물의 두 종류와 각각의 용도를 대체로 반영하지만, תֹרִים(산비둘기/멧비둘기 계열)와 בְּנֵי יוֹנָה(집비둘기 새끼)를 모두 ‘비둘기’로 처리하여 구별을 잃었습니다. 또한 ‘가져다가 … 드리라’는 본문의 명시적 진술보다 행동을 더 보탭니다.
  naturalness: ‘그가 손에 닿는 대로’는 히브리어 관용구를 한국어에 직역하여 현대 표준어로 부자연스럽습니다. ‘그의 형편이 허락하는 대로’가 경제적 능력이라는 뜻을 자연스럽게 전달합니다. ‘하나는 … 하고, 다른 하나는 … 하십시오’는 합쇼체를 유지하면서 분배를 명료하게 합니다.
  terminology: תֹרִים는 ‘산비둘기’, בְּנֵי יוֹנָה는 ‘집비둘기 새끼’로 구별했습니다. חַטָּאת는 전통적 제의 용어인 ‘속죄제물’로 옮기되, 정결 의례 문맥의 ‘정결제물’ 가능성은 각주로 보존합니다. עֹלָה는 ‘번제물’로 옮깁니다.
  issues:
