    rationale: אֲשֶׁר תַּשִּׂיג יָדוֹ는 손이 미치는 범위, 곧 경제적 형편이 허락하는 범위를 뜻합니다.
  - severity: low
    issue: 본문에 없는 ‘가져다가’와 ‘드리라’의 명시적 추가
