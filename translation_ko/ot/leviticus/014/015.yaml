translation:
  language: ko
  text: 그러면 제사장은 한 로그의 기름 중 일부를 가져다가 자기 왼손바닥에 부어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 로그는 고대 액량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: Then ... shall take
  chosen_korean: 그러면 ... 가져다가
  alternatives_korean:
  - 그리고 ... 가져다가
  - 그다음 ... 취해야 합니다
  lexicon: WLC / HALOT
  rationale: 의례 지시의 순차적 진행을 자연스럽게 살리면서, 히브리어의 이어지는 절차적 흐름을 합쇼체로 반영했습니다.
- source_word: לֹג
  english_pob_choice: log
  chosen_korean: 로그
  alternatives_korean:
  - 한 로그의 양
  - 로그 단위
  lexicon: HALOT
  rationale: 고대 액량 단위는 한국어에서 현대 단위로 환산하기보다 음역을 유지하는 것이 원문 정보를 가장 정확하게 보존합니다.
- source_word: עַל כַּף ... הַשְּׂמָאלִית
  english_pob_choice: into the palm of his own left hand
  chosen_korean: 자기 왼손바닥에
  alternatives_korean:
  - 자기 왼손바닥 위에
  - 자기 왼손바닥 안에
  lexicon: HALOT
  rationale: עַל의 기본값은 '위에/에'이지만, 붓는 동작의 실제 의미를 한국어로는 '에 부어'와 함께 '왼손바닥'으로 옮기는 것이 가장 자연스럽고 구체적입니다.
