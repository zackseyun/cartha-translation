id: LEV.14.23
reference: Leviticus 14:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
  footnotes:
  - marker: a
    text: Or “for his purification.” The Hebrew term refers to the ritual cleansing process in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여덟째 날에 그는 자기 정결을 위하여 그것들을 제사장[a]에게, 곧 회막 어귀에서, 야훼 앞에 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장에게 정결 예식을 행하려고.” 여기서는 히브리어 용어가 이 문맥에서 의례적 정결 과정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם
  english_pob_choice: he shall bring them
  chosen_korean: 그는 … 그것들을 … 가져와야 합니다
  alternatives_korean:
  - 가져옵니다
  - 데려와야 합니다
  lexicon: HALOT
  rationale: 법적·의례적 지시문의 완료형은 한국어에서 의무적 미래로 옮기는 것이 자연스럽고, 목적어 אֹתָם은 앞선 의례 물품들을 가리키므로 ‘그것들’이 가장 직접적입니다.
- source_word: לְטָהֳרָתוֹ
  english_pob_choice: for his cleansing
  chosen_korean: 자기 정결을 위하여
  alternatives_korean:
  - 자기 깨끗하게 됨을 위하여
  - 자기 정화를 위하여
  lexicon: HALOT
  rationale: 문맥상 의례적 정결 회복을 가리키므로 ‘정결’이 가장 간명하며, ‘위하여’는 התהליך의 목적을 살립니다.
- source_word: אֶל הַכֹּהֵן
  english_pob_choice: to the priest
  chosen_korean: 제사장에게
  alternatives_korean:
  - 제사장 앞으로
  - 제사장에게로
  lexicon: HALOT
  rationale: 방향을 나타내는 전치사는 한국어에서 대상 표지로 자연스럽게 옮길 수 있으며, 의례 수행의 담당자에게 가져가는 뜻을 분명히 합니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 어귀에서
  alternatives_korean:
  - 회막 문간에서
  - 회막 문 앞에서
  lexicon: HALOT
  rationale: 장소 표지는 ‘~에서’로 처리하는 것이 한국어 합쇼체 서술에 자연스럽고, ‘회막’은 אֹהֶל מוֹעֵד의 고정된 번역을 따릅니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 주 앞에
  lexicon: HALOT
  rationale: YHWH의 인칭적 이름을 ‘야훼’로 유지하고, לִפְנֵי는 의례적·공간적 ‘앞에’로 옮겨 하나님의 현전 앞이라는 감각을 살립니다.
theological_decisions:
- issue: 이 절의 정결 용어를 어떻게 번역할 것인가
  chosen_reading: ‘정결’은 의례적 회복을 가리키는 표현으로 유지하고, ‘cleansing’처럼 결과와 과정을 함께 담는 한국어로 처리합니다.
  alternative_readings:
  - 정화
  - 깨끗함
  rationale: 레위기 14장의 문맥은 도덕적 정화가 아니라 피부질환 관련 의례 복귀이므로, 신학적 의미를 과도하게 확장하지 않으면서도 의례적 회복을 분명히 해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-text sense first; preserve cultic-purity context without importing later doctrinal claims'
