revisions:
- from: 그러면 집의 주인이 제사장에게 와서 말해야 합니다. 「집 안에 나병과 같은 것이 나타났습니다」.[a]
  to: 그러면 그 집의 주인은 제사장에게 와서 이렇게 보고해야 합니다. “집에 어떤 병변 같은 것이 제게 보입니다.”[a]
  rationale: ‘나병’이라는 특정 진단명을 피하여 נגע의 넓고 논쟁의 여지가 있는 의미를 보존했습니다. כְּ의 유사·추정 표현은 ‘병변 같은 것’으로, נִרְאָה לִי의 관찰자 관점은 ‘제게 보입니다’로 반영했습니다. 절차적 문맥에 맞게 ‘보고해야 합니다’를 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:01:41Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. כְּנֶגַע는 화자가 확정적으로 진단한 ‘나병’이 아니라, 집에서 관찰된 נגע와 같은 현상을 조심스럽게 보고하는 표현입니다. ‘나병과 같은 것’은 이 구절에서 부당하게 특정 질병으로 좁힙니다. 또한 לִי(‘제게/내게’)의 관찰자 표지가 본문에서 빠졌습니다.
  naturalness: ‘집에 어떤 병변 같은 것이 제게 보입니다’는 현대 표준어 합쇼체로 자연스럽고, 제사장에게 하는 공식적 보고의 어조에도 맞습니다. ‘말해야 합니다’보다 ‘이렇게 보고해야 합니다’가 נגד의 절차적 보고 의미를 더 잘 드러냅니다.
  terminology: נגע는 이 문맥에서 현대 의학상의 나병 또는 전염병으로 단정할 수 없습니다. 본문에서는 ‘병변 같은 것’으로 넓게 옮기고, 각주에서 히브리어의 폭넓은 의미와 화자의 비진단적 보고를 설명합니다. ‘제사장’은 적절합니다.
  issues:
  - severity: high
    issue: ‘나병과 같은 것’이 נגע를 특정 질병으로 과도하게 한정합니다.
    rationale: 레위기 14장의 집에 관한 נגע는 현대 의학적 나병 진단을 뜻하지 않으며, כְּ가 붙어 화자가 단지 유사한 현상을 보고함을 나타냅니다.
  - severity: medium
    issue: לִי(‘제게’)가 번역에서 누락되었습니다.
    rationale: 화자는 객관적 확진을 선언하는 대신 자신에게 관찰된 것으로 보고합니다. 이 제한된 관찰의 뉘앙스를 보존해야 합니다.
  - severity: low
    issue: וְהִגִּיד의 공식적 보고 뉘앙스가 ‘말해야 합니다’에서 다소 약합니다.
    rationale: 제사장에게 알리는 정결 절차의 맥락이므로 ‘보고해야 합니다’가 더 정확하고 자연스럽습니다.
  revised_text: 그러면 그 집의 주인은 제사장에게 와서 이렇게 보고해야 합니다. “집에 어떤 병변 같은 것이 제게 보입니다.”[a]
