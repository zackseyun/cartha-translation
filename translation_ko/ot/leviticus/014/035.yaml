translation:
  language: ko
  text: 그러면 그 집의 주인은 제사장에게 와서 이렇게 보고해야 합니다. “집에 어떤 병변 같은 것이 제게 보입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּנֶגַע는 직역하면 ‘병변/재앙 같은 것’입니다. נגע는 여기서 현대 의학상의 나병이나 전염병을 확정적으로 가리키지 않으며, 화자는 집에서 보이는 이상 징후를 진단하지 않고 보고할 뿐입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא אֲשֶׁר לוֹ הַבַּיִת
  english_pob_choice: then the owner of the house shall come
  chosen_korean: 그러면 집의 주인이 와서
  alternatives_korean:
  - 그리고 그 집에 속한 자가 와서
  - 그 집의 소유자가 와서
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 드러내는 현대 한국어로 옮기되, 법적 절차의 순차성을 살려 '그러면'을 사용했습니다.
- source_word: וְהִגִּיד לַכֹּהֵן
  english_pob_choice: and tell the priest
  chosen_korean: 제사장에게 말해야 합니다
  alternatives_korean:
  - 제사장에게 보고해야 합니다
  - 제사장에게 알려야 합니다
  lexicon: HALOT
  rationale: 히필 נגד의 '알리다/알려주다' 의미를 살리면서, 절차 문맥에서 자연스러운 '말하다'를 채택했습니다.
- source_word: כְּנֶגַע
  english_pob_choice: Something like a plague
  chosen_korean: 나병과 같은 것
  alternatives_korean:
  - 재앙 같은 것
  - 부정한 병변 같은 것
  - 플라그 같은 것
  lexicon: HALOT
  rationale: נגע는 레위기 정결 문맥에서 단순한 의학적 질병보다 의식적 부정의 징후를 가리키므로, POB의 'plague'를 반영하되 한국어에서는 문맥상 의미가 드러나는 '나병과 같은 것'으로 옮겼습니다.
- source_word: נִרְאָה לִי
  english_pob_choice: has appeared to me
  chosen_korean: 나타났습니다
  alternatives_korean:
  - 보였습니다
  - 보이는 것 같습니다
  lexicon: HALOT
  rationale: 화자가 확정 진단이 아니라 관찰된 현상만 진술한다는 점을 살리기 위해, 주관적 인식을 드러내는 '나타났습니다'를 사용했습니다.
theological_decisions:
- issue: נגע의 성격을 한국어로 어떻게 전달할지
  chosen_reading: 의학적 확진보다 의식적·제의적 위험 징후를 가리키는 표현으로 읽고, 본문에는 '나병과 같은 것'을 사용했습니다.
  alternative_readings:
  - '''전염병 같은 것'''
  - '''부정한 병변 같은 것'''
  rationale: 레위기 14장의 문맥에서는 진단명보다 제사장 판단을 요청하는 표지라는 점이 중요합니다. 따라서 확정적 병명으로 좁히지 않되, 경고성 징후임을 드러냈습니다.
  doctrine_reference: 레위기 정결법의 제의적 불결 개념
