id: LEV.14.26
reference: Leviticus 14:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הַ/שֶּׁ֖מֶן יִצֹ֣ק הַ/כֹּהֵ֑ן עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
  footnotes:
  - marker: a
    text: Literally, 'onto the palm of the priest, the left [one].'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기름 중에서 제사장은 그의 왼손 손바닥에 붓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘제사장의 손바닥, 왼쪽 [손바닥]’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 중에서
  alternatives_korean:
  - 그리고 그 기름에서
  - 그리고 일부를
  lexicon: HALOT
  rationale: 연속 접속사 וּ를 살리면서 מן의 출처·부분성을 자연스럽게 드러내기 위해 ‘… 중에서’를 택했습니다. ‘일부를’은 의미를 보강하지만 원문에 없는 분량을 특정할 수 있습니다.
- source_word: הַ/שֶּׁמֶן
  english_pob_choice: the oil
  chosen_korean: 기름
  alternatives_korean:
  - 그 기름
  - 그 관유
  lexicon: HALOT
  rationale: 문맥상 이미 언급된 의식용 기름을 가리키므로 ‘기름’으로 간결하게 옮겼습니다. ‘관유’는 가능하지만 여기서는 원문이 덧붙이지 않은 설명을 앞세우지 않았습니다.
- source_word: יִצֹק
  english_pob_choice: shall pour
  chosen_korean: 붓습니다
  alternatives_korean:
  - 부을 것입니다
  - 쏟습니다
  lexicon: HALOT
  rationale: 의례 절차 속 미래/명령적 용법을 현대 한국어의 절차문체로 옮겼습니다. ‘쏟습니다’는 과도하게 흘려붓는 뉘앙스를 더할 수 있습니다.
- source_word: כַּף הַ/כֹּהֵן הַ/שְּׂמָאלִית
  english_pob_choice: onto the palm of his own left hand
  chosen_korean: 그의 왼손 손바닥에
  alternatives_korean:
  - 제사장의 왼손 손바닥에
  - 왼손의 손바닥에
  lexicon: HALOT
  rationale: 히브리어의 ‘제사장의 손바닥, 왼쪽 [손바닥]’이라는 구조를 한국어에서는 소유격과 부위 표현으로 자연스럽게 처리했습니다. POB의 ‘his own left hand’는 중복을 피한 해석적 정리로 이해되며, 핵심은 왼쪽 손바닥이라는 위치입니다.
theological_decisions:
- issue: 의례 동작의 절차적·지시적 시제
  chosen_reading: 현재형 종결로 절차 지시를 표현했습니다.
  alternative_readings:
  - 미래형으로 ‘부을 것입니다’
  - 명령형으로 ‘붓게 하십시오’
  rationale: 레위기 의식 규정의 히브리어 완료/미완료는 서술적 미래라기보다 절차 지시로 기능하므로, 한국어에서도 독자에게 의례 순서를 분명히 전달하는 현재형을 택했습니다.
  doctrine_reference: 레위기 제의법 문맥의 규범적 절차 표현
