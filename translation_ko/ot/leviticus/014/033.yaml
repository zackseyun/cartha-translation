translation:
  language: ko
  text: 야훼께서 모세와 아론에게 말씀하여 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘여호와’로 옮겨집니다. 여기서는 고유한 신명으로서 ‘야훼’를 사용했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 서사 도입 공식에서 דבר의 발화 개시를 자연스럽게 살리기 위해 ‘말씀하여 이르셨습니다’로 옮겼습니다. 단순한 ‘말했다’보다 격식이 있고, 뒤의 직접 인용 도입과도 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어 ‘주님’이 아니라 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨, 출애굽-레위기 문맥의 언약적 이름을 드러냈습니다.
- source_word: אֶל / וְאֶל
  english_pob_choice: to / and to
  chosen_korean: -에게 / -와 아론에게
  alternatives_korean:
  - -에게
  - -한테
  lexicon: HALOT
  rationale: 모세와 아론이 모두 직접 수신자임을 드러내기 위해 두 목적어를 병렬로 유지했습니다. 한국어에서는 첫 항목의 조사만 생략되고 둘째 항목에만 ‘-에게’를 붙여도 자연스럽습니다.
- source_word: מֹשֶׁה / אַהֲרֹן
  english_pob_choice: Moses / Aaron
  chosen_korean: 모세 / 아론
  alternatives_korean:
  - 모세 / 아론
  lexicon: 표준 고유명사 표기
  rationale: 한국어 성경에서 널리 인식되는 표기인 ‘모세’, ‘아론’을 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고
  lexicon: HALOT
  rationale: 히브리어의 전형적인 인용 도입어는 한국어에서 종종 ‘이르시되’로도 옮기지만, 본문은 직접화법이 이어지지 않는 서술형 단독절이므로 매끄럽게 ‘이르셨습니다’로 처리했습니다.
theological_decisions:
- issue: 여호와 대체 번역을 둘러싼 신명 처리
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 독자에게 하나님의 언약 이름이 숨겨지지 않도록 고유명사 표기를 유지했습니다. 이는 POB의 신명 원문 가시화 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
