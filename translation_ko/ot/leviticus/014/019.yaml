id: LEV.14.19
reference: Leviticus 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
  footnotes:
  - marker: a
    text: Or 'the purification offering.' The Hebrew term חַטָּאת can denote the offering used for purification in Levitical ritual contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 속죄제[a]를 드리고, 그 부정함에서 정결하게 되는 이를 위하여 속죄한 후에 번제물을 잡아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת는 레위기의 제의 문맥에서 정결을 위한 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  english_pob_choice: shall offer
  chosen_korean: 드리고
  alternatives_korean:
  - 행하고
  - 바치고
  lexicon: HALOT
  rationale: 제사 행위를 한국어로 자연스럽게 옮기되, 제의적 수행의 뜻을 살려 ‘드리다’를 택했습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 속죄제물
  - 죄제
  lexicon: HALOT
  rationale: 레위기 제의 문맥에서 חַטָּאת는 제물 명칭으로 기능하므로, 한국어 성경 전통과 소스의 제의적 기능을 함께 반영하는 ‘속죄제’를 사용했습니다.
- source_word: וְכִפֶּר עַל
  english_pob_choice: make atonement for
  chosen_korean: 속죄를 행한
  alternatives_korean:
  - 속죄하여
  - 대속하여
  lexicon: HALOT
  rationale: כפר의 제사장적 용례를 직접 반영해 ‘속죄를 행하다’로 옮겨, 단순한 감정적 용서가 아니라 의례적 속죄 행위를 드러냈습니다.
- source_word: הַמִּטַּהֵר מִטֻּמְאָתוֹ
  english_pob_choice: the one being cleansed from his uncleanness
  chosen_korean: 그의 부정함에서 깨끗하게 된 사람
  alternatives_korean:
  - 부정함에서 정결하게 된 사람
  - 그의 불결함에서 깨끗하게 된 사람
  lexicon: HALOT
  rationale: מִטַּהֵר의 진행·수동 뉘앙스를 살리면서, טֻמְאָה를 제의적 용어인 ‘부정함’으로 옮겼습니다. ‘깨끗하게 된 사람’은 한국어에서 자연스럽고 과정의 결과를 분명히 합니다.
- source_word: יִשְׁחַט
  english_pob_choice: he shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 잡습니다
  lexicon: HALOT
  rationale: 제사 동물에 대한 표준 동사이지만, 한국어에서는 의례 지시문으로서 ‘잡다’가 가장 간결하고 자연스럽습니다. 제의적 의미는 문맥의 번제와 함께 유지됩니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미를 어떻게 한국어로 드러낼지
  chosen_reading: ‘속죄제’로 옮기되, 문맥상 속죄 의례라는 점을 본문에서 유지합니다.
  alternative_readings:
  - ‘죄제물’
  - ‘정결제’
  rationale: 레위기 14장 정결 절차 안에서도 חַטָּאת는 제물의 기술 용어로 기능합니다. 한국어에서 가장 널리 인식되는 제의 용어는 ‘속죄제’이므로 이를 채택하되, 문맥의 정결/속죄 기능을 희석하지 않도록 구성했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
