  source_fidelity: 수정이 필요합니다. 초안은 조건 표지 וְאִם(‘그러나/만일 …하면’)를 실제 번역문에서 누락했으며, הִטּוֹחַ에 없는 ‘다시’를 첨가했습니다. 또한 ‘그것이 다시 발라진’은 선행사가 불분명합니다. נגע는 집에도 적용되는 기술적 표지이므로 단순한 의학적 ‘병’으로 단정하기보다 ‘병변’으로 옮기고 주석으로 범위를 밝혀 두는 편이 적절합니다.
  naturalness: ‘집을 긁어낸’은 무엇을 긁어 내는지 다소 불분명하고, ‘그것이 다시 발라진’은 한국어로도 어색합니다. ‘집을 긁어 낸’ 및 ‘회반죽을 바른’으로 고치면 절차의 물리적 의미와 자연스러운 문장이 살아납니다. 본절은 다음 절로 이어지는 조건절이므로 끝의 쉼표를 유지했습니다.
  terminology: ‘병변’은 נגע의 광범위한 표지·병적 상태를, 집에 적용되는 이례적 용법까지 포함하여 비교적 중립적으로 나타냅니다. ‘부정’은 본 어휘 자체의 직접적인 번역이 아니며, ‘감염’은 원문이 확정하지 않는 의학적 원인을 암시하므로 피했습니다. ‘회반죽’은 טוח의 미장/도포 행위를 구체적으로 전달합니다.
