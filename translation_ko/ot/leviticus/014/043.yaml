  text: וְ/אִם יָשׁ֤וּב הַ/נֶּ֨גַע֙ וּ/פָרַ֣ח בַּ/בַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת הָ/אֲבָנִ֑ים וְ/אַחֲרֵ֛י הִקְצ֥וֹת אֶת הַ/בַּ֖יִת וְ/אַחֲרֵ֥י הִטּֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
  footnotes:
  - marker: a
    text: Or 'the infection' or 'the affliction' for 'the disease' (Hebrew negaʿ), a technical term in Leviticus for a marked diseased condition affecting persons, garments, or houses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 돌들을 빼내고 집을 긁어 낸 뒤, 또 회반죽을 바른 뒤에 그 병변이 집 안에 다시 생겨 퍼지면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네가(נגע)는 레위기에서 사람, 옷, 집에 나타나는 병적 표지 또는 환부를 가리키는 기술적 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ~한다면
  alternatives_korean:
  - 그리고 ~한다면
  - 만일 ~한다면
  lexicon: HALOT
  rationale: 앞 절의 정화 절차를 이어 받는 조건문이므로, 단순한 연결보다 대비를 드러내는 ‘그러나’가 문맥상 적절합니다.
- source_word: יָשׁוּב הַנֶּגַע
  english_pob_choice: the disease returns
  chosen_korean: 병이 … 다시 돌아와
  alternatives_korean:
  - 질병이 … 다시 돌아와
  - 부정이 … 되돌아와
  lexicon: HALOT
  rationale: נגע는 레위기에서 사람·옷·집에 나타나는 기술적 ‘부정/질병 상태’이므로, 의미를 지나치게 완화하지 않으면서도 현대 한국어에서 자연스러운 ‘병’으로 옮겼습니다.
- source_word: וּפָרַח בַּבַּיִת
  english_pob_choice: and breaks out in the house
  chosen_korean: 집 안에서 … 퍼지고
  alternatives_korean:
  - 집에서 … 번지고
  - 집 안에서 … 다시 나타나고
  lexicon: HALOT
  rationale: פָרַח의 비유적 의미인 ‘솟아나다/퍼지다’를 살려, 집 내부에서 재발하는 감염성 징후를 ‘퍼지다’로 표현했습니다.
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  english_pob_choice: after he has removed the stones
  chosen_korean: 돌들을 빼낸 뒤에
  alternatives_korean:
  - 돌들을 제거한 뒤에
  - 돌들을 떼어 낸 뒤에
  lexicon: HALOT
  rationale: 해당 정비 절차의 물리적 행위를 직설적으로 드러내기 위해 ‘빼내다’를 선택했습니다.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  english_pob_choice: and after he has scraped the house
  chosen_korean: 집을 긁어낸 뒤에
  alternatives_korean:
  - 집을 긁어 깎은 뒤에
  - 집을 긁어낸 후에
  lexicon: HALOT
  rationale: קצה의 이 문맥상 의미를 ‘긁어내다/긁어 깎다’로 살려, 표면을 벗겨내는 소독·정비 행위를 구체적으로 보이게 했습니다.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  english_pob_choice: and after it has been plastered
  chosen_korean: 그리고 그것이 다시 발라진 뒤에
  alternatives_korean:
  - 그리고 그것이 다시 회반죽해진 뒤에
  - 그리고 그것이 다시 미장된 뒤에
  lexicon: HALOT
  rationale: טוח는 집에 대한 ‘바르다/회반죽하다’의 뜻이므로, 현대 독자가 이해하기 쉬운 ‘다시 발라지다’로 옮겼습니다. 주체를 드러내지 않는 수동형도 원문 구조를 보존합니다.
theological_decisions:
- issue: 레위기 14장의 집 질병/부정 상태를 어떻게 표기할지
  chosen_reading: 기술적 용어를 일반적인 ‘병’으로 풀되, 문맥의 반복·재발과 정비 절차가 드러나도록 유지했습니다.
  alternative_readings:
  - 부정이 다시 나타나고
  - 감염이 다시 번지고
  rationale: 본문은 의료적 진단보다 제의적 판정 절차를 말하지만, 한국어에서는 너무 전문적인 제의어보다 문맥을 즉시 이해할 수 있는 표현이 필요합니다. 동시에 14:43의 조건문 구조와 ‘다시 돌아와 퍼지다’의 경고성을 보존했습니다.
  doctrine_reference: 레위기 14장 정결/부정 규례
