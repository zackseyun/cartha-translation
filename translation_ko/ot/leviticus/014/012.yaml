  text: 그때에 제사장은 어린 수양 한 마리와 기름 한 로그[a]를 가져다가, 그 어린 수양을 속건제물[b]로 드리고 그것들을 야훼 앞에서 요제로 흔들어 바쳐야 합니다.
  philosophy: optimal-equivalence
