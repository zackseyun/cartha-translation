  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
  footnotes:
  - marker: a
    text: Or 'the one being purified.' The Hebrew refers to the person undergoing the prescribed ritual cleansing.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall come into the camp.' The Hebrew form can be read as simple future ('shall come') or permissive ('may come'); the context suggests permitted reentry with continued restrictions.
    reason: alternative_reading
translation:
  language: ko
  text: 정결 예식을 받는 사람[a]은 자기 옷을 빨고, 모든 털을 밀고, 물로 몸을 씻어야 합니다. 그러면 정결하게 됩니다. 그 뒤에 그는 진영 안으로 들어올 수 있지만[b], 칠 일 동안 자기 장막 밖에 머물러야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결하게 되는 사람.’ 히브리어는 정해진 정결 예식을 진행 중인 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진영 안으로 들어올 것입니다.’ 히브리어 동사는 단순 미래로도 읽을 수 있으나, 이어지는 장막 밖 거주의 제한으로 보아 제한된 재입국의 허용을 나타내는 것으로 이해할 수 있습니다.
    reason: alternative_reading
