  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
  footnotes:
  - marker: a
    text: Or 'depressions' for 'sunken areas.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'lower than the wall'; that is, appearing recessed below the wall surface.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 병변을 살펴보아야 합니다. 그 병변이 집 벽에 푸르스름하거나 붉은빛을 띤 움푹 패인 자리들로 나타나고, 그 모양이 벽보다 더 낮아 보이면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘벽보다 낮은’; 즉 벽면 아래로 들어가 보이는 상태를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: He shall examine
  chosen_korean: 살펴보아야 합니다
  alternatives_korean:
  - 검사해야 합니다
  - 살펴봅니다
  lexicon: HALOT
  rationale: 제사장이 하는 규정적 판별 행위이므로 단순한 ‘보다’보다 ‘살펴보다/검사하다’가 문맥의 절차성을 더 잘 드러냅니다.
- source_word: הַנֶּגַע
  english_pob_choice: the infection
  chosen_korean: 그 병변
  alternatives_korean:
  - 그 감염
  - 그 환부
  - 그 질환 부위
  lexicon: HALOT
  rationale: 레위기 13–14장의 נגע는 사람과 집에 생기는 이상 징후를 가리키므로, 현대 한국어에서는 병리적 표지로서의 뜻을 살리는 ‘병변’이 가장 자연스럽고 오해가 적습니다.
- source_word: שְׁקַֽעֲרוּרֹת
  english_pob_choice: sunken areas
  chosen_korean: 움푹 패인 자리들
  alternatives_korean:
  - 함몰된 곳들
  - 오목한 자리들
  - 패여 들어간 곳들
  lexicon: HALOT
  rationale: 희귀어의 핵심은 표면보다 들어간 움푹한 모양이므로, ‘움푹 패인 자리들’이 시각적 의미를 가장 직관적으로 전달합니다.
- source_word: יְרַקְרַקֹּת / אֲדַמְדַּמֹּת
  english_pob_choice: greenish or reddish
  chosen_korean: 푸르스름하거나 붉은빛을 띠고
  alternatives_korean:
  - 연녹색이거나 붉은빛인
  - 초록빛이거나 붉은빛인
  - 푸르거나 붉은
  lexicon: HALOT
  rationale: 중복형 형용사는 강한 색이 아니라 약화된 색조를 나타내므로, ‘-스름하다’와 ‘붉은빛을 띠다’로 그 미세한 색감을 살렸습니다.
- source_word: שָׁפָל מִן הַקִּיר
  english_pob_choice: is deeper than the wall
  chosen_korean: 벽보다 더 낮아 보이면
  alternatives_korean:
  - 벽면보다 더 들어가 보이면
  - 벽보다 더 깊어 보이면
  - 벽면보다 더 낮으면
  lexicon: HALOT
  rationale: 직역하면 ‘벽보다 낮다’이지만, 진단 문맥에서는 벽 표면 아래로 들어간 듯 보이는 상태를 뜻하므로 ‘더 낮아 보이다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 집의 벽에 생긴 이상 징후를 다루는 정결 판정 언어
  chosen_reading: ‘병변’과 ‘살펴보다’로 옮겨, 제사장의 진단 행위를 의학적/법적 판별로 동시에 읽히게 했습니다.
  alternative_readings:
  - 전통적으로 ‘문둥병’이나 ‘나병’ 계열로 좁혀 번역하는 방식
  - 단순히 ‘보다’로 완화하는 방식
  rationale: 본문은 사람의 질병 이름보다 집에 나타난 부정한 징후의 판별 절차를 말하므로, 과도한 전통 용어보다 מקור의 범위를 보존하는 표현이 필요합니다.
  doctrine_reference: 레위기 14장의 정결 규례와 제사장 판정 기능
