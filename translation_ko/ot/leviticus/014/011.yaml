  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: ko
  text: 그리고 제사장은 정결하게 하는 사람으로서 정결하게 되는 그 남자와 그 물건들을 여호와 앞, 곧 회막 입구에 세워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘정결하게 하는 제사장’이지만, 한국어에서는 직무를 설명하는 풀어쓰기 형태가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  english_pob_choice: shall present
  chosen_korean: 세워야 합니다
  alternatives_korean:
  - 데려다 놓아야 합니다
  - 제시해야 합니다
  - 나타나게 해야 합니다
  lexicon: HALOT
  rationale: הֶעֱמִיד의 핵심은 의례적으로 ‘서게 하다’이며, 제의 문맥에서는 단순 이동보다 하나님 앞에 공식적으로 세우는 행위가 중요하므로 ‘세우다’를 살렸습니다.
- source_word: הַכֹּהֵן הַמְטַהֵר
  english_pob_choice: the priest who cleanses
  chosen_korean: 정결하게 하는 사람으로서
  alternatives_korean:
  - 정결하게 하는 제사장으로서
  - 정결시키는 제사장으로서
  - 정결 의식을 행하는 제사장으로서
  lexicon: HALOT
  rationale: 분사구는 제사장의 직무를 가리키므로 직역하되, 제사장이 도덕적 정결의 원인이 아니라 의례적 정결 절차를 집행하는 사람임이 드러나게 했습니다.
- source_word: הַמִּטַּהֵר
  english_pob_choice: who is being cleansed
  chosen_korean: 정결하게 되는
  alternatives_korean:
  - 깨끗하게 되는
  - 정결을 받는
  - 정결케 되는
  lexicon: HALOT
  rationale: 히트파엘의 수동·반사 뉘앙스를 살려, 해당 남자가 정결 절차의 대상이 되어 가는 상태를 자연스러운 한국어로 표현했습니다.
- source_word: וְאֹתָם
  english_pob_choice: along with those things
  chosen_korean: 그 물건들을
  alternatives_korean:
  - 그것들을
  - 그들과 함께
  - 그것들과 함께
  lexicon: HALOT
  rationale: 대명사는 앞절에 언급된 제의적 물품들을 가리키므로, 문맥상 대상이 분명하도록 ‘그 물건들’로 풀었습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞
  alternatives_korean:
  - 야훼 앞
  - 주님 앞
  - 하나님 앞
  lexicon: HALOT
  rationale: 본문의 신명 표기를 한국어 교회 언어에서 가장 널리 인식되는 형태로 옮기되, 제의적 현존 표현인 ‘앞’은 그대로 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 영어 POB가 본문의 신명 הנאמר을 Yahweh로 드러내지만, 한국어 본문은 가독성과 전통적 인지도를 고려해 ‘여호와’로 옮겼습니다. 본문의 제의 현장성을 흐리지 않기 위해 일반 대체어인 ‘주’는 피했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
