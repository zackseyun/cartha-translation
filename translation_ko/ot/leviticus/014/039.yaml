  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: ko
  text: 그리고 제사장은 일곱째 날에 돌아와 살펴보고, 보기에 그 병이 집의 벽들에 퍼져 있으면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁ֥ב הַ/כֹּהֵ֖ן
  english_pob_choice: Then the priest shall return
  chosen_korean: “제사장은 … 돌아와”
  alternatives_korean:
  - “제사장은 … 다시 오고”
  - “제사장은 … 되돌아와”
  lexicon: כהן
  rationale: הכֹּהֵן은 제사장으로 옮기고, וְשָׁב는 문맥상 다시 방문하는 동작이므로 “돌아와”로 자연스럽게 살렸습니다.
- source_word: בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י
  english_pob_choice: on the seventh day
  chosen_korean: “일곱째 날에”
  alternatives_korean:
  - “일곱 번째 날에”
  - “일곱 날째에”
  lexicon: שביעי
  rationale: 히브리어 서수 표현을 표준적인 성경 한국어로 간결하게 옮겼습니다.
- source_word: וְ/רָאָ֕ה וְ/הִנֵּ֛ה
  english_pob_choice: and look, and if
  chosen_korean: “살펴보고, 보기에”
  alternatives_korean:
  - “보고, 보니”
  - “살펴보니”
  lexicon: ראה / הנה
  rationale: ראה의 관찰 동작과 הנה의 주의 환기를 함께 반영하되, 영어 POB의 개정처럼 ‘behold’를 별도 감탄으로 과장하지 않고 문맥 속 관찰 진술로 처리했습니다.
- source_word: פָּשָׂ֥ה הַ/נֶּ֖גַע
  english_pob_choice: the infection has spread
  chosen_korean: “그 병이 … 퍼져 있으면”
  alternatives_korean:
  - “그 환부가 … 번져 있으면”
  - “그 부패가 … 확산되어 있으면”
  lexicon: נגע
  rationale: נגע는 문맥상 집에 생긴 질환성 손상으로, 한국어에서 병/병변 의미가 자연스러워 “병”으로 옮기고 פָּשָׂה의 진행 결과를 현재완료적 조건으로 살렸습니다.
- source_word: בְּ/קִירֹ֥ת הַ/בָּֽיִת
  english_pob_choice: in the walls of the house
  chosen_korean: “집의 벽들에”
  alternatives_korean:
  - “집 벽에”
  - “그 집의 벽에”
  lexicon: קיר
  rationale: 복수형 벽들을 반영해 “벽들”로 옮겼고, 장소 전치사 בְּ는 한국어 조사로 자연스럽게 처리했습니다.
