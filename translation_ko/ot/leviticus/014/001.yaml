theological_decisions:
- issue: לֵאמֹר의 처리
  chosen_reading: 직접인용 도입을 나타내는 서술 연결로 처리하여 ‘말씀하여 이르셨습니다’로 옮김
  alternative_readings:
  - ‘말씀하시며’
  - ‘말하여’
  rationale: 히브리어 서술 관용구에서 לֵאמֹר는 실제 발화 내용을 예고하는 기능이므로, 한국어에서도 그 기능이 드러나도록 번역했습니다. 단순 반복을 피하면서도 다음 절의 인용 도입을 예고합니다.
  doctrine_reference: 서술 관용구의 기능 보존
