  rationale: 히브리어 דבר의 서술 공식으로, 단순한 ‘말하다’보다 공식적이고 구약 서술에 자연스러운 ‘말씀하다’가 적절합니다. 이어지는 לֵאמֹר의 기능을 살려 ‘이르셨습니다’를 더해 발화 도입을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 신명기적/율법서의 하나님의 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약의 이름을 보존했습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
