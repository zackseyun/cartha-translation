  rationale: 히브리어 דבר의 서술 공식으로, 단순한 ‘말하다’보다 공식적이고 구약 서술에 자연스러운 ‘말씀하다’가 적절합니다. 이어지는 לֵאמֹר의 기능을 살려 ‘이르셨습니다’를 더해 발화 도입을 분명히 했습니다.
