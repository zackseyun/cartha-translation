reference: Leviticus 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
  footnotes:
  - marker: a
    text: Hebrew literally, 'his hand does not reach'; that is, he lacks sufficient means.
    reason: lexical_alternative
  - marker: b
    text: A 'log' is a small liquid measure used in Israelite ritual law.
    reason: cultural_note
translation:
  language: ko
  text: 그가 가난하고, 그의 손이 미치지 못하면, 속죄를 위해 흔들어 드릴 한 마리의 수양을 가져오고, 기름에 섞은 고운 가루 십분의 일 에바를 곡식 제물로, 그리고 기름 한 로그를 가져와야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의 손이 미치지 못한다’로, 곧 그가 충분한 재력을 갖지 못한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘로그’는 이스라엘 제의법에서 쓰이는 작은 액량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל / poor
  english_pob_choice: poor
  chosen_korean: 가난하고
  alternatives_korean:
  - 궁핍하고
  - 형편이 어려우며
  lexicon: HALOT
  rationale: דַּל은 경제적 빈곤을 가리키므로, 법률 문맥에서 가장 직접적인 표준어인 ‘가난하다’가 적절합니다.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת / his means are insufficient
  english_pob_choice: his means are insufficient
  chosen_korean: 그의 손이 미치지 못하면
  alternatives_korean:
  - 그의 형편이 닿지 않으면
  - 그는 감당할 수 없으면
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손’ 이미지를 살리되, 의미상 재정적 능력이 부족하다는 뜻을 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: כֶּבֶשׂ אֶחָד / one male lamb
  english_pob_choice: one male lamb
  chosen_korean: 한 마리의 수양을
  alternatives_korean:
  - 한 마리의 어린 수컷 양을
  - 한 마리 양을
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 암수를 구별하는 어린 양을 가리키므로, 제물의 성별 특이성을 반영해 ‘수양’으로 옮겼습니다.
- source_word: לִתְנוּפָה / to be waved
  english_pob_choice: to be waved
  chosen_korean: 흔들어 드릴
  alternatives_korean:
  - 흔들 제물로
  - 흔들어 바칠
  lexicon: HALOT
  rationale: 문법적으로 수양이 ‘흔들리는’ 것이므로, 제사 동작을 한국어 동사구로 자연스럽게 풀어 ‘흔들어 드릴’로 옮겼습니다.
- source_word: מִנְחָה / grain offering
  english_pob_choice: grain offering
  chosen_korean: 곡식 제물로
  alternatives_korean:
  - 소제물로
  - 곡식 예물로
  lexicon: HALOT
  rationale: 제의적 범주를 드러내면서도 현대 독자가 이해하기 쉬운 표현으로, 전통 교회어보다 의미가 분명한 ‘곡식 제물’을 택했습니다.
- source_word: לֹג שָׁמֶן / one log of oil
  english_pob_choice: one log of oil
  chosen_korean: 기름 한 로그를
  alternatives_korean:
  - 기름 한 로그를
  - 기름 한 되를
  lexicon: HALOT
  rationale: לֹג는 이스라엘 제의에서 쓰인 특정 액량 단위이므로, 단위를 보존해 ‘로그’로 음역했습니다.
theological_decisions:
- issue: 속죄 동사의 제의적 의미
  chosen_reading: ‘속죄를 위해’로 옮겨 כפר의 제의적·언약적 기능을 드러냈습니다.
  alternative_readings:
  - 그를 위해 속죄하게 하려고
  - 그의 죄를 덮기 위해
  rationale: 이 문맥에서 כפר는 단순한 감정적 용서가 아니라 정결·복귀를 포함한 제의 행위를 가리키므로, 표준적인 제사 용어를 유지했습니다.
  doctrine_reference: 제사장적 율법의 제의 언어
