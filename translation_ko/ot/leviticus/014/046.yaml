review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. אולם 원문의 술어는 ‘저녁까지 부정하게 될 것이다’라는 하나의 규정인데, 초안의 ‘부정하게 될 것이며, 저녁까지 그러합니다’는 이를 두 절로 나누어 부자연스럽게 만들고 ‘그러합니다’의 지시 내용도 불명확합니다.
  naturalness: ‘그 집에 들어가는 사람은 누구든지’와 ‘그 집이 격리되어 있는 모든 날 동안’은 자연스럽고 현대 표준어 법규 문체에 맞습니다. 다만 ‘저녁까지 그러합니다’는 합쇼체 서술로도 어색하며, 상태의 지속을 직접 표현해야 합니다.
  terminology: ‘부정하게 되다’는 정결 규정의 טמא를 적절히 옮깁니다. ‘격리되어 있는’도 문맥상 허용되나, 현대 의료적 의미로만 좁혀 읽히지 않도록 각주에서 ‘가두어 두다/닫아 두다’라는 문자적 대안을 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘저녁까지 그러합니다’
    rationale: 히브리어 עַד הָעָרֶב는 יִטְמָא(부정하게 되다)의 상태가 저녁까지 지속됨을 수식합니다. ‘그러합니다’는 선행 내용을 부정확하게 대용하여 문장이 어색하고 원문의 단일 규정 구조를 흐립니다.
  revised_text: 그 집이 격리되어 있는 모든 날 동안 그 집에 들어가는 사람은 누구든지 저녁까지 부정하게 될 것입니다.[a]
