id: LEV.14.46
reference: Leviticus 14:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בָּא֙ אֶל הַ/בַּ֔יִת כָּל יְמֵ֖י הִסְגִּ֣יר אֹת֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
  footnotes:
  - marker: a
    text: Or, 'that it is shut up' or 'that it is confined.' The Hebrew refers to the house being isolated under priestly restriction for inspection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집이 격리되어 있는 모든 날 동안 그 집에 들어가는 사람은 누구든지 저녁까지 부정하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘격리되어 있는’에 해당하는 히브리어 표현은 문자적으로 ‘가두어 두다’ 또는 ‘닫아 두다’라는 뜻도 됩니다. 여기서는 그 집을 판정 기간 동안 따로 두는 조치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  english_pob_choice: And whoever enters
  chosen_korean: 그 집에 들어가는 사람은 누구든지
  alternatives_korean:
  - 누구든지 그 집에 들어가는 자는
  - 그 집에 들어가는 이는 누구든지
  lexicon: HALOT
  rationale: 분사형이 일반 법조문처럼 누구에게나 적용되는 주어이므로, 한국어에서는 ‘누구든지 ... 사람은’으로 자연스럽고 포괄적으로 옮겼습니다.
- source_word: יְמֵי הִסְגִּיר אֹתוֹ
  english_pob_choice: during all the days that it is quarantined
  chosen_korean: 그 집이 격리되어 있는 모든 날 동안
  alternatives_korean:
  - 그 집이 가둬져 있는 모든 날 동안
  - 그 집이 봉쇄되어 있는 모든 날 동안
  lexicon: HALOT
  rationale: הסגיר는 정결 규정에서 검사 목적의 격리·유보를 뜻하므로, 현대 독자가 기능을 이해할 수 있게 ‘격리’로 옮기되 법적 절차의 성격은 유지했습니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정하게 될 것이며
  alternatives_korean:
  - 부정할 것입니다
  - 부정하게 됩니다
  lexicon: HALOT
  rationale: 동사의 결과 상태를 나타내는 법조문 문맥을 살려 ‘부정하게 될 것’으로 옮겼고, 단순 현재보다 규정의 효력을 분명히 했습니다.
- source_word: עַד הָעָרֶב
  english_pob_choice: until the evening
  chosen_korean: 저녁까지
  alternatives_korean:
  - 저녁이 될 때까지
  - 해질 때까지
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 법조문 어법에 맞게 간결히 옮겼으며, 임시 부정의 종료 시점을 분명히 했습니다.
theological_decisions:
- issue: 부정함의 성격
  chosen_reading: 여기서의 ‘부정’은 도덕적 죄책이 아니라 정결 규정상 의례적 부정입니다.
  alternative_readings:
  - 도덕적 오염으로 읽는 것
  - 단순히 위생상 더러움으로 읽는 것
  rationale: 레위기 13–14장의 문맥은 전염병 진단과 관련한 제의적 상태 규정이므로, 독자가 의미를 오해하지 않도록 의례적 범주를 유지했습니다.
  doctrine_reference: 레위기 11–15장의 정결/부정 규정
- issue: ‘격리’ 표현
  chosen_reading: hִסְגִּיר는 현대적 의료 개념을 그대로 투사하기보다, 제사장 검사용 분리 조치라는 기능을 드러내는 ‘격리’로 번역합니다.
  alternative_readings:
  - ‘봉인’으로 번역
  - ‘가둠’으로 번역
  rationale: 본문의 핵심은 처벌적 구금이 아니라 검사와 판정을 위한 분리이므로, 독자가 제의적 절차를 이해하도록 기능 중심 표현을 택했습니다.
  doctrine_reference: 레위기 13:4–59; 14:33–53
- issue: quoted speech/register
  chosen_reading: 직접 화법이 아니라 법규 서술문이므로 전 구절을 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령형처럼 더 강하게 옮김
  - 구어적으로 완화함
  rationale: 본문의 법률적·서술적 어조를 보존하는 것이 원문 효과에 가장 가깝습니다.
  doctrine_reference: 모세 율법의 규정문체
