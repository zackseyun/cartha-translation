- from: 그리고 그 집에 들어가는 사람은 누구든지, 그 집이 격리되어 있는 모든 날 동안 부정하게 될 것이며, 저녁까지 그러합니다.[a]
  to: 그 집이 격리되어 있는 모든 날 동안 그 집에 들어가는 사람은 누구든지 저녁까지 부정하게 될 것입니다.[a]
  rationale: ‘저녁까지’를 ‘부정하게 될 것입니다’에 직접 연결하여 원문의 시간 범위와 법규적 진술을 자연스러운 합쇼체로 재현했습니다. 기존의 ‘격리’ 선택은 유지하되, 문자적 대안과 절차적 문맥을 각주에서 간결하게 밝혔습니다.
