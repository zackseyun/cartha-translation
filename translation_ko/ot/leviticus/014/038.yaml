id: LEV.14.38
reference: Leviticus 14:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָ֧א הַ/כֹּהֵ֛ן מִן הַ/בַּ֖יִת אֶל פֶּ֣תַח הַ/בָּ֑יִת וְ/הִסְגִּ֥יר אֶת הַ/בַּ֖יִת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
  footnotes:
  - marker: a
    text: Or 'close up the house for seven days.' The Hebrew verb can denote shutting off access for an inspection period.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 그 집에서 나와 그 집의 문간으로 가서, 그 집을 칠 일 동안 봉쇄해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 집을 칠 일 동안 닫아 두라.’ 히브리어 동사는 점검 기간을 위해 출입을 차단하는 뜻으로도 쓸 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַכֹּהֵן
  english_pob_choice: Then the priest shall go out
  chosen_korean: 제사장은 ... 나와
  alternatives_korean:
  - 그리고 제사장은 나가서
  - 그러면 제사장은 나가서
  lexicon: HALOT
  rationale: 절차적 율법 문맥에서 הבא-동사 연쇄의 순서를 살리되, 한국어에서는 ‘그러면’과 ‘나와’가 자연스럽게 다음 조치를 이어 줍니다.
- source_word: מִן הַבַּיִת אֶל פֶּתַח הַבָּיִת
  english_pob_choice: out of the house to the doorway of the house
  chosen_korean: 그 집에서 나와 그 집의 문간으로 가서
  alternatives_korean:
  - 그 집에서 나와 그 집의 입구로
  - 그 집에서 나와 그 집의 문으로
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 ‘문’보다 ‘문간/입구’가 더 정확하며, 이동 방향을 분명히 하기 위해 ‘...로 가서’를 보탰습니다.
- source_word: וְהִסְגִּיר
  english_pob_choice: and shut up
  chosen_korean: 봉쇄해야 합니다
  alternatives_korean:
  - 닫아 두어야 합니다
  - 폐쇄해야 합니다
  - 잠가 두어야 합니다
  lexicon: HALOT
  rationale: 히필 סגר는 단순히 문을 닫는 것보다 출입을 막아 일정 기간 격리·차단하는 절차를 뜻하므로, 법적·절차적 효과를 드러내는 ‘봉쇄’가 가장 잘 맞습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날간
  lexicon: HALOT
  rationale: 지속 기간을 자연스러운 한국어로 옮겼으며, 절차 기간의 명시성을 살리기 위해 ‘동안’을 붙였습니다.
theological_decisions:
- issue: 부정 의심 대상인 집을 어떻게 처리하는지에 대한 절차적 표현
  chosen_reading: ‘봉쇄하다’로 옮겨, 출입 제한과 검사 기간의 의미를 드러냈습니다.
  alternative_readings:
  - ‘닫아 두다’
  - ‘격리하다’
  rationale: 본문의 סגר는 단순한 물리적 폐쇄가 아니라 점검을 위한 출입 차단을 포함하므로, 한국어에서 그 기능을 가장 분명히 나타내는 표현을 선택했습니다.
  doctrine_reference: 레위기 14장의 정결/부정 규정과 제의적 검사는 절차적 의미를 지닙니다.
