id: LEV.14.25
reference: Leviticus 14:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
  footnotes:
  - marker: a
    text: Or 'the tip of the right ear.' The Hebrew term refers to the outer extremity of the ear.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'trespass offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그는 속건제 어린 숫양을 잡아야 합니다. 그리고 제사장은 그 속건제의 피에서 조금을 가져다가, 정결하게 되는 사람의 오른쪽 귓불[a]과 그의 오른손 엄지손가락과 오른발 엄지발가락에 발라야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오른쪽 귀의 끝부분’입니다. 히브리어 용어는 귀의 바깥쪽 끝을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁחַט
  english_pob_choice: shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: 의례적 제사 문맥이므로 단순한 ‘죽이다’보다 제의적 절차를 드러내는 동사로 옮겼습니다. 한국어에서는 ‘도살하다’가 다소 생경할 수 있어, 절차성은 유지하면서 자연스러운 ‘잡아야 합니다’를 택했습니다.
- source_word: כֶּבֶשׂ הָאָשָׁם
  english_pob_choice: the guilt-offering lamb
  chosen_korean: 속건제 숫양
  alternatives_korean:
  - 속건제 어린양
  - 속건제 양
  lexicon: HALOT
  rationale: 영어 POB의 ‘guilt offering’에 해당하는 אָשָׁם은 전통적으로 ‘속건제’로 널리 알려져 있어 이를 유지했습니다. כֶּבֶשׂ는 ‘어린양/양’의 범주이지만, 제물의 성격을 더 분명히 하는 관용적 표현으로 ‘숫양’이 적절합니다.
- source_word: מִדַּם הָאָשָׁם
  english_pob_choice: some of the blood of the guilt offering
  chosen_korean: 그 속건제의 피에서 조금을
  alternatives_korean:
  - 속건제의 피에서 일부를
  - 속건제의 피를 조금
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 ‘조금을’로 옮겼습니다. 본문은 피 전체가 아니라 일부를 취해 바르는 절차이므로, 이 점이 한국어에서도 분명해야 합니다.
- source_word: תְּנוּךְ אֹזֶן
  english_pob_choice: the lobe of the ... ear
  chosen_korean: 오른쪽 귀 귓불
  alternatives_korean:
  - 오른쪽 귀의 끝
  - 오른쪽 귀 끝부분
  lexicon: HALOT
  rationale: 영어 POB의 주석이 이 표현을 귀의 바깥쪽 끝/돌출부로 설명하므로, 한국어에서는 의례적 접점으로 자연스러운 ‘귓불’을 택했습니다.
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  english_pob_choice: the thumb of his right hand / the big toe of his right foot
  chosen_korean: 오른손 엄지와 그의 오른발 엄지발가락
  alternatives_korean:
  - 오른손 엄지와 그의 오른발 큰발가락
  - 오른손 엄지손가락과 그의 오른발 엄지발가락
  lexicon: HALOT
  rationale: בֹּהֶן은 손에는 엄지, 발에는 엄지발가락을 가리키므로 해부학적으로 분명하게 옮겼습니다. 반복된 ‘right’는 한국어에서 소유격과 결합해 자연스럽게 정리했습니다.
theological_decisions:
- issue: 제의 용어 אָשָׁם의 한국어 고정어 선택
  chosen_reading: 속건제
  alternative_readings:
  - 죄책제
  - 배상제
  - 속죄제
  rationale: 본문은 특정한 레위기 제사 절차를 가리키며, 한국어 성경 전통과의 호환성을 고려할 때 ‘속건제’가 가장 안정적입니다. 다만 이는 단순히 ‘죄’의 추상적 상태가 아니라 제사 제도상의 특정 제물임을 유지합니다.
  doctrine_reference: 레위기 제사 용어 일관성 원칙
