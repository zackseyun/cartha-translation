base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
  footnotes:
  - marker: a
    text: Or 'living water,' that is, running or fresh water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 한 새를 토기 그릇 위의 생수[a]에 대고 잡으라고 명합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아 있는 물’, 곧 흐르거나 생생한 물.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  english_pob_choice: Then the priest shall command
  chosen_korean: 제사장은 ... 명합니다
  alternatives_korean:
  - 제사장은 ... 명령합니다
  - 제사장은 ... 지시합니다
  lexicon: HALOT
  rationale: 의례 지시문에서 צִוָּה는 단순한 설명보다 권위 있는 지시를 뜻하므로, 현대 한국어에서는 ‘명하다’가 가장 자연스럽고 격식 있는 대응입니다.
- source_word: וְשָׁחַט
  english_pob_choice: be slaughtered
  chosen_korean: 잡으라고
  alternatives_korean:
  - 도살하라고
  - 죽이라고
  lexicon: HALOT
  rationale: 제사 문맥의 পশ/동물 হত্যা를 나타내므로 일반적인 ‘죽이다’보다 의례적·구체적인 ‘잡다/도살하다’가 더 적절합니다. 한국어에서는 명령 종속절로 풀어 ‘잡으라고’라고 옮겼습니다.
- source_word: כְּלִי חֶרֶשׂ
  english_pob_choice: an earthenware vessel
  chosen_korean: 토기 그릇
  alternatives_korean:
  - 질그릇
  - 도기 그릇
  lexicon: HALOT
  rationale: ‘earthenware vessel’의 재질을 분명히 하면서도, 성경 한국어에서 익숙한 ‘토기 그릇’이 가장 자연스럽습니다.
- source_word: מַיִם חַיִּים
  english_pob_choice: fresh water
  chosen_korean: 생수
  alternatives_korean:
  - 흐르는 물
  - 살아 있는 물
  lexicon: HALOT
  rationale: 본문의 מַיִם חַיִּים는 문자적으로는 ‘살아 있는 물’이지만, 정결 의식에서는 샘물·흐르는 물처럼 고인 물이 아닌 물을 가리키므로 한국어 본문에서는 간결하게 ‘생수’로 옮기고 각주로 대안 독법을 남겼습니다.
theological_decisions:
- issue: מַיִם חַיִּים의 의례적 의미와 상징적 의미 구분
  chosen_reading: 본문은 정결 예식에 쓰이는 자연 상태의 물을 가리키는 것으로 보고 ‘생수’로 번역했습니다.
  alternative_readings:
  - ‘살아 있는 물’
  - ‘흐르는 물’
  rationale: 여기서는 후대 신학적 상징을 본문에 미리 주입하기보다, 제의 절차가 요구하는 물의 성격을 우선 전달하는 것이 소스에 충실합니다.
  doctrine_reference: Translation philosophy §3; §6
