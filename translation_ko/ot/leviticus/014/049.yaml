id: LEV.14.49
reference: Leviticus 14:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
  footnotes:
  - marker: a
    text: Or 'to cleanse the house'; the Hebrew verb in this ritual context has the sense of purifying from sin/impurity.
    reason: lexical_alternative
  - marker: b
    text: Or 'scarlet thread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집을 정결하게 하려고[a] 새 두 마리와 백향목과 주홍색 실[b]과 우슬초를 가져옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집을 깨끗하게 하려고’; 히브리어 동사는 이 제의 문맥에서 죄나 부정으로부터 정결하게 한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주홍 실타래’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: And he shall take
  chosen_korean: 그는 … 가져오고
  alternatives_korean:
  - 그는 … 취하고
  - 그는 … 가져가고
  lexicon: HALOT
  rationale: 의례 절차의 연속을 자연스러운 한국어로 옮기기 위해 ‘가져오다’를 사용했습니다. 문맥상 명령형 절차를 나타내지만 한국어에서는 미래·의무적 서술보다 동작 열거가 더 자연스럽습니다.
- source_word: לְחַטֵּא
  english_pob_choice: to purify the house
  chosen_korean: 집을 정결하게 하기 위해
  alternatives_korean:
  - 집을 깨끗하게 하기 위해
  - 집을 속죄하기 위해
  - 집을 부정에서 정결케 하기 위해
  lexicon: HALOT
  rationale: 이 동사형은 제의적 부정/죄 오염을 제거하는 뜻이므로, 도덕적 의미가 아니라 의례적 ‘정결하게 하다’로 옮겼습니다. ‘속죄하다’는 여기서 너무 강한 신학 용어라서 본문 범위를 넘습니다.
- source_word: שְׁתֵּי צִפֳּרִים
  english_pob_choice: two birds
  chosen_korean: 두 마리의 새
  alternatives_korean:
  - 두 마리의 새들
  - 두 마리의 새새
  lexicon: HALOT
  rationale: 히브리어 본문에는 단순히 ‘두 마리의 새’만 있으므로, POB의 절제된 처리에 따라 추가 형용사는 넣지 않았습니다.
- source_word: וְעֵץ אֶרֶז וּשְׁנִי תוֹלַעַת וְאֵזֹב
  english_pob_choice: cedar wood, scarlet yarn, and hyssop
  chosen_korean: 백향목과 주홍 실과 우슬초
  alternatives_korean:
  - 백향목과 홍색 실과 우슬초
  - 백향목과 주홍 실뭉치와 우슬초
  - 백향목과 붉은 실과 우슬초
  lexicon: HALOT
  rationale: ‘עֵץ אֶרֶז’는 백향목 자체를 가리키는 제의적 재료로 자연스럽게 옮기고, ‘שְׁנִי תוֹלַעַת’는 염색된 붉은 실을 뜻하는 관용구이므로 ‘주홍 실’로 번역했습니다. ‘אֵזוֹב’는 전통적으로 우슬초가 가장 적절합니다.
theological_decisions:
- issue: 제의적 정결과 속죄 언어의 구분
  chosen_reading: 이 구절은 집의 의례적 정결을 말하며, 본문에는 명시적 속죄 언어를 덧붙이지 않았습니다.
  alternative_readings:
  - 집을 속죄하기 위해
  - 집을 죄에서 깨끗하게 하기 위해
  rationale: 히브리어 חטא의 제의적 용례는 부정/오염 제거를 뜻하지만, 여기서는 ‘속죄’라는 신학적 결과를 본문이 직접 진술하지 않습니다. 따라서 정결 언어를 유지해 원문의 긴장을 보존했습니다.
  doctrine_reference: 제의 문맥에서의 정결/속죄 구분을 유지함
