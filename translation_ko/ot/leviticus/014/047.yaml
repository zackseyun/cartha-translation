  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
  footnotes:
  - marker: a
    text: Or 'whoever sleeps in the house.' The Hebrew verb can mean 'lie down' or 'sleep'; 'lies down' is broader and fits the legal context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his clothes' uses a masculine singular form in a generic legal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 집 안에 누워 있는 사람은 자기 옷을 빨아야 합니다[a][b]. 집 안에서 먹는 사람도 자기 옷을 빨아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘눕다’ 또는 ‘잠자다’를 뜻할 수 있습니다. 여기서는 법문맥에 맞게 더 넓은 뜻의 ‘누워 있는’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 남성 단수 형태는 일반적인 법적 표현으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  english_pob_choice: and whoever lies down
  chosen_korean: 그리고 누구든지 집 안에 누워 있는 사람은
  alternatives_korean:
  - 그리고 누구든지 잠드는 사람은
  - 그리고 집 안에 누워 있는 자는
  lexicon: HALOT
  rationale: 히브리어 분사는 법적 문맥에서 일반적인 사람을 가리키는 명사적 용법이므로, '누구든지 … 사람은'으로 자연스럽게 살리면서 'lie down'의 넓은 의미를 반영했습니다.
- source_word: בַּבַּיִת
  english_pob_choice: in the house
  chosen_korean: 집 안에
  alternatives_korean:
  - 집 안에서
  - 집에
  lexicon: HALOT
  rationale: 공간 안쪽을 가리키는 법문맥의 장소 표현이므로 '집 안에'가 가장 직접적이고 분명합니다.
- source_word: יְכַבֵּס אֶת בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨아야 하고
  alternatives_korean:
  - 자기 옷을 씻어야 하고
  - 자기 옷을 빨아야 합니다
  lexicon: HALOT
  rationale: בגד는 현대 한국어에서 '옷'이 자연스럽고, יכבס는 의복을 세탁하는 뜻이므로 '빨다'가 가장 적절합니다. 법적 의무를 살려 '-아야 하고'로 옮겼습니다.
- source_word: וְהָאֹכֵל
  english_pob_choice: and whoever eats
  chosen_korean: 집 안에서 먹는 사람도
  alternatives_korean:
  - 그리고 집 안에서 먹는 사람은
  - 집 안에서 먹는 자도
  lexicon: HALOT
  rationale: 앞의 분사와 같은 명사적 분사 구조로 이해하여, 반복되는 법문을 자연스럽게 이어 주는 '먹는 사람도'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 남성 단수 소유형의 일반법적 처리
  chosen_reading: '''자기 옷''으로 옮겨 남성 단수 형식을 유지하되, 의미상으로는 일반인에게 적용되는 법문으로 이해되게 했습니다.'
  alternative_readings:
  - '''그의 옷'''
  - '''그들 옷'''
  rationale: 원문은 남성 단수 소유형을 쓰지만, 법문맥에서는 대표적 일반인을 뜻합니다. 한국어에서는 '그의'보다 '자기'가 문맥상 자연스럽고, 복수화는 원문의 형태를 흐릴 수 있어 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
