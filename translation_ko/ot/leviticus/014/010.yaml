revisions:
- from: 그리고 여덟째 날에는 흠 없는 수컷 어린양 둘과, 한 살 된 암컷 어린양 하나, 그리고 고운 가루 세 십분의 일 에바를 기름 섞어 드릴 곡식 제물로, 그리고 기름 한 로그를 가져오게 합니다.[a]
  to: 그리고 여덟째 날에 그는 흠 없는 수컷 어린양 둘과 흠 없는 한 살 된 암컷 어린양 하나와, 기름에 섞은 곡식 제물로 쓸 고운 가루 에바의 십분의 삼과, 기름 한 로그를 가져와야 합니다.[a]
  rationale: 암컷 어린양에 대한 ‘흠 없는’ 규격을 회복하여 원문 정보를 보존했습니다. 고운 가루와 기름의 관계를 자연스러운 한국어 수식 구조로 바로잡았고, 에바의 3/10과 로그라는 고대 측량 단위는 그대로 유지했습니다.
