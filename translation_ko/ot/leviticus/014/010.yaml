id: LEV.14.10
reference: Leviticus 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
  footnotes:
  - marker: a
    text: A 'log' is a small liquid measure used in Israelite ritual practice.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 여덟째 날에 그는 흠 없는 수컷 어린양 둘과 흠 없는 한 살 된 암컷 어린양 하나와, 기름에 섞은 곡식 제물로 쓸 고운 가루 에바의 십분의 삼과, 기름 한 로그를 가져와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 로그는 고대 이스라엘의 제의에 사용된 작은 액량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  english_pob_choice: And on the eighth day
  chosen_korean: 그리고 여덟째 날에는
  alternatives_korean:
  - 여덟째 날에
  - 그리고 여덟째 날에
  lexicon: HALOT
  rationale: 절차적 규정의 순서를 살리기 위해 연결사와 시점을 함께 옮기되, 한국어에서는 조사로 자연스럽게 처리했습니다.
- source_word: יִקַּח
  english_pob_choice: he shall take
  chosen_korean: 가져오게 합니다
  alternatives_korean:
  - 취하게 합니다
  - 가져야 합니다
  lexicon: HALOT
  rationale: 법규 문맥의 명령적 용법을 현대 한국어의 지시문체로 옮겼습니다.
- source_word: שְׁנֵי כְבָשִׂים תְּמִימִים / וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ תְּמִימָה
  english_pob_choice: two male lambs without blemish, and one ewe lamb a year old without blemish
  chosen_korean: 흠 없는 수컷 어린양 둘과, 한 살 된 암컷 어린양 하나
  alternatives_korean:
  - 흠 없는 숫양 둘과 한 살 된 암양 하나
  - 흠 없는 어린 수컷 양 둘과 한 살 된 어린 암컷 양 하나
  lexicon: HALOT
  rationale: כֶּבֶשׂ/כַּבְשָׂה의 성별 대조를 살리기 위해 수컷/암컷을 분명히 했고, 제물 규정의 간결성을 위해 '어린양'으로 옮겼습니다.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים סֹלֶת מִנְחָה בְּלוּלָה בַשֶּׁמֶן
  english_pob_choice: three-tenths of an ephah of fine flour as a grain offering mixed with oil
  chosen_korean: 고운 가루 세 십분의 일 에바를 기름 섞어 드릴 곡식 제물로
  alternatives_korean:
  - 고운 가루 세 십분의 일 에바를 기름에 섞은 곡식 제물로
  - 고운 가루 세 십분의 일 에바를 기름 섞은 소제물로
  lexicon: HALOT
  rationale: מִנְחָה를 '곡식 제물'로 옮겨 제의적 의미를 유지했고, בְּלוּלָה는 '기름 섞어'로 자연스럽게 처리했습니다.
- source_word: וְלֹג אֶחָד שָׁמֶן
  english_pob_choice: and one log of oil
  chosen_korean: 기름 한 로그
  alternatives_korean:
  - 기름 한 로그를
  - 기름 한 용량
  lexicon: HALOT
  rationale: לֹג는 고유한 액량 단위이므로 음역 '로그'를 유지해 원문 측량을 보존했습니다.
theological_decisions:
- issue: 제물 규정의 기술적·법규적 문체
  chosen_reading: 명령형 법규를 한국어의 공손한 지시문체로 처리하되, 제물 항목의 구체성을 그대로 보존했습니다.
  alternative_readings:
  - 서술형으로 부드럽게 풀어 쓰는 방식
  - 전통적 제의 용어를 더 많이 사용하는 방식
  rationale: 레위기의 규정문은 설명보다 준수 지시가 핵심이므로, 현대 한국어에서 법규의 직접성을 살리면서도 예배적 맥락을 흐리지 않게 했습니다.
  doctrine_reference: 제의 규정의 서술 방식에 대한 번역 원칙
- issue: 곡식 제물 용어 선택
  chosen_reading: מִנְחָה를 '곡식 제물'로 옮겨 제물의 종류를 드러냈습니다.
  alternative_readings:
  - 소제
  - 곡식 제사
  rationale: 전통적 '소제'는 익숙하지만 원문 의미를 즉각 드러내는 데 약하므로, 본문 정보가 더 분명한 '곡식 제물'을 택했습니다.
  doctrine_reference: 레위기 제사 용어의 투명성 원칙
