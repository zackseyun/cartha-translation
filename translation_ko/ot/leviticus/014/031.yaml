  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
  footnotes:
  - marker: a
    text: Hebrew literally, 'what his hand reaches'; that is, what he can afford.
    reason: lexical_alternative
  - marker: b
    text: Or 'one as a purification offering.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 감당할 수 있는 만큼[a], 곧 하나는 속죄제로, 하나는 번제로 곡식제물[b]과 함께 드려야 합니다. 그러면 제사장이 야훼 앞에서 정결하게 되는 사람을 위해 속죄할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 손이 미치는 것’이며, 곧 그가 감당할 수 있는 재정 능력을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소제’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  english_pob_choice: whatever his means can afford
  chosen_korean: 그의 손이 미칠 수 있는 것대로
  alternatives_korean:
