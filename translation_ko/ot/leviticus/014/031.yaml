id: LEV.14.31
reference: Leviticus 14:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
  footnotes:
  - marker: a
    text: Hebrew literally, 'what his hand reaches'; that is, what he can afford.
    reason: lexical_alternative
  - marker: b
    text: Or 'one as a purification offering.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 손이 미칠 수 있는 것[a]대로, 곧 속죄제 하나와 번제 하나를 곡식제물[b]과 함께 드려야 합니다. 그러면 제사장이 야훼 앞에서 정결하게 되는 사람을 위해 속죄를 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 손이 미치는 것’이며, 곧 그가 감당할 수 있는 재정 능력을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소제’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  english_pob_choice: whatever his means can afford
  chosen_korean: 그의 손이 미칠 수 있는 것대로
  alternatives_korean:
  - 그가 감당할 수 있는 대로
  - 그의 재력이 미치는 만큼
  lexicon: HALOT
  rationale: 직역인 '손이 미치다'를 살리되, 한국어에서는 재정적 능력을 뜻하는 관용 표현으로 자연스럽게 풀어야 하므로 '미칠 수 있는 것대로'를 택했습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 레위기 제의 맥락에서 한국어 성경의 확립된 제사 용어를 따르되, POB의 'sin offering'에 대응하는 제의적 용어로 '속죄제'가 가장 직접적입니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태움 제물
  - 전번제
  lexicon: HALOT
  rationale: 히브리어 제의용어의 표준 대응어인 '번제'가 본문의 제사 항목을 가장 정확하고 간결하게 전달합니다.
- source_word: עַל הַמִּנְחָה
  english_pob_choice: along with the grain offering
  chosen_korean: 곡식제물과 함께
  alternatives_korean:
  - 곡식제물에 더하여
  - 소제와 함께
  lexicon: HALOT
  rationale: עַל이 여기서는 공간적 '위에'가 아니라 동반·추가의 뜻이므로, POB의 의미를 따라 '…와 함께'로 옮겼습니다. 또한 מִנְחָה는 제물 문맥에서 '곡식제물'이 본문의 의미를 분명하게 드러냅니다.
- source_word: וְכִפֶּר
  english_pob_choice: shall make atonement
  chosen_korean: 속죄를 행할 것입니다
  alternatives_korean:
  - 속죄할 것입니다
  - 속죄하게 될 것입니다
  lexicon: HALOT
  rationale: כפר는 제의적 문맥에서 단순한 '덮다'보다 제사장이 수행하는 속죄 행위를 가리키므로, 동작성을 살린 '속죄를 행하다'를 선택했습니다.
- source_word: הַמִּטַּהֵר
  english_pob_choice: the one being cleansed
  chosen_korean: 정결하게 되는 사람
  alternatives_korean:
  - 정결하게 되는 자
  - 깨끗하게 되는 사람
  lexicon: HALOT
  rationale: 분사형이 가리키는 진행 중인 상태를 한국어에서 자연스럽게 표현하기 위해 '정결하게 되는 사람'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명사 יהוה는 호칭어가 아니라 고유명사로서 '야훼'를 사용했습니다.
theological_decisions:
- issue: 속죄 언어의 보존
  chosen_reading: 제사장이 정결하게 되는 사람을 위해 속죄를 행할 것입니다
  alternative_readings:
  - 제사장이 그를 속죄할 것입니다
  - 제사장이 그를 위해 속죄하게 될 것입니다
  rationale: 본문은 제의 절차를 서술하므로, 후대 교리 용어로 과도하게 해석하지 않고 제사장의 행위와 결과를 그대로 드러내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 신명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: YHWH를 제목어로 대체하지 않고 고유한 하나님의 이름으로 드러내는 것이 본 프로젝트의 표준이므로 이를 따랐습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
