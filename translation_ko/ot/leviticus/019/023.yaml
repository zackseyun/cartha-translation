source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
  footnotes:
  - marker: a
    text: Hebrew 'uncircumcised.' The term is used metaphorically for fruit that is not yet permitted to be eaten during the first three years.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그 땅에 들어가 먹을 열매를 맺는 어떤 나무든 심거든, 그 열매를 할례받지 않은 것으로 여기십시오[a]. 삼 년 동안 그것은 너희에게 할례받지 않은 것이며, 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘할례받지 않은’입니다. 여기서는 열매가 처음 삼 년 동안 먹도록 허용되지 않는 상태를 은유적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל הָאָרֶץ
  english_pob_choice: When you come into the land
  chosen_korean: 너희가 그 땅에 들어가서
  alternatives_korean:
