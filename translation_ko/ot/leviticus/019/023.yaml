  naturalness: 초안의 ‘너희에게 할례받지 않은 것으로 있을 것이며’는 현대 표준 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘너희에게 할례받지 않은 것이며’로 고치면 법적 상태를 나타내는 히브리어 표현을 유지하면서 합쇼체 문장으로 자연스럽습니다. 숫자 ‘3년’은 성경 본문 표기에서는 ‘삼 년’으로 쓰는 편이 문체상 더 적절합니다.
  terminology: ‘할례받지 않은’은 이 문맥의 은유적이고 의례적인 어휘를 보존하는 적절한 번역입니다. 이를 ‘부정한’으로 바꾸면 원문에 없는 범주를 도입하며, ‘금지된’으로만 옮기면 반복되는 은유가 사라집니다. ‘먹을 열매를 맺는 나무’는 עֵץ מַאֲכָל의 식용 과실나무 의미를 자연스럽게 전달합니다.
