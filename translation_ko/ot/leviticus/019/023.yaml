  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
  footnotes:
  - marker: a
    text: Hebrew 'uncircumcised.' The term is used metaphorically for fruit that is not yet permitted to be eaten during the first three years.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그 땅에 들어가서 먹을 나무를 심거든, 그 열매를 할례받지 않은 것으로 여기십시오[a]. 3년 동안 그것은 너희에게 할례받지 않은 것으로 있을 것이며, 먹을 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘할례받지 않은’입니다. 여기서는 열매가 처음 3년 동안 먹도록 허용되지 않는 상태를 은유적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל הָאָרֶץ
  english_pob_choice: When you come into the land
  chosen_korean: 너희가 그 땅에 들어가서
  alternatives_korean:
  - 너희가 그 땅에 들어갈 때
  - 너희가 그 땅에 오면
  lexicon: HALOT
  rationale: 법적·지시문 문맥에서 미래의 상황을 여는 표현으로 처리해, 자연스러운 합쇼체 문장으로 옮겼습니다.
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  english_pob_choice: and plant any kind of tree for food
  chosen_korean: 먹을 나무를 심거든
  alternatives_korean:
  - 먹을 나무 종류를 심거든
  - 먹을 과실나무를 심거든
  lexicon: HALOT
  rationale: עֵץ מַאֲכָל의 뜻을 과실용 나무로 풀되, 본문의 일반성을 살려 ‘먹을 나무’로 간결하게 옮겼습니다.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  english_pob_choice: you shall regard its fruit as uncircumcised
  chosen_korean: 그 열매를 할례받지 않은 것으로 여기십시오
  alternatives_korean:
  - 그 열매를 부정한 것으로 여기십시오
  - 그 열매를 먹지 못하는 것으로 여기십시오
  lexicon: HALOT
  rationale: 영어 POB가 유지한 은유를 따라, 기능적 의미로 평탄화하지 않고 ‘할례받지 않은’이라는 직역적 표현을 살렸습니다.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  english_pob_choice: For three years it shall be forbidden to you
  chosen_korean: 3년 동안 그것은 너희에게 할례받지 않은 것으로 있을 것이며
  alternatives_korean:
  - 3년 동안 그것은 너희에게 금지될 것이며
  - 3년 동안 너희는 그것을 먹지 못할 것입니다
  lexicon: HALOT
  rationale: 반복되는 עֲרֵלִים의 형상성을 보존하기 위해, 첫 절의 은유를 유지한 채 한국어에서도 동일한 표현을 반복했습니다.
- source_word: לֹא יֵאָכֵל
  english_pob_choice: it shall not be eaten
  chosen_korean: 먹을 수 없습니다
  alternatives_korean:
  - 먹지 못합니다
  - 그것은 먹혀서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어 수동·비인칭 금지를 현대 한국어로 자연스럽게 옮기되, 규범적 금지의 힘을 살렸습니다.
theological_decisions:
- issue: עֲרֵל / עָרְלָה의 은유를 ‘금지됨’으로 평탄화할지 여부
  chosen_reading: 본문의 은유를 유지해 ‘할례받지 않은’으로 옮겼습니다.
  alternative_readings:
  - 금지된
  - 먹을 수 없는
  - 미숙한
  rationale: 이 구절은 열매의 법적 상태를 할례 언어로 비유하므로, 실용적 의미만 남기면 본문의 언약적·상징적 층위가 사라집니다. 따라서 의미 설명은 주석이나 독자 인식에 맡기고, 본문은 은유를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
