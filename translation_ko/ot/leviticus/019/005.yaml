id: LEV.19.5
reference: Leviticus 19:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
  footnotes:
  - marker: a
    text: Or, more literally, 'for your acceptance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 야훼께 화목제를 드릴 때에는, 기쁘게 받아 주시도록 그것을 드려야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  english_pob_choice: And when
  chosen_korean: 너희가 … 드릴 때에는
  alternatives_korean:
  - 그리고 … 할 때
  - 만일 … 드릴 때
  lexicon: HALOT
  rationale: 법률 문맥의 조건·시간 도입구로서, 한국어에서는 자연스러운 경우법 표현인 「…할 때에는」으로 옮겨 지시 규범의 흐름을 살렸습니다.
- source_word: זֶבַח שְׁלָמִים
  english_pob_choice: a peace offering
  chosen_korean: 화목제
  alternatives_korean:
  - 평화제
  - 화평제
  lexicon: HALOT
  rationale: שְׁלָמִים의 제의적 용례를 드러내는 표준적 한국어 대응으로 「화목제」를 택했습니다. 「평화제」는 직역성이 있지만 한국어 성경 용례에서는 다소 낯섭니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명 표기를 원문 지시대로 살리기 위해 「야훼께」를 사용했습니다. 이는 제물의 향방이 하나님께 향한다는 방향성을 한국어 조사로 자연스럽게 드러냅니다.
- source_word: לִֽ/רְצֹנְ/כֶם
  english_pob_choice: so that you may be accepted
  chosen_korean: 기쁘게 받아 주시도록
  alternatives_korean:
  - 받아 주심을 위하여
  - 여러분이 받아들여지도록
  lexicon: HALOT
  rationale: 제사 문맥의 רָצוֹן을 단순한 인간의 뜻이 아니라 하나님 앞에서의 수납 가능성으로 이해하여, 결과 중심의 한국어 표현인 「기쁘게 받아 주시도록」으로 옮겼습니다. 'accepted'의 수동성을 살리면서도 예배 언어로 지나치게 딱딱해지는 것을 피했습니다.
theological_decisions:
- issue: 예배 제물의 수납 가능성 표현
  chosen_reading: 기쁘게 받아 주시도록
  alternative_readings:
  - 여러분이 받아들여지도록
  - 여러분의 수납을 위하여
  rationale: לִרְצֹנְכֶם는 제사를 드리는 자의 기호가 아니라 하나님 앞에서의 승인·수납을 가리키므로, 인간 중심의 '뜻/원함'으로 오해되지 않도록 번역했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
