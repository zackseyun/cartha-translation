  rationale: 본문이 신명(神名) יְהוָה를 직접 사용하므로, POB 기준에 따라 언약명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
