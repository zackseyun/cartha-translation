  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: ko
  text: 다섯째 해에는 그 열매를 먹을 수 있습니다. 그 나무가 여러분에게 소출을 더 내게 하려는 것입니다. 나는 여러분의 하나님 야훼입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  english_pob_choice: And in the fifth year
  chosen_korean: 그리고 다섯째 해에는
  alternatives_korean:
  - 그리고 다섯 번째 해에는
  - 다섯째 해에는
  lexicon: WLC; HALOT
  rationale: 법규 문맥의 시간 부사는 앞선 금지 규정과의 연속을 살려 ‘그리고’로, 서수는 현대 한국어 법령체에 맞는 ‘다섯째 해’로 옮겼습니다.
- source_word: תֹּאכְלוּ אֶת פִּרְיוֹ
  english_pob_choice: you may eat its fruit
  chosen_korean: 그 열매를 먹을 수 있습니다
  alternatives_korean:
  - 그 열매를 먹습니다
  - 그 열매를 먹어도 됩니다
  lexicon: HALOT
  rationale: תֹּאכְלוּ는 단순 미래보다 허용의 뉘앙스가 강하므로 ‘먹을 수 있습니다’로 풀었고, פְּרִי는 여기서 나무의 ‘열매’가 자연스럽습니다.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  english_pob_choice: so that it may increase its produce for you
  chosen_korean: 그것이 여러분을 위해 그 소출을 더하게 하려는 것입니다
  alternatives_korean:
  - 여러분을 위해 그 소출을 늘리게 하려는 것입니다
  - 여러분에게 그 소출이 더해지게 하려는 것입니다
  lexicon: HALOT
  rationale: לְהוֹסִיף는 목적/결과를 나타내므로 ‘하려는 것입니다’로 목적을 드러냈고, תְּבוּאָה는 농경 문맥의 ‘소출’이 가장 구체적입니다.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: I am Yahweh your God
  chosen_korean: 나는 야훼, 여러분의 하나님입니다
  alternatives_korean:
  - 나는 야훼, 너희의 하나님입니다
  - 나는 야훼 여러분의 하나님입니다
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 언약 자기선언을 살려 יהוה를 ‘야훼’로 음역했고, 2인칭 복수는 현대 공손한 청자 지시를 위해 ‘여러분’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
