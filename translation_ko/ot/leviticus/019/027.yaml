source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
  footnotes:
  - marker: a
    text: Or 'the corners of your hair/head.' The Hebrew term means 'edge,' 'side,' or 'corner.'
    reason: lexical_alternative
  - marker: b
    text: This likely refers to shaving or trimming the hair at the sides of the head in a rounded fashion.
    reason: cultural_note
  - marker: c
    text: Or 'destroy,' 'mar,' or 'disfigure the edge of your beard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 머리 양옆의 머리카락을 둥글게 깎지 마십시오.[a][b] 수염의 가장자리도 훼손하지 마십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘머리카락의 가장자리’, ‘머리의 모서리’. 히브리어 פֵּאָה는 ‘가장자리’, ‘옆’, ‘모서리’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 머리 양옆의 머리카락을 둥글게 깎는 행위를 가리키는 것으로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘수염의 가장자리를 망치다’, ‘해치다’, ‘변형하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  english_pob_choice: round off
  chosen_korean: 둥글게 밀지 말고
  alternatives_korean:
  - 둘레를 따라 밀지 말고
  - 원형으로 깎지 말고
  - 둥글게 다듬지 말고
  lexicon: HALOT
  rationale: הִפְעִיל형의 핵심은 머리 둘레를 따라 둥글게 깎는 행위이므로, 한국어로는 ‘둥글게 밀다’가 가장 자연스럽고 구체적입니다.
- source_word: פְּאַת רֹאשְׁכֶם
  english_pob_choice: the hair at the sides of your head
  chosen_korean: 머리 양쪽의 머리카락
  alternatives_korean:
  - 머리의 가장자리
  - 머리의 모서리
  - 옆머리
  lexicon: HALOT
  rationale: פֵּאָה는 ‘가장자리/변두리’라는 뜻이지만, 여기서는 실제로 머리의 양쪽 부분을 가리키므로 ‘머리 양쪽의 머리카락’으로 풀어 주는 것이 오해가 적습니다.
- source_word: תַשְׁחִית
  english_pob_choice: mar
  chosen_korean: 훼손하지 말아야 합니다
  alternatives_korean:
  - 망치지 말아야 합니다
  - 해치지 말아야 합니다
  - 손상하지 말아야 합니다
  lexicon: HALOT
  rationale: 수염의 ‘끝/가장자리’를 인위적으로 손상하는 금지를 드러내기 위해, 문어체로는 ‘훼손하다’가 ‘mar’의 손상·변형 뉘앙스를 잘 전달합니다.
- source_word: פְּאַת זְקָנֶךָ
  english_pob_choice: the edges of your beard
  chosen_korean: 수염 끝
  alternatives_korean:
  - 수염 가장자리
  - 수염의 모서리
  - 수염의 끝자락
  lexicon: HALOT
  rationale: פֵּאָה가 수염의 ‘가장자리/끝’이라는 뜻이므로, 현대 한국어에서 가장 직접적인 표현인 ‘수염 끝’으로 옮겼습니다.
theological_decisions:
- issue: 이 금지의 범위
  chosen_reading: 본문이 직접 말하는 것은 특정한 머리·수염 손질 행위의 금지이며, 그 배경 설명은 본문 안에 넣지 않았습니다.
  alternative_readings:
  - 이방 장례 관습과 연결된 금지
  - 주변 민족과 구별되는 단정 금지
  rationale: 히브리어 본문은 금지 행위를 구체적으로 제시할 뿐 동기를 명시하지 않으므로, 본문 수준의 절제를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
