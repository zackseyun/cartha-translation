  text: 너희는 나의 규례를 지키십시오. 너희 가축을 다른 종류와 교배시키지 말며, 너희 밭에 서로 다른 종류의 씨를 뿌리지 말고, 혼합 재료로 된 옷, 곧 샤앗네즈[a]를 몸에 걸치지 마십시오.
  philosophy: optimal-equivalence
