    rationale: 주석 앵커는 설명 대상 어구 바로 뒤에 놓여야 독자가 어떤 표현의 대안인지 정확히 알 수 있습니다.
  - severity: medium
    issue: ‘당신은’이 일반적 단수 계명의 수신자에게 사용되었습니다.
    rationale: 현대 표준 한국어에서 ‘당신’은 친밀한 관계, 부부 사이, 또는 대립적 호칭으로 들릴 수 있습니다. 원문의 직접적 단수 호소는 ‘너는’이 더 자연스럽게 전달합니다.
  revised_text: 너는 마음속으로 네 형제를 미워해서는 안 됩니다. 너는 네 이웃을 반드시 책망해야 하며, 그로 인해 죄를 짊어져서는 안 됩니다[a].
