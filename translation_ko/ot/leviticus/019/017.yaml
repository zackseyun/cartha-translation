id: LEV.19.17
reference: Leviticus 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
  footnotes:
  - marker: a
    text: Or 'incur guilt on his account' or 'share in his sin.' The Hebrew expression is idiomatic and may refer to becoming culpable by failing to confront wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 마음속으로 네 형제를 미워해서는 안 됩니다. 너는 네 이웃을 반드시 책망해야 하며, 그로 인해 죄를 짊어져서는 안 됩니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그로 인해 죄책을 지다’ 또는 ‘그의 죄에 참여하다’. 이 히브리어 표현은 관용적이며, 잘못을 책망하지 않고 지나칠 경우 그로 인해 책임을 지게 된다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  english_pob_choice: hate
  chosen_korean: 미워하다
  alternatives_korean:
  - 증오하다
  - 원망하다
  lexicon: HALOT
  rationale: שׂנא의 기본 의미를 직접 살리되, 현대 한국어에서 가장 자연스럽고 도덕적 금지의 강도를 유지하는 표현으로 옮겼습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 형제
  alternatives_korean:
  - 네 형제
  - 동족
  lexicon: HALOT
  rationale: 문맥상 혈연만이 아니라 공동체적·언약적 관계를 포함하는 표현이므로, 한국어에서도 성경적 친족/공동체 뉘앙스를 살려 ‘형제’로 옮겼습니다.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  english_pob_choice: you shall surely rebuke
  chosen_korean: 반드시 … 꾸짖다
  alternatives_korean:
  - 반드시 책망하다
  - 분명히 훈계하다
  lexicon: HALOT
  rationale: 강조형(부정사 절대형+동사)의 반복 강조를 ‘반드시’로 살리고, 공동체 윤리 문맥의 적극적 책망을 ‘꾸짖다’로 반영했습니다.
- source_word: עֲמִיתֶךָ
  english_pob_choice: your neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 동료
  - 동포
  lexicon: HALOT
  rationale: ‘neighbor’는 여기서 단순한 거주 이웃보다 공동체 안의 상대를 가리키므로, 한국어에서 가장 익숙하면서도 윤리적 범위가 넓은 ‘이웃’이 적절합니다.
- source_word: תִשָּׂא עָלָיו חֵטְא
  english_pob_choice: bear sin because of him
  chosen_korean: 죄를 짊어지다
  alternatives_korean:
  - 그 일로 죄책을 지다
  - 그의 탓으로 죄를 지다
  - 그의 죄에 참여하다
  lexicon: HALOT
  rationale: 히브리어 관용구는 책망하지 않음으로 인해 죄책을 떠안는 의미를 담으므로, 직역의 힘을 살리면서도 의미가 분명한 ‘죄를 짊어지다’로 옮겼습니다.
theological_decisions:
- issue: 형제/이웃의 범위와 윤리적 적용
  chosen_reading: 남성 단수 친족·공동체 표현을 그대로 유지하되, 문맥상 공동체 전체에 적용되는 윤리로 읽히도록 했습니다.
  alternative_readings:
  - 사람을 미워하지 말라
  - 동료를 꾸짖어라
  rationale: 히브리어의 대표성 있는 남성 단수 표현을 평탄화하지 않고, 레위기 19장의 공동체 윤리라는 범위를 독자가 스스로 읽어내도록 두는 것이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
