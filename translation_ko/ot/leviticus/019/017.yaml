revisions:
- from: 당신은 마음속으로 형제를 미워해서는 안 됩니다. 당신은 반드시 이웃을 꾸짖어야 합니다[a]. 그리고 그로 인해 죄를 짊어져서는 안 됩니다.
  to: 너는 마음속으로 네 형제를 미워해서는 안 됩니다. 너는 네 이웃을 반드시 책망해야 하며, 그로 인해 죄를 짊어져서는 안 됩니다[a].
  rationale: 수신자 호칭을 자연스러운 직접 단수형으로 고치고, 강조형 הוֹכֵחַ תּוֹכִיחַ를 ‘반드시’로 유지했습니다. 주석 표지를 마지막 히브리어 관용구에 옮겼으며, 주석의 설명도 ‘보지 못한 채’라는 원문에 없는 제한 대신 책망하지 않는 맥락으로 정정했습니다. 마지막 구절은 논쟁되는 관용적 폭을 본문과 주석에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:19Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, 마지막 관용구의 주석 표지가 책망 명령에 붙어 있어 원문의 해당 구절과 연결되지 않습니다. 또한 ‘당신은’은 이와 같은 일반적 계명 수신자에게 현대 표준 한국어에서 부자연스럽고 때로 대립적으로 들릴 수 있습니다.
  naturalness: ‘너는’과 합쇼체 종결을 결합한 문체가 성경의 직접적인 단수 계명에 더 자연스럽습니다. ‘반드시 책망해야 하며’는 강조형을 살리면서 ‘꾸짖다’보다 הוכיח의 교정·책망 의미를 과도한 감정적 뉘앙스 없이 전달합니다.
  terminology: ‘형제’, ‘이웃’, ‘미워하다’는 적절합니다. 마지막의 ‘죄를 짊어지다’는 נָשָׂא חֵטְא의 직역적 힘을 보존하며, 주석에서 죄책을 지는 해석 및 다른 가능성을 밝혀야 합니다.
  issues:
