id: LEV.19.8
reference: Leviticus 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
  footnotes:
  - marker: a
    text: Or 'shall bear his guilt.' The Hebrew idiom can refer to bearing culpability and its consequences.
    reason: lexical_alternative
  - marker: b
    text: '''The holy thing of the LORD'' refers to what has been consecrated to the LORD, here the sacrificial meat.'
    reason: cultural_note
  - marker: c
    text: Or 'that soul shall be cut off.' The Hebrew says 'soul,' a legal idiom for the person.
    reason: lexical_alternative
  - marker: d
    text: '''Shall be cut off'' is a covenantal penalty formula; the text does not specify here whether this means death, expulsion, or direct divine judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것을 먹는 자는 자기의 죄악을 져야 합니다[a]. 이는 그가 야훼의 거룩한 것을 더럽혔기 때문입니다. 그 사람은 자기 백성 가운데에서 끊어질 것입니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 죄책을 져야 합니다.’ 히브리어 관용구는 죄책과 그 결과를 떠맡는다는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 영혼은 끊어질 것입니다.’ 히브리어는 ‘영혼’을 쓰지만, 법률 문맥에서는 그 사람 전체를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘끊어질 것입니다’는 언약적 형벌 공식입니다. 이 절만으로는 그것이 죽음인지, 추방인지, 또는 직접적인 신적 심판인지를 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  english_pob_choice: Whoever eats it
  chosen_korean: 그것을 먹는 자
  alternatives_korean:
  - 누구든지 그것을 먹는 사람
  - 그것을 먹는 자마다
  lexicon: HALOT
  rationale: 분사형+소유 접미사는 금지된 시기에 그 제물을 먹는 사람을 가리키므로, 현대 한국어에서는 일반적 법정 표현인 ‘그것을 먹는 자’로 간결하게 옮겼습니다.
- source_word: עֲוֺנוֹ יִשָּׂא
  english_pob_choice: shall bear his iniquity
  chosen_korean: 자기의 죄악을 져야 합니다
  alternatives_korean:
  - 자기의 죄를 져야 합니다
  - 자기의 죄악에 대한 책임을 져야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리기 위해 ‘죄악을 지다’ 구조를 유지했고, ‘책임을 지다’보다 법적·신학적 무게가 더 잘 드러나도록 했습니다.
- source_word: קֹדֶשׁ יְהוָה
  english_pob_choice: the holy thing of Yahweh
  chosen_korean: 야훼의 거룩한 것
  alternatives_korean:
  - 야훼께 속한 거룩한 제물
  - 야훼의 거룩한 제물
  lexicon: HALOT
  rationale: 문맥상 제물임이 앞절에서 분명하지만, 이 절 자체는 ‘거룩한 것’이라고 말하므로 그 표현을 유지해 제의적 거룩성의 초점을 보존했습니다.
- source_word: חִלֵּל
  english_pob_choice: has profaned
  chosen_korean: 더럽혔기 때문입니다
  alternatives_korean:
  - 속되게 했기 때문입니다
  - 거룩하지 않게 했기 때문입니다
  lexicon: HALOT
  rationale: 피엘형 חלל은 거룩한 것을 속된 것으로 취급한다는 뜻이므로, 교회용어보다 직설적인 ‘더럽히다’로 옮겨 오염·모독의 의미를 살렸습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 끊어지게 될 것입니다
  - 제명될 것입니다
  lexicon: HALOT
  rationale: 족장적/언약적 형벌 공식의 관용성을 보존하기 위해 판단 기제를 특정하지 않고, 한국어에서도 동일한 이미지인 ‘끊어지다’로 옮겼습니다.
theological_decisions:
- issue: ‘끊어질 것입니다’ 형벌 공식의 해석 범위
  chosen_reading: 죽음, 추방, 직접적 심판 가운데 어느 하나로 특정하지 않고 관용구를 유지했습니다.
  alternative_readings:
  - 사형당할 것입니다
  - 출교될 것입니다
  - 하나님의 심판으로 제거될 것입니다
  rationale: 히브리어의 형벌 공식은 결과를 강하게 말하지만 방식은 이 절에서 명시하지 않으므로, POB의 원칙에 따라 해석을 열어 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it).
