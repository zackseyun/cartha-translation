review_pass:
  verdict: revise
  source_fidelity: The translation accurately preserves the generic offender, the guilt-bearing idiom, the causal clause, the non-specific ‘cut off’ penalty formula, and the legal sense of נֶפֶשׁ as ‘person.’ ‘야훼의 거룩한 것’ appropriately avoids adding ‘sacrifice’ where the clause itself does not explicitly say so.
  naturalness: ‘자기의 죄악을 져야 합니다’ is understandable but not idiomatic modern Korean; 죄악 is more naturally paired with ‘짊어지다’ in this retained biblical-legal idiom. ‘자기 백성 가운데에서’ is also less direct than ‘자기 백성에게서’ for מֵעַמֶּיהָ.
  terminology: ‘야훼,’ ‘거룩한 것,’ and ‘끊어질 것입니다’ are suitable. ‘더럽혔기 때문입니다’ conveys profanation adequately in this context without deciding the penalty’s mechanism.
  issues:
  - severity: low
    issue: ‘죄악을 지다’ is awkward in modern standard Korean.
    rationale: Revising it to ‘죄악을 짊어져야 합니다’ retains the Hebrew idiom’s culpability-and-consequence force while improving naturalness.
  - severity: low
    issue: ‘자기 백성 가운데에서 끊어질’ is less direct than the Hebrew prepositional expression.
    rationale: ‘자기 백성에게서 끊어질’ is the natural Korean rendering of being cut off from one’s people.
