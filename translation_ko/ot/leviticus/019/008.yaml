- from: 그것을 먹는 자는 자기의 죄악을 져야 합니다[a]. 이는 그가 야훼의 거룩한 것을 더럽혔기 때문입니다. 그 사람은 자기 백성 가운데에서 끊어질 것입니다[c][d].
  to: 그것을 먹는 자는 자기 죄악을 짊어져야 합니다[a]. 이는 그가 야훼의 거룩한 것을 더럽혔기 때문입니다. 그 사람은 자기 백성에게서 끊어질 것입니다[c][d].
