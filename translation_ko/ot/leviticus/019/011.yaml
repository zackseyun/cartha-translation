    text: Literally, 'a man with his fellow' or 'each man to his neighbor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 도둑질하지 말고, 거짓되이 행하지 말며, 서로 속이지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '사람이 자기 동료와/자기 이웃에게'라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  english_pob_choice: you shall not steal
  chosen_korean: 도둑질하지 말라 / 도둑질하지 마십시오
  alternatives_korean:
  - 훔치지 마십시오
  - 도적질하지 마십시오
  lexicon: HALOT
  rationale: גנב의 기본 의미는 '훔치다/도둑질하다'이므로, 직접적이고 일상적인 한국어로 옮겼습니다. 법규 문맥의 금지형이므로 합쇼체 금지 표현을 사용했습니다.
- source_word: תְכַחֲשׁוּ
  english_pob_choice: you shall not deal falsely
  chosen_korean: 거짓되이 행하지 마십시오
  alternatives_korean:
  - 속이지 마십시오
  - 거짓말하지 마십시오
  lexicon: HALOT
  rationale: כחש는 단순한 '거짓말하다'보다 더 넓게 속임과 불성실한 행위를 포함할 수 있으므로, 단지 발화 행위로 좁히지 않고 '거짓되이 행하다'로 넓게 살렸습니다.
- source_word: תְשַׁקְּרוּ
  english_pob_choice: you shall not lie
  chosen_korean: 서로 속이지 마십시오
  alternatives_korean:
  - 거짓말하지 마십시오
  - 서로 거짓말하지 마십시오
  lexicon: HALOT
  rationale: שקר는 거짓을 말하거나 거짓되게 행동하는 뜻이 있으나, 뒤의 상대어구와 결합된 사회적 금지로서 관계적 의미가 분명하므로 '서로 속이지 마십시오'가 자연스럽고 포괄적입니다.
- source_word: אִישׁ בַּעֲמִיתוֹ
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 이웃에게
  - 각 사람이 자기 이웃에게
  lexicon: HALOT
  rationale: 직역하면 '사람이 자기 동료/이웃과'이지만, 문맥상 상호적 금지를 나타내므로 한국어에서는 '서로'로 간명하게 옮겼습니다. 남성 단수형은 대표적 일반 표현으로 보았습니다.
theological_decisions:
- issue: 히브리어 삼중 금지문의 문체
  chosen_reading: 세 개의 금지 명령을 각각 살리되, 마지막 문장은 상호관계를 드러내는 '서로'로 번역했습니다.
  alternative_readings:
  - 도둑질하지 말며, 거짓되이 행하지 말며, 사람마다 자기 이웃에게 거짓말하지 마십시오.
  rationale: 본문은 공동체 윤리를 규정하는 연속 금지이므로, 의미를 약화시키지 않으면서도 한국어로 자연스럽게 들리도록 병렬 구조를 유지했습니다.
  doctrine_reference: Translation philosophy §4
