  naturalness: 초안의 ‘편대하지’는 표준 한국어 표현이 아니며, ‘너는 … 말며’의 연쇄는 요청된 현대 합쇼체에도 맞지 않습니다. 개정안은 현대 표준어 합쇼체로 명료하고 자연스럽습니다.
  terminology: ‘재판’, ‘불의’, ‘공의’, ‘이웃’은 본문의 법적·윤리적 어휘를 적절히 유지합니다. גָדוֹל은 단순히 신체적으로 ‘큰 자’가 아니라 지위 있는 사람을 가리키므로 ‘유력한 사람’으로 번역했습니다.
