id: LEV.19.32
reference: Leviticus 19:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'in the presence of gray hair'—the Hebrew uses a concrete expression for old age.
    reason: lexical_alternative
  - marker: b
    text: Or 'honor the presence of an elder.' The Hebrew literally says 'honor the face of an old man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 흰머리 앞에서는 일어서고, 늙은이의 얼굴을 존중하며, 당신의 하나님을 경외하십시오. 나는 야훼입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  english_pob_choice: before gray hair
  chosen_korean: 흰머리 앞에서는
  alternatives_korean:
  - 흰머리의 존재 앞에서는
  - 백발 앞에서는
  lexicon: HALOT
  rationale: מִפְּנֵי는 존중의 상황에서 ‘~앞에서/앞에서는’의 뜻을 가지며, שֵׂיבָה의 구체 이미지를 살려 ‘흰머리’로 옮겼습니다.
- source_word: תָּקוּם
  english_pob_choice: you shall rise
  chosen_korean: 일어서고
  alternatives_korean:
  - 일어나고
  - 기립하고
  lexicon: HALOT
  rationale: 공경의 표시로 자리에서 일어나는 동작을 한국어 자연문장에 맞게 ‘일어서고’로 옮겼습니다.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  english_pob_choice: and you shall honor the face of an old man
  chosen_korean: 늙은이의 얼굴을 존중하며
  alternatives_korean:
  - 노인의 얼굴을 존중하며
  - 장로의 얼굴을 공경하며
  lexicon: HALOT
  rationale: הדר는 단순한 예우보다 ‘존중/공경’의 뉘앙스를 가지므로 이를 반영했고, פְּנֵי를 ‘얼굴’로 살려 히브리어 관용을 보존했습니다.
- source_word: וְיָרֵאתָ מֵּאֱלֹהֶיךָ
  english_pob_choice: and you shall fear your God
  chosen_korean: 당신의 하나님을 경외하십시오
  alternatives_korean:
  - 당신의 하나님을 두려워하십시오
  - 당신의 하나님을 경외하고 두려워하십시오
  lexicon: HALOT
  rationale: יָרֵא는 하나님께 대한 언약적 경외를 뜻하므로, 한국어에서는 ‘경외하다’가 ‘fear’의 신학적 긴장을 가장 잘 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름표현을 제목이 아닌 고유명으로 드러내기 위해 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: זקן의 성별 표지 보존
  chosen_reading: 늙은이의 얼굴
  alternative_readings:
  - 노인의 얼굴
  - 어르신의 얼굴
  rationale: 히브리어 זָקֵן은 남성 단수 형태이므로, 원문의 성별 표지를 지우지 않고 보존했습니다. 다만 문맥상 공동체 일반을 향한 대표적 표현으로 읽힙니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: יִרְאָה를 ‘fear’로 유지
  chosen_reading: 경외하십시오
  alternative_readings:
  - 존중하십시오
  - 두려워하십시오
  rationale: 거룩 법전은 하나님에 대한 윤리 명령을 ‘두려움’과 ‘경외’가 함께 있는 언어로 묶습니다. 한국어에서는 지나치게 약화하지 않으면서도 예배적 뉘앙스를 살리기 위해 ‘경외하십시오’를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
