id: LEV.19.9
reference: Leviticus 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
  footnotes:
  - marker: a
    text: Or 'the corner of your field.' The Hebrew term can denote an edge, side, or corner; here it refers to the outer part of the field that must be left unreaped.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 땅의 수확을 거둘 때에는 밭의 가장자리[a]의 곡식을 다 거두지 말고, 너희 수확하고 남은 것을 주워 모으지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭의 모퉁이’. 히브리어는 가장자리, 옆, 모퉁이를 뜻할 수 있으며, 여기서는 추수하지 않고 남겨 두어야 할 밭의 바깥 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  english_pob_choice: When you reap the harvest of your land
  chosen_korean: 밭의 곡식을 거둘 때에는
  alternatives_korean:
  - 땅의 추수를 거둘 때에는
  - 땅의 수확을 거둘 때에는
  lexicon: HALOT
  rationale: 수확 행위를 가리키는 קצר/קציר의 농경법 문맥을 살려 자연스럽게 조건절로 옮겼습니다. '밭의 곡식'은 곡식 수확을 받쳐 주면서도 현대 한국어에서 이해가 쉽습니다.
- source_word: פְּאַת שָׂדְךָ
  english_pob_choice: the edge of your field
  chosen_korean: 땅의 가장자리
  alternatives_korean:
  - 밭의 모퉁이
  - 밭의 끝자락
  lexicon: HALOT
  rationale: פאה는 가장자리, 변두리, 모퉁이를 뜻하므로, 여기서는 추수하지 않고 남겨 두어야 할 바깥쪽 경계를 드러내는 '가장자리'가 가장 무난합니다.
- source_word: לֹא תְכַלֶּה
  english_pob_choice: you shall not completely reap
  chosen_korean: 다 거두지 말고
  alternatives_korean:
  - 끝까지 거두지 말고
  - 완전히 거두지 말고
  lexicon: HALOT
  rationale: כלה의 핵심은 '끝내다/다 마치다'이므로, 추수를 전부 끝내 버리지 말라는 금지를 한국어 관용에 맞게 압축했습니다.
- source_word: לֶקֶט קְצִירְךָ
  english_pob_choice: the gleanings of your harvest
  chosen_korean: 추수한 것의 이삭 떨어진 것들
  alternatives_korean:
  - 추수한 것의 줍는 것들
  - 추수의 이삭 줍는 것들
  lexicon: HALOT
  rationale: לֶקֶט은 남겨진 낟알이나 이삭을 주워 모으는 대상이므로, 전통적 교회어를 쓰지 않고 문맥을 풀어 '이삭 떨어진 것들'로 옮겼습니다.
- source_word: לֹא תְלַקֵּט
  english_pob_choice: you shall not gather
  chosen_korean: 거두어 모으지 마십시오
  alternatives_korean:
  - 줍지 마십시오
  - 모아들이지 마십시오
  lexicon: HALOT
  rationale: לקט은 남은 곡식을 주워 모으는 행위이므로, 단순한 '줍다'보다 농경적 뉘앙스를 살린 '거두어 모으다'를 택했습니다.
theological_decisions:
- issue: 가난한 자와 남겨진 곡식에 관한 율법의 금지 방식
  chosen_reading: 명령문의 금지를 직접적으로 살려, 추수를 '다 거두지 말고'와 '거두어 모으지 마십시오'로 분리해 표현했습니다.
  alternative_readings:
  - 덜 직접적인 권고형
  - 가난한 자를 위한 배려를 해설적으로 덧붙이는 방식
  rationale: 본문은 단순한 농사 지침이 아니라, 소유권 행사를 제한하는 율법 명령이므로 금지의 강도를 약화하지 않는 것이 중요합니다.
  doctrine_reference: 공동체적 자비와 토지 소유의 절제에 관한 토라의 사회윤리
