id: LEV.19.4
reference: Leviticus 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'worthless idols'; the Hebrew term for idols may carry a pejorative sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'molten gods' or 'metal idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 우상을 향해 돌이키지 말고, 너희를 위해 주조한 신상도 만들지 마십시오. 나는 야훼, 너희 하나님입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְנוּ אֶל
  english_pob_choice: turn to
  chosen_korean: 향해 돌이키다
  alternatives_korean:
  - 돌아가다
  - 돌리다
  - 주의를 기울이다
  lexicon: HALOT
  rationale: פנה의 기본 뜻인 ‘돌다/향하다’를 살리면서, אֶל이 주는 방향성을 자연스러운 한국어로 옮겼습니다. ‘우상을 섬기다’처럼 의미를 좁히지 않고, 지향·기울임의 뜻을 보존합니다.
- source_word: אֱלִילִים
  english_pob_choice: idols
  chosen_korean: 우상
  alternatives_korean:
  - 헛된 우상
  - 무가치한 우상
  - 거짓 신상
  lexicon: HALOT
  rationale: אֱלִילִים의 통상적인 의미를 가장 직접적으로 전달하는 말은 ‘우상’입니다. 경멸적 뉘앙스는 가능하지만, 본문 주석에서 충분히 보완되므로 본문은 간결하게 두었습니다.
- source_word: אֱלֹהֵי מַסֵּכָה
  english_pob_choice: cast-metal gods
  chosen_korean: 주조한 신상
  alternatives_korean:
  - 녹여 만든 신상
  - 금속 신상
  - 주조한 신들
  lexicon: HALOT
  rationale: מַסֵּכָה는 금속을 부어 만든 형상을 가리키므로 ‘주조한’이 제조 방식을 분명히 드러냅니다. אֱלֹהֵי의 복수형태를 문자적으로 살리기보다, 한국어에서 우상 금지 맥락에 자연스러운 ‘신상’으로 옮겼습니다.
- source_word: תַעֲשׂוּ לָכֶם
  english_pob_choice: make for yourselves
  chosen_korean: 너희를 위해
  alternatives_korean:
  - 너희 자신을 위해
  - 스스로를 위해
  - 너희에게
  lexicon: HALOT
  rationale: לָכֶם의 수혜적 뉘앙스를 살려 ‘너희를 위해’로 옮겼습니다. ‘만들다’만 두면 단순 제작으로 들릴 수 있어, 목적성을 드러내는 표현을 붙였습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 번역 관례상 ‘야훼’로 일관해, 호칭 대체가 아니라 고유 이름을 보존했습니다. 이는 POB의 स्रोत 직역 원칙과 맞습니다.
theological_decisions:
- issue: 우상 금지의 동사 뉘앙스를 어디까지 드러낼 것인가
  chosen_reading: ‘우상을 향해 돌이키지 말고’로 유지했습니다.
  alternative_readings:
  - ‘우상을 숭배하지 말고’
  - ‘우상에게 마음을 두지 말고’
  rationale: 히브리어 פנה 자체는 ‘돌이키다/향하다’이지 ‘숭배하다’라고 명시하지 않습니다. 따라서 예배 행위를 단정적으로 추가하지 않고, 방향 전환의 표현을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it'
