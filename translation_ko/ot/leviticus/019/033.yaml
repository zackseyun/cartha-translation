id: LEV.19.33
reference: Leviticus 19:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
  footnotes:
  - marker: a
    text: Or 'you shall not oppress him' or 'you shall not wrong him.'
    reason: lexical_alternative
  - marker: b
    text: '''Foreigner'' translates Hebrew ger, a non-native resident living among Israel, often rendered ''sojourner'' or ''resident alien.'''
    reason: cultural_note
translation:
  language: ko
  text: 외국인이 여러분의 땅에서 여러분과 함께 머무를 때, 그를 학대해서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘학대해서는 안 됩니다’는 히브리어 לֹא תוֹנוּ의 폭넓은 의미를 옮긴 것입니다. ‘억압해서는 안 됩니다’ 또는 ‘해를 끼쳐서는 안 됩니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גֵּר는 이스라엘 공동체 안에 사는 비토착 거주자를 가리키며, ‘외국인’, ‘거류민’, ‘거주 외국인’으로 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: 'יָגוּר / english_pob: resides'
  english_pob_choice: resides
  chosen_korean: 머무를 때
  alternatives_korean:
  - 거주할 때
  - 살게 될 때
  - 유숙할 때
  lexicon: HALOT
  rationale: גּוּר는 단순 통과가 아니라 공동체 안에 지속적으로 거주하는 상황을 가리키므로, 법문체에 맞는 ‘머무르다’로 옮겨 residency의 뉘앙스를 살렸습니다.
- source_word: 'גֵּר / english_pob: foreigner'
  english_pob_choice: foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 나그네
  - 거류민
  - 거주 외국인
  lexicon: HALOT
  rationale: 여기서 גֵּר는 이스라엘 땅 안에 사는 비토착 거주자를 뜻하므로, 현대 독자에게 즉각 이해되는 ‘외국인’을 기본으로 두어 비유적 의미가 아닌 사회적 신분을 드러냈습니다.
- source_word: 'לֹא תוֹנ֖וּ / english_pob: you shall not mistreat'
  english_pob_choice: you shall not mistreat
  chosen_korean: 학대해서는 안 됩니다
  alternatives_korean:
  - 학대하지 말아야 합니다
  - 억압해서는 안 됩니다
  - 해를 끼쳐서는 안 됩니다
  lexicon: HALOT
  rationale: Hiphil ינה는 ‘억누르다/억압하다/학대하다/해치다’의 폭을 가지므로, POB의 ‘mistreat’에 맞춰 강한 부당 대우를 포함하는 ‘학대하다’를 택했습니다.
- source_word: 'אֹתוֹ / english_pob: him'
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  - 그 외국인을
  lexicon: HALOT
  rationale: 히브리어 대명사 남성 단수의 지시를 그대로 살려, 성별을 중립화하지 않고 ‘그를’로 옮겼습니다.
theological_decisions:
- issue: גֵּר의 사회적 보호 범위
  chosen_reading: 이 구절은 단순한 ‘낯선 사람’이 아니라 공동체 안에 거주하는 비토착 거주자를 보호하는 법조항으로 읽었습니다.
  alternative_readings:
  - 나그네로 읽기
  - 거류민으로 읽기
  - 이주민으로 읽기
  rationale: 본문의 동사 יָגוּר(머무르다/거주하다)와 결합해, 대상은 일시적 방문객이 아니라 공동체 내부에 실제로 머무는 사람입니다. 따라서 보호 의무가 분명히 드러나도록 사회법적 의미를 유지했습니다.
  doctrine_reference: 레위기 19장의 성결 법전 맥락; POB 번역 원칙 §§5–6
- issue: 명령형의 현대 한국어 문체
  chosen_reading: 직설적인 법규 표현인 ‘-해서는 안 됩니다’로 옮겼습니다.
  alternative_readings:
  - ‘~하지 말아야 합니다’
  - ‘~하지 마십시오’
  rationale: 본문은 제의적 권면이 아니라 공동체 법규이므로, 현대 표준어에서 가장 분명한 금지 표현을 사용했습니다.
  doctrine_reference: 법문체/명령문 번역 원칙
