  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
  footnotes:
  - marker: a
    text: Or, more formally, 'holy, praises to the LORD' or 'holy, for praise to the LORD.' The Hebrew phrase is rare and may emphasize celebratory praise offered with the fruit.
