translation:
  language: ko
  text: 그러나 넷째 해에는 그 모든 열매가 야훼께 찬양을 드리기 위한 거룩한 것이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거룩한 것, 야훼께 드리는 찬양들’ 또는 ‘거룩한 것, 야훼께 찬양을 드리기 위한 것’에 가깝습니다. 히브리어 구문은 희귀하며, 열매가 예배적 기쁨과 찬양에 관련된 거룩한 용도로 드려짐을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  english_pob_choice: But in the fourth year
  chosen_korean: 그러나 넷째 해에는
  alternatives_korean:
  - 그리고 넷째 해에는
  - 넷째 해에는
  lexicon: WLC; HALOT
  rationale: 문맥상 앞선 해들의 사용 규정과 대비되는 전환이므로 ‘그러나’로 역접을 살렸고, זמן 구문은 ‘넷째 해에는’으로 자연스럽게 옮겼습니다.
- source_word: כָּל פִּרְיוֹ
  english_pob_choice: all its fruit
  chosen_korean: 그 모든 열매가
  alternatives_korean:
  - 그 열매 전체가
  - 모든 열매가
  lexicon: WLC; HALOT
  rationale: 3인칭 남성 단수 접미사는 앞의 나무/수확물을 가리키므로, 전체성을 드러내는 ‘그 모든 열매’가 가장 직접적입니다.
- source_word: קֹדֶשׁ
  english_pob_choice: holy
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 거룩한
  - 성별된 것
  lexicon: WLC; HALOT
  rationale: 서술적 용법의 קֹדֶשׁ을 한국어에서 명사화해, 열매가 단순히 ‘거룩하다’가 아니라 거룩한 상태로 구별되어 있음을 분명히 했습니다.
- source_word: הִלּוּלִים לַיהוָה
  english_pob_choice: for giving praise to Yahweh
  chosen_korean: 야훼께 드리는 칭송의
  alternatives_korean:
  - 야훼께 드리는 찬양의
  - 야훼를 위한 칭송의
  lexicon: HALOT
  rationale: 희귀한 הִלּוּלִים는 단순한 추상명사보다 예배적·축제적 칭송을 가리키므로 ‘칭송’으로 옮기고, לַיהוָה는 헌정의 방향을 살려 ‘야훼께’로 표현했습니다.
theological_decisions:
- issue: 희귀한 제의적 구문 קֹדֶשׁ הִלּוּלִים의 처리
  chosen_reading: 거룩한 것, 야훼께 드리는 칭송의
  alternative_readings:
  - 거룩한, 칭송을 드리기 위한
  - 거룩한, 야훼께 드리는 찬양의
  rationale: 이 표현은 열매의 상태와 그 목적(야훼께 드리는 칭송)을 함께 담고 있어, 두 요소를 분리하지 않고 한국어에서 연결 구조로 살리는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: source transparency; preserve lexical tension rather than flattening into a generic offering formula
