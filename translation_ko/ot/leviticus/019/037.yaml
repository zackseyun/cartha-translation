  verdict: revise
  source_fidelity: ‘그러므로’는 히브리어 접속사 וְ의 가능한 문맥적 해석이지만, 원문 자체는 단순 접속이며 이 절에 명시적 결론 표지는 없습니다. 이를 제거하고 ‘지키고 … 행하십시오’로 두 동사의 명령적 연속을 직접 반영하는 편이 더 충실합니다.
  naturalness: 합쇼체에서는 ‘지키고, 그것들을 행해야 합니다’보다 ‘지키고 그것들을 행하십시오’가 법적·명령적 문맥에 더 자연스럽고 직접적입니다. 쉼표는 병렬 서술어 사이에서 불필요합니다.
  terminology: ‘규례’와 ‘법도’는 חֻקּוֹת와 מִשְׁפָּטִים의 구별을 무리 없이 보존합니다. 다만 각주의 대안어 설명은 본문의 ‘규례’를 다시 대안으로 제시하여 정보가 불명확했고, 각주 표지도 법률 용어가 아니라 ‘야훼’ 뒤에 잘못 놓였습니다.
