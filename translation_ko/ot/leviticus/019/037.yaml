source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'my decrees' for 'my statutes,' and 'my rules' or 'my ordinances' for 'my judgments.' The Hebrew uses two distinct legal terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 내 모든 규례와 내 모든 법도를 지키고, 그것들을 행해야 합니다. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 규례'로, 그리고 '내 법도' 또는 '내 규정'으로도 옮길 수 있습니다. 히브리어는 서로 다른 두 법률 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: So you shall keep
  chosen_korean: 그러므로 너희는 … 지키고
  alternatives_korean:
  - 그리고 너희는 … 지키고
  - 너희는 … 지켜야 합니다
  lexicon: HALOT
  rationale: 문맥상 레위기 19장의 결론부이므로 영어 POB의 'So'에 맞춰 한국어도 결론·요약의 뉘앙스를 살렸습니다. '지키다'는 언약적·법적 맥락의 שׁמר를 자연스럽게 반영합니다.
- source_word: חֻקֹּתַי / מִשְׁפָּטַי
  english_pob_choice: my statutes / my judgments
  chosen_korean: 내 모든 규례와 내 모든 법도
  alternatives_korean:
  - 내 모든 규정과 내 모든 판결
  - 내 모든 법규와 내 모든 규례
  lexicon: HALOT
  rationale: 두 히브리어 법률 용어의 구별을 살리기 위해 서로 다른 한국어 표현을 사용했습니다. חֻקּוֹת는 관습적·규정된 명령의 느낌이 강해 '규례', מִשְׁפָּטִים은 판정·법적 판단의 함의를 살려 '법도'로 옮겼습니다.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  english_pob_choice: and do them
  chosen_korean: 그것들을 행해야 합니다
  alternatives_korean:
  - 그것들을 해야 합니다
  - 그것들을 실천해야 합니다
  lexicon: HALOT
  rationale: עשה는 계명 대상과 함께 쓰일 때 단순한 수행·실천의 뜻이므로, 명령성을 분명히 하면서도 직접적인 '행하다'를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와가 아닌 '야훼'로 음역하여 언약적 고유명을 보존했습니다.
theological_decisions:
- issue: 레위기 19장 결론부의 지시 연결어
  chosen_reading: '''그러므로''로 옮겨 장 전체의 결론적 요약성을 드러냈습니다.'
  alternative_readings:
  - '''그리고''로 단순 연결'
  - 아예 연결어를 생략
  rationale: 히브리어 접두사 וְ의 단순 연결 기능을 넘어서, 이 절이 앞선 규례 묶음의 마무리 명령이라는 문맥적 힘이 강하므로 한국어에서 결론성을 드러내는 것이 더 정확합니다.
  doctrine_reference: 문맥-수사적 결론 처리
