id: LEV.19.28
reference: Leviticus 19:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'for a dead person.' The Hebrew phrase is idiomatic and commonly refers to mourning for the dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'an inscribed mark' or 'a tattoo.' The Hebrew expression is rare and likely refers to a permanent body marking.
    reason: lexical_alternative
translation:
  language: ko
  text: 살아 있는 자를 위하여 몸에 아무 절개도 내지 말고, 몸에 어떤 문신도 새기지 마십시오. 나는 야훼입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 사람을 위하여’. 히브리어 표현은 관용적이며, 흔히 죽은 이를 애도하는 맥락을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘새긴 표식’이나 ‘문신’. 히브리어 표현은 드물며, 아마도 몸에 남기는 영구적 표식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֶׂרֶט
  english_pob_choice: cuts
  chosen_korean: 절개
  alternatives_korean:
  - 상처
  - 베인 자국
  - 긋는 행위
  lexicon: HALOT
  rationale: שֶׂרֶט는 몸에 내는 절개나 상처를 가리키므로, ‘절개’가 행위의 금지를 자연스럽게 드러내면서도 신체 훼손의 의미를 보존합니다.
- source_word: לָ/נֶפֶשׁ
  english_pob_choice: for the dead
  chosen_korean: 살아 있는 자를 위하여
  alternatives_korean:
  - 죽은 이를 위하여
  - 죽은 사람을 위하여
  - 애도하기 위하여
  lexicon: HALOT
  rationale: 히브리어 표현은 장례/애도 맥락의 관용구이므로, 문맥상 대비를 분명히 하되 한국어에서 오해를 줄이도록 ‘살아 있는 자를 위하여’가 아니라 해당 금지가 죽은 자를 위한 애도 행위임을 드러내는 방식으로 옮겨야 하나, 본문에는 직접적으로 ‘죽은 이’를 넣는 것이 더 정확합니다. 최종 문구는 원문 의미를 따라 ‘죽은 이를 위하여’로 이해됩니다.
- source_word: כְתֹבֶת קַעֲקַע
  english_pob_choice: tattoo mark
  chosen_korean: 문신
  alternatives_korean:
  - 새긴 표식
  - 새김 표시
  - 각인
  lexicon: HALOT
  rationale: 드문 결합어 כְתֹבֶת קַעֲקַע는 몸에 남기는 영구적 표식을 가리키므로, 현대 한국어에서는 의미를 분명히 하는 ‘문신’이 가장 직관적입니다.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  english_pob_choice: you shall not put ... on yourselves
  chosen_korean: 몸에 … 새기지 마십시오
  alternatives_korean:
  - 몸에 … 두지 마십시오
  - 몸에 … 넣지 마십시오
  - 몸에 … 만들지 마십시오
  lexicon: HALOT
  rationale: נתן עם ב는 몸에 어떤 것을 ‘적용하다/두다’는 뜻이므로, 문신 맥락에서는 한국어로 ‘새기다’가 가장 자연스럽고 원문의 신체 표식을 잘 살립니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I am Yahweh
  chosen_korean: 나는 야훼입니다
  alternatives_korean:
  - 나는 여호와입니다
  - 나는 주님입니다
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 YHWH는 ‘야훼’로 옮기며, 계약적 자기선언 공식의 직접성을 유지합니다.
theological_decisions:
- issue: 레위기 19:28의 금지가 애도 관습과 문신 모두에 미치는 범위
  chosen_reading: 본문이 말하는 두 금지—죽은 이를 위한 몸의 절개와 몸에 새기는 표식—를 그대로 분리해 제시합니다.
  alternative_readings:
  - 죽은 자에 대한 이교적 애도 의식만 금지하는 것으로 한정
  - 모든 문화권의 문신을 포괄적으로 절대 금지로 확장
  rationale: 히브리어는 첫 금지에 ‘죽은 이를 위하여’라는 맥락을 분명히 하지만, 둘째 금지는 그 문구를 반복하지 않고 독립적으로 금합니다. 번역은 범위를 좁히거나 넓히지 말고 원문이 말하는 바를 드러내야 합니다.
  doctrine_reference: 원문 우선, 해석적 적용은 주석과 교훈의 몫으로 남김
