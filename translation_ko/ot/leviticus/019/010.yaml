source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'glean your vineyard'; the Hebrew verb refers to going over the vines again to take what remains after the main harvest.
    reason: lexical_alternative
  - marker: b
    text: Or 'the gleanings of your vineyard'; the Hebrew refers to grapes left behind or fallen during harvest.
    reason: lexical_alternative
  - marker: c
    text: Or 'resident foreigner.' The Hebrew 'sojourner' refers to a non-native person living among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 포도원을 끝까지 훑어 거두지 마십시오[a]. 포도원에서 떨어진 포도알도 거두지 마십시오[b]. 그것들을 가난한 사람과 거류민을 위하여 남겨 두십시오[c]. 나는 야훼, 여러분의 하나님입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도원을 이삭줍지 마십시오.’ 히브리어 동사는 주된 수확 뒤에 포도나무를 다시 훑어 남은 것을 거두는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포도원의 남은 포도.’ 히브리어는 수확 중 떨어지거나 남겨진 포도를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거류민’은 이스라엘 가운데 거주하는 비토착민을 가리키는 히브리어 גֵּר의 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְעוֹלֵל
  english_pob_choice: strip ... bare
  chosen_korean: 다 거두어 가지 말고
  alternatives_korean:
  - 다 훑어 가지 말고
  - 끝까지 따 가지 말고
  - 깡그리 거두지 말고
  lexicon: HALOT
  rationale: 반복 수확까지 포함한 ‘완전히 거두어 감’을 한국어로 자연스럽게 풀어, 기술적 ‘이삭줍다’보다 금지의 범위를 분명히 드러냅니다.
- source_word: פֶּרֶט
  english_pob_choice: the fallen grapes
  chosen_korean: 떨어진 열매
  alternatives_korean:
  - 떨어진 포도알
  - 남은 포도알
  - 낙과
  lexicon: HALOT
  rationale: 포도원 문맥에서 harvest afterfall을 구체적으로 가리키는 표현이므로, 현대 독자가 바로 이해할 수 있게 ‘떨어진 열매’로 옮겼습니다.
- source_word: וְלַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인 거주자
  - 체류자
  lexicon: HALOT
  rationale: גֵּר의 핵심은 이스라엘 가운데 사는 비토착 거주자이므로, 법조문 맥락에서 지나치게 행정적이지 않으면서도 낯선 ‘나그네’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼, 여러분의 하나님
  alternatives_korean:
  - 여호와, 여러분의 하나님
  - 주님, 여러분의 하나님
  lexicon: HALOT
  rationale: 문맥상 언약적 자기선언이므로 신적 이름을 ‘야훼’로 직접 옮기고, אָנ의 소유격을 ‘여러분의 하나님’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יהוה는 전통적 대체칭호 ‘주’ 대신 고유명사 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약적 이름을 직접 사용하므로, 신적 호칭으로 바꾸지 않고 이름 자체를 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
