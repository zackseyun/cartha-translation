  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'necromancers' for 'mediums,' and 'those with familiar spirits' or 'wizards' for 'spiritists.' The Hebrew terms refer to forbidden practitioners associated with consulting spirits or the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 영매들이나 신접한 자들에게로 향하지 말고, 그들을 찾지도 마십시오[a]. 그들로 말미암아 부정하게 되지 마십시오. 나는 너희의 하나님 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영매들’을 ‘죽은 이의 영을 부르는 자들’ 또는 ‘강신술사들’로, ‘신접한 자들’을 ‘영을 아는 자들’, ‘박수들’ 또는 ‘주술사들’로 옮길 수 있습니다. 히브리어 두 용어는 영들이나 죽은 이들과의 교섭에 관련된, 금지된 실천자들을 가리킵니다.
    reason: lexical_alternative
