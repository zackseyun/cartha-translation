    reason: lexical_alternative
  revision_rationale: The revision uses ‘영매들’ for אוֹב to avoid reducing the first category to generic divination, retains ‘신접한 자들’ as a distinguishable but suitably broad rendering of יִדְּעֹנִים, and supplies a lexical note that preserves scholarly uncertainty. It replaces the awkward ‘찾아 구하다’ with the direct ‘찾다’ and recasts the final prohibition in natural formal Korean without narrowing the meaning of טמא.
