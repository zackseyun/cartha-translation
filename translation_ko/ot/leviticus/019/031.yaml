id: LEV.19.31
reference: Leviticus 19:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'necromancers' for 'mediums,' and 'those with familiar spirits' or 'wizards' for 'spiritists.' The Hebrew terms refer to forbidden practitioners associated with consulting spirits or the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 점치는 자들이나 신접한 자들에게로 향하지 말고, 그들을 찾아 구하지도 마십시오. 그들로 말미암아 스스로 부정하게 되지 않게 하십시오. 나는 너희의 하나님 야훼입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּפְנוּ אֶל
  english_pob_choice: Do not turn to
  chosen_korean: …에게로 향하지 말고
  alternatives_korean:
  - …에게로 돌이키지 말고
  - …을/를 찾지 말고
  - …에게로 가지 말고
  lexicon: HALOT
  rationale: פּנה의 기본 의미인 ‘향하다/돌리다’를 살려, 금지의 방향성을 분명하게 하면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: הָאֹבֹת
  english_pob_choice: mediums
  chosen_korean: 점치는 자들
  alternatives_korean:
  - 무당들
  - 강신술사들
  - 영매들
  lexicon: HALOT
  rationale: 오브는 죽은 자와의 교섭과 연결된 금지된 실천자를 가리키므로, 현대 독자에게 가장 가까운 기능을 드러내는 ‘점치는 자들’을 택했습니다.
- source_word: הַיִּדְּעֹנִים
  english_pob_choice: spiritists
  chosen_korean: 신접한 자들
  alternatives_korean:
  - 영을 아는 자들
  - 주술사들
  - 영매자들
  lexicon: HALOT
  rationale: 이 용어는 금지된 영적 지식/접신과 관련된 실천자를 가리키므로, 한국어 성경에서 관용적으로도 통하는 ‘신접한 자들’을 사용하되, 앞항과 구별되도록 유지했습니다.
- source_word: לְטָמְאָה בָהֶם
  english_pob_choice: to become unclean by them
  chosen_korean: 그들로 말미암아 스스로 부정하게 되지 않게 하십시오
  alternatives_korean:
  - 그들로 인해 부정해지지 않게 하십시오
  - 그들 때문에 더럽혀지지 않게 하십시오
  - 그들로 말미암아 부정하게 되지 마십시오
  lexicon: HALOT
  rationale: טמא의 결과를 ‘부정하게 되다’로 살리면서, 금지의 목적·결과를 드러내기 위해 한국어에서는 자연스러운 예방형 표현을 사용했습니다. ‘스스로’는 행위의 결과가 당사자에게 돌아감을 분명히 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명은 전통적 대용어가 아니라 음역형 ‘야훼’로 반영하여, 본문이 하나님의 이름을 직접 말한다는 점을 보존했습니다.
theological_decisions:
- issue: ‘부정’의 성격을 ritual/moral 중 하나로 좁힐지 여부
  chosen_reading: ‘부정하게 되다’로 넓게 유지해, 의례적·도덕적 오염 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - 의례적으로 부정하게 되지 않게 하십시오
  - 도덕적으로 더럽혀지지 않게 하십시오
  rationale: 레위기의 טמא는 문맥에 따라 의례적/도덕적 차원을 함께 가질 수 있으므로, 본절의 긴장을 해소하지 않고 보존하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
