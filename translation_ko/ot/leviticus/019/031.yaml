- from: 너희는 점치는 자들이나 신접한 자들에게로 향하지 말고, 그들을 찾아 구하지도 마십시오. 그들로 말미암아 스스로 부정하게 되지 않게 하십시오. 나는 너희의 하나님 야훼입니다.
  to: 너희는 영매들이나 신접한 자들에게로 향하지 말고, 그들을 찾지도 마십시오[a]. 그들로 말미암아 부정하게 되지 마십시오. 나는 너희의 하나님 야훼입니다.
  rationale: The revision uses ‘영매들’ for אוֹב to avoid reducing the first category to generic divination, retains ‘신접한 자들’ as a distinguishable but suitably broad rendering of יִדְּעֹנִים, and supplies a lexical note that preserves scholarly uncertainty. It replaces the awkward ‘찾아 구하다’ with the direct ‘찾다’ and recasts the final prohibition in natural formal Korean without narrowing the meaning of טמא.
