review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s basic prohibitions and divine self-identification, but ‘점치는 자들’ is too broad for אוֹב and obscures its more specific association with mediumship/consulting the dead. The wording ‘그들을 찾아 구하지도 마십시오’ is also semantically and idiomatically awkward: ‘찾다’ and ‘구하다’ overlap here, while 구하다 can suggest asking them for something rather than seeking them out.'
  naturalness: The register is consistently modern formal-polite, but ‘그들을 찾아 구하지도 마십시오’ is not natural Korean in this context, and ‘스스로 부정하게 되지 않게 하십시오’ is a cumbersome double-negative/preventive formulation. A direct prohibition is clearer and closer to the Hebrew.
  terminology: Render אוֹב as ‘영매들’ and retain ‘신접한 자들’ for יִדְּעֹנִים, with a note explaining that both are ancient prohibited practitioner categories and that exact lexical distinctions remain uncertain. ‘부정하게 되다’ appropriately preserves the breadth of טמא without deciding between ritual and moral defilement. ‘야훼’ correctly represents the stated policy for יהוה.
  issues:
  - severity: medium
    issue: ‘점치는 자들’ is overly general for הָאֹבֹת.
    rationale: The term denotes a medium or practitioner associated with spirits/the dead, not divination in general. ‘영매들’ more closely reflects both the Hebrew lexical range and the English audit trail.
  - severity: medium
    issue: ‘그들을 찾아 구하지도 마십시오’ is redundant and unnatural.
    rationale: The Hebrew has ‘do not seek [them]’; Korean ‘그들을 찾지도 마십시오’ conveys this directly. Adding 구하다 blurs the sense and produces an awkward collocation.
  - severity: low
    issue: ‘스스로 부정하게 되지 않게 하십시오’ is unnecessarily indirect.
    rationale: It turns the Hebrew prohibition/result expression into a cumbersome preventive double-negative. ‘그들로 말미암아 부정하게 되지 마십시오’ is direct, natural, and retains the ambiguity of the defilement.
  revised_text: 너희는 영매들이나 신접한 자들에게로 향하지 말고, 그들을 찾지도 마십시오[a]. 그들로 말미암아 부정하게 되지 마십시오. 나는 너희의 하나님 야훼입니다.
  revised_footnotes:
