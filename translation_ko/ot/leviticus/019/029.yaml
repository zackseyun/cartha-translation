source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
  footnotes:
  - marker: a
    text: Or, 'by prostituting her' or 'to make her commit prostitution.' The Hebrew verb is causative.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'lest the land commit prostitution.' The phrase speaks metaphorically of the community becoming corrupted.
    reason: lexical_alternative
  - marker: c
    text: Or, 'lewdness' or 'wickedness.' The Hebrew term denotes outrageous moral depravity, often in a sexual context.
    reason: lexical_alternative
translation:
  language: ko
  text: 딸을 매춘하게 하여 욕되게 하지 마십시오. 그러면 그 땅이 음행하고 그 땅에 음란한 행위가 가득하게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘매춘하게 하여’는 히브리어 사역형으로, 딸이 매춘을 하도록 만들거나 매춘에 내맡기는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 땅이 음행하다’입니다. 땅이 음행한다는 표현은 그 땅의 공동체가 그러한 부패에 빠지는 것을 비유적으로 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 זִמָּה는 성적 문란을 포함하는, 심각하고 수치스러운 도덕적 일탈을 가리킵니다.
    reason: lexical_alternative
