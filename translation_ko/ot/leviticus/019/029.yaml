source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
  footnotes:
  - marker: a
    text: Or, 'by prostituting her' or 'to make her commit prostitution.' The Hebrew verb is causative.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'lest the land commit prostitution.' The phrase speaks metaphorically of the community becoming corrupted.
    reason: lexical_alternative
  - marker: c
    text: Or, 'lewdness' or 'wickedness.' The Hebrew term denotes outrageous moral depravity, often in a sexual context.
    reason: lexical_alternative
translation:
  language: ko
  text: 딸을 음행하게 하여 그를 더럽히지 마십시오. 그러면 그 땅이 음행에 빠지고 그 땅이 음란함으로 가득 찰까 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히필형은 사역 의미를 지니므로, ‘음행하게 하다’는 ‘그를/그녀를 음행하게 만들다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 땅이 음행하다’입니다. 본문은 공동체/땅이 성적 부패로 의인화되는 비유를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: זִמָּה는 문맥상 대담한 성적 문란을 포함하는 도덕적 타락을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  english_pob_choice: profane
  chosen_korean: 더럽히지 마십시오
  alternatives_korean:
  - 거룩을 더럽히지 마십시오
  - 속되게 하지 마십시오
  - 모독하지 마십시오
  lexicon: HALOT
  rationale: 레위기의 거룩/속됨 구도를 살리되, 한국어에서는 ‘프로페인(profane)’의 직접 대응이 자연스럽지 않으므로 ‘더럽히다’로 풀어 화행을 유지했습니다.
- source_word: בִּתְּךָ
  english_pob_choice: your daughter
  chosen_korean: 딸
  alternatives_korean:
  - 당신의 딸
  - 네 딸
  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유가 분명하지만, 한국어 경고문에서는 소유 대명사를 생략해도 대상이 명확하므로 간결하게 ‘딸’로 옮겼습니다.
- source_word: לְהַזְנוֹתָהּ
  english_pob_choice: by making her a prostitute
  chosen_korean: 음행하게 하여
  alternatives_korean:
  - 창녀로 만들어
  - 몸을 팔게 하여
  - 매춘하게 하여
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도 현대 한국어에서 노골적 직역보다 본문의 도덕적 행위를 포착하는 ‘음행하게 하다’를 택했습니다.
- source_word: תִזְנֶה הָאָרֶץ
  english_pob_choice: the land become prostituted
  chosen_korean: 그 땅이 음행에 빠지고
  alternatives_korean:
  - 그 땅이 매춘에 빠지고
  - 그 땅이 음란해지고
  - 그 땅이 음행하게 되고
  lexicon: HALOT
  rationale: ‘땅’에 대한 의인화와 비유를 유지하되, 한국어에서 ‘땅이 창녀가 되다’류의 표현보다 공동체적 부패를 드러내는 ‘음행에 빠지다’가 자연스럽습니다.
- source_word: זִמָּה
  english_pob_choice: depravity
  chosen_korean: 음란함
  alternatives_korean:
  - 패륜
  - 타락
  - 사악함
  lexicon: HALOT
  rationale: זִמָּה의 강한 도덕·성적 문맥을 반영하면서도, 레위기의 경고문답게 지나치게 설명적인 표현보다 압축된 비난어 ‘음란함’을 사용했습니다.
theological_decisions:
- issue: 성적 은유를 한국어에서 얼마나 직접적으로 보존할 것인가
  chosen_reading: ‘음행’과 ‘음란함’으로 비유를 유지해, 공동체와 땅이 성적 부정으로 오염된다는 경고를 그대로 드러냈습니다.
  alternative_readings:
  - 도덕적 타락
  - 부패
  - 부정한 일이 가득 차
  rationale: 본문은 단순한 일반적 악이 아니라 성적 부정의 언어로 거룩의 경계를 경고하므로, 은유를 완화하지 않는 편이 원문의 수사와 신학을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
