id: LEV.19.6
reference: Leviticus 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
  footnotes:
  - marker: a
    text: Or 'and what is left over'; the Hebrew participle refers to the portion remaining after the permitted time for eating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 너희가 제사드린 날과 다음 날에 먹어야 합니다. 그러나 셋째 날까지 남은 것은[a] 불에 태워야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘남아 있는 것’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  english_pob_choice: on the day of your sacrifice
  chosen_korean: “너희가 제사드린 날”
  alternatives_korean:
  - “너희 희생제의 날”
  - “너희 제사의 날”
  lexicon: HALOT
  rationale: בְּיוֹם은 시간 부사로 ‘~하는 날’이 자연스럽고, זִבְחֲכֶם은 제사행위 전체를 가리켜 ‘제사드린’으로 옮기는 것이 문맥에 맞습니다.
- source_word: יֵאָכֵל
  english_pob_choice: it shall be eaten
  chosen_korean: “먹어야 합니다”
  alternatives_korean:
  - “먹을 수 있습니다”
  - “먹게 됩니다”
  lexicon: HALOT
  rationale: 법규 문맥의 수동 명령을 한국어에서는 의무를 나타내는 ‘먹어야 합니다’로 옮기는 것이 가장 분명합니다.
- source_word: וּמִמָּחֳרָת
  english_pob_choice: and on the next day
  chosen_korean: “다음 날”
  alternatives_korean:
  - “이튿날”
  - “그리고 다음 날”
  lexicon: HALOT
  rationale: מָחֳרָת은 다음 날을 뜻하며, 한국어에서는 자연스러운 법문체로 ‘다음 날’이 적절합니다.
- source_word: וְהַנּוֹתָר עַד יוֹם הַשְּׁלִישִׁי
  english_pob_choice: but what remains until the third day
  chosen_korean: “그러나 셋째 날까지 남은 것은”
  alternatives_korean:
  - “그리고 셋째 날까지 남은 것은”
  - “하지만 셋째 날까지 남은 것은”
  lexicon: HALOT
  rationale: הַנּוֹתָר는 ‘남은 것’이며, 앞선 허용 기간 뒤에는 대비가 생기므로 ‘그러나’로 전환을 살렸습니다.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  english_pob_choice: shall be burned in the fire
  chosen_korean: “불에 태워야 합니다”
  alternatives_korean:
  - “불 속에서 태워야 합니다”
  - “불로 태워야 합니다”
  lexicon: HALOT
  rationale: יַשָּׂרֵף는 단순 소멸이 아니라 실제 소각을 뜻하므로, 한국어로도 직접적인 ‘불에 태우다’가 원문의 구체성을 잘 반영합니다.
