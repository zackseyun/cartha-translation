- from: 그리고 제사장은 여호와 앞에서 속건제 숫양으로, 그가 범한 죄로 말미암아 그를 위하여 속죄해야 합니다. 그리하면 그가 범한 죄에 대하여 용서받을 것입니다.[a]
  to: 제사장은 그가 범한 죄에 대하여 야훼 앞에서 속건제[a] 숫양으로 그를 위하여 속죄할 것입니다. 그러면 그는 그가 범한 죄에 대하여 용서받을 것입니다.
  rationale: 법규 문맥의 미래 서술을 ‘속죄할 것입니다’로 바로잡고, 영어 POB의 Yahweh 표기에 맞춰 ‘야훼’를 사용했습니다. 또한 속건제라는 통용 제의 용어는 보존하면서, אָשָׁם의 실제 어휘 대안을 설명하는 각주로 교체했습니다. 원문의 죄 언급과 속죄 후 용서라는 순서는 그대로 유지했습니다.
