  source_fidelity: 첫 동사 וְכִפֶּר는 율법 규정의 미완료형으로, 제사장이 수행할 제의 행위를 서술합니다. 초안의 ‘속죄해야 합니다’는 원문에 없는 의무의 뉘앙스를 더하므로 ‘속죄할 것입니다’가 적절합니다. עָלָיו(그를 위하여), בְּאֵיל הָאָשָׁם(속건제/배상제의 숫양으로), לִפְנֵי יְהוָה(야훼 앞에서), 그리고 용서의 결과를 모두 유지하도록 고쳤습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, 제의 규정 문맥에 맞는 ‘속죄하다’, ‘용서받다’를 사용합니다. ‘그가 범한 죄에 대하여’는 히브리어의 반복되는 죄 언급을 자연스럽게 보존합니다.
  terminology: אָשָׁם의 통용 제의 용어는 ‘속건제’로 유지하되, 각주의 대안은 실제로 구별되는 ‘배상제’로 제시했습니다. 영어 POB의 Yahweh 및 제공된 번역 원칙에 맞추어 신명은 ‘야훼’로 통일했습니다.
