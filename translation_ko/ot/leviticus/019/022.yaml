source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
  footnotes:
  - marker: a
    text: Or 'with the ram of the reparation offering.' The Hebrew אָשָׁם can denote both guilt and the compensatory/reparative aspect of this sacrifice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장은 여호와 앞에서 속건제 숫양으로, 그가 범한 죄로 말미암아 그를 위하여 속죄해야 합니다. 그리하면 그가 범한 죄에 대하여 용서받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속건제의 숫양’으로 번역할 수 있습니다. 히브리어 אָשָׁם은 ‘죄책’과 ‘보상/배상’을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: shall make atonement for him
  chosen_korean: 그를 위하여 속죄해야 합니다
  alternatives_korean:
  - 그를 위하여 속죄할 것입니다
  - 그를 위한 속죄를 해야 합니다
  lexicon: HALOT
  rationale: כפר의 제사장-제의적 기능을 살려 ‘속죄하다’로 옮기고, עָלָיו는 수혜 대상을 드러내는 ‘그를 위하여’로 자연스럽게 처리했습니다.
- source_word: בְּאֵיל הָאָשָׁם
  english_pob_choice: with the ram of the guilt offering
  chosen_korean: 속건제 숫양으로
  alternatives_korean:
  - 속건제의 숫양으로
  - 속죄 보상의 숫양으로
  lexicon: HALOT
  rationale: אֵיל은 ‘숫양’이고, אָשָׁם은 제의 문맥에서 ‘속건제’로 굳어 있으므로 합성어로 압축해 제의적 용법을 분명히 했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞에서
  alternatives_korean:
  - 야훼 앞에서
  - 여호와의 면전에서
  lexicon: HALOT
  rationale: 원문의 공간적·예전적 표현을 그대로 살려 ‘앞에서’로 옮겼고, 본문 전통상 하나님의 이름은 여기서는 여호와로 표기했습니다.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  english_pob_choice: for the sin that he committed
  chosen_korean: 그가 범한 죄에 대하여
  alternatives_korean:
  - 그가 범한 죄 때문에
  - 그가 지은 죄에 대하여
  lexicon: HALOT
  rationale: 분사적 중복 표현을 한국어에서 자연스럽게 풀어, 속죄와 용서의 대상으로서 ‘그가 범한 죄’를 분명히 했습니다.
- source_word: וְנִסְלַח לוֹ
  english_pob_choice: and he shall be forgiven
  chosen_korean: 용서받을 것입니다
  alternatives_korean:
  - 사함을 받을 것입니다
  - 용서될 것입니다
  lexicon: HALOT
  rationale: 니팔형 수동 의미를 살리면서도 한국어에서 가장 자연스러운 종결로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB는 Yahweh를 따르지만, 한국어 본문은 표준 독자 가독성과 기존 출판 관행을 고려해 ‘여호와’를 사용했습니다. 본 절은 신명 직접 인용보다 제의 규정 본문이므로 주석 없이 본문 표기를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md contested term: YHWH'
- issue: 속죄와 용서의 순서
  chosen_reading: 제사장의 속죄 행위가 먼저 나오고, 그 결과 용서가 뒤따르는 구조를 유지했습니다.
  alternative_readings:
  - 용서를 중심으로 재구성
  - 두 절차를 하나로 압축
  rationale: 히브리어는 제사장의 속죄 행위와 그 결과로서의 용서를 분명히 구분하므로, 제의적-법적 인과를 흐리지 않도록 순서를 보존했습니다.
  doctrine_reference: Leviticus priestly sacrificial framework
