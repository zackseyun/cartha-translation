revisions:
- from: 너희와 함께 거류하는 나그네는 너희 중의 본국 사람과 같을 것이요 너는 그를 네 자신과 같이 사랑하라 이는 너희가 애굽 땅에서 나그네였음이라 나야 너희 하나님 야훼니라
  to: 너희와 함께 사는 거류민[a]을 너희 가운데 있는 본토 사람처럼 여기고, 너희 각자는 그를 자신처럼 사랑해야 합니다. 너희도 이집트 땅에서 거류민이었기 때문입니다. 나는 너희 하나님 야훼입니다.
  rationale: ‘거류민’으로 גֵּר의 정주하는 비토착민이라는 법적·사회적 뉘앙스를 보존하고, ‘함께 사는’으로 הַגָּר אִתְּכֶם의 거주 의미와 어근 반복을 가능한 범위에서 반영했습니다. ‘본토 사람처럼 여기고’는 כְּאֶזְרָח מִכֶּם יִהְיֶה לָכֶם의 처우상 비교를 자연스럽게 옮깁니다. ‘너희 각자’는 히브리어의 단수 명령 대상이 집단 이스라엘에게 분배적으로 적용되는 점을 현대 한국어에서 드러냅니다.
  reviewer_model: gpt-5.6-terra
