  language: ko
  text: 너희와 함께 사는 거류민[a]을 너희 가운데 있는 본토 사람처럼 여기고, 너희 각자는 그를 자신처럼 사랑해야 합니다. 너희도 이집트 땅에서 거류민이었기 때문입니다. 나는 너희 하나님 야훼입니다.
  philosophy: optimal-equivalence
