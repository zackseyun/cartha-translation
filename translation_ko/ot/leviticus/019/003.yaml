id: LEV.19.3
reference: Leviticus 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'Each person'; Hebrew 'each man' uses a masculine singular form distributively for the community.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall revere.' The Hebrew verb can denote fear in the sense of reverence or awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 어머니와 아버지를 두려워해야 하며[a], 내 안식일들을 지켜야 합니다[b]. 나는 너희 하나님 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람은’; 히브리어의 ‘각 사람’은 공동체 전체를 가리키는 분배적 남성 단수입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경외해야’; 히브리어 동사는 두려움과 경외를 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: Each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 모든 사람
  lexicon: HALOT
  rationale: 히브리어의 단수 남성형이 공동체 전체를 향한 분배적 명령으로 쓰였으므로 의미는 넓게 살리되, 한국어에서는 성별을 불필요하게 굳히지 않고 자연스러운 합쇼체로 옮겼습니다.
- source_word: אִמּוֹ וְאָבִיו
  english_pob_choice: his mother and his father
  chosen_korean: 어머니와 아버지를
  alternatives_korean:
  - 그의 어머니와 그의 아버지를
  - 부모를
  lexicon: HALOT
  rationale: 본문은 어머니를 먼저, 그다음 아버지를 분명히 나열하므로 순서를 유지했고, ‘부모’를 쓰면 두 친족 호칭의 개별성과 배열이 약해집니다.
- source_word: תִּירָאוּ
  english_pob_choice: shall fear
  chosen_korean: 두려워해야 하며
  alternatives_korean:
  - 경외해야 하며
  - 존경해야 하며
  lexicon: HALOT
  rationale: 이 동사는 단순한 감정이 아니라 경외를 포함할 수 있는 ‘두려움’을 가리키므로, 본문의 강도를 살리는 직접적인 표현을 택했습니다. 다만 한국어에서는 문맥상 공포만이 아니라 경외를 포함하는 뜻으로 읽혀야 합니다.
- source_word: שַׁבְּתֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들을
  alternatives_korean:
  - 내 안식일
  - 내 안식일들
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 복수로 옮겼고, 소유격 ‘내’를 살려 안식일이 야훼께 속한 거룩한 때임을 드러냈습니다.
- source_word: תִּשְׁמֹרוּ
  english_pob_choice: you shall keep
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 준수해야 합니다
  - 지켜야 하며
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/준수하다/보호하다’의 범위를 가지며, 안식일과는 한국어의 ‘지키다’가 가장 자연스럽고 언약적 책임을 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 신학적 관례에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용해, 본문이 드러내는 고유한 신명을 보존했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 너희 하나님
  alternatives_korean:
  - 너희의 하나님
  - 당신들의 하나님
  lexicon: HALOT
  rationale: 언약 공식에서 복수 소유는 자연스럽게 ‘너희 하나님’으로 옮기되, 신학적 의미상 이스라엘의 하나님이라는 점을 분명히 했습니다.
theological_decisions:
- issue: ‘두려워하다’의 정서 강도와 경외 의미
  chosen_reading: 두려워해야 합니다
  alternative_readings:
  - 경외해야 합니다
  - 존경해야 합니다
  rationale: 히브리어 ירא는 단순한 공포보다 더 넓게 경외를 포함하지만, 본문이 요구하는 윤리적 긴장과 언약적 무게를 약화시키지 않기 위해 ‘두려워하다’를 유지했습니다. 한국어 독자는 이 표현을 문맥상 경외를 포함한 뜻으로 이해해야 합니다.
  doctrine_reference: Translation philosophy §§1, 4, 5
- issue: 신명기적/레위기적 언약 공식의 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 자기 선언 ‘나는 …’와 결합된 야훼를 직접 제시하므로, 제목어 ‘주’로 바꾸지 않고 고유명을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
