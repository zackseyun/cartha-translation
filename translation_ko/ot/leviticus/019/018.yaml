id: LEV.19.18
reference: Leviticus 19:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'against your own people.' Literally, 'against the sons of your people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 자기 백성의 자손에게 복수하지도 말고 원한을 품지도 마십시오. 오히려 이웃을 자신과 같이 사랑해야 합니다. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 자기 백성을 향해.’ 문자적으로는 ‘당신의 백성의 자손에게.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִקֹּם
  english_pob_choice: take vengeance
  chosen_korean: 복수하지도 마십시오
  alternatives_korean:
  - 원수를 갚지도 마십시오
  - 앙갚음하지도 마십시오
  lexicon: HALOT
  rationale: נקם의 적극적 보복 금지를 한국어의 자연스러운 법·윤리 문맥에 맞게 ‘복수하다’로 옮겼습니다.
- source_word: וְלֹא תִטֹּר
  english_pob_choice: bear a grudge
  chosen_korean: 원한을 품지도 마십시오
  alternatives_korean:
  - 앙심을 품지도 마십시오
  - 미움을 간직하지도 마십시오
  lexicon: HALOT
  rationale: נטר의 지속적으로 간직하는 분노·원한의 의미를 ‘원한을 품다’로 간결하고 분명하게 살렸습니다.
- source_word: בְּנֵי עַמֶּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 자기 백성의 자손에게
  alternatives_korean:
  - 당신의 백성의 아들들에게
  - 당신의 동족에게
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 ‘백성의 자손’을 살리되, 한국어에서는 자연스럽게 목적어로 풀어 읽히도록 처리했습니다.
- source_word: לְרֵעֲךָ
  english_pob_choice: your neighbor
  chosen_korean: 이웃을
  alternatives_korean:
  - 동료를
  - 친구를
  lexicon: HALOT
  rationale: רֵעַ는 이 법문맥에서 공동체의 타인을 가리키므로, 관용적이고 성경적 함의가 유지되는 ‘이웃’이 가장 적절합니다.
theological_decisions:
- issue: 공동체 범위와 사랑의 명령
  chosen_reading: 첫 절반은 ‘자기 백성의 자손’에 대한 보복·원한 금지로 유지하고, 뒤의 רֵעַ는 ‘이웃’으로 옮겨 두 표현의 구분을 살렸습니다.
  alternative_readings:
  - 두 표현을 모두 포괄적으로 ‘남’이나 ‘사람들’로 평준화함
  rationale: 본문은 혈연·공동체 범주와 일반적 대인 관계 범주를 구분하므로, 그 긴장을 지우지 않고 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 יְהוָה는 신적 칭호로 대체하지 않고 고유명사로 옮겼습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
