  - severity: medium
    issue: ‘자기 백성의 자손’의 의미 및 자연스러움
    rationale: בְּנֵי עַמֶּךָ는 문자적으로 ‘당신 백성의 아들들’입니다. 한국어 ‘자손’은 흔히 후대의 후손을 뜻하므로 공동체 구성원을 가리키는 본문 의미를 흐릴 수 있습니다.
  - severity: medium
    issue: 각주의 비문 및 방향 표현
    rationale: ‘당신의 자기 백성’은 비문이며, 원문의 목적어 구문은 보복과 원한 행위의 대상이므로 대안은 ‘당신 백성에게’로 제시하는 편이 정확하고 자연스럽습니다.
