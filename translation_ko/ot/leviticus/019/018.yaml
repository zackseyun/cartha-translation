revisions:
- from: 당신들은 자기 백성의 자손에게 복수하지도 말고 원한을 품지도 마십시오. 오히려 이웃을 자신과 같이 사랑해야 합니다. 나는 야훼입니다.[a]
  to: 당신은 당신 백성의 아들들에게 복수하지도 말고 원한을 품지도 마십시오. 당신의 이웃을 자신처럼 사랑하십시오. 나는 야훼입니다.[a]
  rationale: 원문의 단수 수신자, ‘당신 백성의 아들들’이라는 문자적 공동체 표현, 보복과 원한 보유의 병렬 금지, 그리고 뒤따르는 사랑의 명령을 모두 보존했습니다. 해석적으로 범위를 확대하거나 제한하지 않았으며, 야훼라는 고유명사 표기도 유지했습니다.
