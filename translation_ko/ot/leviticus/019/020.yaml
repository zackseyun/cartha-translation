  to: 어떤 남자가 여자와 동침하여 정액을 쏟았는데, 그 여자가 한 남자에게 정해진 여자 노예로서 아직 속량되지도 자유를 부여받지도 못하였다면, 조사가 있어야 합니다.[a] 그러나 그들은 사형에 처해지지 않을 것입니다.[b] 그 여자가 아직 자유롭게 되지 못하였기 때문입니다.
