  source_fidelity: 초안은 여종이 아직 속량되거나 해방되지 않았다는 법적 조건과 사형을 면한다는 결론을 대체로 반영합니다. 그러나 אִישׁ의 남성 단수 주어를 ‘누구든지’로 일반화했고, ‘정을 쏟다’는 현대 한국어에서 정액의 배출을 명확히 전달하지 못합니다. 또한 בִּקֹּרֶת의 불확정적 의미를 ‘벌’로 단정했으며, ‘죽임을 당하지’의 복수 주어도 불분명합니다.
  naturalness: 초안의 ‘속전되지도 아니하고’, ‘아니하였으면’, ‘아니하리니’는 목표로 한 현대 표준어 합쇼체보다 문어적·고어적입니다. ‘남에게 정해져서’도 관계의 상대가 남성임을 충분히 드러내지 못합니다. 아래 문안은 법률적 의미를 유지하면서 현대적인 합쇼체로 다듬었습니다.
  terminology: שִׁפְחָה는 종속 신분이 중요한 문맥이므로 ‘여자 노예’로 명시했습니다. נֶחֱרֶפֶת לְאִישׁ는 완전한 혼인·정혼으로 단정하지 않고 ‘한 남자에게 정해진’으로 옮겼습니다. 희귀어 בִּקֹּרֶת는 ‘조사’로 옮기되, 처벌 또는 배상이라는 대안은 각주에 보존했습니다.
