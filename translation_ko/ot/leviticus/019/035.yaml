lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  english_pob_choice: You shall not commit
  chosen_korean: 행해서는 안 됩니다
  alternatives_korean:
  - 하지 마십시오
  - 저지르지 말아야 합니다
  lexicon: HALOT
  rationale: עשה의 일반적 ‘하다/행하다’ 의미를 살리면서, 법률적 금지문에 맞는 자연스러운 현대 한국어 금지 표현으로 옮겼습니다.
- source_word: עָוֶל
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 불공정
  - 억울함
  lexicon: HALOT
  rationale: עָוֶל은 법정·상거래 문맥에서 ‘그른 일, 불의, 부정함’을 뜻하므로, 단순한 감정적 ‘부당함’보다 규범적 무게가 있는 ‘불의’가 적절합니다.
- source_word: בַּמִּדָּה
  english_pob_choice: in measures of length
  chosen_korean: 길이의 도량
  alternatives_korean:
  - 길이의 측량
  - 길이의 측정
  - 길이의 재다
  lexicon: HALOT
  rationale: מִדָּה는 일반적인 ‘측량/도량’의 개념이므로, 뒤의 무게·부피와 평행을 이루도록 ‘길이의 도량’으로 두어 상거래 기준의 범주를 드러냈습니다.
- source_word: וּבַמְּשׂוּרָה
  english_pob_choice: or volume
  chosen_korean: 부피
  alternatives_korean:
  - 용량
  - 분량
  - 부피의 도량
  lexicon: HALOT
  rationale: מְשׂוּרָה는 계량된 양, 특히 용적·용량의 기준을 가리키므로 현대 한국어에서 가장 이해가 쉬운 ‘부피’로 옮겼습니다.
theological_decisions:
- issue: 재산·상거래 정직 규례의 범위를 어떻게 드러낼지
  chosen_reading: ‘판결’과 계량 기준들을 병렬로 제시해, משפט이 단순한 추상적 정의가 아니라 공적 판단과 실제 거래 공정성을 함께 포괄함을 드러냈습니다.
  alternative_readings:
  - ‘재판’
  - ‘공정한 판정’
  - ‘의로움’
  rationale: 이 절은 법정뿐 아니라 길이·무게·부피의 상거래 부정을 금하므로, משפט을 너무 좁게 ‘재판’으로만 두면 뒤의 구체 항목과의 연결이 약해집니다.
  doctrine_reference: 거룩한 생활과 이웃 사랑을 위한 토라의 공정성 규례
