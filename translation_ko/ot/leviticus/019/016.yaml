  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, 'You shall not stand by while your neighbor's blood is shed.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 백성 가운데서 중상을 퍼뜨리며 돌아다니지 마십시오. 당신의 이웃의 피를 흘리는 일에 나서지 마십시오. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신의 이웃의 피가 흘려지는 동안 가만히 서 있지 마십시오.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תֵלֵךְ רָכִיל
  english_pob_choice: You shall not go about as a slanderer
  chosen_korean: “중상하는 자처럼 돌아다니지 마십시오”
  alternatives_korean:
  - “험담하는 자처럼 돌아다니지 마십시오”
  - “남의 말을 퍼뜨리며 돌아다니지 마십시오”
  lexicon: HALOT
  rationale: רָכִיל은 단순한 잡담이 아니라 공동체 안에서 해를 끼치는 비방·중상의 전파를 가리키므로, ‘중상하는 자’로 옮겨 그 윤리적 무게를 살렸습니다.
- source_word: בְּעַמֶּיךָ
  english_pob_choice: among your people
  chosen_korean: “당신의 백성 가운데서”
  alternatives_korean:
  - “당신의 사람들 가운데서”
  - “당신의 공동체 안에서”
  lexicon: HALOT
  rationale: בְּ + ‘your people’는 공동체 내부의 관계를 가리키므로, 자연스럽고 문맥에 맞는 ‘백성 가운데서’로 옮겼습니다.
- source_word: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  english_pob_choice: You shall not stand against the blood of your neighbor
  chosen_korean: “당신의 이웃의 피 위에 서 있지 마십시오”
  alternatives_korean:
  - “당신의 이웃의 피에 맞서 서 있지 마십시오”
  - “당신의 이웃의 피가 흘려지는 동안 가만히 서 있지 마십시오”
  lexicon: HALOT
  rationale: עַל + ‘피’는 본문상 난해한 표현이므로, POB처럼 ‘stand’와 ‘blood’의 이미지를 보존하는 방향으로 직역해 해석의 여지를 남겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: “야훼”
  alternatives_korean:
  - “여호와”
  - “주”
  lexicon: HALOT
  rationale: יהוה는 관용적 대체어가 아니라 고유한 신명으로 보아, 본문과 POB 방침에 따라 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ의 의미 범위
  chosen_reading: 주요 본문은 ‘이웃의 피 위에 서 있지 마십시오’로 살려 두어, 해를 끼치는 행위와 살해에 대한 공모/방조의 가능성을 함께 남깁니다.
  alternative_readings:
  - “이웃의 피가 흘려지는 동안 가만히 서 있지 마십시오”
  - “이웃의 피를 흘리도록 맞서지 마십시오”
  rationale: 히브리어는 간결하고 해석 가능성이 여러 가지이므로, 해석을 하나로 고정하기보다 문자적 이미지를 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
