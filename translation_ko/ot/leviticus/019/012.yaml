base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'You shall not swear by my name for falsehood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 이름으로 거짓되이[a] 맹세해서는 안 되며, 그렇게 하여 너희 하나님의 이름을 더럽혀서도 안 됩니다. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 이름으로 거짓을 위하여 맹세해서는 안 됩니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  english_pob_choice: you shall not swear
  chosen_korean: 거짓 맹세를 해서는 안 되며
  alternatives_korean:
  - 맹세해서는 안 되며
  - 서약해서는 안 되며
  lexicon: HALOT
  rationale: 히브리어 נִפעל שׁבע는 법적·윤리적 문맥에서 ‘맹세하다’의 뜻이므로, 한국어에서는 관용적이면서도 금지의 힘을 살린 ‘거짓 맹세를 하다’로 옮겼습니다.
- source_word: בִשְׁמִי
  english_pob_choice: by my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름에 의해
  - 내 이름 안에서
  lexicon: HALOT
  rationale: 맹세의 매개를 나타내는 ב + ‘이름’은 한국어에서 ‘~이름으로’가 가장 자연스럽고, 신적 이름을 호출하는 맹세의 성격도 잘 드러냅니다.
- source_word: וְחִלַּלְתָּ אֶת שֵׁם אֱלֹהֶיךָ
  english_pob_choice: and so profane the name of your God
  chosen_korean: 너희 하나님의 이름을 더럽혀서도 안 됩니다
  alternatives_korean:
  - 너희 하나님의 이름을 욕되게 해서도 안 됩니다
  - 너희 하나님의 이름을 속되게 해서도 안 됩니다
  lexicon: HALOT
  rationale: חלל은 ‘더럽히다/속되게 하다/욕되게 하다’의 의미가 있으므로, 하나님의 이름에 대한 언약적 모독을 직접적으로 드러내는 ‘더럽히다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 관례적 대체어가 아니라 음역 ‘야훼’로 옮겨, 본문이 드러내는 언약적 이름을 보존했습니다.
theological_decisions:
- issue: 거짓 맹세와 하나님의 이름을 더럽히는 관계
  chosen_reading: 앞절의 금지를 단순 병렬이 아니라 결과적 연결로 읽어, 거짓 맹세가 곧 하나님의 이름을 더럽히는 행위임을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그리고’로 연결하는 읽기
  - 두 금지를 별개의 항목으로 분리하는 읽기
  rationale: 히브리어 접속과 문맥상, 맹세의 거짓됨이 곧 하나님의 이름의 모독으로 이어진다는 윤리·신학적 관계가 분명하므로 이를 한국어에서도 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without unnecessary paraphrase'
