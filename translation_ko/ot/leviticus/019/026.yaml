id: LEV.19.26
reference: Leviticus 19:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
  footnotes:
  - marker: a
    text: Or 'with the blood'; the Hebrew expression is difficult and may refer to eating meat with blood in it or to participating in a blood-related ritual meal.
    reason: alternative_reading
  - marker: b
    text: Or 'practice soothsaying' or, more traditionally, 'observe times.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 피 위에서 먹지 말며, 점치거나 징조를 해석하지 말아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피와 함께’. 히브리어 표현이 어렵고, 고기에 피가 남은 채 먹는 행위나 피와 관련된 제의적 식사를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘점술을 행하다’ 혹은 전통적으로 ‘시기를 살피다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  english_pob_choice: You shall not eat
  chosen_korean: 먹지 말며
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 먹지 말아야 합니다
  lexicon: HALOT
  rationale: 법률 금지문이므로 현대적 합쇼체의 금지 표현으로 옮기되, 명령의 강도를 유지했습니다.
- source_word: עַל הַדָּם
  english_pob_choice: over the blood
  chosen_korean: 피 위에서
  alternatives_korean:
  - 피와 함께
  - 피를 두고
  - 피가 있는 채로
  lexicon: HALOT
  rationale: 히브리어 전치사 עַל의 투명성을 살려 직역에 가깝게 옮기고, 본문의 해석상 난점을 한국어 본문에서도 유지했습니다.
- source_word: תְנַחֲשׁוּ
  english_pob_choice: practice divination
  chosen_korean: 점치다
  alternatives_korean:
  - 예언을 하다
  - 복술을 행하다
  lexicon: HALOT
  rationale: נחשׁ의 점술적 행위를 현대 한국어로 분명하게 드러내는 표현을 택했습니다.
- source_word: תְעוֹנֵנוּ
  english_pob_choice: interpret omens
  chosen_korean: 징조를 해석하다
  alternatives_korean:
  - 점을 보다
  - 길흉을 살피다
  - 시기를 점치다
  lexicon: HALOT
  rationale: 전통적인 ‘시기를 살피다’보다 현대 독자가 이해하기 쉬운 표현으로, 징조 읽기라는 의미를 살렸습니다.
theological_decisions:
- issue: עַל הַדָּם의 정확한 금지 대상
  chosen_reading: 본문에서는 ‘피 위에서’로 남겨, 고기와 피의 관계인지 피와 관련한 제의적 식사인지 확정하지 않았습니다.
  alternative_readings:
  - 피와 함께
  - 피가 있는 채로
  - 피와 관련된 제의적 식사에서
  rationale: 히브리어 표현이 난해하므로, 번역이 해석을 과도하게 확정하지 않도록 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, 난해한 본문은 해석을 본문에 과도하게 주입하지 않음
