    reason: cultural_note
  - marker: c
    text: 힌은 고대의 액량 단위입니다.
    reason: cultural_note
  revision_rationale: The revision preserves the repeated commercial-ethical force of צֶדֶק and the transliterated ancient units, while correcting the final clause so that Yahweh—not ‘a person’—is identified as the one who brought Israel out of Egypt. It also relocates each cultural-note anchor to the measure it explains and improves the naturalness of the command.
