id: LEV.19.36
reference: Leviticus 19:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'just scales, just weights'; the repeated Hebrew word is צֶדֶק, often 'righteousness' or 'justice,' here applied to commercial measures.
    reason: lexical_alternative
  - marker: b
    text: An ephah was an ancient dry measure.
    reason: cultural_note
  - marker: c
    text: A hin was an ancient liquid measure.
    reason: cultural_note
translation:
  language: ko
  text: 너희는 정직한 저울[a]과 정직한 추와 정직한 에바[b]와 정직한 힌[c]을 갖추어야 합니다. 나는 너희의 하나님 야훼, 곧 너희를 이집트 땅에서 이끌어 낸 이입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공정한 저울, 공정한 추’; 히브리어의 반복어 צֶדֶק은 여기서 상거래의 ‘의로움/정의로움’을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 에바는 고대의 건량 단위입니다.
    reason: cultural_note
  - marker: c
    text: 힌은 고대의 액량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  english_pob_choice: honest scales
  chosen_korean: 정직한 저울
  alternatives_korean:
  - 공정한 저울
  - 올바른 저울
  - 의로운 저울
  lexicon: HALOT
  rationale: מֹאזְנַיִם은 상거래에 쓰는 저울이고, צֶדֶק은 여기서 거래의 정직성을 뜻하므로 한국어에서는 자연스럽고 직설적인 ‘정직한 저울’이 원문의 윤리적 요구를 잘 드러냅니다.
- source_word: אַבְנֵי צֶדֶק
  english_pob_choice: honest weights
  chosen_korean: 정직한 추
  alternatives_korean:
  - 공정한 추
  - 올바른 추
  - 정직한 돌추
  lexicon: HALOT
  rationale: אַבְנֵי는 문자적으로 ‘돌들’이지만 상거래의 도량형 추를 가리키므로 의미를 드러내어 ‘추’로 옮겼습니다. 반복되는 צֶדֶק의 상거래적 윤리를 살려 ‘정직한’을 유지했습니다.
- source_word: אֵיפַת צֶדֶק / וְהִין צֶדֶק
  english_pob_choice: an honest ephah / an honest hin
  chosen_korean: 정직한 에바, 정직한 힌
  alternatives_korean:
  - 공정한 에바, 공정한 힌
  - 정확한 에바, 정확한 힌
  - 정직한 에바 단위, 정직한 액량 단위
  lexicon: HALOT
  rationale: 에바와 힌은 고대의 건량·액량 단위이므로 음역을 유지해 본문의 문화적 구체성을 보존했습니다. 각 단위에 같은 형용사를 붙여 반복 구조도 살렸습니다.
- source_word: יִהְיֶה לָכֶם
  english_pob_choice: You shall have
  chosen_korean: 너희에게 두어야 합니다
  alternatives_korean:
  - 너희가 가져야 합니다
  - 너희에게 있어야 합니다
  - 너희는 가져야 합니다
  lexicon: HALOT
  rationale: 직역하면 ‘너희에게 있어야 한다’이지만, 규범적 지시문에서는 도량형을 ‘두다’가 자연스럽고, 소유·비치의 요구를 함께 드러냅니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희 하나님 야훼
  - 주 너희 하나님
  - 여호와 너희 하나님
  lexicon: HALOT
  rationale: 테트라그라마톤은 이 번역 기준에 따라 ‘야훼’로 옮기고, אֱלֹהֵיכֶם은 언약식 표현으로 ‘너희의 하나님’으로 렌더링했습니다. 전통적 ‘여호와’는 사용하지 않았습니다.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: who brought you out of the land of Egypt
  chosen_korean: 내가 너희를 이집트 땅에서 이끌어 낸 사람입니다
  alternatives_korean:
  - 내가 너희를 이집트 땅에서 이끌어 냈습니다
  - 내가 너희를 이집트 땅에서 나오게 한 사람입니다
  - 내가 너희를 이집트 땅에서 인도해 낸 사람입니다
  lexicon: HALOT
  rationale: 출애굽 공식을 한국어에서 자연스럽게 살리기 위해 ‘이끌어 낸’으로 옮겼습니다. ‘사람’은 히브리어 관계절의 서술을 받는 한국어 표현으로, 1인칭 자기계시의 문맥을 유지합니다.
theological_decisions:
- issue: צֶדֶק의 반복을 어떻게 한국어 윤리 어휘로 살릴지
  chosen_reading: 정직한
  alternative_readings:
  - 공정한
  - 의로운
  - 정확한
  rationale: 이 구절은 법정적 의(의로움)보다 상거래에서의 성실성과 조작 없는 측정을 강조하므로, 한국어에서는 ‘정직한’이 가장 직접적으로 화답합니다.
  doctrine_reference: Translation philosophy §§5–6
- issue: יהוה의 표기와 전통 교회어의 선택
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 고유명을 직접 제시하므로, 제목어 ‘주님’으로 대체하지 않고 고유명 ‘야훼’를 유지했습니다. 이는 언약적 자기계시의 직접성을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 6
