base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
  footnotes:
  - marker: a
    text: Or 'his reparation offering.' The Hebrew term אָשָׁם can refer both to guilt and to the offering made in reparation for it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 속건제[a], 곧 속건제물인 숫양 한 마리를 야훼께, 회막의 입구로 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 보상제물’. 히브리어 אָשָׁם은 죄책과 그 죄에 대한 배상으로 드리는 제물을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  english_pob_choice: And he shall bring
  chosen_korean: 그는 가져와야 합니다
  alternatives_korean:
  - 그는 가져올 것입니다
  - 그는 바쳐야 합니다
  lexicon: HALOT
  rationale: 법률 문맥의 의무적 용법을 살려 미래 서술보다 규정적 표현으로 옮겼습니다.
- source_word: אֲשָׁמוֹ
  english_pob_choice: his guilt offering
  chosen_korean: 자기의 속건제
  alternatives_korean:
  - 자기의 죄책제
  - 자기의 보상제
  lexicon: HALOT
  rationale: 제의 문맥에서 אָשָׁם은 단순한 내적 죄책보다 제물 자체를 가리키므로, 기존 성서어휘와도 맞는 속건제를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본 사업의 기본값인 야훼를 따랐고, 제물의 헌납 방향을 나타내는 여격을 -께로 살렸습니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: to the entrance of the tent of meeting
  chosen_korean: 회막의 입구로
  alternatives_korean:
  - 회막의 문간으로
  - 회막 앞문으로
  lexicon: HALOT
  rationale: אֶל פֶּתַח은 도착 지점을 나타내므로 '입구로'가 자연스럽고, אֹהֶל מוֹעֵד는 관용적 명칭인 회막으로 옮겼습니다.
- source_word: אֵיל
  english_pob_choice: a ram
  chosen_korean: 숫양 한 마리를
  alternatives_korean:
  - 숫양을
  - 수양 한 마리를
  lexicon: HALOT
  rationale: 아일은 희생 제물의 표준 동물명인 숫양이며, 문맥상 단수 부정관사를 반영해 한 마리를 보탰습니다.
- source_word: אָשָׁם
  english_pob_choice: as a guilt offering
  chosen_korean: 속건제로
  alternatives_korean:
  - 죄책제로
  - 보상제로
  lexicon: HALOT
  rationale: 마지막의 אָשָׁם은 제물의 기능을 재진술하는 용법이므로, 서술적 '속건제로'가 가장 간결하고 정확합니다.
