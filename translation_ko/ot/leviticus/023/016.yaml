  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'until the day after the seventh week.' The Hebrew reads 'the day after the seventh Sabbath,' and interpreters differ on how the festival count is expressed in calendrical terms.
    reason: alternative_reading
translation:
  language: ko
  text: 여러분은 일곱째 안식일 다음 날까지 오십 일을 셀 것입니다[a]. 그러고 나서 야훼께 새로운 곡식 제물을 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱째 주간 다음 날까지’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘일곱째 안식일 다음 날’이라고 하며, 절기 계산을 어떻게 달력적으로 이해할지는 해석자들 사이에 차이가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  english_pob_choice: up to
  chosen_korean: 까지
  alternatives_korean:
  - ~에 이르기까지
  - ~까지
  lexicon: HALOT
  rationale: 카운트의 종료 한계를 나타내는 말로, 현대 한국어에서는 ‘까지’가 가장 자연스럽고 정확합니다.
- source_word: מִמָּחֳרַת הַשַּׁבָּת הַשְּׁבִיעִת
  english_pob_choice: the day after the seventh Sabbath
  chosen_korean: 일곱째 안식일 다음 날
  alternatives_korean:
  - 일곱째 주간 다음 날
  - 일곱째 주의 다음 날
  lexicon: HALOT
  rationale: 히브리어는 ‘안식일’을 직접 쓰므로 이를 보존하되, 한국어에서는 ‘다음 날’로 풀어 자연스럽게 옮겼습니다.
- source_word: חֲמִשִּׁים יוֹם
  english_pob_choice: fifty days
  chosen_korean: 오십 일
  alternatives_korean:
  - 쉰 날
  - 50일
  lexicon: HALOT
  rationale: 수사구를 표준적인 한국어 법령체로 옮겨 ‘오십 일’로 표현했습니다.
- source_word: מִנְחָה חֲדָשָׁה
  english_pob_choice: a new grain offering
  chosen_korean: 새로운 곡식 제물
  alternatives_korean:
  - 새 곡식 제물
  - 새로운 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 ‘곡식 제물’로 옮기는 것이 구체적이며, חֲדָשָׁה는 ‘새로운’으로 직역해 새로운 수확물의 뉘앙스를 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮기고, 제물 헌납의 방향을 나타내는 ל는 ‘~께’로 처리했습니다.
theological_decisions:
- issue: 히브리어 שַׁבָּת을 ‘안식일’로 유지할지 ‘주간/주’로 풀지 여부
  chosen_reading: ‘안식일’로 유지하되 한국어에서는 ‘일곱째 안식일 다음 날’로 자연스럽게 표현했습니다.
  alternative_readings:
  - 일곱째 주간 다음 날
  - 일곱 번째 주의 다음 날
  rationale: 본문은 ‘주’가 아니라 ‘안식일’을 직접 사용하므로, 축제 계산의 해석을 앞서 결정하지 않도록 원문 표현을 보존했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
