source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
  footnotes:
  - marker: a
    text: Or, 'I will cut off that person from among his people.' The Hebrew verb here is 'destroy/cause to perish,' not the usual verb for 'cut off,' though the sense of removal in judgment is closely related.
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 사람이라도 이 날에 어떤 일도 하면, 내가 그 사람을 그의 백성 가운데서 멸망시킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 사람을 그의 백성 가운데서 끊어버릴 것입니다.’ 여기의 히브리어 동사는 흔한 ‘끊다’가 아니라 ‘멸망시키다/멸망하게 하다’입니다. 다만 심판으로 인한 제거라는 뜻은 서로 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 영혼
  - 생명
  lexicon: HALOT
  rationale: 법률·언약 문맥에서 נֶפֶשׁ는 영혼보다 개인을 가리키는 말이므로, 한국어에서도 자연스럽고 문맥에 맞는 ‘사람’으로 옮겼습니다.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  english_pob_choice: does any work
  chosen_korean: 어떤 일도 하면
  alternatives_korean:
  - 어떤 노동도 하면
  - 어떤 일을 하면
  lexicon: HALOT
  rationale: מְלָאכָה의 금지된 ‘일/노동’ 의미를 살리되, 현대 한국어에서는 ‘어떤 일도 하면’이 가장 자연스럽고 포괄적입니다.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: on this very day
  chosen_korean: 이 날에
  alternatives_korean:
  - 이 바로 그날에
  - 바로 이날에
  lexicon: HALOT
  rationale: 히브리어 관용구의 강조를 살리기 위해 문장 전체의 시점을 앞에 두었고, ‘very’의 강조는 ‘어떤 일도’와 판결문의 강한 어조로 함께 드러나게 했습니다.
- source_word: וְהַאֲבַדְתִּי
  english_pob_choice: I will destroy
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 끊어버릴 것입니다
  - 멸할 것입니다
  lexicon: HALOT
  rationale: 본문 동사는 כרת가 아니라 אבד의 사역형이므로, 기술적 ‘끊어버리다’보다 ‘멸망시키다/멸하다’가 원문 동사의 힘을 더 직접적으로 반영합니다.
theological_decisions:
- issue: 형벌 표현 וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ의 번역
  chosen_reading: 하나님이 그 사람을 공동체에서 제거하시는 심판을 ‘멸망시킬 것입니다’로 직역성 있게 유지했습니다.
  alternative_readings:
  - 그 사람을 끊어버릴 것입니다
  - 그 사람을 그의 백성 가운데서 끊어버릴 것입니다
  rationale: 히브리어는 관용적 추방/단절 개념과 연결될 수 있지만, 본문에 실제로 나온 동사는 ‘멸망하게 하다’이므로 기술어를 앞세우기보다 원문의 직접 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
