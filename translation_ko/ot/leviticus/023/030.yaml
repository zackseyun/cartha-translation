- from: 어떤 사람이라도 이 날에 어떤 일도 하면, 내가 그 사람을 그의 백성 가운데서 멸망시킬 것입니다.[a]
  to: 어떤 사람이라도 바로 이날에 어떤 일이라도 하면, 내가 그 사람을 자기 백성 가운데서 멸망시킬 것입니다.[a]
  rationale: ‘바로 이날에’를 추가하여 히브리어 시간 표현의 강조를 보존했습니다. ‘자기 백성’은 한국어에서 자연스럽게 지시 관계를 나타내며, נֶפֶשׁ의 문법상 여성 접미사를 불필요하게 성별화하지 않습니다. 각주는 אבד와 כרת의 어휘상 차이를 명확히 하되, 공동체적 제거라는 문맥적 대안도 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:26Z'
