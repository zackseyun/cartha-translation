  source_fidelity: 히브리어 נֶפֶשׁ를 ‘사람’으로, כָּל מְלָאכָה를 포괄적인 ‘어떤 일’로, אבד 사역형을 ‘멸망시키다’로 옮긴 것은 본문의 법률적·심판적 문맥을 대체로 충실히 반영합니다. 그러나 בְּעֶצֶם הַיּוֹם הַזֶּה의 강조(‘바로 이날/이 바로 그날’)가 현 번역의 ‘이 날에’에서는 충분히 드러나지 않습니다.
  naturalness: ‘어떤 사람이라도 … 하면’과 ‘멸망시킬 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 소유 표현은 성별을 특정하는 ‘그의 백성’보다, 원문의 문법 성을 기계적으로 재현하지 않으면서 지시 관계를 보이는 ‘자기 백성’이 한국어에서 더 자연스럽습니다.
