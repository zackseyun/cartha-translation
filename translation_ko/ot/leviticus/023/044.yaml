translation:
  language: ko
  text: 이렇게 모세는 야훼의 정해진 때들을 이스라엘 자손에게 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역적 표현입니다. 전통적으로는 ‘이스라엘 자손들’ 또는 ‘이스라엘 백성’으로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: declared
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 말했습니다
  - 선포했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 이 절은 절기 규례를 마무리하는 요약 진술이므로, 단순 발화보다 ‘알리다’가 모세가 이 정해진 때들을 백성에게 공적으로 전달한 뜻을 자연스럽게 살립니다.
- source_word: מֹעֲדֵי
  english_pob_choice: appointed times
  chosen_korean: 정해진 때들
  alternatives_korean:
  - 지정된 절기들
  - 정한 때들
  - 절기들
  lexicon: HALOT
  rationale: 레위기 23장의 מוֹעֵד는 절기만이 아니라 안식일까지 포괄하는 달력적·예배적 ‘정해진 때’를 가리키므로, 범위를 좁히지 않는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명문을 대체 호칭으로 풀지 않고, 프로젝트 기본값에 따라 고유 이름 ‘야훼’를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 살리면서도 한국어에서 가장 자연스럽고 성경적으로 안정된 대응인 ‘이스라엘 자손’을 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 본문의 하나님의 이름 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 공동체 관용어인 ‘주’로 바꾸면 원문의 고유 이름이 사라지므로, 출애굽-시내 언약 문맥의 신명성을 보존하는 쪽이 본문의 의미에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
