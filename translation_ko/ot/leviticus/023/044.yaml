lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: declared
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 말했습니다
  - 선포했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 이 절은 절기 규례를 마무리하는 요약 진술이므로, 단순 발화보다 ‘알리다’가 모세가 이 정해진 때들을 백성에게 공적으로 전달한 뜻을 자연스럽게 살립니다.
- source_word: מֹעֲדֵי
