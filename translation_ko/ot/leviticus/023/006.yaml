base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
  footnotes:
  - marker: a
    text: Or 'for the LORD.' The Hebrew preposition can express dedication or belonging.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이 달 열다섯째 날은 야훼를 위한 무교절입니다[a]. 너희는 이레 동안 무교병을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께.’ 히브리어 전치사는 헌납 또는 소속을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם
  english_pob_choice: And on the fifteenth day
  chosen_korean: 이 달의 열다섯째 날에는
  alternatives_korean:
  - 열다섯째 날에는
  - 이 달의 열다섯 날에는
  lexicon: WLC/HALOT
  rationale: 히브리어 날짜 표현을 자연스러운 한국어 순서로 옮기되, 달력을 가리키는 לשון을 분명히 하기 위해 ‘이 달의’를 보탰습니다.
- source_word: חַג הַ/מַּצּוֹת
  english_pob_choice: Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 무교병의 절기
  - 무교의 명절
  lexicon: HALOT
  rationale: 축제 이름으로 굳어진 표현을 간결하게 살리기 위해 ‘무교절’로 옮겼습니다. 본문이 명칭을 말하므로 설명적 풀이는 줄였습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께 드리는
  alternatives_korean:
  - 야훼께
  - 야훼를 위한
  lexicon: POB doctrine / WLC
  rationale: ל의 헌납·소속 의미를 한국어에서 가장 분명하게 드러내기 위해 ‘드리는’을 보탰습니다. POB의 이름형을 따라 야훼를 사용했습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교빵
  lexicon: HALOT
  rationale: 음식 항목으로서의 무교병을 지칭하므로, 성경적·표준적인 용어인 ‘무교병’을 택했습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 이레 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일주일 동안
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 관용을 한국어 성경체에 맞게 간결히 표현했습니다. ‘이레’가 법문체의 지속 기간을 잘 살립니다.
theological_decisions:
- issue: יהוה의 번역형
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 텍스트상 יהוה를 직접 포함하므로, POB의 원칙에 따라 고유 신명 야훼를 유지했습니다. ‘주님’은 의미는 살지만 이름의 직접성을 약화시킵니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: לַיהוָה의 관계 의미
  chosen_reading: 야훼께 드리는
  alternative_readings:
  - 야훼를 위한
  - 야훼의
  rationale: 절기는 단순히 ‘야훼에게 속한 것’이 아니라 헌납된 절기라는 점이 강조되므로, 한국어에서 예배적 헌납성을 드러내는 표현을 택했습니다.
  doctrine_reference: Leviticus cultic dedication language
