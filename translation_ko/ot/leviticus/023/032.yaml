source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
  footnotes:
  - marker: a
    text: Or 'you shall humble yourselves' or 'you shall deny yourselves.' The Hebrew idiom refers to self-affliction in penitential observance, traditionally associated with fasting.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from evening to evening,' marking the observance by Israelite day-reckoning.
    reason: cultural_note
translation:
  language: ko
  text: 그것은 너희를 위한 완전한 안식의 안식일입니다[a]. 너희는 스스로 괴롭게 하여야 합니다. 그 달 아흐레 날 저녁에, 저녁에서 저녁까지[b] 너희는 안식일을 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로 겸손히 하여야 합니다’ 혹은 ‘스스로 부인하여야 합니다.’ 이 히브리어 관용구는 회개적 실천으로서의 자기억제와 자기괴로움을 가리키며, 전통적으로 금식과 관련되어 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘저녁에서 저녁까지’입니다. 이 표현은 이스라엘의 날 계산에 따른 예배 준수 시점을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּ֨ת שַׁבָּת֥וֹן
  english_pob_choice: a Sabbath of complete rest
  chosen_korean: 완전한 안식의 안식일
  alternatives_korean:
  - 온전한 안식의 안식일
  - 엄숙한 안식일
  - 완전한 쉼의 안식일
  lexicon: HALOT
  rationale: ‘שבת שבתון’의 중첩은 단순한 안식일보다 강한 중단/휴식의 강조를 담으므로, ‘완전한 안식’으로 그 강도를 살렸습니다.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  english_pob_choice: you shall afflict yourselves
  chosen_korean: 스스로 괴롭게 하여야 합니다
  alternatives_korean:
  - 스스로 겸손히 하여야 합니다
  - 스스로 부인하여야 합니다
  - 금식하여야 합니다
  lexicon: HALOT
  rationale: 이 관용구는 의례적 자기억제/자기괴로움을 가리키므로, 본문이 직접 말하지 않는 ‘금식’을 앞세우지 않고 직역에 가까운 표현을 택했습니다.
- source_word: מֵ/עֶ֣רֶב עַד עֶ֔רֶב
  english_pob_choice: from evening to evening
  chosen_korean: 저녁에서 저녁까지
  alternatives_korean:
  - 해질 무렵부터 해질 무렵까지
  - 저녁부터 저녁까지
  lexicon: HALOT
  rationale: 히브리어의 시간표현을 그대로 살리되, 한국어에서 자연스럽게 읽히도록 ‘부터/까지’ 구조로 옮겼습니다.
- source_word: תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶם
  english_pob_choice: you shall keep your Sabbath
  chosen_korean: 너희는 안식일을 지켜야 합니다
  alternatives_korean:
  - 너희는 너희 안식일을 지켜야 합니다
  - 너희는 쉬어야 합니다
  - 너희는 안식을 지켜야 합니다
  lexicon: HALOT
  rationale: שבת는 ‘쉬다/그치다’의 뜻이지만, 문맥상 규례의 준수를 뜻하므로 ‘안식일을 지키다’가 가장 자연스럽고 의미를 보존합니다.
theological_decisions:
- issue: ‘afflict yourselves’의 범위
  chosen_reading: 본문의 일반적 표현을 유지해 ‘스스로 괴롭게 하여야 합니다’로 두고, 금식은 주석적 추정으로 본문에 넣지 않았습니다.
  alternative_readings:
  - 금식하여야 합니다
  - 스스로 겸손히 하여야 합니다
  rationale: 히브리어는 이 절에서 금식을 직접 명령하지 않으므로, 더 좁은 실천을 본문에 확정하지 않고 해석의 여지를 남겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
