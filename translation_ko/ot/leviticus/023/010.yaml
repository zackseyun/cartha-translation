  - severity: low
    issue: ‘첫 이삭’은 רֵאשִׁית의 의미를 다소 좁힙니다.
    rationale: 히브리어는 수확의 ‘첫 부분/첫 몫’을 말하며, 반드시 개별 ‘이삭’을 특정하지는 않습니다. ‘첫 수확의 한 단’이 한 단(עֹמֶר)과 첫 몫의 관계를 더 직접적으로 보존합니다.
  - severity: low
