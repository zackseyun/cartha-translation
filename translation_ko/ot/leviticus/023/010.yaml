  source_fidelity: 원문의 명령 구조, ‘이스라엘 자손’, 땅의 수확, 그리고 제사장에게 가져오는 עֹמֶר의 의미는 대체로 충실합니다. 다만 עֹמֶר רֵאשִׁית קְצִירְכֶם은 ‘첫 이삭’ 자체보다 ‘수확의 첫 부분으로 된 한 단’을 가리키므로, 본문의 ‘첫 이삭’은 다소 좁은 표현입니다.
  naturalness: 전반적으로 현대 한국어로 자연스럽지만, 인용문 안의 ‘가져오너라’는 해라체이고, 바깥 명령문 ‘이르십시오’와 목표 합쇼체에 맞지 않습니다. ‘가져오십시오’로 통일하는 것이 적절합니다.
  terminology: ‘이스라엘 자손’, ‘제사장’, ‘한 단’은 적절합니다. עֹמֶר의 음역 대안은 유지할 수 있으나, 각주에는 본문의 실제 대안인 ‘오멜’을 분명히 제시해야 합니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 적절합니다.
