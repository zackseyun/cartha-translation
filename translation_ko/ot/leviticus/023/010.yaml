  rationale: 합쇼체를 일관되게 적용하여 인용문 안의 명령을 ‘가져오십시오’로 고쳤습니다. 또한 ‘첫 이삭’을 ‘첫 수확’으로 조정하여 רֵאשִׁית가 가리키는 수확의 첫 몫을 보존하면서, עֹמֶר는 ‘한 단’으로 유지했습니다. 각주 표지를 관련 어구에 배치하고, b 각주가 실제 음역 대안을 제시하도록 정비했습니다.
