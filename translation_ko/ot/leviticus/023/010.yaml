  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
  footnotes:
  - marker: a
    text: Or, 'the Israelites.' Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the omer of the firstfruits of your harvest.' The Hebrew term can denote a sheaf here and is also used as a technical term 'omer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희가 내가 너희에게 주는 땅에 들어가서 그 땅의 추수를 거두거든, 너희 추수의 첫 이삭 한 단을 제사장에게 가져오너라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 추수의 첫 이삭 한 단’, 히브리어 용어는 여기서 한 단을 뜻할 수 있으며, 또한 기술용어 ‘오멜’로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역적 혈통·공동체 호칭을 살리되 한국어 성경 문맥에서 자연스러운 ‘자손’을 택했습니다.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  english_pob_choice: When you come into the land
  chosen_korean: 땅에 들어가서
  alternatives_korean:
  - 땅으로 들어가서
  - 그 땅에 들어가면
  lexicon: HALOT
  rationale: 언약적 정착을 뜻하는 ‘들어가다’를 유지했고, 조건절의 흐름을 자연스럽게 살리기 위해 ‘들어가서’로 옮겼습니다.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  english_pob_choice: and reap its harvest
  chosen_korean: 그 땅의 추수를 거두거든
  alternatives_korean:
  - 그 땅의 수확을 거두거든
  - 그 땅의 곡식을 거두거든
  lexicon: HALOT
  rationale: 동사 ‘거두다’로 ‘reap’를 살리고, 앞의 ‘땅’의 소유격을 한국어에서는 ‘그 땅의’로 풀어 원문 대상을 분명히 했습니다.
- source_word: עֹמֶר רֵאשִׁית קְצִירְכֶם
  english_pob_choice: the sheaf of the firstfruits of your harvest
  chosen_korean: 너희 추수의 첫 이삭 한 단
  alternatives_korean:
  - 너희 추수의 첫 열매 한 단
  - 너희 추수의 첫 단인 오멜
  lexicon: HALOT
  rationale: עֹמֶר의 구체적 농경 이미지를 살려 ‘한 단’으로 옮기되, רֵאשִׁית는 ‘첫 이삭’으로 표현해 첫 몫의 헌물이라는 의미를 드러냈습니다.
theological_decisions:
- issue: 공동체 호칭을 ‘자손’으로 유지할지 중성화할지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문이 남성 복수의 언약 호칭을 사용하므로, 공동체를 가리키는 관용어로 중성화하기보다 원문의 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: עֹמֶר를 기술용어로 음역할지 농경 이미지로 번역할지
  chosen_reading: 첫 이삭 한 단
  alternative_readings:
  - 오멜
  - 첫 열매의 오멜
  rationale: 문맥이 제사장에게 가져가는 실제 곡물 다발을 말하므로, 독자가 즉시 이해할 수 있는 농경적 표현을 본문에 두고 기술용어 음역은 배제했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
