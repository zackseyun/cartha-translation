- from: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희가 내가 너희에게 주는 땅에 들어가서 그 땅의 추수를 거두거든, 너희 추수의 첫 이삭 한 단을 제사장에게 가져오너라.”[a][b]
