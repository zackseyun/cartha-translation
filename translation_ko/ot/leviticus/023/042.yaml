id: LEV.23.42
reference: Leviticus 23:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
  footnotes:
  - marker: a
    text: Or 'in shelters' or 'in temporary shelters'; Hebrew 'booths' refers to temporary festival shelters.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 칠 일 동안 초막에 거주해야 합니다. 이스라엘 가운데 있는 모든 토박이도 초막에 거주해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '초막들' 혹은 '임시 초막들'로 옮길 수 있습니다. 히브리어 '초막'은 절기용 임시 거처를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  english_pob_choice: in booths
  chosen_korean: 초막에
  alternatives_korean:
  - 부스에
  - 임시 거처에
  - 장막에
  lexicon: HALOT
  rationale: סֻכּוֹת은 절기 동안 사용하는 임시 거처를 가리키므로, 한국어로는 예배 전통에서 익숙한 '초막'이 구체적 이미지와 제의적 맥락을 함께 살립니다.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  english_pob_choice: you shall dwell / shall dwell
  chosen_korean: 거주해야 합니다
  alternatives_korean:
  - 머물러야 합니다
  - 살아야 합니다
  - 거해야 합니다
  lexicon: HALOT
  rationale: ישׁב는 여기서 단순히 앉는 뜻이 아니라 '거주하다/머물다'의 의미이므로, 현대 표준어로는 '거주하다'가 가장 분명하고 격식도 유지합니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날
  - 칠 일
  lexicon: HALOT
  rationale: משך 기간을 나타내는 표현으로, '동안'을 넣어 지속 기간을 자연스럽게 드러냈습니다.
- source_word: כָּל הָאֶזְרָח
  english_pob_choice: every native-born person
  chosen_korean: 모든 토박이
  alternatives_korean:
  - 모든 본토민
  - 모든 태생자
  - 모든 시민
  lexicon: HALOT
  rationale: אֶזְרָח는 공동체 내부의 본토 출생자를 가리키므로, '토박이'가 혈연·출생 기반의 대비를 가장 간결하게 살립니다. '시민'은 후대 정치 개념을 불러오므로 피했습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: in Israel
  chosen_korean: 이스라엘 가운데
  alternatives_korean:
  - 이스라엘에서
  - 이스라엘 안에
  - 이스라엘 중에
  lexicon: HALOT
  rationale: 문맥상 요구 대상이 이스라엘 공동체 내부에 있는 사람들임을 나타내므로, '가운데'가 포괄적이고 자연스럽습니다.
theological_decisions:
- issue: 의무의 대상 범위를 성별로 제한하지 않는 번역
  chosen_reading: '''모든 토박이''로 번역해 남성만을 뜻하는 것으로 읽히지 않게 했습니다.'
  alternative_readings:
  - 모든 토박이 남자
  - 모든 본토민 남성
  - 모든 토박이 사람
  rationale: 히브리어 남성형 단수는 대표적 포괄 용법을 가질 수 있으므로, 번역에서 불필요한 남성 제한을 두지 않고 공동체 전체의 의무로 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
