source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
  footnotes:
  - marker: a
    text: Or 'festival of the LORD.' The Hebrew word can denote a festal celebration, often a pilgrimage feast.
    reason: lexical_alternative
  - marker: b
    text: Or 'a sabbath-rest.' The Hebrew term denotes a special day of rest associated with sacred observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 일곱째 달의 열다섯째 날, 그 땅의 소산을 거두어들일 때에 너희는 일곱 날 동안 야훼의 절기[a]를 지켜야 합니다. 첫째 날에는 엄숙한 안식[b]이 있고, 여덟째 날에도 엄숙한 안식이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 축제’입니다. 히브리어 חַג는 절기적 축제, 흔히 순례 절기를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘안식일 같은 쉼’입니다. 히브리어 שַׁבָּתוֹן은 거룩한 준수와 관련된 특별한 휴지일을 뜻합니다. 이 말은 첫째 날과 여덟째 날 모두에 사용됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 하지만
  - 그러나
  lexicon: HALOT
  rationale: 앞 구절의 규정을 이어 받으면서도 이번 절기 규정을 특정하는 전환이므로, 문맥상 자연스러운 역접·전환어인 ‘그러나’를 택했습니다.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: on the fifteenth day of the seventh month
  chosen_korean: 일곱째 달의 열다섯째 날
  alternatives_korean:
  - 일곱째 달 열다섯째 날
  - 일곱째 달의 열다섯째 날에
  - 일곱째 달 열닷샛날
  lexicon: HALOT
  rationale: 히브리어 날짜 표현의 달력적 정확성을 살리되, 현대 한국어에서 자연스러운 ‘달의 …날’ 구조로 옮겼습니다.
- source_word: תְּבוּאַת הָאָרֶץ
  english_pob_choice: the produce of the land
  chosen_korean: 그 땅의 소산
  alternatives_korean:
  - 그 땅의 산물
  - 그 땅의 소출
  - 그 땅의 수확
  lexicon: HALOT
  rationale: תְּבוּאָה는 특정 곡물보다 넓게 ‘산출된 것/소산’을 가리키므로, 농산물 전체를 포괄하는 ‘소산’이 원문 범위를 잘 보존합니다.
- source_word: חַג יְהוָה
  english_pob_choice: the feast of Yahweh
  chosen_korean: 야훼의 절기
  alternatives_korean:
  - 야훼의 명절
  - 야훼의 축제
  - 야훼의 잔치
  lexicon: HALOT
  rationale: חַג는 단순한 식사 모임이 아니라 지정된 절기적 축제를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘절기’를 선택하되, 본문에 맞게 ‘야훼’의 소유 관계를 유지했습니다.
- source_word: שַׁבָּתוֹן
  english_pob_choice: a solemn rest
  chosen_korean: 거룩한 안식
  alternatives_korean:
  - 엄숙한 안식
  - 안식일 같은 쉼
  - 완전한 안식
  lexicon: HALOT
  rationale: 이 용어는 단순 휴식이 아니라 예배적·거룩한 휴지 상태를 뜻하므로, 절기 맥락을 드러내는 ‘거룩한 안식’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명사 יהוה를 직접 사용하므로, 대체 칭호보다 고유명사 표기를 유지해 언약 სახელ칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שַׁבָּתוֹן의 의미 범위
  chosen_reading: 거룩한 안식
  alternative_readings:
  - 안식일
  - 안식
  - 완전한 쉼
  rationale: 이 절은 주간 안식일이 아니라 절기 중 지정된 휴지일을 말하므로, 독자가 안식일 제도로 오해하지 않도록 예배적 성격을 살린 번역을 택했습니다.
  doctrine_reference: Translation philosophy §6 and festal legislation context in Leviticus 23
