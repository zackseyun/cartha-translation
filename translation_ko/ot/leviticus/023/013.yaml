  rationale: 원문이 여호와 이름(테트라그라마톤)을 직접 사용하므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지해 언약 নাম의 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
