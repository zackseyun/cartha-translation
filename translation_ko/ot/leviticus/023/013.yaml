base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
  footnotes:
  - marker: a
    text: Or 'an offering by fire to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소제는 기름으로 섞은 고운 가루, 곧 에바 십분의 이 두 개이며, 야훼께 드리는 화제[a], 곧 기쁨이 되는 향기입니다. 또 그 전제는 포도주 한 힌의 사분의 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’입니다.
    reason: אִשֶּׁה의 어휘적 대안 번역입니다.
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  english_pob_choice: Its grain offering
  chosen_korean: 그 소제
  alternatives_korean:
  - 그 곡식제물
  - 그 제물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 일반적 ‘예물’보다 ‘소제’가 더 정확하며, 앞선 짐승을 가리키는 3인칭 접미사는 한국어에서 ‘그’로 자연스럽게 받았습니다.
- source_word: שְׁנֵ֨י עֶשְׂרֹנִ֜ים
  english_pob_choice: two-tenths of an ephah
  chosen_korean: 고운 가루 두 에바의 십분의 이
  alternatives_korean:
  - 두 십분의 이
  - 두 오멜
  lexicon: HALOT
  rationale: 히브리어의 분수 표현을 살리되, 제사 규정에서 통용되는 ‘에바’ 단위를 밝혀 현대 독자가 양을 바로 이해하도록 했습니다.
- source_word: אִשֶּׁ֥ה לַ/יהוָ֖ה
  english_pob_choice: a food offering to Yahweh
  chosen_korean: 야훼께 드리는 화제
  alternatives_korean:
  - 야훼께 드리는 음식제물
  - 여호와께 드리는 불제
  lexicon: HALOT
  rationale: אִשֶּׁה는 문자적으로 ‘불로 드리는 제물’이어서, POB의 ‘food offering’보다 원문 표지에 가까운 ‘화제’를 택했습니다.
- source_word: רֵ֣יחַ נִיחֹ֑חַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기쁨이 되는 향기
  - 만족스러운 향기
  lexicon: HALOT
  rationale: 관용구의 수용 가능성보다는 제사가 하나님께 받아들여지는 긍정적 평가를 드러내는 한국어 표현을 택했습니다.
- source_word: וְ/נִסְכֹּ֥/ה
  english_pob_choice: and its drink offering shall be
  chosen_korean: 그 전제는
  alternatives_korean:
  - 그 술제는
  - 그 붓는 제물은
  lexicon: HALOT
  rationale: נֶסֶךְ의 제의적 의미를 살리면서도 한국어 성경에서 널리 이해되는 ‘전제’를 사용했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: ‘LORD’ 대신 ‘야훼’로 옮겼습니다.
  alternative_readings:
