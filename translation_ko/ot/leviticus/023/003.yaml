source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
  footnotes:
  - marker: a
    text: Or 'a sabbath-rest' or 'a sabbath of solemn rest.' The Hebrew phrase intensifies the idea of Sabbath rest.
    reason: lexical_alternative
  - marker: b
    text: Or 'throughout all your settlements.' The Hebrew can refer to dwelling places or settled communities.
    reason: lexical_alternative
translation:
  language: ko
  text: 엿새 동안은 일을 할 수 있으나, 일곱째 날은 온전한 안식의 안식일[a], 곧 거룩한 집회입니다. 너희는 어떤 일도 해서는 안 됩니다. 이는 너희의 모든 거주지에서[b] 야훼께 드리는 안식일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안식의 안식일’ 또는 ‘엄숙한 안식일’로 옮길 수 있습니다. 히브리어 표현은 안식의 강도를 더합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 모든 정착지에서’. 히브리어는 거주지나 정착 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
