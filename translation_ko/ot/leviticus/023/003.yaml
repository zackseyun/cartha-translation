source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
  footnotes:
  - marker: a
    text: Or 'a sabbath-rest' or 'a sabbath of solemn rest.' The Hebrew phrase intensifies the idea of Sabbath rest.
    reason: lexical_alternative
  - marker: b
    text: Or 'throughout all your settlements.' The Hebrew can refer to dwelling places or settled communities.
    reason: lexical_alternative
translation:
  language: ko
  text: 엿새 동안은 일이 하도록 할 수 있으나, 일곱째 날은 완전한 안식의 안식일이며 거룩한 집회입니다. 너희는 어떤 일도 해서는 안 됩니다. 그것은 야훼께 드리는 안식일이며, 너희가 사는 모든 곳에서 지켜야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전한 안식일’ 또는 ‘엄숙한 안식일’로 옮길 수 있습니다. 히브리어 표현은 안식의 강도를 더합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 모든 정착지에서’. 히브리어는 거주지나 정착 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  english_pob_choice: work may be done
  chosen_korean: 일이 하도록 할 수 있으나
  alternatives_korean:
  - 일을 할 수 있으나
  - 일을 하도록 되어 있으나
  lexicon: HALOT
  rationale: נִפעל형의 수동·관용적 뉘앙스를 살리면서, 쉼의 규범을 한국어 자연문으로 옮기기 위해 ‘일이 하도록 할 수 있으나’로 풀었습니다.
- source_word: שַׁבַּת שַׁבָּתוֹן
  english_pob_choice: a Sabbath of complete rest
  chosen_korean: 완전한 안식의 안식일
  alternatives_korean:
  - 완전한 안식
  - 엄정한 안식일
  - 철저한 안식의 안식일
  lexicon: HALOT
  rationale: 반복·강조 구조를 살리기 위해 단순히 ‘안식’이 아니라 ‘완전한 안식의 안식일’로 옮겨, 절대적 쉼의 강도를 드러냈습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 집회
  alternatives_korean:
  - 거룩한 모임
  - 성스러운 집회
  lexicon: HALOT
  rationale: מִקְרָא의 ‘소집/소집된 모임’ 뉘앙스를 보존하되, 현대 한국어에서 가장 자연스러운 제의적 표현인 ‘집회’를 택했습니다.
- source_word: לֹא תַעֲשׂוּ כָּל מְלָאכָה
  english_pob_choice: You shall do no work
  chosen_korean: 너희는 어떤 일도 해서는 안 됩니다
  alternatives_korean:
  - 너희는 아무 일도 해서는 안 됩니다
  - 너희는 어떤 노동도 해서는 안 됩니다
  lexicon: HALOT
  rationale: 본문의 전면적 금지를 분명히 하면서도, ‘일’로 מְלָאכָה의 일반적 의미를 유지해 법규의 직접성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기전승의 신명 יְהוָה는 호칭 대체어가 아니라 고유명사 표기 ‘야훼’로 옮겼습니다.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  english_pob_choice: in all your dwellings
  chosen_korean: 너희가 사는 모든 곳에서 지켜야 합니다
  alternatives_korean:
  - 너희의 모든 거주지에서
  - 너희의 모든 정착지에서
  lexicon: HALOT
  rationale: מוֹשָׁב의 ‘거주지/사는 곳’ 의미를 살리면서, 법조항답게 적용 범위를 분명히 하는 한국어로 풀었습니다.
theological_decisions:
- issue: יַהְוֶה(יְהוָה) 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 단순히 ‘주’가 아니라 언약적 고유명 יְהוָה를 사용하므로, 한국어 본문에서도 대체 호칭을 쓰지 않고 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שַׁבַּת שַׁבָּתוֹן의 강도
  chosen_reading: 완전한 안식의 안식일
  alternative_readings:
  - 안식일의 안식
  - 엄숙한 안식일
  rationale: 단순 휴식이 아니라 모든 노동 중지를 요구하는 제의·언약적 안식이므로, ‘완전한’으로 강조를 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source meaning without paraphrase'
