id: LEV.23.41
reference: Leviticus 23:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
  footnotes:
  - marker: a
    text: Or 'for the LORD' instead of 'to the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an everlasting statute' or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그것을 일 년에 일곱 날 동안 야훼께 바치는 절기로 지켜야 합니다[a]. 그것은 너희 대대로 영원한 규례입니다[b]. 일곱째 달에 너희는 그것을 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위하여’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영속하는 규례’ 혹은 ‘항구한 규례’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  english_pob_choice: you shall celebrate
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 절기를 지켜야 합니다
  - 기념해야 합니다
  - 축제를 지켜야 합니다
  lexicon: HALOT
  rationale: חָגַג는 단순한 관람이 아니라 절기 자체를 지키고 기념하는 행위를 가리키므로, 현대 한국어에서는 ‘지키다’가 예배적·절기적 의무를 가장 자연스럽게 드러냅니다.
- source_word: חַג לַיהוָה
  english_pob_choice: a feast to Yahweh
  chosen_korean: 야훼께 바치는 절기
  alternatives_korean:
  - 야훼께 드리는 절기
  - 야훼를 위한 절기
  - 야훼께 드리는 명절
  lexicon: HALOT
  rationale: חַג은 절기/축제를 뜻하고, לַיהוָה는 단순 방향보다 헌정·귀속의 뉘앙스가 있어 ‘바치는’이 그 의미를 잘 드러냅니다. POB의 ‘to Yahweh’도 이 헌정성을 전제로 합니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - 영속하는 규례
  lexicon: HALOT
  rationale: עוֹלָם은 법률 문맥에서 지속성을 나타내므로, 한국어에서는 전통적 성서 어휘인 ‘영원한 규례’를 쓰되, 절대철학적 무한성보다 계속 유효한 규정이라는 문맥을 유지합니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: throughout your generations
  chosen_korean: 너희 대대로
  alternatives_korean:
  - 너희 세대마다
  - 너희 모든 نسل에 걸쳐
  - 너희 세대를 따라
  lexicon: HALOT
  rationale: 히브리어 관용구는 세대가 이어지는 동안 계속 적용됨을 뜻하므로, 간결한 한국어 관용 ‘대대로’가 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 신명은 전통적 대체어가 아니라 원천 형태를 살려 ‘야훼’로 옮겨, 본문의 언약적 고유성을 유지합니다.
  doctrine_reference: 'POB contested terms: YHWH → 야훼'
- issue: עוֹלָם의 지속성 범위
  chosen_reading: 영원한 규례
  alternative_readings:
  - 영속하는 규례
  - 영구한 규례
  - 세세대대로의 규례
  rationale: 레위기의 절기 규정에서는 ‘עוֹלָם’이 실제로는 언약 공동체 안에서 계속 유효한 규례라는 뜻이므로, ‘영원한’으로 옮기되 형이상학적 무한성을 과잉 주입하지 않도록 합니다.
  doctrine_reference: 'Translation philosophy: preserve the source''s plain sense without importing doctrinal claims'
