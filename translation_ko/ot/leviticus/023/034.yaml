base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
  footnotes:
  - marker: a
    text: Traditionally, 'the Feast of Tabernacles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. 이 일곱째 달 열닷샛날부터 이레 동안은 야훼를 위한 초막절입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 ‘장막절’이라고도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르라
  alternatives_korean:
  - 말하라
  - 이르라
  lexicon: HALOT
  rationale: 명령형 דבר의 공적·전례적 어조를 살리면서, 합쇼체 본문에 자연스럽게 맞는 성경문체로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 원문의 관용구를 직역에 가깝게 보존하면서도 한국어 성경에서 널리 통용되는 집단명으로 옮겼습니다.
- source_word: הַסֻּכּוֹת
  english_pob_choice: Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 초막들
  - 장막절
  - 장막들
  lexicon: HALOT
  rationale: 영어 POB가 본문에서는 투명한 의미를 택했지만, 한국어에서는 절기 이름으로 이미 굳어진 ‘초막절’이 가장 읽기 자연스럽고 의미도 충실합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 위하여
  - 야훼에게
  lexicon: HALOT
  rationale: 야훼의 명칭을 본문에서 유지하고, 절기가 야훼께 속한 예배 행사임을 드러내기 위해 여격 표지를 살렸습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 있는 언약명 자체를 보존하는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다. 문맥상 주(LORD)로 대치하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 절기 명칭 סֻכּוֹת
  chosen_reading: 초막절
  alternative_readings:
  - 초막들 명절
  - 장막절
  rationale: 한국어 독자가 즉시 절기로 인식할 수 있는 정착된 명칭을 사용하되, 원문의 ‘booths/shelters’ 의미와 충돌하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy over translation tradition
