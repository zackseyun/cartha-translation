  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'beside the bread' or 'in addition to the bread'; the Hebrew preposition can express accompaniment rather than physical placement.
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire'; the Hebrew term refers to an offering made by fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 빵과 함께, 여러분은 흠 없는 일 년 된 수컷 어린양 일곱 마리와, 소 떼 가운데서 끌어낸 수소 한 마리와, 숫양 두 마리를 드려야 합니다. 그것들은 야훼께 드리는 번제이며, 그것들의 곡식제물과 전제와 함께 불로 드리는 제물, 야훼께 향기로운 냄새가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그리고 빵과 함께’는 히브리어 전치사 עַל이 여기서 물리적 위치보다 동반·부가의 뜻을 가질 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불로 드리는 제물’은 히브리어 אִשֶּׁה가 가리키는 ‘불로 드리는 제사’의 뜻을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  - 가져다 드려야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 הִקְרִיב는 단순한 '가져오다'보다 제물로 '드리다/바치다'가 자연스럽고, 한국어 합쇼체 문체에서도 예배·제사 행위의 공적 성격을 잘 살립니다.
- source_word: עַל הַלֶּחֶם
  english_pob_choice: with the bread
  chosen_korean: 그리고 빵과 함께
  alternatives_korean:
  - 빵 위에
  - 빵 곁에
  - 빵에 더하여
  lexicon: HALOT
  rationale: עַל이 여기서는 물리적 ‘위에’보다 동반·부가의 뜻으로 쓰이므로, 함께 바치는 동반 관계를 드러내는 표현을 택했습니다.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  english_pob_choice: seven male lambs a year old, without blemish
  chosen_korean: 흠 없는 일 년 된 수컷 어린양 일곱 마리
  alternatives_korean:
  - 흠 없는 한 살 된 숫양 새끼 일곱 마리
  - 완전한 일 년 된 양 일곱 마리
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 제사용 어린양이므로 ‘어린양’으로 옮기고, 남성형과 연령 표현을 반영해 ‘수컷…일곱 마리’로 구체화했습니다.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  english_pob_choice: one bull from the herd
  chosen_korean: 소 떼 가운데서 끌어낸 수소 한 마리
  alternatives_korean:
  - 소 떼의 수소 한 마리
  - 한 마리의 송아지 수소
  lexicon: HALOT
  rationale: פַר בֶּן־בָּקָר은 제물용 소를 가리키므로, ‘소 떼 가운데서 끌어낸’으로 출처를 풀어 주되 나이 뉘앙스는 과도하게 좁히지 않았습니다.
- source_word: אִשֵּׁה רֵיחַ נִיחֹחַ
  english_pob_choice: a food offering, a pleasing aroma
  chosen_korean: 불로 드리는 제물, 야훼께 향기로운 냄새
  alternatives_korean:
  - 화제, 야훼께 기쁜 향기
  - 불로 드린 제물, 만족스러운 향기
  lexicon: HALOT
  rationale: אִשֶּׁה의 불-제사 요소를 살려 ‘불로 드리는 제물’로 옮기고, רֵיחַ נִיחֹחַ는 관용적 희생제사 표현이므로 ‘향기로운 냄새’로 자연스럽게 처리했습니다.
