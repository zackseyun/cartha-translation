  source_fidelity: 초안의 ‘식물’은 현대 한국어에서 주로 plant를 뜻하므로 אִשֶּׁה(여호와께 드리는 화제)를 정확히 전달하지 못합니다. 또한 마지막 ‘날마다 그 날에’는 ‘각 날에 정해진 것을 그 날에’라는 표현을 더 분명히 반영하는 것이 좋습니다.
  naturalness: ‘정해진 때들’, ‘거룩한 소집’, ‘식물’ 및 -니라체는 요청된 현대 표준어 합쇼체에 맞지 않거나 자연스럽지 않습니다. ‘절기’, ‘거룩한 집회’, ‘화제’와 -습니다/-해야 합니다체로 다듬었습니다.
  terminology: יהוה는 한국어 성경의 통용 표기인 ‘여호와’로, אִשֶּׁה는 제의적 의미를 보존하여 ‘화제’로 옮겼습니다. עֹלָה, מִנְחָה, זֶבַח, נְסָכִים은 각각 번제, 곡식 제물, 희생제, 전제로 구분했습니다.
  issues:
  - severity: high
    issue: ‘식물’
    rationale: אִשֶּׁה는 제물, 특히 불로 드리는 제의를 가리키며, 현대 한국어 ‘식물’은 통상 식물(plant)로 이해됩니다.
  - severity: medium
    issue: 마지막 일일 규정의 불명확성
    rationale: דְּבַר־יוֹם בְּיוֹמוֹ는 각 날에 해당하는 규정을 그 날에 이행한다는 뜻이므로 이를 명시할 필요가 있습니다.
  - severity: low
