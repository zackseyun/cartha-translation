id: LEV.23.29
reference: Leviticus 23:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
  footnotes:
  - marker: a
    text: Or 'does not afflict himself.' The Hebrew idiom refers to self-denial or self-humbling, traditionally associated with fasting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 바로 이날 스스로를 낮추지 않는 모든 사람은 자기 백성에게서 끊어질 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로를 괴롭게 하지 않는’. 히브리어 관용구는 자기 부인이나 자기 겸비를 뜻하며, 전통적으로 금식과 연결됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞선 명령을 근거로 잇는 법률·설명 문맥이므로, 한국어에서는 자연스럽게 결론을 이끄는 ‘그러므로’로 연결했습니다.
- source_word: כָל הַנֶּפֶשׁ
  english_pob_choice: every person
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 영혼
  - 각 사람
  lexicon: HALOT
  rationale: נֶפֶשׁ는 כאן에서 추상적 ‘영혼’이 아니라 사람 자체를 가리키므로, 오해를 피하는 ‘모든 사람’으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  english_pob_choice: who does not humble himself
  chosen_korean: 스스로를 낮추지 않는
  alternatives_korean:
  - 스스로 괴롭게 하지 않는
  - 금식하지 않는
  lexicon: HALOT
  rationale: ענה의 관용구는 이날의 자기 겸비·자기 절제의 의미를 가지므로, 직역적 ‘괴롭게 하다’보다 현대 한국어에서 자연스러운 ‘스스로를 낮추다’로 옮겼습니다. 보다 형식적인 표현은 주석에 남겼습니다.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: on this very day
  chosen_korean: 이날
  alternatives_korean:
  - 이 바로 그날
  - 바로 이 날
  lexicon: HALOT
  rationale: 강조어 ‘עצֶם’의 기능은 시간 강조이므로, 간결하면서도 지시의 밀도를 살릴 수 있는 ‘이날’로 처리했습니다.
- source_word: וְנִכְרְתָה מֵעַמֶּיהָ
  english_pob_choice: shall be cut off from his people
  chosen_korean: 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 자기 백성에게서 제거될 것입니다
  - 자기 백성에게서 끊어질 것입니다
  lexicon: HALOT
  rationale: כרת의 언약법적 수동형은 제재 공식 ‘끊어지다’를 보존하는 것이 적절하므로, 그 법적·신학적 무게를 유지했습니다. ‘가운데서’는 מן의 공동체적 분리를 반영합니다.
theological_decisions:
- issue: ‘afflict/humble oneself’의 한국어 본문 처리
  chosen_reading: 본문에는 ‘스스로를 낮추다’를 사용했습니다.
  alternative_readings:
  - 스스로 괴롭게 하다
  - 자기를 학대하다
  - 금식하다
  rationale: 이 표현은 속죄일 문맥에서 통상적 금식·자기 부인의 관용구이므로, 물리적 고통만을 떠올리게 하는 표현은 피하고 회개적 겸비를 드러내는 번역을 택했습니다. 다만 더 직역적인 대안은 주석으로 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘cut off’ 형벌 공식의 범위
  chosen_reading: ‘끊어질 것입니다’를 그대로 유지하고, 구체적 집행 방식은 특정하지 않았습니다.
  alternative_readings:
  - 제외될 것입니다
  - 제거될 것입니다
  - 죽임을 당할 것입니다
  rationale: 히브리어는 이 제재가 사법적 추방인지, 죽음인지, 신적 심판인지 명시하지 않으므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §3
