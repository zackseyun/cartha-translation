source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
  footnotes:
  - marker: a
    text: Or 'appointed feasts' or 'set times.' The Hebrew מוֹעֲדֵי is broader than festival meals alone and refers to times appointed by the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'sacred assemblies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 야훼의 정해진 때들, 곧 거룩한 집회들입니다.[a][b] 여러분은 그것들을 각각 정해진 때에 선포해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 절기들’, ‘정해진 시기들’로도 옮길 수 있습니다. 히브리어 מוֹעֲדֵי는 단순한 축제 식사보다 더 넓게, 야훼께서 정하신 때들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성스러운 모임들’ 또는 ‘거룩한 소집들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹעֲדֵי
  english_pob_choice: appointed times
  chosen_korean: 정한 때들
  alternatives_korean:
  - 정해진 절기들
  - 정한 절기들
  - 정한 시기들
  lexicon: HALOT
  rationale: מוֹעֵד의 핵심은 ‘정해진/임명된 때’이므로, 레위기 23장의 절기 의미를 유지하면서도 축제 음식보다 시간성을 앞세워 ‘정한 때들’로 옮겼습니다.
- source_word: מִקְרָאֵי קֹדֶשׁ
  english_pob_choice: holy convocations
  chosen_korean: 거룩한 모임들
  alternatives_korean:
  - 거룩한 회집들
  - 성스러운 모임들
  - 거룩한 소집들
  lexicon: HALOT
  rationale: מִקְרָא에는 ‘불러 모음’의 뉘앙스가 있지만, 현대 한국어에서 자연스럽고 공적 의미를 살리기 위해 ‘거룩한 모임들’로 옮겼습니다.
- source_word: תִּקְרְאוּ אֹתָם
  english_pob_choice: you shall proclaim them
  chosen_korean: 그것들을 … 선포해야 합니다
  alternatives_korean:
  - 그것들을 … 부르셔야 합니다
  - 그것들을 … 공포해야 합니다
  - 그것들을 … 알리셔야 합니다
  lexicon: HALOT
  rationale: קרא는 단순한 이름 부르기보다 공적으로 선포하는 행위이므로, 의식적·공적 선언의 뜻을 살려 ‘선포하다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 인명적 신적 고유명사인 יְהוָה는 전통적 대치어가 아니라 음역형 ‘야훼’로 옮겨, 본문이 드러내는 신적 이름을 보존했습니다.
theological_decisions:
- issue: 본문의 절기·성회 표현을 교회 제도 용어로 바꿀지 여부
  chosen_reading: ‘정한 때들, 곧 거룩한 모임들’로 유지하여, 제의 달력과 공동체 집회의 이중 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘절기들, 곧 거룩한 집회들’
  - ‘축제들, 곧 성스러운 모임들’
  rationale: 레위기 23장은 특정 행사 목록이 아니라 야훼가 정하신 시간 질서를 말하므로, ‘절기’로만 좁히지 않고 시간성과 공동체성을 함께 보존했습니다.
  doctrine_reference: Leviticus 23 문맥의 מוֹעֵד / מִקְרָא 사용
