id: LEV.23.40
reference: Leviticus 23:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
  footnotes:
  - marker: a
    text: Or possibly, according to later Jewish tradition, 'citron fruit' (etrog). The Hebrew literally speaks of 'the fruit of splendid/beautiful trees.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 첫날에는 아름다운 나무의 열매[a]와 종려나무의 가지와 잎이 무성한 나무의 가지와 시내의 버들을 너희가 가져다가, 너희의 하나님 야훼 앞에서 칠일 동안 기뻐해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 후대 유대 전통에서는 이것을 시트론(에트로그)으로 이해하기도 합니다. 히브리어는 문자적으로는 ‘아름다운/화려한 나무의 열매’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  english_pob_choice: you shall take for yourselves
  chosen_korean: 너희가 가져다가
  alternatives_korean:
  - 너희를 위하여 가져다가
  - 너희가 스스로 가져다가
  lexicon: HALOT
  rationale: 지시문의 의무성을 살리면서도 한국어에서는 자연스럽게 ‘가져다가’로 옮겼습니다. לָכֶם의 ‘너희를 위하여’라는 뜻은 문맥상 동작의 수혜를 통해 드러나므로 과도하게 덧붙이지 않았습니다.
- source_word: פְּרִי עֵץ הָדָר
  english_pob_choice: the fruit of majestic trees
  chosen_korean: 아름다운 나무의 열매
  alternatives_korean:
  - 장엄한 나무의 열매
  - 화려한 나무의 열매
  - 시트론 열매
  lexicon: HALOT
  rationale: 히브리어는 후대의 식별을 본문에 직접 고정하지 않고 ‘아름다움/화려함/장엄함’의 일반적 뜻을 가집니다. 따라서 본문에는 넓은 의미를 유지하는 ‘아름다운 나무의 열매’를 택했습니다.
- source_word: כַּפֹּת תְּמָרִים
  english_pob_choice: branches of palm trees
  chosen_korean: 종려나무의 가지
  alternatives_korean:
  - 종려 잎
  - 야자 가지
  lexicon: HALOT
  rationale: תְּמָרִים는 종려나무를 가리키며, כַּפֹּת는 잎사귀 모양의 가지/송이를 뜻합니다. 한국어에서는 의례적 문맥을 해치지 않는 자연스러운 ‘종려나무의 가지’가 가장 적절합니다.
- source_word: וַעֲנַף עֵץ עָבֹת
  english_pob_choice: boughs of leafy trees
  chosen_korean: 잎이 무성한 나무의 가지
  alternatives_korean:
  - 울창한 나무의 가지
  - 두꺼운 나무의 가지
  lexicon: HALOT
  rationale: עָבֹת의 핵심은 ‘무성하고 빽빽함’에 있으므로, 단순한 두께보다 잎의 풍성함을 드러내는 표현이 본문 의도에 가깝습니다.
- source_word: וְעַרְבֵי נָחַל
  english_pob_choice: willows of the brook
  chosen_korean: 시내의 버들
  alternatives_korean:
  - 시내가의 버들
  - 개울의 버들나무
  lexicon: HALOT
  rationale: נָחַל은 시내/건천을 가리킬 수 있지만, 한국어에서는 자연스럽고 간결한 ‘시내의 버들’이 가장 근접합니다.
- source_word: וּשְׂמַחְתֶּם
  english_pob_choice: you shall rejoice
  chosen_korean: 기뻐해야 합니다
  alternatives_korean:
  - 기뻐할 것입니다
  - 즐거워해야 합니다
  lexicon: HALOT
  rationale: 명령적·규범적 뉘앙스를 살리면서 한국어 법규식 문맥에 자연스러운 의무형으로 옮겼습니다. 단순 미래형보다 본문의 지시 성격이 더 분명하게 드러납니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약명 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명인 ‘야훼’로 옮겼습니다. 일반적 대체어인 ‘주’는 본문의 명시성을 약화시킬 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: פְּרִי עֵץ הָדָר의 특정 과일 식별
  chosen_reading: 본문은 일반적 표현인 ‘아름다운 나무의 열매’로 유지
  alternative_readings:
  - 시트론 열매
  - 에트로그
  rationale: 후대 유대 전통의 식별은 인정하되, 히브리어 본문 자체는 그 식별을 강제하지 않으므로 본문에는 일반 의미를 유지하고 주석으로만 처리하는 것이 더 source-grounded합니다.
  doctrine_reference: Translation philosophy §1, §3
