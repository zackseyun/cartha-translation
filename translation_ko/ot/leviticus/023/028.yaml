  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a day of atonements.'' English commonly renders the festival name as ''Day of Atonement.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 아주 중요한 날에는 어떤 일도 해서는 안 됩니다. 그것은 속죄일이기 때문입니다. 그것은 여러분을 위해, 야훼 너희 하나님 앞에서 속죄를 행하는 날입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘속죄들의 날’입니다. 한국어 성경에서는 보통 ‘속죄일’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה
  english_pob_choice: no work
  chosen_korean: 어떤 일도 … 해서는 안 됩니다
  alternatives_korean:
  - 일을 해서는 안 됩니다
  - 어떤 노동도 해서는 안 됩니다
  - 아무 일도 해서는 안 됩니다
  lexicon: HALOT
  rationale: מְלָאכָה는 절기 금지 문맥에서 ‘일/노동’의 의미가 강하므로, 한국어에서는 법규의 금지성을 살려 ‘어떤 일도 해서는 안 됩니다’로 옮겼습니다.
- source_word: בְּ/עֶצֶם הַ/יּוֹם הַ/זֶּה
  english_pob_choice: on this very day
  chosen_korean: 이 아주 중요한 날에는
  alternatives_korean:
  - 이 바로 그 날에는
  - 이 날에는
  - 이 바로 오늘에는
  lexicon: HALOT
  rationale: 히브리어 관용구는 날짜 자체를 강조합니다. 한국어에서는 단순한 지시보다 강조를 살린 ‘이 아주 중요한 날’로 자연스럽게 표현했습니다.
- source_word: יֹום כִּפֻּרִים
  english_pob_choice: a Day of Atonement
  chosen_korean: 속죄일
  alternatives_korean:
  - 속죄의 날
  - 속죄들의 날
  - 대속죄일
  lexicon: HALOT
  rationale: 절기명은 한국어 성경에서 널리 통용되는 ‘속죄일’이 가장 간결하고 정확합니다. 히브리어의 복수형 뉘앙스는 본문보다는 축일명 관습을 우선했습니다.
- source_word: לְ/כַפֵּר עֲלֵי/כֶם
  english_pob_choice: to make atonement for you
  chosen_korean: 여러분을 위해 … 속죄를 행하는
  alternatives_korean:
  - 여러분을 속죄하기 위한
  - 여러분을 위해 속죄하는
  - 여러분을 위해 속죄하기 위해
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 ‘속죄를 행하다’로 보존해, 단순한 용서 감정이 아니라 제의적 속죄 행위라는 점을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. 이는 호칭이 아니라 고유 이름을 보존하는 선택입니다.
theological_decisions:
- issue: 속죄일과 속죄 행위의 관계
  chosen_reading: 이 날은 백성을 위해 야훼 앞에서 속죄가 이루어지는 절기이므로, 금지 명령의 이유를 본문대로 분명히 드러냈습니다.
  alternative_readings:
  - 그것은 여러분의 죄를 사하는 날입니다
  - 그것은 단지 정결 예식의 날입니다
  rationale: 본문은 단순한 휴일이 아니라 제의적 속죄의 날이라는 이유를 제시합니다. 따라서 ‘속죄를 행하는 날’로 번역해 제사적 의미를 유지했습니다.
  doctrine_reference: 레위기 16장 및 속죄일 제의 문맥
- issue: 직접 호칭의 인칭 처리
  chosen_reading: ‘여러분’과 ‘너희’가 함께 나타나는 형태를 유지해 공동체적 수신자와 언약적 호칭을 함께 드러냈습니다.
  alternative_readings:
  - 일관되게 ‘여러분’만 사용
  - 일관되게 ‘너희’만 사용
  rationale: 본문의 일반 명령은 현대 한국어로 ‘여러분’이 자연스럽지만, 마지막 언약 호칭의 친밀성과 직접성을 살리기 위해 ‘너희 하나님’도 함께 보존했습니다.
  doctrine_reference: 번역 문체와 청중 호칭의 일치
