  rationale: 제의적·공적 맥락에서 단순한 호출보다 공식적으로 선포하는 뜻이므로, 현대 한국어에서도 공적인 घोष行의 뉘앙스를 가진 ‘선포하다’가 가장 적절합니다.
- source_word: בְּ/עֶצֶם הַ/יּוֹם הַ/זֶּה
  english_pob_choice: on that very day
  chosen_korean: 바로 그 날에
  alternatives_korean:
  - 그 바로 그 날에
  - 그 날 자체에
  - 그 날에
  lexicon: HALOT
  rationale: 강조 표현을 자연스러운 한국어로 옮기기 위해 ‘바로 그 날에’로 처리해, 해당 날짜 자체를 지시하는 강조를 살렸습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 집회
  - 거룩한 모임
  - 성스러운 집회
  lexicon: HALOT
  rationale: 레위기 제의 문맥의 고정 표현이므로, 단순한 모임보다 공식적으로 소집된 예배 공동체를 드러내는 ‘성회’를 택했습니다.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: no laborious work
  chosen_korean: 어떤 노동도
  alternatives_korean:
  - 수고로운 일도
  - 노동하는 일도
  - 일상의 노동도
  lexicon: HALOT
  rationale: POB가 지적하듯 이 표현은 모든 행위가 아니라 통상적·노동성 작업을 가리키므로, 금지의 범위를 과장하지 않되 그 성격을 드러내는 ‘노동’을 사용했습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - 대대로 지킬 규례
  lexicon: HALOT
  rationale: 법적 규정의 지속성을 나타내는 관용구로 이해하여, 한국어 성경 문체에서 자연스럽고도 강한 ‘영원한 규례’로 옮겼습니다.
- source_word: בְּ/כָל מוֹשְׁבֹתֵיכֶם לְ/דֹרֹתֵיכֶם
  english_pob_choice: throughout your dwellings for your generations
  chosen_korean: 여러분이 거주하는 모든 곳에서 여러분의 대대로
  alternatives_korean:
  - 모든 거주지에서 여러분의 세대마다
  - 여러분의 모든 거주지에서 대대로
  - 여러분이 사는 곳마다 대대로
  lexicon: HALOT
  rationale: 거주 범위의 분배적 의미와 세대적 지속성을 함께 살리기 위해 ‘모든 곳’과 ‘대대로’를 함께 배치했습니다.
theological_decisions:
