base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly' or 'a holy assembly.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'no work of labor/service'; that is, no ordinary laborious work.
    reason: lexical_alternative
  - marker: c
    text: Or 'an everlasting statute' or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바로 그날에 거룩한 성회를 선포해야 합니다[a]. 어떠한 일상의 노동도 해서는 안 됩니다[b]. 이는 여러분의 모든 거주지에서 대대로 지켜야 할 영구한 규례입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 집회’ 또는 ‘거룩한 모임’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘노동/봉사의 일’이며, 곧 일상적인 노동을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영원한 규례’ 또는 ‘영속적인 규례’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/קְרָאתֶם
  english_pob_choice: you shall proclaim
  chosen_korean: 선포해야 합니다
  alternatives_korean:
  - 공포해야 합니다
