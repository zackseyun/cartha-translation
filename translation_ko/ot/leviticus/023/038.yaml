translation:
  language: ko
  text: 야훼의 안식일들, 그리고 여러분의 예물과 여러분의 모든 서원과 여러분의 모든 자원제물 외에 — 여러분이 야훼께 드리는 것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외에’는 여기서 ‘제외하고’ 또는 ‘더하여’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안식일들’은 히브리어 복수형을 반영한 번역이며, 문맥상 ‘야훼의 안식일’ 또는 ‘야훼의 안식일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
