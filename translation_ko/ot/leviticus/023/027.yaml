  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Traditionally, 'the Day of Atonement.' The Hebrew reads literally 'the Day of Atonements.'
    reason: alternative_reading
  - marker: b
    text: Or 'you shall humble yourselves' or 'you shall deny yourselves.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally, 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 일곱째 달 열째 날은 속죄일입니다[a]. 이날은 너희에게 거룩한 성회가 되어야 합니다. 너희는 스스로를 괴롭게 하고[b] 야훼께 불로 드리는 제물을 바쳐야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘속죄들의 날’이라고 합니다. 전통적으로는 ‘속죄일’로 부릅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘스스로를 낮추어야 합니다’, ‘스스로를 절제해야 합니다’.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로 ‘화제’라고 합니다.
    reason: lexical_alternative
