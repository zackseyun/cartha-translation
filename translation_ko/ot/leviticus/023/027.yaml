review_pass:
  verdict: revise
  source_fidelity: ‘소제물’은 히브리어 אִשֶּׁה를 곡물제물로 한정하므로 원문에 충실하지 않습니다. 또한 נַפְשֹׁתֵיכֶם는 이 관용구에서 ‘영혼’이라기보다 사람 자신을 가리키며, ‘괴롭히다’의 목적어로 직역하지 않는 편이 적절합니다.
  naturalness: ‘거룩한 성회’와 ‘스스로를 괴롭게 하다’는 현대 표준 한국어 성경 문맥에서 자연스럽고 의미가 분명합니다. 합쇼체에 맞추어 의무 표현을 ‘해야 합니다’로 통일했습니다.
  terminology: מִקְרָא־קֹדֶשׁ는 ‘거룩한 성회’로, אִשֶּׁה는 특정 제물 종류인 ‘소제물’이 아니라 ‘불로 드리는 제물’로 옮겼습니다. יוֹם הַכִּפֻּרִים의 복수형은 한국어의 통용 축제명 ‘속죄일’을 본문에 유지하고 각주에서 밝혔습니다. 신명은 초안과 영어 POB의 표기를 따라 ‘야훼’로 유지했습니다.
  issues:
  - severity: high
    issue: ‘소제물’
    rationale: אִשֶּׁה는 불로 드려 연기가 나는 제물을 가리키는 포괄적 제의 용어이며, 곡물제물인 ‘소제물’로 번역하면 제물의 종류를 원문보다 좁힙니다.
  - severity: medium
    issue: ‘너희의 영혼을 괴롭히고’
    rationale: ענה + נפש의 관용구는 자신을 낮추거나 괴롭게 하는 행위를 뜻합니다. ‘영혼’을 목적어로 삼으면 현대 한국어에서 이원론적·부자연스러운 의미를 유발할 수 있습니다.
  - severity: low
    issue: ‘거룩한 소집’
    rationale: 의미는 전달되지만, מִקְרָא קֹדֶשׁ의 정착된 제의적 표현인 ‘거룩한 성회’가 더 자연스럽고 정확합니다.
