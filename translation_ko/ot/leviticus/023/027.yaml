revisions:
- from: 오직 이 일곱째 달의 열째 날은 속죄일이니, 너희에게 거룩한 소집이 되며 너희는 너희의 영혼을 괴롭히고 야훼께 소제물을 드리라.
  to: 그러나 이 일곱째 달 열째 날은 속죄일입니다[a]. 이날은 너희에게 거룩한 성회가 되어야 합니다. 너희는 스스로를 괴롭게 하고[b] 야훼께 불로 드리는 제물을 바쳐야 합니다[c].
  rationale: 원문의 축제명과 제의적 어휘를 보존하되, 한국어에서 오해를 낳는 직역과 원문에 없는 제물 종류의 한정을 바로잡았습니다. ‘그러나’는 אַךְ가 앞선 절기 규정에서 전환을 이루는 기능을 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
