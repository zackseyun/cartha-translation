  source_fidelity: 개정이 필요합니다. שַבָּתוֹן은 일반적으로 절기 중의 엄숙한 휴식/안식을 가리키며, 정례 주간 안식일을 뜻할 수 있는 ‘안식일’로 단정하는 것은 원문의 구별을 흐립니다. 또한 זִכְרוֹן תְּרוּעָה의 기념 대상은 본문상 ‘나팔을 붊’으로 한정되지 않으므로, 본문은 영어 POB의 문맥상 선택을 따르되 각주로 더 넓은 어휘 범위를 명시하는 편이 안전합니다.
  naturalness: ‘말하여 이르십시오’는 현대 표준어 합쇼체에서 중복되고 다소 부자연스럽습니다. ‘이렇게 말하십시오’가 לֵאמֹר을 자연스럽게 반영합니다. ‘그 달의 첫째 날은’보다 ‘그 달 첫째 날에는’이 시간 표현으로 자연스럽습니다.
  terminology: ‘이스라엘 자손’과 ‘거룩한 집회’는 원문의 친족 표현 및 מִקְרָא קֹדֶשׁ의 예배·소집 용어를 적절히 반영합니다. שַבָּתוֹן은 ‘엄숙한 쉼’으로 옮겨 שַׁבָּת과의 구별을 보존합니다.
