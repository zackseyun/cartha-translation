  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
  footnotes:
  - marker: a
    text: Or 'a memorial of loud blasts'; the Hebrew term can refer more broadly to a raised signal sound, including shouting or horn/trumpet blasts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. 일곱째 달, 그 달의 첫째 날은 너희에게 안식일이 될 것이며, 나팔 부는 것을 기념하는 날이요, 거룩한 모임입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּרוּעָה는 함성, 외침, 또는 나팔/신호 소리처럼 더 넓은 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역적 친족 표현을 유지하되, 공동체 전체를 가리키는 집합적 의미가 드러나도록 했습니다.
- source_word: שַׁבָּתוֹן
  english_pob_choice: a solemn rest
  chosen_korean: 안식일
  alternatives_korean:
  - 엄숙한 안식
  - 완전한 쉼
  lexicon: HALOT
  rationale: 한국어에서는 "안식일"이 절기적 휴식의 제도적 의미를 가장 자연스럽게 전달하므로, 과도한 설명 없이 표준적 표현을 사용했습니다.
- source_word: זִכְרוֹן תְּרוּעָה
  english_pob_choice: a memorial of trumpet blasts
  chosen_korean: 나팔 부는 것을 기념하는 날
  alternatives_korean:
  - 나팔 소리의 기념
  - 우렁찬 외침의 기념
  lexicon: HALOT
  rationale: תְּרוּעָה의 넓은 의미를 살리되, 절기 문맥에서 통상 연상되는 나팔/신호 소리를 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 모임
  alternatives_korean:
  - 거룩한 집회
  - 성스러운 회집
  lexicon: HALOT
  rationale: 예배적·공동체적 소집을 뜻하는 관용구이므로, 현대 한국어에서 읽기 쉬운 "모임"으로 옮기되 "거룩한"의 구별성을 유지했습니다.
theological_decisions:
- issue: תְּרוּעָה의 범위
  chosen_reading: 나팔 부는 것
  alternative_readings:
  - 함성
  - 큰 소리
  - 경보음
  rationale: 어근은 더 넓지만, 레위기 23장 절기 문맥에서는 제의적 신호음—특히 나팔 소리—로 이해하는 것이 가장 적절합니다. 다만 의미를 너무 좁히지 않도록 "부는 것"으로 표현했습니다.
  doctrine_reference: Translation philosophy §3, §5
