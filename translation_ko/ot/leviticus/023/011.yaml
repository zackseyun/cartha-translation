id: LEV.23.11
reference: Leviticus 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
  footnotes:
  - marker: a
    text: Or, 'so that you may be accepted.' The Hebrew phrase can express the worshipers' acceptance before the LORD through the offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 앞에서 단을 흔들어야 합니다[a]. 안식일 다음 날에 제사장이 그것을 흔들어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '여러분이 받아들여지도록.' 히브리어 표현은 제물을 통해 여호와 앞에서 예배자들이 받아들여지는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  english_pob_choice: And he shall wave
  chosen_korean: 흔들어야 합니다
  alternatives_korean:
  - 들어 올려야 합니다
  - 요제로 드려야 합니다
  lexicon: HALOT
  rationale: 제의적 동작인 נוף의 핵심을 살리되, 현대 한국어에서 자연스럽고 이해 가능한 동사로 옮겼습니다. '요제'는 명사적 제의 용어로는 가능하지만, 본문 동사의 행위성을 직접 드러내기에는 '흔들다'가 더 분명합니다.
- source_word: הָעֹמֶר
  english_pob_choice: the sheaf
  chosen_korean: 단
  alternatives_korean:
  - 이삭 다발
  - 오멜
  lexicon: HALOT
  rationale: 이 문맥의 עֹמֶר는 곡식의 계량 단위보다 첫 열매 제의로 바쳐지는 곡식 다발을 가리키므로, 제의 장면에 맞는 '단'이 가장 간결하고 읽기 쉽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 번역 원칙에 따라 여호와 대신 신명기적 고유명사인 '야훼'를 사용해, 단순 호칭이 아니라 하나님의 이름 자체를 드러냈습니다.
- source_word: לִרְצֹנְכֶם
  english_pob_choice: for your acceptance
  chosen_korean: 받아들여 주심을 위하여
  alternatives_korean:
  - 여러분의 받아들여짐을 위하여
  - 여러분이 받아들여지도록
  lexicon: HALOT
  rationale: 문구는 제물의 수용 가능성뿐 아니라 예배자들의 수납/승인을 함께 담을 수 있으므로, '받아들여 주심'으로 옮겨 제의적 관계를 자연스럽게 유지했습니다.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  english_pob_choice: on the day after the Sabbath
  chosen_korean: 안식일 다음 날에
  alternatives_korean:
  - 안식일 다음 날에
  - 안식일 다음날에
  lexicon: HALOT
  rationale: 시간표현의 직접적 의미를 보존하면서도 한국어 문장 흐름에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기적 고유명사를 직접 사용하므로, 전통적 대체어 '주님'보다 이름 자체를 표기하는 것이 원문과 POB 원칙에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לִרְצֹנְכֶם의 의미 범위
  chosen_reading: 받아들여 주심을 위하여
  alternative_readings:
  - 여러분의 받아들여짐을 위하여
  - 여러분이 받아들여지도록
  rationale: 이 구절은 제사 행위의 결과를 제물의 수용 가능성에만 제한하지 않고, 그 제의를 통해 예배자들이 받아들여지는 관계적 의미까지 포함할 수 있어 그 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
