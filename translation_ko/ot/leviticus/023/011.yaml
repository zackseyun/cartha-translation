  naturalness: ‘그 곡식 단’과 ‘여러분이 받아들여지도록’은 현대 표준 한국어 합쇼체에서 자연스럽고, 제의 문맥도 지나치게 전문 용어화하지 않고 전달합니다.
  terminology: יְהוָה는 POB 방침과 초안의 선택을 따라 ‘야훼’로 유지합니다. 각주의 ‘여호와’는 본문 표기와 불일치하므로 ‘야훼’로 바로잡습니다. נוף는 ‘흔들다’로 일관되게 옮깁니다.
