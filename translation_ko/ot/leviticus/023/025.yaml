lexical_decisions:
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: no laborious work
  chosen_korean: 노동에 해당하는 어떤 일도
  alternatives_korean:
  - 어떠한 수고스러운 일도
  - 노역 같은 일도
  - 평소 일
  lexicon: HALOT
  rationale: 금지문의 총괄성을 살리면서, מְלֶאכֶת עֲבֹדָה의 의미를 단순한 '모든 일'이 아니라 노동 성격의 일을 가리키는 것으로 반영했습니다.
- source_word: לֹא תַעֲשׂוּ
  english_pob_choice: You shall do no
  chosen_korean: 하지 말고
  alternatives_korean:
  - 해서는 안 됩니다
  - 하지 마십시오
  - 하지 않으셔야 합니다
  lexicon: HALOT
  rationale: 율법적 금지의 직접성을 살리되 현대 한국어에서 자연스러운 명령·금지 표현으로 옮겼습니다.
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: and you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 가져와야 합니다
  - 바쳐야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 קרב의 '가까이 가져와 바치다'라는 뜻을 살리면서, 한국어 성경 문체에 자연스러운 제의 동사를 선택했습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  - 불에 태워 드리는 제물
  lexicon: HALOT
  rationale: 한국어에서는 אִשֶּׁה의 제의적 관용을 가장 직접적으로 드러내는 '화제물'이 의미를 가장 압축적으로 전달합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  - 하나님께
  lexicon: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
  rationale: 원문의 고유명사 יְהוָה를 프로젝트 기본값에 따라 '야훼'로 옮기고, 여격 조사로 제의의 수혜 대상을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 고유한 신명성을 살리는 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
