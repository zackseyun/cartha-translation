    issue: ‘거룩한 모임’의 번역 범위
    rationale: מִקְרָאֵי는 소집·공포와 관련된 정식 집회를 가리키므로 ‘모임’보다 ‘집회’가 원문의 제도적·공적 의미를 더 잘 보존합니다.
  - severity: low
    issue: ‘그때들’의 불필요한 반복과 문장 연결
    rationale: אֹתָם은 앞선 ‘정한 때들’을 받지만, 한국어에서 ‘그때들’을 별도로 반복하면 삽입구가 어색해집니다. 관계절로 직접 수식하면 같은 의미를 더 자연스럽게 전달합니다.
  - severity: low
    issue: 첫 두 명령의 합쇼체 연결
    rationale: ‘말하여’도 가능하나, 독립된 명령 연쇄를 현대 한국어 합쇼체로 옮길 때 ‘말하고 … 이르십시오’가 더 매끄럽습니다.
  revised_text: 이스라엘 자손에게 말하고 그들에게 이르십시오. 야훼의 정한 때들, 곧 너희가 거룩한 집회로 선포해야 할 것들—이것들이 나의 정한 때들입니다.
