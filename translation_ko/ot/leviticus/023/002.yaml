  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
  footnotes:
  - marker: a
    text: Or 'appointed feasts' or 'festivals'; the Hebrew term can refer to fixed sacred occasions generally, not only feast meals.
    reason: lexical_alternative
  - marker: b
    text: Or 'sacred assemblies.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. 야훼의 정한 때들[a][c][b]—너희가 거룩한 모임으로 선포해야 할 그때들—이것들이 나의 정한 때들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 절기들’ ‘절기들’로도 옮길 수 있습니다. 히브리어는 제의적 성격의 정기적인 때를 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 집회’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준적인 언약 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 이르십시오
  lexicon: HALOT
  rationale: 직접 명령으로 백성에게 공식적으로 전하라는 뜻을 살려, 예언·법령 문맥에 맞는 ‘말하여’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 그대로 살려 혈통·언약 공동체의 뉘앙스를 유지했습니다.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  english_pob_choice: appointed times / my appointed times
  chosen_korean: 정한 때들
  alternatives_korean:
  - 정해진 절기들
  - 절기들
  - 기한들
  lexicon: HALOT
  rationale: 23장에서는 안식일까지 포함되므로 ‘절기’로 좁히지 않고, 하나님이 정하신 시기라는 폭넓은 의미를 살려 ‘정한 때들’로 옮겼습니다.
- source_word: מִקְרָאֵי קֹדֶשׁ
  english_pob_choice: holy convocations
  chosen_korean: 거룩한 모임
  alternatives_korean:
  - 거룩한 집회
  - 성회
  lexicon: HALOT
  rationale: מקרא의 ‘불러 모음’ 성격을 살리되 한국어로 자연스럽게 읽히도록 ‘모임’으로 옮겼습니다. ‘성회’는 교회적 색채가 강해 피했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 방침에 따라 신명은 ‘야훼’로 음역해 언약의 고유한 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 관형절의 순서와 종결감
  chosen_reading: 야훼의 정한 때들—너희가 거룩한 모임으로 선포해야 할 그때들—이것들이 나의 정한 때들입니다
  alternative_readings:
  - 이것들이 야훼의 정한 때들입니다
  - 야훼의 정한 때들, 곧 너희가…
  rationale: 히브리어의 앞뒤 강조를 함께 살리기 위해 본문 핵심을 먼저 제시하고, 마지막 ‘이것들이…’로 식별을 마무리했습니다.
  doctrine_reference: Translation philosophy §1, §5
