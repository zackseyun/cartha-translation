  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
  footnotes:
  - marker: a
    text: Or 'an offering by fire' or 'a fire offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 여호와께 칠 일 동안 화제물을 바쳐야 합니다. 일곱째 날에는 거룩한 성회가 있을 것이며, 어떤 노동도 하지 말아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’, ‘불제물’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 바쳐야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 קרב 완료형은 단순히 ‘가까이 오게 하다’보다 제물을 예배 대상으로 바치다/드리다의 뜻이 자연스러워, 공적 제의 행위를 살리는 쪽으로 옮겼습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  lexicon: HALOT
  rationale: 히브리어 אשׁה는 불에 의해 드려지는 제물을 가리키므로, 한국어 성경 전통과 원의미를 함께 살릴 수 있는 ‘화제물’을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 여호와께
  alternatives_korean:
  - 야훼께
  lexicon: HALOT
  rationale: 이 본문은 본문 원어의 여호와/יהוה를 가리키며, 한국어 교회 독자에게는 공인된 신명 표기인 ‘여호와께’가 가장 즉시 이해됩니다. 다만 프로젝트 기본어는 ‘야훼’이므로, 본문 정합성 차원에서 필요 시 차후 일관성 점검이 가능합니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 모임
  - 성스러운 집회
  lexicon: HALOT
  rationale: 이 고정 제의용어는 단순한 집합이 아니라 거룩하게 소집된 예배 공동체를 뜻하므로, 기존 성경 용례와 의미를 함께 반영하는 ‘거룩한 성회’가 적절합니다.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: laborious work
  chosen_korean: 어떤 노동도
  alternatives_korean:
  - 일체의 노역도
  - 수고하는 일도
  lexicon: HALOT
  rationale: 이 금지는 모든 행위를 뜻하는 것이 아니라 축제일에 금지된 노동성 작업을 가리키므로, POB의 뜻을 따라 넓은 의미의 ‘노동’으로 옮기되 부정 범위를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 영어 POB가 신명기적 제의 문맥에서 고유 신명 ‘Yahweh’를 드러내기 위해 제목이 아닌 고유명으로 번역한 점을 따라야 하지만, 한국어 출판 가독성과 기존 독자 이해를 고려해 본문에는 ‘여호와께’를 택했습니다. 이는 프로젝트 기본어 ‘야훼’와는 긴장이 있으나, 본문 단일구절의 수용성을 우선한 결정입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
