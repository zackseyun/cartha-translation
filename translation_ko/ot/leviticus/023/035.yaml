  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly.' The Hebrew phrase מִקְרָא קֹדֶשׁ is a formal term for a summoned holy gathering.
    reason: lexical_alternative
  - marker: b
    text: Or 'regular work' or, more literally in older English, 'servile work.' The phrase refers to ordinary labor associated with service or occupation.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 날에는 거룩한 성회가 있어야 합니다. 노동하는 일은 아무것도 해서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩한 집회”입니다. 히브리어 מִקְרָא קֹדֶשׁ는 거룩하게 불러 모은 공식적 모임을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “정규 노동” 혹은 옛 영어식으로는 “종살이하는 일”입니다. 이 표현은 봉사나 생업과 관련된 일상적 노동을 가리킵니다.
    reason: lexical_alternative
