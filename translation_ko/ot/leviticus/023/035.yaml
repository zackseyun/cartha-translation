  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly.' The Hebrew phrase מִקְרָא קֹדֶשׁ is a formal term for a summoned holy gathering.
    reason: lexical_alternative
  - marker: b
