  lexicon: WLC
  rationale: 법문체의 금지 명령을 현대 표준어 합쇼체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘holy convocation’의 예배-공동체 성격
  chosen_reading: 단순한 집합이 아니라 하나님께로 부름받은 거룩한 회중의 모임으로 읽었습니다.
  alternative_readings:
  - 거룩한 집회
  - 성스러운 모임
  rationale: מִקְרָא는 ‘부름/소집’의 뉘앙스를 가지므로, 예배적 소집이라는 제도적 성격을 약화시키지 않기 위해 ‘성회’로 번역했습니다.
  doctrine_reference: 레위기 23장의 절기 규례
