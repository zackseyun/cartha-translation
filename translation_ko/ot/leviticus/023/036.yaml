source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
  footnotes:
  - marker: a
    text: Or 'offering by fire.' The Hebrew אִשֶּׁה is the standard sacrificial term for an offering presented by fire; 'food offering' is used here as a clear modern rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 칠 일 동안 야훼께 화제[a]를 드려야 합니다. 여덟째 날에는 거룩한 성회를 열어야 하며, 야훼께 화제를 드려야 합니다. 이것은 엄숙한 집회이니, 어떤 생업 노동도 해서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제’는 히브리어 אִשֶּׁה를 옮긴 말로, 불로 드리는 제물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  english_pob_choice: you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: קרב의 제의적 용법을 따라 제물을 하나님께 ‘드리다’로 자연스럽게 옮겼습니다. ‘바치다’도 가능하지만 현대 문맥에서는 ‘드리다’가 더 자연스럽고 공적 예배 언어에 잘 맞습니다.
- source_word: אִשֶּׁה
  english_pob_choice: food offering
  chosen_korean: 화제(제물)
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  lexicon: HALOT
  rationale: 히브리어의 제의적 관용어를 살리되, 독자가 제물의 불살라 드림을 바로 알아보도록 ‘화제’로 옮기고, 의미 보완을 위해 ‘제물’을 덧붙였습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 집회
  - 성스러운 모임
  lexicon: HALOT
  rationale: 절기 법령의 고정 표현으로서 공식적으로 소집된 거룩한 모임이라는 뜻을 살렸습니다. ‘성회’는 한국어 성경에서 널리 통용되지만, 여기서는 ‘거룩한’과 함께 써서 원문의 제의적 성격을 분명히 했습니다.
- source_word: עֲצֶרֶת
  english_pob_choice: a solemn assembly
  chosen_korean: 엄숙한 집회
  alternatives_korean:
  - 엄숙한 성회
  - 절제의 집회
  lexicon: HALOT
  rationale: 절기의 특별하고 엄중한 모임이라는 뜻을 현대 한국어로 풀어 옮겼습니다. ‘엄숙한 집회’는 원문의 장중한 뉘앙스를 살리면서도 지나치게 전통 용어에 기대지 않습니다.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  english_pob_choice: no ordinary work
  chosen_korean: 아무 일상 노동도 해서는 안 됩니다
  alternatives_korean:
  - 어떤 일상 노동도 해서는 안 됩니다
  - 보통 노동을 해서는 안 됩니다
  lexicon: HALOT
  rationale: 일반적인 생업 노동을 금하는 뜻을 분명히 하기 위해 ‘ordinary work’를 ‘일상 노동’으로 옮겼습니다. ‘일’보다 ‘노동’이 구분을 더 정확히 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
