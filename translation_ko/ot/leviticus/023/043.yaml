  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'in shelters.' The Hebrew sukkot refers to temporary booths or shelters; traditional English also uses 'tabernacles.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' or 'the people of Israel.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희 후대가, 내가 이스라엘 자손[b]을 이집트 땅에서 이끌어 낼 때에 그들을 초막[a]에서 살게 했다는 것을 알게 하려는 것입니다. 나는 야훼, 너희 하나님입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장막’. 히브리어 수코트는 임시로 만든 초막 또는 거처를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’ 혹은 ‘이스라엘 백성’. 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
