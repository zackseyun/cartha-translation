  naturalness: 현 번역은 ‘너희 세대가 … 알게 하려는 것입니다’의 문장 구조가 부자연스럽고, 문두 ‘그러므로’가 목적절과 맞지 않습니다. ‘너희 후대가 … 알게 하려는 것입니다’가 현대 표준어 합쇼체에서 자연스럽습니다. 한국어에서는 분배적 복수인 ‘초막들’보다 ‘초막에서’가 자연스럽습니다.
  terminology: ‘야훼’와 ‘이스라엘 자손’은 적절합니다. 수코트는 절기 맥락에서 ‘초막’으로 번역하는 것이 적절하며, ‘장막’은 각주 대안으로 제시할 수 있습니다. 각주는 해당 어휘 바로 뒤에 배치해야 합니다.
