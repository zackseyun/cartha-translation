base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'in shelters.' The Hebrew sukkot refers to temporary booths or shelters; traditional English also uses 'tabernacles.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' or 'the people of Israel.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희 세대가 내가 이스라엘 자손을 이집트 땅에서 이끌어 낼 때에 그들로 하여금 초막들에 살게 했다는 것을 알게 하려는 것입니다. 나는 야훼, 너희 하나님입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초막들’ 대신 ‘장막들’이라 할 수 있습니다. 히브리어 sukkot는 임시 거처를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’ 혹은 ‘이스라엘 백성’으로 옮길 수 있습니다. 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
