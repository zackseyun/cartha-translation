  rationale: 목적 접속사 לְמַעַן의 의미를 ‘이는 … 알게 하려는 것입니다’로 바로잡고, 현대 한국어에 맞게 ‘너희 세대’를 ‘너희 후대’로 다듬었습니다. 초막의 복수는 한국어에서 자연스러운 분배적 단수로 처리했으며, 원문의 어휘적 대안과 이스라엘 자손 관련 각주 표지를 각각 해당 낱말에 붙였습니다. 사역형 ‘살게 했다’, 출애굽의 시간 관계, 그리고 신명 ‘야훼’는 보존했습니다.
