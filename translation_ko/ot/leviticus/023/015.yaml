id: LEV.23.15
reference: Leviticus 23:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
  footnotes:
  - marker: a
    text: Or 'seven complete weeks.' The Hebrew literally says 'seven complete Sabbaths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 안식일 다음 날, 곧 너희가 요제의 단을 가져오는 날부터 헤아리십시오. 온전한 안식일이 일곱 번 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온전한 일곱 주.’ 히브리어는 문자적으로 ‘일곱 온전한 안식일들’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  english_pob_choice: And you shall count
  chosen_korean: 그리고 너희는 … 계산하여라
  alternatives_korean:
  - 그리고 너희는 … 세어라
  - 그리고 너희는 … 헤아려라
  lexicon: HALOT
  rationale: 법적·예식적 지시문으로서 단순 미래보다 명령적 힘이 있으므로, 합쇼체 명령형으로 옮겨 지시성을 살렸습니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 너희는
  alternatives_korean:
  - 너희 자신을 위해
  - 너희를 위하여
  lexicon: HALOT
  rationale: 히브리어의 여격은 계산의 책임이 공동체 자신에게 있음을 강조하지만, 한국어에서는 ‘너희는’이 가장 자연스럽고 문맥상 그 뉘앙스를 충분히 담습니다.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  english_pob_choice: from the day after the Sabbath
  chosen_korean: 안식일 다음 날부터
  alternatives_korean:
  - 안식일 다음 날에서부터
  - 안식일의 다음 날부터
  lexicon: HALOT
  rationale: ‘מָחֳרַת’의 시간적 관계를 자연스럽게 살리기 위해 ‘다음 날’을 택했고, הַשַּׁבָּת은 예식 달력의 표준어인 ‘안식일’로 옮겼습니다.
- source_word: שֶׁבַע שַׁבָּת֖וֹת תְּמִימֹ֥ת
  english_pob_choice: seven complete Sabbaths
  chosen_korean: 완전한 일곱 안식일
  alternatives_korean:
  - 일곱 완전한 안식일
  - 완전한 일곱 주
  lexicon: HALOT
  rationale: 본문이 ‘주(weeks)’가 아니라 ‘안식일들’이라는 표현을 사용하므로 이를 유지했고, תְּמִימֹת은 시간 단위의 ‘완전함’으로서 ‘완전한’으로 옮겼습니다.
theological_decisions:
- issue: שַׁבָּת / שַׁבָּתוֹת를 ‘주’로 풀어 쓸지 여부
  chosen_reading: 본문의 용어를 따라 ‘안식일’과 ‘안식일들’을 유지했습니다.
  alternative_readings:
  - ‘일곱 주’로 의역하기
  - ‘일곱 주간’으로 풀이하기
  rationale: 이 절은 계산 기준일과 주기 단위를 둘러싼 해석 쟁점을 담고 있으므로, 본문이 실제로 사용하는 용어를 유지해 긴장을 보존하는 것이 번역 철학에 부합합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
