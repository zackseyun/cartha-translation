id: LEV.23.17
reference: Leviticus 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'two-tenths'; in priestly measurement this means two-tenths of an ephah.
    reason: cultural_note
  - marker: b
    text: Or 'baked as leavened bread.' The Hebrew explicitly notes that these firstfruits loaves are made with leaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 거주지에서 흔들어 바치는 빵 두 개를 가져오십시오. 그것들은 고운 가루 에바의 십분의 이[a]로 만들고, 누룩을 넣어 구워야 합니다[b]. 이것들은 야훼께 드리는 첫 열매입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘두 십분의 이’는 제사 규정의 측량 단위로, 에바의 십분의 이가 두 단위라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘누룩 든 빵으로 구워야 합니다’로 옮길 수 있습니다. 히브리어는 이 첫 열매 빵들이 누룩이 든 상태임을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  english_pob_choice: From your dwellings
  chosen_korean: 여러분의 거주지에서
  alternatives_korean:
  - 여러분의 집에서
  - 여러분이 사는 곳에서
  lexicon: HALOT
  rationale: מוֹשָׁב은 거주지/정착지를 가리킬 수 있어, 예식 지시문에서는 자연스럽고 문맥을 살리는 ‘거주지’가 적절합니다.
- source_word: לֶחֶם תְּנוּפָה
  english_pob_choice: loaves of bread for a wave offering
  chosen_korean: 흔든 제물 떡
  alternatives_korean:
  - 요제 떡
  - 흔드는 제물의 떡
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 전문용어로 ‘요제/흔든 제물’이 가능하지만, 현대 한국어 가독성을 위해 의미를 풀어 ‘흔든 제물’로 옮겼습니다. לֶחֶם은 여기서 두 개의 빵을 가리키므로 ‘떡’보다 ‘빵/빵 덩이’도 가능하나, 제의 문맥상 ‘떡’이 간결합니다.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  english_pob_choice: of two-tenths of an ephah
  chosen_korean: 고운 가루 두 에바의 십분의 이
  alternatives_korean:
  - 두 에바의 십분의 이
  - 에바의 두 십분의 이
  lexicon: HALOT
  rationale: 본문의 עֶשְׂרֹנִים은 십분의 단위이며, POB의 각주 취지를 살려 ‘에바의 십분의 이’로 풀었습니다. 한국어로는 수량 관계가 드러나도록 ‘두 에바의 십분의 이’라고 옮겼습니다.
- source_word: חָמֵץ תֵּאָפֶינָה
  english_pob_choice: baked with leaven
  chosen_korean: 누룩을 넣어 구워야 합니다
  alternatives_korean:
  - 누룩 넣은 채로 구워야 합니다
  - 누룩으로 구워야 합니다
  lexicon: HALOT
  rationale: 히브리어는 이 떡들이 실제로 누룩이 들어간 상태로 구워짐을 분명히 하므로, 전통적으로 예상되는 무교와의 긴장을 지우지 않도록 ‘누룩을 넣어’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명은 학술적 음역인 ‘야훼’를 사용해, POB의 출처 직접성을 유지했습니다.
theological_decisions:
- issue: 첫 열매와 누룩 든 떡의 결합
  chosen_reading: 첫 열매는 ‘누룩을 넣어 구운’ 떡으로 드려집니다.
  alternative_readings:
  - 첫 열매이므로 무교병으로 이해할 수 있습니다
  - ‘누룩을 넣어’는 단순한 제빵 설명일 수 있습니다
  rationale: 본문은 בִּכּוּרִים(첫 열매)과 חָמֵץ(누룩 든 상태)를 함께 말해, 첫 열매 제물이라도 무교가 아님을 분명히 합니다. 번역에서도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 레위기 23장의 제의 규정 문맥, 본문 내부의 명시적 형용사 חָמֵץ
- issue: 직역 가능한 제의 용어의 현대화
  chosen_reading: תְּנוּפָה를 ‘흔든 제물’로 풀어 설명했습니다.
  alternative_readings:
  - ‘요제’로 음역해 전통 용어를 유지
  - ‘요제물’로 옮김
  rationale: 한국 교회 용어의 관용성보다 원문의 제의 동작 의미를 드러내는 것이 우선이므로, 독자가 행위와 제물의 관계를 바로 이해하도록 풀어 옮겼습니다.
  doctrine_reference: '번역 철학: source-direct rendering, cultic terminology consistency'
