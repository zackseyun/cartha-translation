id: LEV.23.12
reference: Leviticus 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the omer'; here the term likely refers to the sheaf presented in the offering ritual rather than merely a dry measure.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그 오멜을 흔드는 날에, 흠 없는 수컷 어린양 한 마리 곧 일 년 된 것을 야훼께 번제물로 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오멜’은 여기서 단순한 계량 단위라기보다 제의에서 드는 곡식 다발을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  english_pob_choice: you shall offer
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 하여야 합니다
  - 바쳐야 합니다
  lexicon: HALOT
  rationale: 제사 문맥에서 עשה는 단순한 ‘하다’보다 제물을 ‘드리다/드리다’의 의미로 자연스럽게 기능하므로, 한국어도 제의적 뜻을 살려 옮겼습니다.
- source_word: הֲנִיפְכֶם אֶת הָעֹמֶר
  english_pob_choice: you wave the sheaf
  chosen_korean: 그 오멜을 흔드는 날에
  alternatives_korean:
  - 그 단을 흔드는 날에
  - 그 오멜을 제시하는 날에
  lexicon: HALOT
  rationale: עֹמֶר는 여기서 단순한 계량 단위보다 의식에서 드는 곡식 다발을 가리키므로, POB의 주석을 반영해 ‘오멜’을 유지하되 동작은 ‘흔드는’으로 살렸습니다.
- source_word: כֶּבֶשׂ תָּמִים בֶּן שְׁנָתוֹ
  english_pob_choice: a male lamb without blemish, a year old
  chosen_korean: 흠 없는 수컷 어린양 한 마리 곧 일 년 된 것
  alternatives_korean:
  - 흠 없는 어린양 한 마리 곧 일 년 된 것
  - 흠 없는 수양 한 마리 곧 일 년 된 것
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 제의 문맥에서 어린양이며, 여기서는 뒤의 연령 규정과 맞물려 수컷임을 분명히 해야 하므로 ‘수컷 어린양’으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본문의 신명은 직접 표기된 여호와/야훼의 계명 절을 따라 학술적 표준음역인 ‘야훼’를 사용하고, 제의의 방향성을 ‘께’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼를 본문에 직접 사용합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 YHWH를 직접 사용하므로, 소스 직결성과 추적 가능성을 위해 전통 교회어보다 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 제의 동사 עשה의 처리
  chosen_reading: 제사 행위로 읽어 ‘드려야 합니다’로 옮깁니다.
  alternative_readings:
  - 하여야 합니다
  - 만들어야 합니다
  rationale: 문맥상 일반적 ‘행하다’가 아니라 제물 봉헌의 지시이므로, 제의적 의미를 분명히 드러내는 번역이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 레위기 제의 문맥의 동사 استعمال
