id: LEV.23.22
reference: Leviticus 23:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'corner of your field.' The Hebrew term can denote an edge, side, or corner.
    reason: lexical_alternative
  - marker: b
    text: Or 'resident foreigner.' The Hebrew word refers to a non-Israelite living among Israel under its social protections.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 수확을 거둘 때에는 밭의 가장자리를[a] 남김없이 거두지 말고, 수확할 때 떨어진 이삭을 줍지도 마십시오. 그것들을 가난한 사람과 거류민을[b] 위해 남겨 두십시오. 나는 야훼, 여러분의 하나님입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭의 모퉁이’. 히브리어 פאה는 가장자리, 옆면, 또는 모퉁이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나그네’. 히브리어 גֵּר는 이스라엘 공동체 안에 거주하며 그 사회적 보호를 받는 외부인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם / בְּקֻצְרֶךָ
  english_pob_choice: And when you reap / when you reap
  chosen_korean: 땅의 추수를 거둘 때에는
  alternatives_korean:
  - 추수할 때에는
  - 거두어들일 때에는
  lexicon: HALOT
  rationale: 두 번 반복된 ‘거둘 때’의 시간적 조건을 한국어로 자연스럽게 풀어, 법문 특유의 절차적 어조를 살렸습니다.
- source_word: פְּאַת שָׂדְךָ
  english_pob_choice: the edge of your field
  chosen_korean: 밭의 가장자리
  alternatives_korean:
  - 밭의 모퉁이
  - 밭의 끝자락
  lexicon: HALOT
  rationale: פאה는 edge/side/corner를 모두 포괄하지만, 이 농경법 맥락에서는 남겨 두어야 할 바깥 경계를 가리키므로 ‘가장자리’가 가장 무난합니다.
- source_word: וְלֶקֶט קְצִירְךָ
  english_pob_choice: the gleanings of your harvest
  chosen_korean: 추수한 이삭들의 떨어진 것
  alternatives_korean:
  - 이삭 줍기의 남은 것
  - 추수의 이삭 줍이
  lexicon: HALOT
  rationale: לֶקֶט은 수확 뒤에 남은 이삭/떨어진 곡식 조각을 가리키므로, ‘이삭들의 떨어진 것’으로 구체적으로 옮겨 법적 의미를 드러냈습니다.
- source_word: לֶעָנִי וְלַגֵּר
  english_pob_choice: for the poor and for the sojourner
  chosen_korean: 가난한 사람과 나그네
  alternatives_korean:
  - 가난한 사람과 거류민
  - 빈곤한 이들과 거주 외국인
  lexicon: HALOT
  rationale: עָנִי는 경제적으로 취약한 ‘가난한 사람’으로, גֵּר는 공동체 안에 사는 보호받는 외부인을 뜻하므로 ‘나그네’로 옮기되 그 사회적 보호 뉘앙스를 살렸습니다.
- source_word: תַּעֲזֹב אֹתָם
  english_pob_choice: you shall leave them
  chosen_korean: 남겨 두십시오
  alternatives_korean:
  - 버려 두십시오
  - 그대로 두십시오
  lexicon: HALOT
  rationale: 여기서 עזב는 정서적 ‘버리다’보다 다른 이들을 위해 남겨 두는 뜻이므로, 명령형으로 간결하게 ‘남겨 두십시오’라 번역했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 주 당신들의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 원형을 따라 ‘야훼’로 옮기고, אֱלֹהֵיכֶם의 복수 소유격은 법문의 공동체 خطاب에 맞춰 ‘당신들의’로 표현했습니다.
theological_decisions:
- issue: 공동체를 향한 법문의 존댓말 처리
  chosen_reading: 명령형을 ‘-십시오’로 처리해 현대 표준어의 공적 법문 어조를 유지했습니다.
  alternative_readings:
  - -하세요
  - -해야 합니다
  rationale: 히브리어 법문은 직접적인 금지·명령을 제시하므로, 한국어에서는 공적인 규범문체에 맞는 합쇼체 명령형이 가장 충실합니다.
  doctrine_reference: Translation style guideline — modern formal-polite Korean
