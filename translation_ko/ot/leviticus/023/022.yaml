  terminology: יהוה는 ‘야훼’로 유지합니다. גֵּר는 본문에서 ‘거류민’으로 번역하여 단순한 여행객을 뜻할 수 있는 ‘나그네’의 모호함을 피하고, 각주에서 ‘나그네’라는 대안을 제시합니다. עָנִי는 ‘가난한 사람’으로 적절합니다.
