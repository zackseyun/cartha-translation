id: LEV.23.20
reference: Leviticus 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
  footnotes:
  - marker: a
    text: Or 'over the bread of the firstfruits' and 'over the two lambs'; the Hebrew preposition can be rendered more literally, but here likely indicates associated ritual presentation.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것들을 첫 수확의 떡과 함께, 곧 요제로 여호와 앞에 흔들어 바쳐야 합니다. 그것들은 두 숫양과 함께 여호와께 거룩한 것이며, 제사장에게 속합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘첫 수확의 떡 위에’이며, ‘두 숫양 위에’로도 옮길 수 있습니다. 히브리어 전치사는 더 문자적으로는 이렇게 번역될 수 있지만, 여기서는 의식적 동반 제시를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  english_pob_choice: shall wave
  chosen_korean: 흔들어 바쳐야 합니다
  alternatives_korean:
  - 흔들어야 합니다
  - 요제로 드려야 합니다
  lexicon: HALOT
  rationale: 제의적 동사 נוּף의 예배 행위를 살리면서, 한국어에서 제사 행위로 자연스러운 ‘흔들어 바치다’로 옮겼습니다.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  english_pob_choice: with the bread of the firstfruits
  chosen_korean: 첫 수확의 떡과 함께
  alternatives_korean:
  - 첫 열매의 떡과 함께
  - 초실의 떡과 함께
  - 첫 수확의 떡 위에
  lexicon: HALOT
  rationale: עַל의 관계를 단순한 ‘위에’로 고정하지 않고, POB의 해석에 따라 의식상 함께 제시되는 뜻을 드러내는 ‘~과 함께’로 옮겼습니다.
- source_word: תְּנוּפָה
  english_pob_choice: as a wave offering
  chosen_korean: 요제로
  alternatives_korean:
  - 요제물로
  - 흔드는 제물로
  lexicon: HALOT
  rationale: 히브리어 제의 용어의 표준 대응인 ‘요제’ 계열을 사용해, 단순 동작 설명이 아니라 제의적 범주를 분명히 했습니다.
- source_word: קֹדֶשׁ יִהְיוּ לַיהוָה
  english_pob_choice: They shall be holy to Yahweh
  chosen_korean: 그것들은 ... 여호와께 거룩한 것이며
  alternatives_korean:
  - 그것들은 ... 여호와께 거룩해야 하며
  - 그것들은 ... 여호와께 성별되며
  lexicon: HALOT
  rationale: קֹדֶשׁ יִהְיוּ는 상태 진술이므로 ‘거룩한 것’으로 처리해 제의적 소속과 구분을 보존했습니다.
- source_word: לַכֹּהֵן
  english_pob_choice: for the priest
  chosen_korean: 제사장에게 속합니다
  alternatives_korean:
  - 제사장 것을 됩니다
  - 제사장에게 돌아갑니다
  lexicon: HALOT
  rationale: 법적 귀속을 드러내는 표현으로 옮겨, 제사장 몫이라는 문맥상 의미를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 구절의 영어 POB 감사본은 divine name을 Yahweh로 두었지만, 본 프로젝트의 한국어 표준 용례와 예배 문맥 가독성을 고려해 ‘여호와’를 사용했습니다.
  doctrine_reference: POB Korean glossary default for YHWH
- issue: 제의 용어 ‘요제’의 유지
  chosen_reading: 요제/요제로
  alternative_readings:
  - 흔드는 제물
  - 흔들어 바치는 제물
  rationale: 히브리어 תְּנוּפָה의 제의적 기술 용어를 유지해, 단순 동작 설명으로 축소되지 않도록 했습니다.
  doctrine_reference: Leviticus sacrificial terminology
