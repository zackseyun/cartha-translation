id: LEV.23.7
reference: Leviticus 23:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly' or 'a holy assembly.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'work of labor/service'; that is, ordinary labor. Traditionally rendered 'servile work.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 날에는 너희를 위한 거룩한 성회가 있을 것입니다. 너희는 어떤 노동도 해서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִקְרָא קֹדֶשׁ는 ‘거룩한 성회’, ‘거룩한 집회’, 또는 ‘거룩한 모임’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מְלֶאכֶת עֲבֹדָה는 문자적으로 ‘노동/봉사의 일’이며, 곧 통상적인 노동을 가리킵니다. 전통적으로는 ‘노역’으로 번역되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  english_pob_choice: On the first day
  chosen_korean: 첫째 날에는
  alternatives_korean:
  - 첫날에는
  - 그 첫째 날에는
  lexicon: HALOT
  rationale: 전치사 בַּ와 정관사+서수의 시간 표현을 한국어로 자연스럽게 옮겨, 절기의 시점을 분명히 했습니다.
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: a holy convocation
  chosen_korean: 거룩한 성회
  alternatives_korean:
  - 거룩한 모임
  - 성스러운 집회
  lexicon: HALOT
  rationale: מִקְרָא는 단순한 집합보다 ‘불러 모음/소집된 모임’의 뉘앙스가 있어, 예배적·공적 성격을 살려 ‘성회’로 옮겼습니다.
- source_word: מְלֶאכֶת עֲבֹדָה
  english_pob_choice: laborious work
  chosen_korean: 노동
  alternatives_korean:
  - 일
  - 일상 노동
  - 노역
  lexicon: HALOT
  rationale: 절기 규례의 금지 대상은 통상적인 생업 노동이며, ‘노동도 해서는 안 됩니다’가 본문의 총체적 금지를 한국어로 간결하게 드러냅니다.
- source_word: לֹא תַעֲשׂוּ
  english_pob_choice: you shall do no
  chosen_korean: 해서는 안 됩니다
  alternatives_korean:
  - 하지 말아야 합니다
  - 하지 마십시오
  lexicon: HALOT
  rationale: 법규 문맥의 금지를 현대 한국어의 자연스러운 금지문으로 옮겼습니다.
theological_decisions:
- issue: מִקְרָא קֹדֶשׁ의 예배적 성격
  chosen_reading: ‘거룩한 성회’로 옮겨, 단순한 회합이 아니라 야훼께 드리는 공적 소집의 성격을 살렸습니다.
  alternative_readings:
  - 단순한 집회
  - 거룩한 모임
  rationale: 레위기 절기 규례의 문맥상 이는 예배와 공동체 질서가 결합된 공식 소집이므로, ‘성회’가 의미를 가장 잘 보존합니다.
  doctrine_reference: 절기 예배와 공동체 소집의 성격
- issue: מְלֶאכֶת עֲבֹדָה의 금지 범위
  chosen_reading: 본문은 모든 가능한 행위를 전면 금지한다기보다, 절기 외의 통상적 노동을 금지합니다.
  alternative_readings:
  - 모든 일을 전면 금지
  - 제의적 일만 제외하고 전부 금지
  rationale: 영문 POB의 주해처럼 이 표현은 일반 노동을 가리키는 좁은 범주이므로, 과도하게 확대하지 않고 번역해야 합니다.
  doctrine_reference: 안식/절기 노동 규례
