id: LEV.12.3
reference: Leviticus 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/יּ֖וֹם הַ/שְּׁמִינִ֑י יִמּ֖וֹל בְּשַׂ֥ר עָרְלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/003.yaml
  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
  footnotes:
  - marker: a
    text: Or more dynamically, 'he must be circumcised on the eighth day.' The Hebrew is formally passive ('shall be circumcised'), and the main text preserves that form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여덟째 날에는 그의 포피의 살을 할례해야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 포피의 살은 할례를 받아야 합니다.’ 히브리어는 형식상 수동형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  english_pob_choice: And on the ... day
  chosen_korean: 그리고 ... 날에는
  alternatives_korean:
  - 그리고 ... 날에
  - 그 ... 날에는
  lexicon: HALOT
  rationale: 연결사와 시간 표현의 기능을 살려 법적 지시문의 순서를 자연스럽게 옮겼습니다.
- source_word: הַ/שְּׁמִינִי
  english_pob_choice: eighth
  chosen_korean: 여덟째
  alternatives_korean:
  - 8번째
  - 제8의
  lexicon: HALOT
  rationale: 서수 형용사이므로 표준적인 현대 한국어 서수 표현인 ‘여덟째’를 택했습니다.
- source_word: יִמּוֹל
  english_pob_choice: shall be circumcised
  chosen_korean: 할례해야 합니다
  alternatives_korean:
  - 할례를 받아야 합니다
  - 할례를 받아야 합니다
  - 할례될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 니팔 형태의 수동/자기지시적 표현이지만, 한국어에서는 법규적 문맥을 살리기 위해 자연스러운 의무형으로 옮겼습니다. 수동형을 직역한 ‘할례될 것입니다’는 한국어 법문으로는 부자연스러워서 제외했습니다.
- source_word: בְּשַׂר עָרְלָתוֹ
  english_pob_choice: the flesh of his foreskin
  chosen_korean: 그의 포피의 살
  alternatives_korean:
  - 그의 포피 살
  - 포피의 살
  lexicon: HALOT
  rationale: ‘בְּשַׂר’은 ‘살’, ‘עָרְלָה’는 ‘포피’이므로 두 명사의 결합을 그대로 반영했습니다. ‘그의 포피의 살’은 원문의 소유·수식 관계를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 수동형 명령/규정의 보존 여부
  chosen_reading: 한국어 본문에서는 수동성을 완전히 보존하지 않고 규범적 의무형으로 옮겼습니다.
  alternative_readings:
  - '직역형: ‘그의 포피의 살은 할례를 받게 될 것입니다’'
  - '주어를 명시한 능동형: ‘사람은 그의 포피의 살을 할례해야 합니다’'
  rationale: 히브리어 수동형은 이 절의 법적 지시를 나타내지만, 한국어에서는 수동 직역이 어색해 의미 전달을 약화시킵니다. 따라서 본문은 의무성을 분명히 하되, 각주로 원문의 형식을 안내했습니다.
  doctrine_reference: 번역학적 판단; 본문 의미 보존과 문장 자연성의 균형
