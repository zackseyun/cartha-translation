id: LEV.12.8
reference: Leviticus 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
  footnotes:
  - marker: a
    text: Or 'purification offering' for 'sin offering'; in this context the offering addresses ritual impurity after childbirth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어린 양 값을 감당할 수 없으면, 산비둘기 두 마리나 어린 집비둘기 두 마리를 가져와야 합니다. 하나는 번제물로, 하나는 속죄제물로 드려야 하며, 제사장이 그녀를 위해 속죄할 것입니다. 그러면 그녀는 깨끗해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물’. 이 문맥에서는 출산 후의 의례적 부정을 다루는 제물입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  english_pob_choice: she cannot afford a lamb
  chosen_korean: 어린 양 값을 감당할 수 없으면
  alternatives_korean:
  - 어린 양에 필요한 만큼의 여력이 없으면
  - 어린 양을 살 형편이 되지 않으면
  lexicon: HALOT
  rationale: 히브리어 관용구는 경제적 여력의 부족을 뜻하므로, 한국어에서는 자연스럽게 ‘감당할 수 없다’로 풀어 의미를 분명히 했습니다.
- source_word: שְׁתֵּי תֹרִים
  english_pob_choice: two turtledoves
  chosen_korean: 산비둘기 두 마리
  alternatives_korean:
  - 도비둘기 두 마리
  - 멧비둘기 두 마리
  lexicon: HALOT
  rationale: תֹרִים은 일반 비둘기보다 산비둘기/도비둘기에 가까운 새를 가리키므로, 널리 통용되는 자연스러운 표기로 옮겼습니다.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  english_pob_choice: two young pigeons
  chosen_korean: 어린 집비둘기 두 마리
  alternatives_korean:
  - 어린 비둘기 두 마리
  - 집비둘기 새끼 두 마리
  lexicon: HALOT
  rationale: 직역적인 ‘비둘기의 새끼들’보다, 제물 문맥에서 이해하기 쉬운 ‘어린 집비둘기’가 원문의 뜻을 잘 전달합니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 정결제물
  lexicon: HALOT
  rationale: 이 절은 출산 후의 정결 규례이므로, POB의 주석적 긴장을 살리면서도 한국어에서는 제물의 기능을 드러내는 ‘속죄제물’을 본문에 두고, 다른 가능성은 각주로 남겼습니다.
theological_decisions:
- issue: 출산 후 정결례에서 חַטָּאת의 의미
  chosen_reading: 본문에는 ‘속죄제물’을 사용하고, 각주로 제의적 의미의 대안을 남깁니다.
  alternative_readings:
  - 죄를 위한 제물로 이해하는 번역
  - 정결제물로 옮기는 번역
  rationale: 문맥은 도덕적 죄책보다 의례적 부정의 해소를 강조하므로, 본문은 제물의 기능을 살리되 POB의 영어 주석과 맞물리도록 대안 번역 가능성을 명시했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
