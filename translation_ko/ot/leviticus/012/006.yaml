    rationale: 원문 תָּבִיא은 단수 동사 하나로 어린양과 비둘기 제물을 제사장에게 가져오는 행위를 표현합니다. 두 번째 ‘그것을 … 가져가야 합니다’는 원문에 없는 중복이며 지시 대상도 모호합니다.
