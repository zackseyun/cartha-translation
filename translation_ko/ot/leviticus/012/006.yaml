  verdict: revise
  source_fidelity: 초안은 정결 기간의 완료, 아들이나 딸의 경우, 일 년 된 어린양의 번제, 비둘기류의 חַטָּאת, 회막 입구와 제사장이라는 핵심 요소를 대체로 담고 있습니다. 그러나 히브리어는 제물들을 한 번 가져오도록 명하는데, 초안은 ‘가져와야 합니다’ 뒤에 ‘그것을 … 가져가야 합니다’라고 같은 동작을 중복하여 서술합니다. 또한 ‘그것’은 두 제물을 함께 받는지 불분명합니다.
  naturalness: ‘아들에 대해서든 딸에 대해서든’은 이 출산 문맥에서 다소 부자연스럽고, ‘회막 입구의 제사장’은 제사장이 입구에 위치한다는 뜻을 명료하게 드러내지 못합니다. ‘아들이든 딸이든’과 ‘회막 어귀에 있는 제사장에게’가 현대의 격식 있는 한국어로 자연스럽습니다. ‘한 해 된’보다 ‘일 년 된’이 규정된 동물 연령을 더 명확하게 전달합니다.
  terminology: ‘번제물’과 ‘속죄제물’은 제의 용어로 사용할 수 있습니다. 다만 חַטָּאת가 이 문맥에서 의례적 부정을 다루는 제물이라는 점은 본문 용어를 바꾸어 확정하기보다, 해당 용어 바로 뒤의 각주에서 ‘정결제물’이라는 가능한 번역을 밝혀 보존하는 것이 적절합니다. בֶּן־יוֹנָה는 ‘집비둘기 새끼’, תֹר는 ‘산비둘기’로 구별했습니다.
