revisions:
- from: 그리고 그녀의 정결의 날이 아들에 대해서든 딸에 대해서든 다 차면, 한 해 된 어린 양을 번제물로, 어린 집비둘기 한 마리나 산비둘기 한 마리를 속죄제물로 가져와야 합니다. 그것을 회막 입구의 제사장에게 가져가야 합니다.[a]
  to: 그 여자가 아들을 낳았든 딸을 낳았든, 정결의 날들이 다 차면, 일 년 된 어린양 한 마리를 번제물로, 집비둘기 새끼 한 마리나 산비둘기 한 마리를 속죄제물[a]로 하여 회막 어귀에 있는 제사장에게 가져가야 합니다.
  rationale: 원문의 단일 명령문 구조에 맞추어 중복된 ‘가져가야 합니다’를 삭제하고, 제물의 종류·목적·제시 대상과 장소를 한 문장 안에 명료하게 연결했습니다. 출산의 두 경우, 동물의 연령과 종을 자연스러운 한국어로 다듬었으며, חַטָּאת의 문맥상 가능한 의미는 본문에서 과도하게 교리화하지 않고 용어 직후의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:01:09Z'
