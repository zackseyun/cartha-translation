source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'for a purification offering.' The Hebrew term can denote the offering used to remove ritual impurity, not only an offering for moral transgression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀의 정결의 날이 아들에 대해서든 딸에 대해서든 다 차면, 한 해 된 어린 양을 번제물로, 어린 집비둘기 한 마리나 산비둘기 한 마리를 속죄제물로 가져와야 합니다. 그것을 회막 입구의 제사장에게 가져가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַטָּאת는 이 문맥에서 ‘죄’에 대한 제물만이 아니라 의례적 부정을 제거하는 제물을 가리킬 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  english_pob_choice: when the days of her purification are completed
  chosen_korean: 그녀의 정결의 날이 … 다 차면
  alternatives_korean:
  - 그녀의 정결의 날이 완료되면
  - 그녀의 정결의 날이 끝나면
  lexicon: HALOT
  rationale: 완료라는 형식어보다 “다 차다”가 기간의 충만/완결을 자연스럽게 옮기면서, 레위기의 정결 절차라는 제의적 시간을 잘 드러냅니다.
- source_word: לְבֵן אוֹ לְבַת
  english_pob_choice: whether for a son or for a daughter
  chosen_korean: 아들에 대해서든 딸에 대해서든
  alternatives_korean:
  - 아들이든 딸이든
  - 아들을 위해든 딸을 위해든
  lexicon: HALOT
  rationale: 규정의 적용 범위를 남녀 자녀 경우 모두에 대해 분명히 하되, 히브리어의 대조 구조를 한국어로 자연스럽게 살렸습니다.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  english_pob_choice: a year-old lamb
  chosen_korean: 한 해 된 어린 양
  alternatives_korean:
  - 일 년 된 어린 양
  - 한 살짜리 어린 양
  lexicon: HALOT
  rationale: 제의적 연령 규정을 현대 한국어로 자연스럽게 옮기면서도, “어린 양”으로 희생 제물의 성격을 유지했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: a sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 정결제물
  lexicon: HALOT
  rationale: 이 문맥에서는 출산 자체가 도덕적 죄라기보다 의례적 부정에서의 회복이 핵심이므로, 본문에는 제의 기능을 드러내는 “속죄제물”을 택했습니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  english_pob_choice: to the priest at the entrance of the tent of meeting
  chosen_korean: 회막 입구의 제사장에게 가져가야 합니다
  alternatives_korean:
  - 회막 입구에서 제사장에게 가져가야 합니다
  - 회막 입구에 있는 제사장에게 가져가야 합니다
  lexicon: HALOT
  rationale: 히브리어의 최종 위치구를 반영해 제물의 제시 장소를 “회막 입구”로 두고, 수여 대상인 제사장을 함께 자연스럽게 연결했습니다.
theological_decisions:
- issue: חַטָּאת의 번역을 ‘속죄제물’로 둘지 ‘죄제물/속죄제’로 둘지
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄제물
  - 속죄제
  - 정결제물
  rationale: 이 규정은 출산 후의 의례적 부정을 제거하는 제사이므로, 한국어 본문은 기능 중심으로 읽히는 ‘속죄제물’을 사용해 독자가 도덕적 죄책과 혼동하지 않도록 했습니다.
  doctrine_reference: 제의적 부정과 도덕적 죄의 구별
- issue: 정결 기간의 표현을 직역형 ‘정결의 날’로 둘지, 완곡한 ‘회복 기간’으로 둘지
  chosen_reading: 정결의 날
  alternative_readings:
  - 정결 기간
  - 정결 기간의 날들
  rationale: 레위기의 규정적 시간표현을 살리기 위해 ‘정결의 날’을 택했고, 본문 안에서 기간 완료를 ‘다 차면’으로 보완했습니다.
  doctrine_reference: 레위기 정결 규정의 시간적 구조
