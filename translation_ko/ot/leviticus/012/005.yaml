    issue: The first duration is rendered as '이십일 동안.'
    rationale: The Hebrew dual שְׁבֻעַיִם means 'two weeks,' i.e., fourteen days, not twenty-one days.
  - severity: high
    issue: The second duration is rendered as '삼십육 일 동안.'
    rationale: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים means 'sixty-six days,' not thirty-six days.
  - severity: medium
    issue: The wording '정결한 피를 위하여 앉을 것이니라' is unnatural and obscure in Korean.
    rationale: The Hebrew idiom means that she continues/remains in the period associated with 'the blood of purification'; it does not naturally mean sitting 'for pure blood.'
  - severity: medium
    issue: The draft does not use the specified modern formal-polite 합쇼체.
    rationale: The required target register calls for forms such as '-합니다/-해야 합니다,' rather than '-것이니라.'
