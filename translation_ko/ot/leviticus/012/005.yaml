  text: 만일 여자 아이를 낳으면, 월경 때와 같이 두 주 동안 부정하게 되며, 육십육 일 동안 정결의 피[a]의 기간에 머물러야 합니다.
  philosophy: optimal-equivalence
  footnotes:
