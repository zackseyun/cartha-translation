id: LEV.12.2
reference: Leviticus 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
  footnotes:
  - marker: a
    text: Or 'when a woman conceives.' The Hebrew case-law particle can be rendered either 'if' or 'when' in context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'gives birth to a male.'
    reason: lexical_alternative
  - marker: c
    text: That is, ritual impurity associated with menstruation.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손에게 이렇게 말씀하십시오. “여자가 임신하여[a] 남자아이를 낳으면[b], 그 여자는 칠 일 동안 부정하게 될 것입니다[c]. 월경으로 인한 부정의 날들과 같이 부정하게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 조건 표현은 문맥에 따라 ‘만일’ 또는 ‘~할 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘남자를 낳으면’입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘부정’은 월경과 관련된 제의적 부정 상태를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 집합적 남성 복수 표현을 한국어 성경어법으로 가장 투명하게 옮기되, 자연스러운 법문체에 맞게 ‘자손’을 택했습니다.
- source_word: תַזְרִיעַ
  english_pob_choice: conceives
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 몸에 씨를 받아
  lexicon: HALOT
  rationale: 어근의 직역보다 산파적·법적 문맥에서 자연스러운 의미인 ‘임신하다’를 사용해, 영어 POB의 ‘conceives’와 같은 기능을 살렸습니다.
- source_word: זָכָר
  english_pob_choice: a male child
  chosen_korean: 남자아이
  alternatives_korean:
  - 남자 아이를
  - 남자아들을
  - 남자아이를 낳으면
  lexicon: HALOT
  rationale: 단순히 성별 표지를 드러내는 זָכָר의 의미를 현대 한국어로 분명하게 전달하되, ‘아들’보다 성별 표지에 더 가까운 표현을 택했습니다.
- source_word: טָמֵא / תִּטְמָא
  english_pob_choice: unclean
  chosen_korean: 부정할 것이니라 / 부정할 것입니다
  alternatives_korean:
  - 부정할 것입니다
  - 정결하지 않을 것입니다
  - 의식적으로 부정할 것입니다
  lexicon: HALOT
  rationale: 본문의 법적·정결 상태를 가리키는 טמא를 그대로 ‘부정하다’로 옮겨, 본문의 제의적 긴장을 약화시키지 않았습니다.
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  english_pob_choice: as in the days of her menstrual impurity
  chosen_korean: 자기의 월경 부정의 날들처럼
  alternatives_korean:
  - 월경 부정의 날들과 같이
  - 월경의 부정 기간처럼
  - 생리의 부정 기간처럼
  lexicon: HALOT
  rationale: ‘월경’과 ‘부정’을 함께 살려 제의적 의미를 유지했고, ‘days of’ 구조는 한국어에서 ‘날들처럼’으로 비교를 보존했습니다.
theological_decisions:
- issue: טמא의 번역에서 제의적 부정성의 유지
  chosen_reading: ‘부정하다’로 직역해 제의적 상태를 드러냄
  alternative_readings:
  - ‘정결하지 않다’
  - ‘의식적으로 부정하다’
  rationale: 이 절은 도덕적 오염이 아니라 정결법상의 상태를 말하므로, 본문의 기술어를 순화하지 않고 그대로 드러내는 것이 문맥에 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 인용문 안의 문체
  chosen_reading: 직접 명령문과 예언/법문체를 살려 ‘이르십시오’와 인용문 내부의 법문체를 구분함
  alternative_readings:
  - 모든 부분을 평서문으로 평준화
  - 인용문 내부도 전부 합쇼체로 통일
  rationale: 히브리어의 명령-법문 구조를 드러내기 위해 바깥에서는 공손한 서술체, 안에서는 법적 진술의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §4
