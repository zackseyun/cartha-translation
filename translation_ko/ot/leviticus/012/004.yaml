  naturalness: ‘그러면’은 조건·추론의 뉘앙스가 있어 단순 접속사 וְ의 문맥상 연결을 다소 왜곡할 수 있으므로 삭제했습니다. ‘성소에 들어가서는 안 됩니다’가 규정문에서 ‘들어와서는’보다 자연스럽습니다. 부정문에서는 ‘아무 거룩한 것도 만져서는 안 됩니다’가 현대 표준어로 더 자연스럽습니다.
  terminology: ‘정결’, ‘성소’, ‘거룩한 것’은 제의적 범주와 מִקְדָּשׁ 및 קֹדֶשׁ의 폭을 적절히 유지합니다. ‘정결의 피’는 불투명하지만 원문의 표현을 보존하며, 도덕적 죄책을 함축하지 않습니다.
