base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
  footnotes:
  - marker: a
    text: Or 'in the blood of purification.' The Hebrew phrase is literally 'in the bloods/blood of purification' and refers to the postpartum period associated with ritual purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그녀는 자신의 정결의 피 가운데서 서른세 날 동안 머물러야 합니다. 그녀는 어떤 거룩한 것도 만져서는 안 되며, 정결의 날들이 끝날 때까지 성소에 들어와서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결의 피 가운데서’. 히브리어 구문은 문자적으로 ‘정결의 피들/피의 정결’에 가깝고, 출산 후 정결 의식과 연결된 기간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  english_pob_choice: for thirty-three days
  chosen_korean: 서른세 날 동안
  alternatives_korean:
