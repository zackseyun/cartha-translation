  - 아무 거룩한 것도
  - 성물
  lexicon: HALOT
  rationale: 형용사적으로 폭넓게 쓰인 표현을 한국어에서는 자연스럽게 ‘어떤 거룩한 것’으로 옮겼으며, 대상의 범위를 과도하게 좁히지 않았습니다.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ
  english_pob_choice: and she shall not come into the sanctuary
  chosen_korean: 성소에 들어와서는 안 됩니다
  alternatives_korean:
  - 성소에 들어가서는 안 됩니다
  - 성소로 와서는 안 됩니다
  lexicon: HALOT
  rationale: מִקְדָּשׁ의 예배 공간 의미를 살려 ‘성소’로 옮겼고, 동작은 한국어 자연성에 맞게 ‘들어와서는 안 됩니다’로 표현했습니다.
- source_word: יְמֵי טָהֳרָהּ
  english_pob_choice: the days of her purification
  chosen_korean: 정결의 날들
  alternatives_korean:
  - 그녀의 정결의 날들
  - 정결 기간
  lexicon: HALOT
  rationale: 마지막 절의 시간 한계를 자연스럽게 보이게 하면서도, 의례적 ‘정결’이라는 핵심 범주를 유지했습니다.
theological_decisions:
- issue: 례법적 정결을 도덕적 죄책으로 읽지 않기
