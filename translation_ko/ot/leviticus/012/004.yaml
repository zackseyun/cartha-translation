  lexicon: HALOT
  rationale: 히브리어의 합산 표현을 한국어에서는 자연스럽게 ‘서른세 날’로 옮기되, 기간 의미를 ‘동안’으로 분명히 했습니다.
- source_word: תֵּשֵׁב
  english_pob_choice: she shall remain
  chosen_korean: 머물러야 합니다
  alternatives_korean:
  - 있어야 합니다
  - 머물러야 합니다
  - 살아야 합니다
  lexicon: HALOT
  rationale: 의례 규정의 상태 지속을 ‘머물러야 합니다’로 옮겨, 단순한 물리적 ‘앉다’보다 지속 상태를 드러냈습니다.
- source_word: בִּ/דְמֵי טָהֳרָה
  english_pob_choice: in the blood of her purification
  chosen_korean: 자신의 정결의 피 가운데서
  alternatives_korean:
  - 정결의 피 가운데서
  - 그 정결의 피 가운데서
  - 정결의 피 속에서
  lexicon: HALOT
  rationale: 정결 의식과 출산 후 출혈의 구체성을 유지하기 위해 ‘정결의 피’를 살리고, 문맥상 여성 대명사의 소유 관계를 ‘자신의’로 반영했습니다.
- source_word: בְּ/כָל קֹדֶשׁ
  english_pob_choice: any holy thing
  chosen_korean: 어떤 거룩한 것도
  alternatives_korean:
