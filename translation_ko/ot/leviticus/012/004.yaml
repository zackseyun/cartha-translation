  lexicon: HALOT
  rationale: 정결 의식과 출산 후 출혈의 구체성을 유지하기 위해 ‘정결의 피’를 살리고, 문맥상 여성 대명사의 소유 관계를 ‘자신의’로 반영했습니다.
- source_word: בְּ/כָל קֹדֶשׁ
  english_pob_choice: any holy thing
  chosen_korean: 어떤 거룩한 것도
