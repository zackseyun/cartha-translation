  rationale: 이 본문은 출산 후의 의례적 상태를 말하며, 도덕적 죄책을 암시하지 않도록 ‘정결’이라는 제의적 용어를 유지했습니다.
  doctrine_reference: 'Translation philosophy: ceremonial purity language should preserve cultic category without importing moral guilt.'
