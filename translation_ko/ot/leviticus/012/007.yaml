  text: 그는 그것을 야훼 앞에 바쳐 그 여자를 위하여 속죄할 것이며, 그러면 그 여자는 자기 피의 근원에서 정결하게 될 것입니다[a]. 이것은 남자아이를 낳았든 여자아이를 낳았든 아이를 낳은 여자를 위한 규례입니다.
