  source_fidelity: 개정이 필요합니다. 히브리어는 제사장이 제물을 야훼 앞에 드려 그 여자를 위하여 속죄하고, 그 결과 여자가 ‘그녀의 피의 근원에서’ 정결하게 된다는 순서를 말합니다. 초안의 ‘정결케 함이라’는 여자가 정결하게 된다는 술어와 의미를 정확히 전달하지 못합니다.
