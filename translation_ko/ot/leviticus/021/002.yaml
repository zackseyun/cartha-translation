translation:
  language: ko
  text: 가까운 그의 친족, 곧 그의 어머니와 그의 아버지와 그의 아들과 그의 딸과 그의 형제에게만 해당합니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׁאֵר는 문자적으로 ‘살’ 또는 ‘혈족’을 뜻할 수 있으므로, ‘가까운 친족’은 ‘혈족’ 또는 ‘살붙이’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: except for
