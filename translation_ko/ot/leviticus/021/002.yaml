  - ‘오직 ~만’
  rationale: 이 절은 단순 정보가 아니라 이전 절의 제한을 풀어 주는 법조문이므로, 예외 허용의 범위를 분명히 하는 번역이 본문 기능을 가장 잘 전달합니다.
  doctrine_reference: Leviticus 21:1-2 정결 규례 문맥
