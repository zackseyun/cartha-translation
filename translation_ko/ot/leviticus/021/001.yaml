id: LEV.21.1
reference: Leviticus 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
  footnotes:
  - marker: a
    text: Hebrew 'for a dead person'; literally 'for a נפשׁ (nephesh)' in this purity-law context, an idiom for a corpse or dead person.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall not become unclean' or 'shall not defile himself.' The Hebrew refers to ritual impurity from contact with the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “제사장들, 곧 아론의 아들들에게 말하여 그들에게 이렇게 전하십시오. 자기 백성 가운데 있는 죽은 사람 때문에는 아무도 자신을 더럽혀서는 안 됩니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘죽은 사람’은 정결법 문맥의 히브리어 נֶפֶשׁ를 반영한 표현으로, 문자적으로는 ‘시신’ 또는 ‘죽은 자’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자신을 더럽혀서는 안 됩니다’는 히브리어의 의식적 부정 표현을 따른 번역으로, 도덕적 타락을 뜻하는 말은 아닙니다.
    reason: theological_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명은 통상적 호칭으로 바꾸지 않고, POB의 원칙에 따라 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  english_pob_choice: Speak ... and say
  chosen_korean: 말하여 ... 전하십시오
  alternatives_korean:
  - 말씀하여 ... 말씀하십시오
  - 말하여 ... 말하십시오
  lexicon: HALOT
  rationale: 첫 번째는 모세에게 주는 전달 명령, 두 번째는 내용 전달을 자연스럽게 나타내기 위해 동사를 구분해 살렸습니다.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  english_pob_choice: the priests, the sons of Aaron
  chosen_korean: 제사장들, 곧 아론의 아들들
  alternatives_korean:
  - 제사장들, 아론의 아들들
  - 아론의 자손인 제사장들
  lexicon: HALOT
  rationale: 직역에 가까운 친족·직분 결합 표현을 유지하되, 한국어에서는 ‘곧’으로 동격을 분명히 했습니다.
- source_word: לְנֶפֶשׁ
  english_pob_choice: for a dead person
  chosen_korean: 죽은 사람 때문에
  alternatives_korean:
  - 시체 때문에
  - 죽은 자 때문에
  - 한 시신 때문에
  lexicon: HALOT
  rationale: 정결법 문맥에서 נֶפֶשׁ가 죽은 사람/시신을 가리키는 관용법이므로, 문맥을 살린 현대 한국어로 옮겼습니다.
- source_word: יִטַּמָּא
  english_pob_choice: shall not make himself unclean
  chosen_korean: 자신을 더럽혀서는 안 됩니다
  alternatives_korean:
  - 부정하게 되어서는 안 됩니다
  - 자신을 부정하게 해서는 안 됩니다
  lexicon: HALOT
  rationale: 의식적 부정의 범주를 보존하면서도, 한국어에서 자연스러운 금지 표현으로 옮겼습니다. ‘더럽히다’는 도덕적 오염보다 의례적 부정을 나타내는 전통적 표현으로 사용할 수 있습니다.
- source_word: בְּעַמָּיו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데
  alternatives_korean:
  - 자기 ժողովրդի 가운데
  - 자기 친족 가운데
  lexicon: HALOT
  rationale: 직역의 ‘among his people’ 의미를 유지하되, 제사장 문맥에서 공동체 내부를 가리키는 표현으로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 의식적 부정 vs. 도덕적 더러움
  chosen_reading: ‘자신을 더럽혀서는 안 됩니다’로 옮겨 정결법의 의식적 부정 개념을 유지했습니다.
  alternative_readings:
  - 부정하게 되어서는 안 됩니다
  - 자신을 부정하게 해서는 안 됩니다
  rationale: 본문은 시체 접촉으로 인한 제의적 부정을 다루므로, 도덕적 죄악과 혼동되지 않도록 하되 한국어 관용상 가장 널리 이해되는 표현을 택했습니다.
  doctrine_reference: 레위기 정결 규례의 문맥 보존
