  source_fidelity: 원문의 포괄적 금지(‘어떤 죽은 자의 몸에도’)와 부모의 경우에도 부정해져서는 안 된다는 내용을 반영합니다. 다만 초안의 ‘죽은 자의 시체’는 같은 뜻을 중복하여 원문의 간결성을 흐립니다.
  naturalness: ‘어떤 시체에도 가까이 가지 말아야 하며’와 ‘자신을 부정하게 해서는 안 됩니다’는 현대 표준어 합쇼체에서 자연스럽고, 레위기의 규정 문맥에도 맞습니다.
  terminology: טמא의 의례적 의미를 보존하기 위해 ‘부정하게’로 유지했습니다. 이를 도덕적 죄로 한정하는 표현은 피했습니다.
  issues:
  - severity: medium
    issue: ‘죽은 자의 시체’의 의미 중복
    rationale: ‘시체’ 자체가 죽은 사람의 몸을 뜻하므로 ‘죽은 자의’가 덧붙으면 한국어에서 중복적입니다. 원문의 נַפְשֹׁת מֵת는 정결례 문맥에서 시체를 가리키므로 ‘어떤 시체’가 명료합니다.
  - severity: low
    issue: 부모의 경우에 대한 강조가 충분히 드러나지 않음
    rationale: 일반적 금지 뒤에 아버지와 어머니를 특별히 언급하는 원문의 효과를 ‘때문에도’로 자연스럽게 드러낼 수 있습니다.
  revised_text: 그는 어떤 시체에도 가까이 가지 말아야 하며, 자기 아버지나 어머니 때문에도 자신을 부정하게 해서는 안 됩니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘죽은 사람’. 히브리어 표현은 직역하면 ‘죽은 자들의 생명/사람들’에 가깝지만, 정결례 규정의 문맥에서는 시체를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 중복적인 ‘죽은 자의 시체’를 ‘어떤 시체’로 고쳐 원문의 포괄적 금지를 자연스러운 한국어로 옮겼습니다. ‘부정하게’는 의례적 부정의 핵심 용어를 유지하며, ‘때문에도’는 부모의 경우에도 예외가 없음을 문맥상 드러냅니다.
