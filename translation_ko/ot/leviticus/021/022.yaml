    issue: ‘음식을, 지성물 중에서와 성물 중에서 먹을 수 있습니다’의 구문이 부자연스럽습니다.
    rationale: 히브리어의 전치사구는 먹을 수 있는 하나님의 음식의 두 범주를 지정합니다. 한국어에서는 ‘중에서와’라는 병렬이 어색하므로, 두 범주를 음식의 내용으로 직접 제시해야 뜻과 문체가 모두 분명해집니다.
  revised_text: 그는 자기 하나님의 음식인 지성물과 성물을 먹을 수 있습니다.
  revised_footnotes:
