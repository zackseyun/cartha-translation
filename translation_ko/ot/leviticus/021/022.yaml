    text: 또는 ‘자기 하나님의 빵’. 여기서 ‘빵’은 제사장이 받는 음식 몫을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  revision_rationale: 어색한 전치사구 병렬을 ‘음식인 지성물과 성물’로 고쳐, 하나님의 음식으로서 먹도록 허용된 두 제의 범주를 명확하고 자연스럽게 나타냈습니다. 허용의 법적 뉘앙스와 지성물·성물의 구별은 그대로 보존했습니다.
