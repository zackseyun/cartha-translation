id: LEV.21.22
reference: Leviticus 21:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
  footnotes:
  - marker: a
    text: Or 'bread of his God.' Here 'bread' functions idiomatically for the priestly food portions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 하나님의 음식[a]을, 지성물 중에서와 성물 중에서 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 하나님의 빵’. 여기서 ‘빵’은 제사장 몫의 음식이라는 관용적 의미로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 빵
  - 먹을 것
  - 양식
  lexicon: HALOT
  rationale: 제의 문맥에서 לֶחֶם은 단순한 ‘빵’보다 성소 제물로서의 식량을 가리킬 수 있으므로, 한국어에서는 ‘음식’이 제사장 몫의 먹을거리를 자연스럽게 드러냅니다.
- source_word: אֱלֹהָיו
  english_pob_choice: his God
  chosen_korean: 자기 하나님
  alternatives_korean:
  - 그의 하나님
  - 그 하나님
  - 자기 하느님
  lexicon: HALOT
  rationale: 소유격과 인칭 관계를 살리되 현대 표준어와 공적 문체에 맞게 ‘자기 하나님’으로 옮겨, 제사장과 하나님 사이의 언약적 소속을 분명히 했습니다.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  english_pob_choice: from the most holy things
  chosen_korean: 지성물 중에서
  alternatives_korean:
  - 가장 거룩한 것들 중에서
  - 지극히 거룩한 제물 중에서
  - 지성소의 것들 중에서
  lexicon: HALOT
  rationale: 히브리어의 최상급 관용구를 한국어 제의 용어인 ‘지성물’로 압축해, 등급이 가장 높은 거룩한 제물이라는 법적 구분을 유지했습니다.
- source_word: וּמִן הַקֳּדָשִׁים
  english_pob_choice: and from the holy things
  chosen_korean: 성물 중에서
  alternatives_korean:
  - 거룩한 것들 중에서
  - 성스러운 것들 중에서
  - 거룩한 제물 중에서
  lexicon: HALOT
  rationale: 앞 구절과의 대조를 살려, 더 낮은 등급의 제의 몫을 ‘성물’로 옮겨 קדש 어근의 반복과 구분을 보존했습니다.
- source_word: יֹאכֵל
  english_pob_choice: he may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹을 수 있습니다
  - 먹어도 됩니다
  - 먹습니다
  lexicon: HALOT
  rationale: 법조문에서 미완료형의 허용 의미를 반영하여, 의무나 단순 미래보다 허가의 뜻이 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 부정 결격 제사장의 허용 범위 표현
  chosen_reading: 봉사와 접근은 제한되지만, 성물과 지성물의 섭취는 허용된다는 법적 대비를 살렸습니다.
  alternative_readings:
  - 단순히 미래적 사실로만 읽기
  - 의무적 진술로 읽기
  rationale: 문맥상 결격 제사장은 제단 봉사에는 나아갈 수 없지만, 제의적 몫의 섭취는 계속 허용됩니다. ‘먹을 수 있습니다’는 이 대비를 가장 정확하게 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §6
