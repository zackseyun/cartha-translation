  source_fidelity: 히브리어의 허용을 나타내는 미완료형 יֹאכֵל을 ‘먹을 수 있습니다’로 옮긴 것은 문맥에 맞습니다. לֶחֶם의 제의적 의미와 ‘지성물’/‘성물’의 구별도 유지되어 있습니다.
  naturalness: 초안의 ‘음식을, 지성물 중에서와 성물 중에서 먹을 수 있습니다’는 조사 결합이 어색하고, 무엇을 먹는지의 관계가 한국어에서 불분명합니다. 지성물과 성물을 ‘하나님의 음식’의 내용으로 직접 연결하는 편이 자연스럽습니다.
  terminology: ‘하나님의 음식’, ‘지성물’, ‘성물’은 제의·법률 문맥에 적절하며, 지성소와 혼동될 수 있는 표현도 피하고 있습니다.
  issues:
