translation:
  language: ko
  text: 그래서 모세는 아론과 그의 아들들에게 그리고 이스라엘의 모든 자손에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이며, 언약 공동체를 가리키는 대표적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: So Moses spoke
  chosen_korean: 그래서 모세는 말했습니다
  alternatives_korean:
  - 그리고 모세는 말했습니다
  - 그때 모세는 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 완료형 서두를 한국어에서는 문맥상 자연스러운 인과·결과 연결로 옮겨, 절의 마무리감을 살렸습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게 / 에게
  alternatives_korean:
  - -에
  - -와 함께
  lexicon: HALOT
  rationale: מוֹשֶׁה의 발화 대상이므로 한국어에서는 여격 조사로 받는 것이 가장 직접적입니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들에게
  alternatives_korean:
  - 그의 자녀들에게
  - 그의 아들들께
  lexicon: HALOT
  rationale: 아론의 남성 복수 후계자들을 가리키므로 일반적인 ‘자녀’보다 ‘아들들’이 원문에 더 정확합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘 사람들 모두
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 히브리어의 문자적 형태인 ‘이스라엘의 아들들’을 살리되, 한국어에서는 굳어진 성경적 집단명으로 자연스럽고 포괄적으로 표현했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집단명 처리
  chosen_reading: ‘이스라엘의 모든 자손’으로 번역해, 언약 공동체 전체를 가리키는 포괄성을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 자손들’
  rationale: 도그마적 쟁점은 없지만, 레위기의 규범 전달이 아론과 그의 아들들만이 아니라 이스라엘 공동체 전체에 미친다는 점을 드러내기 위해 포괄 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
