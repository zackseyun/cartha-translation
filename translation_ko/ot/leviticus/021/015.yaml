id: LEV.21.15
reference: Leviticus 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
  footnotes:
  - marker: a
    text: Or 'defile his offspring' or 'dishonor his offspring.' The Hebrew verb carries the sense of making what should be holy into something profane.
    reason: lexical_alternative
  - marker: b
    text: That is, by violating the marriage restrictions in this context, he would bring profanation upon his line within the covenant community.
    reason: cultural_note
  - marker: c
    text: Or 'who makes him holy' or 'who consecrates him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 자손을 자기 백성 가운데에서[b] 속되게[a] 해서는 안 됩니다. 나는 그를 거룩하게 하시는 야훼이기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속되게 해서는 안 됩니다’는 히브리어 חלל의 제의적·성결 관련 의미를 반영합니다. ‘더럽히다’, ‘부정하게 하다’, 또는 ‘욕되게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 백성 가운데에서’는 그가 속한 백성, 곧 언약 공동체 안에서라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: ‘그를 거룩하게 하시는’은 ‘그를 성별하시는’ 또는 ‘그를 거룩하게 만드시는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  english_pob_choice: profane
  chosen_korean: 더럽혀서는 안 됩니다
  alternatives_korean:
  - 속되게 해서는 안 됩니다
  - 모독해서는 안 됩니다
  - 부정하게 해서는 안 됩니다
  lexicon: HALOT
  rationale: 제사장 성결 문맥에서 חלל의 핵심은 거룩한 것을 속되게 만드는 뜻이므로, 한국어에서는 ‘더럽히다’로 옮겨 성결 훼손의 강도를 살렸습니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 자기 자손
  alternatives_korean:
  - 그의 씨
  - 그의 후손
  lexicon: HALOT
  rationale: 직역의 ‘씨’는 현대 한국어에서 부자연스럽고, ‘자손’은 혈통·후손의 의미를 자연스럽게 보존합니다.
- source_word: בְּעַמָּיו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 그의 백성 가운데서
  - 자기 사람들 가운데
  lexicon: HALOT
  rationale: 문맥상 공동체적·언약적 범위를 드러내기 위해 ‘백성 가운데서’로 옮겼고, 소유격은 자연스러운 ‘자기’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술적 음역인 ‘야훼’를 유지했습니다.
- source_word: מְקַדְּשׁוֹ
  english_pob_choice: who sanctifies him
  chosen_korean: 그를 거룩하게 하는
  alternatives_korean:
  - 그를 성결하게 하는
  - 그를 성별하는
  - 그를 거룩하게 하시는
  lexicon: HALOT
  rationale: קדש의 성결 어휘를 한국어 성서 문맥에 맞게 ‘거룩하게 하다’로 살렸고, 현재분사적 서술을 자연스럽게 연결했습니다.
theological_decisions:
- issue: ‘자손을 더럽히다’의 의미 범위
  chosen_reading: 본문 표현을 그대로 유지하여, 금지된 혼인 질서로 인해 자기 혈통과 공동체 안의 거룩이 훼손되는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘자손을 부정하게 하다’로 더 의례적 의미를 강조할 수 있음
  - ‘후손을 욕되게 하다’로 사회적 수치를 강조할 수 있음
  rationale: 히브리어 동사는 단순한 사회적 망신보다 성결 질서의 훼손을 가리키므로, 본문이 말하는 긴장을 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 성결법의 언약적·제의적 긴장 보존
- issue: ‘그를 거룩하게 하는’의 주체
  chosen_reading: 마지막 절은 하나님이 제사장을 거룩하게 하시는 근거를 제시합니다.
  alternative_readings:
  - ‘그를 거룩하게 하시는 자’처럼 명사화할 수 있음
  - ‘그를 성별하시는’으로 더 제의적으로 옮길 수 있음
  rationale: 문맥상 야훼의 주권적 성결 행위를 강조하되, 현대 한국어에서 자연스러운 서술형으로 유지했습니다.
  doctrine_reference: 하나님의 거룩하게 하시는 주권
