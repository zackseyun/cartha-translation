  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
  footnotes:
  - marker: a
    text: 'Or ''blemish'': the Hebrew term refers to a physical defect that disqualifies from priestly approach in this context.'
    reason: lexical_alternative
  - marker: b
    text: '''Come near'' here refers to approaching for priestly service.'
    reason: cultural_note
  - marker: c
    text: The Hebrew term rendered 'one with a disfigured face' is rare and may refer more specifically to a damaged or malformed nose.
    reason: lexical_alternative
  - marker: d
    text: Or 'one with an extended/deformed limb'; the Hebrew term likely denotes a disproportionate body part.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 몸에 흠[a]이 있는 사람은 아무도 제사장 직무를 위해 가까이 나아올 수 없기 때문입니다[b]. 곧 눈먼 사람, 다리를 저는 사람, 얼굴이 변형된 사람[c], 또는 팔다리가 지나치게 긴 사람[d]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흠’은 여기서 제의적 접근의 자격을 제한하는 신체적 결함을 가리킵니다. 또는 ‘결함’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까이 나아오다’는 여기서 제사장 직무를 위해 성소에 접근하는 것을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 원어는 드문 표현입니다. 특히 코의 손상이나 변형을 가리킬 가능성도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘늘어진 팔다리’나 ‘비정상적으로 긴 팔다리를 가진 사람’으로 옮길 수 있습니다. 히브리어는 불균형한 신체 부위를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כָל אִישׁ אֲשֶׁר בּוֹ מוּם לֹא יִקְרָב
  english_pob_choice: For no man who has a defect shall come near
  chosen_korean: 몸에 흠이 있는 사람은 누구든지 가까이 나아오지 못합니다
  alternatives_korean:
  - 흠이 있는 남자는 아무도 나아오지 못합니다
  - 결함이 있는 사람은 아무도 접근하지 못합니다
  lexicon: HALOT
  rationale: מוּם의 핵심은 신체적 결함/흠이므로 ‘몸에 흠이 있는’으로 옮겨 제의적 자격 제한을 분명히 했습니다. ‘가까이 나아오다’는 כָּרַב의 제의적 접근 의미를 살리기 위해 유지했습니다.
- source_word: אִישׁ עִוֵּר
  english_pob_choice: a blind man
  chosen_korean: 눈먼 사람
  alternatives_korean:
  - 맹인
  - 눈먼 남자
  lexicon: HALOT
  rationale: 한국어에서 현대적이고 덜 낙인적인 표현을 택해 ‘눈먼 사람’으로 옮겼습니다. 문맥상 제의 자격의 예시이므로 성별 강조는 본문 전체의 남성 제사장 문맥에 맡겼습니다.
- source_word: פִסֵּחַ
  english_pob_choice: a lame man
  chosen_korean: 절름발이
  alternatives_korean:
  - 다리를 저는 사람
  - 불구자
  lexicon: HALOT
  rationale: ‘절름발이’는 전통적으로 쓰이지만 다소 구어적일 수 있어, 본문의 신체 상태를 간결하게 전달하는 표현으로 사용했습니다. 더 완곡한 대안은 의미가 흐려질 수 있습니다.
- source_word: חָרֻם
  english_pob_choice: one with a disfigured face
  chosen_korean: 얼굴이 변형된 사람
  alternatives_korean:
  - 얼굴이 일그러진 사람
  - 코가 손상된 사람
  lexicon: HALOT
  rationale: 희귀어로서 특정 신체 부위, 특히 코 손상까지 단정하기보다 English POB의 유보적 처리에 맞춰 얼굴의 변형으로 넓게 옮겼습니다.
- source_word: שָׂרֽוּעַ
  english_pob_choice: one with a limb too long
  chosen_korean: 팔다리가 지나치게 긴 사람
  alternatives_korean:
  - 길게 늘어진 팔다리를 가진 사람
  - 비정상적으로 긴 팔다리를 가진 사람
  lexicon: HALOT
  rationale: 본문의 불균형·과장된 신체 특징을 자연스러운 현대어로 전달하기 위해 ‘지나치게 긴’으로 옮겼습니다. English POB의 ‘too long’과 같은 유보성을 유지했습니다.
theological_decisions:
- issue: 제의적 접근 제한의 범위
  chosen_reading: 이 구절은 사람의 가치나 도덕성을 판단하는 말이 아니라, 제사장 직무에서 성소에 ‘가까이 나아감’에 대한 제의적 자격 제한으로 읽었습니다.
  alternative_readings:
  - 신체장애인에 대한 일반적 배제 규정으로 읽을 수 있음
  rationale: 히브리어 לֹא יִקְרָב는 문맥상 성소 접근과 제의 행위를 가리키므로, 본문 범위를 넘는 인격적 판단으로 확장하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1 and §3
