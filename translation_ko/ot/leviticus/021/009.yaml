  source_fidelity: 초안은 제사장의 딸, 아버지를 욕되게 함, 불로 태우는 형벌이라는 기본 의미를 전달합니다. 그러나 "스스로를 음란하게 하여"는 תֵחֵל לִזְנוֹת의 ‘매춘함으로 자신을 더럽히다/속되게 하다’라는 관계를 충분히 드러내지 못하며, ‘음란하게 하다’는 현대 한국어에서 어색하고 의미 범위도 불명확합니다.
  naturalness: ‘제사장의 딸이 매춘하여 자신을 더럽히면’과 ‘아버지를 욕되게 하는 것이므로’는 현대 표준어의 격식 있는 법조문 문맥에서 자연스럽습니다. 결론은 합쇼체 법적 규정으로 ‘태워야 합니다’로 옮겼습니다.
  terminology: זנה의 구체적 성적 의미는 ‘매춘하다’로, חלל의 첫 용례는 ‘자신을 더럽히다’로 반영했습니다. 두 번째 용례는 사람이 직접 목적어이므로 한국어 관용상 ‘아버지를 욕되게 하다’로 옮겼습니다. 이는 아버지의 제사장적 명예와 거룩함을 훼손한다는 본문의 뜻을 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘스스로를 음란하게 하여’의 의미 및 문체
    rationale: 원문의 זנה는 여기서 매춘/창녀 행위를 가리키며, תחל은 자신이 더럽혀지거나 속되게 됨을 나타냅니다. ‘음란하게 하다’는 이러한 관계를 명료하게 전달하지 못하고 한국어 문장으로도 부자연스럽습니다.
  - severity: low
    issue: 형벌 규정의 합쇼체 일관성
    rationale: ‘하리라’는 성서적 문체이지만 요청된 현대 격식체 합쇼체에는 ‘태워야 합니다’가 더 일관됩니다.
  revised_text: 제사장의 딸이 매춘하여 자신을 더럽히면, 그는 자기 아버지를 욕되게 하는 것이므로 불에 태워야 합니다.
