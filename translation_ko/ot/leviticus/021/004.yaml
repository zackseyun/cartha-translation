  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
  footnotes:
  - marker: a
    text: Or, 'He shall not defile himself as a chief man among his people, and so profane himself'; the Hebrew clause is difficult, and some understand it more generally as a prohibition against defiling himself in a socially prominent role rather than specifically as a husband.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자기 백성 가운데서 남편으로서 자신을 더럽혀 스스로를 속되게 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 자기 백성 가운데서 우두머리로서 자신을 더럽혀 스스로를 속되게 해서는 안 됩니다.’ 히브리어 구문은 어렵습니다. 어떤 이들은 이를 남편에 관한 규정으로 보지 않고, 사회적으로 높은 지위에 있는 사람이 자신을 더럽히는 일을 금하는 말로 더 일반적으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  english_pob_choice: defile himself
  chosen_korean: 자신을 더럽히지
  alternatives_korean:
  - 부정하게 되지
  - 더럽혀지지
  lexicon: HALOT
  rationale: 제사장 맥락의 시체 접촉으로 인한 의례적 부정을 살리기 위해, 한국어에서는 관용적으로도 통하는 ‘자신을 더럽히다’를 사용했습니다.
- source_word: בַּעַל
  english_pob_choice: husband
  chosen_korean: 남편으로서
  alternatives_korean:
  - 주인으로서
  - 우두머리로서
  - 지위 높은 사람으로서
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 관계적 의미인 ‘남편’을 본문에 두어, 근친 죽음 관련 정결 규정의 문맥을 한국어로도 드러냈습니다.
- source_word: בְּעַמָּיו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 자기 친족 가운데서
  - 자기 백성들 가운데서
  lexicon: HALOT
  rationale: 직역의 틀을 유지하되 한국어에서는 자연스럽게 ‘자기 백성 가운데서’로 옮겨, 공동체 소속의 뉘앙스를 살렸습니다.
- source_word: לְהֵחַלּוֹ
  english_pob_choice: and so profane himself
  chosen_korean: 그렇게 해서 자신을 속되게 해서는 안 됩니다
  alternatives_korean:
  - 그리하여 자신을 더럽혀서는 안 됩니다
  - 자신을 속되게 해서는 안 됩니다
  lexicon: HALOT
  rationale: חלל의 성소-거룩함 대비를 살리기 위해 단순한 ‘부정하다’보다 ‘속되게 하다’로 옮겼고, 결과를 나타내는 연결을 ‘그렇게 해서’로 표현했습니다.
theological_decisions:
- issue: בַּעַל בְּעַמָּיו의 난해한 구문 처리
  chosen_reading: 본문은 제사장이 자기 백성 가운데서 ‘남편’으로서 관련된 부정에 휘말리는 것을 금하는 뜻으로 옮겼습니다.
  alternative_readings:
  - 자기 백성 가운데서 중요한 사람으로서
  - 자기 백성 가운데서 자신을 더럽히지 말고
  rationale: 히브리어 구문은 압축되어 있어 해석 여지가 있지만, POB의 본문 채택인 ‘husband’가 문맥상 가장 직접적이며, 그 긴장과 난점을 숨기지 않기 위해 본문에 반영했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
