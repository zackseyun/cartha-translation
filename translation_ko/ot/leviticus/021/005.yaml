language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
  footnotes:
  - marker: a
    text: Or 'the corners of their beard.' The Hebrew term can denote an edge, side, or corner.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 머리에 대머리 패치를 만들지 말고, 수염의 가장자리를 깎지 말며, 자기 살에 상처를 내지 말아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수염의 모퉁이’. 히브리어 용어는 가장자리, 옆, 모퉁이를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹֽא יקרחה קָרְחָה בְּרֹאשָׁם
  english_pob_choice: They shall not make a bald patch on their head
  chosen_korean: 자기 머리에 대머리 패치를 만들지 말고
  alternatives_korean:
  - 자기 머리에 대머리를 만들지 말고
  - 머리에 대머리 자리를 만들지 말고
  - 머리를 삭발하지 말고
  lexicon: HALOT
  rationale: 동사-명사 결합이 단순한 자연적 대머리가 아니라 의도적으로 머리의 한 부분을 벗겨 내는 행위를 가리키므로, ‘대머리 패치’로 구체적 행동을 살리되 자연스러운 한국어로 옮겼습니다.
- source_word: פְאַת זְקָנָם
  english_pob_choice: the edge of their beard
  chosen_korean: 수염의 가장자리를
  alternatives_korean:
  - 수염의 끝을
  - 수염의 모퉁이를
  - 수염의 귀퉁이를
  lexicon: HALOT
  rationale: פאה는 edge/side/corner의 범위를 가지므로, 과도하게 규정하지 않으면서도 현대 한국어에서 명확한 ‘가장자리’를 택했습니다.
- source_word: יְגַלֵּחוּ
  english_pob_choice: shave off
  chosen_korean: 깎지 말며
  alternatives_korean:
  - 면도하지 말며
  - 밀지 말며
  - 깎아 없애지 말며
  lexicon: HALOT
  rationale: 피엘형의 제거 의미를 살리면서도 한국어에서 수염 손질 금지를 자연스럽게 나타내는 동사로 ‘깎다’를 사용했습니다.
- source_word: וּבִבְשָׂרָם לֹא יִשְׂרְטוּ שָׂרָטֶת
  english_pob_choice: nor make cuts in their flesh
  chosen_korean: 자기 살에 상처를 내지 말아야 합니다
  alternatives_korean:
  - 자기 살에 자르지 말아야 합니다
  - 자기 몸에 칼집을 내지 말아야 합니다
  - 자기 살에 절개를 내지 말아야 합니다
  lexicon: HALOT
  rationale: בשר의 문자적 ‘살’을 유지하면서, 반복적 어근이 가리키는 몸을 긋는 행위를 한국어로 가장 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 본절의 금지 내용 범위
  chosen_reading: 본문에 있는 구체적 신체 훼손 금지만 본문대로 옮기고, 다른 병행 본문에 나오는 ‘죽은 자를 위한 것’ 같은 설명은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 장례/애도 관습을 명시적으로 풀어써서 번역하기
  - 병행구의 설명을 본문에 합쳐 해석적으로 번역하기
  rationale: 이 절은 금지된 행위 자체를 진술할 뿐이므로, 주어진 본문을 넘는 설명을 본문에 삽입하지 않는 것이 source-direct 합니다.
  doctrine_reference: Translation philosophy §1, §3
