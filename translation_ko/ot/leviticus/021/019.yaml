lexical_decisions:
- source_word: אוֹ
  english_pob_choice: or
  chosen_korean: 또는
  alternatives_korean:
  - 혹은
  - 또
  lexicon: HALOT
  rationale: 이전 금지 조건을 이어 주는 단순한 선택 접속사이므로, 법조문체에 맞는 ‘또는’이 가장 자연스럽습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 남성
  lexicon: HALOT
  rationale: 문맥상 제사 직무 자격을 다루는 개별 남성을 가리키지만, 한국어에서는 뒤의 조건절을 살려 ‘사람입니다’로 옮기면 불필요한 성별 중복 없이 문장이 매끈합니다.
- source_word: שֶׁבֶר
  english_pob_choice: broken / fracture
  chosen_korean: 골절
  alternatives_korean:
  - 부러진
  - 파절
  - 부서진
  lexicon: HALOT
  rationale: 히브리어 명사는 ‘부러짐/골절’의 상태를 가리키므로, 신체 부위 앞의 형용사형보다 명사형 ‘골절’이 법적·의학적 의미를 더 분명하게 드러냅니다.
- source_word: רָגֶל
  english_pob_choice: foot
  chosen_korean: 발
  alternatives_korean:
  - 다리
  lexicon: HALOT
  rationale: 기본 의미는 ‘발’이므로, 영어 POB의 선택과 같이 구체적으로 ‘발’로 옮겼습니다.
- source_word: יָד
  english_pob_choice: hand
  chosen_korean: 손
  alternatives_korean:
  - 팔
  lexicon: HALOT
  rationale: 기본 의미는 ‘손’이며, 여기서는 확대 의미로 넓힐 문맥적 이유가 없어 직역적으로 ‘손’을 유지했습니다.
theological_decisions:
- issue: 부상 상태의 법적 자격 제한을 어떻게 제시할 것인가
  chosen_reading: “발에 골절이 있거나 손에 골절이 있는 사람”으로 옮겨, 제사장 자격 제한의 신체적 결격을 분명히 드러냈습니다.
  alternative_readings:
  - ‘발이 부러진 사람’
  - ‘발이나 손에 상처가 있는 사람’
  rationale: 본문은 단순한 일반 상처가 아니라 특정한 뼈의 골절을 말하므로, ‘골절’로 유지해야 법적 금지의 범위가 축소되지 않습니다.
  doctrine_reference: 레위기 21장의 제사장 성결 규정
