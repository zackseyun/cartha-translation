id: LEV.21.21
reference: Leviticus 21:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
  footnotes:
  - marker: a
    text: Or 'the offerings by fire of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Bread of his God'' is a priestly idiom for the food presented to God in sacrifice; alternatively, ''the food of his God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아론 제사장의 후손 가운데 흠이 있는 사람은 아무도 야훼의 화제물을 드리기 위해 가까이 나아가서는 안 됩니다. 그에게는 흠이 있습니다. 그는 자기 하나님의 빵[b]을 드리기 위해 가까이 나아가서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 문자적으로는 ‘자기 하나님의 빵’입니다. 제사장 문맥에서는 하나님께 바치는 제사 음식 전체를 가리키는 관용구로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  english_pob_choice: No man
  chosen_korean: 누구든지
  alternatives_korean:
  - 아무 사람도
  - 남자는
  lexicon: HALOT
  rationale: 부정문과 결합된 보편 금지를 한국어 자연문으로 옮기되, 문맥상 제사장 규정이므로 성중립적 일반 표현보다 ‘누구든지’가 법문체에 더 자연스럽습니다.
- source_word: מוּם
  english_pob_choice: defect
  chosen_korean: 흠
  alternatives_korean:
  - 결함
  - 결점
  - 신체적 결함
  lexicon: HALOT
  rationale: 제사장 자격을 제한하는 몸의 결함을 가리키는 용어이므로, 제의 문맥에서 널리 쓰이는 ‘흠’이 가장 직접적입니다.
- source_word: אִשֵּׁי יְהוָה
  english_pob_choice: the food offerings of Yahweh
  chosen_korean: 야훼께 드리는 화제물
  alternatives_korean:
  - 야훼께 드리는 불로 드리는 제물
  - 야훼의 화제물
  lexicon: HALOT
  rationale: אִשֵּׁי는 문자적으로는 ‘불로 드리는 것’이지만, 한국어에서는 제의 용어로 굳은 ‘화제물’이 원어의 기술적 의미를 가장 압축적으로 살립니다.
- source_word: לֶחֶם אֱלֹהָיו
  english_pob_choice: the bread of his God
  chosen_korean: 자기 하나님께 드리는 빵
  alternatives_korean:
  - 자기 하나님의 빵
  - 자기 하나님의 음식
  - 자기 하나님의 식물
  lexicon: HALOT
  rationale: 직역하면 ‘빵’이지만, 제사 음식 전체를 가리키는 성소 관용구이므로 한국어에서는 의미를 드러내는 ‘드리는 빵’으로 옮기고, 문자적 이미지도 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문의 언약명 사용을 드러냈습니다.
theological_decisions:
- issue: 제사장 신체 결함 규정의 표현 수위
  chosen_reading: ‘흠이 있는 사람은 누구든지… 가까이 나아가서는 안 됩니다’로 옮겨, 자격 제한의 법적 성격을 분명히 했습니다.
  alternative_readings:
  - ‘결함이 있는 사람은…’
  - ‘병신/장애가 있는 사람은…’
  rationale: 원문은 도덕적 평가가 아니라 제의적 자격 제한을 말하므로, 차별적 뉘앙스가 강한 표현은 피하고 법문체로 중립적이면서도 규정의 효력을 살렸습니다.
  doctrine_reference: Leviticus 21 제사장 성결 규례
