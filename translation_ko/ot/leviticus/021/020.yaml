  source_fidelity: ‘종기 같은 피부병’은 יַלֶּפֶת의 의미를 ‘종기’로 지나치게 특정합니다. 이 용어는 앞의 גָרָב와 구별되는 피부 질환을 가리키지만 현대 의학적 진단은 확정하기 어렵습니다. 또한 מְרֹחַ אָשֶׁךְ에는 ‘부서진’보다 ‘짓눌린’이 ‘crushed’ 및 히브리어의 손상 표현에 더 가깝습니다.
  naturalness: ‘피부 가려움증이 있는 사람’과 ‘딱지가 있는 사람’은 현대 표준 한국어에서 자연스럽고, 반복되는 목록의 형식도 유지합니다. 절이 앞 절의 ‘가까이 나아올 수 없다’에 문법적으로 이어지는 목록이므로 마지막 ‘사람입니다’는 그 문맥에서 유지할 수 있습니다.
  terminology: 등이 굽은 사람, 왜소한 사람, 눈에 결함이 있는 사람은 각각의 불확실성을 과도하게 의학화하지 않고 적절히 전달합니다. 피부 관련 두 항목은 서로 구별하되 ‘종기’라는 비근거적 특정은 피해야 합니다. 고환은 해부학적으로 명확한 적절한 용어입니다.
