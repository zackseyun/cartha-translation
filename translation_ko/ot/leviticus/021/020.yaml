id: LEV.21.20
reference: Leviticus 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹ גִבֵּ֣ן אוֹ דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּ/עֵינ֑/וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
  footnotes:
  - marker: a
    text: Or 'crookbacked' for hunchbacked.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'dwarfed' is uncertain; it may refer more generally to a stunted or wasted bodily form.
    reason: lexical_alternative
  - marker: c
    text: Or 'with a spot in his eye'; the exact eye defect is uncertain.
    reason: lexical_alternative
  - marker: d
    text: The two Hebrew terms here likely refer to different skin diseases; the precise modern diagnoses are uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 또는 등이 굽은 사람[a], 또는 왜소한 사람[b], 또는 눈에 결함이 있는 사람[c], 또는 가려움병이 있는 사람[d], 또는 종기 같은 피부병이 있는 사람[d], 또는 부서진 고환이 있는 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구부정한 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 용어는 확실하지 않으며, 더 일반적으로는 체격이 작거나 위축된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘눈에 흠이 있는 사람’으로 옮길 수 있으며, 정확한 눈의 이상은 불확실합니다.
    reason: lexical_alternative
  - marker: d
    text: 이 두 히브리어 용어는 서로 다른 피부 질환을 가리키는 것으로 보이지만, 정확한 현대 의학명은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  english_pob_choice: hunchbacked
  chosen_korean: 등이 굽은 사람
  alternatives_korean:
  - 혹등이 있는 사람
  - 꼽추인 사람
  lexicon: HALOT
  rationale: 허리나 등이 앞으로 굽은 신체적 특징을 현대 한국어로 분명하게 드러내면서도, 인신비하적 뉘앙스를 줄이기 위해 설명형으로 옮겼습니다.
- source_word: דַק
  english_pob_choice: dwarfed
  chosen_korean: 왜소한 사람
  alternatives_korean:
  - 난쟁이인 사람
  - 발육이 부진한 사람
  - 마른 사람
  lexicon: HALOT
  rationale: 이 단어는 난점이 있는 표현으로, 단순히 ‘마른’의 의미가 아니라 체격이 비정상적으로 작거나 위축된 상태를 가리킬 수 있으므로 ‘왜소한’이 가장 무난합니다.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  english_pob_choice: with a defect in his eye
  chosen_korean: 눈에 결함이 있는 사람
  alternatives_korean:
  - 눈에 흠이 있는 사람
  - 눈에 점이 있는 사람
  - 시력에 이상이 있는 사람
  lexicon: HALOT
  rationale: 정확한 안과적 진단은 불확실하므로, 영어 POB처럼 지나친 특정을 피하고 눈의 외형적 결함이라는 넓은 의미를 보존했습니다.
- source_word: גָרָב / יַלֶּפֶת
  english_pob_choice: with an itch / with scabs
  chosen_korean: 가려움병이 있는 사람 / 종기 같은 피부병이 있는 사람
  alternatives_korean:
  - 옴이 있는 사람 / 피부 발진이 있는 사람
  - 딱지가 있는 사람 / 습진이 있는 사람
  lexicon: HALOT
  rationale: 두 용어는 서로 다른 피부 질환을 가리키지만 현대 의학명으로 단정하기 어려워, 증상 중심으로 구분되게 번역했습니다.
- source_word: מְרֹחַ אָשֶׁךְ
  english_pob_choice: with crushed testicles
  chosen_korean: 부서진 고환이 있는 사람
  alternatives_korean:
  - 짓눌린 고환이 있는 사람
  - 손상된 고환이 있는 사람
  lexicon: HALOT
  rationale: 히브리어의 신체적 손상 의미를 직접 살리되, 문맥상 완곡어법보다 해부학적으로 분명한 표현을 택했습니다.
theological_decisions:
- issue: 제사장 자격에 관한 신체 결함 목록의 어조
  chosen_reading: 도덕적 판단을 덧붙이지 않고, 제의적 부적격 사유를 나열하는 물리적 기술로 처리했습니다.
  alternative_readings:
  - 질병이나 장애를 부정적으로 평가하는 표현으로 바꾸기
  - 완곡어법으로 순화하기
  rationale: 이 절은 죄책을 말하는 것이 아니라 제단 봉사 자격 제한을 다루므로, 본문의 제의적 범주를 흐리지 않도록 직접적 신체 언어를 유지했습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
