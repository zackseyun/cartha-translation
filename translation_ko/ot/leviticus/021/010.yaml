revisions:
- from: 그 형제들보다 큰 대제사장, 그 머리에 기름을 부어 부음받고 그 손에 옷을 입게 하는 일을 맡긴 자는 머리를 풀어헤치지 말며 옷을 찢지 말지니라.
  to: 형제들보다 높은 대제사장, 곧 그의 머리에 관유가 부어지고 그 옷들을 입도록 임직을 받은 자는[a] 머리를 풀어헤치지 말고[b] 옷들을 찢지 말아야 합니다.
