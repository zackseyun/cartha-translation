base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
  footnotes:
  - marker: a
    text: Hebrew 'whose hand has been filled,' an idiom for being ordained or installed into priestly service.
    reason: lexical_alternative
  - marker: b
    text: That is, he must not adopt customary mourning signs such as leaving his hair/head unkempt or tearing his garments.
    reason: cultural_note
translation:
  language: ko
  text: 형제들보다 높은 대제사장, 곧 그의 머리에 관유가 부어지고 그 옷들을 입도록 임직을 받은 자는[a] 머리를 풀어헤치지 말고[b] 옷들을 찢지 말아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘그의 손이 채워진’입니다. 이는 제사장 직무를 위해 임직되거나 임명되었다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이는 머리카락을 풀어헤치거나 옷을 찢는 것과 같은 관습적인 애도의 표지를 행하지 말라는 뜻입니다.
    reason: cultural_note
