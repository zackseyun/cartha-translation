  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
  footnotes:
  - marker: a
    text: Or 'blemish.' Hebrew mum refers to a physical defect that disqualifies from this priestly duty.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the bread of his God'; in this priestly context, 'bread' refers more broadly to sacrificial food offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론에게 말하여 이르십시오. 네 후손 가운데 대대로 몸에 흠이 있는 사람은 누구든지 가까이 나아가 자기 하나님께 드리는 음식을 바칠 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흠’. 히브리어 mum은 이 제사장 직무에서 제외되는 신체적 결손을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 하나님의 빵’입니다. 그러나 제의 문맥에서는 ‘빵’이 제물 음식 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן לֵאמֹר
  english_pob_choice: Speak to Aaron, saying
  chosen_korean: 아론에게 말하여 이르십시오
  alternatives_korean:
  - 아론에게 말씀하여 이르십시오
  - 아론에게 말하라
  lexicon: HALOT
  rationale: 히브리어의 직접 명령과 말하기 도입 공식을 한국어 법률체로 자연스럽게 옮기되, 하나님께서 모세에게 주시는 명령의 공적 어조를 유지했습니다.
- source_word: מִזַּרְעֲךָ לְדֹרֹתָם
  english_pob_choice: from your offspring throughout their generations
  chosen_korean: 네 후손 가운데 대대로
  alternatives_korean:
  - 네 자손 가운데 세세대로
  - 네 씨에서 대대로
  lexicon: HALOT
  rationale: 아론에게 향한 혈통적·세대적 지속성을 드러내기 위해 ‘후손’과 ‘대대로’를 사용했습니다. '씨'는 직역성이 있지만 현대 한국어에서 부자연스럽습니다.
- source_word: מוּם
  english_pob_choice: a defect
  chosen_korean: 몸에 흠이 있는
  alternatives_korean:
  - 결함이 있는
  - 흠이 있는
  lexicon: HALOT
  rationale: 제의적 자격 제한을 뜻하는 물리적 결손을 반영하려고 '몸에 흠'으로 옮겼습니다. '결함'도 가능하지만 사람을 더 추상적으로 들리게 할 수 있습니다.
- source_word: לֹא יִקְרַב לְהַקְרִיב
  english_pob_choice: shall not come near to offer
  chosen_korean: 가까이 나아가 … 바칠 수 없습니다
  alternatives_korean:
  - 가까이 나아가 … 드릴 수 없습니다
  - 접근하여 … 드릴 수 없습니다
  lexicon: HALOT
  rationale: קרב의 제의적 '가까이 나아감'을 살리면서, 제물을 하나님께 '바치다'로 자연스럽게 표현했습니다. 여기서는 단순 접근 금지보다 제의 수행 금지의 뉘앙스가 중요합니다.
- source_word: לֶחֶם אֱלֹהָיו
  english_pob_choice: the food of his God
  chosen_korean: 자기 하나님께 드리는 음식
  alternatives_korean:
  - 하나님의 빵
  - 자기 하나님의 빵
  lexicon: HALOT
  rationale: 히브리어의 문자적 '빵'을 그대로 두면 현대 한국어에서 오해가 생기므로, 제의적 제물 전체를 가리키는 뜻에 맞게 '음식'으로 풀었습니다.
theological_decisions:
- issue: 제사장의 신체적 흠과 접근 제한의 의미
  chosen_reading: 이 구절을 특정 제사 직무에 대한 제의적 자격 규정으로 번역하고, 인격적 가치나 언약 공동체에서의 배제를 뜻하는 것으로 확대하지 않았습니다.
  alternative_readings:
  - ‘흠’ 대신 ‘결함’으로 중립화하기
  - 직무 제한을 약하게 표현하기
  rationale: 본문은 성소 봉사에 대한 접근 가능 여부를 다루며, 도덕적 비난이나 인간의 존엄성 평가를 말하지 않습니다. 그래서 제의적 제한의 의미를 그대로 유지했습니다.
  doctrine_reference: 본문의 평이한 의미를 보존하고, 본문이 말하지 않는 신학적 확장을 들여오지 말 것
