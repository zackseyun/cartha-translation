- from: 그러나 그는 휘장 안으로 들어가거나 제단에 가까이 나아가서는 안 됩니다. 그에게는 결함이 있기 때문이니, 그가 내 성소들을 더럽히지 않게 하려는 것입니다. 나는 그것들을 거룩하게 하는 야훼입니다.[a][b][c]
  to: 그러나 그는 휘장으로 나아가거나 제단에 가까이 가서는 안 됩니다. 그에게 결함이 있기 때문이니, 그가 내 성소들을 더럽히지 않게 하려는 것입니다. 나는 거룩하게 하는 야훼입니다.[a][b][c]
  rationale: ‘휘장 안으로’를 ‘휘장으로 나아가거나’로 고쳐 히브리어 전치사 אֶל의 범위를 보존했습니다. 마지막 절은 한국어에서 목적어를 생략하여 מְקַדְּשָׁם의 논쟁적인 지시 대상을 확정하지 않았고, 그 문제를 각주에 중립적으로 밝혔습니다. 나머지 핵심 제의 용어와 야훼라는 신명 표기는 유지했습니다.
  reviewer_model: gpt-5.6-terra
