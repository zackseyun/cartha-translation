id: LEV.21.23
reference: Leviticus 21:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
  footnotes:
  - marker: a
    text: Or 'the curtain.' The Hebrew term refers to the sanctuary veil.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has a blemish in him.' The Hebrew speaks of a physical defect that disqualifies from this priestly approach, not a moral fault.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'my sanctuaries' (plural); some translations smooth this to 'my sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 휘장 안으로 들어가거나 제단에 가까이 나아가서는 안 됩니다. 그에게는 결함이 있기 때문이니, 그가 내 성소들을 더럽히지 않게 하려는 것입니다. 나는 그것들을 거룩하게 하는 야훼입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘휘장’은 성소의 내부 가리개를 가리키는 전통적 한국어 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘결함’은 도덕적 흠이 아니라 제의적 자격을 제한하는 신체적 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 복수형 ‘내 성소들’을 사용합니다. 일부 번역은 이를 단수 ‘내 성소’로 완화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 오직
  lexicon: HALOT
  rationale: 앞절의 허용에 대한 제한을 자연스럽게 여는 역접으로 옮겼습니다. '오직'은 다소 모호하고, '그러나'가 현대 한국어에서 더 명확합니다.
- source_word: הַפָּרֹכֶת
  english_pob_choice: the veil
  chosen_korean: 휘장
  alternatives_korean:
  - 베일
  - 막
  lexicon: HALOT
  rationale: 성소 내부의 분리막을 가리키는 제의적 용어로, 한국어 성경에서 널리 통용되는 '휘장'이 가장 정확합니다.
- source_word: מ֣וּם בּוֹ
  english_pob_choice: there is a defect in him
  chosen_korean: 그에게는 결함이 있기 때문이니
  alternatives_korean:
  - 그에게는 흠이 있기 때문이니
  - 그는 흠이 있기 때문이니
  lexicon: HALOT
  rationale: 이 문맥의 מוּם은 도덕적 흠이 아니라 제의적 자격을 제한하는 신체적 결함이므로 '결함'으로 옮겼습니다.
- source_word: מִקְדָּשַׁי
  english_pob_choice: my sanctuaries
  chosen_korean: 내 성소들
  alternatives_korean:
  - 내 성소
  - 내 거룩한 처소들
  lexicon: HALOT
  rationale: 히브리어 복수를 살려 '성소들'로 옮겼습니다. 단수로 완화하면 POB가 보존한 형태적 긴장이 사라집니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה를 전통적 대체어가 아니라 음역인 '야훼'로 옮겨 본문의 고유명칭을 보존했습니다.
- source_word: מְקַדְּשָׁם
  english_pob_choice: who sanctifies them
  chosen_korean: 그것들을 거룩하게 하는
  alternatives_korean:
  - 그것들을 성별하는
  - 그들을 거룩하게 하는
  lexicon: HALOT
  rationale: 가장 가까운 선행사인 '내 성소들'에 맞추어 복수 대명사를 살렸고, 거룩/성결의 제의적 어휘를 유지했습니다.
theological_decisions:
- issue: מְקַדְּשָׁם의 지시 대상
  chosen_reading: '''그것들''은 가장 가까운 선행사인 ''내 성소들''을 가리킵니다.'
  alternative_readings:
  - 더 넓게는 제사장들 또는 백성을 가리킬 수 있습니다.
  rationale: 히브리어 문법상 가장 가까운 복수 선행사가 자연스럽고, 성소 출입 제한이라는 즉각적 문맥과도 잘 맞습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 제의적 결함의 성격
  chosen_reading: 결함은 도덕적 दोष가 아니라 제단 접근을 제한하는 신체적/제의적 자격 문제로 이해했습니다.
  alternative_readings:
  - 흠으로 옮겨도 가능합니다.
  - 부정으로 해석할 수 있습니다.
  rationale: 본문은 사람의 가치 판단이 아니라 거룩한 공간에 대한 접근 규정을 말하므로, 오해를 줄이는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
