id: LEV.21.12
reference: Leviticus 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'the crown of the anointing oil of his God is upon him.' The Hebrew term can mean 'crown' or 'consecration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성소에서 나가서는 안 되며, 자기 하나님 성소를 더럽혀서도 안 됩니다. 이는 자기 하나님께서 부어 주신 기름의 구별됨이 그 위에 있기 때문입니다. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘자기 하나님 기름부음의 관이 그 위에 있다.’ 히브리어 נֵזֶר는 ‘관’이나 ‘구별/봉헌’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ / לֹא יֵצֵא
  english_pob_choice: from the sanctuary / he shall not go out
  chosen_korean: 성소에서 나가서는 안 됩니다
  alternatives_korean:
  - 성막에서 나가서는 안 됩니다
  - 성소 밖으로 나가서는 안 됩니다
  - 성소를 떠나서는 안 됩니다
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 예배 공간을 가리키므로 ‘성소’가 가장 직접적이며, לֹא יֵצֵא의 금지형은 현대 한국어 법령체로 ‘나가서는 안 됩니다’가 자연스럽습니다.
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  english_pob_choice: nor shall he profane the sanctuary of his God
  chosen_korean: 자기 하나님 성소를 더럽혀서도 안 됩니다
  alternatives_korean:
  - 자기 하나님 성소를 욕되게 해서도 안 됩니다
  - 자기 하나님 성소를 속되게 해서도 안 됩니다
  lexicon: HALOT
  rationale: חלל의 제의적 의미를 한국어의 ‘더럽히다’로 옮기면 거룩함과 모독의 대비가 분명하게 살아납니다.
- source_word: נֵזֶר שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  english_pob_choice: the consecration of the anointing oil of his God
  chosen_korean: 자기 하나님께서 부어 주신 기름의 구별됨
  alternatives_korean:
  - 자기 하나님의 기름부음의 성별됨
  - 자기 하나님께서 부으신 기름의 성별
  lexicon: HALOT
  rationale: נֵזֶר는 이 문맥에서 물리적 ‘관’보다 기름으로 표시된 성별된 상태를 가리키므로, ‘구별됨’으로 옮겨 제의적 상태를 분명히 했습니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I am Yahweh
  chosen_korean: 나는 야훼입니다
  alternatives_korean:
  - 나는 여호와입니다
  - 나는 주입니다
  lexicon: HALOT
  rationale: 본문의 언약 신명은 프로젝트 기본값에 따라 ‘야훼’로 음역하고, 선언 공식은 한국어의 직접적 자기계시 표현으로 처리했습니다.
theological_decisions:
- issue: נֵזֶר의 의미를 ‘관’이 아니라 상태 표지로 이해할지 여부
  chosen_reading: 기름부음이 만들어 내는 성별된 지위로 이해하여 ‘구별됨’으로 번역했습니다.
  alternative_readings:
  - 관
  - 면류관
  - 봉헌
  rationale: 이 절은 제사장의 이동 제한 근거를 설명하므로, 핵심은 장식물이 아니라 거룩하게 구별된 신분입니다. 따라서 독자가 제의적 이유를 바로 이해하도록 상태 중심 표현을 택했습니다.
  doctrine_reference: 제사장 성결 규례(레위기 21장)
