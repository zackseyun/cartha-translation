  verdict: revise
  source_fidelity: 수정안은 מִקְדָּשׁ의 반복, חלל의 제의적 ‘속되게 하다’, 그리고 기름부음 기름과 관련된 נֵזֶר의 성별 상태를 보존합니다. 초안의 ‘자기 하나님 성소’는 소유격 조사가 빠졌고, ‘그 위에’는 성별의 대상이 제사장임을 불분명하게 했습니다. 수정안은 עָלָיו를 ‘그에게 있기’로 분명히 합니다.
  naturalness: ‘그의 하나님의 성소’와 ‘속되게 하다’는 현대의 격식 있는 성경 문체에서 자연스럽습니다. ‘기름부음용 기름으로 말미암은 성별’은 다소 제의적인 표현이나, 원문의 압축된 구성 관계를 현대 한국어로 명료하게 드러냅니다.
  terminology: יַחַלֵּל은 단순한 물리적 오염보다 거룩한 것을 속되게 하는 행위를 가리키므로 ‘더럽히다’보다 ‘속되게 하다’가 적합합니다. נֵזֶר는 본문에서는 ‘성별’로 번역하되, ‘관’이라는 가능한 문자적 독법은 각주에 보존합니다. 신명은 초안 및 프로젝트 용례를 따라 ‘야훼’로 유지합니다.
  issues:
