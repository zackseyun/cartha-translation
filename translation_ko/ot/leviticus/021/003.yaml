translation:
  language: ko
  text: 또 그에게 가까운 처녀 누이, 곧 아직 남자에게 속한 적이 없는 누이를 위해서는, 그는 부정해져도 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남편이 없는 자’ 또는 ‘남자와 관계한 적이 없는 자’로 옮길 수 있습니다. 히브리어 표현은 관용적이며, 남자와의 결합을 아직 맺지 않은 누이를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲחֹתוֹ
  english_pob_choice: and for his sister
  chosen_korean: 그리고 그의 누이를 위해서는
