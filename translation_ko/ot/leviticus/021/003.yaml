  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
  footnotes:
  - marker: a
    text: Or, 'who has had no husband' or 'who has not been with a man.' The Hebrew expression is idiomatic and refers to a sister who has not entered union with a man.
