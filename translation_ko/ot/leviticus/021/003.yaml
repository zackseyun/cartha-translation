- source_word: יִטַּמָּא
  english_pob_choice: he may make himself unclean
  chosen_korean: 그가 자신을 부정하게 해도 됩니다
  alternatives_korean:
  - 그가 자신을 더럽혀도 됩니다
  - 그가 부정해져도 됩니다
  - 그가 스스로 부정하게 되어도 됩니다
  lexicon: HALOT
  rationale: 제의적 정결 상태를 가리키는 말이므로, 도덕적 타락이 아니라 의식적 부정함을 나타내는 ‘부정하게 하다’를 사용했습니다. 허용을 나타내는 문맥에 맞춰 ‘해도 됩니다’로 처리했습니다.
