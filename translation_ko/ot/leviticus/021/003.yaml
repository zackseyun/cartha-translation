  rationale: 히브리어는 친족적 근접성을 나타내므로, 한국어에서는 수식어로 압축해 ‘가까운’으로 옮기되 문맥상 친족 관계가 드러나게 했습니다.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ לָהּ
  english_pob_choice: who has not belonged to a man
  chosen_korean: 아직 남자에게 속한 적이 없는 자
  alternatives_korean:
  - 아직 남자와 관계한 적이 없는 자
  - 아직 남편이 없는 자
