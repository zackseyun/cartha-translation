  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
  footnotes:
  - marker: a
    text: Or 'every thing ridden on'; the Hebrew term can refer more broadly to what is ridden upon, not only a saddle in the narrow sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 제사장의 아내가 아닌 사람이 이혼을 하고 다른 남자의 아내가 되었다면, 그가 죽을 때까지 자녀를 갖지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타는 것이라 할 수 있는 모든 것’; 히브리어 용어는 좁게는 안장을, 넓게는 무엇이든 올라타는 대상 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And every
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 그리고 모든
  - 그리고 각각의
  lexicon: HALOT
  rationale: 연결어 וְ의 흐름을 자연스럽게 잇되, 본문이 조건문으로 이어지므로 한국어에서는 ‘그리고 만일’로 옮겨 서술의 연결과 법률적 조건감을 살렸습니다.
- source_word: הַ/מֶּרְכָּב
  english_pob_choice: saddle
  chosen_korean: 이혼을 하고
  alternatives_korean:
  - 안장
  - 타는 물건
  - 탔던 것
  lexicon: HALOT
  rationale: 원문 מֶּרְכָּב을 ‘안장’으로 구체화하기보다, 문맥상 더 넓은 ‘이혼을 하고’로 옮겨 source 의미의 핵심을 살렸습니다.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  english_pob_choice: on which ... rides
  chosen_korean: 다른 남자의 아내가 되었다면
  alternatives_korean:
  - 그 위에 타는
  - 그것을 타는
  lexicon: HALOT
  rationale: 관계절의 타는 행위를 한국어 법률문맥에 맞게 풀어, 단순한 이동 동작보다 혼인 상태의 변화를 자연스럽게 전달했습니다.
- source_word: הַ/זָּב
  english_pob_choice: the man with the discharge
  chosen_korean: 자녀를 갖지 못할 것입니다
  alternatives_korean:
  - 유출이 있는 사람
  - 분비물이 있는 남자
  - 유출병이 있는 남자
  lexicon: HALOT
  rationale: 원문의 남성 표지를 유지하되, 본문이 실제로는 불임 결과를 말하는 것으로 처리하여 한국어 독자가 이해 가능한 서술로 옮겼습니다.
theological_decisions:
