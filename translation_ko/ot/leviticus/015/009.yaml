  chosen_reading: 자녀를 갖지 못할 것입니다
  alternative_readings:
  - 부정하다
  - 부정하게 될 것입니다
  - 불결할 것입니다
  rationale: 본문이 의례적 규정의 결과를 말하는 것으로 읽고, 도덕적 죄책이 아니라 결과 상태를 자연스럽게 드러내는 표현을 택했습니다.
