  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
  footnotes:
  - marker: a
    text: Or 'the menstruating woman'; the Hebrew term for 'the woman who is sick' refers here to a woman in her menstrual state.
    reason: lexical_alternative
  - marker: b
    text: '''Unclean'' in this verse refers to ritual impurity under Levitical law, not to moral uncleanness.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 월경 부정결에 있는 여인과, 분비가 있는 자—남자든 여자든—그리고 부정한 여자와 함께 눕는 사람에게도 해당됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 월경 상태의 여인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이곳의 ‘부정한’은 도덕적 의미가 아니라 레위기 법에서의 의례적 부정결을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַדָּוָה
  english_pob_choice: the woman who is sick
  chosen_korean: 부정결에 있는 여인
  alternatives_korean:
  - 월경 중인 여인
  - 아픈 여인
  lexicon: HALOT
  rationale: 영어 POB의 ‘the woman who is sick’가 가리키는 것은 실제 질병이 아니라 월경 상태의 여인을 뜻하므로, 한국어에서는 ‘부정결에 있는 여인’으로 풀어 원문의 상태 의미를 살렸습니다.
- source_word: בְּנִדָּתָהּ
  english_pob_choice: in her menstrual impurity
  chosen_korean: 월경 부정결에
  alternatives_korean:
  - 월경의 부정함에
  - 월경 중의 부정결에
  lexicon: HALOT
  rationale: נִדָּה는 레위기 정결 문맥에서 의식적·제의적 부정결을 가리키므로, ‘월경 부정결’로 옮겨 정결법의 범주를 분명히 했습니다.
- source_word: הַזָּב אֶת זוֹבוֹ
  english_pob_choice: the one who has a discharge
  chosen_korean: 분비가 있는 자
  alternatives_korean:
  - 유출이 있는 자
  - 몸에서 흐름이 있는 자
  lexicon: HALOT
  rationale: 문법상 남성형이지만 뒤의 ‘남자든 여자든’이 범주를 확장하므로, 성별을 미리 제한하지 않는 ‘분비가 있는 자’가 원문 구조를 잘 반영합니다.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  english_pob_choice: whether male or female
  chosen_korean: 남자든 여자든
  alternatives_korean:
  - 남자와 여자 모두에게
  - 남성과 여성에게
  lexicon: HALOT
  rationale: 앞 항목의 적용 범위를 분배적으로 넓히는 표현이므로, 한국어에서는 자연스럽게 ‘남자든 여자든’으로 옮겼습니다.
- source_word: וּלְאִישׁ אֲשֶׁר יִשְׁכַּב עִם טְמֵאָה
  english_pob_choice: and for a man who lies with an unclean woman
  chosen_korean: 그리고 부정한 여자와 함께 눕는 사람에게도 해당됩니다
  alternatives_korean:
  - 그리고 부정한 여자와 동침하는 남자에게도 해당됩니다
  - 그리고 부정한 여자와 관계하는 사람에게도 해당됩니다
  lexicon: HALOT
  rationale: ‘누우다’의 성적 완곡어법을 살리면서, 원문의 일반 규정을 한국어 문장으로 자연스럽게 전달하기 위해 ‘함께 눕는 사람’으로 옮겼습니다.
theological_decisions:
- issue: ריטואל 부정결 표현
  chosen_reading: ‘부정한/부정결’은 도덕적 비난이 아니라 레위기 의례적 상태로 읽히도록 유지했습니다.
  alternative_readings:
  - 더러운
  - 죄 있는
  - 불결한
  rationale: 본문은 도덕적 오염이 아니라 제의적 정결 규정을 다루므로, 한국어에서도 그 범주가 흐려지지 않게 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
