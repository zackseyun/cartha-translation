revisions:
- from: 그리고 월경 부정결에 있는 여인과, 분비가 있는 자—남자든 여자든—그리고 부정한 여자와 함께 눕는 사람에게도 해당됩니다.[a][b]
  to: 이는 월경으로 앓는 여인[a]과 그의 월경 부정결에 관한 것, 유출이 있는 사람의 유출에 관한 것—남자와 여자 모두의 경우—, 그리고 부정한[b] 여자와 함께 눕는 남자에 관한 규례입니다.
  rationale: 원문의 세 개의 ‘…에 관한’ 범주를 한국어의 완결된 요약 문장으로 재구성했습니다. הַדָּוָה와 בְּנִדָּתָהּ의 구별을 보존하고, 유출 규정이 남녀 모두에게 적용됨을 유지했으며, 마지막 항목의 남성 지시를 정확히 반영했습니다. 의례적 부정결을 도덕적 평가로 오해하지 않도록 각주를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:20Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 הַדָּוָה의 ‘앓는/고통을 겪는’ 뉘앙스를 ‘부정결에 있는’으로 흡수하여 바로 뒤의 בְּנִדָּתָהּ와 사실상 중복시켰습니다. 또한 원문의 열거형 요약문을 ‘해당됩니다’로 끝내어 무엇에 해당하는지 불완전합니다. הַזָּב 및 뒤따르는 남녀 범주, 그리고 성관계를 가리키는 ‘함께 눕다’는 유지하되, 마지막 대상은 남성 단수이므로 ‘남자’로 옮기는 것이 정확합니다.
  naturalness: ‘이는 …에 관한 규례입니다’라는 종결을 보충하면 레위기 규정의 요약·표제 문맥에 맞고 현대 표준 한국어 합쇼체로도 자연스럽습니다. ‘월경으로 앓는’은 다소 낯설 수 있으나, 원문의 의도적인 이중 표현을 보존하며 각주로 문맥상 대안을 밝혀 안전하게 처리할 수 있습니다.
  terminology: נִדָּה는 ‘월경 부정결’로, טְמֵאָה는 ‘부정한’으로 유지하되 의례적 의미를 각주에서 분명히 합니다. זוֹב은 일반적인 ‘분비’보다 레위기 정결법의 전문 범주를 더 잘 드러내는 ‘유출’로 옮깁니다.
  issues:
  - severity: medium
    issue: הַדָּוָה의 의미가 누락되고 בְּנִדָּתָהּ와 중복됩니다.
    rationale: ‘부정결에 있는 여인’은 뒤의 ‘월경 부정결에’와 같은 내용을 반복할 뿐, ‘앓는/고통을 겪는 여인’이라는 첫 표현의 별도 어휘를 반영하지 못합니다.
  - severity: high
    issue: ‘해당됩니다’의 지시 대상이 문장 안에 제시되지 않아 열거문이 불완전합니다.
    rationale: 히브리어는 앞 절들에 이어지는 요약적 표제이지만, 한국어 독립 문장에서는 ‘규례입니다’와 같은 보완이 필요합니다. 이는 의미를 추가하는 것이 아니라 생략된 문장 기능을 자연스럽게 드러냅니다.
