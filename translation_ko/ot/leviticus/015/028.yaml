id: LEV.15.28
reference: Leviticus 15:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
  footnotes:
  - marker: a
    text: Or 'she becomes clean from her discharge ... after that she shall be purified.' The Hebrew uses the same root for both clauses, first for the cessation of the discharge and then for the resulting ritual status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀가 그 흐름에서 깨끗해지면, 자기 자신을 위해 칠 일 동안 헤아리고, 그 뒤에는 깨끗해질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 어근 טהר를 두 번 사용하여, 첫째는 유출이 그치는 것, 둘째는 그 결과로 도달하는 의례적 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …하면
  alternatives_korean:
  - 그리고 만일 …하면
  - 만일 …하면
  lexicon: HALOT
  rationale: 앞 절의 경우와 대비되는 조건을 한국어에서는 ‘그러나’로 살리고, 조건 표지는 ‘-하면’으로 자연스럽게 옮겼습니다.
- source_word: טָהֲרָה מִזּוֹבָהּ
  english_pob_choice: she is cleansed from her discharge
  chosen_korean: 그 흐름에서 깨끗해지면
  alternatives_korean:
  - 그 분비물에서 정결해지면
  - 그 유출에서 깨끗해지면
  - 그 유출이 그치면
  lexicon: HALOT
  rationale: טהר의 첫 번째 용례는 ‘출혈/유출 상태에서 벗어남’이라는 정결 상태의 회복이므로, 도덕적 의미가 아닌 의례적 상태를 드러내는 ‘깨끗해지다’를 택했습니다. מִן은 분리를 나타내는 ‘에서’로 옮겼습니다.
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  english_pob_choice: then she shall count seven days for herself
  chosen_korean: 자기 자신을 위해 칠 일 동안 헤아리고
  alternatives_korean:
  - 그녀는 칠 일을 셀 것이고
  - 자기 몫으로 칠 일을 헤아리고
  - 칠 일 동안 자신을 위하여 세고
  lexicon: HALOT
  rationale: 히브리어의 계산 동작은 단순한 ‘기다림’이 아니라 기간을 ‘헤아리는’ 절차이므로 이를 반영했습니다. לָּהּ는 그녀의 정결 회복을 위한 기간이라는 점을 살려 ‘자기 자신을 위해’로 표현했습니다.
- source_word: וְאַחַר תִּטְהָר
  english_pob_choice: and after that she shall be clean
  chosen_korean: 그 뒤에는 깨끗해질 것입니다
  alternatives_korean:
  - 그 후에는 정결해질 것입니다
  - 그 뒤에 그녀는 깨끗할 것입니다
  - 그 후 그녀는 깨끗해집니다
  lexicon: HALOT
  rationale: 같은 어근 טהר가 두 번째 절에서는 결과적 상태를 가리키므로, 첫 절과 구분되도록 ‘깨끗해질 것입니다’로 옮겼습니다. 이렇게 하면 ‘유출에서 벗어남’과 ‘의례적 깨끗함의 도달’을 한국어로 구별할 수 있습니다.
theological_decisions:
- issue: 정결 언어의 범위
  chosen_reading: טהר는 도덕적 순결이 아니라 의례적 정결 상태를 뜻하므로 ‘깨끗하다/깨끗해지다’로 옮겼습니다.
  alternative_readings:
  - 정결하다/정결해지다
  - 순수하다/순수해지다
  rationale: 레위기 15장은 죄책이 아니라 몸의 유출에 따른 제의적 상태를 다루므로, 독자가 윤리적 오염으로 오해하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문의 제의적 의미를 보존하고, 본문이 말하지 않는 도덕적 판단을 덧씌우지 않음.'
