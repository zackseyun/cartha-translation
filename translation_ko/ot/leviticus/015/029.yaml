  naturalness: ‘회막 어귀에 있는 제사장에게 그것들을 가져가야 합니다’는 한국어에서 대상과 장소의 관계를 자연스럽게 드러내며, 현대 합쇼체 법규·의례 지시 문맥에 적합합니다. ‘취하여’와 ‘가져가야 합니다’를 구별하여 불필요한 동사 반복을 피했습니다.
