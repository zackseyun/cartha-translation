theological_decisions:
- issue: 제사장에게로 가는 동작과 회막 문이라는 이중 지시
  chosen_reading: 문법상 두 개의 전치사구를 모두 살려, 제사장에게 가져가되 그 장소가 회막 문임을 드러냈습니다.
  alternative_readings:
  - 회막 문에서 제사장에게 가져가야 합니다
