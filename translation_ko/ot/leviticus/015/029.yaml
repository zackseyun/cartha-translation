  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'to the entrance of the tent of meeting.' The Hebrew repeats 'to' before 'the entrance,' which may be rendered more formally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여덟째 날에 그녀는 자신을 위하여 산비둘기 두 마리나 집비둘기 새끼 두 마리를 취하여, 회막 어귀에 있는 제사장에게 그것들을 가져가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회막 어귀로’. 히브리어는 제사장과 회막 어귀 앞에 각각 ‘~에게/~로’를 나타내는 전치사를 사용합니다.
    reason: lexical_alternative
