base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'to the entrance of the tent of meeting.' The Hebrew repeats 'to' before 'the entrance,' which may be rendered more formally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여덟째 날에 그녀는 산비둘기 둘 또는 어린 집비둘기 둘을[a] 가져다가 회막 문에서 제사장에게로 가져가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회막 문으로’. 히브리어는 ‘~에게’ 앞에 ‘~로’를 한 번 더 반복하므로, 더 형식적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  english_pob_choice: And on the eighth day
  chosen_korean: 그리고 여덟째 날에
  alternatives_korean:
  - 여덟째 날에
  - 그리고 여덟째 날
  lexicon: WLC
  rationale: 앞의 ו를 반영해 접속어를 살리되, 한국어 법령체에서는 자연스러운 시간 부사구로 풀었습니다.
- source_word: שְׁתֵּי תֹרִים / שְׁנֵי בְּנֵי יוֹנָה
  english_pob_choice: two turtledoves / two young pigeons
  chosen_korean: 산비둘기 둘 또는 어린 집비둘기 둘
  alternatives_korean:
  - 두 마리 산비둘기 또는 두 마리 어린 집비둘기
  - 산비둘기 두 마리 또는 어린 비둘기 두 마리
  lexicon: HALOT
  rationale: 제사 희생 동물의 통상적 한국어를 따르되, 원문의 둘/둘 구조와 대조를 보존했습니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 문에서
  alternatives_korean:
  - 회막의 문에서
  - 회막 입구에서
  lexicon: WLC
  rationale: פֶּתַח은 ‘문/입구’로 옮길 수 있으나, 제의 문맥에서 ‘회막 문’이 가장 직접적이고 간결합니다.
theological_decisions:
- issue: 제사장에게로 가는 동작과 회막 문이라는 이중 지시
  chosen_reading: 문법상 두 개의 전치사구를 모두 살려, 제사장에게 가져가되 그 장소가 회막 문임을 드러냈습니다.
  alternative_readings:
  - 회막 문에서 제사장에게 가져가야 합니다
  - 제사장에게 회막 문으로 가져가야 합니다
  rationale: 히브리어의 אֶל가 연속으로 나와 대상과 장소를 함께 표시하므로, 둘 다 흐리지 않도록 했습니다.
  doctrine_reference: 제의 절차의 구체성 보존
