revisions:
- from: 그제서야 제사장은 그 한 마리를 죄 제물로 드리며 다른 한 마리는 번제물로 드리되, 제사장은 야훼 앞에서 그 여자의 불결한 유출로 말미암아 그 여자를 위하여 속죄할지니라.
  to: 그러면 제사장은 그중 하나를 속죄제물로 드리고, 다른 하나를 번제물로 드려야 합니다. 제사장은 야훼 앞에서 그녀의 부정한 유출 때문에 그녀를 위하여 속죄해야 합니다.
  rationale: Removed the unwarranted emphasis of “그제서야,” avoided supplying the classifier “마리,” and changed the archaizing -지니라 construction to modern formal-polite 합쇼체. The revised wording preserves the Hebrew’s distributive pair of offerings, ritual terminology, divine name, and the causal relation of the woman’s impure discharge to the atoning rite.
