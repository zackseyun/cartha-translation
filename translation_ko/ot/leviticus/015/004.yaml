base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
  footnotes:
  - marker: a
    text: Or 'every object on which he sits.' The Hebrew word can refer broadly to an article, utensil, or vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 부정하게 된 자가 누워 있는 침상은 모두 부정하게 되고, 그가 앉는 그릇은 모두 부정하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 앉는 모든 물건’으로도 옮길 수 있습니다. 히브리어 כְּלִי는 그릇, 기구, 물건까지 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 잠자리
  - 눕는 자리
  lexicon: HALOT
  rationale: מִשְׁכָּב은 눕는 용도의 자리를 가리키므로, 의례적 정결 문맥에 맞는 격식 있는 한국어로 ‘침상’이 가장 자연스럽습니다.
- source_word: הַזָּב
  english_pob_choice: the man with the discharge
  chosen_korean: 부정하게 된 자
  alternatives_korean:
  - 유출이 있는 사람
  - 분비물이 있는 사람
  - 유출병을 앓는 남자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수의 זָב를 가리키지만, 한국어에서는 직역투보다 앞절의 정결 상태를 드러내는 표현이 문맥상 자연스럽습니다. 다만 인칭은 뒤의 ‘그가’로 유지했습니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정하게 됩니다
  alternatives_korean:
  - 부정하게 될 것입니다
  - 부정합니다
  - 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: טמא의 법률적 결과를 한국어 합쇼체로 옮기되, 상태 묘사보다 판정형 문장을 살려 ‘부정하게 됩니다’로 자연스럽게 표현했습니다.
- source_word: הַכְּלִי
  english_pob_choice: vessel
  chosen_korean: 그릇
  alternatives_korean:
  - 기물
  - 물건
  - 용기
  lexicon: HALOT
  rationale: כְּלִי는 범위가 넓지만, ‘앉는’ 대상이라는 문맥에서는 한국어로 가장 이해하기 쉬운 포괄 명사인 ‘그릇’이 적절합니다. 다만 각주로 더 넓은 의미 가능성을 열어 두었습니다.
theological_decisions:
- issue: 정결/부정 언어의 번역 범위
  chosen_reading: 의례적 부정 상태를 ‘부정하게 됩니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 부정해집니다
  - 더럽혀집니다
  - 의례상 부정하게 됩니다
  rationale: 본문은 도덕적 죄책보다 레위기적 정결 상태를 말하므로, ‘더럽혀집니다’처럼 윤리적 뉘앙스를 강하게 하지 않고 원문의 판정 문장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve ritual impurity language without moralizing it.'
- issue: 남성 단수 주어의 보존
  chosen_reading: ‘부정하게 된 자’와 이어지는 ‘그가’로 남성 단수를 유지했습니다.
  alternative_readings:
  - 부정한 사람
  - 그 사람
  - 그들
  rationale: 히브리어는 남성 단수 형태를 사용하며, 본문 맥락상 남성의 유출을 다루므로 성별과 수를 희석하지 않았습니다.
  doctrine_reference: Gender-accurate rendering policy
