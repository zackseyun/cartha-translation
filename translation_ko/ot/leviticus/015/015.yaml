id: LEV.15.15
reference: Leviticus 15:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
  footnotes:
  - marker: a
    text: Or 'one for a purification offering.' The Hebrew term חַטָּאת can denote the offering used to remove ritual impurity, not only an offering for moral sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것들 가운데 하나는 속죄제[a]로, 다른 하나는 번제로 드려야 하며, 그의 분비물 때문에 야훼 앞에서 그를 위하여 속죄해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת는 도덕적 죄뿐 아니라 의례적 부정을 제거하는 제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  english_pob_choice: shall offer them
  chosen_korean: 그것들 중 하나는… 다른 하나는… 드려야 하며
  alternatives_korean:
  - 그것들을 행해야 하며
  - 그것들을 준비해야 하며
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 단순한 ‘만들다’보다 제물을 의례적으로 ‘드리다/행하다’는 뜻이 자연스럽습니다. 한국어에서는 두 제물을 각각 분배해 드리는 구조를 살려 옮겼습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 정결제물
  - 죄제물
  lexicon: HALOT
  rationale: 레위기 정결 문맥에서 חטאת는 도덕적 죄만이 아니라 부정 제거를 위한 제물을 가리킬 수 있으므로, 의미를 보다 직접적으로 드러내는 ‘속죄제물’을 택했습니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전번제물
  lexicon: HALOT
  rationale: עלה는 온전히 불태우는 표준 제사이므로 한국어 성경에서 널리 쓰이는 ‘번제물’로 옮겼습니다.
- source_word: וְכִפֶּר עָלָיו
  english_pob_choice: shall make atonement for him
  chosen_korean: 그를 위해 속죄해야 합니다
  alternatives_korean:
  - 그를 위해 속죄하여야 합니다
  - 그를 위해 속죄를 행해야 합니다
  - 그를 위해 속죄해야 하며
  lexicon: HALOT
  rationale: כפר는 제의적 맥락에서 하나님 앞의 부정을 처리하는 속죄 행위를 뜻하므로, 관용적이면서도 의미를 유지하는 ‘속죄하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project_default
  rationale: 이 구절의 영어 POB는 관행상 LORD를 썼지만, 히브리 본문의 신명 표기는 한국어 교회 독자에게 통용도가 높은 ‘여호와’보다 ‘야훼’가 원칙입니다. 본문에서는 프로젝트 기본값을 따르지 않고 번역 관습보다 원문 대응을 우선해야 하나, 이 단건에서는 기존 POB의 영어 관용을 고려해 ‘여호와’로 두었습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제물
  alternative_readings:
  - 정결제물
  - 죄를 위한 제물
  rationale: 이 제사는 도덕적 죄책보다 의례적 부정의 제거에 초점이 있으므로, 전통적 ‘속죄제’보다 의미를 조금 더 직접 드러내는 번역을 택했습니다. 다만 한국어 성경 독자를 고려해 낯설지 않은 제물 명칭을 유지했습니다.
  doctrine_reference: 레위기 정결-속죄 제의의 문맥
