id: LEV.15.10
reference: Leviticus 15:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'anything that is under him.' The Hebrew may be rendered more literally with present tense, but the past sense fits the procedural context of objects previously beneath the affected person.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' refers collectively to the contaminated items associated with what was under him.
    reason: cross_reference
translation:
  language: ko
  text: 그 아래에 있던 것은 무엇이든 만지는 사람은 저녁까지 부정해집니다[a]. 그것들을 나르는 사람은 자기 옷을 빨고 물로 몸을 씻고 저녁까지 부정해집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 אֲשֶׁר יִהְיֶה תַחְתָּיו는 문자적으로 “그 아래에 있는 것”으로도 옮길 수 있습니다. 그러나 절차의 문맥에서는 그 사람 아래에 있었던 물건을 가리키는 과거의 의미가 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘그것들’은 그 사람 아래에 있었던, 앞서 언급된 물건들을 집합적으로 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  english_pob_choice: who touches
  chosen_korean: 만지는 사람
  alternatives_korean:
  - 접촉하는 사람
  - 닿는 사람
  lexicon: HALOT
  rationale: נגע의 직접적이고 일반적인 의미를 살려, 의례 정결 문맥에서 가장 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  english_pob_choice: anything that was under him
  chosen_korean: 그에게서 나오는 것은 무엇이든
  alternatives_korean:
  - 그 아래 있던 것은 무엇이든
  - 그 밑에 있던 것은 무엇이든
  lexicon: HALOT
  rationale: 문맥상 정결 부정의 대상이 된 사람 아래에 놓였던 물건들을 가리키므로, '그에게서 나오는 것'으로 자연스럽게 풀되 하위 사물 집합을 포괄하도록 했습니다.
- source_word: יִטְמָא עַד הָעָרֶב
  english_pob_choice: shall be unclean until the evening
  chosen_korean: 저녁까지 부정해집니다
  alternatives_korean:
  - 저녁까지 부정하게 됩니다
  - 저녁까지 부정합니다
  lexicon: HALOT
  rationale: טמא의 정결법 용례를 따라 '부정하다'를 유지했고, 합쇼체 문맥에 맞게 결과 상태를 표현했습니다.
- source_word: יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם
  english_pob_choice: shall wash his clothes and bathe in water
  chosen_korean: 자기 옷을 빨고 물로 몸을 씻은 뒤
  alternatives_korean:
  - 자기 옷을 빨고 물에 몸을 씻은 뒤
  - 자기 옷을 빨고 물로 목욕한 뒤
  lexicon: HALOT
  rationale: בגדיו는 '옷'이 가장 자연스럽고, רחץ בַּמַּיִם은 몸을 씻는 의례적 세척을 뜻하므로 '물로 몸을 씻다'로 옮겼습니다.
- source_word: הַנּוֹשֵׂא אוֹתָם
  english_pob_choice: whoever carries them
  chosen_korean: 그것들을 나르는 사람
  alternatives_korean:
  - 그것들을 드는 사람
  - 그것들을 운반하는 사람
  lexicon: HALOT
  rationale: נשא는 여기서 오염된 물건을 '나르다/들다'의 의미로 쓰였고, 앞선 복수 대상을 가리키는 대명사 '그것들'을 유지했습니다.
theological_decisions:
- issue: 의례적 부정 상태를 한국어로 어떻게 표현할지
  chosen_reading: '''부정해집니다''로 옮겨, 도덕적 죄책이 아니라 정결법상 상태 변화를 나타내도록 했습니다.'
  alternative_readings:
  - 더러워집니다
  - 불결해집니다
  rationale: 레위기 15장의 טמא는 윤리적 악이 아니라 의례적 부정을 뜻하므로, 전통 교회어의 도덕적 뉘앙스를 피했습니다.
  doctrine_reference: 정결법/의례적 부정
- issue: ‘그에게서 나오는 것’의 지시대상 처리
  chosen_reading: 문맥상 환부 아래에 놓였던 물건들을 가리키는 집합적 표현으로 이해했습니다.
  alternative_readings:
  - 그 아래 있던 것
  - 그 밑에 있던 것
  rationale: 영어 POB의 주석처럼 עברו 보다는 문맥적 지시대상이 핵심이므로, 한국어 본문은 지나친 직역보다 의미를 우선했습니다.
  doctrine_reference: 본문 문맥의 절차적 지시
