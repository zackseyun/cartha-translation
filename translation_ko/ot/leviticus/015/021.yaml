id: LEV.15.21
reference: Leviticus 15:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'her lying place' or 'her bedding.' The Hebrew term refers to the place where she lies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 여자의 침상에 닿는 사람은 누구든지 자기 옷을 빨고 물로 몸을 씻어야 하며, 저녁까지 부정하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자가 누워 있는 곳’ 혹은 ‘그 여자의 침구’로 옮길 수 있습니다. 히브리어는 그 여자가 눕는 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  english_pob_choice: And everyone who touches
  chosen_korean: 그리고 … 닿는 사람은 누구든지
  alternatives_korean:
  - 그리고 … 만지는 사람은 누구든지
  - 그리고 누구든지 만지는 사람은
  lexicon: HALOT
  rationale: 부정문맥의 분사 구문을 한국어의 일반화 표현으로 자연스럽게 옮기되, 보편적 적용 범위를 분명히 했습니다.
- source_word: בְּמִשְׁכָּבָהּ
  english_pob_choice: her bed
  chosen_korean: 그 여자의 침상
  alternatives_korean:
  - 그 여자의 침대
  - 그 여자의 눕는 곳
  lexicon: HALOT
  rationale: 문맥상 실제 가구라기보다 접촉 대상이 되는 잠자리를 가리키므로, 직역성과 자연성을 함께 살린 ‘침상’을 택했습니다.
- source_word: יְכַבֵּס בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨고
  alternatives_korean:
  - 자기 옷을 씻고
  - 자기 옷을 세탁하고
  lexicon: HALOT
  rationale: כבס는 옷을 빨다/세탁하다의 뜻이지만, 법문체에서는 간결한 ‘빨다’가 가장 직접적입니다.
- source_word: וְרָחַץ בַּמַּיִם
  english_pob_choice: and bathe in water
  chosen_korean: 물로 몸을 씻어야 하며
  alternatives_korean:
  - 물에서 목욕해야 하며
  - 물로 씻어야 하며
  lexicon: HALOT
  rationale: רחץ는 이 정결 규례에서 신체를 씻는 행위이므로, 옷 빨기와 구별되도록 ‘몸을 씻다’로 옮겼습니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and he shall be unclean until the evening
  chosen_korean: 저녁까지 부정하게 됩니다
  alternatives_korean:
  - 저녁까지 부정합니다
  - 저녁까지 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: טמא는 여기서 도덕적 죄가 아니라 의례적 부정을 뜻하므로, ‘부정하다’로 유지하되 현대 한국어에 맞게 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 부정(ritual impurity) 표현
  chosen_reading: ‘부정하다’로 옮겨 의례적 불결/부정의 범주를 유지했습니다.
  alternative_readings:
  - 더럽다
  - 부정한 상태가 된다
  rationale: 레위기 15장은 도덕적 비난이 아니라 정결 규례를 다루므로, 윤리적 죄책을 암시하는 표현은 피해야 합니다.
  doctrine_reference: 의례적 정결/부정 개념을 도덕적 정죄와 혼동하지 않도록 보존
