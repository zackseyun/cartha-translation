  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
  footnotes:
  - marker: a
    text: Or 'during her menstruation.' The Hebrew term includes the idea of ritual impurity associated with menstruation, not merely the physical cycle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 menstrual impurity 동안 그녀가 누운 모든 것은 부정해질 것이며, 그녀가 앉은 모든 것도 부정해질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘월경 중’으로 옮길 수도 있습니다. 히브리어 용어는 단순한 생리 주기뿐 아니라 월경과 관련된 의례적 부정까지 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  english_pob_choice: menstrual impurity
  chosen_korean: menstrual impurity
  alternatives_korean:
  - 월경 부정
  - 월경의 부정
  - 월경 중의 부정
  lexicon: HALOT
  rationale: 본 절의 핵심 개념은 단순한 생리 현상보다 월경과 연결된 의례적 부정 상태이므로, 원어의 의미 범주를 살리기 위해 영어 POB의 표기를 그대로 반영했습니다.
- source_word: תִּשְׁכַּב
  english_pob_choice: lies
  chosen_korean: 누운
  alternatives_korean:
  - 눕는
  - 누워 있는
  - 드러누운
  lexicon: HALOT
  rationale: 사람의 수면이 아니라 물건 위에 몸을 대는 행위를 가리키므로, 현재 관형사형인 ‘누운’이 문맥상 자연스럽고 직접적입니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정해질 것입니다
  alternatives_korean:
  - 부정할 것입니다
  - 부정한 상태가 될 것입니다
  - 더러워질 것입니다
  lexicon: HALOT
  rationale: 정결법 문맥의 טמא는 도덕적 더러움이 아니라 의례적 부정을 뜻하므로, ‘부정해질 것입니다’로 상태 변화를 드러냈습니다.
- source_word: וְכֹל אֲשֶׁר
  english_pob_choice: everything on which
  chosen_korean: 모든 것
  alternatives_korean:
  - 그 위에 있는 모든 것
  - 그것에 닿는 모든 것
  - 그 위에 놓인 모든 것
  lexicon: HALOT
  rationale: 분배적 관계절을 한국어로 간결하게 옮기되, 뒤의 ‘누운/앉은’과 결합하여 대상 범위를 포괄적으로 전달했습니다.
theological_decisions:
- issue: 부정의 성격
  chosen_reading: 의례적/정결법상의 부정으로 읽고, 죄책감이나 도덕적 오염을 함의하지 않도록 했습니다.
  alternative_readings:
  - 도덕적 더러움처럼 읽히는 표현
  - 생리 자체를 부정적으로 규정하는 표현
  rationale: 레위기 15장은 정결 규례의 범주를 다루므로, 본문이 말하지 않는 도덕적 판단을 덧씌우지 않는 것이 원문 의미 보존에 부합합니다.
  doctrine_reference: 원어 우선 번역 원칙; 정결법의 범주 구분
