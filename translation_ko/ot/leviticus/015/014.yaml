source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (traditionally rendered ''the LORD''; alternatively ''Yahweh'').'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 여덟째 날에 그는 두 산비둘기나 두 어린 집비둘기[a]를 가져다가, 야훼 앞 곧 회막의 문 어귀로 나아가 제사장에게 그것들을 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘YHWH’를 직접 쓰며, 전통적으로는 ‘the LORD’로 옮기지만 여기서는 ‘야훼’로 표기합니다.
    reason: ot_citation
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  english_pob_choice: And on the eighth day
  chosen_korean: 그리고 여덟째 날에
  alternatives_korean:
  - 여덟째 날에
  lexicon: HALOT
  rationale: 절차적 지시의 연속을 살려 앞 절과 이어지는 접속을 넣었고, legal instruction의 미래·의무 뉘앙스는 뒤의 해야 합니다로 반영했습니다.
- source_word: שְׁתֵּי תֹרִים ... שְׁנֵי בְּנֵי יוֹנָה
  english_pob_choice: two turtledoves ... two young pigeons
  chosen_korean: 두 산비둘기나 두 어린 집비둘기
  alternatives_korean:
  - 두 산비둘기 또는 두 어린 집비둘기
  - 두 집비둘기 새끼
  lexicon: HALOT
  rationale: תֹרִים은 산비둘기, בני יונה는 희생 제의 맥락의 어린 비둘기로 이해해 '어린 집비둘기'로 옮겼습니다. 제사 대안 관계를 자연스럽게 나타내기 위해 '나'를 사용했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼 앞에
  - 야훼 면전에
  lexicon: HALOT
  rationale: 지정어 לִפְנֵי의 기본 의미를 살려 '앞'으로 옮겼고, 본문이 직접 쓰는 신명은 프로젝트 기본값에 따라 야훼로 렌더링했습니다.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 곧 회막의 문 어귀로
  alternatives_korean:
  - 회막의 문 입구로
  - 회막 어귀로
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 '문'보다 '문 어귀/입구'가 원문의 공간성을 더 정확히 드러내며, אֹהֶל מוֹעֵד는 관용적으로 '회막'을 사용했습니다.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  english_pob_choice: and give them to the priest
  chosen_korean: 제사장에게 그것들을 드려야 합니다
  alternatives_korean:
  - 제사장에게 그것들을 줘야 합니다
  - 제사장에게 바쳐야 합니다
  lexicon: HALOT
  rationale: נתן은 단순 전달이지만 제의 문맥에서는 '드리다'가 자연스럽고, 목적어 대명사 'them'을 '그것들'로 분명히 했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: 야훼로 직접 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 יְהוָה를 직접 쓰므로, 관습적 대체어보다 음역을 택해 본문의 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
