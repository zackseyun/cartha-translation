  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
  footnotes:
  - marker: a
    text: Or, 'if he has not rinsed his hands in water.' The Hebrew clause may be read as stating the condition under which the touch transmits impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 접촉한 사람은 누구든지 — 물로 자기 손을 씻지 않았으면 — 자기 옷을 빨고 물에 몸을 씻어야 하며, 저녁까지 부정합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 물로 자기 손을 헹구지 않았으면.’ 히브리어 문장은 접촉이 부정을 전염시키는 조건을 말하는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  english_pob_choice: everyone whom
  chosen_korean: 그에게 접촉한 사람은 누구든지
  alternatives_korean:
  - 그와 접촉한 모든 사람은
  - 그가 만진 사람은 누구든지
  lexicon: HALOT
  rationale: 분배적 상대절을 한국어로 자연스럽게 옮기면서, 뒤의 접촉 행위를 분명히 드러내는 표현을 택했습니다.
- source_word: יִגַּע בּוֹ
  english_pob_choice: touches
  chosen_korean: 접촉한
  alternatives_korean:
  - 만진
  - 닿은
  lexicon: HALOT
  rationale: 의례 정결 문맥에서 물리적 접촉을 뜻하므로, 한국어로는 ‘접촉하다’가 가장 중립적이고 정확합니다.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  english_pob_choice: without having rinsed his hands in water
  chosen_korean: 물로 자기 손을 씻지 않았으면
  alternatives_korean:
  - 물에 자기 손을 헹구지 않았으면
  - 물로 손을 씻지 않은 채
  lexicon: HALOT
  rationale: שָׁטַף의 ‘씻어 내다/헹구다’ 의미를 살리되, 한국어 성경체에 맞게 조건절로 풀어 옮겼습니다.
- source_word: וְכִבֶּס בְּגָדָיו וְרָחַץ בַּמַּיִם
  english_pob_choice: shall wash his clothes and bathe in water
  chosen_korean: 자기 옷을 빨고 물에 몸을 씻어야 하며
  alternatives_korean:
  - 자기 옷을 빨고 물로 몸을 씻어야 하며
  - 옷을 빨고 물로 목욕해야 하며
  lexicon: HALOT
  rationale: כִּבֵּס와 רָחַץ를 구별하기 위해 각각 ‘옷을 빨다’와 ‘몸을 씻다’로 나누어, 의례적 세탁과 신체 세정을 구분했습니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and be unclean until the evening
  chosen_korean: 저녁까지 부정합니다
  alternatives_korean:
  - 저녁까지 부정해야 합니다
  - 저녁까지 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: טָמֵא는 여기서 도덕적 타락이 아니라 정결 규정상의 부정을 뜻하므로, ‘부정하다’로 직역하되 현대적 문장으로 다듬었습니다.
theological_decisions:
- issue: 부정의 성격
  chosen_reading: 이 구절의 ‘부정’은 죄책이나 도덕적 더러움이 아니라 의례적/정결법적 부정을 뜻합니다.
  alternative_readings:
  - 더럽다
  - 오염되다
  rationale: 레위기 정결 규정의 문맥상, 접촉과 씻음, 그리고 저녁까지의 제한이 핵심이므로 의례적 범주를 보존해야 합니다.
  doctrine_reference: 레위기 정결법의 ritual impurity 범주
