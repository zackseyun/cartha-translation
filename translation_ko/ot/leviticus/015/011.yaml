  source_fidelity: 초안은 הַזָּב(유출이 있는 남자)를 명시하지 않아 ‘그에게’의 선행사가 없고, 그 결과 핵심 행위자가 누락되었습니다. 또한 ‘자기 손’이 누구의 손인지 불분명합니다. 수정문은 유출이 있는 남자가 손을 씻지 않은 채 다른 사람을 만지는 조건임을 히브리어 문법과 문맥에 맞게 분명히 합니다.
  naturalness: ‘접촉한 사람은 누구든지’보다 ‘만지는 모든 사람’이 현대 한국어에서 자연스럽고, 조건절의 주체와 뒤따르는 정결 의무의 대상도 명료합니다. ‘저녁까지 부정하게 됩니다’는 합쇼체의 법규적 진술에 자연스럽습니다.
