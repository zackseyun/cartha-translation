translation:
  language: ko
  text: 그리고 어떤 옷과 어떤 가죽이든 그 위에 정액의 배출이 있으면 물로 씻어야 하며, 저녁까지 부정합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '정액의 배출'은 직역하면 '씨의 누출'에 가깝지만, 문맥상 정액 사정을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: '''가죽''은 동물 가죽으로 만든 물건을 가리킬 가능성이 크며, 문맥상 ''가죽제품'' 또는 ''가죽 조각''으로 이해할 수 있습니다.'
    reason: lexical_alternative
