reference: Leviticus 15:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'the vessel' or 'the article'; the Hebrew term is broad for an item or object.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 그 부정한 사람이 앉았던 물건 위에 앉는 사람은 자기 옷을 빨고 물에 몸을 씻어야 하며, 저녁까지 부정합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물건’은 히브리어 כְּלִי의 넓은 뜻을 따른 것입니다. 문맥상 특별한 그릇만이 아니라 앉는 대상 일반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  english_pob_choice: Whoever sits
  chosen_korean: 누구든지 … 앉는 사람
  alternatives_korean:
  - 그 앉는 사람
  - 앉는 자는
  lexicon: HALOT
  rationale: 히브리어 분사구문이 법령 문맥에서 일반적·포괄적 대상을 가리키므로, 현대 한국어에서는 ‘누구든지’로 자연스럽게 옮겨 포괄성을 살렸습니다.
- source_word: הַכְּלִי
  english_pob_choice: the object
  chosen_korean: 물건
  alternatives_korean:
  - 기구
  - 그릇
  - 물체
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 ‘앉았던 대상’이라는 넓은 의미를 가지므로, 특정한 ‘그릇’보다 범위가 넓은 ‘물건’이 본문의 폭을 가장 무리 없이 전달합니다.
- source_word: הַזָּב
  english_pob_choice: the man with the discharge
  chosen_korean: 그 부정한 사람
  alternatives_korean:
  - 그 유출이 있는 사람
  - 그 분비물이 있는 사람
  lexicon: HALOT
  rationale: 문맥상 접촉 오염의 원인이 되는 남성을 가리키지만, 한국어 본문에서는 반복을 줄이면서 바로 앞 절의 부정 상태를 반영해 ‘그 부정한 사람’으로 옮겼습니다.
- source_word: וְרָחַץ בַּמַּיִם
  english_pob_choice: and bathe in water
  chosen_korean: 물에 몸을 씻어야 하며
  alternatives_korean:
  - 물로 몸을 씻어야 하며
  - 물에서 목욕해야 하며
  lexicon: HALOT
  rationale: רָחַץ는 정결 규례에서 몸을 씻는 행위이므로, 단순히 ‘씻다’보다 ‘몸을 씻다’가 더 분명하며 ‘목욕하다’보다 법령체에 맞는 중립적 표현입니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and he shall be unclean until the evening
  chosen_korean: 저녁까지 부정합니다
  alternatives_korean:
  - 저녁까지 부정해야 합니다
  - 저녁까지 부정한 상태입니다
  lexicon: HALOT
  rationale: טָמֵא는 도덕적 죄책보다 의례적 부정 상태를 나타내므로 ‘부정합니다’로 간결하게 옮겨 법조문형 현재적 진술로 살렸습니다.
theological_decisions:
- issue: 부정(ritual impurity) 표현
  chosen_reading: 의례적 부정 상태를 ‘부정합니다’로 간단히 표기하고, 도덕적 오염을 추가하지 않았습니다.
  alternative_readings:
  - 더럽습니다
  - 의식적으로 부정합니다
  rationale: 레위기 정결 규례의 문맥이므로 죄책이나 윤리적 비난을 덧씌우지 않는 것이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 남성 단수 지시 대상
  chosen_reading: ‘그 부정한 사람’으로 남성 단수의 원 지시를 유지했습니다.
  alternative_readings:
  - 그 사람들
  - 누구든지
  rationale: 히브리어는 이 절의 접촉 원인을 제공한 남성을 전제하므로, 성별·수의 정보를 지우지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §4
