id: LEV.15.16
reference: Leviticus 15:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'a seminal emission' or more literally 'an emission of seed.'
    reason: lexical_alternative
  - marker: b
    text: '''Unclean'' here refers to ritual impurity in the context of Levitical purity laws, not necessarily to moral guilt.'
    reason: cultural_note
translation:
  language: ko
  text: 남자에게서 정액이 나오면,[a] 그는 물로 온몸을 씻어야 하며 저녁까지 부정합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정액’으로 옮긴 히브리어 표현은 직역하면 ‘씨의 눕는 것’이며, 여기서는 정액의 배출을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘부정합니다’는 도덕적 타락이 아니라 레위기 정결법에서의 제의적 부정 상태를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ
  english_pob_choice: And if a man
  chosen_korean: 남자가
  alternatives_korean:
  - 어떤 남자가
  - 사람이
  lexicon: HALOT
  rationale: 법 조항의 조건문에서 남성 주체를 직접 지시하므로, 성별을 드러내는 ‘남자가’로 옮겼습니다.
- source_word: שִׁכְבַת זָרַע
  english_pob_choice: an emission of semen
  chosen_korean: 씨의 배출
  alternatives_korean:
  - 정액의 배출
  - 정액이 나옴
  - 씨의 유출
  lexicon: HALOT
  rationale: 직역의 ‘씨의 배출’은 히브리어의 ‘씨/종자’와 배출 이미지를 살리면서도 현대 한국어로 이해될 수 있습니다. 전통적 교회어인 ‘정액’보다 원문 어휘의 긴장을 더 직접적으로 드러냅니다.
- source_word: וְרָחַץ
  english_pob_choice: he shall wash
  chosen_korean: 물로 자기의 온몸을 씻고
  alternatives_korean:
  - 그는 물로 몸을 씻고
  - 목욕하고
  lexicon: HALOT
  rationale: 정결 규례의 행위를 나타내므로 단순한 ‘목욕하다’보다 ‘씻고’가 원문의 동작을 분명히 전합니다. ‘온몸’은 אֶת כָּל בְּשָׂרוֹ의 관용을 자연스럽게 풀어 옮긴 것입니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and be unclean until the evening
  chosen_korean: 저녁까지 부정하게 됩니다
  alternatives_korean:
  - 저녁까지 부정합니다
  - 저녁까지 더럽혀집니다
  lexicon: HALOT
  rationale: טָמֵא는 도덕적 죄책이 아니라 제의적 부정 상태를 가리키므로 ‘부정하게 됩니다’로 옮겼습니다. 한국어 성서 전통의 ‘부정하다’는 어감을 유지하되, 문맥을 벗어난 도덕화는 피했습니다.
theological_decisions:
- issue: טָמֵא의 의미 범위
  chosen_reading: 제의적 부정 상태를 가리키며, 도덕적 악이나 죄책을 직접 선언하지는 않습니다.
  alternative_readings:
  - 도덕적으로 더럽혀짐
  - 의식적으로 부정해짐
  rationale: 레위기의 몸 관련 정결 법맥에서 טָמֵא는 예배 접근과 관련된 정결/부정 범주입니다. 본문이 말하지 않는 죄책 개념을 덧씌우지 않도록 의미를 보존했습니다.
  doctrine_reference: 정결 법규의 제의적 범주를 유지하고, 본문이 명시하지 않는 윤리적 판단은 유보합니다.
