  verdict: revise
  source_fidelity: The draft correctly identifies a male seminal discharge, washing of the whole body in water, and ritual impurity lasting until evening. However, ‘씨의 배출’ is not idiomatic modern Korean and can obscure the specific referent of שִׁכְבַת זָרַע. ‘부정하게 됩니다’ is understandable but less direct than the legal-status expression ‘부정합니다.’
  naturalness: ‘남자에게서 정액이 나오면’ is clear, natural, and appropriately formal in a legal-purity context. ‘그는 물로 온몸을 씻어야 하며 저녁까지 부정합니다’ maintains a modern formal-polite register and clearly expresses both the requirement and resulting status.
  terminology: Use ‘정액’ for the referent of שִׁכְבַת זָרַע, with a note preserving the Hebrew’s more literal wording. Retain ‘부정합니다,’ qualified in a footnote as ritual rather than moral impurity.
  issues:
  - severity: medium
    issue: ‘씨의 배출’ is an unnatural and potentially opaque rendering of שִׁכְבַת זָרַע.
    rationale: In this context the Hebrew idiom denotes seminal discharge. Modern Korean ‘정액’ communicates the referent accurately without imposing an interpretation beyond the lexical sense.
  - severity: low
    issue: ‘부정하게 됩니다’ is less precise for the stipulated ritual status.
    rationale: The Hebrew predicate טָמֵא states that he is unclean until evening; ‘저녁까지 부정합니다’ is the conventional and direct Korean legal/ritual formulation.
  revised_text: 남자에게서 정액이 나오면,[a] 그는 물로 온몸을 씻어야 하며 저녁까지 부정합니다.[b]
