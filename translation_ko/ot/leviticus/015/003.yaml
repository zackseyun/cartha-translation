id: LEV.15.3
reference: Leviticus 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
  footnotes:
  - marker: a
    text: Or 'his flesh flows with his discharge ... his flesh is stopped up from his discharge.' The Hebrew uses 'flesh,' but here it refers to the bodily condition involved in the discharge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 분비물에서 생기는 그의 부정은 이러합니다. 그의 몸에서 그 분비물이 흐르거나, 그의 몸이 그 분비물로 막혀 있으면, 그것은 그의 부정입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 육체’라고 하지만, 여기서는 분비와 관련된 신체 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  english_pob_choice: his uncleanness
  chosen_korean: 그의 부정
  alternatives_korean:
  - 그의 불결
  - 그의 부정함
  lexicon: HALOT
  rationale: 레위기 정결법의 제의적 범주를 유지하기 위해 ‘부정’을 택했습니다. ‘불결’보다 더 직접적이고, 문맥상 의례적 상태를 자연스럽게 드러냅니다.
- source_word: זוֹב
  english_pob_choice: discharge
  chosen_korean: 분비물
  alternatives_korean:
  - 유출물
  - 흐름
  lexicon: HALOT
  rationale: 이 단어는 비정상적인 신체 분비를 가리키므로, 현대 한국어에서 지나치게 완곡하지 않으면서도 의학적으로 자연스러운 ‘분비물’로 옮겼습니다.
- source_word: רָר
  english_pob_choice: runs with
  chosen_korean: 흐르거나
  alternatives_korean:
  - 흘러내리거나
  - 흐르며
  lexicon: HALOT
  rationale: ‘몸에서 흘러나오다’라는 동작을 간결하게 살리기 위해 ‘흐르다’를 사용했습니다. 앞절과의 평행도 유지합니다.
- source_word: הֶחְתִּים
  english_pob_choice: is stopped up
  chosen_korean: 막혀 있으면
  alternatives_korean:
  - 막히면
  - 닫혀 있으면
  lexicon: HALOT
  rationale: 이 형태는 분비가 자유롭게 나오지 못하도록 막힌 상태를 뜻하므로, 결과 상태를 드러내는 ‘막혀 있으면’이 가장 자연스럽습니다.
theological_decisions:
- issue: 레위기 정결 규정의 기술어 선택
  chosen_reading: ‘uncleanness’를 ‘부정’으로 옮겨 제의적 상태를 그대로 드러냈습니다.
  alternative_readings:
  - ‘불결’로 순화
  - ‘부정함’으로 추상화
  rationale: 이 절은 도덕적 오염이 아니라 예배 공동체 안에서의 정결/부정 범주를 다루므로, 전통 교회어보다 문맥의 제의적 의미를 유지하는 번역이 필요합니다.
  doctrine_reference: 레위기 11–15장의 정결법
