  verdict: revise
  source_fidelity: 초안은 제의적 의미의 טֻמְאָה를 ‘부정’으로, זוֹב를 ‘분비물’로 옮긴 점은 적절합니다. 그러나 첫 구절의 בְּזוֹבוֹ는 단순히 ‘분비물에서 생기는’이라기보다 유출과 관련된 부정의 법적 규정을 소개합니다. 또한 둘째 조건은 몸이 분비물 ‘로’ 막힌다는 뜻보다, 분비물이 나오지 못하도록 몸이 막힌 상태라는 대조를 드러내는 편이 히브리어의 의미와 문맥에 더 충실합니다.
  naturalness: ‘그의 몸이 그 분비물을 흘리거나’와 ‘그 분비물이 나오지 못하도록 그의 몸이 막혀 있거나’는 현대 표준 한국어에서 명료하며, 임상적·법규적 문체를 유지합니다. ‘이러합니다’와 ‘입니다’는 합쇼체에 맞습니다.
  terminology: ‘부정’은 도덕적 비난이 아닌 레위기의 제의적 상태를 나타내는 용어로 적절합니다. ‘분비물’도 지나친 완곡어법 없이 원문의 신체적 의미를 전달합니다. 각 경우의 בְּשָׂרוֹ는 문자적으로 ‘그의 육체’이지만 이 문맥에서는 신체 상태를 뜻하므로 본문에서는 ‘몸’으로 번역하고 각주에서 이를 밝혔습니다.
  issues:
