    issue: 도입부의 관계 표현
    rationale: ‘그의 분비물에서 생기는 그의 부정’은 히브리어 בְּזוֹבוֹ의 법적·상황적 관계를 원인 발생으로 다소 좁힙니다. ‘그의 분비물과 관련된 그의 부정’이 더 중립적이고 충실합니다.
  - severity: medium
    issue: 막힌 상태의 번역
    rationale: ‘그의 몸이 그 분비물로 막혀 있으면’은 분비물 자체가 막는다는 뜻으로 읽히기 쉽습니다. 원문은 유출이 계속되는 경우와 유출이 막히는 경우를 대조하므로, 분비물이 나오지 못하도록 몸이 막힌 상태로 표현하는 것이 안전합니다.
  - severity: low
