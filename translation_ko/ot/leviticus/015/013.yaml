revisions:
- from: 그리고 분비물이 있는 사람이 그의 분비물에서 깨끗해지면, 그는 자기의 정결을 위하여 일곱 날을 세고 자기 옷을 빨며 몸을 살아 있는 물에 씻을 것이며, 그러면 깨끗해집니다.[a]
  to: 유출이 있는 사람이 그 유출에서 정결하게 되면, 그는 정결하게 되기 위하여 일곱 날을 셀 것이며, 옷을 빨고 흐르는 물에 몸을 씻을 것입니다. 그러면 그는 정결하게 될 것입니다.[a]
  rationale: 원문의 의식적 정결 범주와 절차적 순서를 보존하면서, ‘분비물’의 부정확한 일반성을 피하고 현대 표준 한국어의 자연스러운 합쇼체로 다듬었습니다. מַיִם חַיִּים의 직역은 각주에 남겨 어휘 정보를 보존하되, 본문에서는 문맥상 의미를 명확히 드러냈습니다.
