id: LEV.15.13
reference: Leviticus 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
  footnotes:
  - marker: a
    text: Literally, 'living water'; that is, fresh or flowing water.
    reason: lexical_alternative
translation:
  language: ko
  text: 유출이 있는 사람이 그 유출에서 정결하게 되면, 그는 정결하게 되기 위하여 일곱 날을 셀 것이며, 옷을 빨고 흐르는 물에 몸을 씻을 것입니다. 그러면 그는 정결하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘살아 있는 물’입니다. 여기서는 흐르거나 신선한 물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטְהַר / וְטָהֵר
  english_pob_choice: is cleansed / then he shall be clean
  chosen_korean: 깨끗해지면 / 그러면 깨끗해집니다
  alternatives_korean:
  - 정결하게 되면 / 그러면 정결합니다
  - 깨끗해지면 / 그러면 정결해집니다
  lexicon: HALOT
  rationale: 레위기 15장의 טהר는 도덕적 무죄보다 의식적 정결 상태의 회복을 뜻하므로, 한국어에서도 ‘정결’보다 일상적이지만 의식적 상태를 충분히 담는 ‘깨끗해지다/깨끗해집니다’를 택했습니다.
- source_word: מִזּוֹבוֹ
  english_pob_choice: from his discharge
  chosen_korean: 그의 분비물에서
  alternatives_korean:
  - 그의 유출에서
  - 그의 흘러나옴에서
  lexicon: HALOT
  rationale: זוֹב은 이 문맥에서 몸의 비정상적 유출을 가리키므로, 전통적 종교어휘를 덜어내고 한국어에서도 의미가 분명한 ‘분비물’로 옮겼습니다.
- source_word: לְטָהֳרָתוֹ
  english_pob_choice: for his cleansing
  chosen_korean: 자기의 정결을 위하여
  alternatives_korean:
  - 자기의 깨끗함을 위하여
  - 정결하게 되기 위하여
  lexicon: HALOT
  rationale: 명사형 טהרה는 이 절에서 의식적 정결의 과정을 가리키므로, 행위 목적을 드러내는 ‘자기의 정결을 위하여’가 가장 직접적입니다.
- source_word: בְּמַיִם חַיִּים
  english_pob_choice: in living water
  chosen_korean: 살아 있는 물에
  alternatives_korean:
  - 흐르는 물에
  - 생수에
  lexicon: HALOT
  rationale: 직역하면 ‘살아 있는 물’이지만, 레위기 정결 규례의 실제 의미가 흐르는 자연수임을 보여 주기 위해 본문에는 직역을 살려 두되 한국어 어순으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 의식적 정결과 도덕적 깨끗함의 구분
  chosen_reading: ‘깨끗해지다’와 ‘정결’의 병행으로 의식적 정결을 나타냅니다.
  alternative_readings:
  - ‘정결하게 되다’만 일관되게 사용
  - ‘깨끗하다’만 일관되게 사용
  rationale: 이 절은 죄책의 사면이 아니라 부정 상태의 해제를 다루므로, 너무 도덕화된 표현도, 너무 일상화된 표현도 피하고 두 표현을 함께 써서 의식적 의미를 보존했습니다.
  doctrine_reference: 레위기 15장의 정결 규례는 의식적 부정/정결 범주에 속합니다.
