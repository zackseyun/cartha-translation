review_pass:
  verdict: revise
  source_fidelity: 히브리어의 의식적 정결, 유출, 일곱 날을 세는 절차, 옷 세탁, 몸 씻기, 그리고 그 결과로 정결하게 되는 순서를 보존했습니다. 다만 ‘분비물’은 정상적인 신체 분비물까지 연상시켜 הַזָּב/זוֹב이 가리키는 지속적·비정상적 유출 상태를 충분히 나타내지 못하므로 ‘유출’로 고쳤습니다. בְּמַיִם חַיִּים는 문맥상 ‘흐르는 물’로 옮기고 직역을 각주에 보존하는 편이 정확하고 자연스럽습니다.
  naturalness: 초안의 ‘그의 분비물에서 깨끗해지면’과 ‘살아 있는 물에’는 현대 한국어에서 다소 부자연스럽거나 오해될 수 있습니다. 또한 절차를 명령·규정으로 서술하다가 결론에서 ‘깨끗해집니다’로 바뀌는 방식은 문체가 고르지 않습니다. ‘정결하게 될 것입니다’로 의식 규정의 문맥과 합쇼체를 일관되게 유지했습니다.
  terminology: 의식적 부정과 정결의 범주를 분명히 하기 위해 טהר 계열은 ‘정결하게 되다’로 통일했습니다. 이는 도덕적·위생적 의미로만 들릴 수 있는 ‘깨끗하다’보다 문맥에 적합합니다. ‘유출’은 זוֹב의 중립적이고 간결한 번역이며, ‘흐르는 물’은 מַיִם חַיִּים의 관용적 의미를 반영합니다.
  issues:
  - severity: medium
    issue: ‘분비물이 있는 사람’ 및 ‘그의 분비물에서’
    rationale: זוֹב은 단순한 분비물 자체보다 그 유출로 인해 부정해진 남성을 가리킵니다. ‘유출이 있는 사람’과 ‘그 유출에서 정결하게 되면’이 원문의 상태와 반복을 더 충실히 반영합니다.
  - severity: medium
    issue: ‘살아 있는 물’의 본문 표기
    rationale: 직역으로는 가능하지만 현대 한국어에서는 신학적 은유나 상품명 ‘생수’를 연상시킬 수 있습니다. 이 정결 규례에서는 흐르거나 신선한 자연수를 뜻하므로 본문은 ‘흐르는 물’로 하고 직역은 각주에 제시하는 것이 좋습니다.
  - severity: low
    issue: ‘깨끗해지면 … 깨끗해집니다’와 ‘정결’의 혼용
    rationale: 같은 טהר 어근을 일상어와 의례어로 혼용하면 용어의 초점이 흐려질 수 있습니다. ‘정결하게 되다’로 통일하면 의식적 의미와 문체의 일관성이 확보됩니다.
  - severity: low
    issue: 절차 서술의 종결 문체
    rationale: 초안은 ‘씻을 것이며’ 뒤에 ‘깨끗해집니다’를 사용합니다. 규정의 순서를 ‘셀 것이며 … 씻을 것입니다. 그러면 … 될 것입니다’로 맞추는 편이 합쇼체의 격식과 문장 흐름에 자연스럽습니다.
