id: LEV.15.25
reference: Leviticus 15:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
  footnotes:
  - marker: a
    text: Or 'outside the time of her menstruation.' The Hebrew term includes the state of ritual impurity associated with menstruation, not only the bleeding itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'if she has a discharge in addition to her menstrual impurity,' that is, extending beyond the normal menstrual period.
    reason: lexical_alternative
translation:
  language: ko
  text: 여인이 여러 날[a]에 걸쳐 피가 흘러 나오되, 자기의 월경 부정결 때가 아닐 때이거나, 혹은 자기의 월경 부정결을 넘어서 피가 흐르면, 그 부정한 유출의 모든 날 동안[b] 그녀는 부정하게 됩니다. 곧 자기의 월경 부정결의 날들과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘월경 시기 밖에’라는 뜻입니다. 히브리어 용어는 출혈 자체만이 아니라 월경과 연결된 의식적 부정결 상태까지 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 월경 부정결에 더하여’라는 뜻으로, 정상적인 월경 기간을 넘어 계속되는 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  english_pob_choice: has a discharge / has a discharge beyond
  chosen_korean: 피가 흘러 나오다 / 피가 흐르다
  alternatives_korean:
  - 유출이 있다
  - 분비가 있다
  - 출혈이 있다
  lexicon: HALOT
  rationale: זוּב의 반복은 비정상적인 유출을 가리키므로, ‘흘러 나오다/흐르다’로 자연스럽게 옮기되 단순 생리현상으로만 좁혀지지 않게 했습니다.
- source_word: דָּמָהּ
  english_pob_choice: of blood
  chosen_korean: 피가
  alternatives_korean:
  - 혈액이
  - 피의
  lexicon: HALOT
  rationale: שורש דם의 직접 대상은 ‘그의/그녀의 피’이므로 한국어에서는 가장 자연스러운 ‘피가’로 처리했습니다.
- source_word: בְּלֹא עֶת נִדָּתָהּ / נִדָּה
  english_pob_choice: not at the time of her menstrual impurity
  chosen_korean: 자기의 월경 부정결 때가 아닐 때
  alternatives_korean:
  - 자기의 월경 때가 아닐 때
  - 자기의 월경 부정결 기간이 아닐 때
  - 자기의 월경 불결 때가 아닐 때
  lexicon: HALOT
  rationale: נִדָּה는 단순한 월경 자체보다 그에 수반되는 의식적 부정결 상태를 포함하므로, ‘월경 부정결’로 옮겨 그 제의적 의미를 유지했습니다.
- source_word: עַל נִדָּתָהּ
  english_pob_choice: beyond her menstrual impurity
  chosen_korean: 자기의 월경 부정결을 넘어서
  alternatives_korean:
  - 자기의 월경 부정결에 더하여
  - 자기의 월경 부정결 위에
  - 자기의 월경 부정결을 지나
  lexicon: HALOT
  rationale: עַל이 여기서는 정상적인 기간/상태를 넘어서는 연장을 뜻하므로, ‘넘어서’가 가장 간결하고 의미를 잘 드러냅니다.
- source_word: טֻמְאָתָהּ / טְמֵאָה
  english_pob_choice: all the days of her unclean discharge / she shall be unclean
  chosen_korean: 그 부정한 유출의 모든 날 동안 / 그녀는 부정하게 됩니다
  alternatives_korean:
  - 그 부정한 유출의 모든 날에 / 그녀는 부정합니다
  - 그 불결한 유출의 모든 날 동안 / 그녀는 불결하게 됩니다
  lexicon: HALOT
  rationale: 제의적 정결/부정결 언어를 유지하기 위해 ‘부정한’과 ‘부정하게 됩니다’를 사용했습니다. ‘불결’은 일상적 오염 뉘앙스가 강해 법적·의례적 범주를 약화시킬 수 있습니다.
theological_decisions:
- issue: 레위기 정결법의 ‘부정’ 표현이 도덕적 죄책으로 오해될 가능성
  chosen_reading: 의례적 상태를 가리키는 법정 언어로 ‘부정’과 ‘월경 부정결’을 유지했습니다.
  alternative_readings:
  - ‘불결’로 완화해서 표현
  - 부정결 언어를 생략하고 증상만 서술
  rationale: 본문은 개인의 도덕적 타락이 아니라 레위기 정결 규례의 의식적 상태를 다루므로, 그 구분을 한국어에서도 분명히 남겨 두는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
