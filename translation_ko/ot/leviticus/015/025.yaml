    text: 또는 ‘월경 기간 밖에’라는 뜻입니다. 히브리어 용어는 출혈 자체만이 아니라 월경과 연결된 의식적 부정결 상태까지 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 월경 부정결에 더하여’라는 뜻으로, 정상적인 월경 기간을 넘어 계속되는 상태를 가리킵니다.
    reason: lexical_alternative
