id: LEV.15.27
reference: Leviticus 15:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
  footnotes:
  - marker: a
    text: That is, the objects associated with her impurity in the preceding context, such as what she lies on or sits on.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그것들에 닿는 사람은 누구든지 부정해집니다[a]. 그는 자기 옷을 빨고 물로 몸을 씻어야 하며, 저녁까지 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞 문맥에서 여인의 부정과 관련된 물건들, 곧 그녀가 누웠던 것이나 앉았던 것 같은 것들입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָל הַנּוֹגֵעַ
  english_pob_choice: And everyone who touches
  chosen_korean: 그리고 누구든지 … 닿는 사람은
  alternatives_korean:
  - 그리고 모든 사람이 … 닿으면
  - 그리고 그것들에 손대는 자는
  lexicon: HALOT
  rationale: 포괄적 의미의 כל + 분사구를 한국어로는 자연스럽게 ‘누구든지 … 닿는 사람’으로 옮겨, 범위의 보편성과 행위 주체성을 함께 살렸습니다.
- source_word: יִטְמָא
  english_pob_choice: shall be unclean
  chosen_korean: 부정해집니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정합니다
  lexicon: HALOT
  rationale: 레위기 정결 문맥의 טמא를 의례적 ‘부정’으로 옮겼고, 형식적으로는 미래/서법적 의미를 살려 ‘-집니다’로 표현했습니다.
- source_word: וְכִבֶּס בְּגָדָיו
  english_pob_choice: and he shall wash his clothes
  chosen_korean: 그는 자기 옷을 빨고
  alternatives_korean:
  - 그는 자기 옷을 씻고
  - 그는 자기 의복을 빨고
  lexicon: HALOT
  rationale: כיבס는 의복을 세탁하는 뜻이므로 ‘빨다’가 가장 직접적이며, ‘옷’은 현대 한국어에서 가장 자연스럽습니다.
- source_word: וְרָחַץ בַּמַּיִם
  english_pob_choice: and bathe in water
  chosen_korean: 물에 몸을 씻어야 하며
  alternatives_korean:
  - 물로 몸을 씻어야 하며
  - 물에 목욕해야 하며
  lexicon: HALOT
  rationale: רחץ는 단순 세척이 아니라 몸을 씻는 행위이므로, ‘몸을 씻다’로 구체화하되 과도한 해설 없이 유지했습니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and be unclean until the evening
  chosen_korean: 저녁까지 부정합니다
  alternatives_korean:
  - 저녁까지 부정하게 됩니다
  - 저녁까지 부정한 상태입니다
  lexicon: HALOT
  rationale: משך הזמן을 나타내는 ‘עד הערב’는 한국어에서 ‘저녁까지’가 자연스럽고, 반복되는 정결 상태를 압축적으로 표현했습니다.
theological_decisions:
- issue: 레위기 정결 용어의 성격
  chosen_reading: ‘부정하다’는 도덕적 죄책이 아니라 의례적/제의적 부정을 뜻하는 용어로 일관되게 사용했습니다.
  alternative_readings:
  - 더럽혀집니다
  - 불결해집니다
  rationale: 본문은 접촉에 따른 정결 규례를 다루므로, 도덕화나 위생화보다 제의적 범주를 유지하는 것이 원문 의미에 충실합니다.
  doctrine_reference: '성경 번역 원칙: 원문 우선, 제의적 정결/부정 범주 보존'
