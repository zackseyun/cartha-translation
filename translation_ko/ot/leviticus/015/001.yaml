  timestamp: '2026-07-13T13:08:16Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘야훼’, ‘모세와 아론에게’, ‘말씀하셨습니다’는 히브리어의 핵심 의미를 충실히 반영합니다. 다만 וַיְדַבֵּר의 순차적 서술을 ‘그때’로 특정하면 원문에 없는 시간적 한정을 더할 수 있고, לֵאמֹר의 발화 도입 기능도 ‘이렇게’를 통해 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘야훼께서 모세와 아론에게 이렇게 말씀하셨습니다’는 다음 절부터 이어지는 직접 발화를 자연스럽게 예고하는 현대 표준어 합쇼체 표현입니다.
  terminology: ‘야훼’는 프로젝트의 YHWH 표기 방침과 일치하며, ‘모세’, ‘아론’도 표준적인 한국어 성경 인명 표기입니다. 현 각주의 ‘신명기형’은 신명기(Deuteronomy)를 뜻하는 말로 읽혀 부정확하므로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: 각주에서 YHWH를 ‘신명기형’이라고 설명함
    rationale: YHWH는 신명기만의 형태가 아니라 히브리어 성경에 나타나는 신명(테트라그람마톤)입니다. ‘신명기형’은 책 이름인 신명기를 연상시켜 사실관계와 용어 면에서 부정확합니다.
  - severity: low
    issue: ‘그때’가 wayyiqtol에 구체적 시간 의미를 부가함
    rationale: וַיְדַבֵּר는 서술의 진행을 나타내지만, 이 절만으로 특정한 ‘그때’라는 시간 지시를 요구하지는 않습니다. 한국어에서는 접속 부사 없이도 자연스럽게 진행을 표현할 수 있습니다.
  - severity: low
    issue: לֵאמֹר의 직접 발화 도입 기능이 명시되지 않음
    rationale: 다음 절의 인용 발화를 도입하는 공식이므로 ‘이렇게’를 더하면 의미 기능을 자연스럽게 보존할 수 있습니다.
  revised_text: 야훼께서 모세와 아론에게 이렇게 말씀하셨습니다.[a]
  revised_footnotes:
  - marker: a
