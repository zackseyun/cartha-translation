  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 모세와 아론에게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 신명기형 ‘YHWH’를 사용합니다. 전통 번역은 이를 ‘여호와’ 또는 ‘주’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행성과 דבר의 ‘말하다/말씀하다’ 의미를 살려, 단순한 ‘말하다’보다 공손하고 자연스러운 ‘말씀하셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문은 여호와 대체가 아닌 신명 자체를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְאֶל אַהֲרֹן
  english_pob_choice: and to Aaron
  chosen_korean: 아론에게
  alternatives_korean:
  - 아론에게도
  - 그리고 아론에게
  lexicon: HALOT
  rationale: 히브리어의 반복 전치사 구조는 한국어에서 어순과 조사로 자연스럽게 처리할 수 있어, 두 사람을 함께 받는 수신자를 ‘모세와 아론에게’로 간결하게 반영했습니다.
theological_decisions:
- issue: 하나님이 누구에게 말씀하시는가를 드러내는 방식
  chosen_reading: 직접 화행을 살려 ‘야훼께서 ... 말씀하셨습니다’로 옮겼습니다.
  alternative_readings:
  - ‘주께서 ... 말씀하셨습니다’
  - ‘야훼께서 ... 말씀하여 이르셨습니다’
  rationale: 레위기의 서두 공식은 단순 전달이 아니라 하나님의 직접 계시 권위를 보여 주므로, 현대 한국어에서도 그 직접성을 유지하는 표현을 택했습니다.
  doctrine_reference: 문맥상 계시/언약 공식
