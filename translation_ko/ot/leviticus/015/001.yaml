  to: 야훼께서 모세와 아론에게 이렇게 말씀하셨습니다.[a]
  rationale: 부정확한 ‘신명기형’ 각주를 히브리어 신명 YHWH에 대한 정확한 설명으로 교정했습니다. 또한 원문이 요구하지 않는 ‘그때’를 제거하고, לֵאמֹר가 다음 절의 발화를 도입하는 기능을 ‘이렇게’로 자연스럽게 반영했습니다. 신명 자체의 표기는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다.
