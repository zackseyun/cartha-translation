reference: Leviticus 15:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'his lying place.' The Hebrew term can refer more broadly to the place where he lay, not only a constructed bed.
    reason: lexical_alternative
  - marker: b
    text: That is, ritually unclean within the purity regulations.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 어떤 사람이 그의 잠자리에 닿으면 그는 옷을 빨고 물로 몸을 씻어야 하며, 저녁까지 부정합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠자리’는 히브리어 מִשְׁכָּב가 가리킬 수 있는 ‘누운 자리, 침상, 또는 그가 누운 곳’을 넓게 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 말은 정결 규정상 의식적으로 부정한 상태를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  english_pob_choice: And a man who
  chosen_korean: 그리고 어떤 사람이
  alternatives_korean:
  - 그리고 한 남자가
  - 그리고 사람이
  lexicon: HALOT
  rationale: אִישׁ은 문자 그대로 ‘남자’이지만, 이 법 조항에서는 일반적인 사람을 가리키는 기능도 하므로 한국어에서는 자연스럽게 ‘어떤 사람’으로 옮겨 성별 표지를 과도하게 강조하지 않았습니다.
- source_word: בְּ/מִשְׁכָּב/וֹ
  english_pob_choice: his bed
  chosen_korean: 그의 잠자리
  alternatives_korean:
  - 그의 침대
  - 그의 누운 자리
  lexicon: HALOT
  rationale: מִשְׁכָּב은 단순한 가구로서의 침대보다 ‘눕는 곳/잠자리’의 뜻이 넓어, 본문에 있는 접촉 대상의 범위를 살리기 위해 ‘잠자리’로 옮겼습니다.
- source_word: יְכַבֵּס בְּגָדָי/ו
  english_pob_choice: shall wash his clothes
  chosen_korean: 그는 옷을 빨고
  alternatives_korean:
  - 그는 그의 옷을 빨아야 하며
  - 그는 옷을 세탁하고
  lexicon: HALOT
  rationale: כִּבֵּס는 의복을 세탁하다라는 뜻이므로, 한국어 법문체에서 자연스럽고 직설적인 ‘옷을 빨다’를 택해 대상이 의복임을 분명히 했습니다.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  english_pob_choice: and bathe in water
  chosen_korean: 물로 몸을 씻어
  alternatives_korean:
  - 물에서 목욕하여
  - 물로 씻고
  lexicon: HALOT
  rationale: רחץ는 여기서 몸을 씻는 행위이므로, 앞의 의복 세탁과 구별되게 ‘몸을 씻다’로 풀되 ‘물로’로 수단을 드러냈습니다.
- source_word: וְ/טָמֵא
  english_pob_choice: and he shall be unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정해야 합니다
  - 부정합니다
  lexicon: HALOT
  rationale: טָמֵא는 이 정결 규정 맥락에서 의식적 부정 상태를 가리키므로, 관용적 종교어휘인 ‘부정하다’로 번역했습니다. 합쇼체의 법규 진술로는 ‘부정합니다’가 가장 간결합니다.
theological_decisions:
- issue: טָמֵא의 의미를 도덕적 죄책으로 오해할 가능성
  chosen_reading: 정결 규정 안의 의식적 부정 상태로 읽고, 도덕적 악이나 죄책을 뜻하는 표현으로 확대하지 않았습니다.
  alternative_readings:
  - ‘의식적으로 부정합니다’라고 풀어쓸 수 있습니다.
  - ‘더럽혀집니다’로 의역할 수 있습니다.
  rationale: 본문은 접촉 후의 정결 상태를 다루므로, מקור의 범주를 유지하는 것이 중요합니다. 한국어 ‘부정하다’는 전통적 종교 어휘이지만 여기서는 의례적 상태를 가리키는 것으로 이해되어야 합니다.
  doctrine_reference: 레위기 정결법의 범주 보존; 의식적 부정과 도덕적 죄의 구별
