  source_fidelity: 히브리어 אִישׁ은 이 법 조항에서 남성 단수 ‘한 남자’를 가리키므로, ‘어떤 사람’보다 ‘한 남자’가 원문의 성별 표지를 더 정확히 보존합니다. 또한 טָמֵא는 저녁까지 지속되는 의례적 상태이므로 ‘부정하게 됩니다’가 법조항의 결과를 더 분명히 나타냅니다.
  naturalness: 초안은 전반적으로 자연스럽지만, ‘저녁까지 부정합니다’는 상태의 지속과 결과를 서술하는 문맥에서 다소 어색합니다. ‘저녁까지 부정하게 됩니다’가 현대 한국어 합쇼체 법문에 더 자연스럽습니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 독자의 이해에 명확합니다.
  terminology: ‘잠자리’, ‘옷을 빨고’, ‘물로 몸을 씻어야 하며’, ‘부정하게 됩니다’는 각각 מִשְׁכָּב, כבס בגדיו, רחץ במים, טמא를 적절히 반영합니다. ‘의식적으로 부정한’은 의도성을 암시할 수 있으므로 각주에서는 ‘의례적으로 부정한’ 또는 ‘정결 규정상 부정한’으로 고쳐야 합니다.
  issues:
