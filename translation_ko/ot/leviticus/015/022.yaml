id: LEV.15.22
reference: Leviticus 15:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'any vessel' or 'any article.' The Hebrew כְּלִי is a broad term for an item or utensil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀가 앉아 있는 어떤 기구에든 닿는 사람은 자기 옷을 빨고 물로 몸을 씻어야 합니다[a]. 그리고 그는 저녁까지 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 그릇’ 또는 ‘어떤 물건’. 히브리어 כְּלִי는 물건, 도구, 그릇을 아우르는 넓은 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  english_pob_choice: And everyone who touches
  chosen_korean: 그리고 … 닿는 사람은
  alternatives_korean:
  - 그리고 … 만지는 자는
  - 그리고 누구든지 … 닿는 사람은
  lexicon: HALOT
  rationale: 분사형을 한국어에서 자연스러운 보편적 주어로 풀어, 법규문의 일반성을 살리면서도 현대 합쇼체 문장으로 읽히게 했습니다.
- source_word: בְּכָל כְּלִי
  english_pob_choice: any object
  chosen_korean: 어떤 기구에든
  alternatives_korean:
  - 어떤 물건에든
  - 어떤 그릇에든
  - 어떤 물품에든
  lexicon: HALOT
  rationale: כְּלִי는 그릇에 한정되지 않는 넓은 범위이므로, POB의 설명을 반영해 ‘기구’로 넓게 옮겨 문맥상 앉는 대상임을 드러냈습니다.
- source_word: יְכַבֵּס בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨고
  alternatives_korean:
  - 자기 옷을 씻고
  - 옷을 세탁하고
  lexicon: HALOT
  rationale: בְּגָדָיו는 의복 전체를 가리키므로 ‘옷’이 자연스럽고, יְכַבֵּס는 단순 헹굼이 아니라 세탁을 뜻해 ‘빨고’로 옮겼습니다.
- source_word: וְטָמֵא
  english_pob_choice: and he shall be unclean
  chosen_korean: 그는 저녁까지 부정합니다
  alternatives_korean:
  - 그는 저녁까지 부정합니다
  - 그는 저녁까지 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: 레위기 정결 규례의 טָמֵא는 도덕적 타락이 아니라 의식적 부정을 가리키므로, 전통적 교회어를 피하면서도 규범적 상태를 간결하게 표현했습니다.
theological_decisions:
- issue: טָמֵא의 의미 범위
  chosen_reading: ‘부정합니다’로 옮겨 의식적/제의적 부정을 나타내고, 죄책감이나 도덕적 오염을 암시하지 않도록 했습니다.
  alternative_readings:
  - 더럽습니다
  - 부정해집니다
  - 오염됩니다
  rationale: 본문은 접촉으로 인한 정결 규례를 말하므로, 제의적 범주를 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §3
