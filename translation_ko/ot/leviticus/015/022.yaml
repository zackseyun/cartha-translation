  source_fidelity: 히브리어의 보편적 주어, 앉는 대상에 대한 접촉, 의복 세탁, 물로 하는 신체 세정, 저녁까지 지속되는 제의적 부정이 모두 반영되어 있습니다. 다만 כְּלִי의 넓은 의미에는 ‘기구’보다 ‘물건’이 더 충실하며, ‘부정합니다’는 현대 한국어에서 상태 서술로 다소 어색하고 다른 뜻으로도 읽힐 수 있습니다.
  naturalness: ‘그리고’로 시작하는 두 문장의 연결은 한국어 법규 문체에서 불필요하게 반복됩니다. ‘저녁까지 부정한 상태가 됩니다’로 연결하면 현대 합쇼체로 자연스럽고, 결과 상태도 분명해집니다.
  terminology: טָמֵא는 도덕적 दोष가 아닌 제의적 상태를 가리키므로 ‘부정한 상태’가 적절합니다. כְּלִי는 그릇이나 특정 기구에 한정되지 않으므로 본문에는 ‘물건’을 사용하고, 각주에서 가능한 좁은 번역을 제시하는 것이 좋습니다.
