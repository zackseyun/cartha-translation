source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
  footnotes:
  - marker: a
    text: Or 'like the bed of her menstrual impurity.' The Hebrew term נִדָּה can denote the menstrual state with its associated ritual separation.
    reason: lexical_alternative
  - marker: b
    text: '''Vessel'' is a broad term here for an article or object she sits on, not only a container.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 유출이 계속되는 모든 날 동안 그 여자가 눕는 모든 침상은 그 여자의 월경 때의 침상과 같을 것이며,[a] 그 여자가 앉는 모든 물건은 부정할 것입니다.[b] 그것은 그 여자의 월경 때의 부정함과 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자의 월경 부정 때의 침상’. 히브리어 니다(נִדָּה)는 월경 상태와 그에 따르는 의례적 분리 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물건’은 여기서 단지 용기만이 아니라 그 여자가 앉는 물품이나 대상을 폭넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּשְׁכָּב
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 잠자리
  lexicon: HALOT
  rationale: מסכּב는 ‘눕는 자리’를 가리키므로, 제의적 문맥에서 단순한 가구가 아니라 눕는 자리를 드러내는 ‘침상’이 자연스럽고 정확합니다.
- source_word: תִּשְׁכַּב עָלָיו
  english_pob_choice: she lies on
  chosen_korean: 그녀가 누워 있는
  alternatives_korean:
  - 그녀가 그 위에 눕는
  - 그녀가 눕는
  lexicon: HALOT
  rationale: עַל과 결합한 שכב의 관계를 살리면서, 한국어에서는 진행·상태를 드러내는 ‘누워 있는’이 가장 자연스럽습니다.
- source_word: כָּל יְמֵי זוֹבָהּ
  english_pob_choice: during all the days of her discharge
  chosen_korean: 그녀가 흘리는 모든 날 동안
  alternatives_korean:
  - 그녀의 유출의 모든 날 동안
  - 그녀의 분비가 있는 모든 날 동안
  lexicon: HALOT
  rationale: זוֹב는 이 문맥에서 비정상적 몸의 ‘흘림/유출’이므로, 의학적이면서도 본문의 동작성을 살린 ‘흘리는’으로 옮겼습니다.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  english_pob_choice: like the bed of her menstruation
  chosen_korean: 그녀의 월경의 침상과 같아야 하며
  alternatives_korean:
  - 그녀의 월경 침상과 같아야 하며
  - 그녀의 월경 부정의 침상과 같아야 하며
  lexicon: HALOT
  rationale: נִדָּה의 이 절에서의 비교 대상을 명시적으로 드러내기 위해 ‘월경’으로 구체화하되, ‘침상과 같아야 하며’로 법적 분류를 유지했습니다.
- source_word: כְּלִי
  english_pob_choice: vessel
  chosen_korean: 기구
  alternatives_korean:
  - 그릇
  - 물건
  - 용기
  lexicon: HALOT
  rationale: כְּלִי는 매우 넓은 범위의 물건을 가리키므로, 여기서는 앉는 대상까지 포함할 수 있는 포괄적 말인 ‘기구’가 적절합니다.
- source_word: טָמֵא / כְּטֻמְאַת
  english_pob_choice: unclean / uncleanness
  chosen_korean: 부정하게 / 부정함
  alternatives_korean:
  - 부정한 / 부정
  - 깨끗하지 않게 / 더러움
  lexicon: HALOT
  rationale: 레위기의 정결법에서는 도덕적 오염이 아닌 의례적 상태를 가리키므로, 전통적 교회어휘인 ‘부정’ 계열을 써서 상태와 명사를 함께 살렸습니다.
theological_decisions:
- issue: 레위기 정결 용어의 성격
  chosen_reading: טָמֵא와 טֻמְאָה를 의례적 ‘부정/부정함’으로 옮겼습니다.
  alternative_readings:
  - 더러움
  - 불결
  rationale: 본문은 죄책을 말하는 것이 아니라 정결 제도 안의 상태를 다루므로, 도덕화하지 않는 번역이 필요합니다.
  doctrine_reference: 레위기 정결법의 제의적 구분
- issue: נִדָּה의 구체화
  chosen_reading: 이 절에서는 נִדָּה를 ‘월경’으로 구체화했습니다.
  alternative_readings:
  - 월경 부정
  - 생리
  rationale: 앞선 문맥과의 연결을 분명히 하면서도, 본문의 비교가 무엇인지 독자가 바로 이해하도록 하기 위한 선택입니다.
  doctrine_reference: 레위기 15장의 월경/유출 정결 규정
