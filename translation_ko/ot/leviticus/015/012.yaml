id: LEV.15.12
reference: Leviticus 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
  footnotes:
  - marker: a
    text: Or 'clay vessel' or 'pottery vessel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the one with the discharge,' a technical purity-law term for a person affected by a bodily discharge.
    reason: cultural_note
  - marker: c
    text: Or 'shall be washed in water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 토기 그릇은 그 유출증이 있는 사람이 만지면 깨뜨려야 하며, 나무 그릇은 물로 씻어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  english_pob_choice: earthen vessel
  chosen_korean: 토기 그릇
  alternatives_korean:
  - 질그릇
  - 흙그릇
  - 도기 그릇
  lexicon: HALOT
  rationale: חֶרֶשׂ가 가리키는 흙으로 만든 그릇의 재질을 한국어에서 자연스럽게 드러내기 위해 ‘토기 그릇’으로 옮겼습니다.
- source_word: הַזָּב
  english_pob_choice: the one with the discharge
  chosen_korean: 유출증이 있는 사람
  alternatives_korean:
  - 분비물이 있는 사람
  - 유출이 있는 사람
  - 유출증에 걸린 사람
  lexicon: HALOT
  rationale: 이 표현은 개인의 일반적 ‘병명’보다 정결법의 기술 용어이므로, 조건을 드러내는 설명형으로 옮겨 원문의 법적 기능을 살렸습니다.
- source_word: יִשָּׁבֵר
  english_pob_choice: shall be broken
  chosen_korean: 깨뜨려야 하며
  alternatives_korean:
  - 부서져야 하며
  - 깨져야 하며
  - 깨야 하며
  lexicon: HALOT
  rationale: 법규 문맥의 수동적 명령을 한국어에서 자연스럽게 나타내기 위해 의무형으로 옮겼습니다.
- source_word: יִשָּׁטֵף בַּמָּיִם
  english_pob_choice: shall be rinsed with water
  chosen_korean: 물로 씻어야 합니다
  alternatives_korean:
  - 물로 헹궈야 합니다
  - 물에 씻어야 합니다
  - 물로 씻어야 하며
  lexicon: HALOT
  rationale: 그릇에 대한 정결 처리로서 שטף의 ‘씻다/헹구다’ 의미를 살리되, 현대 한국어에서 가장 자연스러운 법규체 표현으로 다듬었습니다.
theological_decisions:
- issue: 정결법의 기술 용어를 현대 독자가 이해할 수 있게 풀어 옮길지 여부
  chosen_reading: ‘유출증이 있는 사람’으로 설명형 번역을 유지했습니다.
  alternative_readings:
  - ‘정결하지 않은 사람’으로 완화
  - ‘분비물이 있는 자’로 직역
  rationale: 본문은 도덕적 평가가 아니라 정결 규례의 전문 용어이므로, 기술적 의미를 잃지 않도록 상태를 드러내는 표현을 택했습니다.
  doctrine_reference: 레위기 정결법 문맥
