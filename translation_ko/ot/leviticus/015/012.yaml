  to: 유출증이 있는 사람이 만진 질그릇은 깨뜨려야 하며, 나무 그릇은 모두 물로 씻어야 합니다.[a]
  rationale: 원문의 법적 명령(‘깨뜨려야 하며’, ‘씻어야 합니다’)과 ‘질그릇/나무 그릇’의 재질상 대조를 유지했습니다. ‘질그릇’으로 용어를 간결하게 다듬고, הַזָּב의 정결법상 기술적 의미는 주석으로 보완했습니다. 히브리어의 ‘모든 나무 그릇’은 한국어 어순상 ‘나무 그릇은 모두’로 옮겼습니다.
