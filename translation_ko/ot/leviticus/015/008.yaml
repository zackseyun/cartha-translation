  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'on someone who is clean.' The Hebrew uses 'the clean one,' meaning a person who is ritually clean.
    reason: lexical_alternative
  - marker: b
    text: That is, ritually unclean until evening, not necessarily morally defiled.
    reason: cultural_note
translation:
  language: ko
  text: 유출이 있는 사람이 정결한 사람[a]에게 침을 뱉으면, 그 정결한 사람은 자기 옷을 빨고 물로 몸을 씻어야 하며, 저녁까지 부정합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘정결한 사람’입니다. 여기서 정결함은 의례적 정결 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘부정함’은 저녁까지 지속되는 의례적 부정 상태를 뜻하며, 반드시 도덕적 잘못을 뜻하는 것은 아닙니다.
    reason: cultural_note
