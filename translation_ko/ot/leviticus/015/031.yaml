  source_fidelity: 현 초안의 ‘그들의 부정에서 멀리하게 하여’는 הִזַּרְתֶּם의 주된 문맥적 의미인 ‘경고하다’를 ‘멀리하게 하다’로 바꾸어 놓습니다. 또한 ‘그들 가운데 있는’(אֲשֶׁר בְּתוֹכָם)이라는 장막 수식어가 빠져 있습니다. 수정문은 경고의 대상, 죽음을 막는 목적, 장막을 더럽히는 상황, 그리고 하나님이 그들 가운데 거하심을 모두 보존합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 법규적·예배 규정 문맥에 자연스럽습니다. ‘부정한 상태에서’는 의례적 범주를 유지하면서도 ‘부정 가운데서’보다 현대 한국어에서 더 분명합니다.
  terminology: טֻמְאָה는 도덕적 죄로 한정하지 않도록 ‘부정’ 및 ‘부정한 상태’로 옮겼습니다. מִשְׁכָּן은 구체적 예배 처소를 가리키므로 ‘내 장막’으로, בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 자손’으로 유지했습니다.
  issues:
  - severity: high
    issue: ‘멀리하게 하여’가 ‘경고하다’의 의미를 대체함
    rationale: הִזַּרְתֶּם은 이 문맥에서 이스라엘 백성에게 부정에 관하여 경고·훈계하라는 뜻입니다. 물리적·의례적으로 멀리 떼어 놓는 행위로 번역하면 핵심 동사가 달라집니다.
  - severity: medium
    issue: ‘그들 가운데 있는’이라는 장막의 수식어 누락
    rationale: אֲשֶׁר בְּתוֹכָם은 하나님의 장막이 이스라엘 가운데 있음을 명시하므로 번역에 반영해야 합니다.
  - severity: low
    issue: ‘그 부정 가운데서’의 한국어 표현이 다소 부자연스러움
    rationale: 히브리어의 상태를 나타내는 בְּ를 보존하면서 현대 한국어로는 ‘그들의 부정한 상태에서’가 더 명료합니다.
