base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'object' or 'vessel' for 'item' (Hebrew כְּלִי, a broad term for an article, implement, or vessel).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것이 침상 위에 있거나 그녀가 앉는 물건[a] 위에 있으면, 그가 그것을 만질 때 저녁까지 부정하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּלִי는 도구, 물건, 그릇 등을 아우르는 넓은 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 … 있으면
  alternatives_korean:
  - 만일 … 있으면
  - 그리고 만일 … 있으면
  lexicon: WLC
  rationale: 조건문 앞의 접속을 살려 이전 규정과의 연속성을 보여 주되, 한국어 법문체에서는 자연스럽게 ‘그리고 … 있으면’으로 옮겼습니다.
- source_word: הַמִּשְׁכָּב
  english_pob_choice: the bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 잠자리는
  lexicon: HALOT
  rationale: מִשְׁכָּב은 단순한 가구로서의 침대보다 ‘눕는 자리’라는 기능을 드러내는 ‘침상’이 정결 규례 문맥에 더 가깝습니다.
- source_word: הַכְּלִי
  english_pob_choice: the item
  chosen_korean: 그 물건
  alternatives_korean:
  - 그 물품
  - 그 기구
  - 그 그릇
  lexicon: HALOT
  rationale: כְּלִי는 넓게 도구·용기·물품을 가리키므로, 특정 범주로 좁히지 않는 ‘물건’이 POB의 ‘item’처럼 범위를 보존합니다.
- source_word: בְּנָגְעוֹ בוֹ
  english_pob_choice: when he touches it
  chosen_korean: 그가 그것을 만질 때
  alternatives_korean:
  - 그가 그것에 닿을 때
  - 그것을 만지면
  lexicon: HALOT
  rationale: 전치사 בְּ가 만드는 시간적 상황을 ‘~할 때’로 옮겨 법조문의 조건성을 살렸고, 대명사 관계도 한국어에서 자연스럽게 정리했습니다.
- source_word: יִטְמָא
  english_pob_choice: he shall be unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정해집니다
  - 부정하게 됩니다
  - 부정합니다
  lexicon: HALOT
  rationale: תָּמֵא의 의례적 상태를 ‘부정하다/부정해지다’로 옮겼고, 예언적·법률적 규정의 결과를 현대 한국어에서 간결한 합쇼체로 표현했습니다.
theological_decisions:
- issue: טָמֵא의 의미 범위
  chosen_reading: 의례적 부정 상태로서 ‘부정합니다’
  alternative_readings:
  - 의식적으로 부정합니다
  - 더럽혀집니다
  rationale: 이 절은 도덕적 죄책보다 정결 규례상의 상태를 말하므로, 의미를 과장하지 않는 ‘부정합니다’를 택했습니다.
  doctrine_reference: 레위기 정결법의 문맥 유지; POB 번역 원칙의 source-plain sense
