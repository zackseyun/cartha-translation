id: LEV.13.8
reference: Leviticus 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
  footnotes:
  - marker: a
    text: Hebrew tsaraʿat, traditionally rendered 'leprosy'; the term in Leviticus likely covers a broader range of serious skin conditions than modern leprosy alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장은 그를 살펴보고, 보십시오, 그 피부의 비듬성 발진이 퍼졌으면 제사장은 그를 부정하다고 선언해야 합니다. 그것은 나병입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 전통적으로 ‘나병’으로 옮겨 왔지만, 레위기에서는 현대 의학의 나병만이 아니라 더 넓은 범위의 심각한 피부 질환을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: shall examine
  chosen_korean: 살펴보고
  alternatives_korean:
  - 보시고
  - 검사하고
  lexicon: HALOT
  rationale: 제사장이 단순히 보는 것이 아니라 판정하기 위해 상태를 확인하는 진단적 동작이므로, 공식적 맥락을 살려 ‘살펴보고’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: if
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보니
  - 보라
  lexicon: HALOT
  rationale: 본문의 절차적 문맥에서는 발견 사실을 도입하는 감탄보다 주목을 환기하는 표현이 자연스러워 ‘보십시오’로 처리했습니다.
- source_word: הַ/מִּסְפַּחַת
  english_pob_choice: the scaly eruption
  chosen_korean: 비듬성 발진
  alternatives_korean:
  - 비늘진 발진
  - 각질성 발진
  - 피부 발진
  lexicon: HALOT
  rationale: 이 명사는 피부 표면의 비정상적 병변을 가리키므로, 현대 한국어에서 오해를 줄이면서도 표면의 인상을 살리는 ‘비듬성 발진’을 택했습니다.
- source_word: וְ/טִמְּא֥/וֹ
  english_pob_choice: shall pronounce him unclean
  chosen_korean: 그를 부정하다고 선언해야 합니다
  alternatives_korean:
  - 그를 부정하다고 해야 합니다
  - 그를 부정하다고 판정해야 합니다
  lexicon: HALOT
  rationale: 제사장은 원인적으로 더럽히는 것이 아니라 권위 있게 상태를 선언하므로, 법정적 기능을 드러내는 ‘선언해야 합니다’를 사용했습니다.
- source_word: צָרַ֥עַת
  english_pob_choice: it is leprosy
  chosen_korean: 나병입니다
  alternatives_korean:
  - 피부병입니다
  - 문둥병입니다
  - 한센병입니다
  lexicon: HALOT
  rationale: POB 영어가 이곳에서는 전통적 용어를 유지하므로, 한국어도 교회 전통에 익숙한 ‘나병’을 택하되, 레위기의 רחב한 범주성은 각주로 보완했습니다.
theological_decisions:
- issue: צָרַעַת의 범주를 현대 의학 질환명으로 오해하지 않게 할 것인지
  chosen_reading: 본문은 의학 진단명보다 의식적·법적 판정을 가리키며, 한국어 본문에는 전통 용어 ‘나병’을 두되 그 범위의 넓음을 각주로 밝혔습니다.
  alternative_readings:
  - 피부병입니다
  - 한센병입니다
  - 문둥병입니다
  rationale: 히브리어가 현대 한센병과 일치하지 않으므로, 본문은 익숙한 전통 용어를 살리면서도 독자가 현대적 동일시를 하지 않도록 보완하는 편이 원문의 효력을 유지합니다.
  doctrine_reference: 레위기 정결법의 제의적 상태 구분; 번역은 의학적 현대화보다 본문 범주의 보존을 우선함
