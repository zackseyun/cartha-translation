  source_fidelity: 핵심 절차와 조건은 대체로 충실합니다. 다만 עָמַד בְּעֵינָיו는 ‘그의 눈에’라고 하면 선행사 ‘그’가 피검사자인지 제사장인지 모호해질 수 있으므로, 제사장의 관찰 기준임을 명시하는 편이 안전합니다. שִׁבְעַת יָמִים는 ‘일주일’보다 원문의 수량을 그대로 드러내는 ‘칠 일’이 더 적절합니다.
  naturalness: 삽입된 ‘보십시오’는 현대 한국어 법규·절차 문맥에서 부자연스럽고, 문장 안에서 독자에게 직접 말하는 듯하게 들립니다. 원문의 וְהִנֵּה가 도입하는 관찰 결과를 조건절의 자연스러운 연결로 옮기는 것이 좋습니다.
  terminology: ‘살펴보다’, ‘반점’, ‘격리하다’는 이 문맥에서 수용 가능합니다. 다만 נגע의 주석은 이를 현대 의학적 ‘병변’으로 다소 단정하기보다, 제사장이 판정하는 눈에 보이는 피부의 징후 또는 반점이라는 범위를 유지하는 편이 좋습니다.
