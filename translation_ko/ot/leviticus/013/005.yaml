id: LEV.13.5
reference: Leviticus 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֣/הוּ הַ/כֹּהֵן֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ עָמַ֣ד בְּ/עֵינָ֔י/ו לֹֽא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/הִסְגִּיר֧/וֹ הַ/כֹּהֵ֛ן שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
  footnotes:
  - marker: a
    text: Or 'the affliction' or 'the mark' for Hebrew negaʿ; the term refers to the visible lesion under priestly examination, not necessarily a medically defined disease.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the spot has stood in his eyes,' an idiom meaning it appeared unchanged to the priest.
    reason: lexical_alternative
  - marker: c
    text: Or 'shall confine him' or more literally 'shall shut him up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 일곱째 날에 그를 살펴보고, 그 반점[a]이 제사장이 보기에 변함이 없고[b] 그 반점이 피부에 퍼지지 않았으면, 제사장은 그를 다시 칠 일 동안 격리해야 합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네가(נגע)는 여기서 반드시 현대 의학적으로 규정된 질병을 뜻하지 않으며, 제사장이 살펴보는 눈에 보이는 피부의 징후나 반점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 눈에 서 있었다’입니다. 여기서 ‘그’는 제사장을 가리키며, 제사장이 보기에 변함이 없었다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가두어 두어야 합니다’. 히브리어는 문자적으로 ‘닫아 두다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  english_pob_choice: shall examine him
  chosen_korean: 살펴보고
  alternatives_korean:
  - 검사하고
  - 진찰하고
  - 보아
  lexicon: HALOT
  rationale: 제사장의 판별 행위를 나타내므로 단순한 ‘보다’보다 절차적 의미를 살린 ‘살펴보다’가 적절합니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: on the seventh day
  chosen_korean: 일곱째 날에
  alternatives_korean:
  - 제칠일에
  - 일곱 번째 날에
  lexicon: HALOT
  rationale: 히브리어의 정해진 순차적 시점을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עָמַד בְּעֵינָיו
  english_pob_choice: has remained unchanged in his sight
  chosen_korean: 그의 눈에 그대로 있고
  alternatives_korean:
  - 그에게 그대로 보이고
  - 그의 판단에 변함이 없고
  - 그의 눈앞에 그대로 서 있고
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘눈에 그대로 있다’를 살리되, 제사장의 관찰 결과라는 뜻이 분명하도록 다듬었습니다.
- source_word: וְהִסְגִּירוֹ
  english_pob_choice: shall isolate him
  chosen_korean: 그를 다시 일주일 동안 격리해야 합니다
  alternatives_korean:
  - 그를 다시 칠 일 동안 가둬야 합니다
  - 그를 다시 일주일 동안 가두어 두어야 합니다
  - 그를 다시 일주일 동안 봉쇄해야 합니다
  lexicon: HALOT
  rationale: 문맥상 의학적 ‘격리’보다 의례적 분리를 뜻하지만, 현대 독자가 이해하기 쉬운 ‘격리’가 가장 명확합니다.
theological_decisions:
- issue: יֹם הַשְּׁבִיעִי의 제사장 판정 장면에서 명령형과 보고문의 결합
  chosen_reading: 첫 절반은 서술형으로, 뒤의 확인 절차는 제사장에게 주어진 규정으로 처리했습니다.
  alternative_readings:
  - 전부 명령형으로 옮김
  - 전부 서술형으로 옮김
  rationale: 히브리어 법문체의 절차성과 판정 기능을 살리기 위해 한국어도 규정문처럼 읽히도록 했습니다.
  doctrine_reference: 레위기 13장의 정결 판정 규정
- issue: ‘보십시오’의 등록
  chosen_reading: ‘보십시오’로 감탄적 주의를 표시했습니다.
  alternative_readings:
  - ‘보라’로 번역
  - 생략
  rationale: וְהִנֵּה가 독자에게 판정 결과를 주목시키는 담화 표지이므로, 현대 합쇼체 안에서 자연스럽게 주의를 환기하는 표현을 사용했습니다.
  doctrine_reference: 히브리어 담화 표지 וְהִנֵּה의 기능
