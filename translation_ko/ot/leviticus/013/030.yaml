reference: Leviticus 13:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
  footnotes:
  - marker: a
    text: Or 'scall,' a traditional rendering for נֶתֶק; the exact medical condition is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew צָרַעַת is a broad term for a serious skin disease and does not necessarily refer to modern leprosy (Hansen's disease).
    reason: cultural_note
translation:
  language: ko
  text: 제사장은 그 병변을 살펴보고, 보십시오, 그 모습이 피부보다 더 깊으며 그 안에 가는 누런 털이 있으면, 제사장은 그를 부정하다고 판정해야 합니다. 그것은 네תק[a]입니다. 곧 머리나 수염의 피부병[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 ‘scall’로 옮기던 낱말로, 정확한 의학적 상태는 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צָרַעַת은 심각한 피부병을 가리키는 넓은 용어로, 현대 의학의 나병(한센병)을 반드시 뜻하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  english_pob_choice: diseased area
  chosen_korean: 병변
  alternatives_korean:
  - 환부
  - 병든 부위
  - 병소
  lexicon: HALOT
  rationale: 레위기 13장의 진단 문맥에서는 제사장이 살피는 가시적 병적 부위를 가리키므로, 의학적·문맥적으로 자연스러운 ‘병변’을 택했습니다.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  english_pob_choice: its appearance is deeper than the skin
  chosen_korean: 그 모습이 피부보다 더 깊으며
  alternatives_korean:
  - 그 모습이 피부 아래로 들어가 보이며
  - 피부보다 더 깊어 보이며
  lexicon: HALOT
  rationale: ‘깊다’의 비교 의미를 살리되, 진단 표현으로 어색하지 않게 한국어 어순을 조정했습니다.
- source_word: שֵׂעָר צָהֹב דַּק
  english_pob_choice: thin yellow hair
  chosen_korean: 가는 누런 털
  alternatives_korean:
  - 가는 노란 털
  - 솜털 같은 누런 털
  lexicon: HALOT
  rationale: צָהֹב의 색감을 ‘누런’으로 옮겨 단순한 밝은 노랑보다 원문의 탁한 황색 뉘앙스를 살렸고, דַּק은 ‘가는’으로 옮겼습니다.
- source_word: נֶתֶק
  english_pob_choice: itch
  chosen_korean: 네תק
  alternatives_korean:
  - 가피병
  - 두피·수염 병변
  - 넷텍
  lexicon: HALOT
  rationale: 이 용어는 정확한 현대 의학 명칭이 불확실하므로, 본문에서는 기존 POB의 음역을 따르되 각주로 전통 번역 가능성을 밝혔습니다.
- source_word: צָרַעַת
  english_pob_choice: skin disease
  chosen_korean: 피부병
  alternatives_korean:
  - 나병
  - 피부 질환
  - 악성 피부병
  lexicon: HALOT
  rationale: 현대의 ‘나병’으로 한정하지 않고, 레위기의 넓은 범위를 반영하는 일반적 표현 ‘피부병’을 사용했습니다.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  english_pob_choice: of the head or of the beard
  chosen_korean: 머리나 수염의
  alternatives_korean:
  - 머리나 수염에 생긴
  - 두피나 수염의
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 한국어로 옮기면서도, 병변의 위치가 머리와 수염에 한정된다는 점을 유지했습니다.
theological_decisions:
- issue: 제사장의 판정 행위
  chosen_reading: ‘부정하다고 판정해야 합니다’로 옮겨 제사장이 오염을 ‘만드는’ 것이 아니라 판결하는 역할임을 드러냈습니다.
  alternative_readings:
  - 그를 부정하게 해야 합니다
  - 그를 부정하다고 선언해야 합니다
  rationale: 레위기 정결 규정에서 제사장은 제의적 상태를 판정하는 사법적 기능을 수행하므로, 원문과 POB의 의미를 따라 판정 용어를 사용했습니다.
  doctrine_reference: 레위기 13장의 정결/부정 규례와 제사장 판정 기능
