    issue: 본문의 ‘네תק’ 표기에 히브리어 글자 ת가 혼입됨
    rationale: 표준 한국어 본문에서 음역어 표기가 일관되지 않고 오기로 보입니다. ‘네텍’으로 고쳐야 합니다.
  - severity: low
    issue: 각주 a가 ‘scall’만 제시하여 한국어 독자에게 대안의 성격이 불명확함
