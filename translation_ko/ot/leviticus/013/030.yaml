  source_fidelity: 핵심 진단 기준과 제사장의 판정 기능은 대체로 충실합니다. 다만 히브리어 וְהִנֵּה는 청자에게 하는 명령인 ‘보십시오’가 아니라 관찰 결과를 제시하는 표지이므로 한국어 문장 안에서 ‘보기에/보니’로 옮기는 편이 정확합니다. 또한 본문의 ‘네תק’은 히브리어 철자가 혼입된 표기이므로 한국어 음역으로 바로잡아야 합니다.
  naturalness: ‘보십시오’는 현대 한국어의 진단·규례 문맥에서 부자연스럽고, 문장 중간의 직접 호소처럼 들립니다. ‘보기에 그것이 피부보다 더 깊어 보이고’는 원문의 진단적 표현을 자연스럽게 전달합니다. ‘누르스름한’은 색채를 자연스럽게 나타내면서도 원문의 황색 계열 의미를 유지합니다.
  terminology: ‘병변’, ‘부정하다고 판정해야 합니다’, ‘피부병’은 문맥에 적절합니다. נֶתֶק의 현대 의학적 동일시는 불확실하므로 음역 ‘네텍’을 유지하고, 각주에서 전통적 영어 번역어와 불확실성을 밝혀야 합니다. צָרַעַת은 현대 한센병으로 한정하지 않는 ‘피부병’이 적절합니다.
  issues:
