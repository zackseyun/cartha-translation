id: LEV.13.12
reference: Leviticus 13:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת (tzaraath) refers to a range of ritual skin afflictions in Leviticus and should not be equated too narrowly with modern leprosy (Hansen's disease).
    reason: cultural_note
  - marker: b
    text: Or, more literally, 'all the skin of the lesion.' The Hebrew expression refers to the person's skin as affected by the outbreak.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 피부병이 온 피부에 퍼져 나가고, 그 피부병이 그 환자의 머리에서 발까지 모든 피부를 덮어 제사장이 볼 수 있는 온 부위에 이르면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 레위기에서 나타나는 여러 의례적 피부 질환을 가리키며, 현대 의학의 한센병과는 동일시하지 않습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘제사장의 눈에 보이는 모든 것/모든 피부’에 가깝습니다. 여기서는 제사장이 관찰할 수 있는 전 범위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּר֨וֹחַ תִּפְרַ֤ח
  english_pob_choice: breaks out all over
  chosen_korean: 퍼져 나가고
  alternatives_korean:
  - 온몸에 번지고
  - 넓게 퍼지고
  lexicon: HALOT
  rationale: 강조형 동사구가 피부병의 광범위한 확산을 뜻하므로, 자연스러운 현대 한국어로 ‘퍼져 나가고’라고 옮겨 반복과 확산의 뉘앙스를 살렸습니다.
- source_word: הַצָּרַעַת
  english_pob_choice: the skin disease
  chosen_korean: 피부병
  alternatives_korean:
  - 나병
  - 진피병
  - 차라아트
  lexicon: HALOT
  rationale: 레위기의 צָרַעַת는 현대 의학적 ‘나병’과 일치하지 않으므로, 오해를 줄이는 중립적 표현인 ‘피부병’을 택했습니다.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  english_pob_choice: all the skin of the affected person
  chosen_korean: 그 환자의 머리에서 발까지 모든 피부
  alternatives_korean:
  - 그 환자의 온 피부
  - 그 병변의 모든 피부
  lexicon: HALOT
  rationale: 직역하면 ‘병변의 피부’이지만 한국어에서는 대상을 분명히 드러내는 ‘그 환자의…피부’가 의미를 더 잘 전달하므로, 뒤의 신체 범위 표현과 연결해 자연스럽게 풀었습니다.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  english_pob_choice: as far as the priest can see
  chosen_korean: 제사장이 볼 수 있는 온 부위에 이르면
  alternatives_korean:
  - 제사장이 볼 수 있는 데까지
  - 제사장의 눈에 보이는 한도까지
  lexicon: HALOT
  rationale: 관찰 가능한 전 범위를 가리키는 관용구이므로, ‘볼 수 있는 온 부위에 이르면’로 옮겨 제사장의 시야 한계를 반영했습니다.
theological_decisions:
- issue: צָרַעַת의 한국어 처리
  chosen_reading: ‘나병’으로 단정하지 않고 ‘피부병’으로 처리했습니다.
  alternative_readings:
  - 나병
  - 문둥병
  rationale: 본문의 정결/부정 규정에 관한 רָעַת는 현대의 한센병과 동일시하기 어렵기 때문에, 역사적·의례적 범위를 손상하지 않는 표현을 선택했습니다.
  doctrine_reference: 레위기 정결법의 서술적 정확성
- issue: 제사장의 시야 범위를 어떻게 마무리할지
  chosen_reading: ‘제사장이 볼 수 있는 온 부위에 이르면’로 끝맺었습니다.
  alternative_readings:
  - 제사장이 볼 수 있는 대로
  - 제사장이 볼 수 있는 모든 곳에
  rationale: 히브리어는 관찰 가능한 전 범위를 말하며, 판정 행위의 기준이 제사장의 시각적 확인에 있음을 드러내는 방향으로 옮겼습니다.
  doctrine_reference: 레위기 13장의 제의적 판정 구조
