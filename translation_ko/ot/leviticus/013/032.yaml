id: LEV.13.32
reference: Leviticus 13:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
  footnotes:
  - marker: a
    text: Or 'the itch' or, archaically, 'the scall' for the Hebrew נֶתֶק, a specific scaly affliction of the scalp or beard discussed in this section.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 일곱째 날에 그 병변을 살펴보고, 보라, 그 넷째머리병이 퍼지지 않았으며 그 안에 누런 털이 없고 그 넷째머리병의 모습이 피부보다 깊지 않으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 '넷째머리병'은 히브리어 נֶתֶק의 진단명으로, 두피나 수염에 생기는 특정한 비늘성 질환을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: shall examine
  chosen_korean: 살펴보고
  alternatives_korean:
  - 검사하고
  - 보아
  lexicon: HALOT
  rationale: 제사장의 진단 행위라는 문맥을 살려 단순한 시각보다 확인·점검의 뜻이 드러나도록 했습니다.
- source_word: הַנֶּגַע
  english_pob_choice: the diseased area
  chosen_korean: 그 병변
  alternatives_korean:
  - 그 질환 부위
  - 그 병든 곳
  - 그 환부
  lexicon: HALOT
  rationale: לֶגַע 계열의 진단 용어로서, 현대 한국어에서는 '병변'이 가장 중립적이고 정확하게 병든 부위를 가리킵니다.
- source_word: הַנֶּתֶק
  english_pob_choice: the scaly infection
  chosen_korean: 그 넷째머리병
  alternatives_korean:
  - 그 비듬병
  - 그 딱지병
  - 그 비늘병
  lexicon: HALOT
  rationale: 이 절의 مخصوص한 두피/수염 질환 용어를 살리기 위해 병명형 표현을 택했습니다. 다만 한국어 독자에게는 직역형 명칭보다 의미 전달이 어려워, 본문은 진단적 기능을 우선하여 문맥상 같은 병변을 가리키는 말로 처리했습니다.
- source_word: שֵׂעָר צָהֹב
  english_pob_choice: yellow hair
  chosen_korean: 누런 털
  alternatives_korean:
  - 노란 털
  - 황색 털
  lexicon: HALOT
  rationale: 진단 표지로서 털의 색을 직접 묘사하는 표현이므로, 성경 히브리어의 관찰적 어감을 살려 '누런 털'로 옮겼습니다.
- source_word: אֵין עָמֹק מִן הָעוֹר
  english_pob_choice: is not deeper than the skin
  chosen_korean: 피부보다 깊지 않으면
  alternatives_korean:
  - 피부보다 더 깊지 않으면
  - 피부 아래로 패이지 않았으면
  lexicon: HALOT
  rationale: 병변의 함몰 여부를 가리키는 비교 구조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 제사장의 진단 절차를 어떻게 한국어로 드러낼지
  chosen_reading: 제사장은 일곱째 날에 그 병변을 살펴보고
  alternative_readings:
  - 제사장은 일곱째 날에 그 병변을 보고
  - 제사장은 일곱째 날에 그 병변을 검사하고
  rationale: 레위기의 정결 규례에서 제사장은 단순 목격자가 아니라 판정자이므로, 절차적·공적 확인이라는 기능이 드러나도록 했습니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 문맥
- issue: הַנֶּתֶק의 번역 처리
  chosen_reading: 넷째머리병
  alternative_readings:
  - 비듬병
  - 딱지병
  - 두피병
  rationale: 이 항목은 문맥상 특별한 두피 질환을 가리키므로, 뜻을 살리되 한국어 독자에게 병명으로 읽히도록 처리했습니다. 다만 학술적 일관성을 위해 다른 절들과의 용례 정합성을 함께 검토해야 합니다.
  doctrine_reference: 레위기 13장의 피부·두피 진단 규례
