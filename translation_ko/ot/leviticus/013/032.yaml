  - 제사장은 일곱째 날에 그 병변을 검사하고
  rationale: 레위기의 정결 규례에서 제사장은 단순 목격자가 아니라 판정자이므로, 절차적·공적 확인이라는 기능이 드러나도록 했습니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 문맥
- issue: הַנֶּתֶק의 번역 처리
  chosen_reading: 넷째머리병
  alternative_readings:
  - 비듬병
  - 딱지병
  - 두피병
  rationale: 이 항목은 문맥상 특별한 두피 질환을 가리키므로, 뜻을 살리되 한국어 독자에게 병명으로 읽히도록 처리했습니다. 다만 학술적 일관성을 위해 다른 절들과의 용례 정합성을 함께 검토해야 합니다.
  doctrine_reference: 레위기 13장의 피부·두피 진단 규례
