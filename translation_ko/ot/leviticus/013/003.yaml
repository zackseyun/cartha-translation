  to: 제사장은 그 사람의 피부에 있는 병변을 살펴보아야 합니다. 그 병변 부위의 털이 희어졌고 그 병변이 그 사람의 피부보다 더 깊어 보이면, 그것은 피부 질환[a]의 병변입니다. 제사장은 그 사람을 살펴보고 그를 부정하다고 선언해야 합니다.
