  source_fidelity: 개정이 필요합니다. 초안의 ‘문둥병’은 צָרַעַת를 현대의 특정 질병으로 오인하게 하고 낙인적 표현이기도 합니다. 또한 וְטִמֵּא אֹתוֹ는 제사장이 사람을 부정하게 ‘만드는’ 행위가 아니라 그의 의례적 상태를 선언하는 판정입니다. 병변의 털이 희어짐과 병변이 피부보다 깊어 보인다는 두 진단 표지도 명시해야 합니다.
  naturalness: 초안은 구두점과 연결이 부족하고, ‘그 육체의 피부’, ‘그를 본즉’, ‘부정하게 하라’가 현대 표준 한국어 합쇼체로 자연스럽지 않습니다. 문장을 나누고 ‘살펴보아야 합니다’, ‘부정하다고 선언해야 합니다’로 옮기면 명료하고 자연스럽습니다.
  terminology: נֶגַע는 이 문맥에서 ‘병변’으로, צָרַעַת는 현대 한센병과 동일시하지 않는 ‘피부 질환’으로 옮깁니다. ‘부정하다’는 의례적 판정 용어로 유지하되, 선언 행위임을 분명히 합니다.
