base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
  footnotes:
  - marker: a
    text: Or, traditionally, 'a spot of leprosy' / 'a leprous infection.' The Hebrew צָרַעַת refers to a broader category than modern leprosy.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그 사람의 피부에 있는 병변을 살펴보아야 합니다. 그 병변 부위의 털이 희어졌고 그 병변이 그 사람의 피부보다 더 깊어 보이면, 그것은 피부 질환[a]의 병변입니다. 제사장은 그 사람을 살펴보고 그를 부정하다고 선언해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 ‘나병’ 또는 ‘나병성 병변’으로 번역합니다. 히브리어 차라앗(צָרַעַת)은 현대의 한센병에만 한정되지 않는 더 넓은 고대의 피부 질환 및 의례적 부정 범주를 가리킵니다.
    reason: צָרַעַת의 전통적 번역을 밝혀 주면서 현대의 특정 의학적 진단과 동일시하는 오해를 피합니다.
