  source_fidelity: 히브리어는 제사장이 병변(נגע)이 있는 대상을 씻게 하도록 지시하고, 그 대상을 다시 칠 일 동안 가두어 두도록 규정합니다. 초안의 절차 순서와 ‘또 일곱 날’은 대체로 충실합니다. 다만 ‘병변’은 현대 한국어에서 주로 인체·의학 영상의 병리 소견을 가리키므로, 의복·가죽 제품 등을 포함할 수 있는 본문의 넓은 대상을 수식하기에는 부자연스럽고 다소 부정확합니다.
  naturalness: ‘그 안에 병변이 있는 물건’은 한국어로 무겁고 기술적입니다. ‘그 병이 있는 물건’은 원문의 넓은 지시와 관계를 유지하면서도 더 자연스럽습니다. 또한 ‘빨게 하고’보다 ‘빨도록 명령하고’가 וְצִוָּה의 명령 행위와 뒤따르는 복수 수행 주체를 더 분명히 나타냅니다.
