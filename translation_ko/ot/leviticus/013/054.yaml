id: LEV.13.54
reference: Leviticus 13:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/כִ֨בְּס֔וּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּ֑גַע וְ/הִסְגִּיר֥/וֹ שִׁבְעַת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
  footnotes:
  - marker: a
    text: Or 'the article in which the infection is.' The Hebrew expression is intentionally broad and refers to the affected item under examination.
    reason: lexical_alternative
  - marker: b
    text: Or 'isolate it' or more formally 'shut it up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 그 안에 병변이 있는 물건을 빨게 하고, 그것을 또 일곱 날 동안 격리해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 의도적으로 넓어서, 여기서는 검사 중인 오염된 대상 물건을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘격리하다’는 ‘봉쇄하다/가두다’보다 검역 절차를 더 자연스럽게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  english_pob_choice: Then ... shall command
  chosen_korean: 그러면 ... 하게 하고
  alternatives_korean:
  - 그리고 ... 명령하고
  - 그러면 ... 명령해야 합니다
  lexicon: HALOT
  rationale: 법적 절차의 연속을 한국어에서는 자연스럽게 ‘그러면’으로 잇고, 뒤의 수행 동작을 사역형으로 풀어 제사장의 지시를 드러냈습니다.
- source_word: וְכִבְּסוּ
  english_pob_choice: them to wash
  chosen_korean: 빨게 하고
  alternatives_korean:
  - 씻게 하고
  - 세탁하게 하고
  lexicon: HALOT
  rationale: 대상 물건의 정결 처리라는 맥락에서 현대 한국어로는 ‘빨다’가 가장 직접적이며, ‘세탁하다’보다 의례적 행위를 덜 국내화합니다.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  english_pob_choice: the thing in which the infection is
  chosen_korean: 그 안에 병변이 있는 물건
  alternatives_korean:
  - 병변이 있는 그 물건
  - 그 병변이 있는 물건
  lexicon: HALOT
  rationale: 히브리어의 넓은 지시 대상(물건/의복/가죽류)을 살리기 위해 ‘물건’으로 넓게 두고, 문장 안의 관계를 자연스럽게 표현했습니다.
- source_word: וְהִסְגִּירוֹ
  english_pob_choice: and he shall quarantine it
  chosen_korean: 그것을 또 ... 격리해야 합니다
  alternatives_korean:
  - 그것을 또 ... 가둬야 합니다
  - 그것을 또 ... 봉쇄해야 합니다
  lexicon: HALOT
  rationale: 문자적 ‘가두다/가둬두다’보다 검역 절차를 드러내는 ‘격리하다’가 문맥상 더 정확하며, 현대 독자가 이해하기 쉽습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 또
  alternatives_korean:
  - 두 번째로
  - 다시
  lexicon: HALOT
  rationale: 이미 앞의 ‘일곱 날 동안’과 결합되어 반복을 뜻하므로, 한국어에서는 ‘또’로 간결하게 반복성을 살렸습니다.
