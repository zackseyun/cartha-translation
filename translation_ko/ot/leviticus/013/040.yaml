source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יִמָּרֵ֖ט רֹאשׁ֑/וֹ קֵרֵ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
  footnotes:
  - marker: a
    text: Or, 'If a man becomes bald on his head.' The Hebrew verb can denote becoming bare or being stripped of hair; the main text preserves the verbal distinction before 'he is bald.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 사람의 머리털이 빠져 대머리가 되면 그는 대머리입니다. 그는 깨끗합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람이 머리 위에서 대머리가 되면”입니다. 히브리어 동사는 머리카락이 드러나게 되거나 빠져 나가는 상태를 나타낼 수 있으므로, 본문은 ‘대머리가 되다’라는 결과를 앞의 동작과 구분해 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 어떤 사람
  lexicon: HALOT
  rationale: 본문은 남성형 단수로 사례법을 시작하지만, 한국어에서는 이 피부 진단 규정의 일반 사례성을 살려 “사람”으로 자연스럽게 옮겼습니다.
- source_word: יִמָּרֵט רֹאשׁוֹ
  english_pob_choice: loses the hair of his head
  chosen_korean: 머리털이 빠져
  alternatives_korean:
  - 머리의 털이 없어져
  - 머리털이 뽑혀
  lexicon: HALOT
  rationale: יִמָּרֵט는 ‘벗겨지다/빠지다’의 뉘앙스를 지니므로, 원인보다 결과를 드러내는 “머리털이 빠져”가 적절합니다.
- source_word: קֵרֵחַ הוּא
  english_pob_choice: he is bald
  chosen_korean: 그는 대머리입니다
  alternatives_korean:
  - 그는 대머리입니다
  - 그는 민머리입니다
  lexicon: HALOT
  rationale: 뒤의 진술이 상태 판정이므로 현대 한국어의 표준 표현인 “대머리입니다”로 옮겼습니다.
- source_word: טָהוֹר הוּא
  english_pob_choice: he is clean
  chosen_korean: 그는 깨끗합니다
  alternatives_korean:
  - 그는 정결합니다
  - 그는 깨끗합니다
  lexicon: HALOT
  rationale: 레위기의 정결 범주를 한국어로는 보통 “정결”이라 할 수 있지만, 본문은 실제로 피부병 판정의 의례적 무흠/무불결 상태를 말하므로 POB의 ‘clean’을 따라 “깨끗합니다”로 두었습니다.
theological_decisions:
- issue: 정결 판정 용어의 선택
  chosen_reading: 깨끗합니다
  alternative_readings:
  - 정결합니다
  - 순결합니다
  rationale: 이 절은 도덕적 순결이 아니라 의례적 판정에 관한 것이므로, 윤리적 뉘앙스를 덧씌우지 않는 표현을 택했습니다.
