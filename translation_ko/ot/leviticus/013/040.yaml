  text: 어떤 남자의 머리털이 빠지면, 그는 대머리입니다. 그는 정결합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떤 남자의 머리가 벗겨지면”입니다. 히브리어 동사는 머리털이 빠져 머리가 드러나는 것을 뜻할 수 있습니다. 본문은 뒤의 “그는 대머리입니다”와 구별하여 이 동작을 “머리털이 빠지면”으로 옮겼습니다.
    reason: lexical_alternative
