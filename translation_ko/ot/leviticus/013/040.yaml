  source_fidelity: 히브리어는 남성 단수의 조건 사례를 제시하며, 머리털이 빠지는 일(יִמָּרֵט)과 그 결과 상태인 ‘대머리’(קֵרֵחַ), 그리고 의례적 ‘정결’(טָהוֹר)을 구별합니다. 초안은 ‘머리털이 빠져 대머리가 되면’으로 앞의 두 요소를 한 조건절 안에서 중복시키고, טָהוֹר의 의례적 의미를 ‘깨끗합니다’로 다소 일반화합니다.
  naturalness: 초안의 ‘사람의 머리털이 빠져 대머리가 되면 그는 대머리입니다’는 같은 의미가 반복되어 현대 한국어 문장으로 부자연스럽습니다. 조건절은 머리털의 탈락만 나타내고, 이어지는 두 판정문을 분리하는 편이 명료하고 자연스럽습니다.
  terminology: 레위기 13장의 טָהוֹר는 위생적 청결이나 도덕적 깨끗함이 아니라 의례적 상태 판정이므로 ‘정결합니다’가 적절합니다. 남성 단수 사례는 ‘어떤 남자’로 반영했습니다.
