base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת is traditionally rendered 'leprosy,' but in Leviticus it refers more broadly to a range of serious skin conditions rather than specifically Hansen's disease.
    reason: lexical_alternative
  - marker: b
    text: The two terms for baldness likely distinguish the back of the head and the front of the head; rendered here as 'bald head' and 'bald forehead' to preserve the contrast.
    reason: cultural_note
translation:
  language: ko
  text: 제사장이 그 사람을 살펴봅니다. 보십시오, 그 병변의 부어오른 부분이 그의 머리 뒤쪽의 대머리 부위나 이마 쪽의 대머리 부위에[b] 희끄무레하면서 붉은빛이 돌고, 몸의 피부에 생긴 피부병[a]의 모양과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 전통적으로 ‘나병’으로 옮겨지지만, 레위기에서는 한센병에만 한정되지 않는 더 넓은 피부 질환을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 두 대머리 관련 용어는 아마도 머리 뒤쪽과 앞쪽의 대머리 부위를 구별합니다. 번역에서는 그 대비를 드러냈습니다.
    reason: cultural_note
