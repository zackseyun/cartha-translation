theological_decisions:
- issue: צָרַעַת의 범주를 어떻게 한국어로 드러낼지
  chosen_reading: 전통 교회어 ‘나병’보다 진단적·범주적 표현인 ‘피부병’을 사용했습니다.
  alternative_readings:
  - 나병
  - 문둥병
  rationale: 본문 자체가 제사장 진단의 법문맥에 있으므로, 특정 질병명으로 고정하기보다 광범위한 피부 상태를 가리키는 의미를 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: Leviticus 13 diagnostic legislation
- issue: 색채 표현의 순서
  chosen_reading: ‘붉은빛이 도는 희끄무레한’으로 혼합 색채를 살렸습니다.
  alternative_readings:
  - 희끄무레한 붉은빛의
  - 붉은색과 흰색이 섞인
  rationale: 히브리어의 이중 색채 형용사를 한쪽으로 평준화하지 않고, 시각적 불안정성과 진단적 모호성을 그대로 보존했습니다.
  doctrine_reference: source-level semantic precision
