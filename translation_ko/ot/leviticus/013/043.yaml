- from: 제사장은 그 사람을 살펴봅니다. 보십시오, 질병의 부어오른 자국이 그의 대머리나 대머리 이마에 붉은빛이 도는 희끄무레한 빛을 띠니, 살에 생긴 피부병의 모양과 같습니다.[a][b]
  to: 제사장이 그 사람을 살펴봅니다. 보십시오, 그 병변의 부어오른 부분이 그의 머리 뒤쪽의 대머리 부위나 이마 쪽의 대머리 부위에[b] 희끄무레하면서 붉은빛이 돌고, 몸의 피부에 생긴 피부병[a]의 모양과 같습니다.
  rationale: 병변을 뜻하는 표현을 자연스럽고 원문에 가까운 ‘그 병변의 부어오른 부분’으로 고쳤습니다. 두 대머리 부위는 머리 뒤쪽과 이마 쪽으로 구별하여 원문의 대비를 보존하되, 확정하기 어려운 세부 구분은 각주에서 유보했습니다. 색채는 흰색이면서 붉은 기가 도는 원문의 복합 표현을 보존했고, 각주 앵커를 해당 어휘에 배치했습니다.
