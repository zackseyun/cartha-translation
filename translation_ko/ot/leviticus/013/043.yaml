  verdict: revise
  source_fidelity: 전반적인 진단·관찰 문맥과 צָרַעַת를 특정 한센병으로 한정하지 않은 점은 적절합니다. 다만 שְׂאֵת הַנֶּגַע의 ‘질병의 부어오른 자국’은 한국어 결합이 부자연스럽고, 두 대머리 부위의 대조가 ‘대머리나 대머리 이마’에서 충분히 드러나지 않습니다. 색채는 히브리어의 순서를 따라 ‘희끄무레하면서 붉은빛이 도는’으로 조정했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, 병변의 상태와 위치, 비교 진술을 자연스럽게 연결합니다. ‘살에 생긴 피부병’은 다소 어색하므로 ‘몸의 피부에 생긴 피부병’으로 풀어 썼습니다.
  terminology: ‘제사장’, ‘병변’, ‘피부병’은 본문의 의례적·진단적 문맥에 적절합니다. צָרַעַת는 ‘피부병’으로 유지하고, 각주에서 전통적 ‘나병’과의 차이를 설명합니다. קָרַחַת/גַּבַּחַת의 정확한 해부학적 구분에는 불확실성이 있으므로 각주에서 ‘아마도’라는 유보를 유지했습니다.
