id: LEV.13.46
reference: Leviticus 13:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
  footnotes:
  - marker: a
    text: Or 'the affliction' or 'the plague' for 'the disease.' The Hebrew term is broad and refers here to the diagnosed condition described in this chapter.
    reason: lexical_alternative
  - marker: b
    text: '''Unclean'' here refers to Levitical impurity status in the context of the law, not necessarily to moral guilt.'
    reason: cultural_note
translation:
  language: ko
  text: 그에게 그 질병[a]이 있는 모든 날 동안, 그는 부정한 상태에 있어야 합니다. 그는 부정한 상태입니다.[b] 그는 홀로 살아야 하며, 그의 거처는 진 밖에 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질병’으로 옮긴 히브리어는 더 넓은 뜻을 지니며, ‘병변’ 또는 ‘재앙’으로도 옮길 수 있습니다. 여기서는 이 장에서 진단되는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘부정한 상태’는 도덕적 죄책이라기보다 레위기 율법 맥락의 의례적 부정 상태를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  english_pob_choice: the disease
  chosen_korean: 그 질병
  alternatives_korean:
  - 그 병
  - 그 재앙
  - 그 환부
  lexicon: HALOT
  rationale: 레위기 13장의 진단된 피부/질환 상태를 가리키는 넓은 말로, 문맥상 현대 한국어에서는 ‘질병’이 가장 분명합니다.
- source_word: יִטְמָא / טָמֵא הוּא
  english_pob_choice: shall be unclean / He is unclean
  chosen_korean: 부정하게 됩니다 / 그는 부정합니다
  alternatives_korean:
  - 부정할 것입니다 / 그는 부정합니다
  - 부정한 상태가 됩니다 / 그는 부정합니다
  lexicon: HALOT
  rationale: קדושה 문맥의 의례적 부정을 한국어 ‘부정하다’로 옮겨, 도덕적 죄책이 아니라 율법적 상태를 드러냈습니다.
- source_word: בָּדָד יֵשֵׁב
  english_pob_choice: He shall live alone
  chosen_korean: 그는 홀로 살아야 하며
  alternatives_korean:
  - 그는 혼자 거해야 하며
  - 그는 고립되어 살아야 하며
  lexicon: HALOT
  rationale: בָּדָד의 분리 상태를 ‘홀로’로 직접 살리고, יֵשֵׁב은 거주/체류의 지속성을 한국어로 자연스럽게 표현했습니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진 밖에
  alternatives_korean:
  - 진영 밖에
  - 진 밖에서
  lexicon: HALOT
  rationale: 광야 공동체의 표준 표현을 따라 ‘진’으로 옮겨, 공동체와의 분리를 분명히 했습니다.
theological_decisions:
- issue: טמא의 의미
  chosen_reading: 주본문에서는 ‘부정하게 됩니다 / 부정합니다’로 두어, 의례적 부정 상태를 직접 드러내되 ‘의례적으로’라는 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - 의례적으로 부정하게 됩니다
  - 정결하지 않게 됩니다
  rationale: 본문은 율법적 부정 상태를 선언할 뿐이므로, 의미를 과도하게 해설하지 않고 본래의 범주를 보존하는 것이 적절합니다.
  doctrine_reference: 레위기 정결 규례의 서술을 그대로 유지하여 본문의 제의적 긴장을 보존합니다.
