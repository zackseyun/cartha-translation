  source_fidelity: 히브리어의 반복된 부정 상태 선언(יִטְמָא טָמֵא הוּא), 홀로 거주하라는 규정, 그리고 진 밖의 거처를 충실히 보존합니다. בּוֹ는 한국어 어법상 ‘그에게 그 질병이 있는’으로 옮겨 질병이 그 사람에게 있는 상태를 자연스럽게 나타냈습니다.
  naturalness: 초안의 ‘그 사람 안에 있는’과 ‘그는 부정합니다’는 현대 표준 한국어에서 부자연스럽거나 다른 뜻으로 이해될 여지가 있습니다. ‘그에게 그 질병이 있는’ 및 ‘부정한 상태입니다’는 합쇼체 문체를 유지하면서 율법상의 상태를 분명히 합니다.
  terminology: טָמֵא는 본문에서 ‘부정한 상태’로 일관되게 옮기고, 의례적 성격은 각주에서만 설명했습니다. נֶגַע의 폭넓은 의미를 보존하도록 각주를 다듬었으며, ‘진’은 광야 공동체 문맥에 적절합니다.
