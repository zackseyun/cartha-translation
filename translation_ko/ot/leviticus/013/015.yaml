  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
  footnotes:
  - marker: a
    text: Hebrew 'living flesh'; traditionally rendered 'raw flesh.'
    reason: lexical_alternative
  - marker: b
    text: Or 'declare him unclean.' The priest is making an official purity ruling.
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'leprosy,' but the Hebrew term refers more broadly to a skin disease or condition, not specifically modern leprosy.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그 생살[a]을 보면, 그를 부정하다고 선언해야 합니다. 그 생살은 부정합니다. 이것은 피부병[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘살아 있는 살’입니다. 전통적으로 ‘생살’로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로 ‘나병’으로 번역하지만, 히브리어 צָרַעַת는 현대의 나병만을 가리키지 않고 더 넓은 피부 질환 또는 상태를 가리킵니다.
    reason: lexical_alternative
