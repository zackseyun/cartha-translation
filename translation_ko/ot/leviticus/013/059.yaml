  source_fidelity: 히브리어는 옷감·직조의 날실과 씨실·가죽 물건에 나타난 נגע צָרַעַת에 관한 판정 규례를 요약합니다. 초안의 ‘나병 재앙’은 נֶגַע를 ‘재앙’으로 과장하고 현대 의학적 나병을 직접 적용하는 인상을 주며, ‘가죽 그릇’은 כְּלִי עוֹר의 넓은 뜻을 부당하게 좁힙니다. ‘정결/부정’과 판정 행위는 의례·법적 문맥에 더 정확합니다.
  naturalness: ‘양털 옷감/베옷감’도 이해되지만 원문의 בֶּגֶד에 맞는 ‘양털 옷/베옷’이 더 직접적입니다. ‘나병성 병변’은 이 용어가 사람뿐 아니라 물체에도 적용되는 본문의 비현대적·의례적 용법을 보존하면서 ‘나병 재앙’보다 자연스럽고 덜 오도적입니다. 문장은 현대 한국어 합쇼체에 맞게 정리했습니다.
  terminology: ‘규례’는 이 절의 절차적 תּוֹרָה에 적절하며, ‘정결하다/부정하다’는 לְטַהֲרוֹ/לְטַמְּאוֹ의 제사장적 판정을 일관되게 반영합니다. 날실/씨실은 표준 직조 용어입니다. 기존 각주에는 씨실을 다시 씨실로 풀이하는 오류가 있고 본문 표지 [a]와 내용도 맞지 않으므로 삭제했습니다.
  issues:
