    rationale: כְּלִי는 그릇에 한정되지 않고 물건·기구를 폭넓게 뜻합니다. ‘가죽 물건’이 원문의 범위를 보존합니다.
  - severity: medium
    issue: ‘깨끗하다고’
    rationale: 제사장적 정결/부정 판정 문맥이므로 ‘정결하다’가 의례적 상태를 더 정확히 나타냅니다.
  - severity: high
