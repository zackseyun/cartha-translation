id: LEV.13.59
reference: Leviticus 13:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
  footnotes:
  - marker: a
    text: Or 'the weft' for 'the woof'; both refer to the crosswise threads in woven fabric, paired with 'warp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 양털 옷이나 베옷, 또는 날실이나 씨실, 또는 어떤 가죽 물건에 생긴 나병성 병변을 정결하다고 판정하거나 부정하다고 판정하기 위한 규례입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  english_pob_choice: the law for
  chosen_korean: 율법
  alternatives_korean:
  - 규정
  - 지침
  lexicon: HALOT
  rationale: 문맥상 제사장이 적용할 판정 규정이므로, POB의 'law'를 한국어 '율법'으로 옮기되 구체적 적용 대상을 드러내는 표현은 본문 흐름에 따라 유지했습니다.
- source_word: נֶגַע צָרַעַת
  english_pob_choice: outbreak of leprous disease
  chosen_korean: 나병 재앙
  alternatives_korean:
  - 나병 발생
  - 나병의 발현
  - 문둥병 재앙
  lexicon: HALOT
  rationale: 직역하면 '나병의 재앙/발생'에 가깝고, 본문은 사람의 피부뿐 아니라 옷감과 가죽에도 적용되므로 단순 의학명보다 상태의 발생을 나타내는 표현을 택했습니다. '재앙'은 נגַע의 व्यापक한 해로운 발생을 살리지만 과도한 질병 명칭을 피합니다.
- source_word: בֶּגֶד הַצֶּמֶר / הַפִּשְׁתִּים
  english_pob_choice: a wool garment / a linen garment
  chosen_korean: 양털 옷감 / 베옷감
  alternatives_korean:
  - 양모 옷감 / 린넨 옷감
  - 양털로 된 옷 / 아마포 옷
  lexicon: HALOT
  rationale: 원어는 각각 양털과 아마(린넨/베)로 된 직물을 가리키므로, 옷'감'으로 옮겨 감염 대상이 '직물'임을 분명히 했습니다. POB의 'garment'는 한국어에서는 소재를 드러내는 옷감이 더 자연스럽습니다.
- source_word: הַשְּׁתִי / הָעֵרֶב
  english_pob_choice: the warp / the woof
  chosen_korean: 날실 / 씨실
  alternatives_korean:
  - 경사 / 위사
  - 날줄 / 씨줄
  lexicon: HALOT
  rationale: 직조 기술 용어이므로 표준적인 한국어 대응인 '날실/씨실'을 택했습니다. POB가 주석으로 'woof'와 'weft'의 대안을 밝힌 점은 한국어 본문에서는 기본 용어로 충분히 전달됩니다.
- source_word: כָּל כְּלִי עוֹר
  english_pob_choice: any leather article
  chosen_korean: 어떤 가죽 그릇
  alternatives_korean:
  - 어떤 가죽 물건
  - 어떤 가죽 제품
  - 어떤 가죽 기물
  lexicon: HALOT
  rationale: כְּלִי는 그릇/도구/물건을 포괄하지만, POB의 범용 표현에 맞춰 법적 분류를 지나치게 좁히지 않는 '그릇'을 택했습니다. '가죽 그릇'은 전통적 법규 문체와도 어울립니다.
- source_word: לְטַהֲרוֹ / לְטַמְּאוֹ
  english_pob_choice: for pronouncing it clean / pronouncing it unclean
  chosen_korean: 깨끗하다고 판정하거나 부정하다고 판정하기
  alternatives_korean:
  - 깨끗하다고 선언하거나 부정하다고 선언하기
  - 정결하다고 판정하거나 부정하다고 판정하기
  lexicon: HALOT
  rationale: 제사장적 판정 행위를 드러내기 위해 '판정하다'를 사용했습니다. 다만 POB의 'clean/unclean'을 한국어 일상어로 풀어, 의례적 상태 판별이라는 법정적 기능을 유지했습니다.
theological_decisions:
- issue: Leviticus 13의 צָרַעַת을 옷감과 가죽에 적용할 때의 번역어
  chosen_reading: 나병 재앙
  alternative_readings:
  - 문둥병
  - 나병
  - 부정하게 하는 병변
  rationale: 이 단어는 현대 의학적 '나병'과 일치하지 않지만, 본문은 이미 사람이 아닌 직물과 가죽까지 포괄합니다. 그래서 질환 이름을 완전히 바꾸기보다, POB의 'leprous disease'에 대응하는 말로 유지하되 대상이 의례적 오염 판정의 근거임을 드러냈습니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
