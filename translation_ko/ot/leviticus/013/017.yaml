  to: 제사장은 그것을 살펴보아야 합니다[a]. 보십시오, 그 환부가 하얗게 변해 있으면, 제사장은 그 환부를 정결하다고 선언해야 합니다[b][c]. 그것은 정결합니다.
  rationale: 안전하고 필수적인 수정은 ‘부정하다’를 ‘정결하다고 선언하다’로 고치는 것입니다. 이는 וְטִהַר와 טָהוֹר הוּא의 반복된 정결 어휘 및 영어 POB 감사 기록에 일치하며, 제사장의 행위를 치유가 아닌 의례적 판정으로 나타냅니다. 이에 맞추어 상충되던 각주 b를 정비하고, 각주 c는 이문이 아닌 문법적 설명으로 수정했습니다.
