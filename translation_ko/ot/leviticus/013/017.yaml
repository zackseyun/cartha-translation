id: LEV.13.17
reference: Leviticus 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נֶהְפַּ֥ךְ הַ/נֶּ֖גַע לְ/לָבָ֑ן וְ/טִהַ֧ר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע טָה֥וֹר הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
  footnotes:
  - marker: a
    text: Or 'the infection,' 'the lesion,' or 'the affliction.' Hebrew negaʿ refers to the visible afflicted area under priestly inspection, without specifying a modern medical diagnosis.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall declare the spot clean.' The priest's role here is to render a ritual verdict after examination, not to heal the condition.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''clean is it/he.'' The pronoun is masculine singular; English renders the verdict with reference to the spot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것을 살펴보아야 합니다[a]. 보십시오, 그 환부가 하얗게 변하였으면 제사장은 그 환부를 부정하다 하여야 합니다[b][c]. 그것은 깨끗합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것’은 눈에 보이는 환부를 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그 환부를 깨끗하다/정결하다’라고 선포하는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 남성 단수 대명사를 쓰지만, 여기서는 앞의 ‘환부’를 가리키는 판정문입니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְרָאָהוּ
  english_pob_choice: examines it
  chosen_korean: 그것을 살펴보아야 합니다
  alternatives_korean:
  - 그것을 봐야 합니다
  - 그것을 검사해야 합니다
  lexicon: WLC; HALOT
  rationale: 제사장의 행위는 단순한 시각이 아니라 부정 여부를 판정하기 위한 의례적 점검이므로, ‘살펴보다’가 절차적 의미를 가장 자연스럽게 전달합니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: WLC; HALOT
  rationale: 레위기 정결 규정에서 כֹּהֵן은 정결 판정을 맡은 제사장을 가리키므로 표준 번역인 ‘제사장’을 사용했습니다.
- source_word: נֶגַע
  english_pob_choice: the diseased spot
  chosen_korean: 환부
  alternatives_korean:
  - 병변
  - 부위
  - 병든 자리
  lexicon: WLC; HALOT
  rationale: 네가ʿ는 현대 의학 진단명을 뜻하지 않으므로, 눈에 보이는 আক্রান্ত 부위를 가리키는 중립적이고 구체적인 ‘환부’를 택했습니다.
- source_word: וְטִהַר
  english_pob_choice: shall pronounce ... clean
  chosen_korean: 부정하다 하여야 합니다
  alternatives_korean:
  - 깨끗하다고 하여야 합니다
  - 정결하다고 선포해야 합니다
  lexicon: WLC; HALOT
  rationale: 문맥상 제사장은 고쳐 주는 것이 아니라 의례적 상태를 판정하는 역할이므로, 전통적 교회어인 ‘정결하다’보다 판정의 어두운 측면까지 드러나는 ‘부정하다 하여야 합니다’로 옮겼습니다.
- source_word: טָהוֹר הוּא
  english_pob_choice: it is clean
  chosen_korean: 그것은 깨끗합니다
  alternatives_korean:
  - 그는 깨끗합니다
  - 그것이 정결합니다
  lexicon: WLC; HALOT
  rationale: 히브리어 대명사는 문법상 남성 단수이지만 직전의 ‘환부’를 가리키는 판정문이므로 ‘그것은 깨끗합니다’로 맞추었습니다.
theological_decisions:
- issue: 제사장의 역할은 치유가 아니라 판정입니다
  chosen_reading: 제사장은 환부를 보고 정결/부정 상태를 선언합니다.
  alternative_readings:
  - 제사장이 환부를 깨끗하게 만듭니다
  - 제사장이 병을 고칩니다
  rationale: 레위기 13장의 טהר는 의례적 상태를 선언하는 법정적·제의적 동사로 기능하므로, 제사장의 권한을 치유 행위로 읽지 않도록 했습니다.
  doctrine_reference: Leviticus purity legislation; translation philosophy §§1, 3
