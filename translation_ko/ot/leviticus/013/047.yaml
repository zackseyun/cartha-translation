  rationale: 전통적 대응어를 유지하되, 본문 전체의 정결 규례 맥락에서 더 익숙한 한국어 성경 용례를 반영해 ‘문둥병’으로 옮겼습니다. 다만 이 शब्द는 현대적 나병과 동일시되지 않는다는 점은 각주로 보완했습니다.
- source_word: בְּבֶגֶד צֶמֶר / בְּבֶגֶד פִּשְׁתִּים
  english_pob_choice: in a wool garment / in a linen garment
  chosen_korean: 양털 옷이든 아마포 옷이든
  alternatives_korean:
  - 양털로 만든 옷이든 아마포 옷이든
  - 모직 옷이든 린넨 옷이든
  lexicon: HALOT
  rationale: 문장의 나열 구조를 한국어에서 자연스럽게 보이도록 ‘-이든 … -이든’으로 처리하되, 재질 정보인 양털/아마포를 직접 드러냈습니다.
theological_decisions:
- issue: צָרַעַת의 범주
  chosen_reading: ‘문둥병’으로 번역하되, 현대 의학적 질병명보다 의식적 부정 상태를 포괄하는 더 넓은 범주임을 각주로 밝혔습니다.
  alternative_readings:
  - 현대적 ‘나병’
  - ‘피부병’
  rationale: 레위기 13장의 צָרַעַת은 옷에까지 적용되는 정결 규례 용어이므로, 단순한 현대 질병명으로 좁히지 않도록 주의가 필요합니다.
  doctrine_reference: 레위기 정결법과 의식적 부정 개념
