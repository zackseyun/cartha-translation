  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
  footnotes:
  - marker: a
    text: Hebrew tsaraath, traditionally rendered 'leprosy,' refers here to a broader category of diseased or contaminated conditions, including those affecting garments, not specifically modern Hansen's disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 옷에 문둥병[a]의 발병이 있어서, 양털 옷이든 아마포 옷이든
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 전통적으로 ‘문둥병’으로 옮기지만, 여기서는 옷에까지 적용되는 더 넓은 부정·손상 상태를 가리키며 현대의 한센병과 동일하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  english_pob_choice: a garment
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 한 벌의 옷
  lexicon: HALOT
  rationale: 히브리어 בגד는 여기서 검사 대상이 되는 의복을 가리키므로, 법문체에 자연스러운 일반명사 ‘옷’으로 옮겼습니다.
- source_word: נֶגַע
