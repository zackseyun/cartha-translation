  - 부패
  - 오염
  lexicon: HALOT
  rationale: 피부병 문맥의 ‘outbreak’를 옷에 적용할 때도 눈에 띄는 발생·발현을 살리는 말이 필요해 ‘발병’으로 옮겼습니다.
- source_word: צָרָעַת
  english_pob_choice: leprosy
  chosen_korean: 문둥병
  alternatives_korean:
