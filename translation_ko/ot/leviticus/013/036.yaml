base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
  footnotes:
  - marker: a
    text: Or 'the itch' for the Hebrew term referring to a scaly skin condition, especially on the head or beard.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그를 살펴보아 그 비늘성 피부병[a]이 피부에 퍼져 있는 것을 보면, 제사장은 누런 털이 있는지 살필 필요가 없습니다. 그는 부정한 상태입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가려움’. 히브리어는 특히 머리나 수염 부위에 생기는 비늘성 피부 이상을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  english_pob_choice: and the priest examines him
  chosen_korean: 제사장이 그를 살펴보고
  alternatives_korean:
  - 제사장이 그를 보고
  - 제사장이 그를 검사하고
  lexicon: HALOT
  rationale: 제의적 판정 맥락의 ראה는 단순한 시각보다 판정 목적의 점검을 뜻하므로, 한국어로는 자연스럽게 ‘살펴보다’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 보십시오
  lexicon: HALOT
  rationale: 목격된 상태를 강조하는 지시 표현으로, 합쇼체 본문에서는 ‘보라’가 간결하고 장면 전환의 힘을 살립니다.
- source_word: הַנֶּתֶק
  english_pob_choice: the scaly infection
  chosen_korean: 그 딱지병
  alternatives_korean:
  - 그 비늘병
  - 그 피부병
  - 그 각질성 감염
  lexicon: HALOT
  rationale: 레위기 13장의 נתק은 두피/수염의 특정한 피부 이상을 가리키므로, 전통적이지만 오해를 줄 수 있는 단순 ‘병’보다 문맥상 구체적인 ‘딱지병’을 선택했습니다.
- source_word: לֹא יְבַקֵּר
  english_pob_choice: need not look for
  chosen_korean: 더 살필 필요가 없습니다
  alternatives_korean:
  - 더 조사할 필요가 없습니다
  - 더 확인할 필요가 없습니다
  lexicon: HALOT
  rationale: בקר는 진단적 점검을 뜻하므로, 이미 퍼짐이 확인되면 추가 확인이 불필요하다는 뉘앙스를 살려 표현했습니다.
- source_word: טָמֵא הוּא
  english_pob_choice: he is unclean
  chosen_korean: 그는 부정합니다
  alternatives_korean:
  - 그는 부정한 상태입니다
  - 그는 부정합니다
  lexicon: HALOT
  rationale: 레위기 13장의 טָמֵא는 도덕적 비난이 아니라 의례적 부정 상태를 선언하는 법정식 표현이므로, 한국어 본문에서도 상태 판정의 힘을 살린 ‘부정합니다’를 택했습니다.
theological_decisions:
- issue: טָמֵא의 의미를 도덕적 죄가 아니라 제의적 부정 상태로 유지할지
  chosen_reading: 본문의 선언은 사람의 죄책이 아니라 정결/부정 규정에 따른 의례적 부정 판정입니다.
  alternative_readings:
  - 도덕적으로 더럽습니다
  - 불결합니다
  rationale: 레위기 13장의 문맥은 정결법 판정이므로, 윤리적 의미로 오해될 수 있는 표현은 피하고 법적·제의적 상태를 드러내는 번역을 유지했습니다.
  doctrine_reference: Leviticus purity laws
