translation:
  language: ko
  text: 남자나 여자나 머리나 수염에 헌데가 생기면
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자나
  alternatives_korean:
  - 남자든 여자든
  - 남자나 여자
  lexicon: HALOT
  rationale: 히브리어가 남자와 여자를 각각 명시하므로, 한국어에서도 둘을 모두 드러내되 법문체에 맞게 간결하게 옮겼습니다.
- source_word: כִּי יִהְיֶה בּוֹ
  english_pob_choice: has
  chosen_korean: 생기면
  alternatives_korean:
  - 있으면
  - 가지게 되면
  lexicon: HALOT
  rationale: 진단 규정의 사례 조건으로 자연스럽게 읽히도록 ‘생기면’으로 옮겼습니다. 이는 ‘그에게 있다’는 직역을 한국어 법률·의학 문맥에 맞게 다듬은 것입니다.
- source_word: נָגַע
  english_pob_choice: infection
  chosen_korean: 헌데
  alternatives_korean:
  - 부정한 환부
  - 질환
  - 종기
  lexicon: HALOT
  rationale: 레위기 13장의 נגע는 특정 현대 의학 진단명이 아니라 눈에 보이는 병변/이상을 가리키므로, 의미를 과도하게 좁히지 않으면서도 문맥상 자연스러운 ‘헌데’로 옮겼습니다.
- source_word: בְּ/רֹאשׁ ... בְ/זָקָן
  english_pob_choice: on the head or on the beard
  chosen_korean: 머리나 수염에
  alternatives_korean:
  - 머리나 턱수염에
  - 머리나 수염 위에
  lexicon: HALOT
  rationale: 전치사 בְּ는 여기서 병변의 위치를 표시하므로 한국어에서는 ‘~에’로 자연스럽게 처리했습니다. ‘머리’와 ‘수염’은 원문을 그대로 반영합니다.
