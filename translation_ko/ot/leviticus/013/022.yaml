base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
  footnotes:
  - marker: a
    text: Or 'declare him unclean.' The Hebrew verb can be rendered either way in priestly legal contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'a disease,' 'a plague,' or 'an infected spot.' The Hebrew term is broad and does not map neatly onto a modern medical category.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것이 피부에 번지면[a], 제사장은 그를 부정하다고 판정해야 합니다[b]. 이는 환부입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피부에서 퍼지면’이라고 할 수 있습니다. 히브리어는 동사의 반복으로 확산을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 부정하다고 선언해야 합니다.’ 여기서 제사장은 부정 상태를 만들어 내는 것이 아니라 그 의례적 상태를 공식적으로 판정합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘네가’는 환부, 병증, 재앙 등으로 옮길 수 있는 넓은 말이며, 특정 현대 의학적 진단명과 정확히 일치하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …면
  alternatives_korean:
  - 그리고 만약 …면
  - 만약 …면
  lexicon: HALOT
  rationale: 앞 문맥의 조건문에 이어지는 대비를 살려, 단순한 ‘만약’보다 ‘그러나’로 전환감을 드러냈습니다.
- source_word: פָּשֹׂה תִפְשֶׂה
  english_pob_choice: it does spread
  chosen_korean: 번지면
  alternatives_korean:
  - 퍼지면
  - 점점 번지면
  - 계속 번지면
  lexicon: HALOT
  rationale: 강조형 구문이지만 한국어에서는 자연스럽게 ‘번지다’로 압축해, 확산의 진행성을 무리 없이 살렸습니다.
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  english_pob_choice: the priest shall pronounce him unclean
  chosen_korean: 제사장은 그를 부정하다고 선언해야 합니다
  alternatives_korean:
  - 제사장은 그를 부정하다고 판정해야 합니다
  - 제사장은 그를 부정하게 해야 합니다
  lexicon: HALOT
  rationale: 제의적 법문맥에서 טמא는 원인 행위보다 공식적 판정을 뜻하므로, ‘선언하다’로 옮겨 법정적·의례적 뉘앙스를 보존했습니다.
- source_word: נֶגַע
  english_pob_choice: an infection
  chosen_korean: 하나의 병변
  alternatives_korean:
  - 하나의 질환
  - 하나의 재앙
  - 하나의 감염된 부위
  lexicon: HALOT
  rationale: 현대 의학 범주를 단정하지 않도록 넓은 의미의 ‘병변’을 택했고, 히브리어의 포괄성을 유지했습니다.
theological_decisions:
- issue: 제사장의 역할이 상태를 ‘만드는 것’인지 ‘선언하는 것’인지
  chosen_reading: 제사장은 그 사람을 실제로 더럽히는 것이 아니라, 의례적 상태를 공식적으로 선언합니다.
  alternative_readings:
  - 제사장은 그를 부정하게 합니다
  rationale: 레위기 13장의 제의적 진단 문맥에서는 제사장의 말이 법적 판정으로 기능하므로, 인과적 의미로 오해되지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
