revisions:
- from: 제사장이 그를 일곱째 날에 살펴보고, 만일 그것이 피부에서 실제로 퍼졌으면, 제사장은 그를 부정하다고 선언해야 합니다. 그것은 악성 피부병의 흔적입니다.[a]
  to: 제사장이 일곱째 날에 그를 살펴보아, 만일 그것이 피부에 분명히 퍼졌으면, 제사장은 그를 부정하다고 판정해야 합니다. 그것은 피부 질환의 병변입니다.[a]
  rationale: 원문의 נֶגַע צָרַעַת(‘피부 질환의 병변’)라는 구성 관계를 보존하고, 현대 의학적 진단이나 ‘악성’이라는 원문 밖의 한정을 피했습니다. 퍼짐을 강조하는 부정사 절대형은 ‘분명히’로, 제사장의 공식적 정결 판정은 ‘부정하다고 판정해야 합니다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:19Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 진단 절차, 일곱째 날의 재검, 퍼짐의 강조, 제사장의 의례적 판정은 대체로 반영되었습니다. 그러나 צָרַעַת에 ‘악성’을 덧붙인 것은 원문에 없는 의학적·가치적 한정을 가하며, נֶגַע를 ‘흔적’으로 옮긴 것도 병변/환부를 뜻하는 원문의 명사와 맞지 않습니다.
  naturalness: ‘피부 질환의 병변’은 다소 기술적이지만 레위기 13장의 진단·판정 문맥에서 자연스럽고 정확합니다. ‘살펴보아’와 ‘판정해야 합니다’는 현대 표준어 합쇼체의 절차적 문체에 잘 맞습니다.
  terminology: כֹּהֵן은 ‘제사장’, טמא의 판정은 ‘부정하다고 판정하다’로 유지합니다. צָרַעַת은 현대 한센병으로 단정하지 않도록 ‘피부 질환’으로 옮기고, נֶגַע는 ‘병변’으로 구별합니다. ‘악성’은 삭제해야 합니다.
