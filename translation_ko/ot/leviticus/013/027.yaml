id: LEV.13.27
reference: Leviticus 13:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
  footnotes:
  - marker: a
    text: Traditionally rendered 'leprosy.' The Hebrew term refers more broadly to a serious skin condition in Israel's purity laws, not necessarily modern leprosy (Hansen's disease).
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그를 일곱째 날에 살펴보고, 만일 그것이 피부에서 실제로 퍼졌으면, 제사장은 그를 부정하다고 선언해야 합니다. 그것은 악성 피부병의 흔적입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת은 전통적으로 ‘나병’으로 옮겨졌지만, 레위기 정결법 문맥에서는 현대 한센병과 일치하지 않는 더 넓은 피부 질환 범주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  english_pob_choice: shall examine him
  chosen_korean: 살펴보고
  alternatives_korean:
  - 보아
  - 검사하고
  lexicon: HALOT
  rationale: 제사장의 진단적 확인을 뜻하므로 단순한 ‘보다’보다 ‘살펴보다’가 문맥상 자연스럽고, 영어 POB의 ‘examine’에 대응합니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: on the seventh day
  chosen_korean: 일곱째 날에
  alternatives_korean:
  - 제7일에
  - 일곱 날째에
  lexicon: HALOT
  rationale: 히브리어의 날짜 표지를 현대 한국어에서 가장 자연스럽게 옮긴 표현입니다.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  english_pob_choice: if it has indeed spread
  chosen_korean: 만일 그것이 실제로 퍼졌으면
  alternatives_korean:
  - 만일 그것이 확실히 퍼졌으면
  - 만일 더 퍼졌으면
  lexicon: HALOT
  rationale: 강조를 나타내는 부정사절+동사 구조를 ‘실제로’로 살려, 단순 가능성이 아니라 확인된 진행을 드러냈습니다.
- source_word: וְטִמֵּא ... אֹתוֹ
  english_pob_choice: the priest shall pronounce him unclean
  chosen_korean: 제사장은 그를 부정하다고 선언해야 합니다
  alternatives_korean:
  - 제사장은 그를 부정하게 해야 합니다
  - 제사장은 그를 부정하다고 판정해야 합니다
  lexicon: HALOT
  rationale: 정결 규례 문맥에서는 제사장이 오염을 ‘만드는’ 것이 아니라 공식 판정을 내리므로, ‘선언하다’로 옮겼습니다.
- source_word: צָרַעַת
  english_pob_choice: skin disease
  chosen_korean: 악성 피부병
  alternatives_korean:
  - 피부병
  - 나병
  lexicon: HALOT
  rationale: 영어 POB가 현대 의학적 오해를 피하려 ‘skin disease’를 택한 점을 반영하되, 레위기의 부정함을 암시하는 맥락상 단순 ‘피부병’보다 ‘악성 피부병’이 더 적합합니다.
theological_decisions:
- issue: צָרַעַת의 번역이 현대 의학명과 충돌하는 문제
  chosen_reading: 악성 피부병
  alternative_readings:
  - 나병
  - 피부병
  rationale: 본문은 현대의 한센병을 지칭한다기보다 정결 규례 안의 진단 범주를 가리키므로, 오역을 피하면서도 질환의 गंभीर성을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1 (원문 우선), §6 (현대 독자에게 명료한 표현)
- issue: 제사장의 행위 표현
  chosen_reading: 부정하다고 선언해야 합니다
  alternative_readings:
  - 부정하게 해야 합니다
  - 부정하다고 판정해야 합니다
  rationale: 레위기 13장의 제사장은 의례적 상태를 공식적으로 판정하는 역할이므로, 독자가 결과를 ‘법적/의례적 선언’으로 이해하도록 했습니다.
  doctrine_reference: 정결 규례 문맥의 제사장 기능
