  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
  footnotes:
  - marker: a
    text: Or 'in the weft' for 'in the woof'; both refer to the crosswise threads in woven fabric.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장이 그것을 살펴보아, 그 재앙이 옷이나 날실이나 씨실이나 가죽으로 된 어떤 물건 안에서도 퍼지지 않았으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날실’과 ‘씨실’은 각각 직물의 세로실과 가로실을 가리키는 기술 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …이면
  alternatives_korean:
  - 그리고 만일 …이면
  - 만일 …이면
  lexicon: HALOT
  rationale: 앞절의 절차를 이어 받으면서도 조건 전환의 대비를 살리기 위해 ‘그러나 …이면’으로 옮겼습니다.
- source_word: יִרְאֶה הַכֹּהֵן
  english_pob_choice: the priest examines
  chosen_korean: 제사장이 그것을 살펴보아
  alternatives_korean:
  - 제사장이 그것을 검사하여
  - 제사장이 그것을 보아
  lexicon: HALOT
  rationale: כתרא/판정 행위가 포함된 제의적 조사이므로 단순한 ‘보다’보다 ‘살펴보다’가 원문의 공식적 점검을 더 잘 드러냅니다.
- source_word: לֹא פָשָׂה הַנֶּגַע
  english_pob_choice: the infection has not spread
  chosen_korean: 그 재앙이 … 퍼지지 않았으면
  alternatives_korean:
  - 그 감염이 … 번지지 않았으면
  - 그 환부가 … 퍼지지 않았으면
  lexicon: HALOT
  rationale: נגע는 여기서 질병의 영향을 가리키는 말이므로 ‘재앙’으로 두되, 동작 동사는 POB의 의미를 따라 ‘퍼지다’로 옮겼습니다.
- source_word: בַּבֶּגֶד / בַשְּׁתִי / בָעֵרֶב / בְּכָל כְּלִי עוֹר
  english_pob_choice: in the garment, or in the warp, or in the woof, or in any article of leather
  chosen_korean: 옷이나 날실이나 씨실이나 가죽으로 된 어떤 물건 안에서도
  alternatives_korean:
  - 옷이나 날실이나 씨실이나 가죽 제품의 어느 것에도
  - 옷이나 날줄이나 씨줄이나 가죽으로 된 어떤 물건에도
  lexicon: HALOT
  rationale: 직물 용어는 전통적 대응쌍인 ‘날실/씨실’로 보존하고, כלי עור는 현대어로 자연스러운 ‘가죽으로 된 어떤 물건’으로 옮겼습니다.
theological_decisions:
- issue: נגע를 현대 한국어에서 어떻게 지칭할지
  chosen_reading: ‘재앙’으로 옮겨, 레위기의 제의적·부정성 범주를 유지했습니다.
  alternative_readings:
  - 감염
  - 병변
  - 부정한 반점
  rationale: 이 단락의 נגע는 현대 의학적 진단명보다 제의적으로 부정한 상태를 가리키므로, 의미를 좁히지 않으면서도 성경적 어감을 보존하는 표현을 택했습니다.
  doctrine_reference: 레위기 13장 정결/부정 규례
- issue: 절 끝의 조건문을 한국어로 완료형으로 둘지 여부
  chosen_reading: ‘퍼지지 않았으면’으로 조건적 판정을 자연스럽게 나타냈습니다.
  alternative_readings:
  - 퍼지지 않았으면 좋겠습니다
  - 퍼지지 않았다면
  rationale: 본문은 제사장의 재확인 결과를 전제하는 규정문이므로, 한국어에서는 판단의 조건을 분명히 하는 종결형이 가장 적절합니다.
  doctrine_reference: 레위기 13장 규례 문체
