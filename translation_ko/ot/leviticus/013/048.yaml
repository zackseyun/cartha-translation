base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
  footnotes:
  - marker: a
    text: Or 'weft' instead of 'woof.' The Hebrew term refers to the crosswise threads in woven fabric.
    reason: lexical_alternative
  - marker: b
    text: '''Linen'' renders a term that can more literally denote ''flax''; here it likely refers to linen material made from flax.'
    reason: lexical_alternative
  - marker: c
    text: Or 'any leather item' or more formally 'any work of leather.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 날실이나 씨실에, 아마포나 양털에[a][b], 가죽에[c]나 가죽으로 만든 어떤 물건에—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아마포’는 문자적으로는 ‘아마(flax)’에서 온 직물을 가리키며, 문맥상 여기서는 린넨 재질을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아마포’는 원문의 חומר 범주를 반영하기 위한 번역이며, 전통적 교회 용어를 그대로 따른 것은 아닙니다.
    reason: korean_style_note
  - marker: c
    text: ‘가죽’은 여기서 가공된 동물 가죽, 곧 leather를 뜻합니다.
    reason: lexical_alternative
