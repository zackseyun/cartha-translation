source:
  edition: WLC
  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
  footnotes:
  - marker: a
    text: Or 'weft' instead of 'woof.' The Hebrew term refers to the crosswise threads in woven fabric.
    reason: lexical_alternative
  - marker: b
    text: '''Linen'' renders a term that can more literally denote ''flax''; here it likely refers to linen material made from flax.'
    reason: lexical_alternative
  - marker: c
    text: Or 'any leather item' or more formally 'any work of leather.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 날실이나 씨실에, 아마포나 양털에[a][b], 가죽에[c]나 가죽으로 만든 어떤 물건에—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아마포’는 문자적으로는 ‘아마(flax)’에서 온 직물을 가리키며, 문맥상 여기서는 린넨 재질을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아마포’는 원문의 חומר 범주를 반영하기 위한 번역이며, 전통적 교회 용어를 그대로 따른 것은 아닙니다.
    reason: korean_style_note
  - marker: c
    text: ‘가죽’은 여기서 가공된 동물 가죽, 곧 leather를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתִי
  english_pob_choice: warp
  chosen_korean: 날실
  alternatives_korean:
  - 날실(워프)
  - 경사
  lexicon: HALOT
  rationale: 직조의 세로 실을 가리키므로 한국어 직조 용어인 ‘날실’이 가장 자연스럽고, ‘warp’의 기능적 대응을 잘 살립니다.
- source_word: עֵרֶב
  english_pob_choice: woof
  chosen_korean: 씨실
  alternatives_korean:
  - 씨실(위프)
  - 씨날
  lexicon: HALOT
  rationale: 직조의 가로 실을 뜻하므로 ‘씨실’이 적절하며, 앞의 ‘날실’과 짝을 이루어 원문의 병렬을 살립니다.
- source_word: לַפִּשְׁתִּים
  english_pob_choice: of the linen
  chosen_korean: 아마포
  alternatives_korean:
  - 린넨
  - 삼베
  lexicon: HALOT
  rationale: 원문은 문자적으로는 ‘아마/아마로 된 것’을 가리키지만, 문맥상 직물 재료이므로 ‘아마포’가 더 정확하고 간결합니다.
- source_word: וְלַצָּמֶר
  english_pob_choice: or of the wool
  chosen_korean: 양털에
  alternatives_korean:
  - 양모에
  - 모직에
  lexicon: HALOT
  rationale: צֶמֶר는 ‘양털’이 기본 뜻이므로 그 재료성을 직접 드러내는 표현을 택했고, 앞 구와 같은 목록형 구조를 살리기 위해 조사 ‘에’를 유지했습니다.
- source_word: עוֹר
  english_pob_choice: leather
  chosen_korean: 가죽
  alternatives_korean:
  - 가죽제품
  - 피혁
  lexicon: HALOT
  rationale: 의식 정결 문맥에서 עוֹר는 가공된 동물 가죽을 뜻하므로 ‘가죽’이 가장 자연스럽고, 영어 POB의 ‘leather’와도 맞습니다.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  english_pob_choice: in any article made of leather
  chosen_korean: 가죽으로 만든 어떤 물건에
  alternatives_korean:
  - 가죽으로 된 어떤 공예품에
  - 어떤 가죽 제품에
  lexicon: HALOT
  rationale: מְלֶאכָה는 여기서 추상적 ‘일’이 아니라 제작된 물건을 가리키므로, ‘가죽으로 만든 어떤 물건’으로 옮겨 원문의 범위를 분명히 했습니다.
- source_word: אוֹ ... אוֹ
  english_pob_choice: or ... or
  chosen_korean: 또는 ...에
  alternatives_korean:
  - 혹은 ... 혹은
  - 또 ... 또는
  lexicon: HALOT
  rationale: 반복되는 אוֹ의 열거 구조를 한국어에서도 그대로 드러내어, 감염 가능 범주의 나열이라는 원문의 리듬을 보존했습니다.
