base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/016.yaml
  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
  footnotes:
  - marker: a
    text: Literally, 'the living flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 생살[a]이 다시 나타나 흰색으로 변하면, 그는 제사장에게 가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘살아 있는 살’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  english_pob_choice: Or if
  chosen_korean: 또는
  alternatives_korean:
  - 그러나 만일
  - 또 만일
  lexicon: HALOT
  rationale: 오ֹ/כי의 결합은 앞선 경우에 이어지는 또 다른 조건을 도입하므로, 한국어에서는 자연스럽게 ‘또는’으로 시작해 절의 조건성을 유지했습니다.
- source_word: הַ/בָּשָׂ֥ר הַ/חַ֖י
  english_pob_choice: the raw flesh
  chosen_korean: 살점
  alternatives_korean:
  - 살아 있는 살
  - 생살
  lexicon: HALOT
  rationale: 직역하면 ‘살아 있는 살’이지만, 레위기 13장의 문맥에서는 상처 부위의 노출된 생살을 가리키므로 기능적으로 ‘살점’으로 옮겨 진단상의 의미를 살렸습니다.
- source_word: וְ/נֶהְפַּ֣ךְ לְ/לָבָ֑ן
  english_pob_choice: becomes white
  chosen_korean: 하얗게 변하면
  alternatives_korean:
  - 하얗게 되면
  - 흰색으로 바뀌면
  lexicon: HALOT
  rationale: הפך의 상태 변화와 ‘흰색’ 표지를 자연스러운 현대 한국어로 옮기기 위해 ‘하얗게 변하면’을 택했습니다.
- source_word: וּ/בָ֖א אֶל הַ/כֹּהֵֽן
  english_pob_choice: then he shall come to the priest
  chosen_korean: 그는 제사장에게 나아가야 합니다
  alternatives_korean:
  - 그는 제사장에게 가야 합니다
  - 그는 제사장 앞으로 가야 합니다
  lexicon: HALOT
  rationale: 검사 절차의 진행을 나타내는 동사 בוא는 단순 이동보다 공식적 접근이므로 ‘나아가야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 의례적 판정 절차의 문체
  chosen_reading: 명령적·법문체를 살리되 현대 한국어 합쇼체로 ‘나아가야 합니다’라고 옮겼습니다.
  alternative_readings:
  - 그는 제사장에게 가야 합니다
  - 제사장에게 나가야 합니다
  rationale: 이 절은 서술문이 아니라 규례의 절차를 제시하므로, 단순 서술보다 규범성을 드러내는 표현이 적절합니다.
  doctrine_reference: 레위기 정결 규례의 법문 맥락
