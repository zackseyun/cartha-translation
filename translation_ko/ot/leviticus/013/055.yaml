id: LEV.13.55
reference: Leviticus 13:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
  footnotes:
  - marker: a
    text: Or 'has not changed its color.' The Hebrew idiom literally says 'has not changed its eye,' referring to visible appearance.
    reason: lexical_alternative
  - marker: b
    text: Or 'a corroding infection' or traditional 'a fret.' The Hebrew term refers to a destructive deterioration in the material.
    reason: lexical_alternative
  - marker: c
    text: The final phrase is difficult. Literally, 'in its baldness or in its forehead/bare front.' In context this likely refers to one side or surface of the affected material versus the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 씻은 뒤의 그 환부를 살펴보고, 그 환부가 그 모습을 바꾸지 않았고 그 환부가 퍼지지도 않았으면, 그것은 부정합니다. 그것을 불에 태워 버려야 합니다. 그것은 부식성 반점이니, 그 닳은 쪽에 있든지 그 벗은 쪽에 있든지 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘눈’을 직역하면 ‘변하지 않은 색/겉모습’의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부식성 반점’은 전통적 ‘옴/악성 반점’보다 원문의 파괴적 손상을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 문자적으로는 ‘그 대머리/벗은 부분에서, 또는 그 이마/앞부분에서’라는 난해한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  english_pob_choice: Then the priest shall examine
  chosen_korean: 그러면 제사장은 살펴보고
  alternatives_korean:
  - 그리고 제사장은 보게 됩니다
  - 제사장은 검사해야 합니다
  lexicon: HALOT
  rationale: 제사장 판정 문맥의 ראה는 단순 시각보다 ‘살펴보다/검사하다’가 더 정확하므로 그렇게 옮겼습니다.
- source_word: הֻכַּבֵּס אֶת הַנֶּגַע
  english_pob_choice: after the diseased area has been washed
  chosen_korean: 씻은 뒤의 그 환부
  alternatives_korean:
  - 그 환부를 씻은 뒤
  - 그 환부가 씻긴 뒤
  lexicon: HALOT
  rationale: 수동 의미를 살려 ‘씻은 뒤의 그 환부’로 자연스럽게 정리했으며, 레위기 13장의 ‘환부’는 현대 한국어에서 문맥상 가장 분명합니다.
- source_word: לֹא הָפַךְ אֶת עֵינוֹ
  english_pob_choice: has not changed its appearance
  chosen_korean: 그 모습을 바꾸지 않았고
  alternatives_korean:
  - 그 눈이 바뀌지 않았고
  - 색이 변하지 않았고
  lexicon: HALOT
  rationale: ‘눈’은 히브리 관용구로 외형을 가리키므로, 직역보다 ‘모습’이 의미를 더 정확히 전달합니다.
- source_word: פְּחֶתֶת
  english_pob_choice: a corrosive spot
  chosen_korean: 부식성 반점
  alternatives_korean:
  - 부식하는 반점
  - 부식성 흠
  lexicon: HALOT
  rationale: תּ/פְּחֶתֶת는 물질을 갉아먹는 손상을 가리키므로, ‘반점’보다 넓지만 현대어로 기능을 드러내는 ‘부식성 반점’을 택했습니다.
- source_word: בְּקָרַחְתּוֹ / בְגַבַּחְתּוֹ
  english_pob_choice: on its worn side / on its bare side
  chosen_korean: 그 닳은 쪽에 있든지 그 벗은 쪽에 있든지
  alternatives_korean:
  - 그 대머리 쪽에 있든지 그 이마 쪽에 있든지
  - 그 닳은 면이든 그 벗은 면이든
  lexicon: HALOT
  rationale: 문맥상 물건의 표면/측면 대비를 가리키므로, 신체 은유를 그대로 두기보다 ‘닳은 쪽/벗은 쪽’으로 옮겨 의미를 보존했습니다.
theological_decisions:
- issue: 부정 판정과 소각 명령의 법적 강도
  chosen_reading: ‘그것은 부정합니다. 그것을 불에 태워 버려야 합니다’로 의무적 판정을 분명히 드러냈습니다.
  alternative_readings:
  - ‘부정하니 불에 태우십시오’
  - ‘부정한 것이니 태워야 합니다’
  rationale: 원문은 제의적 판정과 후속 조치를 명령형으로 제시하므로, 한국어에서도 법규의 강도를 약화하지 않도록 했습니다.
  doctrine_reference: 레위기 13장의 정결/부정 규정
