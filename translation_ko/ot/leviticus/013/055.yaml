revisions:
- from: 그러면 제사장은 씻은 뒤의 그 환부를 살펴보고, 그 환부가 그 모습을 바꾸지 않았고 그 환부가 퍼지지도 않았으면, 그것은 부정합니다. 그것을 불에 태워 버려야 합니다. 그것은 부식성 반점이니, 그 닳은 쪽에 있든지 그 벗은 쪽에 있든지 그렇습니다.[a][b][c]
  to: 그러면 제사장은 그 부위를 씻은 뒤에 그것을 살펴보아야 합니다. 그 부위의 겉모습[a]이 변하지 않고 그 부위가 퍼지지 않았으면, 그것은 부정한 것입니다. 그것을 불에 태워야 합니다. 그것은 그 닳은 면에 있든 벗은 면에 있든 생긴 부식성 반점[b][c]입니다.
  rationale: 수동적 세척 후 검사라는 절차, 겉모습의 불변과 확산 여부라는 두 판정 기준, 부정 판정 및 소각 명령을 보존했습니다. 물질 문맥에 부적합한 의학적 표현을 완화하고, 난해한 마지막 표현은 번역에서 최소한으로 해석하되 각주에서 문자적 표현과 불확실성을 밝혔습니다.
