  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 유지해 진단 대상이 ‘몸’이 아니라 ‘살의 피부’라는 점을 드러냈습니다.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  english_pob_choice: its appearance is not deeper than the skin
  chosen_korean: 그 모습이 피부보다 더 깊지 않으며
  alternatives_korean:
