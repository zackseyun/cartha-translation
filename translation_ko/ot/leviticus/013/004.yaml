id: LEV.13.4
reference: Leviticus 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
  footnotes:
  - marker: a
    text: Or 'bright patch' or 'shining spot' for the skin lesion described here.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall quarantine'; the Hebrew refers to placing the case under temporary isolation for observation.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the affliction/lesion'; the term refers to the affected spot being examined by the priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 밝은 반점이 그의 살의 피부에 하얗게 있고, 그 모습이 피부보다 더 깊지 않으며, 그 털이 희어지지 않았으면, 제사장은 그 환부를 칠 일 동안 격리해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밝은 패치’, ‘빛나는 반점’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 임시 분리를 통한 관찰, 곧 격리 조치를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘환부/병변’에 해당하는 말로, 제사장이 살펴보는 영향을 받은 부위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  english_pob_choice: bright spot
  chosen_korean: 밝은 반점
  alternatives_korean:
  - 밝은 점
  - 빛나는 반점
  - 희끗한 반점
  lexicon: HALOT
  rationale: 피부 병변을 가리키는 시각적 표지를 한국어로 자연스럽게 살리되, 단순한 ‘점’보다 병변성을 드러내는 ‘반점’을 택했습니다.
- source_word: בְּשָׂרוֹ / בְּעוֹר בְּשָׂרוֹ
  english_pob_choice: in the skin of his flesh
  chosen_korean: 그의 살의 피부에
  alternatives_korean:
  - 그의 몸의 피부에
  - 그의 육체의 피부에
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 유지해 진단 대상이 ‘몸’이 아니라 ‘살의 피부’라는 점을 드러냈습니다.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  english_pob_choice: its appearance is not deeper than the skin
  chosen_korean: 그 모습이 피부보다 더 깊지 않으며
  alternatives_korean:
  - 그 모습이 피부보다 깊어 보이지 않으며
  - 피부보다 더 깊게 보이지 않으며
  lexicon: HALOT
  rationale: 외형적 깊이를 판정하는 진단 기준을 그대로 옮기면서, ‘appearance’의 관찰적 뉘앙스를 ‘모습’으로 살렸습니다.
- source_word: וְהִסְגִּיר
  english_pob_choice: shall isolate
  chosen_korean: 격리해야 합니다
  alternatives_korean:
  - 분리해야 합니다
  - 격리시켜야 합니다
  - 은둔시켜야 합니다
  lexicon: HALOT
  rationale: 제사장의 조치가 임시 관찰을 위한 분리라는 점을 현대 한국어로 가장 분명하게 전달하는 말로 택했습니다.
theological_decisions:
- issue: 진단 대상의 법적·의례적 상태 표현
  chosen_reading: ‘환부’를 사용해 제사장이 다루는 대상이 사람 전체가 아니라 검사 중인 병변임을 분명히 했습니다.
  alternative_readings:
  - ‘나병’
  - ‘문둥병’
  - ‘병든 부위’
  rationale: 레위기 13장의 נגע는 특정 병명을 확정하기보다 조사 중인 병변/영향 부위를 가리키므로, 병명을 단정하는 전통어보다 본문 범위에 맞는 표현을 택했습니다.
  doctrine_reference: 레위기 13장의 정결 규례와 제사장 판정의 서술 맥락
