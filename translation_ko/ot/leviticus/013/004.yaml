  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
  footnotes:
  - marker: a
    text: Or 'bright patch' or 'shining spot' for the skin lesion described here.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall quarantine'; the Hebrew refers to placing the case under temporary isolation for observation.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the affliction/lesion'; the term refers to the affected spot being examined by the priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 몸의 피부에 밝고 흰 반점[a]이 있고, 그것이 피부보다 깊어 보이지 않으며, 그 반점의 털이 희어지지 않았으면, 제사장은 그 병변[c]이 있는 사람을 칠 일 동안 격리해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밝은 패치’, ‘빛나는 반점’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘따로 두어야 합니다’. 히브리어는 임시 분리를 통한 관찰, 곧 격리 조치를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘병변’ 또는 ‘환부’에 해당하는 말로, 제사장이 살펴보는 영향을 받은 부위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  english_pob_choice: bright spot
  chosen_korean: 밝은 반점
  alternatives_korean:
