  lexicon: HALOT
  rationale: 피부 병변을 가리키는 시각적 표지를 한국어로 자연스럽게 살리되, 단순한 ‘점’보다 병변성을 드러내는 ‘반점’을 택했습니다.
- source_word: בְּשָׂרוֹ / בְּעוֹר בְּשָׂרוֹ
  english_pob_choice: in the skin of his flesh
  chosen_korean: 그의 살의 피부에
  alternatives_korean:
