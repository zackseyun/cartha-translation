  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
  footnotes:
  - marker: a
    text: Or 'quarantine him for seven days.' The Hebrew verb refers to placing the person in isolation for observation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장이 그것을 살펴보았을 때, 그 안에 흰 털이 없고 피부보다 더 깊지 않으며 그것이 희미해 보이면, 제사장은 그를 칠 일 동안 격리해 두어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 칠 일 동안 가두어 두어야 합니다.’ 히브리어 동사는 관찰을 위해 그 사람을 따로 두는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그런데 …하면
  alternatives_korean:
  - 그리고 만일 …하면
  - 만일 …하면
  lexicon: HALOT
  rationale: 앞 절의 진단 사례에 이어지는 대조적 조건이므로, 단순한 조건문보다 전개 전환을 드러내는 표현을 택했습니다.
- source_word: יִרְאֶנָּה
  english_pob_choice: examines it
  chosen_korean: 그것을 살펴보아
  alternatives_korean:
  - 그것을 봐서
  - 그것을 검사하여
  lexicon: HALOT
  rationale: 단순 시각이 아니라 제사장의 판정용 관찰을 가리키므로, 진단적 의미를 살린 ‘살펴보아’로 옮겼습니다.
- source_word: וְהִסְגִּירוֹ
  english_pob_choice: shall isolate him
  chosen_korean: 그를 칠 일 동안 가두어 두어야 합니다
  alternatives_korean:
  - 그를 칠 일 동안 격리해야 합니다
  - 그를 칠 일 동안 가두어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 상태 관찰을 위한 구금을 뜻하므로, 현대어로는 ‘격리’보다 본문의 법적·의례적 구속성을 드러내는 ‘가두어 두다’가 더 직접적입니다.
- source_word: כֵהָה
  english_pob_choice: dim
  chosen_korean: 희미하면
  alternatives_korean:
  - 어둑하면
  - 옅으면
  - 희미하게 보이면
  lexicon: HALOT
  rationale: 표현이 피부 병변의 시각적 약화를 가리키므로, ‘희미하다’가 POB의 ‘dim’에 가장 가깝고 자연스럽습니다.
theological_decisions:
- issue: 제사장의 격리 조치 표현
  chosen_reading: 법적 판정 뒤에 이어지는 관찰 기간의 조치로 이해하여, 의료용 현대어인 ‘격리’와 본문적 ‘가두어 두다’의 긴장을 유지했습니다.
  alternative_readings:
  - 칠 일 동안 격리해야 합니다
  - 칠 일 동안 검역해야 합니다
  rationale: 레위기 13장의 맥락은 현대 감염병 검역과 완전히 같지 않으므로, 본문이 요구하는 의례적 관찰의 성격을 지우지 않도록 했습니다.
  doctrine_reference: Leviticus 13 purity legislation
