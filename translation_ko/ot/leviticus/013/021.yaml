review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional diagnostic sequence, the absence of white hair, the lesion's not being deeper than the skin, its dim appearance, and the seven-day action directed toward the man. However, ‘가두어 두다’ can imply punitive imprisonment more strongly than the Hebrew observational confinement. ‘격리해 두다’ more directly conveys the procedural isolation while the note can preserve the confinement nuance.
  naturalness: The sentence is understandable, but ‘그런데 … 살펴보아’ is somewhat awkward for a formal conditional inspection formula. ‘그러나 제사장이 그것을 살펴보았을 때’ is smoother modern formal Korean. ‘희미해 보이면’ naturally expresses the visual assessment.
  terminology: ‘제사장,’ ‘흰 털,’ and ‘피부보다 더 깊지 않다’ are appropriate. ‘격리해 두다’ is preferable to ‘가두어 두다’ here; it does not anachronistically specify modern medical quarantine and avoids an unnecessarily penal implication.
  issues:
  - severity: medium
    issue: ‘가두어 두어야 합니다’ is overly carceral in Korean.
    rationale: וְהִסְגִּירוֹ denotes placing the person in confinement/isolation for observation. Korean ‘가두다’ commonly suggests imprisonment or detention as punishment, whereas ‘격리해 두다’ better conveys the observational action without losing the restriction.
  - severity: low
    issue: The conditional opening is stylistically awkward.
    rationale: ‘그런데 제사장이 그것을 살펴보아’ combines a discourse-transition adverb with a connective form in a way that is less natural than a complete conditional inspection expression.
  - severity: low
    issue: The footnote’s alternative does not correspond to the revised main rendering.
    rationale: Once the main text uses ‘격리해 두다,’ the note should offer ‘가두어 두다’ as the literal/confinement-oriented alternative and explain the observational sense.
  revised_text: 그러나 제사장이 그것을 살펴보았을 때, 그 안에 흰 털이 없고 피부보다 더 깊지 않으며 그것이 희미해 보이면, 제사장은 그를 칠 일 동안 격리해 두어야 합니다.[a]
