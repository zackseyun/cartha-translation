  verdict: revise
  source_fidelity: 히브리어는 앞 절들과 병렬되는 조건적 사례를 제시하며, 불로 인한 화상 부위의 מִחְיַת(생살/살아 있는 조직)가 붉은빛 도는 흰색 또는 흰색의 בַּהֶרֶת가 되는 상태를 묘사합니다. 초안은 핵심 의미를 대체로 보존하지만, ‘살에 그 피부에’는 히브리어의 소유 구문을 한국어에서 부자연스럽게 중복하고, ‘반점’만으로는 בַּהֶרֶת의 ‘밝은’ 피부 표지라는 뜻이 약해집니다.
  naturalness: ‘살에 그 피부에’와 ‘화상의 살아 있는 살에 … 반점이 생기면’은 현대 한국어 문장으로 매끄럽지 않습니다. 조건문을 ‘어떤 사람의 살갗에 … 생기고’로 정리하고, 생살이 반점으로 변화하는 원문의 서술 관계를 명료하게 드러내는 편이 자연스럽습니다.
  terminology: ‘생살’은 레위기 13장의 מִחְיַת를 옮기는 데 적절하며, 주석으로 ‘살아 있는 조직’을 설명할 수 있습니다. בַּהֶרֶת는 단순한 반점보다 ‘밝은 반점’으로 옮겨 진단 용어의 특징을 보존하는 것이 좋습니다. ‘불화상’은 현대적이고 정확합니다.
