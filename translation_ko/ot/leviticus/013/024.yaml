id: LEV.13.24
reference: Leviticus 13:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
  footnotes:
  - marker: a
    text: Or 'flesh' instead of 'the body'; the Hebrew בָשָׂר commonly means 'flesh,' but here it refers to bodily tissue in a skin-disease law.
    reason: lexical_alternative
  - marker: b
    text: '''Raw flesh'' translates a Hebrew expression meaning living tissue appearing in the burn area.'
    reason: cultural_note
translation:
  language: ko
  text: 또는 살에 그 피부에 불로 인한 화상이 있고, 그 화상의 살아 있는 살에 붉은빛을 띤 흰 반점이나 흰 반점이 생기면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살’은 여기서 일반적인 신체를 뜻하기보다, 피부 질환 규례에서 문제 되는 인체 조직을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살아 있는 살’은 화상 부위에 드러나는 살아 있는 조직을 옮긴 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  english_pob_choice: Or if
  chosen_korean: 또는
  alternatives_korean:
  - 또는 만일
  - 혹은
  lexicon: HALOT
  rationale: 본문은 앞선 경우와 나란히 놓는 법률적 대안이므로, 한국어에서는 조건을 직접 덧붙이지 않고도 대등한 분기 표지인 ‘또는’으로 자연스럽게 옮겼습니다.
- source_word: בָשָׂר
  english_pob_choice: the body
  chosen_korean: 살
  alternatives_korean:
  - 몸
  - 육체
  lexicon: HALOT
  rationale: 여기서는 인체의 피부 질환을 다루는 문맥이므로, 일반적·성경적 용례인 ‘살’이 POB의 ‘the body’보다 원어의 물질적 감각을 더 직접적으로 살립니다.
- source_word: בְּעֹרוֹ
  english_pob_choice: on its skin
  chosen_korean: 그 피부에
  alternatives_korean:
  - 그의 피부에
  - 살갗에
  lexicon: HALOT
  rationale: 법조문의 비인칭적 서술을 유지하기 위해 ‘그 피부에’로 옮겨, 원문의 소유 접미사와 영어 POB의 무성별 처리를 함께 반영했습니다.
- source_word: מִכְוַת אֵשׁ
  english_pob_choice: a burn from fire
  chosen_korean: 불로 인한 화상
  alternatives_korean:
  - 불의 화상
  - 불에 의한 화상
  lexicon: HALOT
  rationale: 히브리어는 불로 생긴 화상 손상을 뜻하므로, 현대 한국어 의료·법률 문맥에서 통하는 ‘불로 인한 화상’이 가장 분명합니다.
- source_word: מִחְיַת הַמִּכְוָה
  english_pob_choice: the raw flesh of the burn
  chosen_korean: 화상의 살아 있는 살
  alternatives_korean:
  - 화상의 생살
  - 화상의 원살
  lexicon: HALOT
  rationale: POB가 주석에서 밝히듯 이 표현은 단순한 ‘살’이 아니라 살아 있는 조직을 가리키므로, 원문이 가진 생체 조직의 대비를 드러내기 위해 ‘살아 있는 살’로 옮겼습니다.
- source_word: בַּהֶרֶת
  english_pob_choice: a bright spot
  chosen_korean: 반점
  alternatives_korean:
  - 밝은 반점
  - 광택 있는 반점
  lexicon: HALOT
  rationale: 레위기 13장의 진단 용어로서 피부의 이례적 표지를 가리키므로, 한국어 독자에게 자연스러운 기본 용어인 ‘반점’을 택했습니다.
- source_word: לְבָנָה אֲדַמְדֶּמֶת / אוֹ לְבָנָה
  english_pob_choice: reddish-white or white
  chosen_korean: 붉은빛을 띤 흰 반점이나 흰 반점
  alternatives_korean:
  - 붉은빛이 도는 흰 반점이나 흰 반점
  - 희붉은 반점이나 흰 반점
  lexicon: HALOT
  rationale: 두 색채 형용사의 복합색을 ‘붉은빛을 띤 흰’으로 풀어, 원문의 미세한 색조 구분과 영어 POB의 ‘reddish-white’ 대비를 함께 보존했습니다.
theological_decisions:
- issue: 피부 진단 법문에서 בָּשָׂר와 מִחְיָה의 표현을 어떻게 살릴지
  chosen_reading: ‘살’과 ‘살아 있는 살’로 구분해, 단순한 신체 일반이 아니라 감염 여부를 가르는 살아 있는 조직의 대비를 드러냈습니다.
  alternative_readings:
  - 몸과 생살
  - 육체와 원살
  rationale: 이 절은 의식·진단 규정으로서 상태 판별의 정밀성이 중요하므로, 완곡하게 일반화하기보다 원문이 강조하는 생체 조직의 구분을 유지하는 편이 더 충실합니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 규례
