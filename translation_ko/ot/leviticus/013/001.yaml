  - 주
  rationale: 이 절은 야훼의 직접 발화 공식으로, 신명 자체를 보존하는 번역이 본문의 서사적·신학적 무게를 가장 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
