  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH). 전통적으로 영어 성경에서는 ‘the LORD’로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 하나님이 말씀하시는 서술 공식에서 דבר는 단순한 ‘말하다’보다 ‘말씀하다’가 더 자연스럽고, 이어지는 לֵאמֹר의 연결을 살리기 위해 ‘말씀하여 이르셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문에 직접 나타난 고유명사 יְהוָה를 전통적 대체어가 아니라 신명 표기인 ‘야훼’로 옮겨, 하나님의 언약적 이름을 드러냈습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - -께
  - -한테
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 전치사는 현대 한국어에서 자연스럽게 ‘-에게’로 처리하되, 하나님 주어가 문두에 오므로 경어 체계를 해치지 않도록 했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 라고
  lexicon: HALOT
  rationale: 히브리어 서술문에서 뒤따르는 직접 화법을 여는 관용구이므로, 한국어에서는 다음 절의 발화를 예고하는 연결 동사로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
