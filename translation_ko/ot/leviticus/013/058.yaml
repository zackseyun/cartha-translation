  rationale: 토라의 טהר는 단순한 위생 상태보다 예식적 정결을 뜻하지만, 한국어에서는 동작의 결과를 드러내는 현재형 서술이 가장 매끄럽습니다.
  doctrine_reference: 레위기 13장의 정결/부정 규례
