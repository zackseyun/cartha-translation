id: LEV.13.58
reference: Leviticus 13:58
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
  footnotes:
  - marker: a
    text: Or 'the weft' for 'the woof.' The Hebrew term refers to the crosswise threads in woven material.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 옷이나, 날실이나, 씨실이나, 또는 가죽으로 된 어떤 물건이든지, 그것을 씻었을 때 그 피부병이 그들에게서 떠나가면, 그것을 다시 한 번 씻어야 하며 깨끗해집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/בֶּגֶד
  english_pob_choice: the garment
  chosen_korean: 그 옷
  alternatives_korean:
  - 그 의복
  - 그 복식
  lexicon: HALOT
  rationale: בֶּגֶד는 일반적인 의복을 가리키므로, 현대 한국어에서는 '옷'이 가장 자연스럽고 간결합니다.
- source_word: הַ/שְּׁתִ֨י
  english_pob_choice: the warp
  chosen_korean: 날실
  alternatives_korean:
  - 세로실
  - 날짜실
  lexicon: HALOT
  rationale: 직조 기술 용어로서 שׁתי는 길이 방향의 실을 뜻하므로, 한국어의 표준 대응어인 '날실'이 가장 정확합니다.
- source_word: הָ/עֵ֜רֶב
  english_pob_choice: the woof
  chosen_korean: 씨실
  alternatives_korean:
  - 가로실
  - 위사
  lexicon: HALOT
  rationale: שׁתי와 짝을 이루는 횡방향 실이므로, 현대 한국어 기술 용어인 '씨실'로 옮겼습니다.
- source_word: כָל כְּלִי הָ/עוֹר
  english_pob_choice: any article of leather
  chosen_korean: 가죽으로 된 어떤 물건이든지
  alternatives_korean:
  - 가죽으로 된 어떤 기물이나
  - 가죽제의 어떤 물건이든지
  lexicon: HALOT
  rationale: כְּלִי는 넓게 '물건/기물/도구'를 뜻하므로, 문맥상 과도하게 좁히지 않으면서도 자연스러운 '물건'으로 번역했습니다.
- source_word: הַ/נָּגַע
  english_pob_choice: the infection
  chosen_korean: 그 피부병
  alternatives_korean:
  - 그 감염
  - 그 부정한 환부
  - 그 질환
  lexicon: HALOT
  rationale: 레위기 13장의 נגע는 특정한 의학 진단명보다 의례적으로 오염을 일으키는 병변을 가리키므로, 본문 맥락을 드러내는 '피부병'이 가장 읽기 쉽고 오해를 줄입니다.
theological_decisions:
- issue: 정결 선언의 번역
  chosen_reading: ‘깨끗해집니다’로 옮겨, 절차적·의례적 정결 판정을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘정결하게 됩니다’
  - ‘깨끗합니다’
  rationale: 토라의 טהר는 단순한 위생 상태보다 예식적 정결을 뜻하지만, 한국어에서는 동작의 결과를 드러내는 현재형 서술이 가장 매끄럽습니다.
  doctrine_reference: 레위기 13장의 정결/부정 규례
