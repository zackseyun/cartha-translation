  source_fidelity: 히브리어는 남자 또는 여자에게 피부의 살에 ‘밝은 반점들’, 곧 ‘흰 밝은 반점들’이 생기는 경우를 조건절로 제시합니다. 초안의 ‘어떤 사람이나 여자’는 אִישׁ(남자)와 אִשָּׁה(여자)의 대구를 정확히 반영하지 못하며, 마지막을 서술문으로 처리하여 다음 절로 이어지는 조건문의 기능도 흐립니다.
  naturalness: ‘그 몸의 피부에’와 ‘있으면, …이다’의 결합은 현대 한국어에서 부자연스럽고 문법적으로도 어색합니다. 조건절을 유지하고 ‘살갗에 … 생기면’으로 옮기면 자연스럽고 원문의 법규적 문체에도 맞습니다.
