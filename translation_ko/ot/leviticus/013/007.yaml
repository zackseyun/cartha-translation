id: LEV.13.7
reference: Leviticus 13:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
  footnotes:
  - marker: a
    text: Or 'the eruption,' 'the rash,' or traditionally 'the scab.' The Hebrew term refers to a superficial skin condition under examination.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew intensifies the verb: ''if the eruption surely/indeed spreads.'''
    reason: lexical_alternative
  - marker: c
    text: '''For his cleansing'' refers to the process or purpose of being examined with a view to being declared clean.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 만일 그 비늘 같은 발진이 피부에서 확실히 번지고, 그가 정결함을 위하여 제사장에게 자신을 보인 뒤라면, 그는 제사장 앞에 다시 한 번 나타나야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비늘 같은 발진’은 히브리어가 가리키는 표면성 피부 병변을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동사를 강조하여 ‘확실히/틀림없이 번지다’는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정결함을 위하여’는 정결 판정을 받기 위한 제의적 검사 과정을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  english_pob_choice: does indeed spread
  chosen_korean: 확실히 번지고
  alternatives_korean:
  - 더 번지고
  - 계속 번지고
  - 분명히 번지고
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 한국어 부사구 ‘확실히’로 살려, 단순한 진행이 아니라 확정적·강조된 확산을 나타냈습니다.
- source_word: הַמִּסְפַּחַת
  english_pob_choice: the scaly eruption
  chosen_korean: 비늘 같은 발진
  alternatives_korean:
  - 그 발진
  - 그 종기
  - 그 딱지
  lexicon: HALOT
  rationale: 레위기 13장의 의학적·제의적 맥락을 살려 현대 한국어에서 오해가 적은 표현으로 옮겼고, 전통적 ‘딱지’는 의미를 좁힐 수 있어 피했습니다.
- source_word: לְטָהֳרָתוֹ
  english_pob_choice: for his cleansing
  chosen_korean: 정결함을 위하여
  alternatives_korean:
  - 그의 정결을 위하여
  - 정결 판정을 받기 위하여
  lexicon: HALOT
  rationale: 이 구절은 치료 자체보다 제사장 판정에 따른 정결 절차를 가리키므로, ‘정결함을 위하여’로 목적과 제의적 과정을 함께 담았습니다.
- source_word: וְנִרְאָה שֵׁנִית
  english_pob_choice: then he shall appear ... a second time
  chosen_korean: 그는 제사장 앞에 다시 한 번 나타나야 합니다
  alternatives_korean:
  - 그는 다시 제사장 앞에 보여져야 합니다
  - 그는 다시 제사장에게 나아가야 합니다
  lexicon: HALOT
  rationale: 법문체의 요구를 자연스러운 현대 한국어로 풀어, 재검진을 위해 다시 제사장 앞에 출두해야 하는 절차를 분명히 했습니다.
theological_decisions:
- issue: 정결 과정의 의미
  chosen_reading: ‘for his cleansing’를 정결 판정과 연결된 절차로 이해해 번역했습니다.
  alternative_readings:
  - 단순히 ‘그의 정결을 위하여’로 직역
  - ‘정결하게 되기 위하여’로 결과 중심 번역
  rationale: 레위기 13장의 문맥에서는 이미 치유 여부가 아니라 제사장의 확인과 선언이 핵심이므로, 정결 ‘절차’라는 의미를 드러내는 것이 본문 의도를 더 정확히 전합니다.
  doctrine_reference: 레위기 13장의 제의적 정결 규례
- issue: 수동형의 법문체 처리
  chosen_reading: ‘shall appear’의 법적 요구를 ‘나타나야 합니다’로 옮겼습니다.
  alternative_readings:
  - ‘보여져야 합니다’
  - ‘나와야 합니다’
  rationale: 히브리어 수동형/절차적 표현을 한국어 법문체로 자연스럽게 나타내면서, 재검진의 의무성을 유지했습니다.
  doctrine_reference: 율례·정결 규례의 절차적 언어
