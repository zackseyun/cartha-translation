  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִ֨תְגַּלָּ֔ח וְ/אֶת הַ/נֶּ֖תֶק לֹ֣א יְגַלֵּ֑חַ וְ/הִסְגִּ֨יר הַ/כֹּהֵ֧ן אֶת הַ/נֶּ֛תֶק שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
  footnotes:
  - marker: a
    text: Or “the itch.” The Hebrew term refers to a particular skin condition of the head or beard, likely involving scaling and hair loss.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “he shall not shave the scaly spot,” likely meaning the affected patch itself is left unshaved so the priest can inspect it clearly after the surrounding hair is removed.
    reason: cultural_note
translation:
  language: ko
  text: 그는 몸을 밀어야 합니다. 그러나 그 딱지는 밀지 말아야 합니다. 그리고 제사장은 그 딱지를 이레 동안 다시 격리해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '그는 스스로 민다'는 뜻의 반사형입니다.
    reason: source_note
  - marker: b
    text: 이 표현은 병변 자체를 남겨 두어, 그 주변을 민 뒤 제사장이 더 분명히 살펴보게 하는 취지로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  english_pob_choice: then he shall shave himself
  chosen_korean: 그는 몸을 밀어야 합니다
  alternatives_korean:
  - 그는 자신을 밀어야 합니다
  - 그는 스스로 면도해야 합니다
  lexicon: HALOT
  rationale: 히트파엘형은 자기 몸의 털을 미는 반사 의미이므로, 한국어에서도 자연스럽게 자기 행위를 드러내는 표현으로 옮겼습니다.
- source_word: הַנֶּתֶק
  english_pob_choice: the scaly spot
  chosen_korean: 그 딱지
  alternatives_korean:
  - 그 비늘진 반점
  - 그 피부 병변
  - 그 가피
  lexicon: HALOT
  rationale: 레위기 13장의 특정 두피·수염 질환을 가리키는 말이라서, 일반 독자가 이해하기 쉬운 현대어로 옮기되 병변의 표면성을 살렸습니다.
- source_word: לֹא יְגַלֵּחַ
  english_pob_choice: he shall not shave
  chosen_korean: 밀지 말아야 합니다
  alternatives_korean:
  - 면도하지 말아야 합니다
  - 깎지 말아야 합니다
  lexicon: HALOT
  rationale: 법규 문맥의 금지형을 한국어 의무·금지 표현으로 자연스럽게 처리했습니다.
- source_word: וְהִסְגִּיר
  english_pob_choice: shall isolate
  chosen_korean: 격리해야 합니다
  alternatives_korean:
  - 분리해야 합니다
  - 가두어야 합니다
  - 구별해 두어야 합니다
  lexicon: HALOT
  rationale: 제사장이 관찰을 위해 일시적으로 떼어 두는 절차를 가장 간결하게 전달하는 현대어로 선택했습니다.
theological_decisions:
- issue: 제사장의 조치가 의학적 검역인지 의식적 격리인지
  chosen_reading: 본문의 절차적·진단적 성격을 살려 '격리'로 옮기되, 현대 의학의 엄밀한 검역 제도로 환원하지는 않았습니다.
  alternative_readings:
  - 검역
  - 가둠
  - 봉쇄
  rationale: 레위기 13장의 דין은 질병 치료보다 판정과 관찰에 초점이 있으므로, 현대 독자에게는 '격리'가 가장 덜 오해를 낳습니다.
  doctrine_reference: 레위기 13장의 정결 판정 절차
- issue: הַנֶּתֶק의 번역을 전통 교회어로 고정할지 여부
  chosen_reading: 전통적인 '대머리 병' 계열보다, 본문이 가리키는 특정 병변의 외형을 드러내는 '딱지'를 택했습니다.
  alternative_readings:
  - 대머리 병
  - 문둥병
  - 가피
  rationale: 이 단어는 단순 탈모가 아니라 두피·수염의 특정 병변을 가리키므로, 독자 오해를 줄이기 위해 증상 중심의 일반어를 사용했습니다.
  doctrine_reference: 레위기 13장의 피부병 분류와 정결 판정
