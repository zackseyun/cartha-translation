revisions:
- from: 그는 몸을 밀어야 합니다. 그러나 그 딱지는 밀지 말아야 합니다. 그리고 제사장은 그 딱지를 이레 동안 다시 격리해야 합니다.[a][b]
  to: 그는 털을 밀어야 합니다.[a] 그러나 그 비늘진 병변은 밀지 말아야 합니다.[b] 제사장은 그 병변을 이레 동안 다시 격리해 두어야 합니다.
  rationale: 반사형 동사의 범위를 ‘몸’에서 문맥상 적절한 ‘털’로 바로잡고, נתק를 ‘딱지’라는 좁은 의학적 상태로 규정하지 않고 병변으로 옮겼습니다. 격리의 대상은 히브리어의 직접목적어를 따라 ‘병변’으로 유지하되, 한국어의 자연스러운 절차 표현을 위해 ‘격리해 두다’를 사용했습니다. 각주는 어휘 정보와 해석적 설명을 구별하고, 주변 털에 관한 설명의 불확실성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
