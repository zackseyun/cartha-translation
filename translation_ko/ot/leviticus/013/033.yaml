review_pass:
  verdict: revise
  source_fidelity: ‘몸을 밀다’는 히브리어 동사 גלח가 이 문맥에서 가리키는 머리털이나 수염을 미는 행위를 지나치게 넓게 바꾸며, נתק를 ‘딱지’로 한정하는 것은 해당 병변의 의미를 과도하게 좁힙니다. 또한 ‘그 딱지를 격리하다’는 한국어에서 의미상 부자연스럽습니다. 본문은 병변을 남겨 두고 관찰을 위해 다시 분리해 두는 절차를 말합니다.
  naturalness: ‘털을 밀다’, ‘비늘진 병변’, ‘격리해 두다’는 현대 표준 한국어의 공식적 문체 안에서 진단 절차를 더 자연스럽고 정확하게 전달합니다.
  terminology: נתק는 단순한 딱지나 일반적 가려움이 아니라, 특히 머리나 수염 부위에서 탈모와 비늘짐을 수반할 수 있는 특정 병변입니다. ‘비늘진 병변’은 영어 POB의 ‘scaly spot’ 및 원문의 진단적 용법을 비교적 안전하게 반영합니다. כהן은 ‘제사장’, שבעת ימים שנית는 ‘이레 동안 다시’로 유지합니다.
  issues:
  - severity: high
    issue: ‘몸을 밀어야 합니다’
    rationale: גלח는 여기서 몸 전체를 미는 것을 뜻하지 않고, 병변 검사를 위해 머리털이나 수염을 미는 행위를 가리킵니다. ‘털을 밀다’가 범위와 문맥을 더 정확히 보존합니다.
  - severity: high
