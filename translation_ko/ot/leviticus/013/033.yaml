  - severity: medium
    issue: ‘그 딱지를 ... 격리해야 합니다’의 결합
    rationale: 물리적인 딱지를 격리하는 뜻처럼 들립니다. 원문의 목적어를 유지하면서도 절차적 분리를 나타내도록 ‘그 병변을 ... 격리해 두다’로 다듬는 것이 낫습니다.
