id: LEV.13.2
reference: Leviticus 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
  footnotes:
  - marker: a
    text: Traditionally, 'an infection of leprosy' or 'a leprous disease.' The Hebrew צָרָעַת refers more broadly to a category of skin affliction and should not be equated automatically with modern Hansen's disease.
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 사람의 몸 피부에 부어오름이나 딱지나 밝은 반점이 생기고, 그것이 그의 몸 피부에 피부병의 병변[a]이 되면, 그 사람은 제사장 아론이나 그의 아들들인 제사장들 가운데 한 사람에게 인도되어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרָעַת은 현대 한센병과 자동으로 동일시할 수 없는 더 넓은 피부 질환 범주를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 단수 일반명사를 법문에 맞게 자연스럽게 살리기 위해 ‘사람’으로 옮겼습니다. 성별을 굳이 드러내지 않으면서도 사례법의 일반성을 유지합니다.
- source_word: בְּעוֹר בְּשָׂרוֹ
  english_pob_choice: on the skin of his body
  chosen_korean: 그의 몸의 피부에
  alternatives_korean:
  - 그의 살의 피부에
  - 그의 피부에
  lexicon: HALOT
  rationale: 반복되는 신체 표현을 한국어에서 무리 없이 전달하기 위해 ‘몸의 피부에’로 옮겼습니다. ‘살’보다 현대 독자에게 자연스럽고, 원문의 구체성을 보존합니다.
- source_word: שְׂאֵת / סַפַּחַת / בַּהֶרֶת
  english_pob_choice: a swelling / a scab / a bright spot
  chosen_korean: 부기나 딱지나 밝은 반점
  alternatives_korean:
  - 부푼 자국이나 딱지나 희끗한 반점
  - 융기나 발진이나 밝은 반점
  lexicon: HALOT
  rationale: 세 항목 모두 피부의 가시적 병변을 가리키므로, 현대 한국어에서 비교적 직관적인 병변 명칭을 사용했습니다. ‘밝은 반점’은 히브리어의 밝거나 창백한 표지를 과도하게 좁히지 않습니다.
- source_word: לְנֶגַע צָרָעַת
  english_pob_choice: an infection of skin disease
  chosen_korean: 피부병의 환부
  alternatives_korean:
  - 피부병의 감염
  - 문둥병의 환부
  - 피부병의 병변
  lexicon: HALOT
  rationale: צָרָעַת을 현대의 특정 질환명으로 고정하지 않기 위해 ‘피부병’으로 옮겼고, נֶגַע는 병변·환부의 의미를 살려 ‘환부’로 표현했습니다. 이는 전통적 ‘문둥병’보다 원문 범위를 덜 오해하게 합니다.
- source_word: וְהוּבָא
  english_pob_choice: he shall be brought
  chosen_korean: 데려가야 합니다
  alternatives_korean:
  - 데려와야 합니다
  - 가져가야 합니다
  - 인도되어야 합니다
  lexicon: HALOT
  rationale: 수동형의 절차적 의무를 한국어 법문체로 자연스럽게 살리기 위해 피동적 의미를 포함한 의무 표현으로 옮겼습니다. 행위 주체가 명시되지 않은 점도 유지합니다.
theological_decisions:
- issue: צָרָעַת의 번역을 현대 의학명에 고정할지 여부
  chosen_reading: ‘피부병’으로 번역하고, 전통적 ‘문둥병’은 본문에서 채택하지 않았습니다.
  alternative_readings:
  - 문둥병
  - 나병
  - tzaraath
  rationale: 본문은 현대 한센병과 동일시할 근거를 제공하지 않으므로, 원문의 진단·의례적 범주를 넓게 보존하는 번역이 더 충실합니다. 이는 POB의 오디트 기록과도 일치합니다.
  doctrine_reference: 원어 우선 번역 원칙; 전통 용어가 현대 독자에게 잘못된 의학적 동일시를 유발할 때는 피합니다.
