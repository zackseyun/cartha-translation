review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘의 선택은 대체로 원문에 충실합니다. 특히 צָרָעַת을 특정 현대 질환인 한센병/나병으로 단정하지 않고 ‘피부병’으로 넓게 처리한 것은 원어 및 영어 POB의 판단에 부합합니다. 그러나 וְהוּבָא는 그 사람이 스스로 가야 한다는 뜻이 아니라 그를 누군가가 제사장에게 ‘데려오게/인도하게 된다’는 수동적 절차이므로, 현행 ‘그는 … 데려가야 합니다’는 주체 관계를 바꿀 소지가 있습니다.
  naturalness: ‘사람의 몸의 피부’와 ‘그의 몸의 피부’는 한국어에서 다소 겹치고 무겁습니다. ‘몸 피부’로 다듬어 원문의 반복된 신체 표현은 남기되 현대 한국어의 흐름을 개선했습니다. 또한 ‘부기’보다 병변의 융기·부어오른 상태를 가리키는 ‘부어오름’이 이 문맥에서 더 자연스럽습니다.
  terminology: ‘피부병의 병변’은 נֶגַע צָרָעַת의 병변성과 질환 범주성을 함께 보존합니다. ‘문둥병’은 현재 비권장·낙인적 표현이므로 사용하지 않았으며, ‘나병’ 역시 현대 한센병으로 좁혀 이해될 수 있어 본문 용어로 채택하지 않았습니다. 각주 표지는 설명되는 ‘피부병의 병변’에 직접 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘그는 … 데려가야 합니다’가 וְהוּבָא의 수동적 절차를 능동적으로, 그리고 환자 자신이 이동하는 것처럼 읽히게 할 수 있습니다.
    rationale: 히브리어 호팔 미완료형은 ‘그가 데려와져야/인도되어야 한다’는 뜻입니다. ‘그 사람은 … 인도되어야 합니다’가 행위자의 미표시와 수동성을 보존합니다.
  - severity: low
    issue: 각주 표지 [a]가 문장 끝에 있어 צָרָעַת에 해당하는 표현과의 연결이 불분명합니다.
    rationale: 각주는 ‘피부병의 병변’ 바로 뒤에 두어 설명 대상이 히브리어 צָרָעַת임을 명확히 해야 합니다.
  - severity: low
    issue: ‘몸의 피부’의 반복은 직역투로 다소 부자연스럽습니다.
    rationale: ‘몸 피부’는 한국어에서 더 간결하면서도 בְּעוֹר בְּשָׂרוֹ의 구체적 신체 지시를 유지합니다.
  revised_text: 어떤 사람의 몸 피부에 부어오름이나 딱지나 밝은 반점이 생기고, 그것이 그의 몸 피부에 피부병의 병변[a]이 되면, 그 사람은 제사장 아론이나 그의 아들들인 제사장들 가운데 한 사람에게 인도되어야 합니다.
