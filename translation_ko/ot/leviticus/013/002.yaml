revisions:
- from: 사람의 몸의 피부에 부기나 딱지나 밝은 반점이 생겨서, 그것이 그의 몸의 피부에 피부병의 환부가 되면, 그는 제사장 아론에게, 또는 그의 아들 제사장들 가운데 한 사람에게로 데려가야 합니다.[a]
  to: 어떤 사람의 몸 피부에 부어오름이나 딱지나 밝은 반점이 생기고, 그것이 그의 몸 피부에 피부병의 병변[a]이 되면, 그 사람은 제사장 아론이나 그의 아들들인 제사장들 가운데 한 사람에게 인도되어야 합니다.
  rationale: 수동형 절차 명령을 ‘인도되어야 합니다’로 바로잡아 원문의 주체 관계를 보존했습니다. 병변 용어와 צָרָעַת의 비특정적 범주는 유지했으며, 각주를 해당 용어에 앵커링했습니다. 이 수정은 의미를 변경하지 않고 문체와 원문 충실성을 개선합니다.
  reviewer_model: gpt-5.6-terra
