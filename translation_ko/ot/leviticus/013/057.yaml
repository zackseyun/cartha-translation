review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys recurrence, the listed textile/leather objects, spread, and burning. However, "전염" imports a modern infectious-disease sense not required by Hebrew נגע, and "베틀실" is not the standard textile term for שְׁתִי (warp). The revision retains the deliberately broad technical reference to the affected mark.
  naturalness: '"날실" and "씨실" are standard paired Korean textile terms. Repeating "그 자국" makes the referent clear and avoids the awkward and medically over-specific "그 전염이 있는 것."'
  terminology: Use "날실" for warp and "씨실" for weft. Render נגע as "자국" with a note explaining its technical, non-diagnostic Levitical usage; do not use "전염," which can imply a proven infectious condition.
  issues:
  - severity: medium
    issue: '"베틀실" for שְׁתִי'
    rationale: שְׁתִי is specifically the warp, for which "날실" is the normal Korean textile term; "베틀실" is vague and does not preserve the warp/weft distinction.
  - severity: high
    issue: '"전염" for נגע'
    rationale: נגע in this legal context is a technical term for an afflicted mark or condition and does not establish modern contagion or infection. "전염" over-specifies the source.
  - severity: low
    issue: '"퍼지는 전염" and the following "그 전염이 있는 것" are unnatural and semantically conflated'
    rationale: The Hebrew first describes the mark as spreading and then commands burning the item in which the mark is found. Repeating "그 자국" preserves this distinction.
  revised_text: 그러나 그 자국[1]이 옷이나 날실이나 씨실이나 어떤 가죽 물건에 다시 나타나면, 그것은 번져 나가는 것이므로, 그 자국이 있는 것은 불에 태워야 합니다.
  revised_footnotes:
