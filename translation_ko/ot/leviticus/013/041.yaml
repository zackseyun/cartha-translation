  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
  footnotes:
  - marker: a
    text: Or 'frontal bald' or 'having baldness at the front of the head.' The Hebrew term distinguishes this from baldness at the back of the head in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그의 머리 앞부분이 벗겨져 대머리가 되면, 그는 이마가 벗겨진 것이니 그는 깨끗합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  english_pob_choice: the front of his head
  chosen_korean: 그의 머리 앞부분
  alternatives_korean:
  - 그의 얼굴 앞쪽
  - 그의 머리의 앞쪽 가장자리
  lexicon: HALOT
  rationale: 문자적으로는 ‘얼굴의 가장자리/앞쪽’이지만, 문맥상 얼굴이 아니라 두피의 앞부분을 가리키므로 자연스러운 해부학적 표현으로 옮겼습니다.
- source_word: יִמָּרֵט
  english_pob_choice: becomes bald
  chosen_korean: 벗겨져 대머리가 되면
  alternatives_korean:
  - 벗겨지면
  - 머리카락이 빠지면
  lexicon: HALOT
  rationale: 수동적 뉘앙스의 ‘털이 벗겨짐/빠짐’을 살리면서 진단 문맥에 맞는 ‘대머리가 되다’를 함께 써서 상태 변화를 분명히 했습니다.
- source_word: גִּבֵּחַ
  english_pob_choice: bald on the forehead
  chosen_korean: 이마가 벗겨진 것이니
  alternatives_korean:
  - 이마가 벗겨진 사람입니다
  - 앞이마 대머리입니다
  lexicon: HALOT
  rationale: 이 단어는 앞면/이마 쪽의 대머리를 뜻하며, 바로 앞 절의 뒤통수·정수리 대머리와 구별되는 점을 한국어에서도 드러내기 위해 풀어 옮겼습니다.
- source_word: טָהוֹר
  english_pob_choice: clean
  chosen_korean: 깨끗합니다
  alternatives_korean:
  - 정결합니다
  - 깨끗한 사람입니다
  lexicon: HALOT
  rationale: 레위기 13장의 범주는 도덕적 ‘순결’이 아니라 의례적 상태이므로, 전통적 교회어보다 문맥상 직접적인 ‘깨끗합니다’를 택했습니다.
theological_decisions:
- issue: 정결 판정의 용어 선택
  chosen_reading: 깨끗합니다
  alternative_readings:
  - 정결합니다
  - 순수합니다
  rationale: 이 절은 피부 질환과 관련된 제사장 판정의 결과를 말하므로, 윤리적 함의를 불러오는 ‘순수’보다 의례적 상태를 나타내는 표현이 더 정확합니다.
  doctrine_reference: 레위기 13장의 정결/부정 범주
