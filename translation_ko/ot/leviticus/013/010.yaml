base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
  footnotes:
  - marker: a
    text: Or 'a raised spot' for 'swelling' (Hebrew שְׂאֵת), a technical term in this chapter for an elevated skin lesion.
    reason: lexical_alternative
  - marker: b
    text: Literally 'living flesh'; the phrase refers to raw, live tissue appearing within the lesion.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그것을 살펴보는데, 보십시오, 피부에 흰 부어오름이 있고 그 안의 털이 하얗게 변했으며, 그 부어오름 속에 살아 있는 살이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부어오름’은 히브리어 שְׂאֵת(높이 올라온 병변)를 옮긴 것입니다. 문맥상 피부의 진단 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘살아 있는 살’입니다. 병변 안에 드러난 살아 있는 조직을 가리킵니다.
    reason: lexical_alternative
