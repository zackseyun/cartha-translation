base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
  footnotes:
  - marker: a
    text: Or, 'the priest shall declare him clean.' The Hebrew verb can be rendered 'cleanse,' but here it refers to the priest's formal ruling after the condition has healed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 눈에 그 종기성 피부병이 그대로 있고 그 안에 검은 털이 자라났으면, 그 종기성 피부병은 나은 것이니 그는 깨끗합니다. 제사장은 그를 깨끗하다고 선언해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 동사는 제사장이 실제로 치유한다기보다 공식적으로 정결 판정을 내린다는 뜻으로 읽는 것이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  english_pob_choice: in his sight
  chosen_korean: 그의 눈에
  alternatives_korean:
  - 그의 보기에
  - 그에게는
  - 그의 판단으로는
  lexicon: HALOT
  rationale: 검사자가 보는 관점이라는 의미를 살리되, 한국어로는 자연스러운 평가 관용구인 '그의 눈에'로 옮겼습니다.
- source_word: עָמַד
  english_pob_choice: has remained unchanged
  chosen_korean: 그대로 있고
  alternatives_korean:
  - 변함없이 있고
  - 머물러 있고
  - 그 상태로 있고
  lexicon: HALOT
  rationale: 의학적 판정 문맥에서 병변이 퍼지거나 변하지 않았음을 나타내므로, '그대로 있고'로 상태 지속을 자연스럽게 표현했습니다.
- source_word: הַנֶּתֶק
  english_pob_choice: the scaly eruption
  chosen_korean: 종기성 피부병
  alternatives_korean:
  - 비늘 같은 발진
  - 각질성 발진
  - 피부병
  lexicon: HALOT
  rationale: 해당 용어는 이 장의 진단 대상 피부 질환을 가리키므로, 현대 독자가 이해할 수 있으면서도 단순한 증상명으로 축소하지 않는 표현을 택했습니다.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  english_pob_choice: and the priest shall pronounce him clean
  chosen_korean: 제사장은 그를 깨끗하다고 선언해야 합니다
  alternatives_korean:
  - 제사장은 그를 깨끗하게 해야 합니다
  - 제사장은 그를 정결하다고 선언해야 합니다
  lexicon: HALOT
  rationale: 동사는 제사장이 상태를 실제로 바꾸는 것이 아니라 공식적으로 판정하는 의미이므로, '선언해야 합니다'로 번역해 사법적·의례적 기능을 분명히 했습니다.
theological_decisions:
- issue: 제사장의 역할이 치유인지 판정인지
  chosen_reading: 병은 이미 나았고, 제사장은 그 사실을 공식적으로 선언합니다.
  alternative_readings:
  - 제사장이 그를 깨끗하게 합니다
  - 제사장의 선언이 정결을 만들어 냅니다
  rationale: 본문은 병변의 치유와 제사장의 판정을 구분합니다. 마지막 절은 치유의 원인이 아니라 정결 판결을 나타내므로, 선언으로 옮겨 제사장 직무를 정확히 드러냈습니다.
  doctrine_reference: 레위기 13장의 정결 판정 문맥
