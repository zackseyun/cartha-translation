  source_fidelity: ‘종기성 피부병’은 히브리어 נֶתֶק의 의미에 맞지 않습니다. ‘종기’는 다른 피부 질환을 연상시키며, נֶתֶק이 가리키는 정확한 질환명도 확정하기 어렵습니다. 또한 בְּעֵינָיו는 문맥상 제사장의 검사·판단 관점이므로 ‘제사장이 보기에’가 더 정확합니다. 마지막 טָהוֹר는 의례적 상태를 가리키므로 ‘정결하다’가 적절합니다.
  naturalness: ‘그의 눈에’는 한국어에서 검사자의 관점을 자연스럽게 드러내지 못하고, ‘종기성 피부병’도 일반적 현대 용례로 부자연스럽습니다. ‘제사장이 보기에’와 ‘피부병’은 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: 정결/부정의 레위기 의례 용어는 ‘깨끗하다’보다 ‘정결하다’로 일관되게 옮기는 편이 적절합니다. נֶתֶק의 병명은 불확실하므로 ‘종기성’처럼 특정 질환으로 단정하지 않고 ‘피부병’으로 보존합니다. 제사장의 וְטִהֲרוֹ는 치유 행위와 구별되는 공식 정결 판정으로 ‘정결하다고 선언해야 합니다’로 번역할 수 있습니다.
