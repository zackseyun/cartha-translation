  lexicon: HALOT
  rationale: 제사장이 단순히 ‘본다’기보다 규례에 따라 판정 전 단계로 점검하는 행위이므로, 절차적 의미를 살리는 ‘살펴보아’가 적절합니다.
- source_word: עָמֹק מִן הָעוֹר
  english_pob_choice: deeper than the skin
  chosen_korean: 피부보다 깊지
