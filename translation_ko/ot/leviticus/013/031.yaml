  lexicon: HALOT
  rationale: 레위기 13장의 진단 문맥에서 נֶגַע는 단순한 ‘재앙’보다 관찰 가능한 피부 이상 부위를 가리키므로, 현대 한국어의 의학적 중립어인 ‘병변’이 가장 자연스럽습니다.
- source_word: נֶתֶק
  english_pob_choice: scaly outbreak
  chosen_korean: 무라(스캘)
  alternatives_korean:
  - 피부 벗겨짐
  - 비늘진 발진
  - 무라
  lexicon: HALOT
  rationale: 이 용어는 본문 고유의 특정 피부/두피 상태를 가리키므로, 뜻을 풀어 쓰되 전통 번역어와의 단절을 줄이기 위해 음역을 함께 제시했습니다. 현재 본문에 대응하는 직접적 한국어 의학어가 뚜렷하지 않아 설명적 표기를 택했습니다.
- source_word: יִרְאֶה
  english_pob_choice: examines
  chosen_korean: 살펴보아
  alternatives_korean:
