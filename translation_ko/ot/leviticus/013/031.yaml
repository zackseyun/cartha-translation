  lexicon: HALOT
  rationale: 병변의 함몰 여부를 비교하는 표현이므로 직역에 가까운 ‘피부보다 깊지’로 유지해 진단 기준을 분명히 했습니다.
- source_word: וְהִסְגִּיר
  english_pob_choice: shall isolate
  chosen_korean: 격리해야 합니다
  alternatives_korean:
  - 분리해야 합니다
  - 가두어야 합니다
  - 격리시키셔야 합니다
  lexicon: HALOT
  rationale: 정결 규례의 임시 관찰 조치를 현대 한국어로 가장 분명하게 드러내는 표현은 ‘격리하다’이며, 공공보건의 뉘앙스가 있으나 이 문맥의 관찰적 격리와 잘 맞습니다.
theological_decisions:
- issue: 진단 절차의 표현이 단순 관찰인지, 규례에 따른 판정 및 임시 격리인지
  chosen_reading: ‘살펴보아… 격리해야 합니다’로 옮겨, 제사장의 시각적 확인과 규례적 조치를 함께 드러냈습니다.
  alternative_readings:
  - ‘보면… 떼어 놓아야 합니다’
  - ‘검사하면… 가두어야 합니다’
  rationale: 히브리어는 제사장의 검사와 뒤따르는 공식적 격리를 연속적으로 제시하므로, 두 행위를 분리해 드러내는 번역이 본문 기능을 가장 잘 보존합니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 규례
