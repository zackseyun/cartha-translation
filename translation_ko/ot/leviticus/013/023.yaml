review_pass:
  verdict: revise
  source_fidelity: 원문의 תַּחְתֶּיהָ תַּעֲמֹד는 문맥상 밝은 반점이 퍼지지 않고 있던 자리에 남아 있음을 뜻합니다. 초안의 ‘그 아래에서’는 이 관용적 표현을 부자연스럽게 중복 번역하여 의미를 흐립니다. 또한 טִהֵר는 치료가 아니라 제사장의 정결 판정으로 옮겨야 합니다.
  naturalness: ‘그 밝은 반점이 그 자리에 그대로 있고’는 현대 표준 한국어로 자연스럽고, 조건절 및 합쇼체 법규 문체에 잘 맞습니다. ‘정결하다고 선언해야 합니다’는 의례적 판정의 뜻을 분명하게 전달합니다.
  terminology: ‘밝은 반점’, ‘종기의 흉터’, ‘제사장’, ‘정결하다’는 본문의 관찰 가능한 피부 표지와 의례적 정결 판정을 적절히 구별합니다. ‘깨끗하다’보다 ‘정결하다’가 레위기 문맥의 전문적 의미를 더 정확히 보존합니다.
  issues:
