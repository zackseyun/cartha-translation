base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
  footnotes:
  - marker: a
    text: Or 'under it'; the Hebrew idiom means the bright spot stays where it is rather than spreading.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그 밝은 반점이 그 자리에 그대로 있고[a] 퍼지지 않으면, 그것은 종기의 흉터이니 제사장이 그를 정결하다고 선언해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그 아래에 서 있다’입니다. 이 문맥에서는 밝은 반점이 퍼지지 않고 있던 자리에 머물러 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 하지만 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 이전 절과 대조되는 조건을 자연스럽게 살리기 위해 역접을 두었고, 뒤의 조건문은 ‘만일’로 받았습니다.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  english_pob_choice: remains in its place
  chosen_korean: 그 아래에서 … 제자리에 머물
  alternatives_korean:
  - 그 아래에 서
  - 그 밑에 남아
  lexicon: HALOT
  rationale: 직역하면 ‘그 아래에 서다’이지만, 진단 문맥에서는 이동·확산이 없음을 뜻하므로 ‘제자리에 머물’로 자연스럽게 옮겼습니다.
- source_word: הַבַּהֶרֶת
  english_pob_choice: the bright spot
  chosen_korean: 그 밝은 반점
  alternatives_korean:
  - 그 흰 반점
  - 그 밝은 점
  lexicon: HALOT
  rationale: 레위기 13장의 가시적인 피부 표지를 가리키는 말로, POB의 ‘bright spot’을 따라 ‘밝은 반점’으로 옮겼습니다.
- source_word: צָרֶבֶת הַשְּׁחִין
  english_pob_choice: the scar of the boil
  chosen_korean: 종기의 흉터
  alternatives_korean:
  - 종기의 자국
  - 종기의 상처 자국
  lexicon: HALOT
  rationale: 종기 뒤에 남은 흔적을 가리키므로 간결하게 ‘흉터’로 옮겼고, 이는 현재의 병변 자체가 아니라 남은 자국임을 보여 줍니다.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  english_pob_choice: the priest shall pronounce him clean
  chosen_korean: 제사장이 그를 깨끗하다고 선포해야 합니다
  alternatives_korean:
  - 제사장이 그를 정결하다고 선포해야 합니다
  - 제사장이 그를 깨끗하게 해야 합니다
  lexicon: HALOT
  rationale: טהר는 여기서 실제 치료가 아니라 정결 판정을 선언하는 뜻이므로, ‘정결하다’와 ‘선포하다’를 함께 살렸습니다.
theological_decisions:
- issue: 정결 판정과 치료의 구분
  chosen_reading: ‘깨끗하다고 선포하다’로 옮겨 제사장의 선언 행위임을 분명히 했습니다.
  alternative_readings:
  - 그를 깨끗하게 하다
  - 그를 치유하다
  rationale: 본문은 피부 질환의 의학적 완치가 아니라 정결 상태의 판정에 관한 것이므로, 제사장의 기능을 선언적으로 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
