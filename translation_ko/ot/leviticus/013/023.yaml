    issue: ‘그 아래에서’가 ‘제자리에 머물고’와 함께 들어가 원문의 관용구를 어색하고 혼란스럽게 번역합니다.
    rationale: תַּחְתֶּיהָ는 문자적으로 ‘그 아래에’라고도 옮길 수 있으나, 여기서는 תַּעֲמֹד 및 ‘퍼지지 않다’와 함께 반점이 원래 위치에 머무는 상태를 가리킵니다. 한국어 본문에는 ‘그 자리에 그대로’로 옮기고 문자적 대안은 각주에서 밝히는 것이 적절합니다.
  - severity: low
