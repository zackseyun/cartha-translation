source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
  footnotes:
  - marker: a
    text: Or 'itch' or the traditional 'scall' for the specific skin condition denoted by Hebrew neṭeq.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'not deeper than the skin,' a standard priestly criterion indicating the affected area does not appear sunken below the surrounding skin.
    reason: cultural_note
  - marker: c
    text: Hebrew 'the priest shall make him clean' here means an official declaration of clean status, not that the priest medically cures the condition.
    reason: alternative_reading
translation:
  language: ko
  text: 제칠일에 제사장은 그 비듬 같은 피부병[a]을 살펴보아야 합니다. 그런데 그 비듬 같은 피부병이 피부에서 퍼지지 않았고, 그 모습이 피부보다 깊지 않으면, 제사장은 그를 깨끗하다고 선언해야 합니다[c][b]. 그는 자기 옷을 빨아야 하며 깨끗해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶתֶק은 이곳에서 특정 피부 상태를 가리키며, 직역상 ‘가려움’이나 전통 번역의 ‘scall’과도 연결될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘피부보다 깊지 않다’는 뜻으로, 주변 피부보다 움푹 들어가 보이지 않는지 확인하는 제사장적 판정 기준입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘깨끗하게 하다’는 말은 제사장의 공식 판정을 뜻하며, 의학적으로 병을 고친다는 뜻은 아닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  english_pob_choice: scaly infection
  chosen_korean: 비듬 같은 피부병
  alternatives_korean:
  - 옴
  - 두피병
  - 피부병
  lexicon: HALOT
  rationale: 이 절의 נֶתֶק은 특정한 의식적 판정 대상인 피부 상태를 가리키므로, 지나치게 현대 의학적 진단명으로 좁히지 않으면서도 외형을 살린 표현이 필요합니다. '비듬 같은 피부병'은 보이는 증상을 드러내면서도 범주를 넓게 유지합니다.
- source_word: פָשָׂה
  english_pob_choice: has not spread
  chosen_korean: 퍼지지 않았고
  alternatives_korean:
  - 번지지 않았고
  - 확산되지 않았고
  lexicon: HALOT
  rationale: 문맥상 병변이 피부 전체로 퍼지는지를 보는 진단 표현이므로, 자연스럽고 직관적인 '퍼지지 않았고'로 옮겼습니다.
- source_word: עָמֹק מִן הָעוֹר
  english_pob_choice: deeper than the skin
  chosen_korean: 피부보다 깊지 않으면
  alternatives_korean:
  - 피부 아래로 내려앉지 않으면
  - 피부보다 더 깊지 않으면
  lexicon: HALOT
  rationale: 히브리어는 병변이 주변 피부보다 움푹 들어간 듯 보이는지를 묻는 기준이므로, 표준적이고 읽기 쉬운 '피부보다 깊지 않으면'이 가장 직접적입니다.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  english_pob_choice: the priest shall pronounce him clean
  chosen_korean: 제사장은 그를 깨끗하다고 선언해야 합니다
  alternatives_korean:
  - 제사장은 그를 정결하다고 해야 합니다
  - 제사장은 그를 깨끗하게 해야 합니다
  lexicon: HALOT
  rationale: טהר은 이 정결 규례에서 치료 행위가 아니라 공식 판정을 뜻하므로, '선언해야 합니다'로 사법적·제의적 기능을 분명히 했습니다.
- source_word: וְכִבֶּס בְּגָדָיו
  english_pob_choice: He shall wash his clothes
  chosen_korean: 그는 자기 옷을 빨아야 하며
  alternatives_korean:
  - 그는 자기 옷을 빨아야 하며
  - 그는 자기 의복을 빨아야 하며
  lexicon: HALOT
  rationale: בְּגָדָיו는 그의 옷/의복을 가리키므로, 현대 한국어에서 자연스러운 '옷'을 사용하되 의식적 행위를 유지했습니다.
theological_decisions:
- issue: טהר의 의미
  chosen_reading: 제사장은 병을 치료하는 것이 아니라 정결 상태를 공식적으로 판정합니다.
  alternative_readings:
  - 제사장이 그를 정결하게 만든다
  - 제사장이 그를 씻어 깨끗하게 한다
  rationale: 본문의 제의적 언어는 의학적 치유가 아니라 공동체 내 정결 판정을 뜻하므로, 오해를 피하기 위해 선언 기능을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
