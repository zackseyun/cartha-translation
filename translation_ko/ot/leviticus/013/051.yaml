  to: 제사장은 일곱째 날에 그 병변을 살펴보아야 합니다. 그 병변이 옷이나 날실이나 씨실이나 가죽, 또는 가죽으로 만들어 쓰는 어떤 물건에 퍼졌으면, 그것은 악성 짜라앗[a]입니다. 그것은 부정한 것입니다.
