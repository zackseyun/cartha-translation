  terminology: ‘문둥병’은 현대 한국어에서 낙인성이 강하고, 특히 옷과 가죽에도 적용되는 צָרַעַת의 기술적·의례적 범위를 잘못 의료화합니다. 음역 ‘짜라앗’을 사용하고 각주에서 그 범위를 설명합니다. נגע는 해당 물질 위의 징후를 가리키므로 ‘병변’으로 옮겼습니다.
