  source_fidelity: 현 초안은 נגע를 단순히 ‘병’으로 반복하고, 날실과 씨실의 구별을 보존하지 못했으며, 가죽 물품에 적용되는 צָרַעַת를 ‘문둥병’으로 옮겨 본문의 적용 범위와 어긋납니다. 또한 가죽 물품에 관한 절을 중복하여 조건문 구조가 달라졌습니다. 개정문은 제사장의 검사, 병변의 확산, 직물의 날실·씨실, 가죽으로 만든 모든 용품, 악성 짜라앗 및 의례적 부정이라는 진술을 보존합니다.
