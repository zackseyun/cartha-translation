    rationale: ‘반점’은 피부의 점/변색에 한정되어 들릴 수 있습니다. 문맥과 영어 POB의 ‘scaly eruption’에 따라 비교적 가벼운 비늘진 피부 발진으로 옮기는 것이 더 적절합니다.
  - severity: low
    issue: 각주 표지가 ‘일곱째 날’에 붙어 있음
    rationale: 각주는 מִסְפַּחַת의 대안 번역을 설명하므로, 그 번역어인 ‘비늘진 발진’에 붙어야 합니다.
