  source_fidelity: 원문의 조건적 진술(환부가 옅어지고 피부에 퍼지지 않음)과 제사장의 제의적 정결 판정은 대체로 반영되었으나, ‘부정하다고 하지 말고’는 원문에 없는 대조를 추가합니다. מִסְפַּחַת는 ‘반점’보다 피부 발진/비늘진 발진으로 옮기는 편이 영어 POB의 어휘 판단과 원문의 피부 증상 의미를 더 잘 보존합니다.
  naturalness: ‘보십시오’는 히브리어 הנה의 관용적 주의 환기를 기계적으로 재현하여 이 법규 문맥의 현대 한국어에서는 다소 부자연스럽습니다. 조건절을 ‘…않았으면’으로 정리하고, ‘정하다고 판정하다’를 사용하면 합쇼체의 공식적 문체로 자연스럽습니다.
  terminology: נגע는 ‘환부’로 유지할 수 있으며, 의학적 감염을 단정하지 않습니다. טהר는 ‘정하다고 판정하다’로 옮겨 제사장이 물리적으로 정결하게 만든다는 뜻을 피합니다. מִסְפַּחַת는 ‘비늘진 발진’ 및 해당 어휘에 연결된 각주로 처리합니다.
