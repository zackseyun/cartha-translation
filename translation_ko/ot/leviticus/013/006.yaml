  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֹת֜/וֹ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֮ שֵׁנִית֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע וְ/לֹא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/טִהֲר֤/וֹ הַ/כֹּהֵן֙ מִסְפַּ֣חַת הִ֔יא וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
  footnotes:
  - marker: a
    text: Or 'rash.' The Hebrew term refers to a relatively minor skin eruption, in contrast to a more serious spreading condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 일곱째 날에 그를 다시 살펴보아야 합니다[a]. 보십시오, 그 환부가 희미해졌고 그 환부가 피부에 퍼지지 않았습니다. 제사장은 그를 부정하다고 하지 말고 정하다고 선포해야 합니다. 이는 반점입니다. 그는 자기 옷을 빨아야 하며, 그러면 정하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발진’. 히브리어 용어는 비교적 가벼운 피부 병변을 가리키며, 더 심한 확산성 상태와 대비됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: shall examine
  chosen_korean: 살펴보아야 합니다
  alternatives_korean:
  - 보아야 합니다
  - 검사해야 합니다
  lexicon: HALOT
  rationale: 제사장이 주어인 ראה는 단순한 시각이 아니라 판정 목적의 공식적 점검이므로, 자연스러운 합쇼체로 ‘살펴보다’가 가장 잘 맞습니다.
- source_word: שֵׁנִית
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 두 번째로
  - 재차
  lexicon: HALOT
  rationale: 재검사의 반복을 나타내므로, 현대 한국어에서 가장 자연스러운 ‘다시’로 옮겼습니다.
- source_word: הַנֶּגַע
  english_pob_choice: the infection
  chosen_korean: 그 환부
  alternatives_korean:
  - 그 감염
  - 그 병변
  - 그 종기
  lexicon: HALOT
  rationale: 레위기 13장의 נגע는 피부 상태를 가리키는 법적·의례적 표지이므로, 지나치게 의학적이거나 무거운 ‘감염’보다 관찰 대상이 되는 ‘환부’가 문맥상 더 적절합니다.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  english_pob_choice: the priest shall pronounce him clean
  chosen_korean: 제사장은 그를 부정하다고 하지 말고 정하다고 선포해야 합니다
  alternatives_korean:
  - 제사장은 그를 정하다고 선포해야 합니다
  - 제사장은 그를 깨끗하다고 판정해야 합니다
  lexicon: HALOT
  rationale: טהר는 여기서 실제로 씻기는 행위가 아니라 정결 판정을 내리는 제의적 선언이므로, ‘선포하다’로 처리하되 결과를 분명히 하기 위해 ‘정하다’로 옮겼습니다.
- source_word: מִסְפַּחַת
  english_pob_choice: a scaly eruption
  chosen_korean: 반점
  alternatives_korean:
  - 비늘진 발진
  - 비듬성 발진
  - 피부발진
  lexicon: HALOT
  rationale: 이 용어는 더 중한 확산성 질환과 구별되는 비교적 가벼운 피부 증상을 가리키므로, 한국어에서 과도한 의학 용어를 피하면서도 징후성 피부 병변을 드러내는 ‘반점’을 선택했습니다.
theological_decisions:
- issue: 제의적 정결 판정과 의학적 치유의 구분
  chosen_reading: ‘정하다’와 ‘선포하다’를 사용해 제사장의 법적·제의적 판정을 드러내고, 치유 완치를 직접 말하지 않았습니다.
  alternative_readings:
  - 그를 깨끗하게 하다
  - 그가 나았다
  rationale: 본문은 피부 상태에 대한 제사장 판정과 정결 상태의 선언을 말할 뿐이므로, 실제 의학적 완치로 오해될 표현은 피해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
