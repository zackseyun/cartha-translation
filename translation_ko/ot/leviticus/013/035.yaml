  text: וְ/אִם פָּשֹׂ֥ה יִפְשֶׂ֛ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר אַחֲרֵ֖י טָהֳרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
  footnotes:
  - marker: a
    text: Or 'the itch' or, in older English, 'the scall.' The Hebrew term refers to a particular skin condition described in this chapter, likely involving scaling and hair loss.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 나병이 깨끗하게 된 뒤에 그 피부에서 정말 퍼진다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶתֶק은 이 장에서 두피나 수염에 생기는 특정한 피부 질환을 가리키며, 단순한 ‘가려움’이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 한다면
  alternatives_korean:
  - 그리고 만일 … 한다면
  - 그런데 … 한다면
  lexicon: HALOT
  rationale: 조건문이지만 앞선 정결 판정 뒤에 이어지는 반대 경우이므로, 한국어에서는 ‘그러나’로 대조를 살리는 것이 자연스럽습니다.
- source_word: פָּשֹׂה יִפְשֶׂה
  english_pob_choice: does spread
  chosen_korean: 정말 퍼진다면
  alternatives_korean:
  - 확실히 퍼진다면
  - 계속 퍼진다면
  - 크게 퍼진다면
  lexicon: HALOT
  rationale: 히브리어의 분사적 강조와 동사 반복이 ‘퍼짐’의 강세를 나타내므로, ‘정말’로 강조를 살리되 과도한 해석은 피했습니다.
- source_word: הַנֶּתֶק
  english_pob_choice: the scaly eruption
  chosen_korean: 그 나병
  alternatives_korean:
  - 그 비늘진 발진
  - 그 탈모성 피부병변
  - 그 피부의 비늘진 염증
  lexicon: HALOT
  rationale: 레위기 13장의 נֶתֶק은 특정한 피부/두피 질환 범주를 가리키므로, 한국어 전통 독자가 곧바로 식별할 수 있는 ‘나병’을 기본으로 하되, 본문 주석에서 별도 설명이 필요합니다.
- source_word: טָהֳרָתוֹ
  english_pob_choice: after his cleansing
  chosen_korean: 깨끗하게 된 뒤에
  alternatives_korean:
  - 정결하게 된 뒤에
  - 그의 정결 후에
  - 깨끗하다고 판정된 뒤에
  lexicon: HALOT
  rationale: 의식적·판정적 의미를 담되 한국어 문장 흐름을 위해 ‘깨끗하게 된 뒤에’로 옮겼습니다. 이는 도덕적 정화가 아니라 정결 판정 이후를 뜻합니다.
theological_decisions:
- issue: נֶתֶק의 한국어 대응
  chosen_reading: 전통적 용례를 고려해 ‘나병’으로 옮기되, 레위기 13장의 특정 피부 질환이라는 본문 맥락을 유지합니다.
  alternative_readings:
  - ‘그 비늘진 발진’으로 직역
  - ‘특정 피부병변’으로 설명적 번역
  rationale: 이 절은 진단 절차의 일부이므로, 독자가 본문 범주를 즉시 이해하도록 하면서도 해설의 여지를 남기는 표현이 적절합니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 문맥
