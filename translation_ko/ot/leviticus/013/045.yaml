review_pass:
  verdict: revise
  source_fidelity: ‘환부’는 נגע의 가능한 문맥적 의미이지만, 현 번역의 ‘피부병이 있는 사람, 곧 그 환부가 있는 사람’은 히브리어의 관계절을 한국어에서 부자연스럽게 중복합니다. 또한 שָׂפָם을 일반적인 ‘수염’으로 옮기면 가리는 부위가 지나치게 넓어질 수 있으므로, 더 직접적인 ‘윗입술’을 본문에 두고 대안을 주석으로 보존하는 것이 안전합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘그의’의 반복과 ‘곧 그 환부가 있는 사람’은 현대 표준 한국어 문장으로 다소 경직되고 어색합니다. 상태를 나타내는 두 히브리어 서술은 ‘…채로 있어야 하며’로 자연스럽게 옮길 수 있습니다.
  terminology: ‘피부병’과 ‘부정하다’는 특정 현대 질환이나 도덕적 죄책을 단정하지 않아 적절합니다. ‘윗입술’은 שָׂפָם의 기본적 의미를 반영하며, 콧수염/윗입술 부위라는 대안은 주석에서 보존합니다.
  issues:
  - severity: medium
    issue: ‘피부병이 있는 사람, 곧 그 환부가 있는 사람’이 어색하게 중복됩니다.
    rationale: אֲשֶׁר־בּוֹ הַנֶּגַע는 앞의 대상을 수식하는 관계절입니다. 한국어에서는 ‘피부병을 앓아 환부가 있는 사람’처럼 연결해야 의미와 문장성이 함께 살아납니다.
  - severity: medium
    issue: ‘수염을 가리고’는 שָׂפָם의 지시 범위를 넓힐 수 있습니다.
    rationale: 이 단어는 윗입술 또는 콧수염이 나는 윗입술 부위를 가리킵니다. 일반적 ‘수염’은 턱수염까지 포함할 수 있으므로, 본문은 ‘윗입술’로 하고 대안을 주석에 제시하는 편이 더 정확합니다.
  - severity: low
    issue: ‘옷을 찢고, 머리를 풀어 헤치고’는 명령 행위로 들릴 수 있습니다.
    rationale: 히브리어는 옷이 찢긴 상태와 머리가 풀어진 상태를 요구합니다. ‘찢어져 있어야 하며’와 ‘풀어 헤친 채로 있어야 하고’는 이 상태성을 더 잘 반영합니다.
  revised_text: 피부병을 앓아 환부가 있는 사람은 옷이 찢어져 있어야 하며, 머리를 풀어 헤친 채로 있어야 하고, 윗입술을 가리고, ‘부정하다, 부정하다!’라고 외쳐야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘수염, 곧 콧수염 부위를 가리고’. 히브리어 표현은 윗입술 또는 콧수염이 나는 부위를 가리는 것을 뜻할 수 있으며, 애도와 공개 경고의 표지입니다.
    reason: lexical_alternative
  revision_rationale: 관계절의 중복을 자연스러운 한국어로 정리하되, 피부병과 환부의 구별은 유지했습니다. 히브리어의 상태 서술을 반영하도록 옷과 머리의 표현을 다듬었습니다. שָׂפָם의 논쟁 가능한 의미는 본문에서 더 직접적인 ‘윗입술’로 옮기고 주석에서 콧수염 부위라는 대안을 보존했습니다.
