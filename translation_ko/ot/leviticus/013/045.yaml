source:
  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
  footnotes:
  - marker: a
    text: Or 'he shall cover his upper lip.' The Hebrew expression refers to covering the area of the lip/mustache as a sign of mourning and public warning.
    reason: lexical_alternative
translation:
  language: ko
  text: 피부병이 있는 사람[a], 곧 그 환부가 있는 사람은 그의 옷을 찢고, 그의 머리를 풀어 헤치고, 수염을 가리고, ‘부정하다, 부정하다!’라고 외쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 윗입술을 가리고’. 히브리어 표현은 수염/윗입술 부위를 가리는 동작을 가리키며, 애도와 공개 경고의 표지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  english_pob_choice: the one with the skin disease
  chosen_korean: 피부병이 있는 사람
  alternatives_korean:
  - 나병 환자
  - 피부질환이 있는 자
  - 병이 든 사람
  lexicon: HALOT
  rationale: 레위기 문맥의 רחע/צרע 계열은 특정 현대 질병명보다 넓은 피부병 범주를 가리키므로, 전통적 ‘나병’ 대신 소스 의미를 직접 드러내는 표현을 택했습니다.
- source_word: הַנֶּגַע
  english_pob_choice: the infection
  chosen_korean: 환부
  alternatives_korean:
  - 감염
  - 질환
  - 병변
  lexicon: HALOT
  rationale: 여기서 נגע는 의학적 ‘감염’이라기보다 피부에 나타난 환부/병변을 가리키므로, 문맥상 자연스럽고 신체 부위를 직접 가리키는 ‘환부’를 사용했습니다.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  english_pob_choice: his clothes shall be torn
  chosen_korean: 그의 옷을 찢고
  alternatives_korean:
  - 그의 의복을 찢고
  - 그의 옷을 해지고
  - 그의 옷이 찢어져야 하고
  lexicon: HALOT
  rationale: פְרֻמִים는 찢긴 옷이라는 표지 동작을 뜻하므로, 한국어로도 의례적·공적 표지를 분명하게 보이게 했습니다.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  english_pob_choice: his head shall be left unkempt
  chosen_korean: 그의 머리를 풀어 헤치고
  alternatives_korean:
  - 그의 머리를 헝클어뜨리고
  - 그의 머리를 단정하지 않게 하고
  - 그의 머리를 풀어 두고
  lexicon: HALOT
  rationale: פָרוּעַ는 단순한 ‘헝클어짐’보다 풀어헤친 상태를 가리키므로, 부정과 애도의 외적 표시가 살아나도록 옮겼습니다.
- source_word: וְעַל שָׂפָם יַעְטֶה
  english_pob_choice: he shall cover his mustache
  chosen_korean: 수염을 가리고
  alternatives_korean:
  - 윗입술을 가리고
  - 콧수염 부위를 가리고
  - 입술 위를 가리고
  lexicon: HALOT
  rationale: שָׂפָם은 윗입술/수염 부위를 가리키는 관용구이므로, 한국어에서는 의미를 자연스럽게 전하면서도 주석 없이도 이해되는 ‘수염을 가리고’를 택했습니다.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  english_pob_choice: he shall cry out, ‘Unclean, unclean!’
  chosen_korean: ‘부정하다, 부정하다!’라고 외쳐야 합니다
  alternatives_korean:
  - ‘부정하다, 부정하다!’라고 부르짖어야 합니다
  - ‘부정하다, 부정하다!’라고 선포해야 합니다
  - ‘부정하다, 부정하다!’라고 외쳐야 합니다
  lexicon: HALOT
  rationale: טָמֵא는 여기서 도덕적 비난이 아니라 의례적·공동체적 상태를 가리키므로, 전통적 교회 용례와 구분되는 ‘부정하다’를 유지했습니다.
theological_decisions:
- issue: טָמֵא의 의미 범위와 현대 독자의 오해 가능성
  chosen_reading: ‘부정하다’로 옮겨 의례적 부정과 공동체적 격리를 드러내고, 도덕적 죄책이나 현대 의학적 진단으로 환원하지 않았습니다.
  alternative_readings:
  - 더러우다
  - 불결하다
  - 불순하다
  rationale: 레위기 13장의 ভাষ은 정결/부정 체계 안에서 작동하므로, 한국어에서도 윤리적 낙인보다 의례적 상태를 우선 보여 주는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
