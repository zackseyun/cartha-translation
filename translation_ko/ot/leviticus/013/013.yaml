  terminology: צָרַעַת는 현대 의학적 의미의 나병으로 한정하지 않고 ‘피부병’으로 옮기는 것이 적절합니다. טהר는 치료나 실제 정화가 아니라 제사장의 의례적·법적 선언이므로 ‘깨끗하다고 선언해야 합니다’로 표현합니다.
