  source_fidelity: 원문의 제사장에 의한 검사와 피부병이 온몸을 덮은 상태, 그리고 정결 판정이라는 핵심 흐름은 대체로 반영되었습니다. 그러나 초안의 ‘덮었으므로’는 피부병이 온몸을 덮은 사실을 정결 선언의 단순한 인과로 처리하여, 관찰 뒤에 내려지는 법적 판정이라는 원문의 전개를 약화합니다. 또한 직접목적어는 문자적으로 ‘환부/병변’이지만 판정은 그 사람에게 적용됩니다.
