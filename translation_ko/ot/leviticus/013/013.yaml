  to: 제사장이 그를 살펴보아 피부병[a]이 그의 온몸을 덮은 것을 보면, 그 사람을[b] 깨끗하다고 선언해야 합니다. 그것이 모두 하얗게 변하였으므로, 그는 깨끗합니다.
