id: LEV.13.28
reference: Leviticus 13:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
  footnotes:
  - marker: a
    text: Or 'under it' for 'in its place'; the Hebrew idiom literally says the bright spot 'stands beneath it,' but the sense in context is that it remains stationary rather than spreading.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 밝은 반점이 그 자리에 그대로 있고 피부에서 퍼지지 않았으며, 그것이 희미해졌다면, 그것은 화상에서 생긴 부스럼입니다. 제사장은 그를 깨끗하다고 선언해야 하는데, 그것은 화상의 흉터이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 아래에’로 옮길 수 있습니다. 히브리어 관용구는 문자적으로 ‘그 아래에 서다’라는 뜻이지만, 문맥상으로는 병변이 퍼지지 않고 그대로 머문다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  english_pob_choice: remains in its place
  chosen_korean: 그 자리에 그대로 있고
  alternatives_korean:
  - 그 아래에 서 있고
  - 그 자리에 머물러 있고
  lexicon: HALOT
  rationale: ‘서다/머물다’의 관용적 의미를 진단 문맥에 맞게 풀어, 반점이 이동하지 않고 정지해 있다는 뜻을 자연스럽게 살렸습니다.
- source_word: הַבַּהֶרֶת
  english_pob_choice: the bright spot
  chosen_korean: 밝은 반점
  alternatives_korean:
  - 밝은 자국
  - 빛나는 반점
  lexicon: HALOT
  rationale: 레위기 13장의 피부 진단 용어를 한국어로 간결하게 옮기되, 시각적으로 드러나는 병변이라는 점을 유지했습니다.
- source_word: פָשְׂתָה בָעוֹר
  english_pob_choice: has spread in the skin
  chosen_korean: 피부에서 퍼지지 않았으며
  alternatives_korean:
  - 피부에 퍼지지 않았으며
  - 피부 속으로 번지지 않았으며
  lexicon: HALOT
  rationale: 부정문으로 바뀐 상태를 분명히 하면서, עור를 ‘피부에서’로 옮겨 진단적 관찰 문맥을 살렸습니다.
- source_word: שְׂאֵת הַמִּכְוָה
  english_pob_choice: the swelling from the burn
  chosen_korean: 화상에서 생긴 부스럼
  alternatives_korean:
  - 화상으로 인한 부기
  - 화상에서 생긴 부종
  lexicon: HALOT
  rationale: שְׂאֵת의 ‘올라옴/부풀어 오름’ 계열 의미를 한국어 피부 병변 표현으로 풀어, 문맥상 자연한 진단 결과를 전달했습니다.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  english_pob_choice: the priest shall pronounce him clean
  chosen_korean: 제사장은 그를 깨끗하다고 선언해야 하는데
  alternatives_korean:
  - 제사장은 그를 깨끗하다고 선포해야 하는데
  - 제사장은 그를 정결하다고 판정해야 하는데
  lexicon: HALOT
  rationale: טהר는 여기서 실제로 깨끗하게 만드는 행위가 아니라 제의적 판정을 뜻하므로, ‘선언하다’로 옮겨 제사장의 법정적 기능을 드러냈습니다.
- source_word: צָרֶבֶת
  english_pob_choice: the scar
  chosen_korean: 흉터
  alternatives_korean:
  - 상처 자국
  - 흉자국
  lexicon: HALOT
  rationale: 화상 뒤에 남은 흔적이라는 진단 의미를 가장 자연스럽게 전달하는 표준어로 선택했습니다.
theological_decisions:
- issue: 제사장의 역할이 치료가 아닌 판정인지 여부
  chosen_reading: 제사장은 사람을 실제로 치유하는 것이 아니라, 의례적으로 ‘깨끗하다’고 선언하는 판정자입니다.
  alternative_readings:
  - 제사장이 그를 정결하게 만든다
  - 제사장이 그를 치유한다
  rationale: 레위기 정결 규례의 문맥에서 טהר는 의학적 치료가 아니라 정결 판정을 뜻하므로, 제사장의 기능을 행정적·의례적으로 표현했습니다.
  doctrine_reference: 레위기 13장의 정결 판정 규례
