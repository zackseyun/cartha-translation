  terminology: ‘밝은 반점’과 ‘화상의 흉터’는 적절합니다. 제의적 상태의 판정에는 ‘정결하다고 판정하다’를 쓰고, 화상으로 말미암은 שְׂאֵת에는 ‘화상으로 생긴 부기’를 사용하는 것이 원문의 의미 범위와 현대 한국어 사용에 더 잘 맞습니다.
