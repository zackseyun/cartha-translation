base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת, traditionally 'leprosy'; in Leviticus this term likely refers more broadly to a range of serious skin conditions rather than specifically modern Hansen's disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그것을 살펴보니, 그 모습이 피부보다 더 낮게 꺼져 보이고 그곳의 털이 하얗게 변하였으면, 제사장은 그를 부정하다고 선언해야 합니다. 그것은 그 종기에서 돋아난 피부 질환[a]의 병변입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת는 전통적으로 ‘나병’으로 번역되지만, 레위기에서는 현대 한센병만을 가리킨다기보다 여러 심각한 피부 질환을 폭넓게 포함하는 말일 수 있습니다.
    reason: lexical_alternative
