source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת, traditionally 'leprosy'; in Leviticus this term likely refers more broadly to a range of serious skin conditions rather than specifically modern Hansen's disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장은 그것을 살펴보아야 합니다. 보십시오, 그 겉모습이 피부보다 더 깊고 그 털이 하얗게 변하였으면, 제사장은 그를 부정한 사람으로 선언해야 합니다. 그것은 나병의 발진입니다. 그 종기 안에 번져 나온 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת는 전통적으로 ‘나병’으로 번역되지만, 레위기에서는 현대 한센병만을 가리킨다기보다 여러 심각한 피부 질환을 폭넓게 포함하는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: shall examine
  chosen_korean: 살펴보아야 합니다
  alternatives_korean:
  - 보아야 합니다
  - 검진해야 합니다
  lexicon: HALOT
  rationale: 제사장의 판정 절차에서는 단순 시각보다 확인·검사의 의미가 강하므로, ‘살펴보다’로 진단적 뉘앙스를 살렸습니다.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  english_pob_choice: its appearance is deeper than the skin
  chosen_korean: 그 겉모습이 피부보다 더 깊고
  alternatives_korean:
  - 그 겉모습이 피부보다 더 낮고
  - 그 모습이 피부 아래로 꺼져 있고
  lexicon: HALOT
  rationale: 피부 표면 아래로 꺼져 보이는 병변의 상태를 자연스럽게 전달하기 위해 ‘더 깊고’로 옮겼습니다.
- source_word: וְטִמְּאוֹ
  english_pob_choice: shall pronounce him unclean
  chosen_korean: 그를 부정한 사람으로 선언해야 합니다
  alternatives_korean:
  - 그를 부정하다고 선언해야 합니다
  - 그를 부정하게 해야 합니다
  lexicon: HALOT
  rationale: 제사장이 상태를 판정해 선포하는 법적·의례적 기능을 반영하기 위해 ‘부정한 사람으로 선언하다’를 택했습니다.
- source_word: נֶגַע צָרַעַת
  english_pob_choice: an outbreak of leprosy / a skin disease
  chosen_korean: 나병의 발진입니다
  alternatives_korean:
  - 피부 질환의 발진입니다
  - 피부병의 발현입니다
  lexicon: HALOT
  rationale: POB의 본문 전통을 따라 ‘나병’을 유지하되, 본 절의 נֶגַע를 병변의 출현으로 보아 ‘발진’으로 옮겼습니다.
- source_word: פָּרָחָה
  english_pob_choice: it has broken out
  chosen_korean: 번져 나온 것입니다
  alternatives_korean:
  - 터져 나온 것입니다
  - 퍼져 나온 것입니다
  lexicon: HALOT
  rationale: 질병이 종기 안에서 드러나 나타난다는 뜻을 살리되, 단순 확산보다 병변의 발현을 강조했습니다.
theological_decisions:
- issue: צָרַעַת의 한국어 대응
  chosen_reading: 나병
  alternative_readings:
  - 피부 질환
  - 문둥병
  rationale: POB 영어 본문이 ‘leprosy’를 유지한 전통을 반영하되, 한국어에서는 전통적 성서 용어인 ‘나병’을 사용해 본문의 의례적·상징적 무게를 보존했습니다.
  doctrine_reference: 'translation philosophy: source-faithful equivalence with established biblical diction'
