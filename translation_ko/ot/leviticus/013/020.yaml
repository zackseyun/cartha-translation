revisions:
- from: 그리고 제사장은 그것을 살펴보아야 합니다. 보십시오, 그 겉모습이 피부보다 더 깊고 그 털이 하얗게 변하였으면, 제사장은 그를 부정한 사람으로 선언해야 합니다. 그것은 나병의 발진입니다. 그 종기 안에 번져 나온 것입니다.[a]
  to: 제사장이 그것을 살펴보니, 그 모습이 피부보다 더 낮게 꺼져 보이고 그곳의 털이 하얗게 변하였으면, 제사장은 그를 부정하다고 선언해야 합니다. 그것은 그 종기에서 돋아난 피부 질환[a]의 병변입니다.
  rationale: 원문의 진단적 조건과 의례적 판정을 유지하면서, 꺼져 보이는 병변이라는 시각적 징후를 명확히 했습니다. צָרַעַת를 현대 질환명으로 단정하지 않고 ‘피부 질환’으로 옮겨 원어의 의미 범위를 보존했으며, 각주를 해당 용어에 직접 연결했습니다. פָּרָחָה는 확산이 아니라 종기에서의 발현을 뜻하도록 ‘돋아난’으로 수정했습니다.
