  source_fidelity: 원문의 진단 절차와 핵심 징후는 대체로 반영되었으나, מַרְאֶהָ שָׁפָל מִן־הָעוֹר는 단순히 ‘더 깊고’라고 하기보다 피부 표면보다 낮게, 곧 꺼져 보이는 상태를 나타냅니다. 또한 נֶגַע צָרַעַת를 ‘나병의 발진’으로 옮기면 현대 의학적 나병 및 발진이라는 특정한 범주를 과도하게 부여할 수 있습니다.
  naturalness: ‘그리고 … 보십시오’는 한국어 서술 문맥에서 부자연스럽고, ‘그 종기 안에 번져 나온 것’도 원문의 ‘그 종기에서 돋아났다/생겨났다’보다 확산의 의미를 더합니다. 조건·판정 문맥에 맞춘 문장이 더 자연스럽습니다.
  terminology: צָרַעַת는 현대 한센병으로 한정하지 않는 ‘피부 질환’으로 처리하고 각주에서 전통적 번역어 ‘나병’을 밝혔습니다. נֶגַע는 ‘병변’으로, טמא는 의례·법적 판정에 맞게 ‘부정하다고 선언하다’로 옮겼습니다.
