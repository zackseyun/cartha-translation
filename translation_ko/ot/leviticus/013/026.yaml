  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
  footnotes:
  - marker: a
    text: Or 'it is not lower than the skin,' that is, it does not appear sunken below the surrounding skin.
    reason: lexical_alternative
  - marker: b
    text: Or 'the priest shall quarantine him' or 'confine him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 제사장이 그것을 살펴보니, 밝은 반점 안에 흰 털이 없고 그것이 피부보다 꺼져 있지 않으며[a] 희미하면, 제사장은 그를 이레 동안 격리해야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘피부보다 낮지 않으며’입니다. 곧 주변 피부 아래로 꺼져 보이지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 이레 동안 가두어 두어야 합니다’로 옮길 수 있습니다.
    reason: lexical_alternative
