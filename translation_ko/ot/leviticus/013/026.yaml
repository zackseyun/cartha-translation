id: LEV.13.26
reference: Leviticus 13:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
  footnotes:
  - marker: a
    text: Or 'it is not lower than the skin,' that is, it does not appear sunken below the surrounding skin.
    reason: lexical_alternative
  - marker: b
    text: Or 'the priest shall quarantine him' or 'confine him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장이 그것을 살펴보아도[a] 밝은 반점 안에 흰 털이 없고, 피부보다 더 깊지 않으며, 그것이 희미하면, 제사장은 그를 이레 동안 격리해야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘피부보다 낮지 않으며’, 다시 말해 주변 피부 아래로 꺼져 보이지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 격리하다’, ‘가두다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה / וְהִנֵּה
  english_pob_choice: examines it / and behold
  chosen_korean: 살펴보아도
  alternatives_korean:
  - 보아도
  - 검사해도
  lexicon: HALOT
  rationale: 제사장의 공식적인 진단 행위를 한국어로 자연스럽게 드러내면서도 단순한 시각 동작보다 절차적 검사를 반영합니다.
- source_word: בַּבֶּהֶרֶת
  english_pob_choice: in the bright spot
  chosen_korean: 밝은 반점
  alternatives_korean:
  - 밝은 점
  - 반점
  lexicon: HALOT
  rationale: 이 용례의 בַּהֶרֶת는 피부의 밝은 병변을 가리키므로, 색채 뉘앙스를 살린 ‘밝은 반점’이 직역성과 가독성을 함께 지닙니다.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  english_pob_choice: it is not deeper than the skin
  chosen_korean: 피부보다 더 깊지 않으며
  alternatives_korean:
  - 피부보다 낮지 않으며
  - 피부 아래로 꺼져 있지 않으며
  lexicon: HALOT
  rationale: 문자적으로는 ‘낮다/가라앉다’의 뜻이지만, 진단 기준을 한국어로 분명히 전달하려면 ‘피부보다 더 깊지 않다’가 가장 자연스럽습니다.
- source_word: כֵהָה
  english_pob_choice: faded
  chosen_korean: 희미하면
  alternatives_korean:
  - 옅으면
  - 퇴색하면
  - 희석되면
  lexicon: HALOT
  rationale: 병변의 시각적 강도가 약해진 상태를 가리키므로, 현대 한국어에서 가장 무난하고 상태 변화를 잘 나타내는 ‘희미하다’를 택했습니다.
- source_word: וְהִסְגִּירוֹ
  english_pob_choice: the priest shall isolate him
  chosen_korean: 그를 이레 동안 격리해야 합니다
  alternatives_korean:
  - 그를 이레 동안 가두어야 합니다
  - 그를 이레 동안 격리시켜야 합니다
  - 그를 이레 동안 격리해야 합니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘가두다/분리하다’의 뜻이지만, 현대 독자가 이해하기 쉬운 절차적 표현으로 ‘격리하다’를 사용했습니다.
theological_decisions:
- issue: 제사장의 판정과 격리 조치의 표현
  chosen_reading: 제사장이 상태를 살핀 뒤 격리 판정을 내리는 절차로 옮겼습니다.
  alternative_readings:
  - 제사장이 그를 ‘가두다’라고 직역하는 방식
  - 현대 공중보건 용어인 ‘검역’으로 바꾸는 방식
  rationale: 본문은 의학적 진단이 아니라 정결 판정을 위한 제의적 관찰을 말하므로, 절차는 살리되 현대 감염병 맥락으로 과도하게 이동시키지 않도록 했습니다.
  doctrine_reference: 레위기 13장의 정결/부정 판정 규례
