  terminology: ‘밝은 반점’, ‘흰 털’, ‘희미하다’, ‘이레 동안 격리해야 합니다’는 적절합니다. ‘격리’는 현대 공중보건의 기술 용어로 단정하기보다 관찰을 위한 분리 조치를 이해 가능하게 전달합니다. 대안은 각주에서 ‘가두어 두다’로 제시합니다.
