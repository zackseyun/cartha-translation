  lexicon: HALOT
  rationale: 히브리어 수동형은 행위자를 드러내지 않으므로, 한국어에서도 수동을 살리되 자연스러운 규범 문장으로 옮겼습니다.
theological_decisions:
- issue: צָרַעַת의 번역 범주 유지
  chosen_reading: ‘피부병’으로 옮겨 현대 의학의 나병과 구별합니다.
  alternative_readings:
  - 나병
  - 문둥병
  rationale: 본문은 사람 피부뿐 아니라 옷과 가죽에도 적용되는 제의적 진단 범주이므로, 전통적 번역어가 주는 협소한 임상 이미지를 피하는 것이 소스 의미에 더 충실합니다.
  doctrine_reference: 레위기 13장의 제의법 문맥과 원어 우선 번역 원칙
