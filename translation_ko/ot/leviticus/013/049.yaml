  naturalness: ‘녹빛이나 붉은빛을 띠면’은 현대 표준 한국어로 자연스럽고, 원문의 근사적 색조를 잘 나타냅니다. ‘날실/씨실’은 적절한 기술 용어입니다. ‘피부병의 반점’은 옷과 가죽에도 적용되는 고대의 제의·진단 범주라는 문맥상 다소 낯설 수 있으나, 본문과 주석의 범주성을 유지하는 번역으로 둘 수 있습니다.
