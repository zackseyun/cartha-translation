  lexicon: HALOT
  rationale: 겹말 형태가 대체로 색조의 근사치를 나타내므로, 단정한 단색보다 ‘-빛이 도는’ 표현이 관찰적 뉘앙스를 보존합니다.
- source_word: שְׁתִי / עֵרֶב
