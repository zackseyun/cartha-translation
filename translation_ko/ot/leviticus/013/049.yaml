  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
  footnotes:
  - marker: a
    text: Or 'weft' for 'woof,' the crosswise threads in woven fabric.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'a spot of leprosy.' The Hebrew term refers more broadly to a ritual-physical disease category in Leviticus, not specifically to modern leprosy.
    reason: alternative_reading
translation:
  language: ko
  text: 또 그 반점이 옷이나 가죽, 날실이나 씨실, 또는 가죽으로 만든 어떤 물건에 있으면, 그것은 피부병의 반점입니다. 그것은 제사장에게 보여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직조 용어로서 ‘씨실’은 전통 영어 ‘woof’에 해당하는 말이며, 현대 한국어에서는 ‘위사’와도 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘나병’으로 옮겨 왔으나, 레위기의 צָרַעַת는 현대 의학의 나병보다 더 넓은 제의적·현상적 범주를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶּגַע
  english_pob_choice: spot
  chosen_korean: 반점
  alternatives_korean:
  - 점
  - 자국
  - 병반
  lexicon: HALOT
  rationale: 레위기 13장에서는 옷과 가죽에도 생기는 관찰 가능한 국부 표시를 가리키므로, 병리적이면서도 과도하게 의학화되지 않은 ‘반점’이 ‘spot’을 가장 자연스럽게 살립니다.
- source_word: יְרַקְרַק / אֲדַמְדָּם
  english_pob_choice: greenish / reddish
  chosen_korean: 녹빛이 도는 / 붉은빛이 도는
  alternatives_korean:
  - 푸르스름한 / 붉은
  - 연두빛 / 분홍빛
  lexicon: HALOT
  rationale: 겹말 형태가 대체로 색조의 근사치를 나타내므로, 단정한 단색보다 ‘-빛이 도는’ 표현이 관찰적 뉘앙스를 보존합니다.
- source_word: שְׁתִי / עֵרֶב
  english_pob_choice: warp / woof
  chosen_korean: 날실 / 씨실
  alternatives_korean:
  - 세로실 / 가로실
  - 워프 / 위프
  lexicon: HALOT
  rationale: 직조 용어의 기술적 구분을 유지해야 하므로, 한국어 섬유 용어로 통용되는 ‘날실/씨실’이 가장 정확합니다.
- source_word: צָרַעַת
  english_pob_choice: skin disease
  chosen_korean: 피부병
  alternatives_korean:
  - 나병
  - 문둥병
  - 피부의 질환
  lexicon: HALOT
  rationale: 이 용어는 현대 의학적 나병보다 더 넓은 제의적-현상적 범주이므로, 오해를 피하면서도 본문의 병적 성격을 드러내는 ‘피부병’이 적절합니다.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  english_pob_choice: it shall be shown to the priest
  chosen_korean: 제사장에게 보여야 합니다
  alternatives_korean:
  - 제사장에게 보여져야 합니다
  - 제사장에게 보여야 할 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동형은 행위자를 드러내지 않으므로, 한국어에서도 수동을 살리되 자연스러운 규범 문장으로 옮겼습니다.
theological_decisions:
- issue: צָרַעַת의 번역 범주 유지
  chosen_reading: ‘피부병’으로 옮겨 현대 의학의 나병과 구별합니다.
  alternative_readings:
  - 나병
  - 문둥병
  rationale: 본문은 사람 피부뿐 아니라 옷과 가죽에도 적용되는 제의적 진단 범주이므로, 전통적 번역어가 주는 협소한 임상 이미지를 피하는 것이 소스 의미에 더 충실합니다.
  doctrine_reference: 레위기 13장의 제의법 문맥과 원어 우선 번역 원칙
