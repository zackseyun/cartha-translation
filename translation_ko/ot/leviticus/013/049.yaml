  rationale: 직조 용어의 기술적 구분을 유지해야 하므로, 한국어 섬유 용어로 통용되는 ‘날실/씨실’이 가장 정확합니다.
- source_word: צָרַעַת
  english_pob_choice: skin disease
  chosen_korean: 피부병
