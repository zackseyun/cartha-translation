id: LEV.13.42
reference: Leviticus 13:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
  footnotes:
  - marker: a
    text: Or traditionally, 'leprosy.' The Hebrew term refers more broadly to a range of skin diseases or conditions and should not be equated strictly with modern Hansen's disease.
    reason: lexical_alternative
  - marker: b
    text: The two Hebrew terms distinguish baldness at the back of the head and baldness at the front of the head.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 머리의 대머리 부위나 이마의 대머리 부위에 흰빛이 도는 붉은 피부병 징후가 있으면, 그것은 그의 머리의 대머리 부위나 그의 이마의 대머리 부위에 번져 나가는 피부병입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 '나병'으로도 옮기지만, 히브리어 용어는 현대의 한센병과 동일시할 수 없는 더 넓은 피부 질환 또는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 두 히브리어 용어는 각각 머리 뒤쪽의 대머리와 머리 앞쪽의 대머리를 구별합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고 만약
  - 또 만일
  lexicon: HALOT
  rationale: 앞 절과 대비되는 사례 규정의 흐름을 살려 조건문을 자연스럽게 이었습니다.
- source_word: בַקָּרַחַת / בַגַּבַּחַת
  english_pob_choice: on the bald head / on the bald forehead
  chosen_korean: 머리의 대머리 부위 / 이마의 대머리 부위
  alternatives_korean:
  - 뒤통수의 대머리 부분 / 앞머리의 대머리 부분
  - 대머리인 머리 뒤쪽 / 대머리인 머리 앞쪽
  lexicon: HALOT
  rationale: 두 히브리어 용어의 앞/뒤 구분을 유지하되, 한국어에서는 '대머리 부위'로 풀어 자연스럽게 표현했습니다.
- source_word: נֶגַע לָבָן אֲדַמְדָּם
  english_pob_choice: white-reddish diseased spot
  chosen_korean: 흰빛이 도는 붉은 피부병 징후
  alternatives_korean:
  - 흰빛을 띤 붉은 피부병 자국
  - 흰붉은 병변
  lexicon: HALOT
  rationale: נֶגַע는 단순한 점이나 표식보다 검사 대상인 눈에 보이는 피부 이상을 가리키므로, 지나치게 현대 의학 용어를 쓰지 않으면서도 '징후'로 풀었습니다.
- source_word: צָרַעַת פֹּרַחַת
  english_pob_choice: a spreading skin disease
  chosen_korean: 번져 나가는 피부병
  alternatives_korean:
  - 퍼져 가는 피부병
  - 번져 가는 피부 질환
  lexicon: HALOT
  rationale: צָרַעַת을 전통적 '나병'으로 고정하지 않고, 문맥상 더 넓은 피부 질환을 가리키는 표현으로 옮겼으며 פֹּרַחַת의 진행성을 '번져 나가는'으로 살렸습니다.
theological_decisions:
- issue: צָרַעַת의 번역이 전통적 '나병'과 충돌하는 문제
  chosen_reading: '''피부병''으로 옮겨 현대 Hansen병과의 동일시를 피했습니다.'
  alternative_readings:
  - '''나병'''
  - '''문둥병'''
  rationale: 레위기 13장의 규정은 의학적 현대 분류보다 의례적/관찰적 범주에 가깝기 때문에, 독자가 특정 병명으로 오해하지 않도록 했습니다.
  doctrine_reference: 성경 용어의 역사적-의례적 범주와 현대 의학 범주의 구별
