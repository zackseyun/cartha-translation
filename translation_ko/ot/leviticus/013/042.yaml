  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
  footnotes:
  - marker: a
    text: Or traditionally, 'leprosy.' The Hebrew term refers more broadly to a range of skin diseases or conditions and should not be equated strictly with modern Hansen's disease.
    reason: lexical_alternative
  - marker: b
    text: The two Hebrew terms distinguish baldness at the back of the head and baldness at the front of the head.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 뒤통수나 이마 쪽의 대머리 부위[b]에 희고 붉은 반점이 있으면, 이는 그의 뒤통수나 이마 쪽의 대머리 부위에 퍼져 나가는 피부 질환[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 '나병'으로도 옮기지만, 히브리어 용어는 현대의 한센병과 동일시할 수 없는 더 넓은 피부 질환 또는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 두 히브리어 용어는 각각 머리 뒤쪽의 대머리와 머리 앞쪽의 대머리를 구별합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고 만약
  - 또 만일
  lexicon: HALOT
  rationale: 앞 절과 대비되는 사례 규정의 흐름을 살려 조건문을 자연스럽게 이었습니다.
- source_word: בַקָּרַחַת / בַגַּבַּחַת
  english_pob_choice: on the bald head / on the bald forehead
  chosen_korean: 머리의 대머리 부위 / 이마의 대머리 부위
  alternatives_korean:
