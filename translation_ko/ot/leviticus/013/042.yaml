  lexicon: HALOT
  rationale: 두 히브리어 용어의 앞/뒤 구분을 유지하되, 한국어에서는 '대머리 부위'로 풀어 자연스럽게 표현했습니다.
- source_word: נֶגַע לָבָן אֲדַמְדָּם
  english_pob_choice: white-reddish diseased spot
  chosen_korean: 흰빛이 도는 붉은 피부병 징후
  alternatives_korean:
  - 흰빛을 띤 붉은 피부병 자국
  - 흰붉은 병변
  lexicon: HALOT
  rationale: נֶגַע는 단순한 점이나 표식보다 검사 대상인 눈에 보이는 피부 이상을 가리키므로, 지나치게 현대 의학 용어를 쓰지 않으면서도 '징후'로 풀었습니다.
- source_word: צָרַעַת פֹּרַחַת
  english_pob_choice: a spreading skin disease
  chosen_korean: 번져 나가는 피부병
  alternatives_korean:
  - 퍼져 가는 피부병
  - 번져 가는 피부 질환
  lexicon: HALOT
  rationale: צָרַעַת을 전통적 '나병'으로 고정하지 않고, 문맥상 더 넓은 피부 질환을 가리키는 표현으로 옮겼으며 פֹּרַחַת의 진행성을 '번져 나가는'으로 살렸습니다.
theological_decisions:
- issue: צָרַעַת의 번역이 전통적 '나병'과 충돌하는 문제
  chosen_reading: '''피부병''으로 옮겨 현대 Hansen병과의 동일시를 피했습니다.'
  alternative_readings:
  - '''나병'''
  - '''문둥병'''
  rationale: 레위기 13장의 규정은 의학적 현대 분류보다 의례적/관찰적 범주에 가깝기 때문에, 독자가 특정 병명으로 오해하지 않도록 했습니다.
  doctrine_reference: 성경 용어의 역사적-의례적 범주와 현대 의학 범주의 구별
