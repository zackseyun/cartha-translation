  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
  footnotes:
  - marker: a
    text: Or 'made in a deep pan or on a flat pan.' The two Hebrew vessel terms likely refer to different kinds of cooking implements.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 곡식제물[a], 곧 가마에서 구운 것과 팬이나 철판 위에서 만든 모든 것은, 그것을 드리는 제사장에게 속합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊은 팬이나 평평한 팬에 만든 것’으로 볼 수 있습니다. 두 히브리어 용어는 서로 다른 조리도구를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식 헌물
  - 곡식 제물
  lexicon: HALOT
  rationale: 제사 문맥의 מִנְחָה는 일반적 ‘예물’보다 특정한 곡물 제사를 가리키므로, 전통 교회어보다 의미를 더 직접적으로 드러내는 ‘곡식제물’로 옮겼습니다.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  english_pob_choice: is baked in the oven
  chosen_korean: 가마에서 구운 것
  alternatives_korean:
  - 오븐에서 구운 것
  - 가마에 구운 것
  lexicon: HALOT
  rationale: 능동적으로 ‘구운 것’이라 풀어 자연스럽게 만들되, כלי(용기)인 תַּנּוּר는 현대적 조리기구를 뜻하는 ‘가마’로 옮겨 본문의 조리 방식을 살렸습니다.
- source_word: מַרְחֶשֶׁת / מַחֲבַת
  english_pob_choice: pan or on a griddle
  chosen_korean: 팬이나 철판
  alternatives_korean:
  - 깊은 팬이나 평평한 팬
  - 팬이나 그리들
  lexicon: HALOT
  rationale: 두 조리도구의 구분을 살리기 위해 하나는 ‘팬’, 다른 하나는 더 평평한 조리면을 암시하는 ‘철판’으로 구분했습니다.
- source_word: לַכֹּהֵן הַמַּקְרִיב אֹתָהּ לוֹ תִהְיֶה
  english_pob_choice: shall belong to the priest who presents it
  chosen_korean: 그것을 드리는 제사장에게 속합니다
  alternatives_korean:
  - 그것을 드리는 제사장의 것이 됩니다
  - 그것을 바치는 제사장에게 돌아갑니다
  lexicon: HALOT
  rationale: 법적 귀속을 나타내는 구조이므로, 현대 한국어에서 가장 분명한 ‘속합니다’로 표현해 소유·배분의 의미를 살렸습니다.
theological_decisions:
- issue: 제물 배분의 귀속 표현
  chosen_reading: 해당 곡식제물은 제사장에게 ‘속합니다’라고 번역해 제의적 권리 배분을 분명히 했습니다.
  alternative_readings:
  - 제사장에게 ‘돌아갑니다’
  - 제사장의 몫입니다
  rationale: 히브리어의 소속·귀속 의미를 약화하지 않으면서도, 제사 규례의 법적 배분을 현대 독자가 바로 이해하도록 했습니다.
  doctrine_reference: 제사 규례의 법적 귀속 표현
