  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
  footnotes:
  - marker: a
    text: Or 'tainted meat' / 'foul thing.' The Hebrew term is a technical sacrificial word for an offering rendered unacceptable and loathsome.
    reason: lexical_alternative
  - marker: b
    text: '''Peace offering'' may also be rendered ''fellowship offering'' or ''offering of well-being.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그 화목제물의 고기 일부를 셋째 날에 먹으면, 그것은 받아들여지지 않을 것입니다. 그것을 드리는 사람에게도 그것은 계산되지 않을 것이며, 그것은 부정한 제물이 될 것입니다[a]. 그것을 먹는 사람은 그의 죄책을 져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 פִּגּוּל은 제의적으로 받아들여질 수 없게 된 제물을 가리키는 기술 용어입니다.
    reason: source_note
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞절에 대한 조건적 대비를 살려 ‘그러나’를 넣었고, משפט문 맥락에 맞게 ‘만일’로 조건을 분명히 했습니다.
- source_word: זֶבַח שְׁלָמָיו
  english_pob_choice: his peace offering
  chosen_korean: 그 화목제물
  alternatives_korean:
  - 그 평화제물
  - 그 교제제물
  lexicon: HALOT
  rationale: שלמים의 제의적 명칭을 한국어 성경 전통에서 통용되는 ‘화목제물’로 옮기되, ‘peace offering’의 범주를 유지했습니다.
- source_word: פִּגּוּל
  english_pob_choice: an abhorrent thing / an offensive thing
  chosen_korean: 부정한 제물
  alternatives_korean:
  - 혐오스러운 것
  - 오염된 제물
  - 가증한 것
  lexicon: HALOT
  rationale: פִּגּוּל은 제의적으로 받아들여질 수 없게 된 제물을 가리키는 기술 용어이므로, 의미를 풀어 ‘부정한 제물’로 처리해 독자가 제의적 무효 상태를 이해하도록 했습니다.
- source_word: עֲוֺנָהּ תִּשָּׂא
  english_pob_choice: will bear his guilt
  chosen_korean: 그의 죄책을 져야 합니다
  alternatives_korean:
  - 그의 죄를 져야 합니다
  - 그의 불법을 짊어져야 합니다
  lexicon: HALOT
  rationale: ‘짐을 지다/짊어지다’의 형벌 책임 관용구를 살리면서, עוון의 책임성을 드러내기 위해 ‘죄책’을 사용했습니다.
theological_decisions:
- issue: 제의적 부적합 상태를 나타내는 פִּגּוּל의 처리
  chosen_reading: 부정한 제물
  alternative_readings:
  - 혐오스러운 것
  - 오염된 제물
  - 가증한 것
  rationale: 본문은 단순한 감정적 혐오가 아니라, 셋째 날 섭취로 인해 제물의 수용성이 상실되는 제의적 무효 상태를 말하므로, 독자가 기능적 의미를 즉시 파악하도록 풀어 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
