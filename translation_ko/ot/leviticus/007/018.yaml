  naturalness: ‘그 화목제물의 고기 일부’보다 ‘그의 화목제물의 고기 중 일부’가 소유 관계와 부분성을 더 자연스럽고 분명하게 나타냅니다. ‘그에게는 인정되지 않을 것입니다’와 ‘자기 죄책을 져야 합니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘화목제물’은 זֶבַח שְׁלָמָיו에 대한 한국어 성경 전통 및 제의 범주에 잘 맞습니다. פִּגּוּל은 본문에서 ‘혐오스러운 것’으로 옮기고, 각주에서 제의적으로 받아들여질 수 없게 된 전문 용례임을 밝혀야 합니다.
