  to: 그러나 만일 그의 화목제물의 고기 중 일부를 셋째 날에 먹으면, 그 제물은 받아들여지지 않을 것입니다. 그것을 드리는 사람에게는 인정되지 않을 것이며, 그것은 혐오스러운 것이 될 것입니다[a]. 그것을 먹는 사람은 자기 죄책을 져야 합니다.
