lexical_decisions:
- source_word: עַל
  english_pob_choice: along with
  chosen_korean: '...과 함께'
  alternatives_korean:
  - '...와 함께'
  - 곁들여
  lexicon: HALOT
  rationale: 여기서 עַל은 위치가 아니라 동반·부가 관계를 나타내므로, 제물에 ‘함께’ 드린다는 뜻을 살리는 표현이 가장 자연스럽습니다.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  english_pob_choice: cakes of leavened bread
  chosen_korean: 누룩 넣은 빵
  alternatives_korean:
  - 누룩 든 빵
  - 누룩 넣은 빵덩이
  - 발효된 빵
  lexicon: HALOT
  rationale: 제의 맥락에서 חַלּוֹת לֶחֶם은 ‘빵/떡’의 덩이를 가리키며, חָמֵץ는 ‘누룩 든’이라는 제의적 대비를 살립니다.
- source_word: יַקְרִיב קָרְבָּנוֹ
  english_pob_choice: he shall present his offering
  chosen_korean: 자기의 예물을 드려야 합니다
  alternatives_korean:
  - 자기의 제물을 드려야 합니다
  - 자기의 예물을 바쳐야 합니다
  - 자기의 예물을 가져와야 합니다
  lexicon: HALOT
  rationale: קרב의 제의적 용례는 단순한 ‘가져오다’보다 하나님 앞에 ‘드리다/제시하다’가 더 정확하며, קָרְבָּן은 ‘예물’이 한국어에서 가장 직접적이고 자연스럽습니다.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  english_pob_choice: the sacrifice of his peace offerings of thanksgiving
  chosen_korean: 자기의 화목 제사의 감사 제물
  alternatives_korean:
  - 자기의 화목 제사의 감사 제사
  - 감사 화목 제물
  - 감사 제사의 화목 제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 전통적 ‘화목 제사’가 한국어에서 가장 안정된 제의 용어이며, תּוֹדָה는 여기서 그 제사의 성격을 ‘감사’로 한정합니다.
theological_decisions:
- issue: שְׁלָמִים의 한국어 제의 용어 선택
  chosen_reading: 화목 제사
  alternative_readings:
  - 화평 제사
  - 친교 제사
  - 평안 제사
  rationale: 이 제사는 평화·전인적 온전함·공동 식사의 의미를 지니지만, 한국어 성경 전통에서 ‘화목 제사’가 가장 널리 인식되는 기술 용어입니다. 본 절은 제의 분류를 명확히 하는 것이 중요하므로 이 용어를 유지했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
