review_pass:
  verdict: revise
  source_fidelity: 본문의 제물 용어와 도살 절차는 히브리어에 충실합니다. 다만 עַל הַמִּזְבֵּחַ סָבִיב는 피를 제단의 둘레 전반에 적용하는 행위이므로, ‘제단 주위에’는 제단 바깥 공간에 뿌리는 뜻으로도 읽힐 수 있습니다. ‘제단 사방에’가 제단을 대상으로 한 둘레 적용을 더 정확히 나타냅니다.
  naturalness: 합쇼체 문장과 제의 절차 문체는 자연스럽습니다. ‘제단 사방에 뿌려야 합니다’는 현대 한국어에서 간결하면서도 해당 제의 행위를 자연스럽게 전달합니다.
  terminology: ‘번제’와 ‘속건제’는 확립된 한국어 성서·학술 제의 용어로 적절합니다. 그러나 각주의 ‘속죄의 제물’은 일반적으로 חַטָּאת(속죄제)와 연관되는 별도 제의 범주를 암시할 수 있으므로 אָשָׁם의 안전한 어휘 대안이 아닙니다. 배상·보상의 대안으로 한정해야 합니다.
  issues:
  - severity: medium
    issue: ‘제단 주위에’의 적용 대상이 모호함
    rationale: 히브리어 עַל הַמִּזְבֵּחַ는 피의 적용 대상이 제단임을 나타내며, סָבִיב는 그 둘레 전반을 뜻합니다. ‘주위에’는 제단 주변의 지면이나 공간에 뿌린다는 의미로 오해될 수 있습니다.
  - severity: medium
    issue: 각주의 ‘속죄의 제물’이 אָשָׁם의 대안으로 부정확함
    rationale: אָשָׁם은 이 문맥에서 속건제/배상제를 가리키며, ‘속죄제’ 계열 표현은 חַטָּאת와의 범주 혼동을 일으킬 수 있습니다. 영어 감사 기록의 ‘reparation offering’ 및 ‘compensation offering’에 대응하는 대안으로 정정하는 것이 안전합니다.
  revised_text: 번제를 잡는 곳에서 속건제를 잡을 것이며, 그 피를 제단 사방에 뿌려야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘배상 제물’, ‘보상 제물’로도 옮길 수 있습니다. 히브리어는 죄책과 배상의 의미를 함께 강조합니다.
    reason: lexical_alternative
  revision_rationale: 제단 자체의 둘레에 피를 뿌리는 제의 행위를 분명히 하기 위해 ‘제단 주위에’를 ‘제단 사방에’로 고쳤습니다. 또한 אָשָׁם을 별도 제의 범주인 속죄제와 혼동시키지 않도록 각주의 대안을 배상·보상 의미로 제한했습니다. 그 밖의 문장 구조, 속건제라는 핵심 용어, 그리고 원문의 단수 동사를 한국어에서 무표지로 처리한 방식은 유지했습니다.
