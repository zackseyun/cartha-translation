id: LEV.7.2
reference: Leviticus 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
  footnotes:
  - marker: a
    text: Or 'reparation offering' or 'compensation offering.' The Hebrew term emphasizes both guilt and the making of restitution.
    reason: lexical_alternative
translation:
  language: ko
  text: 번제[a]를 잡는 곳에서 속건제를 잡을 것이며, 그 피를 제단 주위에 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄의 제물’, ‘배상 제물’로도 옮길 수 있습니다. 히브리어는 유책함과 배상의 의미를 함께 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  english_pob_choice: In the place where
  chosen_korean: …을 잡는 곳에서
  alternatives_korean:
  - 그곳에서
  - …하는 곳에서
  lexicon: HALOT
  rationale: מָקוֹם과 관계절은 절차상 특정한 장소를 가리키므로, 한국어에서는 자연스럽게 ‘…하는 곳에서’로 옮겨 위치 지정과 절차성을 함께 살렸습니다.
- source_word: יִשְׁחֲטוּ / יִשְׁחֲטוּ
  english_pob_choice: they slaughter
  chosen_korean: 잡을 것이며
  alternatives_korean:
  - 도살할 것이며
  - 죽일 것이며
  lexicon: HALOT
  rationale: 제의 문맥에서 שָׁחַט는 단순 살해가 아니라 희생제물의 도살을 뜻하므로, 현대 한국어에서 제의적 낱말을 과도하게 드러내지 않으면서도 자연스러운 ‘잡다’로 처리했습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태움 제사
  - 번제물
  lexicon: HALOT
  rationale: עֹלָה의 통용되는 제의 용어는 ‘번제’이므로, 한국어 성서 전통과 학술적 정확성을 함께 만족하는 기본어를 유지했습니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제
  - 배상제
  lexicon: HALOT
  rationale: 영어 본문은 ‘guilt offering’을 택했지만, 히브리어 אָשָׁם의 제의적 범주는 한국어 성서 용례에서 ‘속건제’가 가장 직접적으로 대응하므로 이를 사용했습니다. 다만 이 말이 ‘유책함’과 ‘배상’의 뉘앙스를 함께 품는다는 점은 본 절의 번역어 선택만으로는 완전히 드러나지 않습니다.
- source_word: וְאֶת דָּמ֛וֹ יִזְרֹק
  english_pob_choice: and he shall splash its blood
  chosen_korean: 그 피를 … 뿌려야 합니다
  alternatives_korean:
  - 그 피를 … 뿌릴 것이며
  - 그 피를 … 뿌려야 하며
  lexicon: HALOT
  rationale: זָרַק은 제의 문맥에서 제단에 피를 적용하는 동작이므로, 한국어로는 ‘뿌리다’가 가장 간결하고 표준적입니다. 주어는 문맥상 제사장을 가리키므로 한국어에서는 명시하지 않았습니다.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  english_pob_choice: against the altar all around
  chosen_korean: 제단 주위에
  alternatives_korean:
  - 제단 둘레에
  - 제단 사방에
  lexicon: HALOT
  rationale: סָבִיב는 제단을 둘러싼 범위를 뜻하므로, 한국어에서는 ‘주위에’로 자연스럽게 옮겨 둘레 전체를 포괄하게 했습니다.
theological_decisions:
- issue: 속건제의 번역어가 지닌 죄책/배상 뉘앙스
  chosen_reading: 본문에는 ‘속건제’를 쓰고, 뉘앙스는 각주로 ‘유책함과 배상’의 범주를 유지합니다.
  alternative_readings:
  - 배상제
  - 보상제
  rationale: 이 구절은 제의 절차를 지시할 뿐이므로, 통용되는 제의 명칭을 유지하되 אָשָׁם의 의미 범위를 각주로 보존하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §5 (key term consistency with documented nuance)
- issue: 제사장 행위의 주어 생략
  chosen_reading: 한국어 본문에서는 주어를 드러내지 않고 수동적 절차 문장처럼 처리했습니다.
  alternative_readings:
  - 그가 그 피를 제단 주위에 뿌려야 합니다
  - 제사장이 그 피를 제단 주위에 뿌려야 합니다
  rationale: 히브리어는 연속된 제의 명령에서 행위자를 반복하지 않으므로, 한국어도 이를 절차 문장으로 살려 간결하게 유지하는 것이 원문 구조를 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §2 (source structure preservation)
