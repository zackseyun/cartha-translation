  lexicon: HALOT
  rationale: 수동 분사와 전치사구가 제물의 준비 상태를 설명하므로, ‘기름에 섞은’으로 간결하게 옮겨 기름이 첨가된 상태를 드러냈습니다.
- source_word: חֲרֵבָה
  english_pob_choice: dry
  chosen_korean: 마른
