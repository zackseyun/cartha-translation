  lexicon: HALOT
  rationale: 기름에 섞인 소제와 대비되는 상태를 나타내므로, 해석을 덧붙이지 않고 단순한 형용사 ‘마른’으로 대조를 보존했습니다.
- source_word: אִישׁ כְּאָחִיו
  english_pob_choice: each alike with his brother
  chosen_korean: 곧 그의 형제와 같이 각 사람에게 돌아가야 합니다
  alternatives_korean:
  - 각 사람마다 그의 형제와 같이
  - 형제와 같이 각각 균등하게
  - 형제와 똑같이
  lexicon: HALOT
  rationale: 히브리어 관용구는 아론의 아들들 사이의 균등 분배를 뜻하므로, ‘각 사람’과 ‘형제와 같이’를 함께 살려 분배의 평등성을 한국어로 분명히 했습니다.
