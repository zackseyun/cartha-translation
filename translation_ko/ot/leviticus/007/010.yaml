translation:
  language: ko
  text: 기름에 섞인 소제나 마른 소제는 모두 아론의 모든 아들에게 돌아가며, 각 사람이 자기 형제와 똑같이 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 아론의 아들들 각자가 서로 똑같이 몫을 받는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식제물
  - 곡식 예물
  - 곡식 제사
  lexicon: HALOT
