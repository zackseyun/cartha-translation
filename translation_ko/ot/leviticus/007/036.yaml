base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
  footnotes:
  - marker: a
    text: Or 'from the Israelites.' The Hebrew reads literally 'from the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 그들에게 기름을 부으신 날에, 이스라엘 자손에게서 그들에게 주어지도록 명령하신 것으로, 그들의 대대에 걸친 영원한 규례입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 백성에게서’. 히브리어는 문자적으로 ‘이스라엘의 아들들에게서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영구한 규례’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본문의 여호와 이름을 인격적 고유명으로 드러내기 위해 야훼를 사용했습니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하신
  alternatives_korean:
  - 지시하신
  - 분부하신
  lexicon: HALOT
  rationale: 제사 규례를 다루는 법문맥이므로 단순한 요청보다 권위 있는 명령을 살려 옮겼습니다.
- source_word: מָשְׁחוֹ אֹתָם
  english_pob_choice: he anointed them
  chosen_korean: 그들을 기름 부으신
  alternatives_korean:
  - 그들을 부으신
  - 그들을 성별하신
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘기름 부으다’이므로, 문맥적 기능을 설명하는 ‘성별하다’보다 원형 동작을 보존했습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: an everlasting statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영속적인 규례
  - 대대로 지킬 규례
  lexicon: HALOT
  rationale: 법적·예전적 조항을 가리키는 חֻקָּה를 ‘규례’로, עוֹלָם의 지속성을 ‘영원한’으로 살렸습니다.
theological_decisions:
- issue: ‘대대로’에 해당하는 종결적 법적 지속성
  chosen_reading: 대대로 지킬 영원한 규례입니다
  alternative_readings:
  - 영원한 규례입니다
  - 세세대대로의 규례입니다
  rationale: לְדֹרֹתָם은 단순한 반복이 아니라 다음 세대까지 이어질 규범성을 뜻하므로, 한국어에서도 지속 적용을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
