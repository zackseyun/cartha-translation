revisions:
- from: 야훼께서 그것을 이스라엘 자손에게서 그들에게 주라고 명령하신 것 — 곧 그들을 기름 부으신 날에, 대대로 지킬 영원한 규례입니다.[a]
  to: 이는 야훼께서 그들에게 기름을 부으신 날에, 이스라엘 자손에게서 그들에게 주어지도록 명령하신 것으로, 그들의 대대에 걸친 영원한 규례입니다.[a][b]
  rationale: 시간 부사구를 ‘명령하신’에 직접 연결하고, ‘그들에게 주어지도록’이라는 수동 구성으로 제사장들에게 주어질 몫과 이스라엘 자손이라는 제공처의 관계를 한국어답게 유지했습니다. ‘정하신’이나 ‘지킬’처럼 원문에 명시되지 않은 동사는 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:45Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존했으나, ‘그들을 기름 부으신 날에’가 문장 끝에 분리되어 히브리어의 시간 수식 관계가 불명확합니다. 또한 מֵאֵת(‘~에게서’)에 대한 각주 대안도 ‘이스라엘 사람들에게서’로 고쳐야 합니다.
  naturalness: 원문 초안의 긴 대시 뒤 구절은 한국어 문장 구조상 다소 어색하고, ‘이스라엘 자손에게서 그들에게’의 연속은 읽기 어렵습니다. 수동 구성을 써서 받는 이들과 제공처의 관계를 자연스럽게 드러낼 수 있습니다.
  terminology: ‘야훼’, ‘기름을 부으신’, ‘규례’는 적절합니다. עוֹלָם의 대안인 ‘영구한’을 각주로 제시하여 영어 POB 감사 기록의 선택지를 반영합니다.
