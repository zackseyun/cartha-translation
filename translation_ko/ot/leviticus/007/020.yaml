review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibited eating of meat from Yahweh's peace offering while impure and retains the deliberately unspecified penalty formula. However, '그 위에 있을 때에' is a too-literal and potentially unclear rendering of the idiom 'his uncleanness is upon him.'
  naturalness: The sentence is understandable, but '그 사람의 부정함이 그 위에 있을 때에' is unnatural in modern Korean and can momentarily make '위' seem to refer to the meat. A conditional legal formulation is clearer and maintains the source sense.
  terminology: '''화목 제사'' is acceptable, but ''화목 제물'' more directly identifies the sacrificial offering whose meat is eaten. ''끊어지다'' appropriately preserves the Hebrew legal formula without deciding whether it means exclusion or death.'
  issues:
  - severity: medium
    issue: '''그 사람의 부정함이 그 위에 있을 때에'' is ambiguous and unnatural.'
    rationale: The Hebrew means that the eater remains in a state of ritual impurity. In Korean, '그 위에' may be read as referring to the meat rather than to the person. '그 사람에게 부정함이 있는 채로' clearly retains the legal condition.
  - severity: low
    issue: No footnote accompanies '끊어질 것입니다.'
    rationale: The penalty formula does not specify its precise implementation. A note should preserve the source's ambiguity, as documented in the English audit trail.
  revised_text: 그러나 어떤 사람이 야훼께 속한 화목 제물의 고기를 먹는데 그 사람에게 부정함이 있는 채로 먹으면, 그 사람은 자기 백성에게서 끊어질 것입니다.[a]
