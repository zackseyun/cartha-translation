  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
  footnotes:
  - marker: a
    text: Or 'shall be excluded from his people'; the phrase 'shall be cut off' may refer to expulsion or to death, but the Hebrew does not specify the exact means here.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 어떤 사람이 야훼께 속한 화목 제물의 고기를 먹는데 그 사람에게 부정함이 있는 채로 먹으면, 그 사람은 자기 백성에게서 끊어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 백성에게서 제외될 것입니다.” “끊어지다”라는 말은 추방이나 죽음을 가리킬 수 있으나, 히브리어 본문은 여기서 그 정확한 방식을 밝히지 않습니다.
    reason: The Hebrew penalty formula וְנִכְרְתָה ... מֵעַמֶּיהָ is intentionally retained in the main text; the note records plausible interpretations without selecting one.
