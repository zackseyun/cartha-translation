id: LEV.7.21
reference: Leviticus 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
  footnotes:
  - marker: a
    text: Or 'from among his people.' The Hebrew has 'from her people' because 'person' (nephesh) is grammatically feminine, not because the law applies only to a woman.
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off'' is a covenant-sanction formula. It may imply exclusion or divine judgment; the Hebrew does not specify the exact mode here.'
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 사람이 인간의 부정함[a], 곧 부정한 동물이나 어떤 부정하고 혐오스러운 것에 닿고, 야훼께 드리는 화목제의 고기를 먹으면, 그 사람은 자기 백성 가운데서 끊어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자기 백성 가운데서.' 히브리어는 '그녀의 백성'이라고 되어 있는데, 이는 사람이 여성이라는 뜻이 아니라 נֶפֶשׁ가 문법적으로 여성형이기 때문입니다.
    reason: lexical_alternative
  - marker: b
    text: '''끊어질 것입니다''는 언약 제재 공식입니다. 이 말이 여기서 출교, 죽음, 또는 하나님의 심판을 뜻하는지는 본문이 구체적으로 밝히지 않습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: person
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 그 사람
  - 어떤 영혼
  - 어떤 생명
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ는 '영혼'보다 개별 인격을 가리키므로, 한국어에서는 자연스럽고 법조항에 맞는 '어떤 사람'으로 옮겼습니다.
- source_word: תִגַּע
  english_pob_choice: touches
  chosen_korean: 닿고
  alternatives_korean:
  - 만지고
  - 접촉하고
  lexicon: HALOT
  rationale: 의례적 부정 접촉의 범위를 살리면서도 문장을 매끄럽게 하도록 '닿고'로 옮겼습니다.
- source_word: טֻמְאַת אָדָם
  english_pob_choice: human uncleanness
  chosen_korean: 인간의 부정함
  alternatives_korean:
  - 사람의 부정함
  - 인간의 더러움
  lexicon: HALOT
  rationale: אָדָם을 일반적 인간으로 이해해 '인간의'로 처리했고, טֻמְאָה의 의례적 범주를 '부정함'으로 유지했습니다.
- source_word: שֶׁקֶץ טָמֵא
  english_pob_choice: any unclean detestable thing
  chosen_korean: 부정하고 혐오스러운 것
  alternatives_korean:
  - 부정하고 가증한 것
  - 부정한 역겨운 것
  lexicon: HALOT
  rationale: שֶׁקֶץ의 혐오감과 의례적 금기를 함께 살리기 위해 '혐오스러운 것'을 택했습니다.
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 화목제물
  - 평화제
  - 교제제
  lexicon: HALOT
  rationale: 표준 성경용례를 따르되, 제의적 명칭을 간결하게 살리기 위해 '화목제'로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: that belongs to Yahweh
  chosen_korean: 야훼께 드리는
  alternatives_korean:
  - 야훼의
  - 야훼께 속한
  lexicon: HALOT
  rationale: 소유관계를 단순히 '의 것'으로 풀기보다 제물의 봉헌 관계를 드러내기 위해 '야훼께 드리는'으로 옮겼습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 끊어지게 될 것입니다
  - 제거될 것입니다
  - 끊겨질 것입니다
  lexicon: HALOT
  rationale: 언약 제재 공식의 강도를 살리면서도 한국어로는 직접적인 'cut off'의 관용적 대응인 '끊어지다'를 택했습니다.
theological_decisions:
- issue: מֵעַמֶּיהָ의 성별 불일치 처리
  chosen_reading: 자연스러운 일반 남성 지시 없이 '자기 백성 가운데서'로 옮겼습니다.
  alternative_readings:
  - 그의 백성 가운데서
  - 그녀의 백성 가운데서
  - 백성 중에서
  rationale: 히브리어의 여성형 접미사는 נֶפֶשׁ와의 일치 때문이므로, 한국어에서는 성별을 암시하지 않는 집합적 표현으로 처리하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 문법적 성별과 실제 성별을 구분하여 번역해야 합니다.
- issue: וְנִכְרְתָה의 제재 의미
  chosen_reading: '''끊어질 것입니다''로 두고 구체적 집행 방식은 밝히지 않았습니다.'
  alternative_readings:
  - 출교될 것입니다
  - 죽임을 당할 것입니다
  - 제거될 것입니다
  rationale: 본문은 제재의 형식을 말할 뿐 집행 방식은 특정하지 않으므로, 해석을 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 본문이 열어 둔 언약 제재의 모호성을 유지합니다.
