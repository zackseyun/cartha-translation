    issue: '''태우고'' does not fully convey the sacrificial-technical sense of וְהִקְטִיר.'
    rationale: In Levitical ritual usage, the verb denotes burning the offering on the altar so that it goes up in smoke, not merely setting it on fire.
  - severity: low
    issue: '''가슴'' is somewhat underspecified as a sacrificial animal portion.'
    rationale: '''가슴 부위'' is more idiomatic and precise in Korean ritual-law context while preserving the source meaning.'
  revised_text: 제사장은 제단 위에서 기름을 불살라 바치고, 가슴 부위는 아론과 그의 아들들에게 속할 것입니다.
