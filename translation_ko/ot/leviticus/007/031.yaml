  source_fidelity: The draft correctly identifies the priest, the fat, the altar, and the allocation of the breast to Aaron and his sons. However, '태우고' underrepresents the technical sacrificial force of הִקְטִיר ('offer up in smoke' / 'burn as an altar offering'), and '가슴' by itself is less precise for the designated animal portion.
  naturalness: The proposed revision uses natural modern Korean while maintaining a formal-polite legal/scriptural register. '가슴 부위' avoids an overly abrupt or anatomical-sounding bare '가슴.'
  terminology: '''기름을 불살라 바치다'' appropriately conveys the altar-burning of sacrificial fat. ''가슴 부위'' consistently denotes the priestly breast portion without importing a doctrinal interpretation.'
  issues:
