id: LEV.7.26
reference: Leviticus 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
  footnotes:
  - marker: a
    text: Or, more literally, 'in all your dwellings' or 'throughout all your settlements.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''for bird and for animal''; the sense is blood belonging to or coming from birds and animals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희가 사는 모든 곳에서 어떤 피도 먹어서는 안 됩니다. 새의 피든 짐승의 피든 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “너희의 모든 거처에서” 또는 “너희의 모든 정착지에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자 그대로 “새와 짐승을 위해”라고 되어 있으나, 문맥상 새와 짐승에 속한 피를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And ... any
  chosen_korean: 어떤 ...도
  alternatives_korean:
  - 모든 ...
  - 아무 ...
  lexicon: HALOT
  rationale: 부정문에서 כָּל의 분포적 의미를 살려 “어떤 …도”로 옮기면 금지의 범위를 자연스럽게 드러낼 수 있습니다.
- source_word: לֹא תֹאכְלוּ
  english_pob_choice: you shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 말아야 합니다
  - 먹지 마십시오
  lexicon: HALOT
  rationale: 법문체의 금지를 현대 표준어 합쇼체로 풀어, 명령의 규범성을 유지하면서도 직설적 표현을 피했습니다.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵיכֶם
  english_pob_choice: in any of your dwellings
  chosen_korean: 너희가 사는 모든 곳에서
  alternatives_korean:
  - 너희의 모든 거처에서
  - 너희의 모든 정착지에서
  lexicon: HALOT
  rationale: מוֹשָׁב의 법적 범위를 오늘말로 풀어 “사는 모든 곳”이라 하면, 거주지 전반을 포괄하는 금지의 적용 범위가 분명해집니다.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  english_pob_choice: whether from bird or from animal
  chosen_korean: 새의 것이든 짐승의 것이든
  alternatives_korean:
  - 새에게서 나온 것이든 짐승에게서 나온 것이든
  - 새든 짐승이든
  lexicon: HALOT
  rationale: 히브리어의 범주 열거를 한국어의 병렬 구조로 살려, 피의 출처를 분명히 하되 자연스러운 문장으로 만들었습니다.
theological_decisions:
- issue: 출처 범주를 어떻게 드러낼지
  chosen_reading: “새의 것이든 짐승의 것이든”으로, 피가 어떤 생물 범주에 속하는지 분명히 했습니다.
  alternative_readings:
  - “새로부터든 짐승으로부터든”처럼 출처를 더 노골적으로 드러낼 수 있습니다.
  - “새든 짐승이든”처럼 단순 범주만 남길 수도 있습니다.
  rationale: 본문은 피의 금지를 모든 거주지에 적용하면서, 새와 짐승이라는 두 범주를 나열합니다. 한국어에서는 소유/귀속을 보태는 표현이 의미를 가장 자연스럽게 전달합니다.
  doctrine_reference: 레위기 7장의 정결/제의 규정
- issue: לֹא תֹאכְלוּ의 금지 강도
  chosen_reading: 규범적 금지로 읽어 “먹어서는 안 됩니다”라고 옮겼습니다.
  alternative_readings:
  - 단순 금지형 “먹지 마십시오”
  - 법령체 “먹어서는 안 됩니다”
  rationale: 법률적 문맥의 2인칭 복수 금지는 현대 한국어에서 가장 명료한 규범 문장으로 전달하는 것이 적절합니다.
  doctrine_reference: 토라의 계명 문체
