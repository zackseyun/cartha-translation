id: LEV.7.15
reference: Leviticus 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
  footnotes:
  - marker: a
    text: Or 'his fellowship offerings for thanksgiving.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sacrifice of his peace offerings for thanksgiving'.
    reason: previous_rendering
translation:
  language: ko
  text: 감사의 화목제의 고기는 그 제물을 바치는 날에 먹어야 합니다[a][b]. 아침까지 그중 아무것도 남겨 두어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '감사 화목제의 제물'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 화목제 중 감사제물의 희생 제물'이라는 뜻입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וּבְשַׂר
  english_pob_choice: And the flesh
  chosen_korean: 고기는
  alternatives_korean:
  - 살은
  - 육은
  lexicon: HALOT
  rationale: בשר는 제사 문맥에서 문자적으로 '살/고기'를 뜻하므로, 제의적 어감을 살리면서 자연스러운 현대 한국어인 '고기'로 옮겼습니다.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  english_pob_choice: the sacrifice of his thanksgiving peace offering
  chosen_korean: 감사의 화목제
  alternatives_korean:
  - 감사 화목제
  - 감사 제물의 화목제
  - 감사의 화목제물
  lexicon: HALOT
  rationale: שְׁלָמִים는 관용적으로 '화목제'로 옮기고, תּוֹדָה의 수식을 '감사의'로 반영해 제사 종류를 압축적으로 드러냈습니다. '화목제물'보다 제의 명칭으로 더 안정적입니다.
- source_word: בְּיוֹם קָרְבָּנוֹ
  english_pob_choice: on the day of his offering
  chosen_korean: 그 제물을 바치는 날
  alternatives_korean:
  - 그의 제물의 날
  - 그가 제물을 드리는 날
  - 바치는 날
  lexicon: HALOT
  rationale: 직역형 '그의 제물'은 한국어에서 어색하므로, 행위 중심으로 풀어 '그 제물을 바치는 날'로 옮겨 זמן-ה표현을 자연스럽게 살렸습니다.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  english_pob_choice: he shall not leave any of it
  chosen_korean: 그중 아무것도 남겨 두어서는 안 됩니다
  alternatives_korean:
  - 그것을 조금도 남겨 두어서는 안 됩니다
  - 아무것도 남기지 말아야 합니다
  lexicon: HALOT
  rationale: נוח의 사역형 금지는 단순히 '남기다'의 금지이므로, 제사 규정의 요구를 분명히 하는 현대 한국어 관용으로 표현했습니다.
theological_decisions:
- issue: שְׁלָמִים 제사명 번역
  chosen_reading: 화목제
  alternative_readings:
  - 평화제
  - 친교제
  rationale: 문맥상 특정 희생제사의 명칭이므로, 한국어 성경에서 널리 통용되면서도 제의 범주를 유지하는 '화목제'를 택했습니다.
  doctrine_reference: POB translation philosophy §5 (Consistency of key terms, or documented exception)
