  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
  footnotes:
  - marker: a
    text: Or 'an offering by fire to the LORD.' The Hebrew term refers to an offering made by fire.
    reason: lexical_alternative
  - marker: b
    text: Or 'reparation offering' or traditionally 'trespass offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것들을 제단 위에서 야훼께 드리는 화제물로 불살라야 합니다[a][b]. 이것은 속건제입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불로 드리는 제물'입니다. 히브리어 용어는 불로 드려지는 제물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '속건제'는 전통적으로 '배상제' 또는 '허물제'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  english_pob_choice: shall burn
  chosen_korean: 불살라야 합니다
  alternatives_korean:
  - 태워야 합니다
  - 연기로 올려야 합니다
  - 불로 드려야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 히필형 קטר는 제물을 제단에서 태워 연기로 올리는 행위를 가리키므로, 현대 한국어로는 기능을 분명히 드러내는 '불살라야 합니다'가 가장 자연스럽습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불 제물
  - 화제
  lexicon: HALOT
  rationale: 이 용어는 제의 용어로 '불로 드리는 제물'을 뜻하므로, 성경 한국어에서 널리 통용되는 '화제물'을 쓰되, 바로 앞의 '불살라야 합니다'로 불의 의미를 분명히 했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명(יהוה)을 원어 지향적으로 살려 '야훼께'로 옮겼습니다. 제의 헌납 방향도 한국어 조사 '-께'로 자연스럽게 드러냈습니다.
- source_word: אָשָׁם
  english_pob_choice: guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제
  - 배상제
  - 허물제
  lexicon: HALOT
  rationale: 이 단어는 레위기 제사의 정식 명칭이므로, 전통적이면서도 기술적인 제명인 '속건제'를 유지했습니다. 문맥상 'guilt offering'의 제의 범주를 보존합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명 יהוה를 사용하므로, 일반적 호칭인 '주'로 완화하지 않고 고유한 언약명을 드러내는 '야훼'를 유지했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — YHWH
- issue: אִשֶּׁה의 제의적 성격
  chosen_reading: 화제물
  alternative_readings:
  - 불로 드리는 제물
  - 불제물
  rationale: 이 용어는 단순한 조리나 소각이 아니라 하나님께 드려지는 제의 행위이므로, 제의적 성격을 분명히 하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (technical sacrificial terminology)
