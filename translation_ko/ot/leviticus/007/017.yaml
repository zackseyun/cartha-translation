source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֖ר מִ/בְּשַׂ֣ר הַ/זָּ֑בַח בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
  footnotes:
  - marker: a
    text: Or 'the flesh of the sacrifice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제물의 고기 중 셋째 날까지 남은 것은 불에 태워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '제물의 살'로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  english_pob_choice: But what remains
  chosen_korean: 그리고 … 남은 것은
  alternatives_korean:
  - 그리고 … 남은 것
  - 하지만 … 남은 것은
  - 그리고 잔여분은
  lexicon: HALOT
  rationale: 남은 것을 뜻하는 분사형 명사를 자연스러운 현대 한국어로 풀되, 원문의 계속·대조적 연결을 살려 '그리고'로 시작했습니다.
- source_word: מִבְשַׂר
  english_pob_choice: of the meat
  chosen_korean: 고기 중
  alternatives_korean:
  - 살 중
  - 제물의 살 중
  - 고기에서
  lexicon: HALOT
  rationale: 제사 문맥에서 בָּשָׂר는 문자적으로 '살'이지만, 한국어에서는 식용 가능한 구체적 대상을 가리키는 '고기'가 더 분명합니다.
- source_word: הַזָּבַח
  english_pob_choice: of the sacrifice
  chosen_korean: 제물의
  alternatives_korean:
  - 희생제의
  - 희생제물의
  - 희생의
  lexicon: HALOT
  rationale: זֶבַח는 제의적 '희생제물'을 가리키므로, 본문 문맥을 살려 '제물'로 옮겼습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: on the third day
  chosen_korean: 셋째 날까지
  alternatives_korean:
  - 셋째 날에
  - 셋째 날이 되면
  - 셋째 날
  lexicon: HALOT
  rationale: 히브리어는 '셋째 날에/까지'의 시간 경계를 나타내며, 앞선 날들에 남아 있는 상태를 강조하므로 '까지'로 자연스럽게 풀었습니다.
- source_word: יִשָּׂרֵף
  english_pob_choice: shall be burned
  chosen_korean: 불에 태워야 합니다
  alternatives_korean:
  - 불에 태워질 것입니다
  - 태워야 합니다
  - 불로 태워져야 합니다
  lexicon: HALOT
  rationale: 법규문의 명령적·규정적 뉘앙스를 살리기 위해 'shall be'를 한국어 의무 표현으로 옮겼고, 'in the fire'를 뒤의 전치사구와 함께 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제의적 처분 규정의 어조
  chosen_reading: 단순 미래 예고가 아니라 율법 규정으로서의 의무를 드러내기 위해 '태워야 합니다'로 옮겼습니다.
  alternative_readings:
  - 태울 것입니다
  - 불에 태워질 것입니다
  rationale: 히브리어 완료/미완료 형식이 법규 문맥에서는 규범적 지시로 기능하므로, 한국어에서도 규정성과 당위를 분명히 해야 합니다.
  doctrine_reference: 레위기 제사 규례의 법적 명령 어조
