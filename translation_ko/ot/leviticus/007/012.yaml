  - 감사제의 희생제물
  lexicon: HALOT
  rationale: 히브리어의 소유격 관계를 살려, ‘감사’에 속한 ‘제의 제물’이라는 구조가 드러나도록 옮겼습니다.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  english_pob_choice: anointed with oil
  chosen_korean: 기름을 바른
