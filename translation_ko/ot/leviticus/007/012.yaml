  rationale: תּוֹדָה는 단순한 감사의 감정이 아니라 감사와 관련된 제의적 제물을 가리키므로, 한국어도 제의성을 살린 ‘감사제물’로 옮겼습니다.
- source_word: זֶבַח הַתּוֹדָה
