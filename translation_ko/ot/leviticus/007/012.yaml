  lexicon: HALOT
  rationale: 식품 준비 맥락이므로 예식적 ‘기름부음’보다 실제 조리 동작인 ‘기름을 바른’이 מקור의 뜻을 더 정확히 전달합니다.
- source_word: מֻרְבֶּכֶת
  english_pob_choice: well mixed
  chosen_korean: 잘 섞어 만든
  alternatives_korean:
  - 잘 반죽한
