revisions:
- from: 속죄제처럼, 속건제도 그러합니다. 그들에게는 한 율법이 있습니다. 그 제물로 속죄하는 제사장은 그것을 차지할 것입니다.[a][b][c]
  to: 속죄제와 같이 속건제도 그러합니다.[a] 두 제사에는 동일한 율법이 있습니다.[b] 그 제물로 속죄하는 제사장은 그 제물을 자기 몫으로 받습니다.[c]
  rationale: 비교 구문은 유지하되 한국어 어순을 다듬었고, 복수 대명사가 가리키는 두 제사를 명시했습니다. 마지막 절은 제물을 수단으로 하는 속죄와 집례 제사장에게 돌아가는 제물의 배정이라는 원문의 관계를 보존하면서, "차지하다"보다 자연스러운 배정 표현으로 수정했습니다. 각주 a의 중복도 실제 표현 대안으로 바로잡았습니다.
