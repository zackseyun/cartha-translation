id: LEV.7.7
reference: Leviticus 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
  footnotes:
  - marker: a
    text: Or, 'As the sin offering, so the guilt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew torah; also 'instruction.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'The priest who makes atonement by it shall have it,' that is, it belongs to the officiating priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 속죄제와 같이 속건제도 그러합니다.[a] 두 제사에는 동일한 율법이 있습니다.[b] 그 제물로 속죄하는 제사장은 그 제물을 자기 몫으로 받습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “속죄제처럼 속건제도 그러합니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 토라; “지침”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, “그것으로 속죄하는 제사장은 그것을 자기 몫으로 받습니다.” 즉, 그 제물은 집례하는 제사장에게 배정됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת / כָּאָשָׁם
  english_pob_choice: Like the sin offering ... so the guilt offering
  chosen_korean: 속죄제처럼, 속건제도 그러합니다
  alternatives_korean:
  - 속죄제처럼, 속건제도 같습니다
  - 속죄제와 같이, 속건제도 그러합니다
  lexicon: HALOT
  rationale: 비교 접두 כּ의 대조 구조를 한국어의 "-처럼 ... 그러합니다"로 살려 두 제사가 대응 관계에 있음을 드러냈습니다. חַטָּאת와 אָשָׁם은 제의 문맥에서 각각 속죄제와 속건제로 옮기는 것이 문맥상 가장 분명합니다.
- source_word: תּוֹרָה אַחַת
  english_pob_choice: there is one law
  chosen_korean: 한 율법이 있습니다
  alternatives_korean:
  - 한 규례가 있습니다
  - 한 지침이 있습니다
  lexicon: HALOT
  rationale: 제의·법률 문맥의 תּוֹרָה는 여기서 절차 규정을 가리키므로 "율법"이 가장 적절합니다. POB의 "one law"와 같은 규범적 단일성을 한국어에서도 직접적으로 살렸습니다.
- source_word: אֲשֶׁר יְכַפֶּר בּוֹ
  english_pob_choice: who makes atonement with it
  chosen_korean: 그 제물로 속죄하는
  alternatives_korean:
  - 그 제물로 속죄를 행하는
  - 그것으로 속죄하는
  lexicon: HALOT
  rationale: כפר는 희생제사 문맥의 전문어이므로 "속죄하다"로 옮겨 제의적·신학적 무게를 유지했습니다. בּוֹ는 제물을 수단으로 삼는 뜻이므로 "그 제물로"가 자연스럽습니다.
- source_word: לוֹ יִהְיֶה
  english_pob_choice: shall have it
  chosen_korean: 그것을 차지할 것입니다
  alternatives_korean:
  - 그것은 그의 몫이 될 것입니다
  - 그것은 그의 것이 될 것입니다
  lexicon: HALOT
  rationale: 이 관용구는 단순 소유를 넘어 제사장의 배당·몫을 뜻하므로 "차지하다"가 법적 할당의 뉘앙스를 잘 드러냅니다. POB의 설명처럼 집례하는 제사장의 소유권을 분명히 하기 위해 목적어를 유지했습니다.
theological_decisions:
- issue: כפר의 번역을 단순 절차가 아니라 속죄 행위로 살릴지 여부
  chosen_reading: 속죄하다
  alternative_readings:
  - 속죄를 이루다
  - 속죄를 행하다
  rationale: 본문은 제의 규정이지만 כפר는 희생제의의 신학을 담은 동사이므로, 단순한 의식 수행이 아니라 죄에 대한 속죄 행위로 읽히도록 옮기는 것이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §3, §6
