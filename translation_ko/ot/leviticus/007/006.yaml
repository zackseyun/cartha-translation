id: LEV.7.6
reference: Leviticus 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
  footnotes:
  - marker: a
    text: Or, 'Every male of the priests shall eat it.' The Hebrew can be rendered more formally, but the sense is that any male member of the priestly group is permitted to eat it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'holy of holies,' an idiom meaning 'most holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들 가운데 모든 남자는 그것을 먹을 수 있습니다[a]. 그것은 거룩한 곳에서 먹어야 합니다[b]. 그것은 지극히 거룩합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘제사장들 가운데 모든 남자’라고 하여 제사장 집단 내의 남성에게만 섭취를 허용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘거룩한 곳’은 특정한 성소 건물이라기보다 거룩하게 구별된 장소를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  english_pob_choice: Every male among the priests
  chosen_korean: 제사장들 가운데 모든 남자
  alternatives_korean:
  - 제사장들 가운데 모든 남성
  - 제사장들 가운데 모든 사내
  lexicon: HALOT
  rationale: ‘זָכָר’는 성별을 가리키므로 ‘남자’로 옮겨 남성 제한을 분명히 했고, ‘בַּכֹּהֲנִים’은 제사장 집단 내부의 범주를 나타내므로 ‘제사장들 가운데’가 자연스럽습니다.
- source_word: יֹאכְלֶנּוּ
  english_pob_choice: may eat it
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹어야 합니다
  - 먹습니다
  lexicon: HALOT
  rationale: 본문은 제사장 남성에게 허용된 섭취를 말하므로, 단순 미래나 의무보다 허용의 뉘앙스를 살리는 ‘먹을 수 있습니다’가 적절합니다.
- source_word: בְּמָקוֹם קָדוֹשׁ יֵאָכֵל
  english_pob_choice: it shall be eaten in a holy place
  chosen_korean: 거룩한 곳에서 먹어야 합니다
  alternatives_korean:
  - 거룩한 곳에서 먹을 수 있습니다
  - 성소에서 먹어야 합니다
  lexicon: HALOT
  rationale: ‘בְּמָקוֹם קָדוֹשׁ’은 특정 성소 건물보다 거룩한 장소라는 범주를 가리키므로 ‘거룩한 곳’이 직접적이며, 수동형 의무를 ‘먹어야 합니다’로 살렸습니다.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  english_pob_choice: It is most holy
  chosen_korean: 그것은 지극히 거룩합니다
  alternatives_korean:
  - 그것은 가장 거룩한 것입니다
  - 그것은 지성물입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘거룩함의 거룩함’은 등급상의 최고 성격을 나타내므로, 한국어에서는 ‘지극히 거룩합니다’로 옮겨 분류적 의미를 보존했습니다.
theological_decisions:
- issue: 제사장 남성만의 섭취 허용을 그대로 유지할지 여부
  chosen_reading: ‘제사장들 가운데 모든 남자’로 옮겨 남성 제한을 명시했습니다.
  alternative_readings:
  - ‘모든 제사장’으로 일반화
  - ‘제사장 가운데 누구나’로 성별을 비가시화
  rationale: 히브리어는 ‘남자’와 ‘제사장들 가운데’를 함께 사용하여 섭취 자격을 제한하므로, 이를 일반화하지 않고 그대로 드러내는 것이 본문의 제의 규정을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
