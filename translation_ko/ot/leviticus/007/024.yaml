  source_fidelity: 초안의 첫 구절 ‘그 기름과 자연사한 짐승의 기름’은 히브리어에 없는 별도의 ‘그 기름’을 첨가하고 병렬 구조를 흐립니다. 원문은 ‘저절로 죽은 짐승의 기름’과 ‘들짐승에게 찢긴 짐승의 기름’ 두 항목만을 말합니다. 또한 נְבֵלָה를 사람에게 주로 쓰이는 ‘자연사’로 옮기기보다 ‘저절로 죽은’으로 표현하는 편이 정확하고 자연스럽습니다.
  naturalness: ‘어떤 일에든 사용할 수 있으나’도 이해되지만, 기름의 비식용 사용을 허용하는 법규 문맥에서는 ‘어떤 용도로든 쓸 수 있습니다’가 더 자연스럽습니다. 두 독립 절을 합쇼체로 분명히 나누었습니다.
  terminology: חֵלֶב은 이 문맥에서 관례적이고 적절한 ‘기름’으로 유지했습니다. טְרֵפָה는 대상이 짐승임을 드러내어 ‘들짐승에게 찢긴 짐승’으로 했습니다. 금지의 강조는 ‘결코 먹어서는 안 됩니다’로 반영했습니다.
