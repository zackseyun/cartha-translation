id: LEV.7.24
reference: Leviticus 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
  footnotes:
  - marker: a
    text: Hebrew 'nevelah' refers to an animal that died without proper slaughter; 'found dead' is a possible alternative rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'one torn by wild animals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기름과 자연사한 짐승의 기름, 그리고 들짐승에게 찢긴 것의 기름은 어떤 일에든 사용할 수 있으나, 그것을 먹어서는 절대로 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְבֵלָה는 ‘정상적인 도살 없이 죽은 짐승’을 가리키며, ‘죽어서 발견된 것’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들짐승에게 찢긴 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 수지
  lexicon: HALOT
  rationale: 제사법 문맥에서 동물의 fat은 한국어 성경에서 관례적으로 ‘기름’으로 옮겨지며, 먹는 ‘지방’보다 제의적 금지와 분배의 뉘앙스를 더 자연스럽게 전달합니다.
- source_word: נְבֵלָה
  english_pob_choice: an animal that dies naturally
  chosen_korean: 자연사한 짐승
  alternatives_korean:
  - 죽은 짐승
  - 시체가 된 짐승
  - 제대로 도살되지 않고 죽은 짐승
  lexicon: HALOT
  rationale: 문맥상 ‘정상적인 도살 없이 죽은 짐승’이라는 뜻을 살리되, 현대 한국어에서 이해되기 쉬운 표현으로 옮겼습니다.
- source_word: טְרֵפָה
  english_pob_choice: one torn by beasts
  chosen_korean: 들짐승에게 찢긴 것
  alternatives_korean:
  - 들짐승에게 찢긴 짐승
  - 야수에게 찢긴 것
  - 맹수에게 찢긴 것
  lexicon: HALOT
  rationale: 피해 행위를 분명히 하고, 영어 POB가 유지한 ‘torn by beasts’의 의미를 자연스러운 한국어로 반영했습니다.
- source_word: לְכָל מְלָאכָה
  english_pob_choice: for any work
  chosen_korean: 어떤 일에든 사용할 수 있으나
  alternatives_korean:
  - 어떤 작업에도 쓸 수 있으나
  - 어떤 용도로든 쓸 수 있으나
  lexicon: HALOT
  rationale: 단순한 ‘일’이 아니라 실제 사용 가능 범위를 뜻하는 법률적 허용을 한국어의 ‘사용할 수 있다’로 풀어, 먹는 것과의 대비를 분명히 했습니다.
theological_decisions:
- issue: 먹지 말라는 금지의 강도
  chosen_reading: ‘그것을 먹어서는 절대로 안 됩니다’로 강한 금지를 살렸습니다.
  alternative_readings:
  - 그것을 먹지 말아야 합니다
  - 그것을 먹으면 안 됩니다
  rationale: 히브리어의 부정 절대 구조가 단순 금지보다 강한 강조를 가지므로, 한국어에서도 금지의 강도를 분명히 드러냈습니다.
  doctrine_reference: 레위기 7장의 정결/거룩 규례
