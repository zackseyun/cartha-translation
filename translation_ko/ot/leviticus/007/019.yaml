  to: 그러나 어떤 부정한 것[a]에 닿은 고기는 먹어서는 안 되며, 불에 태워야 합니다. 그 고기는 정결한 사람은 누구나 먹을 수 있습니다.
  rationale: 수동형 법규 표현을 ‘먹어서는 안 되며, … 태워야 합니다’로 복원하고, 마지막 절을 명령이 아닌 허용인 ‘먹을 수 있습니다’로 수정했습니다. 반복된 ‘고기’는 한국어에서 자연스럽게 ‘그 고기’로 받아, 오염된 고기와 먹을 수 있는 고기에 대한 문맥상 전환을 유지했습니다.
