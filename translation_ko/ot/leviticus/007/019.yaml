  verdict: revise
  source_fidelity: 초안은 오염된 고기를 먹지 말고 불에 태운다는 앞부분의 핵심을 대체로 반영합니다. 그러나 히브리어의 수동적 법규 표현(‘먹혀서는 안 된다’, ‘태워져야 한다’)을 직접 명령형 ‘먹지 말고… 태우라’로 바꾸었고, 마지막 יֹאכַל은 명령이 아니라 먹을 수 있다는 허용인데 ‘먹으라’로 번역하여 의미가 달라졌습니다.
  naturalness: ‘정결한 사람은 누구나 … 먹을 수 있습니다’는 현대 표준어 합쇼체에서 자연스럽고, 법규적 문맥에도 적절합니다. ‘부정한 것’은 각주로 의례적 의미를 밝혀 오해를 줄이는 것이 좋습니다.
  terminology: בָּשָׂר는 제물의 고기를 가리키므로 ‘고기’가 적절합니다. טָמֵא/טָהוֹר는 도덕적 평가가 아니라 의례적 상태를 가리키므로 ‘부정한/정결한’으로 옮기고 각주에서 그 범위를 설명합니다.
