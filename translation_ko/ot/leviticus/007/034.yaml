id: LEV.7.34
reference: Leviticus 7:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.' The Hebrew is literally 'sons of Israel,' a standard covenantal designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'heave offering' for 'contribution.' The Hebrew term refers to a portion set apart and lifted up as an offering.
    reason: lexical_alternative
  - marker: c
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 이스라엘 자손에게서 그들의 화목제물 중에 요제로 드리는 가슴과 거제의 넓적다리를 취하여, 그것을 제사장 아론과 그의 아들들에게 이스라엘 자손에게서 받은 영원한 규례로 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요제’와 ‘거제’는 각각 “wave offering”, “contribution/heave offering”에 해당하는 제의 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  english_pob_choice: the breast of the wave offering
  chosen_korean: 요제로 드리는 가슴
  alternatives_korean:
  - 흔드는 제물의 가슴
  - 요제의 가슴
  - 요제로 들린 가슴
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 동작이 결합된 정해진 제물 범주이므로, 문맥을 살려 ‘요제’로 옮기고 신체 부위는 현대 한국어에 자연스러운 ‘가슴’으로 옮겼습니다.
- source_word: שׁוֹק הַתְּרוּמָה
  english_pob_choice: the thigh of the contribution
  chosen_korean: 거제의 넓적다리
  alternatives_korean:
  - 거제의 허벅지
  - 들어 올린 제물의 넓적다리
  - 거제물의 넓적다리
  lexicon: HALOT
  rationale: תְּרוּמָה는 ‘들어 올려 구별한’ 제물의 몫이므로, 제의 용어인 ‘거제’를 유지하고 שׁוֹק은 제사 문맥의 해부학적 표현에 맞게 ‘넓적다리’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 언약적 관용구를 그대로 살리되, 한국어 성경에서 널리 쓰이는 ‘이스라엘 자손’으로 옮겨 형식성과 가독성을 함께 확보했습니다.
- source_word: לְחָק עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영속하는 규례
  - 항구한 규례
  - 영원한 법령
  lexicon: HALOT
  rationale: חֹק/חָק은 제의·법적 규정을 가리키므로 ‘규례’가 적절하고, עוֹלָם은 지속성을 나타내는 관용 표현이라 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: 제사장 몫의 법적 성격
  chosen_reading: 하나님께서 이 몫을 아론과 그의 아들들에게 주신 언약적·법적 배분으로 번역했습니다.
  alternative_readings:
  - 단순한 제의 관행으로 완화하는 번역
  - 설명 없이 일반적 배분으로만 옮기는 번역
  rationale: 본문은 설명문 형식으로 이 몫의 제도적 근거를 밝히므로, 사적인 관행이 아니라 이스라엘에게 주어진 영속 규정이라는 점을 드러내야 합니다.
  doctrine_reference: Leviticus의 제의 규정은 언약 공동체 안에서 하나님이 정하신 질서를 나타냅니다.
