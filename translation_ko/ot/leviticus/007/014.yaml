id: LEV.7.14
reference: Leviticus 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
  footnotes:
  - marker: a
    text: Or 'as a heave offering to the LORD.' The Hebrew term refers to a portion set apart for God and assigned to the priest.
    reason: lexical_alternative
  - marker: b
    text: Or 'who dashes' or 'who sprinkles' the blood of the peace offerings.
    reason: lexical_alternative
  - marker: c
    text: '''Peace offerings'' may also be rendered ''fellowship offerings'' or ''offerings of well-being.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 제물에서 각각의 제물마다 하나를 여호와께 드리는 거제로 바쳐야 합니다. 그것은 화목제의 피를 뿌리는 제사장의 몫이 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거제물로’. 이 히브리어는 하나님께 구별하여 올려 제사장에게 주어지는 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뿌리는’ 혹은 ‘끼얹는’.
    reason: lexical_alternative
  - marker: c
    text: ‘화목제’는 ‘교제제’ 또는 ‘평안제’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: he shall present
  chosen_korean: 드리는
  alternatives_korean:
  - 바치는
  - 제시하는
  - 제물로 드리는
  lexicon: HALOT
  rationale: 제의 문맥에서 קרב의 ‘가까이 가져오다/바치다’ 의미를 살려 자연스럽게 ‘드리다’로 옮겼습니다.
- source_word: תְּרוּמָה
  english_pob_choice: as a contribution
  chosen_korean: 거제로 바쳐
  alternatives_korean:
  - 바치는 헌물로
  - 헌물로 드려
  - 들어 올린 제물로
  lexicon: HALOT
  rationale: תְּרוּמָה는 하나님께 구별하여 올리고 제사장에게 돌려지는 몫이므로, 전통 용어를 살리되 본문 이해를 돕기 위해 ‘거제’와 ‘바치다’를 함께 사용했습니다.
- source_word: הַזֹּרֵק אֶת דַּם הַשְּׁלָמִים
  english_pob_choice: who sprinkles the blood of the peace offerings
  chosen_korean: 화목제의 피를 뿌리는
  alternatives_korean:
  - 화목제의 피를 뿌리는
  - 화목제의 피를 뿌려 바치는
  - 평화제의 피를 뿌리는
  lexicon: HALOT
  rationale: זרק은 제의적 ‘뿌리다/끼얹다’의 뜻이므로 ‘뿌리는’이 가장 직접적입니다. שְׁלָמִים은 한국어 성경 전통에 따라 ‘화목제’로 옮겼습니다.
- source_word: לוֹ יִהְיֶה
  english_pob_choice: it shall belong to
  chosen_korean: 몫이 될 것입니다
  alternatives_korean:
  - 그의 것이 될 것입니다
  - 그에게 속할 것입니다
  - 그 몫이 됩니다
  lexicon: HALOT
  rationale: 소유·배당의 관용구를 한국어 제의/법정 문맥에 자연스럽게 드러내면서, 제사장에게 배정되는 몫이라는 의미를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 작업의 한국어 본문은 기존 POB 영어의 ‘the LORD’ 관례에 맞춰 한국 교회 독자에게 익숙한 전통 표기를 따랐습니다. 본 절은 직접 인용이 아니므로 별도 야훼 표기는 택하지 않았습니다.
  doctrine_reference: POB contested terms policy for YHWH
- issue: שְׁלָמִים의 한국어 대응
  chosen_reading: 화목제
  alternative_readings:
  - 화평제
  - 교제제
  - 평안제
  rationale: 의례적 제사 항목으로 굳어진 한국어 대응을 사용해 본문의 제의적 분류를 보존했습니다. ‘평화제’는 의미상 가능하지만 한국어 성경 독자에게 덜 익숙합니다.
  doctrine_reference: Sacrificial terminology consistency
