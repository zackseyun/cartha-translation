id: LEV.7.23
reference: Leviticus 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[a]에게 이렇게 말하십시오. “너희는 소나 양이나 염소의 어떤 기름도 먹어서는 안 됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 직역적 표현인 'sons of Israel'을 살리되, 한국어에서는 집합적 의미가 자연스럽게 드러나는 '자손'을 택했습니다.
- source_word: חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 지방덩어리
  - 기름기
  lexicon: HALOT
  rationale: 레위기 제의법 맥락에서 חֵלֶב은 일반적인 '지방'보다 제의적으로 금지된 동물의 기름 부분을 가리키므로, 한국어 성경의 관용을 고려해 '기름'으로 옮겼습니다.
- source_word: שׁוֹר וְכֶשֶׂב וָעֵז
  english_pob_choice: an ox, a sheep, or a goat
  chosen_korean: 소나 양이나 염소
  alternatives_korean:
  - 황소나 양이나 염소
  - 소, 양, 또는 염소
  lexicon: HALOT
  rationale: 세 동물 목록의 평행을 살리면서도 한국어에서는 포괄적이고 자연스러운 가축 명칭을 사용했습니다. 'ox'는 문맥상 단수 목록이지만 한국어에서는 '소'가 더 무난합니다.
- source_word: לֹא תֹאכֵלוּ
  english_pob_choice: You shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 마십시오
  - 먹지 못합니다
  lexicon: HALOT
  rationale: 율법적 금지의 규범성을 살리면서도 현대 한국어에서 가장 자연스러운 금지 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘sons of Israel’의 대표성 있는 남성형 표현을 어떻게 한국어로 처리할지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 남자들
  rationale: 본문의 남성 복수형을 지우지 않으면서도, 실제 지시 대상이 언약 공동체 전체라는 점을 한국어 집합명사로 자연스럽게 전달합니다.
  doctrine_reference: 언약 공동체의 대표성 있는 호칭
- issue: 제의법 맥락에서 חֵלֶב을 일반 지방이 아니라 금지된 제물 규정의 대상로 볼지
  chosen_reading: 기름
  alternative_readings:
  - 지방
  - 기름기
  rationale: 레위기의 제의적 금지 조항에서는 חֵלֶב이 단순한 영양 성분이 아니라 하나님께 돌려질 수 없는 특정 부위를 뜻하므로, 전통적인 성경 번역과 소통성을 함께 고려해 '기름'으로 처리했습니다.
  doctrine_reference: 레위기 제의 정결/거룩 규정
