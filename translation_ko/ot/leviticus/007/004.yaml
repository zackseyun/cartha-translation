base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
  footnotes:
  - marker: a
    text: Or 'the lobe on the liver'; the Hebrew term for this anatomical part is technical and its precise referent is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 개의 콩팥과, 그 위에 있는 기름, 곧 허리 부분에 있는 것과, 간 위에 있는 돌출부를, 콩팥과 함께 제거해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간에 붙은 엽(葉)’; 이 해부학 용어는 기술적이며 정확한 가리킴이 논의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  english_pob_choice: the two kidneys
  chosen_korean: 두 개의 콩팥
  alternatives_korean:
  - 두 개의 신장
  - 두 개의 내장
  lexicon: HALOT
  rationale: כְּלָיֹת은 제사 문맥에서 해부학적으로 콩팥/신장을 가리키며, 현대 한국어에서는 ‘콩팥’이 가장 자연스럽고 분명합니다.
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름덩어리
  lexicon: HALOT
  rationale: 레위기 제사 규례의 חֵלֶב은 제물로 드려지는 기름진 부분을 뜻하므로, 한국어 성서 문맥에서 직역보다 ‘기름’이 더 관용적이고 간명합니다.
- source_word: הַכְּסָלִים
  english_pob_choice: the loins
  chosen_korean: 허리 부분
  alternatives_korean:
  - 허리
  - 옆구리
  lexicon: HALOT
  rationale: כְּסָלִים은 콩팥 주변의 허리/옆구리 부위를 가리키므로, 현대 독자가 이해하기 쉬운 해부학적 표현으로 풀어 썼습니다.
- source_word: הַיֹּתֶרֶת
  english_pob_choice: the appendage
  chosen_korean: 돌출부
  alternatives_korean:
  - 엽
  - 로브
  - 부위
  lexicon: HALOT
  rationale: יוֹתֶרֶת은 정확한 해부학적 대응이 논의되는 기술 용어이므로, 과잉 특정화를 피하면서도 본문이 말하는 붙은 부분을 드러내는 ‘돌출부’를 택했습니다.
theological_decisions:
- issue: 제사 규정의 기술적 해부학 용어를 어떻게 처리할지
  chosen_reading: 본문의 제의적 절차를 분명히 하되, 정확히 논쟁적인 부분은 과도하게 단정하지 않고 옮겼습니다.
  alternative_readings:
  - 전통적 교회용 표현으로 단순화
  - 해부학적 대응을 지나치게 특정
  rationale: 이 절은 예배적 상징보다 제사 절차의 정확성이 중요한 본문이므로, 원문이 말하는 요소들을 최대한 보존하면서도 현대 한국어 독자가 이해할 수 있게 했습니다.
  doctrine_reference: 레위기 제사 규례의 문자적 절차 이해
