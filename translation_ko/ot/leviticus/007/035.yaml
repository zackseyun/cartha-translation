id: LEV.7.35
reference: Leviticus 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
  footnotes:
  - marker: a
    text: Or “anointing portion.” The Hebrew term is related to anointing, but here likely refers to the allotted priestly share associated with consecration.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, “offerings by fire of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 야훼의 화제물에서 나오는 아론의 기름부음의 몫과 그의 아들들의 기름부음의 몫입니다.[a][b] 이는 그들을 야훼를 섬기는 제사장으로 세우신 날에 정해진 몫입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름부음받은 자들의 몫’. 히브리어는 기름부음과 관련된 말이지만, 여기서는 성별과 관련하여 제사장들에게 배정된 몫을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불로 드리는 제물들’. 전통적으로 ‘화제물’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  english_pob_choice: anointed portion
  chosen_korean: 거룩하게 된 몫
  alternatives_korean:
  - 기름부음의 몫
  - 기름부음받은 몫
  - 몫
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘기름부음’ 행위가 아니라 제사장 직분에 연결된 배당 몫을 가리키므로, ‘몫’을 핵심으로 하되 성별(聖別)된 의미를 살려 ‘거룩하게 된 몫’으로 옮겼습니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼의 음식 제물들 가운데서
  alternatives_korean:
  - 야훼의 화제물들 가운데서
  - 야훼께 드리는 불로 드리는 제물들 가운데서
  lexicon: HALOT
  rationale: אִשֵּׁי는 전통적으로 ‘화제물’이지만, 한국어에서는 ‘음식 제물’이 제물의 용도를 더 분명히 드러내며 이 문맥의 제사장 몫과도 자연스럽게 이어집니다.
- source_word: בְּיוֹם הִקְרִיב אֹתָם לְכַהֵן
  english_pob_choice: on the day when he presented them to serve as priests
  chosen_korean: 그가 그들을 야훼를 섬기는 제사장으로 세우던 날에
  alternatives_korean:
  - 그가 그들을 제사장으로 드리던 날에
  - 그가 그들을 제사장으로 임명하던 날에
  lexicon: HALOT
  rationale: הִקְרִיב은 문자적으로 ‘가까이 데려오다’이지만, 여기서는 제사장 직무에 세우는 설치·헌정의 의미가 강하므로 ‘세우다’가 가장 자연스럽고 오해가 적습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼께
  - 야훼에게
  lexicon: HALOT
  rationale: לְכַהֵן과 함께 ‘야훼를 섬기다’로 이어지는 목적을 한국어에서 자연스럽게 드러내기 위해 목적격 ‘-를’을 사용했습니다.
theological_decisions:
- issue: מִשְׁחַת의 의미를 ‘기름부음’으로 직접 둘지, 몫/배당으로 풀지
  chosen_reading: 배당 몫을 뜻하되 성별된 상태를 반영하는 표현으로 처리했습니다.
  alternative_readings:
  - 기름부음의 몫
  - 기름부음받은 몫
  rationale: 히브리어 어근상 기름부음과 관련되지만, 이 절은 제사장들에게 돌아가는 제물 몫을 요약하므로 독자가 의식 행위 자체보다 배당된 몫을 이해하도록 하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 제사장 몫과 성별(거룩하게 구별됨) 개념
