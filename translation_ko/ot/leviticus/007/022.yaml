  - ‘여호와’로 음역
  rationale: POB의 원칙에 맞추어, 원문이 사용하는 신적 고유명사를 직함으로 바꾸지 않고 한국어에서도 이름으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
