lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: דבר은 새 말씀 단락을 여는 공식적 서술이므로, 단순한 ‘말하다’보다 ‘말씀하여 이르다’가 문체와 기능을 더 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 한국어로 음역해 하나님의 언약 이름을 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 향하여
  lexicon: HALOT
  rationale: 발화의 간접목적어를 자연스러운 현대 한국어 조사 ‘에게’로 옮겼습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세오
  lexicon: HALOT
  rationale: 성경에서 널리 정착된 인명 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 라고
  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 발화 내용을 여는 관용구이므로, 한국어에서는 중복을 피하면서도 다음 절의 직접 발화를 예고하는 ‘이르셨습니다’로 처리했습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 본문에 어떻게 반영할지
  chosen_reading: ‘야훼’로 직역 음역하여 인격적 언약 이름을 드러냈습니다.
  alternative_readings:
