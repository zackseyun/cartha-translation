base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his sacrifice of peace offerings'; traditionally 'peace offering,' and in some versions 'fellowship offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[a]에게 이렇게 말하십시오. 화목제물[b]을 야훼께 드리는 사람은 그 화목제물 가운데서 예물을 야훼께 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘평화 제물’. 히브리어는 전통적으로 ‘화목제’로 옮기는 제사 범주를 가리키며, 이 표현은 복수형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역적 남성 복수 구조를 살리면서도 한국어에서는 관용적이고 성경적인 집합 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: הַמַּקְרִיב
  english_pob_choice: the one who presents
  chosen_korean: 드리는 자
  alternatives_korean:
  - 제공하는 자
  - 바치는 자
  lexicon: HALOT
  rationale: קרב의 제의적 용법을 살려 단순히 ‘가져오는’보다 제사를 하나님께 ‘드리는’ 행위를 드러내는 표현을 택했습니다.
- source_word: זֶבַח שְׁלָמָיו
  english_pob_choice: his peace sacrifice
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화 제물
  - 화목제
  lexicon: HALOT
  rationale: 한국 교회 용례와 제의적 범주를 고려해 ‘화목제물’을 사용하되, 본문에서는 한 번 더 반복해 해당 제물과의 연결을 분명히 했습니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 헌물
  lexicon: HALOT
  rationale: קרבן의 일반적 의미를 살리면서 제의 문맥에서 자연스러운 한국어인 ‘예물’을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 고유명을 음역하여, 본문에서 제의적 주체를 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → 야훼'
- issue: שְׁלָמִים 제사의 한국어 처리
  chosen_reading: 화목제물
  alternative_readings:
  - 화평제물
  - 평화제물
  rationale: 전통적이고 널리 이해되는 제사 명칭을 유지하되, 본문 안에서 ‘그의 화목제물’과 ‘그의 예물’의 관계를 반복해 제의적 구조를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
