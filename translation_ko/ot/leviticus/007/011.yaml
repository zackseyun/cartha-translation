id: LEV.7.11
reference: Leviticus 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: Now this is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
  footnotes:
  - marker: a
    text: Or 'offerings of well-being'; traditionally 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 사람이 야훼께 드리는 화목제의 규례입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안제’; 전통적으로는 ‘화목제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  english_pob_choice: Now this
  chosen_korean: 이것은
  alternatives_korean:
  - 그리고 이것은
  - 자, 이것은
  lexicon: HALOT
  rationale: 새 단락을 여는 지시 표현으로서 한국어에서는 단순한 지시대명사형이 가장 자연스럽고, 과도한 담화 표지는 피하는 편이 원문의 규례 도입 기능을 잘 살립니다.
- source_word: תּוֹרַת
  english_pob_choice: the law of
  chosen_korean: 규례
  alternatives_korean:
  - 율법
  - 지침
  - 법
  lexicon: HALOT
  rationale: 제사 문맥의 תּוֹרָה는 일반 윤리법보다 제의적 규정의 성격이 강하므로, 한국어에서는 간결하게 ‘규례’로 옮겨 제의 절차의 규범성을 드러냈습니다.
- source_word: הַ/שְּׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화제
  - 평안제
  - 화목제물
  lexicon: HALOT
  rationale: שְׁלָמִים는 전통적 한국어 성경에서도 확립된 제사 용어인 ‘화목제’가 가장 직접적이며, ‘평화제’나 ‘평안제’는 의미를 풀지만 용례 일관성이 떨어집니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 원문이 신명기적/제의적 문맥에서 여호와 신명자를 직접 사용하므로, 프로젝트 기본 원칙에 따라 음역형 ‘야훼’와 여격 조사 ‘-께’를 결합해 방향성과 헌납 대상을 분명히 했습니다.
theological_decisions:
- issue: 제의 용어의 번역 등가성
  chosen_reading: ‘화목제’는 전통 용어를 유지하되, 본문 기능상 제의 규례로 읽히도록 ‘규례’와 결합했습니다.
  alternative_readings:
  - ‘평화제’로 의미를 풀어 번역
  - ‘평안제’로 설명적 번역
  rationale: 이 절은 새 제사 규정을 도입하는 표제 역할을 하므로, 독자가 즉시 제의 단위로 인식하도록 기존 성경 용례와 연속성을 지키는 것이 유리합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
