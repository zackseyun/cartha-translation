  source_fidelity: 히브리어의 표제적 구성(‘이것은 …의 규례이다’)과 זֶבַח הַשְּׁלָמִים의 제의 용어를 충실히 반영합니다. ‘사람이 야훼께 드리는’은 יַקְרִיב לַיהוָה의 일반적·대표적 단수 용법을 자연스럽게 옮긴 표현입니다.
  naturalness: ‘이것은 사람이 야훼께 드리는 화목제의 규례입니다’는 현대 표준어 합쇼체로 자연스럽고, 제의 규정을 도입하는 문장으로도 명료합니다. 원문의 접속사 וְ는 한국어에서 별도 접속 표현 없이 처리해도 자연스럽습니다.
  terminology: ‘규례’는 이 문맥의 תּוֹרָה에 적절하며, ‘화목제’는 שְׁלָמִים에 대한 확립된 한국어 제의 용어입니다. 신명은 프로젝트 방침과 영어 감사 기록에 맞게 ‘야훼’로 일관되게 처리되었습니다. 각주도 대안적 의미 영역을 적절히 보존합니다.
