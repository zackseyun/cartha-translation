    rationale: לְמָנָה는 ‘정해진 몫으로, 분깃으로’를 뜻하며 시간적 ‘기한’이나 ‘때’의 의미가 아닙니다.
  - severity: medium
    issue: 초안의 관계절과 주절 연결이 불명확합니다.
    rationale: ‘드리며 그에게’는 누가 드리는지와 ‘그’가 누구인지 문법적으로 매끄럽게 연결하지 못합니다. 히브리어는 ‘드리는 사람’이 오른쪽 넓적다리를 받는다는 구조입니다.
