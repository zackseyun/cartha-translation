  source_fidelity: 초안은 히브리어의 관계절 구조를 충분히 드러내지 못하고, לְמָנָה(‘몫으로/분깃으로’)를 ‘기한대로’로 잘못 옮겼습니다. 수정문은 아론의 자손 가운데 제물의 피와 기름을 드리는 제사장에게 오른쪽 넓적다리가 배정됨을 보존합니다.
  naturalness: ‘아론의 자손들 중 화목 제물의 피와 기름을 드리며 그에게’는 문장 구조가 어색하고 선행 대상이 불분명합니다. ‘아론의 자손들 가운데 … 드리는 사람에게는’으로 관계절과 법규적 진술을 자연스럽게 명료화했습니다.
  terminology: ‘화목제’는 שְׁלָמִים의 한국어 성경 번역에서 널리 쓰이는 정착된 용어이며, ‘넓적다리’는 שׁוֹק의 해당 제물 부위를 ‘다리’보다 구체적으로 나타냅니다. ‘몫으로 돌아갈 것입니다’는 לְמָנָה의 배정·분깃 의미를 반영합니다.
  issues:
