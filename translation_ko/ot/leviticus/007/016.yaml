id: LEV.7.16
reference: Leviticus 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
  footnotes:
  - marker: a
    text: Or 'a votive offering' for 'a vow.' The Hebrew distinguishes a sacrifice connected to a vow from a voluntary freewill offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 드리는 희생제물이 서원제[a]나 자원제이면, 그 희생제물을 드리는 날에 먹어야 합니다. 다음 날에도 그것 가운데 남은 것은 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서원제’는 히브리어 נֶדֶר를 제의적 범주로 옮긴 것입니다. 이 말은 서원에 따른 제물을 가리키며, 본문은 이를 자원제와 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  english_pob_choice: a vow
  chosen_korean: 서원제
  alternatives_korean:
  - 서원
  - 서원물
  lexicon: HALOT
  rationale: 문맥상 נֶדֶר는 단순한 ‘서원’ 자체보다 서원과 연결된 제의 범주를 가리키므로, 제의적 분류가 드러나는 ‘서원제’로 옮겼습니다.
- source_word: נְדָבָה
  english_pob_choice: a freewill offering
  chosen_korean: 자원제
  alternatives_korean:
  - 자원하는 제물
  - 자원 제물
  lexicon: HALOT
  rationale: נְדָבָה는 의무가 아닌 자발적 드림을 뜻하므로, 제의적 대칭을 살리면서도 자연스러운 한국어인 ‘자원제’를 택했습니다.
- source_word: זֶבַח קָרְבָּנוֹ
  english_pob_choice: the sacrifice of his offering
  chosen_korean: 그의 제물의 희생
  alternatives_korean:
  - 그의 제물의 제사
  - 그의 드린 제물의 희생
  lexicon: HALOT
  rationale: זֶבַח의 ‘희생/희생제물’과 קָרְבָּן의 ‘제물, 바쳐 드린 것’이 함께 있는 구성이라, 두 요소를 모두 보이도록 직역에 가깝게 옮겼습니다.
- source_word: בְּיוֹם הַקְרִיבוֹ
  english_pob_choice: on the day he presents
  chosen_korean: 그가 자기 희생을 바치는 날에
  alternatives_korean:
  - 그가 그것을 드리는 날에
  - 그가 바쳐 올리는 날에
  lexicon: HALOT
  rationale: הקריב의 제의적 causative 의미를 살려 ‘바치다’로 옮겼고, 목적어를 보완해 한국어 문장이 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 서원제/자원제 구분을 제의 범주로 드러낼지 여부
  chosen_reading: 두 표현을 모두 제의 명칭으로 옮겨, 서원에 연결된 제물과 자원으로 드려진 제물을 구분했습니다.
  alternative_readings:
  - 서원이나 자원으로 드린 제물
  - 서원 제물이나 자원 제물
  rationale: 히브리어는 נֶדֶר와 נְדָבָה를 병렬로 두어 제물의 동기와 성격을 구분하므로, 한국어에서도 그 대조가 분명히 보이도록 했습니다.
  doctrine_reference: 레위기 제의 규정의 문맥적 구분
- issue: 동일 동사 יֵאָכֵל의 법적·허용적 뉘앙스
  chosen_reading: 첫 번째는 규정적 ‘먹어야 합니다’, 두 번째는 허용적 ‘먹을 수 있습니다’로 처리했습니다.
  alternative_readings:
  - 두 곳 모두 ‘먹어야 합니다’
  - 두 곳 모두 ‘먹을 수 있습니다’
  rationale: 히브리어는 같은 형태를 반복하지만, 문맥상 첫째 날은 규정, 다음 날은 남은 부분에 대한 허용을 말하므로 한국어에서도 그 차이를 반영했습니다.
  doctrine_reference: 레위기 제의법의 절차적 규정
