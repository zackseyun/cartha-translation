  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
  footnotes:
  - marker: a
    text: Or 'soul.' Hebrew nephesh here refers to the individual person.
    reason: lexical_alternative
  - marker: b
    text: The expression 'shall be cut off' is a standard covenant penalty formula; it may imply removal from the community or divine judgment, and the Hebrew does not specify the exact mode here.
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 사람이든지 어떤 피든지 먹으면 그 사람은 자기 백성 가운데서 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어떤 사람이든지’의 히브리어 נֶפֶשׁ는 여기서 ‘혼’보다 개별 인격을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어질 것입니다’는 언약적 형벌 공식을 보존한 번역으로, 구체적 방식은 본문이 밝히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: כָּל נֶפֶשׁ
  english_pob_choice: Every person
  chosen_korean: 어떤 사람이든지
  alternatives_korean:
  - 각 사람
  - 모든 사람
  - 어떤 혼이라도
  lexicon: WLC / HALOT
  rationale: 법률 문맥의 נֶפֶשׁ는 ‘혼’보다 개별 인격체를 가리키므로, 보편 조건을 살려 자연스러운 법문체로 옮겼습니다.
- source_word: תֹּאכַל כָּל דָּם
  english_pob_choice: who eats any blood
  chosen_korean: 어떤 피든지 먹으면
  alternatives_korean:
  - 피를 먹으면
  - 모든 피를 먹으면
  - 어떤 종류의 피든지 먹으면
  lexicon: WLC / HALOT
  rationale: כָּל דָּם은 총체적 ‘모든 피’보다 분배적 의미의 ‘어떤 피든지’가 자연스럽고, 동사는 일반법의 조건을 살려 ‘먹으면’으로 옮겼습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 끊어질 것입니다
  - 끊겨질 것입니다
  - 제명될 것입니다
  lexicon: HALOT
  rationale: ‘cut off’의 언약적 형벌 공식을 살리되, 구체적 방식은 본문이 말하지 않으므로 한국어에서도 단정적 해석어를 피했습니다.
- source_word: מֵעַמֶּיהָ
  english_pob_choice: from his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 그의 백성 가운데서
  - 그 백성에게서
  - 공동체에서
  lexicon: HALOT
  rationale: 히브리어는 נֶפֶשׁ의 문법상 여성형 접미를 쓰지만 대상은 일반 개인이므로, 성별을 드러내지 않는 관용적 표현으로 옮겼습니다.
theological_decisions:
- issue: כרת(‘cut off’) 형벌 공식의 범위
  chosen_reading: 공동체적 제명과 신적 심판 중 어느 하나로 단정하지 않고, ‘끊어질 것입니다’로 형식 자체를 보존했습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 공동체에서 제외될 것입니다
  - 하나님께서 멸하실 것입니다
  rationale: 본문은 형벌의 정확한 집행 방식이나 결과를 명시하지 않으므로, 번역이 해석을 선행해 긴장을 해소하지 않도록 했습니다.
  doctrine_reference: 형벌 공식의 의도적 모호성 보존
- issue: ‘피를 먹는’ 금지의 일반법 성격
  chosen_reading: 특정 상황이 아니라 일반적·지속적 금지로 읽히도록 조건문을 유지했습니다.
  alternative_readings:
  - 한 번이라도 피를 먹으면
  - 피를 먹는 자는
  rationale: 히브리어 관계절은 보편적 사례를 제시하는 법문 형식이므로, 현대 한국어에서도 일반 규범 문장으로 유지했습니다.
  doctrine_reference: 율법의 일반 규정 표현
