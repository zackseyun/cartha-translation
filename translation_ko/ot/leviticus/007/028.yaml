  rationale: 이 절은 단순 호칭이 아니라 시내 언약 맥락의 고유한 신명 사용이므로, POB의 신명 원칙을 따라 대체 칭호보다 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
