lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And ... spoke
  chosen_korean: 말씀하여
  alternatives_korean:
  - 말하여
  - 이르셨습니다
  lexicon: HALOT
  rationale: דבר는 단순한 '말하다'보다 공식적인 언설 개시를 드러내므로, 서술형 합쇼체에서 '말씀하여'로 옮겨 말씀-발화의 격식을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: Pob의 원칙에 따라 Tetragrammaton은 전통 대체어가 아니라 고유명 음역인 '야훼'로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 앞에
  lexicon: HALOT
  rationale: 말하는 대상의 방향을 나타내는 전치사는 한국어에서 자연스러운 여격 '에게'로 처리했습니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 라고 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 לֵאמֹר는 직접화법을 여는 표지이므로, 한국어에서는 중복된 '말하다' 반복을 피하면서도 담화 전환을 드러내는 '이르셨습니다'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 표기
  chosen_reading: 본문의 יְהוָה를 '야훼'로 직역했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 단순 호칭이 아니라 시내 언약 맥락의 고유한 신명 사용이므로, POB의 신명 원칙을 따라 대체 칭호보다 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
