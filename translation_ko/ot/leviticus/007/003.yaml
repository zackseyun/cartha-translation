source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
  footnotes:
  - marker: a
    text: Or 'shall offer.' The Hebrew verb can denote presenting or offering a sacrificial portion.
    reason: lexical_alternative
  - marker: b
    text: That is, the sheep's fatty tail, a specific sacrificial fat portion.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 제물에서 모든 기름을 가져다가 드려야 합니다. 곧 기름진 꼬리와 내장을 덮는 기름입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바쳐야 합니다’. 히브리어 동사는 제물의 일부를 제의적으로 바치거나 가까이 가져오는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 양의 지방이 많은 꼬리, 제사에서 따로 구별되는 특정 부위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵת כָּל חֶלְבּוֹ / אֵת הַחֵלֶב
  english_pob_choice: all its fat / the fat
  chosen_korean: 그 기름을 모두
  alternatives_korean:
  - 모든 지방을
  - 모든 기름진 부분을
  lexicon: HALOT
  rationale: 제사 문맥의 חֵלֶב은 일반적인 ‘지방’보다 제의적으로 구별된 ‘기름’을 뜻하므로, POB의 ‘fat’을 살려 ‘기름’으로 옮겼습니다. ‘모든’은 כָּל의 전체성을 반영합니다.
- source_word: יַקְרִיב
  english_pob_choice: shall present
  chosen_korean: 바쳐야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: הִפְעִיל형 קרב은 제사법에서 하나님께 제물을 ‘가까이 가져다 드리다/바치다’의 뜻이므로, 예배적 행위를 분명히 하는 ‘바치다’를 택했습니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from it
  chosen_korean: 그 사람에게서
  alternatives_korean:
  - 그것에서
  - 그에게서
  lexicon: HALOT
  rationale: 문맥상 대명사 접미사는 제물 자체가 아니라 제물을 바치는 사람을 가리키므로, 한국어에서는 참조 대상을 분명히 하여 ‘그 사람에게서’로 풀었습니다.
- source_word: הָאַלְיָה
  english_pob_choice: the fat tail
  chosen_korean: 기름진 꼬리
  alternatives_korean:
  - 지방꼬리
  - 비대한 꼬리
  lexicon: HALOT
  rationale: אַלְיָה는 양의 지방이 많은 꼬리, 곧 제의적으로 취급되는 특정 부위이므로 단순한 ‘꼬리’보다 ‘기름진 꼬리’가 의미를 잘 드러냅니다.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  english_pob_choice: the fat that covers the entrails
  chosen_korean: 내장을 덮는 기름
  alternatives_korean:
  - 내장을 덮는 지방
  - 창자를 덮는 기름
  lexicon: HALOT
  rationale: קֶרֶב은 내장/창자, 즉 장기들을 가리키며, ‘덮는’ 관계를 직역해 제사 동물의 해부학적 구성을 유지했습니다. ‘내장’은 현대 한국어에서 자연스럽고 구체적입니다.
