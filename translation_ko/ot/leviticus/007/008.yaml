translation:
  language: ko
  text: 제사장이 한 사람의 번제물을 드리면, 그가 드린 번제물의 가죽은 제사장의 몫이 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּקְרִיב / הִקְרִיב
  english_pob_choice: presents / has presented
  chosen_korean: 드리면 / 그가 드린
  alternatives_korean:
  - 바치면 / 그가 바친
  - 제시하면 / 그가 제시한
  lexicon: HALOT
  rationale: קרב의 제의적 의미를 살려 제물을 하나님께 ‘드리다’로 옮기고, 완료된 행위는 ‘그가 드린’으로 자연스럽게 반영했습니다.
- source_word: עֹלַת אִישׁ
  english_pob_choice: a man's burnt offering
  chosen_korean: 한 사람의 번제물
  alternatives_korean:
  - 한 남자의 번제물
  - 어떤 사람의 번제물
  lexicon: HALOT
  rationale: 히브리어의 단수 남성 אִישׁ을 과도하게 일반화하지 않되, 한국어에서는 남성성보다 ‘한 사람’이 문맥상 더 자연스러워 그렇게 옮겼습니다.
- source_word: עֹור הָעֹלָה
  english_pob_choice: the skin of the burnt offering
  chosen_korean: 번제물의 가죽
  alternatives_korean:
  - 번제물의 피부
  - 번제물의 가죽껍질
  lexicon: HALOT
  rationale: עֹור는 동물의 피부/가죽을 가리키므로, 현대 한국어에서 가장 자연스럽고 제의 문맥에도 맞는 ‘가죽’을 선택했습니다.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  english_pob_choice: shall have it for himself
  chosen_korean: 제사장의 몫이 됩니다
  alternatives_korean:
  - 제사장이 자기 것으로 가집니다
  - 제사장에게 속하게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 소유 구문을 한국어 관용에 맞게 풀어, ‘그 제사장의 몫’이라는 배분 의미를 분명히 했습니다.
theological_decisions:
- issue: 제의적 소유권의 표현
  chosen_reading: 제사장의 몫이 됩니다
  alternative_readings:
  - 제사장이 그것을 가집니다
  - 그것은 제사장에게 속합니다
  rationale: 본문은 단순 보유보다 제의적 배분을 말하므로, 제사장에게 돌아가는 몫이라는 뜻을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5
