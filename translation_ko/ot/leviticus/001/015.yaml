id: LEV.1.15
reference: Leviticus 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
  footnotes:
  - marker: a
    text: Or 'wring off its head'; the Hebrew verb is a technical term for the priestly killing of a bird offering.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on the wall of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장은 그것을 제단으로 가져가서 그 머리를 집어 떼고[a] 제단 위에서 불사르며, 그 피는 제단의 옆면에[b] 짜내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 머리를 비틀어 떼어’. 히브리어 동사는 새 제물을 죽이는 데 쓰이는 제사장의 기술 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제단의 벽에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  english_pob_choice: shall bring it
  chosen_korean: 그것을 제단으로 가져오고
  alternatives_korean:
  - 그것을 제단에 바치고
  - 그것을 제단 앞에 데리고 가고
  lexicon: HALOT
  rationale: קרב의 핵심은 ‘가까이 데려오다/가져오다’이므로, 제단을 향한 실제 이동을 드러내는 표현을 택했습니다.
- source_word: וּמָלַק
  english_pob_choice: pinch off
  chosen_korean: 그 머리를 집어 떼어
  alternatives_korean:
  - 그 머리를 비틀어 떼어
  - 그 머리를 비껴 떼어
  lexicon: HALOT
  rationale: 제사장에게 특수한 새 제물 처리 동작을 가리키므로, 단순한 ‘자르다’보다 손동작이 느껴지는 표현으로 옮겼습니다.
- source_word: וְהִקְטִיר
  english_pob_choice: burn it
  chosen_korean: 불사르며
  alternatives_korean:
  - 연기되게 하며
  - 향기롭게 올리며
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘연기 나게 태우다’의 기능을 한국어에서 가장 자연스럽게 드러내는 동사를 택했습니다.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  english_pob_choice: on the side of the altar
  chosen_korean: 제단의 옆면에
  alternatives_korean:
  - 제단의 벽에
  - 제단의 측면에
  lexicon: HALOT
  rationale: קיר의 문자적 ‘벽’보다 제단의 위치를 한국어로 자연스럽게 전달하는 ‘옆면’을 본문에 두고, 직역 가능성은 주석 없이도 충분히 보존된다고 보았습니다.
theological_decisions:
- issue: 제물 처리 동작의 제의적·기술적 성격
  chosen_reading: 새의 머리를 ‘집어 떼어’ 제단에서 불사르는 제사장 행위를 직설적으로 유지했습니다.
  alternative_readings:
  - ‘목을 비틀어’
  - ‘머리를 꺾어’
  rationale: 본문은 새 번제의 제의 절차를 기술하므로, 동작의 구체성을 흐리는 완곡한 표현보다 절차성을 살리는 번역이 더 적절합니다.
  doctrine_reference: 레위기 제의 규정의 절차적 정확성
- issue: 혈액 처리의 방향성
  chosen_reading: 피가 제단의 옆면에 ‘흘려야 합니다’로 능동적 지시를 살렸습니다.
  alternative_readings:
  - ‘쏟아야 합니다’
  - ‘뿌려야 합니다’
  rationale: נמצה의 수동적 결과를 한국어에서는 행위 규정의 문체에 맞게 ‘흘려야 합니다’로 옮겨, 제사장의 책임 있는 집행을 드러냈습니다.
  doctrine_reference: 제의 규례의 명령형/절차형 서술
