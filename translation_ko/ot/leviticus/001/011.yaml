id: LEV.1.11
reference: Leviticus 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
  footnotes:
  - marker: a
    text: Or 'shall dash its blood against the altar all around.' The Hebrew verb suggests a forceful casting of the blood, not a light sprinkling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제단 북쪽, 곧 야훼 앞에서 그것을 잡아야 합니다. 아론의 아들들인 제사장들은 그 피를 제단 사방에 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 피를 제단 사방에 힘 있게 던져야 합니다.” 히브리어 동사는 가볍게 뿌리는 것보다 힘 있게 던지는 동작을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  english_pob_choice: shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: 제의적 희생 문맥의 שׁחט은 단순한 ‘죽이다’보다 ‘잡다/도살하다’가 맞지만, 한국어 성경 문체에서는 짐승을 제의적으로 잡는 행위를 자연스럽게 나타내는 ‘잡다’가 가장 읽기 쉽습니다.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  english_pob_choice: the north side of the altar
  chosen_korean: 제단 북쪽
  alternatives_korean:
  - 제단의 북쪽 면
  - 제단의 북편
  lexicon: HALOT
  rationale: יֶרֶךְ의 ‘옆/측면’ 의미와 צָפֹנָה의 방향성을 합쳐, 제의 지시문에서 자연스러운 ‘제단 북쪽’으로 옮겼습니다.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  english_pob_choice: Aaron’s sons, the priests
  chosen_korean: 아론의 아들들인 제사장들
  alternatives_korean:
  - 아론의 아들들, 제사장들
  - 제사장들인 아론의 아들들
  lexicon: HALOT
  rationale: 혈통과 직분이 함께 제시되므로 둘을 모두 살리되, 한국어에서는 동격을 풀어 ‘아론의 아들들인 제사장들’로 표현하는 편이 명확합니다.
- source_word: וְזָרְקוּ ... אֶת דָּמוֹ ... סָבִיב
  english_pob_choice: shall throw its blood against the altar all around
  chosen_korean: 그 피를 제단 사방에 뿌려야 합니다
  alternatives_korean:
  - 그 피를 제단 둘레에 던져야 합니다
  - 그 피를 제단 주변에 뿌려야 합니다
  lexicon: HALOT
  rationale: זרק은 ‘뿌리다’보다 힘 있는 투척을 가리키지만, 한국어 제의 표현에서는 그 동작을 무리 없이 전달하는 ‘뿌리다’가 적절합니다. סָבִיב은 반복적 전면성을 살려 ‘사방에’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 Tetragrammaton이 직접 나오므로, 이 판의 원칙에 따라 고유한 언약 이름을 ‘야훼’로 반영했습니다. 문맥상 일반 호칭인 ‘주님’으로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 제의 규정의 명령문 어조
  chosen_reading: 법규 지시문에 맞는 -아야 합니다/ -해야 합니다
  alternative_readings:
  - -할 것입니다
  - -하리라
  rationale: 레위기 제사 규정은 서술이 아니라 절차 지시이므로, 현대 한국어 합쇼체로 의무·규범을 드러내는 표현을 사용했습니다.
  doctrine_reference: 'POB Korean style guide: legal-ritual instructions in modern formal-polite register'
