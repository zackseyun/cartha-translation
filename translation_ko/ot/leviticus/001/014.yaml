source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: ko
  text: 그리고 만일 그의 예물로 야훼께 드리는 번제물이 새에서 나오는 것이라면, 그는 산비둘기들 가운데서나 새끼 비둘기들 가운데서 그의 예물을 가져와야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן הָעוֹף
  english_pob_choice: from the birds
  chosen_korean: 새에서 나오는 것
  alternatives_korean:
  - 새들 가운데서
  - 날짐승에서
  lexicon: HALOT
  rationale: 제물 규정의 문맥에서 עוֹף는 일반적인 ‘새’를 가리키므로, 현대 한국어에서 분명한 ‘새’로 옮기되 제물의 출처를 살려 ‘나오는 것’으로 표현했습니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 올라가는 제물
  lexicon: HALOT
  rationale: עֹלָה의 정규 제의 용어는 ‘번제’이지만, 한국어 문장에서는 명사형 ‘번제물’이 자연스럽고 제물 문맥을 분명히 드러냅니다.
- source_word: וְהִקְרִיב
  english_pob_choice: then he shall present
  chosen_korean: 그는 … 가져와야 합니다
  alternatives_korean:
  - 그는 … 드려야 합니다
  - 그는 … 바쳐야 합니다
  lexicon: HALOT
  rationale: הקריב의 핵심은 제물을 ‘가까이 가져와 바치다’는 제의적 행위이므로, 한국어에서는 ‘가져와야 합니다’로 옮겨 제의적 동작을 살렸습니다.
- source_word: מִן הַתֹּרִים ... מִן בְּנֵי הַיּוֹנָה
  english_pob_choice: from the turtledoves ... from the young pigeons
  chosen_korean: 산비둘기들 가운데서나 새끼 비둘기들 가운데서
  alternatives_korean:
  - 집비둘기들 가운데서나 어린 비둘기들 가운데서
  - 산비둘기나 어린 비둘기 가운데서
  lexicon: HALOT
  rationale: תורים는 통상 ‘산비둘기’로, בני היונה는 ‘어린/새끼 비둘기’로 이해되므로, 제물의 허용 범위를 분명히 하면서도 반복되는 מן을 한국어 조사로 자연스럽게 풀었습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본 문맥의 יהוה는 본문에 직접 나온 신명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 원문 고유성을 유지했습니다.
theological_decisions:
- issue: 여호와/주님이 아닌 יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 제의 규정 가운데 신명사 יהוה를 직접 사용하므로, 전통적 치환어보다 고유 이름을 드러내는 번역이 원문 의미와 경계를 더 정확히 보존합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
