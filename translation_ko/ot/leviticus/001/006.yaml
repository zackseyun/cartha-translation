translation:
  language: ko
  text: 그는 번제물의 가죽을 벗기고, 그것을 여러 조각으로 잘라야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번제물의 가죽을 벗겨 내고’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 제물을 그 부분들, 곧 여러 조각으로 나누어 자르는 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  english_pob_choice: shall skin
  chosen_korean: 가죽을 벗기고
  alternatives_korean:
  - 잡아벗기고
  - 벗겨내고
  - 가죽을 벗기며
  lexicon: HALOT
  rationale: 제사 문맥에서 পশ의 가죽을 제거하는 동작이므로, 현대 한국어로는 ‘가죽을 벗기다’가 가장 직접적이고 자연스럽습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 번제 희생
  lexicon: HALOT
  rationale: עֹלָה의 제의적 용례를 살리면서 한국어에서 이해가 쉬운 기본형으로 ‘번제물’을 택했습니다.
- source_word: וְנִתַּח ... לִנְתָחֶיהָ
  english_pob_choice: and cut it into its pieces
  chosen_korean: 그것을 그 조각들로 잘라야 합니다
  alternatives_korean:
  - 그것을 조각들로 나누어야 합니다
  - 그것을 그 절편들로 잘라야 합니다
  - 그것을 절단하여야 합니다
  lexicon: HALOT
  rationale: נתח는 제사용으로 동물을 분할하는 뜻이므로, 단순한 ‘나누다’보다 ‘조각들로 자르다’가 행위의 구체성과 제의적 분할을 함께 드러냅니다.
- source_word: וְ
  english_pob_choice: Then
  chosen_korean: 그리고
  alternatives_korean:
  - 그러면
  - 그다음
  lexicon: HALOT
  rationale: 앞 절의 절차를 잇는 연속 접속이므로, 한국어에서는 자연스러운 순차 연결로 처리했습니다.
theological_decisions:
- issue: 제의 절차의 구체성 유지
  chosen_reading: 번제물의 가죽을 벗기고, 그 몸을 제사용 조각으로 분할하는 절차를 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로 완화하여 번제를 준비하고
  - 제물을 손질하여
  rationale: 본문은 제사의 실제 절차를 규정하는 문장이라, 의미를 일반화하면 동작의 구체성과 제의적 엄격성이 약해집니다.
  doctrine_reference: 레위기 1장의 번제 규례
