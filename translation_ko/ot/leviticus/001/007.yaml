id: LEV.1.7
reference: Leviticus 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
  footnotes:
  - marker: a
    text: Or 'Aaron's sons the priesthood family shall place fire on the altar and set the wood in order on the fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들인 제사장들은 제단 위에 불을 두고, 그 불 위에 나무를 차례대로 놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나무를 차례대로 놓아야 합니다’는 히브리어 ערך의 제의적 의미를 반영한 번역이며, 문자적으로는 ‘나무를 정돈하여 놓다/순서대로 배열하다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  english_pob_choice: the sons of Aaron the priest
  chosen_korean: 아론의 아들들인 제사장들
  alternatives_korean:
  - 아론의 아들들
  - 아론 제사장의 아들들
  - 아론의 아들들인 제사장 계열
  lexicon: HALOT
  rationale: בהקשר의 제의 규정에서 ‘아론의 아들들’은 단순한 가족관계보다 제사장 직무를 맡은 집단을 가리키므로, 이를 풀어 ‘제사장들’로 드러냈습니다.
- source_word: וְנָתְנוּ ... אֵשׁ
  english_pob_choice: shall put fire
  chosen_korean: 제단 위에 불을 두고
  alternatives_korean:
  - 제단 위에 불을 놓고
  - 제단 위에 불을 두며
  - 제단 위에 불을 설치하고
  lexicon: HALOT
  rationale: נתן은 여기서 제의 행위로서 ‘두다/놓다’의 뜻이 자연스럽고, 한국어에서는 ‘불을 두다’가 제단 위에 불을 마련하는 절차를 가장 सीधे하게 전합니다.
- source_word: וְעָרְכוּ עֵצִים
  english_pob_choice: and arrange wood
  chosen_korean: 나무를 차례대로 놓아야 합니다
  alternatives_korean:
  - 나무를 배열해야 합니다
  - 나무를 정돈해야 합니다
  - 나무를 차례로 놓아야 합니다
  lexicon: HALOT
  rationale: ערך는 제의 문맥에서 ‘질서 있게 배열하다’의 의미가 강하므로, 단순한 배치보다 절차성과 순서를 살려 ‘차례대로 놓다’로 옮겼습니다.
- source_word: עַל הָאֵשׁ
  english_pob_choice: on the fire
  chosen_korean: 그 불 위에
  alternatives_korean:
  - 불 위에
  - 그 위에
  - 불에
  lexicon: HALOT
  rationale: 반복되는 전치사구를 한국어에서도 살려, 앞의 ‘불’과 뒤의 ‘그 불’을 대응시켜 제의 동작의 연속성을 유지했습니다.
theological_decisions:
- issue: 제사장 집단의 표기
  chosen_reading: ‘아론의 아들들인 제사장들’로 옮겨, 혈통 표현과 직무 표현을 함께 드러냈습니다.
  alternative_readings:
  - ‘아론의 아들들’
  - ‘아론 제사장의 아들들’
  rationale: 본문은 아론의 아들들을 단순 가족이 아니라 제의 직무를 수행하는 집단으로 규정하므로, 두 의미를 모두 보존하는 표현이 필요합니다.
  doctrine_reference: 제사장직과 성막 제의의 문맥 유지
- issue: ‘불을 두다’의 직역성
  chosen_reading: ‘불을 두고’로 옮겨, 제사 절차의 물리적 동작을 그대로 드러냈습니다.
  alternative_readings:
  - ‘불을 놓고’
  - ‘불을 설치하고’
  rationale: 본문은 상징적 표현이 아니라 제단에 불을 마련하는 실제 절차를 지시하므로, 의미를 완화하지 않는 직설적 표현을 택했습니다.
  doctrine_reference: 제의적 행위의 문자적 절차성
