  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'dash the blood' or, more traditionally, 'sprinkle the blood.' The Hebrew verb denotes throwing/tossing the blood in ritual application.
    reason: lexical_alternative
  - marker: b
    text: Literally 'son of the herd,' an idiom for a bovine animal; here rendered 'young bull.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 앞에서 그 수송아지[b]를 잡아야 합니다. 아론의 아들들, 곧 제사장들은 그 피를 가져와 제단 사방에 뿌려야 합니다[a]. 그 제단은 회막 입구에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 제의적으로 피를 ‘던져’ 적용하는 뜻을 지니며, 전통적으로는 ‘뿌리다’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בן הבקר은 문자적으로 ‘가축의 아들’이지만, 희생제의 문맥에서는 수송아지를 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  english_pob_choice: he shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 단순한 살해보다 희생제의 동작을 드러내는 표현이 필요해, 동물을 제의적으로 죽이는 뜻을 자연스럽게 살렸습니다.
- source_word: בֶּן הַבָּקָר
  english_pob_choice: the young bull
  chosen_korean: 어린 수송아지
  alternatives_korean:
  - 황소
  - 소 한 마리
  - 수소
  lexicon: HALOT
  rationale: 직역적이면서도 제의용 어린 소를 자연스럽게 드러내는 표현으로 옮겼습니다. 영어 POB의 'young bull' 취지를 반영했습니다.
- source_word: וְזָרְקוּ
  english_pob_choice: shall throw the blood / sprinkle the blood
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 던져야 합니다
  - 뿌리셔야 합니다
  - 살포해야 합니다
  lexicon: HALOT
  rationale: זרק의 핵심은 피를 제단에 제의적으로 적용하는 동작이므로, 한국어에서는 전통 교회어휘인 '뿌리다'가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  english_pob_choice: against the altar all around
  chosen_korean: 제단 둘레에
  alternatives_korean:
  - 제단 주위에
  - 제단에 둘러
  - 제단 전체에
  lexicon: HALOT
  rationale: סביב의 공간적 의미를 간결하게 살려, 피가 제단의 사방에 두루 적용됨을 전달했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이는 표준 대응어를 사용해 지명성과 문맥 연속성을 확보했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어 יְהוָה를 직접 가리키는 본문이므로, 프로젝트 기본 원칙에 따라 고유신명 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제의적 피 처리 동작의 번역
  chosen_reading: 뿌려야 합니다
  alternative_readings:
  - 뿌리셔야 합니다
  - 던져야 합니다
  - sprinkle의 관용적 대응
  rationale: 본문은 단순한 ‘살포’가 아니라 제단에 피를 적용하는 제의 행위를 말하므로, 전통적이면서도 स्रोत 의미를 훼손하지 않는 동작어를 택했습니다.
  doctrine_reference: Levitical sacrificial procedure
