  to: 그는 야훼 앞에서 그 수송아지[b]를 잡아야 합니다. 아론의 아들들, 곧 제사장들은 그 피를 가져와 제단 사방에 뿌려야 합니다[a]. 그 제단은 회막 입구에 있습니다.
