  source_fidelity: 원문의 제의 절차와 주어 구분은 대체로 잘 반영되었습니다. 다만 עַל הַמִּזְבֵּחַ סָבִיב은 피를 제단의 둘레/주변 땅에 뿌린다는 뜻으로 들리지 않도록 ‘제단 사방에’로 옮기는 것이 더 정확합니다. וְהִקְרִיבוּ의 ‘가져오다’도 유지하되, 피를 제단에 적용하는 행위와 자연스럽게 연결했습니다.
  naturalness: 합쇼체 문체는 적절합니다. 그러나 ‘제단 둘레에 뿌리다’는 현대 한국어에서 제단 주변에 뿌리는 것으로 이해될 수 있어, ‘제단 사방에 뿌리다’가 더 자연스럽고 정확합니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 독자가 무엇을 설명하는지 분명히 알 수 있습니다.
  terminology: ‘야훼’, ‘아론의 아들들, 곧 제사장들’, ‘회막’은 일관되고 적절합니다. ‘수송아지’는 בֶּן הַבָּקָר의 제의 문맥상 자연스러운 번역입니다. זרק은 물리적으로 던져 적용하는 뜻을 지니지만, 한국어 제의 문맥에서는 ‘뿌리다’가 자연스러우므로 각주에서 그 어휘적 뉘앙스를 밝혔습니다.
