source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'an offering by fire' or 'a fire offering' for 'a food offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a pleasing aroma'; the expression is a stock sacrificial formula indicating that the offering is acceptable to the LORD.
    reason: cultural_note
  - marker: c
    text: Or 'to Yahweh.' The main text follows the project default of rendering the divine name as 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그 내장과 그 다리를 물로 씻어야 합니다. 제사장은 그 모든 것을 제단 위에서 불살라 연기로 올려야 합니다. 이는 번제, 곧 화제[a], 야훼[c]께 드리는 기쁘게 하는 향기[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제’는 불로 드리는 제물을 가리키는 전통적 제의 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기쁘게 하는 향기’는 제물이 야훼께 받아들여짐을 나타내는 고정된 제의 표현입니다.
    reason: theological_note
  - marker: c
    text: 본문의 하나님의 이름 יְהוָה는 본 프로젝트 원칙에 따라 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: קִרְבּוֹ
  english_pob_choice: its entrails
  chosen_korean: 그 내장
  alternatives_korean:
  - 그 안쪽 부분
  - 그 속부분
  lexicon: HALOT
  rationale: 제의 문맥에서 동물의 내부 장기를 가리키므로, 한국어로는 구체적인 ‘내장’이 가장 자연스럽고 원문 의미도 분명하게 드러납니다.
- source_word: כְרָעָיו
  english_pob_choice: its legs
  chosen_korean: 그 다리
  alternatives_korean:
  - 그 정강이
  - 그 하퇴부
  lexicon: HALOT
  rationale: 제의 규정에서 짐승의 아래쪽 다리 부분을 뜻하므로, 현대 한국어에서는 직관적인 ‘다리’가 적절합니다.
- source_word: וְהִקְטִיר
  english_pob_choice: shall turn ... into smoke
  chosen_korean: 연기로 올려야 합니다
  alternatives_korean:
  - 불살라야 합니다
  - 연기와 함께 드려야 합니다
  lexicon: HALOT
  rationale: 단순히 ‘태우다’보다 제단 위로 바치는 제의적 동작을 살리기 위해 ‘연기로 올리다’를 택했습니다.
- source_word: אִשֵּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 제의적 불살김을 가리키는 용어를 살리되, 원문의 제의 공식성을 유지하기 위해 ‘화제’로 옮겼습니다.
- source_word: רֵיחַ נִיחוֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기쁘게 하는 향기
  - 만족스러운 향기
  lexicon: HALOT
  rationale: 이 관용구는 하나님의 후각을 말하기보다 제물이 받아들여짐을 나타내는 공식 표현이므로, 비유를 유지하는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: לַיהוָה의 신명기적 표기
  chosen_reading: 야훼께
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 본 프로젝트의 기본 원칙에 따라 하나님의 이름을 음역해, 제의 공식의 대상이 특정한 언약 이름을 지닌 분임을 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: רֵיחַ נִיחוֹחַ의 신학적 뉘앙스
  chosen_reading: 향기로운 냄새
  alternative_readings:
  - 기분 좋은 향기
  - 받으실 만한 향기
  rationale: 이 표현은 제물이 하나님께 합당하게 받아들여진다는 뜻이지, 하나님이 물리적 냄새를 필요로 한다는 뜻이 아니므로, 은유를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
