id: LEV.1.10
reference: Leviticus 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
  footnotes:
  - marker: a
    text: Or 'as a burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: '''Without blemish'' means free from physical defect, the required condition for this sacrifice.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 만일 그의 예물이 떼 가운데서 곧 양이나 염소 가운데서 번제물로 드려지는 것이라면, 그는 흠 없는 수컷을 드려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번제물로 드려지는 것’은 히브리어 לְעֹלָה의 문맥적 풀어쓰기입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수컷’은 제물 동물의 성별 요구를 직접 반영한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문을 자연스럽게 이어 주면서 גם/그리고의 연결성을 살렸습니다.
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 떼 가운데서
  alternatives_korean:
  - 가축 떼 가운데서
  - 양 떼 가운데서
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함하는 집합명사이므로, 뒤의 양/염소 구분을 살리기 위해 ‘떼’로 옮겼습니다.
- source_word: מִן הַכְּשָׂבִים אוֹ מִן הָעִזִּים
  english_pob_choice: from the sheep or from the goats
  chosen_korean: 곧 양이나 염소 가운데서
  alternatives_korean:
  - 양이나 염소 가운데서
  - 곧 어린양이나 염소 가운데서
  lexicon: HALOT
  rationale: ‘כְּשָׂבִים’과 ‘עִזִּים’의 범주 대비를 그대로 살리되, ‘곧’으로 flock의 구체화 관계를 자연스럽게 연결했습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로 드려지는 것
  alternatives_korean:
  - 번제물로
  - 번제 제물로
  lexicon: HALOT
  rationale: 희생 제의 용어 עֹלָה는 한국어 성경 전통의 ‘번제’로 옮기되, 문맥상 ‘~로 드려지는 것’으로 제물 자체를 문장에 맞게 풀었습니다.
- source_word: זָכָר תָּמִים
  english_pob_choice: a male without blemish
  chosen_korean: 흠 없는 수컷
  alternatives_korean:
  - 흠 없는 숫놈
  - 완전한 수컷
  lexicon: HALOT
  rationale: 제의적 요구사항인 성별과 결함 없음이 핵심이므로, ‘수컷’과 ‘흠 없는’으로 직접적이고 문맥에 맞게 옮겼습니다.
theological_decisions:
- issue: עֹלָה의 제의적 용어 선택
  chosen_reading: 번제물
  alternative_readings:
  - 번제
  - 번제 제물
  - 올라(직역)
  rationale: 이 문맥은 레위기 희생 규정이므로, 교회 용례에 익숙한 ‘번제’ 계열을 유지하되 ‘번제물로 드려지는 것’으로 문장 기능을 분명히 했습니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean, source-faithful cultic terminology)
- issue: זָכָר의 성별 명시
  chosen_reading: 수컷
  alternative_readings:
  - 수컷의
  - 남컷?
  rationale: 히브리어는 희생 동물의 성별을 명시하므로, 인간 중심의 성중립화 없이 동물 성별을 정확히 드러냈습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
