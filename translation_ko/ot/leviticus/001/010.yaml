revisions:
- from: 그리고 만일 그의 예물이 떼 가운데서 곧 양이나 염소 가운데서 번제물로 드려지는 것이라면, 그는 흠 없는 수컷을 드려야 합니다.[a][b]
  to: 또한, 만일 그가 번제로 드릴 예물이 양이나 염소 중에서 나온 것이라면, 그는 흠 없는[a] 수컷을 드려야 합니다.
  rationale: 원문의 제물 범주를 ‘양이나 염소 중에서’로 자연스럽게 옮기고, לְעֹלָה를 간결하게 ‘번제로’로 번역했습니다. 성별 및 무결점 요구는 그대로 유지했으며, 각주는 실제로 설명이 필요한 תָּמִים(‘흠 없는’)에만 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:28Z'
