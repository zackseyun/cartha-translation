  to: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희 가운데 한 사람이 야훼께 예물을 드리려거든, 너희의 예물은 가축, 곧 소 떼나 양과 염소 떼 가운데서 드려야 합니다.”
  rationale: 초안의 문장 구조와 격식은 유지하되, צֹאן의 포괄적 지시 대상(양과 염소)을 반영하도록 한 곳만 수정했습니다. 원문이나 영어 감사 기록에 있는 대안 독법은 한국어 본문에서 별도 각주를 요구할 만큼 의미상 미결적인 사항이 아니므로 각주를 추가하지 않았습니다.
