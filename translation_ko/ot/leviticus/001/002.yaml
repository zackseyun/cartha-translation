id: LEV.1.2
reference: Leviticus 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'anyone' or 'a person.' The Hebrew has 'a man' (adam) used here in a representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희 가운데 한 사람이 야훼께 예물을 드리려거든, 너희의 예물은 가축, 곧 소 떼나 양과 염소 떼 가운데서 드려야 합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 주소형을 살리되, 한국어 성경에서 자연스럽고 원문 구조를 드러내는 ‘이스라엘 자손’을 택했습니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 한 남자가
  - 누구든지
  - 한 개인이
  lexicon: HALOT
  rationale: 대표적 단수 사례법의 의미를 살리면서도 한국어에서는 성별을 굳이 전면화하지 않는 ‘한 사람이’가 원문 기능을 가장 자연스럽게 전달합니다.
- source_word: קָרְבָּן לַיהוָה
  english_pob_choice: an offering to Yahweh
  chosen_korean: 야훼께 예물
  alternatives_korean:
  - 야훼께 제물
  - 주님께 예물
  lexicon: HALOT
  rationale: קָרְבָּן의 넓은 의미를 ‘예물’로 옮겨 단순히 희생제사로 좁히지 않았고, יהוה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: הַבְּהֵמָה / הַבָּקָר / הַצֹּאן
  english_pob_choice: the livestock—from the herd or from the flock
  chosen_korean: 가축 곧 소 떼나 양 떼
  alternatives_korean:
  - 가축 곧 큰 가축이나 작은 가축
  - 가축 곧 소나 양
  lexicon: HALOT
  rationale: 상위 범주와 하위 범주를 함께 보이도록 ‘가축’ 뒤에 설명적 동격을 두고, ‘herd / flock’의 대응을 한국어의 ‘소 떼 / 양 떼’로 자연스럽게 드러냈습니다.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  english_pob_choice: you shall bring your offering
  chosen_korean: 너희의 예물은 … 드려야 합니다
  alternatives_korean:
  - 너희의 예물을 바쳐야 합니다
  - 너희 예물을 가져와야 합니다
  lexicon: HALOT
  rationale: 두 번째 복수 명령의 공동체적 지시를 한국어 의무 표현으로 옮기면서, 앞선 ‘드리다’와 연결해 제의적 헌납의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼로 직접 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 신적 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 번역어가 아니라 음역어로 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
- issue: 대표적 남성 단수 표현의 한국어 처리
  chosen_reading: ‘한 사람이’로 옮겨 대표적 단수성을 유지하되 성별을 불필요하게 강조하지 않았습니다.
  alternative_readings:
  - 한 남자가
  - 누구든지
  rationale: 히브리어 אָדָם의 사례법 기능은 살리면서, 한국어에서 본문 청중이 이해하기 쉬운 형태로 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
