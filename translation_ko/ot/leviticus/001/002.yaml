  revised_text: 이스라엘 자손에게 말하여 그들에게 이르십시오. “너희 가운데 한 사람이 야훼께 예물을 드리려거든, 너희의 예물은 가축, 곧 소 떼나 양과 염소 떼 가운데서 드려야 합니다.”
