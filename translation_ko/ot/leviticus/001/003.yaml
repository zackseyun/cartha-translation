  source_fidelity: 본문의 ‘가축 떼’는 히브리어 מִן־הַבָּקָר(소, 곧 소 떼/소류)를 지나치게 넓힌 표현입니다. 또한 לִרְצֹנוֹ는 제사자가 여호와 앞에서 받아들여짐을 나타내는 것으로 옮길 수 있으나, 현재의 ‘받아들여지게 하셔야 합니다’는 히브리어에 없는 높임과 부자연스러운 사역을 더합니다.
  naturalness: ‘소 떼에서 드리는 번제’와 ‘그가 여호와 앞에서 받아들여지도록’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 반복된 ‘드리다’도 보존합니다. ‘회막 어귀’는 안정된 제의 용어입니다.
  terminology: ‘번제’, ‘흠 없는 수컷’, ‘회막’, ‘여호와’는 적절합니다. מִן־הַבָּקָר는 ‘소 떼에서’로 특정해야 합니다. 각주에는 받아들여짐 해석과 전통적인 자원 해석의 실제 대안을 제시합니다.
