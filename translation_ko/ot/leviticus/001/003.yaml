revisions:
- from: 그의 제물이 번제이면, 곧 가축 떼에서 드리는 제물이면, 흠 없는 수컷을 드려야 합니다. 회막 어귀에서 그것을 드려 여호와 앞에서 그가 받아들여지게 하셔야 합니다.[a]
  to: 그의 제물이 소 떼에서 드리는 번제라면, 그는 흠 없는 수컷을 드려야 합니다. 그는 회막 어귀에서 그것을 드려, 그가 여호와 앞에서 받아들여지도록 해야 합니다.[a]
  rationale: 히브리어의 소류 지시어를 ‘소 떼’로 바로잡고, לִרְצֹנוֹ의 주된 ‘받아들여짐’ 해석은 본문에 유지했습니다. 다만 사역·높임을 제거하여 원문의 목적 용법을 자연스럽게 옮겼으며, 오래된 ‘자원하여’ 해석은 각주로 보존했습니다.
