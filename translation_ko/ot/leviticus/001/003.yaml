id: LEV.1.3
reference: Leviticus 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
  footnotes:
  - marker: a
    text: Or 'that he may be accepted before the LORD'; traditionally, 'of his own free will before the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 제물이 소 떼에서 드리는 번제라면, 그는 흠 없는 수컷을 드려야 합니다. 그는 회막 어귀에서 그것을 드려, 그가 여호와 앞에서 받아들여지도록 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 여호와 앞에서 자원하여’.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 완전 번제
  - 불살라 드리는 제사
  lexicon: HALOT
  rationale: 제의 문맥에서 עֹלָה는 이미 정착된 제사 용어이므로, 한국어도 간명한 표준 대응인 ‘번제’를 사용했습니다.
- source_word: מִן הַבָּקָר
  english_pob_choice: from the herd
  chosen_korean: 가축 떼에서 드리는 제물
  alternatives_korean:
  - 소 떼에서
  - 가축에서
  lexicon: HALOT
  rationale: 직역하면 ‘소 떼에서’에 가깝지만, 여기서는 제물의 출처를 자연스럽게 드러내기 위해 ‘가축 떼에서 드리는 제물’로 옮겼습니다.
- source_word: זָכָר תָּמִים
  english_pob_choice: a male without blemish
  chosen_korean: 흠 없는 수컷
  alternatives_korean:
  - 결점 없는 수컷
  - 온전한 수컷
  lexicon: HALOT
  rationale: 동물 제사의 성별·무결함 요구를 함께 보존하기 위해 ‘흠 없는 수컷’으로 간결하게 표현했습니다.
- source_word: לִרְצֹנוֹ
  english_pob_choice: that he may be accepted
  chosen_korean: 그가 받아들여지게 하셔야 합니다
  alternatives_korean:
  - 그를 받아주시게 하셔야 합니다
  - 그의 받아들여짐을 위해
  lexicon: HALOT
  rationale: 이 구절의 핵심은 제사가 여호와 앞에서 받아들여지는 상태이므로, 결과를 드러내는 수동적 표현으로 번역했습니다. 의지적 의미 가능성은 본문에 억지로 밀어넣지 않았습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB가 이 절에서 the LORD를 사용하고 있으므로, 기존 출판용 한국어 관행과의 정합성을 위해 본문은 ‘여호와’로 두었습니다.
  doctrine_reference: 'project glossary: YHWH rendering in Korean draft'
- issue: לִרְצֹנוֹ의 해석적 긴장
  chosen_reading: 여호와 앞에서 그가 받아들여지게 하셔야 합니다
  alternative_readings:
  - 그의 자원함을 따라
  - 그가 기쁘게 받아들여지도록
  rationale: 히브리어는 ‘받아들여짐’과 ‘자원함’의 가능성을 함께 지니지만, 제의 문맥에서는 우선적으로 제물이/제사자가 받아들여지는 의미가 자연스럽습니다. 본문에는 그 의미를 두고, 자원함 해석은 본문 밖으로 미루었습니다.
  doctrine_reference: 'Translation philosophy: preserve documented ambiguity rather than collapsing it'
