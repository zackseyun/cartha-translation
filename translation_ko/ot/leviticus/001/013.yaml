id: LEV.1.13
reference: Leviticus 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 내장과 다리를 물로 씻어야 합니다. 그리고 제사장은 그 전부를 바쳐 제단 위에서 불살라야 합니다. 그것은 번제, 곧 화제[a]이며, 야훼께 드리는 향기로운 냄새입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불로 드리는 제물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  english_pob_choice: the entrails
  chosen_korean: 내장
  alternatives_korean:
  - 창자
  - 속부분
  lexicon: HALOT
  rationale: 제사 문맥에서 짐승의 내부 장기를 가리키므로, 현대 한국어로는 구체적이고 자연스러운 ‘내장’이 가장 직접적입니다.
- source_word: וְהַכְּרָעַיִם
  english_pob_choice: the legs
  chosen_korean: 다리
  alternatives_korean:
  - 종아리
  - 아랫다리
  lexicon: HALOT
  rationale: 희생제물의 사지, 특히 아래쪽 다리를 가리키므로 기본적이고 분명한 ‘다리’로 옮겼습니다.
- source_word: וְהִקְטִיר
  english_pob_choice: turn it into smoke
  chosen_korean: 불살라야 합니다
  alternatives_korean:
  - 연기로 올려야 합니다
  - 태워야 합니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 태우는 것이 아니라 제단 위에서 제물을 연기로 올리는 제의적 행위를 뜻하므로, 한국어 성경 전통과 본문의 제의적 기능을 함께 살리는 표현을 택했습니다.
- source_word: אִשֵּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불로 드린 제물
  lexicon: HALOT
  rationale: 영어 본문이 각주에서 드러내듯 문자적으로는 ‘불로 드리는 제물’의 뜻이 있으므로, 한국어 본문에서는 제의 용어로 굳어진 ‘화제’를 사용하고, 본문 뒤에 번제와 병렬된 별칭으로 표시했습니다.
- source_word: רֵיחַ נִיחֹחַ לַיהוָה
  english_pob_choice: a pleasing aroma, to Yahweh
  chosen_korean: 야훼께 향기로운 냄새
  alternatives_korean:
  - 야훼께 기쁘게 하는 향기
  - 야훼께 기분 좋은 향기
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직역하되, 하나님이 실제로 냄새를 맡는다는 의미로 축소하지 않고 제물이 야훼께 받아들여지는 이미지를 살리기 위해 ‘향기로운 냄새’로 옮겼습니다.
theological_decisions:
- issue: רֵיחַ נִיחֹחַ의 의인화된 제의 언어
  chosen_reading: 야훼께 향기로운 냄새
  alternative_readings:
  - 야훼께 기쁘게 하는 향기
  - 야훼께 즐거운 냄새
  rationale: 본문의 감각적 이미지를 보존하되, 그것을 하나님의 생리적 반응으로 오해하지 않도록 수용 가능성과 기쁨의 의미를 함께 드러냈습니다.
  doctrine_reference: Translation philosophy §3
- issue: אִשֵּׁה의 제의적 용어 처리
  chosen_reading: 화제
  alternative_readings:
  - 불로 드리는 제물
  - 불제
  rationale: ‘화제’는 한국어 성경에서 제의적 범주를 간결하게 드러내는 전통적 용어로, 본문의 번제 설명과 함께 읽을 때 불로 드리는 제물이라는 의미를 유지합니다.
  doctrine_reference: Translation philosophy §6
