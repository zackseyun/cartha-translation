base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
  footnotes:
  - marker: a
    text: Or 'the suet' or 'the fatty covering'; the Hebrew term refers to a fatty portion of the animal used in the offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들인 제사장들이 그 조각들과 머리와 기름을 제단 위에 있는 불 위의 나무에 가지런히 놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름’은 여기서 제물에 붙은 지방 부분을 가리킬 수 있습니다. 정확한 해부학적 범주는 다소 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  english_pob_choice: shall arrange
  chosen_korean: 가지런히 놓아야 합니다
  alternatives_korean:
  - 정렬해야 합니다
  - 차례대로 놓아야 합니다
  lexicon: HALOT
  rationale: 제사 규례의 절차성을 살리면서, העrך의 ‘배열하다/차려놓다’ 의미를 한국어에서 자연스럽게 드러내기 위해 ‘가지런히 놓다’를 택했습니다.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  english_pob_choice: Aaron’s sons, the priests
  chosen_korean: 아론의 아들들인 제사장들
  alternatives_korean:
  - 아론의 아들들, 제사장들
  - 아론의 아들들인 그 제사장들
  lexicon: HALOT
  rationale: ‘아론의 아들들’과 ‘제사장들’의 동격 관계를 한국어에서 ‘-인’으로 분명히 하여, 단순한 소속이 아니라 제사장 신분을 밝히게 했습니다.
- source_word: הַפָּדֶר
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 수태
  - 비계
  lexicon: HALOT
  rationale: 이 단어는 제물의 특정 지방 부분을 가리키지만, 한국어에서는 제의적 문맥에서 가장 자연스럽고 간명한 대응인 ‘기름’을 사용했습니다. POB의 영어 각주가 지적하듯 정확한 해부학적 범주는 다소 유동적입니다.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  english_pob_choice: that is on the fire that is on the altar
  chosen_korean: 제단 위의 불 위에 있는
  alternatives_korean:
  - 제단 위 불 위에 있는
  - 제단 위에 있는 불 위의
  lexicon: HALOT
  rationale: 히브리어의 중첩된 관계절 구조를 너무 매끈하게 바꾸지 않고, ‘불 위에 있는—제단 위의’라는 층위를 살려 절차적·공간적 질서를 보존했습니다.
theological_decisions:
- issue: 제사 규정의 기술적·절차적 표현 유지
  chosen_reading: 명령형 규례 문장을 현대 한국어의 ‘-아야 합니다’로 옮겨, 규정의 권위와 절차성을 유지했습니다.
  alternative_readings:
  - ‘놓습니다’로 서술형화
  - ‘놓으십시오’로 직접 명령화
  rationale: 레위기 제사 지침은 단순 서술이 아니라 규범적 지시이므로, 현대 문체에서 가장 자연스러운 규정형으로 표현했습니다.
  doctrine_reference: 율법 본문의 규범성
