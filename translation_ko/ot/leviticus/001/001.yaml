  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
  footnotes:
  - marker: a
    text: Or 'Yahweh.' The Hebrew has the divine name יְהוָה.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 야훼께서 회막에서 모세를 부르시고 그에게 다음과 같이 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 부르시고
  alternatives_korean:
  - 불러
  - 호출하시고
  lexicon: HALOT
  rationale: 문맥상 하나님의 시작 발화로서 단순한 ‘말하다’보다 ‘부르다’가 מתאים하며, 합쇼체 서술로는 ‘부르시고’가 자연스럽습니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 다음 절의 직접 인용을 여는 공식적 신적 발화 표현으로 ‘말씀하셨습니다’가 가장 자연스럽고, וַיִּקְרָא와의 반복을 피합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유신명사 יְהוָה를 관습적 대치어가 아닌 음역형 ‘야훼’로 옮겨, 원문의 개인명성과 POB의 원어 직역 원칙을 반영합니다.
- source_word: מֵאֹהֶל מוֹעֵד
  english_pob_choice: from the tent of meeting
  chosen_korean: 회막에서
  alternatives_korean:
  - 만남의 장막에서
  - 회중의 장막에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד의 표준 성막 명칭을 한국어 성경의 확립된 표현인 ‘회막’으로 옮기되, ‘from’의 출처 의미는 조사 ‘-에서’로 살렸습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 일반 호칭이 아니라 언약적 고유명사를 사용하므로, 제목어 ‘주’로 완화하지 않고 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
