  - severity: medium
    issue: “그祭司”, “그祭司은” 표기 및 문법 오류가 있습니다.
    rationale: 표준 현대 한국어와 합쇼체 문체에 맞지 않으며, ‘제사장’으로 표기해야 합니다.
