id: LEV.1.17
reference: Leviticus 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'an offering by fire' or 'a fire offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 날개를 따라 찢되, 완전히 나누지는 말아야 합니다. 제사장은 그것을 제단 위, 불 위에 놓인 나무 위에서 불살라야 합니다. 그것은 번제이며, 불로 드리는 제물[a]이고, 야훼께 향기로운 냄새입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁסַּע
  english_pob_choice: tear it open
  chosen_korean: 찢되
  alternatives_korean:
  - 갈라 놓되
  - 찢어 놓되
  lexicon: HALOT
  rationale: 제물을 물리적으로 가르는 동작을 간결하게 살리되, 다음 절반과의 대비를 위해 동작의 강도를 유지했습니다.
- source_word: בִכְנָפָיו
  english_pob_choice: by its wings
  chosen_korean: 날개 쪽으로
  alternatives_korean:
  - 날개로
  - 날개를 따라
  lexicon: HALOT
  rationale: ‘날개’ 주변을 기준으로 찢는 위치를 자연스럽게 드러내며, 한국어에서 ‘by’의 도구/위치감을 무리 없이 반영합니다.
- source_word: וְהִקְטִיר
  english_pob_choice: shall burn it
  chosen_korean: 불살라야 합니다
  alternatives_korean:
  - 불로 드려야 합니다
  - 연기로 올려야 합니다
  lexicon: HALOT
  rationale: 제단에서의 제의적 소각을 분명히 하면서도, 독자가 즉시 이해할 수 있는 현대적 표현을 선택했습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 불태우는 제물
  lexicon: HALOT
  rationale: 레위기 제의 용어로 굳어진 표준 대응어이므로, 제사 규정의 기술적 용어를 유지했습니다.
- source_word: אִשֵּׁה
  english_pob_choice: a food offering
  chosen_korean: 불로 드리는 제물
  alternatives_korean:
  - 화제
  - 불제
  lexicon: HALOT
  rationale: 영어 본문이 각주에서 ‘offering by fire’ 가능성을 열어 두므로, ‘불로 드리는’으로 제의적 성격을 직접 드러냈습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 기쁜 향기
  alternatives_korean:
  - 향기로운 기쁨
  - 기쁘게 받으시는 향기
  lexicon: HALOT
  rationale: 하나님께 받아들여짐을 뜻하는 관용구의 핵심을 살리되, 한국어에서 다소 생경한 ‘향기’ 이미지를 보존했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 프로젝트 기본 용례에 따라 여호와 대신 학술적 음역 ‘야훼’를 사용해 언약 নাম을 직접 반영했습니다.
theological_decisions:
- issue: אִשֵּׁה의 제의적 의미를 한국어에서 어떻게 살릴지
  chosen_reading: ‘불로 드리는 제물’로 옮겨 화제(불로 드림)와 제물의 두 요소를 함께 드러냈습니다.
  alternative_readings:
  - 화제
  - 불제물
  rationale: 영어 본문도 본문에는 ‘food offering’을 두되 각주에서 ‘offering by fire’ 가능성을 밝혀 두므로, 한국어 본문에서는 제의적 소각을 명시하는 쪽이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: readable modern Korean, not ecclesiastical archaism'
