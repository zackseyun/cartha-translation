  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
  footnotes:
  - marker: a
    text: Hebrew bird names in this list are not always identifiable with certainty. 'The eagle' may refer more broadly to a large raptor or even a vulture.
    reason: lexical_alternative
  - marker: b
    text: Or 'lammergeier' for 'bearded vulture.' Older English versions often have 'ossifrage.'
    reason: lexical_alternative
  - marker: c
    text: The identification of this bird is uncertain. Older translations often read 'osprey'; some suggest a kind of eagle or vulture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 새들을 따라서는 이것들을 너희가 가증한 것으로 여겨야 합니다. 그것들은 먹을 수 없습니다. 그것들은 가증한 것입니다. 독수리와, 솔개와, 검은솔개입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  english_pob_choice: you shall regard as detestable
  chosen_korean: 가증한 것으로 여겨야 합니다
  alternatives_korean:
  - 가증하게 여겨야 합니다
  - 역겨운 것으로 여겨야 합니다
  - 혐오해야 합니다
  lexicon: HALOT
  rationale: 의례·음식 규정 문맥에서 단순 감정보다 ‘부정하고 기피할 대상으로 판단하다’는 뜻을 살려, 평가적 의미를 가진 표현으로 옮겼습니다.
- source_word: מִן הָעֹוף
  english_pob_choice: from among the birds
  chosen_korean: 새들을 따라서는
  alternatives_korean:
  - 새들 가운데
  - 새들 중에서
  - 날짐승들 가운데
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살리면서도, 목록 서두의 분류 표지로 자연스럽게 들리도록 한국어에서는 ‘새들을 따라서는’으로 풀었습니다.
- source_word: שֶׁקֶץ הֵם
  english_pob_choice: they are detestable
  chosen_korean: 그것들은 가증한 것입니다
  alternatives_korean:
  - 그것들은 가증합니다
  - 그것들은 부정한 것입니다
  - 그것들은 혐오스러운 것입니다
  lexicon: HALOT
  rationale: 앞선 동사와 어근이 겹치므로, 동일한 평가를 반복해 법적 금지의 강도를 유지했습니다. ‘부정한’은 정결/부정의 다른 어휘로 의미가 좁아질 수 있어 피했습니다.
- source_word: הַנֶּשֶׁר / הַפֶּרֶס / הָעָזְנִיָּה
  english_pob_choice: the eagle / the vulture / the black vulture
  chosen_korean: 독수리와, 솔개와, 검은솔개
  alternatives_korean:
  - 독수리와, 독수리수리와, 검은솔개
  - 독수리와, 박쥐수리와, 검은솔개
  - 독수리와, 수리와, 검은솔개
  lexicon: HALOT
  rationale: 세 새 이름은 정확한 종 식별이 모두 확실하지 않지만, 문맥상 맹금류·사체성 조류 목록으로 이해하는 것이 적절합니다. 한국어 본문은 너무 세분화하지 않고 통용되는 조류명으로 옮겼습니다.
