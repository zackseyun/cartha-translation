  source_fidelity: 개정이 필요합니다. מִן הָעוֹף의 부분 의미는 ‘새들 가운데에서’로 자연스럽게 나타낼 수 있으나, 초안의 ‘새들을 따라서는’은 분류·열거의 뜻을 전달하지 못합니다. 또한 הַפֶּרֶס와 הָעָזְנִיָּה를 각각 ‘솔개’, ‘검은솔개’로 옮긴 것은 원문의 전통적·학술적 식별 범위(수염수리/독수리·독수리수리류 및 검은독수리류)에서 크게 벗어납니다.
  naturalness: ‘새들 가운데에서 너희가 가증한 것으로 여겨야 할 것은 이것들입니다’는 법규적 문맥에서 자연스럽고 현대 표준어 합쇼체에 맞습니다. ‘먹을 수 없습니다’는 능력 또는 가능의 뜻으로도 들릴 수 있으므로, 금지를 명시하는 ‘먹어서는 안 됩니다’가 더 적절합니다.
  terminology: שֶׁקֶץ의 반복은 ‘가증한 것’으로 유지했습니다. 이는 정결/부정을 뜻하는 별도 용어로 축소하지 않으면서 원문의 혐오·금기 평가를 보존합니다. 조류명은 본문에서 통용되는 ‘독수리, 수염수리, 검은독수리’를 쓰되, 불확실성은 각주로 밝혔습니다.
