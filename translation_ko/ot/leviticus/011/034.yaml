  lexicon: HALOT
  rationale: 히브리어의 ‘위에 물이 오다’라는 표상을 유지하면서 한국어에서는 조건절로 자연스럽게 표현했습니다.
- source_word: מַשְׁקֶה ... בְּכָל כְּלִי
  english_pob_choice: any drink ... in any vessel
  chosen_korean: 어떤 그릇에 담겨 마실 수 있는 모든 마실 것
  alternatives_korean:
  - 어떤 그릇에 있는 모든 마실 것
  - 어떤 용기에 있는 모든 음료
  lexicon: HALOT
  rationale: מַשְׁקֶה는 ‘마실 것’, כְּלִי는 제의 문맥에 맞는 ‘그릇’으로 옮기되, ‘담겨’로 용기 안에 든 상태를 드러냈습니다.
- source_word: יִטְמָא
  english_pob_choice: becomes unclean
  chosen_korean: 부정하게 됩니다
  alternatives_korean:
  - 부정해집니다
  - 더러워집니다
  lexicon: HALOT
  rationale: 레위기의 의례적 정결/부정 범주를 유지하기 위해 ‘부정하다’ 계열을 택했습니다.
theological_decisions:
- issue: 정결/부정 언어의 유지
  chosen_reading: ceremonial uncleanness is rendered as ‘부정하게 됩니다’ rather than a moralized ‘더러워집니다.’
  alternative_readings:
  - 더러워집니다
  - 불결해집니다
  rationale: 본문은 도덕적 오염이 아니라 의례적 부정 상태를 말하므로, 전통적 신학 용어를 유지하는 편이 स्रोत 의미를 더 정확히 드러냅니다.
  doctrine_reference: Leviticus purity legislation; ritual impurity category
