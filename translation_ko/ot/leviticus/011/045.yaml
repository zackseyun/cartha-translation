id: LEV.11.45
reference: Leviticus 11:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
  footnotes:
  - marker: a
    text: Or 'who brings you up from the land of Egypt.' The Hebrew uses a participle, which can be rendered more literally as a present-like expression, though the exodus event is past.
    reason: lexical_alternative
  - marker: b
    text: Or 'for I am holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희를 애굽 땅에서 인도하여 내어 너희의 하나님이 되게 한 야훼[a]이기 때문입니다. 너희는 거룩해야 합니다[b]. 나는 거룩하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘애굽 땅에서 너희를 인도하여 내시는’. 히브리어는 분사형을 써서 현재형처럼도 옮길 수 있지만, 출애굽 사건의 과거성을 드러내어 ‘인도하여 내어’로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 거룩하기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/통용 표기 관례
  rationale: POB의 기본 원칙에 따라 언약 이름 יהוה를 한국어에서도 학문적 음역인 ‘야훼’로 옮겨, 일반적인 ‘주님’으로 흡수하지 않았습니다.
- source_word: הַמַּעֲלֶה
  english_pob_choice: who brought you up
  chosen_korean: 인도하여 내어
  alternatives_korean:
  - 올려 주시는
  - 올려 내신
  - 이끌어 내신
  lexicon: HALOT
  rationale: עלה의 ‘올라오게 하다/끌어올리다’는 출애굽 관용구를 살리면서, 한국어에서는 ‘인도하여 내다’가 사건성과 방향성을 자연스럽게 담아냅니다.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  english_pob_choice: to be your God
  chosen_korean: 너희의 하나님이 되게 한
  alternatives_korean:
  - 너희에게 하나님이 되기 위해
  - 너희의 하나님이 되려고
  lexicon: HALOT
  rationale: 언약 공식인 ‘너희의 하나님이 되다’를 한국어 관계 표현으로 직역에 가깝게 살렸고, 목적절의 기능도 함께 드러냈습니다.
- source_word: קְדֹשִׁים
  english_pob_choice: holy
  chosen_korean: 거룩해야 합니다
  alternatives_korean:
  - 거룩합니다
  - 구별되어야 합니다
  lexicon: HALOT
  rationale: 명령/권고적 문맥을 반영해 단순 상태 진술보다 규범적 힘이 있는 표현을 택했습니다. ‘거룩’은 POB 기본 용례를 따랐습니다.
theological_decisions:
- issue: מוסר적 요청의 근거를 하나님의 정체성과 출애굽에 연결할지 여부
  chosen_reading: 거룩하라는 명령을 하나님의 출애굽 행위와 ‘너희의 하나님’이라는 언약 관계에 직접 연결해 번역했습니다.
  alternative_readings:
  - 단순히 정결 규정의 이유로만 좁혀 번역함
  - 출애굽 언급을 완화해 일반적 구원 표현으로 바꿈
  rationale: 본문은 음식/정결 문맥 안에 있지만, 말의 근거는 분명히 여호와의 출애굽 행위와 언약적 자기정체성에 있습니다. 이를 약화하지 않기 위해 관계적·구속사적 연결을 그대로 드러냈습니다.
  doctrine_reference: 출 6:7; 레 11장 문맥
- issue: 결과절의 어조
  chosen_reading: ‘너희는 거룩해야 합니다’로 규범성을 유지했습니다.
  alternative_readings:
  - ‘너희는 거룩합니다’로 단정 진술
  - ‘너희는 성결해야 합니다’로 교회적 용어화
  rationale: 히브리어 וִהְיִיתֶם의 문맥상 명령/권면적 힘을 살리면서도, 전통 교회어인 ‘성결’보다 본문 기본어인 ‘거룩’을 유지했습니다.
  doctrine_reference: 레 19:2; 벧전 1:16
