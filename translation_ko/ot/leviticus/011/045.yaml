review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 원문의 לִהְיוֹת לָכֶם לֵאלֹהִים는 야훼께서 출애굽을 행하신 목적을 나타내는 부정사구로, 현 번역의 ‘너희의 하나님이 되게 한’은 ‘되게 하다’라는 사역·완료 의미를 더합니다. ‘너희의 하나님이 되려고’로 옮기면 목적과 언약 공식을 충실히 보존합니다. הַמַּעֲלֶה는 분사형이지만 출애굽 사건을 가리키므로 과거형 ‘이끌어 내신’은 문맥상 가능합니다.
  naturalness: ‘이집트’는 현대 표준어에서 자연스럽고 널리 통용됩니다. 또한 마지막 인과절은 ‘이는’으로 연결하면 합쇼체의 격식과 한국어 문장 흐름을 유지하면서 원문의 인과 관계를 분명히 드러냅니다.
  terminology: ‘야훼’, ‘하나님’, ‘거룩’은 유지할 수 있습니다. ‘이끌어 내신’은 출애굽의 방향성과 행위를 자연스럽게 표현합니다. ‘이집트 땅’은 원문의 ‘이집트의 땅’을 보존합니다.
  issues:
  - severity: medium
    issue: ‘너희의 하나님이 되게 한’이 목적 부정사 לִהְיוֹת를 사역·완료 표현으로 바꿉니다.
    rationale: 원문은 ‘너희의 하나님이 되기 위하여/되려고’라는 야훼의 출애굽 행위의 목적을 말합니다. ‘되게 한’은 이 목적 관계를 흐리고, 하나님이 누군가를 하나님이 되게 했다는 뜻으로도 읽힐 수 있습니다.
  - severity: low
    issue: 각주 b가 본문의 표현과 사실상 동일하여 유효한 대안을 제시하지 못합니다.
    rationale: 인과 접속 표현의 가능한 번역을 제시하도록, 본문과 구별되는 자연스러운 대안으로 고칩니다.
  revised_text: 나는 너희의 하나님이 되려고 너희를 이집트 땅에서 이끌어 낸 야훼입니다. 그리고 너희는 거룩해야 합니다. 이는 내가 거룩하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘너희를 이집트 땅에서 이끌어 내시는.’ 히브리어는 분사형을 사용하므로 현재적인 표현으로도 옮길 수 있습니다. 그러나 출애굽 사건을 가리키므로 여기서는 ‘이끌어 낸’으로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 거룩하므로.’
    reason: lexical_alternative
  revision_rationale: 출애굽 행위의 목적을 나타내는 히브리어 부정사구를 ‘너희의 하나님이 되려고’로 바로잡았습니다. 분사형에 대한 각주는 유지하되, 본문과 일치하는 지명 표기와 동사 표현에 맞추어 조정했습니다. 마지막 이유절은 원문의 인과 관계를 보존하면서 현대 격식체에서 자연스러운 ‘이는 … 때문입니다’로 정리했고, 각주 b도 실제 대안이 되도록 수정했습니다.
