  to: 또 네 발로 걷는[a] 모든 짐승 가운데 발바닥을 딛고 다니는 것은 모두 너희에게 부정한 것입니다. 그 사체[b]에 닿는 사람은 모두 저녁까지 부정하게 됩니다.
  rationale: 원문의 한정 관계를 한국어 어순으로 재구성하고, 두 각주를 해당 어휘에 정확히 연결했습니다. ‘발바닥을 딛고 다니는’은 כַּף의 동물 문맥상 발바닥·발바닥 면(영어 paws)을 반영하면서도 ‘발바닥으로 걷다’보다 자연스럽습니다. 의례적 부정이라는 핵심 용어와 ‘저녁까지’라는 규정의 시간 한계는 보존했습니다.
