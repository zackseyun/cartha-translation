  - ‘부정한 상태가 됩니다’
  rationale: 레위기의 טמא는 도덕적 오염보다 의례적 부정 상태를 뜻하므로, 전통적 교회어보다 규례적 의미가 분명한 표현을 선택했습니다.
  doctrine_reference: 레위기의 정결법 문맥
