source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'that move on all fours.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their carcass' uses a singular noun with a plural suffix, functioning collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 발바닥으로 걷는 모든 동물과, 네 발로 걷는 모든 짐승 가운데서 그것들은 너희에게 부정합니다. 그 사체에 닿는 모든 사람은 저녁까지 부정하게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 발로 움직이는’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 사체’처럼 복수 접미가 붙은 단수 명사를 써서 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  english_pob_choice: And every animal
  chosen_korean: 그리고 … 모든 동물
  alternatives_korean:
  - 그리고 … 모든 것
  - 그리고 … 모든 짐승
  lexicon: HALOT
  rationale: 분배적 의미를 살리되, 히브리어가 ‘동물’을 가리키는 문맥이므로 한국어도 인칭적 표현보다 ‘동물’이 정확합니다.
- source_word: עַל כַּפָּיו
  english_pob_choice: on its paws
  chosen_korean: 발바닥으로
  alternatives_korean:
  - 발로
  - 발바닥 위로
  - 발바닥에
  lexicon: HALOT
  rationale: כַּף의 동물 문맥을 자연스럽게 옮기면서, 발의 접지면을 가리키는 느낌을 살리기 위해 ‘발바닥으로’라고 했습니다.
- source_word: בְּכָל הַחַיָּה
  english_pob_choice: among all the animals
  chosen_korean: 모든 동물 가운데서
  alternatives_korean:
  - 모든 짐승 가운데서
  - 모든 생물 가운데서
  lexicon: HALOT
  rationale: 율법의 식별 범주를 분명히 하기 위해 포괄적이되 구체적인 ‘동물’을 택했습니다.
- source_word: טְמֵאִים הֵם לָכֶם
  english_pob_choice: they are unclean to you
  chosen_korean: 그것들은 너희에게 부정합니다
  alternatives_korean:
  - 그것들은 너희에게 부정합니다
  - 그것들은 너희에게 더럽습니다
  - 그것들은 너희에게 부정한 것입니다
  lexicon: HALOT
  rationale: 히브리어의 정결-부정 범주를 그대로 살리기 위해 ‘부정하다’를 사용했고, 한국어 문맥에 맞게 서술형으로 다듬었습니다.
- source_word: בְּנִבְלָתָם
  english_pob_choice: their carcass
  chosen_korean: 그 사체에
  alternatives_korean:
  - 그 시체에
  - 그 죽은 몸에
  - 그들의 사체에
  lexicon: HALOT
  rationale: 히브리어 단수 명사+복수 접미의 집합적 용법을 반영하면서, 짐승의 죽은 몸을 가리키는 법률어로는 ‘사체’가 가장 정확합니다.
- source_word: יִטְמָא עַד הָעָרֶב
  english_pob_choice: shall be unclean until the evening
  chosen_korean: 저녁까지 부정하게 됩니다
  alternatives_korean:
  - 저녁까지 부정하게 됩니다
  - 저녁까지 부정합니다
  - 저녁까지 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: 미완료형의 법적 규정은 한국어에서 미래·규정적 표현으로 옮기는 것이 자연스럽고, 결과 상태를 분명히 하기 위해 ‘부정하게 됩니다’로 번역했습니다.
theological_decisions:
- issue: 정결/부정 용어
  chosen_reading: ‘부정합니다’와 ‘부정하게 됩니다’로 정결 규례의 의례적 상태를 유지했습니다.
  alternative_readings:
  - ‘더럽습니다’
  - ‘부정한 상태가 됩니다’
  rationale: 레위기의 טמא는 도덕적 오염보다 의례적 부정 상태를 뜻하므로, 전통적 교회어보다 규례적 의미가 분명한 표현을 선택했습니다.
  doctrine_reference: 레위기의 정결법 문맥
