  lexicon: HALOT
  rationale: 율법의 식별 범주를 분명히 하기 위해 포괄적이되 구체적인 ‘동물’을 택했습니다.
- source_word: טְמֵאִים הֵם לָכֶם
  english_pob_choice: they are unclean to you
  chosen_korean: 그것들은 너희에게 부정합니다
  alternatives_korean:
  - 그것들은 너희에게 부정합니다
  - 그것들은 너희에게 더럽습니다
  - 그것들은 너희에게 부정한 것입니다
  lexicon: HALOT
  rationale: 히브리어의 정결-부정 범주를 그대로 살리기 위해 ‘부정하다’를 사용했고, 한국어 문맥에 맞게 서술형으로 다듬었습니다.
- source_word: בְּנִבְלָתָם
  english_pob_choice: their carcass
  chosen_korean: 그 사체에
  alternatives_korean:
  - 그 시체에
  - 그 죽은 몸에
  - 그들의 사체에
  lexicon: HALOT
  rationale: 히브리어 단수 명사+복수 접미의 집합적 용법을 반영하면서, 짐승의 죽은 몸을 가리키는 법률어로는 ‘사체’가 가장 정확합니다.
- source_word: יִטְמָא עַד הָעָרֶב
  english_pob_choice: shall be unclean until the evening
  chosen_korean: 저녁까지 부정하게 됩니다
  alternatives_korean:
  - 저녁까지 부정하게 됩니다
  - 저녁까지 부정합니다
  - 저녁까지 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: 미완료형의 법적 규정은 한국어에서 미래·규정적 표현으로 옮기는 것이 자연스럽고, 결과 상태를 분명히 하기 위해 ‘부정하게 됩니다’로 번역했습니다.
theological_decisions:
