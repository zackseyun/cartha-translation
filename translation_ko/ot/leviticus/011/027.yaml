  naturalness: ‘발바닥으로 걷는 모든 동물과, 네 발로 걷는 모든 짐승 가운데서’는 한국어 문장 구조가 어색하고 의미 관계가 불명확합니다. ‘네 발로 걷는 모든 짐승 가운데 발바닥을 딛고 다니는 것은 모두’로 하면 현대 표준어의 문장 흐름과 원문의 범주 한정이 모두 살아납니다. 의례적 상태에는 ‘부정한 것입니다’가 ‘부정합니다’보다 자연스럽고 분명합니다.
