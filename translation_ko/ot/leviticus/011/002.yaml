base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'This is the living creature...'; English uses 'These are the living creatures' to express the collective/classifying sense naturally.
    reason: lexical_alternative
  - marker: c
    text: Or 'animals that are on the land.' The phrase distinguishes land creatures from other categories treated in the chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여 이르십시오. “이것은 여러분이 땅 위에 있는 모든 짐승 가운데서 먹을 수 있는 살아 있는 것들입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 단수 표현을 한국어에서는 분류를 여는 집합적 뜻에 맞게 복수·총칭적으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘짐승’은 여기서 땅 위의 동물 범주를 가리키며, ‘가운데서’는 מן의 부분적 뜻을 드러냅니다.
    reason: lexical_alternative
