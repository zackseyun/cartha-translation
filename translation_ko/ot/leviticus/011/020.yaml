id: LEV.11.20
reference: Leviticus 11:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
  footnotes:
  - marker: a
    text: Or 'Every swarming flying creature.' The Hebrew עוֹף can denote flying creatures broadly, not only birds.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'walks on four'; this idiom refers to locomotion on four legs, though the following verses make an exception for certain hopping insects.
    reason: cultural_note
  - marker: c
    text: Or 'is an abomination to you.' The term here denotes ritual detestability in the food laws.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 날개 달린 떼 지어 다니는 생물 가운데 네 발로 걷는 것은 너희에게 혐오스럽습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׁרֶץ는 무리 지어 움직이는 작은 생물을 가리키며, 전통적 ‘기는 것’보다 더 넓고 구체적일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘네 발로 걷는’은 실제로는 네 다리로 움직이는 형태를 가리키는 관용적 표현입니다. 뒤 절들은 뛰는 곤충을 예외로 설명합니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 שֶׁקֶץ는 여기서 제의적으로 혐오스럽고 금지된 것을 뜻하며, 단순한 일반적 역겨움을 넘는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  english_pob_choice: Every
  chosen_korean: 모든
  alternatives_korean:
  - 각각의
  - 모든 하나의
  lexicon: HALOT
  rationale: 분류 전체를 포괄하는 법조문 표현이므로, 한국어에서도 포괄성을 살리기 위해 ‘모든’을 택했습니다.
- source_word: שֶׁרֶץ
  english_pob_choice: swarming creature
  chosen_korean: 떼 지어 다니는 생물
  alternatives_korean:
  - 무리지어 다니는 생물
  - 들끓는 생물
  - 기는 것
  lexicon: HALOT
  rationale: 작고 무리 지어 움직이는 피조물을 가리키는 말이라, 전통적 ‘기는 것’보다 현대 한국어에서는 ‘떼 지어 다니는 생물’이 더 직접적으로 뜻을 드러냅니다.
- source_word: הָעוֹף
  english_pob_choice: winged
  chosen_korean: 날개 달린
  alternatives_korean:
  - 나는
  - 날아다니는
  - 조류의
  lexicon: HALOT
  rationale: 이 단어를 단순히 ‘새’로 좁히지 않으려는 영어 주석의 의도를 따라, 날개가 있는 존재를 폭넓게 보이도록 ‘날개 달린’으로 옮겼습니다.
- source_word: שֶׁקֶץ
  english_pob_choice: detestable
  chosen_korean: 혐오스럽습니다
  alternatives_korean:
  - 가증스럽습니다
  - 역겨운 것입니다
  - 너희에게 가증스럽습니다
  lexicon: HALOT
  rationale: 이 용례는 도덕적 일반 비난보다 정결법상의 기피/역겹게 여김을 나타내므로, 강하되 제의적 뉘앙스를 유지하는 ‘혐오스럽습니다’를 택했습니다.
theological_decisions:
- issue: 정결법의 평가 어휘를 도덕화할지 여부
  chosen_reading: 여기서는 보편적 도덕판결이 아니라 식품 정결 규정 안에서의 제의적 부적합을 말하는 것으로 읽고, ‘혐오스럽습니다’로 옮겼습니다.
  alternative_readings:
  - ‘가증스럽습니다’로 옮겨 더 강한 종교적 거부감을 드러내는 읽기
  - ‘부정합니다’로 완화하는 읽기
  rationale: 문맥상 분류·섭취 금지의 법조문이므로, 도덕죄의 낙인으로 오해되지 않게 하면서도 원문의 강도를 유지해야 합니다.
  doctrine_reference: 레위기 11장의 정결/부정 규정
