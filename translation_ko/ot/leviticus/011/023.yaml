  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
  footnotes:
  - marker: a
    text: Or 'creeping thing that flies.' The Hebrew phrase refers broadly to swarming flying creatures, especially insects.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'four feet'; English might also say 'four legs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네 발이 있는 모든 날아다니는 떼지어 다니는 것은 너희에게 혐오스러운 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 넓게는 ‘날아다니는 기어 다니는 것’, 곧 날아다니는 작은 생물들을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘네 발’은 히브리어의 ‘네 발/다리’를 따른 직역입니다. 한국어에서는 ‘네 다리’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  english_pob_choice: But every
  chosen_korean: 그러나 … 모든
  alternatives_korean:
  - 그리고 … 모든
  - 또 … 모든
  lexicon: HALOT
  rationale: 직전 절의 허용 규정과 대비되는 흐름이므로 ‘그러나’로 전환하고, כֹל의 분배적 의미는 ‘모든’으로 살렸습니다.
- source_word: שֶׁרֶץ הָעֹוף
  english_pob_choice: winged swarming thing
  chosen_korean: 날아다니는 떼지어 다니는 것
  alternatives_korean:
  - 날개 달린 떼지어 다니는 것
  - 날아다니는 벌레
  - 날짐승처럼 떼지어 다니는 것
  lexicon: HALOT
  rationale: שֶׁרֶץ와 הָעֹוף의 결합은 새가 아니라 곤충류를 가리키는 넓은 표현이므로, 영어 POB의 의미를 따라 ‘날아다니는 떼지어 다니는 것’으로 옮겨 과도하게 좁히지 않았습니다.
- source_word: אַרְבַּע רַגְלָיִם
  english_pob_choice: four feet
  chosen_korean: 네 발
  alternatives_korean:
  - 네 다리
  - 네 발굽
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘발/다리’가 가능하나, 한국어에서는 동물 일반을 가리킬 때 자연스럽게 ‘네 발’이 가장 직접적이고 간결합니다.
- source_word: שֶׁקֶץ
  english_pob_choice: detestable
  chosen_korean: 혐오스러운
  alternatives_korean:
  - 가증스러운
  - 역겨운
  - 몹시 더러운
  lexicon: HALOT
  rationale: 정결 규정 문맥에서 שֶׁקֶץ의 배척 강도를 살리되, 교회 전통어 ‘가증스러운’보다 현대 한국어에서 더 자연스럽고 강한 ‘혐오스러운’을 선택했습니다.
theological_decisions:
- issue: 정결 규정의 평가어 번역
  chosen_reading: 의례적 부정/금지 대상을 ‘혐오스러운 것’으로 직역하여 규정의 강도를 유지했습니다.
  alternative_readings:
  - 부정한 것
  - 역겨운 것
  - 가증한 것
  rationale: 본문은 제의적 금지의 판정을 말하므로, ‘부정한’으로만 완화하기보다 שֶׁקֶץ의 감정적·규범적 배척을 함께 드러내는 표현이 소스에 더 가깝습니다.
  doctrine_reference: 레위기 정결/부정 규정의 언어적 강도 유지
- issue: שֶׁרֶץ הָעֹוף의 범주
  chosen_reading: 새 자체가 아니라 날아다니는 작은 떼지어 다니는 생물류를 가리키는 넓은 범주로 옮겼습니다.
  alternative_readings:
  - 날개 달린 곤충
  - 날아다니는 벌레
  rationale: 문맥상 백과사전식 분류를 과도하게 확정하지 않고, 본문의 범주적 अस्पष्ट성을 보존하는 것이 더 안전합니다.
  doctrine_reference: 창조물 분류의 범주적 표현 보존
