  source_fidelity: 원문은 서로 다른 네 항목, 곧 חֲסִידָה(황새), אֲנָפָה(통상 왜가리; 정확한 동정은 불확실), ‘그 종류대로’, דּוּכִיפַת(후투티), עֲטַלֵּף(박쥐)를 열거합니다. 초안은 첫 두 조류를 모두 ‘학사다’로 처리하여 אֲנָפָה를 누락하고, ‘그 종류대로’의 수식 대상도 잘못 연결합니다.
  naturalness: ‘그리고’로 시작하는 목록 문장과 ‘…입니다’ 종결은 앞 절과 이어지는 성경 목록 문맥에서는 가능하나, 새 이름을 명확히 구분하여 ‘황새와 왜가리와 그 종류들’로 쓰는 편이 현대 한국어에서 자연스럽고 이해하기 쉽습니다. ‘학사다’와 ‘두키파트’는 현대 표준어 독자에게 불투명합니다.
  terminology: חֲסִידָה에는 현대 일반명 ‘황새’를 사용합니다. אֲנָפָה는 관례적이되 불확실성을 보존하여 ‘왜가리’로 옮기고 각주로 이비스 등 대안을 알립니다. דּוּכִיפַת은 현대 조류명 ‘후투티’가 hoopoe의 직접 대응이며, 전통적 ‘lapwing’ 문제는 ‘물떼새’로 설명할 수 있습니다.
