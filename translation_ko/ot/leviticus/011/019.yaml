  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
  footnotes:
  - marker: a
    text: Or possibly 'ibis' or another long-legged waterbird' for 'heron'; the precise identification of the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'lapwing'; the Hebrew term is more likely the hoopoe.
    reason: alternative_reading
  - marker: c
    text: The phrase 'according to its kind' indicates related varieties within the same general bird type.
    reason: cultural_note
translation:
  language: ko
  text: 황새와 왜가리와 그 종류들과 후투티와 박쥐입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왜가리’로 옮긴 히브리어 새 이름의 정확한 식별은 확실하지 않습니다. 이비스나 다른 긴 다리 물새를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 종류들과’는 왜가리의 관련된 여러 종류를 가리키는 분류 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘후투티’는 전통적으로 ‘물떼새’로 옮기기도 했으나, 히브리어 새 이름에는 후투티가 더 유력합니다.
    reason: alternative_reading
