  rationale: 영어 POB가 전통적인 lapwing 대신 hoopoe를 택한 것처럼, 한국어도 조류 명칭을 설명적으로 덧붙이기보다 음역으로 옮겨 식별의 불확실성과 원어성을 보존했습니다.
- source_word: עֲטַלֵּף
