  text: וְ/אֵת֙ הַ/חֲסִידָ֔ה הָ/אֲנָפָ֖ה לְ/מִינָ֑/הּ וְ/אֶת הַ/דּוּכִיפַ֖ת וְ/אֶת הָ/עֲטַלֵּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
  footnotes:
  - marker: a
    text: Or possibly 'ibis' or another long-legged waterbird' for 'heron'; the precise identification of the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'lapwing'; the Hebrew term is more likely the hoopoe.
    reason: alternative_reading
  - marker: c
    text: The phrase 'according to its kind' indicates related varieties within the same general bird type.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 학사다, 그 종류대로 된 학사다와 두키파트와 박쥐입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲסִידָה는 전통적으로 ‘황새’로도 옮길 수 있으나, 한국 성서 전통에서는 ‘학사다’가 널리 알려진 대응입니다.
    reason: lexical_alternative
  - marker: b
    text: 두키파트는 옛 번역의 ‘lapwing’보다 ‘hoopoe’에 더 가깝다는 것이 현대 어휘 판단입니다.
    reason: alternative_reading
  - marker: c
    text: ‘그 종류대로’는 같은 큰 새 범주 안의 관련 변종들을 가리키는 분류 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲסִידָה
  english_pob_choice: stork
  chosen_korean: 학사다
  alternatives_korean:
  - 황새
  lexicon: HALOT, BDB
  rationale: 영어 POB의 stork에 대응하되, 히브리어 חֲסִידָה의 전통적 한국 성서어인 ‘학사다’를 살려 본문의 조류명으로 옮겼습니다.
- source_word: הָאֲנָפָה
  english_pob_choice: heron
  chosen_korean: 학사다와 함께 ‘그 종류대로 된 학사다’ 다음에 오는 ‘아나파’에 해당하는 새이므로 ‘아나파’의 음역을 반영하지 않고도 의미를 분리해 번역
  alternatives_korean:
  - 왜가리
  - 이비스
  lexicon: HALOT, BDB
  rationale: 이 항목은 정확한 조류 식별이 확정적이지 않으므로, 영어 POB가 유지한 불확실성을 따라 특정 한국 통용명으로 단정하지 않고 목록의 구별성을 우선했습니다.
- source_word: לְמִינָהּ
  english_pob_choice: according to its kind
  chosen_korean: 그 종류대로
  alternatives_korean:
  - 각 종류대로
  - 그 종대로
  lexicon: HALOT, BDB
  rationale: ‘종류’는 히브리어의 분류적 의미를 자연스럽게 전달하며, ‘그 종류대로’는 본문의 반복 분류 공식을 간결하게 살립니다.
- source_word: דּוּכִיפַת
  english_pob_choice: hoopoe
  chosen_korean: 두키파트
  alternatives_korean:
  - 후파새
  - 뿔새
  lexicon: HALOT, BDB
  rationale: 영어 POB가 전통적인 lapwing 대신 hoopoe를 택한 것처럼, 한국어도 조류 명칭을 설명적으로 덧붙이기보다 음역으로 옮겨 식별의 불확실성과 원어성을 보존했습니다.
- source_word: עֲטַלֵּף
  english_pob_choice: bat
  chosen_korean: 박쥐
  alternatives_korean:
  - 박쥐류
  lexicon: HALOT, BDB
  rationale: 어휘 대응이 분명하므로 현대 한국어의 일반명사 ‘박쥐’를 사용했습니다.
theological_decisions:
- issue: 부정한 새 목록의 표기에서 현대 분류학과 고대 히브리 목록 방식의 차이
  chosen_reading: 본문의 분류 기준을 현대 생물학적 계통보다 히브리어 식별과 관찰적 목록 방식에 맞춰 그대로 옮겼습니다.
  alternative_readings:
  - 현대 분류학에 맞게 ‘날짐승’ 또는 ‘비행동물’로 포괄 번역
  rationale: 레위기 11장의 식이 규례는 현대 분류학이 아니라 성경 시대의 관찰적 범주를 전제하므로, 목록의 개별 항목성을 지우지 않는 번역이 더 충실합니다.
  doctrine_reference: 레위기 11장 정결/부정 규례의 문맥
