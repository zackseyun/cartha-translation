  rationale: 어휘 대응이 분명하므로 현대 한국어의 일반명사 ‘박쥐’를 사용했습니다.
theological_decisions:
- issue: 부정한 새 목록의 표기에서 현대 분류학과 고대 히브리 목록 방식의 차이
  chosen_reading: 본문의 분류 기준을 현대 생물학적 계통보다 히브리어 식별과 관찰적 목록 방식에 맞춰 그대로 옮겼습니다.
  alternative_readings:
