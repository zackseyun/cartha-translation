id: LEV.11.25
reference: Leviticus 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
  footnotes:
  - marker: a
    text: Or 'from their carcasses.' The Hebrew construction can be rendered more formally this way, but 'any of their carcasses' better conveys the distributive sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 사체 가운데 어느 것이든 운반하는 사람은 자기 옷을 빨아야 하며, 저녁까지 부정합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 사체에서’. 히브리어 구조는 더 형식적으로 이렇게도 옮길 수 있지만, 여기서는 분배적 의미를 살려 ‘그들의 사체 가운데 어느 것이든’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּשֵׂא
  english_pob_choice: And everyone who carries
  chosen_korean: 그리고 그들의 사체 가운데 어느 것이든 운반하는 사람은
  alternatives_korean:
  - 그리고 누구든지 운반하는 사람은
  - 그리고 그것을 드는 사람은
  lexicon: HALOT
  rationale: כָּל과 הפעול 분사 구조는 보편적·분배적 의미를 가지므로, 문맥상 ‘누구든지’보다 ‘어느 것이든’과 결합한 ‘운반하는 사람’이 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: מִנִּבְלָתָם
  english_pob_choice: any of their carcasses
  chosen_korean: 그들의 사체 가운데 어느 것이든
  alternatives_korean:
  - 그들의 사체에서
  - 그들의 사체들 중 어느 것이라도
  lexicon: HALOT
  rationale: נְבֵלָה는 레위기 정결법에서 동물의 사체를 가리키므로 ‘사체’로 옮겼고, מִן의 분배적 뉘앙스를 살려 ‘가운데 어느 것이든’으로 처리했습니다.
- source_word: יְכַבֵּס בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨아야 하며
  alternatives_korean:
  - 자기 옷을 씻어야 하며
  - 자기 옷을 빨아야 합니다
  lexicon: HALOT
  rationale: 정결 규례의 법문이므로 의무를 나타내는 ‘-아야 하며’로 옮겼고, בְּגָדִים는 현대 한국어에서 자연스러운 ‘옷’으로 번역했습니다.
- source_word: וְטָמֵא עַד הָעָרֶב
  english_pob_choice: and be unclean until the evening
  chosen_korean: 저녁까지 부정합니다
  alternatives_korean:
  - 저녁까지 부정해야 합니다
  - 저녁이 될 때까지 부정합니다
  lexicon: HALOT
  rationale: טָמֵא는 도덕적 ‘더러움’이 아니라 의례적 부정을 뜻하므로 ‘부정합니다’로 옮겼고, 기간 표현은 한국어에서 자연스러운 ‘저녁까지’로 압축했습니다.
theological_decisions:
- issue: 정결법에서 טָמֵא의 의미 범주
  chosen_reading: 의례적 부정 상태를 뜻하는 ‘부정합니다’로 번역했습니다.
  alternative_readings:
  - 더럽습니다
  - 부정해집니다
  rationale: 문맥은 윤리적 죄가 아니라 접촉에 따른 정결 상태의 변화를 말하므로, 전통적이지만 오해를 부를 수 있는 ‘더럽다’보다 법규적·의례적 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 레위기 정결법의 문맥 및 טָמֵא 용례
