id: LEV.11.6
reference: Leviticus 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
  footnotes:
  - marker: a
    text: Or 'the rabbit.' The Hebrew אַרְנֶבֶת is traditionally understood as 'hare,' though some take it more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 토끼과 동물[a]은, 되새기기는 하지만 굽이 갈라지지 않으므로, 너희에게는 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '토끼.' 히브리어 אַרְנֶבֶת은 전통적으로 'hare(산토끼)'로 이해되지만, 더 넓게는 토끼로 보기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  english_pob_choice: the hare
  chosen_korean: 토끼과 동물
  alternatives_korean:
  - 산토끼
  - 토끼
  lexicon: HALOT
  rationale: 히브리어 אַרְנֶבֶת는 전통적으로 'hare'로 이해되지만, 한국어에서는 정확한 단일 대응어가 덜 확립되어 있어, 본문 의미를 해치지 않으면서 식별 가능성을 남기는 '토끼과 동물'을 택했습니다.
- source_word: מַעֲלַת גֵּרָה
  english_pob_choice: chews the cud
  chosen_korean: 되새기기는 하지만
  alternatives_korean:
  - 되새김질은 하지만
  - 먹은 것을 되씹기는 하지만
  lexicon: HALOT
  rationale: 문맥상 음식 규정의 판정 기준을 말하므로, 표준적인 관용 표현인 '되새기다/되새김질하다'를 사용해 동작의 특징을 자연스럽게 살렸습니다.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  english_pob_choice: but does not divide the hoof
  chosen_korean: 굽이 갈라지지 않으므로
  alternatives_korean:
  - 굽을 나누지 않으므로
  - 발굽이 갈라지지 않으므로
  lexicon: HALOT
  rationale: 히브리어는 발굽의 분할 여부를 진단 기준으로 제시하므로, 한국어에서 이해하기 쉬운 '굽이 갈라지다'로 옮겨 동일한 식별 기준을 보존했습니다.
- source_word: טְמֵאָה הִוא לָכֶם
  english_pob_choice: is unclean for you
  chosen_korean: 너희에게는 부정합니다
  alternatives_korean:
  - 너희에게는 부정한 것입니다
  - 너희에게는 깨끗하지 않습니다
  lexicon: HALOT
  rationale: 레위기의 טָמֵא는 도덕적 악이 아니라 제의적 부정 상태를 뜻하므로, 한국어 교회 용례를 따르되 의미를 분명히 하는 '부정합니다'를 사용했습니다.
theological_decisions:
- issue: 레위기의 '부정함'의 성격
  chosen_reading: 의례적/제의적 부정
  alternative_readings:
  - 도덕적 타락
  - 위생적 더러움
  rationale: 이 절은 음식 규례의 분류 기준을 제시하며, 동물의 도덕성을 평가하는 진술이 아닙니다. 따라서 한국어도 제의적 부정의 의미를 유지해야 합니다.
  doctrine_reference: 레위기 11장 정결 규례
