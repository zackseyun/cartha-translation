translation:
  language: ko
  text: 또 산토끼[a]는 되새김질을 하지만 발굽이 갈라지지 않으므로, 너희에게 부정한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토끼.’ 히브리어 אַרְנֶבֶת는 전통적으로 ‘산토끼’로 이해되지만, 더 넓게 토끼를 가리킨다고 보기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  english_pob_choice: the hare
  chosen_korean: 토끼과 동물
  alternatives_korean:
