  lexicon: HALOT
  rationale: 레위기의 טָמֵא는 도덕적 악이 아니라 제의적 부정 상태를 뜻하므로, 한국어 교회 용례를 따르되 의미를 분명히 하는 '부정합니다'를 사용했습니다.
theological_decisions:
