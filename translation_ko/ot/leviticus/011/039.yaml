  source_fidelity: 본문은 히브리어의 조건절, 식용으로 분류된 가축의 부분적 범위, 사체 접촉, 저녁까지의 부정 상태를 대체로 정확히 반영합니다. 다만 ‘식용으로 허용된’은 원문의 분류·적합성 표현을 약간 해석적으로 좁히므로 ‘너희가 먹을 수 있는’이 더 직접적이고 자연스럽습니다.
  naturalness: ‘그리고 만일’은 현대 한국어 법문체에서 다소 번역투입니다. ‘너희가 먹을 수 있는 가축 가운데 하나가 죽으면’이 자연스럽고, ‘그 사체에 닿는 사람’도 명료합니다. ‘부정하게 됩니다’는 합쇼체에 맞습니다.
  terminology: ‘사체’는 נְבֵלָה에 적절합니다. 의례적 의미를 보존하기 위해 ‘부정하게 됩니다’를 유지할 수 있습니다. 각주 원문의 ‘가축 가운데 식용으로 있는 것’은 비문이므로 고쳐야 합니다.
  issues:
