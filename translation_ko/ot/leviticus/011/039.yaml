  rationale: 접속사 ו는 한국어에서 별도의 ‘그리고’ 없이 조건절로 자연스럽게 연결될 수 있으므로 생략했습니다. 식용 범주를 나타내는 히브리어 표현은 ‘너희가 먹을 수 있는’으로 옮겨 원문에 더 가깝게 했고, 각주는 자연스러운 직역 대안을 제시하도록 바로잡았습니다.
