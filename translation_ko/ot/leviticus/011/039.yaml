reference: Leviticus 11:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or, more literally, 'that is for you for food.' The Hebrew phrase identifies animals permitted as food.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 식용으로 허용된 가축 가운데 하나가 죽으면, 그 사체에 닿는 사람은 저녁까지 부정하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가축 가운데 식용으로 있는 것’에 더 직역할 수 있습니다. 히브리어 구는 먹을 수 있도록 허용된 동물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고
  lexicon: HALOT
  rationale: 조건절의 시작을 살리면서 앞 절과의 연결감도 유지하려면 ‘그리고 만일’이 가장 자연스럽습니다.
- source_word: מִן הַבְּהֵמָה
  english_pob_choice: any of the livestock
  chosen_korean: 가축 가운데 하나
  alternatives_korean:
  - 가축 중 하나
  - 어떤 가축 하나
  lexicon: HALOT
  rationale: מן의 부분적 의미를 한국어로 드러내기 위해 ‘가축 가운데 하나’로 옮겼습니다.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  english_pob_choice: that may be used for food
  chosen_korean: 식용으로 허용된
  alternatives_korean:
  - 먹을 수 있는
  - 여러분에게 먹을 것으로 주어진
  lexicon: HALOT
  rationale: 문구의 요지는 단순한 섭취 행위가 아니라 먹을 수 있도록 분류된 짐승이라는 점이어서, 의미를 간결하게 ‘식용으로 허용된’으로 풀었습니다.
- source_word: נִבְלָה
  english_pob_choice: carcass
  chosen_korean: 사체
  alternatives_korean:
  - 시체
  - 송장
  lexicon: HALOT
  rationale: 정결 규례 문맥에서 동물의 죽은 몸을 가리키는 표현이므로 ‘사체’가 가장 무난하고 법문체에도 잘 맞습니다.
theological_decisions:
- issue: 부정함의 상태 표현
  chosen_reading: ‘부정하게 됩니다’로 상태의 변화를 한국어 법문체로 표현했습니다.
  alternative_readings:
  - ‘부정합니다’
  - ‘부정해집니다’
  rationale: יִטְמָא는 단순 감정이나 도덕적 오염이 아니라 의례적 부정을 가리키므로, 결과 상태를 드러내는 표현이 적절합니다.
  doctrine_reference: 레위기 정결법의 의례적 부정 개념
