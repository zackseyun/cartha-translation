- source_word: הַחַיָּה הַנֶּאֱכֶלֶת / הַחַיָּה אֲשֶׁר לֹא תֵאָכֵל
  english_pob_choice: the creature that may be eaten / the creature that may not be eaten
  chosen_korean: 먹을 수 있는 생물 / 먹을 수 없는 생물
  alternatives_korean:
  - 먹을 수 있는 짐승 / 먹을 수 없는 짐승
  - 먹어도 되는 생물 / 먹어서는 안 되는 생물
