  rationale: חַיָּה는 단순히 ‘짐승’보다 넓게 ‘생물’로 옮겨야 범위를 좁히지 않습니다. ‘may be eaten’은 허용의 의미이므로 ‘먹을 수 있는’으로, 금지 반대항도 같은 구조로 맞췄습니다.
- source_word: וּבֵין ... וּבֵין ...
  english_pob_choice: between ... and between ...
