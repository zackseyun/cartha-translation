  rationale: 레위기 식이 규정의 문맥에서는 ritual purity category를 유지하는 것이 핵심이므로, 도덕화하거나 위생화하지 않고 본문의 범주를 그대로 드러내는 번역을 택했습니다.
  doctrine_reference: Original-language primacy; cultic-legal categories in Leviticus
