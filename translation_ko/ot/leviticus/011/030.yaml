    text: 이 절에 나오는 몇몇 동물의 정확한 종 동정은 확실하지 않습니다. ‘도마뱀붙이’는 ‘족제비’나 ‘땃쥐’ 또는 ‘울음소리를 내는 도마뱀’으로, ‘왕도마뱀’은 ‘카멜레온’이나 ‘육지 악어’로, ‘도마뱀’은 ‘벽도마뱀’이나 ‘도마뱀붙이’로, ‘모래도마뱀’은 ‘스킨크’ 또는 옛 전통의 ‘달팽이’로, ‘카멜레온’은 ‘두더지’나 다른 종류의 도마뱀으로 이해되기도 합니다.
    reason: lexical_alternative
