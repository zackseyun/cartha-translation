  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
  footnotes:
  - marker: a
    text: Or 'any of their carcasses falls on any seed for sowing.' The Hebrew expression מִנִּבְלָתָם is somewhat awkward in English and may be understood partitivally ('any of their carcass') or collectively/plurally ('any of their carcasses').
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 사체의 일부가 심을 어느 씨앗에든 떨어지면, 그 씨앗은 정결합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 사체’는 단수 명사에 복수 소유 접미사가 붙은 표현입니다. 문맥상 ‘그들의 사체의 일부’로 이해할 수 있으며, ‘그들의 사체들’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  english_pob_choice: And if
  chosen_korean: 그리고 … 떨어지면
  alternatives_korean:
  - 그리고 만일 … 떨어지면
  - 만일 … 떨어지면
  lexicon: HALOT
  rationale: 법조문의 조건문을 한국어로 자연스럽게 옮기되, 앞절과의 연결을 살려 ‘그리고’로 시작했습니다.
- source_word: מִ/נִּבְלָתָם
  english_pob_choice: any of their carcass
  chosen_korean: 그들의 사체에서 조금이라도
  alternatives_korean:
  - 그들의 사체 중 어느 것이라도
  - 그들의 사체에서
  - 그들의 사체들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 מִן과 단수형에 복수 소유격이 결합된 난해한 표현을, 부분적 의미를 살려 ‘그들의 사체에서 조금이라도’로 옮겼습니다.
- source_word: זֶרַע זֵרוּעַ / אֲשֶׁר יִזָּרֵעַ
  english_pob_choice: seed for sowing / that is to be sown
  chosen_korean: 심으려고 하는 씨앗
  alternatives_korean:
  - 뿌리려고 하는 씨앗
  - 심을 씨앗
  - 파종할 씨앗
  lexicon: HALOT
  rationale: ‘씨앗’의 파종 의도를 중복 없이 드러내기 위해 ‘심으려고 하는’으로 풀어, ‘seed for sowing’과 ‘that is to be sown’의 이중 강조를 보존했습니다.
- source_word: טָהוֹר הוּא
  english_pob_choice: it is clean
  chosen_korean: 그것은 깨끗합니다
  alternatives_korean:
  - 그것은 정결합니다
  - 그것은 깨끗한 상태입니다
  lexicon: HALOT
  rationale: 레위기의 정결 규정에서 טָהוֹר는 의례적 ‘깨끗함’이 핵심이므로, 교회 용어의 ‘정결’보다 직접적인 ‘깨끗합니다’를 택했습니다.
