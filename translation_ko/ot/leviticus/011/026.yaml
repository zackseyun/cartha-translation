  to: 발굽이 갈라져[a] 있으나 발굽의 갈라진 틈이 완전히 나뉘지 않고 되새김질하지 않는 모든 짐승은 너희에게 부정하다. 그것들을 만지는 사람은 누구나 부정해질 것이다.
