    text: 직역하면 ‘갈라진 틈을 갈라 놓지 않는다’입니다. 히브리어는 발굽의 갈라짐과 그 갈라진 틈이 완전히 분할되는 것을 중첩하여 구별합니다.
    reason: lexical_alternative
