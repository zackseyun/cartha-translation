    issue: ‘그 무엇에든지’가 원문의 ‘그것들(해당 짐승들)’을 다른 대상으로 바꿉니다.
    rationale: כָּל הַנֹּגֵעַ בָּהֶם은 ‘그것들을 만지는 모든 사람’이라는 뜻입니다. 포괄적 사물 지시로 옮기면 접촉 대상과 법적 규정의 범위가 달라집니다.
  - severity: medium
    issue: ‘부정하리라’는 결과적 상태를 충분히 드러내지 못합니다.
    rationale: יִטְמָא는 접촉한 사람이 부정한 상태가 되는 법적 결과를 말하므로 ‘부정해질 것이다’가 더 명료합니다.
  - severity: low
    issue: 발굽의 ‘갈라짐’과 ‘갈라진 틈’의 완전한 분할을 구별할 필요가 있습니다.
    rationale: מַפְרֶסֶת פַּרְסָה와 שֶׁסַע אֵינֶנָּה שֹׁסָעַת의 중첩 표현은 단순히 ‘발굽이 갈라지지 않는다’는 뜻이 아니라, 갈라진 발굽처럼 보이나 그 틈이 완전히 분할되지 않은 경우를 가리킵니다.
