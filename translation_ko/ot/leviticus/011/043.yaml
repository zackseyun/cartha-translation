source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
  footnotes:
  - marker: a
    text: Or 'by any creeping thing that creeps.' The Hebrew refers to the class of small creatures that swarm or teem; 'swarming thing' preserves the broader category better than the traditional 'creeping thing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 떼지어 다니는 것을 통해 여러분 자신을 가증스럽게 만들지 말고, 그것들로 인해 여러분 자신을 부정하게 만들지 마십시오. 그러면 여러분은 그것들로 인해 부정하게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기어 다니는 것’으로 옮길 수 있습니다. 히브리어는 작은 생물들의 떼지어 움직임을 가리키는 범주를 말하므로, ‘떼지어 다니는 것’이 전통적 ‘기어 다니는 것’보다 더 넓은 뜻을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  english_pob_choice: make yourselves detestable
  chosen_korean: 여러분 자신을 가증스럽게 만들지 말고
  alternatives_korean:
  - 여러분 자신을 혐오스럽게 만들지 말고
  - 여러분 자신을 역겨운 존재로 만들지 말고
  - 여러분 자신을 부정하게 만들지 말고
  lexicon: HALOT
  rationale: שׁקץ의 핵심은 ‘가증스럽다/혐오스럽다’에 있으므로, 뒤의 טמא(부정하게 만들다)와 구별되도록 한국어도 별도 동사로 살렸습니다.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  english_pob_choice: by any swarming thing that swarms
  chosen_korean: 어떤 떼지어 다니는 것을 통해
  alternatives_korean:
  - 어떤 기어 다니는 것을 통해
  - 어떤 떼지어 움직이는 피조물을 통해
  - 어떤 군집하는 생물을 통해
  lexicon: HALOT
  rationale: שׁרץ는 전통적 ‘기어 다니는 것’보다 넓은 ‘떼지어 움직이는/군집하는 것’의 범주를 가리키므로, POB의 ‘swarming thing’ 취지를 따라 보다 넓은 표현을 택했습니다.
- source_word: תִטַּמְּאוּ / וְנִטְמֵתֶם
  english_pob_choice: make yourselves unclean / become unclean
  chosen_korean: 여러분 자신을 부정하게 만들지 마십시오 / 여러분은 … 부정하게 됩니다
  alternatives_korean:
  - 여러분 자신을 더럽히지 마십시오 / 여러분은 더럽게 됩니다
  - 여러분 자신을 부정하게 하지 마십시오 / 여러분은 부정해집니다
  - 여러분 자신을 불결하게 만들지 마십시오 / 여러분은 불결하게 됩니다
  lexicon: HALOT
  rationale: טמא는 레위기에서 주로 의례적 부정을 가리키므로, moralizing된 ‘더럽히다’보다 ‘부정하게 하다’가 원문의 범주를 더 정확히 보존합니다.
theological_decisions:
- issue: 례법적 부정과 도덕적 죄의 구분
  chosen_reading: ‘부정하게 하다/부정하게 되다’로 옮겨, 이 절이 말하는 것은 의례적 부정이며 곧바로 도덕적 죄책을 뜻하지는 않는다는 긴장을 유지했습니다.
  alternative_readings:
  - 더럽히다/더럽게 되다
  - 오염되다/오염시키다
  rationale: 레위기 11장의 טמא는 거룩 범주 안에서의 의례적 부정을 뜻하므로, 독자가 죄책 개념으로 자동 전환하지 않도록 한국어도 그 범주를 유지하는 편이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
