revisions:
- from: 그리고 그것들 중 어떤 것에라도 죽었을 때에 닿은 것은 다 부정해집니다. 곧 어떤 나무 그릇이든지, 옷이든지, 가죽이든지, 자루천이든지, 곧 일에 쓰이는 어떤 그릇이든지 물에 담가야 하며, 저녁까지 부정하겠지만 그 뒤에는 깨끗해집니다.[a]
  to: 그리고 그것들 가운데 어느 하나가 죽은 뒤에 그 위에 떨어지는 모든 것은 부정해집니다. 나무로 만든 물건이나 옷이나 가죽이나 자루천, 곧 그러한 것으로 일을 하는 모든 물건은 물에 넣어야 하며,[a] 저녁까지 부정합니다. 그 뒤에는 정결해집니다.
  rationale: 원문의 관계절을 바로잡아 죽은 부정한 생물의 사체가 물건 위에 떨어지는 상황을 정확히 표현했습니다. כְּלִי의 포괄적 의미와 의례적 정결 용어의 대조를 보존했으며, 물에 넣는 행위는 원문의 문자적 표현을 본문과 각주에 함께 반영했습니다.
