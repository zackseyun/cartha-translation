review_pass:
  verdict: revise
  source_fidelity: 현 번역의 첫 절 관계절은 히브리어의 주어·방향을 뒤바꿉니다. 원문은 ‘그것들 가운데 어느 하나가 죽었을 때 그 위에 떨어지는 모든 것’이지, ‘그것들 중 어떤 것에 죽었을 때 닿은 것’이 아닙니다. 또한 כְּלִי는 단지 ‘그릇’이 아니라 작업에 쓰이는 물건·기구를 포괄합니다. יוּבָא는 문자적으로 물 안으로 ‘들여오게 된다/가져오게 된다’이므로, 본문에서는 과도하게 특정하지 않은 ‘물에 넣어야 합니다’를 사용하고 각주에서 대안을 제시하는 것이 안전합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, 법규적 열거와 시간 순서를 자연스럽게 드러냅니다. ‘부정합니다/정결해집니다’는 의례 규정 문맥에서 상태를 명료하게 표현합니다.
  terminology: טמא/טהר는 도덕적 의미를 더하지 않도록 ‘부정하다/정결해지다’로 일관되게 옮겼습니다. כְּלִי는 ‘물건’으로, שַׂק은 ‘자루천’으로 유지했습니다.
  issues:
  - severity: high
    issue: 첫 문장의 관계절이 접촉 방향과 주어를 잘못 표현합니다.
    rationale: יִפֹּל עָלָיו מֵהֶם은 ‘그것들 가운데 어느 하나가 그 위에 떨어지다’라는 뜻입니다. 현행 ‘그것들 중 어떤 것에라도 죽었을 때에 닿은 것’은 대상이 죽은 것들에 닿는 것으로 바꾸며, ‘어떤 것’의 지시 대상도 불명확하게 합니다.
  - severity: medium
    issue: ‘그릇’이 כְּלִי의 범위를 지나치게 좁힐 수 있습니다.
    rationale: 원문은 나무 물건, 옷, 가죽, 자루천 및 그러한 재료로 일을 하는 모든 도구·물건을 포괄합니다. ‘물건’이 열거 전체와 포괄 표현에 더 적합합니다.
  - severity: medium
    issue: 본문의 ‘물에 담가야 하며’는 יוּבָא보다 구체적입니다.
    rationale: 히브리어는 문자적으로 ‘물 안으로 들여오게 된다’라고 말합니다. 문맥상 침수를 뜻할 가능성은 높지만, 본문은 ‘물에 넣어야 합니다’로 두고 각주에서 ‘담그다’ 대안을 제시하는 편이 원문의 표현 폭을 보존합니다.
  revised_text: 그리고 그것들 가운데 어느 하나가 죽은 뒤에 그 위에 떨어지는 모든 것은 부정해집니다. 나무로 만든 물건이나 옷이나 가죽이나 자루천, 곧 그러한 것으로 일을 하는 모든 물건은 물에 넣어야 하며,[a] 저녁까지 부정합니다. 그 뒤에는 정결해집니다.
