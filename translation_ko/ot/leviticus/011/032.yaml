source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
  footnotes:
  - marker: a
    text: Or 'it shall be immersed in water.' The Hebrew literally says 'it shall be brought into the water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것들 가운데 어느 하나가 죽은 뒤에 그 위에 떨어지는 모든 것은 부정해집니다. 나무로 만든 물건이나 옷이나 가죽이나 자루천, 곧 그러한 것으로 일을 하는 모든 물건은 물에 넣어야 하며,[a] 저녁까지 부정합니다. 그 뒤에는 정결해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘물 안으로 들여오게 된다’라고 합니다. 문맥상 ‘물에 담그다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  english_pob_choice: And everything
  chosen_korean: 그리고 …은/는 다
  alternatives_korean:
  - 그리고 모든 것은
  - 그리고 무엇이든
  lexicon: HALOT
  rationale: 총괄적 범위를 살리되 한국어 법조문 어감에 맞게 ‘다’로 포괄성을 드러냈습니다.
- source_word: יִטְמָא
  english_pob_choice: shall become unclean
  chosen_korean: 부정해집니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정한 상태가 됩니다
  lexicon: HALOT
  rationale: 의례적 상태 변화를 나타내는 טמא를 moral guilt로 옮기지 않고, 한국어 성경의 법적 문맥에 맞는 ‘부정하다’로 옮겼습니다.
- source_word: כְּלִי ... בַּמַּיִם יוּבָא
  english_pob_choice: It shall be put into the water
  chosen_korean: 물에 담가야 하며
  alternatives_korean:
  - 물로 가져가야 하며
  - 물에 넣어야 하며
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘물 안으로 가져가다’이지만, 정결 규례 문맥에서는 ‘담그다’가 가장 자연스럽고 의미를 분명히 합니다. 본문이 허용하는 범위 안에서 침수의 동작을 드러냈습니다.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  english_pob_choice: any vessel with which work is done
  chosen_korean: 일에 쓰이는 어떤 그릇이든지
  alternatives_korean:
  - 노동에 쓰이는 어떤 그릇이든지
  - 거기에 작업이 이루어지는 어떤 그릇이든지
  lexicon: HALOT
  rationale: מְלָאכָה를 일/작업으로 넓게 살리되, 한국어에서 지나치게 기술적으로 들리지 않도록 ‘일에 쓰이는’으로 옮겼습니다.
theological_decisions:
- issue: 정결/부정 용어 유지
  chosen_reading: טמא/טהור를 의례적 정결 상태를 가리키는 ‘부정하다/깨끗하다’로 유지했습니다.
  alternative_readings:
  - 더럽다/깨끗하다
  - 부정하다/정결하다
  rationale: 본문은 도덕적 죄책이 아니라 예배·공동체 안에서의 의례적 상태를 다루므로, 전통적이지만 오해를 줄 수 있는 표현은 피하고 상태 변화를 직접적으로 드러냈습니다.
  doctrine_reference: 레위기 정결 규례의 문맥 보존
- issue: ‘나무 그릇/가죽/자루천’ 목록 처리
  chosen_reading: 원문이 허용하는 재료 목록을 보존하고, 앞 절의 시체 접촉으로 인한 전염을 법문체로 전달했습니다.
  alternative_readings:
  - 의식적으로 더 완곡하게 풀어쓰기
  - 한 문장으로 더 압축
  rationale: 규례의 적용 범위를 흐리지 않도록 열거를 유지해야 하며, 한국어에서도 법조문형 문장을 통해 원문의 범주화 논리를 살렸습니다.
  doctrine_reference: 원문 우선 번역 원칙
