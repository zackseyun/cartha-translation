  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
  footnotes:
  - marker: a
    text: Or 'clay vessel' or 'earthen vessel.' The Hebrew refers specifically to a container made of fired earth/pottery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 질그릇[a]은, 그 안에 그들 가운데 하나라도 떨어지면, 그 안에 있는 것은 무엇이든 부정해집니다. 그리고 그것을 깨뜨리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토기’나 ‘질항아리’로 옮길 수 있습니다. 히브리어는 구워 만든 흙 재질의 그릇을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  english_pob_choice: earthenware vessel
  chosen_korean: 질그릇
  alternatives_korean:
  - 토기
  - 점토 그릇
  - 도기 그릇
  lexicon: HALOT
  rationale: חֶרֶשׂ가 가리키는 흙으로 구워 만든 용기의 재질을 한국어 성경 관용어인 ‘질그릇’으로 자연스럽게 살렸습니다. 현대어로도 이해되며, 정결 규례의 재질적 구분을 유지합니다.
- source_word: אֶל תּוֹכֹו
  english_pob_choice: into which
  chosen_korean: 그 안에
  alternatives_korean:
  - 그 속에
  - 그 내부로
  lexicon: HALOT
  rationale: תּוֹךְ의 ‘내부/안’ 의미를 한국어로 가장 자연스럽게 옮겨, 동작의 방향과 결과를 분명히 했습니다.
- source_word: כֹּל אֲשֶׁר בְּתוֹכֹו
  english_pob_choice: everything that is in it
  chosen_korean: 그 안에 있는 것은 무엇이든
  alternatives_korean:
  - 그 속에 있는 모든 것은
  - 안에 있는 모든 것
  lexicon: HALOT
  rationale: 총괄적 의미를 살리되 현대 한국어 어순에 맞게 풀어, 내용물 전체가 영향을 받는다는 점을 분명히 했습니다.
- source_word: יִטְמָא
  english_pob_choice: shall become unclean
  chosen_korean: 부정해집니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정해질 것입니다
  - 부정한 것이 됩니다
  lexicon: HALOT
  rationale: 정결 규례 문맥의 상태 변화를 표현하기 위해 ‘부정하다’를 사용했고, 합쇼체 현재 서술형으로 규례의 효력을 직접적으로 전달했습니다.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  english_pob_choice: and you shall break it
  chosen_korean: 그리고 그것을 깨뜨리십시오
  alternatives_korean:
  - 그리고 그것을 깨십시오
  - 그리고 그것을 부수십시오
  lexicon: HALOT
  rationale: 명령문의 강도를 살리면서도 현대 한국어에서 자연스럽고 문맥에 맞게 ‘깨뜨리다’를 선택했습니다. 절차적 규례의 지시를 분명히 하기 위해 공손 명령형으로 옮겼습니다.
theological_decisions:
- issue: 정결/부정 표현의 한국어화
  chosen_reading: ‘부정해집니다’로 옮겨, 접촉으로 인한 의례적 부정 상태가 발생함을 직접적으로 표현했습니다.
  alternative_readings:
  - ‘더러워집니다’
  - ‘부정하게 됩니다’
  rationale: 레위기의 정결 문맥에서는 도덕적 오염보다 의례적 부정이 핵심이므로, 전통 교회어보다 규례 의미를 분명히 하는 표현을 택했습니다.
  doctrine_reference: 레위기 11장의 정결 규례 문맥
- issue: 명령형의 문체
  chosen_reading: ‘깨뜨리십시오’로 공손 명령형을 사용해 규례 전달의 직접성과 현대 한국어 문체를 함께 유지했습니다.
  alternative_readings:
  - ‘깨뜨려야 합니다’
  - ‘깨십시오’
  rationale: 본문의 צוו명령적 성격을 보존하면서도 표준어 합쇼체에 맞춰 자연스럽게 전달하기 위한 선택입니다.
  doctrine_reference: 문체/화법 일관성
