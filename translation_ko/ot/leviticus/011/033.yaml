  naturalness: 초안의 ‘모든 질그릇은, 그 안에 그들 가운데 하나라도 떨어지면’은 주어와 조건절의 결속이 다소 어색하고, ‘그들 가운데’의 지시 대상도 불명확합니다. 관계절을 앞에 두고 ‘그것들 가운데 하나’로 바꾸면 현대 표준어 합쇼체에서 자연스럽고 명료합니다.
  terminology: ‘질그릇’과 ‘부정해집니다’는 레위기의 재질 및 의례적 정결 문맥에 적절합니다. 각주 대안인 ‘질항아리’는 원문의 일반적인 용기 뜻을 불필요하게 좁히므로 더 넓은 표현으로 교체했습니다.
