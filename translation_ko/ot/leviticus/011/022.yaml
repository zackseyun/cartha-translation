  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
  footnotes:
  - marker: a
    text: The exact identification of the Hebrew insect names beyond 'locust' is uncertain; traditional renderings include 'bald locust' for סָּלְעָם and 'cricket' for חַרְגֹּל.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들 가운데서는 너희가 먹을 수 있습니다. 곧 그 종류대로의 메뚜기와, 그 종류대로의 대벌레와, 그 종류대로의 귀뚜라미와, 그 종류대로의 베짱이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기 나오는 히브리어 곤충 이름들은 정확한 종 동정이 확실하지 않으며, 전통 번역으로는 ‘대벌레’, ‘귀뚜라미’ 등이 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  english_pob_choice: These of them
  chosen_korean: 이것들 가운데서는
  alternatives_korean:
  - 이것들 중에서는
  - 그들 가운데서는
  lexicon: HALOT
  rationale: 허용되는 곤충들을 앞선 부정정결 목록 가운데서 다시 가려 말하는 표현이므로, ‘가운데서는’이 원문의 부분집합 의미를 자연스럽게 살립니다.
- source_word: תֹּאכֵלוּ
  english_pob_choice: you may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹어도 됩니다
  - 먹으십시오
  lexicon: HALOT
  rationale: 여기서는 명령보다 허용을 나타내므로, 현대 한국어에서 자연스러운 허용 표현으로 옮겼습니다.
- source_word: הַסָּלְעָם
  english_pob_choice: the bald locust
  chosen_korean: 대벌레
  alternatives_korean:
  - 대벌레목 곤충
  - 벌거벗은 메뚜기
  lexicon: HALOT
  rationale: 정확한 곤충 동정이 불확실하므로, 한국어에서 전통 번역으로 굳어진 이름을 택하되 확정적 분류어는 피했습니다.
- source_word: הַחַרְגֹּל
  english_pob_choice: the cricket
  chosen_korean: 귀뚜라미
  alternatives_korean:
  - 귀뚜라미류
  - 방아깨비
  lexicon: HALOT
  rationale: 원문이 가리키는 정확한 종은 불확실하지만, 일반 독자에게 가장 자연스러운 대응어는 ‘귀뚜라미’입니다.
- source_word: הֶחָגָב
  english_pob_choice: the grasshopper
  chosen_korean: 베짱이
  alternatives_korean:
  - 메뚜기
  - 풀벌레
  lexicon: HALOT
  rationale: 앞의 אַרְבֶּה를 ‘메뚜기’로 옮겼으므로, 같은 범주의 다른 이름은 한국어에서 구별되는 ‘베짱이’로 처리해 반복을 피했습니다.
theological_decisions:
- issue: 허용 진술의 문법적 뉘앙스
  chosen_reading: 명령형보다 허용형으로 번역해 정결 규례 안에서 먹어도 되는 범주를 분명히 했습니다.
  alternative_readings:
  - 너희는 먹을지니라
  - 너희가 먹을 것이다
  rationale: 히브리어 미완료형은 여기서 규범적 허용을 나타내므로, 현대 독자에게 오해 없이 전달되는 허용 표현이 적절합니다.
  doctrine_reference: 레위기 11장의 정결/부정결 규례
