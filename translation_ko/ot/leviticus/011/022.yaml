translation:
  language: ko
  text: 이것들 가운데서 너희가 먹을 수 있는 것은 각각 그 종류에 따른 메뚜기와 살암과 하르골과 하갑입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 메뚜기를 제외한 히브리어 곤충 이름들의 정확한 동정은 확실하지 않습니다. 살암은 전통적으로 ‘대머리메뚜기’, 하르골은 ‘귀뚜라미’ 등으로 번역되며, 하갑도 메뚜기류 곤충을 가리키는 말로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  english_pob_choice: These of them
  chosen_korean: 이것들 가운데서는
  alternatives_korean:
  - 이것들 중에서는
  - 그들 가운데서는
  lexicon: HALOT
  rationale: 허용되는 곤충들을 앞선 부정정결 목록 가운데서 다시 가려 말하는 표현이므로, ‘가운데서는’이 원문의 부분집합 의미를 자연스럽게 살립니다.
- source_word: תֹּאכֵלוּ
  english_pob_choice: you may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹어도 됩니다
  - 먹으십시오
  lexicon: HALOT
  rationale: 여기서는 명령보다 허용을 나타내므로, 현대 한국어에서 자연스러운 허용 표현으로 옮겼습니다.
- source_word: הַסָּלְעָם
  english_pob_choice: the bald locust
  chosen_korean: 대벌레
  alternatives_korean:
  - 대벌레목 곤충
  - 벌거벗은 메뚜기
  lexicon: HALOT
  rationale: 정확한 곤충 동정이 불확실하므로, 한국어에서 전통 번역으로 굳어진 이름을 택하되 확정적 분류어는 피했습니다.
- source_word: הַחַרְגֹּל
  english_pob_choice: the cricket
  chosen_korean: 귀뚜라미
  alternatives_korean:
