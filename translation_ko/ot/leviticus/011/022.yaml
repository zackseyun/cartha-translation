  source_fidelity: 히브리어는 앞 절의 날개 달린 떼 지어 다니는 곤충 가운데 먹도록 허용된 네 명칭을 열거하며, 각 명칭에 ‘그 종류에 따라’를 붙입니다. 초안은 허용의 뉘앙스와 네 항목의 구조를 대체로 반영했지만, סָּלְעָם을 ‘대벌레’로 특정한 것은 전통 영어의 ‘bald locust’와도 다르고 한국어 ‘대벌레’가 일반적으로 가리키는 곤충과도 달라 안전하지 않습니다. 불확실한 세 명칭은 음역으로 보존하는 것이 원문의 불확실성을 가장 잘 유지합니다.
  naturalness: ‘이것들 가운데서는’과 항목 나열 뒤의 ‘입니다’는 문장 연결이 다소 부자연스럽습니다. ‘이것들 가운데서 너희가 먹을 수 있는 것은 …입니다’라는 도입과 ‘각각 그 종류에 따른’이라는 병렬 표현이 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: אַרְבֶּה는 ‘메뚜기’로 옮길 수 있습니다. 반면 סָּלְעָם, חַרְגֹּל, חָגָב의 정확한 동정은 확정되지 않았으므로, ‘대벌레’, ‘귀뚜라미’, ‘베짱이’로 단정하기보다 ‘살암’, ‘하르골’, ‘하갑’으로 음역하고 각주에서 전통적 후보를 밝혀야 합니다. ‘그 종류에 따른’은 לְמִינוֹ/לְמִינֵהוּ의 분류 표현을 보존합니다.
