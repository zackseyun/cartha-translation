  - 방아깨비
  lexicon: HALOT
  rationale: 원문이 가리키는 정확한 종은 불확실하지만, 일반 독자에게 가장 자연스러운 대응어는 ‘귀뚜라미’입니다.
- source_word: הֶחָגָב
  english_pob_choice: the grasshopper
  chosen_korean: 베짱이
  alternatives_korean:
  - 메뚜기
  - 풀벌레
  lexicon: HALOT
  rationale: 앞의 אַרְבֶּה를 ‘메뚜기’로 옮겼으므로, 같은 범주의 다른 이름은 한국어에서 구별되는 ‘베짱이’로 처리해 반복을 피했습니다.
theological_decisions:
- issue: 허용 진술의 문법적 뉘앙스
  chosen_reading: 명령형보다 허용형으로 번역해 정결 규례 안에서 먹어도 되는 범주를 분명히 했습니다.
  alternative_readings:
  - 너희는 먹을지니라
  - 너희가 먹을 것이다
  rationale: 히브리어 미완료형은 여기서 규범적 허용을 나타내므로, 현대 독자에게 오해 없이 전달되는 허용 표현이 적절합니다.
  doctrine_reference: 레위기 11장의 정결/부정결 규례
