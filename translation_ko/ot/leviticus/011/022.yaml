  to: 이것들 가운데서 너희가 먹을 수 있는 것은 각각 그 종류에 따른 메뚜기와 살암과 하르골과 하갑입니다.[a]
  rationale: 허용을 나타내는 תֹּאכֵלוּ를 ‘먹을 수 있는 것’으로 유지하고, 네 항목 모두에 적용되는 ‘그 종류에 따른’을 보존했습니다. 비교적 확실한 אַרְבֶּה만 ‘메뚜기’로 옮겼으며, 동정이 불확실한 나머지 세 이름은 본문에서 음역하고 각주에 전통적 번역을 제시했습니다. 이는 영어 POB의 불확실성 표지보다도 원문의 어휘적 모호성을 더 직접적으로 보존합니다.
  reviewer_model: gpt-5.6-terra
