source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
  footnotes:
  - marker: a
    text: The precise identities of חֹלֶד and צָב are uncertain; traditional renderings include 'weasel' or 'mole' for חֹלֶד, and 'tortoise' or simply 'lizard' for צָב.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 땅 위에서 우글거리는 것들 가운데 너희에게 부정한 것들은 다음과 같습니다. 두더지쥐와 쥐와 큰 도마뱀과 그 종류입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹלֶד과 צָב가 가리키는 정확한 동물은 불확실합니다. 전통적 번역으로는 חֹלֶד에 '족제비' 또는 '두더지', צָב에 '육지거북' 또는 단순히 '도마뱀'이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לָכֶם
  english_pob_choice: And these are ... for you
  chosen_korean: 그리고 이것은 ... 너희에게
  alternatives_korean:
  - 그리고 이것들은 ... 너희에게
  - 이것은 ... 너희에게
  lexicon: HALOT
  rationale: 히브리어 זֶה는 단수형이지만 뒤에 목록이 이어지므로 한국어에서는 목록 소개용 단수 지시어 '이것은'을 쓰고, 수신자를 분명히 하는 לָכֶם은 '너희에게'로 옮겼습니다.
- source_word: הַטָּמֵא
  english_pob_choice: unclean
  chosen_korean: 부정한
  alternatives_korean:
  - 더러운
  - 정결하지 않은
  lexicon: HALOT
  rationale: 레위기의 정결 규례 문맥에서는 '부정한'이 의례적 부정함을 가장 직접적으로 드러내며, 단순한 위생적 의미의 '더러운'과 구별됩니다.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  english_pob_choice: among the swarming things that swarm
  chosen_korean: 땅에서 우글거리는 기는 것들 가운데
  alternatives_korean:
  - 땅에서 우글거리는 것들 가운데
  - 땅에서 기어 다니는 것들 가운데
  lexicon: HALOT
  rationale: שֶׁרֶץ/שֹׁרֵץ의 반복된 어근은 '우글거리는'으로 살리고, 범주 표현은 한국어 성경어법에 맞게 '기는 것들'로 자연스럽게 옮겼습니다.
- source_word: הַחֹלֶד וְהָעַכְבָּר וְהַצָּב
  english_pob_choice: the mole-rat, and the mouse, and the great lizard
  chosen_korean: 두더쥐와 쥐와 큰 도마뱀
  alternatives_korean:
  - 두더지와 쥐와 큰 도마뱀
  - 족제비와 쥐와 큰 도마뱀
  - 두더쥐와 쥐와 큰 거북
  lexicon: HALOT
  rationale: חֹלֶד과 צָב는 정확한 종 식별이 불확실하므로, 본문 문맥상 땅 위를 기는 작은 동물군에 맞는 '두더쥐'와 '큰 도마뱀'을 택했고, 전통적 대안은 주석으로 남길 수 있게 했습니다.
- source_word: לְמִינֵהוּ
  english_pob_choice: according to its kind
  chosen_korean: 그 종류대로입니다
  alternatives_korean:
  - 그 종류에 따라입니다
  - 그 종류대로
  lexicon: HALOT
  rationale: מין의 분류 관용구는 한국어에서 '그 종류대로'가 가장 간결하고 자연스럽습니다. 종결을 살려 문장 흐름에 맞게 '입니다'를 덧붙였습니다.
theological_decisions:
- issue: 의례적 부정함의 번역 강도
  chosen_reading: טָמֵא를 '부정한'으로 직역해 정결/부정 규례의 법적·예배적 구분을 유지했습니다.
  alternative_readings:
  - '''정결하지 않은''으로 완화'
  - '''부정한 것''으로 명사화'
  rationale: 이 절은 음식법의 규정 문맥이므로, 의미를 약화시키지 않고 규례적 범주를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 레위기 11장 정결 규례
