  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 히브리어의 일반적 주어(כָּל הַנֹּגֵעַ)는 한국어에서 ‘누구든지 … 만지면’으로 옮기는 편이 더 자연스럽고, 뒤의 미완료형 יִטְמָא가 나타내는 결과도 ‘부정하게 될 것입니다’로 통일하는 것이 좋습니다. ‘이것들로 인해’는 וּלְאֵלֶּה의 원인·매개적 독법을 자연스럽게 살리면서 각주의 대안 가능성을 보존합니다.
  naturalness: 초안의 ‘누구든지 그들의 사체를 만지는 자는’은 ‘누구든지’와 ‘만지는 자’가 겹쳐 다소 부자연스럽습니다. 또한 동물을 가리킬 때 ‘그들의 사체’보다 ‘그 동물들의 사체’가 한국어에서 지시 대상이 더 명확합니다. ‘부정합니다’보다 ‘부정하게 될 것입니다’가 이 규정문의 결과 표현에 더 매끄럽고 앞 절과도 평행을 이룹니다.
  terminology: ‘부정하다/부정하게 되다’는 의례적 부정의 범주를 적절히 보존합니다. נְבֵלָה에는 ‘사체’가 적합하며, 도덕적 함의를 덧붙이지 않습니다.
