  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
  footnotes:
  - marker: a
    text: Or 'And concerning these you shall become unclean.' The opening phrase may introduce the following category more generally rather than strictly instrumentally.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their carcass' uses a singular noun with a plural suffix; English may also be rendered 'their carcasses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이것들로 인해 여러분은 부정하게 될 것입니다. 누구든지 그 동물들의 사체를 만지면 저녁까지 부정하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이것들로 인해’로도, ‘이것들에 관하여’로도 옮길 수 있습니다. 이 표현은 다음 규정의 범주를 도입하는 말일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 동물들의 사체’에 해당하는 히브리어는 단수 명사에 복수 접미사가 붙은 형태입니다. 문맥에 따라 ‘그 동물들의 사체들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  english_pob_choice: And by these
  chosen_korean: 그리고 이들로 말미암아
  alternatives_korean:
  - 그리고 이들에 관하여
  - 그리고 이들로 인해
  lexicon: HALOT
  rationale: לְ이 붙은 지시어는 여기서 다음 부정 규정의 범위/원인을 여는 표현으로 볼 수 있어, 한국어에서는 원인·매개를 드러내는 ‘말미암아’가 자연스럽고 소스의 기능을 잘 살립니다.
- source_word: תִּטַּמָּאוּ
  english_pob_choice: you shall become unclean
  chosen_korean: 부정하게 될 것입니다
  alternatives_korean:
  - 부정하게 됩니다
  - 더럽혀질 것입니다
  lexicon: HALOT
  rationale: טמא는 도덕적 타락이 아니라 의례적 부정을 뜻하므로, ‘더럽다’보다 ‘부정하다’를 택해 성결 규정의 범주를 보존했습니다.
- source_word: נִבְלָה
  english_pob_choice: their carcass
  chosen_korean: 그들의 사체
  alternatives_korean:
  - 그들의 시체
  - 그들의 죽은 몸
  lexicon: HALOT
  rationale: 부정 규정의 맥락에서 נבלה는 죽은 동물의 사체를 가리키므로, 사람 시신에 흔히 쓰는 ‘시체’보다 중립적인 ‘사체’가 더 정확합니다.
- source_word: עַד הָעָרֶב
  english_pob_choice: until the evening
  chosen_korean: 저녁까지
  alternatives_korean:
  - 해질 때까지
  - 저녁 시간까지
  lexicon: HALOT
  rationale: 성결법의 관용적 시간표현을 한국어 법문체로 자연스럽게 옮기되, 정결 상태가 해질 때까지 지속된다는 점을 분명히 했습니다.
theological_decisions:
- issue: טמא의 의미를 도덕적 죄책으로 오해하지 않게 하는 번역
  chosen_reading: ‘부정하게 되다/부정하다’로 옮겨 의례적 부정을 유지합니다.
  alternative_readings:
  - 더럽혀지다
  - 오염되다
  rationale: 이 절은 접촉에 따른 제의적 상태를 규정하므로, 윤리적 비난을 암시할 수 있는 표현은 피하고 성결-부정 범주를 그대로 드러내는 번역을 택했습니다.
  doctrine_reference: 레위기 11장의 정결/부정 규례
