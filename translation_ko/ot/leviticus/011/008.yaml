base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
  footnotes:
  - marker: a
    text: Or 'their dead bodies.' The Hebrew term refers to the carcass of an animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그것들의 고기를 먹지 말고, 그것들의 사체를 만지지도 말아야 합니다. 그것들은 너희에게 부정한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사체’는 여기의 히브리어 נְבֵלָה가 가리키는 죽은 동물의 몸을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  english_pob_choice: any of their flesh
  chosen_korean: 그들의 고기
  alternatives_korean:
  - 그들의 살
  - 그들의 육체
  lexicon: HALOT
  rationale: 여기서는 חלק적 금지를 자연스럽게 옮기되, 레위기의 음식 금지 문맥에 맞는 ‘고기’로 풀어 한국어 가독성을 살렸습니다.
- source_word: וּבְנִבְלָתָם
  english_pob_choice: their carcasses
  chosen_korean: 그들의 사체
  alternatives_korean:
  - 그들의 시체
  - 그들의 죽은 몸
  lexicon: HALOT
  rationale: נְבֵלָה는 죽은 동물의 사체를 가리키므로, 사람의 시체를 연상시키는 표현보다 ‘사체’가 더 정확합니다.
- source_word: לֹא תִגָּעוּ
  english_pob_choice: you shall not touch
  chosen_korean: 만지지도 말아야 합니다
  alternatives_korean:
  - 만지지 말아야 합니다
  - 접촉해서는 안 됩니다
  lexicon: HALOT
  rationale: 금지의 강도를 살리면서도 현대 한국어 법령체에 어울리게 ‘-지도 말아야 합니다’를 택했습니다.
- source_word: טְמֵאִים הֵם לָכֶם
  english_pob_choice: they are unclean to you
  chosen_korean: 그들은 너희에게 부정합니다
  alternatives_korean:
  - 그들은 너희에게 부정합니다
  - 그들은 너희에게 부정한 것입니다
  lexicon: HALOT
  rationale: טָמֵא의 제의적 범주를 ‘부정하다’로 옮겨, 단순한 도덕적 악보다 정결/부정의 구분을 드러냈습니다.
theological_decisions:
- issue: 레위기 정결 규정의 의미 범주
  chosen_reading: 이 절은 음식 금지와 접촉 금지를 통해 이스라엘의 정결 범주를 제시하며, 이를 도덕적 오염이나 후대 신학 논쟁으로 미리 확장하지 않았습니다.
  alternative_readings:
  - ‘부정한 것입니다’처럼 정결 상태를 더 명시적으로 풀어 쓰는 방식
  rationale: 본문 자체는 제의적 정결 규범을 말하므로, 독자가 오해하지 않도록 범주를 보존하되 추가 해석은 억제했습니다.
  doctrine_reference: 정결법의 제의적 성격을 보존하고 본문 밖 결론을 유보합니다.
