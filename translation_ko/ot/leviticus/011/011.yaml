  source_fidelity: The draft conveys the twofold שֶׁקֶץ wordplay and the prohibitions, but its imperative forms do not meet the required modern formal-polite register. The revision retains the plural subjects, the partitive sense of 'their flesh,' and the instruction to treat their carcasses as detestable.
  naturalness: ‘가증한 것이 되리니 … 여기라’ is archaic, non-honorific biblical diction rather than modern 합쇼체. ‘혐오스러운 것… 여겨야 합니다’ is natural modern formal Korean while retaining the legal-prescriptive force.
  terminology: ‘가증한’ can carry a stronger moralized or traditional-religious sense in contemporary Korean. ‘혐오스러운’ more directly communicates the ritual-revulsion sense in this dietary context; the footnote records the viable alternative and the ritual context. ‘사체’ accurately denotes animal carcasses here.
  issues:
