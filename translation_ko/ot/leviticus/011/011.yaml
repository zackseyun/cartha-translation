    issue: Register is not modern formal-polite (합쇼체).
    rationale: The draft uses ‘되리니,’ ‘먹지 말며,’ and ‘여기라,’ which are archaic/plain biblical imperative forms, contrary to the requested target register.
  - severity: low
    issue: The rendering ‘가증한’ may over-associate the dietary term with moral condemnation.
    rationale: שֶׁקֶץ in this context marks ritual abhorrence. ‘혐오스러운’ is clearer for modern readers, with a note preserving ‘가증한’ as an alternative.
