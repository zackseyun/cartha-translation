source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'among all the swarming creatures.' The Hebrew term refers broadly to small creatures that swarm or teem.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in their death'; the sense is contact with them in their dead state.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 모든 기어 다니는 것[a] 가운데서 너희에게 부정한 것들입니다. 그것들이 죽어 있을 때[b] 그것들에 닿는 사람은 누구든지 저녁까지 부정하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘기어 다니는 것’은 떼 지어 움직이거나 번성하는 작은 생물 전반을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 죽음 안에서’입니다. 여기서는 그것들이 죽어 있는 상태, 곧 그 사체에 닿는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטְּמֵאִים
  english_pob_choice: unclean
  chosen_korean: 부정한 것들
  alternatives_korean:
  - 더러운 것들
  - 불결한 것들
  lexicon: HALOT
  rationale: 레위기의 정결 문맥에서 ritual impurity를 가리키므로, 관용적이면서도 제의적 의미를 유지하는 ‘부정한 것들’을 택했습니다.
- source_word: בְּכָל הַשָּׁרֶץ
  english_pob_choice: among all the swarming things
  chosen_korean: 모든 기어 다니는 것 중에서
  alternatives_korean:
  - 모든 기어 다니는 피조물 가운데
  - 모든 떼지어 다니는 것들 중에서
  lexicon: HALOT
  rationale: שׁרץ의 넓은 범위를 살리되, 한국어에서 과도하게 동물학적으로 좁히지 않기 위해 ‘기어 다니는 것’을 사용했습니다.
- source_word: כָּל הַנֹּגֵעַ
  english_pob_choice: Everyone who touches
  chosen_korean: 닿는 사람은 누구든지
  alternatives_korean:
  - 만지는 사람은 누구든지
  - 접촉하는 사람은 누구든지
  lexicon: HALOT
  rationale: 일반적·분배적 의미를 살리면서 현대 한국어로 자연스럽게 옮기기 위해 ‘닿는 사람은 누구든지’로 번역했습니다.
- source_word: בְּמֹתָם
  english_pob_choice: when they are dead
  chosen_korean: 그것들이 죽은 상태일 때
  alternatives_korean:
  - 그것들이 죽었을 때
  - 그 시체에 닿을 때
  lexicon: HALOT
  rationale: 단순한 ‘죽음의 순간’이 아니라 죽은 사체 상태를 가리키므로, POB의 설명을 반영해 상태성을 드러냈습니다.
theological_decisions:
- issue: 부정 규정의 제의적 성격
  chosen_reading: ‘부정한 것들’과 ‘부정하게 됩니다’로 정결/부정의 제의적 상태를 유지했습니다.
  alternative_readings:
  - 도덕적 더러움으로 완화하는 번역
  - 단순한 위생 규정처럼 옮기는 번역
  rationale: 본문은 도덕 판단이나 위생 규정보다 의식적 정결 상태를 다루므로, 레위기 본문의 제의적 긴장을 보존했습니다.
  doctrine_reference: 레위기 정결법 문맥
