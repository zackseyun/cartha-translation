revisions:
- from: 다만 날아다니는 모든 기는 것 가운데서도, 네 발로 기어 다니는 것들 중에는, 그 발 위에 마디 있는 다리가 있어 그것들로 땅 위를 뛰는 것들은 이것만은 먹을 수 있습니다.[a][b]
  to: 다만 날아다니는 모든 기는 것 가운데 네 발로 다니는 것 중에서, 발 위에 땅에서 뛰기 위한 다리가 있는 것은 먹을 수 있습니다.[a][b]
  rationale: 예외로 허용되는 대상의 범위를 자연스러운 관계절로 정리하고, 원문에 없는 ‘기어’의 뉘앙스를 제거했습니다. 또한 도약용 특수 다리라는 כְרָעַיִם의 문맥상 기능을 본문과 각주에 정확히 반영했으며, 케티브/전통 독법의 본문비평적 불일치도 중립적으로 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:58Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 허용 규정은 대체로 잘 반영했습니다. 그러나 히브리어의 관계절은 ‘그러한 것들’을 수식하며, 현 번역의 ‘것들 중에는 … 것들은 이것만은’은 지시 범위와 문장 구조를 불필요하게 어색하게 만듭니다. 또한 ‘네 발로 기어 다니는’은 הַהֹלֵךְ(‘다니는/걷는’)에 ‘기다’라는 의미를 더합니다.
  naturalness: 현 문장은 쉼표가 과도하고 ‘중에는 … 것들은 이것만은’이라는 중첩 구조가 현대 표준 한국어로 부자연스럽습니다. 간결하게 관계절을 연결하면 합쇼체 규정 문장으로 자연스럽습니다.
  terminology: ‘날아다니는 기는 것’은 שֶׁרֶץ הָעוֹף의 넓은 범주를 무리 없이 나타냅니다. כְרָעַיִם은 이 문맥에서 도약에 쓰이는 특수한 뒷다리를 가리키므로, ‘마디 있는 다리’만으로는 기능적 의미가 충분히 드러나지 않습니다. 본문의 ‘뛰기 위한 다리’와 각주의 대안을 함께 두는 편이 더 명료합니다.
  issues:
  - severity: medium
    issue: 문장 구조와 지시어 ‘이것만은’
    rationale: אֶת־זֶה는 예외로 허용되는 부류를 도입합니다. ‘것들 중에는 … 것들은 이것만은’은 한국어 문법상 어색하며, ‘이것만은’의 선행 범위도 불명확합니다.
  - severity: low
    issue: ‘기어 다니는’의 의미 과잉
    rationale: הַהֹלֵךְ עַל־אַרְבַּע은 문자적으로 ‘네 발로 다니는’입니다. ‘기어’는 원문에 없는 이동 방식의 뉘앙스를 추가합니다.
  - severity: medium
    issue: כְרָעַיִם의 기능적 의미
    rationale: 이 단어는 문맥상 땅에서 뛰도록 쓰이는 특수한 다리를 뜻합니다. ‘마디 있는 다리’는 가능한 해석이지만, 본문에서 도약 기능을 더 직접적으로 표현하는 것이 원문과 영어 감사 기록에 더 부합합니다.
  - severity: low
    issue: 본문비평 각주의 표현
    rationale: ‘히브리어 본문 전통에는’보다 ‘히브리어 자음 본문은’이 케티브(לא)와 전통 독법(לו)의 관계를 더 정확히 설명합니다.
  revised_text: 다만 날아다니는 모든 기는 것 가운데 네 발로 다니는 것 중에서, 발 위에 땅에서 뛰기 위한 다리가 있는 것은 먹을 수 있습니다.[a][b]
