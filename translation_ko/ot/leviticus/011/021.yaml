source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
  footnotes:
  - marker: a
    text: Hebrew textual tradition reads literally 'which not legs'; the traditional reading understood by context and ancient versions is 'which have legs.'
    reason: textual_variant
  - marker: b
    text: Or 'leaping legs' for 'jointed legs'; the Hebrew refers to the specialized hind legs used for hopping.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 날아다니는 모든 기는 것 가운데서도, 네 발로 기어 다니는 것들 중에는, 그 발 위에 마디 있는 다리가 있어 그것들로 땅 위를 뛰는 것들은 이것만은 먹을 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문 전통에는 문자적으로 ‘아니 다리들’로 보이지만, 문맥과 옛 번역들은 ‘다리가 있는’으로 이해합니다.
    reason: textual_variant
  - marker: b
    text: ‘마디 있는 다리’는 여기의 특별한 뒷다리를 가리키는 말로, 문자적으로는 ‘뛰는 다리’ 또는 ‘뛰기 위한 다리’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 다만
  alternatives_korean:
  - 그러나
  - 오직
  - 하지만
  lexicon: HALOT
  rationale: 앞 절들의 금지에 대한 예외를 분명히 드러내는 역접/제한 표지로, 합쇼체에서 자연스럽고 간결한 ‘다만’이 적절합니다.
- source_word: שֶׁרֶץ הָעוֹף
  english_pob_choice: the swarming things that fly
  chosen_korean: 날아다니는 모든 기는 것
  alternatives_korean:
  - 날아다니는 기는 것들
  - 날개 달린 기는 것
  - 나는 모든 기는 것
  lexicon: HALOT
  rationale: שֶׁרֶץ의 ‘기어 다니는/우글거리는’ 뉘앙스를 살리면서, הָעוֹף를 ‘날아다니는’으로 풀어 곤충류의 넓은 범주를 유지했습니다.
- source_word: כְרָעַיִם
  english_pob_choice: jointed legs
  chosen_korean: 마디 있는 다리
  alternatives_korean:
  - 관절 있는 다리
  - 뛰는 다리
  - 길게 꺾인 다리
  lexicon: HALOT
  rationale: 이 문맥에서 특정한 뒷다리의 기능적 특징을 가리키므로, 해부학적으로 이해하기 쉬운 ‘마디 있는 다리’로 옮겼습니다.
theological_decisions:
- issue: 허용 표현의 법적 성격
  chosen_reading: ‘먹을 수 있습니다’로 옮겨 금지 조항에 대한 예외적 허용을 분명히 했습니다.
  alternative_readings:
  - ‘먹을 수 있다’
  - ‘먹어도 된다’
  - ‘먹도록 하라’
  rationale: 히브리어 תֹּאכְלוּ는 여기서 허용을 나타내므로, 단순 정보 전달보다 규정상 허용을 드러내는 한국어가 더 정확합니다.
  doctrine_reference: 레위기 11장의 정결 규례 이해
