id: LEV.11.44
reference: Leviticus 11:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
  footnotes:
  - marker: a
    text: Or 'Sanctify yourselves.' The Hebrew verb is reflexive, meaning to set yourselves apart as holy.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not make yourselves unclean with any creeping thing that moves on the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼, 곧 여러분의 하나님입니다[a]. 그러므로 스스로를 거룩하게 구별하고 거룩하게 되십시오. 나는 거룩하기 때문입니다[b]. 그리고 땅 위를 기어 다니는 어떤 떼 지은 생물로도 여러분 자신을 더럽히지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 하나님’. 히브리어는 언약적 소유격을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅 위를 기어 다니는 어떤 기는 생물로도 여러분 자신을 더럽히지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה / אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 나는 야훼, 곧 여러분의 하나님입니다
  alternatives_korean:
  - 나는 주님, 곧 여러분의 하나님입니다
  - 나는 야훼, 여러분의 하나님입니다
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, אֱלֹהֵיכֶם은 언약 문맥에서 단수 의미의 ‘여러분의 하나님’으로 자연스럽게 풀었습니다.
- source_word: וְהִתְקַדִּשְׁתֶּם
  english_pob_choice: Consecrate yourselves therefore
  chosen_korean: 그러므로 스스로를 거룩하게 구별하고
  alternatives_korean:
  - 그러므로 스스로를 성별하고
  - 그러므로 스스로를 성결하게 하고
  lexicon: HALOT
  rationale: 히트파엘의 반사적 용법을 반영해 ‘스스로를’로 옮겼고, קדש의 제의적·윤리적 강도를 살리기 위해 ‘거룩하게 구별하다’로 번역했습니다.
- source_word: וִהְיִיתֶם קְדֹשִׁים / קָדוֹשׁ
  english_pob_choice: and be holy / for I am holy
  chosen_korean: 거룩하게 되십시오. 나는 거룩하기 때문입니다
  alternatives_korean:
  - 거룩하십시오. 나는 거룩하기 때문입니다
  - 거룩한 사람들이 되십시오. 나는 거룩하기 때문입니다
  lexicon: HALOT
  rationale: 동일 어근 반복을 한국어에서도 유지해 하나님과 백성 사이의 거룩함의 연결을 분명히 했습니다.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  english_pob_choice: And you shall not defile yourselves
  chosen_korean: 여러분 자신을 더럽히지 마십시오
  alternatives_korean:
  - 여러분의 영혼을 더럽히지 마십시오
  - 여러분을 부정하게 하지 마십시오
  lexicon: HALOT
  rationale: נפשׁתיכם은 여기서 신학적 ‘영혼’보다 인칭적 자기지시로 기능하므로, 본문 의미를 과장하지 않도록 ‘여러분 자신’으로 옮겼습니다.
- source_word: שֶּׁרֶץ הָרֹמֵשׂ עַל הָאָרֶץ
  english_pob_choice: any swarming thing that moves on the earth
  chosen_korean: 땅 위를 기어 다니는 어떤 떼 지은 생물
  alternatives_korean:
  - 땅 위를 움직이는 어떤 떼 지은 것
  - 땅 위를 기어 다니는 어떤 기어 다니는 것
  lexicon: HALOT
  rationale: שׁרץ는 ‘떼 지은/무리 지은’ 생물군을, רמשׂ는 땅 가까이의 움직임을 가리키므로 두 요소를 함께 살려 번역했습니다.
theological_decisions:
- issue: 거룩함 명령과 하나님의 거룩함의 연결
  chosen_reading: ‘거룩하게 구별하고 거룩하게 되십시오’로 같은 어근을 살려, 하나님의 거룩하심이 백성의 요구의 근거임을 드러냈습니다.
  alternative_readings:
  - ‘성별하고 성결해지십시오’로 분리
  - ‘거룩한 사람이 되십시오’로 완화
  rationale: 본문은 קדש 어근의 반복을 통해 언약적 모방을 요구하므로, 한국어에서도 반복을 유지하는 편이 신학적 상관관계를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: ‘여러분 자신’의 번역과 인간 이해
  chosen_reading: נפשׁתיכם을 ‘여러분 자신’으로 옮겨, 이 구절에 없는 영혼-육체 이분법을 도입하지 않았습니다.
  alternative_readings:
  - ‘여러분의 영혼’
  - ‘여러분의 생명’
  rationale: 문맥상 금지의 초점은 부정한 생물과의 접촉으로 인한 부정함이며, 용어를 인격 전체에 대한 자기지시로 처리하는 것이 가장 안전합니다.
  doctrine_reference: Affirmations / Never import doctrinal claims the text does not make
