review_pass:
  verdict: revise
  source_fidelity: 원문의 관사 붙은 분사구문은 일반 규정의 주어이므로 ‘그 동물들의 주검을 나르는 사람은’으로 자연스럽게 옮길 수 있습니다. נִבְלָתָם의 복수 소유 접미사와 집합적 단수 가능성은 본문 및 각주에 보존했습니다. טָמֵא는 도덕적 비난이 아닌 의례적 상태를 가리키므로 ‘부정해질 것입니다/부정한 것입니다’로 일관되게 번역했습니다.
  naturalness: 초안의 ‘누구든지 그들의 주검을 옮기는 사람은’은 ‘누구든지’와 ‘사람은’이 중복되어 한국어 문장 구조가 부자연스럽습니다. 또한 ‘부정할 것입니다’는 현대 한국어에서 ‘부정하다’(否定하다)로 읽히기 쉽고 의례적 상태를 뜻하는 서술로는 부정확합니다.
  terminology: ‘주검’, ‘옷을 빨다’, ‘부정하다’는 이 문맥에 적절합니다. 다만 상태 변화는 ‘부정해질 것입니다’로, 최종 판정은 ‘부정한 것입니다’로 표현하여 의례 용어의 의미와 현대적 명료성을 확보했습니다.
  issues:
  - severity: medium
    issue: 주어 구성의 중복
    rationale: ‘누구든지 … 사람은’은 동일한 일반 주어를 이중으로 표지하여 비문에 가깝습니다.
  - severity: high
    issue: ‘부정할 것입니다’의 의미 및 문법상 모호성
    rationale: 여기서 טָמֵא는 의례적으로 부정한 상태가 되는 것을 뜻합니다. ‘부정할 것입니다’는 한국어에서 부인·반박 행위로 이해될 수 있으므로 ‘부정해질 것입니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘여러분에게 부정합니다’의 서술 어색함
    rationale: 상태 형용사적 술어로 ‘여러분에게 부정한 것입니다’가 더 자연스럽고 원문의 선언적 판정을 잘 반영합니다.
  revised_text: 그 동물들의 주검을 나르는 사람은 자기 옷을 빨아야 하며, 저녁까지 부정해질 것입니다[a]. 그것들은 여러분에게 부정한 것입니다.
