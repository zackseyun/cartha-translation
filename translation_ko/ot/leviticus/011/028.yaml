  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
  footnotes:
  - marker: a
    text: Or 'their carcasses.' The Hebrew may be understood distributively of the animals in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 그들의 주검을 옮기는 사람은 자기 옷을 빨아야 하며 저녁까지 부정할 것입니다[a]. 그것들은 여러분에게 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 주검들’. 히브리어는 문맥상 각 동물을 분배적으로 가리키는 것으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  english_pob_choice: Whoever carries
  chosen_korean: 누구든지 … 옮기는 사람
  alternatives_korean:
  - 누구든지 … 드는 사람
  - 그것을 운반하는 사람
  lexicon: HALOT
  rationale: 분사구문을 법령형 일반 규정으로 살려 ‘누구든지’로 옮기고, 한국어에서는 자연스러운 보편 조건문으로 처리했습니다.
- source_word: נִבְלָתָם
  english_pob_choice: their carcass
  chosen_korean: 그들의 주검
  alternatives_korean:
  - 그들의 시체
  - 그들의 사체
  lexicon: HALOT
  rationale: נְבֵלָה는 부정한 동물의 ‘사체/주검’을 가리키므로, 법조문 맥락에서 비교적 직역성이 있는 ‘주검’을 택했습니다. 영어의 단수 집합적 표현을 한국어에서도 무리 없이 반영했습니다.
- source_word: יְכַבֵּס בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨아야 하며
  alternatives_korean:
  - 자기 옷을 빨아야 하고
  - 자기 의복을 빨아야 하며
  lexicon: HALOT
  rationale: 법규의 의무를 나타내는 עתיד형을 한국어 의무 표현 ‘-아야 하며’로 옮겼고, ‘옷’은 현대 독자가 이해하기 쉬우면서도 원문의 의미를 보존합니다.
- source_word: וְטָמֵא
  english_pob_choice: and be unclean
  chosen_korean: 부정할 것입니다
  alternatives_korean:
  - 부정하게 됩니다
  - 부정합니다
  lexicon: HALOT
  rationale: 의식적 상태의 결과를 한국어에서 자연스럽게 표현하되, 지속 상태보다 판정 결과를 드러내기 위해 ‘부정하다’의 상태용법을 사용했습니다.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  english_pob_choice: They are unclean for you
  chosen_korean: 그것들은 여러분에게 부정합니다
  alternatives_korean:
  - 그것들은 여러분에게 부정한 것입니다
  - 그것들은 여러분에게 부정합니다
  lexicon: HALOT
  rationale: לָכֶם을 ‘여러분에게’로 옮겨 공동체 전체에 대한 규정을 분명히 했고, טמא의 기술용어는 일관되게 ‘부정하다’로 유지했습니다.
theological_decisions:
- issue: חוקרי טהרה의 טמא 번역 일관성
  chosen_reading: ‘부정하다/부정’로 일관하여 의식적 부정의 기술 용어를 유지했습니다.
  alternative_readings:
  - ‘더럽다/더러움’
  - ‘불결하다/불결함’
  rationale: 레위기 정결법의 טמא는 도덕적 죄책보다 의식적 상태를 가리키므로, 한국어에서도 기술 용어로 일관되게 처리하는 것이 원문 기능을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
