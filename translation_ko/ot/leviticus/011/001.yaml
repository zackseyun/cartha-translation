  - 주
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 이를 직함으로 대체하지 않고 고유명사로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
