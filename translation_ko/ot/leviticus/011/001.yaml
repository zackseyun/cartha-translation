lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여
  alternatives_korean:
  - 말하여
  - 이르시어
  lexicon: HALOT
  rationale: 하나님의 공식적 발화 시작을 자연스러운 합쇼체로 살리되, 단순한 '말하다'보다 격식 있는 '말씀하다'를 택해 서술의 엄중함을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명문을 번역 전통의 대체 호칭이 아닌 고유명사로 드러내기 위해 '야훼'를 사용했습니다.
- source_word: וְאֶל
  english_pob_choice: and to
  chosen_korean: 와
  alternatives_korean:
  - 그리고 ~에게
  - 및
  lexicon: HALOT
  rationale: 모세와 아론이 함께 수신자임을 드러내면서도 한국어 문장 흐름을 해치지 않도록 연접 형태로 처리했습니다.
- source_word: לֵאמֹר אֲלֵהֶם
  english_pob_choice: saying to them
  chosen_korean: 그들에게 이르시기를
  alternatives_korean:
  - 말하여 이르시기를
  - 그들에게 말씀하시기를
  lexicon: HALOT
  rationale: 히브리어의 발화 도입 공식과 직접목적어 '그들에게'를 살리되, 한국어에서는 종결되지 않은 인용 도입 구조로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
