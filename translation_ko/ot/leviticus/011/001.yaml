  source_fidelity: 히브리어는 야훼가 모세와 아론 두 사람에게 말씀하신 뒤, 이어지는 발화를 도입하는 공식 표현(‘말하여 그들에게 이르시기를’)입니다. 수정안은 두 수신자와 발화 도입을 모두 보존합니다.
  naturalness: 초안의 ‘말씀하여 이르시기를, 그들에게’는 ‘그들에게’의 위치가 뒤바뀌어 문법적으로 미완성이며, ‘말씀하여 이르시기를’도 부자연스럽게 중첩됩니다. ‘말씀하시고 그들에게 이르시기를,’은 현대 한국어 성서 문체로 자연스럽습니다.
  terminology: יהוה는 프로젝트 결정에 따라 ‘야훼’로 유지했습니다. 모세와 아론도 표준 한국어 성서 인명 표기입니다. 각주에서 영어 전통 번역어를 한국어 독자가 이해할 수 있도록 ‘주’로 제시했습니다.
  issues:
  - severity: high
    issue: ‘그들에게’가 인용 도입구 뒤에 놓여 문장이 비문이 되었습니다.
    rationale: לֵאמֹר אֲלֵהֶם은 ‘그들에게 이르시기를’의 순서로 옮겨야 하며, 현 초안은 절 끝에 고립된 ‘그들에게[a]’를 남깁니다.
  - severity: low
    issue: 각주의 전통적 번역어가 영어 ‘the LORD’로만 제시되어 있습니다.
    rationale: 한국어 번역의 각주에서는 통상 대응어인 ‘주’를 제시하는 편이 자연스럽고 독자에게 명확합니다.
  revised_text: 야훼께서 모세와 아론에게 말씀하시고 그들에게 이르시기를,
  revised_footnotes:
