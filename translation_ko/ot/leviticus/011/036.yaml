  chosen_korean: 그것의 사체
  alternatives_korean:
  - 그 사체
  - 그들의 사체
  - 죽은 시체
  lexicon: HALOT
  rationale: 네뷸라(사체)는 동물의 죽은 몸을 가리키며, 문맥상 앞에서 언급된 부정한 짐승들을 집합적으로 받습니다. 한국어 대명사는 집합적 지시를 반영해 ‘그것의’로 처리했습니다.
