  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
  footnotes:
  - marker: a
    text: Or 'a gathering of water' or 'a pool of water.' The Hebrew phrase מִקְוֵה מַיִם refers to water collected together in a spring or cistern.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나[a] 샘이나 물을 모아 두는 물웅덩이는 깨끗합니다. 그러나 그것의 사체를 만지는 자는 부정하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 모임’ 혹은 ‘물의 저장소’로 볼 수 있습니다. 히브리어 מִקְוֵה מַיִם는 샘이나 물웅덩이에 모여 있는 물을 가리킵니다.
    reason: lexical_alternative
