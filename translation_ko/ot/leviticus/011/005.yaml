  text: 바위너구리는, 되새김질은 하지만 굽은 갈라지지 않으므로, 너희에게는 부정합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바위너구리’는 히브리어 שָׁפָן의 현대적 동물명에 해당합니다. 전통역에는 ‘토끼’(coney)로도 나옵니다.
    reason: lexical_alternative
