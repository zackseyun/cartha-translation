id: LEV.11.7
reference: Leviticus 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
  footnotes:
  - marker: a
    text: Or 'the swine.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'does not bring up cud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 돼지[a]는 굽이 갈라져 있고, 굽이 완전히 갈라져 있기는 하지만, 되새김질을 하지 않으므로[b] 여러분에게 부정한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멧돼지’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘되새김을 올리지 않는다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  english_pob_choice: the pig
  chosen_korean: 돼지
  alternatives_korean:
  - 멧돼지
  - 돼지류
  - 스와인
  lexicon: HALOT
  rationale: 현대 한국어에서 가장 자연스럽고 즉시 이해되는 동물명으로 옮겼습니다. 여기서는 종교적 전통어보다 일반 명칭이 원문의 동물 지시를 더 분명하게 전달합니다.
- source_word: מַפְרִיס פַּרְסָה ... וְשֹׁסַע שֶׁסַע פַּרְסָה
  english_pob_choice: has a divided hoof ... and splits the hoof
  chosen_korean: 굽이 갈라져 있고, 굽이 완전히 갈라져 있기는 하지만
  alternatives_korean:
  - 굽이 나뉘어 있고, 굽이 갈라져 있고
  - 발굽이 둘로 갈라져 있고
  lexicon: HALOT
  rationale: 두 표현을 각각 살려 히브리어의 중첩적 강조를 반영했습니다. 단순히 한 번만 ‘갈라진 굽’으로 합치면 원문의 반복과 강조가 약해집니다.
- source_word: גֵּרָה לֹא יִגָּר
  english_pob_choice: does not chew the cud
  chosen_korean: 되새김질을 하지 않으므로
  alternatives_korean:
  - 되새김을 하지 않으므로
  - 되새김질을 되올리지 않으므로
  lexicon: HALOT
  rationale: 관용적인 의미를 살리되, 직역적 느낌도 유지하는 표현을 택했습니다. 히브리어의 문자적 뉘앙스는 ‘되새김을 다시 올리지 않다’에 가깝지만, 한국어에서는 ‘되새김질을 하지 않다’가 가장 자연스럽습니다.
- source_word: טָמֵא הוּא לָכֶם
  english_pob_choice: is unclean to you
  chosen_korean: 여러분에게 부정한 것입니다
  alternatives_korean:
  - 여러분에게 부정합니다
  - 여러분에게 부정한 것입니다
  lexicon: HALOT
  rationale: 레위기의 음식 규정 맥락을 따라 의례적·식이적 부정성을 드러내는 ‘부정한’으로 옮겼습니다. 도덕적 악을 뜻하는 것이 아니라 정결 규정의 범주임을 보존합니다.
theological_decisions:
- issue: טָמֵא의 의미 범위
  chosen_reading: 정결법 맥락의 의례적 부정
  alternative_readings:
  - 도덕적으로 더러운 상태
  - 제의적으로 금지된 상태
  rationale: 레위기 11장의 문맥은 음식 정결 구분이므로, ‘부정한’은 도덕 판단이 아니라 정결 규정을 가리킵니다. 한국어에서도 이 구분이 흐려지지 않도록 했습니다.
  doctrine_reference: 레위기 11장 정결법
- issue: 두 번의 발굽 묘사
  chosen_reading: 중복이 아닌 강조로 처리
  alternative_readings:
  - 한 번만 간단히 번역
  - 의역하여 합침
  rationale: 원문은 같은 신체 특징을 두 방식으로 말해 금지 동물의 식별 기준을 강화합니다. 이를 합치지 않고 병렬로 두어 원문의 강조를 살렸습니다.
  doctrine_reference: 레위기 11:7의 문학적 병렬
