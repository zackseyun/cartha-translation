id: LEV.11.46
reference: Leviticus 11:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
  footnotes:
  - marker: a
    text: Or 'instruction for' instead of 'law concerning' for תּוֹרַת; the Hebrew term can denote authoritative teaching as well as law.
    reason: lexical_alternative
  - marker: b
    text: Or 'every living being' for 'every living creature'; Hebrew נֶפֶשׁ הַחַיָּה is an idiom for animate life, not specifically an immaterial 'soul.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on the land' for 'on the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 가축[a]과 새, 물에서 움직이는 모든 살아 있는 생물[b], 그리고 땅 위에서 무리지어 다니는 모든 생물에 관한 율법입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '…에 대한 교훈'으로도 옮길 수 있습니다. 히브리어 תּוֹרָה는 율법뿐 아니라 권위 있는 가르침을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '모든 살아 있는 존재'로도 옮길 수 있습니다. 히브리어 נֶפֶשׁ הַחַיָּה는 비물질적 '영혼'이 아니라 살아 있는 생명체를 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '땅에서'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  english_pob_choice: the law concerning
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 지침
  - 법
  lexicon: HALOT
  rationale: 문맥상 앞선 정결 규례 전체를 가리키는 요약 표현이므로, POB의 'law concerning'에 맞춰 '율법'으로 옮기되 관계를 드러내는 '에 관한'을 보완했습니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 동물
  - 들짐승
  lexicon: HALOT
  rationale: 이 절의 분류 항목인 육상 동물을 현대 한국어로 가장 자연스럽게 드러내는 말이 '가축'이며, POB의 범주적 번역 의도를 살렸습니다.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  english_pob_choice: every living creature
  chosen_korean: 모든 살아 있는 생물
  alternatives_korean:
  - 모든 살아 있는 존재
  - 모든 생물
  - 모든 생명체
  lexicon: HALOT
  rationale: נֶפֶשׁ הַחַיָּה는 '영혼'이 아니라 살아 있는 প্রাণ/생명체를 뜻하는 관용구이므로, 이를 오해 없이 드러내는 표현으로 옮겼습니다.
- source_word: הַשֹּׁרֶצֶת
  english_pob_choice: that swarms
  chosen_korean: 무리지어 다니는
  alternatives_korean:
  - 우글거리는
  - 떼지어 다니는
  - 번성하는
  lexicon: HALOT
  rationale: 땅 위에서의 작은 생물들의 떼지음과 움직임을 한국어로 자연스럽게 드러내기 위해 '무리지어 다니는'을 택했습니다.
theological_decisions:
- issue: נֶפֶשׁ in this verse could be misconstrued as 'soul.'
  chosen_reading: 살아 있는 생물로 번역하여, 영혼 개념이 아니라 생명체 범주임을 분명히 했습니다.
  alternative_readings:
  - 생명
  - 영혼
  - 생물
  rationale: 본문의 פֶשׁ/נֶפֶשׁ는 정결법 문맥에서 जीवित한 피조물을 가리키는 관용구이므로, 신학적 오독을 막는 번역이 필요합니다.
  doctrine_reference: 창세기/레위기의 প্রাণ명어법, 정결법의 분류어법
