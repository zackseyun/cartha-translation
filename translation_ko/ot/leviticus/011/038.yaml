id: LEV.11.38
reference: Leviticus 11:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
  footnotes:
  - marker: a
    text: Or 'any of their dead bodies.' The Hebrew נְבֵלָה denotes an animal carcass; 'carcass' best fits the purity-law context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 물이 씨앗 위에 뿌려졌고, 그것 위에 그들의 사체 가운데 하나라도 떨어지면, 그것은 여러분에게 부정합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 히브리어 נְבֵלָה는 동물의 사체를 가리키므로, 정결법 문맥에는 ‘사체’가 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 …면
  alternatives_korean:
  - 그리고 …면
  - 만일 …면
  lexicon: HALOT
  rationale: 조건문이면서 앞절과 대비를 이루므로, 단순한 ‘만일’보다 ‘그러나 …면’이 문맥의 반전 효과를 더 잘 드러냅니다.
- source_word: יֻתַּן מַיִם
  english_pob_choice: water is put
  chosen_korean: 물이 … 뿌려졌고
  alternatives_korean:
  - 물이 … 놓였고
  - 물이 … 부어졌고
  lexicon: HALOT
  rationale: פַּעל/홉할의 수동 의미를 살리되 한국어 법조문 문맥에서 자연스럽게 들리도록 ‘뿌려졌고’로 옮겼습니다.
- source_word: מִנִּבְלָתָם
  english_pob_choice: any of their carcasses
  chosen_korean: 그들의 사체 가운데 하나라도
  alternatives_korean:
  - 그들의 시체 가운데 하나라도
  - 그들의 죽은 몸 가운데 하나라도
  lexicon: HALOT
  rationale: נְבֵלָה는 여기서 부정례의 대상인 동물 사체를 가리키므로, ‘사체’가 제의적 정결 규정의 의미를 가장 직접적으로 전달합니다.
- source_word: טָמֵא הוּא לָכֶם
  english_pob_choice: it is unclean to you
  chosen_korean: 그것은 여러분에게 부정합니다
  alternatives_korean:
  - 그것은 여러분에게 부정합니다
  - 그것은 여러분에게 부정한 것입니다
  lexicon: HALOT
  rationale: 의례적 정결 상태를 나타내는 판정문이므로 ‘부정합니다’로 옮겨, 영어 POB의 ritual impurity 개념을 한국어에서 과도하게 도덕화하지 않게 했습니다.
theological_decisions:
- issue: 정결/부정 용어의 성격
  chosen_reading: ‘부정합니다’는 도덕적 죄책이 아니라 제의적 부정 상태를 가리키는 판정문으로 유지합니다.
  alternative_readings:
  - 부정합니다
  - 더럽습니다
  rationale: 본문은 레위기의 정결 규례 문맥에 속하므로, moral impurity로 오해될 수 있는 표현은 피하고 제의적 상태를 드러내는 번역을 택했습니다.
  doctrine_reference: 레위기 11장 정결법의 문맥
