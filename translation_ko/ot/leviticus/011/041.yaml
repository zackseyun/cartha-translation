    text: 또는 ‘기어 다니는 것’. 여기의 히브리어는 땅 가까이에서 움직이거나 무리 지어 다니는 작은 생물을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘혐오스러운 것’. 여기서는 음식으로서 의례적으로 혐오스러운 대상을 뜻합니다.
