  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
  footnotes:
  - marker: a
    text: Or 'creeping thing.' The Hebrew term refers broadly to small creatures that swarm or move close to the ground.
    reason: lexical_alternative
  - marker: b
    text: Or 'an abomination.' Here the term denotes something ritually detestable as food.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 땅에서 떼 지어 움직이는 모든 것은 혐오스럽습니다[a][b]; 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기어 다니는 것’. 여기의 히브리어는 땅 가까이에서 움직이거나 무리지어 다니는 작은 생물을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가증한 것’. 여기서는 음식으로서 의례적으로 혐오스러운 대상을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And every
  chosen_korean: 그리고 … 모든
  alternatives_korean:
  - 그리고 각각의
  - 모든
  lexicon: HALOT
  rationale: וְ의 연결성은 앞 절과 이어 주는 ‘그리고’로, כָּל의 포괄성은 ‘모든’으로 살렸습니다.
- source_word: הַ/שֶּׁרֶץ + הַ/שֹּׁרֵץ
  english_pob_choice: swarming thing that swarms
  chosen_korean: 떼 지어 움직이는
  alternatives_korean:
  - 기어 다니는
  - 우글거리는
  lexicon: HALOT
  rationale: שׁרץ의 반복적 어근 효과를 한국어에서 ‘떼 지어 움직이는’으로 풀어, 작은 생물이 무리 지어 꿈틀거리는 감각을 살렸습니다.
- source_word: שֶׁ֥קֶץ
  english_pob_choice: detestable / an abomination
  chosen_korean: 혐오스럽습니다
  alternatives_korean:
  - 가증스럽습니다
  - 가증한 것입니다
  lexicon: HALOT
  rationale: 레위기 11장의 음식 금지 맥락에서 שֶׁקֶץ는 의례적으로 받아들일 수 없는 상태를 가리키므로, 도덕적 과장 없이 식용 금지를 드러내는 ‘혐오스럽습니다’를 택했습니다.
- source_word: לֹ֥א יֵאָכֵֽל
  english_pob_choice: it shall not be eaten
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹으면 안 됩니다
  - 먹을 수 없습니다
  lexicon: HALOT
  rationale: 니팔형 금지문을 한국어 법령체에 자연스럽게 옮겨, 수동 구조보다 규범적 금지 의미가 분명한 표현으로 번역했습니다.
theological_decisions:
- issue: שֶׁקֶץ의 규범적 힘
  chosen_reading: 이 구절은 생물학적 평가가 아니라 정결/부정결의 식규 규범을 말합니다.
  alternative_readings:
  - 도덕적 혐오 선언
  - 일반적 불쾌감 표현
  rationale: 레위기 11장의 문맥상 대상은 창조 질서 전체에 대한 평가가 아니라 먹을 수 있는 것과 없는 것의 경계 설정입니다.
  doctrine_reference: 레위기 11장 정결 규례
