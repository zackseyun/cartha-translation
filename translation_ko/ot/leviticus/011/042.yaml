  text: 땅 위를 기어다니는 모든 것[b] 가운데, 배로 기어가는 모든 것[a]과 네 발로 가는 모든 것, 또 발이 많은 모든 것은 먹지 마십시오. 그것들은 혐오스러운 것들[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
