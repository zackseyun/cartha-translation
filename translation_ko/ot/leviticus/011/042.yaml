    text: 직역하면 ‘배로 가는 것’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘기는 것, 곧 기어다니는 것’이라는 동족어 반복으로 이 부류를 강조합니다.
    reason: source_note
  - marker: c
    text: 또는 ‘그것들은 가증스러운 것들입니다’.
    reason: lexical_alternative
