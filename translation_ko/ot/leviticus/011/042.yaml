  lexicon: HALOT
  rationale: 히브리어의 확장·포함 의미를 살리기 위해 ‘곧 …까지’로 이어 주어 앞 범주들을 포함해 더 넓은 금지 대상을 나타냈습니다.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
