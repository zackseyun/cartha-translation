  source_fidelity: 수정안은 כֹּל의 포괄적 열거를 ‘모든 것’으로 유지하고, 세 이동 범주가 ‘땅 위를 기어다니는’ 부류에 속한다는 수식 관계를 한국어에서 분명히 했습니다. 기존안의 ‘무리지어’는 שׁרץ의 의미에 없는 집단 이동의 뜻을 더하므로 제거했습니다. לֹא תֹאכְלוּם의 복수 목적어에는 ‘그것들은’이 자연스럽게 호응합니다.
  naturalness: 기존 문장은 긴 삽입구와 대시 때문에 ‘가운데서는’의 수식 범위가 불명확했고, ‘모든 기어다니는 것들’도 중복감이 지나치게 부자연스러웠습니다. 수정안은 문장 구조를 정리하면서도 반복 어근의 강조는 주석으로 보존했습니다. 현대 표준어 합쇼체에 맞습니다.
  terminology: ‘혐오스러운 것들’은 שֶׁקֶץ의 강한 정결 규정상 평가를 현대어로 적절히 전달합니다. ‘발이 많은’은 רַגְלַיִם의 구체적 이미지를 유지합니다. ‘무리지어’는 삭제해야 하며, 각주 a의 기존 대안 ‘배를 기어가는 것’은 비문이므로 고쳐야 합니다.
