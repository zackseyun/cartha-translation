- from: 그럼에도 불구하고[a], 굽을 나누는 짐승 가운데서나 되새김질하는 짐승 가운데서도 이것들은 먹지 말아야 합니다. 곧 낙타는 되새김질은 하지만 굽을 나누지 않으므로[b] 너희에게는 부정합니다.
  to: 그러나 되새김질하는 짐승 가운데서나 발굽이 갈라진 짐승 가운데서, 다음 것은 먹지 말아야 합니다[a]. 곧 낙타는 되새김질은 하지만 발굽이 갈라지지 않았으므로 너희에게는 부정합니다[b].
