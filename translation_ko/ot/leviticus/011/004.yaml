  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
  footnotes:
  - marker: a
    text: Or, 'split the hoof.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'unclean to you'—that is, unclean for Israel under the dietary laws.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 되새김질하는 짐승 가운데서나 발굽이 갈라진 짐승 가운데서, 다음 것은 먹지 말아야 합니다[a]. 곧 낙타는 되새김질은 하지만 발굽이 갈라지지 않았으므로 너희에게는 부정합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발굽을 나누는 짐승’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘너희에게는 부정하다’는 이스라엘의 식이 율법 아래서 부정하다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Nevertheless
  chosen_korean: 그럼에도 불구하고
  alternatives_korean:
  - 그러나
  - 다만
  - 그렇지만
  lexicon: HALOT
  rationale: 앞선 정결 기준에 대한 제한·예외를 나타내는 말로, POB의 Nevertheless와 같은 대조적 뉘앙스를 자연스럽게 살립니다.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  english_pob_choice: from among those that chew the cud
  chosen_korean: 되새김질하는 짐승 가운데서
  alternatives_korean:
  - 되새김질하는 것들 가운데서
  - 되새김질하는 짐승들 가운데서
  - 되새김질하는 짐승에서
  lexicon: HALOT
  rationale: 직역식의 어색함을 피하면서도, 되새김질이라는 분류 기준을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  english_pob_choice: or from among those that divide the hoof
  chosen_korean: 굽을 나누는 짐승 가운데서도
  alternatives_korean:
  - 발굽을 나누는 짐승 가운데서도
  - 굽을 쪼개는 짐승 가운데서도
  - 굽이 갈라진 짐승 가운데서도
  lexicon: HALOT
  rationale: פוּס/פַּרְסָה의 관용적 식별 기준을 한국어 성경에서 이해하기 쉬운 ‘굽을 나누다’로 옮겨, POB의 분류 표현을 보존했습니다.
- source_word: טָמֵא הוּא לָכֶם
  english_pob_choice: it is unclean to you
  chosen_korean: 너희에게는 부정합니다
  alternatives_korean:
  - 너희에게는 더럽습니다
  - 너희에게는 정결하지 않습니다
  - 너희에게는 부정한 것입니다
  lexicon: HALOT
  rationale: 레위기 정결 문맥의 טָמֵא는 전통적 용어인 ‘부정하다’가 원문의 법적·제의적 판정을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 'טָמֵא의 번역 범위: 제의적/의례적 부정'
  chosen_reading: ‘부정합니다’로 유지해 본문이 규정하는 식용 금지의 법적 판정을 직접 드러냅니다.
  alternative_readings:
  - ‘의례적으로 부정합니다’
  - ‘정결하지 않습니다’
  rationale: 영어 POB가 'unclean'을 유지한 것처럼, 한국어에서도 해설어를 덧붙여 범위를 좁히기보다 본문의 핵심 범주를 그대로 남기는 것이 레위기 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
