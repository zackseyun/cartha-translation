source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
  footnotes:
  - marker: a
    text: Hebrew 'Any man'; the expression is distributive ('man, man') and functions generically for any member of Israelite society.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집안의 사람이라면 누구든지 진영 안에서 수소나 양이나 염소를 잡거나, 진영 밖에서 잡으면—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  english_pob_choice: Any man
  chosen_korean: 누구든지
  alternatives_korean:
  - 어떤 사람이라도
  - 각 사람
  lexicon: HALOT
  rationale: 히브리어의 중복 명사구는 분배적 의미를 지닌 관용구이므로, 성별을 과도하게 드러내지 않으면서도 범위를 살리는 ‘누구든지’로 옮겼습니다.
- source_word: מִבֵּית יִשְׂרָאֵל
  english_pob_choice: from the house of Israel
  chosen_korean: 이스라엘 집안의 사람
  alternatives_korean:
  - 이스라엘에서 나온 사람
  - 이스라엘 사람
  lexicon: HALOT
  rationale: 직역의 ‘이스라엘 집안’을 유지하면 언약적·공동체적 범주가 드러나므로, 단순 민족명으로 평탄화하지 않고 자연스러운 한국어로 다듬었습니다.
- source_word: יִשְׁחַט
  english_pob_choice: slaughters
  chosen_korean: 잡다
  alternatives_korean:
  - 도살하다
  - 죽이다
  - 도살해 잡다
  lexicon: HALOT
  rationale: 여기서는 제의 맥락의 동물 도살을 가리키므로 ‘죽이다’보다 특정성이 있고, 한국어 법률문체에서 자연스러운 ‘잡다’로 처리했습니다.
- source_word: בַּמַּחֲנֶה / מִחוּץ לַמַּחֲנֶה
  english_pob_choice: in the camp / outside the camp
  chosen_korean: 진영 안 / 진영 밖
  alternatives_korean:
  - 진영 안쪽 / 진영 바깥
  - 숙영지 안 / 숙영지 밖
  lexicon: HALOT
  rationale: 히브리어의 공간 대비를 그대로 살리기 위해 ‘진영’을 유지했고, 반복되는 대구를 한국어에서도 선명하게 보이도록 ‘안/밖’으로 대응시켰습니다.
- source_word: שׁוֹר אוֹ כֶשֶׂב אוֹ עֵז
  english_pob_choice: an ox or a sheep or a goat
  chosen_korean: 수소나 양이나 염소
  alternatives_korean:
  - 소나 양이나 염소
  - 황소나 양이나 염소
  lexicon: HALOT
  rationale: שור는 제의적 가축 중 수소를 가리키는 경우가 자연스러워 ‘수소’로 좁혔고, כֶשֶׂב은 어린 양으로 한정되지 않으므로 ‘양’이 더 적절합니다.
