  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
  footnotes:
  - marker: a
    text: Or, 'the resident foreigner living among them.' The Hebrew גר denotes a non-Israelite residing within the community.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'cover it with dust/earth'; the pronoun most naturally refers to the blood.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손 가운데서든, 그들 가운데 거류하는 나그네 가운데서든 어떤 사람이 먹을 수 있는 들짐승이나 새를 사냥하여 잡거든, 그 피를 쏟고 흙으로 덮어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들 가운데 사는 거류 외국인'으로 옮길 수 있습니다. 히브리어 גר는 공동체 안에 거주하는 비이스라엘인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '먼지/흙으로 그것을 덮다'입니다. 여기서 대명사는 가장 자연스럽게 피를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  english_pob_choice: any man
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 각 사람
  - 어떤 남자
  lexicon: HALOT
  rationale: 겹친 איש의 분배적 의미를 한국어로 자연스럽게 풀어, 법규의 적용 대상을 넓게 드러내면서도 성별을 불필요하게 강조하지 않도록 했습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘의 아들들 가운데서
  lexicon: HALOT
  rationale: 번역 전통의 익숙함을 유지하되, '자손'으로 בְּנֵי יִשְׂרָאֵל의 친족·언약적 표현을 살렸습니다.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  english_pob_choice: the sojourner who sojourns among them
  chosen_korean: 그들 가운데 거류하는 나그네
  alternatives_korean:
  - 그들 가운데 머무는 외국인
  - 그들 가운데 사는 거류민
  lexicon: HALOT
  rationale: גר의 법적·공동체적 범주를 살리기 위해 '거류하는 나그네'로 옮겼고, 반복 구조는 한국어에서 자연스러운 관계절로 정리했습니다.
- source_word: וְכִסָּהוּ בֶּעָפָר
  english_pob_choice: and cover it with earth
  chosen_korean: 흙으로 덮어야 합니다
  alternatives_korean:
  - 먼지로 덮어야 합니다
  - 땅으로 덮어야 합니다
  lexicon: HALOT
  rationale: עפר는 문맥상 '흙/땅' 계열이 자연스러우며, 피를 가리키는 것으로 이해되는 대상을 한국어에서는 간결하게 '흙으로 덮다'로 표현했습니다.
theological_decisions:
- issue: 피를 가리는 행위의 대상
  chosen_reading: 사냥한 짐승이나 새의 피를 흙으로 덮는 것으로 이해했습니다.
  alternative_readings:
  - 사냥한 짐승이나 새 자체를 덮는 것으로 볼 수 있습니다.
  - 피가 아니라 다른 대상을 가리킨다고 볼 수 있습니다.
  rationale: 가장 가까운 선행사는 '그 피'이므로, 제의적 행위의 초점을 피에 두는 것이 히브리어 구문과 레위기 17장의 문맥에 가장 잘 맞습니다.
  doctrine_reference: 구문상의 가장 자연스러운 선행사 해석을 유지
