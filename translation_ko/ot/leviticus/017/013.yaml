theological_decisions:
- issue: 피를 가리는 행위의 대상
  chosen_reading: 사냥한 짐승이나 새의 피를 흙으로 덮는 것으로 이해했습니다.
  alternative_readings:
  - 사냥한 짐승이나 새 자체를 덮는 것으로 볼 수 있습니다.
  - 피가 아니라 다른 대상을 가리킨다고 볼 수 있습니다.
  rationale: 가장 가까운 선행사는 '그 피'이므로, 제의적 행위의 초점을 피에 두는 것이 히브리어 구문과 레위기 17장의 문맥에 가장 잘 맞습니다.
  doctrine_reference: 구문상의 가장 자연스러운 선행사 해석을 유지
