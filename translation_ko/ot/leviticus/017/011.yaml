revisions:
- from: 포유류의 생명은 피에 있습니다[a]. 내가 그것을 여러분에게 제단 위에 주었으니, 여러분의 생명을 위해 속죄하게 하려는 것입니다[b]. 이는 피가 생명으로 말미암아 속죄하기 때문입니다.
  to: 육체의 생명은 피에 있습니다[a]. 내가 여러분의 생명을 위하여 속죄하도록 그것을 제단 위에 여러분에게 주었습니다[b]. 피가 생명으로 속죄하기 때문입니다.
  rationale: ‘포유류’를 원문의 범위에 맞는 ‘육체’로 고쳤습니다. 제단과 수여 및 속죄 목적의 관계를 한국어 문장 안에서 명료하게 재배열했습니다. 마지막 절은 생명과 피의 관계를 특정 교리적 설명으로 확정하지 않도록 ‘생명으로’를 유지했으며, 대안 해석은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:17Z'
review_pass:
  verdict: revise
  source_fidelity: ‘포유류의’는 הַבָּשָׂר(‘육체/살’)의 범위를 부당하게 포유류로 한정하므로 수정이 필요합니다. 또한 ‘제단 위에 주었으니’는 한국어에서 수여의 대상과 장소 관계가 다소 불분명합니다. 수정문은 피와 생명의 관계, 속죄의 목적, 마지막 절의 압축적이며 다소 논쟁적인 בַּנֶּפֶשׁ의 관계를 보존합니다.
  naturalness: ‘육체의 생명’은 현대 표준어에서 자연스럽고, 원문의 ‘flesh’를 포유류로 축소하지 않습니다. ‘제단 위에 … 주었습니다’는 원문의 제단 관련 용법을 유지하면서도 문장 성분 관계를 명료하게 합니다. 마지막의 ‘생명으로 속죄합니다’는 다소 표지된 원문의 표현을 과도하게 해설하지 않고 자연스럽게 재현합니다.
  terminology: נֶפֶשׁ은 이 절에서 일관되게 ‘생명’으로 옮기는 것이 적절하며, כפר는 레위기의 제의 문맥에 맞게 ‘속죄하다’로 유지합니다. ‘여러분’과 ‘-습니다’는 요청된 현대 합쇼체에 맞습니다.
  issues:
  - severity: high
    issue: ‘포유류의 생명’
    rationale: הַבָּשָׂר는 ‘육체/살’이며 포유류만을 뜻하지 않습니다. 이 번역은 원문의 적용 범위를 근거 없이 좁힙니다.
  - severity: medium
    issue: ‘내가 그것을 여러분에게 제단 위에 주었으니’의 어순
    rationale: ‘제단 위에’가 ‘주다’의 장소인지 제의적 용도인지 한국어에서 불분명합니다. 원문의 제단 위에서의 속죄 용도를 더 명확히 드러낼 필요가 있습니다.
  - severity: low
    issue: ‘생명으로 말미암아’
    rationale: 가능한 해석이지만 원문의 압축된 בַּנֶּפֶשׁ를 다소 인과적으로 고정합니다. ‘생명으로’가 수단적/연관적 모호성을 더 잘 보존합니다.
  revised_text: 육체의 생명은 피에 있습니다[a]. 내가 여러분의 생명을 위하여 속죄하도록 그것을 제단 위에 여러분에게 주었습니다[b]. 피가 생명으로 속죄하기 때문입니다.
