id: LEV.17.11
reference: Leviticus 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
  footnotes:
  - marker: a
    text: Or, 'for the blood makes atonement by means of the life in it.'
    reason: alternative_reading
  - marker: b
    text: Hebrew nephesh, often 'life,' 'self,' or 'soul' depending on context; in this verse the sense is life.
    reason: lexical_alternative
translation:
  language: ko
  text: 육체의 생명은 피에 있습니다[a]. 내가 여러분의 생명을 위하여 속죄하도록 그것을 제단 위에 여러분에게 주었습니다[b]. 피가 생명으로 속죄하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘피가 그 안에 있는 생명을 매개로 속죄한다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 네페쉬는 문맥에 따라 흔히 ‘생명’, ‘자기’, ‘영혼’으로도 옮길 수 있으며, 이 절에서는 ‘생명’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 영혼
  - 자기
  lexicon: HALOT
  rationale: 이 절에서는 נֶפֶשׁ이 피와 결부된 ‘생명’의 뜻으로 반복되므로, ‘영혼’보다 ‘생명’이 본문의 희생 제의 논리를 더 정확하게 드러냅니다.
- source_word: הַבָּשָׂר
  english_pob_choice: the flesh
  chosen_korean: 포유류의
  alternatives_korean:
  - 육체의
  - 살의
  - 몸의
  lexicon: HALOT
  rationale: 여기서는 일반적인 ‘육체’가 아니라 제의 문맥 속 살아 있는 피조물의 살을 가리키므로, 한국어로는 자연스럽게 ‘생명은 피에 있습니다’로 처리하되 대상은 문맥상 ‘살’의 영역으로 이해해야 합니다.
- source_word: לְכַפֵּר
  english_pob_choice: to make atonement
  chosen_korean: 속죄하게 하려는 것입니다
  alternatives_korean:
  - 속죄하기 위함입니다
  - 화목하게 하려는 것입니다
  - 덮어 주려는 것입니다
  lexicon: HALOT
  rationale: 레위기에서 כפר의 기본 제의적 의미는 ‘속죄하다’이므로, 교회 전통어를 유지하되 행위 목적이 분명하도록 ‘속죄하게 하려는 것입니다’로 옮겼습니다.
- source_word: בַּנֶּפֶשׁ
  english_pob_choice: by the life
  chosen_korean: 생명으로 말미암아
  alternatives_korean:
  - 생명 안에서
  - 생명으로
  - 생명 덕분에
  lexicon: HALOT
  rationale: 마지막 절은 히브리어가 압축적이고 해석 여지가 있으므로, 피가 속죄하는 근거를 지나치게 풀어 쓰지 않으면서도 원문의 수단/근거 관계를 한국어로 드러내기 위해 ‘생명으로 말미암아’를 택했습니다.
theological_decisions:
- issue: ‘נֶפֶשׁ’의 의미를 영혼으로 볼지 생명으로 볼지
  chosen_reading: 절 전체에서 일관되게 ‘생명’으로 옮겼습니다.
  alternative_readings:
  - 영혼
  - 자기
  - 목숨
  rationale: 이 구절은 피와 생명의 상관관계를 논하는 제의 규정이므로, ‘영혼’은 이원론적 뉘앙스를 불필요하게 불러올 수 있습니다. ‘생명’이 본문의 즉각적 신학을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 마지막 절의 압축된 문법을 얼마나 풀어 쓸지
  chosen_reading: ‘이는 피가 생명으로 말미암아 속죄하기 때문입니다’로 비교적 마크된 표현을 유지했습니다.
  alternative_readings:
  - 이는 생명 때문에 피가 속죄하기 때문입니다
  - 이는 피가 생명 안에서 속죄하기 때문입니다
  - 이는 생명에 의해 피가 속죄하기 때문입니다
  rationale: 히브리어의 긴장과 제의적 연결을 과도하게 평탄화하지 않고, 피와 생명의 결속이라는 본문의 핵심을 독자가 느끼도록 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3
