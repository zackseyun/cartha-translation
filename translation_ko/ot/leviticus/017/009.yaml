id: LEV.17.9
reference: Leviticus 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
  footnotes:
  - marker: a
    text: Or, more literally, 'to do/make it for the LORD'; here the Hebrew idiom refers to presenting the sacrifice.
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off'' is a legal formula whose exact penalty is not specified here; it may imply removal from the covenant community or direct divine judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 회막의 입구로 그것을 가져와 야훼께 바치지 않으면, 그 사람은 자기 백성에게서 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로는 문자적으로 ‘그것을 야훼를 위해 만들다/행하다’에 가깝지만, 여기서는 제물을 드리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어지다’는 법률 공식으로, 여기서 정확한 형벌의 형태는 명시되지 않습니다. 이는 언약 공동체에서 제외되거나 하나님의 직접적인 심판을 받는 것을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח / אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 회막의 입구
  alternatives_korean:
  - 만남의 장막의 입구
  - 회중의 장막 입구
  lexicon: HALOT
  rationale: פֶּתַח의 ‘입구’와 אֹהֶל מוֹעֵד의 전통적 성막 명칭을 함께 살려, 문맥상 제의 공간의 출입구를 자연스럽게 드러냈습니다.
- source_word: יְבִיאֶנּוּ
  english_pob_choice: bring it
  chosen_korean: 그것을 가져와
  alternatives_korean:
  - 그것을 데려와
  - 그것을 가져오지
  lexicon: HALOT
  rationale: 지시 대상은 앞선 문맥의 제물(희생 동물)이며, 한국어에서는 ‘가져오다’가 제의적 이동을 가장 간결하게 전달합니다.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  english_pob_choice: to offer it to Yahweh
  chosen_korean: 야훼께 바치지
  alternatives_korean:
  - 야훼를 위해 그것을 행하지
  - 야훼께 드리기 위해 행하지
  lexicon: HALOT
  rationale: 히브리어 עשה의 문자적 ‘하다/만들다’보다, 제의 문맥에서의 관용적 의미인 ‘바치다’가 희생 제의의 뜻을 더 정확히 전달합니다.
- source_word: וְנִכְרַת ... מֵעַמָּיו
  english_pob_choice: shall be cut off from his people
  chosen_korean: 자기 백성 가운데에서 끊어질 것입니다
  alternatives_korean:
  - 자기 백성에게서 끊어질 것입니다
  - 자기 백성 가운데서 제거될 것입니다
  lexicon: HALOT
  rationale: כרת의 법적 관용구를 ‘끊어지다’로 유지하여, 정확한 처벌 방식이 본문에서 특정되지 않는 긴장을 보존했습니다.
theological_decisions:
- issue: ‘cut off’ 형벌의 범위
  chosen_reading: 형벌의 구체적 방식은 밝히지 않고 ‘끊어질 것입니다’라는 법정식 표현을 유지했습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 회중에서 추방될 것입니다
  - 멸망할 것입니다
  rationale: 본문은 칼의 집행, 공동체 축출, 혹은 하나님의 직접 심판을 특정하지 않으므로, 해석을 한쪽으로 고정하지 않고 원문의 모호성을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (theological tension preservation)
