source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
  footnotes:
  - marker: a
    text: Literally, 'his flesh.' Here it refers to washing his body.
    reason: lexical_alternative
  - marker: b
    text: Or 'bear his iniquity' or 'bear the penalty for his iniquity.' The Hebrew legal expression can include both guilt and its consequence.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 만일 그는 자기 옷을 빨지 않고 자기 몸을 씻지 않으면, 그는 자기 죄책을 져야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 살’입니다. 여기서는 몸을 씻는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 죄악을 지다’, 혹은 ‘그의 죄악의 벌을 지다’로 옮길 수 있습니다. 히브리어 법률 표현은 죄책과 그 결과를 함께 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절의 정결 절차와 대비되는 부정 조건이므로, 한국어에서는 단순 조건문보다 역접을 살린 ‘그러나 만일’이 문맥을 더 잘 드러냅니다.
- source_word: יְכַבֵּס
  english_pob_choice: wash
  chosen_korean: 빨지
  alternatives_korean:
  - 씻지
  - 세탁하지
  lexicon: HALOT
  rationale: 직전 문맥의 ‘옷’에 대한 동사이므로 한국어에서는 자연스럽게 ‘빨다’를 쓰되, 의례적 정결 행위를 과도하게 현대화하지 않도록 했습니다.
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  english_pob_choice: does not bathe his body
  chosen_korean: 자기 몸을 씻지
  alternatives_korean:
  - 자기 육체를 씻지
  - 자기 살을 씻지
  lexicon: HALOT
  rationale: 히브리어의 ‘살/육체’는 여기서 문자적으로만이 아니라 몸 전체를 가리키는 관용이므로, POB의 해석을 따라 ‘몸’으로 옮겨 의례적 의미를 분명히 했습니다.
- source_word: וְנָשָׂא עֲוֺנוֹ
  english_pob_choice: then he shall bear his guilt
  chosen_korean: 그는 자기 죄책을 져야 합니다
  alternatives_korean:
  - 그는 자기 죄를 져야 합니다
  - 그는 자기 죄악을 져야 합니다
  - 그는 자기 죄의 벌을 져야 합니다
  lexicon: HALOT
  rationale: עוֹן은 ‘죄악’ 자체와 그에 따른 책임/부담을 함께 가리킬 수 있으므로, 전형적 법정 표현을 살리면서도 형벌을 미리 특정하지 않도록 ‘죄책을 지다’로 옮겼습니다.
theological_decisions:
- issue: עוֹן(iniquity/guilt) 법률 관용구의 범위
  chosen_reading: ‘죄책을 지다’로 번역해, 도덕적 잘못과 그 결과에 대한 법적 책임의 긴장을 보존했습니다.
  alternative_readings:
  - ‘죄를 지다’로 단순화
  - ‘죄의 벌을 지다’로 명시
  rationale: 히브리어 법률 표현은 책임과 그 결과를 모두 포괄할 수 있으므로, 한쪽으로 좁히지 않고 여지를 남기는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
