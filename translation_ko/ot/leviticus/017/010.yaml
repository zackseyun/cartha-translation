  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
  footnotes:
  - marker: a
    text: Or 'resident alien' or 'foreigner residing among them' for 'the sojourner who sojourns among them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the soul/person who eats'; here 'person' is used in the sense of the individual offender.
    reason: lexical_alternative
  - marker: c
    text: '''Cut off'' is a covenantal penalty formula; the text does not specify here whether this means death, expulsion, or another form of divine judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 집안의 사람이나 그들 가운데 머무는 나그네 가운데 누구든지 피를 조금이라도 먹는 사람은 누구나, 나는 그 피를 먹는 그 사람에게 내 얼굴을 대적하여 향하게 하고, 그를 그의 백성 가운데서 끊어 버리겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 כאן의 גֵּר를 가리키며, 단순한 여행객이 아니라 이스라엘 공동체 안에 거주하는 비(非)이스라엘인을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ은 여기서 ‘영혼’보다 법적 책임을 지는 개인을 가리키는 말로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘끊어 버리다’는 언약적 제재 공식으로, 본문은 그 집행이 죽음인지 추방인지 등을 여기서 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  english_pob_choice: And any man
  chosen_korean: 이스라엘 집안의 사람이나
  alternatives_korean:
  - 이스라엘 집안의 남자나
  - 이스라엘 집안의 누구나
  lexicon: HALOT
  rationale: 중복된 אִישׁ의 분배적·강조적 의미를 한국어에서는 앞의 범주를 제시하고 뒤에서 ‘누구든지’로 풀어 자연스럽게 살렸습니다.
- source_word: מִבֵּית יִשְׂרָאֵל
  english_pob_choice: from the house of Israel
  chosen_korean: 이스라엘 집안의
  alternatives_korean:
  - 이스라엘의
  - 이스라엘 가문의
  lexicon: HALOT
  rationale: 언약적 법문에서의 관용구를 살려 ‘집안/가문’ 계열을 유지했습니다.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  english_pob_choice: or from the sojourner who sojourns among them
  chosen_korean: 그들 가운데 머무는 나그네
  alternatives_korean:
  - 그들 가운데 거류하는 외국인
  - 그들 가운데 사는 거주 외국인
  lexicon: HALOT
  rationale: גֵּר의 법적 뉘앙스를 살리면서도, 한국어에서는 중복된 동사형을 한 번의 자연스러운 서술로 압축했습니다.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  english_pob_choice: who eats any blood
  chosen_korean: 피를 조금이라도 먹는 사람은 누구나
  alternatives_korean:
  - 어떤 피든 먹는 사람은
  - 모든 피를 먹는 사람은
  lexicon: HALOT
  rationale: כָּל דָּם의 전면 금지를 ‘조금이라도’로 옮겨 금지의 절대성을 한국어에서 분명히 했습니다.
- source_word: וְנָתַתִּי פָנַי
  english_pob_choice: I will set my face against
  chosen_korean: 나는 그 피를 먹는 그 사람에게 내 얼굴을 대적하여 향하게 하고
  alternatives_korean:
  - 나는 내 얼굴을 그에게 돌리고
  - 나는 그를 대적하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설성을 살리되, 한국어에서는 ‘대적하여 향하게 하다’로 하나님의 적극적 विरोध/심판 의지를 드러냈습니다.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  english_pob_choice: against the person who eats
  chosen_korean: 그 피를 먹는 그 사람
  alternatives_korean:
  - 그 피를 먹는 그 영혼
  - 그 피를 먹는 그 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ을 여기서는 개인적 책임 주체로 보고 ‘사람’으로 번역하여 한국어 독자가 오해 없이 읽도록 했습니다.
- source_word: וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ
  english_pob_choice: and I will cut him off from among his people
  chosen_korean: 그를 그의 백성 가운데서 끊어 버리겠습니다
  alternatives_korean:
  - 그를 그의 백성 가운데서 잘라 내겠습니다
  - 그를 그의 백성 가운데서 제거하겠습니다
  lexicon: HALOT
  rationale: כרת의 언약적 법문 용례를 따라 ‘끊어 버리다’로 옮겨, 구체적 집행 방식은 본문이 말하지 않는 긴장을 유지했습니다.
theological_decisions:
- issue: 神의 심판 표현인 ‘내 얼굴을 대적하여 향하게 하다’의 직설성
  chosen_reading: 관용구를 완화하지 않고 하나님의 직접적 심판 의도를 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 그에게 반대하겠다
  - 그를 벌하겠다
  rationale: 본문은 단순한 감정 표현이 아니라 언약적 심판 선언이므로, 완곡어보다 원문의 긴장을 살리는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ‘끊어 버리다’의 제재 방식
  chosen_reading: 죽음, 추방, 또는 다른 형태의 심판으로 특정하지 않고 ‘끊어 버리다’만 남겼습니다.
  alternative_readings:
  - 죽게 하다
  - 쫓아내다
  - 제명하다
  rationale: 히브리어 משפט 공식은 최종 결과를 선명히 말하지만 방식은 여기서 규정하지 않으므로, 본문이 가진 모호성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
