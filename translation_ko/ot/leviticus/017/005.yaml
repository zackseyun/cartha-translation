  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 이스라엘 자손이 들판에서 그들이 바치는 희생제물을 가져오게 하여[a], 그것들을 야훼께, 곧 회막의 입구에서 제사장에게 가져가고, 그것들을 야훼께 화목제물로 바쳐야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 직역적 표현입니다. ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화목제물’은 ‘평화제물’ 또는 ‘교제제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 혈연·언약 표현을 살리되, 한국어에서는 가장 자연스럽고 성경적 문맥에 익숙한 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: זִבְחֵיהֶם ... זֹבְחִים
  english_pob_choice: their sacrifices ... that they are sacrificing
  chosen_korean: 그들이 바치는 희생제물
  alternatives_korean:
  - 그들이 희생하는 제물
  - 그들이 제사하는 제물
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살려 ‘희생제물’로 두었고, 진행 중인 행위를 ‘바치는’으로 자연스럽게 드러냈습니다.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  english_pob_choice: in the open field
  chosen_korean: 들판에서
  alternatives_korean:
  - 광야에서
  - 들에서
  lexicon: HALOT
  rationale: 문맥상 성소 밖의 개방된 장소를 가리키므로, 직역보다 의미가 분명한 ‘들판에서’로 옮겼습니다.
- source_word: זִבְחֵי שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 교제제물
  - 평안제물
  lexicon: HALOT
  rationale: 한국 성경 전통과 어휘의 정확성을 함께 고려해 שְׁלָמִים의 제의적 명칭을 ‘화목제물’로 렌더링했습니다.
