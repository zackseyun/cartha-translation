    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이스라엘 자손[a]이 들판에서 바치던 자기들의 희생제물을 회막 어귀에 있는 제사장에게 가져와, 그것들을 야훼께 화목제물로 바치게 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 직역적 표현입니다. ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화목제물’은 ‘평화제물’ 또는 ‘교제제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
