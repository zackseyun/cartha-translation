  source_fidelity: The draft conveys the twofold prohibition, but its syntactic construction obscures the Hebrew direct quotation and renders the repeated ger/gar expression awkwardly. The revision preserves the past introductory verb and the legal force of both prohibitions.
  naturalness: The draft's long indirect-speech construction ('말하기를 ... 하였노라') is archaic and less natural in modern formal-polite Korean. A direct quotation with complete formal-polite prohibitions is clearer and consistent with the requested register.
  terminology: ‘이스라엘 자손’ appropriately represents בְּנֵי יִשְׂרָאֵל. ‘나그네’ is retained for גֵּר, with a note clarifying that it denotes a non-Israelite resident rather than merely a traveler. ‘피를 먹다’ is maintained literally.
  issues:
  - severity: medium
    issue: The draft uses an awkward, archaizing indirect-speech sentence.
    rationale: אָמַרְתִּי introduces a direct pronouncement. Rendering it as ‘이렇게 말하였습니다’ followed by a quotation reflects the source structure and supplies natural modern formal-polite Korean.
  - severity: medium
    issue: ‘나그네가 나그네로 거류하는 자’ is redundant and unnatural.
    rationale: הַגֵּר הַגָּר בְּתוֹכְכֶם identifies ‘the sojourner residing among you.’ ‘너희 가운데 거류하는 나그네’ preserves both the noun and participial qualification without Korean tautology.
  revised_text: 그러므로 내가 이스라엘 자손에게 이렇게 말하였습니다. “너희 가운데 누구도 피를 먹어서는 안 됩니다. 너희 가운데 거류하는 나그네도 피를 먹어서는 안 됩니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 자녀들에게’ 또는 ‘이스라엘 사람들에게’. 히브리어는 문자적으로 ‘이스라엘의 아들들에게’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네’는 이스라엘 공동체 안에 거주하며 그 공동체의 법 아래 사는 비이스라엘인 거주자를 가리킵니다. ‘거류 외국인’ 또는 ‘외국인’으로도 옮길 수 있습니다.
