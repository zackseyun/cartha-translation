lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하시며
  alternatives_korean:
  - 말씀하셨습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서술 도입의 관용적 동사로서, 영어 POB의 'spoke'처럼 단순한 '말하다'보다 공손하고 성경적 문체에 맞는 '말씀하시다'를 택했습니다. 뒤의 לֵאמֹר를 살려 '이르셨습니다'를 덧붙여 말하기 사건의 개시를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명 יְהוָה를 주석된 번역 관행에 따라 '야훼'로 옮겨, 영어 POB가 보존한 신적 고유명을 한국어에서도 유지했습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세
  lexicon: HALOT
  rationale: 인명 מֹשֶׁה는 한국어 성경에서 널리 정착된 '모세'를 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: ‘여호와’ 같은 전통적 대체어 대신 ‘야훼’를 본문에 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 하나님의 언약 이름을 직접 사용하므로, 직함으로 완화하지 않고 고유명 자체를 드러내는 것이 source-direct하며, 영어 POB의 Yahweh 처리와도 일치합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
