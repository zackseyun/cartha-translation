source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'blood shall be counted to that man.' The phrase means liability for bloodshed, hence 'bloodguilt.'
    reason: lexical_alternative
  - marker: b
    text: Or 'blood shall be imputed to that man.'
    reason: alternative_reading
  - marker: c
    text: '''Shall be cut off'' does not specify here whether the penalty is death, expulsion, or another form of covenantal removal.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그것을 만남의 장막 입구로 가져와 야훼의 성막 앞에서 야훼께 제물로 드리지 아니하면, 그 사람에게 피의 죄가 돌아갈 것입니다[a][b]. 그는 피를 흘렸으므로, 그 사람은 자기 백성 가운데서 끊어질 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피가 그 사람에게 계산될 것이다’라고 합니다. 이는 그 사람에게 피 흘림의 법적 책임, 곧 피의 죄가 귀속된다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘피가 그 사람에게 계산될 것입니다.’
    reason: alternative_reading
  - marker: c
    text: ‘끊어질 것이다’는 여기에서 그 형벌이 사형, 추방, 또는 다른 형태의 언약 공동체로부터의 제거인지를 구체적으로 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 만남의 장막 입구
  alternatives_korean:
  - 회막의 입구
  - 만남의 장막의 문
  lexicon: HALOT
  rationale: פֶּתַח는 ‘문’보다 ‘입구/출입구’가 자연스럽고, אֹהֶל מוֹעֵד는 예배 공간의 고유 명칭으로 ‘만남의 장막’을 유지하는 것이 직역성을 살립니다.
- source_word: לְהַקְרִיב קָרְבָּן
  english_pob_choice: to present it as an offering
  chosen_korean: 예물로 바치지
  alternatives_korean:
  - 제물로 드리지
  - 예배 제사로 드리지
  lexicon: HALOT
  rationale: הקריב은 제의적으로 ‘가까이 가져와 드리다/바치다’의 뜻이 있어, 한국어에서는 동작과 제의성을 함께 드러내는 ‘예물로 바치다’가 가장 자연스럽습니다.
- source_word: דָּם יֵחָשֵׁב
  english_pob_choice: blood shall be imputed to that man
  chosen_korean: 피가 돌릴 것이니
  alternatives_korean:
  - 피가 그 사람에게 계산될 것이니
  - 피값이 그 사람에게 돌릴 것이니
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘피가 그 사람에게 계산된다’는 법정 표현이므로, 한국어에서는 판결적 책임 귀속을 나타내는 ‘돌리다’로 옮기되, 과도한 해석어는 피했습니다.
- source_word: וְנִכְרַת הָאִישׁ הַהוּא מִקֶּרֶב עַמּוֹ
  english_pob_choice: and that man shall be cut off from among his people
  chosen_korean: 그 사람은 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 그 사람은 자기 백성 가운데서 끊어질지니
  - 그 사람은 자기 백성 중에서 제거될 것입니다
  lexicon: HALOT
  rationale: כרת의 관용구를 한국어 성경 전통의 ‘끊어지다’로 살리되, 현대 한국어 문장으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 יהוה는 학술적 음역인 ‘야훼’로 표기해 원문 고유명사성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
- issue: 법적 책임 표현 דָּם יֵחָשֵׁב
  chosen_reading: 피가 돌릴 것이니
  alternative_readings:
  - 피가 계산될 것이니
  - 피가 그에게 귀속될 것이니
  rationale: 이 표현은 단순한 물리적 ‘피’가 아니라 무단 도살에 대한 혈죄 책임을 뜻하므로, 해석을 과도하게 확장하지 않으면서도 법적 귀속을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
