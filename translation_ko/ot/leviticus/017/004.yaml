revisions:
- from: 그리고 회중의 만남의 장막 입구로 가져오지 않고, 그것을 야훼께 예물로 바치지 아니하고, 야훼의 성막 앞에서 드리지 아니하면, 그 사람에게는 피가 돌릴 것이니, 그는 피를 흘린 것이며, 그 사람은 자기 백성 가운데서 끊어질 것입니다.[a][b][c]
  to: 그리고 그것을 만남의 장막 입구로 가져와 야훼의 성막 앞에서 야훼께 제물로 드리지 아니하면, 그 사람에게 피의 죄가 돌아갈 것입니다[a][b]. 그는 피를 흘렸으므로, 그 사람은 자기 백성 가운데서 끊어질 것입니다[c].
  rationale: 원문에 없는 ‘회중의’를 삭제하고, 성소 입구로 제물을 가져와 야훼 앞에 드리는 원문의 통합된 제의 구문을 회복했습니다. דָּם יֵחָשֵׁב는 직역을 각주에 보존하면서 본문에서는 한국어로 자연스러운 법적 관용어 ‘피의 죄가 ... 돌아가다’로 번역했습니다. ‘끊어지다’는 형벌 방식의 불확정성을 그대로 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:20Z'
