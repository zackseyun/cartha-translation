  source_fidelity: 수정 전 본문은 ‘회중의’를 원문에 근거 없이 더하고, לְהַקְרִיב קָרְבָּן과 לִפְנֵי מִשְׁכַּן יְהוָה를 각각 별개의 부정 행위처럼 병렬 처리했습니다. 또한 ‘피가 돌릴 것이니’는 한국어 문법과 법적 귀속 의미 모두에서 부정확합니다. 수정문은 제물을 회막 입구로 가져와 야훼 앞에 드리는 단일 행위를 반영하고, דָּם יֵחָשֵׁב의 법적 의미를 자연스럽게 보존합니다.
  naturalness: ‘그 사람에게 피의 죄가 돌아갈 것입니다’는 현대 한국어의 격식 있는 법적·성경적 문맥에서 자연스럽습니다. ‘만남의 장막’과 ‘성막’은 원문의 두 관련 성소 명칭을 각각 반영하며, 문장 전체는 합쇼체로 통일했습니다.
  terminology: יהוה는 초안의 프로젝트 표기 원칙에 따라 ‘야훼’로 유지했습니다. קָרְבָּן은 ‘예물’보다 제의 문맥을 더 명확히 하는 ‘제물’로, כרת의 법적 표현은 의미를 확정하지 않는 ‘끊어질 것입니다’로 옮겼습니다.
