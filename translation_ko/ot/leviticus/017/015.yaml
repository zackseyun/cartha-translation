revisions:
- from: 그리고 어떤 사람이 죽은 짐승이나 짐승에게 찢긴 것을 먹으면[a], 본토인이든 나그네이든 그는 자기 옷을 빨고 물로 몸을 씻어야 합니다. 그는 저녁까지 부정할 것이며[b], 그 후에는 깨끗해집니다.
  to: 누구든지 저절로 죽은 짐승[a]이나 들짐승에게 찢긴 짐승을 먹으면, 본토인이든 거류 외국인이든[b] 자기 옷을 빨고 물로 몸을 씻어야 합니다. 그는 저녁까지 부정한 상태에 있게 되며, 그 후에는 정결하게 됩니다.
  rationale: ‘저절로 죽은 짐승’으로 נְבֵלָה의 핵심 범주를 드러내고, טְרֵפָה는 ‘들짐승에게 찢긴 짐승’으로 자연스럽게 명시했습니다. גֵּר는 ‘거류 외국인’으로 번역하고 관련 각주를 그 표현에 정확히 연결했습니다. 의례적 부정과 정결의 뜻은 유지하되 현대 합쇼체에서 자연스러운 상태 표현으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:23Z'
