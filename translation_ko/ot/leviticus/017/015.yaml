  terminology: ‘거류 외국인’은 גֵּר의 법적·사회적 의미를 ‘나그네’보다 정확히 보존합니다. טָמֵא/טָהֵר는 도덕적 비난이 아닌 의례적 상태이므로 ‘부정한 상태’와 ‘정결하게’로 번역했습니다. 각주 a의 ‘כאן’은 한국어 문장에 부적절하므로 바로잡았고, 각주 b의 표지는 גֵּר에 해당하는 ‘거류 외국인’에 붙여야 합니다.
