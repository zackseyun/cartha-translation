id: LEV.17.15
reference: Leviticus 17:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
  footnotes:
  - marker: a
    text: Or 'carcass' for 'an animal found dead'; the Hebrew term refers to an animal that died without proper slaughter.
    reason: lexical_alternative
  - marker: b
    text: Or 'resident foreigner' for 'sojourner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 어떤 사람이 죽은 짐승이나 짐승에게 찢긴 것을 먹으면[a], 본토인이든 나그네이든 그는 자기 옷을 빨고 물로 몸을 씻어야 합니다. 그는 저녁까지 부정할 것이며[b], 그 후에는 깨끗해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사체’로 옮길 수 있습니다. כאן의 히브리어는 적법한 도살 없이 죽은 동물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저녁까지 부정하게 되며’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: every person
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 모든 사람
  - 각 사람
  - 어떤 생명
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 추상적인 ‘혼’보다 한 개인을 가리키므로, 한국어에서는 자연스럽고 판례문체에 맞는 ‘어떤 사람’으로 옮겼습니다.
- source_word: נְבֵלָה
  english_pob_choice: an animal found dead
  chosen_korean: 죽은 짐승
  alternatives_korean:
  - 주검이 된 짐승
  - 사체
  - 자연사한 짐승
  lexicon: HALOT
  rationale: 의식 규정에서 נְבֵלָה는 적법한 도살 없이 죽은 동물을 뜻하므로, 원문의 범주를 과도하게 기술화하지 않으면서도 이해하기 쉬운 ‘죽은 짐승’으로 옮겼습니다.
- source_word: טְרֵפָה
  english_pob_choice: one torn by beasts
  chosen_korean: 짐승에게 찢긴 것
  alternatives_korean:
  - 맹수에게 찢긴 것
  - 찢겨 죽은 것
  - 들짐승에 찢긴 짐승
  lexicon: HALOT
  rationale: טְרֵפָה는 포식자에게 찢긴 동물을 가리키므로, 원인과 상태를 함께 드러내는 ‘짐승에게 찢긴 것’이 가장 직접적입니다.
- source_word: בָּאֶזְרָח וּבַגֵּר
  english_pob_choice: whether native or sojourner
  chosen_korean: 본토인이든 나그네이든
  alternatives_korean:
  - 토박이든 거류민이든
  - 원주민이든 체류자이든
  - 본국 사람이든 이방 거류자이든
  lexicon: HALOT
  rationale: 법적 대조쌍을 살리되 한국어 독자에게 익숙한 표지어로 옮기기 위해 ‘본토인’과 ‘나그네’를 사용했습니다. ‘나그네’는 단순한 여행자가 아니라 이스라엘 안에 거주하는 외국인이라는 POB의 소송적 뉘앙스를 비교적 잘 담습니다.
- source_word: וְטָמֵא עַד הָעֶרֶב / וְטָהֵר
  english_pob_choice: he shall be unclean until the evening ... then he shall be clean
  chosen_korean: 그는 저녁까지 부정할 것이며, 그 후에는 깨끗해집니다
  alternatives_korean:
  - 저녁까지 부정합니다… 그러면 깨끗해집니다
  - 저녁까지 부정하며… 그 뒤 깨끗해집니다
  - 저녁까지 부정한 상태가 되며… 그 후 깨끗해집니다
  lexicon: HALOT
  rationale: טָמֵא/טָהֵר는 도덕적 죄책이 아니라 의식적 정결 상태를 가리키므로, 문맥상 ‘부정하다/깨끗하다’로 유지하되 시제와 법규의 선언성을 살렸습니다.
theological_decisions:
- issue: 의식적 부정과 도덕적 죄의 구분
  chosen_reading: 이 구절의 טָמֵא/טָהֵר는 죄책 언어가 아니라 제의적 상태를 나타내므로, ‘부정하다/깨끗하다’의 범주를 유지했습니다.
  alternative_readings:
  - 더럽혀지다/정결해지다
  - 죄가 있다/죄가 없다
  rationale: 레위기의 정결법은 음식 섭취 후의 의례적 상태를 규정하는 것이므로, 도덕적 비난을 덧씌우지 않는 번역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
