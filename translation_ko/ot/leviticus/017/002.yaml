- from: 아론과 그 아들들과 이스라엘 자손 모든 자에게 말하여 그들에게 이르라, 야훼께서 명하신 말씀은 이러하니라.
  to: 아론과 그의 아들들과 이스라엘의 모든 자손에게 말하고, 그들에게 이렇게 이르십시오. ‘이는 야훼께서 명령하여 말씀하신 말씀입니다.’
