source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
  footnotes:
  - marker: a
    text: Or 'to the goat idols' or 'to the satyrs'; the Hebrew term refers to goat-like beings associated with illicit worship.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'after which they prostitute themselves,' a metaphor for religious unfaithfulness or idolatry.
    reason: cultural_note
  - marker: c
    text: Or 'an everlasting statute' or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 더는 자기들의 제물을 염소귀신들에게 바쳐서는 안 됩니다. 그들은 그들 뒤를 따라 음행합니다. 이것은 그들에게 대대로 영원한 규례가 되어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘염소 우상들’ 또는 ‘사티로스들’로 옮길 수 있습니다. 히브리어는 염소 같은 형상과 연결된 존재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들 뒤에 음행한다’는 뜻으로, 종교적 불성실을 성적 비유로 나타낸 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영원한 규례’ 혹은 ‘항구한 규례’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִזְבְּחוּ עוֹד
  english_pob_choice: They shall no longer sacrifice
  chosen_korean: 더는 ... 바쳐서는 안 됩니다
  alternatives_korean:
  - 더는 ... 제사해서는 안 됩니다
  - 더는 ... 희생해서는 안 됩니다
  lexicon: HALOT
  rationale: 부정 명령의 금지 의미를 자연스럽게 살리면서, 제물/제사를 함께 받는 동사를 위해 ‘바치다’를 택했습니다.
- source_word: לַשְּׂעִירִם
  english_pob_choice: to the goat-demons
  chosen_korean: 염소귀신들에게
  alternatives_korean:
  - 염소 우상들에게
  - 사티로스들에게
  - 염소들에게
  lexicon: HALOT
  rationale: 문맥이 단순한 염소가 아니라 우상숭배와 연결된 존재를 가리키므로, POB의 해석을 따라 ‘귀신’을 살려 현대 한국어로 전달했습니다.
- source_word: זֹנִים אַחֲרֵיהֶם
  english_pob_choice: after which they prostitute themselves
  chosen_korean: 그들 뒤를 따라 음행합니다
  alternatives_korean:
  - 그들을 따라 창녀짓을 합니다
  - 그들 뒤를 따라 몸을 팝니다
  - 그들 뒤를 따라 간음합니다
  lexicon: HALOT
  rationale: 히브리어의 성적 비유를 완전히 평탄화하지 않으면서도, 한국어에서 직접적이고 오해가 적은 ‘음행하다’로 옮겼습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영속하는 규례
  - 항구한 규례
  - 영원한 법
  lexicon: HALOT
  rationale: 법규 문맥에서 עוֹלָם의 지속성을 살리되, 한국어 성경어법에 맞는 ‘규례’로 옮겼습니다.
theological_decisions:
- issue: זֹנִים אַחֲרֵיהֶם의 비유적·신학적 힘
  chosen_reading: 우상숭배를 성적 불륜의 언어로 드러내는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 그들을 따라 우상숭배합니다
  - 그들에 대해 신실하지 않습니다
  rationale: 원문의 충격과 언약 불성실의 이미지를 약화하지 않기 위해 해석어로 치환하지 않았습니다.
  doctrine_reference: Translation philosophy §3
