revisions:
- from: 그들은 더는 자기들의 제물을 염소귀신들에게 바쳐서는 안 됩니다. 그들은 그들 뒤를 따라 음행합니다. 이것은 그들에게 대대로 영원한 규례가 되어야 합니다.[a][b][c]
  to: 그들은 더 이상 자기들의 제물을 염소 귀신들[a]에게 바쳐서는 안 되며, 그들을 따라 음행해서도 안 됩니다[b]. 이것은 그들에게 대대로 영속하는 규례[c]가 될 것입니다.
  rationale: 금지의 범위를 두 동사에 자연스럽게 적용하고, ‘그들을 따라’로 원문의 선행사를 명확히 했습니다. 마지막 절은 히브리어 미래 선언에 맞추어 ‘될 것입니다’로 고쳤으며, 각주 표지를 해당 표현 바로 뒤에 배치하고 각주 c의 중복을 해소했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:20Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 금지와 ‘더는’은 원문의 לֹא…עוֹד를 대체로 충실히 옮겼습니다. 그러나 ‘그들은 그들 뒤를 따라 음행합니다’는 히브리어의 관계절적 수식(‘그들을 따라 음행하는’)을 한국어에서 어색하게 분리하고, 현재 서술처럼 들리게 합니다. 또한 ‘되어야 합니다’보다 미래 선언인 ‘될 것입니다’가 תִּהְיֶה에 더 가깝습니다.
  naturalness: ‘그들 뒤를 따라’는 현대 한국어에서 부자연스럽고 지시 대상도 흐립니다. ‘그들을 따라’로 고치고 두 금지 내용을 병렬로 표현하면 자연스럽고 원문의 의미도 보존됩니다. ‘영속하는 규례’는 이 법규 문맥에서 현대적인 표현입니다.
  terminology: ‘제물’, ‘염소 귀신들’, ‘음행’, ‘규례’는 문맥상 적절합니다. ‘염소 귀신들’은 논쟁 가능한 שְׂעִירִים의 해석이므로 대안 번역을 각주에 유지했습니다. ‘음행’은 원문의 성적·종교적 불성실 비유를 보존하며, 각주가 그 비유성을 설명합니다.
  issues:
  - severity: medium
    issue: ‘그들은 그들 뒤를 따라 음행합니다’의 구문과 시제가 원문의 관계절 및 금지의 범위와 맞지 않음
    rationale: זֹנִים אַחֲרֵיהֶם은 염소 귀신들을 따라 행하는 지속적 행위를 가리키며, 앞의 부정 명령 아래에서 금지되는 행위입니다. 한국어 문장을 분리하면 단순한 현재 사실 진술로 읽히고 ‘그들 뒤’도 어색합니다.
  - severity: medium
    issue: ‘영원한 규례가 되어야 합니다’가 원문의 미래 선언을 당위 표현으로 바꿈
    rationale: תִּהְיֶה는 ‘될 것이다’라는 법규적 선언입니다. ‘되어야 합니다’는 한국어에서 의무·당위를 더 강하게 나타냅니다.
  - severity: low
    issue: 각주 c가 본문 선택어와 동일한 ‘영원한 규례’를 대안으로 제시함
    rationale: 본문을 ‘영속하는 규례’로 정하고 ‘영원한’과 ‘항구한’을 대안으로 제시하면 עוֹלָם의 번역 선택을 명료하게 보여 줍니다.
  revised_text: 그들은 더 이상 자기들의 제물을 염소 귀신들[a]에게 바쳐서는 안 되며, 그들을 따라 음행해서도 안 됩니다[b]. 이것은 그들에게 대대로 영속하는 규례[c]가 될 것입니다.
