  rationale: 문맥이 단순한 염소가 아니라 우상숭배와 연결된 존재를 가리키므로, POB의 해석을 따라 ‘귀신’을 살려 현대 한국어로 전달했습니다.
- source_word: זֹנִים אַחֲרֵיהֶם
  english_pob_choice: after which they prostitute themselves
  chosen_korean: 그들 뒤를 따라 음행합니다
  alternatives_korean:
  - 그들을 따라 창녀짓을 합니다
