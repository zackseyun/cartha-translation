id: LEV.17.14
reference: Leviticus 17:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
  footnotes:
  - marker: a
    text: Or 'its blood is in its life,' or more interpretively, 'its blood is its life.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 육체의 생명은 그 피이기 때문입니다[a]; 그것은 그 생명 안에 있습니다. 그래서 저는 이스라엘 자손에게 말했습니다. 「너희는 어떤 육체의 피도 먹어서는 안 됩니다[b]. 이는 모든 육체의 생명이 그 피이기 때문입니다.」 그것을 먹는 사람은 끊어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 피는 그 생명 안에 있다’, 더 해석적으로는 ‘그 피가 그 생명이다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’; 곧 이스라엘 사람들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 혼
  - 영혼
  lexicon: HALOT
  rationale: 이 문맥에서 נֶפֶשׁ은 분리된 ‘영혼’보다 피와 맞물린 생명력을 가리키므로, ‘생명’이 논증 구조를 가장 잘 보존합니다.
- source_word: בָּשָׂר
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 살
  - 육신
  - 살붙이
  lexicon: HALOT
  rationale: ‘모든 육체’는 히브리어의 포괄적 표현을 살리면서 현대 한국어에서 사람과 짐승을 모두 포괄하는 공식적 표현으로 적합합니다.
- source_word: בְנַפְשׁוֹ הוּא
  english_pob_choice: in its life it is
  chosen_korean: 그 생명 안에 있습니다
  alternatives_korean:
  - 그 생명과 함께 있습니다
  - 그것의 생명입니다
  - 그 생명 속에 있습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 반복을 완전히 평탄화하지 않으면서, 피와 생명의 결속을 자연스러운 한국어로 드러내는 표현입니다.
- source_word: יִכָּרֵת
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 제거될 것입니다
  - 끊겨질 것입니다
  - 도려내질 것입니다
  lexicon: HALOT
  rationale: 관례적 언약 제재의 관용구를 직역에 가깝게 살리되, 한국어에서 의미가 통하도록 ‘끊어지다’를 선택했습니다.
theological_decisions:
- issue: 피와 생명의 관계
  chosen_reading: 피는 동물의 생명을 표지하거나 담지하는 것으로 표현하고, 이를 통해 피 금지의 근거를 유지했습니다.
  alternative_readings:
  - 피가 곧 생명 그 자체라는 더 직접적인 표현
  - 생명은 피 속에만 있다는 식의 설명적 풀어쓰기
  rationale: 본문은 혈액-생명 연결을 근거로 금지를 제시하지만, 이를 과도하게 해석학적으로 풀어내지 않고 원문의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존
