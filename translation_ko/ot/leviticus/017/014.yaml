  source_fidelity: 개정이 필요합니다. 초안의 ‘그것은 그 생명 안에 있습니다’는 선행사가 불분명하여 히브리어 דָּמוֹ(‘그 피’)를 제대로 드러내지 못합니다. 또한 בְּנַפְשׁוֹ의 압축된 관계는 한국어로 ‘그 피에 있다’로 옮기는 것이 자연스럽고 본문의 피-생명 논리를 보존합니다. ‘저는’은 하나님의 직접 발화에 부적절한 겸양 표현이므로 ‘내가’로 고쳐야 합니다.
  naturalness: ‘모든 육체’와 ‘어떤 육체의 피’는 현대 한국어에서 동물 일반을 가리키는 표현으로 다소 부자연스럽습니다. 이 문맥에서는 ‘모든 생물’과 ‘어떤 생물의 피’가 자연스럽게 포괄성을 전달합니다. ‘그 피에 있다’는 피와 생명의 관계를 한국어 관용에 맞게 표현합니다.
