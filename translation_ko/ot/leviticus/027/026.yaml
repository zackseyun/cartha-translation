  source_fidelity: 본문은 처음 난 가축이 이미 야훼께 속하므로 사람이 다시 성별할 수 없다는 법적·제의적 논리를 잘 반영합니다. 다만 ‘처음 난 것으로서’는 한국어에서 다소 중복적이고 어색합니다. 또한 שֶׂה는 양에만 한정되지 않고 염소를 포함하는 작은 가축을 가리킬 수 있으므로, 본문과 각주에서 그 범위를 보존하는 것이 좋습니다.
