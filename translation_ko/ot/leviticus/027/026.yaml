theological_decisions:
- issue: 처음 난 가축을 다시 ‘거룩하게 구별’할 수 없는 이유
  chosen_reading: 그것은 이미 처음 난 것으로서 야훼께 속해 있으므로, 사람이 새로이 봉헌하거나 구별할 대상이 아닙니다.
  alternative_readings:
  - 처음 난 것 자체가 이미 거룩하므로 별도의 구별이 필요 없다는 뜻으로 볼 수 있습니다.
  rationale: 본문의 마지막 절이 소유권을 강조하므로, 금지의 근거를 ‘이미 야훼의 것’이라는 법적 귀속으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 레 27:26의 제의법과 출 13장의 처음 난 것에 대한 야훼의 소유권
- issue: ‘거룩하게 구별하다’의 번역 register
  chosen_reading: 제의적 의미를 유지하면서 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
  alternative_readings:
  - ‘봉헌하다’는 교회적 어감이 강할 수 있습니다.
  - ‘바치다’는 의미가 넓어 קדש의 구별 성격이 약해질 수 있습니다.
  rationale: קדש의 성소적·제의적 뉘앙스를 지키면서도, 일반 독자가 법규의 의미를 바로 이해하도록 했습니다.
  doctrine_reference: 제의적 성별 개념
