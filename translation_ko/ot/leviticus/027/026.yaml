base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
  footnotes:
  - marker: a
    text: Or, 'a man shall not dedicate it' or 'no one may consecrate it.' The Hebrew uses 'man' generically.
    reason: lexical_alternative
  - marker: b
    text: Hebrew שֶׂה can refer more broadly to a sheep or a goat from the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 가축 가운데 처음 난 것으로 야훼께 속한 것은 사람이 그것을 거룩하게 구별해서는 안 됩니다. 소든 양이나 염소 같은 가축이든[b] 그것은 야훼의 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 세(שֶׂה)는 양뿐 아니라 염소를 포함할 수 있는 작은 가축을 가리킬 수 있습니다.
    reason: lexical_alternative
