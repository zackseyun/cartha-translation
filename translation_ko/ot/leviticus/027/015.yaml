revisions:
- from: 그리고 만일 그것을 성별한 사람이 자기 집을 속량하려면, 네 평가한 은의 오분의 일을 그것에 더할 것이며, 그것은 그의 것이 될 것입니다.[a]
  to: 만일 그것을 성별한 사람이 자기 집을 속량하려면, 당신이 평가한 은값의 오분의 일을 그 위에 더해야 하며, 그 집은 그의 것이 될 것입니다.[a]
  rationale: 평가 주체를 원문의 직접 호칭에 맞추어 ‘당신이 평가한’으로 명확히 하고, כֶּסֶף의 구체성을 ‘은값’으로 보존했습니다. 또한 마지막 소유 귀속의 대상을 ‘그 집’으로 밝혔습니다. ‘성별’과 ‘속량’은 원문의 제의적·법률적 어휘를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:53Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 법적·제의적 의미는 대체로 충실합니다. 다만 עֶרְכְּךָ는 문맥상 제사장에게 직접 말하는 ‘당신의 평가’인데, ‘네 평가한 은’은 한국어 문법상 부자연스럽고 평가 주체도 불명확합니다.
  naturalness: ‘그리고 만일’과 ‘네 평가한 은’은 현대 표준어 합쇼체 법문에서 다소 어색합니다. 평가액과 그 대상인 집을 명시하면 자연스럽고 뜻도 더 분명해집니다.
  terminology: ‘성별한’, ‘속량’, ‘오분의 일’은 제의·법률 문맥에 적절합니다. כֶּסֶף는 ‘은값’으로 옮겨 은을 기준으로 한 평가액이라는 뜻을 보존했습니다.
  issues:
  - severity: medium
    issue: ‘네 평가한 은’의 문법적·의미적 불명확성
    rationale: 히브리어 כֶּסֶף עֶרְכְּךָ는 ‘당신의 평가에 따른 은’이며, 문맥상 수신자인 제사장이 정한 평가액을 가리킵니다. 현 표현은 ‘네’와 ‘평가한’의 결합이 부자연스럽고, 누가 평가했는지 명확하지 않습니다.
  - severity: low
    issue: 대명사 ‘그것’의 지시 대상 불명확성
    rationale: 마지막 וְהָיָה לוֹ의 대상은 속량한 집입니다. ‘그 집’으로 밝혀 주면 한국어에서 자연스럽고 원문의 소유 귀속도 선명해집니다.
  revised_text: 만일 그것을 성별한 사람이 자기 집을 속량하려면, 당신이 평가한 은값의 오분의 일을 그 위에 더해야 하며, 그 집은 그의 것이 될 것입니다.[a]
