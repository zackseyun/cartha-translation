id: LEV.27.15
reference: Leviticus 27:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
  footnotes:
  - marker: a
    text: Or 'the one who dedicated it' or 'the one who sanctified it.'
    reason: lexical_alternative
  - marker: b
    text: That is, he adds one-fifth to the assessed silver value set by the priest.
    reason: cultural_note
translation:
  language: ko
  text: 만일 그것을 성별한 사람이 자기 집을 속량하려면, 당신이 평가한 은값의 오분의 일을 그 위에 더해야 하며, 그 집은 그의 것이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 제사장이 정한 평가액에 오분의 일을 더한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  english_pob_choice: the one who consecrated it
  chosen_korean: 그것을 성별한 사람
  alternatives_korean:
  - 그것을 봉헌한 사람
  - 그것을 거룩하게 한 사람
  - 그것을 바친 사람
  lexicon: HALOT
  rationale: קדשׁ의 성별/거룩하게 함이라는 제의적 의미를 살리면서, 문맥상 재산을 여호와께 따로 구별한 사람임을 자연스럽게 드러냅니다.
- source_word: יִגְאַל
  english_pob_choice: redeems
  chosen_korean: 속량하려면
  alternatives_korean:
  - 되찾으려면
  - 구속하려면
  - 값을 치르고 다시 사려면
  lexicon: HALOT
  rationale: גאל은 단순한 매매보다 혈연적·법적 회복의 뉘앙스가 있어, 레위기 27장의 제의적 법문에서는 '속량하다'가 가장 안정적입니다.
- source_word: חֲמִישִׁית
  english_pob_choice: a fifth
  chosen_korean: 오분의 일
  alternatives_korean:
  - 한 부분
  - 5분의 1
  - 한 다섯째
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 그대로 옮겨 법문체의 정확성을 유지했습니다.
- source_word: כֶּסֶף עֶרְכְּךָ
  english_pob_choice: the silver of your valuation
  chosen_korean: 네 평가한 은
  alternatives_korean:
  - 네 평가의 은
  - 네가 정한 은
  - 네 가치 평가의 은
  lexicon: HALOT
  rationale: כֶּסֶף를 '은'으로 살리고, עֶרְכְּךָ는 제사장이 매긴 평가액을 가리키므로 '네 평가한'으로 압축해 문맥을 보존했습니다.
- source_word: וְהָיָה לוֹ
  english_pob_choice: it shall be his
  chosen_korean: 그것은 그의 것이 될 것입니다
  alternatives_korean:
  - 그것은 그의 소유가 될 것입니다
  - 그는 그것을 갖게 될 것입니다
  - 그것은 그에게 속할 것입니다
  lexicon: HALOT
  rationale: 결과적 소유 귀속을 한국어 법문체로 분명히 표현했습니다.
theological_decisions:
- issue: 봉헌된 집의 환속(속량) 표현
  chosen_reading: '''속량하다''를 사용해 제의적·법적 회복을 나타냈습니다.'
  alternative_readings:
  - 되찾다
  - 구매하다
  - 회수하다
  rationale: 이 절은 일반 재산 거래가 아니라 여호와께 성별된 것을 대가를 치르고 돌려받는 절차이므로, 성경적 제의 용어인 '속량'이 의미를 가장 정확히 전달합니다.
  doctrine_reference: 레위기 27장의 서원·봉헌·속량 규정
