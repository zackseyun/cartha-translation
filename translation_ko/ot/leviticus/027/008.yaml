base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
  footnotes:
  - marker: a
    text: Or 'than your valuation.' The Hebrew construction may be rendered more literally this way, but 'too poor for your valuation' expresses the sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to what the hand of the one making the vow reaches.' This is a Hebrew idiom for financial ability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그가 네가 정한 평가액을 낼 수 없을 만큼 가난하면, 그는 제사장 앞에 세워져야 하며, 제사장은 그를 평가해야 합니다. 제사장은 서원한 사람이 감당할 수 있는 범위에 따라 그를 평가해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서원한 사람의 손이 미치는 것에 따라’입니다. 이는 경제적 능력, 곧 감당할 수 있는 액수를 뜻하는 히브리어 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: מָךְ
  english_pob_choice: too poor
  chosen_korean: 미치지 못할 만큼 가난하면
  alternatives_korean:
  - 너무 가난하면
  - 가난하여 감당하지 못하면
  lexicon: HALOT
  rationale: מָךְ는 단순한 빈곤보다 정해진 값에 미달하는 경제적 상태를 뜻하므로, 문맥의 비교 의미를 살려 표현했습니다.
- source_word: מֵעֶרְכֶּךָ
  english_pob_choice: for your valuation
  chosen_korean: 당신의 평가액에
  alternatives_korean:
  - 당신의 평가에
  - 당신의 산정액에
  - 당신의 값에
  lexicon: HALOT
  rationale: 레위기 27장의 기술적 용어 עֵרֶךְ를 여기서는 ‘평가액’으로 옮겨, 제의적·법적 산정이라는 점을 드러냈습니다.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  english_pob_choice: he shall be made to stand before the priest
  chosen_korean: 그는 제사장 앞에 세워지고
  alternatives_korean:
  - 그를 제사장 앞에 세우고
  - 그는 제사장 앞에 서게 되고
  lexicon: HALOT
  rationale: ‘세우다’의 사역적 의미를 살리되 한국어에서는 자연스럽게 수동으로 정리했습니다.
- source_word: וְהֶעֱרִיךְ אֹתוֹ הַכֹּהֵן
  english_pob_choice: the priest shall assess him
  chosen_korean: 제사장은 그를 평가해야 합니다
  alternatives_korean:
  - 제사장은 그를 산정해야 합니다
  - 제사장은 그 값을 정해야 합니다
  lexicon: HALOT
  rationale: chapter 내 기술어를 일관되게 옮기기 위해 ‘평가하다’를 택했습니다. 이는 금전적 산정의 절차를 가장 분명하게 드러냅니다.
- source_word: עַל פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  english_pob_choice: according to what the one making the vow can afford
  chosen_korean: 서원한 사람이 능히 낼 수 있는 만큼에 따라
  alternatives_korean:
  - 서원한 사람이 감당할 수 있는 만큼에 따라
  - 서원한 사람의 형편에 따라
  lexicon: HALOT
  rationale: ‘손이 미치다’는 히브리어 관용구를 한국어의 경제 능력 표현으로 풀어, 제사장 평가의 기준이 서원자의 감당 가능액임을 분명히 했습니다.
theological_decisions:
- issue: 이 절의 법정·제의적 절차를 한국어에서 어느 정도 직역할지
  chosen_reading: 평가(액)과 서원자의 지불 가능액을 함께 드러내는 법정형 문장으로 유지했습니다.
  alternative_readings:
  - 부드럽게 풀어쓴 생활어 번역
  - 제의적 용어를 약화한 해설식 번역
  rationale: 레위기 27장의 문맥은 서원 규정의 기술 문체이므로, 본문이 가진 절차성과 규범성을 보존하는 쪽이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 토라의 규정 문체 보존
