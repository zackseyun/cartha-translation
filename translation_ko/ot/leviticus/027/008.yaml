    issue: ‘당신의 평가액’의 지시 대상이 불명확함
    rationale: 히브리어의 2인칭 단수 접미사는 이 규정을 받는 모세를 가리킵니다. 한국어 ‘당신’은 독자를 직접 부르는 표현으로 이해되기 쉬우므로, ‘네가 정한’으로 지시 대상을 드러내는 편이 안전합니다.
