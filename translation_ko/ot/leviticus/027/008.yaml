revisions:
- from: 그러나 만일 그가 당신의 평가액에 미치지 못할 만큼 가난하면, 그는 제사장 앞에 세워지고, 제사장은 그를 평가해야 합니다. 제사장은 서원한 사람이 능히 낼 수 있는 만큼에 따라 그를 평가해야 합니다.[a]
  to: 그러나 만일 그가 네가 정한 평가액을 낼 수 없을 만큼 가난하면, 그는 제사장 앞에 세워져야 하며, 제사장은 그를 평가해야 합니다. 제사장은 서원한 사람이 감당할 수 있는 범위에 따라 그를 평가해야 합니다.[a]
  rationale: 원문의 법적 절차, 제사장의 반복된 평가 행위, 그리고 서원자의 지불 능력을 기준으로 삼는 점을 유지했습니다. 동시에 ‘당신’이 낳는 지시 대상의 혼동을 피하고, 평가액을 실제로 낼 수 있는지의 문제라는 문맥을 자연스러운 현대 한국어로 명확히 했습니다.
