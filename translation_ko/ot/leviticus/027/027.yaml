id: LEV.27.27
reference: Leviticus 27:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
  footnotes:
  - marker: a
    text: Or 'from the unclean livestock.' The Hebrew phrase refers to an animal belonging to the class of ritually unclean animals.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'add its fifth upon it,' that is, add twenty percent to the assessed value.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것이 부정한 짐승들 가운데 하나이면,[a] 당신이 평가한 값에 따라 그것을 속량하고 그 평가액의 오분의 일을 더해야 합니다.[b] 그것이 속량되지 않으면, 당신이 평가한 값에 따라 팔려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּהֵמָה는 여기서 제의적으로 부정한 동물 범주에 속한 대상을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 표현은 평가액에 그 오분의 일, 곧 20퍼센트를 추가한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  english_pob_choice: among the unclean animals
  chosen_korean: 부정한 짐승들 가운데에 있는 것
  alternatives_korean:
  - 부정한 가축들 가운데에 있는 것
  - 부정한 동물들 가운데에 있는 것
  lexicon: HALOT
  rationale: בְּהֵמָה는 문맥에 따라 가축/짐승/동물을 아우를 수 있으므로, 레위기의 정결 규례 맥락에서는 포괄적인 ‘짐승’이 가장 자연스럽고, ליתר을 위해 ‘가운데에 있는 것’으로 분리적 의미를 살렸습니다.
- source_word: וּפָדָה
  english_pob_choice: he shall redeem it
  chosen_korean: 속량하고
  alternatives_korean:
  - 그것을 속량할 것이며
  - 그것을 되찾을 것이며
  lexicon: HALOT
  rationale: פדה는 값을 치르고 되찾는 ‘속량하다/속전하다’의 의미이므로, 제의·법률 문맥에 맞게 ‘속량하다’를 택했습니다.
- source_word: בְעֶרְכֶּךָ
  english_pob_choice: at your valuation
  chosen_korean: 너의 평가대로
  alternatives_korean:
  - 너의 값대로
  - 네가 매긴 가치대로
  lexicon: HALOT
  rationale: עֵרֶךְ은 레위기 27장에서 제사장이 매기는 평가가치이므로, 직역에 가까운 ‘평가’로 옮기되 관계를 분명히 하기 위해 ‘너의 평가대로’로 표현했습니다.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  english_pob_choice: and add a fifth of it to it
  chosen_korean: 그 값에 그 다섯째를 더할 것이며
  alternatives_korean:
  - 그것에 그 다섯째를 더할 것이며
  - 그 값에 오분의 일을 더할 것이며
  lexicon: HALOT
  rationale: 히브리어의 ‘다섯째/오분의 일’ 관용을 보존하면서, 실제 뜻인 20% 추가를 한국어 자연문으로 전달했습니다.
- source_word: וְאִם לֹא יִגָּאֵל
  english_pob_choice: if it is not redeemed
  chosen_korean: 그것이 속량되지 않으면
  alternatives_korean:
  - 그것이 되찾아지지 않으면
  - 그것을 속량하지 않으면
  lexicon: HALOT
  rationale: נִגְאַל은 피동형으로 주체를 드러내지 않으므로, 원문의 수동 구조를 살려 ‘속량되지 않으면’으로 옮겼습니다.
- source_word: וְנִמְכַּר
  english_pob_choice: then it shall be sold
  chosen_korean: 팔릴 것입니다
  alternatives_korean:
  - 팔려야 합니다
  - 팔리게 될 것입니다
  lexicon: HALOT
  rationale: 법률문맥의 피동 표현을 한국어로 자연스럽게 살려, 판정·처분의 결과를 나타내는 ‘팔릴 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 정결/부정의 제의적 구분
  chosen_reading: ‘부정한 짐승들’은 도덕적 악이 아니라 레위기적 정결 범주를 가리키는 것으로 유지했습니다.
  alternative_readings:
  - ‘더러운 짐승들’로 풀어 쓰는 방식
  - ‘부정한 가축들’로 좁히는 방식
  rationale: 본문의 טָמֵא는 제의적 불결을 뜻하므로, 도덕화하거나 과도하게 축소하지 않고 규례의 범주를 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 레위기 11장; 정결/부정 규례
- issue: 속량과 추가 부담의 법적 강제성
  chosen_reading: 동사의 법률적 완료/피동 구조를 따라, 단순 허용이 아니라 처리 절차로 읽히는 문맥을 반영했습니다.
  alternative_readings:
  - ‘속량할 수 있다’는 허용형
  - ‘속량해야 한다’는 명시적 의무형
  rationale: 레위기 27장의 헌물 평가 규정은 사례법 형식이므로, 문맥상 절차적 필연성을 살리되 한국어에서는 과도한 강제 어조를 피했습니다.
  doctrine_reference: 레위기 27장 헌물/서원 규정
