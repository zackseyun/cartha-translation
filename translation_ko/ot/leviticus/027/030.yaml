    reason: lexical_alternative
  revision_rationale: The revision keeps ‘씨’ and ‘나무의 열매’ as the concrete agricultural categories of the Hebrew while making them modify ‘십일조,’ as in the source. It retains the project’s rendering ‘야훼,’ expresses ליהוה as belonging to Yahweh, and renders קדש ליהוה with a natural formal-Korean nominal predicate. The footnote remains anchored to the possessive alternative in the first clause.
