  lexicon: HALOT
  rationale: כָל의 분배적 의미를 한국어에서는 자연스럽게 ‘모든’으로 살리고, cultic term מַעְשַׂר는 교회적 전통어 ‘십일조’가 가장 직접적입니다.
- source_word: הָאָרֶץ / מִזֶּרַע הָאָרֶץ / מִפְּרִי הָעֵץ
  english_pob_choice: of the land / from the seed of the land / from the fruit of the tree
  chosen_korean: 땅 / 땅의 씨 / 나무의 열매
  alternatives_korean:
  - 땅의 소산
  - 땅에 뿌린 씨
  - 나무들의 열매
  lexicon: HALOT
  rationale: 농경 문맥을 따라 ‘땅’으로 옮기고, מקור의 이미지인 ‘씨’와 ‘열매’를 유지해 소출의 구체성을 살렸습니다.
- source_word: לַיהוָה הוּא
  english_pob_choice: belongs to Yahweh
  chosen_korean: 야훼께 속한 것입니다
  alternatives_korean:
