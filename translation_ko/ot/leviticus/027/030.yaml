  - 야훼께 드린 것입니다
  lexicon: HALOT
  rationale: ל의 소유/전속 의미를 ‘속하다’로 풀어, 단순한 헌납이 아니라 야훼께 귀속된 것이라는 점을 분명히 했습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: holy to Yahweh
  chosen_korean: 야훼께 거룩합니다
  alternatives_korean:
  - 야훼께 성별됩니다
  - 야훼께 거룩한 것입니다
  lexicon: HALOT
  rationale: predicate adjective 구조를 따라 ‘거룩하다’로 옮겨, 제의적 구별됨을 한국어로 간결하게 드러냈습니다.
