    rationale: 기존 [a][b]는 각각 이스라엘 자손과 אִישׁ에 대한 주석인데, 핵심 난해 구문인 בְּעֶרְכְּךָ에 대한 주석이 없습니다. 표지를 해당 어구에 배치하고 난해 구문을 설명하는 편이 검증 가능성과 독해에 유익합니다.
