    rationale: בְּעֶרְכְּךָ의 접미사는 모세에게 제시되는 산정 기준과 연결됩니다. 번역에서 이를 드러내야 합니다.
  - severity: medium
    issue: 합쇼체 불일치
    rationale: ‘말하여라’는 해라체이므로 지정된 현대 formal-polite register에 맞지 않습니다.
