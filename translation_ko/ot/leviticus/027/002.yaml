  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
  footnotes:
  - marker: a
    text: Or 'When anyone makes an extraordinary vow, according to your valuation of persons for the LORD.' The Hebrew phrase involving 'your valuation' is difficult; the sense is a vow concerning persons assigned a set valuation in the following verses.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하여라. 「사람이 사람들에 대해 특별한 서원을 하고, 사람들의 값을 야훼께 드리겠다고 할 때에는」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּנֵי יִשְׂרָאֵל은 문자적으로 ‘이스라엘의 아들들’이지만, 언약 백성을 가리키는 표준 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אִישׁ는 문자적으로 ‘남자’이지만, 이 법문에서는 대표적 법률 주어로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר / וְאָמַרְתָּ
  english_pob_choice: Speak ... and say to them
  chosen_korean: 말하여라
  alternatives_korean:
  - 말하십시오
  - 전하여라
  lexicon: HALOT
  rationale: 두 개의 명령형을 한국어에서는 한 번의 직접 명령으로 자연스럽게 묶되, 율법 서문 특유의 공식성을 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 언약 표현을 살려, 남성 가족어 표현을 완화하지 않고 표준적인 성경 어법으로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 남자가
  - 누군가가
  lexicon: HALOT
  rationale: 이 법문에서 אִישׁ는 대표적 법률 주어로 기능하므로, 한국어에서는 성별을 과도하게 강조하지 않으면서도 문맥의 일반성을 살렸습니다.
- source_word: בְּעֶרְכְּךָ
  english_pob_choice: according to your valuation
  chosen_korean: 사람들의 값을
  alternatives_korean:
  - 당신의 평가에 따라
  - 당신의 값을 따라
  lexicon: HALOT
  rationale: 문맥상 ערך는 레위기 27장의 제사장적 '값 매김/평가'를 가리키므로, 추상적인 '평가'보다 실제 금액적 가치 개념이 드러나는 '값'으로 옮겼습니다.
- source_word: נְפָשֹׁת
  english_pob_choice: persons
  chosen_korean: 사람들
  alternatives_korean:
  - 생명들
  - 영혼들
  lexicon: HALOT
  rationale: 법적 문맥에서 נְפָשׁוֹת는 영혼이 아니라 서원 대상이 되는 인간을 가리키므로, 자연스러운 한국어로 '사람들'을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명기적/제의적 결말은 여호와의 고유명사를 직접 가리키므로, 본 프로젝트 기본값에 따라 '야훼'를 사용했습니다.
theological_decisions:
- issue: 레위기 27장의 ערך(값 매김) 표현
  chosen_reading: ‘사람들의 값을’로 번역해 서원의 대상이 사람이며, 그 사람에 대해 제의적으로 책정된 값이 뒤에 전개됨을 드러냈습니다.
  alternative_readings:
  - ‘사람들의 평가를’
  - ‘사람들에 대한 값을’
  rationale: 이 장의 핵심은 도덕적 평가가 아니라 제사장적 가치 산정이므로, 문맥에 맞게 '값'을 유지해야 후속 절차와의 연결이 보입니다.
  doctrine_reference: Leviticus 27:3ff context; ערך valuation legislation
- issue: 서원 대상의 범위
  chosen_reading: ‘사람이 사람들에 대해 특별한 서원을 하고’로 옮겨, 일반적 인칭 주어와 서원의 대상이 사람임을 함께 보였습니다.
  alternative_readings:
  - ‘누구든지 특별한 서원을 하여’
  - ‘사람이 특별한 서원을 하여’
  rationale: 히브리어의 남성 단수 법률문을 보존하되, 한국어에서는 과도한 직역보다 법문 전체의 의미가 분명하도록 구성했습니다.
  doctrine_reference: Translation philosophy §4
