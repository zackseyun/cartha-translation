revisions:
- from: 이스라엘 자손에게 말하여라. 「사람이 사람들에 대해 특별한 서원을 하고, 사람들의 값을 야훼께 드리겠다고 할 때에는」[a][b]
  to: 이스라엘 자손[b]에게 말하여 그들에게 이르십시오. “어떤 사람이 사람을 야훼께 바치기로 특별한 서원을 하면, 당신이 정한 값[a]에 따라 그 사람의 값을 매기십시오.”
  rationale: 수정문은 사람에 관한 특별 서원, 야훼께 대한 헌정, 그리고 모세에게 주어진 평가 기준이라는 원문의 핵심 요소를 보존합니다. 한국어에서 원문의 압축된 명사구를 그대로 재현하면 불완전하고 오해하기 쉬우므로, 다음 절들의 법률적 전개가 전제하는 ‘값을 매기다’를 명시했습니다. 이는 금액을 야훼께 드린다는 초안의 오해를 피하면서도 본문의 제의적·법률적 의미를 자연스럽게 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:52Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘사람들의 값을 야훼께 드리겠다고’는 בְּעֶרְכְּךָ נְפָשֹׁת לַיהוָה를 금액 자체를 야훼께 바치는 것으로 오해하게 합니다. 본문은 야훼께 바치기로 한 사람과 그에 대해 정해지는 মূল্য/평가액에 관한 특별 서원을 가리킵니다. 또한 2인칭 단수 접미사는 모세에게 주어진 평가 기준을 가리키므로 이를 보존해야 합니다.
  naturalness: ‘말하여라’는 요청된 현대 표준어 합쇼체가 아니라 해라체입니다. ‘말하여 그들에게 이르십시오’와 ‘…매기십시오’로 바꾸면 법문 서두의 격식과 합쇼체를 모두 유지할 수 있습니다. ‘사람이 사람들에 대해’도 한국어에서 어색하므로 목적 대상을 ‘사람을 야훼께 바치기로’로 명료하게 처리했습니다.
  terminology: ‘이스라엘 자손’과 ‘야훼’는 유지했습니다. ערך는 이 문맥에서 도덕적 평가가 아닌 제의적·법률적 산정액이므로 ‘값을 매기다’로 옮겼습니다. נְפָשׁוֹת는 ‘영혼’이 아니라 서원의 대상인 사람을 뜻하므로 ‘사람’으로 번역했습니다.
  issues:
  - severity: high
    issue: ‘사람들의 값을 야훼께 드리겠다고’라는 번역
    rationale: 값을 드리는 서원이라는 의미를 만들어 내며, 사람에 관한 서원 및 그 평가액이라는 본문의 법률적 구조를 흐립니다.
  - severity: medium
