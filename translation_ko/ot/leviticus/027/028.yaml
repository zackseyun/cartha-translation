  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew devoted thing (ḥerem), a technical term for something irrevocably set apart to the LORD; in some contexts it can carry the sense of being placed under a ban or devoted to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어떤 사람이 자신에게 속한 모든 것 가운데서, 곧 사람이나 짐승이나 자신이 상속받은 밭을 여호와께 온전히 바치면[a], 그것은 팔 수도 없고 속량할 수도 없습니다. 온전히 바쳐진 것은 모두 여호와께 지극히 거룩합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 헤렘(חֵרֶם)은 어떤 것을 여호와께 돌이킬 수 없게 바치는 것을 가리키는 기술 용어입니다. 문맥에 따라 금령 아래 두거나 멸절에 바치는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞 문맥의 규정에서 예외를 도입하는 대조·전환 표지로 ‘그러나’가 가장 자연스럽고 간결합니다.
- source_word: חֵרֶם / יַחֲרִם
  english_pob_choice: devoted thing / devotes
  chosen_korean: 진설물 / 바치다
  alternatives_korean:
  - 저주 아래 둔 것 / 저주하다
  - 봉헌물 / 봉헌하다
  lexicon: HALOT
  rationale: 이 단어군의 핵심은 여호와께 돌이킬 수 없이 바쳐진 상태이므로, 본문에서는 가시적으로 ‘바친 것’의 의미를 살리되, 전통 교회어인 ‘봉헌물’보다 법적·제의적 긴장을 드러내는 ‘진설물’로 옮겼습니다.
- source_word: מִכָּל אֲשֶׁר לוֹ
  english_pob_choice: from all that belongs to him
  chosen_korean: 사람에게 속한 것이든
  alternatives_korean:
  - 그에게 속한 모든 것 중에서
  - 그의 소유한 것 중에서
  lexicon: HALOT
  rationale: 히브리어의 소유 범위를 자연스럽게 풀어, 뒤따르는 열거를 시작하는 표현으로 처리했습니다.
- source_word: מֵאָדָם וּבְהֵמָה
  english_pob_choice: human or animal
  chosen_korean: 사람이든, 짐승이든
  alternatives_korean:
  - 사람이든, 동물이든
  - 인간이든, 짐승이든
  lexicon: HALOT
  rationale: 여기서는 אדם이 ‘사람/인간’ 범주로 짐승과 대조되므로, 법조문 어조를 살리는 ‘사람’과 ‘짐승’을 채택했습니다.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  english_pob_choice: or from the field of his inherited property
  chosen_korean: 또는 그의 유산 땅의 밭에서 나온 것이든
  alternatives_korean:
  - 또는 그의 상속 재산의 밭이든
  - 또는 그의 조상 대대로 물려받은 밭이든
  lexicon: HALOT
  rationale: אֲחֻזָּה의 법적 뉘앙스인 세습적 토지 소유를 ‘유산 땅’으로 반영해, 단순한 소유물이 아니라 분배받은 기업 땅임을 드러냈습니다.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  english_pob_choice: shall not be sold or redeemed
  chosen_korean: 팔 수 없고 속량할 수도 없습니다
  alternatives_korean:
  - 팔 수도 없고 되찾을 수도 없습니다
  - 팔아 넘길 수도 없고 구속할 수도 없습니다
  lexicon: HALOT
  rationale: 법적 금지문의 형식에 맞춰 현대 한국어로 간결하게 옮겼으며, גאל은 문맥상 ‘속량’이 가장 정확한 법·제의어입니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩한
  alternatives_korean:
  - 가장 거룩한
  - 극히 거룩한
  lexicon: HALOT
  rationale: 히브리어 최상급 중첩을 한국어의 관용적 최상 표현인 ‘지극히’로 대응해, 단순한 ‘거룩한’보다 강도를 분명히 했습니다.
theological_decisions:
- issue: חֵרֶם의 의미를 본문에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘여호와께 바치는 진설물’로 두어 돌이킬 수 없는 헌납성을 전면에 두었습니다.
  alternative_readings:
  - 저주 아래 둔 것
  - 멸절을 위해 바친 것
  - 금지된 것
  rationale: 이 절은 판매·속량 불가와 ‘지극히 거룩함’을 강조하므로, 파괴의 측면을 본문에 직접 넣기보다 헌납의 불가역성을 살렸습니다. 다만 용어 자체의 긴장은 ‘진설물’ 선택으로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: אדם의 범주를 어떻게 처리할지
  chosen_reading: 대표적 법률 문체를 살려 ‘사람’으로 두었습니다.
  alternative_readings:
  - 인간
  - 누구든지
  rationale: 히브리어의 남성 단수 법률 문체를 흐리지 않으면서도, 짐승과의 대비를 살리는 한국어 표현이 필요했습니다.
  doctrine_reference: Translation philosophy §4
