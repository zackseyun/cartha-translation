revisions:
- from: 그러나 사람이 여호와를 위해 바치는 모든 진설물은, 사람에게 속한 것이든, 짐승이든, 또는 그의 유산 땅의 밭에서 나온 것이든, 팔 수 없고 속량할 수도 없습니다. 모든 진설물은 여호와께 지극히 거룩한 것입니다.[a]
  to: 그러나 어떤 사람이 자신에게 속한 모든 것 가운데서, 곧 사람이나 짐승이나 자신이 상속받은 밭을 여호와께 온전히 바치면[a], 그것은 팔 수도 없고 속량할 수도 없습니다. 온전히 바쳐진 것은 모두 여호와께 지극히 거룩합니다.
  rationale: 핵심 기술어를 현대 한국어에서 오해 없이 전달하도록 ‘진설물’을 ‘온전히 바친 것’으로 고쳤습니다. 동사와 명사의 어근 관계를 ‘온전히 바치면/온전히 바쳐진 것’으로 드러냈고, 밭 자체가 열거된 원문의 범위를 회복했습니다. 금령 또는 멸절의 가능한 함의는 본문에 강제하지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:41Z'
review_pass:
  verdict: revise
  source_fidelity: ‘진설물’은 제단에 차려 놓는 제의적 물품을 가리키는 말로 חֵרֶם의 ‘돌이킬 수 없게 여호와께 바침’이라는 법적·기술적 의미를 정확히 전달하지 못합니다. 또한 ‘그의 유산 땅의 밭에서 나온 것’은 히브리어가 밭 자체를 열거하는 구문을 ‘밭의 산물’로 바꿉니다. 아래 개정문은 소유물 가운데 사람, 짐승, 상속받은 밭을 여호와께 바쳐 되돌릴 수 없게 하는 범위를 보존합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체의 법규 문맥에 맞추어 ‘온전히 바친 것’과 ‘속량할 수도 없습니다’를 사용합니다. ‘자신에게 속한 모든 것 가운데서’가 뒤의 열거를 자연스럽게 받으며, ‘사람이나 짐승’이라는 원문의 범주 대조도 유지합니다.
  terminology: חֵרֶם/יַחֲרִם은 본문에서 ‘온전히 바치다/온전히 바친 것’으로 일관되게 옮기고, 각주에서 돌이킬 수 없는 봉헌 및 문맥상 금령·멸절의 함의를 설명합니다. גאל은 이 장의 법적 용례에 맞게 ‘속량하다’로 유지하며, קֹדֶשׁ קָדָשִׁים은 ‘지극히 거룩합니다’로 옮깁니다.
  issues:
  - severity: high
    issue: ‘진설물’은 חֵרֶם의 부정확한 번역입니다.
    rationale: ‘진설’은 음식을 제단 앞에 차려 놓는 행위 및 그 제물을 연상시키며, 본문의 취소 불가능한 봉헌·금령의 법적 지위를 뜻하지 않습니다.
  - severity: high
    issue: ‘그의 유산 땅의 밭에서 나온 것’이 밭 자체를 그 산물로 변경합니다.
    rationale: וּמִשְּׂדֵה אֲחֻזָּתוֹ는 ‘그의 상속 재산의 밭으로부터/그 밭’을 가리키며, 본문은 밭에서 생산된 물건에 한정하지 않습니다.
