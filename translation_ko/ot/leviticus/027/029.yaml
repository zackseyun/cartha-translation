  source_fidelity: 개정이 필요합니다. 초안의 ‘사람에게서 바쳐진 모든 바친 것’은 מִן־הָאָדָם을 부자연스럽게 처리하고 חֵרֶם/יָחֳרַם의 연관도 한국어에서 중복되고 불명확하게 만듭니다. ‘사람 가운데서 온전히 바쳐진 것’은 인간과 관련된 ḥerem이라는 문맥을 보존하면서도 기술적 ‘바침’의 의미를 유지합니다. ‘반드시 죽임을 당해야 합니다’는 מוֹת יוּמָת의 강조된 수동 죽음 공식을 충실히 옮깁니다.
