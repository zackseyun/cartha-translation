  terminology: חֵרֶם 및 관련 동사는 레위기 27장의 성별·봉헌 문맥에 맞춰 ‘온전히 바쳐진’으로 일관되게 처리했습니다. פדה는 ‘속량하다’로, מוֹת יוּמָת은 ‘반드시 죽임을 당하다’로 옮겼습니다. ‘사람 가운데서’에 주석을 두어 אָדָם이 인류 가운데의 한 사람을 가리키는 문맥적 의미를 밝혔습니다.
