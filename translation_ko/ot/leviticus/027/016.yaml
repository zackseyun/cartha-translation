  verdict: revise
  source_fidelity: 첫 절의 ‘자기 소유 밭의 일부’와 야훼께 구별해 바치는 행위는 히브리어를 잘 반영합니다. 그러나 עֶרְכְּךָ는 단순한 내재적 ‘가치’보다 법적으로 정하는 ‘평가액’이며, 끝 절은 ‘그러한 토지’ 자체가 은 오십 세겔이라는 뜻으로 옮기기보다 보리 한 호멜을 파종할 씨의 양을 기준으로 평가액을 은 오십 세겔로 정한다는 구문을 드러내야 합니다.
  naturalness: ‘거룩하게 구별해 바치면’은 이해 가능하지만 ‘거룩하게 구별하여 바치면’이 현대의 격식 있는 문장에 더 매끄럽습니다. ‘보리 한 호멜을 뿌릴 수 있는 양에 해당하는 땅은’은 수식 관계가 길고 평가 대상이 바뀐 듯 들리므로, 파종할 씨의 양과 평가액을 직접 연결하는 편이 자연스럽습니다.
  terminology: ‘야훼’, ‘호멜’, ‘세겔’은 적절합니다. עֶרֶך의 문맥상 용어는 ‘가치’보다 ‘평가액’이 정확하며, זַרְעוֹ는 ‘그 밭에 뿌릴 씨의 양’으로 명시하는 것이 농업상의 평가 기준을 보존합니다.
