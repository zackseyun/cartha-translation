id: LEV.27.16
reference: Leviticus 27:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
  footnotes:
  - marker: a
    text: Or, 'some of the field of his inheritance.' The Hebrew expression refers to land held as a hereditary possession, and the prefixed 'from' suggests only part of the field is being consecrated.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 자기 소유 밭의 일부를 야훼께 거룩하게 구별해 바치면, 그 가치는 그 씨 뿌릴 양에 따라 정해야 합니다. 곧 보리 한 호멜을 뿌릴 수 있는 양에 해당하는 땅은 은 오십 세겔입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 상속 재산의 밭에서 일부’. 히브리어 표현은 세습적으로 물려받은 토지를 가리키며, 앞의 ‘~에서’는 밭 전체가 아니라 일부만을 봉헌함을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  english_pob_choice: part of the field of his possession
  chosen_korean: 자기 소유 밭의 일부
  alternatives_korean:
  - 자기 상속 소유의 밭에서 일부
  - 자기 유산 토지의 일부
  lexicon: HALOT
  rationale: מִן이 붙은 표현이므로 밭 전체가 아니라 ‘~에서 일부’를 뜻하게 하며, אֲחֻזָּה는 세습적 토지 소유를 가리키므로 ‘소유’로 간결하게 살렸습니다.
- source_word: יַקְדִּישׁ
  english_pob_choice: consecrates
  chosen_korean: 거룩하게 구별해 바치면
  alternatives_korean:
  - 성별하면
  - 봉헌하면
  lexicon: HALOT
  rationale: 레위기 27장의 문맥에서는 단순한 헌납이 아니라 야훼께 속하도록 따로 떼어 두는 행위이므로, 제의적 의미가 드러나는 표현을 택했습니다.
- source_word: לַֽיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 옮겼으며, 경어 조사 ‘-께’로 한국어 문체에 맞췄습니다.
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 그 가치는
  alternatives_korean:
  - 그 평가액은
  - 그 산정가는
  lexicon: HALOT
  rationale: 레위기 27장의 기술 용례에서 제사장적 평가액을 뜻하므로 ‘가치’로 풀되, 문장 전체에서는 자연스러운 법률문체를 위해 ‘정하다’와 결합했습니다.
- source_word: לְפִי זַרְעוֹ / זֶרַע חֹמֶר שְׂעֹרִים
  english_pob_choice: according to its seed requirement / the seed of a homer of barley
  chosen_korean: 그 씨 뿌릴 양에 따라 / 보리 한 호멜을 뿌릴 수 있는 양
  alternatives_korean:
  - 씨앗 필요량에 따라 / 보리 한 호멜의 씨
  - 파종량에 따라 / 보리 한 호멜 분량
  lexicon: HALOT
  rationale: 자투리 해석으로 ‘씨’의 양이 아니라 파종에 필요한 양을 뜻하므로, 의미를 분명히 드러내는 ‘씨 뿌릴 양’으로 옮겼고, 측정 단위 호멜은 음역해 유지했습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 프로젝트 표준에 따라 신명은 번역어 ‘주’로 흡수하지 않고 고유 이름을 보존하는 것이 본문의 언약적·법적 성격을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
