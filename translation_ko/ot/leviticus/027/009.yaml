id: LEV.27.9
reference: Leviticus 27:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
  footnotes:
  - marker: a
    text: Or 'of which they bring an offering to the LORD.' The Hebrew wording can be understood either as describing an animal suitable for presentation as an offering or an animal from which an offering is actually presented.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 사람이 제물로 바치는 데 쓰는 가축이면, 그 가운데서 드리는 모든 것은 야훼께 거룩할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람들이 제물을 바치는 소유물 가운데서.' 히브리어 표현은 제물로 바치기에 적합한 가축을 가리키는 것으로도, 실제로 그 가축에서 제물을 드리는 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 법률 조항의 연결과 조건을 함께 살리기 위해, 이어짐을 나타내는 '그리고'와 조건 표지 '만일'을 함께 두었습니다.
- source_word: בְּהֵמָה
  english_pob_choice: animal
  chosen_korean: 가축
  alternatives_korean:
  - 동물
  - 짐승
  lexicon: HALOT
  rationale: 제의 문맥에서 일반 동물보다 제물로 쓰이는 가축 범주가 더 분명하므로, 현대 한국어로는 '가축'이 가장 자연스럽고 구체적입니다.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  english_pob_choice: from which they present an offering to the LORD
  chosen_korean: 제물로 바치는 데 쓰는
  alternatives_korean:
  - 그 가운데서 야훼께 제물을 드리는
  - 그것으로 야훼께 제물을 바치는
  lexicon: HALOT
  rationale: 히브리어는 '그것에서/그것으로 제물을 드리는' 뜻이지만, 한국어에서는 '제물로 바치는 데 쓰는'이 제의적 용도를 가장 자연스럽게 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명은 '야훼'로 옮기고, 여격 표지는 '-께'로 표시했습니다.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  english_pob_choice: everything that one gives from it
  chosen_korean: 그 가운데서 드리는 모든 것은
  alternatives_korean:
  - 그것에서 바치는 모든 것은
  - 그것으로 드리는 모든 것은
  lexicon: HALOT
  rationale: 앞절의 단수 집합 명사를 받아 '그 가운데서'로 지시를 분명히 하고, 일반적·포괄적 의미의 '모든 것'을 살렸습니다.
- source_word: יִהְיֶה קֹדֶשׁ
  english_pob_choice: shall be holy
  chosen_korean: 거룩할 것입니다
  alternatives_korean:
  - 거룩하게 될 것입니다
  - 성별될 것입니다
  lexicon: HALOT
  rationale: קֹדֶשׁ의 제의적 거룩함을 '거룩하다'로 직접 옮기되, 현대 합쇼체의 서술형으로 정리했습니다.
theological_decisions:
- issue: 여호와/야훼 대역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신명기적 제의 규정 속에서 직접 신명 יְהוָה를 사용하므로, 본 프로젝트 기본 원칙에 따라 고유명 '야훼'를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
