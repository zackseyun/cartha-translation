    rationale: 이 문맥의 מִכְסַת הָעֶרְכְּךָ는 희년까지 남은 기간에 따라 산정되는 평가액의 해당 몫입니다. ‘희년까지에 해당하는 그의 평가액’이 이를 자연스럽게 드러냅니다.
