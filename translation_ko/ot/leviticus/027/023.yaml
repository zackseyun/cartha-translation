  source_fidelity: 수정이 필요합니다. 초안은 מִכְסַת הָעֶרְכְּךָ를 ‘당신의 서원의 값의 비례’로 다소 부자연스럽게 옮겼고, 특히 후반의 목적어인 הָעֶרְכְּךָ(평가액)를 ‘당신의 서원’으로 바꾸어 원문의 뜻을 변경했습니다. 해당 금액은 서원 자체가 아니라 제사장이 산정한 평가액(희년까지의 기간에 해당하는 몫)입니다.
  naturalness: ‘희년까지의 비례에 따라 계산하고’와 ‘당신의 서원을 ... 예물로 드려야 합니다’는 현대 한국어에서 어색하거나 의미 관계가 불명확합니다. ‘희년까지에 해당하는 그의 평가액을 산정하고’ 및 ‘그 평가액을 ... 드려야 합니다’가 자연스럽고 문맥을 명료하게 합니다.
  terminology: עֵרֶךְ의 기술적 의미는 ‘서원의 값’보다 ‘평가액’으로 옮기는 편이 정확합니다. קֹדֶשׁ לַיהוָה는 본문의 제의적 문맥에서 ‘야훼께 거룩한 예물로’라고 번역할 수 있으며, 더 직역적인 대안은 각주로 제시합니다. ‘야훼’ 표기는 제공된 POB 방침과 일치합니다.
  issues:
