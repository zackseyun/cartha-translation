revisions:
- from: 그러면 제사장은 그를 위해 당신의 서원의 값을 희년까지의 비례에 따라 계산하고, 그날에 당신의 서원을 야훼께 거룩한 예물로 드려야 합니다.[a]
  to: 그러면 제사장은 그를 위하여 희년까지에 해당하는 그의 평가액을 산정할 것이며, 그날 그 사람은 그 평가액을 야훼께 거룩한 예물로[a] 드려야 합니다.
  rationale: 제사장이 산정하는 역할과 그 사람이 평가액을 드리는 역할을 문맥에 따라 구분하되, 히브리어에서 후반절의 주어가 생략된 점은 ‘그 사람’으로 최소한으로 명료화했습니다. ‘평가액’은 레위기 27장의 עֵרֶךְ의 기술적 용법을 보존하고, ‘희년까지에 해당하는’은 מִכְסָה와 희년까지의 산정 범위를 반영합니다. 각주는 קֹדֶשׁ לַיהוָה의 보다 문자적인 번역을 제공합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:41Z'
