  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
  footnotes:
  - marker: a
    text: Or, more formally, 'holy to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 제사장은 그를 위해 당신의 서원의 값을 희년까지의 비례에 따라 계산하고, 그날에 당신의 서원을 야훼께 거룩한 예물로 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘희년’은 공식 명칭을 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְחִשַּׁב ל֣וֹ הַכֹּהֵן
  english_pob_choice: then the priest shall calculate for him
  chosen_korean: 제사장은 그를 위해 ... 계산하고
  alternatives_korean:
  - 제사장은 그에게 ... 계산하고
  - 제사장은 그를 위하여 ... 헤아리고
  lexicon: HALOT
  rationale: חִשֵּׁב의 핵심은 수량을 산정하는 ‘계산하다’이며, לּוֹ는 수혜적 방향을 나타내므로 ‘그를 위해’가 자연스럽습니다.
- source_word: מִכְסַת הָעֶרְכְּךָ
  english_pob_choice: the proportion of your valuation
  chosen_korean: 당신의 서원의 값의 비례
  alternatives_korean:
  - 당신의 서원의 금액
  - 당신의 평가액의 몫
  lexicon: HALOT
  rationale: מִכְסָה는 정해진 몫이나 비율을 뜻하므로 ‘비례’로 옮겨 희년까지의 비례 계산이라는 문맥을 살렸습니다. עֶרֶךְ은 레위기 27장의 기술적 용어이므로 ‘서원의 값’으로 풀어 의미를 드러냈습니다.
- source_word: עַד שְׁנַת הַיֹּבֵל
  english_pob_choice: up to the Year of Jubilee
  chosen_korean: 희년까지
  alternatives_korean:
  - 희년의 해까지
  - 희년 때까지
  lexicon: HALOT
  rationale: 문맥상 산정의 종점이 희년이므로 가장 간결하고 직접적인 표현으로 옮겼습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: as a holy offering to Yahweh
  chosen_korean: 야훼께 거룩한 예물로
  alternatives_korean:
  - 야훼께 거룩하게
  - 야훼께 성별된 예물로
  lexicon: HALOT
  rationale: קֹדֶשׁ לַיהוָה는 문자적으로 ‘야훼께 거룩한’이므로, 제의적 맥락을 살려 ‘거룩한 예물로’ 옮겼습니다. POB의 ‘offering’은 한국어에서 ‘예물’이 가장 덜 해석적입니다.
theological_decisions:
- issue: 희년까지의 산정과 그날의 헌납 주체
  chosen_reading: 제사장은 산정하고, 서원을 한 사람은 그날에 값을 야훼께 드립니다.
  alternative_readings:
  - 제사장이 그 값을 드립니다
  - 그 사람이 제사장에게 그 값을 줍니다
  rationale: 히브리어는 ‘그가 줄 것이다’의 주어를 생략하지만, 앞뒤 문맥은 제사장의 역할이 계산이며 실제 헌납은 서원자가 행하는 것으로 읽히므로 이를 반영했습니다.
  doctrine_reference: 레위기 27장의 서원/속전 규정 문맥
