theological_decisions:
- issue: קדשׁ의 제의적 뉘앙스
  chosen_reading: ‘거룩하게 바치다’로 옮겨, 단순한 기부보다 하나님께 구별하여 드리는 행위임을 드러냈습니다.
  alternative_readings:
  - 봉헌하다
  - 헌납하다
  - 성별하다
  rationale: 본문은 토지의 소유 이전보다 거룩한 용도의 구별을 다루므로, 제의적 의미를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 레위기 성결 규정의 제의적 구별 개념
- issue: 법정/행정 문체의 효력 표현
  chosen_reading: ‘그대로 유효합니다’로 옮겨, मूल्य/평가 규정이 법적 구속력을 가진다는 점을 분명히 했습니다.
  alternative_readings:
  - 확정됩니다
  - 서게 됩니다
  - 유지됩니다
  rationale: yāqûm의 행정적·법적 효력을 드러내되, 과도한 신학적 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: 토라의 규정 준수와 법적 효력
