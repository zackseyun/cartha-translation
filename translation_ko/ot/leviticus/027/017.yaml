    text: Or 'dedicates his field.' The Hebrew verb carries the sense of setting something apart as holy.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 희년부터 그가 자기 밭을 성별하여 바치면, 그대가 정한 값은 그대로 유효합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성별하여 바치다’는 히브리어 동사가 단순히 기부하는 것이 아니라 하나님께 거룩한 용도로 구별하여 드리는 것을 뜻함을 나타냅니다.
    reason: lexical_alternative
