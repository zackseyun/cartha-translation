  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
  footnotes:
  - marker: a
    text: Or 'dedicates his field.' The Hebrew verb carries the sense of setting something apart as holy.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 희년의 해부터 그가 자기 밭을 거룩하게 바치면, 당신의 평가가 그대로 유효합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩하게 바치다’는 히브리어 동사가 단순한 기부가 아니라 하나님께 구별하여 성스럽게 지정하는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - إذا
  - ~하면
  lexicon: WLC
  rationale: 조건문의 시작을 분명히 드러내는 표준적인 법률문체로 옮겼습니다.
- source_word: מִשְּׁנַת הַיֹּבֵל
  english_pob_choice: from the year of jubilee
  chosen_korean: 희년의 해부터
  alternatives_korean:
  - 희년의 해에서
  - 희년 해부터
  lexicon: WLC
  rationale: מִן의 출발점 의미를 살려 ‘-부터’로 옮기고, 제도명은 ‘희년’으로 표준화했습니다.
- source_word: יַקְדִּישׁ
  english_pob_choice: he consecrates
  chosen_korean: 거룩하게 바치면
  alternatives_korean:
  - 봉헌하면
  - 헌납하면
  - 성별하면
  lexicon: HALOT
  rationale: קדשׁ의 히필이 지닌 ‘거룩하게 구별하여 바치다’는 의미를 살리되, 한국어에서는 제의적 헌신을 드러내는 표현을 택했습니다.
- source_word: כְּעֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 당신의 평가
  alternatives_korean:
  - 당신의 가치 산정
  - 당신의 정가
  - 당신의 책정
  lexicon: HALOT
  rationale: 법적 문맥의 ‘평가/가치 산정’을 자연스럽게 드러내면서, 문맥상 제사장의 평가를 가리키는 점을 반영했습니다.
- source_word: יָקוּם
  english_pob_choice: shall stand
  chosen_korean: 그대로 유효합니다
  alternatives_korean:
  - 유효하게 됩니다
  - 서게 됩니다
  - 확정됩니다
  lexicon: HALOT
  rationale: 법률 조항에서의 קום은 ‘성립하다, 유효하다’의 뜻이므로, 규정의 효력을 분명히 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: קדשׁ의 제의적 뉘앙스
  chosen_reading: ‘거룩하게 바치다’로 옮겨, 단순한 기부보다 하나님께 구별하여 드리는 행위임을 드러냈습니다.
  alternative_readings:
  - 봉헌하다
  - 헌납하다
  - 성별하다
  rationale: 본문은 토지의 소유 이전보다 거룩한 용도의 구별을 다루므로, 제의적 의미를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 레위기 성결 규정의 제의적 구별 개념
- issue: 법정/행정 문체의 효력 표현
  chosen_reading: ‘그대로 유효합니다’로 옮겨, मूल्य/평가 규정이 법적 구속력을 가진다는 점을 분명히 했습니다.
  alternative_readings:
  - 확정됩니다
  - 서게 됩니다
  - 유지됩니다
  rationale: yāqûm의 행정적·법적 효력을 드러내되, 과도한 신학적 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: 토라의 규정 준수와 법적 효력
