source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
  footnotes:
  - marker: a
    text: Or, 'a field he has bought,' in contrast to land belonging to his ancestral inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그가 자기 매입지의 밭, 곧 자기 유전의 밭에 속하지 않은 것을 야훼께 거룩하게 구별하여 바친다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 산 밭’ — 조상에게서 물려받은 토지와 대비되는, 매입으로 취득한 땅이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절의 경우와 이어지는 조건문이면서도 대조의 흐름이 있어 ‘그러나 만일’로 옮기는 것이 자연스럽습니다.
- source_word: שְׂדֵה מִקְנָתוֹ
  english_pob_choice: a field of his purchase
  chosen_korean: 그의 매입지의 밭
  alternatives_korean:
  - 그가 산 밭
  - 매입한 밭
  lexicon: HALOT
  rationale: 히브리어 소유격 결합을 살려 ‘매입지의 밭’으로 옮겨, 단순히 ‘산’이라는 동작보다 이미 취득된 법적 소유 성격을 드러냈습니다.
- source_word: אֲחֻזָּה
  english_pob_choice: inherited property
  chosen_korean: 유전
  alternatives_korean:
  - 상속 재산
  - 조상 유산
  lexicon: HALOT
  rationale: 레위기에서 아חֻזָּה는 조상에게서 물려받은 토지 소유를 가리키므로, ‘유전’이 법적·토지적 의미를 간결하게 전달합니다.
- source_word: יַקְדִּישׁ
  english_pob_choice: he consecrates
  chosen_korean: 거룩하게 구별하여 바친다면
  alternatives_korean:
  - 성별한다면
  - 봉헌한다면
  lexicon: HALOT
  rationale: 레위기 27장의 문맥상 단순 헌납이 아니라 여호와께 속하도록 따로 구별하는 제의적·법적 행위이므로, 그 의미를 풀어 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명 표기를 원문 근거에 따라 ‘야훼’로 옮기고, 여격 조사를 붙여 자연스러운 한국어 문장으로 만들었습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 언약명의 직접 표기이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 보존하여 מקור의 고유성을 드러냈습니다.
  doctrine_reference: 'POB glossary: YHWH → 야훼'
