  to: 그러나 그 밭은 희년에 반환될 때 야훼께 거룩한 것이 되며, 바쳐진 밭[a]처럼 제사장의 소유지가 됩니다.
  rationale: 희년의 ‘나감’은 이 문맥에서 밭이 법적으로 반환되는 때를 가리키므로 ‘반환될 때’로 수정했습니다. חֵרֶם의 강한 철회 불가능한 봉헌 성격은 각주에서 설명하되, 본문이 직접 말하지 않는 멸절을 본문 번역에 추가하지 않았습니다. 각주 표지는 해당 어휘인 ‘바쳐진 밭’에 붙였습니다.
