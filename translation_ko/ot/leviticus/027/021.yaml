reference: Leviticus 27:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
  footnotes:
  - marker: a
    text: Or 'like a field under the ban.' The Hebrew term refers to something irrevocably devoted to the LORD and removed from ordinary human use.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 밭은 희년이 되어 해방될 때 야훼께 거룩한 것이니, 멸절에 바쳐진 밭과 같으며, 그것은 제사장의 소유가 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주 아래 있는 밭’. 여기서 히브리어는 일반적 사용에서 완전히 분리되어 야훼께 돌려진 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  english_pob_choice: when it is released in the Jubilee
  chosen_korean: 희년이 되어 해방될 때
  alternatives_korean:
  - 희년에 나갈 때
  - 희년에서 풀려날 때
  lexicon: HALOT
  rationale: 희년의 법적 복귀를 한국어로 자연스럽게 드러내면서, 단순한 이동 표현보다 ‘해방/풀려남’의 제도적 의미를 살렸습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: holy to Yahweh
  chosen_korean: 야훼께 거룩한 것이니
  alternatives_korean:
  - 야훼께 거룩하니
  - 야훼께 성별되니
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, קדש의 성별됨을 ‘거룩한 것’으로 표현해 법조문의 선언성을 유지했습니다.
- source_word: כִּשְׂדֵה הַחֵרֶם
  english_pob_choice: like a field devoted to destruction
  chosen_korean: 멸절에 바쳐진 밭과 같으며
  alternatives_korean:
  - 저주 아래 있는 밭과 같으며
  - 바침 아래 있는 밭과 같으며
  lexicon: HALOT
  rationale: חֵרֶם의 강한 전적 헌납/제거 의미를 약화시키지 않기 위해, 전통적 완곡어보다 결과를 드러내는 ‘멸절에 바쳐진’으로 옮겼습니다.
- source_word: תִּהְיֶה אֲחֻזָּתוֹ
  english_pob_choice: it shall be the priest’s possession
  chosen_korean: 그것은 제사장의 소유가 됩니다
  alternatives_korean:
  - 그것은 제사장의 소유가 될 것입니다
  - 그것은 제사장에게 속한 소유가 됩니다
  lexicon: HALOT
  rationale: 아후자(소유지/보유분)의 법적 귀속을 한국어에서 간명하게 드러내기 위해 ‘소유가 됩니다’로 처리했습니다.
theological_decisions:
- issue: חֵרֶם의 신학적 강도 유지
  chosen_reading: ‘멸절에 바쳐진’으로 옮겨, 단순한 헌납이 아니라 완전히 구별되어 일반 사용에서 제거되는 성격을 드러냈습니다.
  alternative_readings:
  - ‘저주 아래 있는’
  - ‘바쳐진’
  rationale: 이 절은 희년 귀속 규정 가운데서도 hērem의 절대적 구별성을 비교하는 문맥이므로, 완곡한 표현은 본문의 법적·신학적 긴장을 약화시킬 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 희년 해방의 법적 의미
  chosen_reading: ‘희년이 되어 해방될 때’로 옮겨, 단순한 시간표시가 아니라 재귀속·해방 사건임을 나타냈습니다.
  alternative_readings:
  - ‘희년에 나갈 때’
  - ‘희년이 올 때’
  rationale: 히브리어 관용구의 문자성과 제도적 의미를 함께 살려, 소유권 복귀라는 율법 문맥을 분명히 하려는 선택입니다.
  doctrine_reference: Translation philosophy §1
