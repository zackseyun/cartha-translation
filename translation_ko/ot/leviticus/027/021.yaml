  source_fidelity: ‘희년이 되어 해방될 때’는 밭 자체가 해방된다는 뜻으로 읽혀 בְּצֵאתוֹ의 희년 재귀속/반환 관용구를 부정확하게 만듭니다. 또한 חֵרֶם을 ‘멸절에 바쳐진’으로 한정하면, 이 법률 문맥에서 명시되지 않은 멸절을 본문에 더할 수 있습니다.
  naturalness: ‘희년에 반환될 때’와 ‘제사장의 소유지’는 현대 표준 한국어의 법률적 문맥에서 자연스럽고, 합쇼체의 규정문 어조도 유지합니다.
  terminology: יהוה는 초안과 프로젝트 관례에 맞춰 ‘야훼’로 유지합니다. אֲחֻזָּה는 단순한 물건의 ‘소유’보다 토지 보유지의 뜻을 살린 ‘소유지’가 적절합니다. חֵרֶם은 본문에서는 ‘바쳐진’으로 절제하여 옮기고, 각주에서 철회 불가능한 봉헌 및 일반 용도 제외의 의미를 밝혀 모호성을 보존합니다.
