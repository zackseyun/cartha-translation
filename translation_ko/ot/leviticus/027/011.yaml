  source_fidelity: 개정안은 וְאִם의 조건문, כָּל의 부정적 용법(‘어떤’), 그리고 ‘그것으로부터/그것을 제물로’라는 מִמֶּנָּה의 관계를 분명히 반영합니다. יַקְרִיבוּ의 일반적 복수형은 본문에서는 자연스러운 일반 주어 ‘사람들이’로, 각주에서는 비인칭 용법에 대한 설명으로 보존했습니다.
  naturalness: 초안의 ‘부정한 가축이 있어서 … 경우에는’은 조건문이 겹치고 다소 우회적입니다. ‘만일 … 가축이면’으로 간결하게 고치고, 제의적 부정을 나타내는 ‘부정한’과 현대 한국어의 합쇼체를 유지했습니다.
  terminology: בְּהֵמָה는 이 문맥에서 ‘가축’으로, טְמֵאָה는 제의적 의미의 ‘부정한’으로, קָרְבָּן은 ‘제물’로 옮기는 것이 적절합니다. יהוה는 프로젝트의 결정에 따라 ‘야훼’로 유지했습니다.
