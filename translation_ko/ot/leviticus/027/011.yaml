id: LEV.27.11
reference: Leviticus 27:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
  footnotes:
  - marker: a
    text: Or, 'from which one may not bring an offering to the LORD.' The Hebrew uses a general plural verb ('they may not present') with impersonal force.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 부정한 가축, 곧 사람들이 그것을 야훼께 제물로 바칠 수 없는 가축이면, 그는 그 가축을 제사장 앞에 세워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들이 그것으로 야훼께 제물을 바치지 않는 가축’이라고 할 수 있습니다. 히브리어는 일반적인 복수형 동사를 비인칭적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그런데 … 경우에는
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절의 규정을 이어 받으면서 대비를 분명히 하는 조건문이므로, 한국어에서는 ‘그런데 … 경우에는’이 자연스럽고 문맥상의 전환을 잘 드러냅니다.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  english_pob_choice: any unclean animal
  chosen_korean: 부정한 가축
  alternatives_korean:
  - 부정한 동물
  - 어떤 부정한 가축
  lexicon: HALOT
  rationale: 여기서 בְּהֵמָה는 일반적인 ‘동물’보다 가축/짐승의 범주를 가리키는 법률 문맥이므로 ‘가축’이 더 정확하며, טְמֵאָה는 제의적 부정 상태를 뜻하는 ‘부정한’으로 옮겼습니다.
- source_word: יַקְרִיבוּ ... קָרְבָּן
  english_pob_choice: present an offering
  chosen_korean: 제물을 바칠 수 없는
  alternatives_korean:
  - 제물을 드릴 수 없는
  - 예물을 바칠 수 없는
  lexicon: HALOT
  rationale: הקריב의 제의적 의미를 살려 ‘제물을 바치다’로 옮겼고, קָרְבָּן은 일반적인 ‘제물’로 처리하여 본문의 희생 제의 맥락을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 시리즈의 기본 원칙에 따라 신명기적 언약명 יְהוָה는 음역형 ‘야훼’로 옮겨, 일반 호칭과 구별했습니다.
- source_word: וְהֶעֱמִיד ... לִפְנֵי הַכֹּהֵן
  english_pob_choice: then he shall set the animal before the priest
  chosen_korean: 그는 그 가축을 제사장 앞에 세워야 합니다
  alternatives_korean:
  - 그는 그 가축을 제사장 앞에 놓아야 합니다
  - 그는 그 가축을 제사장 앞에 प्रस्तुत해야 합니다
  lexicon: HALOT
  rationale: עָמַד의 사역형은 ‘세우다/서게 하다’가 기본값이므로, 법정·제의적 절차를 드러내는 ‘제사장 앞에 세우다’가 가장 직접적입니다.
theological_decisions:
- issue: 언약명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 성호를 직접 사용하므로, 전통적 대체어보다 원문 대응성이 높은 ‘야훼’를 유지해 독자가 본문의 신명법적 정체성을 바로 읽도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
