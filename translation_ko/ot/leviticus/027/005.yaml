  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: ko
  text: 다섯 살부터 스무 살까지인 경우, 평가액은 남자의 경우 이십 세겔이고 여자의 경우 십 세겔입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 만일 …이면
  alternatives_korean:
  - 그리고 만일 …이면
  - 만약 …이면
  lexicon: HALOT
  rationale: 조건절을 분명히 드러내면서 법규 문맥에 자연스러운 한국어로 옮겼습니다.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  english_pob_choice: from five years old up to twenty years old
  chosen_korean: 다섯 살부터 스무 살까지
  alternatives_korean:
  - 다섯 살에서 스무 살까지
  - 다섯 살의 나이부터 스무 살의 나이까지
  lexicon: HALOT
  rationale: 연령 범위를 한국어 관용에 맞게 간결하게 재현했습니다. ‘살’ 표현이 원문의 나이 구문을 가장 자연스럽게 반영합니다.
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 너의 값
  alternatives_korean:
  - 너의 평가액
  - 너의 산정가
  lexicon: HALOT
  rationale: 레위기 27장의 서원 평가 규정을 따라 ‘값’으로 옮겨 법적 산정 의미를 살렸습니다. ‘너의’는 청자에게 직접 주어진 규정임을 유지합니다.
- source_word: הַזָּכָר ... וְלַנְּקֵבָה
  english_pob_choice: the male ... the female
  chosen_korean: 남자는 … 여자는
  alternatives_korean:
  - 수컷은 … 암컷은
  - 남성은 … 여성은
  lexicon: HALOT
  rationale: 평가 표의 성별 구분을 한국어 법령체로 드러냈습니다. 인간 대상이므로 생물학적 어감의 ‘남자/여자’가 문맥상 가장 직접적입니다.
- source_word: עֶשְׂרִים שְׁקָלִים / עֲשֶׂרֶת שְׁקָלִים
  english_pob_choice: twenty shekels / ten shekels
  chosen_korean: 이십 세겔 / 십 세겔
  alternatives_korean:
  - 스무 세겔 / 열 세겔
  - 이십 세겔 / 열 세겔
  lexicon: HALOT
  rationale: 고대 화폐·중량 단위를 그대로 보존해 원문과의 대응을 유지했습니다. 한자 수사 ‘이십/십’은 법규 문맥에서 안정적입니다.
theological_decisions:
- issue: 성별에 따른 서원 평가의 법적 분류를 어떻게 드러낼지
  chosen_reading: ‘남자’와 ‘여자’의 구분을 그대로 유지하여 평가 기준이 성별에 따라 달라지는 규정을 직설적으로 반영했습니다.
  alternative_readings:
  - ‘남성’과 ‘여성’으로 완곡하게 조정
  - ‘사람’으로 일반화
  rationale: 본문은 사회 일반론이 아니라 제의적·법적 평가표이므로, 원문의 구분을 완화하지 않고 보존하는 것이 해석상 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
