  source_fidelity: 연령 범위와 남성·여성에 따른 각각 이십 세겔 및 십 세겔의 평가액은 정확히 반영합니다. 다만 עֶרְכְּךָ는 이 문맥에서 서원에 관한 규정상 산정되는 ‘평가액’을 가리키므로, 일상적 ‘값’보다 ‘평가액’이 더 정확합니다. 한국어에서는 소유 대명사를 생략해도 원문의 규정적 의미가 유지됩니다.
  naturalness: 초안의 ‘만일 다섯 살부터 스무 살까지이면’은 조건절의 대상이 생략되어 다소 어색하며, 합쇼체 종결 ‘입니다’와 ‘너의’의 반말 계열 표현도 문체상 조화되지 않습니다. ‘…까지인 경우’와 ‘남자의 경우/여자의 경우’가 현대 한국어의 규정 문맥에 자연스럽습니다.
  terminology: ‘세겔’은 고대 중량·화폐 단위로 보존하는 것이 적절합니다. עֵרֶךְ는 레위기 27장의 정해진 서원 산정액을 뜻하므로 ‘평가액’으로 통일하는 편이 좋습니다. 성별 범주는 원문대로 보존하되 ‘남자의 경우/여자의 경우’로 제도적 분류임을 자연스럽게 드러냅니다.
