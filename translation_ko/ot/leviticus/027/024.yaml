  naturalness: ‘희년의 해’보다 ‘희년이 되는 해’가 현대 표준 한국어에서 더 자연스럽습니다. 또한 ‘소유권이 있는 자’는 권리 자체를 뜻하는 추상 명사여서, 사람을 가리키는 이 문맥에서는 ‘소유자’가 더 자연스럽습니다. 기존 각주는 ‘유전적 기업으로 있는 자’라는 표현이 비문에 가깝습니다.
