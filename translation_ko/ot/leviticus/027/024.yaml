base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
  footnotes:
  - marker: a
    text: Or, 'to the one whose hereditary possession the land is.' The Hebrew אֲחֻזַּת הָאָרֶץ refers to a landed holding, and in this context it is the original family allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 희년이 되는 해에는 그 밭이 그 밭을 팔았던 사람, 곧 그 땅의 소유자에게 돌아가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 땅을 소유지로 가진 사람에게’. 히브리어 אֲחֻזַּת הָאָרֶץ는 토지 보유지 또는 소유지를 가리키며, 이 문맥에서는 본래 가족에게 할당된 토지를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  english_pob_choice: In the year of jubilee
  chosen_korean: 희년의 해에는
  alternatives_korean:
  - 희년 해에는
  - 희년 때에는
  lexicon: HALOT
  rationale: בִּשְׁנַת의 시간적 용법을 자연스러운 한국어로 옮기되, 율법 문맥의 고유 제도인 הַיּוֹבֵל을 ‘희년’으로 반영했습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 밭이
  alternatives_korean:
  - 그 밭이
  - 토지가
  lexicon: HALOT
  rationale: שָׂדֶה의 기본 의미를 직접 살려 ‘밭’으로 옮겼습니다. 문맥상 토지 분배이지만, 본문이 실제로 말하는 명사는 ‘field’입니다.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  english_pob_choice: to the one from whom it was bought
  chosen_korean: 그것을 산 자에게
  alternatives_korean:
  - 그것을 그에게서 산 자에게
  - 그것을 판 사람에게
  lexicon: HALOT
  rationale: 히브리어의 대명사 관계를 한국어에서 자연스럽게 풀어, 소유권 회복의 대상이 되는 이전 매수인을 가리키게 했습니다. 영어 POB의 수정 의도대로 주어를 임의로 보태지 않았습니다.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  english_pob_choice: to the one to whom the possession of the land belongs
  chosen_korean: 곧 그 땅의 소유권이 있는 자에게
  alternatives_korean:
  - 곧 그 땅의 소유가 있는 자에게
  - 곧 그 땅의 대대로 물려받은 소유인 자에게
  lexicon: HALOT
  rationale: אֲחֻזָּה를 본문이 직접 말하는 법적 소유·점유 개념으로 살려 ‘소유권’으로 옮겼습니다. ‘대대로 물려받은’은 문맥상 가능하지만 본문의 어휘 자체에는 명시되지 않습니다.
theological_decisions:
- issue: אֲחֻזַּת הָאָרֶץ의 유전적/가족적 뉘앙스
  chosen_reading: 본문에는 ‘땅의 소유권’으로 두고, 가문별 기업 회복의 의미는 문맥에서 드러나도록 했습니다.
  alternative_readings:
  - 그 땅의 대대로 물려받은 소유
  - 그 땅의 조상 대대로 내려온 유산
  rationale: 레위기 전체 맥락은 가족 기업 회복이지만, 이 절 자체는 אֲחֻזָּה라는 법적 소유 표현을 사용합니다. 본문을 넘어서 유전적 의미를 본문에 직접 삽입하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: 본문이 명시하지 않은 신학적 함의를 본문 본문에 과도하게 이식하지 않습니다.'
