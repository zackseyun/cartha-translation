  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
  footnotes:
  - marker: a
    text: Or 'the one who dedicated it' or 'the one who sanctified it.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a fifth of the silver of your valuation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'it shall belong to him'; literally, 'it shall stand for him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 밭을 성별한 사람이 그 밭을 되찾으면[a], 평가액에 오분의 일을 더해야 합니다[b]. 그러면 그 밭은 그 사람의 것이 됩니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 밭을 봉헌한 사람’ 또는 ‘그 밭을 거룩하게 구별한 사람’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘당신의 평가액의 은의 오분의 일’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게 속하게 됩니다’; 직역하면, ‘그를 위해 확정됩니다’.
    reason: lexical_alternative
