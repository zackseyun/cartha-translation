  text: 그는 좋은 것과 나쁜 것을 가려 살피지 말아야 하며, 그것을 바꾸어서도 안 됩니다. 만일 그것을 바꾸면, 그것과 그 대신 바꾼 것 모두가 거룩하게 됩니다. 그것들은 되찾아 올 수 없습니다.
