  to: 그는 좋은 것과 나쁜 것을 가려 살피지 말아야 하며, 그것을 바꾸어서도 안 됩니다. 만일 그것을 바꾸면, 그것과 그 대신 바꾼 것 모두가 거룩하게 됩니다. 그것들은 되찾아 올 수 없습니다.
  rationale: 마지막 동사를 ‘되찾아 오다’로 바로잡아 헌물의 환매 금지를 보존했습니다. ‘가려 살피다’는 בֵּין טוֹב לָרַע의 선별·평가 의미를, ‘그 대신 바꾼 것’은 תְמוּרָתוֹ의 대체물 의미를 반영합니다. 두 짐승 모두에 적용되는 금지를 한국어에서 명료하게 하기 위해 마지막 문장을 복수로 처리했습니다.
