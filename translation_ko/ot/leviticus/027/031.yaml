lexical_decisions:
- source_word: וְ/אִם
  english_pob_choice: But if
  chosen_korean: 그러나 …하려거든
  alternatives_korean:
  - 그리고 만약
  - 만일
  lexicon: HALOT
  rationale: 법률 문맥에서 조건을 새로 열면서 앞 절과 대비를 이루므로, 단순 조건의 ‘만일’보다 역접을 살린 ‘그러나’가 흐름을 더 잘 드러냅니다.
- source_word: גָּאֹל יִגְאַל
  english_pob_choice: indeed redeems
  chosen_korean: 속량하려거든
  alternatives_korean:
  - 속량하면
  - 속량하고자 하면
  - 진정으로 속량하면
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형은 강조를 나타내므로, 한국어에서는 자연스럽게 ‘-하려거든’으로 법률적·강조적 뉘앙스를 살렸습니다.
- source_word: מִמַּעַשְׂרוֹ
  english_pob_choice: any of his tithe
  chosen_korean: 자기 십일조의 일부
  alternatives_korean:
  - 자기 십일조에서
  - 자기 십일조 중 일부
  lexicon: HALOT
  rationale: 전치사 מִן의 부분적 의미를 살리면서, 한국어 법문체에서 자연스러운 ‘일부’로 풀어 명확하게 했습니다.
- source_word: חֲמִשִׁיתוֹ / יֹסֵף עָלָיו
  english_pob_choice: he shall add a fifth to it
  chosen_korean: 그 값의 다섯째 몫을 더해야 합니다
  alternatives_korean:
  - 그것에 한 오분의 일을 더해야 합니다
  - 그 값에 오분의 일을 보태야 합니다
  lexicon: HALOT
  rationale: ‘다섯째 몫’은 히브리어 명사형의 분량 개념을 살리며, ‘더해야 합니다’는 규례의 의무를 현대 한국어로 분명하게 전달합니다.
