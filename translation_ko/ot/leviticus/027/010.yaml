id: LEV.27.10
reference: Leviticus 27:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
  footnotes:
  - marker: a
    text: Or 'substitute it'; the Hebrew uses two related but distinct verbs for replacing/exchanging.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew intensifies the verb: ''if he indeed exchanges'' or ''if he surely exchanges.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 바꾸거나 교환해서는 안 되며[a], 좋은 것을 나쁜 것으로, 나쁜 것을 좋은 것으로 바꾸어서도 안 됩니다. 그러나 만일 그가 짐승 한 마리를 다른 짐승으로 정녕 교환하면[b], 그 짐승과 그 대체물 모두 거룩하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바꾸다’와 ‘교환하다’는 히브리어의 두 관련 동사를 구별해 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 부정사 절대형을 써서 ‘정녕’이라는 강조를 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  english_pob_choice: replace it
  chosen_korean: 바꾸다
  alternatives_korean:
  - 대체하다
  - 교환하다
  lexicon: HALOT
  rationale: 첫 번째 동사는 어떤 것을 다른 것으로 ‘바꾸는’ 일반적 의미를 자연스럽게 드러내며, 뒤의 두 번째 동사와 구별되도록 했습니다.
- source_word: יָמִיר אֹתוֹ
  english_pob_choice: exchange it
  chosen_korean: 교환하다
  alternatives_korean:
  - 대체하다
  - 바꾸다
  lexicon: HALOT
  rationale: 두 번째 동사는 제의·서약 문맥에서의 맞바꿈을 가리키므로 ‘교환하다’로 옮겨 두 동사의 차이를 살렸습니다.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  english_pob_choice: good for bad or bad for good
  chosen_korean: 좋은 것을 나쁜 것으로, 나쁜 것을 좋은 것으로
  alternatives_korean:
  - 좋은 짐승을 나쁜 짐승으로, 나쁜 짐승을 좋은 짐승으로
  lexicon: HALOT
  rationale: בְּ는 맞바꾸는 상대를 나타내므로, 짧고 대구적인 법률 문체를 살려 ‘~을 ~으로’ 구조로 옮겼습니다.
- source_word: הָמֵר יָמִיר
  english_pob_choice: if he does indeed exchange
  chosen_korean: 참으로 교환하면
  alternatives_korean:
  - 정말 교환하면
  - 반드시 교환하면
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+동사형 중첩이 주는 강조를 ‘참으로’로 간결하게 반영했습니다.
- source_word: וּתְמוּרָתוֹ
  english_pob_choice: its substitute
  chosen_korean: 그 대체물
  alternatives_korean:
  - 그 교환된 것
  - 그 대체된 짐승
  lexicon: HALOT
  rationale: תְּמוּרָה는 교환된 결과로 생긴 대체 대상을 가리키므로, 법적 맥락에 맞게 ‘대체물’로 옮겼습니다.
theological_decisions:
- issue: 교환 시 원래 짐승과 대체물의 성결 상태
  chosen_reading: 원래 짐승과 대체물 둘 다 거룩하게 됩니다.
  alternative_readings:
  - 대체물만 거룩하게 됩니다
  - 단지 교환의 무효를 말할 뿐 거룩함의 귀속은 분명하지 않습니다
  rationale: 문장 끝의 ‘그것과 그 대체물은 거룩하게 될 것입니다’는 두 대상 모두의 거룩한 상태를 직접 진술하므로 그대로 반영했습니다.
  doctrine_reference: 레 27:10의 서원 짐승 규정
