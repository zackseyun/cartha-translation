    text: 또는 ‘이스라엘 자손에게’ 또는 ‘이스라엘 사람들에게’.
    reason: 히브리어 전치사 אֶל은 문맥에 따라 ‘~을 위하여’ 또는 ‘~에게’로 옮길 수 있으며, בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 사람들’로도 표현할 수 있습니다.
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은 …입니다
  alternatives_korean:
  - 이것들은
  - 이것들이다
  lexicon: HALOT
  rationale: 마무리 요약 공식을 자연스러운 현대 한국어로 옮기기 위해 서술격을 보완했습니다.
- source_word: הַמִּצְוֺת
  english_pob_choice: the commandments
  chosen_korean: 계명들
  alternatives_korean:
