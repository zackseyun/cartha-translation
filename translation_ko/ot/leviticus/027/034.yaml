  lexicon: HALOT
  rationale: 목적/대상 관계를 한국어 여격으로 자연스럽게 반영했고, בני ישראל의 대표적 남성 복수 표현을 ‘이스라엘 자손’으로 유지했습니다.
- source_word: בְּהַר סִינָי
  english_pob_choice: at Mount Sinai
  chosen_korean: 시내 산에서
  alternatives_korean:
  - 시내 산에서
  - 시내 산 위에서
  lexicon: HALOT
  rationale: 장소 부사구를 한국어 관용에 맞게 ‘-에서’로 옮겨 산과 결합한 정형 표현을 살렸습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성별-정확 번역
  chosen_reading: ‘이스라엘 자손’으로 유지했습니다.
  alternative_readings:
