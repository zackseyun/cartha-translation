  - 계명
  lexicon: HALOT
  rationale: מִצְוָה의 법적·규범적 의미를 살리면서 문맥상 책의 결론부 요약에 어울리는 한국어로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 옮겨, 본문이 가진 언약적 고유명을 보존했습니다.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
