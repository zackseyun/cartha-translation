id: LEV.27.32
reference: Leviticus 27:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
  footnotes:
  - marker: a
    text: Literally, 'the tenth.' The Hebrew implies each tenth animal as the animals pass under the rod for counting.
    reason: lexical_alternative
  - marker: b
    text: Or 'staff' for 'rod.' The phrase refers to counting livestock one by one as they pass beneath the shepherd's rod.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 가축과 양 떼의 모든 십분의 일, 곧 막대기 아래를 지나는 모든 열째 짐승은 야훼께 거룩한 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 열째’입니다. 문맥상 가축이 막대기 아래를 지나며 하나씩 شمار되는 각 열째 짐승을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘막대기’ 또는 ‘지팡이’로 옮길 수 있습니다. 이 표현은 목자가 가축을 한 마리씩 세어 확인하는 장면을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַעְשַׂר
  english_pob_choice: tithe
  chosen_korean: 십분의 일
  alternatives_korean:
  - 십일조
  - 열째 몫
  lexicon: HALOT
  rationale: 문맥이 제의적 헌납 규정이지만, 히브리어의 기본 뜻은 ‘열의 한 부분’이므로 본문 의미를 직접 드러내는 ‘십분의 일’로 옮겼습니다.
- source_word: בָּקָר וָצֹאן
  english_pob_choice: the herd and the flock
  chosen_korean: 가축과 양 떼
  alternatives_korean:
  - 소 떼와 양 떼
  - 가축과 떼
  lexicon: HALOT
  rationale: 두 집합명사의 병렬을 자연스러운 한국어로 살리되, בָּקָר와 צֹאן의 포괄성을 유지하기 위해 ‘가축과 양 떼’로 옮겼습니다.
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  english_pob_choice: that passes under the rod
  chosen_korean: 막대기 아래를 지나는
  alternatives_korean:
  - 지팡이 아래를 지나는
  - 막대 아래를 지나는
  lexicon: HALOT
  rationale: 가축을 하나씩 세는 목자적 관용구를 살리기 위해 직역에 가깝게 두었고, 한국어에서는 ‘막대기’가 가장 무난한 대응입니다.
- source_word: הָעֲשִׂירִי
  english_pob_choice: every tenth animal
  chosen_korean: 모든 열째 짐승
  alternatives_korean:
  - 열째 것
  - 열째 동물
  lexicon: HALOT
  rationale: 히브리어는 ‘그 열째’라는 형용사이지만, 실제로는 각각의 가축을 가리키므로 ‘짐승’을 보충해 의미를 분명히 했습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: shall be holy to Yahweh
  chosen_korean: 야훼께 거룩한 것이 될 것입니다
  alternatives_korean:
  - 야훼께 거룩할 것입니다
  - 야훼께 성별될 것입니다
  lexicon: HALOT
  rationale: קֹדֶשׁ의 상태를 ‘거룩한 것’으로 풀어 목적지/귀속을 드러냈고, YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 לַיהוָה를 ‘야훼께’로 옮겨 언약 이름을 직접 드러냈습니다.
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 이 절은 여호와 이름의 헌납 규정이므로, 신학적으로도 고유한 언약명을 유지하는 것이 본문 의도를 더 분명히 드러냅니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
