  to: 소 떼와 양과 염소 떼의 모든 십분의 일, 곧 막대기[b] 아래를 지나는 것 가운데 열째 것[a]은 야훼께 거룩한 것이 될 것입니다.
  rationale: 소 떼와 양·염소 떼라는 두 가축 범주를 구별하여 원문의 어휘 범위를 더 정확히 반영했습니다. 또한 ‘지나는 것 가운데 열째 것’으로 히브리어의 수식 관계와 분배적 의미를 보존했고, 각주의 표기 오류를 바로잡아 해당 설명 대상에 직접 연결했습니다.
