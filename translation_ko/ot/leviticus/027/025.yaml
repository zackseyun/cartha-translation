source:
  edition: WLC
  text: וְ/כָל עֶרְכְּ/ךָ֔ יִהְיֶ֖ה בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה יִהְיֶ֥ה הַ/שָּֽׁקֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
  footnotes:
  - marker: a
    text: Or, 'according to the holy shekel.' The Hebrew refers to the standard shekel used for sanctuary-related valuations.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 모든 값은 성소 세겔로 매겨야 합니다[a]. 세겔은 스무 게라여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 세겔에 따라’로 옮길 수 있습니다. 히브리어는 성소 관련 서원 가치를 재는 데 쓰인 표준 세겔을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  english_pob_choice: valuation of yours
  chosen_korean: 값은
  alternatives_korean:
  - 평가값은
  - 산정된 값은
  - 너희의 평가값은
  lexicon: HALOT
  rationale: 레위기 27장의 ערך는 서원과 관련된 ‘정해진 가치’라는 전문 용어이므로, 자연스럽고도 기술적인 ‘값’으로 옮겼습니다. 2인칭 남성 단수 소유격의 대상은 한국어에서 문맥상 복수 법규 일반에 대응되므로 ‘너희의’로 풀어 법규적 적용을 드러냈습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the sanctuary shekel
  chosen_korean: 성소 세겔로
  alternatives_korean:
  - 거룩한 세겔로
  - 성전 세겔로
  - 성소의 세겔로
  lexicon: HALOT
  rationale: 이 표현은 ‘거룩한’이라는 도덕적 형용사보다 성소 관련 표준 도량형을 가리키므로, POB의 의미를 따라 ‘성소 세겔’로 옮겼습니다. 조사 ‘로’는 준거 기준을 나타냅니다.
- source_word: גֵּרָה
  english_pob_choice: gerahs
  chosen_korean: 게라
  alternatives_korean:
  - 게라스
  - 게라 단위
  lexicon: HALOT
  rationale: 게라는 별도의 한국어 환산어가 없는 중량/화폐 단위이므로 음역을 유지했습니다. 복수 표시는 한국어에서 보통 수량 표현으로 충분하므로 굳이 영어식 복수형을 만들지 않았습니다.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  english_pob_choice: the shekel shall be twenty gerahs
  chosen_korean: 세겔은 스무 게라여야 합니다
  alternatives_korean:
  - 세겔은 스무 게라가 됩니다
  - 스무 게라가 세겔이 됩니다
  - 세겔은 스무 게라가 되어야 합니다
  lexicon: HALOT
  rationale: 정의문 성격의 법규문이므로 규정적 의무를 나타내는 ‘-여야 합니다’를 택했습니다. 히브리어 어순을 지나치게 기계적으로 따르기보다, 한국어 법령 문체에 맞게 기준 규정으로 읽히도록 했습니다.
theological_decisions:
- issue: 성소 세겔의 의미를 도덕적 ‘거룩함’으로 오해할 가능성
  chosen_reading: ‘성소 세겔’은 도덕적 수식이 아니라 성소 관련 공적 표준 도량형을 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - ‘거룩한 세겔’
  - ‘성전 세겔’
  rationale: 문맥은 서원 가치를 산정하는 법규이므로, 윤리적 의미보다 제의적·공적 기준이라는 기능을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 레 27:25의 제의법 규정
- issue: 2인칭 단수 소유격의 한국어 처리
  chosen_reading: ‘너희의’로 풀어 공동체 법규로서의 적용을 드러냈습니다.
  alternative_readings:
  - ‘네’
  - 생략
  rationale: 히브리어는 단수 소유격을 쓰지만, 한국어 합쇼체 법규문에서는 공동체 전체에 주어지는 규정임을 드러내기 위해 복수 지시가 더 자연스럽습니다.
  doctrine_reference: 토라의 공동체적 규범성
