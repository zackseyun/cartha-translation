base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
  footnotes:
  - marker: a
    text: Or 'according to the sanctuary shekel.' The Hebrew phrase specifies the sacred standard by which the shekel is measured.
    reason: lexical_alternative
translation:
  language: ko
  text: 스무 살부터 예순 살까지의 남자의 경우, 네가 정할 평가액은 성소 세겔을 기준으로[a] 은 오십 세겔입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 세겔에 따라’. 히브리어 표현은 성소와 관련된 세겔의 측정 기준을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 너의 평가
  alternatives_korean:
