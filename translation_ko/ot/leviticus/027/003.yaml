  lexicon: HALOT
  rationale: 레위기 27장의 עֵרֶךְ는 일반적 ‘가치’가 아니라 서원과 관련된 법적 ‘평가/책정’이므로, 문맥의 제의적·법적 성격을 살려 ‘평가’로 옮겼습니다.
