base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
  footnotes:
  - marker: a
    text: Or 'according to the sanctuary shekel.' The Hebrew phrase specifies the sacred standard by which the shekel is measured.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너의 평가는 남자에게서, 곧 스무 살부터 예순 살까지는 은 오십 세겔이 되며, 그것은 성소의 세겔에 따릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 세겔에 따라’. 히브리어 표현은 세겔을 재는 거룩한 기준을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 너의 평가
  alternatives_korean:
  - 너의 가치
  - 너의 정가
  - 너의 책정값
  lexicon: HALOT
  rationale: 레위기 27장의 עֵרֶךְ는 일반적 ‘가치’가 아니라 서원과 관련된 법적 ‘평가/책정’이므로, 문맥의 제의적·법적 성격을 살려 ‘평가’로 옮겼습니다.
- source_word: הַזָּכָר
  english_pob_choice: the male
  chosen_korean: 남자에게서
  alternatives_korean:
  - 남성에게서
  - 남자
  - 남성
  lexicon: HALOT
  rationale: 여기서는 연령대별로 구분되는 남성 범주를 가리키므로, 대상의 성별을 분명히 하되 한국어로 자연스럽게 ‘남자에게서’로 옮겼습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  english_pob_choice: from twenty years old up to sixty years old
  chosen_korean: 스무 살부터 예순 살까지
  alternatives_korean:
  - 스무 살에서 예순 살까지
  - 만 이십 세부터 육십 세까지
  - 스무 해부터 예순 해까지
  lexicon: HALOT
  rationale: 히브리어의 나이 범위를 한국어 연령 표현으로 자연스럽게 옮기되, 범위의 시작과 끝을 분명히 드러냈습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소의 세겔에 따릅니다
  alternatives_korean:
  - 성소의 세겔로
  - 성소 세겔 기준으로
  - 거룩한 세겔에 따라
  lexicon: HALOT
  rationale: הַקֹּדֶשׁ는 추상적 ‘거룩함’보다 성소와 연결된 기준을 가리키므로, 제의적 표준이라는 의미를 살려 ‘성소의 세겔’로 옮겼습니다.
theological_decisions:
- issue: 평가액의 성격
  chosen_reading: 서원된 사람에 대해 성소 기준으로 책정된 법적 평가액으로 이해했습니다.
  alternative_readings:
  - 일반적인 인물의 시장가치
  - 개인의 내적 가치
  rationale: 본문은 사람의 존엄을 논하는 것이 아니라 서원 규정 안에서 부과되는 제의적 평가액을 다루므로, 법적·제의적 의미를 유지했습니다.
  doctrine_reference: 레위기 27장 문맥 / Translation philosophy §1, §5
