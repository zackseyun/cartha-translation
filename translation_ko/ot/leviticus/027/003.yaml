  - severity: medium
    issue: ‘그것은 성소의 세겔에 따릅니다’
    rationale: 원문의 전치사구는 오십 세겔이라는 액수의 측정 기준을 수식합니다. 대명사 주어의 독립 절로 만들면 지시 대상이 불명확하고 한국어도 부자연스럽습니다.
  - severity: low
    issue: 각주 설명의 ‘세겔을 재는 거룩한 기준’
    rationale: ‘거룩한’이라는 추상적 수식보다 성소와 관련된 표준 세겔이라는 뜻을 밝히는 편이 הַקֹּדֶשׁ의 문맥상 의미를 더 정확히 전달합니다.
