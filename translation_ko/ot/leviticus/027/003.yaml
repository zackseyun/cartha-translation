theological_decisions:
- issue: 평가액의 성격
  chosen_reading: 서원된 사람에 대해 성소 기준으로 책정된 법적 평가액으로 이해했습니다.
  alternative_readings:
  - 일반적인 인물의 시장가치
  - 개인의 내적 가치
  rationale: 본문은 사람의 존엄을 논하는 것이 아니라 서원 규정 안에서 부과되는 제의적 평가액을 다루므로, 법적·제의적 의미를 유지했습니다.
  doctrine_reference: 레위기 27장 문맥 / Translation philosophy §1, §5
