revisions:
- from: 그리고 너의 평가는 남자에게서, 곧 스무 살부터 예순 살까지는 은 오십 세겔이 되며, 그것은 성소의 세겔에 따릅니다.[a]
  to: 스무 살부터 예순 살까지의 남자의 경우, 네가 정할 평가액은 성소 세겔을 기준으로[a] 은 오십 세겔입니다.
  rationale: 원문의 법적·제의적 평가 범주, 남성 및 연령의 분류, 은 오십 세겔이라는 액수, 그리고 성소 세겔이라는 측정 표준을 모두 보존했습니다. 각주 표지는 ‘성소 세겔’이라는 대안 번역이 적용되는 정확한 구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:52Z'
review_pass:
  verdict: revise
  source_fidelity: ‘남자에게서’는 히브리어의 분류적 표현(‘그 남자의 경우’)을 자연스럽게 전달하지 못하며, ‘그것은 성소의 세겔에 따릅니다’도 기준을 가리키는 전치사구를 독립 절로 처리하여 다소 부정확하고 어색합니다. 평가액과 성소 세겔 기준의 관계를 한 문장 안에 명시하는 것이 원문에 더 충실합니다.
  naturalness: ‘스무 살부터 예순 살까지의 남자의 경우’와 ‘성소 세겔을 기준으로’는 현대 표준 한국어의 법규적·제의적 문맥에서 자연스럽습니다. ‘네가 정할 평가액’은 2인칭 소유 접미사가 지닌 규정상의 책정 의미를 분명히 합니다.
  terminology: עֵרֶךְ는 개인의 본질적 가치가 아니라 서원 규정에 따른 책정액이므로 ‘평가액’으로 옮깁니다. הַזָּכָר는 성별 범주를 보존하여 ‘남자’로, בְּשֶׁקֶל הַקֹּדֶשׁ는 측정 표준을 나타내므로 ‘성소 세겔을 기준으로’로 옮깁니다.
  issues:
