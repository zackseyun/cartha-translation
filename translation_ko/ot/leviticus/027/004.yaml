lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …이면
  alternatives_korean:
  - 그리고 만일 …이면
  - 만일 …이면
  lexicon: HALOT
  rationale: 앞 절과 대조되는 경우를 여는 조건이므로, 단순 조건문보다 역접의 뉘앙스를 살린 ‘그러나 …이면’이 문맥에 가장 가깝습니다.
- source_word: נְקֵבָה
  english_pob_choice: a female
  chosen_korean: 여자
  alternatives_korean:
  - 여성
  - 암컷
  lexicon: HALOT
  rationale: 이 절의 법적 평가 대상은 성별을 가리키는 일반 용례이므로, 동물성 뉘앙스가 강한 ‘암컷’은 피하고 사람을 염두에 둔 ‘여자’로 옮겼습니다.
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 당신의 값
  alternatives_korean:
  - 당신의 평가액
  - 당신의 가치
  lexicon: HALOT
  rationale: 레위기 27장의 전문 용례상 ‘평가해 정한 금액’이지만, 한국어에서는 법적 의미를 유지하면서도 자연스럽게 들리는 ‘값’이 가장 직접적입니다.
- source_word: שְׁלֹשִׁים שָׁקֶל
  english_pob_choice: thirty shekels
  chosen_korean: 서른 세겔
  alternatives_korean:
  - 삼십 세겔
  - 30세겔
  lexicon: HALOT
  rationale: 히브리어 수사와 화폐 단위를 그대로 살려, 성경 본문의 단정한 법문체를 유지했습니다.
theological_decisions:
- issue: 여성의 평가액을 표현하는 방식
  chosen_reading: 성별에 따른 법적 평가 차이를 직설적으로 드러내되, 도덕적 판단이나 현대적 가치판단을 덧씌우지 않았습니다.
  alternative_readings:
  - 완곡하게 풀어 쓰는 방식
  - 현대적 평등어휘로 재구성하는 방식
  rationale: 본문은 규범적 법조문으로서 성별에 따른 정해진 값의 차이를 말하므로, 그 긴장을 희석하지 않고 그대로 전달하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 레위기 27장의 서원 평가 규정
