  to: 그러나 그가 그 밭을 속량하지 않거나, 그 밭을 다른 사람에게 팔았다면, 그 밭은 다시는 속량될 수 없습니다.[a]
  rationale: 결론절에 ‘그 밭은’을 보충하고 수동 표현을 유지하여, 밭 자체가 이후 더 이상 속량될 수 없다는 히브리어 법규정의 의미를 분명히 했습니다. 조건절의 ‘않거나’는 영어 POB 감사 기록의 ‘or’를 따르되, 원문의 두 조건절 구조를 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
