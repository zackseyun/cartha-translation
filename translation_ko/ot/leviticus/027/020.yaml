  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
  footnotes:
  - marker: a
    text: 'Or ''to another person.'' Hebrew: ''to another man.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 그 밭을 속량하지 않거나, 그 밭을 다른 사람에게 팔았다면, 그 밭은 다시는 속량될 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘다른 남자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …하지 않거나
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞선 조건절을 이어 받으면서도 이전 가능성에 대한 제한을 드러내므로, 단순한 ‘만일’보다 ‘그러나’가 문맥의 대조를 더 잘 살립니다.
- source_word: יִגְאַל / יִגָּאֵל
  english_pob_choice: redeem / be redeemed
  chosen_korean: 속량하다 / 속량할 수 없다
  alternatives_korean:
  - 되찾다
  - 구속하다
  - 사서 되찾다
  lexicon: HALOT
  rationale: 레위기 27장의 법적·성소적 맥락에서 גאל의 전문 용법을 살리기 위해 ‘속량하다’를 택했습니다. ‘되찾다’는 법적 의미가 약하고, ‘구속하다’는 한국 교회어에서 다른 신학적 연상을 쉽게 불러옵니다.
- source_word: לְאִישׁ אַחֵר
  english_pob_choice: to another man
  chosen_korean: 다른 사람에게
  alternatives_korean:
  - 다른 남자에게
  - 다른 이에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘다른 남자’이지만, 이 절의 법 조항에서는 성별 표지보다 대상을 일반적으로 지칭하는 기능이 강하므로 한국어에서는 법적 자연스러움을 위해 ‘다른 사람에게’로 옮겼습니다.
theological_decisions:
- issue: גאל의 법적-성소적 뉘앙스 유지
  chosen_reading: 속량하다
  alternative_readings:
  - 되찾다
  - 구매하다
  rationale: 이 동사는 단순 매매가 아니라 헌납된 밭을 되돌려 받는 법적 절차를 가리키므로, 한국어에서도 교회 전통어이면서 법적 의미를 유지하는 ‘속량하다’가 가장 적합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
