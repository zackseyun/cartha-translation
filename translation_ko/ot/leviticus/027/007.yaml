base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
  footnotes:
  - marker: a
    text: Or, 'aged sixty years or more.'
    reason: lexical_alternative
  - marker: b
    text: Or 'And if it is from sixty years old and upward'.
    reason: previous_rendering
translation:
  language: ko
  text: 육십 세 이상[a]인 사람이 남자이면, 그 평가액은 십오 세겔이고, 여자이면 십 세겔입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘육십 세나 그 이상’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  english_pob_choice: from sixty years old and upward
  chosen_korean: 육십 세 이상
  alternatives_korean:
  - 육십 세부터
  - 육십 세나 그 이상
  lexicon: HALOT
  rationale: 히브리어 관용구는 하한선이 60세임을 표시하므로, 한국어에서는 자연스럽고 간결한 '육십 세 이상'으로 옮겨 의미와 형식을 함께 살렸습니다.
- source_word: זָכָר
  english_pob_choice: male
  chosen_korean: 남자
  alternatives_korean:
  - 수컷
  - 남성
  lexicon: HALOT
  rationale: 이 문맥은 제의적 평가 규정이지만 성별 구분이 사람에게 적용되므로, 한국어에서는 생물학적 성별을 드러내는 '남자'가 가장 자연스럽습니다.
- source_word: עֶרְכְּךָ
  english_pob_choice: your valuation
  chosen_korean: 그 값
  alternatives_korean:
  - 당신의 평가
  - 평가액
  lexicon: HALOT
  rationale: 레위기 27장의 기술 용어를 한국어에서 과도하게 추상화하지 않으면서도 문맥상 금액을 가리키므로 '그 값'으로 옮겼습니다.
- source_word: שָׁקֶל / שְׁקָלִים
  english_pob_choice: shekels
  chosen_korean: 세겔
  alternatives_korean:
  - 셰켈
  - 쉐켈
  lexicon: HALOT
  rationale: 고대 무게 단위를 현대 한국어 음역 관행에 따라 '세겔'로 적었습니다.
theological_decisions:
- issue: 성별 구분을 제의적 평가 규정대로 유지할지 여부
  chosen_reading: 남자/여자라는 이분법적 구분을 그대로 유지했습니다.
  alternative_readings:
  - 사람/여성
  - 남성/여성
  rationale: 본문은 사람의 가치를 제의적으로 산정하면서 성별에 따른 액수를 구분하므로, 완화 없이 그대로 드러내는 것이 원문 의도를 가장 정확히 전달합니다.
  doctrine_reference: 레위기 27장의 서원 평가 규정
