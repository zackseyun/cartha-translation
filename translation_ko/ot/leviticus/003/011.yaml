  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'bread of a fire offering to the LORD'; here 'bread' functions idiomatically for food in the sacrificial system.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것을 제단 위에서 야훼께 드리는 불제물의 음식으로 불사르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘불제물의 빵’입니다. 여기서 ‘빵’은 제의 체계에서 ‘음식’을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  english_pob_choice: shall burn it
  chosen_korean: 불사르십시오
  alternatives_korean:
  - 연기로 올리십시오
  - 향을 피우십시오
  lexicon: HALOT
  rationale: 제의 문맥의 히필 קטר는 제물을 제단에서 태워 연기로 올리는 행위를 가리키므로, 현대 한국어로는 ‘불사르다’가 가장 직접적이고 자연스럽습니다.
- source_word: הַמִּזְבֵּחָה
  english_pob_choice: on the altar
  chosen_korean: 제단 위에서
  alternatives_korean:
  - 제단에서
  - 제단에
  lexicon: HALOT
  rationale: 방향을 나타내는 어미가 붙은 표현이므로, 실제 불사름이 이루어지는 위치를 드러내는 ‘제단 위에서’가 적절합니다.
- source_word: לֶחֶם אִשֶּׁה
  english_pob_choice: as food, an offering made by fire
  chosen_korean: 야훼께 드리는 불로 드리는 음식으로
  alternatives_korean:
  - 불로 드리는 음식으로
  - 화제의 음식으로
  - 음식, 곧 불로 드리는 제물로
  lexicon: HALOT
  rationale: לֶחֶם은 여기서 문자적 ‘빵’이 아니라 제의적 ‘음식’이라는 관용적 뜻이므로, 본문 의미를 살려 ‘음식’으로 옮기되, אִשֶּׁה의 제의적 불제물을 ‘불로 드리는’으로 반영했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 야훼를 위하여
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮기며, 봉헌 방향을 나타내는 ל는 ‘께’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 제의적 관용구 לֶחֶם אִשֶּׁה의 처리
  chosen_reading: ‘불로 드리는 음식’이라는 관용적 표현으로, 제단 몫이 되는 제의적 ‘음식’임을 드러냈습니다.
  alternative_readings:
  - ‘빵, 곧 불로 드리는 제물’
  - ‘불제물의 음식’
  rationale: 본문은 하나님이 실제로 먹는 빵을 뜻하지 않고, 제사 체계 안에서 제단에 바쳐지는 몫을 비유적으로 말합니다. 따라서 문자주의보다 의미를 살린 표현이 오해를 줄입니다.
  doctrine_reference: 'DOCTRINE.md: Sacrificial idiom and cultic terminology'
