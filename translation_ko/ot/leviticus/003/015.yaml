source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
  footnotes:
  - marker: a
    text: Or 'the lobe on the liver.' The Hebrew term for this anatomical part (יֹתֶרֶת) is uncertain, so 'appendage' is used in the main text to avoid overstating precision.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on the kidneys.' Here it likely means that this part is removed together with the kidneys.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 신장[a]과 그 위에 있는 기름, 곧 허리 부분에 있는 것, 그리고 간 위에 있는 부속물은 신장과 함께[b] 제거해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간에 붙은 엽(엽상부)’로 옮길 수 있습니다. 이 해부학 용어(יֹתֶרֶת)는 뜻이 확실하지 않으므로, 본문에서는 과도한 단정을 피하려고 ‘부속물’을 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘신장들 위에’입니다. 여기서는 이 부분이 신장과 함께 제거된다는 절차를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  english_pob_choice: the two kidneys
  chosen_korean: 두 신장
  alternatives_korean:
  - 두 콩팥
  lexicon: HALOT
  rationale: כְּלָיָה는 제사 규정의 해부학적 용어로 신장을 가리키므로, 현대 한국어에서 해부학적으로 자연한 ‘신장’을 택했습니다.
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  lexicon: HALOT
  rationale: 제사 문맥의 חֵלֶב은 단순한 지방질이 아니라 제거하여 바치는 선택된 기름 부분을 뜻하므로, 한국어 성경에서 흔한 ‘기름’을 사용했습니다.
- source_word: הַכְּסָלִים
  english_pob_choice: the loins
  chosen_korean: 허리 부분
  alternatives_korean:
  - 넓적다리 부분
  - 옆구리
  lexicon: HALOT
  rationale: 동물 해부 구조를 한국어로 그대로 옮기되 지나치게 전문화하지 않기 위해 ‘허리 부분’으로 풀어 옮겼습니다.
- source_word: הַיֹּתֶרֶת
  english_pob_choice: the appendage
  chosen_korean: 부속물
  alternatives_korean:
  - 엽
  - 돌출부
  lexicon: HALOT
  rationale: 이 해부학 용어는 정확한 현대 해부학 명칭이 불확실하므로, POB의 ‘appendage’를 따라 의미를 과장하지 않는 중립적 표현인 ‘부속물’을 택했습니다.
theological_decisions:
- issue: 불확정 해부학 용어의 처리
  chosen_reading: יֹתֶרֶת을 특정 장기명으로 단정하지 않고 ‘부속물’로 번역했습니다.
  alternative_readings:
  - 간엽
  - 간의 돌출부
  rationale: 본문 자체가 정밀한 해부학적 동일시를 제공하지 않으므로, 문맥상 제사 절차를 유지하면서 과잉 확정을 피하는 번역이 가장 충실합니다.
  doctrine_reference: 레위기 제사 규례의 기술적 정확성 유지
