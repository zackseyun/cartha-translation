  rationale: 제사 문맥의 חֵלֶב은 단순한 지방질이 아니라 제거하여 바치는 선택된 기름 부분을 뜻하므로, 한국어 성경에서 흔한 ‘기름’을 사용했습니다.
- source_word: הַכְּסָלִים
  english_pob_choice: the loins
  chosen_korean: 허리 부분
  alternatives_korean:
  - 넓적다리 부분
  - 옆구리
  lexicon: HALOT
  rationale: 동물 해부 구조를 한국어로 그대로 옮기되 지나치게 전문화하지 않기 위해 ‘허리 부분’으로 풀어 옮겼습니다.
- source_word: הַיֹּתֶרֶת
  english_pob_choice: the appendage
  chosen_korean: 부속물
  alternatives_korean:
  - 엽
  - 돌출부
  lexicon: HALOT
  rationale: 이 해부학 용어는 정확한 현대 해부학 명칭이 불확실하므로, POB의 ‘appendage’를 따라 의미를 과장하지 않는 중립적 표현인 ‘부속물’을 택했습니다.
