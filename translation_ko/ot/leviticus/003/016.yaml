id: LEV.3.16
reference: Leviticus 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
  footnotes:
  - marker: a
    text: Or 'food offering'; literally 'bread/food of a fire offering.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for a soothing aroma' or 'for a sweet aroma.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''All the fat is for the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그것들을 제단 위에서 불살라야 합니다. 그것은 화제의 음식[a], 곧 야훼께 향기로운 냄새가 되는 것입니다.[b] 모든 기름은 야훼의 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제의 음식’은 직역하면 ‘불로 드리는 제물의 빵/음식’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 냄새’는 ‘기쁘게 받으실 냄새’ 또는 ‘달콤한 냄새’로도 옮길 수 있는 제사 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘모든 기름은 야훼께 속한다’라고 합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהִקְטִירָם
  english_pob_choice: And the priest shall burn them
  chosen_korean: 제사장은 그것들을 불살라야 합니다
  alternatives_korean:
  - 제사장은 그것들을 태워야 합니다
  - 제사장은 그것들을 연기로 올려야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 히필 קטר는 단순 소각보다 제단에서 제물을 연기로 올리는 행위를 가리키므로, 현대 한국어에서는 ‘불살라야 합니다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: לֶחֶם אִשֶּׁה
  english_pob_choice: as food, an offering made by fire
  chosen_korean: 화제의 음식이며
  alternatives_korean:
  - 불로 드리는 음식이며
  - 불 제물의 음식이며
  - 화제의 제물이며
  lexicon: HALOT
  rationale: לֶחֶם의 문자적 ‘빵’은 오해를 낳을 수 있어 넓은 의미의 ‘음식’으로 옮기고, אִשֶּׁה는 제사 관용구를 살려 ‘화제의’로 반영했습니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: for a pleasing aroma
  chosen_korean: 향기로운 냄새가 되는 제물입니다
  alternatives_korean:
  - 기쁘게 받으실 향기가 되는 제물입니다
  - 기쁜 향기가 되는 제물입니다
  lexicon: HALOT
  rationale: 이 고정 제사 공식은 하나님의 실제 후각 반응보다 받아들여짐을 나타내므로, ‘향기로운 냄새’로 옮기되 제사 전체의 기능을 문장에 드러냈습니다.
- source_word: כָּל חֵלֶב לַיהוָה
  english_pob_choice: All the fat belongs to Yahweh
  chosen_korean: 모든 기름은 야훼께 속합니다
  alternatives_korean:
  - 모든 기름은 야훼의 것입니다
  - 모든 기름은 야훼께 드려집니다
  lexicon: HALOT
  rationale: חֵלֶב은 제사 규정에서 ‘지방/기름기’로 이해되는 부분이므로, 한국어에서도 제의적 용어인 ‘기름’으로 옮겨 총체성의 강조를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문의 신명기는 고유한 언약명으로 표기되어 있으므로, 프로젝트 기본값에 따라 한국어 본문에서도 ‘야훼’로 직접 옮겨 원문 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 제사 공식 לְרֵיחַ נִיחֹחַ의 처리
  chosen_reading: 향기로운 냄새가 되는 제물입니다
  alternative_readings:
  - 향기로운 냄새를 위한 것입니다
  - 기쁘게 받으실 향기입니다
  rationale: 이 표현은 신학적 설명으로 풀기보다 제사 제의의 수용성을 나타내는 관용구로 남기는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
