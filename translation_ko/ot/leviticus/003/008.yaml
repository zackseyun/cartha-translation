id: LEV.3.8
reference: Leviticus 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
  footnotes:
  - marker: a
    text: Or 'shall splash' or 'shall dash'; the Hebrew verb denotes casting the blood in a forceful ritual action, not a gentle sprinkling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 제물의 머리에 손을 얹고, 만남의 장막[a] 앞에서 그것을 잡아 죽여야 하며, 아론의 아들들은 그 피를 제단 사방에 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘튀기다’, ‘내던지다’. 히브리어 동사는 부드럽게 흩뿌리는 것이 아니라, 제의적으로 힘 있게 피를 던지는 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  english_pob_choice: shall lay his hand
  chosen_korean: 손을 얹고
  alternatives_korean:
  - 손을 놓고
  - 손을 대고
  lexicon: HALOT
  rationale: 제사 문맥의 סמך는 단순한 접촉보다 제물의 머리 위에 손을 얹는 예식 행위를 가리키므로, 한국어에서는 자연스럽고 의례적인 「손을 얹고」가 가장 적절합니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 자신의 제물
  alternatives_korean:
  - 자신의 헌물
  - 자신의 희생제물
  lexicon: HALOT
  rationale: קָרְבָּן은 하나님께 가까이 가져오는 예물을 뜻하므로, 제의적 맥락을 살리면서도 현대 한국어에서 자연한 「제물」을 택했습니다.
- source_word: וְשָׁחַט
  english_pob_choice: slaughter
  chosen_korean: 잡아 죽여야 하며
  alternatives_korean:
  - 도살해야 하며
  - 죽여야 하며
  lexicon: HALOT
  rationale: 제사 동사의 기술적 의미를 살리되, 한국어에서 제물 동작을 너무 비기술적으로 흐리지 않도록 「잡아 죽이다」를 사용했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 만남의 장막
  alternatives_korean:
  - 회막
  - 모임의 장막
  lexicon: HALOT
  rationale: 직역에 가까운 「만남의 장막」은 히브리어 표현의 의미를 드러내며, 본문이 지시하는 성막의 특정 명칭을 보존합니다.
- source_word: וְזָרְקוּ ... עַל הַמִּזְבֵּחַ סָבִיב
  english_pob_choice: shall throw its blood against the altar all around
  chosen_korean: 그 피를 제단 주위에 뿌려야 합니다
  alternatives_korean:
  - 그 피를 제단에 던져야 합니다
  - 그 피를 제단 사방에 뿌려야 합니다
  lexicon: HALOT
  rationale: זרק은 제의적 혈액 행위로서 ‘던지다/뿌리다’의 강한 동작을 포함하므로, 한국어에서는 자연스럽게 「뿌려야 합니다」로 옮기되, סביב의 분포 의미는 「제단 주위에」로 반영했습니다.
theological_decisions:
- issue: 제사 행위의 의미를 과도하게 해석하지 않기
  chosen_reading: 본문의 행위 자체를 묘사하는 데 그치고, 죄 전가나 상징적 의미를 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 손을 얹는 행위를 죄 전가로 설명하는 번역
  - 제의적 상징을 풀어쓴 해설형 번역
  rationale: 이 절은 제사 절차를 제시하므로, 본문이 직접 말하지 않는 신학적 해석을 번역문에 주입하지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3
