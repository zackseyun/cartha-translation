  naturalness: ‘손을 얹고’, ‘만남의 장막’, ‘잡아 죽여야 하며’는 현대 한국어의 격식 있는 성경 번역 문체에서 자연스럽습니다. ‘제단 사방에’가 ‘제단 주위에’보다 제의 행위의 대상과 방향을 더 자연스럽고 분명하게 표현합니다.
