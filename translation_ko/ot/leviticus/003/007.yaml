  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
  footnotes:
  - marker: a
    text: Or 'a lamb' as his offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 자기의 예물로 양을 드리려거든, 그것을 야훼 앞에 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린양’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일 …거든
  alternatives_korean:
  - 만약 …하면
  - …이라면
  lexicon: HALOT
  rationale: 제사 지침의 조건문을 자연스럽게 살리되, 절차적 문맥에 맞는 문어체 조건 표현으로 옮겼습니다.
- source_word: כֶּשֶׂב
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 어린양
  - 양 한 마리
  lexicon: HALOT
  rationale: POB가 sheep을 기본값으로 택한 폭넓은 의미를 따라, 한국어에서는 가장 중립적인 ‘양’으로 옮겨 과도한 연령 특정화를 피했습니다.
- source_word: קָרְבָּנ֑/וֹ
  english_pob_choice: his offering
  chosen_korean: 자기의 예물
  alternatives_korean:
  - 그의 제물
  - 자기의 제사드림
  lexicon: HALOT
  rationale: קָרְבָּן의 ‘가까이 가져오는 예물/헌물’이라는 넓은 의미를 살려, 제사문맥에서 자연스러운 ‘예물’로 옮겼습니다.
- source_word: וְ/הִקְרִ֥יב ... לִ/פְנֵ֥י
  english_pob_choice: then he shall present ... before
  chosen_korean: 드려야 합니다 … 앞에 드려야 합니다
  alternatives_korean:
  - 가져와야 합니다 … 앞에
  - 바쳐야 합니다 … 앞에 바쳐야 합니다
  lexicon: HALOT
  rationale: הקריב의 제의적 ‘가져와 제시하다/드리다’의 기능을 한국어 제사 용례에 맞게 ‘드리다’로 옮기되, 반복 구조를 통해 앞에 제시하는 동작을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 학술적 표기 ‘야훼’를 사용해 하나님의 고유 이름을 보존했습니다.
theological_decisions:
- issue: 여호와/주님이 아닌 신명(神名) יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 야훼의 이름을 직접 사용하므로, 이를 호칭으로 치환하지 않고 고유명으로 드러내는 것이 원문과 POB의 신학적 의도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
