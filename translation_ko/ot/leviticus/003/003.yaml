id: LEV.3.3
reference: Leviticus 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
  footnotes:
  - marker: a
    text: Or 'an offering by fire' or 'a fire offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 화목제물 가운데서 내장을 덮고 있는 기름과 내장 위에 있는 모든 기름을 야훼께 화제물[a]로 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’이나 ‘불제물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: he shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  lexicon: HALOT
  rationale: 제사 규정 문맥의 הִקְרִיב은 단순 이동이 아니라 제물의 제의적 ‘드림’을 가리키므로, 한국어에서는 자연스럽고 공적 문체인 ‘드리다’가 가장 적절합니다.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  english_pob_choice: from the sacrifice of peace offerings
  chosen_korean: 화목제의 제물 가운데서
  alternatives_korean:
  - 화평제의 제물 가운데서
  - 평안제의 제물 가운데서
  lexicon: HALOT
  rationale: שְׁלָמִים은 전통적으로 ‘화목제’로 굳어진 제의 용어이므로, 독자가 제사 체계를 바로 인식할 수 있게 그 용어를 유지했습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불제물
  lexicon: HALOT
  rationale: POB의 영어 해설처럼 이 단어는 단순히 ‘불에 태우는 것’만이 아니라 야훼께 올려지는 제의적 제물을 가리키므로, 한국어 성경 전통에서 널리 쓰이는 ‘화제물’을 택했습니다.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  english_pob_choice: the fat that covers the entrails
  chosen_korean: 내장을 덮고 있는 기름
  alternatives_korean:
  - 창자를 덮고 있는 기름
  - 내부 장기를 덮고 있는 기름
  lexicon: HALOT
  rationale: 여기서 חֵלֶב은 제사 규정상 따로 구별되는 ‘기름/지방’을 뜻하므로 ‘기름’으로 옮기고, הַקֶּרֶב은 동물 해부 문맥에 맞게 ‘내장’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신성명 יהוה를 음역하여, 본문이 드러내는 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אִשֶּׁה의 제의적 의미
  chosen_reading: 화제물
  alternative_readings:
  - 불로 드리는 제물
  - 불에 드리는 제물
  rationale: 이 단어는 단순한 연소 행위보다 제의적으로 하나님께 올려지는 헌물을 뜻하므로, 합쇼체 본문에서는 의미를 살린 ‘화제물’이 가장 간결하고 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
