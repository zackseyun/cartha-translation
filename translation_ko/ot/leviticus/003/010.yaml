language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
  footnotes:
  - marker: a
    text: Or 'the lobe on the liver.' The Hebrew term for this anatomical part (יֹתֶרֶת) is uncertain; 'appendage' is used in the main text to avoid overstating precision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 개의 콩팥과 그 위의 기름, 곧 허리 부위에 있는 것과, 간 위의 돌기 — 콩팥과 함께 그것을 제거해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌기’는 히브리어 יֹתֶרֶת의 정확한 해부학적 동일물을 단정하지 않기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  english_pob_choice: the two kidneys
  chosen_korean: 두 개의 콩팥
  alternatives_korean:
  - 두 개의 신장
  - 두 콩팥
  lexicon: HALOT
  rationale: כְּלָיֹת은 제의 문맥에서 신체 장기인 콩팥/신장을 가리키므로, 현대 한국어에서 자연스러운 해부학 용어인 ‘콩팥’을 택했습니다.
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 그 위의 기름
  alternatives_korean:
  - 그 위의 지방
  - 그 위의 기름기
  lexicon: HALOT
  rationale: 레위기 제의 규정에서 חֵלֶב은 바치는 데 따로 떼어 놓는 제의적 ‘기름’으로 쓰이므로, 단순한 지방보다 제의적 뉘앙스를 살리는 ‘기름’이 적절합니다.
- source_word: הַיֹּתֶרֶת
  english_pob_choice: the appendage
  chosen_korean: 돌기
  alternatives_korean:
  - 엽
  - 부속엽
  - 부위
  lexicon: HALOT
  rationale: יֹתֶרֶת은 해부학적으로 불확실한 용어이므로, POB의 ‘appendage’처럼 과도한 특정화를 피하는 중립적 표현으로 ‘돌기’를 사용했습니다.
- source_word: יְסִירֶנָּה
  english_pob_choice: he shall remove
  chosen_korean: 제거해야 합니다
  alternatives_korean:
  - 떼어내야 합니다
  - 제거할 것입니다
  lexicon: HALOT
  rationale: 제의 절차를 지시하는 완료적/명령적 뉘앙스를 한국어 법규형으로 자연스럽게 옮겼습니다.
