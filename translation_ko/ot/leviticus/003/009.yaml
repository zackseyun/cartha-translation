source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
  footnotes:
  - marker: a
    text: Or 'sacrifice of fellowship offerings' or 'sacrifice of well-being offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the whole fat tail'; this refers to the fatty tail of a sheep offered in sacrifice.
    reason: cultural_note
  - marker: c
    text: Or 'opposite the backbone' or 'at the base of the spine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 화목제물[a] 중에서 야훼께 드릴 화제로 그 기름, 곧 척추 가까이에서 제거할 기름진 꼬리 전체[b][c]와 내장을 덮는 기름 및 내장 위에 있는 모든 기름을 바쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제제물’ 또는 ‘잘됨의 제물’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘온전한 기름진 꼬리’라고 합니다. 이는 제물로 드리는 양의 기름진 꼬리 부위를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘척추 맞은편에서’ 또는 ‘꼬리뼈 부근에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: sacrifice of peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화제
  - 교제제물
  - 화평제
  lexicon: HALOT
  rationale: 한국어 제사 용어로는 성경 전체의 제의 맥락을 가장 잘 살리는 ‘화목제’가 자연스럽고, 영어 POB의 ‘peace offerings’가 가리키는 제의 범주를 간결하게 반영합니다.
- source_word: אִשֶּׁה
  english_pob_choice: an offering made by fire
  chosen_korean: 화제 제물
  alternatives_korean:
  - 불로 드리는 제물
  - 불 제물
  - 화제
  lexicon: HALOT
  rationale: 제단에서 불로 드리는 제물이라는 제의적 의미를 살리기 위해, 한국어 성경에서 이해 가능한 ‘화제 제물’을 선택했습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 고유명사는 ‘야훼’로 옮겨, 본문의 직접성을 보존했습니다.
- source_word: חֶלְבּוֹ הָאַלְיָה תְמִימָה
  english_pob_choice: its fat, the whole fat tail
  chosen_korean: 그 기름[a], 곧 온전한 기름꼬리[b]
  alternatives_korean:
  - 그 기름, 곧 온전한 지방꼬리
  - 그 기름, 곧 통째의 기름꼬리
  lexicon: HALOT
  rationale: חֵלֶב은 제사 규정에서 ‘기름’으로, אַלְיָה는 양의 비대한 꼬리 부위를 가리키므로 ‘기름꼬리’로 구체화했습니다. תְמִימָה는 ‘온전한/흠 없는’ 뜻을 살려 ‘온전한’으로 옮겼습니다.
- source_word: לְעֻמַּת הֶעָצֶה
  english_pob_choice: close to the backbone
  chosen_korean: 척추 가까이에서
  alternatives_korean:
  - 척추 맞은편에서
  - 등뼈 가까이에서
  - 척추 아래에서
  lexicon: HALOT
  rationale: 영어 POB가 제시한 해부학적 의미를 따라, 실제 절단 위치를 자연스럽게 드러내는 ‘척추 가까이에서’로 옮겼습니다.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב / כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  english_pob_choice: the fat that covers the entrails / all the fat that is on the entrails
  chosen_korean: 내장을 덮는 기름과 내장 위에 있는 모든 기름
  alternatives_korean:
  - 속을 덮는 기름과 속에 있는 모든 기름
  - 내장 덮개 기름과 내장 위의 모든 기름
  lexicon: HALOT
  rationale: קֶרֶב은 제의 문맥에서 장기 내부를 뜻하므로 ‘내장’으로 번역했고, ‘덮는’과 ‘위에 있는’의 구분을 유지해 두 개의 기름 항목을 분명히 했습니다.
