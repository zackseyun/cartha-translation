  source_fidelity: 초안은 제사 규정의 열거와 제거 명령을 대체로 반영하지만, יֹתֶרֶת(간과 관련된 불확실한 해부학적 부위)를 단순히 ‘것’으로 옮겨 지시 대상이 불명확합니다. 또한 עַל הַכְּלָיֹת는 여기서 그 부위가 콩팥과 함께 제거됨을 나타내는데, ‘신장 위에 있는 것’으로 번역하여 공간 관계로 바꾸었습니다.
  naturalness: ‘그 위에 있는 기름 곧 허리에 있는 것’ 및 반복되는 ‘것’은 현대 한국어에서 지시 대상이 모호하고 부자연스럽습니다. ‘콩팥’, ‘허리 부위’, ‘부속물’을 사용하면 간결하면서도 의미 관계가 분명해집니다.
  terminology: כְּלָיֹת는 현대 표준어인 ‘콩팥’으로, חֵלֶב는 ‘기름’으로 옮겼습니다. יֹתֶרֶת는 정확한 해부학적 식별이 불확실하므로 본문에서는 중립적인 ‘부속물’로 두고 각주에서 불확실성과 대안을 밝혔습니다.
