source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
  footnotes:
  - marker: a
    text: Or 'an everlasting statute' or 'a perpetual statute.' The Hebrew עוֹלָם in legal contexts often denotes enduring, ongoing validity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희 대대로, 너희가 사는 모든 곳에서 지켜야 할 영구한 규례입니다. 너희는 어떤 기름이나 피도 먹어서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영구한 규례
  alternatives_korean:
  - 영원한 규례
  - 항구한 규례
  - 지속되는 규례
  lexicon: HALOT
  rationale: חֻקָּה는 정해진 법적 규정을 가리키므로 규례로 옮기고, עוֹלָם은 율법 문맥의 지속성을 살려 영구한으로 옮겼습니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: throughout your generations
  chosen_korean: 너희 대대로
  alternatives_korean:
  - 너희 모든 세대에 걸쳐
  - 너희 여러 세대 동안
  - 대대로
  lexicon: HALOT
  rationale: 세대가 이어지는 언약적 지속성을 한국어의 자연스러운 관용인 너희 대대로로 압축해 살렸습니다.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  english_pob_choice: in all your dwellings
  chosen_korean: 너희가 사는 모든 곳에서
  alternatives_korean:
  - 너희 모든 거주지에서
  - 너희 모든 주거지에서
  - 너희 모든 거처에서
  lexicon: HALOT
  rationale: מוֹשָׁב은 거주하는 장소를 뜻하므로, 현대 독자가 바로 이해할 수 있게 사는 모든 곳에서로 풀어 옮겼습니다.
- source_word: כָּל חֵלֶב וְכָל דָּם
  english_pob_choice: neither any fat nor any blood
  chosen_korean: 기름기와 피를 모두
  alternatives_korean:
  - 어떤 기름도 어떤 피도
  - 모든 기름과 모든 피를
  - 기름과 피를
  lexicon: HALOT
  rationale: 금지 대상의 포괄성을 살리되 한국어에서 음식 금지로 자연스럽게 들리도록 기름기와 피로 옮겼고, לֹא תֹאכֵלוּ의 부정은 먹어서는 안 됩니다로 처리했습니다.
theological_decisions:
- issue: 율법 조항의 지속성 표현
  chosen_reading: 영구한 규례
  alternative_readings:
  - 영원한 규례
  - 항구한 규례
  rationale: עוֹלָם은 여기서 형이상학적 무한성보다 언약적·법적 지속성을 강조하므로, 영구한이 현대 한국어에서 그 힘을 가장 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; covenant law formula'
