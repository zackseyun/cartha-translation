review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the enduring statutory force, the generational and geographical scope, and the prohibition. However, 기름기 ordinarily denotes greasiness or an oily quality rather than the substantive sacrificial/animal fat denoted by חֵלֶב. 기름 is the established and more source-faithful Korean biblical rendering here. The comprehensive force of each כָּל is also expressed more clearly with 어떤 …도.
  naturalness: The formal-polite register is appropriate. Replacing 이것은 with 이는 gives a more natural formal scriptural/legal opening, and 기름과 피는 어떤 것도 먹어서는 안 됩니다 is clearer and more idiomatic than 기름기와 피를 모두 먹어서는 안 됩니다.
  terminology: 규례 appropriately renders חֻקָּה, and 영구한 appropriately represents the enduring legal sense of עוֹלָם without forcing a metaphysical claim. 기름 should replace 기름기 for חֵלֶב; 피 is correct.
  issues:
  - severity: medium
    issue: 기름기 for חֵלֶב
    rationale: 기름기는 보통 ‘기름진 성질/느낌’을 뜻하여 음식물 또는 제의 동물의 ‘기름’을 가리키는 히브리어 명사의 의미를 흐릴 수 있습니다. 기름이 더 정확하고 한국어 성경 용례에도 부합합니다.
  - severity: low
    issue: 모두의 포괄 범위가 다소 불분명함
    rationale: 기름기와 피를 모두는 두 대상을 함께 전면 금지한다는 뜻으로 읽히지만, 각각의 כָּל(모든)을 명시적으로 드러내지는 않습니다. 어떤 기름이나 피도는 자연스럽게 전면성을 나타냅니다.
  revised_text: 이는 너희 대대로, 너희가 사는 모든 곳에서 지켜야 할 영구한 규례입니다. 너희는 어떤 기름이나 피도 먹어서는 안 됩니다.
