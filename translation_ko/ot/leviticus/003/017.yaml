  - 항구한 규례
  rationale: עוֹלָם은 여기서 형이상학적 무한성보다 언약적·법적 지속성을 강조하므로, 영구한이 현대 한국어에서 그 힘을 가장 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; covenant law formula'
