id: LEV.3.2
reference: Leviticus 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
  footnotes:
  - marker: a
    text: Or “at the doorway of the tent of meeting.”
    reason: lexical_alternative
  - marker: b
    text: Or “shall dash the blood against the altar all around.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 제물의 머리에 손을 얹고 회막 입구에서 그것을 잡아 죽여야 하며, 아론의 아들 제사장들은 그 피를 제단 사방으로 뿌려야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  english_pob_choice: shall lay his hand
  chosen_korean: 자기 손을 … 얹고
  alternatives_korean:
  - 손을 놓고
  - 손을 대고
  - 손을 누르고
  lexicon: HALOT
  rationale: 제의적 문맥의 סמך는 손을 제물 위에 두는 행위를 가리키므로, 한국어로는 자연스럽고 의례적 뉘앙스를 살리는 ‘얹다’가 가장 적절합니다.
- source_word: קָרְבָּנוֹ
  english_pob_choice: his offering
  chosen_korean: 자기 제물
  alternatives_korean:
  - 자기 예물
  - 자기 제사물
  - 자기 제사
  lexicon: HALOT
  rationale: קָרְבָּן은 하나님께 ‘가까이 가져오는’ 제의적 예물을 뜻하므로, 일반적이면서도 제의 맥락을 살리는 ‘제물’로 옮겼습니다.
- source_word: וּשְׁחָטוֹ
  english_pob_choice: and slaughter it
  chosen_korean: … 잡아 죽여야 하며
  alternatives_korean:
  - … 도살해야 하며
  - … 죽여야 하며
  - … 잡아 죽여야 하며
  lexicon: HALOT
  rationale: שׁחט는 단순 살해보다 제의적 도살에 가깝지만, 한국어에서는 동작의 물리성과 제의성을 함께 드러내는 ‘잡아 죽이다’가 가장 직접적입니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 입구에서
  alternatives_korean:
  - 회막의 문에서
  - 회막 문간에서
  - 회막 문 앞에서
  lexicon: HALOT
  rationale: פֶּתַח은 ‘입구’로 옮기면 본문의 공간 지시가 분명해지고, אֹהֶל מוֹעֵד는 관용적 표현인 ‘회막’으로 처리하는 것이 자연스럽습니다.
- source_word: וְזָרְקוּ ... סָבִיב
  english_pob_choice: shall throw the blood against the altar all around
  chosen_korean: 그 피를 제단 사방에 뿌려야 합니다
  alternatives_korean:
  - 그 피를 제단 둘레에 뿌려야 합니다
  - 그 피를 제단에 둘러 뿌려야 합니다
  - 그 피를 제단 주위에 뿌려야 합니다
  lexicon: HALOT
  rationale: זרק은 피를 제의적으로 던지거나 뿌리는 행위이고, סָבִיב은 주변 전체를 뜻하므로 ‘제단 사방에’가 간결하면서도 범위를 정확히 드러냅니다.
theological_decisions:
- issue: 제사장의 신분 표기
  chosen_reading: 아론의 아들 제사장들
  alternative_readings:
  - 아론의 아들들인 제사장들
  - 아론의 아들, 곧 제사장들
  rationale: 히브리어의 동격 구조를 유지해 아론의 혈통과 제사장 직분을 함께 드러내되, 한국어 문장에서는 자연스럽게 읽히도록 정리했습니다.
  doctrine_reference: 레 3:2 제의 규정의 서술 방식
