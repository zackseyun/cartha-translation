  to: 그는 자기 제물의 머리에 손을 얹고 회막 입구에서 그것을 잡아 죽여야 하며, 아론의 아들 제사장들은 그 피를 제단 사방으로 뿌려야 합니다.
  rationale: 원문의 단수 ‘그의 손’과 ‘그의 제물’의 관계는 한국어의 자연스러운 소유 생략으로 유지했습니다. 또한 זרק과 עַל־הַמִּזְבֵּחַ סָבִיב의 제의적 동작을 보존하면서, 피가 제단 주변 땅이 아니라 제단을 향하여 그 사방에 적용됨을 더 분명히 했습니다. 본문에 필요한 각주 앵커는 없으므로 추가하지 않습니다.
