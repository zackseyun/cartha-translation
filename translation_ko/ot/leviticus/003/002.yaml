  timestamp: '2026-07-13T13:00:27Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 행위와 장소, 담당자는 대체로 충실합니다. 다만 וְזָרְקוּ는 제단을 향해 피를 던져 적용하는 동작이므로, 단순한 ‘뿌리다’보다 ‘뿌려 바르다’ 또는 ‘뿌리다’가 될 수 있으나 본문에서는 제단 사방이라는 적용 범위가 분명히 드러나야 합니다. 한국어에서 ‘제단 사방에 뿌리다’는 제단 주변 땅에 뿌리는 뜻으로도 읽힐 수 있어 ‘제단 사방으로 뿌리다’로 바로잡는 것이 안전합니다.
  naturalness: 합쇼체의 규정문으로 자연스럽습니다. 다만 ‘자기 손을 자기 제물의 머리에’는 소유 표현의 반복으로 다소 부자연스럽습니다. 한국어에서는 ‘자기 제물의 머리에 손을’이라고 하여도 히브리어의 3인칭 소유를 충분히 보존합니다.
  terminology: ‘회막’, ‘제물’, ‘아론의 아들 제사장들’, ‘제단’은 일관되고 적절합니다. ‘잡아 죽이다’는 שׁחט의 제의적 도살을 이해 가능하게 옮긴 표현입니다. זרק의 던져 적용하는 의미와 제단의 둘레 방향을 더 분명히 하기 위해 방향격 표현을 조정합니다.
  issues:
  - severity: low
    issue: 소유 표현의 반복
    rationale: ‘자기 손을 자기 제물의 머리에’는 의미상 오류는 없으나 현대 표준 한국어에서는 ‘자기 제물의 머리에 손을’이 더 자연스럽고, 손의 소유도 문맥상 분명합니다.
  - severity: medium
    issue: 피 뿌림의 대상·방향이 다소 모호함
    rationale: ‘제단 사방에’는 제단의 주변 공간을 뜻할 수도 있습니다. עַל־הַמִּזְבֵּחַ סָבִיב은 피를 제단에, 그 둘레를 따라 적용하는 뜻이므로 ‘제단 사방으로’가 한국어에서 그 방향을 더 잘 드러냅니다.
  revised_text: 그는 자기 제물의 머리에 손을 얹고 회막 입구에서 그것을 잡아 죽여야 하며, 아론의 아들 제사장들은 그 피를 제단 사방으로 뿌려야 합니다.
