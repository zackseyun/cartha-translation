review_pass:
  verdict: revise
  source_fidelity: ‘제단 위 사방에’는 피가 제단의 윗면에만 뿌려지는 듯 들릴 수 있으나, עַל־הַמִּזְבֵּחַ סָבִיב은 제단의 사방을 대상으로 하는 피의 적용을 가리킵니다. 또한 זָרַק의 적극적인 제의 행위를 고려하여 위치 표현을 ‘제단 사방에’로 바로잡는 것이 적절합니다.
  naturalness: ‘그것의 머리’는 현대 한국어에서 다소 번역투입니다. 제물 동물을 가리키는 ‘그 짐승의 머리’가 자연스럽고 지시 대상도 분명합니다. ‘도살하다’는 이 문맥의 의례적 도살을 간결하고 정확하게 표현합니다.
  terminology: ‘회막’, ‘아론의 아들들’, ‘제단’은 통용되는 제의 용어로 적절합니다. 각주가 본문과 동일한 ‘회막 앞에서’를 대안으로 제시한 것은 유효한 대안이 아니므로, אֹהֶל מוֹעֵד의 직역적 뜻을 설명하도록 고칩니다.
  issues:
  - severity: medium
    issue: ‘제단 위 사방에’라는 위치 표현
    rationale: 히브리어는 피를 제단에, 곧 제단 사방에 적용하는 행위를 말합니다. ‘제단 위’는 제단 상면에 한정되는 인상을 줄 수 있습니다.
  - severity: low
    issue: ‘그것의 머리’의 번역투
    rationale: 한국어에서는 동물을 가리켜 ‘그 짐승의 머리’라고 하는 편이 자연스럽고 명확합니다.
  - severity: low
