  to: 그는 그 짐승의 머리에 손을 얹고, 회막[a] 앞에서 그것을 도살해야 하며, 아론의 아들들은 제단 사방에 그 피를 뿌려야 합니다.
  rationale: 원문의 제의 절차와 명시된 단수 ‘손’을 한국어의 자연스러운 표현 안에서 유지했습니다. 도살 행위에는 ‘도살하다’를 사용하고, 피의 처리는 제단의 윗면으로 오해될 수 있는 ‘제단 위’를 제거하여 ‘제단 사방에’로 옮겼습니다. 각주는 중복된 대안 대신 원어 표현의 뜻을 설명하도록 수정했습니다.
