reference: Leviticus 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
  footnotes:
  - marker: a
    text: Or 'dash its blood on the altar all around.' The Hebrew verb can be rendered with several English verbs in sacrificial contexts; 'throw' is chosen here as the most direct rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 짐승의 머리에 손을 얹고, 회막[a] 앞에서 그것을 도살해야 하며, 아론의 아들들은 제단 사방에 그 피를 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֹהֶל מוֹעֵד는 직역하면 ‘만남의 장막’입니다.
    reason: source_note
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁוֹ
  english_pob_choice: shall lay his hand on its head
  chosen_korean: 자기 손을 그것의 머리에 얹고
  alternatives_korean:
  - 손을 머리에 놓고
  - 손을 머리에 대고
  lexicon: HALOT
  rationale: 제물 위에 손을 두는 제의적 행위를 한국어로 가장 자연스럽게 드러내기 위해 ‘얹다’를 택했습니다. ‘놓다’보다 밀착된 접촉을, ‘대다’보다 행위의 완결성을 더 잘 담습니다.
- source_word: וְשָׁחַט אֹת֔וֹ
  english_pob_choice: slaughter it
  chosen_korean: 그것을 잡아 죽여야 하며
  alternatives_korean:
  - 도살해야 하며
  - 잡아 죽여야 하며
  lexicon: HALOT
  rationale: שׁחט의 제의적 도살을 살리되 현대 한국어에서 직설적이고 문맥상 분명한 표현으로 옮기기 위해 ‘잡아 죽이다’를 사용했습니다. ‘도살하다’도 가능하지만 문장 흐름이 더 딱딱합니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 증거막
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 제의적 고유명칭이므로 ‘회막’을 유지했습니다. 본문 의미를 훼손하지 않으면서도 독자가 장소 용어를 즉시 알아볼 수 있습니다.
- source_word: וְזָרְקוּ ... עַל הַמִּזְבֵּחַ סָבִיב
  english_pob_choice: shall throw its blood against the altar all around
  chosen_korean: 그 피를 제단 위 사방에 뿌려야 합니다
  alternatives_korean:
  - 그 피를 제단에 사방으로 던져야 합니다
  - 그 피를 제단 사방에 뿌려야 합니다
  lexicon: HALOT
  rationale: זָרַק은 제의 문맥에서 피를 제단에 적용하는 동작이므로 ‘뿌리다’가 자연스럽고, ‘사방에’는 סָבִיב의 분산적 의미를 살립니다. ‘위’는 제단 표면/주변에 대한 적용을 한국어로 무리 없이 드러냅니다.
theological_decisions:
- issue: 제의적 손 얹음과 도살의 연결
  chosen_reading: 손을 얹는 행위와 이어지는 도살을 한 문장 안에서 직접 연결해, 속죄 제의의 절차적 성격을 분명히 드러냈습니다.
  alternative_readings:
  - 손을 대고
  - 손을 얹은 뒤
  rationale: 본문은 행위 순서를 명령형으로 밀도 있게 제시하므로, 분리하거나 완화하지 않고 절차성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 레위기 3장의 화목제 규례
- issue: 피를 ‘제단 위 사방에’ 처리하는 표현
  chosen_reading: ‘뿌리다’를 사용해 피가 제단 주변에 적용되는 제의적 동작을 표현했습니다.
  alternative_readings:
  - 뿌리다
  - 던지다
  rationale: 히브리어 זרק의 제의적 동작은 단순한 ‘분사’보다 능동적 적용을 포함하므로, 전통적이지만 과도하게 약화되지 않은 표현이 적절합니다.
  doctrine_reference: 성막 제의의 피 처리 규정
