id: LEV.3.6
reference: Leviticus 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
  footnotes:
  - marker: a
    text: Or 'for a sacrifice of fellowship offerings.' The Hebrew term שְׁלָמִים is traditionally rendered 'peace offerings' but can also emphasize shared well-being or fellowship within the sacrificial meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 제물이 야훼께 드리는 화목제의 희생제물로 가축 떼에서 나오는 것이라면, 수컷이든 암컷이든 흠이 없어야 하며, 그는 그것을 바쳐야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제제의 희생제물’. 히브리어 שְׁלָמִים은 전통적으로 ‘화목제’로 옮기지만, 함께 나누는 식사와 공동의 안녕을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 가축 떼에서 나오는 것
  alternatives_korean:
  - 양 떼에서
  - 작은 가축에서
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 아우르는 집합명사이므로, 특정 종으로 좁히지 않으면서 제물 문맥에 자연스러운 한국어로 옮겼습니다.
- source_word: לְזֶבַח שְׁלָמִים
  english_pob_choice: for a sacrifice of peace offerings
  chosen_korean: 화목제의 희생제물
  alternatives_korean:
  - 평안제의 희생제물
  - 화평제의 희생제물
  lexicon: HALOT
  rationale: שְׁלָמִים의 제의적 용례를 반영해 전통적으로 쓰이는 '화목제'를 택했고, זֶבַח는 단순한 제물이 아니라 희생제의 성격을 드러내기 위해 '희생제물'로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 YHWH는 '야훼'로 옮기고, 여격 용법은 '-께'로 자연스럽게 표현했습니다.
- source_word: זָכָר אוֹ נְקֵבָה
  english_pob_choice: male or female
  chosen_korean: 수컷이든 암컷이든
  alternatives_korean:
  - 암수 어느 쪽이든
  - 수컷이나 암컷
  lexicon: HALOT
  rationale: 가축 제의 규정의 성별 구분을 분명히 드러내기 위해 생물학적 성을 직접적으로 표현했습니다.
- source_word: תָּמִים
  english_pob_choice: without blemish
  chosen_korean: 흠이 없어야 하며
  alternatives_korean:
  - 온전해야 하며
  - 결점이 없어야 하며
  lexicon: HALOT
  rationale: 제의 동물의 결격 사유를 나타내는 관용구이므로, 한국어 성경 문맥에서 가장 명확한 '흠이 없다'를 사용했습니다.
- source_word: יַקְרִיבֶנּוּ
  english_pob_choice: he shall offer it
  chosen_korean: 그는 그것을 바쳐야 합니다
  alternatives_korean:
  - 그는 그것을 드려야 합니다
  - 그는 그것을 제시해야 합니다
  lexicon: HALOT
  rationale: קרב의 제의적 용법을 반영해 '바치다'를 택했으며, 반복되는 제의 동작의 의무를 한국어 의무형으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: YHWH의 음역 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 히브리어 המקראיות 및 프로젝트 기본 용례에 따라 언약명은 '야훼'로 유지해, 일반 명사 '주'로 평준화하지 않았습니다.
  doctrine_reference: 'project glossary: יהוה / YHWH'
