lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  english_pob_choice: As for the cities of the Levites
  chosen_korean: 레위인의 성읍들
  alternatives_korean:
  - 레위인들의 성읍들
  - 레위인에 속한 성읍들
  lexicon: HALOT
  rationale: 문맥상 새 법조항을 이끄는 주제 전환이므로, 한국어에서도 표제처럼 앞세운 ‘레위인의 성읍들’이 자연스럽고 원문의 지시성을 유지합니다.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  english_pob_choice: the houses in the cities of their possession
  chosen_korean: 그들의 소유 성읍들에 있는 집들
  alternatives_korean:
  - 그들의 소유의 성읍들 안에 있는 집들
  - 그들의 기업 성읍들에 있는 집들
  lexicon: HALOT
  rationale: ‘집들’이 속격 구문에 매인 대상이므로, 한국어에서는 위치를 분명히 하여 ‘…에 있는 집들’로 옮기는 것이 법조문의 의미를 가장 분명하게 드러냅니다.
- source_word: גְּאֻלַּת עוֹלָם תִּהְיֶה לַ/לְוִיִּם
  english_pob_choice: may be redeemed permanently
  chosen_korean: 영원한 속량권이 있습니다
  alternatives_korean:
  - 영구한 속량이 있습니다
  - 영원히 속량될 수 있습니다
  - 속량의 권리가 영구히 있습니다
  lexicon: HALOT
  rationale: 명사구와 동사의 법률적 구문은 단순히 ‘구속된다’보다 지속적 권리를 뜻하는 표현이어서, POB의 해석을 따라 ‘속량권’으로 옮겨 레위인에게 부여된 지속적 권리를 분명히 했습니다.
theological_decisions:
- issue: גְּאֻלַּת עוֹלָם의 법적 성격
  chosen_reading: 레위인에게 주어진 집에 대한 영속적 속량 권리로 이해했습니다.
  alternative_readings:
  - 추상적으로 ‘영원한 속량’이 있다고 볼 수도 있습니다.
  - ‘영원히 속량될 수 있다’는 가능성으로만 옮길 수도 있습니다.
  rationale: 이 구절은 교리 진술보다 토지·가옥에 대한 율법 조항에 가깝기 때문에, 권리의 지속성을 드러내는 번역이 원문 기능에 더 충실합니다.
  doctrine_reference: 레위기 25장 법조 문맥
