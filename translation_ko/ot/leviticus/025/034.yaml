  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
  footnotes:
  - marker: a
    text: Or 'common land' or 'open land' for 'pastureland' (מִגְרָשׁ), referring to the land around Levitical cities.
    reason: lexical_alternative
  - marker: b
    text: Or 'everlasting possession.' The Hebrew עוֹלָם can denote enduring permanence; here it refers to the land's non-transferable status.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들의 성읍에 딸린 목초지[a]는 팔리지 말라. 이는 그것이 그들에게 영구한 소유지[b]이기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공동 토지’ 또는 ‘개활지’. 히브리어 미그라시(מִגְרָשׁ)는 레위 사람의 성읍 주변에 있는 토지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 소유’. 히브리어 올람(עוֹלָם)은 지속적인 영속성을 뜻할 수 있으며, 여기서는 이 토지가 양도될 수 없는 소유지임을 가리킵니다.
    reason: alternative_reading
