  naturalness: The revised wording is natural in modern formal Korean and retains the concise legal rationale of the Hebrew.
  terminology: ‘성읍’ suitably reflects the biblical/legal setting. ‘목초지’ is clear, with a note preserving the lexical alternatives. ‘영구한 소유지’ accurately renders אֲחֻזַּת עוֹלָם without importing an absolute-metaphysical sense.
