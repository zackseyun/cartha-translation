  source_fidelity: 히브리어의 조건문, 속량, 희년, 그리고 남성 복수인 ‘그의 아들들’은 대체로 반영되었습니다. 다만 ‘희년이 오면’은 בִּשְׁנַת הַיּוֹבֵל(‘희년이 되는 해에’)보다 시간 표현이 다소 느슨하며, ‘그와 그와 함께 있는 그의 아들들’은 중복되고 부자연스럽습니다.
