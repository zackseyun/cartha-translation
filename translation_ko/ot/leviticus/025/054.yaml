id: LEV.25.54
reference: Leviticus 25:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
  footnotes:
  - marker: a
    text: Or 'by these'—referring to the redemption provisions described in the preceding verses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 이러한 방법으로 속량되지 않으면, 그는 희년이 되는 해에 그의 아들들과 함께 풀려납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이러한 방법”은 앞선 절들에 제시된 속량 규정들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ... 않으면
  alternatives_korean:
  - 그리고 만일 ... 않으면
  - 만일 ... 않으면
  lexicon: HALOT
  rationale: 앞 절의 속량 규정과 이어지는 조건문이므로, 단순한 연결보다 약한 대비를 살려 ‘그러나’로 시작했습니다.
- source_word: יִגָּאֵל בְּאֵלֶּה
  english_pob_choice: is redeemed by these means
  chosen_korean: 이런 방법으로는 속량되지
  alternatives_korean:
  - 이것들로는 구속되지
  - 이렇게는 되찾아지지
  lexicon: HALOT
  rationale: גאל의 법률적 의미를 살려 ‘속량되다’로 옮기고, בְּאֵלֶּה는 앞선 속량 규정들을 가리키므로 ‘이런 방법으로는’으로 풀었습니다.
- source_word: וְיָצָא בִּשְׁנַת הַיֹּבֵל
  english_pob_choice: then ... shall go out in the year of Jubilee
  chosen_korean: 희년이 오면 ... 풀려납니다
  alternatives_korean:
  - 희년에는 ... 나갑니다
  - 희년이 되면 ... 나갑니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘나가다’는 종속 상태의 해제를 뜻하므로, 현대 한국어에서 자연스럽고 법적 의미가 분명한 ‘풀려납니다’로 옮겼습니다.
- source_word: וּבָנָי/ו עִמּוֹ
  english_pob_choice: and his sons with him
  chosen_korean: 그와 함께 있는 그의 아들들이
  alternatives_korean:
  - 그의 아들들도 함께
  - 그의 아들들이 그와 함께
  lexicon: HALOT
  rationale: בָנָיו의 남성 복수를 그대로 살려 ‘그의 아들들’로 옮기고, 함께 풀려나는 공동 운명을 분명히 하기 위해 어순을 조정했습니다.
theological_decisions:
- issue: ‘go out’의 법적 함의
  chosen_reading: 종이나 종속 신분에서의 해방을 뜻하는 법률 용어로 이해해 ‘풀려납니다’라고 번역했습니다.
  alternative_readings:
  - 그는 나갑니다
  - 해방됩니다
  rationale: 레위기 25장의 문맥에서는 단순한 이동이 아니라 봉사/예속 상태의 종료를 가리키므로, 의미를 분명히 하되 과도하게 신학화하지 않았습니다.
  doctrine_reference: 레위기 25장 속량 규정의 문맥
