id: LEV.25.52
reference: Leviticus 25:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
  footnotes:
  - marker: a
    text: Or, 'he shall pay back his redemption price.' The Hebrew expression refers to the amount required for his redemption, not redemption in an abstract sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 희년까지 몇 해만 남아 있으면, 그는 그와 계산해야 합니다. 그의 연수에 따라 그는 자기 속량의 대가를 갚아야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  english_pob_choice: few years remain
  chosen_korean: 몇 해만 남아 있으면
  alternatives_korean:
  - 몇 해가 남아 있으면
  - 남은 해가 적으면
  lexicon: HALOT
  rationale: 수량이 적음을 나타내는 표현을 한국어 법문체에 자연스럽게 옮기되, 남은 기간이라는 시간적 의미를 분명히 했습니다.
- source_word: שְׁנַת הַיֹּבֵל
  english_pob_choice: the Year of Jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 희년의 해
  - 희년의 연도
  lexicon: HALOT
  rationale: 레위기 25장의 제도명은 한국어 성경에서 통용되는 ‘희년’을 쓰는 것이 가장 직접적이며, 별도 설명 없이도 제도명을 전달합니다.
- source_word: וְחִשַּׁב ל֑וֹ
  english_pob_choice: he shall calculate with him
  chosen_korean: 그와 계산해야 합니다
  alternatives_korean:
  - 그와 셈해야 합니다
  - 그와 계산해야 합니다
  lexicon: HALOT
  rationale: 법률·금전 문맥의 חשב를 회계적 ‘계산하다’로 옮겼고, לֹו를 관계의 대상인 ‘그와’로 처리해 상호 정산의 뉘앙스를 살렸습니다.
- source_word: גְּאֻלָּתוֹ
  english_pob_choice: his redemption
  chosen_korean: 자기 속량의 대가
  alternatives_korean:
  - 자기 속량값
  - 자기 구속의 대가
  lexicon: HALOT
  rationale: 영문 POB의 판단처럼 여기서의 גְּאֻלָּה는 추상적 ‘속량’이 아니라 지불해야 할 금액을 가리키므로, ‘대가’로 그 경제적 의미를 드러냈습니다.
theological_decisions:
- issue: גְּאֻלָּה의 의미를 추상적 구원 개념으로 읽을지, 상환해야 할 금전적 대가로 읽을지
  chosen_reading: 이 절에서는 속량 행위 자체보다 속량을 위해 지불해야 하는 대가를 뜻하는 것으로 옮겼습니다.
  alternative_readings:
  - 추상적 의미의 ‘속량’
  - ‘구속’이라는 신학적 용어
  rationale: 문맥이 가족 재산 회복과 상환 규정을 다루므로, 신학적 추상화보다 법적·경제적 의미를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 레위기 25장의 기업 회복과 친족 속량 규정
