review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibitions on taking נֶשֶׁךְ and תַרְבִּית, the command to fear God, and the jussive injunction that the addressee's brother live with him. The connective contrast is reasonably represented. Replacing ‘두려워하십시오’ with ‘경외하십시오’ more consistently communicates ירא of reverent fear toward God in this legal-covenantal context.
  naturalness: The sentence flow and 합쇼체 register are natural. ‘경외하십시오’ is more idiomatic and theologically precise than a potentially merely emotional ‘두려워하십시오’ when God is the object. The retained direct possessives are acceptable in this formally addressed translation.
  terminology: ‘이자’ and ‘이익’ appropriately render the paired financial terms in readable Korean. ‘형제’ properly retains the familial wording, while the footnote appropriately explains its covenant-community scope. ‘경외하다’ is the established Korean biblical term for fearing God.
  issues:
  - severity: low
    issue: ‘하나님을 두려워하십시오’ is less precise in this context than ‘하나님을 경외하십시오.’
    rationale: Hebrew וְיָרֵאתָ מֵאֱלֹהֶיךָ denotes reverent fear of God, not simply being afraid. ‘경외하십시오’ is standard modern Korean biblical usage and preserves the ethical-theological force.
  revised_text: 그에게서 이자를 받거나 이익을 취하지 마십시오. 그러나 당신의 하나님을 경외하십시오. 그리고 당신의 형제가 당신과 함께 살게 하십시오.[a]
