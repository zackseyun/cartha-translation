id: LEV.25.36
reference: Leviticus 25:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
  footnotes:
  - marker: a
    text: Or 'increase' or 'gain' for 'profit'; the Hebrew pairs two related terms for interest extracted from a poor borrower.
    reason: lexical_alternative
  - marker: b
    text: '''Your brother'' here means a fellow member of the covenant community, not necessarily a biological brother.'
    reason: cultural_note
translation:
  language: ko
  text: 그에게서 이자를 받거나 이익을 취하지 마십시오. 그러나 당신의 하나님을 경외하십시오. 그리고 당신의 형제가 당신과 함께 살게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제’는 여기서 반드시 생물학적 형제를 뜻하는 것이 아니라, 언약 공동체의 동료를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  english_pob_choice: Do not take
  chosen_korean: 받지 마십시오 / 취하지 마십시오
  alternatives_korean:
  - 가지지 마십시오
  - 취득하지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지 명령을 한국어의 직접적 금지형으로 옮기되, 문맥상 금전적 이득을 ‘받다/취하다’로 자연스럽게 표현했습니다.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  english_pob_choice: interest or profit
  chosen_korean: 이자 / 이익
  alternatives_korean:
  - 고리
  - 증식분
  - 증가분
  lexicon: HALOT
  rationale: נֶשֶׁךְ은 대출에서 취하는 이자를, תַרְבִּית는 그에 더해지는 증가분을 가리키므로, 현대 한국어에서는 기능적으로 대응하는 ‘이자’와 ‘이익’으로 분리해 옮겼습니다.
- source_word: מֵאֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 너의 하나님
  - 네 하나님
  lexicon: HALOT
  rationale: 직접적 언약 호칭을 살리면서도 합쇼체에 맞게 ‘당신의 하나님’으로 옮겨, 경외의 촉구를 분명히 했습니다.
- source_word: וְחֵי אָחִיךָ עִמָּךְ
  english_pob_choice: and let your brother live with you
  chosen_korean: 그리고 당신의 형제가 당신과 함께 살게 하십시오
  alternatives_korean:
  - 그리고 당신의 형제가 당신과 함께 살도록 하십시오
  - 그리고 당신의 형제가 당신 곁에서 살게 하십시오
  lexicon: HALOT
  rationale: 동사의 결과/명령적 기능을 반영해 목적절보다 직접적인 허용·조치의 표현으로 옮겼고, אָחִיךָ는 언약 공동체의 동료를 뜻하는 기본 의미를 살려 ‘형제’로 유지했습니다.
theological_decisions:
- issue: אָחִיךָ의 공동체적 의미
  chosen_reading: ‘형제’는 혈연 형제보다 언약 공동체 안의 동료를 가리키는 넓은 의미로 유지했습니다.
  alternative_readings:
  - 동료 이스라엘 사람
  - 동족
  rationale: 본문의 가족적 언어를 약화하지 않으면서도, 레위기 법문의 사회-언약적 범위를 훼손하지 않기 위해 ‘형제’를 본문에 두고 그 의미를 해설 가능하게 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
