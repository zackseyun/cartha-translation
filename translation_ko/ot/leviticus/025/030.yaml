id: LEV.25.30
reference: Leviticus 25:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
  footnotes:
  - marker: a
    text: Or more literally, 'shall stand permanently.' The Hebrew idiom expresses that the sale remains legally fixed.
    reason: lexical_alternative
  - marker: b
    text: '''It shall not go out in the Jubilee'' means the house does not revert to the original family at the Jubilee year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것이 한 온전한 해가 지나기 전에 속량되지 않으면, 성벽이 없는 성읍 안에 있는 그 집은 그것을 산 자에게 영구히 넘어가며, 그의 세대 동안도 그에게 속할 것이고, 희년에 나오지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 해가 그것에 대해 완전히 채워질 때까지’입니다. 여기서는 속량 가능 기한을 뜻합니다.
    reason: source_note
  - marker: b
    text: ‘희년에 나오지 않는다’는 말은 희년에도 원래 가족에게 돌아가지 않는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  english_pob_choice: is redeemed
  chosen_korean: 속량되지 않으면
  alternatives_korean:
  - 구속되지 않으면
  - 되찾아지지 않으면
  lexicon: HALOT
  rationale: 레위기 25장의 법적·언약적 용례를 살려 ‘속량’으로 옮겼습니다. ‘되찾다’보다 제의적/법률적 의미가 분명하고, POB의 ‘redeemed’와도 대응됩니다.
- source_word: עַד מְלֹאת ל/וֹ שָׁנָה תְמִימָה
  english_pob_choice: before a full year is completed for it
  chosen_korean: 한 온전한 해가 지나기 전에
  alternatives_korean:
  - 그것을 위한 한 해가 다 채워지기 전에
  - 한 해가 완전히 차기 전에
  lexicon: HALOT
  rationale: 마감 시한을 나타내는 관용을 한국어로 자연스럽게 풀되, ‘온전한 해’로 ‘full year’의 완결성을 보존했습니다.
- source_word: וְקָם ... לַצְמִיתֻת
  english_pob_choice: shall pass permanently
  chosen_korean: 영구히 넘어가며
  alternatives_korean:
  - 영구히 확정되며
  - 영원히 서게 되며
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만, 문맥상 소유권이 확정되는 법률적 효력을 뜻하므로 ‘넘어가다’로 옮겼습니다. ‘영구히’는 לצמיתות의 불가역성을 살립니다.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  english_pob_choice: it shall not go out in the Jubilee
  chosen_korean: 희년에 나오지 않을 것입니다
  alternatives_korean:
  - 희년에 돌려주지 않을 것입니다
  - 희년에 반환되지 않을 것입니다
  lexicon: HALOT
  rationale: 출애굽·반환의 관용구를 따라 ‘나오다’의 이미지를 유지했습니다. 법적 의미는 본문 안에서 이미 ‘영구히 넘어가며’로 충분히 드러납니다.
theological_decisions:
- issue: 무성벽 성읍의 집 매매가 희년에도 되돌아오지 않는다는 법적 효력
  chosen_reading: 한 해 안에 속량되지 않으면 그 집의 매매는 확정되어 희년에도 원소유자에게 돌아가지 않습니다.
  alternative_readings:
  - 단순히 매수자의 소유가 계속된다는 식으로만 옮길 수 있음
  - ‘서게 된다’를 직역해 의미를 덜 분명하게 할 수 있음
  rationale: וְקָם, לַצְמִיתֻת, לְדֹרֹתָיו, לֹא יֵצֵא בַּיּוֹבֵל의 결합은 단순 유효가 아니라 불가역적 이전을 가리킵니다. 그래서 한국어 본문도 그 법적 강도를 분명히 드러냈습니다.
  doctrine_reference: 레위기 25장의 토지·가옥 속량 규정
