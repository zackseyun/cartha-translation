  naturalness: ‘한 온전한 해가 지나기 전에’는 자연스럽습니다. 그러나 한 문장 안에서 ‘넘어가며, 그의 세대 동안도 그에게 속할 것이고’라고 이어지는 표현은 한국어 법률·서사 문체 모두에서 부자연스럽습니다. ‘매수자와 그의 후손에게 영구히 속하게 되며’로 정리하면 현대 표준어 합쇼체에 맞고 의미도 선명해집니다.
