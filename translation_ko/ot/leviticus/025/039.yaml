id: LEV.25.39
reference: Leviticus 25:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a slave.
  footnotes:
  - marker: a
    text: Literally, 'you shall not make him serve the service of a slave.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and is sold to you'; the Hebrew idiom can be expressed passively, though in context it refers to a poor man selling himself into debt service.
    reason: alternative_reading
translation:
  language: ko
  text: 형제가 당신과 함께 가난해지고 당신에게 팔리면, 당신은 그를 종처럼 부리면 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמוּךְ
  english_pob_choice: becomes poor
  chosen_korean: 가난해지고
  alternatives_korean:
  - 가난하게 되고
  - 빈곤해지고
  lexicon: HALOT
  rationale: 소유나 처지가 실제로 낮아지는 상태 변화를 자연스럽게 살렸습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 형제
  alternatives_korean:
  - 네 형제
  - 동족
  lexicon: HALOT
  rationale: 레위기 맥락에서 공동체 안의 동료를 가리키는 친족 표현을 한국어의 자연스러운 ‘형제’로 옮겼습니다.
- source_word: וְנִמְכַּר לָךְ
  english_pob_choice: and sells himself to you
  chosen_korean: 당신에게 팔리면
  alternatives_korean:
  - 당신에게 자신을 팔면
  - 당신에게 팔려 오면
  lexicon: HALOT
  rationale: 히브리어 수동형 관용을 한국어에서는 결과 중심의 자연스러운 표현으로 처리하되, 문맥상 자발적 채무 종살이의 의미를 해치지 않도록 했습니다.
- source_word: עֲבֹדַת עָבֶד
  english_pob_choice: as a slave
  chosen_korean: 종처럼 부리면 안 됩니다
  alternatives_korean:
  - 노예처럼 부리면 안 됩니다
  - 노예의 일을 시키면 안 됩니다
  lexicon: HALOT
  rationale: 본문의 금지는 단순히 ‘일하다’가 아니라 종의 신분과 노동 형태로 대우하는 것을 금하는 것이므로, POB의 source-sensitive한 bonded-status 렌더링 취지를 살려 한국어에서도 차별적 대우를 분명히 드러냈습니다.
theological_decisions:
- issue: 종속 노동 상태를 가리키는 용어의 한국어 처리
  chosen_reading: ‘종’으로 번역해, 단순한 고용노동이 아니라 제한된 신분 아래의 부림을 드러냈습니다.
  alternative_readings:
  - 노예
  - 종살이꾼
  - 머슴
  rationale: 여기서 문제는 일반적인 봉사보다 신분적 종속입니다. 다만 본문은 절대적 소유 노예제의 일반화가 아니라 동족에 대한 부당한 취급 금지를 말하므로, 직설적이면서도 문맥에 맞는 ‘종’이 가장 균형적입니다.
  doctrine_reference: POB 번역 원칙 §1; bonded-status 용어의 문맥별 처리
