  to: 네 형제가 너와 함께 가난하게 되어 네게 팔리거든, 그에게 종의 일을 시켜서는 안 됩니다.
  rationale: 수동형 ‘팔리거든’을 유지하여 וְנִמְכַּר의 문법적 여지를 보존하고, ‘네 형제’와 ‘네게’로 원문의 접미사를 반영했습니다. 또한 금지의 대상을 ‘종의 일’로 명시하여 עֲבֹדַת עָבֶד의 반복적 노동 용어를 더 충실히 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:09:32Z'
review_pass:
  verdict: revise
  source_fidelity: ‘당신과 함께’는 עִמָּךְ를 반영하고, ‘당신에게 팔리면’은 וְנִמְכַּר לָךְ의 수동형을 보존합니다. 그러나 ‘종처럼 부리다’는 원문의 ‘종의 노동/봉사’를 시키지 말라는 표현보다 다소 포괄적이며, ‘형제’에 소유 표현이 빠져 있습니다.
  naturalness: 성경의 직접 명령 문맥에서 ‘당신’은 현대 표준 한국어로 부자연스럽고 거리감 또는 대립적 뉘앙스를 낼 수 있습니다. ‘네’와 종결형 ‘-해서는 안 됩니다’가 현대적이면서도 합쇼체에 맞습니다.
  terminology: אָחִיךָ는 ‘네 형제’로, עֲבֹדַת עָבֶד는 신분적 종속 노동을 명시하는 ‘종의 일을 시키다’로 옮기는 것이 적절합니다. 이는 ‘노예’라는 해석적 세분화는 피하면서도 원문의 반복 어근과 법적 금지를 보존합니다.
  issues:
  - severity: medium
    issue: 직접 호칭 ‘당신’의 사용
    rationale: 성경의 단수 직접 명령에서 ‘당신’은 자연스럽지 않으며, 원문의 소유·여격 접미사를 한국어 성경 문체에 맞게 ‘네/네게’로 재현하는 편이 낫습니다.
  - severity: medium
    issue: אָחִיךָ의 소유 표현 누락
    rationale: ‘형제’만으로는 ‘네 형제’라는 원문의 직접적인 관계 표시가 약화됩니다.
  - severity: medium
    issue: עֲבֹדַת עָבֶד의 노동 표현이 다소 일반화됨
    rationale: ‘종처럼 부리다’도 뜻은 통하지만, 원문은 그에게 ‘종의 노동’을 시키는 행위를 금합니다. ‘그에게 종의 일을 시키다’가 더 가깝습니다.
  revised_text: 네 형제가 너와 함께 가난하게 되어 네게 팔리거든, 그에게 종의 일을 시켜서는 안 됩니다.
