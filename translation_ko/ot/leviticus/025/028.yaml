id: LEV.25.28
reference: Leviticus 25:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
  footnotes:
  - marker: a
    text: Or, 'and it shall return to his possession.' The final Hebrew verb could be understood with the sold property as the subject rather than the seller.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그가 그것을 되찾을 만큼 충분한 돈을 마련하지 못하면, 그가 판 재산은 희년까지 그것을 산 사람의 손에 남아 있게 됩니다. 희년이 되면 그 재산은 그 사람의 손에서 나오고, 그는 자기 소유지로 돌아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 히브리어 동사는 문법상 판매자뿐 아니라 매각된 재산을 주어로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  english_pob_choice: his hand does not find
  chosen_korean: 그의 손에 ... 충분한 것이 없으면
  alternatives_korean:
  - 그의 손이 찾지 못하면
  - 그가 마련하지 못하면
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손’은 능력·수단을 가리키므로, 한국어에서는 자연스럽게 ‘손에 ... 충분한 것이 없으면’으로 옮겨 원문의 구체성을 살렸습니다.
- source_word: דֵּי הָשִׁיב לוֹ
  english_pob_choice: enough to restore it to him
  chosen_korean: 그것을 되돌려 놓을 만큼 충분한 것
  alternatives_korean:
  - 그것을 회복시킬 만큼 충분한 것
  - 그에게 돌려줄 만큼 충분한 것
  lexicon: HALOT
  rationale: 이 문맥의 핵심은 매매된 토지를 원소유자에게 ‘회복’시키는 것이므로, 단순한 금전 변제가 아니라 물건의 법적 복원을 드러내는 ‘되돌려 놓다’가 가장 적절합니다.
- source_word: בְּיַד הַקֹּנֶה אֹתֹו
  english_pob_choice: in the hand of the one who bought it
  chosen_korean: 그것을 산 사람의 손에
  alternatives_korean:
  - 구매자의 손에
  - 그것을 사들인 자의 손에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어의 소유·지배 관용구를 살린 표현이며, ‘산 사람’은 참여분사 אתו의 의미를 자연스럽게 드러냅니다.
- source_word: שְׁנַת הַיּוֹבֵל
  english_pob_choice: the year of Jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 희년의 해
  - 희년 때
  lexicon: HALOT
  rationale: 한국 교회용어에서 이미 정착한 ‘희년’을 사용하되, 앞선 ‘까지’와 뒤의 ‘되면’으로 시점을 분명히 했습니다.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  english_pob_choice: and he shall return to his property
  chosen_korean: 그는 자기 소유로 돌아갑니다
  alternatives_korean:
  - 그것은 자기 소유로 돌아갑니다
  - 그는 자기 기업으로 돌아갑니다
  lexicon: HALOT
  rationale: 원문은 주어가 사람인지 매물인지 문법적으로 다소 열려 있지만, 문맥상 원소유자가 자기 hereditary holding을 회복하는 뜻이므로 ‘그는’으로 살리고, אֲחֻזָּה는 현대어로 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: 마지막 동사 וְשָׁב의 주어 해석
  chosen_reading: 원소유자/판매자가 주어가 되어 ‘그는 자기 소유로 돌아갑니다’로 옮겼습니다.
  alternative_readings:
  - 매각된 토지가 주어가 되어 ‘그것은 자기 소유로 돌아갑니다’로 옮길 수 있습니다.
  rationale: 희년 규례의 초점은 토지 자체의 이동보다 그 토지를 잃었던 사람이 원래의 상속 소유를 회복하는 데 있으므로, 인칭 주어를 살리는 번역이 문맥적 중심을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve theological/interpreive tension where genuine ambiguity exists)
