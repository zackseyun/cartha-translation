revisions:
- from: 그러나 그의 손에 그것을 되돌려 놓을 만큼 충분한 것이 없으면, 그가 판 것은 희년까지 그것을 산 사람의 손에 남아 있어야 합니다. 그리고 희년이 되면 그것은 나가고, 그는 자기 소유로 돌아갑니다.[a]
  to: 그러나 그가 그것을 되찾을 만큼 충분한 돈을 마련하지 못하면, 그가 판 재산은 희년까지 그것을 산 사람의 손에 남아 있게 됩니다. 희년이 되면 그 재산은 그 사람의 손에서 나오고, 그는 자기 소유지로 돌아갑니다.[a]
  rationale: 재산을 되찾는 데 필요한 재원이 없다는 히브리어 관용구를 현대 한국어로 명료하게 옮기고, 희년에 재산이 매수자의 지배에서 벗어나는 법적 결과를 자연스럽게 표현했습니다. 마지막 동사의 주어에 관한 실제 문법적 여지는 본문에서 우선적인 문맥상 독해를 따르되 각주로 보존했습니다.
