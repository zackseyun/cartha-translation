  source_fidelity: 본문의 법적 의미는 대체로 잘 옮겼습니다. 다만 וְיָצָא מִמְכַּר가 가리키는 것은 단순히 ‘매매’라는 거래 자체라기보다 팔린 집이 희년에 매매 관계에서 벗어나는 법적 효과입니다. 이를 한국어 본문에서 더 분명히 할 필요가 있습니다. 또한 בְּתוֹךְ בְּנֵי יִשְׂרָאֵל에 해당하는 각주 표지가 ‘희년’에 잘못 붙어 있습니다.
  naturalness: ‘그 성읍 안에 있는 그의 소유의 집의 매매’는 소유 관계가 중첩되어 현대 한국어로 매우 부자연스럽습니다. ‘그의 소유지인 성읍에 있는 집’으로 풀어 쓰면 원문의 압축된 관계를 유지하면서도 자연스럽습니다.
  terminology: ‘레위인’, ‘속량’, ‘희년’, ‘이스라엘 자손’, ‘소유’는 적절한 용어입니다. ‘레위 사람들의 성읍들’보다 ‘레위인들의 성읍들’이 명칭을 일관되게 유지합니다. 각주 b는 희년 문화 주석이 아니라 ‘이스라엘 자손’이라는 히브리어 관용 표현에 관한 어휘 각주여야 합니다.
