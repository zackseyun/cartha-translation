  rationale: 문장의 중첩된 소유 표현을 현대 한국어에 맞게 정리하고, 희년에 팔린 집이 매매 관계에서 벗어난다는 법적 효과를 명확히 했습니다. 레위인의 속량이라는 영어 POB의 채택 해석은 유지하되, 불필요한 해석적 확장은 피했습니다. 또한 각주 표지와 내용을 원문의 대응 어휘 및 영어 POB 감사 기록에 맞추었습니다.
