    rationale: 영어 POB에서 b는 בְּנֵי יִשְׂרָאֵל(‘sons of Israel’)에 붙습니다. 초안은 b를 ‘희년’에 붙이고 문화 주석으로 바꾸어, 원문의 해당 어휘에 대한 각주 연결을 잃었습니다.
