  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'shall go out' or 'shall revert' in the Jubilee; the Hebrew is literally 'shall go out,' referring to the sold property leaving the buyer's possession and returning.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인 가운데 한 사람이 그 집을 속량하면, 그의 소유지인 성읍에 있는 집이 팔린 것은 희년에 매매 관계에서 풀려날 것입니다[a]. 이는 레위인들의 성읍들에 있는 집들이 이스라엘 자손 가운데서 그들의 소유이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나갈 것이다’입니다. 여기서는 팔린 재산이 매수인의 점유에서 벗어나는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’; 이스라엘 백성을 가리키는 표준적인 언약 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  english_pob_choice: And if one of the Levites redeems it
  chosen_korean: 레위인 가운데 한 사람이 그것을 속량하면
  alternatives_korean:
  - 레위인들 중 한 사람이 그것을 되찾으면
  - 레위 사람 가운데 한 사람이 그것을 구속하면
  lexicon: HALOT
  rationale: 문맥상 משפט적 'redeem'은 단순한 매입이 아니라 속량이므로 '속량하다'를 썼고, מִן은 출처/소속을 나타내는 집합적 표현으로 받아 '레위인 가운데'로 옮겼습니다.
- source_word: וְיָצָא מִמְכַּר בַּיִת
  english_pob_choice: then the sale of the house ... shall be released
  chosen_korean: 그 성읍 안에 있는 그의 소유의 집의 매매는 ... 풀릴 것입니다
  alternatives_korean:
  - 그 집의 매매는 ... 나갈 것입니다
  - 그 집의 판매는 ... 해제될 것입니다
  lexicon: HALOT
  rationale: 직역하면 '나가다'이지만, 희년의 법적 효과는 거래가 구속력에서 풀려 원상으로 돌아가는 것이므로 '풀리다'로 자연스럽게 살렸습니다.
- source_word: בַּיֹּבֵל
  english_pob_choice: in the Jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 희년 때
  - 희년의 때
  lexicon: HALOT
  rationale: 제도명으로 굳어진 표현이므로 간결하게 '희년'이라 했습니다. 본문 의미는 문맥상 시점상으로 명확합니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘의 아들들 가운데서
  - 이스라엘 백성 가운데서
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 표준적 언약 표현을 유지하되 한국어에서는 자연스러운 관용형 '이스라엘 자손'을 사용했습니다.
theological_decisions:
- issue: 희년에서 매매가 '나가다'는 표현의 법적 의미
  chosen_reading: 희년에는 부동산의 매매 효력이 풀려 원소유 질서로 돌아가는 것으로 이해하고 번역했습니다.
  alternative_readings:
  - 희년에 나갈 것입니다
  - 희년에 되돌아갈 것입니다
  rationale: 히브리어 וְיָצָא의 문자적 이미지를 보존하되, 독자에게 법적 효력을 분명히 하기 위해 '풀리다'를 사용했습니다.
  doctrine_reference: Leviticus 25:10-17의 희년 규정
