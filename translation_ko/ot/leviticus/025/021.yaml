  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
  footnotes:
  - marker: a
    text: Or 'the produce' or 'the yield' for 'the crop.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 여섯째 해에 너희에게 내 복을 명령하리니, 그것이 삼 년 동안의 소출을 내게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소출’은 여기서 밭의 산출물과 수확의 결과를 함께 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  english_pob_choice: Then I will command
  chosen_korean: 그러면 내가 … 명령하리니
  alternatives_korean:
  - 그리고 내가 … 명령하겠습니다
  - 내가 … 정하겠습니다
  lexicon: HALOT
  rationale: 1인칭 단수 동사 צוה의 강한 권위를 살려 ‘명령하다’로 옮기고, 앞 절과의 연결을 나타내는 담화 기능은 ‘그러면’으로 드러냈습니다.
- source_word: בִּרְכָתִי
  english_pob_choice: my blessing
  chosen_korean: 내 복
  alternatives_korean:
  - 내 축복
  - 내가 주는 복
  lexicon: HALOT
  rationale: ברכה는 야훼가 베푸는 번성과 풍요를 가리키므로, 평이하면서도 본문의 소출 맥락을 포괄하는 ‘복’으로 옮겼습니다.
- source_word: הַתְּבוּאָה
  english_pob_choice: the crop / the yield
  chosen_korean: 소출
  alternatives_korean:
  - 수확
  - 산출물
  lexicon: HALOT
  rationale: תבואה는 농산물의 결과물인 수확·소출을 뜻하므로, 현대 한국어에서 의미를 압축해 전달하는 ‘소출’이 본문의 농업적 뉘앙스를 가장 잘 살립니다.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  english_pob_choice: for three years
  chosen_korean: 삼 년 동안
  alternatives_korean:
  - 세 해 동안
  - 삼 년을 위해
  lexicon: HALOT
  rationale: 기간의 지속과 충분성을 자연스럽게 드러내기 위해 ‘삼 년 동안’으로 옮겼습니다.
theological_decisions:
- issue: 축복의 성격
  chosen_reading: 하나님이 정하시는 구체적이고 능동적인 농업적 풍요의 약속입니다.
  alternative_readings:
  - 일반적인 섭리의 표현
  - 비유적 번성의 진술
  rationale: 1인칭 ‘내가 … 명령하리니’와 ‘내 복’은 단순한 일반론이 아니라, 야훼의 주권적 선언으로서 수확의 초과 공급을 약속합니다.
  doctrine_reference: 언약적 섭리와 창조 세계에 대한 하나님의 주권
