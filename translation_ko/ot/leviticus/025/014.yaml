revisions:
- from: 「그리고 네가 너의 이웃에게 무엇인가를 팔거나, 너의 이웃의 손에서 사거나 할 때에는, 어떤 사람도 그의 형제를 억압해서는 안 됩니다.」[a]
  to: 「그리고 여러분이 이웃에게 물건을 팔거나 이웃에게서 물건을 살 경우에는, 아무도 자기 형제를 부당하게 대해서는 안 됩니다[a].」
  rationale: 조건적 법률 문장의 성격을 ‘…할 경우에는’으로 분명히 하고, 원문의 2인칭 복수와 현대 표준 한국어 합쇼체를 일관되게 반영했습니다. 거래 문맥의 ינה는 ‘부당하게 대하다’로 옮겨 의미를 더 정확하고 자연스럽게 했으며, ‘형제’는 유지했습니다. 각주 표지는 해당 금지 동사구에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:09:33Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건적 법률 문장(וְכִי)과 매매 상황, 그리고 거래에서 상대를 부당하게 대하지 말라는 금지를 대체로 잘 반영했습니다. 다만 ‘…할 때에는’은 조건문보다 시간적 일반화를 더 강하게 나타내므로 ‘…할 경우에는’이 더 정확합니다. מִיַּד의 ‘손에서’는 한국어 거래 표현으로는 ‘에게서’가 자연스럽고 의미 손실이 없습니다.
  naturalness: ‘너의’와 합쇼체 종결은 높임말 체계가 섞여 어색합니다. 원문의 2인칭 복수에 맞추어 ‘여러분이’ 또는 소유 표현을 생략하는 편이 자연스럽습니다. ‘어떤 사람도 그의 형제를 억압해서는 안 됩니다’도 한국어에서는 다소 직역투이므로 ‘아무도 자기 형제를 부당하게 대해서는 안 됩니다’가 자연스럽고 거래 문맥에 더 맞습니다.
  terminology: עָמִית의 ‘이웃’은 영어 POB의 선택 및 공동체적 관계라는 문맥과 양립합니다. ינה는 여기서 일반적 정치·사회적 ‘억압’보다 거래상 ‘부당하게 대하다/부당한 이득을 취하다’의 뜻이 더 직접적입니다. אָחִיו는 ‘자기 형제’로 유지하여 원문의 표현을 보존했습니다.
  issues:
  - severity: medium
    issue: 조건 표현과 대명사·종결 체계
    rationale: ‘그리고 네가 … 할 때에는’은 원문의 조건성을 약화하며, 친근한 ‘네가/너의’와 공식 높임말 ‘-습니다’가 한 문장 안에서 충돌합니다.
  - severity: medium
    issue: ‘억압하다’의 어휘 범위
    rationale: ינה는 이 매매 문맥에서 상대를 부당하게 대하거나 부당한 이득을 취하는 행위를 가리킵니다. ‘억압하다’는 가능하지만 한국어에서는 더 넓고 다른 사회적 맥락을 우선 환기합니다.
  - severity: low
    issue: ‘이웃의 손에서 사다’의 직역투
    rationale: מִיַּד의 관용적 거래 표현은 한국어에서 ‘이웃에게서 사다’로 옮기는 것이 자연스럽고, 매매 상대방이라는 의미를 충분히 보존합니다.
