id: LEV.25.14
reference: Leviticus 25:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
  footnotes:
  - marker: a
    text: Or 'do not wrong one another'; the verb can denote taking unfair advantage, especially in commercial dealings.
    reason: lexical_alternative
translation:
  language: ko
  text: 「그리고 네가 너의 이웃에게 무엇인가를 팔거나, 너의 이웃의 손에서 사거나 할 때에는, 어떤 사람도 그의 형제를 억압해서는 안 됩니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 부당하게 대하지 말라’; 이 동사는 특히 거래에서 부당한 이익을 취하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 그리고 … 할 때에는
  alternatives_korean:
  - 만일 … 하면
  - 그리고 만약
  lexicon: HALOT
  rationale: 법률 조항의 조건문으로서 התחלת적 접속성과 조건성을 함께 살리기 위해 ‘그리고 … 할 때에는’으로 옮겼습니다.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  english_pob_choice: your neighbor
  chosen_korean: 너의 이웃
  alternatives_korean:
  - 너의 동료
  - 너의 동족
  lexicon: HALOT
  rationale: 거래 상황의 공동체적 ‘동료’보다 한국어에서 자연스럽고, 책임과 근접성을 드러내는 ‘이웃’이 본문의 윤리적 뉘앙스를 잘 전달합니다.
- source_word: מִיַּד
  english_pob_choice: from ... hand
  chosen_korean: …의 손에서
  alternatives_korean:
  - …에게서
  - …의 손으로부터
  lexicon: HALOT
  rationale: ‘손’이라는 관용구를 유지해 거래의 구체성을 살렸습니다. 단순히 ‘에게서’로 풀면 원문의 이미지가 약해집니다.
- source_word: תּוֹנוּ
  english_pob_choice: oppress
  chosen_korean: 억압해서는 안 됩니다
  alternatives_korean:
  - 학대해서는 안 됩니다
  - 속여서는 안 됩니다
  - 착취해서는 안 됩니다
  lexicon: HALOT
  rationale: 이 동사의 핵심은 거래에서의 부당한 이용과 해코지입니다. 여기서는 법적 금지의 강도를 살리면서도 경제적 부정의를 포함하는 ‘억압하다’가 가장 넓고 직접적입니다.
- source_word: אִישׁ אֶת אָחִיו
  english_pob_choice: no man ... his brother
  chosen_korean: 어떤 사람도 그의 형제를
  alternatives_korean:
  - 어느 누구도 그의 형제를
  - 사람은 누구나 그의 형제를
  lexicon: HALOT
  rationale: 히브리어의 대표적 남성 단수 표현을 한국어에서는 문맥상 포괄적인 ‘어떤 사람도’로 살리되, ‘형제’는 공동체 내부의 연대와 남성형 표현을 그대로 반영했습니다.
theological_decisions:
- issue: 대표적 남성형 표현의 처리
  chosen_reading: main text는 ‘어떤 사람도 … 형제를’로 유지하되, 의미상 공동체 전체에 적용되는 법 조항으로 읽습니다.
  alternative_readings:
  - 아무도 그의 이웃을
  - 어느 누구도 다른 이를
  rationale: 원문은 איש/אָחִיו의 남성형을 사용하지만, 율법 조항의 적용 범위는 남성에 국한되지 않습니다. 한국어 본문은 과도한 중성화보다 문맥상 대표성을 살리되, 자연스러운 포괄 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
