source:
  edition: WLC
  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
  footnotes:
  - marker: a
    text: Or, 'he shall pay back his redemption'—the Hebrew noun can denote the act of redemption, but here likely refers to the amount to be repaid for redemption.
    reason: lexical_alternative
translation:
  language: ko
  text: 아직도 여러 해가 남아 있으면, 그에 비례하여 그는 그를 매입한 금액을 기준으로 자기 속량값을 갚아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기 속량을 치러야 합니다’—히브리어 명사는 속량 행위 자체를 가리킬 수도 있지만, 여기서는 속량을 위해 갚아야 할 금액을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - ~하면
  lexicon: HALOT
  rationale: 법문 조건절의 경우를 자연스럽게 여는 표준적인 합쇼체 표현입니다.
- source_word: ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים
  english_pob_choice: many years still remain
  chosen_korean: 아직도 여러 해가 남아 있으면
  alternatives_korean:
  - 아직 여러 해가 더 남아 있으면
  - 여러 해가 아직 많이 남아 있으면
  lexicon: HALOT
  rationale: עוֹד의 ‘아직도/여전히’와 ‘많은 해들’의 의미를 함께 살려, 잔여 기간이 충분히 길다는 점을 한국어로 분명히 드러냈습니다.
- source_word: לְ/פִי/הֶן
  english_pob_choice: in proportion to them
  chosen_korean: 그에 비례하여
  alternatives_korean:
  - 그 수에 따라
  - 그에 맞추어
  lexicon: HALOT
  rationale: 직역의 ‘그들의 입에 따라’라는 관용을 법적 계산 의미인 ‘비례하여’로 옮겨, 청산 계산의 수식을 분명히 했습니다.
- source_word: גְּאֻלָּת/וֹ
  english_pob_choice: his redemption price
  chosen_korean: 자기 속량값
  alternatives_korean:
  - 그의 속량값
  - 속량 대가
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘속량’이 아니라 갚아야 할 금액을 가리키므로, POB의 ‘redemption price’에 맞춰 ‘속량값’으로 구체화했습니다.
theological_decisions:
- issue: 속량 개념의 경제적·법적 성격
  chosen_reading: 여기서는 구속의 신학적 은유를 부풀리지 않고, 토지/사람의 해방을 위한 계산 가능한 상환액으로 읽었습니다.
  alternative_readings:
  - 영적 구속의 일반 원리로 확장하는 읽기
  - 단순히 ‘값’으로만 처리하는 읽기
  rationale: 본문은 레위기의 희년/속량 규정에 속한 계산법이므로, 구원론적 일반화보다 법적·경제적 의미를 우선해야 합니다.
  doctrine_reference: 레위기 25장 희년 및 속량 규례
