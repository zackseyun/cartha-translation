source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: Now if the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
  footnotes:
  - marker: a
    text: Or 'to the stock/offshoot of a foreigner’s family.' The Hebrew expression is difficult; the main text renders the likely sense idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 거주 외국인의 재산이 너희 가운데서 넉넉해지고, 그의 곁에 있는 네 형제가 가난해져서 그 거주 외국인, 곧 너희 가운데 있는 그 거주 외국인에게나 외국인 가문의 한 갈래에게 자기 몸을 팔게 되면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인 가문의 뿌리/가지.’ 히브리어 표현이 어려우므로, 본문은 가능성이 큰 뜻을 관용적으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תַשִּׂיג יַד
  english_pob_choice: the means ... become sufficient
  chosen_korean: 재산이 ... 넉넉해지고
  alternatives_korean:
  - 손이 ... 미치고
  - 형편이 ... 나아지고
  - 수입이 ... 충분해지고
  lexicon: HALOT
  rationale: ‘손이 미치다’의 관용적 경제 의미를 살리되, 한국어에서는 자산·형편이 넉넉해진다는 표현이 자연스럽고 문맥에 맞습니다.
- source_word: גֵּר וְתוֹשָׁב
  english_pob_choice: resident foreigner
  chosen_korean: 거주 외국인
  alternatives_korean:
  - 나그네
  - 이방 거주민
  - 외국인 체류자
  lexicon: HALOT
  rationale: 두 용어가 함께 서는 결합 표현이라, 단순한 ‘나그네’보다 공동체 안에 실제로 거주하는 외부인을 드러내는 ‘거주 외국인’이 더 가깝습니다.
- source_word: וְנִמְכַּר
  english_pob_choice: sells himself
  chosen_korean: 자기 몸을 팔게 되면
  alternatives_korean:
  - 스스로 팔게 되면
  - 팔리게 되면
  - 자기 자신을 팔게 되면
  lexicon: HALOT
  rationale: 법률적 맥락에서 자발적 채무 종속을 가리키므로, 수동형 ‘팔리다’보다 행위 주체를 드러내는 표현이 원문의 함의를 더 분명히 전합니다.
- source_word: עֵקֶר מִשְׁפַּחַת גֵּר
  english_pob_choice: a member of the foreigner’s clan
  chosen_korean: 외국인 가문의 한 갈래
  alternatives_korean:
  - 외국인 가족의 한 뿌리
  - 외국인 가문의 한 지파
  - 외국인 가문의 한 분파
  lexicon: HALOT
  rationale: עֵקֶר은 난해한 표현이므로, 본문이 암시하는 ‘가문의 갈래/분파’라는 뜻을 살려 너무 문자적인 ‘뿌리’보다 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 가난한 형제를 지칭하는 친족 언어
  chosen_reading: 네 형제
  alternative_readings:
  - 네 동족
  - 네 친족
  rationale: 레위기 25장의 사회법은 언약 공동체 내부의 책임을 전제로 하므로, 본문의 형제 언어를 유지하는 편이 윤리적 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 4
- issue: גֵּר וְתוֹשָׁב의 결합 표현 처리
  chosen_reading: 거주 외국인
  alternative_readings:
  - 외국인과 거주민
  - 나그네와 거주자
  rationale: 두 단어를 하나의 사회적 범주로 읽는 전통적·현대적 해석을 반영해, 중복을 줄이면서도 ‘너희 가운데’라는 공동체적 위치를 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 1
