id: LEV.25.20
reference: Leviticus 25:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ֣י תֹאמְר֔וּ מַה נֹּאכַ֤֖ל בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְ/לֹ֥א נֶאֱסֹ֖ף אֶת תְּבוּאָתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: ko
  text: 그리고 너희가 말하기를 “우리가 일곱째 해에 무엇을 먹겠느냐? 보라, 우리는 씨를 뿌리지도 않고 우리의 소출도 거두지 않을 것이다” 하거든,[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “그리고 너희가 말하거든”이지만, 한국어에서는 조건적 발화를 자연스럽게 이어 주기 위해 ‘…하거든’으로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  english_pob_choice: And if you say
  chosen_korean: “그리고 너희가 말하기를 … 하거든”
  alternatives_korean:
  - “그리고 너희가 말하면 …”
  - “만일 너희가 말하기를 … 한다면”
  lexicon: 말하다
  rationale: 히브리어의 조건절 וְכִי + 동사형을 자연스러운 조건적 발화로 옮기되, 본문이 직접 인용을 여는 구조를 살려 “말하기를 … 하거든”으로 처리했습니다.
- source_word: מַה נֹּאכַל
  english_pob_choice: What will we eat
  chosen_korean: “우리가 … 무엇을 먹겠느냐”
  alternatives_korean:
  - “무엇을 먹을까”
  - “무엇을 먹겠습니까”
  lexicon: 먹다
  rationale: 질문은 단순 미래형보다 불안과 궁핍을 드러내는 수사적 물음이므로, 합쇼체 문맥 안에서 ‘먹겠느냐’로 긴장을 보존했습니다.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  english_pob_choice: in the seventh year
  chosen_korean: “일곱째 해”
  alternatives_korean:
  - “제칠 년”
  - “일곱 해째 되는 해”
  lexicon: שנה
  rationale: 절기·안식년 맥락의 통용 표현을 따라 ‘일곱째 해’로 옮겼고, 시간 개념을 덧붙이지 않았습니다.
- source_word: לֹא נִזְרָע וְלֹא נֶאֱסֹף
  english_pob_choice: since we will not sow or gather
  chosen_korean: “우리는 씨를 뿌리지도 않고 우리의 소출도 거두지 않을 것이다”
  alternatives_korean:
  - “우리는 씨를 뿌리지도 않고 거두어들이지도 않을 것이다”
  - “우리는 파종하지도 않고 수확하지도 않을 것이다”
  lexicon: זרע / אסף
  rationale: ‘씨를 뿌리다’는 파종의 직설적 동작을, ‘소출을 거두다’는 수확 대상을 분명히 드러내는 표현을 택해 두 동사의 병행을 살렸습니다.
theological_decisions:
- issue: '본문의 연결 방식: ‘since’의 원인절 처리'
  chosen_reading: 질문 뒤에 이유절을 직접 붙여, 안식년 동안 수확이 없다는 사정을 궁핍의 근거로 제시했습니다.
  alternative_readings:
  - “왜냐하면 우리는 씨를 뿌리지도 않고 …”
  - “보라, 우리는 씨를 뿌리지도 않고 …”
  rationale: 영문 POB의 개정이 ‘Behold’를 버리고 ‘since’로 정리한 것을 반영해, 히브리어의 논리적 연결을 직역 과잉 없이 한국어 원인 표현으로 살렸습니다.
  doctrine_reference: 안식년 규례(레 25장) 문맥의 설명적 질문
- issue: 직접화법의 정서 톤
  chosen_reading: 백성의 불안한 질문을 존중해 의문형과 절박한 진술을 그대로 유지했습니다.
  alternative_readings:
  - 질문을 평서적으로 완화
  - 추상적 신앙 권면으로 의역
  rationale: 본문은 불안의 언어를 통해 하나님의 공급을 전제하는 문맥이므로, 정서를 약화시키지 않고 그대로 전달하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 섭리와 안식년 규례의 서사적 긴장
