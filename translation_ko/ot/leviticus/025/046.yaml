  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
  footnotes:
  - marker: a
    text: Or 'you may bequeath them to your sons after you as hereditary property.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' and ''sons of Israel'' render the Hebrew masculine kinship terms directly; the law addresses fellow Israelites as covenant kin.'
    reason: cultural_note
translation:
  language: ko
  text: 너희는 그것들을 너희 뒤의 아들들에게 유업으로 물려주어 영원한 소유가 되게 할 수 있습니다. 너희는 그것들로 일을 시킬 수 있으나, 너희 형제들, 곧 이스라엘 자손들 사이에서는 누구도 자기 형제를 가혹하게 다스려서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들들’은 히브리어 남성 복수형을 직접 반영합니다.
    reason: cultural_note
  - marker: b
    text: ‘가혹하게’는 בְּפָרֶךְ의 강제 노동 맥락을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  english_pob_choice: you may pass them on as an inheritance
  chosen_korean: 유업으로 물려주어
  alternatives_korean:
  - 상속으로 넘겨주어
  - 상속 재산으로 삼아
  lexicon: HALOT
  rationale: 히트파엘 형태의 נחל은 단순 소유가 아니라 상속을 통해 다음 세대로 넘기는 법적 행위를 나타내므로, 한국어에서는 ‘유업으로 물려주다’가 가장 자연스럽고 의미도 보존합니다.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  english_pob_choice: to your sons after you
  chosen_korean: 너희 뒤의 아들들에게
  alternatives_korean:
  - 너희 뒤의 자녀들에게
  - 너희 뒤에 올 아들들에게
  lexicon: HALOT
  rationale: 원문은 분명히 복수 남성형 ‘아들들’을 쓰므로 이를 유지하고, ‘after you’는 상속 순서를 드러내는 ‘너희 뒤의’로 옮겼습니다.
- source_word: לְעֹלָם
  english_pob_choice: permanently
  chosen_korean: 영원한 소유가 되게
  alternatives_korean:
  - 영구한 소유가 되게
  - 계속되는 소유가 되게
  lexicon: HALOT
  rationale: 법률 문맥의 עוֹלָם은 계약적·제도적 지속성을 뜻하므로, ‘영원히’보다 ‘영원한 소유’가 한국어 법률문체에서 더 직접적으로 전달합니다.
- source_word: בָּהֶם תַּעֲבֹדוּ
  english_pob_choice: from them you may exact labor
  chosen_korean: 그것들로 일을 시킬 수 있으나
  alternatives_korean:
  - 그것들로 노동을 요구할 수 있으나
  - 그들로 하여금 일하게 할 수 있으나
  lexicon: HALOT
  rationale: עבד는 여기서 강제적 노동을 뜻하므로, 완곡한 ‘사용하다’보다 ‘일을 시키다’가 지배·노역의 현실을 드러냅니다.
- source_word: לֹא תִרְדֶּה בוֹ בְּפָרֶךְ
  english_pob_choice: no man shall rule over his brother harshly
  chosen_korean: 누구도 자기 형제를 가혹하게 다스려서는 안 됩니다.
  alternatives_korean:
  - 누구도 자기 형제를 잔혹하게 다스려서는 안 됩니다.
  - 누구도 자기 형제를 포학하게 지배해서는 안 됩니다.
  lexicon: HALOT
  rationale: רדה는 ‘다스리다/지배하다’의 뜻을 가지므로 ‘다스리다’로 살리고, בְּפָרֶךְ의 강압적 잔혹성을 ‘가혹하게’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 내부의 호칭을 남성 친족어로 유지할지 여부
  chosen_reading: ‘형제들, 곧 이스라엘 자손들’로 유지했습니다.
  alternative_readings:
  - 동족들, 곧 이스라엘 사람들
  - 이스라엘 백성들
  rationale: 원문은 남성 친족어를 통해 언약 공동체 내부의 법적 연대를 강조하므로, 이를 중성화하지 않고 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 노예/종 언어를 어떻게 드러낼지
  chosen_reading: 소유와 노동 강제를 드러내되, 본문이 말하는 관계의 가혹함은 완화하지 않았습니다.
  alternative_readings:
  - 더 완곡한 봉사 언어로 정리
  - 단순 고용 관계처럼 표현
  rationale: 본문은 상속 가능한 소유와 노동 부과를 함께 말하므로, 이를 부드럽게 바꾸면 사회적·윤리적 무게가 사라집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
