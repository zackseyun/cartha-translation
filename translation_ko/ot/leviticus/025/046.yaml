review_pass:
  verdict: revise
  source_fidelity: 초안은 상속·지속적 소유·노동 부과 및 이스라엘 형제에게 가혹하게 다스리는 일을 금하는 대조를 대체로 보존합니다. 그러나 사람을 가리키는 히브리어 남성 복수 대명사를 ‘그것들’로 옮긴 것은 부정확하며, 소유·강제 노동이라는 본문의 표현도 불필요하게 비인격적이고 어색해집니다. לְעֹלָם은 이 법적 문맥에서 ‘대대로’로 옮겨 지속적·세습적 성격을 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘너희 뒤의 아들들’보다 ‘너희 뒤에 올 아들들’이 현대 표준어에서 자연스럽습니다. 또한 ‘그것들로 일을 시키다’는 사람을 대상으로 한 문맥에 맞지 않으므로 ‘그들에게 일을 시키다’로 고쳐야 합니다. 각주 표지는 해당 표현 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘형제들, 곧 이스라엘 자손들’과 ‘가혹하게 다스리다’는 원문의 친족어와 בְּפָרֶךְ의 가혹성을 적절히 반영합니다. ‘소유 재산’은 אֲחֻזָּה의 재산적·법적 의미를 보존하며, 본문의 역사적으로 불편한 소유 관계를 완화하지 않습니다.
  issues:
  - severity: high
    issue: 사람을 가리키는 대명사를 ‘그것들’로 번역함
    rationale: אֹתָם 및 בָּהֶם은 앞 절의 사람들(비이스라엘계 종들)을 가리킵니다. 한국어 ‘그것들’은 사물을 가리키므로 지시 대상과 문체가 모두 부정확합니다.
  - severity: medium
    issue: ‘영원한 소유가 되게’가 법적·세습적 소유의 구문을 다소 모호하게 함
    rationale: לָרֶשֶׁת אֲחֻזָּה לְעֹלָם은 후대 아들들이 상속받아 지속적으로 소유하는 법적 상태를 말합니다. ‘대대로 소유 재산으로 삼게’가 이 관계를 더 분명히 드러냅니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: 각주 a는 ‘아들들’에, 영어 감사 기록의 각주 b에 상응하는 설명은 ‘형제들/이스라엘 자손들’에 붙여 독자가 무엇을 설명하는지 즉시 알 수 있게 해야 합니다.
