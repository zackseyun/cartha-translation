revisions:
- from: 너희는 그것들을 너희 뒤의 아들들에게 유업으로 물려주어 영원한 소유가 되게 할 수 있습니다. 너희는 그것들로 일을 시킬 수 있으나, 너희 형제들, 곧 이스라엘 자손들 사이에서는 누구도 자기 형제를 가혹하게 다스려서는 안 됩니다.[a][b]
  to: 너희는 그들을 너희 뒤에 올 아들들에게[a] 상속 재산으로 물려주어, 그들이 대대로 소유 재산으로 삼게 할 수 있습니다. 그들에게 일을 시킬 수 있습니다. 그러나 너희 형제들, 곧 이스라엘 자손들[b]에 대해서는, 누구도 자기 형제를 가혹하게 다스려서는 안 됩니다.
  rationale: 사람을 사물처럼 가리키는 ‘그것들’을 ‘그들’로 바로잡고, 상속 및 대대적 소유의 법적 의미를 더 자연스러운 한국어로 명시했습니다. 또한 원문의 대조와 금지 명령, 친족어 및 가혹한 지배의 의미를 유지했으며, 각주 내용과 표지 위치를 원어 및 영어 감사 기록에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
