id: LEV.25.50
reference: Leviticus 25:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
  footnotes:
  - marker: a
    text: Or, 'from the year of his sale to him.' The Hebrew expression can be rendered more formally, but the context indicates that the man had sold himself into service.
    reason: lexical_alternative
  - marker: b
    text: Or, 'like the days of a hired laborer.' The comparison indicates that the valuation is to be reckoned as hired service rather than perpetual ownership.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기에게서 그것을 산 사람과 함께, 자기가 그에게 몸값을 받고 팔린 해부터 희년의 해까지 계산해야 합니다. 그리고 그 매매가는 해의 수에 따라 정해져야 하며, 품꾼의 날들처럼 그와 함께 있어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 팔린 해부터’입니다. 히브리어 표현은 좀 더 형식적으로 옮길 수 있지만, 문맥상 그 사람은 스스로 몸을 팔아 들어간 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘품꾼의 날들처럼’입니다. 이 비교는 그 값을 영구 소유가 아니라 품삯 노동에 준해 산정하라는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  english_pob_choice: He shall calculate
  chosen_korean: 계산해야 합니다
  alternatives_korean:
  - 헤아려야 합니다
  - 산정해야 합니다
  lexicon: HALOT
  rationale: 법적·금전적 정산 맥락에서 חשב는 단순한 ‘생각하다’보다 금액을 산정하는 뜻이므로, 현대 한국어의 ‘계산하다’가 가장 분명합니다.
- source_word: קֹנֵהוּ
  english_pob_choice: his buyer
  chosen_korean: 자기에게서 그것을 산 사람
  alternatives_korean:
  - 그의 구매자
  - 그를 산 사람
  lexicon: HALOT
  rationale: 직역식 소유 표현보다 행위 주체를 풀어 주어, 매매 관계를 분명하게 드러내면서도 본문의 거래성을 유지했습니다.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  english_pob_choice: from the year he sold himself to him
  chosen_korean: 자기가 그에게 몸값을 받고 팔린 해부터
  alternatives_korean:
  - 그가 그에게 스스로 팔린 해부터
  - 그에게 팔린 해부터
  lexicon: HALOT
  rationale: 히브리어의 수동형/명사형 구조가 문맥상 자기매매를 가리키므로, 그 긴장을 살리되 한국어에서는 자연스럽게 ‘몸값을 받고 팔린’으로 풀었습니다.
- source_word: כֶּסֶף מִמְכָּרוֹ
  english_pob_choice: the price of his sale
  chosen_korean: 그 매매가
  alternatives_korean:
  - 그의 판매값
  - 그의 매매 가격
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘돈/은’이지만 여기서는 거래 금액을 뜻하므로, POB의 의미를 따라 법률 용어로 자연스러운 ‘매매가’로 옮겼습니다.
- source_word: כִּימֵי שָׂכִיר
  english_pob_choice: like the days of a hired worker
  chosen_korean: 품꾼의 날들처럼
  alternatives_korean:
  - 고용된 일꾼의 날들처럼
  - 품삯 받는 사람의 날들처럼
  lexicon: HALOT
  rationale: 시적 비교를 살리기 위해 ‘~처럼’ 구조를 유지했고, שָׂכִיר는 고정된 ‘품꾼’이 가장 간결하게 대응합니다.
theological_decisions:
- issue: 자기매매와 신분 묘사
  chosen_reading: ‘자기가 그에게 몸값을 받고 팔린 해부터’로 옮겨, 단순한 고용이 아니라 부채 상환을 위한 자기매매라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘자기가 그에게 팔린 해부터’
  - ‘그에게 종으로 팔린 해부터’
  rationale: 본문과 POB 주해는 이 관계가 자발적 고용이 아니라 제한된 기간의 자기매매임을 전제하므로, 그 신분적 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 레 25:39-55의 희년 규례, 출애굽기·레위기의 종신 소유가 아닌 기간 제한 봉사 개념
