  source_fidelity: 초안의 ‘자기에게서 그것을 산 사람’은 사람을 가리키는 목적어를 ‘그것’으로 처리하여 원문의 קֹנֵהוּ(그를 산 사람)를 잘못 옮겼습니다. 또한 ‘몸값을 받고’는 히브리어에 명시되지 않은 내용을 보태며, 마지막 절은 ‘품꾼의 날들’이라는 기간 비교가 한국어에서 어색하고 수식 관계가 불분명합니다. 수정문은 수동형 ‘팔린’을 유지하여 본문의 표현상 여지를 보존하면서 문맥을 과도하게 명시화하지 않습니다.
  naturalness: ‘그를 산 사람’, ‘그가 그에게 팔린 해’, ‘그가 그와 함께 있는 기간’은 현대 표준어의 격 관계와 지시 대상을 분명히 합니다. ‘품꾼의 기간과 같아야 합니다’는 히브리어의 ‘품꾼의 날들처럼’이 나타내는 제한된 봉사 기간의 비교를 자연스럽게 전달합니다.
  terminology: קֹנֵהוּ는 ‘그를 산 사람’으로, כֶּסֶף מִמְכָּרוֹ는 거래 금액이라는 뜻을 살린 ‘그가 팔린 값’으로 옮겼습니다. שָׂכִיר의 통상적 성격을 반영하여 ‘품꾼’을 유지했습니다. ‘희년’은 정착된 성서 용어이므로 유지합니다.
