id: LEV.25.55
reference: Leviticus 25:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' or ''the children of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my servants.' The Hebrew term denotes bonded service; 'slaves' is used here because the verse emphasizes Israel's belonging to the LORD rather than to human masters.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 내 종들입니다[a]. 그들은 내가 이집트 땅에서 이끌어 낸 내 종들입니다[b]. 나는 너희의 하나님 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘의 자손들’. 히브리어는 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내 종들’을 반복하여, 이스라엘이 야훼께 속한 이들이라는 점을 강조합니다.
    reason: repetition_emphasis
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용구를 살리되, 현대 한국어에서 가장 자연스럽고 성경적 울림이 있는 대응으로 옮겼습니다.
- source_word: עֲבָדִים / עֲבָדַי
  english_pob_choice: my slaves / my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 노예들
  - 내 종
  lexicon: HALOT
  rationale: 영어 POB의 최종 보류가 ‘servants’였고, 히브리어 עבד는 여기서 소유권보다 언약적 소속을 강조합니다. 한국어에서는 ‘종’이 ‘노예’보다 지나친 현대적 함의를 덜 불러오면서도 종속·소속의 힘을 유지합니다.
- source_word: הוֹצֵאתִי
  english_pob_choice: whom I brought out
  chosen_korean: 내가 ... 이끌어 낸
  alternatives_korean:
  - 내가 ... 데리고 나온
  - 내가 ... 이끌어 낸
  lexicon: HALOT
  rationale: 출애굽 공식 표현을 살리기 위해 ‘이끌어 내다’를 택했습니다. 단순한 이동이 아니라 구출과 해방의 뉘앙스를 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 학문적 음역인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: '''עֲבָדִים''의 한국어 강도와 언약적 소속의 균형'
  chosen_reading: ‘내 종들’로 번역하여 종속성과 소속을 함께 드러냈습니다.
  alternative_readings:
  - 내 노예들
  - 내 종
  rationale: 문맥은 이스라엘이 인간 주인에게 속하지 않고 야훼께 속한다는 점을 강조합니다. ‘노예들’은 현대 한국어에서 지나치게 특정한 사회사적 이미지를 불러올 수 있어, 본문의 신학적 초점을 유지하면서도 과도한 전이 효과를 줄이는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested bonded-status terms
