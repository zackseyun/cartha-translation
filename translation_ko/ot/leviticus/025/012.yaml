  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
  footnotes:
  - marker: a
    text: Or 'its yield' or 'its crops.' The Hebrew term refers to what the field brings forth.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 희년이기 때문입니다. 희년은 여러분에게 거룩한 것이어야 합니다. 여러분은 밭에서 그 소출을 먹어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소출’은 ‘수확물’ 또는 ‘산물’로도 옮길 수 있으며, 밭이 내는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  english_pob_choice: jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 쥬빌리
  - 희년(정관사 없이)
  lexicon: HALOT
  rationale: 레위기 25장에서는 단순한 ‘나팔’이 아니라 특별한 해를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘희년’으로 옮기는 것이 원문 의미를 가장 정확하게 드러냅니다.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  english_pob_choice: it shall be holy to you
  chosen_korean: 그것은 여러분에게 거룩해야 합니다
  alternatives_korean:
  - 그것은 여러분에게 성스럽게 되어야 합니다
  - 그것은 여러분에게 성별되어야 합니다
  lexicon: HALOT
  rationale: קֹדֶשׁ의 핵심은 ‘거룩함’이므로, 교회적 관용보다 원문 어감을 살려 ‘거룩하다’로 옮겼습니다. ‘여러분에게’는 복수 수신자를 반영합니다.
- source_word: תְּבוּאָתָהּ
  english_pob_choice: its produce
  chosen_korean: 소출
  alternatives_korean:
  - 산출물
  - 산물
  - 열매
  lexicon: HALOT
  rationale: 이 단어는 밭이 내는 수확물 전체를 가리키므로, 농경 문맥에 자연스럽고 범위가 넓은 ‘소출’이 적절합니다.
theological_decisions:
- issue: 희년의 거룩함을 제도적 ‘특별함’보다 언약적 거룩으로 유지할지 여부
  chosen_reading: ‘희년’ 자체가 ‘여러분에게 거룩해야 합니다’로 진술되므로, 해를 단순한 사회 제도나 휴무가 아니라 하나님께 구별된 기간으로 읽습니다.
  alternative_readings:
  - 그것은 여러분에게 특별해야 합니다
  - 그것은 여러분을 위해 구별되어야 합니다
  rationale: 원문은 קֹדֶשׁ를 사용해 희년의 성격을 규정하므로, 의미를 약화시키지 않고 ‘거룩’ 용어를 유지하는 것이 본문에 충실합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
