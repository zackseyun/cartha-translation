id: LEV.25.29
reference: Leviticus 25:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
  footnotes:
  - marker: a
    text: Hebrew 'for days'; in this legal idiom, the phrase denotes a full year's duration.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 성벽으로 둘러싸인 성읍 안의 주거용 집을 팔면, 그 집의 속량은 팔린 날로부터 한 해가 차기까지 할 수 있습니다. 그 속량권은 한 해 동안 유효합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘날들’은 이 법률 관용구에서 ‘한 해’의 기간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יִמְכֹּר
  english_pob_choice: If a man sells
  chosen_korean: 사람이 ... 팔면
  alternatives_korean:
  - 만일 한 남자가 ... 판다면
  - 어떤 사람이 ... 판다면
  lexicon: HALOT
  rationale: 법조문 도입부의 조건문을 한국어 합쇼체 법문체로 자연스럽게 옮기되, 대표성 있는 ‘사람이’로 성별 표지의 과잉을 피하지 않으면서도 문맥을 살렸습니다.
- source_word: בֵּית מוֹשַׁב עִיר חוֹמָה
  english_pob_choice: a house for dwelling in a walled city
  chosen_korean: 성벽으로 둘러싸인 성읍 안의 주거용 집
  alternatives_korean:
  - 성벽으로 둘러싸인 성읍의 집
  - 성읍 안의 거주 집
  lexicon: HALOT
  rationale: מוֹשָׁב의 ‘거주/주거’ 의미와 עִיר חוֹמָה의 ‘성벽 도시’ 의미를 모두 드러내기 위해 ‘주거용 집’과 ‘성벽으로 둘러싸인 성읍’을 결합했습니다.
- source_word: גְּאֻלָּתוֹ
  english_pob_choice: its redemption may be made / its right of redemption shall last
  chosen_korean: 속량은 ... 속량권
  alternatives_korean:
  - 구속은 ... 구속권
  - 되찾을 수 있는 권리는 ... 되찾을 권리
  lexicon: HALOT
  rationale: 법률적 맥락의 גְּאֻלָּה를 ‘속량’으로 유지하고, 뒤에서는 기간을 지닌 권리로 풀어 ‘속량권’이라 옮겨 원문의 법적 긴장을 살렸습니다.
- source_word: יָמִים תִּהְיֶה גְאֻלָּתוֹ
  english_pob_choice: its right of redemption shall last for days, that is, a full year
  chosen_korean: 한 해 동안 유효합니다
  alternatives_korean:
  - 며칠 동안입니다
  - 날수로는 한 해입니다
  - 한 해가 되도록 지속됩니다
  lexicon: HALOT
  rationale: ‘날들’이 관용적으로 한 해를 뜻하는 점을 한국어 독자에게 자연스럽게 전달하되, 법문체의 기간 표현으로 ‘유효합니다’를 사용했습니다.
theological_decisions:
- issue: 유대 율법의 속량 규정 표현
  chosen_reading: ‘속량’과 ‘속량권’을 유지해 법적·신학적 핵심 개념을 보존했습니다.
  alternative_readings:
  - ‘구속’
  - ‘되찾음’
  rationale: 본절은 토지/가옥의 법적 회수 절차를 다루므로, 일반적 ‘구속’보다 법률적이고 문맥 적합한 ‘속량’이 원문의 제도적 의미를 더 잘 드러냅니다.
  doctrine_reference: 레위기 25장 속량 규정
- issue: ‘하루이틀’이 아니라 ‘한 해’라는 관용
  chosen_reading: ‘한 해 동안 유효합니다’로 풀어 יָמִים의 관용적 기간 의미를 반영했습니다.
  alternative_readings:
  - ‘날들 동안입니다’
  - ‘한 해입니다’
  rationale: 히브리어 관용구의 법적 기간 의미를 보존하면서도 한국어 문장으로는 명료하게 전달해야 하므로, 설명적이지만 과도하지 않은 표현을 택했습니다.
  doctrine_reference: 레위기 25:29의 법률 관용어
