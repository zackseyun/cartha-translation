lexical_decisions:
- source_word: כְּשָׂכִיר
  english_pob_choice: like a hired worker
  chosen_korean: 품꾼처럼
  alternatives_korean:
  - 고용인처럼
  - 임금노동자처럼
  - 삯일꾼처럼
  lexicon: HALOT
  rationale: שָׂכִיר는 임금을 받고 고용된 노동자를 가리키므로, 신분 대비를 살리면서도 현대 한국어에서 자연스러운 ‘품꾼’으로 옮겼습니다.
- source_word: כְּתוֹשָׁב
  english_pob_choice: like a sojourner
  chosen_korean: 거류민처럼
  alternatives_korean:
  - 나그네처럼
  - 체류자처럼
  - 거주 외국인처럼
  lexicon: HALOT
  rationale: תוֹשָׁב는 이스라엘 가운데 거주하는 비토착 거주자를 뜻하므로, 아치즘인 ‘나그네’보다 법적·사회적 범주가 드러나는 ‘거류민’을 택했습니다.
- source_word: יִהְיֶה עִמָּךְ
  english_pob_choice: he shall be with you
  chosen_korean: 너희와 함께 있어야 합니다
  alternatives_korean:
  - 너희와 함께 있을 것입니다
  - 너희와 함께해야 합니다
  lexicon: HALOT
  rationale: 상태를 나타내는 יהיה עםך를 한국어의 자연스러운 서술로 풀어, 관계적 동반 상태를 분명하게 했습니다.
- source_word: יַעֲבֹד עִמָּךְ
  english_pob_choice: he shall serve with you
  chosen_korean: 너희와 함께 일해야 합니다
  alternatives_korean:
  - 너희를 섬겨야 합니다
  - 너희와 함께 섬겨야 합니다
  - 너희를 위해 일해야 합니다
  lexicon: HALOT
  rationale: עבד는 여기서 강제노예노동보다 규정된 노동을 뜻하므로, ‘섬기다’보다 ‘일하다’가 문맥상 더 정확하며, 반복되는 함께 있음의 관계를 살려 ‘너희와 함께’로 옮겼습니다.
theological_decisions:
- issue: 고용 노동자와 거류민의 법적 지위
  chosen_reading: 본문의 대비를 살려, 이스라엘 동족의 임시 고용 상태를 강조하고 노예화 뉘앙스는 피했습니다.
  alternative_readings:
  - 그는 종처럼…
  - 그는 노예처럼…
  rationale: 문맥이 레위기 25장 39-43절에서 매매 노예와 구별되는 보호받는 노동 관계를 규정하므로, 이를 훼손하는 번역은 피해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the source text''s plain sense without importing doctrinal claims.'
