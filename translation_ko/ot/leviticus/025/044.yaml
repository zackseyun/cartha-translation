base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male slave and your female slave who may belong to you[a], from the nations that are around you[b], from them you may buy a male slave and a female slave.
  footnotes:
  - marker: a
    text: Or 'your slave and your female servant'; Hebrew distinguishes male and female terms here, and the main text uses 'slave' because purchase and ownership are explicit in the context.
    reason: lexical_alternative
  - marker: b
    text: '''Nations'' refers to the non-Israelite peoples around Israel; alternatively, ''from among the peoples around you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너에게 속하게 될 남자 노예와 여자 노예를 너의 주변에 있는 민족들에게서, 곧 그들 가운데서 사들일 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדְּךָ / אֲמָתְךָ
  english_pob_choice: your male slave / your female slave
  chosen_korean: 남종과 여종
  alternatives_korean:
  - 종과 여종
  - 남자 종과 여자 종
  - 노예와 여종
  lexicon: HALOT
  rationale: 히브리어가 남성과 여성을 구분하는 짝을 이루며, 매매 맥락이므로 ‘종’보다 신분의 종속성을 드러내는 ‘남종/여종’이 자연스럽습니다.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  english_pob_choice: who may belong to you
  chosen_korean: 너희에게 속하게 될 자들
  alternatives_korean:
  - 너희 소유가 될 자들
  - 너희 것이 될 자들
  - 너희에게 속할 자들
  lexicon: HALOT
  rationale: 미래적 소속과 법적 귀속을 함께 드러내되, 소유 개념을 지나치게 강하게 현대화하지 않도록 ‘속하게 될’로 옮겼습니다.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  english_pob_choice: from the nations that are around you
  chosen_korean: 너희 주변에 있는 민족들 가운데서
  alternatives_korean:
  - 너희를 둘러싼 이방 민족들 가운데서
  - 주변의 민족들로부터
  - 너희 주위의 나라들 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 이스라엘 주변의 비이스라엘 집단을 가리키므로, 신약적 색채가 강한 ‘이방인’보다 ‘민족들’이 문맥에 더 적합합니다.
- source_word: תִּקְנוּ
  english_pob_choice: you may buy
  chosen_korean: 사들이십시오 / 살 수 있습니다
  alternatives_korean:
  - 사십시오
  - 구입할 수 있습니다
  - 사실 수 있습니다
  lexicon: HALOT
  rationale: 문맥상 명령이 아니라 허용 조항이므로 ‘may buy’의 의미를 살려 앞절은 합쇼체 요청형, 뒤절은 가능형으로 자연스럽게 나누었습니다.
- source_word: עֶבֶד וְאָמָה
  english_pob_choice: a male slave and a female slave
  chosen_korean: 남종과 여종
  alternatives_korean:
  - 남자 종과 여자 종
  - 노예와 여노예
  - 종과 여종
  lexicon: HALOT
  rationale: 끝부분의 일반적/분배적 병렬은 앞의 짝과 대응하므로, 한국어에서는 중복을 줄이면서도 성 구분을 유지하는 표현이 가장 명료합니다.
theological_decisions:
