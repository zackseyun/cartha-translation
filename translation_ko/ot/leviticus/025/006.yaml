  source_fidelity: 초안은 שַׁבַּת הָאָרֶץ를 문맥상 ‘안식년 산물’로 옮긴 점과 종·여종·삯꾼의 구별을 대체로 반영한 점은 적절합니다. 그러나 הַגָּרִים עִמָּךְ를 ‘너희에 거류하는 나그네’로 옮긴 것은 한국어 문법상 부자연스럽고, ‘너희와 함께 거주하는’이라는 관계를 정확히 드러내지 못합니다.
  naturalness: ‘너희에 거류하는’은 현대 표준 한국어에서 쓰이지 않는 결합입니다. 또한 ‘너희와 너희 종과 …의 먹을 것’이라는 연결은 이해할 수 있으나, ‘너희 자신과 …을 위한 먹을 것’으로 풀면 법문으로서 더 자연스럽고 열거의 범위도 분명해집니다.
  terminology: ‘안식년 산물’은 이 문맥에서 안식 중인 땅이 내는 소산을 가리키므로 안전한 번역입니다. עֶבֶד/אָמָה의 성별 구별은 ‘남자 종/여자 종’으로 명시하고, שָׂכִיר는 종과 구별되는 ‘고용된 일꾼’으로, תּוֹשָׁב는 ‘거류민’으로 옮겼습니다. ‘거류민’의 뜻은 각주로 보완합니다.
