    rationale: 원문은 עַבְדְּךָ와 אֲמָתֶךָ를 구별합니다. ‘종’과 ‘여종’도 관습적으로 구별되지만, 현대 독자가 성별 대조를 분명히 알 수 있도록 ‘남자 종’과 ‘여자 종’으로 옮기는 편이 안전합니다.
