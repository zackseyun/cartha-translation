revisions:
- from: 그 땅의 안식년 산물이 너희와 너희 종과 너희 여종과 너희 삯꾼과 너희에 거류하는 나그네의 먹을 것이 되리라.
  to: 그 땅의 안식년 산물은 너희의 먹을 것이 될 것이다. 곧 너희 자신과 너희 남자 종과 너희 여자 종과 너희와 함께 거주하는 고용된 일꾼과 거류민[a]을 위한 것이다.
  rationale: 문맥상 땅의 안식년 동안 저절로 난 소산을 뜻하는 ‘안식년 산물’을 유지했습니다. 열거된 사회적 범주를 보존하되, 마지막 수식어를 ‘너희와 함께 거주하는’으로 고쳐 원문의 관계와 현대 한국어 문법을 모두 반영했습니다. 거류민이라는 용어의 역사적·사회적 의미는 본문에 과도하게 덧붙이지 않고 각주에서만 간략히 밝혔습니다.
