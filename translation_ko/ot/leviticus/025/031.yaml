id: LEV.25.31
reference: Leviticus 25:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
  footnotes:
  - marker: a
    text: Literally, 'shall be reckoned as the field of the land,' meaning these village houses are treated legally like rural land rather than like houses in a walled city.
    reason: lexical_alternative
  - marker: b
    text: Or 'and in the Jubilee it shall go out'—that is, the property reverts in the Jubilee year.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 성벽이 없는 마을의 집들은 그 땅의 밭처럼 여겨져야 합니다[a]. 그들에게는 속량이 가능하며[b], 희년에는 풀려나야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅의 밭으로 계산되어야 한다’는 뜻으로, 성벽 도시의 집과 달리 시골 마을의 집은 법적으로 농지 범주에 속해 취급됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게는 속량의 권리가 있다’—즉, 이 재산은 희년까지 되찾을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  english_pob_choice: the houses of the villages
  chosen_korean: 성벽이 없는 마을의 집들
  alternatives_korean:
  - 촌락의 집들
  - 마을들의 집들
  lexicon: HALOT
  rationale: חֲצֵרִים는 문맥상 성벽으로 둘러싸이지 않은 촌락/마을을 가리키므로, ‘마을’로 옮기되 다음 절의 ‘성벽이 없는’ 설명을 반영해 의미를 분명히 했습니다.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  english_pob_choice: shall be regarded as the fields of the land
  chosen_korean: 그 땅의 밭처럼 여겨져야 합니다
  alternatives_korean:
  - 그 땅의 밭으로 계산되어야 합니다
  - 그 땅의 들판으로 여겨져야 합니다
  lexicon: HALOT
  rationale: 법적 분류를 나타내는 יֵחָשֵׁב를 ‘여겨지다’로 풀고, 문맥상 성벽 도시의 집이 아니라 농경지 범주에 속한다는 점을 ‘밭’으로 자연스럽게 반영했습니다.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  english_pob_choice: redemption shall be available for them
  chosen_korean: 그들에게는 속량이 가능하며
  alternatives_korean:
  - 그들에게는 구속권이 있으며
  - 그들에게는 속량의 권리가 있습니다
  lexicon: HALOT
  rationale: גְּאֻלָּה는 단순한 추상 개념이 아니라 되찾을 수 있는 권리를 가리키므로, 문맥에 맞게 ‘속량이 가능하다’로 옮겨 법적 가능성을 살렸습니다.
- source_word: וּבַיֹּבֵל יֵצֵא
  english_pob_choice: and in the Jubilee they shall go out
  chosen_korean: 희년에는 풀려나야 합니다
  alternatives_korean:
  - 희년에는 나가야 합니다
  - 희년에는 돌아가게 됩니다
  lexicon: HALOT
  rationale: יֵצֵא의 직역인 ‘나가다’보다 이 조항의 법적 효과인 해방/반환을 드러내는 ‘풀려나다’가 문맥을 더 정확히 전달합니다.
theological_decisions:
- issue: 희년의 법적 효과를 한국어에서 어떻게 드러낼지
  chosen_reading: 희년에는 소유가 원래 상태로 해방·반환되는 법적 제도로 이해되도록 ‘풀려나다’로 표현했습니다.
  alternative_readings:
  - 희년에는 나가야 합니다
  - 희년에는 되돌아갑니다
  rationale: 히브리어 יֵצֵא는 문자적으로 ‘나가다’이지만, 레위기 25장의 제도적 문맥에서는 임의적 이동이 아니라 해방과 원상회복을 뜻하므로 법적 의미를 우선했습니다.
  doctrine_reference: 레위기 25장 희년 규례
- issue: ‘גְּאֻלָּה’의 신학적·법적 뉘앙스
  chosen_reading: ‘속량’으로 옮겨, 단순한 매매 취소가 아니라 친족-법적 회복의 의미를 보존했습니다.
  alternative_readings:
  - 구속
  - 되찾음
  rationale: 이 절의 גְּאֻלָּה는 성경적 구속 어휘와 연결되지만, 여기서는 재산 회복의 법적 장치를 가리키므로 한국어 ‘속량’이 가장 적절합니다.
  doctrine_reference: 레위기 25장 속량 규정
