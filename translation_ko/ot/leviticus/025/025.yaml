base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
  footnotes:
  - marker: a
    text: Or, 'his nearest kinsman-redeemer may come and redeem.' The Hebrew term refers to a close relative with the right and duty to reclaim family property.
    reason: lexical_alternative
  - marker: b
    text: '''Inherited property'' refers to a hereditary family landholding within Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 네 형제가 가난해져서 자기 소유의 일부를 팔게 되면, 그에게 가장 가까운 그의 구속자가 와서 그의 형제가 판 것을 속량해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문맥의 ‘소유’는 이스라엘 지파 분배 체계 안에서의 가족 토지 소유를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘속량하다’는 단순히 돈을 주고 사는 것이 아니라, 친족의 권리와 책임으로 되찾는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  english_pob_choice: becomes poor
  chosen_korean: 가난해져서
  alternatives_korean:
  - 가난하게 되면
  - 빈곤해지면
  lexicon: HALOT
  rationale: 경제적으로 궁핍해지는 상태를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מֵאֲחֻזָּתוֹ
  english_pob_choice: some of his inherited property
  chosen_korean: 자기 소유의 일부
  alternatives_korean:
  - 상속받은 땅의 일부
  - 유산된 소유의 일부
  lexicon: HALOT
  rationale: 아후짜는 이 문맥에서 가족 몫의 토지 소유를 가리키지만, 한국어 본문은 지나친 해설을 줄이고 본문의 법률적 핵심인 ‘소유의 일부’를 간결하게 드러냈습니다.
- source_word: גֹאֲלוֹ
  english_pob_choice: his redeemer
  chosen_korean: 그의 구속자
  alternatives_korean:
  - 그의 속량자
  - 그의 친족 구속자
  lexicon: HALOT
  rationale: גאל의 친족-구속 의무를 살리되, 한국어에서 법적·신학적 울림이 있는 ‘구속자’를 채택했습니다.
- source_word: וְגָאַ֕ל
  english_pob_choice: redeem
  chosen_korean: 속량해야 합니다
  alternatives_korean:
  - 구속해야 합니다
  - 되사야 합니다
  lexicon: HALOT
  rationale: 단순한 재매입보다 친족이 책임을 지고 되찾는 법적 의미를 살리기 위해 ‘속량하다’를 사용했습니다.
theological_decisions:
- issue: 구속자(גֹאֵל) 용어의 보존
  chosen_reading: ‘구속자’로 옮겨 친족이 가진 회복 책임과 법적 권리를 함께 드러냈습니다.
  alternative_readings:
  - ‘속량자’
  - ‘친족 구속자’
  rationale: 본문은 단순한 상거래가 아니라 가족 토지의 회복이라는 언약적 법리를 말하므로, 평이한 ‘사주다’보다 신학적·법적 함의를 지닌 용어가 더 적절합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
