revisions:
- from: 네 형제가 가난해져서 자기 소유의 일부를 팔게 되면, 그에게 가장 가까운 그의 구속자가 와서 그의 형제가 판 것을 속량해야 합니다.[a][b]
  to: 너의 형제가 가난해져 자기 소유지의 일부[a]를 팔면, 그와 가장 가까운 친족인 구속자[b]가 와서 그 형제가 판 것을 속량합니다.
  rationale: 본문은 히브리어의 가족 토지 보유와 가까운 친족의 속량 역할을 명료하게 보존하되, 원문이 이 구절에서 확정하지 않는 절대적 강제 양태는 피했습니다. 주석 표지를 해당 단어에 직접 연결하고, 주석의 내용을 원문의 문화적·어휘적 의미에 맞게 정정했습니다.
  reviewer_model: gpt-5.6-terra
