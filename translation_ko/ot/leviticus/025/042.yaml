  source_fidelity: ‘그러므로’는 앞 절의 법을 근거로 설명하는 히브리어 כִּי의 방향을 반대로 전환합니다. ‘~이기 때문입니다’로 옮겨 근거 제시를 보존해야 합니다. 또한 מִמְכֶּרֶת עָבֶד는 일반적인 노예 매매의 방식이라는 뜻이므로 ‘노예 매매 방식으로’가 정확하고 자연스럽습니다.
