source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my slaves[a], whom I brought out from the land of Egypt[b]; they shall not be sold as slaves are sold.
  footnotes:
  - marker: a
    text: Or, 'my servants.' The Hebrew עֲבָדַי can be rendered either way, but 'slaves' is used here because the verse emphasizes ownership and prohibits sale as ordinary slave property.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they shall not be sold with the sale of a slave,' that is, not in the manner of an ordinary slave transaction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내가 이집트 땅에서 이끌어 낸 나의 노예들이기 때문입니다. 그들은 노예 매매 방식으로 팔려서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘노예의 매매로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  english_pob_choice: my slaves
  chosen_korean: 내 노예들
  alternatives_korean:
  - 내 종들
  - 내 종
  - 내 종된 자들
  lexicon: HALOT
  rationale: 소유와 속박 상태가 핵심이므로, 완화된 ‘종’보다 ‘노예’가 영어 POB의 선택과 מקור의 힘을 더 직접적으로 반영합니다.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: whom I brought out from the land of Egypt
  chosen_korean: 내가 이집트 땅에서 이끌어 낸
  alternatives_korean:
  - 내가 이집트 땅에서 데리고 나온
  - 내가 이집트 땅에서 구해 낸
  lexicon: HALOT
  rationale: 출애굽 관용구를 살리면서도 법문체에 맞게 ‘이끌어 내다’로 옮겼습니다.
- source_word: לֹא יִמָּכְרוּ מִמְכֶּרֶת עָבֶד
  english_pob_choice: they shall not be sold as slaves are sold
  chosen_korean: 노예를 파는 것처럼 팔려서는 안 됩니다
  alternatives_korean:
  - 노예처럼 팔려서는 안 됩니다
  - 노예의 매매 방식대로 팔려서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어는 ‘노예의 매매’라는 일반적 노예 거래 방식 자체를 가리키므로, 한국어에서도 같은 거래 양식을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 소유권이 근거가 되는 ‘내 노예들’의 표현
  chosen_reading: 하나님께 속한 백성의 신분을 분명히 드러내기 위해 ‘노예들’을 유지했습니다.
  alternative_readings:
  - 내 종들
  - 내 소유된 자들
  rationale: 이 절은 이스라엘이 애굽에서 해방되었다는 사실을 근거로 인간을 일반 노예 상품처럼 다루지 못하게 합니다. 따라서 완화된 표현보다 소유·속박의 긴장을 보존하는 번역이 본문의 논지를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status terminology policy
