  terminology: עֲבָדַי는 이 문맥에서 하나님의 소유권과 이스라엘의 예속 신분이 논지의 근거이므로 ‘나의 노예들’이 적절합니다. ‘이집트 땅에서 이끌어 낸’도 출애굽 관용구를 충실히 반영합니다.
