  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
  footnotes:
  - marker: a
    text: Or 'according to the number of crops he sells to you.' The Hebrew תְּבוּאוֹת can be rendered 'crops,' 'produce,' or 'harvests.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 해의 수가 많을수록 너희는 그 매입가를 더 올려야 하고, 그 해의 수가 적을수록 너희는 그 매입가를 더 낮춰야 합니다. 왜냐하면 그는 너희에게 일정한 수확의 수를 팔고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘매입가’는 히브리어 מִקְנָה의 거래상 가치에 초점을 둔 번역입니다. 문맥상 ‘매입된 것의 값’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  english_pob_choice: in proportion to
  chosen_korean: ~에 따라 / ~수록
  alternatives_korean:
  - ~에 비례하여
  - ~에 맞추어
  lexicon: HALOT
  rationale: 이 관용구는 단순한 ‘according to’보다 비례 관계를 드러내므로, 한국어에서는 반복 구조의 ‘~수록’으로 가격 조정의 비례성을 자연스럽게 살렸습니다.
- source_word: מִקְנָתוֹ
  english_pob_choice: its purchase price
  chosen_korean: 매입가
  alternatives_korean:
  - 구매값
  - 구입 가격
  - 매수 금액
  lexicon: HALOT
  rationale: 문맥이 ‘남은 해수에 따라 값을 산정하는’ 법률 조항이므로, ‘매입가’가 거래 가격의 뜻을 간결하게 전달합니다.
- source_word: מִסְפַּר תְּבוּאֹת
  english_pob_choice: a number of harvests
  chosen_korean: 일정한 수확의 수
  alternatives_korean:
  - 몇 해의 수확
  - 수확의 수
  - 몇 번의 추수
  lexicon: HALOT
  rationale: תְּבוּאוֹת는 ‘수확/산출물’의 뜻이므로, 가격 산정의 기준이 되는 생산 기간을 한국어로 분명히 보이도록 했습니다.
- source_word: הוּא מֹכֵר לָךְ
  english_pob_choice: he is selling to you
  chosen_korean: 그는 너희에게 … 팔고 있기 때문입니다
  alternatives_korean:
  - 그가 너희에게 … 팔기 때문입니다
  - 그는 너희에게 … 팝니다
  lexicon: HALOT
  rationale: 히브리어 분사는 현재 진행/일반 현재의 설명력을 가지므로, 법 조항의 이유절답게 ‘팔고 있기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: 법률 문체에서의 인칭과 반복
  chosen_reading: 직설적 법문체를 유지해 가격 산정의 조건-결과 구조를 분명히 드러냈습니다.
  alternative_readings:
  - 더 완곡한 설명체
  - 전통적 성경체 어순
  rationale: 이 절은 신학적 은유보다 거래 규정이 핵심이므로, 독자가 계산 원리를 즉시 이해하도록 현대 한국어 법률문체를 택했습니다.
  doctrine_reference: 토라의 사회·경제 규정 해석
