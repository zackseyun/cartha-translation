  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
  footnotes:
  - marker: a
    text: Or 'according to the number of crops he sells to you.' The Hebrew תְּבוּאוֹת can be rendered 'crops,' 'produce,' or 'harvests.'
    reason: lexical_alternative
translation:
  language: ko
  text: 햇수가 많을수록 너는 매입 가격을 더 높여야 하고, 햇수가 적을수록 매입 가격을 더 낮춰야 합니다. 이는 그가 너에게 수확 횟수[a]를 파는 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּבוּאוֹת는 ‘수확물’, ‘소출’, 또는 ‘수확’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
