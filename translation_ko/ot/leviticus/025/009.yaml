source:
  edition: WLC
  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
  footnotes:
  - marker: a
    text: 'Hebrew: ''shofar''; that is, a horn trumpet, traditionally often understood as a ram''s horn.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Day of Atonement' is literally 'day of atonements' (plural).
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 일곱째 달[a], 곧 그 달의 열째 날[b]에 나팔 울림을 내십시오. 속죄일에 너희는 온 땅에 나팔을 불어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 shofar는 관악기인 ‘나팔’을 가리키며, 전통적으로는 숫양의 뿔나팔로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘달의 열째 날’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ / תַּעֲבִירוּ
  english_pob_choice: sound / sound
  chosen_korean: 나팔 울림을 내십시오 / 나팔을 불어야 합니다
  alternatives_korean:
  - 나팔 소리를 내십시오
  - 나팔을 울리십시오
  - 나팔을 불게 하십시오
  lexicon: HALOT
  rationale: 히필 עבר는 문자적으로는 ‘지나가게 하다’이지만, שׁוֹפָר와 결합하면 관용적으로 나팔 소리를 내는 뜻이므로, 한국어에서는 ‘울림을 내다/불다’로 자연스럽게 옮겼습니다.
- source_word: שׁוֹפַר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 쇼파르
  - 양각나팔
  - 트럼펫
  lexicon: HALOT
  rationale: POB가 영어로는 접근성을 위해 trumpet을 택한 점을 반영하되, 히브리어 культ적 악기라는 점을 살리기 위해 한국어 성경에서 자연스러운 ‘나팔’을 사용했습니다.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי / בֶּעָשׂוֹר לַחֹדֶשׁ
  english_pob_choice: in the seventh month / on the tenth day of the month
  chosen_korean: 일곱째 달 / 그 달의 열째 날
  alternatives_korean:
  - 일곱째 달에 / 달의 열째 날에
  - 일곱째 달의 열흘째 날
  - 일곱째 달, 그 달의 열째 날
  lexicon: HALOT
  rationale: 히브리어의 시점 표지를 현대 한국어에서 간결하고 분명하게 전달하기 위해 ‘일곱째 달’, ‘그 달의 열째 날’로 구성했습니다.
- source_word: בְּיוֹם הַכִּפֻּרִים
  english_pob_choice: On the Day of Atonement
  chosen_korean: 속죄일에
  alternatives_korean:
  - 속죄의 날에
  - 속죄일 날에
  - 속죄제의 날에
  lexicon: HALOT
  rationale: 문맥상 מדובר하는 것은 절기 명칭이므로, 관용적으로 정착된 ‘속죄일’로 옮기되, 히브리어 복수형의 뉘앙스는 과도하게 문자화하지 않았습니다.
- source_word: בְּכָל אַרְצְכֶם
  english_pob_choice: throughout all your land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 나라에
  - 너희의 모든 땅에
  - 전 땅에
  lexicon: HALOT
  rationale: 분배적 범위를 간결하게 드러내기 위해 ‘온 땅에’로 옮겼습니다. 공동체 소유 영역 전체를 가리키는 맥락을 한국어에서 자연스럽게 전달합니다.
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים의 절기 명칭 처리
  chosen_reading: 속죄일
  alternative_readings:
  - 속죄의 날
  - 속죄들의 날
  rationale: 히브리어 형태는 복수이지만, 실제 지시 대상은 이스라엘의 정규 절기명입니다. 한국어 본문에서는 전통적이면서도 의미가 분명한 절기명 ‘속죄일’을 사용하고, 복수형 뉘앙스는 주석 없이 본문을 어색하게 만들지 않도록 처리했습니다.
  doctrine_reference: Translation philosophy §1, §6
