id: LEV.25.22
reference: Leviticus 25:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
  footnotes:
  - marker: a
    text: Or 'old produce' at both occurrences of 'the old.' The Hebrew simply says 'old,' with 'produce' understood from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째 해에 씨를 뿌리고, 묵은 소산을 먹다가 아홉째 해, 그 소산이 들어오기까지는 묵은 것을 먹어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘묵은 소산’을 두 곳 모두에 옮길 수 있습니다. 히브리어는 문자 그대로 ‘묵은 것’이라고만 말하며, ‘소산’은 문맥에서 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  english_pob_choice: you shall sow
  chosen_korean: 씨를 뿌리고
  alternatives_korean:
  - 뿌리며
  - 파종하고
  lexicon: HALOT
  rationale: 법적·지시적 문맥이므로 단순 과거가 아니라 명령/예정의 뉘앙스로 풀었고, 농경 표현은 자연스러운 한국어인 ‘씨를 뿌리다’를 택했습니다.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  english_pob_choice: the eighth year
  chosen_korean: 여덟째 해
  alternatives_korean:
  - 제8년
  - 여덟 해
  lexicon: HALOT
  rationale: 히브리어의 서수 표현을 한국어 관용에 맞게 ‘여덟째 해’로 옮겨 법규 문체를 유지했습니다.
- source_word: מִן הַתְּבוּאָה יָשָׁן ... תֹּאכְלוּ יָשָׁן
  english_pob_choice: from the old produce ... you shall eat the old
  chosen_korean: 묵은 소산을 먹다가 ... 묵은 것을 먹어야 합니다
  alternatives_korean:
  - 오래된 소산을 먹다가 ... 오래된 것을 먹어야 합니다
  - 묵은 수확을 먹다가 ... 묵은 것을 먹어야 합니다
  lexicon: HALOT
  rationale: POB가 ‘old’의 반복을 살린 것처럼, ‘묵은’으로 반복을 유지하되 한국어에서 자연스러운 대상명사 ‘소산/것’을 보충해 의미를 드러냈습니다.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  english_pob_choice: until its produce comes in
  chosen_korean: 그 소산이 들어오기까지는
  alternatives_korean:
  - 그 소산이 들어올 때까지는
  - 그 수확이 들어오기까지는
  lexicon: HALOT
  rationale: בּוֹא의 ‘오다/들어오다’ 이미지를 살려, 저장된 곡물이 시장/창고에 들어와 식용 가능해지는 상황을 ‘들어오기’로 표현했습니다.
theological_decisions:
- issue: 반복되는 ‘묵은’의 유지
  chosen_reading: 두 번째 ‘묵은 것’을 옮길 때도 처음의 ‘묵은 소산’과 같은 어근을 유지했습니다.
  alternative_readings:
  - ‘오래된 것’으로 바꾸어 더 매끄럽게 처리함
  - 한쪽만 ‘묵은 소산’으로 두고 다른 쪽은 생략함
  rationale: 히브리어는 같은 형용사를 반복하여 이전 저장분을 계속 소비하는 상황을 강조하므로, 반복을 약화시키지 않도록 같은 한국어 어근을 유지했습니다.
  doctrine_reference: 본문의 문학적 강조를 보존하는 번역 원리
