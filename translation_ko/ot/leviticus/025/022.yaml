    rationale: תְּבוּאָתָהּ의 여성 단수 접미사는 바로 앞의 ‘아홉째 해’를 가리킵니다. 한국어에서는 ‘그 해의 소산’으로 밝혀 주는 편이 자연스럽고 정확합니다.
  revised_text: 여덟째 해에 씨를 뿌리고 묵은 소산을 먹을 것이며, 아홉째 해가 되어 그 해의 소산이 들어올 때까지 묵은 것을 먹을 것입니다.[a]
