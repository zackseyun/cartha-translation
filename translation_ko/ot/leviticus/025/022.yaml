- from: 여덟째 해에 씨를 뿌리고, 묵은 소산을 먹다가 아홉째 해, 그 소산이 들어오기까지는 묵은 것을 먹어야 합니다.[a]
  to: 여덟째 해에 씨를 뿌리고 묵은 소산을 먹을 것이며, 아홉째 해가 되어 그 해의 소산이 들어올 때까지 묵은 것을 먹을 것입니다.[a]
