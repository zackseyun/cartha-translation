id: LEV.25.27
reference: Leviticus 25:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ אֶת שְׁנֵ֣י מִמְכָּר֔/וֹ וְ/הֵשִׁיב֙ אֶת הָ֣/עֹדֵ֔ף לָ/אִ֖ישׁ אֲשֶׁ֣ר מָֽכַר ל֑/וֹ וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/027.yaml
  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
  footnotes:
  - marker: a
    text: Or 'the remainder' or 'the excess.' The Hebrew refers to the amount left over after calculating the value of the unused years.
    reason: lexical_alternative
  - marker: b
    text: '''His property'' refers to his landed possession, likely his hereditary holding within Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 매매 연수를 계산하고 그 남자에게 그 남자에게 판 것의 남은 값을 돌려주며, 자기 소유로 돌아가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 계산 후 남는 금액, 곧 ‘남은 것’ 또는 ‘초과분’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소유’는 이 문맥에서 이스라엘의 세습적 토지 보유를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  english_pob_choice: then he shall calculate
  chosen_korean: 그는 ... 계산하고
  alternatives_korean:
  - 그리고 ... 계산하고
  - 그러면 ... 셈하고
  lexicon: HALOT
  rationale: 법적 절차의 순서를 드러내기 위해 연결어를 넣되, 현대 한국어에서는 과도한 직역보다 자연스러운 ‘계산하다’를 택했습니다.
- source_word: שְׁנֵי מִמְכָּרוֹ
  english_pob_choice: the years since its sale
  chosen_korean: 그 매매 연수
  alternatives_korean:
  - 그 판매의 해수
  - 팔린 뒤의 연수
  lexicon: HALOT
  rationale: 히브리어는 매매와 관련된 경과 연수를 가리키므로, ‘매매 연수’로 간결하게 옮겨 법정 계산의 의미를 살렸습니다.
- source_word: הָעֹדֵף
  english_pob_choice: the surplus
  chosen_korean: 남은 값
  alternatives_korean:
  - 초과분
  - 잔여분
  lexicon: HALOT
  rationale: 문맥이 토지 환매 가격의 정산이므로 단순한 ‘남은 것’이 아니라 금전적 잔액임을 드러내기 위해 ‘남은 값’으로 옮겼습니다.
- source_word: לַאֲחֻזָּתוֹ
  english_pob_choice: to his property
  chosen_korean: 자기 소유로
  alternatives_korean:
  - 자기 재산으로
  - 그의 기업으로
  lexicon: HALOT
  rationale: 아후주다는 단순 재산보다 세습적 토지 소유를 가리키지만, 본문에서는 독자성이 드러나면서도 무겁지 않은 ‘소유’로 번역했습니다.
theological_decisions:
- issue: אֲחֻזָּה의 법적-신학적 뉘앙스
  chosen_reading: ‘소유’로 풀되, 혈연 공동체 안의 토지 귀속이라는 배경을 완전히 지우지 않는 방식으로 번역했습니다.
  alternative_readings:
  - ‘유산’
  - ‘세습 소유지’
  rationale: 이 구절은 일반 재산 회복이 아니라 이스라엘 땅 분배 질서의 회복을 전제하므로, 본문은 간결하게 유지하되 용어 선택에서 그 배경을 보존했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
