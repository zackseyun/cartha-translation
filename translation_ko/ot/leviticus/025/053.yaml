  source_fidelity: 첫 문장의 ‘연로 고용인’은 히브리어 שָׂכִיר(품삯을 받고 일하는 사람, 고용된 일꾼)를 잘못 옮긴 것으로, ‘연로’는 ‘나이가 많음’을 뜻하여 원문의 의미와 맞지 않습니다. 또한 문맥상 두 번째 절의 주어는 그를 사들인 사람을 가리키므로 이를 밝혀 주는 것이 적절합니다. ‘해마다’, ‘가혹하게’, ‘당신의 눈앞에서’는 각각 שָׁנָה בְּשָׁנָה, בְּפֶרֶךְ, לְעֵינֶיךָ를 충실히 반영합니다.
  naturalness: ‘고용된 일꾼처럼’은 현대 표준어에서 자연스럽고, 법규적 문맥에도 맞습니다. 두 절을 ‘그 이스라엘 사람’과 ‘그를 사들인 사람’으로 구분하면 한국어의 대명사 반복으로 생길 수 있는 주어 혼동을 피할 수 있습니다.
  terminology: שָׂכִיר는 ‘종’보다 ‘고용된 일꾼/품꾼’이 적절합니다. רדה와 בְּפֶרֶךְ의 결합은 ‘가혹하게 다스리다’로 유지할 수 있습니다. 본문은 소유 형태를 규정하는 표현이 아니라 고용된 일꾼에 비유한 처우 기준을 제시하므로, ‘노예’ 같은 확대된 표현은 피합니다.
