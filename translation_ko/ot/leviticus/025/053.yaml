translation:
  language: ko
  text: 그 이스라엘 사람은 해마다 고용된 일꾼처럼 그와 함께 있어야 합니다. 그를 사들인 사람은 당신의 눈앞에서 그를 가혹하게 다스려서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘품삯을 받고 일하는 사람처럼, 해마다 그와 함께 있어야 합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂכִיר
  english_pob_choice: Like a hired worker
  chosen_korean: 연로 고용인처럼
  alternatives_korean:
  - 고용된 일꾼처럼
  - 품삯을 받고 일하는 사람처럼
  lexicon: HALOT
  rationale: כִּ marks 비교이고 שׂכיר는 ‘품삯을 받는 사람, 고용인’이므로, 단순한 종이 아니라 계약된 노동자로서의 지위를 드러내는 쪽이 적절합니다. 한국어에서는 ‘고용인’이 비교적 간결하고, ‘연로’는 문맥상 ‘hired’의 성격을 자연스럽게 옮깁니다.
- source_word: שָׁנָה בְּשָׁנָה
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 년년이
  - 한 해 한 해
  lexicon: HALOT
  rationale: 반복·분배를 나타내는 관용구이므로, 한국어에서는 ‘해마다’가 가장 자연스럽고 간결하게 연속성을 살립니다.
- source_word: לֹא יִרְדֶּנּוּ
  english_pob_choice: he shall not rule over him
  chosen_korean: 그를 ... 다스려서는 안 됩니다
  alternatives_korean:
  - 그를 지배해서는 안 됩니다
  - 그를 군림해서는 안 됩니다
  lexicon: HALOT
  rationale: רדה의 기본 의미인 ‘다스리다/통치하다’를 살리되, 이 문맥의 금지는 폭압적 지배를 막는 뜻이므로 한국어에서는 ‘가혹하게 다스리다’로 결합해 과도한 권력 행사를 드러냈습니다.
- source_word: בְּפֶרֶךְ
  english_pob_choice: harshly
  chosen_korean: 가혹하게
  alternatives_korean:
  - 혹독하게
  - 잔인하게
  lexicon: HALOT
  rationale: 페레크는 강제노동적 성격의 ‘가혹함, 잔혹함’을 뜻하므로, 문장 흐름상 가장 자연스럽고 강도도 충분한 ‘가혹하게’를 선택했습니다.
- source_word: לְעֵינֶיךָ
  english_pob_choice: in your sight
  chosen_korean: 당신의 눈앞에서
  alternatives_korean:
  - 당신의 눈에 보이는 곳에서
  - 당신이 보는 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 눈에’이지만, 한국어 법문체에서는 ‘눈앞에서’가 감시·가시성의 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: שׂכיר의 사회적 지위 표현
  chosen_reading: ‘고용인’으로 옮겨, 본절이 전제하는 종속 상태를 유지하되 노예적 소유 개념을 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 종
  - 품꾼
  rationale: 영어 POB가 hired worker를 택한 것처럼, כאן의 핵심은 매매된 이스라엘 친족의 보호 규정입니다. 한국어에서도 고용 관계의 비교를 살리면 본문의 법적 완충 장치가 더 분명해집니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; legal-text precision'
