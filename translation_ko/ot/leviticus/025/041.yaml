reference: Leviticus 25:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
  footnotes:
  - marker: a
    text: Or 'his family'; the Hebrew term can denote a wider kin-group or clan.
    reason: lexical_alternative
  - marker: b
    text: Or 'the possession of his fathers' or 'his ancestral property.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 그의 아들들은 함께 너에게서 나갈 것이며, 그는 자기 씨족으로[a] 돌아가고 조상들의 소유지로[b] 돌아갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 가족’. 히브리어는 더 넓은 친족 집단이나 씨족을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 조상들의 소유’ 또는 ‘그의 조상에게서 물려받은 재산’. 히브리어는 특히 세습된 토지 보유지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא ... מֵעִמָּךְ
  english_pob_choice: shall go out from you
  chosen_korean: 너희에게서 나가야 하며
  alternatives_korean:
  - 너희에게서 떠나야 하며
  - 너희 곁을 떠나야 하며
  - 너희의 섬김에서 풀려나야 하며
  lexicon: WLC + HALOT
  rationale: 본문의 핵심 동사는 구체적인 ‘나가다’이며, POB의 ‘go out’을 따라 법적 상황을 지나치게 풀어 쓰지 않고 한국어로도 직접적으로 살렸습니다.
- source_word: הוּא וּבָנָיו עִמּוֹ
  english_pob_choice: he and his sons with him
  chosen_korean: 그와 그의 아들들도 그와 함께
  alternatives_korean:
  - 그와 그의 자녀들도 그와 함께
  - 그와 함께 있는 그의 아들들도
  lexicon: WLC + HALOT
  rationale: 히브리어의 남성 복수 בָּנָיו를 반영해 ‘아들들’로 옮겼고, 가족 단위를 완화하지 않고 관계의 동행을 자연스럽게 표현했습니다.
- source_word: מִשְׁפַּחְתּוֹ
  english_pob_choice: his clan
  chosen_korean: 자기의 종족
  alternatives_korean:
  - 자기의 가족
  - 자기의 친족 집단
  - 자기의 씨족
  lexicon: HALOT
  rationale: 이 문맥의 מִשְׁפָּחָה는 단순한 핵가족보다 넓은 친족 집단을 가리키므로, 현대 한국어에서는 ‘종족’이 공동체적·계보적 범위를 비교적 잘 드러냅니다.
- source_word: אֲחֻזַּת אֲבֹתָיו
  english_pob_choice: the property of his fathers
  chosen_korean: 자기 조상의 소유
  alternatives_korean:
  - 자기 조상들의 소유
  - 자기 조상의 유산
  - 조상 대대로의 소유
  lexicon: HALOT
  rationale: אֲחֻזָּה의 토지·상속적 소유 개념을 살리되, 한국어에서는 ‘소유’가 가장 간결하게 대응하며 ‘조상’으로 세대적 계승을 드러냈습니다.
theological_decisions:
- issue: 토지·혈통의 회복 강조
  chosen_reading: 그는 자기의 종족으로 돌아가고 자기 조상의 소유로 돌아가야 합니다
  alternative_readings:
  - 그는 자기 가족으로 돌아가고 자기 아버지들의 소유로 돌아가야 합니다
  rationale: 본 절은 단순한 이동이 아니라 희년 체제 안에서 친족 공동체와 상속 소유로의 복귀를 말하므로, ‘돌아가다’를 반복해 회복의 구조를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
- issue: 남성 친족어의 보존
  chosen_reading: 아들들
  alternative_readings:
  - 자녀들
  rationale: 히브리어가 분명히 남성 복수형을 사용하므로, 계보·상속 문맥을 흐리지 않도록 성중립화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
