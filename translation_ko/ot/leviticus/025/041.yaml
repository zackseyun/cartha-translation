  naturalness: ‘그와 그의 아들들도 그와 함께’는 ‘그’의 반복으로 한국어 문장이 어색합니다. ‘그와 그의 아들들은 함께’로 정리하고, 법조문적 미래 표현은 ‘나갈 것이며/돌아갈 것입니다’가 ‘나가야 하며’보다 원문의 순차적 미래를 더 직접적으로 반영합니다.
  terminology: מִשְׁפָּחָה는 ‘씨족’으로, אֲחֻזָּה는 토지·세습 보유의 뜻을 드러내는 ‘소유지’로 옮깁니다. בָנָיו의 남성 복수는 ‘아들들’로 유지합니다.
