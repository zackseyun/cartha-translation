reference: Leviticus 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
  footnotes:
  - marker: a
    text: Or 'a Sabbath of solemn rest.' The Hebrew expression intensifies the idea of complete cessation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 일곱째 해에는 땅을 위한 온전한 안식의 안식일이 있어야 합니다. 그것은 야훼께 드리는 안식일입니다. 당신은 밭에 씨를 뿌려서는 안 되며, 포도원을 가지치기해서도 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엄숙한 안식의 안식일’입니다. 히브리어 표현은 완전한 중지를 더 강하게 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  english_pob_choice: But in the seventh year
  chosen_korean: 그러나 일곱째 해에는
  alternatives_korean:
  - 그리고 일곱째 해에는
  - 일곱째 해에는
  lexicon: HALOT
  rationale: 앞 절의 여섯 해 동안의 경작 허용과 대비되는 전환이므로 ‘그러나’로 역접을 살리고, 해 단위의 법령 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: שַׁבַּת שַׁבָּתוֹן
  english_pob_choice: a sabbath of complete rest
  chosen_korean: 온전한 안식의 안식일
  alternatives_korean:
  - 완전한 안식의 안식일
  - 엄숙한 안식의 안식일
  lexicon: HALOT
  rationale: 겹말 구조가 안식을 강하게 강조하므로 ‘온전한 안식’으로 강도를 살리되, ‘안식일’의 반복을 유지해 원문의 강조를 반영했습니다.
- source_word: יִהְיֶה לָאָרֶץ
  english_pob_choice: there shall be ... for the land
  chosen_korean: 땅을 위한
  alternatives_korean:
  - 땅에 대한
  - 땅에게 주어지는
  lexicon: HALOT
  rationale: 히브리어의 ‘땅을 위해/땅에 대해’라는 관계를 한국어에서는 ‘땅을 위한’으로 간결하게 풀어, 안식의 수혜 대상을 분명히 했습니다.
- source_word: לַיהוָה
  english_pob_choice: a sabbath to Yahweh
  chosen_korean: 야훼께 드리는
  alternatives_korean:
  - 야훼를 위한
  - 여호와께 드리는
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮기고, ל의 헌납적 방향을 ‘-께 드리는’으로 살렸습니다.
- source_word: שָׂדְךָ לֹא תִזְרָע
  english_pob_choice: You shall not sow your field
  chosen_korean: 당신은 밭에 씨를 뿌려서는 안 되며
  alternatives_korean:
  - 당신은 밭을 씨 뿌려서는 안 되며
  - 당신은 밭에 파종해서는 안 되며
  lexicon: HALOT
  rationale: 법문체의 직접 명령을 현대 한국어의 공손한 금지형으로 옮기고, זרע는 농경 맥락에 맞게 ‘씨를 뿌리다’로 풀었습니다.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  english_pob_choice: and you shall not prune your vineyard
  chosen_korean: 포도원을 가지치기해서도 안 됩니다
  alternatives_korean:
  - 포도원을 전정해서도 안 됩니다
  - 포도원을 손질해서도 안 됩니다
  lexicon: HALOT
  rationale: זמר는 포도원 맥락에서 ‘가지치기/전정’이 적절하므로, 일반 독자에게도 이해되는 ‘가지치기’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역어
  chosen_reading: ‘야훼’로 직역합니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 유지해 언약명 자체를 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
