  naturalness: ‘나는 너희 하나님 야훼이시니’는 1인칭 주어 ‘나는’과 존대 서술어 ‘이시니’의 호응이 맞지 않으며, 문체도 목표인 현대 합쇼체와 일치하지 않습니다. ‘애굽’은 현대 표준어 성경 번역에서 가능하지만, 일반 현대어로는 ‘이집트’가 더 자연스럽습니다.
  terminology: יְהוָה는 방침과 영어 감사 기록에 따라 ‘야훼’로 옮겼습니다. אֱלֹהֵיכֶם 및 언약 공식 לִהְיוֹת לָכֶם לֵאלֹהִים은 각각 ‘너희의 하나님’, ‘너희의 하나님이 되기 위해’로 번역하여 소유·언약 관계를 보존했습니다.
