  source_fidelity: ‘오십 년째 해’는 현대 한국어에서 어색하며 ‘제오십 년’이 히브리어의 ‘오십 번째 해’를 정확히 나타냅니다. 두 동사 모두 청중을 향한 명령/의무의 미래 표현이므로, 첫 절도 ‘선포해야 합니다’와 병렬되는 합쇼체 명령으로 정리하는 것이 원문에 더 충실합니다. אִישׁ의 분배성과 שוב의 반복은 ‘각자’와 ‘돌아가고 … 돌아가야 합니다’의 반복으로 보존했습니다.
