id: LEV.25.10
reference: Leviticus 25:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
  footnotes:
  - marker: a
    text: Or 'release' or 'freedom' for 'liberty' (Hebrew dror). The term refers to a formal proclamation of release in the Jubilee year.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man.' The masculine singular is distributive here, referring to each individual Israelite in the legal setting.
    reason: cultural_note
  - marker: c
    text: Or 'to his possession'; the Hebrew refers especially to an inherited property holding.
    reason: lexical_alternative
  - marker: d
    text: Or 'to his clan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 오십 년째 해를 거룩하게 하여, 그 땅의 모든 주민에게 자유를 선포해야 합니다. 그것은 너희에게 희년이 될 것이며, 너희는 각기 자기 소유로 돌아가고, 각기 자기 가족에게로 돌아가야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희년의 드로르는 공식적인 ‘석방’ 또는 ‘해방’의 선포를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 분배적 표현으로 ‘각 사람’의 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘소유지’로 옮길 수 있으며, 특히 상속받은 토지 보유를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘가문’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  english_pob_choice: you shall consecrate
  chosen_korean: 거룩하게 하여
  alternatives_korean:
  - 거룩하게 하십시오
  - 봉헌하여
  - 성별하여
  lexicon: HALOT
  rationale: קדשׁ의 사역형은 어떤 기간을 거룩한 용도로 구별하는 의미이므로, 현대 한국어에서는 '거룩하게 하다'가 가장 직접적이고 자연스럽습니다.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  english_pob_choice: the fiftieth year
  chosen_korean: 오십 년째 해
  alternatives_korean:
  - 쉰째 해
  - 오십 년
  - 오십 번째 해
  lexicon: HALOT
  rationale: 히브리어의 수-명사 결합은 의미상 '오십 년째 해'로 옮기는 것이 가장 자연스럽고, 희년 문맥의 법적 연도를 분명히 보여 줍니다.
- source_word: דְּרוֹר
  english_pob_choice: liberty
  chosen_korean: 자유
  alternatives_korean:
  - 해방
  - 석방
  - 면제
  lexicon: HALOT
  rationale: 드로르는 희년에서 공식적 석방과 회복을 선언하는 용어이므로, 본문에는 간결한 '자유'를 쓰고 의미는 문맥으로 살리는 것이 적절합니다.
- source_word: יוֹבֵל
  english_pob_choice: jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 쥬빌리
  - 대희년
  - 면제년
  lexicon: HALOT
  rationale: 레위기 25장에서는 יוֹבֵל이 기술 용어로 굳어져 있으므로, 한국어 성서 용례에 맞는 '희년'이 가장 정확합니다.
- source_word: אֵל יֹשְׁבֶיהָ
  english_pob_choice: to all its inhabitants
  chosen_korean: 그 땅의 모든 주민에게
  alternatives_korean:
  - 그 땅의 모든 거주자에게
  - 그 땅에 사는 모든 사람에게
  lexicon: HALOT
  rationale: 문맥상 '그 땅'은 약속의 땅을 가리키며, '주민'은 요שב의 거주자 의미를 자연스럽게 살립니다.
theological_decisions:
- issue: 형식상 남성 단수 אִישׁ의 처리
  chosen_reading: 각기
  alternative_readings:
  - 각 사람은
  - 각자
  - 각기 한 사람은
  rationale: אִישׁ은 법률 문맥에서 분배적으로 쓰인 남성 단수이지만, 한국어에서는 반복되는 '각기'로 분배 의미를 살리면서도 불필요한 성별 표지를 과도하게 드러내지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 두 차례의 שוב 반복
  chosen_reading: 돌아가고 ... 돌아가야 합니다
  alternative_readings:
  - 되돌아가고 ... 되돌아가야 합니다
  - 돌아오고 ... 돌아와야 합니다
  rationale: 히브리어의 반복 어근 שוב은 회복과 원상 회귀를 강조하므로, 본문에서 같은 동사 '돌아가다'를 반복해 그 리듬과 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
