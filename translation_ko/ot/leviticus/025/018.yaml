  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
  footnotes:
  - marker: a
    text: Or 'my decrees ... my ordinances.' The Hebrew distinguishes two legal terms, חֻקִּים and מִשְׁפָּטִים.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats ''do'': literally, ''and you shall do my statutes ... and my judgments you shall keep and do them.'''
    reason: lexical_alternative
  - marker: c
    text: That is, dwell in the promised land in safety.
    reason: cultural_note
translation:
  language: ko
  text: 너희는 나의 규례를 행하고 나의 법도를 지키며 그것들을 행하십시오[a]. 그러면 너희는 그 땅에서 안전하게 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘행하다’를 반복합니다. 직역하면 ‘너희는 나의 규례를 행하고, 나의 법도를 지키며, 그것들을 행하라’입니다. 또한 ‘규례’와 ‘법도’는 서로 다른 법률 용어입니다.
    reason: lexical_alternative
