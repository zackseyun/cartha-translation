- from: 너는 너를 위하여 칠 안식년, 곧 칠 년을 일곱 번 셈하라. 그러면 그 칠 안식년의 날들이 너에게 사십구 년이 됩니다.[a]
  to: 스스로를 위하여 일곱 안식년 주기를 세십시오[a], 곧 일곱 해를 일곱 번 세십시오. 그러면 그 일곱 안식년 주기의 기간은 사십구 년이 됩니다.
