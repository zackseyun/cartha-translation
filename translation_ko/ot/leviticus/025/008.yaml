id: LEV.25.8
reference: Leviticus 25:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
  footnotes:
  - marker: a
    text: Or 'seven weeks of years.' The Hebrew literally says 'seven sabbaths of years,' referring to seven seven-year cycles.
    reason: lexical_alternative
translation:
  language: ko
  text: 스스로를 위하여 일곱 안식년 주기를 세십시오[a], 곧 일곱 해를 일곱 번 세십시오. 그러면 그 일곱 안식년 주기의 기간은 사십구 년이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 해씩 일곱 주기’. 히브리어는 문자적으로 ‘해들의 일곱 안식’이라고 하며, 여기서는 일곱 해로 이루어진 일곱 주기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  english_pob_choice: You shall count for yourself
  chosen_korean: 너는 너를 위하여 셈하라
  alternatives_korean:
  - 너는 셈하라
  - 너는 너를 위해 세어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 계산이 아니라 정해진 기간을 의식적으로 헤아리는 뜻이어서, ‘너를 위하여’로 개인적·규정적 성격을 살렸습니다.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  english_pob_choice: seven sabbaths of years
  chosen_korean: 칠 안식년
  alternatives_korean:
  - 일곱 해의 안식일들
  - 일곱 번의 안식년
  lexicon: HALOT
  rationale: 직역하면 ‘해들의 안식일들’이지만, 문맥상 안식년 주기를 가리키므로 한국어에서는 의미가 분명한 ‘안식년’으로 옮기되 수량은 보존했습니다.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  english_pob_choice: seven years seven times
  chosen_korean: 곧 칠 년을 일곱 번
  alternatives_korean:
  - 칠 년, 일곱 번
  - 일곱 번의 칠 년
  lexicon: HALOT
  rationale: 히브리어의 반복적 배열을 따라 ‘칠 년을 일곱 번’으로 옮겨, 총 49년이라는 계산 구조를 드러냈습니다.
- source_word: וְהָיוּ לְךָ
  english_pob_choice: shall be for you
  chosen_korean: 너에게 … 됩니다
  alternatives_korean:
  - 너에게 …이 됩니다
  - 너에게 …가 됩니다
  lexicon: HALOT
  rationale: 결과를 나타내는 관용구이므로, 단순 연결보다 한국어에서 자연스러운 ‘…됩니다’로 수량의 귀결을 표현했습니다.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  english_pob_choice: forty-nine years
  chosen_korean: 사십구 년
  alternatives_korean:
  - 마흔아홉 해
  - 49년
  lexicon: HALOT
  rationale: 히브리어 수사는 성경 문체를 살려 한자어 수사로 옮기되, 현대 독자가 이해하도록 분명하게 표현했습니다.
theological_decisions:
- issue: ‘안식일들’의 직역 여부와 안식년 개념의 처리
  chosen_reading: 문자적 이미지는 ‘안식년’으로 기능적으로 옮기되, 본문의 주기는 7년 단위의 안식 기간임을 유지했습니다.
  alternative_readings:
  - ‘칠 안식일들의 해’처럼 더 직역하기
  - ‘일곱 주기의 해’로 의미 번역하기
  rationale: 본문은 주간 안식일이 아니라 토지 안식의 7년 주기를 말하므로, 한국어 독자가 오해하지 않도록 제도적 의미를 분명히 해야 합니다.
  doctrine_reference: 레위기 25장 안식년/희년 규례
