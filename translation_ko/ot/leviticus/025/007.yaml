  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
  footnotes:
  - marker: a
    text: Or 'all its yield shall be to eat.' The Hebrew expression is more literally 'all its produce shall be for eating.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희 가축과 너희 땅에 있는 들짐승을 위해서는 그 모든 소출이 먹을 것이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 소출은 먹을 것이 될 것이다.’ 히브리어 표현을 더 직역하면 ‘그 모든 소출이 먹기 위한 것이 될 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  english_pob_choice: for your livestock
  chosen_korean: 너희 가축을 위해서는
  alternatives_korean:
  - 너희 짐승을 위해서는
  - 너희 가축들을 위해서는
  lexicon: HALOT
  rationale: בְּהֵמָה는 여기서 소유된 가축 전체를 가리키므로, 일상적이고 범위를 잘 드러내는 ‘가축’을 택했습니다.
- source_word: לַחַיָּה
  english_pob_choice: for the wild animals
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생동물을 위해서는
  - 짐승을 위해서는
  lexicon: HALOT
  rationale: 가축과 대비되는 야생의 동물을 간명하게 드러내기 위해 ‘들짐승’을 사용했습니다.
- source_word: כָל תְּבוּאָתָהּ
  english_pob_choice: all its produce
  chosen_korean: 그 모든 소출
  alternatives_korean:
  - 그 모든 산출
  - 그 모든 소산
  lexicon: HALOT
  rationale: תְּבוּאָה는 땅에서 나는 산출을 뜻하므로, 농경 문맥에 맞고 ‘그 땅’의 소출임을 잘 드러내는 ‘소출’로 옮겼습니다.
- source_word: לֶאֱכֹל
  english_pob_choice: for food
  chosen_korean: 먹을 것이 될 것입니다
  alternatives_korean:
  - 먹기 위한 것이 될 것입니다
  - 먹을 것으로 될 것입니다
  lexicon: HALOT
  rationale: 부정사 לֶאֱכֹל의 목적/용도를 한국어에서 자연스럽게 드러내기 위해 ‘먹을 것이 될 것입니다’로 풀었습니다.
theological_decisions:
- issue: 이 절의 용도 표현(‘for food’)을 어떻게 살릴지
  chosen_reading: 소출이 가축과 들짐승에게 ‘먹을 것’이 되도록 지정된다는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘먹기 위해’라는 직역
  - 단순히 ‘먹을 것이다’로만 처리
  rationale: 이 문맥은 안식년 규정 안에서 땅의 산출이 인간만이 아니라 동물에게도 열려 있음을 말하므로, 단순 미래보다 지정/용도 뉘앙스를 살리는 편이 본문 의미에 가깝습니다.
  doctrine_reference: 레위기 25장 안식년 규례
