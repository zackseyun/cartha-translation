  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
  footnotes:
  - marker: a
    text: Literally, 'according to the number of years of produce/harvests.' The point is that the sale price is based on the number of crop-bearing years remaining until the next Jubilee, not on a permanent transfer of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 희년 후의 연수대로는 네가 네 동료에게서 사야 하고, 곡식의 연수대로는 그가 네게 팔아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘수확/소출의 해들에 따라’라는 뜻입니다. 여기서는 다음 희년까지 남은 곡식 생산 연수를 기준으로 가격이 정해진다는 점을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים
  english_pob_choice: according to the number of years
  chosen_korean: 연수대로는
  alternatives_korean:
