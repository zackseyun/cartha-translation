  lexicon: HALOT
  rationale: מִסְפָּר + ב는 기준/비례를 나타내므로, 가격 산정의 기준을 자연스럽게 드러내는 ‘연수대로’로 옮겼습니다.
- source_word: אַחַר הַיּוֹבֵל
