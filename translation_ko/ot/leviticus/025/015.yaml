  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
  footnotes:
  - marker: a
    text: Literally, 'according to the number of years of produce/harvests.' The point is that the sale price is based on the number of crop-bearing years remaining until the next Jubilee, not on a permanent transfer of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 희년 후의 햇수에 따라 너는 네 동료에게서 사야 하며, 소출을 낼 햇수에 따라 그는 네게 팔아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘소출의 햇수에 따라’라는 뜻입니다. 여기서는 다음 희년까지 남은 소출 생산 햇수를 기준으로 가격이 정해진다는 점을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים
  english_pob_choice: according to the number of years
  chosen_korean: 연수대로는
  alternatives_korean:
  - 년수에 따라
  - 해의 수대로는
  lexicon: HALOT
  rationale: מִסְפָּר + ב는 기준/비례를 나타내므로, 가격 산정의 기준을 자연스럽게 드러내는 ‘연수대로’로 옮겼습니다.
- source_word: אַחַר הַיּוֹבֵל
  english_pob_choice: after the Jubilee
  chosen_korean: 희년 후의
  alternatives_korean:
  - 희년 뒤의
  - 희년 다음의
  lexicon: HALOT
  rationale: יוֹבֵל은 레위기 25장의 제도 용어이므로 관용적으로 ‘희년’을 쓰되, 뒤따르는 시간 기준을 ‘후의’로 간결하게 살렸습니다.
- source_word: עֲמִיתֶךָ
  english_pob_choice: your fellow
  chosen_korean: 네 동료
  alternatives_korean:
  - 네 이웃
  - 네 동무
  - 네 동족
  lexicon: HALOT
  rationale: 법적·공동체적 상대를 가리키는 עָמִית의 기본값을 살려, 지나치게 정서적이거나 민족적으로 좁아지는 표현보다 ‘동료’가 적절합니다.
- source_word: שְׁנֵי תְבוּאֹת
  english_pob_choice: years of crops
  chosen_korean: 곡식의 연수대로
  alternatives_korean:
  - 소출의 연수대로
  - 수확 연수대로
  lexicon: HALOT
  rationale: 문자적으로는 ‘생산/수확의 해들’이므로, 남은 경작 가능 연수를 기준으로 한 가격 책정을 드러내기 위해 ‘곡식의 연수대로’로 옮겼습니다.
theological_decisions:
- issue: 토지 매매의 영구 양도 여부를 암시하는 경제법 표현
  chosen_reading: 본문의 초점은 토지의 영구 이전이 아니라 희년까지 남은 생산 연수에 따라 거래 가격을 산정하는 데 있습니다.
  alternative_readings:
  - 단순한 기간 할인 규정으로만 읽기
  - 토지 소유권 이전 규정으로 읽기
  rationale: POB의 주해 취지에 따라, 원문의 경제적 기준과 희년 제도의 신학적 제약을 함께 보이도록 했습니다.
  doctrine_reference: 레위기 25장의 희년 규정
