  chosen_reading: 본문의 초점은 토지의 영구 이전이 아니라 희년까지 남은 생산 연수에 따라 거래 가격을 산정하는 데 있습니다.
  alternative_readings:
  - 단순한 기간 할인 규정으로만 읽기
  - 토지 소유권 이전 규정으로 읽기
  rationale: POB의 주해 취지에 따라, 원문의 경제적 기준과 희년 제도의 신학적 제약을 함께 보이도록 했습니다.
  doctrine_reference: 레위기 25장의 희년 규정
