  - 희년 다음의
  lexicon: HALOT
  rationale: יוֹבֵל은 레위기 25장의 제도 용어이므로 관용적으로 ‘희년’을 쓰되, 뒤따르는 시간 기준을 ‘후의’로 간결하게 살렸습니다.
- source_word: עֲמִיתֶךָ
  english_pob_choice: your fellow
  chosen_korean: 네 동료
  alternatives_korean:
  - 네 이웃
  - 네 동무
  - 네 동족
  lexicon: HALOT
  rationale: 법적·공동체적 상대를 가리키는 עָמִית의 기본값을 살려, 지나치게 정서적이거나 민족적으로 좁아지는 표현보다 ‘동료’가 적절합니다.
- source_word: שְׁנֵי תְבוּאֹת
  english_pob_choice: years of crops
  chosen_korean: 곡식의 연수대로
  alternatives_korean:
  - 소출의 연수대로
  - 수확 연수대로
  lexicon: HALOT
  rationale: 문자적으로는 ‘생산/수확의 해들’이므로, 남은 경작 가능 연수를 기준으로 한 가격 책정을 드러내기 위해 ‘곡식의 연수대로’로 옮겼습니다.
theological_decisions:
