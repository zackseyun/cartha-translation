id: LEV.25.26
reference: Leviticus 25:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
  footnotes:
  - marker: a
    text: Or 'has no kinsman-redeemer.' The Hebrew גֹּאֵל often refers to a near relative with the duty or right to redeem family property.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his hand attains.' This Hebrew idiom refers to a person's means becoming sufficient.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어떤 사람에게 속량자[a]가 없고 그의 형편이 넉넉해져[b] 그가 그것을 속량하는 데 필요한 만큼을 마련하면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가까운 친족 속량자’입니다. 히브리어 גֹּאֵל은 흔히 가족의 토지를 되사 가족 소유로 회복할 의무나 권리를 지닌 가까운 친족을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손이 미친다’입니다. 이 히브리어 관용구는 그 사람의 재산적 형편이 충분해졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: But if a man
  chosen_korean: 그러나 만일 어떤 사람
  alternatives_korean:
  - 그리고 만일 어떤 사람
  - 그러나 만일 한 남자가
  lexicon: HALOT
  rationale: 법조문 문맥에서 조건을 여는 접속부는 한국어로 ‘그러나 만일’이 자연스럽고, אִישׁ의 성별 표시는 본문을 흐리지 않는 범위에서 ‘어떤 사람’으로 옮겼습니다.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  english_pob_choice: has no redeemer
  chosen_korean: 속량할 자가 없고
  alternatives_korean:
  - 속량자가 없고
  - 구속자가 없고
  - 가까운 친족 속량자가 없고
  lexicon: HALOT
  rationale: גֹּאֵל은 문맥상 가족의 권리와 의무를 지닌 ‘redeemer’이므로, 법적 기능을 살려 ‘속량할 자’로 옮겼습니다.
- source_word: וְהִשִּׂיגָה יָדוֹ
  english_pob_choice: his hand attains enough
  chosen_korean: 그의 손이 능히 미치고
  alternatives_korean:
  - 그의 손이 미치고
  - 그의 형편이 충분해지고
  - 그의 손이 능해지고
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘그의 손이 미치다’는 재정적 능력이 충분해짐을 뜻하므로, 직역의 질감을 살리면서 한국어로도 자연스럽게 표현했습니다.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  english_pob_choice: and he finds sufficient means for his redemption
  chosen_korean: 그가 자기 속량에 필요한 만큼을 얻으면
  alternatives_korean:
  - 그가 자기 속량에 충분한 것을 얻으면
  - 그가 속량에 필요한 만큼을 찾으면
  - 그가 속량에 넉넉한 것을 얻게 되면
  lexicon: HALOT
  rationale: כְּדֵי는 ‘~에 충분한/필요한 만큼’의 뜻이므로, ‘필요한 만큼’을 써서 수량적 충분성을 드러냈고, גְאֻלָּתוֹ는 문맥상 ‘자기 속량’으로 옮겼습니다.
theological_decisions:
- issue: גֹּאֵל의 친족-속량자 개념을 어떻게 한국어로 드러낼지
  chosen_reading: 본문에는 간결하게 ‘속량할 자’로 두고, 친족적 뉘앙스는 주석 없이도 문맥상 유지합니다.
  alternative_readings:
  - 가까운 친족 속량자
  - 친족 구속자
  rationale: 이 절은 토지 환매 규정의 법문으로, 본문 내부의 경제-가족 기능을 과도하게 설명하지 않으면서도 원문의 의미를 유지하는 쪽이 적절합니다.
  doctrine_reference: 레위기 25장의 기업 회복과 친족 책임 규정
