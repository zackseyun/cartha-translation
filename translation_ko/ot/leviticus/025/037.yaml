source:
  edition: WLC
  text: אֶ֨ת כַּסְפְּ/ךָ֔ לֹֽא תִתֵּ֥ן ל֖/וֹ בְּ/נֶ֑שֶׁךְ וּ/בְ/מַרְבִּ֖ית לֹא תִתֵּ֥ן אָכְלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
  footnotes:
  - marker: a
    text: Or 'your silver.' Hebrew כֶּסֶף can mean both 'silver' and 'money'; here it refers to money used in lending.
    reason: lexical_alternative
  - marker: b
    text: Or 'at increase.' The Hebrew term can denote gain or increase taken from what is supplied, especially in parallel with 'interest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 네 돈[a]을 이자로 빌려주어서는 안 되며, 네 양식을 이익[b]을 얻으려고 그에게 주어서도 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּסֶף는 ‘은’과 ‘돈’ 둘 다 뜻할 수 있지만, 여기서는 빌려주는 금전 자산을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מַרְבִּית는 ‘증가’ 또는 ‘이익’의 뜻을 지니며, 여기서는 대출이나 공급한 물품에서 추가로 얻는 몫을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  english_pob_choice: your money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 은전
  - 재물
  lexicon: WLC / HALOT
  rationale: כֶּסֶף는 문자적으로는 ‘은’이지만, 대부 금지의 법률 문맥에서는 ‘돈’이 현대 한국어에서 가장 자연스럽고 기능적으로 정확합니다.
- source_word: תִתֵּן לוֹ
  english_pob_choice: lend him
  chosen_korean: 그에게 … 빌려주어서는 안 되고
  alternatives_korean:
  - 그에게 … 주어서는 안 되고
  - 그에게 … 빌려서는 안 되고
  lexicon: WLC / HALOT
  rationale: 동사 נתן은 기본적으로 ‘주다’이지만, 앞의 ‘돈’과 뒤의 ‘이자/불리기’ 문맥상 실제 의미는 대여입니다. 그래서 ‘빌려주다’로 풀어 법적 금지를 분명히 했습니다.
- source_word: בְּנֶשֶׁךְ
  english_pob_choice: at interest
  chosen_korean: 이자로
  alternatives_korean:
  - 이자 붙여
  - 고리로
  - 이익을 붙여
  lexicon: WLC / HALOT
  rationale: נֶשֶׁךְ는 대출에 붙는 이자를 뜻하므로, ‘이자로’가 가장 सीधे적이며 현대 독자에게도 명확합니다.
- source_word: וּבְמַרְבִּית
  english_pob_choice: for profit
  chosen_korean: 불리려는 목적으로
  alternatives_korean:
  - 증가분으로
  - 불려서
  - 증식시키려는 것으로
  lexicon: WLC / HALOT
  rationale: מַרְבִּית는 ‘증가, 불림, 이익’의 뜻을 가지며, 전치사 בְּ와 결합해 무엇인가에서 추가 이익을 취하는 뉘앙스를 줍니다. 한국어에서는 문맥을 살려 ‘불리려는 목적으로’로 옮겨, 단순한 금전 이익보다 ‘더 불리려는 행위’를 드러냈습니다.
- source_word: אָכְלֶךָ
  english_pob_choice: your food
  chosen_korean: 너희의 양식
  alternatives_korean:
  - 너의 음식
  - 너희의 먹을 것
  - 양식
  lexicon: WLC / HALOT
  rationale: אָכֶל은 일반적으로 ‘먹을 것, 음식’을 뜻하지만, 율법 문맥에서는 생활 필수품으로서의 식량을 가리키는 경우가 자연스럽습니다. ‘양식’은 그 의미를 간결하게 살리면서도 한국어 성경 문체에 잘 맞습니다.
