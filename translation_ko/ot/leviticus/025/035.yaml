source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
  footnotes:
  - marker: a
    text: Or, 'support him—the resident foreigner and the temporary resident'; the Hebrew phrase 'resident foreigner and temporary resident' is syntactically compressed and may be understood differently.
    reason: alternative_reading
  - marker: b
    text: Literally, 'his hand falters with you,' an idiom for losing means or becoming unable to support himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 형제가 가난해지고 그가 네 곁에서 생계를 꾸려 갈 힘을 잃으면, 그가 거류민이나 임시 거주자처럼 네 곁에서 살아갈 수 있도록 너는 그를 붙들어 주어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너는 그를 붙들어 주어야 합니다. 곧 거류민과 임시 거주자도 [붙들어 주어야 합니다].’ 히브리어의 ‘거류민과 임시 거주자’라는 구절은 문법적으로 압축되어 있어, 지원해야 할 대상을 추가하는 표현으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 손이 너와 함께 쇠약해진다’입니다. 이는 생계 수단을 잃거나 스스로를 부양할 능력이 없게 됨을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי / If
  english_pob_choice: If
  chosen_korean: 네 형제가 가난해지고
  alternatives_korean:
  - 만일 네 형제가 가난해지고
  - 그리고 네 형제가 가난해지고
  lexicon: HALOT
  rationale: 조건법 서두를 한국어 조건문으로 자연스럽게 열기 위해 '만일'도 가능하지만, 본문 흐름을 가장 간결하게 살리는 형태로 시작했습니다.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  english_pob_choice: and his hand falters beside you
  chosen_korean: 그의 손이 너와 함께 힘이 빠지면
  alternatives_korean:
  - 그의 손이 너와 함께 흔들리면
  - 그의 손이 너와 함께 무너지면
  - 그의 손이 너와 함께 약해지면
  lexicon: HALOT
  rationale: 손이 '힘이 빠지다'는 경제적 무능/생계 곤란의 관용 표현을 한국어로 살리면서도, 지나치게 비유적이지 않게 옮겼습니다.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  english_pob_choice: then you shall support him
  chosen_korean: 너는 그를 붙들어 주어야 합니다
  alternatives_korean:
  - 너는 그를 도와주어야 합니다
  - 너는 그를 지탱해야 합니다
  - 너는 그를 떠받쳐 주어야 합니다
  lexicon: HALOT
  rationale: חזק의 '붙들다/붙들어 주다'를 살려, 단순한 도움보다 실제로 지탱해 주는 책임을 드러냈습니다.
- source_word: גֵּר וְתוֹשָׁב
  english_pob_choice: as a resident foreigner or a temporary resident
  chosen_korean: 거류민이나 임시 거주자처럼
  alternatives_korean:
  - 거류민이나 임시 거주자로
  - 나그네나 임시 거주자처럼
  - 거류민 또는 임시 거주자처럼
  lexicon: HALOT
  rationale: גֵּר와 וְתוֹשָׁב의 사회적 지위를 구분해 주되, 문맥상 비교/유사성의 뉘앙스를 반영하기 위해 '처럼'을 택했습니다.
- source_word: וָחַי עִמָּךְ
  english_pob_choice: so that he may live beside you
  chosen_korean: 그리하여 그가 너와 함께 사는 …처럼 살게 하십시오
  alternatives_korean:
  - 그리하여 그가 너와 함께 살게 하십시오
  - 그리하여 그가 너와 함께 살아가게 하십시오
  - 그리하여 그가 너와 함께 거하게 하십시오
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 'so that'를 분명히 하고, 계속 거주하며 생존한다는 뜻을 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 형제 호칭의 범위
  chosen_reading: '''네 형제''를 그대로 유지하되, 공동체 내부의 동료 이스라엘 사람을 가리키는 법적 호칭으로 읽었습니다.'
  alternative_readings:
  - 네 동족
  - 네 동포
  rationale: 원문의 친족 언어를 일반화하지 않고 보존해, 공동체 내 상호부조 의무를 직접 드러냈습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
- issue: '''거류민이나 임시 거주자처럼''의 관계'
  chosen_reading: 이 구절을 '붙들어 주는 방식'과 연결되는 비교적 표현으로 처리했습니다.
  alternative_readings:
  - 그를 거류민과 임시 거주자로 보라는 추가 목적어로 읽기
  - 한 덩어리 관용구로 처리하기
  rationale: 히브리어가 압축되어 있어 해석이 갈릴 수 있으므로, 본문 흐름에 가장 자연스러운 비교 용법을 본문에 두고 다른 가능성은 열어 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
