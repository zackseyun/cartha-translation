review_pass:
  verdict: revise
  source_fidelity: 초안은 가난해짐, 경제적 능력의 상실, 지원 의무 및 공동체 안에서의 삶이라는 핵심을 대체로 담고 있습니다. 그러나 ‘그가 너와 함께 사는 거류민이나 임시 거주자처럼 살게 하십시오’는 ‘살다’를 중복하고, 거류민/임시 거주자 구문이 무엇을 수식하는지 불필요하게 어색하게 만듭니다. 히브리어의 압축성과 영어 POB의 목적적 독해를 유지하되, 한국어에서는 지원의 목적을 한 문장으로 연결하는 것이 안전합니다.
  naturalness: ‘그의 손이 너와 함께 힘이 빠지면’은 직역 흔적이 강하여 현대 한국어 본문으로는 부자연스럽습니다. 본문에서는 ‘생계를 꾸려 갈 힘을 잃으면’으로 관용구의 뜻을 자연스럽게 옮기고, 직역은 각주에서 보존했습니다. ‘네 곁에서’는 עִמָּךְ의 공동체적·관계적 의미를 자연스럽게 전달합니다.
  terminology: ‘네 형제’, ‘거류민’, ‘임시 거주자’는 유지할 수 있습니다. ‘붙들어 주다’도 חזק의 적극적 부양·지지 의미를 보존합니다. 대안 독해 각주는 기존처럼 불완전한 대시 구문으로 두지 않고, 생략된 동사가 반복되는 추가 목적어 독해임을 한국어로 명료하게 밝혔습니다.
  issues:
  - severity: medium
    issue: 본문의 ‘그가 너와 함께 사는 거류민이나 임시 거주자처럼 살게 하십시오’가 ‘살다’를 중복하고 수식 관계를 불명확하게 만듭니다.
    rationale: וָחַי עִמָּךְ는 그가 공동체 안에서 살아가도록 한다는 결과/목적을 나타냅니다. 한국어에서는 ‘살 수 있도록 … 붙들어 주어야 합니다’로 연결하면 의미와 문체가 모두 자연스럽습니다.
  - severity: medium
    issue: ‘그의 손이 너와 함께 힘이 빠지면’은 한국어 관용으로 자연스럽지 않습니다.
    rationale: 히브리어의 ‘손이 흔들리다/약해지다’는 생계 능력 상실을 뜻하는 관용구입니다. 본문은 그 뜻을 명료하게 번역하고, 문자적 표현은 각주에 남기는 편이 적절합니다.
  - severity: low
    issue: 각주 a의 인용문이 ‘거류민과 임시 거주자’ 앞에서 문법적으로 종결되어 대안 독해의 구조가 불완전합니다.
    rationale: 대안은 해당 명사구를 지원해야 할 추가 대상, 또는 동사가 생략된 병렬 대상으로 읽는 견해입니다. 이를 완결된 한국어 문장과 설명으로 제시해야 합니다.
  revised_text: 네 형제가 가난해지고 그가 네 곁에서 생계를 꾸려 갈 힘을 잃으면, 그가 거류민이나 임시 거주자처럼 네 곁에서 살아갈 수 있도록 너는 그를 붙들어 주어야 합니다.[a][b]
