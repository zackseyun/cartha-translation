revisions:
- from: 네 형제가 가난해지고 그의 손이 너와 함께 힘이 빠지면, 너는 그를 붙들어 주어야 합니다. 그리하여 그가 너와 함께 사는 거류민이나 임시 거주자처럼 살게 하십시오.[a][b]
  to: 네 형제가 가난해지고 그가 네 곁에서 생계를 꾸려 갈 힘을 잃으면, 그가 거류민이나 임시 거주자처럼 네 곁에서 살아갈 수 있도록 너는 그를 붙들어 주어야 합니다.[a][b]
  rationale: 경제적 곤궁을 뜻하는 히브리어 관용구를 자연스러운 현대 한국어로 옮기고, 직역은 각주로 보존했습니다. 또한 거류민/임시 거주자 구문의 논쟁적인 결합 관계를 ‘처럼’으로 단정적으로 해소하지 않으면서도 영어 POB의 목적적 독해를 반영했습니다. 대안 독해 각주는 한국어 문법상 완결되도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
