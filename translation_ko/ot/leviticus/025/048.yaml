  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
  footnotes:
  - marker: a
    text: Or, more broadly, “one of his relatives may redeem him.” The Hebrew literally says “one of his brothers,” referring to a male family member acting as kinsman-redeemer.
