source:
  edition: WLC
  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
  footnotes:
  - marker: a
    text: Literally, 'his uncle’s son'; that is, his cousin.
    reason: lexical_alternative
  - marker: b
    text: Or, 'if he acquires sufficient means.' Literally, 'if his hand prospers/attains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 삼촌이나 그의 삼촌의 아들이[a] 그를 속량할 수 있습니다. 또는 그의 가문에 속한 가까운 혈족 중 한 사람이 그를 속량할 수 있습니다. 또는 그의 손에 여력이 생기면[b] 스스로 속량할 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 삼촌의 아들’입니다. 곧 사촌을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손이 이르면/미치면’입니다. 곧 충분한 수단을 얻게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  english_pob_choice: his uncle
  chosen_korean: 그의 삼촌
  alternatives_korean:
  - 그의 외삼촌
  - 그의 숙부
  lexicon: HALOT
  rationale: 친족 속량 규정의 혈족 맥락에서 דּוֹד는 ‘삼촌’으로 이해하는 것이 자연스럽고, 문맥상 애정어가 아니라 친족 호칭을 드러내야 합니다.
- source_word: בֶן דֹּדוֹ
  english_pob_choice: his uncle’s son
  chosen_korean: 그의 삼촌의 아들
  alternatives_korean:
  - 그의 사촌
  lexicon: HALOT
  rationale: 히브리어 표현을 그대로 살려 ‘삼촌의 아들’로 옮기면 친족 구조가 투명하게 드러나며, 필요하면 각주로 ‘사촌’의 자연스러운 의미를 설명할 수 있습니다.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  english_pob_choice: one of his close blood relatives
  chosen_korean: 그의 살에서 가까운 친족 중 하나
  alternatives_korean:
  - 그의 가까운 친척 중 하나
  - 그의 혈족 중 하나
  lexicon: HALOT
  rationale: 직역적 이미지를 과도하게 평탄화하지 않되, 한국어에서 이해 가능한 범위로 ‘살’과 ‘가까운 친족’을 함께 살려 혈연의 근접성을 표현했습니다.
- source_word: מִמִּשְׁפַּחְתּוֹ
  english_pob_choice: from his clan
  chosen_korean: 그의 가문에서
  alternatives_korean:
  - 그의 족속에서
  - 그의 가족에서
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 핵가족보다 넓은 친족 단위를 가리키므로, 한국어에서는 ‘가문’이 이 사회적 규모를 가장 잘 드러냅니다.
- source_word: הִשִּׂיגָה יָדוֹ
  english_pob_choice: if his hand prospers
  chosen_korean: 그의 손이 넉넉해지면
  alternatives_korean:
  - 그가 형편이 나아지면
  - 그의 손이 번성하면
  lexicon: HALOT
  rationale: ‘손’의 관용구를 완전히 버리지 않으면서도 한국어로는 재정적 여유가 생긴다는 뜻이 분명히 전달되도록 ‘넉넉해지다’로 옮겼습니다.
- source_word: וְנִגְאָל
  english_pob_choice: he may redeem himself
  chosen_korean: 그는 스스로 속량할 수 있습니다
  alternatives_korean:
  - 그는 자신을 속량할 수 있습니다
  - 그는 속량될 수 있습니다
  lexicon: HALOT
  rationale: 문맥상 자신이 필요한 값을 마련하여 속량을 실행하는 의미이므로, 한국어에서는 능동적 자기 속량을 분명히 보여 주는 표현이 적절합니다.
theological_decisions:
- issue: גאל(속량) 용어의 일관성
  chosen_reading: ‘속량하다’를 일관되게 사용했습니다.
  alternative_readings:
  - 구속하다
  - 되사다
  rationale: 이 장의 법적-신학적 개념은 친족 속량이므로, 상업적 뉘앙스의 ‘되사다’보다 성경적 용어로 굳은 ‘속량하다’가 개념 연속성을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §5
- issue: 히브리어 관용구 הִשִּׂיגָה יָדוֹ의 처리
  chosen_reading: ‘그의 손이 넉넉해지면’으로 손의 이미지를 유지했습니다.
  alternative_readings:
  - 그가 충분한 재산을 얻으면
  - 그가 형편이 나아지면
  rationale: 손-이미지를 완전히 설명문으로 바꾸지 않고도 의미가 전달되도록 하여, 원문의 구체성을 유지하면서 한국어 가독성을 확보했습니다.
  doctrine_reference: Translation philosophy §1, §6
