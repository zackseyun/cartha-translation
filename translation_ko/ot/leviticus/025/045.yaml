  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
  footnotes:
  - marker: a
    text: Or 'from among the descendants of the resident foreigners living with you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as a possession'; here the legal sense is that they become inheritable property.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한, 여러분과 함께 사는 거류민의 자손들 가운데서, 곧 여러분 땅에서 그들이 낳은 그들의 가족들 가운데서도 여러분은 사십시오. 그들은 여러분의 소유가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여러분과 함께 사는 거류 외국인의 자손들 가운데서'.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 '여러분 땅에서 그들이 낳은'입니다. 여기서는 법적 맥락상 계보와 출생지를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: You may also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 더욱이
  lexicon: HALOT
  rationale: 이전 절의 허용을 이어 주는 추가 항목을 자연스럽게 연결하기 위해 '또한'으로 옮겼습니다.
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  english_pob_choice: from the sons of the sojourners who reside with you
  chosen_korean: 여러분과 함께 사는 거류민의 자손들 가운데서
  alternatives_korean:
  - 여러분 가운데 거주하는 외국인의 자손들 가운데서
  - 여러분과 함께 있는 체류민의 아들들 가운데서
  lexicon: HALOT
  rationale: 법적·사회적 맥락을 살리면서도 현대 한국어에서 이해되는 '거류민'을 택해, 'sons of'의 계보적 의미를 '자손들'로 반영했습니다.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  english_pob_choice: and they shall become your possession
  chosen_korean: 그들은 여러분의 소유가 될 것입니다
  alternatives_korean:
  - 그들은 여러분의 소유지 될 것입니다
  - 그들은 여러분의 소유물로 될 것입니다
  lexicon: HALOT
  rationale: אֲחֻזָּה의 기본 의미인 '소유/보유물'을 따라, 관계적·법적 소유 상태를 한국어 '소유'로 옮겼습니다. 인격체를 가리키는 대상이므로 '소유물'보다 덜 물화된 표현을 택했습니다.
theological_decisions:
- issue: 노예/소유 관련 법문을 완곡하게 바꿀지 여부
  chosen_reading: 원문의 매매·소유 법적 현실을 유지하되, 한국어에서는 지나친 물화 표현은 피했습니다.
  alternative_readings:
  - 사서 여러분의 재산이 되게 하십시오
  - 여러분의 재산이 될 것입니다
  - 여러분의 노예가 될 것입니다
  rationale: 히브리어는 실제 구매와 소유 상태를 말하지만, 현대 한국어 독자에게는 '소유'만으로도 법적 종속 관계가 충분히 드러납니다. 본문이 허용하는 범위를 넘는 해석적 강화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
