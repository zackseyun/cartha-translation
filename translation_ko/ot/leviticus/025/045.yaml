  source_fidelity: 현 초안은 구매의 대상과 출처를 대체로 보존하고 있으나, 두 번째 전치사구를 설명하는 관계절의 결속이 한국어 문장 안에서 흐려졌습니다. 히브리어의 '그들의 가족들, 곧 그들이 여러분 땅에서 낳은 [가족들]'을 명시적으로 연결해야 합니다. 또한 법률적 허용의 미완료형은 명령형 '사십시오'보다 '사실 수 있습니다'가 더 정확합니다.
  naturalness: '''그들이 낳은 그들의 가족들''은 한국어에서 소유 관계와 관계절의 대상이 겹쳐 부자연스럽고 의미가 불명확합니다. 관계절을 ''그들이 여러분 땅에서 낳은, 여러분과 함께 있는 그들의 가족들''로 재배열하면 자연스럽고 원문의 수식 관계도 드러납니다.'
  terminology: '''거류민''과 ''소유''는 이 법률 문맥에서 사용할 수 있습니다. 다만 원문의 구매 및 소유 언어를 유지하기 위해 ''사실 수 있습니다''와 ''여러분의 소유''를 보존합니다. ''가족들''은 מִשְׁפָּחָה의 넓은 가족·씨족 범위를 문맥상 무리 없이 반영합니다.'
