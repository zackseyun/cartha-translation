base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the land shall rest a Sabbath for the LORD.' The Hebrew personifies the land as observing sabbath rest.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 말하고 그들에게 이렇게 이르십시오. “너희가 내가 너희에게 주는 그 땅으로 들어갈 때에, 그 땅은 야훼께 드리는 안식일을 지킬 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 법적·지시적 서두로서 הדיבור의 직접성을 살리면서도 한국어 합쇼체 문맥에 자연스럽게 맞췄습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 그대로 살려 원문의 문채를 유지했습니다.
- source_word: כִּי תָבֹאוּ אֶל הָאָרֶץ
  english_pob_choice: When you come into the land
  chosen_korean: 너희가 … 그 땅으로 들어갈 때에
  alternatives_korean:
  - 너희가 … 그 땅에 들어올 때에
  - 너희가 … 그 땅에 들어가면
  lexicon: HALOT
  rationale: בוא + אל의 진입 의미를 한국어 관용에 맞게 ‘들어가다’로 옮겨, 약속의 땅으로의 입성을 분명히 했습니다.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  english_pob_choice: that I am giving to you
  chosen_korean: 내가 너희에게 주는
  alternatives_korean:
  - 내가 너희에게 주고 있는
  - 내가 너희에게 주려는
  lexicon: HALOT
  rationale: 분사 נֹתֵן의 진행·임박성을 살리되, 한국어에서는 현재형 ‘주는’이 가장 자연스럽게 그 느낌을 전달합니다.
- source_word: שַׁבָּת
  english_pob_choice: a Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 안식
  - 안식 규례
  lexicon: HALOT
  rationale: 절기·제도적 용례이므로 단순한 휴식보다 규정된 ‘안식일’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께 드리는
  - 야훼에게 속한
  lexicon: HALOT
  rationale: ל의 헌정·귀속 의미를 살려, 땅의 안식이 야훼께 바쳐진다는 점을 드러냈습니다.
theological_decisions:
- issue: 야훼의 귀속 표현
  chosen_reading: ‘야훼를 위한 안식일’은 땅의 안식이 단순한 자연적 휴식이 아니라 언약적·예배적 성격의 거룩한 안식임을 드러냅니다.
  alternative_readings:
  - ‘야훼께 드리는 안식일’
  - ‘야훼를 위한 안식’
  rationale: 본문의 לַיהוָה는 소유·헌정의 뉘앙스를 함께 가지므로, 제도적 성격과 귀속성을 동시에 살리는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
