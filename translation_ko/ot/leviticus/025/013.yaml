lexical_decisions:
- source_word: בִּ/שְׁנַ֥ת ... הַ/יּוֹבֵ֖ל
  english_pob_choice: In this Year of Jubilee
  chosen_korean: 이 희년에는
  alternatives_korean:
  - 희년에는
  - 이 희년의 해에는
  lexicon: HALOT
  rationale: בְּ + שָׁנָה는 시간 부사구로 처리하고, יובֵל은 레위기 25장의 제도적 용어이므로 '희년'으로 옮기되 문장 앞에서 자연스럽게 받았습니다.
- source_word: תָּשֻׁ֕בוּ
  english_pob_choice: shall return
  chosen_korean: 돌아가야 합니다
  alternatives_korean:
  - 돌아갈 것입니다
  - 돌아가십시오
  lexicon: HALOT
  rationale: 법률 조항의 명령/규범적 미래를 한국어에서는 '...해야 합니다'로 자연스럽게 나타낼 수 있습니다.
- source_word: אִ֖ישׁ
  english_pob_choice: each of you
  chosen_korean: 각 사람마다
  alternatives_korean:
  - 각 사람은
  - 각자
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살리면서, 영어 POB의 'each of you'처럼 개인별 적용을 분명히 드러내는 표현을 택했습니다.
- source_word: אֲחֻזָּת/וֹ
  english_pob_choice: his property
  chosen_korean: 그의 소유
  alternatives_korean:
  - 그의 재산
  - 그의 소유지
  lexicon: HALOT
  rationale: אֲחֻזָּה는 레위기 25장에서 가족이 보유한 토지/보유분을 가리키므로, 현대 한국어에서 포괄적이고 본문에 충실한 '소유'를 택했습니다.
theological_decisions:
- issue: 희년의 회복 규정
  chosen_reading: 희년에는 각 사람이 원래의 소유로 돌아가야 하는 회복 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 재산 반환 규정
  - 경제적 재분배 원리
  rationale: 문맥상 레위기 25장의 희년 제도는 토지와 상속분의 회복을 다루므로, 단순 반환보다 '돌아가야 합니다'라는 규범적 표현이 본문의 법적 강도를 더 잘 반영합니다.
  doctrine_reference: Leviticus 25 / Jubilee legislation
