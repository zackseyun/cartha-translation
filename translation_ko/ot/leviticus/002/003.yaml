id: LEV.2.3
reference: Leviticus 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'from the offerings by fire to the LORD' or 'from the fire offerings of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 곡식제물에서 남은 것은 아론과 그의 아들들의 것이 되며, 야훼께 드리는 화제물에 속한 지극히 거룩한 몫입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 드리는 불로 드린 제물에 속한’ 또는 ‘야훼의 불제물에 속한’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  english_pob_choice: what is left
  chosen_korean: 남은 것
  alternatives_korean:
  - 남은 부분
  - 나머지
  lexicon: HALOT
  rationale: 분사형 명사구가 제물의 잔여분을 가리키므로, 현대 한국어에서는 간결한 '남은 것'이 가장 자연스럽고 의미도 분명합니다.
- source_word: מִן הַמִּנְחָה
  english_pob_choice: of the grain offering
  chosen_korean: 곡식제물에서
  alternatives_korean:
  - 곡식제물의
  - 소제물에서
  lexicon: HALOT
  rationale: מִנְחָה는 레위기 2장 문맥상 일반적 '예물'이 아니라 곡식제물을 가리키므로, POB의 'grain offering'을 따라 '곡식제물'로 옮겼습니다.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  english_pob_choice: for Aaron and for his sons
  chosen_korean: 아론과 그의 아들들의 것이 되며
  alternatives_korean:
  - 아론과 그의 아들들을 위하여
  - 아론과 그의 아들들에게
  lexicon: HALOT
  rationale: לְ 표지는 소유·배분을 나타내므로, 단순한 목적어보다 제사장 몫이라는 뜻이 드러나도록 '것이 되며'로 풀었습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: a most holy portion
  chosen_korean: 지극히 거룩한 것입니다
  alternatives_korean:
  - 가장 거룩한 몫입니다
  - 지성소급으로 거룩한 것입니다
  lexicon: HALOT
  rationale: 이 중첩 표현은 제의적 최고 등급의 거룩함을 뜻하므로, 장소명처럼 오해될 수 있는 직역보다 '지극히 거룩한'으로 옮겼습니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼께 드리는 화제물 가운데
  alternatives_korean:
  - 야훼의 화제물 가운데
  - 야훼께 드리는 불살라 드리는 제물 가운데
  lexicon: HALOT
  rationale: אִשֵּׁי는 불로 드리는 제의적 표현으로, POB의 각주 취지를 살려 한국어 본문에서는 '화제물'을 쓰고, 출처 표지를 나타내는 מן을 '가운데'로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그람마톤은 프로젝트 기본값에 따라 고유명사 '야훼'로 옮겨, 신분 호칭인 '주님'으로 바꾸지 않았습니다.
theological_decisions:
- issue: 제물 잔여분의 귀속과 거룩성
  chosen_reading: 남은 것은 아론과 그의 아들들의 것이 되며, 이는 ... 지극히 거룩한 것입니다
  alternative_readings:
  - 남은 것은 ... 아론과 그의 아들들을 위한 것입니다
  - 남은 것은 ... 지성소입니다
  rationale: 본문은 남은 몫의 배분과 그 제의적 등급을 함께 말하므로, 소유 표지와 거룩성 등급을 모두 드러내되 장소 개념으로 오해될 수 있는 표현은 피했습니다.
  doctrine_reference: 레위기 제사 규정의 문맥적 의미 보존
