  english_pob_choice: and pour oil on it
  chosen_korean: 그 위에 기름을 부으십시오
  alternatives_korean:
  - 그 위에 기름을 쏟으십시오
  - 그 위에 기름을 붓고
  lexicon: HALOT
  rationale: 제사 지침의 명령형 흐름을 살려 ‘부으십시오’로 옮겼고, על의 방향성을 ‘그 위에’로 분명히 했습니다.
- source_word: מִנְחָ֖ה הִֽוא
  english_pob_choice: it is a grain offering
  chosen_korean: 그것은 소제입니다
  alternatives_korean:
  - 그것은 곡식 제사입니다
  - 그것은 곡물 제물입니다
  lexicon: HALOT
  rationale: 문맥상 מִנְחָה는 레위기 2장의 제의 용어이므로, 전통적으로 널리 쓰이는 ‘소제’를 채택해 제의적 의미를 유지했습니다.
