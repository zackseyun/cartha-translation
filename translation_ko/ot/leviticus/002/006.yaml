  yaml_path: translation/ot/leviticus/002/006.yaml
  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
  footnotes:
  - marker: a
    text: Or 'divide it into morsels' or 'fragments.' The Hebrew emphasizes breaking the offering into smaller pieces before oil is poured on it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 조각내어 그 위에 기름을 부으십시오[a]. 그것은 소제입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각으로 나누어’ 혹은 ‘부스러기로 나누어’로도 옮길 수 있습니다. 히브리어는 기름을 붓기 전에 제물을 더 작은 조각들로 부수는 것을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת ... פִּתִּ֔ים
  english_pob_choice: Break it into pieces
  chosen_korean: 조각내어
  alternatives_korean:
  - 부수어
  - 잘게 나누어
  - 조각으로 나누어
  lexicon: HALOT
  rationale: 동사와 결과 명사를 함께 담아, 제물을 여러 조각으로 부수는 행위를 간결하게 드러내기 위해 ‘조각내어’로 옮겼습니다.
- source_word: וְ/יָצַקְתָּ֥ עָלֶ֖י/הָ שָׁ֑מֶן
  english_pob_choice: and pour oil on it
  chosen_korean: 그 위에 기름을 부으십시오
  alternatives_korean:
  - 그 위에 기름을 쏟으십시오
  - 그 위에 기름을 붓고
  lexicon: HALOT
  rationale: 제사 지침의 명령형 흐름을 살려 ‘부으십시오’로 옮겼고, על의 방향성을 ‘그 위에’로 분명히 했습니다.
- source_word: מִנְחָ֖ה הִֽוא
  english_pob_choice: it is a grain offering
  chosen_korean: 그것은 소제입니다
  alternatives_korean:
  - 그것은 곡식 제사입니다
  - 그것은 곡물 제물입니다
  lexicon: HALOT
  rationale: 문맥상 מִנְחָה는 레위기 2장의 제의 용어이므로, 전통적으로 널리 쓰이는 ‘소제’를 채택해 제의적 의미를 유지했습니다.
