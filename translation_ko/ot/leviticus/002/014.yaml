  to: 만일 야훼께 첫 소산의 예물을 드리려거든, 불에 볶은 푸른 이삭, 곧 햇곡식을 찧은 것으로 그 첫 소산의 예물을 드려야 합니다.[a]
  rationale: 원문의 단수 소유를 복수 ‘너희의’로 확대하지 않도록 고치고, 두 번째 ‘첫 소산의 예물’의 반복은 ‘그’로 자연스럽게 유지했습니다. אָבִיב의 농경 이미지는 ‘푸른 이삭’으로, גֶּרֶשׂ כַּרְמֶל의 가공된 햇곡식이라는 관계는 ‘햇곡식을 찧은 것’으로 드러냈습니다. 각주에는 אָבִיב 및 כַּרְמֶל에 대한 무리 없는 어휘 대안을 남겼습니다.
