  rationale: 이 프로젝트의 기본 원칙에 따라 본문에 나타난 언약적 신명을 가려지지 않게 드러내기 위해 '야훼'를 사용했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
