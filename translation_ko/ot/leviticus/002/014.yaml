language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
  footnotes:
  - marker: a
    text: Or 'green ears roasted in the fire, crushed grain of the new crop.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 야훼께 첫 소산의 예물을 드리려거든, 너희의 첫 소산 예물을 불에 볶은 여린 곡식 이삭, 곧 찧은 새 곡식으로 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "불에 볶은 푸른 이삭, 곧 새 곡식의 찧은 알곡".
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם תַּקְרִ֛יב
  english_pob_choice: And if you present
  chosen_korean: 그리고 만일 ... 드리려거든
  alternatives_korean:
  - 그리고 만일 ... 바치면
  - 만일 ... 드리면
  lexicon: HALOT
  rationale: 제의 문맥의 קרב는 단순한 '가져오다'보다 하나님께 가까이 '드리다/제시하다'의 뜻이 강하므로, 현대 합쇼체에서 자연스러운 '드리다'로 옮겼습니다.
- source_word: מִנְחַ֥ת בִּכּוּרִ֖ים
  english_pob_choice: an offering of firstfruits
  chosen_korean: 첫 소산의 예물
  alternatives_korean:
  - 첫 열매의 예물
  - 처음 거둔 소산의 제물
  lexicon: HALOT
  rationale: בִּכּוּרִים의 제의적 의미를 살려 '첫 소산'으로 옮기고, מִנְחָה는 여기서 곡식 제물로 세분되기 전의 일반 제의어이므로 '예물'로 간결하게 처리했습니다.
- source_word: אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙
  english_pob_choice: fresh heads of grain roasted in the fire
  chosen_korean: 불에 볶은 여린 곡식 이삭
  alternatives_korean:
  - 불에 볶은 푸른 이삭
  - 불에 볶은 새 곡식
  lexicon: HALOT
  rationale: אָבִיב은 아직 충분히 마르지 않은 여린 곡식을 가리키므로, '여린 곡식 이삭'으로 농경 이미지를 살렸습니다. קָלוּי בָּאֵשׁ는 직역해도 무리가 없는 '불에 볶은'으로 옮겼습니다.
- source_word: גֶּרֶשׂ כַּרְמֶ֔ל
  english_pob_choice: crushed kernels from the fresh grain
  chosen_korean: 찧은 새 곡식
  alternatives_korean:
  - 부순 알곡
  - 거칠게 찧은 새 곡식
  lexicon: HALOT
  rationale: גֶּרֶשׂ는 부수거나 찧은 곡물을, כַּרְמֶל은 신선한 수확물을 가리키므로 둘을 합쳐 자연스럽고 압축적으로 '찧은 새 곡식'으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 신명사 처리
  chosen_reading: יהוה를 '야훼'로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 기본 원칙에 따라 본문에 나타난 언약적 신명을 가려지지 않게 드러내기 위해 '야훼'를 사용했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
