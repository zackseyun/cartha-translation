  source_fidelity: 원문의 조건문과 반복되는 제의 동사, 첫 수확물의 예물이라는 핵심 의미는 대체로 잘 반영되었습니다. 그러나 히브리어 단수 2인칭 소유 접미사를 근거 없이 복수인 ‘너희의’로 옮긴 점은 피하는 것이 좋습니다. 또한 גֶּרֶשׂ כַּרְמֶל은 ‘새 곡식’ 자체가 아니라 햇곡식을 찧거나 부순 재료를 가리키므로, 이를 명시하는 편이 충실합니다.
  naturalness: ‘여린 곡식 이삭’은 뜻은 전달되지만 ‘곡식 이삭’이 다소 중복되고, ‘너희의’는 합쇼체의 일반적 조건문에서 부자연스럽습니다. ‘불에 볶은 푸른 이삭, 곧 햇곡식을 찧은 것’은 현대 표준어에서 자연스럽고 제의 재료의 관계도 분명합니다.
  terminology: ‘야훼’, ‘첫 소산’, ‘예물’은 프로젝트의 선택 및 문맥에 부합합니다. 다만 본문의 반복을 유지하면서 인칭·수의 문제를 피하기 위해 두 번째 표현은 ‘그 첫 소산의 예물’로 처리했습니다.
