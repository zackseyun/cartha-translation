base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'an offering by fire' or 'a fire offering' for 'a food offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 아론의 아들들, 곧 제사장들에게 가져가야 합니다. 그러고 나서 제사장은 그곳에서 그 고운 가루와 기름의 한 움큼, 그리고 모든 유향을 집어야 합니다. 제사장은 그 기념 부분을 제단 위에서 불살라야 합니다. 그것은 화제이며, 야훼께 드리는 향기로운 향입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  english_pob_choice: Aaron’s sons, the priests
  chosen_korean: 아론의 아들들, 곧 제사장들
  alternatives_korean:
  - 아론의 아들들, 곧 사제들
  - 아론의 아들들인 제사장들
  lexicon: HALOT
  rationale: 친족 관계와 직무를 함께 드러내기 위해 ‘아론의 아들들’ 뒤에 동격 표지 ‘곧 제사장들’을 붙였습니다.
- source_word: וְקָמַץ מִשָּׁם
  english_pob_choice: he shall take from there a handful
  chosen_korean: 그곳에서 ... 집어야 합니다
  alternatives_korean:
  - 거기서 ... 움켜야 합니다
  - 그곳에서 ... 떠야 합니다
  lexicon: HALOT
  rationale: מִשָּׁם의 ‘그곳에서’를 살리고, 제의적 동작은 자연스러운 한국어 ‘집다’로 옮겨 ‘한 움큼’을 받치게 했습니다.
- source_word: מְלֹא קֻמְצוֹ
  english_pob_choice: a handful
  chosen_korean: 한 움큼
  alternatives_korean:
  - 손 한 움큼
  - 주먹 가득
  lexicon: HALOT
  rationale: 직역의 어색함보다 제의 문맥에서 이해되는 관용적 표현 ‘한 움큼’이 원뜻을 가장 분명하게 전달합니다.
- source_word: אַזְכָּרָתָהּ
  english_pob_choice: its memorial portion
  chosen_korean: 기념 부분
  alternatives_korean:
  - 기억 제물
  - 기념 몫
  lexicon: HALOT
  rationale: 제의 용어의 기술성을 살리면서도 한국어 독자가 바로 이해할 수 있도록 ‘기념 부분’으로 옮겼습니다.
- source_word: אִשֵּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불살라 드리는 제물
  lexicon: HALOT
  rationale: 문맥상 이미 ‘불살라야 합니다’가 있어, 여기서는 제의 공식어인 ‘화제’를 사용해 반복을 피하고 제의적 뉘앙스를 유지했습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 기쁘게 받으실 향기
  - 향기로운 제향
  lexicon: HALOT
  rationale: 문맥의 ‘향기’ 이미지를 살리되, 관용적 종교어휘로 굳어지기 쉬운 표현을 피하고 비교적 직접적인 ‘향기로운 향’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
