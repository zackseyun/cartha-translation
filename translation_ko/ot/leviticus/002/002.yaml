  - 여호와
  rationale: 본 프로젝트의 기본 원칙에 따라 신명기적 성호를 음역형 ‘야훼’로 직역해 본문 안에서 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
