id: LEV.2.7
reference: Leviticus 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
  footnotes:
  - marker: a
    text: Or 'griddle,' 'deep pan,' or 'cooking pan'; the exact type of vessel denoted by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 네 예물이 팬에 구운 곡식제사이면, 그것은 고운 가루에 기름을 넣어 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַרְחֶשֶׁת은 정확한 조리 기구를 특정하기 어려워, ‘팬’으로 일반화했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문이 앞 절에 이어지는 사례를 도입하므로, ‘그리고 만일’로 순차성과 조건성을 함께 살렸습니다.
- source_word: מִנְחַת
  english_pob_choice: grain offering
  chosen_korean: 곡식제사
  alternatives_korean:
  - 소제
  - 곡식 예물
  - 곡식제물
  lexicon: HALOT
  rationale: 레위기 2장의 מִנְחָה는 일반적 ‘예물’보다 제의적 제사 항목을 가리키므로, 곡식 재료를 드러내는 ‘곡식제사’로 옮겼습니다.
- source_word: מַרְחֶשֶׁת
  english_pob_choice: pan
  chosen_korean: 팬에 구운
  alternatives_korean:
  - 팬의
  - 부침판에 구운
  - 얕은 팬에 구운
  lexicon: HALOT
  rationale: 히브리어는 조리용 그릇의 정확한 형태가 불확실하므로, EN POB의 ‘pan’에 맞추되 자연스러운 한국어로 ‘팬에 구운’이라 옮겼습니다.
- source_word: סֹלֶת בַּשֶּׁמֶן
  english_pob_choice: fine flour with oil
  chosen_korean: 고운 가루에 기름을 넣어
  alternatives_korean:
  - 기름을 섞은 고운 가루로
  - 기름과 함께 한 고운 가루로
  lexicon: HALOT
  rationale: סֹלֶת은 제의 문맥의 표준 재료이므로 ‘고운 가루’로, בַּשֶּׁמֶן은 동반·재료 관계를 살려 ‘기름을 넣어’로 옮겼습니다.
theological_decisions:
- issue: 제의 지시문의 수동·명령적 뉘앙스
  chosen_reading: ‘it shall be made’의 규범적 지시를 한국어 의무 표현 ‘만들어야 합니다’로 살렸습니다.
  alternative_readings:
  - ‘만들어집니다’
  - ‘만들 것입니다’
  rationale: 본문은 단순 미래 예고가 아니라 제사 규정을 제시하므로, 절차적 규범성을 드러내는 표현이 적절합니다.
  doctrine_reference: 제의법 문맥의 지시문 해석
