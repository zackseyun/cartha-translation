id: LEV.2.8
reference: Leviticus 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
  footnotes:
  - marker: a
    text: Or 'for the LORD.' The Hebrew preposition can express dedication as well as direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 이것들로 만든 곡식 제물을 야훼께[a] 가져와야 합니다. 그것을 제사장에게 가져가고, 제단 가까이 가져가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위하여’. 히브리어 전치사는 방향뿐 아니라 봉헌의 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 곡식 헌물
  - 소제
  lexicon: HALOT
  rationale: 레위기 2장의 מִנְחָה는 일반적 ‘선물’이 아니라 곡식으로 드리는 제의를 가리키므로, 내용을 드러내는 ‘곡식 제물’을 택했습니다.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  english_pob_choice: that is made from these things
  chosen_korean: 이들로 만든
  alternatives_korean:
  - 이것들로 준비된
  - 이것들에서 만들어진
  lexicon: HALOT
  rationale: 뒤에서 이미 설명된 재료들을 가리키는 표현을 한국어에서도 간결하게 살려, 제작·준비의 의미를 담은 ‘이들로 만든’으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh[a]
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 주님께
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 프로젝트 기본어에 따라 ‘야훼’로 옮기고, ל의 방향성과 봉헌성을 함께 살리기 위해 ‘-께’를 붙였습니다.
- source_word: וְהִקְרִיבָהּ
  english_pob_choice: and he shall present it
  chosen_korean: 그것을 제사장에게 드리고
  alternatives_korean:
  - 그것을 제사장에게 바치고
  - 그것을 제사장 앞에 가져가고
  lexicon: HALOT
  rationale: קרב의 기본 뜻인 ‘가까이 가져가다/드리다’를 살리면서, 이어지는 נגשׁ와 구별되도록 ‘드리고’로 옮겼습니다.
- source_word: וְהִגִּישָׁהּ
  english_pob_choice: and he shall bring it near
  chosen_korean: 제단 앞으로 가져가야 합니다
  alternatives_korean:
  - 제단에 가까이 가져가야 합니다
  - 제단 곁으로 가져가야 합니다
  lexicon: HALOT
  rationale: נגשׁ의 ‘가까이 가져가다’라는 의미를 유지하되, 대상이 분명한 제단을 향한 이동을 자연스럽게 드러내기 위해 ‘제단 앞으로’라고 했습니다.
theological_decisions:
- issue: 여호와 이름의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 YHWH를 직접 사용하므로, 전통적 교회어보다 원문 대응을 우선하는 프로젝트 기준에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제의 동사의 연쇄를 한국어에서 어떻게 구분할지
  chosen_reading: ‘드리고’와 ‘가져가야 합니다’로 두 단계를 구분
  alternative_readings:
  - 둘 다 ‘드리고’로 통일
  - 둘 다 ‘가까이 가져가야 합니다’로 통일
  rationale: 히브리어의 קרב과 נגשׁ는 모두 ‘가까이 가져가다’ 계열이지만 동작의 단계가 다르므로, 한국어에서도 구분을 유지해 제의 절차의 흐름을 보존했습니다.
  doctrine_reference: Leviticus ritual sequence
- issue: 문체의 합쇼체 유지
  chosen_reading: 서술·지시문을 합쇼체로 처리
  alternative_readings:
  - 평서형
  - 구어체
  rationale: 레위기 제의 규정은 현대 한국어 성경의 공적·규범적 문체에 맞춰 합쇼체로 옮기는 것이 적절합니다.
  doctrine_reference: Korean style guide
