  to: 네 곡식 제물의 모든 예물에는 소금을 쳐야 합니다. 네 하나님의 언약의 소금이 네 곡식 제물에서 빠지지 않게 하십시오. 네가 바치는 모든 제물과 함께 소금을 바치십시오.
  rationale: 원문의 세 명령을 현대 합쇼체로 분명히 옮기고, ‘언약의 소금’이라는 문자적이며 해석을 열어 둔 표현을 유지했습니다. 마지막 절의 עַל은 한국어에서 자연스러운 ‘모든 제물과 함께’로 옮겨 소금이 모든 제물에 수반되어야 함을 나타냈습니다.
