id: LEV.2.4
reference: Leviticus 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
  footnotes:
  - marker: a
    text: Or 'and unleavened wafers.' The Hebrew conjunction is 'and,' but here it likely lists an alternative form of the oven-baked grain offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 화덕에 구운 곡식 제물을 바칠 때에는, 그것은 고운 밀가루로 만든 것이어야 합니다. 곧 기름을 섞은 누룩 없는 떡과 기름을 바른 누룩 없는 전병이어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תַקְרִב
  english_pob_choice: And if you bring near
  chosen_korean: 만일 너희가 ... 바치려거든
  alternatives_korean:
  - 그리고 만일 ... 드리면
  - 만일 ... 가져오면
  lexicon: HALOT
  rationale: 히필 תַקְרִב의 핵심은 단순 소지 이동이 아니라 예물을 하나님께 ‘가까이 가져와 드리는’ 행위이므로, 제의 맥락에 맞게 ‘바치다’를 택했습니다.
- source_word: קָרְבַּן מִנְחָה
  english_pob_choice: an offering of a grain offering
  chosen_korean: 소제의 예물
  alternatives_korean:
  - 곡식 제물
  - 곡식 예물
  lexicon: HALOT
  rationale: מִנְחָה는 레위기 제의 문맥에서 표준적으로 ‘소제’에 해당하므로, 전통적 교회어를 완전히 배제하지 않되 제의 범주를 분명히 드러내는 ‘소제의 예물’로 옮겼습니다.
- source_word: מַאֲפֵה תַנּוּר
  english_pob_choice: baked in an oven
  chosen_korean: 오븐에 구운
  alternatives_korean:
  - 가마에 구운
  - 화덕에 구운
  lexicon: HALOT
  rationale: תַּנּוּר는 굽는 용기를 가리키므로 현대 한국어에서는 이해가 쉬운 ‘오븐’으로 옮기되, 구운 방식 자체는 그대로 유지했습니다.
- source_word: חַלּוֹת מַצּוֹת
  english_pob_choice: unleavened cakes
  chosen_korean: 누룩 없는 과자
  alternatives_korean:
  - 무교병
  - 누룩 없는 떡
  lexicon: HALOT
  rationale: חַלּוֹת מַצּוֹת는 누룩이 없는 반죽 덩어리/떡류를 가리키며, 한국어에서는 제의적 전문어를 그대로 살린 ‘무교병’보다 뜻이 바로 드러나는 ‘누룩 없는 과자’가 문맥상 더 투명합니다.
- source_word: וּרְקִיקֵי מַצּוֹת
  english_pob_choice: or unleavened wafers
  chosen_korean: 또는 누룩 없는 전병
  alternatives_korean:
  - 그리고 누룩 없는 전병
  - 누룩 없는 얇은 과자
  lexicon: HALOT
  rationale: רְקִיקִים은 얇게 편 반죽을 가리키므로 ‘전병’이 모양을 가장 잘 전달합니다. קשר의 뉘앙스는 POB처럼 대안적 열거로 이해하여 ‘또는’으로 처리했습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 범주를 어떻게 한국어로 드러낼지
  chosen_reading: ‘소제’로 옮겨 제의 분류를 유지했습니다.
  alternative_readings:
  - ‘곡식 제물’
  - ‘곡식 예물’
  rationale: 이 문맥의 מִנְחָה는 일반 선물보다 레위기의 제물 범주를 뜻하므로, 의미를 넓히기보다 제의적 지정성을 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms, or documented exception.'
