language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
  footnotes:
  - marker: a
    text: Or 'an offering by fire, a pleasing aroma to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 제사장은 곡식제물에서 그 기념 부분을 들어 올려 제단 위에서 불살라야 합니다. 그것은 화제, 야훼께 드리는 향기로운 냄새입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물, 야훼께 드리는 향기로운 냄새’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵרִים
  english_pob_choice: shall lift up
  chosen_korean: 들어 올려
  alternatives_korean:
  - 취하여
  - 가져다가
  - 들어
  lexicon: HALOT
  rationale: 제사장이 제물 가운데 특정 부분을 들어 올려 분리해 내는 제의적 동작을 살리기 위해, 평이한 ‘취하여’보다 구체적인 ‘들어 올려’를 택했습니다.
- source_word: מִן הַמִּנְחָה
  english_pob_choice: from the grain offering
  chosen_korean: 곡식제물에서
  alternatives_korean:
  - 소제에서
  - 곡식 예물에서
  - 곡물 제물에서
  lexicon: HALOT
  rationale: 레위기 2장의 מִנְחָה는 문맥상 곡식제물을 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘곡식제물’로 옮겼습니다.
- source_word: אַזְכָּרָתָהּ
  english_pob_choice: its memorial portion
  chosen_korean: 그 기념 부분
  alternatives_korean:
  - 그 기억 부분
  - 그 기념물
  - 기념 몫
  lexicon: HALOT
  rationale: 이 용어는 제물 전체가 아니라 하나님 앞에 올려지는 대표 몫을 가리키므로, 그 기능을 드러내는 ‘기념 부분’으로 번역했습니다.
- source_word: אִשֵּׁה רֵיחַ נִיחֹחַ
  english_pob_choice: a food offering, a pleasing aroma
  chosen_korean: 화제, 야훼께 드리는 향기로운 냄새
  alternatives_korean:
  - 불로 드리는 제물, 야훼께 드리는 향기로운 냄새
  - 불살라 드리는 제물, 야훼께 기쁘신 향기
  lexicon: HALOT
  rationale: אִשֵּׁה는 전통적 ‘화제’ 표현을 유지해 제의적 범주를 보존했고, רֵיחַ נִיחֹחַ는 단순한 향기보다 수납·기쁨의 의미를 살려 ‘향기로운 냄새’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 고유명사 יהוה는 학술 음역인 ‘야훼’로 유지하여 히브리어 원문과의 대응을 분명히 했습니다.
  doctrine_reference: POB glossary default; source-grounded divine name policy
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ의 제의적 의미
  chosen_reading: 화제, 야훼께 드리는 향기로운 냄새
  alternative_readings:
  - 불로 드리는 제물, 야훼께 드리는 향기로운 냄새
  - 불살라 드리는 제물, 야훼께 기쁘신 향기
  rationale: 이 표현은 단순한 후각 묘사가 아니라 제물이 받아들여짐을 나타내는 제의 공식이므로, 의미를 완화하지 않고 제사 언어로 보존했습니다.
  doctrine_reference: Priestly sacrificial formula; translation philosophy §§1, 6
