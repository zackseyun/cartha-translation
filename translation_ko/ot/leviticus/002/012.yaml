  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
  footnotes:
  - marker: a
    text: Or 'a firstfruits offering.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'they shall not go up to the altar for a pleasing aroma,' an idiom for being offered on the altar as an acceptable burnt offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫 열매의 제물로 그것들을 야훼께 드릴 수는 있으나, 제단 위에 올라가 향기로운 향이 되어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘첫 열매 제물.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  english_pob_choice: an offering of firstfruits
  chosen_korean: 첫 열매의 제물
  alternatives_korean:
  - 첫 열매 제물
  - 초실의 제물
  - 첫 수확의 제물
  lexicon: HALOT
  rationale: קָרְבַּן רֵאשִׁית의 제의적 결합을 한국어에서도 소유격 구조로 살려, ‘첫 열매’와 ‘제물’의 관계가 분명하게 드러나도록 했습니다.
- source_word: תַּקְרִיבוּ
  english_pob_choice: you may present
  chosen_korean: 드릴 수는 있으나
  alternatives_korean:
  - 바칠 수 있으나
  - 드리게 하실 수 있으나
  - 드리실 수 있으나
  lexicon: HALOT
  rationale: 히필 동사의 제의적 의미를 ‘드리다’로 자연스럽게 옮기되, POB의 허용적 뉘앙스를 반영해 ‘수는 있으나’로 처리했습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  - 하나님께
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신명은 ‘야훼’로 옮기고, ל의 헌정/귀속 방향을 한국어 여격 ‘-께’로 표현했습니다.
- source_word: לֹא יַעֲלוּ לְרֵיחַ נִיחֹחַ
  english_pob_choice: they must not go up on the altar as a pleasing aroma
  chosen_korean: 제단 위에 올라가 향기로운 향이 되어서는 안 됩니다
  alternatives_korean:
  - 제단 위로 올라가 향기로운 향으로 드려져서는 안 됩니다
  - 제단 위에 올라가 기쁜 향이 되어서는 안 됩니다
  - 제단 위에 올라가 받아들여질 향이 되어서는 안 됩니다
  lexicon: HALOT
  rationale: ‘올라가다’의 문자적 이미지와 제의적 관용구를 함께 보존하면서, פִּי/נִיחוֹחַ의 수용 가능성을 한국어의 ‘향기로운 향’으로 전달했습니다.
theological_decisions:
- issue: 제단 위에 올라가는 행위의 제의적 함의
  chosen_reading: 단순한 물리적 상승이 아니라 제단에서 번제처럼 바쳐지는 제의적 행위를 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 그냥 제단 위로 올라가서는 안 된다는 문자적 금지
  - 제단에 바쳐져서는 안 된다는 해석적 번역
  rationale: העלה는 제의 문맥에서 ‘제단에 올라가 바쳐지다’의 관용적 뜻을 가지므로, 의미를 분명히 하되 원문의 은유를 지우지 않도록 절충했습니다.
  doctrine_reference: Leviticus sacrificial context; idiomatic cultic usage of עלה
- issue: 향기로운 향(לְרֵיחַ נִיחֹחַ)의 기능
  chosen_reading: 하나님께 받아들여지는 제물의 상징적 표현으로 이해해, 직역과 기능적 의미를 함께 살렸습니다.
  alternative_readings:
  - 좋은 냄새
  - 달콤한 향
  - 기쁜 향
  rationale: 이 관용구는 감각 묘사라기보다 제물이 합당하게 받아들여짐을 나타내므로, 지나치게 감각적이거나 완화된 표현을 피했습니다.
  doctrine_reference: Sacrificial idiom in Pentateuch
