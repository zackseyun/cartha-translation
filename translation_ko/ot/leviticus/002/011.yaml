language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'offering by fire.' The Hebrew term refers to an offering presented on the altar by burning.
    reason: lexical_alternative
  - marker: b
    text: '''Honey'' may in ancient usage also include fruit syrup, not only bee honey.'
    reason: cultural_note
translation:
  language: ko
  text: 여호와께 드리는 모든 곡식 제물은 누룩으로 만들지 마십시오. 어떤 누룩이나 어떤 꿀도 그것을 불살라 여호와께 드리는 음식 제물로 삼아서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불살라 드리는 제물'이라는 뜻입니다. 히브리어 용어는 제단 위에서 불로 올려 드리는 제물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '''꿀''은 고대 용례에서 벌꿀만이 아니라 과일 시럽까지 포함할 수 있습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 예물
  - 곡식 제사
  lexicon: HALOT
  rationale: 레위기 2장의 מִנְחָה는 일반적 '예물'이 아니라 곡물/가루를 바탕으로 한 제의이므로, 문맥상 범위를 분명히 하는 '곡식 제물'로 옮겼습니다.
- source_word: תַּקְרִיבוּ
  english_pob_choice: you present
  chosen_korean: 드리실
  alternatives_korean:
  - 가져오실
  - 제시하실
  - 바치실
  lexicon: HALOT
  rationale: 제의 문맥의 קרב는 하나님께 제물을 '드리다/가져오다'의 뜻이므로, 한국어에서는 자연스럽고 공손한 '드리다'로 표현했습니다.
- source_word: חָמֵץ / שְׂאֹר
  english_pob_choice: leaven / leaven
  chosen_korean: 누룩
  alternatives_korean:
  - 효모
  - 발효제
  - 누룩된 것
  lexicon: HALOT
  rationale: 두 히브리어가 모두 발효시키는 재료를 가리키므로, 제의 규정의 용어 일관성을 위해 표준적인 '누룩'으로 통일했습니다.
- source_word: דְּבַשׁ
  english_pob_choice: honey
  chosen_korean: 꿀
  alternatives_korean:
  - 조청
  - 시럽
  - 과즙
  lexicon: HALOT
  rationale: 기본 어휘 의미는 '꿀'이며, 고대에는 과일 시럽까지 포괄할 수 있으나 본문에서는 가장 직접적인 번역을 본문에 두고 그 범위를 그대로 반영했습니다.
- source_word: אִשֶּׁה
  english_pob_choice: food offering
  chosen_korean: 음식 제물
  alternatives_korean:
  - 화제
  - 불살라 드리는 제물
  - 불제사
  lexicon: HALOT
  rationale: אִשֶּׁה는 불로 올려 드리는 제의적 제물을 뜻하므로, 영어 POB의 'food offering'을 반영하되 한국어에서는 그 기능을 드러내는 '음식 제물'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB가 LORD를 사용하고 있어, 한국어 본문에서는 한국 교회 독자에게 익숙한 전통 표기를 따르되, 원문 추적은 별도 주석 체계로 유지할 수 있습니다.
  doctrine_reference: POB 표기 관행 및 한국어 가독성
- issue: אִשֶּׁה의 제의적 의미
  chosen_reading: 음식 제물
  alternative_readings:
  - 화제
  - 불로 드리는 제물
  rationale: 본문의 금지는 단순한 조리법이 아니라 야훼께 올려지는 제물의 성격에 관한 것이므로, '불살라'와 결합해 제의적 의미가 드러나도록 처리했습니다.
  doctrine_reference: 레위기 제사 용어 일관성
