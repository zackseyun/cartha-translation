  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
  footnotes:
  - marker: a
    text: Or, “from the offerings made by fire to the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 소제물에서 남은 것은 아론과 그의 아들들에게 속할 것이며, 지극히 거룩한 것으로서 야훼의 화제물 가운데에서 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 화제물 가운데에서’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  english_pob_choice: And what remains
  chosen_korean: 그리고 … 남은 것은
  alternatives_korean:
  - 그리고 … 남는 것은
  - 그리고 남은 부분은
  lexicon: HALOT
  rationale: 분사형 명사구를 자연스러운 한국어 주어로 옮겨, 제물의 ‘남은 몫’이라는 뜻을 살렸습니다.
- source_word: מִן הַמִּנְחָה
  english_pob_choice: of the grain offering
  chosen_korean: 소제물에서
  alternatives_korean:
  - 곡식 제물에서
  - 소제에서
  lexicon: HALOT
  rationale: 레위기 2장의 מִנְחָה는 일반적 ‘예물’보다 제의적 ‘소제’에 해당하므로, POB의 grain offering을 한국어 제의 용어로 옮겼습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩한 것으로서
  alternatives_korean:
  - 가장 거룩한 것으로서
  - 지성소 같은 것으로서
  lexicon: HALOT
  rationale: 히브리어 최상급 관용구를 설명적으로 풀어, 대상의 성격이 ‘지극히 거룩함’임을 분명히 했습니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼의 화제물 가운데에서 나옵니다
  alternatives_korean:
  - 야훼께 드리는 화제물 가운데에서
  - 야훼의 불로 드리는 제물 가운데에서
  lexicon: HALOT
  rationale: אִשֵּׁי를 전통적 ‘화제물’로 유지하되, מִן의 분리를 한국어 조사와 ‘가운데에서’로 자연스럽게 드러냈습니다. POB의 Yahweh도 야훼로 반영했습니다.
theological_decisions:
- issue: ‘야훼’의 표기
  chosen_reading: יוָה는 ‘야훼’로 옮겨, 하나님의 고유 이름을 그대로 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙에 따라 신적 칭호로 대체하지 않고, 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 제물 용어 אִשֵּׁי의 처리
  chosen_reading: ‘화제물’로 옮겨 제의적·불로 드리는 의미를 유지했습니다.
  alternative_readings:
  - 불로 드리는 제물
  - 음식 제물
  rationale: 레위기 제의 문맥에서는 단순한 ‘음식’보다 제단에 불사르는 헌물이라는 성격이 더 핵심이므로, 전통적이면서도 소스에 충실한 용어를 택했습니다.
  doctrine_reference: Leviticus sacrificial terminology policy
