revisions:
- from: 그리고 소제물에서 남은 것은 아론과 그의 아들들에게 속할 것이며, 지극히 거룩한 것으로서 야훼의 화제물 가운데에서 나옵니다.[a]
  to: 소제물에서 남은 것은 아론과 그의 아들들의 몫이며, 야훼의 화제물 가운데 지극히 거룩한 것입니다.[a]
  rationale: The revision removes the unsupported verb ‘나옵니다,’ resolves the tense mismatch, and expresses the final Hebrew phrase as the qualifying cultic category of the priests’ remaining share. It preserves the Hebrew ambiguity of מִן with the natural Korean expression ‘… 가운데,’ while retaining established sacrificial terminology.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:01:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the grain offering, Aaron and his sons as recipients, the superlative holiness expression, and the divine name 야훼. However, ‘야훼의 화제물 가운데에서 나옵니다’ treats the final prepositional phrase as a separate present-tense action (‘comes out’) rather than as the qualifying source/category of the remaining portion. This also creates an unwarranted temporal shift from ‘속할 것이며’ to ‘나옵니다.’
  naturalness: The mixed future and present predicates are unnatural in this legal-priestly statement. ‘아론과 그의 아들들의 몫이며’ and ‘… 지극히 거룩한 것입니다’ give a coherent, formal-polite Korean predication while preserving the verse’s allocation and classification.
  terminology: ‘소제물,’ ‘화제물,’ and ‘야훼’ are appropriate and consistent with the stated lexical and naming policies. ‘지극히 거룩한 것’ faithfully renders קֹדֶשׁ קָדָשִׁים without importing the sanctuary-specific sense of ‘지성소.’
  issues:
  - severity: medium
    issue: The phrase ‘야훼의 화제물 가운데에서 나옵니다’ introduces an unsupported verbal action and changes the clause’s tense.
    rationale: The Hebrew has no verb corresponding to ‘나옵니다’; מֵאִשֵּׁי יְהוָה qualifies the designation ‘most holy.’ The revision renders it as a classification within/from Yahweh’s fire offerings.
  - severity: low
    issue: The existing footnote merely repeats the draft’s problematic ‘가운데에서’ phrasing and does not supply a meaningful lexical alternative.
    rationale: It should instead clarify the traditional term ‘화제물’ as ‘불로 드리는 제물,’ while retaining the source’s relation to Yahweh.
  revised_text: 소제물에서 남은 것은 아론과 그의 아들들의 몫이며, 야훼의 화제물 가운데 지극히 거룩한 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘야훼께 불로 드리는 제물에서’.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported verb ‘나옵니다,’ resolves the tense mismatch, and expresses the final Hebrew phrase as the qualifying cultic category of the priests’ remaining share. It preserves the Hebrew ambiguity of מִן with the natural Korean expression ‘… 가운데,’ while retaining established sacrificial terminology.
