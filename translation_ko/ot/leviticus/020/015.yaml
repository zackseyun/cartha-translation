- from: 누구든지 짐승과 교합하면 반드시 죽임을 당할 것이요 너희는 그 짐승도 죽일지니라
  to: 어떤 남자가 짐승과 성교하면, 그는 반드시 죽임을 당해야 합니다. 너희는 그 짐승도 죽여야 합니다.
  rationale: 원문의 남성 특정성(אִישׁ)을 ‘어떤 남자’로 보존하고, 히브리어 관용구 ‘그의 동침을 짐승에게 주다’가 가리키는 성적 행위를 ‘성교하다’로 명확히 옮겼습니다. ‘반드시 죽임을 당해야 합니다’는 מוֹת יוּמָת의 강조된 법적 사형 선고를 반영하며, 둘째 문장은 복수 청자에게 주어진 명령을 유지했습니다. 현대 표준어 합쇼체에 맞추어 문체를 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:15Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘누구든지’는 히브리어 אִישׁ(남자)를 성별 중립적으로 바꾸므로, 다음 절에서 여성을 별도로 다루는 원문의 구분을 흐립니다. ‘교합’은 현대 한국어에서 다소 낡고 동물의 짝짓기에도 쓰일 수 있어, 성적 행위를 명확히 하는 표현이 더 적절합니다. 사형과 짐승을 죽이라는 명령의 내용은 유지되어야 합니다.
  naturalness: ‘죽임을 당할 것이요 … 죽일지니라’는 현대 표준어 합쇼체에 맞지 않는 고전적 문체입니다. 조건절과 법적 귀결을 현대적인 합쇼체로 옮기는 것이 자연스럽습니다.
  terminology: ‘남자’, ‘성교’, ‘반드시 죽임을 당해야 합니다’, ‘죽여야 합니다’는 원문의 성별 특정성, 성적 의미, 강조된 사형 선고, 복수 청자에게 주어진 명령을 각각 명확하게 반영합니다.
  issues:
  - severity: medium
    issue: ‘누구든지’가 남성 단수 אִישׁ의 성별 특정성을 지웁니다.
    rationale: 원문은 남성 가해자를 명시하며, 바로 다음 절에서 여성의 경우를 따로 규정합니다.
  - severity: medium
    issue: ‘교합’은 현대어에서 의미가 다소 모호하고 문체가 낡았습니다.
    rationale: 문맥상 성적 행위를 분명히 나타내는 현대적이고 격식 있는 표현이 필요합니다.
  - severity: medium
    issue: 초안의 종결형이 현대 formal-polite 합쇼체 기준에 맞지 않습니다.
    rationale: ‘-것이요/-지니라’ 대신 ‘-합니다/-해야 합니다’가 지정된 목표 문체에 부합합니다.
