review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the two kin relationships and retains the singular-to-plural shift, but it mistranslates עֶרְוָה as “음란함” rather than the established sexual-legal idiom of uncovering nakedness, and “그 죄를 당할 것” does not adequately render the idiom “bear their iniquity/guilt.” The singular rationale should refer to “his own flesh/kin,” not plural “their flesh.”
  naturalness: The draft’s final clause is unnatural in modern Korean. The revision uses clear modern formal-polite 합쇼체 while maintaining the legal idiom and the Hebrew’s singular/plural shift.
  terminology: “하체를 드러내다” is the conventional Korean biblical rendering of the Hebrew legal euphemism. “혈육” appropriately conveys שְׁאֵרוֹ (literally ‘his flesh,’ meaning close blood kin); its literal nuance is supplied in a footnote. “죄악을 짊어지다” preserves the compact ambiguity of נשא עון.
  issues:
  - severity: high
    issue: “음란함” for עֶרְוָה
    rationale: “음란함” denotes immorality/obscenity, whereas the Hebrew construct idiom עֶרְוַת ... גלה means literally ‘uncover the nakedness of’ and functions as a sexual-legal euphemism. “하체를 드러내다” preserves the established idiom.
  - severity: high
    issue: Pluralized rationale clause
    rationale: The Hebrew has singular שְׁאֵרוֹ and הֶעֱרָה (‘his kin/flesh; he has exposed’) before shifting to plural liability. The draft changes this to “그들이,” losing the source’s marked shift.
  - severity: medium
    issue: “그 죄를 당할 것이니라” for עֲוֺנָם יִשָּׂאוּ
    rationale: The Hebrew idiom means ‘they shall bear their iniquity/guilt,’ with possible penal implications. “죄를 당하다” is not a natural or sufficiently faithful rendering.
  revised_text: 어머니의 자매나 아버지의 자매의 하체를 드러내지 마십시오. 그는 자기 혈육[a]을 드러냈기 때문입니다. 그들은 자신들의 죄악[b]을 짊어질 것입니다.
