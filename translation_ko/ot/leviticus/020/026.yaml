  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
  footnotes:
  - marker: a
    text: Or 'from the nations.' The Hebrew עַמִּים can mean 'peoples' or, in some contexts, 'nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내게 거룩해야 합니다. 이는 나, 야훼가 거룩하기 때문이며, 내가 너희를 백성들 가운데서 구별하여 내 소유가 되게 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew עַמִּים can mean “peoples” or, in some contexts, “nations.”
    reason: source_note
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  english_pob_choice: You shall be holy to me
  chosen_korean: 너희는 내게 거룩해야 합니다
  alternatives_korean:
  - 너희는 내게 거룩합니다
  - 너희는 내게 성별되어야 합니다
  lexicon: HALOT
  rationale: קְדֹשִׁים의 핵심을 ‘거룩’으로 살리고, לִי는 ‘내게’로 옮겨 관계성과 소속을 유지했습니다. 법적/권면적 문맥이므로 미래적 의무를 갖는 ‘~해야 합니다’가 합쇼체에서 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명 יְהוָה는 제목이 아니라 신적 이름이므로, POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וָאַבְדִּל אֶתְכֶם מִן הָעַמִּים
  english_pob_choice: I have separated you from the peoples
  chosen_korean: 내가 너희를 백성들 가운데서 구별하여
  alternatives_korean:
  - 내가 너희를 민족들 가운데서 분리하여
  - 내가 너희를 나라들 가운데서 나누어
  lexicon: HALOT
  rationale: בדל은 קדש와 겹치지 않도록 ‘구별하다’로 옮겨 분리 행위를 드러냈습니다. מִן הָעַמִּים은 ‘백성들’이 가장 넓고 자연스러우며, 본문의 대비를 유지합니다.
- source_word: לִהְיוֹת לִי
  english_pob_choice: to be mine
  chosen_korean: 내 소유가 되게 하였기 때문입니다
  alternatives_korean:
  - 내 것이 되게 하였기 때문입니다
  - 내게 속하게 하였기 때문입니다
  lexicon: HALOT
  rationale: 최종 목적구는 언약적 소유/귀속을 나타내므로, 한국어에서는 ‘내 소유가 되게’가 의미를 분명히 전달합니다. 단순 소유물을 뜻하는 어감을 피하려고 ‘되게 하였습니다’ 구조를 사용했습니다.
theological_decisions:
- issue: ‘거룩’과 ‘구별’의 이중 표현을 어떻게 살릴 것인가
  chosen_reading: קדש는 ‘거룩’, בדל은 ‘구별하다’로 달리 옮겨 두 개념을 구분했습니다.
  alternative_readings:
  - 둘 다 ‘거룩하게 하다’로 통일
  - 둘 다 ‘구별하다’로 통일
  rationale: 본문은 ישראל의 정체성을 ‘거룩함’으로 규정한 뒤, 그 근거를 야훼의 거룩함에 두고, 별도의 동사 בדל로 민족들 가운데서의 분리를 말합니다. 두 동사를 구분해야 신학적 긴장이 보존됩니다.
  doctrine_reference: Translation philosophy §§3, 5
- issue: 문장 끝의 목적/결과절을 합쇼체로 어떻게 처리할 것인가
  chosen_reading: ‘to be mine’는 ‘내 소유가 되게’로, 전체는 ‘~하였기 때문입니다’로 연결했습니다.
  alternative_readings:
  - ‘내 것이 되도록’
  - ‘내게 속하도록’
  rationale: 원문은 분리의 목적을 드러내므로, 한국어에서는 목적과 결과를 함께 살리는 자연스러운 인과 구조가 적합합니다. ‘내 소유’는 언약적 귀속을 유지하면서도 지나치게 소유물화하지 않습니다.
  doctrine_reference: Translation philosophy §§2, 4
