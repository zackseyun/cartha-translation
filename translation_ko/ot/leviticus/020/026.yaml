revisions:
- from: 너희는 내게 거룩해야 합니다. 이는 나, 야훼가 거룩하기 때문이며, 내가 너희를 백성들 가운데서 구별하여 내 소유가 되게 하였기 때문입니다.[a]
  to: 너희는 내게 거룩한 자들이 되어야 합니다. 나 야훼가 거룩하기 때문입니다. 나는 너희를 여러 백성 가운데서 구별하여 내게 속하게 하였습니다.[a]
  rationale: 'The revision corrects the clause relationship: Yahweh''s holiness alone is introduced as the reason for Israel''s required holiness; Yahweh''s completed act of distinguishing Israel is then stated separately, followed by its purpose, ‘that you might belong to me.’ ‘여러 백성 가운데서’ preserves the collective plural contrast without unnecessarily choosing the narrower ‘nations.’'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders holiness, the divine name, and the distinction between קדש ('holy') and בדל ('separate/distinguish'). However, its final causal linkage makes both Yahweh's holiness and his separating action grounds for the command. In the Hebrew, 'because I, Yahweh, am holy' is the ground, while 'I have separated you ... to be mine' is a coordinate statement with a purpose clause.
  naturalness: The proposed revision uses clear modern formal-polite Korean and separates the clauses so that the purpose of the separation is immediately clear.
  terminology: ‘야훼,’ ‘거룩,’ and ‘구별하다’ are appropriate and consistent. ‘내게 속하게’ expresses the final לִי ('to be mine/to belong to me') naturally without the potentially objectifying nuance of ‘내 소유.’ The note is supplied in Korean and retains the stated lexical alternative.
  issues:
  - severity: high
    issue: The phrase ‘내가 너희를 백성들 가운데서 구별하여 내 소유가 되게 하였기 때문입니다’ is joined to the preceding ‘이는 ... 때문이며,’ as a second reason for the holiness command.
    rationale: The final לִהְיוֹת לִי is a purpose/result infinitive dependent on ‘I have separated you,’ not a second causal ground introduced by ‘because.’ The Korean sentence should preserve the Hebrew coordination and purpose relation.
  - severity: low
    issue: The footnote is in English in an otherwise Korean translation.
    rationale: A Korean footnote is needed for a complete, reader-facing Standard Korean text.
  revised_text: 너희는 내게 거룩한 자들이 되어야 합니다. 나 야훼가 거룩하기 때문입니다. 나는 너희를 여러 백성 가운데서 구별하여 내게 속하게 하였습니다.[a]
  revised_footnotes:
  - marker: a
    text: 히브리어 עַמִּים은 ‘백성들’을 뜻할 수 있으며, 어떤 문맥에서는 ‘민족들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the clause relationship: Yahweh''s holiness alone is introduced as the reason for Israel''s required holiness; Yahweh''s completed act of distinguishing Israel is then stated separately, followed by its purpose, ‘that you might belong to me.’ ‘여러 백성 가운데서’ preserves the collective plural contrast without unnecessarily choosing the narrower ‘nations.’'
