  source_fidelity: 핵심 의미와 법적 형벌 진술은 대체로 원문에 충실합니다. 그러나 זָכָר는 앞선 אִישׁ와 구별되는 ‘male’인데, 초안은 둘 다 ‘남자’로 옮겨 그 어휘적 구별을 흐립니다. 또한 마지막 관용구의 ‘그들 위에’는 한국어로 부자연스럽습니다.
  naturalness: ‘남자가 여자와 동침하듯이 한 남자와 동침하면’은 같은 명사가 연이어 나오고 ‘한 남자’의 수식 범위가 잠시 불분명합니다. ‘한 남자가 … 남성과 동침하면’이 법문으로 더 명료합니다. ‘그들의 피는 그들에게 있습니다’는 원문의 법적 관용구를 보존하면서 한국어 성경 문체에도 더 자연스럽습니다.
  terminology: ‘동침하다’, ‘가증한 일’, ‘반드시 죽임을 당해야 합니다’는 문맥과 합쇼체 법문에 적절합니다. אִישׁ는 ‘남자’, זָכָר는 ‘남성’으로 구별하여 원문의 선택을 반영합니다. 현대 정체성 범주는 덧붙이지 않습니다.
