id: LEV.20.13
reference: Leviticus 20:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
  footnotes:
  - marker: a
    text: Hebrew 'as the lyings of a woman,' an idiom for sexual intercourse with a woman.
    reason: lexical_alternative
  - marker: b
    text: Or 'their bloodguilt is upon them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남자가 여자와 동침하듯이 한 남자와 동침하면, 둘 다 가증한 일을 저지른 것입니다. 그들은 반드시 죽임을 당해야 합니다. 그들의 피가 그들 위에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여자의 동침들’이지만, 여자와의 성관계를 가리키는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그들의 피책임이 그들 위에 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  english_pob_choice: If a man
  chosen_korean: 남자가
  alternatives_korean:
  - 어떤 남자가
  - 만일 한 남자가
  lexicon: HALOT
  rationale: 이 법조문의 조건문은 한국어에서 자연스럽게 조건을 이끄는 표현으로 옮기되, אִישׁ의 남성 단수성을 살려 ‘남자’로 번역했습니다.
- source_word: יִשְׁכַּב אֶת זָכָר
  english_pob_choice: lies with a male
  chosen_korean: 한 남자와 동침하면
  alternatives_korean:
  - 남자와 잠자리를 같이하면
  - 남자와 관계를 가지면
  lexicon: HALOT
  rationale: שׁכב는 이 문맥에서 성적 결합의 관용구이므로 직설적이면서도 완곡하지 않은 ‘동침하다’를 택했습니다. זָכָר는 ‘남자’보다 성별 표지인 ‘남자’를 유지해, 앞의 אִישׁ과 구별되는 어감을 살렸습니다.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  english_pob_choice: as one lies with a woman
  chosen_korean: 여자와 동침하듯이
  alternatives_korean:
  - 여자의 동침처럼
  - 여자와 관계하듯이
  lexicon: HALOT
  rationale: 직역하면 어색한 복수구이므로, POB의 주석이 밝히는 관용적 의미를 따라 ‘여자와 동침하듯이’로 옮겨 성적 행위의 관용적 뜻을 드러냈습니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 혐오스러운 일
  - 역겨운 일
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 강한 도덕·언약적 무게를 한국어 성경에서 널리 쓰는 ‘가증한 일’로 보존했습니다.
- source_word: דְּמֵיהֶם בָּם
  english_pob_choice: their blood is on them
  chosen_korean: 그들의 피가 그들 위에 있습니다
  alternatives_korean:
  - 그들의 피는 그들에게 있습니다
  - 그들의 피값은 그들 자신에게 있습니다
  lexicon: HALOT
  rationale: 이 관용구는 책임이 행위자에게 있다는 법적 표현이므로, 직설적인 ‘~위에 있습니다’로 옮겨 책임 귀속의 힘을 유지했습니다.
theological_decisions:
- issue: 현대 범주를 본문에 덧붙일지 여부
  chosen_reading: 행위 중심의 히브리어 법문을 그대로 따라, 현대의 정체성 범주나 해설적 확장을 넣지 않았습니다.
  alternative_readings:
  - 동성애 행위로 옮기기
  - 동성 간 성행위로 풀어쓰기
  rationale: 원문은 특정 행위를 법적 언어로 규정할 뿐이므로, 본문에 없는 현대 범주를 끼워 넣지 않고 원문의 범위를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 형벌 진술의 강도
  chosen_reading: ‘반드시 죽임을 당해야 합니다’로 강한 의무와 형벌을 직접 살렸습니다.
  alternative_readings:
  - 죽어야 합니다
  - 사형에 처해야 합니다
  rationale: מוֹת יוּמָתוּ의 강조를 약화하지 않으면서도, 법문체의 엄중함을 한국어로 자연스럽게 전달했습니다.
  doctrine_reference: Translation philosophy §2
