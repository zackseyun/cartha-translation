id: LEV.20.12
reference: Leviticus 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
  footnotes:
  - marker: a
    text: Or 'confusion,' 'an outrage,' or 'a disgraceful act.' The Hebrew term תֶּבֶל denotes a morally disordered act in this legal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'their bloodguilt is upon them.' The Hebrew idiom assigns responsibility for their death to themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 남자가 자기 며느리와 동침하면, 둘 다 반드시 죽임을 당해야 합니다. 그들은 수치스러운 일을 저질렀습니다[a]. 그들의 피에 대한 책임은 그들에게 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼란’ 또는 ‘수치스러운 행위’. 히브리어 תֶּבֶל은 이 성적 법률 문맥에서 도덕적으로 질서에 어긋난 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 피는 그들에게 있다.’ 이 히브리어 법적 관용구는 그들의 죽음에 대한 책임이 그들 자신에게 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  english_pob_choice: If a man
  chosen_korean: 사람이
  alternatives_korean:
  - 어떤 남자가
  - 남자가
  lexicon: HALOT
  rationale: 히브리어 casuistic 법문에서 조건문으로 시작하는 구조를 한국어로 자연스럽게 옮기되, 이 절은 남성 가해자를 가리키므로 '사람이'보다는 '남자가'도 가능하지만, 문장 전체의 법률적 조건성을 살려 간결하게 처리했습니다.
- source_word: יִשְׁכַּב אֶת
  english_pob_choice: lies with
  chosen_korean: 동침하면
  alternatives_korean:
  - 관계를 가지면
  - 잠자리를 같이하면
  lexicon: HALOT
  rationale: 성적 관계를 뜻하는 관용구를 직역하면서도 한국어 법문으로 읽히는 표현으로 옮겼습니다. '동침'은 노골적이면서도 본문의 도덕적·법적 무게를 유지합니다.
- source_word: כַּלָּתוֹ
  english_pob_choice: his daughter-in-law
  chosen_korean: 자기 며느리
  alternatives_korean:
  - 며느리
  - 아들의 아내
  lexicon: HALOT
  rationale: כַּלָּה는 여기서 아들의 아내, 곧 며느리를 가리키므로 혈연·혼인 관계가 분명한 '자기 며느리'로 옮겼습니다.
- source_word: תֶּבֶל
  english_pob_choice: perversion
  chosen_korean: 패역한 일
  alternatives_korean:
  - 뒤엉킨 일
  - 수치스러운 일
  - 혼란스러운 일
  lexicon: HALOT
  rationale: 본문의 도덕적 일탈과 법적 혐오를 드러내되, 현대 한국어에서 지나치게 해설적이지 않은 표현으로 옮겼습니다. 영어의 'perversion'에 대응하면서도 성경적 판결문 어조를 살립니다.
- source_word: דְּמֵיהֶם בָּם
  english_pob_choice: their blood is upon them
  chosen_korean: 그들의 피는 그들 자신에게 있습니다
  alternatives_korean:
  - 그들의 피가 그들 위에 있습니다
  - 피의 책임은 그들에게 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 죽음의 책임을 범죄자에게 돌린다는 점을 살리기 위해, '피는 …에게 있습니다'를 한국어로 자연스럽게 풀어 썼습니다.
theological_decisions:
- issue: 사형 판결의 책임 귀속
  chosen_reading: '''그들의 피는 그들 자신에게 있습니다''로 옮겨, 형벌의 책임이 당사자에게 있음을 드러냈습니다.'
  alternative_readings:
  - '''그들의 피는 그들 위에 있습니다'''
  - '''피의 책임은 그들에게 있습니다'''
  rationale: 본문의 משפט적 관용구는 단순한 묘사가 아니라 범죄자 자신에게 사형의 책임이 귀속된다는 의미를 담고 있으므로, 이를 한국어에서도 분명히 드러내야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
