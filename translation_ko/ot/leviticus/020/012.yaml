  source_fidelity: 수정이 필요합니다. אָישׁ는 이 법조항에서 남성 행위자를 명시하므로 ‘사람’보다 ‘남자’가 정확합니다. תֶּבֶל은 ‘패역’(반역·불순종의 뉘앙스)으로 옮기기보다, 성적 법규 문맥의 수치스럽고 질서에 어긋난 행위를 가리키는 표현으로 번역하는 편이 적절합니다. 마지막 관용구는 피/죽음에 대한 책임이 당사자들에게 귀속됨을 뜻합니다.
  naturalness: ‘그들의 피는 그들 자신에게 있습니다’는 직역의 흔적이 강합니다. ‘그들의 피에 대한 책임은 그들에게 있습니다’는 현대 한국어 합쇼체에서 자연스럽고, 관용구의 법적 기능도 드러냅니다.
  terminology: ‘동침’과 ‘며느리’는 정확하고 법문에 어울립니다. ‘패역한 일’은 תֶּבֶל의 어휘 의미 및 현대 용법에 맞지 않으므로 ‘수치스러운 일’로 고칩니다. 각주에서는 ‘혼란’이라는 전통적/어휘적 가능성을 함께 밝혀 의미의 불확실성을 보존합니다.
