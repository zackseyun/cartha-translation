    text: Or, 'who makes you holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 규례들을 지키고 그것들을 행해야 합니다. 나는 너희를 거룩하게 하시는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 거룩하게 만드시는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  english_pob_choice: You shall keep
  chosen_korean: 지키고
  alternatives_korean:
  - 보존하고
  - 준수하고
  - 지켜야 합니다
  lexicon: HALOT
  rationale: שמר는 문맥상 ‘지키다, 준수하다’의 뜻이므로, 율법 문맥에서 가장 자연스럽고 간결한 ‘지키다’를 택했습니다. 동사의 연결을 살려 뒤의 ‘행하다’와 병렬을 이루게 했습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법규들
  - 내 법도들
  - 내 법령들
  lexicon: HALOT
  rationale: חֻקָּה는 토라 문맥에서 제정된 규정, 곧 ‘규례’로 옮기는 것이 가장 안정적입니다. 한국 교회어의 ‘법도’보다 법적·규범적 성격이 분명하게 드러납니다.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  english_pob_choice: and do them
  chosen_korean: 그것들을 행해야 합니다
  alternatives_korean:
  - 그것들을 해야 합니다
  - 그것들을 실천해야 합니다
  - 그것들을 수행해야 합니다
  lexicon: HALOT
  rationale: עשה는 단순한 동의가 아니라 실제 이행을 가리키므로, 구체적인 실행을 드러내는 ‘행하다’를 택했습니다. 대상을 명시한 ‘그것들’은 히브리어 목적어를 그대로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전에 정해진 번역 원칙에 따라 신명기적·언약적 고유명은 ‘야훼’로 옮겼습니다. 이는 호칭 ‘주님’과 구별되어 원문의 인칭적 신명성을 보존합니다.
- source_word: מְקַדִּשְׁכֶם
  english_pob_choice: who sanctifies you
  chosen_korean: 너희를 거룩하게 하시는
  alternatives_korean:
  - 너희를 성결하게 하시는
  - 너희를 성별하시는
  - 너희를 거룩하게 만드시는
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩하게 하다’이므로, 한국어에서도 표준적인 성경 어휘인 ‘거룩하게 하다’를 유지했습니다. ‘하시는’으로 현재 분사적 성격을 살려 야훼의 지속적 행위를 나타냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 제목어가 아니라 고유명으로 드러내는 ‘야훼’가 원문 의도를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: קדשׁ의 의미 범위
  chosen_reading: 거룩하게 하시는
  alternative_readings:
  - 성결하게 하시는
  - 성별하시는
  - 거룩하게 만드시는
  rationale: 이 구절은 순종의 근거를 야훼의 거룩하게 하시는 მოქმედ에 둡니다. ‘거룩하게 하시는’은 도덕적 개선으로만 축소하지 않고 성결 언어의 성경적 연속성을 유지합니다.
  doctrine_reference: DOCTRINE.md §5 Consistency of key terms, or documented exception
