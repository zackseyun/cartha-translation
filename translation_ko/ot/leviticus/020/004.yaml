  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
  footnotes:
  - marker: a
    text: Or 'ignore that man completely'; the Hebrew idiom is literally 'hide their eyes from that man.'
    reason: lexical_alternative
  - marker: b
    text: '''Offspring'' is literally ''seed,'' here referring to his children.'
    reason: lexical_alternative
  - marker: c
    text: Molech may refer to a deity or a type of child-sacrifice rite; alternatively, some have read 'to the king.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그 땅의 백성이 그 사람이 자기 자녀 일부를[b] 몰렉에게[c] 줄 때, 그 사람을 일부러 못 본 체하여[a] 그를 죽이지 않으려 한다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 '그 사람에게서 그들의 눈을 숨기다'입니다. 곧, 그를 고의로 못 본 체하거나 묵인한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''자녀''는 문자적으로는 ''씨''에 해당하며, 여기서는 그의 자녀들을 가리킵니다. 또한 ''일부''라는 뜻이 포함되어 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''몰렉''은 문맥상 신명 또는 자녀 희생 제의를 가리키는 것으로 이해됩니다. 일부는 이를 ''왕''으로 읽기도 합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אִם הַעְלֵם יַעְלִימוּ
  english_pob_choice: deliberately close their eyes
