language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
  footnotes:
  - marker: a
    text: Or 'ignore that man completely'; the Hebrew idiom is literally 'hide their eyes from that man.'
    reason: lexical_alternative
  - marker: b
    text: '''Offspring'' is literally ''seed,'' here referring to his children.'
    reason: lexical_alternative
  - marker: c
    text: Molech may refer to a deity or a type of child-sacrifice rite; alternatively, some have read 'to the king.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그 땅의 백성이 그 사람이 자기의 자손을 몰렉에게 줄 때 그 사람에게서 눈을 감아 버려, 그를 죽이지 않으려고 한다면[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 살리면 '그 사람에게서 눈을 감다'입니다. 곧, 그를 고의로 못 본 척한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''자손''은 문자적으로는 ''씨''에 해당하며, 여기서는 그의 자녀들을 가리킵니다.'
    reason: lexical_alternative
  - marker: c
    text: '''몰렉''은 문맥상 신명(혹은 자녀 희생 제의)을 가리키는 것으로 이해됩니다. 일부는 이를 ''왕''으로 읽기도 합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אִם הַעְלֵם יַעְלִימוּ
  english_pob_choice: deliberately close their eyes
  chosen_korean: 눈을 감아 버려
  alternatives_korean:
  - 의도적으로 눈을 감고
  - 애써 모른 체하고
  - 숨기듯 눈을 감고
  lexicon: HALOT
  rationale: 반복형으로 된 강조를 한국어에서 자연스럽게 살리기 위해 단순한 '무시하다'보다 '눈을 감아 버리다'를 택했고, 행위를 의도적으로 회피하는 뉘앙스를 담았습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 지역의 백성
  - 그 땅의 주민들
  lexicon: HALOT
  rationale: 법적 문맥에서 공동체 전체를 가리키는 표현이므로, 직역에 가깝지만 한국어로도 통하는 '그 땅의 백성'으로 옮겼습니다.
- source_word: מִזַּרְעוֹ
  english_pob_choice: some of his offspring
  chosen_korean: 자손을
  alternatives_korean:
  - 씨를
  - 후손을
  - 자녀를
  lexicon: HALOT
  rationale: 히브리어 '씨/זרע'의 부분적 의미를 담되, 제의·법정 맥락에서 자연스러운 현대어로는 '자손'이 가장 직접적입니다.
- source_word: לַמֹּלֶךְ
  english_pob_choice: to Molech
  chosen_korean: 몰렉에게
  alternatives_korean:
  - 몰렉에게로
  - 왕에게
  - 몰렉 신에게
  lexicon: HALOT
  rationale: 문맥상 금지된 제의 대상 이름으로 보는 것이 타당하므로, 관례적 음역인 '몰렉'을 유지했습니다.
- source_word: לְבִלְתִּי הָמִית אֹתֽוֹ
  english_pob_choice: so as not to put him to death
  chosen_korean: 그를 죽이지 않으려고 한다면
  alternatives_korean:
  - 그를 사형에 처하지 않으려고 한다면
  - 그를 죽이지 않게 되면
  - 그에게 사형을 집행하지 않으려고 한다면
  lexicon: HALOT
  rationale: 히브리어의 목적/결과 구조를 한국어 조건문으로 자연스럽게 풀어, 법적 의미의 '죽이다'를 유지했습니다.
theological_decisions:
- issue: לַמֹּלֶךְ의 이해
  chosen_reading: 몰렉으로 음역하여, 금지된 제의 대상 이름으로 읽었습니다.
  alternative_readings:
  - '''왕''으로 번역'
  - 설명적으로 '몰렉 신'으로 번역
  rationale: 주변 문맥(레 18:21; 20:2-5)이 우상 숭배 금지 규정이므로, '왕'이라는 일반명사보다 고유명사/제의명으로 처리하는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 레위기 18:21; 20:2-5
