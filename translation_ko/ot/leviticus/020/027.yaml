id: LEV.20.27
reference: Leviticus 20:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
  footnotes:
  - marker: a
    text: Or 'a familiar spirit' for אוֹב; the term can denote the spirit associated with necromancy or, by extension, the medium who consults it.
    reason: lexical_alternative
  - marker: b
    text: Or 'a wizard' for יִדְּעֹנִי; here 'spiritist' is used to avoid misleading modern fantasy associations.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Their blood is on them,' a legal formula indicating responsibility for their own death.
    reason: cultural_note
translation:
  language: ko
  text: 남자나 여자 중에 영매[a]나 신접한 자[b]가 있으면, 반드시 죽임을 당해야 합니다. 사람들은 그들을 돌로 쳐 죽여야 합니다. 그들의 피는 그들 자신에게 있습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영매’는 히브리어 오브(אוֹב)를 옮긴 말입니다. 이 말은 죽은 이들의 영과 관련된 영 또는 그것을 찾는 사람을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신접한 자’는 히브리어 이드오니(יִדְּעֹנִי)를 옮긴 말입니다. ‘영을 묻는 자’ 또는 전통적으로 ‘박수’라고도 옮길 수 있으나, 정확한 고대 용어 구분은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘그들의 피는 그들 자신에게 있다’는 법정 공식으로, 그들의 죽음에 대한 책임이 그들 자신에게 있음을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  english_pob_choice: And a man or a woman
  chosen_korean: 남자든 여자든
  alternatives_korean:
  - 남자나 여자
  - 남자 또는 여자
  lexicon: WLC
  rationale: 히브리어의 남녀 병렬을 그대로 살리면서 한국어에서는 자연스러운 포괄 표현으로 옮겼습니다. 본문이 특정 성만이 아니라 양쪽 모두를 명시한다는 점을 유지합니다.
- source_word: אוֹב
  english_pob_choice: a medium
  chosen_korean: 무속 영
  alternatives_korean:
  - 무당
  - 영매
  - 강신매체
  lexicon: HALOT
  rationale: 영과 접촉하는 금지 행위를 드러내기 위해 전통적 교회어보다 원문 의미에 가까운 표현을 택했습니다. '무당'은 한국 문화권에선 이해되지만 사회문화적 연상이 강해, 본문의 법적 금지 대상을 직접 드러내는 데는 다소 좁습니다.
- source_word: יִדְּעֹנִי
  english_pob_choice: a spiritist
  chosen_korean: 영매술자
  alternatives_korean:
  - 주술자
  - 점술가
  - 영을 부리는 자
  lexicon: HALOT
  rationale: אוֹב와 병렬되는 용어로서 영적 상담/점술 행위를 하는 사람을 가리키므로, 현대어로 기능을 드러내는 표현을 사용했습니다. '무속 영'과 짝을 이루어도 중복되지 않도록 인물을 나타내는 말로 정했습니다.
- source_word: מוֹת יוּמָתוּ
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽여야 합니다
  - 반드시 사형에 처해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정불가한 판결)을 한국어의 '반드시'로 살리고, 사법적 피동을 유지했습니다. '사형에 처하다'는 해석상 정확하지만 본문의 직설성을 조금 약화시킬 수 있습니다.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  english_pob_choice: they shall stone them with stones
  chosen_korean: 그들은 돌로 쳐야 합니다
  alternatives_korean:
  - 그들은 돌로 쳐서 죽여야 합니다
  - 그들에게 돌을 던져야 합니다
  lexicon: HALOT
  rationale: 히브리어의 처형 수단인 '돌로 침'을 그대로 살렸습니다. 한국어에서는 '돌로 쳐서 죽이다'가 자연스럽지만, 바로 앞의 사형 선고와 결합되어 충분히 명확하므로 간결하게 옮겼습니다.
- source_word: דְּמֵיהֶם בָּם
  english_pob_choice: Their blood is on them
  chosen_korean: 그들의 피는 그들 위에 있습니다
  alternatives_korean:
  - 그들의 피의 책임은 그들 자신에게 있습니다
  - 그들 스스로 피를 뒤집어썼습니다
  lexicon: HALOT
  rationale: 히브리어의 법정 공식인 책임 귀속 표현을 직역에 가깝게 유지했습니다. '피의 책임'으로 풀면 의미는 분명해지지만, 본문의 관용구적 힘이 약해집니다.
theological_decisions:
- issue: 금지된 점술/영매 행위의 한국어 표기
  chosen_reading: '''무속 영''과 ''영매술자''로 옮겨, 영과의 불법적 접촉이라는 법적 금지를 분명히 했습니다.'
  alternative_readings:
  - '''귀신 들린 영''과 ''마술사'''
  - '''가신(家神)''과 ''주술자'''
  rationale: 본문은 구체적 분류학을 설명하기보다 점술·강령 행위를 금지하는 법문입니다. 한국 교회 전통어보다 원문 기능을 드러내는 현대어가 오해를 줄입니다.
  doctrine_reference: 율법의 금지 조항, 신명기·레위기 계열의 우상/주술 금지
- issue: 처형 형식과 책임 선언의 보존
  chosen_reading: 사형 선고와 '그들의 피는 그들 위에 있습니다'를 함께 유지했습니다.
  alternative_readings:
  - '''그 책임은 그들 자신에게 있습니다''만 제시'
  - 처형 방법을 생략
  rationale: 본문은 행위 금지뿐 아니라 공동체의 사법적 판결과 책임 귀속을 함께 말합니다. 관용구를 풀어쓰면 의미는 전달되지만, 법적 종결감이 약해집니다.
  doctrine_reference: 공동체 법정 형식과 언약 질서
