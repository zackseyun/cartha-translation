  text: 어떤 남자가 자기 형제의 아내를 취하면, 그것은 부정한 일입니다[a]. 그는 자기 형제의 하체를 드러낸 것입니다. 그들은 자식이 없게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
