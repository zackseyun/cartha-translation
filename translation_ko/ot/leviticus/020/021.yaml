    text: 또는 ‘그것은 부정함이다’ 또는 ‘그것은 더러움이다.’ 히브리어는 의례적·도덕적 의미의 부정 또는 혐오스러움을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 자식 없이 죽게 될 것이다.’ 히브리어는 더 직역하면 ‘그들은 자식이 없을 것이다’이며, 이 심판이 어떻게 이루어지는지는 특정하지 않습니다.
