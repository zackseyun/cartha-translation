    issue: ‘형의 아내’
    rationale: 히브리어 אָחִיו는 손위 형에 한정되지 않고 ‘형제’를 뜻합니다.
  - severity: high
    issue: ‘형의 음란함을 드러냈으니’
    rationale: עֶרְוָה는 여기서 ‘음란함’이라는 추상적 성격이 아니라 불법적 성관계를 가리키는 법률적 관용구 ‘하체/벌거벗음’입니다. 또한 원문은 인과절이라기보다 독립된 판정 진술입니다.
