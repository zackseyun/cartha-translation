  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘형’은 히브리어 אָחִיו(그의 형제)를 ‘손위 형’으로 한정하며, ‘음란함’은 עֶרְוָה(벌거벗음/하체)라는 레위기의 법률적 관용구를 충분히 반영하지 못합니다. ‘자식이 없으리라’의 심판 방식은 원문처럼 특정하지 않아야 합니다.
  naturalness: ‘어떤 남자가 … 하면’과 ‘부정한 일입니다’는 현대 표준어의 격식 있는 법률적 문맥에 자연스럽습니다. 문장 종결을 합쇼체에 맞추고, 원문의 세 절을 분명히 살렸습니다.
  terminology: אָחִיו는 ‘형제’로, עֶרְוַת אָחִיו גִּלָּה는 레위기의 일관된 관용 표현인 ‘자기 형제의 하체를 드러내다’로 옮겼습니다. נִדָּה는 여성을 직접 부정하다고 지칭하지 않도록 행위/관계를 가리키는 ‘부정한 일’로 번역했습니다.
  issues:
