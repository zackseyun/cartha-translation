reference: Leviticus 20:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
  footnotes:
  - marker: a
    text: Or 'spew you out.' The Hebrew verb is literally 'vomit,' a vivid metaphor for the land expelling defiled inhabitants.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''my decrees and my ordinances.'' The Hebrew uses two distinct legal terms: חֻקּוֹת and מִשְׁפָּטִים.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 모든 규례와 내 모든 법도[b]를 지키고 행해야 합니다. 그래야 내가 너희를 그곳으로 데려가 살게 하려는 땅이 너희를 토해 내지[a] 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘토해 내다’는 히브리어 동사의 직역에 가깝습니다. 본문은 땅이 부정한 주민을 밀어내는 강한 비유를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 서로 다른 두 법률 용어(חֻקּוֹת, מִשְׁפָּטִים)를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: So you shall keep
  chosen_korean: 지켜 행하여야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 지키고 행해야 합니다
  lexicon: HALOT
  rationale: שׁמר는 언약 문맥에서 ‘지키다, 준수하다’의 뜻이므로 ‘지켜’로 살리고, 뒤의 ‘עשה’와 함께 규례를 실제로 이행한다는 점을 ‘행하여야 합니다’로 자연스럽게 풀었습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 모든 규례
  alternatives_korean:
  - 내 모든 법령
  - 내 모든 명령
  lexicon: HALOT
  rationale: חֻקּוֹת은 정해진 규범·규정의 의미이므로 한국어에서는 ‘규례’가 가장 가까우며, 뒤의 מִשְׁפָּטִים과 구별을 유지하기 위해 ‘법도’와 같은 일반어보다 법적 색채가 분명한 표현을 택했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 모든 법도
  alternatives_korean:
  - 내 모든 판결
  - 내 모든 규례
  lexicon: HALOT
  rationale: מִשְׁפָּט은 판결·법정 판단·법규의 뜻을 가지므로, כאן에서는 제도적/규범적 뉘앙스를 살려 ‘법도’로 옮겼습니다. ‘규례’와 동일어로 처리하면 히브리어의 이중 법률 용어가 희미해집니다.
- source_word: וְלֹא תָקִיא
  english_pob_choice: may not vomit ... out
  chosen_korean: 토해 내지 않을 것입니다
  alternatives_korean:
  - 게워 내지 않을 것입니다
  - 뱉어 내지 않을 것입니다
  lexicon: HALOT
  rationale: קיא의 직설적이고 강한 비유를 약화하지 않기 위해 ‘토해 내다’를 유지했습니다. ‘거부하다’처럼 완곡화하면 땅의 의인화와 정결 경고의 충격이 줄어듭니다.
theological_decisions:
- issue: 땅의 의인화와 언약적 추방 경고
  chosen_reading: 땅이 거주민을 ‘토해 내는’ 의인화된 심판 경고를 그대로 유지했습니다.
  alternative_readings:
  - 땅이 너희를 거부하지 않을 것입니다
  - 땅이 너희를 쫓아내지 않을 것입니다
  rationale: 본문은 정결/부정의 결과를 생생한 신체적 은유로 표현하므로, 이를 완화하지 않고 보존해야 언약 위반의 गंभीर성을 전달할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 두 법률 용어의 구별
  chosen_reading: חֻקּוֹת과 מִשְׁפָּטִים을 각각 ‘규례’와 ‘법도’로 구분했습니다.
  alternative_readings:
  - 규례와 규례
  - 법령과 법도
  rationale: 히브리어가 서로 다른 두 용어를 병렬로 사용하므로, 한국어에서도 동일어 반복을 피하고 구별을 드러내는 것이 원문의 법적 구조를 보존합니다.
  doctrine_reference: Translation philosophy §5
