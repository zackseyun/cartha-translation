revisions:
- from: 그러므로 너희는 내 모든 규례와 내 모든 법도를 지켜 행하여야 합니다. 그러면 내가 너희를 그곳에 들어가 살게 하려고 데려가는 그 땅이 너희를 토해 내지 않을 것입니다.[a][b]
  to: 너희는 내 모든 규례와 내 모든 법도[b]를 지키고 행해야 합니다. 그래야 내가 너희를 그곳으로 데려가 살게 하려는 땅이 너희를 토해 내지[a] 않을 것입니다.
  rationale: 명령의 병렬 구조를 ‘지키고 행해야 합니다’로 명확히 하고, 해석을 강화하는 ‘그러므로’를 제거했습니다. 거주 목적, 땅의 의인화, ‘토해 내다’의 생생한 은유, 그리고 두 법률 용어의 구별은 유지했습니다. 각주 표지는 각각의 해당 어휘 바로 뒤로 옮겼습니다.
