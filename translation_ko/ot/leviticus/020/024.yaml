  source_fidelity: 수정 전 번역은 ירשׁ의 능동적 점유 의미와 ‘젖과 꿀이 흐르는 땅’을 대체로 충실히 옮겼습니다. 그러나 ‘주어 차지하게 할 것입니다’는 נתן + 목적의 לָרֶשֶׁת를 다소 부자연스러운 사역 표현으로 만들며, 마지막 관계절 ‘너희를 민족들에게서 구별한’이 독립문으로 분리되어 원문의 결속이 약해졌습니다. ‘가운데서’보다 מן에 맞는 ‘민족들에게서/민족들로부터’가 적절합니다.
  naturalness: 합쇼체 문체를 유지하면서 ‘내가 친히 그 땅을 너희에게 주어 차지하게 하겠다’로 목적 관계를 자연스럽게 표현했습니다. 마지막 문장도 관계절을 보존하여 자연스러운 한국어 문장으로 정리했습니다.
