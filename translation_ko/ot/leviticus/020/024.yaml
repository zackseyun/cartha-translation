revisions:
- from: 그러나 내가 너희에게 말하였습니다. ‘너희는 그들의 땅을 차지할 것이며, 나 자신이 그것을 너희에게 주어 차지하게 할 것입니다’ — 곧 젖과 꿀이 흐르는 땅입니다. 나는 너희의 하나님 야훼입니다. 나는 너희를 민족들 가운데서 구별하였습니다.[a][b][c][d]
  to: 그러나 내가 너희에게 말하였습니다. ‘너희는 그들의 땅을 차지할 것이며[a], 내가 친히 그 땅을 너희에게 주어 차지하게 하겠다. 그 땅은 젖과 꿀이 흐르는 땅이다[b].’ 나는 너희를 민족들에게서 구별한 너희의 하나님 야훼입니다[c][d].
  rationale: 목적을 나타내는 לָרֶשֶׁת를 한국어에서 자연스러운 ‘주어 차지하게 하겠다’로 옮기고, 원문의 관계절 구조와 מן의 분리 의미를 보존했습니다. 부정확한 각주 용어와 한국어 문장 안의 불필요한 히브리어 낱말도 수정했으며, 각주 표지를 해당 표현에 배치했습니다.
