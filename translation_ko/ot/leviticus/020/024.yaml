id: LEV.20.24
reference: Leviticus 20:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
  footnotes:
  - marker: a
    text: Or, 'you shall inherit their land ... to inherit it.' The Hebrew verb יָרַשׁ can carry both the sense of inheriting and taking possession.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''a land flowing with milk and honey,'' an idiom for abundance and fertility.'
    reason: cultural_note
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
  - marker: d
    text: Or, 'who has set you apart from the peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 너희에게 말하였습니다. ‘너희는 그들의 땅을 차지할 것이며, 나 자신이 그것을 너희에게 주어 차지하게 할 것입니다’ — 곧 젖과 꿀이 흐르는 땅입니다. 나는 너희의 하나님 야훼입니다. 나는 너희를 민족들 가운데서 구별하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘차지하다’는 כאן의 יָרַשׁ가 지닐 수 있는 ‘상속하다/소유하다’의 의미를 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젖과 꿀이 흐르는 땅’은 히브리어 관용구로서 풍요와 비옥함을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 본문은 신명기적 신적 이름 YHWH를 사용합니다.
    reason: alternative_reading
  - marker: d
    text: ‘구별하다’는 ‘분리하다/따로 세우다’의 의미를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: But I said
  chosen_korean: 그러나 내가 말하였습니다
  alternatives_korean:
  - 그리고 내가 말하였습니다
  - 그래서 내가 말하였습니다
  lexicon: HALOT
  rationale: 문맥의 금지·구별 강조 속에서 전개되는 대조를 살려 ‘그러나’로 옮기되, 히브리어의 서술 진행은 ‘말하였습니다’로 자연스럽게 표현했습니다.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  english_pob_choice: you shall possess ... to possess it
  chosen_korean: 차지할 것이며 ... 차지하게 할 것입니다
  alternatives_korean:
  - 소유할 것이며 ... 소유하게 할 것입니다
  - 상속할 것이며 ... 상속받게 할 것입니다
  lexicon: HALOT
  rationale: ירשׁ의 적극적 ‘점유/차지’ 의미를 살려 두 동사를 같은 어근의 동작으로 유지했습니다. ‘상속하다’는 가능하지만 수동적 뉘앙스가 더 강해 여기서는 덜 적합합니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성경에서 널리 통용되는 방식으로 옮겨 풍요와 비옥함의 이미지를 보존했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: I am Yahweh your God
  chosen_korean: 나는 너희의 하나님 야훼입니다
  alternatives_korean:
  - 나는 너희의 주 하나님입니다
  - 나는 너희의 하나님 여호와입니다
  lexicon: HALOT
  rationale: 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, אַתֶּם/כֶם의 복수 대상을 반영해 ‘너희의 하나님’으로 자연스럽게 표현했습니다.
- source_word: הִבְדַּ֥לְתִּי ... מִן הָעַמִּים
  english_pob_choice: who has separated you from the peoples
  chosen_korean: 너희를 민족들 가운데서 구별하였습니다
  alternatives_korean:
  - 너희를 백성들 가운데서 분리하였습니다
  - 너희를 민족들로부터 따로 세우셨습니다
  lexicon: HALOT
  rationale: בדל의 핵심은 분리·구별이므로, 정체성과 거룩의 함의를 함께 살릴 수 있는 ‘구별하다’를 선택했습니다. ‘민족들’은 עמים의 보다 문자적인 대응입니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 언약 이름을 직접 사용하므로, 대체 칭호가 아니라 고유한 신적 이름을 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘구별하다’의 신학적 뉘앙스
  chosen_reading: 너희를 민족들 가운데서 구별하였습니다
  alternative_readings:
  - 너희를 민족들 가운데서 따로 세웠습니다
  - 너희를 민족들 가운데서 분리하였습니다
  rationale: 본문은 이스라엘의 분리/구별을 선언하지만 그 이유나 결과를 여기서 과도하게 설명하지 않습니다. ‘구별하다’는 거룩의 주제를 유지하면서도 해석을 넘지 않습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
