source:
  edition: WLC
  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
  footnotes:
  - marker: a
    text: Or 'customs' for 'statutes'; the Hebrew term can denote prescribed practices or fixed ordinances.
    reason: lexical_alternative
  - marker: b
    text: Literally 'sending away from before you'; here the sense is expelling or driving out.
    reason: lexical_alternative
  - marker: c
    text: Or 'I abhorred them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내가 너희 앞에서 쫓아내는 민족의 규례[a]를 따라 살지 말아야 합니다. 그들은 이 모든 일을 행하였으므로, 내가 그들을 몹시 싫어하였습니다.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례’는 여기서 정해진 관행이나 고정된 규범까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 앞에서 쫓아내는’은 문자적으로는 ‘너희 앞에서 보내는’이지만, 문맥상 추방·축출의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘몹시 싫어하였습니다’는 히브리어의 강한 혐오 표현을 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  english_pob_choice: shall not walk
  chosen_korean: 따라 살지 말아야 합니다
  alternatives_korean:
  - 행하지 말아야 합니다
  - 걸어가서는 안 됩니다
  lexicon: HALOT
  rationale: הלך의 핵심 이미지인 ‘걷다/행하다’는 윤리적 삶의 방식으로 쓰이지만, 한국어에서는 ‘규례를 따라 살다’가 관용적으로 자연스럽고 의미도 분명합니다.
- source_word: בְּחֻקֹּת
  english_pob_choice: in the statutes
  chosen_korean: 규례를 따라
  alternatives_korean:
  - 규례 안에서
  - 법도들을 따라
  - 조례를 따라
  lexicon: HALOT
  rationale: חֻקּוֹת은 정해진 규범·명령을 가리키므로, 전통적이지만 의미를 유지하는 ‘규례’로 옮기고 행위 접속을 자연스럽게 하였습니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 국가
  - 백성
  lexicon: HALOT
  rationale: 여기서는 가나안의 한 집단 전체를 가리키는 단수 명사이므로, 신약적 ‘이방인’ 의미를 피하면서도 집단성을 살리는 ‘민족’이 적절합니다.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  english_pob_choice: am driving out before you
  chosen_korean: 너희 앞에서 몰아내는
  alternatives_korean:
  - 너희 앞에서 내쫓는
  - 너희 앞에서 보내는
  - 너희 앞에서 쫓아내는
  lexicon: HALOT
  rationale: שׁלח는 문자적으로 ‘보내다’이지만, מִפְּנֵיכֶם과 함께 쓰여 추방·축출의 뜻이므로 ‘몰아내다’가 문맥상 가장 정확합니다.
- source_word: וָאָקֻץ בָּם
  english_pob_choice: and I loathed them
  chosen_korean: 내가 그들을 싫어하였습니다
  alternatives_korean:
  - 내가 그들을 혐오하였습니다
  - 내가 그들을 역겨워하였습니다
  - 내가 그들을 몹시 싫어하였습니다
  lexicon: HALOT
  rationale: קוץ는 강한 혐오·반감을 뜻하지만, 한국어에서 하나님의 정서적 반응을 너무 속되게 만들지 않으면서도 분명한 거부감을 전달하는 ‘싫어하다’가 균형이 좋습니다.
theological_decisions:
- issue: 하나님의 강한 혐오 표현을 어떻게 옮길지
  chosen_reading: ‘내가 그들을 싫어하였습니다’로 직설적이되 비속하지 않게 유지했습니다.
  alternative_readings:
  - ‘내가 그들을 혐오하였습니다’
  - ‘내가 그들을 역겨워하였습니다’
  - ‘내가 그들을 가증히 여겼습니다’
  rationale: 본문은 단순한 불만이 아니라 도덕적·언약적 혐오를 드러내므로 강도를 약화시키지 않아야 합니다. 다만 한국어에서 지나치게 감각적이거나 교회적 고어로 흐르는 표현은 피했습니다.
  doctrine_reference: 신 18:12, 레 11–20의 거룩/부정 구분; anthropopathism을 본문 수준에서 유지
