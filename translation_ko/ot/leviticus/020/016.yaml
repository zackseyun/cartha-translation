  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
  footnotes:
  - marker: a
    text: Or 'to lie with it.' The Hebrew verb specifically refers to sexual intercourse, literally involving mounting.
    reason: lexical_alternative
  - marker: b
    text: Or 'their bloodguilt is upon them.' The idiom means responsibility for their death rests on themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 여자가 어떤 동물과 교접하려고 그 동물에게 가까이 가면[a], 그 여자와 그 동물을 죽여야 합니다. 둘 다 반드시 죽임을 당할 것입니다. 그들의 피에 대한 책임은 그들 자신에게 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘교접하다’는 히브리어 רבע가 여기서 가리키는 성적 결합을 직접 드러내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 피에 대한 책임은 그들 자신에게 있습니다’는 직역하면 ‘그들의 피는 그들 안에 있다’는 뜻의 히브리어 관용구입니다. 이는 그들의 죽음에 대한 책임이 그들 자신에게 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  english_pob_choice: approaches
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 다가가서
  - 접근하여
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 가다/다가오다’를 살리면서, 법문체에서 자연스러운 한국어로 옮겼습니다.
- source_word: לְרִבְעָה אֹתָהּ
  english_pob_choice: to mate with it
  chosen_korean: 그것과 교접하면
  alternatives_korean:
  - 그것과 짝짓기하면
  - 그것과 성관계를 가지면
  - 그것 위에 올라타면
  lexicon: HALOT
  rationale: 여기서는 짐승과의 성적 결합을 가리키므로, 의미를 분명히 드러내는 ‘교접하다’를 택했습니다. POB의 ‘to mate with it’보다 한국어 법문맥에서는 더 직접적이고 정확합니다.
- source_word: וְהָרַגְתָּ
  english_pob_choice: you shall kill
  chosen_korean: 너는 죽여야 합니다
  alternatives_korean:
  - 너는 죽일 것입니다
  - 너는 반드시 죽여야 합니다
  lexicon: HALOT
  rationale: 법률 규정의 명령형 강도를 살리면서, 현대 표준어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מוֹת יוּמָתוּ
  english_pob_choice: They shall surely be put to death
  chosen_korean: 그들은 반드시 죽임을 당할 것입니다
  alternatives_korean:
  - 그들은 반드시 죽을 것입니다
  - 그들은 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 ‘반드시/확실히’라는 강조를 반영해, 단순한 미래형보다 강한 판결 문구로 옮겼습니다.
- source_word: דְּמֵיהֶם בָּם
  english_pob_choice: their blood is on them
  chosen_korean: 그들의 피는 그들 위에 있습니다
  alternatives_korean:
  - 그들의 피의 책임은 그들에게 있습니다
  - 그들의 피값은 그들 자신에게 있습니다
  lexicon: HALOT
  rationale: 관용구의 책임 귀속을 직역에 가깝게 보존하되, 한국어에서도 법적·도덕적 책임이 자신들에게 있음을 드러내도록 했습니다.
theological_decisions:
- issue: 성적 행위의 노골성을 얼마나 직접적으로 드러낼지
  chosen_reading: ‘교접하다’로 옮겨 본문의 금지 행위가 단순한 접촉이 아니라 성적 결합임을 분명히 했습니다.
  alternative_readings:
  - ‘관계를 가지다’처럼 완곡하게 처리함
  - ‘짝짓기하다’처럼 동물학적 표현을 사용함
  rationale: 본문은 우회적 암시가 아니라 법적 금지 조항이며, POB의 source-direct 원칙에 따라 성적 의미를 흐리지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
