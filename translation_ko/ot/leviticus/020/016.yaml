revisions:
- from: 어떤 여자가 어떤 짐승에게 가까이 가서 그것과 교접하면, 너는 그 여자와 그 짐승을 죽여야 합니다. 그들은 반드시 죽임을 당할 것입니다. 그들의 피는 그들 위에 있습니다.[a][b]
  to: 어떤 여자가 어떤 동물과 교접하려고 그 동물에게 가까이 가면[a], 그 여자와 그 동물을 죽여야 합니다. 둘 다 반드시 죽임을 당할 것입니다. 그들의 피에 대한 책임은 그들 자신에게 있습니다.[b]
  rationale: 접근의 목적을 나타내는 히브리어 구문을 ‘교접하려고’로 반영했습니다. ‘동물’은 בְּהֵמָה의 넓은 범위를 현대적으로 전달하며, 마지막 관용구는 책임 귀속을 명시해 한국어 독자가 의미를 정확히 이해하도록 했습니다. 형벌의 엄중함과 반복 강조는 ‘반드시 죽임을 당할 것입니다’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:20Z'
review_pass:
  verdict: revise
  source_fidelity: ‘가까이 가서 그것과 교접하면’은 히브리어의 목적을 나타내는 부정사(‘그것과 교접하려고’)를 실제 행위의 완료 조건처럼 바꿀 여지가 있습니다. 또한 마지막 관용구의 직역은 현대 한국어에서 책임 귀속을 충분히 전달하지 못합니다.
  naturalness: ‘어떤 짐승’과 ‘그들의 피는 그들 위에 있습니다’는 현대 표준어 법문으로 다소 부자연스럽습니다. ‘모든 동물’, ‘피에 대한 책임’ 및 ‘둘 다’를 사용하면 뜻과 문체가 더 명료해집니다.
  terminology: ‘교접하다’는 이 법문맥에서 성적 행위를 직접적이고 격식 있게 나타내므로 유지할 수 있습니다. 다만 각주에 혼입된 히브리어 ‘כאן’은 삭제해야 합니다.
  issues:
  - severity: medium
    issue: 목적 부정사의 의미가 조건절의 실제 행위로 약화될 수 있음
    rationale: לְרִבְעָה는 여자가 동물에게 가까이 가는 목적, 곧 ‘그것과 교접하려고’를 나타냅니다. ‘가서 … 교접하면’은 접근과 교접이 모두 이루어진 뒤의 조건으로 읽힐 수 있습니다.
  - severity: medium
    issue: ‘그들의 피는 그들 위에 있습니다’가 한국어 관용으로 자연스럽지 않음
    rationale: דמיהם בם은 죽음의 책임이 당사자들에게 있다는 법적 관용구입니다. 직역만으로는 물리적인 피의 위치처럼 읽힐 수 있으므로, 책임 귀속을 본문에서 밝혀야 합니다.
  - severity: low
    issue: 각주 a에 불필요한 히브리어 단어가 혼입됨
    rationale: ‘כאן의’는 한국어 문장 안에서 부자연스럽고 본문 어휘 설명에도 필요하지 않습니다.
