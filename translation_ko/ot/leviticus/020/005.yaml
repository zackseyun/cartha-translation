  source_fidelity: 개정이 필요합니다. 초안의 ‘그 사람과 그의 가족에게 나의 얼굴을 돌리겠고’는 히브리어의 대적·심판 관용구를 한국어에서 호의적으로도 읽힐 수 있게 하며, ‘대적하여’라는 방향성을 명시하지 않습니다. 또한 음행 비유의 우상숭배 맥락을 설명하는 주석은 해당 표현에 붙이는 편이 원문의 수사와 주석 앵커를 더 정확히 반영합니다.
  naturalness: ‘내가 친히 그 사람과 그의 가족을 대적하겠고’는 현대 표준어 합쇼체에서 자연스럽고, אֲנִי의 강조도 ‘친히’로 드러냅니다. ‘모든 사람’과 ‘가운데서’를 사용해 지나치게 고어적인 표현을 피했습니다.
  terminology: ‘몰렉’, ‘음행하다’, ‘끊어 버리다’를 유지했습니다. ‘끊어 버리다’는 כרת의 심판 표현을 보존하며 형벌의 방식을 단정하지 않습니다. ‘음행하다’는 본문에서 우상숭배를 가리키는 성적 불충 비유이므로, 이를 설명하는 주석을 덧붙였습니다.
