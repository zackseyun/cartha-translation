id: LEV.20.5
reference: Leviticus 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
  footnotes:
  - marker: a
    text: Or 'play the prostitute after him.' The Hebrew uses the verb for sexual unfaithfulness metaphorically for idolatrous apostasy.
    reason: lexical_alternative
  - marker: b
    text: '''Cut off'' is a covenant-judgment expression; the text does not specify here whether this occurs by death, expulsion, or another form of divine removal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 친히 그 사람과 그의 가족을 대적하겠고, 그와 그를 따라 몰렉을 따라 음행하는[a] 모든 사람을 그들의 백성 가운데서 끊어 버리겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행하다’는 여기서 몰렉을 따르는 우상숭배를 성적 불충의 비유로 표현한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어 버리다’는 언약적 심판 표현입니다. 여기서는 그것이 죽음, 추방, 또는 다른 형태의 하나님의 제거인지를 본문이 구체적으로 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת פָּנַי
  english_pob_choice: then I myself will set my face
  chosen_korean: 내가 ... 나의 얼굴을 돌리겠고
  alternatives_korean:
  - 내가 ... 나의 얼굴을 두겠고
  - 내가 ... 맞서겠고
  lexicon: HALOT
  rationale: פָּנִים을 문자적으로 ‘얼굴’로 살리되, 심판적 대적의 관용구라는 점을 드러내기 위해 ‘돌리다’를 사용했습니다. אֲנִי의 강조는 ‘내가’로 충분히 반영했습니다.
- source_word: בָּאִישׁ הַהוּא
  english_pob_choice: against that man
  chosen_korean: 그 사람에게
  alternatives_korean:
  - 그 남자에게
  - 그 사람을 향하여
  lexicon: HALOT
  rationale: 히브리어 אישׁ의 남성성은 원문상 유지되지만, 한국어에서는 이 구절의 법정적·대상 지정 기능을 자연스럽게 살려 ‘그 사람’으로 옮겼습니다.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  english_pob_choice: and against his family
  chosen_korean: 그의 가족에게
  alternatives_korean:
  - 그의 집안에게
  - 그의 종족에게
  - 그의 씨족에게
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 문맥상 개인과 연루된 친족 단위를 가리키므로, 현대 한국어에서 가장 직접적인 ‘가족’으로 옮겼습니다.
- source_word: וְהִכְרַתִּי אֹתוֹ
  english_pob_choice: and I will cut off him
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 잘라 버리겠습니다
  - 제거하겠습니다
  - 끊겠습니다
  lexicon: HALOT
  rationale: כרת의 언약적 심판 관용구를 그대로 드러내기 위해 ‘끊어 버리다’를 택했습니다. 이는 단순 처형보다 공동체/언약 관계에서의 제거를 포괄합니다.
- source_word: וְאֵת כָּל הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  english_pob_choice: and all who prostitute themselves after him by prostituting themselves after Molech
  chosen_korean: 그를 따라 음행하며 몰렉을 따라 음행하는 모든 자
  alternatives_korean:
  - 그를 따라 창기짓하며 몰렉을 따라 창기짓하는 모든 자
  - 그를 따라 음행하는 모든 자와 몰렉을 따라 음행하는 모든 자
  lexicon: HALOT
  rationale: זנה의 성적 비유를 한국어의 직설적이지만 문어적인 ‘음행하다’로 옮겨, 우상숭배의 언약적 부정을 희석하지 않았습니다. אַחֲרָיו/אַחֲרֵי의 ‘따라’도 반복해 추종의 뉘앙스를 살렸습니다.
- source_word: הַמֹּלֶךְ
  english_pob_choice: Molech
  chosen_korean: 몰렉
  alternatives_korean:
  - 몰록
  - 몰레크
  lexicon: HALOT
  rationale: 해당 신명은 한국어 성경 전통에서 널리 쓰이는 ‘몰렉’으로 음역했습니다.
- source_word: מִקֶּרֶב עַמָּם
  english_pob_choice: from among their people
  chosen_korean: 그들의 백성 가운데에서
  alternatives_korean:
  - 그들의 백성 가운데서
  - 그들의 백성 중에서
  - 그 백성 가운데에서
  lexicon: HALOT
  rationale: מִקֶּרֶב은 공동체 내부로부터의 제거를 뜻하는 관용구이므로 ‘가운데에서’로 옮겨 공동체적 추방/제거의 의미를 보존했습니다.
theological_decisions:
- issue: ‘끊어 버리다’의 심판 의미를 구체화할지 여부
  chosen_reading: 본문의 언약적 심판 표현을 보존하고, 처벌 방식은 특정하지 않았습니다.
  alternative_readings:
  - 죽여 버리겠습니다
  - 공동체에서 추방하겠습니다
  - 멸하겠습니다
  rationale: 히브리어 כרת는 여기서 결과는 분명하지만 실행 방식은 명시하지 않으므로, 번역에서도 그 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: 우상숭배를 ‘음행’으로 묘사하는 비유 유지
  chosen_reading: ‘음행하다’를 반복해 성적-언약적 배반의 비유를 그대로 살렸습니다.
  alternative_readings:
  - 우상숭배하다
  - 불충하다
  - 신실하지 않다
  rationale: 본문은 몰렉 숭배를 단순한 종교행위가 아니라 언약적 배신으로 묘사하므로, 비유를 평탄화하지 않고 보존하는 것이 신학적·수사적 힘을 유지합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
