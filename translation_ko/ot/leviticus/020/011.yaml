id: LEV.20.11
reference: Leviticus 20:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'he has dishonored his father sexually.' The Hebrew literally reads, 'he has uncovered his father's nakedness,' a fixed idiom in Leviticus for a prohibited sexual violation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their blood is on them,' a legal formula indicating that responsibility for their death rests on themselves.
    reason: cultural_note
translation:
  language: ko
  text: 한 남자가 자기 아버지의 아내와 누우면, 그는 자기 아버지의 하체를 드러냈습니다[a]. 두 사람은 반드시 죽임을 당할 것입니다. 그들의 피의 책임은 그들에게 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아버지의 벌거벗음’을 ‘드러냈다’고 말합니다. 이는 레위기에서 금지된 성적 관계를 가리키는 고정 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 피가 그들 안에 있다’고 말합니다. 이는 그들의 죽음에 대한 책임이 그들 자신에게 있음을 나타내는 법률 공식입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  english_pob_choice: If a man
  chosen_korean: 만일 어떤 사람이
  alternatives_korean:
  - 만일 한 남자가
  - 사람이
  lexicon: HALOT
  rationale: 법률 조문 시작의 조건문으로 기능하므로 한국어에서도 자연스러운 조건표현을 택하되, 원문의 남성 단수 법적 주어를 지나치게 강조하지 않으면서도 의미를 보존했습니다.
- source_word: יִשְׁכַּב אֶת
  english_pob_choice: lies with
  chosen_korean: 누우면
  alternatives_korean:
  - 잠자리를 같이하면
  - 성관계를 가지면
  lexicon: HALOT
  rationale: 성적 관계를 뜻하는 관용구를 직설적이되 완곡하지 않게 옮기기 위해 ‘누우면’을 사용했습니다. 문맥상 불법 성행위를 가리키는 법률 용례를 유지합니다.
- source_word: אֵשֶׁת אָבִיו
  english_pob_choice: his father's wife
  chosen_korean: 자기 아버지의 아내
  alternatives_korean:
  - 아버지의 아내
  - 계모
  lexicon: HALOT
  rationale: 본문의 직설적 법언어를 따라 ‘계모’처럼 해석을 좁히지 않고, 원문 그대로의 친족표현을 살렸습니다.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  english_pob_choice: he has uncovered his father's nakedness
  chosen_korean: 자기 아버지의 벌거벗은 것을 드러낸 것입니다
  alternatives_korean:
  - 자기 아버지의 벌거벗은 것을 드러낸 것입니다
  - 자기 아버지를 성적으로 욕되게 한 것입니다
  lexicon: HALOT
  rationale: 레위기 특유의 고정 관용구인 ‘벌거벗은 것(남김)을 드러내다’를 살려, 성적 위반의 법적·상징적 표현을 보존했습니다. ‘성적으로 욕되게 하다’는 해석을 덧붙이므로 본문 직접성은 약해집니다.
- source_word: מוֹת יוּמְתוּ
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 사형을 받아야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: 강조형 반복을 한국어의 ‘반드시’로 반영했고, 처벌의 결과를 일반적 법정 표현으로 전달했습니다. 본문은 방법보다 형벌의 확실성을 말하므로 지나친 구체화는 피했습니다.
- source_word: דְּמֵיהֶם בָּם
  english_pob_choice: their blood is on them
  chosen_korean: 그들의 피가 그들에게 있습니다
  alternatives_korean:
  - 그들의 피는 그들 위에 있습니다
  - 그들의 피책임이 그들에게 있습니다
  lexicon: HALOT
  rationale: 히브리어 법률 공식의 책임 귀속 의미를 보존하되, 한국어에서는 자연스러운 소유·귀속 표현으로 옮겼습니다. ‘피책임’은 설명적이어서 본문 어조를 약화시킵니다.
theological_decisions:
- issue: 레위기 성결법의 관용구를 해석어로 바꾸지 않고 보존할지 여부
  chosen_reading: ‘자기 아버지의 벌거벗은 것을 드러낸 것입니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘자기 아버지를 성적으로 욕되게 한 것입니다’
  - ‘아버지에게 수치가 된 것입니다’
  rationale: 본문은 단순한 성적 비행 진술이 아니라 레위기 18–20장에 반복되는 고정 관용구이므로, 관련 본문들과의 연결성을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 조건법의 주어를 중성화할지 여부
  chosen_reading: ‘만일 어떤 사람이’로 옮겼습니다.
  alternative_readings:
  - ‘만일 한 남자가’
  - ‘만일 누구든지’
  rationale: 히브리어는 남성 단수 형식을 쓰지만, 한국어 법문에서는 ‘어떤 사람’이 자연스럽고, 원문의 법률 기능을 유지하면서도 불필요한 어색함을 줄입니다.
  doctrine_reference: Translation philosophy §4
