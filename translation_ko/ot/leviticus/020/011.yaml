revisions:
- from: 만일 어떤 사람이 자기 아버지의 아내와 누우면, 그는 자기 아버지의 벌거벗은 것을 드러낸 것입니다[a]. 둘 다 반드시 죽임을 당해야 합니다[b]. 그들의 피가 그들에게 있습니다.
  to: 한 남자가 자기 아버지의 아내와 누우면, 그는 자기 아버지의 하체를 드러냈습니다[a]. 두 사람은 반드시 죽임을 당할 것입니다. 그들의 피의 책임은 그들에게 있습니다[b].
  rationale: 명시된 남성 주어를 ‘한 남자’로 보존했습니다. 성적 법률 관용구는 한국어 성서 문맥에서 자연스러운 ‘하체를 드러내다’로 옮기고, 직역적 표현과 관용적 의미는 각주에서 밝혔습니다. 사형 선언의 강조는 ‘반드시 죽임을 당할 것입니다’로, 피의 책임 귀속 공식은 현대 한국어에서 이해 가능한 법률 표현으로 유지했습니다.
