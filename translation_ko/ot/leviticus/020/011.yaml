  naturalness: 초안의 ‘그들의 피가 그들에게 있습니다’와 ‘벌거벗은 것을 드러낸 것입니다’는 현대 표준 한국어로 어색합니다. ‘아버지의 하체를 드러냈습니다’는 레위기의 반복 관용구를 한국어 성서 법률 문맥에서 자연스럽게 살리며, 피의 공식은 ‘그들의 피의 책임은 그들에게 있습니다’로 명료하게 옮길 수 있습니다.
  terminology: ‘아버지의 아내’는 ‘계모’보다 원문의 범위를 보존하므로 유지합니다. 성적 관용구에는 ‘하체를 드러내다’를 사용하고 각주에서 히브리어의 직역 및 관용적 기능을 설명합니다. מוֹת יוּמְתוּ는 ‘반드시 죽임을 당할 것입니다’로 강조와 수동 법률 표현을 보존합니다.
