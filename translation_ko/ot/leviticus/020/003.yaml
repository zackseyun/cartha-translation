  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
  footnotes:
  - marker: a
    text: Or 'has sacrificed some of his children to Molech.' The Hebrew says literally 'has given some of his offspring to Molech'; the sacrificial sense is inferred from the wider context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나 자신이 그 사람을 대적하여 내 얼굴을 돌리고, 그를 그의 백성 가운데서 끊어 버리겠습니다. 이는 그가 내 성소를 더럽히고 내 거룩한 이름을 욕되게 하려고 자기 자손 가운데 일부를 몰렉에게 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘자기 자손 가운데 일부를 몰렉에게 주다’라고 합니다. 자녀를 희생으로 바친다는 뜻은 더 넓은 문맥에서 추론됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: I myself
  chosen_korean: 나는
  alternatives_korean:
  - 나도
  - 내가
  lexicon: HALOT
  rationale: 히브리어의 독립 인칭대명사는 강조를 띠지만, 한국어에서는 동사와 주어 배열만으로도 충분히 자연스럽기 때문에 과도한 중복 없이 문맥 전체에서 강조를 살렸습니다.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  english_pob_choice: will set my face against that man
  chosen_korean: 내 얼굴을 돌려 그 사람에게
  alternatives_korean:
  - 그 사람을 향해 내 얼굴을 두겠습니다
  - 그 사람에게 내 얼굴을 두겠습니다
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘얼굴을 향하다/돌리다’를 유지해 하나님의 의도적 대적을 드러냈고, ‘그 사람’보다 문맥상 특정한 범죄자를 가리키는 ‘그 사람’보다도 자연스러운 ‘그 사람’을 선택했습니다.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  english_pob_choice: and cut him off from among his people
  chosen_korean: 그를 그의 백성 가운데에서 끊어 버리겠습니다
  alternatives_korean:
  - 그를 그의 백성 가운데서 끊겠습니다
  - 그를 그의 백성 가운데서 제거하겠습니다
  lexicon: HALOT
  rationale: כרת의 언약적·사법적 의미를 ‘끊어 버리다’로 살렸고, 공동체로부터의 제명/제거를 암시하는 관용을 유지했습니다.
- source_word: מִזַּרְעוֹ
  english_pob_choice: some of his offspring
  chosen_korean: 자기 자손 중 일부
  alternatives_korean:
  - 자기 씨 중 일부
  - 자기 자녀들 중 일부
  lexicon: HALOT
  rationale: partitive מן과 זרע의 후손/자손 의미를 함께 반영하면서, 한국어에서 ‘씨’보다 덜 낯설고 본문이 암시하는 자녀 희생의 맥락도 유지했습니다.
- source_word: נָתַן לַמֹּלֶךְ
  english_pob_choice: has given some of his offspring to Molech
  chosen_korean: 몰렉에게 주어
  alternatives_korean:
  - 몰렉에게 바쳐
  - 몰렉에게 넘겨
  - 몰렉에게 드려
  lexicon: HALOT
  rationale: 본문 동사 자체는 ‘주다’이므로, 주된 본문에는 해석을 덜 보태는 ‘주어’를 유지했습니다. 제의적·희생적 뉘앙스는 전체 문맥이 드러냅니다.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  english_pob_choice: defile my sanctuary
  chosen_korean: 내 성소를 더럽히고
  alternatives_korean:
  - 내 성소를 부정하게 하고
  - 내 성소를 부정하게 만들고
  lexicon: HALOT
  rationale: 제의적 부정 상태를 나타내는 טמא를 한국어 성경에서 널리 쓰는 ‘더럽히다’로 옮겨, 성소의 거룩함을 훼손하는 의미를 분명히 했습니다.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  english_pob_choice: and to profane my holy name
  chosen_korean: 내 거룩한 이름을 욕되게 했기
  alternatives_korean:
  - 내 거룩한 이름을 더럽히고
  - 내 거룩한 이름을 속되게 하고
  lexicon: HALOT
  rationale: חלל의 ‘거룩함을 공적으로 훼손하다’는 의미를 한국어의 ‘욕되게 하다’로 자연스럽게 풀어, 이름의 명예 훼손과 성속 구분의 파괴를 드러냈습니다.
theological_decisions:
- issue: ‘몰렉에게 주다’의 희생적 함의
  chosen_reading: 주요 본문에는 ‘몰렉에게 주어’라고 두고, 본문 자체의 더 넓은 문맥이 자녀 희생을 암시하도록 남겨 두었습니다.
  alternative_readings:
  - 몰렉에게 바쳐
  - 몰렉에게 제물로 바쳐
  rationale: 히브리어는 여기서 단순히 ‘주다’라고 말하므로, 본문보다 강한 제의적 해석을 본문 안에 삽입하지 않았습니다. 다만 독자는 문맥상 희생적 의미를 이해할 수 있습니다.
  doctrine_reference: 원문 우선, 본문이 말하는 만큼만 번역한다는 번역 원칙
- issue: 하나님의 직접적 사법 행위
  chosen_reading: ‘내 얼굴을 돌려’와 ‘끊어 버리겠습니다’를 그대로 살려, 하나님의 개인적이고 의도적인 심판 행위를 드러냈습니다.
  alternative_readings:
  - 그에게 맞서겠습니다
  - 그를 벌하겠습니다
  rationale: 히브리어 관용구를 일반화하면 심판의 관계적·언약적 성격이 약해지므로, 이미지와 사법성을 함께 보존했습니다.
  doctrine_reference: 원문 이미지와 신학적 무게를 유지하는 최적 대응 번역
