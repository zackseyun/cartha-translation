  source_fidelity: 수정이 필요합니다. 초안의 ‘그의 어머니’는 히브리어 אִמָּהּ(앞서 언급된 여자의 어머니)를 남성의 어머니로 오해하게 할 수 있습니다. 또한 ‘그들을 그와 함께’는 원문의 목적어 배열과 두 여성이라는 지시 대상을 한국어에서 불명확하게 만듭니다.
  naturalness: ‘그 여자의 어머니’와 ‘그와 그 두 여자’를 사용하면 관계와 형벌의 대상이 자연스럽고 분명해집니다. ‘패륜’은 현대 한국어에서 특히 부모에 대한 도리를 저버리는 행위로 좁게 연상될 수 있으므로, זִמָּה의 넓은 도덕적 비난을 보존하는 ‘악행’이 더 안전합니다.
  terminology: יִקַּח의 혼인 함의를 확정하지 않는 ‘취하면’은 유지할 수 있습니다. זִמָּה는 본문 문맥상 중대한 성적·가족 관계상의 악행을 가리키지만, 본문 자체의 포괄성을 위해 본문에는 ‘악행’을 두고 각주에서 대안을 제시합니다.
