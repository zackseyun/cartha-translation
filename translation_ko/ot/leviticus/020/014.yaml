id: LEV.20.14
reference: Leviticus 20:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
  footnotes:
  - marker: a
    text: Or 'marries a woman and her mother.' The Hebrew verb 'takes' can imply marriage in legal contexts, but the wording does not explicitly specify marriage here.
    reason: lexical_alternative
  - marker: b
    text: '''Them'' refers to the woman and her mother.'
    reason: lexical_alternative
  - marker: c
    text: Or 'wickedness,' 'lewdness,' or 'an outrage' for the Hebrew term describing a gross sexual offense.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 한 여자와 그 여자의 어머니를 취하면, 그것은 악행[c]입니다. 그와 그 두 여자를 불로 태워야 합니다[b]. 그렇게 하여 너희 가운데 악행이 없게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘그 두 여자’는 그 여자와 그 여자의 어머니를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 중대한 도덕적·성적 악행을 가리키는 말로, ‘음란’, ‘사악한 일’, 또는 ‘수치스러운 행위’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח / יִקַּח אֶת
  english_pob_choice: takes
  chosen_korean: 취하면
  alternatives_korean:
  - 데려오면
  - 취하여 아내로 삼으면
  lexicon: HALOT
  rationale: 히브리어 לָקַח의 기본 의미를 살리면서, 이 법문맥에서 허용되는 성적·결합적 함의를 과도하게 좁히지 않기 위해 ‘취하다’를 사용했습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 한 여자
  alternatives_korean:
  - 한 아내
  - 한 여인
  lexicon: HALOT
  rationale: 본문이 혼인 상태를 명시하지 않으므로 ‘아내’보다 넓은 ‘여자’가 원문에 더 가깝습니다.
- source_word: אִמָּהּ
  english_pob_choice: her mother
  chosen_korean: 그의 어머니
  alternatives_korean:
  - 그 여자의 어머니
  - 그녀의 어머니
  lexicon: HALOT
  rationale: 앞의 여자를 가리키는 소유 대명사를 한국어로 자연스럽게 풀어, 관계를 분명히 했습니다.
- source_word: זִמָּה
  english_pob_choice: depravity
  chosen_korean: 패륜
  alternatives_korean:
  - 음행
  - 악행
  - 추행
  lexicon: HALOT
  rationale: 레위기의 성범죄 규정에서 쓰이는 강한 도덕적·성적 타락을 현대 한국어에서 압축적으로 드러내는 말로 ‘패륜’을 택했습니다.
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  english_pob_choice: They shall burn ... with fire
  chosen_korean: 불로 태워야 합니다
  alternatives_korean:
  - 불로 사르라
  - 불에 태워야 합니다
  lexicon: HALOT
  rationale: 히브리어의 능동 법률문을 한국어에서도 명령·의무형으로 살리되, 수단을 나타내는 ‘불로’로 원문의 형식을 반영했습니다.
theological_decisions:
- issue: ‘takes a woman and her mother’의 혼인 여부를 어떻게 처리할지
  chosen_reading: 혼인을 명시하지 않고 ‘한 여자와 그의 어머니를 취하면’으로 옮겼습니다.
  alternative_readings:
  - 한 여자와 그의 어머니와 결혼하면
  - 한 여자와 그의 어머니를 아내로 삼으면
  rationale: 히브리어 동사 לָקַח은 법문맥에서 혼인을 함축할 수 있지만, 본문 자체는 혼인 용어를 명시하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 형벌 절의 문장 형식
  chosen_reading: 능동 법률문을 살려 ‘그들을 그와 함께 불로 태워야 합니다’로 옮겼습니다.
  alternative_readings:
  - 그와 그들이 불로 태워질 것입니다
  - 그와 그들을 불로 사르라
  rationale: 히브리어는 능동 복수형으로 책임 주체를 드러내므로, 이를 한국어에서도 가능한 한 투명하게 반영했습니다.
  doctrine_reference: Translation philosophy §1, §5
