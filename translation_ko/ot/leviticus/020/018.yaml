id: LEV.20.18
reference: Leviticus 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
  footnotes:
  - marker: a
    text: Or, 'while she is menstruating.' The Hebrew term also carries the sense of ritual impurity associated with menstruation in Leviticus.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he has laid bare her source, and she has uncovered the source of her blood.' 'Source' is a Hebrew euphemism for the bodily flow.
    reason: lexical_alternative
  - marker: c
    text: '''Shall be cut off'' is a standard legal formula in the Torah; the text does not specify here how that removal is carried out.'
    reason: alternative_reading
translation:
  language: ko
  text: 한 남자가 월경으로 부정한 여자와 동침하여 그 여자의 하체를 드러내면, 그는 그 여자의 흐름[b]을 드러낸 것이며, 그 여자도 자기 피의 흐름을 드러낸 것입니다. 그 둘은 자기 백성 가운데서 끊어져야 합니다.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 월경하는 동안’. 이 히브리어 말은 레위기에서 월경과 관련된 의례적 부정 상태도 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그는 그녀의 근원을 드러냈고, 그녀는 자기 피의 근원을 드러냈다’입니다. ‘근원’은 여기서 몸에서 나오는 피의 흐름을 가리키는 히브리어 완곡어법입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘끊어지다’는 토라의 표준 법률 공식이며, 본문은 여기서 그 제거가 어떤 방식으로 이루어지는지는 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 남자
  - 한 남자
  lexicon: HALOT
  rationale: 법조문의 일반적 남성 주어를 한국어에서 자연스럽게 옮기기 위해 ‘어떤 사람’을 택하되, 뒤의 동침 주체가 남성임은 문맥상 유지합니다.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  english_pob_choice: lies with a woman
  chosen_korean: 동침하여
  alternatives_korean:
  - 여자와 잠자리를 같이하여
  - 여자와 성관계를 맺어
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 살리면서도 법률 문맥에 맞는 비교적 직설적인 표현으로 옮겼습니다.
- source_word: דָּוָה
  english_pob_choice: during her menstrual impurity
  chosen_korean: 월경 중의 부정함 때에
  alternatives_korean:
  - 그녀가 월경하는 동안
  - 월경 부정 가운데
  lexicon: HALOT
  rationale: 레위기 맥락의 의례적 부정 상태를 분명히 드러내기 위해 ‘월경 중의 부정함’으로 옮겼습니다.
- source_word: גִלָּה אֶת עֶרְוָתָהּ / מְקֹרָהּ הֶעֱרָה
  english_pob_choice: uncovers her nakedness / he has laid bare her flow
  chosen_korean: 그 여자의 하체를 드러내고 그 혈의 근원을 드러내면
  alternatives_korean:
  - 그 여자의 벌거벗음을 드러내고 그 흐름을 드러내면
  - 그 여자의 수치를 드러내고 그 피의 근원을 드러내면
  lexicon: HALOT
  rationale: ‘하체’는 레위기에서 반복되는 노출-성적 금기 관용구를 한국어로 직접 반영하며, ‘혈의 근원’은 본문의 우회적 표현을 유지해 육체적 흐름을 암시합니다.
- source_word: מְקוֹר דָּמֶיהָ
  english_pob_choice: the flow of her blood
  chosen_korean: 혈의 근원
  alternatives_korean:
  - 피의 근원
  - 혈의 흐름
  lexicon: HALOT
  rationale: מָקוֹר의 ‘근원/샘’이라는 문자적 이미지를 살리면서도 한국어에서 자연스럽고 다소 완곡한 표현으로 유지했습니다.
- source_word: וְנִכְרְתוּ
  english_pob_choice: shall be cut off
  chosen_korean: 끊어져야 합니다
  alternatives_korean:
  - 끊어져야 합니다
  - 제명되어야 합니다
  - 끊어질 것입니다
  lexicon: HALOT
  rationale: 토라의 표준적 제재 공식인 ‘cut off’를 한국어로 직역해, 그 형벌의 정확한 방식은 본문이 명시하지 않는다는 긴장을 보존했습니다.
theological_decisions:
- issue: ‘월경 중의 부정함’의 의미
  chosen_reading: 단순한 생리 현상이 아니라 레위기의 의례적 부정 상태를 함께 드러내도록 번역했습니다.
  alternative_readings:
  - 그녀가 월경하는 동안
  - 생리 중의 부정
  rationale: 이 조항은 성적 행위 자체보다 레위기의 정결 규례 위반을 다루므로, 의례적 차원을 분명히 하는 번역이 본문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘끊어져야 합니다’의 법적 범위
  chosen_reading: 죽음, 추방, 공동체 제명 중 어느 하나로 확정하지 않고 표준 법정 공식으로 남겼습니다.
  alternative_readings:
  - 사형당해야 합니다
  - 공동체에서 제외되어야 합니다
  rationale: 히브리어의 ‘끊다’는 여기서 집행 방식이 명시되지 않으므로, 해석을 본문 밖에서 확정하지 않았습니다.
  doctrine_reference: Translation philosophy §3
