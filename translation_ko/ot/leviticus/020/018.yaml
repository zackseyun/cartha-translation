revisions:
- from: 어떤 사람이 한 여자를 그의 월경 중의 부정함 때에 동침하여 그 여자의 하체를 드러내고 그 혈의 근원을 드러내면, 그 둘은 자기 백성 가운데서 끊어져야 합니다.[a][b][c]
  to: 한 남자가 월경으로 부정한 여자와 동침하여 그 여자의 하체를 드러내면, 그는 그 여자의 흐름[b]을 드러낸 것이며, 그 여자도 자기 피의 흐름을 드러낸 것입니다. 그 둘은 자기 백성 가운데서 끊어져야 합니다.[c][a]
  rationale: 여성의 월경 상태를 명확히 수식하도록 문장을 고치고, 원문에 있는 남성과 여성의 병행 절을 모두 번역했습니다. 남성 단수 주어를 보존했으며, ‘흐름’으로 현대 한국어의 명료성을 확보하되 ‘근원’이라는 원문의 완곡 표현은 각주에서 문자적으로 제시했습니다. ‘끊어져야 합니다’는 제재의 방식에 관한 원문의 모호성을 유지합니다. 각주 a는 월경 상태를 설명하지만 현재 본문에 독립 표지가 없으므로, 문장 끝에서 c와 함께 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:21Z'
