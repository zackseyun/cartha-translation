  naturalness: ‘월경 중의 부정함 때에’와 ‘혈의 근원’은 현대 표준어에서 다소 부자연스럽거나 의미가 불명확합니다. ‘월경으로 부정한’, ‘피의 흐름’은 레위기의 의례적 맥락과 신체적 완곡 표현을 함께 전달하면서 자연스럽습니다.
