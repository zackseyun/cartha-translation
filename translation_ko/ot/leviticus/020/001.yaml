lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서두의 공식적인 계시·발화 도입구로서, 단순한 '말하다'보다 성경적 어법에 맞는 '말씀하여 이르다'가 발화 시작을 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유신명사 יְהוָה를 POB 원칙에 따라 음역한 '야훼'로 옮겨, 일반 호칭으로 바꾸지 않고 이름 자체를 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게로
  - 향하여
  lexicon: HALOT
  rationale: 말의 직접 수신자를 표시하는 전치사로서, 한국어에서는 조사 '-에게'가 가장 자연스럽고 간결합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하여 이르시며
  - 이르시되
  lexicon: HALOT
  rationale: 히브리어의 전형적 발화 도입 공식이므로 별도의 인용내용 없이도 뒤 구절로 이어지는 기능을 살려 번역했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 처리
  chosen_reading: '''야훼''를 사용했습니다.'
  alternative_readings:
  - '''여호와'''
  - '''주님'''
  rationale: 본문은 신적 호칭이 아니라 언약적 고유명사를 사용하므로, 전통적 대체 번역보다 이름의 직접성을 유지하는 쪽이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
