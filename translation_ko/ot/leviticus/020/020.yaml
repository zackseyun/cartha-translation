  to: 한 남자가 자기 삼촌의 아내와 잠자리를 같이하면, 그는 자기 삼촌의 벌거벗음[a]을 드러낸 것입니다. 그들은 자기들의 죄[b]를 져야 하며, 자녀 없이 죽을 것입니다.
  rationale: 남성 단수의 법적 사례를 ‘한 남자가’로 보존하고, 친족어를 원문의 범위에 맞게 ‘삼촌의 아내’로 바로잡았습니다. ‘벌거벗음’은 레위기의 고정 관용구를 유지하되 주석으로 오해를 방지했습니다. 처벌 표현은 원문의 간결성과 불확정성을 보존하여 ‘자녀 없이 죽을 것입니다’로 유지했습니다.
