review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וְאִישׁ은 남성 단수의 사례를 제시하므로 ‘누구든지’보다 ‘한 남자가’가 적절합니다. 또한 דֹּדָתוֹ는 문맥상 ‘삼촌의 아내’이며, ‘숙모’는 한국어에서 통상 아버지의 남동생의 아내로 범위를 부당하게 좁힙니다. עֶרְוַת דֹּדוֹ는 실제로 삼촌의 신체를 노출했다는 뜻이 아니라 레위기의 친족 성관계 금기를 가리키는 관용구이므로, ‘벌거벗은 몸’보다 원문의 관용적 명사인 ‘벌거벗음’을 보존해야 합니다.
  naturalness: ‘그의 삼촌의 벌거벗은 몸을 드러낸 것입니다’는 한국어에서 물리적으로 삼촌의 나체를 노출한 것으로 읽히기 쉽고, ‘그의’의 반복도 부자연스럽습니다. ‘자기 삼촌의 벌거벗음을 드러낸 것입니다’가 더 간결하며 원문의 법문 관용구를 더 정확히 반영합니다.
  terminology: ‘잠자리를 같이하다’, ‘죄를 지다’, ‘자녀 없이 죽다’는 현대적이면서도 법문체에 적합합니다. 친족어는 특정 부계·연령 관계를 함의하는 ‘숙모’ 대신 ‘삼촌의 아내’로 옮깁니다. ‘벌거벗음’에는 관용적 의미를 설명하는 주석을 답니다.
  issues:
