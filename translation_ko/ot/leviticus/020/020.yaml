id: LEV.20.20
reference: Leviticus 20:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
  footnotes:
  - marker: a
    text: Or, 'They shall bear their guilt.' The Hebrew idiom can express either sin or the liability/guilt borne for it.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his uncle’s nakedness he has uncovered'—a Levitical idiom for violating a prohibited sexual kinship bond by lying with the uncle’s wife.
    reason: cultural_note
translation:
  language: ko
  text: 한 남자가 자기 삼촌의 아내와 잠자리를 같이하면, 그는 자기 삼촌의 벌거벗음[a]을 드러낸 것입니다. 그들은 자기들의 죄[b]를 져야 하며, 자녀 없이 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 삼촌의 벌거벗음’입니다. 이는 삼촌의 아내와 관계함으로써 금지된 친족 관계를 범했다는 뜻의 레위기적 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘자기들의 죄책을’. 히브리어 표현은 죄와 그 죄에 대한 책임을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ / אֲשֶׁר
  english_pob_choice: If a man / if
  chosen_korean: 누구든지
  alternatives_korean:
  - 한 남자가
  - 어떤 남자가
  lexicon: HALOT
  rationale: 카수이스틱 법문 구조를 한국어로 자연스럽게 살리기 위해 조건적 의미를 담은 표현을 택했습니다. 남성 단수의 사례 규정이라는 점도 유지합니다.
- source_word: יִשְׁכַּב אֶת
  english_pob_choice: lies with
  chosen_korean: 잠자리를 같이하면
  alternatives_korean:
  - 함께 눕는다면
  - 성관계를 가지면
  lexicon: HALOT
  rationale: 성적 관계를 뜻하는 관용구를 직설적으로 풀되, 법문체의 완곡성과 현대 가독성을 함께 고려했습니다.
- source_word: דֹּדָתוֹ
  english_pob_choice: his aunt
  chosen_korean: 그의 숙모
  alternatives_korean:
  - 그의 이모
  - 그의 고모
  - 그의 삼촌의 아내
  lexicon: HALOT
  rationale: 히브리어의 친족관계는 ‘숙모/이모/고모’로 모두 번역 가능하지만, 바로 뒤의 ‘삼촌’과 연결되는 점을 살려 가장 자연스러운 한국어 친족어를 선택했습니다.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  english_pob_choice: he has uncovered his uncle’s nakedness
  chosen_korean: 그의 삼촌의 벌거벗은 몸을 드러낸 것입니다
  alternatives_korean:
  - 그의 삼촌의 수치를 드러낸 것입니다
  - 그의 삼촌의 벌거벗음을 드러낸 것입니다
  lexicon: HALOT
  rationale: 레위기의 고정 관용구인 ‘벌거벗음/수치의 드러냄’을 그대로 보존했습니다. 한국어에서는 ‘벌거벗은 몸’이 과도한 해설 없이도 그 친족 성적 금기 위반을 드러내는 가장 직접적인 표현입니다.
- source_word: חֶטְאָם יִשָּׂאוּ
  english_pob_choice: They shall bear their sin
  chosen_korean: 그들은 자기 죄를 져야 하며
  alternatives_korean:
  - 그들은 자기 죄를 담당해야 하며
  - 그들은 자기 죄를 짊어져야 하며
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘죄를 지다/담당하다’의 법적 책임 의미를 살리기 위해 ‘져야 하며’를 택했습니다. POB의 ‘sin’ 선택을 따라 죄책과 책임을 함께 드러냅니다.
- source_word: עֲרִירִים יָמֻתוּ
  english_pob_choice: they shall die childless
  chosen_korean: 자녀 없이 죽을 것입니다
  alternatives_korean:
  - 무자식으로 죽을 것입니다
  - 자식 없이 죽을 것입니다
  lexicon: HALOT
  rationale: 결과 상태를 간결하게 표현하면서도, 히브리어가 명시하지 않는 사망 방식은 덧붙이지 않았습니다. ‘childless’의 의미를 가장 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘그의 삼촌의 벌거벗은 몸’이라는 레위기적 관용구의 유지
  chosen_reading: 직역보다 관용구를 살려 성적 금기 위반을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘그의 삼촌의 아내와 관계했다’로 의미를 풀어씀
  - ‘그의 삼촌의 수치를 드러냈다’로 완화
  rationale: 본문은 단순한 개인 간 행위가 아니라 금지된 친족 결합을 ‘벌거벗음’ 관용구로 규정합니다. 의미를 풀어버리면 레위기 특유의 문체와 법적 엄중성이 약화됩니다.
  doctrine_reference: 레위기 친족 금기 조항의 관용법 보존
- issue: ‘그들은 자기 죄를 져야 하며’의 책임 귀속
  chosen_reading: 두 사람 모두가 죄책과 책임을 진다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘그들은 자기 죄를 담당해야 하며’
  - ‘그들은 자기 죄에 대한 벌을 받아야 하며’
  rationale: 히브리어는 죄 자체와 그에 따르는 책임을 함께 가리킬 수 있으므로, 본문의 긴장을 풀지 않고 법적 책임을 남겼습니다.
  doctrine_reference: 죄와 책임의 이중 의미 보존
