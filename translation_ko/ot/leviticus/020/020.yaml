    rationale: 히브리어는 여기서 ‘삼촌의 아내’를 가리키며, 한국어 ‘숙모’는 보통 아버지의 남동생의 아내라는 더 제한된 관계를 뜻합니다.
  - severity: high
    issue: ‘삼촌의 벌거벗은 몸’은 레위기의 ‘벌거벗음’ 관용구를 신체의 실제 노출로 오해하게 합니다.
    rationale: עֶרְוָה는 이 문맥에서 금지된 친족 성관계의 법적·관용적 표현입니다. 명사형 ‘벌거벗음’을 유지하고 주석으로 설명하는 편이 충실합니다.
