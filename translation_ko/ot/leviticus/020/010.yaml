id: LEV.20.10
reference: Leviticus 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
  footnotes:
  - marker: a
    text: Literally, 'with the wife of a man ... with the wife of his neighbor.' The repetition intensifies and clarifies the offense in legal style.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 남자가 다른 남자의 아내와 간음하면—곧 자기 이웃의 아내와 간음하면—간음한 남자와 간음한 여자는 반드시 죽임을 당해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 남자의 아내 … 그의 이웃의 아내’라고 반복하여 법문체에서 범죄를 강조하고 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  english_pob_choice: If a man
  chosen_korean: 어떤 사람이
  alternatives_korean:
  - 한 남자가
  - 남자가
  lexicon: HALOT
  rationale: 카수이스틱 율법의 조건문을 한국어에서 자연스럽게 살리기 위해 ‘어떤 사람이’로 옮겼습니다. 원문의 남성 단수는 뒤의 ‘남자/여자’ 대조에서 드러납니다.
- source_word: יִנְאַף
  english_pob_choice: commits adultery
  chosen_korean: 간음하면
  alternatives_korean:
  - 간음을 범하면
  - 간음하면
  lexicon: HALOT
  rationale: נאף는 일반적 성적 부도덕이 아니라 ‘간음’의 법적 범주를 가리키므로, 한국어에서도 법문체에 맞는 ‘간음하다’를 사용했습니다.
- source_word: אֶת אֵשֶׁת אִישׁ / אֶת אֵשֶׁת רֵעֵהוּ
  english_pob_choice: with another man's wife / with his neighbor's wife
  chosen_korean: 다른 남자의 아내 / 자기 이웃의 아내
  alternatives_korean:
  - 한 남자의 아내 / 그의 이웃의 아내
  - 사람의 아내 / 그의 이웃의 아내
  lexicon: HALOT
  rationale: 직역의 ‘남자의 아내’보다 한국어 법문맥에서 자연스러운 ‘다른 남자의 아내’가 소유 관계를 분명히 드러냅니다. ‘이웃’은 רֵעַ의 언약적·공동체적 의미를 유지합니다.
- source_word: מוֹת יוּמַת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽여야 합니다
  - 반드시 사형에 처해야 합니다
  lexicon: HALOT
  rationale: 감정적 어휘를 덜고, 원문의 강한 강조(מוֹת יוּמַת)를 한국어 법문체의 엄정한 수동 표현으로 살렸습니다. 방법을 특정하지 않고 사형 선고의 확실성을 유지합니다.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  english_pob_choice: the adulterer and the adulteress
  chosen_korean: 간음한 남자와 간음한 여자는
  alternatives_korean:
  - 간음한 남자와 간음한 여인은
  - 간음한 자 남녀는
  lexicon: HALOT
  rationale: 히브리어의 남성형·여성형 분사를 각각 반영해 책임 주체를 명시적으로 구분했습니다. POB의 성별 대칭을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 성별이 드러나는 법문체
  chosen_reading: ‘어떤 사람이’로 시작하되, 판결 부분에서는 ‘간음한 남자와 간음한 여자’를 명시했습니다.
  alternative_readings:
  - 누구든지... 간음한 자는
  - 사람이... 간음하면... 간음한 자는
  rationale: 원문은 사례 제시와 제재에서 성별을 분명히 구분합니다. 이를 중성화하면 법문의 구조와 책임 귀속이 흐려지므로, 본문이 드러내는 성별 구분을 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
- issue: 사형 선고의 범위
  chosen_reading: ‘죽임을 당해야 합니다’로 옮기고, 집행 방식은 특정하지 않았습니다.
  alternative_readings:
  - 사형에 처해야 합니다
  - 죽여야 합니다
  rationale: 원문은 죽음의 형벌을 명령하지만 집행 수단은 밝히지 않습니다. 따라서 본문에 없는 세부를 덧붙이지 않고 법적 강도를 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 3
