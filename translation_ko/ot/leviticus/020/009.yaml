  - 악담하는
  lexicon: HALOT
  rationale: 피엘형 קלל은 단순한 무례함보다 저주를 가하는 행위이므로 ‘저주하는’이 가장 직접적입니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽어야 합니다
  - 반드시 처형되어야 합니다
  lexicon: HALOT
  rationale: 강조형 부정사구가 법적 형벌의 확실성을 나타내므로, 수동·사법적 뉘앙스를 살려 ‘죽임을 당해야 합니다’로 옮겼습니다.
- source_word: דָּמָיו בּוֹ
  english_pob_choice: his blood is on him
  chosen_korean: 그의 피가 자기에게 있습니다
  alternatives_korean:
  - 그의 피가 그에게 있습니다
  - 그의 피값이 그에게 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 죽음의 책임이 당사자에게 있음을 뜻하므로, 한국어에서는 직역에 가까우면서도 책임 귀속을 드러내는 표현을 택했습니다.
