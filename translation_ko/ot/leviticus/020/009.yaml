  - 사람마다
  lexicon: HALOT
  rationale: 중복된 איש은 분배적 관용구이므로 한국어 법률 문맥에서는 ‘누구든지’가 가장 자연스럽게 그 의미를 살립니다.
- source_word: יְקַלֵּל
