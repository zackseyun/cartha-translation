base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
  footnotes:
  - marker: a
    text: Hebrew 'a man, a man,' an idiom meaning 'any man' or 'whoever.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his father and his mother'; English 'or' brings out the legal sense that cursing either parent incurs the penalty.
    reason: lexical_alternative
  - marker: c
    text: Or 'his bloodguilt is upon him.' The Hebrew idiom assigns responsibility for his death to himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 자기 아버지나 어머니를 저주하는 자는 반드시 죽임을 당할 것입니다[a]. 그는 자기 아버지와 어머니를 저주하였으므로, 그의 피는 그 자신에게 돌아갑니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘한 사람, 한 사람’이라는 중복 표현은 ‘누구든지’라는 분배적 의미를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 법률 문맥상 ‘그리고’보다는 ‘또는’의 분배적 의미가 드러납니다. 곧 부모 가운데 한 사람을 저주해도 형벌 사유가 됩니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 피가 그에게 있다’이며, 죽음의 책임이 당사자에게 돌아간다는 법적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
