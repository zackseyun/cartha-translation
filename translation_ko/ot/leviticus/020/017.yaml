id: LEV.20.17
reference: Leviticus 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
  footnotes:
  - marker: a
    text: Or 'a shameful thing' or 'a reproach' for 'a disgrace' (Hebrew חֶסֶד in a rare negative sense here, not its usual sense 'kindness' or 'steadfast love').
    reason: lexical_alternative
  - marker: b
    text: '''They shall be cut off'' preserves the Hebrew legal formula without specifying whether the penalty is death, expulsion, or another form of removal.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 어떤 사람이 자기 누이 곧 자기 아버지의 딸이나 어머니의 딸을 아내로 맞아 그녀의 벌거벗음을 보고 그녀도 그의 벌거벗음을 보면, 그것은 수치스러운 일입니다. 그들은 그들의 백성의 눈앞에서 끊어질 것이며, 자기 누이의 벌거벗음을 드러냈으니 그는 자기 죄책을 짊어져야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '수치스러운 일' 또는 '치욕'으로도 옮길 수 있습니다. 여기서 히브리어 חֶסֶד는 평소의 '인자'나 '인애'가 아니라 드문 부정적 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''끊어질 것''은 히브리어의 법정형 공식을 그대로 살린 표현으로, 사형인지 추방인지 혹은 다른 제거 조치인지는 본문이 특정하지 않습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  english_pob_choice: takes
  chosen_korean: 아내로 맞아
  alternatives_korean:
  - 데려가
  - 취하여
  - 취하면
  lexicon: HALOT
  rationale: 히브리어의 기본 뜻은 '취하다/데려가다'이지만, 이 문맥에서는 근친 성관계 금지 조항이므로 한국어로는 관계의 성격을 지나치게 풀지 않으면서도 자연스럽게 '아내로 맞아'로 옮겼습니다.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  english_pob_choice: his sister, his father's daughter or his mother's daughter
  chosen_korean: 자기 누이 곧 자기 아버지의 딸이나 어머니의 딸
  alternatives_korean:
  - 자기 누이, 곧 아버지의 딸이거나 어머니의 딸
  - 자기 자매 곧 아버지의 딸이나 어머니의 딸
  lexicon: HALOT
  rationale: 히브리어의 동격 설명을 살려, 친누이/이복·동복누이를 함께 포함하는 구분을 한국어에서도 분명하게 드러냈습니다.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ ... וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  english_pob_choice: and sees her nakedness and she sees his nakedness
  chosen_korean: 그녀의 벌거벗음을 보고 그녀도 그의 벌거벗음을 보면
  alternatives_korean:
  - 그녀의 벌거벗음을 드러내고 그녀도 그의 벌거벗음을 드러내면
  - 그녀의 벌거벗음을 보고 그녀도 그의 벌거벗음을 보게 되면
  lexicon: HALOT
  rationale: 레위기의 관용구인 '벌거벗음을 보다'를 가능한 한 그대로 살려, 성적 노출/근친 금기의 법적 이미지를 보존했습니다.
- source_word: חֶסֶד
  english_pob_choice: a disgrace
  chosen_korean: 수치스러운 일
  alternatives_korean:
  - 수치
  - 부끄러운 일
  - 치욕
  lexicon: HALOT
  rationale: 이 절의 חֶסֶד는 보통의 '인자/헤세드'가 아니라 드문 부정적 용례이므로, 문맥상 적절한 한국어로 '수치스러운 일'을 선택했습니다.
- source_word: וְנִכְרְתוּ לְעֵינֵי בְּנֵי עַמָּם
  english_pob_choice: they shall be cut off in the sight of the sons of their people
  chosen_korean: 그들은 그들의 백성의 눈앞에서 끊어질 것이며
  alternatives_korean:
  - 그들은 그들의 백성의 눈앞에서 끊어질 것이며
  - 그들은 그들의 백성 앞에서 끊어질 것이며
  lexicon: HALOT
  rationale: '''끊어지다''는 כרת의 법정형 공식을 비교적 직접적으로 보존하며, 정확한 처벌 방식은 본문이 말하는 범위 안에서 유보합니다.'
- source_word: גִּלָּה עֲוֺנוֹ יִשָּׂא
  english_pob_choice: He has uncovered his sister's nakedness; he shall bear his guilt
  chosen_korean: 자기 누이의 벌거벗음을 드러냈으니 그는 자기 죄책을 짊어져야 합니다
  alternatives_korean:
  - 자기 누이의 벌거벗음을 드러냈으니 그는 자기 죄를 짊어져야 합니다
  - 자기 누이의 벌거벗음을 드러냈으니 그는 자기 죄악을 져야 합니다
  lexicon: HALOT
  rationale: 가해 동사 '드러내다'를 유지하고, 법적 결과를 나타내는 עֲוֺן을 '죄책'으로 옮겨 개인이 책임을 져야 한다는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 부정적 용례 처리
  chosen_reading: 이 구절에서는 '수치스러운 일'로 옮겨, חֶסֶד의 통상적 긍정 의미를 적용하지 않았습니다.
  alternative_readings:
  - '''인자'''
  - '''은혜'''
  rationale: 본문은 근친 금지 조항의 판결문 맥락이므로, כאן의 חֶסֶד를 일반적 언약적 선의로 읽으면 본문의 도덕·법적 강도를 훼손합니다.
  doctrine_reference: 레 20장의 성결 법전 문맥
