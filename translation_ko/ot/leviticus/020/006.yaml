  to: 또 영매들과 신접술사들에게로 돌아서서 그들을 따라 음행하려고 하는 사람에게는, 내가 그 사람을 대적하여 내 얼굴을 두고 그를 그의 백성 가운데서 끊어 버리겠습니다.[a][b][c]
