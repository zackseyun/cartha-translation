review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘내 얼굴을 그 사람에게로 돌리고’는 히브리어 ‘내 얼굴을 그 사람에게 대적하여 두다/향하다’라는 심판의 대립 의미를 충분히 전달하지 못합니다. 또한 יִדְּעֹנִים을 ‘점술가들’로 옮기면 본문에서 오브와 짝을 이루는 영적·주술적 실천자라는 의미가 다소 넓어집니다.
  naturalness: 합쇼체의 법률적·예언적 문체는 대체로 자연스럽습니다. 다만 ‘그 사람에게로 돌리고’는 한국어에서 심판의 뜻이 불분명하므로 ‘그 사람을 대적하여 내 얼굴을 두고’가 더 자연스럽고 관용적입니다.
  terminology: ‘영매들’은 אוֹבוֹת에 적절합니다. יִדְּעֹנִים은 일반적인 예언·점복 행위도 가리킬 수 있는 ‘점술가들’보다 ‘신접술사들’로 옮겨 영매와 병행되는 영적 교섭의 의미를 보존하는 편이 안전합니다. ‘음행’ 및 ‘끊어 버리다’는 각각 זנה의 비유와 כרת의 의도적으로 특정되지 않은 법적 제재를 적절히 보존합니다.
  issues:
  - severity: medium
    issue: ‘내 얼굴을 그 사람에게로 돌리고’가 심판의 대립 의미를 약화합니다.
    rationale: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא은 단순히 얼굴을 그쪽으로 돌리는 행위가 아니라 그 사람을 향한 적대적 심판을 나타내는 관용구입니다.
  - severity: medium
    issue: יִדְּעֹנִים을 ‘점술가들’로 번역하면 의미 범위가 지나치게 넓습니다.
    rationale: 이 용어는 אוֹבוֹת과 병행되어 영적 존재 또는 죽은 이와 관련된 주술적 실천자를 가리킵니다. ‘신접술사들’이 이 문맥의 구별된 의미를 더 잘 반영합니다.
  - severity: low
    issue: ‘음행하려는’은 원문의 목적 표현을 의지·시도처럼 다소 강하게 들리게 할 수 있습니다.
