id: LEV.20.6
reference: Leviticus 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
  footnotes:
  - marker: a
    text: Or 'those with familiar spirits' for 'mediums'; the Hebrew term refers to practitioners who consult the dead or spirits.
    reason: lexical_alternative
  - marker: b
    text: Or 'to play the prostitute after them,' a metaphor for covenantal unfaithfulness through illicit spiritual practice.
    reason: lexical_alternative
  - marker: c
    text: '''Cut off'' is a standard legal formula; the text does not specify here the exact mode of judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 영매들과 점술가들에게로 돌아서서 그들을 따라 음행하려는 사람에게는, 내가 내 얼굴을 그 사람에게로 돌리고 그를 그의 백성 가운데서 끊어 버리겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영매들’은 죽은 자나 영적 존재와 교섭한다고 여겨진 실천자를 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘음행하려는’은 여기서 육체적 음란보다 언약적 불성실을 드러내는 비유를 살린 표현입니다.
    reason: theological_note
  - marker: c
    text: ‘끊어 버리겠습니다’는 심판 공식으로, 정확한 집행 방식은 이 절에서 분명히 말하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  english_pob_choice: the person
  chosen_korean: 사람
  alternatives_korean:
  - 그 영혼
  - 그 생명
  lexicon: HALOT
  rationale: 법률 문맥의 נֶפֶשׁ은 비물질적 ‘영혼’보다 당사자 개인을 가리키므로, 한국어로는 자연스럽고 판결문체에 맞는 ‘사람’이 가장 적절합니다.
- source_word: הָאֹבֹת
  english_pob_choice: the mediums
  chosen_korean: 영매들
  alternatives_korean:
  - 무당들
  - 죽은 자와 접신하는 자들
  - 신접자들
  lexicon: HALOT
  rationale: אוֹב는 죽은 자나 영적 존재와의 교섭에 관련된 매개자이므로, 현대 한국어에서 가장 직접적인 대응어인 ‘영매들’을 택했습니다.
- source_word: הַיִּדְּעֹנִים
  english_pob_choice: the spiritists
  chosen_korean: 점술가들
  alternatives_korean:
  - 신령술사들
  - 주술사들
  - 예언자들
  lexicon: HALOT
  rationale: יִדְּעֹנִי는 오컬트적 지식을 추구하는 실천자를 가리키므로, 앞의 ‘영매들’과 구분되면서도 의미장을 유지하는 ‘점술가들’이 적절합니다.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  english_pob_choice: to prostitute himself after them
  chosen_korean: 그들을 따라 음행하려는
  alternatives_korean:
  - 그들을 따라 매춘하려는
  - 그들을 따라 부정하려는
  - 그들을 따라 신실하지 않으려는
  lexicon: HALOT
  rationale: זנה의 성적·언약적 배교 비유를 살리기 위해 완화하지 않고 ‘음행하다’로 옮겼습니다. 한국어에서는 목적절 형태로 자연스럽게 이어지도록 구성했습니다.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  english_pob_choice: I will set my face against that person
  chosen_korean: 내 얼굴을 그 사람에게로 돌리고
  alternatives_korean:
  - 그 사람을 향해 내 얼굴을 두고
  - 그 사람에게 대적하고
  - 그 사람을 향해 얼굴을 돌리고
  lexicon: HALOT
  rationale: ‘얼굴을 두다/돌리다’는 히브리어 관용구의 심판적 대립을 보존합니다. POB의 ‘set my face against’에 맞춰 대적의 뉘앙스를 살리되 한국어로는 동작 표현을 택했습니다.
- source_word: וְהִכְרַתִּי אֹתוֹ
  english_pob_choice: and cut him off
  chosen_korean: 그를 … 끊어 버리겠습니다
  alternatives_korean:
  - 그를 끊어 내겠습니다
  - 그를 제거하겠습니다
  - 그를 끊겠습니다
  lexicon: HALOT
  rationale: כרת의 법정 공식성을 살리기 위해 ‘끊어 버리다’를 사용했습니다. 이는 POB의 ‘cut him off’와 같은 법적·언약적 제재의 개방성을 유지합니다.
theological_decisions:
- issue: ‘음행’ 비유의 보존
  chosen_reading: 그들을 따라 음행하려는
  alternative_readings:
  - 그들을 따라 부정하려는
  - 그들을 따라 불성실하려는
  rationale: 본문은 점술 행위를 단순한 실수나 일반적 불신이 아니라 언약적 배교를 암시하는 성적 은유로 묘사합니다. 이를 약화하지 않기 위해 직설적인 ‘음행’ 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘끊어 버리다’의 제재 의미 유지
  chosen_reading: 그를 그의 백성 가운데서 끊어 버리겠습니다
  alternative_readings:
  - 그를 그의 백성 가운데서 제거하겠습니다
  - 그를 그의 백성 가운데서 죽이겠습니다
  - 그를 그의 백성에서 내쫓겠습니다
  rationale: 히브리어 כרת는 정확한 집행 방식이 본문에서 특정되지 않는 법정 공식이므로, 해석을 과도하게 좁히지 않고 제재의 엄중함만 드러내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §3
