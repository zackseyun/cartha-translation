id: LEV.10.2
reference: Leviticus 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from before the LORD''; alternatively, ''from the presence of the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 불이 야훼 앞에서 나와서 그들을 삼키니, 그들은 야훼 앞에서 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼 앞에서/앞으로부터’라는 뜻의 관용구를 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  english_pob_choice: And fire came out
  chosen_korean: 그리고 불이 ... 나와서
  alternatives_korean:
  - 불이 나가서
  - 불이 나와
  lexicon: HALOT
  rationale: 동작의 방향성을 살리면서도 한국어 서술로 자연스럽게 옮기기 위해 ‘나와서’를 택했습니다.
- source_word: וַתֹּאכַל
  english_pob_choice: consumed
  chosen_korean: 삼키니
  alternatives_korean:
  - 소멸시키니
  - 먹어 삼키니
  - 집어삼키니
  lexicon: HALOT
  rationale: 불이 사람을 대상으로 할 때 ‘삼키다’는 완전한 파괴를 분명하게 드러내면서도 과도한 의역이 아닙니다.
- source_word: מִלִּפְנֵי יְהוָה / לִפְנֵי יְהוָה
  english_pob_choice: from before Yahweh / before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 야훼의 임재 앞에서
  lexicon: HALOT
  rationale: 반복되는 위치 표현을 간결하게 살리되, 출처가 되는 하나님의 임재 장면을 유지하기 위해 ‘앞에서’를 반복했습니다.
- source_word: וַיָּמֻתוּ
  english_pob_choice: they died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었고
  - 그들은 죽었습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 단순한 결과 진술을 따라 원인 해석을 덧붙이지 않고 평서로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유한 언약명 את יְהוָה를 한국어에서 학술적 표기인 ‘야훼’로 일관되게 옮겨, 본문이 지닌 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘불이 ... 그들을 삼키니’의 의미 범위
  chosen_reading: 물리적 심판의 즉각성
  alternative_readings:
  - 상징적 경고
  - 단순히 다쳤다
  rationale: 문맥상 이는 하나님의 즉각적 심판 사건이므로, 본문의 직접적 서술이 드러내는 치명성을 약화시키지 않았습니다.
  doctrine_reference: 본문 문맥과 מקור 동사 어휘에 대한 원문 우선 원칙
