  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
  footnotes:
  - marker: a
    text: Hebrew 'your brothers' can refer more broadly to close male relatives; here it refers to Nadab and Abihu, who were their cousins.
    reason: lexical_alternative
  - marker: b
    text: Or 'from before the holy place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 미사엘과 엘사반—아론의 삼촌인 웃시엘의 아들들—을 불러 그들에게 말했습니다. 「가까이 오십시오. 당신들의 형제들을 거룩한 곳 앞에서 밖으로, 진영 바깥으로 옮기십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘형제들’은 여기서 혈육상 형제보다 더 넓게 가까운 남성 친족을 가리킬 수 있으며, 여기서는 나답과 아비후를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 곳 앞에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불렀습니다
  lexicon: HALOT
  rationale: 서사 문맥에서 קרא는 단순히 사람을 불러 오게 하는 뜻이므로, 현대 한국어의 자연스러운 ‘부르다’를 사용했습니다.
- source_word: בְּנֵי עֻזִּיאֵל דֹּד אַהֲרֹן
  english_pob_choice: the sons of Uzziel, Aaron’s uncle
  chosen_korean: 아론의 삼촌인 웃시엘의 아들들
  alternatives_korean:
  - 웃시엘의 아들들, 아론의 삼촌
  - 웃시엘의 아들들, 아론의 숙부
  lexicon: HALOT
  rationale: דֹּד는 친족 관계에서 ‘삼촌’이 가장 직접적이며, 히브리어의 동격 설명을 한국어에서도 자연스럽게 풀어 옮겼습니다.
- source_word: קִרְבוּ
  english_pob_choice: Come near
  chosen_korean: 가까이 오십시오
  alternatives_korean:
  - 다가오십시오
  - 오십시오
  lexicon: HALOT
  rationale: קרב의 기본 공간적 뜻을 살리면서, 제사장적·성소적 상황에 어울리는 정중한 명령형으로 옮겼습니다.
- source_word: שְׂאוּ אֶת אֲחֵיכֶם
  english_pob_choice: carry your brothers
  chosen_korean: 당신들의 형제들을 옮기십시오
  alternatives_korean:
  - 당신들의 형제들을 메십시오
  - 당신들의 형제들을 나르십시오
  lexicon: HALOT
  rationale: 시신을 성소 앞에서 밖으로 이동시키라는 실제 행동을 드러내기 위해 ‘carry’는 한국어 ‘옮기다’로 옮겼고, 히브리어의 친족 호칭은 그대로 유지했습니다.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: from before the sanctuary to outside the camp
  chosen_korean: 거룩한 곳 앞에서 밖으로, 진영 바깥으로
  alternatives_korean:
  - 성소 앞에서 진영 밖으로
  - 거룩한 곳 앞에서 진영 바깥으로
  lexicon: HALOT
  rationale: פְּנֵי הַקֹּדֶשׁ는 위치 표현이므로 ‘거룩한 곳 앞’으로, 이동의 종착지는 ‘진영 바깥’으로 옮겨 방향성을 살렸습니다.
theological_decisions:
- issue: פְּנֵי הַקֹּדֶשׁ의 공간적 의미를 어떻게 재현할지
  chosen_reading: ‘거룩한 곳 앞에서’로 옮겨, 단순한 추상적 거룩함이 아니라 성소 구역 앞이라는 실제 위치를 드러냈습니다.
  alternative_readings:
  - ‘성소 앞에서’
  - ‘거룩한 곳의 앞에서’
  rationale: 본문은 부정확한 일반적 ‘거룩함’이 아니라, 나답과 아비후의 시신을 옮겨야 하는 특정 장소를 지시합니다.
  doctrine_reference: 레위기 10장 문맥의 성소 경계와 거룩함의 구별
