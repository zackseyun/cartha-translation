  to: 그러자 모세는 아론의 삼촌인 웃시엘의 아들들인 미사엘과 엘사반을 불러 그들에게 말했습니다. “가까이 오십시오. 여러분의 형제들[a]을 성소 앞에서[b] 진영 밖으로 옮기십시오.”
  rationale: The revision removes the redundant ‘밖으로,’ uses the precise conventional term ‘성소,’ maintains the source’s direction from the sanctuary’s front to outside the camp, and relocates both note anchors to their relevant terms. It also makes the plural direct address idiomatic within modern formal-polite Korean.
