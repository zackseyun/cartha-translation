  naturalness: ‘성소 앞에서 진영 밖으로 옮기십시오’ is concise, natural modern Korean and retains the source’s spatial movement. ‘여러분의’ fits the requested formal-polite register more naturally than ‘당신들의’ in direct address.
  terminology: ‘성소’ is the established and contextually precise rendering of הַקֹּדֶשׁ here. The kinship expression should remain ‘형제들’ in the text, with a note explaining its broader Hebrew use. Footnote anchors need to be placed at the words to which they pertain; the draft places both at the end of the quotation, while note b concerns ‘성소 앞에서.’
  issues:
