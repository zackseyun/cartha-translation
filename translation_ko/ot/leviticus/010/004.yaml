    rationale: Note a explains ‘형제들,’ and note b gives an alternative for ‘성소/거룩한 곳 앞에서’; each should occur immediately after the relevant phrase.
  - severity: low
    issue: ‘당신들의’ is less idiomatic in this formal direct command.
    rationale: In modern formal-polite Korean, ‘여러분의’ avoids the potentially confrontational or awkward effect of ‘당신들의’ while retaining the plural possessive.
