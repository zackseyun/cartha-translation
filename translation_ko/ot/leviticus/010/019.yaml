id: LEV.10.19
reference: Leviticus 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
  footnotes:
  - marker: a
    text: Or 'their purification offering' (for both occurrences of 'sin offering'). The Hebrew חַטָּאת can denote either 'sin' or the sacrifice associated with purification from sin/impurity; in Leviticus, 'sin offering' is the conventional rendering.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and such things as these happened to me.' Aaron refers to the calamities of that day, especially the death of his sons.
    reason: cultural_note
  - marker: c
    text: Or 'would it have pleased the LORD?'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 모세에게 말했습니다[a]. “보십시오, 오늘 그들이 그들의 속죄제와 번제물을 야훼 앞에 드렸는데, 이런 일들이 내게 닥쳤습니다[b]. 내가 오늘 속죄제를 먹었더라면, 그것이 야훼의 눈에 좋았겠습니까[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모세에게’는 문맥상 말을 건네는 대상입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘이런 것들이 내게 닥쳤다’입니다. 여기에는 그날 일어난 아들들의 죽음 같은 재앙이 배경에 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼의 보시기에 좋았겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look / Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사/담화 표지로서, 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽게 강세를 살립니다.
- source_word: הִקְרִיבוּ
  english_pob_choice: presented
  chosen_korean: 드렸는데
  alternatives_korean:
  - 바쳤는데
  - 제시했는데
  lexicon: HALOT
  rationale: 제의 문맥에서 제물을 하나님 앞에 올려 드린 행위를 자연스럽게 나타내며, ‘드리다’가 한국어 성경 문맥에서 가장 읽기 쉽습니다.
- source_word: כָּאֵלֶּה
  english_pob_choice: things like these / such things as these
  chosen_korean: 이런 일들이
  alternatives_korean:
  - 이와 같은 일들이
  - 그런 일들이
  lexicon: HALOT
  rationale: 아론이 겪은 재앙들을 가리키는 표현으로, 사건성을 드러내는 ‘일들’이 원문의 함의를 잘 살립니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh / the LORD
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에’는 히브리어 관용구의 직역이면서도 한국어에서 판단/인정의 기준을 드러내는 표현입니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  - 속죄제물
  lexicon: HALOT
  rationale: 레위기의 제의 용어로서 한국어 성경에서 널리 쓰이는 ‘속죄제’를 택해 제의적 기능을 분명히 했습니다.
theological_decisions:
- issue: YHWH의 표기와 제의적 승인 표현
  chosen_reading: 야훼를 고유명사로 유지하고, בְּעֵינֵי יְהוָה를 ‘야훼의 눈에’로 옮겨 아론의 질문이 제의적 정당성에 관한 것임을 살렸습니다.
  alternative_readings:
  - ‘주님의 보시기에’
  - ‘야훼 보시기에’
  rationale: 이 절은 단순한 감정 표현이 아니라, 그날의 상황 속에서 제물을 먹는 행위가 야훼 앞에서 합당한지 묻는 수사적 질문입니다. 관용구를 너무 매끈하게 풀기보다 원문의 판단 기준을 드러내는 번역을 택했습니다.
  doctrine_reference: 제의적 적합성/수용성의 긴장을 보존
- issue: 아론의 질문이 담은 긴장
  chosen_reading: 아론은 그날의 재앙 이후 속죄제를 먹는 것이 야훼의 승인에 합당했는지를 반문합니다.
  alternative_readings:
  - 단지 개인적 슬픔을 표명합니다
  - 의식적 부정함을 암시합니다
  rationale: 히브리어는 원인과 결론을 분명히 설명하지 않으므로, 번역도 그 긴장을 풀지 않고 수사적 질문으로 남겨 두었습니다.
  doctrine_reference: 해석의 과도한 확정을 피하고 본문 긴장 유지
