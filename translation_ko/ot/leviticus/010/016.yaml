  terminology: ‘속죄제의 숫염소’, ‘엘르아살’, ‘이다말’은 적절합니다. שֹׂרָף는 발견 당시의 불탄 상태를 가리키므로 ‘불에 타 버렸습니다’로 유지할 수 있습니다.
