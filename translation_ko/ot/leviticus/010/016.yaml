id: LEV.10.16
reference: Leviticus 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Now Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
  footnotes:
  - marker: a
    text: Or 'searched and searched for the goat of the sin offering.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'it had been completely burned.' The Hebrew indicates the goat was found in a burned state.
    reason: lexical_alternative
  - marker: c
    text: '''Aaron’s remaining sons'' refers to Eleazar and Ithamar, the sons left after the death of Nadab and Abihu (Lev 10:1–2, 12).'
    reason: cross_reference
translation:
  language: ko
  text: 이제 모세가 속죄제의 숫염소[a]를 자세히 찾아보았는데, 보니 그것은 이미 타 버렸습니다[b]. 그래서 그는 남아 있던 아론의 아들 엘르아살과 이다말에게 화를 내며 말했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄제의 숫염소를 찾고 또 찾았습니다.’ 히브리어는 부정사 절대형과 완료형을 함께 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이미 완전히 타 있었습니다.’ 히브리어는 염소가 불에 탄 상태로 발견되었음을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘남아 있던 아론의 아들들’은 나답과 아비후가 죽은 뒤에 남은 엘르아살과 이다말을 가리킵니다(레 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  english_pob_choice: the goat of the sin offering
  chosen_korean: 속죄제의 숫염소
  alternatives_korean:
  - 속죄제의 염소
  - 속죄제를 위한 숫염소
  lexicon: HALOT
  rationale: שְׂעִיר는 ‘숫염소’를 가리키므로 성별 정보를 살리고, הַחַטָּאת는 제의 범주를 드러내는 ‘속죄제’로 옮겼습니다.
- source_word: דָּרֹשׁ דָּרַשׁ
  english_pob_choice: diligently searched for
  chosen_korean: 자세히 찾아보았는데
  alternatives_korean:
  - 열심히 찾아보았는데
  - 샅샅이 찾아보았는데
  lexicon: HALOT
  rationale: 부정사 절대형과 완료형의 반복이 강조를 이루므로, 단순한 ‘찾다’보다 탐색의 강도를 드러내는 표현으로 옮겼습니다.
- source_word: שֹׂרָף
  english_pob_choice: it had been burned up
  chosen_korean: 이미 타 버렸습니다
  alternatives_korean:
  - 불에 타 있었습니다
  - 완전히 타 버렸습니다
  lexicon: HALOT
  rationale: 발견된 대상의 상태를 나타내므로 결과 상태를 살려 ‘타 버렸습니다’로 옮기되, 문맥상 이미 끝난 상태를 ‘이미’로 분명히 했습니다.
- source_word: הַנּוֹתָרִם
  english_pob_choice: Aaron’s remaining sons
  chosen_korean: 남아 있던 아론의 아들 엘르아살과 이다말
  alternatives_korean:
  - 살아 남은 아론의 아들 엘르아살과 이다말
  - 남은 아론의 아들들인 엘르아살과 이다말
  lexicon: HALOT
  rationale: 남은 두 아들이라는 관계를 자연스럽게 드러내면서, 문맥상 남은 자들임을 ‘남아 있던’으로 표현했습니다.
theological_decisions:
- issue: 모세의 반응을 나타내는 동사 강도
  chosen_reading: ‘화를 내며’로 옮겨 단순한 감정 표명보다 책망과 분노가 함께 있는 서술을 유지했습니다.
  alternative_readings:
  - 분노하며
  - 몹시 화를 내며
  rationale: וַיִּקְצֹף는 강한 분노를 뜻하지만, 한국어에서 과도한 격앙을 피하면서도 서사적 긴장을 살리는 표현이 필요합니다.
  doctrine_reference: 서사 본문의 인물 감정 표현 보존
