revisions:
- from: 너와 너의 아들들은 회막에 들어갈 때에는 포도주나 독주를 마시지 말아야 합니다[a]. 그러면 죽지 않을 것입니다[b]. 이것은 너희 대대로 영원한 규례입니다[c].
  to: 너와 네 아들들은 회막에 들어갈 때 포도주나 독주를 마시지 마십시오[a]. 너희가 죽지 않도록 하십시오[b]. 이것은 너희 대대로 지켜야 할 영속적인 규례입니다[c].
  rationale: 직접 금지의 합쇼체를 정돈하고, 죽음 절을 순종의 단순 결과가 아니라 예방적 경고로 옮겼습니다. ‘영속적인 규례’는 히브리어 법률 관용구의 지속성을 현대어로 명확히 하며, 전통적 표현인 ‘영원한 규례’는 주석에 보존했습니다.
