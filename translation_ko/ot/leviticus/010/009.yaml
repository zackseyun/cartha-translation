base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
  footnotes:
  - marker: a
    text: Or 'intoxicating drink.' The Hebrew term refers broadly to alcoholic drink other than wine.
    reason: lexical_alternative
  - marker: b
    text: Or 'lest you die.'
    reason: alternative_reading
  - marker: c
    text: Or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너와 네 아들들은 회막에 들어갈 때 포도주나 독주를 마시지 마십시오[a]. 너희가 죽지 않도록 하십시오[b]. 이것은 너희 대대로 지켜야 할 영속적인 규례입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독주’는 포도주 외의 알코올성 음료를 폭넓게 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리하여 너희가 죽지 않게 하십시오.’
    reason: alternative_reading
  - marker: c
    text: 또는 ‘영원한 규례입니다.’
    reason: lexical_alternative
