  timestamp: '2026-07-13T13:01:48Z'
review_pass:
  verdict: revise
  source_fidelity: 회막에 들어갈 때라는 한정과 포도주/שֵׁכָר의 구별, 대대로 지속되는 규례라는 뜻은 대체로 충실합니다. 그러나 ‘그러면 죽지 않을 것입니다’는 금지 명령에 순종할 경우의 단순한 결과처럼 들려 경고·예방의 기능을 다소 약화합니다. 또한 히브리어의 복수 ‘너희가 죽지 않도록’을 명시하는 편이 더 정확합니다.
  naturalness: ‘마시지 말아야 합니다’도 이해되지만, 직접적인 제의 규정의 금지에는 현대 합쇼체 ‘마시지 마십시오’가 더 자연스럽고 명료합니다. ‘너와 너의 아들들’은 호응상 가능하나, ‘너와 네 아들들’이 현대 한국어 성경 문체에서 더 자연스럽습니다.
  terminology: ‘포도주’, ‘독주’, ‘회막’, ‘규례’는 적절합니다. עוֹלָם은 문맥상 지속적·영속적 규례를 뜻하므로 ‘영원한 규례’도 허용되지만, 현대어에서 시간적 절대성을 과도하게 느끼지 않도록 ‘영속적인 규례’가 더 직접적입니다. ‘독주’의 주석은 어휘 범위를 적절히 설명합니다.
