  - severity: low
    issue: 금지 명령의 문체
    rationale: אַל תֵּשְׁתְּ의 직접 금지에는 ‘마시지 마십시오’가 ‘마시지 말아야 합니다’보다 합쇼체의 명령력과 자연스러움을 잘 보존합니다.
  - severity: low
    issue: 규례의 지속성 표현
    rationale: ‘영원한’도 전통적으로 가능하나, חֻקַּת עוֹלָם의 법적 지속성을 현대 한국어로 분명히 하는 ‘영속적인’이 적합합니다.
