  source_fidelity: 수정안은 히브리어의 복수 مخاطبة, 제물의 ‘지극히 거룩함’, 제사장들에게 주어진 목적(회중의 죄악을 짊어지고 그들을 위해 속죄함), 그리고 ‘야훼 앞에서’를 보존합니다. נָתַן의 문맥상 암시된 주어는 야훼로 자연스럽게 명시했습니다.
  naturalness: 초안의 ‘먹지 않았느냐?’는 목표 문체인 현대 합쇼체와 맞지 않으므로 ‘먹지 않았습니까?’로 고쳤습니다. 목적 표현도 한국어에서 제사장들의 역할이 분명히 드러나도록 다듬었습니다.
  terminology: חַטָּאת는 본문에서 통용되는 ‘죄 제물’로 옮기고, 정결 기능을 강조하는 대안은 각주에 보존했습니다. קֹדֶשׁ קָדָשִׁים는 ‘지극히 거룩한 것’, עָוֹן은 ‘죄악’, כפר는 ‘속죄하다’로 옮겼습니다.
  issues:
