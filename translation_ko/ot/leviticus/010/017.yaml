    issue: 문체 불일치
    rationale: ‘먹지 않았느냐?’는 반말/해라체 계열의 종결로, 요구된 현대 공식 존대체(합쇼체)에 맞지 않습니다.
  - severity: low
    issue: 목적절의 행위 주체가 다소 흐림
    rationale: ‘회중의 죄를 짊어지게 하시고’는 야훼께서 회중의 죄를 짊어지신다는 식으로 순간적으로 읽힐 수 있습니다. 히브리어는 제사장들(너희)이 짊어지고 속죄하는 목적을 말합니다.
  revised_text: 왜 너희는 거룩한 곳에서 죄 제물을 먹지 않았습니까? 그것은 지극히 거룩한 것이며, 야훼께서 너희가 회중의 죄악을 짊어지고 그들을 위하여 야훼 앞에서 속죄하게 하시려고 너희에게 주셨습니다.
  revised_footnotes:
