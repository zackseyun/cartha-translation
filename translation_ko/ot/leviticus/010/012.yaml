  to: 그때 모세가 아론과 아론의 남은 아들들인 엘르아살과 이다말에게 말했습니다. “야훼의 화제물 가운데 남은 소제물을 가져다가, 그것을 누룩 없는 것으로 제단 곁에서 먹으십시오. 그것은 지극히 거룩하기 때문입니다.”[a]
