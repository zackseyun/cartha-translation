  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
  footnotes:
  - marker: a
    text: Or, more formally, “from the offerings by fire of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 아론과 그의 남은 아들 엘르아살과 이다말에게 말했습니다. “야훼의 화제물 가운데 남은 소제물을 가져다가, 누룩을 넣지 않고 제단 곁에서 먹으십시오. 그것은 지극히 거룩하기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화제물’은 ‘불로 드린 제물’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then Moses spoke
  chosen_korean: 그때 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 그런 다음 모세가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 서사를 앞선 사건 뒤로 이어 주므로, 한국어에서는 ‘그때’로 자연스러운 시간 전환을 살리면서 과도한 강조는 피했습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식제물
  - 곡식 제물
  - 곡식제사
  lexicon: HALOT
  rationale: 이 절의 מִנְחָה는 제의 용어로서 특정한 곡식 제물을 가리키므로, 관용적이면서도 제의 맥락을 분명히 하는 ‘소제물’로 옮겼습니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼의 화제물 가운데
  alternatives_korean:
  - 야훼께 드리는 불로 드린 제물 가운데
  - 야훼의 불 제물 가운데
  lexicon: HALOT
  rationale: אִשֵּׁי의 핵심은 불로 드려진 제물이라는 점이므로, 한국어 제의 용어로 널리 통하는 ‘화제물’을 사용해 불의 이미지와 제의적 성격을 함께 살렸습니다.
- source_word: וְאִכְלֻהָ מַצּוֹת
  english_pob_choice: and eat it unleavened
  chosen_korean: 누룩을 넣지 않고 먹으십시오
  alternatives_korean:
  - 무교병으로 먹으십시오
  - 무교식으로 먹으십시오
  lexicon: HALOT
  rationale: מַצּוֹת은 방식 부사처럼 쓰여 ‘누룩을 넣지 않고’라는 의미를 주므로, 음식 형태보다 먹는 방식을 직접 드러내는 표현을 택했습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩하기
  alternatives_korean:
  - 가장 거룩하기
  - 지성소 같은 거룩함이기
  lexicon: HALOT
  rationale: 히브리어의 최상급 관용구를 한국어에서는 ‘지극히 거룩하다’로 옮겨, 제물의 성별된 정도를 간결하게 전달했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기 이름 יְהוָה를 제목 대체어로 숨기지 않고 고유명으로 드러내기 위해, POB 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제의적 명칭 ‘מִנְחָה’와 ‘אִשֵּׁי’의 한국어 처리
  chosen_reading: 소제물 / 화제물
  alternative_readings:
  - 곡식제물 / 불로 드린 제물
  - 제물 / 불제물
  rationale: 본문은 일반적인 ‘제물’보다 특정한 제의 종류와 조리 방식을 말하므로, 전통 교회어보다 원문 구분이 살아 있는 제의 용어를 택했습니다.
  doctrine_reference: Leviticus sacrificial terminology
