  lexicon: HALOT
  rationale: 히필 부정사구의 계속되는 직무를 한국어 명령형으로 자연스럽게 살리되, 제사장들의 책무를 분명하게 드러내기 위해 ‘가르치게 하십시오’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 집단 표현을 그대로 살리면서도 한국어 성경에서 자연스럽고 공인된 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: כָּל הַחֻקִּים
  english_pob_choice: all the statutes
  chosen_korean: 모든 규례
  alternatives_korean:
  - 모든 법규
  - 모든 법도
  - 모든 규정
  lexicon: HALOT
  rationale: חֻקִּים은 언약 공동체에 주어진 규범들을 가리키므로, 법적·언약적 뉘앙스를 유지하는 ‘규례’가 가장 적절합니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 관용구의 매개성은 유지하되 한국어에서 다소 생경한 직역을 완화하기 위해 ‘손을 통해’로 옮겼습니다. 이는 모세가 전달 매개자라는 의미를 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 신명은 표준 한국어 교회용 독자성을 고려해 ‘여호와’로 옮겼습니다. 이번 기록은 해당 관행을 따르되, 원어의 고유명사라는 점은 유지됩니다.
theological_decisions:
