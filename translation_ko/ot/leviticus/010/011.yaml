  naturalness: ‘그리고’보다는 앞 절에 접속되는 직무를 나타내는 ‘또한’이 자연스럽습니다. ‘야훼께서 모세를 통하여 그들에게 말씀하신 모든 규례’는 관계절의 수식 범위와 ‘그들에게’의 지시 대상(이스라엘 자손)을 한국어에서 명료하게 드러냅니다.
  terminology: יְהוָה는 제공된 POB 원칙 및 영어 감사 기록의 ‘Yahweh’에 맞추어 ‘야훼’로 통일하는 것이 적절합니다. ‘이스라엘 자손’과 ‘모든 규례’는 각각 בְּנֵי יִשְׂרָאֵל과 כָּל־הַחֻקִּים에 적절합니다.
