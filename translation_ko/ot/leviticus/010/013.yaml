  to: 너희는 거룩한 곳에서 그것을 먹어야 합니다. 그것은 야훼의 화제물 가운데서 너의 몫과 네 아들들의 몫이기 때문입니다[a]. 내가 그렇게 명령받았기 때문입니다.
