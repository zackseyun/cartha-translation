id: LEV.10.13
reference: Leviticus 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the offerings made by fire to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 거룩한 곳에서 그것을 먹어야 합니다. 그것은 야훼의 화제물 가운데서 너의 몫과 네 아들들의 몫이기 때문입니다[a]. 내가 그렇게 명령받았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘야훼께 불로 드리는 제물들 가운데서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  english_pob_choice: You shall eat
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹습니다
  - 먹으십시오
  lexicon: HALOT
  rationale: 직접 명령의 법규 문맥이므로 의무를 나타내는 표현이 자연스럽습니다. 합쇼체로 유지하되, 단순 서술보다 명령성을 분명히 했습니다.
- source_word: בְּמָקוֹם קָדֹשׁ
  english_pob_choice: in a holy place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩한 장소에서
  lexicon: HALOT
  rationale: 관사 없는 מקום קָדֹשׁ를 특정 성소실로 좁히지 않고, 본문이 요구하는 성결한 예식 공간으로 옮겼습니다. '거룩한'이 제의적 어감을 가장 잘 보존합니다.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  english_pob_choice: your portion and the portion of your sons
  chosen_korean: 너와 네 아들들의 몫
  alternatives_korean:
  - 너의 몫과 네 아들들의 몫
  - 너의 분깃과 네 아들들의 분깃
  lexicon: HALOT
  rationale: 제사장 몫을 가리키는 חֹק은 여기서 추상적 '율례'보다 배당된 몫의 뜻이 강하므로 '몫'으로 옮겼습니다. 반복을 압축해도 소유 관계는 유지됩니다.
- source_word: מֵאִשֵּׁי יְהוָה
  english_pob_choice: from the food offerings of Yahweh
  chosen_korean: 야훼께 드리는 화제물 가운데서
  alternatives_korean:
  - 야훼의 화제물 가운데서
  - 불로 드리는 예물 가운데서
  lexicon: HALOT
  rationale: אִשֵּׁי는 전통적으로 '화제물'로 알려진 제의 용어이므로 이를 유지했습니다. 출처와 수여 주체를 자연스럽게 드러내기 위해 '야훼께 드리는'을 덧붙였습니다.
- source_word: כִּי כֵן צֻוֵּיתִי
  english_pob_choice: for so I have been commanded
  chosen_korean: 내가 그렇게 명령받았기 때문입니다
  alternatives_korean:
  - 내가 그렇게 명령을 받았기 때문입니다
  - 그리 명령받았기 때문입니다
  lexicon: HALOT
  rationale: 수동형 צֻוֵּיתִי의 피동 의미를 살려, 화자가 상위 권위로부터 받은 명령임을 분명히 했습니다. 현대 한국어에서 자연스러운 종결로 정리했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문서의 기본 원칙에 따라 본문의 고유명사를 그대로 드러내는 음역을 택했습니다. 제의 문맥에서 하나님의 이름을 제목어로 바꾸지 않고 보존하는 것이 원문 가시성에 유리합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and audited terminology'
- issue: 제사장 몫의 의미
  chosen_reading: 몫
  alternative_readings:
  - 분깃
  - 율례
  - 배당
  rationale: 본문은 제사장 가족이 제물에서 받는 배정분을 말하므로, 법조문 자체보다 실제 배분을 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
