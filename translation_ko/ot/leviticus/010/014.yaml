id: LEV.10.14
reference: Leviticus 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the breast of the presentation offering.' The Hebrew term refers to the portion ritually waved before the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'the thigh of the raised offering.' The Hebrew term for 'contribution' is literally something lifted up or set apart as a priestly due.
    reason: lexical_alternative
  - marker: c
    text: '''Peace offerings'' may also be rendered ''fellowship offerings,'' though the Hebrew term can suggest a wider sense of peace, wholeness, or well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너와 네 아들들과 네 딸들은 정결한 곳에서 흔들어 바친 제물의 가슴[a]과 들어 올려 바친 제물의 넓적다리[b]를 먹어야 합니다. 이것들은 너와 네 아들들의 몫으로, 이스라엘 자손의 화목제 제물 가운데서 주어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흔들어 바친 제물’은 히브리어가 제물의 일부를 여호와 앞에서 흔들어 바치는 의식을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘들어 올려 바친 제물’은 히브리어로 문자적으로 ‘들어 올린 것’에 가까운 표현이며, 제사장에게 배정된 몫을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְ / תֹּאכְלוּ
  english_pob_choice: shall eat
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹습니다
  - 먹을 것입니다
  lexicon: HALOT
  rationale: 법규 문맥의 명령/지시를 한국어 합쇼체로 자연스럽게 옮기되, 단순 미래보다 의무성을 분명히 했습니다.
- source_word: חֲזֵה הַתְּנוּפָה
  english_pob_choice: the breast of the wave offering
  chosen_korean: 흔든 제물의 가슴
  alternatives_korean:
  - 흔든 제물의 가슴살
  - 요제로 드린 제물의 가슴
  lexicon: HALOT
  rationale: תְּנוּפָה의 제의적 ‘흔듦’을 살리면서, 제물의 해당 부위를 한국어로 바로 이해되게 했습니다. '가슴'은 'breast'의 가장 직접적인 대응입니다.
- source_word: שׁוֹק הַתְּרוּמָה
  english_pob_choice: the thigh of the contribution
  chosen_korean: 들어 올린 제물의 넓적다리
  alternatives_korean:
  - 거둬 올린 제물의 넓적다리
  - 들어 올린 제물의 허벅지
  lexicon: HALOT
  rationale: תְּרוּמָה의 문자적 의미인 ‘들어 올림’/‘거둠’을 드러내어 제의적 성격을 보존했고, 부위는 문맥상 '넓적다리'로 옮겼습니다.
- source_word: בְּמָקוֹם טָהוֹר
  english_pob_choice: in a clean place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 깨끗한 곳에서
  - 정결한 곳에서
  lexicon: HALOT
  rationale: 여기서 טָהוֹר은 단순 위생보다 제의적 정결을 가리키므로, 한국어로는 예배/제사 문맥에 맞는 '거룩한 곳'으로 옮겼습니다. 다만 본문의 핵심은 장소의 정결성이므로 의미를 과장하지 않도록 간결하게 처리했습니다.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  english_pob_choice: your portion and your sons’ portion
  chosen_korean: 너와 너의 아들들의 몫
  alternatives_korean:
  - 너의 분깃과 너의 아들들의 분깃
  - 너와 너의 아들들의 정해진 몫
  lexicon: HALOT
  rationale: חֹק는 여기서 ‘규례’보다 제사장에게 정해진 배분 몫의 뜻이므로, 자연스럽고 오해가 적은 '몫'을 선택했습니다.
- source_word: מִזִּבְחֵי שַׁלְמֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sacrifices of the peace offerings of the sons of Israel
  chosen_korean: 이스라엘 자손의 화목제 희생 제물 가운데서
  alternatives_korean:
  - 이스라엘 자손의 평화제 희생 제물 가운데서
  - 이스라엘 자손의 화목제 제물들 가운데서
  lexicon: HALOT
  rationale: שְׁלָמִים의 통상적 한국어 대응은 '화목제'이므로 이를 유지했고, מִן의 출처 의미를 '가운데서'로 풀어 제사 분배의 출처를 분명히 했습니다.
theological_decisions:
- issue: 제의적 '정결한 장소'의 한국어 처리
  chosen_reading: 거룩한 곳
  alternative_readings:
  - 정결한 곳
  - 깨끗한 곳
  rationale: 문맥상 음식 섭취 장소의 제의적 적합성이 핵심이므로, 단순 청결보다 예배적·제의적 분리성을 드러내는 표현을 택했습니다. 이는 레위기의 정결 규정 맥락과 부합합니다.
  doctrine_reference: 레위기 정결법/제의적 분리성
