revisions:
- from: 아론의 아들 나답과 아비후는 각각 자기 불판을 가져다가 그 안에 불을 넣고 그 위에 향을 올려, 야훼 앞에 그분이 그들에게 명령하지 않으신 이방 불을 드렸습니다.[a]
  to: 아론의 아들 나답과 아비후는 각각 자기 향로를 가져다가 그 안에 불을 넣고 그 위에 향을 놓아, 야훼 앞에 야훼께서 그들에게 명령하지 않으신 허용되지 않은 불[a]을 드렸습니다.
  rationale: 본문의 제의적 위반을 ‘이방’이라는 민족·종교적 연상 없이 ‘허용되지 않은 불’로 명확히 했습니다. 또한 제의 도구를 ‘향로’로, 상대절의 주어를 ‘야훼께서’로 고쳐 정확성과 자연스러움을 높였습니다. 각주는 어휘 대안을 보존하면서도 본문이 말하는 대상을 넘어서 해석하지 않도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:49Z'
review_pass:
  verdict: revise
  source_fidelity: ‘이방 불’은 זָרָה를 민족·종교적 ‘이방’의 의미로 오해하게 할 수 있어, 바로 뒤 절이 밝히는 ‘명령되지 않음/허용되지 않음’의 제의적 의미를 반영하도록 고쳐야 합니다. מַחְתָּה는 이 문맥에서 향을 얹고 불을 담는 제의 도구이므로 ‘향로’가 ‘불판’보다 정확하고 자연스럽습니다.
  naturalness: ‘그분이’는 한국어 서사에서 다소 부자연스럽고 선행사가 멀어질 수 있습니다. ‘야훼께서 그들에게 명령하지 않으신’으로 주어를 명시하면 명료합니다. ‘향을 놓고’는 원문의 단순 배치 동작을 자연스럽게 보존합니다.
  terminology: 신명은 프로젝트 선택 및 원문에 따라 ‘야훼’로 유지합니다. אֵשׁ זָרָה는 ‘허용되지 않은 불’로 옮겨 규범적·제의적 위반을 나타내되, 각주의 ‘낯선/외래의 불’ 대안을 보존합니다.
