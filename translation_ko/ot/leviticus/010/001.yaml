  - severity: low
    issue: ‘불판’
    rationale: 마חְתָּה는 불을 담아 향을 드리는 제의 도구입니다. ‘향로’가 문맥상 더 분명하며 한국어 성경 문체에도 자연스럽습니다.
  - severity: low
