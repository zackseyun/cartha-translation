  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
  footnotes:
  - marker: a
    text: Or 'strange fire' or 'foreign fire.' The Hebrew phrase refers to fire that was not authorized by the LORD, as the next clause explains.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들 나답과 아비후는 각각 자기 향로를 가져다가 그 안에 불을 넣고 그 위에 향을 놓아, 야훼 앞에 야훼께서 그들에게 명령하지 않으신 허용되지 않은 불[a]을 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵשׁ זָרָה는 ‘낯선 불’ 또는 ‘외래의 불’로도 옮길 수 있습니다. 이어지는 절은 이것이 야훼께서 그들에게 명령하지 않으신 불임을 밝힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אַהֲרֹן
  english_pob_choice: Aaron’s sons
  chosen_korean: 아론의 아들
  alternatives_korean:
  - 아론의 아들들
  - 아론에게서 난 아들들
  lexicon: HALOT
  rationale: 소유관계와 가족관계를 자연스럽게 살리되, 복수 주어 뒤에서 한국어에서는 단수 명사형이 더 간결합니다.
- source_word: אִישׁ מַחְתָּתוֹ
  english_pob_choice: each took his firepan
  chosen_korean: 각각 자기 불판
  alternatives_korean:
  - 각자 자기 향로
  - 각각 자기 화로
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각각’으로 살리고, מַחְתָּה는 제의적 도구이지만 일반 독자에게도 이해되도록 ‘불판’으로 옮겼습니다.
- source_word: אֵשׁ זָרָה
  english_pob_choice: unauthorized fire
  chosen_korean: 이방 불
  alternatives_korean:
  - 허가받지 않은 불
  - 낯선 불
  - 외래 불
  lexicon: HALOT
  rationale: קדושה의 경계를 어긴 불이라는 점을 반영하려 했고, 여기서는 ‘zār’를 POB의 영어 선택처럼 규범 위반의 성격으로 직접 드러내는 표현이 필요합니다. 다만 한국어에서는 ‘이방 불’이 다소 낯설 수 있어 후속 검토가 가능합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: project default
  rationale: 원문의 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 대문자 관습이 아니라 고유 신명 자체를 드러냈습니다.
theological_decisions:
- issue: אֵשׁ זָרָה의 의미 범주
  chosen_reading: 제의적으로 허용되지 않은 불로 이해했습니다.
  alternative_readings:
  - 기묘한 불
  - 외래의 불
  - 단순히 낯선 불
  rationale: 바로 뒤의 ‘그분이 그들에게 명령하지 않으신’ 절이 위반의 성격을 설명하므로, 의미를 모호하게 두기보다 규범 위반을 분명히 드러내는 것이 본문 흐름에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 6
