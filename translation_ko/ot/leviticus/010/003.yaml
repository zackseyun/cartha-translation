reference: Leviticus 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
  footnotes:
  - marker: a
    text: Or, “By those who come near me I will be treated as holy.” The Hebrew can express either God's holiness being manifested or his being regarded as holy by those who approach him.
    reason: alternative_reading
  - marker: b
    text: Or, “I will be honored.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 아론에게 말했습니다. “야훼께서 말씀하신 것이 바로 이것입니다. 곧 ‘나에게 가까이 오는 이들 가운데서 나는 거룩함을 나타내고, 온 백성 앞에서 나는 영광을 받겠다’ 하신 것입니다.” 아론은 침묵했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나에게 가까이 오는 이들에 의해 나는 거룩하게 여김을 받을 것이다.” 히브리어는 하나님의 거룩하심이 드러나는 것과, 그분께 나아가는 이들이 그분을 거룩하게 여기는 것을 모두 표현할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “나는 존귀를 받을 것이다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 야훼의 고유명사를 가리키므로, 본 프로젝트 기본값에 따라 제목어 대체가 아니라 음역인 ‘야훼’를 사용했습니다.
- source_word: בִּקְרֹבַי אֶקָּדֵשׁ
  english_pob_choice: Among those who come near me I will be sanctified
  chosen_korean: 나에게 가까이 오는 이들 가운데서 나는 거룩함을 나타내고
  alternatives_korean:
  - 나에게 가까이 오는 이들 가운데서 나는 거룩하게 될 것이다
  - 나에게 가까이 오는 이들 가운데서 나는 거룩하다고 여김을 받을 것이다
  lexicon: HALOT
  rationale: קדש의 피동/반사적 뉘앙스를 살리되 한국어에서 자연스럽게 풀어 ‘거룩함을 나타내다’로 옮겼습니다. 이는 하나님의 거룩하심이 접근하는 자들 가운데 드러난다는 의미를 보존합니다.
- source_word: וְעַל פְּנֵי כָל הָעָם אֶכָּבֵד
  english_pob_choice: and before all the people I will be glorified
  chosen_korean: 온 백성 앞에서 나는 영광을 받겠다
  alternatives_korean:
  - 온 백성 앞에서 나는 영광스럽게 되겠다
  - 온 백성 앞에서 나는 존귀를 얻겠다
  lexicon: HALOT
  rationale: כבד의 공적 존귀/영광의 뜻을 살려 ‘영광을 받다’로 옮겼습니다. ‘존귀’보다 문맥상 신적 선언의 무게가 더 잘 드러납니다.
- source_word: וַיִּדֹּם
  english_pob_choice: was silent
  chosen_korean: 침묵했습니다
  alternatives_korean:
  - 잠잠했습니다
  - 말없이 있었습니다
  lexicon: HALOT
  rationale: 아론의 즉각적이고 엄숙한 반응을 간결하게 전달하는 표준적인 표현으로 ‘침묵했습니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 거룩함과 영광이 누구에게/어떻게 드러나는지
  chosen_reading: ‘거룩함을 나타내고’와 ‘영광을 받겠다’로 병렬을 유지하여, 하나님의 주도성과 공적 표명 둘 다를 살렸습니다.
  alternative_readings:
  - ‘거룩하게 되겠다’
  - ‘거룩하다고 여김을 받겠다’
  rationale: 히브리어는 접근하는 자들 가운데서 하나님의 거룩하심이 드러나고, 모든 백성 앞에서 영광이 확인되는 긴장을 함께 담습니다. 한쪽으로만 좁히지 않기 위해 드러남과 수여된 영광의 병렬을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
