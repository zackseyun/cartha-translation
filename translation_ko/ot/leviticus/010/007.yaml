id: LEV.10.7
reference: Leviticus 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: ko
  text: 너희는 회막의 입구에서 나오지 마십시오. 죽을까 하니, 야훼의 관유가 너희 위에 있기 때문입니다.” 그들은 모세의 말대로 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: from the entrance of the tent of meeting
  chosen_korean: 회막의 입구에서
  alternatives_korean:
  - 회막의 문에서
  - 회막의 출입구에서
  lexicon: HALOT
  rationale: פֶּתַח와 אֹהֶל מוֹעֵד를 자연스럽게 살려, 성막 복합체를 가리키는 고유한 예배 용어를 현대 한국어로 간결하게 옮겼습니다.
- source_word: לֹא תֵצְאוּ פֶּן תָּמֻתוּ
  english_pob_choice: you shall not go out ... lest you die
  chosen_korean: 나오지 말아라. 죽을까 하노니
  alternatives_korean:
  - 나가서는 안 됩니다. 죽을까 하니
  - 나오지 마십시오. 그렇지 않으면 죽습니다
  lexicon: HALOT
  rationale: 금지와 경고를 함께 담되, פֶּן의 경고성을 ‘죽을까 하노니’로 옮겨 출구 금지의 엄중함을 유지했습니다.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  english_pob_choice: the anointing oil of Yahweh
  chosen_korean: 야훼의 관유
  alternatives_korean:
  - 야훼의 기름부음의 기름
  - 야훼의 기름
  lexicon: HALOT
  rationale: מִשְׁחָה 계열을 한국 교회 전통 용어인 ‘관유’로 옮겨, 제사장 성별에 쓰인 거룩한 기름이라는 제의적 의미를 분명히 했습니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: is on you
  chosen_korean: 너희 위에 있기 때문이다
  alternatives_korean:
  - 너희에게 있기 때문이다
  - 너희에게 임했기 때문이다
  lexicon: HALOT
  rationale: ‘on you’의 표면적 위치를 살리면서, 기름이 제사장들에게 임한 성별 상태를 한국어로 자연스럽게 표현했습니다.
- source_word: כִּדְבַר מֹשֶׁה
  english_pob_choice: according to the word of Moses
  chosen_korean: 모세의 말대로
  alternatives_korean:
  - 모세의 명령대로
  - 모세가 말한 대로
  lexicon: HALOT
  rationale: דָּבָר를 여기서는 구체적인 ‘말/명령’로 이해할 수 있어, 문맥에 맞게 간결한 순응 표현으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사 표기를 고유명사로 보존하여, 제의 규정의 권위를 부여한 언약명이라는 점을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직접 명령문의 공손/긴박성
  chosen_reading: ‘나오지 말아라’와 본문의 경고를 직설적으로 유지
  alternative_readings:
  - 나오지 마십시오
  - 밖으로 나가지 마십시오
  rationale: 제사장들에게 주어진 생명 관련 금지이므로, 지나치게 완곡하지 않게 하되 합쇼체 서술 안에서 긴박한 금지의 힘을 살렸습니다.
  doctrine_reference: POB Korean style guidance — direct prohibition in narrative/command contexts
