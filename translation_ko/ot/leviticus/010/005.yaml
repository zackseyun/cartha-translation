source:
  edition: WLC
  text: וַֽ/יִּקְרְב֗וּ וַ/יִּשָּׂאֻ/ם֙ בְּ/כֻתֳּנֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/005.yaml
  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
  footnotes:
  - marker: a
    text: Or 'by their tunics.' The Hebrew preposition can indicate means, so the phrase may mean they carried the bodies while grasping or using the tunics.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가까이 와서 그들의 긴옷을 입힌 채 그들을 진영 밖으로 가져갔습니다[a]. 모세가 말한 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 긴옷으로’. 히브리어 전치사 ב는 수단을 나타낼 수 있어서, 옷을 붙잡아 또는 옷을 이용해 시신을 옮겼다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  english_pob_choice: they came near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가와서
  - 나아와서
  lexicon: HALOT
  rationale: קרב의 이동 방향을 자연스러운 현대 한국어로 옮기되, 제의적 맥락에서의 접근이라는 느낌을 유지했습니다.
- source_word: וַיִּשָּׂאֻם
  english_pob_choice: carried them
  chosen_korean: 그들을 가져갔습니다
  alternatives_korean:
  - 그들을 옮겼습니다
  - 그들을 실어 갔습니다
  lexicon: HALOT
  rationale: 시신을 성소 영역 밖으로 옮기는 문맥이므로 ‘가져갔습니다’가 가장 자연스럽고, 단순한 ‘들어 올리다’보다 결과 행위를 잘 드러냅니다.
- source_word: בְּכֻתֳּנֹתָם
  english_pob_choice: in their tunics
  chosen_korean: 그들의 긴옷을 입힌 채
  alternatives_korean:
  - 그들의 속옷으로
  - 그들의 옷으로
  lexicon: HALOT
  rationale: כֻּתֹּנֶת은 긴옷/속옷 계열의 옷을 가리키며, ב의 수단 용법을 반영해 ‘입힌 채’로 옮겨 ‘옷을 붙잡아 운반했다’는 가능성을 살렸습니다.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  english_pob_choice: to outside the camp
  chosen_korean: 진영 밖으로
  alternatives_korean:
  - 진영 밖에
  - 진영 바깥으로
  lexicon: HALOT
  rationale: אֶל의 방향성을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘밖으로’로 처리했습니다.
theological_decisions:
- issue: 모세의 지시를 인용하는 종결부의 뉘앙스
  chosen_reading: ‘모세가 말한 그대로였습니다’로 옮겨, 앞선 명령과의 일치와 순종을 간결하게 드러냈습니다.
  alternative_readings:
  - ‘모세가 말한 대로였습니다’
  - ‘모세가 말한 것과 같았습니다’
  rationale: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה는 앞선 지시의 정확한 이행을 확인하는 문장으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 서술의 충실성 및 본문 내 순종-성취 관계
