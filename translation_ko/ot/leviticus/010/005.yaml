  to: 그들은 가까이 다가가 그들을 입고 있던 긴옷 그대로 진영 밖으로 옮겼습니다[a]. 모세가 말한 대로였습니다.
  rationale: ‘입힌 채’를 ‘입고 있던 긴옷 그대로’로 바꾸어 원문이 말하지 않는 착의 행위를 제거하고, 긴옷과 함께 운반되었다는 기본 의미를 자연스럽게 살렸습니다. 전치사 ב의 수단적 해석은 각주에 보존했습니다. ‘옮겼습니다’는 נשׂא의 문맥상 운반 의미와 진영 밖을 향한 이동을 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:51Z'
