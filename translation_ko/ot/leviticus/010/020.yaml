language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
  footnotes:
  - marker: a
    text: Or 'and it was pleasing in his sight' / 'and he approved.' The Hebrew idiom literally reads 'and it was good in his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 듣고, 그 일은 그의 눈에 좋았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘그의 눈에 좋았다’는 뜻이며, 자연스럽게는 ‘그에게 좋았다/받아들일 만했다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들어 알았습니다
  - 들었습니다, 그리고 이해했습니다
  lexicon: HALOT
  rationale: שׁמע는 기본적으로 ‘듣다’이므로, 서술 순서를 따라 ‘들었습니다’로 옮겨 추가 해석을 덧붙이지 않았습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: 고유명사 표기 관행
  rationale: 성서 인명으로 굳어진 표기인 ‘모세’를 사용했습니다.
- source_word: וַיִּיטַב
  english_pob_choice: it was good
  chosen_korean: 그 일은 좋았습니다
  alternatives_korean:
  - 그것은 좋았습니다
  - 그 일은 받아들일 만했습니다
  - 그것은 만족스러웠습니다
  lexicon: HALOT
  rationale: יטב의 기본 의미를 살리되, 뒤의 관용구와 결합된 평가의 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘좋았습니다’로 옮겼습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그의 눈에
  alternatives_korean:
  - 그의 보기에
  - 그에게
  - 그의 시야에서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 눈에’를 직역해 평가·판단의 이미지를 보존했습니다.
theological_decisions:
- issue: 히브리 관용구의 평가 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그 일은 그의 눈에 좋았습니다’로 직역적 이미지를 유지하되, 한국어 문장으로는 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - 그는 그 일에 동의했습니다
  - 그는 그 일을 받아들였습니다
  rationale: 본문은 모세의 내적 평가를 말하며, 명시적 ‘동의’나 ‘수용’보다 관용구 자체를 드러내는 것이 원문 의미를 더 투명하게 보존합니다.
  doctrine_reference: 본문 해석상 논점은 주로 서술적 뉘앙스이며 교리적 쟁점은 아닙니다.
