    rationale: 히브리어는 ‘거제의 넓적다리’(שׁוֹק הַתְּרוּמָה)와 ‘요제의 가슴’(חֲזֵה הַתְּנוּפָה)을 구별합니다. 초안은 전자를 누락하여 제의 범주와 병행 구조를 훼손합니다.
