revisions:
- from: 그들은 흔든 제물의 넓적다리와 흔든 제물의 가슴, 곧 기름기 있는 화제물과 함께 그것들을 야훼 앞에서 흔들기 위해 가져올 것입니다. 그것은 너와 너와 함께 있는 네 아들들에게 영원한 규례가 될 것이니, 야훼께서 명령하신 대로입니다.[a][b][c][d]
  to: 그들은 기름 부위를 불살라 드리는 제물과 함께 거제의 넓적다리[a]와 요제의 가슴[b]을 가져와, 야훼[c] 앞에서 요제로 흔들어 바칠 것입니다. 이것은 야훼께서 명령하신 대로 너와 네 아들들에게 영구한 규례에 따라 돌아갈 몫입니다.
  rationale: 제사장에게 주어지는 두 부위를 구별하는 히브리어의 구성 관계를 회복했습니다. ‘거제’와 ‘요제’는 본문의 제의 어휘를 보존하기 위해 유지하되, 각주로 현대 독자를 위한 최소한의 설명을 제공했습니다. ‘영구한 규례에 따라 돌아갈 몫’은 ‘너와 네 아들들에게 … 영구한 규례로’라는 히브리어의 지속적 권리를 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:01:30Z'
