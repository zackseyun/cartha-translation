  source_fidelity: 초안은 תְּרוּמָה(거제/봉헌 몫)를 תְּנוּפָה(요제)와 동일하게 ‘흔든 제물’로 옮겨 두 제의 용어의 구별을 잃었습니다. 또한 ‘그것들을’은 히브리어에 없는 대상을 보태며, ‘너와 너와 함께 있는 네 아들들’은 부자연스럽습니다. 개정문은 거제와 요제를 구별하고, 기름 부위의 화제물과 함께 가져온다는 관계 및 제사장 몫이라는 결론을 보존합니다.
  naturalness: ‘거제’와 ‘요제’는 현대 일상어는 아니지만 본문의 대응하는 제의 전문어를 간결하게 보존하는 확립된 성서 한국어 용어입니다. 각주에서 뜻을 풀고, 본문은 합쇼체로 자연스럽게 다듬었습니다.
  terminology: שׁוֹק은 ‘넓적다리’, חָזֶה는 제물의 ‘가슴’, תְּרוּמָה는 ‘거제’, תְּנוּפָה는 ‘요제’로 구별했습니다. אִשֵּׁי הַחֲלָבִים은 ‘기름 부위를 불살라 드리는 제물’로, יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 옮겼습니다.
  issues:
