id: LEV.10.15
reference: Leviticus 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
  footnotes:
  - marker: a
    text: Or 'leg' for 'thigh.'
    reason: lexical_alternative
  - marker: b
    text: '''Contribution'' traditionally ''heave offering.'''
    reason: lexical_alternative
  - marker: c
    text: '''Wave offering'' refers to a ritual presentation before the LORD; some render more generally ''presentation offering.'''
    reason: cultural_note
  - marker: d
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 흔든 제물의 넓적다리와 흔든 제물의 가슴, 곧 기름기 있는 화제물과 함께 그것들을 야훼 앞에서 흔들기 위해 가져올 것입니다. 그것은 너와 너와 함께 있는 네 아들들에게 영원한 규례가 될 것이니, 야훼께서 명령하신 대로입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '넓적다리'이며, 문맥상 제물의 특정 부위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 תְּרוּמָה는 전통적으로 '거제' 또는 '거제물'로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: '''흔든 제물''은 제단 앞에서 의례적으로 들어 올리거나 흔들어 바치는 제의를 가리킵니다.'
    reason: cultural_note
  - marker: d
    text: 히브리어의 신명기호 יְהוָה는 야훼를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  english_pob_choice: thigh
  chosen_korean: 넓적다리
  alternatives_korean:
  - 다리
  - 허벅지
  lexicon: HALOT
  rationale: 제사 문맥에서 제물의 특정 부위를 가리키는 말이므로 일반적인 '다리'보다 더 구체적인 '넓적다리'를 택했습니다.
- source_word: תְּרוּמָה
  english_pob_choice: contribution
  chosen_korean: 제물
  alternatives_korean:
  - 봉헌물
  - 들어 올린 제물
  lexicon: HALOT
  rationale: 문맥상 제사장 몫으로 구별된 몫을 가리키므로, 한국어에서는 지나치게 기술적인 옛 표현보다 의미를 바로 드러내는 '제물'로 풀었습니다.
- source_word: חָזֶה
  english_pob_choice: breast
  chosen_korean: 가슴
  alternatives_korean:
  - 흉부
  - 가슴살
  lexicon: HALOT
  rationale: 희생 제물의 해부학적 부위를 가리키는 표준적 표현이므로 자연스럽고 분명한 '가슴'을 사용했습니다.
- source_word: תְּנוּפָה
  english_pob_choice: wave offering
  chosen_korean: 흔든 제물
  alternatives_korean:
  - 요제
  - 흔들어 드리는 제물
  lexicon: HALOT
  rationale: POB의 'wave offering'을 직역하되, 한국어 독자가 행위를 바로 이해하도록 동사형 느낌의 '흔든 제물'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신성호칭 יהוה는 '야훼'로 옮겨 본문에서 직접 보존했습니다.
- source_word: לְחָק עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 항구한 규례
  - 영구한 법규
  lexicon: HALOT
  rationale: 지속성을 나타내는 표현으로, 제사 규정 문맥에 맞는 '규례'를 유지하면서 'עוֹלָם'의 지속성을 '영원한'으로 살렸습니다.
theological_decisions:
- issue: 제사 용어를 한국어로 얼마나 기술적으로 유지할지
  chosen_reading: '''흔든 제물''과 ''규례''를 유지하되, ''제물''과 ''가슴''처럼 의미가 즉시 드러나는 표현을 병행했습니다.'
  alternative_readings:
  - '''요제''와 ''영구한 법규''처럼 전통 제의 용어를 일괄 유지하는 방식'
  - '''흔들어 드리는 제물''처럼 설명을 더 늘리는 방식'
  rationale: 히브리어 제의 구조를 지우지 않으면서도 현대 한국어 독자가 문장의 기능을 바로 파악할 수 있도록 절충했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5, 6
