  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
  footnotes:
  - marker: a
    text: Or, 'Do not uncover your heads' or 'Do not leave your hair unkempt.' The Hebrew refers to a mourning sign involving the head/hair.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the burning that the LORD burned'; the translation 'has kindled' is used for natural English with the cognate expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 아론과 그의 아들 엘르아살과 이다말에게 말했습니다. 「너희 머리를 풀어 헤치지 말고, 너희 옷을 찢지 말아라. 그래야 너희가 죽지 않고 온 회중에게 진노가 임하지 않을 것이다. 너희 형제, 곧 이스라엘 온 집은 야훼께서 불사르신 그 불사름을 슬퍼하며 울어야 한다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풀어 헤치다’는 히브리어의 머리/머리카락을 단정하지 않게 두는 장례 표지를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  english_pob_choice: Do not uncover your heads / Do not let your heads hang loose
  chosen_korean: 너희 머리를 풀어 헤치지 말고
  alternatives_korean:
  - 너희 머리를 드러내지 말고
  - 너희 머리를 헝클어뜨리지 말고
  lexicon: HALOT
  rationale: פרע는 장례의 표지로 머리카락을 풀어 헝클고 단정하지 않게 두는 행위를 가리키므로, 한국어에서는 ‘풀어 헤치다’가 그 몸짓과 의미를 가장 직접적으로 드러냅니다.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  english_pob_choice: do not tear your garments
  chosen_korean: 너희 옷을 찢지 말아라
  alternatives_korean:
  - 너희 옷을 찢어라 하지 말아라
  - 너희 옷을 찢지 마라
  lexicon: HALOT
  rationale: פרם은 장례 때 옷을 찢는 행위를 뜻하므로, 동작을 간명하게 살린 ‘옷을 찢다’로 옮겼습니다.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  english_pob_choice: and he become angry with all the congregation
  chosen_korean: 온 회중에게 진노가 임하지 않을 것이다
  alternatives_korean:
  - 그가 온 회중에게 진노하지 않을 것이다
  - 온 회중 위에 노가 내리지 않을 것이다
  lexicon: HALOT
  rationale: 히브리어는 ‘진노하다’의 동사이지만 문맥상 야훼의 심판이 회중 위에 임하는 결과를 말하므로, 한국어에서는 자연스러운 결과 표현으로 풀어 옮기되 신적 진노의 무게는 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유한 언약 이름 יהוה를 한국어 기본 표기로 ‘야훼’로 옮겨, 인칭적 신명과 전통적 대치어를 구분했습니다.
- source_word: הַשְּׂרֵפָה אֲשֶׁר שָׂרַף יְהוָה
  english_pob_choice: the burning that Yahweh has kindled
  chosen_korean: 야훼께서 불사르신 그 불사름
  alternatives_korean:
  - 야훼께서 태우신 그 불길
  - 야훼께서 내리신 그 불사름
  lexicon: HALOT
  rationale: שׂרֵפָה를 추상화하지 않고 ‘불사름’으로 유지하여, 나답과 아비후에게 임한 직접적인 불의 형벌이라는 구체성을 살렸습니다.
theological_decisions:
- issue: 야훼의 이름과 주어의 보존
  chosen_reading: 본문의 יהוה는 ‘야훼’로 옮기고, 불사름의 주체를 분명히 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 대치
  - 주어를 완전히 비인칭화
  rationale: 이 절은 야훼의 거룩한 심판과 공동체적 애도를 함께 드러내므로, 신명을 대치어로 숨기지 않고 직접 보존하는 편이 본문의 신학적 긴장을 더 정확히 전달합니다.
  doctrine_reference: '도서관 표준: יְהוָה/YHWH → 야훼'
- issue: 금지문의 결과 절 처리
  chosen_reading: ‘그래야 너희가 죽지 않고…’로 목적/결과를 살렸습니다.
  alternative_readings:
  - ‘죽지 않도록’
  - ‘죽지 않게 하라’
  rationale: 히브리어의 연쇄 금지와 결과 절은 단순 명령보다 경고의 무게가 크므로, 한국어에서도 결과를 분명히 드러내는 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥상 제의적 거룩함 위반에 대한 언약적 경고
