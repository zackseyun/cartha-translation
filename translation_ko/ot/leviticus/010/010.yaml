id: LEV.10.10
reference: Leviticus 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
  footnotes:
  - marker: a
    text: Or 'the holy and the profane.' The Hebrew contrast is between what is set apart as holy and what is not holy; 'common' is used here to avoid suggesting active irreverence.
    reason: lexical_alternative
  - marker: b
    text: That is, between ritually unclean and ritually clean.
    reason: cultural_note
translation:
  language: ko
  text: 거룩한 것과 일반적인 것[a]을 분별하고, 더러운 것과 깨끗한 것을 분별하여야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것과 속된 것’. 히브리어 대조는 거룩하게 구별된 것과 거룩하지 않은 것 사이의 대비를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 의례적으로 더러운 것과 의례적으로 깨끗한 것 사이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  english_pob_choice: to distinguish
  chosen_korean: 분별하고
  alternatives_korean:
  - 구별하고
  - 분간하고
  - 분리하고
  lexicon: HALOT
  rationale: 제사장에게 요구되는 기능이 단순한 공간적 분리가 아니라 범주를 식별하는 능력이므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘분별하다’를 택했습니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: the holy
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 거룩한 것들
  - 성스러운 것
  - 거룩함
  lexicon: HALOT
  rationale: 이 항목은 특정 사물 하나보다 거룩함의 범주를 가리키므로, 범주성을 살린 ‘거룩한 것’으로 옮겼습니다.
- source_word: הַחֹל
  english_pob_choice: the common
  chosen_korean: 일반적인 것
  alternatives_korean:
  - 일상적인 것
  - 속된 것
  - 세속적인 것
  lexicon: HALOT
  rationale: POB의 ‘common’을 한국어로 옮길 때 ‘속된’은 불경의 뉘앙스를 강하게 띠고, ‘세속적인’은 현대적 개념을 과도하게 불러오므로, 거룩하지 않은 범주를 중립적으로 드러내는 ‘일반적인 것’을 택했습니다.
- source_word: הַטָּמֵא / הַטָּהוֹר
  english_pob_choice: the unclean / the clean
  chosen_korean: 더러운 것과 깨끗한 것
  alternatives_korean:
  - 부정한 것과 정결한 것
  - 불결한 것과 깨끗한 것
  lexicon: HALOT
  rationale: 레위기 제의 문맥의 정결 규정을 한국어 독자에게 분명히 드러내기 위해, 전통적이지만 오해를 줄 수 있는 도덕적 어감보다 제의적 상태를 비교적 직관적으로 전달하는 표현을 사용했습니다.
theological_decisions:
- issue: חֹל과 קֹדֶשׁ의 대조를 한국어로 어떻게 보존할지
  chosen_reading: ‘거룩한 것’과 ‘일반적인 것’의 대조로 유지했습니다.
  alternative_readings:
  - ‘거룩한 것’과 ‘속된 것’
  - ‘성스러운 것’과 ‘세속적인 것’
  rationale: 이 절은 제사장들이 제의적 범주를 분별하는 책임을 말하므로, 현대어에서 불필요한 도덕적 비난을 덧씌울 수 있는 표현은 피하고 범주 대조를 그대로 살렸습니다.
  doctrine_reference: 레위기 10:10의 제사장적 정결/거룩 규정
- issue: טָמֵא / טָהוֹר를 도덕적 죄가 아니라 의례적 상태로 읽을지
  chosen_reading: ‘더러운 것과 깨끗한 것’을 제의적 분별로 이해했습니다.
  alternative_readings:
  - ‘부정한 것과 정결한 것’
  - ‘불결한 것과 깨끗한 것’
  rationale: 본문의 문맥은 제사장이 가르쳐야 할 정결 규정이므로, 죄책의 선언이 아니라 의례적 상태의 구분으로 읽는 것이 본문의 의도에 가장 가깝습니다.
  doctrine_reference: 레위기 정결법 전체 문맥
