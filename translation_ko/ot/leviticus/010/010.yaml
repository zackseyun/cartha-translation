  source_fidelity: 히브리어의 목적을 나타내는 부정사 לְהַבְדִּיל은 앞 절의 명령에 이어 ‘분별할 수 있도록/분별할 수 있어야’라는 뜻입니다. 두 대조쌍을 한 번의 ‘분별하다’가 함께 지배하는 구조도 반영하는 편이 좋습니다. חֹל은 이 문맥에서 단지 ‘일반적인’ 것이 아니라 거룩한 것에 대조되는 비성별(非聖別)의 범주입니다.
  naturalness: ‘일반적인 것’은 이 제의적 대조에서 다소 막연하고, ‘더러운 것과 깨끗한 것’은 일상적 위생이나 도덕적 평가로 읽히기 쉽습니다. ‘속된 것’, ‘부정한 것’, ‘정결한 것’은 현대 한국어 성경 및 제의 문맥에서 더 자연스럽고 정확합니다. ‘분별할 수 있어야 합니다’는 합쇼체를 유지하면서 목적 용법을 자연스럽게 드러냅니다.
  terminology: ‘거룩한 것/속된 것’은 קֹדֶשׁ/חֹל의 제의적 범주 대조를, ‘부정한 것/정결한 것’은 טָמֵא/טָהוֹר의 의례적 상태를 적절히 보존합니다. 각주에서 ‘속된 것’이 적극적인 불경을 뜻하지 않으며, ‘부정/정결’이 의례적 범주임을 밝혀 오해를 줄입니다.
