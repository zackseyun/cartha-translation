  source_fidelity: 원문의 희생제물 둘, 피를 성소에 들여 속죄하는 목적, 진 밖으로 내보냄, 그리고 가죽·살·배설물을 불사르는 순서는 대체로 반영되었습니다. 그러나 초안은 단수 동사 יוֹצִיא(‘그가 끌어내야 한다’)와 복수 동사 וְשָׂרְפוּ(‘그들이 태워야 한다’)의 전환을 본문에서 충분히 드러내지 못했습니다.
  naturalness: ‘그 피가 … 들여졌던 것은’은 둘의 제물을 받는 문법이 다소 어색합니다. ‘… 들여진 것들은’으로 하면 자연스럽습니다. 또한 제의적 사체 처리 문맥에서 ‘배설물’은 ‘똥’보다 현대 표준어의 격식 있는 성경 문체에 적합하면서도 פִּרְשָׁם의 직접성을 과도하게 완곡화하지 않습니다.
  terminology: ‘속죄제’, ‘성소’, ‘진 밖’, ‘가죽’, ‘살’은 적절합니다. ‘피부’는 동물의 עֹרֹת에 대한 자연스러운 대안이 아니므로 관련 각주는 ‘가죽껍질’ 또는 ‘가죽’의 어휘 범위에 맞추어야 합니다.
