reference: Leviticus 16:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'he shall bring them outside the camp.' The Hebrew more literally has 'he shall bring out to outside the camp.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their skins' for 'their hides.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts from singular ('he shall bring out') to plural ('they shall burn'), likely distinguishing the officiant from those assisting.
    reason: cultural_note
  - marker: d
    text: Or 'and they shall burn in the fire their hides, their flesh, and their dung.'.
    reason: previous_rendering
translation:
  language: ko
  text: 속죄제 수소와 속죄제 숫염소, 곧 그 피가 성소에서 속죄하기 위하여 들여진 것들은 그가 진 밖으로[a] 끌어내야 하며, 그들은 그 가죽[b]과 살과 배설물을 불에 태워야 합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진 밖에’로 옮길 수 있습니다. 히브리어는 방향을 나타내는 전치사와 ‘진 밖’을 뜻하는 표현을 함께 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가죽껍질’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수 ‘그가 끌어내야 한다’에서 복수 ‘그들이 태워야 한다’로 바뀝니다. 두 동사의 주체를 구분하는 표현일 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  english_pob_choice: the bull for the sin offering / the goat for the sin offering
  chosen_korean: 속죄제의 수소 / 속죄제의 숫염소
  alternatives_korean:
  - 속죄제 수소 / 속죄제 숫염소
  - 속죄제에 드리는 수소 / 속죄제에 드리는 숫염소
  lexicon: HALOT
  rationale: חטאת는 제의 문맥에서 ‘속죄제’로 옮기는 것이 가장 직접적이며, 반복 구조를 한국어에서도 평행적으로 살리기 위해 명사구로 유지했습니다.
- source_word: הוּבָא אֶת דָּמָם
  english_pob_choice: whose blood was brought in
  chosen_korean: 그 피가 ... 들여졌던 것은
  alternatives_korean:
  - 그 피가 ... 들어갔던 것은
  - 그들의 피가 ... 들여졌던 것은
  lexicon: HALOT
  rationale: 피가 성소 안으로 ‘들여졌다’는 방향성을 살리되, 피를 전면에 두어 종속절을 자연스럽게 만들었습니다.
- source_word: לְכַפֵּר בַּקֹּדֶשׁ
  english_pob_choice: to make atonement in the sanctuary
  chosen_korean: 성소에서 속죄하기 위해
  alternatives_korean:
  - 성소에서 속죄하기 위하여
  - 성소 안에서 속죄하기 위해
  lexicon: HALOT
  rationale: כפר의 제의적 기능을 ‘속죄하다’로 옮기고, בַּקֹּדֶשׁ는 장소를 분명히 드러내는 ‘성소에서’로 처리했습니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진 밖으로
  alternatives_korean:
  - 진영 밖으로
  - 진 바깥으로
  lexicon: HALOT
  rationale: מַחֲנֶה를 군중이 아니라 성막 공동체의 ‘진’으로 옮겨, 제의 규례의 맥락을 살렸습니다.
- source_word: עֹרֹתָם / בְּשָׂרָם / פִּרְשָׁם
  english_pob_choice: their hides / their flesh / their dung
  chosen_korean: 그들의 가죽과 그들의 고기와 그들의 똥
  alternatives_korean:
  - 그들의 가죽과 그들의 살과 그들의 똥
  - 그들의 가죽과 그들의 육체와 그들의 똥
  lexicon: HALOT
  rationale: 사체 처리 문맥에서 עֹרֹתָם은 ‘가죽’, בְּשָׂרָם은 동물 사체의 ‘고기’, פִּרְשָׁם은 완곡하게 돌리지 않고 직접적인 ‘똥’으로 옮겨 의례적 폐기감을 보존했습니다.
theological_decisions:
- issue: 희생제물의 피를 성소에 들인 뒤 바깥에서 소각하는 정결/속죄 절차의 표현
  chosen_reading: ‘성소에서 속죄하기 위해’와 ‘진 밖으로’를 함께 유지해, 속죄 행위와 부정 요소의 제거를 모두 드러냈습니다.
  alternative_readings:
  - ‘성소 안에서’만 강조하는 번역
  - ‘진 바깥에서’로 완화하는 번역
  rationale: 이 절은 속죄와 제거라는 두 기능이 함께 있으므로, 한쪽 의미로 흡수하지 않고 둘 다 보이도록 옮기는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 레위기 16장 속죄일 규례
