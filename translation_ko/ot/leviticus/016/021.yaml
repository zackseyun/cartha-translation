  source_fidelity: 수정이 필요합니다. פִּשְׁעֵיהֶם는 단순한 ‘허물’보다 고의적 범법·반역의 뉘앙스가 강하므로 ‘반역’으로 옮기는 편이 세 항의 차이를 더 충실히 보존합니다. 또한 בְּיַד אִישׁ עִתִּי는 그 사람의 매개·책임 아래 보내는 뜻이므로 ‘그 일을 위해 지정된 사람에게 맡겨’가 현대 한국어에서 자연스럽고 문맥상 정확합니다.
  naturalness: 현 초안의 ‘그 위에 고백한 뒤’와 ‘사람의 손을 통해’는 다소 직역투입니다. ‘그 염소 위에서 … 고백하고’, ‘사람에게 맡겨 … 보낼 것입니다’로 고치면 합쇼체의 문장 흐름이 자연스럽습니다.
  terminology: ‘이스라엘 자손’과 ‘죄악 / 반역 / 죄’는 원문의 공동체 명칭 및 세 겹의 죄 용어를 적절히 반영합니다. 현 각주 a는 원문이나 영어 감사 주석의 내용과 맞지 않으며, 살아 있는 염소를 ‘의식적 희생 제물’로 규정하는 것은 본절의 표현을 넘어섭니다. 각주를 ‘이스라엘 자손’에 연결하여 문자적 표현을 설명해야 합니다.
  issues:
