source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the hand of a man ready/designated for it.' The Hebrew expression for this man's role is difficult and may emphasize readiness, appointment, or suitability for the occasion.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 살아 있는 염소의 머리 위에 두 손을 얹고, 그 염소 위에서 이스라엘 자손[a]의 모든 죄악과 그들의 모든 반역과 모든 죄를 고백하고, 그것들을 그 염소의 머리 위에 두고, 그 일을 위해 지정된 사람에게 맡겨 그것을 광야로 보낼 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 백성’. 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘때에 맞는 사람’ 또는 ‘준비된 사람’이라는 뜻입니다. 이 표현은 그 일을 위해 지정되었거나 준비된 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ / שְׁתֵּי יָדֹו
  english_pob_choice: shall lay both his hands
  chosen_korean: 두 손을 얹고
  alternatives_korean:
  - 두 손을 놓고
  - 두 손을 얹습니다
  lexicon: HALOT
  rationale: 제의적 동작인 סמך를 한국어에서 자연스럽게 드러내는 표현으로 ‘얹다’를 택했고, dual 표현은 ‘두 손’으로 옮겼습니다.
- source_word: הַשָּׂעִיר הַחַי
  english_pob_choice: the live goat
  chosen_korean: 살아 있는 염소
  alternatives_korean:
  - 산 염소
  - 생존한 염소
  lexicon: HALOT
  rationale: 의식에서 아직 죽지 않은 염소를 가리키므로 ‘살아 있는’이 가장 분명하며, ‘염소’는 제의적 대상의 종류를 그대로 드러냅니다.
- source_word: עֲוֺנֹת / פִּשְׁעֵיהֶם / חַטֹּאתָם
  english_pob_choice: iniquities / transgressions / sins
  chosen_korean: 죄악 / 허물 / 죄
  alternatives_korean:
  - 불의 / 반역 / 죄들
  - 악행 / 범죄 / 죄
  lexicon: HALOT
  rationale: 히브리어의 세 항목을 한국어에서도 서로 겹치되 동일하지 않게 살려, 총체적 죄책의 누적을 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 문자적으로는 남성형 친족 표현이지만, 공동체 전체를 가리키는 관용적 표지로서 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’을 유지했습니다.
- source_word: בְּיַד אִישׁ עִתִּי
  english_pob_choice: by the hand of a man appointed for the task
  chosen_korean: 그 일을 맡은 사람의 손을 통해
  alternatives_korean:
  - 지정된 사람의 손으로
  - 준비된 사람의 손을 통해
  lexicon: HALOT
  rationale: עִתִּי의 난해함을 반영하되, 문맥상 기능이 분명한 ‘맡은 사람’으로 옮겨 그 역할의 지정성을 드러냈습니다.
theological_decisions:
- issue: 세 가지 죄 용어의 중복과 차이를 어떻게 살릴지
  chosen_reading: 죄악 / 허물 / 죄
  alternative_readings:
  - 죄 / 죄 / 죄
  - 악행 / 허물 / 범죄
  rationale: 본문은 동의어들을 쌓아 이스라엘의 죄책이 총체적임을 강조하므로, 한국어에서도 같은 단어로 평탄화하지 않고 층위를 남겼습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms) and §6 (readable modern English)
- issue: ‘이스라엘 자손’의 인칭·성별 표지를 보존할지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문이 형식적으로 남성 친족 표현을 사용하므로, 이를 공동체 지칭으로 보존해 원문의 표지와 신학적 긴장을 지켰습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
