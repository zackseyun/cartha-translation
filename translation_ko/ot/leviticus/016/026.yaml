  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
  footnotes:
  - marker: a
    text: Or 'for Azazel'; the Hebrew term is disputed. It may be understood as a proper name/designation, or interpreted more functionally as referring to removal or the so-called 'scapegoat.'
    reason: alternative_reading
translation:
  language: ko
  text: 염소를 아자셀에게 보내는 사람은 자기 옷을 빨고 물로 자기 몸을 씻어야 합니다[a]. 그 후에야 진으로 들어올 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아자셀을 위해'; 히브리어 용어는 논쟁적입니다. 고유명칭/명칭으로 볼 수도 있고, 제거라는 기능적 의미 또는 이른바 '속죄염소'를 가리키는 것으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  english_pob_choice: The one who sends the goat away
  chosen_korean: 염소를 보내는 사람
  alternatives_korean:
  - 염소를 내보내는 사람
  - 염소를 떠나보내는 사람
  lexicon: HALOT
  rationale: 분사구문이 직분/역할을 가리키므로 한국어에서도 행위자를 자연스럽게 드러내는 명사구로 옮겼습니다.
- source_word: לַעֲזָאזֵל
  english_pob_choice: to Azazel
  chosen_korean: 아자셀에게
  alternatives_korean:
  - 아자셀로
  - 아자셀을 향해
  - 제거를 위해
  lexicon: HALOT
  rationale: 히브리어 용어가 논쟁적이므로, 본문 해석을 미리 확정하지 않고 음역을 유지해 모호성을 보존했습니다.
- source_word: יְכַבֵּס בְּגָדָיו / וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  english_pob_choice: shall wash his clothes and bathe his body in water
  chosen_korean: 자기 옷을 빨고 물로 자기 몸을 씻어야 합니다
  alternatives_korean:
  - 자기 옷을 빨고 물에 몸을 씻어야 합니다
  - 자기 옷을 세탁하고 물로 몸을 씻어야 합니다
  lexicon: HALOT
  rationale: 정결례의 관용적 표현을 살리되, 'בָּשָׂר'를 여기서는 문맥상 '몸'으로 자연스럽게 옮겼습니다.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  english_pob_choice: he may come into the camp
  chosen_korean: 진으로 들어올 수 있습니다
  alternatives_korean:
  - 진에 들어갈 수 있습니다
  - 진으로 돌아올 수 있습니다
  lexicon: HALOT
  rationale: 조건이 충족된 뒤의 허용을 나타내므로 허가의 의미를 분명히 했고, 'camp'는 광야 문맥에 맞게 '진'으로 옮겼습니다.
theological_decisions:
- issue: לַעֲזָאזֵל의 해석을 본문에서 어떻게 처리할지
  chosen_reading: 주석 없이 본문에서는 음역 '아자셀'을 유지해 해석을 유보했습니다.
  alternative_readings:
  - 제거를 위해
  - 속죄염소에게
  - 광야의 존재/존재명칭에게
  rationale: 이 용어는 어원과 기능 해석이 분기되므로, 본문에서 특정 해석을 확정하면 레위기 속 제의의 긴장을 지워버릴 수 있습니다. 음역은 원문이 지닌 불확실성을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
