id: LEV.16.11
reference: Leviticus 16:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
  footnotes:
  - marker: a
    text: Or 'the bull for the sin offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for himself and for his house'; 'household' here means those of his house.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 자기의 속죄제 수송아지를 가져다가 자기와 자기 집을 위하여 속죄하고, 이어서 자기의 속죄제 수송아지를 잡아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문맥의 ‘집’은 단순한 건물보다 집안 식구들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: shall present
  chosen_korean: 가져다가
  alternatives_korean:
  - 드려야 합니다
  - 제시해야 합니다
  - 가까이 가져와야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 קרב의 핵심은 제물을 제의 행위에 참여하도록 ‘가까이 가져오는’ 동작이므로, 한국어에서는 자연스럽게 ‘가져다가’로 풀어 순서를 살렸습니다.
- source_word: פַּר הַחַטָּאת אֲשֶׁר ל֔וֹ
  english_pob_choice: the bull of the sin offering that is for himself
  chosen_korean: 자기의 속죄제 수송아지
  alternatives_korean:
  - 자기를 위한 속죄제 수송아지
  - 속죄제에 속한 수송아지
  - 자기에게 속한 속죄제 수송아지
  lexicon: HALOT
  rationale: 반복되는 소유 구문을 한국어에서 가장 자연스럽게 압축해, 아론 개인에게 지정된 속죄제 제물임을 분명히 했습니다.
- source_word: וְכִפֶּר בַּעֲדֹו וּבְעַד בֵּיתוֹ
  english_pob_choice: shall make atonement for himself and for his household
  chosen_korean: 자기와 자기 집을 위하여 속죄하고
  alternatives_korean:
  - 자기와 자기 집을 위해 속죄하고
  - 자기와 자기 집을 대신하여 속죄하고
  - 자기와 자기 가족을 위하여 속죄하고
  lexicon: HALOT
  rationale: כפר는 제사장 문맥의 표준적 의미인 ‘속죄하다’로 옮기되, בֵּיתוֹ는 혈연만이 아니라 집안 식구들을 포함하는 문맥이므로 ‘집’으로 번역했습니다.
- source_word: וְשָׁחַט
  english_pob_choice: then he shall slaughter
  chosen_korean: 이어서는 … 잡아야 합니다
  alternatives_korean:
  - 그리고 … 잡아야 합니다
  - 그다음 … 죽여야 합니다
  - 그다음 … 도살해야 합니다
  lexicon: HALOT
  rationale: 제의적 שחט의 본뜻을 반영해 ‘잡다’로 옮기되, 앞선 동작과의 순서를 드러내기 위해 ‘이어서는’으로 연결했습니다.
theological_decisions:
- issue: 아론의 속죄 행위와 대상의 범위
  chosen_reading: 제물은 아론 자신을 위한 것이며, 속죄는 아론과 그의 집을 함께 포괄합니다.
  alternative_readings:
  - 자기 소유의 제물로 읽을 수 있습니다
  - 자기만을 위한 속죄로 좁혀 읽을 수 있습니다
  rationale: 본문은 제물의 소속(자기 것)과 속죄의 수혜 범위(자기와 자기 집)를 구분해서 말하므로, 두 요소를 분리해 살렸습니다.
  doctrine_reference: 레 16장 속죄일 제의의 본문 내 논리; 번역은 절차와 적용 대상을 구분해 보존해야 합니다.
