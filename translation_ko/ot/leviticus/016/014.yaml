  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' The Hebrew kapporet refers to the cover of the ark, the place associated with atonement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 황소의 피 일부를 վերց어 손가락으로 속죄소[a]의 앞면, 곧 동쪽 면에 뿌려야 합니다. 또 속죄소 앞에서 손가락으로 그 피를 일곱 번 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄의 덮개’. 히브리어 카포레트는 언약궤의 덮개를 가리키며, 속죄와 관련된 장소입니다.
    reason: lexical_alternative
