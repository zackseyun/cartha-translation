  to: 그는 황소의 피 일부를 վերց어 손가락으로 속죄소[a]의 앞면, 곧 동쪽 면에 뿌려야 합니다. 또 속죄소 앞에서 손가락으로 그 피를 일곱 번 뿌려야 합니다.
