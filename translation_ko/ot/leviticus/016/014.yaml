review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어는 첫 번째 피 뿌림을 속죄소의 '앞면/면' 중 동쪽 방향에 행하는 것으로, 두 번째를 속죄소 '앞에서' 행하는 것으로 구별합니다. 초안은 두 경우를 모두 '속죄상 앞'으로 옮겨 이 공간적 구별을 잃었습니다. 또한 כַּפֹּרֶת의 통상적인 한국어 성서 용어는 '속죄소'이며, '속죄상'은 현대 한국어에서 불명확하고 정착된 용어가 아닙니다.
  naturalness: '''황소의 피를 취하여''와 ''손가락으로 ... 뿌리다''는 자연스럽습니다. 다만 절차 규정의 합쇼체 문체에는 ''뿌려야 합니다''가 적절하며, 반복되는 ''자기 손가락으로''는 한국어에서는 소유 대명사 없이 ''손가락으로''라고 하는 편이 자연스럽습니다.'
  terminology: כַּפֹּרֶת은 본문에서 전통적이고 널리 이해되는 '속죄소'로 번역하고, 그것이 언약궤의 덮개라는 구체적 의미는 각주로 밝혔습니다. 이는 영어 POB의 'mercy seat' 및 대안 'atonement cover'의 정보를 한국어 독자에게 자연스럽게 보존합니다.
