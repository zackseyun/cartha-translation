id: LEV.16.32
reference: Leviticus 16:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
  footnotes:
  - marker: a
    text: Hebrew literally, 'whose hand is filled,' an idiom for being ordained or installed into priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기름부음을 받은 제사장과, 그의 손이 채워져 아버지 대신 제사장으로 섬기게 된 자는 속죄를 행하고[a], 그는 아마포 옷, 곧 거룩한 옷을 입어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘그의 손이 채워진’이라는 관용구로, 제사장 직분에 임직되거나 설치되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  english_pob_choice: shall make atonement
  chosen_korean: 속죄를 행하고
  alternatives_korean:
  - 속죄할 것이며
  - 속죄하게 되고
  - 속죄 예식을 행하고
  lexicon: HALOT
  rationale: 제사 문맥의 כפר는 단순한 마음가짐이 아니라 제의적 속죄 행위를 가리키므로, 한국어에서는 ‘속죄를 행하다’로 제의적 기능을 살렸습니다.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  english_pob_choice: and ordained / whose hand is filled
  chosen_korean: 그의 손이 채워져
  alternatives_korean:
  - 그의 손이 채워지고
  - 임직을 받아
  - 임직되어
  lexicon: HALOT
  rationale: ‘손을 채우다’는 제사장 임직의 관용구이므로, 본문 의미를 보존하기 위해 직역적 표현을 유지하고 영어 주석의 설명을 각주로 반영했습니다.
- source_word: לְכַהֵן תַּחַת אָבִיו
  english_pob_choice: to serve as priest in place of his father
  chosen_korean: 아버지 대신 제사장으로 섬기게 된
  alternatives_korean:
  - 아버지 대신 제사장으로 봉사하게 된
  - 아버지의 뒤를 이어 제사장으로 섬기게 된
  lexicon: HALOT
  rationale: תחת는 직무 승계/대리를 나타내므로, 혈연적 계승이 드러나도록 ‘아버지 대신’으로 옮기고, לְכַהֵן은 직무 기능에 맞게 ‘제사장으로 섬기다’로 표현했습니다.
- source_word: בִּגְדֵי הַבָּד
  english_pob_choice: the linen garments
  chosen_korean: 아마포 옷
  alternatives_korean:
  - 세마포 옷
  - 리넨 옷
  - 아마포 의복
  lexicon: HALOT
  rationale: 제사장 의복 문맥의 בד는 아마포/세마포를 뜻하므로, 성경적이면서도 현대어로 통용되는 ‘아마포 옷’을 택했습니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  - 성별된 옷
  - 거룩한 의복
  lexicon: HALOT
  rationale: קֹדֶשׁ의 핵심은 구별되어 하나님께 속한 상태이므로, 의복의 성격을 자연스럽게 드러내는 ‘거룩한 옷’으로 옮겼습니다.
theological_decisions:
- issue: הַכֹּהֵן을 ‘대제사장’으로 풀지 여부
  chosen_reading: 본문 구조를 따라 ‘제사장’으로 두되, 기름부음과 임직, 아버지 뒤의 승계로 그 직분의 특수성을 드러냄
  alternative_readings:
  - 대제사장
  - 높은 제사장
  rationale: 히브리어는 직함 자체보다 ‘기름부음’, ‘손이 채워짐’, ‘아버지 대신’으로 그 인물을 규정하므로, 해석어를 덧씌우기보다 원문이 제시하는 표지를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘그의 손이 채워져’의 처리
  chosen_reading: 직역적 관용구를 본문에 남기고, 임직 의미는 주석으로 설명
  alternative_readings:
  - 임직되어
  - 설치되어
  - 서품되어
  rationale: 이 관용구는 제의적 임직의 핵심 표지이므로, 한국어 본문에서 완전히 평준화하면 원문이 가진 언어적 긴장이 사라집니다. 각주로 의미를 밝혀 가독성과 추적 가능성을 함께 확보했습니다.
  doctrine_reference: Translation philosophy §6
