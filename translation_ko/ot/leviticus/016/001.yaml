id: LEV.16.1
reference: Leviticus 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
  footnotes:
  - marker: a
    text: Or 'when they approached before the LORD.' The Hebrew expression can be rendered more formally as 'in their drawing near before the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아론의 두 아들이 야훼 앞에 가까이 나아갔다가 죽은 뒤에 모세에게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 야훼 앞에 가까이 나아갈 때’. 히브리어 표현은 더 형식적으로 ‘그들이 야훼 앞에 가까이 나아가는 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר יְהוָה אֶל מֹשֶׁה
  english_pob_choice: And Yahweh spoke to Moses
  chosen_korean: 여호와께서 모세에게 말씀하셨습니다
  alternatives_korean:
  - 여호와께서 모세에게 말씀하셨습니다
  - 야훼께서 모세에게 말씀하셨습니다
  lexicon: HALOT
  rationale: דבר의 서술형 공식은 한국어에서 ‘말씀하시다’가 가장 자연스럽고, 신명은 본문의 직접 대응을 따라 ‘여호와’보다 원문 표기를 유지한 ‘야훼’가 원칙이지만, 본문 전승의 독자 가독성을 위해 출판용 본문에서는 ‘여호와’로 표기했습니다.
- source_word: אַחֲרֵי מוֹת
  english_pob_choice: after the death
  chosen_korean: '...죽은 뒤에'
  alternatives_korean:
  - '...죽은 후에'
  - '...죽음 뒤에'
  lexicon: HALOT
  rationale: ‘after the death of’의 관용적 의미를 한국어 자연문으로 옮기되, 뒤의 사건보다 선행하는 시점을 분명히 드러내기 위해 ‘뒤에’를 사용했습니다.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  english_pob_choice: Aaron’s two sons
  chosen_korean: 아론의 두 아들
  alternatives_korean:
  - 아론의 두 아들
  - 아론의 아들 둘
  lexicon: HALOT
  rationale: 소유-수식 구조를 한국어 자연어 순서로 풀어 ‘아론의 두 아들’로 옮겼습니다.
- source_word: בְּקָרְבָתָם לִפְנֵי יְהוָה
  english_pob_choice: when they came near before Yahweh
  chosen_korean: 여호와 앞에 나아가다
  alternatives_korean:
  - 여호와 앞에 가까이 나아가다
  - 여호와 앞에 접근하다
  lexicon: HALOT
  rationale: קרב의 제의적 ‘가까이 나아가다’ 의미를 살리되, 한국어에서는 굳이 ‘가까이’가 없어도 문맥상 제의적 접근이 드러나므로 간결하게 ‘나아가다’로 옮겼습니다.
- source_word: וַיָּמֻתוּ
  english_pob_choice: and died
  chosen_korean: 죽은
  alternatives_korean:
  - 죽어
  - 죽고
  lexicon: HALOT
  rationale: 히브리어의 간결한 연결 동사를 한국어 문장 안에서 종속절처럼 처리해 ‘죽은 뒤에’로 자연스럽게 통합했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문에는 전통적 교회 독자 가독성을 고려해 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 영어 POB는 יְהוָה를 ‘Yahweh’로 옮기지만, 본 한국어 초안은 출판용 표준어 흐름과 기존 한국어 성경 독서 습관을 우선해 ‘여호와’를 택했습니다. 다만 원문 대응성 차원에서는 ‘야훼’가 대안입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
