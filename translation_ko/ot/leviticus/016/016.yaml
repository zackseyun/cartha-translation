id: LEV.16.16
reference: Leviticus 16:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
  footnotes:
  - marker: a
    text: Or 'the holy place.' Hebrew הַקֹּדֶשׁ can denote the sanctuary or holy place in this ritual context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: '''Make atonement'' may also be expressed as ''purge'' or ''cleanse'' in this Day of Atonement context, since the rite addresses both impurity and sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘 자손[b]의 여러 부정과 그들의 범법, 곧 그들의 모든 죄 때문에 성소[a]를 위하여 속죄[c]해야 합니다. 또 그들과 함께 거하며 그들의 온갖 부정 가운데 있는 회막을 위하여도 이와 같이 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳’. 히브리어 הַקֹּדֶשׁ는 이 제의 문맥에서 성소 또는 거룩한 곳을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’. ‘이스라엘 자손’에 대한 대안입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속죄하다’는 이 속죄일 문맥에서 ‘정화하다’ 또는 ‘정결하게 하다’로도 옮길 수 있는데, 이 의식은 부정과 죄를 함께 다룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  english_pob_choice: he shall make atonement
  chosen_korean: 속죄해야 합니다
  alternatives_korean:
  - 속죄해야 합니다
  - 정결하게 해야 합니다
  - 정화해야 합니다
  lexicon: HALOT
  rationale: 레위기 제의 문맥에서 כפר는 단순한 ‘정결’보다 제의적 속죄 행위를 가리키므로, 한국어도 교회적 용례를 살리되 문맥상 기능을 분명히 드러내는 ‘속죄’로 옮겼습니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 거룩한 곳
  - 성소
  lexicon: HALOT
  rationale: 이 절의 הקדש는 추상적 거룩함이 아니라 제의적 공간을 가리키므로, 한국어로는 자연스럽고도 정확한 ‘성소’가 가장 적절합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 집합 표현을 평탄화하지 않고 보존하기 위해, POB의 ‘sons of Israel’에 맞춰 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וּמִפִּשְׁעֵיהֶם
  english_pob_choice: and because of their transgressions
  chosen_korean: 그들의 허물
  alternatives_korean:
  - 그들의 범죄
  - 그들의 반역
  - 그들의 허물
  lexicon: HALOT
  rationale: פשע는 단순 실수보다 언약을 어긴 ‘허물/범죄’의 뉘앙스가 강하므로, 한국어에서는 과도하게 법정화하지 않으면서도 도덕적 무게를 살리는 ‘허물’을 택했습니다.
- source_word: לְכָל חַטֹּאתָם
  english_pob_choice: for all their sins
  chosen_korean: 그들의 모든 죄
  alternatives_korean:
  - 그들의 모든 죄
  - 모든 그들의 죄
  - 그들의 모든 죄와 허물
  lexicon: HALOT
  rationale: חטאות은 여기서 ‘죄들’이 가장 자연스럽고, 앞의 부정·허물과 평행을 이루어 제의적으로 포괄적인 범주를 형성하므로 ‘그들의 모든 죄’로 옮겼습니다.
- source_word: לְאֹהֶל מוֹעֵד
  english_pob_choice: for the tent of meeting
  chosen_korean: 회막을 위해서도
  alternatives_korean:
  - 회막을 위해서도
  - 만남의 장막을 위해서도
  - 회막을 위해서도
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 전통적으로 굳어진 ‘회막’이 한국어 성경 문맥에서 식별성이 높고, 본절의 병렬 구조상 목적격으로 자연스럽게 처리했습니다.
- source_word: הַשֹּׁכֵן אִתָּם
  english_pob_choice: that dwells with them
  chosen_korean: 그들과 함께 거하며
  alternatives_korean:
  - 그들과 함께 거하며
  - 그들 가운데 거하며
  - 그들과 함께 머무는
  lexicon: HALOT
  rationale: שכן의 ‘거주하다’ 의미를 살리면서, 뒤의 ‘그들의 부정 한가운데’와 함께 공간적·관계적 근접성을 드러내기 위해 ‘함께 거하며’로 옮겼습니다.
theological_decisions:
- issue: כפר의 제의적 범위
  chosen_reading: ‘속죄’로 옮겨 부정과 죄를 함께 다루는 제의적 행위를 보존했습니다.
  alternative_readings:
  - 정결하게 하다
  - 정화하다
  - 속량하다
  rationale: 이 절은 성소와 회막을 대상으로 한 대속죄일적 정화/속죄 행위이므로, 한쪽 의미로만 좁히지 않고 한국어 ‘속죄’가 갖는 제의·신학적 폭을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘이스라엘 자손’의 성별-형태 보존
  chosen_reading: 남성 복수 집합 표현을 중화하지 않고 ‘이스라엘 자손’으로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어 형태와 POB의 gender-accurate 원칙을 따라, 공동체 전체를 뜻하더라도 원문 형식을 흐리지 않는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §4
