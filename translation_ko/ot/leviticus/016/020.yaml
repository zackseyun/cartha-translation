id: LEV.16.20
reference: Leviticus 16:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
  footnotes:
  - marker: a
    text: Or 'the holy place.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bring near'; that is, present for the next ritual action.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'making atonement' may also be understood in this context as carrying out ritual cleansing or purgation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 성소와 회막과 제단[a][b][c]을 속죄하기를 마치면, 살아 있는 숫염소를 데려오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘가까이 가져오다’라는 뜻으로, 다음 제의 행위를 위해 제물로 내놓는다는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속죄하다’는 이 문맥에서 의례적 정결 또는 정화 행위를 포함해 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  english_pob_choice: When he has finished making atonement
  chosen_korean: 속죄하기를 마치면
  alternatives_korean:
  - 속죄를 마친 뒤
  - 속죄를 끝내면
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 살려 ‘속죄하다’로 두었고, 동작 완료를 나타내는 כִלָּה는 자연스러운 순서 표현인 ‘-기를 마치면’으로 옮겼습니다.
- source_word: הַקֹּדֶשׁ
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  lexicon: HALOT
  rationale: 이 문맥의 거룩한 공간을 가리키는 말로 ‘성소’가 가장 직접적이며, 영어 POB의 ‘sanctuary’와도 대응됩니다.
- source_word: וְהִקְרִיב
  english_pob_choice: he shall present
  chosen_korean: 데려오십시오
  alternatives_korean:
  - 가까이 가져오십시오
  - 드리십시오
  lexicon: HALOT
  rationale: הקריב의 기본 뜻은 ‘가까이 가져오다/나아가게 하다’이므로, 다음 제의 행위로 이어지게 하는 동작을 한국어로는 ‘데려오다’로 풀어 자연스럽게 살렸습니다.
- source_word: הַשָּׂעִיר הֶחָי
  english_pob_choice: the live goat
  chosen_korean: 살아 있는 숫염소
  alternatives_korean:
  - 산 염소
  - 살아 있는 염소
  lexicon: HALOT
  rationale: שָׂעִיר는 일반적인 ‘염소’보다 제의 맥락에서 수컷 염소를 가리키므로 ‘숫염소’로 구체화했고, חַי는 ‘살아 있는’으로 살렸습니다.
theological_decisions:
- issue: כפר의 제의적 의미
  chosen_reading: ‘속죄하다’로 번역해 제의적 속죄 행위를 드러냈습니다.
  alternative_readings:
  - 정결하게 하다
  - 정화하다
  rationale: 영어 POB의 ‘making atonement’와 맞추되, 레위기의 제의 문맥에서 핵심 의미를 흐리지 않도록 ‘속죄하다’를 선택했습니다. 필요하면 주석에서 정결/정화 가능성을 보완할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 명령형 어조
  chosen_reading: 끝 절을 ‘데려오십시오’로 옮겨 제의 지시문답의 공적이고 정중한 톤을 유지했습니다.
  alternative_readings:
  - 데려오게 하십시오
  - 가져오십시오
  rationale: 히브리어는 서술형이지만 한국어에서는 제의 규정의 지시성을 드러내기 위해 정중한 명령형을 택했습니다.
  doctrine_reference: Korean style guide, formal-polite register
