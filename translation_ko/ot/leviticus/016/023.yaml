  source_fidelity: 히브리어의 절차적 미래 용법, '회막', 베로 된 의복을 벗어 그곳에 남겨 두라는 지시는 대체로 잘 반영되었습니다. 다만 הַקֹּדֶשׁ는 본문상 단순히 '거룩한 곳/성소'이며, 이를 가장 안쪽 지성소로 단정하지 않도록 역주로 범위를 밝혀 두는 것이 원문의 모호성을 더 충실히 보존합니다.
