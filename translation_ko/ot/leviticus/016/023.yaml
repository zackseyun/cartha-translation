  terminology: '''회막'', ''아론'', ''성소'', ''베옷''은 한국어 성서 문맥에서 통용되는 용어입니다. ''성소''에는 히브리어 표현의 범위에 관한 역주를 붙여 지성소라는 특정 해석을 본문에 강요하지 않았습니다.'
