id: LEV.16.34
reference: Leviticus 16:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
  footnotes:
  - marker: a
    text: Or “for the Israelites” or “for the people of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “because of all their sins,” highlighting the cleansing nuance of the Hebrew expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 너희에게 영원한 규례가 되어야 합니다. 곧 이스라엘 자손을 위하여 그들의 모든 죄를 속하기 위해, 해마다 한 번씩 행해야 합니다. 그리고 그는 야훼께서 모세에게 명령하신 대로 행했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘인들을 위하여” 또는 “이스라엘 백성을 위하여”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 모든 죄로 인해”, 히브리어 표현의 정결·제거 뉘앙스를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 변하지 않는 규례
  lexicon: HALOT
  rationale: 법적·제의적 문맥에서 חֻקָּה는 규례/법령의 의미가 자연스럽고, עוֹלָם은 계약적 지속성을 가리키므로 ‘영원한 규례’가 소스의 지속성을 잘 반영합니다.
- source_word: לְכַפֵּר
  english_pob_choice: to make atonement
  chosen_korean: 속하기 위해
  alternatives_korean:
  - 속죄하기 위해
  - 화목하게 하기 위해
  lexicon: HALOT
  rationale: כפר의 제의적 핵심은 죄를 덮고 정결하게 하는 속죄 행위이므로, 한국어 성경에서 익숙한 ‘속하다’를 사용하되 문맥상 목적을 드러냈습니다.
- source_word: מִכָּל חַטֹּאתָם
  english_pob_choice: for all their sins
  chosen_korean: 그들의 모든 죄를
  alternatives_korean:
  - 모든 죄 때문에
  - 모든 죄에서
  lexicon: HALOT
  rationale: מִן의 뉘앙스를 지나치게 설명적으로 풀지 않고, הכפר와 결합한 대상 표현으로 자연스럽게 옮겨 죄 전체에 대한 속죄 범위를 드러냈습니다.
- source_word: אַחַת בַּשָּׁנָה
  english_pob_choice: once in the year
  chosen_korean: 해마다 한 번씩
  alternatives_korean:
  - 일 년에 한 번
  - 한 해에 한 번
  lexicon: HALOT
  rationale: 히브리어의 연례 반복 관용구를 현대 한국어로 자연스럽게 옮기면서, 규례의 반복성을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겨, 본문이 가리키는 언약의 이름을 보존했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집합 명칭 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 히브리어의 집합적 친족표현을 보존하면서도 한국어 독자가 자연스럽게 이해할 수 있도록 ‘이스라엘 자손’을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 제의적 속죄의 표현
  chosen_reading: 속하기 위해
  alternative_readings:
  - 속죄하기 위해
  - 정결하게 하기 위해
  rationale: 레위기 16장의 중심 행위는 단순한 용서 선언이 아니라 죄를 덮고 정결케 하는 제의적 속죄이므로, 전통 용어를 유지하되 문맥을 흐리지 않게 했습니다.
  doctrine_reference: 레위기 16장 속죄 제의 문맥
