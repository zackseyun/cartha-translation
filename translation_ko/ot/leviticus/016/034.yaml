review_pass:
  verdict: revise
  source_fidelity: 원문의 לְכַפֵּר עַל בְּנֵי יִשְׂרָאֵל מִכָּל חַטֹּאתָם은 이스라엘 자손을 위한 속죄와 그들의 모든 죄의 범위를 함께 나타냅니다. 초안의 ‘이스라엘 자손을 위하여 그들의 모든 죄를 속하기 위해’는 목적어와 여격 표현이 겹쳐 다소 부자연스럽습니다. 또한 וַיַּעַשׂ의 무표지 단수 주어는 ‘그는’으로 유지하여 문맥상 지시될 수 있는 인물을 본문에서 특정하지 않았습니다.
  naturalness: ‘속하다’는 현대 표준어에서 이 문맥의 동사로 자연스럽지 않으며, 제의 문맥에서는 ‘속죄하다’가 적절합니다. 첫 두 절은 규례의 지속성과 매년 한 번 시행되는 속죄 행위를 명료하게 연결하도록 다듬었습니다.
  terminology: חֻקַּת עוֹלָם은 ‘영원한 규례’, כפר는 ‘속죄하다’, יְהוָה는 프로젝트 방침에 따라 ‘야훼’, בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 자손’으로 유지했습니다. מִכָּל의 정결/제거 가능성은 ‘때문에’가 아니라 ‘죄에서’라는 대안으로 각주에 제시했습니다.
  issues:
  - severity: medium
    issue: ‘속하기 위해’는 현대 한국어에서 부자연스럽고 제의적 כפר의 의미를 충분히 전달하지 못합니다.
    rationale: ‘속하다’는 소속을 뜻하는 일반 동사로 주로 쓰입니다. 이 문맥에서는 ‘속죄하다’가 정확하고 자연스럽습니다.
  - severity: medium
    issue: 각주 b의 ‘그들의 모든 죄로 인해’는 מִכָּל의 가능한 정결·제거 방향과 맞지 않으며, 본문 표현과도 혼동을 일으킵니다.
    rationale: כפר와 결합한 מִן은 죄로부터의 정결 또는 제거의 의미를 나타낼 수 있으므로, 대안은 ‘그들의 모든 죄에서’로 제시하는 것이 더 적절합니다.
  - severity: low
    issue: ‘이스라엘 자손을 위하여 그들의 모든 죄를’은 한국어에서 소유 관계가 중복되어 문장이 무겁습니다.
    rationale: ‘이스라엘 자손의 모든 죄를’로 옮기면 원문의 집합 명칭과 죄의 소유 관계를 자연스럽게 보존합니다.
  revised_text: 이는 너희에게 영원한 규례가 될 것입니다. 이스라엘 자손[a]의 모든 죄를 속죄하기 위하여 해마다 한 번씩 이를 행해야 합니다. 그리고 그는 야훼께서 모세에게 명령하신 대로 행했습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “이스라엘인들” 또는 “이스라엘 백성”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 모든 죄에서”; 히브리어 표현은 죄로부터의 정결 또는 제거의 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준어 합쇼체에 맞추어 제의 용어를 ‘속죄하다’로 바로잡고, 원문의 연례적 규례라는 법적 기능을 자연스럽게 드러냈습니다. 이스라엘 자손이라는 집합 명칭과 야훼라는 신명은 유지했습니다. 단수 주어는 원문처럼 특정하지 않았으며, 각주 b는 원문의 전치사 뉘앙스를 정확하게 반영하도록 수정했습니다.
