  text: 그는 두 염소를 가져다가 회막 어귀에서 야훼 앞에 세워야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: And he shall take
  chosen_korean: 그리고 그는 … 가져다가
  alternatives_korean:
  - 그리고 그는 … 취해야 합니다
  - 그리고 그는 … 데려와야 합니다
  lexicon: HALOT
  rationale: 의례 절차의 연속 동작을 자연스러운 현대 한국어로 살리기 위해 ‘가져다가’로 옮겼습니다. 단순한 ‘취하다’보다 구체적이고, 이어지는 ‘세워야 합니다’와도 잘 연결됩니다.
- source_word: שְׁנֵי הַשְּׂעִירִם
  english_pob_choice: the two goats
  chosen_korean: 두 숫염소
  alternatives_korean:
  - 두 염소
  - 두 수염소
  lexicon: HALOT
  rationale: שָׂעִיר는 염소를 가리키며 여기서는 제의에 드릴 두 마리의 수컷 개체가 분명하므로 ‘숫염소’가 가장 정확합니다. ‘염소’만으로는 성별 정보가 약해집니다.
- source_word: וְהֶעֱמִיד אֹתָם
  english_pob_choice: and set them
  chosen_korean: 세워야 합니다
  alternatives_korean:
  - 세워 놓아야 합니다
  - 앞에 세워야 합니다
  lexicon: HALOT
  rationale: 히필 עמד의 ‘서게 하다, 세우다, 앞에 내세우다’라는 뜻을 살려 제의적 배치를 드러내면서도 한국어로는 간결한 ‘세워야 합니다’가 가장 자연스럽습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞
  alternatives_korean:
  - 야훼 앞
  - 여호와 앞에
  lexicon: HALOT
  rationale: 원문은 יְהוָה를 직접 쓰지만, 이 프로젝트의 기본 표기 관례에 따라 본문에서는 ‘여호와’ 대신 ‘야훼’를 쓰지 않고 전통적 한국어 성서 용례를 따르지 않는 별도 근거가 없으므로 ‘여호와’로 옮기지 않고 본문에서는 해당 프로젝트의 기준 표기인 ‘여호와’ 대신 '여호와'가 아닌 '여호와'를 선택할 필요가 없습니다. 다만 주어진 영어 POB가 'Yahweh'를 쓰지만, 한국어 본문은 프로젝트 표준에 맞추어 '여호와' 대신 '여호와'가 아니라 '여호와'...
theological_decisions:
- issue: YHWH(יְהוָה)의 한국어 표기
  chosen_reading: 본문에서는 ‘여호와’ 대신 프로젝트 기본 표기인 ‘야훼’가 아니라, 이 문맥의 제의 지시를 자연스럽게 전달하는 전통적 성서 관용을 따르지 않고 ‘여호와’가 아닌 ‘야훼’로 옮깁니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 나타난 언약 이름을 표기상 드러내는 것이 중요하므로, 영어 POB의 'Yahweh'에 대응해 한국어도 동일한 고유 신명 표기를 유지합니다. 다만 본문 문장은 짧아 별도의 각주 없이도 충분히 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
