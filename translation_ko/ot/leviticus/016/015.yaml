revisions:
- from: 그러면 그는 백성을 위한 속죄제의 숫염소를 잡고, 그 피를 휘장 안으로 가져가서, 그 피로 수송아지의 피에 행한 것과 같이 하고, 그것을 속죄소 위와 속죄소 앞에 뿌려야 합니다.[a]
  to: 그러면 그는 백성을 위한 속죄제 숫염소를 잡아, 그 피를 휘장 안으로 가져가서, 그 피를 수송아지의 피에 했던 것처럼 행하고, 그 피를 속죄소 위와 속죄소 앞에 뿌려야 합니다.[a]
  rationale: 염소의 피에 행할 의식이 수송아지의 피에 행했던 의식과 동일하다는 히브리어의 비교 구문을 명료하고 자연스러운 한국어로 바로잡았습니다. כַּפֹּרֶת의 본문 번역 ‘속죄소’는 유지하되, 각주는 한국어 성서 전통에서 실제로 쓰이는 대안 ‘시은소’로 교정했습니다.
