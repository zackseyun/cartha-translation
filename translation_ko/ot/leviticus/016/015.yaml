  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
  footnotes:
  - marker: a
    text: Or, traditionally, "mercy seat."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그는 백성을 위한 속죄제 숫염소를 잡아, 그 피를 휘장 안으로 가져가서, 그 피를 수송아지의 피에 했던 것처럼 행하고, 그 피를 속죄소 위와 속죄소 앞에 뿌려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 “시은소”로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  english_pob_choice: Then he shall slaughter
  chosen_korean: 그러면 그는 … 잡고
  alternatives_korean:
  - 그러면 그는 … 도살하고
  - 그리고 그는 … 잡고
  lexicon: HALOT
  rationale: 제의적 동물 희생의 문맥에서 שׁחט는 단순한 ‘죽이다’보다 ‘잡다/잡아 죽이다’가 자연스럽고, 절차의 연속성은 ‘그러면’으로 살렸습니다.
- source_word: שְׂעִיר הַחַטָּאת
  english_pob_choice: the goat of the sin offering
  chosen_korean: 속죄제의 숫염소
  alternatives_korean:
  - 속죄제의 염소
  - 속죄제 숫염소
  lexicon: HALOT
  rationale: 원문은 속죄제와 연결된 염소를 가리키므로 ‘속죄제의 숫염소’로 옮겨 제의적 기능과 동물 성별을 함께 드러냈습니다.
- source_word: כַּפֹּרֶת
  english_pob_choice: atonement cover
  chosen_korean: 속죄소
  alternatives_korean:
  - 속죄 덮개
  - 자비의 자리
  lexicon: HALOT
  rationale: 이 절에서는 성막/언약궤 위의 덮개를 가리키는 전문 용어이므로, 기능을 드러내는 ‘속죄소’를 택했고 전통 번역 ‘자비의 자리’는 본문 밖으로 미뤘습니다.
- source_word: לִפְנֵי הַכַּפֹּרֶת
  english_pob_choice: before the atonement cover
  chosen_korean: 속죄소 앞에
  alternatives_korean:
  - 속죄소 앞쪽에
  - 속죄소의 앞에
  lexicon: HALOT
  rationale: לִפְנֵי는 위치 관계를 나타내므로 제의 공간의 대조를 살려 ‘앞에’로 간단히 옮겼습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 번역을 전통적 ‘자비의 자리’로 둘지 여부
  chosen_reading: 본문에는 ‘속죄소’를 두고, 전통적 표현은 본문 밖에 두지 않았습니다.
  alternative_readings:
  - 자비의 자리
  - 시은소
  rationale: 원문은 속죄일 의식에서 피를 뿌리는 대상의 기능과 제의적 의미를 강조하므로, 한국어 본문에서도 그 기능이 드러나는 번역을 택하는 것이 더 स्रोत-직접적입니다.
  doctrine_reference: Translation philosophy §§1, 6
