  source_fidelity: 전반적으로 히브리어의 절차와 제의 공간 구분을 잘 반영합니다. 다만 וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר는 ‘그 피로 수송아지의 피에 행한 것과 같이 하고’보다, 염소의 피에 수송아지의 피와 동일한 의식을 행한다는 관계를 분명히 드러내야 합니다.
  naturalness: 현행 문장의 ‘그 피로 수송아지의 피에 행한 것’은 한국어에서 행위의 대상과 수단이 뒤섞여 다소 부자연스럽습니다. ‘그 피를 수송아지의 피에 했던 것처럼 행하고’가 자연스럽고 원문의 생략된 제의 행위를 보존합니다.
