id: LEV.16.12
reference: Leviticus 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
  footnotes:
  - marker: a
    text: Or 'within the veil.' The Hebrew expression refers to bringing the censer and incense into the space behind the curtain, that is, the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 야훼 앞에 있는 제단에서 불붙은 숯으로 가득 찬 향로 하나를 վերց고, 곱게 빻은 향료로 만든 향을 두 손 가득 쥐어 휘장 안으로[a] 가져가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘휘장 안으로’는 문맥상 휘장 뒤쪽의 공간, 곧 내부 성소로 들어간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֹא הַמַּחְתָּה
  english_pob_choice: a full censer
  chosen_korean: 향로 하나와… 가득 찬
  alternatives_korean:
  - 가득 찬 향로
  - 한 향로를 가득 채워
  lexicon: HALOT
  rationale: 히브리어의 ‘향로의 충만함’이라는 구성은 한국어에서 자연스럽게 ‘가득 찬 향로’로 옮기는 것이 좋으며, 수량을 자연스럽게 드러내기 위해 ‘하나’를 보탰습니다.
- source_word: גַּחֲלֵי אֵשׁ
  english_pob_choice: coals of fire
  chosen_korean: 불탄 숯
  alternatives_korean:
  - 불의 숯
  - 불타는 숯불
  lexicon: HALOT
  rationale: 제의 문맥에서 단순한 숯이 아니라 실제로 타오른 숯이라는 점을 살려 ‘불탄 숯’으로 옮겼습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼의 앞
  - 야훼 앞에
  lexicon: HALOT
  rationale: יהוה는 본문 기준으로 고유명사 ‘야훼’로 유지하고, ‘before’는 장소적 관계를 간결하게 나타내는 ‘앞’으로 옮겼습니다.
- source_word: וּמְלֹא חָפְנָיו
  english_pob_choice: and both his hands full of
  chosen_korean: 손에 가득 쥐고
  alternatives_korean:
  - 두 손에 가득 쥐고
  - 손 두 줌을
  lexicon: HALOT
  rationale: 히브리어의 ‘손의 충만함’은 양손에 가득 쥔 분량을 뜻하므로, 한국어에서는 의미를 자연스럽게 드러내는 동작 표현으로 처리했습니다.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  english_pob_choice: finely ground fragrant incense
  chosen_korean: 곱게 빻은 향료의 향
  alternatives_korean:
  - 곱게 빻은 향기로운 향
  - 고운 향료 향
  lexicon: HALOT
  rationale: ‘향료의 향’은 향을 만드는 재료가 향료임을 보존하고, ‘דַּקָּה’는 제의적 분말 상태를 살려 ‘곱게 빻은’으로 옮겼습니다.
- source_word: מִ/בֵּ֥ית לַ/פָּרֹֽכֶת
  english_pob_choice: inside the veil
  chosen_korean: 휘장 안으로
  alternatives_korean:
  - 휘장 속으로
  - 휘장 너머로
  lexicon: HALOT
  rationale: 문맥상 휘장 뒤의 지성소로 들어가는 동작이므로, ‘안으로’로 방향성을 살려 번역했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 하나님의 이름 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신적 칭호가 아니라 성호 자체를 사용하므로, POB 원칙에 따라 고유명사로서의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
