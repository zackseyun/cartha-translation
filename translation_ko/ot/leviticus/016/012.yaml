  naturalness: 초안의 ‘향료의 향’은 현대 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘곱게 빻은 향료로 만든 향’은 자연스러우면서도 향료와 곱게 빻은 상태를 보존합니다. ‘야훼 앞에 있는 제단’도 수식 관계를 분명하게 합니다.
