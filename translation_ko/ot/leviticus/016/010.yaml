id: LEV.16.10
reference: Leviticus 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
  footnotes:
  - marker: a
    text: Or 'for the scapegoat.' The Hebrew term 'Azazel' is debated; it may be a proper name or a term associated with removal.
    reason: alternative_reading
  - marker: b
    text: Or 'to make atonement for it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 염소, 곧 아자셀을 위한 제비가 떨어진 염소는 야훼[a] 앞에 살아 있는 채로 제시되어야 하며, 그 위에 속죄[b]하여 그것을 광야로 아자셀에게 보낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄염소를 위한’. 히브리어 용어 ‘아자셀’은 논쟁적이며, 고유명사일 수도 있고 제거와 관련된 용어일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그것을 위해 속죄하려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  english_pob_choice: But the goat
  chosen_korean: 그러나 그 염소
  alternatives_korean:
  - 그리고 그 염소
  - 그 수염소
  lexicon: HALOT
  rationale: 앞절의 다른 염소와 대비되는 연결을 살리기 위해 ‘그러나’로 옮기고, מקור의 일반 명사 שָׂעִיר는 여기서 간결하게 ‘염소’로 옮겼습니다.
- source_word: עָלָה עָלָיו הַגּוֹרָל
  english_pob_choice: on which the lot ... fell
  chosen_korean: 아자셀을 위한 제비가 떨어진
  alternatives_korean:
  - 아자셀을 위한 제비가 올라간
  - 아자셀을 위한 제비가 나온
  lexicon: HALOT
  rationale: 제비가 그 염소 위에 ‘떨어졌다’는 선택의 의미를 한국어 관용으로 자연스럽게 옮겼습니다.
- source_word: יָעֳמַד
  english_pob_choice: shall be presented
  chosen_korean: 제시되어야 하며
  alternatives_korean:
  - 세워져야 하며
  - 나타나야 하며
  lexicon: HALOT
  rationale: 히필/호팔 계열의 ‘세워 두다, 앞에 내세우다’라는 힘을 살리면서도 제의 문맥에서 자연스러운 공식어로 ‘제시되다’를 택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 여호와 앞에
  - 주 앞에
  lexicon: HALOT
  rationale: 본문의 야훼를 표준적으로 ‘야훼’로 옮겨 원문 구분을 유지했습니다.
- source_word: לְכַפֵּר עָלָיו
  english_pob_choice: to make atonement over it
  chosen_korean: 그 위에 속죄하여
  alternatives_korean:
  - 그 위에 속죄하고
  - 그를 위해 속죄하여
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 ‘속죄하다’로 살리고, עַל의 문자적 긴장을 완전히 풀지 않기 위해 ‘그 위에’로 남겼습니다.
- source_word: לְשַׁלַּח אֹתוֹ
  english_pob_choice: to send it away
  chosen_korean: 그것을 … 보내는
  alternatives_korean:
  - 그것을 … 내보내는
  - 그것을 … 풀어 주는
  lexicon: HALOT
  rationale: 목적 부정사 구조를 따라 최종 목적을 간결하게 드러내기 위해 ‘보내다’를 택했습니다.
theological_decisions:
- issue: עֲזָאזֵל의 처리
  chosen_reading: 음역 ‘아자셀’을 본문에 두어 해석을 확정하지 않았습니다.
  alternative_readings:
  - 속죄염소
  - 완전한 제거
  rationale: 이 용어는 고유명사인지 제거 개념인지가 논쟁적이므로, 본문에서는 음역으로 남겨 원문이 가진 해석상의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve theological tension rather than resolve it)
