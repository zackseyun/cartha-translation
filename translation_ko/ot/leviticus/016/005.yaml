id: LEV.16.5
reference: Leviticus 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
  footnotes:
  - marker: a
    text: 'Or ''the Israelites'' / ''the people of Israel.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'for a purification offering.' The Hebrew term חַטָּאת in Leviticus can denote the offering that deals with sin and ritual impurity.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이스라엘 자손의 회중에게서 속죄제를 위한 숫염소 두 마리와 번제를 위한 숫양 한 마리를 취해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵאֵת / עֲדַת
  english_pob_choice: And from the congregation
  chosen_korean: 이스라엘 자손의 회중에게서
  alternatives_korean:
  - 이스라엘의 회중에게서
  - 이스라엘 자손 가운데서
  lexicon: HALOT
  rationale: מֵאֵת의 출처 의미를 살려 ‘-에게서’로 옮기고, עֲדַת은 제의 문맥에 맞게 ‘회중’으로 처리했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 본문의 남성 복수 표현을 그대로 반영해 ‘자손’으로 옮겼습니다.
- source_word: שְׂעִירֵי עִזִּים
  english_pob_choice: male goats
  chosen_korean: 숫염소 두 마리
  alternatives_korean:
  - 염소 두 마리
  - 수염소 두 마리
  lexicon: HALOT
  rationale: 제사 규정의 성별 구분을 드러내기 위해 ‘숫염소’로 옮겼습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제를 위한
  alternatives_korean:
  - 속죄제의
  - 죄를 위한
  lexicon: HALOT
  rationale: 레위기 제의 용례를 따라 חַטָּאת을 ‘속죄제’로 옮겼고, 문맥상 목적을 나타내는 ‘위한’을 붙였습니다.
- source_word: וְאַיִל אֶחָד לְעֹלָה
  english_pob_choice: and one ram for a burnt offering
  chosen_korean: 번제를 위한 숫양 한 마리
  alternatives_korean:
  - 번제로 드릴 숫양 한 마리
  - 번제물로서의 숫양 한 마리
  lexicon: HALOT
  rationale: עֹלָה는 관용적 대응어인 ‘번제’로 옮기고, אַיִל אֶחָד은 자연스러운 한국어 어순으로 정리했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 속죄 제물
  rationale: 레위기 문맥에서 חַטָּאת은 죄와 부정의 처리를 함께 가리키는 제사 용어이지만, 한국어 본문에서는 가장 널리 통용되는 제의 용어인 ‘속죄제’를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
