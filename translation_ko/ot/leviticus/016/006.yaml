source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
  footnotes:
  - marker: a
    text: Or, 'the bull of the purification offering.' The Hebrew term חַטָּאת can denote the sin offering, with an emphasis in some contexts on ritual purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 자신을 위한 속죄제[a] 수송아지를 드려야 하며, 자신과 자기 집안을 위하여 속죄해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת은 문맥에 따라 ‘속죄제’를 뜻하기도 하고, 일부 문맥에서는 의례적 정결에 더 초점을 둔 제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: shall present
  chosen_korean: 드리고
  alternatives_korean:
  - 드려야 합니다
  - 바쳐야 합니다
  - 가져와 드려야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 הקריב은 제물을 야훼 앞에 '드리다/바치다'의 뜻이지만, 한국어에서는 '드리고'가 가장 자연스럽고 예배·제의적 행위를 잘 전달합니다.
- source_word: פַּר
  english_pob_choice: the bull
  chosen_korean: 수송아지
  alternatives_korean:
  - 황소
  - 송아지
  - 암소가 아닌 수소
  lexicon: HALOT
  rationale: פַּר는 제의용 어린 수소를 가리키므로 '수송아지'가 한국어 성경에서의 제의적 감각과 동물의 연령 정보를 함께 살립니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄를 위한 제물
  - 정결제
  - 속죄 제물
  lexicon: HALOT
  rationale: 여기서는 죄 자체가 아니라 제의적 희생 제물을 가리키므로, 한국어 성경의 관용적이면서도 본문의 제의적 기능을 드러내는 '속죄제'를 택했습니다.
- source_word: בַּעֲדוֹ / וּבְעַד בֵּיתוֹ
  english_pob_choice: for himself / for his household
  chosen_korean: 자신과 자기 집안을 위해
  alternatives_korean:
  - 자기 자신과 자기 가족을 위해
  - 그를 위해 그리고 그의 집안을 위해
  - 자기와 그의 집을 위해
  lexicon: HALOT
  rationale: בעד는 '…을 위하여/대신하여'의 뜻이므로, 제사장 대표성까지 살리면서도 자연스러운 한국어인 '자신과 자기 집안을 위해'로 옮겼습니다.
theological_decisions:
- issue: חטאת의 한국어 표준 렌더링
  chosen_reading: 속죄제
  alternative_readings:
  - 죄를 위한 제물
  - 정결제
  rationale: 이 절은 속죄 의례 절차를 말하므로 '속죄제'가 제의적 기능을 가장 직접적으로 드러냅니다. '정결제'는 학술적 뉘앙스를 주지만, 본문 전체의 제사 용어 체계와 대중 가독성을 고려해 본문에서는 채택하지 않았습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
