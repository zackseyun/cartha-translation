source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
  footnotes:
  - marker: a
    text: Or 'to a solitary land,' 'to an inaccessible land,' or 'to a desolate land.' The Hebrew likely conveys a place cut off or isolated from habitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 염소는 그들의 모든 죄악을 자기 위에 지고, 그 염소를 황야로 보낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘끊어진 땅’, ‘외딴 땅’, ‘접근할 수 없는 땅’, 또는 ‘황량한 땅’의 뜻일 수 있습니다. 핵심은 거주지로부터 분리된 장소라는 점입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  english_pob_choice: shall carry
  chosen_korean: 지고
  alternatives_korean:
  - 짊어지고
  - 메고
  lexicon: HALOT
  rationale: נשא의 핵심 의미를 한국어 동사 ‘지다’로 옮기면, 염소가 죄악을 ‘짐처럼’ 떠맡는 구체적 이미지를 자연스럽게 살릴 수 있습니다.
- source_word: עָלָיו
  english_pob_choice: on itself
  chosen_korean: 자기 위에
  alternatives_korean:
  - 그 위에
  - 자기에게
  lexicon: HALOT
  rationale: 죄악이 염소의 바깥이 아니라 그 몸 위에 실리는 모습을 드러내기 위해 ‘자기 위에’로 옮겼습니다.
- source_word: כָּל עֲוֺנֹתָם
  english_pob_choice: all their iniquities
  chosen_korean: 그들의 모든 죄악
  alternatives_korean:
  - 그들의 모든 죄
  - 그들의 모든 불의
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 도덕적·제의적 무게가 있는 ‘죄악’이 더 잘 대응합니다.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  english_pob_choice: to a cut-off land
  chosen_korean: 황야로
  alternatives_korean:
  - 끊어진 땅으로
  - 외딴 땅으로
  - 고립된 땅으로
  lexicon: HALOT
  rationale: 본문의 핵심은 공동체로부터 떨어져 나가는 장소라는 점이어서, 한국어에서는 ‘황야로’가 문맥상 자연스럽게 분리·격리의 뜻을 전달합니다. 다만 히브리어 표현의 문자적 난점은 각주로 남깁니다.
- source_word: וְשִׁלַּח
  english_pob_choice: he shall send away
  chosen_korean: 보낼 것입니다
  alternatives_korean:
  - 내보낼 것입니다
  - 떠나보낼 것입니다
  lexicon: HALOT
  rationale: 의례적 파견의 뜻을 살리면서도 현대 한국어 문장으로 자연스럽게 읽히도록 ‘보낼 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 속죄 염소 의례의 이미지 보존
  chosen_reading: 죄악을 염소가 실제로 ‘지고’ 황야로 옮겨지는 구체적 제의 이미지를 유지했습니다.
  alternative_readings:
  - ‘그들의 죄를 없앨 것입니다’처럼 의미를 풀어 쓰는 번역
  rationale: 본문은 죄의 제거를 추상적으로 설명하기보다, 죄악의 전가와 격리를 상징하는 의례 동작을 보여 주므로 그 이미지 자체를 보존하는 것이 적절합니다.
  doctrine_reference: 레위기 16장 속죄일 의례
