  source_fidelity: 개정이 필요합니다. 초안은 אֶרֶץ גְּזֵרָה(‘끊어진/고립된 땅’)를 본문에서 ‘황야’로 대체하여, 이어지는 בַּמִּדְבָּר(‘광야로’)와 구별되는 두 장소 표현을 하나로 축소했습니다. 또한 이 절의 마지막 동작은 염소가 죄악을 지고 그 고립된 땅으로 가는 것과, 그를 맡은 사람이 염소를 광야로 보내는 것으로 표현되어야 합니다.
  naturalness: ‘그러면’은 히브리어의 접속을 과도하게 담화 표지로 풀어 자연스럽지 않습니다. ‘그 염소는 … 갈 것이며, 그는 … 보낼 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 히브리어에서 마지막 동사의 주어가 문맥상 앞 절의 담당자임을 과도하게 보충하지 않으면서 반영합니다.
  terminology: ‘죄악’과 ‘자기 위에 지고’는 עָוֹן 및 עָלָיו의 제의적·구체적 이미지를 적절히 보존합니다. גְּזֵרָה는 본문에서 ‘끊어진 땅’으로 옮기고, 어휘적 불확실성과 대안을 해당 어구의 각주에서 제시해야 합니다. ‘광야’는 מִדְבָּר에 적절합니다.
  issues:
