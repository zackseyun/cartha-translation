revisions:
- from: 그러면 염소는 그들의 모든 죄악을 자기 위에 지고, 그 염소를 황야로 보낼 것입니다.[a]
  to: 그 염소는 그들의 모든 죄악을 자기 위에 지고 끊어진 땅으로[a] 갈 것이며, 그는 그 염소를 광야로 보낼 것입니다.
  rationale: 본문에 누락된 אֶרֶץ גְּזֵרָה를 ‘끊어진 땅’으로 복원하여, 그 어구와 בַּמִּדְבָּר의 ‘광야’를 구별했습니다. 논쟁적인 지명·지형 표현의 의미는 본문에서 성급히 확정하지 않고 각주에 대안을 보존했습니다. 마지막 동사의 묵시적 남성 단수 주어는 ‘그는’으로 유지하여, 앞 절 문맥의 담당자를 반영하되 본 절에 없는 명사를 본문에 삽입하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:17Z'
review_pass:
