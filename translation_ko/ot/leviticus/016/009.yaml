translation:
  language: ko
  text: 그러면 아론은 야훼를 위한 제비가 나온 염소를 가져와 그것을 속죄제로 삼아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위한 제비가 그 위에 오른 염소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  english_pob_choice: shall present
  chosen_korean: 가져다가
  alternatives_korean:
  - 드리다
  - 제시하다
  - 가져오다
  lexicon: HALOT
  rationale: 제의 문맥의 הקריב은 단순 이동이 아니라 제의 절차를 위해 앞으로 가져오는 행위를 가리키므로, 한국어에서는 자연스럽게 ‘가져다가’로 옮겨 제의적 동작을 살렸습니다.
- source_word: הַשָּׂעִיר
  english_pob_choice: the goat
  chosen_korean: 숫양
  alternatives_korean:
  - 염소
  - 염소 한 마리
  - 수염소
  lexicon: HALOT
  rationale: 본문의 שׂעיר는 염소를 뜻하지만, 주어진 영어 본문이 'the goat'로 읽고 있어 한국어에서는 제의용 동물을 자연스럽게 ‘숫염소’가 아닌 ‘숫양’으로 옮기면 오독이 생깁니다. 따라서 실제 대응은 ‘염소’가 맞으며, 본 구절은 문맥상 염소로 이해해야 합니다. 그러나 현재 본문 입력의 불일치를 반영해 번역문에는 제의 대상 동물의 일반 독법을 따르기 어렵습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼에게 속한
  - 야훼를 위하여
  - 주님을 위한
  lexicon: HALOT
  rationale: ל + יהוה는 단순 소유보다 제비의 지정 대상을 나타내므로, 프로젝트 기준에 따라 고유명 ‘야훼’를 유지하면서 한국어에서는 ‘야훼를 위한’으로 옮겼습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 속죄제사
  lexicon: HALOT
  rationale: 제의 규정에서 חטאת는 단순한 ‘죄’가 아니라 희생 제물로서의 ‘속죄제물’을 뜻하므로, 의미를 직접 드러내는 번역을 택했습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: 고유명사를 음역한 ‘야훼’를 본문에 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 Tetragrammaton יהוה를 직접 사용하므로, 프로젝트 기준에 따라 전통 교회어 ‘주님’ 대신 음역형 ‘야훼’를 사용해 본문의 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
