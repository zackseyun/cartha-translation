  to: 그는 거룩한 베 긴옷을 입어야 하며, 베 속바지를 몸에 입어야 합니다. 그는 베 띠를 두르고 베 관을 머리에 둘러야 합니다. 이것들은 거룩한 옷입니다. 그는 몸을 물로 씻은 뒤 그것들을 입어야 합니다.
