  verdict: revise
  source_fidelity: 초안은 속죄(כפר), 정결하게 함(טהר 피엘), 죄들로부터의 정결, 야훼 앞이라는 핵심 요소를 대체로 보존합니다. 그러나 접속사 כִּי의 설명적 용법(‘이는/왜냐하면’)이 빠져 있고, 히브리어 미완료형의 규정적 미래 의미가 현재형 ‘이루어집니다’로 약화되었습니다. ‘정결하게 하다/정결해지다’로 같은 어근의 작용과 결과 상태를 대응시키는 편이 제의 문맥에 더 정확합니다.
  naturalness: ‘이는 … 것이기 때문입니다’와 ‘정결해질 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 본문의 설명·규정 문맥을 분명히 합니다. ‘너희의 모든 죄로부터’는 ‘죄에서’보다 정결의 출발점을 더 명료하게 나타냅니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. כפר는 교리적으로 과도하게 해석하지 않고 ‘속죄하다’로, טהר는 제의적 의미를 보존하여 ‘정결하게 하다/정결해지다’로 옮겼습니다. 주어가 명시되지 않은 יְכַפֵּר는 한국어에서도 주어를 보충하지 않았으며, 각주로 히브리어의 단수형 및 무표시 주어를 밝혔습니다.
