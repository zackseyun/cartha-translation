  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
  footnotes:
  - marker: a
    text: Or, 'he will make atonement for you.' The Hebrew verb is singular and does not state the subject explicitly in this clause.
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이 날에 너희를 깨끗하게 하려고 너희를 위한 속죄가 이루어집니다[a]; 너희는 야훼 앞에서 너희의 모든 죄에서 깨끗해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단수형이며, 이 절에서는 행위의 주체를 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיּוֹם הַזֶּה
  english_pob_choice: on this day
  chosen_korean: 이 날에
  alternatives_korean:
  - 오늘에
  - 그 날에
  lexicon: HALOT
  rationale: 명시적 지시어 הַזֶּה를 살려 의례적 문맥의 특정한 ‘이 날’을 분명히 드러냈습니다.
- source_word: יְכַפֵּר
  english_pob_choice: atonement shall be made
  chosen_korean: 속죄가 이루어집니다
  alternatives_korean:
  - 속죄가 행해집니다
  - 속죄가 너희를 위해 이루어집니다
  - 너희를 속죄할 것입니다
  lexicon: HALOT
  rationale: 본문은 주어를 명시하지 않는 단수 동사이므로, 영어 POB의 수동형 취지를 따라 주체를 과도하게 보충하지 않고 의례적 결과를 자연스럽게 살렸습니다.
- source_word: לְטַהֵר אֶתְכֶם
  english_pob_choice: to cleanse you
  chosen_korean: 너희를 깨끗하게 하려고
  alternatives_korean:
  - 너희를 정결하게 하려고
  - 너희를 정화하려고
  lexicon: HALOT
  rationale: 제의적 정결의 목적을 나타내므로 ‘깨끗하게 하다’로 옮기되, 현대 한국어에서 이해하기 쉬운 목적형으로 처리했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신명칭 יְהוָה는 ‘야훼’로 옮겼고, לִפְנֵי는 단순한 위치가 아니라 심판·예배의 임재 앞이라는 의미를 담아 ‘앞에서’로 유지했습니다.
- source_word: תִּטְהָרוּ
  english_pob_choice: you shall be clean
  chosen_korean: 깨끗해질 것입니다
  alternatives_korean:
  - 정결해질 것입니다
  - 깨끗하게 될 것입니다
  lexicon: HALOT
  rationale: 앞의 ‘깨끗하게 하다’와 구분하여, 결과 상태를 나타내는 완료적 미래를 한국어의 결과 변화 표현으로 살렸습니다.
theological_decisions:
- issue: 제의적 속죄와 정결의 관계
  chosen_reading: 속죄가 이루어집니다 … 깨끗해질 것입니다
  alternative_readings:
  - 속죄가 너희를 정결하게 합니다
  - 너희 죄가 용서됩니다
  rationale: 본문은 속죄와 정결을 연결하지만 동일시하지는 않으므로, 제의적 행위(속죄)와 그 결과(정결)를 구분해 번역했습니다.
  doctrine_reference: Source text distinction between כפר and טהר
