  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
  footnotes:
  - marker: a
    text: Or 'his flesh' instead of 'his body.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in a holy place,' not necessarily 'in the Holy Place' (the inner sanctuary chamber).
    reason: lexical_alternative
  - marker: c
    text: Or 'make expiation' or, in some ritual contexts, 'purge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거룩한 곳에서 물로 몸을 씻고, 자기 옷을 입고, 나와서 자기의 번제와 백성의 번제를 드리고, 자신과 백성을 위해 속죄해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 곳’은 반드시 성막의 안쪽 방인 ‘성소’만을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 정관사가 없으므로, ‘그 거룩한 곳’보다 일반적인 ‘거룩한 곳’이 더 가깝습니다.
    reason: source_note
  - marker: c
    text: כפר는 여기서 ‘속죄하다’로 옮겼지만, 문맥에 따라 ‘속죄를 행하다’ 또는 ‘속죄를 이루다’로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַמַּיִם
  english_pob_choice: He shall wash his body with water
  chosen_korean: 물로 몸을 씻고
  alternatives_korean:
  - 물로 그의 살을 씻고
  - 물로 육체를 씻고
  lexicon: HALOT
  rationale: רחץ와 בשר의 결합은 문자적으로는 ‘살’을 뜻하지만, 제의적 세정 문맥에서는 현대 한국어로 ‘몸을 씻다’가 가장 자연스럽고 원문 의도를 잘 드러냅니다.
- source_word: בְּמָקוֹם קָדוֹשׁ
  english_pob_choice: in a holy place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩한 장소에서
  lexicon: HALOT
  rationale: 히브리어는 정관사가 없어 성막의 특정 내부 방인 ‘성소’로 좁히지 않고, POB의 ‘a holy place’를 반영하여 ‘거룩한 곳’으로 옮겼습니다.
- source_word: וְלָבַשׁ אֶת בְּגָדָיו
  english_pob_choice: put on his garments
  chosen_korean: 자기 옷을 입고
  alternatives_korean:
  - 자기 옷을 걸치고
  - 자기 예복을 입고
  lexicon: HALOT
  rationale: בגדים는 제의적 복장을 가리킬 수 있지만, 여기서는 평이한 ‘옷’을 써도 문맥이 유지되며, ‘예복’은 원문보다 해석이 강합니다.
- source_word: וְעָשָׂה אֶת עֹלָתוֹ וְאֶת עֹלַת הָעָם
  english_pob_choice: offer his burnt offering and the burnt offering of the people
  chosen_korean: 자기의 번제와 백성의 번제를 드리고
  alternatives_korean:
  - 자기의 번제와 백성의 번제를 바치고
  - 자기의 번제와 백성의 번제를 제사하고
  lexicon: HALOT
  rationale: עֹלָה는 제의 용어로 표준적으로 ‘번제’이며, וְעָשָׂה는 제물과 함께 쓰일 때 한국어 제의 문맥에서 ‘드리다’가 가장 자연스럽습니다.
- source_word: וְכִפֶּר בַּעֲדוֹ וּבְעַד הָעָם
  english_pob_choice: make atonement for himself and for the people
  chosen_korean: 자신과 백성을 위해 속죄해야 합니다
  alternatives_korean:
  - 자신과 백성을 위해 속죄해야 합니다
  - 자신과 백성을 위해 속죄를 행해야 합니다
  lexicon: HALOT
  rationale: כפר는 제사문맥에서 ‘속죄하다/속죄를 행하다’가 가능하지만, 여기서는 POB의 ‘make atonement’에 맞춰 동사형 ‘속죄해야 합니다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: כפר의 한국어 신학 용어 선택
  chosen_reading: 속죄하다
  alternative_readings:
  - 속죄를 행하다
  - 속죄하다/속죄를 이루다
  rationale: 이 절은 속죄일의 제사 절차를 말하므로, 과도한 교리화 없이 제의적·신학적 핵심을 유지하는 표준 표현 ‘속죄하다’를 택했습니다.
  doctrine_reference: Levitical atonement legislation; translation philosophy §3, §6
