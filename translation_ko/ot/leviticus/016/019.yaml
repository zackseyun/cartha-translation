revisions:
- from: 그는 자신의 손가락으로 그 피를 조금 가져다가 그 위에 일곱 번 뿌리고, 그것을 정결하게 하고 이스라엘 자손의 부정함들에서 거룩하게 하십시오.
  to: 그는 그의 손가락으로 피를 조금 그 위에 일곱 번 뿌리고, 그것을 이스라엘 자손의 부정으로부터 정결하게 하며 거룩하게 합니다.
  rationale: 원문에 없는 ‘가져다가’를 삭제하고, 피의 일부라는 מִן의 의미를 ‘피를 조금’으로 반영했습니다. 제의적 정결 및 거룩하게 함의 의미와 ‘이스라엘 자손’이라는 표현은 유지했습니다. 규례 문맥에 적합하도록 문체를 현대 합쇼체 서술형으로 통일했습니다.
