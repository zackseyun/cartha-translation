id: LEV.16.19
reference: Leviticus 16:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'purify it'; the Hebrew verb is a standard priestly term for making something ritually clean.
    reason: lexical_alternative
  - marker: b
    text: Or 'sanctify it' or 'make it holy.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Israel'; many English versions render this more idiomatically as 'the Israelites' or 'the people of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신의 손가락으로 그 피를 조금 가져다가 그 위에 일곱 번 뿌리고, 그것을 정결하게 하고 이스라엘 자손의 부정함들에서 거룩하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  english_pob_choice: He shall sprinkle
  chosen_korean: 뿌리고
  alternatives_korean:
  - 뿌립니다
  - 뿌리며
  - 뿌리십시오
  lexicon: HALOT
  rationale: 제사장적 제의 행위인 혈액 도포를 자연스러운 현대 한국어로 옮기되, 단순한 일반적 ‘뿌리다’로도 의례적 의미가 유지됩니다.
- source_word: וְטִהֲרוֹ
  english_pob_choice: and cleanse it
  chosen_korean: 그것을 정결하게 하고
  alternatives_korean:
  - 그것을 깨끗하게 하고
  - 그것을 정화하고
  - 그것을 정결케 하고
  lexicon: HALOT
  rationale: טהר의 제의적 의미를 살려 ‘정결하게 하다’를 택했습니다. 이는 도덕적 세척이 아니라 성소 대상의 의례적 정화를 가리킵니다.
- source_word: וְקִדְּשׁוֹ
  english_pob_choice: and consecrate it
  chosen_korean: 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오
  - 봉헌하십시오
  - 성화하십시오
  lexicon: HALOT
  rationale: קדש는 여기서 대상이 하나님께 속하도록 따로 구별하는 뜻이므로 ‘거룩하게 하다’가 직역성과 가독성을 함께 살립니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 남성 복수의 관용구를 그대로 반영해 본문의 형태를 보존했습니다. ‘백성’은 의미는 자연스럽지만 원문 표지를 약화시킵니다.
theological_decisions:
- issue: 정결과 거룩하게 함의 제의적 의미
  chosen_reading: 이 절은 제단을 이스라엘 자손의 부정함들로부터 의례적으로 정결케 하고 거룩하게 하는 제사 규례로 읽었습니다.
  alternative_readings:
  - 도덕적 죄책을 씻는 표현으로 완화할 수 있습니다.
  - ‘정화’와 ‘성별’로 더 기술적으로 옮길 수 있습니다.
  rationale: 문맥은 속죄일 제의의 성소 정화이지 내면 윤리의 변화가 아니므로, 제의적·의례적 의미를 유지하는 번역이 필요합니다.
  doctrine_reference: 레위기 16장 제의 문맥; 번역 원칙 §§1, 3, 6
- issue: 명령형 톤의 유지
  chosen_reading: 한국어 본문은 절차 지시의 성격을 살려 명령형으로 정리했습니다.
  alternative_readings:
  - '서술형 미래로 옮길 수 있습니다: ‘그는 뿌리고 … 정결하게 할 것입니다.’'
  rationale: 히브리어 연속 동작 지시를 한국어에서도 의례 지시문답에 맞게 명령형으로 전달하는 편이 본문의 수행성을 더 잘 드러냅니다.
  doctrine_reference: 번역 원칙 §2
