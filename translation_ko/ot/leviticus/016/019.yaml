review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그 피를 조금 가져다가’에서 ‘가져다가’는 히브리어 본문에 없는 별도의 동작을 보태며, 본문은 피의 일부를 손가락으로 제단 위에 뿌리는 행위만 말합니다. 또한 마지막의 ‘하십시오’는 앞선 ‘뿌리고’와 인칭·문체가 맞지 않습니다.
  naturalness: ‘그 피를 조금 그 위에’는 한국어에서 어순이 다소 뻣뻣하므로 ‘그의 손가락으로 피를 조금 վերց어 그 위에’ 같은 표현도 가능하나, ‘취하여’는 원문에 없는 동작을 암시합니다. 따라서 ‘그의 손가락으로 피를 조금 그 위에’로 두고, 규례 문맥에 맞는 일관된 합쇼체 서술형으로 정리했습니다. ‘부정함들’은 히브리어 복수형을 기계적으로 옮긴 것으로 현대 한국어에서는 부자연스러워 ‘부정’으로 처리했습니다.
  terminology: טהר와 קדש의 제의적 의미는 각각 ‘정결하게 하다’와 ‘거룩하게 하다’로 유지할 수 있습니다. בְּנֵי יִשְׂרָאֵל은 ‘이스라엘 자손’으로 보존했습니다. 선행 문맥의 제단을 가리키는 대명사는 한국어에서 ‘그것’으로 유지하여 원문의 지시성을 넘어서 구체 명사를 보충하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘가져다가’가 원문에 없는 동작을 추가합니다.
    rationale: מִן־הַדָּם은 피의 일부/피로부터를 나타내며, 피를 가져오는 행위는 명시하지 않습니다.
  - severity: medium
    issue: 문장 안에서 연결형 ‘뿌리고’와 명령형 ‘하십시오’가 혼용됩니다.
    rationale: 현대 표준어 합쇼체의 일관된 규례 서술로 정리할 필요가 있습니다.
  - severity: low
    issue: ‘부정함들’은 한국어에서 부자연스럽습니다.
    rationale: 히브리어의 복수형은 제의적 부정의 여러 사례 또는 범주를 가리키지만, 한국어에서는 ‘부정’이 해당 집합적 의미를 자연스럽게 나타냅니다.
  revised_text: 그는 그의 손가락으로 피를 조금 그 위에 일곱 번 뿌리고, 그것을 이스라엘 자손의 부정으로부터 정결하게 하며 거룩하게 합니다.
