base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
  footnotes:
  - marker: a
    text: Or 'mercy seat.' The Hebrew term refers to the cover of the ark, especially in its role in atonement rites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 향을 여호와 앞에서 불 위에 두어야 합니다. 그러면 향의 구름이 증거 위에 있는 속죄소를 덮어, 그가 죽지 않게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄소’. 이 히브리어는 언약궤의 덮개를 가리키며, 특히 속죄 의례에서 그 기능을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
