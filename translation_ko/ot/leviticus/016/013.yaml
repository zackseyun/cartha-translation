  source_fidelity: ‘여호와’는 제공된 프로젝트의 יְהוָה 표기 원칙 및 영어 감사추적의 ‘Yahweh’와 일치하지 않으므로 ‘야훼’로 고쳐야 합니다. 또한 עֵדוּת는 여기서 법궤 안의 증거판을 가리키므로, 한국어에서는 ‘증거판’이 더 정확하고 자연스럽습니다. 마지막 절은 향의 구름이 덮는 목적, 곧 제사장이 죽지 않게 하는 결과를 나타내도록 옮겼습니다.
  naturalness: 현대 한국어 합쇼체의 절차적 지시 문장으로 자연스럽게 다듬었습니다. ‘그러면’과 ‘~게 됩니다’의 느슨한 결과 연결 대신 ‘~도록’으로 원문의 목적·보호 기능을 명료하게 나타냈습니다.
  terminology: ‘향’, ‘야훼’, ‘속죄소’, ‘증거판’을 사용했습니다. ‘속죄소’는 한국어 성서 전통에서 널리 정착한 κאַפֹּּרֶת 대응어이며, ‘속죄 덮개’를 각주 대안으로 제시했습니다. 기존 각주는 본문과 동일한 ‘속죄소’를 대안으로 제시하여 기능하지 않았으므로 수정했습니다.
