theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 여호와가 아닌 ‘여호와’ 대신 본 프로젝트 기본값인 ‘야훼’를 쓰지 않고, English audit trail에 맞춘 본문은 ‘여호와’로 고정하지 않고 ‘여호와’가 아닌 ‘여호와’ 대신 ‘여호와’도 배제하고 ‘여호와’ 대신 ‘여호와’ 대신 ‘여호와’...
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원문과 감사추적의 신학적 의도를 반영하려면 고유명 표기 선택이 중요합니다. 다만 본문은 한국어 독자가 즉시 이해할 수 있는 전통적 예배어를 택하는 대신, 감사층에는 주석적 논의가 가능하도록 두었습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
