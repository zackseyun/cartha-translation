revisions:
- from: 그리고 그는 향을 여호와 앞에서 불 위에 두어야 합니다. 그러면 향의 구름이 증거 위에 있는 속죄소를 덮어, 그가 죽지 않게 됩니다.[a]
  to: 그는 야훼 앞에서 불 위에 향을 놓아야 합니다. 향의 구름이 증거판 위에 있는 속죄소를 덮어 그가 죽지 않도록 해야 합니다.[a]
  rationale: 신명 표기를 프로젝트의 ‘Yahweh’ 원칙에 따라 ‘야훼’로 통일했습니다. עֵדוּת의 성막 문맥상 지시 대상을 ‘증거판’으로 명시했으며, 향의 구름이 속죄소를 덮어 제사장이 죽지 않게 하는 원문의 목적 관계를 자연스러운 합쇼체로 반영했습니다. 본문과 중복되던 각주는 실제 어휘 대안을 제공하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:08:18Z'
