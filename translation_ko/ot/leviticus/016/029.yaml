reference: Leviticus 16:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
  footnotes:
  - marker: a
    text: Or, more literally, 'you shall afflict yourselves.' The expression is traditionally understood to include fasting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 너희에게 영구한 규례가 될 것입니다. 일곱째 달 그 달 열째 날에 너희는 스스로를 괴롭게 하며[a], 어떤 일도 해서는 안 됩니다. 본토 태생이든 너희 가운데 사는 거류민이든 그렇게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘너희 자신을 괴롭게 하라.’ 이 표현은 전통적으로 금식을 포함하는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - 영원한 법령
  lexicon: HALOT
  rationale: חֻקָּה는 정해진 규례/법규이고, עוֹלָם은 언약적 맥락에서 지속성을 나타내므로 ‘영원한 규례’가 본문의 규범성을 자연스럽게 살립니다.
- source_word: תְּעַנּוּ אֶת נַפְשֹׁתֵיכֶם
  english_pob_choice: you shall humble yourselves
  chosen_korean: 스스로를 괴롭게 하고
  alternatives_korean:
  - 스스로를 낮추고
  - 자기를 괴롭히고
  - 금식하며
  lexicon: HALOT
  rationale: 이 히브리어 관용구는 단순히 ‘금식’만 뜻하지 않으므로, 본문 의미를 넓게 살리는 표현을 택하고 더 문자적인 뉘앙스는 각주로 보완합니다.
- source_word: הָאֶזְרָח
  english_pob_choice: the native-born
  chosen_korean: 본토 사람
  alternatives_korean:
  - 토착민
  - 태생인 사람
  - 자국민
  lexicon: HALOT
  rationale: 문맥상 언약 공동체 내부의 출생 구성원을 가리키므로, 현대 한국어에서 가장 이해가 쉬운 ‘본토 사람’으로 옮겼습니다.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  english_pob_choice: the sojourner who sojourns among you
  chosen_korean: 너희 가운데 머무는 이방인
  alternatives_korean:
  - 너희 가운데 거류하는 나그네
  - 너희 가운데 함께 사는 거류민
  - 너희 가운데 체류하는 외국인
  lexicon: HALOT
  rationale: גֵּר의 법적·사회적 뉘앙스를 살리되, 한국어에서 통하는 관용을 위해 ‘머무는 이방인’으로 옮겼고, 반복 동사는 과도한 어색함을 피하면서도 의미를 유지합니다.
theological_decisions:
- issue: Day of Atonement의 עצמי 괴로움/절제 명령의 범위
  chosen_reading: 본문에는 ‘스스로를 괴롭게 하고’라고 두어, 금식으로 한정하지 않고 더 넓은 자기 절제와 낮아짐의 의미를 열어 둡니다.
  alternative_readings:
  - 금식하고
  - 스스로를 낮추고
  - 자기를 괴롭히고
  rationale: 히브리어 표현은 전통적으로 금식을 포함하지만 그것만으로 환원되지는 않으므로, 본문 의미와 전통적 이해를 모두 해치지 않는 중립적 표현을 채택합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
