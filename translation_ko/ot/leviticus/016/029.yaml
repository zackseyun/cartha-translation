- from: 이것은 너희를 위한 영원한 규례가 될 것입니다. 일곱째 달 열흘째 날에 너희는 스스로를 괴롭게 하고, 아무 일도 해서는 안 됩니다. 본토 사람이든 너희 가운데 머무는 이방인이든 마찬가지입니다.[a]
