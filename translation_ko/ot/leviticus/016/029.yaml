  rationale: 날짜를 원문의 월 기준 표현에 맞게 다듬고, גֵּר를 공동체 내 거주 외부인을 뜻하는 ‘거류민’으로 수정했습니다. 명령의 적용 대상인 본토 태생자와 거류민을 한국어 문장 안에서 명료하게 연결했으며, 자기 괴롭게 함의 넓은 의미와 금식이라는 전통적 이해는 본문과 각주의 구분으로 보존했습니다.
