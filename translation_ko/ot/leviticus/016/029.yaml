  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 בֶּעָשׂוֹר לַחֹדֶשׁ는 ‘그 달 열째 날’로 명확히 옮기는 편이 자연스럽고 정확합니다. 또한 הַגֵּר는 일시적 일반 ‘이방인’보다 공동체 안에 거주하는 법적·사회적 범주의 ‘거류민’으로 옮기는 것이 적절합니다.
  naturalness: 합쇼체는 일관되지만, ‘일곱째 달 열흘째 날’은 현대 한국어에서 다소 부자연스럽고, ‘본토 사람이든 … 이방인이든 마찬가지입니다’는 원문의 적용 대상을 설명식으로 덧붙인 느낌이 있습니다. 문장을 다듬어 명령이 두 부류 모두에게 적용됨을 자연스럽게 나타낼 수 있습니다.
  terminology: ‘영원한 규례’와 ‘스스로를 괴롭게 하다’는 가능한 번역입니다. 다만 עוֹלָם의 법률 문맥상 지속성을 ‘영구한 규례’로 옮기면 현대어에서 과도한 형이상학적 함의를 줄일 수 있습니다. גֵּר는 ‘거류민’이 더 정확하며, 각주는 해당 관용구 바로 뒤에 두어야 합니다.
