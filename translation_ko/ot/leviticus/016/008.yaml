  source_fidelity: ‘두 숫염소 위에 제비를 뽑아야 합니다’는 히브리어 עַל의 공간적 표현을 직역한 듯하나, 한국어에서는 제비를 염소 ‘위에’ 뽑는다는 뜻으로 읽힐 수 있습니다. ‘두 숫염소를 두고 제비를 뽑아야 합니다’가 두 염소에 관하여 제비를 뽑는다는 본문의 제의적 배정을 자연스럽고 정확하게 나타냅니다. עֲזָאזֵל은 ‘아사셀’로 음역하여 불확실성을 보존한 것이 적절합니다.
  naturalness: 합쇼체는 일관되지만, ‘하나의 제비’의 반복은 한국어에서 다소 부자연스럽습니다. ‘한 제비는 … 위한 것이고’가 더 자연스럽습니다. 또한 첫 절과 결과 절을 한 문장으로 연결하면 원문의 병렬과 제비의 배정을 더 분명하게 드러냅니다.
  terminology: ‘숫염소’는 שְׂעִירִם의 문맥상 적절합니다. ‘야훼’와 ‘아사셀’은 각각 원문의 명칭을 음역한 것으로 일관됩니다. 각주에서는 ‘속죄 염소’보다 통상적인 합성어 표기인 ‘속죄염소’를 사용하되, 이것이 확정적 해석이 아님을 계속 밝혀야 합니다.
