  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
  footnotes:
  - marker: a
    text: Or, 'one lot for the scapegoat.' The Hebrew term 'Azazel' is disputed; it may be understood as a proper name, the goat's function, or a term related to removal.
    reason: alternative_reading
translation:
  language: ko
  text: 아론은 두 숫염소 위에 제비를 뽑아야 합니다. 하나의 제비는 야훼를 위한 것이고, 하나의 제비는 아사셀을 위한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 염소를 위한 것’. 히브리어 ‘아사셀’의 뜻은 논쟁적이며, 고유명사, 염소의 기능, 혹은 제거와 관련된 말로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: shall cast
  chosen_korean: 제비를 뽑아야 합니다
  alternatives_korean:
  - 제비를 두어야 합니다
  - 제비를 던져야 합니다
  - 제비를 놓아야 합니다
  lexicon: HALOT
  rationale: 문맥에서 단순한 ‘주다/놓다’가 아니라 제비뽑기 행위를 가리키므로, 한국어에서도 관용적이고 의식 행위를 드러내는 ‘제비를 뽑다’가 가장 자연스럽습니다.
- source_word: שְׁנֵי הַשְּׂעִירִם
  english_pob_choice: the two goats
  chosen_korean: 두 숫염소
  alternatives_korean:
  - 두 염소
  - 두 수염소
  lexicon: HALOT
  rationale: 히브리어 שְּׂעִירִם은 이 제의 맥락에서 수염소를 가리키므로, 단순한 ‘염소’보다 성별이 드러나는 ‘숫염소’가 स्रोत 의미를 더 정확히 반영합니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위한 것
  alternatives_korean:
  - 야훼에게 속한 것
  - 야훼를 위하여
  lexicon: HALOT
  rationale: 본문의 לַ는 제비의 배정 대상을 나타내므로, 한국어에서는 ‘~를 위한 것’으로 옮겨 제의적 배분을 분명히 했습니다.
- source_word: לַעֲזָאזֵל
  english_pob_choice: for Azazel
  chosen_korean: 아사셀을 위한 것
  alternatives_korean:
  - 속죄소를 위한 것
  - 염소를 위한 것
  - 완전한 제거를 위한 것
  lexicon: HALOT
  rationale: 이 용어는 의미가 확정되지 않은 난해어이므로, 본문은 영어 POB처럼 음역을 유지해 해석을 미리 결정하지 않았습니다.
theological_decisions:
- issue: עֲזָאזֵל의 처리
  chosen_reading: 주본문에서는 ‘아사셀’로 음역하여 의미를 열어 둡니다.
  alternative_readings:
  - ‘속죄 염소’로 해석
  - ‘제거’와 관련된 추상명으로 해석
  - 광야의 존재/이름으로 해석
  rationale: 레위기 16:8 자체는 עֲזָאזֵל의 뜻을 분명히 밝히지 않으므로, 번역이 특정 해석을 강제하지 않도록 음역을 택하는 것이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it; §2: Translate titles; transliterate names'
