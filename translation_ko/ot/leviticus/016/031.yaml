id: LEV.16.31
reference: Leviticus 16:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
  footnotes:
  - marker: a
    text: Or 'you shall afflict yourselves'; traditionally understood to include fasting and self-denial.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 여러분을 위한 완전한 안식의 안식일입니다. 여러분은 스스로를 괴롭게 해야 합니다. 이것은 영원한 규례입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로를 괴롭게 해야 합니다’; 전통적으로는 금식과 절제까지 포함하는 뜻으로 이해되었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּ֨ת שַׁבָּת֥וֹן
  english_pob_choice: Sabbath of complete rest
  chosen_korean: 완전한 안식의 안식일
  alternatives_korean:
  - 엄숙한 안식의 안식일
  - 완전한 쉼의 안식일
  - 철저한 안식의 안식일
  lexicon: HALOT
  rationale: 이중 표현의 강한 강조를 살리기 위해 ‘안식일’과 ‘완전한 안식’을 함께 두어, 단순한 휴식이 아니라 예식적이고 절대적인 안식일임을 드러냈습니다.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  english_pob_choice: you shall humble yourselves
  chosen_korean: 스스로를 괴롭게 해야 합니다
  alternatives_korean:
  - 스스로를 낮추어야 합니다
  - 금식해야 합니다
  - 자신을 괴롭게 해야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 넓은 뜻을 살리되, 전통적으로 포함되는 자제·금식의 의미를 흐리지 않기 위해 직역적이면서도 현대 한국어에서 이해 가능한 표현을 택했습니다.
- source_word: חֻקַּ֖ת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - 영원한 법령
  lexicon: HALOT
  rationale: 법적·언약적 효력을 나타내는 고정 관용구로 보고, ‘규례’로 옮기되 지속성을 ‘영원한’으로 분명히 했습니다.
theological_decisions:
- issue: ‘you shall humble yourselves’의 범위
  chosen_reading: 본문에는 금식을 직접 넣지 않고 ‘스스로를 괴롭게 해야 합니다’로 넓게 옮겼습니다.
  alternative_readings:
  - 금식해야 합니다
  - 스스로를 낮추어야 합니다
  rationale: 히브리어는 ‘괴롭히다/낮추다’의 포괄적 금욕 표현이므로, 전통적 해석을 존중하면서도 본문이 직접 말하는 범위를 넘어서지 않도록 했습니다.
  doctrine_reference: 사전적 범위와 전통적 실천을 구분하여 보존합니다.
