id: LEV.16.33
reference: Leviticus 16:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
  footnotes:
  - marker: a
    text: Or 'make expiation for'; in this cultic context the Hebrew verb כפר can emphasize the removal of impurity as well as atonement.
    reason: lexical_alternative
  - marker: b
    text: '''People of the assembly'' may also be rendered ''people of the congregation.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 그는 거룩한 성소와 회막과 제단을 위하여 속죄할 것이며, 제사장들과 온 회중의 백성을 위하여도 속죄할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  english_pob_choice: make atonement
  chosen_korean: 속죄하다
  alternatives_korean:
  - 속죄제를 드리다
  - 정결하게 하다
  - 속죄를 행하다
  lexicon: HALOT
  rationale: 레위기의 כפר는 제의적 기술어로서 반복을 보존하는 것이 중요하므로, 한국어에서도 동일 동사를 반복해 제의적·신학적 힘을 살렸습니다. '속죄하다'는 이 문맥에서 가장 자연스럽고 널리 통용되는 대응입니다.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  english_pob_choice: the Holy Sanctuary
  chosen_korean: 지성소
  alternatives_korean:
  - 거룩한 성소
  - 지극히 거룩한 성소
  - 성소의 지성
  lexicon: HALOT
  rationale: 영어 POB가 지나치게 구체화하지 않고 거룩한 성소를 가리키는 표현으로 처리한 점을 따라, 한국어에서는 한국 성경 전통에서 이 자리의 대상과 가장 잘 대응하는 '지성소'를 택했습니다.
- source_word: עַם הַקָּהָל
  english_pob_choice: all the people of the assembly
  chosen_korean: 온 회중의 모든 백성
  alternatives_korean:
  - 회중의 모든 백성
  - 모인 공동체의 모든 백성
  - 모든 회중 백성
  lexicon: HALOT
  rationale: '''assembly''의 집합성과 공동체성을 살리기 위해 ''회중''을 택했고, ''all the people''의 범위를 분명히 하기 위해 ''온''과 ''모든 백성''을 함께 썼습니다.'
- source_word: וְאֶת הַכֹּהֲנִים
  english_pob_choice: for the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: אַכֹּהֲנִים은 성전 제의 직분을 가리키므로 표준적인 구약 용어인 '제사장'이 가장 직접적입니다.
theological_decisions:
- issue: כפר를 공간과 사람 모두에 동일하게 적용하는 반복
  chosen_reading: '''속죄하다''를 지성소, 회막, 제단, 제사장들, 백성에게 일관되게 반복했습니다.'
  alternative_readings:
  - 공간에는 '정결하게 하다', 사람에게는 '속죄하다'로 구분함
  rationale: 히브리어는 동일 동사를 반복하여 성소와 사람을 하나의 속죄 행위 아래 묶습니다. 한국어도 이 반복을 유지해 제의적 통일성을 드러내는 것이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
