  verdict: revise
  source_fidelity: 개정이 필요합니다. מִקְדַּשׁ הַקֹּדֶשׁ는 이 문맥에서 성소의 거룩한 영역을 가리키지만, 본문 자체가 ‘지성소’(가장 안쪽의 특정 구획)를 명시한다고 단정하기는 어렵습니다. 따라서 ‘지성소’는 영어 POB의 신중한 ‘Holy Sanctuary’보다 구체적입니다. כפר의 반복과 성소·회막·제단 및 제사장·회중 백성에 대한 적용은 유지해야 합니다.
  naturalness: ‘온 회중의 모든 백성’은 ‘온’과 ‘모든’이 중복되어 다소 무겁습니다. ‘온 회중의 백성’이 כָּל עַם הַקָּהָל의 전체성을 자연스럽게 나타냅니다. ‘위하여 속죄해야 합니다’보다 서술적 법규 문맥에서는 ‘위하여 속죄할 것입니다’가 합쇼체로 자연스럽습니다.
  terminology: ‘속죄하다’, ‘회막’, ‘제단’, ‘제사장’은 적절합니다. 다만 ‘지성소’는 본문의 표현보다 좁으므로 ‘거룩한 성소’로 고칩니다. 기존 각주는 각각 본문보다 좁은 번역을 정당화하거나 영어 번역을 근거로 설명하므로 삭제하는 편이 적절합니다.
  issues:
