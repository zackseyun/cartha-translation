    rationale: ‘온 회중의 백성’만으로도 ‘all the people of the assembly’의 총체성을 충분히 나타내며 더 자연스럽습니다.
  - severity: low
    issue: 기존 각주가 번역 선택을 부정확하게 뒷받침함
    rationale: 각주 a는 본문 표현보다 구체적인 전통 번역을 정당화하고, 각주 b는 히브리어가 아니라 영어 POB 선택을 근거로 듭니다. 이 절의 한국어 본문에는 해당 각주가 필요하지 않습니다.
  revised_text: 이와 같이 그는 거룩한 성소와 회막과 제단을 위하여 속죄할 것이며, 제사장들과 온 회중의 백성을 위하여도 속죄할 것입니다.
