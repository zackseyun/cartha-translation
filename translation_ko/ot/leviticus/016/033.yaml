    rationale: 히브리어가 가장 안쪽 성소를 뜻하는 전문 명칭을 명시하지 않으며, 제공된 영어 POB도 이를 ‘Holy Sanctuary’로 신중하게 옮깁니다. ‘거룩한 성소’가 원문의 범위를 보존합니다.
  - severity: low
