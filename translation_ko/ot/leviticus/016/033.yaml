  to: 이와 같이 그는 거룩한 성소와 회막과 제단을 위하여 속죄할 것이며, 제사장들과 온 회중의 백성을 위하여도 속죄할 것입니다.
  rationale: 원문의 כפר 반복을 한국어 ‘속죄하다’로 유지하고, 성소·회막·제단 및 제사장·회중 백성이라는 대상 범위를 보존했습니다. ‘지성소’라는 과도한 특정화를 피하여 원문과 영어 POB의 신중한 범위를 따랐으며, 중복적 수량 표현과 부정확한 각주를 제거했습니다.
