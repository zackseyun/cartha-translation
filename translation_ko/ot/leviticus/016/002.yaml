source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
  footnotes:
  - marker: a
    text: Or 'mercy seat,' the traditional rendering of 'atonement cover.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “당신의 형 아론에게 말하십시오. 그는 아무 때나 휘장 안쪽의 성소로, 곧 궤 위에 있는 속죄 덮개 앞으로 들어오지 말아야 합니다. 그러면 그가 죽지 않을 것입니다. 내가 구름 가운데서 속죄 덮개 위에 나타날 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 ‘자비의 자리’로 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: SBLGNT/WLC 전통 표기 관행
  rationale: 본문의 고유 신명은 титуль이 아니라 언약적 이름이므로, POB의 원칙에 따라 한국어에서도 ‘야훼’로 옮겨 이름의 직접성을 유지했습니다.
- source_word: בְּכָל עֵת
  english_pob_choice: at just any time
  chosen_korean: 아무 때나
  alternatives_korean:
  - 항상
  - 언제든지
  lexicon: HALOT
  rationale: 이 표현은 지속적 출입이 아니라 허용되지 않은 임의의 प्रवेश을 가리키므로, ‘아무 때나’가 금지의 힘을 가장 자연스럽게 드러냅니다.
- source_word: מִבֵּית לַפָּרֹכֶת
  english_pob_choice: inside the veil
  chosen_korean: 휘장 안
  alternatives_korean:
  - 휘장 뒤
  - 휘장 안쪽
  lexicon: HALOT
  rationale: ‘inside the veil’의 공간 관계를 간결하게 살리기 위해 ‘휘장 안’을 택했습니다. 한국어 성막 문맥에서 즉시 이해되면서도 원문의 방향성을 유지합니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: atonement cover
  chosen_korean: 속죄소
  alternatives_korean:
  - 속죄 덮개
  - 자비의 자
  lexicon: HALOT
  rationale: 이 용어는 언약궤 덮개라는 물체와 속죄 의례를 함께 가리키므로, 본문 맥락에서 기능을 드러내는 ‘속죄소’를 사용했습니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 법궤
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘궤’이지만, 성막 문맥에서 한국어 독자가 즉시 식별할 수 있도록 ‘언약궤’로 옮겼습니다.
- source_word: כִּי בֶּעָנָן אֵרָאֶה
  english_pob_choice: For I will appear in the cloud
  chosen_korean: 내가 구름 가운데서 … 나타나기 때문이다
  alternatives_korean:
  - 내가 구름 속에서 … 나타날 것이기 때문이다
  - 내가 구름으로 … 보이기 때문이다
  lexicon: HALOT
  rationale: 신적 현현을 단순 시각 관찰이 아니라 구름 가운데서의 자기 현시로 이해해 ‘구름 가운데서 나타나다’로 옮겼습니다.
theological_decisions:
- issue: 죄와 죽음의 경고가 지닌 제의적 경계의 보존
  chosen_reading: 아론의 임의적 접근을 금지하는 경고로 이해하고, ‘그가 죽지 않게 하려는 것이다’로 결과를 분명히 표현했습니다.
  alternative_readings:
  - 그가 죽을까 하여
  - 그렇지 않으면 그는 죽을 것이다
  rationale: 본문은 성소 접근의 거룩함과 제한을 강조하므로, 경고를 완화하지 않고 결과를 직접적으로 제시하는 방식이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 레위기 16장의 성소 거룩성 및 제의적 경계
- issue: 휘장 안과 속죄소 앞의 공간 관계
  chosen_reading: ‘휘장 안, 곧 속죄소 위에 있는 언약궤 앞의 성소’로 옮겨 공간 배치를 한 문장 안에서 분명히 했습니다.
  alternative_readings:
  - 휘장 뒤의 성소
  - 휘장 안쪽의 지성소
  rationale: 원문은 출입 금지 구역과 하나님의 현현 장소를 단계적으로 좁혀 말하므로, 공간 관계를 과도하게 일반화하지 않으면서 한국어 독자가 제의적 배치를 따라가도록 했습니다.
  doctrine_reference: 성막/지성소 구조에 대한 본문 자체의 묘사
