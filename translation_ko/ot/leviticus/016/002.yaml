  naturalness: 초안의 인용문은 서술부의 합쇼체와 달리 ‘말하여라’, ‘못하게 하여라’라는 해라체를 사용합니다. 지정된 현대 공식-공손체에 맞추어 직접 명령을 ‘말하십시오’ 및 간접 인용으로 정리하는 것이 자연스럽고 일관됩니다.
  terminology: כַּפֹּרֶת는 구체적인 궤의 덮개이므로 ‘속죄 덮개’가 의미를 투명하게 드러냅니다. 전통적 대안은 ‘자비의 자리’이며, 초안 각주의 ‘자비의 자’는 불완전한 표현입니다. 야훼, 휘장, 구름 가운데서 나타남은 적절합니다.
