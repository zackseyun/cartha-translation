    rationale: ‘그 빵을 위한 기념물 곧 ... 화제입니다’는 ‘기념물’과 ‘화제’의 제의적 관계가 불명료합니다. ‘기념 부분, 곧 ... 화제’로 바로잡습니다.
  revised_text: 순수한 유향을 각 줄 위에 놓으십시오. 그것이 그 빵을 위한 기념 부분, 곧 야훼께 드리는 화제가 되게 하십시오.[a][b]
