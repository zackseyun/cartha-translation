  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the arrangement'; in context this refers to the ordered rows of the bread.
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 순수한 유향을 그 줄 위에 두십시오. 그것은 그 빵을 위한 기념물 곧 야훼께 드리는 화제입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 배열’입니다. 문맥상 진설빵의 정돈된 줄을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불로 드리는 제물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ עַל
  english_pob_choice: And you shall put ... on
  chosen_korean: 그 줄 위에 두십시오
  alternatives_korean:
  - 그 위에 놓으십시오
  - 그 위에 두십시오
  lexicon: HALOT
  rationale: 명령형의 제의 지시로 옮기되, 앞 문맥의 진설빵 배열을 가리키는 ‘그 줄’로 자연스럽게 연결했습니다.
- source_word: הַמַּעֲרֶכֶת
  english_pob_choice: each row
  chosen_korean: 그 줄
  alternatives_korean:
  - 그 배열
  - 그 진열
  lexicon: HALOT
  rationale: 문맥상 빵의 ‘정돈된 줄/배열’을 가리키므로, POB의 해석을 반영하되 한국어에서는 간결하게 ‘줄’로 옮겼습니다.
- source_word: לְבֹנָה זַכָּה
  english_pob_choice: pure frankincense
  chosen_korean: 순수한 유향
  alternatives_korean:
  - 깨끗한 유향
  - 정결한 유향
  lexicon: HALOT
  rationale: 제의적 순도를 나타내는 זַכָּה를 ‘순수한’으로 옮겨, 단순한 물리적 깨끗함보다 예배용 정결성을 드러냈습니다.
- source_word: לְאַזְכָּרָה אִשֶּׁה
  english_pob_choice: as a memorial portion, a food offering
  chosen_korean: 기념물 곧 … 화제
  alternatives_korean:
  - 기념 제물 곧 … 화제
  - 기념물로서의 화제
  lexicon: HALOT
  rationale: אַזְכָּרָה의 기억-환기 기능을 ‘기념물’로 살리고, אִשֶּׁה는 한국어 제의 용례에 맞춰 ‘화제’로 옮겨 POB의 주석적 긴장을 반영했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 위하여
  - 주님께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명기적 이름 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 음역하고, 제사 귀속을 나타내는 여격 조사 ‘-께’를 사용했습니다.
theological_decisions:
- issue: אִשֶּׁה의 제의적 의미
  chosen_reading: ‘화제’로 옮겨 불로 드리는 제물이라는 제의적 성격을 드러냈습니다.
  alternative_readings:
  - ‘불로 드리는 제물’
  - ‘화제물’
  rationale: 문맥은 단순한 음식이 아니라 야훼께 드려지는 제의 행위이므로, 전통 용어를 쓰되 원문의 희생 제의성을 유지하는 번역이 적절합니다.
  doctrine_reference: Leviticus sacrificial terminology
