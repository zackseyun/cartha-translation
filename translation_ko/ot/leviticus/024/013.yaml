- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 말씀하여
  lexicon: HALOT
  rationale: 히브리어의 전형적 발화 도입구를 한국어에서는 중복된 ‘말하며’ 뒤에 이어지는 설명으로 자연화하되, 다음 절의 직접화법을 예고하는 기능을 유지했습니다.
