  lexicon: HALOT
  rationale: 서술 진행을 나타내는 와ו-연속형의 흐름을 살려, 단순한 ‘말했다’보다 공손하고 성경적 문맥에 맞는 ‘말씀하시며 이르셨습니다’로 옮겼습니다.
