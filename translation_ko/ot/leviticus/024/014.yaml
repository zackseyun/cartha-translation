id: LEV.24.14
reference: Leviticus 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
  footnotes:
  - marker: a
    text: Or, 'the blasphemer' / 'the one who blasphemed.' The Hebrew literally refers to 'the one who cursed.'
    reason: alternative_reading
  - marker: b
    text: The laying on of hands here likely marks the witnesses' formal identification of the offender, though some understand it as carrying symbolic significance as well.
    reason: cultural_note
translation:
  language: ko
  text: 그 저주한 사람을 진영 밖으로 끌어내십시오[a]. 그리고 그를 들은 모든 사람은 그의 머리 위에 자기 손을 얹고[b], 온 회중이 그를 돌로 쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주한 사람’은 히브리어의 문자적 표현입니다. 문맥상 하나님의 이름을 저주한 사건이므로, ‘신성을 모독한 사람’으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 손을 얹는 행위는 여기서 증인들의 공식적 확인을 나타내는 것으로 이해되지만, 상징적 의미를 함께 보려는 해석도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  english_pob_choice: Bring
  chosen_korean: 끌어내십시오
  alternatives_korean:
  - 데려오십시오
  - 내보내십시오
  lexicon: HALOT
  rationale: 명령형 히필의 ‘밖으로 나가게 하다’는 의미를 한국어에서 가장 자연스럽게 살리면서, 뒤의 ‘진영 밖’과도 잘 맞습니다.
- source_word: הַמְקַלֵּל
  english_pob_choice: the one who cursed
  chosen_korean: 그 저주한 사람
  alternatives_korean:
  - 저주한 자
  - 신성을 모독한 사람
  - 저주한 자
  lexicon: HALOT
  rationale: 히브리어 동사의 기본 의미를 따라 ‘저주한 사람’으로 옮겨, 본문이 직접 말하는 어휘를 유지했습니다. 전통적 해석어인 ‘신성을 모독한 사람’은 본문 전체 맥락을 반영하지만, 본문 단어 자체를 본문에 먼저 드러내는 것이 더 적절합니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진영 밖
  alternatives_korean:
  - 진 밖
  - 진영 바깥
  lexicon: HALOT
  rationale: 제의적·공동체적 경계를 나타내는 고정 표현이므로, 표준적이고 간결한 ‘진영 밖’을 택했습니다.
- source_word: וְסָמְכוּ כָל הַשֹּׁמְעִים אֶת יְדֵיהֶם עַל רֹאשׁוֹ
  english_pob_choice: let all who heard lay their hands on his head
  chosen_korean: 그를 들은 모든 사람은 그의 머리 위에 자기 손을 얹고
  alternatives_korean:
  - 들은 모든 사람이 손을 얹고
  - 그의 머리에 손을 얹고
  lexicon: HALOT
  rationale: ‘손을 얹다’는 관용구를 유지하되, 히브리어의 복수 ‘손들’과 ‘머리 위에’의 공간 표현을 살려 문장을 구성했습니다. ‘그를 들은’은 영어판의 설명적 추가 없이도 한국어에서 자연스럽게 이해됩니다.
- source_word: כָל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 공동체
  lexicon: HALOT
  rationale: עֵדָה의 공동체적·공적 결집을 살리면서, 한국어에서 가장 자연스러운 집합 명사로 옮겼습니다.
- source_word: וְרָגְמוּ אֹתוֹ
  english_pob_choice: stone him
  chosen_korean: 그를 돌로 쳐야 합니다
  alternatives_korean:
  - 그를 돌로 쳐야 합니다
  - 그에게 돌을 던져야 합니다
  lexicon: HALOT
  rationale: רגם의 처형 용법을 분명히 드러내기 위해 ‘돌로 치다’를 사용했습니다. 한국어에서 ‘돌로 치다’는 실제 처형 행위를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: ‘저주하다’와 ‘신성을 모독하다’의 긴장
  chosen_reading: 본문에는 ‘저주한 사람’을 두고, 해석적 의미는 주석에서 열어 둡니다.
  alternative_readings:
  - ‘신성을 모독한 사람’으로 본문화
  - ‘저주한 자’로 더 직역
  rationale: 히브리어 표면 어휘는 ‘저주하다’이므로 본문은 이를 따르고, 맥락상 하나님의 이름을 저주한 사건이라는 해석은 주석적 여지로 남겨 둡니다. 이렇게 하면 본문 어휘와 전통적 해석 사이의 긴장을 지우지 않습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 해석은 가능한 한 주석으로 분리하고 본문에서는 본문이 말하는 범위를 유지합니다.'
- issue: 손을 얹는 행위의 의미
  chosen_reading: 의미를 본문에 설명하지 않고 행위 자체를 그대로 옮깁니다.
  alternative_readings:
  - 증인들의 공식적 확인
  - 상징적 죄 전가
  rationale: 본문은 손을 얹으라고만 말하며 그 상징을 명시하지 않습니다. 따라서 특정 해석을 본문에 끼워 넣지 않고, 독자가 문맥을 따라 판단하도록 두는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하지 않는 신학적 해석은 본문 밖에 두고, 본문에서는 행위만 보존합니다.'
