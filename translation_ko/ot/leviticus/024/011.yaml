    issue: 본문의 ‘그 이름을 욕되게 하고’가 논쟁적인 해석을 본문에 고정하면서, 각주는 반대로 ‘분명히 불렀다’를 대안으로 제시합니다.
    rationale: וַיִּקֹּב와 וַיְקַלֵּל의 두 동사를 보존해야 하며, 원문의 어휘적 불확실성을 한 해석으로 과도하게 확정하지 않는 편이 안전합니다. 영어 POB 감사 기록도 ‘pronounced’와 ‘blasphemed’ 양쪽 가능성을 명시합니다.
  - severity: low
    issue: ‘단 지파 디브리의 딸 슬로밋’은 단 지파 소속 수식의 범위가 한국어에서 다소 불분명합니다.
    rationale: 히브리어의 지파 소속 표지는 슬로밋의 신원 진술에 속합니다. ‘단 지파 사람인 디브리의 딸 슬로밋’으로 하면 의미 관계가 더 명료합니다.
