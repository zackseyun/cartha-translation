id: LEV.24.11
reference: Leviticus 24:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
  footnotes:
  - marker: a
    text: Or, 'blasphemed the Name.' The Hebrew verb can be understood as 'pronounced distinctly' or, in this context, as part of the act of blasphemy.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 여인의 아들이 그 이름을 욕되게 하고 저주하였으며[a], 사람들이 그를 모세에게 데려왔습니다. 그의 어머니 이름은 단 지파 디브리의 딸 슬로밋이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 이름을 분명히 불렀다.’ 히브리어 동사는 문맥에 따라 ‘뚫다/지목하다’ 또는 ‘분명히 말하다’로 이해될 수 있으며, 이곳에서는 모독 행위의 일부로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב אֶת הַשֵּׁם
  english_pob_choice: pronounced the Name
  chosen_korean: 그 이름을 욕되게 하고
  alternatives_korean:
  - 그 이름을 발음하고
  - 그 이름을 명시하고
  lexicon: HALOT
  rationale: נקב은 문자적으로 ‘뚫다/찍다’의 뜻에서 ‘분명히 말하다’까지 가지며, 여기서는 קדמת의 ‘이름’ 뒤에 별도의 ‘저주하다’가 이어지므로 단순 발화보다 그 이름을 모독하는 행위를 드러내는 표현이 적절합니다.
- source_word: וַיְקַלֵּל
  english_pob_choice: and cursed
  chosen_korean: 저주하였으며
  alternatives_korean:
  - 저주하였고
  - 저주하고
  lexicon: HALOT
  rationale: קלל의 기본 의미를 직접 살려 ‘저주하다’로 옮겼습니다. 앞절의 행위와 분리해, 이름을 욕되게 한 것과 저주한 것을 둘 다 보이게 했습니다.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  english_pob_choice: and they brought him to Moses
  chosen_korean: 사람들이 그를 모세에게 데려왔습니다
  alternatives_korean:
  - 그를 모세에게 데려왔습니다
  - 그를 모세 앞으로 데려왔습니다
  lexicon: HALOT
  rationale: 히브리어의 주어는 불특정 복수이므로, 한국어에서는 자연스러운 ‘사람들이’로 옮겨 문장의 주체가 집단임을 살렸습니다.
- source_word: שְׁלֹמִית בַּת דִּבְרִי לְמַטֵּה דָן
  english_pob_choice: Shelomith daughter of Dibri, of the tribe of Dan
  chosen_korean: 단 지파 디브리의 딸 슬로밋
  alternatives_korean:
  - 디브리의 딸 슬로밋, 단 지파 사람
  - 단 지파에 속한 디브리의 딸 슬로밋
  lexicon: HALOT
  rationale: 고유명사는 음역하고, לְמַטֵּה דָן은 혈통·소속을 나타내는 관용구로서 ‘단 지파’로 간명하게 옮겼습니다.
theological_decisions:
- issue: וַיִּקֹּב과 וַיְקַלֵּל의 관계
  chosen_reading: ‘그 이름을 욕되게 하고 저주하였다’로 두 동작을 구분해, 이름을 분명히 언급한 행위와 저주의 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘그 이름을 욕되게 하였다’로 합쳐 번역
  - ‘그 이름을 명시하고 저주하였다’로 중립화
  rationale: 본문은 두 동사를 나란히 두어 법적·신학적 중대성을 누적합니다. 둘을 하나로 합치면 긴장이 약해지므로, 의미 관계를 유지하되 한국어에서는 자연스럽게 표현했습니다.
  doctrine_reference: 'translation philosophy §3 (보존: 신학적 긴장 유지)'
