theological_decisions:
- issue: אֱלֹהָיו를 야훼로 특정할지 여부
  chosen_reading: 본문의 표면 의미를 따라 ‘자기 하나님’으로 두고, 특정 호칭으로 확장하지 않았습니다.
  alternative_readings:
  - 자기 야훼
  - 주님
  rationale: 이 절 자체는 일반적 표현을 사용하므로, 다음 절의 더 구체적인 신성모독 규정과 구분을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: source distinction between generic divine reference and specific divine-name offense
- issue: ‘죄를 지다’의 관용구 유지
  chosen_reading: ‘그는 자기 죄를 져야 합니다’로 책임·유죄 부담의 의미를 유지했습니다.
  alternative_readings:
  - 그는 자기 죄의 형벌을 받아야 합니다
  - 그는 자기 죄를 담당해야 합니다
  rationale: 히브리어 관용구를 해설적으로 풀기보다 본문 안에서 보존하고, 독자가 책임 부담의 뜻을 읽을 수 있게 했습니다.
  doctrine_reference: Hebrew idiom preservation
