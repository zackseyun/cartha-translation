base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel.' The phrase refers to the people of Israel collectively.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''whoever.'' Hebrew repeats ''man'' for distributive emphasis: ''man, man.'''
    reason: lexical_alternative
  - marker: c
    text: '''Bear his sin'' is a Hebrew idiom meaning to bear guilt or liability for the offense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 이스라엘 자손에게 말하여 이르라. ‘어떤 사람이 자기 하나님을 저주하면, 그는 자기 죄를 져야 합니다.’[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 자손들’이라고 말합니다. 이 표현은 이스라엘 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람, 사람’으로 반복하여 분배적 강조를 둡니다. ‘어떤 사람이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘죄를 지다’는 히브리어 관용구로, 죄책이나 책임을 짊어진다는 뜻입니다.
    reason: lexical_alternative
