  source_fidelity: ‘짐승의 생명을 죽이면’은 히브리어의 ‘동물의 생명을 치다/죽이다’를 지나치게 명사구로 옮겨 한국어에서 부자연스럽습니다. 또한 ‘그 짐승으로 갚아야 합니다’는 ‘그 짐승을 보상 수단으로 내놓는다’는 뜻으로 읽힐 수 있어, 동물에 관한 배상이라는 원문의 의미를 더 분명히 해야 합니다.
  naturalness: 현대 표준어 합쇼체 법규 문맥에서는 ‘동물을 죽이면’과 ‘그 동물에 대하여 배상해야 합니다’가 자연스럽고 명료합니다. 끝의 대응 공식은 압축된 법적 표현으로 유지할 수 있습니다.
  terminology: בְּהֵמָה에는 현대적이고 중립적인 ‘동물’을 사용합니다. שׁלם의 피엘은 ‘배상하다’로 옮겨 법적 보상의 의미를 드러냅니다. נֶפֶשׁ תַּחַת נָפֶשׁ은 ‘생명은 생명으로’로 보존하고, 주석에서 ‘생명 대신 생명’이라는 히브리어의 직역적 관계와 이 문맥의 상응 보상 의미를 설명합니다.
