  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
  footnotes:
  - marker: a
    text: 'Hebrew: ''life for life.'' In this context of restitution for an animal, the phrase expresses equivalent compensation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 짐승의 생명을 죽이면 그 짐승으로 갚아야 합니다. 생명은 생명으로[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘생명은 생명으로’입니다. 이 문맥에서는 동물을 죽인 경우의 상응 보상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַכֵּה
  english_pob_choice: And whoever strikes down
  chosen_korean: 그리고 누구든지 … 죽이면
  alternatives_korean:
  - 그리고 누구든지 … 치면
  - 그리고 누구든지 … 때리면
  lexicon: HALOT
  rationale: 히필 분사로 된 일반 법규의 주어를 한국어에서는 ‘누구든지’로 풀어 자연스럽게 법조문 문체를 살렸습니다. 결과가 치명적 행위이므로 ‘죽이면’이 본문의 의도를 가장 직접적으로 드러냅니다.
- source_word: בְּהֵמָה
  english_pob_choice: an animal
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 가축
  lexicon: HALOT
  rationale: 이 문맥의 בְּהֵמָה는 일반 동물이라기보다 법규에서 다루는 피조물을 가리키므로, 한국어에서는 간결한 ‘짐승’이 원문 범위를 잘 반영합니다. ‘가축’은 지나치게 좁고, ‘동물’은 법조문의 긴장감이 약합니다.
- source_word: יְשַׁלְּמֶנָּה
  english_pob_choice: shall make restitution for it
  chosen_korean: 갚아야 합니다
  alternatives_korean:
  - 보상해야 합니다
  - 배상해야 합니다
  lexicon: HALOT
  rationale: שׁלם의 피엘은 단순 상환보다 보상·배상의 뉘앙스를 가지므로, 법적 보응을 담아 ‘갚다’로 옮겼습니다. 한국어 법문맥에서 자연스럽고, 뒤의 대응 공식과도 잘 맞습니다.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  english_pob_choice: life for life
  chosen_korean: 생명은 생명으로
  alternatives_korean:
  - 생명은 생명으로 갚아야 합니다
  - 생명 대 생명
  lexicon: HALOT
  rationale: 핵심 공식은 대응적 보상을 가리키므로, 문장 말미에서는 짧고 대구적인 ‘생명은 생명으로’가 원문의 압축성과 평행구조를 살립니다. POB의 주석처럼, 여기서는 동물 손상에 대한 상응 보상의 표현으로 이해됩니다.
theological_decisions:
- issue: 동물 살해에 대한 ‘생명 for 생명’ 공식의 의미
  chosen_reading: 본문은 동물을 죽인 경우 동등한 보상을 요구하며, 구체적 보상 방식은 명시하지 않습니다.
  alternative_readings:
  - 다른 동물을 실제로 내어주는 뜻으로 더 문자적으로 읽을 수 있습니다.
  - 더 넓은 탈리오 법 공식의 한 표현으로서 금전적·물질적 배상을 가리킬 수 있습니다.
  rationale: 앞절의 ‘갚아야 합니다’가 해석을 이끌며, 본문 자체는 보상의 정확한 형태를 규정하지 않습니다. 따라서 히브리어 공식은 유지하되 지나친 세부화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
