id: LEV.24.21
reference: Leviticus 24:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
  footnotes:
  - marker: a
    text: Or, 'whoever strikes down a human being shall be put to death.' The Hebrew אָדָם can denote a human person more broadly, though 'man' is retained here to match the source's masculine singular legal formulation.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 누구든지 짐승을 쳐서 죽이면 그 짐승에 대하여 배상해야 합니다. 그러나 누구든지 사람을 쳐서 죽이면 죽임을 당합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  english_pob_choice: whoever strikes down
  chosen_korean: 누구든지 … 쳐서 죽이면
  alternatives_korean:
  - 누구든지 … 치면
  - 누구든지 … 죽이면
  lexicon: HALOT
  rationale: פעל 분사로 된 법조문 표현을 한국어의 조건절로 옮기되, 결과가 치명적임을 드러내기 위해 ‘쳐서 죽이다’를 사용했습니다.
- source_word: בְהֵמָה
  english_pob_choice: animal
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 가축
  lexicon: HALOT
  rationale: 히브리어는 가축보다 넓은 일반 명사이므로, 법조문에서 대상의 폭을 살릴 수 있는 ‘짐승’을 택했습니다.
- source_word: יְשַׁלְּמֶנָּה
  english_pob_choice: shall make restitution for it
  chosen_korean: 그것을 배상해야
  alternatives_korean:
  - 그것에 대해 갚아야
  - 그것을 보상해야
  lexicon: HALOT
  rationale: שלם의 피엘은 법적 보상·배상을 뜻하므로, 현대 한국어 법어감에 맞는 ‘배상하다’로 옮겼습니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 반드시 죽임을 당합니다
  alternatives_korean:
  - 죽임을 당해야 합니다
  - 사형에 처해집니다
  lexicon: HALOT
  rationale: 호팔의 수동 법률형을 반영해 처형 주체를 드러내지 않고, 판결적 필연성을 ‘반드시’로 살렸습니다.
theological_decisions:
- issue: אָדָם의 번역 범위
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 남자
  rationale: 여기서는 짐승과의 대조 속에서 개별 인간을 가리키므로, 성별이 과도하게 두드러지지 않는 ‘사람’이 문맥상 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; Contested terms table for אָדָם'
