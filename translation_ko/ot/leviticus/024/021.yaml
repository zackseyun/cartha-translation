  to: 그리고 누구든지 짐승을 쳐서 죽이면 그 짐승에 대하여 배상해야 합니다. 그러나 누구든지 사람을 쳐서 죽이면 죽임을 당합니다.
  rationale: 원문의 두 절을 한국어의 독립된 법조문 문장으로 분명히 나누고, 법적 수동형을 유지했습니다. 원문에 없는 강조어를 제거했으며, 한국어에서 기능하지 않는 반복 각주를 삭제했습니다.
  reviewer_model: gpt-5.6-terra
