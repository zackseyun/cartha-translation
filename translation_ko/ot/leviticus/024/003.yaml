  source_fidelity: 개정안은 장소 관계를 '만남의 장막 안, 증언의 휘장 바깥'으로 명확히 하여 מִחוּץ לְפָרֹכֶת הָעֵדֻת בְּאֹהֶל מוֹעֵד를 충실히 반영합니다. '저녁부터 아침까지', '야훼 앞에서', '계속하여', '너희 대대로 영원한 규례'는 각각 시간 범위, 제의적 임재, תָּמִיד의 지속적·정기적 성격, חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם을 보존합니다. 목적어는 앞 절의 등불을 가리키지만, 본문의 대명사적 모호성을 보존하여 '그것을'로 옮겼습니다.
  naturalness: 초안의 '차려 놓다'는 현대 한국어에서 식사 등을 준비한다는 뜻으로도 강하게 들려 제의적 등불의 정돈 행위를 정확히 전달하지 못합니다. '정돈해야 합니다'가 자연스럽고 문맥에 맞습니다. 또한 요청된 현대 합쇼체에 맞게 종결을 '-합니다'로 통일했습니다.
  terminology: '''야훼''는 제시된 영어 POB 방침의 Yahweh를 따릅니다. ''증언의 휘장''은 הָעֵדֻת의 전통적이고 과잉 해석하지 않는 번역이며, ''만남의 장막''은 ''회막''의 뜻을 현대어로 드러냅니다. ''영원한 규례''는 חֻקַּת עוֹלָם의 지속성을 보존합니다.'
