  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘이스라엘의 아들들’이므로, 성별 표지를 지우지 않으면서도 한국어에서 가장 자연스러운 성경적 표현으로 옮겼습니다.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  english_pob_choice: pure oil of beaten olives
  chosen_korean: 순수한 감람을 짠 기름
  alternatives_korean:
  - 순수한 감람유
  - 맑고 찧은 감람기름
  lexicon: HALOT
  rationale: 감람에서 난 기름이라는 재료와 ‘짠/찧은’이라는 가공 방식을 함께 드러내기 위해 기름의 출처와 제작 방식을 분리해 표현했습니다.
- source_word: לַמָּאוֹר
  english_pob_choice: for the light
  chosen_korean: 등불을 위해
  alternatives_korean:
  - 빛을 위해
  - 조명을 위해
  lexicon: HALOT
  rationale: מאור를 추상적 ‘빛’으로만 두기보다 성막의 실제 등불 기능을 드러내는 쪽이 문맥상 더 분명하므로 ‘등불을 위해’로 옮겼습니다.
- source_word: לְהַעֲלֹת נֵר תָּמִיד
  english_pob_choice: to keep a lamp burning continually
  chosen_korean: 계속해서 등불이 타게 하십시오
  alternatives_korean:
  - 계속 등불을 켜게 하십시오
  - 늘 등불을 타오르게 하십시오
  lexicon: HALOT
  rationale: 히브리어 히필의 ‘올리다/피우다’ 관용구를 한국어 자연 표현으로 풀어, 단순 점등보다 지속적 유지의 의미를 살렸습니다.
theological_decisions:
- issue: 성막 등불 규정의 지속성 표현
  chosen_reading: ‘계속해서 등불이 타게 하십시오’로 반복적·지속적 제의 행위를 강조했습니다.
  alternative_readings:
  - ‘계속 등불을 켜게 하십시오’
  - ‘늘 등불을 타오르게 하십시오’
  rationale: תָּמִיד은 일회적 행위가 아니라 지속적 규례를 가리키므로, 한국어에서도 반복성과 유지성을 드러내는 표현을 택했습니다.
  doctrine_reference: Leviticus 24:2의 제의 규례 문맥
