source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew reads 'the sons of Israel,' a conventional covenantal designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'olive oil, pure, beaten.' The Hebrew specifies oil from olives that is pure and produced by beating/crushing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손에게 명령하여, 그들이 순수한 감람을 짠 기름을 당신에게 가져오게 하여 등불을 위해, 계속해서 등불이 타게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 자손’이라고 하며, 전통적 언약 호칭을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: כָּתִית는 단순한 ‘감람유’가 아니라, 감람을 쳐서/찧어서 얻은 기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  english_pob_choice: Command
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: 히브리어 צוה의 직접적인 명령형을 살려 권위 있는 지시를 간명하게 나타냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
