id: LEV.24.20
reference: Leviticus 24:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
  footnotes:
  - marker: a
    text: Or 'as he causes a blemish/disfigurement in a person, so it shall be done to him.' The Hebrew uses 'give' with 'blemish/injury,' an idiom rendered here as 'inflicts an injury.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in a man.' Here 'man' functions as a representative singular for a human being in case law.
    reason: cultural_note
translation:
  language: ko
  text: 골절은 골절로, 눈은 눈으로, 이는 이로 갚아야 합니다. 사람이 상처를 입히는 만큼, 그에게도 그렇게 상처가 가해져야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주다’와 ‘흠/상처’의 결합을 사용합니다. 여기서는 법률 문맥에 맞게 ‘상처를 입히다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘한 사람 안에/에게’입니다. 여기서 ‘사람’은 경우법에서 인간 일반을 대표하는 단수로 기능합니다.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  english_pob_choice: fracture
  chosen_korean: 골절
  alternatives_korean:
  - 부러짐
  - 파열
  lexicon: HALOT
  rationale: 법률 문맥의 신체 손상 목록에서 שֶׁבֶר는 단순한 ‘깨짐’보다 구체적인 골절을 뜻하므로, 현대 한국어에서 의미가 분명한 ‘골절’로 옮겼습니다.
- source_word: תַּחַת
  english_pob_choice: for
  chosen_korean: —으로
  alternatives_korean:
  - 대신에
  - ~에 대하여
  lexicon: HALOT
  rationale: תגלת식 상응 보복 공식에서 תַּחַת은 ‘~에 대하여/대신’의 대응 관계를 나타내므로, 반복 구조를 살려 ‘골절은 골절로, 눈은 눈으로, 이는 이로’로 옮겼습니다.
- source_word: מוּם
  english_pob_choice: injury
  chosen_korean: 상처
  alternatives_korean:
  - 흠
  - 결함
  - 손상
  lexicon: HALOT
  rationale: 히브리어 מוּם은 본문에서 사람이 사람에게 가하는 신체적 손상/훼손을 가리키므로, 한국어에서 법률적·신체적 의미가 자연스러운 ‘상처’로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  lexicon: HALOT
  rationale: 여기서 אָדָם은 남성 개념이 아니라 경우법의 대표적 인간을 가리키므로, POB의 영어 선택과 같이 중립적인 대표어 ‘사람’으로 번역했습니다.
theological_decisions:
- issue: 보복법 공식의 직역성 유지
  chosen_reading: 추상화하지 않고 ‘골절은 골절로, 눈은 눈으로, 이는 이로’라는 구체적 상응 공식을 그대로 살렸습니다.
  alternative_readings:
  - 손해에 상응하는 보상
  - 상처에 대한 동등한 배상
  rationale: 히브리어 본문은 법적 원리를 추상 설명하지 않고 신체 손상 항목을 병렬로 제시하므로, 본문의 강한 수사와 법률적 엄격성을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: אָדָם의 성중립 처리
  chosen_reading: ‘사람’으로 번역해 대표적 인간 일반을 드러냈습니다.
  alternative_readings:
  - 남자
  - 인간
  rationale: 이 경우 אָדָם은 특정 성별이 아니라 일반 인간을 뜻하므로, 한국어에서 자연스럽고 오해가 적은 ‘사람’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table; Translation philosophy §4'
