review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘갚아야 합니다’는 תַּחַת의 상응 관계를 대체로 전달하지만, 금전적·일반적 보상의 뉘앙스를 더할 수 있습니다. 또한 ‘사람이 상처를 입히는’은 히브리어의 대상(‘사람에게/사람 안에’)을 명시하지 않습니다. ‘사람에게 손상을 입힌 대로, 그에게도 같은 손상을 입혀야 합니다’는 מוּם의 신체 손상 의미와 수동적 상응 결과를 더 충실히 나타냅니다.
  naturalness: ‘골절에는 골절, 눈에는 눈, 이에는 이입니다’는 한국어에서 해당 법률 공식을 간결하고 자연스럽게 재현합니다. 이어지는 문장에서 대상과 결과를 명시하여 지시 관계도 분명해집니다.
  terminology: ‘골절’은 שֶׁבֶר에 적절합니다. מוּם은 여기서 단순한 피부의 ‘상처’보다 폭넓은 신체적 훼손을 가리킬 수 있으므로 ‘손상’이 더 안전합니다. אָדָם은 대표적 단수이므로 ‘사람’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘갚아야 합니다’가 상응하는 신체 손상의 부과를 보상·변제의 의미로 넓힐 수 있습니다.
    rationale: 본문은 ‘골절/눈/이’의 상응 공식과, 가한 손상이 그에게도 가해진다는 수동 구문을 사용합니다. ‘같은 손상을 입혀야 합니다’가 이 대응을 더 직접적으로 보존합니다.
  - severity: medium
