    rationale: בָּאָדָם은 손상이 사람에게 가해짐을 표시합니다. 한국어 본문에도 ‘사람에게’를 넣어야 원문의 논항 구조가 보존됩니다.
  - severity: low
    issue: 각주 표지가 관련 어구에 붙어 있지 않고, 각주 b의 ‘한 사람’은 히브리어에 없는 부정관사를 암시합니다.
    rationale: a는 מוּם/‘손상’에, b는 אָדָם/‘사람’에 직접 연결하는 것이 적절합니다. 각주도 ‘사람에게/사람 안에’라는 문자적 표현으로 정정합니다.
