revisions:
- from: 골절은 골절로, 눈은 눈으로, 이는 이로 갚아야 합니다. 사람이 상처를 입히는 만큼, 그에게도 그렇게 상처가 가해져야 합니다.[a][b]
  to: 골절에는 골절, 눈에는 눈, 이에는 이입니다. 사람이 사람에게 손상을 입힌[a] 대로, 그에게도 같은 손상을 입혀야 합니다.[b]
  rationale: 상응 보복의 구체적 공식은 유지하되, ‘갚다’가 낳을 수 있는 보상·변제의 뉘앙스를 피했습니다. 또한 원문의 ‘사람에게’라는 손상 대상을 명시하고, מוּם을 포괄적인 신체적 ‘손상’으로 옮겼습니다. 각주 표지도 해당 어휘에 맞추어 재배치하고 내용을 정정했습니다.
