  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or, 'the blasphemer.' The Hebrew participle literally means 'the one who cursed,' referring to the man who cursed the divine Name in the preceding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 이스라엘 자손에게 말했습니다. 그러자 그들은 저주한 사람[a]을 진 밖으로 데리고 나가 돌로 쳤습니다. 이스라엘 자손은 야훼께서 모세에게 명령하신 대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신성을 모독한 사람’. 히브리어 분사는 문자적으로 ‘저주한 사람’을 뜻하며, 앞 문맥에서 하나님의 이름을 저주한 사람을 가리킵니다.
    reason: lexical_alternative
