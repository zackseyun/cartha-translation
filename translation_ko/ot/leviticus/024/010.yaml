id: LEV.24.10
reference: Leviticus 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: Now the son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
  footnotes:
  - marker: a
    text: Or 'among the Israelites.' The Hebrew reads 'among the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'quarreled.' The verb can denote a dispute or a fight.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 여인의 아들, 곧 이집트 사람의 아들이 이스라엘 자손 가운데로 나갔습니다. 그 이스라엘 여인의 아들과 한 이스라엘 사람이 진영에서 싸웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  english_pob_choice: the son of an Israelite woman
  chosen_korean: 이스라엘 여자[a]의 아들
  alternatives_korean:
  - 이스라엘 여인의 아들
  - 이스라엘 사람의 어머니에게서 난 아들
  lexicon: HALOT
  rationale: 히브리어는 모계 정체성을 먼저 드러내므로 이를 그대로 살렸습니다. ‘여자’보다 ‘여인’이 더 자연스러울 수 있지만, 본문이 특정 신분 표지로 기능하므로 직설적인 ‘이스라엘 여자’를 택했습니다.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  english_pob_choice: and he was the son of an Egyptian man
  chosen_korean: 그는 이집트 사람의 아들이었습니다
  alternatives_korean:
  - 그는 이집트 남자의 아들이었습니다
  - 그의 아버지는 이집트 사람이었습니다
  lexicon: HALOT
  rationale: 히브리어는 부친의 출신을 덧붙여 설명하므로, 문장 구조를 유지하면서도 자연스러운 한국어로 옮겼습니다. ‘이집트 사람’은 민족/출신 표지를 드러내는 가장 무난한 표현입니다.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손[b] 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘 자손들 사이에서
  lexicon: HALOT
  rationale: 프로젝트 기본어인 ‘이스라엘 자손’을 유지해 원문의 관용적 언약 표현을 보존했습니다. ‘가운데서’는 בְּתוֹךְ의 공간적·사회적 의미를 살립니다.
- source_word: וַיִּנָּצוּ
  english_pob_choice: fought
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 다투었습니다
  - 언쟁했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 말다툼보다 실제 충돌까지 포괄할 수 있어, 문맥상 가장 직접적인 ‘싸웠습니다’를 선택했습니다. 이는 영어 POB의 ‘fought’와도 대응합니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성중립화 여부
  chosen_reading: ‘이스라엘 자손’으로 직역해 원문의 남성형 집합표현을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 이 구절에서 해당 표현은 단순한 중립 명칭이 아니라 히브리어의 고정된 언약 공동체 호칭입니다. 프로젝트 기본 방침에 따라 의미를 완화하지 않고 원문 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
