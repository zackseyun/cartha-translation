  rationale: The revision replaces the unnatural abstract-object construction with a natural Korean lethal-blow expression. It retains the source’s concrete ‘strike’ verb, makes the fatal sense required by the context explicit, preserves the generic human victim, and retains the emphatic passive penalty formula. Footnote anchors are placed directly after the revised lethal-action clause to which both notes pertain.
