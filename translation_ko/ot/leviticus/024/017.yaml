id: LEV.24.17
reference: Leviticus 24:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
  footnotes:
  - marker: a
    text: Hebrew 'any life of a human/man.' The phrase refers to a human person or human life, not specifically to an immaterial 'soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'kills any person.' The Hebrew verb is literally 'strikes,' but here it refers to a lethal blow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람이 어떤 사람의 생명을 치면, 그는 반드시 죽임을 당해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어떤 사람의 생명/목숨’이며, 여기서는 비물질적 ‘영혼’이 아니라 인간의 생명을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘치다’이지만, 여기서는 치명적 타격을 가해 죽이는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  english_pob_choice: And if a man
  chosen_korean: 그리고 사람이
  alternatives_korean:
  - 그리고 한 남자가
  - 만일 어떤 사람이
  lexicon: HALOT
  rationale: 법률 문맥의 אִישׁ은 남성형이지만, 한국어에서는 조항 연결을 자연스럽게 살리면서도 대표적 인물을 가리키는 말로 옮길 수 있어 ‘사람’으로 두었습니다. 앞의 וְ는 문맥 연결을 살려 ‘그리고’로 반영했습니다.
- source_word: יַכֶּה
  english_pob_choice: strikes down
  chosen_korean: 치면
  alternatives_korean:
  - 내리치면
  - 때려 죽이면
  - 공격하여 죽이면
  lexicon: HALOT
  rationale: 동사 נכה는 문자적으로 ‘치다/치다’이지만, 이 절에서는 치명적 타격을 가하는 뜻이므로 ‘치면’으로 두고 뒤의 사형 선고와 함께 의미를 분명히 했습니다.
- source_word: כָּל נֶפֶשׁ אָדָם
  english_pob_choice: any human life
  chosen_korean: 어떤 사람의 생명을
  alternatives_korean:
  - 어떤 사람을
  - 어떤 인간의 생명을
  - 어떤 사람의 목숨을
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 추상적 ‘영혼’이 아니라 사람의 생명/목숨을 가리키므로, 오해를 피하면서도 원문의 중량감을 살려 ‘생명’을 택했습니다. אָדָם은 이 문맥에서 보편적 인간을 뜻하므로 ‘사람’으로 옮겼습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: he shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 사형을 받아야 합니다
  - 틀림없이 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 구문을 한국어의 ‘반드시’로 살리고, 법률 공식의 수동 표현을 유지해 ‘죽임을 당해야 합니다’로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  - 사람
  rationale: 본문의 נֶפֶשׁ은 인간 내부의 비물질적 실체가 아니라 살해 대상이 되는 사람의 생명/목숨을 가리키므로, 신학적으로 오해를 낳기 쉬운 ‘영혼’은 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — נֶפֶשׁ nephesh'
- issue: 아담/이쉬의 인간성 표지
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 인간
  - 누구든지
  rationale: 문맥상 אִישׁ과 אָדָם이 결합해 법적 책임 주체와 피해자의 인간성을 함께 드러내므로, 한국어에서는 대표적 인물과 보편적 인간성을 함께 담는 ‘사람’ 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #4'
