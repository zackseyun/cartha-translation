id: LEV.24.19
reference: Leviticus 24:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
  footnotes:
  - marker: a
    text: Literally, 'gives a blemish/defect to his fellow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'neighbor' for 'fellow.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기 이웃에게[b] 상해를 입히면[a], 그가 한 대로 그에게도 그렇게 행해져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이웃에게 흠이나 결함을 주면’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 עָמִית는 ‘이웃’ 또는 ‘동료’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  english_pob_choice: And if a man
  chosen_korean: 사람이
  alternatives_korean:
  - 만일 어떤 사람이
  - 어떤 남자가
  lexicon: HALOT
  rationale: 히브리어 법문맥의 일반적인 단수 남성 표현이지만, 한국어에서는 성별을 굳이 드러내지 않는 '사람이'가 자연스럽고 법률 문체에도 잘 맞습니다. 조건절은 뒤의 문맥으로 충분히 보완됩니다.
- source_word: יִתֵּן מוּם
  english_pob_choice: inflicts an injury
  chosen_korean: 상해를 입히면
  alternatives_korean:
  - 흠을 주면
  - 결함을 주면
  - 상처를 내면
  lexicon: HALOT
  rationale: מוּם의 직역은 '흠/결함'이지만, 이 구절은 사람에게 가해진 손상에 관한 보복법 문맥이므로 한국어에서는 법적·신체적 의미가 분명한 '상해를 입히다'가 가장 적절합니다.
- source_word: בַּעֲמִיתוֹ
  english_pob_choice: his fellow
  chosen_korean: 자기의 이웃에게
  alternatives_korean:
  - 자기의 동료에게
  - 자기의 동포에게
  - 자기의 동료 시민에게
  lexicon: HALOT
  rationale: עָמִית는 공동체 안의 상대, 동료, 이웃을 가리키므로 POB의 'fellow'를 따라 관계성을 살리되, 한국어에서는 법문맥에서 자연스러운 '이웃'을 선택했습니다.
- source_word: כַּאֲשֶׁר עָשָׂה כֵּן יֵעָשֶׂה לּוֹ
  english_pob_choice: just as he has done, so it shall be done to him
  chosen_korean: 그가 한 것과 같이 그에게도 그대로 해야 합니다
  alternatives_korean:
  - 그가 행한 대로 그에게도 해야 합니다
  - 그가 한 만큼 그에게도 하게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 대응·상응 구조를 한국어에서 자연스럽게 살리기 위해 '그가 한 것과 같이 ... 그대로 해야 합니다'로 옮겼습니다. 이는 법적 동형보복의 원리를 보이되, 개인적 복수로 좁히지 않습니다.
theological_decisions:
- issue: 동형보복 법문의 해석 범위
  chosen_reading: 이 구절을 개인적 복수가 아니라 공동체적·사법적 상응 원리로 번역했습니다.
  alternative_readings:
  - 개인의 보복 행위로 들리게 하는 번역
  - 더 직역적인 '흠을 주면' 표현
  rationale: 히브리어 본문은 보복을 사적 감정이 아니라 법적 대응의 원리로 제시합니다. 따라서 한국어도 판결·응보의 문맥을 유지하여 오해를 줄였습니다.
  doctrine_reference: 출 21:23-25와 레 24:20의 보복 규례 맥락
