  to: 안식일마다 그는 야훼 앞에 그것을 늘 진설해야 합니다. 이것은 이스라엘 자손에게서 나오는 영원한 언약입니다.
  rationale: 반복된 ‘안식일에’의 분배적 용법을 ‘안식일마다’로 유지하고, 3인칭 단수 동사와 מֵאֵת의 출처 관계를 회복했습니다. ‘그것’은 앞 절의 떡 진설을 집합적으로 가리키는 원문의 단수 접미사를 보존합니다. 언약 표현에는 ‘의무’나 ‘표지’ 같은 해석적 보충을 넣지 않았습니다.
