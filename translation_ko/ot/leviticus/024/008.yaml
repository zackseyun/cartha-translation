review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 명령형 ‘차려 놓으라’는 히브리어 3인칭 남성 단수 미완료형 יַעַרְכֶנּוּ(‘그가 그것을 진설해야 합니다’)를 바꾸며, ‘이스라엘 자손에게 영원한 언약’은 מֵאֵת(‘이스라엘 자손에게서/로부터’)의 출처 관계를 ‘~에게’로 변경합니다.
  naturalness: ‘진설해야 합니다’는 성소의 떡을 정해 놓는 문맥에 자연스럽고 현대 표준어의 합쇼체에 맞습니다. ‘늘’은 매 안식일이라는 분배적 표현과 תָּמִיד의 정규적 지속성을 함께 간결하게 나타냅니다.
  terminology: יְהוָה는 프로젝트 결정에 따라 ‘야훼’로 유지했습니다. עָרַךְ의 제의적 용례에는 ‘진설하다’가 적절합니다. בְּרִית עוֹלָם은 해석을 덧붙이지 않고 ‘영원한 언약’으로 옮겼습니다.
  issues:
  - severity: high
    issue: 동사 인칭·법의 변경
    rationale: ‘차려 놓으라’는 독자에게 직접 명하는 2인칭 명령형이지만, 원문은 ‘그가 진설할/해야 할 것이다’라는 3인칭 단수입니다.
  - severity: medium
    issue: מֵאֵת의 관계를 ‘~에게’로 번역
    rationale: ‘이스라엘 자손에게’는 수혜자 또는 대상처럼 들립니다. 원문은 이스라엘 자손으로부터의 출처를 나타냅니다.
  - severity: low
    issue: ‘차려 놓다’의 제의 문맥상 비정확성
    rationale: 문맥의 떡 진열을 가리키므로 ‘진설하다’가 더 정확하고 격식 있는 표현입니다.
  revised_text: 안식일마다 그는 야훼 앞에 그것을 늘 진설해야 합니다. 이것은 이스라엘 자손에게서 나오는 영원한 언약입니다.
