  naturalness: 현행 문장은 ‘그들에게 분명히 밝히게 하였습니다’에서 누가 누구에게 밝히게 했는지가 불분명하여 한국어 문장 구조가 어색합니다. 목적절을 앞세워 ‘…밝혀 주기 위하여 그를 구금해 두었습니다’로 하면 자연스럽고 현대 표준어 합쇼체에 맞습니다.
  terminology: ‘야훼’는 יְהוָה의 고유명사 표기로 일관되고 적절합니다. ‘말씀에 따라’는 עַל־פִּי의 권위 있는 발화에 따른다는 뜻을 자연스럽게 반영합니다. ‘구금’은 ‘감금’보다 불필요하게 가혹한 뉘앙스를 피하면서 מִשְׁמָר의 구금 상태를 잘 나타냅니다.
