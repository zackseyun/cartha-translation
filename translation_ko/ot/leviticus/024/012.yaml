  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'to clarify for them' or 'to declare distinctly to them.' The Hebrew verb can denote making a matter explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 감금해 두고, 야훼의 말씀에 따라 그들에게 분명히 밝히게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 분명히 밝히게 하다’, ‘그들에게 분명하게 진술하게 하다’로도 옮길 수 있습니다. 히브리어 동사는 어떤 사안을 명확히 드러내는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  english_pob_choice: So they put him
  chosen_korean: 그들은 그를 감금해 두고
  alternatives_korean:
  - 그들은 그를 두었습니다
  - 그들은 그를 가두었습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘놓다’가 아니라 구금 상태에 두는 의미이므로, 자연스러운 현대 한국어로 ‘감금해 두고’가 법적·서사적 뉘앙스를 가장 잘 살립니다.
- source_word: בַּמִּשְׁמָר
  english_pob_choice: in custody
  chosen_korean: 감금해 두고
  alternatives_korean:
  - 구금해 두고
  - 감시 아래
  lexicon: HALOT
  rationale: מִשְׁמָר는 이 장면에서 단순한 경계가 아니라 보호 감금/구금의 상태를 가리키므로, ‘구금’ 계열 표현을 선택했습니다.
- source_word: לִפְרֹשׁ
  english_pob_choice: to clarify for them
  chosen_korean: 그들에게 분명히 밝히게 하였습니다
  alternatives_korean:
  - 그들에게 명확히 설명하게 하였습니다
  - 그들에게 분명하게 해석하게 하였습니다
  lexicon: HALOT
  rationale: פרשׁ는 ‘풀이하다’보다 ‘분명히 밝히다, 명시하다’에 가깝고, 본문은 판결을 선명하게 제시하는 법적 맥락이므로 그 의미를 살렸습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀에 따라
  alternatives_korean:
  - 야훼의 명에 따라
  - 야훼의 말씀대로
  lexicon: HALOT
  rationale: עַל־פִּי는 ‘~의 입에 따라’라는 관용구로 권위 있는 말씀/명령에 따른다는 뜻이므로, POB의 ‘word of Yahweh’를 따라 ‘야훼의 말씀에 따라’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 divine name rendering
  chosen_reading: יְהוָה를 야훼로 번역했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 히브리어 본문에 신명기가 아니라 고유한 언약 이름 יְהוָה를 직접 사용하므로, POB 원칙에 따라 칭호가 아닌 고유명사로 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
