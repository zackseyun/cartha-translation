revisions:
- from: 야훼의 이름을 모독하는 자는 반드시 죽임을 당해야 합니다. 온 회중이 그를 반드시 돌로 쳐야 합니다. 거류민이든 본토인이든—그가 이름을 모독하면—그는 죽임을 당해야 합니다.[a][b]
  to: 야훼의 이름을 모독하는[a] 자는 반드시 죽임을 당해야 합니다. 온 회중은 반드시 그를 돌로 쳐 죽여야 합니다. 거류민이든 본토인이든, 그가 그 이름을 모독하면[b] 죽임을 당해야 합니다.
  rationale: 돌로 치는 행위가 사형 집행임을 명시하고, 각주 표지를 해당 본문 어휘에 연결했습니다. 그 밖의 법률적 강조, 신명 표기, 거류민과 본토인의 병렬은 유지했습니다.
