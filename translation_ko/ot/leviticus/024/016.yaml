review_pass:
  verdict: revise
  source_fidelity: 히브리어의 법률적 강조(מֹות יוּמָת; רָגוֹם יִרְגְּמוּ), 공동체의 집행 책임, 거류민과 본토인의 동등한 적용을 대체로 충실히 옮겼습니다. 다만 רגם은 이 사형 집행 문맥에서 단순히 ‘돌로 치다’보다 ‘돌로 쳐 죽이다’로 밝혀야 의미가 충분히 전달됩니다. 논쟁적인 נקב의 의미는 ‘모독하다’를 본문에 두고 각주로 대안을 보존하는 방식이 적절합니다.
  naturalness: 합쇼체와 현대 한국어 문체는 자연스럽습니다. ‘온 회중은 반드시 그를 돌로 쳐 죽여야 합니다’가 법률적 문맥과 행위의 결과를 더 분명하고 자연스럽게 드러냅니다. 각주 표지는 해당 어휘 바로 뒤에 두는 것이 독자의 이해와 각주 연결에 적절합니다.
  terminology: ‘야훼’, ‘회중’, ‘거류민’, ‘본토인’, ‘모독하다’는 일관되고 적절합니다. 두 번째 ‘그 이름’은 앞서 언급된 야훼의 이름을 가리키는 경외적 대용 표현이라는 점을 각주로 유지합니다.
  issues:
  - severity: medium
    issue: ‘돌로 쳐야 합니다’는 רגם의 사형 집행 의미를 충분히 명시하지 못합니다.
    rationale: 이 절은 앞뒤의 ‘죽임을 당해야 한다’와 함께 공동체가 돌로 처형할 것을 규정합니다. 한국어 ‘돌로 치다’는 치명적 결과 없이 때리는 행위로도 이해될 수 있으므로 ‘돌로 쳐 죽이다’가 안전합니다.
  - severity: low
    issue: 각주 표지가 문단 끝에 함께 놓여 있어 각주 대상이 불명확합니다.
    rationale: a는 נקב의 의미, b는 두 번째 ‘이름’의 경외적 용법에 관한 각주이므로 각각 ‘모독하는’ 및 두 번째 ‘그 이름’에 직접 붙여야 합니다.
