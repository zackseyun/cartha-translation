id: LEV.24.16
reference: Leviticus 24:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
  footnotes:
  - marker: a
    text: Or 'pronounces the name of the LORD' or 'curses the name of the LORD.' The Hebrew verb can carry the sense of uttering distinctly or of reviling in this context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Name' in the second clause, functioning as a reverential substitute for the divine name.
    reason: cultural_note
translation:
  language: ko
  text: 야훼의 이름을 모독하는 자는 반드시 죽임을 당해야 합니다. 온 회중이 그를 반드시 돌로 쳐야 합니다. 거류민이든 본토인이든—그가 이름을 모독하면—그는 죽임을 당해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נקב는 이 문맥에서 ‘분명히 말하다’, ‘저주하다’, ‘모독하다’의 뜻 가능성을 함께 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 두 번째 절의 ‘이름’은 야훼의 이름을 직접 대신하는 경외적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב שֵׁם יְהוָה
  english_pob_choice: Whoever blasphemes the name of Yahweh
  chosen_korean: 야훼의 이름을 모독하는 자
  alternatives_korean:
  - 야훼의 이름을 부르는 자
  - 야훼의 이름을 저주하는 자
  - 야훼의 이름을 분명히 말하는 자
  lexicon: HALOT, BDB
  rationale: נקב는 문맥상 단순한 발음보다 하나님의 이름을 욕되게 하거나 모독하는 행위를 가리키므로, 법정 문맥의 무게를 살려 ‘모독하는 자’로 옮겼습니다.
- source_word: מֹות יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽어야 합니다
  - 죽임을 반드시 당해야 합니다
  lexicon: HALOT, BDB
  rationale: 히브리어의 강조형(부정사 절대형+동사)을 한국어 법령체의 강한 의무 표현으로 살려, 확정된 사형 선고의 뉘앙스를 전달했습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 공동체
  - 모든 회집
  lexicon: HALOT, BDB
  rationale: עֵדָה는 모인 언약 공동체를 가리키므로, 제의·법적 맥락을 유지하는 ‘회중’이 가장 자연스럽습니다.
- source_word: כַּגֵּר כָּאֶזְרָח
  english_pob_choice: The sojourner as well as the native-born
  chosen_korean: 거류민이든 본토인이든
  alternatives_korean:
  - 나그네든 본토인이든
  - 거주하는 외국인이든 본토인이든
  lexicon: HALOT, BDB
  rationale: גֵּר와 אֶזְרָח의 대조를 살리기 위해, 공동체 안에 거주하는 비토착민과 토착민의 대비가 드러나는 표현을 사용했습니다.
- source_word: בְּנָקְב/וֹ שֵׁם
  english_pob_choice: when he blasphemes the Name
  chosen_korean: 그가 이름을 모독하면
  alternatives_korean:
  - 그가 그 이름을 부르면
  - 그가 이름을 저주하면
  lexicon: HALOT, BDB
  rationale: 두 번째 절의 ‘이름’은 경외적 대체어로 기능하므로, 영어 POB의 대문자 처리에 대응해 한국어에서는 존칭 대체어로서의 기능을 문맥으로 드러냈습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 옮겨 본문 자체의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 같은 어간의 반복과 법률적 엄중함
  chosen_reading: 반드시 죽임을 당해야 합니다 / 반드시 돌로 쳐야 합니다
  alternative_readings:
  - 죽어야 합니다
  - 돌로 쳐야 합니다
  rationale: 본문의 반복은 단순 정보가 아니라 판결의 확정성과 공동체 책임을 강조하므로, 한국어에서도 강화된 법령체를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it
