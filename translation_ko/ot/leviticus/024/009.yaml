  verdict: revise
  source_fidelity: 초안은 아론과 그의 아들들에게 귀속되고 거룩한 곳에서 먹는다는 핵심을 옮겼습니다. 그러나 קֹדֶשׁ קָדָשִׁים의 최상급 의미가 단순히 ‘거룩한 것’으로 약화되었고, מֵאִשֵּׁי יְהוָה의 제의적 범주도 ‘야훼의 제물로서’라는 표현으로 충분히 드러나지 않습니다. 수정문은 ‘가장 거룩한 것’과 ‘화제 가운데서’를 반영하며, לֹו의 단수는 ‘그에게’로 보존합니다.
  naturalness: 초안의 문체는 성경식 연결 어미가 연속되어 현대 표준어 합쇼체로는 다소 경직되어 있습니다. 짧은 문장과 ‘-합니다’ 종결을 사용해 현대적이고 정중한 법규적 문체로 다듬었습니다.
  terminology: ‘화제’는 אִשֶּׁה에 대응하는 확립된 제의 용어이며, 독자의 이해를 위해 ‘불로 드리는 제물’이라는 각주를 붙였습니다. ‘영원한 규례’는 חָק עוֹלָם의 지속적 법규 의미를 유지합니다. 신명은 프로젝트 방침 및 원문에 따라 ‘야훼’로 유지했습니다.
  issues:
