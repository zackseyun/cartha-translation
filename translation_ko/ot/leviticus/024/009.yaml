    issue: ‘그에게 거룩한 것’이 קֹדֶשׁ קָדָשִׁים의 최상급 표현을 충분히 반영하지 못합니다.
    rationale: 이 관용구는 일반적인 ‘거룩한 것’이 아니라 제의적으로 최고 등급의 거룩함을 뜻하므로 ‘그에게 가장 거룩한 것’으로 옮겨야 합니다.
