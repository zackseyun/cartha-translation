    issue: ‘야훼의 제물로서’는 מֵאִשֵּׁי יְהוָה의 ‘야훼의 화제들 가운데서/로부터’라는 관계를 불분명하게 만듭니다.
    rationale: ‘화제 가운데서’는 그 빵이 야훼께 바치는 화제의 범주 안에서 아론에게 배정되는 몫이라는 원문의 제의적 관계를 더 정확히 나타냅니다.
  - severity: low
