id: LEV.24.6
reference: Leviticus 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
  footnotes:
  - marker: a
    text: Or 'in two arrangements' or 'in two piles'; the Hebrew term refers to an ordered arrangement of the loaves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the pure table'; 'clean table' is another possible rendering, with a ritual sense rather than merely physical cleanliness.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그것들을 두 줄로 놓아야 합니다[a]. 각 줄에 여섯 개씩이요. 그것을 야훼 앞의 순수한 상 위에 두십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 배열로’ 또는 ‘두 무더기로’라고도 할 수 있습니다. 히브리어 용어는 빵을 질서 있게 배열한 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘순수한 상’이라고 되어 있습니다. ‘깨끗한 상’도 가능하지만, 여기서는 단순한 물리적 청결보다 제의적 정결을 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  english_pob_choice: And you shall place
  chosen_korean: 놓아야 합니다
  alternatives_korean:
  - 두어야 합니다
  - 배치해야 합니다
  lexicon: HALOT
  rationale: שׂוּם은 ‘두다, 놓다, 배치하다’의 뜻이므로, 빵을 정돈해 놓는 문맥에 맞게 ‘놓다’로 옮겼습니다. 명령/미래형의 지시 뉘앙스는 ‘-아야 합니다’로 살렸습니다.
- source_word: שְׁתַּיִם מַעֲרָכֹת
  english_pob_choice: in two rows
  chosen_korean: 두 줄로
  alternatives_korean:
  - 두 배열로
  - 두 무더기로
  lexicon: HALOT
  rationale: מַעֲרָכָה는 정돈된 배열을 가리키지만, 진설병 문맥에서는 한국어로 ‘줄’이 가장 자연스럽고 질서 있는 배치를 잘 드러냅니다.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  english_pob_choice: six in each row
  chosen_korean: 각 줄에 여섯 개씩
  alternatives_korean:
  - 줄마다 여섯 개
  - 한 줄에 여섯 개씩
  lexicon: HALOT
  rationale: 히브리어는 단수형과 수사로 분배적 의미를 나타내므로, 한국어에서는 각 배열마다 여섯 개가 되도록 분명히 풀어 적었습니다.
- source_word: הַטָּהֹר
  english_pob_choice: pure table
  chosen_korean: 순수한 상
  alternatives_korean:
  - 깨끗한 상
  - 정결한 상
  lexicon: HALOT
  rationale: טָהוֹר는 제의적 정결/순수의 의미가 강하므로, 단순한 물리적 ‘깨끗함’보다 제의적 성격을 살린 표현을 택했습니다. ‘상’은 제의용 탁자를 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 절은 여호와의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 용례에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제의적 정결을 나타내는 הַטָּהֹר의 처리
  chosen_reading: 순수한 상
  alternative_readings:
  - 깨끗한 상
  - 정결한 상
  rationale: 이 표현은 단순 위생이 아니라 성소 기구의 제의적 상태를 말합니다. 따라서 일상적 ‘깨끗한’보다 ‘순수한’이 원문의 예배적 긴장을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 야훼의 이름을 직접 표기함
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 일반 호칭이 아니라 언약적 고유명 יְהוָה를 사용합니다. 한국어 본문에서도 그 구별을 유지하기 위해 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms'
