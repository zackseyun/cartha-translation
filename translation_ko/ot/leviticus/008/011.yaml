id: LEV.8.11
reference: Leviticus 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
  footnotes:
  - marker: a
    text: Or 'from it'; the Hebrew literally says 'from it,' referring to the anointing oil mentioned in the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the laver and its base.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 기름 가운데 일부를[a] 제단 위에 일곱 번 뿌린 뒤, 제단과 그 모든 기구, 그리고 물두멍과 그 받침[b]에 기름을 발라 그것들을 거룩하게 구별하려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것으로부터’입니다. 문맥상 앞에서 언급된 관유의 일부를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대야와 그 받침대’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז / מִמֶּנּוּ
  english_pob_choice: He sprinkled some of it
  chosen_korean: 그 기름을…뿌리고
  alternatives_korean:
  - 그것에서부터 뿌리고
  - 그것의 일부를 뿌리고
  lexicon: HALOT
  rationale: מן+대명사 접미사의 ‘from it’ 의미를 한국어에서는 문맥상 자연한 ‘그 기름을’로 옮기되, 앞 절의 관유를 가리키는 점을 살렸습니다.
- source_word: שֶׁבַע פְּעָמִים
  english_pob_choice: seven times
  chosen_korean: 일곱 번
  alternatives_korean:
  - 칠 차례
  - 일곱 차례
  lexicon: HALOT
  rationale: 반복 횟수를 그대로 전달하는 직역이 가장 분명하며, 제의적 반복 동작의 강도를 유지합니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 용기
  lexicon: HALOT
  rationale: כְּלִי의 성막 맥락을 한국어 현대어로 자연스럽게 옮기면서, 단순 생활용품보다 성소 उपकरण의 뉘앙스를 살렸습니다.
- source_word: הַכִּיֹּר וְאֶת כַּנּוֹ
  english_pob_choice: the basin and its stand
  chosen_korean: 물두멍과 그 받침
  alternatives_korean:
  - 대야와 그 받침대
  - 물두멍과 그 대
  lexicon: HALOT
  rationale: 전통적으로 알려진 성막 용어인 ‘물두멍’을 쓰되, ‘받침’으로 כַּן의 지지 구조를 현대적으로 분명히 했습니다.
- source_word: לְקַדְּשָׁם
  english_pob_choice: to consecrate them
  chosen_korean: 그것들을 거룩하게 구별하였습니다
  alternatives_korean:
  - 그것들을 봉헌하였습니다
  - 그것들을 성별하였습니다
  lexicon: HALOT
  rationale: קדש의 제의적 의미를 살리면서, 단순한 내적 변화가 아니라 하나님께 속하도록 따로 떼어 놓는 행위를 분명히 하기 위해 ‘거룩하게 구별하다’를 택했습니다.
theological_decisions:
- issue: קדש의 번역어
  chosen_reading: ‘거룩하게 구별하다’로 옮겨, 제의적 성별과 도덕적/추상적 ‘성화’를 혼동하지 않게 했습니다.
  alternative_readings:
  - 성별하다
  - 거룩하게 하다
  - 성화하다
  rationale: 본문은 성막 기구들을 제사 용도로 따로 구분하는 의식이므로, ‘성화’처럼 내면적 신앙 상태를 연상시키는 표현보다 구별의 기능을 드러내는 표현이 더 정확합니다.
  doctrine_reference: 출애굽기–레위기 성막 봉헌/성별 문맥
