  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
  footnotes:
  - marker: a
    text: Or 'on the palms of Aaron and on the palms of his sons.' The Hebrew preposition is literally 'on/upon,' though in English the sense is that the portions were placed in their cupped hands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 모든 것을 아론의 손바닥 위에, 그리고 그의 아들들의 손바닥 위에 놓고, 그것들을 야훼 앞에서 요제로 흔들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아론의 손바닥에, 그리고 그의 아들들의 손바닥에.’ 히브리어 전치사 עַל은 문자적으로 ‘위에/위로’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת הַכֹּל
  english_pob_choice: He put all of it
  chosen_korean: 그 모든 것을 두고
  alternatives_korean:
  - 그 모든 것을 주고
  - 그 모든 것을 놓고
  lexicon: HALOT
  rationale: נתן은 여기서 제물을 실제로 손 위에 놓는 동작을 가리키므로, 한국어에서는 ‘두다’가 가장 자연스럽고 물리적 배치를 잘 드러냅니다.
- source_word: עַל כַּפֵּי
  english_pob_choice: into the palms of
  chosen_korean: 손바닥 위에
  alternatives_korean:
  - 손바닥에
  - 손에
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥/손’이며, 의식 맥락에서 cupped hands의 이미지를 살리기 위해 ‘손바닥 위에’로 옮겼습니다.
- source_word: תְּנוּפָה
  english_pob_choice: as a wave offering
  chosen_korean: 요제로
  alternatives_korean:
  - 흔드는 제물로
  - 흔들어 바치는 제물로
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 전문용어이므로, 한국어 성경에서 정착된 ‘요제’ 용어를 사용하되 동작은 뒤의 ‘흔들어’로 보완했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와 대신 ‘야훼’를 사용해 מקור의 신명사례를 투명하게 반영했습니다.
theological_decisions:
- issue: 제의적 동작과 결과의 표현
  chosen_reading: ‘그것을 … 흔들어 요제로 삼았습니다’로 번역하여 동작과 제의적 성격을 함께 드러냈습니다.
  alternative_readings:
  - ‘그것을 … 흔들었습니다’
  - ‘요제로 드렸습니다’
  rationale: 히브리어는 단순한 흔들기가 아니라 제의적 헌납 행위를 말하므로, 동사와 제의 명칭을 함께 살려 의미를 보존했습니다.
  doctrine_reference: Leviticus sacrificial terminology; POB cultic precision principle
