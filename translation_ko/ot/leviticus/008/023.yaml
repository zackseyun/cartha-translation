id: LEV.8.23
reference: Leviticus 8:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
  footnotes:
  - marker: a
    text: Or 'the tip of Aaron’s right ear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것을 잡아죽였으며, 모세는 그 피에서 조금을 가져다가 아론의 오른쪽 귀 귓불과 그의 오른손 엄지와 그의 오른발 엄지발가락에 바르았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아론의 오른쪽 귀 끝'으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  english_pob_choice: he slaughtered it
  chosen_korean: 그것을 잡아죽였으며
  alternatives_korean:
  - 그것을 도살하였으며
  - 그것을 잡아죽였으며
  lexicon: HALOT
  rationale: 제의적 문맥의 שחט는 단순한 '죽이다'보다 희생 제물의 도살 행위를 가리키므로, 한국어에서는 자연스럽고 정확한 '잡아죽이다'로 옮겼습니다.
- source_word: מִדָּמוֹ
  english_pob_choice: some of its blood
  chosen_korean: 그 피에서 조금을
  alternatives_korean:
  - 그 피의 일부를
  - 그 피에서 조금을
  lexicon: HALOT
  rationale: מן + 혈액은 전체가 아니라 일부를 취했다는 뜻이므로, '조금을'로 양적 제한을 드러냈습니다.
- source_word: תְּנוּךְ אֹזֶן
  english_pob_choice: the lobe of Aaron’s right ear
  chosen_korean: 아론의 오른쪽 귀 귓불
  alternatives_korean:
  - 아론의 오른쪽 귀 끝
  - 아론의 오른쪽 귀 귓불
  lexicon: HALOT
  rationale: 이 표현은 제의 문맥에서 귀의 끝부분/귓불을 가리키므로, 영어 POB의 'lobe'를 따라 '귓불'로 구체화했습니다.
- source_word: בֹּהֶן
  english_pob_choice: thumb / big toe
  chosen_korean: 오른손 엄지와 그의 오른발 엄지발가락
  alternatives_korean:
  - 오른손 엄지와 그의 오른발 엄지발가락
  - 오른손 엄지와 그의 오른발 큰발가락
  lexicon: HALOT
  rationale: 손에는 '엄지', 발에는 해부학적으로 정확한 '엄지발가락'이 가장 자연스럽고, 히브리어의 손/발 구분도 유지합니다.
theological_decisions:
- issue: 피를 귀·손·발에 바르는 제의 행위의 의미
  chosen_reading: 본문의 행위 자체를 서술적으로 옮기고, 상징적 해석은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 성별/성결 상징을 본문에 암시하는 번역
  - 제사장 직분의 의미를 설명하는 확장 번역
  rationale: 히브리어는 의식적 적용 행위를 말할 뿐이므로, 번역문이 해석을 미리 주입하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 말하고, 해석은 본문 밖에서 처리합니다.'
