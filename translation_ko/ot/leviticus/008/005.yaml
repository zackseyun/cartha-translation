  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
  footnotes:
  - marker: a
    text: Or, “This is what the LORD has commanded to do,” with the infinitive rendered more literally; the Hebrew can be expressed either way in English, but “to be done” better fits the impersonal sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 회중에게 말했습니다. "이것은 야훼께서 행하라고 명령하신 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것은 야훼께서 행하라고 명령하신 것입니다”로 옮길 수 있습니다. 히브리어의 부정사구는 영어에서 ‘to be done’처럼 무인칭적으로도, ‘to do’처럼 더 직접적으로도 표현될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: And Moses said
  chosen_korean: 모세가 말했습니다
  alternatives_korean:
  - 모세가 말하였습니다
  - 모세는 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 와우 연속 구조를 자연스러운 한국어 서사로 옮기되, 합쇼체를 유지했습니다.
- source_word: אֶל הָעֵדָה
  english_pob_choice: to the congregation
  chosen_korean: 회중에게
  alternatives_korean:
  - 공동체에게
  - 회중에
  lexicon: HALOT
  rationale: עֵדָה는 예배·언약 맥락의 모인 이스라엘 공동체를 가리키므로, 표준적인 교회 용어보다 문맥에 맞는 '회중'을 택했습니다.
- source_word: זֶה הַדָּבָר
  english_pob_choice: This is the thing
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  - 이 일은
  lexicon: HALOT
  rationale: 히브리어의 지시어+명사 구조를 한국어에서는 문맥상 자연스럽게 '이것은'으로 풀어, 뒤의 내용절을 명확히 했습니다.
- source_word: צִוָּה יְהוָה לַעֲשׂוֹת
  english_pob_choice: Yahweh has commanded to be done
  chosen_korean: 야훼께서 행하라고 명령하신 것입니다
  alternatives_korean:
  - 야훼께서 하라고 명령하신 것입니다
  - 야훼께서 수행하라고 명령하신 것입니다
  lexicon: HALOT
  rationale: לַעֲשׂוֹת의 무인칭적 의미를 한국어에서는 '행하라고'로 옮겨, 영어 POB의 'to be done'이 드러내는 수동적 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 표준 원칙에 따라 여호와 대신 신명기적 고유명 '야훼'를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와로 표기
  - 주님으로 대체
  rationale: 본문이 신적 호칭이 아니라 언약 이름 יְהוָה를 직접 사용하므로, 번역 대체어보다 고유명 표기를 보존하는 것이 본문 정보에 더 충실합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
