  rationale: 본문이 신적 호칭이 아니라 언약 이름 יְהוָה를 직접 사용하므로, 번역 대체어보다 고유명 표기를 보존하는 것이 본문 정보에 더 충실합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
