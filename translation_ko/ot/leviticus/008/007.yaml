  source_fidelity: 초안은 의복을 입히는 순서와 주요 용어를 대체로 잘 보존합니다. 그러나 에봇의 띠와 관련된 וַיַּחְגֹּר אֹתוֹ בְּחֵשֶׁב הָאֵפֹד는 아론에게 그 띠를 두르는 동작인데, 초안의 ‘그것을 그에게 둘러매고’는 목적어를 에봇으로 오해하게 하며 마지막 절과 동작이 중복됩니다.
  naturalness: ‘띠로 그의 허리를 동이고’는 의복을 갖추는 문맥에서 자연스럽고 현대 한국어 합쇼체에도 맞습니다. 마지막 절은 ‘그것’이 바로 앞의 에봇 띠를 가리키도록 유지하되, 각주 위치를 옮겨 지시 관계를 분명히 했습니다.
  terminology: ‘속옷’, ‘띠’, ‘겉옷’, ‘에봇’, ‘정교하게 짠 띠’는 모두 무난합니다. 에봇은 전문 제의 의복명이므로 음역을 유지하는 것이 적절합니다. 기존 각주 a는 חֵשֶׁב(에봇의 띠)에 관한 것이므로 속옷 뒤가 아니라 해당 표현 뒤에 와야 하며, 각주 b는 마지막 고정 동작에 붙어야 합니다.
