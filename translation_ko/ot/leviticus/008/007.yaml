source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
  footnotes:
  - marker: a
    text: Or 'the decorated band of the ephod' or 'the waistband of the ephod.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb here likely means that the ephod was secured to Aaron by means of its woven band.
    reason: cultural_note
translation:
  language: ko
  text: 그는 아론에게 속옷을 입히고, 띠로 그의 허리를 동이고, 겉옷을 입히고, 에봇을 입히고, 에봇의 정교하게 짠 띠[a]로 그의 허리를 동이고, 그것으로 에봇을 그에게 매었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에봇의 장식 띠’ 혹은 ‘에봇의 허리띠’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기서 에봇이 그 띠를 통해 아론에게 고정되었음을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  english_pob_choice: tunic
  chosen_korean: 속옷
  alternatives_korean:
  - 속적삼
  - 튤닉
  - 긴 셔츠
  lexicon: HALOT
  rationale: 제사장 복장의 기본 속옷이라는 점을 살리면서 한국어에서 자연스럽고 기능이 드러나는 표현으로 옮겼습니다.
- source_word: אַבְנֵט
  english_pob_choice: sash
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠끈
  - 사시
  lexicon: HALOT
  rationale: 허리에 두르는 천 띠라는 뜻이므로, 제의적 장면에서 지나치게 현대적이거나 군더더기인 표현보다 간결한 ‘띠’가 적절합니다.
- source_word: מְעִיל
  english_pob_choice: robe
  chosen_korean: 겉옷
  alternatives_korean:
  - 로브
  - 긴 옷
  - 외투
  lexicon: HALOT
  rationale: 속옷 위에 걸치는 바깥옷이라는 층위를 분명히 하려면 ‘겉옷’이 가장 자연스럽고 문맥상 분명합니다.
- source_word: אֵפֹד
  english_pob_choice: ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에봇 앞치마형 제복
  - 제사복
  lexicon: HALOT
  rationale: 고유한 제사장 의복 용어이므로 음역을 유지해 제의적 전문성을 보존했습니다.
- source_word: חֵשֶׁב
  english_pob_choice: skillfully woven band
  chosen_korean: 정교하게 짠 띠
  alternatives_korean:
  - 장식 띠
  - 허리띠
  - 짠 띠
  lexicon: HALOT
  rationale: 이 부분은 에봇과 연결된 짜인 띠/허리띠를 가리키므로, 기능과 제작의 정교함을 함께 드러내는 표현을 택했습니다.
- source_word: וַיֶּאְפֹּד ל֖וֹ בּוֹ
  english_pob_choice: tied the ephod to him with it
  chosen_korean: 그것으로 에봇을 그에게 매었습니다
  alternatives_korean:
  - 그것으로 에봇을 그에게 묶었습니다
  - 그것으로 에봇을 그에게 둘러매었습니다
  lexicon: HALOT
  rationale: 마지막 동사는 밴드를 사용해 에봇을 몸에 고정하는 동작이므로, POB의 관계를 따라 ‘그것으로 … 매었습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 제사장 복장 절차의 반복 동사 표현
  chosen_reading: 의례적 착의 과정을 순서대로 보여 주는 동작 동사를 반복해, 텍스트의 절차성과 장엄함을 살렸습니다.
  alternative_readings:
  - 한 문장으로 압축하여 ‘입혀 완비했다’고 처리
  - 더 문학적으로 재구성
  rationale: 본문은 교훈보다 의식의 세부 절차를 전달하므로, 동작을 연속적으로 보존하는 것이 원문의 의도를 더 정확히 드러냅니다.
  doctrine_reference: 출애굽기·레위기의 제의 서술은 절차 묘사 자체가 중요하므로, 과도한 의역보다 서술 구조 보존을 우선합니다.
