  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
  footnotes:
  - marker: a
    text: Or 'and you shall not die'; alternatively, 'lest you die.'
    reason: lexical_alternative
translation:
  language: ko
  text: 회막 입구에서 밤낮으로 칠 일 동안 머무르십시오. 또 야훼께서 맡기신 의무를 지키십시오. 그러면 죽지 않을 것입니다[a]. 내가 이렇게 명령을 받았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽지 않도록 하십시오’; 달리, ‘그리고 죽지 않을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֶתַח אֹ֨הֶל מוֹעֵ֜ד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막의 문 앞에
  alternatives_korean:
  - 회막의 입구에
  - 회막의 문간에
  lexicon: HALOT
  rationale: פֶתַח은 단순한 ‘문’보다 ‘출입구/입구’의 의미가 있으므로, 한국어에서는 자연스럽고 공간 관계를 잘 드러내는 ‘문 앞에’로 옮겼습니다.
- source_word: תֵּשְׁב֨וּ
  english_pob_choice: you shall stay
  chosen_korean: 머무르십시오
  alternatives_korean:
  - 계십시오
  - 머물러 있으십시오
  - 앉아 있으십시오
  lexicon: HALOT
  rationale: 이 제사장 지침에서는 단순히 앉는 것이 아니라 지정된 장소에 계속 머무르는 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘머무르십시오’로 옮겼습니다.
- source_word: וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶרֶת יְהוָ֖ה
  english_pob_choice: and keep the charge of Yahweh
  chosen_korean: 야훼의 명령을 지키십시오
  alternatives_korean:
  - 야훼의 책임을 지키십시오
  - 야훼의 맡기신 일을 지키십시오
  - 야훼의 경계를 지키십시오
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת은 ‘맡겨진 직무/의무/지켜야 할 지시’의 뜻이므로, 제의적 맥락에서 가장 분명한 한국어인 ‘명령’을 택하되 ‘지키다’를 붙여 חובה의 수행성을 살렸습니다.
- source_word: יְהוָ֖ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용하여, 본문의 신명(神名) 자체를 보존했습니다.
theological_decisions:
- issue: יוֹמָם וָ/לַיְלָה and the duration of priestly stationing
  chosen_reading: 주야로 칠 일 동안 계속 머무르라는 지속 명령으로 읽었습니다.
  alternative_readings:
  - 낮과 밤을 번갈아 지키라는 의미
