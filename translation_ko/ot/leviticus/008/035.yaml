  rationale: 히브리어의 관용적 병렬은 끊임없는 지속성을 나타내므로, 한국어에서도 ‘주야로’와 ‘계속 머무르십시오’로 그 압박감과 연속성을 살렸습니다.
  doctrine_reference: 제의 문맥상 거룩한 직무의 지속성과 경계 유지
