  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'the assembly gathered' or 'the congregation was assembled.' The Hebrew verb can be represented with slightly different English idioms.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼께서 그에게 명령하신 대로 행하였고, 회중은 회막 입구에 모였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중이 모였다’ 혹은 ‘회중이 모여들었다’로 옮길 수 있습니다. 히브리어 동사는 약간 다른 관용적 표현으로도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하였고
  alternatives_korean:
  - 하였고
  - 실행하였고
  - 따라 행하였고
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다/행하다’의 뜻이므로, 명령에 대한 순종의 맥락에서는 ‘행하다’가 자연스럽고 직접적입니다.
- source_word: כַּאֲשֶׁר צִוָּה
  english_pob_choice: as ... commanded
  chosen_korean: 명령하신 대로
  alternatives_korean:
  - 명령하신 것처럼
  - 명하신 대로
  - 지시하신 대로
  lexicon: HALOT
  rationale: ‘~대로’가 히브리어의 일치·준거 의미를 잘 살리며, צוה의 권위 있는 명령 성격도 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신적 고유명은 대체 호칭이 아니라 ‘야훼’로 옮겨, 언약 이름의 직접성을 보존했습니다.
- source_word: וַתִּקָּהֵל הָעֵדָה
  english_pob_choice: the congregation assembled
  chosen_korean: 회중은 ... 모였습니다
  alternatives_korean:
  - 회중이 모였습니다
  - 회중이 모여들었습니다
  - 회중이 모였습니다
  lexicon: HALOT
  rationale: עֵדָה는 출애굽기·레위기 문맥의 언약 공동체를 가리키므로 ‘회중’이 적절하며, קהל의 수동적 뉘앙스는 ‘모였습니다’로 자연스럽게 살렸습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 천막
  - 모임의 장막
  - 회의 장막
  lexicon: HALOT
  rationale: 한국어 성경에서 확립된 용례인 ‘회막’이 אֹהֶל מוֹעֵד의 기능과 지칭을 가장 간결하게 전달합니다.
theological_decisions:
- issue: 여호와 신명 대신의 번역을 유지할지 여부
  chosen_reading: 원문 고유명 ‘야훼’를 그대로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 본문의 핵심은 야훼의 명령에 대한 모세의 정확한 순종이므로, 신명 대체어보다 고유명을 유지하는 편이 서술과 언약적 관계를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
