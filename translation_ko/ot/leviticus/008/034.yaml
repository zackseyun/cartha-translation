id: LEV.8.34
reference: Leviticus 8:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
  footnotes:
  - marker: a
    text: Or 'As was done today, so the LORD commanded it to be done, to make atonement for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 행해진 것과 같이, 야훼께서는 그것을 행하여 여러분을 위해 속죄를 이루라고 명령하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘 행해진 것과 같이, 주께서 그것을 행하여 여러분을 위해 속죄를 이루라고 명령하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: Just as
  chosen_korean: ~와 같이
  alternatives_korean:
  - ~처럼
  - ~대로
  lexicon: HALOT
  rationale: 앞선 제의 행위를 앞의 서술과 대응시키는 비교 표현이므로, 현대 한국어에서 자연스러운 ‘~와 같이’로 비교 관계를 살렸습니다.
- source_word: עָשָׂה / לַעֲשֹׂת
  english_pob_choice: has been done / to be done
  chosen_korean: 행해진 것 / 행하여
  alternatives_korean:
  - 한 것 / 하여
  - 이루어진 것 / 이루어
  lexicon: HALOT
  rationale: 본문은 앞서 실제로 수행된 제의 동작과 그 수행을 명령한 내용을 되짚으므로, 제의적·형식적 뉘앙스를 살려 ‘행하다’를 반복했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사전 규정에 따라 여호와 대신 신명기적 고유명 ‘야훼’를 사용하여 본문의 신명 호칭을 보존했습니다.
- source_word: לְכַפֵּר עֲלֵיכֶם
  english_pob_choice: to make atonement for you
  chosen_korean: 여러분을 위해 속죄를 이루라고
  alternatives_korean:
  - 여러분을 위해 속죄하라고
  - 여러분을 위해 속죄하도록
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 ‘속죄’로 옮기되, 한국어에서 목적절 안에 자연스럽게 들어가도록 ‘속죄를 이루다’로 풀어 제의 행위의 목적을 분명히 했습니다.
theological_decisions:
- issue: כפר의 제의적 의미를 한국어로 어떻게 보존할 것인가
  chosen_reading: ‘속죄를 이루다’로 옮겨, 의례가 단순한 절차가 아니라 백성을 위한 속죄 목적을 가진다는 점을 드러냈습니다.
  alternative_readings:
  - ‘속죄하다’
  - ‘속죄제사를 드리다’
  rationale: 히브리어 본문은 이 날의 행위가 야훼의 명령에 따른 속죄 목적을 지닌다고 말합니다. ‘속죄를 이루다’는 과도한 교리화를 피하면서도 제의적 효력을 살립니다.
  doctrine_reference: Translation philosophy §6; preserve theological tension rather than resolve it
