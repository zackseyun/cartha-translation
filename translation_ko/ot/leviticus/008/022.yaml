base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
  footnotes:
  - marker: a
    text: Or, 'the ram of consecration.' The Hebrew expression is a technical priestly term for the installation rite.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 둘째 숫양, 곧 안수식의 숫양을 가져왔습니다. 아론과 그의 아들들은 그 숫양의 머리 위에 자기들의 손을 얹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉헌의 숫양’이라고도 번역할 수 있습니다. 히브리어 표현은 제사장 임직 의례를 가리키는 전문 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: Then he brought near
  chosen_korean: 그는 가져왔습니다
  alternatives_korean:
  - 그는 가까이 데려왔습니다
  - 그는 바쳐왔습니다
  lexicon: HALOT
  rationale: 제의 문맥에서 קרב의 핵심은 제물을 제의 행위 앞으로 ‘가져오다/제시하다’는 뜻이므로, 한국어에서는 자연스럽고 절차를 드러내는 ‘가져왔습니다’를 선택했습니다.
- source_word: הָאַיִל הַשֵּׁנִי
  english_pob_choice: the second ram
  chosen_korean: 둘째 숫양
  alternatives_korean:
  - 두 번째 숫양
  - 다른 숫양
  lexicon: HALOT
  rationale: הַשֵּׁנִי는 순서를 나타내는 ‘둘째/두 번째’이고, אַיִל은 ‘숫양’이므로 그 순차적 구분을 그대로 살렸습니다.
- source_word: אֵיל הַמִּלֻּאִים
  english_pob_choice: the ram of ordination
  chosen_korean: 안수식의 숫양
  alternatives_korean:
  - 임직의 숫양
  - 봉헌의 숫양
  - 안수의 숫양
  lexicon: HALOT
  rationale: מִלֻּאִים은 제사장 임직/설치 절차를 가리키는 전문 용어이므로, 직역에 가까우면서도 문맥을 드러내는 ‘안수식’으로 풀어 기술적 의미를 전달했습니다.
- source_word: וַיִּסְמְכוּ אַהֲרֹן וּבָנָיו אֶת יְדֵיהֶם עַל רֹאשׁ הָאָיִל
  english_pob_choice: and Aaron and his sons laid their hands on the head of the ram
  chosen_korean: 아론과 그의 아들들은 그 숫양의 머리 위에 자기들의 손을 얹었습니다
  alternatives_korean:
  - 아론과 그의 아들들은 그 숫양의 머리에 손을 얹었습니다
  - 아론과 그의 아들들은 그 숫양 위에 손을 얹었습니다
  lexicon: HALOT
  rationale: סמך는 제의에서 손을 ‘얹다/올려놓다’는 고정된 몸짓을 뜻하므로 ‘손을 얹었습니다’로 옮겼고, ‘머리 위에’는 히브리어의 עַל רֹאשׁ를 자연스럽게 반영했습니다.
theological_decisions:
- issue: מִלֻּאִים의 제사장 임직 전문용어 처리
  chosen_reading: ‘안수식’으로 풀어, 아론과 아들들의 제사장 직분 설치 의례임을 드러냈습니다.
  alternative_readings:
  - ‘임직식’
  - ‘봉헌식’
  - ‘안수례’
  rationale: 레위기 8장의 문맥은 제사장 직분에 대한 설치 의례이므로, 한국어 독자가 절차의 기능을 곧바로 이해하도록 하면서도 기술적 성격을 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
