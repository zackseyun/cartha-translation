id: LEV.8.12
reference: Leviticus 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: ko
  text: 그러고 나서 그가 관유에서 조금을 아론의 머리 위에 붓고, 그를 거룩하게 구별하려고 그에게 기름을 부었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  english_pob_choice: poured
  chosen_korean: 붓고
  alternatives_korean:
  - 쏟고
  - 부어 넣고
  lexicon: HALOT
  rationale: יצק은 액체를 붓는 동작을 가리키므로, 자연스러운 현대 한국어 동사인 ‘붓다’로 옮겼습니다.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  english_pob_choice: some of the anointing oil
  chosen_korean: 관유에서 조금을
  alternatives_korean:
  - 기름부음의 기름에서 조금을
  - 관유를 조금
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 ‘~에서 조금’을 쓰고, cultic 용어는 ‘관유’로 간명하게 옮겼습니다.
- source_word: עַל רֹאשׁ אַהֲרֹן
  english_pob_choice: on Aaron’s head
  chosen_korean: 아론의 머리 위에
  alternatives_korean:
  - 아론의 머리에
  - 아론의 머리 위에
  lexicon: HALOT
  rationale: 상징적 도유 행위를 드러내기 위해 단순한 처소보다 ‘머리 위에’를 택했습니다.
- source_word: לְקַדְּשׁוֹ
  english_pob_choice: to consecrate him
  chosen_korean: 그를 거룩하게 구별하려고
  alternatives_korean:
  - 그를 거룩하게 하려고
  - 그를 성별하려고
  lexicon: HALOT
  rationale: קדשׁ의 제의적 의미는 단순한 도덕적 ‘거룩함’보다 ‘거룩하게 구별함’이 더 직접적이므로, 제의적 파견/구별의 뜻을 드러냈습니다.
theological_decisions:
- issue: קדשׁ의 제의적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: ‘거룩하게 구별하다’로 옮겨 아론을 제사장 직무를 위해 따로 세우는 뜻을 보였습니다.
  alternative_readings:
  - 거룩하게 하다
  - 성별하다
  rationale: 이 문맥은 아론의 직분 임명을 말하므로, 내적 성화보다 성소적 구별의 의미를 유지하는 번역이 더 정확합니다.
  doctrine_reference: 레위기 8장의 제사장 위임 문맥
