- from: 그러고 나서 그가 관유에서 조금을 아론의 머리 위에 붓고, 그를 거룩하게 구별하려고 그에게 기름을 부었습니다.
  to: 그러고 나서 그는 관유 일부를 아론의 머리에 붓고, 그에게 기름을 발라 그를 거룩하게 구별하셨습니다.
  rationale: 관유의 부분적 사용을 ‘관유 일부’로 유지하고, 붓는 행위와 기름을 발라 도유하는 행위를 구별했습니다. ‘거룩하게 구별하시려고’는 히브리어 목적 표현과 제의적 consecrate의 의미를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:39Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 관유의 일부를 아론의 머리에 붓고, 이어 그를 거룩하게 구별할 목적으로 그에게 기름을 바르는 두 동작을 서술합니다. 초안의 마지막 ‘그에게 기름을 부었습니다’는 וַיִּמְשַׁח(기름을 바르다, 기름 부어 임명하다)를 앞선 ‘붓고’와 사실상 중복시켜 두 번째 동작의 의미를 충분히 드러내지 못합니다.
  naturalness: ‘관유에서 조금을’은 현대 한국어에서 다소 어색하므로 ‘관유 일부를’이 자연스럽습니다. 또한 실제 접촉 위치를 뜻하는 문맥에서는 ‘머리 위에’보다 ‘머리에’가 자연스럽고 오해가 적습니다.
  terminology: ‘관유’는 שֶׁמֶן הַמִּשְׁחָה의 제의적 의미를 간결하게 전달하며 유지할 수 있습니다. לְקַדְּשׁוֹ는 제의적 목적을 나타내므로 ‘그를 거룩하게 구별하시려고’가 적절합니다.
  issues:
  - severity: medium
    issue: וַיִּמְשַׁח의 번역이 ‘그에게 기름을 부었습니다’로 되어 있습니다.
    rationale: 앞선 יצק의 ‘붓다’와 구별되는 משח의 도유 행위가 불분명해집니다. ‘그에게 기름을 바르다’로 옮겨 두 동작과 제의적 의미를 보존해야 합니다.
  - severity: low
    issue: ‘관유에서 조금을’과 ‘머리 위에’의 표현이 다소 부자연스럽거나 위치를 모호하게 합니다.
    rationale: 부분 의미는 ‘관유 일부를’로, עַל־רֹאשׁ은 이 문맥에서 ‘아론의 머리에’로 표현하는 편이 자연스럽고 정확합니다.
  revised_text: 그러고 나서 그는 관유 일부를 아론의 머리에 붓고, 그에게 기름을 발라 그를 거룩하게 구별하셨습니다.
