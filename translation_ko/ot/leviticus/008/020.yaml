  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֔יִל נִתַּ֖ח לִ/נְתָחָ֑י/ו וַ/יַּקְטֵ֤ר מֹשֶׁה֙ אֶת הָ/רֹ֔אשׁ וְ/אֶת הַ/נְּתָחִ֖ים וְ/אֶת הַ/פָּֽדֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
  footnotes:
  - marker: a
    text: Or 'the suet' or 'the fat.' The Hebrew term refers to a fatty portion of the sacrificial animal; here it is rendered 'fat tail' in light of the ram offering context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 숫양을 그 조각들로 잘랐습니다. 그리고 모세가 그 머리와 그 조각들과 그 기름기 많은 부분을 연기로 태웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  english_pob_choice: the ram
  chosen_korean: 숫양
  alternatives_korean:
  - 양
  - 수양
  lexicon: HALOT
  rationale: 제물 문맥의 אַיִל은 성숙한 수컷 양인 숫양을 가리키므로, 제의 맥락을 분명히 하는 표준 한국어로 옮겼습니다.
- source_word: נִתַּח לִנְתָחָיו
  english_pob_choice: cut ... into its pieces
  chosen_korean: 그 조각들로 잘랐습니다
  alternatives_korean:
  - 그 부분들로 나누었습니다
  - 그 조각들로 분해했습니다
  lexicon: HALOT
  rationale: ‘cut ... into its pieces’의 분할·절단 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: burned ... in smoke
  chosen_korean: 연기로 태웠습니다
  alternatives_korean:
  - 향불처럼 피워 올렸습니다
  - 연기나게 하여 바쳤습니다
  lexicon: HALOT
  rationale: 제사 용례에서 단순한 ‘태우다’보다 제단에서 ‘연기로 올리다’는 제의적 의미가 있으므로, 이를 간결하게 반영했습니다.
- source_word: הַפָּדֶר
  english_pob_choice: the suet
  chosen_korean: 기름기 많은 부분
  alternatives_korean:
  - 기름덩어리
  - 내장지방
  lexicon: HALOT
  rationale: 영어 POB가 ‘suet’로 처리한 부분은 제물의 지방 부분을 가리키므로, 한국어에서는 의미를 드러내는 설명적 표현으로 옮겼습니다.
theological_decisions:
- issue: 제의 동작 동사인 וַיַּקְטֵר의 표현
  chosen_reading: ‘연기로 태웠습니다’로 옮겨, 단순 소각이 아니라 제단에서 하나님께 올리는 제의 행위를 드러냈습니다.
  alternative_readings:
  - 그냥 태웠습니다
  - 불살랐습니다
  rationale: 레위기의 제사 문맥에서는 קטר가 희생 제물을 제의적으로 연기나게 하는 행위를 뜻하므로, 일반 소각으로 약화시키지 않았습니다.
  doctrine_reference: 제사법/성막 예전
