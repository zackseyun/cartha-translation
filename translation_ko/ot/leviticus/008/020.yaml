  source_fidelity: 히브리어의 첫 절은 수동형으로, 숫양이 여러 부분으로 잘린 사실을 말할 뿐 행위자를 명시하지 않습니다. 이어서 모세가 머리와 각 부분과 פָּדֶר를 제단에서 연기가 나도록 태우는 행위가 나옵니다. 수정안은 이 주어의 전환과 제의적 동사를 보존합니다.
  naturalness: 초안의 “그 조각들로 잘랐습니다”는 한국어에서 목적어와 결과 표현의 결합이 부자연스럽고, ‘그’의 반복도 어색합니다. “부위별로 잘렸습니다”와 “연기로 올렸습니다”가 현대의 격식 있는 성경 문체에 자연스럽습니다.
