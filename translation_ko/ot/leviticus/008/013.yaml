  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'presented Aaron’s sons.' The Hebrew verb can mean 'bring near' or 'present' in a ritual setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'girded them with a sash'—that is, each son with his priestly sash.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew divine name is YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 아론의 아들들을 가까이 데려와 그들에게 속옷을 입히고, 띠를 띠우고, 관을 씌웠습니다. 이는 야훼께서 모세에게 명하신 그대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가까이 데려와’는 제의 맥락의 히브리어 동사 ‘가까이 오게 하다/제시하다’의 의미를 살린 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘관’은 여기서 일반 제사장의 머리쓰개를 가리키며, 대제사장의 머리장식과는 구별됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: brought ... near
  chosen_korean: 가까이 데려와
  alternatives_korean:
  - 데려와
  - 가까이 불러와
  - 앞에 데려와
  lexicon: HALOT
  rationale: 제사장 위임 문맥의 קרב는 단순 이동보다 의례적으로 ‘가까이 오게 하다’는 뜻을 살려야 하므로, 한국어로는 자연스럽고도 예식적인 ‘가까이 데려와’로 옮겼습니다.
- source_word: כֻּתֳּנֹת
  english_pob_choice: tunics
  chosen_korean: 속옷
  alternatives_korean:
  - 내의
  - 긴 셔츠
  - 제의용 속옷
  lexicon: HALOT
  rationale: 이는 제사장 복식의 기본 옷을 가리키므로, 현대 한국어에서 짧고 기능적으로 대응되는 ‘속옷’을 택해 옷의 안쪽 기본 의복임을 드러냈습니다.
- source_word: אַבְנֵט
  english_pob_choice: sashes
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠끈
  - 새시
  lexicon: HALOT
  rationale: אַבְנֵט은 가죽 허리띠가 아니라 제사장 복식의 직물성 허리띠이므로, 지나치게 생활복화하지 않는 ‘띠’가 가장 간결하고 적합합니다.
- source_word: מִגְבָּעוֹת
  english_pob_choice: caps
  chosen_korean: 관
  alternatives_korean:
  - 모자
  - 두건
  - 머리쓰개
  lexicon: HALOT
  rationale: 일반 제사장의 머리덮개를 가리키며 대제사장의 관과는 구별되는 용어이므로, 한국어 제의 어휘로는 ‘관’이 가장 근접하지만, 본문에서 다른 관념적 장식보다 ‘씌우다’ 동사와 함께 기능적으로 읽히게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 יְהוָה는 프로젝트 기본 원칙에 따라 번역어 ‘야훼’로 옮겨, 명칭 자체를 보존했습니다.
theological_decisions:
- issue: 예식적 순종 공식의 어조
  chosen_reading: ‘이는 야훼께서 모세에게 명하신 그대로였습니다’로 마무리해, 단순 정보 전달이 아니라 규정에 대한 정확한 순종을 강조했습니다.
  alternative_readings:
  - ‘야훼께서 모세에게 명령하신 대로였습니다’
  - ‘…명하신 바와 같이였습니다’
  rationale: 히브리어 כַּאֲשֶׁר צִוָּה는 반복되는 성막/제사 서술의 순종 공식이므로, 한국어도 그 규범성을 분명히 드러내야 합니다.
  doctrine_reference: 출애굽기-레위기 제의 순종 공식
