translation:
  language: ko
  text: 그는 번제로 드릴 숫양을 가까이 내놓았습니다. 그리고 아론과 그의 아들들은 그 숫양의 머리 위에 손을 얹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가까이 내놓았습니다’는 ‘가까이 가져왔습니다’ 또는 ‘제시했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손을 얹었습니다’는 제의적 동작을 가리키며, 문맥에 따라 ‘안수했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: Then he brought near
  chosen_korean: 가까이 가져왔습니다
  alternatives_korean:
