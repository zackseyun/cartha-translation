  source_fidelity: 히브리어의 제의적 동작과 복수형 ‘그들의 손’은 대체로 잘 반영했습니다. 그러나 ‘번제의 숫양’은 히브리어 הָעֹלָה가 이 숫양 자체가 번제로 드려질 제물임을 가리키는 점을 한국어에서 다소 불분명하게 만들 수 있습니다. ‘번제로 드릴 숫양’이 더 직접적이고 자연스럽습니다.
