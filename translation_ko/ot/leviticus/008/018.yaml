source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
  footnotes:
  - marker: a
    text: Or 'presented' or 'brought forward' for 'brought near.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered 'leaned' or 'placed' their hands, referring to the ritual act performed over a sacrificial animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 번제의 숫양을 가까이 가져왔습니다. 그리고 아론과 그의 아들들은 숫양의 머리 위에 손을 얹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가까이 가져왔습니다’는 ‘바쳤습니다’ 또는 ‘가까이 내놓았습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손을 얹었습니다’는 제의적 동작을 가리키며, 문맥에 따라 ‘안수했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: Then he brought near
  chosen_korean: 가까이 가져왔습니다
  alternatives_korean:
  - 가까이 데려왔습니다
  - 바쳤습니다
  - 드렸습니다
  lexicon: HALOT
  rationale: קרב의 사역형은 제의 맥락에서 제물을 ‘가까이 가져오다/바치다’는 뜻이므로, 제의 동작을 살리면서도 현대 한국어로 자연스럽게 표현했습니다.
- source_word: אֵיל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  lexicon: HALOT
  rationale: 제사 용어로서의 수컷 양을 현대 한국어 성경에서 자연스럽게 드러내는 표준어는 ‘숫양’입니다.
- source_word: הָעֹלָה
  english_pob_choice: for the burnt offering
  chosen_korean: 번제의
  alternatives_korean:
  - 번제를 위한
  - 번제로 드릴
  lexicon: HALOT
  rationale: עֹלָה는 정해진 제의 항목인 ‘번제’이므로, 소유격 구조로 옮겨 숫양이 그 번제에 속하거나 지정되었음을 반영했습니다.
- source_word: וַיִּסְמְכוּ ... אֶת יְדֵיהֶם
  english_pob_choice: laid their hands
  chosen_korean: 손을 얹었습니다
  alternatives_korean:
  - 손을 놓았습니다
  - 손을 눌렀습니다
  - 손을 폈습니다
  lexicon: HALOT
  rationale: סמך는 제의적 ‘안수’ 행위를 가리키므로, 교회 용어를 바로 쓰기보다 본문의 손을 얹는 동작을 직접 드러냈습니다.
theological_decisions:
- issue: 제의적 안수의 의미를 어디까지 드러낼지
  chosen_reading: 손을 얹었습니다
  alternative_readings:
  - 안수했습니다
  - 손을 대었습니다
  rationale: 이 절은 제의적 행위를 묘사할 뿐, 죄 전가나 동일시 같은 신학적 해석을 직접 설명하지 않으므로, 본문이 말하는 동작만 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
