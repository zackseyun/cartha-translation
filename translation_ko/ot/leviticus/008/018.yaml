  terminology: ‘번제’, ‘숫양’은 적절합니다. 제의 행위는 본문처럼 ‘손을 얹었습니다’로 유지하여, ‘안수’에 수반될 수 있는 후대적·신학적 함의를 덧붙이지 않는 것이 좋습니다.
