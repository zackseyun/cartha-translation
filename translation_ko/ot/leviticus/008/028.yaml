id: LEV.8.28
reference: Leviticus 8:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'consecration offering.' Hebrew מִלֻּאִים is a technical term for the offering used in the priests' installation rite.
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그것들을 그들의 손바닥에서 가져다가 번제 위, 곧 제단 위에서 태웠습니다. 그것들은 임직 제물[a]이었으며, 향기로운 향[b]을 위한 것이고, 야훼께 드리는 화제였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위임 제물’로 옮길 수 있습니다. 히브리어 מִלֻּאִים은 제사장 임직 의식에서 드려지는 제물을 가리키는 전문 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘향기로운 냄새’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 취하여
  - 가지고
  lexicon: HALOT
  rationale: 서술 동사의 단순한 연속성을 살리면서 제의 행위의 구체성을 유지하기에 가장 자연스럽습니다.
- source_word: מֵעַל כַּפֵּיהֶם
  english_pob_choice: from their palms
  chosen_korean: 그들의 손바닥에서
  alternatives_korean:
  - 그들의 손에서
  - 그들의 손바닥 위에서
  lexicon: HALOT
  rationale: כַּף는 손바닥을 가리키므로, 본문의 신체적 이미지를 보존해 ‘손바닥’으로 옮겼습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: burned
  chosen_korean: 태웠습니다
  alternatives_korean:
  - 연기로 올렸습니다
  - 향불로 피웠습니다
  lexicon: HALOT
  rationale: 제의 문맥에서 ‘연기로 올리다’의 의미이지만, 한국어에서는 간결하고 자연한 ‘태우다’가 그 기능을 가장 잘 전달합니다.
- source_word: מִלֻּאִים
  english_pob_choice: ordination offering
  chosen_korean: 임직 제물
  alternatives_korean:
  - 위임 제물
  - 성별 제물
  - 안수 제물
  lexicon: HALOT
  rationale: 문맥이 제사장 임명 의식이므로, 교회 제도 용어로 오해되지 않게 하면서도 기능을 드러내는 ‘임직’이 적절합니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: for a pleasing aroma
  chosen_korean: 향기로운 향을 위한
  alternatives_korean:
  - 기쁘게 받으실 향기
  - 기분 좋은 향으로
  lexicon: HALOT
  rationale: 하나님이 실제 냄새를 즐기신다는 뜻이 아니라 받아들이심을 나타내는 관용구이므로, ‘향기로운 향’으로 그 관용적 이미지를 살렸습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드린 제물
  - 불제
  lexicon: HALOT
  rationale: 히브리어 제의 용어 אִשֶּׁה를 한국어 성경에서 널리 쓰이는 ‘화제’로 옮겨, 제의적·공식적 울림을 보존했습니다.
theological_decisions:
