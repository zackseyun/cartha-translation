  rationale: 전통 교회어를 무비판적으로 덧씌우기보다, 제사장 임직 의식과 불로 드리는 제의라는 본문의 기능을 한국어로 명료하게 드러냈습니다.
  doctrine_reference: 'translation philosophy: source-direct, auditable terminology'
