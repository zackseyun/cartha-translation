  - 주님
  rationale: 본문의 신명기/제의적 하나님의 이름을 음역해, 텍스트가 지닌 고유한 언약 명칭을 드러내기 위함입니다.
  doctrine_reference: project glossary default for יהוה / YHWH
- issue: 제사 용어의 현대 한국어 처리
  chosen_reading: 임직 제물, 화제
  alternative_readings:
  - 위임 제물, 불로 드린 제물
  - 성별 제물, 번제물
  rationale: 전통 교회어를 무비판적으로 덧씌우기보다, 제사장 임직 의식과 불로 드리는 제의라는 본문의 기능을 한국어로 명료하게 드러냈습니다.
  doctrine_reference: 'translation philosophy: source-direct, auditable terminology'
