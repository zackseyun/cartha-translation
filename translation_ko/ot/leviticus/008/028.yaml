review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 원문의 제단과 번제물의 위치 관계(‘제단 위에서, 번제물 위에’)를 더 분명히 해야 하며, לְרֵיחַ נִיחֹחַ는 ‘향기로운 향을 위한’보다 ‘향기로운 냄새가 되도록’으로 옮기는 것이 자연스럽고 충실합니다. אִשֶּׁה의 각주는 해당 용어에 붙어야 합니다.
  naturalness: 초안의 ‘번제 위, 곧 제단 위’는 번제와 제단을 동격처럼 처리하여 어색하고 의미 관계를 흐립니다. ‘향기로운 향’도 중복적입니다. 수정문은 현대 표준 한국어 합쇼체를 유지하면서 제의 문맥을 명료하게 전달합니다.
  terminology: מִלֻּאִים의 ‘임직 제물’은 문맥상 수용 가능하며, ‘위임 제물’을 대안으로 남깁니다. אִשֶּׁה는 현대적으로 ‘불로 드리는 제물’로 옮기고, 전통적 용어 ‘화제’를 각주 대안으로 제시합니다. יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘번제 위, 곧 제단 위’라는 위치 표현
    rationale: עַל הָעֹלָה는 제단과 동격이 아니라 번제물 위에 놓였음을 뜻합니다. 원문은 제단에서 번제물 위에 태운 행위를 말합니다.
  - severity: medium
    issue: ‘향기로운 향[b]’에 붙은 각주와 אִשֶּׁה의 번역
    rationale: 초안의 b 각주는 향기 표현의 대안만 제시하지만, 원문의 기술 제의어 אִשֶּׁה에 대한 대안은 제공하지 않습니다. ‘불로 드리는 제물’에 각주를 붙여 앵커와 내용을 일치시킵니다.
  - severity: low
    issue: ‘향기로운 향을 위한’
    rationale: 한국어에서는 다소 중복적이고 부자연스럽습니다. לְרֵיחַ נִיחֹחַ의 목적·결과 용법을 ‘향기로운 냄새가 되도록’으로 자연스럽게 반영할 수 있습니다.
  revised_text: 모세는 그들의 손바닥 위에서 그것들을 받아 제단 위의 번제물 위에 태웠습니다. 그것들은 향기로운 냄새가 되도록 드리는 임직 제물이었으며, 야훼께 불로 드리는 제물[b]이었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘위임 제물’로 옮길 수 있습니다. 히브리어 מִלֻּאִים은 제사장 임직 의식에서 드려지는 제물을 가리키는 전문 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화제’입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 공간 관계를 ‘제단 위의 번제물 위에’로 바로잡고, 제의 관용구를 자연한 한국어로 조정했습니다. 또한 b 각주를 אִשֶּׁה에 연결하여 각주 앵커와 어휘 대안이 일치하게 했습니다. a 각주는 본문에 표지가 없었으므로 삭제했으며, 각주 세트의 불필요한 비연결 항목을 피했습니다.
