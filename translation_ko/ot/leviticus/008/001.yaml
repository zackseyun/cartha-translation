translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 ‘YHWH’를 사용합니다. 전통적으로는 ‘the LORD’로 옮기지만, 여기서는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 דּבר는 단순한 발화보다 공식적이고 권위 있는 ‘말씀하다’에 가깝기 때문에, 현대 한국어에서도 하나님의 발화를 자연스럽게 드러내는 ‘말씀하셨습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와가 아닌 하나님의 고유명 יְהוָה이므로, 프로젝트 기본값에 따라 음역형 ‘야훼’로 옮겨 이름 자체를 보존했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - -께
  - -한테
  lexicon: HALOT
  rationale: 말의 수신자를 나타내는 אֶל은 현대 한국어에서 가장 자연스러운 조사 ‘-에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: —라고
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 다음 절의 직접인용을 여는 관용구이므로, 현대 한국어에서 군더더기 없이 이어 주는 ‘—라고’를 사용했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 직함이 아니라 언약적 고유명 יְהוָה를 사용하므로, 전통적 대체어 ‘주님’ 대신 고유명을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
