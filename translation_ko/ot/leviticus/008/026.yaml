base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
  footnotes:
  - marker: a
    text: Or 'one cake mixed with oil.' The Hebrew phrase may describe bread prepared with oil, but the exact method is not explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누룩 없는 떡의 광주리에서—그것이 야훼 앞에 있던 것이었습니다—그는 누룩 없는 과자 하나, 기름 넣은 떡 하나, 그리고 한 과자를 가져다가 그 기름기들과 오른쪽 넓적다리 위에 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기름 넣은 떡은 히브리어 구문상 ‘기름과 관련된 떡’일 수 있으나, 정확한 준비 방식은 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  english_pob_choice: from the basket of unleavened bread
  chosen_korean: 누룩 없는 떡의 광주리에서
  alternatives_korean:
  - 누룩 없는 빵의 광주리에서
  - 무교병 광주리에서
  lexicon: HALOT
  rationale: מִן + סַל은 출처를 나타내므로 ‘광주리에서’로 옮기고, הַמַּצּוֹת는 제의 문맥의 관용적 한국어를 고려해 ‘누룩 없는 떡’으로 자연스럽게 옮겼습니다.
- source_word: חַלַּת מַצָּה אַחַת
  english_pob_choice: one unleavened cake
  chosen_korean: 누룩 없는 과자 하나
  alternatives_korean:
  - 누룩 없는 떡 하나
  - 무교병 하나
  lexicon: HALOT
  rationale: חַלָּה는 납작한 제의용 빵 조각을 가리키므로, 한국어에서는 덩어리감이 적은 ‘과자’가 형식상 가장 가깝지만, 문맥상 더 익숙한 ‘떡’도 가능해 둘 사이의 긴장을 남겼습니다.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  english_pob_choice: one cake of bread with oil
  chosen_korean: 기름 넣은 떡 하나
  alternatives_korean:
  - 기름 섞은 떡 하나
  - 기름 바른 떡 하나
  - 기름을 곁들인 떡 하나
  lexicon: HALOT
  rationale: לֶחֶם שֶׁמֶן은 기름과 관련된 빵이지만 정확한 제조법은 분명하지 않으므로, 영어 주석의 유보를 따라 과도한 구체화를 피하고 ‘기름 넣은 떡’으로 옮겼습니다.
- source_word: רָקִיק אֶחָד
  english_pob_choice: one wafer
  chosen_korean: 한 과자
  alternatives_korean:
  - 한 얇은 떡
  - 한 웨이퍼
  lexicon: HALOT
  rationale: רָקִיק은 얇고 바삭한 제물용 납작빵이어서, 현대 한국어에서는 간결한 ‘과자’가 형태적 얇음을 살리지만 제의적 기능도 완전히 지우지 않도록 했습니다.
- source_word: וַיָּשֶׂם עַל הַחֲלָבִים וְעַל שׁוֹק הַיָּמִין
  english_pob_choice: and put them on the fat portions and on the right thigh
  chosen_korean: 그리고 그 기름기들과 오른쪽 넓적다리 위에 놓았습니다
  alternatives_korean:
  - 그리고 그 기름 부분들과 오른쪽 넓적다리 위에 놓았습니다
  - 그리고 그 기름기와 오른쪽 넓적다리 위에 놓았습니다
  lexicon: HALOT
  rationale: 제의 문맥의 הַחֲלָבִים는 일반적 ‘기름기’가 아니라 제물의 지정된 지방 부분이므로 복수성을 반영해 ‘기름기들’로 옮겼고, שׁוֹק הַיָּמִין은 여기서 ‘오른쪽 넓적다리’가 가장 직접적입니다.
