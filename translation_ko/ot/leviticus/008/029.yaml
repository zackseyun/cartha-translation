id: LEV.8.29
reference: Leviticus 8:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'from the ram of consecration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 그 가슴 부위를 가져와 야훼 앞에서 요제로 흔들어 바쳤습니다. 그것은 야훼께서 모세에게 명령하신 대로, 위임식 숫양[a]에서 나온 모세의 몫이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별식의 숫양’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: Then Moses took
  chosen_korean: 그러자 모세가 가져와
  alternatives_korean:
  - 그리고 모세가 가져와
  - 그때 모세가 가져와
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol을 한국어의 자연스러운 선행 흐름인 ‘그러자’로 옮겨, 단순한 과거 동작을 유지했습니다.
- source_word: הֶחָזֶה
  english_pob_choice: the breast
  chosen_korean: 가슴 부위
  alternatives_korean:
  - 가슴
  - 흉부
  lexicon: HALOT
  rationale: 제사 문맥에서 특정 제의 분량을 가리키는 말이므로, 인체의 일반적 ‘가슴’보다 제물의 분량임이 드러나는 ‘가슴 부위’로 옮겼습니다.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  english_pob_choice: waved it as a wave offering
  chosen_korean: 흔들어 요제물로 드렸습니다
  alternatives_korean:
  - 요제로 흔들어 드렸습니다
  - 요제물로 흔들어 바쳤습니다
  lexicon: HALOT
  rationale: 동사와 명사를 함께 살려 제의적 ‘흔듦’과 기술적 용어 ‘요제’의 결합을 보존했습니다.
- source_word: מֵאֵיל הַמִּלֻּאִים
  english_pob_choice: from the ram of ordination
  chosen_korean: 안수 제물의 숫양에서
  alternatives_korean:
  - 임직의 숫양에서
  - 성별 예식의 숫양에서
  lexicon: HALOT
  rationale: מִלֻּאִים은 레위기 8장의 제사장 위임 예식 맥락을 반영하므로, 직역성만 유지하기보다 절 전체의 기능을 살린 ‘안수 제물’로 풀어 옮겼습니다.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  english_pob_choice: It was Moses' portion
  chosen_korean: 모세의 몫이었습니다
  alternatives_korean:
  - 모세에게 할당된 몫이었습니다
  - 모세의 분깃이었습니다
  lexicon: HALOT
  rationale: מָנָה의 분배된 몫이라는 뜻을 자연스럽게 살리되, 제의 분배 문맥을 분명히 하기 위해 ‘몫’을 택했습니다.
theological_decisions:
- issue: יהוה의 처리
  chosen_reading: 본문과 보고 문맥에 따라 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절의 מקור 텍스트가 יהוה를 직접 사용하므로, 프로젝트 기본어에 따라 고유명사인 야훼를 유지했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
- issue: 제사장 위임 예식의 핵심 용어 מִלֻּאִים
  chosen_reading: ‘안수 제물’로 풀어 제의 기능을 드러냈습니다.
  alternative_readings:
  - 임직
  - 성별
  rationale: 레위기 8장의 맥락에서 이 표현은 단순한 추상적 임명보다 제사장 위임을 위한 구체적 예식과 연결되므로, 독자가 기능을 즉시 이해하도록 했습니다.
  doctrine_reference: Priestly installation context in Leviticus 8
