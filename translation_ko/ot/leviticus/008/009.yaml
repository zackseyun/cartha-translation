base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'the sacred diadem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 머리에 관을 씌우고, 그 관의 앞면에 금판, 곧 거룩한 관[a]을 달았습니다. 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성스러운 면류관’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּצְנֶפֶת
  english_pob_choice: turban
  chosen_korean: 관
  alternatives_korean:
  - 터번
  - 머리쓰개
  - 머리관
  lexicon: HALOT
  rationale: 제사장 예복의 특정 머리쓰개를 가리키므로, 한국어로는 기능이 드러나는 ‘관’을 택해 제의적 맥락을 살렸습니다. ‘터번’은 외래어 느낌이 강하고, ‘머리쓰개’는 너무 일반적입니다.
- source_word: אֶל מוּל פָּנָיו
  english_pob_choice: on the front of
  chosen_korean: 관의 앞쪽에
  alternatives_korean:
  - 앞면에
  - 그의 얼굴 맞은편에
  - 관 앞에
  lexicon: HALOT
  rationale: 금판의 부착 위치를 가리키는 표현이므로, 단순한 방향보다 부착 위치가 분명한 ‘앞쪽에’로 옮겼습니다.
- source_word: צִיץ
  english_pob_choice: plate
  chosen_korean: 금판
  alternatives_korean:
  - 판
  - 장식판
  - 꽃장식
  lexicon: HALOT
  rationale: 문맥상 금으로 만든 제사장 장식품이므로 소재와 기능이 함께 드러나는 ‘금판’이 가장 자연스럽습니다.
- source_word: נֵזֶר הַקֹּדֶשׁ
  english_pob_choice: the holy crown
  chosen_korean: 거룩한 관
  alternatives_korean:
  - 성스러운 면류관
  - 거룩한 왕관
  - 성결한 관
  lexicon: HALOT
  rationale: צִיץ를 설명하는 동격 표현으로 이해하여, 영어 POB의 의미를 따라 제의적 성별을 드러내는 ‘거룩한 관’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 한국어 표준 프로젝트 용례에 따라 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 제사장 머리 장식의 한국어 화법
  chosen_reading: ‘관’과 ‘금판’을 사용해 제의적 위엄과 장식의 기능을 함께 드러냈습니다.
  alternative_readings:
  - ‘터번’과 ‘판’을 직역식으로 유지하는 읽기
  - ‘면류관’으로 왕권적 이미지를 강화하는 읽기
  rationale: 이 절은 아론의 예복을 묘사하는 문맥이므로, 왕관보다 제사장 직분의 성별을 드러내는 표현이 필요합니다. 동시에 너무 일반적인 머리쓰개로 낮추지 않도록 ‘관’을 선택했습니다.
  doctrine_reference: 출애굽기 28:36-38; 레위기 8:9
