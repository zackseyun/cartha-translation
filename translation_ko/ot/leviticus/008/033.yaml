id: LEV.8.33
reference: Leviticus 8:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
  footnotes:
  - marker: a
    text: Literally, 'fill your hand,' a Hebrew idiom for ordaining or installing someone into priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 이레 동안, 곧 너희 임직 기간이 끝나는 날까지 회막 입구를 떠나서는 안 됩니다. 이는 그가 이레 동안 너희를 임직시킬 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너희 손을 채우다’입니다. 이는 제사장 직분에 세우거나 임직시키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פֶּתַח
  english_pob_choice: from the entrance
  chosen_korean: 입구에서
  alternatives_korean:
  - 문에서
  - 출입구에서
  lexicon: HALOT
  rationale: 문맥상 성막의 접근 지점을 가리키므로, 현대 한국어에서는 자연스럽고 직역성도 있는 ‘입구’를 택했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회중의 성막
  alternatives_korean:
  - 만남의 장막
  - 회막
  lexicon: HALOT
  rationale: 이 표현은 성소의 고유 명칭이므로, 의미를 드러내는 직역적 형태로 옮겼습니다. ‘회중의 성막’은 예배 회집 공간이라는 기능과 연결되며, 전통적 ‘회막’보다 원어의 투명성이 높습니다.
- source_word: יְמֵי מִלֻּאֵיכֶם
  english_pob_choice: the days of your ordination
  chosen_korean: 너희의 위임 기간의 날들
  alternatives_korean:
  - 너희의 임직 기간의 날들
  - 너희의 봉헌 기간의 날들
  lexicon: HALOT
  rationale: מִלֻּאִים은 제사장 직분 부여의 기술적 용어이지만, 한국어에서는 ‘위임’이 직분을 맡기고 세우는 의미를 가장 자연스럽게 전달합니다. ‘기간의 날들’은 히브리어의 복합 표현을 비교적 충실히 반영합니다.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  english_pob_choice: he will ordain you
  chosen_korean: 그가 너희를 위임할 것이기 때문입니다
  alternatives_korean:
  - 그가 너희 손을 채울 것이기 때문입니다
  - 그가 너희를 임직시킬 것이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 직유법 ‘손을 채우다’는 제사장 임직을 가리키는 관용구이므로, 한국어 본문에서는 의미를 분명히 하는 동사 ‘위임하다’로 옮겼습니다. 다만 동일 어근의 기술적 연결은 앞의 ‘위임 기간’에서 살렸습니다.
theological_decisions:
- issue: 제사장 임직 관용구의 처리
  chosen_reading: 본문에서는 ‘위임하다’로 의미를 드러내고, ‘손을 채우다’의 직유는 본문 밖에 두지 않았습니다.
  alternative_readings:
  - 그가 너희 손을 채울 것이기 때문입니다
  - 그가 너희를 임직시킬 것이기 때문입니다
  rationale: 이 절은 출입 금지 기간과 제사장 직분 부여를 규정하는 문맥이므로, 한국어 독자는 즉시 이해할 수 있는 표현이 필요합니다. 동시에 ‘위임’은 제사장직 수여의 공식성을 유지해 본문의 제의적 무게를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5
