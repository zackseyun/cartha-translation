base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: ko
  text: 그런 다음 모세는 아론과 그의 아들들을 가까이 데려오고 물로 그들을 씻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: brought ... near
  chosen_korean: 데려와 가까이 세우고
  alternatives_korean:
  - 가까이 데리고 오고
  - 앞으로 불러 세우고
  lexicon: HALOT
  rationale: Hiphil קרב의 핵심은 어떤 대상을 가까이 오게 하거나 가까이 세우는 것이므로, 의식적 맥락을 살려 ‘데려와 가까이 세우고’로 옮겼습니다.
- source_word: וַיִּרְחַץ
  english_pob_choice: washed
  chosen_korean: 씻겼습니다
  alternatives_korean:
  - 씻었습니다
  - 목욕시켰습니다
  lexicon: HALOT
  rationale: רחץ는 물로 씻는 행위를 뜻하므로, 의식적 정결 행위를 드러내되 과도하게 구체화하지 않는 ‘씻겼습니다’를 택했습니다.
- source_word: בַּמָּיִם
  english_pob_choice: with water
  chosen_korean: 물로
  alternatives_korean:
  - 물로서
  - 물 안에서
  lexicon: HALOT
  rationale: 히브리어 בְּ는 수단을 나타낼 수 있으므로, 한국어에서는 자연스러운 수단 표현인 ‘물로’가 가장 직접적입니다.
theological_decisions:
- issue: 임직 전 정결 의식의 서술을 어떻게 전달할지
  chosen_reading: 아론과 그의 아들들이 제사장 직분에 들어가기 전, 모세가 그들을 가까이 세우고 씻기는 의식적 정결 행위로 옮겼습니다.
  alternative_readings:
  - 단순한 개인 위생 행위로 읽을 수 있게 번역
  - 상징성을 약화시켜 일반적인 세척으로만 번역
  rationale: 문맥상 이는 레위기 8장의 제사장 임직 절차이므로, 단순 세척이 아니라 의식적 정결과 구별의 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: 레위기 8장 제사장 임직과 정결 규례
