revisions:
- from: 그것을 잡아 죽이고, 모세가 그 피를 가져다가 자신의 손가락으로 제단의 뿔들에 둘레에 바르고, 제단을 정결하게 하였으며, 그 피를 제단의 밑받침에 쏟아 붓고, 그것을 속죄하기 위해 거룩하게 하였습니다.
  to: 그것을 잡아 죽였습니다. 모세는 그 피를 가져다가 자기 손가락으로 제단의 뿔들 사방에 바르고, 제단을 정결하게 하였습니다[a]. 또 그 피를 제단 밑받침에 쏟아 붓고, 제단을 성별하여 그 위에서 속죄가 이루어지도록 하였습니다[b].
  rationale: 문법 오류를 바로잡고, 모든 동작의 주체가 모세임을 자연스러운 한국어 문장 구조 안에서 유지했습니다. ‘정결하게 하다’와 ‘성별하다’를 구별했으며, 마지막 목적구는 제단을 가리키는 대명사와 עַל의 관계를 보존하도록 ‘그 위에서 속죄가 이루어지도록’으로 옮겼습니다. 이는 제단 자체가 속죄 대상이라는 제의적 표현을 특정 교리로 해석하지 않고 충실히 반영합니다.
  reviewer_model: gpt-5.6-terra
