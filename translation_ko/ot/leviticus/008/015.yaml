id: LEV.8.15
reference: Leviticus 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
  footnotes:
  - marker: a
    text: Or 'he cleansed the altar.' The Hebrew verb in this ritual context means to purify from impurity, not to cause to sin.
    reason: lexical_alternative
  - marker: b
    text: Or 'to make expiation for it' or 'to purge it.' The Hebrew verb carries sacrificial purification/atonement sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 잡아 죽이고, 모세가 그 피를 가져다가 자신의 손가락으로 제단의 뿔들에 둘레에 바르고, 제단을 정결하게 하였으며, 그 피를 제단의 밑받침에 쏟아 붓고, 그것을 속죄하기 위해 거룩하게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁחָט
  english_pob_choice: he slaughtered it
  chosen_korean: 그것을 잡아 죽이고
  alternatives_korean:
  - 그것을 도살하고
  - 그것을 죽이고
  lexicon: HALOT
  rationale: 제사 문맥의 שָׁחַט는 일반적 ‘죽이다’보다 제의적 도살을 가리키므로, 한국어에서는 자연스러우면서도 의식 행위를 드러내는 ‘잡아 죽이다’를 택했습니다.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  english_pob_choice: he purified the altar
  chosen_korean: 제단을 정결하게 하였으며
  alternatives_korean:
  - 제단을 깨끗하게 하였으며
  - 제단을 속죄하였으며
  lexicon: HALOT
  rationale: 사제적 정화 문맥의 חטא는 ‘죄를 짓다’가 아니라 불결을 제거해 정결케 하는 뜻이므로, POB의 ‘purified’에 맞춰 ‘정결하게 하다’로 옮겼습니다.
- source_word: וַיְקַדְּשֵׁהוּ
  english_pob_choice: and consecrated it
  chosen_korean: 그것을 속죄하기 위해 거룩하게 하였습니다
  alternatives_korean:
  - 그것을 성별하였습니다
  - 그것을 거룩하게 하였습니다
  lexicon: HALOT
  rationale: קדשׁ는 제의적으로 구별해 거룩한 용도로 돌리는 뜻이므로 기본값은 ‘성별하다’이나, 여기서는 뒤의 כפר와 연결된 목적을 살려 ‘거룩하게 하다’에 목적구를 붙였습니다.
- source_word: לְכַפֵּר עָלָי/ו
  english_pob_choice: to make atonement for it
  chosen_korean: 속죄하기 위해
  alternatives_korean:
  - 그것에 대해 속죄하기 위해
  - 그것을 위해 속죄하기 위해
  lexicon: HALOT
  rationale: כפר는 제의적 속죄/정화의 핵심 용어이므로 ‘속죄하다’를 유지했습니다. 한국어에서는 대상을 반복하기보다 목적 표현으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 제단을 향한 속죄의 대상과 방향
  chosen_reading: 그것을 속죄하기 위해
  alternative_readings:
  - 그것에 대해 속죄하기 위해
  - 그것을 위해 속죄하기 위해
  rationale: 히브리어는 제단을 대상화하여 그 위에 속죄 행위를 행하는 제의적 표현을 사용합니다. 한국어에서는 ‘for it/on it’의 긴장을 과도하게 해소하지 않고 목적구로 유지했습니다.
  doctrine_reference: Translation philosophy §6
