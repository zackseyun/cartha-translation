  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
  footnotes:
  - marker: a
    text: Or “the basket of consecration offerings.” The Hebrew term refers to the offerings associated with the priests’ installation rite.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 아론과 그의 아들들에게 말했습니다. “고기를 회막 어귀에서 삶으십시오. 거기에서 그 고기와 임직식 제물 바구니[a]에 있는 빵을 먹으십시오. 내가 ‘아론과 그의 아들들이 그것을 먹어야 한다’고 명령한 대로 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별 제물 바구니’. 히브리어 מִלֻּאִים은 제사장 임직 의식과 관련된 제물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  english_pob_choice: Boil
  chosen_korean: 삶으십시오
  alternatives_korean:
  - 끓이십시오
  - 조리하십시오
  lexicon: HALOT
  rationale: 제사 문맥의 בשׁל은 단순한 조리가 아니라 물에 삶는 뜻이 강하므로, 현대 한국어에서도 가장 직접적인 동사인 ‘삶다’로 옮겼습니다.
- source_word: הַבָּשָׂר
  english_pob_choice: the meat
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 살
  lexicon: HALOT
  rationale: 희생제물의 식용 부분을 가리키므로 ‘고기’가 자연스럽고, 한국어에서 ‘육체’나 ‘살’은 문맥상 부적절합니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 어귀에서
  alternatives_korean:
  - 회막 입구에서
  - 회막의 문에서
  lexicon: HALOT
  rationale: 모임의 장막을 가리키는 정형 표현을 한국어 성경 어법에 맞게 ‘회막’으로 두고, פֶּתַח는 ‘어귀’로 비교적 직접적으로 옮겼습니다.
- source_word: סַל הַמִּלֻּאִים
  english_pob_choice: the basket of ordination offerings
  chosen_korean: 관유물 바구니
  alternatives_korean:
  - 임직 제물 바구니
  - 봉헌물 바구니
  - 안수식 바구니
  lexicon: HALOT
  rationale: מִלֻּאִים은 아론과 그의 아들들의 제사장 설치 의식을 가리키므로, POB의 해설을 따라 ‘임직/관유’ 계열 의미를 살리되, 제물 자체를 덧붙이기보다 문맥상 묶음인 ‘바구니’와 결합해 간결하게 처리했습니다.
- source_word: אַהֲרֹן וּבָנָי/ו יֹאכְלוּהוּ
  english_pob_choice: Aaron and his sons shall eat it
  chosen_korean: 아론과 그의 아들들이 그것을 먹을 것이다
  alternatives_korean:
  - 아론과 그의 아들들이 그것을 먹습니다
  - 아론과 그의 아들들이 그것을 먹어야 합니다
  lexicon: HALOT
  rationale: 직설적 명령이 아니라 인용된 규정의 미래형이므로, 한국어에서도 서술적 미래 ‘먹을 것이다’를 사용해 지시의 형식을 보존했습니다.
theological_decisions:
- issue: מִלֻּאִים의 의례적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: 제사장 임직을 가리키는 의례라는 점을 문맥으로 보존하면서, 본문에는 ‘관유물 바구니’라고 두어 너무 교회적 용어로 치우치지 않게 했습니다.
  alternative_readings:
  - 임직 제물 바구니
  - 봉헌물 바구니
  - 관유 제물 바구니
  rationale: 이 절은 레위기 제사장 설치 예식의 세부 지시이므로, 후대 교회 용어를 자동 대입하기보다 원문의 제의적 상황을 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
