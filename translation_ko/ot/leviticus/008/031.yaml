  rationale: ‘관유물’을 원문의 제사장 임직 의례를 가리키는 ‘임직식 제물’로 바로잡고, 각주를 해당 어휘에 붙였습니다. ‘그것’을 앞선 고기의 지시어로 명료화했으며, 히브리어의 인용된 규정이 지닌 의무적 지시를 자연스러운 합쇼체 명령문으로 옮겼습니다.
