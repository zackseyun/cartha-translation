  source_fidelity: 핵심 동사 ‘삶으십시오’, ‘고기’, ‘회막 어귀’는 히브리어 본문에 충실합니다. 그러나 ‘관유물’은 מִלֻּאִים(제사장 임직/위임 의식)를 가리키지 않으며, 관유(기름 부음)와 혼동될 수 있어 원문 의미를 잘못 전달합니다. 끝의 인용 명령도 한국어에서 자연스럽고 지시적인 형태로 정리할 필요가 있습니다.
  naturalness: 현행 ‘그것과, … 빵을’ 및 ‘내가 명령하여 말한 대로, …라고 한 그대로입니다’는 부자연스럽고, 모세의 직접 발화가 설명문처럼 끝납니다. 원문의 명령 구조를 유지하면서 현대 합쇼체로 매끄럽게 다듬었습니다.
  terminology: ‘회막’과 ‘고기’는 적절합니다. מִלֻּאִים은 ‘임직식’으로 옮기고, 해당 바구니가 의식에 속한 것임을 본문에서 ‘임직식 제물 바구니’로 밝혔습니다. 각주에는 가능한 대안인 ‘성별 제물 바구니’를 제시했습니다.
