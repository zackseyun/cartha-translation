id: LEV.8.16
reference: Leviticus 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֗ח אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וַ/יַּקְטֵ֥ר מֹשֶׁ֖ה הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
  footnotes:
  - marker: a
    text: Or 'the appendage of the liver'; the Hebrew term refers to a specific part of the liver removed in sacrificial preparation.
    reason: lexical_alternative
  - marker: b
    text: The verb can more specifically mean 'turned into smoke' or 'offered up in smoke' in sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 장기와 연결된 모든 기름[a], 곧 간의 엽, 두 콩팥과 그 기름[b]을 가져다가, 모세가 그것들을 제단 위에서 태워 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 제물 처리에서 떼어내는 특정 간 부위를 가리킵니다. 영어 POB의 주석처럼 ‘간의 엽/덧부분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 제의 문맥에서 ‘태워 바치다/연기로 올리다’의 뜻을 가질 수 있습니다. 여기서는 간결하게 ‘태워 바쳤습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  english_pob_choice: all the fat that was on the entrails
  chosen_korean: 장기와 연결된 모든 기름
  alternatives_korean:
  - 내장에 있는 모든 기름
  - 창자 위의 모든 기름
  lexicon: HALOT
  rationale: חֵלֶב은 제의 맥락에서 특정한 제물용 기름을 가리키므로 단순한 ‘기름’으로 옮기되, אֲשֶׁר עַל הַקֶּרֶב의 관계를 자연스럽게 풀어 ‘장기와 연결된’으로 처리했습니다.
- source_word: יֹתֶרֶת הַכָּבֵד
  english_pob_choice: the lobe of the liver
  chosen_korean: 간의 엽
  alternatives_korean:
  - 간의 덧부분
  - 간엽
  lexicon: HALOT
  rationale: 이 표현은 제의 해부학적 용어로 특정 부위를 가리키므로, 의미를 보존하면서도 한국어에서 과도하게 설명적이지 않은 ‘간의 엽’으로 옮겼습니다.
- source_word: שְׁתֵּי הַכְּלָיֹת וְאֶת חֶלְבְּהֶן
  english_pob_choice: the two kidneys and their fat
  chosen_korean: 두 콩팥과 그 기름
  alternatives_korean:
  - 두 신장과 그 기름
  - 두 콩팥과 콩팥의 기름
  lexicon: HALOT
  rationale: כְּלָיוֹת은 문맥상 해부학적 장기이므로 일상적이면서도 정확한 ‘콩팥’을 택했고, 소유대명사는 히브리어 구조를 따라 ‘그 기름’으로 간명하게 처리했습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: burned them
  chosen_korean: 태워 바쳤습니다
  alternatives_korean:
  - 불살라 바쳤습니다
  - 향기롭게 피워 올렸습니다
  lexicon: HALOT
  rationale: 제의 문맥의 קטר는 단순 소각보다 제사적 소각을 뜻하므로, ‘태워 바쳤습니다’로 번역해 행위의 제의적 성격을 드러냈습니다.
theological_decisions:
- issue: 제사 행위의 성격을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘태워 바쳤습니다’로 옮겨 단순 연소가 아니라 여호와께 드리는 제의 행위임을 보이게 했습니다.
  alternative_readings:
  - ‘태웠습니다’
  - ‘향으로 올렸습니다’
  rationale: 본문의 동사는 제단 위에서 드리는 제사 동작이므로, 한국어에서도 헌납성을 보존하는 표현이 필요합니다. 다만 본문 자체에 향기 표현은 없으므로 ‘향으로’는 넣지 않았습니다.
  doctrine_reference: 레위기 제사 규례
