  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
  footnotes:
  - marker: a
    text: Or 'assemble the whole assembly.' The Hebrew עֵדָה can be rendered 'congregation,' 'assembly,' or 'community' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 회중을 회막의 입구로 모으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온 회중을 소집하십시오.” 히브리어 עֵדָה는 문맥에 따라 “회중”, “집회”, “공동체”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  english_pob_choice: assemble
  chosen_korean: 모으십시오
  alternatives_korean:
  - 소집하십시오
  - 집합시키십시오
  - 모이게 하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 원인적 뉘앙스를 살리면서도, 한국어에서 자연스러운 명령 표현으로 옮겼습니다.
- source_word: כָּל הָ/עֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 회중 전체
  - 온 공동체
  lexicon: HALOT
  rationale: כָּל의 총체성을 간결하게 드러내기 위해 '온'을 택했고, עֵדָה는 여기서 예배적·언약적 집단을 가리키므로 '회중'이 가장 무난합니다.
- source_word: אֶל פֶּתַח
  english_pob_choice: at the entrance
  chosen_korean: 입구로
  alternatives_korean:
  - 출입문으로
  - 문간으로
  - 입구에
  lexicon: HALOT
  rationale: אֶל과 פֶּתַח의 결합은 위치 이동을 포함한 방향을 띠므로, 한국어에서는 목적지 방향을 자연스럽게 나타내는 '입구로'가 적합합니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 한국어 성경에서 이미 정착된 명칭인 '회막'을 사용하되, 원문의 정식 고유명사성을 보존합니다.
theological_decisions:
- issue: 회중(עֵדָה)의 지시 범위
  chosen_reading: 이스라엘 전체의 언약 공동체를 가리키는 집합적 표현으로 이해했습니다.
  alternative_readings:
  - 단순한 집회 인원
  - 예배 참여자 전원
  rationale: 제사장 문맥에서 עֵדָה는 임의의 군중이 아니라 야훼 앞에 소집되는 공동체를 뜻하므로, '회중'이 문맥상 적절합니다.
  doctrine_reference: 언약 공동체/예배 소집
