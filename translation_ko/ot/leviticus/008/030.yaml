id: LEV.8.30
reference: Leviticus 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
  footnotes:
  - marker: a
    text: Or 'and sanctified Aaron, his garments, his sons, and the garments of his sons with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 관유에서 조금과 제단 위에 있던 피에서 조금을 가져다가 아론과 그의 옷과 그의 아들들과 그와 함께한 그의 아들들의 옷에 뿌렸습니다. 그래서 그는 아론과 그의 옷과 그의 아들들과 그와 함께한 그의 아들들의 옷을 거룩하게 구별하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 아론과 그의 옷과 그의 아들들과 그와 함께한 그의 아들들의 옷을 거룩하게 구별하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן הַמִּשְׁחָה וּמִן הַדָּם
  english_pob_choice: took some of the anointing oil ... and some of the blood
  chosen_korean: 관유에서 조금과 ... 피에서 조금을 가져다가
  alternatives_korean:
  - 관유를
  - 관유 가운데서 조금을
  lexicon: HALOT
  rationale: מִן이 반복되어 ‘전부’가 아니라 ‘일부’를 취한다는 점을 드러내야 하므로, 한국어에서도 ‘조금’으로 양의 일부를 분명히 했습니다.
- source_word: וַיַּז
  english_pob_choice: sprinkled it
  chosen_korean: 뿌렸습니다
  alternatives_korean:
  - 뿌렸습니다 위에
  - 뿌렸습니다
  lexicon: HALOT
  rationale: 제의적 액체를 다루는 동사로서 한국어에서는 가장 자연스럽고 의식적 의미를 살리는 표현이 ‘뿌리다’입니다.
- source_word: וַיְקַדֵּשׁ
  english_pob_choice: so he consecrated
  chosen_korean: 거룩하게 구별하였습니다
  alternatives_korean:
  - 봉헌하였습니다
  - 성별하였습니다
  - 거룩하게 하였습니다
  lexicon: HALOT
  rationale: 제사장 위임 문맥의 קדשׁ는 단순한 내적 거룩함보다 성소 봉사에 따로 떼어 세우는 뜻이 강하므로, ‘거룩하게 구별하다’로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 자녀들
  - 아들들
  lexicon: HALOT
  rationale: 히브리어 복수 남성형을 그대로 반영해 아론의 남자 후손을 가리키는 뜻을 분명히 했습니다.
theological_decisions:
- issue: קדשׁ의 제의적 의미
  chosen_reading: ‘거룩하게 구별하다’로 옮겨, 성별과 위임의 의미를 함께 드러냅니다.
  alternative_readings:
  - 성별하다
  - 봉헌하다
  - 거룩하게 하다
  rationale: 이 구절은 아론과 그 제의 의복 및 아들들을 야훼의 성막 봉사에 따로 떼어 세우는 장면이므로, 결과보다 행위의 기능을 드러내는 번역이 적절합니다.
  doctrine_reference: 제의적 성별 개념
