id: LEV.8.2
reference: Leviticus 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
  footnotes:
  - marker: a
    text: Or, 'the bull for the purification offering.' The Hebrew term can refer to the offering associated with sin and ritual purification.
    reason: alternative_reading
translation:
  language: ko
  text: 아론과 그의 아들들과 그와 함께 있는 사람들[a], 그리고 옷들과 관유와 속죄제의 수송아지와 두 숫양과 무교병 바구니를 가져오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들과 함께’로도 옮길 수 있습니다. 히브리어는 아론과 함께하는 동반 관계를 분명히 표시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 데려오십시오
  - 가지고 오십시오
  lexicon: HALOT
  rationale: 제사 준비를 위한 직접 명령이므로, 한국어에서는 자연스러운 공손 명령형인 ‘가져오십시오’로 옮겨 원문의 명령성을 살렸습니다.
- source_word: בָּנָיו אִתּוֹ
  english_pob_choice: his sons with him
  chosen_korean: 그의 아들들과 그와 함께 있는 사람들
  alternatives_korean:
  - 그의 아들들과 함께
  - 그의 아들들과 그와 함께
  lexicon: HALOT
  rationale: אִתּוֹ의 동반 관계를 분명히 살리되, 한국어에서는 ‘그와 함께 있는 사람들’로 풀어 아론을 동반한 상태를 자연스럽게 드러냈습니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 기름부음유
  lexicon: HALOT
  rationale: 제의적·성경적 용례가 분명한 표현이므로, 한국어 성경 전통에서 널리 쓰이는 ‘관유’를 채택해 기름부음의 의례적 성격을 간결하게 반영했습니다.
- source_word: פַּר הַחַטָּאת
  english_pob_choice: the bull of the sin offering
  chosen_korean: 속죄제의 수송아지
  alternatives_korean:
  - 죄제의 수송아지
  - 속죄를 위한 수송아지
  lexicon: HALOT
  rationale: חַטָּאת는 제의 문맥에서 단순한 죄가 아니라 제물 자체를 가리킬 수 있으므로, 문맥상 제의적 의미를 살려 ‘속죄제’로 옮겼습니다.
- source_word: סַל הַמַּצּוֹת
  english_pob_choice: the basket of unleavened bread
  chosen_korean: 무교병 바구니
  alternatives_korean:
  - 누룩 없는 빵 바구니
  - 무교빵 바구니
  lexicon: HALOT
  rationale: מַצּוֹת는 누룩 없는 빵들을 가리키므로, 제의 맥락에 맞는 간결한 표현인 ‘무교병’으로 옮겼습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 죄제
  - 정결제
  rationale: 레위기 제의 문맥에서는 제물의 기능이 중심이므로, ‘죄’라는 추상 의미보다 제사 종류를 드러내는 ‘속죄제’가 본문 이해에 가장 직접적입니다.
  doctrine_reference: 제의 용어는 문맥에 따라 제사 종류를 드러내야 하며, 의미를 지나치게 평탄화하지 않습니다.
