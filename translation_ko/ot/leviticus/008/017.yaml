id: LEV.8.17
reference: Leviticus 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'its skin.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its excrement'; Hebrew פֶּרֶשׁ refers specifically to dung, not merely general refuse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그 수송아지와 그 가죽과 그 살과 그 배설물을 진 밖에서 불태웠습니다. 이는 야훼께서 모세에게 명령하신 대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 피부’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 똥’입니다. 히브리어 פֶּרֶשׁ는 일반적인 쓰레기가 아니라 구체적으로 배설물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 그 수송아지
  alternatives_korean:
  - 그 황소
  - 그 소
  lexicon: HALOT
  rationale: פָּר는 본문 맥락에서 제물로 바쳐진 수컷 소를 가리키므로, 한국어에서는 제물 맥락을 살리면서도 자연스러운 ‘수송아지’로 옮겼습니다.
- source_word: עֹרוֹ
  english_pob_choice: its hide
  chosen_korean: 그 가죽
  alternatives_korean:
  - 그 껍질
  - 그 피부
  lexicon: HALOT
  rationale: עוֹר는 동물의 외피를 뜻하므로, 제사 문맥에서 자연스러운 ‘가죽’으로 옮겼습니다. 영어 POB의 ‘hide/skin’ 구분을 한국어에서는 과도하게 분리하지 않았습니다.
- source_word: פִּרְשׁוֹ
  english_pob_choice: its dung
  chosen_korean: 똥
  alternatives_korean:
  - 분뇨
  - 배설물
  lexicon: HALOT
  rationale: פֶּרֶשׁ은 일반적 쓰레기보다 구체적으로 배설물/분변을 가리키므로, 본문의 물리적·직접적 의미를 살리는 ‘똥’이 가장 분명합니다.
- source_word: מִחוּץ לַמַּחֲנֶה
  english_pob_choice: outside the camp
  chosen_korean: 진 밖에서
  alternatives_korean:
  - 진영 밖에서
  - 캠프 밖에서
  lexicon: HALOT
  rationale: 광야 제의 문맥에서 ‘camp’는 관용적으로 ‘진’이 자연스럽고, 제의적 경계 바깥을 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신적 칭호가 아니라 계약적 고유명사 יְהוָה를 직접 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제물 처리의 완전한 소각과 순종의 강조
  chosen_reading: 제물을 진 밖에서 완전히 불태운 행위를, 야훼의 명령에 대한 정확한 순종으로 표현했습니다.
  alternative_readings:
  - 단순히 '태웠습니다'로만 옮겨 소각의 강도를 약화시키는 읽기
  - '''명령하셨습니다''만 남겨 수행의 순종성을 덜 드러내는 읽기'
  rationale: 히브리어 שָׂרַף בָּאֵשׁ는 단순한 소각이 아니라 불로 태워 없애는 행위를 가리키며, 끝의 כַּאֲשֶׁר צִוָּה는 모세의 행동이 명령에 정확히 일치했음을 강조합니다.
  doctrine_reference: 레위기 제사 규정의 정결·속죄 표상
