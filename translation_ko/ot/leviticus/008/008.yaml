base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
  footnotes:
  - marker: a
    text: Or 'the breastplate.' Hebrew חֹשֶׁן refers to the high priest's chest-piece; 'breastpiece' avoids suggesting armor.
    reason: lexical_alternative
  - marker: b
    text: '''Urim'' and ''Thummim'' are Hebrew ritual terms traditionally transliterated; their exact form and method of use are uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 흉패를 그에게 입히고, 우림과 둠밈을 그 흉패 안에 넣었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흉패’는 제사장이 가슴에 차는 장식을 가리킵니다. ‘흉갑’처럼 갑옷을 뜻하는 인상은 피합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우림’과 ‘둠밈’은 히브리어 제의 용어로, 정확한 형태와 사용 방식은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴패
  - 가슴장식
  - 흉갑
  lexicon: HALOT
  rationale: 제사장 복식의 전문 용어로서, 한국어 성경 전통과 현대 가독성을 함께 고려해 '흉패'를 택했습니다. '흉갑'은 갑옷 뉘앙스를 강하게 띠어 POB의 'breastpiece' 취지를 약화할 수 있습니다.
- source_word: וַיָּשֶׂם עָלָיו
  english_pob_choice: placed the breastpiece on him
  chosen_korean: 그에게 입히고
  alternatives_korean:
  - 그 위에 두고
  - 그에게 놓고
  - 그에게 얹고
  lexicon: HALOT
  rationale: 문맥이 아론의 제사장 복장을 입히는 장면이므로, 단순한 '놓다'보다 의복 착용을 드러내는 '입히다'가 원문의 기능을 더 자연스럽게 반영합니다.
- source_word: אֶל הַחֹשֶׁן
  english_pob_choice: into the breastpiece
  chosen_korean: 그 흉패에
  alternatives_korean:
  - 그 흉패 안에
  - 그 흉패 속에
  lexicon: HALOT
  rationale: ‘우림과 둠밈’을 흉패 내부에 넣는 행위를 한국어에서 가장 간결하게 드러내기 위해 '에'를 사용했습니다. 장소적 포괄을 유지하면서도 과도한 설명을 피합니다.
- source_word: הָאוּרִים וְאֶת הַתֻּמִּים
  english_pob_choice: the Urim and the Thummim
  chosen_korean: 우림과 둠밈
  alternatives_korean:
  - 우림과 둠밈들
  - 빛들과 완전함들
  - 우림과 툼밈
  lexicon: HALOT
  rationale: 두 용어는 정확한 기능이 불확실한 제의 용어이므로 음역을 유지했습니다. 한국어 교회 언어에서 널리 통용되는 형태를 따르되, 의미를 임의로 풀지 않았습니다.
theological_decisions:
- issue: 우림과 둠밈의 성격을 어떻게 드러낼지
  chosen_reading: 음역을 유지해 제의적 전문 용어로 남겼습니다.
  alternative_readings:
  - 빛과 완전함으로 번역
  - 신탁용 제비로 해석
  rationale: 본문은 이 물건들의 정확한 형상과 사용법을 설명하지 않으므로, 해석을 앞서지 않고 원문의 불확실성을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
