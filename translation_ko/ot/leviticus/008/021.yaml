id: LEV.8.21
reference: Leviticus 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or “an offering by fire to the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 내장과 다리는 물로 씻었습니다. 모세는 그 숫양 전부를 제단 위에서 불살랐습니다. 그것은 향기로운 냄새를 위한 번제이며, 야훼께 드리는 화제였습니다[a]. 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불로 드리는 제물”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַקֶּרֶב וְאֶת הַכְּרָעַיִם
  english_pob_choice: the entrails and the legs
  chosen_korean: 그 내장과 다리
  alternatives_korean:
  - 창자와 다리
  - 속부분과 다리
  lexicon: HALOT
  rationale: 제사 문맥의 내부 장기와 다리를 가리키므로, 한국어로는 자연스럽고 구체적인 ‘내장’과 ‘다리’가 가장 직접적입니다.
- source_word: רָחַץ בַּמָּיִם
  english_pob_choice: washed ... with water
  chosen_korean: 물로 씻었습니다
  alternatives_korean:
  - 물로 헹구었습니다
  - 물에 씻었습니다
  lexicon: HALOT
  rationale: מציין 실제 세척 행위를 드러내며, 의례적 정결의 구체성을 살리기 위해 ‘물로 씻었습니다’로 옮겼습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: burned
  chosen_korean: 불살랐습니다
  alternatives_korean:
  - 태웠습니다
  - 향으로 올렸습니다
  lexicon: HALOT
  rationale: 제의적 의미는 제단 위에서 태워 연기가 올라가게 하는 행위이므로, 현대 한국어에서는 ‘불살랐습니다’가 가장 자연스럽고 기능적으로 대응됩니다.
- source_word: עֹלָה ... אִשֶּׁה
  english_pob_choice: a burnt offering ... a food offering
  chosen_korean: 향기로운 번제, 곧 야훼께 드리는 화제
  alternatives_korean:
  - 향기로운 번제, 곧 야훼께 드리는 불제사
  - 향기로운 번제, 곧 야훼께 드리는 불로 드리는 제물
  lexicon: HALOT
  rationale: ‘번제’는 עֹלָה의 통용 번역을 유지하되, אִשֶּׁה는 제단 불로 드리는 제물이라는 점을 드러내기 위해 POB의 ‘food offering’에 상응하는 ‘화제’를 택했습니다.
- source_word: לַיהוָה / יְהוָה
  english_pob_choice: to Yahweh / Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문에 나타난 신명은 번역상의 치환어가 아니라 고유명으로 처리해야 하므로, 이 프로젝트의 기본 용례대로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제의적 관용구 לְרֵיחַ נִיחֹחַ의 처리
  chosen_reading: 향기로운 번제
  alternative_readings:
  - 향기로운 향
  - 기쁘게 받으실 향기
  rationale: 직역하면 ‘기분 좋은 향기’를 뜻하지만, 문맥상 제사의 수용성과 하나님께 열납됨을 나타내는 관용구이므로 한국어에서는 자연스러운 ‘향기로운 번제’로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve cultic metaphor and divine acceptance without flattening it into a modern abstraction'
