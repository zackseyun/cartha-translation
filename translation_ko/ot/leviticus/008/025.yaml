  source_fidelity: ‘가져갔습니다’는 화자로부터 멀어지는 이동을 뜻하여 히브리어 וַיִּקַּח(‘그가 취하였다’)의 단순한 취함과 맞지 않습니다. 또한 קֶרֶב는 여기서 ‘창자’만이 아니라 제물의 내장/내부 장기를 포괄하므로 ‘내장’이 더 충실합니다. 나머지 부위 열거와 순서는 원문에 잘 부합합니다.
  naturalness: ‘그것들의 기름’은 현대 한국어에서 다소 어색합니다. ‘두 콩팥과 그 기름’이 자연스럽고 의미도 보존합니다. 어휘 주석은 ‘간의 붙은 부분’보다 ‘간의 부속 부분’이 더 자연스럽습니다.
