source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
  footnotes:
  - marker: a
    text: Or 'the appendage of the liver' for 'the lobe of the liver.' The Hebrew term refers to a specific part removed in sacrificial procedure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 기름과 기름진 꼬리와 창자 위에 있는 모든 기름과 간의 엽과 두 콩팥과 그것들의 기름과 오른쪽 넓적다리를 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간의 붙은 부분’으로 옮길 수 있습니다. 히브리어 용어는 제사 절차에서 떼어 내는 특정 부위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름기
  lexicon: HALOT
  rationale: 제사 문맥의 הַחֵלֶב는 일반적인 식용 지방이 아니라 제의적으로 구별되는 기름기 부분이어서, 한국어 성경 전통과도 맞는 ‘기름’이 가장 자연스럽습니다.
- source_word: הָאַלְיָה
  english_pob_choice: the fat tail
  chosen_korean: 기름진 꼬리
  alternatives_korean:
  - 지방 꼬리
  - 기름꼬리
  lexicon: HALOT
  rationale: 양의 특정한 지방성 꼬리를 가리키므로 의미를 드러내되, 본문 흐름을 위해 ‘기름진 꼬리’로 옮겼습니다.
- source_word: יֹתֶרֶת הַכָּבֵד
  english_pob_choice: the lobe of the liver
  chosen_korean: 간의 엽
  alternatives_korean:
  - 간의 덧붙은 부분
  - 간의 돌출부
  lexicon: HALOT
  rationale: 히브리어는 간의 특정한 절제 부위를 가리키므로, POB의 해석을 따라 해부학적으로 중립적인 ‘엽’을 사용했습니다.
- source_word: שׁוֹק הַיָּמִין
  english_pob_choice: the right thigh
  chosen_korean: 오른쪽 넓적다리
  alternatives_korean:
  - 오른쪽 허벅지
  - 오른쪽 다리
  lexicon: HALOT
  rationale: 제사 부위로서의 שׁוֹק은 단순한 ‘다리’보다 상부 다리/넓적다리의 의미가 분명하므로, 보다 구체적인 ‘넓적다리’로 옮겼습니다.
theological_decisions:
- issue: 제사 희생물의 해부학적·의례적 용어를 현대 한국어로 어느 정도까지 구체화할지
  chosen_reading: 본문의 제의적 절차를 따라 각 부위를 구체적인 해부학 용어로 옮겼습니다.
  alternative_readings:
  - 일반화하여 ‘기름과 꼬리와 내장 위의 기름…’로 옮김
  - 전통적 제의어휘를 유지하여 ‘기름과 기름꼬리…’로 옮김
  rationale: 이 절은 제사 규정의 실제 처리 순서를 기록하므로, 모호한 일반어보다 원문의 부위를 가능한 한 분명히 드러내는 번역이 독자 이해에 더 충실합니다.
  doctrine_reference: 레위기 8장 제사 위임식 맥락
