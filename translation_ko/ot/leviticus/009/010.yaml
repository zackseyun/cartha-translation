  source_fidelity: 핵심 제의 용어들은 대체로 원문에 충실합니다. 다만 חַטָּאת(속죄제)에 대한 각주 표지가 문장 끝에 놓여 있어 선행어가 불명확하며, 원문의 '그가'라는 단수 행위 주체를 한국어 본문에서 명시하는 편이 안전합니다.
  naturalness: 초안의 '그 기름과, 그 콩팥들과'는 현대 한국어에서 부자연스럽고 쉼표도 불필요합니다. '속죄제에서 가져다가'는 제물 부위를 가져오는 별도 행위를 다소 부각합니다. '속죄제에서 나온'으로 결속을 분명히 하고, 병렬 명사는 단수형으로 자연스럽게 처리했습니다.
  terminology: ‘야훼’, ‘속죄제’, ‘기름’, ‘콩팥’은 적절합니다. 제의 문맥에서 통용되는 ‘간의 꺼풀’은 원문의 간에 딸린 돌출부/엽이라는 지시 대상을 과도하게 해부학적으로 확정하지 않으면서 보존합니다. ‘연기로 올렸습니다’도 הִקְטִיר의 제의적 의미를 잘 반영합니다.
