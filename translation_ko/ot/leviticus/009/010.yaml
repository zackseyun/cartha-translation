source:
  edition: WLC
  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'purification offering.' The Hebrew term can emphasize the offering's role in removing impurity as well as dealing with sin.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 기름과, 그 콩팥들과, 그 간의 꺼풀을 속죄제에서 가져다가, 야훼께서 모세에게 명령하신 대로 제단 위에서 연기로 올렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 용어는 죄를 다루는 동시에 부정함을 제거하는 제사로서의 기능도 강조할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  lexicon: HALOT
  rationale: 제사 문맥의 חֵלֶב은 제물의 지방 부분을 가리키므로, 한국어 성경 전통과 문맥을 함께 살려 ‘기름’으로 옮겼습니다.
- source_word: כְּלָיֹת
  english_pob_choice: kidneys
  chosen_korean: 콩팥들
  alternatives_korean:
  - 신장들
  - 콩팥
  lexicon: HALOT
  rationale: 해부학적 대상을 직접 가리키므로 구체성을 살려 ‘콩팥들’로 옮겼습니다.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  english_pob_choice: the lobe of the liver
  chosen_korean: 간의 꺼풀
  alternatives_korean:
  - 간의 엽
  - 간의 여분 꺼풀
  - 간의 덧부분
  lexicon: HALOT
  rationale: 히브리어의 ‘간에 속한/간에서 나온 덧붙은 부분’을 자연스러운 현대어로 풀어 ‘간의 꺼풀’로 처리하되, 해부학적 느낌은 유지했습니다.
- source_word: הִקְטִיר
  english_pob_choice: turned into smoke
  chosen_korean: 연기로 올렸습니다
  alternatives_korean:
  - 불살라 드렸습니다
  - 태워서 올렸습니다
  - 향기로 올렸습니다
  lexicon: HALOT
  rationale: 제사적 기동사로서 단순 소각이 아니라 제단 위로 연기가 올라가게 하는 행위를 가리키므로, ‘연기로 올렸습니다’가 의미를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: חַטָּאת의 제사 용어
  chosen_reading: 속죄제
  alternative_readings:
  - 죄제
  - 정결제
  rationale: 이 본문은 제사 제도 안의 분류를 다루므로, 독자에게 가장 익숙하면서도 문맥에 맞는 ‘속죄제’를 본문에 두고, 기능적 뉘앙스는 별도 주석 없이 과도하게 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §3; §5
- issue: 야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적/제사적 맥락에서 여호와 대체어가 아니라 고유명사 자체를 드러내는 것이 원문 감각에 더 가깝기 때문에 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Glossary default: יְהוָה → 야훼'
