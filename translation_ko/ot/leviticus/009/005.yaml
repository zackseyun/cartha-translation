id: LEV.9.5
reference: Leviticus 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: ko
  text: 그래서 그들은 모세가 명령한 것을 회막 앞에 가져왔고, 온 회중이 나아와 야훼 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 첫 번째 전치사구를 회막의 ‘앞’(공간적 위치)으로, 두 번째를 야훼 ‘앞’(예배적·언약적 현존)으로 구분합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: they brought
  chosen_korean: 가져왔고
  alternatives_korean:
  - 데려왔고
  - 가졌고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘취하다’가 아니라 지정된 장소인 회막 앞으로 이동시키는 뜻이므로, 방향성을 살린 ‘가져왔고’가 가장 자연스럽습니다.
- source_word: אֶל פְּנֵי אֹהֶל מוֹעֵד
  english_pob_choice: to the front of the tent of meeting
  chosen_korean: 회막 앞에
  alternatives_korean:
  - 회막 앞쪽에
  - 회막의 면전으로
  lexicon: HALOT
  rationale: אֶל פְּנֵי는 문자적으로 ‘~의 앞/얼굴로’라는 공간적 표현이므로, ‘회막 앞에’로 옮겨 목적지와 위치를 간결하게 드러냈습니다.
- source_word: כָּל הָעֵדָה
  english_pob_choice: all the congregation
  chosen_korean: 온 회중이
  alternatives_korean:
  - 온 회집단이
  - 모든 회중이
  lexicon: HALOT
  rationale: 제의 문맥의 עֵדָה는 단순한 군중이 아니라 함께 모인 언약 공동체를 가리키므로, POB의 ‘congregation’을 따라 ‘회중’으로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 주님 앞에
  lexicon: HALOT
  rationale: 본문의 여호와/יהוה는 POB의 원칙에 따라 ‘야훼’로 옮기고, לִפְנֵי는 공간적·예배적 긴장을 함께 살려 ‘앞에’로 처리했습니다.
theological_decisions:
- issue: 회막 앞과 야훼 앞의 구분
  chosen_reading: 회막 앞에 먼저 가져온 뒤, 온 회중이 야훼 앞에 섰다고 구분해 번역했습니다.
  alternative_readings:
  - 둘을 모두 단순히 ‘앞에’로 평탄화하는 번역
  - 두 표현을 모두 ‘면전’으로 격상하는 번역
  rationale: 히브리어는 אֶל פְּנֵי אֹהֶל מוֹעֵד와 לִפְנֵי יְהוָה를 구분해 사용하므로, 첫째는 장소적 접근, 둘째는 하나님 앞에 섬을 드러내는 표현으로 나누어 살렸습니다.
  doctrine_reference: 본문의 제의적 접근과 언약적 현존 구분
