lexical_decisions:
- source_word: וַיָּשִׂימוּ
  english_pob_choice: They placed
  chosen_korean: 그들은 … 놓았고
  alternatives_korean:
  - 그들은 … 두었고
  - 그들은 … 올려놓았고
  lexicon: HALOT
  rationale: שׂים의 기본 의미는 ‘두다/놓다/세우다’이며, 제의 동작을 자연스럽게 나타내기 위해 ‘놓다’를 택했습니다.
- source_word: הַחֲלָבִים
  english_pob_choice: the fat pieces
  chosen_korean: 기름 덩어리들
  alternatives_korean:
  - 기름 부분들
  - 기름
  lexicon: HALOT
  rationale: 제사 문맥의 חֵלֶב 복수형은 단순한 ‘기름’보다 떼어낸 제물의 부위를 가리키므로, 영어 POB의 구체성을 살려 ‘기름 덩어리들’로 옮겼습니다.
- source_word: עַל הֶחָזוֹת
  english_pob_choice: on the breasts
  chosen_korean: 가슴들 위에
  alternatives_korean:
  - 가슴 부분 위에
  - 가슴 위에
  lexicon: HALOT
  rationale: חָזֶה는 제의 해부학적 맥락에서 짐승의 가슴 부분을 뜻하므로, 직역에 가깝게 ‘가슴들’로 두되 한국어에서는 ‘위에’로 관계를 자연스럽게 했습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: he burned
  chosen_korean: 불살랐습니다
  alternatives_korean:
  - 연기로 올렸습니다
  - 향으로 피웠습니다
  lexicon: HALOT
  rationale: קטר는 제단 위에서 제물을 태워 연기로 올리는 행위이므로, 의미를 분명히 드러내는 ‘불살랐다’를 택했습니다.
theological_decisions:
- issue: 제의 동작을 한국어로 어떻게 드러낼지
  chosen_reading: ‘불살랐습니다’로 번역해, 단순 소각이 아니라 제단에서의 제사 행위임을 보이게 했습니다.
  alternative_readings:
  - ‘연기로 올렸습니다’
  - ‘향기롭게 드렸습니다’
  rationale: 히브리어 קטר는 제의적 소각을 가리키며, 본 절은 여호와께 드리는 제사 절차의 일부이므로 제의적 의미를 유지해야 합니다.
  doctrine_reference: 레위기 제사 규례의 문맥상 제물의 소각은 예배 행위입니다.
