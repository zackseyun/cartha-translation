source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
  footnotes:
  - marker: a
    text: Or 'your purification offering.' The Hebrew term חַטָּאת can refer to the sin offering, with emphasis in some contexts on purification from impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 아론에게 말했습니다. "제단으로 가까이 오십시오. 그리고 당신의 속죄제와 당신의 번제물을 바치고, 당신과 백성을 위해 속죄하십시오. 그런 다음 백성의 예물을 바치고, 그들을 위해 속죄하십시오. 야훼께서 명령하신 대로 하십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 정결 제물.’ 히브리어 חַטָּאת은 속죄제를 가리킬 수 있으며, 어떤 문맥에서는 부정으로부터의 정결에 더 강조가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב
  english_pob_choice: Come near
  chosen_korean: 가까이 오십시오
  alternatives_korean:
  - 다가오십시오
  - 나아오십시오
  lexicon: HALOT
  rationale: 제단을 향한 제의적 접근을 자연스러운 현대 한국어 명령형으로 옮기되, 단순한 이동보다 ‘제의적으로 다가감’의 느낌을 살렸습니다.
- source_word: חַטָּאתְךָ
  english_pob_choice: your sin offering
  chosen_korean: 당신의 속죄제
  alternatives_korean:
  - 당신의 죄 제물
  - 당신의 정결 제물
  lexicon: HALOT
  rationale: 문맥상 제물 자체를 가리키므로 한국 교계에서 익숙한 ‘속죄제’를 기본으로 택했습니다. POB의 ‘sin offering / purification offering’ 긴장은 본문 각주로만 유지했습니다.
- source_word: עֹלָתֶךָ
  english_pob_choice: your burnt offering
  chosen_korean: 당신의 번제물
  alternatives_korean:
  - 당신의 번제
  - 당신의 화제
  lexicon: HALOT
  rationale: עלה의 제의적 용법을 한국어 성경에서 널리 쓰는 ‘번제’로 옮기되, 제물의 측면을 분명히 하기 위해 ‘번제물’로 다듬었습니다.
- source_word: וְכַפֵּר
  english_pob_choice: make atonement
  chosen_korean: 속죄하십시오
  alternatives_korean:
  - 속죄를 행하십시오
  - 화해시키십시오
  lexicon: HALOT
  rationale: כפר의 제사장적 기능을 한국어 동사로 간결하게 살리면서도, POB가 보존한 ‘atonement’의 신학적 무게를 유지하기 위해 ‘속죄하다’ 계열을 사용했습니다.
- source_word: קָרְבַּן הָעָם
  english_pob_choice: the people's offering
  chosen_korean: 백성의 예물
  alternatives_korean:
  - 백성의 제물
  - 백성의 바침
  lexicon: HALOT
  rationale: קרבן은 ‘가까이 가져오는 바침’의 일반 명칭이므로, 제의적·헌물적 성격을 함께 담는 ‘예물’로 옮겼습니다. ‘백성의’는 소유격을 그대로 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기본형을 한국어 음역 ‘야훼’로 유지하여, 서술 속의 호칭으로 대체하지 않았습니다.
theological_decisions:
- issue: כפר의 제의적 의미를 한국어로 어떻게 보존할 것인가
  chosen_reading: ‘속죄하십시오’로 번역해 제의적·관계적 속죄의 의미를 함께 남겼습니다.
  alternative_readings:
  - 죄를 덮으십시오
  - 속죄를 행하십시오
  - 화목을 이루십시오
  rationale: 본문은 제사행위의 지시이지 교리 설명이 아니므로, POB가 유지한 넓은 속죄 의미를 과도하게 좁히지 않는 표현을 선택했습니다.
  doctrine_reference: 성소/제의 본문에서는 용어의 신학적 범위를 축소하지 말 것
- issue: חַטָּאת의 제물 명칭을 ‘속죄제’로 둘지 ‘정결제’로 둘지
  chosen_reading: 본문에는 ‘속죄제’를 두고, 대안 의미는 각주로 보존했습니다.
  alternative_readings:
  - 정결제
  - 죄제물
  rationale: 레위기 제사법에서 이 단어는 죄와 부정결을 함께 걸치므로, 익숙한 제의 용어를 본문에 두고 어휘적 긴장은 각주로 남기는 것이 가장 투명합니다.
  doctrine_reference: 어휘적 긴장을 평탄화하지 말 것
