id: LEV.9.19
reference: Leviticus 9:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
  footnotes:
  - marker: a
    text: Or 'from the bull.' The Hebrew שׁוֹר can refer broadly to cattle, and in sacrificial contexts may be rendered 'ox' or 'bull' depending on how specifically the translator wishes to mark the animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 수송아지와 숫양에게서 떼어 낸 기름기, 곧 기름진 꼬리와 덮는 기름, 콩팥들, 그리고 간의 껍질입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수송아지’는 שׁוֹר의 넓은 의미를 충분히 반영하지 않을 수 있습니다. 이 말은 넓게는 ‘소’, 더 구체적으로는 ‘황소’까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲלָבִים
  english_pob_choice: the fat pieces
  chosen_korean: 기름기
  alternatives_korean:
  - 기름덩이들
  - 기름진 부분들
  - 기름 조각들
  lexicon: HALOT
  rationale: 제사 목록에서 지정된 지방 부분을 가리키므로 단순한 ‘기름들’보다 기능을 드러내는 ‘기름기’로 옮겼습니다.
- source_word: מִן הַשּׁוֹר
  english_pob_choice: from the ox
  chosen_korean: 수송아지에게서
  alternatives_korean:
  - 황소에게서
  - 소에게서
  lexicon: HALOT
  rationale: 문맥상 제사용 짐승을 자연스럽게 드러내면서도, POB의 각주가 지적한 שׁוֹר의 넓은 범위를 반영해 너무 성별을 고정하지 않는 표현을 택했습니다.
- source_word: וּמִן הָאַיִל
  english_pob_choice: and from the ram
  chosen_korean: 숫양에게서
  alternatives_korean:
  - 수양에게서
  - 양에게서
  lexicon: HALOT
  rationale: אַיִל은 제의 문맥에서 ‘숫양’이 가장 분명합니다.
- source_word: הָאַלְיָה
  english_pob_choice: the fat tail
  chosen_korean: 기름진 꼬리
  alternatives_korean:
  - 기름 꼬리
  - 꼬리 지방
  lexicon: HALOT
  rationale: 제사용 양의 대표적인 지방 꼬리를 가리키므로, 독자가 바로 알아들을 수 있게 ‘기름진 꼬리’로 옮겼습니다.
- source_word: יֹתֶרֶת הַכָּבֵד
  english_pob_choice: the lobe of the liver
  chosen_korean: 간의 껍질
  alternatives_korean:
  - 간의 엽
  - 간의 한쪽 엽
  - 간의 덧부분
  lexicon: HALOT
  rationale: 히브리어는 간에 붙은 특정한 부위를 가리키며, 한국어로는 해부학적 생소함을 줄이기 위해 기능적으로 ‘간의 껍질’로 풀어 옮겼습니다.
theological_decisions:
- issue: 제사 규례의 해부학적 용어를 얼마나 직역할지
  chosen_reading: 본문의 열거 구조를 유지하되, 현대 독자가 이해할 수 있도록 ‘기름기 / 기름진 꼬리 / 덮는 기름 / 콩팥들 / 간의 껍질’로 자연화했습니다.
  alternative_readings:
  - ‘지방덩이들 / 지방 꼬리 / 덮는 지방 / 신장들 / 간의 엽’처럼 보다 해부학적으로 직역
  - 전통적 제의어를 살린 매우 문자적인 번역
  rationale: 제사 제물 목록은 정확한 항목 식별이 중요하므로, 의미를 희석하지 않으면서도 한국어로 즉시 읽히는 표현을 택했습니다.
  doctrine_reference: 레위기 제의 규례의 문맥상 정확성 우선
- issue: שׁוֹר의 범위
  chosen_reading: ‘수송아지’로 옮기되, 소 제물의 일반 범주를 완전히 좁히지 않도록 했습니다.
  alternative_readings:
  - ‘소’
  - ‘황소’
  - ‘황소/소’
  rationale: POB 각주가 밝히듯 שׁוֹר는 ‘ox/bull’ 범위를 가지므로, 한국어에서도 너무 특정한 성별을 강요하지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 비평이 아닌 어휘 범위의 문제
