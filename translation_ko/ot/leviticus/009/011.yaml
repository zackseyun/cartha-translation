lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 하지만
  lexicon: WLC discourse context
  rationale: 이 접속사는 10절의 제단 위 제물 처리와 대비되는 다음 절의 처분을 이어 주므로, 한국어에서는 문맥적 전환을 나타내는 '그런데'로 옮겼습니다.
- source_word: הַ/בָּשָׂר
  english_pob_choice: the flesh
  chosen_korean: 고기
  alternatives_korean:
  - 살
  - 육체
  lexicon: HALOT
  rationale: 제의적 문맥에서 בָּשָׂר는 제물의 물질적 잔여를 가리키므로 '고기'로 옮겨, 한국어에서 자연스럽고 구체적인 희생제물 표현을 살렸습니다.
- source_word: הָ/ע֑וֹר
  english_pob_choice: the hide
  chosen_korean: 가죽
  alternatives_korean:
  - 피부
  - 껍질
  lexicon: HALOT
  rationale: עוֹר는 동물의 피부/가죽을 뜻하므로, 제물 문맥에 가장 자연스러운 '가죽'을 선택했습니다.
- source_word: מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה
  english_pob_choice: outside the camp
  chosen_korean: 진영 밖에서
  alternatives_korean:
  - 진 밖에서
  - 야영지 밖에서
  lexicon: HALOT
  rationale: 이스라엘 공동체의 성소 중심 공간 바깥이라는 의례적·지리적 의미를 살리기 위해 표준적인 '진영 밖에서'로 옮겼습니다.
theological_decisions:
- issue: 제의적 처분을 상징화하지 않는 번역
  chosen_reading: 이 절의 불태움은 제사장적 절차로서의 실제 처분으로 간명하게 옮기고, 후대적 상징 의미는 덧붙이지 않았습니다.
  alternative_readings:
  - 속죄나 심판의 상징을 앞세운 해석적 번역
  rationale: 히브리어 본문은 제물의 남은 부분을 진영 밖에서 처리하는 행위를 직접 서술하므로, 본문의 제의적 행위를 있는 그대로 유지하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 우선 번역 원칙; 제의 본문의 의미를 해석으로 대체하지 않음
