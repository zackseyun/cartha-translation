translation:
  language: ko
  text: 그런데 고기와 가죽은 밖으로, 진영 밖에서 불에 태웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 고기와 가죽을 진영 밖에서 불에 태웠습니다.”
