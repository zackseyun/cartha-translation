  to: 그리고 야훼 앞에 화목제물로 바칠 소와 숫양과 기름에 섞은 곡식 제물을 가져오십시오[a]. 오늘 야훼께서 여러분에게 나타나실 것이기 때문입니다.
  rationale: 원문상 ‘야훼 앞에 바치다’가 화목제물인 소와 숫양에 연결되는 구조를 한국어 관계절로 명확히 했습니다. 명령의 동사는 앞 절에서 이어지는 제물 준비 지시를 한국어에서 완결된 문장으로 자연스럽게 표현한 것입니다. 야훼의 나타나심은 문맥상 임박한 미래이므로 ‘나타나실 것입니다’를 유지했습니다.
