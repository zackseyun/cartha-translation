id: LEV.9.4
reference: Leviticus 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD'; the divine name is יְהוָה (YHWH).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 소와 숫양을 화목제물로, 곧 야훼 앞에서 바치고, 기름에 섞은 곡식 제물을 드리십시오[a]. 오늘 야훼께서 여러분에게 나타나실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '교제 제물'이나 '평안 제물'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 수소
  lexicon: HALOT
  rationale: 제물 목록에서 שׁוֹר는 성별을 굳이 특정하지 않는 큰 소과를 가리키므로, 한국어에서는 가장 자연스럽고 과도하게 좁히지 않는 '소'로 옮겼습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 양
  - 수양
  lexicon: HALOT
  rationale: אַיִל은 제의 문맥에서 명확히 숫양이므로, 제물의 성별과 종을 분명히 드러내는 '숫양'이 가장 정확합니다.
- source_word: שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 화평제물
  - 평화제물
  - 교제 제물
  lexicon: HALOT
  rationale: 영어 POB의 'peace offerings'는 히브리어 שְׁלָמִים의 전통적 대응이지만, 한국어에서는 제의적 기능을 더 직접 드러내는 '화목제물'이 의미를 잘 전달합니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 곡식 예물
  - 소제
  - 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 곡물 제의를 가리키므로, 현대 독자가 이해하기 쉬우면서도 제물의 성격을 보존하는 '곡식 제물'을 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 신성 호칭이 아니라 직접적인 언약 이름이므로, POB 원칙에 따라 '야훼'로 옮겨 이름의 직접성을 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: יְהוָה נִרְאָה אֲלֵיכֶם의 시제
  chosen_reading: 오늘 야훼께서 여러분에게 나타나실 것입니다
  alternative_readings:
  - 오늘 야훼께서 여러분에게 나타나십니다
  - 오늘 야훼께서 여러분에게 나타나셨습니다
  rationale: 히브리어 완료형이지만 이 문맥에서는 곧 일어날 현현을 예고하므로, 한국어에서는 미래로 옮겨 기대된 하나님의 나타나심을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
