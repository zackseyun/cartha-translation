revisions:
- from: 그리고 이스라엘의 자손에게 말하여 이르십시오. ‘숫염소 한 마리를 속죄제물로, 그리고 한 마리의 송아지와 한 마리의 어린 양을 — 각각 한 살 된 흠 없는 것으로 — 번제물로 가져오십시오.’[a]
  to: 그리고 이스라엘 자손에게 이렇게 말씀하십시오. ‘숫염소 한 마리를 속죄제물로[a], 송아지와 어린 양을 각각 한 살 되고 흠 없는 것으로 번제물로 가져오십시오.’
  rationale: 본문 의미는 유지하면서, 직접 인용의 도입을 현대 합쇼체에 맞게 다듬고 각주 표지를 ‘속죄제물’에 연결했습니다. 송아지와 어린 양 모두가 각각 한 살이고 흠 없는 번제물이라는 수식 관계도 보존했습니다.
  reviewer_model: gpt-5.6-terra
