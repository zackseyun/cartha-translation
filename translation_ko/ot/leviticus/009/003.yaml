id: LEV.9.3
reference: Leviticus 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
  footnotes:
  - marker: a
    text: Or 'purification offering' for the Hebrew חַטָּאת in priestly sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손에게 이렇게 말씀하십시오. ‘숫염소 한 마리를 속죄제물로[a], 송아지와 어린 양을 각각 한 살 되고 흠 없는 것으로 번제물로 가져오십시오.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַטָּאת은 제의적 문맥에서 ‘정결제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 영어 POB의 남성 복수 구조를 한국어에서 자연스럽게 유지하면서도, 성경적·공적 호명인 ‘자손’을 사용해 집합적 대상을 분명히 했습니다.
- source_word: תְּדַבֵּר לֵאמֹר
  english_pob_choice: you shall speak, saying
  chosen_korean: 말하여 이르십시오
  alternatives_korean:
  - 말하십시오
  - 말하여 말하기를
  lexicon: HALOT
  rationale: 모세에게 주어진 명령형을 현대 공손체로 옮기되, 이어지는 직접 인용을 예고하는 ‘이르십시오’로 구어적이면서도 성경 번역체의 자연스러움을 살렸습니다.
- source_word: שְׂעִיר עִזִּים
  english_pob_choice: a male goat
  chosen_korean: 숫염소 한 마리
  alternatives_korean:
  - 수염소 한 마리
  - 염소 수컷 한 마리
  lexicon: HALOT
  rationale: 제사 규정의 성별 구분을 분명히 드러내는 표준적 표현으로 ‘숫염소’를 택했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 속죄제를 위하여
  lexicon: HALOT
  rationale: 제의 문맥에서 חַטָּאת은 단순한 ‘죄’가 아니라 제사 자체를 가리키므로, POB의 각주상 대안 의미를 열어 두면서도 한국어 본문에는 기능적으로 분명한 ‘속죄제물’로 옮겼습니다.
- source_word: תְּמִימִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는 것으로
  alternatives_korean:
  - 온전한 것으로
  - 결점 없는 것으로
  lexicon: HALOT
  rationale: 제물의 결격 사유가 없는 상태를 한국어 제사 용례에 맞는 ‘흠 없는’으로 표현했습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제물
  alternative_readings:
  - 속죄제사
  - 정결제물
  rationale: 레위기의 제사 규정에서는 제물의 종류를 지시하는 기능이 강하므로, 죄의 추상 개념보다 제의적 대상성을 드러내는 번역이 본문 목적에 더 부합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
- issue: 직접 인용 안의 명령형 톤
  chosen_reading: 공손체 명령(…십시오)
  alternative_readings:
  - 평서형 지시
  - 해라체
  rationale: 본문은 하나님이 모세를 통해 이스라엘 자손에게 전달하는 공식 지시이므로, 현대 표준어의 공적·예전적 톤을 유지하는 합쇼체가 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
