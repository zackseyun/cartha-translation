id: LEV.9.23
reference: Leviticus 9:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
  footnotes:
  - marker: a
    text: Or, 'the glory of Yahweh appeared to all the people.' The main text follows the project's standard rendering of the divine name יְהוָה as 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세와 아론은 회막에 들어갔다가 나와서 백성을 축복했습니다. 그러고 나서 야훼의 영광이 온 백성에게 나타났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 출애굽기·레위기 제의 문맥에서 굳어진 성막 용어이므로, 현대 한국어에서도 기술적 의미를 유지하는 ‘회막’이 가장 간명합니다.
- source_word: וַיֵּבֹא ... וַיֵּצְאוּ
  english_pob_choice: went into ... came out
  chosen_korean: 들어갔다가 나와서
  alternatives_korean:
  - 들어가고 나와서
  - 들어갔다 나왔습니다
  lexicon: HALOT
  rationale: 히브리어 서술의 연속 동작을 자연스러운 합쇼체로 옮기되, 두 동작의 순서를 분명히 드러냈습니다.
- source_word: וַיְבָרֲכוּ
  english_pob_choice: they blessed
  chosen_korean: 축복했습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복해 주었습니다
  lexicon: HALOT
  rationale: משך(משך?)의 일반적 ‘복을 빌다’보다, כהן적·제의적 행위로서의 공적 축복을 드러내는 ‘축복하다’가 본문에 더 가깝습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
  - 주님의 영광
  lexicon: HALOT
  rationale: 문맥상 신적 현현을 가리키는 כָּבוֹד를 ‘영광’으로 유지하고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיֵּרָא ... אֶל כָּל הָעָם
  english_pob_choice: appeared to all the people
  chosen_korean: 온 백성에게 나타났습니다
  alternatives_korean:
  - 모든 백성에게 보였습니다
  - 모든 백성 앞에 나타났습니다
  lexicon: HALOT
  rationale: נִפעל형의 가시적 현현을 ‘나타나다’로 옮겨, 단순한 시각 인지가 아니라 신현의 의미를 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 기록은 프로젝트 기본 규범에 따라 신적 이름을 ‘야훼’로 드러내어, 본문의 언약적 이름성을 보존합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘영광’의 신현적 의미
  chosen_reading: 야훼의 영광이 온 백성에게 나타났습니다
  alternative_readings:
  - 야훼의 영광이 모든 사람에게 보였습니다
  - 야훼의 영광이 백성에게 드러났습니다
  rationale: 본문의 결론은 단순한 시각 현상이 아니라 하나님의 현현이므로, ‘나타났습니다’로 신현적 강도를 유지했습니다.
  doctrine_reference: Leviticus 9:23 narrative-theophany context
