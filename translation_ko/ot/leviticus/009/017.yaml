  source_fidelity: 초안은 מִנְחָה를 ‘곡식 제물’, עֹלָה를 ‘번제물’로 옮긴 점과 제단에서 태운 행위를 표현한 점은 대체로 적절합니다. 그러나 ‘아침 번제물 외에 따로 태운 것이었다’는 히브리어의 מִלְּבַד(‘~에 더하여/그 밖에’)를 ‘별도로’라는 대조적 뉘앙스로 바꾸며, 문장 전체를 설명적 과거완료 표현으로 처리합니다. 또한 ‘그 손에 가득히’는 소유대명사와 표현이 다소 부자연스럽습니다.
  naturalness: ‘그는 … 불살랐습니다’와 ‘아침 번제에 더하여’는 현대 표준어 합쇼체로 자연스럽고, 제의 문맥에도 알맞습니다. ‘한 움큼을 손에 담아’는 히브리어의 ‘손바닥을 채우다’라는 관용 표현을 읽기 쉽게 전달합니다.
  terminology: ‘곡식 제물’, ‘번제’, ‘제단’, ‘불사르다’는 레위기 제의 용어로 일관되고 적절합니다. ‘불살랐습니다’는 וַיַּקְטֵר의 제의적 소각 의미를 단순한 일반 화재의 ‘태우다’보다 분명히 나타냅니다.
