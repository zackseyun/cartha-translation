source:
  edition: WLC
  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
  footnotes:
  - marker: a
    text: Or 'dashed it against the altar all around.' The Hebrew verb for applying the blood suggests a forceful casting, not a light sprinkling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 번제[a]를 잡았고, 아론의 아들들이 그에게 피를 가져왔으며, 그가 그 피를 제단 사방에 뿌렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 피를 제단 둘레에 던졌습니다.’ 히브리어 동사는 피를 가볍게 뿌리는 것보다 힘 있게 던지거나 내던지는 동작을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  english_pob_choice: Then he slaughtered
  chosen_korean: 잡았고
  alternatives_korean:
  - 도살했고
  - 죽였고
  - 잡아 죽였고
  lexicon: HALOT
  rationale: 제사 문맥의 שׁחט는 단순 살해가 아니라 제의적 도살을 뜻하므로, 한국어로는 제사의 동작을 직접 드러내는 ‘잡다’를 택했습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태움 제물
  - 번제물
  lexicon: HALOT
  rationale: עוֹלָה는 표준 제의 용어인 ‘번제’가 가장 정확하고, 본문의 제사 맥락도 그대로 살립니다.
- source_word: וַיִּזְרְקֵהוּ
  english_pob_choice: he splashed it
  chosen_korean: 그 피를 … 뿌렸습니다
  alternatives_korean:
  - 그것을 던졌습니다
  - 그 피를 끼얹었습니다
  - 그 피를 튀겼습니다
  lexicon: HALOT
  rationale: זרק은 제의적으로 피를 힘 있게 뿌리는 동작을 가리키므로, 평범한 ‘뿌리다’보다 더 약하게 느껴지지 않도록 문맥상 힘을 살리되 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: סָבִיב
  english_pob_choice: on all sides
  chosen_korean: 사방에
  alternatives_korean:
  - 둘레에
  - 주위에
  - 돌아가며
  lexicon: HALOT
  rationale: סביב의 분배적 의미를 살려 제단 전체 둘레를 가리키는 ‘사방에’로 옮겼습니다.
theological_decisions:
- issue: 제의적 피 뿌림의 강한 동작 표현
  chosen_reading: ‘뿌렸습니다’로 옮기되, 제단에 대한 전면적 적용을 ‘사방에’로 보완해 제의 행위의 강도를 유지했습니다.
  alternative_readings:
  - ‘뿌렸습니다’
  - ‘던졌습니다’
  - ‘끼얹었습니다’
  rationale: 문맥상 단순한 살포가 아니라 제단에 대한 의례적 적용이므로, 동작의 강함과 예전적 성격을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 레위기 9장의 제사 규례와 속죄/봉헌의 예전적 언어
