base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
  footnotes:
  - marker: a
    text: Or 'in its pieces.' The Hebrew refers to the animal's cut sections being brought to Aaron in parts.
    reason: lexical_alternative
  - marker: b
    text: The verb can more specifically mean 'offered up in smoke' in sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 번제물의 조각들과 머리를 그에게 가져왔고,[a] 그는 그것들을 제단 위에 불살랐습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 잘린 제물의 각 부분을 따로 아론에게 가져온 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 제의 문맥에서는 이 동사가 더 구체적으로 ‘연기로 드리다’는 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전번제
  lexicon: HALOT
  rationale: עֹלָה는 레위기 제의 문맥에서 표준적인 희생 제물 명칭이므로, 의미를 직접 드러내는 ‘번제물’로 옮겼습니다.
- source_word: הִמְצִיאוּ אֵלָיו
  english_pob_choice: they brought ... to him
  chosen_korean: 그에게 가져오자
  alternatives_korean:
  - 그에게 가져가자
  - 그에게 바치자
  lexicon: HALOT
  rationale: 히필형의 ‘가까이 오게 하다/가져오다’ 뉘앙스를 살려, 제의 절차상 제물을 아론에게 가져온 흐름을 자연스럽게 표현했습니다.
- source_word: לִנְתָחֶיהָ
  english_pob_choice: piece by piece
  chosen_korean: 그 조각들대로
  alternatives_korean:
  - 조각조각으로
  - 한 조각씩
  lexicon: HALOT
  rationale: 분절된 고기를 뜻하므로, 영어 POB의 ‘piece by piece’에 맞춰 ‘그 조각들대로’로 옮겨 각 부분이 따로 제시되었음을 보였습니다.
- source_word: וַיַּקְטֵר
  english_pob_choice: he burned them
  chosen_korean: 불살랐습니다
  alternatives_korean:
  - 향을 피웠습니다
  - 연기로 올렸습니다
  lexicon: HALOT
  rationale: 제단 위에서의 קטר는 단순 가열이 아니라 제의적 소각을 뜻하므로, 한국어 성경 문맥에서 자연스럽고 의미를 분명히 하는 ‘불살랐습니다’를 택했습니다.
theological_decisions:
- issue: 제의적 동작의 번역어 선택
  chosen_reading: ‘불살랐습니다’로 옮겨 번제의 제의적 성격을 분명히 했습니다.
  alternative_readings:
  - ‘태웠습니다’
  - ‘연기로 드렸습니다’
  rationale: 본문은 일반 소각이 아니라 번제물을 제단 위에서 제의적으로 처리하는 장면이므로, 동작의 결과와 예배적 기능을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: 레위기 제의 문맥의 희생 제사 이해
