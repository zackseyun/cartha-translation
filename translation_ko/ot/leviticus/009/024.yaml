  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
  footnotes:
  - marker: a
    text: Or 'from the presence of the LORD'; Hebrew literally 'from before the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they gave a jubilant shout.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 앞에서 불이 나와 제단 위의 번제물과 기름 부분을 삼켰습니다. 온 백성이 그것을 보고 기뻐 외치며 얼굴을 땅에 대고 엎드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 임재 앞에서’라는 뜻일 수 있습니다. 히브리어는 문자적으로 ‘야훼 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 기뻐서 큰 소리를 질렀습니다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  english_pob_choice: fire came out
  chosen_korean: 불이 나와
  alternatives_korean:
  - 불이 나갔습니다
  - 불이 나오셨습니다
  lexicon: WLC/문맥
  rationale: אֵשׁ의 이동 동사를 한국어로 자연스럽게 옮기되, 원문의 돌연한 현현감을 살리기 위해 ‘불이 나와’로 표현했습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 야훼의 임재 앞에서
  lexicon: WLC/전통 관용구
  rationale: לִפְנֵי의 직설적 공간 이미지를 살려 ‘앞에서’로 옮겼고, 본문에 맞게 하나님의 이름은 기본 용례대로 ‘야훼’로 유지했습니다.
- source_word: וַתֹּאכַל
  english_pob_choice: consumed
  chosen_korean: 삼켰습니다
  alternatives_korean:
  - 소멸시켰습니다
  - 먹어 버렸습니다
  lexicon: HALOT
  rationale: 불이 제물을 완전히 받아들이는 강한 동작을 한국어로 과장 없이 전달하기 위해 ‘삼켰습니다’를 선택했습니다.
- source_word: הַחֲלָבִים
  english_pob_choice: the fat portions
  chosen_korean: 기름 부분
  alternatives_korean:
  - 지방 부분
  - 기름진 몫
  lexicon: HALOT
  rationale: 희생 제의 문맥에서 단순한 일반적 ‘기름’보다 제물에서 구별된 제의적 부분임을 드러내기 위해 ‘기름 부분’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 한국어 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 제공된 POB 원칙에 따라 하나님의 이름을 가려서 번역하지 않고, 원문에 있는 언약적 신명을 직접 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
