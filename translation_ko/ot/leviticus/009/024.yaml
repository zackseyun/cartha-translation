  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
  footnotes:
  - marker: a
    text: Or 'from the presence of the LORD'; Hebrew literally 'from before the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they gave a jubilant shout.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 앞에서[a] 불이 나와 제단 위에서 번제물과 기름 부위를 태워 버렸습니다. 온 백성이 그것을 보고 기뻐 외치며[b] 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 임재로부터’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘야훼 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 기뻐서 큰 소리를 질렀습니다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
