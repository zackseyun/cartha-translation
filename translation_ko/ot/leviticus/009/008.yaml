    rationale: עֵגֶל은 기본적으로 ‘송아지’이며, 본절에서 생물학적 수컷임을 명시하지 않습니다. 원문의 범위를 보존하려면 ‘송아지’로 옮겨야 합니다.
  - severity: low
    issue: אֲשֶׁר לוֹ를 ‘자기의’로만 처리하면 제물의 수혜·용도인 ‘자신을 위한’ 뉘앙스가 약해질 수 있습니다.
    rationale: 문맥상 아론 자신을 위한 속죄제임을 구별하므로 ‘자신을 위한 속죄제물’이 더 명료합니다.
