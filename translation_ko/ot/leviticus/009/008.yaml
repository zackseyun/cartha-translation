id: LEV.9.8
reference: Leviticus 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
  footnotes:
  - marker: a
    text: Or, 'the calf of the purification offering.' The Hebrew term can refer to the offering associated with sin and impurity removal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아론은 제단으로 가까이 나아가, 자신을 위한 속죄제물인 송아지를 잡았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제의 송아지’라고도 번역할 수 있습니다. 히브리어 이 용어는 죄와 부정의 제거와 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  english_pob_choice: came near
  chosen_korean: 가까이 나아가서
  alternatives_korean:
  - 다가가서
  - 나아가서
  lexicon: HALOT
  rationale: קרב의 공간적 접근을 살리면서, 제단을 향한 제의적 이동이라는 맥락을 자연스럽게 드러내기 위해 ‘가까이 나아가서’로 옮겼습니다.
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 그 제단
  - 번제단
  lexicon: HALOT
  rationale: 제의 문맥의 מזבח는 표준적으로 ‘제단’이 가장 직접적이며, 여기서는 특정 제단이 문맥상 자명하므로 단순하게 옮겼습니다.
- source_word: וַיִּשְׁחַט
  english_pob_choice: slaughtered
  chosen_korean: 잡았습니다
  alternatives_korean:
  - 도살했습니다
  - 잡아 죽였습니다
  lexicon: HALOT
  rationale: 제사 행위의 기술적 의미를 살리되 현대 한국어에서 지나치게 거칠지 않게, 제물에 대한 의례적 도살을 ‘잡았습니다’로 번역했습니다.
- source_word: עֵגֶל
  english_pob_choice: the calf
  chosen_korean: 수송아지
  alternatives_korean:
  - 송아지
  - 송아지 한 마리
  lexicon: HALOT
  rationale: 이 문맥의 עֵגֶל은 제사에 쓰인 어린 수소를 가리키므로 단순한 ‘송아지’보다 제의적·연령적 함의를 분명히 하는 ‘수송아지’를 택했습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 레위기 제의 용어로서 חטאת는 전통적으로 ‘속죄제’가 가장 널리 쓰이며, 본문 맥락의 제사 범주를 명확히 전달합니다.
- source_word: אֲשֶׁר לוֹ
  english_pob_choice: that was for himself
  chosen_korean: 자기의
  alternatives_korean:
  - 그의
  - 자신을 위한
  lexicon: HALOT
  rationale: אֲשֶׁר לוֹ는 아론의 개인적인 제물임을 나타내므로, 이어지는 소유 관형어 ‘자기의’로 간결하게 반영했습니다.
theological_decisions:
- issue: חטאת의 제의적 의미
  chosen_reading: ‘속죄제’로 본문에 두고, ‘정결/정화 제사’ 가능성은 본문 바깥 주석으로만 열어 둡니다.
  alternative_readings:
  - 정결제
  - 정화 제물
  rationale: 이 절은 제사 범주를 지시하는 서술문으로서, 본문에는 한국어 교회 독자에게 즉각 식별되는 전통 용어를 유지하는 편이 가장 투명합니다. 다만 용어의 정화 기능은 영어 POB의 각주를 통해 보존됩니다.
  doctrine_reference: Translation philosophy §3, §5
