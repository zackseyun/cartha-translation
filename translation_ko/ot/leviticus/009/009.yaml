id: LEV.9.9
reference: Leviticus 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
  footnotes:
  - marker: a
    text: Or 'presented the blood to him'; the Hebrew verb can mean 'brought near' in a ritual setting.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the horns of the altar,' referring to the altar’s projecting corners.
    reason: cultural_note
  - marker: c
    text: Or 'to the foundation of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들이 그 피를 그에게[a] 가져오자, 그는 손가락을 그 피에 적셔 제단의 뿔[b]에 바르고, 그 피를 제단의 밑부분[c]에 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 바쳤다’로도 옮길 수 있습니다. 히브리어 동사는 제의적 상황에서 ‘가까이 가져오다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 말 그대로는 ‘제단의 뿔’입니다. 이는 제단의 돌출된 모서리 부분을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘제단의 기초에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ / אֵלָיו
  english_pob_choice: brought ... to him
  chosen_korean: 그에게 가져오자
  alternatives_korean:
  - 그에게 바치자
  - 그에게 가까이 가져오자
  lexicon: HALOT
  rationale: 제의적 문맥에서 קרב는 ‘가까이 가져오다/드리다’의 뜻이지만, 한국어에서는 ‘그에게 가져오자’가 가장 자연스럽고 동작의 방향을 보존합니다.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  english_pob_choice: dipped his finger
  chosen_korean: 자기 손가락을 그 피에 적셔
  alternatives_korean:
  - 손가락을 피에 담가
  - 손가락을 그 피에 찍어
  lexicon: HALOT
  rationale: טבל은 ‘담그다/적시다’의 뜻이므로, 제사 행위의 간결한 동작을 살리면서도 현대 한국어에서 자연스러운 ‘적셔’로 옮겼습니다.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  english_pob_choice: the horns of the altar
  chosen_korean: 제단의 뿔
  alternatives_korean:
  - 제단의 뿔들
  - 제단의 모퉁이
  lexicon: HALOT
  rationale: ‘뿔’은 제단의 돌출부를 가리키는 관용적 번역이므로 직역을 유지했습니다. 문화적 설명은 본문 대신 각주로 처리합니다.
- source_word: יְסוֹד הַמִּזְבֵּחַ
  english_pob_choice: the base of the altar
  chosen_korean: 제단의 밑받침
  alternatives_korean:
  - 제단의 기초
  - 제단의 바닥
  lexicon: HALOT
  rationale: יְסוֹד는 문자적으로 ‘기초/기반’이지만 제단 맥락에서는 아래쪽 받침 부분을 가리키므로, 자연스럽고 구체적인 ‘밑받침’이 적절합니다.
theological_decisions:
- issue: 제사 행위의 묘사 수위
  chosen_reading: 본문의 세 동작을 순서대로 직설적으로 옮겨 제의 절차의 구체성을 유지했습니다.
  alternative_readings:
  - 의미를 묶어 더 유려하게 재진술하기
  - 제의적 설명을 덧붙이기
  rationale: 이 절은 서술 자체가 제의 규례의 정확한 진행을 보여 주므로, 해설을 덧붙이기보다 원문의 동작 순서를 보존하는 것이 의미에 충실합니다.
  doctrine_reference: 레위기 9장의 제사 규례 서술
