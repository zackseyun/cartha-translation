    rationale: 히브리어 비교 표현은 앞서 드린 첫 속죄제 및 그 절차를 가리킵니다. 한국어에서는 ‘처음 드린 속죄제와 같이’로 밝혀 주는 것이 자연스럽습니다.
  - severity: low
