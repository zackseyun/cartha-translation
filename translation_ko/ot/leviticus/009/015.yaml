  source_fidelity: 전반적으로 제의 문맥과 숫염소, 속죄제의 의미를 잘 반영합니다. 다만 וַיַּקְרֵב은 이 절에서 백성의 제물을 ‘가져와/제시하여’ 다음 제의 행위로 나아가게 하는 뜻이므로, ‘예물을 드리고’는 제물 전체를 이미 봉헌한 것처럼 다소 앞당겨 들릴 수 있습니다. 또한 כָּרִאשׁוֹן은 앞서 행한 속죄제의 절차를 가리키므로 그 지시 대상을 한국어에서 밝혀 주는 것이 정확합니다.
  naturalness: ‘처음 것과 같이’는 한국어에서 무엇을 가리키는지 다소 불분명합니다. ‘처음 드린 속죄제와 같이’가 자연스럽고 문맥상 명확합니다. ‘그것으로 속죄제를 드렸습니다’는 동물을 다시 목적어로 반복하지 않으면서 제의 행위를 자연스럽게 표현합니다.
  terminology: חַטָּאת는 ‘속죄제’로 유지하는 것이 적절합니다. קָרְבַּן에는 이 문맥에서 ‘예물’보다 제의 용어인 ‘제물’이 더 정확합니다. שְׂעִיר의 수컷 의미를 ‘숫염소’로 옮긴 것도 적절합니다.
