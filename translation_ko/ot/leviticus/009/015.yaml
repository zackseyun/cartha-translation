id: LEV.9.15
reference: Leviticus 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
  footnotes:
  - marker: a
    text: Or, 'offered it as a sin offering.' The Hebrew verb can also carry the sense of purifying/purging in priestly ritual contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그는 백성의 예물을 드리고, 백성을 위한 속죄제의 숫염소를 가져다가 그것을 잡고, 처음 것과 같이 그것을 속죄 제물로 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘속죄제 제물로 드렸습니다.’ 히브리어 동사는 제의적 문맥에서 정결하게 하거나 정화하는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב אֵת קָרְבַּן הָעָם
  english_pob_choice: he presented the people's offering
  chosen_korean: 그는 백성의 예물을 드리고
  alternatives_korean:
  - 그는 백성의 제물을 내어놓고
  - 그는 백성의 예물을 제시하고
  lexicon: HALOT
  rationale: קָרְבָּן은 ‘가까이 가져오는 제물’이므로 한국어에서는 제사 문맥에 자연스러운 ‘예물을 드리다’로 옮겨 제의적 의미를 살렸습니다.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  english_pob_choice: the goat of the sin offering that was for the people
  chosen_korean: 백성을 위한 속죄제의 숫염소
  alternatives_korean:
  - 백성을 위한 속죄제 염소
  - 백성의 속죄제 숫염소
  lexicon: HALOT
  rationale: חַטָּאת는 이 문맥에서 죄 자체가 아니라 제의적 ‘속죄제’를 가리키므로, 동물의 성별까지 반영해 ‘숫염소’로 구체화했습니다.
- source_word: וַיִּשְׁחָטֵהוּ
  english_pob_choice: slaughtered it
  chosen_korean: 그것을 잡고
  alternatives_korean:
  - 그것을 도살하고
  - 그것을 죽이고
  lexicon: HALOT
  rationale: שָׁחַט은 희생 제물의 도살을 가리키므로 ‘잡다’가 한국어에서 제의적 도살을 가장 간결하게 드러냅니다.
- source_word: וַיְחַטְּאֵהוּ
  english_pob_choice: offered it for sin
  chosen_korean: 그것을 속죄 제물로 드렸습니다
  alternatives_korean:
  - 그것으로 속죄제를 행했습니다
  - 그것을 죄를 위한 제물로 드렸습니다
  lexicon: HALOT
  rationale: חִטֵּא의 제의적 용법은 단순히 ‘정결케 하다’보다 속죄제 행위를 가리키는 경우가 많아, 문맥에 맞게 기능적으로 옮겼습니다.
- source_word: כָּרִאשׁוֹן
  english_pob_choice: as with the first one
  chosen_korean: 처음 것과 같이
  alternatives_korean:
  - 첫 번째와 같이
  - 첫 사례와 같이
  lexicon: HALOT
  rationale: 바로 앞의 속죄제 절차를 가리키는 비교 표현이므로, 반복된 절차임을 드러내는 간명한 한국어로 옮겼습니다.
theological_decisions:
- issue: חַטָּאת의 의미 범위
  chosen_reading: ‘죄’가 아니라 제의적 ‘속죄제’로 일관되게 번역했습니다.
  alternative_readings:
  - 죄
  - 죄를 위한 제물
  rationale: 이 절은 분명한 제사 문맥이므로, 추상적 ‘죄’로 축소하지 않고 제의 용어를 유지하는 것이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 레위기 제의 용어의 문맥적 의미 유지
