base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
  footnotes:
  - marker: a
    text: Or 'summoned' for 'called'; the Hebrew verb can carry either sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째 날이 되자, 모세는 아론과 그의 아들들 및 이스라엘의 장로들을 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소집했습니다’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 ‘부르다’와 ‘소집하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 일이 일어났습니다
  - 그런 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서술 시작 표지로서 자연스러운 한국어 서술 전환을 택하되, 다음 절의 핵심 사건인 모세의 소집을 문장 중심에 두어 문맥의 움직임을 살렸습니다.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  english_pob_choice: on the eighth day
  chosen_korean: 여덟째 날에
  alternatives_korean:
  - 여덟째 날
  - 여덟째 날에
  lexicon: HALOT
  rationale: 직역에 충실한 시간 표현으로, 한국어에서 자연스러운 부사격 형태인 ‘여덟째 날에’를 선택했습니다.
- source_word: קָרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 소환했습니다
  lexicon: HALOT
  rationale: 본문의 단순한 호출 동사를 한국어로 가장 직접적으로 옮겼습니다. ‘소집하다’도 가능하지만, 여기서는 의례적·행정적 뉘앙스를 과도하게 덧붙이지 않기 위해 ‘불렀습니다’가 더 적절합니다.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  english_pob_choice: and the elders of Israel
  chosen_korean: 이스라엘의 장로들을
  alternatives_korean:
  - 이스라엘의 원로들을
  - 이스라엘 장로들을
  lexicon: HALOT
  rationale: זִקְנֵי יִשְׂרָאֵל은 공동체의 인정된 지도층을 가리키므로, 한국어 성경 문맥에 자연스러운 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: 모세가 누구를 어떤 성격으로 부르는가
  chosen_reading: 의례 직후, 모세가 아론과 그의 아들들, 이스라엘의 장로들을 공식적으로 불러 모으는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 개인적 호출로 읽는 것
  - 공적 소집으로만 강하게 제한하는 것
  rationale: 문맥상 레위기 9장은 제사장 직분의 공적 시작을 다루므로, ‘불렀습니다’는 간결하게 유지하되 공적 집합의 성격을 해치지 않도록 했습니다.
  doctrine_reference: 레위기 9장의 제사장 직무 개시 문맥
