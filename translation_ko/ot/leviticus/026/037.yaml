id: LEV.26.37
reference: Leviticus 26:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
  footnotes:
  - marker: a
    text: Literally, 'a man in/against his brother,' an idiom here meaning they will collide with one another in panic.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will have no standing before your enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 칼 앞에서처럼 서로[a] 걸려 넘어질 것이며, 추격하는 자가 없는데도 원수들 앞에서 버틸 힘이 없을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사람이 자기 형제에게’입니다. 여기서는 공포 가운데 서로 부딪치거나 걸려 넘어지는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘원수들 앞에 설 수 없을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  english_pob_choice: they will stumble
  chosen_korean: 넘어질 것이며
  alternatives_korean:
  - 비틀거릴 것이며
  - 부딪칠 것이며
  lexicon: HALOT
  rationale: כשל는 문맥상 물리적·심리적 ‘넘어짐’과 붕괴를 가리키므로, 재난과 공포의 이미지를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: אִישׁ בְּאָחִיו
  english_pob_choice: over one another
  chosen_korean: 서로 부딪혀
  alternatives_korean:
  - 각기 형제 위로
  - 서로 위로
  lexicon: HALOT
  rationale: 직역하면 ‘사람이 자기 형제 안/대하여’이지만, 여기서는 공포 속의 상호 충돌이라는 관용적 의미가 분명하므로 ‘서로 부딪혀’로 풀었습니다.
- source_word: כְּמִפְּנֵי חֶרֶב
  english_pob_choice: as if fleeing before a sword
  chosen_korean: 칼 앞에서 물러나는 것처럼
  alternatives_korean:
  - 칼 앞에 있는 것처럼
  - 칼을 피해 달아나는 것처럼
  lexicon: HALOT
  rationale: מִפְּנֵי חֶרֶב는 칼 앞에 선 상황, 곧 칼을 피해 후퇴하는 장면을 함축하므로, POB의 해석을 따르되 ‘달아나는’보다 원문에 더 가까운 ‘물러나는 것처럼’으로 조정했습니다.
- source_word: וְרֹדֵף אָיִן
  english_pob_choice: though no one is pursuing
  chosen_korean: 쫓는 이가 없는데도
  alternatives_korean:
  - 추격하는 자가 없는데도
  - 쫓는 자가 없는데도
  lexicon: HALOT
  rationale: אָיִן은 ‘없다’는 단언이고, רֹדֵף는 추격자를 뜻하므로, 원인 없는 공포를 드러내기 위해 ‘쫓는 이가 없는데도’로 옮겼습니다.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  english_pob_choice: you will have no power to stand
  chosen_korean: 버틸 힘도 없을 것입니다
  alternatives_korean:
  - 설 힘도 없을 것입니다
  - 일어설 힘도 없을 것입니다
  lexicon: HALOT
  rationale: תְּקוּמָה는 단순한 기립보다 ‘버티며 서 있음/저항할 수 있음’을 뜻하므로, 전투적 맥락을 살려 ‘버틸 힘’으로 옮겼습니다.
theological_decisions:
- issue: 공포가 객관적 위협보다 먼저 찾아오는 심판의 묘사
  chosen_reading: 원수가 실제로 추격하지 않는데도 사람들이 서로 충돌하며 후퇴하는 장면으로 번역했습니다.
  alternative_readings:
  - 단순히 ‘넘어진다’고만 옮기는 것
  - ‘도망친다’로만 강조하는 것
  rationale: 문맥은 외적 압박보다 내적 공포와 붕괴를 강조하므로, ‘서로 부딪혀’와 ‘쫓는 이가 없는데도’를 함께 살려 심판의 역설을 드러냈습니다.
  doctrine_reference: 레위기 26장의 언약 저주와 두려움의 심판 묘사
