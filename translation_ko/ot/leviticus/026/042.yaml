id: LEV.26.42
reference: Leviticus 26:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
  footnotes:
  - marker: a
    text: Or 'And I will remember.' The Hebrew conjunction can be rendered simply 'and'; 'then' reflects the verse's connection to the preceding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 야곱과 맺은 내 언약을 기억하고, 이삭과 맺은 내 언약도 기억하며, 아브라함과 맺은 내 언약도 기억하겠습니다. 그리고 그 땅도 기억하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 접속사는 단순히 ‘그리고’로도 옮길 수 있습니다. 여기서는 앞 문맥과의 연결을 살려 ‘그러면’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  english_pob_choice: Then I will remember
  chosen_korean: 그러면 내가 … 기억하겠습니다
  alternatives_korean:
  - 그리고 내가 … 기억하겠습니다
  - 내가 … 기억하겠습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 회상이 아니라 앞선 언약적 심판/회복 문맥에 이어지는 전환을 살리기 위해 ‘그러면’으로 옮기되, 동사 자체는 ‘기억하겠습니다’로 유지해 본문을 과잉 확장하지 않았습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 나의 언약
  - 내가 맺은 언약
  lexicon: HALOT
  rationale: בְּרִית의 표준적 의미인 ‘언약’을 유지했고, 각 족장과의 관계를 분명히 하기 위해 한국어에서는 반복되는 ‘내 언약’ 뒤에 ‘~과 맺은’을 붙여 자연스럽게 표현했습니다.
- source_word: וְאַף
  english_pob_choice: and also
  chosen_korean: 그리고 …도
  alternatives_korean:
  - 그리고 또한
  - 또
  lexicon: HALOT
  rationale: אַף의 덧붙임과 강조를 한국어의 ‘…도’로 간결하게 살려, 같은 패턴의 반복이 주는 수사적 누적을 유지했습니다.
- source_word: וְהָאָרֶץ
  english_pob_choice: and the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 그 땅을
  lexicon: HALOT
  rationale: 언약 맥락의 אֶרֶץ는 단순한 ‘지역’이 아니라 약속된 땅을 가리키므로, 관용적으로 ‘그 땅’을 택했습니다.
theological_decisions:
- issue: ‘기억하다’의 의미를 어디까지 풀어 쓸지
  chosen_reading: 하나님의 ‘기억하심’을 그대로 ‘기억하겠습니다’로 옮겼습니다.
  alternative_readings:
  - 기억하고 행하겠습니다
  - 다시 돌보겠습니다
  rationale: 언약적 기억에는 실제 행동이 수반되지만, 본문은 ‘기억하다’라고 말하므로 그 신학적 긴장을 보존하기 위해 해설적 확장을 피했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 족장 언약의 배열과 반복
  chosen_reading: 야곱, 이삭, 아브라함 순서를 그대로 유지하고 각 항목의 ‘내 언약’을 반복했습니다.
  alternative_readings:
  - 아브라함, 이삭, 야곱으로 재배열
  - 한 번만 ‘내 언약’을 제시하고 묶어 표현
  rationale: 히브리어의 역순 배열과 반복은 의도된 수사이므로, 익숙한 전통 공식으로 매끈하게 바꾸지 않고 본문의 강조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
