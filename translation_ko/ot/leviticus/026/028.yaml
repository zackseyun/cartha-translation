translation:
  language: ko
  text: 그러면 나도 친히 격렬한 적대감을 품고 너희를 대적하여 행하고, 너희의 죄 때문에 너희를 일곱 배로 징계하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적대의 분노 가운데서’; 전통적으로는 ‘분노하여 너희를 대적하여 행하겠다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 죄 때문에 너희를 일곱 번 징계하겠다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  english_pob_choice: I will walk
  chosen_korean: 행할 것이며
  alternatives_korean:
  - 걸을 것이며
  - 너희에게 임할 것이며
  lexicon: HALOT
  rationale: 히브리어 הלך의 기본 이미지를 그대로 살리되, 한국어에서는 하나님이 사람처럼 ‘걷다’라고 하면 어색하므로 문맥상 작용을 드러내는 ‘행하다’로 옮겨 원문의 동사성을 유지했습니다.
- source_word: עִמָּכֶם
  english_pob_choice: to you
  chosen_korean: 너희를 향해
  alternatives_korean:
  - 너희와 함께
  - 너희에게
  lexicon: HALOT
  rationale: 이 구절은 ‘함께’의 관계어를 유지하면서도 실제 의미는 적대적 방향을 띠므로, 직역적 ‘너희와 함께’보다 문맥상 반대 방향을 드러내는 ‘너희를 향해’가 더 정확합니다.
- source_word: בַּחֲמַת קֶרִי
  english_pob_choice: in furious hostility
  chosen_korean: 격한 적대감 가운데서
  alternatives_korean:
  - 분노한 적대감 가운데서
  - 격한 반항 가운데서
  lexicon: HALOT
  rationale: חֵמָה의 분노/격렬함과 קֶרִי의 대항·적대의 뉘앙스를 함께 살리기 위해 한 덩어리 표현으로 옮겼습니다. ‘적대감’이 본문의 대립성을 분명히 드러냅니다.
- source_word: וְיִסַּרְתִּי
  english_pob_choice: I will discipline
  chosen_korean: 징계하겠습니다
  alternatives_korean:
  - 훈계하겠습니다
  - 벌하겠습니다
  - 징벌하겠습니다
  lexicon: HALOT
  rationale: יסר는 단순한 형벌보다 교정적 징계를 포함하므로, ‘징계하다’가 그 훈육적·심판적 긴장을 가장 잘 보존합니다.
- source_word: שֶׁבַע
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배로
  alternatives_korean:
  - 일곱 번
  - 일곱 겹으로
  lexicon: HALOT
  rationale: 이 표현은 강화된 심판을 나타내는 관용법이므로, 한국어에서도 ‘일곱 배로’가 의미와 리듬을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 하나님의 반응을 단순한 형벌로만 약화하지 않고, 적대와 징계를 함께 보존할지 여부
  chosen_reading: 하나님이 ‘격한 적대감 가운데서 너희를 향해 행하신다’는 관계적 반대와, 이어지는 ‘징계하신다’는 교정적 심판을 함께 살렸습니다.
  alternative_readings:
  - 모두 ‘벌하겠다’로 통일해 단순 처벌로 읽기
  - ‘화나셔서’ 정도로 완화해 관계적 대립을 약화하기
  rationale: 히브리어는 관계적 적대(הלך + עם + קֶרִי)와 יסר의 징계 의미를 함께 담고 있으므로, 둘 중 하나로 흡수하면 본문의 언약적 경고가 흐려집니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
