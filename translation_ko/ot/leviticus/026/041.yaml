id: LEV.26.41
reference: Leviticus 26:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
  footnotes:
  - marker: a
    text: Or 'even I.' The Hebrew adds emphasis to God's reciprocal action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'walk with them in hostility' or 'walk contrary to them'; this repeats the covenant-curse language of this chapter.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'or then'; the phrase is difficult and may introduce the point at which their heart is humbled.
    reason: alternative_reading
  - marker: d
    text: Literally 'their uncircumcised heart,' a covenantal metaphor for inner stubbornness and uncleanness.
    reason: cultural_note
  - marker: e
    text: Or 'they will make amends for their iniquity' / 'their iniquity will be paid for.' The Hebrew idiom refers to accepting or bearing the due consequence of guilt.
    reason: alternative_reading
translation:
  language: ko
  text: 나도[a] 그들과 적대하여 행하고[b], 그들을 그들의 원수들의 땅으로 데려가겠습니다. 혹은 그때에[c] 그들의 할례받지 않은 마음[d]이 낮아질 것이며, 그때에 그들은 자기들의 죄악에 대한 벌을 받아들일 것입니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로 나도.’ 히브리어는 하나님의 상응하는 행동을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들과 적대하여 행하다’ 또는 ‘그들에게 대항하여 행하다.’ 이 장에서 반복되는 언약 저주의 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘혹은 그때에.’ 이 표현은 문법적으로 어렵고, 그들의 마음이 낮아지는 시점을 제시하는 것으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 직역하면 ‘그들의 할례받지 않은 마음.’ 이는 내면의 완고함과 부정함을 나타내는 언약적 은유입니다.
    reason: cultural_note
  - marker: e
    text: 또는 ‘자기들의 죄악을 갚을 것입니다’ 또는 ‘그들의 죄악이 보상될 것입니다.’ 히브리어 관용구는 죄책에 따르는 결과를 받아들이거나 감당하는 것을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  english_pob_choice: I too
  chosen_korean: 나도
  alternatives_korean:
  - 저도
  - 저 역시
  - 심지어 나도
  lexicon: HALOT
  rationale: אַף אֲנִי의 강조된 상응을 한국어에서는 간결한 ‘나도’로 살려, 하나님의 상호적 대응을 자연스럽게 드러냅니다.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  english_pob_choice: will walk contrary to them
  chosen_korean: 그들에게 재앙으로 걸어가고
  alternatives_korean:
  - 그들에게 적대하여 걸어가고
  - 그들과 반대로 걸어가고
  - 그들에게 원수처럼 행하고
  lexicon: HALOT
  rationale: בְּקֶרִי의 반복된 언약 저주 문맥을 살리되, 한국어에서는 직역식 ‘반대로’보다 관계적 적대와 징벌적 대항을 함께 드러내는 표현이 더 자연스럽습니다.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  english_pob_choice: and bring them into the land of their enemies
  chosen_korean: 그들을 그들의 원수들의 땅으로 끌어가겠습니다
  alternatives_korean:
  - 그들을 그들의 원수들의 땅으로 데려가겠습니다
  - 그들을 원수들의 땅으로 이끌겠습니다
  lexicon: HALOT
  rationale: 히필 בוא의 강한 ‘데려오다/끌어가다’ 뜻을 반영하면서, 포로로 끌려가는 심판의 뉘앙스를 보존합니다.
- source_word: לְבָבָם הֶעָרֵל
  english_pob_choice: their uncircumcised heart
  chosen_korean: 그들의 할례받지 않은 마음
  alternatives_korean:
  - 그들의 무할례한 마음
  - 그들의 할례받지 않은 심장
  - 그들의 완고한 마음
  lexicon: HALOT
  rationale: 언약적 은유를 유지하기 위해 ‘완고한 마음’으로 풀지 않고, 현대 한국어에서 이해 가능한 ‘할례받지 않은 마음’으로 직접 옮깁니다.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  english_pob_choice: and then they will accept the punishment for their iniquity
  chosen_korean: 그제야 그들은 자기들의 죄악의 벌을 받아들일 것입니다
  alternatives_korean:
  - 그제야 그들은 자기들의 죄악에 대한 벌을 감당할 것입니다
  - 그제야 그들은 자기들의 죄악을 갚게 될 것입니다
  lexicon: HALOT
  rationale: יִרְצוּ אֶת עֲוֺנָם의 관용구를 ‘벌을 받아들이다’로 풀어, 속죄적 공로가 아니라 죄책의 결과를 인정하고 감당하는 의미를 분명히 합니다.
theological_decisions:
- issue: הֶעָרֵל을 마음에 적용한 언약적 은유
  chosen_reading: ‘할례받지 않은 마음’을 그대로 유지합니다.
  alternative_readings:
  - 완고한 마음
  - 무감각한 마음
  - 회개하지 않은 마음
  rationale: 이 표현은 단순한 성격 묘사가 아니라 언약적 표지의 결핍을 드러내는 신학적 은유이므로, 해석을 과도하게 평탄화하지 않고 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: יִרְצוּ אֶת עֲוֺנָם의 의미
  chosen_reading: 죄악의 벌을 받아들인다고 옮깁니다.
  alternative_readings:
  - 죄악을 갚는다고 옮김
  - 죄책을 보상한다고 옮김
  - 죄악이 사라진다고 옮김
  rationale: 본문은 인간의 공로적 속죄가 아니라 언약적 심판의 결과를 수용하는 뜻이므로, 도덕적·법정적 의미를 살려 번역합니다.
  doctrine_reference: Translation philosophy §§1, 3
