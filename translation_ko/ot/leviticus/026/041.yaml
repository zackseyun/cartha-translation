  naturalness: ‘그들에게 재앙으로 걸어가고’는 현대 한국어로 부자연스럽습니다. ‘그들과 적대하여 행하고’는 본문의 관용적 반복을 살리면서도 자연스럽습니다. ‘그들의 원수들의 땅’은 소유 관계를 반영하되 다소 무거우므로, 본문에서는 ‘원수들의 땅’으로 자연스럽게 처리할 수 있습니다.
  terminology: ‘할례받지 않은 마음’은 הֶעָרֵל의 언약적 은유를 적절히 보존합니다. יִרְצוּ אֶת עֲוֺנָם은 공로적 속죄로 단정하지 않고 ‘죄악에 대한 벌을 받아들일 것’으로 옮기는 것이 문맥상 안전합니다.
