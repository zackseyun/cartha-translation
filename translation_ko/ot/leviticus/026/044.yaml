id: LEV.26.44
reference: Leviticus 26:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'I will not loathe them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to make an end of them' or 'to consume them completely.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에도[ [a] ] 그들이 자기들의 원수들의 땅에 있을 때에도 나는 그들을 버리지 않을 것이며, 그들을 미워하여 멸망시키고 내 언약을 그들과 깨뜨리지는 않을 것입니다[ [b] ][ [c] ]. 나는 그들의 하나님 야훼이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 미워하지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 완전히 끝내려는 것이 아닙니다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘야훼’는 신적 이름 YHWH를 가리킵니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  english_pob_choice: Yet even then
  chosen_korean: 그때에도
  alternatives_korean:
  - 그렇다 해도
  - 그런데도
  - 심지어 그때에도
  lexicon: HALOT
  rationale: 앞선 심판 선언에도 불구하고 뒤따르는 언약적 거절 부정을 강조하는 완화·강조 구문이므로, 자연스러운 한국어로는 간결한 ‘그때에도’가 흐름을 잘 살립니다.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  english_pob_choice: when they are in the land of their enemies
  chosen_korean: 그들이 자기들의 원수들의 땅에 있을 때에도
  alternatives_korean:
  - 그들이 원수들의 땅에 있을 때
  - 원수들의 땅에 있는 동안
  - 그들의 원수들의 땅 안에 있을 때
  lexicon: HALOT
  rationale: בְּ + 부정사구의 시간적 상황을 한국어 ‘~할 때에도’로 옮겨, 포로/유배 상황 속이라는 조건을 분명히 드러냈습니다.
- source_word: לֹא מְאַסְתִּים וְלֹא גְעַלְתִּים
  english_pob_choice: I will not reject them, and I will not abhor them
  chosen_korean: 나는 그들을 버리지 않을 것이며, 그들을 미워하지 않을 것입니다
  alternatives_korean:
  - 나는 그들을 거절하지 않을 것이며, 그들을 역겨워하지 않을 것입니다
  - 나는 그들을 내치지 않을 것이며, 그들을 혐오하지 않을 것입니다
  - 나는 그들을 배척하지 않을 것이며, 그들을 싫어하지 않을 것입니다
  lexicon: HALOT
  rationale: מָאַס와 גָּעַל은 관계적 거절과 강한 혐오를 각각 담으므로, 문맥상 같은 방향의 두 동사를 너무 약화하지 않되 한국어로는 ‘버리다 / 미워하다’가 의미와 자연스러움의 균형이 좋습니다.
- source_word: לְכַלֹּתָם
  english_pob_choice: so as to destroy them
  chosen_korean: 멸망시키고
  alternatives_korean:
  - 끝장내고
  - 완전히 없애고
  - 소멸시키고
  lexicon: HALOT
  rationale: 앞의 두 거절 동사 뒤에 결과 목적을 이루는 표현으로, ‘멸망시키다’가 총체적 파멸의 뉘앙스를 유지하면서도 현대 한국어 성경 문체에 적합합니다.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  english_pob_choice: to break my covenant with them
  chosen_korean: 내 언약을 그들과 깨뜨리지는 않을 것입니다
  alternatives_korean:
  - 내 언약을 그들과 어기지는 않을 것입니다
  - 내 언약을 그들과 폐하지는 않을 것입니다
  - 내 언약을 그들과 무효화하지는 않을 것입니다
  lexicon: HALOT
  rationale: הֵפֵר + 언약은 언약을 깨뜨리거나 무효화하는 뜻이므로, 직설적이고 이해하기 쉬운 ‘깨뜨리다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: I am Yahweh their God
  chosen_korean: 나는 그들의 하나님 야훼이기 때문입니다
  alternatives_korean:
  - 나는 그들의 하나님 여호와이기 때문입니다
  - 나는 그들의 하나님 주님이기 때문입니다
  lexicon: DOCTRINE.md Contested terms
  rationale: 본문의 신명기적 언약 공식을 살려 divine name은 프로젝트 기본값대로 ‘야훼’로 옮기고, 관계적 소유를 ‘그들의 하나님’으로 분명히 했습니다.
theological_decisions:
- issue: 야훼의 언약적 자기계시를 어떻게 표기할지
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 직접 음역하여 언약 이름을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 처리
  - ‘여호와’로 전통 표기
  rationale: 이 절은 하나님이 심판 이후에도 자기 백성을 완전히 버리지 않겠다는 언약 충성의 진술이므로, 고유한 언약 이름을 보존하는 편이 본문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
