theological_decisions:
- issue: 조상들의 죄악을 함께 자백하는 집단적 책임
  chosen_reading: ‘조상들의 죄악’을 본문에 그대로 두어 공동체적·언약적 책임을 약화시키지 않았습니다.
  alternative_readings:
  - 조상들의 죄로 인한 결과
  - 조상들의 본을 따른 죄
  rationale: 히브리어는 개인의 죄와 더불어 조상들의 죄악을 함께 자백하도록 명시하므로, 이를 개인화하거나 심리화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
