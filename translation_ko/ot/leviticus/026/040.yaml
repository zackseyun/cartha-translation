  source_fidelity: 핵심 의미는 대체로 잘 보존되어 있습니다. 그러나 ‘나에게 신실하지 못하여 저지른 그 불신실함’은 히브리어의 동족어 반복(מַעַל/מָעַל)을 다소 부자연스럽고 अस्पष्ट하게 재현하며, ‘내게 대적하며 걸어간 것’은 한국어 관용상 ‘나를 거슬러 행한 일’로 옮기는 편이 קֶרִי의 적대적·대항적 의미를 더 정확하고 자연스럽게 전달합니다.
  naturalness: 초안은 긴 목적어 병렬과 ‘그 불신실함’ 때문에 문장 구조가 다소 무겁습니다. 수정문은 자백의 대상들을 병렬로 명료하게 제시하면서도 현대 표준 한국어의 문장 흐름을 유지합니다.
  terminology: ‘죄악’, ‘조상들’, ‘자백’, ‘신의를 저버리다’, ‘배신’, ‘거슬러 행하다’는 본문의 도덕적·언약적 어휘와 합쇼체 성경 문체에 적절합니다. 각주에는 영어 단어가 남아 있고 ‘어려운’의 오기가 있어 바로잡아야 합니다.
