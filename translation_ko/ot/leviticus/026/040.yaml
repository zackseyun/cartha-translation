id: LEV.26.40
reference: Leviticus 26:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
  footnotes:
  - marker: a
    text: 'Or ''their trespass'' / ''their treachery'' for ''the unfaithfulness.'' The Hebrew uses cognate forms to stress covenant breach: ''in their unfaithfulness by which they were unfaithful to me.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'walked in hostility toward me.' The Hebrew phrase 'walked with me in qeri' uses a difficult term repeated in this chapter for oppositional or hostile conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기의 죄악과 조상들의 죄악을, 곧 나에게 신실하지 못하여 저지른 그 불신실함과, 또 내게 대적하며 걸어간 것까지도 자백하면[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 불신실함’은 히브리어의 어근 반복을 살린 표현으로, ‘배신’ 또는 ‘treachery’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대적하며 걸어간’은 본문의 קשה한 ‘qeri’ 계열 표현을 문맥에 따라 적대적 행위로 푼 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  english_pob_choice: if they confess
  chosen_korean: 자백하면
  alternatives_korean:
  - 고백하면
  - 자백하고
  lexicon: HALOT
  rationale: 히트파엘 형태의 자백을 조건절에 맞게 한국어 종결로 자연스럽게 옮겼습니다.
- source_word: עֲוֺנָם / עֲוֺן אֲבֹתָם
  english_pob_choice: their iniquity / the iniquity of their fathers
  chosen_korean: 자기의 죄악과 조상들의 죄악
  alternatives_korean:
  - 자기의 죄와 조상들의 죄
  - 자기의 죄책과 조상들의 죄책
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 살려 ‘죄악’으로 옮기고, 문맥상 병렬 구조를 유지했습니다.
- source_word: בְּמַעֲלָם ... מָעֲלוּ בִי
  english_pob_choice: in the unfaithfulness by which they were unfaithful to me
  chosen_korean: 나에게 신실하지 못하여 저지른 그 불신실함
  alternatives_korean:
  - 내게 불성실하여 저지른 그 배신
  - 나를 향해 treachery를 행한 그 배반
  lexicon: HALOT
  rationale: מַעַל/מָעַל의 어근 반복을 한국어에서도 ‘신실하지 못함/불신실함’으로 대응시켜, 언약적 배신의 중첩을 드러냈습니다.
- source_word: וְאַף ... הָלְכוּ עִמִּי בְּקֶרִי
  english_pob_choice: and also that they walked contrary to me
  chosen_korean: 또 내게 대적하며 걸어간 것까지도
  alternatives_korean:
  - 또 나를 향해 반항하며 걸어간 것까지도
  - 또 나와 적대적으로 걸어간 것까지도
  lexicon: HALOT
  rationale: בְּקֶרִי의 난해한 의미를 문맥상 적대/대항으로 살리고, ‘walked’의 동작성을 유지했습니다.
theological_decisions:
- issue: 조상들의 죄악을 함께 자백하는 집단적 책임
  chosen_reading: ‘조상들의 죄악’을 본문에 그대로 두어 공동체적·언약적 책임을 약화시키지 않았습니다.
  alternative_readings:
  - 조상들의 죄로 인한 결과
  - 조상들의 본을 따른 죄
  rationale: 히브리어는 개인의 죄와 더불어 조상들의 죄악을 함께 자백하도록 명시하므로, 이를 개인화하거나 심리화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
