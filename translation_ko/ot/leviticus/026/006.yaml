id: LEV.26.6
reference: Leviticus 26:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
  footnotes:
  - marker: a
    text: Or 'wild beasts.' The Hebrew phrase refers to dangerous animals in the land; 'harmful beasts' makes explicit the threatening sense of the adjective.
    reason: lexical_alternative
  - marker: b
    text: '''The sword'' is a Hebrew figure for war or armed invasion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 땅에 평강을 주리니, 너희가 두려워하게 하는 이 없이 누울 것이며, 내가 그 땅에서 해로운 짐승을 없애고, 칼이 너희 땅을 통과하지 못하게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들짐승들’. 히브리어 표현은 그 땅에 있는 위험한 동물을 가리키며, ‘해로운 짐승’은 그 형용사의 위협적 의미를 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘칼’은 히브리어에서 전쟁 또는 무장 침입을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / שָׁלוֹם
  english_pob_choice: And I will give peace
  chosen_korean: 내가 ... 평강을 주리니
  alternatives_korean:
  - 내가 ... 평화를 주리니
  - 내가 ... 안녕을 주리니
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 내면의 평정만이 아니라 언약적 안전과 번영을 포함하므로, 한국어에서는 교회적이지만 본문 의미를 잘 드러내는 ‘평강’이 적절합니다.
- source_word: וּשְׁכַבְתֶּם וְאֵין מַחֲרִיד
  english_pob_choice: you will lie down, with no one making you afraid
  chosen_korean: 너희가 두려워하게 하는 이 없이 누울 것이며
  alternatives_korean:
  - 너희가 무서워하게 하는 이 없이 누울 것이며
  - 너희가 두려워할 자 없이 누울 것이며
  lexicon: HALOT
  rationale: מַחֲרִיד의 핵심은 ‘두려움을 일으키는 자/것’이므로, 직역보다 한국어에서 자연스러운 원인 표현으로 옮기되 ‘두려워하게 하는 이’로 위협의 주체성을 살렸습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: harmful beasts
  chosen_korean: 해로운 짐승
  alternatives_korean:
  - 위험한 짐승
  - 사나운 짐승
  - 나쁜 짐승
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 해악을 끼치는 성격을 가리키므로, ‘해로운’이 문맥의 위협을 가장 직접적으로 드러냅니다.
- source_word: וְחֶרֶב לֹא תַעֲבֹר בְּאַרְצְכֶם
  english_pob_choice: and the sword will not pass through your land
  chosen_korean: 칼이 너희 땅을 통과하지 못하게 하겠습니다
  alternatives_korean:
  - 칼이 너희 땅을 지나가지 못하게 하겠습니다
  - 전쟁이 너희 땅을 통과하지 못하게 하겠습니다
  lexicon: HALOT
  rationale: ‘칼’은 전쟁/침략의 환유이므로 본문 이미지를 보존하는 쪽을 택했습니다. ‘통과하지 못하게’는 עבר의 기본 의미를 살리면서 침공 불가의 그림을 유지합니다.
theological_decisions:
- issue: 평강의 범위
  chosen_reading: 이 약속은 땅 안에서의 언약적 안전을 말하며, 두려움의 제거, 해로운 짐승의 제거, 전쟁의 차단을 함께 포함합니다.
  alternative_readings:
  - 순전히 내면적 평안
  - 정치적 안정만을 가리키는 약속
  rationale: 본문이 구체적으로 ‘누움’, ‘짐승’, ‘칼’을 말하므로, 영적·정치적 의미로만 좁히지 않고 물질적 현실을 포함하는 언약 복으로 옮겨야 합니다.
  doctrine_reference: Translation philosophy §3
