- from: 그러나 나는 그들을 위해 그들의 선조들과 맺은 언약을 기억하겠습니다. 내가 그들을 이집트 땅에서 열방의 눈앞에 끌어내어 그들의 하나님이 되게 하려 한 것이니, 나는 야훼입니다.[a]
