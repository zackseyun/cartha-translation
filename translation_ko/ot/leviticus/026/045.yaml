id: LEV.26.45
reference: Leviticus 26:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
  footnotes:
  - marker: a
    text: Or 'the covenant with the ancestors.' The Hebrew literally says 'the covenant [with] the former ones,' referring to the earlier covenant generation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 그들을 위하여, 내가 그들의 하나님이 되기 위해 이집트 땅에서 열방이 보는 앞에서 이끌어 낸 그들의 선조들과 맺은 언약[a]을 기억하겠습니다. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 세대와 맺은 언약’. 히브리어는 직역하면 ‘이전 사람들(세대)의 언약’에 가깝고, 앞선 언약 세대를 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  english_pob_choice: But I will remember
  chosen_korean: 그러나 나는 … 기억하겠습니다
  alternatives_korean:
  - 그리고 나는 … 기억하겠습니다
  - 나는 … 기억하겠습니다
  lexicon: HALOT
  rationale: 문맥상 심판 뒤에 이어지는 전환이므로 ‘그러나’로 대조를 살리고, 미래형 ‘기억하겠습니다’로 신적 발화를 자연스럽게 옮겼습니다.
- source_word: לָהֶם
  english_pob_choice: for them
  chosen_korean: 그들을 위해
  alternatives_korean:
  - 그들을
  - 그들 편에서
  lexicon: HALOT
  rationale: 전치사 ל의 수혜/지향성을 살려 단순 목적어 ‘그들을’보다 ‘그들을 위해’로 옮겼습니다.
- source_word: בְּרִית רִאשֹׁנִים
  english_pob_choice: the covenant with their forefathers
  chosen_korean: 그들의 선조들과 맺은 언약
  alternatives_korean:
  - 조상들과 맺은 언약
  - 옛 세대들과 맺은 언약
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 한국어에서 자연스럽게 풀되, 앞선 세대와의 언약이라는 역사적·언약적 의미를 유지했습니다. ‘선조들’은 영어 POB의 ‘forefathers’와도 대응되며, 필요 이상의 신학적 재구성을 피합니다.
- source_word: לֵאלֹהִים
  english_pob_choice: to be their God
  chosen_korean: 그들의 하나님이 되게 하려 한
  alternatives_korean:
  - 그들의 하나님이 되려고
  - 그들에게 하나님이 되기 위해
  lexicon: HALOT
  rationale: 언약 공식의 목적절을 살리기 위해 직역적인 ‘그들의 하나님이 되게 하려 한’으로 옮겼습니다. 관계의 정체성을 담는 표준 언약 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 표기하여, 전통적 대체 호칭이 아닌 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: ‘기억하다’의 신적 의미
  chosen_reading: 하나님이 언약을 잊지 않고 언약적 책임을 다시 드러내신다는 의미로 이해하고, 단순한 회상보다 언약 실행의 재개를 함축하는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순히 과거를 떠올리다
  - 사람을 위해 마음에 두다
  rationale: 히브리어 ‘기억하다’는 성경 문맥에서 언약적 행위를 포함할 수 있으므로, 의미를 약화시키지 않으면서도 과장하지 않는 번역을 택했습니다.
  doctrine_reference: 언약 신실성에 대한 본문 신학을 보존
- issue: ‘그들의 선조들’의 지시 대상
  chosen_reading: 표현을 역사적 전승의 조상 세대에 대한 언약으로 이해하되, 한국어에서는 ‘선조들’로 자연스럽게 처리했습니다.
  alternative_readings:
  - 형식적으로 ‘옛 세대들’
  - 더 일반적인 ‘조상들’
  rationale: 원문은 압축적이어서 한국어에서 그대로 두면 난해할 수 있습니다. ‘선조들’은 혈통적·언약적 연속성을 유지하면서도 성별을 과도하게 좁히지 않습니다.
  doctrine_reference: 문맥 우선, 성별 표지의 과잉 추가 회피
