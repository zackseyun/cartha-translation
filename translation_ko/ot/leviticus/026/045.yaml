  naturalness: ‘그들을 위해’보다 ‘그들을 위하여’가 이 문맥의 격식 있는 성경 문체에 자연스럽습니다. 목적절을 수식절 안에 배치하면 한국어 문장도 매끄러우며, ‘열방이 보는 앞에서’는 ‘열방의 눈앞에’보다 현대 표준어에서 더 자연스럽습니다.
