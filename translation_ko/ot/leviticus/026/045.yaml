  rationale: 수정문은 ‘기억하다’의 수혜 대상(‘그들을 위하여’), 이전 세대와 관련된 언약, 출애굽의 공적 목격(‘열방이 보는 앞에서’), 그리고 하나님이 되신다는 목적을 보존합니다. ‘선조들’이라는 본문 표현과 ‘옛 세대’라는 각주 대안을 함께 두어 רִאשֹׁנִים의 압축성과 해석상 여지를 유지했습니다.
