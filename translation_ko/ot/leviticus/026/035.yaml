base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
  footnotes:
  - marker: a
    text: Or, more formally, 'it shall rest for what it did not rest during your Sabbaths.' The Hebrew repeats the verb 'rest' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Your Sabbaths'' here refers to the sabbath rests due to the land, especially the sabbatical years in the surrounding context.'
    reason: cross_reference
translation:
  language: ko
  text: 폐허가 된 모든 날 동안 그것은 쉬게 됩니다 — 곧 당신들의 안식일 동안 쉬지 못했던 그 쉼을, 당신들이 그 위에 거주하던 동안입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 형식적으로는 ‘그것은 당신들의 안식일 동안 쉬지 못했던 것을 위해 쉬게 됩니다’라는 뜻일 수 있습니다. 히브리어는 강조를 위해 ‘쉬다’ 동사를 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘당신들의 안식일’은 문맥상 땅에 마땅히 주어져야 할 안식, 특히 주변 문맥의 안식년을 가리킵니다.
    reason: cross_reference
