theological_decisions:
- issue: 안식일(sabbaths)의 대상과 의미
  chosen_reading: ‘당신들의 안식일’은 이스라엘이 땅에 대해 지켜야 할 안식, 곧 문맥상 안식년을 포함한 땅의 쉼을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 단순한 주간 안식일
  - 일반적인 휴식일
  rationale: 앞선 문맥이 땅의 안식과 황폐 기간을 말하므로, 단순한 주간 안식일로 축소하지 않고 문맥적 의미를 드러냈습니다.
  doctrine_reference: 레위기 26장 문맥의 안식년 규례(레 26:34-35)
