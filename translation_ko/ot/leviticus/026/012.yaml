lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  english_pob_choice: I will walk
  chosen_korean: 거닐며
  alternatives_korean:
  - 걸으며
  - 다니며
  - 거니시며
  lexicon: HALOT
  rationale: 히트파엘형의 ‘walk’는 단순한 이동보다 백성 가운데 임재하며 함께 다니는 이미지를 담으므로, 현대 한국어에서는 ‘거닐다’로 그 구체성과 친밀감을 살렸습니다.
- source_word: בְּתוֹכְכֶם
  english_pob_choice: among you
  chosen_korean: 너희 가운데
  alternatives_korean:
  - 너희 한가운데
  - 너희 안에
  - 너희 중에
  lexicon: HALOT
  rationale: 이는 내적 내주보다 공동체 한가운데의 존재를 뜻하므로, ‘너희 가운데’가 가장 자연스럽고 원문 의미를 정확히 전합니다.
- source_word: לֵאלֹהִים
  english_pob_choice: your God
  chosen_korean: 너희의 하나님
  alternatives_korean:
  - 너희 하나님
  - 너희의 신
  - 하나님이 되겠습니다
  lexicon: HALOT
  rationale: 언약 공식에서 אֱלֹהִים은 이스라엘의 유일하신 하나님을 가리키므로 ‘하나님’으로 옮기되, 관계성을 드러내기 위해 서술적으로 풀었습니다.
- source_word: לְעָם
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 ժողովուրդ
  - 내 ժողովուրդ들
  - 내 민족
  lexicon: HALOT
  rationale: ‘백성’은 언약적 소속을 나타내는 표준 한국어로, ‘내 백성’이 원문의 상호적 언약 관계를 가장 자연스럽게 살립니다.
theological_decisions:
- issue: 언약 공식의 상호성
  chosen_reading: ‘나는 … 너희의 하나님이 되고, 너희는 내 백성이 될 것입니다’로 상호적 언약 관계를 직설적으로 살렸습니다.
  alternative_readings:
  - ‘나는 … 너희에게 하나님이 되고, 너희는 내게 한 백성이 될 것입니다’
  - ‘나는 … 너희 하나님이 되겠고, 너희는 내 백성이 되겠습니다’
  rationale: 히브리어의 전형적 언약 공식은 관계의 상호성을 강조하므로, 이를 한국어에서도 문법적으로 평행하게 유지하는 것이 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: '언약 신학; 번역 원칙: optimal equivalence'
