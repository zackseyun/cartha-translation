  terminology: ‘힘’, ‘헛되이 소모되다’, ‘땅’, ‘소출’, ‘열매’의 선택이 문맥과 어휘 의미에 적절합니다. ‘여러분’은 현대 존대 خطاب으로 일관되며, 문장 종결도 요청된 합쇼체에 맞습니다.
