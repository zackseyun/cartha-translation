  source_fidelity: 히브리어의 미래형 선언과 부정, ‘힘이 헛되이 소진됨’, 땅의 소출 및 땅의 나무의 열매라는 병렬 구조가 충실히 반영되었습니다. 집합 단수 עֵץ를 ‘나무들’로 처리하고 이에 맞추어 ‘열매’를 무표지로 옮긴 것은 한국어에서 자연스럽고 의미를 보존합니다.
