id: LEV.26.20
reference: Leviticus 26:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
  footnotes:
  - marker: a
    text: Or, more formally, 'your strength will be exhausted for emptiness' and 'the tree of the land will not give its fruit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 힘은 헛되이 소모될 것이고[a], 여러분의 땅은 소출을 내지 못할 것이며, 그 땅의 나무들도 열매를 내지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 문자적으로는 ‘여러분의 힘은 헛됨을 위해 소진될 것이며’, ‘그 땅의 나무는 그 열매를 내지 못할 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם לָרִיק כֹּחֲכֶם
  english_pob_choice: Your strength will be spent in vain
  chosen_korean: 여러분의 힘은 헛되이 소모될 것이고
  alternatives_korean:
  - 여러분의 힘은 헛되이 다할 것이고
  - 여러분의 기력은 헛되이 소진될 것이고
  lexicon: HALOT
  rationale: תמם은 ‘다하다/소진되다’의 뜻이고 לָרִיק은 ‘헛되이, 헛된 결과로’의 의미이므로, 농경적 저주 문맥에서 자연스러운 ‘헛되이 소모되다’로 옮겼습니다.
- source_word: כֹּחֲכֶם
  english_pob_choice: your strength
  chosen_korean: 여러분의 힘
  alternatives_korean:
  - 여러분의 능력
  - 여러분의 기력
  lexicon: HALOT
  rationale: כֹּח는 물리적 힘과 노동력의 뉘앙스를 함께 가질 수 있어, 여기서는 수고가 헛되게 되는 문맥에 맞는 ‘힘’을 택했습니다.
- source_word: תִתֵּן אַרְצְכֶם אֶת יְבוּלָהּ
  english_pob_choice: your land will not yield its produce
  chosen_korean: 여러분의 땅은 소출을 내지 못할 것이며
  alternatives_korean:
  - 여러분의 땅은 그 산물을 내지 못할 것이며
  - 여러분의 땅은 결실을 내지 못할 것이며
  lexicon: HALOT
  rationale: יבול은 땅의 산출물, 곧 농산물 전반을 가리키므로 ‘소출’을 사용해 뜻을 직접적으로 살렸습니다.
- source_word: וְעֵץ הָאָרֶץ לֹא יִתֵּן פִּרְיוֹ
  english_pob_choice: the trees of the land will not yield their fruit
  chosen_korean: 그 땅의 나무들도 열매를 내지 못할 것입니다
  alternatives_korean:
  - 그 땅의 나무들도 그 열매를 내지 못할 것입니다
  - 그 땅의 나무들도 열매를 생산하지 못할 것입니다
  lexicon: HALOT
  rationale: עֵץ הָאָרֶץ는 집합적으로 ‘그 땅의 나무들’로 읽는 것이 자연스럽고, יִתֵּן פִּרְיוֹ는 관용적으로 ‘열매를 내다’로 옮기면 원문의 농경적 이미지를 잘 보존합니다.
theological_decisions:
- issue: 저주 문장의 미래형 표현
  chosen_reading: ‘-할 것이고 / -하지 못할 것입니다’로 옮겨, 선언된 언약적 심판의 확정성을 유지했습니다.
  alternative_readings:
  - ‘-합니다’로 평서화
  - ‘-될 것입니다’로 완화
  rationale: 본문은 경고가 아니라 언약 저주의 선언이므로, 단순 예측보다 확정적 결과를 드러내는 미래형이 적절합니다.
  doctrine_reference: 언약의 저주와 심판 선언(레 26장 맥락)
