id: LEV.26.30
reference: Leviticus 26:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
  footnotes:
  - marker: a
    text: Or 'your sun pillars.' The Hebrew term refers to cultic objects associated with illicit worship; the exact form is debated.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats 'corpses' for both the people and their idols, emphasizing the lifelessness and disgrace of the idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희의 산당들을 없애고, 너희의 향단들을 찍어 버리며, 너희의 시체를 너희의 우상들의 시체 위에 놓고, 내 마음이 너희를 싫어할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너희의 높은 곳들’에 해당하는 제의 장소를 가리키며, 이교 예배 공간을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 사람의 시체와 우상의 ‘시체’를 반복해, 우상들의 무생명성과 수치를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁמַדְתִּי
  english_pob_choice: I will destroy
  chosen_korean: 없애고
  alternatives_korean:
  - 파괴하고
  - 멸망시키고
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 살리되, 한국어에서는 제의적 시설을 대상으로 한 심판 문맥에서 ‘없애다’가 자연스럽고 지나치게 기술적이지 않습니다.
- source_word: בָּמֹתֵיכֶם
  english_pob_choice: your high places
  chosen_korean: 너희의 산당들
  alternatives_korean:
  - 너희의 높은 곳들
  - 너희의 제의 고지들
  lexicon: HALOT
  rationale: בָּמוֹת는 이 문맥에서 이교 제의 장소를 가리키므로, 한국어 성서어휘에서 널리 통용되는 ‘산당’이 원문의 제의적 의미를 가장 직접적으로 전달합니다.
- source_word: חַמָּנֵיכֶם
  english_pob_choice: your incense altars
  chosen_korean: 너희의 향단들
  alternatives_korean:
  - 너희의 태양 기둥들
  - 너희의 향 피우는 제단들
  lexicon: HALOT
  rationale: 해석이 분분한 제의 물건이지만, 본문 흐름상 예배 도구를 가리키는 기능적 번역으로 ‘향단들’을 택했고, 주석적 확정은 피했습니다.
- source_word: פִּגְרֵיכֶם / פִּגְרֵי גִּלּוּלֵיכֶם
  english_pob_choice: your corpses / the corpses of your idols
  chosen_korean: 너희의 시체를 너희의 우상들의 시체 위에
  alternatives_korean:
  - 너희의 주검을 너희 우상들의 주검 위에
  - 너희의 송장들을 너희의 우상들의 송장 위에
  lexicon: HALOT
  rationale: פֶּגֶר의 인간-우상 병렬과 반복을 살리기 위해 ‘시체’를 두 번 반복했습니다. 이렇게 해야 우상도 생명 없는 물건으로 조롱받는 히브리어 말장난이 드러납니다.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  english_pob_choice: my soul will abhor you
  chosen_korean: 내 마음이 너희를 싫어할 것입니다
  alternatives_korean:
  - 내 영혼이 너희를 혐오할 것입니다
  - 내 혼이 너희를 싫어할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘내 영혼’이지만, 한국어에서 하나님의 내적 거부감을 자연스럽고도 강하게 전하는 표현으로 ‘내 마음이… 싫어하다’를 택했습니다. 다만 원문의 인격적·감정적 격렬함은 유지했습니다.
theological_decisions:
- issue: 하나님의 신체화/감정 표현인 ‘내 soul’의 처리
  chosen_reading: ‘내 마음이 너희를 싫어할 것입니다’로 옮겨, 하나님이 언약 백성을 향해 실제로 혐오와 거부를 표하신다는 긴장을 유지했습니다.
  alternative_readings:
  - ‘내 영혼이 너희를 혐오할 것입니다’
  - ‘내가 너희를 싫어할 것입니다’
  rationale: 직역을 그대로 둘 경우 한국어에서는 다소 낯설거나 오해될 수 있어, 인격적 감정 표현을 살리면서도 문장 자연성을 확보했습니다. 원문의 심판 강도는 약화하지 않았습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 평탄화하지 말고 보존한다.'
