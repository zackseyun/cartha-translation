  naturalness: ‘내 영혼은 너희를 혐오할 것입니다’는 현대 한국어의 격식 있는 성서 문맥에서 자연스럽고, 원문의 강도도 보존합니다. ‘잘라 없애고’는 제의 물건에 대한 파괴 행위를 명료하게 표현합니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 독자에게 명확합니다.
