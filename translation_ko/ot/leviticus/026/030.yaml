  - 내 혼이 너희를 싫어할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘내 영혼’이지만, 한국어에서 하나님의 내적 거부감을 자연스럽고도 강하게 전하는 표현으로 ‘내 마음이… 싫어하다’를 택했습니다. 다만 원문의 인격적·감정적 격렬함은 유지했습니다.
theological_decisions:
- issue: 하나님의 신체화/감정 표현인 ‘내 soul’의 처리
  chosen_reading: ‘내 마음이 너희를 싫어할 것입니다’로 옮겨, 하나님이 언약 백성을 향해 실제로 혐오와 거부를 표하신다는 긴장을 유지했습니다.
  alternative_readings:
  - ‘내 영혼이 너희를 혐오할 것입니다’
  - ‘내가 너희를 싫어할 것입니다’
  rationale: 직역을 그대로 둘 경우 한국어에서는 다소 낯설거나 오해될 수 있어, 인격적 감정 표현을 살리면서도 문장 자연성을 확보했습니다. 원문의 심판 강도는 약화하지 않았습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 평탄화하지 말고 보존한다.'
