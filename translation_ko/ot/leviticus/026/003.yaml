  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
  footnotes:
  - marker: a
    text: Or 'follow my statutes.' The Hebrew literally says 'walk in my statutes,' a covenantal idiom for ordering one's life according to them.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내 규례들 가운데서 행하고 내 명령들을 지켜 행하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 규례들 가운데서 걷다’입니다. 이는 규례에 따라 삶의 방향을 정하는 언약적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי / תֵּלֵכוּ
  english_pob_choice: walk in my statutes
  chosen_korean: 내 규례들 가운데서 행하다
  alternatives_korean:
  - 내 규례들 안에서 걷다
  - 내 규례들을 따라 살다
  - 내 규례들을 지키며 행하다
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘walk in’의 삶의 방식 의미를 살리되, 한국어에서는 직역적 ‘걷다’보다 문맥상 자연스러운 ‘가운데서 행하다’로 옮겨 규례에 따른 삶의 순응을 드러냈습니다.
- source_word: מִצְוֺתַי / תִּשְׁמְרוּ
  english_pob_choice: keep my commandments
  chosen_korean: 내 명령들을 지키다
  alternatives_korean:
  - 내 계명들을 지키다
  - 내 명령들을 보존하다
  - 내 명령들을 준수하다
  lexicon: HALOT
  rationale: שׁמר는 율법 문맥에서 ‘지키다/준수하다’의 뜻이므로, 법적·언약적 뉘앙스를 유지하는 ‘지키다’를 택했습니다.
- source_word: וַעֲשִׂיתֶם אֹתָם
  english_pob_choice: do them
  chosen_korean: 행하다
  alternatives_korean:
  - 실행하다
  - 그것들을 행하다
  - 실천하다
  lexicon: HALOT
  rationale: ‘지키다’에 더해 실제 이행까지 요구하는 마지막 동사를 한국어에서도 간결하게 살리기 위해 ‘행하다’로 옮겼습니다.
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일에
  - 혹시
  lexicon: HALOT
  rationale: 명시적 조건절을 드러내는 표준적인 문어체로, 언약적 조건문의 강한 조건성을 유지합니다.
theological_decisions:
- issue: 언약적 순종의 삼중 진술
  chosen_reading: ‘행하고 / 지키고 / 행하면’의 반복을 유지해, 규례를 따라 걷는 삶이 단순한 내적 동의가 아니라 실제 순종임을 드러냈습니다.
  alternative_readings:
  - ‘따라 살면’으로 통합
  - ‘준수하면’으로 압축
  rationale: 히브리어 원문은 세 동사를 병렬로 배치해 언약 순종의 전면성을 강조하므로, 한국어에서도 그 구조를 보존하는 것이 의미 전달에 유익합니다.
  doctrine_reference: '번역 철학: optimal equivalence; 언약적 순종의 구조 보존'
