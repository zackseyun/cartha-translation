  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 너희를 위하여 우상들을 만들지 마십시오. 또 너희를 위하여 조각한 형상이나 세워 놓은 돌을 세우지 마십시오. 너희 땅에 그 돌에 절하려고 형상을 새긴 돌을 두지 마십시오[a]. 나는 너희의 하나님 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘에벤 마스키트’(אֶבֶן מַשְׂכִּית). ‘형상을 새긴 돌’로 옮겼으나, ‘새긴 돌’ 또는 ‘돌 형상’으로도 옮길 수 있습니다. 정확한 뉘앙스는 논쟁적이며, 금지된 예배와 관련된 돌 물체를 가리킵니다.
    reason: lexical_alternative
