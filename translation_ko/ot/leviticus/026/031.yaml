base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I will not smell your pleasing aroma.' The phrase is a standard sacrificial idiom referring to God’s acceptance of offerings; 'of your offerings' is supplied for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 성읍들을 폐허로 만들고, 너희 성소들을 황폐하게 하며, 너희 제물에서 나는 향기로운 냄새를 맡지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희의 기쁘게 하는 향기를 맡지 않겠다’입니다. 이는 하나님께 바쳐진 제물의 향기를 가리키는 제의적 관용구이며, 하나님께서 그 제물을 받아들이지 않으심을 뜻합니다. ‘제물에서 나는’은 이 제의적 대상을 한국어로 분명히 하기 위해 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת עָרֵיכֶם חָרְבָּה
  english_pob_choice: And I will make your cities a ruin
  chosen_korean: 내가 너희의 성읍들을 황폐하게 만들고
  alternatives_korean:
  - 내가 너희의 도시들을 폐허로 만들고
  - 내가 너희의 성읍들을 폐허가 되게 하고
  lexicon: HALOT
  rationale: נתן + 목적어 + 명사적 술어의 결합을 한국어 자연문으로 옮기되, 결과 상태인 ‘황폐’의 의미를 살려 ‘황폐하게 만들다’로 처리했습니다.
- source_word: מִקְדְּשֵׁיכֶם
  english_pob_choice: your sanctuaries
  chosen_korean: 너희의 성소들을
  alternatives_korean:
  - 너희의 거룩한 곳들을
  - 너희의 성역들을
  lexicon: HALOT
  rationale: מקדש의 제의적 의미를 살려 ‘성소’로 옮기고, 복수형을 유지해 ‘들’을 반영했습니다.
- source_word: וְלֹא אָרִיחַ בְּרֵיחַ נִיחֹחֲכֶם
  english_pob_choice: and I will not smell the pleasing aroma of your offerings
  chosen_korean: 너희의 향기로운 제물의 향기를 맡지 않겠습니다
  alternatives_korean:
  - 너희의 향기로운 향기를 맡지 않겠습니다
  - 너희의 제사의 향기를 받지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘맡다/냄새 맡다’ 이미지를 유지하면서도, 문맥상 제의적 관용구임이 드러나도록 ‘제물의 향기’로 명시했습니다. ‘받지 않다’로 풀면 원문의 감각적 표현이 약해집니다.
theological_decisions:
- issue: 마지막 절의 제의적 거절을 직역 이미지로 유지할지 여부
  chosen_reading: ‘맡지 않겠습니다’로 유지하여 하나님이 제물을 향기로 ‘받지’ 않으시는 거절의 이미지를 살렸습니다.
  alternative_readings:
  - 너희 제물을 받지 않겠습니다
  - 너희 제사를 기뻐하지 않겠습니다
  rationale: 본문은 ‘향기로운 향기’를 맡는다는 관용구를 사용하므로, 이를 심리적 수용 거절로만 바꾸지 않고 감각적·제의적 긴장을 보존하는 것이 source-direct합니다.
  doctrine_reference: '번역 원칙: 원문 이미지 보존과 제의적 관용구의 명시적 처리'
