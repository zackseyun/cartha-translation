id: LEV.26.39
reference: Leviticus 26:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
  footnotes:
  - marker: a
    text: Or 'will rot away' or 'will pine away'; the Hebrew verb conveys wasting or decaying under judgment.
    reason: lexical_alternative
  - marker: b
    text: '''With them'' may mean that the iniquities of their fathers remain with them, or that they waste away along with those ancestral iniquities still affecting them.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희 가운데 남은 자들은 원수들의 땅에서 자기들의 죄악 때문에 쇠잔해질 것이며, 또한 그들의 조상들의 죄악들 때문에 그들과 함께 쇠잔해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쇠잔해질’은 כאן의 מקק이 가리키는 심판 아래서의 ‘썩어 감/쇠해 감’을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들과 함께’는 조상들의 죄악이 그들에게 함께 따라붙는다는 뜻일 수도 있고, 그 죄악의 영향 아래 함께 쇠잔해진다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים
  english_pob_choice: those of you who remain
  chosen_korean: 너희 가운데 남은 자들
  alternatives_korean:
  - 너희 중 살아남은 자들
  - 너희 가운데 살아남은 자들
  lexicon: HALOT
  rationale: 남아 있는 사람들을 가리키는 분사형을 자연스러운 현대 한국어로 옮기되, 공동체 내부에서 남은 대상임을 살리기 위해 ‘너희 가운데’로 표현했습니다.
- source_word: יִמַּקּוּ
  english_pob_choice: will waste away
  chosen_korean: 쇠잔해질 것입니다
  alternatives_korean:
  - 소멸할 것입니다
  - 썩어 없어질 것입니다
  - 점점 약해질 것입니다
  lexicon: HALOT
  rationale: מקק의 ‘썩다/쇠하다/소모되다’는 심판 문맥을 살리면서, 육체적·존재적 소모를 함께 드러내는 ‘쇠잔해지다’를 택했습니다.
- source_word: בַּעֲוֺנָם
  english_pob_choice: because of their iniquity
  chosen_korean: 자기들의 죄악 때문에
  alternatives_korean:
  - 그들의 죄책 때문에
  - 그들의 죄악으로 인해
  lexicon: HALOT
  rationale: עָוֹן의 죄악/죄책 의미를 한국어 성경 문맥에 맞게 ‘죄악’으로 옮기되, 원인 관계는 ‘때문에’로 분명히 했습니다.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  english_pob_choice: in the lands of your enemies
  chosen_korean: 원수들의 땅에서
  alternatives_korean:
  - 너희 원수들의 나라에서
  - 적들의 땅에서
  lexicon: HALOT
  rationale: 복수 ‘땅들’의 뉘앙스는 한국어에서 자연스러운 복수성보다 장소성 중심으로 드러나므로, 간결하게 ‘원수들의 땅에서’로 옮겼습니다.
- source_word: בַּעֲוֺנֹת אֲבֹתָם אִתָּם
  english_pob_choice: because of the iniquities of their fathers with them
  chosen_korean: 그들의 조상들의 죄악들 때문에 그들과 함께
  alternatives_korean:
  - 그들의 조상들의 죄악들로 인해 그들과 같이
  - 그들의 조상들의 죄악들이 그들과 함께
  lexicon: HALOT
  rationale: ‘with them’의 모호성을 그대로 남겨, 조상들의 죄악이 그들과 동반된 상태로 작용한다는 여지를 보존했습니다.
theological_decisions:
- issue: 현재 세대의 죄와 조상들의 죄악이 함께 언급되는 심판의 관계
  chosen_reading: 개인의 죄악과 조상들의 죄악을 함께 말하는 본문 구조를 그대로 유지하고, 둘의 관계를 해소하지 않았습니다.
  alternative_readings:
  - 조상 죄악의 결과만으로 해석하기
  - 현재 세대의 동일한 죄에 대한 반복으로만 해석하기
  rationale: 본문은 ‘자기들의 죄악’과 ‘조상들의 죄악들’을 병렬로 제시하므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 예레미야 31:29-30 등과 연관되는 세대 간 책임 논의의 긴장 보존
