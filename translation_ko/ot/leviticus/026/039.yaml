    rationale: אִתָּם은 ‘그들과 함께/그들에게 함께’라는 압축된 표현이며, 한국어에서도 조상들의 죄악과 남은 자들의 관계를 자연스럽게 연결해야 합니다. 현재 문구는 누가 누구와 함께 쇠잔하는지 불필요하게 혼란스럽습니다.
