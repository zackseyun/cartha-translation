revisions:
- from: 나는 야훼 너희 하나님이다. 내가 너희를 이집트 땅에서 인도하여 내어 그들의 노예가 되지 않게 했으며, 너희의 멍에의 채를 꺾고 너희가 꼿꼿이 걷게 했습니다.[a][b][c]
  to: 나는 너희의 하나님 야훼입니다. 나는 너희를 이집트 땅에서 인도하여 내어 그들의 노예 상태에서 벗어나게 했으며,[a] 너희 멍에의 가로대들을[b] 꺾고 너희가 꼿꼿이[c] 걷게 했습니다.
  rationale: 합쇼체로 문체를 통일했습니다. ‘그들의 노예 상태에서 벗어나게 하다’는 מִהְיוֹת לָהֶם עֲבָדִים의 예속 상태로부터의 해방을 자연스럽고 명시적으로 반영합니다. ‘가로대들’은 מֹטֹת의 구체적 복수형을 반영하며, 마지막의 ‘꼿꼿이 걷게 하다’는 사역적 동사와 직립의 해방 이미지를 보존합니다.
