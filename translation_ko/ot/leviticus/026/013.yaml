  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their slaves[c][b]; I broke the bars of your yoke and made you walk upright.
  footnotes:
  - marker: a
    text: Or 'from being slaves to them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the poles of your yoke.'
    reason: lexical_alternative
  - marker: c
    text: Or 'made you walk with heads held high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼 너희 하나님이다. 내가 너희를 이집트 땅에서 인도하여 내어 그들의 노예가 되지 않게 했으며, 너희의 멍에의 채를 꺾고 너희가 꼿꼿이 걷게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 그들의 노예 상태에서 나오게 했다’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘멍에의 장대들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘머리를 높이 들고’.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 언약적 고유명사를 일반 호칭으로 바꾸지 않고, POB의 원칙에 따라 신명기적·출애굽적 문맥의 신적 이름을 음역으로 살렸습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 너희 하나님
  alternatives_korean:
  - 너희의 신들
  - 너희의 하나님
  lexicon: WLC
  rationale: 복수형 어미가 붙어도 문맥상 야훼를 가리키는 단수 언약 공식이므로 표준적 한국어로 ‘너희 하나님’이라 옮겼습니다.
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종들
  - 종살이하는 자들
  lexicon: WLC
  rationale: 영문 POB가 ‘slaves’로 명시한 점을 따라, 이집트의 억압적 예속 상태를 약화하지 않기 위해 ‘노예’를 선택했습니다.
- source_word: מֹטֹת עֻלְּכֶם
  english_pob_choice: the bars of your yoke
  chosen_korean: 너희의 멍에의 채
  alternatives_korean:
  - 너희 멍에의 막대
  - 너희 멍에의 가로대
  - 너희의 멍에채
  lexicon: WLC
  rationale: מֹטֹת은 멍에를 이루는 막대/채를 뜻하므로, 한국어에서 구체적 사물상을 유지하는 ‘멍에의 채’로 옮겼습니다.
- source_word: קוֹמְמִיּוּת
  english_pob_choice: upright
  chosen_korean: 꼿꼿이
  alternatives_korean:
  - 바로
  - 우뚝하게
  - 머리를 들고
  lexicon: WLC
  rationale: 이 단어는 단순한 이동이 아니라 굽은 예속에서 회복된 자세를 가리키므로, 육체적·상징적 직립을 함께 살리는 부사로 옮겼습니다.
theological_decisions:
- issue: 예속 상태의 표기
  chosen_reading: 노예
  alternative_readings:
  - 종
  - 하인
  rationale: 본문의 초점은 출애굽 전의 억압적 종속 상태에 있으므로, 완화된 표현보다 본문의 해방 의미가 분명한 ‘노예’가 더 적절합니다.
  doctrine_reference: Translation philosophy §1; bonded-status rendering
- issue: 마지막 동작-자세 표현
  chosen_reading: 꼿꼿이 걷게 했습니다
  alternative_readings:
  - 머리를 들고 걷게 했습니다
  - 우뚝 서게 했습니다
  rationale: 히브리어는 ‘걷게 하다’와 ‘직립 상태’를 함께 담으므로, 행위와 자세를 모두 보존하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1 and §6
