  naturalness: 초안은 첫 문장이 ‘나는 …이다’이고 뒤가 ‘했습니다’여서 합쇼체가 일관되지 않습니다. 또한 ‘너희의 멍에의 채’는 다소 겹치고 어색하므로 ‘너희 멍에의 가로대들’이 자연스럽습니다.
  terminology: ‘야훼’, ‘하나님’, ‘노예’, ‘꼿꼿이’는 문맥과 POB의 용어 선택에 적절합니다. 하나님의 이름은 고유명사로 보어 위치에 두어 ‘너희의 하나님 야훼’로 처리했습니다.
