source:
  edition: WLC
  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
  footnotes:
  - marker: a
    text: Or 'they will accept their iniquity' or 'they will make amends for their iniquity.' The Hebrew idiom can be understood in more than one way; here it is rendered with its judicial sense in the context of covenant punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 땅은 그들에게 버려져, 그들이 없는 동안 황폐해지면서 자기 안식의 때를 누릴 것입니다. 또 그들은 자기들의 죄악에 대한 벌을 받게 될 것입니다[a]. 이는 참으로 그들이 내 법규를 거부했고, 그들의 마음이 내 규례를 몹시 싫어했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 죄악을 받아들일 것입니다’ 또는 ‘자기들의 죄악에 대해 보상할 것입니다’. 이 히브리어 관용구는 여러 방식으로 이해될 수 있으나, 여기서는 언약적 징벌의 문맥에 맞는 법정적 의미로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב
  english_pob_choice: will be abandoned
  chosen_korean: 버려지고
  alternatives_korean:
  - 남겨지고
  - 유기되고
  lexicon: HALOT
  rationale: 니팔 미완료형의 수동적 의미를 살려, 땅이 사람들로부터 떠나 ‘버려진다’는 뜻을 자연스럽게 옮겼습니다.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  english_pob_choice: will enjoy its Sabbaths
  chosen_korean: 자기 안식들을 누릴 것입니다
  alternatives_korean:
  - 자기 안식일들을 누릴 것입니다
  - 자기 안식의 때를 누릴 것입니다
  lexicon: HALOT
  rationale: 땅이 마땅히 받아야 할 안식을 ‘즐기다/누리다’는 문맥적 의미를 살려, 직역보다 한국어에서 의미가 분명한 표현을 택했습니다.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  english_pob_choice: will accept the punishment for their iniquity
  chosen_korean: 자기들의 죄악의 벌을 받게 될 것입니다
  alternatives_korean:
  - 자기들의 죄악을 받아들일 것입니다
  - 자기들의 죄악에 대한 벌을 감수할 것입니다
  lexicon: HALOT
  rationale: רצה + עון의 법정·징벌적 용법을 반영해, 단순히 ‘죄악을 받아들이다’가 아니라 ‘죄악의 벌을 받다’로 풀어 문맥의 형벌적 의미를 분명히 했습니다.
- source_word: בְּמִשְׁפָּטַי / חֻקֹּתַי
  english_pob_choice: my judgments / my statutes
  chosen_korean: 내 법규 / 내 규례들
  alternatives_korean:
  - 내 판단들 / 내 법도들
  - 내 판결들 / 내 율례들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים과 חֻקֹּת은 서로 구별되는 언약적 규범이므로, 전통적 교회어를 무리하게 통일하지 않고 ‘법규’와 ‘규례들’로 나누어 대응했습니다.
- source_word: גָּעֲלָה נַפְשָׁם
  english_pob_choice: their soul abhorred
  chosen_korean: 그들의 혼이 ... 혐오하였기 때문입니다
  alternatives_korean:
  - 그들의 영혼이 ... 몹시 싫어하였기 때문입니다
  - 그들이 ... 역겨워하였기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 단수형 ‘그들의 혼’을 살리되, 현대 한국어에서 지나치게 생소하지 않으면서도 강한 혐오를 드러내는 ‘혐오하다’를 사용했습니다.
theological_decisions:
- issue: יִרְצוּ אֶת עֲוֺנָם의 의미를 어떻게 한국어로 드러낼지
  chosen_reading: ‘죄악의 벌을 받다’라는 징벌적 의미로 옮겼습니다.
  alternative_readings:
  - ‘자기들의 죄악을 받아들이다’
  - ‘자기들의 죄악을 속죄하다’
  rationale: 본문은 언약 저주와 추방, 땅의 안식이라는 맥락에 있으므로, 도덕적 수용이나 자기 속죄보다 ‘마땅한 벌을 받는’ 뜻이 더 분명합니다. 이는 인간의 공로적 속죄를 암시하지 않으면서 גם משפט적 의미를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
