revisions:
- from: 그러나 그 땅은 그들 때문에 버려지고, 그들 없이 황폐한 동안 자기 안식들을 누릴 것입니다. 또 그들은 자기들의 죄악의 벌을 받게 될 것입니다[a]. 이는 그들이 내 법규를 버렸고, 그들의 혼이 내 규례들을 혐오하였기 때문입니다.
  to: 그러나 그 땅은 그들에게 버려져, 그들이 없는 동안 황폐해지면서 자기 안식의 때를 누릴 것입니다. 또 그들은 자기들의 죄악에 대한 벌을 받게 될 것입니다[a]. 이는 참으로 그들이 내 법규를 거부했고, 그들의 마음이 내 규례를 몹시 싫어했기 때문입니다.
  rationale: 수동형과 추방의 상황을 더 정확히 반영하도록 ‘그들 때문에’를 ‘그들에게 버려져’로 고쳤습니다. 땅의 안식이라는 문맥에 맞게 ‘자기 안식들’을 자연스러운 ‘자기 안식의 때’로 다듬고, נֶפֶשׁ의 집합적 주어는 현대 한국어에서 자연스러운 ‘그들의 마음’으로 옮겼습니다. 반복된 인과 접속사의 강조는 ‘이는 참으로’로 반영했습니다. 형벌적 주번역과 관용구의 대안 독법을 담은 각주는 유지했습니다.
  reviewer_model: gpt-5.6-terra
