review_pass:
  verdict: revise
  source_fidelity: 본문의 큰 흐름과 형벌적 문맥은 잘 반영했습니다. 그러나 מֵהֶם는 ‘그들 때문에’라기보다 땅이 백성에게서 버려져 그들이 떠난 상태가 되는 것을 가리키므로, ‘그들에게 버려져’로 바로잡는 것이 적절합니다. 또한 יַעַן וּבְיַעַן의 반복·강조가 번역문에서 빠졌습니다. ‘혼’은 נֶפֶשׁ의 형식을 기계적으로 따른 표현으로 현대 표준 한국어에서는 부자연스러우므로, 문맥상 ‘마음’으로 자연스럽게 옮겼습니다.
  naturalness: ‘자기 안식들을’과 ‘그들의 혼이 … 혐오하였기’는 현대 한국어에서 어색합니다. 땅이 누리는 복수의 안식은 ‘자기 안식의 때’를 누린다고 표현하고, נֶפֶשׁ은 ‘그들의 마음이’로 옮기는 것이 현대적이며 본문의 강한 거부를 잘 전달합니다. ‘몹시 싫어하다’는 גאל의 혐오·가증스러워함을 자연스럽게 나타냅니다.
  terminology: מִשְׁפָּטִים과 חֻקּוֹת의 구별은 ‘법규’와 ‘규례’로 유지했습니다. רצה + עון은 이 저주·추방 문맥에서 ‘죄악에 대한 벌을 받다’로 번역할 수 있으나, 관용구의 다른 가능한 이해는 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: ‘그들 때문에 버려지고’
