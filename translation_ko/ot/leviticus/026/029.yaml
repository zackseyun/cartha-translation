  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: ko
  text: 그리고 너희는 너희 아들들의 살을 먹을 것이며, 너희 딸들의 살도 먹을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  english_pob_choice: you will eat
  chosen_korean: 먹을 것입니다
  alternatives_korean:
  - 먹게 될 것입니다
  - 먹으실 것입니다
  lexicon: HALOT
  rationale: 2인칭 복수 미래형의 예언적 진술로 보고, 합쇼체에서 자연스러운 미래 표현인 ‘먹을 것입니다’를 택했습니다. 심판 선언의 직접성을 유지하되 ‘shall’식의 고어체는 피했습니다.
- source_word: בְּשַׂר
  english_pob_choice: the flesh
  chosen_korean: 살
  alternatives_korean:
  - 고기
  - 육체
  lexicon: HALOT
  rationale: בָּשָׂר는 여기서 문자적으로 육체/살을 가리키므로, 끔찍한 의미를 흐리지 않는 ‘살’로 옮겼습니다. ‘고기’는 음식 뉘앙스를 띠어 완화될 수 있습니다.
- source_word: בְּנֵיכֶם / בְּנֹתֵיכֶם
  english_pob_choice: of your sons / of your daughters
  chosen_korean: 너희 아들들의 / 너희 딸들의
  alternatives_korean:
  - 너희 아들들의 / 너희 여자아이들의
  - 너희 자녀들의 / 너희 딸들의
  lexicon: HALOT
  rationale: 히브리어가 ‘아들들/딸들’을 각각 분명히 병렬하므로, 일반화하지 않고 성별 대칭을 그대로 살렸습니다.
theological_decisions:
- issue: 포로기적 심판 경고의 직접성 유지
  chosen_reading: 문장을 완화하지 않고 문자적·예언적 경고로 직역했습니다.
  alternative_readings:
  - 비유적이거나 관용적인 표현으로 완화하는 번역
  rationale: 본문은 언약 저주의 극단성을 드러내는 직접 경고이므로, 해석을 덧씌워 순화하면 מקור의 충격과 경고 기능이 약해집니다.
  doctrine_reference: 레위기 26장 언약 저주 문맥
