source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
  footnotes:
  - marker: a
    text: 'Or ''your whole being abhors my judgments.'' Hebrew: ''your soul abhors.'''
    reason: lexical_alternative
  - marker: b
    text: '''My judgments'' may also be rendered ''my rules'' or ''my ordinances.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'thereby violating my covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 여러분이 내 규례를 거절하고, 여러분의 마음이[a] 내 법도를[b] 몹시 싫어하여, 내 모든 계명을 지키지 않음으로써 내 언약을 깨뜨리면,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분 자신이’ 또는 ‘여러분의 온 존재가’. 히브리어는 ‘네페시’(נֶפֶשׁ, 마음·자기·생명)를 주어로 둡니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 법도’는 ‘내 법규’ 또는 ‘내 판단’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 언약을 무효로 만들면’ 또는 ‘내 언약을 어기면’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법규들
  - 내 법도들
  lexicon: HALOT
  rationale: חֻקִּים은 정해진 규정·법규의 뉘앙스를 가지므로, 합쇼체에서 자연스럽고 법-언약적 성격을 살리는 ‘규례들’로 옮겼습니다.
- source_word: תִּמְאָסוּ
  english_pob_choice: you reject
  chosen_korean: 거절하고
  alternatives_korean:
  - 버리고
  - 멸시하고
  lexicon: HALOT
  rationale: מאס는 단순한 불복종보다 강한 거부를 나타내므로, 현대 한국어에서 직접적이고 분명한 ‘거절하다’를 택했습니다.
- source_word: תִּגְעַל נַפְשְׁכֶם
  english_pob_choice: your soul abhors
  chosen_korean: 여러분의 혼이 … 혐오하여
  alternatives_korean:
  - 여러분의 마음이 … 싫어하여
  - 여러분이 … 혐오하여
  lexicon: HALOT
  rationale: 본문은 נֶפֶשׁ를 주어로 두므로 이를 지워 버리지 않기 위해 ‘혼’을 살렸고, געל의 강한 혐오감을 ‘혐오하다’로 유지했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법도들
  alternatives_korean:
  - 내 판단들
  - 내 규정들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 판결/법도/규례의 넓은 법적 의미를 가지며, 바로 앞의 חֻקִּים와 구별을 유지하면서도 한국어에서 자연스럽게 읽히는 ‘법도들’을 택했습니다.
- source_word: לְהַפְרְכֶם
  english_pob_choice: thereby breaking
  chosen_korean: 내 언약을 깨뜨리면
  alternatives_korean:
  - 내 언약을 어기면
  - 내 언약을 무너뜨리면
  lexicon: HALOT
  rationale: פרר의 Hiphil은 언약을 무효화·파기하는 뜻이므로, 결과를 나타내는 연결을 문장 말미의 ‘깨뜨리면’으로 압축해 살렸습니다.
theological_decisions:
- issue: נֶפֶשׁ의 인류학적 표현을 유지할지 여부
  chosen_reading: 여러분의 혼이 내 법도들을 혐오하여
  alternative_readings:
  - 여러분이 내 법도들을 혐오하여
  - 여러분의 마음이 내 법도들을 혐오하여
  rationale: 히브리어는 ‘혼/생명/자기’를 뜻하는 נֶפֶשׁ를 전면에 두므로, 이를 평탄화하지 않고 ‘혼’으로 옮겨 본문의 정서적 강도와 표현의 직접성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 언약 파기의 결과를 조건절 안에서 어떻게 처리할지
  chosen_reading: …내 모든 명령을 행하지 않고 내 언약을 깨뜨리면
  alternative_readings:
  - …내 모든 명령을 행하지 않도록 하여 내 언약을 깨뜨리며
  - …내 모든 명령을 행하지 않으므로 내 언약을 깨뜨리게 되면
  rationale: 히브리어 לְבִלְתִּי עֲשׂוֹת과 לְהַפְרְכֶם은 불순종이 언약 파기로 이어지는 결과를 나타내므로, 한국어에서는 조건문의 귀결을 분명히 드러내어 경고의 논리를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
