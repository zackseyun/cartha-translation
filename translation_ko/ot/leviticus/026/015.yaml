  naturalness: ‘여러분의 혼’은 נֶפֶשׁ의 한 가능한 직역이지만 현대 표준 한국어에서는 부자연스럽고 불필요하게 기술적·교리적으로 들릴 수 있습니다. ‘여러분의 마음’은 문법적 주어를 보존하면서 자연스럽습니다. ‘모든 명령을 행하다’보다 ‘모든 계명을 지키다’가 현대 한국어의 법·종교 문맥에 더 자연스럽습니다.
  terminology: חֻקִּים은 ‘규례’, מִשְׁפָּטִים은 ‘법도’, מִצְוֺת은 ‘계명’, בְּרִית은 ‘언약’으로 구별할 수 있습니다. ‘법도’는 현대 번역에서 다소 문어적이지만 법-언약 문맥에서 통용되며 ‘규례’와의 구별도 유지합니다.
