  rationale: 문법적 주어인 נֶפֶשׁ를 ‘여러분의 마음’으로 보존하되, 현대 한국어에서 기술적 영혼론으로 들릴 수 있는 ‘혼’은 피했습니다. 또한 규례·법도·계명·언약의 용어 구별을 유지하고, 계명 불이행이 언약 파기를 이루는 관계를 ‘지키지 않음으로써’로 명시했습니다. 각주 표지는 각각 실제로 설명하는 표현 뒤에 배치했습니다.
