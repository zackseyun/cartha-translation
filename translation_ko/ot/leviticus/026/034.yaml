id: LEV.26.34
reference: Leviticus 26:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
  footnotes:
  - marker: a
    text: Or 'will enjoy its Sabbaths' / 'will be paid back for its Sabbaths.' The Hebrew verb carries the sense of receiving what was due in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그 땅은 황폐해 있는 모든 날 동안 자기 안식일들을 누릴 것입니다.[a] 너희가 원수들의 땅에 있는 동안, 그때에 그 땅은 쉬며 자기 안식일들을 누릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 안식일들을 보상받을 것입니다.’ 이 히브리어 동사는 이 문맥에서 마땅히 받아야 할 것을 받는다는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그때
  - 그리하면
  lexicon: HALOT
  rationale: 앞선 심판의 결과를 가리키는 시간 부사로, 현대 한국어에서 자연스럽고 격식 있는 ‘그때에’가 적절합니다.
- source_word: תִּרְצֶה / וְהִרְצָת
  english_pob_choice: enjoy its Sabbaths
  chosen_korean: 자기의 안식일들을 누리게 될 것입니다
  alternatives_korean:
  - 자기의 안식일들을 보상받게 될 것입니다
  - 자기의 안식일들을 회복하게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 רצה의 이 문맥상 의미는 ‘누리다’만이 아니라 빚졌던 것을 받는 보상적 뉘앙스를 포함하지만, 한국어에서는 POB의 핵심 선택을 살려 ‘누리게 될 것입니다’로 옮기되 반복을 유지했습니다.
- source_word: שַׁבְּתֹתֶיהָ
  english_pob_choice: its Sabbaths
  chosen_korean: 안식일들
  alternatives_korean:
  - 안식의 날들
  - 안식년들
  lexicon: HALOT
  rationale: 토지의 정기적 안식, 특히 문맥상 안식년의 개념을 가리키므로 전통적 성서 용어를 살린 ‘안식일들’로 옮겼습니다.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  english_pob_choice: all the days of its desolation
  chosen_korean: 황폐한 모든 날 동안
  alternatives_korean:
  - 그 황폐의 모든 날 동안
  - 황폐해 있는 모든 날 동안
  lexicon: HALOT
  rationale: ‘desolation’의 지속 기간을 간결하게 살리기 위해 ‘황폐한 모든 날 동안’으로 옮겼고, 소유격 뉘앙스는 앞뒤 문맥으로 보완했습니다.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  english_pob_choice: while you are in the land of your enemies
  chosen_korean: 너희가 원수들의 땅에 있는 동안 그럴 것입니다
  alternatives_korean:
  - 너희가 원수들의 땅에 있는 동안
  - 너희가 원수들의 땅에 있을 동안
  lexicon: HALOT
  rationale: 문맥상 땅이 황폐한 기간을 나타내는 부사절이므로 ‘있는 동안’으로 자연스럽게 처리했습니다.
- source_word: תִּשְׁבַּת
  english_pob_choice: will rest
  chosen_korean: 쉬게 될 것이며
  alternatives_korean:
  - 쉴 것이며
  - 안식하게 될 것이며
  lexicon: HALOT
  rationale: 땅이 경작을 멈추는 상태를 현대 한국어로 가장 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 땅이 안식일들을 ‘누린다’는 표현의 보상적 의미
  chosen_reading: 이 구절은 포로와 황폐 기간 동안 땅이 빼앗겼던 안식의 몫을 ‘누리게’ 된다는 보상·회복의 의미를 담습니다.
  alternative_readings:
  - 단순히 땅이 쉬는 자연적 묘사
  - 땅이 안식일들을 ‘받아낸다’는 법정적 표현
  rationale: 레위기 26장의 언약 저주는 미준수된 안식의 회복을 포함하므로, 감정적 ‘즐거움’보다 보상과 회복의 함의를 함께 살리는 번역이 본문 의도에 가깝습니다.
  doctrine_reference: Leviticus 26 covenant curses and sabbatical theology
