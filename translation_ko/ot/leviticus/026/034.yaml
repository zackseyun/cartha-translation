  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
  footnotes:
  - marker: a
    text: Or 'will enjoy its Sabbaths' / 'will be paid back for its Sabbaths.' The Hebrew verb carries the sense of receiving what was due in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그 땅은 황폐한 모든 날 동안 자기의 안식일들을 누리게 될 것이며, 너희가 원수들의 땅에 있는 동안 그럴 것입니다. 그때에 그 땅은 쉬게 되고 자기의 안식일들을 누리게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 안식일들을 보상받게 될 것입니다’. 이 히브리어 동사는 문맥상 마땅히 받아야 할 것을 받는다는 뜻을 지닙니다.
    reason: alternative_reading
