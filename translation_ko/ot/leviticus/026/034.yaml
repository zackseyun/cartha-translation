  to: 그때에 그 땅은 황폐해 있는 모든 날 동안 자기 안식일들을 누릴 것입니다.[a] 너희가 원수들의 땅에 있는 동안, 그때에 그 땅은 쉬며 자기 안식일들을 누릴 것입니다.
  rationale: 원문에 없는 ‘그럴 것입니다’를 삭제하고, ‘원수들의 땅에 있는 동안’을 두 번째 진술의 상황절로 자연스럽게 연결했습니다. 땅의 황폐 상태가 지속되는 기간을 명확히 했으며, 히브리어 동사의 어휘적 대안을 설명하는 각주를 해당 첫 용례에 배치했습니다. 반복되는 ‘그때에’와 ‘자기 안식일들을 누릴 것입니다’를 유지하여 원문의 강조와 병행을 보존했습니다.
