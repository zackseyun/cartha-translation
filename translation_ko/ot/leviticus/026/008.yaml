translation:
  language: ko
  text: 너희 중 다섯이 백 명을 쫓을 것이며[a], 너희 중 백 명이 만 명을 쫓을 것입니다[b]. 그리고 너희의 원수들이 너희 앞에서 칼에 쓰러질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쫓다’로 옮긴 히브리어 רדף는 두 절에서 모두 ‘추격하다’ 또는 ‘뒤쫓다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רְבָבָה는 ‘만’ 또는 ‘무수한 큰 수’를 뜻할 수 있습니다. 여기서는 수량의 대조에 따라 ‘만 명’으로 옮겼습니다.
    reason: lexical_alternative
