base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
  footnotes:
  - marker: a
    text: Or 'pursue' for 'chase' in both clauses.
    reason: lexical_alternative
  - marker: b
    text: Hebrew רְבָבָה can mean 'ten thousand' or 'a myriad'; here 'ten thousand' fits the numerical parallelism.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 다섯이 백 명을 쫓고, 너희 백이 만 명을 쫓을 것이며, 너희의 원수들은 너희 앞에서 칼에 쓰러질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쫓다’는 כאן רדף의 자연스러운 현대 한국어 대응입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만 명’은 רְבָבָה의 가능한 뜻인 ‘무리’보다 수치의 대조를 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ
  english_pob_choice: will chase
  chosen_korean: 쫓을 것입니다
  alternatives_korean:
  - 추격할 것입니다
  - 뒤쫓을 것입니다
  lexicon: HALOT
  rationale: רָדַף는 전투 문맥에서 ‘추격하다/쫓다’의 뜻이므로, 현대 한국어에서 자연스럽고 역동적인 ‘쫓다’를 택했습니다.
- source_word: מִכֶּם
  english_pob_choice: of you
  chosen_korean: 너희 다섯이 / 너희 백이
  alternatives_korean:
  - 너희 중 다섯이 / 너희 중 백이
  - 너희에게서 다섯이 / 너희에게서 백이
  lexicon: HALOT
  rationale: מן+인칭접미사는 여기서 분리보다 부분적 수량을 나타내므로, ‘너희 중’의 의미가 드러나도록 한국어 어순으로 풀었습니다.
- source_word: רְבָבָה
  english_pob_choice: ten thousand
  chosen_korean: 만 명
  alternatives_korean:
  - 일만 명
  - 무리
  lexicon: HALOT
  rationale: רְבָבָה는 ‘만/일만’의 수량어이므로, 앞의 ‘백’과 대조되는 수치의 상승을 분명히 보여 주는 ‘만 명’을 사용했습니다.
- source_word: לֶחָרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼로 쓰러질 것입니다
  - 칼에 죽을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘칼에/칼로’이지만, 전투 패배를 자연스럽게 드러내기 위해 ‘칼에 쓰러지다’로 옮겼습니다.
theological_decisions:
- issue: 언약적 군사 승리의 직접성 보존
  chosen_reading: 이 절의 숫자 대비와 승리 약속을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 일반적 격려로 바꾸어 완곡하게 번역하기
  - 비유적 성공담으로 추상화하기
  rationale: 본문은 레위기 26장의 언약 축복 안에서 구체적이고 과장된 승리를 약속하므로, 의미를 약화하지 않는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; never paraphrase beyond what the source warrants.'
