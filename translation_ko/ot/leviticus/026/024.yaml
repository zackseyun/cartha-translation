    rationale: 히브리어 복수형을 ‘죄들’로 기계적으로 드러낼 필요는 없으며, 한국어에서는 ‘너희의 죄 때문에’가 자연스럽고 원인의 의미를 충분히 보존합니다.
  revised_text: 그러면 나도 너희에게 맞서 행하며, 나 역시 친히 너희의 죄 때문에 너희를 일곱 배로 치겠습니다.
