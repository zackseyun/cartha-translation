    rationale: ‘반대하여 행하다’는 현대 한국어에서 목적어·상대 관계가 다소 불분명합니다. ‘너희에게 맞서 행하다’는 원문의 대항 관계와 반복 관용을 더 자연스럽게 전달합니다.
  - severity: low
