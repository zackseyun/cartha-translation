source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
  footnotes:
  - marker: a
    text: Or 'with hostility' / 'in opposition.' The Hebrew term translated 'contrary' is a repeated keyword in Leviticus 26 describing reciprocal opposition between Israel and the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'seven times for your sins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 나도 너희에게 반대하여 행하고, 내가 친히 너희 죄들로 말미암아 너희를 일곱 배로 치겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָלַכְתִּי
  english_pob_choice: then I also will walk
  chosen_korean: 그러면 나도 ... 행하고
  alternatives_korean:
  - 그러면 나도 ... 걷고
  - 그러면 나도 ... 가고
  lexicon: HALOT
  rationale: הלך의 반복적 관용을 한국어에서 문자 그대로 '걷다'로 옮기면 어색하므로, 문맥상 행위·대응의 흐름을 살려 '행하다'로 옮기되, 앞의 '그러면'으로 판결적 이어짐을 드러냈습니다.
- source_word: בְּ/קֶרִי
  english_pob_choice: contrary
  chosen_korean: 반대하여
  alternatives_korean:
  - 적대하여
  - 거슬러
  lexicon: HALOT
  rationale: 레위기 26장의 반복 키워드인 קרי의 상호적 대립을 한국어에서 가장 간결하게 드러내는 말로 '반대하여'를 택해, 단순한 감정적 적대보다 언약적 대항의 뉘앙스를 살렸습니다.
- source_word: גַּם אָ֔נִי
  english_pob_choice: I myself
  chosen_korean: 내가 친히
  alternatives_korean:
  - 나도
  - 내가 또한
  lexicon: HALOT
  rationale: 강조된 자기 지시를 한국어의 '친히'로 살려, 하나님 자신의 직접적 대응이라는 힘을 분명히 했습니다.
- source_word: שֶׁבַע
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배로
  alternatives_korean:
  - 일곱 번으로
  - 일곱 배
  lexicon: HALOT
  rationale: 수사적 강화로서의 שבע를 자연스러운 현대 한국어 표현인 '일곱 배로'로 옮겨, 단순한 횟수 계산보다 징계의 شدت를 보존했습니다.
theological_decisions:
- issue: 하나님의 대응을 묘사하는 reciprocal judgment idiom בקרי의 번역
  chosen_reading: 반대하여
  alternative_readings:
  - 적대하여
  - 거슬러
  rationale: 본문은 이스라엘의 태도에 상응하는 언약적 대항을 말하므로, 정서적 '적대'보다 반복 구조를 살리는 '반대하여'가 문맥을 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
