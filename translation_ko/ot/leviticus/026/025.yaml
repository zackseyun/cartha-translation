  terminology: ‘전염병’과 ‘원수의 손에 넘겨지다’는 적절합니다. נֹקֶמֶת נְקַם בְּרִית의 강조적이고 다소 난해한 표현은 ‘언약의 보복을 집행하는’으로 유지할 수 있으나, 대안과 직역상 난점을 각주에서 설명해야 합니다. ‘언약을 갚아 주는’은 현대 한국어에서 의미가 불명확하고 보복의 법정적 의미를 약화하므로 제외하는 것이 좋습니다.
