id: LEV.26.25
reference: Leviticus 26:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
  footnotes:
  - marker: a
    text: Or 'executing covenant vengeance,' 'taking vengeance for the covenant,' or more smoothly 'avenging the covenant.' The Hebrew is literally 'a sword avenging the vengeance of the covenant,' an emphatic expression linking the sword to covenant judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 치려고 언약의 보복을 집행하는 칼을 보내겠습니다.[a] 너희는 너희 성읍들로 모여들 것이며, 내가 너희 가운데 전염병을 보내겠습니다. 너희는 원수의 손에 넘겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약의 보복을 수행하는 칼’, ‘언약을 위하여 보복하는 칼’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘언약의 보복을 보복하는 칼’에 해당하는, 같은 어근을 거듭 써 강조한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב נֹקֶמֶת נְקַם בְּרִית
  english_pob_choice: a sword executing the vengeance of the covenant
  chosen_korean: 언약의 복수를 집행하는 칼
  alternatives_korean:
  - 언약의 복수를 갚는 칼
  - 언약을 위한 복수를 집행하는 칼
  - 언약의 복수를 수행하는 칼
  lexicon: HALOT
  rationale: 히브리어의 분사+명사 결합이 주는 강조를 살려 ‘복수’를 유지했고, ‘집행하는’으로 משפט적·징벌적 뉘앙스를 살렸습니다.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  english_pob_choice: and you will be gathered into your cities
  chosen_korean: 너희는 너희 성읍들로 모여들 것이고
  alternatives_korean:
  - 너희는 너희 성읍들 안으로 모일 것이고
  - 너희는 너희 도시로 모일 것이고
  lexicon: HALOT
  rationale: נאסף의 피동적 의미를 반영해 ‘모여들다’로 옮겼고, 성읍들이 피난처처럼 군집되는 문맥을 살렸습니다.
- source_word: דֶבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 염병
  - 역병
  - 재앙
  lexicon: HALOT
  rationale: 재난적 질병을 뜻하는 단어이므로 현대 독자가 이해하기 쉬운 ‘전염병’을 택했으며, 형식상 ‘pestilence’의 엄중한 어조도 유지하려 했습니다.
- source_word: בְּיַד אוֹיֵב
  english_pob_choice: into the hand of the enemy
  chosen_korean: 원수의 손에 넘겨질 것입니다
  alternatives_korean:
  - 원수의 손에 주어질 것입니다
  - 원수의 손에 빠질 것입니다
  - 적의 손에 넘겨질 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 권세 아래로의 종속을 나타내므로, 수동적 항복의 의미를 살려 ‘넘겨지다’로 옮겼습니다.
theological_decisions:
- issue: 언약의 복수라는 표현의 신학적 의미
  chosen_reading: 이 표현은 언약을 어긴 이스라엘에게 하나님께서 언약 제재로서 심판을 집행하신다는 뜻을 드러냅니다.
  alternative_readings:
  - 언약을 대신해 행하는 복수
  - 언약을 위한 복수
  - 언약 자체가 요구하는 복수
  rationale: 본문의 긴장을 완화하지 않고, 언약과 심판의 연결을 그대로 드러내는 쪽이 원문과 POB의 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
