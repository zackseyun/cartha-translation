  source_fidelity: 히브리어의 직접 호소와 이후 3인칭 지시, 하나님의 행위, 적국들에 흩어진 상황, 잎사귀 소리에 대한 공황, 칼 앞에서 도망하는 듯한 도주, 실제 추격자가 없다는 역설을 유지해야 합니다. 초안의 핵심 의미는 대체로 충실하나, ‘마음속에 쇠약함을 가져오겠습니다’는 מֹרֶךְ가 가리키는 낙심·겁먹음의 상태를 한국어로 다소 부자연스럽게 표현합니다.
  naturalness: ‘남아 있는 너희에게는’보다 ‘너희 가운데 남아 있는 자들에게는’이 בָּכֶם의 범위와 문장 연결을 더 자연스럽게 드러냅니다. 또한 ‘칼을 피해 도망하듯 도망할 것’은 같은 동사의 반복이 어색하므로 ‘칼을 피하듯 달아날 것’으로 다듬는 것이 좋습니다. ‘흩날리는 잎사귀 소리’는 원문의 수동적·비특정적 움직임을 과도하게 보충하지 않으면서 자연스럽습니다.
  terminology: מֹרֶךְ는 단순한 신체적 쇠약이라기보다 용기가 꺾이고 겁먹는 내적 상태입니다. 따라서 ‘그들의 마음을 약하게 하겠습니다’가 문맥과 현대 한국어에 적절합니다. ‘칼’과 ‘원수들’은 원문의 표현을 그대로 유지합니다.
