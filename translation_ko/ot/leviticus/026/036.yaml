- from: 남아 있는 너희에게는, 내가 적들의 땅에서 그들의 마음속에 쇠약함을 가져오겠습니다. 그리고 날려 가는 잎사귀 소리도 그들을 뒤쫓을 것이며, 그들은 칼을 피해 도망하듯 도망할 것이고, 쫓는 이가 없는데도 쓰러질 것입니다.[a]
  to: 너희 가운데 남아 있는 자들에게는, 내가 그 원수들의 땅에서 그들의 마음을 약하게 하겠습니다. 흩날리는 잎사귀 소리가 그들을 뒤쫓을 것이며, 그들은 칼을 피하듯 달아날 것이고, 쫓는 이가 없는데도 쓰러질 것입니다.[a]
  rationale: 문장의 의미를 바꾸지 않고, מֹרֶךְ의 내적 위축을 자연스러운 한국어로 표현했으며, 남은 자들의 범위와 칼 앞에서의 공황 상태를 더 매끄럽게 다듬었습니다. 잎사귀를 움직이는 원인은 본문에 명시되지 않았으므로 본문에는 ‘흩날리는’을 두고, ‘바람에’라는 해석적 보충은 각주에만 남겼습니다.
