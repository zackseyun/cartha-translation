base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
  footnotes:
  - marker: a
    text: Or 'the sound of a windblown leaf.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 남아 있는 자들에게는, 내가 그 원수들의 땅에서 그들의 마음을 약하게 하겠습니다. 흩날리는 잎사귀 소리가 그들을 뒤쫓을 것이며, 그들은 칼을 피하듯 달아날 것이고, 쫓는 이가 없는데도 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바람에 날리는 잎사귀 소리”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  english_pob_choice: those of you who remain
  chosen_korean: 남아 있는 너희
  alternatives_korean:
  - 너희 가운데 남은 사람들
  - 너희 중 살아남은 자들
  lexicon: HALOT
  rationale: 남아 있는 무리를 직접 가리키는 표현을 살리면서, בָּכֶם의 집단 내부 지시를 한국어로 자연스럽게 옮겼습니다.
- source_word: מֹרֶךְ
  english_pob_choice: faintness
  chosen_korean: 쇠약함
  alternatives_korean:
  - 두려움
  - 겁
  - 기력 상실
  lexicon: HALOT
  rationale: 이 단어는 단순한 공포보다 마음과 기력의 무너짐을 뜻하므로, 내적 붕괴를 드러내는 ‘쇠약함’을 택했습니다.
- source_word: קוֹל עָלֶה נִדָּף
  english_pob_choice: the sound of a driven leaf
  chosen_korean: 날려 가는 잎사귀 소리
  alternatives_korean:
  - 바람에 날리는 잎사귀 소리
  - 떠밀려 가는 잎사귀 소리
  lexicon: HALOT
  rationale: ‘소리’와 ‘잎사귀’를 분명히 하면서, נִדָּף의 수동적 떠밀림을 ‘날려 가는’으로 살렸습니다.
- source_word: מְנֻסַת חֶרֶב
  english_pob_choice: as from the sword
  chosen_korean: 칼을 피해 도망하듯
  alternatives_korean:
  - 칼을 피해 달아나듯
  - 칼 앞에서 도망하듯
  lexicon: HALOT
  rationale: 명사구의 비유적 용법을 풀어, 칼 앞에서의 급박한 도주를 자연스러운 한국어 비교문으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위와 심리적 공포의 유지
  chosen_reading: 하나님께서 포로지에서 내적 쇠약과 비이성적 공포를 주셔서, 실제 위협이 없어도 도망치게 하시는 심판으로 읽었습니다.
  alternative_readings:
  - 단순한 외적 군사 공포만을 가리키는 읽기
  - 은유적 불안감만을 가리키는 읽기
  rationale: 본문은 내적 상태를 하나님이 ‘가져오겠다’고 말하고, 잎사귀 소리에도 도망치는 반응을 묘사하므로, 심리적 공포와 신적 주권을 함께 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
