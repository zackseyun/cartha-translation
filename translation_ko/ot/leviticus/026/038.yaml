    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  english_pob_choice: you will perish
  chosen_korean: 멸망하고
  alternatives_korean:
  - 사라지고
  - 망하고
  - 죽고
  lexicon: HALOT
  rationale: 아בד의 결과적 심판 의미를 살리되, 이어지는 장소 구문과 자연스럽게 이어지도록 ‘멸망하다’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 나라들 가운데서
  - 이방인들 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם은 ‘민족들/나라들’을 뜻하므로, 포로·유배 문맥에 맞게 ‘민족들 가운데서’로 옮겼습니다.
- source_word: וְאָכְלָה
  english_pob_choice: will consume
  chosen_korean: 삼킬 것입니다
  alternatives_korean:
  - 먹을 것입니다
  - 먹어 치울 것입니다
  - 소멸시킬 것입니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘먹다’ 이미지를 유지하면서, 땅이 사람을 집어삼키는 강한 비유를 한국어로 자연스럽게 살렸습니다.
- source_word: אֶרֶץ אֹיְבֵיכֶם
  english_pob_choice: the land of your enemies
  chosen_korean: 너희 원수들의 땅
  alternatives_korean:
  - 너희 적들의 땅
  - 너희의 원수의 땅
  lexicon: HALOT
  rationale: 소유격 구조를 그대로 반영해 ‘너희 원수들의 땅’으로 옮겼고, 복수형 ‘원수들’을 유지해 공동체적 심판의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 땅이 사람을 ‘먹다/삼키다’는 비유의 보존
  chosen_reading: ‘삼킬 것입니다’로 옮겨, 심판의 시적·언약저주적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘너희를 멸할 것입니다’로 풀어씀
  rationale: 본문은 땅을 주어로 한 강한 은유를 사용하므로, 이를 설명문으로 바꾸기보다 비유의 충격을 유지하는 편이 원문 효과에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
