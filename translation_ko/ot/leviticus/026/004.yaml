translation:
  language: ko
  text: 그때 내가 너희에게 너희의 비를 제때에 주겠습니다[a]. 땅은 그 소출을 내고[b], 들의 나무는 그 열매를 맺을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제때에’는 ‘적절한 때에’, ‘알맞은 시기에’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘들의 나무’는 단수형이지만 집합적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי גִשְׁמֵיכֶם
  english_pob_choice: I will give you your rains
  chosen_korean: 내가 너희에게 너희의 비를 주겠습니다
  alternatives_korean:
  - 내가 너희의 비를 내리겠습니다
  - 내가 너희에게 비를 주겠습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미를 살려 ‘주다’로 옮기고, 2인칭 복수 소유를 ‘너희의 비’로 반영했습니다. ‘내리다’는 자연스럽지만 원문의 ‘주다’ 반복을 약화시킬 수 있어 덜 선호했습니다.
- source_word: בְּעִתָּם
  english_pob_choice: in their season
  chosen_korean: 제때에
  alternatives_korean:
  - 그들의 때에
  - 적절한 시기에
  - 제철에
  lexicon: HALOT
  rationale: 농경 문맥의 ‘적절한 때’를 한국어로 가장 간결하고 자연스럽게 드러내는 표현으로 ‘제때에’를 선택했습니다. 영어 주석의 ‘in due season / at their proper time’도 이 의미 범위에 속합니다.
- source_word: יְבוּלָהּ
  english_pob_choice: its produce
  chosen_korean: 그 소출
  alternatives_korean:
  - 그 수확
  - 그 산출물
  - 그 열매
  lexicon: HALOT
  rationale: יבול은 땅의 생산물/소출을 가리키므로, 농경적이고 포괄적인 ‘소출’이 본문에 가장 가깝습니다. ‘수확’은 결과 행위에 더 치우칠 수 있습니다.
- source_word: וְעֵץ הַשָּׂדֶה
  english_pob_choice: the tree of the field
  chosen_korean: 들의 나무
  alternatives_korean:
  - 들의 나무
  - 들에 있는 나무
  - 들나무
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 집합적 의미를 가지므로, 영어 POB의 주석을 반영해 단수 의미를 해치지 않으면서도 한국어에서는 자연스럽게 포괄하는 표현으로 옮겼습니다.
- source_word: יִתֵּן פִּרְיוֹ
  english_pob_choice: will give its fruit
  chosen_korean: 그 열매를 맺을 것입니다
  alternatives_korean:
  - 그 열매를 줄 것입니다
  - 열매를 낼 것입니다
  - 그 열매를 생산할 것입니다
  lexicon: HALOT
  rationale: נתן의 직역인 ‘주다’를 반복할 수도 있지만, 한국어에서는 나무가 열매를 ‘맺다’가 더 자연스럽고 관용적입니다. 원문의 생산성 약속을 살리되 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 농경적 축복 약속을 추상화하지 않을지
  chosen_reading: 비와 땅의 소출, 나무의 열매에 대한 구체적인 언약적 복으로 직역하되, 상징화하거나 영적 의미로 확장하지 않았습니다.
  alternative_readings:
  - 물질적 번영의 일반 원리로 확장하기
  - 영적 풍요의 비유로 바꾸기
  rationale: 본문은 레위기의 언약 축복 맥락에서 실제 강우와 농업 생산성을 말하므로, 그 구체성을 그대로 보존하는 것이 원문 의도에 가장 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
