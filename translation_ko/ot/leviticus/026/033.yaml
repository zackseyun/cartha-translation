base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
  footnotes:
  - marker: a
    text: Or 'I will unsheathe the sword after you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 나라들 가운데로 흩을 것이며, 너희 뒤를 따라 칼을[a] 뽑을 것이고, 너희 땅은 황무지가 되며 너희 성읍들은 폐허가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼을 칼집에서 빼어 들겠다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָרֶה
  english_pob_choice: I will scatter
  chosen_korean: 흩을 것이며
  alternatives_korean:
  - 분산하겠습니다
  - 퍼뜨릴 것입니다
  lexicon: HALOT
  rationale: זרה의 히필은 사람들을 흩어지게 하는 심판적 분산을 뜻하므로, 자연스럽고 직접적인 ‘흩다’로 옮겼습니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 나라들 가운데에
  alternatives_korean:
  - 민족들 가운데에
  - 이방인들 가운데에
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 유배의 대상이 되는 정치적·지리적 ‘나라들’이 가장 적절하며, ‘이방인들’은 후대 종교적 뉘앙스를 덧입힐 수 있습니다.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  english_pob_choice: I will draw out the sword
  chosen_korean: 칼을 빼어 들 것이고
  alternatives_korean:
  - 칼을 뽑을 것이고
  - 칼을 들 것이고
  lexicon: HALOT
  rationale: 리ק과 חֶרֶב의 관용구는 칼을 뽑아 공격적으로 사용하는 모습을 가리키므로, ‘빼어 들다’가 무력 추격의 이미지를 잘 살립니다.
- source_word: שְׁמָמָה / חָרְבָּה
  english_pob_choice: a desolation / ruins
  chosen_korean: 황무지가 되며 / 폐허가 될 것입니다
  alternatives_korean:
  - 황폐하게 되며 / 무너진 곳이 될 것입니다
  - 황량해지며 / 폐허가 될 것입니다
  lexicon: HALOT
  rationale: 명사형 심판 어휘의 강도를 살리기 위해 ‘황무지’와 ‘폐허’를 대응시켜, 땅과 성읍의 결과 상태를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 직접적 징계 행위 표기
  chosen_reading: 주어를 ‘내가’로 유지해, 흩으심과 칼의 추격이 하나님께 직접 귀속되도록 했습니다.
  alternative_readings:
  - 수동형으로 완화하여 ‘너희가 흩어질 것이며’라고 옮김
  - 비인칭적으로 ‘너희는 흩어질 것이며’라고 옮김
  rationale: 히브리어 원문은 언약 저주의 집행자를 분명히 하나님으로 제시하므로, 그 신학적 긴장을 약화하지 않도록 직설적으로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
