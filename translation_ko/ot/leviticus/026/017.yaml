  source_fidelity: 첫 절의 히브리어 관용구 וְנָתַתִּי פָנַי בָכֶם는 단순히 얼굴을 ‘돌리는’ 행위가 아니라, 적대적 심판을 위해 얼굴을 정하여 향하는 뜻입니다. 초안의 ‘너희를 향하여 내 얼굴을 돌리겠다’는 한국어에서 문맥에 따라 등을 돌리거나 외면한다는 뜻으로도 쉽게 읽혀 대적의 방향성이 충분히 드러나지 않습니다. 나머지 절은 전투에서의 패배, 미워하는 자들의 통치, 추격자가 없는데도 도피함을 충실히 반영합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 일관되게 사용합니다. ‘너희를 대적하여 내 얼굴을 향하겠습니다’는 원문의 얼굴 관용구와 대적의 뜻을 함께 보존하는 절제된 표현입니다. ‘추격하는 자가 없는데도’는 원문의 분사 רֹדֵף를 자연스럽게 반영합니다.
  terminology: ‘원수들’(אֹיְבֵיכֶם)과 ‘너희를 미워하는 자들’(שֹׂנְאֵיכֶם)을 구별하고, רדה는 과장 없이 ‘다스리다’로 옮겼습니다. 각주 b는 기존 본문을 직역이라고 반복하는 대신 실제 가능한 어휘 대안을 제시하고, 두 히브리어 표현의 구별을 설명하도록 정정했습니다.
