  edition: WLC
  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
  footnotes:
  - marker: a
    text: Or 'you will be defeated' for 'you will be struck down.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'set my face against you,' an idiom expressing determined opposition in judgment.
    reason: cultural_note
  - marker: c
    text: Or 'though no one is pursuing you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희를 대적하여 내 얼굴을 향하겠습니다[a]. 너희는 너희 원수들 앞에서 쓰러질 것이며, 너희를 미워하는 자들이 너희를 다스릴 것이고[b], 너희는 추격하는 자가 없는데도 도망칠 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 심판 가운데 너희를 향한 하나님의 단호한 대적을 나타냅니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘지배할 것이다’. ‘너희를 미워하는 자들’은 앞의 ‘원수들’과 다른 히브리어 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘추격자가 없는데도’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּכֶם
  english_pob_choice: I will set my face against you
  chosen_korean: 나는 너희를 향하여 내 얼굴을 돌리겠다
  alternatives_korean:
  - 나는 너희를 향하여 내 얼굴을 맞서게 하겠다
  - 나는 너희에게 내 얼굴을 대적하게 하겠다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘얼굴’ 이미지를 살리면서, 한국어로는 ‘돌리다’가 반대·거절의 태도를 자연스럽게 드러냅니다. ‘against’를 너무 추상적으로 풀지 않고 관계적 심판의 뉘앙스를 유지했습니다.
- source_word: וְנִגַּפְתֶּם
  english_pob_choice: you will be struck down
  chosen_korean: 너희는 ... 쓰러질 것이며
  alternatives_korean:
  - 너희는 ... 타격을 입을 것이며
  - 너희는 ... 패배할 것이며
  lexicon: HALOT
  rationale: 전투·심판 문맥에서 ‘נגף’는 단순 패배보다 ‘넘어져 쓰러짐’의 생생함이 있습니다. ‘쓰러질 것이다’는 그 힘을 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: וְרָדוּ בָכֶם שֹׂנְאֵיכֶם
  english_pob_choice: those who hate you will rule over you
  chosen_korean: 너희를 미워하는 자들이 너희를 다스릴 것이고
  alternatives_korean:
  - 너희를 미워하는 자들이 너희를 지배할 것이고
  - 너희를 미워하는 자들이 너희 위에 군림할 것이고
  lexicon: HALOT
  rationale: ‘רדה’는 다스림/통치의 뜻이 기본이므로, 과도한 해석을 더하지 않는 ‘다스리다’를 택했습니다. ‘너희를 미워하는 자들’은 앞의 ‘원수들’과 구별되는 히브리어 분사를 반영합니다.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  english_pob_choice: you will flee when no one is pursuing you
  chosen_korean: 너희는 쫓는 자가 없어도 도망칠 것입니다
  alternatives_korean:
  - 너희는 아무도 पीछ적하지 않는데도 도망칠 것입니다
  - 너희는 추격자가 없는데도 도망칠 것입니다
  lexicon: HALOT
  rationale: ‘אין’의 부정과 ‘רודף’의 현재적 추격 부재를 자연스럽게 풀어, 실제 위협이 없는데도 공포로 도망치는 역설을 살렸습니다. ‘도망칠 것입니다’는 문맥상 전쟁·공포의 반응을 분명하게 드러냅니다.
theological_decisions:
- issue: 하나님의 얼굴을 향하게 하는 의인화 표현
  chosen_reading: ‘내 얼굴을 돌리겠다’로 관용구를 보존했습니다.
  alternative_readings:
  - ‘너희를 대적하겠다’
  - ‘너희에게 등을 돌리겠다’
  rationale: 히브리어의 관계적·언약적 심판 표현을 평면적 적대감으로 약화시키지 않기 위해 얼굴 이미지를 유지했습니다. 독자가 하나님이 인격적으로 심판에 임하신다는 점을 보게 합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 열방의 통치 강도의 범위
  chosen_reading: ‘다스릴 것이다’로 옮겨 원문의 통치 진술을 보존했습니다.
  alternative_readings:
  - ‘지배할 것이다’
  - ‘학대하며 군림할 것이다’
  rationale: 문맥상 굴욕적 종속을 암시하지만, 히브리어가 직접 말하는 것은 ‘다스림’이므로 해석을 과잉하지 않았습니다. 심판의 무게는 문맥 전체가 담당합니다.
  doctrine_reference: Translation philosophy §1, §3
