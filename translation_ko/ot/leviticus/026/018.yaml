id: LEV.26.18
reference: Leviticus 26:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
  footnotes:
  - marker: a
    text: Or 'for all this' or 'after all this'; the Hebrew idiom means in spite of the preceding judgments.
    reason: lexical_alternative
  - marker: b
    text: Or 'seven times.' The Hebrew may denote intensified punishment rather than a strictly numerical count.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일[a] 이런 일들 가운데서도 너희가 내 말을 듣지 않으면[b], 나는 너희 죄 때문에 너희를 일곱 배로 계속 징계하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 일로 인해’, ‘이 모든 일 후에’입니다. 히브리어 관용구는 앞선 징계에도 불구하고라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일곱 번’. 히브리어는 엄밀한 횟수보다 징계의 강화를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 그러나 만일
  - 만일
  lexicon: HALOT
  rationale: 조건을 여는 연결어로서 ו의 흐름을 살리되, 문맥상 경고의 연속성을 자연스럽게 드러냅니다.
- source_word: עַד אֵלֶּה
  english_pob_choice: despite these things
  chosen_korean: 이런 일들 가운데서도
  alternatives_korean:
  - 이런 일들 후에도
  - 이런 일들에도 불구하고
  - 이 모든 일에도
  lexicon: HALOT
  rationale: 이미 주어진 징계들을 거슬러 계속 불순종한다는 관용구적 의미를 반영해, 시간표현이 아니라 ‘그럼에도 불구하고’의 뉘앙스를 살렸습니다.
- source_word: לֹא תִשְׁמְעוּ לִי
  english_pob_choice: you do not listen to me
  chosen_korean: 내 말을 듣지 않으면
  alternatives_korean:
  - 내게 순종하지 않으면
  - 내 말을 들으려 하지 않으면
  - 내 말을 듣지 않고
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다/들어 순종하다’라는 중의성을 유지하면서, 한국어에서는 ‘내 말을 듣다’가 가장 자연스럽게 그 긴장을 전달합니다.
- source_word: לְיַסְּרָה
  english_pob_choice: to discipline
  chosen_korean: 징계하겠습니다
  alternatives_korean:
  - 훈계하겠습니다
  - 벌하겠습니다
  - 교정하겠습니다
  lexicon: HALOT
  rationale: 언약적 제재의 징벌성과 교정성을 함께 담기 위해 ‘징계’로 옮겼으며, 지나치게 완화된 ‘교정’이나 단순한 ‘벌’보다 원문의 긴장을 더 잘 보존합니다.
- source_word: שֶׁבַע
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배로
  alternatives_korean:
  - 일곱 번으로
  - 일곱 겹으로
  lexicon: HALOT
  rationale: 히브리어의 강화 용법을 한국어에서 직역에 가깝게 살려, 수량보다 강도의 증폭을 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: יִסֵּר의 번역에서 징벌성과 교정성의 긴장 유지
  chosen_reading: 징계
  alternative_readings:
  - 벌
  - 훈육
  - 교정
  rationale: 이 절은 언약 저주 맥락의 경고이지만 단순 보복으로 축소되지도 않으므로, ‘징계’가 심판성과 훈육성을 함께 드러내는 가장 균형 잡힌 선택입니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
