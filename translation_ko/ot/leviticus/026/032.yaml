  naturalness: 문두와 두 번째 절에 ‘그리고’를 연속하여 쓰는 것은 히브리어 접속을 기계적으로 재현한 듯하여 현대 한국어 문장으로는 다소 부자연스럽습니다. 한국어에서는 문장 분리와 주제 제시만으로 병렬 관계가 자연스럽게 드러납니다. 또한 현 각주는 본문의 ‘보고 놀랄 것입니다’를 그대로 반복하고 ‘황폐함 앞에서’라는 표현도 매끄럽지 않습니다.
