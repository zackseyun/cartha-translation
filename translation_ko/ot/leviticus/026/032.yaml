  - 그것을 보고 황망해할 것입니다
  lexicon: HALOT
  rationale: שׁמם의 반응 의미를 살리되, 대상이 '원수들'이므로 '앗상한 정황 앞에서 놀라움/경악'이라는 반응으로 읽히는 점을 한국어로 자연스럽게 표현했습니다.
- source_word: הַיֹּשְׁבִים בָּהּ
  english_pob_choice: who dwell in it
  chosen_korean: 그곳에 사는
  alternatives_korean:
  - 그 안에 거주하는
  - 그 안에 머무는
  - 거기에 사는
  lexicon: HALOT
  rationale: ישׁב의 거주 의미를 살리면서도 한국어 문장 흐름에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: 그 땅
  alternative_readings:
  - 온 땅
  - 땅
  rationale: 레위기의 언약 저주 맥락에서는 보편적 '세상'이 아니라 언약의 땅을 가리키므로 '그 땅'으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 연결사 וְ의 처리
  chosen_reading: 그리고 ... 그리고 ...
  alternative_readings:
  - 그래서 ...
  - 그러므로 ...
  rationale: 히브리어 접속을 결과 목적 뉘앙스보다 직접적인 병렬로 보존하기 위해 '그리고'를 유지했습니다.
  doctrine_reference: Applied revision audit
