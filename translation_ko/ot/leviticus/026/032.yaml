source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
  footnotes:
  - marker: a
    text: Or 'will be astonished at it' or 'will be horrified at it.' The Hebrew verb can express appalled astonishment in response to devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 친히 그 땅을 황폐하게 하겠습니다. 그리고 그곳에 사는 너희의 원수들이 그것을 보고 놀랄 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보고 놀랄 것입니다”, “보고 경악할 것입니다”라고도 옮길 수 있습니다. 히브리어 동사는 황폐함 앞에서 놀라움과 경악을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  english_pob_choice: will lay ... waste
  chosen_korean: 황폐하게 하겠습니다
  alternatives_korean:
  - 황무지로 만들겠습니다
  - 황폐케 하겠습니다
  - 황폐시키겠습니다
  lexicon: HALOT
  rationale: causative 어감인 'lay ... waste'를 자연스러운 현대 한국어로 옮기되, 문맥의 심판적 파괴성을 유지했습니다.
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 친히
  alternatives_korean:
  - 내가
  - 나 자신이
  - 내가 직접
  lexicon: HALOT
  rationale: 독립대명사의 강조를 살리기 위해 주어를 단순 반복하지 않고 '친히'로 강조를 드러냈습니다.
- source_word: וְשָׁמְמוּ עָלֶיהָ
  english_pob_choice: will be appalled at it
  chosen_korean: 그것을 보고 놀랄 것입니다
  alternatives_korean:
  - 그것을 보고 경악할 것입니다
  - 그것을 보고 어찌할 바를 모를 것입니다
  - 그것을 보고 황망해할 것입니다
  lexicon: HALOT
  rationale: שׁמם의 반응 의미를 살리되, 대상이 '원수들'이므로 '앗상한 정황 앞에서 놀라움/경악'이라는 반응으로 읽히는 점을 한국어로 자연스럽게 표현했습니다.
- source_word: הַיֹּשְׁבִים בָּהּ
  english_pob_choice: who dwell in it
  chosen_korean: 그곳에 사는
  alternatives_korean:
  - 그 안에 거주하는
  - 그 안에 머무는
  - 거기에 사는
  lexicon: HALOT
  rationale: ישׁב의 거주 의미를 살리면서도 한국어 문장 흐름에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: 그 땅
  alternative_readings:
  - 온 땅
  - 땅
  rationale: 레위기의 언약 저주 맥락에서는 보편적 '세상'이 아니라 언약의 땅을 가리키므로 '그 땅'으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 연결사 וְ의 처리
  chosen_reading: 그리고 ... 그리고 ...
  alternative_readings:
  - 그래서 ...
  - 그러므로 ...
  rationale: 히브리어 접속을 결과 목적 뉘앙스보다 직접적인 병렬로 보존하기 위해 '그리고'를 유지했습니다.
  doctrine_reference: Applied revision audit
