translation:
  language: ko
  text: 너희는 내 안식일들을 지키고 내 성소를 경외해야 합니다. 나는 야훼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 성소를 두려워해야 합니다’ 혹은 ‘내 성소를 경외해야 합니다.’ 히브리어 동사는 문맥에 따라 두려움, 경외, 경건한 떨림을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 내 안식일 규례들
  - 내 안식일 절기들
  lexicon: HALOT
  rationale: 복수형이므로 단수 ‘안식일’보다 복수성을 드러내는 ‘안식일들’이 원문에 가깝습니다. ‘내’로 1인칭 소유도 분명히 했습니다.
- source_word: תִּשְׁמֹרוּ
  english_pob_choice: you shall keep
  chosen_korean: 지키고
  alternatives_korean:
  - 준수하고
  - 지켜야 합니다
  - 보존하고
  lexicon: HALOT
  rationale: 계명과 거룩한 절기를 대상으로 한 שׁמר의 의미를 한국어 ‘지키다’가 가장 자연스럽고 압축적으로 전달합니다.
- source_word: וּמִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 처소
  - 내 성막
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 거룩한 처소/성소를 뜻하므로, 광야 성막 맥락까지 포괄할 수 있는 ‘성소’가 안전합니다.
- source_word: תִּירָאוּ
  english_pob_choice: revere
  chosen_korean: 경외해야 합니다
  alternatives_korean:
  - 두려워해야 합니다
  - 공경해야 합니다
  - 두려워하며 경외해야 합니다
  lexicon: HALOT
  rationale: 성소를 대상으로 한 ירא는 단순 공포보다 경외와 거룩한 두려움을 함께 담는 표현이 필요하므로 ‘경외하다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: תֵּ트라그라마톤은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신적 고유명 자체를 보존합니다.
theological_decisions:
- issue: 서술형 계명 문장의 한국어 종결
  chosen_reading: 지켜야 합니다 / 경외해야 합니다
  alternative_readings:
  - 지키십시오 / 경외하십시오
  - 지킬지니라 / 경외할지니라
  rationale: 원문의 명령형을 현대 표준어 합쇼체로 자연스럽게 옮기되, 공적 율법 문장의 권위를 유지했습니다.
  doctrine_reference: Translation philosophy §§5–6
