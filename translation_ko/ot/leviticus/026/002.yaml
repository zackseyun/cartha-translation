  - 보존하고
  lexicon: HALOT
  rationale: 계명과 거룩한 절기를 대상으로 한 שׁמר의 의미를 한국어 ‘지키다’가 가장 자연스럽고 압축적으로 전달합니다.
- source_word: וּמִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 처소
  - 내 성막
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 거룩한 처소/성소를 뜻하므로, 광야 성막 맥락까지 포괄할 수 있는 ‘성소’가 안전합니다.
- source_word: תִּירָאוּ
  english_pob_choice: revere
  chosen_korean: 경외해야 합니다
  alternatives_korean:
  - 두려워해야 합니다
  - 공경해야 합니다
  - 두려워하며 경외해야 합니다
  lexicon: HALOT
  rationale: 성소를 대상으로 한 ירא는 단순 공포보다 경외와 거룩한 두려움을 함께 담는 표현이 필요하므로 ‘경외하다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
