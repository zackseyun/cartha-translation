  lexicon: HALOT
  rationale: 복수형이므로 단수 ‘안식일’보다 복수성을 드러내는 ‘안식일들’이 원문에 가깝습니다. ‘내’로 1인칭 소유도 분명히 했습니다.
- source_word: תִּשְׁמֹרוּ
  english_pob_choice: you shall keep
