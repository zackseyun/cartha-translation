base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
  footnotes:
  - marker: a
    text: Or, more formally, 'You will eat old store long kept, and you will bring out the old because of the new.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 오래된 것, 오래 저장된 것을 먹고, 새 것으로 말미암아 오래된 것을 내놓을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오래된 것, 오래 저장된 것’은 히브리어의 중첩 표현을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  english_pob_choice: You will eat
  chosen_korean: 먹고
  alternatives_korean:
  - 먹을 것입니다
  - 드실 것입니다
  lexicon: HALOT
  rationale: 약속의 맥락에서 미래적 의미를 자연스럽게 살리되, 한국어에서는 앞뒤 동사와의 병렬을 고려해 간결하게 처리했습니다.
- source_word: יָשָׁן נוֹשָׁן
  english_pob_choice: old stores long kept
  chosen_korean: 오래된 것, 오래 저장된 것
  alternatives_korean:
  - 오래된 저장물
  - 오래 묵은 저장 양식
  - 오래된 곡식, 오래 묵은 것
  lexicon: HALOT
  rationale: 두 형용사의 중첩이 저장된 식량의 오래됨을 강조하므로, 구체 대상을 과잉 특정하지 않고 ‘오래된/오래 저장된 것’으로 옮겼습니다.
- source_word: וְיָשָׁן
  english_pob_choice: the old
  chosen_korean: 오래된 것
  alternatives_korean:
  - 옛것
  - 오래 묵은 것
  lexicon: HALOT
  rationale: 두 번째 용례도 명사적으로 쓰여 새 수확에 밀려나는 기존 저장분을 가리키므로, 앞 항과 같은 표현으로 대응했습니다.
- source_word: מִפְּנֵי חָדָשׁ תּוֹצִיאוּ
  english_pob_choice: you will clear out the old because of the new
  chosen_korean: 새 것으로 말미암아 오래된 것을 내놓을 것입니다
  alternatives_korean:
  - 새 것으로 인해 오래된 것을 치울 것입니다
  - 새것 때문에 오래된 것을 밖으로 내보낼 것입니다
  - 새 것으로 인하여 오래된 것을 제거할 것입니다
  lexicon: HALOT
  rationale: מִפְּנֵי는 단순한 ‘before’보다 원인·대치의 뉘앙스가 강해 ‘말미암아’로 옮겼고, תּוֹצִיאוּ는 문맥상 ‘내놓다/꺼내다’의 실질적 동작을 살렸습니다.
