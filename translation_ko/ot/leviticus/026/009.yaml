review_pass:
  verdict: revise
  source_fidelity: 첫 동사 פנה는 ‘돌아서다’만으로는 방향이 불분명하거나 등을 돌리는 인상을 줄 수 있습니다. ‘너희에게로 몸을 돌리다’는 אֲלֵיכֶם의 방향성과 구체적 이미지를 더 정확히 보존합니다. ‘번성하게 하다’, ‘많게 하다’, ‘내 언약을 너희와 굳게 세우다’는 각각 히브리어의 사역형 병렬과 언약 확립의 뜻을 충실히 전달합니다.
  naturalness: ‘너희를 많아지게 하다’보다 ‘너희를 많게 하다’가 현대 표준어 문장에서는 더 간결하고 자연스럽습니다. ‘너희와 내 언약’은 수식 관계가 잠시 불분명할 수 있어 ‘너희와 맺은 내 언약’으로 풀지 않고도, ‘내 언약을 너희와 굳게 세우다’라는 성경적이면서 자연스러운 구문으로 처리했습니다.
  terminology: ‘언약’은 בְּרִית의 확립된 핵심 용어이므로 유지했습니다. ‘굳게 세우다’는 הֵקִים בְּרִית의 확립·확증 의미를 한국어 관용에 맞게 나타내며, 새 언약을 체결한다는 의미를 불필요하게 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘너희에게로 돌아서서’는 원문의 방향성과 문맥상 호의의 의미를 한국어에서 충분히 명료하게 드러내지 못할 수 있습니다.
    rationale: ‘돌아서다’는 등을 돌리거나 단순히 되돌아온다는 뜻으로도 읽힐 수 있습니다. ‘너희에게로 몸을 돌리다’는 פנה와 전치사 אֶל의 ‘~을 향해 돌리다’라는 기본 이미지를 더 안전하게 전달합니다.
  - severity: low
    issue: ‘너희를 많아지게 하며’는 다소 장황합니다.
    rationale: 사역 의미와 병렬을 유지하면서 ‘너희를 많게 하고’로 쓰는 편이 현대 표준어에 더 자연스럽습니다.
  - severity: low
    issue: 각주 대안 ‘너희에게 호의로 돌아서겠다’는 한국어 어법상 부자연스럽습니다.
    rationale: 호의의 문맥적 함의는 ‘너희에게 호의를 보이겠다’로 표현하는 것이 자연스럽고, 문자적 표현과의 구별도 분명합니다.
  revised_text: 내가 너희에게로 몸을 돌려 너희를 번성하게 하고 너희를 많게 하며, 내 언약을 너희와 굳게 세우겠습니다.[a]
