id: LEV.26.9
reference: Leviticus 26:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
  footnotes:
  - marker: a
    text: Or 'look favorably on you.' The Hebrew literally says 'turn toward you,' which in context implies divine favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게로 돌아서서 너희를 번성하게 하고 너희를 많아지게 하며, 너희와 내 언약을 세우겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게 호의로 돌아서겠다.’ 히브리어는 문자적으로 ‘너희에게로 돌아서다’라고 하며, 문맥상 하나님의 호의를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  english_pob_choice: I will turn toward you
  chosen_korean: 너희에게로 돌아서서
  alternatives_korean:
  - 너희를 향하여 돌이켜
  - 너희에게로 향하여
  lexicon: HALOT
  rationale: פנה의 기본 이미지인 ‘돌아서다/향하다’를 살려, 하나님의 호의라는 함의를 본문에서 미리 풀어 쓰지 않고 방향 전환의 구체적 그림을 유지했습니다.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  english_pob_choice: make you fruitful
  chosen_korean: 너희를 번성하게 하고
  alternatives_korean:
  - 너희를 열매 맺게 하고
  - 너희를 плод성하게 하고
  lexicon: HALOT
  rationale: פרה의 결실·풍성함을 한국어에서 자연스럽게 전달하면서, 언약적 복의 문맥을 고려해 ‘번성하게 하다’로 옮겼습니다.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  english_pob_choice: multiply you
  chosen_korean: 너희를 많아지게 하며
  alternatives_korean:
  - 너희 수를 늘리며
  - 너희를 증대시키며
  lexicon: HALOT
  rationale: רבה의 ‘많게 하다/증가시키다’를 직관적으로 살려, 앞의 ‘번성하게 하다’와 병렬을 이루도록 했습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 내 계약
  - 내 조약
  lexicon: HALOT
  rationale: בְּרִית은 성경적 언약 개념을 가리키므로, 한국어 성경에서 확립된 ‘언약’을 유지했습니다.
theological_decisions:
- issue: פנה를 하나님의 호의로 명시적으로 풀어쓸지 여부
  chosen_reading: 주어의 방향 전환 이미지를 본문에 남기고, 호의의 의미는 문맥이 드러내도록 했습니다.
  alternative_readings:
  - 너희를 호의로 바라보겠다
  - 너희를 좋게 보겠다
  rationale: 히브리어는 직접적으로 ‘좋게 보다’가 아니라 ‘돌아서다/향하다’이므로, 본문 투명성을 위해 이미지적 표현을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문의 평이한 뜻과 이미지를 우선 보존하고, 문맥상 함의는 독자가 읽어내도록 한다.'
- issue: ‘fruitful and multiply’의 언약적 축복 공식 유지 여부
  chosen_reading: ‘번성하게 하고 너희를 많아지게 하며’로 병렬 구조를 유지했습니다.
  alternative_readings:
  - 풍성하게 하고 수를 늘리며
  - 열매 맺게 하고 크게 불려
  rationale: 창세기의 복의 공식과 연결되는 표현이므로, 단순 인구 증가로 축소하지 않고 축복의 언약적 울림을 보존했습니다.
  doctrine_reference: 정규 용례와 성경 내 상호연관을 살리는 일관성 원칙
