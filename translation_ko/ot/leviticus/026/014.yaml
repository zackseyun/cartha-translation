  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
  footnotes:
  - marker: a
    text: Or 'obey me.' The Hebrew verb can carry the sense of obedient listening, though the main text preserves the more literal wording 'listen to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 너희가 내 말을 듣지 않고 이 모든 계명을 다 행하지 않으면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 순종하지.’ 히브리어 동사는 ‘순종하는 듣기’의 뜻을 띨 수 있으나, 본문은 보다 문자적인 ‘내 말을 듣지’라는 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞절의 복과 대비되는 조건문이므로, 역접의 흐름을 살린 ‘그러나’와 조건을 분명히 하는 ‘만일’을 함께 쓰는 것이 자연스럽습니다.
- source_word: תִשְׁמְעוּ לִי
  english_pob_choice: listen to me
  chosen_korean: 내 말을 듣지
  alternatives_korean:
  - 내게 순종하지
  - 나를 듣지
  lexicon: HALOT
  rationale: שׁמע ל의 문자적 의미를 살려 ‘듣다’로 옮기고, 소유격 ‘내’를 붙여 여호와의 말씀을 듣는 관계를 드러냈습니다. ‘순종하다’는 의미는 다음 절의 ‘행하지’와 함께 충분히 드러납니다.
- source_word: תַעֲשׂוּ
  english_pob_choice: do
  chosen_korean: 행하지
  alternatives_korean:
  - 하지
  - 실행하지
  - 지키지
  lexicon: HALOT
  rationale: 율법 문맥에서 עשה는 단순한 ‘하다’보다 규범을 실제로 실행한다는 뜻이 강하므로, ‘행하다’가 문맥에 더 맞습니다.
- source_word: הַמִּצְוֺת הָאֵלֶּה
  english_pob_choice: these commandments
  chosen_korean: 이 모든 계명
  alternatives_korean:
  - 이 모든 명령
  - 이 계명들
  - 이 모든 법도
  lexicon: HALOT
  rationale: מִצְוֺת은 율법적 ‘계명’이 가장 직접적인 대응어이며, הָאֵלֶּה는 바로 앞에서 제시된 계명을 가리키므로 ‘이’로 처리했습니다. 영어 본문처럼 총괄성을 드러내기 위해 ‘모든’을 유지했습니다.
theological_decisions:
- issue: שׁמע ל의 번역을 ‘듣지’로 둘지 ‘순종하지’로 풀지
  chosen_reading: ‘내 말을 듣지’로 유지하고, 불순종의 의미는 뒤의 ‘행하지’와 함께 드러나게 함
  alternative_readings:
  - 내게 순종하지
  - 내 말을 듣지 않고 순종하지
  rationale: 원문은 ‘듣기’와 ‘행하기’를 두 개의 평행 절로 나누어 표현하므로, 첫 절을 ‘순종’으로 합쳐 버리면 구분이 사라집니다. 문자적 청취를 살리되 전체 문맥에서 불순종의 뜻이 분명해집니다.
  doctrine_reference: 번역 원칙 §3, §5
