  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will sift out from among you.' The Hebrew verb conveys separating out those unfit to remain within the community.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the land of their sojournings.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew has a singular verb, 'he will not enter,' used with a collective/distributive sense for the group.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 가운데서 반역하는 자들과 나에게 죄를 짓는 자들을 걸러 내어, 그들이 머무는 땅에서 그들을 끌어내겠으나, 그들은 이스라엘 땅에 들어오지 못할 것입니다. 그러면 너희는 내가 야훼인 줄 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸러 내어’는 히브리어 ברר의 분리·선별 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들이 머무는 땅’은 문자적으로는 ‘그들의 거류의 땅/나그네 됨의 땅’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수 동사 형태를 쓰지만, 여기서는 집단을 가리키는 뜻으로 ‘그들은’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוֹתִי
  english_pob_choice: I will purge
  chosen_korean: 걸러 내어
  alternatives_korean:
  - 정결하게 하여 제거하겠습니다
  - 쳐내겠습니다
  - 제거하겠습니다
  lexicon: HALOT
  rationale: ברר의 선별·분리 의미를 살리되, 한국어에서 심판적 분리를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: הַמֹּרְדִים
  english_pob_choice: the rebels
  chosen_korean: 반역하는 자들
  alternatives_korean:
  - 반역자들
  - 거역하는 자들
  lexicon: HALOT
  rationale: 분사형의 지속적 성격을 살려 단순 명사보다 행위성을 드러내는 표현을 택했습니다.
- source_word: וְהַפֹּשְׁעִים בִּי
  english_pob_choice: those who transgress against me
  chosen_korean: 나에게 죄를 짓는 자들
  alternatives_korean:
  - 나를 거역하는 자들
  - 나를 범죄하는 자들
  lexicon: HALOT
  rationale: פּשע의 언약적 위반 뉘앙스를 살리면서, 앞의 מרד와 겹치지 않도록 ‘반역’보다 넓은 ‘죄를 짓다’로 구분했습니다.
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  english_pob_choice: out of the land where they sojourn
  chosen_korean: 그들이 머무는 땅에서
  alternatives_korean:
  - 그들의 나그네 된 땅에서
  - 그들이 거류하는 땅에서
  lexicon: HALOT
  rationale: מגור은 본래 나그네·거류의 삶을 가리키지만, 한국어에서는 문맥상 자연스러운 ‘머무는 땅’으로 옮겨 소속되지 않은 임시 거주성을 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기준에 따라 신명기적 고유명사 יְהוָה를 титул이 아니라 고유명사 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 심판 동사의 강도
  chosen_reading: 걸러 내어
  alternative_readings:
  - 제거하여
  - 분리하여
  rationale: 본문은 공동체 안에서 부적합한 자들을 분리해 내는 심판을 말하므로, 지나치게 중화하지 않으면서도 한국어로는 ‘걸러 내다’가 선별·배제의 뜻을 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: preserve source-text plain sense; do not soften the judgment language beyond what the source warrants.'
- issue: 여기서의 하나님의 이름
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문 끝의 יְהוָה는 호칭이 아니라 언약적 고유명사이므로, 프로젝트 기준에 따라 ‘야훼’로 일관되게 표기했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
