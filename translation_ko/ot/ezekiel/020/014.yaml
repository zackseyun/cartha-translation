  - marker: b
    text: '''Profaned'' translates a verb meaning to treat as common or desecrate what is holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 이름을 위하여 행하여, 내가 그들을 이끌어 낼 때 그것을 본 나라들 앞에서 내 이름이 더럽혀지지 않게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘내 이름 때문에’ 또는 ‘내 이름을 위해’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더럽혀지다’는 거룩한 것을 일반적인 것처럼 취급하여 욕되게 하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  english_pob_choice: But I acted
  chosen_korean: 그러나 나는 … 그렇게 행했습니다
  alternatives_korean:
  - 그러나 나는 … 했습니다
  - 그러나 나는 … 행동했습니다
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다, 행하다, 조치하다’의 뜻을 가지므로, 하나님이 이전의 심판 선언과 대조적으로 실제로 조처하셨다는 점을 살려 ‘행했습니다’로 옮겼습니다.
- source_word: לְמַעַן שְׁמִי
  english_pob_choice: for the sake of my name
  chosen_korean: 내 이름을 위해
  alternatives_korean:
  - 내 이름의 연고로
  - 내 이름의 명예를 위해
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 한국어로 자연스럽게 옮기되, 하나님의 이름과 그 이름의 명예/명성이라는 함의를 유지하기 위해 직역에 가까운 표현을 택했습니다.
- source_word: לְבִלְתִּי הֵחֵל
  english_pob_choice: so that it would not be profaned
  chosen_korean: 더럽혀지지 않게 하려는 것이었습니다
  alternatives_korean:
  - 속되게 되지 않게 하려는 것이었습니다
  - 거룩하지 않게 취급되지 않게 하려는 것이었습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 일반적인 것으로 취급하여 욕되게 하는 것이므로, 한국어에서는 성결/오염 이미지를 살리는 ‘더럽혀지다’로 옮겼습니다.
- source_word: לְעֵינֵי הַגּוֹיִם / לְעֵינֵיהֶם
  english_pob_choice: in the sight of the nations / in whose sight
  chosen_korean: 나라들의 눈앞에서 / 그들의 눈앞에서
  alternatives_korean:
  - 나라들 앞에서 / 그들 앞에서
  - 나라들이 보는 가운데 / 그들이 보는 가운데
  lexicon: HALOT
  rationale: ‘눈’과 ‘보다’의 반복을 살려, 공개적으로 목격되는 행위라는 히브리어 강조를 유지했습니다. 다만 한국어에서는 중복을 줄이기 위해 첫 구절은 ‘눈앞에서’로, 뒤의 יחס절도 같은 표현으로 이어 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님의 이름과 공개적 거룩의 보전
  chosen_reading: 하나님은 열방 앞에서 자기 이름이 속되게 여겨지지 않도록 자신의 행위를 절제하십니다.
  alternative_readings:
  - 단순히 평판을 지키기 위한 조치로 읽기
  - 형식적인 체면 보전으로 읽기
  rationale: 에스겔에서 ‘이름’은 단순 명성보다 계시된 성품과 언약적 명예를 가리키므로, 공적인 증인들 앞에서 하나님의 거룩이 훼손되지 않도록 하신다는 뜻을 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
