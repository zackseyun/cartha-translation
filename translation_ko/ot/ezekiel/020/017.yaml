  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
  footnotes:
  - marker: a
    text: 'Hebrew: ''my eye spared them,'' an idiom expressing compassionate restraint.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 눈은 그들을 아껴 멸망시키지 않았고,[a] 광야에서 그들을 완전히 멸하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 눈이 그들을 아꼈다’라는 관용적 표현으로, 자비를 베풀어 멸망을 억제했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחָס / עֵינִי
  english_pob_choice: my eye spared them
  chosen_korean: 내 눈이 그들을 불쌍히 여겼고
  alternatives_korean:
  - 내가 그들을 불쌍히 여겼고
  - 내 눈이 그들을 아꼈고
  lexicon: HALOT
  rationale: 히브리어는 ‘내 눈’이라는 신체 은유로 자비로운 절제를 표현하므로, 주어를 평면화하지 않고 ‘내 눈이’와 ‘불쌍히 여겼고’로 그 이미지를 살렸습니다.
- source_word: מִשַּׁחֲתָם
  english_pob_choice: from destroying them
  chosen_korean: 그들을 멸망시키지 않으려고
  alternatives_korean:
  - 그들을 파멸시키지 않으려고
  - 그들을 멸하지 않으려고
  lexicon: HALOT
  rationale: מן + 부정사구가 ‘그들을 멸망시키는 것에서/멸망시키지 않도록’의 의미를 가지므로, 결과를 자연스럽게 풀어 한국어 목적절로 옮겼습니다.
- source_word: כָּלָה
  english_pob_choice: make a complete end
  chosen_korean: 완전히 멸하지 않았습니다
  alternatives_korean:
  - 완전한 끝을 내지 않았습니다
  - 완전히 끝장내지 않았습니다
  lexicon: HALOT
  rationale: עשה כלה는 ‘완전한 끝, 전멸’을 뜻하는 관용이므로, 종결성과 강도를 유지하는 ‘완전히 멸하지 않았다’로 옮겼습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들에서
  - 사막에서
  lexicon: HALOT
  rationale: 출애굽 문맥의 מדבר은 단순 지리어보다 언약사적 배경을 지닌 ‘광야’가 더 적절합니다.
theological_decisions:
- issue: 하나님의 자비를 신체 은유로 유지할지 여부
  chosen_reading: ‘내 눈이 그들을 불쌍히 여겼고’로 옮겨, 신체 은유를 유지했습니다.
  alternative_readings:
  - 내가 그들을 불쌍히 여겼고
  - 내가 그들을 가엾게 여겨
  rationale: 본문은 하나님을 인간적 방식으로 묘사해 자비의 절제를 강조합니다. 이를 추상화하면 수사적 힘이 약해지므로, 원문의 이미지와 긴장을 보존했습니다.
  doctrine_reference: 번역 철학 §1, §3
