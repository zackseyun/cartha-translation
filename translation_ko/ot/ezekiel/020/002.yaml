  lexicon: HALOT
  rationale: 원문의 고유명사 יְהוָה를 전통적 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, 하나님의 이름 자체를 보존했습니다.
- source_word: אֵלַי לֵאמֹר
  english_pob_choice: to me, saying
  chosen_korean: 내게 임하여 말씀하셨습니다
