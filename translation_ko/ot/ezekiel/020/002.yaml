  - 내게 와서 말씀하셨습니다
  - 내게 이르러 말씀하셨습니다
  lexicon: HALOT
  rationale: 직역 구조를 유지하되 한국어에서는 ‘말씀이 내게 임하다’가 예언적 수신을 가장 자연스럽게 드러내므로, 이어지는 직접화법 표지를 ‘말씀하셨습니다’로 정리했습니다.
