id: EZK.20.35
reference: Ezekiel 20:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֶתְ/כֶ֔ם אֶל מִדְבַּ֖ר הָֽ/עַמִּ֑ים וְ/נִשְׁפַּטְתִּ֤י אִתְּ/כֶם֙ שָׁ֔ם פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
  footnotes:
  - marker: a
    text: Or, 'I will judge you there face to face.' The Hebrew verb can be rendered more simply as 'judge,' but the phrasing also carries the sense of entering into judicial proceedings with someone.
    reason: lexical_alternative
  - marker: b
    text: '''The wilderness of the peoples'' may refer to a wilderness-like place among the nations where Israel had been scattered.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 너희를 백성들의 광야로 데려가고, 거기서 너희와 얼굴을 마주하고 심판하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백성들의 광야’는 이스라엘이 흩어진 열방 가운데의 광야 같은 곳을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 단순히 ‘심판하다’로도 옮길 수 있지만, 여기서는 법정에 들어가 대면하는 뉘앙스가 함께 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  english_pob_choice: I will bring
  chosen_korean: 데려가고
  alternatives_korean:
  - 데려오고
  - 인도하고
  lexicon: HALOT
  rationale: הֵבֵאתִי는 단순한 이동보다 ‘어느 곳으로 이르게 하다/데려가다’의 뉘앙스를 가지므로, 자연스럽게 ‘데려가고’로 옮겼습니다.
- source_word: אֶל מִדְבַּר הָעַמִּים
  english_pob_choice: into the wilderness of the peoples
  chosen_korean: 백성들의 광야로
  alternatives_korean:
  - 민족들의 광야로
  - 그 백성들의 광야로
  lexicon: HALOT
  rationale: מִדְבַּר הָעַמִּים은 직역하면 ‘백성들의 광야’이므로, POB의 문화적 주석을 과도하게 해석하지 않고도 한국어에서 직관적인 표현으로 살렸습니다.
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  english_pob_choice: I will enter into judgment with you
  chosen_korean: 너희와 ... 심판하겠습니다
  alternatives_korean:
  - 너희를 심판하겠습니다
  - 너희와 심판에 들어가겠습니다
  lexicon: HALOT
  rationale: נִשְׁפַּטְתִּי אִתְּכֶם은 단순 판결 선고보다 ‘함께 법정적 심판에 들어가는’ 뉘앙스가 있어, 한국어에서는 ‘심판하다’를 쓰되 주어-목적어 관계를 ‘너희와’로 유지했습니다.
- source_word: פָּנִים אֶל פָּנִים
  english_pob_choice: face to face
  chosen_korean: 얼굴을 마주하고
  alternatives_korean:
  - 얼굴과 얼굴로
  - 얼굴을 맞대고
  lexicon: HALOT
  rationale: 관용구의 직접성을 살리면서 현대 한국어에서 자연스럽게 들리도록 ‘얼굴을 마주하고’로 옮겼습니다.
theological_decisions:
- issue: 고발-심판의 법정적 긴장감
  chosen_reading: 하나님이 일방적으로 판결만 내리는 것이 아니라, 언약 상대와 대면하여 심판 절차에 들어가시는 장면으로 읽었습니다.
  alternative_readings:
  - 너희를 그냥 심판하겠습니다
  - 너희를 벌하겠습니다
  rationale: 히브리어 נִשְׁפַּטְתִּי אִתְּכֶם은 대면적·법정적 대결을 시사하므로, 단순한 ‘벌함’보다 상호 대면의 긴장을 보존하는 것이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
