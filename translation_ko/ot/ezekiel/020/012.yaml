  source_fidelity: 히브리어의 첨가 표현(‘또한’), 복수형 ‘내 안식일들’, 표지의 관계(‘나와 그들 사이’), 목적(그들이 알도록), 그리고 מְקַדְּשָׁם의 현재적 분사 의미를 대체로 충실히 반영했습니다. 다만 ‘알게 하려는 것이었습니다’는 목적을 설명하는 한국어 표현으로 다소 우회적이고 어색하여, 목적 용법을 더 직접적으로 옮기는 편이 좋습니다.
