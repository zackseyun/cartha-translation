    [a] 또는 ‘내가 그들에게 손을 들어 올렸다’, 곧 ‘내가 그들에게 맹세했다’는 뜻입니다.

    [b] 또는 ‘내가 그들을 위하여 선택한 땅’; 히브리어는 문자적으로 ‘찾아본’ 또는 ‘정탐한’이라는 뜻입니다.

    [c] 또는 ‘모든 땅의 아름다움’ 또는 ‘모든 땅의 빛남’.'
  rationale: '미래 직접화법을 제거하고, 손을 든 행위의 목적을 원문의 부정사에 맞게 ‘이끌어 내어 … 데려가려고’로 옮겼습니다. תּוּר의 탐색적 뉘앙스는 ‘찾아본’으로 보존했습니다. 다만 b 각주는 본문의 ‘찾아본 땅’ 바로 뒤에 표지로 연결되어야 하므로, 조판 시 ‘찾아본[a?]’이 아니라 ‘찾아본[b] 땅’으로 배치해야 합니다. 완전한 표지 배치를 반영한 본문은 다음과 같습니다: ‘그날 나는 그들을 이집트 땅에서 이끌어 내어, 내가 그들을 위하여 찾아본[b] 땅, 곧 젖과 꿀이 흐르는 땅으로 데려가려고 그들에게 손을 들었습니다.[a] 그 땅은 모든 땅의 영광입니다.[c]’'
