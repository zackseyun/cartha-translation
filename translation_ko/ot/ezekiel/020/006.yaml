reference: Ezekiel 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
  footnotes:
  - marker: a
    text: Or 'I lifted up my hand to them,' that is, 'I swore to them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that I had selected for them'; the Hebrew literally has 'searched out' or 'spied out.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the beauty/splendor of all lands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 나는 그들에게 손을 들어, 그들을 이집트 땅에서 이끌어 내어 내가 그들을 위해 찾아낸 땅, 곧 젖과 꿀이 흐르는 땅으로 들어가게 하겠다고 하였습니다. 그것은 모든 땅의 영광입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들에게 손을 들어 올렸다’, 곧 ‘내가 그들에게 맹세했다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들을 위해 선택한’; 히브리어는 문자적으로는 ‘찾아본’ 또는 ‘정탐한’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모든 땅의 아름다움/빛남’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי
  english_pob_choice: I raised my hand
  chosen_korean: 나는 ... 손을 들어
  alternatives_korean:
  - 나는 ... 손을 들었습니다
  - 나는 ... 맹세했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 살려 ‘손을 들어’로 옮기되, 맹세의 함의는 문맥에서 드러나게 했습니다.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: to bring them out from the land of Egypt
  chosen_korean: 그들을 이집트 땅에서 이끌어 내어
  alternatives_korean:
  - 그들을 이집트 땅에서 데리고 나오게 하여
  - 그들을 이집트 땅에서 끌어내어
  lexicon: HALOT
  rationale: 출애굽의 이동 동사를 자연스러운 한국어로 살리면서도, 원문의 ‘밖으로 나가게 하다’는 사역적 의미를 유지했습니다.
- source_word: אֲשֶׁר תַּרְתִּי לָהֶם
  english_pob_choice: that I had searched out for them
  chosen_korean: 내가 그들을 위해 찾아낸 땅
  alternatives_korean:
  - 내가 그들을 위해 탐사한 땅
  - 내가 그들을 위해 찾아본 땅
  - 내가 그들을 위해 선택한 땅
  lexicon: HALOT
  rationale: תּוּר의 탐색·찾아봄의 의미를 ‘찾아낸’으로 옮겨, 단순한 선택보다 탐색적이고 관계적인 뉘앙스를 보존했습니다.
- source_word: צְבִי ... לְכָל הָאֲרָצוֹת
  english_pob_choice: it is the glory of all lands
  chosen_korean: 그것은 모든 땅의 영광입니다
  alternatives_korean:
  - 그것은 모든 땅의 아름다움입니다
  - 그것은 모든 땅 가운데 영광스러운 땅입니다
  - 그것은 모든 땅의 빛나는 자랑입니다
  lexicon: HALOT
  rationale: צְבִי의 평가적·고양된 의미를 ‘영광’으로 살려, 단순한 미적 표현보다 예언서의 장중한 어조를 유지했습니다.
theological_decisions:
- issue: ‘손을 들다’ 관용구의 맹세 의미를 어디까지 드러낼지
  chosen_reading: 본문에는 ‘손을 들어’라고 두고, 맹세의 뜻은 직접 번역으로 강제하지 않았습니다.
  alternative_readings:
  - ‘맹세했습니다’로 풀어 쓰기
  - ‘손을 들고 맹세했습니다’로 확장하기
  rationale: 원문은 문자적 동작을 통해 맹세를 암시하므로, 의미를 완전히 평탄화하지 않고 독자가 문맥에서 읽어내도록 두는 편이 소스 충실도가 높습니다.
  doctrine_reference: Translation philosophy §1, §3
