  naturalness: 초안의 ‘손을 들어, … 하겠다고 하였습니다’는 현대 한국어에서 다소 부자연스럽고 문장 구조가 과도하게 풀어쓴 형태입니다. 목적절을 ‘이끌어 내어 … 데려가려고’로 구성하면 합쇼체의 장중한 문체와 문장 흐름이 자연스럽습니다.
  terminology: ‘이집트’, ‘젖과 꿀이 흐르는 땅’, ‘모든 땅의 영광’은 적절합니다. 관용구 ‘손을 들었습니다’는 본문에서 보존하고 맹세의 함의는 각주로 밝혀야 합니다. 각주 표지는 해당 표현에 각각 붙여야 합니다.
