base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: ko
  text: 나는 너희를 향기로운 제물처럼 기쁘게 받아들일 것입니다. 내가 너희를 민족들 가운데서 끌어내고, 너희가 흩어져 있던 여러 나라들에서 너희를 모을 때 그렇게 할 것이며, 내가 너희를 통하여 열국의 눈앞에서 나 자신을 거룩하게 드러낼 것입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “향기로운 냄새/향기”이지만, 제의적 수용을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 “너희가 흩어져 있던 땅들”을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ
  english_pob_choice: like a pleasing aroma
  chosen_korean: 향기로운 제물처럼
  alternatives_korean:
  - 기분 좋은 향기처럼
  - 향기로운 향처럼
  - 받기 좋은 향기처럼
  lexicon: רֵיחַ / נִיחֹחַ
  rationale: 문맥상 제사적 수용을 나타내므로 단순한 냄새보다 ‘제물처럼’으로 제의적 의미를 살리고, נִיחֹחַ의 수용 가능성은 ‘향기로운’으로 간결하게 반영했습니다.
- source_word: אֶרְצֶה אֶתְכֶם
  english_pob_choice: I will accept you
  chosen_korean: 나는 너희를 … 기쁘게 받아들일 것입니다
  alternatives_korean:
  - 나는 너희를 받아들일 것입니다
  - 나는 너희를 기쁘게 받겠습니다
  lexicon: רצה
  rationale: 히브리어 רצה는 단순 수용보다 ‘기쁘게 받아들임/받아들여 주심’의 뉘앙스가 있어, 공적 문체에서 자연스러운 ‘기쁘게 받아들일 것입니다’로 옮겼습니다.
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  english_pob_choice: I will show myself holy through you
  chosen_korean: 내가 너희를 통하여 나 자신을 거룩하게 드러낼 것입니다
  alternatives_korean:
  - 내가 너희를 통해 거룩함을 나타낼 것입니다
  - 내가 너희 가운데서 거룩함을 보이겠습니다
  lexicon: קדש
  rationale: POB의 개정판이 ‘through you’를 채택한 점을 따라, בני/בכם의 매개성을 살려 ‘너희를 통하여’로 옮기고, קדש의 수동형/중간적 의미를 ‘나 자신을 거룩하게 드러낼 것입니다’로 표현했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 열국
  alternatives_korean:
  - 민족들
  - 나라들
  lexicon: גוים
  rationale: 예언서의 국제적 대조를 살리기 위해 ‘열국’을 사용했습니다. 이는 단순한 민족 집합보다 열방 앞에서의 공적 표지를 더 분명히 드러냅니다.
theological_decisions:
- issue: ‘I will show myself holy through you’의 매개성
  chosen_reading: 하나님께서 포로 귀환 사건을 통해 자기 거룩함을 공적으로 드러내십니다.
  alternative_readings:
  - 하나님께서 너희 가운데서 거룩함을 보이십니다
  - 하나님께서 너희를 거룩하게 하십니다
  rationale: 문맥은 이스라엘의 회복이 하나님 이름의 공적 성결을 나타내는 표지라는 점에 있으므로, ‘통하여’와 ‘드러낼 것입니다’를 함께 써서 대리적·공적 의미를 보존했습니다.
  doctrine_reference: Ezekiel 20:41; divine self-sanctification / public vindication of God’s holiness
