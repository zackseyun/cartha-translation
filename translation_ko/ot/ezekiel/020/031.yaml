review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘묻히다’는 한국어에서 주로 매장되거나 어떤 것에 덮이는 뜻이므로, 하나님께 신탁을 구한다는 נִדְרָשׁ의 뜻을 전달하지 못합니다. 또한 원문의 진행적/현재적 진술, 단순 시간 접속, 그리고 אֲדֹנָי יְהוִה의 신명 요소를 더 충실히 반영하는 것이 안전합니다.
  naturalness: 초안의 ‘내가 너희에게 묻히겠습니까’와 ‘나는 결코 너희에게 묻히지 않겠습니다’는 현대 표준어에서 의미가 크게 달라집니다. ‘너희에게서 물음을 받다’는 다소 격식 있으나 합쇼체 예언문에 자연스럽고 의미가 명확합니다. ‘할 때마다’는 반복을 강화하므로 ‘할 때’로 고쳤습니다.
  terminology: בְּנֵיכֶם은 ‘아들들’로 유지했습니다. גִּלּוּלִים의 경멸적 우상 표현도 유지했습니다. אֲדֹנָי יְהוִה는 제공된 번역 원칙에 따라 ‘주 야훼’로 옮겼으며, 마지막 אִם 절은 맹세 관용에 따른 강한 부정으로 번역하고 주석으로 밝혔습니다.
  issues:
  - severity: high
    issue: ‘묻히겠습니까/묻히지 않겠습니다’
    rationale: דרשׁ의 니팔형은 여기서 하나님께 묻고 신탁을 구하는 것을 뜻합니다. ‘묻히다’는 ‘매장되다’라는 전혀 다른 한국어 의미를 유발하므로 본문의 핵심 진술을 훼손합니다.
  - severity: medium
    issue: ‘할 때마다’
    rationale: בְּ + 부정사구는 이 문맥에서 ‘~할 때’이며, ‘때마다’는 원문에 없는 반복성을 더합니다.
  - severity: medium
    issue: ‘주 하나님’
    rationale: 원문은 אֲדֹנָי יְהוִה이며, 제공된 신명 방침은 יהוה를 ‘야훼’로 표기하도록 명시합니다. 따라서 ‘주 야훼’가 원문 표지와 내부 방침 모두에 더 부합합니다.
  - severity: low
    issue: 정결 훼손의 시제 표현
    rationale: נִטְמְאִים은 현재적 상태/진행을 나타내므로 ‘더럽히고 있습니다’가 ‘더럽혔습니다’보다 원문 형태에 가깝습니다.
