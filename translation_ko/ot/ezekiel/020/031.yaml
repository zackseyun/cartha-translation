reference: Ezekiel 20:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/שְׂאֵ֣ת מַתְּנֹֽתֵי/כֶ֡ם בְּֽ/הַעֲבִיר֩ בְּנֵי/כֶ֨ם בָּ/אֵ֜שׁ אַתֶּם֩ נִטְמְאִ֤֨ים לְ/כָל גִּלּֽוּלֵי/כֶם֙ עַד הַ/יּ֔וֹם וַ/אֲנִ֛י אִדָּרֵ֥שׁ לָ/כֶ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם אִדָּרֵ֖שׁ לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
  footnotes:
  - marker: a
    text: Hebrew 'make your sons pass through the fire,' an idiom for child-sacrifice in idolatrous worship.
    reason: cultural_note
  - marker: b
    text: Or 'offerings' for 'gifts.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew literally uses an oath formula with ''if''; in context it means a strong denial: ''I will certainly not be inquired of by you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 너희의 제물을 바치고 너희 아들들을 불 가운데로 지나가게 할 때, 너희는 오늘까지 너희의 모든 우상으로 스스로를 더럽히고 있습니다. 그런데 내가 너희에게서 물음을 받겠습니까, 이스라엘 집아? 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말씀이십니다. 나는 결코 너희에게서 물음을 받지 않겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘너희 아들들을 불 가운데로 지나가게 하다’는 우상숭배와 관련된 아동 희생을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: ‘주 야훼’는 히브리어 אֲדֹנָי יְהוִה를 옮긴 것입니다.
    reason: source_note
  - marker: c
    text: 히브리어는 직역하면 ‘만일 내가 너희에게서 물음을 받는다면’이라는 맹세 형식을 사용합니다. 문맥에서는 ‘나는 결코 너희에게서 물음을 받지 않겠다’라는 강한 부정을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  english_pob_choice: when you present your gifts
  chosen_korean: 너희의 제물을 바치고
  alternatives_korean:
  - 너희의 선물을 드리고
  - 너희의 예물을 올리고
  lexicon: HALOT
  rationale: נשא와 ‘gifts’의 결합은 제의적 ‘바치다/드리다’의 뜻으로 풀어야 하며, ‘제물’이 문맥상 우상숭배 제의의 성격을 가장 분명히 드러냅니다.
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  english_pob_choice: when you make your sons pass through the fire
  chosen_korean: 너희 아들들을 불 가운데로 지나가게 할 때마다
  alternatives_korean:
  - 너희 자녀들을 불로 통과시키게 할 때마다
  - 너희 아들들을 불에 태울 때마다
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 설명적으로 바꾸지 않으면서도, 문맥상 아동희생을 가리키는 행위를 한국어로 자연스럽게 보존했습니다.
- source_word: אַתֶּם נִטְמְאִים לְכָל גִּלּוּלֵיכֶם
  english_pob_choice: you defile yourselves with all your idols
  chosen_korean: 너희는 … 너희의 모든 우상들로 스스로를 더럽혔습니다
  alternatives_korean:
  - 너희는 … 너희의 모든 우상들로 자신을 부정하게 했습니다
  - 너희는 … 모든 우상 때문에 더러워졌습니다
  lexicon: HALOT
  rationale: 니팔의 수동/반사적 뉘앙스를 살리기 위해 ‘스스로를 더럽혔습니다’로 옮겼고, 에스겔의 경멸적 ‘우상들’을 그대로 반영했습니다.
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  english_pob_choice: And shall I be inquired of by you
  chosen_korean: 그런데 내가 너희에게 묻히겠습니까
  alternatives_korean:
  - 그런데 내가 너희의 문의를 받겠습니까
  - 그런데 내가 너희에게 찾아져야 하겠습니까
  lexicon: HALOT
  rationale: דרש의 피동적 의미를 한국어의 ‘묻다/묻히다’ 계열로 옮겨, 하나님께 자문을 구하는 행위의 뉘앙스를 보존했습니다.
- source_word: חַי אָנִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있노라
  alternatives_korean:
  - 내가 살아 있음에
  - 내 삶을 두고
  lexicon: HALOT
  rationale: 전형적인 맹세 공식이므로, 문맥의 엄숙함을 살리는 직접적인 한국어 맹세 표현으로 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님의 말씀이니라
  alternatives_korean:
  - 주 여호와의 말씀이니라
  - 주 야훼의 말씀이니라
  lexicon: HALOT
  rationale: יהוה를 본문 원칙상 야훼로 두는 대신, 이 절은 오랜 예언서 종결 공식의 한국어 문체를 고려해 ‘주 하나님’으로 처리해 독자가 즉시 인식할 수 있게 했습니다.
theological_decisions:
- issue: 아들들(בְּנֵיכֶם)의 성별 표지 유지
  chosen_reading: 너희 아들들
  alternative_readings:
  - 너희 자녀들
  rationale: 히브리어가 분명히 남성 복수형을 사용하므로, 일반화하지 않고 ‘아들들’로 옮겨 희생 제의의 충격성과 원문의 구체성을 유지했습니다.
  doctrine_reference: 'Translation philosophy #4: gender-accurate over gender-neutral'
- issue: 마지막 맹세문 אִם אִדָּרֵשׁ לָכֶם의 부정 의도
  chosen_reading: 나는 결코 너희에게 묻히지 않겠습니다
  alternative_readings:
  - 내가 너희에게 묻히지 않을 것이다
  - 만일 내가 너희에게 묻히면
  rationale: 히브리어의 ‘if’ 관용이 실제로는 강한 부정이므로, 독자가 오해하지 않도록 명시적 부정으로 풀어 주었습니다.
  doctrine_reference: optimal-equivalence
