source:
  edition: WLC
  text: גַּם אֲנִ֗י נָשָׂ֧אתִי אֶת יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/הָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וּ/לְ/זָר֥וֹת אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
  footnotes:
  - marker: a
    text: Or, 'I swore to them in the wilderness.' The Hebrew literally says, 'I raised my hand to them,' an idiom for taking an oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 나는 광야에서 그들에게 내 손을 들어[a] 그들을 여러 민족들 가운데 흩어 버리고 여러 땅들에 퍼뜨리겠다고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 맹세하였다.’ 히브리어는 문자적으로 ‘내 손을 그들에게 들어 올렸다’라고 하며, 맹세를 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Moreover
  chosen_korean: 또한
  alternatives_korean:
  - 더욱이
  - 게다가
  lexicon: HALOT
  rationale: 앞선 진술에 덧붙는 엄숙한 추가를 자연스럽게 살리기 위해 '또한'을 택했습니다.
- source_word: נָשָׂאתִי אֶת יָדִי
  english_pob_choice: I also raised my hand
  chosen_korean: 내 손을 들어
  alternatives_korean:
  - 내 손을 높이 들어
  - 그들에게 맹세하였다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 이미지를 살리되, 한국어에서는 '손을 들다'가 맹세 동작을 가장 자연스럽게 드러냅니다.
- source_word: לְהָפִיץ / וּלְזָרוֹת
  english_pob_choice: to scatter ... and disperse
  chosen_korean: 흩어 버리고 ... 퍼뜨리겠다고
  alternatives_korean:
  - 흩어 놓고 ... 흩어 버리고
  - 분산시키고 ... 퍼뜨리겠다고
  lexicon: HALOT
  rationale: 두 동사가 의미상 겹치지만 완전히 같지는 않으므로, 첫째는 '흩어 버리다', 둘째는 '퍼뜨리다'로 구분해 병렬을 보존했습니다.
- source_word: בַּגּוֹיִם / בָּאֲרָצוֹת
  english_pob_choice: among the nations / through the lands
  chosen_korean: 여러 민족들 가운데 / 여러 땅들에
  alternatives_korean:
  - 민족들 가운데 / 땅들에
  - 나라들 가운데 / 여러 지역들에
  lexicon: HALOT
  rationale: 포로·심판 맥락에서 '민족들'과 '땅들'을 직역에 가깝게 유지해 분산의 범위를 분명하게 했습니다.
theological_decisions:
- issue: 히브리어 맹세 관용구를 본문에 드러낼지, 의미를 풀어 '맹세하다'로 바꿀지
  chosen_reading: 본문에서는 관용구를 따라 '내 손을 들어'로 두고, 주석으로 맹세 의미를 보완합니다.
  alternative_readings:
  - 그들에게 맹세하였다
  rationale: 원문의 구체적 이미지와 언약적 엄숙성을 보존하는 것이 본문의 힘을 살리며, 독해 보조는 각주로 충분합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
