revisions:
- from: 그러나 나는 내 손을 거두고, 내 이름을 위하여 행하였으니, 그것이 이방 민족의 눈앞에서 더럽혀지지 않게 하려는 것이었습니다. 내가 그들의 눈앞에서 그들을 이끌어 냈기 때문입니다.[a][b]
  to: 그러나 나는 내 손을 거두고, 내가 그들이 보는 앞에서 이끌어 낸 이스라엘 백성으로 말미암아 내 이름이 이방 민족의 눈앞에서 더럽혀지지 않도록 내 이름을 위하여 행하였습니다.[a][b]
  rationale: 원문의 문장 구조를 따라 ‘내 이름을 위하여 행하셨다’와 ‘이방 민족의 눈앞에서 그 이름이 더럽혀지지 않게 하셨다’를 목적 관계로 연결했습니다. 마지막 관계절은 이방 민족이 이스라엘 백성이 이끌려 나오는 일을 목격했음을 나타내므로, 원문의 지시 대상을 한국어에서 명료하게 밝혔습니다. ‘손을 거두다’는 심판의 실행을 억제한다는 히브리어 관용구와 현대 한국어의 표현을 함께 살립니다.
