id: EZK.20.22
reference: Ezekiel 20:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲשִׁבֹ֨תִי֙ אֶת יָדִ֔/י וָ/אַ֖עַשׂ לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
  footnotes:
  - marker: a
    text: Or 'I turned back my hand' / 'I withdrew my hand.' The Hebrew idiom expresses restraint from carrying out judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'so as not to profane [it],' with 'it' referring to God's name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 손을 거두고, 내가 그들이 보는 앞에서 이끌어 낸 이스라엘 백성으로 말미암아 내 이름이 이방 민족의 눈앞에서 더럽혀지지 않도록 내 이름을 위하여 행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 심판을 실행하려던 손을 거두어 심판을 억제하셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘더럽히지 않도록’이며, 생략된 대상은 앞의 ‘내 이름’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  english_pob_choice: I held back my hand
  chosen_korean: 나는 내 손을 거두고
  alternatives_korean:
  - 나는 내 손을 멈추고
  - 나는 내 손을 물리고
  lexicon: HALOT
  rationale: 히브리어 관용구는 심판 행위를 실행하지 않고 멈추는 뜻이므로, 손의 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘손을 거두다’로 옮겼습니다.
- source_word: לְמַעַן שְׁמִי
  english_pob_choice: for the sake of my name
  chosen_korean: 내 이름을 위하여
  alternatives_korean:
  - 내 이름 때문에
  - 내 이름의 명예를 위하여
  lexicon: HALOT
  rationale: ‘이름’은 하나님의 공적 명예와 관련된 언약적 표현이므로, 본문 표지를 유지하면서도 한국어로는 간결한 ‘내 이름을 위하여’가 적절합니다.
- source_word: לְבִלְתִּי הֵחֵל
  english_pob_choice: so that it would not be profaned
  chosen_korean: 더럽혀지지 않게 하려는 것이었습니다
  alternatives_korean:
  - 모독되지 않게 하려는 것이었습니다
  - 거룩함이 훼손되지 않게 하려는 것이었습니다
  lexicon: HALOT
  rationale: חלל의 핵심 의미는 거룩한 것을 속되게 만들거나 더럽히는 것이므로, 문맥상 ‘이름’의 더럽혀짐을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: לְעֵינֵי הַגּוֹיִם / לְעֵינֵיהֶם
  english_pob_choice: in the sight of the nations / before whose eyes
  chosen_korean: 이방 민족의 눈앞에서
  alternatives_korean:
  - 민족들의 눈앞에서
  - 그들이 보는 앞에서
  lexicon: HALOT
  rationale: 두 번 반복되는 ‘눈/눈앞’의 시각적 대비를 살리기 위해, 공적 목격의 뉘앙스를 지닌 ‘눈앞에서’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘손을 거두심’의 의미
  chosen_reading: 하나님이 실제로 손을 움직이셨다는 뜻이 아니라, 위협하신 심판을 실행하지 않으시고 멈추셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님이 손을 물리셨다는 직역적 표현
  - 심판을 철회하셨다는 해설적 표현
  rationale: 본문의 관용구는 행위의 중단과 절제를 가리키며, POB의 ‘held back’도 그 의미를 따릅니다. 한국어에서는 손의 이미지를 유지하되 제재의 중단이 분명하게 드러나야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘내 이름’의 보존과 하나님의 명예
  chosen_reading: ‘내 이름’은 하나님의 공적 명예와 언약적 신뢰성을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 내 명예
  - 내 평판
  rationale: 원문이 직접 ‘이름’이라 말하므로, 그 신학적 중량을 보존하는 것이 중요합니다. 뒤의 ‘더럽혀지지 않게’가 그 의미를 충분히 설명합니다.
  doctrine_reference: Translation philosophy §§1, 6
