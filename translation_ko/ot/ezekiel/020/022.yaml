    rationale: 히브리어는 민족이 목격하는 장면을 두 차례 ‘눈앞에서’로 표시합니다. 관계절 안에도 ‘그들이 보는 앞에서’를 보존하는 것이 반복과 공적 목격의 뉘앙스를 살립니다.
