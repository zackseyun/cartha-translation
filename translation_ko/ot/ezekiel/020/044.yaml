id: EZK.20.44
reference: Ezekiel 20:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'when I act toward you.' The Hebrew is broad and does not specify the manner of God's action here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for the sake of my name,' that is, for the honor of his reputation.
    reason: cultural_note
translation:
  language: ko
  text: 그러면 너희는 내가 야훼인 줄 알게 될 것입니다. 내가 내 이름을 위하여[a] 너희를 대할 때, 너희의 악한 길대로도 너희의 부패한 행위대로도 하지 않을 것입니다. 이스라엘 집이여, 주 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 이름을 위하여’는 곧 그 이름의 명예와 평판을 위한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그러면 내가 야훼인 줄 알게 될 것입니다
  alternatives_korean:
  - 그때 너희는 내가 야훼인 줄 알게 될 것입니다
  - 그러면 너희는 내가 야훼인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 인식 공식의 결과·귀결을 살려 ‘그러면’으로 옮겼고, 직접적 인식 대상은 “내가 야훼인 줄”로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름(יהוה)은 전통적 대체어가 아니라 고유명으로 드러나야 하므로 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  english_pob_choice: when I deal with you
  chosen_korean: 내가 너희를 대할 때
  alternatives_korean:
  - 내가 너희에게 행할 때
  - 내가 너희와 함께 행할 때
  lexicon: HALOT
  rationale: עשה + את의 포괄적 용법을 따라, 심판이나 회복으로 한정하지 않는 ‘대하다’를 선택했습니다.
- source_word: לְמַעַן שְׁמִי
  english_pob_choice: for the sake of my name
  chosen_korean: 내 이름을 위하여
  alternatives_korean:
  - 내 이름의 명예를 위하여
  - 내 이름 때문에
  lexicon: HALOT
  rationale: ‘이름’의 명예/평판이라는 뜻을 드러내되, 한국어에서는 간결하고 직설적인 ‘위하여’가 가장 자연스럽습니다.
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  english_pob_choice: or according to your corrupt deeds
  chosen_korean: 너희의 부패한 행위대로도
  alternatives_korean:
  - 너희의 타락한 행실대로도
  - 너희의 부패한 행적대로도
  lexicon: HALOT
  rationale: עֲלִילוֹת은 ‘행위/행적’에 가깝고, הַנִּשְׁחָתוֹת은 도덕적 부패를 가리키므로 ‘부패한 행위’로 압축해 반영했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: O house of Israel
  chosen_korean: 이스라엘 집아
  alternatives_korean:
  - 이스라엘 집이여
  - 이스라엘 집
  lexicon: HALOT
  rationale: 히브리어 호격을 살리기 위해 한국어 호격 ‘-아’를 사용했습니다. 현대문체 안에서 직접 호칭의 힘을 유지합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님께서
  lexicon: HALOT
  rationale: נְאֻם 공식 뒤의 종결 화자 표지로서 한국어 예언문체에 자연스러운 ‘주 하나님’이 적합하며, 표준적인 서술형 종결과 맞췄습니다.
theological_decisions:
- issue: 하나님이 ‘너희를 대하실’ 방식의 범위
  chosen_reading: 심판과 회복을 미리 한정하지 않는 포괄적 표현으로 유지했습니다.
  alternative_readings:
  - 내가 너희를 벌할 때
  - 내가 너희에게 은혜를 베풀 때
  rationale: 히브리어 עשה는 여기서 구체적 방식이 열려 있으므로, 문맥상의 긴장—심판이든 회복이든 하나님의 이름을 위한 행동—을 해치지 않도록 중립적으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
