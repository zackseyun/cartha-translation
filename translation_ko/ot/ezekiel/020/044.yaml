  source_fidelity: 수정이 필요합니다. 히브리어 וִידַעְתֶּם은 2인칭 복수이므로 첫 문장에 주어 ‘너희는’이 반드시 드러나야 합니다. 또한 원문의 ‘내 이름을 위하여’에 관한 주석은 해당 구절에 직접 연결되어야 합니다. ‘너희를 대할 때’는 עשה + את의 행위 방식을 특정하지 않는 폭넓은 뜻을 무리 없이 보존합니다.
  naturalness: ‘이스라엘 집아’는 호격을 보존하지만 현대 표준어 성경 문체에서는 ‘이스라엘 집이여’가 더 자연스럽고 안정적입니다. 나머지 문장은 합쇼체 예언 문체에 대체로 적합합니다.
  terminology: ‘야훼’는 יהוה의 고유명 번역 원칙과 일치합니다. אֲדֹנָי יְהוִה의 ‘주 하나님’ 및 נְאֻם의 ‘말씀하십니다’도 적절합니다. ‘악한 길’과 ‘부패한 행위’는 원문의 도덕적 행실과 타락한 행위를 충실히 반영합니다.
