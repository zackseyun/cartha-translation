theological_decisions:
- issue: 마음이 우상을 ‘따라갔다’는 내적 충성의 표현
  chosen_reading: 그들의 마음이 그들의 우상들을 따라갔기 때문입니다.
  alternative_readings:
  - 그들이 우상들을 따랐기 때문입니다
