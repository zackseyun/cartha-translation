translation:
  language: ko
  text: 그들이 내 판단을 거부하고 내 규례들 안에서 걷지 않았으며 내 안식일들을 더럽혔기 때문입니다. 이는 그들의 마음이 그들의 우상들을 따라갔기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 판단
  alternatives_korean:
  - 내 심판들
  - 내 규정들
  lexicon: HALOT
  rationale: מִשְׁפָּט는 법적 판결과 판단의 뜻을 가지므로, 한국어에서는 의미를 직접 살린 ‘판단’이 가장 자연스럽습니다.
- source_word: חֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법도들
  - 내 율례들
  lexicon: HALOT
  rationale: 두 번째 법률 용어의 구별을 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 ‘규례들’을 택했습니다.
- source_word: שַׁבְּתוֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 내 안식일 규례들
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 복수 ‘안식일들’로 옮겼습니다.
- source_word: גִלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 우상
  - 그들의 더러운 우상들
  lexicon: HALOT
  rationale: 본문의 주된 의미는 우상숭배이며, POB 각주가 지적한 경멸적 뉘앙스는 본문을 과도하게 늘리지 않고 번역 주석 없이 유지했습니다.
theological_decisions:
- issue: 마음이 우상을 ‘따라갔다’는 내적 충성의 표현
  chosen_reading: 그들의 마음이 그들의 우상들을 따라갔기 때문입니다.
  alternative_readings:
  - 그들이 우상들을 따랐기 때문입니다
  - 그들의 마음이 우상들에 기울었기 때문입니다
  rationale: 히브리어는 행동보다 마음의 방향을 강조하므로, 내적 중심이 우상을 향했다는 점을 그대로 드러내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
