  text: 그들이 내 법규를 버리고 내 규례를 따르지 않았으며 내 안식일들을 모독하였고, 그들의 마음이 그들의 우상들[a]을 따라갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
