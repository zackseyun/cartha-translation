  source_fidelity: 히브리어의 복수형 ‘나의 안식일들’, 거룩히 지키라는 명령, 나와 너희 사이의 표징, 그리고 야훼가 너희의 하나님이심을 알게 하는 목적을 대체로 충실히 반영했습니다. 다만 현행 마지막 절의 ‘알게 하려는 것입니다’는 직접 명령의 흐름을 설명문 종결로 바꾸므로, 목적절에 맞는 합쇼체 명령으로 고치는 것이 필요합니다.
  naturalness: ‘그것들이 … 표징이 되게 하여’는 자연스럽습니다. 뒤를 ‘알게 하려는 것입니다’로 끝내면 문체와 화행이 어색하므로 ‘알게 하십시오’로 고쳤습니다. 또한 ‘야훼, 너희의 하나님’으로 동격 관계를 분명히 했습니다.
  terminology: ‘안식일들’, ‘거룩하게 지키십시오’, ‘표징’, ‘야훼’는 원문의 의미와 프로젝트 용어 방침에 부합합니다. 야훼 관련 각주는 ‘안식일들’이 아니라 ‘야훼’에 붙어야 합니다.
  issues:
