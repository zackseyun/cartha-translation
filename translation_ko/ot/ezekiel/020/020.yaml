translation:
  language: ko
  text: 내 안식일들을 거룩하게 지키십시오[a]. 그것들이 나와 너희 사이의 표징이 되게 하여, 너희가 내가 너희의 하나님 야훼임을 알게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH)는 본문에서는 야훼로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 나의 안식일들
  lexicon: HALOT
  rationale: 복수형과 1인칭 소유격을 살리기 위해 단수화하지 않고 ‘안식일들’로 옮겼습니다. 공동체적·반복적 제도를 드러내기 위해 ‘내’도 유지했습니다.
- source_word: קַדֵּשׁוּ
  english_pob_choice: Keep ... holy
  chosen_korean: 거룩하게 지키십시오
  alternatives_korean:
  - 성별하십시오
  - 거룩하게 하십시오
  - 거룩한 것으로 지키십시오
  lexicon: HALOT
  rationale: קדשׁ의 의미를 ‘거룩하게 대하다’로 반영하되, 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: לְאוֹת
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징표
  - 기호
  lexicon: HALOT
  rationale: 언약 문맥에서 단순한 표시보다 신학적·언약적 의미가 있는 ‘표징’이 원문의 כוח을 더 잘 보존합니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희 하나님 야훼
  - 야훼 너희의 하나님
  - 너희의 주 하나님
  lexicon: HALOT
  rationale: 사역적 호칭인 ‘하나님’과 고유명사 ‘야훼’를 함께 살려, 원문이 말하는 언약적 자기계시를 유지했습니다.
