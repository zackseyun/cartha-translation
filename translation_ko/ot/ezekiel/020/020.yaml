  - 여호와
  - the LORD에 해당하는 우회표현
  rationale: 원문이 신명기적 언약 이름을 직접 사용하므로, 제목형 대체어보다 고유명을 드러내는 것이 본문 의미를 더 투명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
