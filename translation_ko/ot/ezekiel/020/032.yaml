  source_fidelity: 원문의 강조 부정(הָיוֹ לֹא תִהְיֶה)은 ‘결코 이루어지지 않을 것입니다’로 적절히 옮길 수 있습니다. 그러나 초안의 ‘하기 때문입니다’는 원문에 없는 인과를 더하며, 인용문의 לְשָׁרֵת는 앞의 미래 의도와 연결되어 ‘섬기겠습니다’처럼 옮기는 편이 충실합니다. ‘섬기자’는 청유의 뉘앙스를 더합니다.
  naturalness: ‘너희 마음에 떠오르는 것, 곧 너희가 말하기를 … 하는 것은’은 현대 한국어의 격식체에서도 자연스럽고 원문의 동격 구조를 명료하게 드러냅니다. 인용문 안의 미래 서술도 문맥에 맞습니다.
