id: EZK.20.32
reference: Ezekiel 20:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
  footnotes:
  - marker: a
    text: Or 'What comes up in your spirit.' The Hebrew says literally, 'the thing coming up upon your spirit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will never come to pass'; the Hebrew uses an infinitive absolute with the verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: That is, serving idols made of wood and stone.
    reason: cultural_note
  - marker: d
    text: Or 'worshiping wood and stone.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희 마음에 떠오른 것은 결코 이루어지지 않을 것입니다. 곧 너희가 말하기를, ‘우리는 뭇 나라들처럼, 여러 나라의 족속들처럼 되어서, 나무와 돌을 섬기자’ 하기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음에’는 히브리어의 문자적 표현인 ‘너희 영 위에 올라오는 것’을 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 부정 강조를 위해 동사형을 겹쳐 사용합니다.
    reason: source_note
  - marker: c
    text: 곧 나무와 돌로 만든 우상들을 섬긴다는 뜻입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘나무와 돌을 예배하며’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  english_pob_choice: What is coming up in your mind
  chosen_korean: 너희 마음에 떠오른 것
  alternatives_korean:
  - 너희 영에 올라오는 것
  - 너희 생각에 떠오르는 것
  lexicon: HALOT
  rationale: עַל + רוּחַ의 관용적 표현을 한국어로 자연스럽게 살리면서도, POB의 ‘mind’ 선택처럼 내면의 의도나 생각을 가리키는 뜻이 드러나게 했습니다.
- source_word: הָיוֹ לֹא תִהְיֶה
  english_pob_choice: will certainly not happen
  chosen_korean: 결코 이루어지지 않을 것입니다
  alternatives_korean:
  - 반드시 일어나지 않을 것입니다
  - 절대로 있지 않을 것입니다
  lexicon: HALOT
  rationale: 분사와 미완료형의 강조된 부정을 한국어의 ‘결코’로 살려, 단순 미래 부정보다 강한 거절의 뜻을 담았습니다.
- source_word: כַגּוֹיִם כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  english_pob_choice: like the nations, like the clans of the lands
  chosen_korean: 뭇 나라들처럼, 여러 나라의 족속들처럼
  alternatives_korean:
  - 나라들처럼, 땅들의 가족들처럼
  - 민족들처럼, 그 땅들의 가문들처럼
  lexicon: HALOT
  rationale: גּוֹיִם은 ‘열방’보다 직역성이 있는 ‘뭇 나라들’로, מִשְׁפָּחוֹת는 단순한 가족보다 사회집단을 가리키는 ‘족속들’로 옮겼습니다. ‘lands’의 복수성은 ‘여러 나라’로 반영했습니다.
- source_word: לְשָׁרֵת עֵץ וָאָבֶן
  english_pob_choice: serving wood and stone
  chosen_korean: 나무와 돌을 섬기자
  alternatives_korean:
  - 나무와 돌을 섬기며
  - 나무와 돌을 예배하며
  lexicon: HALOT
  rationale: 동사 שׁרת의 기본값인 ‘섬기다’를 유지해 원문 어휘를 따르되, 문맥상 우상숭배를 가리키는 뜻이 분명하므로 목적 절의 인용문 안에서 자연스럽게 옮겼습니다. ‘wood and stone’은 우상의 물질성을 드러내는 직역을 따랐습니다.
theological_decisions:
- issue: רוּחַ의 번역 범위
  chosen_reading: ‘마음’
  alternative_readings:
  - ‘영’
  - ‘생각’
  rationale: 여기서 רוּחַ는 인간의 내면적 의도나 생각을 가리키는 관용구로 보이며, ‘영’은 불필요한 인류학적 구분을 불러올 수 있어 ‘마음’이 가장 자연스럽고 오해가 적습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘섬기다’와 우상숭배의 의미
  chosen_reading: 본문에는 ‘섬기다’를 두되, 문맥상 우상숭배로 이해되도록 함
  alternative_readings:
  - ‘예배하다’로 명시
  - ‘경배하다’로 명시
  rationale: 히브리어는 ‘섬기다’이므로 본문 어휘를 보존하는 것이 우선입니다. 다만 나무와 돌은 우상을 가리키므로 독자는 이 섬김이 종교적 숭배임을 문맥에서 이해하게 됩니다.
  doctrine_reference: Translation philosophy §1, §5
