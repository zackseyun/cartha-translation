  - 내가 살아 있음을 두고
  rationale: 하나님의 생명을 걸고 하는 맹세 표현을 한국어의 자연스러운 서약형으로 옮겨, 단순한 시간표현이 아니라 강한 부정 선언임을 드러냈습니다.
  doctrine_reference: Ezekiel prophetic oath formula
