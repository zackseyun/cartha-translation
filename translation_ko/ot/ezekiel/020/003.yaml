source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
  footnotes:
  - marker: a
    text: Or 'Is it to consult me that you have come?' The verb can denote seeking an oracle or inquiry from God.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew literally, ''As I live, if I am inquired of by you''—an oath formula expressing strong negation: ''I will not be inquired of by you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 이스라엘의 장로들에게 말하고 그들에게 이르라. 주 야훼께서 이렇게 말씀하십니다. “너희가 내게 물으러[a] 왔느냐? 내가 살아 있음을 두고, 나는 너희에게 물음을 받지 않겠다[b].” 주 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여기서 하나님께 신탁을 구하거나 문의한다는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘내가 너희에게 물음을 받는다면’의 형식입니다. 그러나 맹세 공식 뒤의 이 표현은 강한 부정을 나타내므로, ‘나는 너희에게 물음을 받지 않겠다’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 정형적 호칭을 살리되, 한국어에서는 직접 호명형인 ‘인자야’가 문맥의 예언자적 호흡을 가장 자연스럽게 전달합니다.
- source_word: הֲלִדְרֹשׁ אֹתִי
  english_pob_choice: Is it to inquire of me
  chosen_korean: 내게 물으러 왔느냐
  alternatives_korean:
  - 내게 문의하러 왔느냐
  - 나를 찾으러 왔느냐
  lexicon: HALOT
  rationale: דרשׁ는 여기서 일반적 ‘찾음’이 아니라 하나님께 묻고 신탁을 구하는 뜻이므로, ‘물으러 왔느냐’로 예언적·법정적 뉘앙스를 유지했습니다.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  english_pob_choice: I will not be inquired of by you
  chosen_korean: 나는 너희에게 묻힘을 받지 않겠다
  alternatives_korean:
  - 나는 너희의 물음을 받지 않겠다
  - 나는 너희가 내게 묻도록 허락하지 않겠다
  lexicon: HALOT
  rationale: 히브리어의 강한 부정 맹세를 한국어의 직접 부정으로 옮기되, 수동적 의미를 살려 ‘묻힘을 받지 않겠다’로 표현했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 문서의 표준 용례에 따라 יהוה를 ‘야훼’로 옮기고, 아도나이와 결합된 호칭은 한국어에서 중복을 피하면서도 두 신적 칭호를 함께 드러내도록 ‘주 야훼’로 처리했습니다.
theological_decisions:
- issue: 맹세 공식 חַי אָנִי의 문체와 힘
  chosen_reading: 내가 살아 있는 한
  alternative_readings:
