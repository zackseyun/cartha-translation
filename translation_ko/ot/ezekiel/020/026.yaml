source:
  edition: WLC
  text: וָ/אֲטַמֵּ֤א אוֹתָ/ם֙ בְּ/מַתְּנוֹתָ֔/ם בְּ/הַעֲבִ֖יר כָּל פֶּ֣טֶר רָ֑חַם לְמַ֣עַן אֲשִׁמֵּ֔/ם לְמַ֨עַן֙ אֲשֶׁ֣ר יֵֽדְע֔וּ אֲשֶׁ֖ר אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
  footnotes:
  - marker: a
    text: Literally, 'every opener of the womb.' This Hebrew idiom refers to every firstborn.
    reason: lexical_alternative
  - marker: b
    text: Or 'I made them unclean' / 'I polluted them.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'made ... pass through' refers to the ritual passing over of the firstborn, likely alluding to child sacrifice.
    reason: cultural_note
  - marker: d
    text: Or 'so that I might make them desolate' or 'so that I might horrify them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 그들의 예물로 그들을 더럽혔습니다[b]. 내가 태를 여는 모든 것을[a] 지나가게 함으로써[c], 내가 그들을 황폐하게 하려고[d], 그들이 내가 야훼임을 알게 하려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘태를 여는 모든 것’입니다. 이는 관용적으로 모든 맏배, 곧 첫태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들을 부정하게 했습니다’ / ‘내가 그들을 오염시켰습니다’.
    reason: lexical_alternative
  - marker: c
    text: ‘지나가게 하다’는 표현은 맏배를 지나가게 하는 제의적 행위를 가리키며, 아동 희생을 암시할 가능성이 있습니다. 그러나 히브리어 본문은 여기서 ‘불’을 명시하지 않습니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘내가 그들을 참혹하게 하려고’ / ‘내가 그들을 두렵게 하려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא
  english_pob_choice: And I defiled
  chosen_korean: 내가 그들을 더럽혔습니다
  alternatives_korean:
  - 내가 그들을 부정하게 했습니다
  - 내가 그들을 오염시켰습니다
  lexicon: HALOT
  rationale: טמא의 사역형은 제의적·도덕적 오염을 일으킨다는 뜻이므로, 문맥의 강한 어조를 살리면서도 자연스러운 한국어인 ‘더럽혔습니다’로 옮겼습니다.
- source_word: בְּמַתְּנוֹתָם
  english_pob_choice: through their gifts
  chosen_korean: 그들의 예물로
  alternatives_korean:
  - 그들의 선물로
  - 그들의 제물로
  lexicon: HALOT
  rationale: בְּ의 수단성을 반영하고, 제의적 문맥을 고려해 ‘예물’로 옮겼습니다. ‘선물’은 일반적이지만 제의적 뉘앙스가 약합니다.
- source_word: בְּהַעֲבִיר כָּל פֶּטֶר רָחַם
  english_pob_choice: by making every firstborn pass through the fire
  chosen_korean: 모든 태를 여는 자를 불속으로 지나가게 하여
  alternatives_korean:
  - 모든 첫태를 불로 지나가게 하여
  - 모든 첫아들을 불 가운데로 지나가게 하여
  lexicon: HALOT
  rationale: 히브리어 관용구 פֶּטֶר רָחַם은 문자적으로 ‘태를 여는 자’이므로 이를 살리되, 본문 문맥상 제의적·희생적 행위를 분명히 하기 위해 ‘불속으로 지나가게 하여’로 옮겼습니다.
- source_word: לְמַעַן אֲשִׁמֵּם
  english_pob_choice: so that I might devastate them
  chosen_korean: 그들로 하여금 내가 야훼인 줄 알게 하려는 것입니다
  alternatives_korean:
  - 그들을 황폐하게 하려는 것입니다
  - 그들을 두렵게 하려는 것입니다
  lexicon: HALOT
  rationale: 문맥상 목적절의 핵심은 심판을 통한 인식이므로, 결과를 직접 옮기기보다 최종 목적을 앞에 드러내는 한국어로 자연스럽게 풀었습니다. 다만 영어 POB의 ‘devastate’는 아래 각주로 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다. 이는 제목형 대체어보다 원어 음역을 보존하는 선택입니다.
theological_decisions:
- issue: 하나님의 직접적 자기 진술과 심판적 원인성
  chosen_reading: ‘내가 그들을 더럽혔습니다’라는 직접 화법을 약화하지 않고 유지하되, 그 행위가 그들의 제의와 우상적 행위의 맥락 속에서 일어났음을 문장 구조로 드러냈습니다.
  alternative_readings:
  - ‘내가 그들을 더럽게 내버려 두었습니다’처럼 허용적 의미로 완화
  - 주어를 사람의 행위로 돌려 하나님의 직접성을 약화
  rationale: 히브리어는 직접적인 1인칭 사역형을 사용하므로, 해석적으로 완화하면 본문의 신학적 긴장이 사라집니다. 동시에 본문은 심판 문맥에서 읽혀야 하므로 하나님의 도덕적 악성 부여로 오해되지 않도록 표현을 신중히 유지했습니다.
  doctrine_reference: 본문의 직접 진술과 심판 문맥을 함께 보존
