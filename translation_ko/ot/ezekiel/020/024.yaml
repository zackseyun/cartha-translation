  source_fidelity: 전반적으로 히브리어의 인과절과 율법 용어의 병렬, 안식일의 복수, גִּלּוּלִים의 경멸적 어조를 잘 반영했습니다. 그러나 אֲבוֹתָם을 ‘조상들’로 넓힌 것은 원문의 ‘아버지들’ 및 제공된 영어 감사 이력의 성별·친족어 보존 결정을 약화합니다. 또한 ‘눈은 … 따랐다’보다 ‘눈은 … 향하고 있었다’가 הָיוּ עֵינֵיהֶם אַחֲרֵי의 시각적 관용구와 지속적 지향을 더 직접적으로 보존합니다.
  naturalness: ‘규례들/율례들’은 한국어 성경의 확립된 짝으로 자연스럽습니다. ‘그들의 아버지들의 우상들’은 다소 반복적이지만, 원문의 소유 관계와 ‘아버지들’을 보존하는 데 필요한 직역이며 문장 전체에서도 이해 가능합니다. ‘향하고 있었다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
