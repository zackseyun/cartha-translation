translation:
  language: ko
  text: 그들이 내 규례들을 행하지 않았고, 내 율례들을 버렸으며, 내 안식일들을 더럽혔고, 그들의 눈은 조상들의 우상들을 따랐기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 낮잡아 부르는 매우 경멸적인 말입니다. ‘역겨운 우상들’이나 ‘똥우상들’처럼 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט은 율법적·언약적 규범을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘규례들’로 옮겨 법적 질서를 살렸습니다.
- source_word: חֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 율례들
  alternatives_korean:
  - 내 법도들
  - 내 규정들
  lexicon: HALOT
  rationale: חֻקּוֹת는 מִשְׁפָּט과 구별되는 언약 규정 용어이므로, 한국어 성경 용례가 확립된 ‘율례들’을 사용했습니다.
- source_word: חִלֵּלוּ
  english_pob_choice: they profaned
  chosen_korean: 더럽혔고
  alternatives_korean:
  - 모독했고
  - 속되게 했고
  lexicon: HALOT
  rationale: 성소적·언약적 맥락에서 ‘profane’의 핵심은 거룩한 것을 속되게 만드는 것이므로, 합쇼체 본문에서는 의미를 직접 드러내는 ‘더럽혔고’가 가장 자연스럽습니다.
- source_word: גִּלּוּלֵי
  english_pob_choice: the idols
  chosen_korean: 우상들을
  alternatives_korean:
  - 역겨운 우상들을
  - 똥우상들을
  lexicon: HALOT
  rationale: 본문의 조롱적 뉘앙스는 있지만, 메인 본문에서는 기본 의미인 ‘우상들’을 유지하고 그 경멸성은 주석으로 처리하는 편이 원문에 더 충실합니다.
- source_word: אֲבוֹתָם
  english_pob_choice: of their fathers
  chosen_korean: 조상들의
  alternatives_korean:
  - 그들의 아버지들의
  - 선조들의
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 아버지들’이지만, 한국어에서는 가족 계보를 뜻하는 관용적 표현인 ‘조상들’이 자연스럽고 의미를 온전히 전달합니다.
- source_word: הָיוּ עֵינֵיהֶם אַחֲרֵי
  english_pob_choice: their eyes were after
  chosen_korean: 그들의 눈은 … 따랐기
  alternatives_korean:
  - 그들의 눈은 … 뒤를 좇았기
  - 그들의 눈은 … 향해 있었기
  lexicon: HALOT
  rationale: 이 관용구는 단순한 시선이 아니라 욕망과 지향을 나타내므로, 한국어에서는 ‘따르다’로 옮겨 내면의 추구를 살렸습니다.
theological_decisions:
- issue: גִּלּוּלִים의 경멸적 뉘앙스 처리
  chosen_reading: 본문에는 ‘우상들’을 두고, 경멸적 뉘앙스는 드러내지 않음
  alternative_readings:
  - ‘역겨운 우상들’
  - ‘똥우상들’
  rationale: 에스겔의 조롱적 표현은 분명하지만, 메인 텍스트에서 과도하게 의역하면 본문의 간결한 진술을 넘어서므로, 직역 가능한 기본어를 본문에 두고 감정적 뉘앙스는 주석으로 남기는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 6
