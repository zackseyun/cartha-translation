  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; some renderings bring out the scorn with expressions like 'disgusting idols' or 'dung-idols.'
