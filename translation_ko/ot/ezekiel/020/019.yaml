  text: אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/חֻקּוֹתַ֖/י לֵ֑כוּ וְ/אֶת מִשְׁפָּטַ֥/י שִׁמְר֖וּ וַ/עֲשׂ֥וּ אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
  footnotes:
  - marker: a
    text: Or 'my ordinances' for 'my judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼, 너희의 하나님입니다. 내 규례를 따라 걸으십시오. 내 법도[a]를 지키고 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법도’는 히브리어 미쉬파팀(מִשְׁפָּטִים)을 옮긴 말입니다. 문맥에 따라 ‘판결들’, ‘법규들’, 또는 ‘규례들’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: I am Yahweh your God
  chosen_korean: 나는 너희의 하나님 야훼입니다
  alternatives_korean:
  - 나는 너희의 주 하나님입니다
  - 나는 너희의 하나님 여호와입니다
  lexicon: HALOT
  rationale: היה의 계시 선언과 언약 호칭을 함께 살려, προσωπ적 이름인 יְהוָה는 야훼로, אֱלֹהֵיכֶם은 ‘너희의 하나님’으로 옮겼습니다.
- source_word: בְּחֻקּוֹתַי
  english_pob_choice: in my statutes
  chosen_korean: 내 규례들 안에서
  alternatives_korean:
  - 내 율례들 안에서
  - 내 규정들 안에서
  lexicon: HALOT
  rationale: חֻקּוֹת는 고정된 제정·규범을 가리키므로, 한국어에서는 교회 전통어보다 직접적인 ‘규례들’이 원문 의도를 더 잘 드러냅니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 규례들
  lexicon: HALOT
  rationale: מִשְׁפָּט는 단순한 ‘판단’보다 법적·언약적 판정을 포함하므로, 여기서는 ‘법규들’로 옮겨 statutes와의 구분을 유지했습니다.
- source_word: וַעֲשׂוּ אוֹתָם
  english_pob_choice: and do them
  chosen_korean: 그것들을 행하십시오
  alternatives_korean:
  - 그것들을 하십시오
  - 그것들을 실천하십시오
  lexicon: HALOT
  rationale: עָשָׂה의 실제 이행을 살리기 위해 ‘행하십시오’를 택했고, 직접 명령형으로 전체 문장의 연속된 권면을 자연스럽게 처리했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 계시된 언약 이름을 제목어로 대체하지 않고 직접 드러내기 위해, 프로젝트 기준에 따라 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 명령문의 한국어 높임말
  chosen_reading: 합쇼체의 직접 명령형(지시형)으로 통일
  alternative_readings:
  - 하오체
  - 반말
  rationale: 이스라엘을 향한 예언적 언약 명령이므로 현대 표준어의 공적·권면적 톤을 유지하면서도, 하나님께 대한 직접 발화가 아닌 청중 명령으로 처리했습니다.
  doctrine_reference: Korean target style guidance
