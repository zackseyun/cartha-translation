language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
  footnotes:
  - marker: a
    text: Or 'into the fetter/obligation of the covenant.' The Hebrew term rendered 'bond' is rare and conveys the idea of being bound or constrained in relation to the covenant.
    reason: lexical_alternative
  - marker: b
    text: '''Pass under the rod'' likely evokes the practice of counting or inspecting a flock as it passes beneath a shepherd''s rod.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 너희를 막대기 아래로 지나가게 하고, 너희를 언약의 결박 안으로 데려가겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘막대기 아래로 지나가게 하다’는 목자가 양 떼를 지나가게 하며 살피거나 계수하는 관습을 연상시킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘결박’은 희귀한 히브리어 מָסֹרֶת의 의미를 반영하며, ‘굴레’나 ‘속박’처럼 묶임과 제약의 뜻을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  english_pob_choice: I will make ... pass
  chosen_korean: 내가 너희를 ... 지나가게 하고
  alternatives_korean:
  - 내가 너희를 ... 통과하게 하고
  - 내가 너희를 ... 지나가게 만들고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 단순한 ‘지나가다’보다 ‘지나가게 하다’로 옮겼습니다.
- source_word: תַּחַת הַשָּׁבֶט
  english_pob_choice: under the rod
  chosen_korean: 막대기 아래로
  alternatives_korean:
  - 지팡이 아래로
  - 막대 아래로
  lexicon: HALOT
  rationale: שֵׁבֶט의 기본 의미를 살리되, 목자적 점검/계수의 이미지를 현대 한국어에서 자연스럽게 전달하기 위해 ‘막대기’로 옮겼습니다.
- source_word: בְּמָסֹרֶת
  english_pob_choice: into the bond
  chosen_korean: 언약의 결박 안으로
  alternatives_korean:
  - 언약의 굴레 안으로
  - 언약의 속박 안으로
  - 언약의 의무 안으로
  lexicon: HALOT
  rationale: 희귀어 מָסֹרֶת의 ‘묶임/구속’ 뉘앙스를 살리면서, POB의 ‘bond’가 지닌 결박성과 언약적 관계를 함께 드러내기 위해 ‘결박’으로 옮겼습니다.
- source_word: הַבְּרִית
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 동맹
  lexicon: HALOT
  rationale: בְּרִית의 성경적 표준 용례를 따라 ‘언약’으로 번역했습니다.
theological_decisions:
- issue: ‘막대기 아래로’와 ‘언약의 결박’이 주는 심판/회복의 긴장
  chosen_reading: 이 구절은 하나님의 주권적 점검과 언약 안으로 묶어 두시는 행위를 함께 암시하므로, 심판과 회복 중 어느 한쪽으로만 좁히지 않았습니다.
  alternative_readings:
  - 주로 심판적 선별
  - 주로 회복적 재편입
  rationale: 원문의 이미지가 양가적이어서, 번역도 그 긴장을 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 해석의 긴장을 보존
