id: EZK.20.9
reference: Ezekiel 20:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'for my name’s sake.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that it should not be defiled' or 'so as not to profane it.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to whom I revealed myself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 이름을 위하여[a] 행하였습니다. 이는 이스라엘 백성이 그 가운데 있었던 열방의 눈앞에서 내 이름이 더럽혀지지 않게[b] 하려는 것이었습니다. 내가 이집트 땅에서 이스라엘 백성을 인도하여 내어, 그 열방의 눈앞에서 그들에게 나를 알게 하였기[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름의 명예를 위하여’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘욕되게 되지 않게’ 또는 ‘내 이름을 더럽히지 않기 위하여’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들에게 나를 나타내 보였기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  english_pob_choice: But I acted
  chosen_korean: 그러나 나는 행하였으니
  alternatives_korean:
  - 그러나 나는 행동하였으니
  - 그러나 나는 하였으니
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다/행하다’를 뜻하며, 여기서는 앞문맥에 대한 하나님의 결정적 개입을 가리키므로 ‘행하다’로 자연스럽게 옮겼습니다. 앞의 전개와의 대비는 ‘그러나’로 살렸습니다.
- source_word: לְמַעַן שְׁמִי
  english_pob_choice: for the sake of my name
  chosen_korean: 내 이름을 위하여
  alternatives_korean:
  - 내 이름의 명예를 위하여
  - 내 이름 때문에
  lexicon: HALOT
  rationale: 히브리어 관용구로서 하나님의 이름의 공적 명예와 계시된 성품을 가리키므로, 간결하면서도 목적·동기의 뉘앙스를 살려 ‘내 이름을 위하여’로 옮겼습니다.
- source_word: לְבִלְתִּי הֵחֵל
  english_pob_choice: so that it should not be profaned
  chosen_korean: 그것이 더럽혀지지 않게 하려 함이었습니다
  alternatives_korean:
  - 그것이 속되게 되지 않게 하려 함이었습니다
  - 그것이 욕되게 되지 않게 하려 함이었습니다
  lexicon: HALOT
  rationale: חלל의 성소적·언약적 의미를 보존하기 위해 ‘더럽히다/더럽혀지다’를 택했습니다. ‘profane’의 종교적 강도를 한국어에서 가장 직접적으로 반영하는 표현입니다.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  english_pob_choice: among whom they were
  chosen_korean: 내가 그들 가운데 있었던
  alternatives_korean:
  - 그들 가운데서 살던
  - 그들 한가운데 있던
  lexicon: HALOT
  rationale: 열방이 이스라엘을 둘러싼 상황을 가리키므로 ‘그들 가운데’로 공간적 관계를 살렸습니다. 주어의 위치를 분명히 하기 위해 문맥상 ‘내가’를 앞에 두었습니다.
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  english_pob_choice: to whom I had made myself known
  chosen_korean: 내가 그들에게 나를 알게 하였음으로써
  alternatives_korean:
  - 내가 그들에게 자신을 드러냈음으로써
  - 내가 그들에게 알려졌음으로써
  lexicon: HALOT
  rationale: נודעתי는 단순히 ‘알려졌다’가 아니라 하나님의 자기계시를 뜻하므로, 수동에만 머물지 않고 ‘나를 알게 하다’로 옮겨 주체적 자기현시를 살렸습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: in their sight
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들의 시야에서
  - 그들이 보는 앞에서
  lexicon: HALOT
  rationale: 반복되는 시각적·공적 노출을 살리기 위해 ‘눈앞에서’로 옮겼습니다. 앞의 ‘열방의 눈앞에서’와 평행을 이루게 했습니다.
- source_word: לְהוֹצִיאָם
  english_pob_choice: by bringing them out
  chosen_korean: 이집트 땅에서 그들을 인도하여 내심으로써
  alternatives_korean:
  - 이집트 땅에서 그들을 끌어내심으로써
  - 이집트 땅에서 그들을 데리고 나오심으로써
  lexicon: HALOT
  rationale: 출애굽의 구원 행위를 드러내는 표준적 동사군을 고려해 ‘인도하여 내다’로 옮겼습니다. 수단·매개를 나타내는 הנפ형적 용법을 ‘-심으로써’로 반영했습니다.
theological_decisions:
- issue: 하나님의 이름을 위한 행위의 의미
  chosen_reading: 하나님이 자기 이름의 공적 명예와 계시된 성품을 위해 행동하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순한 명성 보호
  - 자기중심적 자기보존
  rationale: 에스겔에서 ‘이름’은 하나님의 드러난 성품과 언약적 명예를 가리키므로, 이를 공적·신학적 의미로 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 하나님의 거룩하심과 자기계시
- issue: ‘더럽히다’의 신학적 강도
  chosen_reading: ‘더럽혀지다’로 옮겨 하나님의 거룩한 이름이 열방 앞에서 성스럽지 않게 취급되는 의미를 보존했습니다.
  alternative_readings:
  - 속되게 되다
  - 욕되게 되다
  rationale: 문맥은 단순한 체면 손상이 아니라 거룩한 이름의 훼손이므로, 성소적·제의적 울림을 지닌 표현이 필요합니다.
  doctrine_reference: 하나님의 거룩함과 언약적 명예
