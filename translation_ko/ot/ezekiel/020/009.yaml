    rationale: אֲלֵיהֶם과 לְעֵינֵיהֶם은 열방을, לְהוֹצִיאָם의 목적어는 이스라엘 백성을 가리킵니다. 한국어에서는 ‘그 열방’과 ‘이스라엘 백성’을 밝혀 주는 편이 정확합니다.
  - severity: low
