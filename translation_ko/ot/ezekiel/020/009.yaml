revisions:
- from: 그러나 나는 내 이름을 위하여 행하였으니, 내가 그들 가운데 있었던 열방의 눈앞에서 그것이 더럽혀지지 않게 하려 함이었습니다. 내가 그들에게, 곧 그들의 눈앞에서, 이집트 땅에서 그들을 인도하여 내심으로써 나를 알게 하였습니다.[a][b][c]
  to: 그러나 나는 내 이름을 위하여[a] 행하였습니다. 이는 이스라엘 백성이 그 가운데 있었던 열방의 눈앞에서 내 이름이 더럽혀지지 않게[b] 하려는 것이었습니다. 내가 이집트 땅에서 이스라엘 백성을 인도하여 내어, 그 열방의 눈앞에서 그들에게 나를 알게 하였기[c] 때문입니다.
  rationale: 관계절의 인칭 지시를 원문대로 바로잡아 이스라엘 백성이 열방 가운데 있었다는 뜻을 명확히 했습니다. 또한 두 종류의 ‘그들’(열방 및 이스라엘)을 구별하여, 하나님께서 이스라엘을 이집트에서 인도해 내심으로 열방 앞에서 자신을 알리셨다는 원문의 절 구조와 의미를 보존했습니다. 문장을 나누되 원문의 인과·목적 관계는 유지했습니다.
  reviewer_model: gpt-5.6-terra
