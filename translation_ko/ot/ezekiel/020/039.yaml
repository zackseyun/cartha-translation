  source_fidelity: 중간 조건절의 주어가 원문과 반대로 되어 있습니다. שֹׁמְעִים אֵלָי는 ‘너희가 내 말을 듣다/내게 귀 기울이다’이지 ‘내가 듣다’가 아닙니다. 이를 바로잡고, וְאַחַר의 시간적 표지를 ‘그 뒤에도’로 유지했습니다. 마지막 לֹא תְחַלְּלוּ עוֹד는 더 이상의 성호 모독을 금하는 강한 금지로 자연스럽게 옮겼습니다.
