reference: Ezekiel 20:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; possible renderings include 'filthy idols' or 'dung-idols.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Go, serve each his idols; but afterward, if you will not listen to me…' The Hebrew syntax after 'serve' is difficult, and the clause may be taken with slightly different punctuation.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이스라엘 집아, 너희에게 주 하나님께서 이렇게 말씀하십니다. 가서, 각 사람은 자기 우상들[a]을 섬기십시오. 그 뒤에도 너희가 내 말을 듣지 않겠다면[b], 너희는 너희의 예물과 우상들로 내 거룩한 이름을 다시는 욕되게 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 가리키는 매우 경멸적인 말입니다. ‘배설물 우상’처럼 더 강하게 옮길 수도 있으나, 본문에서는 기본 의미를 앞세웠습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 연결은 다소 난해하여, ‘가서, 각각 자기 우상을 섬기십시오. 그 후에, 너희가 내 말을 듣지 않겠다면…’처럼 구두점을 달리할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם / בֵּית יִשְׂרָאֵל
  english_pob_choice: But as for you, house of Israel
  chosen_korean: 하지만 너희, 이스라엘 집아
  alternatives_korean:
  - 이스라엘 집아, 그러나 너희는
  - 이스라엘 집아, 너희에게 말합니다
  lexicon: HALOT
  rationale: 대조적 호격을 살리되, 합쇼체에서 자연스러운 직접 호명으로 옮겼습니다.
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: 아도나이-여호와의 복합 칭호를 한국어에서 어색하지 않게 옮기면서, 본문 내 호칭 기능을 유지했습니다.
- source_word: אִישׁ גִּלּוּלָיו לְכוּ עֲבֹדוּ
  english_pob_choice: Go, each man, serve his idols
  chosen_korean: 가서, 각 사람이 자기 우상들을 섬기십시오
  alternatives_korean:
  - 가서, 각자 자기 우상들을 섬기십시오
  - 가서, 각 사람이 자기 우상을 섬기십시오
  lexicon: HALOT
  rationale: אִישׁ의 분배적 단수와 주어진 문맥의 날카로운 명령을 살리기 위해 ‘각 사람이’로 옮겼습니다. גִּלּוּלִים의 경멸적 뉘앙스는 본문에서는 ‘우상들’로 두고 다른 곳에서 과도한 해석을 덧붙이지 않았습니다.
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלַי
  english_pob_choice: if afterward you will not listen to me
  chosen_korean: 그런데 그 후에도 내가 듣지 않겠다면
  alternatives_korean:
  - 그 후에 너희가 내 말을 듣지 않겠다면
  - 그런 뒤에도 너희가 내게 귀 기울이지 않겠다면
  lexicon: HALOT
  rationale: 히브리어의 애매한 구조를 지나치게 정리하지 않고, 시간적 표지와 조건을 함께 드러내는 방향으로 옮겼습니다. 다만 한국어에서는 주어·대상 관계를 자연스럽게 하기 위해 ‘내가 듣지 않겠다면’으로 주어를 압축했습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 나의 거룩한 이름
  - 내 거룩한 이름을
  lexicon: HALOT
  rationale: 지정적 소유 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לֹא תְחַלְּלוּ עוֹד
  english_pob_choice: you shall no longer profane
  chosen_korean: 다시는 … 욕되게 해서는 안 됩니다
  alternatives_korean:
  - 더 이상 … 더럽혀서는 안 됩니다
  - 다시는 … 속되게 해서는 안 됩니다
  lexicon: HALOT
  rationale: חלל의 ‘거룩하게 된 것을 더럽혀 모독하다’는 의미를 한국어의 ‘욕되게 하다’로 살려, 단순 오염보다 신성 모독의 강도를 드러냈습니다.
theological_decisions:
- issue: '명령문의 성격: 우상숭배 허용인가, 심판적 방임인가'
  chosen_reading: 명령 형식을 유지하되, 본문 전체는 우상숭배를 승인하는 것이 아니라 불순종을 드러내는 심판적 경고로 읽히게 했습니다.
  alternative_readings:
  - 단순한 허용 명령
  - 순전한 빈정거림으로만 읽기
  rationale: 문맥상 하나님은 우상숭배를 허락하는 것이 아니라, 그들의 불순종을 드러내고 더 이상의 성호 모독을 금지하십니다. 따라서 한국어도 명령의 날카로움과 최종 금지를 함께 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
