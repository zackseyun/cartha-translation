revisions:
- from: 그러나 자녀들은 나에게 반역하였습니다[a]. 그들은 내 율례들 가운데서 행하지 않았고, 내 규례들을 지켜 그것들을 행하지도 않았습니다. 곧 사람이 그것들을 행하면 그들로 말미암아 살 규례들입니다. 그들은 내 안식일들을 더럽혔습니다. 그래서 내가 그들 위에 내 분노를 쏟아 부어 광야에서 그들에 대한 내 진노를 다 쏟아버리겠다고 말하였습니다[b].
  to: 그러나 자녀들은 나에게 반역하였습니다. 그들은 내 율례를 따라 살지 않았고, 사람이[a] 그것들을 행하면 그것들로 말미암아 살게 되는 내 규례를 지켜 행하지도 않았습니다. 그들은 내 안식일들을 더럽혔습니다. 그래서 내가 그들 위에 내 분노를 쏟고, 광야에서 그들에게 내 진노를 다 쏟아붓겠다고 말하였습니다[b].
  rationale: 필수 수정 사항은 (1) 부정문의 범위를 바로잡아 ‘지켜 행하지도 않았습니다’로 고친 것, (2) הָאָדָם에 관한 각주를 올바른 ‘사람’에 배치하고 내용도 그에 맞게 교정한 것, (3) 관계절과 진노의 병렬 표현을 현대 한국어로 명료하게 다듬은 것입니다. 본문은 해석적 확장을 피하고 히브리어의 법규 용어 구별 및 심판 표현을 유지합니다.
