review_pass:
  verdict: revise
  source_fidelity: 수정 전 본문은 ‘지켜 그것들을 행하지도 않았다’가 한국어 문법상 ‘지키기는 했으나 행하지는 않았다’로 읽힐 수 있어, 히브리어의 ‘지켜 행하지 않았다’를 충실히 전달하지 못합니다. 또한 לְכַלּוֹת אַפִּי는 진노를 완전히 집행한다는 뜻인데, 이를 자연스럽게 드러내도록 조정했습니다.
  naturalness: ‘율례들 가운데서 행하다’와 ‘그들로 말미암아 살 규례들’은 현대 한국어 성경 문체로 다소 부자연스럽습니다. ‘율례를 따라 살다’, ‘사람이 그것들을 행하면 그것들로 말미암아 살게 되는 규례’로 다듬어 뜻과 문장 관계를 명료하게 했습니다.
  terminology: חֻקּוֹת은 ‘율례’, מִשְׁפָּטִים은 ‘규례’로 구별했습니다. חלל은 ‘더럽혔다’로 유지했으며, 일반적 단수 הָאָדָם은 한국어에서 포괄적인 ‘사람’으로 옮겼습니다.
  issues:
  - severity: high
    issue: 첫째 각주의 위치와 내용이 본문과 맞지 않습니다.
    rationale: '[a]는 ‘자녀들은’ 뒤에 붙어 있으나, 제시된 영어 감사 기록에서 해당 각주는 הָאָדָם의 일반적 단수 용법에 관한 것입니다. 현행 각주 내용도 본문의 ‘자녀들은 나에게 반역하였습니다’와 사실상 같은 문장을 대안으로 제시하여 기능하지 않습니다. ‘사람’에 붙이고 일반적 단수의 의미를 설명해야 합니다.'
  - severity: high
    issue: ‘내 규례들을 지켜 그것들을 행하지도 않았습니다’는 부정의 범위가 부정확하거나 모호합니다.
    rationale: 한국어의 ‘지켜 … 행하지도 않았다’는 규례를 지킨 사실을 전제하고 행하지 않았다는 뜻으로 읽힐 수 있습니다. 히브리어는 규례를 지켜 행하는 일을 하지 않았다는 뜻이므로 ‘지켜 행하지도 않았습니다’가 적절합니다.
  - severity: medium
    issue: ‘그들로 말미암아 살 규례들’은 선행사와 관계절의 연결이 어색합니다.
    rationale: אֲשֶׁר 절은 ‘내 규례들’을 수식합니다. 관계절을 완결형으로 풀어 ‘사람이 그것들을 행하면 그것들로 말미암아 살게 되는 내 규례’라고 해야 자연스럽고 정확합니다.
  - severity: medium
    issue: ‘광야에서 그들에 대한 내 진노를 다 쏟아버리다’는 전치사 관계와 히브리어 동사 병렬을 다소 흐립니다.
    rationale: 첫 동작은 그들 위에 분노를 쏟는 것이고, 둘째는 그들 가운데서/그들에게 진노를 다하는 것입니다. 두 표현을 병렬로 보존하여 심판의 완결성을 드러내는 것이 좋습니다.
  revised_text: 그러나 자녀들은 나에게 반역하였습니다. 그들은 내 율례를 따라 살지 않았고, 사람이[a] 그것들을 행하면 그것들로 말미암아 살게 되는 내 규례를 지켜 행하지도 않았습니다. 그들은 내 안식일들을 더럽혔습니다. 그래서 내가 그들 위에 내 분노를 쏟고, 광야에서 그들에게 내 진노를 다 쏟아붓겠다고 말하였습니다[b].
