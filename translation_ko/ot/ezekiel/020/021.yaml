id: EZK.20.21
reference: Ezekiel 20:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
  footnotes:
  - marker: a
    text: Or 'if a person does them, he will live by them.' Hebrew 'the man' is a generic singular for a human being.
    reason: lexical_alternative
  - marker: b
    text: This clause echoes Leviticus 18:5.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 자녀들은 나에게 반역하였습니다[a]. 그들은 내 율례들 가운데서 행하지 않았고, 내 규례들을 지켜 그것들을 행하지도 않았습니다. 곧 사람이 그것들을 행하면 그들로 말미암아 살 규례들입니다. 그들은 내 안식일들을 더럽혔습니다. 그래서 내가 그들 위에 내 분노를 쏟아 부어 광야에서 그들에 대한 내 진노를 다 쏟아버리겠다고 말하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 나에게 반역하였습니다.’ 히브리어의 ‘반역하다’는 언약 관계에 대한 적극적 저항을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 레위기 18:5를 반향합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  english_pob_choice: rebelled against me
  chosen_korean: 나에게 반역하였습니다
  alternatives_korean:
  - 나를 거역하였습니다
  - 나에게 반항하였습니다
  lexicon: HALOT
  rationale: מרה with ב는 단순한 불순종보다 언약 관계 안에서의 반역을 가리키므로, ‘반역하다’가 그 강도를 가장 잘 드러냅니다.
- source_word: הַבָּנִים
  english_pob_choice: the children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아들들
  - 아이들
  lexicon: HALOT
  rationale: 문맥상 다음 세대 전체를 가리키는 집합적 표현이므로, 남성 전용으로 들릴 수 있는 ‘아들들’보다 ‘자녀들’이 적절합니다.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  english_pob_choice: did not walk in my statutes
  chosen_korean: 내 율례들 가운데서 행하지 않았고
  alternatives_korean:
  - 내 율례를 따르지 않았고
  - 내 율례 안에서 걷지 않았고
  lexicon: HALOT
  rationale: ‘걷다’의 관용을 한국어에서는 자연스러운 ‘행하다’로 옮기되, 규범 안에서의 삶이라는 뜻은 ‘가운데서’로 보존했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 판단들
  - 내 법도들
  lexicon: HALOT
  rationale: 여기서 미쉬파트는 법적 판결이라기보다 하나님의 정해 두신 규범·판례를 가리키므로, 한국어에서는 ‘규례들’이 가장 자연스럽습니다.
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  english_pob_choice: they did not keep my judgments to do them
  chosen_korean: 지켜 그것들을 행하지도 않았습니다
  alternatives_korean:
  - 지켜서 실천하지도 않았습니다
  - 지키며 행하지도 않았습니다
  lexicon: HALOT
  rationale: שׁמר + ל + infinitive의 목적/지향을 살려, 단순한 ‘지키지 않았다’가 아니라 ‘지켜서 행하다’라는 구조를 유지했습니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  english_pob_choice: the judgments that, if a man does them, he will live by them
  chosen_korean: 곧 사람이 그것들을 행하면 그들로 말미암아 살 규례들입니다
  alternatives_korean:
  - 곧 사람이 그것들을 행하면 그것들로 인해 살 규례들입니다
  - 곧 사람이 그것들을 행하면 그 안에서 살 규례들입니다
  lexicon: HALOT
  rationale: 히브리어의 일반적 단수 אדם을 한국어에서는 성별을 특정하지 않는 ‘사람’으로 옮기고, ‘live by them’은 ‘그들로 말미암아 살’로 보존했습니다.
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  english_pob_choice: They profaned my Sabbaths
  chosen_korean: 그들은 내 안식일들을 더럽혔습니다
  alternatives_korean:
  - 그들은 내 안식일들을 profaned하였습니다
  - 그들은 내 안식일들을 훼손하였습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 속된 것으로 만드는 행위이므로, 한국어에서는 성스러움의 훼손을 직접 드러내는 ‘더럽혔습니다’가 적절합니다.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם לְכַלּוֹת אַפִּי בָּם
  english_pob_choice: to pour out my wrath on them, to spend my anger against them
  chosen_korean: 내 분노를 쏟아 부어 광야에서 그들에 대한 내 진노를 다 쏟아버리겠다고
  alternatives_korean:
  - 내 진노를 그들에게 쏟아붓고 광야에서 그들을 끝내버리겠다고
  - 내 진노를 그들 위에 쏟아 부어 광야에서 내 화를 다하겠다고
  lexicon: HALOT
  rationale: חֵמָה와 אַף의 병렬을 한국어에서도 ‘분노/진노’로 구분해 유지하고, לְכַלּוֹת는 ‘다 쏟아버리다’로 심판의 완결성을 살렸습니다.
theological_decisions:
- issue: הָאָדָם의 일반적 단수 표현
  chosen_reading: ‘사람’으로 옮겨 성별을 특정하지 않는 일반적 의미를 살렸습니다.
  alternative_readings:
  - ‘한 사람’
  - ‘인간’
  rationale: 본문의 אָדָם은 규범을 지키는 일반 인간을 가리키는 단수이므로, 한국어에서는 포괄적 의미가 분명한 ‘사람’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
- issue: ‘광야’에서의 심판 종결 표현
  chosen_reading: ‘광야에서 그들에 대한 내 진노를 다 쏟아버리겠다고’로 심판의 완결성과 강도를 드러냈습니다.
  alternative_readings:
  - ‘광야에서 그들을 멸하겠다고’
  - ‘광야에서 내 진노를 끝내겠다고’
  rationale: 히브리어 לְכַלּוֹת는 단순한 감정 표출이 아니라 진노를 끝까지 집행한다는 뜻이므로, 멸절을 과도하게 특정하지 않으면서도 완결성을 살린 표현을 택했습니다.
  doctrine_reference: Ezek 20:21 source semantics of לְכַלּוֹת אַפִּי
