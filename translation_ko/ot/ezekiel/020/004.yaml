id: EZK.20.4
reference: Ezekiel 20:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
  footnotes:
  - marker: a
    text: Or 'their ancestors' for 'their fathers.' The Hebrew is literally 'their fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' is Ezekiel''s regular form of address here; alternatively, ''mortal'' or ''human one.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 심판하시겠습니까? 인자야, 당신은 심판하시겠습니까? 그들의 조상들의 가증한 일들을 그들에게 알리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 아버지들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘their fathers’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 여기서 에스겔에게 주어진 익숙한 호칭입니다. 다른 가능성으로는 ‘사람’ 또는 ‘인간’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט אֹתָם
  english_pob_choice: Will you judge them
  chosen_korean: 그들을 심판하시겠습니까?
  alternatives_korean:
  - 그들을 판단하시겠습니까?
  - 그들을 재판하시겠습니까?
  lexicon: HALOT
  rationale: שׁפט의 법정적 의미를 살려 한국어에서는 ‘심판하다’로 옮겼습니다. 질문형 반복의 긴박함도 유지했습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 반복적 호칭을 살리면서 한국어에서 자연스럽게 직접 부르는 형식으로 처리했습니다. ‘인자’는 본문 용법을 보존하고, 호격 ‘-야’로 대화성을 드러냅니다.
- source_word: תּוֹעֲבֹת
  english_pob_choice: abominations
  chosen_korean: 가증한 일들
  alternatives_korean:
  - 역겨운 일들
  - 혐오스러운 행위들
  lexicon: HALOT
  rationale: 에스겔의 언약적·도덕적 중량감을 보존하면서도 현대 한국어에서 의미가 분명한 표현을 택했습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들의
  alternatives_korean:
  - 그들의 아버지들의
  - 그들의 선조들의
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘fathers’를 반영하되, 한국어에서 자연스럽고 문맥상 혈통·전승의 의미가 살아나는 ‘조상들’로 옮겼습니다. 직역 대안은 각주로 남길 수 있습니다.
- source_word: הוֹדִיעֵם
  english_pob_choice: Make known to them
  chosen_korean: 그들에게 알리십시오
  alternatives_korean:
  - 그들에게 알려 주십시오
  - 그들에게 선포하십시오
  lexicon: HALOT
  rationale: 사역형의 ‘알게 하다’를 자연스러운 명령형으로 옮겼습니다. 예언적 전달의 강한 요청을 유지합니다.
theological_decisions:
- issue: ‘심판하시겠습니까’의 반복
  chosen_reading: 두 번의 수사 의문을 모두 유지해, 예언적 책망과 압박의 강도를 드러냈습니다.
  alternative_readings:
  - 한 번만 ‘심판하시겠습니까’로 줄여 매끄럽게 처리
  - 두 번째를 ‘판단하시겠습니까’로 바꾸어 변화를 주기
  rationale: 히브리어의 반복은 의도적 강조이므로, 의미를 완화하지 않고 그대로 살리는 것이 본문의 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 1 (Source transparency)
- issue: ‘인자’의 호칭 유지
  chosen_reading: 에스겔의 고유한 예언자 호칭으로 보고 ‘인자야’를 유지했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 후대의 메시아적 용례를 이 본문에 들여오지 않고, 원문의 직접 호칭을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 4 (Gender-accurate over gender-neutral)
