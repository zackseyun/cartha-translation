source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
  footnotes:
  - marker: a
    text: Hebrew 'a man'; the phrase is a generic singular meaning any person who does them will live by them.
    reason: lexical_alternative
  - marker: b
    text: Or 'my ordinances' for 'my judgments.'
    reason: lexical_alternative
  - marker: c
    text: This wording echoes Leviticus 18:5.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 이스라엘 집안은 광야에서 내게 반역했습니다[a]. 그들은 내 규례를 따라 걷지 않았고, 내 법도를 거절했습니다. 사람이 그것들을 행하면 그것들로 살게 되는 것들입니다. 그들은 내 안식일들을 크게 더럽혔습니다. 그래서 나는 그들에게 광야에서 내 분노를 쏟아부어[b] 그들을 끝내겠다고 말했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘남자/사람’의 대표적 단수 표현입니다.
    reason: source_note
  - marker: b
    text: ‘분노를 쏟아붓다’는 히브리어 ‘내 분노를 붓다’의 관용적 심판 표현을 따른 것입니다.
    reason: source_note
  - marker: c
    text: 이 표현은 레위기 18장 5절의 생명 약속을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집안
  alternatives_korean:
  - 이스라엘
  - 이스라엘의 집
  lexicon: HALOT
  rationale: 예언서의 집단적·가문적 표현을 살리기 위해 ‘집안’을 택했고, 단순히 민족명으로 축소하지 않았습니다.
- source_word: וַיַּמְרוּ בִי
  english_pob_choice: rebelled against me
  chosen_korean: 내게 반역했습니다
  alternatives_korean:
  - 내게 대항했습니다
  - 내게 불순종했습니다
  lexicon: HALOT
  rationale: בְּ + מרה는 단순 불순종보다 언약적 반역/저항의 뉘앙스가 강하므로 이를 직접 드러냈습니다.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  english_pob_choice: They did not walk in my statutes
  chosen_korean: 내 규례를 따라 걷지 않았고
  alternatives_korean:
  - 내 규례 안에서 살지 않았고
  - 내 규례를 따르지 않았고
  lexicon: HALOT
  rationale: ‘걷다’의 성경적 관용구를 유지하되 한국어에서 자연스럽게 읽히도록 ‘따라 걷다’로 옮겼습니다.
- source_word: וְאֶת מִשְׁפָּטַי מָאָסוּ
  english_pob_choice: they rejected my judgments
  chosen_korean: 내 법도를 거절했습니다
  alternatives_korean:
  - 내 판단을 거절했습니다
  - 내 규례를 멸시했습니다
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 여기서 재판 결과보다 언약적 명령/판정의 성격이 강해 ‘법도’로 옮기되, 능동적 거절을 분명히 했습니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָהֶם
  english_pob_choice: which if a man does them, he will live by them
  chosen_korean: 사람이 그것들을 행하면 그것들로 살게 되는 것들입니다
  alternatives_korean:
  - 어떤 사람이 그것들을 행하면 그것들로 살 것입니다
  - 사람이 그것들을 행하면 그것들로 생명을 얻게 됩니다
  lexicon: HALOT
  rationale: 반복되는 ‘그것들’과 생명 약속의 관용구를 살리면서, 히브리어의 대표적 단수 의미를 한국어 자연문장으로 풀었습니다.
- source_word: וְאֶת שַׁבְּתֹתַי חִלְּל֣וּ מְאֹד
  english_pob_choice: They greatly profaned my Sabbaths
  chosen_korean: 내 안식일들을 크게 더럽혔습니다
  alternatives_korean:
  - 내 안식일들을 심히 모독했습니다
  - 내 안식일들을 심하게 더럽혔습니다
  lexicon: HALOT
  rationale: חִלֵּל은 ‘더럽히다/모독하다’ 범위가 있으나, 안식일 맥락에서는 예배적 훼손을 드러내는 ‘더럽혔습니다’가 자연스럽고 강합니다.
- source_word: לִשְׁפֹּךְ חֲמָתִי
  english_pob_choice: I would pour out my wrath
  chosen_korean: 내 분노를 쏟아부어
  alternatives_korean:
  - 내 진노를 쏟아붓고
  - 내 분노를 쏟아붓고
  lexicon: HALOT
  rationale: חֲמָה는 하나님의 격렬한 심판 감정을 가리키므로 ‘분노’로 옮기되, ‘쏟아붓다’로 히브리어의 동사를 살렸습니다.
theological_decisions:
- issue: הָאָדָם의 대표적 단수와 성별 표지
  chosen_reading: ‘사람이’로 옮겨 대표적 단수의 뜻을 살리되, 본문 흐름에서 누구든지 적용되는 언약 원리를 한국어로 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘한 사람이’
  - ‘어떤 사람이’
  rationale: 히브리어는 문법적으로 남성 단수이지만 대표적 일반성을 띠므로, 한국어에서는 성별을 과도하게 강조하지 않으면서도 단수 구조를 보존하는 쪽이 더 정확합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
- issue: לְכַלּוֹתָם의 심판적 종결
  chosen_reading: ‘그들을 끝내겠다고’로 옮겨 멸절 의도를 분명히 했습니다.
  alternative_readings:
  - ‘그들을 멸하시겠다고’
  - ‘그들을 완전히 없애겠다고’
  rationale: כלה는 단순 종료보다 심판적 소멸의 뉘앙스가 있어, 본문의 위협을 약화시키지 않는 방향으로 표현했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
