revisions:
- from: 그러나 이스라엘 집안은 광야에서 내게 반역했습니다[a]. 그들은 내 규례를 따라 걷지 않았고, 내 법도를 거절했습니다. 사람이 그것들을 행하면 그것들로 살게 되는 것들입니다. 그들은 내 안식일들을 크게 더럽혔습니다. 그래서 나는 그들에게 광야에서 내 분노를 쏟아부어[b] 그들을 끝내겠다고 말했습니다[c].
  to: 그러나 이스라엘 족속은 광야에서 내게 반역하였습니다. 그들은 내 규례를 따르지 않았고, 사람이 그것들을 행하면 그것들로 살게 되는 내 법도를 거절하였습니다[a][c]. 그들은 내 안식일들을 심히 모독하였습니다. 그래서 나는 광야에서 그들에게 내 진노를 쏟아부어[b] 그들을 멸하겠다고 말하였습니다.
  rationale: The revision restores the Hebrew syntax by making the life formula modify ‘내 법도,’ uses established prophetic Korean for ‘house of Israel,’ strengthens the final judgment phrase to match לְכַלּוֹתָם, and relocates both content-specific footnote anchors to the life formula. It preserves the representative singular of הָאָדָם as ‘사람이’ and retains the plural ‘안식일들.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Israel's rebellion, rejection of God's statutes and judgments, Sabbath profanation, and the announced outpouring of wrath. However, the relative clause concerning the judgments is rendered as an independent, ungrammatical sentence ('...것들입니다'), obscuring that it modifies 'my judgments.' The final '끝내겠다' is weaker and less specific than לְכַלּוֹתָם, which expresses bringing them to destruction/an end in judgment.
  naturalness: ‘이스라엘 집안’ is overly domestic in modern Korean for the prophetic corporate designation בֵּית יִשְׂרָאֵל; ‘이스라엘 족속’ is established and natural in biblical Korean. The standalone clause about living is unnatural and must be syntactically attached to ‘법도.’
  terminology: '‘규례,’ ‘법도,’ ‘안식일들,’ and ‘진노’ appropriately preserve the covenantal and judicial terminology. ‘심히 모독했습니다’ conveys the cultic force of חילל more precisely than ‘크게 더럽혔습니다.’ Footnote anchors must be moved: the note on אדם and the Leviticus echo belong with the life formula, not with rebellion or the final divine speech.'
  issues:
  - severity: high
    issue: The life-formula relative clause is detached and syntactically malformed.
    rationale: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם modifies ‘my judgments.’ The draft's ‘사람이 ... 것들입니다’ is not a viable Korean sentence and loses that relationship.
  - severity: medium
    issue: Footnotes a and c are anchored to the wrong phrases.
    rationale: Both the generic-singular note and the Leviticus 18:5 cross-reference concern ‘사람이 그것들을 행하면 그것들로 살게 되는,’ whereas the draft places a after ‘반역했습니다’ and c after ‘말했습니다.’
  - severity: medium
    issue: ‘그들을 끝내겠다’ understates the judicial destruction expressed by לְכַלּוֹתָם.
    rationale: In this context, ‘그들을 멸하겠다’ clearly conveys the intended consummation of judgment without adding doctrinal interpretation.
  - severity: low
    issue: ‘이스라엘 집안’ is not the best Korean prophetic designation.
    rationale: ‘이스라엘 족속’ naturally represents the corporate ‘house of Israel’ without suggesting a modern household.
  revised_text: 그러나 이스라엘 족속은 광야에서 내게 반역하였습니다. 그들은 내 규례를 따르지 않았고, 사람이 그것들을 행하면 그것들로 살게 되는 내 법도를 거절하였습니다[a][c]. 그들은 내 안식일들을 심히 모독하였습니다. 그래서 나는 광야에서 그들에게 내 진노를 쏟아부어[b] 그들을 멸하겠다고 말하였습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘사람’은 대표적 단수 표현으로, 그것들을 행하는 모든 사람을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘내 진노를 쏟아붓다’는 히브리어의 심판 표현을 따른 것입니다.
    reason: source_note
  - marker: c
    text: 이 표현은 레위기 18장 5절의 생명 약속을 떠올리게 합니다.
    reason: cross_reference
  revision_rationale: The revision restores the Hebrew syntax by making the life formula modify ‘내 법도,’ uses established prophetic Korean for ‘house of Israel,’ strengthens the final judgment phrase to match לְכַלּוֹתָם, and relocates both content-specific footnote anchors to the life formula. It preserves the representative singular of הָאָדָם as ‘사람이’ and retains the plural ‘안식일들.’
