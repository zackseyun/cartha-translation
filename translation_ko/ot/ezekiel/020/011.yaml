id: EZK.20.11
reference: Ezekiel 20:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתֵּ֤ן לָ/הֶם֙ אֶת חֻקּוֹתַ֔/י וְ/אֶת מִשְׁפָּטַ֖/י הוֹדַ֣עְתִּי אוֹתָ֑/ם אֲשֶׁ֨ר יַעֲשֶׂ֥ה אוֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֥י בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
  footnotes:
  - marker: a
    text: Or 'a person' or 'humankind'; Hebrew 'the man' uses a singular representative form.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 내 규례들을 주고, 내 법규들을 그들에게 알렸습니다. 곧 사람이 그것들을 행하면 그로 말미암아 살게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람’(הָאָדָם)은 대표적 단수 형태로, ‘한 사람’ 또는 ‘인간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법규들
  - 내 율례들
  lexicon: HALOT
  rationale: חֻקּוֹת는 단순한 일반 법보다 정해진 규범·규례의 성격이 강하므로, 한국어에서는 교회 전통어보다 비교적 직접적인 ‘규례들’이 원문 감각을 잘 살립니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 규례들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 법정적·규범적 ‘판단/판결’의 뜻이 있으나, 여기서는 규례와 병렬로 주어진 하나님의 법적 지시를 가리키므로 자연스러운 현대어로 ‘법규들’이 적절합니다.
- source_word: הוֹדַעְתִּי אוֹתָם
  english_pob_choice: I made ... known to them
  chosen_korean: 그들에게 알렸습니다
  alternatives_korean:
  - 그들에게 알려 주었습니다
  - 그들에게 깨우쳐 주었습니다
  lexicon: HALOT
  rationale: הוֹדִיעַ의 사역형은 ‘알게 하다, 알리다’가 기본이므로, 해석을 덜 개입시키는 ‘알렸습니다’가 원문에 가장 가깝습니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם
  english_pob_choice: which, if a man does them
  chosen_korean: 곧 사람이 그것들을 행하면
  alternatives_korean:
  - 곧 어떤 사람이 그것들을 행하면
  - 곧 그 사람이 그것들을 행하면
  lexicon: HALOT
  rationale: 히브리어의 대표적 단수 אדם은 특정 남성 한 사람보다 대표적 ‘사람’을 가리키므로, 현대 한국어에서는 성중립적 의미를 살린 ‘사람’이 더 정확합니다.
- source_word: וָחַי בָּהֶם
  english_pob_choice: he will live by them
  chosen_korean: 그로 말미암아 살게 하려는 것이었습니다
  alternatives_korean:
  - 그것들로 살아가게 하려는 것이었습니다
  - 그것들 안에서 살게 하려는 것이었습니다
  lexicon: HALOT
  rationale: בָּהֶם은 문자적으로 ‘그것들 안에서/그것들로’이지만, 관용적으로는 수단·결과를 나타내므로 ‘그로 말미암아’가 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 율법 순종과 생명의 관계를 어떻게 드러낼지
  chosen_reading: 문장을 설명적으로 확장하지 않고, ‘그로 말미암아 살게 하려는 것이었습니다’로 생명-순종 সূত্র 자체를 유지했습니다.
  alternative_readings:
  - 영원한 생명을 뜻한다
  - 언약 안의 현세적 생존을 뜻한다
  rationale: 본문은 생명의 범위(현세/영원/공동체적 번영)를 명시하지 않으므로, 그 긴장을 풀어버리지 않고 원문 표현을 보존하는 것이 더 충실합니다.
  doctrine_reference: 의미의 범위를 본문이 정한 만큼만 유지
- issue: 하나님의 법적 진술의 어조
  chosen_reading: ‘규례들 / 법규들’로 번역해 법적·언약적 어조를 유지했습니다.
  alternative_readings:
  - 계명들
  - 율례와 법도
  rationale: 여기서는 도덕 훈계보다 언약 백성에게 주어진 공적 규범 선언의 느낌이 강하므로, 전통적 교회어보다 원문 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: 언약-율법 문맥 보존
