id: EZK.20.25
reference: Ezekiel 20:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
  footnotes:
  - marker: a
    text: Or, interpretively, 'I gave them over to statutes that were not good,' preserving the sense that this was a judicial act rather than God issuing morally defective laws.
    reason: alternative_reading
  - marker: b
    text: The phrase 'live by them' echoes the covenantal idiom that obedience to God's statutes leads to life (compare Lev 18:5). Here the expression is deliberately reversed.
    reason: cross_reference
translation:
  language: ko
  text: 더욱이 나 자신이 그들에게 좋지 않은 율례들과 그것들로 말미암아 그들이 살 수 없는 규례들을 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주었습니다’는 하나님이 주어인 직접적인 ‘내가 주었다’를 따른 것입니다. 이를 심판 행위로 이해하여 ‘그들에게 넘겨주셨다’로 풀이하는 해석도 있습니다.
    reason: theological_note
  - marker: b
    text: ‘그것들로 말미암아 살다’는 하나님의 율례를 지킴으로 생명을 얻는다는 언약적 관용구를 반영합니다(레위기 18:5 참조). 여기서는 그 표현이 의도적으로 부정되어 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Moreover
  chosen_korean: 더욱이
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: HALOT
  rationale: 앞선 문맥에 덧붙이는 강조와 전개를 자연스럽게 살리기 위해 선택했습니다.
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 나는
  alternatives_korean:
  - 나 자신은
  - 내가
  lexicon: HALOT
  rationale: 히브리어의 독립 인칭대명사가 주는 강조는 한국어 주어 위치와 문맥으로 충분히 드러나므로, 과도한 중복 없이 번역했습니다.
- source_word: חֻקִּים
  english_pob_choice: statutes
  chosen_korean: 율례들
  alternatives_korean:
  - 규례들
  - 법도들
  lexicon: HALOT
  rationale: 언약적·법적 맥락에서 חֻקִּים을 나타내는 전통적 법어이면서도, 문맥의 긴장감을 살릴 수 있어 ‘율례들’로 옮겼습니다.
- source_word: מִשְׁפָּטִים
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 판결들
  - 판단들
  lexicon: HALOT
  rationale: 앞의 ‘율례들’과 구분되는 법적 항목으로서, 일반 독자에게도 비교적 익숙한 ‘규례들’이 적절합니다.
- source_word: לֹא טוֹבִים
  english_pob_choice: that were not good
  chosen_korean: 좋지 않은
  alternatives_korean:
  - 선하지 않은
  - 나쁜
  lexicon: HALOT
  rationale: 히브리어의 단순 부정 판단을 과도하게 도덕화하지 않고, 본문의 직접적 긴장을 유지하는 표현으로 옮겼습니다.
- source_word: לֹא יִחְיוּ בָּהֶם
  english_pob_choice: by which they could not live
  chosen_korean: 그로 말미암아 그들이 살 수 없는
  alternatives_korean:
  - 그것들로는 그들이 살지 못하는
  - 그 안에서 그들이 살 수 없는
  lexicon: HALOT
  rationale: בָּהֶם의 수단/근거 의미를 자연스럽게 드러내면서, ‘살 수 없다’는 능력 부정의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 하나님이 ‘좋지 않은 율례들’을 주셨다는 진술의 긴장
  chosen_reading: 본문의 직설을 살려 ‘주었습니다’로 옮기고, 이를 완화하는 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 허용하셨습니다
  - 그들에게 넘겨주셨습니다
  rationale: 히브리어 동사 נָתַתִּי는 직접적으로 ‘주다’이며, 본문은 심판적/사법적 긴장을 그대로 드러냅니다. 해석적 완화는 본문 밖에서 다루는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
