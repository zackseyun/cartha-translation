base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and were not willing to listen to me[a]. No man threw away the detestable things his eyes were set on, and they did not abandon the idols of Egypt. Then I said I would pour out my wrath on them[b], to spend my anger against them in the midst of the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew 'the detestable things of his eyes,' an idiom for the abhorrent objects each person fixed his gaze on or desired.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'idols' here is especially contemptuous; it can carry the sense of something filthy or vile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 내게 거역하고 내 말을 들으려 하지 않았습니다. 그들 가운데 한 사람도 자기 눈으로 탐하던 가증한 것들을[a] 버리지 않았고, 애굽의 우상들도[b] 버리지 않았습니다. 이에 나는 그들에게 내 진노를 쏟아 애굽 땅 한가운데에서 그들에게 내 분노를 다 쏟으려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로 직역하면 ‘그들의 눈의 가증한 것들’입니다. 이는 각 사람이 눈으로 탐하거나 원하는 혐오스러운 물건을 가리키는 관용적 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘우상’으로 옮긴 히브리어 용어는 특히 경멸적인 뉘앙스를 지니며, 더러운 것이나 추악한 것을 뜻할 수도 있습니다.
    reason: alternative_reading
