  source_fidelity: 수정이 필요합니다. אֲדֹנָי יְהוִה는 두 요소를 모두 반영하여 ‘주 야훼’로 옮기는 것이 적절합니다. 초안의 ‘주 하나님’은 יְהוִה(야훼)를 제목에서 드러내지 못합니다. 또한 בְּיוֹם בָּחֳרִי는 완료된 선택을 가리키므로 ‘택하던 날’보다 ‘택한 날’이 정확합니다. וָאֶשָּׂא יָדִי의 이미지는 본문에 보존하고, 맹세의 관용적 함의는 첫 용례에 붙인 각주로 제시합니다.
  naturalness: ‘내 손을 들어 올렸고’는 한국어에서는 다소 중복적으로 들리므로 ‘내 손을 들었고’가 자연스럽습니다. 또한 ‘말하기를 …라고 하였습니다’는 직접 인용과 간접 인용이 겹친 구조이므로, 직접 인용을 명료하게 분리했습니다. 서술부는 현대적 합쇼체로 정리했습니다.
