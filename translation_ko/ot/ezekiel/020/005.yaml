base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
  footnotes:
  - marker: a
    text: Hebrew 'lifted up my hand,' an idiom often used for swearing an oath or making a solemn pledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말하십시오. “주 하나님께서 이렇게 말씀하십니다. 내가 이스라엘을 택하던 날, 내가 야곱 집의 후손에게 내 손을 들어 올렸고, 이집트 땅에서 그들에게 나를 알렸으며, 또 그들에게 내 손을 들어 올려 말하기를 ‘나는 너희의 하나님 야훼다’라고 하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 손을 들어 올렸다’는 관용적으로 맹세하거나 엄숙한 약속을 하는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 복합 호칭의 두 요소를 모두 살리면서 한국어로 자연스럽게 들리도록 ‘주 하나님’으로 옮겼습니다. 본문 안에서 고유명사를 덧붙여 중복시키기보다, 화자 공식 도입부의 존칭을 유지했습니다.
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  english_pob_choice: On the day when I chose Israel
  chosen_korean: 내가 이스라엘을 택하던 날
  alternatives_korean:
  - 내가 이스라엘을 택한 날
  - 이스라엘을 택하던 그 날
  lexicon: HALOT
  rationale: בחר의 언약적 선택 의미를 ‘택하다’로 살리고, זמן 구문은 한국어에서 자연스러운 ‘…하던 날’로 처리했습니다.
- source_word: וָאֶשָּׂא יָדִי
  english_pob_choice: I lifted up my hand
  chosen_korean: 내 손을 들어 올렸고
  alternatives_korean:
  - 내 손을 들었고
  - 맹세했고
  - 내 손을 들어
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 보존하기 위해 직역적 표현을 유지했습니다. 본문은 이미지 그대로 두고, 맹세 의미는 주석 없이도 문맥상 드러납니다.
- source_word: וָאִוָּדַע לָהֶם
  english_pob_choice: and made myself known to them
  chosen_korean: 그들에게 나를 알렸으며
  alternatives_korean:
  - 그들에게 나를 드러냈으며
  - 그들에게 자신을 알리셨으며
  - 그들에게 알려졌으며
  lexicon: HALOT
  rationale: 니팔형의 자기-현현/자기-계시 뉘앙스를 한국어의 능동적 자기표현으로 옮겨, 문맥의 주체성을 분명히 했습니다.
- source_word: לֵאמֹר אֲנִי יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: saying, “I am Yahweh your God.”
  chosen_korean: ‘나는 너희의 하나님 야훼다’라고 하였습니다.
  alternatives_korean:
  - ‘나는 너희의 하나님이다’라고 하였습니다.
  - ‘나는 야훼 너희 하나님이다’라고 하였습니다.
  lexicon: HALOT
  rationale: 직접 인용을 살려 언약 공식 ‘나는 … 너희의 하나님’ 구조를 유지했고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 본문에서는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  - 주 하나님
  rationale: 이 절은 하나님의 언약적 자기선언을 담고 있으므로, 프로젝트 기본값에 따라 Tetragrammaton을 음역해 가시화했습니다. 이는 번역어 ‘주’만으로는 가려질 수 있는 고유 이름을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: וָאֶשָּׂא יָדִי의 관용성
  chosen_reading: 직역적 이미지를 본문에 유지했습니다.
  alternative_readings:
  - 맹세했다
  - 엄숙히 서약했다
  rationale: 맹세 의미가 강하지만, 본문은 손을 들어 올리는 몸짓 자체를 유지해 언어적 투명성을 확보합니다. 이로써 독자가 원문의 관용구와 그 함의를 함께 볼 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
