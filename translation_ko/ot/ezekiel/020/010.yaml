translation:
  language: ko
  text: 그래서 내가 그들을 이집트 땅에서 이끌어 내어 광야로 데리고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  english_pob_choice: So I brought them out
  chosen_korean: 내가 그들을 이끌어 내어
  alternatives_korean:
  - 내가 그들을 데리고 나와
  - 내가 그들을 꺼내어
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 살리되, 한국어에서는 ‘이끌어 내다’가 출애굽의 사역성과 방향성을 자연스럽게 드러냅니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 나라에서
  lexicon: HALOT
  rationale: ‘땅’에 해당하는 אֶרֶץ를 반영해 원문의 완전한 표현을 유지하되, 현대 한국어에서는 ‘이집트 땅’이 가장 자연스럽습니다.
- source_word: וָאֲבִאֵם
  english_pob_choice: and brought them
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 이끌고 갔습니다
  - 인도하여 갔습니다
  lexicon: HALOT
  rationale: 히필형 בוא의 ‘데려오다/데리고 가다’ 의미를 살렸고, 앞절의 ‘이끌어 내어’와 짝을 이루어 이동의 방향을 분명히 했습니다.
- source_word: אֶל הַמִּדְבָּר
  english_pob_choice: into the wilderness
  chosen_korean: 광야로
  alternatives_korean:
  - 광야 안으로
  - 광야 속으로
  lexicon: HALOT
  rationale: מִדְבָּר는 출애굽 맥락에서 전형적인 ‘광야’이며, 이동의 방향은 한국어 조사 ‘-로’로 충분히 드러납니다.
