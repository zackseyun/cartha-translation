  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֤ר אֶל בְּנֵי/הֶם֙ בַּ/מִּדְבָּ֔ר בְּ/חוּקֵּ֤י אֲבֽוֹתֵי/כֶם֙ אַל תֵּלֵ֔כוּ וְ/אֶת מִשְׁפְּטֵי/הֶ֖ם אַל תִּשְׁמֹ֑רוּ וּ/בְ/גִלּוּלֵי/הֶ֖ם אַל תִּטַּמָּֽאוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; possible renderings include “filthy idols” or even “dung-idols.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 광야에서 그들의 자녀들에게 말했습니다. ‘너희 조상들의 규례 안에서 행하지 말고, 그들의 규례를 지키지 말며, 그들의 우상들로 스스로 더럽히지 마십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 가리키는 매우 경멸적인 표현입니다. “똥우상들”처럼 더 거센 번역도 가능하지만, 본문에는 기본 의미를 두고 주석으로 뉘앙스를 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  english_pob_choice: their children
  chosen_korean: 그들의 자녀들
  alternatives_korean:
  - 그들의 아들들
  - 그들의 후손들
  lexicon: HALOT
  rationale: בנים은 여기서 다음 세대를 가리키므로, 성별을 불필요하게 좁히지 않는 ‘자녀들’이 문맥상 가장 자연스럽고 충실합니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 광야 안에서
  - 사막에서
  lexicon: HALOT
  rationale: 출애굽 서술의 관용적 표현인 מִדְבָּר를 한국어 성경 문맥에 맞는 ‘광야’로 옮겼습니다.
- source_word: בְּחֻקֵּי אֲבוֹתֵיכֶם
  english_pob_choice: in the statutes of your fathers
  chosen_korean: 너희 조상들의 규례 안에서
  alternatives_korean:
  - 너희 조상들의 율례 안에서
  - 너희 조상들의 규정 안에서
  lexicon: HALOT
  rationale: חֻקִּים의 기본 의미인 규정된 법도를 살리되, 한국어에서 משפט과 구별되도록 ‘규례’로 옮겨 두 용어의 차이를 유지했습니다.
- source_word: מִשְׁפְּטֵיהֶם
  english_pob_choice: their judgments
  chosen_korean: 그들의 규례
  alternatives_korean:
  - 그들의 판단
  - 그들의 판결
  - 그들의 법도
  lexicon: HALOT
  rationale: 여기서는 משפטים가 단순한 법정 판결보다 공동체적·규범적 ‘판례/규정’의 성격이 강하므로, 바로 앞의 חֻקִּים과 과도하게 겹치지 않도록 문맥상 구별되는 ‘규례’로 옮겼습니다.
- source_word: גִּלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 우상
  - 그들의 더러운 우상들
  - 그들의 똥우상들
  lexicon: HALOT
  rationale: 본문의 기본 의미는 ‘우상’이며, גִּלּוּלִים의 강한 경멸성은 주석적 여지를 남기고 본문에서는 과도한 조어를 피했습니다.
theological_decisions:
- issue: אָ ל תִּטַּמָּאוּ 의 명령형 뉘앙스와 자기 오염의 표현
  chosen_reading: ‘그들의 우상들로 스스로 더럽히지 마십시오’
  alternative_readings:
  - ‘그들의 우상들로 더럽혀지지 마십시오’
  - ‘그들의 우상들 때문에 부정하게 되지 마십시오’
  rationale: 히트파엘의 반사적 뉘앙스를 살려, 우상과의 결합이 스스로를 더럽히는 행위임을 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 5
- issue: 직접화법의 명령 어조
  chosen_reading: 현대 공손체 명령형(‘-십시오’)
  alternative_readings:
  - 직설형 반말
  - 전통적 하옵나이다체
  rationale: 예언자적 직접화법을 현대 공손체로 옮기되, 출처의 명령성을 약화하지 않기 위해 ‘-십시오’ 체를 유지했습니다.
  doctrine_reference: DOCTRINE.md § Korean style
