  source_fidelity: ‘아버지들’(אֲבוֹתֵיכֶם)을 ‘조상들’로 옮긴 것은 세대 대비의 문맥은 전달하지만, 원문의 명시적 친족어를 넓힙니다. 또한 חֻקִּים과 מִשְׁפָּטִים을 모두 ‘규례’로 번역하여 원문의 법률 용어 구별이 사라졌습니다. 수정문은 ‘율례’와 ‘법도’로 이를 구별하고, 히트파엘의 자기 오염 의미를 유지합니다.
  naturalness: ‘규례 안에서 행하지’는 현대 표준어에서 다소 직역투입니다. ‘율례를 따라 행하지’가 문어적 성경 문맥과 현대 합쇼체에 자연스럽게 어울립니다. ‘너희 자신을 더럽히지 마십시오’는 반사적 의미를 명료하게 드러냅니다.
  terminology: חֻקִּים은 ‘율례’, מִשְׁפָּטִים은 ‘법도’로 구별했습니다. גִּלּוּלִים의 경멸적 어감은 본문에서 과장하지 않고 각주에 보존했습니다.
