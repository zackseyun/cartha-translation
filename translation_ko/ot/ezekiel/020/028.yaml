revisions:
- from: 내가 그들을 그 땅으로 데려갔습니다. 내가 내 손을 들어 그들에게 주기로 맹세한 그 땅입니다. 그들은 모든 높은 언덕과 모든 무성한 나무를 보고, 거기서 자기들의 희생제물을 바쳤으며, 거기서 자기들의 예물의 분노를 드렸고, 거기서 자기들의 향기로운 향을 두었으며, 거기서 자기들의 전제물을 부었습니다.[a][b][c]
  to: 내가 그들을, 내가 내 손을 들어 그들에게 주겠다고 맹세한 그 땅으로 데려갔습니다[a]. 그들은 모든 높은 언덕과 모든 무성한 나무를 보았고[b], 그곳에서 자기들의 희생제물을 바쳤으며, 그곳에서 자기들의 예물로 격분을 일으켰고[c], 그곳에 자기들의 향기로운 향내를 두었으며, 그곳에서 자기들의 전제물을 부었습니다.
  rationale: 원문의 반복되는 ‘그곳에서’와 제의 행위의 열거를 유지했습니다. 난해한 히브리어 구성어구는 한국어 문법에 맞게 풀되, 격분의 대상은 본문에 추가하지 않고 각주에서 문맥상 함의를 설명했습니다. 각주 표지는 각각의 해당 어구에 재배치했습니다.
