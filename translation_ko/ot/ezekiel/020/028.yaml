source:
  edition: WLC
  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
  footnotes:
  - marker: a
    text: Or, 'the land that I swore to give them'; literally, 'the land that I lifted up my hand to give to them.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional biblical wording: ''every high hill and every green tree.'''
    reason: lexical_alternative
  - marker: c
    text: The Hebrew phrase is literally 'the provocation of their offering,' expressing that their offering was offensive and provoking to God.
    reason: cultural_note
translation:
  language: ko
  text: 내가 그들을, 내가 내 손을 들어 그들에게 주겠다고 맹세한 그 땅으로 데려갔습니다[a]. 그들은 모든 높은 언덕과 모든 무성한 나무를 보았고[b], 그곳에서 자기들의 희생제물을 바쳤으며, 그곳에서 자기들의 예물로 격분을 일으켰고[c], 그곳에 자기들의 향기로운 향내를 두었으며, 그곳에서 자기들의 전제물을 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 내 손을 들어 그들에게 주겠다고 한 땅’입니다. ‘손을 들다’는 맹세를 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘모든 무성한/우거진 나무’입니다. 전통적 성경 표현인 ‘푸른 나무’와 의미가 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 예물의 격분’입니다. 그들의 예물이 하나님께 격분을 일으키는 도발이었다는 뜻을 담은 압축된 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  english_pob_choice: So I brought them
  chosen_korean: 내가 그들을 그 땅으로 데려갔습니다
  alternatives_korean:
  - 내가 그들을 인도했습니다
  - 내가 그들을 데리고 들어갔습니다
  lexicon: HALOT
  rationale: 히필형의 ‘데려오다/인도하다’ 의미를 살리되, 문맥상 목적지는 이미 언급된 약속의 땅이므로 ‘그 땅으로’로 자연스럽게 풀었습니다.
- source_word: נָשָׂאתִי אֶת־יָדִי
  english_pob_choice: I had lifted up my hand
  chosen_korean: 내가 내 손을 들어 그들에게 주기로 맹세한
  alternatives_korean:
  - 내가 내 손을 들어 그들에게 주겠다고
  - 내가 그들에게 주기로 맹세한
  lexicon: HALOT
  rationale: 직역적 표지는 ‘손을 들어’이고, 관용적 의미는 맹세입니다. 본문에 담긴 맹세의 이미지를 유지하면서 한국어에서는 뜻이 분명해지도록 결합했습니다.
- source_word: כָל גִּבְעָה רָמָה וְכָל עֵץ עָבֹת
  english_pob_choice: every high hill and every leafy tree
  chosen_korean: 모든 높은 언덕과 모든 무성한 나무
  alternatives_korean:
  - 모든 높은 산등성이와 모든 잎이 무성한 나무
  - 모든 높은 산과 모든 푸른 나무
  lexicon: HALOT
  rationale: 히브리어의 구체적 자연 이미지를 살리되, ‘high hill’과 ‘leafy/tree of density’의 우상 숭배 장소라는 뉘앙스를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: כַּעַס קָרְבָּנָם
  english_pob_choice: the provocation of their offering
  chosen_korean: 자기들의 예물의 분노
  alternatives_korean:
  - 자기들의 예물의 격노
  - 자기들의 예물의 도발
  lexicon: HALOT
  rationale: כעס는 ‘분노/격노’이면서 동시에 하나님을 격동시키는 ‘도발’의 효과를 갖습니다. 영어 POB의 긴장을 따라 직역적 구조를 유지해 독자에게 불편함을 그대로 드러냈습니다.
- source_word: רֵיחַ נִיחוֹחֵיהֶם
  english_pob_choice: their pleasing aromas
  chosen_korean: 자기들의 향기로운 향
  alternatives_korean:
  - 자기들의 기쁜 향기
  - 자기들의 향기로운 향내
  lexicon: HALOT
  rationale: 제사 공식어 ‘향기로운 향’을 살리면서, 복수 소유격을 반영해 ‘자기들의’로 옮겼습니다.
- source_word: נִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 자기들의 전제물
  alternatives_korean:
  - 자기들의 술제물
  - 자기들의 부어드린 제물
  lexicon: HALOT
  rationale: 제의적 ‘붓는 제물’의 의미를 표준적으로 드러내는 표현을 택했습니다. 전통적 교회어보다 מקור어의 제의성을 유지하는 쪽을 우선했습니다.
theological_decisions:
- issue: ‘כַּעַס קָרְבָּנָם’의 표현 방식
  chosen_reading: ‘예물의 분노’로 직역적 긴장을 유지했습니다.
  alternative_readings:
  - ‘도발적인 예물’
  - ‘나를 격분하게 하는 예물’
  rationale: 본문은 제물 자체가 하나님께 분노를 일으키는 도발이라는 충격을 강조합니다. 명시적 목적어를 덧붙여 매끈하게 만들기보다, 원문의 압축성과 신학적 불쾌감을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘נָשָׂאתִי אֶת־יָדִי’의 관용구 처리
  chosen_reading: ‘손을 들어 … 맹세한’으로 직역과 해석을 함께 살렸습니다.
  alternative_readings:
  - ‘주기로 맹세한’
  - ‘손을 들어 약속한’
  rationale: 하나님의 언약적 맹세를 단순한 약속으로 약화시키지 않되, 한국어 독자가 의도를 바로 이해하도록 맹세 의미를 병기했습니다.
  doctrine_reference: Translation philosophy §1, §3
