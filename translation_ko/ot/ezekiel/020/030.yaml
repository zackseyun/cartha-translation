  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
  footnotes:
  - marker: a
    text: Or 'Are you becoming unclean in the way of your fathers, and prostituting yourselves after their abominations?'
    reason: lexical_alternative
  - marker: b
    text: '''Detestable things'' can also be rendered ''abominations'' or, in context, ''idols.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 집에 말하라. 주 야훼께서 이렇게 말씀하십니다. 「너희가 조상들의 길에서 스스로를 더럽히고 있지 않느냐? 또 그들의 가증한 것들을 따라 음행하고 있지 않느냐?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들의 길에서 스스로 부정하게 되어 가고 있지 않느냐, 그리고 그들의 가증한 것들을 따라 음행하고 있지 않느냐?’
    reason: lexical_alternative
  - marker: b
    text: ‘가증한 것들’은 문맥에 따라 ‘가증물’ 또는 ‘우상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
