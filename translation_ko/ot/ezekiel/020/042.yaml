review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Yahweh, Israel's land, and the oath-related hand-raising idiom. However, its main text renders the idiom both literally ('손을 들어') and interpretively ('맹세한'), whereas the source and English audit trail retain the literal idiom in the main text and reserve the oath sense for a note. The phrase '손을 들어 ... 주겠다고 맹세한' also changes the Hebrew construction, which states that Yahweh lifted up his hand to give the land.
  naturalness: The draft is generally readable, but it mixes '여러분' with '당신들의' for the same audience, creating an avoidable shift in address. A single consistent plural address is more natural in modern formal-polite Korean. Reordering the temporal clause also produces a smoother Korean sentence while retaining the source's temporal/result relationship.
  terminology: ‘야훼’ is appropriate for יהוה under the project convention. ‘이스라엘 땅’ is natural and accurate. ‘여러분의 조상들’ accurately conveys ‘your fathers’ in idiomatic Korean without introducing a gender-exclusive implication not naturally carried by Korean ‘조상’.
  issues:
  - severity: medium
    issue: The main text adds ‘맹세한’ to the literal hand-raising idiom.
    rationale: The Hebrew says literally that Yahweh ‘lifted up [his] hand’ to give the land. Although this is an oath idiom, the stated translation approach retains that image in the text and explains its force in a footnote. Adding ‘맹세한’ in the main text collapses the intended literal/footnote distinction.
  - severity: low
    issue: 'The second-person plural forms are inconsistent: ‘여러분’ and ‘당신들의.’'
    rationale: Both refer to the same addressees. Consistently using ‘여러분’ and ‘여러분의’ is more natural and avoids a register shift.
  - severity: low
    issue: The footnote anchor is placed at the sentence end rather than directly at the hand-raising expression.
    rationale: Anchoring the note to ‘손을 든’ makes clear that the note explains the Hebrew oath idiom rather than the whole clause.
  revised_text: 내가 여러분을 이스라엘 땅, 곧 내가 여러분의 조상들에게 주려고 손을 든[a] 그 땅으로 데려갈 때에, 여러분은 내가 야훼인 줄 알게 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어를 직역하면 “내가 여러분의 조상들에게 그것을 주려고 손을 든 땅”입니다. ‘손을 들다’는 맹세 행위를 가리키는 히브리어 관용구이며, 더 자연스럽게는 “여러분의 조상들에게 주겠다고 맹세한 땅”이라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew image of raising the hand in the main text, places the oath interpretation solely in the footnote, and uses a consistent modern formal plural address. It also preserves the temporal setting of recognition—when Yahweh brings the people into Israel's land—and the repeated ‘land’ structure of the source.
