base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “the land that I swore to give to your fathers.” The Hebrew reads literally, “the land that I lifted up my hand to give to your fathers,” an oath gesture.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분을 이스라엘 땅, 곧 내가 여러분의 조상들에게 주려고 손을 든[a] 그 땅으로 데려갈 때에, 여러분은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “내가 여러분의 조상들에게 그것을 주려고 손을 든 땅”입니다. ‘손을 들다’는 맹세 행위를 가리키는 히브리어 관용구이며, 더 자연스럽게는 “여러분의 조상들에게 주겠다고 맹세한 땅”이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그러면 내가 야훼인 줄 알게 될 것입니다
  alternatives_korean:
  - 그리고 너희는 알게 될 것입니다
  - 그때 너희는 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언문맥의 결과 진술을 한국어로 자연스럽게 풀어, 심판/회복 행위 뒤에 오는 인식의 완결을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: נָשָׂאתִי אֶת־יָדִי
  english_pob_choice: I lifted up my hand
  chosen_korean: 손을 들어
  alternatives_korean:
  - 내가 맹세한
  - 손을 들어 맹세한
  lexicon: HALOT
  rationale: 히브리어의 맹세 관용구를 본문에서는 이미지대로 살리고, 뒤의 문맥으로 맹세 의미가 드러나도록 했습니다.
- source_word: לַאֲבוֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 당신들의 조상들에게
  alternatives_korean:
  - 너희 조상들에게
  - 조상들에게
  lexicon: HALOT
  rationale: 히브리어의 직역성을 유지하되, 현대 한국어에서 자연스럽게 읽히도록 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 맹세 관용구의 처리
  chosen_reading: ‘손을 들어’라는 직역 이미지를 본문에 유지했습니다.
  alternative_readings:
  - ‘맹세한’으로 의미역 번역
  - ‘손을 들어 맹세한’으로 절충 번역
  rationale: 하나님의 약속과 언약적 신실성을 지시하는 히브리어 표현을 삭제하지 않고, 본문 자체에서 고대 맹세 행위를 보이게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
