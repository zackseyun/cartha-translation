revisions:
- from: 그러면 내가 야훼인 줄 알게 될 것입니다. 내가 여러분을 이스라엘의 땅으로, 곧 내가 손을 들어 당신들의 조상들에게 주겠다고 맹세한 그 땅으로 데려갈 때 말입니다.[a]
  to: 내가 여러분을 이스라엘 땅, 곧 내가 여러분의 조상들에게 주려고 손을 든[a] 그 땅으로 데려갈 때에, 여러분은 내가 야훼인 줄 알게 될 것입니다.
  rationale: The revision retains the Hebrew image of raising the hand in the main text, places the oath interpretation solely in the footnote, and uses a consistent modern formal plural address. It also preserves the temporal setting of recognition—when Yahweh brings the people into Israel's land—and the repeated ‘land’ structure of the source.
  reviewer_model: gpt-5.6-terra
