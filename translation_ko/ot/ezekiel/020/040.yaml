  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
  footnotes:
  - marker: a
    text: Or 'your offerings' for 'your contributions'; the Hebrew term refers to portions set apart and presented to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'the first of your offerings' for 'the firstfruits of your gifts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with all your sacred offerings' for 'with all your holy things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 거룩한 산, 곧 이스라엘의 높은 산에서 — 주 야훼의 말씀입니다 — 거기서 이스라엘 온 집안, 곧 그들 모두가 그 땅에서 나를 섬길 것입니다. 거기서 내가 그들을 받아들일 것이며, 거기서 내가 너희의 예물과 너희의 첫 열매를, 그리고 너희의 모든 거룩한 것들을 요구할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’은 תְּרוּמֹתֵיכֶם처럼 하나님께 드리도록 구별된 헌납물을 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘첫 열매’는 רֵאשִׁית מַשְׂאוֹתֵיכֶם의 문자적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거룩한 것들’은 קָדְשֵׁיכֶם의 넓은 의미를 따른 번역으로, 특정 제물로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְהַר קָדְשִׁי / בְהַר מְרוֹם יִשְׂרָאֵל
  english_pob_choice: on my holy mountain / on the high mountain of Israel
  chosen_korean: 내 거룩한 산, 곧 이스라엘의 높은 산
  alternatives_korean:
  - 내 거룩한 산에서
  - 이스라엘의 높은 산 위에서
  - 내 거룩한 산, 이스라엘의 높은 산
  lexicon: HALOT
  rationale: בְ+산은 장소를 가리키므로 ‘~에서’가 자연스럽고, 평행구를 살리기 위해 ‘거룩한 산’과 ‘높은 산’을 모두 유지했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님의 말씀입니다
  - 주 여호와의 말씀입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선포 공식은 한국어에서 ‘말씀입니다’가 가장 직접적이며, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: יַעַבְדֻנִי
  english_pob_choice: will serve me
  chosen_korean: 나를 섬길 것입니다
  alternatives_korean:
  - 나를 섬기겠습니다
  - 나를 예배할 것입니다
  - 나에게 봉사할 것입니다
  lexicon: HALOT
  rationale: עבד는 여기서 제의적·언약적 ‘섬김’의 뜻이 강하므로, 예배로 좁히지 않고 ‘섬길 것입니다’로 보존했습니다.
- source_word: אֶרְצֵם
  english_pob_choice: I will accept them
  chosen_korean: 내가 그들을 받아들일 것이며
  alternatives_korean:
  - 내가 그들을 기쁘게 받을 것이며
  - 내가 그들을 받아주실 것이며
  - 내가 그들을 기꺼이 받을 것이며
  lexicon: HALOT
  rationale: 제사와 관계 맥락에서 רצה는 ‘호의적으로 받아들이다’의 뜻이므로, 현대 한국어로는 ‘받아들이다’가 가장 간결합니다.
- source_word: תְּרוּמֹתֵיכֶם / רֵאשִׁית מַשְׂאוֹתֵיכֶם
  english_pob_choice: your contributions / the firstfruits of your offerings
  chosen_korean: 너희의 예물과 너희의 첫 열매
  alternatives_korean:
  - 너희의 헌물과 너희의 첫 소출
  - 너희의 거제물과 너희의 첫 열매
  - 너희의 헌물과 너희의 첫 봉헌물
  lexicon: HALOT
  rationale: תְּרוּמָה와 רֵאשִׁית는 제의적 헌납을 가리키므로, 본문 흐름상 이해하기 쉬운 ‘예물’과 ‘첫 열매’로 옮기되 제물의 성격을 유지했습니다.
- source_word: בְּכָל קָדְשֵׁיכֶם
  english_pob_choice: with all your holy things
  chosen_korean: 너희의 모든 거룩한 것들
  alternatives_korean:
  - 너희의 모든 성물과 함께
  - 너희의 모든 거룩한 예물들과 함께
  - 너희의 모든 성별된 것들과 함께
  lexicon: HALOT
  rationale: קָדְשֵׁיכֶם은 범위가 넓어 특정 제물 종류로 좁히지 않고, 한국어에서도 넓은 총칭인 ‘거룩한 것들’로 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 ‘주 야훼’ 공식의 처리
  chosen_reading: 예언자적 공식은 ‘주 야훼의 말씀입니다’로 옮겨, אֲדֹנָי와 יְהוָה의 이중 호칭을 모두 드러냈습니다.
  alternative_readings:
  - 주 하나님의 말씀입니다
  - 주 여호와의 말씀입니다
  rationale: 본문은 ‘주’(아도나이)와 언약명 ‘야훼’를 함께 쓰므로, 둘을 합쳐 ‘주 야훼’로 표기하는 것이 원문 구분을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
