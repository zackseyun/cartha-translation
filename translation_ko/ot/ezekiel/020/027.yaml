base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
  footnotes:
  - marker: a
    text: Or “reviled me” or “treated me with contempt.”
    reason: lexical_alternative
  - marker: b
    text: Or “by their unfaithfulness against me” or “by committing a breach of faith against me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 사람의 아들아, 이스라엘 집에게 말하고 그들에게 이렇게 전하십시오. “주 야훼께서 이렇게 말씀하십니다. 이 일에서도 너희 조상들은 나를 모독하였고, 나를 배신하여 신의를 저버렸습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 집’은 이스라엘 전체를 가리키는 원문의 집합적 언약 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘나를 배신하여 신의를 저버렸습니다’는 히브리어 מעל의 동족어 반복이 강조하는 하나님께 대한 배신과 불신실함을 옮긴 것입니다.
    reason: lexical_alternative
