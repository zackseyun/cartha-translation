base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
  footnotes:
  - marker: a
    text: Or “reviled me” or “treated me with contempt.”
    reason: lexical_alternative
  - marker: b
    text: Or “by their unfaithfulness against me” or “by committing a breach of faith against me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너 사람의 아들아, 이스라엘 집에게 말하여 그들에게 전하십시오. “주 야훼께서 이렇게 말씀하십니다. 이 일로도 너희 조상들은 나를 모독하였고, 나를 배반하여 신의를 저버렸습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 집’은 원문의 집합적 언약 표현을 살린 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘배반하여 신의를 저버리다’는 히브리어 מעל의 반복과 배신·불신실함의 의미를 함께 드러냅니다.
    reason: lexical_alternative
