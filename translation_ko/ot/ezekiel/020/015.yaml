revisions:
- from: 그러나 나도 광야에서 그들에게 내 손을 들어 맹세하여, 내가 그들을 내가 그들에게 준 땅 곧 젖과 꿀이 흐르는 그 땅, 모든 땅의 영광인 그곳으로 데려가지 않겠다고 하였습니다.
  to: 그러나 나도 광야에서 그들에게 손을 들어 맹세하여, 내가 그들을 내가 그들에게 준 땅, 곧 젖과 꿀이 흐르고 모든 땅 가운데 가장 아름다운 땅으로 데려가지 않겠다고 하였습니다.
  rationale: 히브리어의 맹세 관용구와 ‘그들에게 준’이라는 수여 관계는 유지하되, 마지막 동격·수식 구조를 정리했습니다. ‘모든 땅 가운데 가장 아름다운 땅’은 צְבִי הִיא לְכָל הָאֲרָצוֹת가 나타내는 그 땅의 탁월함을 자연스러운 현대 한국어로 전달합니다.
