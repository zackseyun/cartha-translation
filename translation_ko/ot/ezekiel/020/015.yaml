  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
  footnotes:
  - marker: a
    text: Or 'lifted up my hand'; the phrase is an oath idiom and may be rendered more interpretively as 'swore.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the beauty' or 'the splendor of all lands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나도 광야에서 그들에게 내 손을 들어 맹세하여, 내가 그들을 내가 그들에게 준 땅 곧 젖과 꿀이 흐르는 그 땅, 모든 땅의 영광인 그곳으로 데려가지 않겠다고 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: Yet I myself also
  chosen_korean: 그러나 나도
  alternatives_korean:
  - 그리고 나도
  - 또한 나도
  lexicon: HALOT
  rationale: 앞 문맥에 대한 역접과 덧붙임을 함께 살려 ‘그러나’와 ‘나도’로 옮겼습니다. ‘나도’가 גַּם의 추가 의미를 자연스럽게 담습니다.
- source_word: נָשָׂאתִי יָדִי
  english_pob_choice: raised my hand
  chosen_korean: 내 손을 들어 맹세하여
  alternatives_korean:
  - 내 손을 들어
  - 손을 들어 맹세하여
  - 맹세하여
  lexicon: HALOT
  rationale: 직역상의 ‘손을 들다’라는 몸짓을 유지하되, 문맥상 맹세 관용구임을 한국어 본문에서 분명히 드러내기 위해 ‘맹세하여’를 덧붙였습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 광야 가운데서
  - 사막에서
  lexicon: HALOT
  rationale: 성경적 배경에 맞는 표준어로 ‘광야’를 선택했습니다. ‘사막’보다 지형을 좁게 오해할 가능성이 적습니다.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: the land that I had given them, flowing with milk and honey
  chosen_korean: 내가 그들에게 준 땅 곧 젖과 꿀이 흐르는 그 땅
  alternatives_korean:
  - 내가 그들에게 준 젖과 꿀이 흐르는 땅
  - 내가 준 땅, 젖과 꿀이 흐르는 땅
  lexicon: HALOT
  rationale: ‘그들에게’는 히브리어의 목적어를 반영해 보완했고, ‘젖과 꿀이 흐르는’은 관용구를 그대로 살렸습니다.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  english_pob_choice: the glory of all lands
  chosen_korean: 모든 땅의 영광인
  alternatives_korean:
  - 모든 땅의 아름다움인
  - 모든 땅의 찬란함인
  - 모든 땅 가운데 영광인
  lexicon: HALOT
  rationale: צְבִי의 의미 범위를 ‘영광’으로 옮겨, 높은 격조와 우월성을 유지했습니다. POB의 ‘glory’ 선택을 한국어에서도 그대로 반영했습니다.
theological_decisions:
- issue: 맹세 관용구를 본문에서 얼마나 드러낼지
  chosen_reading: ‘내 손을 들어 맹세하여’로 옮겨, 몸짓과 맹세의 의미를 함께 보이게 했습니다.
  alternative_readings:
  - ‘내 손을 들었다’로 직역
  - ‘맹세했다’로만 의역
  rationale: 히브리어 관용구의 형식성을 지우지 않으면서, 한국어 독자가 실제 의미를 놓치지 않도록 균형을 잡았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘내가 그들에게 준 땅’의 시제 표현
  chosen_reading: 과거 완료가 아니라 단순 과거로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 내가 그들에게 이미 준 땅
  - 내가 그들에게 주었던 땅
  rationale: 히브리어의 시상은 문맥상 회고적 관계를 가지지만, 한국어에서는 과도한 시제 표지가 없어도 의미가 충분히 전달됩니다.
  doctrine_reference: Translation philosophy §1, §6
