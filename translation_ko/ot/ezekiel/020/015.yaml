  revised_text: 그러나 나도 광야에서 그들에게 손을 들어 맹세하여, 내가 그들을 내가 그들에게 준 땅, 곧 젖과 꿀이 흐르고 모든 땅 가운데 가장 아름다운 땅으로 데려가지 않겠다고 하였습니다.
