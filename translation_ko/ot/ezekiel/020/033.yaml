source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם לֹ֠א בְּ/יָ֨ד חֲזָקָ֜ה וּ/בִ/זְר֧וֹעַ נְטוּיָ֛ה וּ/בְ/חֵמָ֥ה שְׁפוּכָ֖ה אֶמְל֥וֹךְ עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
  footnotes:
  - marker: a
    text: Or 'I will rule over you' or 'I will be king over you.' The Hebrew verb carries royal force.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말입니다. 반드시 내가 강한 손과 뻗은 팔과 쏟아 부어진 진노로 너희의 왕으로 다스리겠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희를 다스리겠다’ 또는 ‘내가 너희 위에 왕으로 군림하겠다’. 히브리어 동사는 왕권의 의미를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있음을 두고 맹세합니다
  alternatives_korean:
  - 내가 살아 있습니다
  - 살아 있는 나를 두고 맹세합니다
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식이므로 단순 현재 진술보다 맹세적 기능이 드러나게 옮겼습니다.
- source_word: נְאֻ֖ם אֲדֹנָ֣י יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 선언입니다
  alternatives_korean:
  - 주 하나님 야훼의 선언입니다
  - 주 여호와의 선언입니다
  lexicon: HALOT
  rationale: נְאֻם의 예언자적 선언 공식을 살리고, YHWH는 본 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: בְּ/יָ֨ד חֲזָקָ֜ה וּ/בִ/זְר֧וֹעַ נְטוּיָ֛ה וּ/בְ/חֵמָ֥ה שְׁפוּכָ֖ה
  english_pob_choice: with a strong hand and an outstretched arm and with wrath poured out
  chosen_korean: 굳센 손과 뻗은 팔과 쏟아 부어진 진노로
  alternatives_korean:
  - 강한 손과 뻗은 팔과 쏟아진 진노로
  - 굳센 손과 펴신 팔과 쏟아 부은 분노로
  lexicon: HALOT
  rationale: 출애굽기적 관용구를 그대로 살리되, 한국어에서는 도구·수단을 나타내는 조사로 한 번 묶어 자연스럽게 만들었습니다.
- source_word: אֶמְל֥וֹךְ עֲלֵי/כֶֽם
  english_pob_choice: I will reign over you
  chosen_korean: 내가 너희를 다스리겠습니다
  alternatives_korean:
  - 내가 너희를 통치하겠습니다
  - 내가 너희 위에 왕으로 다스리겠습니다
  lexicon: HALOT
  rationale: מלך의 왕권적 의미를 살리되, 한국어에서는 ‘다스리다’가 가장 자연스럽게 통치·군림의 힘을 함께 전달합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 공적 번역 원칙에 따라 여호와 대신 야훼를 사용해 언약 이름의 식별성을 유지했습니다.
  doctrine_reference: 'Project default glossary: יהוה / YHWH → 야훼'
- issue: אֶמְלֹךְ의 왕권적 뉘앙스
  chosen_reading: 내가 너희를 다스리겠습니다
  alternative_readings:
  - 내가 너희를 통치하겠습니다
  - 내가 너희의 왕이 되겠습니다
  rationale: 문맥은 단순 행정적 통치가 아니라 야훼의 강권적 왕권 선포이므로, 한국어에서도 권위와 지배의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
