reference: Ezekiel 20:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/זְכַרְתֶּם שָׁ֗ם אֶת דַּרְכֵי/כֶם֙ וְ/אֵת֙ כָּל עֲלִיל֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר נִטְמֵאתֶ֖ם בָּ֑/ם וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם בְּ/כָל רָעוֹתֵי/כֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
  footnotes:
  - marker: a
    text: Or 'you will feel disgust with yourselves' / 'you will be sickened by yourselves.' The Hebrew verb expresses strong self-abhorrence.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in your faces'; the sense is 'in your own sight' or 'in your own eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 너희는 너희의 길들과 너희가 스스로를 더럽힌 모든 행위를 기억하고[a][b], 너희가 행한 모든 악한 일들로 말미암아 너희 자신을 너희 눈앞에서 혐오하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘혐오하게 될 것입니다’는 히브리어 동사의 강한 자기혐오, 곧 ‘스스로에게 역겨움을 느끼다’는 뜻까지 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 얼굴 앞에서’이므로, 뜻은 ‘너희 눈에 비추어’ 또는 ‘너희 자신의 시각에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  english_pob_choice: you will remember
  chosen_korean: 너희는 … 기억하고
  alternatives_korean:
  - 너희는 … 떠올리고
  - 너희는 … 상기하고
  lexicon: HALOT
  rationale: 예언문맥에서 미래적 의미로 쓰인 זכר를 자연스러운 현대 한국어로 옮기되, 단순한 ‘기억하다’의 의미를 유지했습니다.
- source_word: דַּרְכֵיכֶם
  english_pob_choice: your ways
  chosen_korean: 너희의 길들
  alternatives_korean:
  - 너희의 행실들
  - 너희의 삶의 방식들
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 도덕 의미를 살려 ‘길들’로 옮겼고, 반복적 행위를 가리키는 복수형도 반영했습니다.
- source_word: עֲלִילוֹתֵיכֶם
  english_pob_choice: your deeds
  chosen_korean: 너희가 스스로를 더럽힌 모든 행위
  alternatives_korean:
  - 너희의 모든 행위
  - 너희의 모든 소행
  lexicon: HALOT
  rationale: 단순한 ‘행동’이 아니라 본문이 지적하는 더럽힘의 결과를 드러내도록, 바로 뒤의 수식절과 결합해 구체화했습니다.
- source_word: וּנְקֹטֹתֶם
  english_pob_choice: you will loathe
  chosen_korean: 너희 자신을 … 혐오하게 될 것입니다
  alternatives_korean:
  - 너희 자신을 … 싫어하게 될 것입니다
  - 너희 자신을 … 역겨워하게 될 것입니다
  lexicon: HALOT
  rationale: קוט의 강한 자기혐오·혐오감을 한국어의 ‘혐오하다’로 옮겨, 단순한 후회보다 강한 정서적·도덕적 반응을 살렸습니다.
- source_word: בִּפְנֵיכֶם
  english_pob_choice: in your own sight
  chosen_korean: 너희 눈앞에서
  alternatives_korean:
  - 너희 눈에 비추어
  - 너희 자신을 보는 눈으로
  lexicon: HALOT
  rationale: 직역하면 ‘너희 얼굴 앞에서’이므로, POB의 관찰대로 자기평가의 관용구를 한국어의 ‘눈앞에서’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 회개 반응의 강도
  chosen_reading: 이 절은 단순한 후회가 아니라 과거의 죄를 기억한 뒤 자기혐오에 이르는 강한 회개 반응을 말합니다.
  alternative_readings:
  - 단순히 부끄러워하거나 유감스러워하는 정도로 읽을 수 있습니다.
  rationale: קוט와 ‘더럽혔다’는 표현이 결합되어 있어, 본문의 정서적 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §3
