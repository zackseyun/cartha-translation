  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
  footnotes:
  - marker: a
    text: Or 'the nations' for 'the peoples.'
    reason: lexical_alternative
  - marker: b
    text: Traditional biblical wording often has 'with a mighty hand and an outstretched arm.'
    reason: cross_reference
  - marker: c
    text: Or 'with fury poured out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 민족들[a] 가운데서 끌어내고, 너희가 흩어져 있는 땅들 가운데서 모으겠습니다. 강한 손과 뻗은 팔[b]과 쏟아진 진노[c]로 그렇게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성들’.
    reason: lexical_alternative
  - marker: b
    text: 전통적인 성경 번역에서는 ‘능한 손과 편 팔’ 또는 이와 유사하게 옮깁니다. 이는 출애굽을 연상시키는 관용구입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘격노’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  english_pob_choice: I will bring you out
  chosen_korean: 나는 너희를 … 끌어내고
  alternatives_korean:
  - 나는 너희를 … 데리고 나오고
  - 나는 너희를 … 이끌어내고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 단순 이동보다 ‘끌어내다’가 구출·석방의 뉘앙스를 더 직접적으로 드러냅니다.
- source_word: הָעַמִּים
  english_pob_choice: the peoples
  chosen_korean: 여러 민족들
  alternatives_korean:
  - 여러 백성들
  - 민족들
  lexicon: HALOT
  rationale: 복수형 עַמִּים의 집합적 대상을 살리면서, 한국어에서 자연스럽고 분산된 이방 집단을 잘 드러내는 표현으로 옮겼습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 굳센 손
  alternatives_korean:
  - 강한 손
  - 능한 손
  lexicon: HALOT
  rationale: 직역에 가깝게 손의 비유를 유지하되, 출애굽 어구의 힘을 살리는 한국어로 ‘굳센 손’을 택했습니다.
- source_word: וּבִזְרֹעַ נְטוּיָה
  english_pob_choice: and an outstretched arm
  chosen_korean: 편 팔
  alternatives_korean:
  - 뻗은 팔
  - 내민 팔
  lexicon: HALOT
  rationale: 히브리어의 고정된 출애굽 표현을 한국어 성경에서 익숙한 대응으로 살리면서도, 앞의 ‘굳센 손’과 병행성을 유지했습니다.
- source_word: וּבְחֵמָה שְׁפוּכָה
  english_pob_choice: and with wrath poured out
  chosen_korean: 부어진 진노
  alternatives_korean:
  - 쏟아부어진 진노
  - 쏟아진 분노
  lexicon: HALOT
  rationale: שְׁפוּכָה의 ‘부어지다/쏟아지다’를 반영해, 심판적 감정을 약화하지 않고 예언서의 거친 이미지를 보존했습니다.
theological_decisions:
- issue: 출애굽적 구원 공식과 진노의 병치
  chosen_reading: ‘굳센 손과 편 팔’이라는 출애굽 언어를 유지하면서도 ‘부어진 진노’를 그대로 살려, 회복과 심판의 긴장을 해소하지 않았습니다.
  alternative_readings:
  - 단순히 ‘구해내겠다’로 완화하기
  - 진노 요소를 생략하고 회복만 강조하기
  rationale: 에스겔 20장은 언약 소송과 심판의 문맥 안에서 회복을 말하므로, 본문의 구원·심판 이중성을 모두 드러내는 번역이 필요합니다.
  doctrine_reference: 번역 원칙 §3 — 신학적 긴장을 보존하고 해소하지 않기
