  source_fidelity: 핵심 의미와 출애굽 어법 및 심판의 요소는 대체로 보존되었습니다. 다만 원문의 정관 복수 표현에 없는 ‘여러’를 반복해 첨가했고, 문장 끝의 ‘그렇게 하겠습니다’는 원문에 없는 지시적 요약을 덧붙입니다. 또한 נְפוֹצֹתֶם은 현재의 분산 상태를 나타낼 수 있으므로 ‘흩어져 있는’으로 옮겨 그 형태의 뉘앙스를 보존하는 것이 안전합니다.
  naturalness: ‘굳센 손과 편 팔’은 이해 가능하나 현대 표준어 합쇼체 성경 문장에서는 ‘강한 손과 뻗은 팔’이 더 자연스럽고 뜻이 분명합니다. 각주 표지도 해당 어구 바로 뒤에 두어 독자가 참조 대상을 즉시 알 수 있게 해야 합니다.
  terminology: עַמִּים은 ‘민족들’로 적절하며 ‘백성들’은 각주 대안으로 처리할 수 있습니다. חֵמָה שְׁפוּכָה는 심판적 이미지를 유지하는 ‘쏟아진 진노’로 옮겼습니다. ‘강한 손과 뻗은 팔’은 출애굽 전승의 관용적 언어를 충실히 보존합니다.
