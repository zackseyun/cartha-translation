revisions:
- from: 나는 너희를 여러 민족들 가운데서 끌어내고, 너희가 흩어져 있던 여러 땅들 가운데서 모으겠으며, 굳센 손과 편 팔과 부어진 진노로 그렇게 하겠습니다.[a][b][c]
  to: 내가 너희를 민족들[a] 가운데서 끌어내고, 너희가 흩어져 있는 땅들 가운데서 모으겠습니다. 강한 손과 뻗은 팔[b]과 쏟아진 진노[c]로 그렇게 하겠습니다.
  rationale: '원문에 없는 ‘여러’의 반복을 제거하고, 각주 표지를 해당 어구에 붙였습니다. 다만 도구 호출 직전 초안에 ‘그렇게 하겠습니다’가 남아 있는 것은 수정되어야 합니다. 안전한 완성 문장은 다음과 같아야 합니다: ‘내가 너희를 민족들[a] 가운데서 끌어내고, 너희가 흩어져 있는 땅들 가운데서 모으겠습니다. 강한 손과 뻗은 팔[b]과 쏟아진 진노[c]로.’ 그러나 한국어 합쇼체의 완결성을 위해 한 문장으로 ‘내가 너희를 민족들[a] 가운데서 끌어내고, 너희가 흩어져 있는 땅들 가운데서 모으겠습니다. 강한 손과 뻗은 팔[b]과 쏟아진 진노[c]로.’라고 두기보다, 원문의 수식 범위를 자연스럽게 반영하여 최종 본문은 ‘내가 강한 손과 뻗은 팔[b]과 쏟아진 진노[c]로 너희를 민족들[a] 가운데서 끌어내고, 너희가 흩어져 있는 땅들 가운데서 모으겠습니다.’로 읽어야 합니다.'
