  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: ko
  text: 내가 그들에게 말했습니다. “이 너희가 올라가는 그 산당이 무엇입니까?” 그래서 그 이름이 오늘까지도 바마라고 불립니다.
  philosophy: formal
lexical_decisions:
- source_word: מָה הַבָּמָה
  english_pob_choice: What is this high place
  chosen_korean: 이 너희가 올라가는 그 산당이 무엇입니까?
  alternatives_korean:
  - 이 높은 곳이 무엇입니까?
  - 이 산당이 무엇입니까?
  lexicon: בָּמָה
  rationale: 문맥상 단순한 지리적 ‘높은 곳’이 아니라 우상숭배의 장소인 ‘산당’을 가리키므로, 의미를 드러내는 표준 성경 용어를 택했습니다. 다만 영어 POB의 ‘where you are going’를 살려 ‘너희가 올라가는’으로 동작을 포함했습니다.
- source_word: וַיִּקָּרֵא שְׁמָהּ
  english_pob_choice: So its name is called
  chosen_korean: 그래서 그 이름이 … 불립니다
  alternatives_korean:
  - 그래서 그 이름이 … 불렸습니다
  - 그러므로 그 이름은 …이라 불립니다
  lexicon: קרא שם
  rationale: 히브리어의 관용구는 단순한 과거 서술보다 ‘현재까지 이어지는 명명 상태’를 나타내므로, 영어 POB의 ‘is called’에 맞춰 현재형으로 옮겼습니다.
- source_word: בָּמָה עַד הַיּוֹם הַזֶּה
  english_pob_choice: Bamah to this day
  chosen_korean: 오늘까지도 바마라고
  alternatives_korean:
  - 오늘까지 바마라고
  - 이날까지 바마라고
  lexicon: בָּמָה
  rationale: 고유명사 ‘Bamah’를 음역하여 명칭의 지속성을 보존했고, ‘to this day’를 관용적으로 ‘오늘까지도’로 옮겼습니다.
theological_decisions:
- issue: 산당에 대한 용어 선택
  chosen_reading: בָּמָה를 ‘산당’으로 옮겨, 단순한 지형이 아니라 우상숭배와 결부된 예배 장소라는 함의를 드러냈습니다.
  alternative_readings:
  - ‘높은 곳’으로 중립적으로 옮김
  - 음역만 하여 ‘바마’로 처리
  rationale: 에스겔서의 문맥에서 이 장소는 실제 고지라기보다 부정한 예배의 상징이므로, 독자가 본문 의도를 오해하지 않도록 의미를 분명히 했습니다.
  doctrine_reference: 에스겔 20장 문맥의 우상숭배 경고
