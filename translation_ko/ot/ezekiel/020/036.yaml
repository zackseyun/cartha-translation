  text: כַּ/אֲשֶׁ֤ר נִשְׁפַּ֨טְתִּי֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/מִדְבַּ֖ר אֶ֣רֶץ מִצְרָ֑יִם כֵּ֚ן אִשָּׁפֵ֣ט אִתְּ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'I judged your fathers ... so I will judge you.' The Hebrew verb can be rendered more simply as 'judge,' but the wording 'enter into judgment' preserves the formal judicial nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 조상들을 이집트 땅 광야에서 심판한 것처럼, 너희도 내가 심판하겠다고 — 주 하나님이 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 너희 조상들을 심판한 것처럼… 내가 너희를 심판하겠다.’ 히브리어 동사는 더 단순하게 ‘심판하다’로 옮길 수 있지만, ‘심판에 들어가다’는 법정적 뉘앙스를 더 분명히 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: Just as
  chosen_korean: ~한 것처럼
  alternatives_korean:
  - ~처럼
  - 마치 ~하듯이
  lexicon: HALOT
  rationale: 과거와 미래의 대응 관계를 자연스러운 현대 한국어로 분명히 드러냅니다.
- source_word: נִשְׁפַּטְתִּי / אִשָּׁפֵט
  english_pob_choice: I entered into judgment / I will enter into judgment
  chosen_korean: 심판한 / 심판하겠다고
  alternatives_korean:
  - 판단한 / 판단하겠다고
  - 재판에 들어간 / 재판에 들어가겠다고
  lexicon: HALOT
  rationale: 법정적·언약소송적 뉘앙스는 살리되, 한국어에서는 '심판하다'가 가장 응축되고 이해 가능한 대응입니다.
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  english_pob_choice: in the wilderness of the land of Egypt
  chosen_korean: 이집트 땅 광야에서
  alternatives_korean:
  - 이집트 땅의 광야에서
  - 이집트 광야에서
  lexicon: HALOT
  rationale: ‘광야’와 ‘이집트 땅’의 두 요소를 보존하되, 한국어 어순에 맞게 간결하게 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님이
  lexicon: HALOT
  rationale: 합쇼체 종결과 함께 신적 칭호를 자연스럽게 살리기 위해 '주 하나님'을 사용했습니다. 본문 내에서는 직접적인 신명 표기를 반복하지 않고 선언 화자를 매끄럽게 전달합니다.
theological_decisions:
- issue: 예언적 선언문의 화자 표지와 종결 처리
  chosen_reading: 문장 끝을 ‘주 하나님이 선언하십니다’로 처리해 예언 공식의 권위를 드러냈습니다.
  alternative_readings:
  - ‘주 하나님이 말씀하십니다’
  - ‘주 하나님의 선언입니다’
  rationale: נְאֻם은 단순한 발화보다 공식적인 선언을 가리키므로, 현대 한국어에서는 ‘선언하십니다’가 그 격식을 가장 잘 살립니다.
  doctrine_reference: 예언자적 공식 נְאֻם의 번역 관행
- issue: ‘심판하다’의 반복 유지
  chosen_reading: 두 절 모두에서 같은 동사를 반복해 과거와 미래의 대응을 보존했습니다.
  alternative_readings:
  - 앞절만 ‘재판하다’로 바꾸기
  - 뒷절만 ‘판결하다’로 바꾸기
  rationale: 히브리어의 평행 구조와 언약적 심판의 연속성을 한국어에서도 분명히 보이게 합니다.
  doctrine_reference: 본문의 평행법과 언약 소송 문맥
