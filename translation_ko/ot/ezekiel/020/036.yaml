revisions:
- from: 내가 너희 조상들을 이집트 땅 광야에서 심판한 것처럼, 너희도 내가 심판하겠다고 — 주 하나님이 선언하십니다.[a]
  to: 내가 이집트 땅의 광야에서 너희 조상들을 심판한 것같이, 그와 같이 내가 너희와 심판을 벌이겠습니다. 주 야훼의 말씀입니다.[a]
  rationale: 문법적으로 잘못된 미래절을 원문의 비교·평행 구조에 맞추어 바로잡았습니다. ‘너희와 심판을 벌이겠습니다’는 אִתְּכֶם의 ‘with you’를 한국어에서 자연스럽게 살리면서도, 이 문맥의 적대적 사법 행위라는 뜻을 충분히 전달합니다. 예언 공식은 신명을 보존하여 ‘주 야훼의 말씀입니다’로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:44Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 비교 구조(‘…한 것같이/그와 같이’)와 과거·미래 심판의 평행은 보존되어야 합니다. 초안의 ‘너희도 내가 심판하겠다고’는 이중 주격과 인용 종결이 결합되어 문법적으로 성립하지 않으며, 미래 동사의 직접적인 신적 발화를 정확히 전달하지 못합니다. 또한 אִתְּכֶם의 ‘너희와’라는 사법적 대면의 뉘앙스를 본문 또는 각주에서 반영하는 것이 좋습니다.
  naturalness: ‘이집트 땅 광야’는 ‘이집트 땅의 광야’가 더 자연스럽습니다. ‘주 하나님이 선언하십니다’도 가능하지만, נְאֻם의 정형적 예언 공식은 ‘주 야훼의 말씀입니다’가 현대의 격식 있는 한국어에서 더 자연스럽고 간결합니다.
  terminology: יְהוִה는 제공된 신명 방침에 따라 ‘야훼’로 옮겨야 합니다. אֲדֹנָי יְהוִה는 ‘주 야훼’로 번역합니다. שׁפט의 기본 번역어는 ‘심판하다’로 유지하되, 각주에서 법정적 대면이라는 가능한 더 구체적 표현을 제시합니다.
