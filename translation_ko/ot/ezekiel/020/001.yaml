id: EZK.20.1
reference: Ezekiel 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
  footnotes:
  - marker: a
    text: Or 'some of the elders of Israel came.' The Hebrew reads more literally, 'men from the elders of Israel,' which may indicate representatives drawn from the elders.
    reason: lexical_alternative
  - marker: b
    text: '''To inquire of the LORD'' can also be rendered ''to seek the LORD'' or ''to consult the LORD''; here the sense is a formal seeking of divine guidance or response.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 해[a]의 다섯째 달, 그 달 열흘에 이스라엘의 장로들 가운데서 온 사람들이 야훼[b]께 문의하려고 왔습니다. 그들은 내 앞에 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 장로들 가운데서 온 사람들이 왔습니다’. 히브리어는 문자적으로 ‘이스라엘의 장로들 가운데서 온 사람들’이며, 장로 집단에서 나온 대표자들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼께 문의하다’는 여기서 ‘야훼를 찾다’ 또는 ‘야훼께 묻다’로도 옮길 수 있으며, 예언적 응답을 구하는 공식적 요청의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 일어났습니다
  - 그때
  lexicon: HALOT
  rationale: 새 장면을 여는 서술 연결어로 처리해, 히브리어 wayyiqtol의 서사 전개를 자연스럽게 살렸습니다.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  english_pob_choice: in the seventh year
  chosen_korean: 일곱째 해
  alternatives_korean:
  - 일곱째 해에
  - 일곱 번째 해
  lexicon: HALOT
  rationale: 본문이 직접 말하는 연대 표지를 과도하게 풀지 않고 간결하게 옮겼습니다.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  english_pob_choice: men from the elders of Israel came
  chosen_korean: 이스라엘의 장로들 가운데서 온 사람들
  alternatives_korean:
  - 이스라엘 장로들 가운데서 온 사람들
  - 이스라엘의 장로들 중 일부
  lexicon: HALOT
  rationale: 히브리어의 직역적 뉘앙스인 ‘장로들 가운데서 온 사람들’을 살리되, 한국어에서는 대표자들이 왔다는 의미가 드러나도록 자연화했습니다.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  english_pob_choice: to inquire of Yahweh
  chosen_korean: 야훼께 문의하려고
  alternatives_korean:
  - 야훼를 찾으려고
  - 야훼께 여쭈려고
  lexicon: HALOT
  rationale: דרש의 공적·예언적 ‘자문/문의’ 의미를 살려, 단순한 종교적 추구보다 구체적인 응답 청구의 성격을 드러냈습니다.
- source_word: וַיֵּשְׁבוּ לְפָנַי
  english_pob_choice: and they sat before me
  chosen_korean: 그들은 내 앞에 앉았습니다
  alternatives_korean:
  - 그들은 내 앞에 자리를 잡았습니다
  - 그들은 내 앞에 앉아 있었습니다
  lexicon: HALOT
  rationale: 예언자 앞에 공식적으로 나아와 앉는 장면을 직설적으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명표시를 호칭으로 바꾸지 않고 고유명사로 드러내는 프로젝트 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘문의하다’의 의미 범위
  chosen_reading: 예언적/공적 응답을 구하는 문의
  alternative_readings:
  - 단순히 찾아 구함
  - 종교적으로 상담함
  rationale: 이 표현은 개인적 탐색보다 공식적인 하나님의 말씀/판결을 요청하는 맥락이므로, 그 긴장을 한국어로 보존했습니다.
  doctrine_reference: Ezekiel 20:1 source semantics of דרש
