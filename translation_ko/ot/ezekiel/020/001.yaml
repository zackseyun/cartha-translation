- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  english_pob_choice: men from the elders of Israel came
  chosen_korean: 이스라엘의 장로들 가운데서 온 사람들
  alternatives_korean:
  - 이스라엘 장로들 가운데서 온 사람들
  - 이스라엘의 장로들 중 일부
  lexicon: HALOT
  rationale: 히브리어의 직역적 뉘앙스인 ‘장로들 가운데서 온 사람들’을 살리되, 한국어에서는 대표자들이 왔다는 의미가 드러나도록 자연화했습니다.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  english_pob_choice: to inquire of Yahweh
  chosen_korean: 야훼께 문의하려고
  alternatives_korean:
  - 야훼를 찾으려고
  - 야훼께 여쭈려고
  lexicon: HALOT
  rationale: דרש의 공적·예언적 ‘자문/문의’ 의미를 살려, 단순한 종교적 추구보다 구체적인 응답 청구의 성격을 드러냈습니다.
- source_word: וַיֵּשְׁבוּ לְפָנַי
  english_pob_choice: and they sat before me
  chosen_korean: 그들은 내 앞에 앉았습니다
  alternatives_korean:
  - 그들은 내 앞에 자리를 잡았습니다
  - 그들은 내 앞에 앉아 있었습니다
  lexicon: HALOT
  rationale: 예언자 앞에 공식적으로 나아와 앉는 장면을 직설적으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명표시를 호칭으로 바꾸지 않고 고유명사로 드러내는 프로젝트 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘문의하다’의 의미 범위
  chosen_reading: 예언적/공적 응답을 구하는 문의
  alternative_readings:
  - 단순히 찾아 구함
  - 종교적으로 상담함
  rationale: 이 표현은 개인적 탐색보다 공식적인 하나님의 말씀/판결을 요청하는 맥락이므로, 그 긴장을 한국어로 보존했습니다.
  doctrine_reference: Ezekiel 20:1 source semantics of דרש
