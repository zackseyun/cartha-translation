  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֗ם אִ֣ישׁ שִׁקּוּצֵ֤י עֵינָי/ו֙ הַשְׁלִ֔יכוּ וּ/בְ/גִלּוּלֵ֥י מִצְרַ֖יִם אַל תִּטַּמָּ֑אוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
  footnotes:
  - marker: a
    text: Hebrew 'the detestable things of his eyes,' an idiom for the abhorrent objects each man looks to or desires; likely idolatrous objects.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'idols' here is a strongly contemptuous word in Ezekiel; alternatively, 'filthy idols' or more literally 'dung-idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 그들에게 말했습니다. ‘너희는 각자 자기 눈앞의 가증한 것들을 버리고, 이집트의 우상들로 너희 자신을 더럽히지 마십시오. 나는 야훼, 너희 하나님입니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 눈의 가증한 것들’은 각 사람이 눈으로 바라보거나 욕망하는 혐오스러운 대상이라는 관용구입니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘우상’에 해당하는 히브리어는 에스겔에서 특히 경멸적인 표현입니다. 더 직역하면 ‘똥우상들’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: Each man
  chosen_korean: 각자
  alternatives_korean:
  - 각 사람
  - 모든 사람
  lexicon: HALOT
  rationale: 분배적 용법을 살려 각 개인에게 따로 명령이 내려진다는 점을 자연스러운 현대 한국어로 표현했습니다.
- source_word: שִׁקּוּצֵי עֵינָיו
  english_pob_choice: the detestable things before his eyes
  chosen_korean: 자기 눈앞의 가증한 것들
  alternatives_korean:
  - 자기 눈의 가증한 것들
  - 그가 바라보는 가증한 우상들
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘눈앞’으로 히브리어 관용구를 살리되, ‘가증한 것들’로 우상숭배의 혐오감을 유지했습니다.
- source_word: גִּלּוּלֵי מִצְרַיִם
  english_pob_choice: the idols of Egypt
  chosen_korean: 이집트의 우상들
  alternatives_korean:
  - 이집트의 더러운 우상들
  - 이집트의 똥우상들
  lexicon: HALOT
  rationale: 문맥상 멸시적 표현이지만 본문에는 핵심 의미인 ‘우상들’을 두고, 경멸적 뉘앙스는 문맥에서 드러나게 했습니다.
- source_word: אַל תִּטַּמָּאוּ
  english_pob_choice: do not defile yourselves
  chosen_korean: 너희 자신을 더럽히지 마십시오
  alternatives_korean:
  - 부정하게 되지 마십시오
  - 스스로를 더럽히지 마십시오
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 살려 ‘너희 자신을’로 옮겼고, 부정/더러움의 예식적·도덕적 의미를 함께 담았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 가이드라인에 따라 신명은 ‘야훼’로 옮겨, 호칭 대체 없이 고유 이름을 드러냈습니다.
theological_decisions:
- issue: ‘가증한 것들’과 ‘우상들’의 이중 표현
  chosen_reading: ‘눈앞의 가증한 것들’과 ‘이집트의 우상들’로 나누어, 도덕적 혐오와 우상숭배의 대상을 함께 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 ‘우상’으로 평준화하는 방식
  - ‘가증한 것들’을 단순한 ‘나쁜 것들’로 약화하는 방식
  rationale: 히브리어는 단순한 금지보다 강한 혐오와 정결의 문제를 말하므로, 본문의 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 6
