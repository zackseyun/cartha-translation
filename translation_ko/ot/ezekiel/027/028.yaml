source:
  edition: WLC
  text: לְ/ק֖וֹל זַעֲקַ֣ת חֹבְלָ֑יִ/ךְ יִרְעֲשׁ֖וּ מִגְרֹשֽׁוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/028.yaml
  text: At the sound of the cry of your pilots[b][a], the pasturelands will quake.
  footnotes:
  - marker: a
    text: Or 'your rowers' for 'your sailors'; the Hebrew term can refer more specifically to a ship's oarsmen or seamen.
    reason: lexical_alternative
  - marker: b
    text: Or 'the open lands' or 'the common lands'; older versions often have 'suburbs,' but the Hebrew refers to outlying land around a settlement rather than modern suburbs.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 선원들의 외침 소리에 들판이 흔들릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선원들’에 해당하는 히브리어는 배의 노꾼이나 조타수까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들판’은 히브리어가 가리키는 정착지 바깥의 열린 땅, 목초지, 주변 토지를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל
  english_pob_choice: At the sound of
  chosen_korean: …의 소리에
  alternatives_korean:
  - …의 소리를 따라
  - …의 소리가 들릴 때
  lexicon: HALOT
  rationale: לְקוֹל은 ‘소리/음성’이 들리는 상황을 나타내므로, 한국어에서는 자연스럽게 ‘…의 소리에’로 옮겨 원문의 상황성을 살렸습니다.
- source_word: זַעֲקַת
  english_pob_choice: the cry of
  chosen_korean: 외침
  alternatives_korean:
  - 부르짖음
  - 통곡
  lexicon: HALOT
  rationale: זעק은 distress의 의미가 있는 ‘외침, 부르짖음’입니다. 여기서는 문맥상 단순한 소리보다 격렬한 외침이므로 ‘외침’이 적절합니다.
- source_word: חֹבְלָיִךְ
  english_pob_choice: your sailors
  chosen_korean: 당신의 선원들
  alternatives_korean:
  - 당신의 노꾼들
  - 당신의 뱃사람들
  lexicon: HALOT
  rationale: 이 단어는 선박을 다루는 사람들을 가리키며, 이 문맥에서는 타르시스 상업 함선의 선원들로 이해하는 것이 자연스럽습니다. POB의 ‘your sailors’를 따라 현대 한국어로 분명하게 옮겼습니다.
- source_word: מִגְרֹשׁוֹת
  english_pob_choice: the pasturelands
  chosen_korean: 들판
  alternatives_korean:
  - 목초지
  - 열린 땅
  - 주변 들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 정착지 바깥의 열린 땅, 목초지 또는 주변 토지를 가리킬 수 있습니다. 현대 독자에게 ‘들판’이 가장 자연스럽고, ‘suburbs’처럼 오해를 부르는 표현을 피합니다.
theological_decisions:
- issue: 시가적 심판 선언에서 의인화된 지형의 반응
  chosen_reading: ‘들판이 흔들릴 것입니다’로 옮겨, 선원들의 통곡이 바깥 땅까지 뒤흔드는 과장을 살렸습니다.
  alternative_readings:
  - ‘목초지들이 떨 것입니다’
  - ‘주변 땅이 흔들릴 것입니다’
  rationale: 본문은 해상 재난의 소식이 육지의 외곽 지역에까지 미치는 충격을 시적으로 묘사합니다. 따라서 문자적이면서도 시적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 예언문학의 시적 과장과 의인화
