source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
  footnotes:
  - marker: a
    text: Or 'to many islands.' The Hebrew term can refer to islands or, more broadly, maritime coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다의 여러 어귀에 자리 잡고 많은 해안 지방[a]에 이르는 여러 민족과 거래하는 두로에게 말하십시오. 주 여호와께서 이처럼 말씀하십니다. “두로야, 네가 말했습니다. ‘나는 아름다움의 완성이다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 섬들’. 히브리어 용어는 섬을 가리킬 수도 있고, 더 넓게는 바다의 해안 지방들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
