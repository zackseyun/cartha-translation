- source_word: רֹכֶלֶת הָעַמִּים אֶל אִיִּים רַבִּים
  english_pob_choice: trader of the peoples to many coastlands
  chosen_korean: 많은 섬들에까지 백성들의 상인이 된
  alternatives_korean:
  - 많은 해안 지방들까지 백성들의 상인이 된
