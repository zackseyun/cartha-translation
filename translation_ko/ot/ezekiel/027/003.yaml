  source_fidelity: 원문의 여성 단수 분사들(‘거주하는’, ‘상인인’)은 두로를 수식합니다. 초안의 ‘상인이 된’은 완료·변화의 의미를 더하며, ‘많은 섬들에까지 백성들의 상인’은 히브리어의 상업 관계와 אִיִּים의 의미 범위를 한국어에서 부자연스럽고 다소 불명확하게 만듭니다. 기본문을 ‘해안 지방’으로 하고 해당 위치에 각주를 붙이면 원문의 폭을 더 충실히 보존합니다.
  naturalness: ‘바다의 여러 어귀에 자리 잡고 많은 해안 지방에 이르는 여러 민족과 거래하는’은 두로의 지리적 위치와 상업적 역할을 자연스러운 현대 한국어로 연결합니다. ‘아름다움의 완성’은 כְּלִילַת יֹפִי의 명사적·최상급적 자기 과시를 잘 재현합니다.
  terminology: ‘두로’와 ‘주 여호와’는 표준 한국어 성서 문맥에서 자연스럽고, 아도나이+YHWH라는 복합 칭호도 구별해 전달합니다. ‘해안 지방’에는 각주로 ‘섬들’ 가능성을 명시하여 אִיִּים의 지리적 모호성을 보존합니다.
