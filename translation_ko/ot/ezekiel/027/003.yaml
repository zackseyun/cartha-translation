- source_word: כְּלִילַת יֹפִי
  english_pob_choice: I am perfect in beauty
  chosen_korean: 나는 완전한 아름다움이다
  alternatives_korean:
  - 나는 아름다움의 완성이다
  - 나는 온전한 아름다움이다
  lexicon: HALOT
  rationale: 두로의 교만한 자기 선언을 직설적으로 살리기 위해 명사구의 강한 단정을 그대로 재현했습니다.
theological_decisions:
- issue: 두로의 자기 과시를 직접화된 인용으로 처리할지 여부
  chosen_reading: 직접화된 인용문으로 처리해 교만의 자기평가를 선명하게 드러냈습니다.
  alternative_readings:
  - 간접화하여 완곡하게 표현
  - '''나는 완전한 아름다움이다''를 더 문학적으로 의역'
  rationale: 본문은 두로의 자의식을 고발하는 예언적 인용이므로, 완곡하게 낮추지 않고 본문의 공격성을 유지하는 것이 적절합니다.
  doctrine_reference: 예언서 수사학과 심판 선언의 직접성
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - LORD
  rationale: 주어진 영어 POB의 'the Lord GOD' 관용을 한국어 전통 가독성에 맞춰 '주 여호와'로 재현했습니다.
  doctrine_reference: 번역 관행과 예언서 문맥의 호칭 유지
