  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
  footnotes:
  - marker: a
    text: Or 'to many islands.' The Hebrew term can refer to islands or, more broadly, maritime coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로에게 말하십시오. 바다의 어귀들에 거주하며 많은 섬들에까지 백성들의 상인이 된 두로여, 주 여호와께서 이처럼 말씀하십니다. “두로야, 네가 말하기를 ‘나는 완전한 아름다움이다’ 하였구나.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 섬들로’. 히브리어 용어는 섬을 가리킬 수도 있고, 더 넓게는 바다의 해안 지방들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לְצֹור
  english_pob_choice: and say to Tyre
  chosen_korean: 두로에게 말하십시오
  alternatives_korean:
  - 두로에게 말하여라
  - 두로에게 일러
  lexicon: HALOT
  rationale: 예언적 지시문이므로 자연스러운 명령형으로 옮기되, 격식 있는 현대 문체를 유지했습니다.
- source_word: היושבת עַל מְבוֹאֹת יָם
  english_pob_choice: who dwells at the entrances of the sea
  chosen_korean: 바다의 어귀들에 거주하며
  alternatives_korean:
  - 바다의 입구들에 거주하며
  - 바다의 관문들에 자리하며
  lexicon: HALOT
  rationale: מְבוֹאֹת의 핵심 의미인 '입구/어귀'를 살려, 두로의 해상 요충지를 구체적으로 드러냈습니다.
- source_word: רֹכֶלֶת הָעַמִּים אֶל אִיִּים רַבִּים
  english_pob_choice: trader of the peoples to many coastlands
  chosen_korean: 많은 섬들에까지 백성들의 상인이 된
  alternatives_korean:
  - 많은 해안 지방들까지 백성들의 상인이 된
  - 많은 섬들로 가는 백성들의 상인이 된
  lexicon: HALOT
  rationale: רֹכֶלֶת은 여성형 분사로서 두로의 상업적 정체성을 나타내므로 '상인'으로 옮겼고, אִיִּים רַבִּים은 본문 주석에 따라 '섬들'을 기본으로 취했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 합성 칭호를 한국어 예언서 문맥에서 자연스럽게 유지하기 위해 '주 여호와'로 옮겼습니다.
- source_word: כְּלִילַת יֹפִי
  english_pob_choice: I am perfect in beauty
  chosen_korean: 나는 완전한 아름다움이다
  alternatives_korean:
  - 나는 아름다움의 완성이다
  - 나는 온전한 아름다움이다
  lexicon: HALOT
  rationale: 두로의 교만한 자기 선언을 직설적으로 살리기 위해 명사구의 강한 단정을 그대로 재현했습니다.
theological_decisions:
- issue: 두로의 자기 과시를 직접화된 인용으로 처리할지 여부
  chosen_reading: 직접화된 인용문으로 처리해 교만의 자기평가를 선명하게 드러냈습니다.
  alternative_readings:
  - 간접화하여 완곡하게 표현
  - '''나는 완전한 아름다움이다''를 더 문학적으로 의역'
  rationale: 본문은 두로의 자의식을 고발하는 예언적 인용이므로, 완곡하게 낮추지 않고 본문의 공격성을 유지하는 것이 적절합니다.
  doctrine_reference: 예언서 수사학과 심판 선언의 직접성
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - LORD
  rationale: 주어진 영어 POB의 'the Lord GOD' 관용을 한국어 전통 가독성에 맞춰 '주 여호와'로 재현했습니다.
  doctrine_reference: 번역 관행과 예언서 문맥의 호칭 유지
