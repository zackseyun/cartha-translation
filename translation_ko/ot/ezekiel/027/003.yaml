    rationale: אִיִּים는 섬뿐 아니라 해안 지방들을 뜻할 수 있습니다. 기본문을 ‘해안 지방’으로 하고 대안 ‘섬들’을 그 자리의 각주로 제시하는 편이 자연스럽고 충실합니다.
