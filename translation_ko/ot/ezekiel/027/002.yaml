  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם שָׂ֥א עַל צֹ֖ר קִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/002.yaml
  text: And you[a], son of man, raise a lamentation over Tyre,
  footnotes:
  - marker: a
    text: Or 'take up a lament over Tyre.' The Hebrew verb literally means 'lift up' and is a standard idiom for beginning a lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너, 인자야, 두로를 향하여 애가를 지어라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두로에 대한 애가를 지어라.’ 히브리어 동사는 문자적으로는 ‘들어올리다’라는 뜻이며, 애가를 시작하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: And you,
  chosen_korean: 그리고 너,
  alternatives_korean:
  - 그리고 당신,
  - 자, 너는,
  lexicon: HALOT
  rationale: 접속사와 독립 대명사의 직결을 살려 담화 전환을 표시하면서도, 하나님이 에스겔에게 직접 말씀하시는 긴박한 호명을 자연스럽게 옮겼습니다.
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 표준 호칭으로 굳어진 표현을 따라, 관용구를 보존하는 쪽이 원문의 호명 기능을 가장 분명하게 드러냅니다.
- source_word: שָׂא
  english_pob_choice: raise
  chosen_korean: 지어라
  alternatives_korean:
  - 들어라
  - 올려라
  - 일으켜라
  lexicon: HALOT
  rationale: 애가를 시작하라는 관용적 용법이므로, 한국어에서는 실제 행위보다 ‘애를 지어라’로 옮겨 문맥상 의미를 직접 전달했습니다.
- source_word: קִינָה
  english_pob_choice: lamentation
  chosen_korean: 애가
  alternatives_korean:
  - 슬픔의 노래
  - 통곡
  - 애가문
  lexicon: HALOT
  rationale: 예언적 탄식시의 정형을 가리키는 말이어서, 전통적이면서도 본문 기능을 잘 드러내는 ‘애가’를 택했습니다.
theological_decisions:
- issue: 에스겔의 예언적 호명 형식
  chosen_reading: ‘인자’로 직역해 에스겔의 반복되는 신적 호명을 보존했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 이 표현은 단순한 인간 일반이 아니라 선지자에게 주어지는 정체성 호칭이므로, 관용구를 유지하는 것이 본문의 신학적·문학적 효과를 더 잘 살립니다.
  doctrine_reference: 예언자 소명과 계시 언어의 반복 구조
