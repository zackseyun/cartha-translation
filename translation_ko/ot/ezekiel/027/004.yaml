lexical_decisions:
- source_word: בְּלֵב יַמִּים
  english_pob_choice: in the heart of the seas
  chosen_korean: 바다의 한가운데에
  alternatives_korean:
  - 바다의 중심에
  - 바다의 속에
  lexicon: HALOT
  rationale: לֵב의 공간적 용법은 문자적으로는 ‘심장/가운데’이므로, 한국어에서는 자연스러운 관용인 ‘한가운데’로 옮겨 시적 이미지를 살렸습니다.
- source_word: גְּבוּלַיִךְ
  english_pob_choice: your borders
  chosen_korean: 네 경계는
  alternatives_korean:
  - 네 영토는
  - 네 경계선은
  - 네 해안은
  lexicon: HALOT
  rationale: גְּבוּל은 경계, 경계선, 영토를 뜻하므로, 해양 문맥에서도 원뜻을 넓게 보존하는 ‘경계’가 가장 직접적입니다.
- source_word: כָּלְלוּ
  english_pob_choice: perfected
  chosen_korean: 완성했습니다
  alternatives_korean:
  - 완전하게 했습니다
  - 끝냈습니다
  - 다듬어 완성했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 종결보다 어떤 것을 아름답게 완성하는 뉘앙스가 있어, ‘완성했습니다’로 옮겨 미학적 충만함을 살렸습니다.
theological_decisions:
- issue: Tyre의 시적 묘사에서 ‘builders’의 주체를 어떻게 표기할지
  chosen_reading: 주어를 ‘너를 지은 자들’로 두어, 도시/배의 형상화된 이미지가 살아 있도록 했습니다.
  alternative_readings:
  - 너의 건축자들이
  - 너의 배를 만든 자들이
  rationale: 본문은 צור(두로)을 직접 건축물처럼 의인화한 시적 진술이므로, 특정 직업명으로 좁히기보다 원문의 은유를 보존하는 편이 더 정확합니다.
  doctrine_reference: 시적 본문 해석 원칙
