  text: בְּ/מַ֤יִם רַבִּים֙ הֱבִיא֔וּ/ךְ הַ/שָּׁטִ֖ים אֹתָ֑/ךְ ר֚וּחַ הַ/קָּדִ֔ים שְׁבָרֵ֖/ךְ בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
  footnotes:
  - marker: a
    text: Or 'in great waters' or 'upon many waters.' The Hebrew preposition can be rendered in several ways, but the motion implied by 'brought you' favors 'into great waters.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the midst of the seas.' Hebrew 'heart of the seas' is an idiom for the inner part or midst.
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 물들 속으로 너의 노 젓는 자들이 너를 데려갔습니다[a]; 동풍이 바다 한가운데서 너를 산산이 부수었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 물들 가운데’ 또는 ‘많은 물들 위에’로 옮길 수 있습니다. 히브리어 전치사는 여러 방식으로 옮길 수 있으나, ‘데려갔습니다’가 시사하는 이동을 고려하면 ‘큰 물들 속으로’가 더 적절합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바다들 한가운데서’로도 옮길 수 있습니다. 히브리어 ‘바다의 마음’은 그 안쪽 또는 한가운데를 가리키는 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמַ֤יִם רַבִּים֙
  english_pob_choice: into great waters
  chosen_korean: 큰 물들 속으로
  alternatives_korean:
  - 큰 물들 가운데
  - 많은 물들 가운데
  - 큰 바다 가운데
  lexicon: HALOT
  rationale: ב의 공간적 방향성을 살려 ‘속으로’로 옮겼고, רַבִּים은 문자적 ‘많은’보다 시적·관용적 범위가 드러나는 ‘큰 물들’이 더 자연스럽습니다.
- source_word: הַשָּׁטִ֖ים
  english_pob_choice: your rowers
  chosen_korean: 너의 노 젓는 자들이
  alternatives_korean:
  - 너의 뱃사람들이
  - 노 젓는 이들이
  - 뱃노꾼들이
  lexicon: HALOT
  rationale: 이 문맥의 분사형은 배를 움직이는 자들을 가리키므로 ‘노 젓는 자들’로 구체화했고, 2인칭 목적어와의 관계를 살리기 위해 ‘너의’를 유지했습니다.
- source_word: רוּחַ הַקָּדִים
  english_pob_choice: the east wind
  chosen_korean: 동풍이
  alternatives_korean:
  - 그 동풍이
  - 동쪽 바람이
  - 동쪽에서 부는 바람이
  lexicon: HALOT
  rationale: 정관사를 굳이 노출하지 않아도 한국어에서는 단순한 주어 표지가 자연스럽고, 예언적 파괴 이미지에 맞는 관용적 표현으로 ‘동풍’이 적절합니다.
- source_word: שְׁבָרֵךְ
  english_pob_choice: shattered you
  chosen_korean: 산산이 부수었습니다
  alternatives_korean:
  - 깨뜨렸습니다
  - 산산이 깼습니다
  - 파괴했습니다
  lexicon: HALOT
  rationale: שׁבר의 강한 파괴감을 살리기 위해 단순한 ‘깨다’보다 ‘산산이 부수다’를 택했습니다.
- source_word: בְּלֵב יַמִּים
  english_pob_choice: in the heart of the seas
  chosen_korean: 바다 한가운데서
  alternatives_korean:
  - 바다의 마음속에서
  - 바다의 중심에서
  - 바다의 한복판에서
  lexicon: HALOT
  rationale: ‘heart’의 비유를 한국어 관용인 ‘한가운데’로 옮겨 의미를 전달하되, 수사적 표현이 어색해지는 직역은 피했습니다.
theological_decisions:
- issue: 두 번째 절반의 재난 원인과 주어 배열
  chosen_reading: 배의 운행자들이 앞부분의 이동을 이끌고, 이어 동풍이 निर्ण정적 파괴를 가하는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - ‘노 젓는 자들’보다 ‘뱃사람들’로 일반화할 수 있음
  - ‘바다 한가운데’ 대신 ‘바다의 중심’으로 더 직역할 수 있음
  rationale: 이 절은 צור의 함몰을 배 비유로 그리므로, 행위자와 파괴 행위의 대비가 분명해야 합니다. 한국어에서도 그 대조가 보이도록 유지했습니다.
  doctrine_reference: 예언서의 심판 비유와 시적 이미지 전달
