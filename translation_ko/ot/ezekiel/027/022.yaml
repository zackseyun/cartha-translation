id: EZK.27.22
reference: Ezekiel 27:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹכְלֵ֤י שְׁבָא֙ וְ/רַעְמָ֔ה הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/רֹ֨אשׁ כָּל בֹּ֜שֶׂם וּ/בְ/כָל אֶ֤בֶן יְקָרָה֙ וְ/זָהָ֔ב נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
  footnotes:
  - marker: a
    text: Or 'they gave for your merchandise.' The Hebrew verb is literally 'gave,' but here it functions in a commercial sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 스바와 라아마의 상인들—그들이 바로 당신의 상인들이었습니다. 모든 향료의 가장 좋은 것과 모든 귀한 돌과 금으로, 그들이 당신의 물품에 값을 치렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 당신의 물품을 주었습니다.’ 히브리어 동사는 문자적으로는 ‘주다’이지만, 여기서는 상업적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלֵי
  english_pob_choice: merchants of
  chosen_korean: 상인들
  alternatives_korean:
  - 무역상들
  - 장사꾼들
  lexicon: HALOT
  rationale: רכל은 에스겔 27장의 상업 탄식 맥락에서 거래에 종사하는 사람들을 가리키므로, 표준적이고 자연스러운 ‘상인들’로 옮겼습니다.
- source_word: שְׁבָא / רַעְמָה
  english_pob_choice: Sheba and Raamah
  chosen_korean: 스바와 라아마
  alternatives_korean:
  - 세바와 라마
  - 시바와 라마
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 표기 관습에 따라 음역했고, 히브리어 מקור에 가까운 형태를 유지했습니다.
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  english_pob_choice: with the finest of every spice
  chosen_korean: 모든 향료의 가장 좋은 것
  alternatives_korean:
  - 모든 향료의 최고급품
  - 모든 향료의 가장 뛰어난 것
  lexicon: HALOT
  rationale: רֹאשׁ는 여기서 문자적 ‘머리’가 아니라 관용적으로 ‘가장 좋은/최상급의’ 뜻이므로, 상업적·사치품 목록의 뉘앙스를 살려 ‘가장 좋은 것’으로 옮겼습니다.
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  english_pob_choice: they paid for your wares
  chosen_korean: 그들이 당신의 물품에 값을 치렀습니다
  alternatives_korean:
  - 그들이 당신의 물품을 주었습니다
  - 그들이 당신의 상품값을 지불했습니다
  lexicon: HALOT
  rationale: נָתַן이 문자적으로는 ‘주다’이지만, 여기서는 거래 문맥이므로 POB의 의미 결정을 따라 ‘값을 치르다’로 옮겨 상업적 교환을 드러냈습니다. עִזְבוֹן은 ‘물품/상품’으로 이해되는 거래품을 가리킵니다.
theological_decisions:
- issue: 본절의 직설적 상업 비유를 어떻게 유지할 것인가
  chosen_reading: 순수한 거래와 호화품 목록의 이미지를 유지해, ‘상인들 / 가장 좋은 것 / 값을 치렀습니다’로 직역성을 살렸습니다.
  alternative_readings:
  - 보다 완곡하게 ‘거래했다’로 풀기
  - ‘바쳤다’처럼 일반적 헌납 어감을 주기
  rationale: 본문은 두로의 무역 네트워크와 사치품 거래를 고발하는 애가이므로, 종교적·도덕적 완곡어법보다 상업적 사실성을 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 본문 맥락(에스겔 27장 전체)의 심판 신탁
