id: EZK.27.35
reference: Ezekiel 27:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ל יֹשְׁבֵ֣י הָ/אִיִּ֔ים שָׁמְמ֖וּ עָלָ֑יִ/ךְ וּ/מַלְכֵי/הֶם֙ שָׂ֣עֲרוּ שַׂ֔עַר רָעֲמ֖וּ פָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/035.yaml
  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
  footnotes:
  - marker: a
    text: Or 'the inhabitants of the islands.' The Hebrew אִיִּים can refer to islands or, more broadly, maritime coastlands.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'shudder a shudder,' an intensive expression for extreme horror.
    reason: lexical_alternative
  - marker: c
    text: The final clause is difficult; alternatively, 'their faces tremble' or 'their faces are contorted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 해안 지방의 주민들이 당신을 보고 놀라며, 그들의 왕들은 심히 떨며—그들의 얼굴은 일그러집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해안 지방’은 히브리어 אִיִּים이 가리킬 수 있는 ‘섬들’의 넓은 의미를 반영한 번역입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘떨다, 떨다’의 강조형 표현으로 극심한 공포를 나타냅니다.
    reason: source_note
  - marker: c
    text: 마지막 구는 본문이 난해하여, ‘그들의 얼굴은 떨립니다’ 또는 ‘그들의 얼굴은 경련합니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבֵי הָאִיִּים
  english_pob_choice: the inhabitants of the coastlands
  chosen_korean: 해안 지방의 주민들
  alternatives_korean:
  - 섬들의 주민들
  - 섬에 사는 사람들
  lexicon: HALOT
  rationale: אִיִּים은 문자적으로는 ‘섬들’이지만 예언서 문맥에서는 해양 연안 지역까지 넓게 가리킬 수 있으므로, 타이어 심판 신탁의 항해·해상 문맥에 맞는 ‘해안 지방’으로 옮겼습니다.
- source_word: שָׁמְמוּ
  english_pob_choice: are appalled
  chosen_korean: 놀라며
  alternatives_korean:
  - 경악하며
  - 황폐해지며
  lexicon: HALOT
  rationale: 이 동사는 여기서 충격에 휩싸인 반응을 나타내므로, 물리적 황폐보다 정서적 충격을 살린 ‘놀라다’ 계열이 자연스럽습니다.
- source_word: שָׂעֲרוּ שַׂעַר
  english_pob_choice: shudder with horror
  chosen_korean: 심히 떨며
  alternatives_korean:
  - 전율하며
  - 공포에 떨며
  lexicon: HALOT
  rationale: 어근의 반복은 강한 강조이므로, 한국어에서는 직역적 반복보다 강도를 살린 ‘심히 떨다’로 처리하되 과도한 해석어는 피했습니다.
- source_word: רָעֲמוּ פָּנִים
  english_pob_choice: their faces are convulsed
  chosen_korean: 그들의 얼굴은 일그러집니다
  alternatives_korean:
  - 그들의 얼굴은 떨립니다
  - 그들의 얼굴은 경련합니다
  lexicon: HALOT
  rationale: 마지막 구는 난해하지만 얼굴의 격렬한 동요를 가리키므로, 신체적 이미지와 현대 한국어의 자연스러움을 함께 살린 ‘일그러지다’를 택했습니다.
theological_decisions:
- issue: 예언적 충격 표현의 강도 유지
  chosen_reading: ‘심히 떨며—그들의 얼굴은 일그러집니다’로, 수사적 강도를 약화시키지 않고 옮겼습니다.
  alternative_readings:
  - ‘몹시 두려워하며’
  - ‘그들의 얼굴은 troubled(괴로워합니다)’ 식의 완화된 표현
  rationale: 본문은 타이어의 몰락 앞에서 열방과 왕들이 느끼는 극심한 공포를 묘사하므로, 문학적 긴장과 심판의 파장을 유지하는 번역이 필요합니다.
  doctrine_reference: 예언서의 심판 진술에 나타나는 열방의 경외와 두려움의 묘사
- issue: 문장 연결과 시각적 효과
  chosen_reading: 대시(—)로 두 절을 이어 마지막 얼굴 묘사의 충격을 강조했습니다.
  alternative_readings:
  - 세미콜론으로 분리
  - 마침표로 단절
  rationale: 히브리어의 병렬 구조와 감정의 누적을 한국어에서도 드러내기 위해, 문장 내부의 긴장을 보존하는 연결 방식을 택했습니다.
  doctrine_reference: 히브리 시적 병행법과 수사적 누적 효과
