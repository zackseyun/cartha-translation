base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
  footnotes:
  - marker: a
    text: Or 'those who caulk your seams' or 'those who mend your breaches.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heart of the seas,' that is, the midst or depths of the seas.
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 재물과 너의 상품과 너의 무역품과 너의 선원들과 너의 항해사들과 너의 파손된 곳을 수리하는 이들[a]과 너의 무역품을 거래하는 이들과 너 가운데 있는 모든 전사들과 너 가운데 있는 너의 온 무리가, 네가 무너지는 날에 바다 한가운데로 떨어질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 배의 틈이나 파손된 부위를 보수하는 이들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바다들의 심장’이며, 바다 한가운데 또는 깊은 곳을 뜻하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  english_pob_choice: your wealth
  chosen_korean: 네 재물
  alternatives_korean:
  - 네 부
  - 네 부유함
  lexicon: HALOT
  rationale: הוֹן은 재물·부를 뜻하므로, 상업적 애가 문맥에서 자연스러운 ‘재물’로 옮겼습니다.
- source_word: עִזְבוֹנַיִךְ / מַעֲרָבֵךְ
  english_pob_choice: your wares / your merchandise
  chosen_korean: 네 상품 / 네 무역품
  alternatives_korean:
  - 네 물품 / 네 물건
  - 네 장사품
  lexicon: HALOT
  rationale: 두 항목 모두 티로의 해상 무역 맥락에서 팔고 사는 물품을 가리키므로, 반복을 살리면서도 현대 한국어에서 상업적 뉘앙스가 분명한 표현으로 구분했습니다.
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  english_pob_choice: those who repair your damage
  chosen_korean: 네 피해를 고치는 자들
  alternatives_korean:
  - 네 틈을 메우는 자들
  - 네 벌어진 틈을 수선하는 자들
  lexicon: HALOT
  rationale: 배의 파손을 수리하는 뜻을 살려, 본문에는 읽기 쉬운 표현을 두고 보다 기술적인 ‘틈을 메우는’ 가능성은 직역 대안으로 남겼습니다.
- source_word: בְּלֵב יַמִּים
  english_pob_choice: into the heart of the seas
  chosen_korean: 바다 한가운데로
  alternatives_korean:
  - 바다의 중심으로
  - 바다 깊은 곳으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 중심/깊음 의미를 한국어에서 가장 자연스럽게 전달하는 표현으로 옮겼고, 은유를 과도하게 낯설게 하지 않았습니다.
theological_decisions:
- issue: ‘네 회중’의 범위와 톤
  chosen_reading: ‘네 온 회중’으로 옮겨, 항구 도시 티로 안의 모든 집합된 사람들을 포괄하는 의미를 살렸습니다.
  alternative_readings:
  - ‘네 모임’
  - ‘네 무리’
  rationale: קָהָל은 단순 인원 집합이 아니라 공식적으로 모인 공동체를 가리킬 수 있으므로, 상업·군사·도시 전체를 포괄하는 문맥에 맞게 ‘회중’ 계열을 유지하되 ‘온’으로 총괄성을 드러냈습니다.
  doctrine_reference: 문맥 기반 집합명사 처리
- issue: ‘땅에 떨어짐’ 대신 ‘바다 한가운데로 떨어짐’
  chosen_reading: 심판의 파멸을 단순한 추락이 아니라 해상 재난으로 제시하는 원문 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘바다 한가운데로 가라앉을 것입니다’
  - ‘바다 깊은 곳으로 떨어질 것입니다’
  rationale: יִפְּלוּ는 기본적으로 ‘떨어지다’이지만, 본문에서는 해상 멸망의 생생한 이미지를 보존하는 것이 중요하므로 ‘떨어질 것입니다’로 유지했습니다.
  doctrine_reference: 예언 문학의 형상 보존
