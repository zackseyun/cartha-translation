  rationale: 히브리어 완료/미완료의 예언적 미래를 한국어에서는 자연스러운 미래 서술로 반영하는 것이 본문의 심판-애도 선언 구조를 가장 잘 드러냅니다.
  doctrine_reference: 예언서의 심판 선언과 애가 어법
