    text: 히브리어 ‘쓰라린 마음으로’는 단순한 슬픔보다 깊은 내면의 고통을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיחוּ ... קָרְחָה
  english_pob_choice: will make themselves bald
  chosen_korean: 머리털을 밀고
  alternatives_korean:
  - 대머리가 되게 하고
  - 머리를 밀어
  lexicon: HALOT
  rationale: 애곡의 관용적 행동인 ‘baldness’는 한국어에서 자연스럽게 ‘머리털을 밀다’로 옮기는 것이 가장 직접적이며, 스스로 행하는 상징 행위를 살릴 수 있습니다.
- source_word: וְחָגְרוּ שַׂקִּים
  english_pob_choice: put on sackcloth
  chosen_korean: 굵은 베옷을 입으며
  alternatives_korean:
  - 삼베옷을 걸치며
  - 굵은 베를 두르며
  lexicon: HALOT
  rationale: ‘sackcloth’는 장례·애통의 표지이므로 한국어 성경 관용에 맞되, 너무 교회적이지 않게 ‘굵은 베옷’을 택했습니다.
- source_word: בְּמַר נֶפֶשׁ
  english_pob_choice: with bitterness of soul
  chosen_korean: 쓰라린 마음으로
  alternatives_korean:
  - 혼이 쓰린 채로
  - 영혼의 쓰라림으로
  lexicon: HALOT
  rationale: 문자적으로는 ‘혼의 쓰라림’이지만, 한국어에서 네페쉬의 인격 전체를 자연스럽게 드러내는 표현은 ‘마음’이며, POB가 지적한 내면의 깊은 고통을 유지합니다.
- source_word: מִסְפֵּד מָר
  english_pob_choice: with bitter mourning
  chosen_korean: 쓰라린 애곡을 할 것입니다
  alternatives_korean:
  - 쓰라린 통곡을 할 것입니다
  - 쓴 슬픔의 곡을 할 것입니다
  lexicon: HALOT
  rationale: ‘bitter mourning’은 단순 감정이 아니라 애도 행위 자체를 가리키므로, 앞의 ‘통곡’과 평행을 이루는 ‘애곡’을 사용해 반복적 애도 표현을 살렸습니다.
