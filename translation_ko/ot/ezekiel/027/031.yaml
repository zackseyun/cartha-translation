translation:
  language: ko
  text: 그들은 당신 때문에 머리털을 밀고, 굵은 베옷을 입으며, 쓰라린 마음으로 당신을 위해 통곡하고 쓰라린 애곡을 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
