  text: יְהוּדָה֙ וְ/אֶ֣רֶץ יִשְׂרָאֵ֔ל הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/חִטֵּ֣י מִ֠נִּית וּ/פַנַּ֨ג וּ/דְבַ֤שׁ וָ/שֶׁ֨מֶן֙ וָ/צֹ֔רִי נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
  footnotes:
  - marker: a
    text: The meaning of 'pannag' is uncertain; proposed renderings include a confection, spice, or pastry product.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다와 이스라엘 땅이 — 그들이 당신의 상인들이었습니다 — 민닛의 밀과[a] 빵낙, 꿀, 기름, 향유를 당신의 무역품으로 거래하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פַנַּג(pannag)은 뜻이 확실하지 않습니다. 제안되는 번역으로는 과자, 향신료, 빵류 등이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  english_pob_choice: Judah and the land of Israel
  chosen_korean: 유다와 이스라엘 땅
  alternatives_korean:
  - 유다와 이스라엘
  - 유다와 이스라엘 땅
  lexicon: WLC
  rationale: 히브리어는 유다와 ‘이스라엘 땅’을 구분해 병렬로 제시하므로, 축약하지 않고 두 요소를 모두 살렸습니다.
- source_word: רֹכְלָיִךְ
  english_pob_choice: your merchants
  chosen_korean: 당신의 상인들이었습니다
  alternatives_korean:
  - 당신의 상인들이었습니다
  - 당신의 장사꾼들이었습니다
  lexicon: HALOT
  rationale: 무역 문맥에서 상거래를 하는 사람들을 뜻하므로, 한국어에서는 자연스러운 ‘상인’으로 옮기되 소유격 ‘-의’ 관계를 유지했습니다.
- source_word: בְּחִטֵּי מִנִּית
  english_pob_choice: with wheat of Minnith
  chosen_korean: 민닛의 밀과
  alternatives_korean:
  - 민닛의 밀로
  - 민닛에서 난 밀과
  - 민닛 밀과
  lexicon: HALOT
  rationale: 전치사 בְּ는 이 교역 품목을 매개로 한 거래를 나타내므로, 품목 명시를 살려 ‘민닛의 밀’로 옮겼습니다.
- source_word: פַנַּג
  english_pob_choice: pannag
  chosen_korean: 빵낙
  alternatives_korean:
  - 판낙
  - 파낙
  lexicon: HALOT
  rationale: 의미가 불확실한 희귀어이므로 음역을 유지해 본문에서 확정적 해석을 피했고, 한국어 음가에 맞춰 ‘빵낙’으로 적었습니다.
- source_word: נָתְנוּ מַעֲרָבֵךְ
  english_pob_choice: trading for your merchandise
  chosen_korean: 당신의 무역품으로 거래하였습니다
  alternatives_korean:
  - 당신의 상품과 바꾸었습니다
  - 당신의 물품과 맞교환하였습니다
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 교환물/무역품을 주었다’는 뜻이어서, 이 장의 상업 목록 문맥에 맞게 교역 행위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 불확실한 희귀어 פַנַּג의 처리
  chosen_reading: 음역을 유지해 본문에서는 의미를 단정하지 않았습니다.
  alternative_readings:
  - 과자
  - 향신료
  - 빵류
  rationale: 본문 자체가 뜻을 확정하지 못하므로, 의미를 임의로 결정하지 않고 독자가 주석적 불확실성을 보게 했습니다.
  doctrine_reference: 본문비평/어휘 불확실성의 보존
- issue: 유다와 이스라엘 땅의 병렬성
  chosen_reading: 두 지명을 모두 분리해 옮겼습니다.
  alternative_readings:
  - 유다와 이스라엘
  - 유다 곧 이스라엘 땅
  rationale: 지리적·정치적 구분을 지워버리지 않고, 예언적 애가의 상업망 범위를 그대로 드러내기 위해서입니다.
  doctrine_reference: 본문 의미 보존
