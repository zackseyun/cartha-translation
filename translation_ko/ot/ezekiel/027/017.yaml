  to: 유다와 이스라엘 땅은 당신의 상인들이었습니다. 그들은 민닛의 밀과 판낙[a], 꿀, 기름, 발삼을 당신의 물품과 맞바꾸었습니다.
  rationale: 히브리어의 병렬 주어와 ‘당신의 상인들’을 보존했습니다. 희귀어 פַנַּג는 확정적으로 해석하지 않고 음역과 주석을 유지하되, 표지를 해당 단어로 옮겼습니다. צֹרִי는 ‘발삼’으로 바로잡고, 열거된 물품이 두로의 물품과 교환된다는 상업적 관계를 명료하게 했습니다.
