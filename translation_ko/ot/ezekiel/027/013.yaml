id: EZK.27.13
reference: Ezekiel 27:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָוָ֤ן תֻּבַל֙ וָ/מֶ֔שֶׁךְ הֵ֖מָּה רֹֽכְלָ֑יִ/ךְ בְּ/נֶ֤פֶשׁ אָדָם֙ וּ/כְלֵ֣י נְחֹ֔שֶׁת נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
  footnotes:
  - marker: a
    text: Or 'persons'; in context this likely refers to people sold in trade, that is, slaves.
    reason: lexical_alternative
translation:
  language: ko
  text: 야완과 두발과 메섹은 당신의 상인들이었습니다. 그들은 당신의 상품과 맞바꾸어 사람의 생명과 청동 그릇을 내놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람들'; 문맥상 이는 거래에서 팔린 사람들, 곧 노예를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָוָן
  english_pob_choice: Javan
  chosen_korean: 야완
  alternatives_korean:
  - 그리스
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역해 민족명/지명 표지를 보존했습니다. '그리스'는 해석적 식별이지만 원형의 직접성을 약화합니다.
- source_word: תֻּבַל
  english_pob_choice: Tubal
  chosen_korean: 두발
  alternatives_korean:
  - 두발족
  - 두발 땅
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 택해 열거 구조를 그대로 살렸습니다.
- source_word: מֶשֶׁךְ
  english_pob_choice: Meshech
  chosen_korean: 메섹
  alternatives_korean:
  - 메셰크
  - 메섹 족속
  lexicon: HALOT
  rationale: 고유명사 음역을 사용해 본문의 병렬 열거를 유지했습니다.
- source_word: רֹכְלָיִךְ
  english_pob_choice: your traders
  chosen_korean: 당신의 상인들
  alternatives_korean:
  - 당신의 무역상들
  - 당신의 장사꾼들
  lexicon: HALOT
  rationale: 상업적 상대를 가리키는 말로서, 현대 한국어에서 자연스럽고 중립적인 '상인들'이 가장 적절합니다.
- source_word: בְּנֶפֶשׁ אָדָם
  english_pob_choice: human lives
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 사람들
  - 인간 생명
  - 사람들의 목숨
  lexicon: HALOT
  rationale: 직역의 '영혼'보다 문맥상 거래 대상으로 취급된 인간 존재의 생명성을 드러내는 표현이어서, POB의 강한 문제의식을 한국어로 보존했습니다.
- source_word: כְלֵי נְחֹשֶׁת
  english_pob_choice: articles of bronze
  chosen_korean: 청동 그릇
  alternatives_korean:
  - 청동 기물
  - 청동 제품
  - 청동 용기
  lexicon: HALOT
  rationale: 넓은 의미의 제작품 가운데 본문의 교역 맥락에 맞는 대표적 물건 표현으로 옮겼습니다. '그릇'은 전통적이지만 여기서는 제조된 청동 물품의 포괄적 예시로 이해할 수 있습니다.
- source_word: נָתְנוּ
  english_pob_choice: they exchanged
  chosen_korean: 맞바꾸어 … 내놓았습니다
  alternatives_korean:
  - 교환했습니다
  - 거래했습니다
  - 주었습니다
  lexicon: HALOT
  rationale: 단순한 '주다'보다 상업적 교환 행위를 드러내기 위해 '맞바꾸다'를 사용했고, 문맥상 행위의 결과를 자연스럽게 풀어 썼습니다.
- source_word: מַעֲרָבֵךְ
  english_pob_choice: your wares
  chosen_korean: 당신의 상품
  alternatives_korean:
  - 당신의 물품
  - 당신의 상품들
  - 당신의 교역품
  lexicon: HALOT
  rationale: 거래 대상인 물품을 뜻하므로 현대 한국어에서 가장 직관적인 '상품'을 택했습니다. POB의 'wares'와 같은 상업적 뉘앙스를 유지합니다.
theological_decisions:
- issue: 인간을 교역품처럼 취급하는 충격적 표현의 처리
  chosen_reading: '''사람의 생명''을 유지해 본문의 윤리적 충격을 약화시키지 않았습니다.'
  alternative_readings:
  - '''사람들'''
  - '''인간들'''
  - '''목숨'''
  rationale: 본문은 전쟁·무역 질서 속에서 인간이 상품화되는 현실을 고발하므로, 완곡화보다 직설성이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 예언서의 사회윤리적 고발과 인간 존엄에 대한 성경적 증언
