    rationale: בְּנֶפֶשׁ אָדָם은 문맥상 거래되는 인간들을 가리키는 표현입니다. ‘사람들’로 본문을 자연스럽게 옮기고, 각주에서 직역과 노예 매매 가능성을 밝혀 원문의 강도와 해석상 여지를 함께 보존할 수 있습니다.
