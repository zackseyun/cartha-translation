  to: 야완과 두발과 메섹은 당신의 상인들이었습니다. 그들은 당신의 상품과 맞바꾸어 사람들[a]과 청동 기물을 내놓았습니다.
  rationale: 청동 물품의 범위를 부당하게 한정한 ‘그릇’을 포괄적인 ‘기물’로 고쳤습니다. 인간 거래를 가리키는 히브리어 표현은 한국어 본문에서 자연스러운 ‘사람들’로 옮기되, 각주에 직역과 문맥상 노예 매매 가능성을 제시하여 어휘적·역사적 함의를 보존했습니다. 교역의 상호 교환 구조, 고유명사, 상업 용어 및 합쇼체 문체는 유지했습니다.
