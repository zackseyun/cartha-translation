source:
  edition: WLC
  text: מִ/בֵּ֖ית תּוֹגַרְמָ֑ה סוּסִ֤ים וּ/פָֽרָשִׁים֙ וּ/פְרָדִ֔ים נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
  footnotes:
  - marker: a
    text: Or 'From the house of Togarmah.' The Hebrew expression can denote a people or region associated with Togarmah, not necessarily a literal household.
    reason: lexical_alternative
  - marker: b
    text: Or 'horsemen' or 'cavalry horses' for 'war horses.' The Hebrew term often refers to riders/cavalry, but here the trade context favors an equine sense.
    reason: alternative_reading
translation:
  language: ko
  text: 벧도갈마에서는 말들과[a] 기병들과[b] 노새들을 그대의 상품과 바꾸었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도갈마의 집에서’. 히브리어 표현은 문자적으로 ‘도갈마의 집’을 뜻하지만, 여기서는 도갈마와 관련된 민족이나 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군마들’. 히브리어는 흔히 기병 또는 말 탄 사람들을 뜻하지만, 이곳은 거래 품목의 목록이므로 군마들을 가리킨다고 보는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  english_pob_choice: From Beth-togarmah
  chosen_korean: 베스-두갈마에서
  alternatives_korean:
