  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/בֵּ֖ית תּוֹגַרְמָ֑ה סוּסִ֤ים וּ/פָֽרָשִׁים֙ וּ/פְרָדִ֔ים נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
  footnotes:
  - marker: a
    text: Or 'From the house of Togarmah.' The Hebrew expression can denote a people or region associated with Togarmah, not necessarily a literal household.
    reason: lexical_alternative
  - marker: b
    text: Or 'horsemen' or 'cavalry horses' for 'war horses.' The Hebrew term often refers to riders/cavalry, but here the trade context favors an equine sense.
    reason: alternative_reading
translation:
  language: ko
  text: “베스-두갈마에서 그들이 말들과[a] 기병들[b]과 노새들을 당신의 물품에 대한 값으로 내놓았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두갈마의 집에서’로 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘집’을 뜻하지만, 여기서는 두갈마와 관련된 민족이나 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘말 탄 사람들’로 옮길 수 있습니다. 히브리어는 종종 기병을 뜻하지만, 여기서는 거래 문맥 때문에 말의 품목으로 읽는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  english_pob_choice: From Beth-togarmah
  chosen_korean: 베스-두갈마에서
  alternatives_korean:
  - 두갈마에서
  - 두갈마의 집에서
  lexicon: HALOT
  rationale: 지명·민족명을 나타내는 표현으로 읽혀 ‘베스-두갈마’의 음역을 유지하는 것이 가장 직접적이며, ‘집’으로 풀어 쓰면 지명성보다 문자적 구조가 과도하게 드러납니다.
- source_word: סוּסִים
  english_pob_choice: horses
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 준마들
  lexicon: HALOT
  rationale: 상거래 목록에서의 일반 명사이므로 자연스러운 현대 한국어인 ‘말들’이 적절합니다.
- source_word: וּ/פָרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병들
  alternatives_korean:
  - 말탄 사람들
  - 말병들
  - 전마들
  lexicon: HALOT
  rationale: POB의 현재 영어 선택이 ‘horsemen’이므로, 거래 품목 목록의 문맥을 살리면서도 사람을 가리키는 뉘앙스를 유지하는 ‘기병들’이 가장 균형적입니다.
- source_word: וּ/פְרָדִים
  english_pob_choice: mules
  chosen_korean: 노새들
  alternatives_korean:
  - 당나귀와 말의 잡종
  - 노새
  lexicon: HALOT
  rationale: 표준 동물명인 ‘노새들’이 가장 직설적이며, 목록의 병렬성을 살립니다.
- source_word: נָתְנ֖וּ עִזְבוֹנָיִךְ
  english_pob_choice: they traded ... for your wares
  chosen_korean: 당신의 물품에 대한 값으로 내놓았습니다
  alternatives_korean:
  - 당신의 물품을 위해 교역했습니다
  - 당신의 상품값으로 주었습니다
  lexicon: HALOT
  rationale: נָתְנוּ의 기본 뜻 ‘주다’를 상업 문맥에서 살리되, 에스겔 27장의 거래 목록이라는 점을 반영해 ‘값으로 내놓았습니다’라고 옮겨 교역/대가의 의미를 드러냈습니다.
theological_decisions:
- issue: 거래 목록의 문체와 대상 지칭
  chosen_reading: 이 절은 예루살렘/두로에 대한 시적 상업 목록의 일부로, 서술적 평서문 대신 거래 행위를 묘사하는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡한 설명문체
  - ‘기병들’을 인명처럼 처리하는 해석
  rationale: 원문은 상업 카탈로그의 열거를 통해 지역과 물품의 교류를 강조하므로, 과도한 해설이나 완곡화 없이 목록의 힘을 보존하는 것이 적절합니다.
  doctrine_reference: 에스겔 27장 문맥상 시적 심판-애가의 상업적 이미지
- issue: 인용부호 사용
  chosen_reading: 직접 인용이 아니라 화자 전환이 없는 시적 진술이므로 한국어에서는 따옴표를 쓰지 않는 쪽이 자연스럽습니다.
  alternative_readings:
  - 따옴표로 둘러 인용처럼 제시
  rationale: 원문은 대화체가 아니라 예언적 애가의 본문이므로, 한국어에서도 인용부호 없이 문장 자체로 제시하는 것이 읽기와 구조에 더 맞습니다.
  doctrine_reference: 문학 장르와 담화 전환
