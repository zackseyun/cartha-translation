id: EZK.27.12
reference: Ezekiel 27:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּרְשִׁ֥ישׁ סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/כֶ֤סֶף בַּרְזֶל֙ בְּדִ֣יל וְ/עוֹפֶ֔רֶת נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
  footnotes:
  - marker: a
    text: Tarshish may refer to the distant trading region later identified by some with Tartessus in Spain.
    reason: cultural_note
  - marker: b
    text: Or “they gave for your merchandise.” The Hebrew verb is simply “gave,” but here it functions in a trade context.
    reason: lexical_alternative
  - marker: c
    text: Or “your merchandise” or “your goods.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다시스는 당신의 온갖 재물이 매우 많았기 때문에 당신과 거래하였습니다[a]. 그들은 은과 철과 주석과 납을 당신의 상품[b] 값으로 내주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다시스는 멀리 떨어진 무역 지역을 가리키는 이름입니다. 일부는 이를 스페인의 타르테수스와 동일시합니다.
    reason: cultural_note
  - marker: b
    text: 또는 “당신의 물품” 또는 “당신의 상품들”입니다. 히브리어는 여기서 거래되는 상품을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  english_pob_choice: Tarshish
  chosen_korean: 다소스
  alternatives_korean:
  - 타르시스
  - 다르시스
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 고유명사는 음역하되, 현대 한국어 외래어 표기 관례에 맞춰 다소스로 옮겼습니다. 원문은 해석이 아니라 지명을 제시합니다.
- source_word: סֹחַרְתֵּךְ
  english_pob_choice: your trader
  chosen_korean: 당신의 상인
  alternatives_korean:
  - 당신의 무역상
  - 당신의 거래상
  lexicon: HALOT
  rationale: סחר는 상업·무역의 의미를 가지므로, 두로를 향한 비유적 수사에 자연스럽고 직접적인 ‘상인’으로 옮겼습니다.
- source_word: מֵרֹב כָּל הוֹן
  english_pob_choice: because of your abundant wealth
  chosen_korean: 풍성한 재물 때문에
  alternatives_korean:
  - 모든 재물이 풍성하기 때문에
  - 막대한 부 때문에
  lexicon: HALOT
  rationale: מִן과 רֹב의 결합은 원인/이유를 나타내며, הוֹן은 재물·부를 뜻하므로 한국어에서는 ‘풍성한 재물 때문에’가 문맥의 인과를 가장 자연스럽게 드러냅니다.
- source_word: עִזְבוֹנָיִךְ
  english_pob_choice: your wares
  chosen_korean: 당신의 상품
  alternatives_korean:
  - 당신의 물품
  - 당신의 상품들
  lexicon: HALOT
  rationale: 이 단어는 에스겔 27장의 무역 품목을 가리키는 상업 용어이므로, 문맥상 ‘상품’이 가장 간결하고 적절합니다.
theological_decisions:
- issue: 무역 문맥에서 נָתְנוּ의 의미
  chosen_reading: ‘그들이 ... 값을 치렀습니다’로 옮겨 거래 행위를 분명히 했습니다.
  alternative_readings:
  - 그들이 주었습니다
  - 그들이 내주었습니다
  rationale: 히브리어 기본 동사는 ‘주다’이지만, 여기서는 은·철·주석·납이 교환 수단으로 제시되므로 단순한 ‘주다’보다 지불의 의미를 드러내는 번역이 본문의 상업적 긴장을 더 잘 보존합니다.
  doctrine_reference: 본문 해석상의 문맥 결정
- issue: 고유명사 Tarshish의 한국어 음역
  chosen_reading: 다소스로 음역했습니다.
  alternative_readings:
  - 타르시스로 음역
  - 지명 설명 없이 음역하지 않음
  rationale: 원문은 지명 자체를 제시하므로 해석어로 바꾸지 않고 음역을 유지해야 합니다. 한국어 독자가 즉시 읽을 수 있도록 현대 표기 관례를 따랐습니다.
  doctrine_reference: 고유명사 보존 원칙
