revisions:
- from: 다소스는 풍성한 재물 때문에 당신의 상인이었습니다[a]. 은, 철, 주석, 납으로 그들이 당신의 상품[b] 값을 치렀습니다.
  to: 다시스는 당신의 온갖 재물이 매우 많았기 때문에 당신과 거래하였습니다[a]. 그들은 은과 철과 주석과 납을 당신의 상품[b] 값으로 내주었습니다.
