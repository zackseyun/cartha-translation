  text: יֹשְׁבֵ֤י צִידוֹן֙ וְ/אַרְוַ֔ד הָי֥וּ שָׁטִ֖ים לָ֑/ךְ חֲכָמַ֤יִ/ךְ צוֹר֙ הָ֣יוּ בָ֔/ךְ הֵ֖מָּה חֹבְלָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/008.yaml
  text: The inhabitants of Sidon and Arvad were your rowers; your wise men[a], O Tyre, were within you; they were your pilots.
  footnotes:
  - marker: a
    text: Or 'your pilots.' The Hebrew term for 'sailors' can refer more specifically to those who direct or manage a ship.
    reason: lexical_alternative
translation:
  language: ko
  text: 시돈과 아르왓의 주민들은 당신의 노를 젓는 사람들이었습니다. 두로야, 당신의 지혜로운 사람들은 당신 안에 있었고, 그들은 당신의 배를 조종하는 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 조종사들’. 히브리어는 ‘선원들’로도 옮길 수 있지만, 배를 직접 지휘하는 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי צִידוֹן וְאַרְוַד
  english_pob_choice: The inhabitants of Sidon and Arvad
  chosen_korean: 시돈과 아르왓의 주민들
  alternatives_korean:
  - 시돈과 아르왓에 사는 사람들
  - 시돈과 아르왓의 거주민들
  lexicon: WLC; standard proper-name transliteration
  rationale: ישׁב의 분사구문은 거주자를 뜻하며, 지명과의 소유 관계를 자연스럽게 살리는 한국어로 ‘주민들’을 택했습니다.
- source_word: שָׁטִים
  english_pob_choice: rowers
  chosen_korean: 노를 젓는 사람들
  alternatives_korean:
  - 노꾼들
  - 뱃사공들
  lexicon: HALOT
  rationale: 해상 비유에서 배를 추진하는 사람들을 가리키므로, 한국어로는 기능을 분명히 드러내는 ‘노를 젓는 사람들’이 가장 직접적입니다.
- source_word: חֲכָמַיִךְ
  english_pob_choice: your wise men
  chosen_korean: 당신의 지혜로운 사람들
  alternatives_korean:
  - 당신의 현자들
  - 당신의 전문가들
  lexicon: HALOT
  rationale: חכם은 지혜뿐 아니라 숙련된 기술자를 가리킬 수 있으므로, 문맥의 항해 전문성을 살리면서도 어휘적 연결을 유지하는 표현으로 옮겼습니다.
- source_word: חֹבְלָיִךְ
  english_pob_choice: your sailors
  chosen_korean: 당신의 배를 조종하는 사람들
  alternatives_korean:
  - 당신의 선원들
  - 당신의 항해사들
  lexicon: HALOT
  rationale: 이 어휘는 일반 선원보다 배를 다루고 이끄는 사람들을 가리킬 수 있어, 문맥상 ‘조종하는 사람들’로 옮겨 배의 운항 기능을 드러냈습니다.
theological_decisions:
- issue: 두로를 향한 직접 호칭과 비유적 화법
  chosen_reading: ‘두로야’로 직접 호칭을 살리고, 이어지는 진술은 도시를 배에 빗댄 비유로 유지했습니다.
  alternative_readings:
  - 직접 호칭 없이 서술형으로 처리
  - 비유를 풀어 설명하는 방식
  rationale: 히브리어의 2인칭 여성 단수 호칭과 해상 비유를 그대로 드러내는 편이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 문맥적 수사와 원문 화법 보존
