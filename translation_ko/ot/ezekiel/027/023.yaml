base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/023.yaml
  text: Haran and Canneh and Eden[a], the merchants of Sheba, Asshur, and Kilmad[b], traded with you.
  footnotes:
  - marker: a
    text: Or “Calneh” for Canneh.
    reason: lexical_alternative
  - marker: b
    text: Or “Assyria” for Asshur.
    reason: lexical_alternative
translation:
  language: ko
  text: 하란과 간네와 에덴[a], 스바의 상인들, 앗수르와 길마드가 당신과 거래했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간네’는 영어 POB의 Canneh를 따른 음역입니다. 전통적 대안으로 ‘칼네’가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָן
  english_pob_choice: Haran
  chosen_korean: 하란
  alternatives_korean:
  - 하란 성
  lexicon: HALOT
  rationale: 고유 지명으로 보아 음역하는 것이 원문을 가장 투명하게 반영합니다.
- source_word: כַנֵּה
  english_pob_choice: Canneh
  chosen_korean: 간네
  alternatives_korean:
  - 가르네
  - 칼네
  lexicon: HALOT
  rationale: 원문 자음형을 따라 음역했습니다. 영어 POB의 Canneh를 한국어로 옮기되, 전통적 대안인 칼네는 각주로 남깁니다.
- source_word: עֶדֶן
  english_pob_choice: Eden
  chosen_korean: 에덴
  alternatives_korean:
  - 동산 에덴
  lexicon: HALOT
  rationale: 여기서는 창조 서사의 동산이 아니라 지명 목록이므로, 고유 지명으로 음역하는 것이 적절합니다.
- source_word: רֹכְלֵי
  english_pob_choice: the merchants of
  chosen_korean: 상인들
  alternatives_korean:
  - 장사하는 이들
  - 무역상들
  lexicon: HALOT
  rationale: 스바를 수식하는 명사구로서 상업 활동을 나타내므로, 한국어에서는 자연스럽게 ‘상인들’로 옮겼습니다.
- source_word: רֹכַלְתֵּךְ
  english_pob_choice: traded with you
  chosen_korean: 거래했습니다
  alternatives_korean:
  - 무역했습니다
  - 장사했습니다
  lexicon: HALOT
  rationale: 두 번째인칭 여성 단수 접미사를 가진 상업적 완료형으로, 두로와의 상업적 교섭을 현대 한국어로 간결하게 살렸습니다.
theological_decisions:
- issue: 지명 나열의 기능
  chosen_reading: 이 절은 두로와 교역한 여러 지역/민족의 목록을 제시하는 상업 예언으로 읽고, 신학적 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 두로의 국제적 번영을 강조하는 찬가로 읽기
  - 각 지명을 상징적 인물 집단으로 확대 해석하기
  rationale: 히브리어 본문은 고유명사와 상업 동사를 통해 거래 관계를 열거할 뿐이므로, 원문이 보장하지 않는 상징화는 피했습니다.
  doctrine_reference: 본문 문맥 우선, 직역성 유지
