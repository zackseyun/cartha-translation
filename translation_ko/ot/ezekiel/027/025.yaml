  source_fidelity: 초안은 다르싯의 배, 상품, 가득 참, 무거워짐, 바다 가운데라는 핵심 요소를 대체로 충실히 담았습니다. 그러나 ‘바다의 중심에 있었습니다’는 히브리어의 장소구를 ‘무거워짐’과 충분히 결부하지 못하고, 별도의 정태적 서술처럼 들립니다.
