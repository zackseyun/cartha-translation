  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
  footnotes:
  - marker: a
    text: Or 'The ships of Tarshish were your carriers for your wares.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the heart of the seas,' an idiom for the midst or depths of the sea.
    reason: cultural_note
translation:
  language: ko
  text: 다르싯의 배들이 당신의 상품 운반선이 되었고, 당신은 채워지고 매우 무거워져 바다의 중심에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘바다의 중심/한가운데’라는 관용구를 사용하며, 깊은 바다의 가운데를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: The ships of Tarshish
  chosen_korean: 다르싯의 배들
  alternatives_korean:
  - 다르싯의 선박들
  - 다르싯의 무역선들
  lexicon: HALOT
  rationale: 지명-소유 구문을 한국어 자연문으로 옮기되, 원문의 관용적 표현을 살려 ‘다르싯의 배들’로 렌더링했습니다.
- source_word: שָׁרוֹתַיִךְ
  english_pob_choice: were your carriers
  chosen_korean: 당신의 상품 운반선이 되었고
  alternatives_korean:
  - 당신의 운반자였습니다
  - 당신의 캐러밴이었습니다
  - 당신의 수송선이 되었습니다
  lexicon: HALOT
  rationale: 문맥상 배들이 두로의 상품을 실어 나르는 기능을 하므로 ‘운반선’으로 구체화했습니다. 영어 POB의 carriers를 한국어로 옮기되, 선박 이미지가 유지되도록 했습니다.
- source_word: מַעֲרָבֵךְ
  english_pob_choice: for your merchandise
  chosen_korean: 당신의 상품
  alternatives_korean:
  - 당신의 물품
  - 당신의 무역품
  - 당신의 재화
  lexicon: HALOT
  rationale: 여기서는 상업적 거래물 자체를 가리키므로 가장 직접적인 ‘상품’을 사용했습니다.
- source_word: בְּלֵב יַמִּים
  english_pob_choice: in the heart of the seas
  chosen_korean: 바다의 중심에
  alternatives_korean:
  - 바다의 한가운데에
  - 바다의 깊은 곳에
  - 바다의 중심부에
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 설명하지 않으면서도, 중심·한가운데의 의미를 살려 ‘바다의 중심에’로 번역했습니다.
theological_decisions:
- issue: 마지막 장소 표현의 관용성
  chosen_reading: ‘바다의 중심에’로 옮겨, 히브리어 관용구가 주는 시적·심상적 효과를 유지했습니다.
  alternative_readings:
  - ‘바다 한가운데에’
  - ‘깊은 바다에’
  rationale: 이 구절은 교리 논점보다 시적 이미지가 핵심이므로, 직역과 자연성을 함께 살리는 쪽을 택했습니다.
  doctrine_reference: 시적 비유와 예언 문학의 관용 표현 처리
