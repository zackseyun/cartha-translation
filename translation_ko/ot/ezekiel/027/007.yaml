  text: שֵׁשׁ בְּ/רִקְמָ֤ה מִ/מִּצְרַ֨יִם֙ הָיָ֣ה מִפְרָשֵׂ֔/ךְ לִ/הְי֥וֹת לָ֖/ךְ לְ/נֵ֑ס תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן מֵ/אִיֵּ֥י אֱלִישָׁ֖ה הָיָ֥ה מְכַסֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
  footnotes:
  - marker: a
    text: Or 'from the islands of Elishah.' The Hebrew can refer to islands or coastlands.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be your ensign/standard.' The Hebrew נֵס denotes a banner, standard, or signal visible from afar.
    reason: lexical_alternative
translation:
  language: ko
  text: 애굽의 정교한 수놓은 고운 베가 너의 돛이었고, 네 깃발이 되었습니다[a][b]. 엘리사의 해안들에서 온 청색과 자색이 너를 덮는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘리사의 섬들에서 온’. 히브리어는 섬들 또는 해안지대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 깃발/표지가 되도록’. 히브리어 נֵס는 멀리서 보이는 깃발, 표준, 또는 신호를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  english_pob_choice: fine embroidered linen
  chosen_korean: 정교한 수놓은 고운 베
  alternatives_korean:
  - 고운 베
  - 수놓은 베
  - 고운 수놓은 베
  lexicon: HALOT
  rationale: שֵׁשׁ의 고급 직물 뉘앙스를 살려 ‘고운 베’로 옮기고, בְּרִקְמָה의 장식된 직물 의미를 ‘정교한 수놓은’으로 반영했습니다.
- source_word: מִפְּרָשֵׂךְ
  english_pob_choice: your sail
  chosen_korean: 너의 돛
  alternatives_korean:
  - 네 돛
  - 너의 펼친 천
  - 너의 돛천
  lexicon: HALOT
  rationale: 해상 비유의 문맥에서 מִפְרָשׂ는 ‘돛’이 가장 자연스럽고, 한국어에서도 바로 인지되는 항해 용어이기 때문입니다.
- source_word: לְנֵס
  english_pob_choice: serving as your banner
  chosen_korean: 네 깃발이 되었습니다
  alternatives_korean:
  - 네 깃발이 되도록
  - 네 깃발처럼
  - 네 표지가 되었습니다
  lexicon: HALOT
  rationale: נֵס의 ‘보이는 깃발/표지’ 기능을 살리되, 한국어에서는 문맥상 결과적 진술로 풀어 ‘깃발이 되었습니다’라고 옮겼습니다.
- source_word: מֵאִיֵּי אֱלִישָׁה
  english_pob_choice: from the coasts of Elishah
  chosen_korean: 엘리사의 해안들에서 온
  alternatives_korean:
  - 엘리사의 섬들에서 온
  - 엘리사의 해안에서 온
  lexicon: HALOT
  rationale: אִיִּים이 ‘섬들’ 또는 ‘해안지대’ 모두를 가리킬 수 있어, POB의 주석을 반영해 해안들로 옮겼습니다.
theological_decisions:
- issue: 직유적 해상 이미지의 보존
  chosen_reading: 타이어의 화려한 무역품을 배의 장식과 깃발, 덮개로 연결하는 비유를 그대로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 일반적 화려함만 강조하는 번역
  - 배의 장비를 더 기술적으로 특정하는 번역
  rationale: 이 절은 상징적 해상 이미지가 핵심이므로, 비유를 완화하지 않고 ‘돛/깃발/덮는 것’의 구조를 유지하는 것이 본문의 의도를 가장 잘 드러냅니다.
  doctrine_reference: 문학적-예언적 비유의 보존
- issue: ‘네 깃발이 되었습니다’의 문장화
  chosen_reading: נֵס를 단순한 ‘표지’보다 공개적으로 드러나는 ‘깃발’로 옮기고, 서술형으로 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘네 표지가 되었습니다’
  - ‘네 깃발처럼 되었습니다’
  - ‘너를 위한 신호가 되었습니다’
  rationale: 문맥상 이동 중인 배의 시각적 장식이므로 ‘깃발’이 가장 직접적이며, 한국어 합쇼체에서 매끄럽게 읽히도록 서술형으로 정리했습니다.
  doctrine_reference: 예언문학의 상징어 번역
