  text: בְּנֵ֧י אַרְוַ֣ד וְ/חֵילֵ֗ךְ עַל חוֹמוֹתַ֨יִ/ךְ֙ סָבִ֔יב וְ/גַ֨מָּדִ֔ים בְּ/מִגְדְּלוֹתַ֖יִ/ךְ הָי֑וּ שִׁלְטֵי/הֶ֞ם תִּלּ֤וּ עַל חוֹמוֹתַ֨יִ/ךְ֙ סָבִ֔יב הֵ֖מָּה כָּלְל֥וּ יָפְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
  footnotes:
  - marker: a
    text: Hebrew גַמָּדִים is obscure. It is rendered here as an ethnic name, 'the Gammadites'; alternatively, some understand it more generally as 'warriors' or preserve the spelling 'Gamadites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아르왓의 아들들과 당신의 군대가 사방의 당신의 성벽 위에 있었고, 감마디 사람들은 당신의 망대들에 있었습니다. 그들이 사방의 당신의 성벽 위에 자기들의 방패를 걸어 두었으니, 그들이 당신의 아름다움을 완전하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감마디 사람들’은 히브리어 גַמָּדִים의 의미가 불확실해 붙인 음역입니다. 영어 본문도 이를 민족명으로 처리하며, ‘전사들’로 이해하거나 ‘가마디 사람들’로 철자에 더 가깝게 옮길 여지도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  english_pob_choice: The sons of Arvad
  chosen_korean: 아르왓의 아들들
  alternatives_korean:
  - 아르왓의 사람들
  - 아르왓의 남자들
  lexicon: HALOT
  rationale: 히브리어의 민족·거주지 표현을 한국어에서 자연스럽게 풀어, 원문의 고유명사와 집단성을 함께 살렸습니다.
- source_word: גַמָּדִים
  english_pob_choice: the Gammadites
  chosen_korean: 감마디 사람들
  alternatives_korean:
  - 가마디 사람들
  - 감마드 사람들
  lexicon: HALOT
  rationale: 의미가 불확실한 어휘이므로 POB의 민족명 처리에 맞춰 음역을 유지했고, 영어 주석의 불확실성을 반영해 ‘사람들’로 최소한의 집단성을만 드러냈습니다.
- source_word: שִׁלְטֵיהֶם
  english_pob_choice: their shields
  chosen_korean: 자기들의 방패
  alternatives_korean:
  - 그들의 방패
  - 방패들
  lexicon: HALOT
  rationale: 문맥상 군사 장비의 집단적 소유를 드러내기 위해 ‘자기들의’로 자연스럽게 옮겼고, 단수적 총칭보다 한국어에서 더 구체적입니다.
- source_word: כָּלְלוּ יָפְיֵךְ
  english_pob_choice: they perfected your beauty
  chosen_korean: 당신의 아름다움을 완전하게 했습니다
  alternatives_korean:
  - 당신의 아름다움을 완성했습니다
  - 당신의 아름다움을 온전하게 했습니다
  lexicon: HALOT
  rationale: כָּלְלוּ의 ‘완성/완전케 함’과 시적 종결감을 살리되, ‘완전하게 하다’가 POB의 ‘perfected’에 가장 가깝습니다.
theological_decisions:
- issue: 시적 의인화와 도시의 ‘아름다움’ 묘사
  chosen_reading: 두로의 성벽과 망대에 배치된 방패와 병력이 도시의 아름다움을 더해 주는 것으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 도시의 위엄을 더했습니다
  - 도시를 더욱 아름답게 했습니다
  rationale: 본문은 군사적 방어 요소를 장식처럼 묘사하는 풍자적 시문이므로, ‘아름다움’을 완화하지 않고 그대로 살리는 편이 원문의 효과를 보존합니다.
  doctrine_reference: 예언서 시적 풍자와 도시 심판의 이미지
