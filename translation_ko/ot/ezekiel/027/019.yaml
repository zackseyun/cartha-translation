  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
  footnotes:
  - marker: a
    text: Hebrew 'Dan'; some read 'Vedan' or otherwise emend the name because the text is difficult.
    reason: textual_variant
  - marker: b
    text: Or 'Javan from Uzal.' The relation between 'Javan' and 'Uzal' is syntactically difficult in Hebrew.
    reason: alternative_reading
  - marker: c
    text: Or 'calamus' or 'sweet cane.'
    reason: lexical_alternative
translation:
  language: ko
  text: 단과 우살 출신 야완은 네 상품을 거래했고, 가공한 철과 계피와 향기로운 갈대를 네 교역품으로 내놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘단’으로 읽히지만, 본문이 어려워 일부는 이를 ‘베단’으로 읽거나 본문을 고칩니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘야완과 우살’. 히브리어에서 ‘야완’과 ‘우살’의 문법적 관계는 난해합니다.
    reason: alternative_reading
  - marker: c
    text: ‘향기로운 갈대’는 ‘창포’ 또는 ‘칼라무스’로도 옮길 수 있습니다.
    reason: lexical_alternative
