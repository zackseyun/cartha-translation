    issue: ‘단과 야완과 우살에서 온 자들’이 지명 관계를 과도하게 확정하고 문법상 단과 야완 모두가 우살 출신인 듯하게 만듭니다.
    rationale: 히브리어 וְיָוָן מְאוּזָּל의 연결은 논쟁적입니다. 영어 POB의 주 독법을 따라 야완을 우살과 연결하되, 대안은 각주에서 밝혀야 합니다.
