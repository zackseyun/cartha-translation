base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
  footnotes:
  - marker: a
    text: Hebrew 'Dan'; some read 'Vedan' or otherwise emend the name because the text is difficult.
    reason: textual_variant
  - marker: b
    text: Or 'Javan from Uzal.' The relation between 'Javan' and 'Uzal' is syntactically difficult in Hebrew.
    reason: alternative_reading
  - marker: c
    text: Or 'calamus' or 'sweet cane.'
    reason: lexical_alternative
translation:
  language: ko
  text: 단과 야완과 우살에서 온 자들이 당신과 거래하였고, 그들은 단련한 철과 계피와 갈대를 당신의 상품과 바꾸어 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘단’으로 읽히지만, 본문이 어렵기 때문에 ‘베단’으로 고치거나 다르게 읽는 견해가 있습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어에서는 ‘야완’과 ‘우살’의 관계가 문법적으로 다소 난해합니다.
    reason: alternative_reading
  - marker: c
    text: ‘계피’는 ‘카시아’ 또는 ‘향긋한 갈대’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  english_pob_choice: Dan
  chosen_korean: 단
  alternatives_korean:
  - 베단
  lexicon: HALOT
  rationale: 본문의 자음형을 따라 고유명사 ‘Dan’을 음역했으며, 본문이 난해해 ‘베단’으로 보는 대안은 각주로 처리하는 편이 적절합니다.
- source_word: וְיָוָן
  english_pob_choice: Javan
  chosen_korean: 야완
  alternatives_korean:
  - 그리스
  - 이오니아인
  lexicon: HALOT
  rationale: 상업 명단의 고유명사로 보고 해석적 지명화보다 음역을 택했습니다.
- source_word: מְאוּזָּל
  english_pob_choice: from Uzal
  chosen_korean: 우살에서 온
  alternatives_korean:
  - 메우살에서 온
  - 우살
  lexicon: HALOT
  rationale: 전치사 결합을 살려 ‘~에서 온’으로 옮겨, 상인/지명 목록의 흐름을 자연스럽게 유지했습니다.
- source_word: בְּעִזְבוֹנַיִךְ
  english_pob_choice: traded with you
  chosen_korean: 당신과 거래하였고
  alternatives_korean:
  - 당신의 상품과 거래하였고
  - 당신의 물품 가운데서
  lexicon: HALOT
  rationale: 명사 자체의 ‘상품, 교역품’ 의미를 상업적 동사구로 풀어, 교역 맥락을 한국어에서 분명하게 드러냈습니다.
- source_word: בַּרְזֶל עָשׁוֹת
  english_pob_choice: wrought iron
  chosen_korean: 단련한 철
  alternatives_korean:
  - 가공한 철
  - 철제품
  lexicon: HALOT
  rationale: ‘철’에 작업된 상태를 나타내는 표현으로, 원문의 가공된 금속이라는 뜻을 간결하게 살렸습니다.
- source_word: קִדָּה
  english_pob_choice: cassia
  chosen_korean: 계피
  alternatives_korean:
  - 카시아
  - 향신료
  lexicon: HALOT
  rationale: 상업 목록의 향료 항목으로 이해하여, 한국어에서 널리 통용되는 명칭을 사용했습니다.
- source_word: וְקָנֶה
  english_pob_choice: cane
  chosen_korean: 갈대
  alternatives_korean:
  - 카람
  - 사탕수수
  lexicon: HALOT
  rationale: 원문이 가리키는 식물성 재료를 일반 독자가 이해하기 쉬운 ‘갈대’로 옮겼습니다.
- source_word: בְּמַעֲרָבֵךְ
  english_pob_choice: for your wares
  chosen_korean: 당신의 상품과 바꾸어 주었습니다
  alternatives_korean:
  - 당신의 물품을 위하여
  - 당신의 교역품을 위해
  lexicon: HALOT
  rationale: 문맥상 단순한 장소 부사가 아니라 교환 대상의 상업적 관계를 나타내므로, 교환 동작을 명시해 의미를 살렸습니다.
theological_decisions:
- issue: 상업 목록의 서술 방식
  chosen_reading: 예언적 항해/무역 목록의 사실적 열거로 읽고, 수사적 장식이나 영적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 상징적 열강 열거
  - 도덕적 교훈이 강조된 독해
  rationale: 문맥이 두로의 교역 상대와 물품을 열거하는 상업 장면이므로, 원문의 정보량을 그대로 전달하는 쪽이 적절합니다.
  doctrine_reference: 문맥 우선 원칙
