source:
  edition: WLC
  text: בְּ/צֵ֤את עִזְבוֹנַ֨יִ/ךְ֙ מִ/יַּמִּ֔ים הִשְׂבַּ֖עַתְּ עַמִּ֣ים רַבִּ֑ים בְּ/רֹ֤ב הוֹנַ֨יִ/ךְ֙ וּ/מַ֣עֲרָבַ֔יִ/ךְ הֶעֱשַׁ֖רְתְּ מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
  footnotes:
  - marker: a
    text: Or 'your goods' for 'your wares' (עִזְבוֹנַיִךְ); both refer to Tyre's trade cargo in this lament.
    reason: lexical_alternative
  - marker: b
    text: Or 'the kings of the land' for 'the kings of the earth'; Hebrew אֶרֶץ can mean either depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 물품이 여러 바다[a]에서 나올 때에, 너는 많은 민족을 만족시켰습니다. 네 풍부한 재물과 네 교역품으로 너는 땅[b]의 왕들을 부유하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형으로, 직역하면 ‘바다들’입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘세상의 왕들’. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת / עִזְבוֹנַיִךְ
  english_pob_choice: When your wares went out
  chosen_korean: 당신의 상품이 … 나오자
  alternatives_korean:
  - 당신의 물품이 … 나가자
  - 당신의 물품이 … 유통되자
  lexicon: HALOT
  rationale: বצאת의 시간적 절과 상업용어 עִזְבוֹנַיִךְ를 함께 살려, 항구도시 두로의 무역품이 ‘나오는’ 장면을 자연스럽게 옮겼습니다. '상품'은 상업 맥락을 유지하면서도 ‘물품’보다 더 경제적이고 본문 전체의 거래 이미지를 잘 드러냅니다.
- source_word: מִיַּמִּים
  english_pob_choice: from the seas
  chosen_korean: 바다들에서
  alternatives_korean:
  - 바다에서
  - 여러 바다에서
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 단수로 완전히 평준화하지 않고 ‘바다들’로 옮겼습니다. 다만 한국어에서는 지나치게 기형적이지 않도록 조사와 어순을 자연화했습니다.
- source_word: הִשְׂבַּעַתְּ
  english_pob_choice: you satisfied
  chosen_korean: 만족시켰습니다
  alternatives_korean:
  - 배부르게 했습니다
  - 채워 주었습니다
  lexicon: HALOT
  rationale: הִשְׂבִּיעַ의 기본 의미인 ‘만족시키다/배부르게 하다’를 따라, 상업적 풍요가 여러 민족의 필요와 욕구를 채웠다는 뜻을 살렸습니다. ‘만족시켰습니다’는 본문의 결과를 가장 직접적으로 전달합니다.
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 민족
  alternatives_korean:
  - 많은 백성
  - 많은 나라들
  lexicon: HALOT
  rationale: עַמִּים는 민족/백성의 집합을 가리키므로, 현대 한국어에서 민족이 가장 무리 없이 그 집합적 뉘앙스를 전달합니다. ‘나라들’은 현대 국가 개념을 과하게 불러올 수 있어 피했습니다.
- source_word: מַלְכֵי אָרֶץ
  english_pob_choice: the kings of the earth
  chosen_korean: 땅의 왕들
  alternatives_korean:
  - 세상의 왕들
  - 그 땅의 왕들
  lexicon: HALOT
  rationale: POB의 ‘earth’를 너무 해석적으로 풀지 않고, 히브리어 ארץ의 넓은 지평을 반영하여 ‘땅’으로 옮겼습니다. 국제적 교역의 장면에서는 ‘땅의 왕들’이 본문의 장엄한 표현을 보존합니다.
theological_decisions:
- issue: 두로의 상업적 번영이 가져온 결과를 어떻게 표현할지
  chosen_reading: 무역의 풍요가 많은 민족을 만족시키고 땅의 왕들을 부유하게 했다는 진술로 직설적으로 옮겼습니다.
  alternative_readings:
  - 윤리적 평가를 덧붙여 ‘사치하게 했다’고 옮길 수 있음
  - 더 완곡하게 ‘이롭게 했다’고 옮길 수 있음
  rationale: 이 절은 조롱이나 평가를 덧붙이기보다, 두로의 상업력이 얼마나 넓은 범위에 영향을 미쳤는지를 묘사합니다. לכן 원문의 경제적-제국적 과장을 그대로 드러내는 쪽이 본문의 수사와 의도를 더 잘 보존합니다.
  doctrine_reference: 본문 내 수사 보존 원칙
