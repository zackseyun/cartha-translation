  source_fidelity: 원문의 시간 절(בְּצֵאת), 복수형 ‘바다들’(מִיַּמִּים), 상업적 풍요, 그리고 ‘땅/세상’(אָרֶץ)의 의미 범위가 대체로 반영되었습니다. 다만 ‘나오자’는 즉시성을 암시할 수 있어 단순 시간 관계를 나타내는 ‘나올 때에’가 더 정확합니다. 두 상업 명사의 구별도 ‘물품’과 ‘교역품’으로 드러내는 편이 안전합니다.
  naturalness: ‘당신의’는 도시 두로를 향한 예언적 호칭으로 한국어에서 부자연스럽고 불필요하게 대인 존칭의 느낌을 냅니다. 성경적 직접 호칭으로 자연스러운 ‘네/너는’을 쓰되, 문장 종결은 요청된 현대 합쇼체로 유지했습니다. ‘여러 바다’는 히브리어 복수를 보존하면서 ‘바다들’보다 자연스럽습니다.
  terminology: עִזְבוֹנַיִךְ는 ‘물품’, מַעֲרָבַיִךְ는 ‘교역품’으로 달리 옮겨 상업 어휘의 반복을 피하면서도 의미를 보존했습니다. אָרֶץ는 본문상 광범위한 ‘땅’으로 번역하고, ‘세상’이라는 가능한 대안을 각주로 남겼습니다.
