    rationale: בְּצֵאת은 ‘나갈 때에/나갔을 때에’라는 시간 절입니다. ‘나오자’는 ‘~하자마자’의 즉시성을 더할 수 있으므로 ‘나올 때에’로 고쳤습니다.
  - severity: low
    issue: 각주 표지의 위치와 두 상업 명사의 반복
    rationale: 각주는 해당 어휘 바로 뒤에 두어 참조 대상을 분명히 해야 합니다. 또한 ‘상품’을 두 번 반복하기보다 서로 관련되지만 구별되는 히브리어 상업 명사를 ‘물품’과 ‘교역품’으로 구별했습니다.
