    reason: lexical_alternative
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  english_pob_choice: Damascus
  chosen_korean: 다마스쿠스
  alternatives_korean:
  - 다메섹
  lexicon: 고유명사 일반 표기
  rationale: 히브리어 지명을 현대 한국어 표기 관례에 따라 옮겼습니다. 본문은 도시 이름이 주어이므로 음역을 유지하는 것이 적절합니다.
- source_word: סֹחַרְתֵּךְ
  english_pob_choice: traded with you
  chosen_korean: 당신과 거래하였습니다
  alternatives_korean:
  - 당신과 무역하였습니다
  - 당신의 상인이었습니다
  lexicon: HALOT
  rationale: 상업적 상호관계를 나타내는 סחר의 뜻을 살려, 현대 한국어에서 자연스러운 ‘거래하다’를 택했습니다. 여성 단수 접미사는 두로를 직접 가리키는 2인칭 여성형입니다.
- source_word: בְּרֹב מַעֲשַׂיִךְ
  english_pob_choice: because of your many products
  chosen_korean: 당신의 많은 생산물 때문에
  alternatives_korean:
  - 당신의 많은 물품 때문에
  - 당신의 풍성한 산물 때문에
  lexicon: HALOT
  rationale: 마ַעֲשֶׂה를 이 상업 목록 문맥에서 ‘제품/생산물’로 이해해, 상업적 산출물을 분명히 드러냈습니다. בְּ는 원인/사유를 나타내는 뜻으로 옮겼습니다.
- source_word: בְּיֵין חֶלְבּוֹן
  english_pob_choice: with wine of Helbon
  chosen_korean: 헬본의 포도주와
  alternatives_korean:
  - 헬본 포도주와
  - 헬본에서 난 포도주와
  lexicon: HALOT
  rationale: 지명과 연관된 특산품 표현이므로 소유격적 연결을 유지해 ‘헬본의 포도주’로 옮겼습니다. 목록 구조를 살리기 위해 조사 연결도 자연스럽게 맞췄습니다.
theological_decisions:
- issue: 상업 조롱/예언 문맥의 직설성
  chosen_reading: 두로를 향한 예언적 거래 목록의 문맥을 유지하여, ‘거래하였습니다’처럼 상업 관계를 직접적으로 드러냈습니다.
  alternative_readings:
  - 부드럽게 의역하여 ‘교역하였습니다’라고 할 수 있음
  rationale: 이 구절은 도시 간 무역을 나열하는 본문이므로, 의미를 완화하지 않고 상업적 관계를 명시하는 번역이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 예언서 문맥의 문자-역사적 의미 보존
