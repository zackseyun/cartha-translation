source:
  edition: WLC
  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
  footnotes:
  - marker: a
    text: Or 'Arab' / 'the Arabians.' The Hebrew proper name can denote the Arabian region or its people.
    reason: alternative_reading
  - marker: b
    text: Literally 'merchants of your hand,' an idiom meaning those who traded with you.
    reason: lexical_alternative
translation:
  language: ko
  text: 아라비아와 게달의 모든 우두머리들이 — 그들은 당신의 상인들이었습니다[a] — 어린양과 숫양과 숫염소[b]를 가지고, 그것들로 당신과 거래했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 손의 상인들’이라는 관용구로, ‘당신과 거래하던 상인들’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 세 종류의 가축을 구별해 나열합니다.
    reason: source_note
lexical_decisions:
- source_word: עֲרַב
  english_pob_choice: Arabia
  chosen_korean: 아라비아
  alternatives_korean:
  - 아랍
  - 아랍인들
  lexicon: HALOT
  rationale: 지명으로 읽는 문맥상 한국어에서도 지역명인 ‘아라비아’가 가장 자연스럽고, 사람 집단은 뒤의 ‘상인들’로 충분히 드러납니다.
- source_word: נְשִׂיאֵי
  english_pob_choice: princes
  chosen_korean: 우두머리들
  alternatives_korean:
  - 족장들
  - 방백들
  lexicon: HALOT
  rationale: 게달의 지도층을 가리키는 말로서, ‘우두머리들’은 위계적 의미를 유지하면서도 현대 한국어에서 과도하게 왕족화하지 않습니다.
- source_word: סֹחֲרֵי יָדֵךְ
  english_pob_choice: your traders
  chosen_korean: 당신의 상인들
  alternatives_korean:
  - 당신의 무역상들
  - 당신과 거래하던 자들
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 손의 상인들’이지만, 관용적 의미는 거래 관계에 있는 상인들이므로 자연스러운 한국어로 풀어 옮겼습니다.
- source_word: כָרִים / אֵילִים / עַתּוּדִים
  english_pob_choice: lambs, rams, and male goats
  chosen_korean: 어린양과 숫양과 숫염소
  alternatives_korean:
  - 새끼양과 숫양과 숫염소
  - 양과 숫양과 염소
  lexicon: HALOT
  rationale: 세 품목의 구별을 살리기 위해, 각각 ‘어린양’, ‘숫양’, ‘숫염소’로 번역하여 목록의 대비를 보존했습니다.
theological_decisions:
- issue: 상업 목록의 기능적 번역
  chosen_reading: 본절은 두로와 주변 민족 간의 교역 관계를 열거하는 문맥이므로, 상업적 관용구를 한국어로 자연화하되 물품 목록과 거래 행위의 구조는 유지했습니다.
  alternative_readings:
  - 원문형에 더 붙여 ‘당신의 손의 상인들’로 옮김
  - 더 의역하여 ‘당신과 거래하던 자들’로 옮김
  rationale: 예언서의 상업 풍자/애가 문맥에서 거래 관계가 핵심이므로, 과도한 직역으로 의미를 흐리지 않으면서도 원문의 구조를 보존하는 쪽이 적절합니다.
  doctrine_reference: 문맥상 해석 원칙; 본문 신학 교리 쟁점 없음
