base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
  footnotes:
  - marker: a
    text: Or 'Arab' / 'the Arabians.' The Hebrew proper name can denote the Arabian region or its people.
    reason: alternative_reading
  - marker: b
    text: Literally 'merchants of your hand,' an idiom meaning those who traded with you.
    reason: lexical_alternative
translation:
  language: ko
  text: 아라비아와 게달의 모든 지도자들은 당신과 거래하던 상인들이었습니다[a]. 그들은 어린양과 숫양과 숫염소[b]를 거래했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 손의 상인들’이라는 관용구로, ‘당신과 거래하던 상인들’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 어린양, 숫양, 숫염소의 세 종류를 구별하여 나열합니다.
    reason: source_note
lexical_decisions:
- source_word: עֲרַב
  english_pob_choice: Arabia
  chosen_korean: 아라비아
  alternatives_korean:
