  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
  footnotes:
  - marker: a
    text: Or 'Who is like Tyre, brought to silence in the midst of the sea?' The Hebrew term can denote being stilled, silenced, or laid waste.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'in their wailing' is textually and lexically difficult; some understand it differently, including readings related to 'their sons.' The mourning context favors the sense of lamenting cry.
    reason: textual_variant
translation:
  language: ko
  text: 그들이 너를 위하여 그들의 애도[a]를 들어 올리고 너를 위하여 슬피 울리리니, '바다 한가운데서 고요히 된 두로[b]와 같은 자가 누구냐' 할 것이니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바다 한가운데서 고요히 된 두로와 같은 자가 누구냐?' 히브리어 용어는 고요히 되다, 침묵되다, 또는 황폐하게 되다를 나타낼 수 있다.
    reason: alternative_reading
  - marker: b
    text: '''그들의 애도''로 번역된 구는 문법적, 어휘적으로 매우 어렵다; 어떤 이는 이를 다르게 이해하며, ''그들의 아들들''과 관련된 읽기를 포함한다. 애도의 맥락은 슬피 울리는 소리의 의미를 지지한다.'
    reason: alternative_reading
