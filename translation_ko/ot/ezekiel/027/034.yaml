translation:
  language: ko
  text: 네가 바다들에 의해 물의 깊은 곳에서 부서졌을 때, 네 무역품과 네 안에 있던 모든 무리가 쓰러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  english_pob_choice: At the time
  chosen_korean: ~했을 때
  alternatives_korean:
  - 그때
  - 그 시각에
  lexicon: HALOT
  rationale: 히브리어 명사형 시간표현을 한국어에서는 자연스러운 종속절로 풀어, 사건의 상황을 시간 부사구로 제시합니다.
- source_word: נִשְׁבֶּרֶת
  english_pob_choice: you were broken
  chosen_korean: 부서졌을 때
  alternatives_korean:
  - 산산이 부서졌을 때
  - 깨졌을 때
  lexicon: HALOT
  rationale: 피동 의미를 살리면서도 해양 파괴의 이미지를 과장하지 않도록 ‘부서지다’를 택했습니다.
- source_word: מַעֲרָבֵךְ
  english_pob_choice: your merchandise
  chosen_korean: 너의 상품
  alternatives_korean:
  - 너의 무역품
  - 너의 물품
  lexicon: HALOT
  rationale: 무역·상업 맥락의 화물/거래품을 가리키므로, 보다 직역에 가까운 ‘상품’으로 옮겼습니다.
- source_word: קְהָלֵךְ
  english_pob_choice: your assembly
  chosen_korean: 너의 모든 회중
  alternatives_korean:
  - 너의 모든 모인 무리
  - 너의 모든 무리
  lexicon: HALOT
  rationale: 집합된 사람들의 총체를 나타내는 קהל의 기본 의미를 살려 ‘회중’으로 옮기되, 범위를 넓히는 ‘모든’을 넣어 도시 안의 사람들과 무리를 포괄했습니다.
theological_decisions:
- issue: 두 번째 인칭 여성형을 한국어에서 어떻게 유지할지
  chosen_reading: 동사와 대명사에서 일관되게 ‘너/네’로 옮겨, 두로를 의인화된 여성으로 부르는 המקרא의 수사적 형식을 보존했습니다.
  alternative_readings:
  - ‘당신’으로 완화하기
  - 도시명으로 바꾸어 인칭을 희석하기
  rationale: 본문은 도시 두로를 직접 호명하는 예언적 애가이므로, 인칭과 성별 표지를 지우지 않는 것이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 예언서의 의인화 수사와 직접 호명 유지
- issue: ‘무너져 내렸다’의 선택
  chosen_reading: נָפָלוּ를 단순한 ‘떨어졌다’보다 파멸적 붕괴를 드러내는 ‘무너져 내렸다’로 옮겼습니다.
  alternative_readings:
  - ‘떨어졌습니다’
  - ‘무너졌습니다’
  rationale: 상업 공동체의 몰락을 말하는 문맥에서 단순 낙하보다 붕괴·몰락의 함의를 분명히 하는 것이 예언적 애가의 힘을 살립니다.
  doctrine_reference: 예언적 심판/애가 문맥
