revisions:
- from: 너는 바다들에 의해, 물들의 깊은 곳에서 부서졌을 때, 너의 상품과 너의 모든 회중이 네 가운데에서 무너져 내렸습니다.[a]
  to: 네가 바다들에 의해 물의 깊은 곳에서 부서졌을 때, 네 무역품과 네 안에 있던 모든 무리가 쓰러졌습니다.
  rationale: 두로를 향한 여성 단수 2인칭의 직접 호명은 ‘네가/네’로 유지했습니다. ‘바다들’, ‘물의 깊은 곳’, ‘부서졌을 때’는 원문의 복수 및 파괴 이미지를 과도하게 해석하지 않고 반영합니다. ‘무역품’과 ‘모든 무리’는 상업·선박 비유의 문맥과 집합 명사의 폭넓은 지시를 살리며, נָפָלוּ는 기본 의미에 맞게 ‘쓰러졌습니다’로 옮겼습니다. 기존 각주는 한국어에서 의미 있는 번역 대안을 제시하지 않으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:07Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 전달하지만, קָהָל을 ‘회중’으로 옮기면 현대 한국어에서 예배 공동체라는 종교적 의미가 강하게 들려 두로의 주민·상인·선원 등을 포함하는 집단이라는 원문의 폭넓은 뜻을 지나치게 좁힐 수 있습니다. 또한 נָפָלוּ의 기본 뜻은 ‘쓰러지다/떨어지다’이며, ‘무너져 내리다’는 상품까지 주어로 하는 문장에서는 다소 해석적입니다.
  naturalness: ‘너는’과 합쇼체 종결 ‘-습니다’의 결합은 문체상 다소 불균형합니다. 직접 호명은 유지하되 ‘네가/네’ 형태로 정리하면 현대적인 성경 문체로 더 자연스럽습니다. ‘물들의 깊은 곳’보다 ‘물의 깊은 곳’이 한국어에서 자연스럽고, 히브리어의 집합적 복수도 충분히 반영합니다.
  terminology: מַעֲרָבֵךְ는 이 장의 무역·선박 비유 문맥에서 ‘무역품’이 ‘상품’보다 구체적입니다. קְהָלֵךְ는 ‘모든 무리’로 옮겨 종교 제도어인 ‘회중’을 피하고 집합적 의미를 보존합니다. 신학적 용어와 고유명사는 본 절에 해당하지 않습니다.
  issues:
  - severity: medium
    issue: ‘회중’은 קְהָלֵךְ의 지시 범위를 종교 공동체로 오해하게 할 수 있습니다.
    rationale: 이 문맥의 קהל은 두로 안의 사람들 및 함께한 집단을 폭넓게 가리키므로 ‘모든 무리’가 더 중립적이고 충실합니다.
  - severity: low
    issue: ‘너는 … -습니다’의 문체 혼용
    rationale: 합쇼체 표준에서 ‘네가’로 직접 호명을 유지하면서 문장 전체의 격식을 안정시키는 편이 낫습니다.
  - severity: low
    issue: 기존 각주는 한국어 번역에서 실질적인 대안을 제공하지 않습니다.
    rationale: 원문 어순을 조금 바꾼 반복에 가깝고, 한국어에서는 시간 명사구와 종속절의 차이를 별도 각주로 유지할 필요가 없습니다.
  revised_text: 네가 바다들에 의해 물의 깊은 곳에서 부서졌을 때, 네 무역품과 네 안에 있던 모든 무리가 쓰러졌습니다.
