translation:
  language: ko
  text: 너는 바다들에 의해, 물들의 깊은 곳에서 부서졌을 때, 너의 상품과 너의 모든 회중이 네 가운데에서 무너져 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너는 바다들에 의해 물들의 깊은 곳에서 부서졌을 때’로 옮길 수 있습니다.
