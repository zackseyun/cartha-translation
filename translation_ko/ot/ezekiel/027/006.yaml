id: EZK.27.6
reference: Ezekiel 27:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַלּוֹנִים֙ מִ/בָּ֔שָׁן עָשׂ֖וּ מִשּׁוֹטָ֑יִ/ךְ קַרְשֵׁ֤/ךְ עָֽשׂוּ שֵׁן֙ בַּת אֲשֻׁרִ֔ים מֵ/אִיֵּ֖י כתים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
  footnotes:
  - marker: a
    text: Or 'they made your planks/boards of ivory.' The Hebrew term may refer more specifically to the ship's planking than to its deck.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew is difficult: ''ivory, daughter of Ashurim.'' Many understand this to refer to ivory inlaid in cypress or boxwood from Kittim.'
    reason: alternative_reading
  - marker: c
    text: '''Kittim'' likely refers to Cyprus or nearby western maritime regions.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 바산의 떡갈나무로 당신의 노를 만들었습니다[a]; 그들은 깃딤의 해안들에서 얻은 상아로 당신의 갑판을 만들었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 널판/판재를 만들었습니다.’ 히브리어는 배의 갑판보다 널판을 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 난해합니다. 직역하면 ‘상아, 아슈림의 딸’입니다. 많은 사람은 이것을 깃딤에서 온 삼나무나 회양목에 상아를 상감한 것으로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: ‘깃딤’은 아마도 키프로스 또는 그 주변의 서쪽 해양 지역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים מִבָּשָׁן
  english_pob_choice: oaks from Bashan
  chosen_korean: 바산의 떡갈나무
  alternatives_korean:
  - 바산의 상수리나무
  - 바산의 참나무
  lexicon: HALOT
  rationale: אַלּוֹנִים은 큰 목재를 가리키는 나무명으로, 조선적 자연명보다 현대 독자에게는 ‘떡갈나무’가 강한 목재라는 문맥을 잘 전달합니다. 지명 바산은 직역해 보존했습니다.
- source_word: מִשּׁוֹטַיִךְ
  english_pob_choice: your oars
  chosen_korean: 당신의 노
  alternatives_korean:
  - 당신의 노젓는 막대
  - 당신의 젓는 노
  lexicon: HALOT
  rationale: 배의 노를 뜻하므로 ‘노’가 가장 자연스럽고 간결합니다. 2인칭 여성형 소유를 ‘당신의’로 살렸습니다.
- source_word: שֵׁן
  english_pob_choice: ivory
  chosen_korean: 상아
  alternatives_korean:
  - 코끼리 이
  - 치아
  lexicon: HALOT
  rationale: 문맥상 재료를 가리키므로 문자적 ‘이’보다 재료명 ‘상아’가 적절합니다.
- source_word: בַּת אֲשֻׁרִים
  english_pob_choice: ivory from the coasts of Kittim
  chosen_korean: 깃딤의 해안들에서 얻은
  alternatives_korean:
  - 아슈림의 딸의
  - 아슈림의 자손의
  lexicon: HALOT
  rationale: 히브리어는 난해하지만, 영어 POB가 본문 흐름에 따라 재료의 산지를 붙여 읽는 방향을 취했으므로 한국어도 그 취지를 반영해 산지 표현으로 풀었습니다. 다만 원문 난점을 각주로 남겼습니다.
- source_word: מֵאִיֵּי כתים
  english_pob_choice: from the coasts of Kittim
  chosen_korean: 깃딤의 해안들
  alternatives_korean:
  - 깃딤의 섬들
  - 키프로스
  lexicon: HALOT
  rationale: אִיִּים은 섬들/해안지를 뜻할 수 있어 ‘해안들’이 시적이고 자연스럽습니다. 고유명은 전통적 음역 ‘깃딤’을 유지했습니다.
theological_decisions:
- issue: בַּת אֲשֻׁרִים의 난해한 구문 처리
  chosen_reading: 본문의 비유적·상업적 이미지가 자연스럽게 이어지도록 ‘깃딤의 해안들에서 얻은 상아’로 옮겼습니다.
  alternative_readings:
  - ‘아슈림의 딸인 상아’의 직역
  - ‘삼나무/회양목에 상감한 상아’로 보는 해석
  rationale: 이 절은 조선 제작 재료를 나열하는 문맥이므로, 의미가 불명확한 부분은 지나치게 문자적으로 고정하기보다 POB의 해석 방향을 따라 읽히는 한국어로 제시하되, 원문의 난점을 각주에 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥 해석과 난해 구절 처리 원칙
