  to: 게발[a]의 장로들과 그곳의 숙련된 사람들은 당신 안에서 당신의 손상된 부분[b]을 수리하였습니다. 바다의 모든 배와 그 선원들은 당신의 상품을 거래하기 위해[c] 당신 안에 있었습니다.
  rationale: 둘째 절을 목적 구문으로 재구성하여 לַעֲרֹב의 기능을 보존했습니다. 첫 절의 공간 표현은 ‘당신 안에서’로 다듬었고, 모든 각주를 대응하는 어구에 직접 연결했습니다. ‘손상된 부분’은 בֶּדֶק의 넓은 의미 범위를 유지합니다.
