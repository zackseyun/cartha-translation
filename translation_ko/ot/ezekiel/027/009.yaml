    rationale: ‘선원들도 당신 안에 있어 당신의 상품을 교역하였습니다’는 실제로 교역했다는 병렬 과거 사건처럼 읽힐 수 있습니다. 히브리어 부정사 לַעֲרֹב는 그들이 그곳에 있던 목적, 즉 상품을 거래하기 위함을 나타냅니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 대상이 불명확합니다.
    rationale: a는 ‘게발’, b는 ‘손상된 부분’, c는 ‘상품을 거래하기 위해’에 각각 붙여야 독자가 각주의 적용 범위를 즉시 알 수 있습니다.
