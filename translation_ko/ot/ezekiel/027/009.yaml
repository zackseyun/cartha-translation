id: EZK.27.9
reference: Ezekiel 27:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִקְנֵ֨י גְבַ֤ל וַ/חֲכָמֶ֨י/הָ֙ הָ֣יוּ בָ֔/ךְ מַחֲזִיקֵ֖י בִּדְקֵ֑/ךְ כָּל אֳנִיּ֨וֹת הַ/יָּ֤ם וּ/מַלָּֽחֵי/הֶם֙ הָ֣יוּ בָ֔/ךְ לַ/עֲרֹ֖ב מַעֲרָבֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
  footnotes:
  - marker: a
    text: Gebal is the Phoenician city later known in Greek as Byblos.
    reason: alternative_reading
  - marker: b
    text: Or 'repairing your breaches'; the Hebrew can refer to structural damage, cracks, or seams needing repair.
    reason: lexical_alternative
  - marker: c
    text: Or 'to barter for your wares.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게발[a]의 장로들과 그곳의 숙련된 사람들은 당신 안에서 당신의 손상된 부분[b]을 수리하였습니다. 바다의 모든 배와 그 선원들은 당신의 상품을 거래하기 위해[c] 당신 안에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게발은 후대 그리스어로 비블로스(Biblos)로 알려진 페니키아의 도시입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 틈들을 수리하며’; 히브리어는 구조적 손상, 균열, 벌어진 부분을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 상품을 맞바꾸기 위해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גְבָל
  english_pob_choice: The elders of Gebal
  chosen_korean: 게발의 장로들
  alternatives_korean:
  - 게발의 연장자들
  - 게발의 원로들
  lexicon: HALOT
  rationale: זִקְנֵי는 단순한 노인보다 공동체의 장로/원로를 가리키는 경우가 많으므로, 직함 성격을 살려 ‘장로들’로 옮겼습니다.
- source_word: חֲכָמֶיהָ
  english_pob_choice: her skilled men
  chosen_korean: 그곳의 숙련된 사람들
  alternatives_korean:
  - 그곳의 지혜로운 사람들
  - 그곳의 기술자들
  lexicon: HALOT
  rationale: 이 문맥은 항해·수선의 기술적 배경이므로 추상적 ‘지혜’보다 실제 솜씨를 가리키는 ‘숙련된 사람들’이 더 정확합니다.
- source_word: בִּדְקֵךְ
  english_pob_choice: your damage
  chosen_korean: 당신의 손상된 부분
  alternatives_korean:
  - 당신의 틈
  - 당신의 균열
  - 당신의 파손
  lexicon: HALOT
  rationale: בדק은 구조물의 손상, 틈, 벌어진 부분을 가리킬 수 있어, 한국어에서는 범위를 넓게 살려 ‘손상된 부분’으로 표현했습니다.
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  english_pob_choice: to trade for your merchandise
  chosen_korean: 당신의 상품을 교역하였습니다
  alternatives_korean:
  - 당신의 물품을 교환하였습니다
  - 당신의 상품을 거래하였습니다
  lexicon: HALOT
  rationale: 상업적 교환 행위라는 점을 살리되, 현대 한국어에서 자연스럽고 격식 있는 표현인 ‘교역하다’를 택했습니다.
theological_decisions:
- issue: 사람/도시를 향한 2인칭 표현 유지
  chosen_reading: 예루살렘이나 두로처럼 인격화된 도시에 대한 직접 호칭 구조를 한국어에서도 그대로 유지했습니다.
  alternative_readings:
  - 도시를 주어로 돌려 서술하는 방식
  - ‘그곳’ 중심의 비인칭 표현
  rationale: 히브리어의 2인칭 여성 단수 어미가 도시-배의 비유를 계속 이끌고 있으므로, 직설적 호칭을 보존해야 문맥의 수사적 긴장이 살아납니다.
  doctrine_reference: 성서 수사와 문맥 보존
- issue: ‘교역’의 상업적 중립성
  chosen_reading: ‘거래’보다 ‘교역’으로 옮겨, 본문이 비난이나 선교적 의미가 아니라 상업 활동을 말함을 분명히 했습니다.
  alternative_readings:
  - 거래하였습니다
  - 장사하였습니다
  rationale: 문맥상 해상 무역의 총칭이므로, 경제 활동의 공적·국제적 성격을 드러내는 ‘교역’이 가장 적절합니다.
  doctrine_reference: 문맥-의미 일치
