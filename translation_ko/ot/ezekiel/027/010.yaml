  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
  footnotes:
  - marker: a
    text: Or 'They hung shield and helmet on you,' with the image of military equipment displayed on Tyre's walls or within the city.
    reason: lexical_alternative
  - marker: b
    text: Or 'they contributed to your glory' / 'they bestowed your majesty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 페르시아와 룻과 붓은 당신의 군대에서 당신의 전사들이었습니다. 그들은 당신 안에 방패와 투구를 걸었습니다[a]. 그들이 당신에게 위엄을 더해 주었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 당신 위에 방패와 투구를 걸었다.’ 이는 두로의 성벽이나 도성 안에 군사 장비가 전시된 모습을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들이 당신의 영광을 더했다’ 또는 ‘그들이 당신의 위엄을 드러냈다.’
    reason: alternative_reading
