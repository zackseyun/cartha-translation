  - 방패와 투구를 당신 안에 걸어 두었고
  lexicon: HALOT
  rationale: תלה의 '매다/걸다' 이미지를 살리면서도 한국어에서 어색한 '안에' 반복을 줄여, 도시 내부에 무기와 갑옷이 전시된 장면을 읽히게 했습니다.
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  english_pob_choice: they gave you splendor
  chosen_korean: 그들이 당신에게 화려함을 더했습니다
  alternatives_korean:
  - 그들이 당신의 영광을 더했습니다
  - 그들이 당신에게 장엄함을 주었습니다
  lexicon: HALOT
  rationale: הדר의 '장엄함/화려함/영광' 범위를 고려해, 타르의 도시적 외양과 문맥에 맞는 '화려함'으로 옮기되 '더하다'를 써서 원문의 부여 행위를 드러냈습니다.
theological_decisions:
- issue: 무기와 병력의 예루살렘식/상징적 과장 대신, 두로의 정치·군사적 영광을 그대로 드러내는지 여부
  chosen_reading: 본문의 이미지 그대로, 외국 용병과 무기 전시가 두로의 화려함을 형성하는 장면으로 번역했습니다.
  alternative_readings:
  - 비유적으로 완화하여 '명예를 세웠습니다'로 옮길 수 있음
  - 장식적 의미만 살려 군사 이미지를 약화시킬 수 있음
  rationale: 원문은 군사력과 도시의 위용을 연결하므로, 의미를 평탄화하지 않고 전시된 방패·투구와 '화려함'의 연결을 유지하는 편이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 예언서의 심판/풍자적 상징 읽기
