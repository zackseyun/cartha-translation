  lexicon: HALOT
  rationale: חיל의 군사적 뜻과 뒤따르는 '전사들'을 함께 살려, 단순한 인원 배치가 아니라 전투 병력을 가리키는 중첩 표현을 한국어로 자연스럽게 옮겼습니다.
- source_word: מָגֵן וְכוֹבַע תִּלּוּ בָךְ
  english_pob_choice: they hung shield and helmet in you
  chosen_korean: 방패와 투구를 걸어 두었고
  alternatives_korean:
