  verdict: revise
  source_fidelity: 원문의 세 동작은 모두 미완료형으로, 두로의 멸망을 두고 하는 애도의 미래 행위를 묘사합니다. 초안은 이 구조와 애도 행위를 대체로 충실히 반영합니다. 다만 עָלַיִךְ는 이 애가 문맥에서 단순히 ‘너를 향해’라기보다 ‘너를 두고/너에 대하여’라는 애도의 대상을 나타내므로 이를 명확히 하는 편이 좋습니다. עַל רָאשֵׁיהֶם은 ‘머리 위에’보다 ‘머리에’가 직접적입니다.
  naturalness: ‘자기들의 소리’는 현대 표준어에서 다소 부자연스럽고, ‘목소리를 높이다’가 자연스럽습니다. ‘쓰라리게 부르짖다’도 가능하나 공개적 애도의 비통함에는 ‘비통하게 부르짖다’가 더 자연스럽고 분명합니다. 병렬 동사는 종결부의 미래형에 맞추어 자연스럽게 연결했습니다.
  terminology: ‘먼지’, ‘재’, ‘부르짖다’ 및 ‘뒹굴다’는 원문의 애도 어휘와 몸짓을 적절히 보존합니다. ‘몸을’은 히트파엘의 자기 관여를 드러낼 수 있으나 한국어에서는 불필요하게 무거울 수 있어 생략해도 뜻이 유지됩니다.
