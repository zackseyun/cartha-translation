id: EZK.27.30
reference: Ezekiel 27:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁמִ֤יעוּ עָלַ֨יִ/ךְ֙ בְּ/קוֹלָ֔/ם וְ/יִזְעֲק֖וּ מָרָ֑ה וְ/יַעֲל֤וּ עָֽפָר֙ עַל רָ֣אשֵׁי/הֶ֔ם בָּ/אֵ֖פֶר יִתְפַּלָּֽשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
  footnotes:
  - marker: a
    text: Or 'they will make their voice heard over you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will wallow in ashes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 너를 두고[a] 목소리를 높이며 비통하게 부르짖고, 그들의 머리에 먼지를 뿌리며, 재 속에서 뒹굴 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 향해’, ‘너에 대하여’로 옮길 수 있습니다.
    reason: עָלַיִךְ는 문맥상 두로를 대상으로 한 애도를 나타내며, 전치사의 정확한 뉘앙스는 ‘두고/향해/대하여’로 달리 표현될 수 있습니다.
  - marker: b
    text: 또는 ‘재에 구르며’, ‘재 속에서 몸을 뒹굴며’로 옮길 수 있습니다.
    reason: יִתְפַּלָּשׁוּ는 재 가운데서 구르거나 뒹구는 애도 행위를 가리킵니다.
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם
  english_pob_choice: They will make their voice heard over you
  chosen_korean: 너를 향해 자기들의 소리를 높이며
  alternatives_korean:
  - 너를 향해 자기들의 목소리를 들리게 하며
  - 너를 향해 자기들의 소리를 들으며
  - 너를 향해 소리치며
  lexicon: HALOT
  rationale: 히필 של שׁמע의 사역적 의미를 살리되, 한국어에서는 ‘소리를 높이다’가 애가/애도 상황의 공개적 통곡을 자연스럽게 전달합니다.
- source_word: וְיִזְעֲק֖וּ מָרָה
  english_pob_choice: and cry out bitterly
  chosen_korean: 쓰라리게 부르짖고
  alternatives_korean:
  - 비통하게 부르짖고
  - 쓰게 울부짖고
  - 격렬하게 외치고
  lexicon: HALOT
  rationale: זעק의 강한 통곡·절규를 ‘부르짖다’로 옮기고, מָרָה는 정서적 고통의 강도를 드러내는 ‘쓰라리게’로 표현했습니다.
- source_word: וְיַעֲל֤וּ עָֽפָר֙ עַל רָאשֵׁי/הֶם
  english_pob_choice: they will throw dust on their heads
  chosen_korean: 머리 위에 먼지를 뿌리며
  alternatives_korean:
  - 머리 위에 흙을 뿌리며
  - 머리에 먼지를 던지며
  - 머리 위로 먼지를 올리며
  lexicon: HALOT
  rationale: 장례 애도 행위로서의 ‘먼지/흙을 머리에 던짐’을 한국어 관용에 맞게 ‘뿌리다’로 옮겨, 행위의 상징성을 유지했습니다.
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  english_pob_choice: they will roll in ashes
  chosen_korean: 재 속에서 몸을 뒹굴 것입니다
  alternatives_korean:
  - 재 속에서 뒹굴 것입니다
  - 재에 뒹굴 것입니다
  - 재 속에서 구를 것입니다
  lexicon: HALOT
  rationale: hitpael פלשׁ의 반복적 몸짓을 ‘몸을 뒹굴다’로 옮겨 애도 행위의 생생함을 살렸고, ‘재’는 ashes의 직접 대응으로 유지했습니다.
theological_decisions:
- issue: 애가적/장례적 분노와 슬픔의 표현
  chosen_reading: 이 구절은 두로의 멸망을 애도하는 공개적 통곡과 장례 의례를 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 적대적 저주 행위로만 읽는 해석
  - 단순한 수사적 과장으로 축소하는 해석
  rationale: 본문의 동사들과 재·먼지의 상징은 고대 근동의 애도 관습을 가리키므로, 분노와 슬픔이 섞인 애가적 톤을 살리는 것이 원문에 가깝습니다.
  doctrine_reference: 애가/장례 관습에 대한 성경적 문화 배경
- issue: ‘너를 향해’의 관계 방향
  chosen_reading: עָלַיִךְ는 물리적 공격보다 ‘너를 향해/너 위에’ 쏟아지는 애도의 시선을 나타내는 것으로 옮겼습니다.
  alternative_readings:
  - ‘너에게 대하여’
  - ‘너를 공격하여’
  rationale: 문맥은 두로를 향한 애도이며, POB의 over you 취지를 따라 방향성을 유지하되 한국어에서는 ‘향해’로 자연스럽게 풀었습니다.
  doctrine_reference: 예언서 애가 문맥
