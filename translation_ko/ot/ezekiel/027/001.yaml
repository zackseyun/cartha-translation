- from: 그리고 야훼의 말씀이 내게 임하여 말씀하셨습니다.[a]
  to: 그리고 야훼의 말씀이 내게 임했습니다. 이렇게 말씀하셨습니다.[a]
  rationale: 원문의 וַיְהִי…לֵאמֹר는 예언적 계시와 뒤따르는 발화를 도입하는 공식입니다. ‘말씀이 내게 임했습니다. 이렇게 말씀하셨습니다’는 ‘말씀’(דְבַר)과 발화 도입(לֵאמֹר)을 모두 유지하면서, 원안의 주어-서술어 충돌을 해소합니다. 야훼 표기와 각주도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:54Z'
