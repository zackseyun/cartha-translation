    rationale: 문맥상 상품을 가리키지만, 직역상 ‘네가 만든 것[제품]이 많음으로’입니다. ‘네가 만든 것이 많아서’는 원문의 표현과 인과 관계를 더 충실히 드러냅니다.
  - severity: medium
    issue: ‘네 화물과 맞바꾸어’는 בְּעִזְבוֹנָיִךְ의 교환 관계를 부정확하게 표현합니다.
    rationale: 이 명사는 여기서 두로의 상품·물품을 뜻합니다. 물품 자체와 물품을 맞바꾼다는 표현보다 ‘네 상품을 대가로’가 자연스럽고 정확합니다.
  - severity: low
    issue: ‘청옥’은 영어 POB의 ‘turquoise’와 직접 일치하지 않으며 한국어 광물명으로도 모호할 수 있습니다.
    rationale: 본문은 ‘터키석’으로 번역하고, 다른 식별 가능성은 주석에서 밝혀 불확실성을 보존하는 편이 안전합니다.
