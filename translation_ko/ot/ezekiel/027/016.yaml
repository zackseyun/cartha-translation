source:
  edition: WLC
  text: אֲרָ֥ם סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב מַעֲשָׂ֑יִ/ךְ בְּ֠/נֹפֶךְ אַרְגָּמָ֨ן וְ/רִקְמָ֤ה וּ/בוּץ֙ וְ/רָאמֹ֣ת וְ/כַדְכֹּ֔ד נָתְנ֖וּ בְּ/עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
  footnotes:
  - marker: a
    text: Or 'emerald' or 'carbuncle' for 'turquoise'; the identification of the Hebrew gemstone name is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or possibly another luxury material such as 'mother-of-pearl'; the meaning of the Hebrew term rendered 'coral' is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'agate,' 'garnet,' or another precious stone; the exact identification of the Hebrew term rendered 'rubies' is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 아람은 네 많은 상품 때문에 너와 거래하며, 청옥과 자주색 물품, 수놓은 천, 고운 베, 산호와 홍옥을 네 화물과 맞바꾸어 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 보석명 ‘נֹפֶךְ’의 정확한 식별은 불확실합니다. ‘청옥’ 외에도 터키석, 에메랄드, 홍보석 등으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘רָאמֹת’은 정확한 뜻이 불확실하며, 산호 외에도 자개나 다른 고급 장식 재료로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘כַדְכֹּד’의 정확한 보석 식별은 불확실합니다. 홍옥 외에도 홍보석, 가넷, 마노 등으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  - 아람 사람들
  lexicon: HALOT
  rationale: 고유명사는 음역으로 보존하는 것이 원문 식별성을 가장 잘 살립니다. 여기서는 지역명과 상인 집단의 뉘앙스가 함께 있을 수 있으나, ‘아람’이 가장 중립적입니다.
- source_word: סֹחַרְתֵּךְ
  english_pob_choice: traded with you
  chosen_korean: 너와 거래하며
  alternatives_korean:
  - 너와 무역하며
  - 너의 상인이며
  lexicon: HALOT
  rationale: 상업적 교섭을 나타내는 표현이므로, 현대 한국어에서 자연스러운 ‘거래하다’로 옮겼습니다.
- source_word: נֹפֶךְ
  english_pob_choice: turquoise
  chosen_korean: 청옥
  alternatives_korean:
  - 터키석
  - 에메랄드
  - 홍보석
  lexicon: HALOT
  rationale: 원문 보석명은 정확한 식별이 불확실하므로, 너무 단정적인 표정보다 현대 독자가 이해하기 쉬운 보석명으로 옮기되 주석으로 불확실성을 남겼습니다.
- source_word: רָאמֹת
  english_pob_choice: coral
  chosen_korean: 산호
  alternatives_korean:
  - 자개
  - 진주층
  lexicon: HALOT
  rationale: 희귀어로서 의미가 불확실하지만, 이 무역 목록의 맥락상 고급 장식 재료를 가리키는 번역이 적절합니다.
- source_word: כַדְכֹּד
  english_pob_choice: rubies
  chosen_korean: 홍옥
  alternatives_korean:
  - 홍보석
  - 가넷
  - 마노
  lexicon: HALOT
  rationale: 정확한 광물 식별은 확실하지 않지만, 귀한 보석이라는 문맥을 살려 일반 독자에게 이해되는 보석명으로 옮겼습니다.
theological_decisions:
- issue: 무역 목록의 열거를 어떻게 처리할지
  chosen_reading: 상품의 종류를 나열하는 상업적 목록으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 은유적으로 과장된 부의 이미지로 풀어쓰기
  - 문화적 설명을 덧붙여 의역
  rationale: 본문은 두로의 상업적 번영을 드러내는 열거이므로, 의미를 약화시키지 않고 목록 구조를 보존하는 것이 원문 의도에 부합합니다.
  doctrine_reference: 예언서 문맥의 역사-상업적 이미지 보존
- issue: 보석명들의 불확실성 표기
  chosen_reading: 본문은 확정적 식별보다 ‘귀한 장식 재료’라는 기능적 의미를 우선하되, 개별 명칭의 불확실성은 주석으로 남겼습니다.
  alternative_readings:
  - 전통 교회식 보석명으로 단정
  - 모든 항목을 일반 명사로 평준화
  rationale: 원문 자체가 희귀 보석어를 사용하므로, 불확실성을 지우지 않고도 읽기 쉬운 한국어를 제공해야 합니다.
  doctrine_reference: 문헌학적 겸손과 본문 보존
