theological_decisions:
- issue: 무역 목록의 열거를 어떻게 처리할지
  chosen_reading: 상품의 종류를 나열하는 상업적 목록으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 은유적으로 과장된 부의 이미지로 풀어쓰기
  - 문화적 설명을 덧붙여 의역
  rationale: 본문은 두로의 상업적 번영을 드러내는 열거이므로, 의미를 약화시키지 않고 목록 구조를 보존하는 것이 원문 의도에 부합합니다.
  doctrine_reference: 예언서 문맥의 역사-상업적 이미지 보존
- issue: 보석명들의 불확실성 표기
  chosen_reading: 본문은 확정적 식별보다 ‘귀한 장식 재료’라는 기능적 의미를 우선하되, 개별 명칭의 불확실성은 주석으로 남겼습니다.
  alternative_readings:
  - 전통 교회식 보석명으로 단정
  - 모든 항목을 일반 명사로 평준화
  rationale: 원문 자체가 희귀 보석어를 사용하므로, 불확실성을 지우지 않고도 읽기 쉬운 한국어를 제공해야 합니다.
  doctrine_reference: 문헌학적 겸손과 본문 보존
