  source_fidelity: 수정이 필요합니다. 히브리어 מֵרֹב מַעֲשָׂיִךְ는 ‘네가 만든 것/상품이 많기 때문에’라는 뜻이며, עִזְבוֹנַיִךְ는 ‘화물’보다는 교환의 대가가 되는 ‘상품/물품’입니다. 또한 아람을 단수 지역명으로 제시한 뒤 복수 동사 נָתְנוּ를 받는 상인들을 한국어에서 명시하면 원문의 전환을 자연스럽게 보존할 수 있습니다.
  naturalness: 초안의 ‘아람은 … 거래하며, … 주었습니다’는 지역명 단수 주어와 서술의 연결이 다소 부자연스럽고, ‘화물과 맞바꾸어’도 문맥상 부정확합니다. ‘아람은 … 너의 상인이었고, 그들은 … 네 상품을 대가로 주었습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘터키석’은 영어 POB의 turquoise에 직접 대응하며, ‘청옥’이 야기할 수 있는 다른 광물과의 혼동을 피합니다. אַרְגָּמָן은 거래되는 자주색 직물로 ‘자주색 옷감’이라 하고, רִקְמָה와 בּוּץ는 각각 ‘수놓은 천’과 ‘고운 베’로 유지합니다. 희귀 보석·장식재 명칭의 불확실성은 해당 항목 바로 뒤 주석으로 보존합니다.
