  - 레바논산 백향목
  lexicon: HALOT
  rationale: אֶרֶז는 한국어 성경 전통에서 널리 ‘백향목’으로 옮겨 왔고, 여기서는 단일 목재를 가리키는 관사적 용법보다 재료 자체를 강조하는 표현이 자연스럽습니다.
- source_word: תֹּרֶן
  english_pob_choice: mast
  chosen_korean: 돛대
  alternatives_korean:
  - 마스트
  - 돛기둥
  lexicon: HALOT
  rationale: 선박 용어로는 ‘돛대’가 표준적이며, 본문의 항해 이미지를 현대 한국어로 분명하게 전달합니다.
theological_decisions:
- issue: 티레를 배에 빗대어 말하는 2인칭 여성 단수 주소 유지
  chosen_reading: ‘그대의’로 2인칭 여성 단수 주소를 일관되게 살려, 도시-배 비유와 원문의 직접성을 유지했습니다.
  alternative_readings:
  - ‘너의’
  - ‘당신의’
  rationale: 히브리어의 여성 단수 호격은 단순한 문체가 아니라 비유 구조의 일부이므로, 한국어에서도 직접 대면하는 2인칭을 유지하는 것이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 예언서 수사와 의인화 표현의 보존
