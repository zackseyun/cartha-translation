  source_fidelity: 원문의 두 복수 동사(‘그들이 만들었다/가져갔다’)와 재료·용도의 흐름은 대체로 보존되어 있습니다. 다만 지명은 한국어 성경의 통용 표기인 ‘스닐’로 바로잡는 것이 적절하며, 마지막 עָלָיִךְ는 ‘그대의 돛대’보다 ‘그대를 위해’로 옮겨 원문의 관계 표현을 더 충실히 반영할 수 있습니다.
  naturalness: ‘스닐의 잣나무들로 … 만들었고, 레바논의 백향목을 가져다가 … 만들었습니다’는 현대 표준 한국어의 공식적 합쇼체로 자연스럽습니다. ‘그대’는 티레를 향한 의인화된 직접 호칭을 유지합니다.
  terminology: בְּרוֹשִׁים을 ‘잣나무들’로 옮기는 것은 가능한 전통적 선택이며, 수종 불확실성은 각주로 밝혀야 합니다. אֶרֶז은 ‘백향목’, תֹּרֶן은 ‘돛대’가 적절합니다. שְׂנִיר의 표기는 ‘스닐’이 한국어 성경 용례와 더 잘 맞습니다.
