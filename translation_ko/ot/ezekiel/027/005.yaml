  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּרוֹשִׁ֤ים מִ/שְּׂנִיר֙ בָּ֣נוּ לָ֔/ךְ אֵ֖ת כָּל לֻֽחֹתָ֑יִם אֶ֤רֶז מִ/לְּבָנוֹן֙ לָקָ֔חוּ לַ/עֲשׂ֥וֹת תֹּ֖רֶן עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
  footnotes:
  - marker: a
    text: Or 'junipers' or 'fir trees' for 'cypress trees'; the exact species denoted by Hebrew בְּרוֹשִׁים is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Senir is a regional name associated with Mount Hermon (cf. Deut 3:9).
    reason: cross_reference
translation:
  language: ko
  text: 시닐에서 가져온 잣나무들로 그대의 모든 널빤지를 만들고, 레바논의 백향목을 가져다가 그대의 돛대를 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשִׁים는 정확한 수종이 확정되지 않아, ‘잣나무들’ 외에 ‘향나무들’이나 ‘전나무들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 시닐은 헤르몬 산과 연관된 지역 이름입니다(신 3:9 참조).
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוֹשִׁים
  english_pob_choice: cypresses
  chosen_korean: 잣나무들
  alternatives_korean:
  - 사철나무들
  - 측백나무들
  lexicon: HALOT
  rationale: 히브리어 בְּרוֹשִׁים은 정확한 수종이 불확실하므로, 한국어에서는 전통적으로도 널리 쓰이는 침엽수 계열 이름을 택하되, 본문의 건조·선박 제작 이미지를 살려 자연스럽게 옮겼습니다.
- source_word: מִשְּׂנִיר
  english_pob_choice: from Senir
  chosen_korean: 시닐에서
  alternatives_korean:
  - 세니르에서
  - 스니르에서
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 원문 정보 보존에 가장 적절하므로, 히브리어 지명 סְנִיר를 한국어 음운에 맞게 옮겼습니다.
- source_word: לֻחֹתָיִם
  english_pob_choice: all your planking
  chosen_korean: 그대의 모든 널빤지
  alternatives_korean:
  - 그대의 모든 판자
  - 그대의 모든 외판
  lexicon: HALOT
  rationale: לֻחֹת은 배의 판재를 가리키므로, ‘널빤지’가 선박 제작 맥락을 가장 자연스럽게 드러냅니다.
- source_word: אֶרֶז מִלְּבָנוֹן
  english_pob_choice: a cedar from Lebanon
  chosen_korean: 레바논의 백향목
  alternatives_korean:
  - 레바논에서 온 백향목
  - 레바논산 백향목
  lexicon: HALOT
  rationale: אֶרֶז는 한국어 성경 전통에서 널리 ‘백향목’으로 옮겨 왔고, 여기서는 단일 목재를 가리키는 관사적 용법보다 재료 자체를 강조하는 표현이 자연스럽습니다.
- source_word: תֹּרֶן
  english_pob_choice: mast
  chosen_korean: 돛대
  alternatives_korean:
  - 마스트
  - 돛기둥
  lexicon: HALOT
  rationale: 선박 용어로는 ‘돛대’가 표준적이며, 본문의 항해 이미지를 현대 한국어로 분명하게 전달합니다.
theological_decisions:
- issue: 티레를 배에 빗대어 말하는 2인칭 여성 단수 주소 유지
  chosen_reading: ‘그대의’로 2인칭 여성 단수 주소를 일관되게 살려, 도시-배 비유와 원문의 직접성을 유지했습니다.
  alternative_readings:
  - ‘너의’
  - ‘당신의’
  rationale: 히브리어의 여성 단수 호격은 단순한 문체가 아니라 비유 구조의 일부이므로, 한국어에서도 직접 대면하는 2인칭을 유지하는 것이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 예언서 수사와 의인화 표현의 보존
