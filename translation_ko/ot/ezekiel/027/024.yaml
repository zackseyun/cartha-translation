  text: הֵ֤מָּה רֹכְלַ֨יִ/ךְ֙ בְּ/מַכְלֻלִ֔ים בִּ/גְלוֹמֵי֙ תְּכֵ֣לֶת וְ/רִקְמָ֔ה וּ/בְ/גִנְזֵ֖י בְּרֹמִ֑ים בַּ/חֲבָלִ֧ים חֲבֻשִׁ֛ים וַ/אֲרֻזִ֖ים בְּ/מַרְכֻלְתֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
  footnotes:
  - marker: a
    text: Or 'in chests of cedar' / 'cedar-lined'; the Hebrew term is difficult, and some understand it from the word for 'cedar' rather than as another description of how the goods were packed.
    reason: alternative_reading
  - marker: b
    text: The phrase rendered 'treasuries of multicolored fabrics' is uncertain; it may refer to valuable stores, chests, or bundles of richly colored textiles.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 값진 물품, 곧 푸른 천 꾸러미와 수놓은 천, 여러 빛깔의 직물 보관함들[a], 끈으로 묶어 단단히 포장한 것들[b]을 가지고 그대와 거래하던 상인들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현의 뜻은 확실하지 않습니다. ‘여러 빛깔의 직물 보관함들’로 옮겼으나, 값진 저장품이나 화려한 직물 꾸러미를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘단단히 포장한 것들’에 해당하는 마지막 히브리어 표현은 불확정합니다. 어떤 이들은 이를 ‘삼나무로 만든 것들’ 또는 ‘삼나무 상자에 넣은 것들’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹכְלַיִךְ
  english_pob_choice: your merchants
  chosen_korean: 그대의 상인들
  alternatives_korean:
  - 그대의 장사꾼들
  - 그대의 무역상들
  lexicon: HALOT
  rationale: 상업 네트워크 안에서 활동하는 거래상들을 가리키므로, 문맥에 맞는 일반적이고 자연스러운 ‘상인들’로 옮겼습니다.
- source_word: מַכְלֻלִים
  english_pob_choice: choice wares
  chosen_korean: 값진 물품들
  alternatives_korean:
  - 선택된 물품들
  - 고급 상품들
  - 아주 좋은 물품들
  lexicon: HALOT
  rationale: 희귀하고 값진 상업용 물품의 성격을 살리면서도, 본문 목록의 흐름에 맞게 자연스럽게 표현했습니다.
- source_word: גְלוֹמֵי תְכֵלֶת וְרִקְמָה
  english_pob_choice: wraps of blue and embroidered cloth
  chosen_korean: 푸른색과 수놓은 천에 싸인 물품들
  alternatives_korean:
  - 푸른 천의 두루마리와 수놓은 천
  - 푸른 천과 자수 천의 묶음
  lexicon: HALOT
  rationale: ‘גלם’의 포장·말린 물품 느낌과 ‘תכלת’의 푸른색 염직, ‘רקמה’의 자수 천을 함께 살리되, 거래 물품 목록답게 ‘싸인 물품들’로 풀었습니다.
- source_word: גִנְזֵי בְּרֹמִים
  english_pob_choice: treasuries of multicolored fabrics
  chosen_korean: 여러 빛깔의 직물을 넣은 곳간들
  alternatives_korean:
  - 다채로운 직물의 창고들
  - 빛깔이 섞인 천의 보관함들
  lexicon: HALOT
  rationale: ‘גִנְזֵי’는 곳간·보관함의 의미가 가능하고, ‘בְּרֹמִים’은 색이 다양한 직물로 이해하는 것이 문맥상 자연스러워, 보관된 고급 직물의 이미지를 살렸습니다.
- source_word: חֲבָלִים חֲבֻשִׁים וַאֲרֻזִים
  english_pob_choice: bound with cords and secured
  chosen_korean: 끈으로 묶고 단단히 고정된 것들
  alternatives_korean:
  - 밧줄로 묶어 고정된 것들
  - 끈으로 묶여 싸인 것들
  lexicon: HALOT
  rationale: 운송용 포장 상태를 나타내므로, ‘묶고 고정된’으로 묶음과 안전한 보관을 함께 드러냈습니다.
- source_word: מַרְכֻלְתֵּךְ
  english_pob_choice: your merchandise
  chosen_korean: 그대의 상품 가운데
  alternatives_korean:
  - 그대의 물품들 가운데
  - 그대의 장사 물건 가운데
  lexicon: HALOT
  rationale: 문맥상 ‘상품/물품’의 총칭을 가리키므로, 목록의 마무리로 자연스러운 ‘상품 가운데’로 옮겼습니다.
theological_decisions:
- issue: 상업 목록의 반복 구조와 비유적 함의 유지
  chosen_reading: 이 구절은 두로의 상업 활동과 사치품 교역을 열거하는 본문으로, 구체적인 물품 목록의 질감을 보존했습니다.
  alternative_readings:
  - 단순히 일반적 재산 목록으로 완화하는 읽기
  - 시적 장식으로만 처리하는 읽기
  rationale: 본문의 목적은 두로의 무역망과 상품의 화려함을 드러내는 데 있으므로, 추상화하지 않고 물품의 구체성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서 본문 해석 원칙 및 문맥 우선 번역
- issue: אֲרֻזִים의 불확정성 처리
  chosen_reading: 본문에는 ‘단단히 고정된 것들’로 옮기고, 고유한 재질이나 포장 방식은 단정하지 않았습니다.
  alternative_readings:
  - ‘삼나무로 만든/삼나무 안에 넣은’으로 이해하는 읽기
  - ‘포장된/싸인’으로 단순화하는 읽기
  rationale: 히브리어가 불확정적이므로, 과도한 확정 번역을 피하면서도 포장·운송 맥락은 유지했습니다.
  doctrine_reference: 본문비평 및 어휘 불확정성의 보수적 처리
