id: EZK.27.15
reference: Ezekiel 27:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
  footnotes:
  - marker: a
    text: Or 'Many islands were your market' for 'Many coastlands were the market of your hand.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'horns of ivory.'
    reason: lexical_alternative
  - marker: c
    text: Or 'ebony wood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 드단의 아들들은 당신의 상인이었습니다. 많은 해안 지역이 당신의 손의 시장이었으며, 그들은 상아 상아와 흑단을 당신의 대가로 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 섬들이 당신의 시장이었다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘상아의 뿔들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘흑단 나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דְדָן
  english_pob_choice: The sons of Dedan
  chosen_korean: 드단의 아들들
  alternatives_korean:
  - 드단 사람들
  - 드단 족속
  lexicon: HALOT
  rationale: 히브리어의 직설적인 친족/집단 표지를 살려 ‘아들들’로 옮기되, 한국어에서는 소속 관계가 자연스럽게 드러나도록 ‘드단의’로 처리했습니다.
- source_word: רֹכְלַיִךְ
  english_pob_choice: your merchants
  chosen_korean: 당신의 상인들
  alternatives_korean:
  - 당신의 장사꾼들
  - 당신의 무역상들
  lexicon: HALOT
  rationale: 무역 문맥에서 רֹכֵל 계열은 상업 활동을 하는 사람들을 가리키므로, 문맥상 가장 자연스러운 ‘상인들’을 선택했습니다.
- source_word: אִיִּים רַבִּים
  english_pob_choice: Many coastlands
  chosen_korean: 많은 해안 지역
  alternatives_korean:
  - 많은 섬들
  - 많은 연안 지역
  lexicon: HALOT
  rationale: 시가적·예언적 무역 문맥에서 אִיִּים은 단순한 섬보다 넓은 해상 연안권을 가리킬 수 있어, 영어 POB의 해석을 따라 ‘해안 지역’으로 옮겼습니다.
- source_word: סְחֹרַת יָדֵךְ
  english_pob_choice: were the market of your hand
  chosen_korean: 당신의 손의 시장
  alternatives_korean:
  - 당신의 시장
  - 당신의 상업권
  lexicon: HALOT
  rationale: ‘손’이 붙은 히브리어 표현의 구체성을 살리면서도 상업적 의미를 드러내기 위해 직역에 가까운 ‘손의 시장’을 유지했습니다.
- source_word: קַרְנוֹת שֵׁן
  english_pob_choice: ivory tusks
  chosen_korean: 상아 상아
  alternatives_korean:
  - 상아의 뿔
  - 상아 엄니
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘상아의 뿔들’이지만, 영어 POB가 주석으로 ‘ivory tusks’의 관용적 의미를 밝혔으므로 본문은 중복을 피하기 위해 ‘상아’를 기본으로 두고, 주석으로 직역 가능성을 남겼습니다.
- source_word: וְהוֹבְנִים
  english_pob_choice: ebony
  chosen_korean: 흑단
  alternatives_korean:
  - 흑단 나무
  - 에보니
  lexicon: HALOT
  rationale: 고급 교역품을 가리키는 통상 번역으로 ‘흑단’이 가장 간결하고 자연스럽습니다.
- source_word: אֶשְׁכָּרֵךְ
  english_pob_choice: your payment
  chosen_korean: 당신의 대가
  alternatives_korean:
  - 당신의 보수
  - 당신의 임금
  - 당신의 보상
  lexicon: HALOT
  rationale: 상업 교환의 맥락에서 ‘payment’보다 넓게 통용되는 ‘대가’를 사용해, 거래의 대응관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 무역 예언의 상업적 비유를 지나치게 도덕화하지 않을지 여부
  chosen_reading: 본문을 두로에 대한 상업 네트워크 묘사로 읽고, 심판의 맥락을 암시하되 본절 자체는 교훈적 재해석 없이 기술적으로 옮겼습니다.
  alternative_readings:
  - 상징적 교훈문으로 도덕화하기
  - 현대 독자가 이해하기 쉽게 상업 이미지를 약화시키기
  rationale: 에스겔 27장은 열국 무역망을 생생하게 열거하는 본문이므로, 원문의 경제적 이미지와 열거 구조를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 성경 본문의 문학적·역사적 문맥 보존
- issue: ‘your hand’의 관용성 처리
  chosen_reading: ‘손의 시장’을 그대로 살려 히브리어의 신체 은유를 보존했습니다.
  alternative_readings:
  - ‘당신의 시장’으로 평탄화하기
  - ‘당신의 상업권’으로 의역하기
  rationale: 원문은 거래 능력/권한을 ‘손’으로 표현하므로, 이를 지워버리면 예언적 시적 맛이 약해집니다.
  doctrine_reference: 원문의 수사학적 형상 보존
