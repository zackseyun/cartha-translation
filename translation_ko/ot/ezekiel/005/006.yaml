revisions:
- from: 그녀는 내 규례들을 다른 민족들보다 더 큰 악으로 거역하였고, 사방의 땅들보다 더 큰 악으로 내 규례들을 거역하였습니다. 이는 그들이 내 규례들을 거부하였고, 내 법도대로 걷지 않았기 때문입니다.[a][b]
  to: 그녀는 내 판례를 이방 민족들보다 더 악하게 거역하였고[a], 내 율례를 그녀 주위의 땅들보다 더 거역하였습니다. 그들이 내 판례를 저버리고 내 율례대로 살지 않았기 때문입니다.[b]
  rationale: 원문의 여성 단수 주어와 뒤이은 복수 주어를 그대로 유지했습니다. 첫 비교구에만 ‘더 악하게’를 두어 לְרִשְׁעָה의 위치를 반영했고, 둘째 구는 별도의 비교 구문으로 번역했습니다. 법률 용어는 ‘판례/율례’로 구별했으며, 해석이 갈릴 수 있는 첫 동사는 본문과 각주를 함께 사용해 모호성을 보존했습니다.
