id: EZK.5.6
reference: Ezekiel 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
  footnotes:
  - marker: a
    text: Or 'she changed my judgments into wickedness, more than the nations.' The verb can be understood as rebellion or as a corrupt alteration of what God gave; the main text follows the covenantal sense 'rebelled.'
    reason: lexical_alternative
  - marker: b
    text: '''Walk in'' is a Hebrew idiom meaning to live according to or follow.'
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 내 판례를 이방 민족들보다 더 악하게 거역하였고[a], 내 율례를 그녀 주위의 땅들보다 더 거역하였습니다. 그들이 내 판례를 저버리고 내 율례대로 살지 않았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거역하였다’로 옮긴 히브리어 동사는 ‘바꾸었다’로도 해석될 수 있습니다. 본문은 언약 문맥에서의 거역이라는 뜻을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율례대로 살지 않았다’는 히브리어의 ‘그 안에서 걷지 않았다’라는 관용적 표현을 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  english_pob_choice: she rebelled
  chosen_korean: 거역하였고
  alternatives_korean:
  - 반역하였고
  - 반항하였고
  - 거슬렀고
  lexicon: HALOT
  rationale: 언약적 문맥에서 מרה는 단순한 변화보다 권위에 대한 거역/불순종을 뜻하므로, 예언적 여성 단수 주어를 살리면서도 현대 한국어에서 자연스러운 ‘거역하다’로 옮겼습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 법도
  lexicon: HALOT
  rationale: 미슈파트는 법적·언약적 규범을 가리키므로 ‘판결’보다 규범성을 드러내는 ‘규례들’이 적절합니다. 본절의 평행어 חֻקּוֹתַי와도 구분을 유지했습니다.
- source_word: לְרִשְׁעָה
  english_pob_choice: with wickedness / into wickedness
  chosen_korean: 더 큰 악으로
  alternatives_korean:
  - 악하게
  - 악으로
  - 악함으로
  lexicon: HALOT
  rationale: ל + 명사는 결과/방향성을 띨 수 있으므로, 문맥상 ‘악하게’보다 ‘더 큰 악으로’가 원문의 악행의 정도와 방향을 함께 드러냅니다.
- source_word: מִן הַגּוֹיִם ... מִן הָאֲרָצוֹת
  english_pob_choice: more than the nations ... more than the lands
  chosen_korean: 다른 민족들보다 ... 사방의 땅들보다
  alternatives_korean:
  - 민족들보다 ... 땅들보다
  - 나라들보다 ... 주변 지역들보다
  - 이방 민족들보다 ... 주변 땅들보다
  lexicon: HALOT
  rationale: 비교의 מן을 한국어 비교격 ‘-보다’로 옮겼습니다. אֲרָצוֹת은 현대적 ‘국가’보다 넓은 영토적 의미의 ‘땅들’이 더 안전하며, סביבותיה는 ‘사방의’로 압축해 주변성을 살렸습니다.
- source_word: מָאָסוּ
  english_pob_choice: they rejected
  chosen_korean: 거부하였고
  alternatives_korean:
  - 멸시하였고
  - 버렸고
  - 배척하였고
  lexicon: HALOT
  rationale: מאס는 경멸을 포함한 거부를 뜻하므로, 법규를 받아들이지 않은 태도를 분명히 하는 ‘거부하다’가 적절합니다.
- source_word: לֹא הָלְכוּ בָהֶם
  english_pob_choice: they did not walk in my statutes
  chosen_korean: 내 법도대로 걷지 않았기 때문입니다
  alternatives_korean:
  - 내 규례들 안에서 걷지 않았기 때문입니다
  - 내 법도 안에서 행하지 않았기 때문입니다
  - 내 법도를 따르지 않았기 때문입니다
  lexicon: HALOT
  rationale: הלך ב는 ‘따라 살다/행하다’는 관용구이므로, 문학적 은유를 보존하면서도 현대 독자가 이해할 수 있게 ‘법도대로 걷다’로 옮겼습니다.
theological_decisions:
- issue: 예언 문맥의 여성 인칭 유지
  chosen_reading: 예루살렘을 암시하는 여성 단수 주어를 ‘그녀’로 유지했습니다.
  alternative_readings:
  - 그것은
  - 예루살렘은
  rationale: 히브리어 동사는 여성 단수이며, 성읍의 의인화를 통해 책망의 수사적 힘이 살아납니다. 한국어에서도 ‘그녀’가 그 효과를 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: literary-personal referent preservation'
- issue: 규례와 법도의 병행 구분
  chosen_reading: מִשְׁפָּטַי를 ‘규례들’, חֻקּוֹתַי를 ‘법도들’ 계열로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘법’으로 통일
  - 둘 다 ‘율례’로 통일
  rationale: 본문은 서로 다른 두 언약 법어를 병렬로 사용하므로, 한국어에서도 의미 중첩을 줄이고 반복의 수사성을 살리기 위해 구분을 두었습니다.
  doctrine_reference: 'Translation philosophy: lexical distinction preservation'
