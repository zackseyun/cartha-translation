  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord YHWH'' (traditionally rendered ''the Lord GOD'' to avoid ''Lord LORD'').'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 보십시오[a], 내가 친히 너를 대적하여, 이방 민족들의 눈앞에서 네 가운데에서 심판을 집행하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보라/보십시오’에 해당하는 הִנְנִי(힌네니)를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 호칭은 존칭 אֲדֹנָי와 언약명 יְהוָה를 함께 드러내야 하므로, 본문 규범에 따라 야훼를 살리면서도 한국어 호칭은 ‘주’로 자연스럽게 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가 있다
  lexicon: HALOT
  rationale: 예언 선포의 엄숙한 주의 환기 기능을 유지하면서도 현대 한국어 합쇼체에 맞게 자연스럽게 표지했습니다.
- source_word: גַּם אָנִי
  english_pob_choice: I myself
  chosen_korean: 내가 친히
  alternatives_korean:
  - 나도
  - 나 역시
  - 나 자신이
  lexicon: HALOT
  rationale: 단순한 ‘나도’보다 심판의 주체가 하나님 자신임을 강조하는 원문 강세를 한국어에서 더 분명히 드러냅니다.
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  english_pob_choice: I will execute judgments
  chosen_korean: 심판을 집행하겠습니다
  alternatives_korean:
  - 심판들을 행하겠습니다
  - 심판들을 집행하겠습니다
  - 심판을 시행하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘심판들을 행하다’는 관용적으로 판결/징벌의 집행을 뜻하므로, 법정·징계의 공적 행위를 드러내는 ‘집행하다’가 적절합니다.
- source_word: לְעֵינֵי הַגּוֹיִם
  english_pob_choice: before the eyes of the nations
  chosen_korean: 이방 민족들의 눈앞에서
  alternatives_korean:
  - 열국의 눈앞에서
  - 민족들 앞에서
  - 열방의 눈앞에서
  lexicon: HALOT
  rationale: 공개성을 강조하는 관용구이므로 ‘눈앞에서’로 시각적 공개성을 살리고, 문맥상 주변 민족들을 가리키는 ‘이방 민족들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 심판 선포를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘보십시오… 내가 친히 너를 대적하여’로 번역해, 하나님의 적극적 대립과 공개적 심판 선언을 분명히 했습니다.
  alternative_readings:
  - ‘보라… 내가 네게 대하여’
  - ‘내가 너를 향하여’
  rationale: 본문은 단순한 위치 표명이 아니라 적대적 심판 선언이므로, 문맥적 힘을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: Ezekiel 5:8 judgment oracle context
