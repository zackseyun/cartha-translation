review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 심판 선언, ‘너를 대적함’, 공개적으로 이루어질 심판을 충실히 반영합니다. 다만 הַגּוֹיִם은 본절에서 ‘이방 민족들’보다 가치 판단이나 후대 종교 용례를 덜 덧붙이는 ‘민족들’이 더 직접적입니다. 또한 הִנְנִי의 현재적 선언과 뒤따르는 미래 심판을 문장으로 분명히 구분하는 편이 안전합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬을 수 있습니다. ‘내가 친히 너를 대적하여’는 뒤의 ‘집행하겠습니다’에 문법적으로 매달려 의미 관계가 다소 흐려질 수 있으므로, 독립된 선언문으로 처리하는 것이 명료합니다.
  terminology: ‘주 야훼’는 אֲדֹנָי יְהוִה의 두 요소를 반영하며 적절합니다. מִשְׁפָּטִים은 여기서 ‘심판을 집행하다’로 자연스럽게 옮길 수 있습니다. הַגּוֹיִם은 ‘민족들’로 번역합니다.
  issues:
  - severity: low
    issue: ‘이방 민족들’은 הַגּוֹיִם에 해석적 뉘앙스를 보탭니다.
    rationale: 원문은 기본적으로 ‘민족들/나라들’을 뜻합니다. 문맥상 이스라엘 주변 민족들을 가리키지만, ‘이방’이라는 후대의 종교적 범주를 반드시 요구하지는 않습니다.
  - severity: low
    issue: ‘너를 대적하여, ... 심판을 집행하겠습니다’의 연결이 두 원문의 절을 하나의 수단·연결 관계처럼 보이게 할 수 있습니다.
    rationale: הִנְנִי עָלַיִךְ는 현재적이고 독립적인 적대 선언이며, 이어지는 절은 장차 행할 심판의 선언입니다. 문장을 나누어 두 기능을 보존합니다.
  - severity: low
    issue: 각주가 הִנְנִי를 단순히 ‘보라/보십시오’에 해당한다고 설명합니다.
    rationale: הִנְנִי는 문자적으로 ‘보라, 나 여기 있다/내가 여기 있다’라는 형태에서 나온 엄숙한 자기 선언이며, 문맥상 ‘보십시오’로 번역될 수 있습니다. 각주는 이 점을 더 정확히 밝혀야 합니다.
  revised_text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 친히 너를 대적합니다. 나는 민족들이 보는 앞에서 네 가운데에 심판을 집행하겠습니다.”
  revised_footnotes:
  - marker: a
    text: 히브리어 הִנְנִי(힌네니)는 문자적으로 ‘보라, 내가 여기 있다’라는 뜻의 엄숙한 자기 선언입니다.
    reason: source_note
  revision_rationale: 원문의 두 선언을 분리하여 현재의 적대 선언과 미래의 심판 선언을 분명히 했습니다. ‘민족들’은 הַגּוֹיִם을 해석적 덧붙임 없이 옮기며, 각주는 הִנְנִי의 형태와 기능을 더 정확히 설명합니다.
