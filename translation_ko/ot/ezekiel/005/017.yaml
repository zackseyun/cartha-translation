  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
  footnotes:
  - marker: a
    text: Or 'evil beasts' or 'savage animals.' The Hebrew phrase is literally 'bad/evil beast.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and they will make you childless.' The Hebrew verb commonly refers to bereavement through loss of children.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'blood'; here likely meaning bloodshed.
    reason: lexical_alternative
  - marker: d
    text: Or 'I, Yahweh, have spoken.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너희에게 기근과 사나운 짐승을 보내겠습니다.[a] 그것이 너를 자녀를 잃게 할 것이며,[b] 전염병과 유혈이 네 가운데를 지나갈 것입니다.[c] 내가 네게 칼을 가져오겠습니다. 나 야훼가 말하였습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 짐승’ 또는 ‘사나운 들짐승’. 히브리어 표현은 문자적으로 ‘나쁜/악한 짐승’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너를 자녀 없는 이가 되게 할 것이며’. 히브리어 동사는 흔히 자녀를 잃게 되는 비통함을 가리킵니다. ‘자녀’는 히브리어 본문에 별도의 목적어로 명시되어 있지는 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘피’이며, 여기서는 유혈을 뜻할 가능성이 높습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “나, 야훼가 말하였습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: And I will send
  chosen_korean: 내가 … 보내어
  alternatives_korean:
  - 내가 … 보낼 것이며
  - 내가 … 보내겠습니다
  lexicon: HALOT
  rationale: 심판을 ‘보내다’로 옮기면 야훼가 재앙을 능동적으로 파견하시는 뜻이 자연스럽고, 현대 한국어에서도 예언체의 단정성을 유지할 수 있습니다.
- source_word: וְחַיָּה רָעָה
  english_pob_choice: and wild beasts
  chosen_korean: 사나운 짐승
  alternatives_korean:
  - 들짐승
  - 악한 짐승
  - 포악한 짐승
  lexicon: HALOT
  rationale: 문자적으로 ‘악한 짐승’이지만, 심판 맥락에서 사람에게 해를 끼치는 위험성을 드러내는 한국어로는 ‘사나운 짐승’이 가장 자연스럽습니다.
- source_word: וְשִׁכְּלֻךְ
  english_pob_choice: and they will bereave you of children
  chosen_korean: 너희를 자녀를 잃게 하며
  alternatives_korean:
  - 너희를 자녀를 잃어버리게 하며
  - 너희를 상실하게 하며
  - 너희를 고아로 만들며
  lexicon: HALOT
  rationale: 이 동사는 단순한 상실이 아니라 특히 자녀 상실로 인한 ‘자녀를 잃게 하다/잃게 되다’의 뉘앙스를 가지므로, 한국어에서는 그 침통한 결과를 드러내되 과도하게 해석하지 않도록 옮겼습니다.
- source_word: וְדֶבֶר וָדָם
  english_pob_choice: and pestilence and bloodshed
  chosen_korean: 전염병과 피
  alternatives_korean:
  - 전염병과 피 흘림
  - 전염병과 유혈
  - 전염병과 학살
  lexicon: HALOT
  rationale: ‘피’는 본문 그대로의 표현을 살리되, 한국어에서는 재앙 목록 속에서 ‘피 흘림’보다 압축적이고 시적이며 원문과 가까운 표현입니다. 다만 의미상 유혈 사태를 가리키는 점은 그대로 유지됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 학술적 음역인 ‘야훼’를 사용하여 언약 이름의 고유성을 보존했습니다.
theological_decisions:
- issue: 예언 심판 공식의 종결 방식
  chosen_reading: “나, 야훼가 말하였습니다.”
  alternative_readings:
  - “나, 야훼가 말했습니다.”
  - “야훼께서 말씀하셨습니다.”
  rationale: 히브리어의 완결 선언 דִּבַּרְתִּי를 예언적·법정적 확정 진술로 살리기 위해, 화자가 직접 책임지는 1인칭 종결을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: ‘피’의 의미
  chosen_reading: 전염병과 피
  alternative_readings:
  - 전염병과 피 흘림
  - 전염병과 유혈
  rationale: 본문의 ‘피’는 문자적 물질이라기보다 전쟁과 살육을 포함한 유혈의 재앙을 가리키므로, 너무 해설적이지 않게 본문 표현을 유지하되 의미는 문맥으로 드러나게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
