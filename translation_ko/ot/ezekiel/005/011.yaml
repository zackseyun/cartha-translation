  source_fidelity: 핵심 의미는 대체로 충실하나, חַי־אָנִי는 단순한 시간 조건인 ‘내가 살아 있는 한’보다 신적 맹세의 관용구로 드러내야 합니다. 또한 אֶגְרַע는 사람을 목적어로 하여 ‘감퇴시키겠습니다’라고 하면 한국어에서 부자연스럽고 의미가 흐려지므로, 문맥상 안전한 ‘너를 줄이겠습니다’가 적절합니다. 원문의 아도나이 야훼(אֲדֹנָי יְהוִה)도 ‘주 야훼’로 보존했습니다.
  naturalness: 기존 문장은 전반적으로 합쇼체이나 ‘너를 감퇴시키겠습니다’는 현대 한국어의 사람을 향한 심판 선언으로 자연스럽지 않습니다. 직접 인용 형식으로 예언자적 선언과 맹세를 분명히 하고, ‘내 눈은 아끼지 않을 것이며’로 히브리어의 눈 이미지를 유지했습니다.
  terminology: ‘성소’, ‘가증한 것들’, ‘불쌍히 여기지 않겠습니다’는 적절합니다. שִׁקּוּצִים와 תּוֹעֵבוֹת의 병렬은 ‘혐오스러운 것들/가증한 것들’로 구별했습니다. 신명은 원문 표기를 반영하여 ‘야훼’로, אֶגְרַע의 불확정적 세부 뉘앙스는 각주로 보존했습니다.
