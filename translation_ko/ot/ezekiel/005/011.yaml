revisions:
- from: 그러므로 내가 살아 있는 한 — 주 하나님이 선언하십니다 — 네가 온갖 너의 혐오스러운 것들과 온갖 너의 가증한 것들로 내 성소를 더럽혔으므로, 나도 너를 감퇴시키겠습니다[a]. 내 눈이 아끼지 않을 것이며, 나도 불쌍히 여기지 않겠습니다.
  to: 그러므로 주 야훼께서 말씀하십니다. “내가 살아 있음을 두고 맹세합니다. 네가 너의 온갖 혐오스러운 것들과 온갖 가증한 것들로 내 성소를 더럽혔으므로, 반드시 나도 너를 줄이겠습니다[a]. 내 눈은 아끼지 않을 것이며, 나도 불쌍히 여기지 않겠습니다.”
  rationale: 신적 맹세 공식, 아도나이 야훼라는 복합 신명, 그리고 אֶגְרַע의 간결하고 다의적인 심판 표현을 더 충실하고 자연스러운 현대 한국어 합쇼체로 조정했습니다. ‘반드시’는 맹세 문맥의 אִם לֹא가 지닌 강한 단언을 반영합니다. 각주는 ‘줄이다’가 특정하는 감소의 방향을 과도하게 확정하지 않도록 대안적 ‘잘라 내다’와 목적어 생략을 보존합니다.
  reviewer_model: gpt-5.6-terra
