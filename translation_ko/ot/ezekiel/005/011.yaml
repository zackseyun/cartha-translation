id: EZK.5.11
reference: Ezekiel 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
  footnotes:
  - marker: a
    text: Or, more literally, 'I also will diminish/cut down.' The Hebrew verb is terse and its object is left implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 살아 있는 한 — 주 하나님이 선언하십니다 — 네가 온갖 너의 혐오스러운 것들과 온갖 너의 가증한 것들로 내 성소를 더럽혔으므로, 나도 너를 감퇴시키겠습니다[a]. 내 눈이 아끼지 않을 것이며, 나도 불쌍히 여기지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 줄이겠습니다/잘라내겠습니다’로도 옮길 수 있습니다. 히브리어 동사는 간결하며, 목적어가 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 직전 문맥의 심판 선언을 잇는 추론 접속사이므로, 형식적이면서도 자연스러운 「그러므로」가 적절합니다.
- source_word: חַי אָנִי
  english_pob_choice: as I live
  chosen_korean: 내가 살아 있는 한
  alternatives_korean:
  - 내가 살아 있노라
  - 내 생명을 두고
  lexicon: HALOT
  rationale: 하나님의 엄숙한 맹세 관용구를 한국어에서 과장 없이 살리기 위해, 현대 문체의 맹세 감각이 드러나는 표현으로 옮겼습니다.
- source_word: מִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 곳
  lexicon: HALOT
  rationale: קדש 계열의 예배 공간을 가리키는 말로, 건물 전체를 좁히지 않으면서도 성스러운 구역이라는 뜻을 유지하는 「성소」가 맞습니다.
- source_word: שִׁקּוּצַיִךְ / תּוֹעֲבֹתַיִךְ
  english_pob_choice: your detestable things / your abominations
  chosen_korean: 너의 혐오스러운 것들 / 너의 가증한 것들
  alternatives_korean:
  - 너의 더러운 것들 / 너의 가증한 일들
  - 너의 우상들 / 너의 가증한 행위들
  lexicon: HALOT
  rationale: 두 명사가 병렬로 쓰여 있으므로 한국어도 같은 계열의 강한 부정 어휘를 두되, 서로 동일하게 평준화하지 않고 구분을 남겼습니다.
- source_word: אֶגְרַע
  english_pob_choice: I also will diminish you
  chosen_korean: 너를 감퇴시키겠습니다
  alternatives_korean:
  - 너를 줄이겠습니다
  - 너를 쇠하게 하겠습니다
  - 너를 깎아내리겠습니다
  lexicon: HALOT
  rationale: 동사의 목적어가 생략된 간결한 심판 표현이라서, POB의 갱신된 이해처럼 대상인 ‘너’를 보충하되 문자적으로는 「감퇴시키다」로 렌더링하여 감소/축소의 힘을 살렸습니다.
- source_word: לֹא תָחוֹס עֵינִי / לֹא אֶחְמוֹל
  english_pob_choice: my eye will not spare / I also will show no pity
  chosen_korean: 내 눈이 아끼지 않을 것이며, 나도 불쌍히 여기지 않겠습니다
  alternatives_korean:
  - 내 눈이 측은히 여기지 않을 것이며, 나도 긍휼히 여기지 않겠습니다
  - 내가 눈을 거두지 않을 것이며, 나도 불쌍히 여기지 않겠습니다
  lexicon: HALOT
  rationale: ‘눈’의 관용적 이미지를 유지하면서도 한국어에서 자연스럽게 이해되도록 「아끼다」를 택했고, 뒤의 동사는 병렬을 살려 「불쌍히 여기다」로 옮겼습니다.
theological_decisions:
- issue: 아도나이 예후와(אֲדֹנָי יְהוִה)의 호칭 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 한국어 합쇼체 본문에서는 두 칭호가 겹치는 어색함을 피하면서도 주권과 언약 이름의 엄중함을 함께 살리는 「주 하나님」이 적절합니다.
  doctrine_reference: POB name policy for divine titles in compound forms
- issue: 하나님의 ‘눈’과 ‘불쌍히 여기지 않음’의 병렬
  chosen_reading: 감정의 변화가 아니라 확정된 심판 의지로 읽음
  alternative_readings:
  - 문학적 과장으로 완화함
  - ‘눈’은 단순 은유로 축소함
  rationale: 본문은 동정의 철회를 반복적으로 강조하므로, 이를 정서적 과장으로 누그러뜨리지 않고 심판의 불가역성을 드러내는 방향을 유지했습니다.
  doctrine_reference: Ezekiel judgment oracle context
