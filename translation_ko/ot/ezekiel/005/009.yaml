source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי בָ֗/ךְ אֵ֚ת אֲשֶׁ֣ר לֹֽא עָשִׂ֔יתִי וְ/אֵ֛ת אֲשֶֽׁר לֹֽא אֶעֱשֶׂ֥ה כָמֹ֖/הוּ ע֑וֹד יַ֖עַן כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
  footnotes:
  - marker: a
    text: Or, 'against you' or 'to you' for 'in you.' The Hebrew preposition is literally 'in,' but some translations render it more interpretively in this judgment context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 가운데에서[a] 내가 한 적이 없는 일을 하겠으며, 다시는 그와 같은 일을 하지 않겠습니다. 이는 네 모든 가증한 것들 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 문자적으로 ‘안에’를 뜻합니다. 심판 문맥에서는 ‘너에게’ 또는 ‘너를 향하여’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  english_pob_choice: And I will do
  chosen_korean: 내가 … 할 것이며
  alternatives_korean:
  - 내가 … 하겠습니다
  - 내가 … 행할 것이며
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 살리되, 심판 선언의 단호함을 자연스러운 한국어로 옮겼습니다.
- source_word: בָךְ
  english_pob_choice: in you
  chosen_korean: 너희 가운데에서
  alternatives_korean:
  - 너희 안에
  - 너희에게
  - 너희를 향하여
  lexicon: HALOT
  rationale: 직역의 '안에'를 유지하되 한국어에서는 공동체/도성 안에서 벌어지는 심판이라는 공간적 감각을 살리기 위해 '너희 가운데에서'로 옮겼습니다.
- source_word: לֹא עָשִׂיתִי ... לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  english_pob_choice: what I have not done ... I will never do again, and the like of which
  chosen_korean: 내가 하지 못한 일을 ... 다시는 같은 일을 하지 않겠습니다
  alternatives_korean:
  - 내가 한 적 없는 일을 ... 다시는 그와 같은 일을 하지 않겠습니다
  - 내가 하지 않은 일을 ... 다시는 그와 같은 일을 하지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 전례 없음과 재발 없음의 병행을 살리되, 한국어에서는 중복 없이 자연스럽게 '같은 일'로 압축했습니다.
- source_word: כָל תּוֹעֲבֹתָיִךְ
  english_pob_choice: all your abominations
  chosen_korean: 너희의 모든 가증한 일들
  alternatives_korean:
  - 너희의 모든 가증한 것들
  - 너희의 모든 혐오스러운 행위들
  lexicon: HALOT
  rationale: תועבה의 예언서적·신학적 강도를 살리기 위해 관용적이면서도 무게 있는 '가증한 일들'을 선택했습니다.
theological_decisions:
- issue: 심판의 전례 없음과 재발 없음의 표현
  chosen_reading: '''내가 하지 못한 일''과 ''다시는 같은 일을 하지 않겠습니다''로 두 겹의 절대성을 유지했습니다.'
  alternative_readings:
  - '''내가 한 적 없는 일''로만 처리'
  - '''다시는 그런 심판을 하지 않겠다''로 완화'
  rationale: 본문은 하나님의 심판이 유례없고 다시 없을 것임을 강조하므로, 이를 일반적인 '심각한 심판'으로 약화시키지 않았습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: בָךְ의 공간적-관계적 뉘앙스
  chosen_reading: '''너희 가운데에서''로 옮겨 심판이 도성 내부에서 실행되는 장면성을 살렸습니다.'
  alternative_readings:
  - '''너희에게'''
  - '''너희를 향하여'''
  rationale: 문자적 '안에'를 그대로 두기보다 한국어에서 자연스럽고도 원문 충실도가 높은 표현으로, 해석적 과잉 없이 공간성을 전달했습니다.
  doctrine_reference: 번역 원칙 §§1, 5
