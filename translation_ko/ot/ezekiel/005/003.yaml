lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: And you shall take
  chosen_korean: 데려다가
  alternatives_korean:
  - 취하십시오
  - 가지고 오십시오
  lexicon: HALOT
  rationale: 예언적 지시문의 연속 동작을 한국어 명령형으로 자연스럽게 옮기되, 뒤의 보존 행위와 연결되도록 ‘데려다가’로 처리했습니다.
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 거기에서
  lexicon: HALOT
  rationale: 앞 문맥에서 가리키는 곳을 한국어로 간결하게 살려 ‘거기서’로 옮겼습니다.
- source_word: מְעַט בְּמִסְפָּר
  english_pob_choice: a few in number
  chosen_korean: 수가 적은 몇 사람
  alternatives_korean:
  - 적은 수의 몇 사람
  - 몇 사람
  lexicon: HALOT
  rationale: ‘적음’과 ‘수’의 중복 강조를 살리기 위해 직역보다 다소 자연스러운 ‘수가 적은 몇 사람’을 선택했습니다.
- source_word: בִּכְנָפֶיךָ
  english_pob_choice: in the folds of your garment
  chosen_korean: 당신 옷자락의 가장자리에
  alternatives_korean:
  - 당신의 옷자락에
  - 당신 옷의 가장자리에
  - 당신 옷의 날개에
  lexicon: HALOT
  rationale: כָּנָף는 문자적으로 ‘날개’지만 의복의 끝자락/모서리를 뜻하므로, 오해를 피하면서도 원어의 외연을 살려 ‘옷자락의 가장자리’로 옮겼습니다.
