  rationale: 히브리어의 지시적 연속형은 한국어에서 명령형이 가장 직접적으로 대응합니다. 현대 합쇼체에 맞춰 예언 행위의 권위를 유지했습니다.
  doctrine_reference: 예언서의 명령형 담화
