id: EZK.5.10
reference: Ezekiel 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
  footnotes:
  - marker: a
    text: Or 'all your survivors' or 'all that remains of you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to every wind,' an idiom meaning total dispersal in all directions.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 아버지들이 네 한가운데서 아들들을 먹고[a], 아들들이 그들의 아버지들을 먹을 것입니다[b]. 그리고 내가 너에게 심판을 집행하고, 네 남은 자를 모든 바람으로 흩겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 생존자들’ 혹은 ‘네게 남은 것’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘모든 바람으로’라고 되어 있으며, 이는 사방으로 완전히 흩어짐을 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 따라서
  lexicon: HALOT
  rationale: 앞선 경고와 심판 선언에서 이어지는 결론 표지를 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְּתוֹכֵךְ / לְכָל רוּחַ
  english_pob_choice: in your midst / to every wind
  chosen_korean: 네 한가운데서 / 모든 바람으로
  alternatives_korean:
  - 네 가운데서 / 사방으로
  - 네 안에서 / 모든 방향으로
  lexicon: HALOT
  rationale: ‘한가운데서’는 העיר/공동체 내부를 가리키는 관용구를 살리고, ‘모든 바람으로’는 흩어짐의 방향 없는 전면성을 보존합니다.
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  english_pob_choice: and I will execute judgments on you
  chosen_korean: 그리고 내가 너에게 심판을 집행하고
  alternatives_korean:
  - 그리고 내가 너에게 심판을 행하고
  - 그리고 내가 너를 심판하고
  lexicon: HALOT
  rationale: עשה + שְׁפָטִים는 단순히 ‘벌하다’보다 법정적·사법적 행위를 포함하므로, ‘심판을 집행하다’로 옮겨 משפט의 공적 성격을 살렸습니다.
- source_word: כָּל שְׁאֵרִיתֵךְ
  english_pob_choice: all your remnant
  chosen_korean: 네 남은 자
  alternatives_korean:
  - 네 남은 무리
  - 네 생존자들
  lexicon: HALOT
  rationale: 문맥상 멸망 후 남아 있는 자들을 가리키며, ‘남은 자’는 ‘remnant’의 기본 의미를 유지하면서 한국어로 자연스럽습니다.
theological_decisions:
- issue: ‘남은 자’의 번역이 갖는 구원-회복 뉘앙스
  chosen_reading: 이 구절에서는 긍정적 회복의 ‘남은 자’보다, 심판 뒤에도 남아 흩어질 대상이라는 점을 드러내는 중립적 번역으로 유지했습니다.
  alternative_readings:
  - 남은 자들
  - 생존자들
  - 남은 것
  rationale: 히브리어 שְׁאֵרִית는 다른 본문에서 회복의 신학적 용어가 되지만, 여기서는 즉각적인 문맥이 파괴와 강제 분산이므로 구원적 함의를 덧씌우지 않았습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
