source:
  edition: WLC
  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
  footnotes:
  - marker: a
    text: Or 'I will be appeased' for 'I will be comforted'; the Hebrew verb can carry the sense of being consoled or finding relief after judgment is completed.
    reason: lexical_alternative
  - marker: b
    text: Or 'in my zeal' for 'in my jealousy.' The Hebrew term can denote either jealousy or zeal; here 'jealousy' preserves the covenantal relational force.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 분노가 다하고, 내가 그들에게 내 진노를 내리게 하며, 내가 위안을 얻을 것입니다.[a] 내가 그들에게 내 진노를 다 쏟을 때, 그들은 나 야훼가 내 질투로[b] 말하였음을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 달래질 것이다’로도 옮길 수 있습니다. 히브리어 동사는 심판이 끝난 뒤 위로를 얻거나 해소를 얻는다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 열심으로’로도 옮길 수 있습니다. 히브리어는 ‘질투’와 ‘열심’을 모두 뜻할 수 있으며, 여기서는 언약적 관계의 긴장을 살리기 위해 ‘질투’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  english_pob_choice: So my anger will be spent
  chosen_korean: 그러면 내 분노가 다하여지고
  alternatives_korean:
  - 내 화가 끝나고
  - 내 분노가 소진되고
  - 내 노여움이 다하고
  lexicon: HALOT
  rationale: אַף는 כאן 분노의 뜻이고, כָּלָה는 그 분노가 끝에 이르러 소진됨을 나타냅니다. '다하여지고'는 종결·소진의 뉘앙스를 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  english_pob_choice: I will cause my wrath to rest on them
  chosen_korean: 내가 그들에게 내 진노를 내려놓을 것이며
  alternatives_korean:
  - 내가 내 진노를 그들 위에 두을 것이며
  - 내가 내 진노를 그들 위에 쉬게 할 것이며
  - 내가 그들에게 내 분노를 머무르게 할 것이며
  lexicon: HALOT
  rationale: נוח의 사역형은 '쉬게 하다/내려놓다'의 뜻이 강하므로, 형벌적 이미지가 살아 있는 '내려놓을 것'으로 옮겼습니다. חָמָה는 כאן אַף와 구별되는 강한 진노로 보아 '진노'로 옮겼습니다.
- source_word: וְהִנֶּחָמְתִּי
  english_pob_choice: and I will be comforted
  chosen_korean: 내가 위로를 받을 것입니다
  alternatives_korean:
  - 내가 위로를 얻을 것입니다
  - 내가 만족할 것입니다
  - 내가 진정될 것입니다
  lexicon: HALOT
  rationale: נחם의 니팔은 여기서 '스스로 위로를 얻다/위로받다'의 의미가 자연스럽습니다. 심판 후 감정의 해소를 그대로 남기기 위해 완곡하게 바꾸지 않았습니다.
- source_word: בְּקִנְאָתִי
  english_pob_choice: in my jealousy
  chosen_korean: 내 질투 안에서
  alternatives_korean:
  - 내 질투 속에서
  - 내 열심 안에서
  - 내 열정 가운데
  lexicon: HALOT
  rationale: קִנְאָה는 언약적 관계에서 '질투'와 '열심'을 모두 가질 수 있지만, 본문은 야훼의 언약적 배타성을 드러내므로 '질투'를 택했습니다. 전치사 בְּ는 여기서 상태/영역의 뜻을 살려 '안에서'로 처리했습니다.
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  english_pob_choice: when I spend my wrath against them
  chosen_korean: 내가 그들에게 내 진노를 다 쏟을 때
  alternatives_korean:
  - 내가 그들 மீது 내 진노를 다할 때
  - 내가 그들에게 내 진노를 끝낼 때
  - 내가 그들에게 내 진노를 완전히 거둘 때
  lexicon: HALOT
  rationale: כּלה는 앞의 '다하여지고'와 대응되며, 동작의 완료 시점을 나타냅니다. '다 쏟을 때'는 심판의 완결성과 대상 지향성을 함께 살립니다.
theological_decisions:
- issue: 야훼의 정서적·인격적 언어를 어떻게 처리할 것인가
  chosen_reading: '''분노'', ''진노'', ''질투'', ''위로를 받을 것입니다''를 그대로 살려, 심판의 언어를 완화하지 않았습니다.'
  alternative_readings:
  - '''의분'' 또는 ''심판이 집행됩니다''처럼 비인격적 표현으로 완화하기'
  - '''질투''를 ''열심''으로 바꾸기'
  rationale: 히브리어 본문은 언약 심판을 설명할 때 감정적 언어를 의도적으로 사용합니다. 이 긴장을 보존해야 본문의 예언적 강도가 살아납니다.
  doctrine_reference: 번역 원칙 §3, §6
