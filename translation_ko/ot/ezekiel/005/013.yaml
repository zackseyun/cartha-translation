  to: 내 분노가 다하고, 내가 그들에게 내 진노를 내리게 하며, 내가 위안을 얻을 것입니다.[a] 내가 그들에게 내 진노를 다 쏟을 때, 그들은 나 야훼가 내 질투로[b] 말하였음을 알게 될 것입니다.
