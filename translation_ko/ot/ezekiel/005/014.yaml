  rationale: 이 절은 도시를 인격화하여 심판을 선언하는 예언 수사이므로, 원문의 직접성과 긴박감을 보존하는 편이 더 충실합니다.
  doctrine_reference: Original-language primacy; do not paraphrase beyond the source text.
