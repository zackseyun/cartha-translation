  - marker: b
    text: ‘치욕거리’는 ‘수치거리’ 또는 ‘조롱거리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  english_pob_choice: And I will make you
  chosen_korean: 내가 너를 … 되게 하겠다
  alternatives_korean:
  - 내가 너를 …로 만들겠다
  - 내가 너를 …로 두겠다
  lexicon: HALOT
  rationale: נתן은 כאן 보어와 함께 ‘~이 되게 하다’라는 사역적 의미로 쓰였으므로, 한국어에서도 결과 상태를 자연스럽게 드러내는 표현이 가장 가깝습니다.
- source_word: לְחָרְבָּה
  english_pob_choice: a ruin
  chosen_korean: 폐허
  alternatives_korean:
  - 황폐
  - 파괴된 곳
  lexicon: HALOT
  rationale: חָרְבָּה는 파괴되어 사람이 살 수 없는 황폐한 상태를 가리키므로, 도시 맥락에서 ‘폐허’가 간결하고 구체적입니다.
- source_word: וּלְחֶרְפָּה
  english_pob_choice: and a reproach
  chosen_korean: 치욕
  alternatives_korean:
  - 수치
  - 모욕
  - 조롱거리
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 감정적 수치보다 공개적 수치와 멸시를 포함하므로, 예언적 심판의 강도를 살리는 ‘치욕’이 적절합니다.
- source_word: בַּגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  english_pob_choice: among the nations that are around you
  chosen_korean: 주변의 나라들 가운데서
  alternatives_korean:
  - 너를 둘러싼 나라들 가운데서
  - 주위의 민족들 가운데서
  lexicon: HALOT
  rationale: 가깝게 둘러싼 열방을 가리키는 말이므로, 지리적 근접성을 드러내는 ‘주변의 나라들’이 자연스럽습니다.
- source_word: לְעֵינֵי כָּל עוֹבֵר
  english_pob_choice: in the sight of everyone who passes by
  chosen_korean: 지나가는 모든 사람의 눈앞에 있게 하겠다
  alternatives_korean:
  - 지나가는 모든 사람의 보기에
  - 모든 지나가는 사람 앞에
  lexicon: HALOT
  rationale: ‘눈앞에’는 לְעֵינֵי의 공개적·가시적 성격을 살리면서도 한국어로 자연스럽고, ‘지나가는 모든 사람’은 כָּל עוֹבֵר의 분배적 의미를 드러냅니다.
theological_decisions:
- issue: 예루살렘에 대한 여성 단수 호칭의 유지
  chosen_reading: 주어를 명시적으로 ‘예루살렘’으로 바꾸지 않고, 암시된 2인칭 여성 단수의 대상에게 직접 말하는 형태를 유지했습니다.
  alternative_readings:
