source:
  edition: WLC
  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
  footnotes:
  - marker: a
    text: Or 'when the days of the siege have been fulfilled.'
    reason: lexical_alternative
  - marker: b
    text: Or 'scatter to the winds'; Hebrew has singular 'wind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will unsheathe a sword after them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 몫은 성읍 한가운데서 불로 태우십시오[a]. 포위의 날들이 끝날 때 그렇게 하십시오. 또 한 몫은 가져다가 성읍 사방에서 칼로 치고, 또 한 몫은 바람에 흩으십시오[b]. 그리고 나는 그들 뒤를 따라 칼을 빼겠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포위의 날들이 다 차면’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바람들에’로 옮길 수 있습니다. 히브리어는 단수 ‘바람’을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘칼을 뽑아 그들 뒤를 따르겠습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  english_pob_choice: a third
  chosen_korean: 한 몫
  alternatives_korean:
  - 삼분의 일
  - 한 부분
  lexicon: HALOT
  rationale: 여기서는 머리카락을 셋으로 나눈 한 부분을 가리키므로, 현대 한국어에서 자연스럽고 본문의 반복적 삼분 구조를 살리는 표현으로 ‘한 몫’을 택했습니다.
- source_word: בָּאוּר תַּבְעִיר
  english_pob_choice: you shall burn in the fire
  chosen_korean: 불로 태우십시오
  alternatives_korean:
  - 불 가운데 태우십시오
  - 불에 태우십시오
  lexicon: HALOT
  rationale: בָּאור는 수단/장소를 함께 띠지만, 동사 תַּבְעִיר와 함께 실제 소각 행위를 분명히 하므로 ‘불로 태우십시오’가 간결하면서도 원문의 화상을 살립니다.
- source_word: בְּתוֹךְ הָעִיר
  english_pob_choice: in the midst of the city
  chosen_korean: 성읍 한가운데서
  alternatives_korean:
  - 성읍 안에서
  - 성읍 중앙에서
  lexicon: HALOT
  rationale: ‘한가운데서’는 도시 중심부라는 생생한 공간 이미지를 살려, 단순한 위치 정보보다 신탁의 상징성을 더 잘 드러냅니다.
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  english_pob_choice: and I will draw out a sword after them
  chosen_korean: 그리고 나는 그들 뒤를 따라 칼을 빼겠습니다
  alternatives_korean:
  - 그리고 나는 그들 뒤로 칼을 뽑겠습니다
  - 그리고 나는 그들을 뒤쫓아 칼을 뽑겠습니다
  lexicon: HALOT
  rationale: אָרִיק의 ‘빼다/뽑다’ 이미지를 한국어 동사 ‘칼을 빼다’로 옮겨, 후속 추격과 심판의 위협을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 절에서 화자가 명령하는 예언자에서 직접 심판하시는 하나님으로 전환됩니다.
  chosen_reading: ‘그리고 나는 그들 뒤를 따라 칼을 빼겠습니다’로 1인칭 신적 발화를 유지했습니다.
  alternative_readings:
  - 주어를 생략해 일반적 심판 진술로 완화함
  - ‘칼이 그들 뒤를 따르겠습니다’처럼 비인격화함
  rationale: 히브리어 אָרִיק는 1인칭 단수이므로, 이 전환은 상징 행위의 뜻이 인간 전쟁이 아니라 야훼의 직접적 심판임을 드러냅니다.
  doctrine_reference: 신적 주권과 심판의 직접성
