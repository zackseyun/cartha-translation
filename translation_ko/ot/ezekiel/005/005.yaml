id: EZK.5.5
reference: Ezekiel 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord YHWH'' (traditionally represented in English as ''the Lord GOD'' to avoid ''Lord LORD'').'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다.[a] 「이것이 예루살렘이다. 내가 그를 민족들 한가운데 두었고, 그 둘레에 여러 땅을 두었다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아도나이 야훼’이다.
    reason: אֲדֹנָי יְהוָה의 복합 호칭과 야훼라는 신명 표기를 명시한다.
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 선포 공식의 형식을 살리되, 한국어에서는 '이렇게 말씀하십니다'가 자연스럽고 장중합니다.
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님께서
  lexicon: HALOT
  rationale: 합쇼체 예언 서두에서 직접 호칭을 매끄럽게 살리기 위해 '주 하나님'으로 옮겼습니다. '주 야훼'는 본문식이지만, 여기서는 복합 호칭의 엄숙함과 가독성을 우선했습니다.
- source_word: בְּתוֹךְ הַגּוֹיִם
  english_pob_choice: in the midst of the nations
  chosen_korean: 민족들 한가운데
  alternatives_korean:
  - 나라들 한가운데
  - 민족들 가운데
  lexicon: HALOT
  rationale: גוים는 문맥상 주변의 여러 민족/나라들을 가리키므로 '민족들'이 가장 무난하며, '한가운데'가 중심 배치를 분명히 드러냅니다.
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  english_pob_choice: with lands around her
  chosen_korean: 그 둘레에는 땅들이 둘러싸고 있습니다
  alternatives_korean:
  - 주변에는 땅들이 있습니다
  - 그 주위에 여러 나라가 있습니다
  lexicon: HALOT
  rationale: 직역적으로는 '주변의 땅들'이지만, 한국어에서는 관계절 없이 '둘레에는 땅들이 둘러싸고 있습니다'가 이미지와 평행성을 더 잘 살립니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 여기서는 본문 호칭을 '주 하나님'으로 옮기고, 본문 내부에서는 야훼를 따로 표기하지 않았습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님(각주로 야훼 표기)
  rationale: 이 절은 '주'와 신명 결합의 예언 공식으로 기능하므로, 한국어에서는 자연스러운 직접 화법을 우선해 번역했습니다. 다만 프로젝트 기본어인 야훼를 본문에 노출할지 여부는 다른 구절과의 일관성 차원에서 별도 검토 여지가 있습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH rendering policy'
- issue: 예언 발화의 인용부호 안 어조
  chosen_reading: 하나님께 대한 직접 호칭은 서술 외곽의 합쇼체를 유지하고, 인용 안에서도 선언문 어조를 유지했습니다.
  alternative_readings:
  - 인용부 안에서 더 구어적으로 조정
  - 더 전통적인 경어 표현 사용
  rationale: 히브리어 예언문은 선언적이고 공적이므로, 한국어에서도 공적 선포의 톤을 유지하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: POB Korean style guidance
