  to: 사람의 아들아, 너를 위해 날카로운 칼을 가져라.[a] 그것을 이발사의 면도칼로 삼아 네 머리와 네 수염 위로 지나가게 하라. 그런 다음 저울을 가져다가 깎은 털을 나누어라.
