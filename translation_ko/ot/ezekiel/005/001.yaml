    issue: ‘네게로 가져가서’
    rationale: לְךָ는 여기서 이동의 목적지를 뜻하는 ‘네게로’가 아니라 수익·관심의 여격(‘너를 위해/네가 쓸’)입니다.
  - severity: medium
    issue: ‘그 머리털을 나누어라’
    rationale: 히브리어 복수 접미사는 면도하여 나온 털들을 가리키며, 앞 절에는 머리와 수염이 모두 언급됩니다. ‘머리털’만으로 한정하면 수염 관련 털을 배제하는 인상을 줍니다.
  - severity: low
    issue: 각주 위치와 설명
    rationale: 현 각주는 문장 끝에 붙어 있으나 앞부분의 반복 동사를 설명합니다. 해당 첫 번째 ‘가져라’에 붙이고, 반복되는 두 번째 לקח도 설명하도록 조정하는 편이 명료합니다.
