id: EZK.5.1
reference: Ezekiel 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
  footnotes:
  - marker: a
    text: Literally, 'take it for yourself'; the Hebrew repeats 'take' where English more naturally says 'use it.'
    reason: lexical_alternative
  - marker: b
    text: Or 'balances.' The Hebrew refers to scales used for weighing portions.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 아들아, 너를 위해 날카로운 칼을 가져라.[a] 그것을 이발사의 면도칼로 삼아 네 머리와 네 수염 위로 지나가게 하라. 그런 다음 저울을 가져다가 깎은 털을 나누어라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너를 위해 취하라’라는 표현을 사용하며, 이어서 그 칼을 다시 ‘취하라’고 반복합니다.
    reason: source_note
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람의 아들
  alternatives_korean:
  - 인자
  - 인간
  lexicon: HALOT
  rationale: 에스겔의 반복되는 예언자 호칭을 살리기 위해 직역적 표현을 유지했습니다. 여기서는 문맥상 관용구의 친숙함보다 히브리어 형식을 드러내는 것이 우선입니다.
- source_word: חֶרֶב חַדָּה
  english_pob_choice: a sharp sword
  chosen_korean: 날카로운 칼
  alternatives_korean:
  - 날선 칼
  - 예리한 칼
  lexicon: HALOT
  rationale: חֶרֶב의 기본 의미는 칼/검이지만, 한국어에서는 현대적 가독성을 위해 ‘칼’을 택했습니다. חַדָּה의 의미는 ‘날카로운’으로 자연스럽게 살렸습니다.
- source_word: תַּעַר הַגַּלָּבִים
  english_pob_choice: a barber’s razor
  chosen_korean: 이발사의 면도칼
  alternatives_korean:
  - 이발사의 면도날
  - 이발용 면도칼
  lexicon: HALOT
  rationale: 히브리어의 비유적 목적을 자연스럽게 전달하기 위해 기능을 드러내는 표현으로 옮겼습니다. ‘면도칼’은 털을 깎는 도구라는 점을 분명히 합니다.
- source_word: תִּקָּחֶנָּה לָּךְ
  english_pob_choice: take it for yourself / use it
  chosen_korean: 네게로 가져가서 그것을 삼아
  alternatives_korean:
  - 네 자신을 위해 그것을 취하여
  - 그것을 가져다가
  lexicon: HALOT
  rationale: 반복된 לקח는 단순 소유보다 ‘손에 들고 그 용도로 사용함’의 뉘앙스를 가지므로, 기능을 드러내는 ‘삼아’로 처리했습니다. English audit trail이 지적한 반복 동사를 완전히 지우지 않도록 ‘가져가서’도 함께 반영했습니다.
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  english_pob_choice: and pass it over your head and over your beard
  chosen_korean: 네 머리와 네 수염 위를 지나게 하라
  alternatives_korean:
  - 네 머리와 네 수염 위로 지나가게 하라
  - 네 머리와 네 수염 위를 가로질러라
  lexicon: HALOT
  rationale: 면도 행위를 직접 설명하기보다 히브리어의 ‘지나가게 하다’ 구조를 살려 표현했습니다. Korean 문장에서는 반복된 ‘위에/위로’보다 ‘위를 지나게 하라’가 더 자연스럽습니다.
- source_word: מֹאזְנֵי מִשְׁקָל
  english_pob_choice: scales for weighing
  chosen_korean: 저울
  alternatives_korean:
  - 저울판
  - 무게를 다는 저울
  lexicon: HALOT
  rationale: 표현 자체는 ‘무게를 재는 저울/저울’의 뜻이므로 간결하게 ‘저울’로 옮겼습니다. 본문에서 도구의 용도는 이미 이어지는 행위로 충분히 분명합니다.
- source_word: וְחִלַּקְתָּם
  english_pob_choice: divide the hair
  chosen_korean: 그 머리털을 나누어라
  alternatives_korean:
  - 그것들을 나누어라
  - 머리털을 분배하라
  lexicon: HALOT
  rationale: 히브리어의 목적어는 앞선 면도 행위로 생긴 머리털을 가리키므로, 의미를 분명히 하되 과도한 해석은 피했습니다. ‘나누다’는 분할·배분의 기본 의미를 유지합니다.
theological_decisions:
- issue: 예언자 호칭 בֶן אָדָם의 한국어 처리
  chosen_reading: ‘사람의 아들’로 유지해 에스겔의 정형적 호칭과 문학적 반복을 보존했습니다.
  alternative_readings:
  - ‘인자’
  - ‘인간아’
  rationale: 본문은 친숙한 기독교 용어보다 히브리어의 반복적 호칭 자체를 드러내는 것이 중요합니다. ‘사람의 아들’은 어색함이 조금 있어도 원문의 형식을 가장 투명하게 보여 줍니다.
  doctrine_reference: 예언서 문체와 호칭 보존
- issue: 면도/삭발 이미지의 직설성
  chosen_reading: 행위의 충격성을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘정리하다’
  - ‘다듬다’
  rationale: 본문은 심판의 표징 행위로서 머리와 수염을 자르는 장면을 의도적으로 강하게 제시합니다. 완곡어로 바꾸면 상징의 강도가 약해집니다.
  doctrine_reference: 예언적 상징행위의 직접성
