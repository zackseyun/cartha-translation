  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
  footnotes:
  - marker: a
    text: Or 'a warning' could be rendered 'instruction,' 'discipline,' or 'correction'; here it refers to Jerusalem becoming an object lesson to the surrounding nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'a horror' may also be understood as 'an object of horror,' 'desolation,' or 'astonishment.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'with rebukes of wrath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 수치와 조롱거리가 되고, 주위의 나라들에게 경고와 공포가 될 것이다. 내가 진노와 분노와 분노의 책망으로 너에게 심판을 집행할 때에 그러할 것이다. 나 야훼가 말하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경고’는 여기서 단순한 교육이 아니라, 예루살렘이 주변 민족들에게 본보기로 작용하는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공포’는 ‘황폐’보다도 이 구절의 맥락에서 열방이 느끼는 충격과 두려움을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘분노의 책망’은 히브리어 ‘분노의 책망들’을 한국어에서 자연스럽게 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: you shall become
  chosen_korean: 너는 …가 될 것이다
  alternatives_korean:
